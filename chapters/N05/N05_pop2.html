<template data-pop="n05-exp-9" data-title="9. Explorations : une question pour chaque examen"><p>La biopsie est encadrée par le néphrologue ; son intérêt diagnostique, pronostique et thérapeutique se confronte au risque. En cas de suspicion de glomérulonéphrite rapidement progressive, bilan immunologique et démarche tissulaire sont urgents. La prise en charge des complications avance en parallèle. Les délais d’arrêt d’un anticoagulant ou antiagrégant sont ceux du centre et de la situation, sans automatisme dérivé du code N05.</p><p>Les microscopies optique, immunofluorescente et électronique répondent à des questions distinctes. Un pattern membranoprolifératif oriente une recherche d’infection, auto-immunité, immunoglobuline monoclonale ou complément selon le profil. Un complément normal ne ferme pas toutes les causes ; une valeur basse ne donne pas une étiologie unique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-9" data-title="Raisonnement essentiel — 9. Explorations : une question pour chaque examen"><p>Chaque examen répond à une question ; tissu et immunologie sont urgents si progression rapide suspectée.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n05-exp-10" data-title="10. Arbre diagnostique : avancer malgré l’information manquante"><p>Une hypoperfusion ou une obstruction peut expliquer une part de la baisse de fonction, même si une hématurie est présente. Une leucocyturie n’établit pas seule une infection, et un cylindre leucocytaire ne nomme pas une glomérulonéphrite. Diabète ou hypertension connus n’expliquent pas automatiquement un sédiment actif, un purpura ou une dégradation atypique.</p><p>La discordance est utile : un résultat qui ne correspond pas à l’hypothèse initiale impose de rouvrir les possibilités plutôt que de conserver N05 comme explication définitive. Une infection active et une maladie immune peuvent exiger des stratégies très différentes.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-10" data-title="Raisonnement essentiel — 10. Arbre diagnostique : avancer malgré l’information manquante"><p>La discordance entre hypothèse et données impose de rouvrir le diagnostic.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="n05-exp-11" data-title="11. Prise en charge : traiter le risque actuel et préciser la cause"><p><b>Urgence.</b> Une suspicion de syndrome pulmonaire–rénal, une baisse rapide de fonction ou une complication menaçante relève d’une prise en charge hospitalière spécialisée. Rechercher et traiter hyperkaliémie, acidose, surcharge et trouble hémodynamique selon protocoles adaptés. L’épuration extrarénale est urgente si les troubles hydriques, électrolytiques ou acido-basiques menacent la vie ; le contexte et la tendance comptent davantage qu’un seuil isolé de créatinine.</p><p><b>Volume et pression.</b> La stratégie dépend de l’état réel : une personne déplétée et une personne congestive ne reçoivent pas le même traitement. Le furosémide peut traiter une surcharge dans son cadre d’indication ; il ne répare pas le filtre ni ne remplace une suppléance nécessaire. Les doses IV de Lasix proviennent de la FI de l’ampoule, distincte de celle du comprimé. Le traitement d’une urgence hypertensive ne se déduit pas du schéma oral d’amlodipine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">Information professionnelle suisse viaAmiKo : Ramipril Zentiva, décembre 2021 — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680529040720" rel="noopener" target="_blank">FI suisseCosaar, avril 2025 — Indications,posologie,organes,contre-indications,interactions,grossesse</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI suisseForxiga,août 2026 — Indication MRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680500440174" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Norvasc, avril 2023 — Indications, posologie, contre-indications, précautions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></template>
<template data-pop="pareto-n05-11" data-title="Raisonnement essentiel — 11. Prise en charge : traiter le risque actuel et préciser la cause"><p>Traiter les complications puis choisir traitement de cause et éventuelle néphroprotection selon preuves et FI.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a>.</p></template>
<template data-pop="n05-exp-12" data-title="12. Prévention, suivi et pronostic : ne pas perdre un patient encore non classé"><p>Le premier suivi doit répondre aux incertitudes qui ont motivé le libellé : retrouver les données, vérifier l’évolution fonctionnelle et urinaire, obtenir les examens en attente et préciser le diagnostic. L’intervalle dépend de la gravité et de la vitesse, non du seul mot « sans précision ». Oligurie, dyspnée, hémoptysie, signes neurologiques ou aggravation clinique imposent un contact anticipé.</p><p>Le pronostic dépend de la cause, de l’activité, des cicatrices, de la fonction, des protéines et de la réponse. Un champ histologique ou un résultat ponctuel ne donne pas une trajectoire individuelle certaine. Après une atteinte aiguë, rechercher récupération et séquelles ; si des anomalies persistent au moins trois mois, vérifier les critères et le classement de MRC. L’amélioration de la diurèse n’établit pas seule la guérison.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-12" data-title="Raisonnement essentiel — 12. Prévention, suivi et pronostic : ne pas perdre un patient encore non classé"><p>Le suivi réduit les incertitudes, vérifie la récupération et recherche des séquelles sans perdre le patient.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a>.</p></template>
<template data-pop="n05-exp-13" data-title="13. Points clés pour l’examen fédéral"><p>Présenter une synthèse en quatre phrases : syndrome observé ; gravité et trajectoire ; hypothèses causales ; plan immédiat et suivi. Dire ce qui manque permet une décision transparente. Il faut savoir expliquer pourquoi le bilan doit être urgent ou pourquoi un contrôle ambulatoire organisé est possible dans la situation donnée.</p><p>Dans PROFILES 2017, l’hématurie se relie à SSP64 ; les tâches 159,161,164 et 173 concernent notamment tissu/génétique, fonction rénale, sédiment et protéinurie. Les directives MEBEKO 2026 articulent connaissances et compétences cliniques. Les cas et quiz ci-dessous sont des exercices originaux MEDINA, sans statut de questions officielles.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29,32 :SSP64,159,161,164,173</a> ; <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/fL9EvX0YPT2d/20260204_Exigences%20MED%202026_f.pdf" rel="noopener" target="_blank">MEBEKO,3mars 2026 — Introduction et§2.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-13" data-title="Raisonnement essentiel — 13. Points clés pour l’examen fédéral"><p>Une synthèse clinique donne syndrome, gravité, hypothèses et plan ; exercices MEDINA nonofficiels.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CIMS, PROFILES 2017 — pp.29,32 :SSP64,159,161,164,173</a>.</p></template>
<template data-pop="n05-exp-14" data-title="14. Pièges : ce que le libellé ne permet pas de conclure"><p></p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a> ; <a data-reference-source="1" href="https://kdigo.org/guidelines/acute-kidney-injury/" rel="noopener" target="_blank">KDIGO, page officielle consultée 2novembre 2026 — Guideline Update et Guideline Suite</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></template>
<template data-pop="pareto-n05-14" data-title="Raisonnement essentiel — 14. Pièges : ce que le libellé ne permet pas de conclure"><p>Le degré de précision du libellé ne mesure pas la gravité et ne prescrit pas de traitement universel.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a>.</p></template>
<template data-pop="n05-calcul-ratio" data-title="Rapport urinaire : le litre s’annule, pas l’analyte"><p>Données fictives du même prélèvement : albumine 60 mg/L, créatinine 1 g/L. Le rapport albumine/créatinine est 60 ÷ 1 = 60 mg/g. Les litres s’annulent. Il s’agit d’albuminurie A2 selon les bornes du référentiel ; il ne s’agit pas d’une excrétion de 60 g/j.</p><p>Si les protéines totales sont à 1,2 g/L avec la même créatinine, le rapport protéines/créatinine est 1,2 g/g. Les deux résultats ne sont pas interchangeables : le premier quantifie l’albumine, le second toutes les protéines mesurées.</p><p>Le calcul ne prouve pas la chronicité. Vérifier conditions, répétition, contexte et évolution. Un seuil de traitement donné en protéines totales ne se lit pas avec un rapport d’albumine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n05-calcul-variation" data-title="Variation relative : préciser le sens, la base et le délai"><p>Débit fictif passant de 68à 51 mL/min/1,73 m² : baisse absolue 68−51 = 17 ; baisse relative 17 ÷ 68 × 100 = 25 %. Elle dépasse le repère de 20 % qui appelle une évaluation selon KDIGO. Cela ne suffit pas à établir une progression irréversible.</p><p>Créatinine fictive passant de 100à 140 µmol/L après modification d’un IEC : hausse relative(140−100) ÷ 100 × 100 = 40 %. Si elle survient dans les quatre semaines, elle dépasse le repère de 30 % discuté pour la sécurité de l’IEC/ARA. Il faut chercher état volémique, médicaments, potassium et autres causes selon la clinique.</p><p>Ces exemples sont indépendants. Une hausse de créatinine de 30 % n’est pas mathématiquement la même chose qu’une baisse de débit de 30 %. Ne pas interchanger les deux seuils ni ignorer une aggravation clinique qui reste sous une borne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a>.</p></template>
<template data-pop="n05-cas-1" data-title="Cas 1 — Information manquante, urgence présente"><p><b>Exercice fictif original.</b></p><p>Une personne sans résultat antérieur présente une hématurie, une créatinine élevée, une oligurie et une dyspnée. La durée est inconnue ; l’absence de preuve de chronicité ne rassure pas. Évaluer immédiatement volume, respiration, pression, potassium/ECG et équilibre acido-basique, puis organiser les soins hospitaliers selon gravité.</p><p>Retrouver les valeurs antérieures et préciser la cause en parallèle. Attendre trois mois pour nommer la MRC exposerait à retarder le traitement d’une complication actuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a>.</p></template>
<template data-pop="n05-cas-2" data-title="Cas 2 — Une urine rouge ne donne pas le compartiment"><p><b>Exercice fictif original.</b></p><p>La bandelette est positive pour le sang. La microscopie, le recueil et le contexte sont nécessaires avant d’affirmer une hématurie glomérulaire. Acanthocytes ou cylindres hématiques soutiennent la localisation ; un résultat négatif ne suffit pas à l’exclure.</p><p>Quantifier albumine et protéines, apprécier fonction et retentissement, rechercher des alternatives selon les symptômes. Une hématurie ne remplace pas le bilan d’une obstruction ni d’un risque urologique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">CUEN,12e édition 2025 — pp.118–123, texte hors arbre p 122 mal extrait</a>.</p></template>
<template data-pop="n05-cas-3" data-title="Cas 3 — Le croissant ne nomme pas toute la maladie"><p><b>Exercice fictif original.</b></p><p>Une biopsie décrit une prolifération extracapillaire. Des mécanismes pauci-immuns, immuns ou anti-membrane basale peuvent produire ce type de lésion. Optique, immunofluorescence, immunologie et clinique se confrontent ; la coloration PAS seule ne montre pas un dépôt linéaireIgG.</p><p>La trajectoire fonctionnelle et le retentissement déterminent aussi l’urgence. Le seul mot N05 ou une image ne justifie pas le même protocole immunosuppresseur pour tous.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a>.</p></template>
<template data-pop="n05-cas-4" data-title="Cas 4 — Distinguer dose, voie et indication"><p><b>Exercice fictif original.</b></p><p>Un œdème pulmonaire aigu ne se traite pas en recopiant un schéma d’entretien de Lasix 40 mg oral. La FI de l’ampoule 20 mg, mars 2025, donne un schéma IV spécifique et une vitesse maximale d’injection ; les autres mesures et l’éventuelle épuration se discutent en urgence.</p><p>Une augmentation des urines n’établit pas la récupération rénale. Surveiller retentissement, électrolytes et fonction ; respecter contre-indications et risque de déplétion.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306300177" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo — FI mars 2025 : indications,posologie,administration, CI,précautions,interactions,grossesse/allaitement ; relues</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680306290010" rel="noopener" target="_blank">Information professionnelle suisse, Swissmedic/AIPS via AmiKo ; Lasix 40 mg,mai 2025 — Posologie, contre-indications et précautions</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></template>
