<template data-pop="n05-exp-1" data-title="1. Définition : un cadre à préciser"><p>Un syndrome glomérulaire est évoqué devant une protéinurie glomérulaire et/ou une hématurie, auxquelles peuvent s’associer hypertension, œdèmes et insuffisance rénale. La présentation néphritique fait rechercher particulièrement hématurie, baisse de filtration et rétention hydrosodée. Leur combinaison et leur vitesse d’apparition orientent la gravité et la cause ; tous les signes ne sont pas nécessairement présents au même moment.</p><p><b>« Sans précision » décrit une information insuffisante.</b> Il ne désigne pas une étiologie autonome et n’établit pas que la maladie soit bénigne. Une même première observation peut correspondre à une atteinte aiguë, une maladie ancienne découverte tardivement ou une aggravation sur maladie chronique. Le diagnostic doit progresser dès que la chronologie, le bilan ou le tissu le permettent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n05-1" data-title="Raisonnement essentiel — 1. Définition : un cadre à préciser"><p>Le syndrome observé, la cause et la temporalité se prouvent séparément ; N05 n’est pas toute créatinine élevée.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a>.</p></template>
<template data-pop="n05-exp-2" data-title="2. Épidémiologie : ne pas donner une fréquence à une information manquante"><p>Les sources retenues ne donnent pas d’incidence suisse directe du syndrome néphritique sans précision N05. Ce libellé dépend aussi du degré de précision des dossiers et du codage ; une fréquence de codes ne serait pas nécessairement celle d’une maladie biologique unique. Aucun chiffre de dialyse, d’insuffisance rénale aiguë ou de biopsie ne lui est substitué.</p><p>La SGN estime qu’environ un adulte sur dix en Suisse présente une maladie rénale chronique. Il s’agit d’un contexte de dépistage, non d’une estimation de N05. De même, une série européenne de biopsies sélectionne les personnes pour lesquelles un prélèvement a été réalisé : elle ne représente pas toutes les hématuries de la population.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">OFS, CIM-10-GM2024FR — XML officiel, classe N05 et modificateur S14N00_4 relus pour N05</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n05-2" data-title="Raisonnement essentiel — 2. Épidémiologie : ne pas donner une fréquence à une information manquante"><p>Aucun taux direct N05 retenu ; les chiffres MRC/IRA ne mesurent pas ce cadre sans précision.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a>.</p></template>
<template data-pop="n05-exp-3" data-title="3. Physiopathologie : un même signe, plusieurs mécanismes"><p>Le filtre normal associe endothélium, membrane basale et podocytes. Une lésion peut augmenter le passage d’albumine et d’érythrocytes vers l’urine. La morphologie des hématies et les cylindres apportent des indices de localisation ; ils n’identifient pas à eux seuls le mécanisme immunitaire ou la maladie causale.</p><p>Planche normale, non image de patient ; elle ne montre ni dépôts immuns ni lésion inflammatoire. Les repères HTML n’altèrent pas les pixels.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">OpenStax, Anatomy andPhysiology 2e — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-3" data-title="Raisonnement essentiel — 3. Physiopathologie : un même signe, plusieurs mécanismes"><p>Perméabilité, filtration, rétention et lésions expliquent des signes complémentaires ; une image ne nomme pas toute la cause.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="n05-exp-4" data-title="4. Démarche clinique : sécuriser, dater, localiser, expliquer"><p><b>Sécuriser.</b> Apprécier respiration, circulation, état neurologique, pression, volume et diurèse. Chercher potassium et troubles acido-basiques selon le contexte, avec ECG lorsqu’une insuffisance rénale aiguë est suspectée. Une complication menaçante appelle des soins hospitaliers et un avis spécialisé immédiat, sans attendre la cause finale.</p><p><b>Dater.</b> Retrouver les créatininémies, urines et pressions antérieures, les hospitalisations, les médicaments et les événements intercurrents. L’absence de résultat ancien n’est pas une preuve de début récent. Inversement, une maladie ancienne peut subir une aggravation aiguë. Les critères de maladie rénale chronique exigent au moins trois mois ; ce délai de définition n’est jamais un délai d’attente imposé aux soins.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 maladiesglomérulaires, principeschapitre 1 — §1.1–1.3 pp.S30–33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2021/10/KDIGO-2021-Glomerular-Diseases-Guideline_English.pdf" rel="noopener" target="_blank">KDIGO 2021 chapitre 8 — p.S187 ;§8.1</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-4" data-title="Raisonnement essentiel — 4. Démarche clinique : sécuriser, dater, localiser, expliquer"><p>Sécuriser, dater, localiser et expliquer ; les investigations ne retardent pas les soins d’une complication.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="n05-exp-5" data-title="5. Anamnèse : retrouver la chronologie et les indices de cause"><p>Un dossier incomplet appelle une recherche active des anciens résultats avec le patient et les soignants concernés. Une mention « normal » sans date, analyte ou unité ne suffit pas. Les traitements effectivement pris peuvent différer de la dernière ordonnance ; cette différence peut expliquer une partie de l’évolution.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a>.</p></template>
<template data-pop="pareto-n05-5" data-title="Raisonnement essentiel — 5. Anamnèse : retrouver la chronologie et les indices de cause"><p>Résultats datés, médicaments réels, famille, infection et signes systémiques orientent l’enquête.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a>.</p></template>
<template data-pop="n05-exp-6" data-title="6. Examen clinique : identifier le retentissement actuel"><p>Mesurer pression, fréquence cardiaque, poids et état d’hydratation, puis rechercher œdèmes et signes de congestion. Une dyspnée nécessite une appréciation respiratoire et une recherche de surcharge ou d’atteinte pulmonaire systémique. Une pression élevée se juge avec ses conséquences neurologiques, cardiaques et rénales ; la prise en charge d’une urgence ne se confond pas avec une cible de traitement prolongé.</p><p>Rechercher les indices guidés par l’anamnèse : purpura, atteinte articulaire, foyer infectieux, signes ORL, manifestations oculaires ou auditives, anomalies des voies urinaires. Un tableau pulmonaire–rénal possible exige une évaluation urgente. L’absence d’un signe extrarénal ne suffit pas à exclure une glomérulopathie.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, Seeger/Cippà/deSeigneux,17mars 2025 — p.1, définition et figures 1–2</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 3 et note tensionnelle</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" rel="noopener" target="_blank">SGN-SSN, version 17mars 2025 — p.2, figure 4 orientation</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="pareto-n05-6" data-title="Raisonnement essentiel — 6. Examen clinique : identifier le retentissement actuel"><p>Volume, pression, respiration et tolérance sont évalués avant de choisir une stratégie.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a>.</p></template>
<template data-pop="n05-exp-7" data-title="7. Syndromes et classifications : séparer les axes"><p>N05 ne constitue pas un stade entre aigu et chronique. Il faut continuer à préciser le tableau à partir des preuves disponibles. Le suffixe morphologique ne résume ni le retentissement ni la vitesse d’évolution.</p><p>Si une MRC est établie, les catégories de débit sont G1 ≥ 90, G2 60–89, G3a 45–59, G3b 30–44, G4 15–29 et G5 &lt; 15 mL/min/1,73 m². L’albuminurie A1 &lt; 30, A2 30–300, A3 &gt; 300 mg/g constitue un autre axe. Ces catégories ne servent pas à classer une valeur instable comme si l’équation donnait alors une mesure fiable de filtration.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC, adopté comme socle par SGN 2025 — tables 1–3 p.S137 ; §1.1 p.S149 ; §1.2/1.3</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §2.1–2.2 pp.S155–156</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §3.3–3.7 pp.S157–159 ; RAS§3.6</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §4.1–4.3 pp.S163–165</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" rel="noopener" target="_blank">KDIGO 2024 MRC — §5.3–5.5 pp.S166–168, table 41</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.172–175 ; biopsie, glomérule normal et lésions</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></template>
<template data-pop="pareto-n05-7" data-title="Raisonnement essentiel — 7. Syndromes et classifications : séparer les axes"><p>Aigu, rapidement progressif, chronique, IRA, MRC et morphologie décrivent des axes différents.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap10-nephropathies-glomerulaires.pdf" rel="noopener" target="_blank">CUEN, 12e édition, 2025 — pp.169–172, tableau 1 et causes</a>.</p></template>
<template data-pop="n05-exp-8" data-title="8. Diagnostic positif : rendre les preuves et les incertitudes explicites"><p><b>Confirmer le signe.</b> Une bandelette positive pour le sang n’établit pas seule une hématurie ; vérifier la présence d’érythrocytes. Quantifier protéines et albumine dans les unités du laboratoire. Une dysmorphie supérieure à 60 %, des acanthocytes supérieurs à 5 % ou des cylindres hématiques orientent une origine glomérulaire selon HUG 2024 ; sensibilité, recueil et lecture en limitent l’interprétation. Leur absence n’exclut pas une maladie glomérulaire.</p><p><b>Décrire la fonction avec le temps.</b> Dans la dernière directive AKI adoptée trouvée, reprise par le CUEN 2025, l’IRA correspond à une hausse de créatinine ≥ 26,5 µmol/L en 48 h, ou ≥ 1,5 fois la valeur de base connue ou présumée en 7 jours, ou une diurèse &lt; 0,5 mL/kg/h pendant 6 h. Un de ces critères suffit. Ils ne diagnostiquent pas une glomérulonéphrite. Une dégradation plus lente peut rester grave sans remplir cette fenêtre.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie microhématurie 2024 — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">HUG, stratégie 2024 — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">ERKNet/ERA/ESPN, guideline 2024, publication 2025 — Introduction, Q1–2, Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">KDIGO, consensus international 2025 — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap14-insuffisance-renale-aigue-anurie.pdf" rel="noopener" target="_blank">CUEN 12e 2025, IRA–Anurie — pp.253–256,264–265,269–270</a> ; <a data-reference-source="1" href="https://kdigo.org/guidelines/acute-kidney-injury/" rel="noopener" target="_blank">KDIGO, page officielle consultée 2novembre 2026 — Guideline Update et Guideline Suite</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></template>
<template data-pop="pareto-n05-8" data-title="Raisonnement essentiel — 8. Diagnostic positif : rendre les preuves et les incertitudes explicites"><p>Confirmer les signes, décrire la fonction dans le temps, chercher cause et documenter les incertitudes.</p><p>Revenir aux critères, à la méthode et aux limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2019/01/KDIGO-2012-AKI-Guideline-English.pdf" rel="noopener" target="_blank">KDIGO 2012 AKI, dernière version adoptée trouvée ; CUEN 2025 la reprend — §2.1.1–2.1.2 et 5.1.1–5.1.2</a>.</p></template>
