<template data-pop="i80-virchow" data-title="Triade de Virchow"><p>Stase veineuse, lésion de la paroi, hypercoagulabilité (Rudolf Virchow, 1856). Presque toutes les thromboses associent au moins deux éléments ; l’identification des facteurs guide la durée du traitement et la prévention.</p>
<div class="lab">Stase</div><p>L’alitement, la position assise prolongée, un plâtre ou une paralysie suppriment la pompe du mollet. Pendant la grossesse, le flux veineux des membres inférieurs diminue jusqu’à 50 % vers 29 semaines.</p>
<div class="lab">Paroi</div><p>Une chirurgie, un traumatisme ou un cathéter lèsent l’endothélium et exposent le facteur tissulaire, qui déclenche la coagulation. Le cathéter ajoute ses mouvements dans la veine et l’obstacle qu’il oppose au flux.</p>
<div class="lab">Hypercoagulabilité</div><p>Les cellules tumorales libèrent du facteur tissulaire, des microparticules procoagulantes et des cytokines, et activent plaquettes, monocytes et neutrophiles. Par voie orale, l’œstrogène atteint le foie à forte concentration, modifie la synthèse des protéines de la coagulation et induit une résistance acquise à la protéine C activée ; dans le traitement de la ménopause, la voie transdermique, qui évite ce premier passage, semble moins augmenter le risque, sans preuve définitive. Le mécanisme moléculaire exact reste incertain. La grossesse augmente le facteur VIII et le fibrinogène, abaisse la protéine S et freine la fibrinolyse.</p>
<div class="lab">Ce qui change la décision</div><p>Un facteur transitoire identifié autorise un traitement court ; un facteur persistant, comme un cancer actif, impose de poursuivre tant qu’il agit.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.1.3, 3.3 et 4.2.1, tableau 5 ; <a href="https://pubmed.ncbi.nlm.nih.gov/28917273/" target="_blank" rel="noopener">Falanga et al.</a>, <i>Critical Reviews in Oncology/Hematology</i> 2017 ; <a href="https://pubmed.ncbi.nlm.nih.gov/41048432/" target="_blank" rel="noopener">Stanczyk et al.</a>, <i>Frontiers in Endocrinology</i> 2025.</p>
</template>
<template data-pop="i80-coag" data-title="Coagulation en bref"><p>Facteur tissulaire + VIIa → Xa → thrombine → fibrine. Inhibiteurs : antithrombine, protéines C et S. Fibrinolyse → D-dimères. Les anticoagulants ciblent Xa (anti-Xa directs, héparines via l’antithrombine) ou IIa (dabigatran), ou la synthèse des facteurs (antivitamines K).</p></template>
<template data-pop="i80-ep" data-title="Embolie pulmonaire"><p>Complication de la thrombose veineuse ; traitée dans le chapitre « I26 — Embolie pulmonaire » du système Poumon (stratification par le score PESI, troponine, dysfonction du ventricule droit ; thrombolyse si choc). Même anticoagulation que la thrombose profonde.</p>
<div class="lab">Mécanisme</div><p>La pression artérielle pulmonaire monte quand plus de 30 à 50 % du lit artériel est occlus ; la libération de thromboxane A<sub>2</sub> et de sérotonine ajoute une vasoconstriction. Le ventricule droit, à paroi mince, ne peut pas générer une pression moyenne supérieure à 40 mmHg : il se dilate, sa contraction se prolonge et le septum bombe vers la gauche, ce qui gêne le remplissage du ventricule gauche et fait chuter le débit cardiaque. Cette défaillance droite est la principale cause de décès.</p>
<div class="lab">Ce qui change la décision</div><p>La stratification mesure donc cette défaillance : l’état hémodynamique en montre la conséquence, l’imagerie du ventricule droit la dilatation et la troponine la souffrance du myocarde. Devant une suspicion d’embolie, une thrombose proximale trouvée à l’échographie suffit à justifier l’anticoagulation sans autre imagerie, mais la stratification de gravité reste nécessaire. À l’inverse, l’<a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">ESVS 2021</a> ne recommande pas de rechercher une embolie silencieuse chez un patient sans symptôme respiratoire.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1093/eurheartj/ehz405" target="_blank" rel="noopener">Recommandations ESC 2019 sur l’embolie pulmonaire</a>, sections 3.3 et 4.10 ; <a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">recommandations ESVS 2021 sur les thromboses veineuses</a>, section 2.2.3, recommandation 7.</p>
</template>
<template data-pop="i80-wells" data-title="Score de Wells de la thrombose veineuse profonde"><p>+1 : cancer actif ; paralysie ou plâtre récent d’un membre inférieur ; alitement ≥ 3 jours ou chirurgie majeure dans les 12 semaines ; douleur sur le trajet veineux profond ; œdème de toute la jambe ; circonférence du mollet &gt; 3 cm par rapport à l’autre ; œdème prenant le godet du côté symptomatique ; veines superficielles collatérales non variqueuses ; antécédent de thrombose documentée. −2 : autre diagnostic au moins aussi probable. <b>≤ 1 : peu probable ; ≥ 2 : probable.</b></p>
<div class="lab">Logique des items</div><p>Construit empiriquement, le score se lit pourtant par mécanismes. Le cancer actif représente l’hypercoagulabilité ; la paralysie, le plâtre, l’alitement et la chirurgie récente, la stase et la lésion pariétale ; l’œdème, la différence de circonférence et les veines collatérales, l’obstacle au retour veineux ; l’antécédent de thrombose, une veine déjà lésée et une prédisposition persistante. Le retrait de 2 points pour un autre diagnostic au moins aussi probable reconnaît que ces signes ne sont pas spécifiques.</p>
<div class="lab">Valeur et limites</div><p>Le score classe le patient avant tout examen mais ne suffit jamais seul : dans le groupe « peu probable », jusqu’à 5 % des patients ont pourtant une thrombose. Il ne vaut qu’associé aux D-dimères ou à l’échographie. Pendant la grossesse, où l’œdème est banal, l’ESVS 2021 déconseille son usage.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, section 2.2.1.1 et tableau 3, section 4.2.2 et recommandation 60.</p>
</template>
<template data-pop="i80-tih" data-title="Thrombopénie induite par l’héparine"><p>Anticorps IgG contre le complexe facteur plaquettaire 4 – héparine, qui activent les plaquettes : thrombopénie et <b>thromboses</b> (veineuses et artérielles). Score 4T (thrombopénie, délai 5–10 jours, thrombose, autre cause) ; anticorps anti-PF4 et test fonctionnel. Arrêt de toute héparine ; anticoagulant non héparinique ; ne pas débuter l’antivitamine K pendant la phase aiguë.</p>
<div class="lab">Mécanisme</div><p>L’héparine, très chargée négativement, se fixe au facteur plaquettaire 4 libéré par les plaquettes. Certains patients fabriquent des IgG contre ce complexe ; fixés aux plaquettes, ces anticorps les activent, ce qui libère davantage de facteur plaquettaire 4 et entretient le cercle. Les plaquettes sont consommées, mais l’état est thrombotique : la thrombose domine malgré la thrombopénie.</p>
<div class="lab">Délai et fréquence</div><p>La production des anticorps demande quelques jours : le score 4T retient la fenêtre du 5e au 10e jour, et l’information suisse de l’énoxaparine situe la chute en général entre le 5e et le 21e jour. Elle peut être immédiate si le patient a reçu de l’héparine dans les 30 jours précédents, car les anticorps circulent déjà. Le risque est environ 10 fois plus élevé avec l’héparine non fractionnée qu’avec l’héparine de bas poids moléculaire : 1 à 5 % après chirurgie sous héparine non fractionnée, 1 à 3 % en chirurgie cardiaque, environ 0,6 % chez les patients médicaux sous héparine de bas poids moléculaire, moins de 0,1 % en obstétrique. Le fondaparinux ne semble pas la provoquer.</p>
<div class="lab">Ce qui change la décision</div><p>Un score 4T faible (1 à 3 points) exclut le diagnostic (valeur prédictive négative 99,8 %) et dispense des tests. Un score intermédiaire ou élevé impose de remplacer immédiatement l’héparine par un anticoagulant non héparinique et de rechercher les anticorps anti-PF4, confirmés si besoin par un test fonctionnel ; la valeur prédictive positive du score n’est que de 14 % s’il est intermédiaire et de 64 % s’il est élevé. L’antivitamine K attend la fin de la phase aiguë, car il abaisse la protéine C avant les facteurs procoagulants et aggrave l’hypercoagulabilité ; de plus, l’argatroban élève lui-même l’INR, ce qui complique le relais.</p>
<div class="lab">Anticoagulants utilisables en Suisse</div><p>L’argatroban (Argatra®) est autorisé chez l’adulte atteint d’une thrombopénie induite de type II ; il se donne en perfusion continue, d’abord à 2 µg/kg/min, à 0,5 µg/kg/min en cas d’insuffisance hépatique modérée, après chirurgie cardiaque ou chez le patient en état critique, sous contrôle du temps de céphaline activée. Sa demi-vie courte (40 à 50 minutes) le rend utilisable dans l’insuffisance rénale. Le danaparoïde (Orgaran®) est autorisé pour prévenir et traiter les thromboses de ces patients ; il est éliminé par le rein. Le fondaparinux ne donne pas de réaction croisée <i>in vitro</i> avec le sérum de ces patients, et l’ESVS 2021 mentionne un relais par fondaparinux vers l’antivitamine K après la phase aiguë ; son information professionnelle suisse demande pourtant de ne pas l’utiliser dans cette situation, faute d’études. En Suisse, ce relais reste donc un usage hors indication, décidé avec l’hématologue.</p>
<div class="lab">Source complémentaire</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.3.4.3 et 2.3.4.3.1, tableau 11 ; informations professionnelles suisses Clexane®, Argatra®, Orgaran® et Arixtra®, Swissmedic (AIPS), consultées le 08.10.2026.</p>
</template>
<template data-pop="pareto-i80-diag" data-title="Pareto — Notions et diagnostic"><p class="ratio" data-cover="i80-0,i80-1,i80-2,i80-3,i80-4,i80-5,i80-6"></p><ul>
<li>Thrombose profonde + embolie = maladie thromboembolique ; proximale (poplitée et au-dessus) toujours traitée ; distale : traiter ou surveiller.</li>
<li>Provoquée (majeure, mineure, persistante) ou non provoquée : décide de la durée, car la récidive après l’arrêt dépend de la persistance de la cause.</li>
<li>Virchow ; thrombus rouge né dans les poches valvulaires ; syndrome post-thrombotique par destruction valvulaire.</li>
<li>Risques : chirurgie, hospitalisation, cancer, œstrogènes, grossesse et post-partum, voyage, thrombophilies, antipsychotiques et contention.</li>
<li>Clinique peu fiable ; différence de mollet &gt; 3 cm ; Homans abandonné ; différentiels : kyste de Baker, hématome, érysipèle.</li>
<li>Wells → D-dimères si faible (seuil âge × 10 après 50 ans) ; échographie si élevé ou D-dimères positifs.</li></ul></template>
<template data-pop="pareto-i80-tt" data-title="Pareto — Traitement"><p class="ratio" data-cover="i80-7,i80-8"></p><ul>
<li>Urgences : embolie, phlegmatia cerulea dolens, thrombopénie induite par l’héparine (argatroban ou danaparoïde en Suisse).</li>
<li>Anticoagulant oral direct en première intention (apixaban, rivaroxaban d’emblée) ; ambulatoire, mobilisation précoce.</li>
<li>Grossesse : héparine de bas poids moléculaire ; antiphospholipides : antivitamine K ; cancer : anticoagulant oral direct ou héparine.</li>
<li>Contraception combinée : relais sans œstrogène en place avant l’arrêt de l’anticoagulant ; filtre cave seulement si anticoagulation impossible, car il prévient l’embolie sans traiter la thrombose et augmente ses récidives ; compression précoce pour les symptômes et le syndrome post-thrombotique.</li></ul></template>
<template data-pop="pareto-i80-crit" data-title="Pareto — Durée, localisations et critères"><p class="ratio" data-cover="i80-9,i80-10,i80-11,i80-12"></p><ul>
<li>3 mois si facteur transitoire majeur ; non provoquée : prolonger si risque hémorragique faible (dose réduite après 6 mois) ; cancer ≥ 6 mois.</li>
<li>Thrombophilie : pas après une première thrombose de cause connue (Smarter Medicine 2024) ; cancer : recherche limitée, pas de scanner systématique.</li><li>Facteur hormonal : 3 mois sans prolongation (guide suisse 2024) ; distale profonde : 3 mois ; musculaire : 1 à 4 semaines ou surveillance.</li>
<li>Superficielle ≥ 5 cm : fondaparinux 2,5 mg 30 à 45 jours ; &lt; 3 cm de la jonction : comme une profonde.</li>
<li>Porte : cirrhose, myéloprolifératif (JAK2) ; Budd-Chiari ; membre supérieur sur cathéter ; May-Thurner.</li>
<li>Prophylaxie (Padoue ≥ 4) ; diagnostic = veine incompressible.</li></ul></template>
<template data-pop="pareto-i80-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i80-e-1,i80-e-2,i80-e-3"></p><ul>
<li>Échographie de compression : une veine incompressible signe la thrombose ; une échographie limitée normale se complète après 4 à 7 jours, sauf si l’échographie complète est faite d’emblée.</li>
<li>D-dimères : sensibles, peu spécifiques ; 500 µg/L ou âge × 10 ; faux négatifs sous anticoagulant.</li>
<li>Plaquettes sous héparine ; clairance pour les anticoagulants oraux directs ; anti-Xa des héparines seulement dans des situations choisies (insuffisance rénale, poids extrêmes) ; JAK2 dans les thromboses splanchniques.</li></ul></template>
<template data-pop="pareto-i80-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i80-p-1,i80-p-2"></p><ul>
<li>Apixaban 10 mg × 2 (7 j) puis 5 mg × 2 ; rivaroxaban 15 mg × 2 (21 j) puis 20 mg ; édoxaban et dabigatran après 5 jours d’héparine.</li>
<li>Énoxaparine 1 mg/kg × 2 ; antivitamine K : chevauchement ≥ 5 jours, INR 2–3.</li>
<li>Anticoagulants oraux directs exclus : grossesse et allaitement, antiphospholipides (surtout triple positif), valves artificielles, clairance &lt; 30 mL/min pour le dabigatran ; anti-Xa oraux non recommandés sous 15 mL/min.</li>
<li>Interactions : inducteurs (carbamazépine, millepertuis), ISRS et anti-inflammatoires ; antidotes : idarucizumab, andexanet (apixaban, rivaroxaban), concentré de complexe prothrombinique, vitamine K, protamine.</li></ul></template>
<template data-pop="i80-antidotes" data-title="Antidotes des anticoagulants : comment chacun agit"><div class="lab">Principe</div><p>Les anticoagulants oraux directs ont une demi-vie courte : devant un saignement qui ne menace pas la vie, l’arrêt, les mesures locales et la correction de la volémie suffisent souvent. L’antidote se réserve à l’hémorragie menaçant la vie ou à la chirurgie urgente.</p>
<div class="lab">Idarucizumab</div><p>Ce fragment d’anticorps monoclonal humanisé fixe le dabigatran avec une très forte affinité et l’empêche d’atteindre la thrombine. Deux injections de 2,5 g neutralisent rapidement l’effet : chez plus de 500 patients, la réversion médiane a été complète et le saignement s’est arrêté en 2,5 heures en médiane.</p>
<div class="lab">Andexanet alfa</div><p>Ce facteur Xa recombinant modifié, privé d’activité procoagulante, sert de leurre : il capte l’apixaban et le rivaroxaban à la place du vrai facteur Xa. En Suisse, il est autorisé pour ces deux seules molécules, devant une hémorragie incontrôlée ou menaçant la vie : bolus de 400 mg puis perfusion de 4 mg/min pendant 120 minutes, ou bolus de 800 mg puis 8 mg/min, selon la molécule, la dernière dose et son délai. Après le bolus, l’activité anti-Xa a baissé de 92 % ; elle remonte en partie après la perfusion de 2 heures. Dans l’étude de référence, l’hémostase a été bonne ou excellente chez 82 % des patients, mais 10 % ont fait une thrombose dans les 30 jours.</p>
<div class="lab">Concentré de complexe prothrombinique et vitamine K</div><p>Le concentré à quatre facteurs apporte les facteurs II, VII, IX et X que l’antivitamine K a rendus inactifs, et corrige l’INR sans attendre. La vitamine K relance leur synthèse fonctionnelle, mais l’INR met jusqu’à 24 heures ou davantage à se normaliser : dans une hémorragie majeure, les deux s’associent. Selon les informations suisses, le concentré se dose selon l’INR initial (25 UI/kg de facteur IX pour un INR de 2 à 3,9, 35 UI/kg de 4 à 6, 50 UI/kg au-delà de 6, sans dépasser 5 000 UI par dose), et la vitamine K se donne par voie intraveineuse à 5 à 10 mg sous phenprocoumone et à 5 mg sous acénocoumarol. Face à un anti-Xa oral, l’ESVS 2021 propose le concentré à 50 UI/kg comme alternative quand l’andexanet manque, usage hors indication en Suisse.</p>
<div class="lab">Protamine</div><p>Fortement chargée positivement, la protamine se lie aux chaînes négatives de l’héparine. Elle neutralise l’héparine non fractionnée : selon l’information suisse, 10 mg de sulfate de protamine neutralisent environ 1 400 UI d’héparine, dose réduite si plus de 15 minutes se sont écoulées depuis l’injection intraveineuse, sans dépasser 50 mg par bolus. Elle ne neutralise qu’incomplètement les héparines de bas poids moléculaire (10 mg pour 1 000 UI anti-Xa) : l’activité anti-Xa de l’énoxaparine est neutralisée au maximum à environ 60 %, même avec une dose supérieure. Une activité anticoagulante résiduelle persiste donc ; elle n’agit pas sur le fondaparinux.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, section 2.3.4.2, tableaux 9 et 10 ; informations professionnelles suisses Praxbind®, Ondexxya™, Beriplex® P/N, Konakion®, sulfate de protamine Leo Pharma et Clexane®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="i80-ddimeres" data-title="D-dimères : ce que le dosage exclut et ce qu’il n’exclut pas"><div class="lab">Physiologie normale</div><p>Le facteur treize activé relie entre eux les domaines D de molécules de fibrine voisines. Seule la plasmine qui dégrade cette fibrine stabilisée libère des fragments portant deux domaines D liés : les D-dimères attestent donc qu’un caillot s’est formé puis a commencé à se dissoudre.</p>
<div class="lab">Pourquoi un résultat négatif exclut</div><p>Une thrombose récente s’accompagne d’une fibrinolyse active : le dosage quantitatif est positif dans environ 95 % des cas. Sa valeur dépend pourtant de la probabilité avant le test. Avec une spécificité de 45 %, un résultat négatif laisse un risque résiduel d’environ 0,6 % quand 5 % des patients ont une thrombose, mais d’environ 4,5 % quand 30 % en ont une. Le premier risque est acceptable, le second ne l’est pas : le dosage n’exclut la thrombose que chez le patient peu probable au <button class="w" data-k="i80-wells">score de Wells</button>.</p>
<div class="lab">Pourquoi le seuil s’ajuste à l’âge</div><p>Les D-dimères s’élèvent avec l’âge sans thrombose ; au-delà de 80 ans, la spécificité du seuil de 500 µg/L tombe à 10 %. Le seuil « âge × 10 » après 50 ans corrige cette dérive. Dans l’étude <a href="https://pubmed.ncbi.nlm.nih.gov/24643601/" target="_blank" rel="noopener">ADJUST-PE</a>, menée dans la suspicion d’embolie pulmonaire, il a porté de 6,4 % à 29,7 % la part des patients de 75 ans ou plus exclus sans imagerie ; parmi les patients dont le résultat se situait entre 500 µg/L et leur seuil ajusté, un seul sur 331 a fait un événement à 3 mois.</p>
<div class="lab">Situations où le dosage sert peu</div><p>Quand le contexte produit lui-même de la fibrine (cancer, hospitalisation, infection, grossesse), il faut doser les D-dimères chez 10 patients ou plus pour exclure une seule embolie pulmonaire, contre 3 aux urgences en général. Pour une suspicion de thrombose profonde pendant la grossesse, l’ESVS 2021 privilégie l’imagerie et déconseille le dosage de routine. La suspicion d’embolie pulmonaire suit un algorithme distinct : l’étude prospective de <a href="https://pubmed.ncbi.nlm.nih.gov/30893534/" target="_blank" rel="noopener">van der Pol et al.</a> (2019) a validé l’emploi des D-dimères avec des critères cliniques adaptés à la grossesse. Un résultat isolé n’exclut pas l’embolie ; il doit être interprété dans ce protocole.</p>
<div class="lab">Ce qui change la décision</div><p>Un score peu probable associé à un dosage négatif dispense d’échographie et d’anticoagulation : dans l’étude Palladio, cette stratégie n’a laissé que moins de 0,3 % d’événements thromboemboliques à 3 mois.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.2.1.2, 2.2.1.3 et 4.2.2, recommandation 60 ; <a href="https://doi.org/10.1093/eurheartj/ehz405" target="_blank" rel="noopener">recommandations ESC 2019 sur l’embolie pulmonaire</a>, sections 4.4 et 4.4.1 ; <a href="https://pubmed.ncbi.nlm.nih.gov/24643601/" target="_blank" rel="noopener">Righini et al.</a>, <i>JAMA</i> 2014.</p></template>
<template data-pop="i80-doses" data-title="Doses des anticoagulants : raison de chaque palier"><div class="lab">Phase initiale renforcée</div><p>L’apixaban (10 mg deux fois par jour pendant 7 jours) et le rivaroxaban (15 mg deux fois par jour pendant 21 jours) commencent à dose plus forte pendant la période où l’extension et l’embolie sont les plus fréquentes, ce qui remplace l’héparine initiale. Le dabigatran et l’édoxaban ont été étudiés après au moins 5 jours d’héparine : sans cette phase parentérale, leur efficacité initiale n’est pas démontrée.</p>
<div class="lab">Rivaroxaban et repas</div><p>À jeun, la biodisponibilité du comprimé de 20 mg n’est que de 66 % ; avec un repas, la résorption est complète. Les doses de 15 et 20 mg se prennent donc pendant un repas, alors que la dose de 10 mg s’absorbe à 80 à 100 % dans les deux cas (information suisse Xarelto®).</p>
<div class="lab">Ajustements</div><p>L’édoxaban passe à 30 mg si la clairance est de 15 à 50 mL/min, si le poids est de 60 kg ou moins, ou avec la ciclosporine, la dronédarone, l’érythromycine, le kétoconazole, la quinidine ou le vérapamil, car chacune de ces situations augmente son exposition. L’information suisse du dabigatran impose 110 mg deux fois par jour dès 80 ans et en cas de clairance de 30 à 50 mL/min, y compris avec l’amiodarone ou le vérapamil ; elle l’envisage chez le patient à risque hémorragique élevé, demande une surveillance plus fréquente de la clairance entre 75 et 80 ans et fait prendre le dabigatran au moins 2 heures avant l’amiodarone ou le vérapamil. Dans la thrombose, l’apixaban ne se réduit pas selon la fonction rénale, contrairement à la fibrillation auriculaire ; il s’utilise avec prudence entre 15 et 29 mL/min.</p>
<div class="lab">Cancer</div><p>La daltéparine se donne à 200 UI/kg par jour le premier mois, puis environ 150 UI/kg du 2e au 6e mois, sans dépasser 18 000 UI par jour (information suisse). Ce schéma est celui de l’essai de <a href="https://pubmed.ncbi.nlm.nih.gov/12853587/" target="_blank" rel="noopener">Lee et al.</a> (2003), où il a réduit la récidive à 6 mois de 17 % à 9 % par rapport à un antivitamine K, sans plus d’hémorragies majeures.</p>
<div class="lab">Antivitamine K</div><p>L’INR s’allonge d’abord par la baisse du facteur VII, alors que l’effet antithrombotique attend celle de la prothrombine, plus lente : l’héparine est donc maintenue au moins 5 jours et jusqu’à un INR supérieur à 2 sur deux jours consécutifs.</p>
<div class="lab">Prolongation</div><p>Après 6 mois, la <button class="w" data-k="i80-duree">dose réduite</button> d’apixaban ou de rivaroxaban peut être envisagée chez des patients sélectionnés, selon les risques de récidive et de saignement. Dans le cancer actif, l’essai de <a href="https://pubmed.ncbi.nlm.nih.gov/40162636/" target="_blank" rel="noopener">Mahé et al.</a> (New England Journal of Medicine, 2025) étaye la réduction de l’apixaban ; le rivaroxaban n’y était pas étudié, si bien que sa réduction reste sans preuve dans cette population.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.3.1 à 2.3.3 et 2.3.7.3.2, tableau 8 ; informations professionnelles suisses Xarelto®, Lixiana®, Pradaxa®, Eliquis® et Fragmin®, Swissmedic (AIPS), consultées le 08.10.2026 ; <a href="https://pubmed.ncbi.nlm.nih.gov/12853587/" target="_blank" rel="noopener">Lee et al.</a>, <i>New England Journal of Medicine</i> 2003 ; <a href="https://pubmed.ncbi.nlm.nih.gov/22315269/" target="_blank" rel="noopener">Ageno et al.</a>, <i>Chest</i> 2012.</p></template>
<template data-pop="i80-duree" data-title="Durée de l’anticoagulation : récidive contre hémorragie"><div class="lab">Principe</div><p>Prolonger l’anticoagulation n’est utile que si les récidives évitées dépassent les hémorragies provoquées. Un consensus d’experts jugeait le traitement prolongé justifié au-delà d’une récidive de 5 % par an ou de 15 % à 5 ans ; avec les anticoagulants oraux directs, moins hémorragiques, l’ESVS 2021 abaisse ce seuil à 3 % par an. Les hémorragies sont plus fréquentes pendant les 3 premiers mois, puis diminuent.</p>
<div class="lab">Ce que prédit la cause</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehz405" target="_blank" rel="noopener">ESC 2019</a> classe le risque de récidive après l’arrêt selon le facteur déclenchant. Il est faible, sous 3 % par an, après un facteur transitoire majeur comme une chirurgie. Il est intermédiaire, de 3 à 8 % par an, après un facteur transitoire mineur, avec un facteur persistant non cancéreux ou sans facteur identifié. Il est élevé, au-delà de 8 % par an, en cas de cancer actif, de syndrome des antiphospholipides ou d’épisode antérieur sans facteur majeur. L’ESVS 2021 classe autrement les œstrogènes, la grossesse et le post-partum : facteurs majeurs, ils placent la thrombose dans le groupe à faible risque une fois l’exposition terminée. Après une première thrombose non provoquée, 4 % des récidives sont mortelles.</p>
<div class="lab">Pourquoi pas une durée fixe plus longue</div><p>Moins de 3 mois de traitement augmente les récidives (rapport de risque 2,89 pour 1 à 1,5 mois). Au-delà, allonger une durée fixe ne fait que reporter les récidives : après 3 ou 12 mois d’antivitamine K, le taux de récidive est le même une fois le traitement arrêté. Le choix se fait donc entre un arrêt à 3 mois et un traitement prolongé sans date d’arrêt, réévalué chaque année.</p>
<div class="lab">Dose réduite après 6 mois</div><p>Quand le traitement est prolongé, l’apixaban 2,5 mg deux fois par jour a ramené la récidive de 8,8 % sous placebo à 1,7 % en un an, avec 0,2 % d’hémorragies majeures ; le rivaroxaban 10 mg par jour l’a ramenée à 1,2 %, contre 4,4 % sous aspirine. La réduction ne s’applique pas automatiquement aux patients à très haut risque : la molécule, l’indication et le risque hémorragique comptent. Le cancer actif n’impose toutefois plus toujours la pleine dose : dans l’essai de Mahé et al. publié en 2025, après au moins 6 mois d’anticoagulation pour thrombose proximale ou embolie chez des patients atteints de cancer actif, l’apixaban 2,5 mg deux fois par jour n’a pas été inférieur à 5 mg deux fois par jour pour les récidives et a réduit les saignements cliniquement pertinents. Cette donnée ne s’extrapole pas aux autres molécules ni à tous les profils de cancer.</p>
<div class="lab">Ce qui change la décision</div><p>Les scores hémorragiques prédisent mal le saignement individuel ; les facteurs qu’ils recensent, comme l’âge, une hémorragie antérieure, un cancer, une insuffisance rénale ou hépatique et un antiagrégant associé, orientent pourtant la décision.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.3.4.1 et 2.3.6 à 2.3.7.5, tableaux 13 et 15 ; <a href="https://doi.org/10.1093/eurheartj/ehz405" target="_blank" rel="noopener">recommandations ESC 2019 sur l’embolie pulmonaire</a>, tableau 11 ; <a href="https://pubmed.ncbi.nlm.nih.gov/31340984/" target="_blank" rel="noopener">Khan et al.</a>, <i>British Medical Journal</i> 2019.</p></template>
<template data-pop="i80-phlegmatia" data-title="Phlegmatia cerulea dolens : quand la thrombose menace la jambe"><div class="lab">Physiologie normale</div><p>Le sang artériel ne traverse la jambe que si la pression veineuse reste nettement inférieure à la pression artérielle. Les veines profondes, les veines superficielles et leurs collatérales offrent plusieurs voies de sortie ; l’occlusion de l’une est compensée par les autres.</p>
<div class="lab">Mécanisme</div><p>La phlegmatia alba dolens correspond à la thrombose ilio-fémorale habituelle : jambe blanche, gonflée, encore drainée par des collatérales. Dans la phlegmatia cerulea dolens, le thrombus occlut en quelques heures la veine fémorale commune, l’iliaque externe, puis les veines superficielles et les collatérales. Le sang ne sort plus : la pression veineuse et celle des loges musculaires montent jusqu’à réduire l’entrée du sang artériel. Le membre devient cyanosé et ischémique, et le liquide séquestré dans la jambe peut entraîner une tachycardie et un choc.</p>
<div class="lab">Conséquence clinique</div><p>La douleur ischémique est brutale, la jambe perd sa fonction, et une embolie pulmonaire massive, un syndrome des loges ou une gangrène veineuse peuvent suivre. Sous anticoagulation seule, des séries rapportent jusqu’à 50 % d’amputations et 40 % de décès.</p>
<div class="lab">Ce qui change la décision</div><p>L’héparine adaptée au poids, non fractionnée ou de bas poids moléculaire, débute immédiatement, avec une surélévation franche du membre et un remplissage vasculaire. Un scanner ou une IRM peuvent compléter l’échographie mais ne doivent pas retarder le traitement. D’après des séries de cas, la thrombolyse dirigée par cathéter et la thrombectomie pharmacomécanique ou chirurgicale, précédée si besoin d’une aponévrotomie, réduisent les amputations et la mortalité : l’avis vasculaire est donc urgent. Un cancer ou un autre état d’hypercoagulabilité, souvent en cause, est ensuite recherché.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.1.3 et 2.10.</p></template>
<template data-pop="i80-signes" data-title="Signes de thrombose veineuse profonde : d’où vient chacun"><div class="lab">Physiologie normale</div><p>Dans un capillaire, la pression hydrostatique pousse le liquide vers le tissu et la pression oncotique des protéines le retient ; le petit excès filtré revient par les lymphatiques. Cet équilibre suppose que le sang veineux quitte librement la jambe.</p>
<div class="lab">Mécanisme</div><p>Le thrombus augmente la résistance à l’écoulement veineux. La pression monte dans les veines et les capillaires en amont, la filtration dépasse le drainage lymphatique et un œdème apparaît, limité au membre atteint et prenant le godet. Son étendue situe l’obstacle : le mollet pour une thrombose distale, toute la jambe depuis l’aine pour une thrombose ilio-fémorale, car le bassin offre peu de voies collatérales. Les veines superficielles se dilatent parce qu’elles deviennent la voie de dérivation du sang. La douleur, la sensibilité le long de la veine, la chaleur et la fébricule traduisent l’inflammation de la paroi et des tissus autour du thrombus. Une thrombose iliaque peut commencer par une douleur lombaire.</p>
<div class="lab">Conséquence clinique</div><p>Les signes croissent avec le degré d’obstruction. Une thrombose du mollet bien drainée par des collatérales peut rester muette, et jusqu’à 80 % des thromboses n’ont pas de traduction clinique évidente, la douleur étant parfois le seul signe.</p>
<div class="lab">Ce qui change la décision</div><p>Aucun signe isolé ne confirme ni n’exclut la thrombose : le médecin les additionne dans le <button class="w" data-k="i80-wells">score de Wells</button> avant de choisir l’examen.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">Recommandations ESVS 2021 sur les thromboses veineuses</a>, sections 2.1.3, 2.1.4 et 2.2.1.1, tableau 3.</p></template>
<template data-pop="i80-ch-hormones" data-title="Facteurs hormonaux : désaccord européen et position suisse"><div class="lab">Le désaccord</div><p>L’ESC 2019 classe la contraception œstroprogestative, la grossesse et le voyage parmi les facteurs transitoires mineurs, après lesquels une prolongation sans date d’arrêt peut être envisagée (classe IIa, formulée pour l’embolie pulmonaire). L’ESVS 2021 range au contraire les œstrogènes, la grossesse et le post-partum parmi les facteurs majeurs, après lesquels le traitement s’arrête à 3 mois, au plus tôt 6 semaines après l’accouchement.</p>
<div class="lab">Position suisse retenue</div><p>Le guide de l’Institut de médecine de famille de l’Université de Zurich (novembre 2024) classe la contraception, le traitement hormonal de la ménopause et la grossesse comme des facteurs transitoires faibles mais importants, en s’appuyant sur la Société internationale de thrombose et d’hémostase. Le risque de récidive diminue de moitié dès que l’exposition hormonale cesse et reste deux fois plus faible qu’après une thrombose sans facteur. Le guide recommande donc une anticoagulation habituelle de 3 mois, sans prolongation, et pendant la grossesse au moins jusqu’à 6 semaines après l’accouchement. Lors d’une grossesse ultérieure, une prophylaxie est proposée dès le début et jusqu’à 6 semaines après l’accouchement.</p>
<div class="lab">Pourquoi cette position est cohérente</div><p>L’œstrogène oral agit par un mécanisme réversible : il modifie la synthèse hépatique des protéines de la coagulation. Une fois l’exposition arrêtée, cette impulsion procoagulante disparaît, ce qui rapproche la thrombose d’un épisode provoqué par une cause supprimée. Pour l’examen fédéral, la position suisse s’applique ; l’écart avec l’ESC 2019 reste à connaître.</p>
<div class="lab">Sources</div><p>Rosemann A. et al., guideline de l’Institut de médecine de famille de l’Université de Zurich 2024, sections 3.4.3 et 4.2.3 ; <a href="https://doi.org/10.1093/eurheartj/ehz405" target="_blank" rel="noopener">recommandations ESC 2019 sur l’embolie pulmonaire</a>, tableau 11 ; <a href="https://doi.org/10.1016/j.ejvs.2020.09.023" target="_blank" rel="noopener">recommandations ESVS 2021</a>, tableau 5.</p></template>
<template data-pop="i80-ch-fonda" data-title="Fondaparinux curatif et insuffisance rénale modérée"><div class="lab">Texte suisse en vigueur</div><p>L’information professionnelle suisse d’Arixtra® (version du 1<sup>er</sup> janvier 2026) donne, pour le traitement de la thrombose profonde et de l’embolie pulmonaire, 7,5 mg une fois par jour entre 50 et 100 kg, 5 mg sous 50 kg et 10 mg au-delà de 100 kg. Dans sa rubrique sur l’insuffisance rénale, elle écrit littéralement que la dose doit être réduite à 1,5 mg une fois par jour lorsque la clairance de la créatinine se situe entre 30 et 50 mL/min, et que le fondaparinux ne doit pas être utilisé sous 30 mL/min.</p>
<div class="lab">Texte européen</div><p>Le résumé des caractéristiques du produit de l’Agence européenne des médicaments pour Arixtra® 5, 7,5 et 10 mg ne prévoit aucune réduction systématique dans l’insuffisance rénale modérée : il demande la prudence, limite la durée à celle des essais (7 jours en moyenne) et admet seulement, chez le patient de plus de 100 kg dont la clairance est de 30 à 50 mL/min, de passer de 10 mg à 7,5 mg après la première dose, sur la foi d’une modélisation pharmacocinétique. Il contre-indique lui aussi le fondaparinux sous 30 mL/min.</p>
<div class="lab">Pourquoi l’écart compte</div><p>Le fondaparinux est éliminé presque exclusivement par le rein sous forme inchangée. Selon l’information suisse elle-même, sa clairance plasmatique est en moyenne divisée par deux dans l’insuffisance rénale modérée, et sa demi-vie passe de 13 à 21 heures à environ 29 heures. Une dose de 1,5 mg représente le cinquième de la dose curative habituelle : elle correspond à la dose prophylactique réduite et n’a pas été étudiée en traitement curatif, puisque l’essai de traitement cité par le texte suisse n’employait que 5, 7,5 ou 10 mg. Appliquée telle quelle, elle exposerait à une anticoagulation insuffisante pendant la phase où l’extension et l’embolie sont les plus fréquentes ; la dose pleine, à l’inverse, s’accumule.</p>
<div class="lab">Position suisse retenue</div><p>Le guide de l’Institut de médecine de famille de l’Université de Zurich (novembre 2024) tranche dans le sens du texte européen : il prescrit 7,5 mg par jour (5 mg sous 50 kg, 10 mg au-delà de 100 kg), n’adapte pas la dose tant que le débit de filtration reste égal ou supérieur à 30 mL/min et contre-indique le fondaparinux en dessous. Le médecin ne réduit donc pas la dose curative à 1,5 mg entre 30 et 50 mL/min ; il l’emploie avec la prudence que demande le résumé européen, pour une durée proche de celle des essais, en surveillant la fonction rénale et les saignements. La discordance du texte suisse mérite d’être signalée au titulaire de l’autorisation.</p>
<div class="lab">Sources</div><p>Information professionnelle suisse Arixtra® (Viatris), version du 01.01.2026, rubriques Posologie, Mises en garde, Pharmacocinétique et Propriétés, Swissmedic (AIPS), lue le 08.10.2026 ; Agence européenne des médicaments, Arixtra, résumé des caractéristiques du produit, rubriques 4.2, 4.4 et 5.2 des présentations à 5, 7,5 et 10 mg, lu le 08.10.2026 ; Rosemann A. et al., guideline de l’Institut de médecine de famille de l’Université de Zurich 2024 sur la thrombose veineuse profonde, chapitre sur l’anticoagulation parentérale, lu le 08.10.2026.</p></template>
<template data-pop="i80-ch-contraception" data-title="Contraception pendant l’anticoagulation : position suisse"><div class="lab">Recommandation</div><p>Le guide suisse de 2024 reprend la recommandation de la Société internationale de thrombose et d’hémostase : la contraception hormonale peut être poursuivie pendant l’anticoagulation thérapeutique, puis remplacée par une méthode sans œstrogène avant l’arrêt de l’anticoagulant. Les méthodes de relais sont la pilule progestative seule, le dispositif intra-utérin au lévonorgestrel, l’implant à l’étonogestrel ou le dispositif au cuivre ; l’acétate de médroxyprogestérone injectable est exclu.</p>
<div class="lab">Raisons</div><p>Sous anticoagulation efficace, aucune donnée prospective ne montre davantage de complications thromboemboliques ; une analyse a posteriori des essais EINSTEIN n’a trouvé ni plus de récidives sous hormones, ni de différence entre œstroprogestatifs et progestatifs seuls. À l’inverse, un arrêt brutal expose à une grossesse non désirée sous un anticoagulant potentiellement embryotoxique et à des saignements vaginaux abondants au sevrage hormonal. Une contraception sûre est donc exigée pendant toute anticoagulation orale.</p>
<div class="lab">Ce qui reste exclu</div><p>Après l’arrêt de l’anticoagulation, l’œstrogène n’est plus prescrit, car il réactive le mécanisme procoagulant qui a contribué à la thrombose.</p>
<div class="lab">Sources</div><p>Rosemann A. et al., guideline de l’Institut de médecine de famille de l’Université de Zurich 2024, section 4.2.1, et analyse des essais EINSTEIN citée par ce guide.</p></template>
