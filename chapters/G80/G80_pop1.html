<template data-pop="g80-definition" data-title="Définition internationale de 2006">
<div class="lab">Définition</div><p>Groupe de troubles permanents du développement du mouvement et de la posture, entraînant une limitation d’activité, attribués à des perturbations non progressives survenues dans le cerveau fœtal ou du nourrisson en développement. Les troubles moteurs s’accompagnent souvent de troubles sensoriels, cognitifs, de la communication, du comportement, d’épilepsie et de problèmes musculosquelettiques secondaires.</p><div class="lab">Application</div><p>Chaque terme porte une exigence : « permanents » exclut une atteinte transitoire, « limitation d’activité » exclut les personnes sans retentissement fonctionnel, « non progressives » exclut les maladies évolutives. Le rapport est issu d’un atelier de consensus international ; il est lu ici comme définition et non comme recommandation de conduite américaine.</p><div class="lab">Limite</div><p>Seul le résumé du rapport de 2007 a été lu.</p>
</template>
<template data-pop="g80-cim" data-title="Catégorie G80 de la CIM-10-GM 2024">
<div class="lab">Contenu</div><p>La catégorie G80 « Infantile Zerebralparese » est dans le bloc G80–G83. Elle comprend : G80.0 spastique quadriplégique ; G80.1 spastique diplégique ; G80.2 hémiplégique ; G80.3 dyskinétique (athétosique et dystonique) ; G80.4 ataxique ; G80.8 autres (syndromes mixtes) ; G80.9 sans précision.</p><div class="lab">Exclusion</div><p>La paraplégie spastique héréditaire se code G11.4.</p><div class="lab">Limite</div><p>Les intitulés français sont ceux de l’Office fédéral de la statistique ; la cartographie vers la CIM-11 n’est pas établie dans ce cours.</p>
</template>
<template data-pop="g80-g114" data-title="Paraplégie spastique héréditaire (G11.4)">
<div class="lab">Pourquoi elle est exclue</div><p>La CIM-10-GM exclut la paraplégie spastique héréditaire de la catégorie G80 et la code G11.4. Le diagnostic différentiel avec une PC spastique bilatérale prédominant aux jambes est donc à poser explicitement.</p><div class="lab">Limite</div><p>Les sources lues ne détaillent pas les critères qui séparent les deux affections ; le cours se limite à l’exclusion de classification et au signal d’alarme d’une régression ou d’une progression.</p>
</template>
<template data-pop="g80-scpe" data-title="Classification SCPE (réseau européen)">
<div class="lab">Principe</div><p>Le réseau Surveillance of Cerebral Palsy in Europe a remplacé les classifications d’Ingram (1955) et de Hagberg (1976). Spastique : unilatérale ou bilatérale. Dyskinétique : dystonique (hypertonique-hypokinétique) ou choréo-athétosique (hypotonique-hyperkinétique). Ataxique : tonus surtout diminué. Les formes mixtes sont classées selon la composante prédominante.</p><div class="lab">Application</div><p>Le compte rendu cite le type SCPE, puis le sous-code CIM correspondant. La confirmation dans les registres se fait à 4–5 ans.</p>
</template>
<template data-pop="g80-gmfcs" data-title="GMFCS : niveaux de I à V">
<div class="lab">Définition</div><p>Système de classification de la fonction motrice globale en cinq niveaux, par tranches d’âge (moins de 2 ans, 2–4, 4–6, 6–12, 12–18 ans). I : marche sans restriction ; II : marche avec limitations ; III : marche avec aide technique ; IV : mobilité limitée, fauteuil électrique possible ; V : déplacé en fauteuil par un tiers.</p><div class="lab">Valeur</div><p>Valide et fiable dès 2 ans. Il stratifie le risque de déplacement de hanche (0 % en I, 64 % en V) et oriente le choix thérapeutique.</p><div class="lab">Aide pédagogique, non critère officiel</div><p>Retenir « I marche, II marche avec limites, III marche avec aide, IV mobilité limitée, V porté ».</p>
</template>
<template data-pop="g80-macs" data-title="Fonction manuelle et communication">
<div class="lab">Ce qui est établi</div><p>Les sources citent les échelles MACS (fonction manuelle) et une échelle de communication, mais leurs niveaux n’ont pas été lus.</p><div class="lab">Conséquence</div><p>Le cours ne décrit pas ces niveaux ; ils sont à consulter dans les sources primaires avant usage.</p>
</template>
<template data-pop="g80-mrics" data-title="MRICS : classification de l’imagerie">
<div class="lab">Groupes</div><p>A : malformations ; B : lésion prédominante de la substance blanche ; C : lésion prédominante de la substance grise ; D : divers ; E : normale. L’imagerie est anormale chez plus de 80 % des enfants.</p><div class="lab">Valeur</div><p>Étude de 3818 enfants dans 20 registres : les lésions bilatérales s’associent à une atteinte motrice et à des déficiences associées plus sévères que les lésions unilatérales.</p><div class="lab">Limite</div><p>Les proportions par groupe n’ont pas été lues.</p>
</template>
<template data-pop="g80-swisscpreg" data-title="Registre suisse de la paralysie cérébrale">
<div class="lab">Données</div><p>Fondé en 2017 ; 546 participants entre août 2017 et août 2021 ; 55 % de garçons ; 56 % nés à terme ; 76 % de formes spastiques ; 73 % de diagnostics posés avant 2 ans (médiane : 18 mois) ; GMFCS I–II 59 %, III 12 %, IV–V 29 %.</p><div class="lab">Limite</div><p>Registre non exhaustif : il ne donne pas la prévalence suisse. Seul le résumé de l’article a été lu.</p>
</template>
<template data-pop="g80-vulnerabilite" data-title="Fenêtres de vulnérabilité">
<div class="lab">Principe</div><p>La nature de la lésion dépend de la période où le cerveau est atteint : malformation (précoce), substance blanche périventriculaire (prématuré), substance grise profonde ou cortex (à terme). C’est le principe de la classification MRICS.</p><div class="lab">Conséquence clinique</div><p>L’imagerie renseigne sur le moment probable de l’atteinte, donc sur la cause à rechercher.</p>
</template>
<template data-pop="g80-facteurs" data-title="Facteurs prénataux, périnataux et prématurité">
<div class="lab">Données</div><p>Facteurs prénataux : environ 75 % des cas ; facteurs néonatals et du nourrisson : 10 à 18 %. La part périnatale est moindre qu’on ne le pensait. La prématurité et le faible poids sont le facteur majeur : la fréquence est plus de 70 fois plus élevée sous 1500 g qu’à 2500 g ou plus.</p><div class="lab">Limite</div><p>Revue narrative européenne ; l’AVC néonatal n’est pas traité, faute de lecture suffisante des sources correspondantes.</p>
</template>
<template data-pop="g80-genetique" data-title="Génétique de la PC">
<div class="lab">Mécanismes</div><p>Variants de novo (variants ponctuels, SNV ; variants du nombre de copies, CNV), variants mitochondriaux, plus rarement expansions de répétitions.</p><div class="lab">Stratégie</div><p>Exome en trio en première intention, puis puce ADN ou génome. Rendement maximal si l’imagerie est normale, si l’évolution est atypique ou si d’autres signes neurodéveloppementaux sont présents.</p><div class="lab">Limite</div><p>Seul le résumé de la revue de 2026 a été lu.</p>
</template>
<template data-pop="g80-epilepsie" data-title="Épilepsie et mort subite">
<div class="lab">Fréquence</div><p>L’épilepsie concerne 15 à 60 % des enfants : 50–94 % en tétraplégie, 33–50 % en hémiplégie, 16–27 % en diplégie ou ataxie. Elle survient surtout la première année. Le risque de mort subite inattendue en épilepsie est de 1,1 à 3,4 pour 1000 enfants par an.</p><div class="lab">Conduite</div><p>Après l’échec de deux antiépileptiques, évaluer la chirurgie, la stimulation vagale ou le régime cétogène.</p>
</template>
<template data-pop="g80-deglutition" data-title="Dysphagie oropharyngée">
<div class="lab">Fréquence</div><p>Environ 2 enfants sur 3 ; les troubles digestifs sont fréquents.</p><div class="lab">Conséquence</div><p>La dysphagie est un risque respiratoire et nutritionnel, et elle augmente le risque lié à la toxine botulique.</p>
</template>
<template data-pop="g80-parole" data-title="Troubles de la parole">
<div class="lab">Données</div><p>Plus de 50 % des enfants ; 97 % des PC dyskinétiques ont une parole sévèrement atteinte ou absente ; 90 % des PC spastiques unilatérales ont une parole compréhensible.</p><div class="lab">Conséquence</div><p>Évaluer la communication même si la compréhension semble préservée.</p>
</template>
<template data-pop="g80-hanche" data-title="Déplacement de hanche">
<div class="lab">Données</div><p>Série de 212 enfants (Suède) : déplacement de hanche (migration de Reimers supérieure à 40 %) chez 18 % ; dès 2–3 ans ; 0 % en GMFCS I à 64 % en GMFCS V ; 0 % en ataxie pure à 79 % en tétraplégie spastique.</p><div class="lab">Conduite</div><p>L’amplitude articulaire est un mauvais indicateur : surveillance radiographique selon l’âge et le niveau GMFCS. Les intervalles précis n’ont pas été lus.</p>
</template>
<template data-pop="g80-gma" data-title="Mouvements généraux de Prechtl">
<div class="lab">Valeur</div><p>Sensibilité de 98 % avant 5 mois d’âge corrigé.</p><div class="lab">Application</div><p>Observation du mouvement spontané du nourrisson ; un résultat anormal concordant avec l’IRM et l’anamnèse soutient le diagnostic de haut risque de PC.</p><div class="lab">Limite</div><p>Seul le résumé de la revue de 2017 a été lu ; la technique de cotation n’est pas détaillée.</p>
</template>
<template data-pop="g80-hine" data-title="HINE">
<div class="lab">Valeur</div><p>Hammersmith Infant Neurological Examination : sensibilité de 90 %.</p><div class="lab">Application</div><p>Examen neurologique standardisé du nourrisson, utile avant et après 5 mois.</p>
</template>
<template data-pop="g80-dayc" data-title="DAYC">
<div class="lab">Valeur</div><p>Developmental Assessment of Young Children, indice C : sensibilité de 83 % après 5 mois.</p>
</template>
<template data-pop="g80-irm" data-title="IRM du nourrisson">
<div class="lab">Valeur</div><p>Sensibilité de 86 à 89 %. L’IRM à terme est préférée ; l’échographie transfontanellaire peut être utilisée chez le nourrisson.</p><div class="lab">Limite</div><p>Une IRM normale n’exclut pas la PC (29 % des formes ataxiques).</p>
</template>
<template data-pop="g80-mimes" data-title="Mimes de la PC">
<div class="lab">Principe</div><p>Les erreurs innées du métabolisme traitables et les maladies génétiques peuvent imiter la PC. Une régression ou une progression est un signal d’alarme.</p><div class="lab">Conséquence</div><p>Ne pas conclure à une PC devant une évolution atypique : engager le bilan génétique et métabolique.</p><div class="lab">Limite</div><p>La liste des drapeaux rouges de la recommandation britannique n’a pas pu être lue (accès refusé).</p>
</template>
