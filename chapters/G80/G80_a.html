<section class="ilot" id="g80-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une fille née à 27 SA est examinée à 7 mois d’âge corrigé. Elle tient mal sa tête, ses mouvements spontanés sont pauvres et ses jambes résistent à l’écartement. Ses parents demandent si elle marchera un jour. Le médecin doit répondre à cinq questions successives : le diagnostic de <button class="w" data-k="g80-definition">paralysie cérébrale</button> (PC) peut-il être posé dès maintenant ? De quel type s’agit-il ? Quel est le niveau fonctionnel ? Une maladie génétique ou progressive imite-t-elle la PC ? Quelle prise en charge organiser ?</p>
<p>Ce cours suit ces cinq questions. Il s’appuie sur la classification allemande des maladies utilisée en Suisse, sur le registre suisse de la PC, sur les données du réseau européen de surveillance et sur les informations professionnelles suisses des médicaments. Ce qui n’a pas pu être lu est signalé dans la fenêtre <button class="w" data-k="g80-lacunes">Ce que ce cours ne couvre pas</button>.</p>
<div class="key"><b>À retenir.</b> Le diagnostic de PC repose sur un trouble du mouvement et de la posture d’origine cérébrale non progressive. Il se pose parfois avant six mois d’âge corrigé, mais sa confirmation définitive attend souvent quatre à cinq ans.</div>
</section>
<section class="ilot" id="g80-1"><h2><span class="n">1</span>Définition et périmètre</h2>
<p>La PC est un groupe de troubles permanents du développement du mouvement et de la posture. Ils entraînent une limitation d’activité et sont attribués à des perturbations <b>non progressives</b> survenues dans le cerveau fœtal ou du nourrisson en développement. Cette <button class="w" data-k="g80-definition">définition internationale d’avril 2006</button> ajoute que les troubles moteurs s’accompagnent souvent de troubles sensoriels, cognitifs, de la communication et du comportement, d’épilepsie et de problèmes musculosquelettiques secondaires. Les personnes sans limitation d’activité n’y sont pas incluses.</p>
<p>L’expression « permanent mais non immuable » résume une idée centrale : la lésion ne progresse pas, mais le tableau clinique change avec l’âge, car le cerveau mûrit et les muscles et les articulations se déforment sous l’effet du tonus anormal. Un enfant dont la lésion est stable peut donc se dégrader sur le plan orthopédique.</p>
<p>La classification CIM-10-GM 2024 regroupe ces enfants dans la catégorie <button class="w" data-k="g80-cim">G80</button>, dont le titre français retenu par l’Office fédéral de la statistique est « Infirmité motrice cérébrale ». Le tableau relie chaque sous-code au type clinique correspondant selon le réseau européen <button class="w" data-k="g80-scpe">SCPE</button>.</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé</th><th>Type clinique correspondant</th></tr></thead><tbody><tr><td>G80.0</td><td>Paralysie cérébrale spastique quadriplégique</td><td>Spastique bilatérale, quatre membres atteints</td></tr><tr><td>G80.1</td><td>Paralysie cérébrale spastique diplégique</td><td>Spastique bilatérale, jambes surtout atteintes</td></tr><tr><td>G80.2</td><td>Infirmité motrice cérébrale, forme spastique hémiplégique</td><td>Spastique unilatérale</td></tr><tr><td>G80.3</td><td>Paralysie cérébrale dyskinétique</td><td>Dyskinétique (dystonique ou choréo-athétosique)</td></tr><tr><td>G80.4</td><td>Paralysie cérébrale ataxique</td><td>Ataxique</td></tr><tr><td>G80.8</td><td>Autres infirmités motrices cérébrales</td><td>Syndromes mixtes</td></tr><tr><td>G80.9</td><td>Paralysie cérébrale, sans précision</td><td>Type non précisé</td></tr></tbody></table>

<p>La paraplégie spastique héréditaire est <b>exclue</b> de la catégorie G80 et se code <button class="w" data-k="g80-g114">G11.4</button> : c’est une maladie héréditaire, non une lésion cérébrale fixe survenue dans le cerveau en développement.</p>
<div class="trap"><span class="k">Piège</span> Les sous-codes de la CIM-10-GM décrivent la topographie (tétra-, di-, hémiplégie), alors que le réseau SCPE parle d’atteinte unilatérale ou bilatérale. Les deux systèmes ne se superposent pas parfaitement ; le médecin note le sous-code pour la facturation et décrit le type SCPE pour la pratique.</div>
<div class="key"><b>À retenir.</b> G80 désigne une lésion cérébrale non progressive avec limitation d’activité. La paraplégie spastique héréditaire relève de G11.4.</div>
<button class="pareto-btn ui" data-k="pareto-g80-definition">▲ Loi de Pareto — Définition et périmètre</button>
</section>
<section class="ilot" id="g80-2"><h2><span class="n">2</span>Classifications</h2>
<p>Trois classifications se complètent : celle du <b>type moteur</b>, celle de la <b>fonction motrice globale</b> et celle de l’<b>imagerie</b>. Chacune répond à une question distincte, et un compte rendu complet les cite toutes.</p>
<h3>2.1 Type moteur selon le réseau européen</h3>
<p>Le réseau <button class="w" data-k="g80-scpe">SCPE</button> a remplacé les classifications d’Ingram (1955) et de Hagberg (1976). Il distingue trois grands types, plus les formes mixtes classées selon la composante prédominante.</p>
<table class="t"><thead><tr><th>Type</th><th>Subdivision</th><th>Particularité clinique</th></tr></thead><tbody><tr><td>Spastique</td><td>Unilatérale ou bilatérale</td><td>Plus de subdivision en diplégie, triplégie ou tétraplégie</td></tr><tr><td>Dyskinétique</td><td>Dystonique ou choréo-athétosique</td><td>Dystonique : hypertonique et hypokinétique ; choréo-athétosique : hypotonique et hyperkinétique ; si le sous-type est incertain, « dyskinétique » suffit</td></tr><tr><td>Ataxique</td><td>Aucune</td><td>Tonus surtout diminué</td></tr><tr><td>Mixte</td><td>Aucune</td><td>Classé selon la composante prédominante</td></tr></tbody></table>

<p>Le réseau retient ainsi un critère simple, unilatéral ou bilatéral. La <button class="w" data-k="g80-tonus">logique du tonus et du mouvement</button> explique ensuite pourquoi les types dyskinétique et ataxique se séparent du type spastique.</p>
<h3>2.2 Fonction motrice globale</h3>
<p>Le <button class="w" data-k="g80-gmfcs">GMFCS</button> classe la fonction motrice en cinq niveaux, par tranches d’âge (moins de 2 ans, 2–4, 4–6, 6–12 et 12–18 ans). Il est valide et fiable dès 2 ans.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Capacité décrite</th></tr></thead><tbody><tr><td>I</td><td>Marche sans restriction</td></tr><tr><td>II</td><td>Marche avec limitations</td></tr><tr><td>III</td><td>Marche avec aide technique</td></tr><tr><td>IV</td><td>Mobilité limitée ; fauteuil électrique possible</td></tr><tr><td>V</td><td>Déplacé en fauteuil par un tiers</td></tr></tbody></table>

<p>Pour la fonction manuelle, les sources citent les échelles <button class="w" data-k="g80-macs">MACS</button> et une échelle de communication, mais leurs niveaux n’ont pas été lus pour ce cours.</p>
<h3>2.3 Classification de l’imagerie</h3>
<p>La classification <button class="w" data-k="g80-mrics">MRICS</button> du réseau SCPE répartit les images par résonance magnétique en cinq groupes : A, malformations ; B, lésion prédominante de la substance blanche ; C, lésion prédominante de la substance grise ; D, divers ; E, normale. L’imagerie est anormale chez plus de 80 % des enfants. Dans une étude de 3818 enfants issus de 20 registres, les lésions bilatérales s’associaient à une atteinte motrice et à des déficiences associées plus sévères que les lésions unilatérales.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Réduire la PC à un diagnostic de topographie. Le compte rendu doit associer le type SCPE, le niveau GMFCS et le groupe d’imagerie : un enfant spastique bilatéral de niveau I et un autre de niveau V n’ont ni le même pronostic ni les mêmes besoins.</div>
<div class="key"><b>À retenir.</b> Type SCPE, niveau GMFCS et groupe MRICS répondent à trois questions différentes : quelle forme de trouble moteur, quelle capacité, quelle lésion.</div>
<button class="pareto-btn ui" data-k="pareto-g80-classif">▲ Loi de Pareto — Classifications</button>
</section>
<section class="ilot" id="g80-3"><h2><span class="n">3</span>Fréquence en Europe et en Suisse</h2>
<p>En Europe, la prévalence de la PC était de <b>2,08 pour 1000 naissances vivantes</b> dans les données SCPE de 1980–1990. Elle varie fortement avec le poids de naissance : elle est plus de 70 fois plus élevée sous 1500 g qu’à 2500 g ou plus. Ce gradient reflète la vulnérabilité du cerveau immature, décrite dans le chapitre de physiopathologie.</p>
<p>Une méta-analyse citée dans la revue de référence donne les prévalences suivantes selon l’âge gestationnel.</p>
<table class="t"><thead><tr><th>Âge gestationnel</th><th>Prévalence (pour 1000)</th></tr></thead><tbody><tr><td>Avant 28 SA</td><td>146</td></tr><tr><td>28 à 31 SA</td><td>62</td></tr><tr><td>32 à 36 SA</td><td>7</td></tr><tr><td>À terme</td><td>1,13</td></tr></tbody></table>

<p>Avant 28 SA, une PC concerne donc environ un enfant sur sept, soit près de 130 fois le risque de l’enfant né à terme (146 divisé par 1,13). Cette comparaison justifie le suivi neurodéveloppemental des grands prématurés ; elle n’autorise pas à oublier l’enfant né à terme, puisque 56 % des enfants du registre suisse sont nés à terme.</p>
<h3>3.1 Tendance</h3>
<p>Entre 1980 et 2003, la prévalence du réseau SCPE a baissé de 1,90 à 1,77 pour 1000, surtout entre 1000 et 1499 g (de 70,9 à 35,9 pour 1000). Chez les nouveau-nés de moins de 1500 g, la baisse de 60,6 à 39,5 pour 1000 entre 1980 et 1996 portait sur la forme spastique bilatérale ; 94 % de ces enfants avaient une forme spastique, dont 24 % unilatérale. Ces données sont anciennes : elles décrivent des naissances d’avant 2003.</p>
<h3>3.2 Données suisses</h3>
<p>Le <button class="w" data-k="g80-swisscpreg">registre suisse de la paralysie cérébrale</button> (Swiss-CP-Reg), fondé en 2017, comptait 546 participants entre août 2017 et août 2021 : 55 % de garçons, 56 % nés à terme, 76 % de formes spastiques. Le diagnostic avait été posé avant 2 ans chez 73 % d’entre eux (âge médian : 18 mois). Le niveau GMFCS était I–II chez 59 %, III chez 12 % et IV–V chez 29 %. Dans un sous-groupe de 170 enfants, un GMFCS plus élevé s’associait à un quotient intellectuel plus bas.</p>
<p>Dans la cohorte nationale suisse des enfants nés avant 30 SA en 2006, 14 sur 235 (6 %) présentaient une PC à 5 ans.</p>
<div class="trap"><span class="k">Population des chiffres</span> Le registre suisse n’est pas exhaustif et ne donne donc pas la prévalence populationnelle suisse ; aucune prévalence suisse nationale n’a été lue. Les chiffres de prévalence cités plus haut sont européens et datent de la période 1980–2003.</div>
<div class="key"><b>À retenir.</b> La PC touche environ 2 enfants pour 1000 naissances vivantes en Europe, et plus de 14 % avant 28 SA. En Suisse, plus de la moitié des enfants du registre sont nés à terme.</div>
<button class="pareto-btn ui" data-k="pareto-g80-epidemio">▲ Loi de Pareto — Fréquence</button>
</section>
<section class="ilot" id="g80-4"><h2><span class="n">4</span>Physiopathologie et étiologies</h2>
<p>Le mécanisme se comprend en trois temps : le cerveau en développement n’est pas vulnérable de la même façon à toutes les périodes, la lésion survient dans une fenêtre précise, et le type de PC dépend de la structure atteinte.</p>
<h3>4.1 Fenêtres de vulnérabilité</h3>
<p>Selon le principe de la classification <button class="w" data-k="g80-mrics">MRICS</button>, la nature de la lésion dépend de la période où le cerveau a été atteint : une <b>malformation</b> reflète une atteinte précoce du développement, une lésion de la <b>substance blanche périventriculaire</b> s’observe chez le prématuré, et une lésion de la <b>substance grise profonde ou du cortex</b> s’observe plutôt à terme. Le schéma de la fenêtre <button class="w" data-k="g80-vulnerabilite">Fenêtres de vulnérabilité</button> résume cette correspondance.</p>
<p>Cette correspondance explique pourquoi l’imagerie renseigne sur le moment de l’atteinte : la localisation de la lésion indique la période probable, ce qui oriente la recherche de la cause.</p>
<h3>4.2 Facteurs de risque</h3>
<p>Les facteurs <button class="w" data-k="g80-facteurs">prénataux</button> représentent environ 75 % des cas, les facteurs néonatals et du nourrisson 10 à 18 %. La part périnatale est donc moindre que ce que l’on croyait : l’accouchement n’est la cause que d’une minorité de PC. La prématurité et le faible poids de naissance sont le facteur majeur, et plus la grossesse est courte, plus l’atteinte est sévère.</p>
<h3>4.3 Génétique</h3>
<p>Une part des PC dites cryptogéniques a une cause <button class="w" data-k="g80-genetique">génétique</button> : variants de novo ponctuels (<button class="w" data-k="g80-genetique">SNV</button>) ou structuraux (<button class="w" data-k="g80-genetique">CNV</button>), variants mitochondriaux, plus rarement expansions de répétitions. Le rendement diagnostique est le plus élevé lorsque l’imagerie est normale, que l’évolution est atypique ou que d’autres signes neurodéveloppementaux sont présents. Dans la PC ataxique, 9 % des enfants avaient un syndrome génétique dans un registre de 679 enfants.</p>
<h3>4.4 Du dommage cérébral au trouble moteur</h3>
<p>Les sources lues décrivent le mécanisme de la spasticité par l’action des médicaments : le baclofène inhibe les réflexes mono- et polysynaptiques de la moelle en réduisant la libération de glutamate et d’aspartate, et la toxine botulique A bloque la libération d’acétylcholine à la jonction neuromusculaire. Ces deux actions définissent deux cibles thérapeutiques, l’une dans la moelle et l’autre à la jonction avec le muscle (voir l’onglet Sciences) ; les sources lues ne détaillent pas l’origine de la spasticité elle-même.</p>
<div class="trap"><span class="k">Piège</span> Chercher une cause unique. La majorité des PC ont des facteurs prénataux, parfois associés à la prématurité ; imputer la PC à l’accouchement sans analyse expose à une erreur de causalité et retarde la recherche génétique.</div>
<div class="key"><b>À retenir.</b> Le moment de l’atteinte cérébrale détermine le siège de la lésion, et ce siège détermine en grande partie le type moteur. Les causes prénatales dominent.</div>
<button class="pareto-btn ui" data-k="pareto-g80-mecanismes">▲ Loi de Pareto — Mécanismes et causes</button>
</section>
<section class="ilot" id="g80-5"><h2><span class="n">5</span>Anamnèse et manifestations</h2>
<p>Les signes moteurs apparaissent et évoluent avant l’âge de 2 ans. L’anamnèse recherche la prématurité (semaines d’aménorrhée, poids), les événements néonatals, les antécédents familiaux de maladie neurologique et le moment où les parents ont remarqué un retard, une asymétrie ou une raideur. Une <b>régression</b> des acquisitions doit faire chercher une autre maladie (voir la démarche diagnostique).</p>
<h3>5.1 Comorbidités par fréquence</h3>
<p>Le trouble moteur n’est qu’une des dimensions de la maladie ; les comorbidités pèsent sur la qualité de vie.</p>
<table class="t"><thead><tr><th>Comorbidité</th><th>Fréquence ou donnée</th><th>Remarque</th></tr></thead><tbody><tr><td><button class="w" data-k="g80-epilepsie">Épilepsie</button></td><td>15 à 60 % (tétraplégie 50–94 % ; hémiplégie 33–50 % ; diplégie ou ataxie 16–27 %)</td><td>Surtout la première année ; risque de <button class="w" data-k="g80-epilepsie">mort subite inattendue</button> de 1,1 à 3,4 pour 1000 enfants par an</td></tr><tr><td>Déficience intellectuelle</td><td>40 à 65 %</td><td>QI plus bas avec un GMFCS plus élevé (registre suisse, 170 enfants)</td></tr><tr><td><button class="w" data-k="g80-deglutition">Dysphagie oropharyngée</button></td><td>Environ 2 enfants sur 3</td><td>Troubles digestifs fréquents</td></tr><tr><td><button class="w" data-k="g80-parole">Trouble de la parole</button></td><td>Plus de 50 %</td><td>97 % des PC dyskinétiques : parole sévèrement atteinte ou absente ; spastique unilatérale : 90 % de parole compréhensible</td></tr><tr><td><button class="w" data-k="g80-hanche">Déplacement de hanche</button></td><td>18 % de 212 enfants suivis</td><td>De 0 % en GMFCS I à 64 % en GMFCS V</td></tr><tr><td>Vision, audition, douleur, sommeil, alimentation, cognition</td><td>Fréquentes (registre suisse)</td><td>À rechercher activement</td></tr></tbody></table>

<p>La fréquence de l’épilepsie varie du simple au triple selon la topographie : elle est la plus élevée dans la tétraplégie. Les troubles de la parole sont les plus marqués dans les formes dyskinétiques. Ces deux données justifient une évaluation systématique de la communication, même chez un enfant dont la compréhension semble préservée.</p>
<h3>5.2 Formes typiques et atypiques</h3>
<div class="two"><div class="card"><h4>Forme spastique (76 % du registre suisse)</h4><p>Raideur à la mobilisation, réflexes vifs, asymétrie si la forme est unilatérale. Le niveau GMFCS varie de I à V. Chez les nouveau-nés de moins de 1500 g, 94 % des PC sont spastiques.</p></div><div class="card"><h4>Forme ataxique (3,8 % des PC)</h4><p>Dans 20 registres européens (679 enfants), 79 % sont nés à terme, environ 70 % marchent, 40 % ont une déficience intellectuelle sévère. L’imagerie est normale dans 29 % des cas et montre une malformation dans 28,5 %. Un bilan génétique complet est particulièrement recommandé.</p></div></div>

<div class="trap"><span class="k">Piège</span> Un enfant « raide » n’est pas toujours spastique. Le type dyskinétique associe des mouvements involontaires à un tonus variable, et le type ataxique est surtout hypotonique : ces formes sont plus rares et moins bien reconnues.</div>
<div class="key"><b>À retenir.</b> Le diagnostic moteur ne suffit pas : l’épilepsie, la dysphagie, la parole et les hanches sont à chercher chez tout enfant atteint, avec une fréquence qui dépend du type et du niveau GMFCS.</div>
<button class="pareto-btn ui" data-k="pareto-g80-clinique">▲ Loi de Pareto — Anamnèse et manifestations</button>
</section>
<section class="ilot" id="g80-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel de la pédiatrie : état général, âge corrigé, croissance et alimentation, puis examen neurologique ciblé. Les sources lues ne détaillent pas la technique de chaque manœuvre ; elles décrivent les outils validés. Le cours se limite donc à ce qu’elles établissent.</p>
<div class="two"><div class="card"><h4>Observation et évaluation standardisée</h4><p>L’observation du mouvement spontané du nourrisson, par les <button class="w" data-k="g80-gma">mouvements généraux de Prechtl</button>, est l’outil le plus sensible avant 5 mois d’âge corrigé (98 %). L’<button class="w" data-k="g80-hine">examen neurologique standardisé HINE</button> donne une sensibilité de 90 %. Ces outils remplacent l’impression subjective par une cotation reproductible.</p></div><div class="card"><h4>Tonus et type moteur</h4><p>Le médecin cherche une <button class="w" data-k="g80-tonus">raideur à la mobilisation</button>, des mouvements involontaires ou une instabilité du tonus, et note si l’atteinte est unilatérale ou bilatérale. Un enfant de plus de 2 ans reçoit un niveau <button class="w" data-k="g80-gmfcs">GMFCS</button>.</p></div><div class="card"><h4>Hanches</h4><p>L’amplitude articulaire est un <b>mauvais indicateur</b> du déplacement de hanche. La surveillance repose donc sur la <button class="w" data-k="g80-hanche">radiographie</button>, selon l’âge et le niveau GMFCS, et non sur l’examen clinique seul.</p></div><div class="card"><h4>Fonctions associées</h4><p>La déglutition, la parole, la vision, l’audition et la douleur sont évaluées à chaque consultation de suivi, car elles ne se déduisent pas du seul examen moteur.</p></div></div>
<div class="trap"><span class="k">Piège</span> Rassurer parce que l’examen clinique des hanches est normal. Une hanche peut se déplacer sans perte d’amplitude et sans douleur ; seule la radiographie documente la migration.</div>
<div class="key"><b>À retenir.</b> L’examen clinique du nourrisson repose sur des outils standardisés (mouvements généraux, HINE). Pour les hanches, il ne remplace pas l’imagerie.</div>
</section>
