<section class="ilot" id="k60-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 34 ans, qui a accouché il y a deux mois, décrit une douleur anale violente, « comme une déchirure », à chaque selle ; la douleur persiste une à deux heures, et elle voit du sang rouge sur le papier. <b>La question est donc double : s’agit-il d’une <button class="w" data-k="k60-fis">fissure anale</button>, aiguë ou déjà chronique, et quel traitement choisir sans menacer sa continence ?</b></p><p>Pour y répondre, le médecin doit savoir reconnaître la fissure à l’anamnèse et à l’inspection ; ensuite, il doit distinguer la fissure aiguë de la <button class="w" data-k="k60-chr">fissure chronique</button> et la fissure primaire d’une <button class="w" data-k="k60-sec">fissure secondaire</button> ; de plus, il doit comprendre pourquoi le traitement cherche à relâcher le <button class="w" data-k="k60-sai">sphincter interne</button> ; enfin, il doit savoir reconnaître une <button class="w" data-k="k60-fst">fistule anale</button>, dont le traitement est chirurgical et dont le risque principal est, là aussi, l’incontinence.</p><p><i>Pourquoi ce cas ?</i> En effet, la fissure est l’une des affections proctologiques les plus fréquentes, et la jeune accouchée cumule deux pièges : un sphincter parfois peu tonique après l’accouchement et un risque d’incontinence si l’on coupe le muscle. Ainsi, contrairement à un manuel figé qui juxtapose les traitements, ce cours relie chaque décision au mécanisme ; chaque mot vert ouvre le critère, la dose suisse ou l’image correspondante.</p><div class="key"><b>Point de départ.</b> Douleur anale déchirante à la selle et sang rouge : penser fissure → inspecter en écartant les fesses → chercher une localisation atypique → relâcher le sphincter avant de penser à opérer.</div></section>
<section class="ilot" id="k60-1"><h2><span class="n">1</span>Définitions et épidémiologie</h2><p>Selon la S3 2020, la <button class="w" data-k="k60-fis">fissure anale</button> est une perte de substance radiaire de l’anoderme, située en dessous de la ligne pectinée. Ainsi, elle siège dans 80 à 90 % des cas à la commissure postérieure, c’est-à-dire à 6 heures en position gynécologique. Par ailleurs, on la dit chronique lorsque les symptômes durent plus de 6 à 8 semaines ; de plus, des modifications morphologiques s’y ajoutent généralement : une papille anale hypertrophique, un <button class="w" data-k="k60-mar">repli sentinelle</button>, un ulcère à bords surélevés et des fibres du <button class="w" data-k="k60-sai">sphincter interne</button> visibles au fond.</p><p>En outre, les données épidémiologiques sont rares. Une étude cas-témoins de 1243 patients a calculé une incidence de 1,1 pour 1000 années-patients, soit un risque sur la vie de 7,8 % ; c’est pourquoi la S3 retient un risque sur la vie pouvant atteindre 8 à 11 %. De plus, aucun sexe ne prédomine nettement, mais la fissure est plus fréquente pendant la grossesse et après l’accouchement : une étude l’a diagnostiquée chez un tiers des accouchées.</p><table class="t"><tr><th>Code CIM-10-GM</th><th>Libellé officiel</th><th>Ce que le code décrit</th></tr><tr><td>K60.0</td><td>Fissure anale aiguë</td><td>La fissure date de moins de 6 à 8 semaines.</td></tr><tr><td>K60.1</td><td>Fissure anale chronique</td><td>Elle dure plus longtemps et s’accompagne en règle de lésions secondaires.</td></tr><tr><td>K60.2</td><td>Fissure anale, sans précision</td><td>Son ancienneté n’est pas précisée.</td></tr><tr><td>K60.3</td><td>Fistule anale</td><td>Le trajet relie le canal anal à la peau périanale.</td></tr><tr><td>K60.4</td><td>Fistule rectale</td><td>Le trajet part du rectum.</td></tr><tr><td>K60.5</td><td>Fistule ano-rectale</td><td>Le trajet concerne à la fois l’anus et le rectum.</td></tr></table><p><i>Que montre le tableau ?</i> Le code réunit deux maladies différentes du même carrefour anatomique : la fissure est une plaie de la muqueuse, alors que la fistule est un tunnel infecté. Or, leur point commun est le sphincter : on cherche à le relâcher dans la fissure, mais à le préserver lors de la chirurgie de la fistule. C’est pourquoi la continence domine toutes les décisions de ce cours.</p><div class="key"><b>À retenir.</b> La fissure est une plaie radiaire de l’anoderme sous la ligne pectinée, postérieure dans 80-90 % des cas ; elle devient chronique au-delà de 6-8 semaines, avec papille hypertrophique, repli sentinelle, bords surélevés et fibres sphinctériennes visibles. Son risque sur la vie atteint environ 8 à 11 %.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></section>
<section class="ilot" id="k60-2"><h2><span class="n">2</span>Physiopathologie : le cercle vicieux du sphincter</h2><p>Selon la S3, le mécanisme exact reste inconnu ; cependant, la plupart des études placent au centre une hypertonie du <button class="w" data-k="k60-sai">sphincter interne</button>. En effet, une étude de 1996 mesurait une pression anale de repos médiane de 121 mmHg chez les patients, contre 69 mmHg chez les témoins, alors qu’une pression normale est souvent définie comme inférieure à 90 mmHg. Or, cette hypertonie réduit le débit sanguin ; de plus, des études par Doppler laser et par artériographie post mortem ont montré que les branches de l’artère rectale inférieure sont raréfiées à la commissure postérieure, c’est-à-dire précisément là où siègent les fissures primaires.</p><p>Dès lors, un cercle vicieux s’installe : l’hypertonie provoque une ischémie, l’ischémie empêche la cicatrisation et entretient l’inflammation, puis la douleur augmente encore le tonus par réflexe. C’est pourquoi presque tous les traitements, médicaux ou chirurgicaux, visent à abaisser la pression du sphincter. Cependant, certaines fissures surviennent avec une pression basse, en particulier après l’accouchement ; dans ce cas, couper le sphincter serait à la fois inutile et dangereux. Par ailleurs, la constipation et les selles dures favorisent la fissure, de même qu’une alimentation pauvre en fibres, l’obésité et l’hypothyroïdie ; paradoxalement, la diarrhée aussi, car le sphincter doit se contracter davantage pour retenir des selles liquides.</p><figure><img src="data:image/gif;base64,R0lGODdhzAFZAYUAAOzJsOe/nue8m+K7muW3l+G1lN+0k9uzlOOrkt6rjNyqitqsjNqlhdepjNajhdOkis6jjtyYidWXgtGcgdGRf82biMyZdc2QgcyQcMiYeceSc8STcsCSdcaMecSMaL2Mdr6LZdKCe8qBdsSFcMR8cb2Fb72EXr17bbt9W7eBaLh+WLd4YbZ5VLN9Ya59Z7F2WsNuardvYLJzVrJsWq1xU61qU6lsT6NqULdcWahcUZ5eRJNOOLsmG/wAAXUyF2kkCywAAAAAzAFZAUAI/wAXCDRgYAHBgwgTGihg4MCBhRAJPhwggAABhgkLXCyg0SKBihoFiBQZoKSAAShLqlzJsqXKAS4DAFg5oCHMlCZfxtzJU+VIASZ/nqQIFOjKkQF sWQ4IADs=" width="460" height="345" loading="lazy" decoding="async" alt="Photographie de la marge anale : une flèche rouge désigne une petite plaie allongée et radiaire, entourée d’une muqueuse rosée."><figcaption>Fissure anale : la flèche montre la plaie radiaire de l’anoderme. <small>Image : Bernardo Gui, Wikimedia Commons, licence Public domain (<a href="https://commons.wikimedia.org/wiki/File:Anal_fissure_1.jpg" target="_blank" rel="noopener">source</a>), adaptée en GIF.</small></figcaption></figure><p><i>Que montre l’image ?</i> La plaie est étroite, allongée dans l’axe d’un rayon de l’anus et à bords nets ; ainsi, elle correspond à une déchirure récente, sans les bords surélevés de la forme chronique. Or, il suffit d’écarter doucement les fesses pour la voir ; c’est pourquoi la S3 n’exige pas d’emblée l’<button class="w" data-k="k60-anusco">anuscopie</button>, souvent impossible à cause de la douleur et du spasme.</p><div class="key"><b>À retenir.</b> Hypertonie du sphincter interne → ischémie de la commissure postérieure, mal vascularisée → absence de cicatrisation → douleur → tonus encore plus élevé. Tous les traitements cassent ce cercle en abaissant la pression, sauf quand le tonus est déjà bas, par exemple après l’accouchement.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></section>
<section class="ilot" id="k60-3"><h2><span class="n">3</span>Diagnostic et fissures secondaires</h2><p>Selon la S3, la douleur anale liée à la défécation est presque pathognomonique ; selon que la fissure est aiguë ou chronique, elle dure une à deux heures, voire plusieurs heures après la selle. De plus, le patient remarque souvent du sang rouge sur les selles ou sur le papier. Ensuite, l’examen comprend l’inspection et la palpation : l’écartement des fesses montre généralement déjà la fissure. Par ailleurs, une <button class="w" data-k="k60-anusco">anuscopie</button> devrait être faite, mais elle est souvent impossible au début ; c’est pourquoi, si le diagnostic est douteux, on examine le patient sous anesthésie. En outre, le toucher rectal apprécie mal le tonus : sa spécificité pour détecter une hypertonie n’était que de 16 % dans une étude en aveugle.</p><p>Il faut ensuite distinguer la fissure primaire de la <button class="w" data-k="k60-sec">fissure secondaire</button>, qui complique une autre maladie. Ainsi, la fissure secondaire est plus souvent latérale, atypique et multiple ; elle peut révéler une maladie de Crohn, une infection (VIH, CMV, herpès, chlamydia, tuberculose, syphilis, gonorrhée), un traumatisme, une chirurgie anale ou un médicament comme le nicorandil. C’est pourquoi, devant une fissure atypique, la S3 recommande un bilan par étapes, avec sérologies et prélèvements selon l’anamnèse ; de plus, une suspicion de Crohn impose une coloscopie avec biopsies. Enfin, si la fissure persiste après 6 à 8 semaines de traitement, une anuscopie doit être faite, au besoin sous anesthésie, pour ne pas manquer un <button class="w" data-k="k60-abces">abcès</button>, une fistule, un lymphome ou un cancer de l’anus.</p><figure><img src="data:image/gif;base64,R0lGODdhzAF0AYUAAP795vzy1f3hw/Pgw/zRsfvDpfLHquTGq/G1qO20jOyoneqlht2tldyhjdSmjsamjuSYiNaYh86Xis2WeuSKfNGLfcmOfcmEd8CRfb+Jd7+DeL2Ba7OIdLJ+baWFcKR9ast2abd2aa92Zqd3ZqZwYZ12ZJxvXpJ0YZFtXKhoWpVnV4xnWYplT5ZeUIVeTpVPQ3 daire, notamment par une coloscopie avec biopsies</button><button data-ok="0">Proposer d’emblée une sphinctérotomie</button><p class="fb" hidden>Une localisation latérale et multiple est atypique : selon la S3, elle impose de chercher une fissure secondaire, en particulier une maladie de Crohn, par une coloscopie avec biopsies.</p></div><div class="key"><b>À retenir.</b> La douleur déchirante à la selle et le sang rouge orientent vers une fissure, et l’écartement des fesses la montre. Une fissure latérale, multiple ou atypique fait chercher un Crohn, une infection ou un médicament ; au-delà de 6-8 semaines d’échec, on fait une anuscopie, au besoin sous anesthésie.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></section>
<section class="ilot" id="k60-4"><h2><span class="n">4</span>Traitement de la fissure aiguë</h2><p>La fissure aiguë guérit souvent spontanément : selon la S3, 60 à 90 % des fissures aiguës cicatrisent sous traitement conservateur. Ainsi, la première mesure est de ramollir les selles, car une selle dure rouvre la plaie et relance le spasme : on recommande une alimentation riche en fibres ou un complément, par exemple du <button class="w" data-k="k60-psyl">psyllium</button>. De plus, cette alimentation doit être poursuivie pour prévenir les récidives ; en effet, dans un essai, 68 % des patients sous placebo récidivaient en 18 mois, contre 16 % de ceux qui prenaient 15 g de son par jour pendant un an.</p><p>Ensuite, la S3 recommande d’appliquer localement un <button class="w" data-k="k60-icc">inhibiteur calcique</button>, par exemple la nifédipine, pendant 3 à 8 semaines ; en effet, il relâche le <button class="w" data-k="k60-sai">sphincter interne</button> et rompt le cercle vicieux. Par ailleurs, les anesthésiques locaux soulagent la douleur sans changer la cicatrisation, et les bains de siège améliorent le confort, mais ils n’accélèrent pas la guérison et irritent parfois la peau. Enfin, les <button class="w" data-k="k60-gtn">dérivés nitrés</button> peuvent aussi être employés dans la fissure aiguë, mais leur niveau de preuve y est plus faible que celui de la nifédipine.</p><div class="key"><b>À retenir.</b> La fissure aiguë guérit dans 60-90 % des cas sans chirurgie. On ramollit les selles par des fibres (psyllium), que l’on poursuit pour prévenir la récidive (16 % contre 68 %), et l’on applique un inhibiteur calcique pendant 3 à 8 semaines ; les anesthésiques locaux et les bains de siège ne servent qu’au confort.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></section>
