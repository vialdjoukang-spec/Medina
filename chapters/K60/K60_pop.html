<template data-pop="pareto-k60-clinique" data-title="Loi de Pareto — Fissure et fistule anales"><p class="ratio" data-cover="k60-1,k60-3,k60-4,k60-5,k60-6,k60-7"></p><ul><li>La douleur déchirante à la selle et le sang rouge orientent vers une fissure.</li><li>Une fissure latérale ou multiple fait chercher une cause secondaire, en particulier un Crohn.</li><li>Les fibres ramollissent les selles et préviennent la récidive.</li><li>Le premier choix est l’inhibiteur calcique local, que l’on poursuit 6 semaines en cas de fissure chronique.</li><li>La fissurectomie est l’opération de premier choix, alors que la sphinctérotomie reste une exception.</li><li>On met à plat une fistule basse, mais on épargne le sphincter dans une fistule haute.</li></ul></template>
<template data-pop="pareto-k60-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k60-e-1"></p><ul><li>L’écartement des fesses montre la fissure dans la plupart des cas.</li><li>On fait une anuscopie après 6 à 8 semaines d’échec.</li><li>Une fissure atypique justifie une coloscopie avec biopsies.</li><li>On cartographie une fistule avant de l’opérer.</li></ul></template>
<template data-pop="pareto-k60-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k60-p-1,k60-p-2"></p><ul><li>Le premier choix est un inhibiteur calcique local, hors indication en Suisse.</li><li>Rectogesic® s’applique à 1,5 mg toutes les 12 h, pendant 8 semaines au plus.</li><li>On n’associe jamais un nitré à un inhibiteur de la PDE5.</li><li>On maintient les fibres après la guérison.</li></ul></template>
<template data-pop="k60-fis" data-title="Fissure anale"><p class="lab">Définition</p><p>C’est une plaie radiaire de l’anoderme, sous la ligne pectinée.</p><p class="lab">Siège</p><p>Elle se trouve à la commissure postérieure dans 80 à 90 % des cas, car cette zone est la moins bien vascularisée.</p><p class="lab">Signes</p><p>Le patient a une douleur déchirante à la selle, qui dure une à plusieurs heures, et du sang rouge sur le papier.</p><figure><img src="data:image/gif;base64,R0lGODdhzAFZAYUAANuvmdCggM+be8eaec2VdseVc8SUcsCUcsqOc8WObcOOcMONaMCOb8CMZr2MbLmMbciEdMOEbMCHacCAab2Gbb2GYryAbryAX7iFbbiEYbh+bLh+YLKDarGCYLF8YcZzbMByab1yZ7l3ZblsYrV3abR2XbRvYbRnX693Xq9xXqtzWqVyV61oZaxoUqVoVZ1mT7JdU6ZcVJteTJpXSaRQSJNPPccjHfwBAYdLMYE+KHwzHWswGmslEGUeCVYgDU0XBywAAAAAzAFZAUAI/wAHCBwgoKDBggESChiQsKHDhwgTClxIsCFFhgUHatw4UWABjwYKiAxZICRJAiJTJkiwYGXLAi4XyJQZc0GDli4N6CQJs0EFmRcqCPVZ4aZNn0Z/NlgqdMPKoguGIq1QQoVSnxmyZu3QIUOFrBUkSNBatMKFsxc2bChRYkMGtWo7sG3b9kUNFS3y5l2hoi8KFCrmqi2Bwq2KFys8KN6AwgOJxh4ab9CAwQNlDhgwHDjAgELmzxg4YM6cYQIF0QdCh94QGXDf168LU8bgmYPi24A9MP7LG3IH26IVuwa8gsODAw88rHjxYkaNHDp28ODRowf16tV//OChIweOGuBr0P8YH178jPPkx4/PK0NGCxN5XbjQS9/E3BYl8rKlf2KE//8n9AdgCzDA4F+BBfaHoIELNlhRAAdltJEAAQxU4UQSXcSRRiIR1JFABIQY4kgl8aSTSgkYkIBILCVwE1ItsvTSSjT2tNRSM7HEVFE44miTVDh9JRVUQPokk1loJSnUUBJ85UADGdyYwQorcKXVVl1xxRVkfa2FQgkJCNCkWBuooFZvjaHggAwvFNDVbXDeFlxkHjjQgQqtUUDABCoAhkJtFCjgmQbC4cabX4pdZplojML5l6EeVOXXYMPpdpsGGvwFF2tx8raCfCqk0NichqpAJXPLvSBDDThAJ1111F3/14N2tHKXw6045FpeDe7ppeoL9LXAXLDBwkDggjQ0qFeBBzLY4LMLjgDCCcweeMKGGlF4oUIfDtShtxt9NMCJBYgoAEolnkTASimxSKNNLRHFo1E6/uQikPDOFNW89LrkU5JJbpBWUEteyeMCPQl1FpIECxWVWhdEuaOQGXTlFVamZuVABqIxMMABitnm6AYV0EmnXxk44EBoHXiA5wpsQnZob2rBiahumAqXWGsbTOCzCECLkMLQLjDnQgkaWICpBiRowAHTwsUWKVsp+CpDCRGIEFhVem3d5220MSB2ZrahMLRfTDftNKmPjhaacQ8E99qnqrJ6qw46TKc3dj74/6BdDzt0l+ut3n23K3jqkYd4eYmnlziy4zF7wrEw9EdttZf/h6Dm4YI7kbYLSeSRuCTtdOIBHI6kkwIK7CS2TgmILfZmm5leAE44uugVVD8KuWRYX+V+pMIKo7WkWE2GFdXCZim8VlsCk/z771k1sKIBG1ewMtwZYKBl91pi8EDFXHnfwVcdUKl9Bg+0z+j7HLTsqF9ausZXV <template data-pop="k60-sec" data-title="Fissure secondaire"><p class="lab">Définition</p><p>Elle complique une maladie sous-jacente : maladie de Crohn, infection, traumatisme, chirurgie ou médicament comme le nicorandil.</p><p class="lab">Indices</p><p>Elle est plus souvent latérale, atypique et multiple.</p><p class="lab">Conduite</p><p>On fait un bilan adapté à l’anamnèse et, si l’on suspecte un Crohn, une coloscopie avec biopsies.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-sai" data-title="Sphincter interne"><p class="lab">Nature</p><p>C’est un muscle lisse involontaire qui assure l’essentiel du tonus anal de repos.</p><p class="lab">Rôle dans la fissure</p><p>Son hypertonie réduit la perfusion de l’anoderme et empêche la cicatrisation ; c’est pourquoi tous les traitements cherchent à le relâcher.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-mar" data-title="Repli sentinelle"><p class="lab">Aspect</p><p>C’est un repli de peau œdémateux et fibreux, à l’extrémité externe de la fissure.</p><p class="lab">Sens</p><p>Il signe une fissure chronique ; lors d’une opération, la S3 recommande de le réséquer avec les autres lésions secondaires.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-anusco" data-title="Anuscopie"><p class="lab">Principe</p><p>Un instrument court permet de voir l’intérieur du canal anal.</p><p class="lab">Limite</p><p>Elle est souvent impossible au début, à cause de la douleur et du spasme.</p><p class="lab">Indication</p><p>Elle devient obligatoire si la fissure persiste après 6 à 8 semaines ; si elle reste impossible, on examine le patient sous anesthésie.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-psyl" data-title="Psyllium"><p class="lab">Nature</p><p>C’est une fibre soluble qui retient l’eau et ramollit les selles.</p><p class="lab">Pourquoi dans la fissure ?</p><p>Une selle molle ne rouvre pas la plaie et déclenche moins de spasme ; de plus, les fibres poursuivies préviennent la récidive.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-icc" data-title="Inhibiteurs calciques locaux"><p class="lab">Mécanisme</p><p>Ils bloquent l’entrée du calcium dans la fibre lisse et relâchent le sphincter interne.</p><p class="lab">Place</p><p>C’est le premier choix médical de la S3, en aigu pendant 3 à 8 semaines et en chronique pendant au moins 6 semaines.</p><p class="lab">Statut suisse</p><p>Il s’agit de préparations magistrales, par exemple la nifédipine 0,2 % ou le diltiazem 2 %, utilisées hors indication.</p><p class="lab">Tolérance</p><p>La forme locale provoque des céphalées chez 16 % des patients, contre 37,5 % par voie orale.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-chim" data-title="Sphinctérotomie chimique"><p class="lab">Principe</p><p>On relâche le sphincter interne par un médicament, de façon réversible, au lieu de le couper.</p><p class="lab">Moyens</p><p>On utilise un inhibiteur calcique ou un dérivé nitré local, puis, si nécessaire, la toxine botulique.</p><p class="lab">Avantage</p><p>Ce traitement ne menace pas la continence.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-gtn" data-title="Trinitrate de glycéryle (Rectogesic®)"><p class="lab">Mécanisme</p><p>Il libère du monoxyde d’azote, qui relâche le muscle lisse du sphincter.</p><p class="lab">Dose</p><p>On applique 375 mg de pommade à 4 mg/g, soit 1,5 mg, dans le canal anal toutes les 12 h, pendant 8 semaines au plus.</p><p class="lab">Effet indésirable</p><p>Il provoque des céphalées chez environ 30 % des patients selon la S3, et chez 57 % selon la FI.</p><p class="lab">Contre-indication</p><p>On ne l’associe jamais à un inhibiteur de la PDE5.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Rectogesic®, Swissmedic (AIPS), consultée le 10.10.2026</a> ; <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-botu" data-title="Toxine botulique"><p class="lab">Mécanisme</p><p>Elle bloque la libération d’acétylcholine et paralyse le sphincter pendant plusieurs semaines.</p><p class="lab">Place</p><p>On la discute en deuxième ligne, après l’échec des pommades, à la place d’une chirurgie.</p><p class="lab">Dose</p><p>Lors d’une première injection dans un sphincter hypertonique, on injecte 20 à 40 U équivalent Botox® ; aucun effet dose n’a été démontré.</p><p class="lab">Statut suisse</p><p>Elle est utilisée hors indication.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse BOTOX®, Swissmedic (AIPS), consultée le 10.10.2026</a>.</p></template>
<template data-pop="k60-fissurect" data-title="Fissurectomie"><p class="lab">Geste</p><p>On excise la fissure et ses lésions secondaires, sans couper le sphincter.</p><p class="lab">Place</p><p>C’est l’opération de premier choix, éventuellement associée à la toxine ou à un lambeau d’avancement.</p><p class="lab">Obligation</p><p>Le tissu excisé doit être examiné en histologie, afin de ne pas manquer une lésion maligne.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>
<template data-pop="k60-lis" data-title="Sphinctérotomie latérale interne"><p class="lab">Geste</p><p>On sectionne une partie latérale du sphincter interne.</p><p class="lab">Avantage</p><p>Elle a le meilleur taux de guérison.</p><p class="lab">Risque</p><p>Elle expose davantage à l’incontinence ; on l’évite donc en première ligne, et surtout après un accouchement, en cas de tonus bas ou d’opération anale antérieure.</p><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00053-020-00448-7" target="_blank" rel="noopener">Marti L. et al., S3-Leitlinie: Analfissur (AWMF 081-010), coloproctology 2020;42:90-196</a>.</p></template>

<template data-pop="k60-abces" data-title="Abcès anorectal"><p class="lab">Mécanisme</p><p>Une glande anale infectée forme une collection de pus entre les plans musculaires.</p><p class="lab">Lien</p><p>Un tiers à la moitié des patients qui ont un abcès présentent aussi une fistule.</p><p class="lab">Conduite</p><p>On le draine chirurgicalement en urgence ; ce sujet est traité dans le cours K61.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>
<template data-pop="k60-parks" data-title="Classification de Parks"><p class="lab">Types</p><p>La fistule est intersphinctérienne, transsphinctérienne ou suprasphinctérienne ; les formes sous-anodermiques et extrasphinctériennes ne sont pas typiques.</p><p class="lab">Pourquoi</p><p>Le type indique quelle part du sphincter le trajet traverse, et donc le risque d’incontinence si on l’ouvre.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>

<template data-pop="k60-fistulot" data-title="Fistulotomie"><p class="lab">Geste</p><p>On ouvre le trajet sur toute sa longueur, puis la plaie cicatrise à plat.</p><p class="lab">Indication</p><p>On la fait pour les fistules superficielles et pour les transsphinctériennes qui intéressent moins d’un tiers du sphincter.</p><p class="lab">Résultats</p><p>Elle guérit plus de 90 % des cas, avec des troubles de la continence chez 6 à 12 % des opérés.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>
<template data-pop="k60-seton" data-title="Séton de drainage"><p class="lab">Principe</p><p>Un fil passé dans le trajet empêche l’orifice externe de se fermer, si bien que le pus s’écoule et qu’aucun nouvel abcès ne se forme.</p><p class="lab">Indications</p><p>On le pose lors du drainage d’un abcès sur fistule haute, avant une cure définitive, ou à long terme si la fistule est très complexe.</p><p class="lab">Règle</p><p>Il ne doit pas provoquer de douleur.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>
<template data-pop="k60-lift" data-title="Technique LIFT"><p class="lab">Principe</p><p>On lie et l’on sectionne le trajet dans l’espace entre les deux sphincters, sans couper le muscle.</p><p class="lab">Place</p><p>C’est une alternative au lambeau d’avancement dans les fistules transsphinctériennes hautes, réalisée par un chirurgien expérimenté.</p><p class="lab">Résultats</p><p>Ses taux de guérison et de continence ne diffèrent pas significativement de ceux des lambeaux.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/088-003l_S3_Kryptoglandulaere_Analfisteln_2026-06.pdf" target="_blank" rel="noopener">Jaschke et al., S3-Leitlinie Kryptoglanduläre Analfistel, version 3.1, 2026 (AWMF 088-003)</a>.</p></template>
