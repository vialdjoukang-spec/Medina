<template data-pop="n02-exp-1" data-title="1. Définition : un phénotype, plusieurs maladies"><p>L’hématurie correspond à la présence d’érythrocytes dans l’urine. Elle est macroscopique si le sang est visible et microscopique s’il est détecté par analyse. La bandelette réagit aussi à l’hémoglobine et à la myoglobine : une réaction positive n’est donc pas, à elle seule, la preuve d’érythrocytes urinaires. Le résultat se confirme par une mesure cellulaire et, lorsque l’origine rénale est discutée, par l’examen du sédiment.</p><p><b>Récidivante</b> décrit des épisodes séparés ; <b>persistante</b> décrit une anomalie retrouvée sur plusieurs prélèvements. Les définitions temporelles varient selon le contexte. Le guide européen Alport utilise au moins deux prélèvements sur six à douze mois ; l’approche européenne pédiatrique recherche la persistance sur trois à cinq examens en trois à six mois. Ces durées organisent l’évaluation d’une personne stable : elles ne justifient jamais d’attendre devant une insuffisance rénale, une protéinurie importante ou des signes systémiques.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" rel="noopener" target="_blank">CH-CIM — XML :N02,N00–N08,modificateurS14N00_4 .0–.9</a>.</p></template>
<template data-pop="pareto-n02-1" data-title="Raisonnement essentiel — 1. Définition : un phénotype, plusieurs maladies"><p>Confirmer les hématies, distinguer le phénotype de sa cause et ne pas déduire un pronostic du mot bénin.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a>.</p></template>
<template data-pop="n02-exp-2" data-title="2. Épidémiologie et populations à risque"><p>La fréquence observée de la microhématurie dépend du seuil utilisé, de l’âge, du dépistage, du nombre de prélèvements et des causes transitoires exclues. Les séries de population, de consultations et de biopsies ne mesurent pas le même phénomène. Les sources retenues ne fournissent pas une incidence suisse fiable de la catégorie clinique N02 : aucun chiffre national n’est extrapolé à partir d’une cohorte étrangère.</p><p>Chez les enfants et les jeunes adultes ayant une microhématurie glomérulaire persistante, les maladies liées à COL4 A3, COL4 A4 ou COL4 A5 et la néphropathie à IgA occupent une place importante dans le diagnostic différentiel. Une variante hétérozygote de COL4 A3 ou COL4 A4 peut être fréquente dans la population, mais sa présence ne signifie pas que toute personne développera une insuffisance rénale. Les familles adressées en centre spécialisé enrichissent les séries en phénotypes sévères.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux3–6 et sections diagnostic primaire/imagerie/génétique</a>.</p></template>
<template data-pop="pareto-n02-2" data-title="Raisonnement essentiel — 2. Épidémiologie et populations à risque"><p>Le dénominateur et la population changent la fréquence observée ; aucune incidence suisse N02 n’est extrapolée.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a>.</p></template>
<template data-pop="n02-exp-3" data-title="3. Physiopathologie : du filtre au signe urinaire"><p>Le filtre glomérulaire associe endothélium capillaire, membrane basale et podocytes. Une atteinte de ce dispositif peut laisser passer des érythrocytes et des protéines dans l’espace urinaire. La morphologie érythrocytaire se modifie au cours de ce passage et du trajet urinaire ; des acanthocytes ou des cylindres érythrocytaires orientent vers une origine glomérulaire. Leur absence dans un prélèvement ne suffit pas à exclure cette origine.</p><p>Dans les maladies liées au collagène IV, une anomalie génétique altère une composante structurale de la membrane basale glomérulaire. Selon le génotype et le stade, l’aspect peut être aminci, irrégulier ou lamellé. Le défaut structural explique l’hématurie précoce ; l’apparition d’albuminurie, la perte podocytaire et les lésions secondaires de sclérose annoncent un risque plus important. Une lésion de sclérose segmentaire secondaire ne transforme pas cette maladie en indication automatique d’immunosuppression.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a> ; <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/25-4-microscopic-anatomy-of-the-kidney" rel="noopener" target="_blank">NORMAL-FILTRE — Corpuscule,barrière,tubules ; cortex,médulla,voieexcrétrice selon section</a>.</p></template>
<template data-pop="pareto-n02-3" data-title="Raisonnement essentiel — 3. Physiopathologie : du filtre au signe urinaire"><p>Un signe commun peut traduire un défaut structural, une maladie immune ou une lésion des voies excrétrices.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a>.</p></template>
<template data-pop="n02-exp-4" data-title="4. Démarche clinique : décider du délai avant de multiplier les tests"><p><b>Première étape : rechercher une complication.</b> Une baisse rapide de fonction rénale, une oligurie, une dyspnée avec suspicion de surcharge ou d’hémorragie pulmonaire, une hypertension sévère avec retentissement, ou un saignement visible mal toléré imposent une évaluation urgente. Des caillots avec impossibilité d’uriner font rechercher une rétention. Ces tableaux sortent de la surveillance d’une microhématurie isolée.</p><p><b>Deuxième étape : valider le prélèvement.</b> Vérifier règles, contamination génitale, infection, exercice intense récent, traumatisme, couleur des urines et médicaments. Une cause transitoire plausible se traite ou disparaît puis le contrôle est organisé ; l’anomalie persistante ne doit pas rester attribuée indéfiniment à cet épisode. Sous anticoagulant, rechercher la source du saignement au lieu d’en faire une explication suffisante.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p122 mal extrait</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux3–6 et sections diagnostic primaire/imagerie/génétique</a>.</p></template>
<template data-pop="pareto-n02-4" data-title="Raisonnement essentiel — 4. Démarche clinique : décider du délai avant de multiplier les tests"><p>La gravité décide du délai ; la répétition sur plusieurs mois ne s’applique qu’au patient stable.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a>.</p></template>
<template data-pop="n02-exp-5" data-title="5. Anamnèse analytique"><p>Un épisode d’urines foncées pendant une infection peut orienter vers une néphropathie à IgA ; il ne prouve ni l’IgA ni une maladie postinfectieuse. Demander les comptes rendus antérieurs et leurs dates est plus utile que retenir un délai approximatif reconstruit plusieurs années après. Une maladie familiale dite « bénigne » mérite une reformulation prudente lorsque l’on découvre une albuminurie ou une baisse de fonction.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a>.</p></template>
<template data-pop="pareto-n02-5" data-title="Raisonnement essentiel — 5. Anamnèse analytique"><p>Chronologie, famille et expositions donnent des hypothèses ; les examens apportent les preuves.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p></template>
<template data-pop="n02-exp-6" data-title="6. Examen clinique : chercher le retentissement et les indices extrarénaux"><p>Mesurer la pression dans des conditions adaptées, rechercher les valeurs antérieures et répéter une mesure inattendue. Chez l’enfant, interpréter avec les références pédiatriques ; le seuil et l’objectif d’un adulte ne se transposent pas. Évaluer poids, œdèmes, état d’hydratation et signes de surcharge. Une pression normale et l’absence d’œdèmes n’excluent pas une atteinte glomérulaire débutante.</p><p>Examiner abdomen et régions lombaires selon les symptômes ; une douleur, une masse ou une rétention orientent mais ne remplacent pas l’imagerie. Inspecter la peau lorsqu’un purpura ou une maladie systémique est évoqué, rechercher les signes articulaires et respiratoires associés. Une dyspnée, une désaturation ou une altération générale imposent de sortir du simple bilan ambulatoire.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux3–6 et sections diagnostic primaire/imagerie/génétique</a>.</p></template>
<template data-pop="pareto-n02-6" data-title="Raisonnement essentiel — 6. Examen clinique : chercher le retentissement et les indices extrarénaux"><p>L’examen cherche le retentissement ; une consultation rassurante n’annule pas une albuminurie.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a>.</p></template>
<template data-pop="n02-exp-7" data-title="7. Syndromes et classifications utiles"><p>La classification génétique Alport distingue COL4 A5 lié à l’X, variants bialléliques COL4 A3/4 et variants hétérozygotes COL4 A3/4. Les risques et le moment de début du traitement ne sont pas identiques. Dans l’IgA biopsiée, MEST-C décrit des lésions histologiques ; ce n’est ni un score clinique de bandelette ni un déclencheur autonome de corticoïdes. Les cylindres ou un croissant isolé ne suffisent pas non plus à définir une progression rapide.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></template>
<template data-pop="pareto-n02-7" data-title="Raisonnement essentiel — 7. Syndromes et classifications utiles"><p>Les profils isolé, protéinurique et rapidement progressif n’imposent pas les mêmes examens.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a>.</p></template>
<template data-pop="n02-exp-8" data-title="8. Diagnostic positif : distinguer le signe et sa cause"><p>La première preuve est la présence d’érythrocytes dans un échantillon correctement recueilli. Les seuils ne sont pas universels : les HUG retiennent un seuil physiologique local de 26 millions/L, soit 26/µL, approximativement cinq hématies par champ ; le manuel français CUEN emploie au moins 10/µL. Le nombre par champ dépend de la préparation et de la méthode. Utiliser la référence du laboratoire et écrire l’unité évite de transformer une divergence technique en contradiction clinique.</p><p>L’origine glomérulaire est soutenue par des hématies dysmorphiques, particulièrement des acanthocytes, et des cylindres érythrocytaires. La stratégie HUG cite plus de 60 % de dysmorphie ou plus de 5 % d’acanthocytes ; la recommandation européenne pour jeunes utilise également le repère d’environ 5 % d’acanthocytes. Ces résultats dépendent de l’expertise et du prélèvement : un sédiment peu contributif ne ferme pas le dossier si les autres indices persistent.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></template>
<template data-pop="pareto-n02-8" data-title="Raisonnement essentiel — 8. Diagnostic positif : distinguer le signe et sa cause"><p>IgA exige une biopsie ; un variant génétique exige une interprétation clinique et familiale.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a>.</p></template>
