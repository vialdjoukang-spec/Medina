<template data-pop="n02-exp-9" data-title="9. Explorations : une question avant chaque prescription"><p>Le bilan initial associe confirmation urinaire, sédiment, quantification de l’albuminurie/protéinurie, créatinine et estimation du débit, pression artérielle et échographie selon le contexte. Les HUG proposent notamment numération, électrolytes, albumine et marqueurs orientés par la présentation. Un panel immunologique large n’est pas un réflexe nécessaire pour toute hématurie isolée ; il devient pertinent si le tableau suggère une maladie systémique ou une glomérulonéphrite active.</p><p>Le rapport albumine/créatinine mesure la composante albuminurique ; le rapport protéines/créatinine mesure les protéines totales. Ils ne sont pas interchangeables. Un prélèvement du matin facilite l’interprétation chez le jeune et aide à examiner une composante orthostatique. Une hématurie visible peut augmenter la protéinurie mesurée par apport de sang : recontrôler sur urines claires pour apprécier la protéinurie rénale persistante, sans différer la prise en charge d’un tableau grave.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></template>
<template data-pop="pareto-n02-9" data-title="Raisonnement essentiel — 9. Explorations : une question avant chaque prescription"><p>Chaque examen doit répondre à une question de localisation, de gravité ou de mécanisme.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a>.</p></template>
<template data-pop="n02-exp-10" data-title="10. Arbre diagnostique et diagnostics différentiels"><p></p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://manuel.cuen.fr/wp-content/uploads/2025/10/CUEN-12e-ed-Chap7-hematurie.pdf" rel="noopener" target="_blank">EU-HEMAT — pp.118–123, texte hors arbre p122 mal extrait</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></template>
<template data-pop="pareto-n02-10" data-title="Raisonnement essentiel — 10. Arbre diagnostique et diagnostics différentiels"><p>Séparer pigment, saignement urinaire, origine glomérulaire et cause étiologique.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a>.</p></template>
<template data-pop="n02-exp-11" data-title="11. Prise en charge : traiter le risque démontré"><p><b>Hématurie isolée.</b> Il n’existe pas de prescription anti-inflammatoire ou immunosuppressive justifiée par la seule présence d’hématies. Expliquer le résultat, documenter une base de pression/fonction/protéines et organiser le suivi. Traiter une infection ou un calcul lorsqu’ils sont établis ; rechercher une lésion urologique selon risque. Les mesures générales incluent arrêt du tabac et contrôle des facteurs rénaux et cardiovasculaires pertinents.</p><p><b>Maladie du collagène IV.</b> Le blocage du système rénine–angiotensine est la base de néphroprotection. ERKNet/ERA/ESPN recommande de le débuter et titrer à la dose maximale tolérée dès la microalbuminurie, quel que soit le sous-type. Chez les garçons/mâles avec forme liée à l’X et dans les formes autosomiques récessives, un début après deux ans peut être proposé dès l’hématurie. En revanche, chez les femmes avec forme liée à l’X et les hétérozygotes COL4 A3/4, l’hématurie isolée seule ne justifie pas ce début précoce. Ces distinctions empêchent de prescrire le même traitement à toute famille.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></template>
<template data-pop="pareto-n02-11" data-title="Raisonnement essentiel — 11. Prise en charge : traiter le risque démontré"><p>Traiter un risque démontré ; une hématurie seule ne justifie pas une immunosuppression.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a>.</p></template>
<template data-pop="n02-exp-12" data-title="12. Prévention, suivi et pronostic"><p>Le suivi surveille une trajectoire, pas seulement la disparition du sang. Documenter pression, albuminurie/protéinurie, créatinine/débit, épisodes visibles, symptômes extrarénaux et tolérance thérapeutique. Une augmentation des protéines, une hypertension nouvelle ou une baisse de fonction change la catégorie de risque et le rythme des consultations. Le patient doit savoir qui contacter et quels signes imposent une consultation anticipée.</p><p>Pour les adultes asymptomatiques hétérozygotes COL4 A3/4, le guide européen suggère un dépistage urinaire tous les un à deux ans et une pression au moins annuelle, adapté à l’histoire familiale. Lorsque l’albuminurie dépasse 30 mg/g sur deux prélèvements et qu’un traitement rénine–angiotensine est instauré, le débit et l’albuminurie sont suivis en général tous les six à douze mois, plus souvent selon stade et évolution. Ce calendrier de maladie stable n’est pas celui des contrôles de sécurité juste après une introduction ou une augmentation de médicament.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></template>
<template data-pop="pareto-n02-12" data-title="Raisonnement essentiel — 12. Prévention, suivi et pronostic"><p>Le suivi porte sur pression, protéines et trajectoire de fonction ; le sang seul ne résume pas le risque.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a>.</p></template>
<template data-pop="n02-exp-13" data-title="13. Points clés et entraînement clinique"><p>Les exercices ci-dessous sont originaux et fictifs. Le rapprochement pédagogique avec PROFILES 2017 concerne notamment l’hématurie (SSP64), les anomalies histologiques/génétiques (SSP159), la fonction rénale (SSP161), le sédiment urinaire (SSP164) et la protéinurie (SSP173). Les exigences MEBEKO lues concernent l’examen 2026. Il ne s’agit ni d’un mapping officiel CIM–PROFILES ni de questions fédérales reproduites.</p><p><button class="w" data-k="n02-cas-1">Cas clinique 1 — raisonner avant de traiter</button></p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fi <template data-pop="pareto-n02-13" data-title="Raisonnement essentiel — 13. Points clés et entraînement clinique"><p>Relier le signe au raisonnement clinique et distinguer exercice original et question fédérale officielle.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" rel="noopener" target="_blank">CH-PROFILES — pp.29,32 :SSP64,159,161,164,173</a>.</p></template>
<template data-pop="n02-exp-14" data-title="14. Pièges à éviter"><p></p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-URO — §4.2 pp.6–9</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et16, pp.5–8</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-TX — §1.4 recommandations1.4.3.1–2 et1.4.4.1–3, pp.S18–S25</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" rel="noopener" target="_blank">FI-FORXIGA — IndicationMRC,posologie rénale/hépatique,mises en garde,interactions,grossesse</a>.</p></template>
<template data-pop="pareto-n02-14" data-title="Raisonnement essentiel — 14. Pièges à éviter"><p>Un indice n’est pas une preuve, une normalité initiale n’est pas une promesse, un plafond n’est pas une dose obligatoire.</p><p>Reprendre les critères, méthodes et limites de la section avant une décision individuelle.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a>.</p></template>
<template data-pop="n02-calcul-acr" data-title="Calculer un rapport sans perdre l’analyte"><p>Sur un même prélèvement fictif, l’albumine est à 60 mg/L et la créatinine à 1 g/L. Le rapport albumine/créatinine vaut 60 ÷ 1 = 60 mg/g ; les litres s’annulent. Ce résultat ne vaut ni 60 g/g ni 60 mg d’albumine par jour.</p><p>Si l’on mesure les protéines totales à 1,2 g/L et la créatinine à 1 g/L, le rapport protéines/créatinine vaut 1,2 g/g. Ce second analyte correspond aux seuils de certains traitements IgA ; le premier correspond notamment au suivi albuminurique du collagène IV. Les deux ne sont pas interchangeables.</p><p>Ces nombres illustrent le calcul, pas une indication isolée. Vérifier la persistance, la présence de sang visible, le contexte et les unités du laboratoire avant d’appliquer un seuil clinique.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13141067/" rel="noopener" target="_blank">EU-YOUNG — Résumé, tableaux 3–6 et sections diagnostic primaire/imagerie/génétique</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-SUIVI — Q12–14,Q19–20, pp.6–7,10–11</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></template>
<template data-pop="n02-calcul-dose" data-title="Dose par surface : un exemple européen hors indication suisse"><p>Exemple pédagogique fictif : une surface corporelle déjà mesurée à 0,8 m² et une dose de ramipril de 1 mg/m²/j donnent 1 × 0,8 = 0,8 mg/j. Le maximum européen de 6 mg/m²/j donnerait 4,8 mg/j pour cette même surface. Ce calcul explique les unités ; il ne choisit ni formulation, ni arrondi, ni dose pour un enfant réel.</p><p>ERKNet/ERA/ESPN propose un début à 1–2 mg/m²/j dans Alport. La FI suisse Ramipril Zentiva ne recommande pas le produit avant 18 ans. La prescription pédiatrique demeure spécialisée et hors indication, avec surveillance ; ne pas confondre mg/m², mg/kg et mg par personne.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680581590171" rel="noopener" target="_blank">FI-RAMIPRIL — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></template>
<template data-pop="n02-cas-1" data-title="Cas 1 — La bandelette ne suffit pas"><p><b>Exercice original fictif.</b></p><p>Une personne sans symptôme a une bandelette positive après une course intense. Sa créatinine est stable. Le premier objectif est de confirmer les érythrocytes et de contrôler dans des conditions adaptées, tout en recherchant une cause transitoire et les paramètres de risque. La bandelette ne démontre ni une IgA, ni une indication de scanner ou de corticoïde.</p><p>Si l’anomalie persiste, documenter sédiment, protéines, pression et fonction, puis choisir une orientation. Si une complication apparaît, le délai change immédiatement.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-DEF — pp.1–4 ; p.2 algorithme réellement visualisé</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a>.</p></template>
<template data-pop="n02-cas-2" data-title="Cas 2 — Une famille, plusieurs risques"><p><b>Exercice original fictif.</b></p><p>Une jeune femme et sa mère ont une hématurie persistante. L’audition paraît normale et l’albuminurie n’est pas encore connue. Reconstituer l’arbre familial, mesurer albuminurie et fonction, et discuter une analyse COL4 A3/4/5. L’absence de surdité ne suffit pas à exclure une maladie du collagène IV.</p><p>Ne pas promettre une maladie bénigne et ne pas débuter un traitement sur le seul caractère familial. Génotype et albuminurie déterminent notamment le moment du blocage rénine–angiotensine.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-GEN — Introduction,Q1–2,Q4–9, pp.2–5</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-TX — Q17–18, pp.8–10</a>.</p></template>
<template data-pop="n02-cas-3" data-title="Cas 3 — Un chiffre change la question"><p><b>Exercice original fictif.</b></p><p>Chez un adulte avec hématurie glomérulaire persistante et protéinurie de 0,7 g/j, une IgA fait partie des hypothèses. KDIGO propose de considérer une biopsie à partir de 0,5 g/j lorsque l’IgA est possible et le geste réalisable. Ce seuil n’établit pas l’IgA : la biopsie apporte la preuve.</p><p>Ce même chiffre ne correspond pas automatiquement aux indications suisses Filspari ou Kinpeygo, qui retiennent au moins 1 g/j ou leur rapport protéines/créatinine propre. Une concentration d’IgA sérique ne remplace pas le diagnostic rénal.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-DX — §1.2–1.3, pp.S15–S17 etS32–S33</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692410016" rel="noopener" target="_blank">FI-FILSPARI — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680692050014" rel="noopener" target="_blank">FI-KINPEYGO — Indications,posologie,organes,contre-indications,mises en garde,interactions,grossesse ; lecture ciblée</a>.</p></template>
<template data-pop="n02-cas-4" data-title="Cas 4 — La trajectoire décide de l’urgence"><p><b>Exercice original fictif.</b></p><p>Une personne suivie pour hématurie développe dyspnée et hausse rapide de créatinine. Il faut évaluer immédiatement le retentissement et organiser une prise en charge urgente, sans attendre plusieurs mois de prélèvements. Une histoire ancienne stable n’explique pas automatiquement la nouvelle détérioration.</p><p>Un génotype connu n’exclut pas une maladie surajoutée ; des croissants seuls ne définissent pas une IgA rapidement progressive. Le bilan réunit fonction, clinique et histologie selon le contexte.</p><p class="src">Sources lues : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/2024-10/strategie_microhematurie_doi.pdf" rel="noopener" target="_blank">CH-HUG-ORIENT — §4.1 pp.4–6, algorithme p.2</a> ; <a data-reference-source="1" href="https://www.erknet.org/fileadmin/Guidelines/Torra_et_al.__2025__Diagnosis__management_and_treatment_of_the_Alport_syndrome.pdf" rel="noopener" target="_blank">EU-ALPORT-RISK — Q10–12 et 16, pp.5–8</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2026/04/KDIGO-2025-IgAN-IgAV-Guideline.pdf" rel="noopener" target="_blank">INT-IGA-SPECIAL — §1.5 pp.S26–S28</a>.</p></template>
