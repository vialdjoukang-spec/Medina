<template data-pop="r05-d-dextro" data-title="Dextrométhorphane"><p class="lab">Mécanisme</p><p>Dérivé morphinique qui, avec son métabolite actif le dextrorphane, élève le seuil d’excitation central de la toux ; le dextrorphane est aussi antagoniste des récepteurs NMDA.</p><p class="lab">Posologie (Bexine® sirop, 12,5 mg par mesure de 5 mL)</p><p>Adulte et adolescent : 25 mg trois à quatre fois par jour, la dernière dose au coucher ; enfant de 6 à 12 ans : 12,5 mg ; de 1 à 6 ans : 6,25 mg. Quatre jours au plus en automédication, deux à trois semaines sur prescription.</p><p class="lab">Contre-indications et précautions</p><p>Inhibiteur de la monoamine oxydase ou médicament sérotoninergique en cours ou arrêté depuis moins de 14 jours ; enfant de moins d’un an ; intolérance héréditaire au fructose ; allergie aux parabènes. Potentiel d’abus, surtout chez l’adolescent et le jeune adulte ; élimination ralentie chez le métaboliseur lent du CYP2D6 ; grossesse après évaluation critique, allaitement déconseillé.</p><div class="key"><b>Preuves.</b> Efficace sur la durée et l’intensité de la toux aiguë selon la Société allemande de pneumologie ; efficacité contestée selon la SSI (2026).</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Bexine® sirop contre la toux, Swissmedic (AIPS, mise à jour 03.2026), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 2</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, « Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte », version 40978 validée le 01.09.2026</a>.</p></template>
<template data-pop="r05-d-codeine" data-title="Codéine"><p class="lab">Mécanisme</p><p>Alcaloïde de l’opium qui inhibe le centre bulbaire de la toux ; le foie en transforme 5 à 20 % en morphine par le CYP2D6.</p><p class="lab">Posologie (Codein Knoll®, 50 mg)</p><p>Toux sèche et irritative de l’adulte : 50 mg une à trois fois par 24 heures, après les repas ; au plus 100 mg par prise et 200 mg par jour, le moins longtemps possible.</p><p class="lab">Contre-indications et risques</p><p>Moins de 18 ans, allaitement, métaboliseur ultrarapide connu du CYP2D6, dépendance aux opiacés, stase des sécrétions bronchiques, situation où une dépression respiratoire doit être évitée. Dépression respiratoire, apnées centrales du sommeil, tolérance, dépendance, constipation. Pendant la grossesse, seulement en cas de nécessité absolue, surtout pas au premier trimestre ; l’usage prolongé expose au syndrome de sevrage néonatal.</p><div class="key"><b>Place.</b> Pas mieux que le placebo dans la toux aiguë (NICE, SSI) ; non recommandée dans la toux chronique par l’ERS, car son effet dépend du CYP2D6.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Codein Knoll®, Swissmedic (AIPS, mise à jour 08.2026), consultée le 09.10.2026</a> ; <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE, toux aiguë, février 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-d-morphine" data-title="Morphine à faible dose dans la toux réfractaire"><p class="lab">Preuves</p><p>Essai randomisé croisé en double aveugle de Morice (2007) : chez 27 patients, quatre semaines de morphine à libération prolongée, 5 mg deux fois par jour, ont amélioré le questionnaire de Leicester de 3,2 points par rapport à l’état initial et réduit de 40 % le score quotidien de toux. En extension, deux tiers des patients ont choisi 10 mg deux fois par jour, avec un bénéfice semblable à trois mois. L’ERS en fait une recommandation forte (preuve modérée) ; la réponse survient en une semaine, et l’essai est arrêté sans réponse en une à deux semaines. Doses et taux de réponse divergent selon les sources (<button class="w" data-k="r05-contentieux-morphine">contentieux</button>).</p><p class="lab">Statut en Suisse</p><p>Hors indication : la morphine retard est autorisée pour les douleurs. Aucune forme retard à 5 mg n’a été trouvée : Kapanol® et MST Continus® commencent à 10 mg, Sevre-Long® à 30 mg.</p><p class="lab">Précautions</p><p>Contre-indications (Kapanol®) : troubles du centre ou de la fonction respiratoires, affections obstructives des voies aériennes, iléus paralytique, hypertension intracrânienne. Effets fréquents dans l’essai : constipation et somnolence. L’association aux benzodiazépines ou à d’autres dépresseurs du système nerveux central expose à la dépression respiratoire et au coma.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17122382/" target="_blank" rel="noopener">Morice et al., Am J Respir Crit Care Med 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, recommandation 6a</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Kapanol® (11.2024), MST Continus® (05.2024) et Sevre-Long® (05.2024), Swissmedic (AIPS), consultées le 09.10.2026</a>.</p></template>
<template data-pop="r05-d-gabapentine" data-title="Gabapentine dans la toux réfractaire"><p class="lab">Preuves</p><p>Essai randomisé de Ryan (2012) : 62 patients, gabapentine jusqu’à 1800 mg par jour pendant 10 semaines ; le questionnaire de Leicester s’est amélioré de 1,80 point par rapport au placebo, avec 3,58 patients à traiter pour un bénéfice ; effets indésirables chez 31 % contre 10 %, surtout nausées et fatigue. La Société allemande de pneumologie estime la réponse à environ 20 %, avec une dose habituelle de 900 mg par jour au plus.</p><p class="lab">Posologie de référence (Neurontin®, douleurs neuropathiques)</p><p>300 mg le premier jour, 600 mg le deuxième, 900 mg dès le troisième, en trois prises. Selon la clairance : 600 à 1200 mg par jour entre 50 et 79 mL/min, 300 à 900 mg entre 30 et 49, 150 à 600 mg entre 15 et 29, 150 à 300 mg en dessous.</p><p class="lab">Risques</p><p>Vertiges (12 %), somnolence, chutes ; dépression respiratoire sévère chez l’insuffisant respiratoire ou rénal, le sujet âgé et avec d’autres dépresseurs ; idées suicidaires ; usage nocif et dépendance. Hors indication en Suisse pour la toux.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22951084/" target="_blank" rel="noopener">Ryan et al., Lancet 2012</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Neurontin®, Swissmedic (AIPS, mise à jour 04.2025), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 12.c</a>.</p></template>
<template data-pop="r05-d-pregabaline" data-title="Prégabaline dans la toux réfractaire"><p class="lab">Preuves</p><p>Un seul essai randomisé : prégabaline 300 mg par jour associée à la logopédie, contre placebo et logopédie. Gain de 3,5 points au questionnaire de Leicester (différence minimale importante : 1,3) et de 25,1 points de sévérité sur 100, sans baisse de la fréquence de la toux : l’effet porterait sur la perception plutôt que sur le réflexe.</p><p class="lab">Posologie de référence (douleurs neuropathiques)</p><p>150 mg par jour en deux ou trois prises, puis 300 mg après 3 à 7 jours ; réduction selon la clairance de la créatinine.</p><p class="lab">Risques</p><p>Vertiges, fatigue, troubles cognitifs, nausées, vision floue ; avec les gabapentinoïdes, risque d’arrêt pour effet indésirable 2,3 fois celui du placebo. Hors indication en Suisse pour la toux.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, recommandation 6b</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Prégabaline Sandoz®, Swissmedic (AIPS, mise à jour 04.2024), consultée le 09.10.2026</a>.</p></template>
<template data-pop="r05-d-gefapixant" data-title="Géfapixant (Lyfnua®)"><p class="lab">Mécanisme</p><p>Antagoniste sélectif du récepteur purinergique P2X3, canal activé par l’ATP sur les fibres sensitives vagales : il bloque le signal de souffrance cellulaire transmis au réflexe.</p><p class="lab">Indication et posologie en Suisse</p><p>Toux chronique réfractaire ou inexpliquée de l’adulte, après recherche des causes par un spécialiste ; traitement instauré et suivi par un médecin expérimenté. 45 mg deux fois par jour ; 45 mg une fois par jour si le débit de filtration glomérulaire estimé est inférieur à 30 mL/min/1,73 m² sans dialyse. Non étudié en dialyse ni dans l’insuffisance hépatique.</p><p class="lab">Preuves</p><p>COUGH-1 (730 patients, 12 semaines) et COUGH-2 (1314 patients, 24 semaines) : patients surtout féminins, âge moyen 58 ans, toux depuis 11 ans. La fréquence de la toux a baissé de 18,5 % et de 14,6 % de plus que sous placebo (<button class="w" data-k="r05-contentieux-gefapixant">ampleur de l’effet</button>) ; la dose de 15 mg était inefficace.</p><p class="lab">Effets indésirables</p><p>Dysgueusie (41 %), agueusie (15 %), hypogueusie (11 %), surtout dans les neuf premiers jours et réversibles ; arrêt pour effet indésirable chez 22 % ; lithiases urinaires occasionnelles ; infections respiratoires basses numériquement plus fréquentes.</p><p class="lab">Précautions</p><p>Allergie aux sulfamides ; à ne pas utiliser en cas d’apnée obstructive du sommeil associée, car une forte dose a abaissé la saturation nocturne ; déconseillé pendant la grossesse. Peu d’interactions.</p><p class="lab">Remboursement</p><p>Au 09.10.2026, les deux emballages de Lyfnua® (56 et 196 comprimés, catégorie B) figurent sans prix public ni quote-part dans la base de médicaments ywesee (oddb.org), qui reprend la liste des spécialités : le médicament n’y est pas inscrit et n’est donc pas remboursé d’office. En Allemagne, autorisé depuis septembre 2023, il n’était pas commercialisé en janvier 2025.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Lyfnua®, Swissmedic (AIPS, mise à jour 11.2024), consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35248186/" target="_blank" rel="noopener">McGarvey et al., Lancet 2022</a> ; <a href="https://ch.oddb.org/de/gcc/search/zone/drugs/search_query/Lyfnua/search_type/st_oddb" target="_blank" rel="noopener">base de médicaments ywesee (oddb.org), Lyfnua®, consulté le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 6 et 12.c</a>.</p></template>
<template data-pop="r05-d-csi" data-title="Corticoïdes inhalés et antileucotriènes dans la toux chronique"><p class="lab">ERS 2020</p><p>Essais conditionnels de 2 à 4 semaines : corticoïde inhalé chez l’adulte et chez l’enfant à toux sèche ; antileucotriène, surtout dans la toux asthmatique ; corticoïde inhalé et bronchodilatateur de longue durée d’action en cas d’obstruction fixe. Sans réponse à ce terme, l’essai est arrêté. Le bronchodilatateur seul n’est pas un traitement d’entretien ; une semaine de prednisolone orale peut réduire nettement la toux asthmatique.</p><p class="lab">Montélukast</p><p>10 mg le soir chez l’adulte (information professionnelle : asthme, rhinite allergique) ; effets neuropsychiatriques rapportés (rêves anormaux, agitation, dépression, idées suicidaires).</p><div class="key"><b>Précaution.</b> L’ERS signale le risque de pneumonie lié à la fluticasone chez le patient atteint de BPCO.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 3</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Montélukast Sandoz®, Swissmedic (AIPS, mise à jour 10.2023)</a>.</p></template>
<template data-pop="r05-d-ipp" data-title="Inhibiteurs de la pompe à protons dans la toux"><p class="lab">Preuves</p><p>Sans reflux acide, aucun bénéfice sur le placebo ; avec reflux prouvé et symptômes typiques, gain d’environ 15 à 20 %. L’ésoméprazole, à 20 mg deux fois par jour pendant 8 semaines ou à 40 mg deux fois par jour pendant 12 semaines chez des patients sans pyrosis, n’a pas fait mieux que le placebo.</p><p class="lab">Schémas</p><p>Société allemande de pneumologie : ésoméprazole 40 mg deux fois par jour avant les repas, jusqu’à 12 semaines, seulement en cas de pyrosis ou de régurgitations. HUG : pantoprazole ou oméprazole 40 mg par jour, voire davantage, pendant trois mois, avec arrêt du tabac, tête du lit surélevée et dernier repas deux à trois heures avant le coucher. Nexium® : 40 mg une fois par jour dans l’œsophagite de reflux, 20 mg dans le reflux symptomatique ; la forte dose biquotidienne dépasse cette posologie.</p><div class="key"><b>Risques.</b> Des études observationnelles associent le traitement prolongé à des carences en fer et en vitamine B12, à une hypomagnésémie, à des diarrhées à Clostridioides difficile, à des fractures et à des pneumonies.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 4</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 8</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.5</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS, mise à jour 06.2026)</a>.</p></template>
<template data-pop="r05-contentieux-morphine" data-title="Dose de morphine : contentieux entre sources"><p class="lab">Positions</p><p><b>Essai source (Morice, 2007)</b> : 5 mg deux fois par jour, puis 10 mg deux fois par jour en extension. <b>ERS 2020</b> : 5 à 10 mg deux fois par jour ; environ la moitié des patients répondent. <b>Société allemande de pneumologie, janvier 2025</b> : 10 mg deux fois par jour ; réponse chez environ 20 % des patients, sans gain à dose plus forte. <b>HUG 2025</b> : « entre 5 à 10 mg par jour » pendant un essai de deux semaines.</p><p class="lab">Arbitrage</p><p>Toutes les doses de l’essai, source primaire, étaient biquotidiennes, et les deux recommandations européennes le reprennent ; la formulation des HUG, plus récente, n’est appuyée par aucun essai cité et n’est pas retenue. Le cours enseigne 5 à 10 mg deux fois par jour ; en Suisse, la plus petite forme retard (10 mg) impose en pratique 10 mg deux fois par jour. L’écart des taux de réponse reflète l’absence de grand essai : la décision repose sur un essai individuel bref et mesuré.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17122382/" target="_blank" rel="noopener">Morice et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 12.c</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.1</a>.</p></template>
<template data-pop="r05-contentieux-gefapixant" data-title="Effet du géfapixant : contentieux entre sources"><p class="lab">Positions</p><p><b>HUG 2025</b> : le géfapixant « réduit de 75 % la fréquence de la toux » par rapport au placebo à deux semaines. <b>Essais de phase 3 et information professionnelle suisse</b> : réduction supplémentaire de 18,5 % (12 semaines) et de 14,6 % (24 semaines) par rapport au placebo ; par rapport à l’état initial, la fréquence baisse d’environ 61 à 63 % sous géfapixant contre 55 à 57 % sous placebo.</p><p class="lab">Arbitrage</p><p>Les essais de phase 3, source primaire, et l’information professionnelle approuvée par Swissmedic l’emportent. Le chiffre de 75 % ne correspond à aucun résultat de ces essais ; il n’est pas retenu. La différence entre l’effet absolu et l’effet contre placebo rappelle l’importance de l’effet placebo dans la toux.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35248186/" target="_blank" rel="noopener">McGarvey et al., Lancet 2022</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Lyfnua®, tableau 2</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.1</a>.</p></template>
<template data-pop="pareto-r05-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="r05-0,r05-1,r05-2,r05-3,r05-4,r05-5,r05-6"></p><ul><li>Toux aiguë : moins de 3 semaines ; subaiguë : 3 à 8 ; chronique : plus de 8 chez l’adulte, plus de 4 chez l’enfant.</li><li>La toux chronique touche environ 10 % des adultes, surtout des femmes de 50 à 70 ans ; elle altère sommeil, continence et humeur.</li><li>Le réflexe vagal se sensibilise en périphérie (ATP, inflammation) et au centre : allotussie et hypertussie.</li><li>Toux aiguë : rhume viral ; subaiguë : post-infectieuse, coqueluche ; chronique : tabac, IEC, asthme et bronchite à éosinophiles, reflux, voies aériennes supérieures, apnée du sommeil.</li><li>L’anamnèse chiffre le tabac, relit les médicaments, quantifie l’expectoration, cherche les déclencheurs ; l’examen commence par les paramètres vitaux.</li></ul></template>
<template data-pop="pareto-r05-diag" data-title="Pareto — Diagnostic et signes d’alarme"><p class="ratio" data-cover="r05-7,r05-8"></p><ul><li>Un signe d’alarme impose une exploration immédiate, quelle que soit la durée.</li><li>Toux aiguë ou subaiguë sans signe d’alarme : aucun examen complémentaire.</li><li>Toux chronique : radiographie, spirométrie et formule sanguine sans délai, puis examens dictés par l’anamnèse.</li><li>Pas de tomodensitométrie systématique si radiographie et examen sont normaux ; pas de traitement d’épreuve sans indice clinique.</li><li>Signes d’alarme : hémoptysie, dyspnée, stridor, hypoxémie, tachycardie, douleur thoracique, fièvre élevée, perte de poids, dysphonie.</li></ul></template>
<template data-pop="pareto-r05-pec" data-title="Pareto — Prise en charge et suivi"><p class="ratio" data-cover="r05-9,r05-10,r05-11,r05-12"></p><ul><li>Toux aiguë : informer (3 à 4 semaines), soulager à la demande ; CRP et antibiotique seulement devant fièvre prolongée, dyspnée, tachypnée, tachycardie ou anomalie focale (SSI).</li><li>Toux chronique : traiter chaque trait traitable à dose et durée suffisantes, puis réévaluer ; IEC remplacé par une autre classe.</li><li>Inhibiteur de la pompe à protons seulement en cas de pyrosis ou de régurgitations.</li><li>Toux réfractaire : thérapie de contrôle de la toux, puis essais successifs de morphine faible dose, gabapentinoïde ou géfapixant, arrêtés sans réponse.</li><li>La codéine n’est pas recommandée dans la toux chronique.</li><li>Suivi par un score répété ; prévention par l’éviction des IEC, le sevrage tabagique et la vaccination contre la coqueluche.</li></ul></template>
<template data-pop="pareto-r05-crit" data-title="Pareto — Situations particulières et critères"><p class="ratio" data-cover="r05-13,r05-14"></p><ul><li>Enfant : seuil de 4 semaines, corps étranger, bronchite bactérienne prolongée ; ni neuromodulateur, ni codéine avant 18 ans.</li><li>Grossesse et allaitement : codéine à éviter, contre-indiquée pendant l’allaitement.</li><li>Insuffisance rénale : adapter gabapentine, prégabaline et géfapixant.</li><li>Réfractaire : persiste malgré le traitement des causes ; inexpliquée : aucune cause après bilan complet.</li></ul></template>
<template data-pop="pareto-r05-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="r05-e-1,r05-e-2,r05-e-3"></p><ul><li>Pas d’examen de référence unique : le diagnostic est clinique, chaque trait a son test de référence.</li><li>Socle : radiographie, spirométrie, formule sanguine ; FeNO utile.</li><li>Méthacholine positive : asthme à forme de toux ; négative avec FeNO élevé ou expectoration à plus de 3 % d’éosinophiles : bronchite à éosinophiles.</li><li>pH-impédancemétrie seulement en cas de symptômes de reflux ou d’échec ; causalité si association d’au moins 95 %.</li><li>Tomodensitométrie : toux productive, signe d’alarme ou bilan négatif.</li></ul></template>
<template data-pop="pareto-r05-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r05-p-1,r05-p-2,r05-p-3,r05-p-4"></p><ul><li>Antitussifs centraux pour la toux aiguë sèche et brève ; à éviter en cas de stase des sécrétions.</li><li>Dextrométhorphane 25 mg trois à quatre fois par jour ; codéine 50 mg une à trois fois par jour, contre-indiquée avant 18 ans et pendant l’allaitement.</li><li>Neuromodulateurs hors indication : morphine 5 à 10 mg deux fois par jour, gabapentine jusqu’à 1800 mg, prégabaline 300 mg.</li><li>Géfapixant 45 mg deux fois par jour, autorisé mais non remboursé ; dysgueusie chez 41 % ; à éviter en cas d’apnée obstructive du sommeil.</li><li>Opioïdes et gabapentinoïdes avec sédatifs : dépression respiratoire ; dextrométhorphane avec sérotoninergiques : syndrome sérotoninergique.</li></ul></template>
