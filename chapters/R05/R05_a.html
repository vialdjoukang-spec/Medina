<section class="ilot" id="r05-0"><h2><span class="n">0</span>Question clinique</h2><p>Une enseignante de 58 ans, non fumeuse, tousse depuis cinq mois. En effet, la toux a commencé avec un rhume, puis n’a plus cessé. Elle est sèche, déclenchée par le parfum d’une collègue, l’air froid et les conversations téléphoniques. De plus, la patiente perd des urines lors des quintes et dort mal. Elle prend un inhibiteur de l’enzyme de conversion (IEC) depuis huit mois pour une hypertension.</p><p>La toux est le plus souvent le symptôme d’une maladie (infection, asthme, reflux, cancer, insuffisance cardiaque), mais elle devient une maladie en soi lorsque le réflexe qui la produit est hypersensible. <b>Le médecin répond donc à trois questions : la toux signale-t-elle un danger immédiat, existe-t-il une cause traitable, le réflexe lui-même est-il devenu pathologique ?</b></p><div class="key"><b>Point de départ.</b> <button class="w" data-k="r05-reflexe">Le réflexe de toux (arc nerveux et rôle protecteur)</button> ; <button class="w" data-k="r05-hypersensibilite">le syndrome d’hypersensibilité de la toux (définition et portée)</button> ; <button class="w" data-k="r05-iec">la toux des IEC (mécanisme et délai de résolution)</button>.</div></section>
<section class="ilot" id="r05-1"><h2><span class="n">1</span>Définitions et classifications</h2><p>La toux est un réflexe vagal de défense : inspiration, fermeture brève de la glotte, puis expiration forcée glotte ouverte, dont le débit chasse ce qui menace les voies aériennes. Elle protège contre l’aspiration ; le patient qui ne tousse plus, après un accident vasculaire cérébral par exemple, fait des inhalations récidivantes.</p><p>Le clinicien classe d’abord la toux selon sa durée, qui prédit la cause et règle l’intensité des examens. Ainsi, les HUG (2025) et la Société allemande de pneumologie (2025) retiennent trois catégories ; la Société suisse d’infectiologie (SSI, 2026) borne l’infection respiratoire aiguë à 21 jours. En revanche, l’ERS (2020) fixe le seuil de la toux chronique à huit semaines chez l’adulte et à quatre chez l’enfant ; elle le juge arbitraire, car certaines toux évoluent par rechutes et rémissions.</p><table class="t"><tr><th>Catégorie</th><th>Durée chez l’adulte</th><th>Attitude initiale</th></tr><tr><td>Aiguë</td><td>Moins de 3 semaines</td><td>Anamnèse et examen ; examens seulement si signe d’alarme</td></tr><tr><td>Subaiguë</td><td>3 à 8 semaines</td><td>Même attitude ; rechercher coqueluche, hyperréactivité post-infectieuse, rhinosinusite</td></tr><tr><td>Chronique</td><td>Plus de 8 semaines</td><td>Bilan de base sans délai : radiographie, spirométrie, formule sanguine</td></tr></table><p>La durée change la conduite, non la gravité. Ainsi, une toux de quatre jours avec hémoptysie impose des examens immédiats ; une toux de cinq semaines après une grippe, sans signe d’alarme, justifie l’attente. À l’inverse, l’erreur fréquente consiste à différer le bilan d’une toux chronique : la Société allemande de pneumologie le demande dès la première consultation.</p><p>La toux est ensuite dite <button class="w" data-k="r05-productive">productive ou sèche (seuil de 5 à 30 mL par 24 heures)</button>. Lorsque la toux chronique persiste malgré le traitement de sa cause présumée, elle est <b>réfractaire</b> ; lorsqu’aucune cause n’est trouvée après un bilan complet, elle est <b>inexpliquée</b>. Toutefois, les deux formes partagent le même mécanisme : une <button class="w" data-k="r05-allotussie">allotussie et une hypertussie (définitions et exemples)</button>.</p><div class="key"><b>À retenir.</b> La durée sépare la toux aiguë (moins de 3 semaines), subaiguë (3 à 8) et chronique (plus de 8). La toux chronique réfractaire ou inexpliquée est une maladie du réflexe, non un simple symptôme. La partie suivante mesure la fréquence et le poids de ce problème.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">Morice et al., recommandations ERS sur la toux chronique, Eur Respir J 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie, recommandation sur la toux de l’adulte, version 4.1, janvier 2025</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG, stratégie « Toux chronique », 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, « Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte », version validée le 01.09.2026</a>.</p></section>
<section class="ilot" id="r05-2"><h2><span class="n">2</span>Épidémiologie et retentissement</h2><p>Ainsi, la toux aiguë relève surtout du rhume, dont les rhinovirus causent 30 à 50 % des cas ; la toux en est le symptôme le plus gênant et le plus durable, de deux à trois semaines (Société allemande de pneumologie, 2025) ; elle guérit en général sans antibiotique en trois à quatre semaines (NICE).</p><p>Une méta-analyse estime la prévalence mondiale de la toux chronique de l’adulte à environ 10 % (Song, 2015, cité par l’ERS). De même, en Allemagne, elle atteint 6,5 %. Par ailleurs, dans les consultations spécialisées, deux patients sur trois sont des femmes, le plus souvent dans la sixième décennie ; l’ERS attribue cette distribution à une différence entre les sexes dans le traitement central de la sensation de toux. De plus, chez 30 à 40 % des patients adressés au pneumologue, aucune cause n’est trouvée. <b>En revanche, aucune prévalence suisse de la toux chronique de l’adulte n’a été identifiée.</b> Enfin, chez l’enfant zurichois de 6 à 17 ans, 25 % des parents rapportent une toux sans rhume et 11 % une toux sèche nocturne, mais ces chiffres dépendent fortement de la question posée (Mallet, 2023).</p><p>Certes, la toux chronique menace rarement la vie, mais elle détériore la qualité de vie : les patients en rapportent en moyenne huit conséquences (ERS), dont l’<button class="w" data-k="r05-incontinence">incontinence urinaire d’effort (fréquence et dépistage)</button>, les troubles du sommeil, la dysphonie, l’isolement social, la dépression, et parfois la <button class="w" data-k="r05-syncope">syncope de toux (mécanismes)</button>, une fracture de côte ou un pneumothorax.</p><div class="key"><b>À retenir.</b> Une toux aiguë dure souvent deux à quatre semaines ; une toux chronique touche environ un adulte sur dix, surtout la femme de 50 à 70 ans, et son retentissement se mesure à chaque consultation. Reste à comprendre pourquoi le réflexe s’emballe.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25657027/" target="_blank" rel="noopener">Song et al., épidémiologie mondiale de la toux chronique, Eur Respir J 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36912371/" target="_blank" rel="noopener">Mallet et al., prévalence de la toux de l’enfant, Swiss Med Wkly 2023</a> ; <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE, toux aiguë, février 2019</a>.</p></section>
<section class="ilot" id="r05-3"><h2><span class="n">3</span>Du réflexe protecteur à l’hypersensibilité</h2><p>Chez le sujet sain, la toux répond à un stimulus réellement nocif, détecté par deux populations de terminaisons vagales du larynx, de la trachée et des grosses bronches : des <b>fibres C chimiosensibles</b>, issues du ganglion jugulaire, sensibles aux irritants et aux médiateurs de l’inflammation ; des <b>récepteurs Aδ de la toux</b>, issus du ganglion nodal, sensibles au contact et à l’acidité, qui défendent contre l’aspiration. Ensuite, le tronc cérébral déclenche la séquence motrice ; le cortex produit l’envie de tousser et permet de la réprimer.</p><p>Dans la toux chronique, ce circuit devient hypersensible. En effet, en périphérie, l’inflammation libère de l’<button class="w" data-k="r05-atp">ATP, des protons et des prostaglandines (sensibilisation des terminaisons)</button>, qui abaissent le seuil d’activation des fibres. Au centre, l’imagerie fonctionnelle montre une activité accrue du mésencéphale et une moindre activation du réseau qui réprime la toux. Le patient tousse alors pour un stimulus anodin, comme parler ou rire.</p><p>Plusieurs causes agissent sur ce même circuit. Ainsi, les IEC accumulent la bradykinine, qui sensibilise les récepteurs. De même, le <button class="w" data-k="r05-reflux">reflux gastro-œsophagien (théorie du réflexe et du reflux)</button> stimule le réflexe depuis l’œsophage. De plus, l’<button class="w" data-k="r05-cva">inflammation éosinophilique de l’asthme à forme de toux</button> irrite les terminaisons bronchiques. Le tabac, à l’inverse, déprime le réflexe : la toux augmente souvent au premier mois de sevrage (<button class="w" data-k="r05-tabac">tabac et réflexe de toux</button>).</p><div class="key"><b>À retenir.</b> La toux chronique naît d’un réflexe sensibilisé à la périphérie et au centre : ce modèle explique l’allotussie, l’effet du traitement de la cause lorsqu’elle existe, et celui des neuromodulateurs lorsqu’elle n’existe plus. Ces causes sont recensées ci-après.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., mécanismes périphériques et centraux de l’hypersensibilité de la toux, J Thorac Dis 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 8 et 10</a>.</p></section>
<section class="ilot" id="r05-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Chaque durée a ses causes fréquentes ; à toutes les durées, le clinicien cherche aussi les causes rares mais graves, que révèlent les signes d’alarme.</p><table class="t"><tr><th>Durée</th><th>Causes fréquentes</th><th>Causes graves ou à ne pas manquer</th></tr><tr><td>Aiguë</td><td>Rhume viral, bronchite aiguë, rhinite allergique, crise d’asthme</td><td>Pneumonie, embolie pulmonaire, pneumothorax, œdème pulmonaire, corps étranger, inhalation toxique</td></tr><tr><td>Subaiguë</td><td><button class="w" data-k="r05-postinfectieux">Toux post-infectieuse et hyperréactivité transitoire</button>, rhinosinusite post-virale</td><td><button class="w" data-k="r05-coqueluche">Coqueluche</button>, pneumonie à mycoplasme, <button class="w" data-k="r05-postcovid">toux après COVID-19</button></td></tr><tr><td>Chronique</td><td>Tabac et bronchite chronique, asthme et bronchite à éosinophiles, reflux, maladies des voies aériennes supérieures, IEC</td><td>Cancer bronchique, tuberculose, pneumopathie interstitielle, insuffisance cardiaque, embolies récidivantes, bronchiectasies</td></tr></table><p>La colonne de droite commande la vigilance : chaque toux, quelle que soit sa durée, est confrontée aux signes d’alarme de l’îlot 8. Ainsi, chez un fumeur de 65 ans dont la toux habituelle change de caractère, le cancer bronchique précède le reflux dans le raisonnement, bien qu’il explique moins de 2 % des toux chroniques selon les HUG.</p><p>Dans la toux chronique, les causes fréquentes sont appelées « traits traitables » : l’<button class="w" data-k="r05-cva">asthme à forme de toux</button>, la <button class="w" data-k="r05-eb">bronchite à éosinophiles non asthmatique</button>, le <button class="w" data-k="r05-reflux">reflux</button>, le <button class="w" data-k="r05-voies-sup">syndrome de toux des voies aériennes supérieures</button>, l’<button class="w" data-k="r05-ilo">obstruction laryngée induite</button>, l’<button class="w" data-k="r05-saos">apnée obstructive du sommeil</button> et les <button class="w" data-k="r05-iec">médicaments</button>. De même, l’asthme à forme de toux et la bronchite à éosinophiles expliquent 31 à 50 % des toux chroniques du non-fumeur à radiographie normale et sans IEC (Société allemande de pneumologie). Enfin, l’obésité s’associe à une toux plus fréquente et plus sévère (HUG).</p><div class="trap"><span class="k">Piège</span> Un trait traitable associé n’est pas forcément la cause : la plupart des patients qui ont un reflux ou une rhinite ne toussent pas. Si la toux persiste malgré un traitement correct, il s’agit d’une association et la toux est réfractaire.</div><div class="key"><b>À retenir.</b> La toux aiguë est surtout virale, la subaiguë surtout post-infectieuse ; la chronique relève du tabac, de traits traitables ou d’une hypersensibilité isolée. Les causes graves se cherchent à toutes les durées, d’abord par l’anamnèse.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, tableau 1 et chapitres 4 à 10</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></section>
<section class="ilot" id="r05-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>L’anamnèse est l’étape clé de la prise en charge (HUG). Elle repère d’abord les signes d’alarme, puis les traits traitables, enfin le retentissement, dans un ordre fixe qui évite les omissions.</p><h3>Antécédents et expositions</h3><p>Ainsi, le médecin chiffre le <button class="w" data-k="r05-tabac">tabagisme en paquets-années</button> ; au-delà de 40, la Société allemande de pneumologie en fait un signe d’alarme. Il relève l’exposition professionnelle et à l’amiante, un asthme ou une atopie, une cardiopathie, une tuberculose ancienne, un accident vasculaire cérébral ou une maladie de Parkinson, qui exposent aux fausses routes. Il revoit <b>tous les médicaments</b> : IEC, bêtabloquants, amiodarone, méthotrexate, inhibiteurs de points de contrôle immunitaire, collyres de prostaglandines et inhalateurs à poudre peuvent faire tousser. Il demande l’état vaccinal contre la coqueluche.</p><h3>Caractériser la toux</h3><p>Un début brutal chez l’enfant d’âge préscolaire évoque un corps étranger ; un début après un rhume oriente vers une toux post-infectieuse ou une hypersensibilité. De même, une expectoration d’une cuillère à café ou plus par jour définit la toux productive, qui oriente vers une bronchite chronique, des bronchiectasies ou une infection chronique. Enfin, les déclencheurs anodins (parler, rire, parfums, air froid, repas, position couchée) signent une <button class="w" data-k="r05-allotussie">allotussie</button>.</p><h3>Symptômes associés</h3><p>Ainsi, toux nocturne ou d’effort avec sifflements évoque l’asthme ; écoulement postérieur, obstruction nasale et raclements, les voies aériennes supérieures ; pyrosis, régurgitations et toux postprandiale, le reflux, que le <button class="w" data-k="r05-harq">questionnaire de reflux des voies aériennes de Hull</button> aide à objectiver ; ronflement, somnolence et surpoids, l’apnée du sommeil ; dysphonie et dyspnée inspiratoire brève, l’obstruction laryngée induite.</p><div class="two"><div class="card"><b>Présentation typique de l’hypersensibilité</b><p>Par exemple, une femme de 50 à 70 ans tousse sec depuis des mois ou des années, après un rhume oublié ; elle décrit un chatouillement laryngé et des quintes déclenchées par la parole, le téléphone ou les parfums.</p></div><div class="card"><b>Présentations trompeuses</b><p>Les fausses routes répétées passent pour des « infections bronchiques » (ERS) ; l’obstruction laryngée induite passe pour un asthme résistant (Société allemande de pneumologie). Enfin, une sensation d’encombrement sans expectoration réelle traduit souvent l’envie de tousser, non une hypersécrétion.</p></div></div><h3>Retentissement</h3><p>Enfin, le médecin interroge sur l’incontinence urinaire, le sommeil, les syncopes, l’humeur et la vie sociale, et fait coter la toux de 0 à 10 ; le <button class="w" data-k="r05-lcq">questionnaire de toux de Leicester</button> mesure la qualité de vie de façon validée.</p><div class="key"><b>À retenir.</b> L’anamnèse chiffre le tabac, relit chaque médicament, quantifie l’expectoration, recherche déclencheurs et indices des traits traitables, puis mesure le retentissement ; l’examen confirme ou corrige ces hypothèses.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, encadrés 4 et 5, tableau 5</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 1</a>.</p></section>
<section class="ilot" id="r05-6"><h2><span class="n">6</span>Examiner pour trier</h2><p>L’examen répond à deux questions : le patient est-il en danger, et quel organe produit la toux ? Il commence par les paramètres vitaux, dont l’anomalie court-circuite la démarche par durée.</p><div class="two"><div class="card"><b>État général et paramètres vitaux</b><p>Une fréquence respiratoire élevée, une cyanose ou une SpO₂ inférieure à 90 % signalent une atteinte cardiorespiratoire sévère. De même, une fréquence cardiaque supérieure à 120 par minute évoque une embolie pulmonaire ou une infection fébrile sévère. Par ailleurs, une température supérieure à 38,5 °C évoque une infection respiratoire sévère. Enfin, l’indice de masse corporelle repère l’obésité, associée à l’apnée du sommeil, et l’amaigrissement.</p></div><div class="card"><b>Sphère oto-rhino-laryngologique et cou</b><p>Ensuite, le médecin cherche une rhinorrhée, des sécrétions mucopurulentes sur la paroi pharyngée postérieure et un <button class="w" data-k="r05-examen-orl">aspect « pavimenteux » du pharynx</button>. Il inspecte le conduit auditif : un bouchon de cérumen ou un corps étranger peut déclencher la toux par le rameau auriculaire du vague. Enfin, un stridor impose une évaluation urgente.</p></div></div><div class="two"><div class="card"><b>Auscultation pulmonaire</b><p>Des sibilants orientent vers l’asthme ou la BPCO. À l’inverse, des <button class="w" data-k="r05-auscultation">crépitants fins des bases (valeur et pièges)</button> orientent vers une pneumopathie interstitielle ou une stase. De même, des râles localisés et fébriles orientent vers une pneumonie. Enfin, un murmure aboli et unilatéral évoque un épanchement, un pneumothorax ou une atélectasie.</p></div><div class="card"><b>Examen cardiovasculaire</b><p>Œdèmes, turgescence jugulaire, prise de poids et crépitants bilatéraux évoquent une insuffisance cardiaque. Par ailleurs, une bradycardie peut traduire un bloc auriculo-ventriculaire, qui peut accompagner la toux. Ces signes justifient un ECG et un dosage des peptides natriurétiques.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Un examen normal ne prouve pas l’absence de cause : dans l’asthme à forme de toux et le reflux, l’auscultation est souvent normale. Le bilan de base reste indispensable dès la huitième semaine.</div><div class="key"><b>À retenir.</b> L’examen commence par les paramètres vitaux, puis explore voies aériennes supérieures, oreille, poumons et cœur. La partie suivante assemble ces données dans une démarche par durée.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, tableaux 2 et 3, encadré 5</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 4.2</a>.</p><button class="pareto-btn ui" data-k="pareto-r05-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
