<template data-pop="r05-reflexe" data-title="Le réflexe de toux"><p>Réflexe vagal de protection en trois temps : inspiration, brève expiration contre la glotte fermée, expiration forcée glotte ouverte, dont le débit dégage les voies aériennes. Ses afférences naissent surtout du larynx et des voies de conduction, mais aussi des cloisons alvéolaires, du pharynx, de l’œsophage et du conduit auditif ; le cortex peut le provoquer ou le réprimer.</p><div class="key"><b>Conséquence clinique.</b> Le patient dont le réflexe est affaibli, après une atteinte neurologique, fait des inhalations récidivantes souvent prises pour des « infections bronchiques ». Le traitement vise une sensibilité normale, non l’abolition du réflexe.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., J Thorac Dis 2020</a>.</p></template>
<template data-pop="r05-hypersensibilite" data-title="Syndrome d’hypersensibilité de la toux"><p class="lab">Définition</p><p>Toux gênante déclenchée par des stimuli thermiques, mécaniques ou chimiques de faible intensité. Un groupe de travail de l’ERS a validé ce concept en 2014 auprès de 44 experts ; l’ERS en a fait en 2020 le diagnostic englobant de la toux chronique de l’adulte.</p><p class="lab">Mécanisme</p><p>Sensibilisation périphérique par l’inflammation, amplification dans le tronc cérébral et moindre inhibition corticale : la Société allemande de pneumologie y voit une neuropathie du réflexe, comparable à l’hyperalgésie.</p><div class="key"><b>Conséquence.</b> Asthme, rhinite et reflux deviennent des déclencheurs d’un même réflexe hypersensible. Aucun test de routine ne mesure l’hypersensibilité ; le test à la capsaïcine reste un outil de recherche.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25142479/" target="_blank" rel="noopener">Morice et al., Eur Respir J 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 6</a>.</p></template>
<template data-pop="r05-iec" data-title="Toux des inhibiteurs de l’enzyme de conversion"><p class="lab">Fréquence et mécanisme</p><p>Environ 15 % des patients sous IEC toussent selon l’ERS et les HUG ; 10 % des femmes et 5 % des hommes selon la Société allemande de pneumologie, indépendamment de la dose. L’IEC empêche la dégradation de la bradykinine, qui sensibilise le réflexe : l’effet est de classe, et tout IEC réintroduit fait réapparaître la toux.</p><p class="lab">Chronologie</p><p>La toux apparaît en général dans la semaine suivant l’introduction, parfois jusqu’à six mois plus tard, et peut persister un à trois mois après l’arrêt.</p><div class="key"><b>Conduite.</b> Remplacer l’IEC par une autre classe ; les antagonistes des récepteurs de l’angiotensine II n’agissent pas sur le réflexe. Si la toux persiste plus de trois semaines après le changement, le bilan se poursuit en parallèle, sans réhabiliter l’IEC.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.12</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 10</a>.</p></template>
<template data-pop="r05-productive" data-title="Toux productive ou sèche"><p>La toux est productive lorsque l’expectoration atteint 5 à 30 mL par 24 heures ou davantage, d’une cuillère à café à deux cuillères à soupe. Au-delà de 30 mL, une infection chronique ou des bronchiectasies sont fortement suspectées ; entre 5 et 30 mL, elles sont à envisager ; en dessous, d’autres causes sont plus probables. L’aspect oriente aussi : muqueux dans la bronchite du fumeur, mousseux dans l’œdème pulmonaire, purulent dans une exacerbation ou des bronchiectasies, sanglant dans un cancer ou des bronchiectasies, moulé dans l’aspergillose bronchopulmonaire allergique.</p><div class="key"><b>Piège.</b> L’envie de tousser est souvent ressentie comme un « encombrement » sans expectoration réelle : le médecin fait décrire et quantifier ce qui est craché.</div><p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 1 et 6</a>.</p></template>
<template data-pop="r05-allotussie" data-title="Allotussie et hypertussie"><p>L’<b>allotussie</b> est la toux déclenchée par un stimulus qui ne fait normalement pas tousser : odeur, rire, chant, parole, changement de température, repas, position couchée. L’<b>hypertussie</b> est une réponse exagérée à un stimulus tussigène. Ces termes transposent l’allodynie et l’hyperalgésie de la douleur : le seuil du réflexe est abaissé.</p><div class="key"><b>Conséquence pratique.</b> Une toux déclenchée par la parole ou les parfums oriente vers une hypersensibilité, sans exclure un trait traitable associé.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.1</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, encadré 4</a>.</p></template>
<template data-pop="r05-incontinence" data-title="Incontinence urinaire et autres conséquences"><p class="lab">Fréquence et poids</p><p>L’incontinence urinaire d’effort, la gêne à la parole et la dépression pèsent le plus sur la qualité de vie. La femme, plus souvent touchée par la toux chronique, en souffre davantage ; l’incontinence est sévère chez un quart des patientes concernées, mais rarement évoquée spontanément.</p><div class="key"><b>Conséquence pratique.</b> Le médecin pose la question à chaque patiente qui tousse. Un essai du géfapixant a d’ailleurs été mené chez des femmes souffrant d’incontinence d’effort induite par la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Lyfnua®</a>.</p></template>
<template data-pop="r05-syncope" data-title="Syncope de toux et troubles conductifs"><p class="lab">Données</p><p>La toux peut déclencher, probablement par une forte stimulation vagale, un bloc auriculo-ventriculaire du deuxième ou du troisième degré ; le bloc complet est discuté comme l’un des mécanismes de la syncope de toux. À l’inverse, une bradycardie par bloc de haut degré réduit le débit cardiaque, provoque une stase et peut faire tousser.</p><div class="key"><b>Conséquence pratique.</b> Une syncope pendant les quintes fait suspecter un trouble conductif ; elle relève du bilan cardiologique, ECG en tête, prévu par la Société allemande de pneumologie lorsqu’une cause cardiaque est possible.</div><div class="key"><b>Lacune.</b> Les sources lues ne chiffrent pas la fréquence de la syncope de toux.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 2 et 11</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 3</a>.</p></template>
<template data-pop="r05-atp" data-title="Sensibilisation périphérique des terminaisons vagales"><p>Une cellule agressée libère de l’ATP ; l’inflammation libère aussi des protons, des prostaglandines, des cytokines et des facteurs neurotrophiques. Ces médiateurs activent les fibres vagales ou abaissent leur seuil. Chez l’homme, l’inhalation de prostaglandines sensibilise la toux provoquée par la capsaïcine, et les patients atteints de toux réfractaire toussent davantage que les témoins après inhalation d’ATP.</p><div class="key"><b>Conséquence pratique.</b> Traiter l’inflammation réduit la sensibilisation ; bloquer le récepteur de l’ATP réduit la toux réfractaire.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., J Thorac Dis 2020</a>.</p></template>
<template data-pop="r05-reflux" data-title="Toux et reflux gastro-œsophagien"><p class="lab">Deux théories</p><p>Selon la théorie du reflux, le contenu gastrique atteint le pharynx et les voies aériennes ; selon la théorie du réflexe, le reflux distal stimule la toux depuis l’œsophage. Chez l’adulte, les données soutiennent la seconde, et le volume du liquide refluant compte davantage que son acidité.</p><p class="lab">Données</p><p>Reflux et toux coexistent plus souvent que par hasard, mais ni chronologie ni gradient de sévérité ne prouvent la causalité ; la toux elle-même peut provoquer du reflux. Les troubles de la motricité œsophagienne sont fréquents ; le reflux non acide est suspecté, sans technique fiable pour le détecter.</p><div class="key"><b>Conséquence pratique.</b> L’inhibiteur de la pompe à protons réduit l’acidité, non le reflux : il n’aide que le patient qui a un reflux acide symptomatique.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-cva" data-title="Asthme à forme de toux"><p>Forme d’asthme dont la toux est la seule manifestation : le test à la méthacholine est positif par définition, alors que spirométrie et débit de pointe peuvent rester normaux. L’ERS la place entre l’asthme classique (variabilité et hyperréactivité) et la bronchite à éosinophiles (sans hyperréactivité) ; les trois répondent au traitement anti-inflammatoire. Environ 30 à 40 % des patients développent ensuite un asthme classique (Société allemande de pneumologie).</p><div class="key"><b>Indices et conduite.</b> Toux nocturne ou d’effort, atopie, antécédents familiaux, variation saisonnière, éosinophilie ou FeNO élevé. Le traitement suit celui de l’asthme, technique d’inhalation vérifiée ; voir J45 — Asthme.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.3 et 6.3</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 9</a>.</p></template>
<template data-pop="r05-eb" data-title="Bronchite à éosinophiles non asthmatique"><p>Toux chronique avec plus de 3 % d’éosinophiles dans l’expectoration induite, sans dyspnée, obstruction ni hyperréactivité bronchique ; le FeNO est en général élevé. Elle touche jusqu’à 13 % des patients des consultations spécialisées (ERS), récidive souvent, coexiste avec la BPCO, les pneumopathies d’exposition et les bronchiectasies, et peut évoluer vers un asthme (HUG).</p><div class="key"><b>Conduite.</b> Corticoïde inhalé ; corticoïde oral ou antileucotriène en cas de résistance au traitement inhalé. La dose et la durée optimales ne font pas consensus.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.4 et 6.4</a>.</p></template>
<template data-pop="r05-tabac" data-title="Tabac et réflexe de toux"><p>Le tabac est la première cause évitable de toux chronique, et la consommation actuelle prédit la fréquence objective de la toux. Pourtant, le fumeur a un réflexe moins sensible à la capsaïcine, et la nicotine d’une seule cigarette, inhalée par cigarette électronique, déprime ce réflexe : la toux augmente donc souvent au premier mois de sevrage.</p><div class="key"><b>Conduite.</b> Chaque fumeur qui tousse reçoit une aide au sevrage et est prévenu de cette aggravation transitoire ; l’ERS évoque la cigarette électronique pour celui qui ne peut arrêter à cause de la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.7</a>.</p></template>
<template data-pop="r05-postinfectieux" data-title="Toux post-infectieuse"><p>Toux qui persiste plus de trois semaines après une infection respiratoire aiguë, en général moins de huit, et guérit spontanément ; une toux sèche peut durer trois mois après une infection banale des voies aériennes supérieures. L’infection peut induire une hyperréactivité bronchique transitoire, souvent avec éosinophilie, sans autre signe d’asthme.</p><div class="key"><b>Conduite.</b> Diagnostic par l’histoire et l’exclusion des autres causes. Un corticoïde inhalé, éventuellement associé à un bronchodilatateur de longue durée d’action, pendant 10 à 14 jours, peut en raccourcir la durée ; la coqueluche, elle, n’y répond pas.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 2.b</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.13</a>.</p></template>
<template data-pop="r05-coqueluche" data-title="Coqueluche et toux prolongée"><p class="lab">Situation et présentation</p><p>L’OFSP observe une hausse des cas en Suisse depuis janvier 2024. Très contagieuse, transmise par gouttelettes, la coqueluche donne une toux violente et prolongée, parfois plus de huit semaines : quintes en staccato chez l’enfant non vacciné, détresse respiratoire plutôt que quintes chez le nourrisson, complications chez environ un adulte asthmatique ou BPCO sur dix.</p><p class="lab">Diagnostic et traitement</p><p>PCR ou culture en cas de suspicion ; la SSI envisage la recherche en contexte épidémique pour limiter la transmission. Le macrolide n’agit sur la maladie qu’en phase catarrhale, mais la contagiosité cesse en général après cinq jours de traitement, contre jusqu’à 21 jours sans.</p><div class="key"><b>Prévention.</b> Une dose de vaccin à chaque grossesse protège le nouveau-né ; proches et personnel en contact régulier avec des nourrissons de moins de six mois mettent leur vaccination à jour, surtout si la dernière dose date de plus de dix ans.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/coqueluche-la-vaccination-protege-les-nourrissons-dune-evolution-grave" target="_blank" rel="noopener">OFSP, coqueluche, consulté le 09.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, « Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte », version 40978 validée le 01.09.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 2.b</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.13</a>.</p></template>
<template data-pop="r05-postcovid" data-title="Toux après COVID-19"><p>Avec la souche initiale, environ 86 % des patients toussaient pendant l’infection aiguë et 50 % encore à trois semaines ; environ 23 % rapportent une toux chronique. Dans une cohorte américaine, un tiers environ toussaient encore six mois après l’infection, avant comme pendant la période Omicron. La toux chronique peut traduire une hypersensibilité post-infectieuse ou une pneumopathie interstitielle séquellaire.</p><div class="key"><b>Conduite.</b> Aucun traitement n’est autorisé ; un traitement analogue à celui de la toux réfractaire aide environ 30 % des patients, et la toux peut guérir après plusieurs mois.</div><p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 5</a>.</p></template>
<template data-pop="r05-voies-sup" data-title="Syndrome de toux des voies aériennes supérieures"><p class="lab">Définition</p><p>Toux chronique attribuée à une rhinite allergique ou non allergique ou à une rhinosinusite chronique (au moins deux symptômes pendant plus de 12 semaines : obstruction nasale, écoulement antérieur ou postérieur, douleur faciale, trouble de l’odorat, confirmés par endoscopie ou imagerie).</p><p class="lab">Mécanisme</p><p>Écoulement postérieur, inflammation chronique et hypersensibilité nerveuse sont évoqués, sans certitude : peu de patients qui ont un écoulement postérieur toussent, et l’ERS y voit parfois le reflet d’une inflammation diffuse des voies aériennes. Les antihistaminiques de première génération, autrefois recommandés, agiraient surtout comme anticholinergiques centraux.</p><div class="key"><b>Conduite.</b> Éviction de l’allergène, corticoïde nasal et rinçages salins au moins deux à quatre semaines ; association corticoïde-antihistaminique nasale dans la rhinite non allergique ; 8 à 12 semaines dans la rhinosinusite chronique avant de discuter la chirurgie.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 7.1</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.2 et 6.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-ilo" data-title="Obstruction laryngée induite"><p class="lab">Définition</p><p>Rétrécissement transitoire et réversible du larynx en réponse à un stimulus (effort, reflux, irritants, stress), glottique ou supraglottique ; l’ancien terme de « dysfonction des cordes vocales » n’en désigne qu’une forme.</p><p class="lab">Présentation</p><p>Dyspnée inspiratoire brutale avec stridor, de quelques secondes à quelques minutes, toux, oppression pharyngée, dysphonie. La toux peut être à la fois déclencheur et symptôme. Elle est souvent prise pour un asthme résistant.</p><p class="lab">Diagnostic et traitement</p><p>La laryngoscopie n’est démonstrative que pendant un épisode. Le traitement associe une explication rassurante, la visualisation de la dysfonction, la physiothérapie respiratoire et la logopédie ; le pronostic est bon lorsque le diagnostic est posé.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 7.2</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.14</a>.</p></template>
<template data-pop="r05-saos" data-title="Apnée obstructive du sommeil et toux"><p>Toux chronique et apnée du sommeil coexistent plus souvent que le hasard ne le voudrait ; un reflux laryngopharyngé favorisé par les apnées et une inflammation des muqueuses par le ronflement sont proposés. Le dépistage est anamnestique, la polysomnographie reste l’examen de référence.</p><div class="key"><b>Contentieux.</b> Les HUG 2025, source applicable la plus récente, retiennent une efficacité de la ventilation en pression positive continue après au moins six semaines, sur la foi d’un essai pilote randomisé ; la Société allemande de pneumologie juge ces preuves insuffisantes. Le bénéfice est plausible mais repose sur de petits effectifs.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.8 et 6.6</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 4</a>.</p></template>
<template data-pop="r05-harq" data-title="Questionnaire de reflux des voies aériennes de Hull"><p class="lab">Description</p><p>Questionnaire de 14 questions qui recherche les symptômes du reflux des voies aériennes. Les HUG lui attribuent une sensibilité et une spécificité supérieures à 90 % pour le reflux dans la toux chronique.</p><div class="key"><b>Limite.</b> Il oriente l’anamnèse mais ne prouve pas que le reflux cause la toux.</div><p class="src">Référence : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.5</a>.</p></template>
<template data-pop="r05-lcq" data-title="Mesurer la toux"><p>Le plus simple est de faire coter la toux de 0 à 10 à chaque consultation. Le questionnaire de toux de Leicester (LCQ) et le questionnaire de qualité de vie spécifique de la toux mesurent le retentissement de façon validée ; dans les essais, une différence de 1,3 point au LCQ est jugée cliniquement importante.</p><div class="key"><b>Conséquence pratique.</b> Sans mesure initiale, aucun essai thérapeutique ne peut être jugé.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-examen-orl" data-title="Examen du pharynx et de l’oreille"><p class="lab">Technique et signes</p><p>L’inspection de la cavité buccale recherche une traînée de sécrétions mucopurulentes sur la paroi pharyngée postérieure et une hypertrophie des cordons lymphoïdes, qui donne au pharynx un aspect « pavimenteux ». Ces signes orientent vers une atteinte des voies aériennes supérieures.</p><p class="lab">L’oreille</p><p>Le conduit auditif externe est innervé par un rameau du vague : un bouchon de cérumen ou un corps étranger peut entretenir la toux (réflexe d’Arnold).</p><div class="key"><b>Limite.</b> L’endoscopie nasale et le scanner des sinus ne sont pas systématiques : les HUG les réservent aux symptômes de sinusite chronique qui résistent au traitement.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.2 et 5.16</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-auscultation" data-title="Crépitants fins et toux"><p class="lab">Valeur</p><p>Les crépitants fins des bases figurent dans l’examen de base de la toux chronique (« râles de fibrose »). Ils orientent vers une pneumopathie interstitielle, où la toux touche 30 à 90 % des patients et répond mal aux antitussifs usuels.</p><p class="lab">Pièges</p><p>Des crépitants bilatéraux avec œdèmes et turgescence jugulaire orientent plutôt vers une insuffisance cardiaque ; des râles localisés et fébriles vers une pneumonie.</p><div class="key"><b>Conduite.</b> Des crépitants fins inexpliqués justifient une tomodensitométrie ; voir le cours J84 — Pneumopathies interstitielles diffuses.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, encadré 5</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-red-flags" data-title="Signes d’alarme de la toux"><p class="lab">Toux aiguë et subaiguë (Société allemande de pneumologie)</p><p>Hémoptysie, dyspnée, cyanose, stridor, tabagisme de plus de 40 paquets-années, suspicion de pneumonie ou de tuberculose, fièvre supérieure à 38,5 °C, tachycardie, douleur thoracique, SpO₂ inférieure à 90 %, inhalation toxique aiguë ; dysphonie dans la toux subaiguë.</p><p class="lab">Infection respiratoire aiguë : hospitalisation à envisager (SSI)</p><p>Mauvaise impression clinique, pression systolique inférieure à 90 mm Hg, fréquence respiratoire d’au moins 30 par minute, saturation inférieure à 92 %, hémoptysie, stridor, maladie pulmonaire ou immunodéficience sévères.</p><p class="lab">Toux chronique</p><p>Mêmes signes, plus sueurs nocturnes, perte de poids, dysphagie, dénutrition, immunosuppression sévère, changement de la toux chez un fumeur de 55 à 80 ans. Les HUG ajoutent l’âge d’au moins 40 ans chez le fumeur, l’ancien fumeur ou l’exposé à l’amiante, les infections à répétition et toute anomalie de l’examen cardiopulmonaire.</p><div class="key"><b>Conduite.</b> Un signe d’alarme impose une exploration immédiate, souvent hospitalière, quelle que soit la durée de la toux.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, tableaux 2 et 3, figures 2 et 3</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, infection respiratoire aiguë de l’adulte, validée le 01.09.2026</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 4.1</a>.</p></template>
<template data-pop="r05-rx" data-title="Radiographie thoracique"><p class="lab">Indication</p><p>Toute toux chronique, de face et de profil ; toute toux aiguë avec signe d’alarme. Dans l’infection respiratoire aiguë ambulatoire, la SSI ne la recommande pas en routine.</p><p class="lab">Ce qu’elle recherche</p><p>Tuberculose, cancer, bronchiectasies, emphysème, pneumopathie interstitielle, stase. Les bronchiectasies donnent des parois bronchiques épaissies en « rails », des images en anneau et des opacités périphériques de bouchons mucopurulents.</p><div class="key"><b>Limite.</b> Une radiographie normale n’exclut pas des bronchiectasies ; la question posée est « le cliché explique-t-il la toux ? ».</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 2 et section 5.7</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 4 et 11</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, infection respiratoire aiguë de l’adulte, validée le 01.09.2026</a>.</p></template>
<template data-pop="r05-spiro" data-title="Spirométrie dans la toux"><p class="lab">Indication</p><p>Obligatoire dans toute toux chronique ; le débit de pointe répété la remplace si elle n’est pas disponible (HUG).</p><div class="key"><b>Piège.</b> Variabilité et réversibilité ont une très faible valeur prédictive négative chez le patient qui tousse et dont la fonction est normale : une spirométrie normale n’exclut pas un asthme à forme de toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 2</a>.</p></template>
<template data-pop="r05-feno" data-title="Fraction expirée du monoxyde d’azote"><p>Le FeNO estime l’inflammation bronchique de type 2, éosinophilique, productrice de monoxyde d’azote. Sa spécificité pour l’asthme est d’environ 0,85 chez l’adulte qui tousse ; la Société allemande de pneumologie évoque une bronchite à éosinophiles au-delà de 50 ppb sans hyperréactivité.</p><div class="key"><b>Contentieux.</b> L’ERS 2020 juge non démontrée son utilité pour prédire la réponse aux corticoïdes et n’en fait qu’une recommandation de recherche. Les HUG 2025, source applicable la plus récente, le jugent utile pour prédire la réponse au corticoïde inhalé (preuve modérée, méta-analyse de 2021). Le cours retient les HUG : le FeNO aide la décision, sans seuil consensuel dans la toux chronique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 2</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 2</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, figure 4</a>.</p></template>
<template data-pop="r05-eos" data-title="Éosinophiles du sang et de l’expectoration"><p class="lab">Sang</p><p>Un taux supérieur à 0,3 G/L suggère une inflammation éosinophilique des voies aériennes ; il varie selon l’heure et la saison et se mesure plusieurs fois.</p><p class="lab">Expectoration induite</p><p>Le marqueur le plus exact, mais long, réservé aux centres spécialisés et dépendant d’une lecture experte.</p><div class="key"><b>Note de lecture.</b> L’ERS écrit « 0,3 cellule par microlitre » ; le cours lit 0,3 × 10⁹ par litre, soit 300 par microlitre, seule lecture compatible avec la biologie.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-metacholine" data-title="Test de provocation à la méthacholine"><p>L’inhalation de doses croissantes de méthacholine révèle une hyperréactivité bronchique. Le test est positif par définition dans l’asthme à forme de toux, négatif dans la bronchite à éosinophiles ; il se discute lorsque l’asthme reste incertain. L’ERS rapporte des pratiques divergentes, et la Société allemande de pneumologie admet à la place un essai inhalé de quatre semaines.</p><div class="key"><b>Limite.</b> Environ 30 % de la population générale a une hyperréactivité bronchique : un test positif ne prouve pas qu’elle cause la toux.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 9</a>.</p></template>
<template data-pop="r05-tdm" data-title="Tomodensitométrie thoracique"><p class="lab">Recommandation</p><p>L’ERS suggère de ne pas la réaliser de façon systématique lorsque la radiographie et l’examen sont normaux (recommandation conditionnelle, preuve très faible) : ses anomalies expliquent rarement la toux, et l’irradiation expose surtout l’enfant et la femme.</p><p class="lab">Indications</p><p>Toux productive (coupes de 1 mm, à la recherche de bronchiectasies), bilan négatif ou toux réfractaire (pneumopathie interstitielle discrète, bouchons muqueux), signe d’alarme.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 1</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 11</a>.</p></template>
<template data-pop="r05-phmetrie" data-title="Exploration fonctionnelle de l’œsophage"><p class="lab">pH-impédancemétrie de 24 heures</p><p>Réalisée sans inhibiteur de la pompe à protons, elle mesure le reflux acide et, par l’impédance, le reflux non acide. Une causalité entre reflux et toux n’est admise que si la probabilité d’association symptomatique atteint au moins 95 %. Sans pyrosis ni régurgitation, elle n’aide pas.</p><p class="lab">Manométrie à haute résolution</p><p>Elle précise le siège et le mécanisme d’un trouble moteur œsophagien, fréquent chez le patient qui tousse ; le transit baryté le détecte avec une faible sensibilité.</p><p class="lab">Endoscopie</p><p>L’œsogastroduodénoscopie ne diagnostique pas la toux de reflux ; elle recherche des complications.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 8 et 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.5</a>.</p></template>
<template data-pop="r05-laryngo" data-title="Laryngoscopie"><p class="lab">Valeur</p><p>Le larynx paraît souvent rouge et inflammatoire chez le patient qui tousse, mais ce signe est peu sensible et peu spécifique. L’examen identifie une obstruction laryngée induite, surtout pendant un épisode ; entre les épisodes, il est normal.</p><div class="key"><b>Conduite.</b> La laryngoscopie, la rhinoscopie et le scanner des sinus ne sont pas systématiques : leurs anomalies ne sont pas directement liées à la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.14</a>.</p></template>
<template data-pop="r05-bnp" data-title="Bilan cardiaque et vasculaire de la toux"><p><b>Insuffisance cardiaque et arythmies.</b> Sur indices cliniques, le bilan comprend ECG, échocardiographie et BNP ou NT-proBNP ; la stase répond au diurétique.</p><p><b>Embolies récidivantes.</b> Une toux chronique avec dyspnée d’effort récente est un signal d’alarme ; le bilan associe D-dimères, peptides natriurétiques, échocardiographie et, en cas de forte suspicion, angioscanner. Une embolie est trouvée chez 4 à 6 % des patients hospitalisés pour exacerbation de BPCO.</p><p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 4</a>.</p></template>
<template data-pop="r05-compteur" data-title="Enregistrement objectif de la toux"><p class="lab">Principe</p><p>Un enregistreur sonore porté 24 heures compte les secousses de toux. Les essais récents utilisent la fréquence de toux sur 24 heures comme critère principal : environ 18 à 23 toux par heure au départ dans les essais du géfapixant.</p><div class="key"><b>Limite.</b> L’ERS réclame des appareils entièrement automatisés pour l’usage courant ; en pratique, le score de 0 à 10 et le questionnaire de Leicester restent les outils de consultation.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Lyfnua®, tableau 2</a>.</p></template>
<template data-pop="r05-trp" data-title="Canaux TRPV1 et TRPA1"><p class="lab">Rôle</p><p>Ces canaux ioniques des terminaisons vagales détectent les irritants et participent à la sensation de chatouillement qui précède la toux. L’inflammation allergique ou virale augmente l’expression de TRPV1 dans les neurones nodaux chez l’animal.</p><div class="key"><b>Conséquence thérapeutique.</b> Leurs antagonistes, efficaces chez l’animal, ont échoué en clinique ; la recherche s’est déplacée vers le récepteur P2X3.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., 2020</a>.</p></template>
<template data-pop="r05-epreuve" data-title="Traitement d’épreuve : contentieux entre sources"><p class="lab">Positions</p><p><b>ERS 2020</b> : si l’évaluation ne désigne pas le trait en cause, essais thérapeutiques successifs, chacun arrêté sans réponse ; corticoïde inhalé de 2 à 4 semaines. <b>Société allemande de pneumologie, janvier 2025</b> : essai inhalé de quatre semaines en cas de suspicion éosinophilique ; pas d’inhibiteur de la pompe à protons sans symptôme de reflux. <b>HUG 2025</b> : le traitement d’épreuve « n’est plus recommandé » sans argument au moins anamnestique, car plus de 40 % des patients n’y répondaient pas.</p><div class="key"><b>Arbitrage.</b> La source applicable la plus récente, les HUG, l’emporte : aucun traitement empirique sans indice clinique. Les trois sources convergent sur un point : si l’anamnèse ou les marqueurs désignent un trait, un essai limité, évalué et arrêté s’il échoue reste justifié.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 6 et 9</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-antibio" data-title="Antibiotique dans la toux aiguë : qui tester, qui traiter"><p class="lab">Ne pas doser la CRP (SSI 2026)</p><p>Toux aiguë avec au moins deux signes parmi rhinorrhée, mal de gorge ou enrouement, fièvre inférieure à 38,5 °C, et sans dyspnée, tachycardie ni râles : le bénéfice d’un antibiotique est estimé à moins de 1 à 3 %.</p><p class="lab">Doser la CRP</p><p>Toux aiguë avec au moins un signe : fièvre mesurée d’au moins 38,5 °C depuis plus de 3 jours, dyspnée, fréquence respiratoire d’au moins 22 par minute, anomalie focale à l’auscultation, pouls d’au moins 100 par minute.</p><p class="lab">Décision</p><p>CRP d’au moins 100 mg/L : antibiotique à envisager ; inférieure à 50 mg/L : traitement symptomatique ; entre 50 et 100 mg/L : décision partagée. Le choix suit la recommandation de la pneumonie (amoxicilline 1 g toutes les 8 heures chez l’adulte ambulatoire sans comorbidité) ; voir J18 — Pneumonies.</p><div class="key"><b>Repère européen.</b> Le NICE discute aussi l’antibiotique chez le patient très altéré ou à haut risque : comorbidité significative, immunosuppression, ou grand âge associé à une hospitalisation récente, un diabète, une insuffisance cardiaque ou une corticothérapie orale.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, « Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte », version 40978 validée le 01.09.2026, sections « Tests » et « Traitement »</a> ; <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE, toux aiguë, février 2019, recommandations 1.1.10 à 1.1.16</a>.</p></template>
<template data-pop="r05-miel" data-title="Miel, antitussifs et sécrétolytiques : preuves et contentieux"><p class="lab">SSI, septembre 2026</p><p>Le dextrométhorphane peut soulager la toux sèche, mais son efficacité est contestée ; la codéine ne fait pas mieux que le placebo. Le miel réduit la fréquence et la violence des quintes et améliore le sommeil ; l’association lierre-thym peut soulager ; l’échinacée est inefficace ; antihistaminiques et décongestionnants apportent peu ; l’acétylcystéine a un bénéfice de faible niveau de preuve.</p><p class="lab">Autres sources</p><p>HUG 2025 : jusqu’à 85 % de l’effet des sirops serait un effet placebo, et le miel fait presque aussi bien avec moins d’effets indésirables. Société allemande de pneumologie 2025 : sécrétolytiques, dextrométhorphane et phytothérapie à la demande du patient. NICE 2019 : pas de mucolytique ; miel après un an.</p><div class="key"><b>Arbitrage.</b> La source applicable la plus récente, suisse, est la SSI 2026 : le traitement symptomatique reste une option de confort, brève et à preuves faibles ; le miel, après un an, en est le choix le mieux toléré.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, « Infection respiratoire aiguë et/ou syndrome grippal chez l’adulte », version 40978 validée le 01.09.2026, section « Traitement »</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.1</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 2 et 12</a> ; <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE, toux aiguë, février 2019</a>.</p></template>
<template data-pop="r05-cough-control" data-title="Thérapie de contrôle de la toux"><p class="lab">Contenu</p><p>Éducation sur la toux et ses déclencheurs ; respiration nasale et diaphragmatique ; techniques pour éviter, interrompre ou atténuer la toux ; en logopédie, explication que la toux n’est pas « imaginaire », hygiène vocale et toux à moindre pression sous-glottique. Le patient apprend qu’une envie de tousser n’impose pas de tousser.</p><p class="lab">Preuves</p><p>Deux essais randomisés chez l’adulte réfractaire : baisse de 2,8 points d’un score de toux (échelle de 2 à 10) après deux mois ; gain de 1,53 point au questionnaire de Leicester et baisse de la fréquence objective après quatre séances hebdomadaires, maintenus trois mois. Aucun effet indésirable ; thérapeutes formés encore rares.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 7</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 12.a et 12.b</a>.</p></template>
<template data-pop="r05-enfant" data-title="Toux chronique de l’enfant"><p class="lab">Définition et causes</p><p>Toux de plus de quatre semaines ; entre trois et huit semaines, on parle aussi de toux aiguë prolongée. La maturation du réflexe, de l’immunité et des voies aériennes fait prédominer infections et anomalies congénitales : résolution post-infectieuse, asthme et bronchite bactérienne prolongée surtout ; trachéomalacie, bronchiectasies, corps étranger ; toux d’habitude ou tic, reconnaissable à sa suppressibilité, sa distractibilité et sa sensation prémonitoire.</p><p class="lab">Conduite</p><p>Anamnèse et examen détaillés, radiographie et spirométrie si l’enfant coopère. Sans indice ni anomalie, observation de quatre semaines au plus ; puis essai de corticoïde inhalé de 2 à 4 semaines dans la toux sèche, cultures et essai antibiotique dans la toux humide. Pas de neuromodulateur ; l’antileucotriène expose à des effets neuropsychiatriques transitoires chez plus de 10 % des enfants.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, toux chronique de l’enfant et questions 3 et 8</a>.</p></template>
<template data-pop="r05-pbb" data-title="Bronchite bactérienne prolongée"><p class="lab">Critères de l’ERS</p><p>Trois critères réunis : toux humide continue de plus de quatre semaines ; absence de signe orientant vers une autre cause ; guérison après 2 à 4 semaines d’un antibiotique oral approprié.</p><p class="lab">Preuve</p><p>Chez de jeunes enfants (âge moyen 1,9 an), l’amoxicilline-acide clavulanique, 22,5 mg/kg par prise deux fois par jour pendant deux semaines, a fait disparaître la toux chez 48 % contre 16 % sous placebo.</p><div class="key"><b>Portée.</b> Elle pourrait précéder des bronchiectasies. L’antibiotique, la dose et la durée optimaux restent inconnus.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 8</a>.</p></template>
