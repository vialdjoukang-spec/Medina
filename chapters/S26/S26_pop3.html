<!-- ===== FENÊTRES S26 : monographies et Pareto ===== -->
<template data-pop="s26-d-atx" data-title="Acide tranexamique (Cyklokapron®)">
<div class="lab">Mécanisme</div><p>L’acide tranexamique est un analogue de la lysine qui bloque les sites de liaison du plasminogène à la fibrine. Il empêche ainsi la plasmine de dissoudre le caillot, ce qui limite la fibrinolyse activée par le traumatisme.</p>
<div class="lab">Preuves</div><p>Dans l’essai CRASH-2, qui a inclus 20 211 blessés, la mortalité toutes causes était de 14,5 % sous acide tranexamique contre 16,0 % sous placebo, et la mortalité par hémorragie de 4,9 % contre 5,7 %. Une revue de sept essais randomisés n’a pas montré d’excès d’événements thrombotiques (ESVS 2025).</p>
<div class="lab">Posologie</div><p>La recommandation européenne 2023 prescrit 1 g par voie intraveineuse en 10 minutes, puis 1 g en perfusion sur 8 heures, le plus tôt possible, si possible pendant le transport, et dans les 3 heures qui suivent le traumatisme ; l’administration n’attend pas les tests viscoélastiques.</p>
<div class="lab">Précautions</div><p>Le médicament s’élimine par le rein, ce qui impose la prudence en cas d’insuffisance rénale sévère selon l’information professionnelle suisse. Un antécédent thromboembolique récent fait peser le bénéfice et le risque.</p>
</template>
<template data-pop="s26-d-remplissage" data-title="Remplissage et transfusion du blessé">
<div class="lab">Principe</div><p>Le blessé qui saigne reçoit des produits sanguins en proportions équilibrées selon le protocole de transfusion massive de l’établissement, plutôt que de grands volumes de cristalloïdes (ESVS 2025, recommandation 4).</p>
<div class="lab">Raison</div><p>Les cristalloïdes diluent les facteurs de coagulation et refroidissent le patient ; ils aggravent donc la coagulopathie. À l’inverse, les produits sanguins apportent à la fois le transport d’oxygène et l’hémostase.</p>
<div class="lab">Cas de la tamponnade</div><p>Dans la tamponnade, le remplissage élève la pression de remplissage droite au-dessus de la pression péricardique ; il améliore donc transitoirement le débit, mais il ne remplace pas l’ouverture du péricarde.</p>
</template>
<template data-pop="s26-d-vaso" data-title="Vasopresseur chez le blessé">
<div class="lab">Place</div><p>La recommandation européenne 2023 admet un vasopresseur en complément du remplissage lorsque l’hypotension menace la vie malgré le volume administré.</p>
<div class="lab">Raison de sa place secondaire</div><p>Le vasopresseur contracte les vaisseaux, mais il ne remplace pas le sang perdu. De plus, il augmente la postcharge, ce qui gêne un cœur comprimé ou contusionné. C’est pourquoi il ne s’emploie qu’en titration continue, pour atteindre la pression cible, pendant que la cause est traitée.</p>
</template>
<template data-pop="pareto-s26-notions" data-title="Pareto — Notions et mécanismes"><p class="ratio" data-cover="s26-0,s26-1,s26-2,s26-3"></p><ul>
<li>La catégorie S26 code l’hémopéricarde (S26.0), la contusion (S26.81), les plaies sans ou avec ouverture d’une cavité (S26.82, S26.83), et l’on ajoute S21.83! pour une plaie ouverte du thorax.</li>
<li>Un faible volume tamponne lorsqu’il s’accumule vite, parce que le péricarde fibreux ne se distend pas.</li>
<li>Le ventricule droit est la cavité la plus souvent atteinte par une plaie antérieure, car il est la plus antérieure.</li>
<li>La fracture sternale seule ne prédit pas la contusion cardiaque.</li></ul></template>
<template data-pop="pareto-s26-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="s26-4,s26-5"></p><ul>
<li>La triade de Beck est souvent incomplète ; c’est pourquoi la FAST examine le péricarde dès l’examen primaire.</li>
<li>Le blessé instable va au bloc sans angioscanner (ESVS 2025, recommandation 9).</li>
<li>La thoracotomie de réanimation est fortement recommandée pour la plaie pénétrante du thorax sans pouls avec signes de vie, et déconseillée pour le traumatisme fermé sans signe de vie (EAST 2015).</li>
<li>La péricardiocentèse ne fait que gagner du temps.</li></ul></template>
<template data-pop="pareto-s26-crit" data-title="Pareto — Critères"><p class="ratio" data-cover="s26-6"></p><ul>
<li>Un ECG et une troponine I normaux excluent la contusion cardiaque (EAST 2012).</li>
<li>L’acide tranexamique se donne en 1 g sur 10 minutes, puis 1 g sur 8 heures, dans les 3 heures.</li></ul></template>
<template data-pop="pareto-s26-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="s26-e-1,s26-e-2"></p><ul>
<li>La FAST cherche le sang péricardique chez le blessé instable ; le collapsus diastolique droit prouve la tamponnade.</li>
<li>L’échocardiographie complète est réservée à l’instabilité ou à l’arythmie persistante.</li>
<li>Le scanner du blessé stable recherche les lésions associées, notamment aortiques.</li></ul></template>
<template data-pop="pareto-s26-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="s26-p-1,s26-p-2"></p><ul>
<li>L’acide tranexamique est donné tôt à tout blessé qui saigne.</li>
<li>Le vasopresseur ne vient qu’en complément du remplissage.</li>
<li>La commotio cordis se traite par la défibrillation immédiate.</li></ul></template>
