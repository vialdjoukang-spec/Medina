<!-- ===== FENÊTRES S26 : examen clinique, gestes, examens ===== -->
<template data-pop="s26-beck" data-title="Triade de Beck">
<div class="lab">Définition</div><p>La triade de Beck associe une hypotension artérielle, une turgescence des veines jugulaires et un assourdissement des bruits du cœur ; elle traduit une tamponnade.</p>
<div class="lab">Mécanisme de chaque signe</div><p>L’hypotension vient de la chute du débit, parce que les ventricules se remplissent mal. La turgescence jugulaire vient du sang veineux qui ne peut plus entrer dans l’oreillette droite comprimée. L’assourdissement vient du liquide qui éloigne le cœur du stéthoscope.</p>
<div class="lab">Piège</div><p>La triade est souvent incomplète chez le blessé : l’hypovolémie associée vide les jugulaires et le bruit ambiant masque les bruits du cœur. C’est pourquoi l’échographie ciblée est préférée à la recherche clinique de la triade.</p>
</template>
<template data-pop="s26-fast" data-title="Échographie ciblée en traumatologie (FAST)">
<div class="lab">Définition</div><p>La FAST est une échographie rapide, faite au lit pendant l’examen primaire, qui cherche du liquide libre dans le péricarde, autour du foie et de la rate, et dans le pelvis.</p>
<figure><img src="images/cardiologie/s26_epanchement_hemorragique_echo.gif" alt="Échographie réelle d’un épanchement péricardique hémorragique" width="429" height="377" loading="lazy" decoding="async"><figcaption>Épanchement péricardique hémorragique : bande sombre autour du cœur, car le liquide ne renvoie pas les ultrasons (ici d’origine tumorale). James Heilman, MD, Wikimedia Commons, CC BY-SA 3.0.</figcaption></figure>
<div class="lab">Raison de son emploi</div><p>Elle se répète facilement, n’irradie pas et ne retarde pas la réanimation ; elle est donc utile chez le blessé instable pour décider du geste (ESVS 2025).</p>
<div class="lab">Limites</div><p>Elle ne localise pas la source d’un saignement vasculaire du tronc, et elle dépend de l’opérateur. De plus, un caillot frais peut ressembler au myocarde ; par conséquent, une FAST négative chez un blessé instable ne doit pas retarder l’exploration.</p>
</template>
<template data-pop="s26-signes-vie" data-title="Signes de vie (EAST 2015)">
<div class="lab">Définition</div><p>L’EAST 2015 définit les signes de vie comme la présence d’au moins un des éléments suivants : réaction pupillaire, ventilation spontanée, pouls carotidien, pression artérielle mesurable ou palpable, mouvements des membres ou activité électrique cardiaque.</p>
<div class="lab">Raison</div><p>Ces signes témoignent d’une perfusion cérébrale encore présente. Par conséquent, ils séparent les blessés chez qui la thoracotomie peut encore sauver le cerveau de ceux chez qui elle arrive trop tard.</p>
<div class="lab">Chiffres de la revue</div><p>Après plaie pénétrante du thorax, la survie atteignait 21,3 % avec signes de vie et 8,3 % sans signe de vie ; après traumatisme fermé, elle était de 4,6 % avec signes de vie et de 0,7 % sans signe de vie.</p>
</template>
<template data-pop="s26-pneumothorax" data-title="Pneumothorax compressif">
<div class="lab">Définition</div><p>Le pneumothorax compressif est une accumulation d’air sous pression dans la plèvre, qui refoule le médiastin et gêne le retour veineux.</p>
<div class="lab">Distinction avec la tamponnade</div><p>Les deux donnent hypotension et turgescence jugulaire, parce que les deux empêchent le sang d’entrer dans le cœur. Cependant, le pneumothorax abolit le murmure vésiculaire d’un côté et rend l’hémithorax tympanique, alors que la tamponnade assourdit les bruits du cœur sans signe pleural.</p>
<div class="lab">Conséquence pratique</div><p>Le pneumothorax compressif se décomprime par une aiguille ou une thoracostomie au doigt, sans attendre la radiographie ; la tamponnade, elle, se lève en ouvrant le péricarde.</p>
</template>
<template data-pop="s26-pericardiocentese" data-title="Péricardiocentèse dans le traumatisme">
<div class="lab">Définition</div><p>La péricardiocentèse est la ponction du péricarde à l’aiguille, habituellement par voie sous-xiphoïdienne sous contrôle échographique, pour évacuer le liquide.</p>
<div class="lab">Raison de sa place limitée</div><p>Dans le traumatisme, le sang coagule dans le péricarde et s’aspire mal ; de plus, la plaie continue de saigner. C’est pourquoi l’ATLS ne la retient que comme mesure temporaire lorsque la chirurgie n’est pas immédiatement disponible.</p>
<div class="lab">Physiologie utile</div><p>Sur la partie raide de la courbe pression-volume, l’évacuation d’un petit volume abaisse fortement la pression ; une ponction de quelques dizaines de millilitres peut donc restaurer un pouls le temps du transfert.</p>
</template>
<template data-pop="s26-thoracotomie" data-title="Thoracotomie de réanimation">
<div class="lab">Définition</div><p>La thoracotomie de réanimation est une ouverture du thorax faite aux urgences chez un blessé sans pouls, habituellement par une incision antérolatérale gauche dans le quatrième ou le cinquième espace intercostal.</p>
<figure><img src="images/cardiologie/s26_thoracotomie_urgence.gif" alt="Photographie peropératoire réelle d’une thoracotomie de réanimation" width="560" height="363" loading="lazy" decoding="async"><figcaption>Écarteur costal en place et cœur exposé : l’accès direct permet de lever la tamponnade et de contrôler la plaie. Cothren et Moore, article en libre accès, Wikimedia Commons, CC BY 2.0.</figcaption></figure>
<div class="lab">Objectifs</div><p>Le geste ouvre le péricarde pour lever la tamponnade, contrôle une plaie cardiaque, permet le massage cardiaque à thorax ouvert et le clampage de l’aorte descendante, qui redirige le débit vers le cerveau et le cœur.</p>
<div class="lab">Indications (EAST 2015)</div><p>Elle est fortement recommandée après plaie pénétrante du thorax chez un blessé sans pouls avec signes de vie. Elle est conditionnellement recommandée dans les autres situations pénétrantes et dans le traumatisme fermé avec signes de vie. En revanche, elle est déconseillée dans le traumatisme fermé sans signe de vie.</p>
</template>
<template data-pop="s26-damage-control" data-title="Réanimation de contrôle des dégâts">
<div class="lab">Définition</div><p>La réanimation de contrôle des dégâts associe une hypotension permissive, une réanimation hémostatique par produits sanguins équilibrés et une chirurgie limitée à l’arrêt du saignement et de la contamination (ESVS 2025).</p>
<div class="lab">Raison</div><p>Le blessé qui saigne développe une coagulopathie, une acidose et une hypothermie qui s’aggravent mutuellement. Par conséquent, une chirurgie longue et complète tue davantage qu’une chirurgie courte suivie d’une réparation différée.</p>
<div class="lab">Cibles</div><p>La recommandation européenne 2023 vise une pression systolique de 80 à 90 mmHg, soit une pression artérielle moyenne de 50 à 60 mmHg, jusqu’au contrôle du saignement en l’absence de lésion cérébrale ; en cas de traumatisme crânien grave avec un score de Glasgow d’au plus 8, elle vise une pression moyenne d’au moins 80 mmHg.</p>
</template>
<template data-pop="s26-ecg" data-title="ECG d’admission du blessé thoracique">
<div class="lab">Indication</div><p>L’EAST 2012 demande un ECG d’admission chez tout patient suspect de contusion cardiaque.</p>
<div class="lab">Anomalies qui imposent un monitorage</div><p>Une arythmie, une modification du segment ST, des signes d’ischémie ou un bloc de conduction nouveaux imposent une surveillance électrocardiographique continue. Chez un patient qui avait déjà des anomalies, la comparaison avec un ECG antérieur décide.</p>
<div class="lab">Raison</div><p>Le myocarde contusionné est électriquement instable, et c’est l’arythmie qui fait le danger de la contusion ; or, l’ECG la détecte directement.</p>
</template>
<template data-pop="s26-troponine" data-title="Troponine I dans la contusion cardiaque">
<div class="lab">Définition</div><p>La troponine I est une protéine propre au myocarde, libérée dans le sang lorsque des cellules musculaires cardiaques sont lésées.</p>
<div class="lab">Interprétation (EAST 2012)</div><p>Une troponine I normale associée à un ECG normal exclut la contusion. Une troponine I élevée, même avec un ECG normal, impose une surveillance monitorée et un dosage répété, dont le moment optimal n’est pas établi.</p>
<div class="lab">Piège</div><p>Une élévation de la troponine n’est pas spécifique du traumatisme : un infarctus qui a causé l’accident peut la produire. C’est pourquoi l’EAST admet le scanner ou l’imagerie par résonance magnétique cardiaques pour distinguer infarctus et contusion.</p>
</template>
<template data-pop="s26-echocardio" data-title="Échocardiographie dans le traumatisme fermé">
<div class="lab">Indication (EAST 2012)</div><p>L’échocardiographie est indiquée chez le patient instable ou porteur d’une arythmie nouvelle persistante ; si la voie transthoracique est insuffisante, la voie transœsophagienne est utilisée.</p>
<div class="lab">Raison</div><p>Elle recherche ce que l’ECG ne voit pas : une dysfonction ventriculaire, un épanchement, une rupture valvulaire ou septale. En revanche, elle n’est pas utile comme examen de dépistage chez le patient stable.</p>
</template>
