<section class="ilot" id="s26-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 24 ans arrive aux urgences après un coup de couteau dans le quatrième espace intercostal gauche, juste à côté du sternum. Sa pression artérielle est à 80/50 mmHg, son pouls à 128 par minute, et ses veines jugulaires sont turgescentes alors qu’il saigne peu à l’extérieur. Or, une hypotension avec des jugulaires pleines ne s’explique pas par une simple hémorragie, car l’hypovolémie vide les veines. La question qui structure ce cours est donc la suivante : <b>devant un traumatisme thoracique, comment reconnaître en quelques minutes une lésion du cœur qui tue par tamponnade ou par hémorragie, et quel geste la corrige ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, il fait comprendre pourquoi un faible volume de sang dans le péricarde suffit à arrêter la circulation. Ensuite, il oppose deux situations qui n’ont pas la même urgence : la plaie pénétrante, qui impose souvent le bloc opératoire immédiat, et la <button class="w" data-k="s26-contusion">contusion cardiaque</button> du traumatisme fermé, qui se dépiste par l’ECG et la troponine I selon l’<button class="w" data-k="s26-east2012">algorithme EAST 2012</button>. Enfin, il justifie chaque décision, de l’échographie au lit à la <button class="w" data-k="s26-thoracotomie">thoracotomie de réanimation</button>.</p>
<p>Ce cours se lit d’ailleurs autrement qu’un manuel figé. En effet, chaque terme vert ouvre une fenêtre qui explique le mécanisme, le seuil et la raison de la décision ; de plus, les cas de l’onglet Examens obligent à appliquer le raisonnement. Ainsi, le lecteur passe de la notion au geste sans changer de livre.</p>
</section>
<section class="ilot" id="s26-1"><h2><span class="n">1</span>Définitions, formes et codage</h2>
<p>La lésion traumatique du cœur désigne toute atteinte du muscle cardiaque, de ses cavités, de ses valves, de ses artères coronaires ou du péricarde qui l’entoure, causée par un agent extérieur. On distingue deux mécanismes, car ils ne produisent ni les mêmes lésions ni la même urgence. D’une part, le <button class="w" data-k="s26-penetrant">traumatisme pénétrant</button>, par arme blanche ou par balle, ouvre une ou plusieurs cavités ; d’autre part, le <button class="w" data-k="s26-ferme">traumatisme fermé</button>, par décélération ou compression, contusionne le muscle sans plaie cutanée en regard.</p>

<tr><td>S26.0</td><td>Hémopéricarde traumatique</td><td>Le sang s’est accumulé dans le péricarde, avec ou sans tamponnade</td></tr>

<tr><td>S26.82</td><td>Plaie du cœur sans ouverture d’une cavité</td><td>La plaie atteint le myocarde sans perforer la cavité</td></tr>

<tr><td>S26.9</td><td>Lésion du cœur, sans précision</td><td>Code d’attente, à remplacer dès que la lésion est précisée</td></tr></table>
<p>Ce tableau se lit donc de la lésion la plus superficielle à la plus profonde, puis vers les codes de précision. De plus, la <button class="w" data-k="s26-codage">règle de codage</button> impose d’ajouter le code S21.83! lorsque la plaie thoracique communique avec la lésion intrathoracique ; ainsi, le codage distingue la plaie ouverte de la contusion fermée, ce qui correspond aussi à deux prises en charge différentes.</p>
</section>
<section class="ilot" id="s26-2"><h2><span class="n">2</span>Physiopathologie de la tamponnade</h2>
<p>Normalement, le cœur bat dans un sac, le <button class="w" data-k="s26-pericarde">péricarde</button>, dont la couche fibreuse est peu extensible. Or, cette rigidité devient dangereuse lorsque du sang y entre vite : en effet, le péricarde n’a pas le temps de se distendre, si bien qu’un faible volume suffit à élever fortement la pression intrapéricardique. Par conséquent, la pression autour du cœur dépasse la pression de remplissage des cavités droites, qui sont les plus souples, et l’oreillette puis le ventricule droits se collabent en diastole.</p>
<p>La suite découle de ce remplissage empêché. Ainsi, le ventricule droit éjecte moins, le ventricule gauche reçoit moins, et le débit cardiaque chute malgré une fréquence rapide. De plus, l’<button class="w" data-k="s26-interdependance">interdépendance ventriculaire</button> explique le <button class="w" data-k="s26-pouls-paradoxal">pouls paradoxal</button> : à l’inspiration, le retour veineux gonfle le ventricule droit, qui repousse le septum vers la gauche et réduit encore le remplissage gauche. Enfin, le sang veineux ne peut plus entrer dans le cœur ; c’est pourquoi les jugulaires se distendent, à l’inverse de l’hémorragie pure.</p>
<figure><img src="images/cardiologie/s26_hemopericarde_autopsie.gif" alt="Photographie anatomopathologique réelle d’un hémopéricarde : caillot sanguin entourant le cœur à l’ouverture du péricarde lors d’une autopsie" width="480" height="568" loading="lazy" decoding="async">
<figcaption>Figure 1 — Hémopéricarde à l’autopsie : du sang coagulé entoure le cœur ; la graisse épicardique lui donne par endroits une teinte jaune. Image de Mikael Häggström, MD, Wikimedia Commons, licence CC0 ; convertie pour l’atlas.</figcaption></figure>
<p>La figure 1 montre ainsi ce que la clinique ne voit pas : le caillot occupe tout l’espace entre le péricarde et le cœur, et il comprime surtout les cavités droites, dont la paroi est mince. Cependant, ce caillot explique aussi un piège pratique : une aiguille de <button class="w" data-k="s26-pericardiocentese">péricardiocentèse</button> aspire mal du sang coagulé, ce qui justifie que la chirurgie reste le traitement de référence de l’hémopéricarde traumatique.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> La tamponnade aiguë associe une hypotension, une turgescence jugulaire et des bruits du cœur assourdis, parce que le sang comprime le cœur de l’extérieur ; or, chez le blessé qui a aussi perdu beaucoup de sang, l’hypovolémie peut vider les jugulaires et masquer ce signe.</div>
</section>
<section class="ilot" id="s26-3"><h2><span class="n">3</span>Mécanismes et lésions</h2>
<p>Dans le traumatisme pénétrant, le siège de la plaie dépend de l’anatomie. En effet, le ventricule droit occupe la plus grande partie de la face antérieure du cœur, juste derrière le sternum ; c’est pourquoi il est la cavité la plus souvent atteinte par une plaie antérieure. De plus, une plaie de la <button class="w" data-k="s26-zone-danger">zone de danger précordiale</button> doit faire rechercher une lésion cardiaque, même si le patient paraît stable, car un petit orifice péricardique peut se colmater puis se rouvrir.</p>
<p>Dans le traumatisme fermé, au contraire, l’énergie se transmet sans plaie. Ainsi, une décélération ou une compression entre le sternum et le rachis produit une <button class="w" data-k="s26-contusion">contusion</button> du muscle, plus rarement une <button class="w" data-k="s26-rupture">rupture de paroi, de septum ou de valve</button>, ou une dissection d’une artère coronaire. Enfin, un choc précordial bref et violent, par exemple une balle reçue en plein thorax, peut déclencher une fibrillation ventriculaire sans aucune lésion anatomique : c’est la <button class="w" data-k="s26-commotio">commotio cordis</button>.</p>
<figure><img src="images/cardiologie/s26_fracture_sternale_scanner.gif" alt="Coupe de scanner thoracique réelle montrant une fracture comminutive du sternum avec un hématome rétrosternal" width="460" height="460" loading="lazy" decoding="async">
<figcaption>Figure 2 — Scanner thoracique : fracture comminutive du sternum et hématome rétrosternal. Image de Monkhouse et Kelly (figure d’article en libre accès, modifiée par Delldot), Wikimedia Commons, licence CC BY 2.0 ; convertie pour l’atlas.</figcaption></figure>
<p>La figure 2 rappelle que le sternum fracturé se trouve juste en avant du ventricule droit ; il est donc tentant d’en déduire une contusion cardiaque. Or, l’EAST 2012 conclut que la fracture sternale seule ne prédit pas la contusion cardiaque ; par conséquent, si l’ECG et la troponine I sont normaux, la fracture sternale ne justifie pas à elle seule une surveillance monitorée. En revanche, l’hématome rétrosternal doit faire rechercher une lésion vasculaire du médiastin, ce qui relève de l’angioscanner.</p>
