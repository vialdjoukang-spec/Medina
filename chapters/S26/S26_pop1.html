<!-- ===== FENÊTRES S26 : notions, mécanismes, codage ===== -->
<template data-pop="s26-pericarde" data-title="Péricarde">
<div class="lab">Définition</div><p>Le péricarde est le sac qui entoure le cœur. Il comprend une couche externe fibreuse, épaisse et peu extensible, et une séreuse à deux feuillets, entre lesquels se trouve normalement une fine lame de liquide, de 10 à 50 mL selon l’ESC 2015, qui permet au cœur de glisser.</p>
<div class="lab">Mécanisme</div><p>La couche fibreuse limite la dilatation aiguë du cœur, ce qui est utile au repos. Cependant, cette même rigidité fait monter la pression très vite lorsque du sang s’accumule brutalement, parce que le sac ne peut pas s’étirer en quelques minutes.</p>
<div class="lab">Conséquence pratique</div><p>Un saignement rapide dans le péricarde tamponne avec un faible volume ; c’est pourquoi un blessé peut mourir de tamponnade alors qu’il a perdu peu de sang.</p>
</template>
<template data-pop="s26-interdependance" data-title="Interdépendance ventriculaire">
<div class="lab">Définition</div><p>L’interdépendance ventriculaire désigne le fait que le remplissage d’un ventricule modifie celui de l’autre, parce que les deux partagent le septum et le même sac péricardique.</p>
<div class="lab">Mécanisme</div><p>Dans la tamponnade, le volume total du cœur est fixé par la pression péricardique. Ainsi, à l’inspiration, le retour veineux augmente le volume du ventricule droit ; or, comme le volume total ne peut pas croître, le septum bombe vers la gauche et le ventricule gauche se remplit moins.</p>
<div class="lab">Conséquence pratique</div><p>Le volume éjecté par le ventricule gauche baisse à chaque inspiration, ce qui produit le pouls paradoxal et les variations respiratoires des flux à l’échographie.</p>
</template>
<template data-pop="s26-pouls-paradoxal" data-title="Pouls paradoxal">
<div class="lab">Définition</div><p>Le pouls paradoxal est une baisse de la pression artérielle systolique de plus de 10 mmHg à l’inspiration.</p>
<div class="lab">Technique</div><p>On gonfle le brassard au-dessus de la systolique, puis on le dégonfle lentement : le premier bruit n’est d’abord entendu qu’en expiration, puis il devient audible à chaque battement. L’écart entre ces deux pressions mesure le pouls paradoxal.</p>
<div class="lab">Piège</div><p>Le signe s’explique par l’interdépendance ventriculaire ; il manque donc lorsque cette interdépendance est abolie, par exemple en ventilation mécanique ou en cas de communication interauriculaire. Par conséquent, son absence n’exclut pas la tamponnade.</p>
</template>
<template data-pop="s26-penetrant" data-title="Traumatisme cardiaque pénétrant">
<div class="lab">Définition</div><p>Le traumatisme pénétrant est une plaie du cœur par un agent qui traverse la paroi thoracique, le plus souvent une arme blanche ou un projectile.</p>
<div class="lab">Mécanisme</div><p>La plaie ouvre le péricarde et une cavité. Si l’orifice péricardique reste ouvert, le sang s’écoule dans la plèvre et le blessé meurt d’hémorragie ; s’il se colmate, le sang reste dans le péricarde et le blessé fait une tamponnade.</p>
<div class="lab">Conséquence pratique</div><p>Les plaies par arme blanche ont un meilleur pronostic que les plaies par balle, parce qu’elles détruisent moins de tissu ; c’est pourquoi la thoracotomie de réanimation a ses meilleurs résultats dans les plaies thoraciques pénétrantes avec signes de vie (EAST 2015).</p>
</template>
<template data-pop="s26-ferme" data-title="Traumatisme cardiaque fermé">
<div class="lab">Définition</div><p>Le traumatisme fermé atteint le cœur sans plaie qui le relie à l’extérieur, par une décélération, une compression ou un choc direct sur le thorax.</p>
<div class="lab">Mécanisme</div><p>Le cœur est comprimé entre le sternum et le rachis, ou il est projeté contre le sternum lors de la décélération. Ainsi, le muscle se contusionne, et plus rarement une paroi, le septum, une valve ou une coronaire se rompt.</p>
<div class="lab">Conséquence pratique</div><p>La lésion la plus fréquente, la contusion, se manifeste surtout par des arythmies ; c’est pourquoi son dépistage repose sur l’ECG et la troponine I, et non sur l’échographie systématique (EAST 2012).</p>
</template>
<template data-pop="s26-contusion" data-title="Contusion cardiaque">
<div class="lab">Définition</div><p>La contusion cardiaque est une lésion du myocarde par un traumatisme fermé, avec œdème, hémorragie interstitielle et nécrose de cellules musculaires, sans plaie de la paroi. Elle se code S26.81.</p>
<div class="lab">Mécanisme</div><p>Les cellules lésées libèrent la troponine et deviennent électriquement instables. Par conséquent, la contusion produit des extrasystoles, des tachycardies, des blocs ou une fibrillation ventriculaire, et plus rarement une dysfonction de pompe.</p>
<div class="lab">Conséquence pratique</div><p>Le dépistage associe l’ECG et la troponine I ; si les deux sont normaux, la contusion est exclue et le patient n’a pas besoin de monitorage cardiaque pour cette raison (EAST 2012).</p>
</template>
<template data-pop="s26-rupture" data-title="Ruptures traumatiques du cœur">
<div class="lab">Définition</div><p>Une rupture traumatique est une déchirure de la paroi libre d’une cavité, du septum interventriculaire, d’un appareil valvulaire ou d’une artère coronaire, causée par un traumatisme fermé à haute énergie.</p>
<div class="lab">Mécanisme</div><p>La compression brutale survient lorsque les cavités sont pleines, en fin de diastole ou en début de systole. La pression intracavitaire monte alors au-delà de ce que la paroi supporte, ce qui la déchire.</p>
<div class="lab">Conséquence pratique</div><p>La rupture de paroi libre est souvent mortelle avant l’arrivée ; à l’inverse, une rupture valvulaire ou septale se révèle par un nouveau souffle et une insuffisance cardiaque, ce qui justifie l’échocardiographie chez le blessé instable.</p>
</template>
<template data-pop="s26-commotio" data-title="Commotio cordis">
<div class="lab">Définition</div><p>La commotio cordis est une fibrillation ventriculaire déclenchée par un choc précordial non pénétrant, bref et localisé, sans lésion anatomique du cœur. Elle touche surtout de jeunes sportifs frappés par une balle ou un coup.</p>
<div class="lab">Mécanisme</div><p>Le choc agit comme une stimulation électrique mécanique. Or, s’il tombe pendant la portion ascendante de l’onde T, phase vulnérable de la repolarisation, il déclenche une fibrillation ventriculaire.</p>
<div class="lab">Conséquence pratique</div><p>La survie dépend du délai jusqu’à la défibrillation ; c’est pourquoi la réanimation et le défibrillateur automatisé externe sur le terrain sont le seul traitement efficace.</p>
</template>
<template data-pop="s26-zone-danger" data-title="Zone de danger précordiale">
<div class="lab">Définition</div><p>La zone de danger précordiale est la région thoracique antérieure limitée en haut par les clavicules, en bas par les rebords costaux et latéralement par les lignes médioclaviculaires.</p>
<div class="lab">Raison</div><p>Une plaie dans cette zone se projette sur le cœur et les gros vaisseaux ; elle doit donc faire rechercher une lésion cardiaque, même chez un patient stable.</p>
<div class="lab">Piège</div><p>Une plaie hors de cette zone n’exclut pas une lésion cardiaque, car le trajet de la lame ou du projectile peut être oblique ; c’est pourquoi l’échographie péricardique fait partie de l’examen de toute plaie thoracique ou abdominale haute.</p>
</template>
<template data-pop="s26-codage" data-title="Codage de la lésion traumatique du cœur">
<div class="lab">Règle</div><p>La catégorie S26 de la CIM-10-GM 2024 code la lésion du cœur selon sa nature : S26.0 pour l’hémopéricarde, S26.81 pour la contusion, S26.82 et S26.83 pour la plaie sans ou avec ouverture d’une cavité, S26.88 pour les autres lésions et S26.9 pour la lésion sans précision.</p>
<div class="lab">Code supplémentaire</div><p>Lorsque la plaie thoracique communique avec la lésion intrathoracique, la classification demande d’ajouter le code S21.83!, qui signale une plaie ouverte du thorax avec lésion intrathoracique.</p>
<div class="lab">Conséquence pratique</div><p>Le codage complet décrit ainsi à la fois la lésion du cœur et le caractère ouvert ou fermé du traumatisme, ce qui distingue les deux prises en charge.</p>
</template>
<template data-pop="s26-east2012" data-title="Algorithme de dépistage de la contusion cardiaque (EAST 2012)">
<div class="lab">Étapes</div><p>Un ECG d’admission est réalisé chez tout patient suspect de contusion cardiaque. La troponine I est dosée en même temps. Si l’ECG et la troponine I sont normaux, la contusion est exclue. Si l’ECG montre une anomalie nouvelle, ou si la troponine I est élevée, le patient est admis en surveillance monitorée et la troponine I est répétée. Si le patient est instable ou garde une arythmie nouvelle, une échocardiographie est réalisée, transœsophagienne si la voie transthoracique est insuffisante.</p>
<div class="lab">Ce que l’algorithme exclut</div><p>Les créatine kinases et leur isoenzyme ne doivent pas être dosées, car elles ne prédisent pas les complications. De même, la scintigraphie n’apporte rien de plus que l’échocardiographie.</p>
<div class="lab">Raison</div><p>L’ECG seul ne suffit pas ; c’est l’ajout de la troponine I qui a porté la valeur prédictive négative à 100 % dans quatre études retenues par l’EAST.</p>
</template>
