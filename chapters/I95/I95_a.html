<section class="ilot" id="i95-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 74 ans, parkinsonien et diabétique, tombe deux fois en se levant de table ; il décrit un voile noir, une sensation de tête vide et une douleur de la nuque, qui cèdent dès qu’il s’assoit. Par ailleurs, il prend de la tamsulosine pour sa prostate et un diurétique pour son hypertension. Or, au cabinet, sa pression couchée est de 168/90 mmHg ; après trois minutes debout, en revanche, elle tombe à 112/70 mmHg sans que le pouls s’accélère. Dès lors, la question qui structure ce cours est la suivante : <b>comment confirmer une hypotension orthostatique au lit du patient, distinguer une cause médicamenteuse ou hypovolémique d’une défaillance du système nerveux autonome, et la traiter sans aggraver l’hypertension de décubitus ?</b></p>
<p>Pour y répondre, le cours suit le plan monographique. Ainsi, à la fin de ce cours, le médecin assistant sait mesurer la pression couchée puis debout, appliquer les critères de l’hypotension orthostatique initiale, classique et retardée, interpréter la réponse de la fréquence cardiaque, réviser les traitements hypotenseurs, enseigner les mesures non médicamenteuses et prescrire la midodrine selon l’information professionnelle suisse.</p>
<div class="key"><b>Prérequis.</b> Ce cours suppose de connaître le <button class="w" data-k="i95-baroreflexe">baroréflexe artériel (boucle de régulation)</button> et la <button class="w" data-k="i95-stase">séquestration veineuse sous le diaphragme en position debout (mécanisme)</button>, car toute hypotension orthostatique naît d’un déséquilibre entre les deux.</div>
</section>
<section class="ilot" id="i95-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Avant toute démarche, il faut définir ce que l’on cherche. En effet, l’<b>hypotension artérielle</b> n’a pas de seuil universel qui en fasse une maladie : une pression basse et asymptomatique n’appelle aucun traitement. Ce qui compte en clinique est donc l’<button class="w" data-k="i95-ho">hypotension orthostatique (définition et trois profils ESC 2018)</button>, baisse de pression provoquée par le passage en position debout, car elle cause des symptômes, des chutes et des syncopes. C’est pourquoi l’ESC 2018 la classe parmi les causes circulatoires d’<b>intolérance orthostatique</b>, avec la tachycardie posturale et la syncope vasovagale orthostatique.</p>
<p>Au sein de l’hypotension orthostatique, l’ESC 2018 distingue en outre trois profils temporels, définis par l’ampleur de la chute et le délai après le lever.</p>
<table class="t"><tr><th>Profil</th><th>Critère (ESC 2018)</th><th>Terrain le plus fréquent</th></tr>
<tr><td><b>Initiale</b></td><td>Baisse de plus de 40 mmHg de la systolique et/ou de plus de 20 mmHg de la diastolique dans les <b>15 secondes</b> suivant le lever ; retour spontané, hypotension de moins de 40 secondes</td><td>Sujet jeune et longiligne, sujet âgé, alphabloquants</td></tr>
<tr><td><b>Classique</b></td><td>Baisse soutenue de la systolique d’au moins 20 mmHg, ou de la diastolique d’au moins 10 mmHg, ou systolique inférieure à 90 mmHg, dans les <b>3 minutes</b> de station debout active ou d’inclinaison à 60 degrés au moins ; baisse d’au moins 30 mmHg à considérer en cas d’hypertension de décubitus</td><td>Fragilité, médicaments vasoactifs et diurétiques, défaillance autonome, hypovolémie</td></tr>
<tr><td><b>Retardée</b></td><td>Hypotension orthostatique survenant <b>au-delà de 3 minutes</b>, par baisse lente et progressive</td><td>Sujet âgé, défaillance autonome débutante, médicaments, comorbidités</td></tr></table>
<p>Ce tableau se lit donc par le chronomètre. Ainsi, une plainte survenant dans les premières secondes du lever, et déjà résolue lorsque le médecin mesure la pression à la première minute, relève de la <button class="w" data-k="i95-init">forme initiale (critères ESC 2018)</button> ; par conséquent, elle échappe à la mesure intermittente et exige une mesure continue battement par battement. À l’inverse, une plainte survenant après plusieurs minutes de station debout peut correspondre à une <button class="w" data-k="i95-ret">forme retardée (critères ESC 2018)</button>, invisible si l’on arrête la mesure à 3 minutes.</p>
<p>Ces trois profils étant posés, reste un syndrome voisin qu’il ne faut pas confondre avec eux. En effet, la <button class="w" data-k="i95-pots">tachycardie posturale (critères ESC 2018)</button> s’en distingue : augmentation de la fréquence cardiaque de plus de 30 battements par minute, ou au-delà de 120 battements par minute, dans les 10 minutes de station debout, <b>sans hypotension orthostatique</b> ; chez les 12 à 19 ans, l’augmentation doit dépasser 40 battements par minute (ESC 2018). Elle touche surtout des femmes jeunes et, par conséquent, ne fait pas partie de l’hypotension.</p>

</section>
<section class="ilot" id="i95-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Une fois la définition acquise, il importe de mesurer l’enjeu. Or, l’hypotension orthostatique classique est associée à une <b>mortalité accrue</b> et à une plus forte prévalence de maladies cardiovasculaires (ESC 2018). De plus, la forme retardée n’est pas rare chez le sujet âgé ; chez lui, en outre, une récupération lente de la pression après la chute initiale du lever constitue un facteur pronostique défavorable. En revanche, les sources européennes lues pour ce cours ne chiffrent pas la prévalence de l’hypotension orthostatique, et aucune donnée suisse n’a été trouvée (lacune nommée).</p>
<p>Au-delà de ces associations, le pronostic dépend avant tout de la cause : une hypotension médicamenteuse ou hypovolémique se corrige, alors qu’une hypotension orthostatique neurogène traduit une maladie du système nerveux autonome, le plus souvent chronique et évolutive.</p>
</section>
<section class="ilot" id="i95-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre ces causes, il faut d’abord décrire la réponse normale au lever. En position debout, en effet, la gravité déplace le sang vers les veines situées sous le diaphragme : le retour veineux et le débit cardiaque diminuent. Chez le sujet sain, cependant, le <button class="w" data-k="i95-baroreflexe">baroréflexe (boucle de régulation)</button> corrige aussitôt cette baisse, principalement par une <b>augmentation du tonus vasculaire</b> ; l’accélération du cœur n’y contribue que de façon secondaire (ESC 2018, instructions pratiques).</p>
<p>Dans la <button class="w" data-k="i95-defaut">défaillance autonome (formes primaires et secondaires)</button> primaire ou secondaire, à l’inverse, les fibres sympathiques cardiovasculaires ne parviennent pas à augmenter la résistance vasculaire périphérique totale. Dès lors, la gravité, associée à l’échec de la vasoconstriction et des réponses chronotrope et inotrope, entraîne une <button class="w" data-k="i95-stase">séquestration veineuse (mécanisme)</button>, une baisse du retour veineux et une pression artérielle basse. Le cerveau, dont la perfusion dépend de la pression, souffre donc : vertige, voile visuel, puis syncope.</p>
<p>Ce mécanisme explique la forme classique ; toutefois, la forme <b>initiale</b> relève d’un autre mécanisme : un décalage transitoire, pendant les premières secondes, entre le débit cardiaque et la résistance périphérique totale. Quant à la forme <b>retardée</b> du sujet âgé, elle est attribuée à un cœur plus rigide, sensible à la baisse de précharge, et à des réflexes vasoconstricteurs compensatoires altérés ; elle peut aussi représenter une forme débutante de l’hypotension classique, surtout en cas de parkinsonisme ou de diabète.</p>
<div class="key"><b>Corrélation physiopathologie → diagnostic.</b> Dans l’<button class="w" data-k="i95-neuro">hypotension neurogène (réponse cardiaque émoussée)</button>, l’accélération du cœur au lever est émoussée, habituellement inférieure à 10 battements par minute, car le contrôle autonome de la fréquence est atteint. Dans l’hypotension par <b>hypovolémie</b>, l’accélération est conservée, voire accrue (ESC 2018). Compter le pouls au lever oriente donc la cause.</div>
<p>Enfin, les symptômes dépendent davantage du <b>niveau absolu</b> de la pression atteinte que de l’ampleur de la chute ; l’autorégulation cérébrale y joue probablement un rôle clé, et la sévérité varie beaucoup d’un patient à l’autre (ESC 2018).</p>
</section>
<section class="ilot" id="i95-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Ces mécanismes conduisent naturellement aux causes, que le tableau regroupe selon l’<button class="w" data-k="i95-classes">ESC 2018 (classes de recommandation et niveaux de preuve)</button>. Il se lit ainsi comme une liste de contrôle : la cause médicamenteuse, la plus fréquente à corriger, se cherche toujours en premier.</p>
<table class="t"><tr><th>Groupe</th><th>Causes</th></tr>
<tr><td><b>Médicaments</b></td><td>Tout médicament vasoactif et les diurétiques ; alphabloquants, notamment pour la forme initiale</td></tr>
<tr><td><b>Hypovolémie</b></td><td>Hémorragie, diarrhée, vomissements</td></tr>
<tr><td><b>Défaillance autonome primaire</b></td><td>Dysautonomie pure, atrophie multisystématisée, maladie de Parkinson, démence à corps de Lewy</td></tr>
<tr><td><b>Défaillance autonome secondaire</b></td><td>Diabète, amylose, lésions de la moelle épinière, neuropathie autonome auto-immune ou paranéoplasique, insuffisance rénale</td></tr>
<tr><td><b>Circonstances aggravantes</b></td><td>Fragilité ; le matin, à la chaleur, après les repas ou un effort ; hypotension postprandiale, surtout chez le sujet âgé et en cas de défaillance autonome</td></tr></table>
<p>Sur le plan du vocabulaire, par ailleurs, l’ESC 2018 réserve le terme de <b>défaillance autonome</b> aux affections qui diminuent la fonction du système nerveux autonome et causent surtout une hypotension orthostatique neurogène ; en revanche, le mot « dysautonomie », trop imprécis, est déconseillé.</p>
<div class="trap"><span class="k">Piège</span>Chez le sujet âgé, les causes se cumulent : un diurétique, un alphabloquant prostatique et une neuropathie diabétique peuvent chacun être insuffisants pour causer une chute, mais leur somme y suffit. Retirer un seul facteur ne règle pas toujours le problème ; il faut les revoir tous.</div>
</section>
