<template data-pop="i95-r03" data-title="Constatation tensionnelle sans diagnostic (R03)"><p>R03.0 désigne une élévation de la tension sans diagnostic d’hypertension, comme un épisode hypertensif ou une découverte isolée ; la démarche mène alors vers I10. R03.1 désigne une baisse non spécifique de la tension, c’est-à-dire une pression basse constatée sans diagnostic d’hypotension.</p><p>Le BfArM exclut de I95 le collapsus cardiovasculaire (R57.9), la baisse non spécifique de la pression (R03.1) et le syndrome d’hypotension maternelle (O26.5). Une hypotension chronique symptomatique et documentée se code en revanche I95.8 (CIM-10-GM 2024).</p></template>
<template data-pop="i95-baroreflexe" data-title="Baroréflexe artériel"><p>Boucle de régulation réflexe de la pression artérielle. Les barorécepteurs des artères carotides et de la crosse de l’aorte détectent la pression et informent le centre vasomoteur du bulbe rachidien. En retour, le système nerveux autonome ajuste la fréquence cardiaque et le tonus des vaisseaux. En position debout, l’augmentation du tonus vasculaire est l’élément clé de la réponse ; l’accélération du cœur y contribue peu (ESC 2018, instructions pratiques).</p><figure><img src="images/cardiologie/i95_baroreflexe_openstax.gif" alt="Diagramme publié du réflexe barorécepteur : une hausse ou une baisse de pression modifie la décharge des barorécepteurs, les centres cardiaques et vasomoteurs, puis le débit cardiaque et le tonus vasculaire" width="760" height="566" loading="lazy" decoding="async">
<figcaption>Même image que la figure 2 du cours — Réflexe barorécepteur : une baisse de pression (en bas) réduit la décharge des barorécepteurs, ce qui stimule les centres cardioaccélérateur et vasomoteur ; le débit cardiaque et la vasoconstriction augmentent, et la pression remonte. Légendes en anglais. Figure 2116 d’OpenStax College, Anatomy &amp; Physiology (2013), Wikimedia Commons, licence Creative Commons Attribution 3.0 ; convertie pour l’atlas.</figcaption></figure><p>Ce schéma publié montre la boucle réflexe que le lever met à l’épreuve. Lorsque la pression baisse, les barorécepteurs déchargent moins, et les centres bulbaires augmentent donc la fréquence cardiaque et la vasoconstriction. Si une branche de la boucle est lésée, comme dans la dysautonomie, la pression chute sans compensation : c’est l’hypotension orthostatique neurogène.</p></template>
<template data-pop="i95-stase" data-title="Séquestration veineuse orthostatique"><p>En position debout, la gravité accumule le sang dans les veines situées sous le diaphragme, surtout celles des jambes et de l’abdomen. Le retour veineux vers le cœur diminue, donc le débit cardiaque et la pression baissent. Le baroréflexe corrige normalement cette baisse ; en cas de défaillance autonome, la correction manque et la pression chute (ESC 2018).</p></template>
<template data-pop="i95-contrepression" data-title="Manœuvres de contre-pression"><p>Contractions musculaires isométriques qui élèvent rapidement la pression et retardent la perte de connaissance assez longtemps pour s’asseoir ou se coucher. Les plus utilisées (ESC 2018, instructions pratiques) : <b>croiser les jambes</b> en contractant au maximum les muscles des jambes, de l’abdomen et des fesses ; <b>serrer le poing</b> sur une balle souple de 5 à 6 cm dans la main dominante ; <b>tendre les bras</b>. Elles se pratiquent dès les premiers symptômes, le plus longtemps possible ou jusqu’à leur disparition.</p></template>
<template data-pop="i95-tilt" data-title="Test d’inclinaison"><p>Le patient est allongé sur une table basculante, puis incliné tête en haut, à au moins 60 degrés selon la définition de l’hypotension classique, sous mesure continue de la pression et de la fréquence cardiaque. Le test reproduit la station debout sans contraction musculaire des jambes. Il sert à démontrer une hypotension orthostatique retardée, une syncope vasovagale orthostatique ou une tachycardie posturale (ESC 2018).</p></template>
<template data-pop="i95-valsalva" data-title="Manœuvre de Valsalva"><p>Expiration forcée maximale de 15 secondes contre glotte fermée, sous mesure continue. <b>Phase I</b> : brève hausse de pression. <b>Phase II</b> : la baisse du retour veineux fait chuter la pression ; le baroréflexe accélère le cœur et resserre les vaisseaux. <b>Phases III et IV</b> : à la reprise de la respiration, la pression dépasse transitoirement sa valeur de base pendant que la fréquence se normalise (ESC 2018, instructions pratiques). Le test explore l’intégrité du baroréflexe.</p></template>
<template data-pop="i95-d-midodrine" data-title="Midodrine (Gutron®)"><p><b>Mécanisme.</b> Promédicament transformé en desglymidodrine, agoniste alpha-adrénergique périphérique direct, sans effet bêta : vasoconstriction artérielle et veineuse, en position couchée comme debout.</p><p><b>Statut suisse.</b> La midodrine est autorisée en Suisse dans l’hypotension orthostatique, y compris dans les formes sévères neurogènes.</p><p><b>Dose.</b> Dans les formes sévères, le traitement commence à 2,5 mg trois fois par jour, avec une première prise 30 à 45 minutes avant le lever, afin que l’effet couvre le moment du lever. Le médecin augmente la dose chaque semaine selon la systolique mesurée à 3 minutes debout, jusqu’à 30 mg par jour au maximum en 3 prises.</p><p><b>Sécurité.</b> La dernière prise a lieu au moins 4 heures avant le coucher, parce que la vasoconstriction persistante provoquerait une hypertension couchée. Au début, le soignant mesure la pression couchée et assise au moins deux fois par semaine. La midodrine est contre-indiquée notamment en cas d’hypertension, de cardiopathie organique sévère, de rétention urinaire ou d’hypertrophie prostatique avec résidu, et de grossesse ; en effet, l’agonisme alpha-1 contracte aussi le col vésical.</p></template>
<template data-pop="i95-d-fludro" data-title="Fludrocortisone (Florinef®)"><p><b>Mécanisme.</b> La fludrocortisone est un minéralocorticoïde qui retient fortement le sodium ; elle augmente donc le volume plasmatique et le retour veineux.</p><p><b>Statut suisse.</b> Elle est autorisée seulement pour la substitution de l’insuffisance corticosurrénale et le syndrome de perte de sel ; son usage dans l’hypotension orthostatique est donc hors étiquette (ESC 2018 : classe IIa, niveau C).</p><p><b>Sécurité.</b> La rétention sodée provoque des œdèmes et une hypertension, et la fuite urinaire de potassium une hypokaliémie ; le médecin contrôle donc régulièrement les électrolytes. Elle est contre-indiquée en cas d’hypertension sévère. De plus, l’association à la midodrine favorise l’hypertension de décubitus.</p></template>
<template data-pop="i95-ho" data-title="Hypotension orthostatique"><p><b>Définition (ESC 2018).</b> L’hypotension orthostatique est une baisse anormale de la pression artérielle provoquée par le passage en position debout. Elle fait partie des causes circulatoires d’intolérance orthostatique.</p><p><b>Trois profils selon le délai.</b> La forme <b>initiale</b> survient dans les 15 secondes, la forme <b>classique</b> dans les 3 minutes et la forme <b>retardée</b> au-delà de 3 minutes. Ce délai compte, car il révèle des mécanismes et des méthodes de mesure différents.</p><p><b>Conséquences.</b> Vertige, voile visuel, chutes et syncope ; la forme classique est associée à une mortalité accrue.</p></template>
<template data-pop="i95-init" data-title="Hypotension orthostatique initiale"><p><b>Critère (ESC 2018).</b> La systolique baisse de plus de 40 mmHg et/ou la diastolique de plus de 20 mmHg dans les <b>15 secondes</b> qui suivent le lever.</p><p><b>Évolution.</b> Retour spontané et rapide à la normale : hypotension et symptômes durent moins de 40 secondes, mais peuvent causer une syncope.</p><p><b>Mesure.</b> Pression continue battement par battement pendant l’épreuve de station debout active ; une mesure intermittente la manque.</p><p><b>Terrain.</b> Elle touche le sujet jeune et longiligne, le sujet âgé et le patient sous alphabloquant. Chez le sujet âgé, une récupération lente après la chute initiale est un facteur pronostique défavorable.</p></template>
<template data-pop="i95-ret" data-title="Hypotension orthostatique retardée"><p><b>Critère (ESC 2018).</b> L’hypotension orthostatique survient <b>au-delà de 3 minutes</b> de station debout active ou d’inclinaison ; c’est pourquoi une épreuve courte la méconnaît.</p><p><b>Profil.</b> Baisse lente et progressive de la pression ; l’absence de bradycardie la distingue de la syncope réflexe, que la baisse du volume sanguin central peut toutefois déclencher.</p><p><b>Terrain.</b> Fréquente chez le sujet âgé (cœur rigide sensible à la baisse de précharge, réflexes vasoconstricteurs altérés) ; peut aussi être une forme débutante de la forme classique, notamment en cas de parkinsonisme ou de diabète.</p></template>
<template data-pop="i95-pots" data-title="Tachycardie orthostatique posturale"><p><b>Critères (ESC 2018).</b> Intolérance orthostatique avec augmentation de la fréquence cardiaque de <b>plus de 30 battements par minute</b>, ou au-delà de <b>120 battements par minute</b>, dans les <b>10 minutes</b> de station debout ou d’inclinaison, <b>sans hypotension orthostatique</b>. Chez les 12 à 19 ans, l’augmentation doit dépasser 40 battements par minute.</p><p><b>Plaintes.</b> Sensation de tête vide, palpitations, tremblement, faiblesse, vision floue, fatigue ; la syncope est rare.</p><p><b>Associations.</b> Le syndrome touche surtout les femmes jeunes ; il s’associe au déconditionnement, à une infection récente, au syndrome de fatigue chronique et à l’hypermobilité articulaire.</p><figure><img src="images/cardiologie/i95_tilt_tachycardie_posturale.gif" alt="Enregistrement réel d’un test d’inclinaison : pression artérielle systolique et diastolique et fréquence cardiaque en fonction du temps, inclinaison entre la dixième et la vingtième minute" width="604" height="507" loading="lazy" decoding="async">
<figcaption>Même image que la figure 1 du cours — Test d’inclinaison réel positif pour une tachycardie posturale : pendant les 10 minutes d’inclinaison (entre les pointillés), la fréquence cardiaque (triangles) s’accélère nettement alors que les pressions systolique (bleu) et diastolique (rouge) ne chutent pas ; c’est l’inverse d’une hypotension orthostatique. Figure de Said S. A. M., « Postural Tachycardia Syndrome », article en libre accès (doi:10.25141/2472-102X-2017-1.0004), Wikimedia Commons, licence Creative Commons Attribution 4.0 ; convertie pour l’atlas.</figcaption></figure><p>Ce tracé réel montre le critère du syndrome : la fréquence cardiaque accélère nettement pendant l’inclinaison, alors que la pression reste stable. Ainsi, la tachycardie compense un retour veineux insuffisant sans que la pression ne chute, ce qui distingue ce syndrome de l’hypotension orthostatique.</p></template>
<template data-pop="i95-defaut" data-title="Défaillance autonome"><p><b>Définition (ESC 2018).</b> Affection qui diminue la fonction du système nerveux autonome et cause surtout une hypotension orthostatique neurogène ; le terme « dysautonomie », imprécis, est déconseillé.</p><p><b>Primaire.</b> Les formes primaires sont la dysautonomie pure, l’atrophie multisystématisée, la maladie de Parkinson et la démence à corps de Lewy ; toutes dégénèrent les voies autonomes.</p><p><b>Secondaire.</b> Les formes secondaires accompagnent le diabète, l’amylose, les lésions de la moelle épinière, la neuropathie autonome auto-immune ou paranéoplasique et l’insuffisance rénale, qui lèsent les fibres autonomes périphériques.</p></template>
<template data-pop="i95-neuro" data-title="Hypotension orthostatique neurogène"><p><b>Mécanisme.</b> Les fibres sympathiques ne parviennent pas à augmenter la résistance vasculaire au lever.</p><p><b>Signe clé (ESC 2018).</b> Accélération du cœur au lever émoussée, <b>habituellement inférieure à 10 battements par minute</b>, car le contrôle autonome de la fréquence est atteint. La règle n’est pas absolue : chez certains patients, la fréquence peut encore s’accélérer.</p><p><b>Opposé.</b> Dans l’hypovolémie, l’accélération est conservée, voire accrue.</p><p><b>Associations.</b> Elle s’accompagne souvent d’une hypertension de décubitus et d’une absence de baisse nocturne de la pression à la mesure de 24 heures, car la régulation autonome manque dans les deux sens.</p></template>
<template data-pop="i95-classes" data-title="Classes de recommandation et niveaux de preuve de l’ESC"><p><b>Classes.</b> La classe <b>I</b> signifie que la mesure est recommandée ou indiquée. La classe <b>IIa</b> signifie qu’elle doit être envisagée, et la classe <b>IIb</b> qu’elle peut l’être, avec des preuves moins bien établies. La classe <b>III</b> signifie qu’elle n’est ni utile ni efficace, et parfois nocive.</p><p><b>Niveaux de preuve.</b> Le niveau <b>A</b> repose sur plusieurs essais randomisés ou des méta-analyses. Le niveau <b>B</b> repose sur un essai randomisé ou de grandes études non randomisées. Le niveau <b>C</b> repose sur un consensus d’experts ou sur de petites études, des registres ou des études rétrospectives.</p><p>La classe exprime la force de la recommandation ; le niveau exprime la qualité des données qui la fondent.</p></template>
<template data-pop="i95-cintre" data-title="Douleur « en cintre »"><p>Douleur de la nuque et des épaules, en forme de cintre de vêtement, qui apparaît en position debout et cède en position couchée. Selon l’ESC 2018, elle évoque, comme la lombalgie ou la douleur précordiale orthostatiques, une hypotension orthostatique classique, le plus souvent due à une défaillance autonome.</p></template>
<template data-pop="i95-asta" data-title="Épreuve de station debout active"><p><b>Protocole.</b> Le soignant mesure la pression et la fréquence cardiaque au repos en décubitus ; ensuite, le patient se lève activement, et les mesures sont répétées pendant <b>au moins 3 minutes</b>.</p><p><b>Lecture (ESC 2018).</b> Une baisse soutenue de la systolique d’au moins 20 mmHg, ou de la diastolique d’au moins 10 mmHg, ou une systolique inférieure à 90 mmHg définit l’hypotension orthostatique classique. En cas d’hypertension de décubitus, le seuil est porté à 30 mmHg, car une chute relative plus grande est attendue à partir d’une pression couchée élevée.</p><p><b>Variantes.</b> Mesure continue battement par battement pour la forme initiale ; prolongation au-delà de 3 minutes ou test d’inclinaison pour la forme retardée.</p></template>
<template data-pop="i95-svvo" data-title="Syncope vasovagale orthostatique"><p><b>Circonstance.</b> Station debout prolongée.</p><p><b>Mécanisme (ESC 2018).</b> La séquestration progressive du sang déclenche un réflexe vasovagal, dont la voie finale est vasodépressive et/ou cardio-inhibitrice.</p><p><b>Prodromes.</b> Activation autonome : nausées, pâleur, sueurs, qui précèdent la syncope.</p><p><b>Terrain.</b> Plus fréquente chez la femme ; peut s’associer à une intolérance orthostatique chronique.</p></template>
<template data-pop="i95-htd" data-title="Hypertension de décubitus"><p><b>Définition.</b> La pression est élevée en position couchée chez un patient dont la pression chute debout ; ce profil est typique de la défaillance autonome.</p><p><b>Conséquence sur le diagnostic (ESC 2018).</b> Une baisse orthostatique d’au moins 30 mmHg de la systolique est alors retenue au lieu de 20 mmHg.</p><p><b>Dépistage.</b> Mesure couchée et mesure ambulatoire sur 24 heures, qui montre souvent une absence de baisse nocturne ou une hausse nocturne.</p><p><b>Traitements en cause.</b> La midodrine la favorise, surtout à forte dose ou associée à la fludrocortisone ; c’est pourquoi la dernière prise de midodrine a lieu au moins 4 heures avant le coucher.</p></template>
<template data-pop="i95-dbt" data-title="Test de respiration profonde"><p><b>Protocole (ESC 2018).</b> Six respirations profondes par minute pendant une minute, sous mesure continue de la fréquence et de la pression.</p><p><b>Physiologie.</b> La fréquence monte à l’inspiration et baisse à l’expiration : arythmie sinusale respiratoire, modulée par le nerf vague.</p><p><b>Lecture.</b> Chez le sujet sain de plus de 50 ans, l’index expiration-inspiration atteint au moins 15 battements par minute. Il est émoussé ou aboli dans la défaillance autonome, parce que les fibres parasympathiques cardiaques dégénèrent.</p></template>
<template data-pop="i95-mapa" data-title="Profils nocturnes de la mesure ambulatoire"><p><b>Baisse nocturne normale</b> (« dipping ») : la pression baisse de plus de 10 % la nuit par rapport au jour.</p><p><b>Absence de baisse</b> (« non-dipping ») : la pression nocturne baisse de moins de 10 %.</p><p><b>Hausse nocturne</b> (« reverse dipping ») : la pression augmente la nuit.</p><p>Dans la défaillance autonome, l’hypotension orthostatique s’associe souvent à une absence de baisse ou à une hausse nocturne, avec aggravation de l’hypotension le matin et après les repas (ESC 2018, instructions pratiques).</p></template>
<template data-pop="pareto-i95-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i95-0,i95-1,i95-2,i95-3,i95-4,i95-5,i95-6"></p><ul>
<li>La forme classique se définit par une baisse d’au moins 20/10 mmHg ou une systolique sous 90 mmHg dans les 3 minutes ; le seuil passe à 30 mmHg en cas d’hypertension de décubitus.</li>
<li>La forme initiale dépasse 40/20 mmHg dans les 15 secondes et dure moins de 40 secondes ; la forme retardée survient après 3 minutes.</li>
<li>L’hypotension orthostatique s’associe à une mortalité accrue, et les symptômes dépendent du niveau absolu de la pression.</li>
<li>Dans la forme neurogène, le pouls accélère généralement de moins de 10 par minute ; dans l’hypovolémie, cette accélération est conservée.</li>
<li>Les causes sont les médicaments, l’hypovolémie et la défaillance autonome, primaire (Parkinson, atrophie multisystématisée) ou secondaire (diabète, amylose).</li></ul></template>
<template data-pop="pareto-i95-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i95-7,i95-8,i95-9"></p><ul>
<li>Trois questions : hypotension orthostatique ? neurogène ? quelle cause ?</li>
<li>Le médecin ne doit pas méconnaître une syncope cardiaque ; c’est pourquoi toute syncope impose un électrocardiogramme.</li>
<li>En cas d’hypovolémie, le remplissage intraveineux ou oral est recommandé (classe I).</li>
<li>Éducation, sel et eau (classe I) ; retrait des hypotenseurs, contre-pression, compression, tête surélevée, midodrine (classe IIa).</li></ul></template>
<template data-pop="pareto-i95-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i95-10,i95-11"></p><ul>
<li>Le médecin mesure la pression couchée et debout à chaque consultation.</li>
<li>Dans la défaillance autonome, la mesure de 24 heures ne montre pas de baisse nocturne, et l’hypotension s’aggrave le matin et après les repas.</li>
<li>La midodrine est contre-indiquée pendant la grossesse et l’allaitement, et elle n’est pas utilisée avant 12 ans.</li></ul></template>
<template data-pop="pareto-i95-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i95-e-1,i95-e-2,i95-e-3"></p><ul>
<li>Station debout active 3 minutes en première ligne ; mesure continue pour la forme initiale.</li>
<li>Le test d’inclinaison sert à révéler la forme retardée, la syncope vasovagale orthostatique et la tachycardie posturale.</li>
<li>Les tests autonomes comprennent la manœuvre de Valsalva, la respiration profonde et la mesure de 24 heures.</li></ul></template>
<template data-pop="pareto-i95-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i95-p-1,i95-p-2"></p><ul>
<li>La midodrine commence à 2,5 mg trois fois par jour, sans dépasser 30 mg par jour, et la dernière prise a lieu au moins 4 heures avant le coucher.</li>
<li>Ses contre-indications clés sont l’hypertension, la rétention urinaire, la cardiopathie sévère et la grossesse.</li>
<li>La fludrocortisone est hors étiquette en Suisse, et sa prescription impose de surveiller la kaliémie.</li></ul></template>
