<template data-pop="i95-baroreflexe" data-title="Baroréflexe artériel"><p>Boucle de régulation réflexe de la pression artérielle. Les barorécepteurs des artères carotides et de la crosse de l’aorte détectent la pression et informent le centre vasomoteur du bulbe rachidien. En retour, le système nerveux autonome ajuste la fréquence cardiaque et le tonus des vaisseaux. En position debout, l’augmentation du tonus vasculaire est l’élément clé de la réponse ; l’accélération du cœur y contribue peu (ESC 2018, instructions pratiques).</p></template>
<template data-pop="i95-stase" data-title="Séquestration veineuse orthostatique"><p>En position debout, la gravité accumule le sang dans les veines situées sous le diaphragme, surtout celles des jambes et de l’abdomen. Le retour veineux vers le cœur diminue, donc le débit cardiaque et la pression baissent. Le baroréflexe corrige normalement cette baisse ; en cas de défaillance autonome, la correction manque et la pression chute (ESC 2018).</p></template>
<template data-pop="i95-contrepression" data-title="Manœuvres de contre-pression"><p>Contractions musculaires isométriques qui élèvent rapidement la pression et retardent la perte de connaissance assez longtemps pour s’asseoir ou se coucher. Les plus utilisées (ESC 2018, instructions pratiques) : <b>croiser les jambes</b> en contractant au maximum les muscles des jambes, de l’abdomen et des fesses ; <b>serrer le poing</b> sur une balle souple de 5 à 6 cm dans la main dominante ; <b>tendre les bras</b>. Elles se pratiquent dès les premiers symptômes, le plus longtemps possible ou jusqu’à leur disparition.</p></template>
<template data-pop="i95-tilt" data-title="Test d’inclinaison"><p>Le patient est allongé sur une table basculante, puis incliné tête en haut, à au moins 60 degrés selon la définition de l’hypotension classique, sous mesure continue de la pression et de la fréquence cardiaque. Le test reproduit la station debout sans contraction musculaire des jambes. Il sert à démontrer une hypotension orthostatique retardée, une syncope vasovagale orthostatique ou une tachycardie posturale (ESC 2018).</p></template>
<template data-pop="i95-valsalva" data-title="Manœuvre de Valsalva"><p>Expiration forcée maximale de 15 secondes contre glotte fermée, sous mesure continue. <b>Phase I</b> : brève hausse de pression. <b>Phase II</b> : la baisse du retour veineux fait chuter la pression ; le baroréflexe accélère le cœur et resserre les vaisseaux. <b>Phases III et IV</b> : à la reprise de la respiration, la pression dépasse transitoirement sa valeur de base pendant que la fréquence se normalise (ESC 2018, instructions pratiques). Le test explore l’intégrité du baroréflexe.</p></template>
<template data-pop="i95-d-midodrine" data-title="Midodrine (Gutron®)"><p><b>Mécanisme.</b> Promédicament transformé en desglymidodrine, agoniste alpha-adrénergique périphérique direct, sans effet bêta : vasoconstriction artérielle et veineuse, en position couchée comme debout.</p><p><b>Statut suisse.</b> Autorisée dans l’hypotension orthostatique, y compris les formes sévères neurogènes.</p><p><b>Dose.</b> Formes sévères : 2,5 mg trois fois par jour au départ, première prise 30 à 45 minutes avant le lever, augmentation hebdomadaire selon la systolique à 3 minutes debout, maximum 30 mg par jour en 3 prises.</p><p><b>Sécurité.</b> Dernière prise au moins 4 heures avant le coucher ; pression couchée et assise au moins deux fois par semaine au début. Contre-indiquée notamment en cas d’hypertension, de cardiopathie organique sévère, de rétention urinaire ou d’hypertrophie prostatique avec résidu, de grossesse.</p></template>
<template data-pop="i95-d-fludro" data-title="Fludrocortisone (Florinef®)"><p><b>Mécanisme.</b> Minéralocorticoïde à forte rétention sodée.</p><p><b>Statut suisse.</b> Autorisée seulement pour la substitution de l’insuffisance corticosurrénale et le syndrome de perte de sel ; hors étiquette dans l’hypotension orthostatique (ESC 2018 : classe IIa, niveau C).</p><p><b>Sécurité.</b> Œdèmes, hypertension, hypokaliémie : contrôle régulier des électrolytes. Contre-indiquée en cas d’hypertension sévère. L’association à la midodrine favorise l’hypertension de décubitus.</p></template>
<template data-pop="i95-ho" data-title="Hypotension orthostatique"><p><b>Définition (ESC 2018).</b> Baisse anormale de la pression artérielle provoquée par le passage en position debout. Elle fait partie des causes circulatoires d’intolérance orthostatique.</p><p><b>Trois profils selon le délai.</b> <b>Initiale</b> : dans les 15 secondes. <b>Classique</b> : dans les 3 minutes. <b>Retardée</b> : au-delà de 3 minutes.</p><p><b>Conséquences.</b> Vertige, voile visuel, chutes et syncope ; la forme classique est associée à une mortalité accrue.</p></template>
<template data-pop="i95-init" data-title="Hypotension orthostatique initiale"><p><b>Critère (ESC 2018).</b> Baisse de plus de 40 mmHg de la systolique et/ou de plus de 20 mmHg de la diastolique dans les <b>15 secondes</b> suivant le lever.</p><p><b>Évolution.</b> Retour spontané et rapide à la normale : hypotension et symptômes durent moins de 40 secondes, mais peuvent causer une syncope.</p><p><b>Mesure.</b> Pression continue battement par battement pendant l’épreuve de station debout active ; une mesure intermittente la manque.</p><p><b>Terrain.</b> Sujet jeune et longiligne, sujet âgé, alphabloquants. Chez le sujet âgé, une récupération lente après la chute initiale est un facteur pronostique défavorable.</p></template>
<template data-pop="i95-ret" data-title="Hypotension orthostatique retardée"><p><b>Critère (ESC 2018).</b> Hypotension orthostatique survenant <b>au-delà de 3 minutes</b> de station debout active ou d’inclinaison.</p><p><b>Profil.</b> Baisse lente et progressive de la pression ; l’absence de bradycardie la distingue de la syncope réflexe, que la baisse du volume sanguin central peut toutefois déclencher.</p><p><b>Terrain.</b> Fréquente chez le sujet âgé (cœur rigide sensible à la baisse de précharge, réflexes vasoconstricteurs altérés) ; peut aussi être une forme débutante de la forme classique, notamment en cas de parkinsonisme ou de diabète.</p></template>
<template data-pop="i95-pots" data-title="Tachycardie orthostatique posturale"><p><b>Critères (ESC 2018).</b> Intolérance orthostatique avec augmentation de la fréquence cardiaque de <b>plus de 30 battements par minute</b>, ou au-delà de <b>120 battements par minute</b>, dans les <b>10 minutes</b> de station debout ou d’inclinaison, <b>sans hypotension orthostatique</b>. Chez les 12 à 19 ans, l’augmentation doit dépasser 40 battements par minute.</p><p><b>Plaintes.</b> Sensation de tête vide, palpitations, tremblement, faiblesse, vision floue, fatigue ; la syncope est rare.</p><p><b>Associations.</b> Femmes jeunes ; déconditionnement, infection récente, syndrome de fatigue chronique, hypermobilité articulaire.</p></template>
<template data-pop="i95-defaut" data-title="Défaillance autonome"><p><b>Définition (ESC 2018).</b> Affection qui diminue la fonction du système nerveux autonome et cause surtout une hypotension orthostatique neurogène ; le terme « dysautonomie », imprécis, est déconseillé.</p><p><b>Primaire.</b> Dysautonomie pure, atrophie multisystématisée, maladie de Parkinson, démence à corps de Lewy.</p><p><b>Secondaire.</b> Diabète, amylose, lésions de la moelle épinière, neuropathie autonome auto-immune ou paranéoplasique, insuffisance rénale.</p></template>
<template data-pop="i95-neuro" data-title="Hypotension orthostatique neurogène"><p><b>Mécanisme.</b> Les fibres sympathiques ne parviennent pas à augmenter la résistance vasculaire au lever.</p><p><b>Signe clé (ESC 2018).</b> Accélération du cœur au lever émoussée, <b>habituellement inférieure à 10 battements par minute</b>, car le contrôle autonome de la fréquence est atteint. La règle n’est pas absolue : chez certains patients, la fréquence peut encore s’accélérer.</p><p><b>Opposé.</b> Dans l’hypovolémie, l’accélération est conservée, voire accrue.</p><p><b>Associations.</b> Hypertension de décubitus ; absence de baisse nocturne de la pression à la mesure de 24 heures.</p></template>
<template data-pop="i95-classes" data-title="Classes de recommandation et niveaux de preuve de l’ESC"><p><b>Classes.</b> <b>I</b> : recommandé ou indiqué. <b>IIa</b> : doit être envisagé. <b>IIb</b> : peut être envisagé, preuves moins bien établies. <b>III</b> : non utile ni efficace, parfois nocif.</p><p><b>Niveaux de preuve.</b> <b>A</b> : plusieurs essais randomisés ou méta-analyses. <b>B</b> : un essai randomisé ou de grandes études non randomisées. <b>C</b> : consensus d’experts ou petites études, registres, études rétrospectives.</p><p>La classe exprime la force de la recommandation ; le niveau exprime la qualité des données qui la fondent.</p></template>
<template data-pop="i95-cintre" data-title="Douleur « en cintre »"><p>Douleur de la nuque et des épaules, en forme de cintre de vêtement, qui apparaît en position debout et cède en position couchée. Selon l’ESC 2018, elle évoque, comme la lombalgie ou la douleur précordiale orthostatiques, une hypotension orthostatique classique, le plus souvent due à une défaillance autonome.</p></template>
<template data-pop="i95-asta" data-title="Épreuve de station debout active"><p><b>Protocole.</b> Mesure de la pression et de la fréquence cardiaque au repos en décubitus, puis lever actif du patient et mesures répétées pendant <b>au moins 3 minutes</b>.</p><p><b>Lecture (ESC 2018).</b> Baisse soutenue de la systolique d’au moins 20 mmHg, ou de la diastolique d’au moins 10 mmHg, ou systolique inférieure à 90 mmHg : hypotension orthostatique classique. En cas d’hypertension de décubitus, une baisse d’au moins 30 mmHg est retenue.</p><p><b>Variantes.</b> Mesure continue battement par battement pour la forme initiale ; prolongation au-delà de 3 minutes ou test d’inclinaison pour la forme retardée.</p></template>
<template data-pop="i95-svvo" data-title="Syncope vasovagale orthostatique"><p><b>Circonstance.</b> Station debout prolongée.</p><p><b>Mécanisme (ESC 2018).</b> Réflexe vasovagal déclenché par la séquestration progressive du sang, avec voie finale vasodépressive et/ou cardio-inhibitrice.</p><p><b>Prodromes.</b> Activation autonome : nausées, pâleur, sueurs, qui précèdent la syncope.</p><p><b>Terrain.</b> Plus fréquente chez la femme ; peut s’associer à une intolérance orthostatique chronique.</p></template>
<template data-pop="i95-htd" data-title="Hypertension de décubitus"><p><b>Définition.</b> Pression élevée en position couchée chez un patient dont la pression chute debout, typique de la défaillance autonome.</p><p><b>Conséquence sur le diagnostic (ESC 2018).</b> Une baisse orthostatique d’au moins 30 mmHg de la systolique est alors retenue au lieu de 20 mmHg.</p><p><b>Dépistage.</b> Mesure couchée et mesure ambulatoire sur 24 heures, qui montre souvent une absence de baisse nocturne ou une hausse nocturne.</p><p><b>Traitements en cause.</b> Midodrine, surtout à forte dose ou associée à la fludrocortisone : dernière prise de midodrine au moins 4 heures avant le coucher.</p></template>
<template data-pop="i95-dbt" data-title="Test de respiration profonde"><p><b>Protocole (ESC 2018).</b> Six respirations profondes par minute pendant une minute, sous mesure continue de la fréquence et de la pression.</p><p><b>Physiologie.</b> La fréquence monte à l’inspiration et baisse à l’expiration : arythmie sinusale respiratoire, modulée par le nerf vague.</p><p><b>Lecture.</b> Index expiration-inspiration d’au moins 15 battements par minute chez le sujet sain de plus de 50 ans ; émoussé ou aboli dans la défaillance autonome, par dégénérescence des fibres parasympathiques cardiaques.</p></template>
<template data-pop="i95-mapa" data-title="Profils nocturnes de la mesure ambulatoire"><p><b>Baisse nocturne normale</b> (« dipping ») : la pression baisse de plus de 10 % la nuit par rapport au jour.</p><p><b>Absence de baisse</b> (« non-dipping ») : baisse de moins de 10 %.</p><p><b>Hausse nocturne</b> (« reverse dipping ») : la pression augmente la nuit.</p><p>Dans la défaillance autonome, l’hypotension orthostatique s’associe souvent à une absence de baisse ou à une hausse nocturne, avec aggravation de l’hypotension le matin et après les repas (ESC 2018, instructions pratiques).</p></template>
<template data-pop="pareto-i95-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="i95-0,i95-1,i95-2,i95-3,i95-4,i95-5,i95-6"></p><ul>
<li>Classique : baisse d’au moins 20/10 mmHg ou systolique sous 90 mmHg dans les 3 minutes ; 30 mmHg si hypertension de décubitus.</li>
<li>Initiale : plus de 40/20 mmHg dans les 15 secondes, moins de 40 secondes ; retardée : après 3 minutes.</li>
<li>Associée à une mortalité accrue ; symptômes liés au niveau absolu de la pression.</li>
<li>Neurogène : accélération généralement inférieure à 10 par minute ; hypovolémie : accélération conservée.</li>
<li>Causes : médicaments, hypovolémie, défaillance autonome primaire (Parkinson, atrophie multisystématisée) ou secondaire (diabète, amylose).</li></ul></template>
<template data-pop="pareto-i95-pec" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="i95-7,i95-8,i95-9"></p><ul>
<li>Trois questions : hypotension orthostatique ? neurogène ? quelle cause ?</li>
<li>Ne pas méconnaître une syncope cardiaque ; électrocardiogramme pour toute syncope.</li>
<li>Hypovolémie : remplissage intraveineux ou oral (classe I).</li>
<li>Éducation, sel et eau (classe I) ; retrait des hypotenseurs, contre-pression, compression, tête surélevée, midodrine (classe IIa).</li></ul></template>
<template data-pop="pareto-i95-suivi" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="i95-10,i95-11"></p><ul>
<li>Pression couchée et debout à chaque consultation.</li>
<li>Défaillance autonome : absence de baisse nocturne à la mesure de 24 heures ; hypotension matinale et postprandiale.</li>
<li>Midodrine contre-indiquée pendant la grossesse et l’allaitement, non utilisée avant 12 ans.</li></ul></template>
<template data-pop="pareto-i95-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i95-e-1,i95-e-2,i95-e-3"></p><ul>
<li>Station debout active 3 minutes en première ligne ; mesure continue pour la forme initiale.</li>
<li>Test d’inclinaison : forme retardée, syncope vasovagale orthostatique, tachycardie posturale.</li>
<li>Tests autonomes : Valsalva, respiration profonde, mesure de 24 heures.</li></ul></template>
<template data-pop="pareto-i95-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i95-p-1,i95-p-2"></p><ul>
<li>Midodrine : 2,5 mg trois fois par jour au départ, maximum 30 mg par jour ; dernière prise au moins 4 heures avant le coucher.</li>
<li>Contre-indications clés : hypertension, rétention urinaire, cardiopathie sévère, grossesse.</li>
<li>Fludrocortisone hors étiquette en Suisse ; kaliémie à surveiller.</li></ul></template>
