<h1>Varices œsophagiennes et varices d’autres localisations</h1>

<section class="ilot" id="i85-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>À 23 heures, un employé de commerce de 58 ans, qui boit environ six verres standard par jour depuis vingt ans, vomit du sang rouge à trois reprises, puis il fait un malaise en se levant. Aux urgences, sa pression artérielle est de 92/58 mmHg et sa fréquence cardiaque de 118/min ; de plus, l’examen montre des <button class="w" data-k="i85-angiomes">angiomes stellaires</button>, une <button class="w" data-k="i85-splenomegalie">rate palpable</button> et une <button class="w" data-k="i85-ascite">ascite</button> de faible abondance. Or, le bilan donne une hémoglobine de 78 g/L et des plaquettes à 88 G/L. Dès lors, la question qui structure ce cours est la suivante : <b>comment reconnaître une hémorragie par rupture de varices, la traiter heure par heure, puis empêcher qu’elle récidive ?</b></p>
<p>Pour y répondre, ce cours poursuit quatre objectifs. D’abord, comprendre pourquoi une <button class="w" data-k="i85-hvpg">hypertension portale</button> ouvre des varices et pourquoi celles-ci se rompent. Ensuite, conduire la rupture de varices selon la chronologie de Baveno VIII. De plus, choisir la prévention de la récidive, puis traiter à part les varices gastriques. Enfin, reconnaître les varices d’autres localisations de la catégorie I86, qui n’ont, pour la plupart, aucun lien avec le foie. En revanche, la cirrhose elle-même, son dépistage non invasif et son traitement étiologique sont développés dans le cours K74 ; ce cours n’en reprend donc que ce qui sert à décider pour les varices.</p>
</section>
<section class="ilot" id="i85-1"><h2><span class="n">1</span>Définitions, classification et codage</h2>
<p>Il faut d’abord définir l’objet. Une varice est une veine dilatée, allongée et tortueuse, dont la paroi s’est amincie ; or, dans l’œsophage et l’estomac, elle n’est pas une maladie primitive de la paroi veineuse, mais une voie de dérivation. En effet, lorsque le sang portal ne traverse plus le foie sous une pression normale, il reflue vers la veine gastrique gauche, puis vers les veines sous-muqueuses de l’œsophage, qui rejoignent la veine cave supérieure. Comprendre une varice œsophagienne revient donc à comprendre une hypertension portale.</p>
<p>La pression portale se mesure ensuite par le <button class="w" data-k="i85-hvpg">gradient de pression veineuse hépatique (HVPG)</button>, dont les seuils structurent toute la prise en charge. Ainsi, le tableau suivant relie chaque seuil à un événement clinique.</p>
<table class="t"><tr><th>HVPG</th><th>Signification</th><th>Conséquence</th></tr>
<tr><td>1 à 5 mmHg</td><td>Valeur normale</td><td>Pas d’hypertension portale</td></tr>
<tr><td>6 à 9 mmHg</td><td>Hypertension portale infraclinique</td><td>Varices et ascite non attendues</td></tr>
<tr><td><b>≥ 10 mmHg</b></td><td>Hypertension portale cliniquement significative (Baveno VII et VIII)</td><td>Varices possibles ; bêtabloquant non sélectif indiqué</td></tr>
<tr><td>≥ 12 mmHg</td><td>Seuil de rupture</td><td>Les varices saignent rarement au-dessous</td></tr>
<tr><td>≥ 20 mmHg pendant l’hémorragie</td><td>Haut risque d’échec</td><td>Critère de <button class="w" data-k="i85-tips">TIPS préemptif</button> (Baveno VIII, 5.31)</td></tr></table>
<p>Le tableau se lit donc à partir de la ligne des 10 mmHg : au-dessous, on surveille ; au-dessus, on traite pour prévenir la décompensation. Le codage, en revanche, suit une règle propre à la CIM-10-GM, que le praticien suisse doit connaître. En effet, la catégorie I85 ne s’applique pas aux varices de la cirrhose : selon la <button class="w" data-k="i85-codage">règle croix-astérisque de la CIM-10-GM</button>, la maladie du foie porte la croix, par exemple K70.3†, et les varices l’astérisque, I98.2* sans hémorragie ou I98.3* avec hémorragie.</p>
<table class="t"><tr><th>Code</th><th>Entité</th></tr>
<tr><td><b>I85.0 et I85.9</b></td><td>Varices œsophagiennes avec et sans hémorragie, hors maladie du foie classée ailleurs</td></tr>
<tr><td><b>I86.0</b></td><td>Varices sublinguales</td></tr>
<tr><td><b>I86.1</b></td><td>Varices scrotales (varicocèle)</td></tr>
<tr><td><b>I86.2 et I86.3</b></td><td>Varices pelviennes ; varices vulvaires</td></tr>
<tr><td><b>I86.4</b></td><td>Varices gastriques, par exemple sur thrombose de la veine splénique sans maladie du foie</td></tr>
<tr><td><b>I86.8</b></td><td>Varices d’autres localisations précisées</td></tr></table>
<p>Cette classification posée, il reste à comprendre comment naissent les varices, puisque leur traitement agit précisément sur ce mécanisme.</p>
</section>
<section class="ilot" id="i85-2"><h2><span class="n">2</span>Physiopathologie</h2>
<p>La pression portale obéit d’abord à la <button class="w" data-k="i85-ohm">loi d’Ohm appliquée à la circulation portale</button> : elle est le produit du débit par la résistance. Or, dans la cirrhose, les deux termes augmentent. D’une part, la résistance intrahépatique s’élève, car la fibrose déforme l’architecture et les <button class="w" data-k="i85-stellaires">cellules étoilées activées</button> se contractent autour de sinusoïdes devenus capillaires, selon le processus de <button class="w" data-k="i85-capillarisation">capillarisation des sinusoïdes</button>. D’autre part, la vasodilatation splanchnique entretient une <button class="w" data-k="i85-hyperdynamique">circulation hyperdynamique</button>, qui augmente le débit portal.</p>
<p>Le sang emprunte alors des <button class="w" data-k="i85-anastomoses">anastomoses portosystémiques préexistantes</button>, qui s’ouvrent et se remodèlent ; cependant, ces collatérales ne décompriment jamais suffisamment la veine porte. Ainsi, à la <button class="w" data-k="i85-jonction">jonction œsogastrique</button>, les veines de la zone palissadique, longitudinales et superficielles, deviennent le siège habituel des ruptures. La rupture obéit enfin à la <button class="w" data-k="i85-laplace">loi de Laplace</button> : la tension de la paroi augmente avec la pression et avec le rayon, et elle diminue avec l’épaisseur. Par conséquent, une grosse varice à paroi fine, porteuse de <button class="w" data-k="i85-signes-rouges">signes rouges</button>, est la plus menacée.</p>
<figure><img src="images/cardiologie/i85_varices_oesophagiennes_scanner.gif" alt="Scanner abdominal injecté réel, trois coupes axiales et une reconstruction sagittale, montrant des varices œsophagiennes étendues chez une patiente cirrhotique" width="640" height="456" loading="lazy" decoding="async">
<figcaption>Figure 1 — Scanner injecté au temps portal chez une femme de 62 ans atteinte de cirrhose : varices œsophagiennes étendues, qui remontent loin vers le haut ; trois coupes axiales à gauche, reconstruction sagittale à droite (annotations de l’auteur original). Image de Hellerhoff, Wikimedia Commons, licence CC BY-SA 4.0 ; convertie pour l’atlas, dérivé sous la même licence.</figcaption></figure>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> Le bêtabloquant non sélectif réduit le débit splanchnique ; le carvédilol réduit en plus la résistance intrahépatique ; la ligature supprime le rayon de la varice ; le TIPS, enfin, court-circuite la résistance hépatique. Chaque traitement agit donc sur un terme précis de la loi d’Ohm ou de la loi de Laplace.</div>
</section>
<section class="ilot" id="i85-3"><h2><span class="n">3</span>Reconnaître l’hypertension portale avant le saignement</h2>
<p>Puisque le seuil de 10 mmHg précède les varices, il faut reconnaître l’hypertension portale avant toute hémorragie. Le patient concerné est d’abord identifié comme porteur d’une <button class="w" data-k="i85-cacld">maladie hépatique chronique avancée compensée</button>, par l’<button class="w" data-k="i85-elastographie">élastographie impulsionnelle</button> et la <button class="w" data-k="i85-regle5">règle des 5 de l’élasticité</button> ; cette démarche est développée dans le cours K74. Ensuite, selon Baveno VIII, une élasticité hépatique d’au moins 25 kPa, dans une cause virale, alcoolique ou métabolique sans obésité, suffit à affirmer l’hypertension portale cliniquement significative ; à l’inverse, une élasticité de 15 kPa au plus avec des plaquettes d’au moins 150 G/L l’exclut. Entre les deux, le <button class="w" data-k="i85-anticipate">modèle ANTICIPATE</button> affine la probabilité.</p>
<p>Cette stratégie non invasive change la place de l’endoscopie. En effet, le patient dont l’hypertension portale est démontrée reçoit un bêtabloquant non sélectif, si bien que l’endoscopie de dépistage n’est plus nécessaire chez lui ; elle reste en revanche indiquée lorsque le bêtabloquant est impossible, pour décider d’une ligature (Baveno VIII). Enfin, l’examen clinique oriente aussi, car une <button class="w" data-k="i85-cvc">circulation veineuse collatérale abdominale</button> ou un <button class="w" data-k="i85-cruveilhier">souffle de Cruveilhier-Baumgarten</button> témoignent déjà de collatérales portosystémiques.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attendre l’apparition des varices pour traiter. Le seuil hémodynamique de 10 mmHg précède les varices ; c’est pourquoi Baveno VIII traite l’hypertension portale pour prévenir toute décompensation, et non plus seulement les varices.</div>
