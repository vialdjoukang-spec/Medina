<template data-pop="pareto-i85-meca" data-title="Pareto — Notions et dépistage"><p class="ratio" data-cover="i85-0,i85-1,i85-2,i85-3"></p><ul>
<li>Un HVPG ≥ 10 mmHg définit l’hypertension portale significative, et 12 mmHg marque le seuil de rupture.</li>
<li>Les varices de la cirrhose se codent maladie du foie † et I98.2* ou I98.3*, et non I85.</li>
<li>Pression = débit × résistance ; rupture selon Laplace (rayon, paroi fine, signes rouges).</li>
<li>Une élasticité ≥ 25 kPa affirme l’hypertension significative, et une élasticité ≤ 15 kPa avec des plaquettes ≥ 150 G/L l’exclut (Baveno VIII).</li></ul></template>
<template data-pop="pareto-i85-pec" data-title="Pareto — Urgence et prévention"><p class="ratio" data-cover="i85-4,i85-5,i85-6"></p><ul>
<li>La mortalité atteint 15 à 20 % à six semaines.</li>
<li>L’hémoglobine cible est de 70 à 80 g/L ; le vasoactif et la ceftriaxone commencent dès la suspicion, avec du lactulose.</li>
<li>L’érythromycine 250 mg IV précède l’endoscopie, réalisée dans les 12 heures avec ligature.</li>
<li>TIPS préemptif ≤ 72 h : Child C 10–13, B &gt; 7 avec saignement actif, HVPG ≥ 20.</li>
<li>La prévention repose sur un bêtabloquant non sélectif, et la prévention de la récidive sur le bêtabloquant associé à la ligature.</li></ul></template>
<template data-pop="pareto-i85-autres" data-title="Pareto — Varices gastriques et I86"><p class="ratio" data-cover="i85-7,i85-8"></p><ul>
<li>Selon Sarin, GOV1 se traite comme l’œsophage ; GOV2 et IGV1 reçoivent la colle, puis un TIPS.</li>
<li>IGV1 isolées, foie normal : thrombose splénique, code I86.4.</li>
<li>La varicocèle est habituellement gauche ; une varicocèle droite isolée ou brutale impose de chercher une cause abdominale.</li>
<li>Devant des varices pelviennes, le médecin exclut d’abord les autres causes de douleur (ESVS 2022).</li></ul></template>
<template data-pop="pareto-i85-crit" data-title="Pareto — Critères"><p class="ratio" data-cover="i85-9"></p><ul>
<li>Baveno VIII fixe les critères de l’hypertension significative et de la rupture.</li>
<li>L’endoscopie a lieu dans les 12 heures, et le TIPS préemptif dans les 72 heures.</li></ul></template>
<template data-pop="pareto-i85-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i85-e-1,i85-e-2"></p><ul>
<li>L’endoscopie précise la taille, les signes rouges et le type de Sarin.</li>
<li>HVPG = pression bloquée − pression libre ; faux négatif présinusoïdal.</li>
<li>Le Doppler et le scanner recherchent une thrombose et des shunts ; le Child-Pugh et le MELD se calculent à l’admission.</li></ul></template>
<template data-pop="pareto-i85-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i85-p-1,i85-p-2"></p><ul>
<li>Le propranolol est autorisé en Suisse ; le carvédilol est préféré, mais hors indication.</li>
<li>Réduire ou arrêter si systolique &lt; 90 ou moyenne &lt; 65 mmHg.</li>
<li>La terlipressine se donne à 1 à 2 mg IV toutes les 4 à 6 heures (Curapressin®).</li></ul></template>
