<!-- ===== FENÊTRES I85 : lois de Pareto ===== -->
<template data-pop="pareto-i85-def" data-title="Pareto — Définitions, codage et épidémiologie">
<p class="ratio" data-cover="i85-1,i85-2"></p>
<ul><li>Une varice œsophagienne est une collatérale portosystémique alimentée par la veine gastrique gauche.</li>
<li>HVPG normal 1 à 5 mmHg ; ≥ 10 mmHg : hypertension portale cliniquement significative ; ≥ 12 : rupture possible ; ≥ 20 pendant l’hémorragie : TIPS préemptif.</li>
<li>Décompensation : ascite clinique, hémorragie variceuse, encéphalopathie de grade II ou plus.</li>
<li>Haut risque : grandes varices (&gt; 5 mm), signes rouges, classe C de Child-Pugh. Sarin : GOV1 comme l’œsophage ; GOV2 et IGV1 graves.</li>
<li>Chez le cirrhotique, coder la maladie du foie avec une croix et I98.2* ou I98.3*, pas I85.</li>
<li>Mortalité de la rupture à six semaines 15 à 20 % ; récidive 60 % en un an sans prophylaxie.</li></ul></template>

<template data-pop="pareto-i85-physio" data-title="Pareto — Physiopathologie et étiologies">
<p class="ratio" data-cover="i85-3,i85-4"></p>
<ul><li>Gradient = débit × résistance : la cirrhose augmente la résistance (fibrose, capillarisation, cellules étoilées), puis la vasodilatation splanchnique augmente le débit.</li>
<li>La varice se rompt quand la tension pariétale (pression × rayon / épaisseur) dépasse la résistance de la paroi.</li>
<li>Bêtabloquant et vasoactifs baissent le débit, carvédilol et TIPS la résistance, ligature le rayon.</li>
<li>Le HVPG reste normal si l’obstacle est préhépatique ou présinusoïdal ; élasticité &lt; 10 kPa avec varices : maladie vasculaire du foie.</li>
<li>Alcool, infection, hépatite surajoutée et chirurgie précipitent la décompensation.</li></ul></template>

<template data-pop="pareto-i85-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i85-5,i85-6"></p>
<ul><li>Varices silencieuses avant la rupture ; hématémèse et méléna, parfois choc ou encéphalopathie inauguraux.</li>
<li>Rechercher alcool, hépatites, anticoagulants, anti-inflammatoires, pancréatite antérieure.</li>
<li>Index de choc &gt; 1 et trouble de vigilance : soins intensifs et intubation avant l’endoscopie ; le bêtabloquant masque la tachycardie.</li>
<li>Splénomégalie, ascite, circulation collatérale : hypertension portale ; angiomes, érythrose, astérixis : insuffisance hépatocellulaire.</li>
<li>Varicocèle debout et en Valsalva ; varices sublinguales à la face ventrale de la langue.</li></ul></template>

<template data-pop="pareto-i85-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i85-7"></p>
<ul><li>Élastographie à jeun et plaquettes : ≤ 15 kPa et ≥ 150 G/L excluent l’hypertension portale significative ; ≥ 25 kPa la confirment hors obésité.</li>
<li>Hypertension portale significative : bêtabloquant sans endoscopie de dépistage ; endoscopie seulement si le bêtabloquant est impossible.</li>
<li>Rupture : endoscopie dans les 12 heures après réanimation ; vasoactif et antibiotique avant.</li>
<li>Différentiels : ulcère, ulcère de ligature, Mallory-Weiss, gastropathie, ectasies antrales.</li></ul></template>

<template data-pop="pareto-i85-urg" data-title="Pareto — Rupture de varices">
<p class="ratio" data-cover="i85-8"></p>
<ul><li>Hémoglobine cible 70 à 80 g/L ; pas de plasma, d’acide tranexamique ni de facteur VIIa.</li>
<li>Vasoactif dès la suspicion, 2 à 5 jours ; céphalosporine de troisième génération ; lactulose ; anticoagulant suspendu.</li>
<li>Érythromycine 250 mg 30 à 90 minutes avant ; endoscopie et ligature dans les 12 heures ; intubation si vigilance altérée ou hématémèse active.</li>
<li>TIPS préemptif dans les 72 heures (idéalement 24) : Child C 10–13, Child B &gt; 7 avec saignement actif, ou HVPG ≥ 20 mmHg.</li>
<li>Échec : prothèse œsophagienne couverte puis TIPS de sauvetage ; imagerie en coupe chez tous.</li></ul></template>

<template data-pop="pareto-i85-ttt" data-title="Pareto — Prévention primaire et secondaire">
<p class="ratio" data-cover="i85-9,i85-10"></p>
<ul><li>Traiter la cause : abstinence, antiviral, perte de poids.</li>
<li>Hypertension portale significative compensée : carvédilol 6,25 puis 12,5 mg par jour (PREDESCI : 16 % contre 27 % de décompensation ou décès).</li>
<li>Arrêt ou réduction si pression systolique &lt; 90 mmHg, moyenne &lt; 65 mmHg ou insuffisance rénale de type hépatorénal.</li>
<li>Bêtabloquant impossible : endoscopie et ligature des grandes varices.</li>
<li>Après rupture : carvédilol et ligature toutes les deux à quatre semaines ; TIPS si échec ; évaluation pour la transplantation.</li>
<li>Recompensation : cause contrôlée et absence d’ascite, d’encéphalopathie et de récidive pendant plus de six mois.</li></ul></template>

<template data-pop="pareto-i85-suivi" data-title="Pareto — Varices des autres sièges, suivi et situations particulières">
<p class="ratio" data-cover="i85-11,i85-12,i85-13,i85-14"></p>
<ul><li>GOV2 et IGV1 : colle ou échoendoscopie, puis TIPS avec ou sans embolisation ; IGV1 isolées avec foie normal : thrombose splénique (I86.4).</li>
<li>Gastropathie : bêtabloquant ; ectasies antrales : ligature.</li>
<li>Varicocèle : reflux testiculaire gauche ; traitement si infertilité avec spermogramme anormal ou testicule plus petit de plus de 20 % chez l’adolescent ; droite isolée : imagerie abdominale.</li>
<li>Varices pelviennes : embolisation seulement si douleur pelvienne après exclusion des autres causes ; vulvaires de la grossesse : O22.1, régression après l’accouchement.</li>
<li>Varices sublinguales : bénignes, mesurer la pression artérielle.</li>
<li>Suivi annuel par élastographie et plaquettes, échographie semestrielle ; pronostic par Child-Pugh et MELD.</li></ul></template>

<template data-pop="pareto-i85-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i85-e-1,i85-e-2,i85-e-3,i85-e-4,i85-e-5,i85-e-6,i85-e-7,i85-e-8"></p>
<ul><li>HVPG : référence de l’hypertension portale, rarement nécessaire ; aveugle aux obstacles présinusoïdaux.</li>
<li>Élastographie à jeun ; faux positifs par hépatite aiguë, cholestase, congestion.</li>
<li>Endoscopie : taille après insufflation, signes rouges, Sarin ; référence de la rupture.</li>
<li>Imagerie en coupe après toute rupture : thrombose, CHC, collatérales.</li>
<li>L’INR ne mesure pas le risque de saignement ; Child-Pugh et MELD mesurent la gravité.</li>
<li>Varicocèle : veine &gt; 3 mm et reflux &gt; 2 secondes à l’écho-Doppler ; volume testiculaire par la formule de Lambert ; spermogramme si infertilité.</li>
<li>Élasticité normale avec varices : thrombose porte, thrombose splénique ou maladie porto-sinusoïdale.</li>
<li>Patient décompensé hospitalisé : ponction d’ascite, hémocultures, culture d’urine et radiographie thoracique.</li></ul></template>

<template data-pop="pareto-i85-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i85-sa,i85-sh,i85-sp,i85-sb,i85-sm"></p>
<ul><li>Varices aux sites d’anastomose portocave ; rupture dans la zone palissadique superficielle ; veine testiculaire gauche à angle droit dans la veine rénale.</li>
<li>Cellules étoilées activées et capillarisation : résistance structurale et dynamique.</li>
<li>Poiseuille et Laplace : petite baisse de rayon, forte hausse de résistance ; grand rayon, forte tension.</li>
<li>Seul un bêtabloquant non sélectif bloque les récepteurs bêta-2 splanchniques.</li>
<li>NO déficitaire dans le foie, excédentaire dans l’intestin ; hémostase rééquilibrée ; ammoniac piégé par le lactulose.</li>
<li>Translocation bactérienne : base de l’antibioprophylaxie ; la ceftriaxone couvre les entérobactéries.</li>
<li>Le HVPG mesure la résistance sinusoïdale, pas le débit ni l’obstacle préhépatique.</li></ul></template>

<template data-pop="pareto-i85-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i85-p-1,i85-p-2,i85-p-3,i85-p-4,i85-p-5"></p>
<ul><li>Carvédilol 6,25 puis 12,5 mg par jour ; propranolol 20 mg deux fois par jour, jusqu’à 160 mg deux fois par jour au maximum.</li>
<li>Terlipressine 1 à 2 mg toutes les 4 à 6 heures, maximum 12 mg par jour pendant 36 heures ; contre-indiquée chez le coronarien ; surveiller le sodium.</li>
<li>Octréotide 50 µg puis 25 à 50 µg par heure.</li>
<li>Ceftriaxone 1 g par jour ; érythromycine 250 mg avant l’endoscopie si le QT est normal ; lactulose.</li>
<li>Éviter anti-inflammatoires, aminosides, sédatifs, bloqueurs du système rénine-angiotensine en cas d’ascite, bêtabloquants cardiosélectifs.</li></ul></template>
