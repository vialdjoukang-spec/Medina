<template data-pop="pareto-i85-meca" data-title="Pareto — Notions et dépistage"><p class="ratio" data-cover="i85-0,i85-1,i85-2,i85-3"></p><ul>
<li>HVPG ≥ 10 mmHg : hypertension portale significative ; ≥ 12 : seuil de rupture.</li>
<li>Varices de la cirrhose : maladie du foie † et I98.2* ou I98.3*, non I85.</li>
<li>Pression = débit × résistance ; rupture selon Laplace (rayon, paroi fine, signes rouges).</li>
<li>Élasticité ≥ 25 kPa affirme, ≤ 15 kPa avec plaquettes ≥ 150 G/L exclut (Baveno VIII).</li></ul></template>
<template data-pop="pareto-i85-pec" data-title="Pareto — Urgence et prévention"><p class="ratio" data-cover="i85-4,i85-5,i85-6"></p><ul>
<li>Mortalité 15 à 20 % à six semaines.</li>
<li>Hémoglobine 70 à 80 g/L ; vasoactif et ceftriaxone dès la suspicion ; lactulose.</li>
<li>Érythromycine 250 mg IV puis endoscopie ≤ 12 h ; ligature.</li>
<li>TIPS préemptif ≤ 72 h : Child C 10–13, B &gt; 7 avec saignement actif, HVPG ≥ 20.</li>
<li>Prévention : bêtabloquant non sélectif ; récidive : bêtabloquant et ligature.</li></ul></template>
<template data-pop="pareto-i85-autres" data-title="Pareto — Varices gastriques et I86"><p class="ratio" data-cover="i85-7,i85-8"></p><ul>
<li>Sarin : GOV1 comme l’œsophage ; GOV2 et IGV1 : colle puis TIPS.</li>
<li>IGV1 isolées, foie normal : thrombose splénique, code I86.4.</li>
<li>Varicocèle gauche ; droite isolée ou brutale : chercher une cause abdominale.</li>
<li>Varices pelviennes : exclure d’abord les autres causes de douleur (ESVS 2022).</li></ul></template>
<template data-pop="pareto-i85-crit" data-title="Pareto — Critères"><p class="ratio" data-cover="i85-9"></p><ul>
<li>Critères de Baveno VIII pour l’hypertension significative et la rupture.</li>
<li>Délais : endoscopie 12 h, TIPS 72 h.</li></ul></template>
<template data-pop="pareto-i85-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i85-e-1,i85-e-2"></p><ul>
<li>Endoscopie : taille, signes rouges, Sarin.</li>
<li>HVPG = pression bloquée − pression libre ; faux négatif présinusoïdal.</li>
<li>Doppler et scanner : thrombose, shunts ; Child-Pugh et MELD à l’admission.</li></ul></template>
<template data-pop="pareto-i85-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i85-p-1,i85-p-2"></p><ul>
<li>Propranolol autorisé en Suisse ; carvédilol préféré, hors indication.</li>
<li>Réduire ou arrêter si systolique &lt; 90 ou moyenne &lt; 65 mmHg.</li>
<li>Terlipressine 1 à 2 mg IV toutes les 4 à 6 h (Curapressin®).</li></ul></template>
