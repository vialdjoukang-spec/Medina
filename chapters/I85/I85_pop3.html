<!-- ===== FENÊTRES I85 : traitements, essais et monographies ===== -->
<template data-pop="i85-transfusion" data-title="Transfusion restrictive dans l’hémorragie variceuse">
<div class="lab">Recommandation (Baveno VIII, 5.4)</div><p>Le médecin transfuse des culots érythrocytaires avec une hémoglobine cible de 7 à 8 g/dL, soit 70 à 80 g/L, adaptée à une maladie cardiovasculaire, à l’âge, à l’état hémodynamique et à la poursuite du saignement. Cette recommandation est forte, avec un niveau de preuve 2.</p>
<div class="lab">Preuve</div><p>L’essai de Villanueva et al. (2013) a inclus 921 patients porteurs d’une hémorragie digestive haute sévère et a comparé une transfusion sous 70 g/L à une transfusion sous 90 g/L. La survie à six semaines atteignait 95 % contre 91 %, et la récidive 10 % contre 16 %. Le bénéfice était significatif chez les cirrhotiques en classe A ou B, mais pas en classe C.</p>
<div class="lab">Mécanisme</div><p>Le gradient de pression portale augmentait pendant les cinq premiers jours sous stratégie libérale, mais pas sous stratégie restrictive. Le volume transfusé élève le débit et la pression portale.</p>
<div class="lab">Limite</div><p>Un coronarien en ischémie active ou un patient qui saigne massivement peut justifier un seuil plus élevé ; la décision reste individuelle.</p></template>

<template data-pop="i85-pfc" data-title="Plasma, plaquettes, fibrinogène et antifibrinolytiques">
<div class="lab">Plasma frais congelé</div><p>Non recommandé de routine : il ne corrige pas la coagulopathie et peut provoquer une surcharge volumique qui aggrave l’hypertension portale (Baveno VIII, 5.23).</p>
<div class="lab">Plaquettes et fibrinogène</div><p>Leurs taux ne prédisent pas l’échec ou la récidive ; leur administration n’est envisagée qu’en cas d’échec du contrôle hémorragique (5.24).</p>
<div class="lab">Facteur VIIa recombinant et acide tranexamique</div><p>Non recommandés (5.25). Les essais n’ont pas montré de bénéfice sur la mortalité, et l’acide tranexamique expose à la thrombose.</p></template>

<template data-pop="i85-ligature" data-title="Ligature élastique des varices">
<div class="lab">Technique</div><p>Un capuchon fixé au bout de l’endoscope aspire la varice ; un élastique est largué à sa base. La varice se thrombose, se nécrose et tombe en quelques jours, laissant un ulcère superficiel qui cicatrise en fibrose.</p>
<div class="lab">Indications</div><p>Hémostase des varices œsophagiennes et GOV1 (Baveno VIII, 5.29) ; prévention primaire chez le patient qui ne peut pas recevoir de bêtabloquant et a de grandes varices (3.19) ; prévention secondaire avec le bêtabloquant (4.8).</p>
<div class="lab">Schéma</div><p>Les séances ont lieu toutes les deux à quatre semaines jusqu’à l’éradication ; une endoscopie suit à six mois, puis chaque année, car les varices peuvent réapparaître.</p>
<div class="lab">Complications</div><p>Douleur thoracique, dysphagie transitoire, ulcère de ligature qui peut saigner une à deux semaines après la séance (5.47). Les inhibiteurs de la pompe à protons n’ont pas montré de bénéfice suffisant pour prévenir ce saignement (5.48).</p>
<div class="lab">Limite</div><p>La ligature supprime la varice mais pas l’hypertension portale : elle ne prévient ni l’ascite ni l’encéphalopathie.</p><figure><img src="images/cardiologie/i85_ulceres_post_ligature_endoscopie.gif" alt="Ulcérations œsophagiennes après ligature élastique" width="398" height="327" loading="lazy" decoding="async"><figcaption>Ulcérations après chute des anneaux : la varice étranglée se nécrose, puis laisse une plaie qui cicatrise en fibrose. Samir, Wikimedia Commons, domaine public.</figcaption></figure></template>

<template data-pop="i85-tips" data-title="TIPS : shunt portosystémique intrahépatique transjugulaire">
<div class="lab">Principe</div><p>Par voie jugulaire, le radiologue ponctionne une branche portale depuis une veine sus-hépatique et place une prothèse couverte de PTFE entre les deux. Le sang portal court-circuite le foie : le gradient portocave chute.</p>
<div class="lab">Indications dans l’hémorragie</div><p>Le TIPS préemptif se pose dans les 72 heures, idéalement 24, chez le patient qui saigne de varices œsophagiennes ou GOV1 et a un Child-Pugh C de 10 à 13, un Child-Pugh B supérieur à 7 avec saignement actif, ou un HVPG ≥ 20 mmHg (Baveno VIII, 5.31), car il réduit la récidive et la mortalité chez ces patients à haut risque. Le TIPS de sauvetage s’indique après échec du traitement initial (5.36), et le TIPS s’indique aussi après échec de la prévention secondaire (4.13). Enfin, le TIPS, avec ou sans embolisation, est un traitement définitif des varices GOV2 et IGV1 (5.41).</p>
<div class="lab">Preuve</div><p>García-Pagán et al. (2010) : 63 patients à haut risque ; survie à un an 86 % avec TIPS précoce contre 61 % avec traitement médical et endoscopique ; absence de récidive ou d’échec à un an 97 % contre 50 %.</p>
<div class="lab">Limites et effets indésirables</div><p>Encéphalopathie, car le sang intestinal contourne le foie ; aggravation d’une insuffisance cardiaque par l’augmentation du retour veineux ; dysfonction de la prothèse. L’algorithme de Baveno VIII réserve le TIPS préemptif aux patients de moins de 75 ans, avec une créatinine inférieure à 3 mg/dL et sans insuffisance cardiaque.</p></template>

<template data-pop="i85-tamponnement" data-title="Prothèse œsophagienne et tamponnement par ballonnet">
<div class="lab">Indication</div><p>La prothèse ou le tamponnement s’indiquent dans une hémorragie de varices œsophagiennes réfractaire au traitement pharmacologique et endoscopique ; ils servent de pont vers un TIPS ou une transplantation.</p>
<div class="lab">Choix (Baveno VIII, 5.35)</div><p>Une prothèse métallique auto-expansible couverte, dédiée à cet usage, est préférée au tamponnement par ballonnet, par exemple à la sonde de Sengstaken-Blakemore.</p>
<div class="lab">Justification</div><p>Le ballonnet comprime efficacement la varice mais expose à l’inhalation, à la nécrose et à la perforation de l’œsophage, et la récidive est fréquente après son dégonflage. La prothèse comprime la varice tout en laissant le patient s’alimenter et respirer sans sonde.</p>
<div class="lab">Piège</div><p>Ces moyens ne sont que des ponts : sans TIPS ou transplantation, le saignement récidive.</p></template>

<template data-pop="i85-predesci" data-title="Essai PREDESCI (2019)">
<div class="lab">Question</div><p>Un bêtabloquant prévient-il la décompensation chez le patient compensé porteur d’une hypertension portale cliniquement significative (HVPG ≥ 10 mmHg) sans varices à haut risque ?</p>
<div class="lab">Méthode</div><p>Essai randomisé, en double aveugle, contre placebo, dans huit hôpitaux espagnols. Les répondeurs aigus au propranolol intraveineux recevaient du propranolol (jusqu’à 160 mg deux fois par jour), les non-répondeurs du carvédilol (25 mg par jour au plus). 201 patients ont été randomisés.</p>
<div class="lab">Résultats</div><p>La décompensation ou le décès sont survenus chez 16 % des patients sous bêtabloquant contre 27 % sous placebo (rapport de risques instantanés 0,51). La différence venait surtout de la réduction de l’ascite, et les effets indésirables étaient comparables.</p>
<div class="lab">Portée</div><p>Il fonde la recommandation de Baveno VII puis de Baveno VIII (3.15). Limite : population espagnole, sélection par le HVPG, que la pratique remplace aujourd’hui par les tests non invasifs.</p>
<div class="lab">Source</div><p>La référence est Villanueva et al., <i>Lancet</i> 2019;393:1597–1608.</p></template>

<template data-pop="i85-baveno" data-title="Arbitrage des sources : Baveno VIII, Baveno VII et EASL 2018">
<div class="lab">Source retenue</div><p>La source de référence est Baveno VIII – Advancing Consensus in Portal Hypertension, issue de la conférence de mars 2026 ; sa version acceptée du 31 juillet 2026, publiée en prépublication dans le <i>Journal of Hepatology</i> (doi:10.1016/j.jhep.2026.07.030). Elle est avalisée par l’EASL et l’ESGE, et 272 déclarations ont obtenu plus de 80 % d’accord. Les niveaux de preuve suivent l’échelle d’Oxford.</p>
<div class="lab">Relation avec les textes antérieurs</div><p>Baveno VII (2022) reste valable pour les points que Baveno VIII n’a pas révisés, notamment la technique et la signification du HVPG. Les recommandations de l’EASL sur la cirrhose décompensée datent de 2018 ; elles ne sont pas remplacées formellement par un consensus, mais Baveno VIII est plus récent sur les points qu’il traite.</p>
<div class="lab">Points de contentieux tranchés par la source la plus récente</div><p>Bêtabloquant et ascite : l’EASL 2018 recommandait la prudence ou l’arrêt en cas d’ascite réfractaire avec hypotension ; Baveno VIII recommande le carvédilol ou un bêtabloquant conventionnel chez le patient porteur d’une ascite et de varices, avec arrêt si la pression systolique est inférieure à 90 mmHg ou la moyenne inférieure à 65 mmHg (4.4 et 4.6). Antibioprophylaxie : Baveno VIII permet de raccourcir ou d’omettre l’antibiotique en classe A (5.10). Durée du vasoactif : 24 heures peuvent suffire après une hémostase réussie si le bêtabloquant suit (5.8).</p>
<div class="lab">Limites</div><p>La version citée n’est pas encore la version définitive de l’éditeur ; la numérotation des déclarations pourrait changer. Aucune recommandation nationale suisse spécifique n’a été retrouvée ; la pratique suisse suit Baveno et l’EASL. La première autrice de Baveno VIII exerce à l’Hôpital de l’Île à Berne.</p></template>

<template data-pop="i85-recompensation" data-title="Recompensation de la cirrhose">
<div class="lab">Définition (Baveno VIII, 7.1 et 7.4)</div><p>La recompensation est le retour d’un patient décompensé à un état compensé après le traitement de la cause. Il faut remplir tous les critères : la cause est supprimée ou contrôlée ; l’ascite a disparu en imagerie sans diurétique et l’encéphalopathie est absente sans traitement spécifique ; aucune récidive hémorragique ne survient, même sous carvédilol ; ces trois critères persistent plus de six mois ; enfin, la fonction hépatique correspond à un score de Child-Pugh de 5 ou 6 points (classe A).</p>
<div class="lab">Exemples de causes contrôlées</div><p>La cause est contrôlée par une abstinence durable d’alcool, une suppression durable de l’ADN du VHB ou une réponse virologique soutenue du VHC (7.5).</p>
<div class="lab">Conséquences</div><p>La mortalité et le risque de CHC diminuent (7.3), mais la surveillance hépatologique tous les six mois et le dépistage du CHC restent maintenus (7.13 et 7.14), car le risque ne disparaît pas. Le bêtabloquant ne s’arrête que si la disparition de l’hypertension portale significative est confirmée (7.18).</p></template>

<template data-pop="i85-transplant" data-title="Transplantation hépatique">
<div class="lab">Indication</div><p>Tout patient décompensé doit être évalué pour une transplantation (Baveno VIII, 4.3), car la survie à long terme sans greffe est limitée.</p>
<div class="lab">Priorité</div><p>Le score MELD, éventuellement corrigé par le sodium, ordonne la liste ; certaines situations, comme une encéphalopathie réfractaire après TIPS, peuvent justifier une priorisation (5.34).</p>
<div class="lab">Conditions</div><p>La transplantation exige une abstinence d’alcool évaluée par une équipe pluridisciplinaire et l’absence de contre-indication cardiaque, oncologique ou psychosociale majeure. En Suisse, l’évaluation se fait dans les centres de transplantation hépatique.</p></template>

<template data-pop="i85-varicocelectomie" data-title="Traitements de la varicocèle">
<div class="lab">Microchirurgie subinguinale</div><p>La microchirurgie ligature les veines du cordon sous microscope, en préservant l’artère testiculaire et les lymphatiques. Elle a le taux de récidive le plus bas, environ 0,4 %, et peu de complications ; c’est pourquoi l’EAU la considère comme la technique la plus efficace.</p>
<div class="lab">Embolisation</div><p>L’embolisation occlut la veine testiculaire par voie endovasculaire, à l’aide de spires ou d’un agent sclérosant. Elle est moins invasive, mais la récidive atteint 3 à 11 % pour l’embolisation rétrograde selon l’EAU.</p>
<div class="lab">Autres techniques</div><p>La laparoscopie récidive dans 3 à 6 % des cas, et la ligature rétropéritonéale haute ouverte dans 15 à 29 %. La lésion des lymphatiques expose à l’hydrocèle, car la lymphe ne s’évacue plus.</p></template>

<template data-pop="i85-grossesse" data-title="Propranolol et grossesse">
<div class="lab">Position de Baveno VIII</div><p>Dans les maladies vasculaires du foie, la prophylaxie de l’hémorragie variceuse pendant la grossesse suit les mêmes principes qu’en dehors, y compris l’usage du propranolol (8.18) ; les bêtabloquants non sélectifs sont compatibles avec l’allaitement (8.20).</p>
<div class="lab">Information professionnelle suisse</div><p>Le résumé de la monographie d’Inderal consultée sur compendium.ch cite la grossesse et l’allaitement parmi les situations du chapitre des contre-indications, avec un renvoi à l’information professionnelle complète, qui n’a pas été lue en entier pour ce cours.</p>
<div class="lab">Conséquence pratique</div><p>Le bénéfice de la prévention d’une hémorragie potentiellement mortelle est discuté avec l’obstétricien ; le nouveau-né d’une mère traitée est surveillé pour une bradycardie et une hypoglycémie.</p></template>

<template data-pop="i85-eviter" data-title="Médicaments à éviter chez le cirrhotique">
<div class="lab">Anti-inflammatoires non stéroïdiens</div><p>Ils inhibent les prostaglandines qui maintiennent la perfusion rénale chez le cirrhotique ; ils favorisent l’insuffisance rénale, la rétention sodée, l’ascite réfractaire et l’ulcère hémorragique.</p>
<div class="lab">Aminosides</div><p>Néphrotoxicité accrue chez le patient dont la perfusion rénale est précaire.</p>
<div class="lab">Benzodiazépines, opioïdes</div><p>Ils précipitent l’encéphalopathie hépatique ; leur élimination est ralentie.</p>
<div class="lab">Inhibiteurs de l’enzyme de conversion et antagonistes des récepteurs de l’angiotensine II</div><p>En cas d’ascite, ils aggravent l’hypotension et l’insuffisance rénale, car la pression artérielle dépend de l’activation du système rénine-angiotensine (EASL 2018).</p>
<div class="lab">Bêtabloquants cardiosélectifs</div><p>Ils ne remplacent pas un bêtabloquant non sélectif pour l’hypertension portale.</p></template>

<template data-pop="i85-cyano" data-title="Colle de cyanoacrylate">
<div class="lab">Principe</div><p>Le N-butyl-2-cyanoacrylate, injecté dans la lumière d’une varice gastrique, polymérise au contact du sang en quelques secondes et l’oblitère.</p>
<div class="lab">Indications</div><p>Hémostase des varices GOV2 et IGV1, avec une efficacité comparable au traitement échoendoscopique (Baveno VIII, 5.40) ; prévention chez certains patients qui ne peuvent pas recevoir de bêtabloquant, dans les centres experts (3.21 b).</p>
<div class="lab">Complications</div><p>La colle peut emboliser vers les poumons, surtout en présence d’un shunt gastrorénal ; elle peut aussi provoquer un ulcère et l’expulsion du bouchon avec un saignement secondaire. L’association de spires sous échoendoscopie réduit ce risque.</p>
<div class="lab">Statut</div><p>Il s’agit d’un dispositif médical utilisé hors des indications prévues par son fabricant dans plusieurs pays ; son usage relève des centres expérimentés.</p></template>

<template data-pop="i85-d-carve" data-title="Carvédilol (monographie hépatologique)">
<div class="lab">Mécanisme</div><p>Le carvédilol est un bêtabloquant non sélectif doté d’une activité alpha-1-bloquante. Le blocage bêta-1 réduit le débit cardiaque, le blocage bêta-2 favorise la vasoconstriction splanchnique, et le blocage alpha-1 relâche les myofibroblastes hépatiques, ce qui réduit la résistance intrahépatique.</p>
<div class="lab">Preuves</div><p>Dans l’essai PREDESCI (2019), les non-répondeurs au propranolol recevaient du carvédilol. Baveno VIII le préfère aux bêtabloquants conventionnels pour prévenir la décompensation (3.15), le premier saignement chez le patient porteur d’une ascite (4.4) et la récidive (4.8).</p>
<div class="lab">Posologie</div><p>6,25 mg une fois par jour (dose initiale citée par le NICE, NG50), puis 12,5 mg par jour en deux prises si la pression systolique reste ≥ 90 mmHg ; dose cible de 12,5 mg par jour (practice guidance de l’AASLD 2024). Usage hors indication suisse ; la monographie suisse n’a pas été relue pour ce cours.</p>
<div class="lab">Effets indésirables</div><p>Il provoque une hypotension, surtout chez le patient porteur d’une ascite, ainsi qu’une fatigue, une bradycardie, un bronchospasme et une dysfonction érectile.</p>
<div class="lab">Contre-indications et arrêt</div><p>Il est contre-indiqué en cas d’asthme, de bloc auriculoventriculaire de haut degré, de bradycardie sévère et d’insuffisance cardiaque décompensée. Le médecin le réduit ou l’arrête si la pression systolique reste &lt; 90 mmHg, si la pression moyenne reste &lt; 65 mmHg ou en cas d’insuffisance rénale aiguë de type hépatorénal (Baveno VIII, 4.6), car l’hypotension aggrave la perfusion rénale.</p>
<div class="lab">Surveillance</div><p>Le médecin surveille la pression artérielle, la fréquence cardiaque, la créatinine et le sodium.</p></template>

<template data-pop="i85-d-propra" data-title="Propranolol (monographie)">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif, sans activité alpha-bloquante ; il réduit le débit splanchnique par le blocage bêta-1 et bêta-2.</p>
<div class="lab">Indication suisse</div><p>L’information professionnelle d’Inderal mentionne la prévention de l’hémorragie digestive haute dans l’hypertension portale et les varices œsophagiennes.</p>
<div class="lab">Posologie (Inderal, compendium.ch, consulté le 8.10.2026)</div><p>Le traitement commence à 20 mg deux fois par jour ; la dose peut monter jusqu’à 80 mg deux fois par jour, puis progressivement jusqu’à 160 mg deux fois par jour au maximum, en visant une réduction de 25 % de la fréquence cardiaque de repos. Le patient le prend avant les repas.</p>
<div class="lab">Patient porteur d’une ascite</div><p>Dans l’hypertension portale, la dose maximale est de 80 mg deux fois par jour (160 mg par jour), selon la practice guidance de l’AASLD 2017 et la réponse de ses auteurs (<i>Hepatology</i> 2017;66:302-303, doi:10.1002/hep.29180), car la cirrhose tolère mal les doses plus fortes. Baveno VIII demande en outre de réduire ou d’arrêter le bêtabloquant si la pression systolique reste &lt; 90 mmHg, si la pression moyenne reste &lt; 65 mmHg ou en cas d’insuffisance rénale aiguë de type hépatorénal (4.6).</p>
<div class="lab">Contre-indications (même source)</div><p>Le propranolol est contre-indiqué en cas de bronchospasme, d’insuffisance cardiaque décompensée, de bradycardie, d’hypotension, de bloc auriculoventriculaire du deuxième et du troisième degré, de maladie du sinus, d’angor de Prinzmetal, de troubles artériels périphériques sévères, de phéochromocytome non traité, de choc cardiogénique, d’acidose métabolique, de jeûne prolongé et de tendance à l’hypoglycémie, car le blocage bêta aggrave chacune de ces situations ; grossesse et allaitement figurent dans ce chapitre.</p>
<div class="lab">Interactions</div><p>Le vérapamil et le diltiazem exposent au bloc, et les inhibiteurs du CYP2D6 et du CYP1A2 augmentent les concentrations.</p>
<div class="lab">Place</div><p>Alternative au carvédilol, préférée lorsque la pression artérielle est basse ou dans les situations où Baveno VIII le cite, comme la grossesse (8.18).</p></template>

<template data-pop="i85-d-terli" data-title="Terlipressine (monographie)">
<div class="lab">Mécanisme</div><p>Promédicament de la lysine-vasopressine, libérée progressivement. Elle agit surtout sur les récepteurs V1a des muscles lisses vasculaires et provoque une vasoconstriction splanchnique qui réduit le débit et la pression portale.</p>
<div class="lab">Indication suisse</div><p>La terlipressine est indiquée dans le traitement aigu des varices œsophagiennes hémorragiques et dans le traitement d’urgence du syndrome hépatorénal de type I chez l’adulte de plus de 18 ans (Curapressin, compendium.ch).</p>
<div class="lab">Posologie (Curapressin, consulté le 8.10.2026)</div><p>Chez l’adulte de plus de 50 kg, la dose est de 1 à 2 mg par voie intraveineuse toutes les 4 à 6 heures ; sous 50 kg, elle est de 1 mg toutes les 4 à 6 heures. La dose maximale est de 12 mg par jour (2 mg toutes les 4 heures) pendant 36 heures au plus, puis de 6 mg par jour, pour une durée maximale de 5 jours. La dose se réfère au diacétate : 1 mg correspond à 0,85 mg de terlipressine base.</p>
<div class="lab">Contre-indications</div><p>Elle est contre-indiquée en cas d’insuffisance coronarienne, d’événement ischémique cardiovasculaire depuis moins de trois mois, de grossesse et d’allaitement, car elle resserre aussi les coronaires et l’utérus ; une contraception est nécessaire jusqu’à deux semaines après le traitement.</p>
<div class="lab">Effets indésirables</div><p>Elle peut provoquer une ischémie coronarienne, mésentérique ou cutanée, une hypertension, une bradycardie, des douleurs abdominales, une hyponatrémie, une surcharge volumique et une détresse respiratoire.</p>
<div class="lab">Surveillance</div><p>Le médecin surveille la natrémie (Baveno VIII, 5.9), l’ECG, la pression artérielle, les extrémités et la saturation en oxygène.</p></template>

<template data-pop="i85-d-octreo" data-title="Octréotide (monographie)">
<div class="lab">Mécanisme</div><p>L’octréotide est un analogue de la somatostatine. Il inhibe la sécrétion de glucagon et d’autres peptides vasodilatateurs intestinaux, ce qui provoque une vasoconstriction splanchnique et atténue l’hyperhémie postprandiale.</p>
<div class="lab">Posologie</div><p>Bolus de 50 µg par voie intraveineuse, puis perfusion continue de 25 à 50 µg par heure, pendant 2 à 5 jours (practice guidance de l’AASLD 2024, résumée en 2025). Le résumé des caractéristiques européen indique 25 µg par heure pendant 5 jours et une tolérance de 50 µg par heure chez le cirrhotique. La monographie suisse n’a pas été lue pour cette indication.</p>
<div class="lab">Effets indésirables</div><p>Il peut provoquer une hyperglycémie ou une hypoglycémie, une bradycardie et des troubles digestifs.</p>
<div class="lab">Place</div><p>Alternative à la terlipressine, notamment chez le coronarien ; Baveno VIII ne hiérarchise pas les vasoactifs.</p></template>

<template data-pop="i85-d-ceftri" data-title="Ceftriaxone (antibioprophylaxie)">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération, bactéricide, qui inhibe la synthèse de la paroi bactérienne. Elle couvre la plupart des entérobactéries et des streptocoques responsables des infections du cirrhotique.</p>
<div class="lab">Posologie dans cette indication</div><p>La dose est de 1 g par voie intraveineuse toutes les 24 heures. La durée varie selon les sources : jusqu’à 5 jours selon la practice guidance de l’AASLD et jusqu’à 7 jours selon d’autres recommandations ; Baveno VIII permet de l’individualiser et de la raccourcir en classe A (5.10).</p>
<div class="lab">Preuve</div><p>Sans prophylaxie, 30 à 40 % des cirrhotiques qui saignent s’infectent dans la semaine (Mallet et al., 2017). Une méta-analyse citée par la revue de 2025 trouve une réduction des infections (risque relatif 0,35) et des récidives (0,53).</p>
<div class="lab">Précautions</div><p>Elle est contre-indiquée en cas d’allergie aux bêtalactamines et chez le nouveau-né recevant du calcium intraveineux ; son choix s’adapte aux résistances locales (5.11).</p></template>

<template data-pop="i85-d-erythro" data-title="Érythromycine avant l’endoscopie">
<div class="lab">Mécanisme</div><p>Macrolide qui stimule les récepteurs de la motiline et accélère la vidange gastrique ; l’estomac se vide du sang et des caillots.</p>
<div class="lab">Posologie (Baveno VIII, 5.20)</div><p>La dose est de 250 mg par voie intraveineuse, en dose unique, 30 à 90 minutes avant l’endoscopie.</p>
<div class="lab">Bénéfice</div><p>Elle améliore la visibilité et réduit le besoin transfusionnel, car elle accélère la vidange gastrique du sang. La recommandation est faible, avec un niveau de preuve 2.</p>
<div class="lab">Contre-indication</div><p>Elle allonge le QT et expose donc au risque de torsades de pointes. De plus, elle inhibe le CYP3A4, ce qui impose la prudence avec le tacrolimus, la ciclosporine et certaines statines.</p></template>

<template data-pop="i85-d-lactulose" data-title="Lactulose">
<div class="lab">Mécanisme</div><p>Le lactulose est un disaccharide non absorbé, que les bactéries du côlon fermentent en acides organiques. Le pH colique baisse, l’ammoniac est transformé en ammonium non absorbable, et l’effet laxatif élimine le sang et l’ammoniac.</p>
<div class="lab">Indication (Baveno VIII, 5.22)</div><p>Il prévient ou traite l’encéphalopathie hépatique pendant l’hémorragie variceuse, par voie orale ou en lavement, car le sang digéré libère de l’ammoniac.</p>
<div class="lab">Posologie</div><p>Dose ajustée pour obtenir deux à trois selles molles par jour ; ce repère usuel provient des recommandations sur l’encéphalopathie hépatique, non relues pour ce cours.</p>
<div class="lab">Effets indésirables</div><p>Ballonnement, diarrhée excessive avec déshydratation et hypernatrémie, qui peuvent aggraver l’encéphalopathie.</p></template>
