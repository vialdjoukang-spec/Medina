<!-- ===== FENÊTRES I85 : clinique, examens et classifications ===== -->
<template data-pop="i85-alcool" data-title="Consommation d’alcool">
<div class="lab">Mesure</div><p>La consommation se compte en verres standard ; en Suisse, un verre standard contient environ 10 à 12 g d’alcool pur, soit un verre de vin de 1 dL ou une bière de 3 dL. Six verres par jour représentent donc 60 à 70 g d’alcool.</p>
<div class="lab">Technique d’entretien</div><p>Le médecin demande la consommation d’une semaine type, jour par jour, plutôt qu’une moyenne, et utilise un questionnaire structuré comme l’AUDIT lorsque la consommation semble problématique.</p>
<div class="lab">Pourquoi c’est décisif</div><p>La poursuite de l’alcool est le principal moteur des événements hépatiques dans la maladie alcoolique (Baveno VIII, 2.1). L’abstinence durable est la condition de la recompensation (7.5 a).</p>
<div class="lab">Conséquence pratique</div><p>Chaque hospitalisation pour hémorragie est l’occasion de proposer un accompagnement addictologique.</p></template>

<template data-pop="i85-viral" data-title="Hépatites virales B et C">
<div class="lab">Recherche</div><p>Antigène HBs, anticorps anti-HBc et anticorps anti-VHC chez tout patient porteur d’une hépatopathie ou d’une hypertension portale inexpliquée.</p>
<div class="lab">Pourquoi</div><p>Le contrôle durable de l’ADN du VHB et la réponse virologique soutenue du VHC sont des traitements étiologiques qui permettent de réduire l’hypertension portale et d’obtenir une recompensation (Baveno VIII, 7.5).</p>
<div class="lab">Piège</div><p>Après guérison du VHC, l’hypertension portale significative peut persister ; elle doit être réévaluée (3.14 b), et le dépistage du carcinome hépatocellulaire se poursuit.</p></template>

<template data-pop="i85-anticoag" data-title="Anticoagulant et antiplaquettaire pendant une hémorragie variceuse">
<div class="lab">Conduite</div><p>L’anticoagulation est interrompue temporairement jusqu’au contrôle du saignement ; le moment de sa reprise dépend de la force de l’indication (Baveno VIII, 5.26).</p>
<div class="lab">Raisonnement</div><p>Un patient porteur d’une valve mécanique ou d’une thrombose porte récente a une indication forte, qui justifie une reprise précoce après hémostase. Une fibrillation auriculaire à faible risque thromboembolique permet d’attendre davantage.</p>
<div class="lab">Aspirine</div><p>L’aspirine prescrite pour une indication reconnue n’est pas découragée chez le cirrhotique (Baveno VII, déclaration maintenue) ; sa reprise se décide après le contrôle de l’hémorragie.</p></template>

<template data-pop="i85-hematemese" data-title="Hématémèse">
<div class="lab">Définition</div><p>Vomissement de sang provenant du tube digestif en amont de l’angle duodénojéjunal.</p>
<div class="lab">Caractérisation</div><p>Sang rouge et abondant : saignement récent et important, typique de la rupture de varices. Aspect « marc de café » : sang ayant séjourné dans l’acidité gastrique, qui transforme l’hémoglobine en hématine brune.</p>
<div class="lab">Diagnostic différentiel</div><p>Une hémoptysie avalée puis vomie ou une épistaxis déglutie peuvent simuler une hématémèse. Le contexte et l’examen de la cavité buccale et du nez les distinguent.</p>
<div class="lab">Conséquence pratique</div><p>Une hématémèse active impose l’intubation avant l’endoscopie, car le risque d’inhalation est élevé (Baveno VIII, 5.5).</p></template>

<template data-pop="i85-melena" data-title="Méléna">
<div class="lab">Définition</div><p>Émission de selles noires, goudronneuses, collantes et fétides, due à du sang digéré.</p>
<div class="lab">Mécanisme</div><p>L’hémoglobine est dégradée par l’acide et les bactéries au cours d’un transit de plusieurs heures. Une perte d’environ 50 à 100 mL dans le tube digestif haut suffit à produire un méléna.</p>
<div class="lab">Pièges</div><p>Le fer et le bismuth noircissent les selles sans les rendre goudronneuses. Un méléna peut persister plusieurs jours après l’arrêt du saignement et ne prouve donc pas une hémorragie active.</p></template>

<template data-pop="i85-choc" data-title="Choc hémorragique : signes et index de choc">
<div class="lab">Signes</div><p>Tachycardie, hypotension, pâleur, marbrures, extrémités froides, temps de recoloration supérieur à 3 secondes, oligurie, agitation puis somnolence.</p>
<div class="lab">Index de choc</div><p>Fréquence cardiaque divisée par la pression systolique ; normal entre environ 0,5 et 0,7. Une valeur supérieure à 1 traduit une perte importante. Chez M. B., 118 / 92 donne 1,28.</p>
<div class="lab">Pièges</div><p>Un bêtabloquant masque la tachycardie, et la pression artérielle basse habituelle du cirrhotique rend la pression systolique moins discriminante. L’hémoglobine initiale sous-estime la perte, car l’hémodilution prend plusieurs heures.</p>
<div class="lab">Conséquence pratique</div><p>Réanimation immédiate, soins intensifs ou intermédiaires, endoscopie dès que possible si l’instabilité persiste (Baveno VIII, 5.18).</p></template>

<template data-pop="i85-intubation" data-title="Intubation avant l’endoscopie">
<div class="lab">Indication (Baveno VIII, 5.5)</div><p>Trouble de la vigilance ou hématémèse active.</p>
<div class="lab">Justification</div><p>Le patient ne protège plus ses voies aériennes ; l’inhalation de sang ou de liquide gastrique provoque une pneumopathie, qui aggrave le pronostic.</p>
<div class="lab">Après l’endoscopie</div><p>L’extubation se fait le plus tôt possible (5.6), car la ventilation prolongée expose à l’infection et à la sédation, qui favorise l’encéphalopathie.</p></template>

<template data-pop="i85-sarcopenie" data-title="Sarcopénie du cirrhotique">
<div class="lab">Définition</div><p>Perte de masse et de force musculaires, fréquente dans la cirrhose par apport insuffisant, hypermétabolisme et inactivité.</p>
<div class="lab">Évaluation</div><p>La circonférence brachiale et la force de préhension s’évaluent aux membres supérieurs, car l’ascite et les œdèmes faussent le poids et les mesures des membres inférieurs. La masse musculaire peut aussi se mesurer sur un scanner abdominal.</p>
<div class="lab">Importance</div><p>La sarcopénie et la fragilité aggravent la survie du patient décompensé (Baveno VIII, 4.16) ; une évaluation nutritionnelle structurée est recommandée (4.17). Elles ne contre-indiquent pas à elles seules le TIPS (4.19).</p>
<div class="lab">Piège</div><p>La créatinine est basse chez le sarcopénique et surestime le débit de filtration glomérulaire.</p></template>

<template data-pop="i85-angiomes" data-title="Angiomes stellaires">
<div class="lab">Description</div><p>Artériole centrale pulsatile d’où rayonnent de fins vaisseaux ; la pression sur le centre fait disparaître la lésion, qui se recolore du centre vers la périphérie.</p>
<div class="lab">Mécanisme</div><p>Excès d’œstrogènes et de vasodilatateurs que le foie insuffisant ne dégrade plus.</p>
<div class="lab">Valeur</div><p>Ils siègent dans le territoire de la veine cave supérieure : visage, cou, thorax, membres supérieurs. Leur nombre élevé oriente vers une maladie hépatique chronique. Quelques angiomes peuvent exister pendant la grossesse ou chez l’enfant.</p></template>

<template data-pop="i85-erythrose" data-title="Érythrose palmaire">
<div class="lab">Description</div><p>Rougeur des éminences thénar et hypothénar, respectant le centre de la paume.</p>
<div class="lab">Mécanisme</div><p>Vasodilatation cutanée liée à l’excès d’œstrogènes et de monoxyde d’azote.</p>
<div class="lab">Valeur</div><p>Signe d’insuffisance hépatocellulaire, non spécifique : elle existe aussi pendant la grossesse, dans l’hyperthyroïdie et la polyarthrite rhumatoïde.</p></template>

<template data-pop="i85-asterixis" data-title="Astérixis">
<div class="lab">Technique</div><p>Le patient tend les bras, poignets en extension, doigts écartés, pendant au moins 30 secondes. L’examinateur observe des pertes brèves et irrégulières du tonus, suivies d’un retour en extension.</p>
<div class="lab">Signification</div><p>Il traduit une encéphalopathie métabolique ; dans la cirrhose, il marque habituellement une encéphalopathie de grade II, donc une décompensation.</p>
<div class="lab">Piège</div><p>Il n’est pas spécifique : l’urémie, l’hypercapnie et certains médicaments le provoquent aussi.</p></template>

<template data-pop="i85-splenomegalie" data-title="Splénomégalie">
<div class="lab">Technique</div><p>Palpation sous le rebord costal gauche en inspiration profonde, patient en décubitus dorsal puis en décubitus latéral droit ; percussion de l’espace de Traube.</p>
<div class="lab">Mécanisme</div><p>La congestion portale et l’hyperplasie de la pulpe rouge agrandissent la rate. Celle-ci séquestre les plaquettes, d’où la thrombopénie.</p>
<div class="lab">Valeur</div><p>C’est le signe d’hypertension portale le plus fréquent. Une rate non palpable ne l’exclut pas : l’échographie la mesure.</p></template>

<template data-pop="i85-ascite" data-title="Ascite : examen clinique">
<div class="lab">Technique</div><p>Matité déclive des flancs, mobile lorsque le patient se tourne sur le côté ; signe du flot dans les ascites abondantes.</p>
<div class="lab">Valeur</div><p>La matité des flancs apparaît à partir d’environ 1,5 L. Une ascite plus faible ne se voit qu’à l’échographie ; celle-ci ne constitue pas une décompensation selon Baveno VIII (3.4).</p>
<div class="lab">Conséquence pratique</div><p>Toute ascite d’un patient hospitalisé pour décompensation fait l’objet d’une ponction diagnostique pour exclure une infection.</p></template>

<template data-pop="i85-cvc" data-title="Circulation veineuse collatérale abdominale">
<div class="lab">Description</div><p>Veines sous-cutanées visibles sur l’abdomen.</p>
<div class="lab">Sens du flux</div><p>Le médecin vide un segment de veine entre deux doigts, puis relâche un doigt pour voir dans quel sens elle se remplit. Dans l’hypertension portale, le flux s’éloigne de l’ombilic, vers le haut au-dessus et vers le bas au-dessous. Une obstruction de la veine cave inférieure donne au contraire un flux ascendant dans les veines du bas-ventre.</p>
<div class="lab">Valeur</div><p>La tête de méduse, avec des veines rayonnant autour de l’ombilic, est rare mais très spécifique d’une recanalisation de la veine paraombilicale.</p><figure><img src="images/cardiologie/i85_caput_medusae_scanner.gif" alt="Scanner sagittal montrant une tête de méduse" width="400" height="501" loading="lazy" decoding="async"><figcaption>Veine paraombilicale reperméabilisée (tête de méduse) au scanner : le sang portal rejoint les veines de la paroi, puis les veines caves. Hellerhoff, Wikimedia Commons, CC BY-SA 3.0.</figcaption></figure></template>

<template data-pop="i85-cruveilhier" data-title="Souffle de Cruveilhier-Baumgarten">
<div class="lab">Description</div><p>Souffle veineux continu entendu près de l’ombilic ou de l’appendice xiphoïde, parfois associé à un frémissement.</p>
<div class="lab">Mécanisme</div><p>Flux rapide dans une veine paraombilicale recanalisée et dilatée.</p>
<div class="lab">Valeur</div><p>Signe rare mais spécifique d’une hypertension portale intrahépatique avec perméabilité de la branche gauche de la veine porte.</p></template>

<template data-pop="i85-varicocele-ex" data-title="Examen d’une varicocèle">
<div class="lab">Technique</div><p>Examen debout dans une pièce chaude, scrotum détendu. Inspection, puis palpation du cordon au repos et pendant une manœuvre de Valsalva ; examen comparatif des deux testicules, dont le volume est estimé.</p>
<div class="lab">Signes</div><p>Masse molle de veines tortueuses au-dessus du testicule, augmentant en Valsalva et se vidant en décubitus. Grade 1 : palpable seulement en Valsalva ; grade 2 : palpable au repos ; grade 3 : visible au repos (EAU 2026).</p>
<div class="lab">Signes d’alerte</div><p>Varicocèle droite isolée, varicocèle qui ne se vide pas en décubitus, apparition brutale chez un homme âgé : imagerie abdominale.</p></template>

<template data-pop="i85-sublinguale" data-title="Varices sublinguales">
<div class="lab">Description</div><p>Veines bleu violacé, dilatées et tortueuses, à la face ventrale de la langue, souvent bilatérales ; elles s’effacent à la pression.</p>
<div class="lab">Associations</div><p>Âge, tabac, hypertension, maladie cardiovasculaire et prothèse dentaire (méta-analyse de James et al., 2024). L’association avec la cardiopathie ischémique a été retrouvée de façon prospective (Bergh et al., 2023), sans preuve de causalité.</p>
<div class="lab">Conduite</div><p>Aucun traitement de la varice ; mesure de la pression artérielle et recherche des facteurs de risque. Une lésion unique, ferme, douloureuse peut correspondre à une varice thrombosée ; une lésion qui ne s’efface pas fait évoquer une malformation veineuse, un hémangiome ou un sarcome de Kaposi.</p></template>

<template data-pop="i85-clou" data-title="Clou plaquettaire blanc">
<div class="lab">Description</div><p>Petite saillie blanchâtre à la surface d’une varice, correspondant à un caillot fibrino-plaquettaire qui obture le point de rupture.</p>
<div class="lab">Valeur</div><p>C’est un stigmate de saignement récent : il suffit, chez un patient qui a saigné, à attribuer l’hémorragie à cette varice (Baveno VIII, 5.1).</p>
<div class="lab">Conséquence pratique</div><p>La varice porteuse du clou est ligaturée en priorité.</p></template>

<template data-pop="i85-endoscopie" data-title="Endoscopie digestive haute dans l’hypertension portale">
<div class="lab">Indications</div><p>Hémorragie digestive haute chez un patient porteur d’une hépatopathie (dans les 12 heures, Baveno VIII, 5.18) ; dépistage des varices chez le patient qui ne peut pas recevoir de bêtabloquant (1.19) ; séances de ligature jusqu’à l’éradication puis surveillance.</p>
<div class="lab">Ce qu’elle décrit</div><p>Taille des varices après insufflation, signes rouges, varices gastriques selon Sarin, gastropathie, ectasies antrales, lésion qui saigne.</p>
<div class="lab">Valeur</div><p>Examen de référence du diagnostic de rupture et premier temps du traitement. Elle ne mesure pas l’hypertension portale et ne remplace pas le bêtabloquant.</p>
<div class="lab">Complications</div><p>Inhalation, ulcère de ligature à une ou deux semaines, embolie de colle après une injection de cyanoacrylate.</p></template>

<template data-pop="i85-signes-rouges" data-title="Signes rouges des varices">
<div class="lab">Description</div><p>Zébrures rouges longitudinales, taches rouge cerise, taches hématocystiques en forme de bulle de sang à la surface d’une varice.</p>
<div class="lab">Mécanisme</div><p>Microvaisseaux dilatés et paroi amincie : la tension de la paroi y est maximale selon la loi de Laplace.</p>
<div class="lab">Valeur</div><p>Ils classent la varice à haut risque, même si elle est petite.</p><figure><img src="images/cardiologie/i85_varices_signes_rouges_endoscopie.gif" alt="Varices œsophagiennes avec zébrures rouges à la gastroscopie" width="315" height="286" loading="lazy" decoding="async"><figcaption>Zébrures rouges sur des varices œsophagiennes : la paroi y est la plus fine, la tension pariétale y est donc maximale. Samir, Wikimedia Commons, domaine public.</figcaption></figure></template>

<template data-pop="i85-sarin" data-title="Classification de Sarin des varices gastriques">
<div class="lab">Types</div><p>GOV1 : prolongement d’une varice œsophagienne le long de la petite courbure. GOV2 : prolongement vers le fundus. IGV1 : varice isolée du fundus. IGV2 : varice isolée ailleurs dans l’estomac.</p>
<div class="lab">Intérêt</div><p>Baveno VIII la recommande pour harmoniser les comptes rendus, stratifier le risque et choisir le traitement (5.38). Les varices IGV1 saignent le plus souvent et récidivent le plus.</p>
<div class="lab">Conséquence pratique</div><p>GOV1 se traite comme l’œsophage, par ligature. GOV2 et IGV1 relèvent de la colle, de l’échoendoscopie et du TIPS. Des IGV1 isolées imposent la recherche d’une thrombose splénique.</p></template>

<template data-pop="i85-mallory" data-title="Syndrome de Mallory-Weiss">
<div class="lab">Définition</div><p>Déchirure longitudinale de la muqueuse de la jonction œsogastrique, provoquée par des efforts de vomissement.</p>
<div class="lab">Présentation</div><p>Vomissements d’abord non sanglants, puis sanglants, souvent après une consommation importante d’alcool : le contexte ressemble donc à celui de la rupture de varices.</p>
<div class="lab">Évolution</div><p>Le saignement s’arrête spontanément dans la grande majorité des cas ; un traitement endoscopique est réservé au saignement actif. Chez un cirrhotique, la déchirure peut saigner davantage à cause de l’hypertension portale.</p></template>

<template data-pop="i85-gastropathie" data-title="Gastropathie d’hypertension portale">
<div class="lab">Description</div><p>Muqueuse gastrique, surtout fundique, d’aspect en mosaïque, avec parfois des taches rouges ; elle traduit une congestion des capillaires et des veinules de la muqueuse.</p>
<div class="lab">Clinique</div><p>Saignement surtout chronique, révélé par une anémie ferriprive ; le saignement aigu est rare. Un saignement occulte de gastropathie ne compte pas comme décompensation (Baveno VIII, 3.4).</p>
<div class="lab">Traitement</div><p>Baisse de la pression portale par bêtabloquant non sélectif, fer ; TIPS en cas de saignement sévère ou réfractaire (5.44). Les traitements endoscopiques sont peu efficaces.</p></template>

<template data-pop="i85-gave" data-title="Ectasies vasculaires antrales">
<div class="lab">Description</div><p>Stries rouges convergeant vers le pylore, d’aspect « en pastèque », ou forme diffuse ponctuée. Elles siègent dans l’antre.</p>
<div class="lab">Différence avec la gastropathie</div><p>Elles ne dépendent pas de la pression portale : le bêtabloquant et le TIPS ne les traitent pas. Elles s’observent aussi en dehors de la cirrhose, par exemple dans la sclérodermie et l’insuffisance rénale chronique.</p>
<div class="lab">Traitement</div><p>Si elles imposent des transfusions répétées, la ligature est recommandée plutôt que la coagulation au plasma d’argon, car elle éradique plus souvent en moins de séances (Baveno VIII, 5.43).</p></template>

<template data-pop="i85-rectales" data-title="Varices rectales et hémorroïdes">
<div class="lab">Varices rectales</div><p>Collatérales portosystémiques entre la veine rectale supérieure, tributaire de la veine mésentérique inférieure, et les veines rectales moyennes et inférieures, tributaires de la veine iliaque interne. Elles se codent I86.82.</p>
<div class="lab">Hémorroïdes</div><p>Coussinets vasculaires normaux du canal anal, dont la pathologie relève d’une autre catégorie. Elles ne sont pas plus fréquentes dans l’hypertension portale.</p>
<div class="lab">Conséquence pratique</div><p>Une rectorragie abondante chez un cirrhotique impose une rectoscopie ou une coloscopie à la recherche de varices rectales ; leur hémorragie se traite par voie endovasculaire ou endoscopique (Baveno VIII, 5.42).</p></template>

<template data-pop="i85-echo-doppler" data-title="Échographie Doppler abdominale">
<div class="lab">Normal</div><p>Foie aux contours lisses, flux portal hépatopète, rate de moins de 12 à 13 cm de grand axe, absence d’ascite.</p>
<div class="lab">Signes d’hypertension portale</div><p>Splénomégalie, ascite, flux portal hépatofuge ou ralenti, recanalisation de la veine paraombilicale, collatérales. Un diamètre de la veine porte supérieur à 13 mm est un signe classique, peu sensible.</p>
<div class="lab">Autres apports</div><p>Recherche d’une thrombose porte, d’un nodule de carcinome hépatocellulaire, dépistage semestriel du CHC.</p>
<div class="lab">Limites</div><p>Examen dépendant de l’opérateur, gêné par l’obésité et les gaz ; une thrombose suspectée se confirme au scanner avec injection.</p></template>

<template data-pop="i85-doppler-scrotal" data-title="Écho-Doppler scrotal de la varicocèle">
<div class="lab">Technique</div><p>Examen couché puis debout, au repos et en Valsalva ; mesure du diamètre des veines du plexus, du reflux et du volume des deux testicules.</p>
<div class="lab">Critères (EAU 2026)</div><p>Une veine de plus de 3 mm debout et en Valsalva et un reflux de plus de deux secondes corrèlent avec une varicocèle cliniquement significative. Le volume testiculaire se calcule par la formule de Lambert (longueur × largeur × hauteur × 0,71).</p>
<div class="lab">Indications</div><p>Examen clinique douteux, spermogramme anormal persistant après traitement, varicocèle droite isolée (avec imagerie abdominale).</p></template>

<template data-pop="i85-child" data-title="Score de Child-Pugh">
<div class="lab">Calcul</div><p>Cinq éléments cotés de 1 à 3 : encéphalopathie (absente 1, grade 1–2 : 2, grade 3–4 : 3) ; ascite (absente 1, légère 2, modérée à abondante 3) ; bilirubine (&lt; 34 µmol/L : 1, 34–50 : 2, &gt; 50 : 3) ; albumine (&gt; 35 g/L : 1, 28–35 : 2, &lt; 28 : 3) ; INR (&lt; 1,7 : 1, 1,7–2,3 : 2, &gt; 2,3 : 3).</p>
<div class="lab">Classes</div><p>A : 5–6 points ; B : 7–9 ; C : 10–15.</p>
<div class="lab">Exemple</div><p>M. B. : bilirubine 52 µmol/L (3), albumine 27 g/L (3), INR 1,6 (1), ascite légère (2), pas d’encéphalopathie (1) : 10 points, classe C10.</p>
<div class="lab">Usage</div><p>Pronostic de l’hémorragie, critère du TIPS préemptif (C 10–13, B &gt; 7 avec saignement actif), contre-indications médicamenteuses. Limites : l’ascite et l’encéphalopathie sont cotées subjectivement, et l’albumine dépend de la perfusion d’albumine.</p></template>

<template data-pop="i85-meld" data-title="Score MELD">
<div class="lab">Calcul</div><p>MELD = 3,78 × ln(bilirubine en mg/dL) + 11,2 × ln(INR) + 9,57 × ln(créatinine en mg/dL) + 6,43. Pour convertir, la bilirubine en µmol/L se divise par 17,1 et la créatinine en µmol/L par 88,4. Les valeurs inférieures à 1 sont arrondies à 1.</p>
<div class="lab">Exemple</div><p>M. B. : bilirubine 3,04 mg/dL, INR 1,6, créatinine 1,11 mg/dL : MELD ≈ 17.</p>
<div class="lab">Usage</div><p>Prédit la mortalité à trois mois, ordonne la liste de transplantation et entre, avec ses variantes intégrant le sodium, dans les facteurs de mortalité à six semaines de l’hémorragie variceuse (Baveno VIII, 5.17).</p></template>

<template data-pop="i85-codage" data-title="Codage CIM-10-GM des varices liées à une maladie du foie">
<div class="lab">Règle</div><p>Les varices œsophagiennes et gastriques survenant au cours d’une maladie du foie ou d’une schistosomiase sont exclues de I85 et de I86.4. Elles se codent par le système croix-astérisque.</p>
<div class="lab">Codes</div><p>La maladie causale porte la croix : maladie alcoolique du foie (K70.-†), par exemple cirrhose alcoolique K70.3†, ou autre cirrhose (K74.-†), par exemple K74.6†. La manifestation porte l’astérisque : I98.2* pour des varices sans hémorragie, I98.3* pour des varices hémorragiques.</p>
<div class="lab">Exemple</div><p>M. B., cirrhose alcoolique avec rupture de varices : K70.3† et I98.3*. Une thrombose splénique avec varices fundiques sans maladie du foie se code I86.4.</p>
<div class="lab">Source</div><p>CIM-10-GM 2024 (BfArM), catégories I85, I86 et I98, telles que reproduites dans le catalogue de l’atlas.</p></template>

<template data-pop="i85-eau" data-title="Recommandations de l’EAU sur la varicocèle">
<div class="lab">Source</div><p>Association européenne d’urologie, Guidelines on Sexual and Reproductive Health, édition 2026, chapitre sur l’infertilité masculine, section varicocèle, consultée le 8.10.2026 sur uroweb.org.</p>
<div class="lab">Recommandations principales</div><p>Traiter l’homme infertile porteur d’une varicocèle clinique, d’un spermogramme anormal et d’une infertilité autrement inexpliquée, si la partenaire a une bonne réserve ovarienne (forte). Ne pas traiter la varicocèle infraclinique ni l’homme dont le spermogramme est normal (forte). Chez l’adolescent, proposer une intervention si le testicule reste plus petit de plus de 2 mL ou de 20 % à deux examens à six mois d’intervalle (forte).</p>
<div class="lab">Limites</div><p>La fragmentation de l’ADN spermatique et l’hypogonadisme sont des indications discutées, de faible niveau de preuve.</p></template>

<template data-pop="i85-svp" data-title="Classification SVP des troubles veineux pelviens">
<div class="lab">Définition</div><p>Classification proposée en 2021 par un groupe international de l’American Vein and Lymphatic Society. Elle décrit chaque patiente selon trois domaines : symptômes (S), varices (V) et physiopathologie (P), cette dernière précisant l’anatomie, l’hémodynamique et l’étiologie.</p>
<div class="lab">Intérêt</div><p>Elle remplace les appellations historiques, comme syndrome de congestion pelvienne, de casse-noix ou de May-Thurner, qui ne décrivaient chacune qu’une partie du problème. Elle se combine avec la classification CEAP lorsque les varices des membres ont une origine pelvienne.</p>
<div class="lab">Source</div><p>Meissner et al., <i>Journal of Vascular Surgery: Venous and Lymphatic Disorders</i> 2021;9:568–584.</p></template>

<template data-pop="i85-maythurner" data-title="Compressions veineuses pelviennes">
<div class="lab">Compression iliaque</div><p>La veine iliaque commune gauche passe sous l’artère iliaque commune droite, qui peut la comprimer contre le rachis. La compression favorise la thrombose veineuse profonde gauche et l’hypertension veineuse pelvienne : c’est le syndrome de May-Thurner.</p>
<div class="lab">Compression de la veine rénale gauche</div><p>La veine rénale gauche peut être comprimée entre l’aorte et l’artère mésentérique supérieure. La pression monte dans la veine rénale et dans la veine gonadique gauche, qui sert de voie de dérivation. Elle peut donner une hématurie, une douleur du flanc, une varicocèle gauche ou des varices pelviennes.</p>
<div class="lab">Conduite</div><p>Ces compressions sont fréquentes à l’imagerie chez des sujets asymptomatiques ; elles ne justifient un traitement que lorsqu’elles expliquent des symptômes, après discussion en équipe spécialisée.</p></template>
