<!-- ===== FENÊTRES I85 : notions fondamentales et hémodynamique ===== -->
<template data-pop="i85-ohm" data-title="Loi d’Ohm appliquée à la circulation portale">
<div class="lab">Définition</div><p>Le gradient de pression entre deux points d’un circuit égale le débit multiplié par la résistance : ΔP = Q × R. Pour le foie, ΔP est le gradient entre la veine porte et les veines sus-hépatiques, Q le débit portal et R la résistance intrahépatique.</p>
<div class="lab">Exemple chiffré</div><p>Un débit portal de 1 L/min traversant une résistance normale donne un gradient d’environ 4 mmHg. Si la cirrhose double la résistance, le gradient passe à 8 mmHg. Si la vasodilatation splanchnique augmente ensuite le débit de 50 %, le gradient atteint 12 mmHg, seuil au-dessus duquel les varices peuvent saigner.</p>
<div class="lab">Conséquence pratique</div><p>Chaque traitement agit sur un terme. Le bêtabloquant non sélectif, la terlipressine et l’octréotide réduisent Q. Le carvédilol réduit aussi la part dynamique de R. Le TIPS court-circuite R. La transfusion et le remplissage excessifs augmentent Q, ce qui explique la récidive sous stratégie libérale.</p>
<div class="lab">Limite</div><p>La loi suppose un écoulement stationnaire dans un tube rigide ; les vaisseaux réels sont élastiques et le débit varie avec les repas. Elle reste un modèle qualitatif fiable pour raisonner.</p></template>

<template data-pop="i85-laplace" data-title="Tension pariétale de la varice (loi de Laplace)">
<div class="lab">Définition</div><p>La tension de la paroi d’une varice est proportionnelle à la pression transmurale et au rayon, et inversement proportionnelle à l’épaisseur de la paroi : T = (P intravariqueuse − P œsophagienne) × r / e.</p>
<div class="lab">Mécanisme de la rupture</div><p>La varice se rompt lorsque T dépasse la résistance élastique de la paroi. Une varice de 8 mm de rayon subit, à pression égale, une tension double de celle d’une varice de 4 mm. Une paroi deux fois plus mince double encore la tension. Les signes rouges marquent ces zones amincies.</p>
<div class="lab">Corrélation clinique</div><p>Les trois facteurs de risque de rupture découlent de la formule : HVPG élevé (pression), grandes varices (rayon), signes rouges (épaisseur). Le bêtabloquant réduit P, la ligature supprime r, et le TIPS abaisse P durablement.</p>
<div class="lab">Piège</div><p>Une petite varice avec des signes rouges chez un patient en classe C peut être à haut risque, alors qu’elle paraît anodine par sa seule taille.</p></template>

<template data-pop="i85-anastomoses" data-title="Anastomoses portosystémiques">
<div class="lab">Définition</div><p>Les anastomoses portosystémiques sont des connexions veineuses préexistantes entre le territoire porte et le territoire cave. À l’état normal, elles sont fines et peu perfusées ; l’hypertension portale les dilate.</p>
<div class="lab">Les six sites</div><p>À l’œsophage inférieur, la veine gastrique gauche se draine vers les veines azygos et forme les varices œsophagiennes. Au fundus, les veines gastriques courtes forment les varices gastriques. Sur la paroi abdominale, la veine paraombilicale rejoint les veines épigastriques et crée la circulation collatérale et la tête de méduse. Au rectum, la veine rectale supérieure rejoint les veines rectales moyennes et inférieures et forme les varices rectales. Dans le rétropéritoine, les veines de Retzius et la région splénorénale ouvrent des shunts spontanés. Enfin, les veines de Sappey relient la zone nue du foie au diaphragme.</p>
<div class="lab">Conséquence pratique</div><p>Un shunt splénorénal ou gastrorénal volumineux décomprime peu la veine porte mais favorise l’encéphalopathie, car le sang intestinal contourne le foie. Il conditionne aussi le traitement des varices fundiques.</p></template>

<template data-pop="i85-jonction" data-title="Zones veineuses de la jonction œsogastrique">
<div class="lab">Description</div><p>Au niveau de la jonction œsogastrique, les veines s’organisent en zones superposées : une zone gastrique, une zone palissadique d’environ 2 à 3 cm au-dessus du cardia, une zone de perforantes et une zone tronculaire plus haute.</p>
<div class="lab">Pourquoi la zone palissadique saigne</div><p>Dans cette zone, les veines sont longitudinales, parallèles et situées dans la lamina propria, juste sous l’épithélium. Elles sont superficielles et peu soutenues ; la pression les dilate facilement et leur paroi est mince. Elles forment aussi une zone de résistance où le flux alterne, ce qui favorise la turbulence.</p>
<div class="lab">Conséquence pratique</div><p>L’endoscopiste ligature d’abord au niveau du cardia, puis remonte en spirale. Une varice qui saigne se situe le plus souvent dans les 5 cm distaux de l’œsophage.</p></template>

<template data-pop="i85-capillarisation" data-title="Capillarisation des sinusoïdes">
<div class="lab">Définition</div><p>La capillarisation est la transformation du sinusoïde hépatique fenestré en un capillaire continu, doté d’une membrane basale et privé de ses pores ; elle freine les échanges et augmente la résistance au flux portal.</p>
<div class="lab">Mécanisme</div><p>Les cellules étoilées activées déposent du collagène et des composants de membrane basale dans l’espace de Disse ; les cellules endothéliales perdent leurs fenestrations. Le passage du plasma vers les hépatocytes diminue et la lumière se rétrécit.</p>
<div class="lab">Conséquences</div><p>La résistance au flux portal augmente, ce qui contribue à l’hypertension portale. Les échanges entre le sang et l’hépatocyte se réduisent, ce qui aggrave l’insuffisance hépatocellulaire. La fibrose peut régresser partiellement lorsque la cause est supprimée.</p></template>

<template data-pop="i85-stellaires" data-title="Cellules étoilées du foie">
<div class="lab">Définition</div><p>Les cellules étoilées sont des cellules mésenchymateuses situées dans l’espace de Disse. À l’état quiescent, elles stockent la vitamine A dans des gouttelettes lipidiques ; activées, elles deviennent des myofibroblastes contractiles qui produisent la fibrose.</p>
<div class="lab">Activation</div><p>Une agression chronique libère des signaux, notamment le TGF-β et le PDGF, qui transforment les cellules étoilées en myofibroblastes. Ceux-ci prolifèrent, produisent du collagène de types I et III et acquièrent un appareil contractile.</p>
<div class="lab">Corrélation clinique</div><p>Leur contraction, stimulée par l’endothéline 1 et favorisée par le déficit en monoxyde d’azote, forme la part dynamique de la résistance intrahépatique. Le carvédilol, par son blocage alpha-1, et le traitement de la cause réduisent cette contraction.</p></template>

<template data-pop="i85-translocation" data-title="Translocation bactérienne">
<div class="lab">Définition</div><p>La translocation bactérienne est le passage de bactéries vivantes ou de leurs produits, comme les lipopolysaccharides, de la lumière intestinale vers les ganglions mésentériques et la circulation.</p>
<div class="lab">Mécanisme dans la cirrhose</div><p>Le transit ralentit, les bactéries prolifèrent dans l’intestin grêle, les jonctions serrées se relâchent et l’immunité muqueuse baisse. L’hémorragie ajoute l’hypoperfusion de la muqueuse.</p>
<div class="lab">Conséquences</div><p>Les produits bactériens stimulent la production de cytokines et de monoxyde d’azote, ce qui aggrave la vasodilatation splanchnique et la pression portale. Les bactéries causent des infections, dont la péritonite bactérienne spontanée.</p>
<div class="lab">Conséquence pratique</div><p>Toute hémorragie variceuse reçoit une antibioprophylaxie dès l’admission, en général par ceftriaxone.</p></template>

<template data-pop="i85-hyperdynamique" data-title="Circulation hyperdynamique de la cirrhose">
<div class="lab">Définition</div><p>La circulation hyperdynamique associe un débit cardiaque élevé, des résistances vasculaires systémiques basses et une pression artérielle basse ou normale basse.</p>
<div class="lab">Mécanisme</div><p>L’excès de vasodilatateurs dans le territoire splanchnique réduit le volume sanguin efficace. Le système rénine-angiotensine-aldostérone, le système sympathique et l’hormone antidiurétique s’activent pour maintenir la pression. Le rein retient le sodium et l’eau.</p>
<div class="lab">Conséquences cliniques</div><p>L’ascite, l’hyponatrémie de dilution et le syndrome hépatorénal découlent de cette séquence. L’hyperdébit splanchnique entretient l’hypertension portale.</p>
<div class="lab">Conséquence pratique</div><p>La pression artérielle de ces patients est déjà basse : un bêtabloquant doit être titré sur la pression systolique et la pression moyenne.</p></template>

<template data-pop="i85-hemostase" data-title="Hémostase rééquilibrée du cirrhotique">
<div class="lab">Principe</div><p>Le foie malade produit moins de facteurs procoagulants (II, V, VII, IX, X) et moins d’inhibiteurs (protéine C, antithrombine). Le facteur VIII et le facteur de von Willebrand augmentent, alors que la protéase ADAMTS13 diminue. Les plaquettes baissent, mais leur adhésion est soutenue par le facteur de von Willebrand.</p>
<div class="lab">Pourquoi l’INR trompe</div><p>L’INR explore seulement la voie procoagulante, sans tenir compte des anticoagulants naturels ni des plaquettes. Il s’allonge sans que le risque de saignement augmente dans la même proportion. Le patient peut aussi faire une thrombose porte.</p>
<div class="lab">Conséquences pratiques</div><p>Le plasma frais congelé n’est pas recommandé pendant une hémorragie variceuse ; il augmente le volume et la pression portale (Baveno VIII, 5.23). Une anticoagulation reste possible lorsqu’elle est indiquée.</p></template>

<template data-pop="i85-encephalopathie" data-title="Encéphalopathie hépatique">
<div class="lab">Définition</div><p>L’encéphalopathie hépatique est une dysfonction cérébrale due à l’insuffisance hépatique et aux shunts portosystémiques ; elle va de troubles cognitifs minimes au coma.</p>
<div class="lab">Mécanisme</div><p>L’ammoniac produit dans l’intestin n’est plus éliminé par le foie. Les astrocytes le transforment en glutamine, qui provoque un œdème astrocytaire. L’inflammation, l’infection et certaines molécules sédatives aggravent la dysfonction.</p>
<div class="lab">Grades (West Haven)</div><p>Au grade I, le patient présente des troubles de l’attention et une inversion du rythme veille-sommeil. Au grade II, il est désorienté dans le temps et présente un astérixis. Au grade III, il est somnolent et franchement confus. Au grade IV, il est dans le coma. Le grade II ou plus définit une encéphalopathie manifeste, donc une décompensation.</p>
<div class="lab">Lien avec l’hémorragie</div><p>Le sang digéré est une charge protéique massive. Le lactulose prévient l’encéphalopathie en accélérant le transit et en acidifiant le côlon. Un patient de grade III ou IV est intubé avant l’endoscopie.</p></template>

<template data-pop="i85-pampiniforme" data-title="Plexus pampiniforme et veines gonadiques">
<div class="lab">Anatomie</div><p>Le plexus pampiniforme est un réseau de veines entourant l’artère testiculaire dans le cordon spermatique. Il se réunit en veine testiculaire au niveau de l’anneau inguinal profond. La veine testiculaire gauche se jette à angle droit dans la veine rénale gauche, la droite obliquement dans la veine cave inférieure.</p>
<div class="lab">Fonction</div><p>Le plexus refroidit le sang artériel destiné au testicule par échange de chaleur à contre-courant. La spermatogenèse exige une température inférieure de 2 à 3 °C environ à la température centrale.</p>
<div class="lab">Corrélation clinique</div><p>Le reflux dans une veine testiculaire incompétente dilate le plexus, réchauffe le testicule et peut altérer la spermatogenèse. La disposition anatomique explique la prédominance gauche de la varicocèle.</p></template>

<template data-pop="i85-psvd" data-title="Maladie vasculaire porto-sinusoïdale">
<div class="lab">Définition</div><p>La maladie vasculaire porto-sinusoïdale est une maladie vasculaire du foie caractérisée par des lésions des veinules portales ou des sinusoïdes, sans cirrhose. Elle est aussi appelée fibrose portale non cirrhotique.</p>
<div class="lab">Présentation</div><p>Hypertension portale parfois sévère, avec varices et splénomégalie, alors que la fonction hépatique est conservée et que l’élasticité hépatique est normale ou peu élevée. Le HVPG est souvent normal ou peu élevé, car l’obstacle est présinusoïdal.</p>
<div class="lab">Diagnostic</div><p>Il exige une biopsie hépatique de qualité. Baveno VIII propose un score combinant les lésions histologiques et les signes d’hypertension portale.</p>
<div class="lab">Conséquence pratique</div><p>Une élasticité inférieure à 10 kPa chez un patient porteur de varices doit faire évoquer cette maladie et adresser le patient à un centre des maladies vasculaires du foie (Baveno VIII, 1.6).</p></template>

<template data-pop="i85-thrombose-splenique" data-title="Thrombose de la veine splénique">
<div class="lab">Définition</div><p>La thrombose de la veine splénique est une occlusion de cette veine, le plus souvent secondaire à une pancréatite aiguë ou chronique, plus rarement à un cancer du pancréas, car la veine longe la face postérieure du pancréas.</p>
<div class="lab">Mécanisme</div><p>Le sang de la rate ne rejoint plus la veine porte. Il reflue par les veines gastriques courtes et gastro-épiploïques vers le fundus, puis vers la veine gastrique gauche. On parle d’hypertension portale gauche, car seule la moitié gauche du territoire porte est sous pression.</p>
<div class="lab">Présentation</div><p>Varices fundiques isolées (IGV1), sans varices œsophagiennes, avec splénomégalie et foie normal. La pression portale et le HVPG sont normaux.</p>
<div class="lab">Conséquence pratique</div><p>Le bêtabloquant et le TIPS ne traitent pas cette situation. Le traitement du saignement vise la veine splénique ; la splénectomie ou l’embolisation de l’artère splénique sont les options décrites, décidées en centre. Le codage est I86.4.</p></template>

<template data-pop="i85-cacld" data-title="Maladie hépatique chronique avancée compensée">
<div class="lab">Définition (Baveno VIII)</div><p>Terme qui désigne le continuum entre fibrose sévère et cirrhose chez un patient sans décompensation. Il repose sur l’élasticité hépatique : &lt; 10 kPa l’exclut, 10 à 15 kPa la suggère, &gt; 15 kPa la rend très probable.</p>
<div class="lab">Pourquoi ce terme</div><p>L’élastographie ne distingue pas avec certitude la fibrose sévère de la cirrhose. Le terme identifie au lit du patient ceux qui risquent une hypertension portale significative et une décompensation, indépendamment du stade histologique.</p>
<div class="lab">Conséquence pratique</div><p>Le patient est adressé à un hépatologue (1.7), les tests non invasifs sont répétés chaque année (1.9) et l’on recherche une hypertension portale cliniquement significative.</p></template>

<template data-pop="i85-hvpg" data-title="Gradient de pression veineuse hépatique (HVPG)">
<div class="lab">Définition</div><p>Différence entre la pression sus-hépatique bloquée, qui reflète la pression sinusoïdale, et la pression sus-hépatique libre. Il estime le gradient entre la veine porte et la veine cave.</p>
<div class="lab">Technique</div><p>Le radiologue cathétérise par voie jugulaire interne avec un cathéter à ballonnet occlusif et vérifie l’occlusion par une petite injection de contraste. Il attend une stabilisation d’au moins une minute et triple les mesures ; la sédation reste légère au plus, car une sédation profonde fausse les pressions.</p>
<div class="lab">Valeurs</div><p>Le gradient normal vaut 1 à 5 mmHg. On parle d’hypertension portale au-delà de 5 mmHg, d’hypertension cliniquement significative à 10 mmHg ou plus et de seuil de rupture à 12 mmHg. Le risque chirurgical devient élevé à 16 mmHg ou plus, et le risque pendant l’hémorragie à 20 mmHg ou plus.</p>
<div class="lab">Limites</div><p>Il ne détecte pas l’obstacle présinusoïdal ou préhépatique et peut sous-estimer le gradient dans la MASLD. Il est invasif et réservé aux centres ; les tests non invasifs le remplacent dans la décision courante.</p></template>

<template data-pop="i85-regle5" data-title="Règle des 5 de l’élasticité hépatique">
<div class="lab">Énoncé (Baveno VIII, 1.8)</div><p>Les valeurs de 10, 15, 20 et 25 kPa marquent des risques relatifs croissants de décompensation et de décès d’origine hépatique, quelle que soit la cause de la maladie.</p>
<div class="lab">Mode d’emploi</div><p>La règle sert à communiquer un risque, pas à poser une indication isolée. Un patient passant de 14 à 22 kPa en deux ans voit son risque augmenter, ce qui justifie une réévaluation de l’hypertension portale.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>Retenir « 10-15-20-25, chaque palier de 5 kPa augmente le risque » aide à situer un patient ; les seuils décisionnels restent ceux du tableau de l’îlot 7.</p></template>

<template data-pop="i85-anticipate" data-title="Modèle ANTICIPATE">
<div class="lab">Définition</div><p>Modèle statistique qui estime la probabilité d’une hypertension portale cliniquement significative à partir de l’élasticité hépatique et des plaquettes. Une version adaptée existe pour les patients atteints de MASLD et obèses (IMC ≥ 30 kg/m²).</p>
<div class="lab">Seuil</div><p>Une probabilité estimée ≥ 75 % établit le diagnostic selon Baveno VIII (1.16 a).</p>
<div class="lab">Intérêt</div><p>Il évite d’appliquer chez l’obèse le seuil de 25 kPa, que l’élastographie y atteint plus souvent sans hypertension portale significative. Le calcul se fait avec un calculateur validé.</p></template>

<template data-pop="i85-elastographie" data-title="Élastographie impulsionnelle à vibration contrôlée">
<div class="lab">Principe</div><p>Une sonde posée dans un espace intercostal droit génère une vibration ; l’onde de cisaillement traverse le foie et sa vitesse est mesurée par ultrasons. La vitesse augmente avec la rigidité, exprimée en kPa.</p>
<div class="lab">Conditions de validité</div><p>Le patient doit être à jeun (Baveno VIII, 1.4), car le repas augmente le flux portal et la rigidité mesurée. L’opérateur obtient au moins dix mesures valides avec une dispersion faible et utilise la sonde adaptée chez l’obèse.</p>
<div class="lab">Faux positifs</div><p>Plusieurs situations faussent la mesure vers le haut : l’hépatite aiguë, les transaminases élevées, la cholestase, la congestion cardiaque, un repas récent et une consommation d’alcool récente, car l’œdème, la congestion ou l’inflammation rigidifient le foie. Ainsi, une valeur obtenue au cours d’une hépatite alcoolique aiguë ne prouve pas une cirrhose.</p>
<div class="lab">Valeur</div><p>Elle exclut une maladie avancée sous 10 kPa et, avec les plaquettes, exclut ou confirme une hypertension portale significative. L’élasticité splénique complète l’évaluation.</p></template>
