<section class="ilot" id="i51-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 74 ans est opérée d’une fracture du col du fémur. Le lendemain, elle ressent une douleur thoracique oppressive. Sa pression artérielle est de 92/60 mmHg, sa fréquence cardiaque de 108/min. L’ECG montre un sus-décalage du segment ST de V2 à V5, et la troponine T ultrasensible s’élève à 410 ng/L. La coronarographie urgente ne trouve aucune occlusion. La ventriculographie montre un apex ventriculaire gauche akinétique et dilaté, avec une base qui se contracte vigoureusement. Au quatrième jour, l’échocardiographie avec produit de contraste découvre un thrombus apical de 15 × 11 mm.</p>
<p>Ce cas réunit les trois problèmes cliniques de ce chapitre. Le premier est un <b>syndrome de Tako-tsubo</b>, qui imite un infarctus. Le deuxième est un <b>thrombus intracardiaque</b>, complication d’une paroi qui ne se contracte plus. Le troisième est la recherche d’une <b>complication mécanique</b> devant une hypotension. Quatre questions organisent le cours : <b>quelle est la cause de la dysfonction ventriculaire, la patiente est-elle en danger immédiat, faut-il anticoaguler et pour combien de temps, et quelle maladie générale peut léser le cœur ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître et traiter un thrombus du ventricule gauche, poser le diagnostic de Tako-tsubo et en éviter les pièges thérapeutiques. Il sait aussi identifier les urgences mécaniques, qui relèvent de la chirurgie, et rechercher l’atteinte cardiaque d’une maladie infectieuse ou inflammatoire.</p>
<div class="key"><b>Prérequis et renvois.</b> L’infarctus et ses complications des 28 premiers jours relèvent du cours I21 (syndromes coronariens aigus). Les cardiomyopathies relèvent du cours I42, l’insuffisance cardiaque du cours I50, les myocardites du cours I40 et les valvulopathies mitrales du cours I34. Ce chapitre ne reprend pas ces sujets. Il traite les complications qui les traversent : la <button class="w" data-k="i51-virchow">triade de Virchow appliquée au ventricule (pourquoi un thrombus se forme)</button>, la <button class="w" data-k="i51-catechol">toxicité myocardique des catécholamines (base du Tako-tsubo)</button> et la <button class="w" data-k="i51-cicatrice">cicatrisation de l’infarctus (fenêtre des ruptures)</button>.</div>
</section>

<section class="ilot" id="i51-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Ce chapitre réunit trois complications qui traversent plusieurs cardiopathies, puis l’atteinte du cœur au cours des maladies générales. Chacune se définit par une lésion précise, qui a son propre traitement.</p>
<h3>1.1 Thrombus intracardiaque</h3>
<p>Un <b>thrombus ventriculaire gauche</b> est une masse de fibrine, de globules rouges et de plaquettes accolée à l’endocarde du ventricule gauche. Il se forme surtout sur une paroi qui ne se contracte plus : apex akinétique après un infarctus antérieur, anévrisme, cardiomyopathie dilatée, Tako-tsubo. On distingue le thrombus <b>mural</b>, aplati contre la paroi, et le thrombus <b>protrusif ou mobile</b>, qui fait saillie dans la cavité. Le thrombus de l’oreillette gauche, lié à la fibrillation auriculaire et au rétrécissement mitral, est traité dans le cours I48.</p>
<h3>1.2 Le syndrome de Tako-tsubo</h3>
<p>Le <b>syndrome de Tako-tsubo</b> est une dysfonction ventriculaire gauche aiguë et transitoire. Elle touche le plus souvent l’apex et dépasse habituellement le territoire d’une seule artère coronaire. Le consensus international <button class="w" data-k="i51-intertak-crit">InterTAK de 2018 (huit critères diagnostiques)</button>, coordonné par l’Hôpital universitaire de Zurich, en fixe la définition. Le nom vient d’un piège à poulpe japonais, dont la forme rappelle le ventricule en systole : un apex dilaté et une base étroite. Le consensus distingue quatre formes selon la région sidérée : apicale, la plus fréquente, médioventriculaire, basale et focale.</p>
<h3>1.3 Complications mécaniques</h3>
<p>Les <b>complications mécaniques</b> sont des ruptures d’un myocarde nécrosé ou d’un appareil valvulaire. La <b>rupture de la paroi libre</b> ouvre le ventricule dans le péricarde ; contenue par des adhérences, elle forme un <b>faux anévrisme</b>. La <b>rupture du septum interventriculaire</b> crée une communication interventriculaire acquise. La <b>rupture d’un pilier</b> ou d’un <b>cordage</b> libère un feuillet mitral. Ces ruptures compliquent surtout la phase aiguë d’un infarctus transmural, traitée dans le cours I21 ; une communication septale, une rupture de cordage ou un faux anévrisme peuvent aussi être découverts à distance, ou survenir sans infarctus.</p>
<h3>1.4 Atteinte cardiaque des maladies générales</h3>
<p>Une maladie générale peut léser chacune des tuniques du cœur. Le tableau suivant classe ces atteintes selon la tunique touchée, car la tunique oriente l’examen et le cours de référence.</p>
<table class="t"><tr><th>Tunique atteinte</th><th>Exemples</th><th>Cours</th></tr>
<tr><td>Péricarde</td><td>Péricardite tuberculeuse, lupique ou urémique</td><td>I30</td></tr>
<tr><td>Endocarde et valves</td><td>Endocardite de <button class="w" data-k="i51-libman">Libman-Sacks (lupus)</button></td><td>I33, I34</td></tr>
<tr><td>Myocarde : inflammation</td><td>Myocardite diphtérique, de Chagas, sarcoïdosique</td><td>I40</td></tr>
<tr><td>Myocarde : infiltration ou atteinte métabolique</td><td>Amylose cardiaque, cardiopathie thyréotoxique</td><td>I42</td></tr>
<tr><td>Plusieurs tuniques à la fois</td><td>Cardite rhumatoïde, cardite à méningocoques, atteinte cardiopulmonaire de la schistosomiase</td><td>Îlot 12</td></tr></table>
<p>La lecture de ce tableau commence par la tunique atteinte. Exemple : une femme de 58 ans atteinte de polyarthrite rhumatoïde séropositive développe un épanchement péricardique et une insuffisance mitrale par nodule valvulaire ; l’atteinte touche deux tuniques et relève d’une cardite rhumatoïde. À l’inverse, une « cardiomégalie » n’est pas un diagnostic : c’est un signe radiologique, qui impose de chercher une cardiomyopathie, une valvulopathie, une hypertension ou un épanchement péricardique.</p>
<div class="key"><b>À retenir.</b> Le thrombus ventriculaire, le Tako-tsubo et les ruptures sont des lésions précises, qui ont chacune un traitement propre. L’atteinte cardiaque d’une maladie générale se classe selon la tunique touchée. Une cardiomégalie est un signe, non un diagnostic. L’îlot suivant donne la fréquence de ces situations et leur pronostic.</div>
</section>

<section class="ilot" id="i51-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les entités de ce chapitre sont rares prises isolément, mais leur pronostic est sévère. Leur fréquence dépend de la qualité de la reperfusion et de la sensibilité de l’imagerie utilisée pour les chercher.</p>
<h3>2.1 Thrombus ventriculaire gauche</h3>
<p>La méta-analyse de <button class="w" data-k="i51-bulluck">Bulluck et collaborateurs (2018, IRM après infarctus)</button> a réuni dix études et 2 072 patients reperfusés par angioplastie primaire. L’IRM a détecté un thrombus du ventricule gauche chez 6,3 % des patients. La fréquence atteignait 12,2 % après un infarctus antérieur, et 19,2 % après un infarctus antérieur avec FEVG inférieure à 50 %. Environ 96 % des thrombus siégeaient après un infarctus antérieur. Ces chiffres montrent que l’angioplastie primaire n’a pas fait disparaître cette complication. Ils montrent aussi qu’une échocardiographie standard, moins sensible, en sous-estime la fréquence.</p>
<p>Le thrombus est grave par son risque d’<b>embolie artérielle</b>. Une méta-analyse ancienne de onze études et 856 patients, résumée par Zhang et collaborateurs en 2025, a estimé que la présence d’un thrombus multipliait par environ 5,5 le risque d’embolie après un infarctus antérieur. L’embolie la plus redoutée est cérébrale, car le cerveau reçoit environ 15 % du débit cardiaque et tolère mal quelques minutes d’ischémie. Cette association repose sur des études anciennes, d’avant l’angioplastie primaire ; elle justifie le traitement mais ne permet pas de chiffrer le risque actuel avec précision.</p>
<h3>2.2 Syndrome de Tako-tsubo</h3>
<p>Le registre international <button class="w" data-k="i51-templin">InterTAK (Templin, 2015)</button>, coordonné par l’Hôpital universitaire de Zurich, a décrit 1 750 patients. Les femmes représentaient 89,8 % des cas, avec un âge moyen de 66,8 ans. Un déclencheur physique était présent chez 36,0 % des patients, un déclencheur émotionnel chez 27,7 %, et aucun déclencheur chez 28,5 %. Une maladie neurologique ou psychiatrique, aiguë ou ancienne, était présente chez 55,8 % des patients, contre 25,7 % des témoins atteints de SCA. La FEVG moyenne à l’admission était de 40,7 %.</p>
<p>Le Tako-tsubo n’est pas une maladie bénigne. Dans ce registre, les complications hospitalières graves, choc et décès compris, étaient aussi fréquentes que dans le SCA apparié. Au long cours, les événements cardiaques et cérébrovasculaires majeurs survenaient à 9,9 % par patient-année et les décès à 5,6 % par patient-année. Le registre ne prouve pas que le Tako-tsubo lui-même cause ces décès : les maladies déclenchantes, comme un sepsis ou une hémorragie cérébrale, y contribuent fortement.</p>
<h3>2.3 Complications mécaniques</h3>
<p>Les complications mécaniques sont rares, et leur fréquence réelle est mal connue : la rupture de la paroi libre tue souvent avant l’hôpital. Leur mortalité reste très élevée. Dans l’essai GUSTO-I, analysé par Crenshaw et collaborateurs en 2000, 84 patients sur 41 021 ont présenté une communication interventriculaire ; la mortalité à 30 jours atteignait 94 % chez les 35 patients traités médicalement, contre 47 % chez les 34 patients opérés. Ces groupes n’étaient pas randomisés : les chiffres historiques ne mesurent pas un effet causal de la chirurgie et ne prédisent pas le risque individuel actuel.</p>
<p>Le registre européen <button class="w" data-k="i51-caution">CAUTION (Matteucci et collaborateurs, 2024 ; 720 patients opérés)</button> donne des chiffres plus récents, de 2001 à 2019, dans 27 centres de 9 pays. La mortalité hospitalière après chirurgie atteignait 37,4 % : 41,1 % pour une rupture septale, 35,8 % pour une rupture de la paroi libre et 23,8 % pour une rupture de pilier. Chez les survivants de l’hospitalisation, la survie restait de 65,7 % à dix ans.</p>
<h3>2.4 Atteintes cardiaques des maladies générales</h3>
<p>En Suisse, la maladie de Chagas est l’exemple le mieux documenté d’atteinte cardiaque d’une maladie classée ailleurs. Dans l’étude genevoise de <button class="w" data-k="i51-chagas-ge">Jackson et collaborateurs (2010, migrants latino-américains)</button>, 130 des 1 012 personnes dépistées étaient infectées, soit 12,8 %. La prévalence atteignait 26,2 % chez les migrants boliviens. Parmi les patients infectés, 11,3 % avaient déjà une atteinte cardiaque chronique.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre suisse publié du thrombus ventriculaire gauche ou des complications mécaniques. Les chiffres cités proviennent de méta-analyses internationales, du registre européen CAUTION et du registre InterTAK, coordonné depuis Zurich et dont plusieurs centres sont suisses.</div>
<div class="key"><b>À retenir.</b> Un thrombus est détecté par IRM chez environ un patient sur huit après un infarctus antérieur, et chez un sur cinq quand la FEVG est abaissée. Le Tako-tsubo touche surtout des femmes ménopausées et a un pronostic hospitalier comparable à celui du SCA. Les ruptures mécaniques sont rares ; elles tuent la majorité des patients non opérés et plus d’un tiers des patients opérés. Le mécanisme commun de ces complications est exposé dans l’îlot suivant.</div>

<section class="ilot" id="i51-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les trois complications principales de ce chapitre partent d’une même situation : une région du ventricule gauche cesse de se contracter. Selon le mécanisme de cette perte de contraction, la conséquence est une stase sanguine, une rupture ou une défaillance de pompe.</p>
<h3>3.1 Formation du thrombus ventriculaire</h3>
<p>Le raisonnement suit la <button class="w" data-k="i51-virchow">triade de Virchow</button>. Normalement, la contraction de l’apex chasse le sang à chaque systole, et le tourbillon diastolique balaie toute la cavité. L’endocarde intact produit en continu des substances qui empêchent la coagulation, comme la thrombomoduline et la prostacycline. Après un infarctus antérieur étendu, trois anomalies s’additionnent.</p>
<p>D’abord, l’apex akinétique ne chasse plus le sang : il crée une <b>stase</b>, d’autant plus marquée que la paroi est dilatée ou anévrismale. Ensuite, la nécrose sous-endocardique détruit l’endothélium et expose le <button class="w" data-k="i51-ft">facteur tissulaire (déclencheur de la coagulation)</button> : c’est la <b>lésion pariétale</b>. Enfin, l’inflammation aiguë de l’infarctus augmente le fibrinogène et active les plaquettes : c’est l’<b>hypercoagulabilité</b>. Le thrombus se forme surtout dans les deux premières semaines, quand ces trois facteurs coexistent. Il est formé surtout de fibrine et de globules rouges, ce qui explique qu’un anticoagulant le prévienne mieux qu’un antiagrégant plaquettaire. L’anticoagulant ne dissout pas le thrombus : il arrête sa croissance et laisse la fibrinolyse naturelle le réduire en quelques semaines.</p>
<figure><svg viewBox="0 0 400 250" role="img" aria-label="Flux apical normal et stase apicale avec thrombus" font-family="Georgia,serif" font-size="12"><g fill="none" stroke="#222" stroke-width="1.6"><path d="M40 40 C20 110 40 190 100 215 C160 190 180 110 160 40"/><path d="M240 40 C215 120 230 200 300 225 C370 200 385 120 360 40"/><path d="M100 70 v90" stroke-dasharray="4 3"/><path d="M95 150 l5 12 5-12"/><path d="M300 70 v80" stroke-dasharray="4 3"/><path d="M295 140 l5 12 5-12"/></g><path d="M275 205 C285 185 315 185 325 205 C315 218 285 218 275 205 Z" fill="#888" stroke="#222"/><g fill="#222" text-anchor="middle"><text x="100" y="20">A. Normal</text><text x="300" y="20">B. Apex akinétique</text><text x="100" y="242">l’apex se contracte</text><text x="300" y="248">stase et thrombus apical</text><text x="135" y="120" text-anchor="start" font-size="11">chasse</text><text x="335" y="118" text-anchor="start" font-size="11">flux</text><text x="335" y="131" text-anchor="start" font-size="11">ralenti</text></g></svg><figcaption>Figure 1 — Pourquoi un thrombus naît à l’apex. A : chez le sujet sain, la contraction apicale chasse le sang à chaque systole. B : après un infarctus antérieur ou un Tako-tsubo, l’apex immobile et dilaté retient le sang ; la stase, la lésion endocardique et l’inflammation forment le thrombus (en gris).</figcaption></figure>
<p>La figure se lit de gauche à droite. Le flux de chasse, indiqué par la flèche, n’atteint plus le fond de la cavité lorsque l’apex est akinétique. Le piège est de croire qu’une FEVG modérément abaissée protège : une FEVG à 45 % peut coexister avec un apex totalement immobile. C’est l’akinésie apicale, plus que la FEVG globale, qui expose au thrombus.</p>
<h3>3.2 Mécanisme du Tako-tsubo</h3>
<p>Le Tako-tsubo résulte d’une <button class="w" data-k="i51-catechol">décharge de catécholamines (adrénaline et noradrénaline)</button> déclenchée par un stress physique ou émotionnel. À concentration normale, l’adrénaline stimule les récepteurs β₁ et β₂ du myocarde, ce qui augmente la contractilité. À très forte concentration, le récepteur β₂ change de partenaire : il active une <button class="w" data-k="i51-b2gi">protéine Gi inhibitrice au lieu de la protéine Gs (changement de signalisation)</button>. La contraction diminue alors dans les régions où les récepteurs β₂ sont les plus denses, c’est-à-dire à l’apex. Cette inhibition protégerait les cardiomyocytes de la toxicité directe des catécholamines, au prix d’une sidération transitoire.</p>
<p>D’autres mécanismes s’y ajoutent. Les catécholamines contractent les artérioles coronaires et perturbent la microcirculation. Elles surchargent la cellule en calcium, ce qui crée un œdème myocardique visible à l’IRM. Les œstrogènes atténuent ces effets ; leur chute après la ménopause expliquerait la prédominance féminine. Ce mécanisme reste partiellement hypothétique : aucune théorie isolée n’explique toutes les formes, en particulier les formes basales.</p>
<p>La conséquence hémodynamique dépend de la région sidérée. Dans la forme apicale typique, la base hypercontractile rétrécit la chambre de chasse ventriculaire gauche pendant la systole. Une <button class="w" data-k="i51-ochasse">obstruction dynamique de la chambre de chasse</button> peut apparaître, avec un mouvement antérieur systolique de la valve mitrale et une insuffisance mitrale. Selon le consensus InterTAK, cette obstruction touche environ 20 % des patients. Elle explique pourquoi les inotropes et les dérivés nitrés peuvent aggraver le choc.</p>
<h3>3.3 Mécanisme des ruptures</h3>
<p>Un myocarde nécrosé perd sa résistance mécanique pendant la phase de <button class="w" data-k="i51-cicatrice">détersion de l’infarctus (fenêtre des ruptures)</button>. Entre le troisième et le cinquième jour environ, les polynucléaires puis les macrophages digèrent les fibres mortes avant que le collagène ne les remplace. La paroi est alors la plus fragile. Selon la <button class="w" data-k="i51-laplace">loi de Laplace (tension pariétale)</button>, la tension subie par une paroi augmente avec la pression et le rayon de la cavité, et diminue avec son épaisseur. Une paroi nécrosée, amincie et soumise à une pression systolique conservée concentre donc la contrainte.</p>
<p>Selon le site de la rupture, la conséquence diffère. Une rupture de la paroi libre ouvre le ventricule dans le péricarde et provoque une tamponnade. Une rupture du septum crée un shunt gauche-droit. Une rupture de pilier libère un feuillet mitral et crée une insuffisance mitrale aiguë massive. La reperfusion tardive ou absente en est le principal facteur de risque, car elle laisse la nécrose devenir transmurale.</p>
<h3>3.4 Atteinte cardiaque des maladies générales</h3>
<p>Une maladie générale lèse le cœur par quatre voies. Un agent infectieux peut envahir le myocarde, comme <i>Trypanosoma cruzi</i> dans la maladie de Chagas. Une toxine peut le léser à distance, comme la toxine diphtérique. Une inflammation immunitaire peut atteindre les trois tuniques, comme dans la polyarthrite rhumatoïde. Une substance peut s’y déposer, comme les fibrilles amyloïdes. Le médecin identifie la voie, car elle détermine le traitement : antiparasitaire, antitoxine, immunosuppression ou traitement de la maladie de dépôt.</p>
<div class="key"><b>À retenir.</b> Une paroi immobile crée une stase et favorise le thrombus. Une paroi nécrosée et amincie se rompt surtout entre le troisième et le cinquième jour. Une décharge de catécholamines sidère l’apex et peut obstruer la chambre de chasse. Une maladie générale lèse le cœur par infection, toxine, inflammation ou dépôt. L’îlot suivant précise les terrains qui exposent à chacune de ces complications.</div>
</section>

<section class="ilot" id="i51-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Les facteurs de risque ne sont pas les mêmes pour chaque complication. Le tableau suivant rapproche chaque entité de ses causes, pour que le médecin sache quelle complication rechercher chez quel patient.</p>
<table class="t"><tr><th>Complication</th><th>Causes principales</th><th>Facteurs de risque démontrés ou probables</th></tr>
<tr><td>Thrombus du ventricule gauche</td><td>Infarctus antérieur, anévrisme apical, cardiomyopathie dilatée, Tako-tsubo, <button class="w" data-k="i51-loeffler">endocardite de Löffler</button>, cardiomyopathie du péripartum, non-compaction</td><td>Akinésie ou anévrisme apical, FEVG basse, reperfusion tardive, CRP et fibrinogène élevés à l’admission</td></tr>
<tr><td>Thrombus de l’oreillette gauche</td><td>Fibrillation auriculaire, rétrécissement mitral</td><td>Voir le cours I48</td></tr>
<tr><td>Tako-tsubo</td><td>Stress émotionnel, chirurgie, sepsis, crise d’asthme, hémorragie méningée, AVC, épilepsie, <button class="w" data-k="i51-pheo">phéochromocytome</button>, catécholamines ou dobutamine administrées</td><td>Femme ménopausée, maladie neurologique ou psychiatrique</td></tr>
<tr><td>Rupture de la paroi libre, du septum ou d’un pilier</td><td>Infarctus transmural</td><td>Premier infarctus, âge avancé, sexe féminin, reperfusion tardive ou absente</td></tr>
<tr><td>Rupture de cordage hors infarctus</td><td><button class="w" data-k="i51-myxoide">Dégénérescence myxoïde mitrale</button>, endocardite, traumatisme thoracique</td><td>Prolapsus mitral connu, hypertension artérielle</td></tr>
<tr><td>Communication interventriculaire acquise hors infarctus</td><td>Traumatisme thoracique, chirurgie septale, endocardite avec abcès</td><td>Myectomie, remplacement valvulaire aortique</td></tr>
<tr><td>Atteinte cardiaque d’une maladie générale</td><td>Chagas, diphtérie, méningocoque, polyarthrite rhumatoïde, lupus, sarcoïdose, amylose, hyperthyroïdie</td><td>Origine géographique, vaccination incomplète, maladie systémique active</td></tr></table>
<p>Ce tableau se lit par la colonne des causes. Une même cause, l’infarctus antérieur, mène à la fois au thrombus et à la rupture ; le médecin recherche donc les deux. Le piège le plus fréquent concerne le Tako-tsubo iatrogène : une perfusion de dobutamine ou d’adrénaline peut déclencher la maladie qu’elle aggrave ensuite. Exemple : chez une patiente en choc septique sous noradrénaline, une baisse brutale de la FEVG avec akinésie apicale fait évoquer un Tako-tsubo, et non seulement une cardiomyopathie septique.</p>
<div class="key"><b>À retenir.</b> L’infarctus antérieur avec akinésie apicale expose au thrombus et à la rupture. Le Tako-tsubo suit un stress physique plus souvent qu’un stress émotionnel. Une rupture de cordage hors infarctus évoque d’abord une valve myxoïde ou une endocardite. Une atteinte cardiaque inexpliquée chez un migrant latino-américain évoque une maladie de Chagas. Ces terrains orientent l’anamnèse, décrite dans l’îlot suivant.</div>
<button class="pareto-btn ui" data-k="pareto-i51-physio">▲ Loi de Pareto — Physiopathologie et étiologies</button>
</section>

<section class="ilot" id="i51-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche trois informations : la cardiopathie sous-jacente, le déclencheur éventuel et la chronologie. La chronologie est décisive, car une même douleur thoracique n’a pas le même sens au premier et au cinquième jour d’un infarctus.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin demande d’abord la date et le territoire d’un <button class="w" data-k="i51-atcd-idm">infarctus récent ou ancien</button>. Il recherche ensuite une <button class="w" data-k="i51-atcd-stress">exposition à un stress récent (deuil, conflit, chirurgie, infection)</button>, qui oriente vers un Tako-tsubo. Il note une <button class="w" data-k="i51-atcd-neuro">maladie neurologique ou psychiatrique</button>, présente chez plus de la moitié des patients du registre InterTAK. Il recherche un souffle connu ou un prolapsus mitral, qui prédispose à la rupture de cordage. Il interroge enfin sur l’<button class="w" data-k="i51-atcd-voyage">origine géographique et les séjours en zone d’endémie</button>, la vaccination contre la diphtérie et une maladie inflammatoire connue.</p>
<h3>5.2 Symptômes par fréquence</h3>
<p>Les symptômes varient selon la complication. Le thrombus ventriculaire est le plus souvent <b>asymptomatique</b> : il est découvert par l’imagerie systématique ou révélé par une embolie. Le Tako-tsubo se manifeste surtout par une <button class="w" data-k="i51-douleur">douleur thoracique</button> et une <button class="w" data-k="i51-dyspnee">dyspnée</button>, comme un infarctus. Les ruptures se manifestent par une dégradation brutale : œdème pulmonaire, malaise, choc ou arrêt cardiaque. Les atteintes des maladies générales se révèlent souvent par des <button class="w" data-k="i51-palpit">palpitations ou une syncope</button>, signes d’un trouble du rythme ou de la conduction.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Une femme de 68 ans apprend le décès brutal de son fils. Deux heures plus tard, elle ressent une douleur thoracique constrictive avec dyspnée. L’ECG montre un sus-décalage antérieur. Les coronaires sont saines et la ventriculographie montre une ballonisation apicale : c’est un Tako-tsubo de forme typique.</p></div>
<div class="card"><h4>Formes atypiques</h4><p>Un homme de 52 ans est en réanimation pour une hémorragie méningée ; une hypotension inexpliquée révèle un Tako-tsubo, sans douleur rapportée. Un homme de 70 ans, six semaines après un infarctus antérieur, présente un déficit brachial brutal : l’embolie cérébrale révèle un thrombus apical. Une femme de 45 ans d’origine bolivienne consulte pour une syncope : l’ECG montre un bloc de branche droite et un hémibloc antérieur gauche, qui évoquent une cardiopathie de Chagas.</p></div></div>
<p>Ces cartes montrent que la forme atypique est fréquente chez l’homme, chez le patient sédaté et chez le patient porteur d’une maladie neurologique. Le piège est d’attribuer une dégradation hémodynamique à la maladie déclenchante, sepsis ou hémorragie cérébrale, sans échocardiographie.</p>
<div class="key"><b>À retenir.</b> L’anamnèse établit la cardiopathie sous-jacente, le déclencheur et la chronologie. Le thrombus est souvent muet jusqu’à l’embolie ; le Tako-tsubo imite un infarctus ; les ruptures se révèlent par une dégradation brutale. Les signes physiques qui orientent entre ces situations sont décrits dans l’îlot suivant.</div>
</section>

<section class="ilot" id="i51-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique répond à deux questions : le patient est-il en état de choc, et existe-t-il un signe nouveau qui désigne une complication mécanique ou une embolie ? Il se mène toujours dans le même ordre, du général au ciblé.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin apprécie d’abord la conscience, la coloration et la marbrure des genoux. Il mesure la pression artérielle aux deux bras, la fréquence cardiaque, la fréquence respiratoire et la saturation. Normalement, la pression systolique dépasse 100 mmHg et le temps de recoloration est inférieur à 3 secondes. Une <button class="w" data-k="i51-choc">pression systolique inférieure à 90 mmHg avec signes d’hypoperfusion (choc cardiogénique)</button> impose une échocardiographie immédiate.</p></div>
<div class="card"><h4>Auscultation cardiaque</h4><p>Normalement, le premier et le deuxième bruit sont nets, sans souffle. Un <button class="w" data-k="i51-souffle-civ">souffle holosystolique rude parasternal gauche avec frémissement</button> évoque une communication interventriculaire. Un <button class="w" data-k="i51-souffle-im">souffle apical d’insuffisance mitrale aiguë</button> évoque une rupture de pilier ou de cordage ; il peut être bref ou absent. Un souffle systolique éjectionnel apparu en cas de Tako-tsubo évoque une obstruction de la chambre de chasse.</p></div>
<div class="card"><h4>Signes de tamponnade</h4><p>Normalement, la pression artérielle systolique baisse de moins de 10 mmHg à l’inspiration. Un <button class="w" data-k="i51-pouls-paradoxal">pouls paradoxal</button>, une turgescence jugulaire et des bruits assourdis évoquent une tamponnade. Après un infarctus, ils font redouter une rupture de la paroi libre.</p></div>
<div class="card"><h4>Signes d’embolie artérielle</h4><p>Le médecin recherche un <button class="w" data-k="i51-embolie-signes">déficit neurologique focal, une ischémie aiguë de membre ou une douleur abdominale disproportionnée</button>. Chacun de ces signes peut révéler un thrombus ventriculaire jusque-là méconnu.</p></div></div>
<p>Ces quatre cartes se lisent dans l’ordre de gravité. Le piège principal est l’absence de souffle dans la rupture de pilier : quand la pression de l’oreillette gauche monte brutalement, le gradient entre le ventricule et l’oreillette diminue vite et le souffle devient court. Un œdème pulmonaire brutal avec une FEVG conservée doit donc faire chercher une rupture de pilier à l’échocardiographie, même sans souffle.</p>
<div class="key"><b>À retenir.</b> L’examen cherche d’abord un choc, puis un souffle nouveau, un pouls paradoxal ou un signe d’embolie. Un souffle holosystolique avec frémissement évoque une communication interventriculaire ; un œdème pulmonaire brutal sans souffle n’exclut pas une rupture de pilier. L’îlot suivant organise les examens qui confirment ces hypothèses.</div>
</section>
