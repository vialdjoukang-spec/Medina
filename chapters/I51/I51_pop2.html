
<!-- ===== FENÊTRES I51 : anamnèse, examen clinique, examens ===== -->
<template data-pop="i51-atcd-idm" data-title="Antécédent d’infarctus : date et territoire">
<div class="lab">Pourquoi demander la date</div><p>Elle situe le patient dans la chronologie des complications : ruptures surtout entre le troisième et le cinquième jour, thrombus surtout dans les deux premières semaines, anévrisme et thrombus organisé après plusieurs semaines.</p>
<div class="lab">Pourquoi demander le territoire</div><p>Un infarctus antérieur expose au thrombus apical et à la rupture septale apicale. Un infarctus inférieur ou latéral expose à la rupture du pilier postéromédial.</p>
<div class="lab">Pourquoi demander le délai de reperfusion</div><p>Une reperfusion tardive ou absente laisse la nécrose devenir transmurale ; c’est le terrain des ruptures.</p></template>

<template data-pop="i51-atcd-stress" data-title="Stress récent : déclencheur du Tako-tsubo">
<div class="lab">Déclencheurs émotionnels</div><p>Deuil, conflit, annonce d’une maladie, peur intense ; parfois une émotion positive. Ils précédaient 27,7 % des cas du registre InterTAK.</p>
<div class="lab">Déclencheurs physiques</div><p>Chirurgie, fracture, sepsis, crise d’asthme, hémorragie méningée, AVC, épilepsie, injection de catécholamines. Ils précédaient 36,0 % des cas et s’associent à un pronostic hospitalier plus sombre.</p>
<div class="lab">Piège</div><p>L’absence de déclencheur, présente chez 28,5 % des patients, n’exclut pas le diagnostic. Le médecin ne pose pas non plus le diagnostic sur la seule présence d’un stress : l’occlusion coronaire doit être exclue.</p></template>

<template data-pop="i51-atcd-neuro" data-title="Maladie neurologique ou psychiatrique">
<div class="lab">Fréquence</div><p>Présente chez 55,8 % des patients du registre InterTAK, contre 25,7 % des témoins atteints de SCA.</p>
<div class="lab">Interprétation</div><p>Une maladie neurologique aiguë peut déclencher la décharge de catécholamines. Une maladie psychiatrique, anxieuse ou dépressive, pourrait modifier la réponse au stress. L’association est établie ; le mécanisme ne l’est pas.</p>
<div class="lab">Conséquence pratique</div><p>Une maladie neurologique ou psychiatrique aiguë est un facteur de complications hospitalières. Elle augmente aussi la probabilité diagnostique dans le score InterTAK.</p></template>

<template data-pop="i51-atcd-voyage" data-title="Origine géographique, vaccination et maladies générales">
<div class="lab">Origine latino-américaine</div><p>Une naissance ou un long séjour en Bolivie, en Argentine, au Paraguay ou dans d’autres régions d’endémie fait proposer une sérologie de Chagas, même ancienne. La transmission vectorielle se fait dans les habitations rurales ; la transmission de la mère à l’enfant et par transfusion existe aussi.</p>
<div class="lab">Vaccination</div><p>Une vaccination incomplète contre la diphtérie fait évoquer une myocardite diphtérique devant une angine pseudomembraneuse suivie d’un trouble de conduction.</p>
<div class="lab">Maladies inflammatoires</div><p>Une polyarthrite rhumatoïde, un lupus ou une sarcoïdose connus orientent vers une atteinte péricardique, valvulaire ou myocardique.</p>
<div class="lab">Piqûre de tique</div><p>Une piqûre de tique ou un érythème migrant dans les semaines précédentes fait évoquer une cardite de Lyme devant un bloc auriculoventriculaire.</p></template>

<template data-pop="i51-douleur" data-title="Douleur thoracique du Tako-tsubo">
<div class="lab">Caractéristiques</div><p>Douleur rétrosternale constrictive, souvent indiscernable de celle d’un infarctus. Elle est le symptôme le plus fréquent.</p>
<div class="lab">Mécanisme</div><p>La dysfonction microvasculaire et la souffrance des cardiomyocytes sidérés activent les afférences nociceptives cardiaques.</p>
<div class="lab">Piège</div><p>Elle manque souvent chez le patient sédaté, opéré ou atteint d’une maladie neurologique ; une hypotension ou une anomalie ECG révèle alors la maladie.</p></template>

<template data-pop="i51-dyspnee" data-title="Dyspnée : congestion ou fuite aiguë">
<div class="lab">Mécanisme</div><p>La dysfonction ventriculaire élève la pression de remplissage du ventricule gauche, puis celle de l’oreillette et des capillaires pulmonaires. Au-delà d’environ 18 à 20 mmHg, le liquide passe dans l’interstitium pulmonaire.</p>
<div class="lab">Forme brutale</div><p>Une dyspnée qui s’installe en quelques minutes chez un patient stable évoque une fuite mitrale aiguë par rupture de pilier ou de cordage, ou un shunt par rupture septale.</p>
<div class="lab">Conséquence pratique</div><p>Toute dyspnée brutale après un infarctus ou chez un porteur de prolapsus mitral impose une échocardiographie immédiate.</p></template>

<template data-pop="i51-palpit" data-title="Palpitations et syncope au cours d’une maladie générale">
<div class="lab">Mécanismes</div><p>Une inflammation ou une fibrose du myocarde peut interrompre la conduction (bloc auriculoventriculaire) ou créer des circuits de réentrée (tachycardie ventriculaire).</p>
<div class="lab">Orientation</div><p>Bloc de branche droite avec hémibloc antérieur gauche : maladie de Chagas. Bloc auriculoventriculaire chez l’adulte jeune : sarcoïdose, borréliose. Fibrillation auriculaire inexpliquée : thyrotoxicose.</p>
<div class="lab">Conséquence pratique</div><p>Une syncope chez un patient porteur d’une maladie cardiaque infiltrante ou inflammatoire est présumée arythmique jusqu’à preuve du contraire.</p></template>

<template data-pop="i51-choc" data-title="Choc cardiogénique : reconnaître et classer">
<div class="lab">Définition</div><p>Hypoperfusion des organes due à une défaillance cardiaque : pression systolique inférieure à 90 mmHg ou recours à un vasopresseur, avec signes d’hypoperfusion (marbrures, oligurie, confusion, lactate élevé).</p>
<div class="lab">Classification</div><p>La classification SCAI décrit cinq stades, de A (à risque) à E (extrême). Elle aide à décider d’une assistance circulatoire.</p>
<div class="lab">Causes propres à ce chapitre</div><p>Rupture de la paroi libre, communication interventriculaire, rupture de pilier, Tako-tsubo avec ou sans obstruction de la chambre de chasse.</p>
<div class="lab">Conséquence pratique</div><p>L’échocardiographie au lit identifie la cause en quelques minutes ; elle précède le choix d’un vasopresseur, d’un inotrope ou d’une assistance mécanique.</p></template>

<template data-pop="i51-souffle-civ" data-title="Souffle de communication interventriculaire">
<div class="lab">Technique</div><p>Auscultation au bord gauche du sternum, au troisième et au quatrième espace intercostal, puis palpation de la région à plat de main pour sentir un frémissement.</p>
<div class="lab">Caractéristiques</div><p>Souffle holosystolique rude, souvent intense, parfois accompagné d’un frémissement palpable. Il irradie largement sur le précordium.</p>
<div class="lab">Mécanisme</div><p>La pression du ventricule gauche dépasse celle du ventricule droit pendant toute la systole : le flux traverse le défaut du début à la fin de la systole.</p>
<div class="lab">Piège</div><p>Dans un choc profond, le gradient entre les deux ventricules diminue et le souffle s’atténue. Son absence n’exclut pas le diagnostic.</p></template>

<template data-pop="i51-souffle-im" data-title="Souffle d’insuffisance mitrale aiguë">
<div class="lab">Technique</div><p>Auscultation à l’apex, en décubitus latéral gauche, avec le diaphragme du stéthoscope.</p>
<div class="lab">Caractéristiques</div><p>Souffle apical, parfois bref et protosystolique, irradiant vers l’aisselle ou, en cas de fuite excentrique, vers la base.</p>
<div class="lab">Mécanisme du piège</div><p>L’oreillette gauche, de taille normale, se remplit vite : sa pression monte et rejoint celle du ventricule en fin de systole. Le flux régurgité, donc le souffle, s’arrête avant la fin de la systole, ou devient inaudible.</p>
<div class="lab">Conséquence pratique</div><p>Le souffle peut manquer dans la rupture de pilier. Un œdème pulmonaire brutal avec une FEVG conservée impose l’échocardiographie, quelle que soit l’auscultation.</p></template>

<template data-pop="i51-pouls-paradoxal" data-title="Pouls paradoxal">
<div class="lab">Normal</div><p>À l’inspiration, la pression systolique baisse de moins de 10 mmHg.</p>
<div class="lab">Pathologique</div><p>Une baisse supérieure à 10 mmHg définit le pouls paradoxal. Dans la tamponnade, le volume total du cœur est limité par le liquide péricardique : à l’inspiration, le ventricule droit se remplit davantage et refoule le septum vers la gauche, ce qui réduit le remplissage et le débit du ventricule gauche.</p>
<div class="lab">Technique</div><p>Le médecin gonfle le brassard au-dessus de la systolique, le dégonfle lentement, note la pression où les bruits apparaissent seulement à l’expiration, puis celle où ils sont audibles à chaque battement ; la différence mesure le pouls paradoxal.</p>
<div class="lab">Piège</div><p>Il peut manquer en cas d’hypertrophie ventriculaire gauche, de communication interauriculaire ou de ventilation mécanique. Le cours I30 détaille la tamponnade.</p></template>

<template data-pop="i51-embolie-signes" data-title="Signes d’embolie artérielle d’origine cardiaque">
<div class="lab">Cerveau</div><p>Déficit moteur ou sensitif brutal, aphasie, amputation du champ visuel. C’est la localisation la plus redoutée.</p>
<div class="lab">Membres</div><p>Douleur brutale, pâleur, froideur, abolition des pouls, puis troubles sensitifs et moteurs : ischémie aiguë qui menace le membre en quelques heures.</p>
<div class="lab">Viscères</div><p>Douleur abdominale intense contrastant avec un abdomen souple : ischémie mésentérique. Douleur lombaire et hématurie : infarctus rénal. Douleur de l’hypochondre gauche : infarctus splénique.</p>
<div class="lab">Conséquence pratique</div><p>Toute embolie artérielle sans source évidente fait chercher un thrombus intracardiaque par échocardiographie, puis par IRM si l’échocardiographie est négative et la suspicion forte.</p></template>

<template data-pop="i51-ett-thrombus" data-title="Échocardiographie transthoracique et thrombus">
<div class="lab">Technique</div><p>Coupes apicales quatre, deux et trois cavités, avec une fréquence de sonde élevée et un réglage de profondeur centré sur l’apex. La masse doit être vue dans deux incidences orthogonales.</p>
<div class="lab">Critères</div><p>Masse échogène distincte de l’endocarde, de bord net, dans une zone akinétique ou dyskinétique. Un thrombus protrusif fait saillie dans la cavité ; un thrombus mobile bouge indépendamment de la paroi.</p>
<div class="lab">Performance</div><p>Selon la revue de Zhang (2025), l’échocardiographie sans contraste est douteuse dans 10 à 46 % des cas. Elle manque surtout les petits thrombus muraux.</p>
<div class="lab">Quand la faire</div><p>Chez tout patient hospitalisé pour un infarctus, avant la sortie ; plus tôt en cas d’infarctus antérieur étendu ou d’akinésie apicale. Une répétition est utile si le premier examen a lieu très tôt, car le thrombus peut apparaître au cours des deux premières semaines.</p></template>

<template data-pop="i51-contraste" data-title="Produit de contraste échographique">
<div class="lab">Principe</div><p>Des microbulles de gaz, injectées par voie intraveineuse, traversent les capillaires pulmonaires et opacifient la cavité du ventricule gauche. Le thrombus, qui ne contient pas de microbulles, apparaît comme une lacune.</p>
<div class="lab">Indication</div><p>Apex mal visualisé, image douteuse, embolie inexpliquée.</p>
<div class="lab">Performance</div><p>Le contraste porte la sensibilité à environ 64 % selon la revue de Zhang (2025), contre une sensibilité plus faible sans contraste.</p>
<div class="lab">Précaution</div><p>Le médecin vérifie les contre-indications de l’information professionnelle du produit utilisé, en particulier un shunt droite-gauche connu et l’hypersensibilité.</p></template>

<template data-pop="i51-irm-thrombus" data-title="IRM cardiaque : examen de référence du thrombus">
<div class="lab">Statut</div><p>L’ESC 2023 désigne l’IRM cardiaque comme l’examen de référence pour évaluer le thrombus ventriculaire gauche.</p>
<div class="lab">Principe</div><p>Après injection de gadolinium, le myocarde et la cicatrice se rehaussent, alors que le thrombus, avasculaire, reste noir. Avec un temps d’inversion long, le thrombus devient très contrasté par rapport au myocarde voisin.</p>
<div class="lab">Performance</div><p>Le rehaussement tardif détecte le thrombus avec une sensibilité d’environ 88 % ; les séquences de cinéma sans contraste manquent 44 à 50 % des thrombus (revue de Zhang, 2025).</p>
<div class="lab">Indications selon l’ESC 2023</div><p>IRM à envisager lorsque l’image échocardiographique est douteuse et la suspicion clinique forte, par exemple après un AVC d’allure embolique (classe IIa, niveau C).</p>
<div class="lab">Limites</div><p>Disponibilité, durée, patient instable, certains dispositifs implantés, insuffisance rénale sévère pour le gadolinium.</p></template>

<template data-pop="i51-coro" data-title="Coronarographie et ventriculographie dans le Tako-tsubo">
<div class="lab">Indication</div><p>Tout sus-décalage du segment ST ou toute instabilité impose une coronarographie urgente, même quand le Tako-tsubo est suspecté. L’ECG et l’échocardiographie ne distinguent pas avec certitude les deux maladies.</p>
<div class="lab">Résultat attendu</div><p>Absence d’occlusion ou de lésion coronaire qui explique l’anomalie de contraction. Une maladie coronaire stable peut coexister.</p>
<div class="lab">Ventriculographie</div><p>Elle montre la forme typique en systole et permet de mesurer le gradient de la chambre de chasse par le retrait du cathéter.</p>
<div class="lab">Piège</div><p>Une occlusion de l’interventriculaire antérieure qui contourne l’apex peut donner une akinésie étendue : le médecin vérifie la perméabilité de toutes les branches avant de conclure.</p></template>

<template data-pop="i51-score-intertak" data-title="Score diagnostique InterTAK">
<div class="lab">Source</div><p>Ghadri J. R. et collaborateurs, <i>European Journal of Heart Failure</i> 2017 ; repris dans le consensus InterTAK 2018, partie II. Il distingue le Tako-tsubo du SCA à l’admission.</p>
<div class="lab">Sept éléments (total 100 points)</div><p>Sexe féminin : 25. Déclencheur émotionnel : 24. Déclencheur physique : 13. Absence de sous-décalage du segment ST, sauf en aVR : 12. Maladie psychiatrique : 11. Maladie neurologique : 9. QTc allongé : 6.</p>
<div class="lab">Interprétation</div><p>Un score de 70 points ou moins indique une probabilité faible à intermédiaire ; au-delà de 70 points, la probabilité est élevée. Selon le consensus, 30 points correspondent à moins de 1 % de probabilité, 50 points à environ 18 %, et plus de 70 points à environ 90 %, selon la prévalence.</p>
<div class="lab">Usage</div><p>Sans sus-décalage du segment ST, un score bas conduit à la coronarographie et un score élevé à l’échocardiographie première. Avec un sus-décalage, le score ne dispense jamais de la coronarographie.</p>
<div class="lab">Exemple</div><p>Femme de 70 ans, déclencheur émotionnel, sans sous-décalage, QTc long : 25 + 24 + 12 + 6 = 67 points, probabilité intermédiaire.</p></template>

<template data-pop="i51-irm-tts" data-title="IRM cardiaque dans le Tako-tsubo">
<div class="lab">Aspect typique</div><p>Anomalie de contraction circulaire, œdème étendu en séquence pondérée en T2 dans la zone akinétique, absence de rehaussement tardif significatif.</p>
<div class="lab">Différentiel</div><p>Un infarctus donne un rehaussement sous-endocardique ou transmural systématisé ; une myocardite donne un rehaussement sous-épicardique ou intramyocardique.</p>
<div class="lab">Complications visibles</div><p>Thrombus apical, épanchement péricardique, atteinte du ventricule droit.</p>
<div class="lab">Place</div><p>Le consensus InterTAK 2018 la recommande pour exclure une myocardite, surtout quand le tableau est atypique.</p></template>

<template data-pop="i51-eto" data-title="Échocardiographie transœsophagienne">
<div class="lab">Principe</div><p>La sonde placée dans l’œsophage, juste derrière l’oreillette gauche, donne une image très fine de la valve mitrale et de l’appareil sous-valvulaire.</p>
<div class="lab">Indications dans ce chapitre</div><p>Rupture partielle de pilier ou de cordage, mal vue en transthoracique ; mécanisme exact d’une fuite avant réparation ; abcès d’endocardite associé à une communication.</p>
<div class="lab">Précaution</div><p>Chez un patient instable, elle se fait sous sédation contrôlée ou intubation, souvent au bloc opératoire.</p></template>

<template data-pop="i51-oxymetrie" data-title="Cathétérisme droit et oxymétrie étagée">
<div class="lab">Technique</div><p>Le médecin prélève du sang dans la veine cave supérieure, l’oreillette droite, le ventricule droit et l’artère pulmonaire, et mesure la saturation en oxygène de chaque échantillon.</p>
<div class="lab">Normal</div><p>Les saturations du cœur droit sont proches, autour de 70 à 75 %.</p>
<div class="lab">Saut d’oxymétrie</div><p>Une communication interventriculaire fait monter la saturation entre l’oreillette droite et l’artère pulmonaire, car du sang oxygéné du ventricule gauche passe dans le ventricule droit.</p>
<div class="lab">Calcul du Qp/Qs</div><p>Qp/Qs = (saturation artérielle − saturation veineuse mixte) / (saturation veineuse pulmonaire − saturation artérielle pulmonaire). Un rapport supérieur à 1,5 à 2 signale un shunt important.</p>
<div class="lab">Piège</div><p>La saturation veineuse mixte se mesure en amont du shunt, dans les veines caves ; la mesurer dans l’artère pulmonaire sous-estime le shunt.</p></template>

<template data-pop="i51-tep-sarc" data-title="TEP au FDG et sarcoïdose cardiaque">
<div class="lab">Principe</div><p>Le FDG, analogue du glucose marqué, est capté par les cellules inflammatoires actives des granulomes.</p>
<div class="lab">Préparation</div><p>Un régime pauvre en glucides et riche en graisses, avant l’examen, éteint la captation normale du myocarde, qui utilise alors les acides gras. Sans cette préparation, l’examen est ininterprétable.</p>
<div class="lab">Interprétation</div><p>Une captation focale ou en mosaïque indique une inflammation active ; associée à un défaut de perfusion, elle signe une atteinte active avec cicatrice.</p>
<div class="lab">Conséquence pratique</div><p>Une inflammation active justifie une immunosuppression et sert de référence pour suivre la réponse. Le cours I42 détaille la sarcoïdose cardiaque.</p></template>

<template data-pop="i51-ecg-tts" data-title="Électrocardiogramme du Tako-tsubo">
<div class="lab">Phase aiguë</div><p>Sus-décalage du segment ST chez 44 % des patients du registre InterTAK, souvent étendu de V2 à V6 sans miroir, ou ondes T négatives d’emblée chez 41 %.</p>
<div class="lab">Évolution</div><p>Dans les jours suivants, des ondes T négatives profondes et diffuses apparaissent, avec un allongement du QT, puis régressent en quelques semaines à quelques mois.</p>
<div class="lab">Valeur pronostique</div><p>Un QTc supérieur à 500 ms s’associe aux arythmies ventriculaires malignes, surtout entre le deuxième et le quatrième jour.</p>
<div class="lab">Piège</div><p>Aucun critère ECG ne permet d’éliminer un infarctus. Les ondes Q pathologiques sont rares dans le Tako-tsubo (15 % contre 69 % dans le STEMI antérieur), mais leur absence ne suffit pas.</p></template>

<template data-pop="i51-chagas-sero" data-title="Sérologie de la maladie de Chagas">
<div class="lab">Principe</div><p>En phase chronique, les parasites circulent très peu : la recherche directe est presque toujours négative. Le diagnostic repose sur les anticorps.</p>
<div class="lab">Règle</div><p>Deux tests sérologiques de principes ou d’antigènes différents doivent être positifs. Un résultat discordant impose un troisième test. L’étude genevoise a utilisé deux tests immunoenzymatiques différents.</p>
<div class="lab">Conséquence pratique</div><p>Un patient infecté reçoit un ECG et une échocardiographie pour rechercher une atteinte cardiaque, puis un suivi régulier. Ses enfants et ses frères et sœurs nés de la même mère sont aussi dépistés.</p></template>
