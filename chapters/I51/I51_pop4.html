
<!-- ===== FENÊTRES I51 : Pareto ===== -->
<template data-pop="pareto-i51-def" data-title="Pareto — Définitions, classification, épidémiologie">
<p class="ratio" data-cover="i51-1,i51-2"></p>
<ul><li>Thrombus ventriculaire : masse sur une paroi akinétique ; mural ou protrusif. Tako-tsubo : dysfonction transitoire dépassant un territoire coronaire (InterTAK 2018).</li>
<li>Ruptures : paroi libre (tamponnade, faux anévrisme), septum (shunt), pilier ou cordage (fuite mitrale aiguë).</li>
<li>Maladie générale : atteinte classée par tunique ; plusieurs tuniques : cardite. Cardiomégalie = signe, non diagnostic.</li>
<li>Thrombus par IRM : 6,3 % des STEMI, 12,2 % des infarctus antérieurs, 19,2 % si FEVG inférieure à 50 %.</li>
<li>Tako-tsubo : 89,8 % de femmes ; déclencheur physique plus fréquent qu’émotionnel ; pronostic hospitalier proche du SCA.</li>
<li>Ruptures opérées (registre CAUTION) : 37,4 % de mortalité hospitalière ; rupture septale traitée médicalement : 94 % de mortalité à 30 jours dans GUSTO-I.</li></ul></template>

<template data-pop="pareto-i51-physio" data-title="Pareto — Physiopathologie et étiologies">
<p class="ratio" data-cover="i51-3,i51-4"></p>
<ul><li>Thrombus : stase apicale, lésion endocardique, hypercoagulabilité ; surtout dans les deux premières semaines.</li>
<li>Tako-tsubo : décharge de catécholamines, sidération apicale ; obstruction de la chambre de chasse chez environ 20 %.</li>
<li>Ruptures : paroi la plus fragile entre le troisième et le cinquième jour ; reperfusion tardive au premier plan.</li>
<li>Maladie générale : infection, toxine, inflammation ou dépôt.</li>
<li>Catécholamines administrées et phéochromocytome peuvent déclencher un Tako-tsubo.</li></ul></template>

<template data-pop="pareto-i51-diag" data-title="Pareto — Clinique, diagnostic et urgences">
<p class="ratio" data-cover="i51-5,i51-6,i51-7,i51-8"></p>
<ul><li>Thrombus souvent muet jusqu’à l’embolie ; Tako-tsubo indiscernable d’un infarctus au lit.</li>
<li>Souffle rude avec frémissement : communication interventriculaire. Œdème brutal sans souffle : rupture de pilier possible.</li>
<li>Échocardiographie au lit en premier ; IRM, examen de référence du thrombus ; sus-décalage du segment ST : coronarographie.</li>
<li>Choc du Tako-tsubo : mesurer le gradient, pas de catécholamine de principe ; QTc supérieur à 500 ms à risque.</li>
<li>Ruptures : assistance puis chirurgie.</li>
<li>Score InterTAK : au-delà de 70 points, probabilité élevée ; il ne remplace jamais la coronarographie devant un sus-décalage.</li>
<li>Différentiel d’une masse ventriculaire : l’akinésie favorise un thrombus sans être indispensable ; la caractérisation de toute masse reste nécessaire.</li>
<li>Embolie artérielle inexpliquée : chercher un thrombus, échocardiographie puis IRM.</li></ul></template>

<template data-pop="pareto-i51-pec" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i51-9,i51-10,i51-11,i51-12"></p>
<ul><li>Thrombus : anticoagulation 3 à 6 mois (<a href="https://doi.org/10.1093/eurheartj/ehad191" target="_blank" rel="noopener">ESC 2023</a>, IIa, C), imagerie vers 3 mois.</li>
<li>Antivitamine K historique, INR individualisé ; thrombus ventriculaire non nommé dans les indications suisses. AOD hors indication, avec résultats de résorption comparables dans de petits essais.</li>
<li>Après un SCA : trithérapie habituellement courte puis anticoagulant avec antiagrégant unique ; durée adaptée aux risques.</li>
<li>Tako-tsubo : obstruction, remplissage uniquement sans congestion importante ; pas de bêtabloquant en choc. Choc sans obstruction : décision experte, aucun inotrope systématique ; IEC ou ARA à la sortie, sans preuve randomisée ; récidive environ 5 %.</li>
<li>Pilier postéromédial : remplacement mitral urgent ; faux anévrisme : chirurgie.</li>
<li>Bloc inexpliqué de l’adulte jeune : sarcoïdose, borréliose, Chagas. Cardiomégalie : échocardiographie.</li>
<li>Thrombus mural ou protrusif : même traitement ; arrêt si le thrombus a disparu et la contraction s’est améliorée ; prévention systématique non recommandée.</li>
<li>Tako-tsubo : facteurs de mauvais pronostic hospitalier : déclencheur physique, maladie neurologique ou psychiatrique aiguë, troponine supérieure à dix fois la limite, FEVG inférieure à 45 %.</li>
<li>Rupture : réduire la postcharge ou poser une assistance, puis réparer ; communication tardive : fermeture si le shunt est significatif.</li></ul></template>

<template data-pop="pareto-i51-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i51-13,i51-14"></p>
<ul><li>Contrôle du thrombus vers 3 mois ; contrôle du Tako-tsubo à 4 à 8 semaines.</li>
<li>Grossesse : HBPM ; antivitamine K et rivaroxaban contre-indiqués, apixaban non recommandé.</li>
<li>Rivaroxaban exclu sous 15 mL/min ; énoxaparine une fois par jour sous 30 mL/min.</li>
<li>Ordre des décisions : occlusion, hémodynamique, embolie, récupération.</li></ul></template>

<template data-pop="pareto-i51-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i51-e-1,i51-e-2,i51-e-3,i51-e-4,i51-e-5,i51-e-6"></p>
<ul><li>Échocardiographie : pivot ; contraste si l’apex est mal vu ; akinésie fréquente mais non obligatoire pour un thrombus.</li>
<li>IRM : thrombus noir après gadolinium ; Tako-tsubo avec œdème sans rehaussement ; myocardite sous-épicardique.</li>
<li>ECG du Tako-tsubo : sus-décalage 44 %, T négatives 41 % ; QTc long fréquent.</li>
<li>Troponine modeste, NT-proBNP très élevé ; Chagas : deux sérologies.</li>
<li>Saut d’oxymétrie et Qp/Qs pour la communication interventriculaire ; Qp/Qs = (saturation artérielle − veineuse mixte) / (veineuse pulmonaire − artérielle pulmonaire).</li>
<li>Gradient de la chambre de chasse au Doppler continu : quatre fois le carré de la vitesse ; à recontrôler après chaque changement de traitement.</li>
<li>IRM contre-indiquée chez le patient instable ; coronarographie normale n’égale pas Tako-tsubo (myocardite possible).</li></ul></template>

<template data-pop="pareto-i51-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i51-sa,i51-sh,i51-sp,i51-sb"></p>
<ul><li>Pilier postéromédial à vascularisation unique.</li>
<li>Paroi la plus fragile entre le troisième et le septième jour.</li>
<li>Laplace : rayon élevé et paroi mince multiplient la tension.</li>
<li>Fuite aiguë : oreillette non compliante, onde v, souffle court.</li>
<li>β₂ couplé à Gi sous forte adrénaline : sidération apicale.</li>
<li>Thrombus de stase riche en fibrine : anticoagulant, non aspirine.</li>
<li>Infarctus inférieur ou latéral : pilier postéromédial ; infarctus antérieur : thrombus apical et rupture septale apicale.</li>
<li>Obstruction dynamique aggravée par l’hypovolémie, les vasodilatateurs et les inotropes ; un remplissage se discute sans congestion importante et un bêtabloquant ne s’initie pas en choc.</li>
<li>Antivitamine K : baisse des facteurs II, VII, IX, X, d’où un délai de plusieurs jours.</li></ul></template>

<template data-pop="pareto-i51-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i51-p-1,i51-p-2,i51-p-3,i51-p-4"></p>
<ul><li>Phenprocoumone : schéma de la monographie à individualiser selon l’INR et le terrain ; une dose plus élevée ne raccourcit pas le délai ; héparine pour l’effet immédiat nécessaire.</li>
<li>Énoxaparine 1 mg/kg toutes les 12 heures.</li>
<li>AOD hors indication du thrombus ventriculaire : les repères de fibrillation auriculaire ne sont pas un protocole posologique validé ; décision spécialisée documentée.</li>
<li>Tako-tsubo : éviter les médicaments aggravant une obstruction ; lévosimendan insuffisamment étayé, aucun protocole automatique dans le choc.</li>
<li>Interactions de la phenprocoumone : amiodarone, antibiotiques, AINS ; AOD : inhibiteurs puissants du CYP3A4.</li></ul></template>
