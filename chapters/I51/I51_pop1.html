
<!-- ===== FENÊTRES I51 : notions fondamentales, classification, épidémiologie ===== -->
<template data-pop="i51-virchow" data-title="Triade de Virchow appliquée au ventricule">
<div class="lab">Définition</div><p>Rudolf Virchow a décrit en 1856 trois conditions qui favorisent la thrombose : la stase du sang, la lésion de la paroi vasculaire et l’hypercoagulabilité. Une seule suffit rarement ; leur association rend la thrombose probable.</p>
<div class="lab">Application au ventricule gauche</div><p><b>Stase</b> : un apex akinétique ou anévrismal n’est plus vidé à chaque systole. <b>Lésion pariétale</b> : la nécrose sous-endocardique détruit l’endothélium, qui ne produit plus de thrombomoduline ni de prostacycline, et expose le facteur tissulaire. <b>Hypercoagulabilité</b> : la réaction inflammatoire de l’infarctus élève le fibrinogène et active les plaquettes.</p>
<div class="lab">Conséquence pratique</div><p>Le risque est maximal quand les trois conditions coexistent : infarctus antérieur étendu, dans les deux premières semaines. Dans le Tako-tsubo, la stase apicale domine ; l’endothélium est moins lésé, ce qui explique un thrombus moins fréquent qu’après un infarctus de même étendue.</p>
<div class="lab">Limite</div><p>La triade explique la formation du thrombus, mais ne permet pas de calculer le risque d’un patient donné. Aucun score validé ne prédit le thrombus ventriculaire.</p></template>

<template data-pop="i51-catechol" data-title="Toxicité myocardique des catécholamines">
<div class="lab">Normal</div><p>L’adrénaline et la noradrénaline stimulent les récepteurs β₁ du myocarde : la fréquence et la contractilité augmentent pour adapter le débit à l’effort.</p>
<div class="lab">Excès</div><p>À très forte concentration, les catécholamines surchargent la cellule en calcium, consomment de l’ATP et produisent des radicaux libres. Elles contractent aussi les artérioles coronaires et perturbent la microcirculation. Le résultat est une sidération, avec un œdème myocardique, sans mort cellulaire étendue.</p>
<div class="lab">Preuves</div><p>Le Tako-tsubo survient après l’injection d’adrénaline ou de dobutamine, et au cours d’un phéochromocytome ; ces observations soutiennent le rôle causal des catécholamines. Les taux plasmatiques mesurés dans les études sont toutefois variables, et le mécanisme exact reste discuté selon le consensus InterTAK 2018.</p>
<div class="lab">Conséquence pratique</div><p>Une catécholamine administrée pour traiter un choc peut entretenir le mécanisme du Tako-tsubo. Le consensus préfère le levosimendan ou une assistance mécanique quand un soutien est nécessaire.</p></template>

<template data-pop="i51-cicatrice" data-title="Cicatrisation de l’infarctus et fenêtre des ruptures">
<div class="lab">Chronologie</div><p>Jours 1 à 3 : afflux de polynucléaires neutrophiles, qui libèrent des protéases. Jours 3 à 7 : macrophages qui phagocytent les fibres mortes. À partir de la deuxième semaine : tissu de granulation et dépôt de collagène. Six à huit semaines : cicatrice fibreuse.</p>
<div class="lab">Période critique</div><p>Entre le troisième et le cinquième jour, la paroi a perdu ses fibres sans avoir encore de collagène : c’est la période habituelle des ruptures de la paroi libre, du septum et des piliers.</p>
<div class="lab">Facteurs aggravants</div><p>Une nécrose transmurale, une reperfusion tardive ou absente et une pression systolique élevée concentrent la contrainte sur la zone fragile. Les AINS et les corticoïdes ralentissent la cicatrisation.</p>
<div class="lab">Conséquence pratique</div><p>Toute dégradation brutale entre le troisième et le cinquième jour d’un infarctus transmural impose une échocardiographie immédiate.</p></template>

<template data-pop="i51-intertak-crit" data-title="Critères diagnostiques InterTAK du Tako-tsubo (2018)">
<div class="lab">Source</div><p>Ghadri J. R. et collaborateurs, International Expert Consensus Document on Takotsubo Syndrome, partie I, <i>European Heart Journal</i> 2018;39:2032–2046. Ce consensus, coordonné par l’Hôpital universitaire de Zurich, remplace les anciens critères de la Mayo Clinic.</p>
<div class="lab">Les huit critères</div><p>1. Dysfonction ventriculaire gauche transitoire, apicale, médioventriculaire, basale ou focale, dépassant habituellement le territoire d’une seule artère ; une atteinte du ventricule droit est possible. 2. Déclencheur émotionnel, physique ou mixte, fréquent mais non obligatoire. 3. Une atteinte neurologique (hémorragie méningée, AVC, crise épileptique) ou un phéochromocytome peut déclencher la maladie. 4. Anomalies ECG nouvelles (sus- ou sous-décalage du segment ST, ondes T négatives, QTc long), rarement absentes. 5. Troponine et créatine kinase modérément élevées ; peptides natriurétiques souvent très élevés. 6. Une maladie coronaire significative ne contredit pas le diagnostic. 7. Absence d’argument pour une myocardite infectieuse ; l’IRM est recommandée pour l’exclure. 8. Atteinte prédominante des femmes ménopausées.</p>
<div class="lab">Ce qui change par rapport aux anciens critères</div><p>Une maladie coronaire coexistante et un phéochromocytome n’excluent plus le diagnostic. Le déclencheur n’est plus obligatoire.</p>
<div class="lab">Limite</div><p>Le diagnostic reste rétrospectif : la récupération de la fonction ventriculaire, attendue en quelques semaines, le confirme.</p></template>

<template data-pop="i51-libman" data-title="Endocardite de Libman-Sacks">
<div class="lab">Définition</div><p>Endocardite non infectieuse du lupus érythémateux systémique : de petites végétations verruqueuses, stériles, siègent surtout sur la valve mitrale.</p>
<div class="lab">Mécanisme</div><p>Des dépôts d’immuns complexes et de fibrine se forment sur l’endocarde lésé ; les anticorps antiphospholipides y sont fortement associés.</p>
<div class="lab">Conséquences</div><p>Fuite valvulaire, rarement sténose ; embolies cérébrales. Les hémocultures sont négatives, ce qui la distingue d’une endocardite infectieuse.</p>
<div class="lab">Cours</div><p>Le lupus est traité dans le cours M32.</p></template>

<template data-pop="i51-bulluck" data-title="Méta-analyse de Bulluck (2018) : thrombus détecté par IRM">
<div class="lab">Méthode</div><p>Dix études, 2 072 patients atteints de STEMI traités par angioplastie primaire, IRM réalisée dans le mois suivant l’infarctus. Bulluck H et collaborateurs, <i>Journal of Cardiovascular Magnetic Resonance</i> 2018, doi:10.1186/s12968-018-0494-3.</p>
<div class="lab">Résultats</div><p>Thrombus chez 6,3 % de l’ensemble des patients, 12,2 % après un infarctus antérieur, 19,2 % après un infarctus antérieur avec FEVG inférieure à 50 %. Environ 96 % des thrombus siégeaient après un infarctus antérieur.</p>
<div class="lab">Limites</div><p>Les études incluses étaient surtout observationnelles et l’IRM n’était pas faite chez tous les patients consécutifs : un biais de sélection est possible. Une cohorte multicentrique de 738 patients a trouvé des fréquences plus basses, de 3,5 % et 7,1 %.</p>
<div class="lab">Conséquence pratique</div><p>Le thrombus reste fréquent à l’ère de l’angioplastie primaire, surtout après un infarctus antérieur avec FEVG basse : c’est la population où le médecin le recherche activement.</p></template>

<template data-pop="i51-templin" data-title="Registre InterTAK (Templin, 2015)">
<div class="lab">Méthode</div><p>Registre de 26 centres européens et nord-américains, coordonné par l’Hôpital universitaire de Zurich ; 1 750 patients comparés à des patients de même âge et de même sexe atteints de SCA. Templin C et collaborateurs, <i>New England Journal of Medicine</i> 2015;373:929–938, <a data-reference-source="1" href="https://doi.org/10.1056/NEJMoa1406761" target="_blank" rel="noopener noreferrer">doi:10.1056/NEJMoa1406761</a>.</p>
<div class="lab">Résultats principaux</div><p>Femmes : 89,8 % ; âge moyen 66,8 ans. Déclencheur physique 36,0 %, émotionnel 27,7 %, aucun 28,5 %. Maladie neurologique ou psychiatrique : 55,8 % contre 25,7 % dans le SCA. FEVG moyenne 40,7 % contre 51,5 %. Complications hospitalières graves, dont choc et décès, comparables à celles du SCA. Au long cours : 9,9 % d’événements cardiaques et cérébrovasculaires majeurs et 5,6 % de décès par patient-année.</p>
<div class="lab">Facteurs prédictifs de complications hospitalières</div><p>Déclencheur physique, maladie neurologique ou psychiatrique aiguë, troponine élevée et FEVG basse à l’admission.</p>
<div class="lab">Limite</div><p>Il s’agit d’un registre en partie rétrospectif : les associations décrites ne prouvent pas de causalité.</p></template>

<template data-pop="i51-caution" data-title="Complications mécaniques : registre européen CAUTION (2024)">
<div class="lab">Méthode</div><p>Cohorte rétrospective internationale de 27 centres de 9 pays, surtout européens, patients opérés de 2001 à 2019 ; 720 patients analysés : 428 ruptures septales, 139 ruptures de pilier, 120 ruptures de la paroi libre, 33 complications multiples. Matteucci M et collaborateurs, <i>European Heart Journal – Quality of Care and Clinical Outcomes</i> 2024;10:737–749, doi:10.1093/ehjqcco/qcae010.</p>
<div class="lab">Mortalité hospitalière après chirurgie</div><p>37,4 % au total : complications multiples 51,5 %, rupture septale 41,1 %, rupture de la paroi libre 35,8 %, rupture de pilier 23,8 %.</p>
<div class="lab">Survie au long cours</div><p>Ensemble de la cohorte : 54,0 % à un an, 48,1 % à cinq ans, 41,0 % à dix ans. Survivants de l’hospitalisation : 85,6 %, 77,3 % et 65,7 %.</p>
<div class="lab">Délai et assistance</div><p>Délai médian de 24 heures entre le diagnostic et la chirurgie ; ballon de contre-pulsion préopératoire chez 54,6 % et ECMO chez 8,8 % ; aucun des deux n’était un facteur indépendant de mortalité.</p>
<div class="lab">Sans chirurgie</div><p>Dans l’essai GUSTO-I (Crenshaw et collaborateurs, <i>Circulation</i> 2000;101:27–32), 94 % des 35 patients porteurs d’une rupture septale traités médicalement sont morts à 30 jours, contre 47 % des 34 patients opérés, sans randomisation.</p>
<div class="lab">Limite</div><p>Registre de patients opérés : il ne dit rien des patients jugés inopérables et ne prouve pas l’effet d’un délai ou d’un dispositif.</p></template>

<template data-pop="i51-chagas-ge" data-title="Maladie de Chagas à Genève (Jackson, 2010)">
<div class="lab">Méthode</div><p>Étude transversale de 1 012 migrants latino-américains reçus dans une structure de soins primaires ou dans deux églises à Genève ; 96 % n’avaient pas de permis de séjour. Dépistage par deux sérologies. Jackson Y et collaborateurs, 2010, doi:10.1371/journal.pntd.0000592.</p>
<div class="lab">Résultats</div><p>Infection chez 130 personnes, soit 12,8 % (intervalle de confiance à 95 % : 10,8 à 14,9 %), dont 127 Boliviens, soit 26,2 % des Boliviens. Tous les patients étaient en phase chronique ; 11,3 % avaient une atteinte cardiaque. Facteurs prédictifs : origine bolivienne, infection maternelle connue, âge supérieur à 35 ans.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin propose une sérologie aux personnes originaires d’une zone d’endémie, en particulier de Bolivie, même sans symptôme. Le dépistage concerne aussi les femmes enceintes, car la transmission de la mère à l’enfant est possible.</p></template>

<template data-pop="i51-ft" data-title="Facteur tissulaire">
<div class="lab">Définition</div><p>Glycoprotéine membranaire présente sous l’endothélium et dans le myocarde. Elle ne touche pas le sang tant que l’endothélium est intact.</p>
<div class="lab">Rôle</div><p>Exposé au sang, il fixe le facteur VII activé ; ce complexe active les facteurs X et IX et déclenche la production de thrombine.</p>
<div class="lab">Application</div><p>La nécrose de l’endocarde après un infarctus expose le facteur tissulaire au sang stagnant de l’apex : la coagulation démarre là où le flux est le plus lent.</p></template>

<template data-pop="i51-b2gi" data-title="Changement de couplage du récepteur β₂ (Gs vers Gi)">
<div class="lab">Normal</div><p>Le récepteur β₂ active la protéine Gs, qui stimule l’adénylate cyclase et augmente l’AMPc, donc la contraction.</p>
<div class="lab">À forte concentration d’adrénaline</div><p>Le récepteur est phosphorylé par des kinases spécifiques et se couple à la protéine Gi, qui inhibe l’adénylate cyclase. La contraction diminue. Ce changement a été décrit dans un modèle animal de Tako-tsubo (Paur et collaborateurs, <i>Circulation</i> 2012).</p>
<div class="lab">Pourquoi l’apex</div><p>La densité des récepteurs β₂ serait plus élevée à l’apex qu’à la base ; l’inhibition y est donc maximale.</p>
<div class="lab">Limite</div><p>Cette hypothèse repose surtout sur des données animales et n’explique pas les formes basales du Tako-tsubo.</p></template>

<template data-pop="i51-ochasse" data-title="Obstruction dynamique de la chambre de chasse ventriculaire gauche">
<div class="lab">Mécanisme</div><p>La base hypercontractile rétrécit la chambre de chasse en systole. Le flux accéléré attire le feuillet mitral antérieur vers le septum : c’est le mouvement antérieur systolique, qui crée un obstacle et une insuffisance mitrale.</p>
<div class="lab">Fréquence</div><p>Environ 20 % des Tako-tsubo selon le consensus InterTAK 2018, surtout dans la forme apicale.</p>
<div class="lab">Mesure</div><p>Doppler continu dans la chambre de chasse ; gradient maximal en mmHg, égal à quatre fois le carré de la vitesse en m/s. Exemple : une vitesse de 4 m/s correspond à un gradient de 64 mmHg. Pendant la coronarographie, le retrait du cathéter du ventricule vers l’aorte mesure aussi le gradient.</p>
<div class="lab">Conduite</div><p>Le médecin remplit prudemment, arrête les dérivés nitrés et les inotropes, et discute un bêtabloquant de courte durée d’action si la fonction le permet. Il répète la mesure après chaque changement de traitement.</p></template>

<template data-pop="i51-laplace" data-title="Loi de Laplace et tension pariétale">
<div class="lab">Formule</div><p>Tension pariétale = pression × rayon / (2 × épaisseur). La tension est la force qui tend à écarter les fibres de la paroi.</p>
<div class="lab">Exemple chiffré</div><p>Pour une pression de 120 mmHg, un rayon de 2 cm et une épaisseur de 10 mm, la tension vaut 120 × 2 / 2 = 120 unités relatives. Si le rayon passe à 3 cm et l’épaisseur à 5 mm, elle vaut 120 × 3 / 1 = 360 unités : elle triple.</p>
<div class="lab">Application</div><p>Une zone nécrosée, amincie et dilatée subit la contrainte la plus forte : elle se rompt ou forme un anévrisme. Abaisser la pression artérielle réduit cette contrainte, ce qui justifie le contrôle tensionnel après un infarctus étendu.</p></template>

<template data-pop="i51-loeffler" data-title="Endocardite de Löffler (atteinte endomyocardique à éosinophiles)">
<div class="lab">Définition</div><p>Atteinte de l’endocarde et du myocarde par une hyperéosinophilie prolongée ; le cours I42 la classe parmi les cardiomyopathies restrictives.</p>
<div class="lab">Mécanisme</div><p>Les éosinophiles libèrent des protéines cytotoxiques qui lèsent l’endocarde. Une phase nécrotique précède une phase thrombotique, puis une fibrose qui rigidifie les ventricules.</p>
<div class="lab">Thrombus</div><p>Les thrombus se forment aux apex des deux ventricules, même lorsque la contraction est conservée, car l’endocarde est directement lésé.</p>
<div class="lab">Conséquence pratique</div><p>Un thrombus apical sur une paroi qui se contracte, avec une hyperéosinophilie, fait évoquer ce diagnostic. Le traitement de la cause de l’hyperéosinophilie et l’anticoagulation sont discutés avec l’hématologue ; le cours I42 en détaille la classification.</p></template>

<template data-pop="i51-pheo" data-title="Phéochromocytome et Tako-tsubo">
<div class="lab">Lien</div><p>Une tumeur sécrétant des catécholamines peut déclencher un Tako-tsubo, parfois récidivant. Le consensus InterTAK 2018 l’accepte comme déclencheur.</p>
<div class="lab">Quand le chercher</div><p>Hypertension paroxystique, céphalées, sueurs et palpitations ; Tako-tsubo récidivant ; Tako-tsubo chez un homme jeune sans déclencheur.</p>
<div class="lab">Examen</div><p>Dosage des métanéphrines plasmatiques libres ou urinaires.</p>
<div class="lab">Piège</div><p>Un bêtabloquant donné seul avant le blocage α peut provoquer une crise hypertensive : la vasoconstriction α n’est plus compensée. Le diagnostic modifie donc le traitement du Tako-tsubo.</p></template>

<template data-pop="i51-myxoide" data-title="Dégénérescence myxoïde mitrale et rupture de cordage">
<div class="lab">Définition</div><p>Accumulation de substance fondamentale dans les feuillets et les cordages, qui deviennent épais, allongés et fragiles. Elle va de la déficience fibroélastique, avec des cordages fins, à la maladie de Barlow, avec des feuillets redondants.</p>
<div class="lab">Rupture</div><p>Un cordage fragilisé peut se rompre, souvent lors d’un effort ou d’un pic tensionnel. Le segment correspondant devient flottant : la fuite apparaît ou s’aggrave brutalement.</p>
<div class="lab">Clinique</div><p>Dyspnée brutale, souffle apical nouveau ou modifié. Chez un patient porteur d’un prolapsus connu, une aggravation brutale doit faire penser à cette rupture.</p>
<div class="lab">Traitement</div><p>La réparation chirurgicale ou percutanée est souvent possible ; le cours I34 traite les indications.</p></template>
