
<!-- ===== FENÊTRES I51 : traitement et maladies générales ===== -->
<template data-pop="i51-esc-thrombus" data-title="Anticoagulation du thrombus ventriculaire : sources et choix retenu">
<div class="lab">Recommandation retenue</div><p><a href="https://doi.org/10.1093/eurheartj/ehad191" target="_blank" rel="noopener">ESC 2023</a>, recommandations sur les syndromes coronariens aigus (Byrne R. A. et collaborateurs, <i>European Heart Journal</i> 2023;44:3720–3826, doi:10.1093/eurheartj/ehad191) : une anticoagulation orale, par antivitamine K ou AOD, doit être envisagée pendant 3 à 6 mois chez un patient ayant un thrombus ventriculaire gauche confirmé, en s’aidant d’une imagerie répétée (classe IIa, niveau C) ; une IRM doit être envisagée si l’image échocardiographique est douteuse et la suspicion forte (classe IIa, niveau C). Texte intégral de l’ESC inaccessible lors de ce balayage : recommandations lues dans leurs reprises primaires (Wenger, <i>Clinical Cardiology</i> 2024 ; commentaire de l’<i>European Heart Journal – Acute Cardiovascular Care</i> 2025).</p>
<div class="lab">Source complémentaire</div><p>Pour le Tako-tsubo, le rapport international d’experts de 2024 (<a href="https://doi.org/10.4274/balkanmedj.galenos.2024.2024-9-98" target="_blank" rel="noopener">Yalta et collaborateurs</a>) juge l’anticoagulation généralement indiquée pendant au moins 3 mois en cas de thrombus, et la propose en cas de large ballonisation apicale jusqu’à récupération.</p>
<div class="lab">Données plus récentes</div><p>La méta-analyse de <a href="https://pubmed.ncbi.nlm.nih.gov/41124985/" target="_blank" rel="noopener">Koeckerling (2025)</a> et l’essai RIVAWAR (2025), postérieurs à l’ESC 2023, confirment une résorption équivalente sous AOD et sous warfarine. Ils ne modifient pas la durée, qui n’a été testée par aucun essai randomisé.</p>
<div class="lab">Relation entre les sources</div><p>Les sources européennes et internationales concordent sur le principe et la durée minimale. L’ESC 2023 s’applique en Suisse ; elle est retenue. Aucune recommandation ESC plus récente sur ce point n’a été identifiée au 08.10.2026, ni aucune position suisse propre.</p>
<div class="lab">Limite</div><p>Le niveau C signifie un consensus d’experts. Aucun essai n’a montré qu’une durée précise réduit les AVC.</p></template>

<template data-pop="i51-avk" data-title="Phenprocoumone (Marcoumar)">
<div class="lab">Mécanisme</div><p>Inhibe la vitamine K époxyde réductase : le foie produit des facteurs II, VII, IX et X non fonctionnels, ainsi que les protéines C et S anticoagulantes.</p>
<div class="lab">Délai</div><p>L’information suisse indique un temps de latence de 36 à 72 heures et un plein effet après environ 7 jours. Un relais par héparine est donc nécessaire quand l’anticoagulation est urgente.</p>
<div class="lab">Posologie suisse</div><p>Comprimés à 3 mg. Jour 1 : 1½ à 2, voire 3 comprimés (4,5 à 9 mg) selon les valeurs initiales de la coagulation ; jour 2 : 2 comprimés (6 mg) ; puis adaptation à l’INR ; entretien habituel ½ à 1½ comprimé par jour. Les patients âgés, surtout après 75 ans, ont généralement besoin d’une dose plus faible. Ne pas administrer si l’INR dépasse 4,5.</p>
<div class="lab">Limite d’application</div><p>Ce schéma décrit l’information professionnelle, non une prescription uniforme du thrombus ventriculaire. La dose est individualisée selon l’INR et le terrain. Une dose plus élevée ne raccourcit pas le délai d’action ; l’héparine fournit l’effet immédiat lorsqu’il est nécessaire.</p>
<div class="lab">Cible</div><p>INR 2,0 à 3,0 dans l’infarctus du myocarde ; 2,0 à 3,5 pour une prothèse mécanique.</p>
<div class="lab">Contre-indications</div><p>Grossesse, diathèse hémorragique, lésion grave du parenchyme hépatique, ulcère digestif, hémorragie manifeste, endocardite bactérienne aiguë, péricardite ou épanchement péricardique, neurochirurgie récente.</p>
<div class="lab">Source</div><p><a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=19395" target="_blank" rel="noopener">Information professionnelle suisse de Marcoumar</a> (autorisation Swissmedic 19395, version allemande 103 D, mise à jour d’octobre 2020), rubrique « Dosierung/Anwendung », lue sur swissmedicinfo-pro.ch le 08.10.2026.</p></template>

<template data-pop="i51-aod-thrombus" data-title="AOD dans le thrombus ventriculaire : statut et doses">
<div class="lab">Statut en Suisse</div><p>Les informations suisses d’Eliquis (août 2026) et de Xarelto ne citent pas le thrombus ventriculaire gauche : leur emploi est hors indication. Le médecin informe le patient et documente sa décision.</p>
<div class="lab">Preuves</div><p>Sept petits essais randomisés, tous après un infarctus, montrent une résorption équivalente à celle de la warfarine. Aucun n’avait la puissance nécessaire pour comparer les AVC ou la mortalité.</p>
<div class="lab">Repères de fibrillation auriculaire et limites</div><p>Les doses de fibrillation auriculaire non valvulaire sont des repères, non un protocole validé du thrombus ventriculaire. Une réduction propre à la fibrillation auriculaire ne s’applique pas automatiquement dans cette indication ; le choix spécialisé se documente. Apixaban : 5 mg deux fois par jour, 2,5 mg deux fois par jour si deux critères sur trois (âge ≥ 80 ans, poids ≤ 60 kg, créatinine ≥ 133 µmol/L). Rivaroxaban : 20 mg une fois par jour avec un repas, 15 mg si la clairance est de 30 à 49 mL/min.</p>
<div class="lab">Situations où l’éviter</div><p>Grossesse et allaitement, prothèse valvulaire mécanique, insuffisance rénale terminale, classe C de Child-Pugh, interactions puissantes avec le CYP3A4 et la glycoprotéine P.</p></template>

<template data-pop="i51-meta-aod" data-title="Méta-analyse de Koeckerling (2025) : AOD contre warfarine">
<div class="lab">Méthode</div><p>Sept essais randomisés, 564 patients (323 sous AOD, 241 sous warfarine), tous après un infarctus aigu ; rivaroxaban dans quatre essais, apixaban dans trois. <a href="https://pubmed.ncbi.nlm.nih.gov/41124985/" target="_blank" rel="noopener">Koeckerling D et collaborateurs</a>, <i>JACC Advances</i> 2025;4(11):102243.</p>
<div class="lab">Résultats</div><p>Résorption du thrombus : risque relatif 1,01 (intervalle de confiance à 95 % : 0,96 à 1,06). AVC : 0,60 (0,07 à 5,03). Hémorragie majeure : 0,49 (0,17 à 1,45). Mortalité : 0,92 (0,37 à 2,32). Aucune différence significative.</p>
<div class="lab">Interprétation</div><p>Les AOD résorbent le thrombus aussi bien que la warfarine. Les intervalles de confiance très larges pour les AVC et les hémorragies montrent que les essais étaient trop petits pour conclure sur ces événements.</p>
<div class="lab">Limites</div><p>Essais ouverts, de courte durée, avec un risque de biais modéré dans la plupart ; aucun patient atteint de cardiomyopathie non ischémique.</p>
<div class="lab">Essai principal</div><p><b>RIVAWAR</b> (<a href="https://pubmed.ncbi.nlm.nih.gov/40706143/" target="_blank" rel="noopener">Shah et collaborateurs, <i>JACC Advances</i> 2025</a>) : 261 patients, rivaroxaban contre warfarine après un infarctus, aucune différence de résorption à 12 semaines. Il comptait plus de patients que tous les essais antérieurs réunis.</p></template>

<template data-pop="i51-redvelvt" data-title="Étude RED VELVT (2020)">
<div class="lab">Méthode</div><p>Étude rétrospective observationnelle de patients traités pour un thrombus ventriculaire gauche, comparant AOD et antivitamine K (<a href="https://pubmed.ncbi.nlm.nih.gov/32320043/" target="_blank" rel="noopener">Robinson et collaborateurs, <i>JAMA Cardiology</i> 2020</a>).</p>
<div class="lab">Résultat</div><p>Le traitement par AOD était associé à davantage d’embolies systémiques que l’antivitamine K.</p>
<div class="lab">Pourquoi ce résultat ne suffit pas</div><p>Dans une étude observationnelle, le choix du traitement dépend du médecin et du patient : les patients sous AOD pouvaient différer par leur gravité, leur fonction rénale ou leur observance. Les essais randomisés ultérieurs n’ont pas retrouvé de différence.</p>
<div class="lab">Conséquence pratique</div><p>Cette étude invite à la prudence, mais ne contre-indique pas les AOD.</p></template>

<template data-pop="i51-tritherapie" data-title="Trithérapie antithrombotique après un SCA">
<div class="lab">Définition</div><p>Association d’un anticoagulant oral, d’aspirine et d’un inhibiteur de P2Y12. Elle protège à la fois le stent et le ventricule, au prix d’un risque hémorragique élevé.</p>
<div class="lab">Recommandation <a href="https://doi.org/10.1093/eurheartj/ehad191" target="_blank" rel="noopener">ESC 2023</a></div><p>Chez un patient qui a besoin d’un anticoagulant après un SCA, la stratégie par défaut est une trithérapie d’une semaine au plus, suivie jusqu’à 12 mois d’une bithérapie : AOD à la dose de prévention de l’AVC et antiagrégant unique, de préférence le clopidogrel. En cas de risque ischémique élevé, la trithérapie peut durer jusqu’à un mois.</p>
<div class="lab">Preuve hémorragique</div><p>Dans l’essai AUGUSTUS, cité par l’information suisse d’Eliquis, l’ajout d’aspirine à un anticoagulant et à un inhibiteur de P2Y12 a environ doublé les hémorragies majeures ou cliniquement significatives.</p>
<div class="lab">Application au thrombus</div><p>Le schéma a été établi surtout pour la fibrillation auriculaire, dont l’anticoagulation est définitive. Pour un thrombus traité 3 à 6 mois, l’arrêt de l’anticoagulant s’accompagne habituellement de la reprise d’une double antiagrégation jusqu’à 12 mois ; cette séquence repose sur un avis d’experts.</p></template>

<template data-pop="i51-zhang2022" data-title="Rivaroxaban préventif après un infarctus antérieur (Zhang, 2022)">
<div class="lab">Méthode</div><p>Essai randomisé monocentrique ouvert, 279 patients atteints de STEMI antérieur. Rivaroxaban 2,5 mg deux fois par jour pendant 30 jours, ajouté à la double antiagrégation, contre double antiagrégation seule. <a href="https://pubmed.ncbi.nlm.nih.gov/35367170/" target="_blank" rel="noopener">Zhang Z et collaborateurs, <i>JACC: Cardiovascular Interventions</i> 2022</a>.</p>
<div class="lab">Résultat</div><p>Moins de thrombus et moins d’événements cliniques nets, sans augmentation des hémorragies.</p>
<div class="lab">Limites</div><p>Un seul centre, essai ouvert, effectif réduit, critère principal d’imagerie. Ce résultat ne suffit pas à recommander une prévention systématique, qu’aucune recommandation suisse ou européenne lue ne propose.</p></template>

<template data-pop="i51-consensus-ii" data-title="Tako-tsubo : consensus 2018, complément 2024 et GEIST 2025">
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehy077" target="_blank" rel="noopener">Ghadri J. R. et collaborateurs, <i>European Heart Journal</i> 2018;39:2047–2062</a>, doi:10.1093/eurheartj/ehy077. Il n’existe aucun essai randomisé ; toutes les propositions ont un niveau de preuve C.</p>
<div class="lab">Phase aiguë</div><p>Surveillance du rythme et mesure du gradient ; traitement individualisé selon le mécanisme du choc. Le rapport international 2024 déconseille les médicaments aggravant une obstruction, dont le lévosimendan, et propose une assistance circulatoire temporaire dans le choc par défaillance de pompe ou par obstruction ; aucune stratégie pharmacologique n’a un bénéfice de survie établi. Héparine si l’akinésie apicale est étendue ; défibrillateur portable à discuter si le QT est très long ou si une arythmie grave survient.</p>
<div class="lab">Après la phase aiguë</div><p>IEC ou ARA associés à une meilleure survie à un an ; bêtabloquants : résultats observationnels discordants, GEIST 2025 associé à une moindre mortalité à la sortie sans preuve causale ni baisse démontrée des récidives ; aspirine et statine seulement en cas d’athérosclérose coronaire.</p>
<div class="lab">Récidive</div><p>Environ 5 % des survivants, entre trois semaines et 3,8 ans après le premier épisode.</p></template>

<template data-pop="i51-amylose-conditions" data-title="Amylose : conditions du diagnostic non invasif ATTR">
<div class="lab">Quand la scintigraphie suffit</div><p>Une fixation myocardique de grade 2 ou 3 permet un diagnostic ATTR sans biopsie seulement avec une imagerie compatible et l’exclusion d’une anomalie monoclonale par chaînes légères libres sériques et immunofixations sérique et urinaire. Le SPECT vérifie que la fixation est myocardique.</p>
<div class="lab">Pourquoi rechercher AL</div><p>AL peut aussi fixer le traceur. Une anomalie monoclonale ou un grade 1 impose une évaluation spécialisée avec histologie et typage selon le contexte ; une scintigraphie isolée ne permet pas d’exclure AL.</p>
<div class="lab">Source et portée</div><p><a href="https://onlinelibrary.wiley.com/doi/full/10.1002/ejhf.2140" target="_blank" rel="noopener">Position ESC 2021 : algorithme diagnostique</a>, texte primaire consulté le 08.10.2026. Cette fenêtre précise les conditions du diagnostic ; elle ne remplace pas l’évaluation spécialisée.</p></template>

<template data-pop="i51-levosimendan" data-title="Levosimendan">
<div class="lab">Mécanisme</div><p>Sensibilisateur calcique : il se fixe à la troponine C et augmente la force de contraction sans augmenter le calcium intracellulaire. Il ouvre aussi des canaux potassiques sensibles à l’ATP des vaisseaux, d’où une vasodilatation.</p>
<div class="lab">Intérêt dans le Tako-tsubo</div><p>Il soutient la contraction sans passer par le récepteur β, donc sans entretenir la toxicité adrénergique. Le consensus InterTAK 2018 le jugeait « probablement bénéfique » sur la base d’une série de 13 patients ; le rapport international 2024 le déconseille en cas de gradient de la chambre de chasse.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, par vasodilatation ; tachycardie ; hypokaliémie.</p>
<div class="lab">Statut suisse</div><p>Information professionnelle suisse de Simdax® (décembre 2025) : indication limitée au traitement de courte durée de la décompensation aiguë d’une insuffisance cardiaque chronique sévère, en perfusion de 24 heures sous surveillance intensive ; contre-indications : pression systolique inférieure à 100 mmHg, obstacle mécanique au remplissage ou à l’éjection ventriculaire, QTc allongé, antécédent de torsades de pointes, clairance inférieure à 60 mL/min, infarctus récent. Dans le Tako-tsubo, il sort donc de l’indication autorisée et est contre-indiqué en cas d’obstruction ou de QT long ; aucun schéma posologique n’est proposé ici.</p></template>

<template data-pop="i51-assistance" data-title="Assistance circulatoire temporaire">
<div class="lab">Ballon de contre-pulsion intra-aortique</div><p>Il se gonfle en diastole et se dégonfle juste avant la systole : la postcharge baisse et la perfusion coronaire augmente. Dans le registre européen CAUTION, 54,6 % des patients opérés d’une rupture en avaient reçu un avant la chirurgie, sans effet indépendant sur la mortalité. L’essai IABP-SHOCK II avait exclu les complications mécaniques.</p>
<div class="lab">ECMO veino-artérielle</div><p>Elle assure le débit et l’oxygénation. Dans une tamponnade, le faible retour veineux peut limiter son débit ; elle augmente aussi la postcharge du ventricule gauche.</p>
<div class="lab">Pompe microaxiale</div><p>Placée à travers la valve aortique, elle aspire le sang du ventricule gauche vers l’aorte. Les données dans les complications mécaniques se limitent à de petites séries.</p>
<div class="lab">Place</div><p>Ces dispositifs servent de pont vers la réparation chirurgicale ou percutanée, décidée en équipe multidisciplinaire.</p></template>

<template data-pop="i51-pilier" data-title="Rupture de pilier : traitement">
<div class="lab">Anatomie</div><p>Le pilier postéromédial dépend d’une seule artère ; il se rompt surtout après un infarctus inférieur ou latéral.</p>
<div class="lab">Diagnostic</div><p>Fuite mitrale sévère, souvent excentrique, avec une masse mobile dans l’oreillette à l’échocardiographie ; l’échocardiographie transœsophagienne est très sensible quand la rupture est partielle.</p>
<div class="lab">Traitement</div><p>Chirurgie mitrale urgente, le plus souvent par remplacement, car le pilier rompu libère les deux feuillets. Dans le registre européen CAUTION, la mortalité hospitalière après chirurgie était de 23,8 %, et la survie des patients sortis vivants de 53,6 % à dix ans. Une réparation percutanée bord à bord est discutée si le risque chirurgical est prohibitif, avec des données limitées à des cas publiés.</p></template>

<template data-pop="i51-cordage" data-title="Rupture de cordage hors infarctus">
<div class="lab">Causes</div><p>Dégénérescence myxoïde, endocardite infectieuse, traumatisme thoracique fermé ; rarement rhumatisme, traité dans le cours I00.</p>
<div class="lab">Tableau</div><p>Dyspnée brutale ou aggravation rapide, souffle apical nouveau, fibrillation auriculaire parfois.</p>
<div class="lab">Examens</div><p>Échocardiographie transthoracique puis transœsophagienne : segment flottant, fuite excentrique, recherche de végétation.</p>
<div class="lab">Traitement</div><p>Traitement de la congestion, puis réparation mitrale, souvent possible. En cas d’endocardite, le traitement suit le cours I33.</p></template>

<template data-pop="i51-civ-acquise" data-title="Communication interventriculaire acquise">
<div class="lab">Causes</div><p>Infarctus ancien, traumatisme thoracique, myectomie septale, remplacement valvulaire aortique, endocardite avec abcès septal.</p>
<div class="lab">Évaluation</div><p>Taille et siège du défaut, rapport Qp/Qs, dilatation des cavités gauches, pression pulmonaire, fonction du ventricule droit.</p>
<div class="lab">Traitement</div><p>Fermeture chirurgicale ou percutanée si le shunt est significatif ou symptomatique, décidée en équipe spécialisée ; la fermeture percutanée est surtout réservée aux patients à risque chirurgical prohibitif.</p>
<div class="lab">Piège</div><p>Une petite communication restrictive, avec un Qp/Qs bas, peut rester stable ; elle expose surtout à l’endocardite.</p></template>

<template data-pop="i51-pseudoanev" data-title="Faux anévrisme et vrai anévrisme ventriculaire">
<div class="lab">Faux anévrisme</div><p>Rupture de la paroi libre contenue par des adhérences péricardiques. Sa paroi ne contient pas de myocarde. Il a un collet étroit et siège plus souvent en position inférieure ou latérale. Il peut rester méconnu des mois, puis se rompre.</p>
<div class="lab">Vrai anévrisme</div><p>Paroi fine, cicatricielle, qui contient du tissu fibreux. Il siège surtout à l’apex ou en antérieur, après une occlusion de l’interventriculaire antérieure. Il expose au thrombus, à l’insuffisance cardiaque et à la tachycardie ventriculaire, rarement à la rupture.</p>
<div class="lab">Conduite</div><p>Faux anévrisme : avis chirurgical urgent, car il peut se rompre secondairement. Vrai anévrisme : surveillance et traitement de ses complications (thrombus, insuffisance cardiaque, tachycardie ventriculaire) ; le cours I25 en détaille la prise en charge.</p>
</template>

<template data-pop="i51-chagas" data-title="Cardiopathie de la maladie de Chagas">
<div class="lab">Agent</div><p><i>Trypanosoma cruzi</i>, parasite transmis par des punaises hématophages en Amérique latine, et aussi par voie materno-fœtale, transfusionnelle ou par greffe.</p>
<div class="lab">Histoire naturelle</div><p>Après une phase aiguë souvent inaperçue, la plupart des personnes restent en phase chronique indéterminée, sans atteinte d’organe. Une partie développe une atteinte cardiaque ou digestive des années plus tard.</p>
<div class="lab">Atteinte cardiaque</div><p>Myocardite chronique fibrosante : bloc de branche droite et hémibloc antérieur gauche, bradycardie, tachycardie ventriculaire, anévrisme apical, thrombus et embolies, insuffisance cardiaque.</p>
<div class="lab">Traitement</div><p>Le traitement antiparasitaire est proposé dans la phase indéterminée et chez les jeunes. Dans la cardiopathie installée, l’essai BENEFIT (2015) n’a pas montré que le benznidazole réduisait la dégradation clinique. Le traitement repose alors sur celui de l’insuffisance cardiaque, des arythmies et sur l’anticoagulation en cas d’anévrisme avec thrombus.</p>
</template>

<template data-pop="i51-diphterie" data-title="Myocardite diphtérique">
<div class="lab">Mécanisme</div><p>La toxine de <i>Corynebacterium diphtheriae</i> bloque la synthèse protéique des cellules, dont les cardiomyocytes et les cellules du tissu de conduction.</p>
<div class="lab">Tableau</div><p>Elle survient habituellement une à deux semaines après l’angine, avec des blocs de conduction, des arythmies et une insuffisance cardiaque. Elle est une cause majeure de décès de la diphtérie.</p>
<div class="lab">Traitement</div><p>Antitoxine le plus tôt possible, antibiotique, surveillance ECG prolongée, stimulation temporaire si nécessaire.</p>
<div class="lab">Prévention en Suisse</div><p>La vaccination selon le Plan de vaccination suisse de l’OFSP, avec des rappels à l’âge adulte, prévient la maladie. Des cas surviennent encore chez des personnes non vaccinées, notamment chez des migrants.</p>
</template>

<template data-pop="i51-pr-coeur" data-title="Cœur et polyarthrite rhumatoïde">
<div class="lab">Atteintes</div><p>Péricardite, souvent asymptomatique et découverte à l’échocardiographie ; nodules rhumatoïdes valvulaires ou myocardiques ; myocardite ; troubles de conduction par nodule septal. La maladie accélère aussi l’athérosclérose coronaire.</p>
<div class="lab">Mécanisme</div><p>L’inflammation systémique, avec des cytokines comme le TNF-α et l’IL-6, lèse les tuniques cardiaques et l’endothélium coronaire.</p>

<div class="lab">Conséquence pratique</div><p>Le contrôle de l’activité inflammatoire et des facteurs de risque cardiovasculaire réduit le risque cardiaque ; le cours M06 traite la polyarthrite rhumatoïde.</p></template>

<template data-pop="i51-lyme" data-title="Cardite de Lyme">
<div class="lab">Tableau</div><p>Bloc auriculoventriculaire d’intensité variable, qui peut passer en quelques heures du premier degré au bloc complet ; plus rarement myopéricardite. Elle survient quelques semaines après la piqûre de tique, chez un adulte souvent jeune.</p>
<div class="lab">Diagnostic</div><p>Contexte d’exposition, érythème migrant récent, sérologie de <i>Borrelia</i> ; ECG répétés, car le bloc fluctue.</p>
<div class="lab">Traitement</div><p>Antibiothérapie et stimulation temporaire si nécessaire. Le bloc régresse habituellement sous traitement, ce qui évite le plus souvent un stimulateur définitif.</p>
<div class="lab">Conséquence pratique</div><p>Un bloc de haut degré inexpliqué chez un adulte jeune en zone d’endémie suisse fait chercher une borréliose avant toute stimulation définitive. Le cours I44 détaille la conduite devant un bloc.</p></template>

<template data-pop="i51-ict" data-title="Index cardiothoracique">
<div class="lab">Mesure</div><p>Sur une radiographie de face, en position debout et en inspiration, le médecin divise le plus grand diamètre transversal du cœur par le plus grand diamètre interne du thorax.</p>
<div class="lab">Normal</div><p>Inférieur ou égal à 0,5 chez l’adulte.</p>
<div class="lab">Pièges</div><p>Un cliché couché, de face antéropostérieure, ou en expiration agrandit l’ombre cardiaque. Un épanchement péricardique élargit la silhouette sans dilatation du cœur.</p>
<div class="lab">Conséquence pratique</div><p>Un index élevé appelle une échocardiographie, qui distingue dilatation, hypertrophie et épanchement.</p></template>

<template data-pop="i51-ppcm" data-title="Cardiomyopathie du péripartum et thrombus">
<div class="lab">Définition</div><p>Insuffisance cardiaque avec FEVG inférieure à 45 %, apparue en fin de grossesse ou dans les mois suivant l’accouchement, sans autre cause.</p>
<div class="lab">Risque thrombotique</div><p>La dilatation ventriculaire et l’état d’hypercoagulabilité du post-partum favorisent le thrombus et l’embolie.</p>
<div class="lab">Conséquence pratique</div><p>Une échocardiographie recherche le thrombus. S’il est présent, l’anticoagulation est indiquée ; pendant la grossesse, elle se fait par HBPM. Le cours I42 traite la maladie et son traitement spécifique.</p></template>

<template data-pop="i51-hbpm" data-title="Énoxaparine (Clexane)">
<div class="lab">Mécanisme</div><p>Héparine de bas poids moléculaire : elle potentialise l’antithrombine et inhibe surtout le facteur Xa.</p>
<div class="lab">Repère curatif suisse et limites</div><p>Pour la TVP/EP : 1 mg/kg par voie sous-cutanée toutes les 12 heures ; l’application au thrombus ventriculaire est extrapolée. La dose unique quotidienne de 1,5 mg/kg n’est pas utilisée chez l’obèse ni chez le patient atteint d’un cancer, car son efficacité y est diminuée.</p>
<div class="lab">Insuffisance rénale</div><p>Clairance inférieure à 30 mL/min : 1 mg/kg une fois par jour.</p>
<div class="lab">Grossesse</div><p>Elle ne traverse pas le placenta aux deuxième et troisième trimestres selon l’information suisse ; elle ne s’emploie qu’en cas de besoin clinique établi. L’anesthésie neuraxiale attend au moins 24 heures après la dernière dose curative.</p>
<div class="lab">Contre-indication</div><p>Thrombopénie induite par l’héparine dans les 100 derniers jours ou anticorps circulants.</p>
<div class="lab">Source</div><p><a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=49456" target="_blank" rel="noopener">Information professionnelle suisse de Clexane</a>, mise à jour de février 2026, lue le 08.10.2026.</p></template>

<template data-pop="i51-tih" data-title="Thrombopénie induite par l’héparine">
<div class="lab">Mécanisme</div><p>Des anticorps reconnaissent le complexe formé par l’héparine et le facteur plaquettaire 4 ; ils activent les plaquettes, ce qui les consomme et provoque des thromboses.</p>
<div class="lab">Tableau</div><p>Baisse des plaquettes de plus de 50 %, habituellement entre le cinquième et le dixième jour de traitement, avec un risque de thrombose veineuse ou artérielle.</p>
<div class="lab">Conduite</div><p>Évaluation de la probabilité par le score 4T, arrêt de toute héparine, anticoagulant non héparinique, recherche des anticorps.</p>
<div class="lab">Conséquence pratique</div><p>Selon l’information suisse de Clexane, une nouvelle exposition à l’énoxaparine est contre-indiquée dans les 100 jours suivants ou tant que des anticorps circulent. Au-delà, l’absence d’anticorps ne rend pas la réexposition banale : une décision spécialisée reste nécessaire.</p></template>
