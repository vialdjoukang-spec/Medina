<template data-pop="i34-lutemb" data-title="Syndrome de Lutembacher">
<div class="lab">Définition</div><p>Association d’une communication interauriculaire, congénitale ou iatrogène (après ponction transseptale), et d’un rétrécissement mitral, le plus souvent rhumatismal.</p>
<div class="lab">Physiopathologie</div><p>Le shunt gauche-droite décharge l’oreillette gauche : la pression auriculaire gauche et le gradient mitral restent plus bas que la sévérité anatomique ne le laisse attendre. Le rétrécissement augmente en retour le shunt. Le cœur droit subit une surcharge de volume importante.</p>
<div class="lab">Pièges</div><p>Le gradient mitral et le temps de demi-pression sous-estiment la sténose : mesurer la surface par planimétrie. La commissurotomie percutanée augmente la communication si elle est large.</p>
<div class="lab">Traitement</div><p>Correction des deux lésions : commissurotomie et fermeture percutanée de la communication dans le même temps chez des patients sélectionnés, sinon chirurgie.</p></template>

<template data-pop="i34-ebstein" data-title="Maladie d’Ebstein">
<div class="lab">Définition</div><p>Malformation de la valve tricuspide : délamination incomplète des feuillets septal et postérieur, dont l’insertion fonctionnelle est déplacée vers l’apex. Chez l’adulte, un déplacement apical du feuillet septal ou postérieur ≥ 0,8 cm/m² de surface corporelle est retenu par l’ESC 2020 sur les cardiopathies congénitales de l’adulte.</p>
<div class="lab">Conséquences</div><p>Portion du ventricule droit « atrialisée », ventricule droit fonctionnel réduit, fuite tricuspide souvent sévère, oreillette droite géante.</p>
<div class="lab">Associations</div><p>Communication interauriculaire ou foramen ovale perméable (cyanose par shunt droite-gauche, embolie paradoxale) ; voies accessoires avec syndrome de Wolff-Parkinson-White et tachycardies : le développement anormal de l’anneau tricuspide laisse persister des connexions musculaires entre oreillette et ventricule droits, qui court-circuitent le nœud auriculoventriculaire.</p>
<div class="lab">Traitement</div><p>Chirurgie dans un centre de cardiopathies congénitales, idéalement par reconstruction en cône, en cas de symptômes, de cyanose, de dilatation droite progressive ou d’embolie paradoxale ; ablation des voies accessoires.</p></template>

<template data-pop="i34-koch" data-title="Triangle de Koch">
<div class="lab">Limites</div><p>Zone de l’oreillette droite délimitée par l’insertion du feuillet septal tricuspide, le tendon de Todaro et l’orifice du sinus coronaire.</p>
<div class="lab">Contenu</div><p>Nœud auriculoventriculaire compact, à son sommet ; le faisceau de His part de ce sommet et traverse le corps fibreux central.</p>
<div class="lab">Corrélation clinique</div><p>Les sutures d’une annuloplastie tricuspide près du feuillet septal, la force radiale exercée par une prothèse tricuspide percutanée ou une endocardite de cette région peuvent léser le tissu de conduction : bloc auriculoventriculaire, stimulateur. Les anneaux tricuspides chirurgicaux sont ouverts en regard de cette zone pour l’épargner.</p></template>

<template data-pop="i34-irm" data-title="IRM cardiaque dans les valvulopathies">
<div class="lab">Question clinique</div><p>Quelle est la sévérité réelle d’une fuite lorsque l’échocardiographie est discordante, et quels sont les volumes et la fonction des ventricules, surtout du droit ?</p>
<div class="lab">Principe</div><p>Ciné-IRM : volumes ventriculaires de référence. Contraste de phase : débit aortique ou pulmonaire. Volume régurgité mitral = volume d’éjection du ventricule gauche − débit aortique ; fraction régurgitée = volume régurgité / volume d’éjection.</p>
<div class="lab">Seuils</div><p>Fraction régurgitée mitrale ≥ 50 % : fuite sévère ; 40–49 % : modérée à sévère (EACVI 2022). Fuite pulmonaire après Fallot : volumes droits indexés (télédiastolique ≥ 160 mL/m², télésystolique ≥ 80 mL/m²).</p>
<div class="lab">Tissu</div><p>Rehaussement tardif des piliers et de la paroi inférolatérale dans le prolapsus arythmogène : il signale une fibrose, attribuée à la traction répétée du feuillet, et il est associé aux arythmies ventriculaires et à la mort subite.</p>
<div class="lab">Limites</div><p>Arythmie (fibrillation auriculaire rapide), dispositifs non compatibles, disponibilité ; voir aussi la fiche générale <button class="w" data-k="irm">IRM cardiaque</button>.</p></template>

<template data-pop="i34-fallot" data-title="Valve pulmonaire après réparation de tétralogie de Fallot">
<div class="lab">Origine</div><p>La réparation chirurgicale de l’enfance élargit souvent l’anneau pulmonaire par un patch transannulaire : la valve devient incontinente.</p>
<div class="lab">Évolution</div><p>Fuite pulmonaire libre bien tolérée pendant des années, puis dilatation et dysfonction du ventricule droit, fuite tricuspide, arythmies ventriculaires et mort subite.</p>
<div class="lab">Surveillance</div><p>IRM cardiaque périodique, ECG (durée du QRS, plus longue et plus vite croissante chez les patients qui font une tachycardie ventriculaire ou une mort subite), épreuve d’effort cardiorespiratoire.</p>
<div class="lab">Traitement (ESC 2020)</div><p>Remplacement valvulaire pulmonaire chirurgical ou percutané chez le patient symptomatique ; à envisager chez l’asymptomatique devant une dilatation droite progressive (volume télésystolique indexé ≥ 80 mL/m² et/ou télédiastolique ≥ 160 mL/m²), une dysfonction droite ou une progression de la fuite tricuspide.</p></template>

<template data-pop="i34-matterhorn" data-title="Essai MATTERHORN (2024)">
<div class="lab">Plan</div><p>Essai randomisé de non-infériorité chez des patients porteurs d’une fuite mitrale secondaire, ventriculaire pour 84 % d’entre eux, jugés opérables ; réparation bord à bord percutanée contre chirurgie mitrale (réparation ou remplacement).</p>
<div class="lab">Résultats</div><p>À un an, la réparation percutanée n’était pas inférieure à la chirurgie pour le critère composite (décès, hospitalisation pour insuffisance cardiaque, réintervention mitrale, assistance ventriculaire, accident vasculaire cérébral), avec un meilleur profil de sécurité (ESC/EACTS 2025).</p>
<div class="lab">Portée</div><p>Chez le patient avec fuite secondaire qui a une indication d’intervention, la voie percutanée est une option lorsque l’anatomie le permet ; la chirurgie garde sa place lorsqu’un pontage est nécessaire, et la chirurgie mitrale isolée reste restreinte faute de bénéfice démontré sur la mortalité.</p></template>

<template data-pop="i34-vinv" data-title="Valve-in-valve et valve-in-ring mitrales">
<div class="lab">Principe</div><p>Une valve percutanée expansible est implantée à l’intérieur d’une bioprothèse dégénérée (valve-in-valve) ou d’un anneau d’annuloplastie (valve-in-ring), le plus souvent par voie veineuse fémorale et transseptale.</p>
<div class="lab">Indications</div><p>Dysfonction d’une bioprothèse ou échec d’une réparation chez un patient à risque élevé de réintervention chirurgicale, décidée par l’équipe cardiaque.</p>
<div class="lab">Risques</div><p>Obstruction de la chambre de chasse du ventricule gauche par le feuillet antérieur repoussé (évaluée par tomodensitométrie avant le geste) ; gradient résiduel élevé dans les petites prothèses ; fuite paravalvulaire. Les résultats sont meilleurs en valve-in-valve qu’en valve-in-ring : la collerette rigide et circulaire d’une bioprothèse ancre bien la valve, alors qu’un anneau d’annuloplastie, souvent ouvert ou non circulaire, s’y adapte mal. Les chiffres de registre comparant les deux techniques n’ont pas été vérifiés dans une source lue pour ce cours.</p></template>

<template data-pop="i34-d-avk" data-title="Antivitamines K dans les valvulopathies">
<div class="lab">Molécules en Suisse</div><p>Phenprocoumone (Marcoumar® ; demi-vie d’environ 160 heures) et acénocoumarol (Sintrom® ; demi-vie de 8 à 11 heures), selon leurs informations professionnelles suisses ; la warfarine n’est pas commercialisée en Suisse.</p>
<div class="lab">Mécanisme</div><p>Inhibition de la vitamine K époxyde réductase (VKORC1) : baisse de la synthèse des formes actives des facteurs II, VII, IX et X, et des protéines C et S.</p>
<div class="lab">Indications propres au chapitre</div><p>Rétrécissement mitral rhumatismal ≤ 2,0 cm² avec fibrillation auriculaire, embolie ou thrombus (INR 2,0–3,0) ; prothèse mécanique (cible selon la fiche <button class="w" data-k="i34-inr-prot">INR des prothèses</button>) ; trois premiers mois après bioprothèse mitrale ou tricuspide ; après réparation chirurgicale, antivitamine K ou AOD (ESC/EACTS 2025, classe IIa).</p>
<div class="lab">Preuves</div><p>INVICTUS : supériorité sur le rivaroxaban dans la cardiopathie rhumatismale avec fibrillation. RE-ALIGN : supériorité sur le dabigatran chez les porteurs de prothèse mécanique.</p>
<div class="lab">Mise en route</div><p>Sans dose de charge, avec contrôles de l’INR rapprochés ; chevauchement avec une héparine lorsqu’un effet rapide est nécessaire (thrombus, prothèse), jusqu’à deux INR dans la cible. L’INR monte d’abord par la chute du facteur VII, de demi-vie courte, alors que la prothrombine, qui porte l’essentiel de l’effet antithrombotique, disparaît en plusieurs jours ; la protéine C anticoagulante chute presque aussi vite que le facteur VII. Une dose de charge accentue ce déséquilibre initial.</p>
<div class="lab">Surdosage</div><p>INR élevé sans saignement : suspendre une ou plusieurs prises. Entre 4,5 et 10, la vitamine K orale ajoutée n’a pas montré de bénéfice ; au-delà de 10, l’ESC/EACTS 2025 recommande 2 à 3 mg de vitamine K (phytoménadione) par voie orale, sans correction excessive. Hémorragie grave : concentré de complexe prothrombinique, qui apporte immédiatement les facteurs manquants et est préféré au plasma frais congelé, et vitamine K intraveineuse, qui en relance la synthèse ; la voie intraveineuse corrige l’INR environ quatre heures plus vite que la voie orale. Porteur de prothèse mécanique : éviter une correction excessive.</p>
<div class="lab">Contre-indications</div><p>Hémorragie active ; grossesse (contre-indication dans les informations professionnelles suisses de Marcoumar® et de Sintrom®, alors que l’ESC 2025 sur la grossesse admet l’antivitamine K à faible dose dans des situations choisies) ; adhésion impossible aux contrôles ; insuffisance rénale sévère pour Sintrom®. Interactions : voir la fiche <button class="w" data-k="i48-avk">antivitamines K</button> et l’onglet Pharmacologie.</p></template>

<template data-pop="i34-d-ssa" data-title="Analogues de la somatostatine (cardiopathie carcinoïde)">
<div class="lab">Molécules et doses (informations professionnelles suisses)</div><p>Octréotide retard (Sandostatine® LAR) : dans les tumeurs neuroendocrines fonctionnelles de l’intestin moyen, 20 mg en intramusculaire profonde toutes les 4 semaines, puis 10 à 30 mg selon le contrôle des symptômes après 3 mois ; forme sous-cutanée à action courte en complément au début. Lanréotide (Somatuline® Autogel) : symptômes des tumeurs neuroendocrines, 60 mg tous les 28 jours au départ, jusqu’à 120 mg.</p>
<div class="lab">Mécanisme</div><p>Activation des récepteurs de la somatostatine des cellules tumorales neuroendocrines : moins de sécrétion de sérotonine et d’autres amines, effet antiprolifératif.</p>
<div class="lab">Place</div><p>Contrôle du syndrome carcinoïde (flush, diarrhée) et de la tumeur, donc de l’exposition des valves droites à la sérotonine. La préparation anesthésique de la chirurgie valvulaire vise à prévenir la crise carcinoïde.</p>
<div class="lab">Autre traitement</div><p>Le télotristat (Xermelo®), inhibiteur de la synthèse de la sérotonine, existe en Suisse pour la diarrhée carcinoïde ; son effet sur la cardiopathie n’est pas établi dans les sources lues.</p>
<div class="lab">Effets indésirables</div><p>Troubles digestifs ; lithiase biliaire, car la somatostatine freine la contraction de la vésicule ; troubles de la glycémie ; bradycardie.</p>
<div class="lab">Surveillance</div><p>Acide 5-hydroxyindolacétique urinaire, NT-proBNP et échocardiographie pour dépister l’atteinte cardiaque.</p>
<div class="lab">Source</div><p>Information professionnelle suisse Sandostatine® LAR, Somatuline® Autogel, Xermelo®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="i34-anticoag-valve" data-title="Pourquoi un antivitamine K et non un AOD">
<div class="lab">Physiologie normale</div><p>La coagulation démarre par deux voies. Le facteur tissulaire, exposé par une lésion, active le facteur VII. Une surface artificielle active le facteur XII, puis le facteur XI : c’est la voie de contact. Les deux voies convergent vers le facteur X activé, qui produit la thrombine. Un antivitamine K abaisse la synthèse fonctionnelle des facteurs II, VII, IX et X ; il freine donc les deux voies en amont. Un AOD inhibe une seule enzyme, le facteur Xa ou la thrombine, à une concentration qui varie entre le pic et la vallée.</p>
<div class="lab">Mécanisme : prothèse mécanique</div><p>Les ailettes et surtout la collerette de suture activent la voie de contact. In vitro, elles augmentent la production de thrombine de 1,2 à 1,8 fois, et cet excès disparaît dans un plasma privé de facteur XII. Le dabigatran la freine à peine en dessous de 400 ng/mL, alors que le plasma de patients sous warfarine la supprime dès un INR &gt; 1,5. La thrombine formée au contact de la prothèse dépasse donc la capacité du dabigatran aux concentrations usuelles ; aucun AOD n’a fait la preuve de son efficacité sur une prothèse mécanique.</p>
<div class="lab">Mécanisme : rétrécissement mitral</div><p>L’obstacle ralentit le flux dans toute l’oreillette gauche dilatée. La stase y produit un contraste spontané et des thrombus, dans l’auricule mais aussi dans le corps de l’oreillette. Le risque embolique dépend donc d’abord de l’obstacle. La raison de l’échec du rivaroxaban dans cette situation reste inconnue.</p>
<div class="lab">Conséquence clinique</div><p>L’essai RE-ALIGN, chez 252 porteurs de prothèse mécanique, a été arrêté prématurément. Un accident vasculaire cérébral est survenu chez 5 % des patients sous dabigatran et chez aucun sous warfarine ; une hémorragie majeure, toujours péricardique, chez 4 % contre 2 %. Dans l’essai <button class="w" data-k="i34-invictus">INVICTUS</button>, chez 4 565 patients avec cardiopathie rhumatismale et fibrillation, le rivaroxaban a fait plus d’événements cardiovasculaires et de décès que l’antivitamine K, sans différence d’hémorragies majeures.</p>
<div class="lab">Ce qui change la décision</div><p>Les AOD sont contre-indiqués avec une prothèse mécanique (ESC/EACTS 2025, classe III, niveau A) et dans la fibrillation avec rétrécissement mitral rhumatismal de surface ≤ 2,0 cm² (classe III, niveau B). Ils sont au contraire préférés aux antivitamines K dans la fibrillation avec sténose ou fuite aortique, ou avec fuite mitrale (classe I), car les sous-groupes valvulaires des grands essais les soutiennent. Après une bioprothèse, au-delà des trois premiers mois, ils sont aussi préférés en cas de fibrillation (classe IIa).</p>
<div class="lab">Source</div><p>Praz et al., 2025 ESC/EACTS Guidelines for the management of valvular heart disease, Eur Heart J 2025;46:4635–4736. Eikelboom et al., Dabigatran versus warfarin in patients with mechanical heart valves, N Engl J Med 2013;369:1206–14. Connolly et al., Rivaroxaban in rheumatic heart disease-associated atrial fibrillation, N Engl J Med 2022;387:978–88. Jaffer et al., J Am Heart Assoc 2015;4:e002322.</p></template>
<template data-pop="i34-avk-interact" data-title="Interactions des antivitamines K">
<div class="lab">Physiologie normale</div><p>Les facteurs II, VII, IX et X ne deviennent actifs qu’après une gamma-carboxylation qui consomme de la vitamine K réduite. La vitamine K époxyde réductase régénère cette forme réduite, et les antivitamines K bloquent cette enzyme. L’INR reflète donc l’équilibre entre la dose d’antivitamine K, son élimination et l’apport de vitamine K.</p>
<div class="lab">Mécanismes</div><p>Les informations professionnelles suisses citent trois mécanismes : perturbation de l’absorption, inhibition ou induction des enzymes hépatiques, moindre disponibilité de la vitamine K. L’acénocoumarol est hydroxylé surtout par le CYP2C9 (accessoirement CYP2C19, CYP1A2, CYP3A4) ; la phenprocoumone dépend du CYP2C9 et du CYP3A4. Un inhibiteur de ces enzymes (amiodarone, fluconazole et autres azolés, certains antibiotiques) élève la concentration et l’INR ; un inducteur (rifampicine, carbamazépine, barbituriques, millepertuis) l’abaisse. Le pamplemousse, inhibiteur du CYP3A4, renforce l’effet de la phenprocoumone. Un paracétamol pris régulièrement ou à forte dose renforce aussi l’effet anticoagulant.</p>
<div class="lab">Substances à surveiller</div><p>Renforcent l’effet : amiodarone, allopurinol, anti-inflammatoires (salicylés, certains anti-inflammatoires non stéroïdiens), inhibiteurs sélectifs de la recapture de la sérotonine, statines, tramadol, hormones thyroïdiennes ; antibiotiques (amoxicilline, céphalosporines, cotrimoxazole, macrolides, quinolones, tétracyclines, clindamycine) ; dérivés imidazolés (métronidazole, miconazole, même en application locale, pour Sintrom®) et triazolés. Diminuent l’effet : rifampicine, carbamazépine, barbituriques, cholestyramine, millepertuis, produits contenant de la vitamine K.</p>
<div class="lab">Conséquence clinique</div><p>Une hausse de l’INR expose à l’hémorragie ; une baisse expose le porteur de prothèse mécanique à la thrombose de valve. L’information professionnelle de Sintrom® recommande des contrôles fréquents (par exemple deux fois par semaine) lors de toute nouvelle prescription ou de tout arrêt d’un médicament associé ; celle de Marcoumar® demande une surveillance attentive de l’INR au début et à l’arrêt du millepertuis.</p>
<div class="lab">Ce qui change la décision</div><p>Au début ou à l’arrêt d’un médicament qui interagit, l’INR se contrôle dans les jours qui suivent, puis jusqu’à stabilisation. On choisit si possible un antibiotique sans interaction connue. Avec l’amiodarone, on réduit la dose d’antivitamine K et l’on rapproche les contrôles. Une instabilité de l’INR ne justifie pas un passage aux AOD chez un porteur de prothèse mécanique ou de rétrécissement mitral rhumatismal.</p>
<div class="lab">Source</div><p>Information professionnelle suisse Marcoumar® et Sintrom®, Swissmedic (AIPS), consultée le 08.10.2026 ; ESC/EACTS 2025.</p></template>
<template data-pop="i34-ch-aod" data-title="AOD et valvulopathies : recommandation européenne et information professionnelle suisse">
<div class="lab">Position de l’ESC/EACTS 2025</div><p>Chez un patient porteur d’une valvulopathie native avec fibrillation auriculaire, les AOD sont recommandés de préférence aux antivitamines K en cas de rétrécissement ou de fuite aortique et de fuite mitrale (classe I), car les sous-groupes valvulaires des grands essais de l’apixaban, du dabigatran, de l’édoxaban et du rivaroxaban les soutiennent. Deux exceptions : la prothèse mécanique (AOD non recommandés, classe III, niveau A) et le rétrécissement mitral rhumatismal de surface ≤ 2,0 cm² (classe III, niveau B, essai INVICTUS). Après une bioprothèse, au-delà de trois mois, un AOD est à préférer en cas de fibrillation (IIa).</p>
<div class="lab">Position des informations professionnelles suisses (AIPS, consultées le 08.10.2026)</div><p>Eliquis®, Xarelto®, Pradaxa® et Lixiana® sont autorisés dans la « fibrillation auriculaire non valvulaire », sans que les notices consultées définissent ce terme par rapport aux fuites mitrales ou tricuspides. Lixiana® n’est pas recommandé en cas de sténose mitrale modérée à sévère ni chez les porteurs de valves artificielles. Eliquis® n’est pas recommandé chez les porteurs de prothèses valvulaires ; Xarelto® ne l’est en principe pas chez les porteurs de valves artificielles et ne doit pas être utilisé en thromboprophylaxie après TAVI. Pradaxa® est contre-indiqué chez les porteurs de valves cardiaques artificielles.</p>
<div class="lab">Arbitrage</div><p>Les deux sources concordent sur l’essentiel : antivitamine K seule sur prothèse mécanique et dans le rétrécissement mitral significatif. Pour une fuite mitrale ou tricuspide avec fibrillation, l’ESC/EACTS 2025, source primaire la plus récente et la plus spécifique, recommande l’AOD ; cette prescription reste compatible avec les notices, qui n’excluent pas les fuites. Après une bioprothèse, l’AOD recommandé par l’ESC sort du cadre des notices d’Eliquis®, de Xarelto® et de Lixiana® : la décision se prend après information du patient, l’antivitamine K demeurant une option conforme. Pour l’examen fédéral, retenir la position de l’ESC/EACTS 2025 et ses deux exceptions.</p>
<div class="lab">Source</div><p>ESC/EACTS 2025, section 6.2 et tableaux de recommandations 2 et 16 ; informations professionnelles suisses Eliquis®, Xarelto®, Pradaxa®, Lixiana®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="i34-ch-avk-gross" data-title="Antivitamines K et grossesse : ESC 2025 et information professionnelle suisse">
<div class="lab">Position de l’ESC 2025 sur la grossesse</div><p>Les antivitamines K traversent le placenta et exposent à l’embryopathie (0,6 à 12 % au premier trimestre, selon la dose) et à la fœtopathie. Elles sont remplacées par l’héparine de bas poids moléculaire chez la plupart des femmes, sauf en cas de fibrillation auriculaire avec sténose mitrale modérée à sévère ou de prothèse mécanique, où le risque de thrombose est moindre sous antivitamine K. Chez la porteuse de prothèse mécanique, l’antivitamine K peut être poursuivie au premier trimestre si la dose est faible (phenprocoumone ≤ 3 mg, acénocoumarol ≤ 2 mg par jour) ; à partir de la 13e semaine, décision partagée.</p>
<div class="lab">Position des informations professionnelles suisses</div><p>Marcoumar® et Sintrom® sont contre-indiqués pendant la grossesse (AIPS, consultées le 08.10.2026).</p>
<div class="lab">Arbitrage</div><p>L’ESC 2025 est la source primaire la plus récente et la plus spécifique ; elle répond à un risque maternel vital (thrombose de prothèse) que la notice ne pondère pas. Une antivitamine K pendant la grossesse sort cependant du cadre de l’autorisation suisse : elle se décide par l’équipe cardio-obstétricale d’un centre spécialisé, avec le consentement éclairé de la patiente. Pour l’examen fédéral, retenir la stratégie de l’ESC 2025 et l’existence de la contre-indication de la notice.</p>
<div class="lab">Source</div><p>ESC 2025 sur les maladies cardiovasculaires et la grossesse, sections 5 et 12.5.3 ; informations professionnelles suisses Marcoumar®, Sintrom®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
