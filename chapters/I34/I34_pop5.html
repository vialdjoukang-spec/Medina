
<!-- ===== FENÊTRES PARETO I34 ===== -->
<template data-pop="pareto-i34-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="i34-1,i34-2"></p>
<ul><li>Fuite = reflux valve fermée ; rétrécissement = obstacle valve ouverte ; maladie mixte = les deux.</li><li>Fuite mitrale <b>primaire</b> = valve malade (corriger la valve guérit) ; <b>secondaire</b> = ventricule (dilaté, infarctus) ou oreillette (anneau dilaté en FA) malade.</li><li>Carpentier : I mouvement normal (anneau, perforation) ; II excessif (prolapsus) ; IIIa restreint systole + diastole (rhumatisme) ; IIIb restreint en systole (traction).</li><li>Tricuspide : 5 grades (légère, modérée, sévère, massive, torrentielle ; ESC/EACTS 2025).</li><li>Rétrécissement mitral cliniquement sévère : surface ≤ 1,5 cm² avec symptômes, risque embolique ou décompensation (ESC/EACTS 2025).</li><li>Prolapsus 2,4 % (Framingham) ; fuite tricuspide ≥ modérée ≈ 4 % après 75 ans ; rétrécissement mitral = rhumatismal (migrants, grossesse) ou dégénératif (âge, insuffisance rénale).</li></ul></template>

<template data-pop="pareto-i34-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i34-3"></p>
<ul><li>Fuite mitrale chronique = surcharge de volume → hypertrophie excentrique + grande oreillette compliante → longue tolérance.</li><li>Postcharge basse → FEVG surestimée → opérer dès FEVG ≤ 60 % ou diamètre télésystolique ≥ 40 mm.</li><li>Fuite aiguë : petite oreillette → onde v géante → œdème pulmonaire, choc, souffle discret.</li><li>Secondaire ventriculaire : traction des piliers, fuite dynamique ; proportionnée ou non au ventricule.</li><li>Rétrécissement mitral : gradient ∝ (débit / durée de diastole)², car le sang doit franchir l’orifice dans le temps diastolique disponible → tachycardie, grossesse = œdème ; hypertension pulmonaire ; thrombus auriculaire ; ventricule gauche petit.</li><li>Fuite tricuspide : anneau dilaté (forme atriale ou ventriculaire) ; la fuite entretient la fuite ; congestion hépatique et rénale.</li><li>Fuite secondaire = traiter d’abord la cause.</li></ul></template>

<template data-pop="pareto-i34-etio" data-title="Pareto — Étiologies">
<p class="ratio" data-cover="i34-4"></p>
<ul><li>Fuite mitrale primaire : dégénérative (Barlow &lt; 60 ans, excès de tissu ; déficience fibroélastique &gt; 60 ans, rupture de cordage P2) ; endocardite ; rhumatisme ; médicaments 5-HT2B ; irradiation.</li><li>Secondaire : ischémique, cardiomyopathie dilatée ; atriale (FA, ICFEp).</li><li>Rétrécissement mitral : rhumatismal (commissures fusionnées) ; dégénératif (calcification annulaire) ; diagnostic différentiel : myxome.</li><li>Fuite tricuspide : secondaire ≈ 90 % (cœur gauche, hypertension pulmonaire, FA) ; sonde de stimulateur ; primaire (endocardite, carcinoïde, Ebstein : feuillet septal ou postérieur déplacé ≥ 0,8 cm/m²).</li><li>Lutembacher = rétrécissement mitral + communication interauriculaire : gradient faussement bas.</li><li>Valve pulmonaire : congénitale (Noonan : valve dysplasique) ; fuite après Fallot.</li></ul></template>

<template data-pop="pareto-i34-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="i34-5,i34-6"></p>
<ul><li>Chercher : origine géographique, rhumatisme, valvulotoxiques, irradiation, FA, sonde, histoire familiale.</li><li>Dyspnée = indication opératoire dans la fuite mitrale primaire sévère ; demander ce que le patient ne fait plus.</li><li>Hémoptysie, embolie, dysphonie : rétrécissement mitral.</li><li>Fuite mitrale : souffle holosystolique apexien → aisselle ; prolapsus : clic mésosystolique, plus précoce debout et en Valsalva.</li><li>Rétrécissement mitral : éclat de B1, claquement d’ouverture (intervalle court = serré), roulement grave à la cloche en décubitus latéral gauche (durée = sévérité), renforcement présystolique absent en FA, car il naît de la contraction auriculaire.</li><li>Fuite tricuspide : souffle xiphoïdien augmenté à l’inspiration (Carvallo), onde v jugulaire, foie pulsatile.</li><li>Intensité du souffle ≠ sévérité : elle dépend de la vitesse du jet, du débit et de la paroi thoracique ; une fuite massive à pressions égalisées peut être presque silencieuse.</li></ul></template>

<template data-pop="pareto-i34-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i34-7"></p>
<ul><li>Quatre questions : lésion, mécanisme, sévérité, retentissement.</li><li>ETT = examen de référence de première ligne ; quantification intégrée (vena contracta, PISA, flux veineux).</li><li>Rétrécissement mitral : planimétrie (référence) + PHT + gradient moyen.</li><li>ETO 3D : anatomie avant réparation, thrombus avant commissurotomie. Effort : discordance. IRM : fraction régurgitée, volumes droits. Cathétérisme : discordance, résistances pulmonaires avant intervention tricuspide.</li><li>Décision par l’équipe cardiaque (risque opératoire, fragilité, souhait du patient).</li></ul></template>

<template data-pop="pareto-i34-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="i34-8"></p>
<ul><li>Œdème pulmonaire + hypotension + ventricule hyperkinétique = fuite mitrale aiguë (pilier postéromédial après infarctus inférieur, cordage, endocardite) → vasodilatateur si PAS le permet, assistance, chirurgie urgente.</li><li>Œdème pulmonaire sur rétrécissement mitral = tachycardie → ralentir (bêtabloquant), diurétique, anticoagulation ; pas d’inotrope (il accélère le cœur et raccourcit la diastole) ; commissurotomie si réfractaire.</li><li>Complications : FA, embolies, hypertension pulmonaire, endocardite, mort subite du prolapsus arythmogène, insuffisance cardiaque terminale.</li></ul></template>

<template data-pop="pareto-i34-imp" data-title="Pareto — Insuffisance mitrale primaire">
<p class="ratio" data-cover="i34-9"></p>
<ul><li>Aucun médicament ne change l’histoire naturelle.</li><li>Classe I : symptômes ; ou FEVG ≤ 60 % ; ou diamètre télésystolique ≥ 40 mm (≥ 20 mm/m²) ; ou ≥ 3 critères parmi FA, PAPs &gt; 50 mmHg, OG ≥ 60 mL/m² ou ≥ 55 mm, fuite tricuspide ≥ modérée (réparation durable probable, faible risque). IIa : FA due à la fuite ou PAPs &gt; 50 mmHg (chirurgie) ; OG dilatée seule (réparation en centre de référence, si durable). Fuite tricuspide modérée seule : surveillance. Ces marqueurs prédisent une mortalité plus élevée après chirurgie.</li><li>Réparer &gt; remplacer : appareil sous-valvulaire conservé (géométrie et fonction ventriculaires préservées), mortalité ≈ 1,2 % chez des patients sélectionnés, pas d’anticoagulation à vie, 87,5 % sans fuite modérée ou sévère 20 ans après réparation d’un prolapsus ; centre expert.</li><li>TEER : symptomatique, haut risque, anatomie favorable (IIa).</li></ul></template>

<template data-pop="pareto-i34-ims" data-title="Pareto — Insuffisance mitrale secondaire">
<p class="ratio" data-cover="i34-10"></p>
<ul><li>D’abord la cause : TMF quatre classes, CRT, revascularisation ; ≈ 40 % (selon les séries) diminuent d’un grade en 1–3 mois ; réévaluer en euvolémie.</li><li>TEER classe I (niveau A) : FEVG &lt; 50 %, fuite sévère persistante sous traitement optimisé, stable, critères remplis (type COAPT : FEVG 20–50 %, diamètre télésystolique ≤ 70 mm, PAPs ≤ 70 mmHg, ventricule droit préservé).</li><li>MITRA-FR négatif (fuite proportionnée) ; COAPT positif sur hospitalisations et mortalité ; RESHAPE-HF2 positif sur hospitalisations et qualité de vie, pas sur la mortalité.</li><li>Chirurgie surtout pendant un pontage ; isolée IIb ; MATTERHORN : TEER non inférieure à la chirurgie à un an.</li><li>Forme atriale : contrôle du rythme ; chirurgie + ablation + fermeture de l’auricule (IIa) ; TEER si non opérable (IIb).</li></ul></template>

<template data-pop="pareto-i34-rm" data-title="Pareto — Rétrécissement mitral">
<p class="ratio" data-cover="i34-11"></p>
<ul><li>Médical : bêtabloquant (allonge la diastole), diurétique prudent.</li><li>Anticoagulation : antivitamine K, INR 2,5 si FA, embolie ou thrombus ; <b>AOD non recommandés si FA et surface ≤ 2,0 cm²</b> (INVICTUS ; classe III, niveau B).</li><li>Commissurotomie percutanée = première intention si anatomie favorable (Wilkins &gt; 8 défavorable) : symptomatique ≤ 1,5 cm² (I) ; asymptomatique à risque embolique ou hémodynamique (IIa).</li><li>Contre-indications : thrombus auriculaire (ETO obligatoire), fuite plus que légère, calcification sévère ou bicommissurale, absence de fusion, lésion associée chirurgicale.</li><li>Dégénératif : pas de commissurotomie ; traitement médical ; choix de l’anticoagulant sur avis spécialisé ; interventions à haut risque, sans essai randomisé.</li><li>Prévention secondaire du rhumatisme : benzathine-benzylpénicilline.</li></ul></template>

<template data-pop="pareto-i34-it" data-title="Pareto — Insuffisance tricuspide">
<p class="ratio" data-cover="i34-12"></p>
<ul><li>Évaluer en euvolémie ; étiologie, ventricules, hypertension pulmonaire ; cathétérisme droit avant intervention ; TRI-SCORE.</li><li>Médical : diurétique de l’anse + ARM ; traiter la cause. Ces traitements soulagent la congestion sans modifier l’évolution de la fuite : ils ne doivent pas retarder l’avis d’un centre expert.</li><li>Pendant une chirurgie gauche : fuite sévère (I), modérée (IIa), légère avec anneau ≥ 40 mm ou &gt; 21 mm/m² (IIb).</li><li>Isolée primaire symptomatique : chirurgie (I) ; asymptomatique avec ventricule droit qui se dilate : IIa. Isolée secondaire, symptomatique ou ventricule droit qui se dilate, sans dysfonction sévère ni hypertension précapillaire sévère : chirurgie IIa. Haut risque : TEER ou remplacement percutané (IIa, niveau A), sans dysfonction droite sévère ni hypertension précapillaire.</li><li>TRILUMINATE et TRISCEND II : qualité de vie ↑, mortalité inchangée ; remplacement : hémorragies, stimulateur ≈ 1 patient sur 4.</li></ul></template>

<template data-pop="pareto-i34-droit" data-title="Pareto — Valves droites et polyvalvulopathies">
<p class="ratio" data-cover="i34-13,i34-14"></p>
<ul><li>Rétrécissement tricuspide : rhumatismal ou carcinoïde ; gradient moyen &gt; 5 mmHg à fréquence normale ; chirurgie avec la mitrale.</li><li>Rétrécissement pulmonaire : sévère &gt; 4 m/s (&gt; 64 mmHg) → valvuloplastie au ballon (valve en dôme) même asymptomatique.</li><li>Fuite pulmonaire après Fallot : IRM ; remplacement si symptômes ou dilatation droite progressive.</li><li>Polyvalvulopathie : chaque lésion fausse la mesure de l’autre (préférer les surfaces aux gradients) ; décider sur l’effet combiné ; traiter la lésion modérée pendant la chirurgie de la lésion sévère.</li></ul></template>

<template data-pop="pareto-i34-suivi" data-title="Pareto — Suivi, pronostic et prévention">
<p class="ratio" data-cover="i34-15"></p>
<ul><li>Fuite mitrale sévère asymptomatique : tous les 6 mois ; modérée : 1–2 ans. Rétrécissement ≤ 1,5 cm² : annuel ; &gt; 1,5 cm² : 2–3 ans.</li><li>Toute FA nouvelle = tournant (critère opératoire, choix de l’anticoagulant).</li><li>Après bioprothèse mitrale : antivitamine K 3 mois ; après réparation : antivitamine K ou AOD 3 mois (fibrillation et embolies surtout précoces) ; prothèse mécanique : antivitamine K à vie, pas d’AOD.</li><li>Après TEER : anticoagulant si FA, sinon acide acétylsalicylique au long cours ; après valve percutanée mitrale ou tricuspide : anticoagulation ≥ 6 mois ou à vie, surtout en position tricuspide (pratiques empiriques, faute d’essai). Bioprothèse ou anneau dégénérés : valve-in-valve ou valve-in-ring. Prophylaxie de l’endocardite si prothèse ou matériel.</li><li>Prévention : angines streptococciques, agonistes 5-HT2B, dépistage après irradiation, pose soignée des sondes.</li></ul></template>

<template data-pop="pareto-i34-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i34-16"></p>
<ul><li>Grossesse : rétrécissement mitral = valvulopathie la plus dangereuse (débit +30–50 %, fréquence ↑) ; intervenir avant la grossesse si &lt; 1,5 cm², même sans symptôme (ESC 2025 sur la grossesse, classe I) ; bêtabloquant, diurétique si congestion persistante, anticoagulation si FA, thrombus ou embolie ; commissurotomie si symptômes sévères ou PAPs &gt; 50 mmHg malgré le traitement (IIa) ; césarienne si sténose sévère ; post-partum à risque.</li><li>Fuites mitrale et tricuspide : bien tolérées pendant la grossesse.</li><li>Sujet âgé : fragilité, techniques percutanées, bénéfice surtout sur la qualité de vie.</li><li>Créatinine ↑ dans la fuite tricuspide = souvent congestion rénale.</li><li>Ordre des décisions du cas : fréquence → congestion → antivitamine K → ETO → commissurotomie → réévaluer la tricuspide → contraception.</li></ul></template>

<template data-pop="pareto-i34-quantim" data-title="Pareto — Quantification de l’insuffisance mitrale">
<p class="ratio" data-cover="i34-e-2"></p>
<ul><li>Intégrer plusieurs critères ; ne jamais grader sur la surface du jet couleur.</li><li>Sévère (primaire) : vena contracta ≥ 7 mm ; SOR ≥ 40 mm² ; volume régurgité ≥ 60 mL ; fraction ≥ 50 % ; inversion systolique veineuse pulmonaire ; onde E &gt; 1,2 m/s (EACVI 2022).</li><li>Secondaire ventriculaire : SOR ≥ 30 mm² et/ou volume ≥ 45 mL = pronostic défavorable.</li><li>PISA : débit = 2π r² × Va ; SOR = débit / Vmax ; volume = SOR × ITV ; raccourci SOR ≈ r² / 2 (Va 40 cm/s, Vmax 5 m/s).</li><li>Pièges : rayon au carré, orifice en croissant, fuite télésystolique.</li></ul></template>

<template data-pop="pareto-i34-quantrm" data-title="Pareto — Rétrécissement mitral et cœur droit">
<p class="ratio" data-cover="i34-e-3,i34-e-4"></p>
<ul><li>Surface = paramètre décisionnel ; planimétrie = référence ; PHT : surface = 220 / PHT (faux après commissurotomie, avec fuite aortique).</li><li>Gradient moyen : soutien, dépend de la fréquence (sévère à bas gradient : surface &lt; 1,5 cm² et gradient &lt; 10 mmHg) ; mesurer sur ≥ 5 cycles en FA.</li><li>Wilkins (mobilité, épaississement, sous-valvulaire, calcification ; 4–16) &gt; 8 défavorable.</li><li>Effort : gradient moyen &gt; 15 mmHg (&gt; 18 sous dobutamine) ou PAPs ≥ 60 mmHg = significatif (EACVI 2016).</li><li>Tricuspide : vena contracta 7–13 sévère, 14–20 massive, ≥ 21 torrentielle ; inversion sus-hépatique ; pression pulmonaire sous-estimée si fuite torrentielle → cathétérisme.</li><li>Pulmonaire : &gt; 4 m/s sévère ; préciser le niveau de l’obstacle.</li></ul></template>

<template data-pop="pareto-i34-exam" data-title="Pareto — Hiérarchie des examens, ECG, biologie">
<p class="ratio" data-cover="i34-e-1,i34-e-5"></p>
<ul><li>ETT (référence de première ligne) → ETO 3D (anatomie, thrombus) → effort (discordance) → IRM (fraction régurgitée, volumes droits) → cathétérisme (hémodynamique, obligatoire avant intervention tricuspide).</li><li>ECG : P mitrale, FA, hypertrophie droite ; ondes T inférieures négatives dans le prolapsus arythmogène.</li><li>Radiographie : oreillette gauche (double contour, angle trachéal élargi), congestion.</li><li>Biologie : NT-proBNP (pronostic), foie de congestion, créatinine, INR ; antistreptolysines seulement en crise aiguë.</li><li>Cathétérisme : onde v non spécifique ; résistances &gt; 2 unités Wood = composante précapillaire.</li></ul></template>

<template data-pop="pareto-i34-sci1" data-title="Pareto — Anatomie, histologie, physiologie">
<p class="ratio" data-cover="i34-sa,i34-sh,i34-sp"></p>
<ul><li>Appareil mitral : anneau en selle, deux feuillets (postérieur : P1–P3), cordages, deux piliers.</li><li>Pilier postéromédial = une seule artère → rupture après infarctus inférieur.</li><li>Nœud auriculoventriculaire près de l’anneau tricuspide → bloc après geste tricuspide.</li><li>Feuillet trilaminaire (fibrosa, spongiosa, atrialis), avasculaire ; myxoïde = spongiosa expansée ; rhumatisme = fusion commissurale (ballon efficace) ; dégénératif = calcification basale (ballon inutile).</li><li>Conservation du débit (PISA, continuité) ; Bernoulli : gradient = 4 v² ; Gorlin : gradient ∝ débit² ; tachycardie = gradient ↑.</li><li>Compliance auriculaire : fuite chronique tolérée, fuite aiguë brutale.</li><li>Embryologie : bourrelets endocardiques ; défaut de fusion = fente mitrale ; délamination incomplète = Ebstein.</li></ul></template>

<template data-pop="pareto-i34-sci2" data-title="Pareto — Immunologie, génétique, sérotonine">
<p class="ratio" data-cover="i34-si,i34-sg"></p>
<ul><li>Rhumatisme = auto-immunité après angine à streptocoque du groupe A : mimétisme protéine M – myosine ; chaque récidive aggrave → prévention secondaire.</li><li>Critères de Jones : infection streptococcique prouvée + manifestations majeures (cardite, y compris échographique, arthrite, chorée, érythème marginé, nodules) et mineures ; détail dans le cours I00.</li><li>Prévention primaire : traitement antibiotique précoce de l’angine streptococcique, avant que la réponse croisée ne s’installe (ESC/EACTS 2025).</li><li>Prolapsus familial (<i>FLNA</i>, <i>DCHS1</i>, <i>DZIP1</i>) ; syndromique (Marfan, <i>FBN1</i>) → surveiller l’aorte ; Noonan (<i>PTPN11</i>) → valve pulmonaire dysplasique.</li><li>Récepteur 5-HT2B → fibrose valvulaire : carcinoïde (cœur droit), fenfluramine, ergotamine, méthysergide, cabergoline.</li></ul></template>


<template data-pop="pareto-i34-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i34-p-1,i34-p-2,i34-p-3,i34-p-4,i34-p-5"></p>
<ul><li>Aucun médicament ne corrige une lésion primaire ; ne pas retarder l’intervention chez un patient « stabilisé ».</li><li>Antivitamine K obligatoire : rétrécissement rhumatismal ≤ 2,0 cm² avec FA, embolie ou thrombus (INR 2,5) ; prothèse mécanique mitrale ou tricuspide : INR 3,0 (2,5–3,5), ou 3,5 (3,0–4,0) avec facteur prothrombotique additionnel ; 3 mois après bioprothèse mitrale (après réparation : antivitamine K ou AOD). AOD ailleurs.</li><li>Bêtabloquant β1-sélectif (métoprolol, bisoprolol) : allonge la diastole ; vérapamil ou diltiazem si FEVG conservée ; digoxine en appoint.</li><li>Diurétique de l’anse ± spironolactone ; torasémide si œdème digestif.</li><li>Benzathine-benzylpénicilline 1,2 million d’unités toutes les 3–4 semaines ; durée selon l’atteinte (jusqu’à 40 ans, parfois à vie).</li><li><button class="w" data-k="i34-avk-interact">Interactions de l’antivitamine K</button> : amiodarone, antibiotiques, azolés (INR ↑) ; rifampicine, carbamazépine (INR ↓).</li><li>À éviter : inotropes et vasodilatateurs puissants dans le rétrécissement serré ; agonistes 5-HT2B ; AINS.</li><li>Cardiopathie carcinoïde : analogues de la somatostatine (octréotide, lanréotide) avant la chirurgie ; préparation anesthésique contre la crise carcinoïde.</li></ul></template>
