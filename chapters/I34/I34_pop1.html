
<!-- ===== FENÊTRES I34 : notions fondamentales et physiopathologie ===== -->
<template data-pop="i34-sa-app" data-title="Appareil mitral">
<div class="lab">Cinq composants</div><p>Anneau en forme de selle ; feuillet antérieur, large, en continuité fibreuse avec la valve aortique ; feuillet postérieur, étroit, divisé en trois segments (P1, P2, P3) ; cordages ; deux piliers (antérolatéral et postéromédial) insérés sur la paroi du ventricule gauche.</p>
<div class="lab">Fonctionnement</div><p>En systole, les piliers se contractent et les cordages empêchent les feuillets de dépasser le plan de l’anneau. La hauteur de la surface de coaptation assure l’étanchéité avec une marge de sécurité.</p>
<div class="lab">Corrélation clinique</div><p>Une fuite peut naître de chacun des composants : anneau dilaté (forme atriale), feuillet malade (prolapsus, rhumatisme), cordage rompu, pilier rompu ou déplacé (infarctus), paroi ventriculaire dilatée (forme ventriculaire).</p></template>

<template data-pop="i34-gorlin" data-title="Débit, gradient et surface valvulaire (Gorlin)">
<div class="lab">Relation</div><p>Surface = débit valvulaire / (constante × √gradient moyen). Le débit valvulaire est le débit cardiaque divisé par la durée de la diastole par minute (pour la valve mitrale). Autrement dit, le gradient varie avec le <b>carré</b> du débit par seconde de diastole.</p>
<div class="lab">Exemple</div><p>Un rétrécissement mitral de 1,2 cm² produit un gradient moyen de 8 mmHg à 70/min. À 120/min, la diastole raccourcit fortement, le débit par seconde de diastole augmente, et le gradient peut dépasser 18 mmHg : la pression de l’oreillette gauche franchit le seuil de l’œdème pulmonaire.</p>
<div class="lab">Conséquences</div><p>Le gradient seul n’est pas un indice de sévérité ; la surface l’est. Toute situation de débit élevé (grossesse, anémie, fièvre, fuite associée) ou de tachycardie aggrave le gradient sans modifier la surface.</p></template>

<template data-pop="i34-pisa" data-title="Méthode PISA">
<div class="lab">Principe</div><p>Le sang converge vers l’orifice régurgitant en couches hémisphériques de vitesse croissante. En Doppler couleur, on mesure le rayon r de l’hémisphère où la vitesse atteint la vitesse de repliement Va. Débit = 2π r² × Va ; ce débit est égal au débit à travers l’orifice.</p>
<div class="lab">Calculs</div><p>Surface de l’orifice régurgitant (SOR) = débit / vitesse maximale du jet (Doppler continu). Volume régurgité = SOR × intégrale temps-vitesse du jet.</p>
<div class="lab">Technique</div><p>Zoom sur la zone de convergence ; déplacer la ligne de base de l’échelle couleur vers le jet pour abaisser la vitesse de repliement (30 à 40 cm/s) ; mesurer le rayon en mésosystole, du point de repliement jusqu’au plan de l’orifice.</p>
<div class="lab">Seuils (fuite mitrale primaire)</div><p>SOR ≥ 40 mm² et volume régurgité ≥ 60 mL : fuite sévère. Fuite mitrale secondaire ventriculaire : SOR ≥ 30 mm² et/ou volume ≥ 45 mL associés à un pronostic défavorable (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Limites</div><p>Erreur élevée au carré sur le rayon ; orifice en croissant (fuite secondaire) ; jets multiples ; fuite non holosystolique ; convergence contrainte par la paroi.</p></template>

<template data-pop="i34-carpentier" data-title="Classification de Carpentier">
<div class="lab">Principe</div><p>Classification fonctionnelle fondée sur le mouvement des feuillets en systole et en diastole, proposée par Alain Carpentier (1983). Elle s’applique aux valves mitrale et tricuspide.</p>
<div class="lab">Types</div><p><b>I</b> : mouvement normal (dilatation de l’anneau, perforation). <b>II</b> : mouvement excessif (prolapsus, rupture de cordage ou de pilier). <b>IIIa</b> : restriction en systole et en diastole (rhumatisme, médicaments, irradiation). <b>IIIb</b> : restriction systolique (traction par les piliers déplacés).</p>
<div class="lab">Direction du jet</div><p>Type II : le jet part à l’opposé du feuillet qui prolabe (prolapsus postérieur → jet dirigé vers l’avant et le septum interauriculaire). Type IIIb : jet central, ou dirigé vers le feuillet le plus restreint (souvent postérieur).</p>
<div class="lab">Conséquence chirurgicale</div><p>Type I : annuloplastie, fermeture de la perforation. Type II : résection ou néocordages, plus annuloplastie. Type IIIa : réparation difficile, remplacement fréquent. Type IIIb : traitement du ventricule, annuloplastie ou remplacement avec conservation des cordages.</p></template>

<template data-pop="i34-mvp" data-title="Prolapsus valvulaire mitral">
<div class="lab">Définition échographique</div><p>Déplacement systolique d’au moins un feuillet de plus de 2 mm au-dessus du plan de l’anneau (critère de l’étude de Framingham), mesuré en coupe parasternale grand axe. La coupe apicale quatre cavités, où l’anneau apparaît plus bas en raison de sa forme en selle, surdiagnostiquait autrefois le prolapsus.</p>
<div class="lab">Prévalence</div><p>2,4 % des 3491 participants de la cohorte des descendants de Framingham (1,3 % de forme classique, 1,1 % de forme non classique) ; la fuite y était en moyenne minime ou légère, et les complications rares (<a href="https://pubmed.ncbi.nlm.nih.gov/10387935/" target="_blank" rel="noopener">Freed et al., <i>New England Journal of Medicine</i> 1999</a>).</p>
<div class="lab">Évolution</div><p>Fuite progressive, rupture de cordage, endocardite, fibrillation auriculaire ; rarement arythmies ventriculaires graves (prolapsus arythmogène).</p>
<div class="lab">Piège</div><p>Un feuillet d’au moins 5 mm d’épaisseur en diastasis définit la forme « classique » (Freed, 1999). L’<a href="https://doi.org/10.1093/europace/euac125" target="_blank" rel="noopener">EHRA 2022</a> rattache le phénotype arythmogène aux formes myxomateuses sévères, à feuillets redondants, souvent avec disjonction de l’anneau.</p></template>

<template data-pop="i34-raa" data-title="Rhumatisme articulaire aigu">
<div class="lab">Définition</div><p>Maladie inflammatoire auto-immune qui suit une infection à streptocoque β-hémolytique du groupe A de la gorge (ou de la peau) non traitée, surtout chez l’enfant et l’adolescent.</p>
<div class="lab">Diagnostic</div><p>Il repose sur les critères de Jones, dont le détail figure dans le cours I00 du fragment C-01-Cardiologie. Ils associent une preuve d’infection streptococcique récente à des manifestations majeures (cardite, y compris infraclinique à l’échocardiographie, arthrite, chorée, érythème marginé, nodules sous-cutanés) et mineures.</p>
<div class="lab">Séquelles</div><p>La cardiopathie rhumatismale chronique apparaît après une ou plusieurs crises, parfois passées inaperçues ; la valve mitrale est la plus touchée. Elle reste la première cause de décès par valvulopathie dans le monde (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Prévention</div><p>Primaire : traitement antibiotique précoce de l’angine streptococcique. Secondaire : benzathine-benzylpénicilline 1,2 million d’unités toutes les 3 à 4 semaines, pendant 10 ans selon l’ESC/EACTS 2025 ; l’information professionnelle suisse d’Extencilline® module la durée selon l’atteinte cardiaque (onglet Pharmacologie).</p>
<div class="lab">Contexte suisse</div><p>En Suisse, la cardiopathie rhumatismale se rencontre surtout chez des personnes ayant grandi dans un pays à forte incidence ; l’ESC/EACTS 2025 souligne sa fréquence dans les pays à revenu faible.</p></template>

<template data-pop="i34-hypexc" data-title="Hypertrophie excentrique">
<div class="lab">Définition</div><p>Augmentation de la masse ventriculaire par addition de sarcomères en série : la cavité se dilate, l’épaisseur relative des parois reste normale ou basse.</p>
<div class="lab">Stimulus</div><p>Surcharge de volume : fuite mitrale ou aortique, shunt, anémie chronique. À distinguer de l’hypertrophie concentrique (sarcomères en parallèle, parois épaisses) de la surcharge de pression.</p>
<div class="lab">Adaptation puis épuisement</div><p>La dilatation augmente le volume d’éjection total sans élever beaucoup la pression de remplissage. À long terme, le rayon augmente la contrainte pariétale (loi de Laplace), la fibrose s’installe et la contractilité baisse.</p></template>

<template data-pop="i34-fevgim" data-title="FEVG dans l’insuffisance mitrale">
<div class="lab">Pourquoi elle surestime la fonction</div><p>Le ventricule éjecte une partie de son volume dans l’oreillette gauche, à basse pression, dès le début de la systole. Sa postcharge est donc réduite, et la FEVG est plus élevée qu’elle ne le serait avec la même contractilité et une valve continente.</p>
<div class="lab">Conséquence</div><p>Une FEVG normale « ordinaire » (55 %) traduit déjà une dysfonction dans une fuite sévère. Le seuil opératoire est donc ≤ 60 %. Il vient des séries chirurgicales : chez 409 patients opérés, la survie à dix ans atteignait 72 % lorsque la FEVG préopératoire était ≥ 60 %, 53 % entre 50 et 60 % et 32 % au-dessous de 50 % (<a href="https://pubmed.ncbi.nlm.nih.gov/8044955/" target="_blank" rel="noopener">Enriquez‑Sarano et al., <i>Circulation</i> 1994</a>). Après correction, la FEVG baisse habituellement, car le ventricule perd l’échappement à basse pression vers l’oreillette et retrouve toute sa postcharge ; une FEVG préopératoire basse annonce une dysfonction postopératoire.</p>
<div class="lab">Marqueurs complémentaires</div><p>Diamètre télésystolique (≥ 40 mm ou ≥ 20 mm/m²), strain longitudinal global, NT-proBNP, réserve contractile à l’effort.</p></template>

<template data-pop="i34-ondev" data-title="Onde v de l’oreillette gauche">
<div class="lab">Définition</div><p>Onde positive de la courbe de pression de l’oreillette (ou de pression capillaire pulmonaire), qui culmine en fin de systole ventriculaire, lorsque l’oreillette se remplit valve fermée.</p>
<div class="lab">Onde v géante</div><p>Une onde v qui dépasse nettement la pression moyenne traduit une arrivée de volume dans une oreillette peu compliante : fuite mitrale aiguë surtout.</p>
<div class="lab">Limites</div><p>Absente dans une fuite chronique sévère avec grande oreillette compliante ; présente dans d’autres situations (communication interventriculaire, oreillette rigide après ablation).</p></template>

<template data-pop="i34-tenting" data-title="Restriction par traction (tenting)">
<div class="lab">Mécanisme</div><p>Le ventricule dilaté ou l’infarctus déplace les piliers vers l’apex et latéralement. Les cordages, de longueur fixe, tirent les feuillets sous le plan de l’anneau. La zone de coaptation se réduit et se déplace vers l’apex.</p>
<div class="lab">Mesures</div><p>Hauteur de tenting (distance entre le plan de l’anneau et le point de coaptation) et surface de tenting. L’<a href="https://doi.org/10.1093/ehjci/jeab253" target="_blank" rel="noopener">EACVI 2022</a> (tableau 12) tient pour défavorables à une réparation chirurgicale une hauteur de coaptation ≥ 1 cm, une surface de tenting &gt; 2,5 à 3 cm², un angle postérolatéral &gt; 45°, une distance interpapillaire &gt; 20 mm et un ventricule très remodelé (diamètre télédiastolique &gt; 65 mm, télésystolique &gt; 51 mm). L’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> retient aussi une surface de tenting indexée &gt; 1,35 cm²/m², au-delà de laquelle le remodelage inverse reste limité et le remplacement est habituellement nécessaire.</p>
<div class="lab">Conséquence</div><p>Le problème est dans le ventricule : réduire l’anneau ne compense pas la traction. Le traitement vise le remodelage (traitement médical, resynchronisation) ; en chirurgie ischémique, le remplacement avec conservation des cordages est souvent plus durable.</p></template>

<template data-pop="i34-propor" data-title="Fuite proportionnée ou disproportionnée">
<div class="lab">Concept</div><p>Dans la fuite mitrale secondaire ventriculaire, la SOR attendue augmente avec le volume télédiastolique du ventricule gauche. Une fuite <b>proportionnée</b> correspond à ce que la taille du ventricule prédit. Une fuite <b>disproportionnée</b> est plus importante que prévu.</p>
<div class="lab">Illustration par les essais</div><p>Dans MITRA-FR, les ventricules étaient plus dilatés et les fuites relativement moins importantes que dans COAPT : réparer la valve n’y a pas apporté de bénéfice. Dans COAPT, à fuite plus importante pour un ventricule moins dilaté, la réparation a réduit les hospitalisations et la mortalité. Les petits sous-groupes de COAPT au profil « proportionné » n’en tiraient pas de bénéfice.</p>
<div class="lab">Portée et limite</div><p>Cadre d’interprétation proposé par Packer et Grayburn (<i>JAMA Cardiology</i> 2020), non critère des recommandations européennes. Selon ses auteurs, les traitements qui réduisent les volumes ventriculaires agissent dans la fuite proportionnée, les gestes qui restaurent la fonction valvulaire dans la fuite disproportionnée. Il explique pourquoi supprimer une fuite proportionnée n’aide guère : le problème principal reste le muscle.</p></template>

<template data-pop="i34-htp" data-title="Hypertension pulmonaire des valvulopathies gauches">
<div class="lab">Post-capillaire isolée</div><p>Pression artérielle pulmonaire moyenne &gt; 20 mmHg, pression capillaire &gt; 15 mmHg, résistances vasculaires pulmonaires ≤ 2 unités Wood : transmission passive de la pression auriculaire gauche.</p>
<div class="lab">Combinée</div><p>Mêmes pressions avec résistances &gt; 2 unités Wood : remodelage artériolaire réactif (vasoconstriction, hypertrophie de la média) après une exposition prolongée à des pressions élevées.</p>
<div class="lab">Clinique</div><p>Éclat de la composante pulmonaire de B2, fuite tricuspide, puis insuffisance ventriculaire droite.</p>
<div class="lab">Réversibilité</div><p>La composante passive régresse rapidement après correction mitrale ; la composante réactive régresse plus lentement et incomplètement. Une pression systolique au repos &gt; 50 mmHg est un critère opératoire dans la fuite mitrale primaire et dans le rétrécissement mitral.</p></template>

<template data-pop="i34-barlow" data-title="Maladie de Barlow et déficience fibroélastique">
<div class="two"><div class="card"><h4>Maladie de Barlow</h4><p>Patient plus jeune (souvent &lt; 60 ans), souffle ancien. Excès de tissu, feuillets épais et redondants, prolapsus de plusieurs segments ou des deux feuillets, anneau dilaté, souvent disjonction de l’anneau. Réparation plus complexe, dans un centre expert.</p></div>
<div class="card"><h4>Déficience fibroélastique</h4><p>Patient plus âgé (souvent &gt; 60 ans), histoire courte. Feuillets fins, transparents, sans excès de tissu ; rupture d’un cordage fin, le plus souvent sur le segment P2. Réparation simple et très durable.</p></div></div>
<div class="lab">Formes intermédiaires</div><p>Il existe un continuum entre les deux phénotypes ; la description échographique des segments atteints compte plus que l’étiquette.</p></template>

<template data-pop="i34-medic" data-title="Valvulopathies médicamenteuses">
<div class="lab">Mécanisme</div><p>Stimulation du récepteur sérotoninergique 5-HT2B des cellules interstitielles valvulaires : prolifération myofibroblastique et dépôt de matrice, comme dans la cardiopathie carcinoïde.</p>
<div class="lab">Substances</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> cite la fenfluramine et le méthysergide parmi les causes médicamenteuses rares. Pour la cabergoline (Dostinex®), dérivé de l’ergotamine, l’information professionnelle suisse rapporte des valvulopathies surtout au-delà des doses de l’hyperprolactinémie et liées à la dose cumulée, contre-indique le produit en présence d’une valvulopathie et demande une échocardiographie avant le traitement (Swissmedic, AIPS, consultée le 08.10.2026).</p>
<div class="lab">Aspect</div><p>Feuillets épaissis et rétractés, cordages courts, fuite restrictive (type IIIa) mitrale ou aortique, sans fusion commissurale marquée.</p>
<div class="lab">Évolution</div><p>L’information professionnelle de la cabergoline rapporte une amélioration de certains cas après l’arrêt ; la chirurgie se discute dans les formes sévères.</p></template>

<template data-pop="i34-myxome" data-title="Myxome de l’oreillette gauche">
<div class="lab">Définition</div><p>Tumeur cardiaque primitive bénigne la plus fréquente de l’adulte, habituellement pédiculée sur le septum interauriculaire (fosse ovale).</p>
<div class="lab">Présentations</div><p>Obstruction intermittente de l’orifice mitral (dyspnée, syncope variables avec la position) ; embolies ; signes généraux (fièvre, amaigrissement, syndrome inflammatoire, par sécrétion d’interleukine 6).</p>
<div class="lab">Auscultation</div><p>Roulement diastolique variable, parfois précédé d’un bruit protodiastolique (« plop » tumoral) qui peut évoquer un claquement d’ouverture.</p>
<div class="lab">Conduite</div><p>Échocardiographie diagnostique ; exérèse chirurgicale rapide en raison du risque embolique. Forme familiale : complexe de Carney.</p></template>

<template data-pop="i34-carcinoide" data-title="Cardiopathie carcinoïde">
<div class="lab">Mécanisme</div><p>Tumeur neuroendocrine, le plus souvent intestinale, avec métastases hépatiques : la sérotonine gagne directement le cœur droit par les veines sus-hépatiques. Le poumon en dégrade une grande partie, ce qui épargne en général le cœur gauche.</p>
<div class="lab">Lésions</div><p>Plaques fibreuses sur les valves tricuspide et pulmonaire : feuillets épais, rétractés, immobiles. Fuite tricuspide sévère, rétrécissement et fuite pulmonaires.</p>
<div class="lab">Clinique</div><p>Flush, diarrhée, bronchospasme ; insuffisance cardiaque droite.</p>
<div class="lab">Diagnostic</div><p>Acide 5-hydroxyindolacétique urinaire des 24 heures élevé ; NT-proBNP (dépistage de l’atteinte cardiaque) ; échocardiographie.</p>
<div class="lab">Traitement</div><p>Contrôle de la sécrétion (analogues de la somatostatine) ; remplacement valvulaire droit, bioprothèses le plus souvent, dans un centre expert ; préparation anesthésique contre la crise carcinoïde.</p></template>

<template data-pop="i34-noonan" data-title="Syndrome de Noonan">
<div class="lab">Génétique</div><p>Maladie autosomique dominante de la voie de signalisation Ras et des kinases activées par les mitogènes ; gène le plus souvent en cause : <i>PTPN11</i>.</p>
<div class="lab">Cœur</div><p>Rétrécissement pulmonaire à valve dysplasique (épaisse, peu mobile, sans fusion commissurale) ; cardiomyopathie hypertrophique.</p>
<div class="lab">Autres signes</div><p>Petite taille, dysmorphie faciale (hypertélorisme, ptosis, oreilles basses), cou court, troubles de la coagulation.</p>
<div class="lab">Conséquence thérapeutique</div><p>La valve dysplasique répond mal à la valvuloplastie au ballon, contrairement à la valve en dôme ; la chirurgie est plus souvent nécessaire.</p></template>

<template data-pop="i34-mvpa" data-title="Prolapsus mitral arythmogène">
<div class="lab">Profil</div><p>Prolapsus myxomateux sévère, souvent bivalvulaire, avec disjonction de l’anneau ; extrasystoles ventriculaires complexes provenant des piliers ou de la région de l’anneau, ondes T négatives inférieures et latérales (II, III, aVF, V4–V6), présentes chez environ 65 % des patients aux arythmies malignes mais peu spécifiques. La prédominance féminine des séries de cas relève probablement d’un biais de sélection : une étude autopsique nationale trouve des proportions semblables chez l’homme et la femme.</p>
<div class="lab">Substrat</div><p>Disjonction de l’anneau mitral, mouvement anormal de l’anneau (« curling »), fibrose des piliers et de la paroi inférolatérale visible en IRM (rehaussement tardif).</p>
<div class="lab">Bilan</div><p>Holter de 24 heures chez tout patient porteur d’un prolapsus, prolongé (environ 7 jours, enregistreur implantable) si les symptômes l’exigent ; IRM cardiaque à la recherche d’un rehaussement tardif des piliers ou de la région périannulaire. Les indications habituelles du défibrillateur s’appliquent ; une tachycardie ventriculaire soutenue, une tachycardie non soutenue polymorphe ou rapide (&gt; 180/min) ou une syncope rythmique désignent un risque élevé (consensus d’experts de l’EHRA, <i>Europace</i> 2022, avec le Conseil des valvulopathies de l’ESC et l’EACVI).</p>
<div class="lab">Piège</div><p>Le risque rythmique ne dépend pas de la sévérité de la fuite : un prolapsus avec fuite légère peut être arythmogène.</p></template>

<template data-pop="i34-mad" data-title="Disjonction de l’anneau mitral">
<div class="lab">Définition</div><p>Séparation systolique entre la charnière du feuillet postérieur et le sommet de la paroi inférolatérale du ventricule gauche : l’anneau glisse vers l’oreillette au lieu d’être solidaire du myocarde.</p>
<div class="lab">Recherche</div><p>Coupe parasternale grand axe ou apicale trois cavités, en télésystole ; mesure de la distance ; IRM en complément.</p>
<div class="lab">Signification</div><p>Fréquente dans la maladie de Barlow ; associée à un mouvement anormal de l’anneau, à la fibrose des piliers et aux arythmies ventriculaires. Elle doit être décrite dans tout prolapsus et intégrée au plan chirurgical.</p></template>
<template data-pop="i34-marqueurs-imp" data-title="Marqueurs pronostiques de la fuite mitrale primaire">
<div class="lab">Physiologie normale</div><p>L’oreillette gauche non dilatée a un volume indexé &lt; 36 mL/m² (<a href="https://doi.org/10.1093/ehjci/jeab253" target="_blank" rel="noopener">EACVI 2022</a>). Elle reçoit le sang des veines pulmonaires à basse pression, se contracte en fin de diastole et protège ainsi la circulation pulmonaire. La valve tricuspide reste continente tant que l’anneau et le ventricule droit gardent leur taille.</p>
<div class="lab">Mécanisme</div><p>Une fuite mitrale sévère renvoie à chaque systole un volume dans l’oreillette gauche. L’oreillette se dilate pour absorber ce volume sans hausse majeure de pression ; l’étirement et la fibrose qui en découlent favorisent la fibrillation auriculaire. Lorsque la pression auriculaire s’élève, elle se transmet aux capillaires pulmonaires et crée une hypertension pulmonaire post-capillaire. Le ventricule droit, exposé à cette postcharge, se dilate et étire l’anneau tricuspide, d’où une fuite tricuspide secondaire. Ces quatre marqueurs signalent que la fuite a déjà remodelé les cavités d’amont, même lorsque le ventricule gauche paraît préservé.</p>
<div class="lab">Conséquence clinique</div><p>Dans de grandes cohortes de fuite dégénérative, une oreillette ≥ 60 mL/m², une fibrillation auriculaire, une pression artérielle pulmonaire systolique au repos ≥ 50 mmHg et une fuite tricuspide au moins modérée sont associées à une mortalité plus élevée après chirurgie, indépendamment de la fonction ventriculaire gauche : chez 2276 opérés, le risque relatif ajusté de décès passe de 1,56 avec un marqueur à 2,58 avec trois ou quatre (<a href="https://pubmed.ncbi.nlm.nih.gov/36702625/" target="_blank" rel="noopener">Butcher et al., 2023</a>). La survie à dix ans sans chirurgie tombe de 79 % avec une oreillette &lt; 40 mL/m² à 54 % au-delà de 60 mL/m² (<a href="https://pubmed.ncbi.nlm.nih.gov/31416529/" target="_blank" rel="noopener">Essayagh et al., 2019</a>). Il s’agit d’associations observationnelles : elles suggèrent qu’opérer avant leur apparition améliore le pronostic, sans essai randomisé qui le démontre.</p>
<div class="lab">Ce qui change la décision</div><p>Chez le patient asymptomatique à faible risque, sans dysfonction ventriculaire gauche, l’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> recommande la réparation lorsqu’au moins trois de ces critères sont réunis et qu’un résultat durable est probable (classe I). Une hypertension pulmonaire ou une fibrillation auriculaire due à la fuite fait envisager la chirurgie (classe IIa). Une dilatation significative de l’oreillette seule fait envisager une réparation dans un centre valvulaire de référence, si elle est probablement durable (classe IIa). Une fuite tricuspide modérée isolée ne suffit pas à poser l’indication. La condition d’une réparation durable est essentielle : un patient sans symptôme ne doit pas être exposé à un remplacement ou à une réparation qui échoue.</p>
<div class="lab">Limites</div><p>Les seuils proviennent de cohortes observationnelles. Chez la femme, la mortalité après réparation est plus élevée pour un degré moindre de dilatation, ce qui suggère l’intérêt de seuils propres au sexe.</p>
<div class="lab">Source</div><p><a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">Praz et al. 2025 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2025;46:4635-4736</a>. <a href="https://pubmed.ncbi.nlm.nih.gov/36702625/" target="_blank" rel="noopener">Butcher et al. Factors influencing post-surgical survival in degenerative mitral regurgitation. Eur Heart J 2023;44:871-881</a>. <a href="https://pubmed.ncbi.nlm.nih.gov/31416529/" target="_blank" rel="noopener">Essayagh et al. Prognostic implications of left atrial enlargement in degenerative mitral regurgitation. J Am Coll Cardiol 2019;74:858-870</a>.</p>
<div class="lab">Sans aucun marqueur</div><p>Le patient asymptomatique qui n’a ni dysfonction ventriculaire gauche ni aucun de ces marqueurs est revu cliniquement et par échocardiographie deux fois par an, idéalement dans une consultation spécialisée des valvulopathies. Le suivi peut ajouter le dosage répété des peptides natriurétiques, un ECG ou un enregistrement Holter et, au besoin, une échocardiographie d’effort ou une IRM. Ce rythme vise à saisir le premier symptôme ou le premier marqueur, qui fait alors passer à l’intervention avant un remodelage irréversible. Une fuite modérée avec fonction ventriculaire conservée se revoit chaque année, avec une échocardiographie tous les un à deux ans.</p>
