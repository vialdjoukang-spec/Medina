
<!-- ===== FENÊTRES I34 : anamnèse et examen clinique ===== -->
<template data-pop="i34-atcd-raa" data-title="Antécédent rhumatismal et origine géographique">
<div class="lab">Questions</div><p>Angines répétées dans l’enfance ; douleurs articulaires migratrices avec fièvre ; « rhumatisme » ou « souffle » connu ; injections mensuelles de pénicilline dans l’enfance ; pays de naissance et d’enfance.</p>
<div class="lab">Valeur</div><p>Moins de la moitié des patients porteurs d’une cardiopathie rhumatismale se souviennent d’une crise aiguë. L’origine géographique a plus de valeur que le souvenir de la crise.</p>
<div class="lab">Conséquence</div><p>Chez un adulte jeune venant d’une région d’endémie, un roulement ou une fuite mitrale restrictive est rhumatismal jusqu’à preuve du contraire ; les AOD sont alors à éviter en cas de rétrécissement.</p></template>

<template data-pop="i34-atcd-medic" data-title="Exposition à des valvulotoxiques">
<div class="lab">Questions</div><p>Coupe-faim (benfluorex, fenfluramines) ; traitement de la maladie de Parkinson ou d’une hyperprolactinémie par agoniste dopaminergique ergoté (pergolide, cabergoline) ; traitement de la migraine par dérivé de l’ergot ; consommation d’ecstasy.</p>
<div class="lab">Valeur</div><p>Oriente une fuite restrictive sans passé rhumatismal ; peut avoir des conséquences médico-légales et d’indemnisation.</p></template>

<template data-pop="i34-atcd-radio" data-title="Irradiation médiastinale">
<div class="lab">Contexte</div><p>Radiothérapie pour lymphome de Hodgkin, cancer du sein gauche ou tumeur médiastinale, surtout à forte dose et à un âge jeune.</p>
<div class="lab">Lésions</div><p>Épaississement et calcification de la continuité mitro-aortique et de la base du feuillet antérieur mitral, avec fuites puis sténoses, dix à vingt ans après l’irradiation ; souvent associées à une coronaropathie, une atteinte péricardique et une fibrose pulmonaire.</p>
<div class="lab">Conséquence</div><p>Chirurgie plus difficile (fibrose médiastinale) ; les techniques percutanées sont souvent discutées. Dépistage échocardiographique recommandé à distance de l’irradiation.</p></template>

<template data-pop="i34-atcd-fam" data-title="Histoire familiale">
<div class="lab">Questions</div><p>Prolapsus mitral chez un parent ; mort subite inexpliquée avant 40 ans ; dissection aortique ; grande taille, luxation du cristallin (syndrome de Marfan).</p>
<div class="lab">Conséquence</div><p>Oriente vers un prolapsus familial ou arythmogène, ou vers une connectivite héréditaire, et justifie un dépistage des apparentés au premier degré.</p></template>

<template data-pop="i34-s-dysp" data-title="Dyspnée des valvulopathies mitrales">
<div class="lab">Mécanisme</div><p>Élévation de la pression de l’oreillette gauche transmise aux capillaires pulmonaires. Dans le rétrécissement mitral, elle dépend de la fréquence cardiaque et du débit ; dans la fuite mitrale, du volume régurgité et de la compliance auriculaire.</p>
<div class="lab">Caractérisation</div><p>Seuil d’effort (étages, distance), évolution sur l’année écoulée, orthopnée, dyspnée paroxystique nocturne, circonstances (grossesse, fièvre, palpitations).</p>
<div class="lab">Piège</div><p>L’adaptation progressive de l’activité masque la gêne. Demander ce que le patient a cessé de faire ; en cas de doute, une épreuve d’effort objective la tolérance.</p>
<div class="lab">Conséquence</div><p>Dans une fuite mitrale primaire sévère, l’apparition d’une dyspnée suffit à poser l’indication opératoire (classe I).</p></template>

<template data-pop="i34-s-fatig" data-title="Fatigue et intolérance à l’effort">
<div class="lab">Mécanisme</div><p>Débit antérograde insuffisant, surtout à l’effort : volume régurgité dans la fuite mitrale ou tricuspide, obstacle fixe dans le rétrécissement mitral, perte de la contraction auriculaire en fibrillation.</p>
<div class="lab">Valeur</div><p>Symptôme dominant des fuites tricuspides évoluées, souvent attribué à l’âge.</p></template>

<template data-pop="i34-s-palp" data-title="Palpitations">
<div class="lab">Causes</div><p>Fibrillation auriculaire (valvulopathies mitrales, fuite tricuspide) ; extrasystoles ventriculaires du prolapsus ; tachycardies ventriculaires du prolapsus arythmogène.</p>
<div class="lab">Conduite</div><p>ECG, Holter ; toute fibrillation auriculaire nouvelle chez un patient porteur d’une fuite mitrale sévère entre dans les critères opératoires, et impose de choisir l’anticoagulant selon la lésion.</p>
<div class="lab">Signal d’alarme</div><p>Syncope ou palpitations à l’effort dans un prolapsus : rechercher un prolapsus arythmogène.</p></template>

<template data-pop="i34-s-oed" data-title="Congestion droite">
<div class="lab">Symptômes</div><p>Œdèmes des membres inférieurs, augmentation du périmètre abdominal (ascite), pesanteur de l’hypochondre droit, satiété précoce, perte d’appétit, cachexie.</p>
<div class="lab">Mécanisme</div><p>Élévation de la pression veineuse systémique ; congestion hépatique, intestinale et rénale.</p>
<div class="lab">Piège</div><p>Le patient est parfois exploré en gastroentérologie pour ascite ou cholestase. Une ascite riche en protéines (gradient d’albumine sérum-ascite élevé avec protéines &gt; 25 g/L) oriente vers une origine cardiaque plutôt que cirrhotique.</p></template>

<template data-pop="i34-s-hemopt" data-title="Hémoptysie du rétrécissement mitral">
<div class="lab">Mécanismes</div><p>Rupture de veines bronchiques dilatées par l’hypertension veineuse pulmonaire (hémoptysie abondante possible) ; expectoration rosée de l’œdème pulmonaire ; infarctus pulmonaire ; bronchite chronique.</p>
<div class="lab">Valeur</div><p>Symptôme classique du rétrécissement mitral serré ; chez une femme jeune originaire d’une région d’endémie, il doit faire ausculter la pointe en décubitus latéral gauche avant d’orienter vers une tuberculose.</p></template>

<template data-pop="i34-s-emb" data-title="Embolie artérielle révélatrice">
<div class="lab">Présentations</div><p>Accident vasculaire cérébral ischémique, ischémie aiguë de membre, infarctus rénal ou splénique, ischémie mésentérique.</p>
<div class="lab">Source</div><p>Thrombus de l’oreillette ou de l’auricule gauche, favorisé par le rétrécissement mitral, la fibrillation auriculaire et le contraste spontané dense ; plus rarement végétation ou myxome.</p>
<div class="lab">Conduite</div><p>Échocardiographie transthoracique puis transœsophagienne ; anticoagulation par antivitamine K dans le rétrécissement mitral ; discussion d’une commissurotomie.</p></template>

<template data-pop="i34-s-ortner" data-title="Compression par l’oreillette gauche">
<div class="lab">Syndrome d’Ortner</div><p>Dysphonie par compression du nerf laryngé récurrent gauche entre l’aorte et l’artère pulmonaire dilatée ou l’oreillette gauche géante. Rare, classique du rétrécissement mitral évolué.</p>
<div class="lab">Dysphagie</div><p>Compression de l’œsophage par une oreillette gauche géante, située juste en avant de lui.</p></template>

<template data-pop="i34-e-facies" data-title="Faciès mitral">
<div class="lab">Aspect</div><p>Érythrose violacée des pommettes, parfois cyanose des lèvres.</p>
<div class="lab">Mécanisme</div><p>Bas débit avec vasoconstriction cutanée et hypertension pulmonaire chronique.</p>
<div class="lab">Valeur</div><p>Signe de rétrécissement mitral serré ancien ; peu sensible, devenu rare en Europe.</p></template>

<template data-pop="i34-e-pouls" data-title="Pouls dans les valvulopathies mitrales">
<div class="lab">Régularité</div><p>Irrégulièrement irrégulier : fibrillation auriculaire. Mesurer la fréquence à l’auscultation cardiaque, car le pouls radial sous-estime la fréquence en fibrillation rapide (déficit de pouls).</p>
<div class="lab">Amplitude</div><p>Fuite mitrale chronique compensée : pouls vif et bref. Rétrécissement mitral serré ou fuite aiguë : pouls petit.</p>
<div class="lab">Fréquence</div><p>Dans le rétrécissement mitral, la fréquence est une donnée thérapeutique : la tolérance dépend de la durée de la diastole.</p></template>

<template data-pop="i34-e-shs" data-title="Souffle holosystolique d’insuffisance mitrale">
<div class="lab">Technique</div><p>Membrane du stéthoscope à la pointe, patient en décubitus latéral gauche ; suivre l’irradiation vers l’aisselle. Coter l’intensité de 1 à 6 sur 6 ; un frémissement correspond à une intensité ≥ 4.</p>
<div class="lab">Caractères</div><p>Souffle en plateau, de B1 à B2, souvent de timbre aigu. Il varie peu avec la durée du cycle précédent, contrairement au souffle éjectionnel aortique.</p>
<div class="lab">Direction du jet</div><p>Prolapsus du feuillet postérieur : jet dirigé vers l’avant, souffle irradiant vers la base et parfois vers les carotides ; prolapsus antérieur : irradiation axillaire et dorsale.</p>
<div class="lab">Signes associés de sévérité</div><p>B3 et roulement de débit (volume diastolique élevé), dédoublement large de B2 (fermeture aortique précoce), choc de pointe dévié.</p>
<div class="lab">Piège</div><p>L’intensité ne mesure pas la sévérité ; une fuite aiguë massive peut être peu audible.</p></template>

<template data-pop="i34-e-click" data-title="Clic mésosystolique et manœuvres dynamiques">
<div class="lab">Signe</div><p>Bruit bref, sec, en milieu de systole, suivi d’un souffle télésystolique : moment où le feuillet atteint sa course maximale dans l’oreillette et où les cordages se tendent.</p>
<div class="lab">Manœuvres</div><p>Tout ce qui <b>diminue</b> le volume du ventricule gauche (passage debout, manœuvre de Valsalva) fait survenir le prolapsus plus tôt : le clic se rapproche de B1 et le souffle s’allonge. Tout ce qui l’<b>augmente</b> (accroupissement, élévation des jambes, poignée serrée qui augmente la postcharge) retarde le clic et raccourcit le souffle.</p>
<div class="lab">Valeur</div><p>Le souffle télésystolique isolé correspond souvent à une fuite de volume modeste ; le souffle holosystolique signale une fuite plus importante.</p>
<div class="lab">Piège</div><p>La même logique s’applique à la cardiomyopathie hypertrophique obstructive, dont le souffle augmente aussi debout et en Valsalva : l’échocardiographie tranche.</p></template>

<template data-pop="i34-e-choc" data-title="Choc de pointe">
<div class="lab">Technique</div><p>Palpation en décubitus dorsal puis latéral gauche ; localisation normale au cinquième espace intercostal gauche, sur la ligne médioclaviculaire, sur une surface d’environ 2 cm.</p>
<div class="lab">Fuite mitrale chronique</div><p>Choc dévié en bas et en dehors, étalé, bref : dilatation du ventricule gauche.</p>
<div class="lab">Rétrécissement mitral</div><p>Choc de pointe peu perceptible ; frémissement diastolique parfois palpable en décubitus latéral gauche ; soulèvement parasternal gauche si le ventricule droit est hypertrophié.</p></template>

<template data-pop="i34-e-b1" data-title="Éclat de B1 du rétrécissement mitral">
<div class="lab">Mécanisme</div><p>Le gradient diastolique maintient les feuillets largement ouverts jusqu’à la fin de la diastole ; la contraction ventriculaire les ferme brutalement, depuis une position éloignée.</p>
<div class="lab">Valeur</div><p>Signe d’une valve encore souple, favorable à la commissurotomie. B1 redevient faible lorsque les feuillets se calcifient et s’immobilisent.</p>
<div class="lab">Lien</div><p>Variations de B1 en fibrillation auriculaire : voir la fiche <button class="w" data-k="i48-e-b1">B1 en fibrillation auriculaire</button>.</p></template>

<template data-pop="i34-e-cla" data-title="Claquement d’ouverture mitral">
<div class="lab">Signe</div><p>Bruit sec et bref, en début de diastole, 40 à 120 ms après B2, mieux entendu entre la pointe et le bord gauche du sternum, à la membrane.</p>
<div class="lab">Mécanisme</div><p>Arrêt brutal de l’ouverture de feuillets fusionnés mais encore mobiles, qui se tendent en dôme.</p>
<div class="lab">Valeur</div><p>Plus l’intervalle B2–claquement est <b>court</b>, plus la pression auriculaire est élevée et plus le rétrécissement est serré : la valve s’ouvre dès que la pression ventriculaire descend sous la pression auriculaire.</p>
<div class="lab">Pièges</div><p>Disparaît quand la valve est calcifiée. À distinguer d’un dédoublement de B2 (qui varie avec la respiration, au foyer pulmonaire) et d’un B3 (plus tardif, grave, à la cloche).</p></template>

<template data-pop="i34-e-roul" data-title="Roulement diastolique mitral">
<div class="lab">Technique</div><p>Cloche posée sans pression à la pointe, patient en décubitus latéral gauche, en expiration, après un petit effort. Le roulement est localisé : quelques centimètres suffisent à le manquer.</p>
<div class="lab">Caractères</div><p>Bruit grave, grondant, qui suit le claquement d’ouverture et décroît en diastole. En rythme sinusal, un renforcement présystolique traduit la contraction auriculaire ; il disparaît en fibrillation auriculaire.</p>
<div class="lab">Valeur</div><p>C’est la <b>durée</b> du roulement, et non son intensité, qui reflète la sévérité : un roulement qui persiste jusqu’à B1 indique un gradient présent pendant toute la diastole.</p>
<div class="lab">Piège</div><p>Silencieux en bas débit ou en fibrillation rapide (« rétrécissement mitral muet »). Voir aussi la fiche <button class="w" data-k="i48-e-rm">auscultation du rétrécissement mitral en fibrillation</button>.</p></template>

<template data-pop="i34-e-b2p" data-title="Composante pulmonaire de B2">
<div class="lab">Signe</div><p>Composante pulmonaire de B2 claquante, audible à la pointe (où elle est normalement inaudible) ; dédoublement de B2 moins variable.</p>
<div class="lab">Mécanisme</div><p>Fermeture énergique de la valve pulmonaire sous une pression artérielle pulmonaire élevée.</p>
<div class="lab">Valeur</div><p>Marqueur clinique d’hypertension pulmonaire ; dans une valvulopathie mitrale, il témoigne d’un stade avancé et oriente vers une intervention.</p></template>

<template data-pop="i34-e-carvallo" data-title="Souffle d’insuffisance tricuspide et signe de Carvallo">
<div class="lab">Technique</div><p>Membrane au bord gauche du sternum, en bas, et à l’appendice xiphoïde ; comparer en inspiration profonde et en expiration.</p>
<div class="lab">Signe de Carvallo</div><p>Le souffle augmente en inspiration : l’inspiration augmente le retour veineux vers le cœur droit, donc le volume régurgité.</p>
<div class="lab">Valeur</div><p>Distingue une fuite tricuspide d’une fuite mitrale transmise. Il peut manquer lorsque le ventricule droit défaillant ne peut plus augmenter son volume d’éjection.</p>
<div class="lab">Piège</div><p>Les fuites massives ou torrentielles sont souvent silencieuses : les pressions droites s’égalisent. Les signes veineux (onde v, foie pulsatile) ont alors plus de valeur que l’auscultation.</p></template>

<template data-pop="i34-e-ondev" data-title="Onde v jugulaire de l’insuffisance tricuspide">
<div class="lab">Technique</div><p>Patient à 45°, observer la veine jugulaire interne droite ; synchroniser avec le pouls carotidien controlatéral ou avec l’auscultation.</p>
<div class="lab">Signe</div><p>Onde systolique ample (onde c-v) qui remplace la descente x ; ascension de toute la colonne veineuse avec chaque systole, parfois mouvement du lobe de l’oreille.</p>
<div class="lab">Valeur</div><p>Signe le plus spécifique d’une fuite tricuspide significative ; associé au reflux hépato-jugulaire et à la turgescence jugulaire.</p>
<div class="lab">Onde a géante</div><p>En rythme sinusal, une onde a ample évoque plutôt un rétrécissement tricuspide ou une hypertension pulmonaire avec ventricule droit rigide.</p></template>

<template data-pop="i34-e-foie" data-title="Foie pulsatile">
<div class="lab">Technique</div><p>Main posée à plat sous le rebord costal droit, ou bimanuelle ; rechercher une expansion synchrone de la systole.</p>
<div class="lab">Mécanisme</div><p>Le volume régurgité remonte jusqu’aux veines sus-hépatiques, sans valve, et dilate le foie à chaque systole.</p>
<div class="lab">Valeur</div><p>Signe de fuite tricuspide sévère. Il disparaît lorsque le foie devient fibreux (cirrhose cardiaque).</p></template>

<template data-pop="i34-e-ps" data-title="Rétrécissement pulmonaire à l’auscultation">
<div class="lab">Signes</div><p>Souffle systolique éjectionnel au deuxième espace intercostal gauche, irradiant vers le dos, avec frémissement dans les formes serrées ; clic protosystolique d’éjection qui diminue à l’inspiration (seul bruit du cœur droit qui s’atténue à l’inspiration) ; dédoublement large de B2 avec composante pulmonaire faible.</p>
<div class="lab">Sévérité</div><p>Plus la sténose est serrée, plus le souffle est long et culmine tard, et plus le clic se rapproche de B1.</p>
<div class="lab">Retentissement</div><p>Onde a jugulaire ample, soulèvement parasternal gauche.</p></template>

<template data-pop="i34-e-gs" data-title="Souffle de Graham Steell">
<div class="lab">Signe</div><p>Souffle diastolique aigu, décroissant, au foyer pulmonaire, qui augmente à l’inspiration.</p>
<div class="lab">Mécanisme</div><p>Insuffisance pulmonaire fonctionnelle par dilatation de l’anneau sous une hypertension pulmonaire sévère, classiquement dans le rétrécissement mitral évolué.</p>
<div class="lab">Diagnostic différentiel</div><p>Souffle d’insuffisance aortique, qui ne varie pas avec la respiration et s’accompagne de signes périphériques. L’échocardiographie tranche.</p></template>
