
<!-- ===== FENÊTRES I34 : monographies, grossesse, aides pédagogiques ===== -->
<template data-pop="i34-d-bb" data-title="Bêtabloquants dans le rétrécissement mitral">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : baisse de la fréquence cardiaque, surtout à l’effort. La diastole s’allonge ; le gradient transmitral et la pression de l’oreillette gauche baissent pour un même débit.</p>
<div class="lab">Molécules</div><p>Métoprolol succinate (Beloc ZOK® : jusqu’à 200 mg une fois par jour), bisoprolol (Concor® : jusqu’à 10 mg une fois par jour), selon les informations professionnelles suisses. Pendant la grossesse, l’ESC 2025 préfère les molécules lipophiles (labétalol, métoprolol) et β1-sélectives (bisoprolol, métoprolol), qui exposent moins à l’hypoglycémie néonatale ; l’aténolol n’est pas recommandé, car il cause un retard de croissance sévère, une bradycardie et une hypoglycémie. La notice suisse de Beloc ZOK® réserve le métoprolol pendant la grossesse aux cas de nécessité absolue.</p>
<div class="lab">Preuves</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> retient que diurétiques, bêtabloquants, digoxine, inhibiteurs calciques bradycardisants et ivabradine améliorent les symptômes en contrôlant la volémie et la fréquence ; aucun ne modifie l’histoire naturelle de la sténose.</p>
<div class="lab">Alternatives</div><p>Vérapamil ou diltiazem si bêtabloquant contre-indiqué et fonction ventriculaire conservée ; digoxine en complément en fibrillation auriculaire. L’ivabradine n’a pas cette indication dans l’information professionnelle suisse ; l’ESC/EACTS 2025 la cite parmi les traitements qui améliorent les symptômes. Elle ralentit le nœud sinusal sans effet inotrope négatif, mais reste sans effet en fibrillation auriculaire, où le nœud sinusal ne commande plus le rythme.</p>
<div class="lab">Effets indésirables et précautions</div><p>Bradycardie, bloc auriculoventriculaire, fatigue, bronchospasme (asthme sévère), masquage des hypoglycémies ; chez la femme enceinte, surveillance de la croissance fœtale et de la glycémie néonatale.</p></template>

<template data-pop="i34-d-nitro" data-title="Vasodilatateurs intraveineux de l’insuffisance mitrale aiguë">
<div class="lab">Mécanisme</div><p>La nitroglycérine dilate surtout les veines (baisse de la précharge et de la congestion) et, à dose plus élevée, les artères. Le nitroprussiate de sodium dilate artères et veines : il réduit la postcharge, augmente la part du volume éjectée vers l’aorte et réduit le volume régurgité.</p>
<div class="lab">Posologie</div><p>Nitroprussiate (Nipruss®, information professionnelle suisse) : 0,2 µg/kg/min, doublé toutes les 3 à 5 minutes selon la pression artérielle ; plage de 0,2 à plus de 10 µg/kg/min, en soins intensifs, sous pression artérielle invasive ; adjonction de thiosulfate de sodium (rapport 1:10) et surveillance du thiocyanate (≤ 6 mg/100 mL). Nitroglycérine intraveineuse : voir l’information professionnelle de la spécialité utilisée.</p>
<div class="lab">Condition</div><p>Pression artérielle systolique suffisante (en pratique &gt; 90–100 mmHg). En cas d’hypotension : inotrope, ballon de contre-pulsion intra-aortique ou autre assistance circulatoire.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, céphalées ; nitroprussiate : toxicité du cyanure et du thiocyanate en perfusion prolongée ou en insuffisance rénale, car chaque molécule libère des ions cyanure, convertis par le foie en thiocyanate, lui-même éliminé par le rein.</p>
<div class="lab">Place</div><p>Traitement d’attente : la rupture de pilier ou de cordage avec œdème pulmonaire relève de la chirurgie.</p></template>

<template data-pop="i34-d-benz" data-title="Benzathine-benzylpénicilline">
<div class="lab">Mécanisme</div><p>Sel de pénicilline G très peu soluble : après injection intramusculaire, l’absorption est très lente et les concentrations restent prolongées, ce qui permet une à deux injections par mois (information professionnelle suisse d’Extencilline®).</p>
<div class="lab">Indications</div><p>Prophylaxie du rhumatisme articulaire aigu, de la glomérulonéphrite post-streptococcique et de l’érysipèle ; infections streptococciques ; syphilis.</p>
<div class="lab">Posologie (prophylaxie)</div><p>Adulte, adolescent et enfant de plus de 30 kg : 1,2 million d’unités par voie intramusculaire profonde toutes les 3 à 4 semaines ; enfant de moins de 30 kg : 600 000 unités. Durée : au moins 5 ans ou jusqu’à 21 ans sans atteinte cardiaque ; au moins 10 ans ou jusqu’à 21 ans après une atteinte transitoire ; au moins 10 ans ou jusqu’à 40 ans si l’atteinte persiste, parfois à vie. Adaptation en insuffisance rénale.</p>
<div class="lab">Précautions</div><p>Injection strictement intramusculaire, profonde, après aspiration ; arrêt immédiat en cas de reflux sanguin ou de douleur. Sous antivitamine K, potentialisation possible et contrôle de l’INR ; l’information professionnelle de Marcoumar® proscrit les injections intramusculaires pendant l’anticoagulation.</p>
<div class="lab">Contre-indication</div><p>Allergie à la pénicilline : l’alternative se décide avec l’infectiologue.</p>
<div class="lab">Source</div><p>Information professionnelle suisse Extencilline® et Marcoumar®, Swissmedic (AIPS), consultée le 08.10.2026 ; <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> (1,2 million d’unités toutes les 3 à 4 semaines pendant 10 ans).</p></template>

<template data-pop="i34-d-hbpm" data-title="Héparines : relais périopératoire et grossesse">
<div class="lab">Molécules</div><p>Héparine de bas poids moléculaire (énoxaparine : Clexane®) par voie sous-cutanée ; héparine non fractionnée par voie intraveineuse, réversible rapidement, adaptée à l’insuffisance rénale sévère et à la période périopératoire immédiate. Clexane® : 1 mg/kg deux fois par jour en dose thérapeutique, une fois par jour si la clairance de la créatinine est &lt; 30 mL/min ; son information professionnelle rapporte des thromboses de prothèse chez des femmes enceintes porteuses de valves mécaniques.</p>
<div class="lab">Relais d’un antivitamine K avant chirurgie</div><p>L’<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> recommande d’arrêter l’antivitamine K au moins 4 jours avant une chirurgie non cardiaque majeure, en visant un INR &lt; 1,5 (classe I), et de faire un relais par héparine chez le porteur de prothèse mécanique avec facteurs de risque thromboemboliques (IIa). Pour la phenprocoumone, l’information professionnelle prévoit un arrêt 5 à 10 jours avant. Dans la fibrillation auriculaire sans prothèse, l’essai BRIDGE (1884 patients sous warfarine) a montré que renoncer au relais n’augmentait pas les embolies artérielles (0,4 % contre 0,3 %) et réduisait les hémorragies majeures (1,3 % contre 3,2 %).</p>
<div class="lab">Grossesse avec prothèse mécanique (<a href="https://doi.org/10.1093/eurheartj/ehaf193" target="_blank" rel="noopener">ESC 2025 sur la grossesse</a>)</div><p>Au premier trimestre : antivitamine K si la dose nécessaire est faible (warfarine ≤ 5 mg, phenprocoumone ≤ 3 mg, acénocoumarol ≤ 2 mg par jour), sinon héparine de bas poids moléculaire à dose thérapeutique deux fois par jour, adaptée au pic d’activité anti-Xa (cible individualisée, de 1,0 à 1,2 UI/mL), contrôlé chaque semaine jusqu’à la cible puis toutes les 2 à 4 semaines. À partir de la 13e semaine, décision partagée : antivitamine K avec INR chaque semaine ou toutes les deux semaines, ou poursuite de l’héparine. Le dosage du résiduel a une valeur moins établie.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies ; thrombopénie induite par l’héparine ; ostéoporose en traitement prolongé.</p></template>

<template data-pop="i34-grossesse" data-title="Grossesse et rétrécissement mitral">
<div class="lab">Pourquoi c’est dangereux</div><p>Dès la 6e semaine, le volume d’éjection et le débit cardiaque augmentent de 30 à 50 %, la fréquence cardiaque de 10 à 20/min, et les résistances périphériques baissent de 20 à 50 % (<a href="https://doi.org/10.1093/eurheartj/ehaf193" target="_blank" rel="noopener">ESC 2025 sur la grossesse</a>). Le débit monte et la tachycardie raccourcit la diastole : le gradient transmitral et la pression de l’oreillette gauche s’élèvent. Le rétrécissement mitral est une cause fréquente d’insuffisance cardiaque pendant la grossesse ; les symptômes apparaissent surtout si la surface est &lt; 1,5 cm². La mortalité maternelle est plus élevée en classe NYHA &gt; II, si la pression artérielle pulmonaire systolique dépasse 30 mmHg, dans la sténose sévère, avec l’âge et dans les pays à faible revenu. Risques fœtaux : prématurité, retard de croissance, mort fœtale, surtout si la mère est en classe NYHA III–IV.</p>
<div class="lab">Classification du risque</div><p>La classification OMS modifiée 2.0 de l’ESC 2025 range la sténose mitrale modérée et la sténose sévère parmi les situations à risque élevé ou très élevé.</p>
<div class="lab">Avant la grossesse</div><p>Une intervention est recommandée si la surface est &lt; 1,5 cm² (ESC 2025 sur la grossesse, classe I) ; la commissurotomie percutanée est l’intervention de première intention.</p>
<div class="lab">Pendant la grossesse</div><p>Suivi par l’équipe cardio-obstétricale. Restriction des activités et bêtabloquant en cas de symptômes ou d’hypertension pulmonaire (classe I) ; diurétique si la congestion persiste malgré le bêtabloquant (classe I) ; anticoagulation à dose thérapeutique en cas de fibrillation auriculaire, de thrombus de l’oreillette gauche ou d’embolie antérieure (classe I). Commissurotomie percutanée à envisager si les symptômes sont sévères ou si la pression artérielle pulmonaire systolique dépasse 50 mmHg malgré le traitement (classe IIa) ; la chirurgie valvulaire ne se discute qu’en cas de risque vital maternel, après échec des autres options.</p>
<div class="lab">Accouchement</div><p>Voie basse de préférence ; césarienne préférée dans la sténose mitrale sévère et l’insuffisance cardiaque réfractaire. Si le travail débute sous antivitamine K ou moins de deux semaines après son arrêt, la césarienne est recommandée pour protéger le fœtus. L’accouchement expose à l’insuffisance cardiaque et aux thromboses.</p>
<div class="lab">Post-partum</div><p>Surveillance rapprochée pendant les jours qui suivent ; des diurétiques peuvent être nécessaires contre la surcharge volémique.</p>
<div class="lab">Anticoagulants</div><p>Antivitamines K : embryopathie de 0,6 à 12 % au premier trimestre, risque lié à la dose ; fœtopathie plus rare ensuite. Ils sont remplacés par l’héparine de bas poids moléculaire chez la plupart des femmes, sauf en cas de fibrillation auriculaire avec sténose mitrale modérée à sévère ou de prothèse mécanique, où le risque de thrombose est moindre sous antivitamine K. AOD contre-indiqués pendant la grossesse. L’information professionnelle suisse de Marcoumar® et de Sintrom® contre-indique la grossesse : <button class="w" data-k="i34-ch-avk-gross">écart à connaître</button> avec la stratégie de l’ESC, à discuter en centre spécialisé.</p>
<div class="lab">Source</div><p>ESC 2025 sur les maladies cardiovasculaires et la grossesse (sections 5 et 12.5) ; <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> ; information professionnelle suisse Marcoumar®, Sintrom®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>

<template data-pop="i34-mimetisme" data-title="Mimétisme moléculaire">
<div class="lab">Définition</div><p>Réaction croisée d’anticorps ou de lymphocytes T dirigés contre un antigène microbien avec une protéine de l’hôte de structure proche.</p>
<div class="lab">Dans le rhumatisme</div><p>La protéine M du streptocoque du groupe A, en hélice enroulée, ressemble à la myosine cardiaque et à des protéines valvulaires (laminine, vimentine). Les anticorps se fixent sur l’endothélium valvulaire ; les lymphocytes T infiltrent le feuillet et entretiennent l’inflammation.</p>
<div class="lab">Autres exemples</div><p>Chorée de Sydenham (antigènes des noyaux gris centraux) ; syndrome de Guillain et Barré après <i>Campylobacter jejuni</i>.</p>
<div class="lab">Corrélation</div><p>Chaque nouvelle infection streptococcique relance la réaction : c’est la justification de la prévention secondaire prolongée.</p></template>

<template data-pop="i34-mnemo-60" data-title="« 60 – 40 – 50 – 55 » : opérer la fuite mitrale primaire">
<p><b>60</b> — FEVG ≤ 60 % ; volume de l’oreillette gauche ≥ 60 mL/m².<br><b>40</b> — diamètre télésystolique ≥ 40 mm (ou ≥ 20 mm/m²).<br><b>50</b> — pression artérielle pulmonaire systolique au repos &gt; 50 mmHg.<br><b>55</b> — diamètre de l’oreillette gauche ≥ 55 mm.</p>
<div class="lab">Lecture</div><p>Les deux premiers chiffres (FEVG ≤ 60 %, diamètre ≥ 40 mm) suffisent chacun à poser une indication de classe I chez le patient asymptomatique. <button class="w" data-k="i34-marqueurs-imp">Les critères auriculaires et pulmonaires</button>, avec la fibrillation auriculaire et la fuite tricuspide au moins modérée, s’additionnent : au moins trois critères, réparation chirurgicale de classe I si elle est probablement durable. Isolément, une fibrillation auriculaire due à la fuite ou une pression artérielle pulmonaire systolique &gt; 50 mmHg font envisager la chirurgie (classe IIa) ; une oreillette dilatée seule fait envisager une réparation dans un centre valvulaire de référence, si elle est probablement durable (classe IIa). Une fuite tricuspide modérée isolée ne suffit pas. Tout symptôme suffit à opérer.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel ; les recommandations <a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a> font foi.</p></template>

<template data-pop="i34-mnemo-mesc" data-title="« MESC » : les quatre items du score de Wilkins">
<p><b>M</b> — Mobilité des feuillets ;<br><b>E</b> — Épaississement des feuillets ;<br><b>S</b> — appareil Sous-valvulaire ;<br><b>C</b> — Calcification.</p>
<div class="lab">Lecture</div><p>Chaque item est coté de 1 à 4 ; un total &gt; 8 est tenu pour défavorable à la commissurotomie percutanée (<a href="https://doi.org/10.1093/eurheartj/ehaf194" target="_blank" rel="noopener">ESC/EACTS 2025</a>).</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. Il ne rappelle pas les contre-indications de la commissurotomie (thrombus, fuite mitrale plus que légère, calcification bicommissurale), qu’il faut vérifier séparément.</p></template>
