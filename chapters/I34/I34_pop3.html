
<!-- ===== FENÊTRES I34 : examens, interventions et essais ===== -->
<template data-pop="i34-vc" data-title="Vena contracta">
<div class="lab">Définition</div><p>Portion la plus étroite du jet de fuite, juste en aval de l’orifice, en Doppler couleur. Sa largeur approche le diamètre de l’orifice effectif.</p>
<div class="lab">Technique</div><p>Zoom, balayage étroit, coupe perpendiculaire à la ligne de coaptation (parasternale grand axe pour la mitrale) ; mesurer le col entre la zone de convergence et l’expansion du jet. Moyenne sur plusieurs cycles.</p>
<div class="lab">Seuils</div><p>Mitrale : &lt; 3 mm légère, ≥ 7 mm sévère (≥ 8 mm en moyenne biplan). Tricuspide : ≥ 7 mm sévère ; 14–20 mm massive ; ≥ 21 mm torrentielle.</p>
<div class="lab">Limites</div><p>Orifice non circulaire (fuite secondaire en croissant : large dans une incidence, étroit dans l’autre) ; jets multiples. La vena contracta tridimensionnelle mesure directement la surface.</p></template>

<template data-pop="i34-vp" data-title="Flux veineux pulmonaire">
<div class="lab">Normal</div><p>Doppler pulsé dans une veine pulmonaire (souvent la veine supérieure droite) : onde systolique S supérieure à l’onde diastolique D, puis petite onde auriculaire rétrograde.</p>
<div class="lab">Fuite mitrale sévère</div><p>Inversion de l’onde systolique : le jet remonte jusque dans les veines pulmonaires. Signe spécifique de fuite sévère, surtout s’il est présent dans plusieurs veines.</p>
<div class="lab">Limites</div><p>Émoussement de l’onde S non spécifique (fibrillation auriculaire, pressions de remplissage élevées) ; un jet excentrique peut inverser le flux d’une seule veine.</p></template>

<template data-pop="i34-planim" data-title="Planimétrie de la surface mitrale">
<div class="lab">Principe</div><p>Tracé direct, en échocardiographie bidimensionnelle ou tridimensionnelle, du contour interne de l’orifice sur une coupe petit axe, au niveau de la pointe des feuillets, en mésodiastole, à l’ouverture maximale.</p>
<div class="lab">Statut</div><p>Méthode de référence pour le rétrécissement mitral rhumatismal : indépendante du débit, de la fréquence et des fuites associées. L’échocardiographie tridimensionnelle facilite le repérage du plus petit orifice.</p>
<div class="lab">Seuils</div><p>≤ 1,5 cm² : sténose cliniquement sévère lorsqu’elle s’accompagne de symptômes, d’un risque thromboembolique élevé ou d’une décompensation (ESC/EACTS 2025). L’ESC/EACTS 2025 qualifie de « sévère à bas gradient » une surface &lt; 1,5 cm² avec un gradient moyen &lt; 10 mmHg.</p>
<div class="lab">Pièges</div><p>Coupe trop proche de l’anneau (surface surestimée) ; gain trop faible ; calcifications denses ; mauvaise échogénicité. Peu fiable dans le rétrécissement dégénératif, où l’orifice est tubulaire et calcifié.</p></template>

<template data-pop="i34-pht" data-title="Temps de demi-pression (PHT)">
<div class="lab">Définition</div><p>Temps nécessaire pour que le gradient maximal transmitral diminue de moitié, mesuré sur la pente de décroissance de l’onde E au Doppler continu.</p>
<div class="lab">Formule empirique</div><p>Surface mitrale (cm²) = 220 / PHT (ms). Exemple : PHT 200 ms → 1,1 cm².</p>
<div class="lab">Fondement</div><p>Plus l’orifice est petit, plus l’oreillette se vide lentement et plus le gradient persiste.</p>
<div class="lab">Pièges</div><p>Invalide juste après commissurotomie (compliances en cours d’adaptation) ; raccourci par une fuite aortique importante ou un ventricule rigide (le ventricule se remplit aussi par ailleurs ou sa pression monte vite), ce qui surestime la surface ; peu fiable dans le rétrécissement dégénératif du sujet âgé.</p></template>

<template data-pop="i34-wilkins" data-title="Score de Wilkins">
<div class="lab">Items (cotés de 1 à 4)</div><p><b>Mobilité</b> : 1 = seule la pointe des feuillets est restreinte ; 4 = aucun mouvement ou presque. <b>Épaississement des feuillets</b> : 1 = presque normal ; 4 = épaississement important de tout le feuillet. <b>Appareil sous-valvulaire</b> : 1 = épaississement minime sous les feuillets ; 4 = épaississement et raccourcissement étendus jusqu’aux piliers. <b>Calcification</b> : 1 = une seule zone brillante ; 4 = calcification étendue à la majeure partie du feuillet.</p>
<div class="lab">Interprétation</div><p>Total de 4 à 16. L’ESC/EACTS 2025 tient un score &gt; 8 pour défavorable à la commissurotomie percutanée ; la décision se prend au cas par cas, car des patients à anatomie défavorable peuvent encore en bénéficier, surtout si leur risque chirurgical est élevé.</p>
<div class="lab">Limites</div><p>Ne prend pas en compte la répartition des calcifications entre les commissures ni la fuite mitrale associée. Le score de Cormier, plus simple, est aussi utilisé en Europe.</p></template>

<template data-pop="i34-fvd" data-title="Fonction ventriculaire droite en échocardiographie">
<div class="lab">Paramètres</div><p>TAPSE (excursion systolique de l’anneau tricuspide en mode temps-mouvement) : normal ≥ 17 mm. Onde S′ de l’anneau en Doppler tissulaire : normale ≥ 9,5 cm/s. Variation fractionnelle de surface : &gt; 32 %. Strain longitudinal de la paroi libre : une valeur absolue &lt; 20 % traduit une dysfonction (EACVI 2022).</p>
<div class="lab">Couplage ventriculo-artériel</div><p>Rapport TAPSE / pression artérielle pulmonaire systolique : une valeur basse traduit un découplage, c’est-à-dire un ventricule droit qui ne s’adapte plus à une postcharge durablement élevée (ESC/EACTS 2025).</p>
<div class="lab">Piège</div><p>Dans une fuite tricuspide massive, le ventricule décharge dans l’oreillette : les indices longitudinaux restent longtemps « normaux » et surestiment la contractilité. L’IRM mesure volumes et fraction d’éjection droites avec précision.</p></template>

<template data-pop="i34-bernoulli" data-title="Équation de Bernoulli simplifiée">
<div class="lab">Formule</div><p>Gradient de pression (mmHg) = 4 × v² (v en m/s), en négligeant la vitesse d’amont et les pertes visqueuses.</p>
<div class="lab">Applications</div><p>Gradient transmitral du rétrécissement mitral ; pression artérielle pulmonaire systolique = 4 × (vitesse de la fuite tricuspide)² + pression de l’oreillette droite estimée par la veine cave inférieure ; gradient du rétrécissement pulmonaire.</p>
<div class="lab">Exemple</div><p>Vitesse de la fuite tricuspide 3,5 m/s : 4 × 12,25 = 49 mmHg ; avec une pression de l’oreillette droite estimée à 8 mmHg, pression pulmonaire systolique ≈ 57 mmHg.</p>
<div class="lab">Piège</div><p>Fuite tricuspide torrentielle : le gradient s’effondre et la pression pulmonaire est sous-estimée.</p></template>

<template data-pop="i34-repar" data-title="Réparation mitrale chirurgicale">
<div class="lab">Principes</div><p>Restaurer une hauteur de coaptation suffisante, corriger le prolapsus, remodeler l’anneau.</p>
<div class="lab">Techniques</div><p>Résection triangulaire ou quadrangulaire du segment prolabant (feuillet postérieur) ; néocordages en polytétrafluoroéthylène expansé, qui corrigent le prolapsus sans retirer de tissu ; annuloplastie par anneau complet ou partiel ; fermeture d’une fente ou d’une perforation ; plus rarement, suture bord à bord chirurgicale.</p>
<div class="lab">Voies</div><p>Sternotomie ou chirurgie mini-invasive par thoracotomie droite, éventuellement assistée par vidéo ou robot, dans les centres expérimentés (classe IIb, ESC/EACTS 2025).</p>
<div class="lab">Contrôle</div><p>ETO peropératoire : fuite résiduelle, gradient, absence de mouvement systolique antérieur du feuillet antérieur, complication spécifique d’un excès de tissu postérieur ou d’un anneau trop petit.</p>
<div class="lab">Résultats</div><p>Ils dépendent de l’expérience du centre et de la complexité des lésions : c’est pourquoi l’ESC/EACTS 2025 subordonne l’opération du patient asymptomatique à la probabilité d’une réparation durable.</p></template>

<template data-pop="i34-teer" data-title="Réparation mitrale bord à bord percutanée (TEER)">
<div class="lab">Principe</div><p>Dispositif en forme de pince introduit par la veine fémorale, qui traverse le septum interauriculaire et saisit les deux feuillets en regard de la fuite ; il crée un double orifice. Guidage par ETO tridimensionnelle.</p>
<div class="lab">Indications (ESC/EACTS 2025)</div><p>Fuite secondaire ventriculaire sévère persistante malgré un traitement optimisé, FEVG &lt; 50 %, critères cliniques et anatomiques remplis : classe I. Fuite primaire symptomatique chez un patient à haut risque chirurgical, anatomie favorable : classe IIa. Fuite secondaire atriale chez un patient non candidat à la chirurgie : classe IIb.</p>
<div class="lab">Anatomie favorable</div><p>L’EACVI 2022 (tableau 13) énumère les paramètres défavorables. Fuite primaire : perforation ou large fente, fuite rhumatismale, écart du feuillet flottant &gt; 10 mm ou largeur &gt; 15 mm, surface d’ouverture mitrale ≤ 3 cm² (risque de sténose iatrogène, puisque la pince crée un double orifice), calcification dans la zone de saisie. Fuite secondaire : tenting sévère (profondeur de coaptation &gt; 11 mm), longueur de coaptation &lt; 2 mm, feuillet postérieur &lt; 7 mm, ventricule très dilaté (diamètre télédiastolique &gt; 70 mm ou volume indexé &gt; 96 mL/m²). La décision revient à l’équipe cardiaque.</p>
<div class="lab">Complications</div><p>Rares : détachement d’un feuillet, sténose mitrale iatrogène, communication interauriculaire résiduelle, complications vasculaires.</p>
<div class="lab">Après le geste</div><p>Échocardiographie de contrôle ; antithrombotique selon le rythme et le protocole du centre ; antibioprophylaxie de l’endocardite selon l’ESC.</p></template>

<template data-pop="i34-mitrafr" data-title="Essai MITRA-FR (2018)">
<div class="lab">Plan</div><p>Essai français randomisé, 304 patients avec insuffisance cardiaque à FEVG 15–40 % et fuite mitrale secondaire sévère (SOR &gt; 20 mm² ou volume régurgité &gt; 30 mL) ; réparation bord à bord plus traitement médical contre traitement médical seul.</p>
<div class="lab">Résultat</div><p>À 12 mois, critère décès ou hospitalisation non programmée pour insuffisance cardiaque : 54,6 % contre 51,3 % (différence non significative). Décès : 24,3 % contre 22,4 %. Pas de différence non plus à 2 ans (ESC/EACTS 2025).</p>
<div class="lab">Explications proposées</div><p>L’ESC/EACTS 2025 évoque les tailles d’effet, la conception des essais, la sélection et le suivi des patients, l’évaluation échocardiographique de la fuite, le traitement médical et des facteurs techniques ; voir aussi la notion de <button class="w" data-k="i34-propor">fuite proportionnée</button>.</p>
<div class="lab">Source</div><p>Obadia et al., <i>New England Journal of Medicine</i> 2018 (résumé lu) ; ESC/EACTS 2025.</p></template>

<template data-pop="i34-coapt" data-title="Essai COAPT (2018)">
<div class="lab">Plan</div><p>Essai randomisé mené dans 78 centres des États-Unis et du Canada, 614 patients avec insuffisance cardiaque et fuite secondaire modérée à sévère ou sévère, symptomatiques malgré un traitement médical recommandé aux doses maximales ; réparation bord à bord plus traitement médical contre traitement médical seul.</p>
<div class="lab">Résultats</div><p>Hospitalisations pour insuffisance cardiaque sur 24 mois : 35,8 % contre 67,9 % par patient-année (rapport de risques 0,53). Mortalité totale à 24 mois : 29,1 % contre 46,1 % (rapport de risques 0,62). Absence de complication liée au dispositif à 12 mois : 96,6 %. Le bénéfice sur les hospitalisations et la mortalité se maintient à 5 ans, mais l’incidence cumulée de décès ou d’hospitalisation reste de 73,6 % dans le groupe traité (ESC/EACTS 2025).</p>
<div class="lab">Leçon</div><p>Les patients traités restent à haut risque : l’ESC/EACTS 2025 demande un suivi clinique, biologique et échocardiographique tous les 3 ou 6 mois par un spécialiste de l’insuffisance cardiaque.</p>
<div class="lab">Source</div><p>Stone et al., <i>New England Journal of Medicine</i> 2018 (résumé lu) ; ESC/EACTS 2025.</p></template>

<template data-pop="i34-reshape" data-title="Essai RESHAPE-HF2 (2024)">
<div class="lab">Plan</div><p>Troisième essai randomisé de réparation bord à bord dans la fuite mitrale secondaire, chez des patients symptomatiques malgré le traitement médical, avec des fuites dites « cliniquement significatives », en moyenne moins sévères que dans COAPT.</p>
<div class="lab">Résultats à 24 mois</div><p>Réduction de 36 % des hospitalisations pour insuffisance cardiaque ou des décès cardiovasculaires, portée par les hospitalisations ; mortalité cardiovasculaire seule non réduite. Qualité de vie (score KCCQ) : +10,9 points par rapport au groupe contrôle (ESC/EACTS 2025).</p>
<div class="lab">Méta-analyse des trois essais</div><p>Moins de réhospitalisations à 24 mois (rapport de risques 0,63) et moins de décès ou d’hospitalisations toutes causes (0,72), sans différence significative sur la mortalité totale ou cardiovasculaire (ESC/EACTS 2025).</p>
<div class="lab">Portée</div><p>La réparation bord à bord est recommandée pour réduire les hospitalisations et améliorer la qualité de vie, chez des patients qui remplissent des critères cliniques et échocardiographiques précis.</p></template>

<template data-pop="i34-invictus" data-title="Essai INVICTUS (2022)">
<div class="lab">Plan</div><p>4565 patients, cardiopathie rhumatismale avec fibrillation auriculaire et au moins un marqueur de risque (score CHA₂DS₂-VASc ≥ 2, surface mitrale ≤ 2 cm², contraste spontané ou thrombus de l’oreillette gauche) ; rivaroxaban contre antivitamine K (dose adaptée à l’INR).</p>
<div class="lab">Résultats</div><p>Le critère composite (accident vasculaire cérébral, embolie systémique, infarctus, décès vasculaire ou de cause inconnue) est survenu plus souvent sous rivaroxaban, avec une mortalité plus élevée (survie moyenne restreinte plus courte de 72 jours). Les hémorragies majeures n’étaient pas moins fréquentes.</p>
<div class="lab">Portée</div><p>Fonde la recommandation de ne pas utiliser les AOD dans la fibrillation auriculaire avec rétrécissement mitral rhumatismal ≤ 2,0 cm² (ESC/EACTS 2025, classe III, niveau B).</p>
<div class="lab">Interprétation</div><p>La raison de la supériorité de l’antivitamine K n’est pas établie. La différence portait surtout sur les décès, et l’arrêt définitif du traitement était plus fréquent sous rivaroxaban à toutes les visites. L’essai ne permet donc pas d’attribuer le résultat à un seul mécanisme antithrombotique.</p>
<div class="lab">Population concernée</div><p>Les patients avaient en moyenne 50,5 ans et 72,3 % étaient des femmes, profil typique de la cardiopathie rhumatismale des régions d’endémie. Le résultat ne s’étend ni aux fuites mitrales ni au rétrécissement mitral dégénératif, qui n’étaient pas étudiés.</p>
<div class="lab">Ce qui change la décision</div><p>Chez une patiente rhumatismale en fibrillation auriculaire, avec une surface ≤ 2,0 cm², un INR difficile à équilibrer appelle une éducation du patient et des contrôles plus rapprochés, non le passage à un AOD.</p>
<div class="lab">Source complémentaire</div><p>Connolly et al. Rivaroxaban in rheumatic heart disease-associated atrial fibrillation. N Engl J Med 2022;387:978-988. Praz et al. 2025 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2025;46:4635-4736.</p>
</template>

<template data-pop="i34-cmp" data-title="Commissurotomie mitrale percutanée">
<div class="lab">Technique</div><p>Accès veineux fémoral, ponction transseptale, ballon d’Inoue gonflé par paliers dans l’orifice mitral. Après chaque gonflement : gradient, surface, fuite mitrale. On arrête dès que la surface est suffisante ou qu’une fuite apparaît.</p>
<div class="lab">Prérequis</div><p>ETO systématique avant le geste (ESC/EACTS 2025) : absence de thrombus dans l’oreillette et l’auricule ; fuite mitrale au plus légère ; score de Wilkins ; répartition des calcifications commissurales.</p>
<div class="lab">Résultat</div><p>La surface et le gradient moyen obtenus après le geste conditionnent le pronostic à long terme (ESC/EACTS 2025).</p>
<div class="lab">Complications</div><p>Fuite mitrale sévère par déchirure (parfois chirurgie urgente) ; tamponnade ; embolie cérébrale ; communication interauriculaire résiduelle.</p>
<div class="lab">Suivi</div><p>Échocardiographie de référence après le geste, puis suivi régulier, car une resténose asymptomatique peut survenir ; une nouvelle commissurotomie est possible chez des candidats choisis si le mécanisme dominant est une nouvelle fusion commissurale (ESC/EACTS 2025).</p></template>

<template data-pop="i34-triscore" data-title="TRI-SCORE">
<div class="lab">But</div><p>Score de risque de mortalité hospitalière après chirurgie tricuspide isolée, développé en France (Dreyfus, 2022).</p>
<div class="lab">Éléments</div><p>Âge ≥ 70 ans ; classe NYHA III ou IV ; signes d’insuffisance cardiaque droite ; dose de furosémide ≥ 125 mg/jour ; DFG &lt; 30 mL/min ; bilirubine totale élevée ; FEVG &lt; 60 % ; dysfonction ventriculaire droite modérée à sévère. Total de 0 à 12 points.</p>
<div class="lab">Interprétation</div><p>Risque faible à intermédiaire (≤ 5 points) : dans un registre de 2413 patients, l’intervention précoce, chirurgicale ou percutanée, était associée à une meilleure survie à moyen terme que le traitement conservateur. Score ≥ 6 : aucun bénéfice associé, probablement parce que l’atteinte du ventricule droit, du foie et du rein ne régresse plus ; le choix entre geste percutané et traitement médical se fait au cas par cas. Le score aide ainsi à éviter les gestes futiles ; ces données restent observationnelles.</p></template>

<template data-pop="i34-ttvi" data-title="Traitement percutané de la valve tricuspide">
<div class="lab">Réparation bord à bord</div><p>Pince qui rapproche les feuillets (le plus souvent septal et antérieur). Sûre, peu de blocs ; efficacité limitée si la coaptation manque largement, si le feuillet septal est court ou si une sonde gêne la saisie.</p>
<div class="lab">Remplacement percutané</div><p>Prothèse ancrée dans l’anneau par voie fémorale ou jugulaire. Suppression presque complète de la fuite, quelle que soit l’anatomie des feuillets ; au prix d’hémorragies majeures (environ 15 % dans TRISCEND II selon l’ESC/EACTS 2025), d’un besoin fréquent de stimulateur, car la prothèse ancrée dans l’anneau comprime le tissu de conduction voisin, et d’une anticoagulation.</p>
<div class="lab">Sélection (ESC/EACTS 2025, classe IIa)</div><p>Patient à haut risque chirurgical, fuite sévère symptomatique malgré le traitement médical, sans dysfonction ventriculaire droite sévère ni hypertension pulmonaire précapillaire ; évaluation par l’équipe cardiaque ; cathétérisme droit préalable.</p>
<div class="lab">Bénéfice démontré</div><p>Qualité de vie, capacité fonctionnelle, remodelage droit. Aucun essai randomisé n’a encore démontré de réduction de la mortalité.</p></template>

<template data-pop="i34-trilum" data-title="Essai TRILUMINATE (2023)">
<div class="lab">Plan</div><p>Essai randomisé de réparation bord à bord tricuspide plus traitement médical contre traitement médical seul, chez des patients porteurs d’une fuite tricuspide sévère symptomatique.</p>
<div class="lab">Résultats</div><p>Le critère composite (décès, chirurgie tricuspide, hospitalisation pour insuffisance cardiaque, qualité de vie) est favorable à la réparation, uniquement grâce à la qualité de vie : +11,7 points de score KCCQ. À 2 ans, moins d’hospitalisations pour insuffisance cardiaque dans le groupe traité, malgré 59 % de passages croisés (ESC/EACTS 2025).</p>
<div class="lab">Limite</div><p>Bénéfice porté par un critère subjectif dans un essai ouvert ; un essai français indépendant (Tri.Fr) trouve aussi un bénéfice porté par les critères rapportés par les patients.</p></template>

<template data-pop="i34-triscend" data-title="Essai TRISCEND II (2024)">
<div class="lab">Plan</div><p>Essai randomisé de remplacement tricuspide percutané plus traitement médical optimisé contre traitement médical seul, chez des patients porteurs d’une fuite tricuspide sévère symptomatique.</p>
<div class="lab">Résultats</div><p>Rapport de gains favorable au remplacement, expliqué surtout par les symptômes et la qualité de vie ; remodelage inverse du ventricule droit.</p>
<div class="lab">Sécurité</div><p>Hémorragies majeures environ 15 % ; stimulateur définitif chez environ un quart des patients qui n’en avaient pas, à 12 mois (ESC/EACTS 2025). Aucune réduction de la mortalité n’a été démontrée.</p></template>

<template data-pop="i34-valvulo-pulm" data-title="Valvuloplastie pulmonaire au ballon">
<div class="lab">Indication</div><p>Rétrécissement pulmonaire valvulaire avec gradient maximal &gt; 64 mmHg (vitesse &gt; 4 m/s), même asymptomatique, si la valve s’y prête (ESC 2020 sur les cardiopathies congénitales de l’adulte) ; plus bas en cas de symptômes, d’arythmie ou de shunt droite-gauche.</p>
<div class="lab">Technique</div><p>Ballon de diamètre légèrement supérieur à l’anneau, par voie veineuse fémorale.</p>
<div class="lab">Résultats</div><p>Excellents et durables sur une valve en dôme ; médiocres sur une valve dysplasique. Une insuffisance pulmonaire résiduelle est fréquente et généralement bien tolérée ; un obstacle infundibulaire réactionnel peut apparaître transitoirement.</p></template>

<template data-pop="i34-poly" data-title="Lecture des polyvalvulopathies">
<div class="lab">Rétrécissement mitral + rétrécissement aortique</div><p>Le bas débit dû à la sténose mitrale abaisse le gradient aortique : la sténose aortique est sous-estimée. Mesurer la surface aortique (continuité, planimétrie, score calcique).</p>
<div class="lab">Fuite mitrale sévère + rétrécissement aortique</div><p>Le volume éjecté dans l’aorte est réduit : rétrécissement aortique à bas débit, gradient faussement bas. La fuite mitrale peut aussi s’aggraver par l’obstacle aortique (pression ventriculaire élevée) et régresser après remplacement aortique si elle est secondaire.</p>
<div class="lab">Fuite aortique + rétrécissement mitral</div><p>Le temps de demi-pression mitral est raccourci par le remplissage aortique rétrograde : surface mitrale surestimée ; préférer la planimétrie.</p>
<div class="lab">Fuites multiples</div><p>Volumes régurgités difficiles à séparer : l’IRM et la confrontation des volumes ventriculaires aident.</p></template>

<template data-pop="i34-inr-prot" data-title="INR cible des prothèses mécaniques">
<div class="lab">Principe (ESC/EACTS 2025)</div><p>La cible dépend du type et de la position de la prothèse, puis de facteurs prothrombotiques liés au patient.</p>
<div class="lab">Facteurs prothrombotiques additionnels</div><p>État d’hypercoagulabilité héréditaire ou acquis ; FEVG &lt; 35 % ; fibrillation auriculaire avec rétrécissement mitral significatif ; événement thrombotique majeur de moins de 12 mois (accident vasculaire cérébral cardioembolique, thrombose veineuse profonde, embolie pulmonaire). Chacun majore la formation de thrombus, par stase ou par activation de la coagulation.</p>
<div class="lab">Cibles</div><p>Prothèse aortique à double ailette ou à disque unique de génération actuelle : 2,5 (2,0–3,0) sans facteur additionnel, 3,0 (2,5–3,5) avec. Prothèse à bille ou à disque basculant, quelle que soit sa position, et toute prothèse mécanique mitrale ou tricuspide : 3,0 (2,5–3,5) sans facteur additionnel, 3,5 (3,0–4,0) avec. La position mitrale exige une cible plus haute, car elle est plus thrombogène : le flux diastolique y est lent et souvent associé à une fibrillation et à une grande oreillette.</p>
<div class="lab">Associations</div><p>Après une thromboembolie majeure survenue malgré un INR correct, on envisage une cible plus haute ou l’on ajoute de l’acide acétylsalicylique à faible dose (classe IIa). L’acide acétylsalicylique se discute aussi en cas d’athérosclérose symptomatique, selon le risque hémorragique, car l’association à l’antivitamine K augmente les saignements.</p></template>

<template data-pop="i34-foiecard" data-title="Foie cardiaque">
<div class="lab">Mécanisme</div><p>Pression veineuse centrale élevée transmise aux veines sus-hépatiques : congestion centrolobulaire, atrophie des hépatocytes, puis fibrose en pont entre veines centrales (cirrhose cardiaque).</p>
<div class="lab">Biologie</div><p>Cholestase (gamma-glutamyltransférase, bilirubine) plus que cytolyse ; INR spontanément augmenté ; albumine basse.</p>
<div class="lab">Imagerie</div><p>Veines sus-hépatiques et veine cave dilatées ; inversion systolique du flux sus-hépatique ; élastographie faussement élevée par la congestion.</p>
<div class="lab">Portée</div><p>Réversible au stade de congestion ; la fibrose avancée alourdit le risque de toute intervention et plaide pour une prise en charge avant ce stade.</p></template>
<template data-pop="i34-congestion-renale" data-title="Congestion veineuse et fonction rénale">
<div class="lab">Physiologie normale</div><p>Le débit sanguin rénal dépend de la différence entre la pression artérielle qui entre dans le rein et la pression veineuse qui en sort. La pression veineuse centrale est normalement basse, de quelques mmHg ; elle pèse donc peu sur la perfusion du rein, et la filtration glomérulaire suit surtout la pression artérielle et le débit cardiaque.</p>
<div class="lab">Mécanisme</div><p>Dans une fuite tricuspide sévère, le volume régurgité élève la pression de l’oreillette droite, qui se transmet à la veine cave inférieure puis aux veines rénales. La pression de sortie du rein monte, ce qui réduit le gradient de perfusion. Les mécanismes proposés comprennent aussi une hausse de la pression interstitielle dans un organe enfermé dans sa capsule, qui comprime tubules et capillaires, et l’activation du système rénine-angiotensine-aldostérone, qui retient sodium et eau et entretient la congestion.</p>
<div class="lab">Conséquence clinique</div><p>Chez 145 patients hospitalisés pour insuffisance cardiaque avancée décompensée, 40 % ont présenté une aggravation de la fonction rénale (hausse de la créatinine ≥ 0,3 mg/dL, soit environ 27 µmol/L). Ces patients avaient une pression veineuse centrale plus élevée à l’admission (18 contre 12 mmHg), et ce lien persistait quels que soient la pression artérielle, la pression capillaire et l’index cardiaque. L’aggravation rénale était moins fréquente lorsque la pression veineuse centrale descendait sous 8 mmHg. La congestion veineuse, et non le seul bas débit, apparaît donc comme le principal déterminant hémodynamique.</p>
<div class="lab">Ce qui change la décision</div><p>Une créatinine qui monte chez un patient porteur d’une fuite tricuspide sévère, avec jugulaires turgescentes, foie congestif et veine cave dilatée, traduit souvent une décongestion insuffisante. Arrêter le diurétique par réflexe aggrave alors la congestion ; il faut juger l’état volémique sur l’ensemble des signes. Une atteinte rénale avancée (DFG &lt; 30 mL/min) compte dans le TRI-SCORE et alourdit le risque d’une intervention, ce qui plaide pour adresser le patient avant ce stade.</p>
<div class="lab">Limites</div><p>Ces données proviennent d’une cohorte observationnelle d’insuffisance cardiaque à fraction d’éjection basse, non d’une population de fuites tricuspides isolées. Une hausse de la créatinine peut aussi venir d’une hypoperfusion, d’un excès de diurétique ou d’un néphrotoxique : la congestion est une hypothèse à vérifier, non une règle.</p>
<div class="lab">Source</div><p>Mullens et al. Importance of venous congestion for worsening of renal function in advanced decompensated heart failure. J Am Coll Cardiol 2009;53:589-596. Praz et al. 2025 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2025;46:4635-4736. Dreyfus et al. TRI-SCORE: a new risk score for in-hospital mortality prediction after isolated tricuspid valve surgery. Eur Heart J 2022;43:654-662.</p></template>
