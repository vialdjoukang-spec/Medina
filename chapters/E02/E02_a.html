<p>Dans cette <b>vignette fictive</b>, une femme de 31 ans prépare une grossesse. Elle est végane depuis quatre ans, cuisine sans sel iodé, boit des boissons végétales non enrichies et prend un complément multivitaminé dont la composition ne mentionne pas d’iode. Son médecin dose la <button class="w" data-k="e02-tsh">TSH</button> avant la conception : 5,8 mU/L, avec une <button class="w" data-k="e02-t4">T4</button> libre dans l’intervalle de référence. Ces valeurs sont pédagogiques ; elles servent à poser trois questions.</p>
<p>La première concerne la réalité de l’anomalie : une seule mesure ne fait pas un diagnostic, car la <button class="w" data-k="e02-tsh">TSH</button> varie dans la journée et se normalise spontanément chez 6 à 35 % des personnes. La deuxième concerne la cause : une thyroïdite auto-immune, première cause d’hypothyroïdie infraclinique persistante, ou un apport d’iode insuffisant. La troisième concerne la conduite : corriger l’apport en iode, substituer par <button class="w" data-k="e02-levo">lévothyroxine</button>, ou surveiller.</p>
<div class="key"><b>À retenir.</b> Confirmer d’abord, rechercher la cause ensuite, traiter en dernier. La catégorie E02 suppose que la carence en iode est documentée ou très probable ; une <button class="w" data-k="e02-hic">hypothyroïdie infraclinique (définition et seuils)</button> isolée n’est pas présumée iodoprive dans un pays où le sel est iodé.</div>
</section>

<section class="ilot" id="e02-1"><h2><span class="n">1</span>Définition, nosologie et classifications</h2>
<h3>1.1 Ce que désigne le code E02</h3>
<p>Le libellé de l’Office fédéral de la statistique est « Hypothyroïdie par carence inapparente en iode ». La catégorie ne comporte aucun sous-code. L’adjectif « inapparente » traduit le terme anglais <i>subclinical</i> de la classification de l’<button class="w" data-k="e02-s-oms">OMS</button> : c’est l’<b>hypothyroïdie</b> qui est infraclinique, c’est-à-dire découverte par la biologie sans signe clinique net, et non la carence. L’iode manque bel et bien ; la glande compense encore.</p>
<p>La <button class="w" data-k="e02-nomenclature">frontière avec E01 et E03 (notes d’exclusion de la classification)</button> se trace ainsi : la catégorie E01 exclut E02, et l’hypothyroïdie acquise par carence iodée non précisée, donc manifeste, se classe en <button class="w" data-k="e02-nomenclature">E01.8</button> ; la catégorie E03 exclut l’hypothyroïdie liée à la carence iodée. Le cours traite donc l’hypothyroïdie <b>infraclinique attribuée à une carence en iode</b>. L’hypothyroïdie infraclinique d’une autre cause, surtout auto-immune, relève de E03 ou de E06 et devient ici le diagnostic différentiel principal.</p>
<table class="t"><thead><tr><th>Code</th><th>Contenu</th><th>Place dans ce cours</th></tr></thead><tbody><tr><td>E01</td><td>Affections thyroïdiennes liées à une carence en iode</td><td>Renvoi : le goitre de la carence chronique y est traité</td></tr><tr><td>E01.8</td><td>Hypothyroïdie acquise par carence iodée, non précisée</td><td>Reclassement si la T4 libre devient basse</td></tr><tr><td>E02</td><td>Hypothyroïdie par carence inapparente en iode</td><td>Objet du cours</td></tr><tr><td>E03</td><td>Autres hypothyroïdies, hors carence iodée</td><td>Diagnostic différentiel</td></tr></tbody></table>
<p>Ce tableau situe la catégorie. Sa lecture pratique est simple : la valeur de la <button class="w" data-k="e02-t4">T4</button> libre décide du code. Normale avec une <button class="w" data-k="e02-tsh">TSH</button> élevée, elle oriente vers E02 ; basse, elle oriente vers E01.8.</p>
<h3>1.2 Hypothyroïdie infraclinique et ses catégories</h3>
<p>L’<button class="w" data-k="e02-hic">hypothyroïdie infraclinique (HIC)</button> est une <button class="w" data-k="e02-tsh">TSH</button> sérique élevée avec une <button class="w" data-k="e02-t4">T4</button> libre et une T3 libre dans l’intervalle de référence. L’<button class="w" data-k="e02-s-eta">ETA</button> retient pour la <button class="w" data-k="e02-tsh">TSH</button> un intervalle de 0,4 à 4,0 mU/L chez l’adulte ; le laboratoire du patient reste la référence de la mesure.</p>
<table class="t"><thead><tr><th>Catégorie (adulte non enceinte)</th><th>TSH</th><th>Part des cas</th><th>Conduite de principe</th></tr></thead><tbody><tr><td>HIC légère</td><td>4,0 à 10,0 mU/L</td><td>Environ 90 %</td><td>Surveillance ; essai de lévothyroxine possible si symptômes chez un sujet de moins de 65 ans</td></tr><tr><td>HIC sévère</td><td>Plus de 10 mU/L</td><td>Environ 10 %</td><td>Traitement recommandé avant 65 à 70 ans, même sans symptôme</td></tr></tbody></table>
<p>Le seuil de 10 mU/L sépare deux risques : le risque coronarien et celui d’insuffisance cardiaque apparaissent surtout au-dessus de lui (voir la section 10). Les seuils changent hors de l’adulte non enceinte. Pendant la <button class="w" data-k="e02-grossesse">grossesse (définitions et risques)</button>, la <button class="w" data-k="e02-tsh">TSH</button> se compare à un intervalle propre à la grossesse ; chez l’<button class="w" data-k="e02-enfant">enfant (définition et évolution)</button>, l’HIC correspond à une <button class="w" data-k="e02-tsh">TSH</button> supérieure à 5,5–10 mU/L.</p>
<h3>1.3 Apports recommandés en iode</h3>
<p>Savoir si un apport est insuffisant exige un point de comparaison. Deux référentiels existent : celui de l’<button class="w" data-k="e02-s-oms">OMS</button>, de l’UNICEF et de l’ICCIDD, et celui de l’<button class="w" data-k="e02-s-efsa">EFSA</button>. Ils ne coïncident pas en grossesse, et le cours les cite séparément.</p>
<table class="t"><thead><tr><th>Population</th><th>OMS, UNICEF, ICCIDD (2007)</th><th>EFSA (2014)</th></tr></thead><tbody><tr><td>Enfant de 0 à 59 mois</td><td>90 µg/j</td><td>70 à 130 µg/j (7 mois et plus)</td></tr><tr><td>Enfant de 6 à 12 ans</td><td>120 µg/j</td><td>Non lu dans le dossier</td></tr><tr><td>Adolescent et adulte</td><td>150 µg/j</td><td>150 µg/j</td></tr><tr><td>Grossesse et allaitement</td><td>250 µg/j</td><td>200 µg/j</td></tr></tbody></table>
<p>Le tableau montre un accord chez l’adulte et un écart de 50 µg/j en grossesse. Cet écart a une conséquence pratique : une femme enceinte à 220 µg/j serait suffisante selon l’<button class="w" data-k="e02-s-efsa">EFSA</button> et insuffisante selon l’<button class="w" data-k="e02-s-oms">OMS</button>. Les <button class="w" data-k="e02-apports">apports recommandés (détail et limites)</button> sont des cibles de population, pas des seuils de maladie.</p>
<div class="trap"><span class="k">Piège</span> Confondre le <b>code</b> E02 et le <b>diagnostic</b> d’une carence. Le code décrit une situation biologique (TSH élevée, T4 libre normale) rattachée à une cause ; il ne prouve pas la cause. Aucun critère diagnostique publié propre à E02 n’a été retrouvé : la section 12 propose une construction pédagogique, signalée comme telle.</div>
<button class="pareto-btn ui" data-k="pareto-e02-definition">▲ Loi de Pareto — Définition et nosologie</button>
</section>

<section class="ilot" id="e02-2"><h2><span class="n">2</span>Fréquence et situation suisse</h2>
<h3>2.1 L’hypothyroïdie infraclinique en général</h3>
<p>La prévalence de l’HIC va de 4 à 10 % selon le sexe, l’âge et la population : environ 8 % des femmes (10 % après 55 ans) et 3 % des hommes. Elle augmente avec l’âge, chez les personnes d’origine européenne et, fait contre-intuitif, <b>dans les régions suffisamment iodées</b>. Environ 20 % des HIC n’ont ni anticorps anti-<button class="w" data-k="e02-antitpo">TPO</button> ni anticorps anti-thyroglobuline détectables ; la <b>thyroïdite auto-immune</b> reste la cause persistante la plus fréquente.</p>
<h3>2.2 Le paradoxe iodé</h3>
<p>Un apport faible ne produit pas mécaniquement plus d’hypothyroïdie. Au Danemark, avant l’iodation, la région en carence modérée (iodurie 45 µg/L) comptait <b>moins</b> d’hypothyroïdies manifestes (26,5 pour 100 000 par an) que la région en carence légère (61 µg/L ; 40,1 pour 100 000 par an), mais <b>plus</b> d’hyperthyroïdies (92,9 contre 65,4 pour 100 000 par an). La <button class="w" data-k="e02-paradoxe">relation en U entre apport et fonction thyroïdienne (étude danoise)</button> résume ce résultat : des troubles surviennent en cas d’apport insuffisant comme excessif, et les auteurs situent l’optimum dans une plage étroite autour de 150 µg/j. Le résumé lu ne donne pas le mécanisme de l’écart entre les deux régions.</p>
<div class="key"><b>Conséquence didactique.</b> Dans un pays iodé comme la Suisse, une HIC n’est pas présumée liée à l’iode. E02 exige une carence documentée ou fortement probable : grossesse, régime sans sel iodé ni laitages, supplément sans iode.</div>
<h3>2.3 La Suisse</h3>
<p>Le sel iodé existe en Suisse depuis 1922 et dans tout le pays depuis 1952. Sa teneur est passée de 3,75 mg/kg à 25 mg/kg en janvier 2014 (<button class="w" data-k="e02-sel">histoire et règles du sel iodé</button>). L’iodation reste <b>volontaire</b> : plus de 80 % des ménages utilisent du sel iodé, mais un tiers seulement des aliments transformés salés en contient, alors que 70 à 80 % du sel consommé vient de ces aliments.</p>
<table class="t"><thead><tr><th>Population (Suisse, 2020–2022)</th><th>Résultat</th><th>Lecture</th></tr></thead><tbody><tr><td>Écoliers de 6 à 12 ans</td><td>Iodurie médiane 127 µg/L ; apport inadéquat chez 5,4 %</td><td>Statut suffisant</td></tr><tr><td>Femmes enceintes</td><td>Iodurie médiane 97 µg/L (seuil OMS : 150 µg/L)</td><td>Statut insuffisant</td></tr><tr><td>Femmes enceintes sans supplément iodé</td><td>Apport inadéquat chez 31 %</td><td>Risque concentré ici</td></tr><tr><td>Femmes enceintes sous supplément iodé</td><td>Apport inadéquat chez 0,2 %</td><td>Le supplément protège</td></tr></tbody></table>
<p>Le <button class="w" data-k="e02-suisse">monitorage national 2020–2022 (méthode et chiffres)</button> montre un fossé entre l’enfant, protégé par le sel, et la femme enceinte, dont les besoins montent : l’iodurie des femmes enceintes a baissé d’environ 30 % depuis 2015 (140 µg/L). La thyroglobuline médiane a augmenté sur la même période. Pourtant, toutes les femmes étaient euthyroïdiennes sauf une, soit 0,2 % d’HIC, et aucune corrélation n’apparaît entre iodurie et <button class="w" data-k="e02-tsh">TSH</button> ou <button class="w" data-k="e02-t4">T4</button>.</p>
<p>Ce dernier résultat tempère le tableau : un statut iodé collectif insuffisant ne se traduit pas encore, dans cette étude, par une thyroïde en échec. Les femmes en âge de procréer, les mères allaitantes, les végétariens et végétaliens, les faibles consommateurs de lait et les forts consommateurs de produits végétaux ultra-transformés sont les groupes que l’<button class="w" data-k="e02-s-osav">OSAV</button> désigne comme à risque. Chez le nourrisson, l’iodurie médiane de 70 à 100 µg/L correspond à un apport estimé de 40 à 50 µg/j, jugé insuffisant.</p>
<button class="pareto-btn ui" data-k="pareto-e02-epidemio">▲ Loi de Pareto — Fréquence et situation suisse</button>
</section>

<section class="ilot" id="e02-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 L’iode, substrat des hormones thyroïdiennes</h3>
<p>L’iode est indispensable à la synthèse de la <button class="w" data-k="e02-t4">T4</button> et de la T3. Environ 90 % de l’iode alimentaire est éliminé dans l’urine en 24 heures : l’iodurie reflète donc l’apport <b>récent</b>. La glande stocke de l’iode et s’en sert pendant les périodes de faible apport. La thyroglobuline est la protéine folliculaire sur laquelle les hormones sont synthétisées ; son taux sanguin est bas quand l’apport est suffisant.</p>
<h3>3.2 L’adaptation à la carence</h3>
<p>Quand l’iode disponible diminue, la <button class="w" data-k="e02-t4">T4</button> circulante tend à baisser et l’hypophyse augmente sa sécrétion de <button class="w" data-k="e02-tsh">TSH</button>. Cette stimulation déclenche une <button class="w" data-k="e02-adaptation">série d’ajustements (captation, rapport T3/T4, conversion périphérique)</button> : la thyroïde capte davantage d’iode, sécrète proportionnellement plus de T3 et la conversion de T4 en T3 augmente dans les tissus. La glande développe une hyperplasie et la <button class="w" data-k="e02-tg">thyroglobuline (marqueur sensible)</button> sérique s’élève ; le <button class="w" data-k="e02-goitre">goitre</button> est l’adaptation classique à la carence chronique.</p>
<figure><svg viewBox="0 0 380 330" role="img" aria-label="Figure 1 — Adaptation thyroïdienne à la carence en iode" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="10" width="356" height="40" rx="5"/><path d="M190 50v14m-4-5l4 5 4-5"/><rect x="12" y="64" width="356" height="40" rx="5"/><path d="M190 104v14m-4-5l4 5 4-5"/><rect x="12" y="118" width="356" height="40" rx="5"/><path d="M190 158v14m-4-5l4 5 4-5"/><rect x="12" y="172" width="356" height="54" rx="5"/><path d="M100 226v22m-4-5l4 5 4-5M280 226v22m-4-5l4 5 4-5"/><rect x="12" y="248" width="170" height="70" rx="5"/><rect x="198" y="248" width="170" height="70" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="35">Apport d’iode insuffisant</text><text x="190" y="89">Iode disponible ↓ · T4 tend à baisser</text><text x="190" y="143">TSH ↑ (stimulation de la glande)</text><text x="190" y="194">Captation ↑ · T3/T4 sécrétées ↑</text><text x="190" y="214">Conversion T4 → T3 ↑ · Tg ↑ · goitre</text><text x="97" y="272">Compensation efficace</text><text x="97" y="290">T4 libre normale, TSH ↑</text><text x="97" y="308">= E02</text><text x="283" y="272">Compensation dépassée</text><text x="283" y="290">T4 libre basse</text><text x="283" y="308">= E01.8</text></g></svg><figcaption>Figure 1 — La TSH élevée avec T4 libre normale est le prix hormonal d’une adaptation qui réussit encore. Schéma pédagogique tiré des données de l’OMS et de Paediatrica 2020.</figcaption></figure>
<p>Cette chaîne éclaire le profil biologique de E02. Dans la carence <b>légère</b>, la thyroglobuline s’élève, mais la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> restent en général normales. Dans la carence <b>modérée</b>, la <button class="w" data-k="e02-tsh">TSH</button> peut s’élever légèrement : elle maintient la <button class="w" data-k="e02-t4">T4</button> normale ou un peu basse, ce qui est la situation de E02. Dans la carence <b>sévère</b>, la thyroglobuline et la <button class="w" data-k="e02-tsh">TSH</button> sont élevées, la <button class="w" data-k="e02-t4">T4</button> est basse, la T3 souvent normale, et le goitre ainsi que l’hypothyroïdie clinique deviennent fréquents.</p>
<h3>3.3 Grossesse et nouveau-né</h3>
<p>En <button class="w" data-k="e02-grossesse">grossesse</button>, les besoins augmentent : production accrue d’hormones maternelles, captation d’iode par le fœtus, le placenta et le liquide amniotique. La période la plus critique pour le cerveau va du deuxième trimestre de grossesse à la troisième année de vie, d’où le poids de l’apport maternel. Le <button class="w" data-k="e02-nouveau-ne">nouveau-né</button> possède peu d’iode thyroïdien et un renouvellement élevé ; la carence demande une stimulation accrue par la <button class="w" data-k="e02-tsh">TSH</button>, ce qui explique l’élévation transitoire de la TSH néonatale.</p>
<div class="key"><b>Science → clinique.</b> La TSH élevée de E02 mesure l’effort de la glande, non son échec. Si l’iode revient, l’effort cesse ; si la glande est détruite par auto-immunité, la TSH reste élevée malgré l’iode. Voilà pourquoi la cause se cherche avant toute décision.</div>

<section class="ilot" id="e02-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Deux mécanismes rendent un apport insuffisant : une offre trop faible et des besoins qui augmentent. Le tableau les rassemble avec leur justification.</p>
<table class="t"><thead><tr><th>Facteur</th><th>Pourquoi il compte</th></tr></thead><tbody><tr><td>Cuisine et table sans sel iodé</td><td>Le sel iodé du ménage et des produits transformés fournit 51 % de l’iode alimentaire suisse selon l’OSAV</td></tr><tr><td>Régime végétalien sans aliments enrichis</td><td>Les boissons végétales d’avoine, de riz et d’amande ne contiennent pas d’iode ; les produits laitiers fournissent 26 % de l’apport</td></tr><tr><td>Faible consommation de lait</td><td>Le lait biologique contient moins d’iode que le lait conventionnel</td></tr><tr><td>Produits transformés salés sans iode</td><td>Seuls 47 % des produits suisses et 9 % des produits importés sont salés avec du sel iodé</td></tr><tr><td>Grossesse et allaitement</td><td>La demande augmente (fœtus, placenta, lait) ; le nourrisson allaité dépend entièrement de l’iode maternel</td></tr><tr><td>Supplément prénatal sans iode</td><td>Le produit le plus prescrit dans l’étude suisse n’en contenait pas</td></tr></tbody></table>
<p>La composition d’un supplément prénatal doit donc être lue. Le <button class="w" data-k="e02-supplement">supplément Elevit Pronatal (composition sans iode)</button> en offre un exemple vérifié dans l’information professionnelle suisse. À l’inverse, les comprimés d’iodure de potassium à 65 mg distribués par la Confédération ne servent <b>qu’</b>à protéger la thyroïde contre l’iode radioactif sur ordre des autorités ; ils ne constituent pas une supplémentation nutritionnelle.</p>
<div class="trap"><span class="k">Piège</span> Croire qu’un « complément prénatal » apporte de l’iode. Dans l’étude suisse, 61 % seulement des produits prénatals du marché contenaient au moins 150 µg d’iode. Lire l’étiquette ou l’information professionnelle évite l’omission.</div>
<button class="pareto-btn ui" data-k="pareto-e02-causes">▲ Loi de Pareto — Causes et risque</button>
</section>

<section class="ilot" id="e02-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’histoire clinique cherche à la fois la <b>carence</b> et les <b>causes concurrentes</b> d’une TSH élevée. Elle prépare la lecture des examens, car aucun test ne distingue seul l’origine nutritionnelle.</p>
<div class="two"><div class="card"><h4>Rechercher la carence</h4><p>Le médecin demande le sel iodé au ménage, la quantité de lait et de produits laitiers (trois portions par jour sont recommandées), le poisson de mer, le régime végétalien et les boissons végétales non enrichies. Il note aussi la grossesse, le projet de grossesse, l’allaitement, et la <b>composition</b> du supplément pris.</p></div><div class="card"><h4>Éliminer les causes concurrentes</h4><p>Il recherche une <button class="w" data-k="e02-causes-trans">cause transitoire</button> (thyroïdite subaiguë ou indolore, arrêt de lévothyroxine, convalescence d’une maladie non thyroïdienne), un <button class="w" data-k="e02-amiodarone">médicament (lithium, amiodarone)</button>, une exposition récente à l’iode (produit de contraste) et une <button class="w" data-k="e02-surrenale">insuffisance surrénalienne</button>.</p></div></div>
<p>Les symptômes sont rares dans l’HIC. Une fatigue a pu s’améliorer sous lévothyroxine dans une étude, mais les résultats restent inconstants ; l’absence de plainte n’exclut donc rien. Les facteurs qui élèvent ou déplacent la <button class="w" data-k="e02-tsh">TSH</button> sont le travail de nuit, le sommeil irrégulier, l’exercice intense, la dépression et l’obésité. La <button class="w" data-k="e02-biotine">biotine</button> fausse les dosages thyroïdiens par immunoanalyse.</p>
<div class="key"><b>À retenir.</b> Trois questions de départ : y a-t-il un projet de grossesse ou une grossesse ? Que mange la patiente comme source d’iode ? Quel est le contenu exact de son supplément ? Elles orientent le bilan et la prévention.</div>
<button class="pareto-btn ui" data-k="pareto-e02-anamnese">▲ Loi de Pareto — Anamnèse</button>
</section>

<section class="ilot" id="e02-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen est pauvre dans E02, et c’est un enseignement en soi : la découverte est biologique. Il cherche un <button class="w" data-k="e02-goitre">goitre (adaptation à la carence chronique)</button>. Un goitre diffus ou nodulaire associé à une HIC persistante est, selon l’<button class="w" data-k="e02-s-eta">ETA</button>, un argument pour discuter un traitement.</p>
<table class="t"><thead><tr><th>Élément</th><th>Ce qu’il apporte</th><th>Limite</th></tr></thead><tbody><tr><td>Goitre diffus</td><td>Cohérent avec une stimulation chronique par la TSH ou avec une auto-immunité</td><td>Ne tranche pas entre carence et thyroïdite</td></tr><tr><td>Goitre nodulaire</td><td>Argument pour discuter un traitement si l’HIC persiste</td><td>Définition clinique OMS du goitre non relue : renvoi au cours E01</td></tr><tr><td>Signes d’hypothyroïdie</td><td>Leur présence ferait chercher une T4 libre basse</td><td>Rares dans l’HIC</td></tr></tbody></table>
<p>Ce tableau rappelle que l’examen oriente sans conclure. Un examen normal n’écarte pas E02, et une anomalie palpable ne désigne pas la cause.</p>

</section>
