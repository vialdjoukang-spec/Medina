<template data-pop="e02-tsh" data-title="TSH : thyréostimuline">
<div class="lab">Rôle</div><p>La <button class="w" data-k="e02-tsh">TSH</button> est l’hormone hypophysaire qui stimule la thyroïde. Quand la <button class="w" data-k="e02-t4">T4</button> circulante tend à baisser, l’hypophyse sécrète davantage de <button class="w" data-k="e02-tsh">TSH</button> : c’est le mécanisme d’adaptation à la carence en iode.</p>
<div class="lab">Valeurs</div><p>L’<button class="w" data-k="e02-s-eta">ETA</button> retient 0,4 à 4,0 mU/L comme intervalle de référence de l’adulte. Une <button class="w" data-k="e02-tsh">TSH</button> au-dessus de 4,0 mU/L avec <button class="w" data-k="e02-t4">T4</button> libre normale définit l’hypothyroïdie infraclinique ; au-dessus de 10 mU/L, la forme est dite sévère.</p>
<div class="lab">Pièges</div><p>La <button class="w" data-k="e02-tsh">TSH</button> est environ 30 % plus haute le soir et la nuit ; sa variabilité augmente aux valeurs élevées. Elle se comporte comme un mauvais marqueur du statut iodé chez l’adulte et l’écolier, car les différences entre populations sont faibles et le chevauchement important.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-t4" data-title="T4 libre : thyroxine libre">
<div class="lab">Rôle</div><p>La <button class="w" data-k="e02-t4">T4</button> est l’hormone principale sécrétée par la thyroïde ; l’iode est indispensable à sa synthèse. La fraction libre est celle que l’on dose pour juger la fonction.</p>
<div class="lab">Lecture dans E02</div><p>Normale avec <button class="w" data-k="e02-tsh">TSH</button> élevée persistante, elle définit le profil infraclinique. Basse, elle change le diagnostic biologique ; le code dépend encore de la cause. En carence, la <button class="w" data-k="e02-t4">T4</button> sérique est typiquement plus basse et la T3 plus haute que dans une population iodée.</p>
<div class="lab">Limite</div><p>La <button class="w" data-k="e02-t4">T4</button> et la T3 ne sont pas recommandées pour suivre le statut iodé d’une population : elles sont moins sensibles que la thyroglobuline et se chevauchent.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-hic" data-title="Hypothyroïdie infraclinique : définition et seuils">
<div class="lab">Définition</div><p><button class="w" data-k="e02-tsh">TSH</button> sérique élevée avec <button class="w" data-k="e02-t4">T4</button> libre dans l’intervalle de référence adapté ; le dosage de T3 libre ne fait pas partie du bilan usuel. L’intervalle retenu par l’<button class="w" data-k="e02-s-eta">ETA</button> pour la <button class="w" data-k="e02-tsh">TSH</button> est de 0,4 à 4,0 mU/L.</p>
<div class="lab">Catégories</div><p>Légère : <button class="w" data-k="e02-tsh">TSH</button> de 4,0 à 10,0 mU/L, environ 90 % des cas. Sévère : plus de 10 mU/L (recommandation 1, grade 2S). En grossesse, la <button class="w" data-k="e02-tsh">TSH</button> se compare à l’intervalle propre à la grossesse ; chez l’enfant, l’<button class="w" data-k="e02-hic">HIC</button> correspond à une <button class="w" data-k="e02-tsh">TSH</button> supérieure à la limite propre à l’âge et à la méthode, avec <button class="w" data-k="e02-t4">T4</button> libre normale.</p>
<div class="lab">Pourquoi ce seuil de 10</div><p>Le risque coronarien et d’insuffisance cardiaque apparaît surtout au-dessus de 10 mU/L, et la recommandation de traiter sans symptôme avant 65–70 ans s’y rattache.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <a href="https://doi.org/10.1159/000362597" target="_blank" rel="noopener">ETA 2014, section pédiatrique consultée ; grossesse actualisée par HAS/RCOG</a>.</p></template>
<template data-pop="e02-nomenclature" data-title="CIM : E01, E01.8, E02 et E03">
<div class="lab">Libellés</div><p>Selon l’Office fédéral de la statistique (CIM-10-GM 2024), E02 se nomme « Hypothyroïdie par carence inapparente en iode » et n’a aucun sous-code. L’OMS (CIM-10, 2019) la désigne par « Subclinical iodine-deficiency hypothyroidism », sans note d’inclusion ni d’exclusion propre.</p>
<div class="lab">Exclusions</div><p>E01 exclut E02 ; l’hypothyroïdie acquise par carence iodée non précisée se classe en E01.8. E03 exclut l’hypothyroïdie liée à la carence iodée (E00 à E02) et l’hypothyroïdie post-procédurale (E89.0).</p>
<div class="lab">Conséquence</div><p>La <button class="w" data-k="e02-t4">T4</button> libre départage les profils biologiques ; E02 exige en plus une attribution iodée, et une <button class="w" data-k="e02-t4">T4</button> basse ne détermine pas seule le code. La CIM-10-GM peut différer de la version OMS ; le cours n’a lu que les libellés de la première et les notes de la seconde.</p>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024, catégories E01 à E03</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E02" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E02, E01.8 et E03</a>.</p></template>
<template data-pop="e02-apports" data-title="Apports recommandés en iode : OMS et EFSA">
<div class="lab">OMS, UNICEF, ICCIDD</div><p>90 µg/j de 0 à 59 mois, 120 µg/j de 6 à 12 ans, 150 µg/j pour les adolescents et adultes, 250 µg/j pendant la grossesse et l’allaitement.</p>
<div class="lab"><button class="w" data-k="e02-s-efsa">EFSA</button></div><p>Apport adéquat de 150 µg/j chez l’adulte, 200 µg/j pendant la grossesse et l’allaitement, 70 à 130 µg/j chez l’enfant de 7 mois et plus. La limite supérieure de 600 µg/j chez la femme enceinte est citée par l’étude suisse.</p>
<div class="lab">Arbitrage</div><p>Les deux référentiels diffèrent de 50 µg/j en grossesse. Le cours distingue les besoins totaux de l’OMS et les programmes contextuels de supplémentation et l’<button class="w" data-k="e02-s-efsa">EFSA</button> comme repère européen ; les valeurs D-A-CH suisses n’ont pas été lues dans un document officiel et ne sont pas utilisées.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://doi.org/10.2903/j.efsa.2014.3660" target="_blank" rel="noopener">EFSA 2014, valeurs de référence alimentaires pour l’iode (résumé seul lu)</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-paradoxe" data-title="Paradoxe iodé : étude danoise">
<div class="lab">Résultat</div><p>Au Danemark, avant l’iodation, deux régions ont été comparées. En carence modérée (iodurie 45 µg/L) : hypothyroïdie manifeste 26,5 pour 100 000 par an et hyperthyroïdie 92,9. En carence légère (61 µg/L) : 40,1 et 65,4.</p>
<div class="lab">Interprétation</div><p>La carence modérée comptait moins d’hypothyroïdies mais plus d’hyperthyroïdies. Les auteurs placent l’apport optimal dans une plage étroite autour de 150 µg/j. La relation est en U : des troubles surviennent en cas d’apport insuffisant comme excessif.</p>
<div class="lab">Limite</div><p>L’étude porte sur l’hypothyroïdie <b>manifeste</b>, non infraclinique, et sur des populations danoises. Le résumé seul a été lu ; aucun mécanisme n’en est tiré.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/jc.2002-020750" target="_blank" rel="noopener">Bülow Pedersen et al., J Clin Endocrinol Metab 2002 (résumé seul lu)</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-sel" data-title="Sel iodé en Suisse : histoire et règles">
<div class="lab">Histoire</div><p>Introduit en 1922, disponible dans tout le pays depuis 1952. Teneur en iode : 3,75 mg/kg à l’origine, 7,5 en 1962, 15 en 1980, 20 en 1998, 25 depuis janvier 2014 ; plage de 20 à 40 mg/kg citée par les publications suisses de 2020–2024, sans revalidation réglementaire ici.</p>
<div class="lab">Règles</div><p>L’iodation est volontaire. Plus de 80 % des ménages utilisent du sel iodé, mais un tiers seulement des aliments transformés salés en contient (47 % des produits suisses, 9 % des produits importés). Le sel des aliments transformés représente 70 à 80 % du sel consommé.</p>
<div class="lab">Conseil</div><p>L’<button class="w" data-k="e02-s-osav">OSAV</button> recommande le sel iodé en cuisine et à table, et de choisir des produits dont la liste des ingrédients mentionne « sel iodé ». 86 % des boulangeries en utilisent.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV, page sur le sel iodé</a>.</p></template>
<template data-pop="e02-suisse" data-title="Monitorage suisse 2020–2022">
<div class="lab">Méthode</div><p>Étude nationale chez des écoliers de 6 à 12 ans et des femmes enceintes. L’iodurie a été corrigée par la créatininurie et par un second échantillon ; les personnes récemment exposées à l’iode étaient exclues.</p>
<div class="lab">Résultats</div><p>Écoliers : iodurie médiane 127 µg/L, apport habituel estimé 114 µg/j, apport habituel estimé inadéquat chez 5,4 % (méthode et incertitude à préciser). Femmes enceintes : médiane 97 µg/L (123 µg/L après correction de la variabilité intra-individuelle), 30 % de moins qu’en 2015 (140 µg/L). Apport inadéquat (moins de 160 µg/j) : 31 % des non-utilisatrices de supplément iodé, 0,2 % des utilisatrices. 47 % prenaient un supplément contenant 150 à 220 µg d’iode.</p>
<div class="lab">Thyroïde</div><p>Toutes euthyroïdiennes sauf une (<button class="w" data-k="e02-hic">HIC</button>, 0,2 %). Aucune corrélation entre iodurie et <button class="w" data-k="e02-tsh">TSH</button> ou <button class="w" data-k="e02-t4">T4</button>. Thyroglobuline médiane de 26,0 µg/L, plus haute qu’en 2015, plus basse sous supplément.</p>
<div class="lab">Limites</div><p>Faible taux de réponse. Les seuils de <button class="w" data-k="e02-tsh">TSH</button> gravidiques de l’étude viennent d’une société américaine : ils ne servent pas de fondement de conduite ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-adaptation" data-title="Ajustements de la glande à la carence">
<div class="lab">Constat</div><p>La carence prolongée augmente la captation thyroïdienne d’iode, le rapport T3/<button class="w" data-k="e02-t4">T4</button> sécrété et la conversion périphérique de <button class="w" data-k="e02-t4">T4</button> en T3.</p>
<div class="lab">Conséquence biologique</div><p>La <button class="w" data-k="e02-t4">T4</button> sérique est plus basse et la T3 plus haute que dans une population iodée. L’hyperplasie stimulée élève la thyroglobuline sérique, qui reflète l’apport des mois ou années précédents.</p>
<div class="lab">Limite</div><p>Les sources lues décrivent ces ajustements sans en donner la raison moléculaire ; le cours ne la reconstruit pas de mémoire.</p>
<p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-tg" data-title="Thyroglobuline : marqueur de population">
<div class="lab">Définition</div><p>Protéine folliculaire sur laquelle les hormones thyroïdiennes sont synthétisées. Son taux sanguin est bas quand l’apport en iode est suffisant.</p>
<div class="lab">Usage</div><p>Marqueur sensible de carence à l’échelle d’une population, qui réagit rapidement. Intervalle de référence chez l’écolier iodé, en sang séché : 4 à 40 µg/L. Elle s’élève aussi en cas d’excès d’iode. Dans la carence légère, c’est elle qui s’élève d’abord.</p>
<div class="lab">Limite</div><p>Elle n’est pas validée comme test diagnostique individuel pour E02 dans les sources lues.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-goitre" data-title="Goitre : adaptation à la carence chronique">
<div class="lab">Rôle</div><p>Le goitre est l’adaptation physiologique classique à une carence chronique : la stimulation répétée par la <button class="w" data-k="e02-tsh">TSH</button> augmente le volume de la glande.</p>
<div class="lab">Valeur clinique</div><p>Un goitre diffus ou nodulaire associé à une <button class="w" data-k="e02-hic">HIC</button> persistante est, selon l’<button class="w" data-k="e02-s-eta">ETA</button>, un argument pour discuter un traitement (recommandation 7, grade 2W).</p>
<div class="lab">Limite</div><p>La technique OMS et les grades 0–2 sont détaillés dans l’examen clinique et la sémiologie : un goitre est une observation morphologique, pas une preuve de carence.</p>
<p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-grossesse" data-title="Grossesse : référence, définition et calendrier"><div class="lab">Diagnostic</div><p>Comparer <button class="w" data-k="e02-tsh">TSH</button> et hormones à la méthode et au trimestre ; en l’absence de norme appropriée, <button class="w" data-k="e02-s-has">HAS</button> 2022 et <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 proposent 4,0 mU/L comme limite supérieure de <button class="w" data-k="e02-tsh">TSH</button>. La cible de traitement proche de 2,5 n’est pas la définition d’une maladie. Le <button class="w" data-k="e02-s-rcog">RCOG</button> distingue <button class="w" data-k="e02-hic">HIC</button>, <button class="w" data-k="e02-t4">T4</button> libre normale, et forme manifeste, <button class="w" data-k="e02-t4">T4</button> libre basse ; une <button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 avec <button class="w" data-k="e02-t4">T4</button> libre normale est une <button class="w" data-k="e02-hic">HIC</button> sévère dans ce référentiel.</p><div class="lab">Préconception et traitement</div><p>Le <button class="w" data-k="e02-s-rcog">RCOG</button> recommande de considérer lévothyroxine avant la conception pour <button class="w" data-k="e02-hic">HIC</button>, surtout avec <button class="w" data-k="e02-antitpo">anti-TPO</button> déjà positifs. Pendant la grossesse, une <button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 ou une hypothyroïdie manifeste se traite rapidement. Pour une élévation moins forte, il propose de considérer lévothyroxine, particulièrement au premier trimestre. La <button class="w" data-k="e02-s-has">HAS</button> recommande le traitement si <button class="w" data-k="e02-tsh">TSH</button> supérieure à 4 confirmée ; entre 2,5 et 4 avec <button class="w" data-k="e02-antitpo">anti-TPO</button> positifs, elle le discute. Les divergences ne sont pas effacées.</p><div class="lab">Suivi</div><p><button class="w" data-k="e02-s-rcog">RCOG</button> : <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre toutes les 4–6 semaines jusqu’à 20 semaines d’aménorrhée puis vers 28 semaines d’aménorrhée ; <button class="w" data-k="e02-s-has">HAS</button> : <button class="w" data-k="e02-tsh">TSH</button> jusqu’à 22 semaines d’aménorrhée puis 30–34 semaines d’aménorrhée. La FI suisse demande un suivi spécialisé. La dépendance fœtale aux hormones maternelles commence dès le début de grossesse, avant le fonctionnement complet de sa propre thyroïde.</p><p class="src">Sources : <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025, §§4–7</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, grossesse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox</a>.</p></template>
<template data-pop="e02-grossesse-risque" data-title="Grossesse : risques, bénéfices et incertitudes"><div class="lab">Association</div><p>Les études associent certaines <button class="w" data-k="e02-hic">HIC</button> gravidiques à des issues obstétricales défavorables ; la définition, le trimestre, le statut auto-immun et l’intensité de <button class="w" data-k="e02-tsh">TSH</button> modifient les résultats. Une association ne démontre pas une causalité individuelle. L’hypothyroïdie manifeste possède une autre gravité et ne doit pas être confondue avec une élévation légère de <button class="w" data-k="e02-tsh">TSH</button>.</p><div class="lab">Essais et décision</div><p>Le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 ne retient pas de bénéfice neurodéveloppemental démontré de lévothyroxine dans les essais disponibles, mais plusieurs commencent tard et renseignent peu le traitement très précoce. Ce manque de preuve n’autorise pas à différer le traitement des formes sévères. L’hypothyroxinémie isolée n’est pas traitée systématiquement ; le <button class="w" data-k="e02-s-rcog">RCOG</button> propose un contrôle à 4–6 semaines.</p><div class="lab">Nutrition</div><p>Un apport total adéquat se prépare avant la conception. Dans l’essai Inde–Thaïlande de supplémentation à 200 µg/j, aucune différence significative de cognition à 5–6 ans n’a été retrouvée ; le contexte léger et les pertes de suivi limitent la portée. Ce résultat n’annule pas la prévention des carences sévères.</p><p class="src">Sources : <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025, §§7–8</a> ; <a href="https://doi.org/10.1016/S2213-8587(17)30332-7" target="_blank" rel="noopener">Gowachirapant 2017, résumé</a>.</p></template>
<template data-pop="e02-nouveau-ne" data-title="Nouveau-né : réserves et hyperthyrotropinémie transitoire">
<div class="lab">Mécanisme</div><p>Le nouveau-né a peu d’iode thyroïdien et un renouvellement élevé. La carence exige une stimulation accrue par la <button class="w" data-k="e02-tsh">TSH</button> : c’est l’hyperthyrotropinémie transitoire des premières semaines.</p>
<div class="lab">Réserves</div><p>Elles sont minimales, suffisantes pour quelques jours ; le nourrisson dépend du lait maternel ou des préparations pour nourrissons, enrichies en Suisse ; Paediatrica 2020 rapporte 15 à 29 µg pour 100 kcal, valeur historique et non vérification réglementaire actuelle.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-enfant" data-title="Enfant : références liées à l’âge et histoire naturelle"><div class="lab">Définition</div><p><button class="w" data-k="e02-tsh">TSH</button> au-dessus de la limite adaptée à l’âge et à la méthode, avec <button class="w" data-k="e02-t4">T4</button> libre normale. La notation 5,5–10 mU/L est une plage étudiée, pas un seuil unique pour tous les enfants. L’<button class="w" data-k="e02-s-eta">ETA</button> 2014 rappelle les modifications néonatales et la nécessité des normes pédiatriques.</p><div class="lab">Évolution</div><p>Dans une grande série de dosages, 73,6 % des élévations initiales 5,5–10 se normalisaient au contrôle ; les anticorps et le contexte clinique étaient incomplets. Une cohorte idiopathique sélectionnée de 92 enfants retrouvait à deux ans 41 % de normalisation, 47 % de stabilité et 12 % de <button class="w" data-k="e02-tsh">TSH</button> dépassant 10. L’auto-immunité, la trisomie 21 et les anomalies congénitales ont d’autres trajectoires.</p><div class="lab">Conduite</div><p>Au-delà de 3 ans sans anticorps, surveillance souvent annuelle ; contexte auto-immun : 6–12 mois, plus tôt si aggravation. La preuve manque pour traiter systématiquement la majorité des <button class="w" data-k="e02-hic">HIC</button> avec <button class="w" data-k="e02-tsh">TSH</button> inférieure à 10 et <button class="w" data-k="e02-t4">T4</button> normale. Chez le nourrisson avec élévation persistante après le premier mois, l’évaluation spécialisée et la protection du développement priment. Aucun dosage adulte n’est transposé.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4109520/" target="_blank" rel="noopener">ETA 2014, section enfance et recommandations 24–30</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Paediatrica 2020</a>.</p></template>
<template data-pop="e02-nis" data-title="Symporteur sodium/iodure (NIS)">
<div class="lab">Rôle cité</div><p>La glande mammaire concentre l’iode grâce au symporteur sodium/iodure (<button class="w" data-k="e02-nis">NIS</button>). Le lait maternel apporte ainsi l’iode au nourrisson, d’où sa dépendance à l’apport maternel pendant l’allaitement.</p>
<div class="lab">Valeur suisse</div><p>L’iodure du lait maternel suisse est de 50 µg/L en médiane ; l’iodurie médiane des nourrissons de 70 à 100 µg/L correspond à un apport estimé de 40 à 50 µg/j, jugé insuffisant.</p>
<div class="lab">Limite</div><p>Le dossier décrit ce transport mammaire dans Paediatrica ; la captation thyroïdienne et la synthèse sont développées dans Sciences avec leur source normale.</p>
<p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-antitpo" data-title="Anticorps anti-TPO">
<div class="lab">Usage</div><p>Les anticorps anti-peroxydase thyroïdienne (<button class="w" data-k="e02-antitpo">anti-TPO</button>) cherchent l’auto-immunité. L’<button class="w" data-k="e02-s-eta">ETA</button> recommande de les doser avec la <button class="w" data-k="e02-tsh">TSH</button> et la <button class="w" data-k="e02-t4">T4</button> libre lors du contrôle à deux ou trois mois.</p>
<div class="lab">Valeur pour E02</div><p>Négatifs, ils plaident contre la thyroïdite auto-immune, mais environ 20 % des <button class="w" data-k="e02-hic">HIC</button> n’ont aucun anticorps détectable (ni <button class="w" data-k="e02-antitpo">anti-TPO</button> ni anti-thyroglobuline). Positifs, ils soutiennent une cause auto-immune, qui peut coexister avec un apport insuffisant ; les cohortes rapportent une progression plus rapide (4,3 % par an contre 2,6 %).</p>
<div class="lab">Limite</div><p>Un résultat négatif ne prouve pas la carence : c’est un argument, jamais un test de la cause nutritionnelle.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-causes-trans" data-title="Causes transitoires d’une TSH élevée">
<div class="lab">Liste</div><p>Thyroïdite subaiguë ou indolore, arrêt de lévothyroxine, convalescence d’une maladie non thyroïdienne, médicaments (lithium, amiodarone).</p>
<div class="lab">Conduite</div><p>Chez l’adulte stable hors grossesse, la répétition à deux ou trois mois aide à reconnaître une normalisation. Ce n’est pas une garantie de résolution ni un délai applicable à une forme sévère gravidique. Lithium et amiodarone ne sont pas arrêtés automatiquement.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-amiodarone" data-title="Lithium et amiodarone">
<div class="lab">Constat</div><p>L’<button class="w" data-k="e02-s-eta">ETA</button> les cite parmi les causes d’une <button class="w" data-k="e02-tsh">TSH</button> élevée. L’information professionnelle suisse d’Euthyrox signale que l’amiodarone peut provoquer une hypo- ou une hyperthyroïdie.</p>
<div class="lab">Conduite</div><p>Dater la prise, revoir l’indication du médicament avec le prescripteur, contrôler la <button class="w" data-k="e02-tsh">TSH</button>.</p>
<div class="lab">Limite</div><p>Le dossier n’expose ni la dose seuil ni le mécanisme détaillé de ces médicaments sur la thyroïde.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, autorisation 54949 ; GTIN 7680549490017)</span>.</p></template>
<template data-pop="e02-surrenale" data-title="Insuffisance surrénalienne et TSH">
<div class="lab">Constat</div><p>Une insuffisance surrénalienne non traitée peut élever la <button class="w" data-k="e02-tsh">TSH</button>. L’<button class="w" data-k="e02-s-eta">ETA</button> conseille de juger l’<button class="w" data-k="e02-hic">HIC</button> au moins quatre semaines après une substitution glucocorticoïde adéquate.</p>
<div class="lab">Sécurité du traitement</div><p>L’information professionnelle d’Euthyrox range l’insuffisance surrénalienne non traitée parmi les contre-indications, et demande de substituer d’abord les glucocorticoïdes en cas d’insuffisance compensée.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, autorisation 54949 ; GTIN 7680549490017)</span>.</p></template>
<template data-pop="e02-biotine" data-title="Biotine et immunodosages thyroïdiens">
<div class="lab">Constat</div><p>La biotine interfère avec les immunodosages thyroïdiens et peut donner des résultats faussement bas ou élevés.</p>
<div class="lab">Conduite</div><p>Interroger sur la prise de biotine devant un résultat discordant, et informer le laboratoire et contrôler par une méthode adaptée ; un éventuel arrêt se décide selon le produit et le laboratoire.</p>
<div class="lab">Limite</div><p>Le dossier n’indique ni la dose en cause ni le délai d’arrêt nécessaire : le laboratoire donne ces repères.</p>
<p class="src">Références : <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, autorisation 54949 ; GTIN 7680549490017)</span>.</p></template>
<template data-pop="e02-confirmation" data-title="Pourquoi répéter la TSH à 2–3 mois">
<div class="lab">Trois raisons</div><p>La <button class="w" data-k="e02-tsh">TSH</button> est environ 30 % plus haute le soir et la nuit. Sa variabilité augmente aux valeurs élevées. Le « point de consigne » individuel n’occupe qu’un tiers de l’intervalle de référence.</p>
<div class="lab">Conséquence</div><p>La fonction se normalise spontanément chez 6 à 35 % des patients ; un dosage isolé mène à un surdiagnostic. La recommandation 2 de l’<button class="w" data-k="e02-s-eta">ETA</button> (grade 2S) fixe le contrôle à deux ou trois mois, idéalement à la même heure.</p>
<div class="lab">Sujet âgé</div><p>Les intervalles par âge réduisent les diagnostics d’<button class="w" data-k="e02-hic">HIC</button> d’environ 2 % après 75 ans et de 5 % après 90 ans.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-iodurie" data-title="Iodurie : ce qu’elle mesure et ne mesure pas">
<div class="lab">Ce qu’elle mesure</div><p>Environ 90 % de l’iode alimentaire part dans l’urine en 24 heures : l’iodurie reflète l’apport récent. Elle dépend de la dilution urinaire, d’où la correction par la créatininurie dans l’étude suisse.</p>
<div class="lab">Ce qu’elle ne fait pas</div><p>Les seuils de l’OMS classent des populations. Une valeur ponctuelle ne classe pas un individu ; la répétition sur de nombreux jours est une méthode de recherche, pas une prescription de routine ; le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 déconseille les urines ponctuelles ou de 24 heures pour classer une femme enceinte individuellement.</p>
<div class="lab">Exclusion</div><p>Une exposition récente à l’iode (produit de contraste, médicament iodé) fausse la mesure.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-seuils-iodurie" data-title="Seuils d’iodurie médiane de l’OMS">
<div class="lab">Écoliers et adultes non enceintes</div><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Médiane</th><th style="min-width:10em">Statut</th></tr></thead><tbody><tr><td style="min-width:10em">Moins de 20 µg/L</td><td style="min-width:10em">Carence sévère</td></tr><tr><td style="min-width:10em">20 à 49 µg/L</td><td style="min-width:10em">Carence modérée</td></tr><tr><td style="min-width:10em">50 à 99 µg/L</td><td style="min-width:10em">Carence légère</td></tr><tr><td style="min-width:10em">100 à 199 µg/L</td><td style="min-width:10em">Apport adéquat</td></tr><tr><td style="min-width:10em">200 à 299 µg/L</td><td style="min-width:10em">Au-dessus des besoins</td></tr><tr><td style="min-width:10em">300 µg/L ou plus</td><td style="min-width:10em">Excessif</td></tr></tbody></table>
<div class="lab">Femmes enceintes</div><table class="t" style="display:block;max-width:100%;overflow-x:auto"><thead><tr><th style="min-width:10em">Médiane</th><th style="min-width:10em">Statut</th></tr></thead><tbody><tr><td style="min-width:10em">Moins de 150 µg/L</td><td style="min-width:10em">Insuffisant</td></tr><tr><td style="min-width:10em">150 à 249 µg/L</td><td style="min-width:10em">Adéquat</td></tr><tr><td style="min-width:10em">250 à 499 µg/L</td><td style="min-width:10em">Au-dessus des besoins</td></tr><tr><td style="min-width:10em">500 µg/L ou plus</td><td style="min-width:10em">Excessif</td></tr></tbody></table>
<div class="lab">Allaitement et enfants de moins de 2 ans</div><p>Le seuil d’adéquation est de 100 µg/L.</p>
<div class="lab">Limite</div><p>Ces seuils concernent la médiane d’un groupe. Un excès (300 µg/L ou plus) s’associe à l’hyperthyroïdie induite par l’iode et à l’auto-immunité.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-tsh-neo" data-title="TSH néonatale : indicateur de population">
<div class="lab">Règle</div><p>Une fréquence inférieure à 3 % de <button class="w" data-k="e02-tsh">TSH</button> supérieure à 5 mU/L (sang total, troisième ou quatrième jour, dosage sensible) signe la suffisance iodée d’une population.</p>
<div class="lab">Piège</div><p>La povidone iodée appliquée à la mère ou au nouveau-né fausse ce marqueur.</p>
<div class="lab">Pourquoi un bon indicateur</div><p>Le nouveau-né a peu de réserves et un renouvellement élevé : sa <button class="w" data-k="e02-tsh">TSH</button> réagit vite à la carence.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-calc-baisse" data-title="Calcul de la baisse de l’iodurie 2015–2022">
<div class="lab">Formule</div><p>Variation relative = (valeur ancienne − valeur récente) ÷ valeur ancienne.</p>
<div class="lab">Application</div><p>(140 − 97) ÷ 140 = 43 ÷ 140 ≈ 0,307, soit environ 31 %, que l’étude arrondit à 30 %. Les médianes sont exprimées en µg/L.</p>
<div class="lab">Lecture</div><p>La baisse concerne la médiane d’un groupe de femmes enceintes. Elle ne désigne aucune patiente et n’indique pas une hypothyroïdie : une seule <button class="w" data-k="e02-hic">HIC</button> a été retrouvée dans ce groupe.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-progression" data-title="Progression vers l’hypothyroïdie manifeste">
<div class="lab">Taux</div><p>Environ 5 à 8 % par an selon la <button class="w" data-k="e02-tsh">TSH</button> ; 4,3 % par an si les <button class="w" data-k="e02-antitpo">anti-TPO</button> sont positifs, 2,6 % par an s’ils sont négatifs.</p>
<div class="lab">Lecture pour E02</div><p>Les anticorps négatifs ne définissent pas E02. Ces cohortes ne donnent pas de taux propre à la carence iodée ; l’évolution reste à surveiller.</p>
<div class="lab">Limite</div><p>Ces chiffres viennent de l’<button class="w" data-k="e02-hic">HIC</button> générale ; aucun taux propre à l’<button class="w" data-k="e02-hic">HIC</button> iodoprive n’a été trouvé.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-age" data-title="Sujet âgé : intervalles adaptés à l’âge">
<div class="lab">Règle</div><p>L’<button class="w" data-k="e02-s-eta">ETA</button> recommande des intervalles de référence adaptés à l’âge (recommandation 14, grade 2S). Après 80 ans, une <button class="w" data-k="e02-tsh">TSH</button> de 4,0 à 7,0 mU/L peut être physiologique.</p>
<div class="lab">Effet</div><p>Les intervalles par âge réduisent les diagnostics d’<button class="w" data-k="e02-hic">HIC</button> d’environ 2 % après 75 ans et 5 % après 90 ans.</p>
<div class="lab">Conduite</div><p>Au-delà de 80 à 85 ans, attentisme si la <button class="w" data-k="e02-tsh">TSH</button> ne dépasse pas 10 mU/L (recommandation 15, grade 3S).</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, autorisation 54949 ; GTIN 7680549490017)</span>.</p></template>
<template data-pop="e02-diabete" data-title="Diabète de type 1 et thyroïde">
<div class="lab">Constat</div><p>Une dysfonction thyroïdienne touche environ 10 % des patients atteints de diabète de type 1. L’<button class="w" data-k="e02-s-eta">ETA</button> recommande un dosage annuel de la <button class="w" data-k="e02-tsh">TSH</button> (recommandation 9).</p>
<div class="lab">Lecture pour E02</div><p>L’origine est alors plus volontiers auto-immune que nutritionnelle, ce qui éloigne du code E02 sauf si la carence est documentée.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-trust" data-title="Essai TRUST (sujets de 65 ans et plus)">
<div class="lab">Plan</div><p>Essai européen chez 737 sujets de 65 ans et plus avec une <button class="w" data-k="e02-tsh">TSH</button> de 4,60 à 19,99 mU/L (<button class="w" data-k="e02-tsh">TSH</button> moyenne 6,4).</p>
<div class="lab">Résultat</div><p>Aucune différence des symptômes d’hypothyroïdie ni de la fatigue à un an, malgré une <button class="w" data-k="e02-tsh">TSH</button> abaissée à 3,63 mU/L sous une dose médiane de 50 µg.</p>
<div class="lab">Portée</div><p>L’essai ne porte pas sur l’<button class="w" data-k="e02-hic">HIC</button> iodoprive ni sur les personnes de moins de 65 ans. C’est un essai, non une recommandation ; le résumé seul a été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1603825" target="_blank" rel="noopener">TRUST, Stott et al., N Engl J Med 2017 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-feller" data-title="Méta-analyse bernoise (JAMA 2018)">
<div class="lab">Plan</div><p>Revue systématique et méta-analyse de 21 essais portant sur 2192 adultes non enceintes avec <button class="w" data-k="e02-hic">HIC</button>.</p>
<div class="lab">Résultat</div><p>Pas d’amélioration de la qualité de vie ni des symptômes sous hormone thyroïdienne ; les données ne soutiennent pas le traitement de routine.</p>
<div class="lab">Portée</div><p>Adultes non enceintes seulement ; l’<button class="w" data-k="e02-hic">HIC</button> iodoprive n’y est pas isolée. Résumé seul lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/jama.2018.13770" target="_blank" rel="noopener">Feller, Rodondi et al., JAMA 2018 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-ofsp" data-title="OFSP : ce que conclut réellement le rapport HTA 2022"><div class="lab">Document lu</div><p>Rapport daté du 29 août 2022, publié le 28 octobre 2022 ; couverture et résumé exécutif consultés. Il synthétise 22 études uniques rapportées dans 28 articles. lévothyroxine abaisse la <button class="w" data-k="e02-tsh">TSH</button>, mais les autres bénéfices cliniques étudiés ne sont pas cohérents et pertinents de façon robuste ; le risque de biais varie.</p><div class="lab">Portée</div><p>Il ne s’agit pas d’une recommandation spécifique E02 ni d’une étude de grossesse. L’absence de signal majeur de sécurité dans les essais ne prouve pas l’absence de risque de surtraitement. Les coûts de 9–87 millions de francs sur cinq ans proviennent de scénarios d’usage pour 2020–2024 et de données épidémiologiques en partie étrangères ; ce ne sont pas des dépenses mesurées.</p><div class="lab">Administration</div><p>Aucune décision de remboursement individuelle ni règle de prise en charge financière n’est déduite de ce rapport. L’indication clinique, la FI et les conditions administratives effectives sont des questions distinctes.</p><p class="src">Sources : <a href="https://www.bag.admin.ch/dam/en/sd-web/hiZGlyL6EGOQ/h0035ltsh-hta-report.pdf" target="_blank" rel="noopener">OFSP, HTA 2022, résumé exécutif</a>.</p></template>
