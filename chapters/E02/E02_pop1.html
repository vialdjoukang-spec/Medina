<template data-pop="e02-tsh" data-title="TSH : thyréostimuline">
<div class="lab">Rôle</div><p>La TSH est l’hormone hypophysaire qui stimule la thyroïde. Quand la T4 circulante tend à baisser, l’hypophyse sécrète davantage de TSH : c’est le mécanisme d’adaptation à la carence en iode.</p>
<div class="lab">Valeurs</div><p>L’ETA retient 0,4 à 4,0 mU/L comme intervalle de référence de l’adulte. Une TSH au-dessus de 4,0 mU/L avec T4 libre normale définit l’hypothyroïdie infraclinique ; au-dessus de 10 mU/L, la forme est dite sévère.</p>
<div class="lab">Pièges</div><p>La TSH est environ 30 % plus haute le soir et la nuit ; sa variabilité augmente aux valeurs élevées. Elle se comporte comme un mauvais marqueur du statut iodé chez l’adulte et l’écolier, car les différences entre populations sont faibles et le chevauchement important.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-t4" data-title="T4 libre : thyroxine libre">
<div class="lab">Rôle</div><p>La T4 est l’hormone principale sécrétée par la thyroïde ; l’iode est indispensable à sa synthèse. La fraction libre est celle que l’on dose pour juger la fonction.</p>
<div class="lab">Lecture dans E02</div><p>Normale, elle définit l’infraclinique : la glande a compensé. Basse, elle fait changer de code (E01.8). En carence, la T4 sérique est typiquement plus basse et la T3 plus haute que dans une population iodée.</p>
<div class="lab">Limite</div><p>La T4 et la T3 ne sont pas recommandées pour suivre le statut iodé d’une population : elles sont moins sensibles que la thyroglobuline et se chevauchent.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-hic" data-title="Hypothyroïdie infraclinique : définition et seuils">
<div class="lab">Définition</div><p>TSH sérique élevée avec T4 libre et T3 libre dans l’intervalle de référence de la population. L’intervalle retenu par l’ETA pour la TSH est de 0,4 à 4,0 mU/L.</p>
<div class="lab">Catégories</div><p>Légère : TSH de 4,0 à 10,0 mU/L, environ 90 % des cas. Sévère : plus de 10 mU/L (recommandation 1, grade 2S). En grossesse, la TSH se compare à l’intervalle propre à la grossesse ; chez l’enfant, l’HIC correspond à une TSH supérieure à 5,5–10 mU/L.</p>
<div class="lab">Pourquoi ce seuil de 10</div><p>Le risque coronarien et d’insuffisance cardiaque apparaît surtout au-dessus de 10 mU/L, et la recommandation de traiter sans symptôme avant 65–70 ans s’y rattache.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <a href="https://doi.org/10.1159/000362597" target="_blank" rel="noopener">ETA 2014, hypothyroïdie infraclinique en grossesse et chez l’enfant (résumé seul lu)</a>.</p></template>
<template data-pop="e02-nomenclature" data-title="CIM : E01, E01.8, E02 et E03">
<div class="lab">Libellés</div><p>Selon l’Office fédéral de la statistique (CIM-10-GM 2024), E02 se nomme « Hypothyroïdie par carence inapparente en iode » et n’a aucun sous-code. L’OMS (CIM-10, 2019) la désigne par « Subclinical iodine-deficiency hypothyroidism », sans note d’inclusion ni d’exclusion propre.</p>
<div class="lab">Exclusions</div><p>E01 exclut E02 ; l’hypothyroïdie acquise par carence iodée non précisée se classe en E01.8. E03 exclut l’hypothyroïdie liée à la carence iodée (E00 à E02) et l’hypothyroïdie post-procédurale (E89.0).</p>
<div class="lab">Conséquence</div><p>La T4 libre départage : normale avec TSH élevée, E02 ; basse, E01.8. La CIM-10-GM peut différer de la version OMS ; le cours n’a lu que les libellés de la première et les notes de la seconde.</p>
<p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024, catégories E01 à E03</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E02" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E02, E01.8 et E03</a>.</p></template>
<template data-pop="e02-apports" data-title="Apports recommandés en iode : OMS et EFSA">
<div class="lab">OMS, UNICEF, ICCIDD</div><p>90 µg/j de 0 à 59 mois, 120 µg/j de 6 à 12 ans, 150 µg/j pour les adolescents et adultes, 250 µg/j pendant la grossesse et l’allaitement.</p>
<div class="lab">EFSA</div><p>Apport adéquat de 150 µg/j chez l’adulte, 200 µg/j pendant la grossesse et l’allaitement, 70 à 130 µg/j chez l’enfant de 7 mois et plus. La limite supérieure de 600 µg/j chez la femme enceinte est citée par l’étude suisse.</p>
<div class="lab">Arbitrage</div><p>Les deux référentiels diffèrent de 50 µg/j en grossesse. Le cours cite l’OMS pour les doses de supplémentation et l’EFSA comme repère européen ; les valeurs D-A-CH suisses n’ont pas été lues dans un document officiel et ne sont pas utilisées.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://doi.org/10.2903/j.efsa.2014.3660" target="_blank" rel="noopener">EFSA 2014, valeurs de référence alimentaires pour l’iode (résumé seul lu)</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-paradoxe" data-title="Paradoxe iodé : étude danoise">
<div class="lab">Résultat</div><p>Au Danemark, avant l’iodation, deux régions ont été comparées. En carence modérée (iodurie 45 µg/L) : hypothyroïdie manifeste 26,5 pour 100 000 par an et hyperthyroïdie 92,9. En carence légère (61 µg/L) : 40,1 et 65,4.</p>
<div class="lab">Interprétation</div><p>La carence modérée comptait moins d’hypothyroïdies mais plus d’hyperthyroïdies. Les auteurs placent l’apport optimal dans une plage étroite autour de 150 µg/j. La relation est en U : des troubles surviennent en cas d’apport insuffisant comme excessif.</p>
<div class="lab">Limite</div><p>L’étude porte sur l’hypothyroïdie <b>manifeste</b>, non infraclinique, et sur des populations danoises. Le résumé seul a été lu ; aucun mécanisme n’en est tiré.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/jc.2002-020750" target="_blank" rel="noopener">Bülow Pedersen et al., J Clin Endocrinol Metab 2002 (résumé seul lu)</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-sel" data-title="Sel iodé en Suisse : histoire et règles">
<div class="lab">Histoire</div><p>Introduit en 1922, disponible dans tout le pays depuis 1952. Teneur en iode : 3,75 mg/kg à l’origine, 7,5 en 1962, 15 en 1980, 20 en 1998, 25 depuis janvier 2014 ; plage légale de 20 à 40 mg/kg.</p>
<div class="lab">Règles</div><p>L’iodation est volontaire. Plus de 80 % des ménages utilisent du sel iodé, mais un tiers seulement des aliments transformés salés en contient (47 % des produits suisses, 9 % des produits importés). Le sel des aliments transformés représente 70 à 80 % du sel consommé.</p>
<div class="lab">Conseil</div><p>L’OSAV recommande le sel iodé en cuisine et à table, et de choisir des produits dont la liste des ingrédients mentionne « sel iodé ». 86 % des boulangeries en utilisent.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV, page sur le sel iodé</a>.</p></template>
<template data-pop="e02-suisse" data-title="Monitorage suisse 2020–2022">
<div class="lab">Méthode</div><p>Étude nationale chez des écoliers de 6 à 12 ans et des femmes enceintes. L’iodurie a été corrigée par la créatininurie et par un second échantillon ; les personnes récemment exposées à l’iode étaient exclues.</p>
<div class="lab">Résultats</div><p>Écoliers : iodurie médiane 127 µg/L, apport habituel estimé 114 µg/j, apport inadéquat chez 5,4 %. Femmes enceintes : médiane 97 µg/L (123 µg/L après correction de la variabilité intra-individuelle), 30 % de moins qu’en 2015 (140 µg/L). Apport inadéquat (moins de 160 µg/j) : 31 % des non-utilisatrices de supplément iodé, 0,2 % des utilisatrices. 47 % prenaient un supplément contenant 150 à 220 µg d’iode.</p>
<div class="lab">Thyroïde</div><p>Toutes euthyroïdiennes sauf une (HIC, 0,2 %). Aucune corrélation entre iodurie et TSH ou T4. Thyroglobuline médiane de 26,0 µg/L, plus haute qu’en 2015, plus basse sous supplément.</p>
<div class="lab">Limites</div><p>Faible taux de réponse. Les seuils de TSH gravidiques de l’étude viennent d’une société américaine : ils ne servent pas de fondement de conduite ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-adaptation" data-title="Ajustements de la glande à la carence">
<div class="lab">Constat</div><p>La carence prolongée augmente la captation thyroïdienne d’iode, le rapport T3/T4 sécrété et la conversion périphérique de T4 en T3.</p>
<div class="lab">Conséquence biologique</div><p>La T4 sérique est plus basse et la T3 plus haute que dans une population iodée. L’hyperplasie stimulée élève la thyroglobuline sérique, qui reflète l’apport des mois ou années précédents.</p>
<div class="lab">Limite</div><p>Les sources lues décrivent ces ajustements sans en donner la raison moléculaire ; le cours ne la reconstruit pas de mémoire.</p>
<p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-tg" data-title="Thyroglobuline : marqueur de population">
<div class="lab">Définition</div><p>Protéine folliculaire sur laquelle les hormones thyroïdiennes sont synthétisées. Son taux sanguin est bas quand l’apport en iode est suffisant.</p>
<div class="lab">Usage</div><p>Marqueur sensible de carence à l’échelle d’une population, qui réagit rapidement. Intervalle de référence chez l’écolier iodé, en sang séché : 4 à 40 µg/L. Elle s’élève aussi en cas d’excès d’iode. Dans la carence légère, c’est elle qui s’élève d’abord.</p>
<div class="lab">Limite</div><p>Elle n’est pas validée comme test diagnostique individuel pour E02 dans les sources lues.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-goitre" data-title="Goitre : adaptation à la carence chronique">
<div class="lab">Rôle</div><p>Le goitre est l’adaptation physiologique classique à une carence chronique : la stimulation répétée par la TSH augmente le volume de la glande.</p>
<div class="lab">Valeur clinique</div><p>Un goitre diffus ou nodulaire associé à une HIC persistante est, selon l’ETA, un argument pour discuter un traitement (recommandation 7, grade 2W).</p>
<div class="lab">Limite</div><p>La définition clinique OMS du goitre n’a pas été relue dans ce dossier ; le renvoi se fait au cours E01.</p>
<p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-grossesse" data-title="Grossesse : besoins, définitions et intervalle de référence">
<div class="lab">Besoins</div><p>Ils augmentent avec la production accrue d’hormones maternelles et la captation d’iode par le fœtus, le placenta et le liquide amniotique. La période la plus critique pour le cerveau va du deuxième trimestre à la troisième année de vie.</p>
<div class="lab">Définitions</div><p>HIC de la grossesse : TSH au-dessus de l’intervalle de référence propre à la grossesse avec T4 libre normale. Hypothyroxinémie isolée : T4 libre sous le 2,5e centile de l’intervalle gravidique avec TSH normale.</p>
<div class="lab">Limite</div><p>Seul le résumé de l’ETA 2014 a pu être lu : les seuils trimestriels de TSH et les doses ne sont pas fournis. Les seuils de l’étude suisse viennent d’une société américaine et ne fondent pas de conduite.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000362597" target="_blank" rel="noopener">ETA 2014, hypothyroïdie infraclinique en grossesse et chez l’enfant (résumé seul lu)</a> ; <a href="https://doi.org/10.2903/j.efsa.2014.3660" target="_blank" rel="noopener">EFSA 2014, valeurs de référence alimentaires pour l’iode (résumé seul lu)</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-grossesse-risque" data-title="Grossesse : risques et lévothyroxine">
<div class="lab">Risques</div><p>L’HIC et l’hypothyroxinémie isolée sont associées à des issues obstétricales défavorables et à un moindre développement neuro-intellectuel de l’enfant. L’HIC gravidique est surtout auto-immune mais peut être due à une carence iodée ; l’hypothyroxinémie isolée peut aussi en relever.</p>
<div class="lab">Traitement</div><p>La lévothyroxine peut atténuer certaines complications obstétricales de l’HIC. Aucune preuve n’indique qu’elle améliore le développement de l’enfant.</p>
<div class="lab">Limite</div><p>Association n’est pas causalité ; texte intégral non lu. Une revue de 2016 sur les conséquences de la carence et de l’excès iodé chez la femme enceinte n’a été lue qu’en résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000362597" target="_blank" rel="noopener">ETA 2014, hypothyroïdie infraclinique en grossesse et chez l’enfant (résumé seul lu)</a> ; <a href="https://doi.org/10.3945/ajcn.115.110429" target="_blank" rel="noopener">Pearce et al., Am J Clin Nutr 2016 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-nouveau-ne" data-title="Nouveau-né : réserves et hyperthyrotropinémie transitoire">
<div class="lab">Mécanisme</div><p>Le nouveau-né a peu d’iode thyroïdien et un renouvellement élevé. La carence exige une stimulation accrue par la TSH : c’est l’hyperthyrotropinémie transitoire des premières semaines.</p>
<div class="lab">Réserves</div><p>Elles sont minimales, suffisantes pour quelques jours ; le nourrisson dépend du lait maternel ou des préparations pour nourrissons, obligatoirement enrichies en Suisse (15 à 29 µg pour 100 kcal).</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-enfant" data-title="Enfant : HIC, définition et évolution">
<div class="lab">Définition</div><p>TSH supérieure à 5,5–10 mU/L avec T4 libre normale.</p>
<div class="lab">Évolution</div><p>L’HIC se normalise dans plus de 70 % des cas ; chez la plupart des autres, elle reste stable sans aggravation sur cinq ans.</p>
<div class="lab">Limite</div><p>Seul le résumé de l’ETA 2014 a été lu ; les conduites détaillées chez l’enfant ne sont pas reprises.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000362597" target="_blank" rel="noopener">ETA 2014, hypothyroïdie infraclinique en grossesse et chez l’enfant (résumé seul lu)</a>.</p></template>
<template data-pop="e02-nis" data-title="Symporteur sodium/iodure (NIS)">
<div class="lab">Rôle cité</div><p>La glande mammaire concentre l’iode grâce au symporteur sodium/iodure (NIS). Le lait maternel apporte ainsi l’iode au nourrisson, d’où sa dépendance à l’apport maternel pendant l’allaitement.</p>
<div class="lab">Valeur suisse</div><p>L’iodure du lait maternel suisse est de 50 µg/L en médiane ; l’iodurie médiane des nourrissons de 70 à 100 µg/L correspond à un apport estimé de 40 à 50 µg/j, jugé insuffisant.</p>
<div class="lab">Limite</div><p>Le dossier ne décrit le NIS que dans la glande mammaire ; son rôle thyroïdien n’est pas développé ici.</p>
<p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a>.</p></template>
<template data-pop="e02-antitpo" data-title="Anticorps anti-TPO">
<div class="lab">Usage</div><p>Les anticorps anti-peroxydase thyroïdienne (anti-TPO) cherchent l’auto-immunité. L’ETA recommande de les doser avec la TSH et la T4 libre lors du contrôle à deux ou trois mois.</p>
<div class="lab">Valeur pour E02</div><p>Négatifs, ils plaident contre la thyroïdite auto-immune, mais environ 20 % des HIC n’ont aucun anticorps détectable (ni anti-TPO ni anti-thyroglobuline). Positifs, ils éloignent de E02 et prédisent une progression plus rapide (4,3 % par an contre 2,6 %).</p>
<div class="lab">Limite</div><p>Un résultat négatif ne prouve pas la carence : c’est un argument, jamais un test de la cause nutritionnelle.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-causes-trans" data-title="Causes transitoires d’une TSH élevée">
<div class="lab">Liste</div><p>Thyroïdite subaiguë ou indolore, arrêt de lévothyroxine, convalescence d’une maladie non thyroïdienne, médicaments (lithium, amiodarone).</p>
<div class="lab">Conduite</div><p>La répétition du dosage à deux ou trois mois les révèle : la TSH se normalise. D’où la règle de ne pas traiter sur une valeur isolée.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-amiodarone" data-title="Lithium et amiodarone">
<div class="lab">Constat</div><p>L’ETA les cite parmi les causes d’une TSH élevée. L’information professionnelle suisse d’Euthyrox signale que l’amiodarone peut provoquer une hypo- ou une hyperthyroïdie.</p>
<div class="lab">Conduite</div><p>Dater la prise, revoir l’indication du médicament avec le prescripteur, contrôler la TSH.</p>
<div class="lab">Limite</div><p>Le dossier n’expose ni la dose seuil ni le mécanisme détaillé de ces médicaments sur la thyroïde.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, numéro d’autorisation 7680549490017)</span>.</p></template>
<template data-pop="e02-surrenale" data-title="Insuffisance surrénalienne et TSH">
<div class="lab">Constat</div><p>Une insuffisance surrénalienne non traitée peut élever la TSH. L’ETA conseille de juger l’HIC au moins quatre semaines après une substitution glucocorticoïde adéquate.</p>
<div class="lab">Sécurité du traitement</div><p>L’information professionnelle d’Euthyrox range l’insuffisance surrénalienne non traitée parmi les contre-indications, et demande de substituer d’abord les glucocorticoïdes en cas d’insuffisance compensée.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, numéro d’autorisation 7680549490017)</span>.</p></template>
<template data-pop="e02-biotine" data-title="Biotine et immunodosages thyroïdiens">
<div class="lab">Constat</div><p>La biotine interfère avec les immunodosages thyroïdiens et peut donner des résultats faussement bas ou élevés.</p>
<div class="lab">Conduite</div><p>Interroger sur la prise de biotine devant un résultat discordant, et refaire le dosage après arrêt.</p>
<div class="lab">Limite</div><p>Le dossier n’indique ni la dose en cause ni le délai d’arrêt nécessaire : le laboratoire donne ces repères.</p>
<p class="src">Références : <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, numéro d’autorisation 7680549490017)</span>.</p></template>
<template data-pop="e02-confirmation" data-title="Pourquoi répéter la TSH à 2–3 mois">
<div class="lab">Trois raisons</div><p>La TSH est environ 30 % plus haute le soir et la nuit. Sa variabilité augmente aux valeurs élevées. Le « point de consigne » individuel n’occupe qu’un tiers de l’intervalle de référence.</p>
<div class="lab">Conséquence</div><p>La fonction se normalise spontanément chez 6 à 35 % des patients ; un dosage isolé mène à un surdiagnostic. La recommandation 2 de l’ETA (grade 2S) fixe le contrôle à deux ou trois mois, idéalement à la même heure.</p>
<div class="lab">Sujet âgé</div><p>Les intervalles par âge réduisent les diagnostics d’HIC d’environ 2 % après 75 ans et de 5 % après 90 ans.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-iodurie" data-title="Iodurie : ce qu’elle mesure et ne mesure pas">
<div class="lab">Ce qu’elle mesure</div><p>Environ 90 % de l’iode alimentaire part dans l’urine en 24 heures : l’iodurie reflète l’apport récent. Elle dépend de la dilution urinaire, d’où la correction par la créatininurie dans l’étude suisse.</p>
<div class="lab">Ce qu’elle ne fait pas</div><p>Les seuils de l’OMS classent des populations. Une valeur ponctuelle ne classe pas un individu ; un statut individuel exigerait des urines répétées sur au moins dix jours.</p>
<div class="lab">Exclusion</div><p>Une exposition récente à l’iode (produit de contraste, médicament iodé) fausse la mesure.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2020/07/31_2_2020_3_de.pdf" target="_blank" rel="noopener">Andersson et Braegger, Paediatrica 2020, statut iodé des nourrissons et enfants en Suisse</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-seuils-iodurie" data-title="Seuils d’iodurie médiane de l’OMS">
<div class="lab">Écoliers et adultes non enceintes</div><table class="t"><thead><tr><th>Médiane</th><th>Statut</th></tr></thead><tbody><tr><td>Moins de 20 µg/L</td><td>Carence sévère</td></tr><tr><td>20 à 49 µg/L</td><td>Carence modérée</td></tr><tr><td>50 à 99 µg/L</td><td>Carence légère</td></tr><tr><td>100 à 199 µg/L</td><td>Apport adéquat</td></tr><tr><td>200 à 299 µg/L</td><td>Au-dessus des besoins</td></tr><tr><td>300 µg/L ou plus</td><td>Excessif</td></tr></tbody></table>
<div class="lab">Femmes enceintes</div><table class="t"><thead><tr><th>Médiane</th><th>Statut</th></tr></thead><tbody><tr><td>Moins de 150 µg/L</td><td>Insuffisant</td></tr><tr><td>150 à 249 µg/L</td><td>Adéquat</td></tr><tr><td>250 à 499 µg/L</td><td>Au-dessus des besoins</td></tr><tr><td>500 µg/L ou plus</td><td>Excessif</td></tr></tbody></table>
<div class="lab">Allaitement et enfants de moins de 2 ans</div><p>Le seuil d’adéquation est de 100 µg/L.</p>
<div class="lab">Limite</div><p>Ces seuils concernent la médiane d’un groupe. Un excès (300 µg/L ou plus) s’associe à l’hyperthyroïdie induite par l’iode et à l’auto-immunité.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-tsh-neo" data-title="TSH néonatale : indicateur de population">
<div class="lab">Règle</div><p>Une fréquence inférieure à 3 % de TSH supérieure à 5 mU/L (sang total, troisième ou quatrième jour, dosage sensible) signe la suffisance iodée d’une population.</p>
<div class="lab">Piège</div><p>La povidone iodée appliquée à la mère ou au nouveau-né fausse ce marqueur.</p>
<div class="lab">Pourquoi un bon indicateur</div><p>Le nouveau-né a peu de réserves et un renouvellement élevé : sa TSH réagit vite à la carence.</p>
<p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-calc-baisse" data-title="Calcul de la baisse de l’iodurie 2015–2022">
<div class="lab">Formule</div><p>Variation relative = (valeur ancienne − valeur récente) ÷ valeur ancienne.</p>
<div class="lab">Application</div><p>(140 − 97) ÷ 140 = 43 ÷ 140 ≈ 0,307, soit environ 31 %, que l’étude arrondit à 30 %. Les médianes sont exprimées en µg/L.</p>
<div class="lab">Lecture</div><p>La baisse concerne la médiane d’un groupe de femmes enceintes. Elle ne désigne aucune patiente et n’indique pas une hypothyroïdie : une seule HIC a été retrouvée dans ce groupe.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="e02-progression" data-title="Progression vers l’hypothyroïdie manifeste">
<div class="lab">Taux</div><p>Environ 5 à 8 % par an selon la TSH ; 4,3 % par an si les anti-TPO sont positifs, 2,6 % par an s’ils sont négatifs.</p>
<div class="lab">Lecture pour E02</div><p>Le profil attendu dans E02, anti-TPO négatifs, correspond au taux le plus bas ; l’évolution reste malgré tout à surveiller.</p>
<div class="lab">Limite</div><p>Ces chiffres viennent de l’HIC générale ; aucun taux propre à l’HIC iodoprive n’a été trouvé.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-age" data-title="Sujet âgé : intervalles adaptés à l’âge">
<div class="lab">Règle</div><p>L’ETA recommande des intervalles de référence adaptés à l’âge (recommandation 14, grade 2S). Après 80 ans, une TSH de 4,0 à 7,0 mU/L peut être physiologique.</p>
<div class="lab">Effet</div><p>Les intervalles par âge réduisent les diagnostics d’HIC d’environ 2 % après 75 ans et 5 % après 90 ans.</p>
<div class="lab">Conduite</div><p>Au-delà de 80 à 85 ans, attentisme si la TSH ne dépasse pas 10 mU/L (recommandation 15, grade 3S).</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, numéro d’autorisation 7680549490017)</span>.</p></template>
<template data-pop="e02-diabete" data-title="Diabète de type 1 et thyroïde">
<div class="lab">Constat</div><p>Une dysfonction thyroïdienne touche environ 10 % des patients atteints de diabète de type 1. L’ETA recommande un dosage annuel de la TSH (recommandation 9).</p>
<div class="lab">Lecture pour E02</div><p>L’origine est alors plus volontiers auto-immune que nutritionnelle, ce qui éloigne du code E02 sauf si la carence est documentée.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a>.</p></template>
<template data-pop="e02-trust" data-title="Essai TRUST (sujets de 65 ans et plus)">
<div class="lab">Plan</div><p>Essai européen chez 737 sujets de 65 ans et plus avec une TSH de 4,60 à 19,99 mU/L (TSH moyenne 6,4).</p>
<div class="lab">Résultat</div><p>Aucune différence des symptômes d’hypothyroïdie ni de la fatigue à un an, malgré une TSH abaissée à 3,63 mU/L sous une dose médiane de 50 µg.</p>
<div class="lab">Portée</div><p>L’essai ne porte pas sur l’HIC iodoprive ni sur les personnes de moins de 65 ans. C’est un essai, non une recommandation ; le résumé seul a été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1603825" target="_blank" rel="noopener">TRUST, Stott et al., N Engl J Med 2017 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-feller" data-title="Méta-analyse bernoise (JAMA 2018)">
<div class="lab">Plan</div><p>Revue systématique et méta-analyse de 21 essais portant sur 2192 adultes non enceintes avec HIC.</p>
<div class="lab">Résultat</div><p>Pas d’amélioration de la qualité de vie ni des symptômes sous hormone thyroïdienne ; les données ne soutiennent pas le traitement de routine.</p>
<div class="lab">Portée</div><p>Adultes non enceintes seulement ; l’HIC iodoprive n’y est pas isolée. Résumé seul lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/jama.2018.13770" target="_blank" rel="noopener">Feller, Rodondi et al., JAMA 2018 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-ofsp" data-title="Rapport d’évaluation de l’OFSP sur la lévothyroxine (2022)">
<div class="lab">Contenu</div><p>Le rapport (28.10.2022) conclut que la lévothyroxine abaisse la TSH sans réduire les plaintes d’épuisement ni la dépression. Il n’identifie pas de risque de sécurité significatif. Le coût sur cinq ans est estimé de 9 à 87 millions de francs selon l’usage.</p>
<div class="lab">Portée</div><p>La page de synthèse seule a été lue ; le rapport complet et toute décision de remboursement ne sont pas exposés.</p>
<p class="src">Références : <a href="https://www.bag.admin.ch/en/use-of-the-hormone-levothyroxine-to-treat-a-slightly-underactive-thyroid-gland" target="_blank" rel="noopener">OFSP, rapport HTA sur la lévothyroxine, 2022 (page de synthèse)</a>.</p></template>
