<template data-pop="e02-levo" data-title="Lévothyroxine : Euthyrox, information professionnelle suisse">
<div class="lab">Statut et date</div><p>Information professionnelle suisse d’Euthyrox (lévothyroxine sodique, Merck), mise à jour de février 2023, lue dans l’AIPS le 14.10.2026. Elle décrit un produit unique ; les autres spécialités ne sont pas comparées.</p>
<div class="lab">Place dans E02</div><p>Remplacer l’hormone, non traiter la cause. L’ETA 2013 la recommande dans l’HIC avec une TSH supérieure à 10 mU/L avant 65 à 70 ans et en essai limité dans le temps chez un sujet jeune symptomatique. Les essais postérieurs (TRUST, méta-analyse bernoise) ne montrent pas de bénéfice symptomatique dans les formes légères.</p>
<div class="lab">Posologie</div><p>Prise unique le matin, à jeun, au moins une demi-heure avant le petit-déjeuner. Hypothyroïdie : dose initiale de 25 à 50 µg/j, augmentée de 25 à 50 µg toutes les deux à quatre semaines ; entretien de 100 à 200 µg/j. Sujet âgé, hypothyroïdie ancienne ou sévère, maladie cardiovasculaire : débuter à 25 µg/j et augmenter prudemment. ETA 2013 : environ 1,5 µg/kg/j sans cardiopathie ; entretien habituel de l’HIC de 50 à 100 µg/j. Enfants : 0–6 mois 25–75 µg (10 µg/kg), 6–12 mois 50–75 µg (8 µg/kg), 1–5 ans 75–100 µg (5–6 µg/kg), 6–12 ans 100–150 µg (4–5 µg/kg).</p>
<div class="lab">Contre-indications</div><p>Insuffisance cardiaque avec tachycardie, pancardite et myocardite aiguës, infarctus aigu, angor, insuffisance hypophysaire ou surrénalienne non traitée, hyperthyroïdie. En cas d’insuffisance surrénalienne compensée, substituer d’abord les glucocorticoïdes ; exclure une autonomie thyroïdienne avant traitement (test à la TRH ou scintigraphie de freinage).</p>
<div class="lab">Interactions</div><p>Calcium, fer, aluminium : prendre la lévothyroxine au moins deux heures avant ; résines : quatre à cinq heures avant ; inhibiteurs de la pompe à protons : absorption diminuée ; inducteurs enzymatiques, œstrogènes, sertraline : besoins accrus ; produits de contraste iodés et amiodarone : fonction thyroïdienne modifiée. L’ETA 2013 conseille d’espacer calcium, fer et inhibiteurs de la pompe à protons d’au moins quatre heures. En cas de divergence, l’information professionnelle (2023) prime sur l’ETA (2013) par sa date ; le délai le plus long reste prudent.</p>
<div class="lab">Grossesse et suivi</div><p>Poursuivre sans interruption ; la dose peut devoir augmenter ; reprendre la dose antérieure après l’accouchement et contrôler la TSH à six à huit semaines. Cible de TSH de 0,4 à 2,5 mU/L chez la plupart des adultes (ETA), de 1 à 5 mU/L après 70 à 75 ans ; contrôle à deux mois puis au moins annuel. Pas de T3 ni d’association T4/T3 (ETA, recommandation 16). Ne jamais utiliser pour perdre du poids.</p>
<div class="lab">Lacune</div><p>La section des effets indésirables n’a pas été reproduite dans le dossier de recherche : elle doit être consultée dans l’information professionnelle avant toute prescription.</p>
<p class="src">Références : <span>Information professionnelle suisse Euthyrox, février 2023 (AIPS, numéro d’autorisation 7680549490017)</span> ; <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <a href="https://doi.org/10.1056/NEJMoa1603825" target="_blank" rel="noopener">TRUST, Stott et al., N Engl J Med 2017 (résumé seul lu)</a> ; <a href="https://doi.org/10.1001/jama.2018.13770" target="_blank" rel="noopener">Feller, Rodondi et al., JAMA 2018 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-supplement" data-title="Supplément prénatal : Elevit Pronatal et iode">
<div class="lab">Statut et date</div><p>Information professionnelle suisse d’Elevit Pronatal (Bayer), mise à jour de novembre 2025, lue dans l’AIPS le 14.10.2026. Elle sert ici uniquement de preuve de composition.</p>
<div class="lab">Constat</div><p>La composition d’Elevit Pronatal ne comporte pas d’iode. Dans l’étude suisse 2020–2022, le produit prénatal le plus prescrit n’en contenait pas non plus ; 61 % seulement des produits du marché contenaient au moins 150 µg d’iode.</p>
<div class="lab">Conduite</div><p>L’OSAV demande que les suppléments pris pendant la grossesse et l’allaitement contiennent de l’iode. Une supplémentation iodée n’est pas explicitement recommandée en Suisse, mais il est conseillé de choisir un produit prénatal iodé. Doses de l’OMS pour les populations où l’iodation du sel est insuffisante : 250 µg/j pendant la grossesse et l’allaitement, 150 µg/j chez la femme en âge de procréer. Débuter avant la conception.</p>
<div class="lab">Preuves et sécurité</div><p>La supplémentation abaisse la thyroglobuline et corrige l’apport inadéquat en Suisse ; elle améliore la fonction thyroïdienne maternelle même en carence marginale. À 200 µg/j en carence légère (Inde, Thaïlande), elle n’a pas amélioré le quotient intellectuel des enfants à 5–6 ans. Excès : 3,4 % des femmes enceintes dépassaient la limite supérieure de 600 µg/j de l’EFSA ; les algues peuvent apporter des quantités très élevées d’iode.</p>
<div class="lab">Limite</div><p>Un seul produit a été vérifié ; la composition des autres spécialités se lit sur leur propre information professionnelle.</p>
<p class="src">Références : <span>Information professionnelle suisse Elevit Pronatal, novembre 2025 (AIPS, numéro d’autorisation 7680456040039)</span> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a> ; <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV, page sur le sel iodé</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a> ; <a href="https://doi.org/10.3945/ajcn.115.110429" target="_blank" rel="noopener">Pearce et al., Am J Clin Nutr 2016 (résumé seul lu)</a> ; <a href="https://doi.org/10.1016/S2213-8587(17)30332-7" target="_blank" rel="noopener">Gowachirapant et al., Lancet Diabetes Endocrinol 2017 (résumé seul lu)</a>.</p></template>
<template data-pop="e02-ki65" data-title="Iodure de potassium 65 mg : protection contre l’iode radioactif">
<div class="lab">Statut et date</div><p>Information professionnelle suisse d’Iodure de potassium axapharm 65 mg, mise à jour de septembre 2013, lue dans l’AIPS le 14.10.2026.</p>
<div class="lab">Indication</div><p>Les comprimés distribués par la Confédération servent uniquement à la protection de la population contre l’iode radioactif, sur ordre des autorités, en cas d’accident nucléaire. Ils ne sont pas une supplémentation nutritionnelle.</p>
<div class="lab">Pourquoi l’écarter de E02</div><p>La dose et le contexte d’emploi sont ceux d’une mesure de protection, non d’un apport quotidien. Le prescrire pour corriger une carence relèverait d’une confusion de produit.</p>
<div class="lab">Lacune</div><p>Les détails de posologie et les effets indésirables ne sont pas reproduits dans le dossier ; ils se lisent dans l’information professionnelle.</p>
<p class="src">Références : <span>Information professionnelle suisse iodure de potassium axapharm 65 mg, septembre 2013 (AIPS, numéro d’autorisation 7680670170017)</span>.</p></template>
<template data-pop="e02-s-eta" data-title="European Thyroid Association : 2013 et 2014">
<div class="lab">2013</div><p>Recommandation sur la prise en charge de l’hypothyroïdie infraclinique chez l’adulte non enceinte (Pearce et al., Eur Thyroid J 2013). Texte lu sur environ 100 000 des 164 000 caractères, recommandations et sections cliniques couvertes. Elle précède l’essai TRUST.</p>
<div class="lab">2014</div><p>Recommandations pour la grossesse et l’enfant (Lazarus et al., Eur Thyroid J 2014). Seul le résumé a été lu : le texte intégral n’était pas accessible, de sorte que les seuils trimestriels de TSH et les doses ne sont pas repris.</p>
<div class="lab">Statut</div><p>Source européenne, non spécifique à la carence iodée. Aucune recommandation suisse ou européenne propre à E02 n’a été retrouvée.</p>
<p class="src">Références : <a href="https://doi.org/10.1159/000356507" target="_blank" rel="noopener">ETA 2013, hypothyroïdie infraclinique (Pearce et al., Eur Thyroid J 2013)</a> ; <a href="https://doi.org/10.1159/000362597" target="_blank" rel="noopener">ETA 2014, hypothyroïdie infraclinique en grossesse et chez l’enfant (résumé seul lu)</a>.</p></template>
<template data-pop="e02-s-oms" data-title="OMS : CIM-10 et guide OMS, UNICEF, ICCIDD">
<div class="lab">CIM-10 (2019)</div><p>Libellé « Subclinical iodine-deficiency hypothyroidism » et notes d’exclusion de E01 et E03.</p>
<div class="lab">Guide 2007</div><p>« Assessment of iodine deficiency disorders and monitoring their elimination », troisième édition : apports recommandés, seuils d’iodurie, rôle de la thyroglobuline et de la TSH néonatale, doses de supplémentation.</p>
<div class="lab">Limites</div><p>Guide de santé publique dont les seuils concernent des populations, non des individus ; chapitres 2.1 et 4.4, tableaux 1, 2, 4, 5 et 9 lus.</p>

<div class="lab">Contenu</div><p>La page de l’Office fédéral de la sécurité alimentaire et des affaires vétérinaires précise les groupes à risque, les sources d’iode (sel iodé 51 %, produits laitiers 26 %, poissons et fruits de mer 9 %), les recommandations alimentaires et la consigne sur les suppléments prénatals.</p>

<template data-pop="e02-s-efsa" data-title="EFSA 2014 : valeurs de référence pour l’iode">
<div class="lab">Contenu</div><p>Avis scientifique du panel NDA : apport adéquat de 150 µg/j chez l’adulte, 200 µg/j pendant la grossesse et l’allaitement, 70 à 130 µg/j chez l’enfant de 7 mois et plus.</p>
<div class="lab">Limites</div><p>Résumé seul lu ; la limite supérieure de 600 µg/j chez la femme enceinte est citée par l’étude suisse.</p>
<p class="src">Références : <a href="https://doi.org/10.2903/j.efsa.2014.3660" target="_blank" rel="noopener">EFSA 2014, valeurs de référence alimentaires pour l’iode (résumé seul lu)</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="pareto-e02-definition" data-title="Pareto — Définition et nosologie">
<p class="ratio" data-cover="e02-0,e02-1"></p><ul><li>E02 est une HIC attribuée à une carence en iode : TSH élevée, T4 libre normale ; T4 libre basse, c’est E01.8.</li><li>HIC légère : 4,0 à 10,0 mU/L ; sévère : plus de 10 mU/L.</li><li>Le code décrit, il ne prouve pas la cause ; aucun critère diagnostique publié propre à E02.</li></ul></template>
<template data-pop="pareto-e02-epidemio" data-title="Pareto — Fréquence et situation suisse">
<p class="ratio" data-cover="e02-2"></p><ul><li>Prévalence de l’HIC de 4 à 10 %, plus fréquente dans les régions iodées.</li><li>Écoliers suisses suffisants (127 µg/L), femmes enceintes insuffisantes (97 µg/L).</li><li>Une seule HIC (0,2 %) dans l’étude suisse ; aucune corrélation iodurie–TSH.</li></ul></template>
<template data-pop="pareto-e02-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="e02-3"></p><ul><li>Moins d’iode, T4 qui tend à baisser, TSH qui monte.</li><li>La glande compense : captation, T3/T4 et conversion augmentent, Tg s’élève, goitre.</li><li>Compensation efficace : E02 ; dépassée : T4 basse, E01.8.</li></ul></template>
<template data-pop="pareto-e02-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="e02-4"></p><ul><li>Pas de sel iodé, végétalisme sans aliments enrichis, peu de lait, produits transformés sans iode.</li><li>Grossesse et allaitement augmentent les besoins.</li><li>Un supplément prénatal peut ne pas contenir d’iode : lire la composition.</li></ul></template>
<template data-pop="pareto-e02-anamnese" data-title="Pareto — Anamnèse">
<p class="ratio" data-cover="e02-5"></p><ul><li>Chercher l’apport, la grossesse et le contenu du supplément.</li><li>Éliminer causes transitoires, médicaments, surrénale et exposition à l’iode.</li><li>L’HIC donne peu de symptômes ; la biotine fausse les dosages.</li></ul></template>
<template data-pop="pareto-e02-examen" data-title="Pareto — Examen clinique">
<p class="ratio" data-cover="e02-6"></p><ul><li>L’examen est pauvre ; la découverte est biologique.</li><li>Rechercher un goitre, argument pour discuter un traitement.</li><li>Pas de lévothyroxine pour maigrir.</li></ul></template>
<template data-pop="pareto-e02-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="e02-7"></p><ul><li>Répéter TSH, T4 libre et anti-TPO à deux ou trois mois, à la même heure.</li><li>Anti-TPO négatifs plus contexte carencé orientent vers E02 ; l’iodurie ponctuelle ne diagnostique pas.</li><li>Le principal différentiel est la thyroïdite auto-immune.</li></ul></template>
<template data-pop="pareto-e02-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="e02-8"></p><ul><li>Aucune urgence propre à E02 dans les sources.</li><li>La grossesse est la situation prioritaire.</li><li>Surrénale non traitée : substituer les glucocorticoïdes avant la lévothyroxine.</li></ul></template>
<template data-pop="pareto-e02-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="e02-9"></p><ul><li>Corriger l’apport en iode avant la conception : sel iodé, produits laitiers, supplément iodé.</li><li>Lévothyroxine si TSH supérieure à 10 mU/L avant 65–70 ans ; essai limité si symptômes.</li><li>Pas d’essai comparant iode et lévothyroxine ; TRUST et la méta-analyse bernoise vont dans le sens de la retenue.</li></ul></template>
<template data-pop="pareto-e02-suivi" data-title="Pareto — Suivi et complications">
<p class="ratio" data-cover="e02-10"></p><ul><li>Progression de 5 à 8 % par an ; 2,6 % si anti-TPO négatifs.</li><li>Risque cardiovasculaire surtout au-dessus de 10 mU/L et avant 65–70 ans.</li><li>Cible de TSH sous traitement : 0,4 à 2,5 mU/L ; contrôle à deux mois puis annuel.</li></ul></template>
<template data-pop="pareto-e02-particulier" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="e02-11"></p><ul><li>Grossesse : intervalle propre ; poursuivre la lévothyroxine, dose à ajuster.</li><li>Nourrisson : préparations enrichies ; diversification et lait de vache tardif peuvent réduire l’apport.</li><li>Sujet âgé : attentisme au-delà de 80–85 ans si TSH de 10 mU/L ou moins.</li></ul></template>
<template data-pop="pareto-e02-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e02-e-1,e02-e-2,e02-e-3,e02-e-4,e02-e-5,e02-e-6"></p><ul><li>Confirmation par TSH et T4 libre répétées ; pas de test individuel de la carence.</li><li>Iodurie, thyroglobuline et TSH néonatale décrivent des populations.</li><li>Heure, biotine, surrénale et iode récent sont les pièges.</li></ul></template>
<template data-pop="pareto-e02-sphys" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e02-s-phys-cours"></p><ul><li>La boucle protège la T4 au prix de la TSH.</li><li>La relation apport–fonction est en U autour de 150 µg/j.</li><li>Le nouveau-né réagit vite : sa TSH est un indicateur de population.</li></ul></template>
<template data-pop="pareto-e02-sbioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e02-s-bioch-cours"></p><ul><li>L’iode est indispensable à la T4 et à la T3.</li><li>Séquence : Tg, puis TSH, puis T4.</li><li>La biotine fausse les immunodosages.</li></ul></template>
<template data-pop="pareto-e02-ssante" data-title="Pareto — Santé publique">
<p class="ratio" data-cover="e02-s-sante-cours"></p><ul><li>Sel iodé volontaire depuis 1922, 25 mg/kg depuis 2014.</li><li>Les transformés échappent souvent à l’iodation.</li><li>Médianes d’iodurie : 100 à 199 µg/L adéquat ; 150 à 249 µg/L en grossesse.</li></ul></template>
<template data-pop="pareto-e02-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e02-p-1,e02-p-2,e02-p-3,e02-p-4,e02-p-5"></p><ul><li>Substrat si l’apport manque ; hormone si TSH supérieure à 10 mU/L ou T4 libre basse.</li><li>Lévothyroxine : 25 à 50 µg/j au début, 25 µg/j si âgé ou cardiaque, à jeun, loin du calcium et du fer.</li><li>Pas de T3, pas de lévothyroxine pour maigrir, pas d’iodure de potassium 65 mg en supplément.</li></ul></template>
