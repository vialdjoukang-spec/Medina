<template data-pop="e02-levo" data-title="Euthyrox : FI suisse exacte et application à l’HIC"><div class="lab">Produit et source</div><p>Lévothyroxine sodique, Merck, autorisation Swissmedic 54949 ; GTIN de la présentation consultée 7680549490017. FI de février 2023, relue le 2 novembre 2026 via AmiKo. Comprimés sécables de 25 à 200 µg. L’autorisation de substitution de l’hypothyroïdie de toute origine ne signifie pas que toute <button class="w" data-k="e02-hic">HIC</button> légère nécessite un traitement.</p><div class="lab">Dose et prise</div><p>FI, hypothyroïdie adulte : initialement 25–50 µg/j, puis ajustements de 25–50 µg à intervalles de 2–4 semaines ; entretien 100–200 µg/j. Cette fourchette générale n’est pas une cible automatique d’<button class="w" data-k="e02-hic">HIC</button>. L’<button class="w" data-k="e02-s-eta">ETA</button> décrit souvent 50–100 µg/j pour normaliser la <button class="w" data-k="e02-tsh">TSH</button> ; la <button class="w" data-k="e02-s-has">HAS</button> propose une initiation prudente de 25–50 µg/j et contrôle à 6–8 semaines. Chez la personne âgée, en hypothyroïdie ancienne/sévère ou cardiopathie, la FI propose 25 µg et une augmentation plus lente, sous contrôle ; les contre-indications cardiaques restent à respecter.</p><p>Prendre la dose quotidienne le matin à jeun, avec un peu de liquide, au moins une demi-heure avant le petit-déjeuner. Chez l’enfant, la FI donne des doses liées à l’âge, détaillées dans Pharmacologie ; elles concernent la substitution, pas le traitement automatique d’une élévation légère. Les recommandations néonatales harmonisées éventuellement affichées après la FI sont une source distincte, pas sa posologie.</p><div class="lab">Contre-indications et précautions</div><p>Insuffisance cardiaque avec tachycardie, pancardite ou myocardite aiguë, infarctus aigu, angor, troubles hypophysaires ou surrénaliens non traités, hyperthyroïdie et hypersensibilité figurent dans la FI. Les glucocorticoïdes précèdent lévothyroxine en cas de déficit surrénalien. Si autonomie suspectée, bilan spécialisé avant traitement ; aucun test de suppression n’est imposé à toute <button class="w" data-k="e02-hic">HIC</button>, et les tests radioactifs sont proscrits en grossesse. L’association à un antithyroïdien pendant la grossesse est contre-indiquée.</p><div class="lab">Interactions</div><p>FI : prendre lévothyroxine au moins deux heures avant fer, calcium ou aluminium et 4–5 heures avant résines. <button class="w" data-k="e02-s-eta">ETA</button> 2013 propose quatre heures pour certains produits interférents. Les IPP peuvent diminuer l’absorption par le pH gastrique : les espacer ne garantit pas la correction, d’où surveillance clinique et biologique lors de leur introduction ou arrêt. Soja, orlistat et sévélamer demandent aussi une vigilance. Inducteurs enzymatiques, œstrogènes, sertraline et certains inhibiteurs de tyrosine kinase peuvent modifier les besoins ; anticoagulants coumariniques nécessitent des contrôles de coagulation, et antidiabétiques une surveillance glycémique.</p><div class="lab">Effets indésirables</div><p>Fréquences non déterminables dans la FI : hypersensibilité et angiœdème ; perte de poids ; symptômes psychotiques ; tremblements, insomnie, agitation, céphalées et convulsions ; tachycardie, arythmies dont fibrillation auriculaire, angor ou décompensation d’une insuffisance cardiaque ; diarrhée et transpiration excessive. Une dose excessive ou augmentée trop vite peut provoquer des signes d’hyperthyroïdie. La FI prévoit réduction ou interruption temporaire sous contrôle, puis reprise prudente. Une utilisation abusive peut diminuer la densité osseuse et exposer à des effets graves : jamais de lévothyroxine pour maigrir.</p><div class="lab">Grossesse et suivi</div><p>Suivi spécialisé, poursuite sans interruption pendant grossesse et allaitement ; augmentation parfois nécessaire. FI : retour immédiat à la dose préconceptionnelle après accouchement, <button class="w" data-k="e02-tsh">TSH</button> à 6–8 semaines. Les calendriers <button class="w" data-k="e02-s-has">HAS</button>/<button class="w" data-k="e02-s-rcog">RCOG</button> sont comparés dans la clinique. Une <button class="w" data-k="e02-tsh">TSH</button> stable s’interprète avec âge et contexte ; une cible basse <button class="w" data-k="e02-s-eta">ETA</button> ne s’impose pas à tous. La décision d’arrêter un essai symptomatique sans bénéfice se prend après réévaluation.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680549490017" target="_blank" rel="noopener">FI Euthyrox, toutes rubriques cliniques utilisées</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025</a>.</p></template>
<template data-pop="e02-supplement" data-title="Complément prénatal : vérifier l’iode et le total"><div class="lab">Produit exact</div><p>La FI suisse Elevit Pronatal, Bayer, novembre 2025, a été relue le 2 novembre 2026. La liste des vitamines, minéraux et oligo-éléments par comprimé ne contient pas d’iode. Cette constatation concerne ce produit exact, pas tous les produits de la marque ni toutes les formulations internationales. Le code 45604 est le numéro d’autorisation ; 7680456040039 est un GTIN.</p><div class="lab">Conseil suisse et comparaison européenne</div><p>L’<button class="w" data-k="e02-s-osav">OSAV</button> recommande aux femmes enceintes ou allaitantes qui prennent un complément de veiller à ce qu’il contienne de l’iode. Le <button class="w" data-k="e02-s-rcog">RCOG</button> 2025 propose un apport total de 200–250 µg/j et de considérer un complément de 150 µg/j d’iode, idéalement dès trois mois avant conception, en tenant compte des apports. Ce chiffre européen n’est pas la posologie Swissmedic d’un produit nutritionnel non identifié. Un besoin total n’est pas une dose à ajouter automatiquement à l’alimentation.</p><div class="lab">Bénéfice et limites</div><p>L’enquête suisse observe une association entre supplément iodé, moindre thyroglobuline et moindre fréquence estimée d’apports inadéquats, sans différence significative de <button class="w" data-k="e02-tsh">TSH</button> ou <button class="w" data-k="e02-t4">T4</button> totale. Elle ne prouve pas qu’un complément guérit toute <button class="w" data-k="e02-hic">HIC</button>. Le chiffre de 61 % de produits contenant au moins 150 µg provient du marché décrit par l’étude, pas d’un inventaire de 2026.</p><div class="lab">Éviter l’excès</div><p>Ne pas cumuler sans calcul plusieurs compléments ou des algues riches en iode. Le <button class="w" data-k="e02-s-rcog">RCOG</button> déconseille les apports chroniques supérieurs à 500 µg/j pendant la grossesse ; la limite <button class="w" data-k="e02-s-efsa">EFSA</button> de 600 citée dans l’étude suisse ne constitue pas une garantie de sécurité individuelle. Une maladie thyroïdienne concomitante nécessite un conseil adapté. Les comprimés nucléaires d’iodure de potassium 65 mg ne sont jamais une alternative nutritionnelle.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680456040039" target="_blank" rel="noopener">FI Elevit Pronatal, composition</a> ; <a href="https://www.blv.admin.ch/fr/sel-iode" target="_blank" rel="noopener">OSAV, conseil alimentaire</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer, méthodes et discussion</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025, iode</a>.</p></template>
<template data-pop="e02-ki65" data-title="KI axapharm 65 mg : distinguer radioprotection et nutrition"><div class="lab">Produit exact</div><p>Un comprimé quadrisécable contient 65 mg d’iodure de potassium, correspondant à 50 mg d’iode. FI suisse de septembre 2013, relue le 2 novembre 2026 ; autorisation 67017. L’indication est le blocage de l’incorporation d’iode radioactif lors d’un accident nucléaire, exclusivement sur ordre des autorités.</p><div class="lab">Pourquoi ce n’est pas un supplément</div><p>50 mg d’iode correspondent à 50 000 µg : la quantité d’un comprimé ne correspond pas à l’échelle d’un besoin nutritionnel quotidien. La FI prévoit, dans son contexte radiologique, des doses par âge et une durée commandée par l’événement ; aucun de ces schémas n’est proposé pour E02. Une femme allaitante ne protège pas son nourrisson uniquement par le passage dans le lait ; les instructions radiologiques propres doivent être suivies.</p><div class="lab">Risques pertinents</div><p>Une forte exposition peut provoquer une hyperthyroïdie chez un sujet prédisposé et une hypothyroïdie chez le nouveau-né ou le fœtus. La FI décrit notamment troubles digestifs, réactions cutanées/muqueuses et, rarement, réactions d’hypersensibilité ; lithium et diurétiques d’épargne potassique demandent une vigilance spécifique. Ces risques expliquent l’exclusion de l’usage nutritionnel ; le cours ne reproduit pas un protocole de gestion d’accident.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680670170017" target="_blank" rel="noopener">FI iodure de potassium axapharm, composition, indication et sécurité</a>.</p></template>
<template data-pop="e02-s-eta" data-title="Recommandations européennes : champ et actualisation"><div class="lab"><button class="w" data-k="e02-s-eta">ETA</button> 2013</div><p>Diagnostic, causes, symptômes, recommandations 1–26 et suivi de l’<button class="w" data-k="e02-hic">HIC</button> adulte non enceinte ont été consultés. Le texte précède TRUST et la méta-analyse de 2018 : son traitement de routine n’est pas interprété sans les données ultérieures et l’<button class="w" data-k="e02-ofsp">évaluation des technologies de la santé</button> suisse.</p><div class="lab"><button class="w" data-k="e02-s-eta">ETA</button> 2014</div><p>La section pédiatrique complète utile a été lue : normes par âge, histoire naturelle, limites des études et recommandations 24–30. La grossesse est actualisée avec <button class="w" data-k="e02-s-has">HAS</button> 2022 et <button class="w" data-k="e02-s-rcog">RCOG</button> 2025, sans reprendre les anciens seuils trimestriels de 2,5/3 comme norme universelle.</p><div class="lab">Arbitrages</div><p>La correction <button class="w" data-k="e02-s-rcog">RCOG</button> publiée en mai 2026 concerne le calendrier Doppler fœtal et le sigle du carbimazole, pas l’<button class="w" data-k="e02-hic">HIC</button>. <button class="w" data-k="e02-s-has">HAS</button> et <button class="w" data-k="e02-s-rcog">RCOG</button> divergent notamment sur les anticorps, les examens de suivi et certaines décisions légères ; ces différences restent visibles. Une FI produit n’est pas remplacée par un guide général.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3923601/" target="_blank" rel="noopener">ETA 2013</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4109520/" target="_blank" rel="noopener">ETA 2014</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/10.1111/1471-0528.70259" target="_blank" rel="noopener">Correction 2026</a>.</p></template>
<template data-pop="e02-s-oms" data-title="OMS : CIM-10 et guide OMS, UNICEF, ICCIDD">
<div class="lab">CIM-10 (2019)</div><p>Libellé « Subclinical iodine-deficiency hypothyroidism » et notes d’exclusion de E01 et E03.</p>
<div class="lab">Guide 2007</div><p>« Assessment of iodine deficiency disorders and monitoring their elimination », troisième édition : apports recommandés, seuils d’iodurie, rôle de la thyroglobuline et de la <button class="w" data-k="e02-tsh">TSH</button> néonatale, doses de supplémentation.</p>
<div class="lab">Limites</div><p>Guide de santé publique dont les seuils concernent des populations, non des individus ; chapitres 2.1 et 4.4, tableaux 1, 2, 4, 5 et 9 lus.</p>
<p class="src">Références : <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=E02" target="_blank" rel="noopener">OMS, CIM-10 version 2019, E02, E01.8 et E03</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/82b512a6-57b8-45f3-8539-30b2f7f63564/content" target="_blank" rel="noopener">OMS, UNICEF, ICCIDD, évaluation des troubles dus à la carence en iode, 3e éd. 2007</a>.</p></template>
<template data-pop="e02-s-osav" data-title="OSAV : sel iodé et apport en Suisse">
<div class="lab">Contenu</div><p>La page de l’Office fédéral de la sécurité alimentaire et des affaires vétérinaires précise les groupes à risque, les sources d’iode (sel iodé 51 %, produits laitiers 26 %, poissons et fruits de mer 9 %), les recommandations alimentaires et la consigne sur les suppléments prénatals.</p>
<div class="lab">Limites</div><p>Page sans date, avec publications liées de 02 à 09.2026. Les valeurs d’apport recommandées figurent en image et n’ont pas été lues ; seules les valeurs OMS et <button class="w" data-k="e02-s-efsa">EFSA</button> sont retenues.</p>
<p class="src">Références : <a href="https://www.blv.admin.ch/de/jodiertes-salz" target="_blank" rel="noopener">OSAV, page sur le sel iodé</a>.</p></template>
<template data-pop="e02-s-efsa" data-title="EFSA 2014 : valeurs de référence pour l’iode">
<div class="lab">Contenu</div><p>Avis scientifique du panel NDA : apport adéquat de 150 µg/j chez l’adulte, 200 µg/j pendant la grossesse et l’allaitement, 70 à 130 µg/j chez l’enfant de 7 mois et plus.</p>
<div class="lab">Limites</div><p>Résumé seul lu ; la limite supérieure de 600 µg/j chez la femme enceinte est citée par l’étude suisse.</p>
<p class="src">Références : <a href="https://doi.org/10.2903/j.efsa.2014.3660" target="_blank" rel="noopener">EFSA 2014, valeurs de référence alimentaires pour l’iode (résumé seul lu)</a> ; <a href="https://doi.org/10.1007/s00394-023-03287-6" target="_blank" rel="noopener">Fischer et al., apport en iode en Suisse, Eur J Nutr 2024</a>.</p></template>
<template data-pop="pareto-e02-definition" data-title="Pareto — Définition"><p class="ratio" data-cover="e02-0,e02-1"></p><ul><li><button class="w" data-k="e02-hic">HIC</button> : <button class="w" data-k="e02-tsh">TSH</button> élevée persistante, <button class="w" data-k="e02-t4">T4</button> libre normale ; normes adaptées.</li><li>E02 exige une attribution iodée, sans critère obligatoire d’anticorps négatifs.</li><li><button class="w" data-k="e02-t4">T4</button> basse modifie le diagnostic biologique, pas automatiquement le code.</li></ul></template>
<template data-pop="pareto-e02-epidemio" data-title="Pareto — Fréquence et situation suisse">
<p class="ratio" data-cover="e02-2"></p><ul><li>Prévalence de l’<button class="w" data-k="e02-hic">HIC</button> de 4 à 10 %, plus fréquente dans les régions iodées.</li><li>Écoliers suisses suffisants (127 µg/L), femmes enceintes insuffisantes (97 µg/L).</li><li>Une seule <button class="w" data-k="e02-hic">HIC</button> (0,2 %) dans l’étude suisse ; aucune corrélation iodurie–<button class="w" data-k="e02-tsh">TSH</button>.</li></ul></template>
<template data-pop="pareto-e02-physio" data-title="Pareto — Physiopathologie"><p class="ratio" data-cover="e02-3"></p><ul><li>La carence peut entraîner une adaptation ; une carence légère laisse souvent <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> normales.</li><li>Tg, captation et volume peuvent varier sans séquence individuelle obligatoire.</li><li>Le mécanisme nutritionnel doit être distingué de l’auto-immunité, parfois associée.</li></ul></template>
<template data-pop="pareto-e02-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="e02-4"></p><ul><li>Pas de sel iodé, végétalisme sans aliments enrichis, peu de lait, produits transformés sans iode.</li><li>Grossesse et allaitement augmentent les besoins.</li><li>Un supplément prénatal peut ne pas contenir d’iode : lire la composition.</li></ul></template>
<template data-pop="pareto-e02-anamnese" data-title="Pareto — Anamnèse">
<p class="ratio" data-cover="e02-5"></p><ul><li>Chercher l’apport, la grossesse et le contenu du supplément.</li><li>Éliminer causes transitoires, médicaments, surrénale et exposition à l’iode.</li><li>L’<button class="w" data-k="e02-hic">HIC</button> donne peu de symptômes ; la biotine fausse les dosages.</li></ul></template>
<template data-pop="pareto-e02-examen" data-title="Pareto — Examen clinique">
<p class="ratio" data-cover="e02-6"></p><ul><li>L’examen est pauvre ; la découverte est biologique.</li><li>Rechercher un goitre, argument pour discuter un traitement.</li><li>Pas de lévothyroxine pour maigrir.</li></ul></template>
<template data-pop="pareto-e02-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="e02-7"></p><ul><li>Confirmer selon la population : délai ordinaire hors grossesse, calendrier spécifique sinon.</li><li><button class="w" data-k="e02-antitpo">Anti-TPO</button> et apports explorent des causes différentes ; leur combinaison ne constitue pas un score validé.</li><li>L’iodurie ponctuelle ne diagnostique pas une carence individuelle.</li></ul></template>
<template data-pop="pareto-e02-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="e02-8"></p><ul><li>Aucune urgence propre à E02 dans les sources.</li><li>La grossesse est la situation prioritaire.</li><li>Surrénale non traitée : substituer les glucocorticoïdes avant la lévothyroxine.</li></ul></template>
<template data-pop="pareto-e02-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="e02-9"></p><ul><li>Corriger l’apport en iode avant la conception : sel iodé, produits laitiers, supplément iodé.</li><li>Lévothyroxine si <button class="w" data-k="e02-tsh">TSH</button> supérieure à 10 mU/L avant 65–70 ans ; essai limité si symptômes.</li><li>Aucun essai comparatif propre à E02 n’a été retrouvé ; TRUST et la méta-analyse concernent l’hypothyroïdie infraclinique générale, avec leurs critères de sélection.</li></ul></template>
<template data-pop="pareto-e02-suivi" data-title="Pareto — Suivi"><p class="ratio" data-cover="e02-10"></p><ul><li>Les taux de progression de l’<button class="w" data-k="e02-hic">HIC</button> générale ne sont pas ceux de E02.</li><li>Surveillance adaptée à la <button class="w" data-k="e02-tsh">TSH</button>, aux causes, à l’âge et au traitement.</li><li>Une <button class="w" data-k="e02-tsh">TSH</button> abaissée ne prouve pas un bénéfice symptomatique ; éviter le surtraitement.</li></ul></template>
<template data-pop="pareto-e02-particulier" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="e02-11"></p><ul><li>Grossesse : intervalle propre ; poursuivre la lévothyroxine, dose à ajuster.</li><li>Nourrisson : préparations enrichies ; diversification et lait de vache tardif peuvent réduire l’apport.</li><li>Sujet âgé : attentisme au-delà de 80–85 ans si <button class="w" data-k="e02-tsh">TSH</button> de 10 mU/L ou moins.</li></ul></template>
<template data-pop="pareto-e02-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e02-e-1,e02-e-2,e02-e-3,e02-e-4,e02-e-5,e02-e-6"></p><ul><li>Confirmation par <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> libre répétées ; pas de test individuel de la carence.</li><li>Iodurie, thyroglobuline et <button class="w" data-k="e02-tsh">TSH</button> néonatale décrivent des populations.</li><li>Heure, biotine, surrénale et iode récent sont les pièges.</li></ul></template>
<template data-pop="pareto-e02-sphys" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e02-s-phys-cours"></p><ul><li>Le rétrocontrôle peut maintenir la <button class="w" data-k="e02-t4">T4</button> normale avec une <button class="w" data-k="e02-tsh">TSH</button> élevée.</li><li>Carence et excès peuvent perturber la fonction ; aucun optimum individuel universel n’est dessiné.</li><li>La <button class="w" data-k="e02-tsh">TSH</button> néonatale de population n’est pas un test individuel de nutrition.</li></ul></template>
<template data-pop="pareto-e02-sbioch" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e02-s-bioch-cours"></p><ul><li>Iode et thyroglobuline participent à la synthèse hormonale.</li><li>Tg, <button class="w" data-k="e02-tsh">TSH</button> et <button class="w" data-k="e02-t4">T4</button> répondent à des questions différentes, sans séquence obligatoire.</li><li>Absorption, protéines porteuses et interférences conditionnent la lecture.</li></ul></template>
<template data-pop="pareto-e02-ssante" data-title="Pareto — Santé publique">
<p class="ratio" data-cover="e02-s-sante-cours"></p><ul><li>Sel iodé volontaire depuis 1922, 25 mg/kg depuis 2014.</li><li>Les transformés échappent souvent à l’iodation.</li><li>Médianes d’iodurie : 100 à 199 µg/L adéquat ; 150 à 249 µg/L en grossesse.</li></ul></template>
<template data-pop="pareto-e02-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e02-p-1,e02-p-2,e02-p-3,e02-p-4,e02-p-5"></p><ul><li>Ne pas opposer correction iodée et lévothyroxine indiquée.</li><li>FI Euthyrox : dose individualisée, interactions et contre-indications précises.</li><li>Pas de lévothyroxine pour maigrir, ni d’iodure de potassium 65 mg comme complément nutritionnel.</li></ul></template>
<template data-pop="pareto-e02-semio" data-title="Pareto — Sémiologie"><p class="ratio" data-cover="e02-s-semio-intro,e02-semio-normal,e02-semio-signs,e02-semio-mechanisms,e02-semio-examination,e02-semio-interpretation,e02-semio-differentials,e02-semio-urgency,e02-semio-limits,e02-semio-sources"></p><ul><li>Décrire la plainte et confirmer la biologie selon la population.</li><li>L’iodurie et les anticorps ne prouvent pas seuls une cause iodée.</li><li>Grossesse, nourrisson et surrénale changent le délai ou la sécurité.</li></ul></template><template data-pop="pareto-e02-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="e02-s-anat-cours"></p><ul><li>Taille, structure et fonction sont des dimensions distinctes.</li><li>Un goitre ne démontre pas la carence ; son absence ne réfute pas l’<button class="w" data-k="e02-hic">HIC</button>.</li><li>La figure originale montre la normalité, sans lésion E02 inventée.</li></ul></template><template data-pop="pareto-e02-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="e02-s-histo-cours"></p><ul><li>Le follicule organise synthèse et stockage dans la colloïde.</li><li>Il n’existe pas ici de signature histologique individuelle de E02.</li><li>Une biopsie n’est pas un test de confirmation de l’<button class="w" data-k="e02-hic">HIC</button> isolée.</li></ul></template>
<template data-pop="e02-s-has" data-title="HAS : recommandations françaises 2022"><p>Haute Autorité de santé. La recommandation sur les hypothyroïdies de l’adulte précise le diagnostic, les choix dans les formes infracliniques, la personne âgée, la grossesse et l’infertilité. Les recommandations utilisées sont des accords d’experts ; elles complètent le contexte suisse sans remplacer la FI du produit prescrit.</p><p>La HAS propose une confirmation adaptée, un traitement des TSH persistantes supérieures à 10 chez l’adulte de moins de 65 ans, et une décision contextualisée entre 4 et 10. En grossesse, ses décisions et examens de suivi diffèrent de certains points du RCOG : le tableau clinique conserve ces différences.</p><p class="src"><a href="https://www.has-sante.fr/upload/docs/application/pdf/2023-03/recommandation_prise_en_charge_des_hypothyroidies_chez_ladulte_mel.pdf" target="_blank" rel="noopener">HAS 2022, recommandations, fichier 2023</a>.</p></template>
<template data-pop="e02-s-rcog" data-title="RCOG : Green-top Guideline 76, 2025"><p>Royal College of Obstetricians and Gynaecologists, collège britannique de gynécologie-obstétrique. Le texte 2025 traite les troubles thyroïdiens avant, pendant et après la grossesse, avec références adaptées au trimestre et à la méthode. Il ne se substitue pas à une FI suisse.</p><p>L’hypothyroïdie manifeste et l’<button class="w" data-k="e02-hic">HIC</button> sévère gravidique demandent un traitement rapide ; les formes légères se discutent, particulièrement au premier trimestre. L’iode total et la composition des compléments sont évalués ; une iodurie isolée ou de 24 heures ne détermine pas le statut individuel. La correction publiée le 8 mai 2026 a été lue : elle porte sur le début de la surveillance Doppler fœtale et le sigle du carbimazole, pas sur ces recommandations d’<button class="w" data-k="e02-hic">HIC</button>.</p><p class="src"><a href="https://obgyn.onlinelibrary.wiley.com/doi/full/10.1111/1471-0528.18088" target="_blank" rel="noopener">RCOG 2025</a> ; <a href="https://obgyn.onlinelibrary.wiley.com/doi/10.1111/1471-0528.70259" target="_blank" rel="noopener">correction 2026</a>.</p></template><template data-pop="pareto-e02-cles" data-title="Pareto — Points clés"><p class="ratio" data-cover="e02-13"></p><ul><li>Nommer correctement le profil et ses limites.</li><li>Argumenter la cause sans test individuel de carence inventé.</li><li>Définir apports, traitement éventuel et date de réévaluation avec le patient.</li></ul></template><template data-pop="pareto-e02-pieges" data-title="Pareto — Pièges"><p class="ratio" data-cover="e02-14"></p><ul><li>Ne pas confondre seuil diagnostique, cible thérapeutique et médiane de population.</li><li>Ne pas appliquer le calendrier adulte ordinaire à la grossesse.</li><li>Ne pas déduire le bénéfice clinique de la seule normalisation biologique.</li></ul></template>
