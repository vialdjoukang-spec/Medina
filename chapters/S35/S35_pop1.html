<!-- ===== FENÊTRES S35 : notions, gradation, mécanismes ===== -->
<template data-pop="s35-gradation" data-title="Gradation ESVS 2025 des lésions artérielles">
<div class="lab">Définition</div><p>L’ESVS 2025 classe toute lésion artérielle traumatique en quatre grades : 1, atteinte partielle de la paroi avec contour externe normal ; 2, atteinte complète avec contour externe anormal et saignement contenu ; 3, atteinte complète avec hémorragie non contenue ; X, occlusion.</p>
<div class="lab">Raison</div><p>Les grades 1 à 3 suivent le risque d’hémorragie, parce que la paroi est de plus en plus détruite. Le grade X suit un autre risque, l’ischémie de l’organe, puisque le sang ne passe plus. La gradation relie donc directement l’image de l’angioscanner au délai et au type de geste.</p>
<div class="lab">Conséquence pratique</div><p>Le grade 1 se surveille, le grade 2 se répare en urgence, souvent par voie endovasculaire, le grade 3 se répare en extrême urgence, souvent par chirurgie, et le grade X se revascularise si l’organe est récupérable.</p>
</template>
<template data-pop="s35-faux-anevrisme" data-title="Faux anévrisme traumatique">
<div class="lab">Définition</div><p>Le faux anévrisme est une poche de sang circulant contenue par les tissus voisins ou par l’adventice seule, après une rupture complète de la paroi artérielle ; c’est une lésion de grade 2.</p>
<div class="lab">Mécanisme</div><p>Le sang sort de l’artère, mais les tissus voisins le retiennent ; la poche reste donc en communication avec la lumière et se remplit à chaque systole.</p>
<div class="lab">Conséquence pratique</div><p>La poche n’a pas de paroi artérielle et peut se rompre ; c’est pourquoi elle se répare en urgence, habituellement par endoprothèse, même chez un patient stable.</p>
</template>
<template data-pop="s35-fav" data-title="Fistule artérioveineuse traumatique">
<div class="lab">Définition</div><p>La fistule artérioveineuse traumatique est une communication anormale entre une artère et une veine voisines, lésées en même temps, par exemple par une lame ou un projectile.</p>
<div class="lab">Mécanisme</div><p>Le sang artériel passe directement dans la veine, à basse résistance. Par conséquent, le territoire en aval reçoit moins de sang, la veine se dilate, et un shunt important peut augmenter le débit cardiaque jusqu’à l’insuffisance cardiaque.</p>
<div class="lab">Signe clinique</div><p>Un souffle continu ou un frémissement palpable en regard de la plaie évoque la fistule ; elle se classe en grade 2 et se répare en urgence.</p>
</template>
<template data-pop="s35-codage" data-title="Catégorie S35 de la CIM-10-GM 2024">
<div class="lab">Sous-catégories</div><p>S35.0 code la lésion de l’aorte abdominale ; S35.1 celle de la veine cave inférieure ; S35.2 celle du tronc cœliaque ou d’une artère mésentérique ; S35.3 celle de la veine porte ou de la veine splénique ; S35.4 celle des vaisseaux du rein ; S35.5 celle des vaisseaux iliaques ; S35.7 les lésions de plusieurs vaisseaux. S35.80, S35.81 et S35.82 codent les lésions des vaisseaux épiduraux, sous-duraux et sous-arachnoïdiens de cette région, S35.88 les autres vaisseaux et S35.9 le vaisseau non précisé.</p>
<div class="lab">Règle</div><p>Le code précise le vaisseau ; il se combine avec les codes des lésions d’organes associées, par exemple du rein ou du bassin, parce qu’un même traumatisme lèse souvent plusieurs structures.</p>
</template>
<template data-pop="s35-ceinture" data-title="Lésion par ceinture de sécurité abdominale">
<div class="lab">Mécanisme</div><p>Lors d’une décélération brutale, la sangle abdominale comprime l’abdomen contre le rachis ; l’aorte, fixée en arrière, est alors écrasée ou étirée, ce qui peut déchirer l’intima (ESVS 2025).</p>
<div class="lab">Signe d’alerte</div><p>Une ecchymose transversale de la paroi abdominale, dite signe de la ceinture, doit faire rechercher une lésion de l’aorte, de l’intestin et du rachis lombaire.</p>
<div class="lab">Conséquence pratique</div><p>La lésion aortique est souvent de grade 1 ou de grade X ; elle se recherche donc à l’angioscanner chez le patient stable, même sans douleur.</p>
</template>
<template data-pop="s35-bassin" data-title="Fracture du bassin et saignement pelvien">
<div class="lab">Mécanisme</div><p>La fracture du bassin déchire les branches de l’artère iliaque interne (ESVS 2025, tableau 4) et surtout les plexus veineux présacrés, ainsi que l’os spongieux fracturé, qui saigne lui aussi.</p>
<figure><img src="images/cardiologie/s35_veines_bassin_gray.gif" alt="Planche anatomique réelle de Gray montrant les veines du bassin" width="480" height="511" loading="lazy" decoding="async"><figcaption>Veines du bassin : le réseau veineux pelvien est dense, ce qui explique l’abondance du saignement après fracture. Henry Vandyke Carter, Gray’s Anatomy (1918), domaine public.</figcaption></figure>
<div class="lab">Conséquence pratique</div><p>La stabilisation du bassin réduit le volume pelvien et rapproche les fragments, ce qui limite le saignement veineux et osseux ; le saignement artériel actif, lui, relève de l’embolisation (recommandation 71).</p>
</template>
<template data-pop="s35-coagulopathie" data-title="Coagulopathie traumatique">
<div class="lab">Définition</div><p>La coagulopathie traumatique est un trouble de l’hémostase qui apparaît tôt chez le blessé grave, avant même toute dilution par les solutés.</p>
<div class="lab">Mécanisme</div><p>Le choc et les lésions tissulaires activent la protéine C et la fibrinolyse, tandis que le saignement consomme les facteurs et le fibrinogène. De plus, l’hypothermie ralentit les enzymes de la coagulation et l’acidose diminue leur activité.</p>
<div class="lab">Conséquence pratique</div><p>Ce mécanisme justifie l’acide tranexamique précoce, la transfusion équilibrée et la limitation des cristalloïdes, qui diluent les facteurs restants.</p>
</template>
<template data-pop="s35-damage-control" data-title="Contrôle des dégâts">
<div class="lab">Définition</div><p>Le contrôle des dégâts associe une hypotension permissive, une réanimation hémostatique et une chirurgie écourtée, limitée à l’arrêt du saignement et de la contamination, suivie d’une réparation différée (ESVS 2025).</p>
<div class="lab">Raison</div><p>Le blessé en choc ne supporte pas une chirurgie longue, car l’acidose, l’hypothermie et la coagulopathie s’aggravent mutuellement pendant l’intervention. Il vaut donc mieux arrêter le saignement, réchauffer et corriger en réanimation, puis réparer définitivement.</p>
<div class="lab">Gestes typiques</div><p>La ligature d’une veine, la dérivation temporaire d’une artère par un tube, le tamponnement par champs et l’embolisation sont des gestes de contrôle des dégâts.</p>
</template>
<template data-pop="s35-cabcde" data-title="Séquence C-ABCDE">
<div class="lab">Définition</div><p>La séquence C-ABCDE ajoute, en tête de l’examen primaire classique, la lettre C pour le contrôle de l’hémorragie catastrophique, avant les voies aériennes, la respiration, la circulation, l’état neurologique et l’exposition (ESVS 2025).</p>
<div class="lab">Raison</div><p>Un blessé qui exsangue meurt en quelques minutes, plus vite qu’un blessé dont les voies aériennes sont menacées ; la compression d’une hémorragie externe passe donc en premier.</p>
</template>
