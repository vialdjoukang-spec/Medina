<section class="ilot" id="s35-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une motocycliste de 32 ans est éjectée à grande vitesse ; elle arrive avec une pression de 75/40 mmHg, un pouls à 135 par minute et un bassin instable à l’examen. Or, aucun saignement n’est visible, car le sang se perd dans l’abdomen et derrière le péritoine. La question qui structure ce cours est donc la suivante : <b>devant un choc après un traumatisme du tronc, comment décider en quelques minutes entre le bloc opératoire, l’embolisation et l’angioscanner, et que faire de chaque vaisseau lésé ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, il fait comprendre la <button class="w" data-k="s35-gradation">gradation ESVS des lésions artérielles</button>, qui relie l’aspect de la paroi au délai de réparation. Ensuite, il montre que l’état hémodynamique décide avant l’anatomie : le patient instable va au bloc, le patient stable passe à l’<button class="w" data-k="s35-angioscanner">angioscanner</button> (ESVS 2025, recommandations 9 et 10). Enfin, il donne pour chaque vaisseau, de l’aorte aux veines iliaques, le geste recommandé et sa raison.</p>
<p>Ce cours se distingue d’ailleurs d’un manuel figé. En effet, chaque décision renvoie, par un mot vert, à la recommandation qui la fonde et au mécanisme qui la justifie ; de plus, les cas de l’onglet Examens obligent à trancher comme au déchocage. Ainsi, le lecteur apprend un raisonnement, et non une liste.</p>
</section>
<section class="ilot" id="s35-1"><h2><span class="n">1</span>Définitions, gradation et codage</h2>
<p>La lésion vasculaire abdominale est une atteinte traumatique d’une artère ou d’une veine située dans l’abdomen, la région lombaire ou le bassin, depuis l’aorte et la veine cave inférieure jusqu’aux vaisseaux iliaques. Or, une même artère peut être lésée de façons très différentes ; c’est pourquoi l’ESVS 2025 propose une gradation unique, qui sert de fil conducteur à toutes les décisions.</p>
<table class="t"><tr><th>Grade ESVS</th><th>Lésion de la paroi</th><th>Exemples</th><th>Conduite générale</th></tr>
<tr><td>1</td><td>Atteinte partielle, contour externe normal</td><td>Lambeau intimal, hématome intramural</td><td>Surveillance, avec ou sans antithrombotique</td></tr>
<tr><td>2</td><td>Atteinte complète, contour externe anormal, saignement contenu</td><td><button class="w" data-k="s35-faux-anevrisme">Faux anévrisme</button>, <button class="w" data-k="s35-fav">fistule artérioveineuse</button></td><td>Réparation urgente, souvent endovasculaire</td></tr>
<tr><td>3</td><td>Atteinte complète, hémorragie non contenue</td><td>Section artérielle, plaie pénétrante</td><td>Réparation en extrême urgence, souvent chirurgicale</td></tr>
<tr><td>X</td><td>Occlusion</td><td>Lésion par étirement, section thrombosée</td><td>Intervention urgente si l’organe ischémique est récupérable</td></tr></table>
<p>Ce tableau se lit donc de la paroi la moins atteinte à la plus détruite, puis vers l’occlusion, qui forme une catégorie à part ; en effet, le danger de l’occlusion est l’ischémie de l’organe, et non l’hémorragie. De plus, la <button class="w" data-k="s35-codage">catégorie S35 de la CIM-10-GM 2024</button> code le vaisseau atteint : S35.0 pour l’aorte abdominale, S35.1 pour la veine cave inférieure, S35.2 pour le tronc cœliaque et les artères mésentériques, S35.3 pour la veine porte et la veine splénique, S35.4 pour les vaisseaux du rein, S35.5 pour les vaisseaux iliaques, S35.7 pour les lésions multiples, puis S35.80 à S35.88 et S35.9 pour les autres vaisseaux et les lésions sans précision.</p>
</section>
<section class="ilot" id="s35-2"><h2><span class="n">2</span>Épidémiologie et mécanismes</h2>
<p>Les lésions vasculaires représentent environ 2 à 5 % des admissions pour traumatisme ; dans un grand centre européen, elles étaient présentes chez 4,4 % des admis (ESVS 2025). Parmi elles, l’abdomen représente environ un quart des localisations dans les grands registres civils. Ces chiffres sont européens et nord-américains ; en revanche, aucune donnée suisse propre n’est citée par l’ESVS, ce qui constitue une lacune à nommer.</p>
<p>Le mécanisme oriente ensuite la lésion. Ainsi, le couteau ou la balle sectionnent directement le vaisseau, alors que le traumatisme fermé l’étire ou le comprime, ce qui déchire l’intima et provoque une thrombose. De même, une <button class="w" data-k="s35-ceinture">ceinture de sécurité abdominale</button> peut léser directement l’aorte, et une <button class="w" data-k="s35-bassin">fracture du bassin</button> déchire les branches de l’artère iliaque interne et les plexus veineux pelviens. C’est pourquoi le traumatisme fermé produit plus souvent des lésions des grades 1 et X, et le traumatisme pénétrant des grades 2 et 3.</p>
<button class="pareto-btn ui" data-k="pareto-s35-notions">▲ Loi de Pareto — Notions et mécanismes</button>
</section>
<section class="ilot" id="s35-3"><h2><span class="n">3</span>Physiopathologie du choc hémorragique</h2>
<p>Normalement, le débit cardiaque dépend du retour veineux ; or, une hémorragie diminue le volume circulant, donc le remplissage du cœur et le débit. L’organisme compense d’abord par une tachycardie et une vasoconstriction, qui maintiennent la pression artérielle aux dépens de la peau, du rein et de l’intestin ; c’est pourquoi une pression normale ne garantit pas que le saignement est modéré.</p>
<p>Lorsque la perte dépasse ces mécanismes, la pression chute et l’hypoperfusion entraîne une acidose lactique. De plus, la <button class="w" data-k="s35-coagulopathie">coagulopathie traumatique</button> apparaît tôt, par consommation des facteurs et par activation de la fibrinolyse ; elle s’aggrave avec l’hypothermie et l’acidose. Par conséquent, le blessé entre dans un cercle où le saignement entretient la coagulopathie, qui entretient le saignement ; c’est la raison de la <button class="w" data-k="s35-damage-control">réanimation de contrôle des dégâts</button>.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Le saignement abdominal ne se voit pas ; il se lit dans la tachycardie, la vasoconstriction cutanée et le lactate. Ainsi, un blessé du tronc tachycarde doit être considéré comme hémorragique tant que la source n’est pas trouvée, car la chute tensionnelle est un signe tardif.</div>
</section>
