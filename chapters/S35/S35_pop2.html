<!-- ===== FENÊTRES S35 : examens, gestes et Pareto ===== -->
<template data-pop="s35-fast" data-title="FAST dans le traumatisme abdominal">
<div class="lab">Définition</div><p>La FAST recherche du liquide dans l’espace hépatorénal, l’espace splénorénal, le pelvis et le péricarde, au lit du blessé.</p>
<div class="lab">Performance (ESVS 2025)</div><p>Elle est utile chez le blessé instable, parce qu’elle se répète sans retarder la réanimation. Cependant, pour les lésions vasculaires abdominales, sa sensibilité tombe à 41 % dans le traumatisme fermé sans choc, et sa spécificité à 18 % dans les plaies par balle ; de plus, le taux de lésions manquées approche 10 %.</p>
<div class="lab">Conséquence pratique</div><p>Une FAST positive chez un blessé instable conduit à la laparotomie ; une FAST négative n’exclut pas une lésion rétropéritonéale.</p>
</template>
<template data-pop="s35-angioscanner" data-title="Angioscanner du traumatisé">
<div class="lab">Indication</div><p>L’angioscanner avec temps artériel et veineux est l’examen de première ligne chez le blessé sans signe de saignement actif (ESVS 2025, recommandation 10).</p>
<div class="lab">Raison</div><p>Sa sensibilité et sa spécificité approchent 100 % pour les lésions vasculaires significatives, et il montre en même temps les organes et les os. Le temps veineux est nécessaire, car une lésion veineuse peut être invisible au temps artériel.</p>
<div class="lab">Piège</div><p>Il peut montrer des lésions minimes sans conséquence ; c’est pourquoi ses résultats s’interprètent toujours avec l’état clinique du patient.</p>
</template>
<template data-pop="s35-extravasation" data-title="Extravasation de contraste">
<div class="lab">Définition</div><p>L’extravasation est une flaque de produit de contraste qui sort du vaisseau et grossit entre le temps artériel et le temps tardif.</p>
<div class="lab">Signification</div><p>Elle prouve un saignement actif au moment de l’examen ; elle correspond donc à une lésion de grade 3 ou à une branche qui saigne, et elle impose un geste d’hémostase.</p>
</template>
<template data-pop="s35-angiographie" data-title="Angiographie par soustraction numérique">
<div class="lab">Définition</div><p>L’angiographie injecte le contraste directement dans l’artère par un cathéter, puis soustrait numériquement l’image des os pour ne garder que les vaisseaux.</p>
<div class="lab">Place actuelle</div><p>Elle a été remplacée par l’angioscanner pour le diagnostic, car elle est invasive et plus longue. En revanche, elle reste indispensable comme temps thérapeutique, pour l’embolisation ou l’endoprothèse, et en cas de doute dû à des artefacts métalliques (ESVS 2025).</p>
</template>
<template data-pop="s35-embolisation" data-title="Embolisation">
<div class="lab">Définition</div><p>L’embolisation est l’occlusion volontaire d’une artère qui saigne par un matériel déposé par cathéter, comme des spires métalliques, des particules ou une colle.</p>
<div class="lab">Indication (ESVS 2025)</div><p>Elle est recommandée en cas de fracture du bassin avec saignement actif ou extravasation de l’artère iliaque interne ou de ses branches (recommandation 71).</p>
<div class="lab">Condition de sécurité</div><p>Le territoire en aval doit recevoir une suppléance collatérale ; c’est le cas des branches iliaques internes, mais non des troncs qui irriguent seuls un organe ou un membre.</p>
</template>
<template data-pop="s35-hematome-rp" data-title="Hématome rétropéritonéal traumatique">
<div class="lab">Définition</div><p>L’hématome rétropéritonéal est une collection de sang dans l’espace situé derrière le péritoine, qui contient l’aorte, la veine cave, les reins et les vaisseaux iliaques.</p>
<div class="lab">Règle de décision (ESVS 2025)</div><p>À la laparotomie, il est exploré si le patient est instable ou si l’hématome est expansif, pulsatile ou saigne activement (recommandation 62). En revanche, chez un patient stable avec un hématome stable, il n’est pas exploré et un angioscanner est réalisé ensuite (recommandation 63).</p>
<div class="lab">Raison</div><p>Le rétropéritoine peut tamponner un saignement à basse pression ; l’ouvrir sans nécessité supprime cette contre-pression.</p>
</template>
<template data-pop="s35-reboa" data-title="Occlusion aortique endovasculaire par ballonnet (REBOA)">
<div class="lab">Définition</div><p>La REBOA consiste à introduire par l’artère fémorale un cathéter à ballonnet, gonflé dans l’aorte pour interrompre temporairement le flux en aval et contrôler une hémorragie du tronc.</p>
<figure><img src="images/cardiologie/s35_reboa_catheter.gif" alt="Photographie réelle d’un cathéter d’occlusion aortique à ballonnet" width="520" height="323" loading="lazy" decoding="async"><figcaption>Cathéter de REBOA : le ballonnet gonflé bloque l’aorte en amont de la lésion. Photographie de l’armée de l’air des États-Unis, domaine public.</figcaption></figure>
<div class="lab">Preuves</div><p>Dans l’essai randomisé de 2023 cité par l’ESVS, la mortalité à 90 jours était de 54 % avec REBOA contre 42 % avec les soins standard ; de plus, les complications vasculaires sont estimées à 8 %.</p>
<div class="lab">Recommandation</div><p>Elle n’est pas recommandée comme approche de routine du saignement du tronc (ESVS 2025, recommandation 8, classe IIIb), car elle ne réduit pas la mortalité et ne doit jamais retarder l’hémostase définitive.</p>
</template>
<template data-pop="pareto-s35-notions" data-title="Pareto — Notions et mécanismes"><p class="ratio" data-cover="s35-0,s35-1,s35-2,s35-3"></p><ul>
<li>Le grade ESVS relie la paroi au délai : 1 surveiller, 2 réparer en urgence, 3 réparer en extrême urgence, X revasculariser si l’organe est récupérable.</li>
<li>S35 code le vaisseau : aorte S35.0, veine cave S35.1, mésentériques S35.2, porte S35.3, rein S35.4, iliaques S35.5.</li>
<li>La fracture du bassin saigne par les branches iliaques internes et les plexus veineux.</li>
<li>La coagulopathie traumatique est précoce et s’aggrave avec l’acidose et l’hypothermie.</li></ul></template>
<template data-pop="pareto-s35-pec" data-title="Pareto — Urgences et décisions"><p class="ratio" data-cover="s35-4,s35-5"></p><ul>
<li>Le blessé instable va au bloc, le blessé stable à l’angioscanner.</li>
<li>La FAST ne voit pas le rétropéritoine.</li>
<li>L’hématome rétropéritonéal stable chez un patient stable ne s’explore pas.</li>
<li>La REBOA n’est pas une stratégie de routine, et le contraste ne doit pas retarder l’angioscanner.</li></ul></template>
<template data-pop="pareto-s35-vaisseau" data-title="Pareto — Geste selon le vaisseau"><p class="ratio" data-cover="s35-6"></p><ul>
<li>L’aorte instable se répare par chirurgie ouverte avec une prothèse synthétique.</li>
<li>Les branches iliaques internes s’embolisent, et l’artère mésentérique inférieure se lie.</li>
<li>Le rein unilatéral dévascularisé ne se revascularise pas, mais le rein unique se répare.</li>
<li>Une veine se lie si sa réparation n’est pas simple.</li></ul></template>
<template data-pop="pareto-s35-crit" data-title="Pareto — Critères"><p class="ratio" data-cover="s35-7"></p><ul>
<li>Exploration de l’hématome si le patient est instable, ou si l’hématome est expansif, pulsatile ou saigne.</li>
<li>Pression systolique cible de 80 à 90 mmHg, et surdimensionnement de l’endoprothèse de 20 à 30 % si l’imagerie a été faite en hypotension.</li></ul></template>
<template data-pop="pareto-s35-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="s35-e-1,s35-e-2"></p><ul>
<li>L’angioscanner avec temps artériel et veineux est l’examen de référence du blessé stable.</li>
<li>L’extravasation prouve un saignement actif.</li>
<li>L’angiographie est devenue un temps thérapeutique.</li></ul></template>
<template data-pop="pareto-s35-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="s35-p-1,s35-p-2"></p><ul>
<li>L’acide tranexamique précoce et la transfusion équilibrée traitent la coagulopathie.</li>
<li>Une lésion de grade 1 se surveille sous antithrombotique, et un antiagrégant simple peut suivre une réparation.</li></ul></template>
