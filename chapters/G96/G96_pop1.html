<template data-pop="g96-vignette" data-title="Vignette fictive : hypothèses et démarche">
<div class="lab">Situation</div>
<p data-src="S2">Femme de 42 ans, céphalée depuis six semaines, absente au réveil, installée moins de deux heures après le lever, améliorée de plus de moitié moins de deux heures après le décubitus ; vertiges, audition étouffée. Les valeurs sont pédagogiques et ne proviennent pas d’un patient.</p>
<div class="lab">Hypothèse principale</div>
<p data-src="S2">La définition opérationnelle de la céphalée orthostatique du consensus britannique est remplie : absente ou légère au réveil, apparition en moins de deux heures debout, amélioration de plus de 50 % en moins de deux heures couchée. L’hypothèse principale est donc une fuite de liquide céphalorachidien spinale. Vertiges et audition étouffée sont deux des symptômes associés les plus fréquents (50,5 % et 37,1 %).</p>
<div class="lab">Démarche</div>
<p data-src="S2">Mesurer la fréquence cardiaque et la pression couchée puis debout pour écarter une tachycardie orthostatique posturale ou une hypotension orthostatique ; demander une IRM cérébrale avec gadolinium et une IRM de tout le rachis ; ne pas faire de ponction lombaire dans le seul but de confirmer.</p>
<div class="lab">Erreur à éviter</div>
<p data-src="S5">Conclure à un épuisement professionnel : la revue de Fribourg cite cette erreur parmi les causes de retard diagnostique.</p></template>
<template data-pop="g96-lcr" data-title="Liquide céphalorachidien : rôle dans le cours">
<div class="lab">Rôle dans la maladie</div>
<p data-src="S3 S5">Le cours ne traite pas la composition du liquide mais l’effet de sa perte : le volume de liquide intracrânien baisse, le volume sanguin compense, le cerveau s’affaisse. La mesure de la pression d’ouverture lombaire se note en millimètres de liquide ; une valeur inférieure à 60 est un critère de la classification des céphalées.</p>
<div class="lab">Limite</div>
<p>Les sources lues ne décrivent ni la production ni la composition du liquide ; ces données ne sont pas reprises ici.</p></template>
<template data-pop="g96-his" data-title="Hypotension intracrânienne spontanée">
<div class="lab">Définition</div>
<p data-src="S2">Syndrome dû à une fuite de liquide céphalorachidien rachidienne par déchirure durale, diverticule méningé qui fuit ou fistule liquido-veineuse. Le site est inconnu au début.</p>
<div class="lab">Chiffres clés</div>
<p data-src="S2 S5">Incidence environ 3,7 pour 100 000 par an ; environ 80 % des patients ont des signes d’hypotension à l’IRM ; délai moyen avant diagnostic environ trois mois ; femmes deux fois plus que les hommes.</p>
<div class="lab">Limite</div>
<p data-src="S2">« Spontanée » exclut les fuites post-ponction, post-traumatiques et postopératoires. Les sources lues ne traitent pas la grossesse.</p></template>
<template data-pop="g96-rhino" data-title="Rhinorrhée de liquide céphalorachidien">
<div class="lab">Définition</div>
<p data-src="S13">Écoulement de liquide des espaces intracrâniens vers les fosses nasales ou les sinus par un défaut de la base du crâne et des méninges.</p>
<div class="lab">Types</div>
<p data-src="S12">Traumatique (la plus fréquente ; fractures de la base antérieure environ 25 % des fractures du crâne), iatrogène ou spontanée (en hausse, femmes, obésité, hypertension intracrânienne idiopathique).</p>
<div class="lab">Risque principal</div>
<p data-src="S13">La méningite : un résumé rapporte un risque de 10 à 37 %. Ce chiffre vient d’une seule revue en russe et doit être cité avec prudence.</p></template>
<template data-pop="g96-ichd" data-title="Classification internationale des céphalées, rubrique 7.2">
<div class="lab">Critères</div>
<p data-src="S3">A. Céphalée remplissant C. B. Pression inférieure à 60 mm de liquide et/ou preuve d’une fuite à l’imagerie. C. Relation temporelle. D. Non mieux expliquée.</p>
<div class="lab">Rubriques</div>
<p data-src="S3 S18 S19">7.2.1 : post-ponction durale, après une ponction durale, céphalée apparue dans les cinq jours, rémission spontanée en deux semaines ou après obturation par patch sanguin épidural. 7.2.2 : fistule de liquide, céphalée orthostatique après un acte ou un traumatisme connu pour causer une fuite persistante, disparaissant après obturation. 7.2.3 : hypotension intracrânienne spontanée.</p>
<div class="lab">Codage</div>
<p data-src="S1 S18">La 7.2.3 et la liquorrhée spontanée ou traumatique relèvent de G96.0 ; la céphalée post-ponction (7.2.1) et l’écoulement après ponction lombaire relèvent de G97.0 ou G97.1.</p>
<div class="lab">Notes</div>
<p data-src="S3">7.2.3 : absence de geste ou traumatisme pouvant causer une fuite ; non diagnosticable si ponction durale dans le mois précédent ; la ponction de pression n’est pas nécessaire si l’IRM montre des signes de fuite.</p></template>
<template data-pop="g96-flv" data-title="Fistule liquido-veineuse">
<div class="lab">Définition</div>
<p data-src="S5 S6">Communication entre l’espace du liquide et une veine, correspondant au type 3 de la série de Fribourg. Elle représente jusqu’à 20 % des cas dans la série de 2021 et 2 à 5 % dans la revue de 2020.</p>
<div class="lab">Signature</div>
<p data-src="S6 S14">Collection extradurale toujours absente. La valeur prédictive négative d’une IRM cérébrale négative est d’environ 0,89.</p>
<div class="lab">Recherche et traitement</div>
<p data-src="S2 S6">Myélographie par tomodensitométrie ou soustraction numérique en décubitus latéral, en inspiration, hanches plus hautes que les épaules. Options : ligature chirurgicale, colle de fibrine, embolisation transveineuse par le système azygos ; traitement endovasculaire envisageable en première ligne.</p></template>
<template data-pop="g96-slec" data-title="Collection extradurale longitudinale spinale">
<div class="lab">Définition</div>
<p data-src="S2">Collection de liquide en dehors de la dure-mère, étendue en longueur le long du rachis.</p>
<div class="lab">Fréquence et sens</div>
<p data-src="S2 S6">Présente chez environ 60 % des patients. Sa présence oriente vers le choix d’une myélographie par tomodensitométrie, par soustraction numérique ou ultrarapide en procubitus ; son absence oriente vers la fistule.</p></template>
<template data-pop="g96-berne" data-title="Score de Berne">
<div class="lab">Calcul</div>
<p data-src="S4">Signes majeurs (2 points chacun) : prise de contraste des méninges, engorgement des sinus veineux, citerne suprasellaire de 4,0 mm ou moins. Signes mineurs (1 point) : collection sous-durale, citerne prépontique de 5,0 mm ou moins, distance mamillo-pontique de 6,5 mm ou moins. Maximum 9.</p>
<div class="lab">Interprétation</div>
<p data-src="S4 S6">2 ou moins : faible ; 3 à 4 : intermédiaire ; 5 ou plus : élevée.</p>
<div class="lab">Limite</div>
<p data-src="S4 S8">Étude monocentrique, résumé seul lu. Le score évolue avec la durée des symptômes et un score bas n’exclut pas le diagnostic après une longue évolution.</p></template>
<template data-pop="g96-mnemo" data-title="Moyen mnémotechnique : score de Berne">
<p data-src="S4">Aide pédagogique, non critère officiel : « trois fois deux, trois fois un ». Trois signes majeurs à deux points (contraste des méninges, sinus veineux, citerne suprasellaire), trois signes mineurs à un point (collection sous-durale, citerne prépontique, distance mamillo-pontique) ; total 9.</p></template>
<template data-pop="g96-hii" data-title="Hypertension intracrânienne idiopathique">
<div class="lab">Rapport avec le sujet</div>
<p data-src="S5 S12">Pression haute (supérieure à 200 mm de liquide, 250 si l’indice de masse corporelle dépasse 30), présentée comme le pendant opposé de l’hypotension. Elle est aussi associée à la rhinorrhée spontanée.</p>
<div class="lab">Conduite dans la rhinorrhée spontanée</div>
<p data-src="S12">Perte de poids, chirurgie bariatrique si l’indice atteint 35, acétazolamide (preuve faible), surveillance de l’œdème papillaire après fermeture.</p></template>
<template data-pop="g96-monro" data-title="Doctrine de Monro-Kellie">
<div class="lab">Énoncé</div>
<p data-src="S5">Les volumes du cerveau, du sang et du liquide partagent une enceinte fixe : si l’un baisse, un autre augmente. Dans la fuite, le sang compense.</p>
<div class="lab">Preuve dans la maladie</div>
<p data-src="S7">Après fermeture de la brèche, le volume ventriculaire de liquide passe de 15,3 à 18,0 mL en quatre jours sans changement du volume cérébral ; le score de Berne passe de 6,9 à 2,9.</p>
<div class="lab">Limite</div>
<p data-src="S7">Étude à petit effectif, résumé seul lu.</p></template>
<template data-pop="g96-orthostatique" data-title="Céphalée orthostatique : définition opérationnelle">
<div class="lab">Définition</div>
<p data-src="S2">Absente ou légère (1 à 3 sur 10) au réveil ou couché ; apparition moins de deux heures après le lever ; amélioration de plus de 50 % moins de deux heures après le décubitus.</p>
<div class="lab">Évolution</div>
<p data-src="S3 S5">La composante posturale peut s’estomper ou s’inverser avec le temps : la rechercher au début.</p>
<div class="lab">Fréquence</div>
<p data-src="S5">75 à 80 % des patients.</p></template>
<template data-pop="g96-symptomes" data-title="Symptômes associés : lecture des fréquences">
<div class="lab">Lecture</div>
<p data-src="S2">Vertiges 50,5 %, nausées 49,0 %, déséquilibre 42,6 %, audition étouffée 37,1 %, cervicalgie 34,2 %, troubles cognitifs 31,7 %, acouphènes 27,7 %, fatigue 24,3 %, photophobie ou phonophobie 20,3 %, engourdissement facial 15,8 %. Ces fréquences viennent du consensus britannique.</p>
<div class="lab">Limite</div>
<p data-src="S2">Le consensus les présente comme des symptômes associés à la céphalée, sans valeur diagnostique propre indiquée ; ils se lisent avec la céphalée orthostatique.</p></template>
<template data-pop="g96-reservoir" data-title="Signe du réservoir">
<div class="lab">Technique</div>
<p data-src="S12">Le patient, assis penché en avant après un temps en décubitus, laisse s’écouler le liquide par le nez.</p>
<div class="lab">Limite</div>
<p data-src="S12">Signe d’orientation. Il ne confirme pas la nature du liquide, qui exige le dosage de la bêta-2-transferrine ou de la protéine bêta-trace.</p></template>
<template data-pop="g96-pots" data-title="Tachycardie orthostatique posturale et hypotension orthostatique">
<div class="lab">Critères</div>
<p data-src="S2">Hausse de la fréquence cardiaque de plus de 30 par minute debout pour le syndrome de tachycardie orthostatique posturale ; chute de la pression systolique de plus de 20 mmHg ou diastolique de plus de 10 mmHg pour l’hypotension orthostatique.</p>
<div class="lab">Place dans le raisonnement</div>
<p data-src="S2 S3">Ces deux diagnostics expliquent une intolérance à la station debout et se cherchent à l’examen. La classification des céphalées juge le patch sanguin raisonnable après exclusion d’un syndrome de tachycardie orthostatique posturale.</p></template>
<template data-pop="g96-halo" data-title="Signe du halo">
<div class="lab">Portée</div>
<p data-src="S12">Test sur papier filtre, suggestif d’un écoulement de liquide céphalorachidien après traumatisme.</p>
<div class="lab">Limite</div>
<p data-src="S12">Les sources lues n’en décrivent pas la technique détaillée. Il oriente ; il ne remplace ni le dosage biologique ni le scanner.</p></template>
<template data-pop="g96-irm" data-title="IRM cérébrale avec gadolinium">
<div class="lab">Indication</div>
<p data-src="S2">Première ligne avec l’IRM de tout le rachis ; scanner si l’IRM est impossible.</p>
<div class="lab">Signes à chercher</div>
<p data-src="S2">Élargissement de l’hypophyse, distance mamillo-pontique réduite, affaissement du tronc cérébral, descente des amygdales cérébelleuses, prise de contraste diffuse des méninges, distension des sinus veineux.</p>
<div class="lab">Limite</div>
<p data-src="S2">Environ 80 % des patients ont des signes ; une IRM normale n’exclut pas le diagnostic.</p></template>
<template data-pop="g96-pl" data-title="Ponction lombaire dans l’hypotension intracrânienne">
<div class="lab">Règle</div>
<p data-src="S2">Ne pas la faire pour confirmer le seul diagnostic ; si elle est faite pour une autre raison, mesurer la pression d’ouverture.</p>
<div class="lab">Interprétation</div>
<p data-src="S5 S6 S15">Pression inférieure à 60 mm de liquide chez un tiers seulement ; pression normale chez 31,9 % dans une méta-analyse.</p>
<div class="lab">Piège</div>
<p data-src="S3">Une pression normale n’exclut pas la fuite. Une ponction durale dans le mois précédent interdit la rubrique 7.2.3.</p></template>
<template data-pop="g96-myelo" data-title="Myélographie">
<div class="lab">Indication</div>
<p data-src="S2">Après échec ou bénéfice transitoire d’un patch, ou directement en centre.</p>
<div class="lab">Choix</div>
<p data-src="S2 S6">Collection visible : tomodensitométrie, soustraction numérique ou tomodensitométrie ultrarapide en procubitus. Collection absente : tomodensitométrie ou soustraction numérique en décubitus latéral, en inspiration, hanches plus hautes que les épaules.</p>
<div class="lab">Dose</div>
<p data-src="S6">Environ 19,7 mSv pour la tomodensitométrie dynamique, 6,6 mSv pour la soustraction numérique.</p></template>
<template data-pop="g96-patch" data-title="Patch sanguin épidural">
<div class="lab">Technique</div>
<p data-src="S2">Non ciblé : jusqu’à 40 mL, idéalement au moins 20 mL ; deuxième patch possible après deux à quatre semaines avant la myélographie ; éviter la chlorhexidine à plus de 0,5 %.</p>
<div class="lab">Résultats</div>
<p data-src="S5 S6">De 30 à 70 % de patients asymptomatiques ou améliorés, souvent transitoirement ; guérison permanente des types 1 et 2 inférieure à 10 % ; plus de volume, meilleur résultat.</p>
<div class="lab">Suites</div>
<p data-src="S2">Observation 2 à 24 heures ; à plat autant que possible un à trois jours ; éviter flexion, efforts, charges quatre à six semaines ; ne pas conduire ; consulter en urgence en cas de douleur dorsale ou de jambe, de déficit, de troubles sphinctériens, de fièvre.</p>
<div class="lab">Complication propre</div>
<p data-src="S6">L’hypertension intracrânienne de rebond.</p></template>
<template data-pop="g96-rebond" data-title="Hypertension intracrânienne de rebond">
<div class="lab">Fréquence</div>
<p data-src="S5 S6">Environ un patient sur cinq après patch ou chirurgie (17 % dans la revue de 2020).</p>
<div class="lab">Facteurs</div>
<p data-src="S6">Délai de plus de 10 semaines et obésité.</p>
<div class="lab">Conduite</div>
<p data-src="S2 S6 S16">Souvent spontanément résolutive ; réévaluer si sévère après une à deux semaines ; acétazolamide pendant quelques semaines (usage hors indication, preuve anecdotique, mal toléré selon le consensus britannique).</p></template>
<template data-pop="g96-sequences" data-title="Séquences d’IRM du protocole">
<div class="lab">Cerveau</div>
<p data-src="S2">T2, FLAIR (séquence d’inversion-récupération avec atténuation du signal du liquide), T2* ou SWI (séquences sensibles aux dépôts sanguins), T1 après gadolinium.</p>
<div class="lab">Rachis</div>
<p data-src="S2">STIR, T2 sagittal et axial, 3D T2 fortement pondéré à coupes de 1 mm ou moins.</p>
<div class="lab">Limite</div>
<p data-src="S2">Les sources donnent la liste, non la justification de chaque séquence. Les séquences sensibles au sang servent à la recherche d’une sidérose superficielle.</p></template>
<template data-pop="g96-cafeine" data-title="Caféine">
<div class="lab">Place</div>
<p data-src="S2">Orale ou intraveineuse, envisageable sans retarder le traitement définitif.</p>
<div class="lab">Doses rapportées</div>
<p data-src="S5">200 mg trois fois par jour à 300 mg quatre fois par jour, éventuellement théophylline ; succès conservateur nettement inférieur à 50 %.</p>
<div class="lab">Limite</div>
<p>Aucune information professionnelle suisse de la caféine n’a été lue : les doses sont celles de la revue de Fribourg, non celles d’une information professionnelle. Le consensus britannique ne précise pas de dose.</p></template>
<template data-pop="g96-diamox" data-title="Diamox (acétazolamide) — information professionnelle suisse">
<div class="lab">Indications approuvées</div>
<p data-src="S16">Glaucome, œdèmes, insuffisance respiratoire avec acidose, épilepsie, œdème cérébral, pancréatite, mal des montagnes. Le rebond et l’hypertension intracrânienne idiopathique sont hors indication.</p>
<div class="lab">Contre-indications</div>
<p data-src="S16">Hyponatrémie, hypokaliémie, atteinte rénale ou hépatique grave (dont cirrhose), insuffisance surrénalienne, acidose hyperchlorémique, hypersensibilité aux sulfamides.</p>
<div class="lab">Mises en garde et surveillance</div>
<p data-src="S16">Syndrome de Stevens-Johnson, nécrolyse épidermique toxique, agranulocytose, pustulose exanthématique aiguë généralisée ; hyponatrémie, hypokaliémie, acidose métabolique ; contrôle de la formule sanguine et des électrolytes ; grossesse à éviter, surtout au premier trimestre. Mise à jour juillet 2026.</p></template>
<template data-pop="g96-ferriprox" data-title="Ferriprox (défériprone) — information professionnelle suisse">
<div class="lab">Indication</div>
<p data-src="S17">Surcharge en fer de la thalassémie majeure ; la sidérose superficielle est hors indication.</p>
<div class="lab">Posologie et risques</div>
<p data-src="S17">25 mg/kg trois fois par jour dans l’indication. Agranulocytose 1,1 %, neutropénie 4,9 %. Polynucléaires neutrophiles chaque semaine la première année. Contre-indications : grossesse, allaitement, antécédent d’agranulocytose. Mise à jour mars 2022.</p>
<div class="lab">Place dans la maladie</div>
<p data-src="S2">Envisagée seulement si la fuite est introuvable ou intraitable.</p></template>

<template data-pop="g96-arachno" data-title="Arachnoïdite (adhérences méningées)">
<div class="lab">Définition et mécanisme</div>
<p data-src="S26">Inflammation chronique de l’arachnoïde et de l’espace sous-arachnoïdien ; étiologies chimique, mécanique et post-infectieuse. Les adhérences perturbent l’écoulement du liquide céphalorachidien ; la syringomyélie est la complication majeure.</p>
<div class="lab">Facteurs et clinique</div>
<p data-src="S25">Chirurgie rachidienne, anesthésie épidurale, myélographie, tumeur spinale ; paraparésie progressive potentiellement invalidante ; IRM du rachis, examen le plus sensible et spécifique.</p>
<div class="lab">Limite</div>
<p data-src="S25 S26">Résumés seuls lus (série de trois cas polonaise, revue pakistanaise) : pas de consensus thérapeutique, chirurgie bénéfique dans des cas sélectionnés, aucun patient de la série n’a retrouvé une marche autonome. Aucune recommandation suisse ou européenne n’a été lue.</p></template>
<template data-pop="g96-hisinterne" data-title="Hypotension intracrânienne spontanée sans fuite">
<div class="lab">Concept</div>
<p data-src="S24">Symptômes et imagerie typiques, aucune fuite retrouvée malgré un bilan répété, bénéfice d’un patch. Hypothèse : transfert pathologique de liquide du crâne vers un compartiment spinal trop compliant (diverticules méningés multiples).</p>
<div class="lab">Chiffres</div>
<p data-src="S24">Pression d’ouverture en décubitus typiquement inférieure à 6 cm d’eau, ou le plus souvent normale, mais non négative. Proportion estimée jusqu’à 10 à 15 % d’après l’expérience des auteurs, non mesurée.</p>
<div class="lab">Limite</div>
<p data-src="S3 S24">Article d’hypothèse, un cas illustratif : aucun seuil diagnostique et aucune preuve. La classification des céphalées évoque de son côté un possible faible volume de liquide sans fuite active.</p></template>
<template data-pop="g96-vaccin" data-title="Vaccination antipneumococcique : règle suisse et divergence">
<div class="lab">Règle suisse en vigueur (2026)</div>
<p data-src="S22">Le plan de vaccination suisse 2026 range, dans la rubrique « ORL, crâne (atteintes de la barrière hémato-encéphalique) », la fracture ou malformation de la base du crâne et la fistule cérébro-spinale : vaccination dès que l’indication est posée. Le choix du vaccin conjugué dépend de l’âge, parmi les vaccins autorisés et remboursés ; le vaccin polysaccharidique 23-valent n’est plus recommandé en Suisse depuis 2014.</p>
<div class="lab">Schéma</div>
<p data-src="S22">De 2 à 6 mois : trois doses à 4 à 8 semaines d’intervalle, puis une quatrième à 12 mois. De 7 à 11 mois : deux doses puis une troisième à 12 mois. De 12 à 23 mois : deux doses à 8 semaines au moins. Dès 2 ans : une dose.</p>
<div class="lab">Texte antérieur, encore instructif</div>
<p data-src="S23">La recommandation de l’Office fédéral de la santé publique de février 2014 justifie la mesure par un risque accru de maladie invasive à pneumocoques chez les personnes immunocompétentes porteuses d’une fistule de liquide céphalorachidien ou d’un implant cochléaire, avec une dose dès le diagnostic. Elle date de l’époque du vaccin conjugué 13-valent ; le plan de 2026 la remplace pour le choix du vaccin.</p>
<div class="lab">Divergence et choix</div>
<p data-src="S12 S22">La revue d’Oxford propose, en plus des pneumocoques, Haemophilus influenzae de type b et le méningocoque. Le texte suisse en vigueur ne mentionne que les pneumocoques pour la fistule ; la lecture de la colonne des méningocoques de son tableau est ambiguë. En pratique suisse, la règle de 2026 prime ; l’ajout des deux autres vaccins reste une position de revue.</p></template>
<template data-pop="g96-paracetamol" data-title="Paracétamol — information professionnelle suisse">
<div class="lab">Posologie</div>
<p data-src="S20">Adulte de plus de 40 kg : 500 à 1000 mg par prise, 4000 mg par jour au maximum. Enfant de 9 à 12 ans : 2000 mg par jour au maximum.</p>
<div class="lab">Contre-indications et adaptation</div>
<p data-src="S20">Insuffisance hépatique grave, hépatite aiguë, maladie de Gilbert. Clairance de la créatinine de 10 à 50 mL/min : intervalle de 6 heures, 3000 mg par jour au maximum ; moins de 10 : 8 heures, 2000 mg par jour.</p>
<div class="lab">Grossesse</div>
<p data-src="S20">Dose efficace la plus faible, pour la durée la plus courte.</p>
<div class="lab">Limite</div>
<p>Extraits repris du dossier consacré à un autre cours du même cycle ; interactions non retenues. Posologie de l’antalgie générale, non propre à l’hypotension intracrânienne.</p></template>
<template data-pop="g96-ibuprofene" data-title="Ibuprofène — information professionnelle suisse">
<div class="lab">Posologie dans les céphalées</div>
<p data-src="S21">400 mg, jusqu’à 800 mg par prise, 2400 mg par jour au maximum.</p>
<div class="lab">Contre-indications</div>
<p data-src="S21">Troisième trimestre de grossesse, ulcère ou hémorragie digestive, maladie inflammatoire chronique active de l’intestin, clairance de la créatinine inférieure à 30 mL/min, insuffisance hépatique ou cardiaque grave. Allaitement déconseillé.</p>
<div class="lab">Limite</div>
<p>Exemple d’anti-inflammatoire non stéroïdien : le consensus britannique cite la classe sans nommer de molécule. Interactions non retenues.</p></template>
