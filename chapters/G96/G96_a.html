<template id="ch-G96"><div class="chap"><div class="chap-head"><div class="code">G 96 · Neurologie · Système nerveux central</div><h1>Autres affections du système nerveux central : fuites de liquide céphalorachidien</h1><span class="status">Cycle Betta 41 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des fuites de liquide céphalorachidien</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g96-0">Question clinique</a></li><li><a href="#g96-1">Définition et classifications</a></li><li><a href="#g96-2">Épidémiologie</a></li><li><a href="#g96-3">Physiopathologie</a></li><li><a href="#g96-4">Causes et facteurs de risque</a></li><li><a href="#g96-5">Anamnèse</a></li><li><a href="#g96-6">Examen clinique</a></li><li><a href="#g96-7">Démarche diagnostique</a></li><li><a href="#g96-8">Urgences et complications</a></li><li><a href="#g96-9">Prise en charge</a></li><li><a href="#g96-10">Suivi et pronostic</a></li><li><a href="#g96-11">Situations particulières</a></li><li><a href="#g96-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g96-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <button class="w" data-k="g96-vignette">vignette fictive (hypothèses et démarche)</button>, une femme de 42 ans consulte pour une céphalée évoluant depuis six semaines. La douleur est absente au réveil, s’installe moins de deux heures après le lever et diminue de plus de moitié dans les deux heures qui suivent le retour en position couchée. Elle décrit aussi des vertiges et une sensation d’audition étouffée. Ces données pédagogiques servent à poser la question centrale du cours : que faire devant une céphalée orthostatique ?</p>
<p data-src="S2 S5 S10">Le médecin pense d’abord à une fuite de <button class="w" data-k="g96-lcr">liquide céphalorachidien (composition et rôle)</button> hors des espaces méningés, car une céphalée qui dépend de la posture est le signe d’appel de l’<button class="w" data-k="g96-his">hypotension intracrânienne spontanée (définition et mécanisme)</button>. Le diagnostic est souvent tardif, le délai moyen avant diagnostic atteignant environ trois mois, et le handicap est important.</p>
<p>Le cours suit une même logique en deux volets. Le premier volet traite la fuite spinale, qui réalise l’hypotension intracrânienne spontanée. Le second traite la <button class="w" data-k="g96-rhino">rhinorrhée de liquide céphalorachidien (écoulement nasal d’origine basicrânienne)</button>, où le liquide quitte le crâne vers le nez. Les deux relèvent de la catégorie « écoulement de liquide céphalorachidien » de la classification, mais leurs examens et leurs traitements diffèrent.</p>
<div class="key"><b>Objectifs.</b> Reconnaître une céphalée orthostatique ; savoir pourquoi l’imagerie cérébrale et rachidienne précède la ponction lombaire ; connaître la gradation du traitement, du repos au geste ciblé ; savoir identifier et orienter une rhinorrhée de liquide céphalorachidien ; connaître les complications qui changent l’urgence.</div>
</section>

<section class="ilot" id="g96-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p data-src="S2">L’hypotension intracrânienne spontanée est un syndrome invalidant dû à une fuite de liquide céphalorachidien au niveau du rachis. La fuite provient d’une déchirure de la dure-mère, d’un diverticule méningé qui fuit, ou d’une fistule entre l’espace du liquide et une veine (fistule liquido-veineuse). Le site de la fuite est inconnu au moment de la présentation.</p>
<p data-src="S3">La <button class="w" data-k="g96-ichd">classification internationale des céphalées (rubrique 7.2)</button> définit la céphalée attribuée à une pression basse du liquide : la pression est inférieure à 60 mm de liquide céphalorachidien, ou bien l’imagerie montre une fuite, avec une relation temporelle entre les deux et l’absence d’une meilleure explication. La rubrique 7.2.3 s’applique quand aucun geste ni traumatisme ne peut expliquer la fuite ; elle ne peut pas être posée si une ponction durale a eu lieu dans le mois précédent. La ponction destinée à mesurer la pression n’est pas nécessaire lorsque l’IRM montre des signes de fuite.</p>
<p data-src="S13">La rhinorrhée de liquide céphalorachidien est un écoulement de liquide des espaces intracrâniens vers les fosses nasales ou les sinus, par un défaut de la base du crâne et des méninges.</p>
<p data-src="S1">Dans la classification statistique CIM-10-GM 2024, ces entités se regroupent sous la catégorie G96, sans cinquième caractère. L’écoulement de liquide céphalorachidien (G96.0), qui comprend la liquorrhée, porte l’essentiel du contenu clinique de ce cours ; l’écoulement après ponction lombaire en est exclu et relève de G97.0. La catégorie des affections des méninges non classées ailleurs (G96.1) inclut les adhérences méningées cérébrales et spinales ; elles font l’objet d’un bref développement plus bas. Les deux dernières catégories, autres affections précisées (G96.8) et affection sans précision (G96.9), sont résiduelles : aucune source clinique spécifique n’a été lue et le cours n’y ajoute rien.</p>
<h3>Types de fuite spinale</h3>
<p data-src="S6">La série du centre de Fribourg classe les fuites spinales en trois types, d’après l’imagerie et le mécanisme.</p>
<table class="t"><thead><tr><th>Type</th><th>Lésion</th><th>Fréquence rapportée</th><th>Collection extradurale</th></tr></thead><tbody><tr><td>1</td><td>Déchirure durale ventrale, souvent sur un petit éperon osseux</td><td>environ 60 %</td><td>présente</td></tr><tr><td>2</td><td>Fuite d’une gaine radiculaire ou d’un diverticule méningé</td><td>environ 20 %</td><td>présente si le site est proximal, absente s’il est distal</td></tr><tr><td>3</td><td><button class="w" data-k="g96-flv">Fistule liquido-veineuse (principe et recherche)</button></td><td>jusqu’à 20 %</td><td>toujours absente</td></tr></tbody></table>
<p data-src="S5 S6">Le tableau relie chaque type à sa signature d’imagerie. La présence ou l’absence de <button class="w" data-k="g96-slec">collection extradurale longitudinale spinale (SLEC)</button> décide du type de myélographie à demander : une fistule liquido-veineuse ne produit pas de collection visible, ce qui explique qu’elle échappe à l’IRM du rachis. Les fréquences varient avec le temps : la revue de 2020 du même centre donnait une déchirure ventrale pour environ la moitié des cas avec contraste épidural, un diverticule pour environ 20 %, un site non identifiable pour environ 30 % et une fistule pour 2 à 5 %. Cette divergence reflète l’essor de la myélographie dynamique, qui détecte désormais davantage de fistules.</p>
<h3>Score de Berne</h3>
<p data-src="S4 S6">Le <button class="w" data-k="g96-berne">score de Berne (calcul et interprétation)</button> estime, sur l’IRM cérébrale seule, la probabilité d’une fuite spinale. Il comprend trois signes majeurs à 2 points (prise de contraste des méninges, engorgement des sinus veineux, citerne suprasellaire de 4,0 mm ou moins) et trois signes mineurs à 1 point (collection sous-durale, citerne prépontique de 5,0 mm ou moins, distance mamillo-pontique de 6,5 mm ou moins), soit un maximum de 9 points ; un <button class="w" data-k="g96-mnemo">moyen mnémotechnique</button> aide à le retenir. Un score de 2 ou moins indique une probabilité faible, 3 à 4 une probabilité intermédiaire, 5 ou plus une probabilité élevée.</p>
<h3>Trois rubriques de céphalée par pression basse</h3>
<p data-src="S3 S18 S19">La rubrique 7.2 de la classification des céphalées se subdivise en trois, selon l’<button class="w" data-k="g96-ichd">acte ou le traumatisme qui précède (critères et codage)</button>. La 7.2.1, céphalée post-ponction durale, suppose une ponction durale puis une céphalée apparue dans les cinq jours ; elle disparaît spontanément en deux semaines ou après obturation par patch sanguin épidural. La 7.2.2, céphalée par fistule de liquide, est une céphalée orthostatique qui suit un acte ou un traumatisme connu pour causer une fuite persistante ; elle disparaît après obturation. La 7.2.3 est l’hypotension intracrânienne spontanée, sans geste ni traumatisme causal.</p>
<p data-src="S1 S3 S18">Le codage découle de cette distinction. L’hypotension intracrânienne spontanée (7.2.3) et la liquorrhée spontanée ou traumatique relèvent de G96.0. La céphalée post-ponction (7.2.1) relève de G97.0 ou G97.1 et non de G96.0. Une même céphalée orthostatique change donc de rubrique selon l’existence d’un geste antérieur : l’anamnèse doit le chercher.</p>
<h3>Rhinorrhée : traumatique ou non</h3>
<p data-src="S12">La rhinorrhée traumatique est la cause la plus fréquente ; les fractures de la base antérieure représentent environ 25 % des fractures du crâne. La rhinorrhée non traumatique ou spontanée est en hausse, touche surtout les femmes et l’obésité, et se rattache à l’<button class="w" data-k="g96-hii">hypertension intracrânienne idiopathique (mécanisme et signes)</button>.</p>
<h3>Adhérences méningées : l’arachnoïdite</h3>
<p data-src="S26">Les adhérences méningées de la catégorie G96.1 correspondent notamment à l’<button class="w" data-k="g96-arachno">arachnoïdite (définition, causes, limites)</button>, inflammation chronique de l’arachnoïde et de l’espace sous-arachnoïdien. Ses trois grandes étiologies sont chimique, mécanique et post-infectieuse. Les adhérences perturbent l’écoulement du liquide céphalorachidien, et la syringomyélie, cavité liquidienne dans la moelle, en est la complication majeure.</p>
<p data-src="S25">Les antécédents cités sont une chirurgie rachidienne, une anesthésie épidurale, une myélographie ou une tumeur spinale. La clinique est une paraparésie progressive, potentiellement invalidante jusqu’au fauteuil roulant. L’IRM du rachis est l’examen le plus sensible et le plus spécifique.</p>
<p data-src="S25 S26">Aucun consensus thérapeutique n’existe : la chirurgie est bénéfique dans des cas sélectionnés, et dans une série de trois cas aucun patient n’a retrouvé une marche autonome malgré le traitement conservateur et la rééducation. Le niveau de preuve est faible (deux résumés, une série de cas et une revue non européenne) : le cours se limite à ce repère et n’en tire aucune conduite détaillée.</p>
<div class="key"><b>À retenir.</b> Trois entités à ne pas confondre : la fuite spinale (hypotension intracrânienne spontanée), la fuite crânienne vers le nez (rhinorrhée), et la fuite consécutive à une ponction (céphalée post-ponction, rubrique 7.2.1, exclue du cadre « spontané » et codée G97.0 ou G97.1). Le type de fuite détermine l’imagerie et le geste.</div>
<button class="pareto-btn ui" data-k="pareto-g96-definition">▲ Loi de Pareto — Définition et classifications</button>
</section>

<section class="ilot" id="g96-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p data-src="S2 S5">L’incidence de l’hypotension intracrânienne spontanée est estimée à 3,7 pour 100 000 personnes par an dans le consensus britannique de 2023, et à environ 5 pour 100 000 par an dans la revue de Fribourg, qui l’extrapole d’une étude de Los Angeles. Les deux valeurs diffèrent, et aucune n’est une mesure suisse.</p>
<p data-src="S5 S8">Les femmes sont touchées deux fois plus que les hommes, avec un âge moyen de début de 40 ans. La cohorte de l’Inselspital de Berne (220 patients) a un âge moyen de 51 ± 14 ans et comprend 65 % de femmes.</p>
<p data-src="S2 S5">Environ 80 % des patients ont des signes d’hypotension à l’IRM cérébrale ; il reste donc environ un patient sur cinq dont l’IRM ne montre rien, ce qui impose de ne pas écarter le diagnostic sur une imagerie normale. Environ un quart des hématomes sous-duraux avant 60 ans seraient dus à une telle fuite.</p>
<p data-src="S12">Pour la rhinorrhée, les sites de fuite diffèrent selon la cause. Après traumatisme, la fuite siège à l’ethmoïde et à la lame criblée (46 %), au sinus frontal (44 %), au toit orbitaire (15 %) et au sphénoïde (11 %). Sans traumatisme, elle siège surtout au sphénoïde (30 %), puis à l’ethmoïde (17 %) et à la lame criblée (16 %). Dans chaque série les pourcentages totalisent plus de 100 % ; les sources lues n’expliquent pas cet écart, et l’existence de fuites à plusieurs sites n’est qu’une hypothèse.</p>
<div class="key"><b>À retenir.</b> Retenir l’ordre de grandeur (quelques cas pour 100 000 par an), la prédominance féminine, l’âge de la quarantaine et le fait qu’un quart des hématomes sous-duraux du sujet de moins de 60 ans a cette origine.</div>
</section>

<section class="ilot" id="g96-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p data-src="S5">Le crâne rigide contient trois volumes : le cerveau, le sang et le liquide. La <button class="w" data-k="g96-monro">doctrine de Monro-Kellie (volumes intracrâniens)</button> établit que, lorsque l’un diminue, un autre augmente. Quand le liquide est perdu, le volume sanguin intracrânien augmente pour le remplacer. Les veines se dilatent, les sinus veineux s’élargissent et les méninges prennent le contraste à l’IRM : ces trois signes d’imagerie sont la traduction directe de cette compensation.</p>
<p data-src="S5">La perte de liquide fait aussi s’affaisser le cerveau dans la boîte crânienne. Il tire alors sur les nerfs crâniens et sur la dure-mère, dont la portion de la fosse postérieure est particulièrement sensible. Cette traction est la base de la céphalée. Le caractère orthostatique en découle selon le raisonnement des revues citées : l’affaissement et la traction dépendent de la posture, donc la douleur aussi.</p>
<p data-src="S7">Une étude bernoise apporte une preuve causale. Après la fermeture chirurgicale de la brèche, le volume de liquide dans les ventricules passe de 15,3 à 18,0 mL (hausse de 18,8 % selon les auteurs, calculée sur les variations individuelles) dès environ quatre jours, sans changement du volume cérébral, tandis que le score de Berne passe de 6,9 à 2,9. La fuite diminue donc réellement le volume de liquide, et sa fermeture le restaure.</p>
<p data-src="S3 S8">Toutefois certains patients n’ont peut-être pas de fuite active ; le trouble sous-jacent pourrait être un faible volume de liquide. Par ailleurs, les signes d’imagerie évoluent avec le temps : le score de Berne augmente pendant les premières semaines, puis diminue sur des mois à des années, de sorte qu’un score bas après une longue évolution n’exclut pas le diagnostic.</p>
<p data-src="S24">L’équipe de Berne propose le concept d’<button class="w" data-k="g96-hisinterne">hypotension intracrânienne spontanée sans fuite (hypothèse)</button> : symptômes et imagerie typiques, aucune fuite retrouvée malgré un bilan répété, mais bénéfice d’un patch. L’hypothèse est un transfert pathologique de liquide du crâne vers un compartiment spinal trop compliant, par exemple en présence de multiples diverticules méningés. Dans ce cas, la pression d’ouverture en décubitus est typiquement inférieure à 6 cm d’eau ou, le plus souvent, normale, mais non négative, ce qui concorde avec les séries qui trouvent une pression normale chez un tiers des patients. Les auteurs estiment ces cas jusqu’à 10 à 15 % d’après leur expérience, sans mesure ; l’hypothèse n’est pas démontrée et aucun seuil diagnostique n’existe.</p>
<p data-src="S12 S13">Dans la rhinorrhée, le mécanisme est un défaut osseux et méningé de la base du crâne, qui met l’espace du liquide en communication avec les cavités nasales. Cette communication explique à la fois l’écoulement nasal et le risque infectieux, car les microbes des cavités nasales peuvent remonter vers les méninges.</p>
<div class="trap"><span class="k">Piège</span> Un score de Berne bas ou une IRM normale ne réfute pas le diagnostic. La durée d’évolution et le moment de l’examen modifient les signes.</div>
</section>

<section class="ilot" id="g96-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p data-src="S2 S3 S5 S6">Plusieurs lésions rachidiennes sont retrouvées sous la fuite : un éperon discogénique calcifié (microéperon), des ostéophytes, une hernie discale. Un trouble du tissu conjonctif ou une hypermobilité peuvent prédisposer à la déchirure ; la classification des céphalées recommande de dépister les anomalies conjonctives et vasculaires. Dans certains cas, aucun facteur n’est trouvé.</p>
<p data-src="S3">Des efforts brusques sont rapportés comme déclencheurs : toux vigoureuse, rapport sexuel. Une céphalée orthostatique survenant après un rapport est à coder 7.2.3.</p>
<p data-src="S12">Pour la rhinorrhée, les causes sont traumatiques (fracture de la base du crâne), iatrogènes (chirurgie) ou spontanées. Les formes spontanées se rattachent à l’hypertension intracrânienne idiopathique et à l’obésité.</p>
<table class="t"><thead><tr><th>Facteur</th><th>Association rapportée par les sources</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Éperon discogénique, ostéophyte, hernie discale</td><td>Retrouvés sous la fuite ; un petit éperon osseux accompagne souvent la déchirure ventrale de type 1</td><td>Chercher un éperon à l’imagerie du rachis</td></tr><tr><td>Hypermobilité, trouble du tissu conjonctif</td><td>Cités comme terrain ; dépistage recommandé par la classification des céphalées</td><td>Rechercher une hypermobilité à l’examen</td></tr><tr><td>Toux vigoureuse, rapport sexuel</td><td>Rapportés comme circonstances de début</td><td>Interroger sur le déclencheur</td></tr><tr><td>Hypertension intracrânienne idiopathique, obésité</td><td>Associées à la rhinorrhée spontanée</td><td>Devant une fuite nasale spontanée, chercher cette cause</td></tr></tbody></table>
<p data-src="S2 S3 S5 S12">Le tableau regroupe les facteurs cités par les sources. La colonne centrale indique des associations rapportées, non une preuve de causalité pour chaque patient.</p>

<section class="ilot" id="g96-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-src="S2 S5">Le symptôme cardinal est la <button class="w" data-k="g96-orthostatique">céphalée orthostatique (définition opérationnelle)</button>, présente chez 75 à 80 % des patients. Elle est absente ou légère (1 à 3 sur 10) au réveil ou en position couchée, apparaît moins de deux heures après le lever et s’améliore de plus de 50 % moins de deux heures après le retour en décubitus.</p>
<p data-src="S3 S5">Avec le temps, la composante posturale peut s’estomper, voire s’inverser. Il faut donc rechercher le caractère orthostatique <b>au début</b> de l’histoire, pas seulement au moment de la consultation.</p>
<div class="two"><div class="card"><h4>Forme habituelle</h4><p data-src="S2">Céphalée orthostatique, absente au réveil, qui s’aggrave au fil de la journée.</p></div><div class="card"><h4>Formes trompeuses</h4><p data-src="S2">Céphalée de fin de journée, céphalée en coup de tonnerre devenue ensuite orthostatique, ou céphalée quotidienne persistante d’emblée avec une composante orthostatique.</p></div></div>
<p data-src="S2">Les <button class="w" data-k="g96-symptomes">symptômes associés (fréquences)</button> sont nombreux. Le tableau les classe par fréquence.</p>
<table class="t"><thead><tr><th>Symptôme associé</th><th>Fréquence (%)</th></tr></thead><tbody><tr><td>Vertiges</td><td>50,5</td></tr><tr><td>Nausées ou vomissements</td><td>49,0</td></tr><tr><td>Déséquilibre</td><td>42,6</td></tr><tr><td>Audition étouffée</td><td>37,1</td></tr><tr><td>Cervicalgie postérieure</td><td>34,2</td></tr><tr><td>Troubles cognitifs</td><td>31,7</td></tr><tr><td>Acouphènes</td><td>27,7</td></tr><tr><td>Fatigue</td><td>24,3</td></tr><tr><td>Photophobie ou phonophobie</td><td>20,3</td></tr><tr><td>Engourdissement facial</td><td>15,8</td></tr></tbody></table>
<p data-src="S2">Les formes rares sont à connaître car elles changent la gravité : douleur interscapulaire (10,9 %), céphalée orthostatique inversée (2 %), syndrome de démence frontotemporale de variante comportementale (2,5 %), sidérose superficielle (1,5 %), thrombose veineuse cérébrale (1 %), paralysie du nerf abducens (1 %) et coma (0,5 %).</p>
<p data-src="S12">Dans la rhinorrhée, le patient décrit un écoulement nasal clair, aqueux, unilatéral, majoré par l’effort ou la position. Le <button class="w" data-k="g96-reservoir">signe du réservoir (manœuvre)</button> consiste à se pencher en avant, assis, après un temps en décubitus. Une céphalée orthostatique et une raideur de nuque accompagnent une fuite active.</p>
<div class="trap" data-src="S5"><span class="k">Erreur fréquente</span> Attribuer à un épuisement professionnel ou à une réaction psychosomatique une céphalée orthostatique accompagnée de vertiges et de fatigue. Cette erreur est fréquemment citée comme cause de retard diagnostique.</div>
</section>

<section class="ilot" id="g96-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-src="S2">L’examen vise d’abord à écarter une cause concurrente d’intolérance à la station debout. On mesure la fréquence cardiaque et la pression artérielle en position couchée puis debout. Un <button class="w" data-k="g96-pots">syndrome de tachycardie orthostatique posturale (critères)</button> se définit par une hausse de la fréquence cardiaque de plus de 30 par minute debout ; une hypotension orthostatique par une chute de la pression systolique de plus de 20 mmHg ou de la diastolique de plus de 10 mmHg.</p>
<p data-src="S2 S5">L’examen neurologique cherche une atteinte des nerfs crâniens, notamment une diplopie, présente chez moins de 10 % des patients. Une paralysie du nerf abducens est rare (environ 1 %).</p>
<p data-src="S12">En cas de rhinorrhée traumatique, le <button class="w" data-k="g96-halo">signe du halo (portée et limites)</button> sur papier filtre est suggestif d’un écoulement de liquide céphalorachidien ; il oriente, mais ne confirme pas.</p>
<div class="trap"><span class="k">Piège</span> L’examen peut être strictement normal. Il sert surtout à exclure les mimes (tachycardie orthostatique, hypotension orthostatique) et à documenter l’état neurologique avant tout geste.</div>
<button class="pareto-btn ui" data-k="pareto-g96-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
