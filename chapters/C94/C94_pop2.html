<template data-pop="c94-hyperleuco" data-title="Hyperleucocytose et leucostase">
<div class="lab">Conduite</div><p>Hydroxyurée jusqu’à 4–5 g par jour si les leucocytes dépassent 50–100 G/l. Les anthracyclines ne sont données qu’après baisse sous 30 G/l.</p>
<div class="lab">Signes</div><p>La leucostase est souvent révélée par des symptômes pulmonaires.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-lyse" data-title="Syndrome de lyse tumorale">
<div class="lab">Prévention</div><p>Hydratation et rasburicase. Avant le vénétoclax : montée de dose sur trois jours, prophylaxie de lyse, premier cycle hospitalier.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-7plus3" data-title="Schéma 7+3">
<div class="lab">Schéma</div><p>Anthracycline pendant trois jours (par exemple daunorubicine 60 mg/m²) et cytarabine 100–200 mg/m² par jour en perfusion continue pendant sept jours.</p>
<div class="lab">Variante</div><p>CPX-351 pour la LAM liée aux myélodysplasies ou post-thérapeutique.</p>
<div class="lab">Consolidation</div><p>Cytarabine à haute dose ou allogreffe selon le risque.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse de la cytarabine n’a pas été lue.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-allo" data-title="Allogreffe">
<div class="lab">Indication</div><p>Première rémission pour les risques intermédiaire et défavorable si le patient est apte et un donneur disponible. Crise blastique de LMC : après obtention d’une seconde phase chronique. MCL rapidement progressive : seule option potentiellement curative. Leucémie NK agressive : bénéfice de survie rapporté.</p>
<div class="lab">Limite</div><p>Greffe d’un patient résistant en crise blastique non recommandée hors étude.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myeloische-leukaemie-cml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde chronique, septembre 2026</a> ; <a href="https://doi.org/10.1007/s00277-025-06423-w" target="_blank" rel="noopener">Cao et al., Ann Hematol 2025</a>.</p></template>
<template data-pop="c94-veneto" data-title="Vénétoclax avec azacitidine">
<div class="lab">Mécanisme</div><p>Association d’un inhibiteur de BCL2 et d’un hypométhylant ; première priorité chez le patient inapte.</p>
<div class="lab">Preuves</div><p>VIALE-A : rémission complète ou incomplète de 28,3 % à 66,4 % ; survie médiane de 9,6 à 14,7 mois.</p>
<div class="lab">Précautions</div><p>Démarrer si leucocytes < 25 G/l ; montée de dose sur trois jours ; prophylaxie de lyse ; premier cycle hospitalier ; posaconazole 50–100 mg par jour.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse du vénétoclax n’a pas été lue.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-midostaurine" data-title="Midostaurine (Rydapt®)">
<div class="lab">Indication</div><p>Mastocytose systémique avancée : MSA, MS-AHN, MCL.</p>
<div class="lab">Posologie</div><p>100 mg 2 fois par jour ; prophylaxie antiémétique.</p>
<div class="lab">Preuves</div><p>Étude D2201 (n = 116) : réponse globale 59,6 %, survie globale médiane 26,8 mois dans la population évaluable.</p>
<div class="lab">Précautions</div><p>Pneumopathie interstitielle, allongement du QT, interactions CYP3A4, éthanol dans la capsule.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680663100014) via tools/swissmedic_fi.py" target="_blank" rel="noopener">Information professionnelle suisse Rydapt®</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a>.</p></template>
<template data-pop="c94-avapritinib" data-title="Avapritinib (Ayvakyt®)">
<div class="lab">Indication</div><p>Mastocytose systémique avancée après au moins un traitement systémique ; autorisation européenne aussi dans la forme indolente symptomatique (fin 2023, selon Onkopedia).</p>
<div class="lab">Posologie</div><p>200 mg 1 fois par jour (dose maximale). Non recommandé si plaquettes < 50 G/l.</p>
<div class="lab">Risques</div><p>Hémorragie intracrânienne, effets cognitifs, allongement du QT. Éviter inhibiteurs et inducteurs puissants ou modérés du CYP3A (50 mg par jour si un inhibiteur modéré est inévitable).</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680682940011) via tools/swissmedic_fi.py" target="_blank" rel="noopener">Information professionnelle suisse Ayvakyt®</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a>.</p></template>
<template data-pop="c94-cladribine" data-title="Cladribine et polychimiothérapie">
<div class="lab">Cladribine</div><p>0,14 mg/kg pendant 5 jours, 3 à 6 cycles, hors indication.</p>
<div class="lab">Polychimiothérapie</div><p>Dans la MCL rapidement progressive, souvent suivie d’allogreffe, seule option potentiellement curative.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a>.</p></template>
<template data-pop="c94-mrd" data-title="Maladie résiduelle mesurable">
<div class="lab">Définition</div><p>Population de cellules leucémiques détectable après rémission morphologique.</p>
<div class="lab">Méthodes</div><p>Cytométrie multiparamétrique ou RT-qPCR selon la cible.</p>
<div class="lab">Application</div><p>Le contrôle de rémission se fait vers le quatorzième jour, après récupération et avant chaque consolidation.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-cyp3a" data-title="Interactions CYP3A">
<div class="lab">Principe</div><p>Les médicaments de ce cours sont sensibles à l’activité du CYP3A. Un inhibiteur modifie l’exposition, qu’il faut compenser par la dose.</p>
<div class="lab">Exemples</div><p>Posaconazole avec vénétoclax : 50–100 mg par jour. Avapritinib avec un inhibiteur modéré inévitable : 50 mg par jour. Midostaurine : éviter les inducteurs puissants du CYP3A4.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a> ; <a href="https://amiko.oddb.org (GTIN 7680682940011) via tools/swissmedic_fi.py" target="_blank" rel="noopener">Information professionnelle suisse Ayvakyt®</a> ; <a href="https://amiko.oddb.org (GTIN 7680663100014) via tools/swissmedic_fi.py" target="_blank" rel="noopener">Information professionnelle suisse Rydapt®</a>.</p></template>
<template data-pop="c94-qt" data-title="Intervalle QT">
<div class="lab">Définition</div><p>Intervalle électrocardiographique dont l’allongement expose aux arythmies.</p>
<div class="lab">Application</div><p>La midostaurine et l’avapritinib allongent le QT selon les informations professionnelles suisses.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680663100014) via tools/swissmedic_fi.py" target="_blank" rel="noopener">Information professionnelle suisse Rydapt®</a> ; <a href="https://amiko.oddb.org (GTIN 7680682940011) via tools/swissmedic_fi.py" target="_blank" rel="noopener">Information professionnelle suisse Ayvakyt®</a>.</p></template>
<template data-pop="pareto-c94-diagnostic" data-title="Pareto — Définition et classification">
<p class="ratio" data-cover="c94-0,c94-1,c94-2"></p><ul><li>Le seuil de 20 % de blastes sépare SMD et LAM ; la LAE en est l’exception.</li><li>Chaque entité a un marqueur décisif : CD41/CD61/CD42b, mastocytes ≥ 20 %, fibrose, 20 % de blastes en LMC.</li><li>C94.8! est un code secondaire ajouté au code de la LMC.</li><li>Les pronostics sont mauvais, sauf la LAMK de l’enfant avec trisomie 21 (≈ 90 %).</li></ul></template>
<template data-pop="pareto-c94-mecanismes" data-title="Pareto — Mécanismes et terrains">
<p class="ratio" data-cover="c94-3,c94-4"></p><ul><li>TP53 pour la LAE, GATA1 pour la LAMK, KIT D816V pour la mastocytose, anomalies additionnelles pour la crise blastique.</li><li>L’EBV est liée à la leucémie NK agressive.</li><li>Pas de facteur de risque établi dans la plupart des cas.</li></ul></template>
<template data-pop="pareto-c94-clinique" data-title="Pareto — Anamnèse, examen et diagnostic">
<p class="ratio" data-cover="c94-5,c94-6,c94-7"></p><ul><li>Insuffisance médullaire : fatigue, infections, saignements.</li><li>Signes C pour les atteintes d’organe de la mastocytose.</li><li>Ponction blanche : biopsie ostéomédullaire.</li><li>Le critère décisif dépend de l’entité (tableau diagnostique).</li></ul></template>
<template data-pop="pareto-c94-prise" data-title="Pareto — Urgences et prise en charge">
<p class="ratio" data-cover="c94-8,c94-9,c94-10,c94-11"></p><ul><li>Maîtriser hyperleucocytose, lyse et anaphylaxie avant le traitement.</li><li>Patient apte : 7+3 puis consolidation ou allogreffe ; inapte : vénétoclax avec azacitidine.</li><li>Mastocytose avancée : midostaurine ou avapritinib ; polychimiothérapie et allogreffe en MCL rapide.</li><li>Crise blastique : chimiothérapie, inhibiteur de tyrosine kinase, allogreffe.</li></ul></template>
<template data-pop="pareto-c94-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="c94-e-1,c94-e-2,c94-e-3,c94-e-4"></p><ul><li>Cytologie et biopsie médullaires comptent les blastes et la fibrose.</li><li>Immunophénotypage, caryotype et panel moléculaire définissent l’entité et le risque.</li><li>Tryptase, KIT D816V et histologie pour la mastocytose.</li><li>Bilan d’aptitude avant tout traitement intensif.</li></ul></template>
<template data-pop="pareto-c94-sciences" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="c94-s-histo-cours,c94-s-gen-cours,c94-s-physio-cours"></p><ul><li>Histologie : blastes, mastocytes, fibrose.</li><li>Génétique : TP53, GATA1, KIT, BCR::ABL1.</li><li>Physiologie : tryptase, histamine, anaphylaxie.</li></ul></template>
<template data-pop="pareto-c94-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="c94-p-1,c94-p-2,c94-p-3,c94-p-4,c94-p-5,c94-p-6"></p><ul><li>Midostaurine 100 mg 2 fois par jour ; avapritinib 200 mg 1 fois par jour.</li><li>Interactions CYP3A à vérifier avant chaque prescription.</li><li>Vénétoclax avec azacitidine : leucocytes < 25 G/l, prophylaxie de lyse.</li><li>Éviter l’avapritinib si plaquettes < 50 G/l.</li></ul></template>
