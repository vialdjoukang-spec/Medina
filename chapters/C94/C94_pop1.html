<template data-pop="c94-seuil" data-title="Seuil de blastes et classifications">
<div class="lab">Définition</div><p>La LAM est une prolifération clonale de blastes myéloïdes. Le seuil de 20 % de blastes sépare toujours le syndrome myélodysplasique de la LAM. L’OMS 2022 supprime le seuil pour la plupart des LAM à anomalie génétique définissante, sauf BCR::ABL1 et CEBPA (≥ 20 %). L’ICC 2022 retient ≥ 10 % pour les anomalies génétiques récurrentes, ≥ 20 % sinon, et une catégorie SMD/LAM de 10 à 19 %.</p>
<div class="lab">Application</div><p>Avant de classer, écrire la classification utilisée (OMS 2022 ou ICC 2022) et le compte de blastes. Les LAM définies par la différenciation exigent en général ≥ 20 % de blastes, sauf la LAE.</p>
<div class="lab">Piège</div><p>Comparer des séries anciennes et récentes sans tenir compte du changement de définition : l’OMS 2022 déplace certains cas vers les syndromes myélodysplasiques.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-lae" data-title="Leucémie aiguë érythroïde (LAE)">
<div class="lab">Définition</div><p>Prédominance érythroïde, habituellement ≥ 80 % des éléments médullaires, avec ≥ 30 % de proérythroblastes. Des cas < 80 % sont admis s’ils partagent les mêmes caractères. Terme apparenté : leucémie érythroïde pure. La LAE prime sur la LAM-MR.</p>
<div class="lab">Mécanisme</div><p>Les altérations bialléliques de TP53 sont très fréquentes ; elles entraînent une instabilité génomique et un caryotype complexe fréquent.</p>
<div class="lab">Pronostic</div><p>Dans une série rétrospective monocentrique, les patients relevant des SMD selon l’OMS 2022 survivent nettement mieux, alors que la LAE OMS 2022 évolue mal quel que soit le traitement (chimiothérapie intensive ou hypométhylant).</p>
<div class="lab">Limite</div><p>Série américaine rétrospective, résumé seul ; fait pronostique, non guide de conduite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a> ; <a href="https://doi.org/10.1177/10781552251323578" target="_blank" rel="noopener">Gabbard et al., J Oncol Pharm Pract 2025</a>.</p></template>
<template data-pop="c94-lamk" data-title="Leucémie aiguë mégacaryoblastique (LAMK)">
<div class="lab">Définition</div><p>Blastes exprimant au moins une glycoprotéine plaquettaire : CD41, CD61 ou CD42b.</p>
<div class="lab">Groupes</div><p>Trois groupes : enfants avec syndrome de Down, enfants sans syndrome de Down, adultes. L’immunophénotype « RAM » est corrélé à CBFA2T3::GLIS2.</p>
<div class="lab">Syndrome de Down</div><p>Mutations somatiques de GATA1 (exons 2 ou 3) ; myélopoïèse anormale transitoire limitée aux six premiers mois de vie ; leucémie myéloïde du syndrome de Down. Traitement d’intensité réduite, survie d’environ 90 % ; les rechutes sont très difficiles à traiter.</p>
<div class="lab">Piège</div><p>Une myélofibrose peut donner une ponction blanche : la biopsie ostéomédullaire est nécessaire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-gata1" data-title="GATA1">
<div class="lab">Définition</div><p>GATA1 code un facteur de transcription de la lignée mégacaryocytaire et érythroïde. Sa mutation acquise s’associe à la trisomie 21.</p>
<div class="lab">Application</div><p>Rechercher GATA1 chez tout patient atteint de syndrome de Down qui présente un tableau compatible avec une LAMK.</p>
<div class="lab">Limite</div><p>Le dossier lu ne détaille pas le mécanisme moléculaire au-delà de cette association.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a>.</p></template>
<template data-pop="c94-tp53" data-title="TP53">
<div class="lab">Définition</div><p>TP53 est un gène dont la perte biallélique est très fréquente dans la LAE.</p>
<div class="lab">Conséquence</div><p>Elle entraîne une instabilité génomique, un caryotype complexe fréquent et une mauvaise réponse aux traitements. Selon l’ELN 2022, un TP53 muté classe la LAM en risque défavorable.</p>
<div class="lab">Piège</div><p>Une mutation de TP53 ne se déduit ni du compte de blastes ni de l’aspect cytologique : elle se recherche par le panel moléculaire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a>.</p></template>
<template data-pop="c94-mcl" data-title="Leucémie à mastocytes (MCL)">
<div class="lab">Définition</div><p>Sous-type de mastocytose systémique avec ≥ 20 % de mastocytes sur l’aspiration médullaire (hors grumeaux). Forme aiguë si signes C, chronique sinon ; forme aleucémique (fréquente) ou leucémique (rare) ; primaire ou secondaire.</p>
<div class="lab">Génétique</div><p>KIT codon 816 muté dans plus de 90 % des mastocytoses systémiques ; les MCL négatives pour KIT D816V sont plus fréquentes et de pronostic plus mauvais.</p>
<div class="lab">Pronostic</div><p>Survie médiane d’environ 0,5 à 1,5 an ; mastocytose agressive environ 4 ans ; SM-AHN 2 à 3 ans.</p>
<div class="lab">Différentiel</div><p>Leucémie aiguë à basophiles : blastes métachromatiques, MPO, SBB et NSE négatifs, sans forte expression de CD117, ce qui exclut la MCL.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a>.</p></template>
<template data-pop="c94-mastocytose" data-title="Critères de mastocytose systémique">
<div class="lab">Critère majeur</div><p>Infiltrats mastocytaires compacts multifocaux (≥ 15 cellules) en histologie.</p>
<div class="lab">Critères mineurs</div><p>Mastocytes atypiques fusiformes ; mutation KIT ; expression aberrante de CD2, CD25 ou CD30 ; tryptase sérique persistante > 20 µg/l (corrigée en cas d’α-tryptasémie héréditaire).</p>
<div class="lab">Diagnostic</div><p>Un critère majeur et un mineur, ou trois critères mineurs.</p>
<div class="lab">Types</div><p>Mastocytose systémique, cutanée, sarcome mastocytaire ; sous-types systémiques : médullaire, indolente, « smoldering », agressive, SM-AHN, MCL.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a>.</p></template>
<template data-pop="c94-signes" data-title="Signes B et signes C">
<div class="lab">Signes B</div><p>Infiltration médullaire > 30 % avec tryptase > 200 µg/l, charge de KIT ≥ 10 %, dysplasie ou myéloprolifération, organomégalie sans dysfonction. Ils signalent une charge tumorale élevée.</p>
<div class="lab">Signes C</div><p>Cytopénies (neutrophiles < 1 G/l, hémoglobine < 10 g/dl, plaquettes < 100 G/l), hépatopathie, splénomégalie avec hypersplénisme, malabsorption avec hypoalbuminémie et amaigrissement, atteinte d’organe menaçante, ostéolyses étendues avec fractures pathologiques.</p>
<div class="lab">Application</div><p>La présence de signes C définit une forme aiguë de leucémie à mastocytes et une maladie avancée.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a>.</p></template>
<template data-pop="c94-apmf" data-title="Panmyélose aiguë avec myélofibrose (APMF)">
<div class="lab">Définition</div><p>Prolifération panmyéloïde aiguë avec ≥ 20 % de blastes (moelle ou sang) et fibrose médullaire. L’aspiration est habituellement infructueuse ; la biopsie avec immunohistochimie est indispensable.</p>
<div class="lab">Caractères</div><p>Anomalies −5/del(5q) et −7/del(7q) ; marqueurs CD13, CD33, CD34 et CD117. Très rare, surtout adulte ; survie de quelques mois.</p>
<div class="lab">Lacune</div><p>Son statut exact dans l’OMS 2022 et l’ICC 2022 n’est pas confirmé par une source européenne lue ; la source registre américaine sert à la définition seule.</p>
<p class="src">Références : <a href="https://seer.cancer.gov/seertools/hemelymph/51f6cf57e3e27c3994bd539f" target="_blank" rel="noopener">SEER, panmyélose aiguë avec myélofibrose (définition seulement)</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C81–C96</a>.</p></template>
<template data-pop="c94-lmc" data-title="Crise blastique de leucémie myéloïde chronique">
<div class="lab">OMS 2022</div><p>≥ 20 % de blastes myéloïdes dans le sang ou la moelle, ou augmentation des lymphoblastes, ou prolifération blastique extramédullaire ; la phase accélérée est supprimée.</p>
<div class="lab">Autres classifications</div><p>ICC 2022 : ≥ 20 % de blastes, lymphoblastes > 5 % évoquant une phase lymphoïde. ELN 2020 : ≥ 20 % avec atteinte extramédullaire.</p>
<div class="lab">Application</div><p>Les patients à 20–30 % de blastes ont une survie plus proche de ceux à ≥ 30 % que de ceux à 10–20 %.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myeloische-leukaemie-cml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde chronique, septembre 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a>.</p></template>
<template data-pop="c94-ebv" data-title="EBV">
<div class="lab">Définition</div><p>Le virus d’Epstein-Barr est lié à la leucémie agressive à cellules NK, hémopathie lymphoproliférative très maligne, surtout en Asie et en Amérique latine.</p>
<div class="lab">Traitement</div><p>Méta-analyse de six études (295 patients) : l’allogreffe améliore la survie globale (HR 0,47 ; IC 95 % 0,32–0,68). Les schémas à base de L-asparaginase sont recommandés dans les lymphomes NK/T disséminés.</p>
<div class="lab">Limite</div><p>Sources asiatiques et résumés ; aucune recommandation suisse ou européenne lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00277-025-06423-w" target="_blank" rel="noopener">Cao et al., Ann Hematol 2025</a> ; <a href="https://doi.org/10.1080/17474086.2019.1660640" target="_blank" rel="noopener">Tse et al., Expert Rev Hematol 2019</a> ; <a href="https://doi.org/10.3389/fonc.2022.838817" target="_blank" rel="noopener">Lv et al., Front Oncol 2022</a>.</p></template>
<template data-pop="c94-codage" data-title="Règles de codage de C94">
<div class="lab">Sous-codes</div><p>C94.0 érythroleucémie (AML M6) ; C94.2 leucémie aiguë mégacaryocytaire (AML M7) ; C94.3 leucémie à mastocytes ; C94.4 panmyélose aiguë avec myélofibrose ; C94.6 maladie myélodysplasique et myéloproliférative non classifiable ; C94.7 autres leucémies précisées (leucémie agressive à cellules NK, leucémie aiguë à basophiles) ; C94.8! crise blastique au cours d’une LMC.</p>
<div class="lab">Caractères</div><p>Cinquième caractère 0 : sans mention de rémission complète ; 1 : en rémission complète. C94.1 et C94.5 n’existent pas dans la version 2024.</p>
<div class="lab">Piège</div><p>C94.8! est un code secondaire (point d’exclamation) : il s’ajoute au code de la LMC. C95.8! signale une leucémie réfractaire à l’induction standard. Exclusions : C91.4- et C90.1-.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C81–C96</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 (version française)</a>.</p></template>
<template data-pop="c94-kit" data-title="KIT D816V">
<div class="lab">Définition</div><p>Mutation du codon 816 du gène KIT, présente dans plus de 90 % des mastocytoses systémiques.</p>
<div class="lab">Mécanisme</div><p>Elle active le récepteur KIT sans ligand et fait proliférer les mastocytes.</p>
<div class="lab">Application</div><p>On mesure la charge allélique : une hausse est un signe précoce de progression. L’avapritinib et la midostaurine sont indiqués en Suisse dans la mastocytose avancée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a>.</p></template>
<template data-pop="c94-t315i" data-title="Mutation T315I">
<div class="lab">Définition</div><p>Mutation du domaine kinase de BCR::ABL1 acquise au cours de la crise blastique de LMC.</p>
<div class="lab">Conduite</div><p>Le ponatinib ou l’asciminib (2 × 200 mg par jour) est recommandé.</p>
<div class="lab">Application</div><p>Rechercher les mutations du domaine kinase avant de choisir l’inhibiteur.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myeloische-leukaemie-cml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde chronique, septembre 2026</a>.</p></template>
<template data-pop="c94-biopsie" data-title="Ponction blanche et biopsie">
<div class="lab">Définition</div><p>Une ponction médullaire qui ramène peu ou pas de matériel est dite blanche ou « sèche ».</p>
<div class="lab">Conséquence</div><p>Elle évoque une fibrose. La biopsie ostéomédullaire est obligatoire, avec immunohistochimie dans l’APMF.</p>
<div class="lab">Piège</div><p>Ne pas conclure à l’absence de maladie sur un échec d’aspiration.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/akute-myeloische-leukaemie-aml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde aiguë, septembre 2025</a> ; <a href="https://seer.cancer.gov/seertools/hemelymph/51f6cf57e3e27c3994bd539f" target="_blank" rel="noopener">SEER, panmyélose aiguë avec myélofibrose (définition seulement)</a>.</p></template>
<template data-pop="c94-immuno" data-title="Immunophénotypage">
<div class="lab">Définition</div><p>Cytométrie en flux qui détecte les antigènes de surface et cytoplasmiques des blastes.</p>
<div class="lab">Marqueurs de ce cours</div><p>CD41, CD61, CD42b (LAMK) ; CD13, CD33, CD34, CD117 (APMF) ; CD2, CD25, CD30 (mastocytose) ; pas de forte expression de CD117 dans la leucémie aiguë à basophiles.</p>
<div class="lab">Application</div><p>Dans la crise blastique de LMC, il distingue le phénotype myéloïde du phénotype lymphoïde.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9252913/" target="_blank" rel="noopener">Khoury et al., OMS 5e édition, Leukemia 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/chronische-myeloische-leukaemie-cml/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, leucémie myéloïde chronique, septembre 2026</a> ; <a href="https://seer.cancer.gov/seertools/hemelymph/51f6cf57e3e27c3994bd539f" target="_blank" rel="noopener">SEER, panmyélose aiguë avec myélofibrose (définition seulement)</a>.</p></template>
<template data-pop="c94-tryptase" data-title="Tryptase sérique">
<div class="lab">Seuils</div><p>Persistante > 20 µg/l : critère mineur de mastocytose systémique. > 200 µg/l avec infiltration médullaire > 30 % : signe B.</p>
<div class="lab">Piège</div><p>Corriger le seuil en cas d’α-tryptasémie héréditaire.</p>
<div class="lab">Suivi</div><p>Une hausse de la tryptase basale est un signe précoce de progression.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, janvier 2024</a>.</p></template>
