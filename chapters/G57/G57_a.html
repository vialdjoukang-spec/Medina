<p>Dans cette <b>vignette fictive</b>, une femme de 52 ans consulte parce que son pied gauche « accroche » le sol depuis trois jours. Elle a passé deux heures accroupie à désherber, puis a croisé les jambes pendant un long trajet. L’examen montre une flexion dorsale de cheville à 2/5 et une hypoesthésie du dos du pied et de la face antérolatérale de la jambe. L’inversion du pied et l’abduction de la hanche sont conservées à 5/5.</p>
<p>Une seconde patiente, de 47 ans, enceinte, décrit des brûlures de la face antérolatérale de la cuisse sans aucun déficit moteur. Ces deux situations ont la même structure : un territoire sensitif ou moteur correspond à un seul nerf. Le médecin doit répondre à trois questions : où est la lésion (racine, plexus, tronc, branche), quelle en est la cause, et quelle décision prendre dans la fenêtre où le nerf peut encore se régénérer ?</p>
<div class="key"><b>À retenir.</b> Un déficit limité au territoire d’un seul nerf se localise par l’examen avant toute imagerie. La cause commande le traitement, et le temps écoulé commande le pronostic.</div>
</section>
<section class="ilot" id="g57-1"><h2><span class="n">1</span>Définition et territoires</h2>
<p>La mononévrite du membre inférieur, ou mononeuropathie, est l’atteinte d’un seul nerf périphérique de la jambe. La classification CIM-10-GM 2024 du BfArM la regroupe sous le code G57 et la subdivise selon le nerf touché, en excluant la lésion nerveuse traumatique aiguë, qui se code selon la localisation de la lésion (BfArM 2024). Le tableau relie chaque nerf à son tableau typique.</p>
<table class="t"><thead><tr><th>Nerf atteint</th><th>Tableau typique</th><th>Sous-code</th></tr></thead><tbody><tr><td>Nerf <button class="w" data-k="g57-sciatique">sciatique (division fibulaire et tibiale)</button></td><td>Déficit à prédominance fibulaire fréquent ; douleur fessière si syndrome du piriforme</td><td>G57.0 (sciatalgie discale et sciatique sans précision exclues)</td></tr><tr><td>Nerf <button class="w" data-k="g57-nclc">cutané latéral de la cuisse</button></td><td>Brûlure et paresthésies antérolatérales de cuisse, sans déficit moteur : méralgie paresthésique</td><td>G57.1 (syndrome du ligament inguinal inclus)</td></tr><tr><td>Nerf <button class="w" data-k="g57-femoral">fémoral</button></td><td>Faiblesse du quadriceps, réflexe rotulien diminué, hypoesthésie antéromédiale</td><td>G57.2</td></tr><tr><td>Nerf <button class="w" data-k="g57-nerf-fibulaire">fibulaire commun (péronier)</button></td><td>Pied tombant avec hypoesthésie du dos du pied</td><td>G57.3</td></tr><tr><td>Nerf tibial</td><td>Faiblesse de la flexion plantaire et de l’inversion ; atteinte proximale peu documentée dans ce dossier</td><td>G57.4</td></tr><tr><td>Syndrome du <button class="w" data-k="g57-tarsien">tunnel tarsien</button></td><td>Brûlure plantaire à la marche et la nuit</td><td>G57.5</td></tr><tr><td>Nerf plantaire, <button class="w" data-k="g57-morton">maladie de Morton</button></td><td>Douleur en décharge entre deux têtes métatarsiennes</td><td>G57.6 ; (pseudo-)névrome interdigital : G57.8</td></tr><tr><td>Autre mononeuropathie, ou sans précision</td><td>Atteinte d’un nerf non listé, ou nerf non identifié</td><td>G57.8 ; G57.9</td></tr></tbody></table>
<p>Ce tableau appelle trois remarques. Premièrement, le pied tombant n’a pas de code propre : c’est un signe, codé selon sa cause (nerf fibulaire, radiculopathie, lésion centrale). Deuxièmement, la sciatique des patients, c’est-à-dire la douleur de jambe d’origine discale, n’appartient pas à ce chapitre : elle reflète une atteinte de la racine, non du nerf. Troisièmement, le syndrome douloureux régional complexe de type 2 du membre inférieur, qui suit une lésion nerveuse, est exclu de G57.8 et classé ailleurs (BfArM 2024).</p>
<div class="trap"><span class="k">Piège</span> Distinguer l’atteinte d’un nerf de l’atteinte d’une racine est le cœur du chapitre. Les deux provoquent une faiblesse et une hypoesthésie localisées, mais ni la même cartographie, ni le même pronostic, ni le même traitement.</div>
</section>
<section class="ilot" id="g57-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>La lésion du nerf fibulaire est la cause la plus fréquente de pied tombant. Elle représente 15 % des mononeuropathies de l’adulte et 56 % des lésions nerveuses chez les traumatisés (Carolus 2019). Le registre allemand de traumatologie relève une lésion nerveuse associée chez 1,8 % des blessés du membre inférieur, et une série attribue 17,4 % des lésions nerveuses à des causes iatrogènes. Le pied tombant a aussi des causes non périphériques : 23 % des hernies discales L5 à moins de 4/5 de force le provoquent, et 14 % des accidents vasculaires cérébraux laissent un pied tombant résiduel.</p>
<p>La méralgie paresthésique a une incidence de 3,4 à 4,3 pour 10 000 personnes-années, surtout entre 40 et 60 ans (Chianca 2026). Le syndrome du tunnel tarsien est rare : la littérature citée compte environ 20 % de formes idiopathiques et 80 % de formes symptomatiques (Antoniadis 2008). La maladie de Morton touche typiquement la femme d’âge moyen (Palka 2025). Les causes iatrogènes expliquent plus de la moitié des lésions isolées du nerf fémoral (Kromoser 2025).</p>
<p>Le pronostic dépend de l’état de l’axone. Une compression légère donne un bloc de conduction, qui guérit vite ; une section ou une compression sévère détruit l’axone, qui doit repousser. Le pourcentage de perte axonale est le meilleur facteur prédictif pour le nerf fémoral, plus favorable sous 50 %. Une décompression du nerf fibulaire avant trois mois s’accompagne d’environ 80 % de récupération (Carolus 2019).</p>
<p>Aucune donnée épidémiologique suisse propre à ces mononévrites n’a été trouvée dans le dossier : seule la revue de Lugano sur la méralgie provient d’un centre suisse, et ses chiffres sont ceux de la littérature internationale.</p>

</section>
<section class="ilot" id="g57-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Un nerf périphérique est un faisceau d’axones, entourés d’une gaine de myéline qui accélère la conduction. Il s’y ajoute des enveloppes conjonctives. Chaque nerf transporte l’information motrice vers des muscles précis et l’information sensitive depuis un territoire cutané précis : c’est ce qui permet de le reconnaître à l’examen.</p>
<p>Deux mécanismes lésionnels s’opposent. Une compression légère, comme celle d’une jambe croisée sur la tête de la fibula, provoque un <button class="w" data-k="g57-bloc-axonal">bloc de conduction (démyélinisation focale ou perte axonale)</button> : la myéline est localement altérée, l’axone reste continu et la récupération peut être rapide. Dans l’atteinte axonale, l’axone est interrompu ; la partie en aval dégénère (dégénérescence wallérienne) et l’amplitude du potentiel moteur est basse quelle que soit la stimulation. Les fibrillations, c’est-à-dire l’activité spontanée de fibres musculaires privées de leur nerf, n’apparaissent à l’électroneuromyographie qu’après 10 à 14 jours.</p>
<p>Cette distinction guide le pronostic. Tant que le corps cellulaire de l’axone est intact, la repousse se poursuit jusqu’à six mois, mais elle décline après trois mois : c’est la <button class="w" data-k="g57-regeneration">fenêtre de régénération (délais et décisions)</button>. La neurographie sensitive reste normale en phase aiguë malgré la plainte, car elle ne s’altère que dans les lésions post-ganglionnaires ; une sensibilité conservée dans un territoire anesthésique évoque donc une lésion radiculaire pré-ganglionnaire (Carolus 2019).</p>
<p>Les syndromes canalaires ont des mécanismes propres. Dans la méralgie, le nerf cutané latéral de la cuisse est pincé là où il quitte le bassin sous le ligament inguinal. Dans le tunnel tarsien, le rétinaculum des fléchisseurs, canal ostéofibreux rigide entre la malléole médiale et le tendon calcanéen, comprime le nerf tibial postérieur. La maladie de Morton est une fibrose intra- et périneurale du nerf digital plantaire commun à sa bifurcation, entretenue par l’enclavement, les microtraumatismes et l’ischémie ; ce n’est pas un vrai névrome (Palka 2025, Biz 2025).</p>

<div class="key"><b>Mécanisme à retenir.</b> Un bloc de conduction guérit vite sans que l’axone repousse ; une lésion axonale exige des mois de repousse. La même faiblesse clinique recouvre donc deux pronostics.</div>
</section>
<section class="ilot" id="g57-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se rangent par nerf, car elles découlent de l’anatomie : un nerf est lésé là où il est superficiel, fixé ou serré.</p>
<table class="t"><thead><tr><th>Nerf</th><th>Causes principales</th><th>Raison anatomique</th></tr></thead><tbody><tr><td>Fibulaire commun</td><td>Compression à la tête de la fibula, kystes ganglionnaires, fractures, causes iatrogènes (Carolus 2019)</td><td>Nerf superficiel, appliqué contre l’os</td></tr><tr><td>Cutané latéral de la cuisse</td><td>Forme dite idiopathique (piégeage au ligament inguinal), obésité, grossesse, diabète, tablier abdominal ; chirurgie de hanche par voie antérieure, prélèvement de crête iliaque, cure de hernie inguinale, césarienne ; positionnement opératoire ; ceinture de sécurité ; masses (schwannome, lipome, endométriose, hématome) (de Ruiter 2023)</td><td>Passage étroit sous le ligament inguinal, variantes de trajet</td></tr><tr><td>Fémoral</td><td>Causes iatrogènes (hernie, hanche, chirurgie gynécologique, angiographie transfémorale) ; fractures ; hématome rétropéritonéal chez 1,3 à 6,6 % des patients anticoagulés et 5,5 à 10,4 % des hémophiles ; kyste synovial de hanche (Kromoser 2025)</td><td>Trajet dans le psoas puis sous le ligament inguinal</td></tr><tr><td>Sciatique</td><td>Syndrome du piriforme : traumatisme pelvien ou effort sportif (38,2 % de 212 cas publiés), variante anatomique (12,7 %), pyomyosite (9,4 %) (Monteleone 2025)</td><td>Passage sous ou à travers le muscle piriforme</td></tr><tr><td>Tibial, tunnel tarsien</td><td>Antécédent traumatique (17 à 43 %), arthrose, ténosynovite, polyarthrite (environ 10 %), ganglions (jusqu’à 8 %), vaisseaux tortueux (jusqu’à 17 %) ; diabète, hypothyroïdie, goutte (Antoniadis 2008)</td><td>Canal ostéofibreux inextensible</td></tr><tr><td>Plantaire, Morton</td><td>Surcharge d’appui, talons hauts, troubles de l’arche ; 2e ou 3e espace intermétatarsien (Palka 2025)</td><td>Bifurcation du nerf au niveau des têtes métatarsiennes</td></tr></tbody></table>
<p>Le tableau montre que le contexte précède la plainte : le positionnement opératoire, un traitement anticoagulant ou un diabète sont des antécédents à rechercher avant même l’examen. Chez le sportif jeune, une douleur de jambe d’effort avec des pressions de loge normales peut résulter d’un enclavement du nerf fibulaire ou tibial (van Zantvoort 2020).</p>
</section>
<section class="ilot" id="g57-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire reconstruit la chronologie et cherche le mécanisme. Il porte sur le début (brutal ou progressif), le geste déclenchant (position prolongée, chirurgie, fracture, effort, injection) et la perte de poids récente ou la grossesse. Il explore les antécédents cliquables suivants : diabète, hypothyroïdie, polyarthrite, traitement anticoagulant, chirurgie de hanche ou d’abdomen, chaussage à talons hauts.</p>
<p>Les symptômes s’analysent selon leur nature. Le patient décrit soit un <b>déficit moteur</b> (le pied qui accroche, le genou qui lâche), soit une <b>douleur neuropathique</b> (brûlure, décharge électrique, fourmillements), soit une hypoesthésie. La douleur plantaire nocturne ou majorée par la marche évoque le tunnel tarsien ; la décharge entre deux orteils, soulagée en ôtant la chaussure, évoque la maladie de Morton (Antoniadis 2008, Palka 2025). L’absence de lombalgie et de douleur irradiée dans toute la jambe oriente vers un nerf plutôt qu’une racine.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Territoire d’un seul nerf, début en lien avec une compression, un geste ou une position ; examen cohérent avec la cartographie du nerf.</p></div><div class="card"><h4>Formes atypiques</h4><p>Début brutal, douleur sévère continue, déficit hors territoire, lombalgie, fièvre, antécédent oncologique : ces éléments évoquent une masse ou une cause rachidienne et imposent une imagerie (de Ruiter 2023).</p></div></div>
<p>Chez la patiente de la vignette, la compression prolongée de la tête de la fibula explique le pied tombant ; l’absence de lombalgie, la sensibilité du dos du pied et la force conservée en inversion appuient un nerf fibulaire plutôt qu’une racine L5.</p>
</section>
<section class="ilot" id="g57-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général, constantes, morphologie, puis signes ciblés. Il sert à localiser la lésion avant l’électrophysiologie.</p>
<div class="two"><div class="card"><h4>Moteur</h4><p>Testez la flexion dorsale et l’éversion de cheville (nerf fibulaire), l’inversion (<button class="w" data-k="g57-inversion">inversion et abduction de hanche (test à haut rendement)</button>), le quadriceps, l’iliopsoas et les adducteurs. Un <button class="w" data-k="g57-pied-tombant">pied tombant complet (signe, non diagnostic)</button> évoque le nerf fibulaire (<button class="w" data-k="g57-mnemo">repère mnémotechnique</button>) ; la faiblesse du moyen fessier avec un signe de Trendelenburg positif et une démarche dandinante évoque une racine L5.</p></div><div class="card"><h4>Sensibilité</h4><p>Cartographiez les territoires. La face antérolatérale de jambe et le dos du pied indiquent le nerf fibulaire commun ; le seul premier espace interdigital, la branche profonde ; la face antérolatérale de la cuisse, le nerf cutané latéral ; la face antéromédiale de la cuisse et la face médiale de jambe, le nerf fémoral.</p></div><div class="card"><h4>Réflexes</h4><p>Le réflexe rotulien diminué oriente vers le nerf fémoral. Le réflexe tibial postérieur absent d’un seul côté suggère une atteinte L5, mais il faut comparer les deux côtés car son absence peut être normale.</p></div><div class="card"><h4>Signes de provocation</h4><p>Le <button class="w" data-k="g57-tinel-tarsien">signe de Tinel rétromalléolaire et la provocation du tunnel tarsien</button> sont positifs dans plus de 50 % des cas. La <button class="w" data-k="g57-test-meralgie">compression pelvienne et les tests de la méralgie</button> reproduisent la brûlure. La compression transversale du pied reproduit la douleur de Morton.</p></div></div>
<p>Le choix de l’examen répond à une logique d’exclusion. Un pied tombant sans trouble sensitif doit faire penser à un infarctus de l’artère cérébrale antérieure. Une adduction de hanche faible, une flexion dorsale de cheville diminuée et une hypoesthésie qui déborde sur la face latérale évoquent une radiculopathie L2 à L4 plutôt qu’une atteinte fémorale (Carolus 2019, Kromoser 2025).</p>
<div class="trap"><span class="k">Erreur fréquente</span> L’absence du réflexe tibial postérieur ne prouve pas une atteinte L5 : comparer toujours avec le côté sain.</div><button class="pareto-btn ui" data-k="pareto-g57-clinique">▲ Loi de Pareto — Physiopathologie, anamnèse et examen</button>
</section>
