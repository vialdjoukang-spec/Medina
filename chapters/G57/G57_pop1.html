<template data-pop="g57-sciatique" data-title="Nerf sciatique et syndrome du piriforme">
<div class="lab">Définition</div><p>Le nerf sciatique contient une division fibulaire (péronière) et une division tibiale ; le nerf fibulaire commun en naît. Une atteinte sciatique proximale peut donc se manifester surtout par un pied tombant.</p><div class="lab">Syndrome du piriforme</div><p>Dans 212 cas publiés, la cause est un traumatisme pelvien ou un effort sportif (38,2 %), une variante anatomique piriforme-sciatique (12,7 %) ou une pyomyosite (9,4 %). Le traitement conservateur est efficace chez 41,1 % ; la chirurgie a été réalisée chez 58,9 %. Un diagnostic posé sans imagerie multiplie par 5,3 le risque d’échec chirurgical.</p><div class="lab">Limite</div><p>Le dossier ne documente pas les lésions sciatiques par injection fessière, fracture de hanche ou arthroplastie.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a> ; <a href="https://doi.org/10.1186/s12893-025-03202-2" target="_blank" rel="noopener">Monteleone et al., syndrome du piriforme, revue systématique de cas, BMC Surgery 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-nclc" data-title="Nerf cutané latéral de la cuisse">
<div class="lab">Anatomie</div><p>Nerf purement sensitif, issu des racines L2 et L3, qui croise l’iliaque et sort du bassin le plus souvent en dedans de l’épine iliaque antérosupérieure, sous le ligament inguinal, à 19 mm en moyenne.</p><div class="lab">Variantes</div><p>Cinq variantes de trajet : en arrière de l’épine (4 %), à travers le ligament inguinal (27 %), dans l’origine du sartorius (23 %), entre iliopsoas et sartorius (26 %), sur l’iliopsoas (20 %).</p><div class="lab">Clinique</div><p>La compression provoque brûlure et paresthésies antérolatérales de cuisse, sans déficit moteur, majorées par la pression cutanée.</p>
<p class="src">Références : <a href="https://doi.org/10.15557/jou.2026.0010" target="_blank" rel="noopener">Chianca et al. (Lugano), méralgie paresthésique et imagerie multimodale, Journal of Ultrasonography 2026</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-femoral" data-title="Nerf fémoral">
<div class="lab">Anatomie</div><p>Issu de L2 à L4, il traverse le psoas et sort sous le ligament inguinal avec les vaisseaux fémoraux. Il innerve l’iliaque, le sartorius, le pectiné et le quadriceps, et donne la sensibilité antéromédiale de cuisse et médiale de jambe.</p><div class="lab">Clinique</div><p>Quadriceps et iliopsoas faibles, réflexe rotulien diminué, hypoesthésie antéromédiale. Une adduction de hanche faible et une hypoesthésie latérale évoquent une radiculopathie L2 à L4.</p><div class="lab">Pronostic</div><p>Le pourcentage de perte axonale est le meilleur facteur prédictif, plus favorable sous 50 %.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s40120-025-00844-5" target="_blank" rel="noopener">Kromoser et al., neuropathie fémorale par kyste synovial de hanche, Neurology and Therapy 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-nerf-fibulaire" data-title="Nerf fibulaire commun">
<div class="lab">Anatomie</div><p>Il naît de la division fibulaire du sciatique et contourne la tête de la fibula, où il est superficiel. Son rameau profond innerve le tibial antérieur et les extenseurs, sa branche superficielle les fibulaires.</p><div class="lab">Clinique</div><p>Flexion dorsale et éversion faibles ; hypoesthésie antérolatérale de jambe, dos du pied et premier espace. Une atteinte limitée à la branche profonde épargne l’éversion.</p><div class="lab">Pronostic</div><p>Décompression avant trois mois : environ 80 % de récupération. Greffe de moins de 6 cm avant trois mois : 70 à 80 %.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-pied-tombant" data-title="Pied tombant : signe plutôt que diagnostic">
<div class="lab">Définition</div><p>Le pied tombant est un déficit de flexion dorsale de la cheville. Il n’a pas de code propre : il se code selon sa cause (nerf sciatique ou fibulaire, radiculopathie, lésion centrale).</p><div class="lab">Fréquence des causes</div><p>Hernie discale L5 : 23 % des cas avec force inférieure à 4/5 ; accident vasculaire cérébral : 14 % des survivants gardent un pied tombant.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-tarsien" data-title="Tunnel tarsien">
<div class="lab">Anatomie</div><p>Canal ostéofibreux entre la malléole médiale et le tendon calcanéen, fermé par le rétinaculum des fléchisseurs. Le nerf tibial s’y divise en nerfs plantaires médial et latéral ; les branches calcanéennes du talon ont une origine très variable.</p><div class="lab">Clinique</div><p>Brûlure plantaire à la marche et la nuit ; hypoesthésie territoriale, faiblesse des abducteurs et courts fléchisseurs, amyotrophie et hypohidrose aux stades tardifs.</p><div class="lab">Chirurgie</div><p>Section complète du rétinaculum et libération distale des branches sous le fascia de l’abducteur de l’hallux, en préservant les branches calcanéennes. Succès de 44 à 91 %.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2008.0776" target="_blank" rel="noopener">Antoniadis et Scheglmann, syndrome du tunnel tarsien postérieur, Deutsches Ärzteblatt International 2008</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-tinel-tarsien" data-title="Signe de Tinel et provocation du tunnel tarsien">
<div class="lab">Technique</div><p>Percuter le trajet du nerf tibial derrière la malléole médiale. Provoquer ensuite en éversion et flexion dorsale forcées du pied.</p><div class="lab">Valeur</div><p>Signe de Tinel positif dans plus de 50 % des cas, douleur à la pression dans 60 à 100 %.</p><div class="lab">Piège</div><p>Une sensibilité à la pression n’est pas spécifique ; la polyneuropathie bilatérale est un diagnostic différentiel.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2008.0776" target="_blank" rel="noopener">Antoniadis et Scheglmann, syndrome du tunnel tarsien postérieur, Deutsches Ärzteblatt International 2008</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-morton" data-title="Maladie de Morton">
<div class="lab">Définition</div><p>Fibrose intra- et périneurale du nerf digital plantaire commun à sa bifurcation, entretenue par l’enclavement, les microtraumatismes et l’ischémie. Ce n’est pas un vrai névrome.</p><div class="lab">Clinique</div><p>Douleur en décharge entre deux têtes métatarsiennes, soulagée en ôtant la chaussure, reproduite par compression transversale. Typiquement chez la femme d’âge moyen, aux 2e ou 3e espaces.</p><div class="lab">Traitement</div><p>Orthèses podologiques, infiltration de corticoïdes, puis chirurgie. La taille du névrome ne prédit pas la réponse.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s13244-025-01945-3" target="_blank" rel="noopener">Palka et al., approche radiologique des métatarsalgies, Insights into Imaging 2025</a> ; <a href="https://doi.org/10.1016/j.foot.2025.102204" target="_blank" rel="noopener">Vadera et al., taille du névrome et prise en charge de la maladie de Morton, The Foot 2025</a> ; <a href="https://doi.org/10.1007/s00264-024-06390-3" target="_blank" rel="noopener">Biz et al., histoire et traitement de la maladie de Morton, International Orthopaedics 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-bloc-axonal" data-title="Bloc de conduction et lésion axonale">
<div class="lab">Bloc de conduction</div><p>Altération focale de la myéline : le potentiel moteur est plus faible en amont qu’en aval de la lésion et la récupération peut être rapide.</p><div class="lab">Lésion axonale</div><p>Amplitude basse quelle que soit la stimulation ; fibrillations après 10 à 14 jours ; potentiels de réinnervation de valeur pronostique favorable.</p><div class="lab">Piège</div><p>Une neurographie sensitive normale ne rassure pas en phase aiguë ; elle ne s’altère que pour une lésion post-ganglionnaire.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-regeneration" data-title="Fenêtre de régénération">
<div class="lab">Principe</div><p>Tant que le corps cellulaire est intact, la repousse axonale se poursuit jusqu’à six mois ; elle décline après trois mois.</p><div class="lab">Décision</div><p>Décompression avant trois mois : environ 80 % de récupération. Greffe de plus de 6 cm : nettement moins bien. Aucun essai randomisé ne la compare à l’évolution spontanée.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-inversion" data-title="Inversion du pied et abduction de hanche">
<div class="lab">Technique</div><p>Tester l’inversion (tibial postérieur, muscle clé de la racine L5) et l’abduction de hanche (moyen fessier).</p><div class="lab">Interprétation</div><p>Ces deux examens à haut rendement séparent la racine L5 du nerf fibulaire : conservés, ils orientent vers le nerf ; faibles, vers la racine.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-test-meralgie" data-title="Tests de la méralgie paresthésique">
<div class="lab">Tests</div><p>Compression pelvienne, tests neurodynamiques, signe de Tinel. La pression de la sonde échographique peut reproduire les symptômes.</p><div class="lab">Limite</div><p>Aucun test isolé n’est diagnostique ; le diagnostic reste clinique, avec exclusion d’une origine rachidienne.</p>
<p class="src">Références : <a href="https://doi.org/10.15557/jou.2026.0010" target="_blank" rel="noopener">Chianca et al. (Lugano), méralgie paresthésique et imagerie multimodale, Journal of Ultrasonography 2026</a> ; <a href="https://doi.org/10.1080/01616412.2022.2151115" target="_blank" rel="noopener">Dengler, traitement de la méralgie paresthésique idiopathique, Neurological Research 2023</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-enmg" data-title="Électroneuromyographie">
<div class="lab">Principe</div><p>Combine neurographie et examen à l’aiguille. À réaliser à 10–14 jours pour montrer les fibrillations, avec comparaison bilatérale.</p><div class="lab">Apport</div><p>Sépare bloc de conduction et perte axonale, racine et nerf. En cas de neurographie normale, les potentiels évoqués somesthésiques et moteurs peuvent compléter.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a> ; <a href="https://doi.org/10.3238/arztebl.2008.0776" target="_blank" rel="noopener">Antoniadis et Scheglmann, syndrome du tunnel tarsien postérieur, Deutsches Ärzteblatt International 2008</a> ; <a href="https://doi.org/10.1007/s40120-025-00844-5" target="_blank" rel="noopener">Kromoser et al., neuropathie fémorale par kyste synovial de hanche, Neurology and Therapy 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-echo" data-title="Échographie nerveuse">
<div class="lab">Valeurs</div><p>Nerf cutané latéral de la cuisse : 1–3 mm² normal, suspect au-delà de 3,0–3,5 mm². Fibulaire à la tête de la fibula 8,4 mm² ; tibial à la malléole 10,0 mm² ; sural 2,4 mm².</p><div class="lab">Limites</div><p>Dépend de l’opérateur ; corrélée à l’atteinte axonale, non au bloc de conduction ; comparaison au côté opposé nécessaire.</p>
<p class="src">Références : <a href="https://doi.org/10.15557/jou.2026.0010" target="_blank" rel="noopener">Chianca et al. (Lugano), méralgie paresthésique et imagerie multimodale, Journal of Ultrasonography 2026</a> ; <a href="https://doi.org/10.1111/ene.14850" target="_blank" rel="noopener">Fisse et al., valeurs de référence échographiques des nerfs du membre inférieur, European Journal of Neurology 2021</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-irm" data-title="Imagerie par résonance magnétique">
<div class="lab">Indications</div><p>Causes centrales et rachidiennes, parties molles du trajet fémoral, suspicion de tumeur, réintervention dans le tunnel tarsien, méralgie avec douleur radiculaire.</p><div class="lab">Morton</div><p>Signal T1 bas, T2 iso- à hyperintense, rehaussement homogène ; bursite : rehaussement périphérique.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a> ; <a href="https://doi.org/10.3238/arztebl.2008.0776" target="_blank" rel="noopener">Antoniadis et Scheglmann, syndrome du tunnel tarsien postérieur, Deutsches Ärzteblatt International 2008</a> ; <a href="https://doi.org/10.1007/s10143-023-02023-2" target="_blank" rel="noopener">de Ruiter et al., causes inhabituelles de méralgie paresthésique, Neurosurgical Review 2023</a> ; <a href="https://doi.org/10.1186/s13244-025-01945-3" target="_blank" rel="noopener">Palka et al., approche radiologique des métatarsalgies, Insights into Imaging 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-hematome" data-title="Hématome rétropéritonéal et nerf fémoral">
<div class="lab">Fréquence</div><p>1,3 à 6,6 % des patients anticoagulés ; 5,5 à 10,4 % des hémophiles.</p><div class="lab">Conduite</div><p>Biologie de la coagulation et imagerie en urgence ; la décompression précoce conditionne la récupération.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s40120-025-00844-5" target="_blank" rel="noopener">Kromoser et al., neuropathie fémorale par kyste synovial de hanche, Neurology and Therapy 2025</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-mnemo" data-title="Aide mnémotechnique : racine ou nerf">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Pour un pied tombant : « inversion et abduction conservées, c’est le nerf ; faibles, c’est la racine L5 ». Cette règle découle de l’examen décrit par Carolus 2019 et ne remplace pas la neurographie.</p>
<p class="src">Références : <a href="https://doi.org/10.3238/arztebl.2019.0347" target="_blank" rel="noopener">Carolus et al., prise en charge interdisciplinaire du pied tombant, Deutsches Ärzteblatt International 2019</a>, consultées le 15 octobre 2026.</p></template>
