<template data-pop="r00-preexc" data-title="Pré-excitation ventriculaire">
<div class="lab">Mécanisme</div><p>Une voie accessoire, faite de myocarde ordinaire, relie l’oreillette au ventricule en court-circuitant le nœud auriculoventriculaire. Elle conduit sans le ralentissement décrémentiel du nœud : une partie du ventricule est activée plus tôt.</p>
<div class="lab">ECG</div><p>La pré-excitation associe un PR inférieur à 120 ms, un empâtement initial du QRS, l’onde delta, un QRS élargi et des troubles secondaires de la repolarisation, car une voie accessoire active précocement une partie du ventricule.</p>
<div class="lab">Risques</div><p>La voie peut former le bras d’une tachycardie réciproque. Surtout, en cas de fibrillation auriculaire, elle peut transmettre aux ventricules des fréquences très élevées et provoquer une fibrillation ventriculaire.</p>
<div class="lab">Stratification</div><p>La disparition brutale de la pré-excitation à l’effort indique une voie à période réfractaire longue, donc à faible risque. Les autres cas relèvent d’une évaluation spécialisée, souvent d’une ablation (<a href="#/entry/I47">I47</a>).</p><figure><img src="images/cardiologie/r00_onde_delta_ecg.gif" alt="Onde delta et PR court sur un ECG réel" width="520" height="438" loading="lazy" decoding="async"><figcaption>Onde delta : la voie accessoire active une partie du ventricule avant le nœud, d’où une rampe lente au pied du QRS. James Heilman, MD, Wikimedia Commons, CC BY-SA 3.0.</figcaption></figure></template>

<template data-pop="r00-qtlong" data-title="QT long : diagnostic et causes">
<div class="lab">Mesure</div><p>Le QT se mesure du début du QRS à la fin de l’onde T, dans la dérivation où il est le plus long, puis se corrige pour la fréquence. La correction de Bazett surcorrige aux fréquences élevées.</p>
<div class="lab">Diagnostic (ESC 2022)</div><p>Un syndrome du QT long est diagnostiqué devant un QTc d’au moins 480 ms sur des ECG à 12 dérivations répétés, avec ou sans symptômes, ou devant un score de Schwartz supérieur à 3, en l’absence de cause secondaire.</p>
<div class="lab">Causes acquises</div><p>Les causes acquises sont les médicaments bloquant le courant potassique IKr, l’hypokaliémie, l’hypomagnésémie, l’hypocalcémie, la bradycardie, l’hypothermie et l’hypothyroïdie. L’association de plusieurs facteurs multiplie le risque de torsades de pointes.</p>
<div class="lab">Lien avec les palpitations</div><p>Des palpitations suivies de syncope chez un patient au QT long évoquent des torsades de pointes : c’est une urgence (<a href="#/entry/I47">I47</a>).</p></template>

<template data-pop="r00-chrono" data-title="Insuffisance chronotrope">
<div class="lab">Définition usuelle</div><p>L’insuffisance chronotrope est l’incapacité à atteindre au moins 80 % de la réserve chronotrope attendue à l’effort. La réserve se calcule comme la fréquence maximale théorique (220 − âge) moins la fréquence de repos.</p>
<div class="lab">Exemple chiffré</div><p>Un homme de 70 ans, fréquence de repos 60/min : fréquence maximale théorique 150/min, réserve 90/min. Atteindre moins de 60 + 0,8 × 90 = 132/min à un effort maximal définit une insuffisance chronotrope.</p>
<div class="lab">Signification</div><p>Elle oriente vers une dysfonction sinusale et peut expliquer une fatigue d’effort. Les bêtabloquants la miment : l’interprétation se fait hors traitement freinateur ou en tenant compte de celui-ci.</p>
<div class="lab">Limite</div><p>La formule de la fréquence maximale théorique a une grande variabilité individuelle ; le seuil de 80 % est une convention.</p></template>

<template data-pop="r00-bernoulli" data-title="Équation de Bernoulli simplifiée">
<div class="lab">Principe</div><p>Quand le sang accélère à travers un orifice rétréci, une partie de son énergie de pression se transforme en énergie cinétique. La chute de pression à travers l’orifice est donc liée à la vitesse du jet.</p>
<div class="lab">Formule</div><p>Le gradient (mmHg) vaut 4 × v², où v est la vitesse maximale du jet en m/s mesurée par Doppler continu. La forme simplifiée néglige la vitesse en amont et les pertes visqueuses.</p>
<div class="lab">Exemples</div><p>v = 2 m/s : gradient 16 mmHg. v = 4 m/s : 64 mmHg. v = 5 m/s : 100 mmHg.</p>
<div class="lab">Limites</div><p>Si le faisceau Doppler n’est pas aligné avec le jet, la vitesse est sous-estimée. Si la vitesse en amont est élevée, la formule simplifiée surestime le gradient. Un bas débit abaisse le gradient malgré un orifice serré.</p></template>

<template data-pop="r00-if" data-title="Courant If et canaux HCN4">
<div class="lab">Particularité</div><p>Le courant If s’active quand la cellule s’hyperpolarise, à la fin du potentiel d’action, alors que la plupart des courants s’activent à la dépolarisation. C’est pourquoi il a été qualifié de « funny ».</p>
<div class="lab">Canal</div><p>Il passe par les canaux HCN4, perméables au sodium et au potassium. L’AMPc se lie directement au canal et augmente son ouverture.</p>
<div class="lab">Rôle</div><p>Il contribue à la pente de dépolarisation diastolique du nœud sinusal. La stimulation sympathique l’augmente via l’AMPc ; la stimulation vagale le diminue.</p>
<div class="lab">Pharmacologie</div><p>L’ivabradine bloque le canal ouvert, côté intracellulaire. Elle ralentit la fréquence sinusale sans modifier la contractilité, la conduction auriculoventriculaire ni la pression artérielle.</p></template>

<template data-pop="r00-d-bb" data-title="Bêtabloquants β1-sélectifs dans les palpitations bénignes">
<div class="lab">Mécanisme</div><p>Le blocage des récepteurs β1 réduit l’AMPc dans les cellules sinusales et myocardiques : la pente de phase 4 diminue, la fréquence baisse, l’automatisme anormal et l’activité déclenchée adrénergique diminuent. La contraction est un peu moins vigoureuse, ce qui atténue la perception du battement.</p>
<div class="lab">Indications dans ce cours</div><p>Les bêtabloquants β1-sélectifs s’indiquent dans les extrasystoles symptomatiques sur cœur normal après explication, dans la tachycardie sinusale inappropriée (classe IIa, ESC 2019) et dans les symptômes adrénergiques de l’hyperthyroïdie en attendant l’euthyroïdie.</p>
<div class="lab">Posologie</div><p>Le bisoprolol commence à 1,25 à 2,5 mg par jour et peut monter jusqu’à 10 mg par jour. Le métoprolol succinate commence à 23,75 à 47,5 mg par jour et peut monter jusqu’à 190 mg par jour. Ces doses reprennent celles des cours I25 et I49 ; l’information professionnelle suisse n’a pas été relue le 08.10.2026.</p>
<div class="lab">Effets indésirables</div><p>Fatigue, bradycardie, froideur des extrémités, troubles du sommeil, troubles de l’érection ; aggravation possible des extrasystoles qui dépendent de la bradycardie.</p>
<div class="lab">Contre-indications</div><p>Ils sont contre-indiqués en cas de bloc auriculoventriculaire de haut degré non appareillé, de bradycardie symptomatique et d’asthme sévère non contrôlé ; la prudence s’impose chez le patient hypotendu.</p>
<div class="lab">Surveillance</div><p>Le médecin surveille la fréquence de repos, la pression artérielle et l’effet réel sur les symptômes. Il n’arrête pas brutalement le traitement après une prise prolongée, en raison du rebond adrénergique.</p></template>

<template data-pop="r00-d-propra" data-title="Propranolol">
<div class="lab">Mécanisme</div><p>Le propranolol est un bêtabloquant non sélectif et lipophile. Il bloque les récepteurs β1 cardiaques et β2 vasculaires et bronchiques, et réduit les symptômes adrénergiques périphériques comme le tremblement.</p>
<div class="lab">Indications dans ce cours</div><p>Il s’indique dans les symptômes adrénergiques, dans le syndrome de tachycardie orthostatique posturale à faible dose (classe IIb, HRS 2015 ; <a href="#/entry/I49">I49</a>) et dans l’hyperthyroïdie symptomatique.</p>
<div class="lab">Posologie</div><p>Le traitement commence à 10 à 20 mg une à deux fois par jour et peut monter jusqu’à 40 mg deux à trois fois par jour selon la tolérance. Dans le syndrome de tachycardie orthostatique, une dose faible de 20 mg soulageait mieux qu’une dose de 80 mg dans un essai croisé.</p>
<div class="lab">Contre-indications</div><p>Asthme, car le blocage β2 provoque un bronchospasme ; bradycardie, bloc auriculoventriculaire de haut degré.</p>
<div class="lab">Effets indésirables</div><p>Il provoque une fatigue, une hypotension et des cauchemars, car il passe la barrière hémato-encéphalique ; il masque aussi les signes adrénergiques d’une hypoglycémie chez le diabétique traité.</p></template>

<template data-pop="r00-d-iva" data-title="Ivabradine dans la tachycardie sinusale inappropriée">
<div class="lab">Mécanisme</div><p>L’ivabradine bloque sélectivement le courant If du nœud sinusal : la fréquence sinusale baisse donc sans effet sur la pression artérielle, la contractilité ni la conduction auriculoventriculaire.</p>
<div class="lab">Place (ESC 2019)</div><p>Dans la tachycardie sinusale inappropriée symptomatique, l’ivabradine seule ou associée à un bêtabloquant est de classe IIa. L’association limiterait l’activation sympathique réflexe que la baisse de fréquence peut entraîner.</p>
<div class="lab">Statut en Suisse</div><p>L’ivabradine est autorisée pour l’angor stable et l’insuffisance cardiaque ; son emploi dans la tachycardie sinusale inappropriée est hors indication, ce qui impose une information de la patiente.</p>
<div class="lab">Posologie</div><p>Le traitement commence à 2,5 à 5 mg deux fois par jour et peut monter jusqu’à 7,5 mg deux fois par jour, au cours des repas. Ces doses reprennent celles des cours I25 et I49.</p>
<div class="lab">Effets indésirables</div><p>L’ivabradine provoque des phosphènes, perceptions lumineuses transitoires lors de changements brusques de luminosité, dus au blocage d’un courant rétinien voisin ; elle provoque aussi une bradycardie et une fibrillation auriculaire.</p>
<div class="lab">Contre-indications</div><p>Elle est contre-indiquée pendant la grossesse et l’allaitement, d’où une contraception efficace chez la femme en âge de procréer, ainsi qu’avec les inhibiteurs puissants du CYP3A4, le vérapamil et le diltiazem, en cas d’insuffisance hépatique sévère et en cas de dysfonction sinusale.</p></template>
