<template data-pop="pareto-r00-notions" data-title="Pareto — Notions et causes"><p class="ratio" data-cover="r00-0,r00-1,r00-2,r00-3"></p><ul>
<li>R00 et R01 codent des symptômes, jusqu’au diagnostic précis.</li>
<li>On parle de tachycardie au-delà de 100/min et de bradycardie en deçà de 50/min (ESC 2021).</li>
<li>Un coup suivi d’une pause évoque une extrasystole ; un début et une fin brutaux évoquent une réentrée.</li>
<li>Un souffle naît d’un débit accru ou d’un orifice anormal (Bernoulli).</li>
<li>Le trouble panique est un diagnostic d’exclusion.</li></ul></template>
<template data-pop="pareto-r00-demarche" data-title="Pareto — Démarche"><p class="ratio" data-cover="r00-4,r00-5"></p><ul>
<li>Seule la corrélation entre symptôme et rythme permet de diagnostiquer une arythmie.</li>
<li>Les signes d’alarme sont la syncope, l’effort, la cardiopathie, l’ECG anormal et la mort subite familiale.</li>
<li>Le moyen de surveillance se choisit selon la fréquence des accès.</li>
<li>L’échocardiographie s’indique devant un souffle diastolique, continu, holosystolique ou ≥ 3/6, ou devant des symptômes.</li>
<li>Nouveau-né : tout souffle est présumé pathologique.</li></ul></template>
<template data-pop="pareto-r00-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="r00-6,r00-7"></p><ul>
<li>L’instabilité impose une cardioversion synchronisée (ERC 2025).</li>
<li>Une tachycardie à QRS larges est ventriculaire jusqu’à preuve du contraire ; le vérapamil est donc proscrit.</li>
<li>Une tachycardie sinusale secondaire se traite par la correction de sa cause.</li></ul></template>
<template data-pop="pareto-r00-crit" data-title="Pareto — Critères"><p class="ratio" data-cover="r00-8"></p><ul>
<li>Enregistrement relu ; seuils de fréquence ; souffle innocent selon la DGPK 2017.</li></ul></template>
<template data-pop="pareto-r00-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="r00-e-1"></p><ul>
<li>La pré-excitation associe un PR court et une onde delta.</li>
<li>Un examen par question ; l’ECG normal entre les accès n’exclut rien.</li></ul></template>
<template data-pop="pareto-r00-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r00-p-1,r00-p-2"></p><ul>
<li>Le bêtabloquant ne se prescrit qu’après le diagnostic.</li>
<li>L’ivabradine est hors indication suisse dans la tachycardie sinusale inappropriée.</li>
<li>Devant une bradycardie du sujet âgé, le médecin relit d’abord les médicaments.</li></ul></template>
