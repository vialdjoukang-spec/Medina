
<!-- ===== FENÊTRES R00 : notions fondamentales, définitions, physiopathologie, étiologies ===== -->
<template data-pop="r00-interoception" data-title="Intéroception cardiaque">
<div class="lab">Définition</div><p>L’intéroception est la perception de l’état interne du corps : battements cardiaques, respiration, faim, douleur viscérale. Pour le cœur, elle repose sur des mécanorécepteurs des parois cardiaques, des gros vaisseaux et du thorax, dont les signaux gagnent le tronc cérébral, le thalamus puis le cortex insulaire.</p>
<div class="lab">Fonctionnement normal</div><p>Le cerveau compare chaque signal à une prédiction. Un battement régulier, attendu, n’atteint pas la conscience. Un battement qui s’écarte de la prédiction, par sa force, son rythme ou sa fréquence, devient perceptible.</p>
<div class="lab">Dans les palpitations</div><p>L’anxiété et l’attention centrée sur le corps augmentent le poids donné aux écarts. Le patient perçoit alors des battements normaux, et cette perception entretient l’anxiété. L’adrénaline libérée accélère réellement le sinus, ce qui renforce la perception.</p>
<div class="lab">Conséquence pratique</div><p>Le nombre de palpitations ressenties ne mesure ni le nombre ni la gravité des arythmies. Seul l’enregistrement pendant le symptôme établit la cause. Un enregistrement sinusal pendant le symptôme est aussi l’argument le plus solide pour rassurer.</p>
<div class="lab">Limite</div><p>Les mesures expérimentales de la précision intéroceptive, comme le comptage des battements, sont discutées et ne servent pas au diagnostic clinique.</p></template>

<template data-pop="r00-turbulence" data-title="Turbulence et genèse d’un souffle">
<div class="lab">Principe physique</div><p>Un fluide s’écoule en couches parallèles tant que sa vitesse reste modérée : l’écoulement est laminaire et silencieux. Au-delà d’un seuil, des tourbillons apparaissent : l’écoulement est turbulent et fait vibrer les parois. Le nombre de Reynolds prédit ce passage : Re = densité × vitesse × diamètre ÷ viscosité. Dans un tube rigide, la turbulence apparaît vers 2 000 ; ce seuil n’est qu’une approximation pour les vaisseaux, élastiques et pulsatiles.</p>
<div class="lab">Trois mécanismes cliniques</div><p>Le premier mécanisme est une vitesse accrue à travers un orifice normal, comme dans l’anémie, la fièvre, la grossesse, l’hyperthyroïdie ou le sport. Le deuxième est un orifice rétréci qui accélère le jet, comme dans le rétrécissement aortique ou pulmonaire. Le troisième est un écoulement anormal d’une cavité à haute pression vers une cavité à basse pression, comme dans la fuite mitrale, la communication interventriculaire ou le canal artériel.</p>
<div class="lab">Exemple chiffré</div><p>Une anémie à 80 g/L augmente le débit cardiaque et diminue la viscosité du sang. Les deux effets élèvent le nombre de Reynolds dans la chambre de chasse : un souffle d’éjection apparaît, puis disparaît quand l’hémoglobine se normalise.</p>
<div class="lab">Piège</div><p>L’intensité du souffle dépend de la vitesse et du débit, et non de la sévérité anatomique seule. Un rétrécissement aortique très serré avec un ventricule défaillant peut produire un souffle doux.</p></template>

<template data-pop="r00-cycle" data-title="Chronologie du cycle cardiaque">
<div class="lab">Systole</div><p>Le ventricule se contracte : sa pression dépasse celle de l’oreillette, les valves mitrale et tricuspide se ferment et produisent B1. Pendant la contraction isovolumique, toutes les valves sont fermées. Quand la pression ventriculaire dépasse la pression aortique, la valve aortique s’ouvre et l’éjection commence.</p>
<div class="lab">Fin de systole</div><p>La pression ventriculaire redescend sous la pression aortique : les valves aortique et pulmonaire se ferment et produisent B2. La composante aortique précède la composante pulmonaire ; l’inspiration retarde la fermeture pulmonaire, d’où le dédoublement inspiratoire normal de B2.</p>
<div class="lab">Diastole</div><p>La relaxation isovolumique précède l’ouverture des valves auriculoventriculaires. Le remplissage rapide suit ; un B3 peut apparaître si le ventricule est dilaté ou le flux très abondant. La contraction auriculaire termine le remplissage ; un B4 peut apparaître si le ventricule est rigide.</p>
<div class="lab">Repère clinique</div><p>B1 précède le pouls carotidien, B2 le suit. La palpation carotidienne pendant l’auscultation permet ainsi de situer un souffle en systole ou en diastole, surtout quand la fréquence est rapide.</p></template>

<template data-pop="r00-types-palp" data-title="Quatre types de palpitations (EHRA 2011)">
<div class="lab">Extrasystoliques</div><p>Le patient décrit un raté, une pause, puis un coup fort. Le rythme est irrégulier, avec des battements normaux entre les ratés ; le début est soudain, souvent au repos. Le patient perçoit surtout le battement renforcé qui suit la pause.</p>
<div class="lab">Tachycardiques</div><p>Le patient décrit un cœur qui s’emballe, rapide, régulier ou irrégulier, de début et de fin brutaux. Ces palpitations peuvent s’accompagner de syncope, de dyspnée, de fatigue ou de douleur thoracique. Elles orientent vers une tachycardie par réentrée ou une fibrillation auriculaire.</p>
<div class="lab">Liées à l’anxiété</div><p>Le rythme est régulier et peu rapide, sans dépasser la fréquence maximale théorique pour l’âge. Le début et la fin sont progressifs, en lien avec un stress. Les symptômes associés sont des fourmillements, une sensation de boule dans la gorge, une dyspnée avec soupirs.</p>
<div class="lab">Pulsatiles</div><p>Le patient sent son cœur « cogner », à fréquence normale et rythme régulier, souvent à l’effort. Ce type évoque une contraction vigoureuse : insuffisance aortique volumineuse, fièvre, anémie.</p>
<div class="lab">Limite</div><p>Cette classification est une aide à l’orientation. Elle ne remplace pas l’enregistrement ; un patient peut décrire plusieurs types. Source : Raviele A et al., Europace 2011;13:920–934, tableau 2.</p></template>

<template data-pop="r00-seuils-fc" data-title="Seuils de fréquence cardiaque">
<div class="lab">Adulte au repos</div><p>La tachycardie se définit par une fréquence supérieure à 100/min. L’ESC 2021 sur la stimulation cardiaque définit la bradycardie par une fréquence inférieure à 50/min. L’ancienne limite de 60/min classait comme anormaux beaucoup d’adultes sains, surtout sportifs ou âgés.</p>
<div class="lab">Pourquoi ces seuils sont conventionnels</div><p>Ils décrivent une distribution de fréquences chez des adultes au repos ; ils ne décrivent pas un état pathologique. Une fréquence de 46/min chez un cycliste et de 46/min chez une patiente de 84 ans qui chute n’ont pas la même signification.</p>
<div class="lab">Enfant</div><p>La fréquence normale décroît avec l’âge, du nouveau-né à l’adolescent, car le cœur de l’enfant compense un petit volume d’éjection par la fréquence. Les seuils de l’adulte ne s’appliquent donc pas : il faut se référer à des courbes par âge.</p>
<div class="lab">Sommeil et sportif</div><p>Pendant le sommeil, la fréquence de l’adulte jeune peut descendre sous 50/min sans signification pathologique. Chez le sportif d’endurance, une bradycardie sinusale asymptomatique est une adaptation à l’entraînement.</p>
<div class="lab">Conséquence pratique</div><p>Le chiffre déclenche une analyse ; la décision dépend des symptômes, de la tolérance et du contexte.</p></template>

<template data-pop="r00-levine" data-title="Échelle de Levine : intensité des souffles">
<div class="lab">Six grades</div><p>Au grade <b>1/6</b>, le souffle est très faible, audible seulement dans le calme et couvert par le bruit respiratoire. Au grade <b>2/6</b>, il est faible mais nettement audible. Au grade <b>3/6</b>, il est fort, sans frémissement palpable. Au grade <b>4/6</b>, il est fort et s’accompagne d’un frémissement. Au grade <b>5/6</b>, il est très fort et audible avec le stéthoscope à peine posé. Au grade <b>6/6</b>, il est audible sans stéthoscope, ou avec le stéthoscope décollé du thorax.</p>
<div class="lab">Valeur clinique</div><p>Un frémissement définit au moins le grade 4 : il n’existe pas dans un souffle innocent. Un souffle de grade 3 ou plus justifie une échocardiographie chez l’adulte (ACC/AHA 2006–2008). Un souffle innocent de l’enfant ne dépasse pratiquement jamais 3/6 (DGPK 2017).</p>
<div class="lab">Limites</div><p>La cotation varie d’un examinateur à l’autre, surtout entre les grades 2 et 3. L’intensité dépend du débit et de la morphologie du thorax ; elle ne mesure pas la sévérité d’une lésion.</p>
<div class="lab">Source</div><p>Freeman et Levine ont décrit cette échelle en 1933 ; les définitions reprennent le tableau 1 de la recommandation DGPK 2017.</p></template>

<template data-pop="r00-b3" data-title="Troisième bruit (B3)">
<div class="lab">Mécanisme</div><p>Le B3 survient au début de la diastole, environ 120 à 180 ms après B2, à la fin du remplissage rapide. Le flux qui entre dans le ventricule est brusquement freiné par la paroi ventriculaire, qui vibre.</p>
<div class="lab">Physiologique ou pathologique</div><p>Chez l’enfant, l’adulte jeune, le sportif et la femme enceinte, un B3 peut être physiologique : le remplissage est rapide et le ventricule compliant. Après 40 ans environ, il évoque une surcharge de volume ou une dysfonction ventriculaire : insuffisance cardiaque, fuite mitrale importante.</p>
<div class="lab">Technique</div><p>Le B3 est un son grave, mieux entendu à l’apex avec la cloche posée légèrement, en décubitus latéral gauche, car ce son de basse fréquence s’atténue si la peau est tendue.</p>
<div class="lab">Piège</div><p>Un dédoublement de B2 ou un claquement d’ouverture mitrale peut être confondu avec un B3 ; le claquement est plus précoce et plus sec.</p></template>

<template data-pop="r00-b4" data-title="Quatrième bruit (B4)">
<div class="lab">Mécanisme</div><p>Le B4 survient juste avant B1. L’oreillette se contracte contre un ventricule rigide, et le sang propulsé fait vibrer la paroi ventriculaire.</p>
<div class="lab">Causes</div><p>Le B4 se rencontre dans l’hypertrophie ventriculaire hypertensive, le rétrécissement aortique, la cardiomyopathie hypertrophique et l’ischémie aiguë, car l’oreillette se contracte alors contre un ventricule rigide. Il est fréquent chez le sujet âgé.</p>
<div class="lab">Conséquence pratique</div><p>Le B4 exige une contraction auriculaire : il disparaît en fibrillation auriculaire. Sa présence chez un patient qui décrit des palpitations irrégulières plaide contre une fibrillation permanente au moment de l’examen.</p></template>

<template data-pop="r00-clic" data-title="Clics systoliques">
<div class="lab">Clic d’éjection</div><p>Le clic d’éjection est un bruit sec et aigu, en début de systole, juste après B1. Il traduit l’ouverture brusque d’une valve aortique ou pulmonaire anormale, souvent bicuspide ou sténosée mais encore mobile. La DGPK le définit comme un bruit protosystolique bref, parfois métallique, dû à l’ouverture d’une valve sigmoïde pathologique.</p>
<div class="lab">Clic mésosystolique</div><p>Le clic mésosystolique est un bruit sec au milieu de la systole, parfois suivi d’un souffle télésystolique. Il traduit la mise en tension brutale d’un feuillet mitral qui prolabe dans l’oreillette.</p>
<div class="lab">Manœuvres</div><p>Se lever ou pousser lors d’une manœuvre de Valsalva réduit le volume ventriculaire : le prolapsus survient plus tôt, et le clic se rapproche de B1. S’accroupir fait l’inverse.</p>
<div class="lab">Conséquence pratique</div><p>Un clic n’existe pas dans un souffle innocent. Sa présence justifie une échocardiographie (ACC/AHA 2006–2008, classe I pour un souffle avec clic d’éjection).</p></template>

<template data-pop="r00-claquement" data-title="Claquement d’ouverture mitrale">
<div class="lab">Mécanisme</div><p>Dans le rétrécissement mitral, les feuillets épaissis et fusionnés s’ouvrent brusquement en début de diastole, sous l’effet de la pression élevée de l’oreillette gauche. Leur arrêt brutal produit un bruit sec.</p>
<div class="lab">Valeur</div><p>Le claquement précède le roulement diastolique. Plus il est proche de B2, plus la pression auriculaire est élevée, donc plus le rétrécissement est serré.</p>
<div class="lab">Limite</div><p>Il disparaît quand les feuillets sont calcifiés et immobiles. L’échocardiographie mesure la surface mitrale (<a href="#/entry/I34">I34</a>).</p></template>

<template data-pop="r00-frottement" data-title="Frottement péricardique">
<div class="lab">Mécanisme</div><p>Les feuillets du péricarde enflammés frottent l’un contre l’autre à chaque mouvement du cœur. Le bruit est râpeux, superficiel, souvent à trois composantes : systole ventriculaire, remplissage rapide, systole auriculaire.</p>
<div class="lab">Technique</div><p>Le médecin ausculte le patient penché en avant, en expiration, la membrane appuyée au bord gauche du sternum, car cette position rapproche le cœur de la paroi. Le frottement persiste en apnée, ce qui le distingue d’un frottement pleural.</p>
<div class="lab">Valeur et limites</div><p>Il est très spécifique de la péricardite, mais fugace : son absence n’exclut pas le diagnostic. Un épanchement abondant peut le faire disparaître.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin recherche une tamponnade par la turgescence jugulaire, l’hypotension et le pouls paradoxal (<a href="#/entry/I30">I30</a>).</p></template>

<template data-pop="r00-weber" data-title="Cohorte de Weber et Kapoor (1996)">
<div class="lab">Population</div><p>Cette cohorte a inclus 190 patients consécutifs consultant pour des palpitations dans un centre universitaire américain, avec un entretien structuré, un dépistage psychiatrique et un suivi à un an chez 96 % d’entre eux.</p>
<div class="lab">Résultats</div><p>Une cause a été trouvée chez 84 % des patients : elle était cardiaque dans 43 % des cas, psychiatrique dans 31 % et diverse dans 10 %, et restait inconnue dans 16 %. L’anamnèse, l’examen, l’ECG et la biologie suffisaient pour 40 % des causes. À un an, la mortalité atteignait 1,6 %, les AVC 1,1 % et la récidive 75 %.</p>
<div class="lab">Lecture critique</div><p>L’étude est ancienne, monocentrique et hospitalière. Les enregistrements prolongés modernes trouveraient peut-être plus d’arythmies. Le chiffre de 31 % décrit une population ; il ne permet pas d’attribuer les symptômes d’un patient à l’anxiété sans enregistrement.</p>
<div class="lab">Source</div><p>La référence est Weber et Kapoor, Am J Med 1996;100:138–148, <a data-reference-source="1" href="https://doi.org/10.1016/s0002-9343(97)89451-x" target="_blank" rel="noopener noreferrer">doi:10.1016/s0002-9343(97)89451-x</a> (résumé PubMed lu le 08.10.2026).</p></template>

<template data-pop="r00-lessmeier" data-title="Tachycardies supraventriculaires prises pour un trouble panique">
<div class="lab">Constat</div><p>Dans l’étude de Lessmeier et al. (1997), la tachycardie supraventriculaire restait méconnue après le premier bilan chez 55 % des patients, pendant 3,3 ans en médiane. Les médecins non psychiatres avaient attribué les symptômes à la panique, à l’anxiété ou au stress chez plus de la moitié d’entre eux.</p>
<div class="lab">Pourquoi l’erreur</div><p>L’ECG de repos est normal entre les accès. Les symptômes adrénergiques d’une tachycardie rapide, comme l’angoisse, les sueurs et la dyspnée, ressemblent à ceux d’une attaque de panique. Beaucoup de patients étaient des femmes jeunes, chez qui l’anxiété est souvent évoquée en premier.</p>
<div class="lab">Enregistrement</div><p>Le Holter ne captait la tachycardie que chez 9 % des patients, contre 47 % avec un enregistreur d’événements. Après un traitement guidé par l’exploration, le plus souvent une ablation, 86 % des patients n’avaient plus de symptômes.</p>
<div class="lab">Conséquence pratique</div><p>Des palpitations régulières, rapides, de début et de fin brutaux, justifient un enregistrement pendant l’accès, quel que soit le profil psychique. Source : Arch Intern Med 1997;157:537–543.</p></template>

<template data-pop="r00-sclerose" data-title="Sclérose valvulaire aortique">
<div class="lab">Définition</div><p>Les cuspides aortiques sont épaissies ou calcifiées, mais s’ouvrent normalement ; la vitesse maximale du jet reste au plus de 2,5 m/s. Il n’y a pas d’obstruction.</p>
<div class="lab">Clinique</div><p>La sclérose aortique donne un souffle systolique d’éjection doux au foyer aortique, avec un B2 conservé et un pouls carotidien normal. Ces deux derniers signes la distinguent d’un rétrécissement serré, car une valve encore mobile se ferme normalement et ne freine pas l’éjection.</p>
<div class="lab">Fréquence et pronostic</div><p>Dans la <i>Cardiovascular Health Study</i>, 29 % des personnes de 65 ans ou plus avaient une sclérose et 2 % un rétrécissement. Le risque relatif de décès cardiovasculaire était d’environ 1,5 après ajustement chez les patients sclérosés (Otto et al., N Engl J Med 1999;341:142–147).</p>
<div class="lab">Interprétation</div><p>Cette association ne démontre pas que la valve cause les décès. La sclérose partage les facteurs de risque de l’athérosclérose et en est probablement un marqueur. Une partie des patients évolue vers un rétrécissement : un nouveau symptôme d’effort ou une diminution de B2 justifie une échocardiographie.</p></template>

<template data-pop="r00-potentiation" data-title="Battement post-extrasystolique renforcé">
<div class="lab">Mécanisme mécanique</div><p>L’extrasystole survient tôt : le ventricule s’est peu rempli et éjecte peu. La pause qui suit prolonge le remplissage, ce qui augmente le volume télédiastolique et, selon la loi de Frank-Starling, la force du battement suivant.</p>
<div class="lab">Mécanisme cellulaire</div><p>Pendant la pause, le réticulum sarcoplasmique accumule davantage de calcium. Le battement suivant libère plus de calcium et la contraction est plus forte : c’est la potentiation post-extrasystolique.</p>
<div class="lab">Traduction clinique</div><p>Le patient décrit une pause puis un coup fort. Au pouls, l’extrasystole est souvent imperceptible, et le battement suivant est ample.</p>
<div class="lab">Application à l’auscultation</div><p>Après une pause, un souffle de rétrécissement aortique augmente, car le débit traverse l’orifice avec plus de force ; un souffle de fuite mitrale varie peu.</p></template>

<template data-pop="r00-reentree-debut" data-title="Réentrée : pourquoi le début est brutal">
<div class="lab">Mécanisme</div><p>Une réentrée exige un circuit fait de deux voies aux propriétés différentes, un bloc unidirectionnel dans l’une d’elles et une conduction assez lente pour que le tissu ait récupéré au retour de l’influx. Une extrasystole qui tombe au bon moment bloque dans une voie, conduit lentement par l’autre et remonte par la première : le circuit tourne.</p>
<div class="lab">Conséquence clinique</div><p>La fréquence atteint son plateau dès le premier tour, en un battement. L’accès s’arrête aussi d’un coup, quand un bloc interrompt le circuit. Le patient décrit un « interrupteur ».</p>
<div class="lab">Comparaison</div><p>La tachycardie sinusale accélère et ralentit progressivement, en suivant le tonus sympathique et les catécholamines circulantes.</p>
<div class="lab">Conséquence thérapeutique</div><p>Une manœuvre vagale ou l’adénosine bloque transitoirement le nœud auriculoventriculaire. Si le circuit passe par le nœud, il s’interrompt : c’est le cas des réentrées intranodales et des tachycardies par voie accessoire (<a href="#/entry/I47">I47</a>).</p></template>

<template data-pop="r00-grenouille" data-title="Signe de la grenouille">
<div class="lab">Description</div><p>Le signe de la grenouille désigne des pulsations jugulaires rapides, régulières et amples pendant une tachycardie, que le patient décrit parfois comme des battements dans le cou ; elles apparaissent quand l’oreillette se contracte contre une valve tricuspide fermée.</p>
<div class="lab">Mécanisme</div><p>Dans une réentrée intranodale typique, l’oreillette et le ventricule se dépolarisent presque en même temps. L’oreillette se contracte contre une valve tricuspide fermée : le sang reflue dans les veines jugulaires à chaque battement, produisant des ondes en canon régulières.</p>
<div class="lab">Valeur</div><p>Le signe oriente vers une réentrée intranodale. Il n’est ni constant ni parfaitement spécifique ; il ne remplace pas l’ECG pendant l’accès.</p>
<div class="lab">Comparaison</div><p>Dans un bloc auriculoventriculaire complet ou une tachycardie ventriculaire avec dissociation, les ondes en canon sont irrégulières, car oreillette et ventricule battent indépendamment.</p></template>

<template data-pop="r00-tachy-sinus" data-title="Causes de tachycardie sinusale secondaire">
<div class="lab">Principe</div><p>Le nœud sinusal est normal ; il accélère parce que l’organisme demande plus de débit ou parce que les catécholamines augmentent. Traiter la cause fait baisser la fréquence.</p>
<div class="lab">Besoin de débit</div><p>La tachycardie sinusale accompagne l’effort, la fièvre, la grossesse, l’anémie, l’hypoxémie et le sepsis. Dans l’anémie, la baisse du contenu artériel en oxygène est compensée par l’augmentation du débit, donc de la fréquence.</p>
<div class="lab">Baisse du volume circulant</div><p>Hypovolémie, hémorragie, déshydratation : le volume d’éjection diminue et la fréquence augmente pour maintenir le débit. Une tachycardie peut précéder l’hypotension lors d’un saignement.</p>
<div class="lab">Excès hormonal ou adrénergique</div><p>Hyperthyroïdie, qui augmente le nombre et la sensibilité des récepteurs β ; phéochromocytome ; hypoglycémie, qui déclenche une décharge d’adrénaline ; douleur, anxiété ; sevrage d’alcool.</p>
<div class="lab">Maladies graves</div><p>Dans l’embolie pulmonaire, l’insuffisance cardiaque et la tamponnade, la tachycardie compense une chute du volume d’éjection. Une tachycardie sinusale inexpliquée chez un patient dyspnéique fait donc évoquer une embolie pulmonaire.</p>
<div class="lab">Piège</div><p>Ralentir une tachycardie sinusale compensatrice par un bêtabloquant supprime la compensation et peut précipiter une hypotension.</p></template>

<template data-pop="r00-substances" data-title="Substances et palpitations">
<div class="lab">Caféine</div><p>Antagoniste des récepteurs de l’adénosine ; à forte dose, elle augmente la libération de catécholamines. Dans l’essai randomisé CRAVE (2023), les jours avec café comptaient environ 50 % d’extrasystoles ventriculaires en plus, sans effet significatif sur les extrasystoles auriculaires, critère principal de l’essai. L’effet existe mais reste modeste en valeur absolue, et il varie d’un individu à l’autre (<a href="#/entry/I49">I49</a>).</p>
<div class="lab">Boissons énergisantes</div><p>Elles associent caféine, taurine et sucres ; des cas d’arythmies et d’allongement du QT ont été rapportés lors de consommations importantes.</p>
<div class="lab">Alcool</div><p>Une consommation aiguë importante peut déclencher une fibrillation auriculaire ; une consommation chronique favorise le remodelage auriculaire (<a href="#/entry/I48">I48</a>).</p>
<div class="lab">Nicotine, cocaïne, amphétamines</div><p>Elles libèrent ou potentialisent les catécholamines. La cocaïne bloque aussi les canaux sodiques et peut provoquer des tachycardies ventriculaires et une ischémie.</p>
<div class="lab">Conduite</div><p>Le médecin fait un inventaire quantifié et non jugeant. Il propose un essai de réduction et vérifie l’effet sur les symptômes.</p></template>

<template data-pop="r00-panique" data-title="Trouble panique et palpitations">
<div class="lab">Clinique</div><p>Une attaque de panique est une montée brutale de peur intense, maximale en quelques minutes, avec des symptômes physiques : palpitations, sueurs, tremblements, dyspnée, douleur thoracique, vertiges, peur de mourir. Le trouble panique associe des attaques récurrentes inattendues et une inquiétude persistante quant à leur retour.</p>
<div class="lab">Pourquoi la confusion</div><p>Une tachycardie supraventriculaire provoque aussi angoisse, sueurs et dyspnée ; l’attaque de panique provoque une tachycardie sinusale réelle. Le début brutal se rencontre dans les deux. La fin brutale, l’arrêt par une manœuvre vagale et une fréquence très élevée, au-delà de 150/min, orientent davantage vers une tachycardie.</p>
<div class="lab">Diagnostic</div><p>C’est un diagnostic positif, fondé sur des critères psychiatriques, et non un diagnostic par défaut. Il ne se pose toutefois en cause des palpitations qu’après corrélation symptôme-rythme ou en l’absence de signe d’alarme et d’arguments pour une arythmie.</p>
<div class="lab">Coexistence</div><p>Un patient peut avoir à la fois une arythmie et un trouble anxieux ; une tachycardie méconnue peut d’ailleurs entretenir une anxiété secondaire, qui disparaît après ablation.</p></template>

<template data-pop="r00-tsi" data-title="Tachycardie sinusale inappropriée">
<div class="lab">Définition (ESC 2019)</div><p>La tachycardie sinusale inappropriée se définit par une fréquence sinusale de repos supérieure à 100/min et une fréquence moyenne sur 24 heures supérieure à 90/min, sans cause secondaire. Les symptômes sont souvent invalidants : palpitations, fatigue et intolérance à l’effort.</p>
<div class="lab">Mécanisme</div><p>Le mécanisme est mal connu ; il associerait un automatisme sinusal accru, une hypersensibilité aux catécholamines et un déséquilibre autonome. La maladie touche surtout des femmes jeunes.</p>
<div class="lab">Diagnostic</div><p>Il exige d’éliminer les causes secondaires : anémie, hyperthyroïdie, déconditionnement, substances, phéochromocytome, syndrome de tachycardie orthostatique posturale. Le Holter montre une onde P sinusale, une accélération progressive et une fréquence moyenne élevée.</p>
<div class="lab">Traitement (ESC 2019)</div><p>Le médecin corrige d’abord les facteurs favorisants et propose un réentraînement à l’effort. Ensuite, il peut prescrire l’ivabradine seule ou associée à un bêtabloquant (classe IIa), ou un bêtabloquant seul (classe IIa). L’ivabradine est employée en Suisse hors de son indication autorisée.</p>
<div class="lab">Piège</div><p>Une tachycardie atriale issue de la région du nœud sinusal peut avoir une onde P très proche de l’onde sinusale ; son début brutal la distingue.</p></template>

<template data-pop="r00-brady-medic" data-title="Médicaments bradycardisants">
<div class="lab">Freinage sinusal et nodal</div><p>Bêtabloquants, y compris le timolol en collyre ; vérapamil et diltiazem, qui bloquent les canaux calciques des nœuds ; digoxine, qui augmente le tonus vagal ; amiodarone, qui bloque plusieurs courants et les récepteurs β.</p>
<div class="lab">Blocage du courant If</div><p>Ivabradine : elle ralentit le sinus sans agir sur le nœud auriculoventriculaire.</p>
<div class="lab">Tonus cholinergique accru</div><p>Donépézil, rivastigmine et galantamine inhibent l’acétylcholinestérase ; l’acétylcholine s’accumule aussi au niveau des nœuds. Des syncopes bradycardes sont décrites chez les patients âgés traités pour une démence.</p>
<div class="lab">Autres</div><p>Clonidine, qui réduit le tonus sympathique ; lithium, qui peut provoquer une dysfonction sinusale.</p>
<div class="lab">Piège</div><p>Les collyres bêtabloquants passent dans la circulation par la muqueuse nasale et échappent au premier passage hépatique. Le patient ne les mentionne pas toujours comme des médicaments.</p>
<div class="lab">Conséquence</div><p>Une bradycardie médicamenteuse se corrige par l’arrêt ou la réduction du médicament ; l’ESC 2021 ne recommande pas de stimulation pour une bradycardie due à une cause corrigible (classe III). Si le médicament reste indispensable, une stimulation peut se discuter (<a href="#/entry/I44">I44</a>).</p></template>
