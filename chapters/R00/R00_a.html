<div class="chap-body">
<section class="ilot" id="r00-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une enseignante de 34 ans consulte au cabinet pour des « coups dans la poitrine » qui surviennent depuis trois mois, surtout le soir ; de plus, elle est essoufflée en montant les escaliers. Or, son pouls est à 108/min au repos et l’auscultation révèle un souffle systolique doux au foyer pulmonaire. Dès lors, deux questions se posent à la fois : <b>ces palpitations traduisent-elles une arythmie, et ce souffle est-il une maladie du cœur ou un simple souffle de débit ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, comprendre que R00 et R01 codent des symptômes et des signes, qui ouvrent une démarche au lieu de la conclure. Ensuite, appliquer la règle centrale de l’EHRA 2011 : une arythmie ne se diagnostique que sur un enregistrement pris pendant le symptôme. Enfin, distinguer un <button class="w" data-k="r00-innocent">souffle innocent</button> d’un souffle qui impose une échocardiographie. En revanche, les arythmies elles-mêmes sont traitées dans les cours I47, I48 et I49, et les valvulopathies dans I34 et I35 ; ce cours n’en retient donc que la démarche qui y conduit.</p>
</section>
<section class="ilot" id="r00-1"><h2><span class="n">1</span>Définitions et codage</h2>
<p>Il faut d’abord définir les mots. Les palpitations sont la perception consciente, et désagréable, des battements du cœur ; la tachycardie de l’adulte au repos est une fréquence supérieure à 100/min, et la bradycardie une fréquence inférieure à 50/min selon l’ESC 2021, comme le précisent les <button class="w" data-k="r00-seuils-fc">seuils de fréquence cardiaque</button>. Un souffle, enfin, est un bruit prolongé produit par un écoulement sanguin turbulent.</p>
<p>Le codage traduit ensuite une logique clinique. En effet, R00 et R01 ne sont corrects que tant qu’aucun diagnostic précis n’explique le symptôme ; ainsi, dès qu’un enregistrement documente une tachycardie par réentrée intranodale, le code devient I47, et dès qu’une échocardiographie montre un rétrécissement aortique, il devient I35. Le tableau suivant relie donc chaque sous-code à son aboutissement habituel.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Aboutissement habituel</th></tr>
<tr><td><b>R00.0</b></td><td>Tachycardie, sans précision</td><td>Tachycardie sinusale secondaire, ou arythmie à documenter (I47, I48)</td></tr>
<tr><td><b>R00.1</b></td><td>Bradycardie, sans précision</td><td>Bradycardie physiologique, médicamenteuse ou conductive (I44, I49)</td></tr>
<tr><td><b>R00.2</b></td><td>Palpitations</td><td>Extrasystoles, tachycardie, anxiété, cause systémique</td></tr>
<tr><td><b>R00.3</b></td><td>Activité électrique sans pouls</td><td>Arrêt cardiaque (cours I46)</td></tr>
<tr><td><b>R00.8</b></td><td>Autres anomalies du rythme</td><td>Irrégularité à caractériser par l’ECG</td></tr>
<tr><td><b>R01.0</b></td><td>Souffle bénin et anodin (fonctionnel)</td><td>Souffle innocent de l’enfant, souffle de débit</td></tr>
<tr><td><b>R01.1</b></td><td>Souffle cardiaque, sans précision</td><td>Valvulopathie ou shunt à rechercher (I34, I35, Q21)</td></tr>
<tr><td><b>R01.2</b></td><td>Autres bruits cardiaques</td><td>Frottement cardiaque, bruits du cœur assourdis ou indistincts, à interpréter</td></tr></table>
<p>Ce tableau se lit donc comme un point de départ : chaque ligne renvoie à un diagnostic à prouver. C’est pourquoi il faut ensuite comprendre d’où naissent la sensation et le bruit.</p>
</section>
<section class="ilot" id="r00-2"><h2><span class="n">2</span>Physiopathologie</h2>
<p>Normalement, le cœur bat sans être perçu. La palpitation naît donc d’un changement de fréquence, de régularité ou de force, que l’<button class="w" data-k="r00-interoception">intéroception</button> amplifie plus ou moins selon l’attention et l’émotion. Ainsi, après une extrasystole, la pause compensatrice prolonge le remplissage ventriculaire ; par conséquent, le battement suivant éjecte un volume plus grand, selon le phénomène de <button class="w" data-k="r00-potentiation">potentiation post-extrasystolique</button>, et c’est lui que la patiente ressent comme un « coup ». De même, dans une <button class="w" data-k="r00-reentree-debut">tachycardie par réentrée</button>, le début et la fin sont brutaux, car le circuit s’établit puis s’interrompt d’un seul battement.</p>
<p>Le souffle obéit, en revanche, à une loi physique. En effet, un écoulement devient <button class="w" data-k="r00-turbulence">turbulent</button> lorsque sa vitesse augmente ou que le diamètre du conduit change brusquement ; or, selon l’<button class="w" data-k="r00-bernoulli">équation de Bernoulli simplifiée</button>, la vitesse croît avec le gradient de pression. Par conséquent, un souffle naît soit d’un débit accru à travers une valve normale, comme dans l’anémie, la fièvre ou la grossesse, soit d’un orifice rétréci, d’une fuite ou d’un shunt.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Le « coup » suivi d’une pause évoque une extrasystole ; le début et la fin brutaux évoquent une réentrée ; l’accélération et le ralentissement progressifs évoquent une tachycardie sinusale. De même, un souffle doux qui disparaît avec la correction de l’anémie est un souffle de débit.</div>
</section>
<section class="ilot" id="r00-3"><h2><span class="n">3</span>Étiologies</h2>
<p>Les causes se classent ensuite selon le mécanisme, car ce classement guide l’examen utile. D’abord, les arythmies : dans la cohorte de <button class="w" data-k="r00-weber">Weber et Kapoor</button>, une cause cardiaque était trouvée chez 43 % des 190 patients, et une cause psychiatrique chez 31 %. Ensuite, la <button class="w" data-k="r00-tachy-sinus">tachycardie sinusale secondaire</button> répond à un besoin de débit, fièvre, anémie, hypovolémie, hyperthyroïdie ou embolie pulmonaire ; dans ce cas, le nœud sinusal est normal, et c’est la cause qu’il faut traiter.</p>
<p>De plus, les <button class="w" data-k="r00-substances">substances et médicaments</button>, caféine, alcool, cocaïne, salbutamol ou sevrage d’un bêtabloquant, accélèrent le cœur, alors que les <button class="w" data-k="r00-brady-medic">médicaments bradycardisants</button> expliquent souvent une bradycardie du sujet âgé. Enfin, le <button class="w" data-k="r00-panique">trouble panique</button> est un diagnostic d’exclusion, jamais un point de départ ; à l’inverse, la <button class="w" data-k="r00-tsi">tachycardie sinusale inappropriée</button> exige d’avoir éliminé toutes les causes secondaires.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Le médecin attribue des palpitations à l’anxiété sans enregistrement. Or, une tachycardie par réentrée provoque elle-même de l’angoisse ; c’est pourquoi l’EHRA 2011 demande de prouver le rythme avant de conclure.</div>
