<template data-pop="i61-sm-vigilance" data-title="Vigilance abaissée et coma : mécanisme et valeur"><p>L’éveil dépend de la formation réticulée activatrice ascendante du tronc cérébral. Le coma est une altération de l’éveil qui n’est pas immédiatement réversible : seules des stimulations douloureuses entraînent encore une réponse motrice. Il résulte d’une souffrance diffuse du cortex ou d’une atteinte de la formation réticulée.</p><p>Dans l’hémorragie intracérébrale, un grand hématome abaisse la vigilance parce que la pression intracrânienne monte et que le thalamus et le tronc sont comprimés. Une stupeur ou un coma indique un grand hématome qui touche la formation réticulée du tronc.</p><p>Valeur : dans une revue systématique de 19 études prospectives, le coma a un rapport de vraisemblance de 6,2 (intervalle de confiance à 95 % de 3,2 à 12) pour l’AVC hémorragique contre l’infarctus. Il ne suffit pas au diagnostic.</p><p>Piège : une sédation, une crise ou un état de mal non convulsif abaissent aussi la vigilance. La liste bernoise des causes d’aggravation les recherche systématiquement.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. — Clinical Features of Intracerebral Hemorrhage (J Stroke 2017;19:3–10)</a> ; <a href="https://doi.org/10.1001/jama.2010.754" target="_blank" rel="noopener" data-reference-source="1">Runchey et McGee (JAMA 2010;303:2280–2286)</a> ; <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), p. 16-17</a>.</p></template>
<template data-pop="i61-sm-cephalee" data-title="Céphalée : mécanisme et valeur"><p>La céphalée est fréquente dans l’hémorragie intracérébrale, surtout lorsque l’hématome est volumineux. Trois mécanismes l’expliquent : la traction sur les fibres douloureuses des méninges, l’élévation de la pression intracrânienne et la présence de sang dans le LCS.</p><p>Technique : le médecin précise l’heure de début, le mode d’installation, l’intensité et les signes associés (vomissements, baisse de vigilance, déficit).</p><p>Valeur : son rapport de vraisemblance est de 2,9 (intervalle de 1,7 à 4,8). Elle déplace donc peu la probabilité d’hémorragie.</p><p>Piège : un petit hématome profond s’accompagne rarement de céphalée. Son absence n’écarte pas l’hémorragie.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. (J Stroke 2017;19:3–10)</a> ; <a href="https://doi.org/10.1001/jama.2010.754" target="_blank" rel="noopener" data-reference-source="1">Runchey et McGee (JAMA 2010;303:2280–2286)</a>.</p></template>
<template data-pop="i61-sm-vomissements" data-title="Vomissements : mécanisme et valeur"><p>Les vomissements surviennent chez environ la moitié des patients atteints d’hémorragie hémisphérique. Ils sont plus fréquents dans l’hémorragie cérébelleuse et sont habituellement associés à l’hypertension intracrânienne.</p><p>Valeur : leur rapport de vraisemblance est de 3,0 (intervalle de 1,7 à 5,5).</p><p>Piège : chez un patient qui vomit, titube et devient somnolent sans paralysie, il faut penser à l’hématome cérébelleux. Le scanner doit inclure la fosse postérieure.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. (J Stroke 2017;19:3–10)</a> ; <a href="https://doi.org/10.1001/jama.2010.754" target="_blank" rel="noopener" data-reference-source="1">Runchey et McGee (JAMA 2010;303:2280–2286)</a>.</p></template>
<template data-pop="i61-sm-crise" data-title="Crise épileptique : fréquence et valeur"><p>Les crises précoces touchent environ un patient sur sept ; la plupart surviennent au début de l’hémorragie ou peu après. Une revue coréenne les rapporte chez environ 10 % des patients, avec une prédominance dans les hémorragies lobaires, et les situe au début du saignement ou dans les 24 premières heures.</p><p>L’atteinte du cortex, un âge inférieur à 65 ans, un volume supérieur à 10 ml et une crise dans les 7 premiers jours identifient les patients à risque de crises tardives.</p><p>Valeur : une crise qui accompagne le déficit porte un rapport de vraisemblance de 4,7 (intervalle de 1,6 à 14) en faveur de l’hémorragie.</p><p>Conséquence : une crise clinique se traite par un antiépileptique, mais la prophylaxie systématique n’est pas recommandée. Une crise ou un état de mal non convulsif doit aussi être recherché devant toute aggravation.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. (J Stroke 2017;19:3–10)</a> ; <a href="https://doi.org/10.1001/jama.2010.754" target="_blank" rel="noopener" data-reference-source="1">Runchey et McGee (JAMA 2010;303:2280–2286)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 16-17</a>.</p></template>
<template data-pop="i61-sm-raideur" data-title="Raideur de nuque : valeur et limite"><p>La raideur de nuque porte un rapport de vraisemblance de 5,0 (intervalle de 1,9 à 12,8) en faveur de l’AVC hémorragique dans la revue systématique de 2010.</p><p>Limite : les sources lues pour cette leçon ne décrivent ni la technique standardisée de sa recherche, ni son mécanisme dans l’hémorragie intracérébrale. Cette lacune est consignée dans le rapport de la mission. La recherche des signes méningés relève du cours consacré à l’hémorragie sous-arachnoïdienne (I60).</p><p class="src">Source : <a href="https://doi.org/10.1001/jama.2010.754" target="_blank" rel="noopener" data-reference-source="1">Runchey et McGee (JAMA 2010;303:2280–2286)</a>.</p></template>
<template data-pop="i61-sm-hemiparesie" data-title="Hémiparésie et syndrome pyramidal"><p>La capsule interne concentre les fibres motrices descendantes. Un hématome des noyaux gris ou du thalamus qui l’atteint donne un déficit sensitivomoteur du côté opposé.</p><p>Le syndrome pyramidal associe un déficit moteur, des réflexes ostéotendineux vifs, diffusés et polycinétiques, et un signe de Babinski. La paralysie faciale centrale prédomine sur le bas du visage, car les muscles du haut du visage reçoivent une commande des deux hémisphères.</p><p>Technique : la manœuvre de Barré (bras tendus, 10 secondes) et celle de Mingazzini (jambes fléchies à 90°, 5 secondes) dépistent un déficit discret. La cotation muscle par muscle va de 0 à 5.</p><p>Piège : une nouvelle parésie homolatérale ou l’aggravation d’une parésie est un signe d’hypertension intracrânienne selon le protocole bernois ; elle impose un scanner de contrôle.</p><p class="src">Sources : <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. (J Stroke 2017;19:3–10)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 16-17</a>.</p></template>
<template data-pop="i61-sm-ataxie" data-title="Ataxie et syndrome cérébelleux"><p>Le cervelet coordonne le mouvement sans commander la force. Le syndrome cérébelleux associe une marche ébrieuse à polygone élargi, une dysmétrie, un tremblement d’action et une dysarthrie.</p><p>Technique : le médecin fait réaliser les épreuves doigt-nez et talon-genou, puis observe la marche si l’état le permet.</p><p>Conséquence : dans la fosse postérieure, espace étroit, un hématome cérébelleux peut comprimer le tronc et l’aqueduc. Il provoque alors une hydrocéphalie et un engagement ; la recommandation européenne de 2025 retient son évacuation au-delà de 15 ml.</p><p class="src">Sources : <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-sm-mydriase" data-title="Mydriase : mécanisme et urgence"><p>Normalement, l’éclairement d’une rétine contracte la pupille du même côté (réflexe photomoteur) et celle du côté opposé (réflexe consensuel). Le nerf oculomoteur (III) porte la commande de la contraction pupillaire, de l’élévation de la paupière et de la plupart des muscles de l’œil.</p><p>Une mydriase aréactive unilatérale évoque un engagement temporal avec atteinte du nerf III. Une mydriase aréactive bilatérale traduit une souffrance mésencéphalique diffuse. Le protocole bernois note que le trouble pupillomoteur est le plus souvent une dilatation lorsque le gonflement est sus-tentoriel.</p><p>Conséquence : une mydriase nouvelle chez un patient qui saigne impose un scanner immédiat et un avis neurochirurgical.</p><p>Piège : une paralysie du III douloureuse avec mydriase, hors contexte d’hémorragie, fait rechercher un anévrisme intracrânien.</p><p class="src">Sources : <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 16-17</a>.</p></template>
<template data-pop="i61-sm-myosis" data-title="Myosis : mécanisme et pièges"><p>Le protocole bernois associe le myosis au gonflement sous-tentoriel. Un myosis aréactif évoque une lésion du pont, mais aussi un coma métabolique ou toxique.</p><p>Discrimination : le syndrome de Claude Bernard-Horner associe un myosis, un ptosis et une énophtalmie ; il traduit une atteinte du système nerveux autonome, le long de la carotide ou dans le tronc. Douloureux, il fait rechercher une dissection carotidienne.</p><p>Conséquence : le contexte et l’imagerie séparent ces causes ; le myosis seul ne localise pas.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 16-17</a> ; <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a>.</p></template>
<template data-pop="i61-sm-regard" data-title="Déviation du regard : technique et cotation"><p>Normalement, les yeux suivent une cible de façon conjuguée dans toutes les directions. Une hémorragie lobaire peut provoquer une déviation du regard, avec une aphasie, une négligence ou une hémianopsie. Une hémorragie sous-tentorielle peut provoquer des troubles oculomoteurs.</p><p>Technique : le médecin demande au patient de suivre son doigt. Chez le patient qui ne coopère pas, la déviation se juge sur la position spontanée des yeux et sur les mouvements réflexes.</p><p>Cotation : le NIHSS cote 1 une déviation conjuguée que l’activité volontaire ou réflexe peut vaincre, et 2 une déviation forcée. Le score préhospitalier RACE cote aussi la déviation des yeux ou de la tête, mais il cherche une occlusion d’une grosse artère, pas une hémorragie.</p><p>Chez le comateux, la possibilité d’obtenir une déviation conjuguée des deux côtés par les mouvements réflexes témoigne de l’intégrité d’une grande partie du tronc cérébral.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. (J Stroke 2017;19:3–10)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 2-3 et 62-63</a> ; <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a>.</p></template>
<template data-pop="i61-sm-barre" data-title="Manœuvres de Barré et de Mingazzini"><p>Ces manœuvres dépistent un déficit moteur discret, invisible à la simple inspection.</p><p>Technique : pour la manœuvre de Barré, le patient tient les bras tendus devant lui pendant 10 secondes. Pour celle de Mingazzini, il garde les jambes fléchies à 90° pendant 5 secondes. Le score préhospitalier RACE utilise des seuils comparables : bras tenus plus de 10 secondes et jambes plus de 5 secondes chez le sujet normal.</p><p>Lecture : un membre qui chute ou dérive avant le délai signale un déficit du côté concerné. Le médecin complète par une cotation muscle par muscle, de 0 (aucune contraction) à 5 (force normale), où 3 correspond à une contraction contre la pesanteur.</p><p>Limite : la manœuvre exige un patient qui comprend et coopère ; chez le patient somnolent, le Glasgow et les pupilles priment.</p><p class="src">Sources : <a href="https://uclouvain.be/fr/system/files/uclouvain_assetmanager/groups/cms-editors-camg/Examen%20clinique%20neurologique_congresMEDGE_30.05.26.pdf" target="_blank" rel="noopener" data-reference-source="1">Fierain — Examen clinique neurologique (Université catholique de Louvain, 30.05.2026)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 2-3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="i61-sm-aggravation" data-title="Aggravation neurologique : causes et conduite"><p>Les symptômes de l’hémorragie s’aggravent habituellement en minutes ou en heures. Une détérioration est fréquente avant comme pendant l’hospitalisation ; elle peut traduire la croissance de l’hématome ou l’aggravation de l’œdème. Sous anticoagulant, l’aggravation progresse lentement sur 24 heures chez environ la moitié des patients.</p><p>Devant toute aggravation, la liste bernoise recherche un saignement, une hypertension intracrânienne, une crise ou un état de mal non convulsif, une infection et une sédation.</p><p>Conduite : l’équipe refait un scanner sans délai et contacte la neurochirurgie lorsque des signes d’hypertension intracrânienne apparaissent.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5307940/" target="_blank" rel="noopener" data-reference-source="1">An et coll. (J Stroke 2017;19:3–10)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois (08/2026), p. 16-17 et 44-45</a>.</p></template>
<template data-pop="i61-sm-rv" data-title="Rapport de vraisemblance : calcul"><p>Ce que l’on calcule. La probabilité d’hémorragie après un signe, à partir de la probabilité avant le signe et du rapport de vraisemblance de ce signe.</p><p>Formule. Cote avant = probabilité / (1 − probabilité). Cote après = cote avant × rapport. Probabilité après = cote après / (1 + cote après).</p><p>Exemple. Dans la revue de 2010, 24 % des patients avaient un AVC hémorragique. Cote avant : 0,24 / 0,76 = 0,32. Avec un coma (rapport 6,2) : 0,32 × 6,2 = 1,96, soit une probabilité de 1,96 / 2,96 = 66 %. Avec un souffle cervical (rapport 0,12) : 0,32 × 0,12 = 0,038, soit environ 4 %.</p><p>Intervalles de confiance à 95 % : coma 3,2 à 12 ; raideur de nuque 1,9 à 12,8 ; crise 1,6 à 14 ; diastolique supérieure à 110 mmHg 1,4 à 14 ; vomissements 1,7 à 5,5 ; céphalée 1,7 à 4,8 ; souffle cervical 0,03 à 0,47 ; AIT antérieur 0,18 à 0,65. Score de Siriraj supérieur à 1 : 5,7 (4,4 à 7,4) ; inférieur à −1 : 0,29 (0,23 à 0,37) ; entre −1 et 1 : 0,94 (0,77 à 1,1).</p><p>Limite : aucun signe ni aucune association de signes n’est diagnostique chez tous les patients ; la certitude exige l’imagerie.</p><p class="src">Source : <a href="https://doi.org/10.1001/jama.2010.754" target="_blank" rel="noopener" data-reference-source="1">Runchey et McGee — Does this patient have a hemorrhagic stroke? (JAMA 2010;303:2280–2286), revue systématique de 19 études prospectives, 6438 patients</a>.</p></template>
