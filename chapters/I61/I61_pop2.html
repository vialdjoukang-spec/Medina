<template data-pop="i61-praxbind" data-title="Praxbind : monographie suisse"><h3>Produit et indication</h3><p>Praxbind (idarucizumab), Boehringer Ingelheim, est autorisé en Suisse sous le numéro 65804 (information de mars 2021) ; le flacon contient 2,5 g/50 ml et l’usage est hospitalier. Il inverse l’effet anticoagulant du dabigatran (Pradaxa) en cas de saignement grave incontrôlable ou d’intervention urgente.</p><h3>Mécanisme</h3><p>L’idarucizumab est un fragment d’anticorps monoclonal humanisé (Fab) dirigé contre le dabigatran. Il s’y lie avec une très forte affinité (constante de dissociation de 2,1 ± 0,6 pmol/l), environ 300 fois plus puissante que celle du dabigatran pour la thrombine, et neutralise le dabigatran et ses métabolites.</p><h3>Preuve clinique</h3><p>L’étude non contrôlée à un bras REVERSE-AD a inclus 503 patients (301 avec un saignement sévère, 202 nécessitant une intervention urgente), d’âge médian 78 ans. Chez la plupart, la réversion complète de l’effet anticoagulant (temps de thrombine dilué : 98,7 %, temps d’écarine : 82,2 %, aPTT : 92,5 % des patients évaluables) a été observée dans les 4 premières heures après 5 g. Cent un patients sont décédés ; des événements thrombotiques ont touché 34 patients, tous attribués à l’affection sous-jacente selon la fiche. La recommandation européenne note l’absence d’essai randomisé ; l’usage immédiat à la dose standard est suggéré (consensus 15 sur 15).</p><h3>Posologie</h3><p>5 g (2 × 2,5 g/50 ml) en deux perfusions consécutives de 5 à 10 minutes ou en bolus. Une seconde dose de 5 g est envisageable en cas de récidive hémorragique avec temps de coagulation encore allongés. Pas d’adaptation chez l’âgé ni en insuffisance hépatique ; non étudié chez l’enfant. Berne applique des critères cliniques proches de ceux de l’andexanet (début depuis moins de 6 heures, NIHSS inférieur à 36, Glasgow supérieur à 6, volume de 1 à 60 ml, dernière prise remontant à moins de 15 heures ou taux supérieur à 100 ng/ml, mRS préalable inférieur à 3, alors que l’andexanet n’exclut qu’un mRS supérieur à 3).</p><h3>Effets indésirables</h3><p>Protéinurie transitoire fréquente (pic à 4 heures, normalisation en 12 à 24 heures).</p><h3>Contre-indications et précautions</h3><p>Aucune contre-indication. Hypersensibilité à évaluer contre le bénéfice. La dose contient 4 g de sorbitol (intolérance héréditaire au fructose : en cas de nécessité seulement, surveillance intensive de 24 heures) et 50 mg de sodium. Grossesse : aucune donnée, utilisable si le bénéfice dépasse le risque.</p><h3>Surveillance</h3><p>Paramètres de coagulation (temps de thrombine, temps de coagulation à l’écarine) avant, puis à 12 et 24 heures : du dabigatran libre peut réapparaître jusqu’à 24 heures. Reprise du dabigatran possible 24 heures après si l’état est stable et l’hémostase adéquate.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680658040011" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Praxbind (idarucizumab), Boehringer Ingelheim, autorisation 65804, mise à jour mars 2021</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-prothromplex" data-title="Prothromplex NF 500 : monographie suisse"><h3>Produit et indication</h3><p>Prothromplex NF 500 (Takeda, autorisation suisse 41330, information de septembre 2023) est un concentré de complexe prothrombinique contenant les facteurs II, VII, IX et X. Il est indiqué dans les hémorragies aiguës et la prophylaxie peropératoire en cas de déficit acquis (traitement anticoagulant oral, carence en vitamine K, hépatopathie, coagulation intravasculaire disséminée après élimination de la cause) ou congénital.</p><h3>Mécanisme</h3><p>Les facteurs II, VII, IX et X sont synthétisés dans le foie par une voie dépendante de la vitamine K et forment ensemble le complexe prothrombinique. En cas de déficit de l’un d’eux, la coagulation est perturbée et un traitement de substitution est nécessaire : le concentré apporte directement ces facteurs.</p><h3>Preuve clinique</h3><p>La rubrique « Efficacité clinique » de la fiche indique « aucune donnée ». La recommandation européenne note que le concentré normalise l’INR plus efficacement que le plasma frais congelé (rapport de cotes ajusté 30,6).</p><h3>Posologie</h3><p>Un flacon contient 500 UI de facteur IX, 500 UI de facteur X, 417 UI de facteur VII et 375 à 708 UI de facteur II dans 17 ml. Dose en cas de déficit acquis : augmentation souhaitée du temps de Quick (en %) × poids (kg) × 1,2. Sous anticoagulant oral avec hémorragie aiguë, 2400 UI maîtrisent l’hémorragie chez l’adulte de poids normal ; en cas d’hémorragie sévère, viser un temps de Quick normal ; des doses supplémentaires de 1200 à 2400 UI sont possibles toutes les 6 à 12 heures. Berne : 30 UI/kg.</p><h3>Effets indésirables</h3><p>Thromboembolie, infarctus, accident vasculaire cérébral, embolie pulmonaire, surtout en administration répétée.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité ; coagulation intravasculaire disséminée ou hyperfibrinolyse ; allergie à l’héparine ou antécédent de thrombopénie induite par l’héparine. Hypercoagulabilité possible sous antivitamine K. Produit dérivé du plasma (risque infectieux résiduel, parvovirus B19).</p><h3>Surveillance</h3><p>Avis d’un spécialiste de la coagulation ; INR au lit à 15 minutes, puis au moins une fois par jour ; reprise de l’anticoagulation à envisager.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680413300015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Prothromplex NF 500, Takeda, autorisation 41330, mise à jour septembre 2023</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-beriplex" data-title="Beriplex P/N : monographie suisse"><h3>Produit et indication</h3><p>Beriplex P/N 500/1000 (CSL Behring, autorisation suisse 00665, information d’octobre 2022) est un concentré de complexe prothrombinique à 4 facteurs. Il est indiqué dans la prophylaxie périopératoire et le traitement des hémorragies lors d’un déficit acquis (p. ex. sous antivitamine K) lorsqu’une correction rapide est requise.</p><h3>Mécanisme</h3><p>Le concentré apporte les facteurs de coagulation dépendants de la vitamine K (II, VII, IX, X). La fiche rappelle que le complexe formé par la thromboplastine tissulaire et le facteur VIIa active les facteurs X et IX, que la prothrombine devient thrombine et que la fibrine se constitue sous l’action de celle-ci. La correction est obtenue environ 30 minutes après l’injection.</p><h3>Preuve clinique</h3><p>La fiche rapporte que le produit augmente rapidement la concentration plasmatique des facteurs dépendants de la vitamine K et corrige de façon transitoire le trouble de coagulation. La recommandation européenne distingue 30 à 50 UI/kg si l’INR est de 2,0 ou plus et 10 UI/kg si l’INR est de 1,3 à 1,9, avec de la vitamine K par voie intraveineuse (consensus 15 sur 15).</p><h3>Posologie</h3><p>Dose selon l’INR initial pour normaliser l’INR (inférieur à 1,3) : INR de 2,0 à 3,9 : 25 UI/kg (1 ml/kg) ; de 4,0 à 6,0 : 35 UI/kg (1,4 ml/kg) ; plus de 6,0 : 50 UI/kg (2 ml/kg). Maximum 5000 UI de facteur IX par dose unique. Une administration répétée n’est pas étayée par des données cliniques et n’est pas recommandée. Un flacon contient 400 à 620 UI (P/N 500) ou 800 à 1240 UI (P/N 1000).</p><h3>Effets indésirables</h3><p>Thrombose, coagulation intravasculaire disséminée, surtout en doses répétées.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité ; coagulopathie de consommation (à administrer après son interruption seulement) ; antécédent de thrombopénie induite par l’héparine (le produit contient de l’héparine). Surveillance étroite en cas de coronaropathie, d’infarctus, d’hépatopathie, de période opératoire, chez le nouveau-né.</p><h3>Surveillance</h3><p>INR indispensable ; associer la vitamine K (effet en 4 à 6 heures) ; envisager la reprise de l’anticoagulation au plus vite.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680006650015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Beriplex P/N, CSL Behring, autorisation 00665, mise à jour octobre 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-konakion" data-title="Konakion MM : monographie suisse"><h3>Produit et indication</h3><p>Konakion MM 10 mg/1 ml (phytoménadione, vitamine K), Cheplapharm, autorisation suisse 48112 (information de janvier 2022), est indiqué dans les hémorragies ou le risque d’hémorragie par hypoprothrombinémie sévère (facteurs II, VII, IX, X), notamment le surdosage en anticoagulants coumariniques.</p><h3>Mécanisme</h3><p>La vitamine K (phytoménadione) est un constituant d’un système de carboxylase du foie : elle intervient dans la carboxylation des facteurs de coagulation II (prothrombine), VII, IX et X, ainsi que des protéines C et S. Les coumariniques bloquent la réduction de la phytoménadione ; la vitamine K est leur antagoniste mais ne neutralise pas l’héparine (qui relève de la protamine). Elle est inefficace en cas d’hypoprothrombinémie héréditaire ou de grave insuffisance hépatique.</p><h3>Preuve clinique</h3><p>La rubrique « Efficacité clinique » de la fiche indique « aucune donnée ». La recommandation européenne retient 10 mg par voie intraveineuse avec le concentré de complexe prothrombinique (consensus 15 sur 15).</p><h3>Posologie</h3><p>Injection intraveineuse lente (au moins 30 secondes). Hémorragie grave sous anticoagulant oral : arrêter l’anticoagulant ; phenprocoumone : 5,0 à 10,0 mg par voie intraveineuse avec concentré ou plasma ; acénocoumarol : 5,0 mg en dose unique. Dans les hémorragies intracrâniennes menaçant le pronostic vital, on administre surtout des concentrés de facteurs de coagulation et on y associe le Konakion MM. Délai d’action de l’ordre de 1 à 3 heures par voie intraveineuse selon la fiche, effet sur l’INR en 4 à 6 heures selon Berne : le concentré couvre ce délai. Berne : 10 mg, à répéter selon l’INR.</p><h3>Effets indésirables</h3><p>Des réactions de type anaphylactique ont été rapportées après injection intraveineuse. Au site d’injection, une irritation locale peut survenir ; dans de rares cas apparaissent une inflammation, une atrophie ou une nécrose, parfois intenses.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité à la phytoménadione ou aux excipients. Solution limpide seulement. Les dérivés dicoumariniques antagonisent la vitamine K ; l’effet est diminué par les anticonvulsivants. Grossesse : sur stricte indication. L’ampoule de 10 mg est contre-indiquée chez l’enfant de moins de 1 an.</p><h3>Surveillance</h3><p>INR étroitement surveillé en insuffisance hépatique sévère ; INR au moins quotidien après l’inversion.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fi/id/1571?lang=fr" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Konakion MM 10 mg, Cheplapharm, autorisation 48112, mise à jour janvier 2022</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-ebrantil" data-title="Ebrantil : monographie suisse"><h3>Produit et indication</h3><p>Ebrantil i.v. (urapidil) 50 mg/10 ml, Cheplapharm, autorisation suisse 44486 (information de février 2023), est indiqué dans l’hypertension, formes urgentes, graves et résistantes, et l’hypotension contrôlée péri-opératoire.</p><h3>Mécanisme</h3><p>L’effet hypotenseur de l’urapidil tient à un abaissement, d’origine centrale et périphérique, des résistances vasculaires : il inhibe préférentiellement les récepteurs alpha-1 adrénergiques périphériques post-synaptiques, atténue la transmission nerveuse sympathique périphérique et diminue le tonus sympathique central. Une interruption du traitement n’entraîne aucune remontée tensionnelle brutale selon la fiche.</p><h3>Preuve clinique</h3><p>Dans l’hémorragie intracérébrale, il est le premier choix du protocole bernois. La recommandation européenne ne désigne pas de produit mais recommande des agents rapides à demi-vie courte et d’éviter les vasodilatateurs veineux.</p><h3>Posologie</h3><p>Patient couché. Injection de 10 à 50 mg, baisse attendue en 5 minutes, répétable. Perfusion : 250 mg dans 500 ml (4 mg/ml au plus) ou seringue de 100 mg/50 ml ; débit initial jusqu’à 2 mg/min ; entretien moyen 9 mg/h ; durée maximale 48 heures. L’ampleur de la baisse dépend de la dose perfusée dans les 15 premières minutes. Âgé : doses initiales plus faibles. Berne : 10 à 25 mg puis 5 à 40 mg/h.</p><h3>Effets indésirables</h3><p>Chute tensionnelle trop brusque (bradycardie, arrêt cardiaque) ; urticaire, angio-œdème.</p><h3>Contre-indications et précautions</h3><p>Sténose isthmique de l’aorte ; shunt artério-veineux (sauf shunt de dialyse sans effet hémodynamique) ; hypersensibilité. Prudence avec d’autres hypotenseurs, sténose aortique ou mitrale, embolie pulmonaire, insuffisance hépatique, insuffisance rénale modérée à sévère, âge avancé, cimétidine. Association aux inhibiteurs de l’enzyme de conversion non recommandée. Grossesse : non recommandé sauf bénéfice. Contient 1000 mg de propylèneglycol par ampoule.</p><h3>Surveillance</h3><p>Pression toutes les 5 minutes jusqu’à la cible deux fois de suite, puis toutes les 30 minutes pendant 2 heures, puis toutes les heures.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680444860328" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ebrantil i.v. (urapidil), Cheplapharm, autorisation 44486, mise à jour février 2023</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a>.</p></template>
<template data-pop="i61-trandate" data-title="Trandate : monographie suisse"><h3>Produit et indication</h3><p>Trandate (labétalol) 100 mg/20 ml pour injection ou perfusion, Aspen, autorisations suisses 41530 et 41529 (information de mars 2026), est indiqué dans la réduction rapide de la pression artérielle : hypertension sévère, post-infarctus immédiat, hypotension contrôlée chirurgicale.</p><h3>Mécanisme</h3><p>Le labétalol possède des propriétés alpha-bloquantes et bêta-bloquantes. Le blocage des récepteurs alpha au niveau des artérioles périphériques provoque une vasodilatation et réduit la résistance périphérique ; le bêta-blocage protège le cœur d’une sympathicotonie réflexe. La baisse tensionnelle survient ainsi sans stimulation cardiaque.</p><h3>Preuve clinique</h3><p>Deuxième choix du protocole bernois dans l’hémorragie intracérébrale. La fiche suisse ne résume pas d’essai pour cette indication.</p><h3>Posologie</h3><p>Patient couché, sans se lever pendant 3 heures. Urgence hypertensive sévère : 50 mg par voie intraveineuse lente (au moins 1 minute), répétable toutes les 5 minutes, 200 mg au total au plus ; effet maximal à 5 minutes, durée d’environ 6 heures. Perfusion : 200 mg dans 160 ml (1 mg/ml) à environ 2 mg/min. Hypertension de la grossesse : 20 mg/h, doublé toutes les 30 minutes jusqu’à 160 mg/h. Berne : 20 à 40 mg puis 60 à 120 mg/h.</p><h3>Effets indésirables</h3><p>Sous forme injectable, l’hypotension orthostatique est fréquente, surtout si la dose initiale est trop élevée ou augmentée trop vite ; les vertiges, les céphalées, la dyspnée et la fatigue sont aussi fréquents. L’insuffisance cardiaque congestive est fréquente, la bradycardie rare et le bloc cardiaque très rare ; un bronchospasme est occasionnel. Des anticorps antinucléaires apparaissent très fréquemment, sans maladie clinique. Une hyperkaliémie et une hypoglycémie, ou le masquage de ses symptômes, sont possibles (fréquence inconnue).</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité ; bloc auriculo-ventriculaire de 2e ou 3e degré sans stimulateur ; choc cardiogénique ; hypotension marquée ou bradycardie sévère (moins de 50/min) ; asthme ou BPCO ; insuffisance cardiaque non compensée ; dysfonction sinusale ; angor de Prinzmetal ; cœur pulmonaire ; infarctus aigu ; acidose métabolique ; phéochromocytome non traité ; association aux IMAO ou au vérapamil/diltiazem. Interactions : antiarythmiques de classe I et amiodarone (potentialisation), anti-inflammatoires non stéroïdiens (effet diminué), digitaliques (conduction allongée), adrénaline.</p><h3>Surveillance</h3><p>Fréquence cardiaque et pression pendant et après la perfusion ; durée d’action jusqu’à 18 heures dans certains cas.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680415300013" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Trandate i.v. (labétalol), Aspen, autorisations 41530 et 41529, mise à jour mars 2026</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-cleviprex" data-title="Cleviprex : monographie suisse"><h3>Produit et indication</h3><p>Cleviprex (clévidipine) 0,5 mg/ml, émulsion pour perfusion, Chiesi, autorisation suisse 60117 (information de juin 2020), est indiqué dans la réduction rapide de la pression artérielle en situation péri-opératoire. Son usage dans l’hémorragie intracérébrale, prévu par le protocole bernois, est donc hors indication.</p><h3>Mécanisme</h3><p>La clévidipine est un inhibiteur des canaux calciques de type L. Elle fait baisser la pression artérielle moyenne en réduisant la résistance vasculaire systémique et ne réduit pas la précharge (absence d’effet sur les vaisseaux veineux capacitifs). Sa demi-vie de 1,5 minute (recommandation européenne) permet une titration fine.</p><h3>Preuve clinique</h3><p>La recommandation européenne la cite parmi les agents rapides à demi-vie courte (1,5 minute). La fiche suisse ne résume pas d’essai dans l’hémorragie intracérébrale.</p><h3>Posologie</h3><p>Début à 2 mg/h, doublé toutes les 90 secondes ; entretien de 4 à 6 mg/h chez la plupart des patients ; maximum 32 mg/h (majorité inférieure ou égale à 16 mg/h) ; 1000 ml d’émulsion au plus par 24 heures ; données limitées au-delà de 72 heures. Berne : 2 à 16 mg/h, courte durée.</p><h3>Effets indésirables</h3><p>Les céphalées sont très fréquentes. Sont fréquents la fibrillation auriculaire, la tachycardie sinusale, l’hypotension, les rougeurs cutanées, l’hypoxie, les nausées, les lésions rénales aiguës, les œdèmes et l’augmentation des triglycérides sanguins. Dans la population péri-opératoire, l’hypotension est survenue chez 15,1 % des patients sous clévidipine, contre 14,9 % sous comparateur actif et 1,0 % sous placebo.</p><h3>Contre-indications et précautions</h3><p>Allergie à la clévidipine, au soja ou à l’œuf ; troubles du métabolisme lipidique (hyperlipidémie pathologique, néphrose lipoïdique, pancréatite aiguë avec hyperlipidémie) ; sténose aortique critique non recommandée.</p><h3>Surveillance</h3><p>L’effet disparaît 5 à 15 minutes après l’arrêt ; surveiller pendant 8 heures après une perfusion prolongée (rebond).</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680601170031" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Cleviprex (clévidipine), Chiesi, autorisation 60117, mise à jour juin 2020</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a>.</p></template>
<template data-pop="i61-catapresan" data-title="Catapresan : monographie suisse"><h3>Produit et indication</h3><p>Catapresan injectable 150 µg/ml (clonidine), CPS Cito Pharma Services (information de janvier 2023), est indiqué dans l’hypertension artérielle et la crise hypertensive (voie parentérale lente).</p><h3>Mécanisme</h3><p>Par ses propriétés stimulantes sur les récepteurs alpha-adrénergiques, la clonidine agit essentiellement sur le système nerveux central : elle diminue le tonus sympathique, les résistances périphériques, la fréquence cardiaque et la pression artérielle. L’arrêt doit être progressif (rebond).</p><h3>Preuve clinique</h3><p>Troisième choix du protocole bernois ; la rubrique « Efficacité clinique » de la fiche indique « pas de données ».</p><h3>Posologie</h3><p>Patient allongé. Injection intraveineuse très lente d’une ampoule (150 µg) diluée dans au moins 10 ml de NaCl 0,9 % sur au moins 10 minutes ; perfusion 0,2 µg/kg/min sans dépasser 0,5 µg/kg/min ; 150 µg au plus par perfusion, jusqu’à 4 fois par jour (600 µg/24 heures). Berne : 25 à 150 µg en bolus, 600 µg/24 heures au plus.</p><h3>Effets indésirables</h3><p>Une injection trop rapide peut élever transitoirement la pression systolique d’environ 20 mmHg.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité ; bradyarythmie sévère (maladie du sinus, bloc auriculo-ventriculaire de 2e ou 3e degré).</p><h3>Surveillance</h3><p>Arrêt progressif pour éviter le rebond ; fréquence cardiaque.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680331480462" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Catapresan injectable (clonidine), CPS Cito Pharma Services, mise à jour janvier 2023</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-txa" data-title="Acide tranexamique : statut dans l’HIC"><h3>Produit et indication</h3><p>Tranexamic OrPha 100 mg/ml (OrPha Swiss, autorisation suisse 69007, information de février 2024) est indiqué dans la prévention et le traitement des hémorragies dues à une fibrinolyse générale ou locale, y compris celles dues à un agent fibrinolytique. L’hémorragie intracérébrale spontanée n’est pas une indication nommée de la fiche.</p><h3>Mécanisme</h3><p>L’acide tranexamique inhibe les activités fibrinolytiques de la plasmine : il se lie au plasminogène et en empêche l’activation en plasmine.</p><h3>Preuve clinique</h3><p>La recommandation européenne juge le bénéfice et le risque incertains : l’inclusion dans un essai est recommandée et l’usage pour limiter la croissance est envisageable si l’inclusion est impossible (consensus 13 sur 15). Une méta-analyse de la recommandation donne une croissance à 24 heures réduite (rapport de cotes 0,82 ; 0,70 à 0,97) sans effet sur décès ou dépendance à 90 jours (1,00). La mise à jour 2026 (cinq essais, 2860 patients, 2 g par voie intraveineuse entre 2 et 12 heures) trouve une croissance réduite (0,81), une mortalité à 7 jours réduite (0,70) mais pas d’amélioration fonctionnelle (0,93 ; 0,81 à 1,07). Le protocole bernois note l’absence d’efficacité dans les études et l’emploie pour le saignement post-thrombolyse (1000 mg en 10 minutes).</p><h3>Posologie</h3><p>Fibrinolyse générale : 1 g par voie intraveineuse lente (1 ml/min) toutes les 6 à 8 heures (environ 15 mg/kg). Insuffisance rénale : créatinine de 120 à 249 µmol/l, 10 mg/kg toutes les 12 heures ; de 250 à 500 µmol/l, 10 mg/kg toutes les 24 heures ; plus de 500 µmol/l, 5 mg/kg toutes les 24 heures.</p><h3>Effets indésirables</h3><p>Les nausées, les vomissements et la diarrhée sont fréquents ; la dermatite allergique est occasionnelle. La fiche signale aussi, sans fréquence connue, des convulsions (surtout en cas de mésusage), des troubles visuels dont la perception des couleurs, une bradycardie ou une asystolie et un malaise hypotensif après injection trop rapide, des thromboses artérielles ou veineuses et des réactions d’hypersensibilité, dont l’anaphylaxie.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité ; thromboses veineuses ou artérielles aiguës ; coagulopathie de consommation (sauf hyperfibrinolyse prédominante avec hémorragie grave) ; insuffisance rénale grave ; antécédents de convulsions ; injection intrathécale, épidurale ou intraventriculaire et application intracérébrale (œdème cérébral, convulsions, décès).</p><h3>Surveillance</h3><p>Fonction rénale ; voie intraveineuse lente exclusivement.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680690070014" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Tranexamic OrPha (acide tranexamique), OrPha Swiss, autorisation 69007, mise à jour février 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13479682/" target="_blank" rel="noopener" data-reference-source="1">Menon et coll. — Acide tranexamique dans l’hémorragie intracérébrale aiguë spontanée, méta-analyse sur données individuelles (J Neurol Neurosurg Psychiatry 2026)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-clexane" data-title="Clexane : monographie suisse"><h3>Produit et indication</h3><p>Clexane (énoxaparine), de sanofi-aventis (suisse), se présente en seringues prêtes à l’emploi (information de février 2026). Dans la prophylaxie de la thrombose veineuse en médecine, la dose est de 40 mg par voie sous-cutanée une fois par jour, au moins 6 jours, jusqu’à mobilisation complète, 14 jours au maximum.</p><h3>Mécanisme</h3><p>L’énoxaparine est une héparine de bas poids moléculaire (environ 4500 daltons en moyenne), obtenue par dépolymérisation alcaline de l’ester benzylique de l’héparine ; la fiche exprime ses doses en unités anti-Xa.</p><h3>Preuve clinique</h3><p>Dans l’hémorragie intracérébrale, la recommandation européenne juge son bénéfice incertain ; la compression pneumatique intermittente est préférée. Le protocole bernois propose l’héparine de bas poids moléculaire après le scanner de contrôle à 24 heures ou des bas à compression pneumatique.</p><h3>Posologie</h3><p>Dose préventive de la fiche : 40 mg une fois par jour par voie sous-cutanée. La fiche ne prévoit pas de posologie spécifique à l’hémorragie intracérébrale.</p><h3>Effets indésirables</h3><p>Saignement ; thrombopénie induite par l’héparine.</p><h3>Contre-indications et précautions</h3><p>Hémorragies actives importantes et états à risque accru d’hémorragie incontrôlée, « y compris l’accident vasculaire cérébral hémorragique récent » ; antécédent de thrombopénie induite par l’héparine dans les 100 derniers jours. Cette contre-indication de la fiche entre en tension avec la recommandation : la décision est spécialisée, après imagerie de contrôle.</p><h3>Surveillance</h3><p>Numération des plaquettes ; signes de saignement ; scanner de contrôle à 24 heures avant tout début de traitement.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane (énoxaparine), sanofi-aventis, mise à jour février 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-keppra" data-title="Keppra : monographie suisse"><h3>Produit et indication</h3><p>Keppra (lévétiracétam), solution à diluer pour perfusion, UCB-Pharma, autorisation suisse 57519 (information de mai 2025), est un antiépileptique indiqué notamment dans les crises focales.</p><h3>Mécanisme</h3><p>Le mécanisme d’action du lévétiracétam n’est pas complètement élucidé. In vitro, il inhibe partiellement les canaux calciques de type N, réduit la libération de calcium des réserves intraneuronales et inverse partiellement l’effet inhibiteur du zinc et des bêta-carbolines sur les canaux GABAergiques et glycinergiques.</p><h3>Preuve clinique</h3><p>La recommandation européenne déconseille la prophylaxie primaire (recommandation faible contre) ; si un traitement est débuté après une crise symptomatique et qu’aucune crise ne récidive, un arrêt est suggéré dès 4 semaines (consensus 15 sur 15).</p><h3>Posologie</h3><p>Dilution et perfusion intraveineuse en 15 minutes ; relais entre voie intraveineuse et orale sans titration à dose identique ; pas de données par voie intraveineuse au-delà de 4 jours. Adulte de plus de 50 kg : 2 × 500 mg/jour, jusqu’à 2 × 1500 mg/jour par paliers.</p><h3>Effets indésirables</h3><p>Les effets les plus fréquents sont la somnolence, les céphalées, l’étourdissement et l’asthénie. Les troubles psychiatriques sont fréquents (dépression, hostilité, agressivité, irritabilité, insomnie) ; des idées et des comportements suicidaires ont été rapportés depuis la commercialisation. Une thrombocytopénie est peu fréquente ; une pancytopénie, une hyponatrémie et un exanthème médicamenteux avec éosinophilie et symptômes systémiques ont aussi été décrits.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité au lévétiracétam ou aux substances apparentées.</p><h3>Surveillance</h3><p>Réponse clinique et nécessité de poursuivre le traitement au-delà de 4 semaines.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680575190028" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Keppra perfusion (lévétiracétam), UCB-Pharma, autorisation 57519, mise à jour mai 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="pareto-i61-a01" data-title="Loi de Pareto — Question clinique et priorités"><p class="ratio" data-cover="i61-a01"></p><ul><li>Une faiblesse brutale ne se classe pas au lit du malade : l’imagerie cérébrale immédiate distingue hémorragie et infarctus.</li><li>Quatre informations commandent la conduite : anticoagulant et heure de la dernière prise, heure de début, pression artérielle, imagerie.</li><li>Les gestes initiaux se résument à A (inverser l’anticoagulation), B (abaisser la pression), C (contacter la neurochirurgie) et D (poursuivre le diagnostic étiologique).</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (Forum Médical Suisse 2021;21:322–328)</a>.</p></template>
<template data-pop="pareto-i61-a02" data-title="Loi de Pareto — Définition, terminologie et classification"><p class="ratio" data-cover="i61-a02"></p><ul><li>L’hémorragie intracérébrale englobe le saignement du parenchyme et des ventricules ; l’hémorragie intracrânienne y ajoute l’hémorragie sous-arachnoïdienne et les hématomes sous-dural et extradural.</li><li>Le terme « primaire » est abandonné pour que la cause reste toujours recherchée : 80 à 85 % des cas relèvent des petits vaisseaux.</li><li>Le siège oriente la cause : profond vers l’hypertension, lobaire vers l’angiopathie amyloïde, lobaire chez le jeune vers une malformation.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12952859/" target="_blank" rel="noopener" data-reference-source="1">Pensato et coll. — Classification anatomique standardisée des hémorragies intracrâniennes (Cerebrovasc Dis 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la statistique — CIM-10-GM 2024, version française (31 octobre 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a>.</p></template>
<template data-pop="pareto-i61-a03" data-title="Loi de Pareto — Épidémiologie et pronostic"><p class="ratio" data-cover="i61-a03"></p><ul><li>À Genève, l’HIC représente 13,2 cas pour 100 000 par an avec une létalité à 30 jours de 32,5 %.</li><li>À trois mois, 39,1 % des patients évalués sont indépendants et 25,1 % sont décédés dans le registre suisse.</li><li>Près d’un patient sur quatre prend un anticoagulant au moment du saignement, et la part des anticoagulants oraux directs augmente.</li></ul><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/39965170/" target="_blank" rel="noopener" data-reference-source="1">Dirren et coll. — Étude genevoise de l’AVC : incidence et létalité selon la CIM-11 (Neurology 2025;104:e213353)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38336370/" target="_blank" rel="noopener" data-reference-source="1">Hémorragie intracérébrale sous anticoagulants oraux, registres suisse et norvégien (Stroke Vasc Neurol 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20056489/" target="_blank" rel="noopener" data-reference-source="1">van Asch et coll. — Incidence, létalité et évolution fonctionnelle de l’hémorragie intracérébrale (Lancet Neurol 2010;9:167–176)</a>.</p></template>
<template data-pop="pareto-i61-a04" data-title="Loi de Pareto — Physiopathologie"><p class="ratio" data-cover="i61-a04"></p><ul><li>La rupture d’une artère perforante malade (artériopathie ou angiopathie amyloïde) déclenche l’hémorragie, mais le rôle exact des microanévrysmes reste débattu.</li><li>L’hématome grandit surtout dans les 3 premières heures ; une croissance de plus de 33 % ou de 6 ml est la définition des essais.</li><li>L’œdème élève la pression intracrânienne et le sang intraventriculaire peut provoquer une hydrocéphalie.</li><li>La toxicité du sang (thrombine, fer, radicaux libres) relève encore de la recherche : aucun traitement clinique n’est validé.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6613877/" target="_blank" rel="noopener" data-reference-source="1">Wan et coll. — Iron toxicity, lipid peroxidation and ferroptosis after intracerebral haemorrhage (Stroke Vasc Neurol 2019;4:93–95)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13479682/" target="_blank" rel="noopener" data-reference-source="1">Menon et coll. — Acide tranexamique dans l’hémorragie intracérébrale aiguë spontanée, méta-analyse sur données individuelles (J Neurol Neurosurg Psychiatry 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="pareto-i61-a05" data-title="Loi de Pareto — Topographie et formes cliniques"><p class="ratio" data-cover="i61-a05"></p><ul><li>Environ deux tiers des hémorragies sont profondes, 5 à 10 % cérébelleuses, le reste lobaire ; les proportions varient avec la population étudiée.</li><li>La capsule interne explique l’hémiparésie controlatérale ; le cervelet explique l’ataxie et le risque de compression du tronc.</li><li>La localisation guide la cause mais aussi l’urgence chirurgicale (hydrocéphalie, compression).</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="pareto-i61-a06" data-title="Loi de Pareto — Étiologies et facteurs de risque"><p class="ratio" data-cover="i61-a06"></p><ul><li>En Suisse, l’hypertension explique 46,7 % des hémorragies ; 21,4 % restent sans cause et 4,8 % sont macrovasculaires.</li><li>Les antithrombotiques favorisent la croissance de l’hématome et aggravent le pronostic ; l’angiopathie amyloïde expose à la récidive.</li><li>Chez le jeune, une cause macrovasculaire ou génétique est à chercher activement.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="pareto-i61-a07" data-title="Loi de Pareto — Diagnostics différentiels hiérarchisés"><p class="ratio" data-cover="i61-a07"></p><ul><li>L’imagerie, pas la clinique, distingue hémorragie et infarctus.</li><li>Le tableau classe les diagnostics par gravité puis fréquence ; l’hémorragie est la plus grave (létalité 32,5 % à 30 jours).</li><li>Une hémorragie de la convexité chez un sujet de moins de 60 ans oriente vers un RCVS, un PRES ou une thrombose veineuse ; après 60 ans, vers l’angiopathie amyloïde.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39965170/" target="_blank" rel="noopener" data-reference-source="1">Dirren et coll. — Étude genevoise de l’AVC : incidence et létalité selon la CIM-11 (Neurology 2025;104:e213353)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a>.</p></template>
<template data-pop="pareto-i61-a08" data-title="Loi de Pareto — Anamnèse et examen clinique"><p class="ratio" data-cover="i61-a08"></p><ul><li>Six questions précoces guident la conduite : l’antithrombotique et l’heure de la dernière prise, l’heure de début, la pression artérielle, le diagnostic différentiel du scanner, l’extension intraventriculaire et l’hypertension intracrânienne.</li><li>Le Glasgow est l’évaluation initiale la plus utile ; devant une aphasie, on adapte la communication et on documente le facteur gênant ; seule une composante réellement non testable se note NT, sans total.</li><li>En préhospitalier suisse, on ne donne aucun antithrombotique, on ne baisse la pression qu’au-delà de 220 mmHg et on transmet le nom de l’anticoagulant.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (Forum Médical Suisse 2021;21:322–328)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a>.</p></template>
<template data-pop="pareto-i61-a09" data-title="Loi de Pareto — Prise en charge aiguë"><p class="ratio" data-cover="i61-a09"></p><ul><li>A et B commencent moins de 15 minutes après le diagnostic ; C et D suivent sans attendre.</li><li>La réversion dépend de la molécule : concentré et vitamine K pour les antagonistes de la vitamine K, andexanet pour apixaban et rivaroxaban, idarucizumab pour le dabigatran, protamine pour les héparines.</li><li>La pression systolique se ramène sous 140 mmHg sans baisse de plus de 60 mmHg (Berne) ou 70 mmHg (ESO) dans l’heure.</li><li>La neurochirurgie intervient surtout pour le cervelet (plus de 15 ml), l’hydrocéphalie et la détérioration.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11658503/" target="_blank" rel="noopener" data-reference-source="1">Ouyang et coll. — Évaluation du paquet de soins ciblés dans l’essai INTERACT3 (PLOS Glob Public Health 2024)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13479682/" target="_blank" rel="noopener" data-reference-source="1">Menon et coll. — Acide tranexamique dans l’hémorragie intracérébrale aiguë spontanée, méta-analyse sur données individuelles (J Neurol Neurosurg Psychiatry 2026)</a>.</p></template>
<template data-pop="pareto-i61-a10" data-title="Loi de Pareto — Complications et prévention"><p class="ratio" data-cover="i61-a10"></p><ul><li>La pression artérielle se surveille toutes les 5 minutes jusqu’à la cible, le Glasgow et le NIHSS toutes les 6 heures.</li><li>La thromboprophylaxie commence par la compression pneumatique ; l’énoxaparine est contre-indiquée par l’information suisse dans l’AVC hémorragique récent.</li><li>Le score ICH informe le pronostic sans autoriser une limitation de soins dans les 24 premières heures.</li><li>La prévention secondaire repose sur une pression inférieure à 130/80 mmHg et une reprise individualisée des antithrombotiques.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11283388/" target="_blank" rel="noopener" data-reference-source="1">Hemphill et coll. — The ICH score (Stroke 2001;32:891–897)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane (énoxaparine), sanofi-aventis, mise à jour février 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680575190028" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Keppra perfusion (lévétiracétam), UCB-Pharma, autorisation 57519, mise à jour mai 2025</a>.</p></template>
<template data-pop="pareto-i61-a11" data-title="Loi de Pareto — Situations particulières"><p class="ratio" data-cover="i61-a11"></p><ul><li>Après 55 ans, les critères de Boston ne s’appliquent qu’en cas de déclin cognitif, d’hémorragie ou d’épisodes focaux transitoires.</li><li>Chez le jeune, un angio-scanner négatif ne suffit pas : la probabilité d’une cause macrovasculaire reste de 22,1 % sans hypertension ni microangiopathie.</li><li>La grossesse et l’enfant sont des lacunes de recommandation : on s’appuie sur les informations professionnelles suisses.</li><li>Après thrombolyse, l’acide tranexamique 1000 mg est donné en 10 minutes avec fibrinogène ou complexe prothrombinique.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9134774/" target="_blank" rel="noopener" data-reference-source="1">ESO — Recommandations sur l’AVC chez la femme : ménopause, grossesse et post-partum (Eur Stroke J 2022;7)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680658040011" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Praxbind (idarucizumab), Boehringer Ingelheim, autorisation 65804, mise à jour mars 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680415300013" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Trandate i.v. (labétalol), Aspen, autorisations 41530 et 41529, mise à jour mars 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680444860328" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ebrantil i.v. (urapidil), Cheplapharm, autorisation 44486, mise à jour février 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680690070014" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Tranexamic OrPha (acide tranexamique), OrPha Swiss, autorisation 69007, mise à jour février 2024</a> ; <a href="https://amiko.oddb.org/fi/id/1571?lang=fr" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Konakion MM 10 mg, Cheplapharm, autorisation 48112, mise à jour janvier 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="pareto-i61-a12" data-title="Loi de Pareto — Critères formels et paramètres clés"><p class="ratio" data-cover="i61-a12"></p><ul><li>L’inversion de l’anticoagulation et l’abaissement de la pression commencent en moins de 15 minutes.</li><li>Pression systolique : traiter au-delà de 160/90 mmHg, cible 140/90 mmHg ou moins, baisse maximale 60 mmHg dans l’heure (Berne) ou 70 mmHg (Europe), jamais en dessous de 120 mmHg (Berne).</li><li>INR : réversion si supérieur à 1,3 ; normalisation visée inférieure à 1,3.</li><li>Antidotes anti-Xa et dabigatran : symptômes depuis moins de 6 h, NIHSS inférieur à 36, Glasgow supérieur à 6, volume de 1 à 60 ml, dernière prise remontant à moins de 15 heures ou taux supérieur à 100 ng/ml.</li><li>Le volume se mesure par ABC/2 ; le score ICH va de 0 à 6 et n’autorise aucune décision de limitation avant 24 heures.</li><li>Pour un hématome cérébelleux de plus de 15 ml, l’évacuation est suggérée.</li><li>En prévention secondaire, la pression visée au long cours est inférieure à 130/80 mmHg. Les références sont le protocole bernois 08/2026, la recommandation ESO–EANS 2025 et la mise à jour ESO 2026 sur la pression artérielle.</li></ul><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la statistique — CIM-10-GM 2024, version française (31 octobre 2024)</a>.</p></template>
<template data-pop="pareto-i61-e01" data-title="Loi de Pareto — Imagerie"><p class="ratio" data-cover="i61-e01"></p><ul><li>Le scanner sans injection est l’examen de référence ; le protocole bernois y associe une angiographie chez tous les patients.</li><li>Un angio-scanner négatif ne suffit pas chez un patient jeune sans hypertension ni microangiopathie : la probabilité résiduelle reste de 22,1 %.</li><li>L’IRM de susceptibilité cherche microsaignements et sidérose pour appliquer les critères de Boston.</li><li>Un scanner de contrôle à 24 heures mesure la croissance de l’hématome.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29331631/" target="_blank" rel="noopener" data-reference-source="1">Rodrigues et coll. — Critères d’Édimbourg (scanner et génétique) de l’hémorragie lobaire liée à l’angiopathie amyloïde (Lancet Neurol 2018;17:232–240)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a>.</p></template>
<template data-pop="pareto-i61-e02" data-title="Loi de Pareto — Biologie et hémostase"><p class="ratio" data-cover="i61-e02"></p><ul><li>Le bilan initial associe coagulation, glycémie, troponine, toxicologie et électrocardiogramme.</li><li>Un seuil de décision (INR supérieur à 1,3) n’est pas un intervalle de référence, qui se lit chez le laboratoire.</li><li>Sous anticoagulant oral direct, un dosage spécifique à l’admission guide l’antidote.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/DMLP-CCL-LCC-RE-33-0069-V3.pdf" target="_blank" rel="noopener" data-reference-source="1">CHUV, laboratoire de chimie clinique — intervalles de référence (version du 9 juin 2026)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11658503/" target="_blank" rel="noopener" data-reference-source="1">Ouyang et coll. — Évaluation du paquet de soins ciblés dans l’essai INTERACT3 (PLOS Glob Public Health 2024)</a>.</p></template>
<template data-pop="pareto-i61-e03" data-title="Loi de Pareto — Scores et synthèse"><p class="ratio" data-cover="i61-e03"></p><ul><li>Le Glasgow, le score ICH et ABC/2 mesurent, ils ne décident pas : le score ICH n’autorise pas de limitation de soins dans les 24 heures.</li><li>Un antidote exige le respect de critères. Hors critères, le protocole bernois s’abstient de tout antidote et de tout concentré ; la recommandation européenne admet le concentré après pesée du risque thrombotique.</li><li>Un hématome cérébelleux de plus de 15 ml avec détérioration impose l’avis neurochirurgical.</li></ul><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/11283388/" target="_blank" rel="noopener" data-reference-source="1">Hemphill et coll. — The ICH score (Stroke 2001;32:891–897)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/8711791/" target="_blank" rel="noopener" data-reference-source="1">Kothari et coll. — The ABCs of measuring intracerebral hemorrhage volumes (Stroke 1996;27:1304–1305)</a> ; <a href="https://www.glasgowcomascale.org/what-is-gcs/" target="_blank" rel="noopener" data-reference-source="1">Glasgow Coma Scale — présentation de l’échelle (Teasdale et Jennett, Lancet 1974)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="pareto-i61-s01" data-title="Loi de Pareto — Anatomie vasculaire"><p class="ratio" data-cover="i61-s01"></p><ul><li>Les artères perforantes terminales irriguent les noyaux gris, la capsule interne, le thalamus et le tronc.</li><li>Les artères corticales et leptoméningées sont le siège de l’angiopathie amyloïde.</li><li>La fosse postérieure, étroite, explique le risque de compression du tronc et d’hydrocéphalie.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="pareto-i61-s02" data-title="Loi de Pareto — Histologie"><p class="ratio" data-cover="i61-s02"></p><ul><li>Lipohyalinose, nécrose fibrinoïde et microanévrysmes caractérisent l’artériopathie des perforantes ; leur rôle exact dans la rupture est débattu.</li><li>Dans l’angiopathie amyloïde, l’amyloïde remplace les cellules musculaires lisses de la média ; le rouge Congo la colore.</li><li>Les microsaignements lobaires orientent vers l’angiopathie amyloïde, les microsaignements profonds vers l’artériopathie des perforantes.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a>.</p></template>
<template data-pop="pareto-i61-s03" data-title="Loi de Pareto — Physiologie et biochimie"><p class="ratio" data-cover="i61-s03"></p><ul><li>Un hématome et son œdème élèvent la pression intracrânienne et abaissent la pression de perfusion ; aucune formule chiffrée n’a été relevée dans les sources consultées.</li><li>Le fer, l’hémoglobine et la thrombine alimentent une lésion secondaire dont les traitements restent précliniques.</li><li>Chaque antidote cible une étape précise de la coagulation : il faut d’abord identifier l’anticoagulant.</li></ul><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6613877/" target="_blank" rel="noopener" data-reference-source="1">Wan et coll. — Iron toxicity, lipid peroxidation and ferroptosis after intracerebral haemorrhage (Stroke Vasc Neurol 2019;4:93–95)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680658040011" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Praxbind (idarucizumab), Boehringer Ingelheim, autorisation 65804, mise à jour mars 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680413300015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Prothromplex NF 500, Takeda, autorisation 41330, mise à jour septembre 2023</a> ; <a href="https://amiko.oddb.org/fi/id/1571?lang=fr" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Konakion MM 10 mg, Cheplapharm, autorisation 48112, mise à jour janvier 2022</a>.</p></template>
<template data-pop="pareto-i61-s04" data-title="Loi de Pareto — Génétique"><p class="ratio" data-cover="i61-s04"></p><ul><li>La règle d’Édimbourg (hémorragie sous-arachnoïdienne plus APOE ε4 ou prolongements digitiformes) a une spécificité de 96 % et demande une validation externe.</li><li>COL4A1/COL4A2, CADASIL et Ehlers-Danlos vasculaire sont les principales maladies monogéniques à évoquer.</li><li>Le test génétique exige une indication clinique, un consentement signé et l’accord préalable de l’assureur.</li></ul><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/29331631/" target="_blank" rel="noopener" data-reference-source="1">Rodrigues et coll. — Critères d’Édimbourg (scanner et génétique) de l’hémorragie lobaire liée à l’angiopathie amyloïde (Lancet Neurol 2018;17:232–240)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template><template data-pop="pareto-i61-s05" data-title="Loi de Pareto — Biophysique de l’imagerie"><p class="ratio" data-cover="i61-s05"></p><ul><li>L’hématome passe de l’oxyhémoglobine à la désoxyhémoglobine, puis à la méthémoglobine intracellulaire et extracellulaire, enfin à l’hémosidérine et à la ferritine.</li><li>Au scanner, sa densité suit la concentration d’hémoglobine : hyperdense d’abord, isodense entre 8 jours et 1 mois selon Kidwell et Wintermark, parfois dès le cinquième jour selon une revue britannique de 2021, puis hypodense ; une anémie sévère le rend moins dense.</li><li>En IRM, l’écho de gradient reste hypointense, au moins en périphérie, à tous les stades et révèle les microsaignements invisibles au scanner ; la datation de l’hématome reste approximative.</li></ul><p class="src">Sources : <a href="https://doi.org/10.1016/S1474-4422(08)70041-3" target="_blank" rel="noopener" data-reference-source="1">Kidwell et Wintermark — Imaging of intracranial haemorrhage (Lancet Neurol 2008;7:256–267)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="pareto-i61-p01" data-title="Loi de Pareto — Classes et posologies"><p class="ratio" data-cover="i61-p01"></p><ul><li>Chaque produit suisse a son indication : la FI fixe le cadre légal, le protocole bernois la pratique.</li><li>Les doses d’antihypertenseurs se titrent vers la cible de 140 mmHg, sans baisse de plus de 60 mmHg en une heure.</li><li>Le choix de l’antidote suit la molécule identifiée : concentré et vitamine K, andexanet, idarucizumab ou protamine.</li><li>Ni l’acide tranexamique ni l’énoxaparine ne sont des traitements standard de l’hémorragie intracérébrale aiguë.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680444860328" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ebrantil i.v. (urapidil), Cheplapharm, autorisation 44486, mise à jour février 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680415300013" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Trandate i.v. (labétalol), Aspen, autorisations 41530 et 41529, mise à jour mars 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680601170031" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Cleviprex (clévidipine), Chiesi, autorisation 60117, mise à jour juin 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680331480462" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Catapresan injectable (clonidine), CPS Cito Pharma Services, mise à jour janvier 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680413300015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Prothromplex NF 500, Takeda, autorisation 41330, mise à jour septembre 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680006650015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Beriplex P/N, CSL Behring, autorisation 00665, mise à jour octobre 2022</a> ; <a href="https://amiko.oddb.org/fi/id/1571?lang=fr" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Konakion MM 10 mg, Cheplapharm, autorisation 48112, mise à jour janvier 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680658040011" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Praxbind (idarucizumab), Boehringer Ingelheim, autorisation 65804, mise à jour mars 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680698420019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sulfate de protamine LEO Pharma, autorisation 69842, mise à jour janvier 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680690070014" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Tranexamic OrPha (acide tranexamique), OrPha Swiss, autorisation 69007, mise à jour février 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680575190028" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Keppra perfusion (lévétiracétam), UCB-Pharma, autorisation 57519, mise à jour mai 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane (énoxaparine), sanofi-aventis, mise à jour février 2026</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="pareto-i61-p02" data-title="Loi de Pareto — Interactions et surveillance"><p class="ratio" data-cover="i61-p02"></p><ul><li>L’andexanet ne se donne jamais avant une héparinisation ; on évite les concentrés et le facteur VII activé après l’andexanet.</li><li>Le labétalol est contre-indiqué avec le vérapamil et le diltiazem, ainsi que dans l’asthme et la bradycardie sévère.</li><li>L’acide tranexamique intracérébral et l’énoxaparine dans l’AVC hémorragique récent sont contre-indiqués.</li><li>La surveillance dépend du produit : thromboses, INR, temps de thrombine, rebond.</li></ul><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680658040011" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Praxbind (idarucizumab), Boehringer Ingelheim, autorisation 65804, mise à jour mars 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680006650015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Beriplex P/N, CSL Behring, autorisation 00665, mise à jour octobre 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680413300015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Prothromplex NF 500, Takeda, autorisation 41330, mise à jour septembre 2023</a> ; <a href="https://amiko.oddb.org/fi/id/1571?lang=fr" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Konakion MM 10 mg, Cheplapharm, autorisation 48112, mise à jour janvier 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680444860328" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ebrantil i.v. (urapidil), Cheplapharm, autorisation 44486, mise à jour février 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680415300013" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Trandate i.v. (labétalol), Aspen, autorisations 41530 et 41529, mise à jour mars 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680601170031" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Cleviprex (clévidipine), Chiesi, autorisation 60117, mise à jour juin 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680331480462" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Catapresan injectable (clonidine), CPS Cito Pharma Services, mise à jour janvier 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680690070014" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Tranexamic OrPha (acide tranexamique), OrPha Swiss, autorisation 69007, mise à jour février 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Clexane (énoxaparine), sanofi-aventis, mise à jour février 2026</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
