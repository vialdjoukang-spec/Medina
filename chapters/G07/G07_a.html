<template id="ch-G07"><div class="chap"><div class="chap-head"><div class="code">G07 · Neurologie</div><h1>G07 — Abcès et granulomes intracrâniens et intrarachidiens au cours de maladies classées ailleurs</h1><span class="status">Auto-relecture IA de l’auteur · Aucune validation médicale humaine attestée</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie</button></div><div class="panel" id="pA"><div class="chap-body" data-semiology-clinical="G07"><section class="ilot" id="g07-question"><h2>Une lésion focale : protéger la fonction et identifier la cause</h2><p>Une céphalée inhabituelle associée à un déficit, une crise ou une baisse de vigilance fait rechercher une lésion intracrânienne menaçante. Une douleur rachidienne avec faiblesse, niveau sensitif ou trouble sphinctérien impose de rechercher une atteinte médullaire ou radiculaire. La première décision est la sécurité : stabiliser, obtenir l’imagerie adaptée et joindre les équipes neurologique, infectiologique et neurochirurgicale selon le territoire et la gravité. L’identification précise de l’agent se poursuit en parallèle.</p><p>G07* désigne des abcès et granulomes intracrâniens et intrarachidiens au cours de maladies classées ailleurs. Ce code de manifestation ne correspond ni à un agent unique ni à une ordonnance commune. La leçon part de la fonction normale et de la localisation, puis distingue l’infection causale, le degré de preuve et les risques du traitement. Les inclusions de classification guident la documentation ; elles ne remplacent pas le raisonnement clinique.</p><div class="key"><b>À retenir.</b> D’abord évaluer l’urgence et le territoire ; ensuite établir la cause et choisir un traitement spécifique. Une lésion annulaire ne prouve pas un agent.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r11">[11]</button> · <button class="w" data-k="g07-r12">[12]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r19">[19]</button></p></section><section class="ilot" id="g07-definition"><h2>Abcès et granulome : deux organisations différentes</h2><p>Un abcès est une collection purulente. Dans la tuberculose intracrânienne, une collection contenant du pus et des bacilles peut avoir une paroi sans l’organisation granulomateuse typique du tuberculome. Un granulome est une organisation de cellules inflammatoires. Le tuberculome comporte notamment des histiocytes épithélioïdes, des cellules géantes multinucléées et des lymphocytes, parfois autour d’une caséation ; une réaction astrocytaire et une capsule peuvent l’entourer. La morphologie seule ne suffit pas à établir une cause certaine.</p><table class="t"><thead><tr><th>Organisation</th><th>Ce qu’elle apporte</th><th>Ce qu’elle ne démontre pas seule</th></tr></thead><tbody><tr><td>Collection purulente</td><td>Lésion pouvant nécessiter prélèvement, drainage et contrôle de l’effet de masse.</td><td>Agent, sensibilité et durée optimale.</td></tr><tr><td>Granulome organisé</td><td>Type de réaction tissulaire, contexte et prélèvements à orienter.</td><td>Tuberculose certaine ni indication automatique d’immunosuppression.</td></tr><tr><td>Lésion méningée ou parenchymateuse</td><td>Territoire différent, complications et accès au prélèvement différents.</td><td>Équivalence entre méningite, tuberculome méningé et tuberculome cérébral.</td></tr></tbody></table><p>Une méningite tuberculeuse peut coexister avec un tuberculome, mais les données de l’une ne sont pas automatiquement les données de l’autre. De même, un granulome schistosomien et une myélite ne sont pas des synonymes administratifs. Le compte rendu précise le compartiment, le caractère expansif, les complications et le niveau de certitude étiologique.</p><div class="key"><b>À retenir.</b> Décrire le tissu et le territoire avant de nommer l’agent ou d’appliquer un code causal.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r12">[12]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section><section class="ilot" id="g07-codage"><h2>G07* est sans subdivision et accompagne une maladie causale</h2><p><button class="w" data-k="g07-asterisque">Lire le code de manifestation et ses inclusions</button></p><table class="t"><thead><tr><th>Inclusion de G07*</th><th>Code causal cité</th><th>Précision à conserver</th></tr></thead><tbody><tr><td>Abcès cérébral amibien</td><td>A06.6†</td><td>Lésion cérébrale ; ne pas confondre avec une amibiase intestinale.</td></tr><tr><td>Abcès gonococcique</td><td>A54.8†</td><td>Infection disséminée et preuve causale à documenter.</td></tr><tr><td>Abcès cérébral tuberculeux</td><td>A17.8†</td><td>Collection et agent ; ne pas appeler tout tuberculome un abcès.</td></tr><tr><td>Granulome schistosomien</td><td>B65.-†</td><td>Espèce et territoire selon les preuves disponibles.</td></tr><tr><td>Tuberculome cérébral</td><td>A17.8†</td><td>Localisation parenchymateuse.</td></tr><tr><td>Tuberculome méningé</td><td>A17.1†</td><td>Localisation méningée distincte de la seule méningite.</td></tr></tbody></table><p>Les libellés français des causes, notamment « Abcès amibien du cerveau », « Tuberculome méningé », « Autres formes de tuberculose du système nerveux » et « Autres infections gonococciques », ont été relus dans le fichier OFS. Ce fichier ne contient pas toutes les notes contextuelles. Le codage final suit la version applicable et les règles locales vérifiées, sans certifier ici une facture 2026.</p><div class="key"><b>À retenir.</b> G07 sans subdivision : documenter la manifestation et la maladie causale, sans convertir les inclusions en une liste fermée de maladies.</div><p>Sources : <button class="w" data-k="g07-r11">[11]</button> · <button class="w" data-k="g07-r12">[12]</button></p></section><section class="ilot" id="g07-epidemio"><h2>Épidémiologie suisse : conserver le bon dénominateur</h2><p>Le bulletin OFSP publié en 2026 rapporte 544 cas de tuberculose en 2025 en Suisse et au Liechtenstein, soit 6,0 pour 100000 habitants. Ces chiffres regroupent toutes les tuberculoses déclarées. Ils ne mesurent ni l’incidence de G07, ni celle du tuberculome cérébral, ni la probabilité d’une cause tuberculeuse chez un patient avec une masse cérébrale.</p><p>Les recherches et lectures réalisées n’établissent pas une incidence ou une prévalence nationale actuelle de toutes les lésions G07, avec répartition complète par âge et sexe. Les séries de tuberculomes et les observations de schistosomiase ou d’amibiase proviennent de populations et de systèmes de soins différents. Leurs proportions ne deviennent pas des statistiques suisses, et les mortalités d’un essai de méningite tuberculeuse ne deviennent pas le pronostic de tout granulome isolé.</p><table class="t"><thead><tr><th>Donnée</th><th>Population</th><th>Limite clinique</th></tr></thead><tbody><tr><td>544 cas ; 6,0/100000</td><td>Tuberculoses déclarées en Suisse et au Liechtenstein en 2025.</td><td>Pas une incidence G07.</td></tr><tr><td>499 personnes analysées dans HARVEST</td><td>Adultes avec méningite tuberculeuse dans trois pays.</td><td>Ni enfants, ni ensemble des tuberculomes isolés.</td></tr><tr><td>Lésions parasitaires rares</td><td>Revues et séries sélectionnées.</td><td>Pas de fréquence nationale suisse déduite.</td></tr></tbody></table><div class="key"><b>À retenir.</b> Nommer maladie, année, territoire et population avant tout chiffre ; garder explicite la lacune suisse propre à G07.</div><p>Sources : <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r4">[4]</button> · <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-causes"><h2>Chercher la cause sans réduire le patient à une exposition</h2><p>Les inclusions de G07 citent les atteintes tuberculeuses, amibiennes, gonococciques et schistosomiennes. Elles appellent des recherches distinctes. Une exposition ou un antécédent augmente une probabilité ; il ne démontre pas la cause d’une lésion nouvelle. Une maladie tumorale ou une autre infection peut coexister, y compris chez un patient déjà traité pour tuberculose.</p><table class="t"><thead><tr><th>Contexte</th><th>Questions orientées</th><th>Conséquence diagnostique</th></tr></thead><tbody><tr><td>Tuberculose</td><td>Contact connu, infection antérieure, traitement et observance, foyer pulmonaire ou extrapulmonaire, immunité.</td><td>Rechercher preuve microbiologique et résistances, avec bilan du système nerveux.</td></tr><tr><td>Amibiase</td><td>Séjour même ancien, signes digestifs, foyer hépatique, transmission possible par contact sexuel.</td><td>Recherche spécifique d’Entamoeba histolytica ; ne pas présumer l’espèce sur un seul examen non discriminant.</td></tr><tr><td>Schistosomiase</td><td>Contact avec de l’eau douce dans une zone de transmission, manifestations urinaires ou digestives, signes médullaires.</td><td>Tests adaptés et évaluation spécialisée de l’atteinte neurologique.</td></tr><tr><td>Infection gonococcique disséminée</td><td>Contexte d’infection sexuellement transmissible, manifestations articulaires ou systémiques, prélèvements antérieurs.</td><td>Ne pas appliquer à une lésion cérébrale la seule durée d’arthrite.</td></tr></tbody></table><p>Le statut VIH, les immunosuppresseurs, une grossesse possible, le rein, le foie et les médicaments modifient le bilan et les possibilités thérapeutiques. Une origine géographique n’est pas une preuve et ne dispense pas d’examiner les diagnostics concurrents. La confidentialité et une formulation non stigmatisante favorisent une anamnèse utilisable.</p><div class="key"><b>À retenir.</b> Relier une exposition précise à un test et à une décision ; garder ouvertes les causes concurrentes jusqu’à un degré de preuve suffisant.</div><p>Sources : <button class="w" data-k="g07-r5">[5]</button> · <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-anamnese"><h2>Reconstruire la chronologie des signes et des traitements</h2><p>Préciser céphalée, vomissements, crise, trouble du langage, faiblesse, trouble sensitif, comportement et vigilance. Distinguer apparition initiale, évolution continue et aggravation après le début du traitement. Si le rachis est concerné, demander faiblesse, niveau sensitif, marche et modification vésicosphinctérienne. Une plainte discrète peut être fonctionnellement importante ; l’entourage peut préciser une modification de comportement ou une perte d’autonomie.</p><p>Noter les dates, doses, interruptions et effets indésirables des médicaments déjà pris. Une aggravation sous antituberculeux peut correspondre à une réaction paradoxale, mais aussi à une mauvaise exposition, une résistance, une autre maladie ou une complication mécanique. La chronologie oriente ; elle ne permet pas de déclarer automatiquement la réaction paradoxale.</p><p><button class="w" data-k="g07-chronologie">Une aggravation sous traitement exige une nouvelle question clinique</button></p><div class="key"><b>À retenir.</b> Conserver l’heure des changements, la liste exacte des produits et les examens antérieurs pour rendre la décision révisable.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></section><section class="ilot" id="g07-clinique"><h2>Mesurer une fonction avant d’interpréter un signe</h2><p>Évaluer d’abord conscience, respiration, circulation et stabilité. Examiner ensuite attention, langage, nerfs crâniens, force, sensibilité, coordination et marche lorsque cela est sûr. Rechercher une asymétrie, un territoire cohérent et une évolution. Une anomalie localise une fonction perturbée ; elle ne prouve pas l’agent infectieux. Une douleur, une fatigue ou une coopération insuffisante limitent l’interprétation et doivent être notées.</p><p><button class="w" data-k="g07-force">La force musculaire : six grades, une méthode répétable</button></p><p>Une plainte visuelle sous éthambutol ne doit pas être attribuée d’emblée à une lésion cérébrale. La notice Myambutol impose une surveillance de l’acuité, du champ et des couleurs et une action urgente en cas de changement. Réciproquement, une toxicité suspectée ne dispense pas de rechercher une complication infectieuse ou compressive.</p><div class="key"><b>À retenir.</b> Décrire la fonction, la méthode et son changement ; la répétition de l’examen vaut mieux qu’un grade isolé sans contexte.</div><p>Sources : <button class="w" data-k="g07-r10">[10]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r18">[18]</button></p></section><section class="ilot" id="g07-urgence"><h2>Effet de masse et ponction lombaire : la sécurité précède le rendement</h2><p>Baisse de vigilance, déficit rapidement progressif, crise persistante ou répétée, signes de compression médullaire et détérioration générale exigent une prise en charge urgente. Une lésion expansive, une hydrocéphalie ou une hypertension intracrânienne peut rendre la ponction lombaire dangereuse. L’imagerie et l’avis spécialisé guident alors la stratégie ; le besoin de documenter une infection ne justifie pas un prélèvement dangereux.</p><p><button class="w" data-k="g07-pl">Pourquoi une ponction lombaire n’est pas systématique</button></p><p>L’absence d’un seuil de diamètre universel n’interdit pas d’agir : localisation, effet mécanique, hydrocéphalie, état clinique et accessibilité du prélèvement comptent. Il ne faut pas attendre une triade complète, une preuve microbiologique finale ou une échéance arbitraire lorsque la fonction se dégrade.</p><div class="key"><b>À retenir.</b> Stabilisation, imagerie et avis urgent en parallèle ; pas de ponction lombaire automatique devant une lésion focale menaçante.</div><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></section>
