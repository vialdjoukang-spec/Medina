<template data-pop="g07-r1" data-k="g07-r1"><h3>[1] Tuberculose en Suisse : guide OFSP et Ligue pulmonaire</h3><p>Le guide suisse distingue le schéma usuel de tuberculose et la méningite tuberculeuse : après deux mois de quatre médicaments, la continuation par isoniazide et rifampicine dure dix mois dans la méningite, soit douze mois au total. Cela ne définit pas à lui seul la durée d’un tuberculome isolé. Les doses adultes du tableau sont H 5 (4–6), R 10 (8–12), Z 25 (20–30) et E 15 (15–20) mg/kg/j. Le bilan et les interactions précèdent le traitement. Le chapitre financier décrit le rôle des assurances et du canton, sans dispense générale de participation aux coûts.</p><p><b>Passages lus :</b> Chapitre 7.1, pages 36–38 : traitement et tableau 7-1 ; chapitre 6 : interactions ; chapitre 11, pages 55–56 : assurances et coordination cantonale. <b>Population :</b> Tuberculose en Suisse ; tableaux adultes et enfants distincts. <b>Version :</b> V1.2024. <b>Limites :</b> Lecture ciblée ; pas tous les chapitres. Le tuberculome isolé ne reçoit pas automatiquement la durée de méningite. Guide 2024 confronté à l’essai de 2025.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — OFSP et Ligue pulmonaire suisse</a></p></template>
<template data-pop="g07-r2" data-k="g07-r2"><h3>[2] Rifampicin Labatec : information professionnelle</h3><p>La dose usuelle adulte de rifampicine pour la tuberculose est de 10 (8–12) mg/kg/j, au maximum 600 mg/j dans cette spécialité. La FI de Rifampicin Labatec contre-indique une clairance de créatinine inférieure à 25 ml/min et les atteintes hépatiques sévères citées. La rifampicine inhibe la polymérase bactérienne de l’acide ribonucléique et induit puissamment les enzymes et transporteurs humains : les interactions doivent être revues au début et à l’arrêt. Les règles propres à une association fixe restent distinctes.</p><p><b>Passages lus :</b> Doses adultes et patients de plus de douze ans, rein et foie, voies orale et intraveineuse, contre-indications pertinentes, mécanisme, interactions et date. <b>Population :</b> Adulte et enfant de plus de 12 ans pour les doses citées. <b>Version :</b> Octobre 2023. <b>Limites :</b> Pas une lecture de toutes les situations et de tous les médicaments associés. Ne pas appliquer le maximum de cette spécialité à toute association fixe.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680502640015" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r3" data-k="g07-r3"><h3>[3] Essai de rifampicine à forte dose dans la méningite tuberculeuse</h3><p>L’essai HARVEST compare 35 et 10 mg/kg/j de rifampicine pendant huit semaines chez des adultes avec méningite tuberculeuse. L’analyse porte sur 499 personnes ; le critère principal ne montre pas de bénéfice de survie à six mois. Les estimations de mortalité de Kaplan–Meier sont 44,6 % et 40,7 %, avec un rapport de risque de 1,17 (intervalle de confiance à 95 % : 0,89–1,54 ; p = 0,25). Ce résultat ne valide pas une augmentation empirique et ne concerne ni les enfants ni le tuberculome isolé.</p><p><b>Passages lus :</b> Résumé, méthodes, résultats et discussion du texte principal de l’essai HARVEST ; identité et population vérifiées. <b>Population :</b> Adultes avec méningite tuberculeuse en Indonésie, Afrique du Sud et Ouganda. <b>Version :</b> Décembre 2025. <b>Limites :</b> Suppléments et tous les tableaux non relus. Adultes avec méningite, pas enfant ni tuberculome isolé. Estimations de Kaplan–Meier distinguées des proportions brutes.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7618564/" target="_blank" rel="noopener noreferrer">Consulter la source — HARVEST, essai international publié dans le New England Journal of Medicine</a></p></template>
<template data-pop="g07-r4" data-k="g07-r4"><h3>[4] Tuberculose en 2025 : bulletin OFSP 2026</h3><p>L’OFSP recense 544 cas de tuberculose en 2025 en Suisse et au Liechtenstein, soit 6,0 pour 100000 habitants. Ce sont toutes les tuberculoses déclarées, pas les lésions G07. Le bulletin décrit la déclaration médicale lorsque le diagnostic est confirmé et qu’au moins trois antituberculeux sont commencés, ainsi que la déclaration de laboratoire et de l’issue du traitement. Le délai réglementaire exact n’a pas été établi par cette lecture.</p><p><b>Passages lus :</b> Section 2 : déclaration ; section 3.1, tableaux 1–2 et démographie de section 3.2. <b>Population :</b> Suisse et Liechtenstein ; ensemble des tuberculoses déclarées. <b>Version :</b> 2026, données 2025. <b>Limites :</b> Données de toutes les tuberculoses déclarées en Suisse et au Liechtenstein ; pas une incidence G07. Délai exact de déclaration non vérifié.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://www.bag.admin.ch/dam/it/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — OFSP, Bulletin tuberculose</a></p></template>
<template data-pop="g07-r5" data-k="g07-r5"><h3>[5] BASHH 2025 : traitement de l’infection gonococcique</h3><p>Le guide britannique BASHH 2025 traite l’infection gonococcique disséminée. Il distingue notamment arthrite et méningite, avec des durées différentes et un recours spécialisé. Il ne fournit pas de durée validée propre à l’abcès cérébral gonococcique. Le document n’est pas un guide IUSTI 2025. Une durée de sept jours pour l’arthrite ne devient donc jamais la durée d’un abcès cérébral.</p><p><b>Passages lus :</b> Identité du guide et passage sur infection disséminée, arthrite, méningite et endocardite. <b>Population :</b> Infection gonococcique disséminée, méningite et endocardite ; pas de protocole validé d’abcès cérébral. <b>Version :</b> 2025. <b>Limites :</b> Guide britannique, pas IUSTI. Pas de protocole validé de durée d’abcès cérébral. Les chiffres de syndromes voisins ne sont pas extrapolés.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://www.bashh.org/_userfiles/pages/files/fiferetal2025britishassociationofsexualhealthandhivuknationalguidelineforthemanagementofinfection_1.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — British Association for Sexual Health and HIV, Fifer et coll.</a></p></template>
<template data-pop="g07-r6" data-k="g07-r6"><h3>[6] Payne et coll. : actualisation sur la schistosomiase</h3><p>La revue européenne décrit les lésions cérébrales ou médullaires liées aux œufs de schistosomes et à la réaction inflammatoire de l’hôte. Une atteinte neurologique requiert une prise en charge urgente et spécialisée. Certains centres emploient des schémas prolongés ou renforcés de praziquantel et des corticoïdes, sans démontrer un schéma universel. Le risque de strongyloïdose sous corticoïdes doit être évalué. Aucune FI suisse de praziquantel n’a été retrouvée par les requêtes réalisées ; cela ne prouve pas une absence d’accès au médicament.</p><p><b>Passages lus :</b> Passages neurologiques, diagnostic, traitement et limites des pratiques de centres. <b>Population :</b> Schistosomiase, dont complications neurologiques ; pratiques de certains centres. <b>Version :</b> 2023. <b>Limites :</b> Revue, pas FI suisse de praziquantel. Schémas de centres non universels. Ancienne directive allemande échue non utilisée comme recommandation actuelle.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://researchonline.lshtm.ac.uk/id/eprint/4671297/7/Payne-etal-2023-An-update-on-schistosomiasis.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Payne, Chiodini et Bustinduy, manuscrit de synthèse University College London et London School of Hygiene and Tropical Medicine</a></p></template>
<template data-pop="g07-r7" data-k="g07-r7"><h3>[7] Guide international de méningite tuberculeuse</h3><p>Le guide international recommande les tests moléculaires adaptés et la culture dans la méningite tuberculeuse ; un résultat négatif n’exclut pas la maladie. Une ponction lombaire n’est réalisée que si elle est sûre : une lésion expansive ou une hypertension intracrânienne peut imposer l’imagerie et une autre stratégie. Les corticoïdes sont fortement recommandés dans la méningite sans VIH, avec décision individualisée en présence du VIH. Les données sur le moment de la chirurgie des tuberculomes restent limitées ; cela n’abolit pas l’urgence d’un effet de masse.</p><p><b>Passages lus :</b> Résumé, diagnostic, traitement adjuvant, réactions paradoxales, soins neurologiques et neurochirurgie, encadrés 1–4 et légende complète de figure 1. <b>Population :</b> Méningite tuberculeuse ; ne pas généraliser à tout granulome isolé. <b>Version :</b> En ligne 2025, publication finale 2026. <b>Limites :</b> Sections ciblées, pas tous les suppléments. Périmètre méningite conservé ; recommandations non extrapolées à toute masse isolée. Essai récent lu séparément.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12419961/" target="_blank" rel="noopener noreferrer">Consulter la source — Tuberculous Meningitis International Research Consortium, guide international</a></p></template>
<template data-pop="g07-r8" data-k="g07-r8"><h3>[8] Rimstar : information professionnelle</h3><p>Chaque comprimé de Rimstar contient 150 mg de rifampicine, 75 mg d’isoniazide, 400 mg de pyrazinamide et 275 mg de chlorhydrate d’éthambutol. Le tableau pondéral standard concerne une tuberculose non compliquée ; la FI renvoie explicitement à des recommandations détaillées pour le système nerveux central. La clairance inférieure à 30 ml/min et les situations hépatiques ou oculaires citées sont des contre-indications. Le praziquantel est contre-indiqué avec cette association. Les maxima et seuils ne sont pas interchangeables avec chaque produit séparé.</p><p><b>Passages lus :</b> Composition, indications, doses standard et tableau pondéral, qualification des atteintes du système nerveux, rein, foie, contre-indications pertinentes, surveillance, mécanismes et date. <b>Population :</b> Association fixe Rimstar ; tableau standard pour tuberculose non compliquée. <b>Version :</b> Avril 2026. <b>Limites :</b> Tableau standard non utilisé comme calcul automatique cérébral. Notice ciblée ; pas toutes les situations particulières relues. Seuils et maxima distincts des produits séparés.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680567680032" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r9" data-k="g07-r9"><h3>[9] Pyrazinamide Labatec : information professionnelle</h3><p>La FI de Pyrazinamide Labatec décrit 25 (20–30) mg/kg/j, au maximum 2 g/j chez l’adulte et le patient de plus de dix ans, en prise quotidienne après le repas. Elle contre-indique notamment une clairance inférieure à 50 ml/min, la grossesse et l’allaitement, et impose une surveillance hépatique. Des paragraphes rénaux ne doivent pas servir à effacer la contre-indication explicite. L’activité dépend du milieu acide ; la résistance ne peut être réputée absente dans toutes les espèces de mycobactéries.</p><p><b>Passages lus :</b> Doses, contexte compliqué, rein, contre-indications, surveillance hépatique, grossesse, mécanisme et date. <b>Population :</b> Pyrazinamide Labatec, adulte et patient de plus de 10 ans. <b>Version :</b> Octobre 2022. <b>Limites :</b> Notice ciblée. Tension entre contre-indication rénale et autres paragraphes signalée, sans prescription harmonisée de mémoire. Formulation ancienne sur la résistance non généralisée.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680576990023" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r10" data-k="g07-r10"><h3>[10] Myambutol : information professionnelle</h3><p>Myambutol contient du chlorhydrate d’éthambutol. La FI distingue une dose initiale pouvant atteindre 25 mg/kg/j et une phase ultérieure à 15 mg/kg/j, avec adaptation rénale particulière. Elle impose un examen oculaire initial puis toutes les quatre semaines, plus rapproché en cas d’atteinte rénale. Une modification de l’acuité, du champ ou des couleurs requiert une action urgente ; des séquelles visuelles peuvent persister. Les différences de seuils ou de mécanismes entre notices ne sont pas harmonisées de mémoire.</p><p><b>Passages lus :</b> Composition, doses initiales et ultérieures, tableau rénal, risques et contrôles oculaires, limites pédiatriques, mécanisme et date. <b>Population :</b> Myambutol ; traitement antituberculeux, surveillance oculaire et rénale. <b>Version :</b> Août 2024. <b>Limites :</b> Frontières rénales ambiguës non arrondies. Mécanismes formulés différemment dans deux notices : aucune cible moléculaire unique inventée.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680331530013" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r11" data-k="g07-r11"><h3>[11] OFS : fichier français de la CIM-10-GM 2024</h3><p>Le fichier français officiel identifie G07* comme code terminal, sans subdivision sous-code à décimale. Les libellés des causes associées ont été lus, notamment A06.6, A17.1, A17.8 et A54.8. Le fichier donne des libellés et une structure ; il ne contient pas toutes les inclusions, exclusions et règles contextuelles et ne certifie pas une facturation 2026.</p><p><b>Passages lus :</b> Introduction, date de validité, structure des colonnes et lignes G07, A06.6, A17.1, A17.8, A54.8 et B65. <b>Population :</b> Libellés suisses du fichier des codes ; application annoncée au 1er janvier 2025. <b>Version :</b> CIM-10-GM 2024 française, export du 31 octobre 2024. <b>Limites :</b> Fichier de libellés et structure sans toutes les inclusions ou exclusions ; pas une certification de codage ou facturation 2026.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g07-r12" data-k="g07-r12"><h3>[12] BfArM : entrée G07* de la classification 2024</h3><p>L’entrée G07* décrit les abcès et granulomes intracrâniens et intrarachidiens au cours de maladies classées ailleurs. Les inclusions citent abcès amibien (A06.6), gonococcique (A54.8), tuberculeux (A17.8), granulome schistosomien (B65.-), tuberculome cérébral (A17.8) et méningé (A17.1). Ces inclusions ne sont pas une liste exhaustive de toutes les causes possibles. La lésion et la maladie causale doivent être documentées séparément.</p><p><b>Passages lus :</b> Entrée complète G07*, notes et six inclusions causales ; complément du fichier français OFS. <b>Population :</b> Entrée G07* et ses inclusions ; complément du fichier français. <b>Version :</b> 2024. <b>Limites :</b> Classification allemande 2024, pas une règle de facturation suisse actuelle. Inclusions non présentées comme liste exclusive de toutes les causes.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM, classification ICD-10-GM</a></p></template>
<template data-pop="g07-r13" data-k="g07-r13"><h3>[13] Metronidazole SINT i.v. : information professionnelle</h3><p>Le flacon de Metronidazole SINT i.v. contient 500 mg pour 100 ml et 326 mg de sodium. La FI décrit une activité contre des anaérobies et Entamoeba histolytica, sans schéma spécifique validé de lésion cérébrale amibienne. La durée usuelle courte de la notice ne détermine pas seule celle d’une infection cérébrale rare. Une prolongation exceptionnelle doit être justifiée et surveillée, notamment par l’hémogramme et l’examen neurologique. Ataxie, confusion, myoclonies ou paresthésies peuvent annoncer une toxicité.</p><p><b>Passages lus :</b> Composition, indications et spectre, doses générales, durée et prolongation, rein et foie, risques neurologiques, contre-indications pertinentes, mécanisme et date. <b>Population :</b> Metronidazole SINT i.v. ; infections anaérobies et spectre antiparasitaire, sans dose cérébrale amibienne spécifique. <b>Version :</b> Février 2026. <b>Limites :</b> Schéma général anaérobie et spectre antiparasitaire ne démontrent pas une dose cérébrale amibienne. Produit distinct de la présentation B. Braun, notamment pour le sodium.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680708870018" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r14" data-k="g07-r14"><h3>[14] Dexamethasone Galepharm Amp : information professionnelle</h3><p>Dexamethasone Galepharm Amp 4 mg par 1 ml exprime une masse de phosphate correspondant à 3,32 mg de dexaméthasone ; 8 mg par 2 ml correspondent à 6,64 mg de base. Aucune équivalence avec un comprimé n’est déduite silencieusement. Les schémas généraux d’œdème et les schémas pédiatriques de la FI ne constituent pas une dose adulte universelle de méningite tuberculeuse. L’effet immunosuppresseur et la nécessité d’un sevrage adapté sont pris en compte.</p><p><b>Passages lus :</b> Composition phosphate et base, principes généraux d’œdème, rubrique enfant identifiée séparément, sevrage, propriétés et date. <b>Population :</b> Dexamethasone Galepharm Amp ; composition et principes généraux, schémas pédiatriques distincts. <b>Version :</b> Juin 2022. <b>Limites :</b> Pas de conversion automatique en comprimés ni de schéma adulte universel de méningite. Une dose pédiatrique ne devient pas une dose adulte.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680667100010" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r15" data-k="g07-r15"><h3>[15] Marais et coll. : lésions expansives tuberculeuses intracrâniennes</h3><p>La revue distingue le tuberculome organisé avec cellules inflammatoires, caséation et réaction périphérique de l’abcès tuberculeux purulent. Les aspects en résonance magnétique varient avec la consistance de la lésion et ne prouvent pas seuls l’agent. Une augmentation paradoxale et un rehaussement persistant peuvent survenir ; ils ne prouvent pas à eux seuls l’échec ou l’activité bactérienne. Les durées de neuf à douze mois couramment utilisées pour les lésions expansives reposent surtout sur des avis et séries, sans essai comparatif décisif de durée du tuberculome isolé. Biopsie, drainage et décompression se discutent selon preuve, résistance et risque mécanique.</p><p><b>Passages lus :</b> Résumé et huit parties cliniques : mécanismes, clinique, imagerie, réactions paradoxales, traitement médical et chirurgical, durée avec tableau 1 et justification ; légendes et droits. <b>Population :</b> Lésions expansives tuberculeuses intracrâniennes ; revue de séries et avis spécialisés. <b>Version :</b> Version 3, février 2020. <b>Limites :</b> Revue de séries et avis ; durée optimale du tuberculome isolé non fixée par essai comparatif. Figure sous licence ouverte repérée mais fichier original non récupéré, donc non utilisé.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6996525/" target="_blank" rel="noopener noreferrer">Consulter la source — Marais et coll., Wellcome Open Research</a></p></template>
<template data-pop="g07-r16" data-k="g07-r16"><h3>[16] Cooney et coll. : avancées dans le diagnostic et le traitement de l’amibiase</h3><p>La revue d’amibiase distingue l’infection tissulaire et le réservoir intestinal. Un agent luminal ne traite pas une lésion cérébrale. L’atteinte extra-intestinale autre qu’hépatique est renvoyée au spécialiste et aucun schéma cérébral universel ne peut être tiré du tableau de colite ou d’abcès hépatique. Les tests moléculaires peuvent distinguer l’espèce pathogène des espèces non pathogènes ; une sérologie persistante ou un résultat intestinal ne prouve pas seul l’origine d’une masse cérébrale.</p><p><b>Passages lus :</b> Résumé, cycle, invasion tissulaire, risques, localisations rares, diagnostic avec tableaux 2–3, traitement avec tableau 5 et droits. <b>Population :</b> Amibiase invasive ; les formes extra-intestinales autres qu’hépatiques relèvent du spécialiste. <b>Version :</b> En ligne octobre 2024, volume 16 de 2025. <b>Limites :</b> Localisation cérébrale renvoyée au spécialiste. Doses digestives ou hépatiques non transposées. Figure sous licence non commerciale non importée. Une affirmation de foyer hépatique constant n’est pas utilisée comme règle d’exclusion.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12969968/" target="_blank" rel="noopener noreferrer">Consulter la source — Cooney et coll., Frontline Gastroenterology</a></p></template>
<template data-pop="g07-r17" data-k="g07-r17"><h3>[17] Humatin : information professionnelle</h3><p>Une capsule d’Humatin contient 357,2 mg de sulfate correspondant à 250 mg de paromomycine base. L’absorption intestinale est très faible ; une muqueuse ulcérée peut toutefois augmenter le risque systémique. La FI interdit l’administration dans l’amibiase extra-intestinale : cette restriction ne doit pas être réécrite comme une simple invitation à ne pas traiter seul. La gestion d’un éventuel réservoir luminal après une forme invasive relève d’une décision spécialisée et pharmaceutique explicite. L’atteinte rénale sévère, la grossesse et l’allaitement font partie des contre-indications lues.</p><p><b>Passages lus :</b> Composition sel et base, indications intestinales, doses digestives, contre-indications dont amibiase extra-intestinale, rein, grossesse, allaitement, interactions et mécanisme. <b>Population :</b> Humatin, paromomycine intestinale ; restriction explicite pour amibiase extra-intestinale. <b>Version :</b> Mars 2021. <b>Limites :</b> Pas de dose cérébrale ni de réinterprétation de la restriction extra-intestinale. Décision spécialisée nécessaire pour articuler la revue internationale et le produit suisse.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680252290102" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g07-r18" data-k="g07-r18"><h3>[18] Medical Research Council : examen de la force musculaire</h3><p>L’échelle de force du Medical Research Council distingue 0 : aucune contraction, 1 : contraction perceptible sans mouvement utile, 2 : mouvement avec pesanteur éliminée, 3 : mouvement contre la pesanteur, 4 : mouvement contre résistance et 5 : force normale. Il faut isoler le mouvement et relever les compensations. Ce sont des grades de force, différents des stades de gravité I à III de la méningite tuberculeuse. Traduction pédagogique et attribution selon les conditions du MRC.</p><p><b>Passages lus :</b> Manuel, page 7 du document numérique correspondant à la page imprimée 1 : grades 0–5 et méthode ; droits officiels. <b>Population :</b> Examen de la force musculaire ; pas le classement de gravité de la méningite tuberculeuse. <b>Version :</b> Manuel 1976, page officielle actualisée en 2026. <b>Limites :</b> Lecture Sol antérieure réellement faite puis grades revérifiés pour G07. Traduction pédagogique ; pas le classement de gravité de méningite. Aucun dessin anatomique du manuel importé.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://www.ukri.org/councils/mrc/facilities-and-resources/find-an-mrc-facility-or-resource/mrc-muscle-scale/" target="_blank" rel="noopener noreferrer">Consulter la source — Medical Research Council, diffusion site officiel britannique du Medical Research Council</a></p></template>
<template data-pop="g07-r19" data-k="g07-r19"><h3>[19] PROFILES : situations cliniques de formation médicale</h3><p>Les situations de PROFILES 2017 comprennent céphalée, trouble cognitif, parésie, trouble sensitif et crise, ainsi que déficit neurologique aigu et céphalée sévère avec méningisme. La leçon propose un lien pédagogique avec ces situations ; elle ne prétend pas constituer une nouvelle liste fédérale ou une correspondance officielle de 2026.</p><p><b>Passages lus :</b> Passages des situations 101–105, 205 et 207 : céphalée, cognition, parésie, sensibilité, crise, déficit aigu et méningisme. <b>Population :</b> Repères pédagogiques de situations cliniques ; correspondance locale explicitée. <b>Version :</b> 2017. <b>Limites :</b> Lecture Sol antérieure réutilisée puis passages revérifiés. Correspondance pédagogique locale, pas une nouvelle table fédérale de 2026.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — PROFILES, objectifs nationaux suisses de formation médicale</a></p></template>
<template data-pop="g07-r20" data-k="g07-r20"><h3>[20] Gray1196 : enveloppes méningées normales et droits</h3><p>L’illustration Gray1196 est un original humain historique montrant des enveloppes méningées normales. La page de droits et les pixels ont été revus ; la reproduction mécanique de l’ouvrage de 1918 est donnée dans le domaine public. Elle sert à nommer des plans et ne montre ni granulome ni imagerie d’un patient. Les annotations françaises restent dans un tableau adjacent, sans modification des pixels.</p><p><b>Passages lus :</b> Original numérique inspecté, repères et page de droits Commons revus pour G07. <b>Population :</b> Illustration anatomique humaine historique des enveloppes méningées normales. <b>Version :</b> 1918 ; droits et original revus le 2 novembre 2026. <b>Limites :</b> Anatomie humaine historique normale ; pas un granulome ni une carte opératoire. Pixels conservés et annotations françaises adjacentes. Aucun appel au moteur de recherche de figures.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray1196.png" target="_blank" rel="noopener noreferrer">Consulter la source — Gray, Anatomy of the Human Body ; Wikimedia Commons</a></p></template>

<template data-pop="g07-r22" data-k="g07-r22"><h3>[22] Ceftriaxon Labatec : information professionnelle</h3><p>La lecture Sol G06 de Ceftriaxon Labatec est réutilisée explicitement. Les doses adultes générales et l’adaptation rénale de la FI ne démontrent pas une durée d’abcès cérébral gonococcique. Une clairance inférieure à 10 ml/min ou une dialyse impose un maximum de 2 g/j selon cette spécialité. Une fréquence de guide britannique doit être identifiée comme telle et confrontée à la notice et au protocole du centre.</p><p><b>Passages lus :</b> Lecture réelle de Sol pour G06 : doses adultes générales, rein, voie et précautions pertinentes, mécanisme et date, explicitement réutilisée. <b>Population :</b> Ceftriaxon Labatec ; doses adultes générales et limite rénale, lecture Sol G06 réutilisée. <b>Version :</b> Juin 2025. <b>Limites :</b> Pas une nouvelle lecture intégrale G07. Fréquence britannique et notice suisse distinguées ; aucune durée validée d’abcès cérébral gonococcique déduite.</p><p>Lecture ciblée réelle attribuée à Sol ; consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Les heures de journalisation ne mesurent pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
