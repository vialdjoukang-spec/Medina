<template data-pop="g07-m-rifampicine" data-title="Rifampicine">
<div class="lab">Posologie</div><p>10 (8–12) mg/kg/jour, maximum 600 mg/jour chez l’adulte ; enfant 15 (10–20) mg/kg/jour.</p>
<div class="lab">Contre-indications</div><p>Clairance de la créatinine inférieure à 25 ml/min, cirrhose, hépatopathie aiguë.</p>
<div class="lab">Interactions</div><p>Inducteur enzymatique : réduit l’efficacité des glucocorticoïdes, contraceptifs oraux, opiacés, antiépileptiques.</p>
<div class="lab">Forte dose</div><p>Au-delà de 20 mg/kg, conversion plus rapide sans effet sur la mortalité ; avis spécialisé.</p>
<div class="lab">Lacune</div><p>Mécanisme d’action et effets indésirables détaillés non repris du dossier.</p>
<p class="src">Sources : information professionnelle Rifampicin Labatec, octobre 2023 ; guide OFSP V1.2024.</p>
</template>
<template data-pop="g07-m-pyrazinamide" data-title="Pyrazinamide">
<div class="lab">Posologie</div><p>25 (20–30) mg/kg/jour, maximum 2 g, en une prise.</p>
<div class="lab">Surveillance</div><p>Transaminases avant puis toutes les 2 à 4 semaines.</p>
<div class="lab">Contre-indications</div><p>Hépatite aiguë, porphyrie.</p>
<p class="src">Source : information professionnelle Pyrazinamide Labatec, octobre 2022.</p>
</template>
<template data-pop="g07-m-ethambutol" data-title="Éthambutol">
<div class="lab">Posologie</div><p>Jusqu’à 25 mg/kg/jour en phase initiale, 15 mg/kg en stabilisation.</p>
<div class="lab">Effet indésirable</div><p>Névrite optique rétrobulbaire, en général réversible à l’arrêt ; cécité irréversible rapportée.</p>
<div class="lab">Surveillance</div><p>Ophtalmoscopie, périmétrie, vision des couleurs.</p>
<p class="src">Source : information professionnelle Myambutol, août 2024.</p>
</template>
<template data-pop="g07-m-rimstar" data-title="Rimstar">
<div class="lab">Composition</div><p>Rifampicine 150 mg, isoniazide 75 mg, pyrazinamide 400 mg, éthambutol 275 mg.</p>
<div class="lab">Indication</div><p>Phase intensive selon l’OMS et la Ligue pulmonaire ; en cas d’atteinte du système nerveux central, suivre les directives détaillées.</p>
<div class="lab">Contre-indications</div><p>Hépatite médicamenteuse antérieure, hépatopathie aiguë, ictère, névrite périphérique, goutte, porphyrie, atteinte du nerf optique, insuffisance rénale sévère (clairance inférieure à 30 ml/min). Pyridoxine possible.</p>
<p class="src">Source : information professionnelle Rimstar, avril 2026.</p>
</template>
<template data-pop="g07-m-dexa" data-title="Dexaméthasone">
<div class="lab">Indication</div><p>L’information professionnelle suisse la cite dans l’œdème cérébral (abcès cérébral, méningite).</p>
<div class="lab">Posologie</div><p>Individuelle ; effet après 1 à 2 heures ; décroissance progressive. Réaction paradoxale : 0,4 mg/kg/jour avec décroissance lente (avis d’experts).</p>
<div class="lab">Interactions</div><p>Réduite par la rifampicine ; inductrice du cytochrome P450, elle abaisse les taux de praziquantel.</p>
<p class="src">Sources : information professionnelle Dexaméthasone Galepharm, juin 2022 ; lignes directrices internationales 2026 ; DTG 2017.</p>
</template>
<template data-pop="g07-m-praziquantel" data-title="Praziquantel">
<div class="lab">Posologie</div><p>40 mg/kg/jour pendant 3 jours pour S. haematobium et S. mansoni ; 60 mg/kg/jour pendant 3 jours pour S. japonicum et les autres espèces.</p>
<div class="lab">Place</div><p>Seul médicament disponible. Dans la neuroschistosomiase, associé précocement aux corticostéroïdes.</p>
<div class="lab">Limite</div><p>Information professionnelle suisse non trouvée ; recommandation DTG 2017 échue.</p>
<p class="src">Sources : recommandation DTG 2017 (échue) ; Carod Artal 2012.</p>
</template>
<template data-pop="g07-m-metro" data-title="Métronidazole">
<div class="lab">Indication</div><p>L’information professionnelle suisse cite l’abcès cérébral à anaérobies ; E. histolytica est un parasite sensible.</p>
<div class="lab">Posologie</div><p>15 mg/kg par voie intraveineuse, puis 7,5 mg/kg.</p>
<div class="lab">Précautions</div><p>Arrêt en cas de convulsions, d’ataxie ou de confusion ; effet antabuse avec l’alcool.</p>
<div class="lab">Lacune</div><p>Durée du traitement et agent luminal complémentaire non sourcés.</p>
<p class="src">Source : information professionnelle MetronidazoleSINT i.v., février 2026.</p>
</template>
<template data-pop="g07-m-ceftriaxone" data-title="Ceftriaxone">
<div class="lab">Indication sourcée</div><p>Infection gonococcique disséminée (IUSTI 2020, niveau 2D).</p>
<div class="lab">Posologie</div><p>1 g par voie intramusculaire ou intraveineuse toutes les 24 heures pendant 7 jours ; relais oral possible après 24 à 48 heures selon l’antibiogramme.</p>
<div class="lab">Limite</div><p>Aucune source lue ne décrit l’abcès cérébral gonococcique : cette durée ne doit pas lui être extrapolée. Information professionnelle suisse non lue.</p>
<p class="src">Source : European guideline for the diagnosis and treatment of gonorrhoea in adults, IUSTI 2020.</p>
</template>
<template data-pop="g07-m-isoniazide" data-title="Isoniazide">
<div class="lab">Place</div><p>Composant du schéma 2HRZE/10HR et de l’association Rimstar (75 mg).</p>
<div class="lab">Interactions</div><p>Augmente les taux d’antiépileptiques et interagit avec les glucocorticostéroïdes.</p>
<div class="lab">Lacune</div><p>L’information professionnelle suisse n’est pas disponible dans les sources lues ; aucune posologie n’est donnée.</p>
<p class="src">Sources : guide OFSP V1.2024 ; information professionnelle Rimstar.</p>
</template>
<template data-pop="pareto-g07-definition" data-title="Pareto — Définition, périmètre et fréquence">
<p class="ratio" data-cover="g07-0,g07-1,g07-2"></p><ul><li>G07* est un code de manifestation ; la maladie causale porte un code à croix.</li><li>Quatre maladies causales : tuberculose, schistosomiase, amibiase, infection gonococcique.</li><li>Suisse 2022 : 365 cas de tuberculose, 4,16 pour 100 000 ; 73 % d’origine non suisse.</li><li>Aucune statistique suisse spécifique à G07*.</li></ul></template>
<template data-pop="pareto-g07-mecanismes" data-title="Pareto — Physiopathologie, causes et terrain">
<p class="ratio" data-cover="g07-3,g07-4"></p><ul><li>La lésion est la réaction de l’hôte autour de l’agent, pas seulement l’agent.</li><li>Voies : hématogène (tuberculose), portale (amibe), plexus vertébral (schistosome).</li><li>Terrain : pays de forte prévalence, immunodépression, voyage en eau douce, abcès hépatique.</li></ul></template>
<template data-pop="pareto-g07-clinique" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="g07-5,g07-6"></p><ul><li>Évolution insidieuse, céphalées, convulsions, signes d’hypertension intracrânienne.</li><li>Myélite ou paraparésie chez un voyageur : penser à la schistosomiase.</li><li>L’examen localise et mesure la gravité ; il ne désigne pas l’agent.</li></ul></template>
<template data-pop="pareto-g07-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="g07-7,g07-8"></p><ul><li>Imagerie d’abord ; ponction lombaire seulement si elle est sûre.</li><li>Aucun aspect radiologique spécifique ; biopsie si les méthodes non invasives ne concluent pas.</li><li>Urgences : masse avec hypertension intracrânienne, convulsions, réaction paradoxale, myélite.</li></ul></template>
<template data-pop="pareto-g07-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g07-9,g07-10"></p><ul><li>Tuberculose : 12 mois (2HRZE/10HR), corticostéroïdes, antirétroviraux différés de 4 à 8 semaines.</li><li>Réaction paradoxale : corticostéroïdes à forte dose (avis d’experts).</li><li>Schistosomiase : praziquantel et corticostéroïdes ; amibiase : métronidazole ; gonocoque : ceftriaxone dans l’infection disséminée.</li></ul></template>
<template data-pop="pareto-g07-suivi" data-title="Pareto — Suivi, pronostic et déclaration">
<p class="ratio" data-cover="g07-11"></p><ul><li>Imagerie répétée pour suivre hydrocéphalie, tuberculomes et infarctus.</li><li>Pronostic : décès ou handicap chez environ la moitié des méningites tuberculeuses.</li><li>Déclaration au médecin cantonal.</li></ul></template>
<template data-pop="pareto-g07-criteres" data-title="Pareto — Situations particulières et critères">
<p class="ratio" data-cover="g07-12,g07-13"></p><ul><li>VIH : réactions paradoxales plus fréquentes, corticostéroïdes en recommandation faible.</li><li>Contre-indications hépatiques et rénales de la rifampicine et de Rimstar.</li><li>Pas de critère consensuel pour les lésions focales ; Xpert Ultra : sensibilité environ 70 %.</li></ul></template>
<template data-pop="pareto-g07-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g07-e-1,g07-e-2,g07-e-3,g07-e-4"></p><ul><li>Hiérarchie : imagerie, ponction si sûre, microbiologie ciblée, biopsie en dernier.</li><li>Xpert et culture toujours associés ; un résultat négatif n’exclut pas.</li><li>Schistosomiase : sérologie par deux tests, œufs, éosinophilie évocatrice.</li></ul></template>
<template data-pop="pareto-g07-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g07-s-anat-cours"></p><ul><li>Trois voies d’atteinte : hématogène, portale, plexus veineux vertébral.</li></ul></template>
<template data-pop="pareto-g07-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g07-s-histo-cours"></p><ul><li>Le granulome est une réaction organisée de l’hôte ; l’histologie précise du tuberculome n’est pas sourcée.</li></ul></template>
<template data-pop="pareto-g07-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g07-s-physio-cours"></p><ul><li>La barrière limite le passage des médicaments ; l’hypertension et l’hyponatrémie aggravent le risque neurologique.</li></ul></template>
<template data-pop="pareto-g07-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g07-s-bioch-cours"></p><ul><li>La rifampicine induit les enzymes ; l’isoniazide élève les taux d’antiépileptiques.</li></ul></template>
<template data-pop="pareto-g07-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g07-p-1,g07-p-2,g07-p-3,g07-p-4,g07-p-5"></p><ul><li>Médicament selon l’agent ; plafonds : rifampicine 600 mg/jour, pyrazinamide 2 g/jour.</li><li>Interactions : rifampicine, isoniazide, dexaméthasone et praziquantel, métronidazole et alcool.</li><li>Surveiller foie, œil, signes neurologiques.</li></ul></template>
