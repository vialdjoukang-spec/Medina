<template data-pop="g07-asterisque" data-title="Code astérisque et code croix">
<div class="lab">Définition</div><p>La CIM-10-GM associe parfois deux codes : un code à croix (†) pour la maladie causale et un code à astérisque (*) pour sa manifestation dans un organe. G07* est un code astérisque : il décrit l’abcès ou le granulome intracrânien et intrarachidien, la maladie causale étant codée ailleurs.</p>
<div class="lab">Application</div><p>Pour un tuberculome cérébral, on enregistre A17.8† pour la tuberculose du système nerveux central et G07* pour la manifestation. Pour un abcès à germe pyogène ordinaire, on utilise la catégorie G06, avec un code B95–B98 additionnel.</p>
<div class="lab">Limite</div><p>Les libellés français officiels des codes † n’ont pas été relus dans le fichier de l’OFS pour cette leçon.</p>
<p class="src">Source : CIM-10-GM 2024, BfArM, bloc G00–G09 ; registre de l’OFS. Lu le 15 octobre 2026.</p>
</template>
<template data-pop="g07-ponction-prealable" data-title="Ponction lombaire devant une masse">
<div class="lab">Règle</div><p>Devant une masse possible (tuberculome, abcès tuberculeux, tumeur, abcès bactérien), l’imagerie précède la ponction lombaire si possible, et la ponction n’est faite que si elle est sûre.</p>
<div class="lab">Équilibre</div><p>Le traitement ne doit pas être retardé pour attendre l’imagerie. La décision est prise au cas par cas : le médecin pèse le risque d’une ponction chez un patient porteur d’une masse contre celui d’un retard de traitement.</p>
<div class="lab">Limite</div><p>Les lignes directrices internationales 2026 ne chiffrent pas le risque de la ponction ; la règle est une recommandation prudente.</p>
<p class="src">Source : lignes directrices internationales sur la méningite tuberculeuse, Lancet Infectious Diseases 2026.</p>
</template>
<template data-pop="g07-paradoxale" data-title="Réaction paradoxale sous traitement">
<div class="lab">Définition</div><p>Des complications inflammatoires intracérébrales (par exemple de nouveaux tuberculomes) apparaissent malgré un traitement antituberculeux efficace.</p>
<div class="lab">Fréquence et délai</div><p>Environ 20 % des méningites tuberculeuses, plus de 30 % chez les personnes vivant avec le VIH ; typiquement entre le 20e et le 60e jour, parfois des mois plus tard. Dans une série française, les formes graves surviennent après une médiane de six semaines.</p>
<div class="lab">Conduite</div><p>Corticostéroïdes à forte dose (par exemple dexaméthasone 0,4 mg/kg/jour) avec décroissance lente (avis d’experts). En cas d’échec, anti-TNF, thalidomide ou anakinra selon des séries de cas. Chez la personne qui débute un traitement antirétroviral, la réaction peut remplir les critères d’un syndrome inflammatoire de restauration immunitaire.</p>
<div class="lab">Piège</div><p>Interpréter l’aggravation comme un échec thérapeutique.</p>
<p class="src">Sources : lignes directrices internationales 2026 ; série française sur les anti-TNF, Eur J Clin Microbiol Infect Dis 2023.</p>
</template>
<template data-pop="g07-tuberculome" data-title="Tuberculome">
<div class="lab">Définition</div><p>Lésion focale intracrânienne de la tuberculose, avec ou sans méningite. Elle peut siéger n’importe où dans la boîte crânienne, dans le parenchyme ou à la surface ventriculaire.</p>
<div class="lab">Diagnostic</div><p>Aucun aspect radiologique n’est spécifique ; la lésion peut être indiscernable d’une néoplasie. Le diagnostic repose sur l’IRM et les prélèvements bactériologiques de tous les sites atteints, et n’est souvent obtenu qu’après biopsie.</p>
<div class="lab">Lacune</div><p>La description histologique (granulome, caséum) n’a pas été lue dans une source : elle n’est pas donnée.</p>
<p class="src">Sources : Dilemmas in the diagnosis and treatment of intracranial tuberculomas, J Neurol Sci 2017 ; Central nervous system tuberculomas in 23 patients, Scand J Infect Dis 2010 (résumés lus).</p>
</template>
<template data-pop="g07-abces-tb" data-title="Abcès tuberculeux">
<div class="lab">Définition</div><p>Lésion focale intracrânienne de la tuberculose, avec le tuberculome. Elle peut exister avec ou sans méningite et relève du code A17.8† avec G07*.</p>
<div class="lab">Conduite</div><p>Les lignes directrices internationales 2026 jugent les preuves insuffisantes pour ou contre la chirurgie, d’emblée ou après échec ; elle peut être nécessaire en cas d’hypertension intracrânienne, de convulsions ou de compression.</p>
<p class="src">Source : lignes directrices internationales sur la méningite tuberculeuse, 2026.</p>
</template>
<template data-pop="g07-bhe" data-title="Barrière hémato-encéphalique">
<div class="lab">Normal</div><p>La barrière limite la pénétration de nombreuses substances du sang vers le tissu nerveux.</p>
<div class="lab">Conséquence thérapeutique</div><p>La rifampicine et l’éthambutol pénètrent faiblement dans le liquide cérébrospinal. Le traitement de la tuberculose du système nerveux central demande donc des directives détaillées.</p>
<div class="lab">Limite</div><p>Les sources lues ne chiffrent pas la pénétration de chaque molécule.</p>
<p class="src">Sources : guide OFSP V1.2024 ; Wilkinson et al., Nat Rev Neurol 2017 (résumé).</p>
</template>
<template data-pop="g07-inflammation-tb" data-title="Inflammation et lésions dans la neurotuberculose">
<div class="lab">Rôle</div><p>L’inflammation joue un rôle central dans la gravité de la tuberculose du système nerveux central ; les lésions tissulaires sont aussi vasculaires et hypoxiques.</p>
<div class="lab">Conséquence</div><p>Les corticostéroïdes visent cette inflammation, et la réaction paradoxale en est une expression tardive.</p>
<div class="lab">Limite</div><p>Les mécanismes cellulaires détaillés n’ont pas été lus au-delà des résumés.</p>
<p class="src">Sources : Wilkinson et al., Nat Rev Neurol 2017 ; Curr Opin Neurol 2021 (résumés lus).</p>
</template>
<template data-pop="g07-schisto-meca" data-title="Hypersensibilité retardée autour des œufs">
<div class="lab">Mécanisme</div><p>Les œufs déposés dans le névraxe déclenchent une réaction d’hypersensibilité retardée qui forme un granulome périovulaire. Des vers adultes peuvent migrer de façon aberrante par le plexus veineux vertébral.</p>
<div class="lab">Topographie</div><p>S. mansoni et S. haematobium donnent surtout une myélopathie (myélite transverse le plus souvent) ; S. japonicum donne surtout une atteinte encéphalique.</p>
<div class="lab">Clinique</div><p>Convulsions, déficits focaux, atteintes des nerfs crâniens, hypertension intracrânienne ; forme spinale : myélite aiguë ou myéloradiculopathie. L’atteinte peut survenir à toute phase de l’infection.</p>
<p class="src">Sources : Carod Artal, Curr Neurol Neurosci Rep 2012 ; Lancet Neurol 2011 ; recommandation DTG 2017 (échue) ; résumés lus.</p>
</template>
<template data-pop="g07-amibe-meca" data-title="Abcès cérébral amibien">
<div class="lab">Mécanisme</div><p>Entamoeba histolytica envahit la muqueuse colique, gagne le foie par la circulation portale, puis donne rarement un abcès cérébral.</p>
<div class="lab">Terrain</div><p>Homme jeune d’environ 30 ans qui développe des signes neurologiques après une amélioration de l’abcès hépatique traité.</p>
<div class="lab">Clinique et diagnostic</div><p>Céphalées, vomissements, troubles de la conscience, signes méningés, paralysie faciale, paralysie motrice, convulsions. Sérologie et amplification des acides nucléiques du pus ou du liquide.</p>
<p class="src">Sources : Entamoeba histolytica brain abscess, Handb Clin Neurol 2013 ; Amoebiasis, Lancet 2003 (résumés lus).</p>
</template>
<template data-pop="g07-htic" data-title="Hypertension intracrânienne">
<div class="lab">Mécanisme</div><p>Une lésion de masse ou une hydrocéphalie augmente la pression à l’intérieur de la boîte crânienne.</p>
<div class="lab">Signes</div><p>Céphalées, convulsions, signes de masse. L’hyponatrémie peut aussi la provoquer.</p>
<div class="lab">Conduite</div><p>Imagerie avant ponction lombaire ; avis neurochirurgical en cas d’hypertension intracrânienne, de convulsions ou de compression.</p>
<p class="src">Sources : lignes directrices internationales 2026 ; J Clin Neurosci 2013 (résumé).</p>
</template>
<template data-pop="g07-convulsions" data-title="Convulsions et lésions focales">
<div class="lab">Mécanismes</div><p>Hypertension intracrânienne, tuberculomes, ischémie.</p>
<div class="lab">Conséquence</div><p>Les convulsions augmentent la consommation cérébrale d’oxygène et s’associent à une mortalité accrue.</p>
<div class="lab">Fréquence</div><p>Incidence poolée de convulsions confirmées par électroencéphalogramme : 25 % dans la méningite tuberculeuse, plus fréquentes chez l’enfant.</p>
<p class="src">Source : lignes directrices internationales sur la méningite tuberculeuse, 2026.</p>
</template>
<template data-pop="g07-hyponatremie" data-title="Hyponatrémie">
<div class="lab">Risque</div><p>L’hyponatrémie peut provoquer un œdème cérébral, une hypertension intracrânienne et un infarctus. Elle est citée parmi les pièges évolutifs de la neurotuberculose.</p>
<div class="lab">Conduite</div><p>La natrémie se recherche et se suit ; sa correction fait partie de la prise en charge de la complication.</p>
<div class="lab">Limite</div><p>Les cibles et vitesses de correction ne sont pas dans les sources lues.</p>
<p class="src">Sources : lignes directrices internationales 2026 ; J Neurol Sci 2017 (résumé).</p>
</template>
<template data-pop="g07-myelite" data-title="Myélite schistosomienne">
<div class="lab">Définition</div><p>Atteinte médullaire de la schistosomiase : myélite aiguë ou myéloradiculopathie, œdème et granulomes intramédullaires à l’imagerie.</p>
<div class="lab">Conduite</div><p>Traitement précoce par praziquantel et corticostéroïdes pour prévenir le handicap. Avis tropicologique.</p>
<div class="lab">Exemple</div><p>Un voyageur non traité a présenté une myélite plus d’un an après l’exposition.</p>
<p class="src">Sources : Carod Artal 2012 ; recommandation DTG 2017 (échue) ; Loutan, Schweiz Med Wochenschr 1996.</p>
</template>
<template data-pop="g07-schema" data-title="Schéma 2HRZE/10HR">
<div class="lab">Lecture</div><p>Le chiffre qui précède les lettres donne la durée en mois. 2HRZE : deux mois d’isoniazide, de rifampicine, de pyrazinamide et d’éthambutol. 10HR : dix mois d’isoniazide et de rifampicine.</p>
<div class="lab">Application</div><p>Pour la méningite tuberculeuse, la phase de continuation est étendue à dix mois, soit douze mois au total, avec des corticostéroïdes pendant les premières semaines.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>Retenir 2 + 10 = 12 mois et les quatre initiales H, R, Z, E dans l’ordre du schéma.</p>
<p class="src">Sources : guide OFSP V1.2024 ; lignes directrices internationales 2026.</p>
</template>
<template data-pop="g07-lcr-tb" data-title="Liquide cérébrospinal de la méningite tuberculeuse">
<div class="lab">Profil</div><p>Pléiocytose lymphocytaire modérée, protéines élevées, glucose inférieur à 50 % de la glycémie, lactate modérément élevé (5 à 10 mmol/L).</p>
<div class="lab">Limite</div><p>Les valeurs normales dépendent du laboratoire. Le profil ne suffit pas au diagnostic ; l’amplification des acides nucléiques et la culture complètent.</p>
<p class="src">Source : lignes directrices internationales 2026.</p>
</template>
