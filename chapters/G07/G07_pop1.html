<template data-pop="g07-asterisque" data-k="g07-asterisque"><h3>Lire le code de manifestation et ses inclusions</h3><p>Le fichier français officiel de l’OFS 2024 identifie G07* comme code terminal : il n’existe pas de subdivision sous-code à décimale dans ce fichier. L’astérisque désigne une manifestation d’une maladie classée ailleurs. La liste d’inclusions BfArM complète les libellés, sans constituer une liste exclusive de toutes les causes possibles ni une règle de facturation suisse actuelle.</p><p>La cause et la localisation doivent être établies dans le dossier. Un code causal de tuberculose méningée ne se déduit pas du seul mot tuberculose ; un tuberculome méningé et un tuberculome cérébral ne partagent pas nécessairement le même code causal. La classification ne démontre ni la preuve microbiologique ni une conduite thérapeutique.</p><p>Sources : <button class="w" data-k="g07-r11">[11]</button> · <button class="w" data-k="g07-r12">[12]</button></p></template>
<template data-pop="g07-chronologie" data-k="g07-chronologie"><h3>Une aggravation sous traitement exige une nouvelle question clinique</h3><p>Comparer le dernier état neurologique stable à l’état actuel, puis vérifier traitement effectivement reçu, observance, interactions et preuve initiale. Une nouvelle crise, une baisse de vigilance ou un déficit progressif impose une évaluation urgente et une imagerie selon le contexte. Le mot « paradoxal » décrit une hypothèse après réévaluation, pas une raison d’attendre à domicile.</p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="g07-force" data-k="g07-force"><h3>La force musculaire : six grades, une méthode répétable</h3><table class="t"><thead><tr><th>Grade</th><th>Observation</th></tr></thead><tbody><tr><td>0</td><td>Aucune contraction.</td></tr><tr><td>1</td><td>Contraction visible ou palpable sans mouvement utile.</td></tr><tr><td>2</td><td>Mouvement possible lorsque la pesanteur est éliminée.</td></tr><tr><td>3</td><td>Mouvement contre la pesanteur.</td></tr><tr><td>4</td><td>Mouvement contre une résistance.</td></tr><tr><td>5</td><td>Force considérée comme normale.</td></tr></tbody></table><p>Isoler le mouvement, stabiliser le segment et éviter les compensations. Comparer côtés et examens successifs dans les mêmes conditions. Le grade ne remplace pas la description du muscle, du territoire et de la douleur. Il s’agit de l’échelle de force du Medical Research Council, différente de la classification de gravité I à III utilisée pour la méningite tuberculeuse. Used with the permission of the Medical Research Council ; traduction pédagogique paraphrasée.</p><p>Sources : <button class="w" data-k="g07-r18">[18]</button></p></template>
<template data-pop="g07-pl" data-k="g07-pl"><h3>Pourquoi une ponction lombaire n’est pas systématique</h3><p>Le guide de méningite tuberculeuse demande d’évaluer les contre-indications et de ne prélever le liquide céphalorachidien que lorsque la procédure est sûre. Une masse ou un risque d’engagement peut conduire à privilégier imagerie, prélèvements extracrâniens ou tissu obtenu dans un geste spécialisé. Une imagerie avant la ponction est indiquée selon les risques ; la stratégie ne doit pas retarder sans raison le traitement d’un patient gravement malade.</p><p>Le bénéfice d’un résultat doit être confronté au risque et à la possibilité qu’il change la prise en charge. Une recommandation de prélèvement dans une revue de parasite ne supprime pas cette règle de sécurité en présence d’une lésion expansive.</p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="g07-chirurgie" data-k="g07-chirurgie"><h3>Quand le tissu ou la décompression devient une question centrale</h3><p>La revue des lésions expansives tuberculeuses discute la biopsie lorsque le diagnostic est incertain ou lorsque la progression exige une preuve et une recherche de résistance. Le prélèvement est préparé avec anatomopathologie et microbiologie : les conditions d’envoi ne sont pas interchangeables. L’effet de masse, l’hydrocéphalie et certaines crises réfractaires peuvent modifier la décision. Un prélèvement moins risqué hors du système nerveux peut parfois documenter la maladie, sans prouver automatiquement que toute lésion cérébrale a la même cause.</p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="g07-schema" data-k="g07-schema"><h3>Deux mois plus dix mois : à quelle situation ce calcul s’applique-t-il ?</h3><p>Le guide suisse décrit une phase intensive de deux mois associant isoniazide, rifampicine, pyrazinamide et éthambutol, puis une continuation par isoniazide et rifampicine. Pour la méningite tuberculeuse, la continuation est de dix mois, soit 2 + 10 = 12 mois. Le schéma standard de nombreuses tuberculoses non compliquées ne doit pas être repris comme une durée cérébrale automatique.</p><p>Pour un tuberculome intracrânien isolé, les durées de neuf à douze mois souvent utilisées sont surtout issues d’avis et de séries. Il manque un essai comparatif décisif fixant une durée pour toutes les masses isolées. L’équipe intègre diagnostic, sensibilité, observance, réponse clinique et imagerie. La persistance d’un rehaussement n’impose pas seule de prolonger indéfiniment ; elle n’autorise pas non plus un arrêt autonome.</p><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="g07-harvest" data-k="g07-harvest"><h3>Rifampicine à forte dose : ce que montre réellement HARVEST</h3><p>L’essai international publié en 2025 compare 35 à 10 mg/kg/j pendant huit semaines chez des adultes avec méningite tuberculeuse. L’analyse porte sur 499 personnes. La mortalité estimée à six mois par Kaplan–Meier est de 44,6 % contre 40,7 % ; le rapport de risque est de 1,17, avec un intervalle de confiance à 95 % de 0,89 à 1,54 et p = 0,25. Le critère principal ne montre pas de bénéfice de survie de la forte dose.</p><p>L’incertitude statistique ne démontre ni un bénéfice caché ni un dommage universel. L’essai n’est pas un protocole de tuberculome isolé ou d’enfant. Les personnes enceintes ou allaitantes et certaines insuffisances rénales étaient exclues ; la population doit rester visible. Les discussions du guide suisse 2024 sur de fortes doses doivent être relues à la lumière de ce résultat récent, sans augmentation empirique automatique.</p><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r3">[3]</button> · <button class="w" data-k="g07-r7">[7]</button></p></template>
<template data-pop="g07-schisto-meca" data-k="g07-schisto-meca"><h3>Schistosomiase : ne pas appliquer une ancienne consigne isolée</h3><p>L’exposition en eau douce, les manifestations systémiques et les tests orientent. Le choix et le calendrier du praziquantel sont spécialisés ; aucune FI suisse n’a été retrouvée par les requêtes effectuées. Cela constitue une limite documentaire, pas une preuve d’indisponibilité. Rimstar contre-indique le praziquantel en raison d’une réduction majeure d’exposition : une co-infection exige une coordination, pas une addition des deux ordonnances.</p><p>Une ancienne suggestion générale d’arrêter la dexaméthasone avant le praziquantel ne doit pas être appliquée automatiquement à une atteinte neurologique nécessitant un contrôle inflammatoire. Le rapport bénéfice-risque et les interactions sont arbitrés par les spécialistes avec la pharmacie.</p><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r8">[8]</button></p></template>
<template data-pop="g07-amibiase" data-k="g07-amibiase"><h3>Traiter le cerveau et discuter le réservoir intestinal séparément</h3><p>Le métronidazole a une activité tissulaire contre Entamoeba histolytica, tandis que la paromomycine orale est très peu absorbée et vise l’intestin. Aucun agent luminal ne remplace le traitement d’une lésion cérébrale. La FI suisse Humatin comporte toutefois une restriction explicite contre l’administration dans l’amibiase extra-intestinale. Il faut la signaler, sans la réécrire comme « ne pas utiliser seul ». La gestion ultérieure d’un éventuel réservoir luminal demande une décision spécialisée et pharmaceutique documentée.</p><p>Rechercher un foyer hépatique ou d’autres localisations selon le tableau ; ne pas transformer une affirmation d’une série en condition obligatoire de toute atteinte cérébrale. La preuve d’espèce et le diagnostic différentiel restent nécessaires.</p><p>Sources : <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r16">[16]</button> · <button class="w" data-k="g07-r17">[17]</button></p></template>
<template data-pop="g07-paradoxal" data-k="g07-paradoxal"><h3>Rehaussement, inflammation et activité bactérienne ne sont pas équivalents</h3><p>Le rehaussement traduit une propriété de la lésion et de sa barrière vasculaire ; il ne mesure pas directement des bacilles vivants. Dans certaines séries, des lésions restent rehaussées longtemps après une amélioration clinique. La revue ne fournit pas de test unique autorisant de traiter jusqu’à disparition totale ou d’arrêter sur la seule stabilité. L’équipe confronte la trajectoire clinique aux images et aux preuves initiales.</p><p>Sources : <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="pareto-g07-clinique" data-k="pareto-g07-clinique"><h3>Les décisions à retenir</h3><p>Reconnaître la menace neurologique ; sécuriser les prélèvements ; établir la cause et le territoire ; distinguer méningite et masse isolée ; vérifier chaque produit et ses interactions ; expliquer le suivi sans traiter une image seule.</p></template>
<template data-pop="g07-irm" data-k="g07-irm"><h3>Pourquoi la diffusion ne fournit pas le nom du germe</h3><p>Dans la revue des lésions tuberculeuses, un tuberculome solide caséeux peut être hypointense en pondération T2 et ne pas présenter la restriction typique d’un contenu liquéfié. Un abcès tuberculeux peut au contraire restreindre la diffusion. Ces associations orientent, sans prouver la cause ni exclure toute tumeur. La consistance de la lésion, la séquence et la population modifient l’interprétation.</p><p>Sources : <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="g07-prelevement" data-k="g07-prelevement"><h3>Dire ce que prouve chaque résultat</h3><table class="t"><thead><tr><th>Résultat</th><th>Interprétation raisonnable</th></tr></thead><tbody><tr><td>Agent dans un prélèvement de lésion</td><td>Argument causal direct, à interpréter avec qualité et contamination possible.</td></tr><tr><td>Agent dans un foyer extracrânien</td><td>Établit ce foyer ; cohérence avec la lésion neurologique à évaluer.</td></tr><tr><td>Granulome à l’histologie</td><td>Organisation inflammatoire, pas agent certain sans autres preuves.</td></tr><tr><td>Sérologie ou selles positives</td><td>Contexte d’infection ou d’exposition selon test ; pas preuve automatique de masse cérébrale.</td></tr></tbody></table><p>Sources : <button class="w" data-k="g07-r6">[6]</button> · <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r15">[15]</button> · <button class="w" data-k="g07-r16">[16]</button></p></template>
<template data-pop="pareto-g07-examens" data-k="pareto-g07-examens"><h3>Relier chaque test à une décision</h3><p>Imagerie pour territoire et sécurité ; tissu et agent pour causalité ; résultat négatif interprété dans son contexte ; examen répété et toxicités suivis. Les quatre cas entraînent des questions distinctes, sans ordonnance commune.</p></template>
<template data-pop="pareto-g07-sci" data-k="pareto-g07-sci"><h3>Du normal à la décision</h3><p>L’anatomie localise ; l’histologie décrit ; la physiologie explique l’évolution ; la biochimie éclaire cible et exposition ; l’immunologie conserve les bénéfices et risques ; la sémiologie mesure la fonction. Les preuves cliniques restent nécessaires à la prescription.</p></template>
<template data-pop="g07-rimstar" data-k="g07-rimstar"><h3>Rimstar : quatre substances, quatre possibilités de limite</h3><p>Chaque comprimé contient rifampicine 150 mg, isoniazide 75 mg, pyrazinamide 400 mg et chlorhydrate d’éthambutol 275 mg. La FI d’avril 2026 réserve le tableau pondéral standard aux formes non compliquées et renvoie les atteintes du système nerveux à des recommandations détaillées. Ce tableau n’est donc pas un calcul automatique pour le patient de cette leçon.</p><p>La clairance de créatinine inférieure à 30 ml/min fait partie des contre-indications de l’association. Les atteintes hépatiques, les lésions oculaires et autres contre-indications doivent être vérifiées dans la notice. Le praziquantel est contre-indiqué avec Rimstar : la diminution d’exposition peut compromettre son effet. La grossesse est contre-indiquée dans cette FI. Les règles de maxima de l’association ne doivent pas être fusionnées avec le maximum d’un produit séparé.</p><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r8">[8]</button></p></template>
<template data-pop="g07-rifampicine" data-k="g07-rifampicine"><h3>Rifampicin Labatec : dose générale et précautions propres au produit</h3><p>La FI d’octobre 2023 décrit chez l’adulte et le patient de plus de douze ans 10 mg/kg/j, avec plage 8–12 mg/kg et maximum 600 mg/j pour la tuberculose. Cette spécialité contre-indique une clairance inférieure à 25 ml/min et les atteintes hépatiques sévères citées. Ces limites sont celles du produit séparé ; elles ne deviennent pas le seuil de chaque substance ou de Rimstar.</p><p>La prise orale est indiquée au moins trente minutes avant le repas. Une induction enzymatique et des transporteurs peut réduire l’exposition de médicaments associés, notamment certains antiépileptiques, contraceptifs, corticoïdes et antirétroviraux. La liste complète et les contre-indications exactes se vérifient dans la notice. Une contraception non hormonale est à organiser selon la FI. Avec les coumarines, le suivi de la coagulation doit tenir compte du début et de l’arrêt ; la fin de l’induction n’est pas immédiate.</p><p>Une forte dose discutée en milieu spécialisé ne doit pas être déduite d’une simple gravité radiologique. HARVEST n’a pas montré de bénéfice de survie du schéma 35 mg/kg/j étudié dans sa population de méningite tuberculeuse adulte. Une dose d’essai n’est pas une nouvelle dose courante de la FI.</p><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r2">[2]</button> · <button class="w" data-k="g07-r3">[3]</button></p></template>
<template data-pop="g07-pyrazinamide" data-k="g07-pyrazinamide"><h3>Pyrazinamide Labatec : dose, rein et foie</h3><p>La FI d’octobre 2022 décrit chez l’adulte et le patient de plus de dix ans 25 mg/kg/j, avec plage 20–30 mg/kg, au maximum 2 g/j, en une prise après le repas. La notice rappelle que le traitement d’une forme compliquée, notamment du système nerveux, suit une stratégie détaillée spécialisée. Cette prise après le repas ne remplace pas les instructions différentes de rifampicine ou d’une association fixe.</p><p>La clairance de créatinine inférieure à 50 ml/min est une contre-indication explicite, de même que les situations hépatiques citées, la goutte ou hyperuricémie, la grossesse et l’allaitement. D’autres passages rénaux ne sont pas utilisés ici pour annuler silencieusement cette contre-indication. Le bilan hépatique est contrôlé avant traitement puis selon le calendrier de la FI, notamment toutes les deux à quatre semaines dans le passage lu.</p><p>L’élévation de l’uricémie et le risque hépatique font partie de la surveillance. Une phrase ancienne présentant une résistance comme nulle ne peut pas être appliquée à toutes les espèces et situations actuelles : le guide suisse distingue notamment Mycobacterium bovis et la résistance naturelle au pyrazinamide.</p><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r9">[9]</button></p></template>
<template data-pop="g07-ethambutol" data-k="g07-ethambutol"><h3>Myambutol : la plainte visuelle exige une action</h3><p>Les comprimés de Myambutol contiennent du chlorhydrate d’éthambutol. La FI d’août 2024 distingue une dose initiale pouvant atteindre 25 mg/kg/j et une phase à 15 mg/kg/j après soixante jours. Ce libellé reste distinct du repère quotidien du guide suisse ; il ne signifie pas que l’éthambutol doit être poursuivi pendant toute la durée de chaque méningite ou tuberculome.</p><p>Un examen oculaire est nécessaire avant traitement puis toutes les quatre semaines, et plus souvent, notamment chaque semaine selon la FI, en cas d’atteinte rénale. Il porte sur acuité de chaque œil, champ et couleurs. Toute modification nouvelle impose une consultation et une évaluation ophtalmologique rapides. La notice demande l’interruption si l’examen soigneux confirme la modification et qu’aucune autre cause n’existe ; des séquelles irréversibles peuvent survenir. Une affection optique préexistante figure parmi les contre-indications ; la grossesse est également contre-indiquée dans cette FI.</p><p>Le produit possède un tableau d’adaptation rénale propre. Les frontières ou formulations ambiguës ne sont pas arrondies de mémoire : consulter le tableau exact et la pharmacie. L’enfant de moins de treize ans ne relève pas d’une extrapolation automatique ; la notice prévoit des conditions restrictives. L’examen visuel est un élément de sécurité thérapeutique, pas seulement une mesure de la lésion cérébrale.</p><p>Sources : <button class="w" data-k="g07-r1">[1]</button> · <button class="w" data-k="g07-r10">[10]</button></p></template>
<template data-pop="g07-m-metro" data-k="g07-m-metro"><h3>Metronidazole SINT i.v. : lire le produit et la limite de son indication</h3><p>La FI de février 2026 décrit 500 mg dans 100 ml, avec 326 mg de sodium. Le débit indiqué est de 5 ml/min. Pour les indications générales de la notice chez l’adulte et le patient d’au moins douze ans, elle décrit une charge de 15 mg/kg puis 7,5 mg/kg toutes les six heures pendant trois jours, puis toutes les douze heures, au maximum 4 g/j. Ce schéma n’est pas présenté ici comme une dose validée d’abcès cérébral amibien.</p><p>Les abcès cérébraux anaérobies figurent dans les indications, et Entamoeba histolytica dans le spectre. Ces deux éléments ne permettent pas de fusionner les preuves. La durée usuelle de cinq à sept jours et la limite normale de dix jours de la notice ne fixent pas seules la durée d’une infection cérébrale rare. Une prolongation exceptionnelle doit être justifiée et surveillée, notamment par hémogramme et examen neurologique.</p><p>Ataxie, paresthésies, confusion, myoclonies ou convulsions peuvent annoncer une toxicité et nécessitent interruption/réévaluation selon la notice. Une progression infectieuse ou mécanique reste à rechercher. L’atteinte hépatique sévère nécessite adaptation ; une clairance inférieure à 10 ml/min favorise l’accumulation de métabolites. Le premier trimestre de grossesse et le syndrome de Cockayne sont des contre-indications lues. Une recommandation générale de relais oral ne valide pas à elle seule un relais de tout traitement cérébral.</p><p>Sources : <button class="w" data-k="g07-r13">[13]</button> · <button class="w" data-k="g07-r16">[16]</button></p></template>
<template data-pop="g07-humatin" data-k="g07-humatin"><h3>Paromomycine intestinale : substance, territoire et restriction</h3><p>La FI suisse de mars 2021 a été retrouvée et lue. Chaque capsule contient 357,2 mg de sulfate correspondant à 250 mg de paromomycine base. La faible absorption explique l’action principalement intestinale ; cela ne traite pas le tissu cérébral. Une muqueuse ulcérée peut toutefois permettre une absorption et augmenter les risques rénaux ou auditifs.</p><p>La notice indique de ne pas administrer Humatin en cas d’amibiase extra-intestinale. Cette restriction n’est pas réécrite comme « ne pas utiliser seul ». Le principe d’un traitement tissulaire puis d’une gestion du réservoir intestinal, décrit par une revue britannique, doit être confronté à cette FI pour le patient et le produit exacts. Une décision spécialisée et pharmaceutique documentée est requise ; aucune dose d’Humatin pour l’atteinte cérébrale n’est donnée.</p><p>L’insuffisance rénale sévère, certaines atteintes digestives obstructives, la myasthénie, la grossesse et l’allaitement font partie des restrictions ou contre-indications lues. Le seuil numérique de rein n’est pas inventé lorsque la notice ne le donne pas. La sécurité ne se résume pas à dire que le produit est peu absorbé.</p><p>Sources : <button class="w" data-k="g07-r16">[16]</button> · <button class="w" data-k="g07-r17">[17]</button></p></template>
<template data-pop="g07-dexamethasone" data-k="g07-dexamethasone"><h3>Galepharm Amp : lire exactement la composition</h3><p>La FI de juin 2022 exprime 4 mg de phosphate dans une ampoule de 1 ml, correspondant à 3,32 mg de dexaméthasone base ; l’ampoule 8 mg par 2 ml correspond à 6,64 mg de base. L’inscription de l’ampoule et une masse de base ne sont donc pas identiques. Aucune conversion silencieuse vers des comprimés n’est effectuée.</p><p>La notice contient des principes généraux de traitement de l’œdème et des schémas distincts d’enfant. Une dose située dans la rubrique pédiatrique n’est pas une dose adulte de méningite tuberculeuse. Le guide clinique précise le syndrome et la population du bénéfice ; la FI précise le produit et ses précautions. L’effet anti-inflammatoire n’est pas l’unique action immédiate de sauvetage d’une menace mécanique.</p><p>L’immunosuppression, les interactions et un sevrage adapté sont discutés selon dose et durée. Le cours ne donne pas de schéma chiffré universel pour toutes les masses G07 ; une indication d’œdème ou de réaction paradoxale se décide avec les spécialistes et se réévalue.</p><p>Sources : <button class="w" data-k="g07-r7">[7]</button> · <button class="w" data-k="g07-r14">[14]</button> · <button class="w" data-k="g07-r15">[15]</button></p></template>
<template data-pop="pareto-g07-pharm" data-k="pareto-g07-pharm"><h3>Produit, territoire et surveillance</h3><p>Ne pas fusionner les notices ; vérifier sel ou ester et base ; garder les restrictions Humatin et les interactions avec le praziquantel ; distinguer durée de méningite et durée de masse isolée ; faire de la prolongation une décision expliquée.</p></template>
