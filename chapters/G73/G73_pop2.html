<template data-pop="g73-firdapse-poso" data-title="Firdapse® : posologie et titration"><div class="lab">Adulte</div><p>Dose de départ de 15 mg par jour en 3 ou 4 prises avec les repas. Augmentation par paliers de 5 mg tous les 4 à 5 jours jusqu’à 60 mg par jour. Dose unique de 20 mg au plus. Exceptionnellement, jusqu’à 80 mg par jour, par paliers de 5 mg tous les 7 jours, sous surveillance clinique et électrocardiographique. La dose de 80 mg par jour ne doit pas être dépassée.</p><div class="lab">Insuffisance rénale ou hépatique</div><p>Modérée ou sévère : 5 mg une fois par jour au départ. Légère : 10 mg par jour (5 mg deux fois). Paliers de 5 mg tous les 7 jours.</p><div class="lab">Contexte</div><p>Dans le SMLE paranéoplasique, traiter la tumeur est essentiel. L’instauration revient à un médecin expérimenté.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680618530019" target="_blank" rel="noopener">Information professionnelle suisse Firdapse®, janvier 2022</a>.</p></template>
<template data-pop="g73-firdapse-ci" data-title="Firdapse® : contre-indications et précautions"><div class="lab">Contre-indications</div><p>Épilepsie ; asthme non contrôlé ; sultopride ; médicaments à marge thérapeutique étroite ; médicaments allongeant le QTc ; QT long congénital ; hypersensibilité.</p><div class="lab">Précautions</div><p>Électrocardiogramme à l’instauration et pendant la titration, puis chaque année si la situation est stable. Crises épileptiques dose-dépendantes : prudence avec antidépresseurs tricycliques, inhibiteurs sélectifs de la recapture de la sérotonine, neuroleptiques, méfloquine, bupropion et tramadol. Schwannomes observés chez le rat : prudence en cas d’antécédent, de neurofibromatose de type 2 ou de schwannomatose. Acétyleurs lents NAT2 : exposition plus forte et plus d’effets indésirables. Les anticholinergiques réduisent l’effet des deux substances.</p><div class="lab">Grossesse</div><p>Ne pas utiliser ; contraception efficace chez la femme en âge de procréer.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680618530019" target="_blank" rel="noopener">Information professionnelle suisse Firdapse®, janvier 2022</a>.</p></template>
<template data-pop="g73-firdapse-ei" data-title="Firdapse® : effets indésirables"><div class="lab">Fréquences</div><table class="t"><thead><tr><th>Fréquence</th><th>Effets</th></tr></thead><tbody><tr><td>Très fréquents</td><td>Vertiges, hypoesthésie, paresthésies périphériques et péribuccales, nausées</td></tr><tr><td>Fréquents</td><td>Extrémités froides, douleurs abdominales</td></tr><tr><td>Fréquence inconnue</td><td>Convulsions, troubles du rythme, crise d’asthme</td></tr></tbody></table><p>L’intensité et l’incidence des effets indésirables dépendent de la dose.</p><div class="lab">Contexte de la cohorte</div><p>À Leiden, des effets indésirables sont survenus chez 58 % des patients, surtout des paresthésies, et l’arrêt a été rare (7 %).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680618530019" target="_blank" rel="noopener">Information professionnelle suisse Firdapse®, janvier 2022</a> ; <a href="https://doi.org/10.1177/22143602261477475" target="_blank" rel="noopener">Bakker et al., traitements au long cours, J Neuromuscul Dis 2026</a>.</p></template>
<template data-pop="g73-firdapse-pk" data-title="Firdapse® : cinétique et surdosage"><div class="lab">Cinétique</div><p>Demi-vie d’environ 2,5 heures ; le métabolite 3-N-acétylé a une demi-vie d’environ 4 heures. De 93 à 100 % sont excrétés dans l’urine en 24 heures. La clairance passe surtout par la N-acétylation, d’où l’effet du statut NAT2.</p><div class="lab">Surdosage</div><p>Vomissements, douleurs abdominales, faiblesse, paresthésies diffuses, convulsions, troubles du rythme.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680618530019" target="_blank" rel="noopener">Information professionnelle suisse Firdapse®, janvier 2022</a>.</p></template>
<template data-pop="g73-mestinon" data-title="Pyridostigmine : Mestinon® et Mestinon retard®"><div class="lab">Indications suisses</div><p>Atonie intestinale, constipation atonique, myasthénie grave. Le SMLE n’est pas une indication ; son usage est hors indication, documenté chez 81 % des patients à Leiden.</p><div class="lab">Contre-indications et prudence</div><p>Contre-indications : obstruction mécanique digestive ou urinaire ; association aux myorelaxants dépolarisants (suxaméthonium) ; hypersensibilité. Prudence : asthme, BPCO, bradycardie, bloc auriculo-ventriculaire, insuffisance cardiaque décompensée, hypotension, ulcère, épilepsie, parkinsonisme, hyperthyroïdie.</p><div class="lab">Crises</div><p>Crise cholinergique (surdosage) : arrêter et assurer le soutien respiratoire. Crise myasthénique : renforcer le traitement.</p><div class="lab">Cinétique</div><p>Demi-vie moyenne d’environ 1,5 heure ; élimination rénale inchangée de 75 à 81 %.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680199430388" target="_blank" rel="noopener">Information professionnelle suisse Mestinon®, juin 2020</a> ; <a href="https://doi.org/10.1177/22143602261477475" target="_blank" rel="noopener">Bakker et al., traitements au long cours, J Neuromuscul Dis 2026</a>.</p></template>
<template data-pop="pareto-g73-notions" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="g73-0,g73-1,g73-2,g73-3,g73-4"></p><ul><li>G73 est un astérisque : il complète toujours le code † de la maladie causale ; le SMLE est G73.1*, tumoral (C00–D48†).</li><li>Prévalence du SMLE ≈ 0,3 pour 100 000 ; CBPC associé chez 50 à 60 %.</li><li>Les anticorps anti-VGCC P/Q baissent la libération d’acétylcholine ; l’amifampridine la facilite en bloquant les canaux potassiques.</li><li>Triade : faiblesse proximale, réflexes abolis puis facilités par l’effort, dysautonomie (≈ 90 %).</li><li>Anti-VGCC présents chez ≈ 90 % ; ils ne distinguent pas forme tumorale et non tumorale.</li></ul></template>
<template data-pop="pareto-g73-myopathies" data-title="Pareto — Autres syndromes et myopathies"><p class="ratio" data-cover="g73-5,g73-6,g73-7,g73-8"></p><ul><li>Pour G73.0, G73.3, G73.6 et G73.7, aucune source clinique : seules les inclusions de la classification sont lues.</li><li>Paralysie périodique thyréotoxique : hypokaliémie par transfert intracellulaire (Na⁺/K⁺-ATPase) ; risques arythmie et insuffisance respiratoire.</li><li>CK non corrigée sous lévothyroxine : chercher une myopathie anti-SRP.</li><li>Myopathie cortisonique : faiblesse indolore, CK normales, atrophie des fibres de type II ; réduire le glucocorticoïde.</li><li>Myosite aiguë bénigne de l’enfant : CK médiane 4 986 U/L, influenza B 63 %, guérison complète.</li></ul></template>
<template data-pop="pareto-g73-conduite" data-title="Pareto — Démarche, urgences, prise en charge et critères"><p class="ratio" data-cover="g73-9,g73-10,g73-11,g73-12,g73-13,g73-14"></p><ul><li>Électrophysiologie obligatoire ; incrément ≥ 60 % : sensibilité 77,8 %, spécificité 98,9 %.</li><li>DELTA-P de 0 à 6 : risque de CBPC de 0 % à 100 % ; TEP-TDM répétée selon le score ; CBPC trouvé dans les 6 mois chez 91 %.</li><li>Amifampridine : 15 mg/jour au départ, 60 mg/jour au maximum, dose unique ≤ 20 mg ; épilepsie contre-indiquée ; ECG à l’instauration.</li><li>Mestinon® : hors indication dans le SMLE.</li><li>Survie normale dans la forme non tumorale ; 17 contre 7 mois dans le SMLE avec CBPC.</li></ul></template>
<template data-pop="pareto-g73-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g73-e-1,g73-e-2,g73-e-3,g73-e-4,g73-e-5,g73-e-6"></p><ul><li>L’électrophysiologie vient avant les anticorps et confirme la suspicion.</li><li>Incrément = (A1 − A0) ÷ A0 × 100 ; seuil recommandé 60 %.</li><li>SOX1 et SOX2 orientent vers le CBPC ; les line-blots SOX1 commerciaux sont peu fiables.</li><li>Une première TEP-TDM normale ne clôt pas la recherche.</li><li>CK : normale dans la myopathie cortisonique, très élevée dans les myopathies anti-SRP et bénigne de l’enfant.</li></ul></template>
<template data-pop="pareto-g73-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="g73-s-physio-body"></p><ul><li>Le calcium entré par les VGCC commande la libération d’acétylcholine.</li><li>Les anticorps anti-VGCC diminuent la probabilité de libération.</li><li>L’amifampridine bloque les canaux potassiques et prolonge la dépolarisation.</li><li>L’hypokaliémie rend la membrane musculaire inexcitable.</li></ul></template>
<template data-pop="pareto-g73-s-immu" data-title="Pareto — Immunologie"><p class="ratio" data-cover="g73-s-immu-body"></p><ul><li>Anti-VGCC : mécanisme ; SOX1 et SOX2 : orientation vers le CBPC ; anti-SRP : myopathie nécrosante.</li><li>Le déclencheur de la forme non tumorale est inconnu ; 38 % ont une autre maladie auto-immune.</li><li>Le lien causal avec les inhibiteurs de points de contrôle reste faible.</li></ul></template>
<template data-pop="pareto-g73-s-elec" data-title="Pareto — Électrophysiologie"><p class="ratio" data-cover="g73-s-elec-body"></p><ul><li>PAMC de repos bas dans le SMLE ; incrément après contraction maximale.</li><li>Seuil de 60 % : 77,8 % et 98,9 % ; seuil de 100 % : 58,7 % et 100 %.</li><li>Le décrément à la stimulation répétée est aussi très sensible.</li></ul></template>
<template data-pop="pareto-g73-s-bioch" data-title="Pareto — Biochimie du muscle"><p class="ratio" data-cover="g73-s-bioch-body"></p><ul><li>Glucocorticoïdes : synthèse freinée (mTOR, IGF-1), dégradation activée (FOXO, MuRF-1, atrogine-1).</li><li>CK normale dans la myopathie cortisonique.</li><li>Réduire le glucocorticoïde et rééduquer.</li></ul></template>
<template data-pop="pareto-g73-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g73-p-1,g73-p-2,g73-p-3,g73-p-4,g73-p-5,g73-p-6"></p><ul><li>Firdapse® : 15 mg/jour au départ, paliers de 5 mg, maximum 60 mg/jour (80 exceptionnellement).</li><li>Contre-indications : épilepsie, asthme non contrôlé, sultopride, médicaments allongeant le QTc, QT long congénital.</li><li>Mestinon® : atonie intestinale, constipation atonique, myasthénie grave ; SMLE hors indication.</li><li>Immunoglobulines intraveineuses : amélioration jusqu’à 8 semaines (9 participants) ; posologies non lues.</li></ul></template>
