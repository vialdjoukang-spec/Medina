<section class="ilot" id="g73-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Les cas de ce chapitre sont des <b>vignettes pédagogiques fictives</b> ; leurs chiffres illustrent le raisonnement et ne proviennent d’aucun dossier réel. Un homme de 61 ans, fumeur, consulte parce qu’il se lève difficilement d’une chaise et monte les escaliers en s’aidant de la rampe. Il a perdu 6 % de son poids en trois mois et se plaint d’une bouche sèche. À l’examen, la force des cuisses est diminuée, les réflexes rotuliens sont abolis au repos, puis ils réapparaissent après que le patient a contracté son quadriceps de toutes ses forces pendant quelques secondes.</p>
<p>Ce tableau clinique pose trois questions successives. La première concerne le mécanisme : quelle structure est atteinte, la jonction neuromusculaire ou le muscle lui-même ? La deuxième concerne la confirmation : quel examen prouve l’atteinte, et lequel ne la prouve pas ? La troisième est la plus urgente : <button class="w" data-k="g73-sous-jacente">quelle maladie générale explique cette atteinte</button>, et faut-il chercher un cancer ? Le chapitre répond dans cet ordre, car la catégorie G73 existe précisément pour relier une manifestation neuromusculaire à sa cause.</p>
<div class="key"><b>À retenir.</b> Devant une faiblesse proximale avec réflexes diminués et signes dysautonomiques, le médecin pense d’abord à une atteinte de la jonction neuromusculaire, la confirme par l’électrophysiologie, puis cherche la maladie causale, en priorité un carcinome bronchique à petites cellules.</div>
</section>
<section class="ilot" id="g73-1"><h2><span class="n">1</span>Définitions et logique de codage</h2>
<p>G73 est une catégorie dite « à astérisque » (*). Dans la CIM-10-GM, un code à <b>croix (†)</b> désigne la maladie causale, et un code à <b>astérisque (*)</b> désigne la manifestation de cette maladie dans un organe. Un code à astérisque ne s’emploie jamais seul : il complète toujours le code † de la maladie qui explique l’atteinte (<button class="w" data-k="g73-codage">règle du double codage</button>). Cette logique impose au médecin une question de fond avant tout code : quelle est la maladie générale responsable ?</p>
<p>Le tableau suivant liste les huit sous-catégories de G73 avec, pour chacune, son intitulé et les codes † cités par la classification allemande de l’Institut fédéral des médicaments et dispositifs médicaux. Les intitulés français viennent du registre de l’Office fédéral de la statistique.</p>

<p>Le tableau montre que G73 réunit deux familles : les <b>syndromes myasthéniques</b> (G73.0 à G73.3), où la lésion siège à la jonction entre le nerf et le muscle, et les <b>myopathies</b> (G73.4 à G73.7), où la lésion siège dans le muscle. Le syndrome de Lambert-Eaton (G73.1) est l’entité la mieux documentée ; il structure donc la première moitié du cours. Ce choix est pédagogique, et non une hiérarchie de fréquence. Les myopathies des maladies générales forment la seconde moitié.</p>
<div class="trap"><span class="k">Piège</span> La page de la classification lue ne mentionne pas d’exclusion propre à G73, et le résumé obtenu ne restitue pas tous les termes d’inclusion mot pour mot. Deux diagnostics traités dans ce cours, la paralysie périodique thyréotoxique et la myopathie cortisonique, <b>n’ont pas de code vérifié</b> : ils sont présentés comme diagnostics différentiels, sans leur attribuer de code G73.</div>

<section class="ilot" id="g73-2"><h2><span class="n">2</span>Fréquence et terrain</h2>
<p>Le syndrome myasthénique de Lambert-Eaton (<button class="w" data-k="g73-smle">SMLE</button>) est rare. Une revue néerlandaise actualisée rapporte une prévalence moyenne d’environ 0,3 pour 100 000 habitants. Les syndromes neurologiques paranéoplasiques dans leur ensemble touchent environ un patient cancéreux sur 300, avec une incidence rapportée de 1,6 à 8,9 par million de personnes-années. Aucune donnée épidémiologique suisse n’a été trouvée pour ce cours.</p>

<tr><td>Proportion de formes non tumorales</td><td>77 %</td><td>Même cohorte, centre tertiaire : la proportion varie selon le recrutement</td></tr>

<p>Le tableau appelle deux commentaires. D’une part, le <button class="w" data-k="g73-cbpc">carcinome bronchique à petites cellules</button> (CBPC) accompagne le SMLE chez environ un patient sur deux ou sur trois, selon les séries : la proportion de formes tumorales dépend du recrutement du centre. D’autre part, 38 % des patients ont une autre maladie auto-immune, ce qui rappelle que la forme non tumorale reste un terrain d’auto-immunité. Un centre tertiaire attire les cas complexes ; ses pourcentages ne se transposent donc pas sans réserve à un cabinet de médecine générale.</p>

<section class="ilot" id="g73-3"><h2><span class="n">3</span>De la jonction normale au syndrome de Lambert-Eaton</h2>
<h3>3.1 La jonction neuromusculaire normale</h3>
<p>À l’extrémité du nerf moteur, la <button class="w" data-k="g73-jonction">zone active présynaptique</button> libère l’acétylcholine à chaque potentiel d’action. La probabilité de cette libération dépend de la relation entre les canaux calciques voltage-dépendants et les vésicules arrimées à la membrane. Le calcium qui entre par ces canaux déclenche la fusion des vésicules : sans entrée suffisante de calcium, il y a moins d’acétylcholine dans la fente, et le muscle reçoit un signal plus faible.</p>
<h3>3.2 Le mécanisme pathologique</h3>
<p>Dans le SMLE, des anticorps dirigés contre les <button class="w" data-k="g73-vgcc">canaux calciques voltage-dépendants de type P/Q</button> (VGCC) de la terminaison motrice et du système nerveux autonome réduisent la libération d’acétylcholine. Deux conséquences découlent du siège de la lésion. Premièrement, une faiblesse musculaire apparaît, parce que la jonction transmet moins bien le signal moteur. Deuxièmement, des symptômes autonomes s’ajoutent (bouche sèche, constipation, dysfonction érectile), parce que les mêmes canaux existent dans le système nerveux autonome.</p>
<table class="t"><thead><tr><th>Forme</th><th>Mécanisme proposé</th><th>Niveau de preuve dans les sources lues</th></tr></thead><tbody>
<tr><td>Paranéoplasique</td><td>Les anticorps dirigés contre les VGCC exprimés à la surface de la tumeur réagiraient de manière croisée avec les VGCC présynaptiques</td><td>Hypothèse retenue par l’étude de cohorte (« on pense que »)</td></tr>
<tr><td>Non tumorale</td><td>Déclencheur inconnu</td><td>Inconnu</td></tr>
<tr><td>Zone active</td><td>Désorganisation de la zone active et anticorps éventuels contre d’autres protéines présynaptiques</td><td>Données expérimentales (modèle murin, simulations) : hypothèse de recherche, non fait clinique établi</td></tr>
</tbody></table>
<p>Le tableau sépare ce que les sources lues établissent de ce qu’elles supposent. Le rôle des anticorps anti-VGCC dans la baisse de libération est admis. Le déclencheur de la forme non tumorale reste inconnu, et la désorganisation de la zone active n’est qu’une piste de recherche. Cette distinction compte pour l’examen : l’étudiant doit savoir que l’anticorps explique le mécanisme, sans que sa présence prouve un cancer.</p>
<div class="key"><b>Science → clinique.</b> L’amifampridine bloque les canaux potassiques voltage-dépendants, prolonge la dépolarisation de la terminaison, augmente l’entrée de calcium et facilite la libération d’acétylcholine. Le traitement symptomatique compense donc le défaut de libération sans éliminer l’anticorps.</div>
<p class="src">Références : <a href="https://doi.org/10.3390/biom12060740" target="_blank" rel="noopener">Ginebaugh et al., zone active de la jonction, Biomolecules 2022</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a> ; <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680618530019" target="_blank" rel="noopener">Information professionnelle suisse Firdapse®, janvier 2022</a>.</p>
</section>
<section class="ilot" id="g73-4"><h2><span class="n">4</span>Clinique du syndrome de Lambert-Eaton</h2>
<p>Le SMLE associe une faiblesse musculaire proximale, une perte des réflexes ostéotendineux et une dysautonomie. La faiblesse débute habituellement aux membres inférieurs, puis gagne les membres supérieurs, les muscles distaux et, enfin, les muscles oculaires et bulbaires. Dans les formes sévères, l’atteinte respiratoire est possible.</p>
<div class="two"><div class="card"><h4>Signes moteurs et réflexes</h4><p>La faiblesse proximale explique la difficulté à se lever d’une chaise. Les réflexes sont diminués ou abolis au repos, puis <button class="w" data-k="g73-facilitation">réapparaissent ou s’améliorent après un effort répété</button> ou une contraction volontaire maximale. Les sources lues décrivent cette facilitation comme un signe clinique ; elles n’en détaillent pas le mécanisme cellulaire.</p></div><div class="card"><h4>Dysautonomie</h4><p>Elle touche environ 90 % des patients et constitue la marque du SMLE : bouche sèche, dysfonction érectile, constipation. La dysfonction érectile est l’un des six items du <button class="w" data-k="g73-deltap">score DELTA-P</button> ; ces signes se cherchent donc à l’interrogatoire. Les troubles urinaires reposent sur une seule étude du SMLE dans une revue exploratoire.</p></div></div>
<p>La chronologie guide le raisonnement : l’atteinte part des membres inférieurs et remonte, ce qui explique que les muscles oculaires et bulbaires soient touchés en dernier. Chez l’enfant, la littérature recense 19 cas de SMLE, avec moins de cancers et moins de dysautonomie que chez l’adulte.</p>
<div class="trap"><span class="k">Piège</span> Les <b>anticorps anti-VGCC P/Q</b> sont présents chez près de 90 % des patients : ils ne sont donc <b>pas indispensables au diagnostic</b>, et un résultat négatif n’exclut pas un SMLE. De plus, ils sont aussi fréquents dans les formes paranéoplasiques que dans les formes non tumorales ; leur présence ne dit pas s’il existe un cancer.</div>
<p class="src">Références : <a href="https://doi.org/10.1212/NXI.0000000000001014" target="_blank" rel="noopener">Graus et al., critères PNS-Care, Neurol Neuroimmunol Neuroinflamm 2021</a> ; <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a> ; <a href="https://doi.org/10.1002/mus.70337" target="_blank" rel="noopener">Augustin et al., dysfonction urinaire, Muscle Nerve 2026</a> ; <a href="https://doi.org/10.3988/jcn.2024.0018" target="_blank" rel="noopener">Oh, syndrome de Lambert-Eaton pédiatrique, J Clin Neurol 2024</a>.</p>

<section class="ilot" id="g73-5"><h2><span class="n">5</span>Autres syndromes myasthéniques : G73.0, G73.2 et G73.3</h2>
<p>Trois autres sous-catégories de syndromes myasthéniques accompagnent le SMLE. G73.0* s’applique aux syndromes myasthéniques des maladies endocriniennes, dont la classification cite l’hyperthyroïdie et l’amyotrophie diabétique. G73.2* regroupe les syndromes myasthéniques tumoraux autres que le SMLE. G73.3* couvre les syndromes myasthéniques des autres maladies classées ailleurs. Pour G73.0 et G73.3, <b>aucune source clinique n’a été lue</b> en dehors des termes d’inclusion de la classification : le cours ne décrit donc ni signes, ni examens, ni traitement propres à ces deux codes.</p>
<p>Pour G73.2*, deux observations isolées montrent que le <button class="w" data-k="g73-cbpc">carcinome bronchique à petites cellules</button> n’est pas la seule tumeur associée au SMLE. Un carcinome neuroendocrine du larynx avec SMLE est décrit comme le deuxième cas de la littérature ; un adénocarcinome pulmonaire avec une mutation du récepteur du facteur de croissance épidermique (EGFR) est aussi rapporté. Un cas isolé ne fixe ni fréquence ni règle ; il impose une conséquence pratique : le bilan tumoral ne se limite pas à la recherche d’un carcinome bronchique à petites cellules chez un fumeur.</p>
<div class="alert"><b>Limite documentaire.</b> Ni les syndromes myasthéniques de l’hyperthyroïdie, ni ceux de l’amyotrophie diabétique, ni ceux de G73.3* ne sont documentés par une source clinique lue pour ce cours. Le lecteur ne doit pas y chercher de repères chiffrés.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G70–G73</a> ; <a href="https://doi.org/10.1177/03000605211014784" target="_blank" rel="noopener">Mesolella et al., carcinome neuroendocrine laryngé, J Int Med Res 2021</a> ; <a href="https://doi.org/10.1111/1759-7714.13385" target="_blank" rel="noopener">Wang et al., adénocarcinome pulmonaire, Thorac Cancer 2020</a>.</p>
</section>
<section class="ilot" id="g73-6"><h2><span class="n">6</span>Myopathies des maladies endocriniennes (G73.5)</h2>
<p>La classification place sous G73.5* la myopathie thyréotoxique, l’hyperparathyroïdie et l’hypoparathyroïdie. Les maladies des parathyroïdes ne sont pas documentées par une source clinique lue pour ce cours. Les autres atteintes endocriniennes du muscle décrites ci-dessous viennent de cas et de revues ; leur rattachement exact à G73 n’est pas toujours vérifié, et le texte le signale à chaque fois.</p>
<h3>6.1 Myopathie thyréotoxique</h3>
<p>Chez l’adulte, la myopathie thyréotoxique est fréquente et s’améliore habituellement avec le traitement de l’hyperthyroïdie. Une enfant a vu sa faiblesse proximale s’améliorer en trois mois avec la normalisation hormonale. Au début du traitement par méthimazole et métoprolol, la faiblesse s’est aggravée de façon transitoire. Le médecin signale donc au patient qu’une aggravation initiale est possible avant l’amélioration.</p>
<h3>6.2 Paralysie périodique hypokaliémique thyréotoxique</h3>
<p>Cette affection constitue un diagnostic différentiel aigu. Elle se traduit par des épisodes transitoires de faiblesse avec <b>hypokaliémie</b> au cours d’une hyperthyroïdie. Elle prédomine chez l’homme, surtout d’origine asiatique. Le <button class="w" data-k="g73-periodique">mécanisme</button> repose sur l’augmentation de la Na⁺/K⁺-ATPase induite par les hormones thyroïdiennes et sur une sensibilité β-adrénergique accrue : le potassium passe du sang vers l’intérieur des cellules, et le pic d’insuline qui suit un repas aggrave ce transfert. L’hypokaliémie hyperpolarise la membrane musculaire et la rend inexcitable. Les risques sont les arythmies et l’insuffisance respiratoire. Son rattachement à un code CIM n’a pas été vérifié.</p>
<h3>6.3 Myopathie hypothyroïdienne</h3>
<p>La myopathie hypothyroïdienne peut simuler une myosite. Sous inhibiteur de point de contrôle immunitaire, elle survient typiquement plus de deux mois après le début du traitement. Le délai et la présence d’un myœdème la distinguent de la myosite immunologique ; contrairement à celle-ci, elle permet de poursuivre l’immunothérapie. Inversement, une myopathie nécrosante auto-immune avec <button class="w" data-k="g73-srp">anticorps anti-SRP</button> peut être prise à tort pour une myopathie hypothyroïdienne : chez une patiente, la créatine kinase atteignait 6 106 U/L malgré l’hormonothérapie, et la biopsie ainsi que les anticorps spécifiques ont corrigé le diagnostic. La leçon pratique est sans ambiguïté : une créatine kinase qui ne baisse pas sous lévothyroxine impose de chercher une autre cause. La classification lue ne cite pas l’hypothyroïdie dans les inclusions de G73.5.</p>
<h3>6.4 Autres atteintes endocriniennes</h3>
<p>Une rhabdomyolyse peut survenir au cours d’une insuffisance surrénalienne, d’après un cas avec revue, et l’hypercorticisme (syndrome de Cushing) s’accompagne de myopathie. Ces deux mentions ne reposent que sur une publication chacune et ne permettent pas de décrire la clinique ni la prise en charge.</p>
<h3>6.5 Myopathie cortisonique</h3>
<p>La <button class="w" data-k="g73-cortisone">myopathie cortisonique</button> est iatrogène et son rattachement CIM habituel n’est pas vérifié. Elle se manifeste par une faiblesse proximale <b>non douloureuse</b> avec amyotrophie, prédominante aux membres inférieurs. La créatine kinase est normale ou peu élevée. La biopsie montre une atrophie préférentielle des fibres de type II sans infiltrat inflammatoire. Le mécanisme associe une inhibition de la synthèse protéique et une activation de la dégradation des protéines musculaires. La conduite consiste à réduire progressivement ou arrêter les glucocorticoïdes, et à proposer une rééducation par exercices de résistance et d’endurance.</p>

<p>Le tableau ordonne les quatre atteintes selon un seul critère, le signe qui oriente. Il met aussi en évidence la prudence nécessaire : chacune des quatre atteintes porte un avertissement, soit sur l’évolution, soit sur le diagnostic, soit sur le code.</p>

<section class="ilot" id="g73-7"><h2><span class="n">7</span>Myopathies infectieuses et parasitaires (G73.4)</h2>
<p>Deux entités illustrent ce code dans les sources lues. La première est la <button class="w" data-k="g73-myosite-enfant">myosite aiguë bénigne de l’enfant</button>. Dans une série portugaise de 47 cas (2016–2024), les garçons représentent 66 % des enfants et l’âge médian est de 7 ans. Les enfants présentent un prodrome fébrile respiratoire, puis une douleur bilatérale des mollets. La créatine kinase médiane atteint 4 986 U/L. Le virus influenza B est retrouvé dans 63 % des cas. Tous les enfants ont guéri complètement, avec un séjour médian de 3,2 jours, et aucun cas n’est survenu pendant la pandémie de COVID-19.</p>
<p>La seconde est la <button class="w" data-k="g73-trichinellose">trichinellose</button>. Entre 1986 et 2009, 65 818 cas et 42 décès ont été rapportés, dont 87 % dans la Région européenne de l’Organisation mondiale de la santé. La viande de porc est la source principale, et le gibier est une source fréquente. Les signes principaux sont les myalgies, la diarrhée, la fièvre, l’œdème facial et les céphalées. Le traitement et le diagnostic sérologique ne sont pas documentés dans les sources lues.</p>
<div class="trap"><span class="k">Piège</span> Une créatine kinase de 4 986 U/L impressionne, mais dans la myosite aiguë bénigne de l’enfant elle s’accompagne d’une guérison complète et spontanée dans toute la série. Le médecin documente la valeur et l’évolution, sans conclure à une gravité à partir du seul chiffre.</div>
<p class="src">Références : <a href="https://doi.org/10.3390/pediatric18020047" target="_blank" rel="noopener">Ferreira et al., myosite aiguë bénigne de l’enfant, Pediatr Rep 2026</a> ; <a href="https://doi.org/10.3201/eid1712.110896" target="_blank" rel="noopener">Murrell et Pozio, trichinellose dans le monde, Emerg Infect Dis 2011</a>.</p>
</section>
<section class="ilot" id="g73-8"><h2><span class="n">8</span>Myopathies métaboliques et des connectivites : G73.6 et G73.7</h2>
<p>G73.6* concerne les myopathies des maladies métaboliques, dont la classification cite la glycogénose (E74.0†) et les lipidoses (E75.-†). G73.7* concerne les myopathies d’autres maladies classées ailleurs, dont la polyarthrite rhumatoïde, le syndrome sec, la sclérodermie et le lupus érythémateux systémique. Pour ces deux codes, <b>seuls les termes d’inclusion de la classification ont été lus</b> : aucune source clinique ne décrit les signes, les examens ou le traitement.</p>
<p>Le cours ne comble pas cette lacune par des généralités. Il fournit à l’étudiant la méthode qui s’applique à chaque code astérisque : identifier la maladie causale par son code †, poser la question de l’atteinte neuromusculaire dans cette maladie, puis chercher une cause médicamenteuse ou endocrinienne associée. Un exemple de ce chapitre l’illustre : une myopathie hypothyroïdienne peut survenir sous inhibiteur de point de contrôle immunitaire (section 6.3). Les sources lues ne documentent pas la fréquence de cette situation.</p>
<div class="alert"><b>Limite documentaire.</b> La myopathie des glycogénoses, des lipidoses, de la polyarthrite rhumatoïde, du syndrome sec, de la sclérodermie et du lupus n’est pas décrite par une source clinique lue pour ce cours. Le lecteur consultera la littérature spécialisée de chaque maladie causale.</div>
