<template data-pop="g58-cim" data-title="Sous-catégories et codes voisins de G58">
<div class="lab">Définition</div><p>La catégorie G58 de la CIM-10-GM 2024 comprend G58.0 (névrite intercostale), G58.7 (mononévrite de sièges multiples, qui inclut la mononeuropathia multiplex), G58.8 (autres mononévrites précisées) et G58.9 (mononévrite sans précision). Elle regroupe les mononeuropathies qui ne relèvent ni du membre supérieur (G56) ni du membre inférieur (G57).</p>
<div class="lab">Exclusions</div><p>Le bloc G50–G59 exclut les lésions traumatiques aiguës d’un nerf, d’une racine ou d’un plexus, qui se codent selon leur localisation ; la névralgie et la névrite sans précision (M79.2) ; la névrite périphérique de la grossesse (O26.83) ; la radiculite sans précision (M54.1).</p>
<div class="lab">Codes voisins à ne pas confondre</div><p>La mononeuropathie diabétique est classée G59.0* (avec un code E10–E14† de quatrième caractère .4), les autres mononeuropathies au cours de maladies classées ailleurs G59.8*, et la névralgie post-zostérienne G53.0* (B02.2†), rubrique des nerfs crâniens.</p>
<div class="lab">Limite</div><p>Le codage de la névralgie post-zostérienne du tronc n’est pas établi dans les sources lues : G53.0* concerne les nerfs crâniens. Le codeur vérifie le catalogue en vigueur avant d’attribuer un code.</p>
<p>Le cours est organisé par la clinique et non par le code ; ce rappel sert uniquement à situer la catégorie.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G50–G59</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, exclusions et codes voisins</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 (version française)</a>.</p></template>
<template data-pop="g58-mnm" data-title="Mononévrite multiple">
<div class="lab">Définition</div><p>La mononévrite multiple (ou mononeuropathie multiple) est une neuropathie périphérique asymétrique qui touche plusieurs nerfs individuels. Elle est fréquemment associée aux vascularites et à d’autres affections dysimmunitaires, et représente le schéma classique de l’ischémie de nerfs individuels.</p>
<div class="lab">Application</div><p>Le médecin reconstitue l’ordre d’apparition des déficits nerf par nerf. Un pied tombant, puis une hypoesthésie ulnaire de l’autre côté, évoque une mononévrite multiple. Les formes ne sont pas toutes typiques : 10 à 40 % des cas prouvés par biopsie se présentent comme une neuropathie distale symétrique.</p>
<div class="lab">Évolution</div><p>Les mononeuropathies successives se chevauchent et aboutissent à une polyneuropathie sensitivomotrice axonale, symétrique ou non. Reconnaître le motif tôt évite de la confondre avec une polyneuropathie banale.</p>
<div class="lab">Limite</div><p>Le motif est clinique ; il ne dit pas la cause. Il impose le bilan d’une vascularite mais ne la prouve pas.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://doi.org/10.1055/s-0044-1791499" target="_blank" rel="noopener">Pacut et Gwathmey, Seminars in Neurology 2024 (résumé)</a> ; <a href="https://doi.org/10.31138/mjr.280725.ecz" target="_blank" rel="noopener">Mourtzos et coll., Mediterranean Journal of Rheumatology 2026 (résumé)</a>.</p></template>
<template data-pop="g58-vasculites" data-title="Vascularites associées à une neuropathie">
<div class="lab">Définition</div><p>Les vascularites associées à une neuropathie comprennent les formes primaires systémiques (périartérite noueuse ; vascularites à ANCA : granulomatose avec polyangéite, polyangéite microscopique, granulomatose éosinophilique avec polyangéite), les formes secondaires (polyarthrite rhumatoïde, Sjögren, lupus, sclérodermie, sarcoïdose, cryoglobulinémie, infections, médicaments, néoplasies) et la neuropathie vasculitique non systémique.</p>
<div class="lab">Application</div><p>Le médecin cherche l’atteinte d’autres organes (poumon, rein, peau, cœur, œil) : sa présence oriente vers une forme systémique, son absence vers la NSVN, après exclusion des critères de la Peripheral Nerve Society.</p>
<div class="lab">Fréquence</div><p>Les fourchettes de neuropathie varient selon la maladie et la série : périartérite noueuse 65–85 %, EGPA 65–80 %, cryoglobulinémie 30–70 %, polyarthrite rhumatoïde 15–70 % (Blaes). Elles se présentent comme des fourchettes, non comme des probabilités exactes.</p>
<div class="lab">Limite</div><p>Les chiffres sont issus de revues et de séries historiques ; aucune donnée suisse n’a été retrouvée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a>.</p></template>
<template data-pop="g58-pns" data-title="Lignes directrices de la Peripheral Nerve Society, 2010">
<div class="lab">Définition</div><p>La Peripheral Nerve Society a publié en 2010 un résumé de ligne directrice sur la neuropathie vasculitique non systémique (NSVN). Elle définit la vascularite certaine, la vascularite probable et la vascularite cliniquement probable sans biopsie, ainsi que les critères d’exclusion de la NSVN.</p>
<div class="lab">Critères d’exclusion</div><p>Une atteinte d’un autre organe, des ANCA, des cryoglobulines, une VS ≥ 100 mm/h ou une affection ou un médicament prédisposant à une vascularite systémique plaident contre une NSVN.</p>
<div class="lab">Recommandations</div><p>Corticothérapie seule pendant au moins six mois, association en cas de progression rapide ou sous corticoïdes seuls, cyclophosphamide en bolus pour les formes sévères, entretien de 18 à 24 mois par azathioprine ou méthotrexate après rémission sous association.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu : le texte intégral a été refusé (erreur 403). Les preuves sont de classe III. La société est internationale, le premier auteur est américain, et aucune mise à jour n’a été retrouvée.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society, lignes directrices sur la neuropathie vasculitique non systémique, 2010 (résumé)</a>.</p></template>
<template data-pop="g58-vasanervorum" data-title="Vasa nervorum et zone frontière">
<div class="lab">Définition</div><p>Les vasa nervorum sont les vaisseaux qui nourrissent le nerf périphérique. Les vaisseaux de l’épinèvre, de 50 à 300 µm, sont la cible principale des vascularites.</p>
<div class="lab">Mécanisme</div><p>Une inflammation de la paroi rétrécit la lumière et provoque une ischémie. Les lésions se concentrent dans une zone frontière de vascularisation (« watershed »), au tiers proximal-moyen du nerf, où survient la perte axonale.</p>
<div class="lab">Application</div><p>Cette notion explique qu’une atteinte vasculaire touche des nerfs un à un et laisse d’autres nerfs indemnes, et justifie de choisir pour la biopsie un nerf cliniquement atteint ou sensitif de petit territoire.</p>
<div class="lab">Limite</div><p>La description anatomique de la zone frontière est issue de revues ; la biopsie ne prélève qu’un segment.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a> ; <a href="https://doi.org/10.1111/jns.70086" target="_blank" rel="noopener">Pereira et coll., Journal of the Peripheral Nervous System 2025 (résumé)</a>.</p></template>
<template data-pop="g58-anca" data-title="Anticorps anti-cytoplasme des polynucléaires neutrophiles">
<div class="lab">Définition</div><p>Les ANCA sont des auto-anticorps dirigés contre le cytoplasme des neutrophiles ; les deux cibles utiles sont la protéinase 3 (PR3) et la myéloperoxydase (MPO).</p>
<div class="lab">Application</div><p>Dans la polyangéite microscopique, environ 80 % des patients ont des ANCA anti-MPO ; dans la granulomatose avec polyangéite, environ 80 % ont des anti-PR3 ; dans l’EGPA, 30 à 40 % ont des anti-MPO (Koike). La neuropathie vasculitique est associée à la positivité MPO-ANCA dans une étude de 955 patients.</p>
<div class="lab">Limite</div><p>Les ANCA orientent mais ne prouvent pas ; une vascularite à ANCA peut rester sans anticorps détectable. L’EULAR 2022 recommande la biopsie et la recherche d’ANCA pour établir le diagnostic.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/ard-2022-223764" target="_blank" rel="noopener">EULAR, recommandations sur les vascularites à ANCA, mise à jour 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a>.</p></template>
<template data-pop="g58-cryo" data-title="Cryoglobulinémie et hépatite C">
<div class="lab">Définition</div><p>La cryoglobulinémie est une vascularite secondaire où des complexes immuns activent le complément. Elle est associée à l’hépatite C, mais seulement environ 15 % des patients VHC ont une vascularite clinique.</p>
<div class="lab">Application</div><p>Le médecin recherche les cryoglobulines, la sérologie VHC et les fractions C3 et C4. La neuropathie touche 30 à 70 % des cas selon Blaes.</p>
<div class="lab">Traitement</div><p>Le traitement antiviral est la première ligne ; le rituximab a amélioré la neuropathie chez 44 % de 87 patients dans une série citée.</p>
<div class="lab">Limite</div><p>Les molécules antivirales citées datent de 2015 ; les recommandations européennes actuelles (EASL) n’ont pas été lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a>.</p></template>
<template data-pop="g58-llv" data-title="Vasculopathie livédoïde">
<div class="lab">Définition</div><p>La vasculopathie livédoïde est une atteinte occlusive micro-thrombotique sans vascularite, qui peut causer une mononeuropathie multiple ischémique.</p>
<div class="lab">Application</div><p>Elle est un imitateur de la vascularite : une série de 16 patients français décrit sa neuropathie. Elle se traite par antithrombotiques et non par immunosuppression.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu ; la série est petite.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-022-11007-z" target="_blank" rel="noopener">Soulages et coll., Journal of Neurology 2022 (résumé)</a>.</p></template>
<template data-pop="g58-medic" data-title="Médicaments inducteurs">
<div class="lab">Définition</div><p>Plusieurs médicaments sont associés à une neuropathie vasculitique : naproxène, minocycline, propylthiouracile, pénicilline, phénytoïne, cocaïne, héroïne (Blaes), nitrofurantoïne et minocycline (Aladawi), anti-TNF-α (Ruffer).</p>
<div class="lab">Application</div><p>Le médecin dresse la liste complète des produits pris et arrête ou remplace l’agent suspect avant d’attribuer la neuropathie à une maladie systémique.</p>
<div class="lab">Limite</div><p>Les données reposent sur des cas et revues, souvent nord-américaines ; elles établissent une association, non une fréquence.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://doi.org/10.1097/CND.0000000000000404" target="_blank" rel="noopener">Aladawi et coll., Journal of Clinical Neuromuscular Disease 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a>.</p></template>
<template data-pop="g58-icp" data-title="Neuropathie sous inhibiteur de point de contrôle">
<div class="lab">Définition</div><p>Un inhibiteur de point de contrôle immunitaire (pembrolizumab) peut induire une mononévrite multiple.</p>
<div class="lab">Application</div><p>Cette cause est à évoquer devant une neuropathie asymétrique survenant sous traitement ; un traitement rapide est nécessaire.</p>
<div class="lab">Limite</div><p>La source est un cas irlandais lu dans son résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s11845-025-04157-2" target="_blank" rel="noopener">Redmond et coll., Irish Journal of Medical Science 2025 (résumé)</a>.</p></template>
<template data-pop="g58-intercostale" data-title="Névralgie intercostale">
<div class="lab">Définition</div><p>La névralgie intercostale est une douleur neuropathique dans le territoire d’un ou plusieurs nerfs intercostaux.</p>
<div class="lab">Causes</div><p>Post-thoracotomie et post-zostérienne (les plus fréquentes), traumatisme costal, geste iatrogène (drain, mastectomie, chirurgie mammaire), tassement vertébral, compression, grossesse, causes inflammatoires, infectieuses ou néoplasiques.</p>
<div class="lab">Application</div><p>La douleur est brûlante, en éclair ou sourde, aggravée par l’inspiration profonde, la toux ou la rotation du tronc. Le diagnostic est clinique, avec un bloc diagnostique en appui.</p>
<div class="lab">Limite</div><p>Il n’existe pas de critère diagnostique universel. La revue principale est nord-américaine et ses faits sont descriptifs.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13459936/" target="_blank" rel="noopener">Shamoun et coll., Journal of Thoracic Disease 2026 (revue)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42804317/" target="_blank" rel="noopener">Yavuz et coll., Pain Physician 2026 (résumé)</a>.</p></template>
<template data-pop="g58-hernie" data-title="Hernie discale thoracique">
<div class="lab">Définition</div><p>La hernie discale thoracique représente 2 % des hernies discales et donne une irradiation thoracique en ceinture qui imite une névralgie intercostale.</p>
<div class="lab">Application</div><p>Le médecin recherche les drapeaux rouges. Une perte de jusqu’à 40 % du volume herniaire et une amélioration spontanée fréquente sont décrites.</p>
<div class="lab">Limite</div><p>Seul le résumé de la revue allemande a été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00132-025-04738-0" target="_blank" rel="noopener">Benditz et coll., Die Orthopädie 2025 (résumé)</a>.</p></template>
<template data-pop="g58-acnes" data-title="ACNES et scratch collapse test">
<div class="lab">Définition</div><p>Le syndrome de piégeage des nerfs cutanés antérieurs (ACNES) est une neuropathie de piégeage de branches des nerfs intercostaux T7–T12 dans les muscles grands droits.</p>
<div class="lab">Application</div><p>Une zone d’altération de la sensibilité cutanée recouvre un point douloureux maximal. Le scratch collapse test est positif chez 19 patients sur 20 ; sensibilité 95 % (75–99), spécificité 100 % (83–100). Le traitement est étagé : infiltrations, radiofréquence pulsée, neurectomie (environ 1 patient sur 5 réussit sous radiofréquence pulsée, environ 2 sur 3 après neurectomie).</p>
<div class="lab">Limite</div><p>Cohortes néerlandaises, à prédominance féminine (77 % de femmes, âge moyen 42 ans, n = 260) ; résumés seuls.</p>
<p class="src">Références : <a href="https://doi.org/10.1515/sjpain-2024-0026" target="_blank" rel="noopener">Jacobs et coll., Scandinavian Journal of Pain 2024 (résumé)</a> ; <a href="https://doi.org/10.1111/papr.13305" target="_blank" rel="noopener">ten Have et coll., Pain Practice 2023 (résumé)</a> ; <a href="https://doi.org/10.3389/jaws.2024.13508" target="_blank" rel="noopener">ten Have et coll., Journal of Abdominal Wall Surgery 2024 (résumé)</a> ; <a href="https://doi.org/10.1111/pan.14890" target="_blank" rel="noopener">ten Have et coll., Paediatric Anaesthesia 2024 (résumé)</a>.</p></template>
<template data-pop="g58-schepelmann" data-title="Signe de Schepelmann">
<div class="lab">Définition</div><p>Le signe de Schepelmann est la douleur provoquée par l’inclinaison latérale du tronc.</p>
<div class="lab">Application</div><p>Une douleur du côté de l’inclinaison évoque une atteinte pariétale, une douleur controlatérale évoque une cause pleurale.</p>
<div class="lab">Limite</div><p>Signe clinique décrit dans une revue ; sa sensibilité n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13459936/" target="_blank" rel="noopener">Shamoun et coll., Journal of Thoracic Disease 2026 (revue)</a>.</p></template>
<template data-pop="g58-sf" data-title="Neuropathie des petites fibres">
<div class="lab">Définition</div><p>La neuropathie des petites fibres est non inflammatoire et ne se traite pas par immunosuppression.</p>
<div class="lab">Application</div><p>Le diagnostic positif repose sur des signes thermoalgiques et une neurographie normale ; la biopsie cutanée mesure la densité des fibres intraépidermiques. Plus de la moitié des cas restent sans étiologie.</p>
<div class="lab">Limite</div><p>Source suisse (Revue Médicale Suisse, résumé).</p>
<p class="src">Références : <a href="https://doi.org/10.53738/REVMED.2022.18.779.803" target="_blank" rel="noopener">Théaudin et coll., Revue Médicale Suisse 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a>.</p></template>
<template data-pop="g58-axonal" data-title="Neuropathie axonale">
<div class="lab">Définition</div><p>Une neuropathie axonale résulte de la perte d’axones. Elle se traduit à l’électrophysiologie par des amplitudes réduites et des vitesses conservées.</p>
<div class="lab">Application</div><p>Dans la neuropathie vasculitique, l’ischémie du nerf détruit des axones ; le tableau est donc axonal, multifocal et asymétrique.</p>
<div class="lab">Limite</div><p>Une atteinte axonale n’est pas spécifique de la vascularite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a>.</p></template>
