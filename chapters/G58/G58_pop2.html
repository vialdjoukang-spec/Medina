<template data-pop="g58-ncs" data-title="Électrophysiologie de la mononévrite multiple">
<div class="lab">Définition</div><p>La neurographie et l’EMG mesurent la conduction et l’activité musculaire. L’atteinte est axonale et multifocale : amplitudes motrices (CMAP) et sensitives réduites, vitesses et latences distales conservées.</p>
<div class="lab">Seuil</div><p>Une asymétrie d’amplitude d’au moins 50 % entre les deux côtés est considérée comme significative ; l’EMG montre des signes neurogènes (fibrillations, potentiels polyphasiques, de longue durée ou de grande amplitude).</p>
<div class="lab">Application</div><p>L’examen confirme la suspicion et oriente le choix du nerf à biopsier. Une électrophysiologie non démyélinisante fait partie des critères de vascularite cliniquement probable.</p>
<div class="lab">Limite</div><p>L’examen ne désigne pas la cause. Il est normal dans les atteintes des petites fibres.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society, lignes directrices sur la neuropathie vasculitique non systémique, 2010 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a>.</p></template>
<template data-pop="g58-biopsie" data-title="Biopsie nerf et muscle">
<div class="lab">Définition</div><p>La biopsie combinée du nerf et du muscle est l’examen de référence pour démontrer une vascularite nerveuse.</p>
<div class="lab">Indications</div><p>Neuropathie suffisamment sévère ou progressive, absence d’autre étiologie claire, conséquence thérapeutique (immunosuppression).</p>
<div class="lab">Application</div><p>On choisit le nerf sural (petit territoire sensitif) ou un nerf cliniquement atteint ; les associations sont le nerf péronier superficiel avec le court péronier, ou le sural avec le gastrocnémien. Une biopsie cutanée profonde au bord d’un ulcère est proposée dans la vascularite rhumatoïde.</p>
<div class="lab">Limite</div><p>La sensibilité de la biopsie nerveuse pour une vascularite certaine ne dépasse pas 50 à 60 % (Koike) ; dans la série brésilienne de NSVN, 2 patients sur 14 avaient une vascularite certaine. Un résultat négatif n’exclut pas la maladie.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society, lignes directrices sur la neuropathie vasculitique non systémique, 2010 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a> ; <a href="https://doi.org/10.1111/jns.70086" target="_blank" rel="noopener">Pereira et coll., Journal of the Peripheral Nervous System 2025 (résumé)</a>.</p></template>
<template data-pop="g58-lcr" data-title="Liquide cérébrospinal">
<div class="lab">Définition</div><p>Le liquide cérébrospinal (LCR) est prélevé par ponction lombaire.</p>
<div class="lab">Application</div><p>Dans la neuropathie des vascularites à ANCA, les protéines et les cellules sont habituellement normales. Dans la neuroborréliose, il existe une pléiocytose et une synthèse intrathécale d’anticorps ; trois critères (symptômes, pléiocytose, anticorps intrathécaux) définissent la forme certaine.</p>
<div class="lab">Limite</div><p>Un LCR normal n’exclut pas une vascularite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2009.02862.x" target="_blank" rel="noopener">EFNS, neuroborréliose de Lyme européenne, 2010 (résumé)</a>.</p></template>
<template data-pop="g58-imagerie" data-title="Échographie nerveuse et neurographie par IRM">
<div class="lab">Définition</div><p>L’échographie du nerf peut montrer une section augmentée et des fascicules modifiés.</p>
<div class="lab">Application</div><p>Ces constats reposent sur de petites cohortes. La neurographie par IRM n’est pas établie en routine pour la mononévrite multiple ; pour la névralgie intercostale, elle était anormale chez 19 patients sur 28 (68 %).</p>
<div class="lab">Limite</div><p>Ni l’une ni l’autre ne remplace l’électrophysiologie ou la biopsie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13459936/" target="_blank" rel="noopener">Shamoun et coll., Journal of Thoracic Disease 2026 (revue)</a>.</p></template>
<template data-pop="g58-gc" data-title="Glucocorticoïdes : prednisone">
<div class="lab">Place</div><p>Les glucocorticoïdes sont la base du traitement de la neuropathie vasculitique : seuls dans la NSVN pendant au moins six mois, à forte dose avec le rituximab ou le cyclophosphamide dans les vascularites à ANCA.</p>
<div class="lab">Posologie</div><p>La posologie initiale usuelle de la Prednisone Streuli® est de 5 à 60 mg/j, davantage à court terme, puis la dose minimale efficace. Pour la vascularite, la revue européenne cite la prednisolone à 1 mg/kg/j, une décroissance de 5–10 mg toutes les deux semaines jusqu’à 5–10 mg/j, des bolus de 500–1000 mg pendant 3–5 jours dans les formes sévères. La cible EULAR 2022 est de 5 mg/j en 4 à 5 mois.</p>
<div class="lab">Effets indésirables et précautions</div><p>Le sevrage est progressif au-delà de 8 à 10 jours (insuffisance surrénale). Un seuil de 7,5 mg/j est cité pour le syndrome de Cushing. Les contre-indications relatives du traitement prolongé comprennent l’ulcère, l’ostéoporose sévère et le zoster virémique, entre autres.</p>
<div class="lab">Surveillance</div><p>On surveille les urines, la glycémie, la tension, le poids et la kaliémie. Une prophylaxie de l’ostéoporose est indiquée si la corticothérapie dépasse deux semaines.</p>
<div class="lab">Limite</div><p>Les schémas de vascularite viennent d’une revue de 2015 ; la notice suisse ne décrit pas les schémas pour cette indication.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680293490370)" target="_blank" rel="noopener">Information professionnelle suisse Prednisone Streuli®, juin 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://doi.org/10.1136/ard-2022-223764" target="_blank" rel="noopener">EULAR, recommandations sur les vascularites à ANCA, mise à jour 2022 (résumé)</a> ; <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society, lignes directrices sur la neuropathie vasculitique non systémique, 2010 (résumé)</a>.</p></template>
<template data-pop="g58-cyclo" data-title="Cyclophosphamide (Endoxan®)">
<div class="lab">Indication</div><p>L’information professionnelle suisse mentionne les maladies auto-immunes d’évolution menaçante, dont les vascularites systémiques.</p>
<div class="lab">Posologie</div><p>En bolus, la revue européenne cite 0,6–0,75 g/m² toutes les 2 à 4 semaines avec mesna, sans dépasser 6 à 12 mois. Le mesna est utilisé si la dose intraveineuse dépasse 10 mg/kg ou chez un patient à risque.</p>
<div class="lab">Effets indésirables</div><p>La cystite hémorragique se prévient par l’hydratation, des vidanges vésicales fréquentes et le mesna ; l’hématurie impose l’interruption. Une stérilité est possible dans les deux sexes.</p>
<div class="lab">Preuves</div><p>Le cyclophosphamide est une option pour la NSVN sévère (en bolus, pour réduire la dose cumulée) et un traitement d’induction des vascularites à ANCA. Un essai de 197 patients a trouvé le rituximab équivalent au cyclophosphamide.</p>
<div class="lab">Limite</div><p>Les schémas de vascularite ne sont pas détaillés dans l’information professionnelle (mise à jour février 2021).</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680254410362)" target="_blank" rel="noopener">Information professionnelle suisse Endoxan®, février 2021</a> ; <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society, lignes directrices sur la neuropathie vasculitique non systémique, 2010 (résumé)</a> ; <a href="https://doi.org/10.1136/ard-2022-223764" target="_blank" rel="noopener">EULAR, recommandations sur les vascularites à ANCA, mise à jour 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a>.</p></template>
<template data-pop="g58-ritux" data-title="Rituximab">
<div class="lab">Place</div><p>Le rituximab est une option d’induction (avec les glucocorticoïdes) et d’entretien des vascularites à ANCA (EULAR 2022). Il constitue une alternative au cyclophosphamide dans la neuropathie cryoglobulinémique et rhumatoïde.</p>
<div class="lab">Posologie citée</div><p>375 mg/m² par semaine pendant 4 semaines (revue de 2015). Dans la cryoglobulinémie, la neuropathie s’est améliorée chez 44 % de 87 patients.</p>
<div class="lab">Immunoglobulines intraveineuses</div><p>Les IgIV reposent sur des séries de cas et sont hors indication dans les vascularites à ANCA réfractaires.</p>
<div class="lab">Information professionnelle suisse</div><p>MabThera® est indiqué, avec des glucocorticoïdes, dans la GPA et la polyangéite microscopique sévères actives de l’adulte. L’induction est de 375 mg/m² une fois par semaine pendant quatre semaines, et un entretien peut débuter au plus tôt 16 semaines après la dernière perfusion. Les autres emplois de la leçon (cryoglobulinémie, vascularite rhumatoïde, périartérite noueuse, NSVN) sont hors indication.</p>
<div class="lab">Sécurité</div><p>Le dépistage de l’hépatite B, au moins l’antigène HBs et l’anti-HBc, précède la première perfusion ; une hépatite B active contre-indique le traitement. Une prophylaxie de la pneumonie à Pneumocystis jirovecii est recommandée au besoin, pendant et après le traitement des vascularites associées aux ANCA.</p>
<div class="lab">Mécanisme</div><p>Le rituximab se lie à l’antigène CD20 des lymphocytes B et les lyse ; les plasmocytes ne portent pas CD20.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/ard-2022-223764" target="_blank" rel="noopener">EULAR, recommandations sur les vascularites à ANCA, mise à jour 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">Information professionnelle suisse MabThera®, décembre 2025</a>.</p></template>
<template data-pop="g58-mepo" data-title="Mépolizumab et EGPA">
<div class="lab">Place</div><p>Le mépolizumab est envisagé dans l’EGPA récidivante ou réfractaire (EULAR 2022). Un essai de phase 3 de 136 patients est cité par la revue de Koike ; un cas d’EGPA à MPO-ANCA l’illustre.</p>
<div class="lab">Information professionnelle suisse</div><p>Nucala® est indiqué en traitement complémentaire de l’EGPA récidivante ou résistante de l’adulte, après stabilisation par des corticostéroïdes systémiques, à la dose de 300 mg par voie sous-cutanée toutes les quatre semaines. Le mépolizumab neutralise l’interleukine 5, cytokine principale des éosinophiles.</p>
<div class="lab">Limite</div><p>Le cas rapporté est illustratif, non démonstratif.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/ard-2022-223764" target="_blank" rel="noopener">EULAR, recommandations sur les vascularites à ANCA, mise à jour 2022 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8857368/" target="_blank" rel="noopener">Koike et coll., Neurology and Therapy 2022 (revue)</a> ; <a href="https://doi.org/10.1093/mrcr/rxag050" target="_blank" rel="noopener">Kidoguchi et coll., Modern Rheumatology Case Reports 2026 (résumé)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680673500019" target="_blank" rel="noopener">Information professionnelle suisse Nucala®, décembre 2025</a>.</p></template>
<template data-pop="g58-eular" data-title="Recommandations EULAR 2022 sur les vascularites à ANCA">
<div class="lab">Contenu</div><p>La mise à jour 2022 (publiée en 2024) comprend quatre principes et dix-sept recommandations. Elle recommande une induction par glucocorticoïdes à forte dose avec rituximab ou cyclophosphamide pour les formes menaçant la vie ou un organe, une décroissance à 5 mg/j en 4–5 mois, l’avacopan pour réduire l’exposition aux glucocorticoïdes (GPA et MPA), les échanges plasmatiques dans la glomérulonéphrite rapidement progressive, un entretien par rituximab (azathioprine ou méthotrexate en alternative) et le mépolizumab pour l’EGPA réfractaire.</p>
<div class="lab">Limite</div><p>Texte intégral refusé (erreur 403) ; le résumé ne précise ni les doses ni le statut de la neuropathie comme atteinte menaçant un organe.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/ard-2022-223764" target="_blank" rel="noopener">EULAR, recommandations sur les vascularites à ANCA, mise à jour 2022 (résumé)</a>.</p></template>
<template data-pop="g58-lyrica" data-title="Prégabaline (Lyrica®)">
<div class="lab">Indication</div><p>La prégabaline est indiquée dans les douleurs neuropathiques périphériques et centrales de l’adulte.</p>
<div class="lab">Posologie</div><p>Le traitement débute à 150 mg/j (75 mg × 2 ou 50 mg × 3), passe à 300 mg/j après 3 à 7 jours, puis atteint au maximum 600 mg/j après 7 jours supplémentaires. Pour une clairance de 30 à 60 mL/min, la dose est de 75 à 300 mg/j ; la prégabaline n’est pas utilisée en dessous de 30 mL/min.</p>
<div class="lab">Effets indésirables</div><p>Étourdissements (30,7 %), somnolence (16,4 %) ; dépression respiratoire ; surmortalité en association aux opioïdes (rapport de cotes ajusté 1,68).</p>
<div class="lab">Contre-indications et précautions</div><p>La prégabaline n’est pas utilisée pendant la grossesse, sauf si le bénéfice maternel l’emporte clairement, car elle expose à des malformations au premier trimestre ; une contraception efficace est requise. Elle n’est pas recommandée avant 18 ans.</p>
<div class="lab">Limite</div><p>Mécanisme d’action non repris dans le dossier ; mise à jour de l’information : juillet 2026.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680570570016)" target="_blank" rel="noopener">Information professionnelle suisse Lyrica®, juillet 2026</a>.</p></template>
<template data-pop="g58-neurontin" data-title="Gabapentine (Neurontin®)">
<div class="lab">Indication</div><p>La gabapentine est indiquée dans les douleurs neuropathiques de l’adulte (neuropathie diabétique, névralgie postherpétique).</p>
<div class="lab">Posologie</div><p>Jour 1 : 300 mg ; jour 2 : 600 mg ; dès le jour 3 : 900 mg/j en trois prises ; entretien 900–3600 mg/j. Fonction rénale : clairance 50–79 mL/min, 600–1200 mg/j ; 30–49, 300–900 ; 15–29, 150–600 ; inférieure à 15, 150–300 mg/j.</p>
<div class="lab">Effets indésirables et précautions</div><p>Un syndrome DRESS a été signalé. La gabapentine expose à une dépression du système nerveux central et à une dépression respiratoire, surtout avec les opiacés, chez le sujet âgé et chez l’insuffisant rénal. Elle n’est pas utilisée pendant la grossesse, sauf si le bénéfice maternel l’emporte clairement. Elle n’est pas recommandée avant 18 ans pour la douleur neuropathique.</p>
<div class="lab">Limite</div><p>Les indications suisses sont la neuropathie diabétique et la névralgie postherpétique ; l’usage dans la mononévrite vasculitique ou la névralgie intercostale non zostérienne est hors indication et relève des lignes directrices EFNS et de revues. Mise à jour avril 2025.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680525200104)" target="_blank" rel="noopener">Information professionnelle suisse Neurontin®, avril 2025</a> ; <a href="https://doi.org/10.1111/j.1468-1331.2010.02999.x" target="_blank" rel="noopener">EFNS, traitement pharmacologique de la douleur neuropathique, révision 2010 (résumé)</a>.</p></template>
<template data-pop="g58-bloc" data-title="Blocs intercostaux, cryoneurolyse et radiofréquence">
<div class="lab">Définition</div><p>Ces techniques interrompent ou modulent la conduction du nerf intercostal douloureux.</p>
<div class="lab">Résultats</div><p>La cryoneurolyse soulage 60 % des patients (50 % à 3 mois, n = 43). Dans les douleurs chroniques abdominales et thoraciques, la radiofréquence a une efficacité moyenne de 84 % (55,8 à 100 % ; 32 études, 620 patients), avec un soulagement de 4 à 6 mois et des répétitions fréquentes ; la radiofréquence conventionnelle est supérieure à la pulsée à 6 mois (rapport de cotes 9,4). Pendant la grossesse, un bloc échoguidé à la ropivacaïne a soulagé 17 femmes avec deux réinjections.</p>
<div class="lab">Limite</div><p>20 à 40 % des patients ne sont pas soulagés par les premières interventions ; la neurectomie est réservée aux formes réfractaires. Données de revues et de séries rétrospectives.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13459936/" target="_blank" rel="noopener">Shamoun et coll., Journal of Thoracic Disease 2026 (revue)</a> ; <a href="https://doi.org/10.1002/ijgo.70049" target="_blank" rel="noopener">Tascón Padrón et coll., International Journal of Gynecology & Obstetrics 2025 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42804317/" target="_blank" rel="noopener">Yavuz et coll., Pain Physician 2026 (résumé)</a>.</p></template>
<template data-pop="g58-antiviral" data-title="Traitement antiviral de l’hépatite C">
<div class="lab">Place</div><p>Le traitement antiviral est la première ligne de la neuropathie liée à l’hépatite C.</p>
<div class="lab">Limite</div><p>Les molécules citées datent de 2015. Les recommandations européennes actuelles n’ont pas été lues : le choix du traitement actuel est à vérifier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a>.</p></template>
<template data-pop="g58-lacunes" data-title="Sources et limites du cours">
<div class="lab">Ce qui a été lu</div><p>Les sources comprennent les classifications (BfArM, OFS), les lignes directrices PNS 2010 et EULAR 2022 (résumés), les lignes directrices EFNS (résumés), une revue suisse de médecine interne (Revue Médicale Suisse 2019), le guide d’examen du Medical Research Council, les textes intégraux de revues européennes et internationales, treize informations professionnelles suisses (Lyrica®, Neurontin®, Endoxan®, Prednisone Streuli®, MabThera®, Nucala®, Tavneos®, Imurek®, Methotrexat-Mepha, Saroten®, Duloxetin-Mepha, Neurodol®, Doxycyclin-Mepha) et des résumés PubMed.</p>
<div class="lab">Lacunes</div><p>Aucune recommandation de société savante suisse sur la neuropathie vasculitique ou la névralgie intercostale n’a été lue ; les textes intégraux EULAR et PNS étaient inaccessibles. L’anatomie détaillée des nerfs intercostaux, l’épidémiologie suisse, les critères suisses d’aptitude à la conduite, la recommandation suisse de vaccination contre le zona, l’information professionnelle de la venlafaxine et le traitement actuel de l’hépatite C n’ont pas été lus. Le cours n’invente aucune de ces données.</p>
<div class="lab">Statut</div><p>Revue par intelligence artificielle ; audit différé, distinct d’une validation médicale humaine.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G50–G59</a>.</p></template>
<template data-pop="g58-mnemo" data-title="Aide-mémoire des arguments contre la NSVN">
<p><b>Aide pédagogique, non critère officiel.</b> Pour retenir les quatre arguments en faveur d’une vascularite systémique plutôt que d’une NSVN, la formule <b>O-A-C-V</b> rappelle : un autre Organe atteint, des ANCA, des Cryoglobulines, une VS ≥ 100 mm/h (initiales de chaque argument). Le critère officiel reste la liste de la Peripheral Nerve Society, qui y ajoute une affection ou un médicament prédisposant.</p>
</template>
<template data-pop="pareto-g58-definition" data-title="Pareto — Définition et classifications">
<p class="ratio" data-cover="g58-0,g58-1"></p><ul><li>Une atteinte nerveuse multifocale asymétrique est une mononévrite multiple, à rapprocher d’une <button class="w" data-k="g58-vasculites">vascularite</button> jusqu’à preuve du contraire.</li><li>La NSVN est limitée aux vaisseaux du nerf ; VS ≥ 100 mm/h, ANCA, cryoglobulines ou autre organe plaident contre.</li><li>La biopsie donne la certitude ; sa sensibilité pour une vascularite certaine ne dépasse pas 50 à 60 %.</li></ul>
</template>
<template data-pop="pareto-g58-frequence" data-title="Pareto — Fréquence et pronostic">
<p class="ratio" data-cover="g58-2"></p><ul><li>Les fréquences de neuropathie varient de 5 à 85 % selon la maladie ; elles se présentent comme des fourchettes.</li><li>Aucune donnée suisse n’a été trouvée.</li><li>Dans les vascularites à ANCA, environ 40 % des neuropathies s’améliorent.</li></ul>
</template>
<template data-pop="pareto-g58-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g58-3,g58-4"></p><ul><li>L’inflammation des vasa nervorum provoque une ischémie, puis une perte axonale en zone proximo-moyenne.</li><li>Le médecin cherche une cause : vascularite, infection, médicament ou tumeur.</li><li>Névralgie intercostale : lésion ou piégeage d’un nerf intercostal.</li></ul>
</template>
<template data-pop="pareto-g58-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g58-5,g58-6"></p><ul><li>Le médecin reconstitue l’ordre d’apparition des déficits nerf par nerf.</li><li>Il nomme chaque nerf atteint et cherche une atteinte du poumon, du rein, de la peau, du cœur et de l’œil.</li><li>Pour la paroi, il palpe et recherche le signe de Schepelmann.</li></ul>
</template>
<template data-pop="pareto-g58-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g58-7,g58-8"></p><ul><li>Motif, électrophysiologie, bilan, biopsie si le résultat change le traitement.</li><li>On élimine d’abord ce qui est urgent : la vascularite systémique.</li><li>Un retard expose à des déficits permanents et au décès.</li></ul>
</template>
<template data-pop="pareto-g58-prise-en-charge" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g58-9,g58-10,g58-11"></p><ul><li>NSVN : corticothérapie ≥ 6 mois ; vascularite à ANCA : glucocorticoïdes + rituximab ou cyclophosphamide.</li><li>On traite la douleur neuropathique en parallèle.</li><li>On adapte la prégabaline et la gabapentine à la fonction rénale.</li></ul>
</template>
<template data-pop="pareto-g58-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g58-e-1,g58-e-2,g58-e-3,g58-e-4,g58-e-5,g58-e-6"></p><ul><li>Électrophysiologie : amplitudes basses, vitesses conservées, asymétrie ≥ 50 %.</li><li>Biopsie nerf-muscle : référence histologique.</li><li>Névralgie intercostale : diagnostic clinique.</li></ul>
</template>
<template data-pop="pareto-g58-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g58-s-anat-cours"></p><ul><li>Vasa nervorum de 50–300 µm ; zone frontière proximo-moyenne.</li><li>Péronier, tibial, ulnaire : nerfs les plus touchés.</li><li>ACNES : branches T7–T12.</li></ul>
</template>
<template data-pop="pareto-g58-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g58-s-histo-cours"></p><ul><li>Vascularite certaine = inflammation de la paroi avec lésions vasculaires.</li><li>Le type d’infiltrat oriente la maladie.</li><li>Un prélèvement négatif n’exclut pas la maladie : la biopsie ne démontre la vascularite que dans 50 à 60 % des cas au plus.</li></ul>
</template>
<template data-pop="pareto-g58-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g58-s-physio-cours"></p><ul><li>Perte d’axones : amplitude réduite, vitesse conservée.</li><li>La névralgie intercostale s’aggrave à la toux et à la rotation ; la source n’en précise pas le mécanisme.</li><li>Grosses et petites fibres se testent séparément.</li><li>Les territoires se chevauchent avec le temps.</li></ul>
</template>
<template data-pop="pareto-g58-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g58-s-bioch-cours"></p><ul><li>ANCA anti-PR3 et anti-MPO ; anti-MPO et neuropathie.</li><li>Cryoglobulinémie : complexes immuns et complément.</li><li>Le mesna neutralise l’acroléine du cyclophosphamide.</li><li>La prégabaline, éliminée inchangée par le rein, se dose selon la clairance de la créatinine.</li></ul>
</template>
<template data-pop="pareto-g58-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g58-p-1,g58-p-2,g58-p-3,g58-p-4"></p><ul><li>On choisit le traitement par mécanisme : inflammation, cause, douleur.</li><li>Prégabaline 150–600 mg/j ; gabapentine 900–3600 mg/j.</li><li>L’association d’un gabapentinoïde et d’un opioïde est dangereuse ; les doses des revues sont à confirmer dans la notice suisse.</li><li>Plusieurs emplois sont hors indication en Suisse ; l’hépatite B se dépiste avant le rituximab.</li></ul>
</template>
<template data-pop="g58-sm-douleur" data-title="Douleur neuropathique">
<div class="lab">Définition</div><p>La douleur neuropathique est un signe sensitif positif : brûlure ou décharge électrique née de fibres nerveuses lésées (Bernard-Valnet, 2019).</p>
<div class="lab">Mécanisme</div><p>Dans la neuropathie vasculitique, l’ischémie de troncs nerveux individuels détruit des axones ; la douleur siège dans le territoire du nerf atteint (Blaes, 2015).</p>
<div class="lab">Valeur</div><p>La douleur fait partie de la définition clinique d’une vascularite cliniquement probable (Peripheral Nerve Society, 2010). Une douleur neuropathique d’histoire courte, sans facteur de risque de polyneuropathie, fait suspecter une périartérite noueuse (Ruffer, 2024). Aucune sensibilité ni spécificité n’est chiffrée dans les sources lues.</p>
<div class="lab">Piège</div><p>Le soulagement de la douleur ne prouve pas l’arrêt de l’ischémie : le déficit se suit à l’examen, muscle par muscle (Medical Research Council).</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2019/revue-medicale-suisse-672/prise-en-charge-des-neuropathies-peripheriques-en-medecine-interne-generale" target="_blank" rel="noopener">Bernard-Valnet, Kuntzer et Vaucher, Revue Médicale Suisse 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a> ; <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society, lignes directrices sur la neuropathie vasculitique non systémique, 2010 (résumé)</a>.</p></template>
<template data-pop="g58-sm-paresth" data-title="Paresthésies et dysesthésies">
<div class="lab">Définition</div><p>Les paresthésies sont des picotements ou des fourmillements ; les dysesthésies désignent toute sensation anormale, avec ou sans stimulus (Bernard-Valnet, 2019).</p>
<div class="lab">Mécanisme</div><p>Ce sont des signes positifs : la fibre sensitive lésée produit une activité anormale (Bernard-Valnet, 2019).</p>
<div class="lab">Valeur et piège</div><p>Leur fréquence n’est pas chiffrée dans les sources lues. Leur territoire guide l’examen sensitif, nerf par nerf.</p>
<p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2019/revue-medicale-suisse-672/prise-en-charge-des-neuropathies-peripheriques-en-medecine-interne-generale" target="_blank" rel="noopener">Bernard-Valnet, Kuntzer et Vaucher, Revue Médicale Suisse 2019</a>.</p></template>
<template data-pop="g58-sm-hypo" data-title="Hypoesthésie d’un territoire nerveux">
<div class="lab">Technique</div><p>Le patient délimite la zone ; le toucher se teste au coton de la zone insensible vers la zone normale, la douleur à l’épingle en partant de la zone analgésique, à un rythme irrégulier (Medical Research Council).</p>
<div class="lab">Mécanisme</div><p>Le toucher fin et la pallesthésie empruntent les fibres de gros calibre et les cordons postérieurs ; la douleur et la température empruntent les petites fibres et les voies spinothalamiques (Bernard-Valnet, 2019).</p>
<div class="lab">Normal</div><p>Au diapason de Rydel-Seiffer, la limite inférieure au doigt et à l’orteil vaut 6,9 et 5,5 entre 20 et 39 ans, puis 6,2 et 4,7 entre 40 et 60 ans (Bernard-Valnet, 2019).</p>
<div class="lab">Piège</div><p>Le territoire d’un nerf varie d’un patient à l’autre ; les cartes publiées montrent des zones habituelles (Medical Research Council).</p>
<p class="src">Références : <a href="https://www.ukri.org/wp-content/uploads/2021/12/MRC-011221-AidsToTheExaminationOfThePeripheralNervousSystem.pdf" target="_blank" rel="noopener">Medical Research Council, Aids to the examination of the peripheral nervous system, 1976</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2019/revue-medicale-suisse-672/prise-en-charge-des-neuropathies-peripheriques-en-medecine-interne-generale" target="_blank" rel="noopener">Bernard-Valnet, Kuntzer et Vaucher, Revue Médicale Suisse 2019</a>.</p></template>
<template data-pop="g58-sm-faiblesse" data-title="Faiblesse focale">
<div class="lab">Technique</div><p>Un muscle est testé à la fois, sur une articulation, en regardant et en palpant la contraction pour éviter les mouvements de suppléance (Medical Research Council). Tibial antérieur et long extenseur de l’hallux : nerf péronier profond ; longs et courts péroniers : nerf péronier superficiel ; premier interosseux dorsal et abducteur du cinquième doigt : nerf ulnaire ; court abducteur du pouce : nerf médian (Medical Research Council).</p>
<div class="lab">Mécanisme</div><p>La perte d’axones moteurs du tronc ischémié réduit la force des seuls muscles de ce nerf (Blaes, 2015).</p>
<div class="lab">Valeur</div><p>Les nerfs péronier et ulnaire sont les plus souvent atteints (Ruffer, 2024) ; aucune sensibilité n’est chiffrée.</p>
<p class="src">Références : <a href="https://www.ukri.org/wp-content/uploads/2021/12/MRC-011221-AidsToTheExaminationOfThePeripheralNervousSystem.pdf" target="_blank" rel="noopener">Medical Research Council, Aids to the examination of the peripheral nervous system, 1976</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11965222/" target="_blank" rel="noopener">Ruffer et coll., Zeitschrift für Rheumatologie 2024 (revue allemande)</a>.</p></template>
<template data-pop="g58-sm-mrc" data-title="Échelle de force du Medical Research Council">
<div class="lab">Échelle</div><p>0 : aucune contraction ; 1 : ébauche de contraction ; 2 : mouvement actif sans pesanteur ; 3 : mouvement actif contre la pesanteur ; 4 : contre la pesanteur et une résistance ; 5 : force normale. Les grades 4−, 4 et 4+ indiquent une résistance faible, modérée ou forte (Medical Research Council).</p>
<div class="lab">Application</div><p>La cotation muscle par muscle rend l’asymétrie mesurable et permet de suivre l’évolution sous traitement.</p>
<div class="lab">Limite</div><p>La facilité à percevoir une contraction varie avec la morphologie du patient (Medical Research Council).</p>
<p class="src">Références : <a href="https://www.ukri.org/wp-content/uploads/2021/12/MRC-011221-AidsToTheExaminationOfThePeripheralNervousSystem.pdf" target="_blank" rel="noopener">Medical Research Council, Aids to the examination of the peripheral nervous system, 1976</a>.</p></template>
<template data-pop="g58-sm-generaux" data-title="Signes généraux">
<div class="lab">Valeur</div><p>Amaigrissement, fièvre et fatigue sont rapportés chez environ 80 % des neuropathies avec vascularite systémique et environ 50 % des formes non systémiques (Blaes, 2015).</p>
<div class="lab">Piège</div><p>Leur absence ne rassure pas ; une vascularite limitée au nerf peut aussi s’accompagner d’une biologie normale (Bernard-Valnet, 2019).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4357592/" target="_blank" rel="noopener">Blaes, Therapeutic Advances in Musculoskeletal Disease 2015 (revue)</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2019/revue-medicale-suisse-672/prise-en-charge-des-neuropathies-peripheriques-en-medecine-interne-generale" target="_blank" rel="noopener">Bernard-Valnet, Kuntzer et Vaucher, Revue Médicale Suisse 2019</a>.</p></template>
<template data-pop="g58-sm-paroi" data-title="Douleur pariétale en bande">
<div class="lab">Caractères</div><p>La douleur est aiguë, brûlante, en éclair ou sourde ; l’inspiration profonde, la toux et la rotation du tronc l’aggravent (Shamoun, 2026).</p>
<div class="lab">Mécanisme</div><p>La source décrit l’aggravation sans en donner le mécanisme ; la lésion ou l’irritation du nerf intercostal en est le substrat (Shamoun, 2026).</p>
<div class="lab">Piège</div><p>Les patients consultent en moyenne environ cinq médecins avant le diagnostic (Shamoun, 2026).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13459936/" target="_blank" rel="noopener">Shamoun et coll., Journal of Thoracic Disease 2026 (revue)</a>.</p></template>
<template data-pop="g58-sm-visceral" data-title="Symptômes viscéraux de l’ACNES">
<div class="lab">Valeur</div><p>Chez 100 patients sélectionnés, le ballonnement (78 %), les nausées (66 %) et les troubles du transit (50 %) étaient fréquents ; un traitement efficace les réduisait (Jacobs, Hernia 2024).</p>
<div class="lab">Piège</div><p>Ces plaintes orientent à tort vers un organe abdominal ; l’examen de la paroi doit précéder la multiplication des examens (Jacobs, Hernia 2024).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10891241/" target="_blank" rel="noopener">Jacobs et coll., Hernia 2024 (texte intégral)</a>.</p></template>
<template data-pop="g58-sm-carnett" data-title="Signe de Carnett">
<div class="lab">Technique</div><p>L’examinateur palpe le point douloureux pendant que le patient contracte ses muscles grands droits ; la douleur augmente dans l’ACNES (Jacobs, Hernia 2024).</p>
<div class="lab">Valeur</div><p>C’est l’un des cinq critères diagnostiques publiés ; une baisse de la douleur après infiltration d’anesthésique local au point douloureux soutient le diagnostic (Jacobs, Hernia 2024). Sa sensibilité propre n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10891241/" target="_blank" rel="noopener">Jacobs et coll., Hernia 2024 (texte intégral)</a>.</p></template>
<template data-pop="g58-sm-pincement" data-title="Test de pincement cutané">
<div class="lab">Technique</div><p>L’examinateur pince la peau de la paroi en regard du point douloureux ; une douleur intense est un critère de l’ACNES (Jacobs, Hernia 2024).</p>
<div class="lab">Limite</div><p>Sa valeur isolée n’est pas chiffrée dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10891241/" target="_blank" rel="noopener">Jacobs et coll., Hernia 2024 (texte intégral)</a>.</p></template>
<template data-pop="pareto-g58-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g58-s-immuno-cours"></p><ul><li>C5a–C5aR1 active les neutrophiles ; l’avacopan le bloque.</li><li>Le rituximab lyse les lymphocytes B CD20+, pas les plasmocytes.</li><li>Le mépolizumab neutralise l’IL-5 dans l’EGPA récidivante ou réfractaire.</li></ul>
</template>
