<template id="ch-G59"><div class="chap"><div class="chap-head"><div class="code">G 59 · Neurologie · Nerfs périphériques</div><h1>Mononévrite au cours de maladies classées ailleurs</h1><span class="status">Cycle Betta 38 · Audit différé — revue par intelligence artificielle, distincte d’une validation médicale humaine · Sources : <button class="w" data-k="g59-sources">dossier de 23 sources lues (limites)</button></span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des mononévrites</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g59-0">Question clinique</a></li><li><a href="#g59-1">Définition, codage et classification</a></li><li><a href="#g59-2">Fréquence</a></li><li><a href="#g59-3">Mécanismes</a></li><li><a href="#g59-4">Causes</a></li><li><a href="#g59-5">Anamnèse</a></li><li><a href="#g59-6">Examen clinique</a></li><li><a href="#g59-7">Démarche diagnostique</a></li><li><a href="#g59-8">Urgences</a></li><li><a href="#g59-9">Prise en charge</a></li><li><a href="#g59-10">Suivi et pronostic</a></li><li><a href="#g59-11">Situations particulières</a></li><li><a href="#g59-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g59-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 63 ans, diabétique de type 2 depuis de longues années, consulte pour un ptosis gauche et une diplopie apparus en deux jours. La pupille garde une taille normale. Ces éléments servent à poser les deux questions que soulève toute atteinte d’un seul nerf chez un patient porteur d’une maladie générale.</p>
<p>La première question est causale : le nerf souffre-t-il de la maladie générale, par ischémie, par compression favorisée ou par vascularite <button class="w" data-k="g59-vasculopathie">(mécanisme vasculaire des atteintes focales)</button> ? La seconde est de sécurité : une cause plus grave, compressive, tumorale, anévrismale ou inflammatoire, a-t-elle été exclue ? Chez ce patient, l’aspect « pupille épargnée » évoque l’ischémie microvasculaire, mais il ne dispense pas d’une imagerie <button class="w" data-k="g59-iii">(paralysie du nerf oculomoteur : pièges)</button>.</p>
<div class="key"><b>À retenir.</b> Devant une mononévrite chez un patient malade chronique, le médecin cherche d’abord le mécanisme habituel de la maladie générale, puis exclut ce qui ne doit pas être manqué. La partie suivante précise ce que recouvre le terme et comment la classification le code.</div>
</section>

<section class="ilot" id="g59-1"><h2><span class="n">1</span>Définition, codage et classification</h2>
<p>Une <b>mononévrite</b> est l’atteinte d’un seul nerf périphérique : le déficit sensitif, le déficit moteur ou la douleur se limite au territoire de ce nerf. Lorsque plusieurs nerfs sont touchés de façon asymétrique et successive, on parle de <button class="w" data-k="g59-multiplex">mononévrite multiple (distinction avec la polyneuropathie)</button>. La mononévrite de ce cours est celle qui survient <b>au cours d’une maladie classée ailleurs</b> : la maladie générale, le plus souvent le diabète, est le diagnostic principal ; la mononévrite en est la manifestation.</p>
<p>La CIM-10-GM 2024 traduit cette logique par un <button class="w" data-k="g59-cim">codage en croix et astérisque (règle de double codage)</button>. Le code astérisque (*) décrit la manifestation. Le code croix (†) désigne la maladie causale et se code séparément. Le tableau ci-dessous situe la catégorie G59 et ses voisines, afin d’éviter les erreurs de classement.</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé</th><th>Règle de codage</th></tr></thead><tbody>
<tr><td>G59.0*</td><td>Mononévrite diabétique</td><td>Se code avec E10–E14†, quatrième position .4 (diabète avec complications neurologiques)</td></tr>
<tr><td>G59.8*</td><td>Autres mononévrites au cours de maladies classées ailleurs</td><td>La classification ne liste aucun exemple</td></tr>
<tr><td>G58.7</td><td>Mononévrite multiple (mononeuropathia multiplex)</td><td>Sans maladie causale « classée ailleurs »</td></tr>
<tr><td>G56.- et G57.-</td><td>Mononévrites du membre supérieur et du membre inférieur</td><td>Sans maladie causale « classée ailleurs » (par exemple G56.0 canal carpien, G56.2 ulnaire, G56.3 radial, G57.1 méralgie paresthésique, G57.2 fémoral, G57.3 fibulaire commun, G57.5 tunnel tarsien)</td></tr>
<tr><td>G63.2*</td><td>Polyneuropathie diabétique</td><td>E10–E14†, quatrième position .4</td></tr>
<tr><td>G53.-*</td><td>Atteintes multiples de nerfs crâniens au cours de maladies classées ailleurs</td><td>G53.1* infections, G53.2* sarcoïdose, G53.3* néoplasies, G53.0* après zona</td></tr>
</tbody></table>
<p>Le tableau montre que le diagnostic de siège (quel nerf) et le diagnostic de cause (quelle maladie) sont deux informations distinctes, codées séparément. Il montre aussi que la polyneuropathie diabétique a son propre code (G63.2*) : le médecin n’utilise donc pas G59.0* pour une atteinte distale symétrique. Le bloc G50–G59 exclut en outre la lésion nerveuse traumatique aiguë, la névralgie, la névrite sans précision, la névrite périphérique de la grossesse (O26.83) et la radiculite sans précision.</p>
<div class="trap"><span class="k">Piège</span> La place exacte de l’amyotrophie diabétique, c’est-à-dire la <button class="w" data-k="g59-rplsd">radiculoplexopathie lombosacrée diabétique (clinique, histoire naturelle)</button>, dans la CIM-10-GM n’a pas été vérifiée dans les sources lues. Le cours ne l’affirme pas sous G59.0*.</div>
<p>Sur le plan clinique, la neuropathie diabétique est hétérogène. La forme classique est la polyneuropathie distale symétrique, mais la maladie regroupe aussi des <b>formes focales et multifocales</b> : atteintes des nerfs crâniens, des membres et du tronc. Ces formes surviennent surtout après 50 ans et dans un diabète ancien. Les <button class="w" data-k="g59-compression">neuropathies de compression (« entrapment ») du diabétique (fréquence et rôle de marqueur)</button> sont des formes focales si fréquentes qu’on les décrit comme un marqueur neurophysiologique de la maladie ; elles peuvent précéder la polyneuropathie ou s’y ajouter. Les localisations dites rares (mononévrites multiples, plexopathies, radiculoplexopathies) se signalent par un début aigu ou subaigu, une asymétrie et une prédominance motrice, et exigent un bilan plus étendu.</p>
<div class="key"><b>À retenir.</b> Le terme « mononévrite au cours de » est un code de manifestation : il se rattache toujours à une maladie causale codée à part, et il ne remplace ni la polyneuropathie (G63.-*) ni la mononévrite sans maladie « classée ailleurs » (G56–G58). Les chiffres de fréquence qui suivent précisent l’importance du problème.</div>
</section>

<section class="ilot" id="g59-2"><h2><span class="n">2</span>Fréquence</h2>
<p>Aucune donnée épidémiologique suisse n’a été retrouvée pour ce sujet. Les chiffres ci-dessous proviennent de revues et d’études étrangères ; ils décrivent la fréquence des atteintes, non la conduite à tenir.</p>
<table class="t"><thead><tr><th>Atteinte</th><th>Donnée lue</th><th>Source</th></tr></thead><tbody>
<tr><td>Syndrome du canal carpien, population générale</td><td>Risque sur la vie entière d’environ 10 %</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Syndrome du canal carpien, diabète de type 1</td><td>Jusqu’à 85 % après 54 ans d’évolution</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Neuropathie du médian au poignet</td><td>28 % au diagnostic du diabète ; 62,5 % après 14,5 ans en moyenne</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Syndrome du canal carpien selon la polyneuropathie</td><td>14 % sans polyneuropathie ; 30 % avec polyneuropathie</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Incidence du syndrome du canal carpien (étude de Fremantle)</td><td>5,5 pour 1000 patients-années, au moins 4,2 fois la population générale</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Nerf ulnaire au coude (64 diabétiques)</td><td>Atteinte infraclinique chez 34 % (18 % sans polyneuropathie)</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Nerf fibulaire</td><td>Le diabète explique 5 à 12 % des neuropathies fibulaires dans les séries anciennes</td><td>Rota et Morelli 2016</td></tr>
<tr><td>Radiculoplexopathie lombosacrée diabétique</td><td>2,79 pour 100 000 sur cinq ans (Olmsted County, États-Unis)</td><td>Elafros et Callaghan 2023</td></tr>
</tbody></table>
<p>La lecture du tableau est instructive. Dans le diabète, l’atteinte du nerf médian au poignet est très fréquente, plus encore que ne le suggère le risque de la population générale : elle augmente avec la durée de la maladie, et pas seulement avec la polyneuropathie, puisque 14 % des diabétiques sans polyneuropathie ont un syndrome du canal carpien. À l’inverse, la radiculoplexopathie lombosacrée est rare ; elle touche surtout le diabète de type 2, souvent assez bien équilibré (hémoglobine glyquée médiane de 7,5 %). Une cohorte de 606 152 diabétiques a rapporté un rapport de risque de 1,31 (intervalle de confiance à 95 % de 1,28 à 1,34) pour le syndrome du canal carpien, et le diabète est 2,2 fois plus fréquent (1,5 à 3,1) chez les patients porteurs d’un syndrome du canal carpien.</p>
<div class="key"><b>À retenir.</b> La compression du médian est la mononévrite la plus fréquente du diabétique ; la radiculoplexopathie est rare mais sévère. Pour comprendre cet écart, il faut examiner comment le diabète fragilise le nerf.</div>

<section class="ilot" id="g59-3"><h2><span class="n">3</span>Mécanismes</h2>
<p>Un nerf périphérique supporte mal l’association d’une atteinte métabolique et d’une contrainte mécanique ou vasculaire. Le diabète crée la première ; l’anatomie ou l’inflammation fournit la seconde. Trois mécanismes expliquent la plupart des mononévrites diabétiques.</p>
<p><b>Le double écrasement.</b> Le modèle du <button class="w" data-k="g59-doublecrush">« double crush » (premier coup métabolique, second coup compressif)</button> postule que l’atteinte métabolique du nerf constitue le premier coup, et que la compression dans un défilé anatomique constitue le second. Un nerf déjà fragilisé tolère moins la contrainte qu’un nerf sain. Dans le canal carpien, la pression intracanalaire augmente de 8 à 10 fois lors de la flexion et de l’extension du poignet ; chez un patient diabétique, cette élévation répétée suffit plus facilement à léser le médian.</p>
<figure><svg viewBox="0 0 420 150" role="img" aria-label="Figure 1 — Double écrasement du nerf" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="10" y="50" width="400" height="30" rx="14"/><path d="M60 50v-20m-5 5l5-5 5 5M60 80v20m-5-5l5 5 5-5"/><path d="M290 50v-20m-5 5l5-5 5 5M290 80v20m-5-5l5 5 5-5"/></g><g fill="currentColor" text-anchor="middle"><text x="60" y="20">Premier coup</text><text x="60" y="122">métabolique (diffus)</text><text x="290" y="20">Second coup</text><text x="290" y="122">compression (défilé)</text><text x="210" y="145">Seuil de souffrance du nerf abaissé</text></g></svg><figcaption>Figure 1 — Double écrasement. Schéma didactique : le nerf métaboliquement atteint se lèse pour une compression plus faible.</figcaption></figure>
<p><b>Le retentissement métabolique sur le nerf.</b> Les <button class="w" data-k="g59-polyols">mécanismes métaboliques proposés (polyols, pompe sodium-potassium, stress oxydatif, glycation)</button> comprennent l’accumulation de sorbitol dans la voie des polyols, qui provoque un gonflement osmotique, la baisse d’activité de la pompe sodium-potassium, le stress oxydatif et les produits de glycation avancée. Ces derniers altèrent les péricytes et la vascularisation du nerf. La régénération nerveuse diminue en parallèle.</p>
<p><b>La vasculopathie inflammatoire.</b> Les formes focales non compressives s’accompagnent souvent, à la biopsie, d’une <button class="w" data-k="g59-vasculopathie">vasculopathie inflammatoire (microvascularite)</button>. Cette ischémie focale explique l’évolution spontanément limitée, parfois en rechutes, à l’opposé de la polyneuropathie longueur-dépendante qui progresse ou se stabilise. Dans la radiculoplexopathie lombosacrée diabétique, la biopsie montre une perte de fibres focale ou multifocale, une inflammation périvasculaire, une néovascularisation, une démyélinisation segmentaire et une dégénérescence axonale ; une microvascularite à médiation immune est suggérée. Par définition pathologique, une vascularite « certaine » associe inflammation de la paroi et lésion vasculaire.</p>
<div class="key"><b>À retenir.</b> Le diabète abaisse le seuil de souffrance du nerf et expose à l’ischémie focale. La compression est le second coup, l’ischémie inflammatoire un mécanisme parallèle. Les causes énumérées ensuite en découlent.</div>
</section>

<section class="ilot" id="g59-4"><h2><span class="n">4</span>Causes</h2>
<p>Quelle maladie « classée ailleurs » produit la mononévrite ? Le diabète domine, mais il ne doit jamais fermer la réflexion : un syndrome du canal carpien bilatéral ou récidivant, par exemple, fait évoquer une amyloïdose.</p>
<table class="t"><thead><tr><th>Cause</th><th>Mononévrite ou atteinte typique</th><th>Données lues</th></tr></thead><tbody>
<tr><td>Diabète (G59.0*)</td><td>Compressions (médian, ulnaire, fibulaire) ; nerfs crâniens (le III surtout pour l’oculomotricité) ; atteintes tronculaires et radiculoplexiques</td><td>Rota 2016 ; Said 2007 ; Elafros 2023</td></tr>
<tr><td>Vascularites systémiques</td><td>Polyartérite noueuse, polyangéite microscopique, vascularite rhumatoïde, granulomatose éosinophilique avec polyangéite, cryoglobulinémie mixte liée à l’hépatite C</td><td>Collins 2012 : dans la granulomatose éosinophilique, la plupart des patients neuropathiques n’ont pas d’<button class="w" data-k="g59-nsvn">ANCA (anticorps et vascularites)</button></td></tr>
<tr><td>Amyloïdose à transthyrétine</td><td>Syndrome du canal carpien bilatéral ou récidivant</td><td><button class="w" data-k="g59-attr">Drapeau rouge majeur de l’ATTRv (signes d’alerte)</button></td></tr>
<tr><td>Traitements de l’obésité et du diabète</td><td>Neuropathie fibulaire, radiculoplexopathie, polyneuropathie</td><td><button class="w" data-k="g59-glp1">Revue systématique 2026 (agonistes du GLP-1 et perte de poids)</button></td></tr>
<tr><td>Traitement du diabète</td><td>Neuropathie induite par une baisse très rapide de l’hémoglobine glyquée</td><td><button class="w" data-k="g59-hba1c">Risque selon l’amplitude de la baisse</button></td></tr>
</tbody></table>
<p>Le tableau regroupe volontairement deux familles. Les premières lignes décrivent des maladies qui lèsent le nerf par leur mécanisme propre ; les deux dernières décrivent des conséquences de la prise en charge. La CIM-10-GM prévoit aussi des codes astérisque pour l’atteinte multiple de nerfs crâniens et pour les polyneuropathies au cours d’infections, de néoplasies ou de sarcoïdose, mais aucune source clinique lue ne documente la mononévrite isolée qui en découle ; ce point reste une lacune de ce cours.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer d’emblée toute mononévrite du diabétique au diabète. Dans l’étude prospective de Tamhankar (109 paralysies isolées des nerfs oculomoteurs après 50 ans), 16,5 % des cas avaient une cause non microvasculaire.</div>
<div class="key"><b>À retenir.</b> Les causes se rangent en maladies qui lèsent le nerf (diabète, vascularite, amyloïdose) et en effets du traitement. Le tableau clinique permet de les distinguer.</div>
<button class="pareto-btn ui" data-k="pareto-g59-mecanismes">▲ Loi de Pareto — Mécanismes et causes</button>
</section>

<section class="ilot" id="g59-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire date le début, caractérise la douleur et recherche les circonstances qui orientent vers le mécanisme. Il s’attache à cinq antécédents.</p>
<ul><li><b>Diabète, durée et variations récentes de l’hémoglobine glyquée.</b> Une baisse rapide dans les huit semaines précédentes oriente vers une <button class="w" data-k="g59-hba1c">neuropathie induite par le traitement (délai et amplitude)</button>.</li>
<li><b>Perte de poids récente.</b> Elle accompagne souvent la radiculoplexopathie lombosacrée diabétique (plus de 10 livres, soit environ 4,5 kg, dans la série décrite) et suit parfois les <button class="w" data-k="g59-glp1">traitements amaigrissants (sémaglutide, tirzépatide)</button>.</li>
<li><b>Syndrome du canal carpien bilatéral ou récidivant.</b> Il doit faire évoquer l’<button class="w" data-k="g59-attr">amyloïdose à transthyrétine (autres drapeaux rouges)</button>.</li>
<li><b>Symptômes d’autres organes</b> et prise de médicaments prédisposants. Ils orientent vers une vascularite systémique plutôt que non systémique.</li>
<li><b>Âge de plus de 50 ans devant une paralysie oculomotrice.</b> L’artérite à cellules géantes figure parmi les causes retrouvées.</li></ul>
<p>Les symptômes se hiérarchisent par territoire. Une atteinte du nerf oculomoteur commun donne un ptosis et une diplopie d’apparition aiguë. La radiculoplexopathie lombosacrée se manifeste par une douleur aiguë et sévère de la hanche ou de la cuisse (brûlure, constriction, allodynie), souvent datée au jour près, puis par une faiblesse focale qui s’étend à tout le membre sur des mois. La vascularite donne une atteinte sensitive ou sensitivomotrice asymétrique ou multifocale, douloureuse, prédominant aux membres inférieurs et en distal, d’évolution aiguë en rechutes.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>La forme classique est une atteinte focale du diabétique ancien : syndrome du canal carpien, neuropathie ulnaire ou fibulaire, ou paralysie du nerf oculomoteur d’installation brutale. L’évolution est spontanément limitée dans les formes focales non compressives.</p></div><div class="card"><h4>Formes atypiques</h4><p>Un début aigu ou subaigu, une asymétrie marquée, une prédominance motrice, une douleur intense ou une perte de poids signalent une localisation rare (radiculoplexopathie, mononévrite multiple). Elles imposent un bilan plus étendu avant toute attribution au diabète.</p></div></div>
<div class="key"><b>À retenir.</b> L’histoire (rythme, douleur, poids, traitement récent du diabète) oriente vers le mécanisme avant tout examen. L’examen précise le territoire.</div>
</section>

<section class="ilot" id="g59-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen répond à trois questions : quel est le territoire atteint, la lésion est-elle isolée, existe-t-il une polyneuropathie associée ? Cette dernière question n’est pas accessoire, car elle modifie les seuils d’interprétation de l’électrophysiologie (voir l’onglet Examens complémentaires).</p>
<div class="two"><div class="card"><h4>Atteinte des nerfs crâniens</h4><p>Dans la paralysie du nerf oculomoteur commun, le médecin note le ptosis, la diplopie et l’état de la pupille. L’atteinte « épargnant la pupille » est typique de l’ischémie microvasculaire ; un rapport de cas décrit une récupération à un mois et un pronostic excellent, souvent complet en trois mois. Ce niveau de preuve est faible.</p></div><div class="card"><h4>Atteinte d’un nerf de membre</h4><p>Le médecin délimite le territoire sensitif et moteur du nerf suspect, puis cherche une atteinte controlatérale ou d’autres nerfs, signe d’une mononévrite multiple. Il recherche aussi la polyneuropathie associée, qui modifie la lecture de l’électrophysiologie.</p></div></div>
<p>Dans la radiculoplexopathie lombosacrée, l’examen révèle une faiblesse asymétrique, une amyotrophie et l’abolition des réflexes rotuliens et achilléens. Dans la vascularite, l’asymétrie et la douleur dominent.</p>
<div class="trap"><span class="k">Piège</span> Une pupille épargnée ne prouve pas l’origine ischémique : une paralysie « épargnant la pupille » peut néanmoins être anévrismale. L’examen clinique seul ne dispense pas de l’imagerie.</div>
<div class="key"><b>À retenir.</b> L’examen délimite le territoire, recherche l’asymétrie, l’amyotrophie et la polyneuropathie associée. L’électrophysiologie et l’imagerie confirment ensuite le siège et excluent les causes graves.</div>
<button class="pareto-btn ui" data-k="pareto-g59-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
