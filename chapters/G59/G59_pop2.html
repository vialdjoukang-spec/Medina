<template data-pop="g59-enmg" data-title="Électroneuromyogramme dans les mononévrites">
<div class="lab">Rôle</div><p>Étape précoce pour localiser la lésion et la caractériser comme axonale ou démyélinisante.</p>
<div class="lab">Syndrome du canal carpien du diabétique</div><p>La comparaison médian–ulnaire des latences sensitives est plus performante que la latence médiane absolue. Les seuils doivent être plus conservateurs en présence d’une polyneuropathie. Les ratios de latence disto-proximaux atteignent 90 % de sensibilité chez les diabétiques polyneuropathes.</p>
<div class="lab">Piège</div><p>Une atteinte ulnaire concomitante au poignet peut réduire la sensibilité de la comparaison. Les valeurs normales numériques dépendent du laboratoire et ne figurent pas dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5027001/" target="_blank" rel="noopener">Rota et Morelli 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5087804/" target="_blank" rel="noopener">Callaghan 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11088946/" target="_blank" rel="noopener">Elafros et Callaghan 2023</a>.</p></template>
<template data-pop="g59-echo" data-title="Échographie nerveuse du canal carpien">
<div class="lab">Principe</div><p>Elle mesure la surface de section du médian au poignet. Une augmentation de cette surface soutient la compression.</p>
<div class="lab">Performance</div><p>Sensibilité et spécificité supérieures à 85 % dans plusieurs études citées par la revue.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5027001/" target="_blank" rel="noopener">Rota et Morelli 2016</a>.</p></template>
<template data-pop="g59-pns" data-title="Recommandation internationale de la Peripheral Nerve Society, 2010">
<div class="lab">Portée</div><p>Classification, diagnostic, bilan et traitement immunosuppresseur de la neuropathie vasculitique non systémique. Le résumé exécutif a été lu ; le texte intégral non.</p>
<div class="lab">Limite</div><p>Le premier auteur est américain, avec des coauteurs européens ; la recommandation date de 2010 et se limite à la vascularite non systémique.</p>
<p class="src">Référence : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Collins et collaborateurs, 2010</a>.</p></template>
<template data-pop="g59-cortico" data-title="Traitement immunosuppresseur de la vascularite non systémique">
<div class="lab">Première ligne</div><p>Corticothérapie seule pendant au moins six mois.</p>
<div class="lab">Traitement combiné</div><p>Il est proposé si l’évolution est rapide ou si la maladie progresse sous corticoïdes. Les immunosuppresseurs cités sont le cyclophosphamide (formes sévères, en bolus par voie intraveineuse), l’azathioprine et le méthotrexate.</p>
<div class="lab">Entretien</div><p>De 18 à 24 mois par azathioprine ou méthotrexate. Dans les vascularites à anticorps anticytoplasme des polynucléaires neutrophiles, le rituximab n’est pas inférieur au cyclophosphamide pour l’induction ; il est aussi efficace dans la cryoglobulinémie.</p>
<div class="lab">Limite</div><p>Les doses ne figurent pas dans les sources lues. La vascularite systémique relève du rhumatologue.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society 2010</a> ; <a href="https://doi.org/10.1097/WCO.0b013e3283580432" target="_blank" rel="noopener">Collins 2012</a>.</p></template>
<template data-pop="g59-efns" data-title="EFNS 2010 : traitement pharmacologique de la douleur neuropathique">
<div class="lab">Contenu</div><p>Niveau A pour les antidépresseurs tricycliques, la prégabaline, la gabapentine, le tramadol et les opioïdes (selon les situations), la duloxétine et la venlafaxine. Les associations tricycliques–gabapentine et gabapentine–opioïdes sont utiles.</p>
<div class="lab">Limite</div><p>La plupart des essais portent sur la polyneuropathie diabétique et la névralgie post-zostérienne. Aucune donnée n’est propre à la mononévrite. Le texte est ancien (2010) ; seul le résumé a été lu. Les doses suisses ne sont lues que pour la prégabaline, la gabapentine et la duloxétine.</p>
<p class="src">Référence : <a href="https://doi.org/10.1111/j.1468-1331.2010.02999.x" target="_blank" rel="noopener">Attal et collaborateurs, EFNS 2010</a>.</p></template>
<template data-pop="g59-pregabaline" data-title="Prégabaline : Lyrica, information professionnelle suisse">
<div class="lab">Indication</div><p>Douleurs neuropathiques périphériques et centrales de l’adulte.</p>
<div class="lab">Posologie</div><p>150 mg/jour en deux ou trois prises, puis 300 mg/jour après 3 à 7 jours, maximum 600 mg/jour après 7 jours supplémentaires.</p>
<div class="lab">Fonction rénale</div><p>Clairance de 30 à 60 mL/min : 75 mg/jour au départ, maximum 300 mg/jour. Moins de 30 mL/min : ne pas utiliser.</p>
<div class="lab">Mises en garde</div><p>Œdèmes et cas d’insuffisance cardiaque chez le sujet âgé : prudence en insuffisance cardiaque.</p>
<p class="src">Référence : information professionnelle suisse Lyrica (Viatris), mise à jour de juillet 2026, Swissmedic via AmiKo, lue le 15 octobre 2026.</p></template>
<template data-pop="g59-gabapentine" data-title="Gabapentine : Neurontin, information professionnelle suisse">
<div class="lab">Indication</div><p>Douleurs neuropathiques de l’adulte, notamment la neuropathie diabétique et la névralgie post-zostérienne.</p>
<div class="lab">Posologie</div><p>Titration de 300 à 600 puis 900 mg/jour sur trois jours ; entretien de 900 à 3600 mg/jour en trois prises.</p>
<div class="lab">Fonction rénale</div><p>Clairance de 50 à 79 mL/min : 600 à 1200 mg/jour ; de 30 à 49 : 300 à 900 ; de 15 à 29 : 150 à 600 ; moins de 15 : 150 à 300.</p>
<p class="src">Référence : information professionnelle suisse Neurontin (Viatris), mise à jour d’avril 2025, Swissmedic via AmiKo, lue le 15 octobre 2026.</p></template>
<template data-pop="g59-duloxetine" data-title="Duloxétine : information professionnelle suisse">
<div class="lab">Indication</div><p>Traitement de la douleur neuropathique diabétique.</p>
<div class="lab">Posologie</div><p>60 mg, une fois par jour. Aucun bénéfice démontré au-delà de 60 mg, avec une moins bonne tolérance.</p>
<div class="lab">Contre-indications</div><p>Clairance de la créatinine inférieure à 30 mL/min, insuffisance hépatique, inhibiteurs irréversibles des monoamine-oxydases, inhibiteurs du CYP1A2 (fluvoxamine, ciprofloxacine, énoxacine).</p>
<div class="lab">Mises en garde</div><p>Prudence en cas de glaucome à angle fermé (mydriase) ; élévation tensionnelle moyenne de 1 à 2 mmHg.</p>
<p class="src">Référence : information professionnelle suisse duloxétine Nobel, mise à jour de décembre 2024, Swissmedic via AmiKo ; la spécialité Cymbalta n’a pas été trouvée.</p></template>
<template data-pop="pareto-g59-definition" data-title="Pareto — Définition, codage et fréquence">
<p class="ratio" data-cover="g59-0,g59-1,g59-2"></p><ul><li>La mononévrite de ce cours est une manifestation codée par astérisque, rattachée à une maladie causale codée par croix.</li><li>Le diabète domine : G59.0* se code avec E10–E14† en quatrième position .4.</li><li>Le syndrome du canal carpien est la mononévrite la plus fréquente du diabétique (14 % sans polyneuropathie, 30 % avec).</li></ul></template>
<template data-pop="pareto-g59-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g59-3,g59-4"></p><ul><li>Le premier coup est métabolique, le second compressif ou ischémique.</li><li>Les causes sont le diabète, les vascularites, l’amyloïdose à transthyrétine et les effets de la prise en charge.</li><li>Une baisse très rapide de l’hémoglobine glyquée ou du poids peut elle-même léser les nerfs.</li></ul></template>
<template data-pop="pareto-g59-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g59-5,g59-6"></p><ul><li>Le rythme, la douleur, la perte de poids et le traitement récent du diabète orientent le mécanisme.</li><li>Une pupille épargnée oriente vers l’ischémie mais n’exclut pas l’anévrisme.</li><li>Une asymétrie, une amyotrophie ou des réflexes abolis imposent un bilan plus étendu.</li></ul></template>
<template data-pop="pareto-g59-diagnostic" data-title="Pareto — Démarche diagnostique et urgences">
<p class="ratio" data-cover="g59-7,g59-8"></p><ul><li>L’électroneuromyogramme localise la lésion et la caractérise.</li><li>Une paralysie oculomotrice après 50 ans justifie l’imagerie malgré les facteurs vasculaires.</li><li>Une vascularite rapidement progressive impose un traitement combiné.</li></ul></template>
<template data-pop="pareto-g59-prise" data-title="Pareto — Prise en charge et suivi">
<p class="ratio" data-cover="g59-9,g59-10,g59-11"></p><ul><li>Traiter le diabète sans baisse ultrarapide de l’hémoglobine glyquée ni du poids.</li><li>La radiculoplexopathie n’a aucun traitement prouvé ; la vascularite non systémique reçoit des corticoïdes d’au moins six mois.</li><li>La douleur suit l’EFNS 2010 ; la fonction rénale règle les doses.</li></ul></template>
<template data-pop="pareto-g59-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g59-e-1,g59-e-2,g59-e-3,g59-e-4,g59-e-5"></p><ul><li>L’examen est choisi par la question : siège, cause, danger.</li><li>La comparaison médian–ulnaire et l’échographie servent le canal carpien.</li><li>L’imagerie et la biologie servent surtout à exclure une cause grave.</li></ul></template>
<template data-pop="pareto-g59-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g59-s-anat-cours"></p><ul><li>Les formes focales touchent les nerfs crâniens, des membres et du tronc.</li><li>Le médian et l’ulnaire sont exposés dans leurs défilés.</li></ul></template>
<template data-pop="pareto-g59-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g59-s-histo-cours"></p><ul><li>La biopsie montre l’inflammation vasculaire, la perte de fibres ou un dépôt.</li><li>Les critères pathologiques de la vascularite non systémique sont listés.</li></ul></template>
<template data-pop="pareto-g59-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g59-s-physio-cours"></p><ul><li>Compression, ischémie et fléchissement métabolique se combinent.</li><li>La comparaison entre nerfs voisins est plus performante qu’une valeur absolue.</li></ul></template>
<template data-pop="pareto-g59-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g59-s-bioch-cours"></p><ul><li>Voie des polyols, pompe sodium-potassium, stress oxydatif et glycation abaissent le seuil de souffrance.</li><li>Le rythme de baisse de l’hémoglobine glyquée compte autant que son ampleur.</li></ul></template>
<template data-pop="pareto-g59-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g59-p-1,g59-p-2,g59-p-3"></p><ul><li>Aucun médicament n’est propre à la mononévrite.</li><li>Doses : prégabaline jusqu’à 600 mg/jour, gabapentine 900 à 3600, duloxétine 60.</li><li>La fonction rénale et les inhibiteurs du CYP1A2 guident le choix.</li></ul></template>
