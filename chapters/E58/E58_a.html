<section class="ilot" id="e58-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Un garçon de 3 ans est amené en consultation parce que ses jambes s’arquent depuis qu’il marche. Sa famille suit un régime sans lait ni produit laitier, et l’enfant boit une boisson de soja non enrichie. L’examen révèle des poignets élargis et un chapelet costal. Le questionnaire alimentaire estime son apport à 250 mg de calcium par jour. Ce chiffre est inférieur à 300 mg/jour, valeur que le consensus mondial de 2016 associe à la <b>carence</b> chez l’enfant de plus de 12 mois (voir <button class="w" data-k="e58-apport-seuils">la classification de l’apport calcique et la raison du seuil</button>).</p><p>Le calcium n’est pas un nutriment que l’on dose pour poser ce diagnostic : <b>la question décisive est celle de l’apport.</b> Quelle quantité de calcium l’alimentation fournit-elle, par quel mécanisme le squelette paie-t-il le manque, comment distinguer cette carence d’une carence en vitamine D qui lui ressemble, et comment la corriger avec les moyens disponibles en Suisse ? Le chapitre répond à ces quatre questions dans cet ordre.</p><div class="key"><b>Point de départ.</b> Le diagnostic de carence alimentaire en calcium repose sur <button class="w" data-k="e58-apport-seuils">l’anamnèse de l’apport (seuils de 300 et 500 mg/jour)</button> et sur <button class="w" data-k="e58-nosologie">la place de la catégorie E58 parmi ses voisines de la classification</button>. La biologie et la radiographie confirment le retentissement osseux ; elles ne remplacent pas l’anamnèse.</div><p>Le plan suit la consultation : définir et situer la carence (îlots 1 à 3), comprendre le mécanisme (îlot 4), reconnaître ses causes et ses signes (îlots 5 à 7), poser le diagnostic et les urgences (îlots 8 et 9), traiter chez l’enfant puis chez l’adulte (îlots 10 et 11), suivre et prévenir (îlots 12 et 13), enfin retenir les critères formels (îlot 14). Les <button class="w" data-k="e58-sources">sources lues et leurs limites</button> sont résumées dans une fenêtre.</p><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al., consensus mondial sur le rachitisme nutritionnel, J Clin Endocrinol Metab 2016</a>.</p></section>
<section class="ilot" id="e58-1"><h2><span class="n">1</span>Définitions et seuils</h2><p>La catégorie E58 de la CIM-10-GM 2024 s’intitule « Carence alimentaire en calcium ». Elle appartient au bloc E50–E64 des autres carences nutritionnelles et ne comporte aucun sous-code. Le mot « alimentaire » en délimite le champ : il s’agit d’un <b>apport insuffisant</b>, et non d’un calcium mal absorbé par un intestin malade, mal retenu par un rein malade ou mal régulé par une glande défaillante. Ces situations relèvent d’autres catégories, que <button class="w" data-k="e58-nosologie">la fenêtre de nosologie</button> énumère comme diagnostics différentiels.</p><p>Deux maladies osseuses sont les conséquences classiques de ce manque. Le <button class="w" data-k="e58-rachitisme">rachitisme nutritionnel</button> touche l’enfant en croissance : c’est un trouble de la différenciation des chondrocytes et de la minéralisation de la plaque de croissance, associé à un défaut de minéralisation de l’ostéoïde, causé par une carence en vitamine D, par un faible apport calcique, ou par les deux. L’<button class="w" data-k="e58-osteomalacie">ostéomalacie</button> est la minéralisation anormale de l’os déjà constitué ; elle concerne l’organisme après la fin de la croissance.</p><p>Chez l’enfant de plus de 12 mois, le consensus mondial de 2016 classe l’apport calcique en trois niveaux. Le tableau se lit de bas en haut comme un risque croissant de rachitisme.</p><table class="t"><tr><th>Apport calcique, enfant de plus de 12 mois</th><th>Statut</th></tr><tr><td>Plus de 500 mg/jour</td><td>Suffisant</td></tr><tr><td>300 à 500 mg/jour</td><td>Insuffisant</td></tr><tr><td>Moins de 300 mg/jour</td><td>Carence</td></tr></table><p>Un apport inférieur à 300 mg/jour augmente le risque de rachitisme <b>indépendamment</b> de la concentration sérique de 25-hydroxyvitamine D. Autrement dit, une vitamine D normale ne protège pas un enfant dont l’alimentation est pauvre en calcium. Pour le nourrisson, le consensus fixe des apports adéquats de 200 mg/jour de 0 à 6 mois et de 260 mg/jour de 6 à 12 mois.</p><div class="trap"><span class="k">Piège</span> Les sources lues ne donnent aucun seuil chiffré de « carence » chez l’adulte. Le tableau ci-dessus vaut pour l’enfant de plus de 12 mois. Chez l’adulte, la norme est fournie par les valeurs de référence suisses de l’îlot suivant, et la conclusion de carence repose sur l’anamnèse et sur le retentissement.</div><div class="key"><b>À retenir.</b> E58 désigne un apport insuffisant. Chez l’enfant, moins de 300 mg/jour est une carence et 300 à 500 mg/jour une insuffisance. Chez l’adulte, aucun seuil de carence n’est documenté dans les sources lues. <button class="w" data-k="e58-mnemo">Aide-mémoire des seuils</button>.</div><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al., J Clin Endocrinol Metab 2016, recommandations 1 à 3</a>.</p></section>
<section class="ilot" id="e58-2"><h2><span class="n">2</span>La norme avant la carence : valeurs de référence suisses</h2><p>Pour reconnaître un apport insuffisant, il faut d’abord savoir ce qu’est un apport normal. L’Office fédéral de la sécurité alimentaire et des affaires vétérinaires (OSAV) a publié en juin 2022 les valeurs de référence nutritionnelles pour la Suisse. <button class="w" data-k="e58-valeurs-suisses">Leur origine et leurs limites</button> sont détaillées dans la fenêtre associée.</p><table class="t"><tr><th>Groupe</th><th>Calcium (mg/jour)</th></tr><tr><td>7 à 11 mois</td><td>280</td></tr><tr><td>12 mois à 3 ans</td><td>450</td></tr><tr><td>4 à 10 ans</td><td>800</td></tr><tr><td>11 à 17 ans</td><td>1150</td></tr><tr><td>18 à 65 ans</td><td>950 (1000 à 18–24 ans)</td></tr><tr><td>Plus de 65 ans</td><td>1000 à 1200</td></tr><tr><td>Grossesse (trois trimestres) et allaitement</td><td>950 (1000 à 18–24 ans)</td></tr></table><p>Le tableau appelle trois commentaires. Les besoins sont maximaux à l’adolescence (1150 mg/jour), période de forte croissance du squelette. Ils remontent après 65 ans (1000 à 1200 mg/jour), âge où l’absorption intestinale diminue. Enfin, <b>aucune majoration n’est prévue pendant la grossesse et l’allaitement</b> : la femme enceinte doit atteindre les apports recommandés hors grossesse, sans les dépasser pour améliorer l’os du nouveau-né.</p><h3>Traduire les milligrammes en aliments</h3><p>La pyramide alimentaire suisse (Société suisse de nutrition et OSAV, 2024) recommande <b>deux à trois portions de produits laitiers par jour</b>. Une portion correspond à 2 dl de lait, ou 150 à 200 g de yogourt, de séré ou de cottage cheese, ou 30 g de fromage à pâte mi-dure ou dure, ou 60 g de fromage à pâte molle. Le lait contient environ 1200 mg de calcium par litre ; une portion de 2 dl en apporte donc environ 240 mg (calcul arithmétique à partir de cette teneur). Deux à trois portions fournissent ainsi de l’ordre de 480 à 720 mg avec le seul lait, le reste venant des autres aliments. <button class="w" data-k="e58-portion-laitiere">Les équivalences de portion et leur limite</button> sont détaillées dans la fenêtre.</p><p>Les substituts végétaux n’ont pas la même valeur nutritive que les produits laitiers. Les personnes qui n’en consomment pas doivent couvrir leurs besoins en calcium par d’autres aliments ; le glossaire de la pyramide cite la boisson de soja enrichie en calcium comme exemple d’aliment enrichi. Dans l’enquête nationale <button class="w" data-k="e58-menuch">menuCH</button>, les aliments fermentés, dont les produits laitiers fermentés, fournissent plus de 30 % du calcium quotidien des adultes.</p><div class="trap"><span class="k">Piège</span> La valeur suisse de 450 mg/jour entre 12 mois et 3 ans se situe dans la plage de 300 à 500 mg que le consensus mondial qualifie d’insuffisante. Les deux textes répondent à des questions différentes (norme d’apport pour une population saine, classification du risque de rachitisme) et les sources lues n’expliquent pas cet écart. On ne les substitue pas l’un à l’autre : la référence suisse fixe la cible, le consensus classe le risque.</div><div class="key"><b>À retenir.</b> Adulte : 950 mg/jour (1000 de 18 à 24 ans), 1000 à 1200 après 65 ans. Adolescent : 1150 mg/jour. Aucune majoration en grossesse ni en allaitement. Deux à trois portions de produits laitiers par jour, soit environ 240 mg de calcium par 2 dl de lait.</div><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/FLClcT03o4I6/nutrient-requirements-ch-2022.xlsx" target="_blank" rel="noopener">OSAV, Dietary Reference Values for Switzerland, juin 2022</a> ; <a href="https://www.sge-ssn.ch/media/4sintpm3/recommandations-nutritionnelles_version-longue_f.pdf" target="_blank" rel="noopener">Société suisse de nutrition et OSAV, recommandations nutritionnelles suisses 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley, Curr Osteoporos Rep 2024</a> ; <a href="https://doi.org/10.1016/j.tjnut.2025.05.042" target="_blank" rel="noopener">J Nutr 2025, menuCH</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a>.</p></section>
<section class="ilot" id="e58-3"><h2><span class="n">3</span>Épidémiologie</h2><p>Les carences en vitamine D et en calcium sont fréquentes dans le monde. La charge la plus lourde du rachitisme se situe en Afrique, en Asie et au Moyen‑Orient. Le rachitisme par carence calcique est la principale cause de rachitisme après la petite enfance dans les pays en développement pauvres en produits laitiers ; des études calciques ont été conduites au Nigeria, en Inde et au Bangladesh, ainsi qu’en Afrique du Sud et en Gambie.</p><p>Les enfants atteints consomment typiquement environ 200 mg de calcium par jour (Inde, Nigeria, Afrique du Sud). Une étude cas-témoins nigériane trouve toutefois 217 mg/jour chez les enfants atteints contre 214 mg/jour chez les témoins : l’apport bas est commun à toute la population, et d’autres facteurs déterminent qui développe la maladie. Un apport bas est donc une condition nécessaire du terrain, non une explication suffisante.</p><p>L’âge de survenue distingue les deux carences. Le rachitisme par carence en vitamine D culmine entre 6 mois et 2 ans. Le rachitisme par carence calcique survient plus tard : l’âge moyen est d’environ 4 ans au Nigeria, et de 4 à 16 ans en Afrique du Sud.</p><h3>Situation suisse</h3><p>Aucune donnée de prévalence de la carence alimentaire en calcium n’a été trouvée dans les sources lues pour la Suisse. Des signaux de risque sont toutefois documentés. Chez 52 adultes véganes suisses, la consommation d’aliments enrichis en calcium était sous-optimale. Une méta-analyse (co-auteur de l’Office fédéral de la santé publique) montre un apport calcique plus bas chez l’enfant et l’adolescent végane que chez l’omnivore, avec un contenu minéral osseux plus faible dans une étude isolée ; la certitude de ces résultats est faible à très faible.</p><div class="key"><b>À retenir.</b> Le rachitisme calcique frappe plus tard que le rachitisme vitaminique (vers 4 ans plutôt qu’entre 6 mois et 2 ans). En Suisse, la prévalence n’est pas connue ; le terrain à risque identifié est l’alimentation végane sans aliments enrichis.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor, Bone Reports 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10829326/" target="_blank" rel="noopener">J Health Popul Nutr 2024, véganes suisses</a> ; <a href="https://doi.org/10.1080/10408398.2023.2263574" target="_blank" rel="noopener">Crit Rev Food Sci Nutr 2023, méta-analyse</a>.</p></section>
<section class="ilot" id="e58-4"><h2><span class="n">4</span>Physiopathologie : le squelette paie le manque</h2><p>Pourquoi un apport trop faible aboutit-il à un os mal minéralisé ? Parce que l’organisme défend sa calcémie en puisant dans son squelette, ce que l’expérimentation animale montre directement. La chaîne se comprend en partant de l’état normal.</p><h3>Le calcium normal</h3><p>Le calcium est absorbé dans la partie supérieure de l’intestin grêle, sous forme ionisée, par un transfert actif, saturable et dépendant du calcitriol. La vitamine D3 subit deux hydroxylations : l’une dans le foie donne la 25-hydroxyvitamine D (calcifédiol), l’autre dans le tube rénal donne la 1,25-dihydroxyvitamine D (calcitriol), métabolite actif. La vitamine D augmente l’absorption intestinale du calcium, mobilise le calcium osseux et diminue son élimination rénale. Environ 60 % du calcium sérique est ionisé et diffusible. L’excrétion rénale dépend de la filtration glomérulaire et de la réabsorption tubulaire contrôlée par la parathormone (PTH). Le rapport molaire calcium/phosphore de l’organisme est de 1,4:1 à 1,9:1 ; l’absorption fractionnelle du phosphore est supérieure à celle du calcium. <button class="w" data-k="e58-absorption">Le détail de l’absorption et de ses inhibiteurs</button> figure dans la fenêtre associée.</p><h3>La carence d’apport, étape par étape</h3><p>Un apport insuffisant entraîne une absorption intestinale insuffisante, donc une <b>élévation de la PTH</b>. La PTH stimule la 1α-hydroxylase, enzyme rénale qui fabrique le calcitriol : celui-ci s’élève à 1,5 à 2 fois les valeurs des témoins avant traitement, et l’absorption fractionnelle augmente (61 % en moyenne chez les enfants nigérians atteints). L’organisme extrait ainsi davantage de calcium d’une ration insuffisante. Cette compensation a un coût en trois temps.</p><p>Premier coût : l’<button class="w" data-k="e58-pth">hyperparathyroïdie secondaire</button> augmente le catabolisme de la 25-hydroxyvitamine D, si bien que la carence calcique peut aggraver le statut vitaminique D. Deuxième coût : la PTH stimule la résorption osseuse, et son élévation abaisse le phosphate par défaut de conservation rénale ; ce déficit en phosphate conduit à la maladie osseuse. Troisième coût : chez l’animal, un <button class="w" data-k="e58-calcitriol">calcitriol élevé</button> inhibe la minéralisation et mobilise le calcium squelettique. La calcémie est préservée au prix d’une aggravation de l’ostéomalacie.</p><p>Le <button class="w" data-k="e58-fgf23">FGF23</button> est élevé chez de nombreux enfants gambiens atteints. Il diminue la réabsorption rénale du phosphate par le cotransporteur sodium-phosphate IIa et freine la 1α-hydroxylase ; son taux est inversement associé à l’hémoglobine, ce que les auteurs relient au statut martial.</p><figure><svg viewBox="0 0 440 524" role="img" aria-label="Chaîne physiopathologique de la carence calcique" font-family="Atkinson Hyperlegible, sans-serif" font-size="16"><g fill="none" stroke="#222" stroke-width="2"><rect x="14" y="12" width="412" height="44" rx="6"/><rect x="14" y="78" width="412" height="68" rx="6"/><rect x="14" y="168" width="412" height="92" rx="6"/><rect x="14" y="282" width="412" height="116" rx="6"/><rect x="14" y="420" width="412" height="92" rx="6"/><path d="M220 56v22m-6 -8l6 8 6 -8"/><path d="M220 146v22m-6 -8l6 8 6 -8"/><path d="M220 260v22m-6 -8l6 8 6 -8"/><path d="M220 398v22m-6 -8l6 8 6 -8"/></g><g fill="#222"><text x="28" y="40" font-weight="bold">Apport calcique alimentaire insuffisant</text><text x="28" y="106" font-weight="bold">Absorption intestinale insuffisante</text><text x="28" y="130">Parathormone (PTH) en hausse</text><text x="28" y="196" font-weight="bold">PTH → 1α-hydroxylase rénale</text><text x="28" y="220">Calcitriol 1,5 à 2 fois les témoins</text><text x="28" y="244">Absorption fractionnelle augmentée (61 %)</text><text x="28" y="310" font-weight="bold">Hyperparathyroïdie secondaire</text><text x="28" y="334">Résorption osseuse en hausse</text><text x="28" y="358">Phosphate en baisse (perte rénale)</text><text x="28" y="382">Catabolisme de la 25-hydroxyvitamine D en hausse</text><text x="28" y="448" font-weight="bold">Calcitriol élevé : minéralisation inhibée</text><text x="28" y="472">Calcémie préservée, os payeur</text><text x="28" y="496">Rachitisme (enfant) ou ostéomalacie (adulte)</text></g></svg><figcaption>Figure 1 — Chaîne de la carence alimentaire en calcium. La compensation hormonale maintient la calcémie en mobilisant l’os et en abaissant la minéralisation. Les valeurs chiffrées (calcitriol 1,5 à 2 fois les témoins, absorption fractionnelle de 61 %) proviennent d’enfants nigérians atteints. Schéma didactique original, non à l’échelle ; ce n’est pas une image clinique.</figcaption></figure><p>La figure résume la chaîne. Le message pour la pratique est le suivant : un enfant carencé en calcium peut avoir une 25-hydroxyvitamine D normale ou limite basse et un calcitriol élevé, alors qu’un enfant carencé en vitamine D a un calcitriol variable et une 25-hydroxyvitamine D effondrée. Le principe thérapeutique est confirmé par l’information professionnelle suisse du Calcimagon-D3 : en cas de carence en calcium, l’apport de calcium et de vitamine D réduit la hausse de la PTH, secondaire au déficit et responsable de l’augmentation de la résorption osseuse.</p><div class="key"><b>À retenir.</b> Carence d’apport → absorption insuffisante → PTH élevée → calcitriol élevé → calcémie défendue au prix d’une résorption osseuse accrue, phosphate bas et minéralisation freinée. L’os est la variable d’ajustement.</div><p class="src">Références : Information professionnelle suisse Calcimagon-D3, Swissmedic n° 53929, consultée le 15.10.2026 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor, Bone Reports 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://doi.org/10.2903/j.efsa.2015.4185" target="_blank" rel="noopener">EFSA, valeurs de référence du phosphore, 2015</a>.</p></section>
<section class="ilot" id="e58-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2><p>Une carence alimentaire naît d’une rencontre entre un apport bas et des facteurs qui le maintiennent bas ou qui réduisent l’absorption du peu qui est ingéré. Le tableau regroupe les causes documentées par mécanisme.</p><table class="t"><tr><th>Famille</th><th>Facteur</th><th>Mécanisme ou justification</th></tr><tr><td>Régime</td><td>Pauvreté, malnutrition, régimes spéciaux, régime pauvre en calcium</td><td>Apport inférieur au besoin</td></tr><tr><td>Régime</td><td>Absence de lait et de produits laitiers ; régimes <button class="w" data-k="e58-vegane">véganes</button> ou macrobiotiques</td><td>Suppression de la source alimentaire principale de calcium</td></tr><tr><td>Nourrisson</td><td>Boissons de soja ou de riz non destinées aux nourrissons ; allaitement prolongé sans <button class="w" data-k="e58-nourrisson">alimentation de complément adaptée</button> dès 6 mois</td><td>Apport inférieur aux apports adéquats de 200 et 260 mg/jour</td></tr><tr><td>Inhibiteurs d’absorption</td><td>Céréales riches en phytates, légumes riches en oxalates</td><td>Le <button class="w" data-k="e58-phytates-oxalates">calcium forme avec l’acide phytique et l’acide oxalique des liaisons insolubles</button></td></tr><tr><td>Médicaments</td><td>Corticostéroïdes systémiques ; diurétiques de l’anse</td><td><button class="w" data-k="e58-medicaments">Absorption réduite ou élimination rénale accrue</button></td></tr><tr><td>Âge</td><td>Sujet âgé</td><td>Absorption intestinale diminuée, aggravée par la carence fréquente en vitamine D</td></tr></table><p>L’intolérance au lactose est un facteur possible mais n’a pas été étudiée dans les séries lues. Le tableau se lit comme une liste de questions à poser (îlot suivant). Les facteurs agissent ensemble : un enfant végane qui consomme beaucoup de céréales complètes cumule un apport bas et une absorption réduite.</p><div class="trap"><span class="k">Piège</span> Une boisson de soja ou de riz du commerce n’est pas un substitut du lait pour le nourrisson ni pour le jeune enfant. Le consensus de 2016 l’inscrit parmi les facteurs de risque de rachitisme nutritionnel. Seule une boisson enrichie en calcium peut être comptée comme source, et sa teneur se lit sur l’étiquette.</div><div class="key"><b>À retenir.</b> Les causes de E58 sont l’éviction des produits laitiers sans compensation, les boissons végétales non adaptées chez le petit enfant, la diversification tardive, les inhibiteurs d’absorption, deux familles de médicaments et le grand âge.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a> ; information professionnelle Calcimagon-D3 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley 2024</a>.</p></section>
<section class="ilot" id="e58-6"><h2><span class="n">6</span>Anamnèse : mesurer l’apport</h2><p>L’évaluation de la carence calcique repose sur une <b>anamnèse de l’apport calcique</b>. Le consensus recommande des questionnaires calciques adaptés au pays, car un apport ne se devine pas : il se reconstitue aliment par aliment. L’information professionnelle du Calcimagon-D3 rappelle d’ailleurs que l’apport calcique alimentaire existant du patient doit être évalué par le médecin avant de choisir la dose du supplément.</p><table class="t"><tr><th>Question</th><th>Ce qu’elle cherche</th></tr><tr><td>Combien de portions de produits laitiers par jour (référence suisse : deux à trois) ?</td><td>Le déficit par rapport à la <button class="w" data-k="e58-portion-laitiere">portion de référence</button></td></tr><tr><td>Régime végane, macrobiotique ou d’éviction lactée ? Boissons végétales enrichies ou non ?</td><td>Une source de calcium supprimée ou remplacée</td></tr><tr><td>Diversification : à quel âge ? Allaitement prolongé sans complément ?</td><td>Un apport du nourrisson inférieur à 200 ou 260 mg/jour</td></tr><tr><td>Corticoïdes systémiques, diurétiques de l’anse ?</td><td>Une <button class="w" data-k="e58-medicaments">perte accrue de calcium</button></td></tr><tr><td>Paresthésies, crampes ?</td><td>Des symptômes d’hypocalcémie</td></tr><tr><td>Douleurs osseuses ?</td><td>Un retentissement squelettique</td></tr></table><div class="two"><div class="card"><h4>Forme typique</h4><p>Un enfant de 4 ans, sans lait ni produit laitier à la maison, consomme des céréales complètes et une boisson de soja non enrichie. Les parents décrivent des jambes arquées et des douleurs aux jambes à la marche. L’apport estimé reste sous 300 mg/jour. L’anamnèse porte le diagnostic avant tout examen complémentaire.</p></div><div class="card"><h4>Forme trompeuse</h4><p>Une femme de 84 ans vivant seule mange peu de produits laitiers, prend un diurétique de l’anse et reçoit une corticothérapie systémique. Elle ne se plaint de rien, hormis des crampes nocturnes. Son besoin (1000 à 1200 mg/jour) n’est pas couvert, son absorption est réduite par l’âge et ses pertes sont accrues par les deux médicaments. Chaque facteur est modeste ; leur somme explique le tableau.</p></div></div><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Un nourrisson de 9 mois, allaité exclusivement, n’a reçu aucun aliment de complément. Quel est l’apport calcique adéquat à cet âge, selon le consensus mondial de 2016 ?</p><button data-ok="0">200 mg/jour.</button><button data-ok="1">260 mg/jour.</button><button data-ok="0">500 mg/jour.</button><p class="fb" hidden>Le consensus fixe 200 mg/jour de 0 à 6 mois et 260 mg/jour de 6 à 12 mois. Le seuil de 500 mg/jour concerne le statut « suffisant » après 12 mois. Un allaitement prolongé sans complément approprié dès 6 mois est un facteur de risque ; les aliments de complément riches en calcium doivent être introduits au plus tard à 26 semaines.</p></div><div class="key"><b>À retenir.</b> L’anamnèse comptabilise les portions laitières, interroge les régimes d’éviction, l’âge de la diversification et les deux familles de médicaments, puis cherche les symptômes d’hypocalcémie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://www.sge-ssn.ch/media/4sintpm3/recommandations-nutritionnelles_version-longue_f.pdf" target="_blank" rel="noopener">Société suisse de nutrition et OSAV 2024</a> ; information professionnelle Calcimagon-D3.</p><button class="pareto-btn ui" data-k="pareto-e58-clin">▲ Loi de Pareto — Notions, physiopathologie et clinique</button></section>
