<template data-pop="e58-apport-seuils" data-title="Apport calcique : seuils de 300 et 500 mg/jour"><h3>Ce que mesurent les seuils</h3><p>Le consensus mondial de 2016, initié par la Société européenne d’endocrinologie pédiatrique (ESPE), avec l’ESPGHAN et neuf autres sociétés, classe l’apport calcique de l’enfant de plus de 12 mois : plus de 500 mg/jour est suffisant, 300 à 500 mg/jour insuffisant, moins de 300 mg/jour correspond à une carence (recommandation de niveau 1). Un apport inférieur à 300 mg/jour augmente le risque de rachitisme indépendamment de la 25-hydroxyvitamine D sérique.</p><h3>Repères</h3><p>Le rachitisme calcique est observé dans des populations dont l’apport habituel se situe autour de 200 mg/jour (Inde, Nigeria, Afrique du Sud). Le même chiffre de 500 mg/jour est la dose de calcium prescrite pour traiter le rachitisme. Les sources lues ne détaillent pas comment les bornes ont été dérivées.</p><h3>Limites</h3><p>Le seuil vaut pour l’enfant de plus de 12 mois. Pour le nourrisson, le consensus donne des apports adéquats de 200 mg/jour (0 à 6 mois) et 260 mg/jour (6 à 12 mois). Aucun seuil de carence n’est fixé pour l’adulte dans les sources lues. L’apport se reconstitue par un questionnaire adapté au pays ; sa précision dépend des déclarations.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al., J Clin Endocrinol Metab 2016</a>.</p></template>
<template data-pop="e58-mnemo" data-title="Aide-mémoire des seuils de l’enfant"><p><b>Aide pédagogique, non critère officiel.</b></p><p>Pour retenir les deux bornes du consensus après 12 mois : « trois cents, cinq cents ». Sous 300 mg/jour, la carence ; entre 300 et 500, l’insuffisance ; au-dessus de 500, la suffisance. Le même chiffre de 500 mg/jour sert de dose de calcium dans le traitement du rachitisme.</p></template>
<template data-pop="e58-nosologie" data-title="E58 et les catégories voisines de la CIM-10-GM 2024"><h3>La catégorie</h3><p>E58 — Carence alimentaire en calcium appartient au bloc E50–E64 (autres carences nutritionnelles) de la CIM-10-GM 2024 de l’Office fédéral de la statistique. La catégorie est terminale, sans sous-code. Le libellé anglais de la classification américaine est « Dietary calcium deficiency ».</p><h3>Les catégories voisines</h3><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Lien avec E58</th></tr><tr><td>E55</td><td>Carence en vitamine D</td><td>Cause associée ou concurrente du rachitisme</td></tr><tr><td>E83</td><td>Anomalies du métabolisme des minéraux</td><td>Formes génétiques de rachitisme hypophosphatémique</td></tr><tr><td>E20</td><td>Hypoparathyroïdie</td><td>Cause d’hypocalcémie</td></tr><tr><td>E64</td><td>Séquelles de malnutrition et autres carences nutritionnelles</td><td>Séquelles</td></tr><tr><td>M83</td><td>Ostéomalacie de l’adulte</td><td>Conséquence osseuse chez l’adulte</td></tr><tr><td>K90</td><td>Malabsorption intestinale</td><td>Calcium mal absorbé malgré un apport normal</td></tr><tr><td>N25</td><td>Affections dues à une tubulopathie</td><td>Perte rénale</td></tr><tr><td>P71</td><td>Anomalies transitoires du métabolisme du calcium et du magnésium du nouveau-né</td><td>Hypocalcémie néonatale</td></tr></table><p>Les notes d’inclusion et d’exclusion de E58 n’ont pas été lues ; le rattachement des diagnostics voisins repose sur les libellés.</p><p class="src">Référence : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>.</p></template>
<template data-pop="e58-valeurs-suisses" data-title="Valeurs de référence nutritionnelles pour la Suisse (OSAV 2022)"><h3>Origine</h3><p>L’Office fédéral de la sécurité alimentaire et des affaires vétérinaires (OSAV) publie en version de juin 2022 les valeurs de référence pour la Suisse. Selon sa page de présentation, elles reposent sur un rapport de la Haute école de santé de Genève et sur une prise de position de la Commission fédérale de l’alimentation ; beaucoup sont reprises de l’Autorité européenne de sécurité des aliments (EFSA), et certaines des valeurs D-A-CH. La source précise retenue pour le calcium n’y est pas nommée.</p><h3>Valeurs en phosphore (pour mémoire)</h3><table class="t"><tr><th>Groupe</th><th>Phosphore (mg/jour)</th></tr><tr><td>7 à 11 mois</td><td>160</td></tr><tr><td>12 mois à 3 ans</td><td>250</td></tr><tr><td>4 à 10 ans</td><td>440</td></tr><tr><td>11 à 17 ans</td><td>640</td></tr><tr><td>18 à 65 ans</td><td>550</td></tr><tr><td>Plus de 65 ans</td><td>700</td></tr></table><h3>Limites</h3><p>L’avis de l’EFSA de 2015 sur le calcium n’a pas été accessible (erreur 403) ; aucune valeur de l’EFSA pour le calcium n’est citée, et la concordance supposée n’est pas vérifiée. Ces valeurs concernent la population saine, non le patient.</p><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/FLClcT03o4I6/nutrient-requirements-ch-2022.xlsx" target="_blank" rel="noopener">OSAV 2022</a> ; <a href="https://www.blv.admin.ch/de/naehrstoffzufuhr" target="_blank" rel="noopener">page de présentation OSAV</a>.</p></template>
<template data-pop="e58-portion-laitiere" data-title="Portions laitières et teneur en calcium"><h3>Équivalences de la pyramide suisse</h3><p>Une portion vaut 2 dl de lait, 150 à 200 g de yogourt, de séré ou de cottage cheese, 30 g de fromage à pâte mi-dure ou dure, ou 60 g de fromage à pâte molle. La recommandation est de deux à trois portions par jour. Les produits laitiers sont une source importante de protéines, de calcium, d’iode et de vitamines B2 et B12.</p><h3>Calcul</h3><p>Le lait contient environ 1200 mg de calcium par litre ; 2 dl en contiennent donc environ 240 mg. Cette valeur est un calcul à partir de la teneur citée ; la teneur des autres portions n’est pas donnée dans les sources lues.</p><h3>Limite</h3><p>Les substituts végétaux n’ont pas la même valeur nutritive ; seule une boisson enrichie en calcium peut être comptée comme source, et sa teneur est celle de l’étiquette.</p><p class="src">Références : <a href="https://www.sge-ssn.ch/media/4sintpm3/recommandations-nutritionnelles_version-longue_f.pdf" target="_blank" rel="noopener">SSN et OSAV 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley 2024</a>.</p></template>
<template data-pop="e58-menuch" data-title="menuCH : l’enquête alimentaire nationale"><p>Dans l’enquête nationale menuCH (2014-2015, 2086 adultes de 18 à 75 ans), les aliments fermentés, dont les produits laitiers fermentés, fournissent plus de 30 % du calcium quotidien. L’article ne chiffre pas, dans les sources lues, l’apport calcique moyen des participants ; la prévalence de la carence en Suisse reste donc inconnue.</p><p class="src">Référence : <a href="https://doi.org/10.1016/j.tjnut.2025.05.042" target="_blank" rel="noopener">J Nutr 2025</a>.</p></template>
<template data-pop="e58-rachitisme" data-title="Rachitisme nutritionnel"><h3>Définition</h3><p>Le rachitisme nutritionnel est un trouble de la différenciation des chondrocytes et de la minéralisation de la plaque de croissance, associé à un défaut de minéralisation de l’ostéoïde. Il est causé par une carence en vitamine D, un faible apport calcique, ou les deux.</p><h3>Signes</h3><p>Voir la fenêtre des signes squelettiques. Le diagnostic associe anamnèse, examen et biologie, confirmés par radiographie.</p><h3>Conséquence</h3><p>Le rachitisme augmente le risque de fracture, contrairement à la carence en vitamine D sans rachitisme.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a>.</p></template>
<template data-pop="e58-osteomalacie" data-title="Ostéomalacie"><p>L’ostéomalacie est la minéralisation anormale de l’os constitué, après la fin de la croissance. Elle relève de la catégorie M83 de la CIM-10-GM. Les sources lues ne détaillent pas son protocole de traitement chez l’adulte ; elles en donnent seulement la définition et la place de conséquence osseuse de la carence en calcium ou en vitamine D.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS 2024</a>.</p></template>
<template data-pop="e58-absorption" data-title="Absorption intestinale du calcium"><h3>Mécanisme normal</h3><p>Le calcium est absorbé dans la partie supérieure de l’intestin grêle, sous forme ionisée, par un transfert actif, saturable et dépendant du calcitriol. La vitamine D augmente l’absorption, mobilise le calcium osseux et diminue l’élimination rénale.</p><h3>Inhibiteurs</h3><p>L’acide oxalique (épinards, rhubarbe) et l’acide phytique (céréales complètes) forment des liaisons insolubles avec le calcium. Les corticostéroïdes systémiques inhibent l’absorption intestinale et rénale du calcium.</p><h3>Conséquence clinique</h3><p>Une absorption saturable ne se compense pas par une dose unique massive : le fractionnement et la quantité totale comptent. Chez le sujet âgé, l’absorption est diminuée.</p><p class="src">Références : information professionnelle Calcimagon-D3 (Swissmedic, 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley 2024</a>.</p></template>
<template data-pop="e58-pth" data-title="Hyperparathyroïdie secondaire de la carence calcique"><p>L’apport insuffisant élève la PTH. Celle-ci stimule la 1α-hydroxylase (calcitriol élevé), la résorption osseuse et la perte rénale de phosphate. Elle augmente aussi le catabolisme de la 25-hydroxyvitamine D, si bien que la carence calcique peut aggraver le statut vitaminique D. Elle est appelée secondaire parce qu’elle répond à une cause extérieure à la glande ; dans l’hyperparathyroïdie primaire, citée parmi les contre-indications du Calcimagon-D3, la glande est elle-même en cause.</p><p>L’information professionnelle du Calcimagon-D3 le confirme : l’apport de calcium et de vitamine D réduit la hausse de la PTH secondaire au déficit.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a> ; information professionnelle Calcimagon-D3.</p></template>
<template data-pop="e58-calcitriol" data-title="Calcitriol élevé et minéralisation"><p>Chez les enfants carencés en calcium, le calcitriol est de 1,5 à 2 fois celui des témoins avant traitement. Chez l’animal, un calcitriol élevé inhibe la minéralisation et mobilise le calcium squelettique : la calcémie est préservée au prix d’une aggravation de l’ostéomalacie. Cette donnée est animale ; elle éclaire le mécanisme sans le démontrer chez l’enfant.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-fgf23" data-title="FGF23 dans le rachitisme calcique"><p>Le FGF23 est élevé chez de nombreux enfants gambiens atteints de rachitisme calcique. Il diminue la réabsorption rénale du phosphate (cotransporteur sodium-phosphate IIa) et freine la 1α-hydroxylase. Son taux est inversement associé à l’hémoglobine, ce que les auteurs relient au statut martial. La causalité n’est pas établie.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-vegane" data-title="Alimentation végane et calcium"><h3>Chez l’adulte</h3><p>Fractures toutes causes : risque relatif de 1,44 (méta-analyse de 2019). EPIC-Oxford : rapport de risque de 1,50 pour toutes les fractures et de 2,64 pour la hanche. Adventist Health Study 2 : chez les femmes véganes sans supplément de calcium et de vitamine D, rapport de risque de 2,99 pour la hanche ; avec suppléments, 0,84 (non significatif).</p><h3>Chez l’enfant et en Suisse</h3><p>Une méta-analyse (co-auteur de l’Office fédéral de la santé publique) trouve un apport calcique plus bas chez l’enfant et l’adolescent végane, avec un contenu minéral osseux plus faible dans une étude isolée ; la certitude est faible à très faible. Chez 52 adultes véganes suisses, la consommation d’aliments enrichis en calcium était sous-optimale.</p><h3>Interprétation</h3><p>L’association est observationnelle. Elle ne permet pas de dire si le risque tient à l’exclusion des produits laitiers ou à l’absence d’aliments enrichis et de suppléments ; le contraste entre 2,99 et 0,84 (non significatif) est un signal, non une preuve.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley 2024</a> ; <a href="https://doi.org/10.1080/10408398.2023.2263574" target="_blank" rel="noopener">Crit Rev Food Sci Nutr 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10829326/" target="_blank" rel="noopener">J Health Popul Nutr 2024</a>.</p></template>
<template data-pop="e58-nourrisson" data-title="Nourrisson : apports et complément"><p>Apports adéquats : 200 mg/jour de 0 à 6 mois, 260 mg/jour de 6 à 12 mois. L’allaitement prolongé sans alimentation de complément appropriée dès 6 mois est un facteur de risque ; les aliments de complément riches en calcium doivent être introduits au plus tard à 26 semaines. Les boissons de soja ou de riz non destinées aux nourrissons sont un facteur de risque de rachitisme nutritionnel.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a>.</p></template>
<template data-pop="e58-phytates-oxalates" data-title="Phytates et oxalates"><p>L’acide oxalique (épinards, rhubarbe) et l’acide phytique (céréales complètes) forment des liaisons insolubles avec le calcium et inhibent son absorption. Le calcium reste dans la lumière intestinale sous une forme non absorbable. Le Calcimagon-D3 ne se prend pas dans les 2 heures suivant des aliments riches en oxalates ou en phytates. Chez les enfants africains atteints, les céréales riches en phytates et les légumes verts riches en oxalates s’ajoutent à une faible consommation laitière.</p><p class="src">Références : information professionnelle Calcimagon-D3 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-medicaments" data-title="Médicaments qui font perdre du calcium"><p>Les corticostéroïdes systémiques inhibent l’absorption intestinale et rénale du calcium. Les diurétiques de l’anse augmentent son élimination rénale. Ces deux familles s’ajoutent à un apport bas pour déséquilibrer le bilan calcique, en particulier chez le sujet âgé. Les thiazidiques, à l’inverse, exposent à l’hypercalcémie lorsqu’ils sont associés à un supplément calcique.</p><p class="src">Référence : information professionnelle Calcimagon-D3 (Swissmedic, 15.10.2026).</p></template>
<template data-pop="e58-signes-squelette" data-title="Signes squelettiques du rachitisme"><table class="t"><tr><th>Signe</th><th>Siège</th></tr><tr><td>Tuméfaction</td><td>Poignets et chevilles</td></tr><tr><td>Fermeture retardée</td><td>Fontanelle</td></tr><tr><td>Retard d’éruption</td><td>Dents</td></tr><tr><td><i>Genu varum</i>, <i>genu valgum</i></td><td>Membres inférieurs</td></tr><tr><td>Chapelet costal</td><td>Côtes</td></tr><tr><td>Bosses frontales, craniotabès</td><td>Crâne</td></tr><tr><td>Douleurs osseuses</td><td>Squelette</td></tr></table><p>Ces signes traduisent le défaut de minéralisation de l’os en croissance. Leur ordre de fréquence n’est pas donné dans les sources lues. La confirmation est radiographique.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a>.</p></template>
<template data-pop="e58-chvostek-trousseau" data-title="Signes de Chvostek et de Trousseau"><p>Les signes de Chvostek et de Trousseau sont des signes d’irritabilité neuromusculaire de l’hypocalcémie, avec les paresthésies péribuccales et digitales, la tétanie et le spasme carpopédal. Leur technique et leur sensibilité ne sont pas décrites dans les sources lues. Leur présence oriente vers une mesure du calcium corrigé ; leur absence n’exclut pas une hypocalcémie.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a>.</p></template>
<template data-pop="e58-hypocalcemie-causes" data-title="Autres causes d’hypocalcémie de l’adulte"><p>La thyroïdectomie totale est la cause hospitalière la plus fréquente. Viennent ensuite la parathyroïdectomie, la carence sévère en vitamine D, la carence en magnésium (penser à l’hypomagnésémie sous inhibiteur de la pompe à protons), les cytotoxiques, la pancréatite, la rhabdomyolyse et la transfusion massive. L’hypoparathyroïdie relève de la catégorie E20. Ces causes sont à rechercher avant de conclure à une carence d’apport.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a>.</p></template>
<template data-pop="e58-hypomagnesemie" data-title="Hypomagnésémie et hypocalcémie"><p>La correction d’une hypomagnésémie fait partie de la prise en charge de l’hypocalcémie sévère : 24 mmol de magnésium sur 24 heures (6 g de sulfate de magnésium, soit 30 ml à 20 % dans 500 ml). Il faut y penser sous inhibiteur de la pompe à protons. Le texte de référence ne précise pas le seuil de magnésémie ; la décision repose sur le dosage et la clinique.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a>.</p></template>
<template data-pop="e58-urgence-bolus" data-title="Hypocalcémie sévère : protocole intraveineux"><h3>Définition et indication</h3><p>Hypocalcémie sévère : calcium corrigé inférieur à 1,9 mmol/l et/ou symptômes. C’est une urgence médicale.</p><h3>Protocole (Society for Endocrinology, adulte)</h3><ul><li>Bolus : 10 à 20 ml de gluconate de calcium à 10 % dans 50 à 100 ml de glucose à 5 %, en 10 minutes, sous ECG ; à répéter jusqu’à disparition des symptômes.</li><li>Relais : 100 ml de gluconate de calcium à 10 % (10 ampoules) dans 1 l de NaCl 0,9 % ou de glucose à 5 %, à 50 à 100 ml/heure, titré jusqu’à la normocalcémie.</li><li>Chlorure de calcium : alternative plus irritante, par voie centrale seulement.</li><li>Corriger une hypomagnésémie.</li></ul><h3>Risques</h3><p>Thrombophlébite, cardiotoxicité, hypotension, goût métallique, bouffées de chaleur, nausées. ECG continu en cas d’arythmie ou de digoxine. Pas de perfusion calcique de grand volume en insuffisance rénale terminale ou sous dialyse.</p><h3>Limite</h3><p>Texte britannique pour l’adulte ; aucune information professionnelle suisse d’une solution de calcium intraveineuse n’a été trouvée (AIPS). La posologie pédiatrique n’est pas documentée.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a>.</p></template>
<template data-pop="e58-essais-enfants" data-title="Essais de traitement du rachitisme calcique"><table class="t"><tr><th>Pays</th><th>Effectif</th><th>Résultat</th></tr><tr><td>Nigeria</td><td>123 enfants carencés en calcium</td><td>Critère composite atteint chez 58 % (calcium et vitamine D), 61 % (calcium seul), 19 % (vitamine D seule)</td></tr><tr><td>Inde</td><td>67 enfants</td><td>Guérison complète à 12 semaines chez 50 % (association), 15,7 % (vitamine D seule), 11,7 % (calcium seul)</td></tr></table><p>Les deux essais ne donnent pas le même classement entre calcium seul et association : les populations et les critères de jugement diffèrent. L’enseignement commun est que la vitamine D seule est insuffisante lorsque la carence calcique domine.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a>.</p></template>
<template data-pop="e58-carbonate-dose" data-title="Dose de carbonate de calcium chez l’enfant"><p>Chez l’enfant dont l’apport habituel est inférieur à 300 mg/jour, le carbonate de calcium à 1000 mg/jour est la dose optimale. Passer à 2000 mg n’augmente pas significativement l’absorption totale. Certains enfants ont eu besoin de plus de 24 semaines pour guérir. Le calcaire et le poisson moulu ont donné des guérisons semblables. Ces données proviennent d’études menées en Afrique ; la transposition à la Suisse n’est pas documentée.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-contre-indications" data-title="Contre-indications du Calcimagon-D3"><p>Hypercalcémie, hypercalciurie, lithiase, hypervitaminose D, insuffisance rénale, hyperphosphatémie, hyperparathyroïdie primaire, traitement par calcitriol, plasmocytome, métastases osseuses, immobilisation prolongée avec hypercalciurie ou hypercalcémie. Le produit n’est pas destiné aux moins de 18 ans. Chaque contre-indication correspond à une situation où un apport supplémentaire de calcium ou de vitamine D majorerait la calcémie ou la calciurie.</p><p class="src">Référence : information professionnelle Calcimagon-D3 (Swissmedic n° 53929, 15.10.2026).</p></template>
<template data-pop="e58-interactions" data-title="Interactions du calcium : délais de prise"><table class="t"><tr><th>Médicament</th><th>Précaution</th></tr><tr><td>Tétracyclines</td><td>Environ 3 heures d’intervalle</td></tr><tr><td>Quinolones</td><td>2 heures avant ou 4 à 6 heures après ; baisse de biodisponibilité jusqu’à 50 %</td></tr><tr><td>Lévothyroxine</td><td>Au moins 4 heures</td></tr><tr><td>Bisphosphonates, fer, zinc, fluorure, ranélate de strontium</td><td>2 heures</td></tr><tr><td>Digitaliques</td><td>Toxicité accrue ; surveillance ECG</td></tr><tr><td>Thiazidiques</td><td>Risque d’hypercalcémie</td></tr><tr><td>Aliments riches en oxalates ou en phytates</td><td>Pas de prise dans les 2 heures suivantes</td></tr></table><p class="src">Référence : information professionnelle Calcimagon-D3 (Swissmedic, 15.10.2026).</p></template>
<template data-pop="e58-fractures-evidence" data-title="Calcium, vitamine D et fractures : les preuves"><ul><li>Calcium seul : effets inconstants sur les fractures.</li><li>Calcium et vitamine D : fractures totales de 5 à 15 % en moins, fractures de hanche de 13 à 30 % en moins, selon les méta-analyses ; effet maximal chez les résidents fragiles d’EMS.</li><li>Essai en EMS (7195 résidents, 86 ans) : produits laitiers portant l’apport de 700 à 1142 mg/jour ; fractures −33 %, fractures de hanche −46 %, chutes −10 %, mortalité inchangée.</li><li>Information professionnelle : 3270 sujets hospitalisés de 84 ± 6 ans, vitamine D 800 UI et calcium 1200 mg pendant 18 mois : 80 fractures de hanche contre 110 (p = 0,004).</li></ul><p>Ces résultats concernent des sujets âgés fragiles et ne se transposent pas à l’enfant. Les produits laitiers, plutôt qu’un supplément, apportent aussi des protéines.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley 2024</a> ; information professionnelle Calcimagon-D3.</p></template>
<template data-pop="e58-radio" data-title="Radiographie dans le rachitisme"><p>Les radiographies des poignets et des genoux confirment un rachitisme actif : élargissement et cupule métaphysaires, élargissement de la plaque de croissance, ostéopénie, rétrécissement du détroit pelvien, fracture à traumatisme minime. Le dépistage radiographique en population n’est pas recommandé.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a>.</p></template>
<template data-pop="e58-ca-corrige" data-title="Calcium corrigé"><p>Le seuil de gravité de l’hypocalcémie (1,9 mmol/l) s’exprime en calcium corrigé. Environ 60 % du calcium sérique est ionisé et diffusible. Les sources lues ne donnent ni la formule de correction ni l’intervalle de référence du laboratoire ; ceux du laboratoire qui a réalisé l’analyse prévalent.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a> ; information professionnelle Calcimagon-D3.</p></template>
<template data-pop="e58-vitd-statut" data-title="Statut vitaminique D : seuils"><p>Consensus 2016 : suffisance au-dessus de 50 nmol/l, insuffisance de 30 à 50 nmol/l, carence au-dessous de 30 nmol/l. Dans la carence calcique, la 25-hydroxyvitamine D est normale ou à la limite basse ; elle est souvent inférieure à 10–15 nmol/l dans la carence en vitamine D. La carence calcique augmente le catabolisme de la 25-hydroxyvitamine D, ce qui peut abaisser sa valeur.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-pal" data-title="Phosphatases alcalines"><p>Les phosphatases alcalines sont élevées dans le rachitisme carentiel, qu’il soit calcique ou vitaminique. Elles ne distinguent donc pas les deux causes. Leur dépistage en population n’est pas recommandé. L’intervalle de référence n’est pas donné dans les sources lues.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-phosphate" data-title="Phosphate sérique"><p>Le phosphate est normal ou abaissé dans la carence calcique et dans la carence vitaminique. L’élévation de la PTH l’abaisse par défaut de conservation rénale. Un phosphate bas avec PTH normale évoque un rachitisme hypophosphatémique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-calciurie" data-title="Calciurie"><p>Le consensus décrit une calciurie basse dans le rachitisme par carence calcique. Sous supplément prolongé, une calciurie supérieure à 7,5 mmol/24 heures (300 mg/24 heures) impose de réduire ou de suspendre le calcium (information professionnelle du Calcimagon-D3). Une même mesure sert donc au diagnostic et à la sécurité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; information professionnelle Calcimagon-D3.</p></template>
