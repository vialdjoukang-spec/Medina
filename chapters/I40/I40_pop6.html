
<!-- ===== FENÊTRES PARETO I40 ===== -->
<template data-pop="pareto-i40-def" data-title="Pareto — Définition, classifications, épidémiologie">
<p class="ratio" data-cover="i40-1,i40-2"></p>
<ul><li>Myocardite = inflammation du myocarde ; diagnostic certain par IRM ou biopsie avec présentation compatible (ESC 2025).</li><li>ESC 2025 : syndrome inflammatoire myopéricardique (IMPS) ; myocardite dominante → I40, péricardite dominante → I30.</li><li>Aiguë ≤ 4 semaines ; subaiguë &gt; 4 semaines à 3 mois ; chronique &gt; 3 mois (cardiomyopathie inflammatoire si dysfonction).</li><li>Non compliquée (FEVG conservée) ; compliquée (FEVG &lt; 50 %, insuffisance cardiaque, arythmie ventriculaire, bloc de haut degré) ; fulminante (choc).</li><li>Types histologiques : lymphocytaire, éosinophiles, cellules géantes, granulomateuse.</li><li>Incidence ≈ 6–9/100 000/an ; homme jeune ; 1–12 % des morts subites du jeune.</li><li>Immunothérapie ≈ 1 % des traités, mortalité élevée ; vaccin ARN messager : homme de 16–24 ans après la 2e dose.</li><li>Troponine élevée + coronaires normales = MINOCA d’abord.</li></ul></template>

<template data-pop="pareto-i40-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i40-3"></p>
<ul><li>Phase 1 virale (entrée par le récepteur CAR, lyse) → phase 2 immunitaire (lymphocytes T, mimétisme anti-myosine) → guérison ou phase 3 (fibrose, dilatation).</li><li>Nécrose → troponine ; œdème → T2, parois épaisses (forme fulminante).</li><li>Virus présent = pas d’immunosuppression ; virus absent + inflammation persistante = immunosuppression discutable.</li><li>Immunothérapie : signaux inhibiteurs PD-1/CTLA-4 supprimés ; éosinophiles : granules cytotoxiques et thrombose ; cellules géantes : auto-immunité T nécrosante ; Chagas : parasite persistant, fibrose, dénervation.</li></ul></template>

<template data-pop="pareto-i40-etio" data-title="Pareto — Étiologies">
<p class="ratio" data-cover="i40-4"></p>
<ul><li>Virus : parvovirus B19, herpèsvirus de type 6, entérovirus, adénovirus, grippe, SARS-CoV-2.</li><li>Autres infections : Lyme (bloc, Suisse), Chagas, diphtérie, toxoplasmose.</li><li>Immunitaires et médicaments : immunothérapie, vaccins à ARN messager, clozapine, hypersensibilité, lupus, sarcoïdose, EGPA, cellules géantes.</li><li>Toxiques : anthracyclines, cocaïne, alcool, phéochromocytome.</li><li>Myocardite récidivante + rehaussement en anneau → génétique (<i>DSP</i>, <i>FLNC</i>).</li><li>Pas de sérologies virales larges ; sérologies ciblées si elles changent le traitement.</li></ul></template>

<template data-pop="pareto-i40-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i40-5,i40-6"></p>
<ul><li>Chronologie : 1–2 semaines après une infection ; 2–4 jours après la 2e dose de vaccin ; 1–3 mois après le début d’une immunothérapie ; 4 premières semaines de clozapine.</li><li>Rechercher : origine latino-américaine, tique, maladie auto-immune, histoire familiale.</li><li>Quatre formes : pseudo-infarctoïde (la plus fréquente), insuffisance cardiaque, arythmique, fulminante.</li><li>Ptosis, diplopie, faiblesse = myosite et myasthénie (immunothérapie).</li><li>Tachycardie disproportionnée à la fièvre = alerte ; examen normal n’exclut pas une forme grave.</li></ul></template>

<template data-pop="pareto-i40-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="i40-7"></p>
<ul><li>Suspicion → ECG, troponine, protéine C réactive, échocardiographie → exclure un SCA → IRM (≤ 2 semaines) → biopsie si haut risque.</li><li>Certain : clinique + IRM ou biopsie ; possible : clinique + ≥ 1 critère ; peu probable : clinique seule.</li><li>Lake Louise 2018 : un critère T2 (œdème) + un critère T1 (T1, volume extracellulaire, rehaussement non ischémique).</li><li>Biopsie : examen de référence histologique ; recommandée (I, C) dans l’insuffisance cardiaque aiguë, le choc, la suspicion de forme spécifique, l’absence de réponse ; élargie à des patients sélectionnés si arythmie maligne, bloc, FEVG &lt; 40 %, rehaussement étendu ; Dallas + immunohistochimie + PCR virale obligatoire avant immunosuppression.</li><li>Différentiels : SCA, dissection coronaire, Tako-tsubo, cardiomyopathie génétique, péricardite.</li></ul></template>

<template data-pop="pareto-i40-fulm" data-title="Pareto — Urgences et myocardite fulminante">
<p class="ratio" data-cover="i40-8"></p>
<ul><li>Fulminante = choc ; ventricule non dilaté, parois épaisses, FEVG effondrée.</li><li>Pronostic plus sombre que la forme non fulminante (≈ 28 % contre 2 % de décès ou greffe à 60 jours).</li><li>Transfert précoce en centre expert ; inotropes ; assistance temporaire (ECMO veino-artérielle ± Impella) au stade SCAI C–D ; biopsie rapide.</li><li>Corticoïdes à forte dose si non infectieuse (IIa).</li><li>Défibrillateur portable (IIa) ; défibrillateur implantable en phase aiguë seulement IIb.</li><li>Bloc complet : stimulation temporaire ; penser Lyme, sarcoïdose, cellules géantes.</li></ul></template>

<template data-pop="pareto-i40-pec" data-title="Pareto — Prise en charge générale">
<p class="ratio" data-cover="i40-9"></p>
<ul><li>Hospitalisation de toute myocardite aiguë ; l’intensité de la surveillance suit le risque (faible, intermédiaire, élevé).</li><li>Traitement de l’insuffisance cardiaque ≥ 6 mois jusqu’à la récupération (IIa) ; bêtabloquant ≥ 6 mois même à FEVG normale (IIa).</li><li>Douleur : paracétamol, AINS à faible dose (IIa) si pas d’insuffisance cardiaque ; colchicine si péricardite.</li><li>Immunosuppression seulement pour une forme spécifique ou virus négative ; pas d’immunoglobulines (IMAC) ni d’antiviraux en routine.</li><li>Restriction d’effort ≥ 1 mois ; IRM de contrôle ≤ 6 mois (I).</li></ul></template>

<template data-pop="pareto-i40-viral" data-title="Pareto — Myocardites virales et post-virales">
<p class="ratio" data-cover="i40-10"></p>
<ul><li>Forme la plus fréquente ; guérison habituelle si FEVG conservée.</li><li>Parvovirus B19 : fréquent, souvent témoin à faible charge.</li><li>SARS-CoV-2 : myocardite plus fréquente après l’infection qu’après le vaccin.</li><li>Cardiomyopathie inflammatoire virus négative : prednisone + azathioprine (TIMIC ; IIb).</li><li>Lyme : bloc fluctuant, ceftriaxone, pas de stimulateur définitif d’emblée.</li></ul></template>

<template data-pop="pareto-i40-spec" data-title="Pareto — Cellules géantes, éosinophiles, sarcoïdose">
<p class="ratio" data-cover="i40-11,i40-12"></p>
<ul><li>BACH : bloc, arythmie ventriculaire, choc ou insuffisance cardiaque rapide, histoire auto-immune ou hyperéosinophilie → biopsie.</li><li>Cellules géantes : nécrose + cellules géantes sans granulome ; immunosuppression combinée (I) ≥ 1 an ; survie médiane 5,5 mois sans traitement ; greffe.</li><li>Éosinophiles : médicaments (clozapine), EGPA, syndrome hyperéosinophilique (<i>FIP1L1-PDGFRA</i> → imatinib), parasites ; éosinophilie parfois absente ; stades nécrose → thrombose → fibrose ; EGPA cardiaque : corticoïdes + cyclophosphamide ou rituximab, mépolizumab en entretien.</li><li>Ivermectine avant les corticoïdes si exposition tropicale.</li><li>Sarcoïdose : bloc chez un adulte &lt; 60 ans ; septum basal ; TEP au FDG ; biopsie extracardiaque ; corticoïdes + méthotrexate ; défibrillateur.</li></ul></template>

<template data-pop="pareto-i40-icivacc" data-title="Pareto — Immunothérapie et vaccins">
<p class="ratio" data-cover="i40-13,i40-14"></p>
<ul><li>Immunothérapie : délai médian ≈ 1 mois ; association anti-PD-1 + anti-CTLA-4 = risque ↑ ; « triple M ».</li><li>Diagnostic : troponine + 1 critère majeur (IRM) ou 2 mineurs ; troponine I plus spécifique que T en cas de myosite.</li><li>Arrêt de l’immunothérapie ; méthylprednisolone 500–1000 mg/jour 3–5 jours puis prednisone 1 mg/kg (I, ESC 2022) ; seconde ligne : abatacept, mycophénolate, échanges plasmatiques (IIa).</li><li>Vaccin ARN messager : homme jeune, 2–4 jours après la 2e dose, évolution favorable ; déclaration Swissmedic ; pas de nouvelle dose.</li></ul></template>

<template data-pop="pareto-i40-chagas" data-title="Pareto — Maladie de Chagas">
<p class="ratio" data-cover="i40-15"></p>
<ul><li><i>Trypanosoma cruzi</i> ; en Suisse : transmission congénitale, transfusionnelle, greffe ; migrants latino-américains (Bolivie).</li><li>Aiguë → indéterminée (majorité, à vie) → cardiomyopathie chez 20–30 % après 10–30 ans.</li><li>Bloc de branche droit + hémibloc antérieur gauche ; anévrisme apical ; tachycardie ventriculaire ; mort subite ; embolies.</li><li>Diagnostic chronique : deux sérologies de techniques différentes.</li><li>Benznidazole 5 mg/kg/jour 60 jours, sans dépasser 300 mg/jour : aiguë, congénitale, enfant, femme en âge de procréer, adulte ≤ 50 ans sans atteinte avancée ; BENEFIT négatif dans la cardiomyopathie établie.</li><li>Dépistage : femmes enceintes à risque, nouveau-nés, donneurs ; score de Rassi.</li></ul></template>

<template data-pop="pareto-i40-suivi" data-title="Pareto — Suivi, pronostic et sport">
<p class="ratio" data-cover="i40-16"></p>
<ul><li>6 premiers mois : marqueurs, ECG, Holter, échocardiographie, IRM (I) ; forme non compliquée : 6, 12, 24 mois.</li><li>Mauvais pronostic : dysfonction biventriculaire, rehaussement persistant septal sans œdème, cellules géantes.</li><li>Sport : restriction d’au moins 1 mois, puis reprise individualisée si le patient est asymptomatique, que les marqueurs sont normaux, la FEVG normale et qu’il n’y a pas d’arythmie (ESC 2025 ; la règle ESC 2020 de 3 à 6 mois est remplacée).</li><li>Sevrage du traitement de l’insuffisance cardiaque possible après ≥ 6 mois si FEVG normale, par étapes.</li><li>Génétique IIa : famille, arythmie, anneau ou septal, dysfonction persistante, récidive, troponine prolongée.</li></ul></template>

<template data-pop="pareto-i40-partic" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i40-17"></p>
<ul><li>Grossesse : penser cardiomyopathie du péripartum ; IRM sans gadolinium ; pas d’IEC, ARNI, ARM, iSGLT2, mycophénolate, méthotrexate, benznidazole.</li><li>Sujet âgé sous immunothérapie : myocardite de l’immunothérapie d’abord.</li><li>Insuffisance rénale : cinétique de la troponine ; gadolinium macrocyclique.</li><li>Transaminases élevées sous immunothérapie : souvent musculaires (créatine kinase).</li><li>Immunodéprimé : réactivation de Chagas, toxoplasmose, cytomégalovirus.</li></ul></template>

<template data-pop="pareto-i40-bio" data-title="Pareto — Biologie">
<p class="ratio" data-cover="i40-e-2"></p>
<ul><li>Troponine hypersensible : &gt; 99e percentile ; persistance = inflammation active ; troponine T élevée dans la myosite, troponine I plus cardiaque.</li><li>Éosinophiles &gt; 0,5 ; hyperéosinophilie ≥ 1,5 × 10⁹/L ; à répéter.</li><li>Créatine kinase : myosite (immunothérapie).</li><li>Sérologies ciblées : Lyme, <i>Trypanosoma cruzi</i> (deux techniques), VIH ; pas de sérologies virales larges.</li></ul></template>

<template data-pop="pareto-i40-irm" data-title="Pareto — ECG, échocardiographie et IRM">
<p class="ratio" data-cover="i40-e-3,i40-e-4,i40-e-5"></p>
<ul><li>ECG : sus-décalage inférolatéral ; QRS ≥ 120 ms = mauvais pronostic ; bloc = Lyme, sarcoïdose, cellules géantes ; bloc de branche droit + hémibloc antérieur gauche = Chagas.</li><li>Échocardiographie : FEVG souvent normale ; forme fulminante = non dilatée, parois épaisses ; TAPSE &lt; 17 mm = mauvais pronostic ; thrombus.</li><li>IRM : T2 + T1 ; rehaussement sous-épicardique inférolatéral (typique), septal, en anneau (génétique), en plages (sarcoïdose) ; ≤ 2 semaines ; contrôle ≤ 6 mois.</li><li>IRM négative n’exclut pas une forme grave : biopsie si haut risque.</li></ul></template>

<template data-pop="pareto-i40-bem" data-title="Pareto — Biopsie, TEP et coronaires">
<p class="ratio" data-cover="i40-e-6"></p>
<ul><li>Biopsie : référence histologique ; ≥ 3 fragments ; biventriculaire ou guidée ; précoce.</li><li>Immunohistochimie : &gt; 14 leucocytes/mm² dont ≤ 4 monocytes, ≥ 7 lymphocytes T CD3/mm².</li><li>Lymphocytaire + virus : soutien ; sans virus : immunosuppression discutable ; éosinophiles, cellules géantes, granulomes : traitement spécifique.</li><li>TEP au FDG : sarcoïdose, préparation stricte.</li><li>Coronarographie si sus-décalage et probabilité élevée ; coroscanner si jeune et stable.</li></ul></template>

<template data-pop="pareto-i40-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i40-e-1,i40-e-2,i40-e-3,i40-e-4,i40-e-5,i40-e-6"></p>
<ul><li>Troponine, protéine C réactive, éosinophiles, ECG, échocardiographie : pour tous.</li><li>Exclure un SCA selon la probabilité.</li><li>IRM : référence non invasive (I) ; Lake Louise T2 + T1.</li><li>Biopsie : référence histologique ; recommandée (I, C) dans l’insuffisance cardiaque aiguë, le choc, la suspicion de forme spécifique et l’absence de réponse ; PCR virale obligatoire avant toute immunosuppression.</li><li>Troponine persistante = inflammation active ; troponine I plus cardiaque que T en cas de myosite.</li><li>ECG : QRS ≥ 120 ms = mauvais pronostic ; bloc = Lyme, sarcoïdose, cellules géantes ; bloc de branche droit + hémibloc antérieur gauche = Chagas.</li><li>Échocardiographie : forme fulminante = ventricule non dilaté, parois épaisses ; atteinte droite = mauvais pronostic.</li><li>IRM ≤ 2 semaines ; contrôle ≤ 6 mois ; IRM négative n’exclut pas une forme grave.</li><li>Configurations : créatine kinase ↑ (immunothérapie), éosinophiles (hypersensibilité, EGPA, hyperéosinophilie), deux sérologies (Chagas), bloc + sérologie (Lyme).</li></ul></template>

<template data-pop="pareto-i40-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i40-sa,i40-sh,i40-sp,i40-si,i40-sm,i40-sg"></p>
<ul><li>Ischémie = sous-endocarde ; myocardite = sous-épicarde ou couche moyenne.</li><li>Septum basal (His) → bloc dans la sarcoïdose et les cellules géantes ; branche droite et division antérieure gauche fines → ECG chagasique ; apex fin → anévrisme chagasique.</li><li>Dallas : infiltrat + nécrose ; immunohistochimie : CD3, CD68 ; fibrose = substrat de réentrée.</li><li>Dysfonction aiguë largement réversible : cytokines → synthase inductible du monoxyde d’azote → désensibilisation au calcium ; œdème → rigidité ; le rehaussement tardif prédit la récupération mieux que la FEVG.</li><li>Troponine I cardiaque spécifique ; troponine T réexprimée par le muscle squelettique malade ; pool cytosolique rapide + pool structural lent ; myocardite = plateau bas et prolongé, persistance = inflammation active.</li><li>PD-1/PD-L1 et CTLA-4 = signaux inhibiteurs ; leur blocage → myocardite ; abatacept rétablit l’inhibition.</li><li>Récepteur CAR (Coxsackie, adénovirus), protéase 2A → dystrophine ; B19 endothélial ; Lyme → nœud auriculoventriculaire.</li><li><i>Trypanosoma cruzi</i> : trypomastigote (sang, phase aiguë : microscope, PCR) ; amastigote intracellulaire (phase chronique : sérologie).</li><li>Génétique : <i>DSP</i>, <i>FLNC</i>, <i>TTN</i> → risque rythmique, sport, famille.</li></ul></template>

<template data-pop="pareto-i40-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i40-p-1,i40-p-2,i40-p-3,i40-p-4,i40-p-5,i40-p-6"></p>
<ul><li>Soutien pour tous ; traitement spécifique selon la cause ou l’histologie.</li><li>Méthylprednisolone 500–1000 mg/jour 3–5 jours ; prednisone 1 mg/kg/jour ; TIMIC : prednisone + azathioprine 2 mg/kg/jour 6 mois.</li><li>Cellules géantes : méthylprednisolone 500–1000 mg/jour 3 jours puis prednisone 1 mg/kg/jour + tacrolimus (résiduelle 6–10 ng/mL) ou ciclosporine + mycophénolate 1000 mg × 2/jour ou azathioprine ± globulines antithymocytaires, ≥ 12 mois.</li><li>Immunothérapie corticorésistante : abatacept 500 mg toutes les 2 semaines ; mycophénolate.</li><li>Benznidazole 5 mg/kg/jour (≤ 300 mg/jour) 60 jours ; ceftriaxone 2 g/jour puis doxycycline (Lyme, 14–21 jours) ; ivermectine 200 µg/kg.</li><li>Interactions : azathioprine + allopurinol ; inhibiteurs de la calcineurine + CYP3A4 ; corticoïdes + strongyloïdose.</li><li>À éviter : AINS forte dose si dysfonction, digoxine en phase aiguë, immunoglobulines, immunosuppression d’une myocardite virale active.</li></ul></template>
