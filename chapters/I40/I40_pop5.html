
<!-- ===== FENÊTRES I40 : monographies ===== -->
<template data-pop="i40-d-cortico" data-title="Corticoïdes dans la myocardite (méthylprednisolone, prednisone)">
<div class="lab">Mécanisme</div><p>Liaison au récepteur des glucocorticoïdes : inhibition de la transcription des cytokines pro-inflammatoires (voie du facteur nucléaire kappa B), apoptose des lymphocytes, baisse du recrutement leucocytaire. Effet rapide aux fortes doses intraveineuses (« pulses »).</p>
<div class="lab">Preuves</div><p>Pas d’essai randomisé dans la myocardite de l’immunothérapie : recommandation fondée sur des registres (ESC 2022, classe I, niveau C), qui associent une initiation précoce et à forte dose à un meilleur pronostic. Cardiomyopathie inflammatoire virus négative : essai TIMIC (prednisone et azathioprine). Myocardite à cellules géantes, à éosinophiles, sarcoïdose : séries de cas et registres.</p>
<div class="lab">Posologie</div><p>Formes graves : méthylprednisolone 500–1000 mg/jour par voie intraveineuse pendant 3 à 5 jours, puis relais par prednisone 1 mg/kg/jour lorsque la troponine baisse et que l’état rythmique et hémodynamique s’améliore ; décroissance sur au moins 4 à 6 semaines sous immunothérapie (ESC 2022), sur plusieurs mois dans la myocardite à cellules géantes. Prophylaxie de la pneumocystose (triméthoprime-sulfaméthoxazole) pendant la corticothérapie prolongée à forte dose. Cardiomyopathie inflammatoire : prednisone 1 mg/kg/jour pendant 4 semaines puis 0,33 mg/kg/jour pendant 5 mois (TIMIC).</p>
<div class="lab">Effets indésirables</div><p>Hyperglycémie, hypertension, rétention hydrosodée, hypokaliémie, infections (dont pneumocystose), troubles de l’humeur et du sommeil, ostéoporose, myopathie, insuffisance surrénalienne à l’arrêt brutal.</p>
<div class="lab">Contre-indications</div><p>Myocardite virale active prouvée (risque de réplication accrue) ; infection non contrôlée ; strongyloïdose non traitée.</p>
<div class="lab">Surveillance</div><p>Glycémie, pression artérielle, kaliémie, signes infectieux ; troponine pour guider la décroissance ; calcium et vitamine D ; protection gastrique si facteur de risque.</p></template>

<template data-pop="i40-d-aza" data-title="Azathioprine">
<div class="lab">Mécanisme</div><p>Promédicament converti en 6-mercaptopurine, puis en nucléotides thioguaniniques qui bloquent la synthèse des purines et la prolifération des lymphocytes. Effet lent : plusieurs semaines.</p>
<div class="lab">Preuves</div><p>Essai TIMIC (2009) : amélioration de la FEVG sous prednisone et azathioprine dans la cardiomyopathie inflammatoire virus négative. Utilisée aussi dans les schémas de la myocardite à cellules géantes.</p>
<div class="lab">Posologie</div><p>2 mg/kg/jour (TIMIC), adaptée à l’activité de la TPMT et à l’hémogramme.</p>
<div class="lab">Effets indésirables</div><p>Leucopénie et aplasie, hépatotoxicité, pancréatite, nausées, infections ; risque accru de cancers cutanés et de lymphomes au long cours.</p>
<div class="lab">Contre-indications</div><p>Activité nulle de la TPMT ; association à l’allopurinol ou au fébuxostat sans réduction de dose ; vaccins vivants.</p>
<div class="lab">Surveillance</div><p>Hémogramme et transaminases toutes les 1 à 2 semaines au début, puis tous les 1 à 3 mois ; protection solaire. Utilisable pendant la grossesse si nécessaire, avec avis spécialisé.</p></template>

<template data-pop="i40-d-cni" data-title="Inhibiteurs de la calcineurine (ciclosporine, tacrolimus)">
<div class="lab">Mécanisme</div><p>Liaison à une immunophiline (cyclophiline pour la ciclosporine, protéine de liaison du tacrolimus pour celui-ci) ; le complexe inhibe la calcineurine, qui ne peut plus activer le facteur de transcription de l’interleukine 2. Les lymphocytes T ne prolifèrent plus.</p>
<div class="lab">Place</div><p>Pilier de l’immunosuppression combinée de la myocardite à cellules géantes (classe I, ESC 2025 pour l’immunosuppression combinée), et de la transplantation cardiaque.</p>
<div class="lab">Posologie</div><p>Ajustée à la concentration résiduelle, selon le protocole du centre expert. Exemple publié dans la myocardite à cellules géantes : tacrolimus avec une concentration résiduelle cible de 6–8 à 8–10 ng/mL, associé au mycophénolate 1000 mg × 2/jour (deux cas, <i>European Heart Journal – Case Reports</i> 2024). La ciclosporine est une alternative, avec des cibles fixées par le protocole de transplantation du centre. Durée totale d’au moins 12 mois.</p>
<div class="lab">Effets indésirables</div><p>Néphrotoxicité, hypertension, hyperkaliémie, hypomagnésémie, tremblement, neurotoxicité, diabète (tacrolimus), hypertrichose et hyperplasie gingivale (ciclosporine), infections, cancers.</p>
<div class="lab">Interactions</div><p>Métabolisme par le CYP3A4 et transport par la glycoprotéine P : hausse des taux avec la clarithromycine, les azolés, le diltiazem, le vérapamil, l’amiodarone, le pamplemousse ; baisse avec la rifampicine et les anticonvulsivants inducteurs. Rhabdomyolyse avec la simvastatine.</p>
<div class="lab">Surveillance</div><p>Concentration résiduelle, créatinine, kaliémie, magnésémie, pression artérielle, glycémie.</p></template>

<template data-pop="i40-d-atg" data-title="Globulines antithymocytaires">
<div class="lab">Mécanisme</div><p>Anticorps polyclonaux produits chez le lapin ou le cheval contre des lymphocytes T humains : déplétion rapide et profonde des lymphocytes T circulants.</p>
<div class="lab">Place</div><p>Induction dans les formes graves de myocardite à cellules géantes, selon le protocole du centre (exemple publié : globulines antithymocytaires de lapin 100 mg/jour pendant 3 jours, <i>European Heart Journal – Case Reports</i> 2024 ; d’autres centres ajustent la dose au nombre de lymphocytes T CD3 circulants) ; prévention et traitement du rejet en transplantation.</p>
<div class="lab">Effets indésirables</div><p>Syndrome de libération de cytokines lors des premières perfusions (fièvre, frissons, hypotension) ; maladie sérique ; thrombopénie et leucopénie ; infections, notamment à cytomégalovirus.</p>
<div class="lab">Précautions</div><p>Prémédication (corticoïde, antihistaminique, paracétamol) ; perfusion lente par voie centrale ; surveillance de l’hémogramme et du nombre de lymphocytes T.</p></template>

<template data-pop="i40-d-2l" data-title="Immunosuppression de seconde ligne de la myocardite sous immunothérapie">
<div class="lab">Indication (ESC 2022)</div><p>Myocardite corticorésistante : pas de baisse de la troponine, ou aggravation clinique, rythmique ou de la FEVG, après 3 à 5 jours de méthylprednisolone à forte dose (classe IIa).</p>
<div class="lab">Posologies publiées</div><p>Abatacept 500 mg par voie intraveineuse toutes les 2 semaines, 5 doses dans la série princeps (Salem et coll., <i>New England Journal of Medicine</i> 2019). Mycophénolate mofétil 500–1000 mg × 2/jour par voie orale (posologie usuelle de l’information professionnelle en transplantation).</p>
<div class="lab">Options</div><p><b>Abatacept</b> : protéine de fusion CTLA-4-immunoglobuline, qui bloque CD80 et CD86 et rétablit l’inhibition de l’activation des lymphocytes T. <b>Mycophénolate mofétil</b> : antiprolifératif. <b>Échanges plasmatiques</b> ou <b>immunoglobulines intraveineuses</b>, surtout en cas de composante myasthénique. <b>Autres</b> : tocilizumab (anti-récepteur de l’interleukine 6), alemtuzumab, globulines antithymocytaires, ruxolitinib (inhibiteur des Janus kinases) dans certaines séries.</p>
<div class="lab">Preuves</div><p>Séries de cas et registres ; aucun essai randomisé publié ne fixe encore le choix. Certains centres introduisent l’abatacept d’emblée dans les formes fulminantes.</p>
<div class="lab">Précautions</div><p>Risque infectieux cumulatif ; interaction des échanges plasmatiques avec les anticorps (réadministrer après la séance) ; mycophénolate tératogène.</p></template>

<template data-pop="i40-d-bnz" data-title="Benznidazole et nifurtimox">
<div class="lab">Mécanisme</div><p>Dérivés nitrés (nitroimidazole pour le benznidazole, nitrofurane pour le nifurtimox) activés par des nitroréductases du parasite ; production de radicaux et de métabolites toxiques pour <i>Trypanosoma cruzi</i>.</p>
<div class="lab">Preuves</div><p>Efficaces en phase aiguë, dans la forme congénitale et chez l’enfant (taux de guérison sérologique élevés). Chez l’adulte en phase chronique, bénéfice clinique incertain. L’essai BENEFIT (2015) n’a pas réduit la progression dans la cardiomyopathie établie, malgré une baisse de la charge parasitaire.</p>
<div class="lab">Indications</div><p>Phase aiguë, forme congénitale, réactivation, enfant, femme en âge de procréer (prévention de la transmission congénitale) ; proposé à l’adulte jusqu’à environ 50 ans sans cardiomyopathie avancée.</p>
<div class="lab">Posologie</div><p>Benznidazole 5 mg/kg/jour en 2 prises pendant 60 jours, sans dépasser 300 mg/jour ; au-delà de 60 kg, la dose quotidienne est plafonnée et la durée prolongée pour atteindre la dose totale (OMS). Nifurtimox 8–10 mg/kg/jour en 3 prises pendant 60 à 90 jours chez l’adulte.</p>
<div class="lab">Effets indésirables</div><p>Benznidazole : éruption cutanée fréquente dans les premières semaines, parfois grave ; neuropathie périphérique ; cytopénies. Nifurtimox : anorexie, perte de poids, nausées, troubles neuropsychiques. Arrêt prématuré fréquent chez l’adulte.</p>
<div class="lab">Contre-indications</div><p>Grossesse ; insuffisance hépatique ou rénale sévère. Contraception pendant le traitement.</p>
<div class="lab">En Suisse</div><p>Médicaments non disponibles comme spécialités courantes ; prescription et accès organisés par un service d’infectiologie ou de médecine tropicale. La guérison se juge sur la négativation sérologique, qui peut prendre des années chez l’adulte.</p></template>

<template data-pop="i40-d-eos" data-title="Traitements ciblés des myocardites à éosinophiles">
<div class="lab">Imatinib</div><p>Inhibiteur de tyrosine kinase ; bloque la kinase de fusion <i>FIP1L1-PDGFRA</i> du syndrome hyperéosinophilique myéloprolifératif. Réponse rapide à faible dose (100 mg/jour dans les séries hématologiques). Toxicité cardiaque rare mais décrite en début de traitement chez les patients avec atteinte cardiaque : certains centres associent des corticoïdes les premiers jours.</p>
<div class="lab">Mépolizumab</div><p>Anticorps monoclonal anti-interleukine 5, cytokine de la maturation et de la survie des éosinophiles. Autorisé dans la granulomatose éosinophilique avec polyangéite (300 mg par voie sous-cutanée toutes les 4 semaines, essai MIRRA) et dans le syndrome hyperéosinophilique ; statut suisse selon compendium.ch.</p>
<div class="lab">Cyclophosphamide ou rituximab</div><p>Induction de l’EGPA avec atteinte cardiaque, forme menaçant un organe : corticoïdes à forte dose associés au cyclophosphamide (agent alkylant) ou au rituximab (anticorps anti-CD20), selon l’EULAR 2022. Le mépolizumab sert ensuite à l’entretien et à l’épargne cortisonique.</p>
<div class="lab">Ivermectine</div><p>Avant ou avec les corticoïdes si exposition tropicale (strongyloïdose) : 200 µg/kg/jour pendant 1 à 2 jours.</p></template>
