<section class="ilot" id="i40-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un étudiant de 23 ans se présente aux urgences un dimanche matin. Il décrit une douleur thoracique rétrosternale constrictive, apparue dans la nuit. Dix jours plus tôt, il a eu de la fièvre, des courbatures et une diarrhée pendant trois jours. L’ECG montre un sus-décalage du segment ST en inférieur et en latéral. La troponine T hypersensible vaut 850 ng/L. La question qui structure tout le chapitre est la suivante : <b>ce muscle cardiaque est-il enflammé, par quoi, avec quelle gravité, et faut-il un traitement spécifique en plus de la surveillance ?</b></p>
<p>La myocardite est une maladie trompeuse. Elle imite l’infarctus chez le jeune, l’insuffisance cardiaque chez l’adulte et la mort subite chez le sportif. Dans la majorité des cas, elle guérit seule. Dans une minorité, elle tue en quelques jours ou laisse une cardiomyopathie dilatée. Tout l’enjeu est de reconnaître tôt la minorité grave, parce que certaines formes (à cellules géantes, à éosinophiles, liées aux inhibiteurs de points de contrôle immunitaire, sarcoïdose) relèvent d’un traitement immunosuppresseur urgent.</p>
<p>À la fin de ce chapitre, le médecin assistant sait appliquer les critères diagnostiques de la Société européenne de cardiologie (ESC) 2025, prescrire et lire une IRM cardiaque selon les critères de Lake Louise, poser l’indication d’une biopsie endomyocardique et en interpréter le résultat, stratifier le risque, conduire la prise en charge d’une myocardite fulminante et organiser le suivi et la reprise du sport. Il connaît les formes spécifiques du périmètre, y compris la maladie de Chagas, présente en Suisse chez les migrants d’Amérique latine. La péricardite est traitée dans le chapitre I30 et les cardiomyopathies dans le chapitre I42 ; ils ne sont pas repris ici.</p>
<div class="key"><b>Prérequis.</b> Les <button class="w" data-k="i40-phases">trois phases de la myocardite (virale, immunitaire, remodelage)</button>, le <button class="w" data-k="i40-mimetisme">mimétisme moléculaire (auto-immunité anti-myosine)</button> et la <button class="w" data-k="i40-oedeme">lésion myocytaire aiguë (nécrose, œdème, troponine)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i40-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>La <b>myocardite</b> est une maladie inflammatoire du myocarde. Historiquement, elle se définissait par l’histologie seule : un infiltrat inflammatoire associé à une nécrose des cardiomyocytes non ischémique. Cette définition reste la référence, mais la biopsie n’est faite que chez une minorité de patients. L’ESC 2025 admet donc aussi un diagnostic fondé sur une présentation clinique compatible et une IRM cardiaque démonstrative. L’IRM détecte sans geste invasif l’œdème et la nécrose qui traduisent l’inflammation, alors que la biopsie peut manquer des lésions réparties en foyers.</p>
<h3>1.1 Le cadre commun de l’ESC 2025</h3>
<p>Les recommandations de l’ESC 2025 sont les premières consacrées ensemble aux myocardites et aux péricardites. Elles introduisent le <button class="w" data-k="i30-imps">syndrome inflammatoire myopéricardique (IMPS, spectre de l’atteinte)</button>. La péricardite pure et la myocardite pure en sont les deux extrémités. Entre elles se trouve la <button class="w" data-k="i30-myoperi">myopéricardite (péricardite avec troponine élevée)</button>. En pratique, un patient dont l’atteinte myocardique domine relève de ce chapitre ; un patient dont la péricardite domine relève du chapitre I30.</p>
<h3>1.2 Classification temporelle</h3>
<table class="t"><tr><th>Forme (ESC 2025, tableau 3)</th><th>Définition</th><th>Exemple</th></tr>
<tr><td><b>Aiguë</b></td><td>Durée des symptômes ≤ 4 semaines</td><td>Douleur thoracique 10 jours après une gastro-entérite</td></tr>
<tr><td><b>Subaiguë</b></td><td>Durée des symptômes &gt; 4 semaines et ≤ 3 mois (myocardite subaiguë ou persistante)</td><td>Dyspnée progressive depuis 2 mois, œdème persistant à l’IRM</td></tr>
<tr><td><b>Chronique</b></td><td>Durée des symptômes &gt; 3 mois ; inflammation persistante de bas grade avec remodelage</td><td>Dilatation ventriculaire avec infiltrat lymphocytaire à la biopsie</td></tr></table>
<p>L’ESC 2025 nomme <button class="w" data-k="i40-cmi">cardiomyopathie inflammatoire (myocardite chronique avec dysfonction)</button> la myocardite chronique associée à une dysfonction ventriculaire, avec un phénotype hypokinétique, dilaté ou non, et un substrat arythmogène possible.</p>
<h3>1.3 Classification selon la gravité</h3>
<div class="two">
<div class="card"><h4>Non compliquée</h4><p>Douleur thoracique, troponine élevée, FEVG conservée, pas d’arythmie ventriculaire ni de trouble de conduction de haut degré. C’est la présentation la plus fréquente, environ 75 % des cas non sélectionnés. Son pronostic est bon, car la nécrose reste limitée et les deux ventricules gardent leur fonction : dans le registre lombard, aucun décès cardiaque ni aucune transplantation n’est survenu à 5 ans dans ce groupe.</p></div>
<div class="card"><h4>Compliquée</h4><p>FEVG &lt; 50 %, insuffisance cardiaque aiguë, arythmie ventriculaire soutenue ou bloc auriculoventriculaire de haut degré (ESC 2025). Ces critères signalent une atteinte étendue du muscle ou du tissu de conduction. Dans le registre lombard, décès cardiaque ou transplantation touchaient 14,7 % des formes compliquées à 5 ans, contre 0 % des autres.</p></div>
<div class="card"><h4>Fulminante</h4><p>Présentation en choc cardiogénique, qui exige des inotropes ou une assistance circulatoire mécanique temporaire. Elle concerne 3 à 9 % des myocardites. Le pronostic immédiat est grave, car le débit s’effondre avant que l’inflammation ait le temps de régresser.</p></div>
<div class="card"><h4>Cardiomyopathie inflammatoire</h4><p>Forme chronique avec dysfonction ventriculaire. Elle pose la question d’une immunosuppression si la biopsie ne montre aucun virus.</p></div></div>
<h3>1.4 Classification histologique et étiologique</h3>
<p>Le type histologique change le traitement, car chaque type correspond à une cellule effectrice et à une réponse aux immunosuppresseurs différentes. Par exemple, la corticothérapie seule ne prolonge pas la survie sans transplantation dans la myocardite à cellules géantes, qui exige une association d’immunosuppresseurs. On distingue les myocardites <b>lymphocytaires</b> (virales, post-virales, auto-immunes, médicamenteuses), <b>à éosinophiles</b>, <b>à cellules géantes</b> et <b>granulomateuses</b> (sarcoïdose). L’étiologie peut être infectieuse, immunitaire ou toxique ; elle est détaillée dans l’îlot 4.</p>
<div class="trap"><span class="k">Piège</span>Une troponine élevée avec des coronaires normales ne signifie pas « myocardite ». Un diagnostic de travail d’<button class="w" data-k="i21-minoca">infarctus à coronaires non obstructives (MINOCA, bilan en étapes)</button> suppose les critères d’un infarctus aigu, dont un argument d’ischémie, avec des coronaires non obstructives. Une troponine élevée seule signale une lésion myocardique, sans en établir le mécanisme. La myocardite et le Tako-tsubo sont des diagnostics différentiels qui excluent le MINOCA du diagnostic final ; une embolie coronaire, un spasme ou une dissection peuvent en être des mécanismes ischémiques. L’IRM tranche dans la plupart des cas. L’ischémie atteint d’abord le sous-endocarde, le plus mal perfusé, et suit un territoire coronaire ; la myocardite rehausse plutôt le sous-épicarde ou la partie moyenne de la paroi, sans respecter les territoires coronaires.</div>
</section>

<section class="ilot" id="i40-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>L’incidence de la myocardite est difficile à mesurer, car beaucoup de formes sont pauci-symptomatiques et la biopsie est rare. L’ESC 2025 retient une incidence d’environ 6,3 à 8,6 cas pour 100 000 habitants par année. La maladie touche surtout l’adulte jeune, avec un âge médian de 20 à 40 ans. Les hommes représentent 75 à 84 % des myocardites aiguës dans les registres cités par l’ESC 2025. Chez la souris infectée par le virus Coxsackie B3, la testostérone amplifie la voie des récepteurs de type Toll 4 et l’inflammasome, donc la production de cytokines inflammatoires. Ce lien causal n’est démontré que chez l’animal : l’ESC 2025 rappelle que l’excès masculin peut aussi refléter un biais de diagnostic, et il disparaît dans la forme fulminante, qui touche 46 % de femmes.</p>
<p>La myocardite est une cause importante de <button class="w" data-k="i40-arythmies">mort subite du sujet jeune</button>. Selon les séries autopsiques citées par l’ESC 2025, elle explique 1,1 à 12 % des morts subites de l’adulte jeune. La plupart des victimes n’avaient aucun symptôme cardiaque auparavant : seules 5 % présentaient des signes cardiaques pendant l’infection. La mort survient par une arythmie ventriculaire née dans le myocarde enflammé, même lorsque la fonction de pompe est conservée. Une partie des cardiomyopathies dilatées dites idiopathiques est la séquelle d’une myocardite passée inaperçue : l’ESC 2025 attribue environ 10 % des cardiomyopathies dilatées à une myocardite. La fibrose remplace les cardiomyocytes détruits ; les cellules restantes supportent seules la charge, s’allongent, et le ventricule se dilate souvent sans symptôme jusqu’à l’insuffisance cardiaque.</p>
<table class="t"><tr><th>Forme</th><th>Données épidémiologiques principales</th></tr>
<tr><td>Virale et post-virale</td><td>Forme la plus fréquente en Europe ; pic chez l’homme de 20 à 40 ans</td></tr>
<tr><td>Inhibiteurs de points de contrôle immunitaire</td><td>Environ 1 % des patients traités, avec un délai médian de 30 jours. Elle est plus fréquente avec l’association d’un anti-CTLA-4 et d’un anti-PD-1, qui lève deux freins distincts des lymphocytes T. La mortalité atteint 33 % dans la base de pharmacovigilance de l’OMS et jusqu’à 50 % dans les séries publiées.</td></tr>
<tr><td>Vaccin à ARN messager contre le COVID-19</td><td>Rare ; maximum chez l’homme de 16 à 24 ans après la deuxième dose (environ 50 à 100 cas par million de doses dans ce groupe)</td></tr>
<tr><td>Cellules géantes</td><td>Très rare ; adulte d’âge moyen ; associée à une maladie auto-immune dans environ 20 % des cas</td></tr>
<tr><td>Maladie de Chagas</td><td>6 à 7 millions de personnes infectées dans le monde (estimation de l’OMS) ; en Suisse, surtout des migrants d’Amérique latine</td></tr></table>
<p>La Suisse est concernée par la maladie de Chagas. Une étude genevoise publiée en 2010 a dépisté 1 012 migrants latino-américains par deux sérologies : 12,8 % étaient infectés, soit environ un sur huit, et 26,2 % des personnes originaires de Bolivie ; 11,3 % des personnes infectées avaient déjà une atteinte cardiaque. Une revue suisse de 2024 estime à au moins 85 000 le nombre de personnes exposées vivant en Suisse, en comptant les migrants sans statut légal. Le réseau suisse consacré à cette maladie (Swiss Chagas Network) a été créé en mars 2023.</p>
<div class="trap"><span class="k">Lacune documentaire</span>L’incidence suisse de la myocardite n’est publiée par aucun registre national. Les chiffres ci-dessus sont les estimations européennes de l’ESC 2025, une étude de pharmacovigilance publiée pour les vaccins (Oster et coll., <i>JAMA</i> 2022, données de surveillance américaines citées comme observation épidémiologique, non comme recommandation) et les données suisses pour Chagas (Jackson et coll., <i>Public Library of Science Neglected Tropical Diseases</i> 2010 ; Chollet et coll., <i>Swiss Medical Weekly</i> 2024).

<section class="ilot" id="i40-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie explique trois faits cliniques : pourquoi la troponine s’élève, pourquoi le cœur peut récupérer complètement, et pourquoi un traitement immunosuppresseur aide certaines formes et nuit à d’autres. Le modèle de référence est la myocardite virale à entérovirus, décrite en <button class="w" data-k="i40-phases">trois phases successives (virale, immunitaire, remodelage)</button>.</p>
<h3>3.1 Phase 1 : l’agression virale (premiers jours)</h3>
<p>Le virus pénètre dans le cardiomyocyte par un récepteur spécifique. Pour les virus Coxsackie B et les adénovirus, c’est le <button class="w" data-k="i40-car">récepteur CAR (entrée du virus dans le cardiomyocyte)</button>. Le parvovirus B19 infecte plutôt les cellules endothéliales des petits vaisseaux. Il lèse donc le myocarde de façon indirecte, par l’atteinte microvasculaire et l’inflammation ; à faible charge, sa présence dans le tissu traduit le plus souvent une persistance sans rôle causal. Le virus se réplique et détruit directement des cardiomyocytes. L’immunité innée réagit en quelques heures : interférons de type I, cellules tueuses naturelles, macrophages. Cette réponse limite la réplication virale.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> La nécrose myocytaire libère la troponine : c’est pourquoi la troponine s’élève dès les premiers jours, souvent avant toute baisse de la FEVG. L’inflammation aiguë crée un <button class="w" data-k="i40-oedeme">œdème interstitiel (hypersignal T2 à l’IRM)</button> qui épaissit transitoirement les parois. Cela explique l’aspect de ventricule non dilaté à parois épaisses dans la forme fulminante.</div>
<h3>3.2 Phase 2 : la réponse immunitaire adaptative (semaines 1 à 4)</h3>
<p>Les lymphocytes T envahissent le myocarde. Ils éliminent les cellules infectées, mais ils peuvent aussi attaquer des cardiomyocytes sains. Le mécanisme principal est le <button class="w" data-k="i40-mimetisme">mimétisme moléculaire (antigènes viraux proches de la myosine cardiaque)</button> : certaines protéines virales ressemblent à la myosine cardiaque. La nécrose expose en outre des protéines normalement cachées au système immunitaire. Une réponse auto-immune peut alors se prolonger après la disparition du virus : c’est la <b>myocardite post-virale</b>, virus négative à la biopsie.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Dans la phase 1, le virus est présent : un immunosuppresseur risquerait de favoriser sa réplication. Dans la phase 2 sans virus, l’inflammation est auto-immune : un immunosuppresseur peut la réduire. C’est pourquoi l’ESC exige une <button class="w" data-k="i40-pcr">recherche de génome viral dans la biopsie (condition de l’immunosuppression)</button> avant d’immunosupprimer une myocardite lymphocytaire.</div>
<h3>3.3 Phase 3 : guérison ou remodelage (mois suivants)</h3>
<p>Chez la plupart des patients, l’inflammation s’éteint et les cardiomyocytes survivants récupèrent leur fonction. Chez une minorité, l’inflammation persiste ou laisse une fibrose étendue. Le ventricule se dilate et évolue vers une <button class="w" data-k="i40-cmi">cardiomyopathie inflammatoire puis dilatée (définition ESC 2025)</button>. La protéase 2A des entérovirus clive la dystrophine, une protéine du cytosquelette : ce mécanisme relie directement l’infection à la cardiomyopathie dilatée.</p>
<h3>3.4 Mécanismes des formes non virales</h3>
<ul><li><b>Inhibiteurs de points de contrôle immunitaire</b> : levée des signaux inhibiteurs physiologiques des lymphocytes T (PD-1, CTLA-4) ; des clones T dirigés contre la tumeur reconnaissent aussi des antigènes du muscle cardiaque et squelettique.</li>
<li><b>Myocardite à éosinophiles</b> : les granules des éosinophiles libèrent des protéines cytotoxiques (protéine basique majeure, protéine cationique) qui détruisent les cardiomyocytes et favorisent les thromboses endocavitaires. L’endocarde lésé expose une surface thrombogène au sang, qui stagne contre les parois devenues immobiles.</li>
<li><b>Myocardite à cellules géantes</b> : réponse auto-immune médiée par les lymphocytes T, avec des cellules géantes multinucléées d’origine macrophagique et une nécrose étendue.</li>
<li><b>Maladie de Chagas</b> : persistance du parasite dans le myocarde, inflammation chronique, atteinte microvasculaire et dénervation parasympathique.</li></ul>

<section class="ilot" id="i40-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La recherche de la cause n’est pas un exercice académique. Elle décide de trois actions : arrêter un médicament responsable, traiter un agent infectieux curable, ou immunosupprimer une forme auto-immune.</p>
<div class="two">
<div class="card"><h4>Infections virales (les plus fréquentes)</h4><p>Parvovirus B19 et herpèsvirus humain de type 6 (génomes les plus souvent retrouvés dans les biopsies européennes) ; entérovirus (Coxsackie B), adénovirus ; grippe ; SARS-CoV-2 ; virus d’Epstein-Barr, cytomégalovirus ; VIH ; virus de l’hépatite C.</p></div>
<div class="card"><h4>Autres infections</h4><p><button class="w" data-k="i40-lyme">Borréliose de Lyme (cardite, bloc auriculoventriculaire)</button>, endémique en Suisse ; diphtérie chez le non-vacciné, car sa toxine bloque la synthèse des protéines du cardiomyocyte et les anticorps antitoxine induits par le vaccin la neutralisent ; <i>Trypanosoma cruzi</i> (maladie de Chagas) ; toxoplasmose chez l’immunodéprimé, chez qui des kystes tissulaires se réactivent lorsque l’immunité cellulaire s’effondre ; rickettsioses, infections fongiques rares.</p></div>
<div class="card"><h4>Causes immunitaires et médicamenteuses</h4><p>Inhibiteurs de points de contrôle immunitaire ; vaccins à ARN messager ; hypersensibilité médicamenteuse (<button class="w" data-k="i40-clozapine">clozapine (surveillance des 4 premières semaines)</button>, antibiotiques, anticonvulsivants) ; lupus, polymyosite, sclérodermie ; sarcoïdose ; granulomatose éosinophilique avec polyangéite ; myocardite à cellules géantes.</p></div>
<div class="card"><h4>Causes toxiques</h4><p>Anthracyclines, cyclophosphamide à forte dose, cocaïne et amphétamines, alcool en excès, radiothérapie thoracique, envenimations, phéochromocytome (myocardite catécholaminergique).</p></div></div>
<h3>4.1 Facteurs de risque et terrain</h3>
<ul><li><b>Sexe masculin et âge jeune</b> : prédominance nette pour les formes virales et vaccinales.</li>
<li><b>Maladie auto-immune connue</b> : oriente vers une forme auto-immune, à cellules géantes ou granulomateuse. Le terrain auto-immun traduit une perte de tolérance des lymphocytes T, qui peut viser aussi les antigènes du myocarde.</li>
<li><b>Traitement anticancéreux par immunothérapie</b>, surtout une association anti-PD-1 et anti-CTLA-4.</li>
<li><b>Origine ou séjour prolongé en Amérique latine rurale</b> : maladie de Chagas, parfois des décennies plus tard.</li>
<li><b>Prédisposition génétique</b> : des variants de gènes de cardiomyopathie (<i>DSP</i>, desmosomaux, variants tronquants de <i>TTN</i>) favorisent les myocardites récidivantes. Une myocardite récidivante avec un rehaussement tardif en anneau doit faire chercher une cardiomyopathie arythmogène (<button class="w" data-k="i40-genet">génétique de la myocardite (indications de l’analyse)</button>).</li></ul>
<div class="trap"><span class="k">Erreur fréquente</span>Commander une sérologie virale large pour « trouver le virus ». Les anticorps contre les virus cardiotropes sont fréquents dans la population générale et ne prouvent pas l’atteinte du myocarde. L’ESC 2025 les déconseille pour le diagnostic de myocardite (classe III, niveau C), car la sérologie ne concorde avec le génome viral trouvé dans la biopsie que chez environ 4 % des patients. Seule la recherche de génome dans la biopsie a une valeur, et encore avec prudence pour le parvovirus B19. Les sérologies ciblées gardent leur place quand elles changent le traitement : borréliose, <i>Trypanosoma cruzi</i>, VIH, virus de l’hépatite C.</div>

</section>

<section class="ilot" id="i40-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse a deux buts : reconnaître le tableau et chercher la cause. Elle suit l’ordre : terrain et antécédents, symptômes par fréquence, puis chronologie par rapport à l’événement déclenchant.</p>
<h3>5.1 Antécédents et expositions à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i40-atcd-inf">Infection récente (délai, type, contage)</button></li><li><button class="w" data-k="i40-atcd-med">Médicaments, immunothérapie, vaccin récent (chronologie)</button></li><li><button class="w" data-k="i40-atcd-auto">Maladie auto-immune, asthme, éosinophilie (formes spécifiques)</button></li></ul>
<ul><li><button class="w" data-k="i40-atcd-voyage">Origine, voyage, piqûre de tique (Chagas, Lyme)</button></li><li><button class="w" data-k="i40-atcd-fam">Histoire familiale de cardiomyopathie ou de mort subite (prédisposition)</button></li><li>Toxiques : cocaïne, amphétamines, alcool ; sport intense pendant une infection</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i40-s-douleur">Douleur thoracique (pseudo-infarctoïde ou péricarditique)</button></li><li><button class="w" data-k="i40-s-prodrome">Prodromes infectieux (syndrome grippal, digestif)</button></li><li><button class="w" data-k="i40-s-dyspnee">Dyspnée et fatigue (dysfonction ventriculaire)</button></li></ul>
<ul><li><button class="w" data-k="i40-s-palp">Palpitations, lipothymie, syncope (arythmie ou bloc)</button></li><li><button class="w" data-k="i40-s-muscle">Myalgies, faiblesse, ptosis, diplopie (myosite associée)</button></li><li>Symptômes de la maladie causale : éruption, arthralgies, asthme, érythème migrant</li></ul></div>
<p>La chronologie est un argument majeur. Une douleur thoracique qui survient quelques jours à quelques semaines après une infection, souvent deux à quatre selon l’ESC 2025, ou deux à quatre jours après une deuxième dose de vaccin à ARN messager, oriente fortement. Une insuffisance cardiaque qui s’aggrave de semaine en semaine malgré le traitement évoque une forme non virale. Les formes à cellules géantes, à éosinophiles ou sarcoïdosiques entretiennent une destruction immunitaire que le traitement de l’insuffisance cardiaque n’atteint pas. L’ESC 2025 recommande donc la biopsie lorsqu’une insuffisance cardiaque récente ne répond pas au traitement habituel en une à deux semaines et fait suspecter une myocardite à cellules géantes (classe I, niveau C).</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme pseudo-infarctoïde (la plus fréquente)</h4><p>Homme de 25 ans, douleur thoracique après un syndrome grippal, sus-décalage du ST, troponine élevée, FEVG conservée. Les coronaires sont normales. Évolution habituellement favorable.</p></div>
<div class="card"><h4>Forme avec insuffisance cardiaque</h4><p>Femme de 45 ans, dyspnée progressive depuis trois semaines, FEVG à 30 %, ventricule peu dilaté. La question est celle d’une forme spécifique, car les myocardites à cellules géantes et à éosinophiles sont associées de façon indépendante à une mortalité accrue dans ce tableau. Une insuffisance cardiaque aiguë avec une FEVG ≤ 40 % classe la patiente à haut risque, ce qui fait discuter la biopsie.</p></div>
<div class="card"><h4>Forme arythmique</h4><p>Homme de 50 ans, syncope sur bloc auriculoventriculaire complet ou tachycardie ventriculaire, sans cardiopathie connue. Évoque une sarcoïdose, une myocardite à cellules géantes ou une cardite de Lyme, car ces maladies atteignent le tissu de conduction. Dans une série finlandaise, 25 % des adultes de moins de 55 ans avec un bloc auriculoventriculaire inexpliqué avaient l’une des deux premières à la biopsie.</p></div>
<div class="card"><h4>Forme fulminante</h4><p>Adulte jeune, choc cardiogénique en quelques jours après un syndrome viral ; FEVG effondrée, parois épaissies. Urgence vitale. Une récupération complète reste possible, car une grande part de la dysfonction tient à l’œdème et aux cytokines. Elle n’est toutefois pas la règle : à 7 ans, décès cardiaque ou transplantation touchent 47,7 % des formes fulminantes, contre 10,4 % des formes non fulminantes avec dysfonction.</p></div></div>
</section>

<section class="ilot" id="i40-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux complets → anthropométrie → signes ciblés. Il répond à trois questions : le patient est-il instable, y a-t-il une insuffisance cardiaque ou un trouble du rythme, et existe-t-il un indice de la cause ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Aspect général, sueurs, marbrures. <button class="w" data-k="i40-e-tachy">Fréquence cardiaque (tachycardie disproportionnée à la fièvre)</button>, pression artérielle aux deux bras, fréquence respiratoire, saturation, température. Poids et taille pour les posologies des immunosuppresseurs et des antiparasitaires, qui se calculent en mg/kg.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Insuffisance cardiaque et bas débit</b><ul><li><button class="w" data-k="stevenson">Profil hémodynamique (chaud/froid, humide/sec)</button></li><li><button class="w" data-k="e-jugulaire">Turgescence jugulaire et reflux hépato-jugulaire (mesure)</button></li><li><button class="w" data-k="e-b3">Troisième bruit B3 (galop protodiastolique)</button></li><li><button class="w" data-k="e-crepitants">Crépitants bilatéraux (technique et valeur)</button></li></ul></div>
<div><b>Atteinte péricardique</b><ul><li><button class="w" data-k="i30-e-frott">Frottement péricardique (technique)</button></li><li>Assourdissement des bruits si épanchement</li><li><button class="w" data-k="i30-pp">Pouls paradoxal (tamponnade)</button></li></ul></div>
<div><b>Rythme et conduction</b><ul><li>Pouls irrégulier (extrasystoles, arythmie)</li><li>Bradycardie régulière lente (bloc auriculoventriculaire complet)</li><li>Ondes « en canon » jugulaires (dissociation auriculoventriculaire)</li></ul></div>
<div><b>Indices étiologiques</b><ul><li><button class="w" data-k="i40-e-extra">Signes extracardiaques orientant la cause (peau, muscles, ganglions)</button></li><li>Faiblesse musculaire proximale, ptosis (immunothérapie)</li><li>Érythème migrant (Lyme) ; signe de Romaña (Chagas aigu)</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un examen cardiaque normal n’exclut pas une myocardite grave. Dans la forme pseudo-infarctoïde, l’examen est souvent normal. Dans la phase initiale d’une forme fulminante, la tachycardie sinusale inexpliquée, une pression différentielle pincée et des extrémités fraîches sont parfois les seuls signes avant le choc. La pression différentielle suit le volume d’éjection : rapportée à la systolique, une valeur inférieure à 25 % prédisait un index cardiaque inférieur à 2,2 L/min/m² avec une sensibilité de 91 % dans l’insuffisance cardiaque chronique. Les extrémités se refroidissent parce que la vasoconstriction sympathique détourne le sang de la peau pour maintenir la pression. Une tachycardie qui persiste après la baisse de la fièvre doit faire répéter la troponine et l’échocardiographie.</div>

</section>

<section class="ilot" id="i40-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Le diagnostic suit une séquence : <b>suspicion clinique → ECG, troponine, protéine C réactive et échocardiographie → exclusion d’un syndrome coronarien → IRM cardiaque → biopsie endomyocardique chez les patients à haut risque.</b></p>
<h3>7.1 Étape 1 — Suspicion et premier bilan</h3>
<p>Toute douleur thoracique, dyspnée ou arythmie avec une <button class="w" data-k="i40-hstn">troponine élevée (cinétique, pièges)</button> et un contexte compatible fait évoquer une myocardite. L’<button class="w" data-k="i40-ecg">ECG de la myocardite (sus-décalage, blocs, bas voltage)</button> et l’<button class="w" data-k="i40-echo">échocardiographie (FEVG, parois, péricarde)</button> sont faits immédiatement ; ils mesurent la gravité et orientent la suite.</p>
<h3>7.2 Étape 2 — Exclure un syndrome coronarien</h3>
<p>Une douleur thoracique avec sus-décalage du ST et troponine élevée est un infarctus jusqu’à preuve du contraire. Selon la probabilité, on exclut une maladie coronaire par <button class="w" data-k="i40-coro">coronarographie ou coroscanner (choix selon la présentation)</button>. Un sus-décalage persistant avec une forte probabilité d’occlusion impose la coronarographie en urgence, sans attendre l’IRM. Une occlusion non reperfusée étend la nécrose avec le temps : la priorité est de ne pas retarder sa prise en charge. La coronarographie conserve ses risques vasculaires, hémorragiques et liés au contraste ; son indication repose sur la présentation clinique et la probabilité d’une occlusion.</p>
<h3>7.3 Étape 3 — L’IRM cardiaque</h3>
<p>L’IRM est l’examen non invasif de référence (classe I, ESC 2025). Elle applique les <button class="w" data-k="i40-lake">critères de Lake Louise 2018 (un critère T2 et un critère T1)</button>. Sa précision diagnostique est maximale lorsqu’elle est faite dans les deux premières semaines suivant le début des symptômes, car l’œdème régresse ensuite.</p>
<h3>7.4 Critères diagnostiques de l’ESC 2025</h3>
<p>L’ESC 2025 classe le diagnostic en trois niveaux (<button class="w" data-k="i40-crit">critères diagnostiques de la myocardite (ESC 2025)</button>).</p>
<table class="t"><tr><th>Niveau</th><th>Définition</th><th>Exemple</th></tr>
<tr><td><b>Certain</b></td><td>Présentation clinique compatible et myocardite prouvée par l’IRM ou par la biopsie</td><td>Douleur thoracique, troponine élevée, IRM avec œdème et rehaussement tardif sous-épicardique</td></tr>
<tr><td><b>Possible</b></td><td>Présentation compatible et au moins un critère supplémentaire (ECG, troponine, imagerie), IRM et biopsie non concluantes ou non disponibles</td><td>Même tableau, IRM avec un seul des deux critères de Lake Louise</td></tr>
<tr><td><b>Peu probable ou rejeté</b></td><td>Présentation clinique seule, sans critère supplémentaire</td><td>Douleur atypique, troponine normale, ECG normal</td></tr></table>
<h3>7.5 Étape 4 — La biopsie endomyocardique</h3>
<p>La <button class="w" data-k="i42-bem">biopsie endomyocardique (technique, risques, limites)</button> est l’<b>examen de référence</b> du diagnostic histologique. Elle est recommandée (classe I, niveau C, ESC 2025) chez le patient à haut risque ou instable, chez le patient à risque intermédiaire qui ne répond pas au traitement, et devant la suspicion d’une myocardite à cellules géantes. Ces indications restent restreintes parce que la biopsie expose à 0,6 à 5 % de complications, jusqu’à 26 % sous assistance circulatoire ; elle ne se justifie que si son résultat change le traitement. Ses indications sont élargies à des patients sélectionnés (ESC 2025) en cas d’arythmie ventriculaire maligne, de trouble de conduction, de FEVG &lt; 40 % ou de rehaussement tardif étendu à l’IRM de la phase aiguë. Ces critères définissent le haut risque ; l’ESC 2025 précise qu’ils ne conduisent pas d’office à la biopsie, qui se décide cas par cas selon la cause suspectée. Elle s’interprète selon les <button class="w" data-k="i40-dallas">critères de Dallas et immunohistochimiques (seuils cellulaires)</button> et comprend une recherche de génome viral.</p>
<h3>7.6 Diagnostics différentiels, par ordre de gravité</h3>
<ol><li><b>Syndrome coronarien aigu</b>, y compris la dissection coronaire spontanée de la femme jeune.</li>
<li><b>Dissection aortique</b> et <b>embolie pulmonaire</b> devant une douleur thoracique avec troponine élevée.</li>
<li><b>Cardiomyopathie de stress (Tako-tsubo)</b> : ballonisation apicale, contexte émotionnel ou physique, femme ménopausée.</li>
<li><b>Cardiomyopathie génétique en poussée</b> (« phase chaude » d’une cardiomyopathie arythmogène à <i>DSP</i>) : épisodes récidivants, rehaussement en anneau. Ces épisodes surviennent chez environ 15 % des porteurs d’un variant de <i>DSP</i>, avec un rehaussement du ventricule gauche dans environ 90 % des cas.</li>
<li><b>Péricardite isolée</b> : la troponine reste normale, car le péricarde ne contient pas de cardiomyocytes ; une troponine élevée, présente dans 20 à 30 % des péricardites, signe une atteinte myocardique associée (chapitre I30).</li>
<li><b>Myocardite septique ou toxique</b> : dysfonction du sepsis, cocaïne, phéochromocytome.</li></ol>
