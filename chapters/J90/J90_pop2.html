<template data-pop="j90-echo" data-title="Échographie thoracique"><p class="lab">Rôle</p><p>L’échographie confirme le liquide, estime son abondance, cherche des cloisons et des nodules, et repère le point de ponction le plus sûr. La British Thoracic Society la recommande à la première évaluation et avant chaque geste pleural.</p><p class="lab">Lecture</p><p>Le liquide apparaît anéchogène ou échogène entre la paroi et le poumon, qui flotte. Un liquide anéchogène peut être un transsudat ou un exsudat. Des cloisons multiples orientent vers une infection ou une tuberculose. Des nodules de la plèvre pariétale ou du diaphragme sont très évocateurs d’un cancer. L’inversion de la coupole diaphragmatique annonce un soulagement probable par l’évacuation.</p><div class="key"><b>Limite.</b> L’échographie dépend de l’opérateur et de sa formation. Elle ne voit pas le médiastin et ne remplace pas la tomodensitométrie pour chercher la cause.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-light" data-title="Critères de Light"><p class="lab">Énoncé</p><p>Le liquide est un exsudat si au moins un des critères suivants est rempli : protéines pleurales / protéines sériques &gt; 0,5 ; LDH pleurale / LDH sérique &gt; 0,6 ; LDH pleurale &gt; deux tiers de la limite supérieure normale de la LDH sérique.</p><p class="lab">Pourquoi ils fonctionnent</p><p>Les protéines mesurent la perméabilité capillaire ; la LDH mesure la lésion et le renouvellement cellulaires. Une plèvre malade élève l’un ou l’autre. Le prélèvement sanguin doit être simultané, car les rapports dépendent des valeurs sériques du moment.</p><p class="lab">Performance et piège</p><p>Les critères sont très sensibles pour l’exsudat : ils en manquent peu. Leur prix est un excès de faux exsudats. Chez les patients sous diurétiques, leur exactitude tombait à 83 %, contre 93 % dans l’ensemble de la série de Romero-Candeira.</p><div class="key"><b>Conduite.</b> Un exsudat discordant avec une clinique de transsudat, chez un patient sous diurétiques, se vérifie par le gradient d’albumine.</div><p class="src">Références : <a href="https://doi.org/10.7326/0003-4819-77-4-507" target="_blank" rel="noopener">Light et al., Ann Intern Med 1972</a> ; <a href="https://doi.org/10.1378/chest.122.5.1524" target="_blank" rel="noopener">Romero-Candeira et al., Chest 2002</a> ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-gradient-albumine" data-title="Gradient d’albumine sérum-plèvre"><p class="lab">Calcul</p><p>Le gradient est l’albumine sérique moins l’albumine pleurale, mesurées le même jour. Un gradient supérieur à 12 g/L (1,2 g/dL) plaide pour un transsudat.</p><p class="lab">Pourquoi il corrige le piège des diurétiques</p><p>Les diurétiques retirent l’eau du liquide : ses concentrations de protéines et de LDH montent fortement. Dans une étude de 21 insuffisants cardiaques ponctionnés à répétition sous diurétiques, les protéines pleurales passaient de 23 à 33 g/L et la LDH de 177 à 288 U/L. Le gradient d’albumine, différence absolue, variait beaucoup moins.</p><div class="key"><b>Limite.</b> Le gradient est plus spécifique mais moins sensible : il a classé à tort deux épanchements malins en transsudats dans l’étude de Roth. Il sert à vérifier un exsudat discordant, non à remplacer les critères de Light.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.98.3.546" target="_blank" rel="noopener">Roth et al., Chest 1990</a> ; <a href="https://doi.org/10.1016/s0002-9343(01)00726-4" target="_blank" rel="noopener">Romero-Candeira et al., Am J Med 2001</a>.</p></template>
<template data-pop="j90-ph" data-title="pH pleural"><p class="lab">Signification</p><p>Dans un épanchement parapneumonique, un pH bas traduit une activité bactérienne et leucocytaire enfermée dans la cavité, qui ne guérira pas sans drainage.</p><p class="lab">Seuils de la British Thoracic Society 2023</p><p>pH ≤ 7,2 : drain si le volume accessible le permet. pH ≥ 7,4 : pas de drainage immédiat. Entre les deux, une LDH pleurale &gt; 900 UI/L ou d’autres arguments font envisager le drain ; le cours <a href="#/entry/J86">J86 — Pleurésies purulentes et abcès du poumon</a> détaille cette zone intermédiaire.</p><p class="lab">Technique</p><p>Le liquide est prélevé dans une seringue à gaz du sang purgée de toute héparine, bouchée sans air et analysée immédiatement.</p><div class="key"><b>Pièges.</b> L’héparine et l’anesthésique local abaissent le pH ; l’air résiduel et le délai d’analyse l’élèvent. Un pH bas existe aussi dans la polyarthrite rhumatoïde, le cancer avancé ou le mésothéliome et la tuberculose.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023, section C</a>.</p></template>
<template data-pop="j90-glucose" data-title="Glucose pleural"><p class="lab">Signification</p><p>Le glucose pleural est normalement voisin de la glycémie. Il baisse lorsque des cellules actives le consomment ou lorsque la plèvre épaissie en freine l’entrée.</p><p class="lab">Seuil</p><p>Si le pH n’est pas disponible rapidement, un glucose pleural &lt; 3,3 mmol/L indique une forte probabilité d’épanchement parapneumonique compliqué et peut guider la pose d’un drain.</p><div class="key"><b>Limite.</b> Un glucose très bas se rencontre aussi dans la polyarthrite rhumatoïde, le cancer avancé et la tuberculose. Le prélèvement se fait en tube fluoré pour stopper la glycolyse.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-cytologie" data-title="Cytologie pleurale"><p class="lab">Technique</p><p>Le liquide, au moins 25 mL et si possible 50 mL, est analysé par frottis direct et par bloc cellulaire. Le bloc permet l’immunohistochimie et la recherche de cibles moléculaires.</p><p class="lab">Performance</p><p>La sensibilité poolée de la cytologie pour une métastase pleurale est de 46 % dans l’analyse de la British Thoracic Society ; sa spécificité est très élevée. Le rendement varie selon la tumeur : il est bon pour l’adénocarcinome, faible pour le mésothéliome.</p><div class="key"><b>Conduite.</b> Une cytologie négative ne rassure pas : elle conduit à d’autres explorations lorsque le doute persiste. Une seconde ponction de grand volume aide, sauf si un mésothéliome est probable, auquel cas la biopsie est préférable d’emblée. Les marqueurs tumoraux du liquide n’ont pas de place en routine.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023, section B</a>.</p></template>
<template data-pop="j90-formule" data-title="Formule cellulaire du liquide"><p class="lab">Normal</p><p>Le liquide pleural normal contient surtout des macrophages, environ trois quarts des cellules, et des lymphocytes, environ un quart.</p><p class="lab">Orientation</p><p>Une prédominance de neutrophiles traduit un processus aigu : pneumonie, embolie, pancréatite. Une prédominance de lymphocytes oriente vers un cancer, une tuberculose, un épanchement cardiaque ancien ou un chylothorax. Des éosinophiles nombreux suggèrent de l’air ou du sang dans la plèvre, un médicament ou une pleurésie bénigne de l’amiante.</p><div class="key"><b>Limite.</b> La formule oriente sans prouver. Un exsudat lymphocytaire à cytologie négative impose la biopsie pour départager cancer et tuberculose. Une cytométrie en flux aide si un lymphome est suspecté.</div><p class="src">Références : <a href="https://doi.org/10.1164/ajrccm.162.3.9910050" target="_blank" rel="noopener">Noppen et al., Am J Respir Crit Care Med 2000</a> ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-ada" data-title="Adénosine désaminase pleurale"><p class="lab">Mécanisme</p><p>Cette enzyme du métabolisme des purines est abondante dans les lymphocytes T activés, qui dominent la réponse immunitaire pleurale à la tuberculose.</p><p class="lab">Performance</p><p>Dans une méta-analyse de 174 publications, la sensibilité et la spécificité étaient de 92 % et 90 % ; au seuil d’environ 40 U/L, elles atteignaient 93 % et 90 %. Toutes les études présentaient un risque de biais élevé.</p><p class="lab">Usage selon la prévalence</p><p>La British Thoracic Society propose l’adénosine désaminase comme test d’exclusion dans les régions de faible prévalence, comme la Suisse, et comme test d’orientation dans les régions de forte prévalence.</p><div class="key"><b>Limite.</b> Empyème, lymphome et polyarthrite rhumatoïde peuvent l’élever. La culture du tissu pleural reste préférée pour le diagnostic et l’antibiogramme.</div><p class="src">Références : <a href="https://doi.org/10.1371/journal.pone.0213728" target="_blank" rel="noopener">Aggarwal et al., méta-analyse 2019</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a>.</p></template>
<template data-pop="j90-ntprobnp" data-title="NT-proBNP dans l’épanchement"><p class="lab">Mécanisme</p><p>Le peptide est sécrété par le myocarde ventriculaire étiré et diffuse librement vers le liquide pleural ; ses concentrations pleurale et sérique évoluent de concert.</p><p class="lab">Performance</p><p>Dans une méta-analyse de dix études, le NT-proBNP pleural avait une sensibilité et une spécificité de 94 % pour un épanchement d’origine cardiaque.</p><div class="key"><b>Conduite.</b> La British Thoracic Society propose le dosage sérique pour étayer une insuffisance cardiaque suspectée ; le dosage pleural n’apporte pas davantage et n’est pas systématique. Une valeur élevée n’exclut pas une seconde cause.</div><p class="src">Références : <a href="https://doi.org/10.1186/1471-2466-10-58" target="_blank" rel="noopener">Janda et Swiston, BMC Pulm Med 2010</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a>.</p></template>
<template data-pop="j90-triglycerides" data-title="Triglycérides et cholestérol pleuraux"><p class="lab">Indication</p><p>Le dosage est demandé devant un liquide laiteux ou trouble, ou après une chirurgie thoracique.</p><p class="lab">Seuils</p><p>Triglycérides &gt; 1,24 mmol/L (110 mg/dL) avec chylomicrons : chylothorax. Cholestérol &gt; 5,18 mmol/L (200 mg/dL), triglycérides bas et cristaux de cholestérol : pseudochylothorax.</p><div class="key"><b>Piège.</b> Un empyème est trouble par ses cellules : après centrifugation, le surnageant devient clair, alors qu’un chyle reste laiteux.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-hematocrite" data-title="Hématocrite pleural"><p class="lab">Indication</p><p>Le dosage est demandé devant un liquide franchement sanglant, pour distinguer un épanchement hémorragique d’un hémothorax.</p><p class="lab">Seuil</p><p>Un hématocrite pleural supérieur à 50 % de l’hématocrite sanguin confirme l’hémothorax. Le prélèvement se fait sur tube à anticoagulant.</p><div class="key"><b>Piège.</b> Quelques millilitres de sang suffisent à colorer un litre de liquide ; l’aspect visuel surestime donc toujours la quantité de sang.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-tdm" data-title="Tomodensitométrie thoracique"><p class="lab">Technique</p><p>L’examen est injecté au temps pleural, dit veineux, pour faire apparaître le rehaussement de la plèvre. Si un cancer est suspecté, il couvre le thorax, l’abdomen et le pelvis.</p><p class="lab">Signes d’orientation</p><p>Un épaississement circonférentiel, nodulaire, de plus de 1 cm, qui atteint la plèvre médiastinale, évoque un cancer ; une tuberculose peut l’imiter, sans envahir la paroi. Une collection lenticulaire avec dédoublement des feuillets, dit signe de la plèvre clivée, évoque une infection.</p><div class="key"><b>Limite.</b> Une tomodensitométrie normale n’exclut pas un cancer pleural. Lorsque la ponction est dangereuse, elle peut remplacer l’échographie comme première étape.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023, sections B et D</a>.</p></template>
<template data-pop="j90-biopsie" data-title="Biopsie pleurale"><p class="lab">Indication</p><p>La biopsie est indiquée devant un exsudat sans diagnostic après cytologie, lorsque cancer ou tuberculose restent possibles, ou d’emblée si un mésothéliome est probable.</p><p class="lab">Techniques</p><p>La thoracoscopie sous anesthésie locale permet de voir la plèvre, de biopsier sous contrôle visuel, d’évacuer le liquide et de réaliser une pleurodèse au talc pendant le même geste. La biopsie à l’aiguille guidée par échographie ou par tomodensitométrie convient aux épaississements accessibles. La biopsie à l’aveugle n’est plus recommandée.</p><div class="key"><b>Conséquence pratique.</b> Le choix dépend de l’indication, des compétences locales et du besoin de contrôler le liquide. Le tissu est envoyé à la fois en histologie et en culture mycobactérienne.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.1183/13993003.00349-2018" target="_blank" rel="noopener">ERS/EACTS statement, Eur Respir J 2018</a>.</p></template>
<template data-pop="pareto-j90-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j90-0,j90-1,j90-2,j90-3,j90-4,j90-5,j90-6"></p><ul><li>Un épanchement naît d’un excès de filtration ou d’un défaut de drainage lymphatique ; un transsudat respecte la plèvre, un exsudat signe une plèvre malade.</li><li>Insuffisance cardiaque, pneumonie et cancer dominent ; amiante, médicaments et tuberculose se recherchent à l’anamnèse.</li><li>J90 : épanchement sans autre code ; J91 : code étoile avec la cause ; J94 : chylothorax, fibrothorax, hémothorax non traumatique.</li><li>La dyspnée vient surtout de la mécanique diaphragmatique ; matité, abolition du murmure et des vibrations vocales signent le liquide.</li></ul></template>
<template data-pop="pareto-j90-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="j90-7"></p><ul><li>Échographie, puis ponction sauf épanchement cardiaque bilatéral typique.</li><li>Un seul critère de Light suffit pour un exsudat ; sous diurétiques, un gradient d’albumine supérieur à 12 g/L rétablit le transsudat.</li><li>Exsudat sans cause après cytologie : tomodensitométrie puis biopsie guidée ou thoracoscopique.</li></ul></template>
<template data-pop="pareto-j90-tt" data-title="Pareto — Urgences et prise en charge"><p class="ratio" data-cover="j90-8,j90-9,j90-10,j90-11"></p><ul><li>Épanchement massif mal toléré, hémothorax, liquide purulent ou pH ≤ 7,2 : action immédiate.</li><li>Ponction sous échographie, lente, au plus 1,5 L, arrêtée dès une gêne.</li><li>Traiter la cause prévient la récidive ; le pH décide du drain dans l’épanchement parapneumonique.</li><li>Épanchement malin : talc ou cathéter tunnellisé si le poumon se réexpand ; cathéter si plus de 25 % ne se réexpand pas.</li><li>Chylothorax : triglycérides supérieurs à 1,24 mmol/L ; hémothorax : hématocrite supérieur à 50 % du sang ; fibrothorax : décortication si gêne importante.</li></ul></template>
<template data-pop="pareto-j90-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j90-12,j90-13"></p><ul><li>Un épanchement qui résiste au traitement de sa cause présumée se réexplore.</li><li>Critères chiffrés : Light, gradient d’albumine, triglycérides, hématocrite, cytologie.</li><li>Paramètres de décision : pH, glucose, LDH, volume de 1,5 L, seuil de 25 % de poumon non expansible.</li></ul></template>
<template data-pop="pareto-j90-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j90-e-1,j90-e-2,j90-e-3,j90-e-4"></p><ul><li>Échographie avant tout geste ; tomodensitométrie au temps pleural pour la cause ; biopsie pour la preuve histologique.</li><li>pH en seringue à gaz du sang sans héparine résiduelle ; cytologie sur 25 à 50 mL, sensibilité 46 %.</li><li>Adénosine désaminase pour exclure une tuberculose en Suisse ; NT-proBNP sérique pour l’insuffisance cardiaque.</li><li>Exsudat lymphocytaire à cytologie négative : biopsie pleurale.</li></ul></template>
<template data-pop="pareto-j90-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j90-p-1,j90-p-2,j90-p-3"></p><ul><li>Traitement de la cause d’abord : diurétique, antibiotique, antituberculeux.</li><li>Talc calibré 3 à 4 g en une fois, sur poumon expansible ; anti-inflammatoire non stéroïdien possible après pleurodèse.</li><li>Lidocaïne 1 % sans adrénaline : 3 mg/kg, au plus 250 mg, selon la BTS 2023.</li><li>Anticoagulants et antiagrégants : délais d’arrêt avant un geste programmé ; inhibiteurs de tyrosine kinase et autres médicaments à rechercher devant un exsudat.</li></ul></template>
