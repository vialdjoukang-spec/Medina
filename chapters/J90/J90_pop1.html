<template data-pop="j90-ponction" data-title="Ponction pleurale : technique et sécurité"><p class="lab">Définition et indication</p><p>La ponction pleurale, ou thoracentèse, retire du liquide de la cavité pleurale à l’aiguille ou au cathéter fin. Elle est diagnostique lorsqu’elle prélève quelques dizaines de millilitres pour analyse, évacuatrice lorsqu’elle soulage une dyspnée.</p><p class="lab">Technique</p><p>Le patient est assis, penché en avant. L’échographie repère le liquide, mesure sa profondeur et marque le point de ponction, dans la position même du geste. Après anesthésie locale, l’aiguille progresse au bord supérieur de la côte inférieure. Au-delà de 60 mL, un cathéter est préféré à l’aiguille seule. L’évacuation est lente, à la seringue ou par gravité, jamais par aspiration murale ou flacon sous vide.</p><p class="lab">Prélèvements</p><p>Le médecin envoie 2 à 5 mL pour protéines et LDH, avec un prélèvement sanguin simultané ; 25 à 50 mL pour la cytologie ; 5 mL pour la culture, plus 5 à 10 mL dans des flacons d’hémoculture si une infection est possible ; 0,5 à 1 mL en seringue à gaz du sang pour le pH.</p><div class="key"><b>Limite.</b> L’évacuation s’arrête à 1,5 L, ou plus tôt devant une oppression, une douleur, une toux persistante ou une dyspnée croissante : ces signes annoncent un œdème de réexpansion ou un poumon non expansible.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-transsudat-exsudat" data-title="Transsudat et exsudat : deux mécanismes"><p class="lab">Définition et mécanisme</p><p>Le transsudat est un ultrafiltrat de plasma pauvre en protéines : une pression capillaire élevée ou une pression oncotique basse le poussent à travers une plèvre saine, qui retient les protéines. L’exsudat, riche en protéines et en LDH, traverse une plèvre malade : la perméabilité accrue laisse passer les protéines, ou le drainage lymphatique bloqué les retient dans la cavité.</p><p class="lab">Conséquence clinique</p><p>Un transsudat fait traiter la maladie générale, sans autre exploration pleurale. Un exsudat impose de rechercher une maladie pleurale ou pulmonaire, avec cytologie, culture et parfois biopsie.</p><div class="key"><b>Limite.</b> Une même maladie peut donner les deux types : l’embolie pulmonaire et le cancer donnent parfois un transsudat. Les diurétiques peuvent transformer un transsudat en faux exsudat.</div></template>
<template data-pop="j90-malin" data-title="Épanchement malin : un signe de dissémination"><p class="lab">Définition</p><p>Un épanchement est malin lorsque des cellules tumorales sont démontrées dans le liquide ou dans la plèvre. Les cancers du poumon et du sein, le lymphome et le mésothéliome en sont les causes principales.</p><p class="lab">Mécanisme</p><p>Les cellules tumorales envahissent la plèvre, augmentent la perméabilité capillaire et obstruent les stomates lymphatiques. Le liquide se forme plus vite qu’il n’est résorbé et récidive après évacuation.</p><p class="lab">Conséquence clinique</p><p>Le cancer du poumon en est la première cause, devant le cancer du sein. Le traitement pleural est palliatif : il vise la dyspnée et le temps passé hors de l’hôpital.</p><div class="key"><b>Limite.</b> Un épanchement chez un patient cancéreux n’est pas forcément malin : infection, embolie, insuffisance cardiaque ou obstruction lymphatique sans cellule tumorale sont possibles. La preuve cytologique ou histologique reste nécessaire.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00349-2018" target="_blank" rel="noopener">ERS/EACTS statement, Eur Respir J 2018</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j90-lent" data-title="Score LENT : estimer la survie"><p class="lab">Composantes</p><p>Le score réunit quatre éléments dont les initiales anglaises forment son nom : la LDH pleurale, l’état fonctionnel selon l’échelle ECOG, le rapport neutrophiles sur lymphocytes sanguins et le type de tumeur.</p><p class="lab">Valeur</p><p>Dans sa cohorte de validation, la survie médiane était de 319 jours pour le risque faible, 130 jours pour le risque modéré et 44 jours pour le risque élevé. Le score prédisait mieux la survie que l’échelle ECOG seule.</p><p class="lab">Conséquence clinique</p><p>Une survie attendue de quelques semaines fait préférer un geste simple et ambulatoire à une hospitalisation pour pleurodèse.</p><div class="key"><b>Limite.</b> Le score a été construit avant l’essor des thérapies ciblées et de l’immunothérapie, qui allongent la survie de certains cancers. Il éclaire la discussion sans fixer la décision.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2014-205285" target="_blank" rel="noopener">Clive et al., Thorax 2014</a>.</p></template>
<template data-pop="j90-starling" data-title="Loi de Starling appliquée à la plèvre"><p class="lab">Principe</p><p>Deux forces opposées règlent le flux à travers un capillaire : la pression hydrostatique pousse l’eau hors du vaisseau, la pression oncotique des protéines plasmatiques la retient. La plèvre pariétale reçoit un sang systémique à pression relativement élevée, face à une pression pleurale négative : la filtration se fait de la paroi vers la cavité, et le filtrat reste pauvre en protéines.</p><p class="lab">Conséquence clinique</p><p>Une pression veineuse élevée, dans l’insuffisance cardiaque, ou une albumine très basse, dans le syndrome néphrotique, augmentent la filtration et produisent un transsudat.</p><div class="key"><b>Limite.</b> Starling explique la formation, non l’accumulation, qui exige que la filtration dépasse la capacité du drainage lymphatique.</div></template>
<template data-pop="j90-lymphe" data-title="Stomates lymphatiques : la réserve de drainage"><p class="lab">Fonction</p><p>Les stomates de la plèvre pariétale, surtout diaphragmatique et médiastinale, conduisent le liquide, les protéines et les cellules vers les lymphatiques, puis vers les ganglions médiastinaux.</p><p class="lab">Mécanisme</p><p>Ce drainage peut augmenter fortement lorsque la filtration augmente. Il maintient ainsi le volume pleural très faible malgré des variations de production.</p><p class="lab">Conséquence clinique</p><p>Une obstruction des stomates ou des ganglions médiastinaux, par un cancer ou une fibrose, crée un exsudat même sans inflammation intense. Elle explique aussi qu’un cancer ganglionnaire puisse produire un épanchement sans cellule maligne.</p><div class="key"><b>Limite.</b> La résorption d’un épanchement constitué reste lente, car elle dépend du seul débit lymphatique : l’évacuation mécanique soulage plus vite.</div></template>
<template data-pop="j90-cirrhose" data-title="Hydrothorax hépatique"><p class="lab">Définition</p><p>L’hydrothorax hépatique est un transsudat pleural chez un patient cirrhotique, en l’absence de maladie cardiaque ou pulmonaire qui l’expliquerait.</p><p class="lab">Mécanisme</p><p>L’ascite passe dans la plèvre par de petites brèches du diaphragme. La pression pleurale négative aspire le liquide vers le thorax.</p><p class="lab">Conduite</p><p>Le traitement repose sur la restriction sodée et les diurétiques, puis sur les ponctions évacuatrices et l’avis hépatologique pour une dérivation portosystémique intrahépatique ou une transplantation. Un drain thoracique à demeure est évité : il provoque des pertes massives de liquide et de protéines, une insuffisance rénale et des infections.</p><div class="key"><b>Limite.</b> Un épanchement fébrile chez un cirrhotique doit être ponctionné : une infection spontanée du liquide pleural est possible.</div></template>
<template data-pop="j90-dyspnee" data-title="Mécanisme de la dyspnée dans l’épanchement"><p class="lab">Constat</p><p>Après une ponction évacuatrice, la dyspnée s’améliore souvent nettement, alors que les volumes pulmonaires mesurés progressent peu et sans corrélation étroite avec le volume retiré.</p><p class="lab">Mécanisme</p><p>Le diaphragme abaissé, aplati ou inversé, est raccourci : sa contraction produit moins de dépression pour un même effort. L’évacuation lui rend sa courbure. Les échanges gazeux s’altèrent aussi, puis s’améliorent après drainage.</p><p class="lab">Conséquence clinique</p><p>Une saturation normale ne contre-indique pas l’évacuation d’un patient dyspnéique. Une dyspnée qui ne s’améliore pas après évacuation fait chercher une autre cause : lymphangite carcinomateuse, embolie ou poumon non expansible.</p><div class="key"><b>Limite.</b> Les études sur ce mécanisme sont de petite taille ; la part exacte de chaque facteur reste discutée.</div><p class="src">Référence : <a href="https://doi.org/10.1097/MCP.0000000000000174" target="_blank" rel="noopener">Thomas et al., Curr Opin Pulm Med 2015</a>.</p></template>
<template data-pop="j90-ic" data-title="Épanchement de l’insuffisance cardiaque"><p class="lab">Mécanisme</p><p>Une pression élevée dans les veines pulmonaires et systémiques augmente la filtration interstitielle pulmonaire ; une partie du liquide gagne la plèvre à travers la plèvre viscérale. Le drainage lymphatique, gêné par la pression veineuse systémique élevée, est dépassé.</p><p class="lab">Présentation</p><p>L’épanchement est habituellement bilatéral. Il s’accompagne d’œdèmes, d’une turgescence jugulaire, d’un troisième bruit et d’un NT-proBNP élevé.</p><p class="lab">Conduite</p><p>Le traitement diurétique fait régresser le liquide. Une ponction n’est pas nécessaire si la présentation est typique et la réponse rapide.</p><div class="key"><b>Limite.</b> Un épanchement unilatéral, fébrile, douloureux, disproportionné aux symptômes ou résistant aux diurétiques doit être ponctionné : une seconde cause est possible.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a>, tableau 7 ; <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j90-parapneumonique" data-title="Épanchement parapneumonique"><p class="lab">Définition</p><p>C’est un épanchement associé à une pneumonie. Il est simple lorsqu’il est stérile et réactionnel ; compliqué lorsque les bactéries envahissent la cavité, avec un liquide acide ; purulent lorsqu’il s’agit d’un empyème.</p><p class="lab">Mécanisme</p><p>L’inflammation de la plèvre viscérale voisine du foyer augmente la perméabilité. Si les bactéries franchissent la plèvre, la consommation de glucose et la production d’acides font chuter le pH, et la fibrine cloisonne la cavité.</p><p class="lab">Conduite</p><p>Un pH ≤ 7,2 ou un pus franc imposent un drainage, en plus de l’antibiothérapie. Le cours J86 — Pleurésies purulentes et abcès du poumon développe la suite.</p><div class="key"><b>Limite.</b> Un liquide non purulent n’exclut pas une infection compliquée : seul le pH, mesuré correctement, permet de trancher.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023, section C</a>.</p></template>
<template data-pop="j90-embolie" data-title="Épanchement de l’embolie pulmonaire"><p class="lab">Mécanisme</p><p>L’ischémie du parenchyme et la libération de médiateurs inflammatoires augmentent la perméabilité capillaire. Un infarctus pulmonaire sous-pleural peut rendre le liquide hémorragique.</p><p class="lab">Présentation</p><p>L’épanchement est habituellement petit et unilatéral, et le plus souvent exsudatif. Une douleur pleurale et une dyspnée disproportionnée par rapport au volume de liquide doivent faire évoquer ce diagnostic.</p><p class="lab">Conduite</p><p>Le diagnostic suit l’algorithme de l’embolie ; l’anticoagulation n’est pas contre-indiquée par un liquide simplement hémorragique.</p><div class="key"><b>Limite.</b> L’épanchement est peu spécifique ; c’est la probabilité clinique qui conduit à l’angioscanner. Un épanchement qui grossit sous anticoagulant fait rechercher un hémothorax.</div></template>
<template data-pop="j90-tuberculose" data-title="Pleurésie tuberculeuse"><p class="lab">Mécanisme</p><p>Les bacilles sont peu nombreux dans le liquide pleural : l’examen direct les détecte dans moins de 5 % des cas et la culture dans 10 à 20 %. L’amplification génique est souvent peu contributive, car le liquide contient des inhibiteurs.</p><p class="lab">Diagnostic</p><p>Le liquide est un exsudat lymphocytaire. L’adénosine désaminase y est élevée. La biopsie pleurale montre des granulomes épithélioïdes caséeux et permet la culture et l’antibiogramme, que la British Thoracic Society recommande de privilégier. Pour la recherche mycobactérienne, 30 à 50 mL de liquide frais sont envoyés, jamais en flacon d’hémoculture.</p><p class="lab">Traitement</p><p>Le schéma est celui de la tuberculose active. Le liquide se résorbe sous traitement ; une évacuation peut soulager un grand épanchement.</p><div class="key"><b>Limite.</b> En Suisse, région de faible prévalence, une adénosine désaminase basse aide surtout à écarter la tuberculose ; une valeur élevée doit être confirmée par la biopsie.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.1371/journal.pone.0213728" target="_blank" rel="noopener">Aggarwal et al., méta-analyse 2019</a> ; <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j90-medicaments" data-title="Épanchements médicamenteux"><p class="lab">Principaux agents</p><p>Selon la British Thoracic Society, les inhibiteurs de tyrosine kinase sont aujourd’hui la cause médicamenteuse d’exsudat la plus fréquente ; l’information professionnelle suisse du dasatinib mentionne des épanchements pleuraux, parfois sévères, et des chylothorax. Jany et Welte citent notamment la nitrofurantoïne, l’amiodarone, le méthotrexate, la phénytoïne, la clozapine et les bêtabloquants. La cabergoline, dérivé de l’ergot de seigle, peut provoquer pleurésie, épanchement et épaississement fibreux de la plèvre selon son information professionnelle suisse.</p><p class="lab">Démarche d’imputabilité</p><p>Le médecin vérifie la chronologie entre l’introduction du produit et l’épanchement, exclut les autres causes, puis observe l’évolution à l’arrêt lorsque celui-ci est possible. La base Pneumotox recense les associations publiées.</p><div class="key"><b>Limite.</b> L’arrêt d’un traitement anticancéreux efficace se discute avec l’oncologue ; une réduction de dose suffit parfois.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox</a> ; <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a> ; Informations professionnelles suisses Sprycel® (mai 2026) et Dostinex® (novembre 2025), Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="j90-amiante" data-title="Amiante et plèvre"><p class="lab">Mécanisme</p><p>Les fibres d’amiante inhalées migrent vers la plèvre, où elles entretiennent une inflammation chronique. Celle-ci produit des plaques, une pleurésie bénigne ou, après une latence de plusieurs décennies, un mésothéliome.</p><p class="lab">Conséquence clinique</p><p>La pleurésie bénigne de l’amiante est un exsudat, souvent hémorragique ou riche en éosinophiles, qui peut récidiver. Son diagnostic ne se retient qu’après exclusion d’un mésothéliome, parfois par une surveillance prolongée.</p><p class="lab">Aspect suisse</p><p>Une maladie pleurale liée à l’amiante peut être reconnue comme maladie professionnelle ; le médecin la signale à l’assureur-accidents compétent, le plus souvent la Suva.</p><div class="key"><b>Limite.</b> Des plaques calcifiées signent une exposition, non un cancer. Elles ne dispensent pas d’explorer un épanchement.</div></template>
<template data-pop="j90-douleur-pleurale" data-title="Douleur pleurale"><p class="lab">Caractéristiques</p><p>La douleur est latérale, en coup de poignard, majorée par l’inspiration profonde et la toux. Le patient respire superficiellement pour l’éviter.</p><p class="lab">Mécanisme</p><p>Seule la plèvre pariétale possède des fibres sensitives. L’inflammation de ses feuillets, qui frottent l’un contre l’autre, déclenche la douleur. Lorsque le liquide sépare les feuillets, la douleur diminue souvent.</p><p class="lab">Conséquence clinique</p><p>Une douleur pleurale oriente vers un exsudat inflammatoire : pneumonie, embolie, pleurésie virale ou maladie auto-immune. Une douleur projetée à l’épaule traduit l’atteinte de la plèvre diaphragmatique, innervée par le nerf phrénique.</p><div class="key"><b>Limite.</b> Une douleur thoracique respiratoire ne prouve pas l’origine pleurale : une fracture de côte ou une péricardite peuvent l’imiter.</div></template>
<template data-pop="j90-matite" data-title="Matité à la percussion"><p class="lab">Signe</p><p>La percussion comparée des deux hémithorax trouve une matité basale, unilatérale ou bilatérale, dont la limite supérieure dessine la surface du liquide.</p><p class="lab">Mécanisme</p><p>Le poumon aéré résonne ; le liquide, milieu dense sans air, ne résonne pas. Debout ou assis, il gagne les bases.</p><p class="lab">Valeur</p><p>Une matité basale bilatérale avec des signes d’insuffisance cardiaque rend un transsudat cardiaque très probable ; une matité unilatérale élève nettement la probabilité d’un exsudat.</p><div class="key"><b>Limite.</b> La matité ne distingue pas à elle seule le liquide d’une condensation : l’imagerie tranche.</div><p class="src">Référence : <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j90-murmure" data-title="Diminution du murmure vésiculaire"><p class="lab">Mécanisme</p><p>Le murmure vésiculaire naît du passage de l’air dans les voies aériennes. Le liquide interposé entre le poumon et la paroi atténue la transmission de ce son.</p><p class="lab">Conséquence clinique</p><p>Un murmure diminué ou aboli aux bases, sous une zone mate, accompagne l’épanchement, d’un côté ou des deux.</p><div class="key"><b>Limite.</b> Le signe oriente sans mesurer : la radiographie et l’échographie confirment le liquide et son abondance.</div><p class="src">Référence : <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j90-frottement" data-title="Frottement pleural"><p class="lab">Mécanisme</p><p>Deux feuillets inflammatoires, recouverts de fibrine, frottent l’un contre l’autre à chaque cycle respiratoire.</p><p class="lab">Conséquence clinique</p><p>Le frottement s’entend parfois au stade initial d’un épanchement parapneumonique, avant que le liquide ne sépare les feuillets ; la douleur pleurale suit la même évolution et s’atténue quand l’épanchement se constitue.</p><p class="src">Référence : <a href="https://doi.org/10.3238/arztebl.2019.0377" target="_blank" rel="noopener">Jany et Welte, Dtsch Arztebl Int 2019</a>.</p></template>
<template data-pop="j90-hemothorax" data-title="Hémothorax"><p class="lab">Définition et causes</p><p>L’hémothorax est retenu lorsque l’hématocrite pleural dépasse 50 % de l’hématocrite sanguin. Le traumatisme thoracique et les gestes invasifs dominent ; les formes non traumatiques viennent d’un anticoagulant, d’une tumeur, d’une rupture vasculaire ou d’une endométriose thoracique.</p><p class="lab">Conduite</p><p>Le drainage évacue le sang, mesure le débit et réexpand le poumon. Un drain de gros calibre reste habituel chez le traumatisé instable ; chez le patient stable, un drain fin peut suffire. Un saignement persistant ou une instabilité imposent l’avis chirurgical.</p><div class="key"><b>Limite.</b> Un caillot non évacué s’organise : il expose au fibrothorax et à l’infection. Sa persistance fait discuter une évacuation thoracoscopique.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-pneumothorax-iatrogene" data-title="Pneumothorax après ponction"><p class="lab">Mécanisme</p><p>L’aiguille perfore la plèvre viscérale, ou de l’air pénètre par le système de ponction. Une chute de pression sur un poumon non expansible peut aussi laisser un espace aérique sans fuite, appelé pneumothorax ex vacuo.</p><p class="lab">Prévention</p><p>Le guidage échographique réduit ce risque. Le patient reste immobile et l’opérateur arrête la ponction si une toux ou une douleur apparaissent.</p><div class="key"><b>Conduite.</b> Un pneumothorax ex vacuo ne se draine pas, car il témoigne d’un poumon qui ne peut pas se réexpandre. Un pneumothorax par fuite se traite selon le cours J93 — Pneumothorax.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-reexpansion" data-title="Œdème pulmonaire de réexpansion"><p class="lab">Définition</p><p>C’est une hypoxémie avec des infiltrats alvéolaires diffus du côté drainé. Elle survient le plus souvent dans l’heure qui suit l’évacuation rapide d’un grand volume.</p><p class="lab">Mécanisme</p><p>La réexpansion brutale d’un poumon longtemps collabé et la chute marquée de la pression pleurale lèsent la barrière alvéolocapillaire et augmentent la perméabilité.</p><p class="lab">Fréquence et prévention</p><p>Il est symptomatique chez moins de 1 % des patients ponctionnés, mais il peut être mortel. L’évacuation lente, le plafond de 1,5 L par séance et l’arrêt dès l’apparition d’une gêne le préviennent.</p><div class="key"><b>Conduite.</b> L’oxygène et, selon la gravité, un soutien ventilatoire suffisent le plus souvent ; les symptômes régressent spontanément chez la plupart des patients.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-diuretique" data-title="Diurétique de l’anse dans l’épanchement cardiaque"><p class="lab">Mécanisme</p><p>Le furosémide bloque le cotransporteur Na-K-2Cl de la branche ascendante de l’anse de Henle. La natriurèse réduit la volémie et les pressions veineuses ; la filtration pleurale diminue et le drainage lymphatique résorbe le liquide.</p><p class="lab">Usage</p><p>La dose est adaptée à la congestion et à la fonction rénale, selon le cours I50 — Insuffisance cardiaque. Dans l’hydrothorax hépatique, il est associé à un antagoniste de l’aldostérone.</p><p class="lab">Surveillance</p><p>Poids, diurèse, créatinine, sodium et potassium sont contrôlés. L’hypokaliémie expose aux troubles du rythme.</p><div class="key"><b>Piège.</b> Après quelques jours de diurétique, un transsudat se concentre et peut remplir un critère de Light. Le gradient d’albumine corrige ce piège.</div><p class="src">Référence : <a href="https://doi.org/10.1016/s0002-9343(01)00726-4" target="_blank" rel="noopener">Romero-Candeira et al., Am J Med 2001</a>.</p></template>
<template data-pop="j90-poumon-non-expansible" data-title="Poumon non expansible"><p class="lab">Définition</p><p>Le poumon ne revient pas au contact de la paroi après l’évacuation du liquide. Une coque viscérale, une obstruction bronchique ou une tumeur l’en empêchent.</p><p class="lab">Reconnaissance</p><p>Une oppression thoracique pendant la ponction, un pneumothorax sans fuite sur la radiographie de contrôle ou l’absence de réexpansion à l’échographie la font suspecter.</p><p class="lab">Conséquence thérapeutique</p><p>Le talc exige des feuillets en contact : il échoue souvent sur un poumon non expansible. Au-delà de 25 % de poumon non expansible, la British Thoracic Society oriente vers le cathéter tunnellisé ; en dessous, le talc peut encore améliorer la qualité de vie et la symphyse.</p><div class="key"><b>Limite.</b> La thoracoscopie ne permet pas d’identifier de façon fiable un poumon non expansible par la seule inspection visuelle.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-catheter" data-title="Cathéter pleural tunnellisé"><p class="lab">Principe</p><p>Un cathéter souple est placé dans la cavité pleurale, puis tunnellisé sous la peau pour réduire le risque d’infection. Le patient, un proche ou une infirmière de soins à domicile raccordent des bouteilles de drainage selon un calendrier.</p><p class="lab">Preuves</p><p>Dans l’essai TIME2, la dyspnée à 42 jours était identique à celle du talc, mais meilleure à 6 mois ; la durée d’hospitalisation initiale était de 0 jour contre 4. Dans l’essai AMPLE, le cathéter réduisait les journées d’hospitalisation (médiane 10 contre 12) et les nouveaux gestes pleuraux (4,1 % contre 22,5 %).</p><p class="lab">Rythme de drainage</p><p>Un drainage quotidien augmente les chances de symphyse spontanée et de retrait du cathéter ; un drainage selon les symptômes suffit à contrôler la dyspnée si le patient préfère un rythme moins contraignant.</p><div class="key"><b>Limite.</b> Infection, cloisonnement, obstruction et impact sur l’image corporelle doivent être discutés avant la pose.</div><p class="src">Références : <a href="https://doi.org/10.1001/jama.2012.5535" target="_blank" rel="noopener">Davies et al., essai TIME2, JAMA 2012</a> ; <a href="https://doi.org/10.1001/jama.2017.17426" target="_blank" rel="noopener">Thomas et al., essai AMPLE, JAMA 2017</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a>.</p></template>
<template data-pop="j90-talc-catheter" data-title="Talc instillé par le cathéter tunnellisé"><p class="lab">Principe</p><p>Après dix jours de drainage ambulatoire, si le poumon se réexpand, 4 g de talc en suspension sont instillés par le cathéter, en consultation.</p><p class="lab">Preuve</p><p>Dans l’essai IPC-PLUS, la symphyse au 35e jour était obtenue chez 43 % des patients avec talc contre 23 % avec placebo, sans excès d’effets indésirables ni d’obstruction du cathéter.</p><div class="key"><b>Conséquence pratique.</b> La British Thoracic Society recommande de proposer cette instillation lorsque la symphyse et le retrait du cathéter comptent pour le patient ou le clinicien, et que le poumon est expansible.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1716883" target="_blank" rel="noopener">Bhatnagar et al., essai IPC-PLUS, N Engl J Med 2018</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a>.</p></template>
<template data-pop="j90-chylothorax" data-title="Chylothorax"><p class="lab">Définition</p><p>Le chylothorax est la présence de chyle dans la plèvre : triglycérides pleuraux supérieurs à 1,24 mmol/L (110 mg/dL) et chylomicrons présents.</p><p class="lab">Mécanisme et causes</p><p>Le canal thoracique, qui transporte la lymphe intestinale chargée de chylomicrons, peut être sectionné par une chirurgie thoracique, œsophagienne surtout, ou obstrué par un lymphome ou une autre tumeur. La lymphangioléiomyomatose, la tuberculose et la cirrhose sont des causes plus rares ; environ 10 % des cas restent idiopathiques.</p><p class="lab">Traitement</p><p>Au drainage et au régime à triglycérides à chaîne moyenne, ou à la nutrition parentérale, s’ajoutent en cas d’échec la ligature ou l’embolisation du canal. Un chylothorax lymphomateux répond au traitement du lymphome.</p><div class="key"><b>Piège.</b> À jeun, le chyle peut perdre son aspect laiteux ; c’est le dosage des triglycérides qui tranche.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-pseudochylothorax" data-title="Pseudochylothorax"><p class="lab">Définition</p><p>C’est un épanchement laiteux riche en cholestérol, supérieur à 5,18 mmol/L (200 mg/dL), avec des triglycérides habituellement bas, des cristaux de cholestérol et sans chylomicrons.</p><p class="lab">Mécanisme</p><p>Il se forme dans un épanchement ancien, enclos par une plèvre épaissie, où la dégradation des cellules libère le cholestérol qui ne peut plus être évacué.</p><p class="lab">Causes</p><p>La tuberculose ancienne et la polyarthrite rhumatoïde sont les causes classiques.</p><div class="key"><b>Conséquence pratique.</b> Le canal thoracique est intact : ni régime ni ligature ne sont utiles. Le traitement vise la maladie causale et, si besoin, la décortication.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-fibrothorax" data-title="Fibrothorax"><p class="lab">Définition</p><p>Le fibrothorax est un épaississement fibreux diffus de la plèvre viscérale qui enserre le poumon et rétracte l’hémithorax.</p><p class="lab">Mécanisme</p><p>Un caillot d’hémothorax, un empyème ou une tuberculose déposent de la fibrine, que des fibroblastes transforment en collagène. La coque empêche l’expansion du poumon.</p><p class="lab">Conséquences et traitement</p><p>Le trouble ventilatoire est restrictif. La décortication retire la coque si la gêne est importante et le poumon sous-jacent sain.</p><div class="key"><b>Limite.</b> Une coque nodulaire ou circonférentielle doit faire exclure un mésothéliome avant de conclure à une séquelle bénigne.</div></template>
<template data-pop="j90-tcm" data-title="Triglycérides à chaîne moyenne"><p class="lab">Mécanisme</p><p>Les acides gras à chaîne longue sont réassemblés dans les entérocytes en chylomicrons qui gagnent la lymphe. Les acides gras à chaîne moyenne, plus courts, passent directement dans le sang porte, liés à l’albumine.</p><p class="lab">Usage</p><p>Un régime pauvre en graisses à chaîne longue, enrichi en triglycérides à chaîne moyenne, réduit le débit de chyle tout en couvrant une partie des besoins énergétiques.</p><div class="key"><b>Limite.</b> Le régime diminue le débit sans fermer la brèche ; un débit élevé persistant conduit à la nutrition parentérale puis au geste sur le canal thoracique.</div></template>
<template data-pop="j90-talc" data-title="Talc : monographie de la pleurodèse"><p class="lab">Mécanisme</p><p>Le talc, silicate de magnésium, déclenche une inflammation des cellules mésothéliales. Elle produit de la fibrine puis une fibrose qui soudent les deux feuillets et suppriment la cavité.</p><p class="lab">Administration et dose</p><p>Il est administré en suspension par un drain ou en poudrage pendant une thoracoscopie, à la dose unique de 3 à 4 g de talc calibré. Un drain d’au moins 12 French, de préférence plus large, évite l’obstruction par les particules.</p><p class="lab">Preuves</p><p>Dans l’essai TAPPS, l’échec à 90 jours était de 22 % avec le poudrage et de 24 % avec la suspension : les deux voies se valent, avec environ trois quarts de succès à trois mois.</p><p class="lab">Effets indésirables</p><p>Douleur thoracique et fièvre sont fréquentes. Une réaction inflammatoire systémique avec hypoxémie est rare ; elle est plus fréquente avec un talc non calibré, riche en petites particules. Le talc calibré est donc la règle.</p><div class="key"><b>Contre-indication fonctionnelle.</b> Un poumon non expansible empêche la symphyse.</div><div class="key"><b>Statut suisse.</b> Aucune information professionnelle de talc stérile ne figure dans la base Swissmedic (AIPS) consultée le 08.10.2026 ; la dose repose donc sur la British Thoracic Society et les essais, et le produit employé suit la documentation de l’établissement.</div><p class="src">Références : <a href="https://doi.org/10.1001/jama.2019.19997" target="_blank" rel="noopener">Bhatnagar et al., essai TAPPS, JAMA 2020</a> ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a> ; <a href="https://doi.org/10.1183/13993003.00349-2018" target="_blank" rel="noopener">ERS/EACTS statement, Eur Respir J 2018</a>.</p></template>
<template data-pop="j90-anticoag" data-title="Anticoagulation et geste pleural"><p class="lab">Principe</p><p>Le risque hémorragique d’une ponction est faible mais réel, car l’artère intercostale peut être lésée. Le risque thrombotique de l’arrêt dépend de l’indication : stent coronaire récent, valve mécanique, embolie récente.</p><p class="lab">Délais suisses pour un geste programmé</p><p>La phenprocoumone (Marcoumar), antivitamine K de longue demi-vie employée en Suisse, est interrompue environ 5 à 10 jours avant ; un relais par héparine débute lorsque le rapport normalisé international sort de la zone thérapeutique, selon le risque thrombotique. Le rivaroxaban, l’édoxaban et le dabigatran sont arrêtés au moins 24 heures avant, le dabigatran 2 à 4 jours avant en cas de risque hémorragique accru ; l’apixaban 24 heures avant un geste à faible risque hémorragique et 48 heures avant un geste à risque modéré ou élevé. Le clopidogrel, le prasugrel et le ticagrélor sont arrêtés 7 jours avant lorsque l’effet antiagrégant n’est pas souhaité.</p><div class="key"><b>Choix de la source.</b> La British Thoracic Society (2023) arrête la warfarine 5 jours avant, avec un rapport normalisé international ≤ 1,5, le clopidogrel et le prasugrel 5 jours avant et le ticagrélor 7 jours avant ; elle poursuit l’aspirine et l’héparine prophylactique et reprend l’anticoagulant oral direct un jour après un geste à faible risque, deux à trois jours après un geste à risque élevé. En Suisse, les délais de l’information professionnelle du médicament priment, plus longs pour les antiagrégants.</div><div class="key"><b>Limite.</b> Plusieurs petites études n’ont pas montré d’excès de saignement lors d’une ponction sous clopidogrel. En urgence, le geste se décide sur la balance immédiate des risques, sans attendre l’élimination du médicament.</div><p class="src">Références : Informations professionnelles suisses Marcoumar® (octobre 2020), Plavix® (septembre 2022), Efient® (avril 2025), Brilique® (novembre 2025), Xarelto® (mai 2025), Eliquis® (août 2026), Lixiana® (décembre 2023) et Pradaxa® (février 2024), Swissmedic (AIPS), consultées le 08.10.2026 ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-lidocaine" data-title="Lidocaïne : anesthésie locale du geste pleural"><p class="lab">Mécanisme</p><p>La lidocaïne bloque les canaux sodiques voltage-dépendants des fibres nerveuses et empêche la propagation du message douloureux. L’infiltration vise la peau, le périoste de la côte et surtout la plèvre pariétale, seule sensible.</p><p class="lab">Dose selon l’information professionnelle suisse</p><p>Lidocaine Aguettant (10 et 20 mg/mL) prévoit une dose totale habituelle de 3 à 5 mg/kg et, en général, au plus 200 mg chez l’adulte pour l’infiltration, des doses plus élevées restant possibles selon l’intervention. Rapidocain 1 % admet en infiltration jusqu’à 40 mL, soit 400 mg, pour un adulte moyen de 70 kg. Les deux textes demandent des doses plus faibles chez le sujet âgé, l’insuffisant rénal ou hépatique et le patient atteint de cancer, dont la fixation protéique est modifiée ; Lidocaine Aguettant envisage une réduction de moitié en insuffisance cardiaque ou hépatique. Avec la solution à 1 %, 20 mL apportent déjà 200 mg : le cumul se calcule avant le geste.</p><div class="key"><b>Choix de la source.</b> La British Thoracic Society (2023) retient jusqu’à 3 mg/kg, au plus 250 mg, sans adrénaline, et jusqu’à 7 mg/kg, au plus 500 mg, avec adrénaline. Ces repères britanniques ne fondent pas la prescription en Suisse : l’information professionnelle suisse du produit employé fait foi, et ses plafonds diffèrent d’un produit à l’autre.</div><p class="lab">Toxicité</p><p>Un surdosage ou une injection intravasculaire provoquent d’abord des signes neurologiques, puis des convulsions, des troubles du rythme et un arrêt cardiaque. L’aspiration avant et pendant l’injection limite ce risque. En cas de toxicité, l’injection est arrêtée ; l’information de Lidocaine Aguettant prévoit une émulsion lipidique pour limiter la progression vers le collapsus.</p><p class="src">Références : Informations professionnelles suisses Lidocaine Aguettant® 10 mg/ml et 20 mg/ml (décembre 2023) et Rapidocain® (juillet 2024), Swissmedic (AIPS), consultées le 08.10.2026 ; <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p></template>
<template data-pop="j90-ains-pleurodese" data-title="Analgésie après pleurodèse : l’essai TIME1"><p class="lab">Question</p><p>On craignait qu’un anti-inflammatoire non stéroïdien, en freinant l’inflammation, ne compromette la symphyse provoquée par le talc.</p><p class="lab">Résultat</p><p>Dans l’essai TIME1, chez 320 patients, l’échec de la pleurodèse à trois mois était de 23 % sous anti-inflammatoire et de 20 % sous opioïde : la non-infériorité était démontrée. La douleur était comparable, mais le groupe anti-inflammatoire a davantage eu recours aux antalgiques de secours. Les drains de 12 French étaient moins douloureux que ceux de 24 French, mais leur non-infériorité sur la symphyse n’a pas été démontrée.</p><div class="key"><b>Conséquence pratique.</b> Un anti-inflammatoire non stéroïdien peut être utilisé après une pleurodèse si ses contre-indications rénales, digestives et cardiovasculaires le permettent.</div><p class="src">Référence : <a href="https://doi.org/10.1001/jama.2015.16840" target="_blank" rel="noopener">Rahman et al., essai TIME1, JAMA 2015</a>.</p></template>
