
<!-- ===== FENÊTRES I47 : examens ===== -->
<template data-pop="i47-irm" data-title="IRM cardiaque en rythmologie">
<div class="lab">Question clinique</div><p>Existe-t-il un substrat myocardique (cicatrice, fibrose, infiltration, inflammation) à l’origine de la TV ?</p>
<div class="lab">Lecture</div><p>Rehaussement tardif sous-endocardique ou transmural dans un territoire coronaire : cicatrice d’infarctus ; son hétérogénéité (zone grise) marque les isthmes. Rehaussement épicardique ou intramyocardique : myocardite, sarcoïdose (souvent septale basale), cardiomyopathie non ischémique ; bande intramyocardique septale : risque rythmique accru. Ventricule droit dilaté, akinésies segmentaires, rehaussement : cardiomyopathie arythmogène. Œdème en T2 : inflammation active.</p>
<div class="lab">Indications</div><p>TV ou FV sans cause évidente ; TVNS ou extrasystoles fréquentes avec échocardiographie normale ou douteuse ; stratification d’une cardiomyopathie non ischémique avant la décision de DAI ; planification de l’ablation.</p>
<div class="lab">Limites</div><p>DAI et stimulateurs : examen possible si le système est compatible, avec artefacts ; arythmie fréquente qui dégrade l’image ; gadolinium à dose minimale si DFG &lt; 30 mL/min/1,73 m².</p>
<div class="lab">Pourquoi le rehaussement tardif</div><p>Le gadolinium reste hors des cellules. Dans un myocarde sain, cet espace est étroit et le produit repart vite. Une nécrose ou une fibrose élargit l’espace extracellulaire et retarde l’élimination : plusieurs minutes après l’injection, la zone apparaît blanche. Chez l’animal, l’étendue du rehaussement correspond à celle de la nécrose, puis de la cicatrice collagène.</p>
<div class="lab">Ce qui change la décision</div><p>Un rehaussement fait renoncer au diagnostic de TV idiopathique et oriente vers une cicatrice, une cardiomyopathie, une myocardite ou une sarcoïdose : le risque et la place du DAI changent alors. L’ESC 2022 recommande d’envisager l’IRM (classe IIa) chez le patient dont les extrasystoles ou la TV n’ont pas l’aspect typique d’une forme idiopathique, même avec une échocardiographie normale. Devant une cardiomyopathie attribuée aux extrasystoles, un rehaussement oriente plutôt vers une cardiopathie sous-jacente.</p>
<div class="lab">Source complémentaire</div><p>Kim et al., Circulation 1999;100:1992-2002 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, sections 5.1 et 7.1.2.2.</p>
</template>

<template data-pop="i47-holter" data-title="Holter dans les tachycardies">
<div class="lab">Indication</div><p>Symptômes quotidiens ou presque ; quantification des extrasystoles (charge en pourcentage) ; recherche de TVNS ; pré-excitation intermittente ; contrôle d’un traitement (QTc, fréquence).</p>
<div class="lab">Lecture</div><p>Corréler chaque symptôme du journal au tracé. Une TSV paroxystique apparaît comme une accélération brutale régulière ; une tachycardie sinusale comme une accélération progressive. Une charge d’extrasystoles ventriculaires &gt; 10 % justifie une surveillance de la FEVG.</p>
<div class="lab">Limite</div><p>Durée courte ; rendement faible pour des crises mensuelles. Un Holter normal n’exclut pas une TSV.</p>
<div class="lab">Pourquoi une charge de 10 %</div><p>La charge d’extrasystoles est le principal facteur prédictif d’une cardiomyopathie induite par les extrasystoles. Une charge d’au moins 10 % semble le seuil minimal, et le risque augmente au-delà de 20 %. Cette atteinte régresse souvent après suppression des extrasystoles, d’où l’intérêt de surveiller la FEVG. La charge variant d’un jour à l’autre, un Holter de 24 heures peut la sous-estimer.</p>
<div class="lab">Pourquoi l’accélération diffère</div><p>Le nœud sinusal accélère progressivement, au rythme du tonus sympathique. Une réentrée démarre dès qu’une extrasystole trouve le circuit prêt : la fréquence atteint son plateau en un battement.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 7.1.2.2.</p>
</template>

<template data-pop="i47-ilr" data-title="Moniteur ECG implantable">
<div class="lab">Principe</div><p>Petit enregistreur placé sous la peau, en région parasternale gauche, sous anesthésie locale ; enregistre automatiquement les arythmies et à la demande du patient ; transmission à distance ; autonomie d’environ trois ans.</p>
<div class="lab">Indications</div><p>Syncope récidivante inexpliquée après bilan initial ; palpitations rares mais invalidantes non documentées ; syncope dans un syndrome de Brugada ou un QT long pour décider d’un DAI (ESC 2022).</p>
<div class="lab">Limite</div><p>Une seule dérivation ; artefacts ; il ne traite rien : une syncope à haut risque justifie parfois directement un DAI.</p></template>

<template data-pop="i47-effort" data-title="Épreuve d’effort rythmologique">
<div class="lab">TVPC</div><p>Examen diagnostique clé : extrasystoles ventriculaires apparaissant à un seuil de fréquence reproductible (vers 100–120/min), puis doublets, bigéminisme, TV bidirectionnelle ou polymorphe ; disparition rapide à l’arrêt. Aussi utilisé pour évaluer l’efficacité du traitement.</p>
<div class="lab">QT long</div><p>Le QT ne se raccourcit pas assez à l’effort ; QTc ≥ 480 ms à la 4e minute de récupération : argument en faveur (1 point au score de Schwartz), surtout pour le type 1.</p>
<div class="lab">Pré-excitation</div><p>Disparition brutale et complète de l’onde delta d’un battement à l’autre : voie à période réfractaire longue, faible risque. Une disparition progressive est sans valeur (elle traduit l’accélération nodale).</p>
<div class="lab">Autres</div><p>TV de la chambre de chasse ; flécaïnide (élargissement du QRS à l’effort) ; aptitude sportive.</p>
<div class="lab">Sécurité</div><p>Défibrillateur disponible, personnel formé ; arrêt si TV soutenue.</p>
<div class="lab">Pourquoi l’effort révèle ces maladies</div><p>Dans la TVPC, l’adrénaline fait fuir le calcium du réticulum par un récepteur de la ryanodine anormal ; les post-dépolarisations tardives apparaissent au-delà d’un seuil de fréquence, d’où des extrasystoles de plus en plus complexes quand l’effort monte. Dans le QT long de type 1, le courant IKs, que l’adrénaline renforce pour raccourcir le QT, fait défaut : le QT s’adapte mal, surtout en récupération. Dans une pré-excitation, une disparition brutale de l’onde delta signifie que la voie s’est bloquée à cette fréquence, donc que sa période réfractaire est longue.</p>
<div class="lab">Place selon l’ESC 2022</div><p>L’épreuve d’effort est l’examen diagnostique le plus important de la TVPC. Les tests à l’adrénaline ou à l’isoprénaline ne la remplacent que si l’effort est impossible (classe IIb). Des arythmies complexes à l’effort malgré un bêtabloquant à pleine dose prédisent des événements : l’épreuve sert donc aussi à juger le traitement.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 7.2.6 ; Schwartz et al., Circulation 2001;103:89-95.</p>
</template>

<template data-pop="i47-standing" data-title="Test d’orthostatisme (QT long)">
<div class="lab">Technique</div><p>ECG en décubitus, puis lever rapide du patient ; enregistrement continu pendant la tachycardie réflexe.</p>
<div class="lab">Résultat normal</div><p>Le QT raccourcit rapidement quand la fréquence augmente.</p>
<div class="lab">Résultat anormal</div><p>Le QT ne raccourcit pas, voire s’allonge transitoirement, malgré l’accélération : le QTc s’élève nettement. Oriente vers un QT long congénital chez un patient dont le QTc de repos est limite.</p>
<div class="lab">Statut</div><p>Test simple mis en avant par l’ESC 2022 ; aide au diagnostic, non critère isolé. Le test à l’épinéphrine n’est plus recommandé (III).</p>
<div class="lab">Pourquoi le test fonctionne</div><p>Le QT ne raccourcit pas instantanément quand la fréquence monte. Au lever brusque, la fréquence augmente en moyenne de 28/min en quelques secondes. Chez les témoins, le QT raccourcit d’environ 21 ms ; chez les patients porteurs d’un QT long, il s’allonge en moyenne de 4 ms, et la réponse est surtout altérée dans le type 2. Le QTc mesuré au pic de tachycardie s’élève donc davantage chez eux : de 89 ms en moyenne, contre 50 ms chez les témoins.</p>
<div class="lab">Limite</div><p>Le QTc augmente aussi chez le sujet sain pendant cette tachycardie brève, car la correction surestime le QT aux fréquences rapides. Le résultat s’interprète donc avec l’ECG de repos, la clinique et le score diagnostique.</p>
<div class="lab">Source complémentaire</div><p>Viskin et al., The response of the QT interval to the brief tachycardia provoked by standing: a bedside test for diagnosing long QT syndrome, Journal of the American College of Cardiology 2010;55:1955-61.</p>
</template>

<template data-pop="i47-k" data-title="Potassium et arythmies">
<div class="lab">Normes</div><p>3,5–5,0 mmol/L (sérum).</p>
<div class="lab">Hypokaliémie</div><p>Réduit l’activité du courant IKr : QT et onde U allongés, post-dépolarisations précoces, torsades ; potentialise la toxicité de la digoxine. Causes : diurétiques, vomissements, diarrhée, laxatifs, anorexie, hyperaldostéronisme, insuline, bêta-agonistes.</p>
<div class="lab">Hyperkaliémie</div><p>Ondes T pointues, puis PR allongé, P aplaties, QRS élargi, aspect sinusoïdal, FV ou asystolie. Traitement d’urgence : gluconate de calcium intraveineux, insuline et glucose, bêta-agoniste, épuration.</p>
<div class="lab">Cible</div><p>4,5–5,0 mmol/L dans les torsades ; au moins 4,0 mmol/L chez tout patient sous médicament allongeant le QT ou après une TV.</p>
<div class="lab">Pourquoi l’hypokaliémie allonge le QT</div><p>Un potassium extracellulaire bas augmente la force qui pousse le potassium hors de la cellule, mais il réduit davantage la conductance des canaux IKr et IK1 : le courant de repolarisation baisse. Il freine aussi la pompe sodium-potassium ; le sodium, puis le calcium, s’accumulent dans la cellule et favorisent les post-dépolarisations. Enfin, les médicaments bloquent plus fortement IKr quand le potassium est bas. D’où les torsades chez le patient sous diurétique qui reçoit un médicament allongeant le QT.</p>
<div class="lab">Pourquoi l’hyperkaliémie élargit le QRS</div><p>Un potassium élevé augmente la conductance potassique et raccourcit la repolarisation, ce qui pointe les ondes T. Il dépolarise aussi le potentiel de repos et inactive une partie des canaux sodiques : la conduction ralentit, l’onde P s’efface et le QRS s’élargit jusqu’à l’aspect sinusoïdal. Cet élargissement diffus peut simuler une TV, sans que chaque QRS corresponde à un foyer ventriculaire ; l’hyperkaliémie peut aussi déclencher de véritables arythmies ventriculaires. L’ECG, la kaliémie et leur évolution distinguent ces situations. Un bloqueur sodique donné à tort peut aggraver le ralentissement de conduction.</p>
<div class="lab">Ce qui change la décision</div><p>Une valeur isolée ne fixe pas la conduite : la fonction rénale, les diurétiques, les médicaments associés et la vitesse de variation comptent autant. Le seuil de 4,0 mmol/L chez le patient sous médicament allongeant le QT est un repère de pratique : l’ESC 2022 demande de corriger les déficits sans fixer de valeur.</p>
<div class="lab">Source complémentaire</div><p>Weiss et al., Electrophysiology of hypokalemia and hyperkalemia, Circulation: Arrhythmia and Electrophysiology 2017;10:e004667 ; Yang et Roden, Extracellular potassium modulation of drug block of IKr, Circulation 1996;93:407-11 ; Drew et al., Prevention of torsade de pointes in hospital settings, Circulation 2010;121:1047-60 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, tableau de recommandations 9.</p>
</template>

<template data-pop="i47-mg" data-title="Magnésium et arythmies">
<div class="lab">Normes</div><p>0,70–1,00 mmol/L (sérum) ; le magnésium sérique reflète mal le stock intracellulaire.</p>
<div class="lab">Rôle</div><p>Cofacteur de la pompe Na⁺/K⁺-ATPase ; freinerait le courant calcique de type L et les post-dépolarisations précoces d’après les données expérimentales, mais son mécanisme antiarythmique n’est pas établi chez l’homme (Drew et al., 2010).</p>
<div class="lab">Causes de carence</div><p>Diurétiques, alcool, inhibiteurs de la pompe à protons au long cours, diarrhée, malnutrition, diabète déséquilibré.</p>
<div class="lab">Conséquence</div><p>Corriger l’hypomagnésémie en parallèle de l’hypokaliémie : sans correction du magnésium, la fuite rénale peut rendre l’hypokaliémie réfractaire aux apports. Sulfate de magnésium intraveineux dans les torsades, même si la magnésémie est normale.</p>
<div class="lab">Pourquoi corriger les deux déficits</div><p>Dans le tubule rénal distal, le magnésium intracellulaire freine les canaux qui sécrètent le potassium. Une carence lève ce frein : le rein perd du potassium, et l’hypokaliémie résiste aux apports tant que le magnésium reste bas. Cette perte suppose en général un apport distal de sodium accru ou un excès d’aldostérone, deux situations fréquentes sous diurétique. Devant une hypokaliémie qui résiste aux apports, on recherche donc une carence en magnésium.</p>
<div class="lab">Source complémentaire</div><p>Huang et al., Mechanism of hypokalemia in magnesium deficiency, Journal of the American Society of Nephrology 2007;18:2649-52.</p>
</template>

<template data-pop="i47-genet" data-title="Analyse génétique dans les canalopathies">
<div class="lab">Qui tester</div><p>Le cas index ayant un diagnostic clinique solide (QT long, TVPC, syndrome de Brugada), après conseil génétique ; puis les apparentés, de façon ciblée sur le variant familial (ESC 2022, classe I). Pas de test sur un simple doute ou un QTc limite isolé.</p>
<div class="lab">Résultats</div><p><b>Pathogène ou probablement pathogène</b> : confirme, guide le traitement (type de QT long) et permet le dépistage familial. <b>Signification incertaine</b> : ne pas utiliser pour la famille ; réinterpréter avec le temps. <b>Négatif</b> : n’exclut pas la maladie.</p>
<div class="lab">Rendement</div><p>QT long ≈ 75–80 % ; TVPC ≈ 60 % ; Brugada ≈ 20 %.</p>
<div class="lab">Cadre</div><p>Loi fédérale sur l’analyse génétique humaine ; consentement éclairé ; conseil non directif ; prise en charge par l’assurance obligatoire selon la liste des analyses.</p>
<div class="lab">Pourquoi le rendement diffère</div><p>Dans le QT long, trois gènes de canaux représentent 90 % des cas génotypés, et un variant est trouvé chez environ 75 % des patients. Dans le Brugada, seul <i>SCN5A</i> a un lien établi ; le phénotype dépend aussi de nombreux variants communs de faible effet, résumés par un score de risque polygénique. Le test n’y trouve un variant que chez environ 20 % des patients : un résultat négatif n’exclut donc pas la maladie.</p>
<div class="lab">Pourquoi une équipe spécialisée</div><p>Classer un variant, choisir les apparentés à tester et expliquer les conséquences d’un résultat demandent une expertise que l’ESC 2022 confie à une équipe multidisciplinaire spécialisée (classe I). Un variant de signification incertaine n’a pas de lien démontré avec la maladie : s’en servir pour la famille pourrait rassurer à tort un apparenté malade non porteur, ou inquiéter à tort un porteur sain. L’ESC 2022 recommande donc d’étudier sa ségrégation dans la famille et de le réévaluer périodiquement (classe I), et déconseille le test chez un cas index sans argument clinique suffisant (classe III).</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, sections 5.1.4, 7.2.2 et 7.2.4, tableau de recommandations 2.</p>
</template>

<template data-pop="i47-ajmaline" data-title="Test aux bloqueurs sodiques">
<div class="lab">Principe</div><p>Un bloqueur sodique accentue le déséquilibre des courants dans l’épicarde de la chambre de chasse droite et démasque un aspect de type 1 de Brugada.</p>
<div class="lab">Protocole</div><p>Ajmaline 1 mg/kg en 5 à 10 minutes (produit importé, non commercialisé en Suisse selon PharmaWiki), ou flécaïnide 2 mg/kg (maximum 150 mg) en 10 minutes ; ECG continu avec précordiales droites en 2e, 3e et 4e espaces intercostaux ; milieu équipé pour la réanimation.</p>
<div class="lab">Arrêt</div><p>Apparition d’un type 1 (test positif) ; élargissement du QRS de plus de 30 % (ajmaline) ; extrasystoles ventriculaires ou TV ; bloc de haut degré.</p>
<div class="lab">Interprétation (ESC 2022)</div><p>Un type 1 induit seul ne suffit plus pour affirmer le syndrome : il faut un critère clinique ou familial associé. Les faux positifs existent, en particulier avec l’ajmaline.</p>
<div class="lab">Contre-indications</div><p>Type 1 spontané déjà présent ; fièvre ; trouble de conduction important sans stimulateur.</p>
<div class="lab">Pourquoi le test est encadré</div><p>Le bloqueur sodique réduit le courant de la phase 0. Dans l’épicarde de la chambre de chasse droite, le courant transitoire sortant n’est plus équilibré, et une réentrée de phase 2 peut déclencher une FV. Le test se fait donc avec défibrillateur et réanimation disponibles, et s’arrête dès l’apparition du type 1. Il n’apporte que du risque si un type 1 spontané est déjà présent (classe III).</p>
<div class="lab">Fréquence des faux positifs</div><p>Un type 1 induit apparaît chez 2 à 4 % des sujets sains, et, dans une étude, plus souvent chez les porteurs d’une TRIN ou d’une voie accessoire : ce manque de spécificité impose le critère associé.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, section 7.2.4 et tableau de recommandations 43.</p>
</template>
<template data-pop="i47-digox" data-title="Intoxication digitalique">
<div class="lab">Physiologie normale</div><p>La pompe sodium-potassium expulse le sodium du myocyte et y fait entrer le potassium. Le gradient de sodium qu’elle entretient permet à l’échangeur sodium-calcium de chasser le calcium après chaque contraction.</p>
<div class="lab">Mécanisme</div><p>La digoxine inhibe cette pompe. Le sodium s’accumule dans la cellule, l’échangeur expulse moins de calcium et le réticulum se charge : la contraction se renforce, c’est l’effet recherché. À dose toxique, la surcharge calcique provoque des libérations spontanées de calcium et des post-dépolarisations tardives : l’automatisme augmente dans les oreillettes, la jonction et les ventricules. La digoxine renforce aussi le tonus vagal sur les nœuds et ralentit la conduction.</p>
<div class="lab">Conséquence clinique</div><p>L’association d’un automatisme accru et d’un trouble de conduction signe l’intoxication : tachycardie atriale avec bloc, tachycardie jonctionnelle, extrasystoles ventriculaires fréquentes, bradycardies. La TV bidirectionnelle, plus rare, relève du même mécanisme de post-dépolarisations tardives que la TVPC. L’insuffisance rénale, qui réduit l’élimination de la digoxine, et l’hypokaliémie favorisent l’intoxication.</p>
<div class="lab">Ce qui change la décision</div><p>La conduite dépend de l’état clinique et du tracé plus que du dosage isolé. Les fragments d’anticorps antidigoxine fixent la molécule et sont réservés aux atteintes cardiovasculaires menaçantes. Le dosage sert aussi à ajuster le traitement : dans une analyse post hoc d’un grand essai d’insuffisance cardiaque, une concentration de 0,5 à 0,8 ng/mL s’associait, chez des hommes, à une mortalité plus basse que les concentrations plus élevées. Cette association ne prouve pas qu’un taux bas protège par lui-même.</p>
<div class="lab">Source</div><p>Smith, Digitalis: mechanisms of action and clinical use, New England Journal of Medicine 1988;318:358-65 ; Ma et al., Electrocardiographic manifestations: digitalis toxicity, Journal of Emergency Medicine 2001;20:145-52 ; Rathore et al., Association of serum digoxin concentration and outcomes in patients with heart failure, JAMA 2003;289:871-8.</p>
</template>
