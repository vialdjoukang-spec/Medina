
<!-- ===== FENÊTRES I47 : prise en charge ===== -->
<template data-pop="i47-cv" data-title="Cardioversion électrique synchronisée dans les tachycardies">
<div class="lab">Principe</div><p>Un choc dépolarise simultanément tout le myocarde excitable et interrompt les circuits de réentrée. Il est <b>synchronisé</b> sur l’onde R pour ne pas tomber sur la période vulnérable de l’onde T, où il pourrait déclencher une FV.</p>
<div class="lab">Technique</div><p>Patient conscient : sédation courte par un médecin formé, monitorage, oxygène, aspiration prête. Électrodes autocollantes en position antéropostérieure ou antérolatérale. Vérifier l’affichage des marqueurs de synchronisation sur chaque QRS ; les resynchroniser après chaque choc sur les appareils qui se désynchronisent.</p>
<div class="lab">Énergies (ERC 2025, choc biphasique)</div><p>TV avec pouls : 120–150 J au premier choc. Flutter et TSV régulière à QRS fins : 70–120 J. Fibrillation auriculaire, y compris pré-excitée : premier choc synchronisé à l’énergie maximale de l’appareil. En cas d’échec, augmenter l’énergie par paliers, jusqu’à trois tentatives, puis administrer de l’amiodarone.</p>
<div class="lab">Échec</div><p>Tachycardie automatique (qui redémarre aussitôt) ou TV incessante : amiodarone puis nouveau choc. Une TV polymorphe ou une FV relève d’un choc <b>non synchronisé</b> (défibrillation), la synchronisation étant impossible.</p>
<div class="lab">Porteur de stimulateur ou de DAI</div><p>Électrodes à au moins 8 cm du boîtier ; contrôle du dispositif après le choc.</p></template>

<template data-pop="i47-adeno" data-title="Adénosine">
<div class="lab">Mécanisme</div><p>Agoniste du récepteur de l’adénosine de type 1 : ouverture d’un courant potassique, hyperpolarisation, baisse de l’AMPc ; bloc du nœud auriculoventriculaire pendant quelques secondes. Demi-vie &lt; 10 secondes.</p>
<div class="lab">Preuves et place</div><p>Arrêt de 90 % environ des TRIN et des TRAV ; premier choix après échec des manœuvres vagales (classe I, ESC 2019). Outil diagnostique dans les tachycardies à QRS fins et dans certaines tachycardies régulières à QRS larges sans pré-excitation (IIa).</p>
<div class="lab">Posologie</div><p>6 mg en bolus intraveineux rapide, dans une veine proche du cœur (pli du coude), suivi immédiatement de 20 mL de sérum physiologique, bras surélevé ; puis 12 mg, puis 18 mg (ESC 2019). Dose réduite à 3 mg : voie centrale, cœur transplanté (dénervé, hypersensible), dipyridamole, carbamazépine.</p>
<div class="lab">Pièges</div><p>Injection trop lente ou trop distale : l’adénosine est dégradée avant d’atteindre le cœur. Théophylline et consommation récente de caféine : effet diminué, dose plus élevée nécessaire. Enregistrer l’ECG à 12 dérivations pendant l’injection : la réponse est l’information diagnostique.</p>
<div class="lab">Effets indésirables</div><p>Flush, oppression thoracique, dyspnée, sentiment de mort imminente pendant quelques secondes (prévenir le patient) ; asystolie brève ; fibrillation auriculaire induite (quelques pour cent), dangereuse en cas de voie accessoire.</p>
<div class="lab">Contre-indications</div><p>Asthme sévère ou bronchospasme actif ; bloc auriculoventriculaire de haut degré ou dysfonction sinusale sans stimulateur ; tachycardie irrégulière à QRS larges (FA pré-excitée). Défibrillateur disponible systématiquement.</p></template>

<template data-pop="i47-tdp-tt" data-title="Traitement des torsades de pointes">
<div class="lab">1. Si instabilité</div><p>Défibrillation non synchronisée si FV ou torsade soutenue.</p>
<div class="lab">2. Supprimer la cause</div><p>Arrêter tous les médicaments allongeant le QT ; rechercher une bradycardie ou un bloc.</p>
<div class="lab">3. Magnésium</div><p>Sulfate de magnésium 2 g par voie intraveineuse en 10 minutes (en bolus en cas d’arrêt), même si la magnésémie est normale ; renouvelable une fois. Il supprime les post-dépolarisations précoces sans raccourcir beaucoup le QT.</p>
<div class="lab">4. Potassium</div><p>Objectif 4,5–5,0 mmol/L : l’hypokaliémie réduit le courant IKr et allonge le QT.</p>
<div class="lab">5. Accélérer la fréquence</div><p>Si les torsades dépendent des pauses : stimulation temporaire (environ 90–110/min) ou isoprénaline, sauf QT long congénital adrénergique et ischémie.</p>
<div class="lab">À proscrire</div><p>Amiodarone, sotalol et tout antiarythmique de classe Ia ou III.</p>
<div class="lab">QT long congénital</div><p>Bêtabloquant (propranolol), stimulation si pauses ; mexilétine ou lidocaïne dans le type 3.</p></template>

<template data-pop="i47-orage" data-title="Orage rythmique">
<div class="lab">Définition</div><p>Au moins trois épisodes de TV ou de FV soutenues en 24 heures, ou trois interventions appropriées d’un DAI (stimulation antitachycardique ou choc), chaque épisode étant séparé d’au moins 5 minutes.</p>
<div class="lab">Déclencheurs</div><p>Ischémie, aggravation de l’insuffisance cardiaque, hypokaliémie, hyperthyroïdie (amiodarone), infection, médicament proarythmique, arrêt du bêtabloquant.</p>
<div class="lab">Conduite (ESC 2022)</div><p>Soins intensifs ; correction des déclencheurs ; sédation légère à modérée, qui réduit le tonus sympathique (classe I) ; sédation profonde et intubation si l’orage persiste (classe IIa) ; bêtabloquant non sélectif (propranolol) et amiodarone ; reprogrammation du DAI ; ablation par cathéter en cas d’échec (classe I) ; blocage ou dénervation sympathique ; assistance circulatoire mécanique chez des patients sélectionnés (IIb). Syndrome de Brugada : isoprénaline et quinidine. TVPC : sédation, propranolol, flécaïnide.</p>
<div class="lab">Pronostic</div><p>L’orage rythmique multiplie le risque de décès dans les mois suivants ; il impose une réévaluation complète du substrat.</p></template>

<template data-pop="i47-abl-tsv" data-title="Ablation par cathéter des tachycardies supraventriculaires">
<div class="lab">Principe</div><p>Sous anesthésie locale et sédation, cathéters introduits par la veine fémorale ; EEP pour déclencher la tachycardie et identifier le circuit ; application de radiofréquence (chaleur) ou de cryothérapie (froid) sur un point critique.</p>
<div class="lab">Cibles et succès (ESC 2019)</div><p>TRIN : voie lente, succès &gt; 95 %. Voie accessoire : succès d’environ 90–95 % (moins pour les voies septales et épicardiques). Tachycardie atriale focale : succès de l’ordre de 85–90 %. Flutter typique : isthme cavotricuspide (chapitre I48).</p>
<div class="lab">Risques</div><p>Bloc auriculoventriculaire nécessitant un stimulateur (&lt; 1 % pour la TRIN, plus pour les voies septales) ; complications vasculaires ; tamponnade (rare, voies gauches par voie transseptale ou rétroaortique) ; embolie cérébrale (voies gauches).</p>
<div class="lab">Après</div><p>Reprise des activités en quelques jours ; pas de traitement au long cours ; récidive de l’ordre de quelques pour cent, traitée par une nouvelle ablation.</p>
<div class="lab">Grossesse</div><p>Possible sans rayons X, par cartographie électroanatomique, dans un centre expérimenté (IIa), pour les TSV réfractaires et mal tolérées.</p></template>

<template data-pop="i47-eep" data-title="Exploration électrophysiologique (EEP)">
<div class="lab">Technique</div><p>Cathéters multipolaires dans l’oreillette droite haute, sur le faisceau de His, dans le sinus coronaire et le ventricule droit ; enregistrement des électrogrammes intracavitaires et stimulation programmée.</p>
<div class="lab">Mesures</div><p>Intervalle AH (conduction nodale, 50–120 ms) ; intervalle HV (conduction sous-hisienne, 35–55 ms) ; périodes réfractaires ; séquence d’activation atriale rétrograde (concentrique : nodale ; excentrique : voie accessoire latérale).</p>
<div class="lab">Indications dans ce chapitre</div><p>Préalable à toute ablation ; stratification d’une pré-excitation asymptomatique ; tachycardie à QRS larges douteuse ; syncope chez un patient porteur d’une cicatrice (inductibilité d’une TV).</p>
<div class="lab">Stratification d’une voie accessoire</div><p>Avec isoprénaline : intervalle RR pré-excité le plus court en FA induite ≤ 250 ms, période réfractaire antérograde ≤ 250 ms, voies multiples, tachycardie inductible : haut risque.</p>
<div class="lab">Risques</div><p>Faibles : hématome, thrombose veineuse, rarement tamponnade.</p></template>

<template data-pop="i47-wpw-asympt" data-title="Pré-excitation asymptomatique : démarche (ESC 2019)">
<div class="lab">1. Profession ou loisir à risque, athlète de compétition</div><p>EEP avec isoprénaline (classe I) ; ablation si marqueur de haut risque (classe I).</p>
<div class="lab">2. Autres sujets</div><p>EEP à envisager (classe IIa). Une évaluation non invasive (pré-excitation intermittente, disparition brutale à l’effort) peut être envisagée (classe IIb) ; si elle montre une voie à faible risque, la surveillance est acceptable.</p>
<div class="lab">3. Voie à faible risque</div><p>Abstention et information du patient, ou ablation en décision partagée dans un centre expérimenté, en particulier si le geste comporte peu de risque (voie latérale gauche ou droite éloignée du His).</p>
<div class="lab">4. Dysfonction ventriculaire par asynchronisme</div><p>Certaines voies droites, surtout chez l’enfant, désynchronisent la contraction et altèrent la FEVG : l’ablation se discute alors même sans arythmie.</p>
<div class="lab">Information</div><p>Consulter immédiatement en cas de palpitations ; pas de bêtabloquant ni de vérapamil de sa propre initiative.</p></template>

<template data-pop="i47-dai" data-title="Défibrillateur automatique implantable (DAI)">
<div class="lab">Fonctionnement</div><p>Il détecte la fréquence et la morphologie des QRS ; dans la zone de TV, il délivre d’abord une stimulation antitachycardique (efficace sur la majorité des TV monomorphes, indolore), puis un choc ; dans la zone de FV, il délivre d’emblée un choc.</p>
<div class="lab">Types</div><p><b>Transveineux</b> : sondes dans le cœur ; stimulation antibradycardique et antitachycardique ; possibilité de resynchronisation. <b>Sous-cutané</b> : sonde parasternale sous la peau, sans risque d’endocardite de sonde ; pas de stimulation ; indiqué surtout chez le jeune sans besoin de stimulation (canalopathies), après dépistage de la morphologie ECG. <b>Extravasculaire</b> (sonde rétrosternale) : alternative récente. <b>Portable</b> : gilet temporaire.</p>
<div class="lab">Indications (ESC 2022)</div><p>Prévention secondaire : FV ou TV mal tolérée sans cause réversible (I). Prévention primaire : cardiopathie ischémique avec FEVG ≤ 35 %, NYHA II–III, après 3 mois de traitement optimal et 6 semaines après l’infarctus (I) ; cardiomyopathie dilatée non ischémique avec FEVG ≤ 35 % (IIa) ; critères propres aux canalopathies et cardiomyopathies.</p>
<div class="lab">Preuves</div><p>AVID, CIDS, CASH (secondaire) ; MADIT-II, SCD-HeFT (primaire, ischémique et mixte) ; DANISH (non ischémique : pas de baisse significative de la mortalité totale).</p>
<div class="lab">Inconvénients</div><p>Chocs inappropriés (FA rapide, tachycardie sinusale, bruit de sonde), complications des sondes, infection, anxiété, restrictions de conduite. Discuter la désactivation de la fonction de choc en fin de vie.</p></template>

<template data-pop="i47-schwartz" data-title="Score de Schwartz du QT long">
<div class="lab">ECG (en l’absence de médicament ou de trouble allongeant le QT)</div><p>QTc ≥ 480 ms : 3 ; 460–479 ms : 2 ; 450–459 ms chez l’homme : 1. QTc ≥ 480 ms à la 4e minute de récupération d’effort : 1. Torsades de pointes : 2. Alternance de l’onde T : 1. Onde T encochée dans trois dérivations : 1. Fréquence basse pour l’âge : 0,5.</p>
<div class="lab">Clinique</div><p>Syncope avec stress : 2 ; sans stress : 1 (torsades et syncope ne se cumulent pas). Surdité congénitale : 0,5.</p>
<div class="lab">Famille</div><p>Apparenté avec QT long certain : 1. Mort subite inexpliquée avant 30 ans chez un apparenté du premier degré : 0,5 (les deux items familiaux ne se cumulent pas pour le même apparenté).</p>
<div class="lab">Lecture</div><p>≤ 1 : probabilité faible ; 1,5–3 : intermédiaire ; ≥ 3,5 : élevée. L’ESC 2022 retient un score &gt; 3 comme critère diagnostique (classe I).</p>
<div class="lab">Exemple</div><p>Adolescente, QTc 470 ms (2), syncope à l’émotion (2), onde T encochée (1) : 5 points, probabilité élevée.</p></template>

<template data-pop="i47-brugada" data-title="Syndrome de Brugada">
<div class="lab">Mécanisme</div><p>Deux hypothèses complémentaires : repolarisation (courant transitoire sortant dominant dans l’épicarde de la chambre de chasse droite, perte du dôme du potentiel d’action, réentrée de phase 2) et dépolarisation (conduction lente sur une fibrose épicardique discrète).</p>
<div class="lab">Clinique</div><p>Homme de 30 à 50 ans surtout ; syncope ou mort subite au repos, la nuit, après un repas copieux ou pendant la fièvre ; respiration agonique nocturne rapportée par le conjoint.</p>
<div class="lab">Stratification</div><p>Haut risque : arrêt cardiaque (DAI, I), syncope arythmique (DAI, IIa), type 1 spontané. Faible risque : type 1 seulement induit, asymptomatique. L’EEP peut être envisagée chez l’asymptomatique à type 1 spontané (IIb).</p>
<div class="lab">Mesures pour tous</div><p>Paracétamol dès 38 °C ; liste brugadadrugs.org ; éviter les excès d’alcool, les gros repas, la cocaïne ; dépistage familial.</p></template>

<template data-pop="i47-reppre" data-title="Repolarisation précoce, QT court, FV idiopathique">
<div class="lab">Aspect de repolarisation précoce</div><p>Élévation du point J ≥ 1 mm dans au moins deux dérivations inférieures ou latérales contiguës (encoche ou empâtement terminal du QRS). Fréquent et bénin chez le sujet jeune et l’athlète. On parle de <b>syndrome</b> seulement chez un patient réanimé d’une FV idiopathique ou TV polymorphe (ESC 2022).</p>
<div class="lab">QT court</div><p>QTc ≤ 360 ms avec variant pathogène, histoire familiale ou arrêt cardiaque, ou QTc ≤ 320 ms isolé ; gain de fonction de canaux potassiques ; FA et FV. Traitement : DAI après arrêt ; quinidine.</p>
<div class="lab">FV idiopathique</div><p>Arrêt par FV sans cause après bilan complet (IRM, coronarographie, test aux bloqueurs sodiques, épreuve d’effort, génétique). DAI ; extrasystoles déclenchantes de Purkinje parfois accessibles à l’ablation.</p></template>

<template data-pop="i47-msj" data-title="Mort subite du sujet jeune : démarche">
<div class="lab">Autopsie</div><p>Autopsie complète avec examen cardiaque par un pathologiste spécialisé ; toxicologie ; conservation de sang prélevé sur tube anticoagulé ou de tissu congelé pour une analyse génétique post mortem ciblée sur les canalopathies et cardiomyopathies.</p>
<div class="lab">Autopsie blanche</div><p>Si le cœur est normal : canalopathie présumée ; l’analyse génétique post mortem identifie un variant dans une part notable des cas.</p>
<div class="lab">Famille</div><p>Évaluation des apparentés du premier degré dans une consultation spécialisée : anamnèse, ECG (y compris dérivations hautes), épreuve d’effort, échocardiographie, Holter, test aux bloqueurs sodiques selon le contexte, génétique ciblée si un variant est trouvé.</p>
<div class="lab">Cadre suisse</div><p>La conservation d’échantillons et l’analyse génétique post mortem relèvent du médecin légiste et de la loi fédérale sur l’analyse génétique humaine ; le consentement des proches est requis pour l’analyse à visée familiale.</p></template>

<template data-pop="i47-credible" data-title="CredibleMeds : médicaments allongeant le QT">
<div class="lab">Base</div><p>Base en ligne tenue par une organisation américaine à but non lucratif, issue de l’Université de l’Arizona (crediblemeds.org), mise à jour régulièrement ; accès gratuit après inscription ; version pour application mobile.</p>
<div class="lab">Catégories</div><p><b>Risque connu</b> : allongent le QT et causent des torsades même aux doses usuelles. <b>Risque possible</b> : allongent le QT sans preuve suffisante de torsades. <b>Risque conditionnel</b> : torsades seulement dans certaines conditions (surdosage, hypokaliémie, interaction). <b>À éviter dans le QT long congénital</b> : liste spécifique, incluant des sympathomimétiques.</p>
<div class="lab">Exemples à risque connu</div><p>Psychotropes : citalopram, escitalopram, halopéridol, chlorpromazine, méthadone. Anti-infectieux : clarithromycine, érythromycine, azithromycine, lévofloxacine, moxifloxacine, ciprofloxacine, fluconazole, hydroxychloroquine. Autres : ondansétron, dompéridone, donépézil, amiodarone, sotalol, flécaïnide.</p>
<div class="lab">Conduite</div><p>Chercher chaque molécule ; ECG avant et après l’introduction chez le patient à risque ; potassium et magnésium normaux ; arrêt si QTc &gt; 500 ms ou hausse &gt; 60 ms ; éviter les associations.</p>
<div class="lab">Piège</div><p>La classification varie dans le temps : consulter la version en ligne, non une liste imprimée ancienne.</p></template>

<template data-pop="i47-sport" data-title="Sport et tachycardies">
<div class="lab">TSV</div><p>Athlète avec TRIN ou TRAV récidivante : l’ablation permet la reprise du sport de compétition. Pré-excitation chez un athlète de compétition : EEP avec isoprénaline et ablation si haut risque (ESC 2019 et ESC 2020).</p>
<div class="lab">QT long (repères ESC 2020)</div><p>Sport intense et compétition déconseillés si QTc &gt; 500 ms, si QTc ≥ 470 ms (homme) ou ≥ 480 ms (femme) avec génotype confirmé, et après arrêt cardiaque ou syncope arythmique. Chez l’asymptomatique sous bêtabloquant, avec un QTc inférieur à ces seuils, la compétition peut être discutée après décision partagée. Type 1 : natation sous surveillance.</p>
<div class="lab">Brugada</div><p>Sport possible chez l’asymptomatique ; éviter l’hyperthermie (température centrale &gt; 39 °C), s’hydrater.</p>
<div class="lab">TVPC</div><p>Sport intense et compétition déconseillés, y compris chez le porteur asymptomatique.</p>
<div class="lab">Porteur de DAI</div><p>Activité d’intensité modérée encouragée ; compétition envisageable au cas par cas selon la maladie sous-jacente ; éviter les sports de contact violents sur la loge.</p>
<div class="lab">Principe</div><p>Décision partagée et documentée ; réévaluation annuelle.</p></template>

<div class="lab">Référence</div><p>Directives de la Société suisse de cardiologie et de la Société suisse de médecine légale, « Aptitude à la conduite et maladies cardiovasculaires », 2e édition, octobre 2024.</p>

<template data-pop="i47-grossesse" data-title="Grossesse et tachycardies">
<div class="lab">Traitement aigu (ESC 2019)</div><p>Manœuvres vagales, puis adénosine (classe I) ; cardioversion électrique à tout trimestre si instabilité, avec surveillance fœtale ; bêtabloquant β1-sélectif intraveineux (IIa).</p>
<div class="lab">Prévention</div><p>Éviter si possible tout antiarythmique au premier trimestre. Sans pré-excitation : bêtabloquant β1-sélectif (métoprolol, bisoprolol ; pas d’aténolol, associé à un retard de croissance) ou vérapamil (IIa). Avec pré-excitation, sur cœur sain : flécaïnide ou propafénone (IIa). Amiodarone contre-indiquée (thyroïde fœtale).</p>
<div class="lab">Ablation</div><p>Sans rayons X, par cartographie électroanatomique, dans un centre expérimenté, pour les TSV réfractaires et mal tolérées (IIa).</p>
<div class="lab">QT long</div><p>Le risque augmente dans les 9 mois qui suivent l’accouchement, surtout dans le type 2 : poursuivre le bêtabloquant pendant la grossesse et le post-partum, en surveillant la croissance et la glycémie du nouveau-né ; éviter les réveils nocturnes brusques.</p>
<div class="lab">TV</div><p>Rare ; chercher une cardiomyopathie du péripartum ; cardioversion si instabilité ; DAI possible pendant la grossesse si indiqué.</p></template>

<template data-pop="i47-tamsi" data-title="Tachycardie atriale multifocale et tachycardie sinusale inappropriée">
<div class="lab">Tachycardie atriale multifocale : diagnostic</div><p>Rythme irrégulier à plus de 100/min, au moins trois morphologies d’ondes P distinctes, intervalles PP, PR et RR variables. Terrain : bronchopneumopathie chronique décompensée, hypoxémie, hypertension pulmonaire, hypokaliémie, hypomagnésémie, théophylline. Diagnostic différentiel : fibrillation auriculaire (absence d’ondes P organisées).</p>
<div class="lab">Tachycardie atriale multifocale : traitement (ESC 2019)</div><p>Traiter la cause (classe I) ; vérapamil ou diltiazem, ou bêtabloquant sélectif en l’absence de bronchospasme (classe IIa). La cardioversion est inefficace ; l’amiodarone n’a pas de place habituelle.</p>
<div class="lab">Tachycardie sinusale inappropriée : diagnostic</div><p>Fréquence sinusale de repos &gt; 100/min et fréquence moyenne sur 24 heures &gt; 90/min, avec P de morphologie sinusale, sans cause secondaire (anémie, hyperthyroïdie, fièvre, hypovolémie, douleur, stimulants, déconditionnement, syndrome de tachycardie orthostatique posturale). Diagnostic d’exclusion, fréquent chez la femme jeune.</p>
<div class="lab">Tachycardie sinusale inappropriée : traitement (ESC 2019)</div><p>Rechercher et corriger les causes, réentraînement à l’effort ; ivabradine seule ou avec un bêtabloquant (classe IIa) ; bêtabloquant (IIb). L’ablation du nœud sinusal n’est pas recommandée en routine.</p>
<div class="lab">Piège</div><p>Traiter une fréquence sinusale élevée sans chercher sa cause : une tachycardie sinusale est presque toujours une réponse adaptée à une anomalie qu’il faut identifier.</p></template>
