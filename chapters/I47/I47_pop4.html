<template data-pop="i47-cv" data-title="Cardioversion électrique synchronisée dans les tachycardies">
<div class="lab">Principe</div><p>Un choc dépolarise simultanément tout le myocarde excitable et interrompt les circuits de réentrée. Il est <b>synchronisé</b> sur l’onde R pour ne pas tomber sur la période vulnérable de l’onde T, où il pourrait déclencher une FV.</p>
<div class="lab">Technique</div><p>Patient conscient : sédation courte par un médecin formé, monitorage, oxygène, aspiration prête. Électrodes autocollantes en position antéropostérieure ou antérolatérale. Vérifier l’affichage des marqueurs de synchronisation sur chaque QRS ; les resynchroniser après chaque choc sur les appareils qui se désynchronisent.</p>
<div class="lab">Énergies (ERC 2025, choc biphasique)</div><p>TV monomorphe avec pouls : 120–150 J au premier choc. Flutter et TSV régulière à QRS fins : 70–120 J. Fibrillation auriculaire, y compris pré-excitée : premier choc synchronisé à l’énergie maximale de l’appareil. En cas d’échec, augmenter l’énergie par paliers, jusqu’à trois tentatives, puis choisir un antiarythmique selon le rythme et ses contre-indications ; pas d’amiodarone intraveineuse dans la FA pré-excitée ni dans les torsades.</p>
<div class="lab">Échec</div><p>En cas de TV monomorphe persistante, un antiarythmique adapté et un nouveau choc peuvent être nécessaires. Une tachycardie automatique incessante récidive souvent après le choc : rechercher et traiter son foyer et sa cause plutôt que répéter les chocs. Une TV polymorphe ou une FV relève d’un choc <b>non synchronisé</b> (défibrillation), la synchronisation étant impossible.</p>
<div class="lab">Porteur de stimulateur ou de DAI</div><p>Électrodes à au moins 8 cm du boîtier ; contrôle du dispositif après le choc.</p>
<div class="lab">Pourquoi un choc peut échouer</div><p>Un foyer automatique ou une activité déclenchée ne dépendent pas d’un circuit : ils repartent dès la fin de la période réfractaire. Une tachycardie atriale focale ou jonctionnelle <button class="w" data-k="i47-automat">automatique</button> et incessante récidive donc aussitôt après le choc, et se traite par un médicament qui agit sur le foyer (ESC 2019).</p>
<div class="lab">Pourquoi le choc d’abord dans une TV bien tolérée</div><p>Le choc interrompt la réentrée en quelques secondes, quel que soit le circuit, et son effet ne se prolonge pas au-delà de l’arrêt de la TV. Un antiarythmique intraveineux peut au contraire échouer, abaisser la pression et agir pendant des heures, alors que la <button class="w" data-k="i47-tolerance">tolérance initiale</button> ne prédit pas la suite. L’ESC 2022 recommande donc la cardioversion en première ligne (classe I) si le risque de la sédation est faible ; viennent ensuite le procaïnamide en cas de cardiopathie connue ou suspectée (classe IIa) et l’amiodarone (classe IIb).</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, tableau de recommandations 9 et tableau 8 ; Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 11.1.2.2.</p>
</template>

<template data-pop="i47-adeno" data-title="Adénosine">
<div class="lab">Mécanisme</div><p>Agoniste du récepteur de l’adénosine de type 1 : ouverture d’un courant potassique, hyperpolarisation, baisse de l’AMPc ; bloc du nœud auriculoventriculaire pendant quelques secondes. Demi-vie &lt; 10 secondes.</p>
<div class="lab">Preuves et place</div><p>Arrêt de 90 % environ des TRIN et des TRAV ; premier choix après échec des manœuvres vagales (classe I, ESC 2019). Outil diagnostique dans les tachycardies à QRS fins et dans certaines tachycardies régulières à QRS larges sans pré-excitation (IIa).</p>
<div class="lab">Posologie</div><p>6 mg en bolus intraveineux rapide, dans une veine proche du cœur (pli du coude), suivi immédiatement de 20 mL de sérum physiologique, bras surélevé ; puis 12 mg si la tachycardie persiste après 1 à 2 minutes. L’information professionnelle suisse Krenosin® s’arrête à cette deuxième dose ; l’ESC 2019 admet 18 mg (<button class="w" data-k="i47-ch-adeno">écart et règle applicable</button>). Dose initiale de 3 mg par voie centrale ou chez le transplanté cardiaque (ESC 2019). Le dipyridamole multiplie jusqu’à quatre fois l’effet de l’adénosine : il s’arrête 24 heures avant, ou la dose est nettement réduite ; la carbamazépine peut potentialiser l’effet sur l’excitabilité cardiaque (Krenosin®).</p>
<div class="lab">Pièges</div><p>Injection trop lente ou trop distale : l’adénosine est dégradée avant d’atteindre le cœur. La théophylline, antagoniste du récepteur, peut diminuer l’effet et imposer une dose plus élevée ; l’ESC 2019 considère en revanche comme réfutée l’influence d’une consommation récente de caféine. Enregistrer l’ECG à 12 dérivations pendant l’injection : la réponse est l’information diagnostique.</p>
<div class="lab">Effets indésirables</div><p>Flush, oppression thoracique, dyspnée, sentiment de mort imminente pendant quelques secondes (prévenir le patient) ; asystolie brève ; fibrillation auriculaire induite (quelques pour cent), dangereuse en cas de voie accessoire.</p>
<div class="lab">Contre-indications</div><p>Selon l’information professionnelle suisse Krenosin® : bloc auriculoventriculaire du deuxième ou du troisième degré et maladie du sinus ou bradycardie symptomatique sans stimulateur ; affection pulmonaire chronique obstructive, asthme compris ; syndrome du QT long ; hypotension sévère ; insuffisance cardiaque décompensée. S’y ajoute la tachycardie irrégulière à QRS larges (FA pré-excitée), qui relève du mécanisme (ESC 2019). Défibrillateur disponible systématiquement.</p>
<div class="lab">Pourquoi ces précautions</div><p>L’adénosine est désaminée en quelques secondes : une injection lente ou distale arrive diluée au nœud et échoue. Une voie centrale apporte au contraire une dose concentrée, d’où la dose initiale réduite. Le dipyridamole bloque la recapture cellulaire de l’adénosine et prolonge son effet. Le cœur transplanté, dénervé, répond trois à six fois plus fort à l’adénosine ; l’ESC 2019 note toutefois que des données récentes soutiennent son emploi chez ces patients sans mesure de précaution particulière.</p>
<div class="lab">Pourquoi elle peut déclencher une FA</div><p>L’adénosine peut provoquer des décharges depuis une veine pulmonaire et rendre la repolarisation atriale plus hétérogène. Cette FA survient plus souvent au cours d’une TRAV. Chez un porteur de voie accessoire, elle se conduit par la voie, que l’adénosine ne bloque pas : la fréquence ventriculaire peut devenir très rapide.</p>
<div class="lab">Asthme</div><p>Inhalée, l’adénosine resserre les bronches de l’asthmatique ; par voie intraveineuse, le bronchospasme reste rare mais documenté. L’ESC 2019 admet un emploi prudent et juge le vérapamil plus approprié dans l’asthme grave ; l’information professionnelle suisse range au contraire l’asthme et la bronchopneumopathie obstructive parmi les contre-indications, règle qui s’applique en Suisse.</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 10.1.1 ; Ellenbogen et al., Electrophysiological effects of adenosine in the transplanted human heart, Circulation 1990;81:821-8.</p>
</template>

<template data-pop="i47-tdp-tt" data-title="Traitement des torsades de pointes">
<div class="lab">1. Urgence électrique</div><p>Défibrillation non synchronisée si FV ou torsade soutenue.</p>
<div class="lab">2. Supprimer la cause</div><p>Arrêter tous les médicaments allongeant le QT ; rechercher une bradycardie ou un bloc.</p>
<div class="lab">3. Magnésium</div><p>Sulfate de magnésium par voie intraveineuse, même si la magnésémie est normale (ESC 2022, classe I, sans dose fixée) ; l’information professionnelle suisse prévoit 1 à 2 g par heure en perfusion dans les troubles du rythme et le contre-indique en cas de bloc auriculoventriculaire. Il raccourcit peu le QT ; les données expérimentales suggèrent qu’il supprime les post-dépolarisations précoces, mais son mécanisme n’est pas établi chez l’homme.</p>
<div class="lab">4. Potassium</div><p>Objectif 4,5–5,0 mmol/L : l’hypokaliémie réduit le courant IKr et allonge le QT.</p>
<div class="lab">5. Accélérer la fréquence</div><p>Si les torsades d’un QT long acquis récidivent malgré les corrections et dépendent des pauses : stimulation temporaire (environ 90–110/min) ou isoprénaline. Pas d’isoprénaline dans le QT long congénital ni en cas d’ischémie, où les catécholamines peuvent aggraver le risque.</p>
<div class="lab">À proscrire</div><p>Amiodarone, sotalol et tout antiarythmique de classe Ia ou III.</p>
<div class="lab">QT long congénital</div><p>Bêtabloquant (propranolol), stimulation si pauses ; mexilétine ou lidocaïne dans le type 3.</p>
<div class="lab">Pourquoi ces mesures</div><p>La torsade naît d’une post-dépolarisation précoce sur une repolarisation trop longue, puis s’entretient par une réentrée entre des couches du myocarde inégalement repolarisées. Retirer le médicament rend au courant IKr sa capacité de repolarisation, et corriger le <button class="w" data-k="i47-k">potassium</button> agit dans le même sens. Accélérer la fréquence raccourcit le potentiel d’action et supprime les pauses, qui amplifient les post-dépolarisations. Les antiarythmiques de classe Ia et III bloquent eux-mêmes IKr et aggraveraient la cause.</p>
<div class="lab">Niveau de preuve</div><p>L’ESC 2022 recommande le magnésium intraveineux avec une supplémentation potassique (classe I), puis l’isoprénaline ou la stimulation si les torsades d’un QT long acquis récidivent malgré ces corrections (classe I). La cible de 4,5 à 5,0 mmol/L provient d’une déclaration américaine de 2010, qui la juge peu étayée (classe IIb) ; cette déclaration propose une stimulation à plus de 70/min. Une torsade qui ne s’arrête pas ou dégénère en FV relève du choc immédiat.</p>
<div class="lab">Source complémentaire</div><p>Drew et al., Prevention of torsade de pointes in hospital settings, Circulation 2010;121:1047-60 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, tableau de recommandations 9.</p>
</template>

<template data-pop="i47-orage" data-title="Orage rythmique">
<div class="lab">Définition</div><p>Au moins trois épisodes de TV ou de FV soutenues en 24 heures, ou trois interventions appropriées d’un DAI (stimulation antitachycardique ou choc), chaque épisode étant séparé d’au moins 5 minutes.</p>
<div class="lab">Déclencheurs</div><p>Ischémie, aggravation de l’insuffisance cardiaque, hypokaliémie, hyperthyroïdie (amiodarone), infection, médicament proarythmique, arrêt du bêtabloquant.</p>
<div class="lab">Conduite (ESC 2022)</div><p>Soins intensifs ; correction des déclencheurs ; sédation légère à modérée, qui réduit le tonus sympathique (classe I) ; sédation profonde et intubation si l’orage persiste (classe IIa) ; bêtabloquant non sélectif (propranolol) et amiodarone sur cardiopathie structurelle, sauf contre-indication ; reprogrammation du DAI ; ablation par cathéter en cas d’échec (classe I) ; blocage ou dénervation sympathique ; assistance circulatoire mécanique chez des patients sélectionnés (IIb). Syndrome de Brugada : isoprénaline et quinidine. TVPC : sédation, propranolol, flécaïnide.</p>
<div class="lab">Pronostic</div><p>L’orage rythmique s’associe à une mortalité accrue, à des décompensations d’insuffisance cardiaque et à des troubles psychologiques (ESC 2022) ; il impose une réévaluation complète du substrat.</p>
<div class="lab">Mécanisme</div><p>Chaque épisode, chaque choc et la détresse qu’ils provoquent élèvent le tonus sympathique, qui facilite l’épisode suivant : l’orage s’auto-entretient. La sédation et le bêtabloquant rompent ce cercle. Le propranolol bloque aussi les récepteurs β2 ; dans un essai randomisé de 60 porteurs de DAI, associé à l’amiodarone intraveineuse, il a réduit les épisodes et les chocs davantage que le métoprolol.</p>
<div class="lab">Pourquoi l’ablation</div><p>La cause la plus fréquente d’un orage est une TV monomorphe sur cicatrice. Son circuit est fixe et peut être interrompu par l’ablation, recommandée en cas de TV incessante ou d’orage réfractaire aux antiarythmiques (classe I).</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 6.1.3 ; Chatzidou et al., Propranolol versus metoprolol for treatment of electrical storm in patients with implantable cardioverter-defibrillator, Journal of the American College of Cardiology 2018;71:1897-1906.</p>
</template>

<template data-pop="i47-abl-tsv" data-title="Ablation par cathéter des tachycardies supraventriculaires">
<div class="lab">Principe</div><p>Sous anesthésie locale et sédation, cathéters introduits par la veine fémorale ; EEP pour déclencher la tachycardie et identifier le circuit ; application de radiofréquence (chaleur) ou de cryothérapie (froid) sur un point critique.</p>
<div class="lab">Cibles et succès (ESC 2019)</div><p>TRIN : voie lente, succès &gt; 95 %. Voie accessoire : succès d’environ 90–95 % (moins pour les voies septales et épicardiques). Tachycardie atriale focale : succès de l’ordre de 85–90 %. Flutter typique : isthme cavotricuspide (chapitre I48).</p>
<div class="lab">Risques</div><p>Bloc auriculoventriculaire nécessitant un stimulateur (&lt; 1 % pour la TRIN, plus pour les voies septales) ; complications vasculaires ; tamponnade (rare, voies gauches par voie transseptale ou rétroaortique) ; embolie cérébrale (voies gauches).</p>
<div class="lab">Après</div><p>Reprise des activités en quelques jours ; pas de traitement au long cours ; récidive d’environ 2 % après une TRIN et 8 % après une TRAV, mais de 20 % après une tachycardie atriale focale ; elle se traite par une nouvelle ablation.</p>
<div class="lab">Grossesse</div><p>Possible sans rayons X, par cartographie électroanatomique, dans un centre expérimenté (IIa), pour les TSV réfractaires et mal tolérées.</p>
<div class="lab">Pourquoi l’ablation guérit</div><p>Une réentrée a besoin de chaque segment de son circuit. Détruire un segment étroit et indispensable, la voie lente ou la voie accessoire, interrompt définitivement le circuit, sans traitement ultérieur. La voie lente est ciblée dans la partie basse du triangle de Koch, loin du nœud compact et du faisceau de His : le risque de bloc reste donc faible. Une voie accessoire septale, proche du His, expose davantage à ce risque ; la cryothérapie le réduit, au prix de récidives plus fréquentes.</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 11.5 et tableau 11.</p>
</template>

<template data-pop="i47-eep" data-title="Exploration électrophysiologique (EEP)">
<div class="lab">Technique</div><p>Cathéters multipolaires dans l’oreillette droite haute, sur le faisceau de His, dans le sinus coronaire et le ventricule droit ; enregistrement des électrogrammes intracavitaires et stimulation programmée.</p>
<div class="lab">Mesures</div><p>Intervalle AH (conduction nodale, 50–120 ms) ; intervalle HV (conduction sous-hisienne, 35–55 ms) ; périodes réfractaires ; séquence d’activation atriale rétrograde (concentrique : nodale ; excentrique : voie accessoire latérale).</p>
<div class="lab">Indications dans ce chapitre</div><p>Préalable à toute ablation ; stratification d’une pré-excitation asymptomatique ; tachycardie à QRS larges douteuse ; syncope chez un patient porteur d’une cicatrice (inductibilité d’une TV).</p>
<div class="lab">Stratification d’une voie accessoire</div><p>Avec isoprénaline : intervalle RR pré-excité le plus court en FA induite ≤ 250 ms, période réfractaire antérograde ≤ 250 ms, voies multiples, tachycardie inductible : haut risque.</p>
<div class="lab">Risques</div><p>Faibles : hématome, thrombose veineuse, rarement tamponnade.</p>
<div class="lab">Pourquoi le seuil de 250 ms</div><p>Le nœud protège normalement les ventricules : sa conduction décrémentielle filtre l’activité très rapide d’une FA. Une voie accessoire conduit sans décrément. Si sa période réfractaire est courte, elle transmet une FA à plus de 240/min, fréquence qui peut dégénérer en FV. Un intervalle RR pré-excité ou une période réfractaire de la voie de 250 ms ou moins signalent cette capacité. Le risque d’arrêt cardiaque ou de FV des porteurs de pré-excitation est estimé à 2,4 pour 1 000 personnes-années (ESC 2019).</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section sur la pré-excitation asymptomatique.</p>
</template>

<template data-pop="i47-wpw-asympt" data-title="Pré-excitation asymptomatique : démarche (ESC 2019)">
<div class="lab">1. Profession ou loisir à risque, athlète de compétition</div><p>EEP avec isoprénaline (classe I) ; ablation si marqueur de haut risque (classe I).</p>
<div class="lab">2. Autres sujets</div><p>EEP à envisager (classe IIa). Une évaluation non invasive (pré-excitation intermittente, disparition brutale à l’effort) peut être envisagée (classe IIb) ; si elle montre une voie à faible risque, la surveillance est acceptable.</p>
<div class="lab">3. Voie à faible risque</div><p>Abstention et information du patient, ou ablation en décision partagée dans un centre expérimenté, en particulier si le geste comporte peu de risque (voie latérale gauche ou droite éloignée du His).</p>
<div class="lab">4. Dysfonction ventriculaire par asynchronisme</div><p>Certaines voies droites, surtout chez l’enfant, désynchronisent la contraction et altèrent la FEVG : l’ablation se discute alors même sans arythmie.</p>
<div class="lab">Information</div><p>Consulter immédiatement en cas de palpitations ; pas de bêtabloquant ni de vérapamil de sa propre initiative.</p>
<div class="lab">Pourquoi stratifier un sujet sans symptôme</div><p>La mort subite peut être la première manifestation d’une voie accessoire : une FA conduite très vite par la voie dégénère en FV. Ce risque est faible en moyenne, mais il dépend des propriétés de la voie, que l’ECG de repos ne mesure pas. Dans un essai randomisé de 72 patients asymptomatiques jugés à haut risque à l’EEP, l’incidence estimée des événements arythmiques à cinq ans était de 7 % après ablation, contre 77 % sans traitement (Pappone et al., 2003).</p>
<div class="lab">Limite des tests non invasifs</div><p>Une pré-excitation intermittente suggère une voie à période réfractaire longue, mais un patient sur cinq dans cette situation a une période réfractaire de la voie inférieure à 250 ms. C’est pourquoi l’évaluation non invasive ne reste qu’en classe IIb, derrière l’EEP (ESC 2019).</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section sur la pré-excitation asymptomatique ; Pappone et al., A randomized study of prophylactic catheter ablation in asymptomatic patients with the Wolff-Parkinson-White syndrome, New England Journal of Medicine 2003;349:1803-11.</p>
</template>

<template data-pop="i47-dai" data-title="Défibrillateur automatique implantable (DAI)">
<div class="lab">Fonctionnement</div><p>Il détecte la fréquence et la morphologie des QRS ; dans la zone de TV, il délivre d’abord une stimulation antitachycardique (efficace sur la majorité des TV monomorphes, indolore), puis un choc ; dans la zone de FV, il délivre d’emblée un choc.</p>
<div class="lab">Types</div><p><b>Transveineux</b> : sondes dans le cœur ; stimulation antibradycardique et antitachycardique ; possibilité de resynchronisation. <b>Sous-cutané</b> : sonde parasternale sous la peau, sans risque d’endocardite de sonde ; pas de stimulation ; indiqué surtout chez le jeune sans besoin de stimulation (canalopathies), après dépistage de la morphologie ECG. <b>Extravasculaire</b> (sonde rétrosternale) : alternative récente. <b>Portable</b> : gilet temporaire.</p>
<div class="lab">Indications (ESC 2022)</div><p>Prévention secondaire : FV ou TV mal tolérée sans cause réversible (I). Prévention primaire : cardiopathie ischémique avec FEVG ≤ 35 %, NYHA II–III, après 3 mois de traitement optimal et 6 semaines après l’infarctus (I) ; cardiomyopathie dilatée non ischémique avec FEVG ≤ 35 % (IIa) ; critères propres aux canalopathies et cardiomyopathies.</p>
<div class="lab">Preuves</div><p>AVID, CIDS, CASH (secondaire) ; MADIT-II, SCD-HeFT (primaire, ischémique et mixte) ; DANISH (non ischémique : pas de baisse significative de la mortalité totale).</p>
<div class="lab">Inconvénients</div><p>Chocs inappropriés (FA rapide, tachycardie sinusale, bruit de sonde), complications des sondes, infection, anxiété, restrictions de conduite. Discuter la désactivation de la fonction de choc en fin de vie.</p>
<div class="lab">Pourquoi il prolonge la vie sans prévenir l’arythmie</div><p>Le DAI n’empêche pas la TV ; il l’arrête en quelques secondes, par stimulation antitachycardique ou par choc. Dans un essai randomisé de 634 porteurs, la stimulation antitachycardique a arrêté 72 % des TV rapides sans choc, après ajustement, avec la même sécurité et une meilleure qualité de vie (Wathen et al., 2004).</p>
<div class="lab">Pourquoi attendre après un infarctus</div><p>Implanté entre le 6e et le 40e jour, le DAI a réduit les morts arythmiques, mais les décès d’autres causes ont augmenté, et la mortalité totale n’a pas baissé (Hohnloser et al., 2004). L’ESC 2022 ne recommande donc pas le DAI systématique pendant les 40 premiers jours ; elle recommande de réévaluer la FEVG 6 à 12 semaines après l’infarctus.</p>
<div class="lab">Source complémentaire</div><p>Wathen et al., Circulation 2004;110:2591-6 ; Hohnloser et al., Prophylactic use of an implantable cardioverter-defibrillator after acute myocardial infarction, New England Journal of Medicine 2004;351:2481-8 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, section 7.1.1.</p>
</template>

<template data-pop="i47-schwartz" data-title="Score de Schwartz du QT long">
<div class="lab">ECG (en l’absence de médicament ou de trouble allongeant le QT)</div><p>QTc ≥ 480 ms : 3 ; 460–479 ms : 2 ; 450–459 ms chez l’homme : 1. QTc ≥ 480 ms à la 4e minute de récupération d’effort : 1. Torsades de pointes : 2. Alternance de l’onde T : 1. Onde T encochée dans trois dérivations : 1. Fréquence basse pour l’âge : 0,5.</p>
<div class="lab">Clinique</div><p>Syncope avec stress : 2 ; sans stress : 1 (torsades et syncope ne se cumulent pas). Surdité congénitale : 0,5.</p>
<div class="lab">Famille</div><p>Apparenté avec QT long certain : 1. Mort subite inexpliquée avant 30 ans chez un apparenté du premier degré : 0,5 (les deux items familiaux ne se cumulent pas pour le même apparenté).</p>
<div class="lab">Lecture</div><p>≤ 1 : probabilité faible ; 1,5–3 : intermédiaire ; ≥ 3,5 : élevée. L’ESC 2022 retient un score &gt; 3 comme critère diagnostique (classe I).</p>
<div class="lab">Exemple</div><p>Adolescente, QTc 470 ms (2), syncope à l’émotion (2), onde T encochée (1) : 5 points, probabilité élevée.</p>
<div class="lab">Version de l’ESC 2022</div><p>Le tableau de l’ESC 2022 attribue 3,5 points à un QTc ≥ 480 ms et ajoute un item génétique : un variant pathogène vaut aussi 3,5 points. Chacun dépasse ainsi seul le seuil de 3, en accord avec les critères diagnostiques : QTc ≥ 480 ms sur des ECG répétés, ou variant pathogène quel que soit le QT (classe I). Avec la version originale ci-dessus, un QTc de 480 ms isolé vaut 3 points et n’atteint pas ce seuil.</p>
<div class="lab">Pourquoi ces items</div><p>Les items ECG traduisent une repolarisation anormale ; les items cliniques en traduisent les conséquences. Une syncope au stress compte double, car la plupart des événements du QT long sont déclenchés par l’adrénaline.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 7.2.2 et tableau 10.</p>
</template>

<template data-pop="i47-brugada" data-title="Syndrome de Brugada">
<div class="lab">Mécanisme</div><p>Deux hypothèses complémentaires : repolarisation (courant transitoire sortant dominant dans l’épicarde de la chambre de chasse droite, perte du dôme du potentiel d’action, réentrée de phase 2) et dépolarisation (conduction lente sur une fibrose épicardique discrète).</p>
<div class="lab">Clinique</div><p>Homme de 30 à 50 ans surtout ; syncope ou mort subite au repos, la nuit, après un repas copieux ou pendant la fièvre ; respiration agonique nocturne rapportée par le conjoint.</p>
<div class="lab">Stratification</div><p>Haut risque : arrêt cardiaque (DAI, I), syncope arythmique (DAI, IIa), type 1 spontané. Faible risque : type 1 seulement induit, asymptomatique. L’EEP peut être envisagée chez l’asymptomatique à type 1 spontané (IIb).</p>
<div class="lab">Mesures pour tous</div><p>Paracétamol dès 38 °C ; liste brugadadrugs.org ; éviter les excès d’alcool, les gros repas, la cocaïne ; dépistage familial.</p>
<div class="lab">Pourquoi ces circonstances</div><p>Le repos, la nuit et les repas copieux renforcent le tonus vagal ; la fièvre et les bloqueurs sodiques réduisent encore le courant sodique. Tous accentuent le déséquilibre entre le courant sodique entrant et le courant transitoire sortant dans l’épicarde de la chambre de chasse droite, qui produit le <button class="w" data-k="i47-ecg-brug">sus-décalage de type 1</button> et peut déclencher une FV : d’où les événements au repos et la nuit, et le traitement immédiat de toute fièvre (ESC 2022).</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, section 7.2.4 ; Dumaine et al., Circulation Research 1999;85:803-9 ; Antzelevitch et al., Brugada syndrome: report of the second consensus conference, Circulation 2005;111:659-70.</p>
</template>

<template data-pop="i47-reppre" data-title="Repolarisation précoce, QT court, FV idiopathique">
<div class="lab">Aspect de repolarisation précoce</div><p>Élévation du point J ≥ 1 mm dans au moins deux dérivations inférieures ou latérales contiguës (encoche ou empâtement terminal du QRS). Fréquent et bénin chez le sujet jeune et l’athlète. On parle de <b>syndrome</b> seulement chez un patient réanimé d’une FV idiopathique ou TV polymorphe (ESC 2022).</p>
<div class="lab">QT court</div><p>QTc ≤ 360 ms avec variant pathogène, histoire familiale ou arrêt cardiaque, ou QTc ≤ 320 ms isolé ; gain de fonction de canaux potassiques ; FA et FV. Traitement : DAI après arrêt ; quinidine.</p>
<div class="lab">FV idiopathique</div><p>Arrêt par FV sans cause après bilan complet (IRM, coronarographie, test aux bloqueurs sodiques, épreuve d’effort, génétique). DAI ; extrasystoles déclenchantes de Purkinje parfois accessibles à l’ablation.</p>
<div class="lab">Mécanisme commun</div><p>Le point J marque la fin de la dépolarisation. Dans le syndrome de repolarisation précoce comme dans le Brugada, un courant transitoire sortant prédominant dans l’épicarde y creuse une onde J. Si l’encoche devient excessive, une partie de l’épicarde perd son plateau, et une réentrée de phase 2 peut déclencher une FV. Les antiarythmiques qui bloquent ce courant, comme la quinidine, préviennent la FV ; l’isoprénaline supprime les orages.</p>
<div class="lab">Pourquoi l’aspect seul ne suffit pas</div><p>L’aspect de repolarisation précoce touche jusqu’à 5,8 % des adultes, surtout les hommes jeunes et les sportifs, et reste le plus souvent bénin. Une onde J d’au moins 2 mm, des variations dynamiques du point J ou un segment ST horizontal ou descendant augmentent la probabilité d’un syndrome. Le pronostic de l’asymptomatique étant bon, le DAI n’est en général pas recommandé.</p>
<div class="lab">QT court</div><p>Une repolarisation brève raccourcit aussi la période réfractaire : les réentrées se forment plus facilement dans les oreillettes et les ventricules. La quinidine, qui allonge le QT, est l’antiarythmique le mieux étayé.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, sections 7.2.5 et 7.2.7 ; Antzelevitch et al., J wave syndromes, Heart Rhythm 2010;7:549-58.</p>
</template>

<template data-pop="i47-msj" data-title="Mort subite du sujet jeune : démarche">
<div class="lab">Autopsie</div><p>Autopsie complète avec examen cardiaque par un pathologiste spécialisé ; toxicologie ; conservation de sang prélevé sur tube anticoagulé ou de tissu congelé pour une analyse génétique post mortem ciblée sur les canalopathies et cardiomyopathies.</p>
<div class="lab">Autopsie blanche</div><p>Si le cœur est normal : canalopathie présumée ; l’analyse génétique post mortem identifie un variant dans une part notable des cas.</p>
<div class="lab">Famille</div><p>Évaluation des apparentés du premier degré dans une consultation spécialisée : anamnèse, ECG (y compris dérivations hautes), épreuve d’effort, échocardiographie, Holter, test aux bloqueurs sodiques selon le contexte, génétique ciblée si un variant est trouvé.</p>
<div class="lab">Cadre suisse</div><p>La conservation d’échantillons et l’analyse génétique post mortem relèvent du médecin légiste et de la loi fédérale sur l’analyse génétique humaine ; le consentement des proches est requis pour l’analyse à visée familiale.</p>
<div class="lab">Rendement (ESC 2022)</div><p>L’analyse génétique post mortem ciblée sur la cause présumée identifie un variant chez environ un tiers des victimes. L’évaluation clinique et génétique des apparentés pose un diagnostic héréditaire dans 18 à 53 % des familles. Une autopsie blanche n’écarte donc pas une cause cardiaque : une canalopathie ne laisse pas de lésion visible. Sans échantillon conservé au moment de l’autopsie, la famille perd l’accès au dépistage ciblé sur le variant.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 5.2.5.</p>
</template>

<template data-pop="i47-credible" data-title="CredibleMeds : médicaments allongeant le QT">
<div class="lab">Base</div><p>Base en ligne tenue par une organisation américaine à but non lucratif, issue de l’Université de l’Arizona (crediblemeds.org), mise à jour régulièrement ; accès gratuit après inscription ; version pour application mobile.</p>
<div class="lab">Catégories</div><p><b>Risque connu</b> : allongent le QT et causent des torsades même aux doses usuelles. <b>Risque possible</b> : allongent le QT sans preuve suffisante de torsades. <b>Risque conditionnel</b> : torsades seulement dans certaines conditions (surdosage, hypokaliémie, interaction). <b>À éviter dans le QT long congénital</b> : liste spécifique, incluant des sympathomimétiques.</p>
<div class="lab">Exemples à risque connu</div><p>Psychotropes : citalopram, escitalopram, halopéridol, chlorpromazine, méthadone. Anti-infectieux : clarithromycine, érythromycine, azithromycine, lévofloxacine, moxifloxacine, ciprofloxacine, fluconazole, hydroxychloroquine. Autres : ondansétron, dompéridone, donépézil, amiodarone, sotalol, flécaïnide.</p>
<div class="lab">Conduite</div><p>Chercher chaque molécule ; ECG avant et après l’introduction chez le patient à risque ; potassium et magnésium normaux ; arrêt si QTc &gt; 500 ms ou hausse &gt; 60 ms ; éviter les associations.</p>
<div class="lab">Piège</div><p>La classification varie dans le temps : consulter la version en ligne, non une liste imprimée ancienne.</p>
<div class="lab">Conduite selon l’ESC 2022</div><p>Un médicament allongeant le QT est contre-indiqué en cas de QT long congénital ou de QTc de base supérieur à 500 ms, sauf indication forte discutée avec un spécialiste. Sinon, on enregistre un ECG avant le début, après un jour, puis une à deux semaines après le début ou une augmentation de dose. Un QTc qui dépasse alors 500 ms fait changer de médicament ou, si l’indication est forte, réduire la dose (<button class="w" data-k="i47-ecg-qt">seuils du QT</button>). En présence d’une hypokaliémie, d’une hypomagnésémie, d’une insuffisance rénale ou hépatique, d’une hypertrophie ou d’une insuffisance cardiaque, ou d’un second médicament allongeant le QT, le traitement n’est commencé que si l’indication est forte, sous surveillance rapprochée.</p>
<div class="lab">Pourquoi des sympathomimétiques</div><p>La liste propre au QT long congénital comprend des sympathomimétiques, même sans effet sur le QT, car l’adrénaline déclenche la plupart des événements de cette maladie.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, figure 13 ; Drew et al., Prevention of torsade de pointes in hospital settings, Circulation 2010;121:1047-60.</p>
</template>

<template data-pop="i47-sport" data-title="Sport et tachycardies">
<div class="lab">TSV</div><p>Athlète avec TRIN ou TRAV récidivante : l’ablation permet la reprise du sport de compétition. Pré-excitation chez un athlète de compétition : EEP avec isoprénaline et ablation si haut risque (ESC 2019 et ESC 2020).</p>
<div class="lab">QT long (repères ESC 2020)</div><p>Sport intense et compétition déconseillés si QTc &gt; 500 ms, si QTc ≥ 470 ms (homme) ou ≥ 480 ms (femme) avec génotype confirmé, et après arrêt cardiaque ou syncope arythmique. Chez l’asymptomatique sous bêtabloquant, avec un QTc inférieur à ces seuils, la compétition peut être discutée après décision partagée. Type 1 : natation sous surveillance.</p>
<div class="lab">Brugada</div><p>Sport possible chez l’asymptomatique ; éviter l’hyperthermie (température centrale &gt; 39 °C), s’hydrater.</p>
<div class="lab">TVPC</div><p>Sport intense et compétition déconseillés, y compris chez le porteur asymptomatique.</p>
<div class="lab">Porteur de DAI</div><p>Activité d’intensité modérée encouragée ; compétition envisageable au cas par cas selon la maladie sous-jacente ; éviter les sports de contact violents sur la loge.</p>
<div class="lab">Principe</div><p>Décision partagée et documentée ; réévaluation annuelle.</p>
<div class="lab">Logique des restrictions</div><p>Chaque restriction suit le déclencheur de la maladie. Dans la TVPC et le QT long, l’adrénaline de l’effort et de l’émotion déclenche les arythmies : l’ESC 2022 recommande aux patients atteints de TVPC d’éviter le sport de compétition, l’effort intense et les environnements stressants. Dans le Brugada, les événements surviennent plutôt au repos, mais la chaleur réduit le courant sodique de certains canaux mutés, comme la fièvre : on évite donc l’hyperthermie.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, sections 7.2.2, 7.2.4 et 7.2.6 ; Dumaine et al., Circulation Research 1999;85:803-9.</p>
</template>

<template data-pop="i47-grossesse" data-title="Grossesse et tachycardies">
<div class="lab">Traitement aigu (ESC 2019)</div><p>Manœuvres vagales, puis adénosine (classe I) ; cardioversion électrique à tout trimestre si instabilité, avec surveillance fœtale ; bêtabloquant β1-sélectif intraveineux (IIa).</p>
<div class="lab">Prévention</div><p>Éviter si possible tout antiarythmique au premier trimestre. Sans pré-excitation : bêtabloquant β1-sélectif (métoprolol, bisoprolol ; pas d’aténolol, associé à un retard de croissance) ou vérapamil (IIa). Avec pré-excitation, sur cœur sain : flécaïnide ou propafénone (IIa). Amiodarone à éviter en raison des risques, notamment thyroïdiens, pour le fœtus ; selon l’ESC 2025, son emploi est réservé aux arythmies réfractaires ou menaçant la vie qui ne peuvent être contrôlées autrement, sur décision spécialisée.</p>
<div class="lab">Ablation</div><p>Sans rayons X, par cartographie électroanatomique, dans un centre expérimenté, pour les TSV réfractaires et mal tolérées (IIa).</p>
<div class="lab">QT long</div><p>Le risque augmente dans les 9 mois qui suivent l’accouchement, surtout dans le type 2 : poursuivre le bêtabloquant pendant la grossesse et le post-partum, en surveillant la croissance et la glycémie du nouveau-né ; éviter les réveils nocturnes brusques.</p>
<div class="lab">TV</div><p>Rare ; chercher une cardiomyopathie du péripartum ; cardioversion si instabilité ; DAI possible pendant la grossesse si indiqué.</p>
<div class="lab">Pourquoi ces choix</div><p>Le premier trimestre porte le risque tératogène le plus élevé : on évite tout antiarythmique si possible (classe I). Les bêtabloquants β1-sélectifs sont préférés, car ils modifient moins la relaxation utérine. L’aténolol est écarté parce qu’il s’associe plus souvent que le métoprolol ou le propranolol à un faible poids pour l’âge gestationnel ; cette différence observationnelle suggère un effet propre à la molécule plutôt qu’un effet de classe. L’amiodarone apporte une forte charge d’iode, qui peut dérégler la thyroïde fœtale (classe III).</p>
<div class="lab">Avant la grossesse</div><p>Chez une femme symptomatique qui envisage une grossesse, l’ablation d’une TSV récidivante est recommandée (classe I) : elle évite ensuite d’exposer l’embryon aux antiarythmiques.</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 14 ; Basaria et al., Amiodarone and the thyroid, American Journal of Medicine 2005;118:706-14.</p>
</template>

<template data-pop="i47-tamsi" data-title="Tachycardie atriale multifocale et tachycardie sinusale inappropriée">
<div class="lab">Tachycardie atriale multifocale : diagnostic</div><p>Rythme irrégulier à plus de 100/min, au moins trois morphologies d’ondes P distinctes, intervalles PP, PR et RR variables. Terrain : bronchopneumopathie chronique décompensée, hypoxémie, hypertension pulmonaire, hypokaliémie, hypomagnésémie, théophylline. Diagnostic différentiel : fibrillation auriculaire (absence d’ondes P organisées).</p>
<div class="lab">Tachycardie atriale multifocale : traitement (ESC 2019)</div><p>Traiter la cause (classe I) ; vérapamil ou diltiazem, ou bêtabloquant sélectif en l’absence de bronchospasme (classe IIa). La cardioversion est inefficace ; l’amiodarone n’a pas de place habituelle.</p>
<div class="lab">Tachycardie sinusale inappropriée : diagnostic</div><p>Fréquence sinusale de repos &gt; 100/min et fréquence moyenne sur 24 heures &gt; 90/min, avec P de morphologie sinusale, sans cause secondaire (anémie, hyperthyroïdie, fièvre, hypovolémie, douleur, stimulants, déconditionnement, syndrome de tachycardie orthostatique posturale). Diagnostic d’exclusion, fréquent chez la femme jeune.</p>
<div class="lab">Tachycardie sinusale inappropriée : traitement (ESC 2019)</div><p>Rechercher et corriger les causes, réentraînement à l’effort ; ivabradine seule ou avec un bêtabloquant (classe IIa) ; bêtabloquant seul (classe IIa). L’ablation du nœud sinusal n’est pas recommandée en routine.</p>
<div class="lab">Piège</div><p>Traiter une fréquence sinusale élevée sans chercher sa cause : une tachycardie sinusale est presque toujours une réponse adaptée à une anomalie qu’il faut identifier.</p>
<div class="lab">Pourquoi traiter la cause</div><p>Le mécanisme supposé de la tachycardie atriale multifocale est une activité anormale de plusieurs foyers atriaux, entretenue par la maladie causale, et non une réentrée : la cardioversion ne la supprime pas durablement, alors que la correction de la cause fait disparaître les foyers.</p>
<div class="lab">Tachycardie sinusale inappropriée : mécanisme et pronostic</div><p>Son mécanisme reste mal compris et probablement multifactoriel : dysautonomie, dérégulation neurohormonale, hyperactivité propre du nœud sinusal. Un gain de fonction du canal porteur du courant If a été décrit dans des formes familiales. Le pronostic est en général bénin, et cette tachycardie n’a pas été associée à une cardiomyopathie rythmique (ESC 2019).</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, sections 11.1.1.2 et 11.1.3.</p>
</template>
