
<!-- ===== FENÊTRES I47 : mécanismes et entités ===== -->
<template data-pop="i47-pa" data-title="Potentiel d’action cardiaque">
<div class="lab">Myocyte ventriculaire</div><p><b>Phase 0</b> : ouverture du canal sodique rapide, entrée massive de Na⁺, montée de −85 à +20 millivolts en 1 à 2 ms ; elle détermine la vitesse de conduction et la largeur du QRS. <b>Phase 1</b> : sortie transitoire de K⁺ (courant transitoire sortant). <b>Phase 2</b> : plateau, entrée de Ca²⁺ par les canaux de type L, équilibrée par la sortie de K⁺. <b>Phase 3</b> : repolarisation par les courants potassiques rapide (IKr) et lent (IKs). <b>Phase 4</b> : repos stable grâce au courant IK1.</p>
<div class="lab">Cellule nodale</div><p>Pas de courant sodique rapide : phase 0 calcique, lente. Phase 4 ascendante (courant If, horloge calcique) : automatisme. Réfractarité prolongée au-delà de la repolarisation.</p>
<div class="lab">Traduction ECG</div><p>Phase 0 ventriculaire = QRS ; phases 2 et 3 = segment ST et onde T ; durée totale ≈ intervalle QT.</p>
<div class="lab">Corrélation</div><p>Bloqueur sodique : phase 0 ralentie, QRS élargi. Bloqueur potassique : phase 3 allongée, QT allongé. Bloqueur calcique : conduction nodale ralentie, PR allongé.</p>
<div class="lab">Pourquoi le nœud ralentit</div><p>La dépolarisation nodale dépend du courant calcique de type L, dont les canaux récupèrent lentement de leur inactivation, au-delà de la fin de la repolarisation. Un influx précoce trouve une partie des canaux encore inactivés : la dépolarisation est plus faible et se propage plus lentement. Plus les influx se rapprochent, plus la conduction s’allonge : c’est la conduction décrémentielle, qui filtre les rythmes atriaux rapides. Le vérapamil, le diltiazem, l’adénosine et le vague réduisent ce courant ou hyperpolarisent la cellule, d’où le bloc nodal qu’ils provoquent.</p>
<div class="lab">Pourquoi le repos est stable</div><p>Le courant IK1 maintient le myocyte près du potentiel d’équilibre du potassium. Quand il diminue, la membrane se dépolarise et devient plus excitable : le syndrome d’Andersen et Tawil, où <i>KCNJ2</i> perd sa fonction, s’accompagne ainsi de nombreuses extrasystoles ventriculaires.</p>
<div class="lab">Source complémentaire</div><p>Antzelevitch et Burashnikov, Overview of basic mechanisms of cardiac arrhythmia, Cardiac Electrophysiology Clinics 2011;3:23-45 ; Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., Elsevier 2021 ; Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 10.1.1.2.</p>
</template>

<template data-pop="i47-reentree" data-title="Réentrée">
<div class="lab">Définition</div><p>Un influx, au lieu de s’éteindre après avoir activé le cœur, revient activer une région redevenue excitable, et tourne ainsi en boucle.</p>
<div class="lab">Trois conditions</div><p>1. Deux voies de conduction reliées à leurs extrémités (obstacle anatomique ou fonctionnel). 2. Un bloc unidirectionnel dans l’une d’elles. 3. Une conduction assez lente dans l’autre pour que la première ait récupéré quand l’influx y revient.</p>
<div class="lab">Exemple</div><p>TRIN : une extrasystole auriculaire bloquée dans la voie rapide (réfractaire) descend par la voie lente ; quand elle atteint la partie basse du nœud, la voie rapide a récupéré et la conduit en sens rétrograde : la boucle est fermée.</p>
<div class="lab">Signature clinique</div><p>Début et fin brutaux ; déclenchement et arrêt par une extrasystole ou une stimulation programmée ; fréquence fixe.</p>
<div class="lab">Corrélation thérapeutique</div><p>Couper une branche du circuit (ablation), bloquer transitoirement un maillon (adénosine sur le nœud), ou allonger la période réfractaire (classe III).</p>
<div class="lab">Longueur d’onde et intervalle excitable</div><p>Le front occupe, dans le circuit, une longueur égale au produit de sa vitesse de conduction par la période réfractaire : c’est la longueur d’onde. La réentrée ne persiste que si le circuit est au moins aussi long ; il reste alors, devant le front, un segment redevenu excitable, l’intervalle excitable. Une conduction lente ou une période réfractaire courte raccourcit la longueur d’onde et favorise la réentrée.</p>
<div class="lab">Conséquences thérapeutiques</div><p>Un médicament de classe III allonge la période réfractaire jusqu’à ce que le front bute sur un tissu encore réfractaire. Un bloqueur sodique peut bloquer un isthme fragile, mais aussi, en ralentissant la conduction, raccourcir la longueur d’onde et entretenir la réentrée : c’est son risque proarythmique sur cicatrice. Une stimulation rapide pénètre l’intervalle excitable et y laisse un tissu réfractaire qui arrête le front suivant. Une FV, faite de fronts multiples et changeants, n’offre pas cette prise : seul le choc l’arrête.</p>
<div class="lab">Source complémentaire</div><p>Antzelevitch et Burashnikov, Overview of basic mechanisms of cardiac arrhythmia, Cardiac Electrophysiology Clinics 2011;3:23-45.</p>
</template>

<template data-pop="i47-automat" data-title="Automatisme anormal">
<div class="lab">Mécanisme</div><p>Des cellules atriales ou ventriculaires, normalement stables en phase 4, se dépolarisent spontanément, sous l’effet de l’ischémie, de l’étirement, des catécholamines ou de troubles métaboliques.</p>
<div class="lab">Indices ECG</div><p>Démarrage progressif sur quelques battements (« échauffement ») et ralentissement progressif (« refroidissement ») ; premier battement de même morphologie que les suivants ; non déclenché par la stimulation programmée.</p>
<div class="lab">Exemples</div><p>Tachycardie atriale focale automatique ; tachycardie jonctionnelle ectopique (enfant, postopératoire) ; rythme idioventriculaire accéléré de reperfusion.</p>
<div class="lab">Conséquence</div><p>La cardioversion électrique arrête le plus souvent la tachycardie, mais un foyer automatique incessant redémarre aussitôt (ESC 2019). On ralentit le foyer ou la conduction, ou on l’ablate.</p>
<div class="lab">Pourquoi ces facteurs</div><p>Un myocyte atrial ou ventriculaire n’a pas d’automatisme tant que son potentiel de repos reste très négatif. Partiellement dépolarisé, entre −70 et −30 millivolts environ, il décharge spontanément, d’autant plus vite qu’il est dépolarisé. L’ischémie, qui accumule le potassium extracellulaire, et une hypokaliémie marquée, qui réduit le courant IK1, produisent cette dépolarisation ; les catécholamines accélèrent la décharge.</p>
<div class="lab">Pourquoi le choc peut échouer</div><p>Le choc rend réfractaire tout le myocarde excitable, ce qui éteint une réentrée, mais il ne modifie pas la dépolarisation spontanée d’un foyer. Dans une tachycardie atriale focale automatique et incessante, le foyer repart dès la repolarisation suivante : répéter les chocs n’est alors probablement pas approprié (ESC 2019).</p>
<div class="lab">Pourquoi la stimulation ne le déclenche pas</div><p>Un foyer automatique n’a pas besoin d’une extrasystole pour démarrer : la stimulation programmée, qui déclenche une réentrée en créant un bloc unidirectionnel, ne le reproduit pas.</p>
<div class="lab">Source complémentaire</div><p>Antzelevitch et Burashnikov, Overview of basic mechanisms of cardiac arrhythmia, Cardiac Electrophysiology Clinics 2011;3:23-45 ; Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 11.1.2.2.</p>
</template>

<template data-pop="i47-declench" data-title="Activité déclenchée : post-dépolarisations">
<div class="lab">Post-dépolarisations précoces</div><p>Oscillations pendant la phase 2 ou 3, quand la repolarisation est allongée : réactivation du courant calcique de type L ou du courant sodique tardif. Favorisées par la bradycardie, les pauses, l’hypokaliémie, les bloqueurs de IKr. Mécanisme des torsades de pointes.</p>
<div class="lab">Post-dépolarisations tardives</div><p>Oscillations après la repolarisation complète, dues à une libération spontanée de calcium par le réticulum sarcoplasmique ; le calcium est expulsé par l’échangeur sodium-calcium, qui fait entrer du sodium et dépolarise. Favorisées par la tachycardie, les catécholamines, la digoxine. Mécanisme de la TVPC, des TV de la chambre de chasse et de l’intoxication digitalique.</p>
<div class="lab">Corrélation thérapeutique</div><p>Précoces dans les torsades : magnésium, correction du potassium ; accélérer la fréquence si des récidives dépendent des pauses. L’isoprénaline est réservée au QT long acquis sans ischémie, et n’est pas utilisée dans le QT long congénital. Tardives : bêtabloquant, vérapamil (chambre de chasse), flécaïnide (TVPC), antidote digitalique.</p>
<div class="lab">Pourquoi ces facteurs</div><p>Les post-dépolarisations précoces apparaissent quand la repolarisation s’attarde assez pour que des courants entrants se réactivent : tout ce qui réduit les courants potassiques ou augmente les courants entrants les favorise. La bradycardie et les pauses allongent le potentiel d’action, et l’hypokaliémie réduit IKr. Les post-dépolarisations tardives naissent d’une surcharge calcique : la tachycardie fait entrer plus de calcium par unité de temps, les catécholamines l’augmentent par l’AMPc, et la digoxine, en bloquant la pompe sodium-potassium, réduit l’expulsion du calcium par l’échangeur sodium-calcium.</p>
<div class="lab">Pourquoi ces traitements</div><p>Contre les post-dépolarisations précoces, les mesures du <button class="w" data-k="i47-tdp-tt">traitement des torsades</button> raccourcissent la repolarisation ou suppriment les pauses ; le mode d’action du magnésium reste discuté (Drew et al., 2010). Contre les tardives, le bêtabloquant et le vérapamil réduisent l’entrée de calcium, la flécaïnide freine sa libération par le récepteur de la ryanodine, mécanisme encore discuté, et les fragments d’anticorps antidigoxine fixent le médicament.</p>
<div class="lab">Source complémentaire</div><p>Antzelevitch et Burashnikov, Overview of basic mechanisms of cardiac arrhythmia, Cardiac Electrophysiology Clinics 2011;3:23-45 ; Drew et al., Prevention of torsade de pointes in hospital settings, Circulation 2010;121:1047-60 ; Watanabe et al., Nature Medicine 2009;15:380-3.</p>
</template>

<template data-pop="i47-dualite" data-title="Dualité nodale">
<div class="lab">Physiologie</div><p>Le nœud reçoit l’influx atrial par deux entrées : une voie rapide antérosupérieure (période réfractaire longue) et une voie lente postéro-inférieure (période réfractaire courte), issue des extensions inférieures du nœud.</p>
<div class="lab">Mise en évidence</div><p>En EEP, lors de stimulations atriales de plus en plus précoces, l’intervalle AH augmente brusquement de plus de 50 ms pour une réduction de 10 ms du couplage : c’est le « saut » qui signe le passage de la voie rapide à la voie lente.</p>
<div class="lab">Signification</div><p>Présente chez de nombreux sujets sans tachycardie ; seule l’association à une tachycardie inductible et symptomatique a une valeur. Sur l’ECG de surface, deux PR distincts alternants peuvent parfois se voir.</p>
<div class="lab">Pourquoi deux voies</div><p>Le nœud et ses extensions sont faits de cellules mal couplées, dont les jonctions communicantes expriment des isoformes différentes de connexines. La conduction y est donc hétérogène, ce qui permet à deux trajets de vitesses et de périodes réfractaires différentes de coexister. Le circuit exact de la TRIN reste toutefois mal défini (ESC 2019).</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 11.2.1.</p>
</template>

<template data-pop="i47-trin" data-title="Tachycardie par réentrée intranodale (TRIN)">
<div class="lab">Formes</div><p><b>Typique, lente-rapide</b> (environ 90 %) : descente par la voie lente, remontée par la rapide ; RP très court, P cachée ou pseudo-r′ en V1. <b>Atypiques</b> (rapide-lente, lente-lente) : RP long, P négative en inférieur.</p>
<div class="lab">Clinique</div><p>Femme jeune ou d’âge moyen ; crises régulières de 140 à 250/min, débutant et finissant brutalement ; battements cervicaux ; polyurie.</p>
<div class="lab">Traitement</div><p>Aigu : Valsalva modifiée, adénosine. Fond : ablation de la voie lente (classe I, succès &gt; 95 %, risque de bloc &lt; 1 %) ; sinon vérapamil, diltiazem ou bêtabloquant (IIa).</p>
<div class="lab">Piège</div><p>Un ECG intercritique normal est la règle ; il ne permet pas d’exclure la TRIN.</p></template>

<template data-pop="i47-trav" data-title="Tachycardie réciproque auriculoventriculaire (TRAV)">
<div class="lab">Orthodromique</div><p>Descente par le nœud, remontée par la voie accessoire ; QRS fin ; P rétrograde dans le ST, RP &gt; 70 ms. Possible avec une voie cachée (ECG de base normal).</p>
<div class="lab">Antidromique</div><p>Descente par la voie accessoire, remontée habituellement par le nœud ; QRS large entièrement pré-excité ; diagnostic différentiel difficile avec la TV. Une deuxième voie accessoire peut assurer la remontée : le nœud ne participe alors pas au circuit, et son blocage ne suffit pas à arrêter la tachycardie (ESC 2019).</p>
<div class="lab">Tachycardie jonctionnelle réciproque permanente (Coumel)</div><p>Voie accessoire postéroseptale à conduction lente et décrémentielle ; tachycardie incessante à RP long chez l’enfant ; cause de cardiomyopathie rythmique ; traitement par ablation.</p>
<div class="lab">Signe de voie accessoire</div><p>Un bloc de branche fonctionnel homolatéral à la voie ralentit la tachycardie (le circuit s’allonge) : argument diagnostique en EEP.</p>
<div class="lab">Pourquoi la tachycardie de Coumel est incessante</div><p>La voie accessoire conduit lentement et de façon décrémentielle en sens rétrograde : le nœud a toujours le temps de récupérer avant le retour de l’influx, si bien que le circuit s’amorce facilement et se maintient. Présente une grande partie du temps, la tachycardie épuise le ventricule, d’où la cardiomyopathie rythmique, qui régresse en général après une ablation réussie (ESC 2019).</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, section 11.5.4.</p>
</template>

<template data-pop="i47-koch" data-title="Triangle de Koch">
<div class="lab">Limites</div><p>Tendon de Todaro (en arrière et en haut), insertion du feuillet septal de la valve tricuspide (en avant), ostium du sinus coronaire (base).</p>
<div class="lab">Contenu</div><p>Le nœud auriculoventriculaire compact à l’apex, prolongé par le faisceau de His qui traverse le corps fibreux central ; les extensions inférieures du nœud le long de l’anneau tricuspide.</p>
<div class="lab">Corrélation</div><p>L’ablation de la voie lente vise la partie inférieure du triangle, entre l’anneau tricuspide et le sinus coronaire. Plus on remonte vers l’apex, plus le risque de bloc auriculoventriculaire augmente. La cryoablation, réversible au début de l’application, est parfois choisie chez l’enfant ou pour les voies proches du His.</p></template>

<template data-pop="i47-cicatrice" data-title="Isthmes de cicatrice et TV monomorphe">
<div class="lab">Substrat</div><p>Faisceaux de myocytes survivants dans la cicatrice d’infarctus, séparés par du collagène : conduction lente, en zigzag, bloc unidirectionnel possible.</p>
<div class="lab">Circuit</div><p>Entrée de l’isthme → conduction lente (silencieuse sur l’ECG de surface, pendant la diastole) → sortie dans le myocarde sain (début du QRS) → retour vers l’entrée.</p>
<div class="lab">Marqueurs</div><p>ECG : onde Q, QRS fragmenté. IRM : rehaussement tardif hétérogène (zone grise). Cartographie : potentiels fragmentés et tardifs.</p>
<div class="lab">Corrélation</div><p>Le risque de TV persiste des années après l’infarctus, même avec une FEVG modérément réduite. L’ablation cible l’isthme et les potentiels anormaux.</p>
<div class="lab">Pourquoi l’isthme est muet</div><p>Les faisceaux de myocytes survivants, isolés par des bandes de fibrose, conduisent lentement, à environ 25 cm/s, et ne produisent que de petits électrogrammes fragmentés (de Bakker et al., 1988). Leur masse est trop faible pour s’inscrire sur l’ECG de surface : la conduction dans l’isthme se déroule pendant la diastole, et le QRS ne commence qu’à la sortie, quand le front envahit le myocarde sain.</p>
<div class="lab">Pourquoi ces marqueurs</div><p>Le gadolinium s’accumule dans l’espace extracellulaire élargi de la fibrose. Une zone d’intensité intermédiaire, mêlant fibrose et myocytes vivants, correspond à ces couloirs : plus elle est étendue, plus une TV monomorphe est inductible, à FEVG égale (Schmidt et al., 2007). Le QRS fragmenté reflète probablement la même activation hétérogène autour de la cicatrice.</p>
<div class="lab">Pourquoi le risque dure</div><p>La fibrose est définitive ; la revascularisation ne la supprime pas et ne prévient pas la récidive d’une TV monomorphe (ESC 2022).</p>
<div class="lab">Source complémentaire</div><p>de Bakker et al., Circulation 1988;77:589-606 ; Schmidt et al., Circulation 2007;115:2006-14 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, section 7.1.1.3.4.</p>
</template>

<template data-pop="i47-repol" data-title="Réserve de repolarisation">
<div class="lab">Concept</div><p>La repolarisation dépend de plusieurs courants potassiques redondants (IKr, IKs, IK1). Quand l’un est bloqué, les autres compensent. La réserve est la capacité de compensation.</p>
<div class="lab">Diminution de la réserve</div><p>Variant génétique discret, sexe féminin (moins de courant potassique), hypokaliémie (IKr moins actif), bradycardie, hypertrophie, insuffisance cardiaque, âge.</p>
<div class="lab">Conséquence</div><p>Un médicament qui bloque IKr allonge peu le QT chez un sujet à réserve normale, beaucoup chez un sujet à réserve diminuée. D’où l’accumulation des facteurs de risque dans presque tous les cas de torsades médicamenteuses.</p>
<div class="lab">Dispersion</div><p>L’allongement est inégal entre l’endocarde, la couche moyenne (cellules M) et l’épicarde : cette dispersion transmurale de la repolarisation fournit le substrat de la réentrée qui entretient la torsade.</p>
<div class="lab">Pourquoi ces facteurs s’additionnent</div><p>L’hypokaliémie réduit IKr et augmente son blocage par les médicaments (Yang et Roden, 1996) ; l’hypomagnésémie et, plus rarement, l’hypocalcémie s’y ajoutent. Les femmes représentent 70 % des torsades publiées sous antiarythmique (Makkar et al., 1993) ; leur QTc normal est plus long que celui des hommes. L’insuffisance rénale accumule le sotalol ; l’insuffisance hépatique ou un inhibiteur enzymatique accumule les molécules métabolisées par le foie. La bradycardie et les pauses allongent chaque potentiel d’action, et l’anorexie mentale cumule hypokaliémie, hypomagnésémie et bradycardie.</p>
<div class="lab">Conséquence pratique</div><p>Le risque naît surtout du cumul : une femme âgée sous diurétique, bradycarde, recevant deux médicaments allongeant le QT, réunit presque tous ces facteurs. Chez elle, chaque nouveau médicament se vérifie, le potassium et le magnésium se normalisent, et un ECG est enregistré avant et après l’introduction (Drew et al., 2010 ; ESC 2022).</p>
<div class="lab">Source complémentaire</div><p>Yang et Roden, Circulation 1996;93:407-11 ; Makkar et al., JAMA 1993;270:2590-7 ; Drew et al., Circulation 2010;121:1047-60 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, figure 13.</p>
</template>

<template data-pop="i47-herg" data-title="Canal hERG et QT long médicamenteux">
<div class="lab">Nom</div><p>Le canal du courant IKr est codé par le gène <i>KCNH2</i>, historiquement appelé hERG (« human ether-à-go-go-related gene »).</p>
<div class="lab">Pourquoi tant de médicaments</div><p>Sa cavité interne est large et tapissée de résidus aromatiques (tyrosine, phénylalanine) qui fixent des molécules très diverses. D’autres canaux potassiques n’ont pas cette géométrie.</p>
<div class="lab">Conséquence réglementaire</div><p>Depuis 2005, les lignes directrices internationales d’enregistrement imposent que tout nouveau médicament fasse l’objet d’une évaluation de son effet sur le QT avant autorisation.</p>
<div class="lab">Corrélation</div><p>Un médicament qui bloque aussi le courant calcique ou le courant sodique tardif (vérapamil, ranolazine) allonge parfois le QT sans augmenter le risque de torsades : l’allongement du QT est un marqueur imparfait du risque.</p></template>

<template data-pop="i47-aberr" data-title="Aberration de conduction">
<div class="lab">Définition</div><p>Bloc de branche fonctionnel, dépendant de la fréquence, chez un patient qui conduit normalement à fréquence lente.</p>
<div class="lab">Mécanisme</div><p>La période réfractaire des branches (surtout la droite) s’allonge après un cycle long. Si un influx arrive tôt après ce cycle long, une branche est encore réfractaire : QRS large.</p>
<div class="lab">Phénomène d’Ashman</div><p>En fibrillation auriculaire, un QRS large isolé suivant la séquence cycle long – cycle court, à morphologie de retard droit.</p>
<div class="lab">Indices d’aberration</div><p>Morphologie de bloc de branche typique (retard droit triphasique rsR′ en V1, ou retard gauche avec descente rapide de S en V1) ; début rapide du QRS ; tracé de base identique ; P visible et liée à chaque QRS.</p></template>

<template data-pop="i47-dissoc" data-title="Dissociation auriculoventriculaire">
<div class="lab">Définition</div><p>Les oreillettes (rythme sinusal) et les ventricules (TV) battent chacun à leur fréquence, sans relation ; les ventricules sont plus rapides.</p>
<div class="lab">Recherche</div><p>Ondes P qui « marchent » à travers les QRS, à cadence propre, mieux vues en DII et V1 ; parfois seulement devinées par des déformations irrégulières du ST et de l’onde T. Un compas ou une réglette aide à repérer leur régularité.</p>
<div class="lab">Valeur</div><p>Spécificité proche de 100 % pour la TV ; sensibilité d’environ 20 à 50 % selon la visibilité. Une conduction rétrograde de la TV vers les oreillettes existe chez jusqu’à 50 % des patients, et elle peut être 1:1, mais la plupart des TV comptent plus de QRS que d’ondes P (ESC 2019) : l’absence de dissociation visible n’exclut donc rien.</p>
<div class="lab">Clinique</div><p>Ondes a en canon irrégulières, B1 d’intensité variable.</p></template>

<template data-pop="i47-fusion" data-title="Complexes de capture et de fusion">
<div class="lab">Capture</div><p>Une onde P sinusale arrive quand le nœud et le faisceau de His et le réseau de Purkinje sont excitables : elle active seule les ventricules. Le QRS est fin, prématuré, au milieu de la tachycardie à QRS larges.</p>
<div class="lab">Fusion</div><p>L’influx sinusal et l’influx de la TV activent chacun une partie des ventricules : QRS de morphologie intermédiaire.</p>
<div class="lab">Valeur</div><p>Preuve de la dissociation, donc de la TV. Plus fréquents lorsque la TV est lente, car un cycle long laisse plus souvent à l’onde P sinusale le temps de trouver le faisceau de His et les ventricules redevenus excitables.</p>
<div class="lab">Piège</div><p>Une extrasystole ventriculaire de fusion peut aussi survenir pendant une TSV avec aberration ; le contexte et la régularité aident.</p></template>

<template data-pop="i47-tvns" data-title="Tachycardie ventriculaire non soutenue (TVNS)">
<div class="lab">Définition</div><p>Au moins trois battements ventriculaires consécutifs à plus de 100/min (certaines définitions : 120/min), durant moins de 30 secondes, sans instabilité.</p>
<div class="lab">Sur cœur sain</div><p>Fréquente au Holter, notamment chez le sujet âgé et l’athlète ; pronostic bon. Chercher toutefois une cardiopathie par échocardiographie, et par IRM si la TVNS est polymorphe, rapide, d’effort ou d’une morphologie atypique.</p>
<div class="lab">Sur cardiopathie</div><p>Marqueur de risque (cardiomyopathie hypertrophique : variable du score HCM Risk-SCD ; cicatrice avec FEVG réduite). Elle n’impose pas à elle seule un DAI, mais oriente la stratification.</p>
<div class="lab">TVNS polymorphe d’effort chez un jeune</div><p>Évoquer une TVPC : épreuve d’effort.</p></template>

<template data-pop="i47-tdp" data-title="Torsades de pointes">
<div class="lab">Définition</div><p>TV polymorphe dont les QRS changent d’amplitude et de polarité en tournant autour de la ligne de base, sur un QT allongé ; fréquence de 160 à 240/min, inférieure à celle de la FV (Drew et al., 2010).</p>
<div class="lab">Déroulement</div><p>Séquence court-long-court : extrasystole, pause, battement à QT très long, puis salve. Les salves s’arrêtent souvent seules, en ralentissant sur leurs derniers battements ; chacune suspend le débit, d’où des syncopes répétées, et certaines dégénèrent en FV (Drew et al., 2010).</p>
<div class="lab">Causes</div><p>QT long congénital ; QT long acquis (médicaments, hypokaliémie, hypomagnésémie, bradycardie, bloc auriculoventriculaire complet).</p>
<div class="lab">Piège</div><p>Une TV polymorphe sur QT normal n’est pas une torsade : c’est le plus souvent une ischémie aiguë, qui relève de la coronarographie, non du magnésium.</p></template>

<template data-pop="i47-tvpc" data-title="Tachycardie ventriculaire polymorphe catécholergique (TVPC)">
<div class="lab">Mécanisme</div><p>Variant de <i>RYR2</i> (dominant) ou de <i>CASQ2</i> (récessif) : le réticulum sarcoplasmique libère du calcium de façon anarchique sous stimulation adrénergique ; post-dépolarisations tardives ; foyers alternants dans les deux ventricules, d’où la TV bidirectionnelle.</p>
<div class="lab">Clinique</div><p>Syncope ou arrêt à l’effort ou à l’émotion, souvent avant 20 ans ; parfois étiquetée à tort épilepsie. ECG de repos et échocardiographie normaux.</p>
<div class="lab">Diagnostic</div><p>Épreuve d’effort : extrasystoles de complexité croissante à partir d’environ 100–120/min, TV bidirectionnelle ou polymorphe. Dans un modèle expérimental, chaque foyer a une fréquence seuil au-delà de laquelle ses post-dépolarisations tardives déclenchent un battement ; deux foyers qui se répondent donnent la TV bidirectionnelle, davantage la TV polymorphe (Baher et al., 2011). Génétique (classe I).</p>
<div class="lab">Traitement (ESC 2022)</div><p>Bêtabloquant non sélectif (propranolol, nadolol) chez tous les patients (I) ; flécaïnide en association si récidive (IIa) ; dénervation sympathique cardiaque gauche (IIa) ; DAI après arrêt, avec bêtabloquant et flécaïnide. Pas de sport de compétition intense.</p></template>

<template data-pop="i47-qtl" data-title="QT long congénital">
<div class="lab">Épidémiologie</div><p>Environ 1 naissance sur 2 000 (dépistage néonatal italien). Trois types représentent la grande majorité des génotypes positifs.</p>
<div class="lab">Types</div><p><b>Type 1</b> (<i>KCNQ1</i>, IKs ↓) : événements à l’effort, surtout en nageant ; onde T large. <b>Type 2</b> (<i>KCNH2</i>, IKr ↓) : émotions, stimuli auditifs brusques, post-partum ; onde T bifide, de faible amplitude. <b>Type 3</b> (<i>SCN5A</i>, courant sodique tardif ↑) : repos, sommeil ; long segment ST, onde T tardive.</p>
<div class="lab">Risque</div><p>Plus élevé si QTc &gt; 500 ms, syncope récente, type 2 chez la femme adulte, type 3 chez l’homme, enfant ou adolescent symptomatique.</p>
<div class="lab">Formes syndromiques</div><p>Jervell et Lange-Nielsen (surdité congénitale, récessive, sévère) ; Andersen et Tawil (<i>KCNJ2</i>) ; Timothy (<i>CACNA1C</i>).</p>
<div class="lab">Pourquoi les déclencheurs diffèrent</div><p>Le courant IKs, déficitaire dans le type 1, est celui que la stimulation adrénergique renforce pour raccourcir le potentiel d’action à l’effort : sans lui, le QT ne raccourcit pas quand la fréquence monte, et 62 % des événements surviennent à l’effort. Dans le type 2, une décharge adrénergique brutale survient sur une repolarisation privée d’une partie de IKr. Dans le type 3, le courant sodique tardif pèse surtout aux fréquences lentes : 39 % des événements surviennent au repos ou pendant le sommeil (Schwartz et al., 2001).</p>
<div class="lab">Pourquoi la surdité</div><p>Le canal formé par <i>KCNQ1</i> est aussi exprimé dans la strie vasculaire de l’oreille interne, où il contrôle probablement la composition de l’endolymphe ; quand les deux allèles sont atteints, l’audition et la repolarisation sont toutes deux défaillantes (Neyroud et al., 1997).</p>
<div class="lab">Risque : des associations</div><p>Avant 40 ans et sans traitement, un premier événement touchait 30 % des porteurs d’un type 1, 46 % d’un type 2 et 42 % d’un type 3 ; le QTc prédisait le risque dans les types 1 et 2, le sexe seulement dans le type 3 (Priori et al., 2003). Ces facteurs désignent les patients à surveiller de près ; ils ne décident pas seuls d’un DAI.</p>
<div class="lab">Source complémentaire</div><p>Schwartz et al., Circulation 2001;103:89-95 ; Neyroud et al., Nature Genetics 1997;15:186-9 ; Priori et al., New England Journal of Medicine 2003;348:1866-74.</p>
</template>

<template data-pop="i47-mnemo-lqt" data-title="« Nager, sonner, dormir » — déclencheurs du QT long">
<p><b>Nager</b> — type <b>1</b> : effort, en particulier la natation et la plongée en eau froide.<br><b>Sonner</b> — type <b>2</b> : stimulus auditif brusque (réveil, téléphone), émotion, post-partum.<br><b>Dormir</b> — type <b>3</b> : repos, sommeil, bradycardie.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. L’ordre suit la numérotation des types. Les chevauchements existent : un type 2 peut faire un événement à l’effort.</p></template>
