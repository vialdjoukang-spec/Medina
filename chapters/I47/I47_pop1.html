
<!-- ===== FENÊTRES I47 : mécanismes et entités ===== -->
<template data-pop="i47-pa" data-title="Potentiel d’action cardiaque">
<div class="lab">Myocyte ventriculaire</div><p><b>Phase 0</b> : ouverture du canal sodique rapide, entrée massive de Na⁺, montée de −85 à +20 millivolts en 1 à 2 ms ; elle détermine la vitesse de conduction et la largeur du QRS. <b>Phase 1</b> : sortie transitoire de K⁺ (courant transitoire sortant). <b>Phase 2</b> : plateau, entrée de Ca²⁺ par les canaux de type L, équilibrée par la sortie de K⁺. <b>Phase 3</b> : repolarisation par les courants potassiques rapide (IKr) et lent (IKs). <b>Phase 4</b> : repos stable grâce au courant IK1.</p>
<div class="lab">Cellule nodale</div><p>Pas de courant sodique rapide : phase 0 calcique, lente. Phase 4 ascendante (courant If, horloge calcique) : automatisme. Réfractarité prolongée au-delà de la repolarisation.</p>
<div class="lab">Traduction ECG</div><p>Phase 0 ventriculaire = QRS ; phases 2 et 3 = segment ST et onde T ; durée totale ≈ intervalle QT.</p>
<div class="lab">Corrélation</div><p>Bloqueur sodique : phase 0 ralentie, QRS élargi. Bloqueur potassique : phase 3 allongée, QT allongé. Bloqueur calcique : conduction nodale ralentie, PR allongé.</p></template>

<template data-pop="i47-reentree" data-title="Réentrée">
<div class="lab">Définition</div><p>Un influx, au lieu de s’éteindre après avoir activé le cœur, revient activer une région redevenue excitable, et tourne ainsi en boucle.</p>
<div class="lab">Trois conditions</div><p>1. Deux voies de conduction reliées à leurs extrémités (obstacle anatomique ou fonctionnel). 2. Un bloc unidirectionnel dans l’une d’elles. 3. Une conduction assez lente dans l’autre pour que la première ait récupéré quand l’influx y revient.</p>
<div class="lab">Exemple</div><p>TRIN : une extrasystole auriculaire bloquée dans la voie rapide (réfractaire) descend par la voie lente ; quand elle atteint la partie basse du nœud, la voie rapide a récupéré et la conduit en sens rétrograde : la boucle est fermée.</p>
<div class="lab">Signature clinique</div><p>Début et fin brutaux ; déclenchement et arrêt par une extrasystole ou une stimulation programmée ; fréquence fixe.</p>
<div class="lab">Corrélation thérapeutique</div><p>Couper une branche du circuit (ablation), bloquer transitoirement un maillon (adénosine sur le nœud), ou allonger la période réfractaire (classe III).</p></template>

<template data-pop="i47-automat" data-title="Automatisme anormal">
<div class="lab">Mécanisme</div><p>Des cellules atriales ou ventriculaires, normalement stables en phase 4, se dépolarisent spontanément, sous l’effet de l’ischémie, de l’étirement, des catécholamines ou de troubles métaboliques.</p>
<div class="lab">Indices ECG</div><p>Démarrage progressif sur quelques battements (« échauffement ») et ralentissement progressif (« refroidissement ») ; premier battement de même morphologie que les suivants ; non déclenché par la stimulation programmée.</p>
<div class="lab">Exemples</div><p>Tachycardie atriale focale automatique ; tachycardie jonctionnelle ectopique (enfant, postopératoire) ; rythme idioventriculaire accéléré de reperfusion.</p>
<div class="lab">Conséquence</div><p>La cardioversion électrique est souvent inefficace : le foyer redémarre immédiatement. On ralentit le foyer ou la conduction, ou on l’ablate.</p></template>

<template data-pop="i47-declench" data-title="Activité déclenchée : post-dépolarisations">
<div class="lab">Post-dépolarisations précoces</div><p>Oscillations pendant la phase 2 ou 3, quand la repolarisation est allongée : réactivation du courant calcique de type L ou du courant sodique tardif. Favorisées par la bradycardie, les pauses, l’hypokaliémie, les bloqueurs de IKr. Mécanisme des torsades de pointes.</p>
<div class="lab">Post-dépolarisations tardives</div><p>Oscillations après la repolarisation complète, dues à une libération spontanée de calcium par le réticulum sarcoplasmique ; le calcium est expulsé par l’échangeur sodium-calcium, qui fait entrer du sodium et dépolarise. Favorisées par la tachycardie, les catécholamines, la digoxine. Mécanisme de la TVPC, des TV de la chambre de chasse et de l’intoxication digitalique.</p>
<div class="lab">Corrélation thérapeutique</div><p>Précoces : magnésium, potassium, accélérer la fréquence. Tardives : bêtabloquant, vérapamil (chambre de chasse), flécaïnide (TVPC), antidote digitalique.</p></template>

<template data-pop="i47-dualite" data-title="Dualité nodale">
<div class="lab">Physiologie</div><p>Le nœud reçoit l’influx atrial par deux entrées : une voie rapide antérosupérieure (période réfractaire longue) et une voie lente postéro-inférieure (période réfractaire courte), issue des extensions inférieures du nœud.</p>
<div class="lab">Mise en évidence</div><p>En EEP, lors de stimulations atriales de plus en plus précoces, l’intervalle AH augmente brusquement de plus de 50 ms pour une réduction de 10 ms du couplage : c’est le « saut » qui signe le passage de la voie rapide à la voie lente.</p>
<div class="lab">Signification</div><p>Présente chez de nombreux sujets sans tachycardie ; seule l’association à une tachycardie inductible et symptomatique a une valeur. Sur l’ECG de surface, deux PR distincts alternants peuvent parfois se voir.</p></template>

<template data-pop="i47-trin" data-title="Tachycardie par réentrée intranodale (TRIN)">
<div class="lab">Formes</div><p><b>Typique, lente-rapide</b> (environ 90 %) : descente par la voie lente, remontée par la rapide ; RP très court, P cachée ou pseudo-r′ en V1. <b>Atypiques</b> (rapide-lente, lente-lente) : RP long, P négative en inférieur.</p>
<div class="lab">Clinique</div><p>Femme jeune ou d’âge moyen ; crises régulières de 140 à 250/min, débutant et finissant brutalement ; battements cervicaux ; polyurie.</p>
<div class="lab">Traitement</div><p>Aigu : Valsalva modifiée, adénosine. Fond : ablation de la voie lente (classe I, succès &gt; 95 %, risque de bloc &lt; 1 %) ; sinon vérapamil, diltiazem ou bêtabloquant (IIa).</p>
<div class="lab">Piège</div><p>Un ECG intercritique normal est la règle ; il ne permet pas d’exclure la TRIN.</p></template>

<template data-pop="i47-trav" data-title="Tachycardie réciproque auriculoventriculaire (TRAV)">
<div class="lab">Orthodromique</div><p>Descente par le nœud, remontée par la voie accessoire ; QRS fin ; P rétrograde dans le ST, RP &gt; 70 ms. Possible avec une voie cachée (ECG de base normal).</p>
<div class="lab">Antidromique</div><p>Descente par la voie accessoire, remontée par le nœud ; QRS large entièrement pré-excité ; diagnostic différentiel difficile avec la TV.</p>
<div class="lab">Tachycardie jonctionnelle réciproque permanente (Coumel)</div><p>Voie accessoire postéroseptale à conduction lente et décrémentielle ; tachycardie incessante à RP long chez l’enfant ; cause de cardiomyopathie rythmique ; traitement par ablation.</p>
<div class="lab">Signe de voie accessoire</div><p>Un bloc de branche fonctionnel homolatéral à la voie ralentit la tachycardie (le circuit s’allonge) : argument diagnostique en EEP.</p></template>

<template data-pop="i47-koch" data-title="Triangle de Koch">
<div class="lab">Limites</div><p>Tendon de Todaro (en arrière et en haut), insertion du feuillet septal de la valve tricuspide (en avant), ostium du sinus coronaire (base).</p>
<div class="lab">Contenu</div><p>Le nœud auriculoventriculaire compact à l’apex, prolongé par le faisceau de His qui traverse le corps fibreux central ; les extensions inférieures du nœud le long de l’anneau tricuspide.</p>
<div class="lab">Corrélation</div><p>L’ablation de la voie lente vise la partie inférieure du triangle, entre l’anneau tricuspide et le sinus coronaire. Plus on remonte vers l’apex, plus le risque de bloc auriculoventriculaire augmente. La cryoablation, réversible au début de l’application, est parfois choisie chez l’enfant ou pour les voies proches du His.</p></template>

<template data-pop="i47-cicatrice" data-title="Isthmes de cicatrice et TV monomorphe">
<div class="lab">Substrat</div><p>Faisceaux de myocytes survivants dans la cicatrice d’infarctus, séparés par du collagène : conduction lente, en zigzag, bloc unidirectionnel possible.</p>
<div class="lab">Circuit</div><p>Entrée de l’isthme → conduction lente (silencieuse sur l’ECG de surface, pendant la diastole) → sortie dans le myocarde sain (début du QRS) → retour vers l’entrée.</p>
<div class="lab">Marqueurs</div><p>ECG : onde Q, QRS fragmenté. IRM : rehaussement tardif hétérogène (zone grise). Cartographie : potentiels fragmentés et tardifs.</p>
<div class="lab">Corrélation</div><p>Le risque de TV persiste des années après l’infarctus, même avec une FEVG modérément réduite. L’ablation cible l’isthme et les potentiels anormaux.</p></template>

<template data-pop="i47-repol" data-title="Réserve de repolarisation">
<div class="lab">Concept</div><p>La repolarisation dépend de plusieurs courants potassiques redondants (IKr, IKs, IK1). Quand l’un est bloqué, les autres compensent. La réserve est la capacité de compensation.</p>
<div class="lab">Diminution de la réserve</div><p>Variant génétique discret, sexe féminin (moins de courant potassique), hypokaliémie (IKr moins actif), bradycardie, hypertrophie, insuffisance cardiaque, âge.</p>
<div class="lab">Conséquence</div><p>Un médicament qui bloque IKr allonge peu le QT chez un sujet à réserve normale, beaucoup chez un sujet à réserve diminuée. D’où l’accumulation des facteurs de risque dans presque tous les cas de torsades médicamenteuses.</p>
<div class="lab">Dispersion</div><p>L’allongement est inégal entre l’endocarde, la couche moyenne (cellules M) et l’épicarde : cette dispersion transmurale de la repolarisation fournit le substrat de la réentrée qui entretient la torsade.</p></template>

<template data-pop="i47-herg" data-title="Canal hERG et QT long médicamenteux">
<div class="lab">Nom</div><p>Le canal du courant IKr est codé par le gène <i>KCNH2</i>, historiquement appelé hERG (« human ether-à-go-go-related gene »).</p>
<div class="lab">Pourquoi tant de médicaments</div><p>Sa cavité interne est large et tapissée de résidus aromatiques (tyrosine, phénylalanine) qui fixent des molécules très diverses. D’autres canaux potassiques n’ont pas cette géométrie.</p>
<div class="lab">Conséquence réglementaire</div><p>Depuis 2005, les lignes directrices internationales d’enregistrement imposent que tout nouveau médicament fasse l’objet d’une évaluation de son effet sur le QT avant autorisation.</p>
<div class="lab">Corrélation</div><p>Un médicament qui bloque aussi le courant calcique ou le courant sodique tardif (vérapamil, ranolazine) allonge parfois le QT sans augmenter le risque de torsades : l’allongement du QT est un marqueur imparfait du risque.</p></template>

<template data-pop="i47-aberr" data-title="Aberration de conduction">
<div class="lab">Définition</div><p>Bloc de branche fonctionnel, dépendant de la fréquence, chez un patient qui conduit normalement à fréquence lente.</p>
<div class="lab">Mécanisme</div><p>La période réfractaire des branches (surtout la droite) s’allonge après un cycle long. Si un influx arrive tôt après ce cycle long, une branche est encore réfractaire : QRS large.</p>
<div class="lab">Phénomène d’Ashman</div><p>En fibrillation auriculaire, un QRS large isolé suivant la séquence cycle long – cycle court, à morphologie de retard droit.</p>
<div class="lab">Indices d’aberration</div><p>Morphologie de bloc de branche typique (retard droit triphasique rsR′ en V1, ou retard gauche avec descente rapide de S en V1) ; début rapide du QRS ; tracé de base identique ; P visible et liée à chaque QRS.</p></template>

<template data-pop="i47-dissoc" data-title="Dissociation auriculoventriculaire">
<div class="lab">Définition</div><p>Les oreillettes (rythme sinusal) et les ventricules (TV) battent chacun à leur fréquence, sans relation ; les ventricules sont plus rapides.</p>
<div class="lab">Recherche</div><p>Ondes P qui « marchent » à travers les QRS, à cadence propre, mieux vues en DII et V1 ; parfois seulement devinées par des déformations irrégulières du ST et de l’onde T. Un compas ou une réglette aide à repérer leur régularité.</p>
<div class="lab">Valeur</div><p>Spécificité proche de 100 % pour la TV ; sensibilité d’environ 20 à 50 % selon la visibilité. Une conduction rétrograde 1:1 de la TV vers les oreillettes existe dans près d’un tiers des TV : son absence n’exclut rien.</p>
<div class="lab">Clinique</div><p>Ondes a en canon irrégulières, B1 d’intensité variable.</p></template>

<template data-pop="i47-fusion" data-title="Complexes de capture et de fusion">
<div class="lab">Capture</div><p>Une onde P sinusale arrive quand le nœud et le faisceau de His et le réseau de Purkinje sont excitables : elle active seule les ventricules. Le QRS est fin, prématuré, au milieu de la tachycardie à QRS larges.</p>
<div class="lab">Fusion</div><p>L’influx sinusal et l’influx de la TV activent chacun une partie des ventricules : QRS de morphologie intermédiaire.</p>
<div class="lab">Valeur</div><p>Preuve de la dissociation, donc de la TV. Plus fréquents lorsque la TV est lente.</p>
<div class="lab">Piège</div><p>Une extrasystole ventriculaire de fusion peut aussi survenir pendant une TSV avec aberration ; le contexte et la régularité aident.</p></template>

<template data-pop="i47-tvns" data-title="Tachycardie ventriculaire non soutenue (TVNS)">
<div class="lab">Définition</div><p>Au moins trois battements ventriculaires consécutifs à plus de 100/min (certaines définitions : 120/min), durant moins de 30 secondes, sans instabilité.</p>
<div class="lab">Sur cœur sain</div><p>Fréquente au Holter, notamment chez le sujet âgé et l’athlète ; pronostic bon. Chercher toutefois une cardiopathie par échocardiographie, et par IRM si la TVNS est polymorphe, rapide, d’effort ou d’une morphologie atypique.</p>
<div class="lab">Sur cardiopathie</div><p>Marqueur de risque (cardiomyopathie hypertrophique : variable du score HCM Risk-SCD ; cicatrice avec FEVG réduite). Elle n’impose pas à elle seule un DAI, mais oriente la stratification.</p>
<div class="lab">TVNS polymorphe d’effort chez un jeune</div><p>Évoquer une TVPC : épreuve d’effort.</p></template>

<template data-pop="i47-tdp" data-title="Torsades de pointes">
<div class="lab">Définition</div><p>TV polymorphe dont les QRS changent d’amplitude et de polarité en tournant autour de la ligne de base, sur un QT allongé ; fréquence de 200 à 250/min.</p>
<div class="lab">Déroulement</div><p>Séquence court-long-court : extrasystole, pause, battement à QT très long, puis salve. Les salves s’arrêtent souvent seules (syncopes répétées) ou dégénèrent en FV.</p>
<div class="lab">Causes</div><p>QT long congénital ; QT long acquis (médicaments, hypokaliémie, hypomagnésémie, bradycardie, bloc auriculoventriculaire complet).</p>
<div class="lab">Piège</div><p>Une TV polymorphe sur QT normal n’est pas une torsade : c’est le plus souvent une ischémie aiguë, qui relève de la coronarographie, non du magnésium.</p></template>

<template data-pop="i47-tvpc" data-title="Tachycardie ventriculaire polymorphe catécholergique (TVPC)">
<div class="lab">Mécanisme</div><p>Variant de <i>RYR2</i> (dominant) ou de <i>CASQ2</i> (récessif) : le réticulum sarcoplasmique libère du calcium de façon anarchique sous stimulation adrénergique ; post-dépolarisations tardives ; foyers alternants dans les deux ventricules, d’où la TV bidirectionnelle.</p>
<div class="lab">Clinique</div><p>Syncope ou arrêt à l’effort ou à l’émotion, souvent avant 20 ans ; parfois étiquetée à tort épilepsie. ECG de repos et échocardiographie normaux.</p>
<div class="lab">Diagnostic</div><p>Épreuve d’effort : extrasystoles de complexité croissante à partir d’environ 100–120/min, TV bidirectionnelle ou polymorphe. Génétique (classe I).</p>
<div class="lab">Traitement (ESC 2022)</div><p>Bêtabloquant non sélectif (propranolol, nadolol) chez tous les patients (I) ; flécaïnide en association si récidive (IIa) ; dénervation sympathique cardiaque gauche (IIa) ; DAI après arrêt, avec bêtabloquant et flécaïnide. Pas de sport de compétition intense.</p></template>

<template data-pop="i47-qtl" data-title="QT long congénital">
<div class="lab">Épidémiologie</div><p>Environ 1 naissance sur 2 000 (dépistage néonatal italien). Trois types représentent la grande majorité des génotypes positifs.</p>
<div class="lab">Types</div><p><b>Type 1</b> (<i>KCNQ1</i>, IKs ↓) : événements à l’effort, surtout en nageant ; onde T large. <b>Type 2</b> (<i>KCNH2</i>, IKr ↓) : émotions, stimuli auditifs brusques, post-partum ; onde T bifide, de faible amplitude. <b>Type 3</b> (<i>SCN5A</i>, courant sodique tardif ↑) : repos, sommeil ; long segment ST, onde T tardive.</p>
<div class="lab">Risque</div><p>Plus élevé si QTc &gt; 500 ms, syncope récente, type 2 chez la femme adulte, type 3 chez l’homme, enfant ou adolescent symptomatique.</p>
<div class="lab">Formes syndromiques</div><p>Jervell et Lange-Nielsen (surdité congénitale, récessive, sévère) ; Andersen et Tawil (<i>KCNJ2</i>) ; Timothy (<i>CACNA1C</i>).</p></template>

<template data-pop="i47-mnemo-lqt" data-title="« Nager, sonner, dormir » — déclencheurs du QT long">
<p><b>Nager</b> — type <b>1</b> : effort, en particulier la natation et la plongée en eau froide.<br><b>Sonner</b> — type <b>2</b> : stimulus auditif brusque (réveil, téléphone), émotion, post-partum.<br><b>Dormir</b> — type <b>3</b> : repos, sommeil, bradycardie.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. L’ordre suit la numérotation des types. Les chevauchements existent : un type 2 peut faire un événement à l’effort.</p></template>
