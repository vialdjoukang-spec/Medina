
<!-- ===== FENÊTRES I47 : anamnèse et examen ===== -->
<template data-pop="i47-atcd-card" data-title="Antécédent de cardiopathie">
<div class="lab">Questions</div><p>« Avez-vous eu un infarctus, un stent, un pontage, une opération du cœur, une myocardite ? Vous a-t-on parlé d’un cœur dilaté ou épaissi ? » Demander la dernière FEVG connue et les comptes rendus.</p>
<div class="lab">Pourquoi</div><p>Une cardiopathie structurelle fait basculer la probabilité d’une tachycardie à QRS larges vers la TV (plus de 90 % après un infarctus), contre-indique les antiarythmiques de classe Ic, et ouvre la question du DAI.</p>
<div class="lab">Piège</div><p>Un infarctus silencieux ou ancien peut être ignoré du patient : l’ECG de base (onde Q) et l’échocardiographie le révèlent.</p></template>

<template data-pop="i47-atcd-fam" data-title="Mort subite dans la famille">
<div class="lab">Questions ciblées</div><p>« Quelqu’un dans votre famille est-il mort subitement, jeune (avant 40–50 ans), en dormant, en nageant, en faisant du sport ? Y a-t-il eu une noyade inexpliquée, un accident de voiture sans cause, une épilepsie atypique, un stimulateur ou un défibrillateur chez un jeune apparenté ? »</p>
<div class="lab">Arbre familial</div><p>Dessiner au moins trois générations ; noter l’âge et les circonstances de chaque décès, les résultats d’autopsie.</p>
<div class="lab">Pourquoi</div><p>Une mort subite précoce dans la famille est un critère diagnostique ou de risque dans le syndrome de Brugada, le QT long (score de Schwartz), les cardiomyopathies ; elle justifie un bilan de l’ensemble des apparentés du premier degré.</p></template>

<template data-pop="i47-atcd-medic" data-title="Médicaments et substances">
<div class="lab">Allongement du QT</div><p>Antipsychotiques, antidépresseurs (citalopram, escitalopram), méthadone, macrolides, fluoroquinolones, antifongiques azolés, ondansétron, dompéridone, hydroxychloroquine, antiarythmiques. Diurétiques (hypokaliémie).</p>
<div class="lab">Syndrome de Brugada</div><p>Lithium, antidépresseurs tricycliques, antiarythmiques de classe I, cocaïne, cannabis à forte dose, excès d’alcool.</p>
<div class="lab">Tachycardies</div><p>Sympathomimétiques (décongestionnants, bronchodilatateurs), hormones thyroïdiennes, caféine en grande quantité, boissons énergisantes, amphétamines, cocaïne.</p>
<div class="lab">Méthode</div><p>Demander aussi l’automédication, les compléments et les substances récréatives, sans jugement.</p></template>

<template data-pop="i47-s-palp" data-title="Palpitations : caractérisation">
<div class="lab">Questions</div><p>Rapides ou lentes ? régulières ou irrégulières (faire tapoter le rythme) ? début et fin brutaux ou progressifs ? durée ? fréquence des crises ? circonstances ? manœuvres qui les arrêtent ? symptômes associés ?</p>
<div class="lab">Orientation</div><p>Régulières, brutales, rapides : réentrée (TRIN, TRAV). Irrégulières : fibrillation auriculaire, extrasystoles. Progressives, à l’effort ou à l’anxiété : tachycardie sinusale. « Coups » isolés avec pause : extrasystoles.</p>
<div class="lab">Physiopathologie</div><p>La perception naît de la variation du volume d’éjection et de la contraction contre des valves fermées, plus que de la fréquence elle-même.</p>
<div class="lab">Piège</div><p>La fréquence mesurée par le patient ou sa montre peut être divisée par deux en cas de bigéminisme (battements non perçus) ; seul l’ECG fait foi.</p></template>

<template data-pop="i47-s-cou" data-title="Battements dans le cou (signe de la grenouille)">
<p>Sensation de battements rapides et réguliers dans le cou, et parfois pulsations cervicales visibles, amples et régulières, pendant la crise.</p>
<div class="lab">Mécanisme</div><p>Dans la TRIN typique, oreillettes et ventricules se contractent en même temps : à chaque battement, l’oreillette droite se contracte contre une valve tricuspide fermée ; le sang reflue dans les veines jugulaires (ondes a en canon régulières).</p>
<div class="lab">Valeur</div><p>Très évocateur d’une TRIN, moins fréquent dans la TRAV, où l’oreillette se contracte plus tard dans le cycle.</p></template>

<template data-pop="i47-s-polyurie" data-title="Polyurie après la crise">
<p>Émission d’urines abondantes pendant ou peu après une crise de TSV.</p>
<div class="lab">Mécanisme</div><p>La contraction atriale contre des valves fermées élève la pression atriale et étire les oreillettes : sécrétion de peptide natriurétique atrial, et inhibition réflexe de l’hormone antidiurétique.</p>
<div class="lab">Valeur</div><p>Oriente vers une TSV régulière (TRIN surtout) ; la présence de ce signe dans l’anamnèse a une valeur positive, son absence n’exclut rien.</p></template>

<template data-pop="i47-s-syncope" data-title="Syncope et lipothymie dans les tachycardies">
<div class="lab">Mécanismes</div><p>Chute brutale du débit au début d’une TSV très rapide, avant l’adaptation vasomotrice ; pause à l’arrêt de la tachycardie (dysfonction sinusale) ; TV rapide ; torsades ; FV.</p>
<div class="lab">Signaux d’alarme</div><p>Syncope à l’effort ou en position couchée ; sans prodrome ; précédée de palpitations ; avec traumatisme ; chez un patient porteur de cardiopathie ; histoire familiale de mort subite ; ECG anormal (pré-excitation, QT long, Brugada, onde Q).</p>
<div class="lab">Conduite</div><p>Toute syncope à caractère arythmique impose une évaluation rapide, un monitorage, une échocardiographie et, selon le contexte, un moniteur implantable ou une EEP. Dans la pré-excitation, une syncope est un marqueur de risque qui justifie l’ablation.</p></template>

<template data-pop="i47-s-trig" data-title="Déclencheurs et manœuvres d’arrêt">
<div class="lab">Déclencheurs</div><p>Se pencher en avant, se relever, effort brusque, déglutition, stress, repas copieux, alcool, manque de sommeil. Ils favorisent les extrasystoles qui initient la réentrée.</p>
<div class="lab">Manœuvres spontanées</div><p>Bloquer la respiration en poussant, tousser, boire de l’eau glacée, se mettre la tête en bas, s’allonger. Elles stimulent le nerf vague.</p>
<div class="lab">Interprétation</div><p>Un arrêt par manœuvre vagale signe une tachycardie qui dépend du nœud (TRIN, TRAV). Le patient peut être formé à la manœuvre de Valsalva modifiée à domicile.</p></template>

<template data-pop="i47-v-vitaux" data-title="Signes vitaux en tachycardie">
<div class="lab">Fréquence</div><p>Mesurer sur l’ECG, non au pouls : les battements précoces peuvent ne pas être perçus en périphérie. Une fréquence régulière de 150/min évoque un flutter 2:1.</p>
<div class="lab">Pression artérielle</div><p>Mesure répétée ; pression systolique &lt; 90 mmHg avec signes d’hypoperfusion : instabilité. La pression peut chuter brutalement pendant une TV initialement tolérée.</p>
<div class="lab">Saturation, fréquence respiratoire</div><p>Désaturation et polypnée : œdème pulmonaire, critère d’instabilité.</p>
<div class="lab">Critères d’instabilité</div><p>Choc, syncope, douleur thoracique ischémique, insuffisance cardiaque aiguë, altération de la conscience : cardioversion électrique synchronisée immédiate.</p></template>

<template data-pop="i47-e-canon" data-title="Ondes a en canon">
<div class="lab">Technique</div><p>Patient à 30–45°, observer la veine jugulaire interne droite en lumière tangentielle, en palpant simultanément le pouls carotidien gauche.</p>
<div class="lab">Régulières</div><p>À chaque battement : oreillette et ventricule se contractent en même temps (TRIN typique, rythme jonctionnel).</p>
<div class="lab">Irrégulières</div><p>Intermittentes, sans rythme : dissociation auriculoventriculaire, donc TV (ou bloc auriculoventriculaire complet).</p>
<div class="lab">Limite</div><p>Difficiles à voir à fréquence très élevée, chez l’obèse ou en décubitus strict ; signe utile mais inconstant.</p></template>

<template data-pop="i47-e-b1" data-title="Variation de B1 et de la pression systolique">
<p>À l’auscultation, l’intensité du premier bruit varie d’un battement à l’autre ; au tensiomètre, la pression systolique varie malgré un rythme régulier.</p>
<div class="lab">Mécanisme</div><p>En dissociation auriculoventriculaire, l’intervalle entre contraction atriale et ventriculaire change à chaque battement. Quand l’oreillette se contracte juste avant le ventricule, les valves auriculoventriculaires sont largement ouvertes et claquent fort (B1 intense) ; le remplissage, donc le volume d’éjection, varie aussi.</p>
<div class="lab">Valeur</div><p>Dans une tachycardie <b>régulière</b>, ce signe oriente vers une TV ; dans une tachycardie irrégulière, il est banal (fibrillation auriculaire).</p></template>

<template data-pop="i47-e-card" data-title="Signes de cardiopathie structurelle">
<div class="lab">À rechercher hors crise</div><p>Choc de pointe dévié ou étalé (dilatation), B3 (dysfonction ventriculaire), souffle systolique d’insuffisance mitrale, souffle éjectionnel de cardiomyopathie hypertrophique augmentant à la manœuvre de Valsalva, turgescence jugulaire, œdèmes, cicatrice de chirurgie cardiaque.</p>
<div class="lab">Pourquoi</div><p>Leur présence change le raisonnement : TV plus probable, antiarythmiques de classe Ic proscrits, stratification du risque de mort subite nécessaire.</p>
<div class="lab">Limite</div><p>Un examen normal n’exclut pas une cardiopathie (cardiomyopathie arythmogène débutante, sarcoïdose) : l’échocardiographie, voire l’IRM, restent nécessaires après une TV.</p></template>

<template data-pop="i47-vagal" data-title="Manœuvres vagales et Valsalva modifiée (essai REVERT)">
<div class="lab">Principe</div><p>La stimulation vagale ralentit la conduction du nœud auriculoventriculaire et peut interrompre une réentrée qui l’utilise.</p>
<div class="lab">Valsalva modifiée, pas à pas</div><p>1. Patient demi-assis (45°), monitoré, ECG en cours. 2. Expiration forcée contre résistance pendant 15 secondes, à une pression d’environ 40 mmHg ; en pratique, souffler dans une seringue de 10 mL assez fort pour déplacer le piston. 3. Immédiatement après, allonger le patient à plat et lever ses jambes à 45° pendant 15 secondes (retour veineux massif au moment de la relaxation, qui amplifie la réponse vagale). 4. Revenir en position demi-assise et relire l’ECG après 45 secondes. 5. Répéter une fois si échec.</p>
<div class="lab">Preuve</div><p>Essai REVERT (<i>Lancet</i> 2015, 433 patients) : retour en rythme sinusal à une minute chez 43 % des patients avec la manœuvre modifiée, contre 17 % avec la manœuvre classique ; moins de recours à l’adénosine.</p>
<div class="lab">Massage sinocarotidien</div><p>5 à 10 secondes d’un seul côté, après auscultation carotidienne ; à éviter en cas de souffle, d’antécédent d’AVC ou d’accident ischémique transitoire, chez le sujet âgé.</p>
<div class="lab">À proscrire</div><p>La compression des globes oculaires (risque de décollement de rétine).</p></template>
