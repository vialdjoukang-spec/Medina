
<!-- ===== FENÊTRES I47 : électrocardiogramme ===== -->
<template data-pop="i47-ecg-lecture" data-title="Lecture d’une tachycardie en six étapes">
<div class="lab">1. Largeur du QRS</div><p>Mesurée dans la dérivation où il est le plus large. &lt; 120 ms : supraventriculaire. ≥ 120 ms : démarche des QRS larges.</p>
<div class="lab">2. Régularité</div><p>Comparer plusieurs intervalles RR avec un compas ou une feuille. Irrégulier : fibrillation auriculaire, flutter à conduction variable, tachycardie multifocale.</p>
<div class="lab">3. Activité atriale</div><p>Chercher les P en DII, DIII, aVF, V1 ; comparer avec un tracé en rythme sinusal ; les déformations du ST et de la T trahissent une P cachée.</p>
<div class="lab">4. Rapport P/QRS</div><p>Plus de P que de QRS : tachycardie atriale ou flutter. 1:1 : toutes les TSV sont possibles.</p>
<div class="lab">5. Intervalle RP</div><p>RP court (&lt; 70 ms) : TRIN typique. RP intermédiaire, P dans le ST : TRAV. RP long (RP &gt; PR) : tachycardie atriale, TRIN atypique, tachycardie jonctionnelle réciproque permanente.</p>
<div class="lab">6. Morphologie de la P</div><p>Négative en inférieur : activation ascendante. Positive en V1 : oreillette gauche. Identique à la P sinusale : tachycardie sinusale ou réentrée sinusale.</p>
<div class="lab">Exemple</div><p>QRS 90 ms, régulier à 190/min, pas de P visible, petit r′ en V1 absent sur le tracé sinusal : TRIN typique.</p></template>

<template data-pop="i47-ecg-rp" data-title="Intervalle RP">
<div class="lab">Mesure</div><p>Du début du QRS au début de l’onde P qui le suit, en tachycardie.</p>
<table class="t"><tr><th>RP</th><th>Diagnostics</th></tr>
<tr><td>Très court (&lt; 70 ms), P dans ou juste après le QRS</td><td>TRIN typique (une TRAV est très improbable : l’influx doit traverser le ventricule avant de remonter)</td></tr>
<tr><td>Court mais &gt; 70 ms (RP &lt; PR)</td><td>TRAV orthodromique ; plus rarement TRIN atypique ou tachycardie atriale avec PR long</td></tr>
<tr><td>Long (RP &gt; PR)</td><td>Tachycardie atriale, TRIN atypique, tachycardie jonctionnelle réciproque permanente, tachycardie sinusale</td></tr></table>
<div class="lab">Limite</div><p>Critère d’orientation, non de certitude : un PR allongé par un freinateur modifie le rapport. L’EEP tranche.</p></template>

<template data-pop="i47-ecg-preexc" data-title="Pré-excitation ventriculaire">
<div class="lab">Aspect</div><p>PR &lt; 120 ms ; onde delta (empâtement initial du QRS) ; QRS &gt; 110–120 ms ; ST et T de direction opposée à l’onde delta.</p>
<div class="lab">Localisation simplifiée</div><p>Delta positive en V1 (onde R dominante) : voie gauche. Delta négative ou isoélectrique en V1 : voie droite ou septale. Delta négative en DI et aVL : voie latérale gauche. Delta négative en DII, DIII, aVF : voie postérieure (inférieure). Des algorithmes plus détaillés existent (Arruda, Milstein).</p>
<div class="lab">Pièges</div><p>Onde delta négative en inférieur simulant une onde Q de nécrose (pseudo-infarctus) ; pré-excitation discrète d’une voie latérale gauche, facile à méconnaître ; pré-excitation intermittente.</p>
<div class="lab">Voie cachée</div><p>Conduction uniquement rétrograde : ECG de base normal, mais TRAV orthodromique possible ; pas de risque de FA pré-excitée.</p></template>

<template data-pop="i47-ecg-ta" data-title="Tachycardie atriale focale : ECG">
<div class="lab">Aspect</div><p>Onde P de morphologie non sinusale, précédant chaque QRS, fréquence atriale de 100 à 250/min, avec retour à la ligne de base entre les P (différence avec le flutter).</p>
<div class="lab">Localisation</div><p>P positive en V1 et négative ou isoélectrique en DI et aVL : oreillette gauche (souvent veines pulmonaires). P négative en V1 : oreillette droite. P négative en inférieur : origine basse (ostium du sinus coronaire). P positive en inférieur : origine haute (crista terminalis haute, veines pulmonaires supérieures).</p>
<div class="lab">Indices de mécanisme</div><p>« Échauffement » au démarrage : automatisme. Bloc auriculoventriculaire sans arrêt de la tachycardie : le nœud n’est pas indispensable.</p>
<div class="lab">Forme particulière</div><p>Tachycardie atriale avec bloc 2:1 chez un patient sous digoxine : intoxication digitalique jusqu’à preuve du contraire.</p></template>

<template data-pop="i47-ecg-tvidio" data-title="Morphologies des TV idiopathiques">
<div class="lab">Chambre de chasse droite</div><p>Aspect de retard gauche (QRS négatif en V1), axe inférieur (QRS positifs en DII, DIII, aVF), transition précordiale en V3 ou plus tard (au-delà de V3 : chambre de chasse droite ; en V3 : origine droite ou gauche possible ; avant V3 : chambre de chasse gauche). Déclenchée par l’effort ou le stress ; sensible à l’adénosine et aux bêtabloquants.</p>
<div class="lab">Chambre de chasse gauche, cuspides aortiques</div><p>Axe inférieur mais transition précoce (en V1–V2 ou V2–V3) ; parfois onde R en V1.</p>
<div class="lab">TV fasciculaire (postérieure gauche)</div><p>Aspect de retard droit, axe gauche (supérieur), QRS relativement fin (120–140 ms), homme jeune ; sensible au vérapamil.</p>
<div class="lab">Diagnostic différentiel</div><p>Cardiomyopathie arythmogène (aspect de retard gauche, souvent axe supérieur, T négatives en V1–V3 en rythme sinusal) : une IRM est indiquée avant de conclure à une forme idiopathique.</p></template>

<template data-pop="i47-ecg-qt" data-title="Mesure et correction du QT">
<div class="lab">Où</div><p>DII ou V5, dans la dérivation où l’onde T est la plus nette ; moyenne de trois à cinq cycles en rythme régulier.</p>
<div class="lab">Fin de l’onde T</div><p>Méthode de la tangente : intersection de la tangente à la pente descendante de T avec la ligne de base. Exclure l’onde U séparée ; l’inclure si elle fusionne avec T.</p>
<div class="lab">Correction</div><p>Bazett : QTc = QT/√RR (RR en secondes) ; surcorrige au-delà de 90/min. Fridericia : QT/∛RR, préférable en tachycardie. Exemple : QT 360 ms, fréquence 100/min (RR 0,6 s) : Bazett 465 ms, Fridericia 427 ms.</p>
<div class="lab">QRS large</div><p>L’allongement du QRS gonfle le QT : utiliser l’intervalle JT (fin du QRS – fin de T) ou une formule corrigeant la largeur du QRS.</p>
<div class="lab">Seuils</div><p>Normal &lt; 450 ms (homme), &lt; 460 ms (femme) ; ≥ 480 ms : QT long congénital probable ; &gt; 500 ms : risque élevé ; arrêt d’un médicament si QTc &gt; 500 ms ou hausse &gt; 60 ms.</p></template>

<template data-pop="i47-ecg-brug" data-title="Aspects électrocardiographiques de Brugada">
<div class="lab">Type 1 (diagnostique)</div><p>Sus-décalage du point J et du ST ≥ 2 mm en dôme (convexe vers le haut), descendant lentement vers une onde T négative, dans au moins une précordiale droite (V1 ou V2), en 4e, 3e ou 2e espace intercostal.</p>
<div class="lab">Type 2</div><p>Sus-décalage « en selle » (concave), ST ≥ 0,5 mm, onde T positive ou biphasique. Non diagnostique : il justifie, selon le contexte, un test aux bloqueurs sodiques.</p>
<div class="lab">Variabilité</div><p>L’aspect fluctue d’un jour à l’autre ; il est démasqué par la fièvre, un repas copieux, la vagotonie, les bloqueurs sodiques, et en plaçant les électrodes plus haut.</p>
<div class="lab">Phénocopies</div><p>Hyperkaliémie, compression médiastinale, ischémie du ventricule droit, péricardite, intoxication par bloqueur sodique : l’aspect disparaît avec la cause et ne constitue pas un syndrome de Brugada.</p></template>

<template data-pop="i47-mnemo-large" data-title="« TV d’abord, puis A, P, M »">
<p><b>TV</b> — tachycardie ventriculaire : environ 80 % des tachycardies à QRS larges, plus de 90 % après un infarctus.<br><b>A</b> — <b>A</b>berration : TSV avec bloc de branche préexistant ou fonctionnel.<br><b>P</b> — <b>P</b>ré-excitation : TRAV antidromique, TSV ou FA conduites par une voie accessoire.<br><b>M</b> — <b>M</b>étabolique, <b>M</b>édicament, <b>M</b>achine : hyperkaliémie, bloqueurs sodiques (classe Ic, tricycliques), rythme de stimulateur.</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique, non critère officiel. L’ordre rappelle la conduite : traiter comme une TV tant que les trois autres hypothèses ne sont pas démontrées.</p></template>

<template data-pop="i47-algo-brugada" data-title="Algorithme de Brugada (1991)">
<div class="lab">Étape 1</div><p>Absence de complexe RS (une onde R suivie d’une onde S) dans toutes les précordiales : TV.</p>
<div class="lab">Étape 2</div><p>Intervalle entre le début de l’onde R et le nadir de l’onde S &gt; 100 ms dans au moins une précordiale : TV.</p>
<div class="lab">Étape 3</div><p>Dissociation auriculoventriculaire : TV.</p>
<div class="lab">Étape 4 : morphologie</div><p><b>Aspect de retard droit</b> (QRS positif en V1) : en V1, R monophasique, qR ou Rs, ou « oreille de lapin » dont le premier sommet est le plus haut ; en V6, rapport R/S &lt; 1, QS ou qR. <b>Aspect de retard gauche</b> (QRS négatif en V1) : en V1–V2, onde R &gt; 30 ms, début du QRS au nadir de S &gt; 60 ms, ou encoche sur la pente descendante de S ; en V6, qR ou QS. Présents en V1–V2 <b>et</b> en V6 : TV.</p>
<div class="lab">Performance</div><p>Sensibilité 98,7 % et spécificité 96,5 % dans la série originale ; nettement moins dans les validations ultérieures (précision d’environ 80 à 85 %). Non applicable aux TSV pré-excitées.</p>
<div class="lab">Piège</div><p>L’étape 4 exige la mémorisation de nombreuses morphologies, source d’erreur en urgence.</p></template>

<template data-pop="i47-algo-vereckei" data-title="Algorithme de Vereckei en aVR (2008)">
<div class="lab">Principe</div><p>Dans une TSV avec aberration, l’activation initiale emprunte le système de conduction : elle est rapide et s’éloigne de aVR (début négatif). Dans une TV, elle naît dans le myocarde, lentement, et peut se diriger vers aVR (onde R initiale).</p>
<div class="lab">Quatre étapes en aVR</div><p>1. Onde R initiale : TV. 2. Onde r ou q initiale de plus de 40 ms : TV. 3. Encoche sur la branche descendante d’un QRS à début négatif et à prédominance négative : TV. 4. Rapport vi/vt ≤ 1 : TV. Sinon : TSV.</p>
<div class="lab">Rapport vi/vt</div><p>vi : amplitude parcourue par le QRS pendant ses 40 premières millisecondes ; vt : amplitude parcourue pendant ses 40 dernières. Une activation initiale plus lente que la terminale (vi ≤ vt) signe une TV.</p>
<div class="lab">Performance</div><p>Précision globale d’environ 90 % dans la série originale, comparable à l’algorithme de Brugada, avec une seule dérivation.</p></template>

<template data-pop="i47-algo-bale" data-title="Algorithme de Bâle (2022)">
<div class="lab">Origine</div><p>Développé à l’Hôpital universitaire de Bâle (Moccetti et coll., <i>JACC Clinical Electrophysiology</i> 2022), il associe la clinique à deux mesures électrocardiographiques simples.</p>
<div class="lab">Trois critères</div><p>1. Caractéristique clinique à haut risque : antécédent d’infarctus, cardiomyopathie, ou DAI implanté. 2. En DII, délai entre le début du QRS et son premier pic (positif ou négatif) &gt; 40 ms. 3. En aVR, même délai &gt; 40 ms.</p>
<div class="lab">Règle</div><p>Au moins deux critères sur trois : TV.</p>
<div class="lab">Performance</div><p>Selon le résumé de Moccetti et coll. (2022) : sensibilité 93 %, spécificité 90 % et précision 93 % dans la cohorte de validation ; précision comparable à l’algorithme de Brugada, mais diagnostic nettement plus rapide (médiane de 36 secondes contre 105 secondes).</p>
<div class="lab">Limite</div><p>Validé dans des cohortes hospitalières ; ne dispense pas de la règle de prudence.</p></template>
