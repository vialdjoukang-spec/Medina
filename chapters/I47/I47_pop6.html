
<!-- ===== FENÊTRES I47 : monographies ===== -->
<template data-pop="i47-d-ic" data-title="Flécaïnide et propafénone dans les tachycardies">
<div class="lab">Mécanisme</div><p>Blocage du canal sodique rapide à dissociation lente : ralentissement de la conduction dans les oreillettes, les voies accessoires et les ventricules, plus marqué à fréquence rapide. La flécaïnide réduit aussi la libération anarchique de calcium dans la TVPC, par blocage du récepteur de la ryanodine ou par baisse du courant sodique, mécanisme encore discuté ; la propafénone a une activité β-bloquante.</p>
<div class="lab">Place</div><p>TRAV et pré-excitation sur cœur sain, en attente d’ablation (IIb) ; tachycardie atriale focale au long cours sans cardiopathie ischémique ou structurelle (IIa) ; TV idiopathique ; TVPC en association au bêtabloquant (IIa, flécaïnide). Elles ne figurent plus parmi les traitements de la TRIN dans l’ESC 2019.</p>
<div class="lab">Preuves</div><p>Essai CAST (1989) : surmortalité sous flécaïnide et encaïnide après infarctus ; d’où l’interdiction sur cardiopathie ischémique ou structurelle.</p>
<div class="lab">Posologie</div><p>Flécaïnide 50–150 mg × 2/jour ; propafénone 150–300 mg × 3/jour.</p>
<div class="lab">Effets indésirables</div><p>Élargissement du QRS, TV proarythmique, conversion d’une arythmie atriale en flutter 1:1 ; démasquage d’un Brugada ; vertiges, troubles visuels.</p>
<div class="lab">Contre-indications</div><p>Cardiopathie ischémique, FEVG réduite, hypertrophie importante, syndrome de Brugada, troubles de conduction sans stimulateur.</p>
<div class="lab">Surveillance</div><p>ECG et épreuve d’effort ; QRS élargi de plus de 25 % : réduire. Inhibiteurs du CYP2D6 : prudence.</p>
<div class="lab">Pourquoi l’effet dépend de la fréquence</div><p>La flécaïnide et la propafénone se fixent sur le canal sodique et s’en détachent lentement. À fréquence rapide, l’intervalle entre deux battements ne suffit plus à les libérer : le blocage s’accumule. C’est leur intérêt contre une tachycardie, mais aussi leur risque : le QRS s’élargit à l’effort, et un flutter ralenti peut passer en 1:1 avec des QRS larges. D’où l’association à un freinateur du nœud et l’épreuve d’effort de contrôle.</p>
<div class="lab">Pourquoi la cardiopathie les interdit</div><p>Dans l’essai CAST, après infarctus, la flécaïnide et l’encaïnide ont augmenté les décès arythmiques (43 contre 16) et les décès par choc après récidive d’infarctus. Les auteurs jugeaient le mécanisme inconnu ; l’hypothèse dominante est qu’un ralentissement de conduction dans une cicatrice ou une zone ischémique favorise la réentrée.</p>
<div class="lab">Source complémentaire</div><p>Echt et al., Mortality and morbidity in patients receiving encainide, flecainide, or placebo, New England Journal of Medicine 1991;324:781-8 ; Hondeghem et al., Annual Review of Pharmacology and Toxicology 1984;24:387-423 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, tableau 8 et figure 12.</p>
</template>

<template data-pop="i47-d-bb" data-title="Bêtabloquants dans les tachycardies">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : ralentissement du nœud sinusal et du nœud auriculoventriculaire, baisse de l’AMPc et de la charge calcique, suppression des post-dépolarisations tardives d’origine adrénergique.</p>
<div class="lab">Place</div><p>TSV (IIa aigu et au long cours) ; tachycardie atriale ; TV de la chambre de chasse ; traitement de fond de toute TV sur cardiopathie (seuls antiarythmiques qui réduisent la mortalité) ; orage rythmique.</p>
<div class="lab">Molécules</div><p>Métoprolol et esmolol intraveineux ; bisoprolol, métoprolol succinate au long cours.</p>
<div class="lab">Contre-indications</div><p>Pré-excitation manifeste en traitement isolé ; administration intraveineuse en insuffisance cardiaque décompensée ; asthme sévère ; bloc de haut degré.</p>
<div class="lab">Surveillance</div><p>Fréquence, pression artérielle, fatigue, tolérance à l’effort.</p>
<div class="lab">Pourquoi ils réduisent la mortalité</div><p>La stimulation adrénergique accroît la charge calcique, aggrave l’ischémie et favorise les post-dépolarisations : elle déclenche les arythmies sur cicatrice. Le bêtabloquant atténue ces effets ; en ralentissant la fréquence, il allonge aussi la diastole, pendant laquelle les coronaires se remplissent. Il fait partie du traitement de l’insuffisance cardiaque à fraction réduite, qui réduit la mortalité (ESC 2022, classe I). Son administration intraveineuse est contre-indiquée dans l’insuffisance cardiaque décompensée : réduire brutalement le soutien adrénergique peut aggraver le débit. Cette règle du traitement aigu n’impose pas l’arrêt automatique d’un traitement oral déjà prescrit ; celui-ci se réévalue selon l’hémodynamique (<a data-reference-source="1" href="https://www.nice.org.uk/guidance/cg187/chapter/Recommendations" target="_blank" rel="noopener noreferrer">CG187 — Acute heart failure: diagnosis and management (NICE)</a>, recommandation 1.5.1).</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, sections 6.1.3 et 6.2.1, tableau 8 ; Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., Elsevier 2021.</p>
</template>

<template data-pop="i47-d-bbns" data-title="Propranolol et nadolol dans les canalopathies">
<div class="lab">Pourquoi non sélectifs</div><p>Dans le QT long et la TVPC, le propranolol et le nadolol protègent mieux que le métoprolol dans les séries publiées ; le propranolol bloque aussi le courant sodique tardif in vitro, mais l’ESC 2022 juge incertain le rôle des bêtabloquants dans le type 3. L’ESC 2022 les préfère.</p>
<div class="lab">Place</div><p>QT long avec QTc allongé (I) ; porteur génotypé à QTc normal (IIa) ; TVPC (I) ; orage rythmique.</p>
<div class="lab">Posologie</div><p>Propranolol 2–4 mg/kg/jour en deux à trois prises (ou forme retard) ; nadolol 1–1,5 mg/kg/jour en une prise (importation, non répertorié dans PharmaWiki).</p>
<div class="lab">Règles</div><p>Jamais d’arrêt brutal ; observance vérifiée (fréquence au repos et à l’effort) ; bronchospasme, fatigue, hypoglycémie chez l’enfant.</p>
<div class="lab">Contre-indication relative</div><p>Asthme ; dans ce cas, discuter un β1-sélectif, la dénervation sympathique ou le DAI selon le risque.</p>
<div class="lab">Niveau de preuve</div><p>La préférence pour le propranolol et le nadolol repose sur des études observationnelles, non sur des essais randomisés ; l’ESC 2022 les recommande donc « idéalement ». Le bénéfice dépend du génotype : sous bêtabloquant, 81 % des patients de type 1 restaient sans récidive, contre 59 % dans le type 2 et 50 % dans le type 3. Le type 1, dont les événements sont adrénergiques, en tire le plus grand profit.</p>
<div class="lab">Pourquoi une prise par jour pour le nadolol</div><p>Sa demi-vie de 20 à 24 heures maintient un blocage stable sur le nycthémère ; le propranolol se prend en deux à trois fois ou sous forme retard.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 7.2.2 et tableau 8 ; Schwartz et al., Circulation 2001;103:89-95.</p>
</template>

<template data-pop="i47-d-amio" data-title="Amiodarone dans les arythmies ventriculaires">
<div class="lab">Mécanisme</div><p>Effets des quatre classes : blocage potassique (allongement de la repolarisation et de la période réfractaire), sodique, calcique et antiadrénergique. Demi-vie de plusieurs semaines ; forte teneur en iode.</p>
<div class="lab">Place</div><p>TV monomorphe bien tolérée (IIb) quand la cardioversion n’est pas possible ou échoue ; orage rythmique sur cardiopathie structurelle, sauf contre-indication ; réduction des chocs chez le porteur de DAI ; arrêt sur FV ou TV sans pouls réfractaire aux chocs (300 mg après le 3e choc, puis 150 mg après le 5e, ERC 2025). Dans SCD-HeFT, elle ne réduisait pas la mortalité : elle ne remplace pas le DAI.</p>
<div class="lab">Posologie</div><p>Intraveineuse : 300 mg en 10–20 minutes (ERC 2025) ou en 20–60 minutes (ESC), puis 900 mg sur 24 heures par une voie centrale ou une grosse veine. Orale : charge d’environ 10 g en 2 à 4 semaines, puis 200 mg/jour.</p>
<div class="lab">Effets indésirables</div><p>Hypotension (voie intraveineuse) ; bradycardie ; dysthyroïdie ; pneumopathie ; hépatite ; photosensibilité ; dépôts cornéens ; neuropathie ; allongement du QT, torsades rares.</p>
<div class="lab">Contre-indications</div><p>Torsades de pointes, QT long ; dysthyroïdie non contrôlée. Grossesse : à éviter ; exception spécialisée pour une arythmie réfractaire ou menaçant la vie, non contrôlable autrement (ESC 2025).</p>
<div class="lab">Surveillance</div><p>TSH et tests hépatiques tous les 6 mois ; imagerie et fonction respiratoire de référence ; interactions (digoxine, antivitamines K, statines).</p>
<div class="lab">Pourquoi tant d’effets extracardiaques</div><p>L’amiodarone s’accumule dans les tissus, d’où une demi-vie de plusieurs semaines et des effets qui persistent après l’arrêt. Elle est très riche en iode : un comprimé de 100 mg en apporte 250 fois le besoin quotidien. Cette charge d’iode et une toxicité directe sur la glande expliquent l’hypothyroïdie, plus fréquente dans les régions riches en iode, et la thyrotoxicose, plus fréquente dans les régions carencées. D’où le dosage de la TSH avant le traitement puis tous les six mois.</p>
<div class="lab">Pourquoi peu de torsades</div><p>Elle allonge fortement le QT, mais les torsades restent rares : environ 0,7 % dans une revue de 2 878 patients. L’hypothèse, non démontrée, est qu’elle allonge la repolarisation de façon homogène dans toute l’épaisseur du myocarde et bloque aussi le courant sodique tardif, ce qui prive la torsade de son substrat. Le risque réapparaît avec une hypokaliémie, une bradycardie ou un autre médicament allongeant le QT.</p>
<div class="lab">Source complémentaire</div><p>Basaria et al., Amiodarone and the thyroid, American Journal of Medicine 2005;118:706-14 ; Hohnloser et al., Amiodarone-associated proarrhythmic effects, Annals of Internal Medicine 1994;121:529-35 ; Drew et al., Circulation 2010;121:1047-60 ; Epstein et al., American Journal of Medicine 2016;129:468-75.</p>
</template>

<template data-pop="i47-d-sotalol" data-title="Sotalol dans les tachycardies">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif avec effet de classe III (blocage de IKr) dominant aux doses élevées.</p>
<div class="lab">Place</div><p>Réduction des chocs chez certains porteurs de DAI ; TV sur cardiopathie, en alternative à l’amiodarone, avec prudence. Retiré des indications dans la TRIN et la TRAV (ESC 2019) ; absent de l’ESC 2019 dans les tachycardies à QRS larges de mécanisme inconnu ; l’ESC 2022 le laisse envisageable (classe IIb) dans une TV monomorphe bien tolérée sans cardiopathie structurelle significative.</p>
<div class="lab">Posologie</div><p>80–160 mg × 2/jour, intervalle adapté à la clairance de la créatinine.</p>
<div class="lab">Risques</div><p>Torsades de pointes dose-dépendantes, favorisées par l’insuffisance rénale, l’hypokaliémie, la bradycardie et le sexe féminin.</p>
<div class="lab">Surveillance</div><p>Initiation sous ECG ; QTc &gt; 500 ms : arrêt ou réduction ; créatinine, potassium, magnésium.</p>
<div class="lab">Pourquoi le rein et la fréquence lente</div><p>Le sotalol est éliminé par le rein : une clairance basse le fait s’accumuler, d’où l’intervalle adapté et la contre-indication sous 30 mL/min. Son blocage de IKr allonge davantage le potentiel d’action quand la fréquence est lente, d’où le danger des bradycardies et des pauses. L’effet de classe III exige des doses plus élevées que l’effet bêtabloquant. Les torsades touchent plus de 2 % des patients, ce qui impose l’initiation sous surveillance ECG.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, tableau 8 ; Yang et al., Circulation 1996;93:407-11 ; Drew et al., Circulation 2010;121:1047-60.</p>
</template>

<template data-pop="i47-d-cci" data-title="Vérapamil et diltiazem dans les tachycardies">
<div class="lab">Mécanisme</div><p>Blocage des canaux calciques de type L du nœud auriculoventriculaire : conduction ralentie, période réfractaire nodale allongée ; suppression des post-dépolarisations tardives dans certaines TV idiopathiques.</p>
<div class="lab">Place</div><p>TSV : traitement aigu (IIa) et de fond (IIa) sans pré-excitation ; tachycardie atriale ; TV fasciculaire (vérapamil) et certaines TV de la chambre de chasse.</p>
<div class="lab">Posologie</div><p>Vérapamil intraveineux 0,075–0,15 mg/kg en 2 minutes ; diltiazem 0,25 mg/kg en 2 minutes ; formes retard orales 120–480 mg/jour (vérapamil), 120–360 mg/jour (diltiazem).</p>
<div class="lab">Contre-indications</div><p>Tachycardie à QRS larges non diagnostiquée ; pré-excitation ; FEVG réduite ; hypotension ; bêtabloquant intraveineux récent.</p>
<div class="lab">Interactions</div><p>Inhibiteurs du CYP3A4 ; digoxine (concentration augmentée) ; dabigatran ; simvastatine.</p>
<div class="lab">Pourquoi ces contre-indications</div><p>Le vérapamil et le diltiazem bloquent les canaux calciques du nœud, mais aussi ceux du myocarde et des artérioles : la contractilité baisse et les artères se dilatent. Dans une TV ou une insuffisance cardiaque à fraction réduite, le débit s’effondre. Dans une FA pré-excitée, ils ne ralentissent pas la voie accessoire, et la conduction s’y reporte. L’ESC 2022 classe le vérapamil intraveineux en classe III dans les tachycardies à QRS larges de mécanisme inconnu.</p>
<div class="lab">Pourquoi ils arrêtent la TV fasciculaire</div><p>Cette TV naît dans le réseau de Purkinje gauche, par une réentrée qui emprunte un tissu sensible au vérapamil ; le médicament l’interrompt, d’où sa recommandation dans le traitement aigu d’une TV fasciculaire bien tolérée (classe I).</p>
<div class="lab">Source complémentaire</div><p>Brugada et al., 2019 ESC Guidelines for the management of patients with supraventricular tachycardia, European Heart Journal 2020;41:655-720, sections 10.1.1 et 11.5.2 ; Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, tableau de recommandations 9.</p>
</template>

<template data-pop="i47-d-mg" data-title="Sulfate de magnésium">
<div class="lab">Mécanisme</div><p>D’après les données expérimentales, il réduirait l’entrée de calcium par les canaux de type L et supprimerait les post-dépolarisations précoces ; ce mécanisme n’est pas établi chez l’homme. Il raccourcit peu le QT.</p>
<div class="lab">Place</div><p>Traitement de première ligne des torsades de pointes, quelle que soit la magnésémie ; correction d’une hypomagnésémie chez tout patient arythmique.</p>
<div class="lab">Posologie</div><p>2 g par voie intraveineuse en 10 minutes (en bolus en cas d’arrêt), renouvelable une fois ; puis perfusion selon la magnésémie.</p>
<div class="lab">Effets indésirables</div><p>Flush, hypotension, bradycardie ; en surdosage, abolition des réflexes ostéotendineux puis dépression respiratoire ; prudence en insuffisance rénale.</p>
<div class="lab">Pourquoi il agit sans carence</div><p>Le magnésium arrête les torsades même quand la magnésémie est normale : son effet ne consiste donc pas à corriger un déficit. L’ESC 2022 le recommande avec la supplémentation potassique (classe I).</p>
<div class="lab">Pourquoi surveiller les réflexes et le rein</div><p>Le magnésium s’élimine presque entièrement par le rein, 90 % de la dose en 24 heures : il s’accumule en insuffisance rénale. La toxicité suit la concentration. Les réflexes rotuliens disparaissent vers 3,5 à 5 mmol/L, avant la paralysie respiratoire, vers 5 à 6,5 mmol/L, et les troubles de conduction cardiaque, au-delà de 7,5 mmol/L. L’examen des réflexes dépiste donc simplement un surdosage.</p>
<div class="lab">Source complémentaire</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias, European Heart Journal 2022;43:3997-4126, section 6.1.1 ; Lu et al., Magnesium sulfate in eclampsia and pre-eclampsia: pharmacokinetic principles, Clinical Pharmacokinetics 2000;38:305-14.</p>
</template>

<!-- ===== FENÊTRES PARETO I47 ===== -->
<template data-pop="pareto-i47-def" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="i47-1,i47-2"></p>
<ul><li>Paroxystique = début et fin brutaux (réentrée, foyer) ; sinusale = progressive.</li><li>TSV : circuit au-dessus de la bifurcation du His (atriale, jonctionnelle, par voie accessoire) ; FA : chapitre I48.</li><li>TV : sous le His ; soutenue ≥ 30 s ou nécessitant une intervention pour être interrompue ; TVNS ≥ 3 complexes, &lt; 30 s ; monomorphe = morphologie stable (réentrée ou foyer) ; polymorphe = instabilité (ischémie, canalopathie) ; torsades = polymorphe sur QT long ; bidirectionnelle = digoxine ou TVPC.</li><li>Pré-excitation = aspect ECG ; syndrome de Wolff-Parkinson-White = pré-excitation + arythmies.</li><li>TSV : prévalence 2,25/1 000 ; TRIN la plus fréquente chez l’adulte (femmes 2:1) ; TRAV chez l’enfant ; pré-excitation 0,1–0,3 %.</li><li>Mort subite ≈ 50–100/100 000/an : TV/FV ischémiques après 40 ans ; cardiomyopathies et canalopathies avant 35 ans ; QT long ≈ 1/2 000 ; TVPC ≈ 1/10 000.</li></ul></template>

<template data-pop="pareto-i47-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="i47-3"></p>
<ul><li>Trois mécanismes : réentrée (brutal, déclenché par extrasystole), automatisme (échauffement), activité déclenchée (précoce : QT long, pauses ; tardive : calcium, catécholamines, digoxine).</li><li>TRIN typique : descente voie lente, remontée voie rapide ; P cachée ou pseudo-r′ V1.</li><li>TRAV orthodromique (90 %) : descente nœud, remontée voie accessoire, P dans le ST ; antidromique : QRS large pré-excité.</li><li>Nœud indispensable à la TRIN, à la TRAV orthodromique et à la forme antidromique classique ; son blocage peut les arrêter. Exception : forme antidromique utilisant deux voies accessoires. FA pré-excitée : bloquer le nœud est dangereux.</li><li>Tachycardie atriale : nœud non indispensable (bloc sans arrêt).</li><li>TV monomorphe sur cicatrice : réentrée dans ses isthmes, dont le risque persiste. TV idiopathiques : chambre de chasse (AMPc, effort), fasciculaire (vérapamil).</li><li>Torsades acquises dépendantes des pauses et récidivant malgré correction → stimulation ou isoprénaline ; pas d’isoprénaline dans le QT long congénital ni en cas d’ischémie.</li></ul></template>

<template data-pop="pareto-i47-etio" data-title="Pareto — Étiologies et facteurs de risque">
<p class="ratio" data-cover="i47-4"></p>
<ul><li>Première question : cœur structurellement sain ou non.</li><li>TSV : cœur souvent sain ; Ebstein et <i>PRKAG2</i> avec les voies accessoires ; digoxine (tachycardie atriale avec bloc).</li><li>TV monomorphe : cicatrice d’infarctus d’abord, cardiomyopathies, Fallot opéré ; idiopathiques sur cœur sain.</li><li>TV polymorphe/FV : ischémie aiguë d’abord, canalopathies.</li><li>Torsades acquises : médicaments (CredibleMeds), hypokaliémie, hypomagnésémie, bradycardie, sexe féminin, rein, foie.</li><li>TV monomorphe ≠ ischémie aiguë : la revascularisation ne supprime pas le circuit.</li></ul></template>

<template data-pop="pareto-i47-clin" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i47-5,i47-6"></p>
<ul><li>Palpitations régulières, brutales, battements cervicaux, polyurie, arrêt par vagal → TSV par réentrée nodale.</li><li>Signaux d’alarme : syncope d’effort ou couchée, sans prodrome, cardiopathie, mort subite familiale, ECG anormal.</li><li>Canalopathie : syncope sur déclencheur adrénergique (natation, réveil) ou au repos (Brugada, type 3).</li><li>Crises de « panique » récidivantes : penser à la TSV ; documenter.</li><li>Examen en crise : ondes a en canon régulières (TRIN) ou irrégulières + B1 variable (dissociation = TV).</li><li>Bonne tolérance ≠ TSV. L’ECG décide, pas la pression artérielle.</li></ul></template>

<template data-pop="pareto-i47-ecg" data-title="Pareto — Électrocardiogramme à complexes fins">
<p class="ratio" data-cover="i47-7"></p>
<ul><li>ECG 12 dérivations en crise, avant et pendant chaque manœuvre.</li><li>Six étapes : largeur, régularité, P visible, rapport P/QRS, RP, morphologie de P.</li><li>RP &lt; 70 ms, pseudo-r′ V1 : TRIN. P dans le ST, RP &gt; 70 ms : TRAV. RP &gt; PR : tachycardie atriale, TRIN atypique, Coumel.</li><li>Plus de P que de QRS : tachycardie atriale ou flutter. Régulière à 150/min : flutter 2:1.</li><li>Pré-excitation : PR &lt; 120 ms, onde delta ; delta positive en V1 = voie gauche.</li><li>P positive en V1 = foyer atrial gauche ; négative en inférieur = foyer bas.</li></ul></template>

<template data-pop="pareto-i47-large" data-title="Pareto — Tachycardie à complexes larges">
<p class="ratio" data-cover="i47-8"></p>
<ul><li>QRS large = TV jusqu’à preuve du contraire (80 % ; &gt; 90 % après infarctus). Puis A (aberration), P (pré-excitation), M (métabolique, médicament, machine).</li><li>Signes de TV : dissociation, captures/fusions, concordance (négative surtout), axe nord-ouest, QRS &gt; 140 ms (retard droit) ou &gt; 160 ms (retard gauche).</li><li>Brugada : pas de RS → RS &gt; 100 ms → dissociation → morphologie V1/V6.</li><li>Vereckei (aVR) : R initiale ; r/q &gt; 40 ms ; encoche ; vi/vt ≤ 1.</li><li>Bâle (suisse) : clinique à risque + DII &gt; 40 ms + aVR &gt; 40 ms ; ≥ 2/3 = TV.</li><li>Ni la tolérance ni l’adénosine ne sont des tests diagnostiques. Hyperkaliémie et bloqueurs sodiques : calcium, bicarbonate.</li></ul></template>

<template data-pop="pareto-i47-urg" data-title="Pareto — Prise en charge aiguë">
<p class="ratio" data-cover="i47-9"></p>
<ul><li>Tachyarythmie responsable d’instabilité → cardioversion synchronisée immédiate ; TV polymorphe soutenue ou synchronisation impossible sans délai prolongé → choc non synchronisé ; sans pouls → RCP et défibrillation. Tachycardie sinusale compensatrice : traiter la cause.</li><li>QRS fins stables : Valsalva modifiée (REVERT : 43 % vs 17 %) → adénosine 6-12-18 mg bolus rapide + rinçage → vérapamil/diltiazem ou bêtabloquant → cardioversion.</li><li>Réponse à l’adénosine : arrêt compatible avec une réentrée nododépendante, mais également avec certaines tachycardies focales dépendantes de l’AMPc ; P ou F persistantes démasquées = activité atriale autonome.</li><li>QRS larges stables : traiter comme TV ; cardioversion en première ligne (I) ; procaïnamide (IIa) absent en Suisse ; amiodarone (IIb) ; jamais de vérapamil à l’aveugle.</li><li>QRS larges irréguliers variables : FA pré-excitée → pas d’adénosine, bêtabloquant, calcique, digoxine, amiodarone ; cardioversion.</li><li>Torsades : magnésium 2 g en 10 minutes, correction des électrolytes, arrêt des médicaments ; accélération de la fréquence si récidives dépendantes des pauses dans le QT long acquis ; pas d’amiodarone. Torsades soutenues : choc non synchronisé immédiat.</li><li>Orage sur cardiopathie structurelle : sédation légère à modérée (I), propranolol et amiodarone sauf contre-indication ; ablation de la TV monomorphe réfractaire. Canalopathie : traitement propre au syndrome.</li><li>Arrêt sur FV ou TV sans pouls : défibrillation ≥ 150 J ; adrénaline 1 mg après le 3e choc ; amiodarone 300 mg (3e choc) puis 150 mg (5e), ou lidocaïne 100 puis 50 mg (ERC 2025).</li><li>Énergies synchronisées (ERC 2025) : TV monomorphe avec pouls 120–150 J ; flutter et TSV 70–120 J ; FA, y compris pré-excitée : énergie maximale.</li></ul></template>

<template data-pop="pareto-i47-tsv" data-title="Pareto — Traitement de fond des tachycardies supraventriculaires">
<p class="ratio" data-cover="i47-10"></p>
<ul><li>Ablation = première intention de la plupart des TSV récidivantes (ESC 2019).</li><li>TRIN : voie lente (&gt; 95 %, bloc &lt; 1 %) ; sinon vérapamil/diltiazem/bêtabloquant (IIa) ; abstention si rares et courtes. Plus d’amiodarone, sotalol, classe Ic.</li><li>TRAV : ablation (I) ; freinateurs nodaux seulement sans pré-excitation au repos ; classe Ic sur cœur sain (IIb).</li><li>Pré-excitation asymptomatique : EEP + isoprénaline (I si profession à risque/athlète ; IIa sinon) ; haut risque (RR pré-excité ≤ 250 ms, période réfractaire ≤ 250 ms, voies multiples, inductible) → ablation (I).</li><li>Tachycardie atriale : ablation (I) ; bêtabloquant, calcique (IIa) ; ivabradine + bêtabloquant (IIb). Cardiomyopathie rythmique → ablation (I).</li><li>Jamais de freinateur nodal seul dans le Wolff-Parkinson-White.</li><li>Tachycardie multifocale : traiter la cause, puis vérapamil/diltiazem ou bêtabloquant (IIa). Tachycardie sinusale inappropriée : ivabradine ± bêtabloquant (IIa).</li></ul></template>

<template data-pop="pareto-i47-tv" data-title="Pareto — Tachycardies ventriculaires et défibrillateur">
<p class="ratio" data-cover="i47-11"></p>
<ul><li>Trois questions : cardiopathie ? cause réversible ? risque de récidive ?</li><li>Bilan : ECG sinusal, échocardiographie, ischémie, IRM.</li><li>TV sur cicatrice : DAI ; ablation (I si récidive sous amiodarone ; IIa en première intention ; VANISH).</li><li>TV idiopathique chambre de chasse : ablation (I) ; fasciculaire : vérapamil, ablation. Extrasystoles &gt; 10 % avec FEVG ↓ : ablation (I).</li><li>DAI secondaire (I) : FV ou TV mal tolérée sans cause réversible. Primaire : ischémique FEVG ≤ 35 % NYHA II–III (I), NYHA I ≤ 30 % (IIa) ; non ischémique ≤ 35 % (IIa). Après 3 mois de traitement et 6 semaines post-infarctus.</li><li>Essais : AVID, CIDS, CASH ; MADIT-II, SCD-HeFT (amiodarone = placebo) ; DANISH (non ischémique neutre).</li></ul></template>

<template data-pop="pareto-i47-canal" data-title="Pareto — Canalopathies">
<p class="ratio" data-cover="i47-12"></p>
<ul><li>QT long : type 1 <i>KCNQ1</i> (effort, natation), 2 <i>KCNH2</i> (bruit, émotion, post-partum), 3 <i>SCN5A</i> (sommeil). Diagnostic : QTc ≥ 480 ms, score de Schwartz &gt; 3, ou variant (I) ; ≥ 460 + syncope (IIa).</li><li>Traitement QT long : éviter CredibleMeds, électrolytes ; propranolol/nadolol (I) ; mexilétine type 3 ; DAI si arrêt (I), ou si syncope arythmique ou TV mal tolérée sous bêtabloquant (I) ; dénervation si DAI contre-indiqué ou refusé, ou chocs multiples (I) ; DAI ou dénervation si bêtabloquant non toléré (IIa).</li><li>Brugada : type 1 spontané (I) ; induit + critère clinique (IIa). Fièvre → paracétamol ; brugadadrugs.org ; DAI si arrêt (I), syncope arythmique (IIa) ; quinidine, ablation épicardique.</li><li>TVPC : effort/émotion, ECG normal, épreuve d’effort ; <i>RYR2</i> ; propranolol/nadolol (I) + flécaïnide (IIa), dénervation, DAI.</li><li>Mort subite du jeune : autopsie + génétique post mortem ; dépistage familial.</li></ul></template>

<template data-pop="pareto-i47-suivi" data-title="Pareto — Suivi, sport et conduite">
<p class="ratio" data-cover="i47-13"></p>
<ul><li>Après ablation réussie : guérison, ECG de contrôle.</li><li>Flécaïnide : surveiller le QRS ; sotalol : QTc.</li><li>Prévention : substrat, DAI, réanimation par les proches, DAE, CredibleMeds pour toute prescription à risque.</li><li>Arrêt d’un médicament si QTc &gt; 500 ms ou + 60 ms ; K⁺ ≥ 4,0.</li><li>Sport : activité encouragée ; compétition restreinte (QT long à QTc élevé, TVPC, après arrêt) ; ablation avant compétition dans la pré-excitation.</li><li>Conduite (SSC/SSML 2024) : TSV symptomatique apte après traitement, 4 semaines ; TV symptomatique : 4 semaines sur cœur sain (deux groupes), 3 mois sur cardiopathie (second groupe inapte) ; syncope inexpliquée : 3 mois (premier groupe) ; DAI primaire 1 semaine, secondaire ou choc 3 mois ; second groupe inapte avec DAI ; syncope inexpliquée au second groupe : 12 mois minimum sans diagnostic.</li></ul></template>

<template data-pop="pareto-i47-part" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="i47-14"></p>
<ul><li>Grossesse : vagal, adénosine (I), cardioversion possible ; pas d’antiarythmique au 1er trimestre si possible ; β1-sélectif (pas d’aténolol) ou vérapamil ; classe Ic si pré-excitation ; ablation sans rayons X ; bêtabloquant maintenu dans le QT long (post-partum à risque).</li><li>Sujet âgé : QRS large = TV ; torsades plus fréquentes (polymédication).</li><li>Rein : sotalol et flécaïnide à adapter ; hyperkaliémie. Foie : amiodarone, propafénone, lidocaïne.</li><li>Wolff-Parkinson-White symptomatique : ablation (I), pas de freinateur nodal, sport et conduite après ablation.</li></ul></template>

<template data-pop="pareto-i47-ecgex" data-title="Pareto — Fiche d’interprétation de l’électrocardiogramme">
<p class="ratio" data-cover="i47-e-2"></p>
<ul><li>PR 120–200 ms ; QRS &lt; 120 ms ; QTc &lt; 450 (homme) / &lt; 460 ms (femme) ; ≥ 480 répété : critère diagnostique du QT long (ESC 2022) ; &gt; 500 : risque élevé ; ≤ 360 : QT court à évoquer.</li><li>QT : méthode de la tangente, DII ou V5 ; Fridericia au-delà de 90/min ; JT si QRS large ; moyenne sur ≥ 10 cycles en FA.</li><li>Brugada type 1 : dôme ≥ 2 mm + T négative en V1–V2, électrodes en 2e–4e espace.</li><li>T négatives V1–V3 après 14 ans, onde epsilon : cardiomyopathie arythmogène.</li><li>Réponse à l’adénosine : arrêt (TRIN, TRAV), démasquage (atriale, flutter), aucun effet (TV, dose insuffisante).</li></ul></template>

<template data-pop="pareto-i47-bio" data-title="Pareto — Biologie et génétique">
<p class="ratio" data-cover="i47-e-4"></p>
<ul><li>K⁺ 3,5–5,0 (cible 4,5–5,0 dans les torsades) ; magnésium 0,70–1,00 ; calcium ionisé 1,15–1,30 mmol/L ; TSH ; créatinine ; digoxinémie ; toxiques.</li><li>Hyperkaliémie et tricycliques : élargissement diffus du QRS pouvant simuler une TV, mais aussi véritables arythmies ventriculaires.</li><li>Troponine modérément élevée après tachycardie rapide ≠ infarctus.</li><li>Génétique (I) chez le cas index avec diagnostic clinique : rendement QT long 75–80 %, TVPC 60 %, Brugada 20 % ; variant incertain non utilisable pour la famille.</li></ul></template>

<template data-pop="pareto-i47-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i47-e-1,i47-e-2,i47-e-3,i47-e-4,i47-e-5"></p>
<ul><li>ECG de crise = examen clé ; EEP = gold standard du mécanisme ; IRM = référence tissulaire.</li><li>Enregistreur choisi selon la fréquence des crises : Holter (quotidiennes), patch (hebdomadaires), moniteur implantable (rares, syncope).</li><li>Épreuve d’effort : TVPC (diagnostic clé), QTc récupération 4e minute ≥ 480 ms, disparition brutale de la pré-excitation (faible risque).</li><li>Test d’orthostatisme utile ; test à l’épinéphrine abandonné (III).</li><li>Test à l’ajmaline (importée) ou à la flécaïnide pour Brugada : un type 1 induit exige un critère clinique.</li><li>EEP : AH 50–120 ms, HV 35–55 ms ; isoprénaline indispensable pour stratifier une voie accessoire.</li></ul></template>

<template data-pop="pareto-i47-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i47-sa,i47-sh,i47-sp,i47-sb,i47-sg"></p>
<ul><li>Triangle de Koch : Todaro, tricuspide septale, sinus coronaire ; nœud compact à l’apex ; voie lente en bas (ablation sûre).</li><li>Voies accessoires le long des anneaux, sauf continuité mitro-aortique ; septales = risque de bloc ; Ebstein = voies droites multiples.</li><li>Nœud : connexine 45, conduction lente ; voie accessoire = myocarde ordinaire (pas de décrément) → onde delta.</li><li>Cicatrice : isthmes, connexine 43 latéralisée, conduction en zigzag.</li><li>Potentiel d’action : 0 INa (QRS), 2 ICaL, 3 IKr/IKs (QT), 4 IK1 ; nodal calcique + If.</li><li>Précoces (bradycardie, QT long) vs tardives (calcium, catécholamines, digoxine). Période vulnérable → choc synchronisé.</li><li>hERG = cible des médicaments allongeant le QT. Adénosine → récepteur de type 1 → courant K⁺ → bloc nodal ; antagonisée par la théophylline ; influence de la caféine réfutée (ESC 2019).</li><li>Autosomique dominant, pénétrance incomplète ; <i>RYR2</i> dominant, <i>CASQ2</i> récessif ; Jervell et Lange-Nielsen récessif avec surdité.</li></ul></template>

<template data-pop="pareto-i47-pstrat" data-title="Pareto — Stratégie médicamenteuse">
<p class="ratio" data-cover="i47-p-3"></p>
<ul><li>TRIN, TRAV, tachycardie atriale focale : ablation d’abord ; freinateurs nodaux (IIa). Classe Ic sur cœur sain : IIb dans la TRAV, IIa dans la tachycardie atriale focale au long cours ; pas de place habituelle dans la TRIN.</li><li>Pré-excitation : pas de freinateur nodal seul.</li><li>TV sur cicatrice : DAI, ablation, bêtabloquant, amiodarone ; jamais de classe Ic.</li><li>QT long et TVPC : propranolol ou nadolol ; mexilétine (type 3), flécaïnide (TVPC).</li><li>Doses : bisoprolol 2,5–10 mg ; vérapamil retard 120–480 mg ; flécaïnide 50–150 mg × 2 ; sotalol 80–160 mg × 2 ; amiodarone ≈ 10 g de charge puis 200 mg/jour.</li></ul></template>

<template data-pop="pareto-i47-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i47-p-1,i47-p-2,i47-p-3,i47-p-4,i47-p-5"></p>
<ul><li>Seuls les bêtabloquants réduisent la mortalité ; classe Ic : surmortalité arythmique après infarctus (CAST).</li><li>Non disponibles en Suisse : procaïnamide, ajmaline, quinidine, mexilétine (importation).</li><li>Aigu : adénosine 6-12-18 mg (3 mg si voie centrale, transplanté, dipyridamole) ; vérapamil 5–10 mg ; métoprolol 2,5–5 mg ; amiodarone 300 mg puis 900 mg/24 h (arrêt : 300 puis 150 mg) ; magnésium 2 g en 10 minutes ; isoprénaline 1–2 µg/min puis 2–10 µg/min.</li><li>Interactions : vérapamil + bêtabloquant intraveineux ; vérapamil sur QRS large ; classe Ic sans freinateur (flutter 1:1) ; deux médicaments allongeant le QT ; CYP2D6 et classe Ic ; amiodarone + digoxine/antivitamines K.</li><li>Surveillance : QRS (+ 25 % → réduire la classe Ic), QTc (&gt; 500 ms → arrêter le sotalol), TSH et foie (amiodarone).</li><li>À éviter : Wolff-Parkinson-White (freinateurs), Brugada (classe I, lithium, tricycliques, propofol), QT long (CredibleMeds).</li></ul></template>
