<section class="ilot" id="k25-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 63 ans prend de l’ibuprofène depuis trois mois pour une gonarthrose. Elle décrit une douleur épigastrique qui la réveille la nuit. Un homme de 45 ans, fumeur, arrive aux urgences pour une douleur abdominale brutale « en coup de poignard » et un ventre de bois. <b>Les deux souffrent probablement d’un ulcère ; la première question est de savoir s’il est compliqué.</b> La cause vient ensuite, car elle commande la guérison et la prévention de la récidive.</p><p>Le médecin doit savoir : définir l’ulcère et le distinguer de l’érosion ; reconnaître ses deux causes principales, Helicobacter pylori et les anti-inflammatoires ; reconnaître une complication (hémorragie, perforation, sténose) ; poser l’indication de l’endoscopie et des biopsies ; prescrire un traitement d’éradication adapté à la résistance ; prévenir l’ulcère chez le patient à risque qui prend des AINS ou des antithrombotiques.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="k25-ulcere-def">Ulcère ou érosion (la profondeur décide)</button> ; <button class="w" data-k="k25-deux-causes">deux causes dominantes (Helicobacter pylori et AINS)</button>.</div></section>
<section class="ilot" id="k25-1"><h2><span class="n">1</span>Définition et classification</h2><p>L’<b>ulcère gastroduodénal</b> est une perte de substance de la paroi de l’estomac ou du duodénum qui franchit la <b>musculaire muqueuse</b>. L’<b>érosion</b> reste limitée à la muqueuse ; elle cicatrise sans trace et saigne peu. La CIM-10-GM classe l’ulcère selon son siège (estomac K25, duodénum K26, siège non précisé K27), son caractère aigu ou chronique et la présence d’une hémorragie ou d’une perforation.</p><figure><img src="data:image/gif;base64,R0lGODdhWAJKAYQAAP////r6+vPz8+zs7Obm5vPixuLi4tjY2NnQwNDQ0MbGxum4qLi4uK2traGhoZmZmYaGhsl6anp6erRYSnFxcV5eXldXV01NTXo7LkVFRT4+PlsqLDExMSoqKiUlJSIiIiwAAAAAWAJKAUAI/wABCBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyBDihxJsqTJkyhTqlzJsqXLlzBjoqTwoeaHDhceCBBY4YOGgQxqOhBIoKYEgQ5qJgAQ9MNQAEU/HAXQ8ycAAzUfKBAqMEFWpjbDOgWQ4cOFrlyp+kS4dSwArx8egBWbtmBVgQoqcPBgk8PBu03pOhDAwWaHCkvV/mz6NOrUu1e/QgwsdijkuY2NAiBsGDHPtYyJaoaMNW7DsmffcgVcVyDlsE8vv7b5VCFqtG5ZuwVKd/Va1713E+zp93OH2WkvA0j6IXFoqKN/zxUss7r169iza9/Ovbv37+DDi/8fT768+fPo06tfz769+/fwUVYwMN5CgPj48+vfz79/QQgWVAABAR5Z4N+BCCao4IIMNujggxBGKOFEC1Ro4YUYZqjhhhxaiMF1GHQo4ogklmiiiB/iF+KJLLbo4osVpljeijBWOCFKNeaooYwp0ajjj0CayON6PgZp5JEcDuldkTW+x0EDFbxVAQWDFRdAB65pwMEDHmxmJZZvXdBBBgp4KdCVAARAQQe/JSAmmQchGaSSHTEp551I0kmenXj2CaSe2fH54o0n+fmnRoIaqqiOgC656KOHOmokoSZBaumlmMrZaKCZdtripi4lCqNDT0aZwJRVnomlmmxa5SabDRD/pqpAHdxX2GED0HpfXBpA8CqcBcXFgQYKSDDmAbKmCSYDWnJpprJdvVlmsmiy2qa0Bk2g7bbcduvtt+CGK+645JZr7rnopqvuuuGCGhMG7MYr77z0uqsSvPR+S2lJBfTr778AByzwwAQXbPDBCCes8MIMN+ywwfbe+/DEFFds8b8Rm4TBxQPvSxLHIIcs8sgkl5wxSRuXrPLKDJ8sUsolezwSyzTXbPPND7vsEcw491yzzhzxHDNLATiQwZhPMXC0BfQxNawDWDKngVwEfUCUq6kx8PSyzXbptAZQd2UBm8tuvVxNU4tNtkE+t+322yoDjZHQcNfNsdxz1yyzSHb3/+333xA3tAEGhBdueOEbMEQ34IwvjHdFi5O8d0iNV2755f1uMPjhiG+A+ed3nxT50JN7FMHpqKeu+uqst+7667DHLvvstNdu++2456777rz37vvvwKP+uEMYBC976R8Zr/zyzDfv/PPQRy/99K0Pv1Dx1EeAvOnZd+/99+CHL/74wFtvEPbdn1eqlFRSu+qa18Lqvq5hjjntl2nCj7X9B5Hv//8ADKAAB6g78w0EfenbHkcIyMAGOvCBEHyeARGYQAVqJII <section class="ilot" id="k25-2"><h2><span class="n">2</span>Épidémiologie</h2><p>La prévalence de l’ulcère sur la vie entière est de 5 à 10 % dans la population générale, avec une incidence de 0,1 à 0,3 % par an ; 10 à 20 % des patients présentent une complication (WSES 2020). L’hémorragie est la complication la plus fréquente ; la perforation est environ six fois plus rare mais plus grave, avec une mortalité moyenne à 30 jours de 23,5 % contre 8,6 % pour l’hémorragie dans la revue citée par la WSES.</p><p>L’épidémiologie change. La part des ulcères liés à Helicobacter pylori diminue et celle des AINS et de l’aspirine augmente ; dans une étude américaine de 2009 à 2018 citée par la SSI, seul un quart des ulcères duodénaux était encore associé à Helicobacter pylori. En Suisse, les données préliminaires citées par la SSI en 2026 montrent une résistance élevée de la bactérie à la clarithromycine (plus de 16 % chez les patients jamais traités).</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune série nationale suisse de l’incidence de l’ulcère n’a été retrouvée lors de la rédaction ; les données suisses disponibles portent sur la résistance de Helicobacter pylori.</div><div class="key"><b>À retenir.</b> Ulcère fréquent, complications dans 10 à 20 % des cas ; la perforation tue plus que l’hémorragie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a> ; <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></section>
<section class="ilot" id="k25-3"><h2><span class="n">3</span>Physiopathologie : agression et défense</h2><p>La muqueuse résiste à l’acide et à la pepsine grâce au mucus, aux bicarbonates, au renouvellement épithélial et à un flux sanguin abondant ; les <button class="w" data-k="k25-prostaglandines">prostaglandines (gardiennes de la barrière)</button> entretiennent ces défenses. L’ulcère apparaît quand l’agression l’emporte.</p><p><b>Helicobacter pylori</b> provoque toujours une gastrite chronique, de gravité variable. Selon la SSI, la gastrite à prédominance antrale, avec gastrine et sécrétion acide élevées, correspond au <button class="w" data-k="k25-phenotype-duodenal">phénotype « ulcère duodénal » (10 à 15 % des infectés)</button> ; la gastrite à prédominance fundique, avec sécrétion acide basse, expose à l’atrophie, à la métaplasie intestinale et au cancer gastrique (1 à 3 %). Plus de 80 % des infections restent asymptomatiques.</p><p>Les <b>AINS et l’aspirine</b> inhibent la cyclo-oxygénase et réduisent les prostaglandines muqueuses ; l’aspirine inhibe aussi l’agrégation plaquettaire, ce qui transforme une petite lésion en hémorragie. Les corticoïdes ne sont pas ulcérogènes par eux-mêmes ; ils augmentent le risque de complication surtout lorsqu’ils sont associés à un AINS (S2k 2023, énoncé 7.4).</p><figure><img src="data:image/gif;base64,R0lGODdhCAJbAYUAAP/////9///++/z+/P/6/f/2/Pz4+vvw+Pjm9v3V9+7U7vTG7vm76+e75fWy6vOr6PKt2/Ki4/Gg1eWt3+Wk3OWd2Nyj2s6j1/CW1u+O0OOS0tmV2tiUy9eNz+2EyeGEyNaF0NaDweN3v9R1vsqR0MqIzMmAyLqIybh8xcJ0yMNyt7NywKVxvdFms79ltbJlwLJjr6FjwJ9ir61Xr5ZWsqZKp5JIqYZXroNMq4BGqII+pHA9onE0nmspllUolkgWiSwAAAAACAJbAUAI/wABCBxIsKDBgwgTAhigsKHDhwQNIDDAEKLFixgzaoQ4oOPGjyAVVgxJsqTJkyhTqlzJsqXLlzBjypzZ0iPNmzhz6tzJs6dPgh5H/hxKtKjRo0iTKl3KtKnTpzGFQp1KtarVq1iLSg25NatXjl83VhwQoGNHAxQXEjDLFkAAAXDNAhAQYCEABQ0OBAhg4ICBAATQ9hX8d+/IugfHhl3MuLFjkmYJIECg98AJHDQw55BhA0cPHyxQ+PjxYweJFTZgoNjRYwcPGSx40IAh4wQKEjh83GDhI0cJFDJeqNCgwwfoFTl6yDCxooeOBypahIjRo4aK6x8yfKjRwoWKEdpbPP/I0KI GVS), Z Gastroenterol 2023;61:544-606</a>.</p></section>
<section class="ilot" id="k25-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2><p>Le médecin cherche toujours la cause, car elle commande la prévention de la récidive. Selon la S2k 2023 (énoncé 7.1), les causes fréquentes d’un ulcère non lié à Helicobacter pylori sont les AINS non sélectifs et l’aspirine. En l’absence de ces deux causes, des <button class="w" data-k="k25-causes-rares">causes rares</button> sont recherchées ; si aucune n’est trouvée, l’ulcère est dit <button class="w" data-k="k25-idiopathique">idiopathique</button> (recommandation 7.2).</p><table class="t"><tr><th>Facteur</th><th>Rôle</th><th>Source</th></tr><tr><td>Helicobacter pylori</td><td>Cause ; sans éradication, la récidive est de 64 % (duodénum) et 52 % (estomac)</td><td>SSI 2026</td></tr><tr><td>AINS non sélectifs, aspirine, y compris à faible dose</td><td>Cause fréquente</td><td>S2k 2023, énoncé 7.1</td></tr><tr><td>Âge supérieur à 60 ans, antécédent d’ulcère</td><td>Risque d’ulcère et de complication</td><td>S2k 2023, énoncés 7.3 et 7.4</td></tr><tr><td>Aspirine, inhibiteur de P2Y12, anticoagulant</td><td>Risque de complication hémorragique</td><td>S2k 2023, énoncé 7.4</td></tr><tr><td>Corticoïde associé à un AINS</td><td>Risque de complication</td><td>S2k 2023, énoncé 7.4</td></tr><tr><td>ISRS associé à un AINS ou à un antiagrégant</td><td>Risque hémorragique</td><td>S2k 2023, recommandation 7.13</td></tr></table><p>Le tableau se lit en deux temps : les deux premières lignes sont des <b>causes</b>, à traiter ; les suivantes sont des <b>facteurs de risque</b>, qui justifient une prophylaxie. Exemple : la patiente de 63 ans sous ibuprofène a un seul facteur, l’âge ; si elle prenait aussi de l’aspirine, une prophylaxie par IPP serait indiquée.</p><div class="key"><b>À retenir.</b> Helicobacter pylori, AINS, aspirine : chercher, traiter, prévenir. Sans ces causes, chercher une cause rare avant de parler d’ulcère idiopathique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></section>
<section class="ilot" id="k25-5"><h2><span class="n">5</span>Anamnèse</h2><p>La douleur typique est épigastrique, à type de crampe ou de brûlure, rythmée par les repas. Mais l’anamnèse <b>ne permet pas</b> de distinguer un ulcère d’une <button class="w" data-k="k25-dyspepsie">dyspepsie fonctionnelle</button> : selon la SSI, environ un tiers des ulcères sont asymptomatiques et 40 à 80 % des ulcères hémorragiques n’ont pas été précédés de symptômes dyspeptiques.</p><p>L’anamnèse recherche donc surtout : la prise d’AINS, d’aspirine, d’antiagrégants, d’anticoagulants, de corticoïdes et d’ISRS ; un antécédent d’ulcère ou d’infection à Helicobacter pylori ; le tabac ; les <button class="w" data-k="k25-alarme">signes d’alarme</button> qui imposent une endoscopie ; une douleur brutale qui fait craindre une perforation ; des vomissements alimentaires tardifs qui font craindre une sténose.</p><div class="trap"><span class="k">Piège</span>Conclure à l’absence d’ulcère parce que le patient n’a pas mal : l’ulcère sous AINS est souvent silencieux jusqu’à la complication.</div><div class="key"><b>À retenir.</b> L’anamnèse sert à trouver la cause et les signes d’alarme, pas à poser le diagnostic d’ulcère.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></section>
<section class="ilot" id="k25-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’ulcère non compliqué donne peu de signes : sensibilité épigastrique, parfois rien. L’examen cherche surtout une complication. La <button class="w" data-k="k25-perforation-clinique">perforation</button> donne une douleur brutale, une défense puis une contracture abdominale ; la péritonite n’est cependant présente que chez environ deux tiers des patients, surtout si la perforation est couverte (WSES 2020). L’hémorragie se juge sur les signes vitaux et le toucher rectal (cours K92). La sténose se traduit par des vomissements et un clapotage à jeun.</p><div class="two"><div class="card"><b>Complication suspectée</b><p>Fréquence cardiaque, pression artérielle, température ; défense, contracture, disparition de la matité préhépatique ; toucher rectal.</p></div><div class="card"><b>Terrain</b><p>Âge, comorbidités, signes d’hépatopathie, signes de cancer (masse, ganglion de Troisier, amaigrissement).</p></div></div><div class="trap"><span class="k">Piège</span>Un sujet âgé, sous corticoïdes ou immunodéprimé peut avoir une perforation avec un abdomen peu défendu : l’imagerie tranche.</div><div class="key"><b>À retenir.</b> L’examen d’un ulcère suspecté est d’abord la recherche d’une perforation, d’une hémorragie ou d’une sténose.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></section>
<section class="ilot" id="k25-7"><h2><span class="n">7</span>Urgences : perforation et hémorragie</h2><div class="alert"><b>Perforation suspectée.</b> Douleur abdominale brutale chez un patient sous AINS ou porteur d’un ulcère : la WSES recommande une tomodensitométrie, ou à défaut une radiographie thoracique et abdominale debout pour rechercher un <button class="w" data-k="k25-pneumoperitoine">pneumopéritoine</button>. En cas d’instabilité, la réanimation est immédiate (pression artérielle moyenne ≥ 65 mmHg, diurèse ≥ 0,5 mL/kg/h, normalisation du lactate), avec avis chirurgical, hémocultures et antibiothérapie à large spectre.</div><p>Avec un pneumopéritoine important, une extravasation de contraste ou une péritonite, la WSES recommande la <button class="w" data-k="k25-chirurgie-perforation">chirurgie le plus tôt possible</button> : suture simple pour un ulcère de moins de 2 cm, par laparoscopie chez le patient stable si l’équipe en a l’expérience, par laparotomie chez le patient instable. Le traitement non opératoire n’est envisagé que dans des cas très sélectionnés, quand l’étude au produit hydrosoluble montre que la perforation est colmatée. Les scores de Boey, PULP et ASA aident à estimer le risque ; l’hypoalbuminémie est le meilleur facteur prédictif isolé de décès.</p><p>L’ulcère hémorragique suit la conduite du cours <button class="w" data-k="k25-hemorragie">K92 — Hémorragies digestives</button> : réanimation, score de Glasgow-Blatchford, endoscopie dans les 24 heures, classification de Forrest, hémostase endoscopique et IPP à forte dose.</p><div class="quiz ui"><p>Un homme de 45 ans a une douleur épigastrique brutale depuis 3 heures et un abdomen de bois. Pression 128/80 mmHg. La radiographie debout ne montre pas d’air libre. Quelle est l’étape suivante ?</p><button data-ok="0">Gastroscopie en urgence</button><button data-ok="1">Tomodensitométrie abdominale</button><button data-ok="0">IPP oral et réévaluation le lendemain</button><p class="fb" hidden>La radiographie ne voit le pneumopéritoine que dans 30 à 85 % des perforations ; la WSES recommande la tomodensitométrie, éventuellement avec contraste hydrosoluble. L’endoscopie est évitée devant une perforation suspectée.</p></div><div class="key"><b>À retenir.</b> Perforation : tomodensitométrie, réanimation, antibiotiques, chirurgie précoce. Hémorragie : conduite du cours K92.</div><button class="pareto-btn ui" data-k="pareto-k25-clinique">▲ Loi de Pareto — Reconnaître l’ulcère et ses complications</button><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></section>
