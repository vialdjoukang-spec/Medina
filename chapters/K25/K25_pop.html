<template data-pop="pareto-k25-clinique" data-title="Loi de Pareto — Reconnaître l’ulcère et ses complications"><p class="ratio" data-cover="k25-1,k25-3,k25-4,k25-5,k25-7"></p><ul><li>Ulcère : franchit la musculaire muqueuse ; érosion : reste muqueuse.</li><li>Deux causes dominantes : Helicobacter pylori et AINS ou aspirine.</li><li>Symptômes peu fiables ; ulcère hémorragique souvent silencieux.</li><li>Perforation : tomodensitométrie, réanimation, antibiotiques, chirurgie précoce.</li><li>Hémorragie : Glasgow-Blatchford, endoscopie ≤ 24 h, Forrest, IPP forte dose.</li></ul></template>
<template data-pop="pareto-k25-traitement" data-title="Loi de Pareto — Diagnostic, traitement et prévention"><p class="ratio" data-cover="k25-8,k25-9,k25-10,k25-11,k25-12"></p><ul><li>Endoscopie et biopsies ; Helicobacter pylori recherché hors IPP et antibiotiques.</li><li>Éradication : test de résistance, trithérapie ciblée 14 jours, IPP fort deux fois par jour.</li><li>Sans test : quadrithérapie bismuthée ; jamais de clarithromycine à l’aveugle.</li><li>Ulcère gastrique : contrôle endoscopique à 4 à 8 semaines.</li><li>Prophylaxie par IPP : médicament à risque + un facteur ; double antithrombotique toujours.</li></ul></template>
<template data-pop="pareto-k25-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k25-e-1,k25-e-2,k25-e-3"></p><ul><li>Œsogastroduodénoscopie avec biopsies : gold standard.</li><li>Antigène fécal et PCR de résistance : tests non invasifs de référence en Suisse.</li><li>Faux négatifs sous IPP, antibiotiques, bismuth, hémorragie.</li><li>Contrôle de l’éradication ≥ 4 semaines après traitement, sans IPP.</li><li>Perforation : tomodensitométrie ; radiographie seulement si indisponible.</li></ul></template>
<template data-pop="pareto-k25-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k25-p-1,k25-p-2,k25-p-3"></p><ul><li>IPP 40 mg 1×/j 4 à 8 semaines pour cicatriser ; 20 mg 1×/j en prévention.</li><li>Éradication : IPP 40 mg 2×/j, 14 jours, antibiotiques selon la résistance.</li><li>Pylera® 3 gélules 4×/j ; selles noires attendues.</li><li>Métronidazole : alcool et antivitamines K ; clarithromycine : CYP3A4.</li><li>IPP au long cours : magnésium, fractures, réévaluation.</li></ul></template>
<template data-pop="k25-ulcere-def" data-title="Ulcère ou érosion"><p class="lab">Définition</p><p>L’ulcère franchit la musculaire muqueuse ; l’érosion reste dans la muqueuse.</p><p class="lab">Conséquence</p><p>L’ulcère peut atteindre une artère sous-muqueuse et saigner abondamment, ou traverser la paroi et perforer ; il cicatrise par fibrose.</p><p class="lab">Piège</p><p>Le terme « ulcère » est souvent employé à tort pour des érosions vues à l’endoscopie ; le compte rendu doit être précis.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-deux-causes" data-title="Helicobacter pylori et AINS"><p class="lab">Helicobacter pylori</p><p>Gastrite chronique constante ; ulcère duodénal surtout ; récidive très fréquente sans éradication.</p><p class="lab">AINS et aspirine</p><p>Diminution des prostaglandines, effet antiagrégant ; ulcères souvent silencieux, révélés par une complication.</p><p class="lab">Synergie</p><p>Les deux causes s’additionnent ; leur association justifie la recherche de l’infection chez le patient ulcéreux sous AINS.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-prostaglandines" data-title="Prostaglandines et barrière muqueuse"><p class="lab">Rôle</p><p>Elles stimulent la sécrétion de mucus et de bicarbonates et maintiennent le flux sanguin muqueux.</p><p class="lab">Conséquence</p><p>Les AINS, en inhibant la cyclo-oxygénase, affaiblissent la barrière ; les coxibs, plus sélectifs de la COX-2, l’affaiblissent moins.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-phenotype-duodenal" data-title="Phénotypes de la gastrite à Helicobacter pylori"><p class="lab">Gastrite modérée</p><p>Plus de 80 % des infectés ; sécrétion acide normale ; pas de complication.</p><p class="lab">Phénotype « ulcère duodénal »</p><p>10 à 15 % ; gastrite antrale ; gastrine et acide élevés ; ulcère duodénal.</p><p class="lab">Phénotype « cancer gastrique »</p><p>1 à 3 % ; gastrite fundique ; acide bas ; atrophie, métaplasie intestinale, cancer.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-causes-rares" data-title="Causes rares d’ulcère (S2k 2023, tableau 11)"><p class="lab">Inflammatoires</p><p>Gastroentérite à éosinophiles, maladie de Crohn, maladie de Behçet, sarcoïdose, vascularites.</p><p class="lab">Infectieuses</p><p>Cytomégalovirus, herpès simplex, plus rarement Candida, virus d’Epstein-Barr, mycobactéries, tréponème.</p><p class="lab">Médicamenteuses</p><p>ISRS, bisphosphonates, potassium, sirolimus, mycophénolate, chimiothérapies, spironolactone.</p><p class="lab">Ischémiques et toxiques</p><p>Chimioembolisation ou radioembolisation récente, cocaïne, amphétamines.</p><p class="lab">Tumorales et sécrétoires</p><p>Gastrinome (y compris NEM 1), mastocytose systémique, infiltration tumorale.</p><p class="lab">Stress</p><p>Choc, sepsis, polytraumatisme, brûlures, ventilation mécanique prolongée.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-idiopathique" data-title="Ulcère idiopathique"><p class="lab">Définition</p><p>Ulcère sans Helicobacter pylori (testé de façon fiable), sans AINS ni aspirine, sans cause rare.</p><p class="lab">Pronostic</p><p>Récidives et récidives hémorragiques plus fréquentes que pour l’ulcère lié à Helicobacter pylori.</p><p class="lab">Traitement</p><p>IPP à forte dose ; après complication ou persistance, IPP au long cours en dose standard (S2k, recommandation 7.17).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-dyspepsie" data-title="Dyspepsie et ulcère"><p class="lab">Fait</p><p>Les symptômes ne distinguent pas l’ulcère de la dyspepsie fonctionnelle.</p><p class="lab">Chiffre</p><p>Environ 5 % des dyspepsies sont dues à Helicobacter pylori ; seul un tiers des patients traités est soulagé.</p><p class="lab">Conséquence</p><p>La dyspepsie seule, sans facteur de risque, n’est pas une indication à tester et traiter selon la SSI.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-alarme" data-title="Signes d’alarme"><p class="lab">Liste</p><p>Amaigrissement involontaire, vomissements persistants, dysphagie, hématémèse ou méléna, anémie.</p><p class="lab">Conduite</p><p>Endoscopie ; l’information professionnelle de l’ésoméprazole demande d’exclure un cancer avant de traiter un ulcère gastrique suspecté.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-perforation-clinique" data-title="Clinique de la perforation"><p class="lab">Tableau</p><p>Douleur épigastrique brutale, puis diffuse ; défense, contracture ; parfois choc septique.</p><p class="lab">Limite</p><p>La péritonite manque dans environ un tiers des cas, surtout si la perforation est couverte.</p><p class="lab">Biologie</p><p>Hyperleucocytose, acidose métabolique, amylase parfois élevée : non spécifiques ; gaz du sang recommandés par la WSES.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-pneumoperitoine" data-title="Pneumopéritoine"><p class="lab">Définition</p><p>Air libre dans la cavité péritonéale.</p><p class="lab">Détection</p><p>Tomodensitométrie, la plus sensible ; radiographie debout ou en décubitus latéral gauche : 30 à 85 % des perforations.</p><p class="lab">Piège</p><p>Son absence n’exclut pas la perforation ; un contraste hydrosoluble aide en cas de doute.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-chirurgie-perforation" data-title="Chirurgie de l’ulcère perforé"><p class="lab">Délai</p><p>Le plus tôt possible, surtout après 70 ans et en cas de présentation tardive.</p><p class="lab">Technique</p><p>Ulcère < 2 cm : suture primaire ; > 2 cm : approche adaptée au siège ; résection avec examen extemporané si un cancer gastrique est suspecté.</p><p class="lab">Voie</p><p>Laparoscopie chez le patient stable ; laparotomie chez le patient instable ; stratégie de contrôle des dégâts en cas de choc septique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-hemorragie" data-title="Ulcère hémorragique"><p class="lab">Renvoi</p><p>La prise en charge complète est détaillée dans le cours K92 — Hémorragies digestives.</p><p class="lab">Spécificité ulcéreuse</p><p>Biopsies à la recherche de Helicobacter pylori dès la première endoscopie, nouveau test si négatif, éradication puis contrôle.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k25-ogd" data-title="Œsogastroduodénoscopie"><p class="lab">Rôle</p><p>Gold standard : visualise, situe, mesure, classe et permet les biopsies.</p><p class="lab">Indications</p><p>Signes d’alarme, risque élevé de cancer gastrique, échec des IPP, hémorragie ; contrôle de l’ulcère gastrique.</p><p class="lab">Contre-indication relative</p><p>Perforation suspectée : l’imagerie passe d’abord.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-antigene-selles" data-title="Antigène fécal de Helicobacter pylori"><p class="lab">Principe</p><p>Détection immunologique d’antigènes bactériens dans les selles.</p><p class="lab">Performance</p><p>Sensibilité 93 à 95 %, spécificité 96 à 98 % (SSI).</p><p class="lab">Conditions</p><p>Arrêt des IPP 2 semaines et des antibiotiques 4 semaines ; adapté au contrôle de l’éradication.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-pcr-resistance" data-title="PCR de résistance"><p class="lab">Principe</p><p>Amplification de l’ADN bactérien et recherche des mutations de résistance à la clarithromycine et à la lévofloxacine.</p><p class="lab">Usage</p><p>La SSI propose de l’enchaîner automatiquement à un antigène fécal positif quand un traitement est prévu.</p><p class="lab">Limite</p><p>Ne teste pas le métronidazole ; disponibilité encore limitée.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-eradication" data-title="Éradication de Helicobacter pylori"><p class="lab">Bénéfice</p><p>Nombre de patients à traiter pour éviter une récidive : 2 pour l’ulcère duodénal, 3 pour l’ulcère gastrique ; baisse du risque de cancer gastrique de 46 à 53 % dans les méta-analyses.</p><p class="lab">Règle</p><p>Traitement guidé par la résistance ; contrôle systématique de la guérison.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-controle-endoscopique" data-title="Contrôle endoscopique de l’ulcère gastrique"><p class="lab">Délai</p><p>4 à 8 semaines après le début du traitement.</p><p class="lab">But</p><p>Confirmer la cicatrisation et rebiopsier si elle est incomplète, pour exclure un cancer.</p><p class="lab">Ulcère duodénal</p><p>Pas de contrôle de routine : les cancers duodénaux sont exceptionnels.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a> ; <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-trithérapie" data-title="Trithérapie ciblée"><p class="lab">Composition</p><p>IPP à forte dose, amoxicilline et clarithromycine, lévofloxacine ou métronidazole selon la sensibilité.</p><p class="lab">Avantages</p><p>Six comprimés par jour, deux prises, moins d’effets indésirables que la quadrithérapie.</p><p class="lab">Condition</p><p>Test de résistance préalable et absence d’allergie à la pénicilline.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-bqt" data-title="Quadrithérapie bismuthée"><p class="lab">Composition</p><p>IPP et Pylera® (bismuth, tétracycline, métronidazole dans la même gélule).</p><p class="lab">Efficacité</p><p>80 à 90 % dans les essais, souvent moins en pratique en raison de la complexité du schéma.</p><p class="lab">Contraintes</p><p>14 comprimés par jour en quatre prises ; effets indésirables chez 40 à 70 % des patients ; ruptures de stock déjà survenues.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-gastrinome" data-title="Syndrome de Zollinger-Ellison"><p class="lab">Mécanisme</p><p>Une tumeur neuroendocrine sécrète de la gastrine ; l’hypersécrétion acide provoque des ulcères multiples, distaux, récidivants, souvent avec diarrhée.</p><p class="lab">Indice</p><p>Ulcères multiples, distaux ou réfractaires sans Helicobacter pylori ni AINS.</p><p class="lab">Traitement acide</p><p>Ésoméprazole 40 mg deux fois par jour au départ, puis dose adaptée (information professionnelle suisse).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-d-ipp" data-title="Inhibiteurs de la pompe à protons"><p class="lab">Mécanisme</p><p>Inhibition irréversible de la pompe H⁺/K⁺-ATPase ; effet maximal pris avant le repas.</p><p class="lab">Indications suisses (ésoméprazole)</p><p>Éradication de Helicobacter pylori, ulcère gastrique sous AINS, prévention sous AINS, Zollinger-Ellison, prévention de la récidive hémorragique.</p><p class="lab">Précautions</p><p>Clopidogrel, méthotrexate à forte dose ; hypomagnésémie, fractures, infections digestives au long cours.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-d-pylera" data-title="Pylera®"><p class="lab">Composition</p><p>Sous-citrate de bismuth potassique, métronidazole, chlorhydrate de tétracycline.</p><p class="lab">Posologie suisse</p><p>3 gélules 4 fois par jour pendant 10 jours, avec oméprazole 20 mg 2 fois par jour ; la SSI recommande un IPP à 40 mg et jusqu’à 14 jours.</p><p class="lab">Contre-indications</p><p>Grossesse, allaitement, enfants de moins de 12 ans, insuffisance rénale ou hépatique, syndrome de Cockayne.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-d-amox" data-title="Amoxicilline"><p class="lab">Place</p><p>Pilier de la trithérapie ; résistance rare (3 % dans les données suisses citées par la SSI).</p><p class="lab">Dose</p><p>1 g deux fois par jour pendant 14 jours.</p><p class="lab">Contre-indication</p><p>Allergie aux pénicillines : choisir la quadrithérapie bismuthée.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-d-clari" data-title="Clarithromycine"><p class="lab">Place</p><p>Seulement si la souche est sensible : la résistance dépasse 15 %.</p><p class="lab">Dose</p><p>500 mg deux fois par jour pendant 14 jours.</p><p class="lab">Interactions</p><p>Puissant inhibiteur du CYP3A4 ; allongement du QT.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-d-levo" data-title="Lévofloxacine"><p class="lab">Place</p><p>Seulement si la souche est sensible : la résistance dépasse 15 %.</p><p class="lab">Dose</p><p>500 mg une fois par jour ou 250 mg deux fois par jour pendant 14 jours.</p><p class="lab">Sécurité</p><p>Mises en garde de Swissmedic et de l’EMA sur les fluoroquinolones : tendinopathies, anévrisme aortique, neuropathie ; réserver aux indications justifiées.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-musculaire" data-title="Musculaire muqueuse"><p class="lab">Définition</p><p>Fine couche de muscle lisse qui sépare la muqueuse de la sous-muqueuse.</p><p class="lab">Valeur</p><p>C’est la frontière histologique entre érosion (au-dessus) et ulcère (au-delà).</p><p class="lab">Conséquence</p><p>La sous-muqueuse contient les artères de calibre suffisant pour une hémorragie grave.</p></template>
<template data-pop="k25-hp" data-title="Helicobacter pylori"><p class="lab">Agent</p><p>Bacille à Gram négatif, spiralé, microaérophile, qui colonise le mucus gastrique.</p><p class="lab">Effets</p><p>Gastrite chronique constante ; ulcère gastrique ou duodénal ; atrophie, métaplasie, cancer gastrique ; lymphome du MALT.</p><p class="lab">Conduite</p><p>Recherche chez tout ulcéreux ; traitement guidé par la résistance ; contrôle de la guérison (SSI 2026).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-ains" data-title="AINS non sélectifs"><p class="lab">Mécanisme</p><p>Inhibition des cyclo-oxygénases 1 et 2 ; baisse des prostaglandines protectrices de la muqueuse.</p><p class="lab">Risque</p><p>Cause fréquente d’ulcère et d’hémorragie, souvent silencieuse jusqu’à la complication (S2k 2023, énoncé 7.1).</p><p class="lab">Prévention</p><p>IPP si un facteur de risque supplémentaire est présent (recommandation 7.5) ; IPP au long cours après une complication si l’AINS est poursuivi (7.8).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-coxib" data-title="Coxibs"><p class="lab">Définition</p><p>AINS sélectifs de la cyclo-oxygénase 2, par exemple le célécoxib.</p><p class="lab">Avantage</p><p>Moins d’ulcères et d’hémorragies que les AINS non sélectifs.</p><p class="lab">Prophylaxie</p><p>IPP si un facteur de risque supplémentaire ; toujours si aspirine, inhibiteur de P2Y12, anticoagulant ou ISRS associé (S2k 2023, recommandation 7.6).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-isrs" data-title="ISRS et risque hémorragique"><p class="lab">Mécanisme</p><p>Les plaquettes ne captent plus la sérotonine ; l’agrégation diminue.</p><p class="lab">Prophylaxie</p><p>IPP si antécédent d’ulcère ou association à un AINS, un coxib ou un inhibiteur de P2Y12 ; discutable avec un anticoagulant (S2k 2023, recommandation 7.13).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-p2y12" data-title="Inhibiteurs de P2Y12"><p class="lab">Molécules</p><p>Clopidogrel, prasugrel, ticagrélor.</p><p class="lab">Risque digestif</p><p>Facteur de risque de complication ulcéreuse (S2k 2023, énoncé 7.4).</p><p class="lab">Après une hémorragie sous P2Y12 seul</p><p>IPP au long cours ; un passage à l’aspirine peut être discuté si le cardiologue l’accepte (recommandation 7.11).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-gbs" data-title="Score de Glasgow-Blatchford"><p class="lab">Composantes</p><p>Urée, hémoglobine, pression systolique, fréquence cardiaque, méléna, syncope, hépatopathie, insuffisance cardiaque.</p><p class="lab">Seuil</p><p>≤ 1 : très faible risque, prise en charge ambulatoire possible (ESGE 2021).</p><p class="lab">Renvoi</p><p>Détail dans le cours K92 — Hémorragies digestives.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k25-forrest" data-title="Classification de Forrest"><p class="lab">Stades</p><p>Ia jet ; Ib suintement ; IIa vaisseau visible ; IIb caillot adhérent ; IIc tache pigmentée ; III fond propre.</p><p class="lab">Conduite</p><p>Ia, Ib, IIa : hémostase endoscopique ; IIb : retrait du caillot envisagé ; IIc et III : pas d’hémostase (ESGE 2021).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k25-scores-perforation" data-title="Scores de risque de l’ulcère perforé"><p class="lab">Boey</p><p>Trois items : comorbidité grave, choc à l’admission, délai de plus de 24 heures ; le plus utilisé, mais de précision variable.</p><p class="lab">PULP et ASA</p><p>Prédisent la mortalité aussi bien l’un que l’autre et mieux que le score de Boey.</p><p class="lab">Meilleur facteur isolé</p><p>L’hypoalbuminémie (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-stenose" data-title="Sténose ulcéreuse"><p class="lab">Mécanisme</p><p>Œdème inflammatoire puis fibrose cicatricielle de la région pyloroduodénale.</p><p class="lab">Clinique</p><p>Vomissements alimentaires tardifs, clapotage à jeun, amaigrissement.</p><p class="lab">Démarche</p><p>Endoscopie avec biopsies pour exclure un cancer ; traitement de la cause et IPP ; dilatation ou chirurgie si la sténose persiste.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-test-respiratoire" data-title="Test respiratoire à l’urée marquée"><p class="lab">Principe</p><p>L’uréase bactérienne scinde l’urée marquée au carbone 13 ; le CO₂ marqué est mesuré dans l’air expiré.</p><p class="lab">Performance</p><p>Sensibilité et spécificité de 90 à 95 % (SSI).</p><p class="lab">Statut en Suisse</p><p>Non recommandé en routine par la SSI 2026 : personnel formé et laboratoire équipé nécessaires, aucune information sur la résistance.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-culture" data-title="Culture de Helicobacter pylori"><p class="lab">Prélèvement</p><p>Biopsies gastriques prises pendant l’endoscopie.</p><p class="lab">Valeur</p><p>Référence de l’antibiogramme, y compris pour le métronidazole.</p><p class="lab">Limite</p><p>Sensibilité de 75 à 91 % selon l’expérience du laboratoire (SSI).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-serologie" data-title="Sérologie de Helicobacter pylori"><p class="lab">Principe</p><p>Recherche d’anticorps IgG.</p><p class="lab">Limite</p><p>Ne distingue pas une infection active d’une infection guérie ; inutile pour contrôler l’éradication.</p><p class="lab">Statut</p><p>Non recommandée par la SSI 2026.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-metronidazole" data-title="Métronidazole"><p class="lab">Place</p><p>Composant de Pylera® ; trithérapie possible seulement si la souche est sensible.</p><p class="lab">Résistance</p><p>Élevée : 44 % dans les données suisses ANRESIS citées par la SSI.</p><p class="lab">Précautions</p><p>Effet antabuse (pas d’alcool jusqu’à 24 heures après la fin) ; potentialisation des antivitamines K (information professionnelle Pylera®).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-cellule-parietale" data-title="Cellule pariétale"><p class="lab">Siège</p><p>Glandes du fundus et du corps gastrique.</p><p class="lab">Fonction</p><p>Sécrétion d’acide chlorhydrique par la pompe H⁺/K⁺-ATPase et de facteur intrinsèque.</p><p class="lab">Régulation</p><p>Stimulée par l’histamine (récepteur H2), la gastrine et l’acétylcholine ; freinée par la somatostatine.</p></template>
<template data-pop="k25-gastrine" data-title="Gastrine"><p class="lab">Origine</p><p>Cellules G de l’antre gastrique.</p><p class="lab">Effet</p><p>Stimule la sécrétion acide, directement et par la libération d’histamine.</p><p class="lab">Pathologie</p><p>Élevée dans la gastrite antrale à Helicobacter pylori et, très fortement, dans le gastrinome.</p></template>
<template data-pop="k25-stress" data-title="Ulcères de stress"><p class="lab">Mécanisme</p><p>Défaut de perfusion de la muqueuse au cours des maladies graves.</p><p class="lab">Facteurs indépendants</p><p>Troubles de la coagulation et ventilation mécanique de plus de 48 heures.</p><p class="lab">Prévention</p><p>IPP chez le patient de soins intensifs à haut risque (S2k 2023, recommandation 7.18).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-tdm" data-title="Tomodensitométrie de l’ulcère perforé"><p class="lab">Signes</p><p>Pneumopéritoine, liquide intrapéritonéal, épaississement pariétal, infiltration de la graisse, fuite de contraste hydrosoluble.</p><p class="lab">Valeur</p><p>Plus sensible que la radiographie ; situe la perforation et écarte d’autres causes.</p><p class="lab">Limite</p><p>Jusqu’à 12 % des perforations ont un examen normal (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-avk" data-title="Antivitamines K et éradication"><p class="lab">Interaction</p><p>Le métronidazole et l’oméprazole potentialisent l’acénocoumarol et la phenprocoumone.</p><p class="lab">Conduite</p><p>Contrôler le temps de prothrombine pendant le traitement et adapter la dose (information professionnelle Pylera®).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-nom" data-title="Traitement non opératoire de l’ulcère perforé"><p class="lab">Conditions</p><p>Patient stable, sans péritonite ni sepsis, perforation colmatée sur l’étude au contraste hydrosoluble.</p><p class="lab">Risque</p><p>Environ 28 % d’échecs à 12 heures dans l’essai randomisé cité par la WSES ; moins bonne réponse après 70 ans.</p><p class="lab">Statut</p><p>Non recommandé de routine (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-ipp-long-cours" data-title="IPP au long cours : effets indésirables"><p class="lab">Hypomagnésémie</p><p>Après au moins 3 mois, le plus souvent après un an ; peut entraîner hypocalcémie et hypokaliémie.</p><p class="lab">Fractures</p><p>Risque modérément accru (hanche, poignet, rachis) après plus d’un an à dose élevée.</p><p class="lab">Infections</p><p>Infections digestives un peu plus fréquentes.</p><p class="lab">Conduite</p><p>Réévaluer l’indication ; arrêter si elle n’existe plus.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-anresis" data-title="ANRESIS"><p class="lab">Définition</p><p>Centre suisse de surveillance de la résistance aux antibiotiques.</p><p class="lab">Données Helicobacter pylori</p><p>Clarithromycine 28 %, lévofloxacine 18 %, métronidazole 44 %, amoxicilline 3 %, tétracycline 4 %, surtout après échec thérapeutique (SSI 2026).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
