<template data-pop="pareto-k25-clinique" data-title="Loi de Pareto — Reconnaître l’ulcère et ses complications"><p class="ratio" data-cover="k25-1,k25-3,k25-4,k25-5,k25-7"></p><ul><li>Ulcère : franchit la musculaire muqueuse ; érosion : reste muqueuse.</li><li>Deux causes dominantes : Helicobacter pylori et AINS ou aspirine.</li><li>Les symptômes sont peu fiables, et l’ulcère hémorragique reste souvent silencieux.</li><li>Perforation : tomodensitométrie, réanimation, antibiotiques, chirurgie précoce.</li><li>Hémorragie : Glasgow-Blatchford, endoscopie ≤ 24 h, Forrest, IPP forte dose.</li></ul></template>
<template data-pop="pareto-k25-traitement" data-title="Loi de Pareto — Diagnostic, traitement et prévention"><p class="ratio" data-cover="k25-8,k25-9,k25-10,k25-11,k25-12"></p><ul><li>On fait une endoscopie avec biopsies et on recherche Helicobacter pylori hors IPP et antibiotiques.</li><li>Éradication : test de résistance, trithérapie ciblée 14 jours, IPP fort deux fois par jour.</li><li>Sans test : quadrithérapie bismuthée ; jamais de clarithromycine à l’aveugle.</li><li>Ulcère gastrique : contrôle endoscopique à 4 à 8 semaines.</li><li>On prescrit un IPP quand un médicament à risque s’ajoute à un facteur de risque, et toujours sous double antithrombotique.</li></ul></template>
<template data-pop="pareto-k25-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k25-e-1,k25-e-2,k25-e-3"></p><ul><li>L’œsogastroduodénoscopie avec biopsies est l’examen de référence.</li><li>L’antigène fécal et la PCR de résistance sont les tests non invasifs de référence en Suisse.</li><li>Les IPP, les antibiotiques, le bismuth et l’hémorragie donnent des faux négatifs, car ils réduisent la charge bactérienne.</li><li>Contrôle de l’éradication ≥ 4 semaines après traitement, sans IPP.</li><li>La perforation se recherche par tomodensitométrie ; la radiographie ne sert que si elle est indisponible.</li></ul></template>
<template data-pop="pareto-k25-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k25-p-1,k25-p-2,k25-p-3"></p><ul><li>L’IPP se donne à 40 mg 1×/j pendant 4 à 8 semaines pour cicatriser, et à 20 mg 1×/j en prévention.</li><li>L’éradication associe un IPP à 40 mg 2×/j pendant 14 jours et des antibiotiques choisis selon la résistance.</li><li>Pylera® 3 gélules 4×/j ; selles noires attendues.</li><li>Le métronidazole interagit avec l’alcool et les antivitamines K, et la clarithromycine avec les substrats du CYP3A4.</li><li>IPP au long cours : magnésium, fractures, réévaluation.</li></ul></template>
<template data-pop="k25-ulcere-def" data-title="Ulcère ou érosion"><p class="lab">Définition</p><p>L’ulcère franchit la musculaire muqueuse ; l’érosion reste dans la muqueuse.</p><p class="lab">Conséquence</p><p>L’ulcère peut atteindre une artère sous-muqueuse et saigner abondamment, ou traverser la paroi et perforer ; il cicatrise par fibrose.</p><p class="lab">Piège</p><p>Le terme « ulcère » est souvent employé à tort pour des érosions vues à l’endoscopie ; le compte rendu doit être précis.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhCAJbAYUAAP/////9///++/z+/P/6/f/2/Pz4+vvw+Pjm9v3V9+7U7vTG7vm76+e75fWy6vOr6PKt2/Ki4/Gg1eWt3+Wk3OWd2Nyj2s6j1/CW1u+O0OOS0tmV2tiUy9eNz+2EyeGEyNaF0NaDweN3v9R1vsqR0MqIzMmAyLqIybh8xcJ0yMNyt7NywKVxvdFms79ltbJlwLJjr6FjwJ9ir61Xr5ZWsqZKp5JIqYZXroNMq4BGqII+pHA9onE0nmspllUolkgWiSwAAAAACAJbAUAI/wABCBxIsKDBgwgTAhigsKHDhwQNIDDAEKLFixgzaoQ4oOPGjyAVVgxJsqTJkyhTqlzJsqXLlzBjypzZ0iPNmzhz6tzJs6dPgh5H/hxKtKjRo0iTKl3KtKnTpzGFQp1KtarVq1iLSg25NatXjl83VhwQoGNHAxQXEjDLFkAAAXDNAhAQYCEABQ0OBAhg4ICBAATQ9hX8d+/IugfHhl3MuLFjkmYJIECg98AJHDQw55BhA0cPHyxQ+PjxYweJFTZgoNjRYwcPGSx40IAh4wQKEjh83GDhI0cJFDJeqNCgwwfoFTl6yDCxooeOBypahIjRo4aK6x8yfKjRwoWKEdpbPP/I0KIFBhs9NpwoASGECx6yR5gfId9FCxEwZpT4gYNB/usy5LCDccbtYAEJN+AQQ14IKDBZAXUJwNaEj1Vo4YU6MXTCDz708MMJABjAAmkn8FXAAg1ccMECCZBgwQQLIFAAArYBR8IOLCSQAAcVzDBDBBmEEEIGGHwwggTdgfDABw5IEMIHINCQggshoOeDDEaOIEKVOuhggwMYwMBAAjOIYOQH3iVgQQ0dJMBABhJ8EIIIGUTAnAnebZAaBtJFoMEKJjxpAgghFDmCChu4sMKOI3RQ3A8zvNDDcB54kEGQElBgQwkmcKeCDDwUGMMKJ1igAAFzdQQXhqy26qpCdTX/SIACC0ygwAEEBHZAAZf1gMIDHCxggQoSYEBfoYfypkMFIojgwQdZukBfCvm94EIN4MGgwgMajJBdCyDM0EIGIowgww8NWGCCA7nZoIEHzbYQAQwWXMBBAguEAEIMOsxQ5LPRgfCBBzVYwMIMOrDQgQQggJDCoBp0i18IHbhgAgMqcKACBCTIIIEKz44QwoYxaLDkDBpMSd8H3EL7gbMalPDCA0hmAK8LP <template data-pop="k25-deux-causes" data-title="Helicobacter pylori et AINS"><p class="lab">Helicobacter pylori</p><p>Helicobacter pylori provoque toujours une gastrite chronique et cause surtout l’ulcère duodénal ; sans éradication, la récidive est très fréquente.</p><p class="lab">AINS et aspirine</p><p>Les AINS et l’aspirine diminuent les prostaglandines et inhibent l’agrégation plaquettaire ; c’est pourquoi leurs ulcères restent souvent silencieux jusqu’à une complication.</p><p class="lab">Synergie</p><p>Les deux causes s’additionnent ; leur association justifie la recherche de l’infection chez le patient ulcéreux sous AINS.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-prostaglandines" data-title="Prostaglandines et barrière muqueuse"><p class="lab">Rôle</p><p>Elles stimulent la sécrétion de mucus et de bicarbonates et maintiennent le flux sanguin muqueux.</p><p class="lab">Conséquence</p><p>Les AINS, en inhibant la cyclo-oxygénase, affaiblissent la barrière ; les coxibs, plus sélectifs de la COX-2, l’affaiblissent moins.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-phenotype-duodenal" data-title="Phénotypes de la gastrite à Helicobacter pylori"><p class="lab">Gastrite modérée</p><p>Plus de 80 % des infectés ont une gastrite modérée, avec une sécrétion acide normale et sans complication.</p><p class="lab">Phénotype « ulcère duodénal »</p><p>Chez 10 à 15 % des infectés, la gastrite prédomine dans l’antre ; la gastrine et l’acide augmentent, ce qui favorise l’ulcère duodénal.</p><p class="lab">Phénotype « cancer gastrique »</p><p>Chez 1 à 3 % des infectés, la gastrite prédomine dans le fundus ; l’acide baisse, et l’atrophie, la métaplasie intestinale puis le cancer peuvent survenir.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-causes-rares" data-title="Causes rares d’ulcère (S2k 2023, tableau 11)"><p class="lab">Inflammatoires</p><p>Les causes inflammatoires sont la gastroentérite à éosinophiles, la maladie de Crohn, la maladie de Behçet, la sarcoïdose et les vascularites.</p><p class="lab">Infectieuses</p><p>Les causes infectieuses sont le cytomégalovirus, l’herpès simplex et, plus rarement, Candida, le virus d’Epstein-Barr, les mycobactéries et le tréponème.</p><p class="lab">Médicamenteuses</p><p>Les médicaments en cause sont les ISRS, les bisphosphonates, le potassium, le sirolimus, le mycophénolate, les chimiothérapies et la spironolactone.</p><p class="lab">Ischémiques et toxiques</p><p>Une chimioembolisation ou une radioembolisation récente, la cocaïne et les amphétamines provoquent des ulcères par ischémie ou toxicité.</p><p class="lab">Tumorales et sécrétoires</p><p>Le gastrinome (y compris dans la NEM 1), la mastocytose systémique et l’infiltration tumorale en sont les causes tumorales et sécrétoires.</p><p class="lab">Stress</p><p>Le choc, le sepsis, le polytraumatisme, les brûlures et la ventilation mécanique prolongée provoquent des ulcères de stress.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-idiopathique" data-title="Ulcère idiopathique"><p class="lab">Définition</p><p>Un ulcère est idiopathique quand Helicobacter pylori est absent sur un test fiable, sans AINS ni aspirine et sans cause rare.</p><p class="lab">Pronostic</p><p>Il récidive et resaigne plus souvent que l’ulcère lié à Helicobacter pylori, car sa cause persiste.</p><p class="lab">Traitement</p><p>On le traite par un IPP à forte dose ; après une complication ou en cas de persistance, l’IPP se poursuit au long cours en dose standard (S2k, recommandation 7.17).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-dyspepsie" data-title="Dyspepsie et ulcère"><p class="lab">Fait</p><p>Les symptômes ne distinguent pas l’ulcère de la dyspepsie fonctionnelle.</p><p class="lab">Chiffre</p><p>Environ 5 % des dyspepsies sont dues à Helicobacter pylori ; seul un tiers des patients traités est soulagé.</p><p class="lab">Conséquence</p><p>La dyspepsie seule, sans facteur de risque, n’est pas une indication à tester et traiter selon la SSI.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-alarme" data-title="Signes d’alarme"><p class="lab">Liste</p><p>Les signes d’alarme sont un amaigrissement involontaire, des vomissements persistants, une dysphagie, une hématémèse ou un méléna et une anémie, car ils font craindre un cancer ou une complication.</p><p class="lab">Conduite</p><p>Ils imposent une endoscopie, et l’information professionnelle de l’ésoméprazole demande d’exclure un cancer avant de traiter un ulcère gastrique suspecté.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-perforation-clinique" data-title="Clinique de la perforation"><p class="lab">Tableau</p><p>La douleur épigastrique est brutale, puis devient diffuse ; une défense, puis une contracture apparaissent, et un choc septique survient parfois.</p><p class="lab">Limite</p><p>La péritonite manque dans environ un tiers des cas, surtout si la perforation est couverte.</p><p class="lab">Biologie</p><p>L’hyperleucocytose, l’acidose métabolique et une amylase parfois élevée ne sont pas spécifiques ; la WSES recommande cependant des gaz du sang, car le lactate et l’acidose mesurent la gravité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-pneumoperitoine" data-title="Pneumopéritoine"><p class="lab">Définition</p><p>Le pneumopéritoine est la présence d’air libre dans la cavité péritonéale.</p><p class="lab">Détection</p><p>La tomodensitométrie le détecte le mieux, alors que la radiographie debout ou en décubitus latéral gauche ne le montre que dans 30 à 85 % des perforations.</p><p class="lab">Piège</p><p>Son absence n’exclut pas la perforation ; en cas de doute, un contraste hydrosoluble aide à la montrer.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAJXAYUAAOfn1MzPxMHEvLrCu7q+uLm7t7m6srO6s7O3sLO0rrGyrK2yrK2uqKqtp6qqo6SqpKKln6Ghm5ugmpublZSYk5KTjo+PioqPiomLh4eJhIaFgYGFgIKAfH5/ent/enx7dnh6dXh2cnN2cXBybW5taWlrZ2VmYl9fXFhaVlNUUU5OS0dIRT0+OywvJx4iGBUXEA4PCgoLBwkJBggIBQcHBgcIAwcGBAYGBAQHAwUFAwQEAgMDAgICAQIAAAAAAQAAACwAAAAAWAJXAUAI/wB/CBxIsKDBgwgTDuTBkKHChxAjSiQoA4bFixgzaoQRw2JHjyA5xhhJsuRIGTwmqlzJsqXLlzBjypxJs6bNmzhz6tzJs6fPn0CDCh1KtKjRo0iTKpXIcEdTHFCjSoVaoyqOqjOq1pjBtetJGSbDXqyho6FZszuc8nAa44eNG2fjyp3LsAePHnjp5rgBVoZfGV1nABbMVQaNw4gR31icmEaOx4tz6EibtmFlumgvp9Wh47Hnx5xDp1xKurTp06h1HjZMg/Hf168P32h8mGtHsBsvvsj4orfv38CDC/ftorhxFy1YKGexonlzFdBTpEBB/QSKE9izmyhBovuI7yO6g//YsKHDiO3dSYwQYZ06CukpTpgwQQKECBH274PYL6LE9vkmyJede+/BB51zK6iQgoILrqBcCxBCuNyDEVZo4YXHZfjbRSN1BZhfHv4Vgw6plWjiiSiaiB16JbzX3IPITchCchNeOOOFFS5H44QvLoegc8r9+Nx01C3IIJHzlQBedyVwt6R6JDTZZJQjKPmdCB5s4EEHG1xwAXnkZYABBhdQQEEGXmpp35X4jWeml19qSd53UgJoAnh45hkek3YOCN2f0cEnHaB/CvmjjIjWSGMLxS0a4XIv/DBaipRWaumlNsFXpKbXXWfCdSCcIB0KJoSwZQf9XSffp6qWEIIGGYD/YEIKzqmQIKGD/inoqARW5x6v7snHnQjrtbkfCB4g68Gpy3KpZbJYLiutshtYcAEG5HlALJ11ArgieOORh0EGGYDZQbLJHpufuuvmt96TUfpnnYGEKtjrroIWauuhzanKYg+OyfCDByn8QMMOOfzgwgQocMBBC5JiKvHEFFdcUHre9YdBAAFooMIHBRAQKgUAkiCCCaHSt+p82clHwgcfgBACeCKE0IHDHeTMAbkXVPDlySuyLOCA2gHInXrF6tcuuxuU <template data-pop="k25-chirurgie-perforation" data-title="Chirurgie de l’ulcère perforé"><p class="lab">Délai</p><p>On opère le plus tôt possible, surtout après 70 ans et en cas de présentation tardive, car la péritonite aggrave le pronostic d’heure en heure.</p><p class="lab">Technique</p><p>Un ulcère < 2 cm se ferme par une suture primaire, alors qu’un ulcère > 2 cm demande une approche adaptée au siège ; une résection avec examen extemporané s’impose si un cancer gastrique est suspecté.</p><p class="lab">Voie</p><p>Le patient stable est opéré par laparoscopie et le patient instable par laparotomie ; en cas de choc septique, on applique une stratégie de contrôle des dégâts.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-hemorragie" data-title="Ulcère hémorragique"><p class="lab">Renvoi</p><p>La prise en charge complète est détaillée dans le cours K92 — Hémorragies digestives.</p><p class="lab">Spécificité ulcéreuse</p><p>Dès la première endoscopie, on prélève des biopsies à la recherche de Helicobacter pylori ; si elles sont négatives, on refait un test, car le saignement donne des faux négatifs. Ensuite, on éradique puis on contrôle.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k25-ogd" data-title="Œsogastroduodénoscopie"><p class="lab">Rôle</p><p>L’œsogastroduodénoscopie est l’examen de référence : elle visualise l’ulcère, le situe, le mesure, le classe et permet les biopsies.</p><p class="lab">Indications</p><p>On la demande en cas de signes d’alarme, de risque élevé de cancer gastrique, d’échec des IPP ou d’hémorragie, ainsi que pour contrôler un ulcère gastrique.</p><p class="lab">Contre-indication relative</p><p>Si une perforation est suspectée, l’imagerie passe d’abord, car l’insufflation aggraverait la fuite.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-antigene-selles" data-title="Antigène fécal de Helicobacter pylori"><p class="lab">Principe</p><p>Ce test détecte par immunologie des antigènes bactériens dans les selles.</p><p class="lab">Performance</p><p>Sa sensibilité est de 93 à 95 % et sa spécificité de 96 à 98 % (SSI).</p><p class="lab">Conditions</p><p>Il faut arrêter les IPP 2 semaines et les antibiotiques 4 semaines avant, car ils réduisent la charge bactérienne ; il convient au contrôle de l’éradication.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-pcr-resistance" data-title="PCR de résistance"><p class="lab">Principe</p><p>La PCR amplifie l’ADN bactérien et recherche les mutations de résistance à la clarithromycine et à la lévofloxacine.</p><p class="lab">Usage</p><p>La SSI propose de l’enchaîner automatiquement à un antigène fécal positif quand un traitement est prévu.</p><p class="lab">Limite</p><p>Elle ne teste pas le métronidazole, et sa disponibilité reste limitée.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-eradication" data-title="Éradication de Helicobacter pylori"><p class="lab">Bénéfice</p><p>Il suffit de traiter 2 patients pour éviter une récidive d’ulcère duodénal et 3 pour l’ulcère gastrique ; de plus, l’éradication baisse le risque de cancer gastrique de 46 à 53 % dans les méta-analyses.</p><p class="lab">Règle</p><p>Le traitement est guidé par la résistance, et la guérison est toujours contrôlée.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-controle-endoscopique" data-title="Contrôle endoscopique de l’ulcère gastrique"><p class="lab">Délai</p><p>Le contrôle se fait 4 à 8 semaines après le début du traitement.</p><p class="lab">But</p><p>Il confirme la cicatrisation et permet de rebiopsier si elle est incomplète, afin d’exclure un cancer.</p><p class="lab">Ulcère duodénal</p><p>L’ulcère duodénal n’est pas contrôlé en routine, car les cancers duodénaux sont exceptionnels.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a> ; <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-trithérapie" data-title="Trithérapie ciblée"><p class="lab">Composition</p><p>La trithérapie associe un IPP à forte dose, l’amoxicilline et, selon la sensibilité, la clarithromycine, la lévofloxacine ou le métronidazole.</p><p class="lab">Avantages</p><p>Elle comporte six comprimés par jour en deux prises et donne moins d’effets indésirables que la quadrithérapie.</p><p class="lab">Condition</p><p>Elle exige un test de résistance préalable et l’absence d’allergie à la pénicilline.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-bqt" data-title="Quadrithérapie bismuthée"><p class="lab">Composition</p><p>Elle associe un IPP et Pylera®, qui contient le bismuth, la tétracycline et le métronidazole dans la même gélule.</p><p class="lab">Efficacité</p><p>Elle guérit 80 à 90 % des patients dans les essais, mais souvent moins en pratique, car le schéma est complexe.</p><p class="lab">Contraintes</p><p>Elle impose 14 comprimés par jour en quatre prises, provoque des effets indésirables chez 40 à 70 % des patients et a déjà connu des ruptures de stock.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-gastrinome" data-title="Syndrome de Zollinger-Ellison"><p class="lab">Mécanisme</p><p>Une tumeur neuroendocrine sécrète de la gastrine ; l’hypersécrétion acide provoque des ulcères multiples, distaux, récidivants, souvent avec diarrhée.</p><p class="lab">Indice</p><p>Des ulcères multiples, distaux ou réfractaires sans Helicobacter pylori ni AINS doivent faire évoquer ce syndrome.</p><p class="lab">Traitement acide</p><p>On débute l’ésoméprazole à 40 mg deux fois par jour, puis on adapte la dose (information professionnelle suisse).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-d-ipp" data-title="Inhibiteurs de la pompe à protons"><p class="lab">Mécanisme</p><p>Les IPP inhibent de façon irréversible la pompe H⁺/K⁺-ATPase ; leur effet est maximal s’ils sont pris avant le repas, car la pompe est alors activée.</p><p class="lab">Indications suisses (ésoméprazole)</p><p>L’ésoméprazole est autorisé pour l’éradication de Helicobacter pylori, l’ulcère gastrique sous AINS, la prévention sous AINS, le syndrome de Zollinger-Ellison et la prévention de la récidive hémorragique.</p><p class="lab">Précautions</p><p>Ils interagissent avec le clopidogrel et le méthotrexate à forte dose ; au long cours, ils exposent à l’hypomagnésémie, aux fractures et aux infections digestives.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-d-pylera" data-title="Pylera®"><p class="lab">Composition</p><p>Pylera® contient du sous-citrate de bismuth potassique, du métronidazole et du chlorhydrate de tétracycline.</p><p class="lab">Posologie suisse</p><p>L’information professionnelle prévoit 3 gélules 4 fois par jour pendant 10 jours, avec oméprazole 20 mg 2 fois par jour ; la SSI recommande cependant un IPP à 40 mg et jusqu’à 14 jours.</p><p class="lab">Contre-indications</p><p>Il est contre-indiqué pendant la grossesse et l’allaitement, chez l’enfant de moins de 12 ans, en cas d’insuffisance rénale ou hépatique et dans le syndrome de Cockayne.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-d-amox" data-title="Amoxicilline"><p class="lab">Place</p><p>L’amoxicilline est le pilier de la trithérapie, car la résistance reste rare (3 % dans les données suisses citées par la SSI).</p><p class="lab">Dose</p><p>Elle se donne à 1 g deux fois par jour pendant 14 jours.</p><p class="lab">Contre-indication</p><p>En cas d’allergie aux pénicillines, on choisit la quadrithérapie bismuthée.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-d-clari" data-title="Clarithromycine"><p class="lab">Place</p><p>On ne la donne que si la souche est sensible, car la résistance dépasse 15 %.</p><p class="lab">Dose</p><p>Elle se donne à 500 mg deux fois par jour pendant 14 jours.</p><p class="lab">Interactions</p><p>Elle inhibe puissamment le CYP3A4 et allonge le QT.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-d-levo" data-title="Lévofloxacine"><p class="lab">Place</p><p>On ne la donne que si la souche est sensible, car la résistance dépasse 15 %.</p><p class="lab">Dose</p><p>Elle se donne à 500 mg une fois par jour ou 250 mg deux fois par jour pendant 14 jours.</p><p class="lab">Sécurité</p><p>Swissmedic et l’EMA mettent en garde contre les tendinopathies, l’anévrisme aortique et la neuropathie des fluoroquinolones ; on les réserve donc aux indications justifiées.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-musculaire" data-title="Musculaire muqueuse"><p class="lab">Définition</p><p>La musculaire muqueuse est une fine couche de muscle lisse qui sépare la muqueuse de la sous-muqueuse.</p><p class="lab">Valeur</p><p>C’est la frontière histologique entre érosion (au-dessus) et ulcère (au-delà).</p><p class="lab">Conséquence</p><p>La sous-muqueuse contient les artères de calibre suffisant pour une hémorragie grave.</p></template>
<template data-pop="k25-hp" data-title="Helicobacter pylori"><p class="lab">Agent</p><p>C’est un bacille à Gram négatif, spiralé et microaérophile, qui colonise le mucus gastrique.</p><p class="lab">Effets</p><p>Il provoque toujours une gastrite chronique, puis parfois un ulcère gastrique ou duodénal, une atrophie, une métaplasie, un cancer gastrique ou un lymphome du MALT.</p><p class="lab">Conduite</p><p>On le recherche chez tout ulcéreux, on le traite selon la résistance et on contrôle la guérison (SSI 2026).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-ains" data-title="AINS non sélectifs"><p class="lab">Mécanisme</p><p>Les AINS inhibent les cyclo-oxygénases 1 et 2 et baissent ainsi les prostaglandines qui protègent la muqueuse.</p><p class="lab">Risque</p><p>Ils causent souvent des ulcères et des hémorragies, qui restent fréquemment silencieux jusqu’à la complication (S2k 2023, énoncé 7.1).</p><p class="lab">Prévention</p><p>IPP si un facteur de risque supplémentaire est présent (recommandation 7.5) ; IPP au long cours après une complication si l’AINS est poursuivi (7.8).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-coxib" data-title="Coxibs"><p class="lab">Définition</p><p>Les coxibs sont des AINS sélectifs de la cyclo-oxygénase 2, par exemple le célécoxib.</p><p class="lab">Avantage</p><p>Ils provoquent moins d’ulcères et d’hémorragies que les AINS non sélectifs, car ils épargnent la COX-1 de la muqueuse.</p><p class="lab">Prophylaxie</p><p>On ajoute un IPP si un facteur de risque supplémentaire existe, et toujours si une aspirine, un inhibiteur de P2Y12, un anticoagulant ou un ISRS est associé (S2k 2023, recommandation 7.6).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-isrs" data-title="ISRS et risque hémorragique"><p class="lab">Mécanisme</p><p>Les plaquettes ne captent plus la sérotonine ; l’agrégation diminue.</p><p class="lab">Prophylaxie</p><p>On donne un IPP en cas d’antécédent d’ulcère ou d’association à un AINS, à un coxib ou à un inhibiteur de P2Y12 ; avec un anticoagulant, il reste discutable (S2k 2023, recommandation 7.13).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-p2y12" data-title="Inhibiteurs de P2Y12"><p class="lab">Molécules</p><p>Ce sont le clopidogrel, le prasugrel et le ticagrélor.</p><p class="lab">Risque digestif</p><p>Ils augmentent le risque de complication ulcéreuse (S2k 2023, énoncé 7.4).</p><p class="lab">Après une hémorragie sous P2Y12 seul</p><p>Le patient reçoit un IPP au long cours ; un passage à l’aspirine peut être discuté si le cardiologue l’accepte (recommandation 7.11).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-gbs" data-title="Score de Glasgow-Blatchford"><p class="lab">Composantes</p><p>Le score combine l’urée, l’hémoglobine, la pression systolique, la fréquence cardiaque, le méléna, la syncope, l’hépatopathie et l’insuffisance cardiaque.</p><p class="lab">Seuil</p><p>Un score ≤ 1 signale un très faible risque et permet une prise en charge ambulatoire (ESGE 2021).</p><p class="lab">Renvoi</p><p>Le cours K92 — Hémorragies digestives le détaille.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k25-forrest" data-title="Classification de Forrest"><p class="lab">Stades</p><p>Le stade Ia correspond à un saignement en jet, Ib à un suintement, IIa à un vaisseau visible, IIb à un caillot adhérent, IIc à une tache pigmentée et III à un fond propre.</p><p class="lab">Conduite</p><p>Les stades Ia, Ib et IIa reçoivent une hémostase endoscopique, car ils resaignent souvent ; au stade IIb, on envisage de retirer le caillot ; les stades IIc et III n’en reçoivent pas (ESGE 2021).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2021_a_1369_5274.pdf" target="_blank" rel="noopener">Gralnek I. M. et al., ESGE, hémorragie digestive haute non variqueuse, mise à jour 2021, Endoscopy 2021;53:300-332</a>.</p></template>
<template data-pop="k25-scores-perforation" data-title="Scores de risque de l’ulcère perforé"><p class="lab">Boey</p><p>Le score de Boey compte trois items : comorbidité grave, choc à l’admission et délai de plus de 24 heures ; il est le plus utilisé, mais sa précision varie.</p><p class="lab">PULP et ASA</p><p>Les scores PULP et ASA prédisent la mortalité aussi bien l’un que l’autre et mieux que le score de Boey.</p><p class="lab">Meilleur facteur isolé</p><p>L’hypoalbuminémie est le meilleur facteur isolé (WSES 2020), car elle reflète la dénutrition et la gravité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-stenose" data-title="Sténose ulcéreuse"><p class="lab">Mécanisme</p><p>Un œdème inflammatoire, puis une fibrose cicatricielle rétrécissent la région pyloroduodénale.</p><p class="lab">Clinique</p><p>Le patient présente des vomissements alimentaires tardifs, un clapotage à jeun et un amaigrissement.</p><p class="lab">Démarche</p><p>On fait une endoscopie avec biopsies pour exclure un cancer, puis on traite la cause et on donne un IPP ; si la sténose persiste, on la dilate ou on opère.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAKHAYYAAP7psf3dp/3ZrP3Zlf3Rq/3Qnv3Rkf3PhP3HnvzHjfy9kP3GfPy/d/y6c/y0h/y0cvytePyndP2yXvyrXPymWvyhZf2gVfyaWfydR/yYRvyVRdLDlW26oJ2wil2zmVuulVisk++eWm+ih1OokFOii1KchUuokUqkjUmijEegikmeh0Cdh0qahUmWhUqYfkeVfD+Zg0CVfTiWgP2QSv2OQP2NN/2INv2GOf2ANv2CK/17KvaOSPeLNfaAMOqHOpWIW0GRfkKQdTmQeT2LczWKcTiDaS+Ndi+FayeIbyqAZiF+Y/10KvJ0LPxxHfBxHP1mHPFmGfdcE/VTDfRHB/IuBNdoG7plHjFuVRp0WhVsUxBjS9NODLhNDcUpBDtMLTsbCgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAKHAUAI/wC1ZNFCMAuWLAgHHlRoEAsWJQsdPlQC8WGSJEeOQKR4MaMSjEQyigx5BCQRkiWJmBx58sjJkzFCChlCZMiQIieFABHCc+ZJmiFfChHq02ZOIj2HJo3BMwZTnkiHDuFJ06ZNIFexTnUKBGtXIC++dr35YshXnl3D7tTp9IXbGC6+wljL1KlTIS3yqo2RFkjeFiz8AmHRomuJF0FeuHCh2AULpnlZsGAcQ4UKwpIxE3aclzGLw5P9vmABA+5oFqfB/u2qorDewmbFSo4MhETmrpLdIh7ygojqsCWCt3Cb+GZiwKvddo0R+IWKGKVFv7irM6tYwUNaKP1auEiSIleuDP/04uWL+S7oqVCZIkX9eilRpExx/16KlCpesnx3+bKrTrGFGUEEeFcgNVVULxURRBE4tSQSg959F+F3HR0RIRYXcfSREgaBl8RHH3J0UYhJTCQRRRIdlGJEEiVEkEACDfTijDTWaOONOBY0o0MIcYiFQC0a1NCJDxW5YYgOUZRRRyNihJFIHQ0F5UsvXYQgUUPlRF1SMj3V01NOIcVUVE196dRjY9q1pU4vaLfVY0J4KQQMMAgRxFfTCYHmc4OdBMRceO0UQ2FsCioZX76FpSd1hbV2l1+FsYDCU5Bmlp <template data-pop="k25-test-respiratoire" data-title="Test respiratoire à l’urée marquée"><p class="lab">Principe</p><p>L’uréase bactérienne scinde l’urée marquée au carbone 13 ; le CO₂ marqué est mesuré dans l’air expiré.</p><p class="lab">Performance</p><p>Sa sensibilité et sa spécificité sont de 90 à 95 % (SSI).</p><p class="lab">Statut en Suisse</p><p>La SSI 2026 ne le recommande pas en routine, car il exige un personnel formé et un laboratoire équipé et ne donne aucune information sur la résistance.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-culture" data-title="Culture de Helicobacter pylori"><p class="lab">Prélèvement</p><p>On cultive des biopsies gastriques prises pendant l’endoscopie.</p><p class="lab">Valeur</p><p>La culture est la référence de l’antibiogramme, y compris pour le métronidazole.</p><p class="lab">Limite</p><p>Sa sensibilité varie de 75 à 91 % selon l’expérience du laboratoire (SSI).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-serologie" data-title="Sérologie de Helicobacter pylori"><p class="lab">Principe</p><p>La sérologie recherche des anticorps IgG.</p><p class="lab">Limite</p><p>Elle ne distingue pas une infection active d’une infection guérie, car les anticorps persistent ; elle est donc inutile pour contrôler l’éradication.</p><p class="lab">Statut</p><p>La SSI 2026 ne la recommande pas.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
<template data-pop="k25-metronidazole" data-title="Métronidazole"><p class="lab">Place</p><p>Il fait partie de Pylera® ; en trithérapie, on ne l’utilise que si la souche est sensible.</p><p class="lab">Résistance</p><p>La résistance est élevée : 44 % dans les données suisses ANRESIS citées par la SSI.</p><p class="lab">Précautions</p><p>Il provoque un effet antabuse, donc le patient évite l’alcool jusqu’à 24 heures après la fin ; il potentialise aussi les antivitamines K (information professionnelle Pylera®).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-cellule-parietale" data-title="Cellule pariétale"><p class="lab">Siège</p><p>Elle siège dans les glandes du fundus et du corps gastrique.</p><p class="lab">Fonction</p><p>Elle sécrète l’acide chlorhydrique par la pompe H⁺/K⁺-ATPase et le facteur intrinsèque.</p><p class="lab">Régulation</p><p>L’histamine (récepteur H2), la gastrine et l’acétylcholine la stimulent, alors que la somatostatine la freine.</p></template>
<template data-pop="k25-gastrine" data-title="Gastrine"><p class="lab">Origine</p><p>Elle est produite par les cellules G de l’antre gastrique.</p><p class="lab">Effet</p><p>Elle stimule la sécrétion acide directement et par la libération d’histamine.</p><p class="lab">Pathologie</p><p>Elle est élevée dans la gastrite antrale à Helicobacter pylori et, très fortement, dans le gastrinome.</p></template>
<template data-pop="k25-stress" data-title="Ulcères de stress"><p class="lab">Mécanisme</p><p>La muqueuse est mal perfusée au cours des maladies graves ; elle perd donc sa défense.</p><p class="lab">Facteurs indépendants</p><p>Les troubles de la coagulation et une ventilation mécanique de plus de 48 heures sont les facteurs de risque indépendants.</p><p class="lab">Prévention</p><p>Le patient de soins intensifs à haut risque reçoit un IPP (S2k 2023, recommandation 7.18).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-001" target="_blank" rel="noopener">Fischbach W. et al., S2k-Leitlinie Helicobacter pylori und gastroduodenale Ulkuskrankheit (DGVS), Z Gastroenterol 2023;61:544-606</a>.</p></template>
<template data-pop="k25-tdm" data-title="Tomodensitométrie de l’ulcère perforé"><p class="lab">Signes</p><p>La tomodensitométrie montre un pneumopéritoine, du liquide intrapéritonéal, un épaississement pariétal, une infiltration de la graisse ou une fuite de contraste hydrosoluble.</p><p class="lab">Valeur</p><p>Elle est plus sensible que la radiographie, situe la perforation et écarte d’autres causes.</p><p class="lab">Limite</p><p>Jusqu’à 12 % des perforations ont un examen normal (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-avk" data-title="Antivitamines K et éradication"><p class="lab">Interaction</p><p>Le métronidazole et l’oméprazole potentialisent l’acénocoumarol et la phenprocoumone.</p><p class="lab">Conduite</p><p>Contrôler le temps de prothrombine pendant le traitement et adapter la dose (information professionnelle Pylera®).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pylera®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-nom" data-title="Traitement non opératoire de l’ulcère perforé"><p class="lab">Conditions</p><p>Le patient doit être stable, sans péritonite ni sepsis, et la perforation doit être colmatée sur l’étude au contraste hydrosoluble.</p><p class="lab">Risque</p><p>Environ 28 % des patients échouent à 12 heures dans l’essai randomisé cité par la WSES, et la réponse est moins bonne après 70 ans.</p><p class="lab">Statut</p><p>La WSES 2020 ne le recommande pas en routine.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6947898/" target="_blank" rel="noopener">Tarasconi A. et al., WSES, ulcère peptique perforé et hémorragique, World J Emerg Surg 2020;15:3</a>.</p></template>
<template data-pop="k25-ipp-long-cours" data-title="IPP au long cours : effets indésirables"><p class="lab">Hypomagnésémie</p><p>Elle survient après au moins 3 mois, le plus souvent après un an, et peut entraîner une hypocalcémie et une hypokaliémie.</p><p class="lab">Fractures</p><p>Le risque augmente modérément (hanche, poignet, rachis) après plus d’un an à dose élevée.</p><p class="lab">Infections</p><p>Les infections digestives sont un peu plus fréquentes, car l’acide ne détruit plus les germes ingérés.</p><p class="lab">Conduite</p><p>On réévalue l’indication et l’on arrête l’IPP si elle n’existe plus.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k25-anresis" data-title="ANRESIS"><p class="lab">Définition</p><p>ANRESIS est le centre suisse de surveillance de la résistance aux antibiotiques.</p><p class="lab">Données Helicobacter pylori</p><p>La résistance atteint 28 % pour la clarithromycine, 18 % pour la lévofloxacine, 44 % pour le métronidazole, 3 % pour l’amoxicilline et 4 % pour la tétracycline, surtout après un échec thérapeutique (SSI 2026).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3025" target="_blank" rel="noopener">Société suisse d’infectiologie, directives Helicobacter pylori, version longue, mise à jour du 29.06.2026</a>.</p></template>
