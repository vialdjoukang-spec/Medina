<template id="ch-G91"><div class="chap"><div class="chap-head"><div class="code">G 91 · Neurologie · Hydrocéphalie · CIM-10-GM 2024 · renvois : Q03, P91.7, P37.1, I60</div><h1>Hydrocéphalie</h1><span class="status">Cycle Betta 40 · hydrocéphalie de l’enfant et du sujet âgé · sources du dossier de recherche au 15.10.2026 · audit différé — revue IA, distincte d’une validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’hydrocéphalie</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g91-0">Question clinique</a></li><li><a href="#g91-1">Définition, codage et classifications</a></li><li><a href="#g91-2">Épidémiologie</a></li><li><a href="#g91-3">Physiopathologie</a></li><li><a href="#g91-4">Causes et facteurs de risque</a></li><li><a href="#g91-5">Anamnèse et examen clinique</a></li><li><a href="#g91-6">Diagnostic et diagnostic différentiel</a></li><li><a href="#g91-7">Urgences et complications</a></li><li><a href="#g91-8">Prise en charge de l’iNPH du sujet âgé</a></li><li><a href="#g91-9">Prise en charge de l’hydrocéphalie de l’enfant</a></li><li><a href="#g91-10">Infection, hyperdrainage et surveillance de la dérivation</a></li><li><a href="#g91-11">Suivi, pronostic et prévention</a></li><li><a href="#g91-12">Situations particulières et cas récapitulatif</a></li><li><a href="#g91-13">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g91-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Deux patients, deux urgences de nature opposée, se cachent derrière le même code. Dans cette <b>vignette fictive</b>, un homme de 76 ans marche depuis dix-huit mois à petits pas, les pieds en dehors, « collé au sol » au démarrage. Il a des envies pressantes avec des fuites et il répond plus lentement. Son scanner montre des ventricules dilatés ; l’index d’Evans, valeur pédagogique, est de 0,36. Il s’agit d’une <button class="w" data-k="g91-inph">hydrocéphalie à pression normale idiopathique (concept, définition et limites)</button> possible, c’est-à-dire une cause traitable de troubles de la marche et de déclin cognitif.</p><p>Dans la seconde <b>vignette fictive</b>, un nourrisson de trois mois voit son périmètre crânien s’accélérer ; sa fontanelle est bombante et son regard monte difficilement. Ici, le liquide cérébrospinal (LCS) ne s’écoule plus et la pression intracrânienne monte : c’est une urgence neurochirurgicale.</p><p>Ce chapitre apprend à reconnaître ces deux visages, à les classer, à confirmer le diagnostic par l’imagerie et le test de soustraction de LCS, puis à choisir entre dérivation et <button class="w" data-k="g91-etv">ventriculocisternostomie (technique, indications et limites)</button>. Il nomme aussi ce que les sources lues ne permettent pas d’affirmer : aucune recommandation suisse ni européenne spécifique à l’hydrocéphalie n’a pu être lue.</p><ol><li>Définir l’hydrocéphalie et la situer dans la CIM-10-GM (G91, Q03, P91.7).</li><li>Distinguer les formes communicante et obstructive, aiguë et chronique, de l’enfant et du sujet âgé.</li><li>Poser un diagnostic d’hydrocéphalie à pression normale en trois niveaux de certitude.</li><li>Reconnaître l’urgence : hypertension intracrânienne, hémorragie sous-arachnoïdienne, dysfonction de dérivation.</li><li>Choisir et surveiller le traitement, ses complications et ses limites.</li></ol><div class="key"><b>À retenir.</b> L’hydrocéphalie n’est pas un diagnostic unique : c’est un trouble de l’écoulement du LCS, qui prend une forme aiguë chez l’enfant ou après une hémorragie, et une forme lente chez le sujet âgé. La conduite diffère entièrement.</div>
</section>
<section class="ilot" id="g91-1"><h2><span class="n">1</span>Définition, codage et classifications</h2>
<p>L’hydrocéphalie est classiquement définie comme une <b>dilatation active et progressive des ventricules</b> due à un écoulement insuffisant du LCS entre ses sites de production et de résorption. Le LCS est sécrété en continu ; si son évacuation est freinée, il s’accumule et les cavités qui le contiennent s’élargissent. Cette définition est celle de la revue pédiatrique de Kahle et collaborateurs, parue dans Nature Reviews Disease Primers en 2024 (<button class="w" data-k="g91-def">définition et forme communicante ou non communicante</button>).</p><p>On distingue deux grandes formes. Dans la forme <b>communicante</b>, aucun obstacle n’interrompt la circulation entre les ventricules et l’espace sous-arachnoïdien. Dans la forme <b>non communicante</b>, dite aussi <b>obstructive</b>, un obstacle partiel ou complet, intra- ou extraventriculaire, bloque le flux. Cette distinction fonde la prudence en urgence : un geste lombaire n’a pas la même sécurité dans les deux formes (<button class="w" data-k="g91-hsa">hydrocéphalie aiguë après hémorragie sous-arachnoïdienne (drainage et risques)</button>).</p><p>La CIM-10-GM 2024 de l’Institut fédéral allemand des médicaments (BfArM) range l’hydrocéphalie sous le code <b>G91</b>. Les sous-codes se lisent ainsi (<button class="w" data-k="g91-cim">codage G91, inclusions et exclusions</button>).</p><table class="t"><thead><tr><th>Code</th><th>Libellé</th><th>Lecture clinique</th></tr></thead><tbody><tr><td>G91.0</td><td>Hydrocéphalie communicante</td><td>Écoulement sans obstacle ventriculaire</td></tr><tr><td>G91.1</td><td>Hydrocéphalie obstructive</td><td>Obstacle sur la voie du LCS</td></tr><tr><td>G91.20</td><td>À pression normale, idiopathique</td><td>Concept iNPH, sujet âgé</td></tr><tr><td>G91.21</td><td>À pression normale, secondaire</td><td>Après hémorragie sous-arachnoïdienne ou méningite</td></tr><tr><td>G91.29</td><td>À pression normale, sans précision</td><td>Forme non précisée</td></tr><tr><td>G91.3</td><td>Post-traumatique, sans précision</td><td>Données adultes non lues dans le dossier</td></tr><tr><td>G91.8 · G91.9</td><td>Autres formes · sans précision</td><td>Résiduel</td></tr></tbody></table><p>Le tableau montre que le code ne dit rien de la gravité : G91.0 et G91.1 qualifient le mécanisme, G91.2- le tableau lent à pression normale. Les <b>exclusions</b> comptent autant que les inclusions : l’hydrocéphalie congénitale relève de Q03, l’hydrocéphalie acquise du nouveau-né de P91.7 et celle de la toxoplasmose congénitale de P37.1. La rubrique G91 inclut l’hydrocéphalie acquise.</p><p>Pour la forme du sujet âgé, la ligne directrice japonaise de 2021 (troisième édition) propose une <button class="w" data-k="g91-class">classification des hydrocéphalies à pression normale (idiopathique, secondaire, congénitale)</button> : iNPH, NPH secondaire après hémorragie sous-arachnoïdienne ou méningite, et forme congénitale ou développementale, dont la ventriculomégalie longtemps évolutive de l’adulte (LOVA). Cette ligne directrice n’est ni suisse ni européenne ; elle est la seule ligne directrice complète sur l’iNPH lue ici. Pour l’adulte en général, une revue systématique avec consensus Delphi a trouvé 48 termes dans 33 études et les a regroupés en sept entités (<button class="w" data-k="g91-chia">hydrocéphalie chronique de l’adulte (CHiA) : classification proposée</button>).</p><div class="trap"><span class="k">Piège</span> « À pression normale » renvoie à une pression de LCS mesurée à la ponction lombaire ≤ 200 mmH2O, exigée par les critères japonais d’une iNPH probable. Cette valeur ne suffit pas : elle s’associe à la clinique et à l’imagerie.</div><div class="key"><b>À retenir.</b> Communicante ou obstructive décide de la sécurité d’un geste lombaire ; G91.2- désigne la forme à pression normale ; Q03 et P91.7 sont exclus de G91.</div>
</section>
<section class="ilot" id="g91-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Aucune donnée suisse d’incidence de l’hydrocéphalie n’a été trouvée dans les sources lues ; c’est une lacune à nommer. Les chiffres disponibles viennent de la ligne directrice japonaise, d’une méta-analyse mondiale et d’une revue pédiatrique, et ils dépendent fortement des méthodes de mesure (<button class="w" data-k="g91-epi">épidémiologie de l’iNPH : méthodes et fourchettes</button>).</p><table class="t"><thead><tr><th>Population</th><th>Chiffre</th><th>Lecture</th></tr></thead><tbody><tr><td>iNPH, Suède, scanner</td><td>3,7 % au total ; 8,9 % et 5,9 % au-delà de 80 ans (deux études)</td><td>Imagerie seule : surestime la maladie symptomatique</td></tr><tr><td>iNPH, critères japonais</td><td>1,5 % ; moyenne pondérée japonaise 1,6 %</td><td>Critères cliniques et radiologiques</td></tr><tr><td>Méta-analyse mondiale 2018</td><td>175 pour 100 000 ; 400 pour 100 000 à ≥ 80 ans</td><td>Japon 660 ; hors Japon 53 pour 100 000</td></tr><tr><td>Données hospitalières</td><td>2–10 pour 100 000 ; 30–60 pour 100 000 vers 65–70 ans et plus</td><td>Cas diagnostiqués, donc sous-estimation</td></tr><tr><td>Hémorragie sous-arachnoïdienne anévrismale</td><td>≈ 25 % développent une hydrocéphalie</td><td>Létalité ≈ 40 % de la maladie</td></tr></tbody></table><p>Le tableau montre un écart d’un facteur supérieur à dix entre l’imagerie en population et les cas diagnostiqués. Il signale ainsi une maladie fréquente en radiologie et probablement sous-reconnue en clinique, sans que les sources permettent de chiffrer cette sous-reconnaissance. Les mêmes sources décrivent aussi l’<b>AVIM</b>, une ventriculomégalie asymptomatique d’aspect IRM d’iNPH, qui évolue vers l’iNPH à 6–12 % par an dans une série (4 sur 8 en 4–8 ans) et à environ 17 % par an dans une autre (27 sur 52 en 3 ans) (<button class="w" data-k="g91-avim">AVIM : ventriculomégalie asymptomatique</button>).</p><p>Chez l’enfant, la revue de 2024 estime environ 400 000 nouveaux cas par an dans le monde, plus de 80 % dans les pays à revenu faible ou intermédiaire (<button class="w" data-k="g91-epiped">épidémiologie pédiatrique : causes et chiffres</button>). La forme congénitale représente environ la moitié ; jusqu’à 85 % des myéloméningocèles développent une hydrocéphalie ; l’hydrocéphalie post-hémorragique dépasse 6000 cas par an dans les pays à haut revenu ; elle suit 0,7–3,7 % des traumatismes crâniens ; plus de la moitié des enfants avec tumeur cérébrale en développent une.</p><div class="key"><b>À retenir.</b> L’hémorragie sous-arachnoïdienne produit une hydrocéphalie chez environ un patient sur quatre ; l’iNPH est fréquente en imagerie et rare en clinique diagnostiquée.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">Recommandation ESO, EANS et ESMINT 2026 sur l’hémorragie sous-arachnoïdienne anévrismale</a>.</p>
</section>
<section class="ilot" id="g91-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>État normal.</b> Le LCS est sécrété en continu par l’épithélium des plexus choroïdes, présents dans les quatre ventricules ; ce tissu est la source dominante, alors que l’épendyme ne sécrète pas activement. Chez l’animal, 30 à 40 % du LCS se forme en amont de l’aqueduc. Le dossier ne fournit aucun débit de production ni volume total de LCS chez l’humain, qu’il serait donc faux de chiffrer (<button class="w" data-k="g91-lcs">production et circulation du LCS (données animales)</button>). Le liquide s’évacue par des voies lymphatiques le long des gaines des nerfs crâniens et spinaux, par la lame criblée et le nerf optique, ainsi que par des granulations arachnoïdiennes qui mûrissent pendant la petite enfance.</p><figure><svg viewBox="0 0 640 250" role="img" aria-label="Figure 1 — Circuit du liquide cérébrospinal et deux sites d’obstacle"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="20" y="90" width="110" height="60" rx="10"/><rect x="190" y="90" width="110" height="60" rx="10"/><rect x="360" y="90" width="110" height="60" rx="10"/><rect x="520" y="90" width="100" height="60" rx="10"/><path d="M130 120h60M300 120h60M470 120h50"/><path d="M245 90V40h330v50" stroke-dasharray="6 4"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="75" y="115">Plexus</text><text x="75" y="133">choroïdes</text><text x="245" y="115">Ventricules</text><text x="245" y="133">latéraux, 3e</text><text x="415" y="115">Aqueduc,</text><text x="415" y="133">4e ventricule</text><text x="570" y="115">Espace sous-</text><text x="570" y="133">arachnoïdien</text><text x="330" y="32" font-size="12">Résorption (voies lymphatiques, granulations, nerfs)</text><text x="330" y="190" font-size="14" font-weight="bold">A : obstacle au passage de l’aqueduc ou du 4e ventricule (obstructive)</text><text x="330" y="212" font-size="14" font-weight="bold">B : défaut de résorption sans obstacle (communicante)</text></g><g fill="currentColor" font-size="22" font-weight="bold" text-anchor="middle"><text x="415" y="82">A</text><text x="570" y="82">B</text></g></svg><figcaption>Figure 1 — Schéma didactique, non à l’échelle. Il situe la production (plexus), le trajet ventriculaire, l’espace sous-arachnoïdien et la résorption, d’après la revue pédiatrique de Nature Reviews Disease Primers 2024. A et B marquent deux sites de blocage ; ce dessin ne représente pas un patient.</figcaption></figure><p><b>Perturbation.</b> Si un obstacle bloque le trajet entre les ventricules et l’espace sous-arachnoïdien (A), le LCS déjà sécrété s’accumule en amont : c’est la forme obstructive. Si le trajet est libre mais que l’évacuation est insuffisante (B), la forme est communicante. Le modèle moderne ajoute que l’obstruction du flux ne suffit pas à expliquer la maladie : les pulsations cérébrales, la compliance cérébrale et les transports d’eau y participent, et les causes acquises touchent l’écoulement ventriculaire, la fonction de l’espace sous-arachnoïdien ou la compliance veineuse (<button class="w" data-k="g91-modele">modèle moderne : pulsations, compliance, transport d’eau</button>).</p><p><b>Manifestations.</b> Chez le nourrisson, le crâne peut céder par ses sutures, ce qui explique l’accélération du périmètre crânien. Chez l’enfant plus âgé, la boîte crânienne est rigide, et la pression intracrânienne se manifeste par céphalées, vomissements et œdème papillaire. Chez le sujet âgé, l’iNPH est conçue comme un trouble de la résorption, sans maladie antérieure qui l’explique ; le concept est utile, mais la réponse à la dérivation n’est mesurable qu’après chirurgie.</p><p>Une synucléinopathie concomitante se trouve chez 14 à 33 % des iNPH selon la méthode, sans valeur prédictive négative démontrée de la réponse à la dérivation (<button class="w" data-k="g91-synuc">synucléinopathie associée à l’iNPH</button>).</p><div class="trap"><span class="k">Piège</span> Dire que « le liquide ne passe plus » décrit la forme obstructive, pas toute l’hydrocéphalie. Dans l’iNPH, le blocage n’est pas visible ; la dilatation ventriculaire est le témoin d’un trouble de résorption, non sa démonstration.</div><div class="key"><b>À retenir.</b> Normal : production continue, évacuation par plusieurs voies. Pathologique : accumulation par obstacle (A) ou par défaut de résorption (B). Manifestation : crâne qui s’élargit chez le nourrisson, pression et triade lente chez l’adulte.</div>
</section>
<section class="ilot" id="g91-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se classent par âge, parce que le mécanisme et l’urgence changent avec la maturité du crâne et du système de résorption.</p><table class="t"><thead><tr><th>Âge</th><th>Cause</th><th>Mécanisme ou remarque</th></tr></thead><tbody><tr><td>Nourrisson, enfant</td><td>Congénitale : sténose de l’aqueduc, myéloméningocèle avec malformation de Chiari II, Dandy-Walker, forme liée à l’X par mutation de L1CAM</td><td>Obstacle ou malformation de la voie du LCS</td></tr><tr><td>Nourrisson, enfant</td><td>Post-hémorragique du prématuré (hémorragie intraventriculaire de grade III ou IV, poids < 1500 g)</td><td>Hémorragie qui bloque les voies du LCS</td></tr><tr><td>Nourrisson, enfant</td><td>Post-infectieuse, tumorale (fosse postérieure, 4e ventricule), post-traumatique</td><td>Blocage et dérégulation inflammatoire de la sécrétion et de la clairance</td></tr><tr><td>Adulte, tout âge</td><td>Hémorragie sous-arachnoïdienne, méningite</td><td>Hydrocéphalie secondaire</td></tr><tr><td>Sujet âgé</td><td>iNPH, sans cause antérieure identifiée</td><td>Trouble de la résorption</td></tr></tbody></table><p>Le tableau relie chaque cause à un site de blocage : les malformations et les tumeurs de la fosse postérieure obstruent l’aqueduc ou le 4e ventricule ; l’hémorragie et l’infection encombrent les voies en aval. La revue pédiatrique précise que l’hydrocéphalie post-infectieuse atteint jusqu’à 85 % des méningites tuberculeuses de l’enfant. Les anomalies du tube neural touchent moins d’un nouveau-né sur 1000 après la supplémentation en folates.</p><p>Chez l’adulte, la recherche d’une cause secondaire précède le diagnostic d’iNPH : les critères japonais exigent l’absence de cause évidente de dilatation ventriculaire (hémorragie sous-arachnoïdienne, méningite, traumatisme, hydrocéphalie congénitale, sténose de l’aqueduc). Les facteurs de risque de l’iNPH ne sont pas établis par les sources lues.</p><div class="trap"><span class="k">Piège</span> Une sténose de l’aqueduc découverte chez l’adulte oriente vers une ventriculomégalie longtemps évolutive (LOVA), en général non communicante, et non vers une iNPH.</div><button class="pareto-btn ui" data-k="pareto-g91-bases">▲ Loi de Pareto — Définition, épidémiologie, mécanismes, causes</button><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G90–G99 (BfArM)</a>.</p>
</section>
<section class="ilot" id="g91-5"><h2><span class="n">5</span>Anamnèse et examen clinique</h2>
<p>L’anamnèse décide de la voie à suivre : l’âge sépare l’urgence pédiatrique du tableau lent du sujet âgé.</p><div class="two"><div class="card"><h4>Nourrisson</h4><p>Accélération du périmètre crânien, fontanelle bombante, sutures disjointes, parésie du regard vers le haut (signe du coucher de soleil), œdème papillaire, vomissements, irritabilité ; bradycardie ou apnées sans autre cause (<button class="w" data-k="g91-bebe">signes du nourrisson : pourquoi le crâne s’agrandit</button>).</p></div><div class="card"><h4>Enfant plus âgé</h4><p>Céphalées, vomissements, œdème papillaire, parésie du regard vers le haut, paralysie du VI : la boîte crânienne rigide ne cède plus, la pression monte et déclenche ces signes (<button class="w" data-k="g91-htic">hypertension intracrânienne de l’enfant</button>).</p></div></div><p>Chez le sujet âgé, la <b>triade de l’iNPH</b> est recherchée composante par composante (<button class="w" data-k="g91-triade">triade de l’iNPH : fréquences et sources</button>).</p><table class="t"><thead><tr><th>Composante</th><th>Fréquence dans l’iNPH</th><th>Particularités</th></tr></thead><tbody><tr><td>Trouble de la marche</td><td>94–100 %</td><td>Petits pas, marche « magnétique », élargissement du polygone, freezing, pieds en dehors</td></tr><tr><td>Trouble cognitif</td><td>78–98 %</td><td>Profil frontal : ralentissement, attention, mémoire de travail</td></tr><tr><td>Trouble urinaire</td><td>60–92 %</td><td>Pollakiurie et impériosité 90,9 %, incontinence 74,5 %</td></tr><tr><td>Triade complète</td><td>≈ 60 % (12,1 % dans une enquête japonaise de 1524 patients)</td><td>Une triade complète n’est donc pas nécessaire</td></tr></tbody></table><p>Le tableau montre que la marche est atteinte presque toujours, la cognition et la vessie moins souvent : un patient sans incontinence ou sans déclin franc reste compatible avec une iNPH. À Lausanne (CHUV), sur 86 patients d’âge moyen 76 ans, la plainte de marche atteignait 94,2 %, la plainte cognitive 75,6 % et la plainte urinaire 60,5 %.</p><div class="two"><div class="card"><h4>Marche</h4><p>Petits pas, démarrage hésitant, freezing, grande variabilité de la longueur du pas. Contrairement à la maladie de Parkinson, les indices externes aident peu (<button class="w" data-k="g91-marche">marche de l’iNPH : technique d’examen</button>).</p></div><div class="card"><h4>Cognition et vessie</h4><p>Ralentissement psychomoteur, atteinte attentionnelle et de la mémoire de travail, rappel libre altéré avec reconnaissance relativement préservée ; hyperactivité détrusorienne d’environ 70 % (<button class="w" data-k="g91-cogn">cognition de l’iNPH et différence avec Alzheimer</button>).</p></div></div><p>Les <b>signes frontaux</b> orientent : réflexe de museau 84 %, glabellaire 77 %, paratonie 65 %, palmo-mentonnier 61 % dans une série de 26 patients (<button class="w" data-k="g91-front">signes frontaux : technique et valeur</button>). Une méta-analyse retrouve apathie 69,2 %, dépression 30,1 %, agitation 22,6 % et anxiété 21,9 % (<button class="w" data-k="g91-neuropsy">symptômes neuropsychiatriques de l’iNPH</button>).</p><p><b>Forme typique et formes atypiques.</b> La forme typique associe la triade chez un sujet âgé. Les formes atypiques sont l’atteinte isolée de la marche, la ventriculomégalie asymptomatique (AVIM) et le tableau de l’enfant, où la triade n’existe pas.</p><div class="trap"><span class="k">Piège</span> Un patient âgé avec chutes et ralentissement n’est pas automatiquement « dément » ni « parkinsonien » : la marche est atteinte presque toujours dans l’iNPH, et l’hydrocéphalie peut être traitée.</div><div class="key"><b>À retenir.</b> Marche, miction, mémoire : la triade (<button class="w" data-k="g91-mnemo">aide mnémotechnique de la triade</button>). Elle n’est complète que chez environ 60 % des iNPH.</div><button class="pareto-btn ui" data-k="pareto-g91-clinique">▲ Loi de Pareto — Anamnèse et examen</button><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.1159/000553392" target="_blank" rel="noopener">Protocole interdisciplinaire de Lausanne (CHUV), Neurodegener Dis 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a> ; <a href="https://doi.org/10.1212/CPJ.0000000000200586" target="_blank" rel="noopener">Symptômes neuropsychiatriques de l’iNPH, Neurol Clin Pract 2026 (résumé)</a>.</p>
