<template data-pop="g91-acetazol" data-title="Acétazolamide (Diamox®) : fiche rapide">
<div class="lab">Mécanisme</div><p>Inhibiteur de l’anhydrase carbonique ; réduit la sécrétion de LCS chez l’animal.</p><div class="lab">Indications suisses</div><p>Incluent les « œdèmes cérébraux » ; l’hydrocéphalie n’est pas citée.</p><div class="lab">Limite</div><p>Efficacité limitée dans l’hypertension intracrânienne idiopathique ; sans effet sur l’hydrocéphalie post-hémorragique du prématuré.</p><p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Diamox® (Swissmedic, juillet 2026) et Swisspeddose</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8941821/" target="_blank" rel="noopener">Production de LCS par les plexus choroïdes (revue de 2022)</a>.</p></template>
<template data-pop="g91-macetazol" data-title="Acétazolamide : monographie">
<div class="lab">Mécanisme et preuves</div><p>L’anhydrase carbonique intervient dans la sécrétion de LCS ; l’acétazolamide la réduit chez l’animal. Aucun essai clinique d’hydrocéphalie n’a été lu.</p><div class="lab">Posologie</div><p>Enfant 1 mois–18 ans : 8–10 mg/kg/dose, 3 fois par jour, per os, maximum 100 mg/kg/jour, hors AMM (Swisspeddose).</p><div class="lab">Effets indésirables</div><p>Acidose métabolique, hypokaliémie, lithiase, paresthésies, somnolence ; PEAG ; œdème pulmonaire non cardiogénique.</p><div class="lab">Contre-indications et interactions</div><p>Hyponatrémie ou hypokaliémie, atteinte rénale ou hépatique grave (cirrhose), insuffisance surrénalienne, acidose hyperchlorémique, allergie aux sulfamides ; acide acétylsalicylique à haute dose ; grossesse à éviter.</p><div class="lab">Surveillance</div><p>Dérivée des effets listés : ionogramme et équilibre acido-basique. La fréquence n’est pas précisée dans le passage lu.</p><p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Diamox® (Swissmedic, juillet 2026) et Swisspeddose</a>.</p></template>
<template data-pop="g91-mcath" data-title="Cathéter imprégné d’antibiotiques">
<div class="lab">Preuve</div><p>BASICS : infection 6,0 % (standard), 2,2 % (rifampicine et clindamycine, HR 0,38), 5,9 % (argent). Échec toutes causes 25 % sans différence.</p><div class="lab">Limite</div><p>Essai britannique, résumé seul. L’infection de dérivation chez l’enfant des pays à haut revenu est de 3 à 11 %.</p><p class="src">Références : <a href="https://doi.org/10.3310/hta24170" target="_blank" rel="noopener">Essai BASICS, Health Technol Assess 2020 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-mtranex" data-title="Acide tranexamique et hydrocéphalie">
<div class="lab">Preuve</div><p>Dans l’essai ULTRA, rapporté par la recommandation européenne, l’acide tranexamique n’augmente pas significativement l’hydrocéphalie (OR 1,23 ; IC 0,93–1,63).</p><div class="lab">Limite</div><p>L’indication de l’acide tranexamique dans l’hémorragie sous-arachnoïdienne n’est pas développée ici.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">Recommandation ESO, EANS et ESMINT 2026 sur l’hémorragie sous-arachnoïdienne anévrismale</a>.</p></template>
<template data-pop="g91-echelles" data-title="Échelles et tests neuropsychologiques">
<div class="lab">Contenu</div><p>iNPHGS : marche, démence et incontinence, cotées de 0 à 4 chacune. MMSE, FAB et codes/symboles du WAIS-III complètent l’évaluation. Dans l’étude européenne (142 iNPH, 108 témoins), RAVLT, Grooved Pegboard et Stroop discriminent (AUC 0,86–0,95).</p><div class="lab">Limite</div><p>Résumés seuls ; les seuils de normalité ne figurent pas dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.1016/j.clineuro.2011.09.014" target="_blank" rel="noopener">Neuropsychologie de l’Eu-iNPH, Clin Neurol Neurosurg 2012 (résumé)</a>.</p></template>
<template data-pop="g91-biomarq" data-title="Biomarqueurs du LCS">
<div class="lab">Contenu</div><p>Aβ42 abaissé comme dans la maladie d’Alzheimer ; p-tau et t-tau plus bas que dans l’Alzheimer.</p><div class="lab">Limite</div><p>Aucune valeur de référence chiffrée n’a été lue.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-mnemo" data-title="Mnémotechnique de la triade : marche, miction, mémoire">
<div class="lab">Aide pédagogique</div><p>« Marche, miction, mémoire » rappelle les trois composantes de la triade de l’iNPH.</p><div class="lab">Statut</div><p>Aide pédagogique, non critère officiel : la triade n’est ni nécessaire ni suffisante au diagnostic. Les critères officiels sont ceux de la ligne directrice japonaise.</p></template>
<template data-pop="pareto-g91-bases" data-title="Pareto — Définition, mécanismes et causes">
<p class="ratio" data-cover="g91-0,g91-1,g91-2,g91-3,g91-4"></p><ul><li>L’hydrocéphalie est une dilatation ventriculaire par défaut d’écoulement du LCS ; elle est communicante ou obstructive.</li><li>G91 exclut Q03, P91.7 et P37.1.</li><li>L’iNPH touche surtout les sujets âgés ; l’hémorragie sous-arachnoïdienne produit une hydrocéphalie dans environ 25 % des cas.</li><li>Aucune donnée suisse d’incidence n’a été lue.</li></ul></template>
<template data-pop="pareto-g91-clinique" data-title="Pareto — Anamnèse, examen et diagnostic">
<p class="ratio" data-cover="g91-5,g91-6"></p><ul><li>Nourrisson : périmètre crânien, fontanelle, regard ; sujet âgé : triade marche, vessie, cognition (complète dans environ 60 % des cas).</li><li>Critères japonais : possible, probable, certaine ; la certitude est post-opératoire.</li><li>Index d’Evans > 0,3 ; angle calleux < 90° ; pression ≤ 200 mmH2O.</li><li>Diagnostics différentiels : Alzheimer, synucléinopathies, maladie vasculaire.</li></ul></template>
<template data-pop="pareto-g91-pec" data-title="Pareto — Urgences, prise en charge et complications">
<p class="ratio" data-cover="g91-7,g91-8,g91-9,g91-10"></p><ul><li>Urgence : hémorragie sous-arachnoïdienne avec baisse de vigilance, hypertension intracrânienne de l’enfant, dérivation défaillante.</li><li>Drain ventriculaire externe en forme obstructive ; pas de geste lombaire.</li><li>Dérivation ventriculo-péritonéale programmable : PENS +0,21 m/s à 3 mois ; hématome sous-dural 12 %.</li><li>Cathéter imprégné d’antibiotiques : infection 2,2 % contre 6,0 %.</li></ul></template>
<template data-pop="pareto-g91-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g91-11,g91-12"></p><ul><li>Le pronostic de l’iNPH dépend des comorbidités (Kiefer ≤ 3 : 93 % améliorés à 2 ans).</li><li>Chez l’enfant, mortalité liée à la dérivation 8 % à 20–40 ans ; bilan neurocognitif rare.</li><li>Lacunes : histoire naturelle de l’iNPH non opérée, hydrocéphalie post-traumatique de l’adulte.</li></ul></template>
<template data-pop="pareto-g91-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g91-e-1,g91-e-2,g91-e-3,g91-e-4,g91-e-5"></p><ul><li>Gold standard de l’iNPH : réponse objective à la dérivation.</li><li>Tap test 30–50 mL ; sensibilité 58 %, spécificité 75 % ; réponse négative n’exclut pas.</li><li>DESH : VPP 77 %, VPN 25 %.</li><li>Double tâche : 25,7 % de répondeurs supplémentaires à Bâle.</li></ul></template>
<template data-pop="pareto-g91-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g91-s-anat-cours"></p><ul><li>Un obstacle à l’aqueduc ou au 4e ventricule donne une forme obstructive.</li><li>La résorption passe par les voies lymphatiques, la lame criblée et les granulations.</li></ul></template>
<template data-pop="pareto-g91-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g91-s-histo-cours"></p><ul><li>L’épithélium des plexus choroïdes sécrète le LCS ; l’épendyme non.</li><li>Les granulations mûrissent pendant la petite enfance.</li></ul></template>
<template data-pop="pareto-g91-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g91-s-physio-cours"></p><ul><li>Production continue : tout frein à l’évacuation provoque une accumulation.</li><li>Pulsations, compliance et transport d’eau participent à la maladie.</li></ul></template>
<template data-pop="pareto-g91-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g91-s-bioch-cours"></p><ul><li>Na+/K+-ATPase, NKCC1 et transporteurs HCO3- assurent la sécrétion ; l’acétazolamide inhibe l’anhydrase carbonique.</li><li>Efficacité clinique limitée dans l’hydrocéphalie.</li></ul></template>
<template data-pop="pareto-g91-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g91-p-1,g91-p-2,g91-p-3,g91-p-4"></p><ul><li>Aucun médicament ne traite l’hydrocéphalie ; le traitement est chirurgical.</li><li>Acétazolamide : enfant 8–10 mg/kg/dose ×3, hors AMM.</li><li>Cathéter imprégné : infection 6,0 % → 2,2 %.</li></ul></template>
