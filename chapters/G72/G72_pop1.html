<template data-pop="g72-toxique" data-title="Myopathies toxiques">
<div class="lab">Définition</div><p>Une myopathie toxique est une atteinte du muscle causée par une substance : médicament, alcool ou autre agent. Les revues de référence la décrivent comme la <b>cause la plus fréquente de myopathie acquise</b>. Les principaux responsables sont les statines, l’alcool et les corticoïdes. L’aspect clinique et histologique dépend du mode d’action du toxique : atrophie, nécrose, atteinte mitochondriale ou auto-immunité.</p>
<div class="lab">Application</div><p>Devant toute faiblesse musculaire acquise, le médecin relit la liste des médicaments, interroge la consommation d’alcool et la corticothérapie, puis retire l’agent suspect lorsque c’est possible. La raison est que la plupart des myopathies toxiques sont <b>réversibles si l’agent est retiré tôt</b> : l’arrêt est à la fois diagnostic et traitement.</p>
<div class="lab">Limite</div><p>Les deux revues sources ne sont lues que par leur résumé. Elles donnent des faits généraux, non des conduites chiffrées. Les toxiques non médicamenteux de G72.2, la colchicine, la chloroquine et la zidovudine n’ont pas de source lue pour ce cours.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-024-12522-x" target="_blank" rel="noopener">Le Quang et coll., Journal of Neurology, 2024</a> ; <a href="https://doi.org/10.1097/WCO.0000000000000606" target="_blank" rel="noopener">Pasnoor et coll., Current Opinion in Neurology, 2018</a>.</p></template>
<template data-pop="g72-cim" data-title="Classification CIM-10-GM 2024">
<div class="lab">Définition</div><p>La catégorie G72 (« Sonstige Myopathien ») de la CIM-10-GM 2024 regroupe les autres myopathies. Ses sous-codes sont G72.0 (médicamenteuse), G72.1 (alcoolique), G72.2 (due à d’autres agents toxiques), G72.3 (paralysies périodiques, y compris les formes familiales hyperkaliémique, hypokaliémique, myotonique et normokaliémique), G72.4 (myopathie inflammatoire non classée ailleurs), G72.80 (myopathie de réanimation), G72.88 (autres myopathies précisées) et G72.9 (sans précision).</p>
<div class="lab">Exclusions</div><p>Sont exclues de G72 : l’arthrogrypose multiple congénitale (Q74.3), la dermatomyosite-polymyosite (M33.-), l’infarctus musculaire ischémique (M62.2-), la myosite (M60.-) et la polymyosite (M33.2). Pour G72.0 et G72.2, un code supplémentaire du chapitre des causes externes identifie la substance.</p>
<div class="lab">Limite</div><p>Le texte du bloc a été lu par un outil de résumé, non mot à mot. La place de la myosite à inclusions, de la myopathie nécrosante à médiation immune et de la myosite sous inhibiteur de point de contrôle entre G72.4 et les catégories M33 ou M60 n’a pas été vérifiée dans l’index alphabétique : le cours ne tranche pas.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G70–G73</a>.</p></template>
<template data-pop="g72-imnm" data-title="Myopathie nécrosante à médiation immune">
<div class="lab">Définition</div><p>Groupe de myopathies inflammatoires distingué de la polymyosite en 2004. Trois sous-classes : <b>anti-SRP</b>, <b>anti-HMGCR</b> et <b>séronégative</b> (environ 20 % de l’ensemble). Elle est souvent rapidement progressive et sévère, avec une créatine kinase très élevée. Après une statine, elle survient chez une minorité de patients (prédisposition HLA, expression du complexe majeur d’histocompatibilité de classe I sur des fibres intactes).</p>
<div class="lab">Application</div><p>Une faiblesse proximale persistante et une créatine kinase élevée malgré l’arrêt de la statine orientent vers cette forme : anticorps et biopsie sont indiqués. Le traitement discute le rituximab ou les immunoglobulines par voie intraveineuse ; un cas suisse a répondu aux immunoglobulines après échec de la prednisolone et de l’azathioprine.</p>
<div class="lab">Limite</div><p>La classification clinico-séro-pathologique de l’ENMC (2016) est citée par son titre, son contenu n’a pas été lu. Les doses et les durées des traitements immunosuppresseurs ne figurent pas dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41584-020-00515-9" target="_blank" rel="noopener">Allenbach et coll., Nature Reviews Rheumatology, 2020</a> ; <a href="https://doi.org/10.1024/1661-8157/a003828" target="_blank" rel="noopener">Hunziker et coll., Praxis, 2022</a> ; <a href="https://doi.org/10.1016/j.nmd.2017.09.016" target="_blank" rel="noopener">ENMC, classification des myopathies nécrosantes, 2018 (contenu non lu)</a>.</p></template>
<template data-pop="g72-eular" data-title="Critères EULAR/ACR 2017">
<div class="lab">Définition</div><p>Les critères de 2017 de la Ligue européenne contre le rhumatisme (EULAR) et du Collège américain de rhumatologie (ACR) classent les myopathies inflammatoires idiopathiques de l’adulte et de l’enfant. Ce sont des <b>critères de classification</b>, destinés à la recherche et aux essais.</p>
<div class="lab">Application</div><p>Chaque variable reçoit des points, avec ou sans biopsie. La classification est probable à partir de 5,5 (sans biopsie) ou 6,7 (avec) et certaine à partir de 7,5 ou 8,7. La sensibilité et la spécificité sont de 87 % et 82 % sans biopsie, 93 % et 88 % avec.</p>
<div class="lab">Limite et piège</div><p>Ces critères ne sont pas diagnostiques. La myopathie nécrosante à médiation immune est rattachée à la branche de la polymyosite faute d’effectif suffisant.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5736307/" target="_blank" rel="noopener">Lundberg et coll., critères EULAR/ACR, 2017</a>.</p></template>
<template data-pop="g72-eas" data-title="Statines : classification et imputabilité (EAS)">
<div class="lab">Définition</div><p>Le consensus de la Société européenne d’athérosclérose (EAS, 2015) classe les symptômes musculaires sous statine selon la créatine kinase : symptômes avec créatine kinase normale (myalgie, causalité incertaine) ; créatine kinase inférieure à 4 fois la limite supérieure de la normale ; de 4 à 10 fois ; supérieure à 10 fois (« myopathie », environ 1 cas en excès pour 10 000 par an) ; supérieure à 40 fois avec atteinte rénale ou myoglobinurie (rhabdomyolyse).</p>
<div class="lab">Application</div><p>Chaque classe a sa conduite (réévaluer, arrêter ou poursuivre sous surveillance). Dans l’essai STOMP, les myalgies concernaient 9,4 % des patients sous atorvastatine 80 mg et 4,6 % sous placebo (P = 0,054) : un symptôme isolé ne prouve pas la responsabilité du médicament.</p>
<div class="lab">Limite</div><p>Ce consensus est européen mais fut rédigé avant l’information professionnelle suisse actuelle (avril 2025). En cas de divergence de seuil (créatine kinase 5 fois pour l’arrêt dans l’information professionnelle), le cours cite les deux sources.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a> ; Information professionnelle suisse Atorvastatin-Mepha, avril 2025 (AmiKo).</p></template>
<template data-pop="g72-slco1b1" data-title="SLCO1B1 et transporteur OATP1B1">
<div class="lab">Définition</div><p><i>SLCO1B1</i> code le transporteur OATP1B1. Le variant rs4149056 augmente l’exposition à certaines statines. Avec la simvastatine à forte dose, le risque de myopathie est de 18 % chez les homozygotes, 3 % chez les hétérozygotes et 0,6 % chez les non-porteurs (étude SEARCH).</p>
<div class="lab">Application</div><p>Le génotypage de routine n’est pas recommandé. Les variants de gènes de maladies musculaires sont retrouvés chez 17,1 % des myopathies sévères contre 4,5 % des témoins, ce qui suggère une prédisposition génétique, sans conduite pratique en routine.</p>
<div class="lab">Limite</div><p>Les chiffres concernent la simvastatine ; ils ne se transposent pas tels quels à l’atorvastatine.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a>.</p></template>
<template data-pop="g72-cortico" data-title="Myopathie cortisonique">
<div class="lab">Définition</div><p>Atteinte du muscle par la corticothérapie prolongée : atrophie préférentielle des fibres de type II. Les glucocorticoïdes freinent la synthèse protéique (voie mTOR/IGF-1) et activent la dégradation (ubiquitine-protéasome, autophagie-lysosome) par les facteurs FOXO et les atrogènes MuRF-1 et atrogine-1.</p>
<div class="lab">Application</div><p>Le tableau est celui d’une faiblesse proximale indolore, avec atrophie sélective des membres inférieurs et créatine kinase normale ou peu élevée. La biopsie montre l’atrophie des fibres de type II sans infiltrat inflammatoire. La prise en charge est la réduction progressive ou l’arrêt, plus la rééducation (résistance et endurance).</p>
<div class="lab">Limite</div><p>Source lue par son résumé. L’indication de la corticothérapie (par exemple une maladie inflammatoire) doit être pesée avant toute réduction : la source ne détaille pas les doses.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.revmed.2026.03.439" target="_blank" rel="noopener">Solé et coll., Revue de médecine interne, 2026</a>.</p></template>
<template data-pop="g72-alcool" data-title="Myopathie alcoolique">
<div class="lab">Définition</div><p>Atteinte du muscle liée à l’alcool, aiguë ou chronique. Mécanismes : baisse de la synthèse protéique (mTORC1, IGF-1), hausse de la myostatine, stress oxydatif (CYP2E1), atteinte mitochondriale, inflammation et défaut de régénération. La dénutrition et les carences y contribuent.</p>
<div class="lab">Application</div><p>La forme aiguë suit une alcoolisation massive (douleur, œdème, faiblesse, parfois rhabdomyolyse avec insuffisance rénale). La forme chronique est une faiblesse proximale progressive liée à la dose cumulée. Le seul traitement connu est l’abstinence complète : jusqu’à 85 % d’amélioration de la force la première année, normalisation à cinq ans.</p>
<div class="lab">Limite</div><p>Source nord-américaine, mécanismes largement animaux, aucune source européenne lue. Les fréquences (40 à 60 % des buveurs chroniques) ne sont pas suisses.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5513686/" target="_blank" rel="noopener">Simon et coll., Alcohol Research, 2017</a>.</p></template>
<template data-pop="g72-canaux" data-title="Sarcolemme, canaux sodiques et inexcitabilité">
<div class="lab">Définition</div><p>Le sarcolemme est la membrane de la fibre musculaire. Les canaux sodiques, dont Nav1.4, permettent le potentiel d’action. Une dépolarisation soutenue les inactive : la fibre devient inexcitable et la paralysie est flasque.</p>
<div class="lab">Application</div><p>Dans la forme hypokaliémique, les mutations de <i>CACNA1S</i> (environ 60 % des familles) et de <i>SCN4A</i> (environ 20 %) créent un courant de fuite au repos ; la baisse du potassium dépolarise paradoxalement la fibre. Dans la forme hyperkaliémique, le gain de fonction de <i>SCN4A</i> maintient la dépolarisation. Le syndrome d’Andersen-Tawil relève de <i>KCNJ2</i> (canal Kir2.1).</p>
<div class="lab">Limite</div><p>Le détail moléculaire dépasse le cadre des sources lues ; le cours ne décrit pas la structure des canaux.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a>.</p></template>
<template data-pop="g72-interactions" data-title="Interactions de l’atorvastatine">
<div class="lab">Définition</div><p>L’information professionnelle suisse d’Atorvastatin-Mepha (avril 2025) liste les médicaments qui augmentent le risque de myopathie : ciclosporine et autres immunosuppresseurs, fibrates (surtout le gemfibrozil), niacine, inhibiteurs du CYP3A4 (macrolides dont la clarithromycine, azolés, inhibiteurs de protéase, diltiazem), létermovir, acide fusidique systémique, colchicine et daptomycine.</p>
<div class="lab">Application</div><p>Avec la ciclosporine à 5,2 mg/kg/jour, l’aire sous la courbe de l’atorvastatine est multipliée par 8,7. Pour l’acide fusidique, l’information signale des rhabdomyolyses parfois mortelles : la statine est interrompue et reprise 7 jours après la dernière dose de l’antibiotique.</p>
<div class="lab">Limite</div><p>La liste porte sur l’atorvastatine ; les interactions d’autres statines diffèrent.</p>
<p class="src">Références : Information professionnelle suisse Atorvastatin-Mepha, avril 2025 (AmiKo).</p></template>
<template data-pop="g72-risque" data-title="Facteurs de risque musculaire sous statine">
<div class="lab">Définition</div><p>Le consensus européen liste : âge supérieur à 80 ans (prudence dès 75 ans), sexe féminin, indice de masse corporelle bas, origine asiatique, hypothyroïdie non traitée, insuffisance rénale chronique de stades 3 à 5, atteinte hépatique, infection aiguë, traumatisme sévère, virus de l’immunodéficience humaine, diabète, carence en vitamine D, antécédent d’élévation de la créatine kinase ou de myopathie, activité physique intense, jus de pamplemousse en excès, alcool, cocaïne, amphétamines, héroïne.</p>
<div class="lab">Application</div><p>Chaque facteur est une raison d’être plus attentif, non une contre-indication. Le médecin les recherche avant la prescription et à chaque changement de situation (infection, ajout d’un médicament).</p>
<div class="lab">Limite</div><p>La liste n’est pas hiérarchisée dans le texte lu ; aucun poids relatif n’est donné.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a>.</p></template>
<template data-pop="g72-fer" data-title="Hypophosphatémie après fer intraveineux">
<div class="lab">Définition</div><p>Un cas suisse décrit une faiblesse musculaire légère avec hypophosphatémie sévère après une injection de carboxymaltose ferrique par voie intraveineuse. Le mécanisme est une hausse du facteur de croissance des fibroblastes 23 (FGF23), qui provoque une fuite rénale de phosphate et une baisse de l’activation de la vitamine D.</p>
<div class="lab">Application</div><p>Devant une faiblesse après fer intraveineux, le phosphate sérique est dosé. La source ne détaille pas le traitement.</p>
<div class="lab">Limite</div><p>Cas isolé, lu par son résumé : aucune fréquence ni conduite validée.</p>
<p class="src">Références : <a href="https://doi.org/10.23785/PRAXIS.2024.09.004" target="_blank" rel="noopener">Giezendanner et coll., Praxis, 2024</a>.</p></template>
<template data-pop="g72-atcd" data-title="Antécédents à relever">
<div class="lab">Définition</div><p>Les antécédents qui orientent le diagnostic de faiblesse acquise sont : traitement par statine ou corticoïde, consommation d’alcool et sa durée, hypothyroïdie, insuffisance rénale, cancer traité par immunothérapie, séjour récent en réanimation, épisodes de faiblesse récidivants depuis l’enfance dans la famille.</p>
<div class="lab">Application</div><p>Chaque antécédent désigne une famille de causes. L’anamnèse médicamenteuse et familiale figure parmi les éléments qui orientent la démarche (Schubert et Schreiner, 2023).</p>
<div class="lab">Limite</div><p>Le résumé de Praxis ne détaille pas les questions ; l’ordre ci-dessus est pédagogique.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37632430/" target="_blank" rel="noopener">Schubert et Schreiner, Praxis, 2023</a> ; <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a>.</p></template>
<template data-pop="g72-symptomes" data-title="Symptômes par sous-code">
<div class="lab">Définition</div><p>Statines : douleur ou faiblesse proximale symétrique. Cortisone : faiblesse indolore. Alcool aigu : douleur, œdème, urines foncées possibles. Paralysies périodiques : accès de faiblesse flasque. Réanimation : faiblesse diffuse et sevrage difficile. Inflammatoires : selon l’entité.</p>
<div class="lab">Application</div><p>Le symptôme principal oriente avant l’examen : douleur (statines, alcool aigu), absence de douleur (cortisone, réanimation), accès (paralysies périodiques).</p>
<div class="lab">Limite</div><p>Les fréquences relatives des symptômes ne sont pas données dans les sources lues.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a> ; <a href="https://doi.org/10.1016/j.revmed.2026.03.439" target="_blank" rel="noopener">Solé et coll., Revue de médecine interne, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5513686/" target="_blank" rel="noopener">Simon et coll., Alcohol Research, 2017</a> ; <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a>.</p></template>
<template data-pop="g72-mrc" data-title="Échelle du Medical Research Council">
<div class="lab">Définition</div><p>Le score du Medical Research Council évalue la force de douze groupes musculaires. Chaque groupe est noté de 0 à 5, ce qui donne un maximum de 60 (notion de base). La faiblesse acquise en réanimation est définie par un score inférieur à 48.</p>
<div class="lab">Application</div><p>Le score exige un patient vigilant et coopérant. Il quantifie la faiblesse sans en préciser la cause : il ne distingue pas la myopathie, la polyneuropathie et l’atrophie d’inactivité.</p>
<div class="lab">Piège</div><p>Lire un score inférieur à 48 comme un diagnostic de myopathie de réanimation.</p>
<p class="src">Références : <a href="https://doi.org/10.12688/f1000research.17376.1" target="_blank" rel="noopener">Piva et coll., F1000Research, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8958813/" target="_blank" rel="noopener">Rodriguez, Larsson et Z’Graggen, 2022</a>.</p></template>
<template data-pop="g72-proximal" data-title="Faiblesse proximale">
<div class="lab">Définition</div><p>La faiblesse proximale touche les muscles des ceintures scapulaire et pelvienne : cuisses, fesses, épaules. Elle est le tableau habituel des myopathies toxiques (statines, alcool, cortisone).</p>
<div class="lab">Technique</div><p>Le patient se lève d’une chaise sans les mains, monte une marche, lève les bras au-dessus de la tête. L’incapacité de se lever sans l’aide des bras signe la faiblesse des cuisses.</p>
<div class="lab">Piège</div><p>Se contenter de la poignée de main : la faiblesse proximale ne s’y voit pas.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a> ; <a href="https://doi.org/10.1016/j.revmed.2026.03.439" target="_blank" rel="noopener">Solé et coll., Revue de médecine interne, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5513686/" target="_blank" rel="noopener">Simon et coll., Alcohol Research, 2017</a>.</p></template>
<template data-pop="g72-prehension" data-title="Force de préhension">
<div class="lab">Définition</div><p>Mesure au dynamomètre. Une valeur inférieure à 7 kg chez la femme et à 11 kg chez l’homme est anormale selon la revue de Brescia.</p>
<div class="lab">Application</div><p>Elle quantifie la faiblesse de manière objective et reproductible chez un patient coopérant. Elle est utile au suivi.</p>
<div class="lab">Limite</div><p>Exige la coopération. Elle ne distingue pas les causes : une faiblesse de la préhension peut venir du nerf comme du muscle.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s13054-023-04676-3" target="_blank" rel="noopener">Latronico et coll., Critical Care, 2023</a>.</p></template>
<template data-pop="g72-face" data-title="Face, yeux et muscles bulbaires">
<div class="lab">Définition</div><p>La myopathie de réanimation épargne la face. Le ptosis et l’ophtalmoplégie orientent vers la myasthénie ; des pupilles dilatées peu réactives vers le botulisme.</p>
<div class="lab">Application</div><p>L’examen de la face et des yeux est un test de tri entre myopathie diffuse, myasthénie et botulisme chez le patient grave.</p>
<div class="lab">Limite</div><p>Les sources lues ne détaillent pas l’examen des muscles bulbaires.</p>
<p class="src">Références : <a href="https://doi.org/10.1186/s13054-023-04676-3" target="_blank" rel="noopener">Latronico et coll., Critical Care, 2023</a> ; <a href="https://doi.org/10.1016/S1474-4422(11)70178-8" target="_blank" rel="noopener">Latronico et Bolton, Lancet Neurology, 2011</a>.</p></template>
<template data-pop="g72-reflexes" data-title="Réflexes, sensibilité et sphincters">
<div class="lab">Définition</div><p>Dans les paralysies périodiques, des réflexes conservés dans un membre paralysé orientent vers une autre cause ; des troubles sensitifs marqués vers un syndrome de Guillain-Barré. Dans le cas suisse de myopathie nécrosante, les réflexes étaient conservés malgré la tétraparésie.</p>
<div class="lab">Application</div><p>L’examen neurologique complet évite de classer comme myopathie une neuropathie ou une atteinte centrale.</p>
<div class="lab">Limite</div><p>Les sources lues ne donnent pas de règle générale sur les réflexes dans toutes les myopathies.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a> ; <a href="https://doi.org/10.1024/1661-8157/a003828" target="_blank" rel="noopener">Hunziker et coll., Praxis, 2022</a>.</p></template>
<template data-pop="g72-flechisseurs" data-title="Fléchisseurs des doigts et du cou">
<div class="lab">Définition</div><p>Dans l’arbre EULAR/ACR, la myosite à inclusions est définie par la faiblesse des fléchisseurs des doigts sans réponse au traitement ou par des vacuoles bordées à la biopsie. La faiblesse des fléchisseurs du cou plus marquée que celle des extenseurs ajoute des points au score.</p>
<div class="lab">Application</div><p>Le médecin teste ces groupes lorsque la faiblesse est lentement progressive et inhabituelle pour une myopathie toxique.</p>
<div class="lab">Limite</div><p>Critères de classification, non diagnostiques.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5736307/" target="_blank" rel="noopener">Lundberg et coll., critères EULAR/ACR, 2017</a>.</p></template>
<template data-pop="g72-ck" data-title="Créatine kinase">
<div class="lab">Définition</div><p>Enzyme musculaire libérée dans le sang quand la fibre est lésée. Les sources lues expriment les résultats en <b>multiples de la limite supérieure de la normale</b> ; elles ne donnent pas d’intervalle de référence suisse.</p>
<div class="lab">Application</div><p>Ne pas la doser après un effort intense. Si elle est supérieure à 5 fois la limite avant traitement par statine, la contrôler en 5 à 7 jours. En réanimation, elle est presque normale dans la polyneuropathie, modérément élevée dans la myopathie à filaments épais et nettement élevée avec myoglobinurie dans la myopathie nécrosante. Le cas suisse de myopathie nécrosante avait une créatine kinase à 400 U/L.</p>
<div class="lab">Piège et erreur fréquente</div><p>Une enzyme normale ou peu élevée est attendue dans la myopathie cortisonique et ne l’exclut pas ; une enzyme élevée après un effort n’est pas une myopathie.</p>
<p class="src">Références : Information professionnelle suisse Atorvastatin-Mepha, avril 2025 (AmiKo) ; <a href="https://doi.org/10.1186/s13054-023-04676-3" target="_blank" rel="noopener">Latronico et coll., Critical Care, 2023</a> ; <a href="https://doi.org/10.1024/1661-8157/a003828" target="_blank" rel="noopener">Hunziker et coll., Praxis, 2022</a>.</p></template>
<template data-pop="g72-enmg" data-title="Électroneuromyographie">
<div class="lab">Définition</div><p>Examen électrique du nerf et du muscle. Dans la myopathie de réanimation, le potentiel d’action musculaire composé est inférieur à 80 % de la limite inférieure avec potentiels sensitifs normaux ou réduits de moins de 20 %, les potentiels d’unité motrice sont brefs et de faible amplitude, la réponse à la stimulation musculaire directe est réduite et la stimulation répétitive normale.</p>
<div class="lab">Application</div><p>Le test du nerf péronier, d’environ 10 minutes, dépiste la baisse du potentiel chez le patient non coopérant. Il ne remplace pas l’examen complet.</p>
<div class="lab">Limite</div><p>Les valeurs normales et la technique détaillée ne sont pas données dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8958813/" target="_blank" rel="noopener">Rodriguez, Larsson et Z’Graggen, 2022</a> ; <a href="https://doi.org/10.1186/s13054-023-04676-3" target="_blank" rel="noopener">Latronico et coll., Critical Care, 2023</a>.</p></template>
<template data-pop="g72-biopsie" data-title="Biopsie musculaire">
<div class="lab">Définition</div><p>Prélèvement d’un fragment de muscle pour examen histologique. En réanimation, elle distingue la polyneuropathie (atrophie de dénervation), la myopathie à filaments épais (perte de myosine) et la myopathie nécrosante (nécrose). Un rapport myosine/actine inférieur à 1,7 est anormal.</p>
<div class="lab">Application</div><p>Elle est conditionnelle : indiquée quand l’électrophysiologie et l’évolution ne tranchent pas, ou pour une forme immunitaire. Elle fonde la forme « certaine » de la myopathie de réanimation ; la forme « probable » se retient sans biopsie. Elle recherche aussi les vacuoles bordées.</p>
<div class="lab">Limite</div><p>Examen invasif ; les indications précises ne sont pas détaillées dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8958813/" target="_blank" rel="noopener">Rodriguez, Larsson et Z’Graggen, 2022</a> ; <a href="https://doi.org/10.1186/s13054-023-04676-3" target="_blank" rel="noopener">Latronico et coll., Critical Care, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5736307/" target="_blank" rel="noopener">Lundberg et coll., critères EULAR/ACR, 2017</a>.</p></template>
<template data-pop="g72-imputabilite" data-title="Imputabilité d’une statine">
<div class="lab">Définition</div><p>Trois observations soutiennent la responsabilité d’une statine : baisse de la créatine kinase après l’arrêt, disparition des symptômes en quelques semaines, réapparition dans le mois suivant la réintroduction.</p>
<div class="lab">Application</div><p>Seule la concordance des trois observations est convaincante. Un symptôme isolé, notamment en l’absence d’élévation de l’enzyme, laisse la causalité incertaine.</p>
<div class="lab">Limite</div><p>La réintroduction n’est pas proposée après une rhabdomyolyse.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a>.</p></template>
<template data-pop="g72-rea-criteres" data-title="Critères de la myopathie de réanimation">
<div class="lab">Définition</div><p>Forme certaine : contexte critique avec faiblesse ou sevrage difficile non expliqués autrement ; potentiel d’action musculaire composé inférieur à 80 % de la limite inférieure ; potentiels d’unité motrice brefs et de faible amplitude ; réponse réduite à la stimulation directe ; stimulation répétitive normale ; biopsie avec rapport myosine/actine inférieur à 1,7. Forme probable : sans biopsie.</p>
<div class="lab">Application</div><p>La faiblesse acquise en réanimation est un diagnostic clinique de score inférieur à 48, sans précision de cause.</p>
<div class="lab">Limite</div><p>Les critères sont issus d’une revue (Berne) ; la source n’indique pas leur validation prospective.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8958813/" target="_blank" rel="noopener">Rodriguez, Larsson et Z’Graggen, 2022</a> ; <a href="https://doi.org/10.12688/f1000research.17376.1" target="_blank" rel="noopener">Piva et coll., F1000Research, 2019</a>.</p></template>
<template data-pop="g72-effort" data-title="Test d’effort prolongé">
<div class="lab">Définition</div><p>Test électrophysiologique des paralysies périodiques : l’amplitude du potentiel d’action musculaire composé baisse après un effort prolongé. Une baisse d’au moins 40 % est anormale ; le test est positif chez plus de 70 % des patients.</p>
<div class="lab">Application</div><p>Il soutient le diagnostic clinique avec la génétique, le potassium pendant l’accès (inférieur à 3,5 ou supérieur à 4,5 mmol/L) et, pour le syndrome d’Andersen-Tawil, l’intervalle QT corrigé ou QU long sans hypokaliémie.</p>
<div class="lab">Limite</div><p>Un test normal n’exclut pas la maladie (moins de 100 % de sensibilité).</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a>.</p></template>
<template data-pop="g72-rhabdo" data-title="Rhabdomyolyse">
<div class="lab">Définition</div><p>Destruction massive du muscle. Pour les statines : créatine kinase supérieure à 40 fois la limite avec atteinte rénale ou myoglobinurie. La fréquence est d’environ 1 sur 100 000 par an. Dans l’alcool aigu, la rhabdomyolyse est la cause non traumatique la plus fréquente à l’hôpital (données nord-américaines).</p>
<div class="lab">Application</div><p>Bilan rénal, hydratation par voie intraveineuse, alcalinisation des urines selon la sévérité, arrêt de la statine sans réintroduction.</p>
<div class="lab">Piège</div><p>Attendre la myoglobinurie pour agir : une douleur ou une faiblesse sévère avec une créatine kinase très élevée suffit à lancer le bilan rénal.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5513686/" target="_blank" rel="noopener">Simon et coll., Alcohol Research, 2017</a>.</p></template>
<template data-pop="g72-ici" data-title="Myosite sous inhibiteur de point de contrôle">
<div class="lab">Définition</div><p>Toxicité immunitaire du traitement anticancéreux : incidence de 0,5 à 1 %, plus élevée sous association. Début médian environ un mois après le premier traitement. Elle est isolée dans la moitié des cas environ ; le chevauchement avec myocardite ou myasthénie atteint 8,3 % après 2017.</p>
<div class="lab">Application</div><p>La ventilation est nécessaire dans environ 20 % des myosites isolées et 50 à 80 % des chevauchements ; la mortalité atteint environ 40 % des chevauchements. Les corticoïdes à forte dose sont immédiats.</p>
<div class="lab">Limite</div><p>Recommandation ESMO 2022 non lue (accès refusé) : les doses et grades ne sont pas rapportés. La source lue est un résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00393-026-01878-2" target="_blank" rel="noopener">Gente et coll., Zeitschrift für Rheumatologie, 2026</a> ; <a href="https://doi.org/10.1016/j.annonc.2022.10.001" target="_blank" rel="noopener">ESMO, toxicités de l’immunothérapie, 2022 (contenu non lu)</a>.</p></template>
<template data-pop="g72-hypopp" data-title="Accès hypokaliémique">
<div class="lab">Définition</div><p>Accès de faiblesse flasque avec potassium sérique inférieur à 3,5 mmol/L, déclenché par les repas riches en glucides, l’alcool ou le repos après l’effort. Premier accès entre 5 et 35 ans.</p>
<div class="lab">Application</div><p>Potassium par voie orale (0,2 à 0,4 mmol/kg toutes les 30 minutes, au plus 200 à 250 mmol/jour) ou intraveineux (40 mmol/L dans du mannitol à 5 %, au plus 20 mmol/heure et 200 mmol/jour), sous surveillance électrocardiographique.</p>
<div class="lab">Piège</div><p>Le stock total de potassium n’est pas déplété : le potassium revient dans le sang à la fin de l’accès et le risque est une hyperkaliémie de rebond. Les solutés glucosés et salés aggravent la faiblesse.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a>.</p></template>
<template data-pop="g72-anticorps" data-title="Anticorps anti-HMGCR, anti-SRP, anti-Jo-1">
<div class="lab">Définition</div><p>Les anticorps anti-HMGCR et anti-SRP définissent deux sous-classes de la myopathie nécrosante à médiation immune ; une troisième est séronégative (environ 20 %). L’anticorps anti-Jo-1 rapporte 3,9 points sans biopsie (3,8 avec) au score EULAR/ACR.</p>
<div class="lab">Application</div><p>Ils sont dosés devant une faiblesse persistante malgré l’arrêt d’une statine, avec créatine kinase élevée.</p>
<div class="lab">Limite</div><p>Les valeurs seuils et les méthodes ne sont pas données dans les sources lues ; la classification ENMC 2016 n’a pas été lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41584-020-00515-9" target="_blank" rel="noopener">Allenbach et coll., Nature Reviews Rheumatology, 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5736307/" target="_blank" rel="noopener">Lundberg et coll., critères EULAR/ACR, 2017</a> ; <a href="https://doi.org/10.1016/j.nmd.2017.09.016" target="_blank" rel="noopener">ENMC, classification des myopathies nécrosantes, 2018 (contenu non lu)</a>.</p></template>
<template data-pop="g72-ibm" data-title="Myosite à inclusions">
<div class="lab">Définition</div><p>Forme de myopathie inflammatoire. Dans l’arbre EULAR/ACR 2017, elle est définie par la faiblesse des fléchisseurs des doigts sans réponse au traitement ou par des vacuoles bordées. Les critères ENMC ont été révisés en 2024 (IRM, échographie, anticorps anti-cN1A).</p>
<div class="lab">Application</div><p>Elle est à suspecter devant une faiblesse lentement progressive sans lien médicamenteux et résistante aux traitements habituels.</p>
<div class="lab">Limite</div><p>Contenu des critères ENMC 2024 non lu (résumé seulement). La place de cette entité entre G72.4 et M33/M60 n’est pas vérifiée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5736307/" target="_blank" rel="noopener">Lundberg et coll., critères EULAR/ACR, 2017</a> ; <a href="https://doi.org/10.1016/j.nmd.2024.03.001" target="_blank" rel="noopener">Lilleker et coll., ENMC, 2024 (résumé)</a>.</p></template>
<template data-pop="g72-mnemo" data-title="Aide pédagogique : interactions de l’atorvastatine">
<div class="lab">Mnémotechnique</div><p><i>Chaque Fois Nouvel Macrolide, Colchicine, Daptomycine, Fusidique : vérifier la statine.</i> Les initiales rappellent ciclosporine, fibrates, niacine, macrolides, colchicine, daptomycine et acide fusidique. Les autres inhibiteurs du CYP3A4 (azolés, inhibiteurs de protéase, diltiazem) et le létermovir se retiennent avec les macrolides comme une seule famille.</p>
<div class="lab">Statut</div><p>Aide pédagogique, non critère officiel. La liste de référence est celle de l’information professionnelle suisse de l’atorvastatine.</p>
<p class="src">Références : Information professionnelle suisse Atorvastatin-Mepha, avril 2025 (AmiKo).</p></template>
