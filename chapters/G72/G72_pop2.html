<template data-pop="g72-atorva" data-title="Atorvastatine — Atorvastatin-Mepha">
<div class="lab">Mécanisme</div><p>L’atorvastatine appartient aux statines, inhibiteurs de l’enzyme HMG-CoA réductase (notion de base). Les mécanismes de sa toxicité musculaire ne sont pas établis chez l’humain : dysfonction mitochondriale, baisse de la prénylation, déplétion en coenzyme Q10, atteinte de la signalisation calcique, dégradation protéique.</p>
<div class="lab">Preuves</div><p>Consensus de la Société européenne d’athérosclérose (2015) : symptômes musculaires chez 7 à 29 % en registres, myopathie sévère 1/1000 à 1/10 000, rhabdomyolyse environ 1/100 000 par an. Essai STOMP : myalgies 9,4 % sous atorvastatine 80 mg contre 4,6 % sous placebo (P = 0,054).</p>
<div class="lab">Posologie</div><p>La dose initiale usuelle est de 10 mg une fois par jour. Les adaptations se font à intervalles de 4 semaines ou plus, jusqu’à 80 mg par jour au maximum. En présence d’un médicament interagissant, les plafonds de l’information professionnelle s’appliquent : 10 mg avec la ciclosporine, le tipranavir/ritonavir ou le télaprévir, 20 mg avec le létermovir ou l’elbasvir/grazoprévir. Après une toxicité musculaire, une reprise de la même statine ou d’une autre peut être envisagée à dose minimale, avec surveillance accrue, une fois les symptômes disparus et la créatine kinase normalisée.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Effets musculaires : myalgie, myopathie, rhabdomyolyse ; la myopathie nécrosante à médiation immune est rapportée dans de très rares cas. Contre-indications : hypersensibilité, maladie hépatique active ou élévation durable inexpliquée des transaminases au-delà de 3 fois la normale, cholestase, myopathie, grossesse et allaitement, association avec le glécaprévir/pibrentasvir.</p>
<div class="lab">Surveillance</div><p>Il faut doser la créatine kinase avant traitement dans les situations à risque (atteinte rénale, hypothyroïdie, myopathie personnelle ou familiale, antécédent de toxicité, abus d’alcool, âge supérieur à 70 ans avec facteurs) ; si elle dépasse 5 fois la limite, il faut la contrôler en 5 à 7 jours et, si l’élévation se confirme, renoncer à commencer la statine ; il faut arrêter le traitement si elle dépasse 5 fois la limite sous traitement ; il ne faut pas la surveiller systématiquement chez l’asymptomatique. Interactions : voir l’îlot p-3.</p>
<p class="src">Références : Information professionnelle suisse Atorvastatin-Mepha, avril 2025 (AmiKo) ; <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a>.</p></template>
<template data-pop="g72-alternatives" data-title="Hypolipémiants alternatifs">
<div class="lab">Mécanisme et place</div><p>Quand la statine est interrompue ou mal tolérée, la protection cardiovasculaire se maintient par la dose maximale tolérée de statine associée à l’<b>ézétimibe</b> (premier choix d’ajout, baisse du LDL-cholestérol de 15 à 20 %), par la <b>prise intermittente</b> (un jour sur deux ou deux fois par semaine, tolérée par environ 70 % des patients, baisse de 12 à 38 %) ou par les <b>inhibiteurs de PCSK9</b> (baisse de 50 à 60 %).</p>
<div class="lab">Preuves</div><p>Chiffres du consensus européen de 2015 ; les essais cités ne sont pas détaillés dans les sources lues.</p>
<div class="lab">Mise à jour européenne et suisse</div><p>La mise à jour 2025 des recommandations européennes sur les dyslipidémies propose, lorsque l’objectif de LDL-cholestérol n’est pas atteint sous la dose maximale tolérée de statine, d’ajouter une thérapie non statinique au bénéfice cardiovasculaire démontré : ézétimibe, anticorps anti-PCSK9 ou acide bempédoïque, seuls ou associés. L’acide bempédoïque a réduit les événements cardiovasculaires majeurs de 13 % chez des patients intolérants aux statines à haut risque, dans l’essai CLEAR Outcomes (ESC/EAS, 2025). En Suisse, Nilemdo (acide bempédoïque, juillet 2025) est autorisé à 180 mg une fois par jour, notamment chez les patients intolérants aux statines ou chez qui elles sont contre-indiquées. Repatha (évolocumab, juin 2024) est autorisé en complément d’une statine à la dose maximale tolérée et pour réduire le risque d’événements cardiovasculaires chez les patients à risque élevé ; Ezetrol (mars 2024) se prend à 10 mg par jour, seul ou associé (informations professionnelles suisses).</p>
<div class="lab">Ce que montrent les essais en aveugle</div><p>Dans 19 essais contrôlés en double aveugle (123 940 participants), la statine augmente la douleur ou la faiblesse musculaire de 7 % en relatif la première année, soit 11 événements pour 1000 personnes-années ; plus de 90 % des plaintes rapportées sous statine ne sont pas dues au médicament (Cholesterol Treatment Trialists’ Collaboration, 2022). Avant de conclure à une intolérance, le médecin vérifie donc l’imputabilité par l’arrêt et la réintroduction (Stroes et coll., 2015).</p>
<div class="lab">À éviter</div><p>La coenzyme Q10 et la vitamine D ne sont pas recommandées pour la myalgie des statines ; la levure de riz rouge est déconseillée. Après échec de trois statines, le patient est adressé à un centre spécialisé.</p>
<div class="lab">Limite</div><p>Pour ces produits, seules les indications et la posologie usuelle des informations professionnelles suisses ont été lues ; leurs effets indésirables et contre-indications ne figurent pas dans ce cours. La classe et le niveau de preuve des recommandations européennes de 2025 n’ont pas été lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1093/eurheartj/ehv043" target="_blank" rel="noopener">Stroes et coll., Société européenne d’athérosclérose, 2015</a> ; <a href="https://academic.oup.com/eurheartj/article/46/42/4359/8234482" target="_blank" rel="noopener">ESC/EAS, mise à jour 2025</a> ; <a href="https://doi.org/10.1016/S0140-6736(22)01545-8" target="_blank" rel="noopener">Cholesterol Treatment Trialists’ Collaboration, The Lancet, 2022</a> ; informations professionnelles suisses Nilemdo (juillet 2025), Repatha (juin 2024) et Ezetrol (mars 2024), via AmiKo.</p></template>
<template data-pop="g72-ig" data-title="Immunoglobulines et rituximab (myopathie nécrosante)">
<div class="lab">Place</div><p>Dans la myopathie nécrosante à médiation immune, le rituximab ou les immunoglobulines par voie intraveineuse peuvent être discutés. Un cas suisse de tétraparésie flasque subaiguë, résistante à la prednisolone et à l’azathioprine, a presque guéri après deux cures d’immunoglobulines (créatine kinase 400 U/L).</p>
<div class="lab">Preuves</div><p>Revue de pathogenèse et de clinique (2020) et cas isolé : niveau de preuve faible.</p>
<div class="lab">Statut en Suisse</div><p>Emploi hors indication : MabThera (décembre 2025) est autorisé pour des lymphomes, la leucémie lymphoïde chronique, la polyarthrite rhumatoïde, les vascularites à ANCA et le pemphigus ; Privigen (juillet 2025) et Octagam 10 % (juillet 2022) visent les déficits immunitaires et des neuropathies immunes, Octagam ajoutant la dermatomyosite active. Aucune ne cite la myopathie nécrosante.</p>
<div class="lab">Limite</div><p>Posologie, effets indésirables, contre-indications et surveillance ne sont pas dans les sources lues ; la décision relève d’un centre spécialisé.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41584-020-00515-9" target="_blank" rel="noopener">Allenbach et coll., Nature Reviews Rheumatology, 2020</a> ; <a href="https://doi.org/10.1024/1661-8157/a003828" target="_blank" rel="noopener">Hunziker et coll., Praxis, 2022</a>.</p></template>
<template data-pop="g72-cortico-ici" data-title="Corticoïdes et abatacept (myosite sous inhibiteur de point de contrôle)">
<div class="lab">Place</div><p>La myosite sous inhibiteur de point de contrôle est traitée par corticoïdes à forte dose immédiats, épargneurs de corticoïdes et, dans les formes fulminantes, abatacept en sauvetage.</p>
<div class="lab">Preuves</div><p>Revue allemande de 2026 lue par son résumé ; la recommandation ESMO 2022, qui chiffre les doses et les grades, n’a pas pu être lue (accès refusé).</p>
<div class="lab">Statut en Suisse</div><p>L’abatacept (Orencia, septembre 2024) est autorisé pour la polyarthrite rhumatoïde et l’arthrite juvénile idiopathique polyarticulaire : son emploi dans la myosite sous inhibiteur de point de contrôle est hors indication.</p>
<div class="lab">Limite</div><p>Aucune dose n’est donnée dans ce cours. Effets indésirables des corticoïdes : atrophie des fibres de type II en cas de corticothérapie prolongée (voir la myopathie cortisonique).</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00393-026-01878-2" target="_blank" rel="noopener">Gente et coll., Zeitschrift für Rheumatologie, 2026</a> ; <a href="https://doi.org/10.1016/j.annonc.2022.10.001" target="_blank" rel="noopener">ESMO, toxicités de l’immunothérapie, 2022 (contenu non lu)</a>.</p></template>
<template data-pop="g72-potassium" data-title="Potassium (accès hypokaliémique)">
<div class="lab">Mécanisme</div><p>Le potassium corrige la kaliémie basse qui accompagne l’accès. Le stock total de potassium n’est pas déplété : il revient dans le sang à la fin de l’accès.</p>
<div class="lab">Posologie</div><p>Voie orale : forme non retard, 0,2 à 0,4 mmol/kg toutes les 30 minutes (revue internationale), sans dépasser 150 mmol/jour chez l’adulte (FI Potassium Hausmann et KCl Retard Hausmann, décembre 2021). Voie intraveineuse, si la voie orale est impossible : lorsque la kaliémie dépasse 2,5 mmol/L, au plus 40 mmol/L, 10 mmol/heure et 200 mmol/jour (FI KCl 7,45 % Sintetica, février 2024). Prévention : 30 à 60 mmol/jour (revue internationale).</p>
<div class="lab">Effets, précautions et surveillance</div><p>Risque d’hyperkaliémie de rebond ; surveillance électrocardiographique obligatoire par voie intraveineuse. La revue déconseille les solutés glucosés ou salés et propose le mannitol à 5 %, non enregistré en Suisse ; la FI du KCl 7,45 % cite le glucose à 5 %, le NaCl à 0,9 %, le gluco-salin et les solutions de Ringer comme solutés vecteurs.</p>
<div class="lab">Limite</div><p>La revue internationale admet jusqu’à 250 mmol/jour par voie orale et 20 mmol/heure par voie intraveineuse : ces valeurs dépassent les plafonds suisses et ne sont pas reprises comme doses de prescription. Les sources lues ne résolvent pas la divergence sur les solutés vecteurs.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a> ; informations professionnelles suisses Potassium Hausmann et KCl Retard Hausmann (décembre 2021), KCl 7,45 % Sintetica (février 2024), via AmiKo.</p></template>
<template data-pop="g72-salbutamol" data-title="Salbutamol inhalé (accès hyperkaliémique)">
<div class="lab">Place</div><p>Dans l’accès hyperkaliémique, une collation glucidique et le salbutamol inhalé (2 bouffées de 0,1 mg) sont proposés.</p>
<div class="lab">Contre-indication ciblée</div><p>Dans le syndrome d’Andersen-Tawil, le salbutamol inhalé est à éviter.</p>
<div class="lab">Statut en Suisse</div><p>Le Ventolin (janvier 2026) est autorisé pour le bronchospasme de l’asthme et de la bronchite chronique : son emploi dans la paralysie périodique est hors étiquette.</p>
<div class="lab">Limite</div><p>Mécanisme et effets indésirables non lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a> ; information professionnelle suisse Ventolin, janvier 2026 (AmiKo).</p></template>
<template data-pop="g72-diamox" data-title="Acétazolamide — Diamox">
<div class="lab">Place</div><p>Prévention des accès de paralysie périodique : 125 à 1000 mg/jour chez l’adulte, 5 à 10 mg/kg/jour chez l’enfant. La réponse globale est de 46 % : 56 % avec <i>CACNA1S</i>, 16 % avec <i>SCN4A</i> ; les porteurs d’une mutation de <i>SCN4A</i> peuvent même voir leurs accès s’aggraver, d’où le génotypage avant l’essai.</p>
<div class="lab">Statut en Suisse</div><p>L’information professionnelle suisse de Diamox (juillet 2026) ne mentionne pas la paralysie périodique : les indications sont le glaucome, les œdèmes, l’insuffisance respiratoire avec acidose respiratoire, l’épilepsie, l’œdème cérébral, la pancréatite et le mal des montagnes. L’emploi dans la paralysie périodique est donc <b>hors étiquette</b>.</p>
<div class="lab">Contre-indications et effets</div><p>Contre-indications : hypokaliémie, hyponatrémie, affection rénale ou hépatique grave (y compris la cirrhose), insuffisance corticosurrénalienne, acidose hyperchlorémique, hypersensibilité aux sulfamides. Effets : hypokaliémie, acidose métabolique ; lors de traitements prolongés, ataxie, paralysie flasque et convulsions ont été observées, ce qui peut se confondre avec un accès. Prudence avec la digoxine.</p>
<div class="lab">Surveillance</div><p>Kaliémie et équilibre acide-base. Le dichlorphénamide est approuvé par l’autorité américaine, hors Suisse ; aucune information professionnelle suisse n’a été lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a> ; Information professionnelle suisse Diamox, juillet 2026 (AmiKo).</p></template>
<template data-pop="g72-hctz" data-title="Hydrochlorothiazide (forme hyperkaliémique)">
<div class="lab">Place</div><p>Prévention des accès de la forme hyperkaliémique : 25 à 75 mg/jour (Statland et coll., 2018).</p>
<div class="lab">Contre-indication ciblée</div><p>Les thiazides sont à éviter dans le syndrome d’Andersen-Tawil.</p>
<div class="lab">Statut en Suisse</div><p>L’Esidrex (mai 2022) est autorisé pour l’hypertension, l’insuffisance cardiaque, les œdèmes, le diabète insipide néphrogénique et l’hypercalciurie : son emploi dans la paralysie périodique est hors étiquette.</p>
<div class="lab">Limite</div><p>Mécanisme et effets indésirables non lus.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/mus.26009" target="_blank" rel="noopener">Statland et coll., Muscle and Nerve, 2018</a> ; information professionnelle suisse Esidrex, mai 2022 (AmiKo).</p></template>
<template data-pop="pareto-g72-definition" data-title="Pareto — Définition et classification">
<p class="ratio" data-cover="g72-0,g72-1"></p><ul><li>G72 regroupe les myopathies acquises ou non classées ailleurs, classées par cause.</li><li>Une faiblesse acquise appelle la recherche d’une cause réversible et d’une urgence.</li><li>Les critères EULAR/ACR classent, ils ne diagnostiquent pas.</li></ul></template>
<template data-pop="pareto-g72-definition2" data-title="Pareto — Fréquence">
<p class="ratio" data-cover="g72-2"></p><ul><li>Symptômes musculaires sous statine : 7 à 29 % en registres ; myopathie sévère 1/1000 à 1/10 000.</li><li>Aucune donnée d’incidence suisse n’a été lue.</li><li>Réanimation : environ 40 % (9 à 86 %).</li></ul></template>
<template data-pop="pareto-g72-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g72-3"></p><ul><li>La fibre perd sa force par moins de synthèse protéique, plus de dégradation ou une membrane inexcitable.</li><li>Avec les statines, la toxicité est le plus souvent directe et plus rarement auto-immune.</li><li>Dans les paralysies périodiques, des canaux ioniques sont mutés.</li></ul></template>
<template data-pop="pareto-g72-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="g72-4"></p><ul><li>Statines, alcool et corticoïdes sont les principales causes toxiques.</li><li>La ciclosporine, les fibrates, les macrolides, l’acide fusidique, la colchicine et la daptomycine interagissent avec l’atorvastatine.</li><li>Il faut chercher ce qui a changé avant la faiblesse.</li></ul></template>
<template data-pop="pareto-g72-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g72-5,g72-6"></p><ul><li>Faiblesse proximale symétrique ; douleur (statines, alcool) ou non (cortisone, réanimation).</li><li>Accès : paralysie périodique.</li><li>Face épargnée en réanimation ; fléchisseurs des doigts : myosite à inclusions.</li></ul></template>
<template data-pop="pareto-g72-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g72-7"></p><ul><li>La créatine kinase s’exprime en multiples de la limite : 4, 10 et 40.</li><li>L’imputabilité repose sur l’arrêt, la disparition des symptômes et la réintroduction.</li><li>Il faut hiérarchiser les diagnostics différentiels par gravité.</li></ul></template>
<template data-pop="pareto-g72-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g72-8"></p><ul><li>En cas de rhabdomyolyse, il faut faire un bilan rénal et hydrater.</li><li>Il faut traiter la myosite sous inhibiteur de point de contrôle par corticoïdes à forte dose.</li><li>Il faut traiter l’accès hypokaliémique par du potassium sous surveillance électrocardiographique.</li></ul></template>
<template data-pop="pareto-g72-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g72-9"></p><ul><li>Retirer l’agent est le premier geste.</li><li>Sous statine, il faut arrêter le traitement si la créatine kinase dépasse 5 fois la limite (information professionnelle suisse).</li><li>En réanimation, il faut recourir à la mobilisation précoce, sans traitement pharmacologique.</li></ul></template>
<template data-pop="pareto-g72-suivi" data-title="Pareto — Suivi et terrains">
<p class="ratio" data-cover="g72-10,g72-11,g72-12"></p><ul><li>Le pronostic dépend du retrait précoce de l’agent ; après l’alcool, jusqu’à 85 % des patients s’améliorent la première année d’abstinence.</li><li>Les paralysies périodiques exposent à une myopathie permanente.</li><li>Âge, rein, grossesse et oncologie modifient le risque.</li></ul></template>
<template data-pop="pareto-g72-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g72-e-1,g72-e-2,g72-e-3,g72-e-4,g72-e-5"></p><ul><li>La question choisit l’examen.</li><li>Les examens clés sont la créatine kinase en multiples de la limite, l’électroneuromyographie et la kaliémie pendant l’accès.</li><li>Le score EULAR/ACR classe sans diagnostiquer.</li></ul></template>
<template data-pop="pareto-g72-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g72-s-anat-cours"></p><ul><li>La faiblesse est proximale et symétrique.</li><li>La face est épargnée en réanimation ; les fléchisseurs des doigts sont atteints dans la myosite à inclusions.</li><li>Les muscles respiratoires sont atteints dans deux entités.</li></ul></template>
<template data-pop="pareto-g72-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g72-s-histo-cours"></p><ul><li>Le muscle montre une atrophie de type II sous cortisone, une perte de myosine en réanimation et une nécrose dans les formes immunitaires.</li><li>Vacuoles bordées : myosite à inclusions.</li><li>La biopsie est conditionnelle.</li></ul></template>
<template data-pop="pareto-g72-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g72-s-physio-cours"></p><ul><li>Une dépolarisation soutenue inactive les canaux sodiques.</li><li>La force dépend de la balance entre synthèse et dégradation des protéines.</li><li>Potassium lent : rebond possible.</li></ul></template>
<template data-pop="pareto-g72-bioch" data-title="Pareto — Biochimie et génétique">
<p class="ratio" data-cover="g72-s-bioch-cours"></p><ul><li>La voie du mévalonate est la cible des statines.</li><li>Les variants de SLCO1B1 font varier le risque de 0,6 à 18 %.</li><li>CACNA1S, SCN4A et KCNJ2 sont des gènes de paralysies périodiques.</li></ul></template>
<template data-pop="pareto-g72-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g72-s-immuno-cours"></p><ul><li>Une faiblesse qui persiste après l’arrêt de la statine évoque une myopathie nécrosante à médiation immune (anti-HMGCR).</li><li>La myosite sous inhibiteur de point de contrôle survient en général le premier mois ; le chevauchement avec myocardite ou myasthénie tue environ 40 % des patients.</li><li>La myopathie de réanimation perd sa myosine sans infiltrat inflammatoire.</li></ul></template>
<template data-pop="pareto-g72-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g72-p-1,g72-p-2,g72-p-3,g72-p-4"></p><ul><li>Il faut d’abord retirer l’agent.</li><li>Il faut relire la liste des médicaments pour repérer les interactions de l’atorvastatine.</li><li>L’acétazolamide est utilisé hors étiquette en Suisse ; le potassium suit les plafonds de l’information professionnelle (150 mmol/jour par voie orale, 10 mmol/heure par voie intraveineuse si la kaliémie dépasse 2,5 mmol/L).</li></ul></template>
<template data-pop="g72-sm-faiblesse" data-title="Faiblesse vraie">
<div class="lab">Définition</div><p>La faiblesse est une perte de force mesurable ; la fatigue est une impression d’épuisement sans perte de force. Leur séparation est la première étape du bilan (Schubert et Schreiner, 2023).</p>
<div class="lab">Technique</div><p>Le médecin cote douze groupes musculaires (score MRC) et mesure la préhension au dynamomètre chez un patient coopérant (Rodriguez et coll., 2022 ; Latronico et coll., 2023).</p>
<div class="lab">Valeur et piège</div><p>Un score inférieur à 48 définit la faiblesse acquise en réanimation sans en donner la cause (Rodriguez et coll., 2022). La valeur diagnostique du testing n’est pas chiffrée dans les sources lues.</p></template>
<template data-pop="g72-sm-myalgie" data-title="Myalgie sous statine">
<div class="lab">Définition</div><p>Douleur, raideur, sensibilité ou crampe musculaire attribuée à la statine, habituellement symétrique et proximale (Stroes et coll., 2015).</p>
<div class="lab">Valeur</div><p>7 à 29 % en registres ; 9,4 % contre 4,6 % sous placebo dans STOMP (P = 0,054) (Stroes et coll., 2015). Dans 19 essais en aveugle (123 940 participants), l’excès est de 11 événements pour 1000 personnes-années la première année : une plainte sur quinze seulement est due à la statine (Cholesterol Treatment Trialists’ Collaboration, 2022).</p>
<div class="lab">Piège</div><p>Arrêter la statine sur ce seul symptôme prive le patient d’un bénéfice cardiovasculaire démontré (Cholesterol Treatment Trialists’ Collaboration, 2022).</p></template>
<template data-pop="g72-sm-urines" data-title="Urines foncées (myoglobinurie)">
<div class="lab">Mécanisme</div><p>La myoglobine libérée par les fibres détruites passe dans l’urine ; l’information professionnelle suisse de l’atorvastatine décrit une insuffisance rénale aiguë consécutive à une myoglobinurie (information professionnelle suisse Atorvastatin-Mepha, 2025).</p>
<div class="lab">Conduite</div><p>Une douleur sévère avec signes de myoglobinurie, ou une créatine kinase supérieure à 40 fois la limite, impose un bilan rénal (analyse d’urine, créatinine) (Stroes et coll., 2015).</p>
<div class="lab">Limite</div><p>La valeur diagnostique de ce signe n’est pas chiffrée dans les sources lues.</p></template>
<template data-pop="g72-sm-acces" data-title="Accès de faiblesse">
<div class="lab">Mécanisme</div><p>Une dépolarisation soutenue du sarcolemme inactive les canaux sodiques ; la fibre devient inexcitable et la paralysie est flasque (Statland et coll., 2018).</p>
<div class="lab">Caractérisation</div><p>Forme hypokaliémique : premier accès entre 5 et 35 ans, accès de plus de 2 heures. Forme hyperkaliémique : début avant 20 ans, accès de moins de 2 heures, raideur myotonique entre les accès chez environ la moitié des patients (Statland et coll., 2018).</p>
<div class="lab">Piège</div><p>Des troubles sensitifs ou une altération de la conscience orientent vers une autre cause ; des réflexes conservés dans un membre paralysé doivent aussi faire évoquer une autre cause, sans écarter à eux seuls la paralysie périodique (Statland et coll., 2018).</p></template>
<template data-pop="g72-sm-ici" data-title="Ptosis et diplopie sous immunothérapie">
<div class="lab">Mécanisme</div><p>La toxicité immunitaire des inhibiteurs de point de contrôle peut toucher ensemble le muscle, la jonction neuromusculaire et le myocarde (Gente et coll., 2026).</p>
<div class="lab">Valeur</div><p>Dans une revue systématique de 103 cas publiés de chevauchement, le ptosis (71,8 %) et la faiblesse (62,1 %) étaient les présentations les plus fréquentes (Soriano et coll., 2026). Ce chiffre décrit des cas publiés, non une sensibilité.</p>
<div class="lab">Conduite</div><p>Le médecin recherche le chevauchement cardiaque et respiratoire et commence sans délai une corticothérapie à forte dose (Gente et coll., 2026).</p></template>
