<p>Dans cette <b>vignette fictive</b>, un homme de 68 ans prend de l’atorvastatine depuis plusieurs années. Il y a dix jours, son médecin a ajouté de la clarithromycine pour une infection respiratoire. Il consulte pour des douleurs et une faiblesse des cuisses et des fesses : il ne se lève plus d’une chaise sans l’aide des bras. Ses urines sont devenues foncées. La créatine kinase dépasse 40 fois la limite supérieure de la normale et la créatinine est élevée. Ces valeurs pédagogiques servent à poser la question centrale du cours.</p>
<p>Devant une <b>faiblesse musculaire acquise</b>, le médecin cherche d’abord une cause <b>traitable ou réversible</b> : un médicament, l’alcool, un toxique, une anomalie de la kaliémie, une maladie critique ou une inflammation du muscle. La raison est pratique. Les revues de référence rappellent que la plupart des <button class="w" data-k="g72-toxique">myopathies toxiques (fréquence, causes et réversibilité)</button> régressent si l’agent est retiré tôt (Le Quang et coll., 2024). Dans la vignette, le retrait de la statine et la protection du rein précèdent toute autre exploration.</p>
<p>Ce cours traite les « autres myopathies » acquises ou non classées ailleurs. Il suit les sous-groupes suivants : la <b>myopathie médicamenteuse</b> (statines, corticoïdes, inhibiteurs de points de contrôle immunitaire), la <b>myopathie alcoolique</b>, les <b>myopathies d’autres toxiques</b>, les <b>paralysies périodiques</b>, les <b>myopathies inflammatoires non classées ailleurs</b>, la <b>myopathie de réanimation</b> et les causes plus rares. À la fin, le lecteur sait reconnaître chaque tableau, choisir l’examen utile, décider de l’arrêt d’un médicament et repérer l’urgence.</p>
<div class="key"><b>À retenir.</b> Une faiblesse acquise commande trois questions simultanées : quelle est la cause réversible, existe-t-il une urgence (rein, souffle, cœur), et quel examen tranche. L’ordre de lecture du cours suit ces trois questions.</div>
</section>

<section class="ilot" id="g72-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La catégorie G72 de la <button class="w" data-k="g72-cim">classification CIM-10-GM 2024 (sous-codes, exclusions et limites de codage)</button> réunit les myopathies <b>acquises ou non classées ailleurs</b>. Elle s’organise par cause : médicament (G72.0), alcool (G72.1), autres toxiques (G72.2), paralysies périodiques (G72.3), myopathie inflammatoire non classée ailleurs (G72.4), myopathie de réanimation (G72.80), autres myopathies précisées (G72.88) et myopathie sans précision (G72.9). Les codes G72.0 et G72.2 se complètent par un code du chapitre des causes externes qui identifie la substance. Le cours raisonne par mécanisme, parce que c’est le mécanisme qui commande l’examen et le traitement.</p>
<p>Le tableau ci-dessous présente les entités par mécanisme dominant. Il sert de carte de lecture : chaque ligne renvoie à un îlot ultérieur. Les trois colonnes répondent à la question « qu’est-ce qui est atteint, et à quoi le reconnaît-on ? ».</p>
<table class="t"><thead><tr><th>Entité</th><th>Mécanisme dominant</th><th>Signe d’orientation</th></tr></thead><tbody>
<tr><td>Myopathie aux statines</td><td>Atteinte directe de la fibre le plus souvent ; plus rarement auto-immune (<button class="w" data-k="g72-imnm">myopathie nécrosante à médiation immune (anticorps et évolution)</button>)</td><td>Douleur ou faiblesse proximale symétrique, 4 à 6 semaines après le début ou une hausse de dose</td></tr>
<tr><td>Myopathie cortisonique</td><td>Atrophie des fibres de type II par baisse de synthèse et hausse de dégradation des protéines</td><td>Faiblesse proximale indolore, créatine kinase normale ou peu élevée</td></tr>
<tr><td>Myopathie alcoolique</td><td>Baisse de la synthèse protéique, stress oxydatif, atteinte mitochondriale</td><td>Aiguë après une alcoolisation massive, ou chronique proximale progressive</td></tr>
<tr><td>Paralysies périodiques primaires</td><td>Mutation d’un canal ionique du muscle : dépolarisation, fibre inexcitable</td><td>Accès de faiblesse flasque déclenchés par l’alimentation ou le repos après l’effort</td></tr>
<tr><td>Myopathie de réanimation</td><td>Inexcitabilité de la membrane et perte préférentielle de myosine</td><td>Faiblesse diffuse symétrique après admission en réanimation, difficulté de sevrage ventilatoire</td></tr>
<tr><td>Myopathies inflammatoires non classées ailleurs</td><td>Inflammation ou auto-immunité du muscle (myosite à inclusions, myosite sous inhibiteur de point de contrôle, sarcoïdose)</td><td>Selon l’entité : fléchisseurs des doigts, début précoce après le traitement, hypercalcémie</td></tr>
</tbody></table>
<p>La classification par cause n’est pas toujours exclusive. Une statine peut produire une toxicité directe <b>ou</b> déclencher une myopathie auto-immune ; un patient en réanimation cumule souvent plusieurs atteintes. Le médecin classe donc d’abord par présentation, puis confirme par l’évolution après l’arrêt de l’agent suspect.</p>
<div class="trap"><span class="k">Piège</span> Les <button class="w" data-k="g72-eular">critères EULAR/ACR 2017 (classification des myopathies inflammatoires)</button> sont des critères de <b>classification</b> pour la recherche et les essais. Ils ne sont pas des critères diagnostiques et ne remplacent pas le jugement clinique (Lundberg et coll., 2017).</div>
<p>Une limite de codage reste ouverte : la place de la myosite à inclusions, de la myopathie nécrosante à médiation immune et de la myosite sous inhibiteur de point de contrôle immunitaire entre G72.4 et les catégories de myosite ou de polymyosite n’a pas été vérifiée dans l’index alphabétique. Le cours le dit plutôt que de trancher sans source.</p>
<div class="key"><b>À retenir.</b> G72 regroupe des causes différentes qui partagent un seul symptôme, la faiblesse. On classe par cause, car la cause décide de la conduite. Les critères de classification ne sont pas des critères diagnostiques.</div>
<button class="pareto-btn ui" data-k="pareto-g72-definition">▲ Loi de Pareto — Définition et classification</button>
</section>

<section class="ilot" id="g72-2"><h2><span class="n">2</span>Fréquence et données disponibles</h2>
<p>Les chiffres qui suivent proviennent de sources européennes et nord-américaines lues dans le cadre de ce cours. <b>Aucune donnée d’incidence suisse n’a été trouvée</b> pour ces entités : le lecteur ne doit pas transposer ces chiffres comme des taux suisses.</p>
<table class="t"><thead><tr><th>Entité</th><th>Donnée rapportée</th><th>Source et réserve</th></tr></thead><tbody>
<tr><td>Statines : symptômes musculaires</td><td>7 à 29 % des patients dans les registres et études observationnelles, beaucoup moins dans les essais randomisés en aveugle</td><td>Société européenne d’athérosclérose, 2015</td></tr>
<tr><td>Statines : myopathie sévère</td><td>1 sur 1000 à 1 sur 10 000 personnes aux doses usuelles ; rhabdomyolyse environ 1 sur 100 000 par an</td><td>Même consensus</td></tr>
<tr><td>Alcool</td><td>Myopathie chez 40 à 60 % des buveurs chroniques ; forme aiguë 0,5 à 2 %</td><td>Données nord-américaines (Simon et coll., 2017)</td></tr>
<tr><td>Paralysies périodiques (estimations)</td><td>Hyperkaliémique 1 sur 200 000 ; hypokaliémique 1 sur 100 000 ; syndrome d’Andersen-Tawil 1 sur 1 000 000</td><td>Statland et coll., 2018</td></tr>
<tr><td>Myopathie de réanimation</td><td>Incidence rapportée 9 à 86 % selon les études, environ 40 % dans une revue systématique</td><td>Rodriguez et coll., 2022 (Inselspital, Berne)</td></tr>
<tr><td>Myosite sous inhibiteur de point de contrôle</td><td>0,5 à 1 % ; plus élevée sous association de deux inhibiteurs</td><td>Gente et coll., 2026</td></tr>
</tbody></table>
<p>Ce tableau appelle trois commentaires. D’abord, l’écart entre les registres (7 à 29 %) et les essais en aveugle, où la fréquence est bien plus basse, montre qu’un symptôme musculaire isolé ne prouve pas la responsabilité de la statine : d’où l’intérêt de l’imputabilité par arrêt et réintroduction, décrite plus loin. Dans l’essai <button class="w" data-k="g72-eas">STOMP (essai de la Société européenne d’athérosclérose, classification et imputabilité)</button>, les myalgies concernaient 9,4 % des patients sous atorvastatine 80 mg et 4,6 % sous placebo (P = 0,054). Ensuite, l’arrêt du traitement atteint 75 % à deux ans dans certaines cohortes : une myalgie mal gérée fait donc perdre le bénéfice cardiovasculaire de la statine. Enfin, la fourchette en réanimation (9 à 86 %) est trop large pour servir de repère unique : la revue systématique citée par les auteurs bernois retient environ 40 %, avec des chiffres de 50 à 64 % dans le COVID-19 grave.</p>
<div class="key"><b>À retenir.</b> Les symptômes musculaires sous statine sont fréquents, la myopathie sévère est rare (1 sur 1000 à 1 sur 10 000) et la rhabdomyolyse exceptionnelle. Aucune de ces fréquences n’est suisse.</div>
<button class="pareto-btn ui" data-k="pareto-g72-definition2">▲ Loi de Pareto — Fréquence</button>
</section>

<section class="ilot" id="g72-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie suit la même chaîne dans toutes les entités : <b>un agent ou un état altère la fibre musculaire</b> (synthèse des protéines, énergie, excitabilité de la membrane ou intégrité), <b>la fibre perd sa force</b>, et le <b>reste du bilan reflète cette altération</b> (créatine kinase, tracé électrique, histologie). Chaque sous-section ci-dessous décrit cette chaîne pour un groupe de causes.</p>
<h3>3.1 Statines</h3>
<p>Plusieurs mécanismes sont proposés mais <b>aucun n’est établi chez l’humain</b> : dysfonction mitochondriale (baisse de la phosphorylation oxydative, déplétion en coenzyme Q10), baisse de la prénylation des protéines, baisse du cholestérol membranaire, altération de la signalisation calcique par le récepteur de la ryanodine et dégradation protéique accrue (Stroes et coll., 2015). Le <button class="w" data-k="g72-slco1b1">transporteur OATP1B1 et le gène <i>SLCO1B1</i> (génétique du risque)</button> module l’exposition : avec la simvastatine à forte dose, le risque de myopathie est de 18 % chez les homozygotes pour le variant rs4149056, 3 % chez les hétérozygotes et 0,6 % chez les non-porteurs. La toxicité est le plus souvent <b>directe</b>. Une minorité de cas est <b>auto-immune</b> : anticorps anti-HMGCR, expression du complexe majeur d’histocompatibilité de classe I à la surface de fibres intactes, prédisposition HLA ; elle exige un traitement immunosuppresseur prolongé (Pasnoor et coll., 2018 ; Stroes et coll., 2015).</p>
<h3>3.2 Corticoïdes</h3>
<p>La <button class="w" data-k="g72-cortico">myopathie cortisonique (atrophie des fibres de type II)</button> résulte d’un double mouvement : inhibition de la synthèse protéique (voie mTOR/IGF-1) et activation de la dégradation par le système ubiquitine-protéasome et l’autophagie-lysosome, via les facteurs FOXO et les atrogènes MuRF-1 et atrogine-1 (Solé et coll., 2026). Elle touche préférentiellement les fibres de type II, ce qui explique l’atrophie sélective et l’absence d’inflammation à la biopsie.</p>
<h3>3.3 Alcool</h3>
<p>Dans la <button class="w" data-k="g72-alcool">myopathie alcoolique (mécanismes, formes et réversibilité)</button>, la synthèse protéique baisse (voie mTORC1, IGF-1 diminué), la myostatine augmente, le stress oxydatif s’installe (CYP2E1), les mitochondries sont atteintes, l’inflammation (facteur de nécrose tumorale alpha, interleukine 6) s’associe à un défaut de régénération des cellules satellites. Une grande partie de ces données est animale. La dénutrition protéino-calorique et les carences (folates, thiamine, vitamine B6, zinc, fer, vitamine D) y contribuent (Simon et coll., 2017).</p>
<h3>3.4 Paralysies périodiques</h3>
<p>Une <button class="w" data-k="g72-canaux">dépolarisation soutenue du sarcolemme (canaux sodiques et inexcitabilité)</button> inactive les canaux sodiques et rend la fibre inexcitable : la paralysie est flasque. Dans la forme hypokaliémique, les mutations créent un courant de fuite anormal actif au repos ; la fibre se dépolarise paradoxalement quand le potassium extracellulaire baisse. Les gènes en cause sont <i>CACNA1S</i> (environ 60 % des familles) et <i>SCN4A</i> (environ 20 %) pour la forme hypokaliémique, <i>SCN4A</i> par gain de fonction pour la forme hyperkaliémique, <i>KCNJ2</i> (canal Kir2.1) pour le syndrome d’Andersen-Tawil et <i>KCNJ18</i> jusqu’à 3 % des formes thyrotoxiques (Statland et coll., 2018).</p>
<h3>3.5 Myopathie de réanimation</h3>
<p>L’inflammation systémique et la défaillance bioénergétique provoquent une atrophie par baisse de synthèse et hausse de dégradation (ubiquitine-protéasome). La membrane se dépolarise et perd des canaux Nav1.4 disponibles, d’où l’inexcitabilité de la fibre (modèles animaux et in vitro). Les lésions histologiques apparaissent dès le cinquième jour ; la surface des fibres diminue d’environ 4 % par jour au début (Rodriguez et coll., 2022 ; Latronico et Bolton, 2011). Cette cinétique rapide justifie la mobilisation précoce décrite plus loin.</p>
<h3>3.6 Myopathies inflammatoires</h3>
<p>La myosite sous inhibiteur de point de contrôle immunitaire est une toxicité immunitaire du traitement, parfois associée à une myocardite ou à une myasthénie (Gente et coll., 2026). Dans la myopathie nécrosante à médiation immune, trois sous-classes sont distinguées : anti-SRP, anti-HMGCR et séronégative (environ 20 % de l’ensemble) (Allenbach et coll., 2020).</p>
<div class="key"><b>À retenir.</b> Toxique ou critique, la fibre perd sa force par trois voies : moins de synthèse protéique, plus de dégradation, ou membrane inexcitable. Les statines cumulent un mécanisme direct (le plus fréquent) et, rarement, un mécanisme auto-immun.</div>
<button class="pareto-btn ui" data-k="pareto-g72-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g72-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se rangent en cinq familles : les médicaments, l’alcool et les autres toxiques, les canalopathies héréditaires du muscle, la maladie critique, et les atteintes inflammatoires ou métaboliques. Les revues de référence classent les <button class="w" data-k="g72-toxique">myopathies toxiques</button> comme <b>cause la plus fréquente de myopathie acquise</b> ; les statines, l’alcool et les corticoïdes sont les principaux responsables (Le Quang et coll., 2024). Le tableau relie chaque famille à ses agents documentés et à la raison pour laquelle le risque augmente.</p>
<table class="t"><thead><tr><th>Famille</th><th>Agents ou situations documentés</th><th>Pourquoi le risque augmente</th></tr></thead><tbody>
<tr><td>Statines</td><td>Atorvastatine et autres ; surtout après une hausse de dose ou l’ajout d’un médicament interagissant</td><td>Une exposition plus élevée de la statine accroît la toxicité sur la fibre</td></tr>
<tr><td>Corticoïdes</td><td>Corticothérapie prolongée</td><td>Dégradation protéique accrue et synthèse freinée</td></tr>
<tr><td>Inhibiteurs de points de contrôle</td><td>Un seul inhibiteur ou une association</td><td>Toxicité immunitaire ; plus fréquente sous association</td></tr>
<tr><td>Alcool</td><td>Alcoolisation massive aiguë ; consommation chronique avec dose cumulée élevée</td><td>Atteinte protéique, oxydative et mitochondriale ; dénutrition</td></tr>
<tr><td>Troubles du potassium et canalopathies</td><td>Mutations de <i>CACNA1S</i>, <i>SCN4A</i>, <i>KCNJ2</i> ; thyrotoxicose pour certaines formes</td><td>Canal ionique défectueux ; déclencheurs alimentaires ou d’effort</td></tr>
<tr><td>Maladie critique</td><td>Sepsis, défaillance multiviscérale, ventilation prolongée, curares, sédatifs</td><td>Inflammation systémique et défaillance bioénergétique</td></tr>
<tr><td>Inflammatoire ou métabolique</td><td>Sarcoïdose, myosite à inclusions, hypophosphatémie après fer intraveineux</td><td>Infiltration immunitaire ou déséquilibre phosphocalcique</td></tr>
</tbody></table>
<p>Le risque de myopathie sous <button class="w" data-k="g72-interactions">atorvastatine (interactions de l’information professionnelle suisse)</button> augmente avec les médicaments qui élèvent son exposition ou qui ont eux-mêmes une toxicité musculaire : ciclosporine et autres immunosuppresseurs, fibrates (le gemfibrozil surtout), niacine, inhibiteurs du CYP3A4 (macrolides dont la clarithromycine, azolés, inhibiteurs de protéase, diltiazem), létermovir, <b>acide fusidique systémique</b> (rhabdomyolyses parfois mortelles), colchicine et daptomycine. La ciclosporine à 5,2 mg/kg/jour multiplie l’aire sous la courbe de l’atorvastatine par 8,7 : c’est l’illustration chiffrée de la logique « plus d’exposition, plus de toxicité ».</p>
<p>Le consensus de la Société européenne d’athérosclérose liste les <button class="w" data-k="g72-risque">facteurs de risque de symptômes musculaires sous statine (terrain et circonstances)</button> : âge supérieur à 80 ans, sexe féminin, indice de masse corporelle bas, origine asiatique, hypothyroïdie non traitée, insuffisance rénale chronique de stades 3 à 5, atteinte hépatique, infection aiguë, traumatisme sévère, virus de l’immunodéficience humaine, diabète, carence en vitamine D, antécédent d’élévation de la créatine kinase ou de myopathie, activité physique intense, jus de pamplemousse en excès, alcool, cocaïne, amphétamines et héroïne (Stroes et coll., 2015).</p>
<div class="two"><div class="card"><h4>Cas suisse : fer intraveineux</h4><p>Une faiblesse musculaire légère avec hypophosphatémie sévère a été décrite après carboxymaltose ferrique par voie intraveineuse. Le mécanisme retenu est une hausse du <button class="w" data-k="g72-fer">FGF23 (phosphate, vitamine D et faiblesse)</button> : le rein perd du phosphate et l’activation de la vitamine D baisse (Giezendanner et coll., 2024). Il s’agit d’un cas isolé, non d’une fréquence.</p></div><div class="card"><h4>Cas suisse : sarcoïdose musculaire</h4><p>Une myopathie proximale avec œdème des avant-bras, hypercalcémie et vitamine D active élevée a présenté un aspect « tiger man » à la tomographie par émission de positons ; la biopsie a confirmé le diagnostic et les corticoïdes à forte dose ont amélioré rapidement la faiblesse (Bosma et coll., 2026). Cas isolé.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer d’emblée une douleur musculaire à la statine sans chercher une autre cause : hypothyroïdie, pseudo-polyarthrite rhizomélique ou effort inhabituel (Stroes et coll., 2015) peuvent la produire, et l’arrêt à tort prive le patient d’un traitement utile.</div>
<p>Pour les toxiques non médicamenteux de G72.2, pour la colchicine, la chloroquine et la zidovudine comme causes de myopathie, <b>aucune source lue n’autorise un développement</b> dans ce cours ; ils sont mentionnés comme causes possibles à rechercher dans l’anamnèse médicamenteuse, sans autre précision.</p>
<div class="key"><b>À retenir.</b> Devant une myopathie sous statine, la première question est : qu’est-ce qui a changé ? Une hausse de dose, un nouveau médicament (macrolide, fibrate, colchicine, acide fusidique) ou un nouveau terrain (infection, hypothyroïdie, insuffisance rénale) explique le plus souvent le déclenchement.</div>
<button class="pareto-btn ui" data-k="pareto-g72-causes">▲ Loi de Pareto — Causes et risque</button>
</section>

<section class="ilot" id="g72-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire sépare la <b>vraie faiblesse</b> de la <b>fatigue</b>, puis précise la topographie, l’évolution dans le temps, la sévérité, les symptômes et maladies associés, ainsi que l’anamnèse médicamenteuse et familiale (Schubert et Schreiner, 2023). Cette séparation est la première décision : une fatigue sans perte de force ne relève pas du même bilan. Le médecin demande dans cet ordre : quand la faiblesse a commencé, ce qui a changé juste avant (dose, médicament, alcoolisation, jeûne, hospitalisation), ce que le patient ne peut plus faire (se lever d’une chaise, monter un escalier, lever les bras), et si les urines ont foncé.</p>
<p>Les <button class="w" data-k="g72-atcd">antécédents à relever (médicaments, thyroïde, rein, famille)</button> orientent la cause : traitement par statine ou corticoïde, consommation d’alcool et sa durée, hypothyroïdie, insuffisance rénale, cancer traité par immunothérapie, séjour en réanimation, épisodes de faiblesse récidivants depuis l’enfance dans la famille. Les <button class="w" data-k="g72-symptomes">symptômes (douleur, faiblesse proximale, accès, urines foncées)</button> se lisent par sous-code.</p>
<div class="two"><div class="card"><h4>Statines : forme typique</h4><p>Douleur ou faiblesse habituellement <b>symétrique et proximale</b> (cuisses, fesses, mollets, dos). Le début se situe en général 4 à 6 semaines après l’introduction, parfois après des années, souvent après une hausse de dose ou l’ajout d’un médicament interagissant. À la réexposition, la récidive est plus rapide (Stroes et coll., 2015).</p></div><div class="card"><h4>Statines : forme immunitaire</h4><p>Faiblesse proximale <b>persistante</b> et créatine kinase élevée <b>qui persiste malgré l’arrêt</b> de la statine (information professionnelle suisse). L’évolution est souvent rapidement progressive et sévère (Allenbach et coll., 2020). Cas suisse : tétraparésie flasque subaiguë à réflexes conservés, échec de la prednisolone et de l’azathioprine, quasi-rémission après deux cures d’immunoglobulines (Hunziker et coll., 2022).</p></div></div>
<div class="two"><div class="card"><h4>Corticoïdes</h4><p>Faiblesse proximale <b>indolore</b>, atrophie sélective des membres inférieurs ; créatine kinase normale ou peu élevée (Solé et coll., 2026).</p></div><div class="card"><h4>Inhibiteur de point de contrôle</h4><p>Début médian environ <b>un mois</b> après le début du traitement ; chevauchement avec myocardite ou myasthénie en hausse (3,7 % avant 2017, 8,3 % après) (Gente et coll., 2026).</p></div></div>
<div class="two"><div class="card"><h4>Alcool aigu</h4><p>Après une alcoolisation massive : douleur, sensibilité, œdème, faiblesse proximale parfois focale et asymétrique ; variante rhabdomyolytique avec élévation de la créatine kinase et de la myoglobine, insuffisance rénale aiguë possible (Simon et coll., 2017).</p></div><div class="card"><h4>Alcool chronique</h4><p>Faiblesse proximale progressive sur semaines à mois, liée à la dose cumulée (plus de 10 kg d’alcool pur par kg de poids), avec atrophie et chutes (Simon et coll., 2017).</p></div></div>
<div class="two"><div class="card"><h4>Paralysies périodiques</h4><p>Transmission autosomique dominante, début dans la première ou deuxième décennie, <b>accès</b> de faiblesse flasque déclenchés par l’alimentation ou le repos après l’effort. Forme hypokaliémique : premier accès entre 5 et 35 ans, accès de plusieurs heures à jours, déclenché par les repas riches en glucides, l’alcool ou le repos après effort. Forme hyperkaliémique : début avant 20 ans, accès de moins de 2 heures, souvent le matin, déclenchés par les aliments riches en potassium, le jeûne, le froid, le stress ou la grossesse (Statland et coll., 2018).</p></div><div class="card"><h4>Réanimation</h4><p>Faiblesse <b>diffuse et symétrique</b> après l’admission, touchant les membres et les muscles respiratoires, <b>épargnant la face</b>, avec difficulté de sevrage ventilatoire (Latronico et coll., 2023).</p></div></div>
<div class="trap"><span class="k">Piège</span> Des accès de faiblesse avec <b>troubles sensitifs marqués</b> évoquent un syndrome de Guillain-Barré ; avec <b>altération de la conscience</b>, une crise ou un accident vasculaire cérébral ; avec <b>réflexes conservés dans le membre paralysé</b>, une autre cause qu’une paralysie périodique (Statland et coll., 2018).</div>
<div class="key"><b>À retenir.</b> Trois questions dominent l’anamnèse : qu’est-ce qui a changé avant la faiblesse, la douleur est-elle présente ou absente (indolore : cortisone, réanimation), la faiblesse est-elle permanente ou par accès (accès : paralysie périodique).</div>
</section>

<section class="ilot" id="g72-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit un ordre fixe : état général, paramètres vitaux, signes musculaires ciblés. Les paramètres vitaux comptent ici plus que d’habitude : la fréquence et l’effort respiratoires révèlent la faiblesse des muscles respiratoires (réanimation, myosite sous inhibiteur de point de contrôle), le rythme cardiaque et l’électrocardiogramme dépistent l’atteinte cardiaque (syndrome d’Andersen-Tawil, myocardite associée), et la couleur des urines oriente vers la myoglobine.</p>
<div class="two"><div class="card"><h4>État général et vitaux</h4><ul><li>État de conscience, nutrition, signes d’alcoolisation chronique.</li><li>Fréquence et travail respiratoires.</li><li>Fréquence et rythme cardiaques, tension artérielle ; couleur des urines.</li><li>Poids et amyotrophie visible des membres inférieurs.</li></ul></div><div class="card"><h4>Signes ciblés</h4><ul><li><button class="w" data-k="g72-mrc">Force par groupe musculaire (échelle du Medical Research Council)</button></li><li><button class="w" data-k="g72-proximal">Faiblesse proximale : se lever d’une chaise, lever les bras</button></li><li><button class="w" data-k="g72-prehension">Force de préhension (dynamomètre)</button></li><li><button class="w" data-k="g72-face">Face, yeux et muscles bulbaires</button></li><li><button class="w" data-k="g72-reflexes">Réflexes, sensibilité et sphincters</button></li><li><button class="w" data-k="g72-flechisseurs">Fléchisseurs des doigts et du cou (myosite à inclusions et critères EULAR/ACR)</button></li></ul></div></div>
<p>Chaque signe répond à une question. La force chiffrée par groupe musculaire (douze groupes pour le score de la faiblesse acquise en réanimation) distingue la faiblesse diffuse de la faiblesse focale. La face épargnée est un trait de la myopathie de réanimation, alors qu’un ptosis ou une ophtalmoplégie orientent vers une myasthénie. Des réflexes conservés dans un membre paralysé orientent vers une autre cause qu’une paralysie périodique. La faiblesse des fléchisseurs des doigts, sans réponse au traitement, définit le sous-groupe de la myosite à inclusions dans l’arbre EULAR/ACR (Lundberg et coll., 2017).</p>
<div class="trap"><span class="k">Erreur fréquente</span> Évaluer la force en demandant seulement au patient de serrer la main de l’examinateur. Une faiblesse proximale des cuisses ou des épaules passe inaperçue si l’on n’examine pas la marche, le lever de chaise et l’élévation des bras.</div>
<div class="key"><b>À retenir.</b> L’examen cherche trois choses : la distribution (proximale symétrique ou focale), l’extension (respiratoire, cardiaque, urines) et les signes qui orientent ailleurs (sensitifs, conscience, face).</div>
