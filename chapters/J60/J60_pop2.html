<template data-pop="j60-d-nintedanib" data-title="Nintédanib (Ofev®)"><p class="lab">Indications suisses</p><p>Chez l’adulte : fibrose pulmonaire idiopathique ; pneumopathies interstitielles diffuses fibrosantes chroniques avec un phénotype progressif ; pneumopathie interstitielle de la sclérodermie systémique. Le traitement est instauré par un médecin expérimenté.</p><p class="lab">Mécanisme</p><p>Inhibiteur intracellulaire des tyrosine kinases des récepteurs VEGFR, FGFR et PDGFR, qui freine la prolifération et la migration des fibroblastes.</p><p class="lab">Preuve</p><p>L’essai INBUILD a randomisé 663 patients atteints de pneumopathie fibrosante progressive autre que la fibrose idiopathique : le nintédanib a réduit le déclin annuel de la CVF de 107 mL. L’effet était homogène entre les sous-groupes diagnostiques, y compris celui des « autres » pneumopathies (12 % des patients) ; les pneumoconioses n’y sont pas individualisées dans les publications lues.</p><p class="lab">Dose et surveillance</p><p>La dose est de 150 mg deux fois par jour au cours d’un repas, ou de 100 mg en cas d’intolérance ou d’insuffisance hépatique Child-Pugh A. Le bilan hépatique est rapproché pendant les trois premiers mois, et la grossesse est une contre-indication.</p><div class="key"><b>Hors indication ?</b> Non, si la pneumoconiose répond aux critères de progression ; l’extrapolation porte sur l’absence de preuve propre aux pneumoconioses.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Ofev®, Swissmedic (AIPS, mise à jour 03.2025), consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32145830/" target="_blank" rel="noopener">Wells et al., Lancet Respir Med 2020</a>.</p></template>
<template data-pop="j60-d-corticoides" data-title="Glucocorticoïdes dans la bérylliose"><p class="lab">Preuve</p><p>Dans une série française de huit béryllioses sévères suivies 69 mois en médiane, les corticoïdes, après l’arrêt de l’exposition, ont amélioré les symptômes, la capacité vitale de 26 % et la DLCO de 15 %, et réduit les lésions actives en TDM. Dix-huit rechutes sont survenues à la décroissance ; à la dernière visite, tous les paramètres étaient stabilisés chez six patients sur huit.</p><p class="lab">Statut en Suisse et dose</p><p>L’information professionnelle de la prednisone mentionne le traitement palliatif de la sarcoïdose symptomatique, non la bérylliose : l’usage est hors indication. Aucune source lue ne fixe de dose propre à la bérylliose. Pour la sarcoïdose symptomatique, l’information professionnelle prévoit 15 à 30 mg par jour au départ, la dose minimale efficace ensuite et une décroissance par paliers au-delà de 8 à 10 jours ; l’appliquer à la bérylliose relève du centre spécialisé.</p><p class="lab">Précautions</p><p>Les glucocorticoïdes masquent les infections et peuvent réactiver une tuberculose ; au-delà de deux semaines, ils freinent l’axe corticotrope.</p><div class="key"><b>Limite.</b> Les sources lues ne recommandent pas de corticoïdes systémiques dans la silicose chronique ni dans les maladies de l’amiante ; la Suva ne mentionne, pour la silicose, que les corticoïdes inhalés de l’obstruction.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18757698/" target="_blank" rel="noopener">Marchand-Adam et al., 2008</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Prednisone Streuli®, Swissmedic (AIPS, mise à jour 06.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j60-d-rifampicine" data-title="Rifampicine (Rimactan®)"><p class="lab">Mécanisme</p><p>Inhibition de l’ARN polymérase ADN-dépendante bactérienne ; effet bactéricide sur <i>Mycobacterium tuberculosis</i>. Une résistance peut se développer rapidement : pour traiter une tuberculose, la rifampicine est toujours associée à d’autres antituberculeux.</p><p class="lab">Dose</p><p>L’adulte reçoit 10 mg/kg par jour (8 à 12), au plus 600 mg, à jeun, une demi-heure au moins avant un repas.</p><p class="lab">Contre-indications et interactions</p><p>Elle est contre-indiquée après une hépatite médicamenteuse, en cas d’hépatopathie aiguë, de cirrhose, de névrite périphérique, de porphyrie ou de clairance de la créatinine inférieure à 25 mL/min. Inducteur puissant, elle réduit de moitié l’exposition au nintédanib et rend la contraception hormonale inefficace.</p><div class="key"><b>Hors indication.</b> La monothérapie de quatre mois du traitement préventif suit le guide suisse de la tuberculose, non l’information professionnelle.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Rimactan®, Swissmedic (AIPS, mise à jour 10.2023), consultée le 09.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, version 1.2024</a>.</p></template>
<template data-pop="j60-d-isoniazide" data-title="Isoniazide"><p class="lab">Dose</p><p>L’adulte reçoit 5 mg/kg par jour (4 à 6), selon le tableau de l’Organisation mondiale de la santé repris par le guide suisse.</p><p class="lab">Interactions</p><p>Il inhibe le métabolisme de la phénytoïne, de la carbamazépine, de la primidone et de l’acide valproïque, dont la dose peut devoir baisser, et interagit avec l’acénocoumarol et les glucocorticoïdes.</p><p class="lab">Effets indésirables et précautions</p><p>La polynévrite touche 20 % des patients qui ne reçoivent pas de pyridoxine ; celle-ci, à 10 mg par jour dès le début, la prévient, surtout chez le diabétique, l’adolescent et le patient dénutri. L’hépatite devient plus fréquente avec l’âge (0,8 à 1,9 %) et avec la rifampicine (2,7 %). Une atteinte hépatique aiguë ou chronique impose l’avis d’un spécialiste avant tout traitement préventif.</p><div class="key"><b>Source.</b> L’information professionnelle de la préparation simple d’isoniazide n’a pas de texte sur la base AmiKo au 09.10.2026 ; les données viennent du guide suisse et de l’information professionnelle de l’association rifampicine-isoniazide (Rifinah®).</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, version 1.2024, chapitres 4 et 7</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Rifinah®, Swissmedic (AIPS, mise à jour 02.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j60-itl" data-title="Traitement préventif de l’infection tuberculeuse"><p class="lab">Indication</p><p>Toute personne infectée par <i>Mycobacterium tuberculosis</i> à risque accru de progression reçoit un traitement préventif, une fois la tuberculose active exclue. Le guide suisse range la silicose parmi les maladies qui augmentent modérément ce risque, et ces patients parmi les premiers candidats au traitement.</p><p class="lab">Schémas d’efficacité équivalente</p><table class="t"><tr><th>Schéma</th><th>Durée</th></tr><tr><td>Isoniazide quotidien</td><td>6 ou 9 mois</td></tr><tr><td>Rifampicine quotidienne</td><td>4 mois</td></tr><tr><td>Isoniazide et rifampicine quotidiens</td><td>3 mois</td></tr></table><p>Bien suivi, le traitement réduit jusqu’à 90 % le risque d’évolution vers la tuberculose. Le risque d’hépatite est plus faible avec la rifampicine qu’avec l’isoniazide. La rifapentine n’est pas disponible en Suisse.</p><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, version 1.2024, chapitre 4</a>.</p></template>
<template data-pop="j60-contentieux-tb" data-title="Contentieux : faut-il dépister systématiquement la tuberculose latente du silicotique ?"><p class="lab">Les positions</p><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>OMS, publiée dans l’Eur Respir J, 2015</td><td>Dépistage et traitement systématiques de l’infection tuberculeuse recommandés fortement chez les patients atteints de silicose</td></tr><tr><td>Suva, fiche Silicose, 2012</td><td>Contrôles bactériologiques réguliers des expectorations</td></tr><tr><td>Guide suisse de la tuberculose, version 1.2024</td><td>Silicose : risque de progression modérément accru, candidats prioritaires au traitement préventif ; dépistage systématique réservé aux situations listées (contacts, immunodépression, professions exposées), où la silicose ne figure pas</td></tr></table><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente est le guide suisse de 2024. Il ne range pas la silicose parmi les indications du dépistage systématique, mais il désigne le silicotique infecté comme l’un des premiers candidats au traitement préventif et pose qu’un test ne se fait que si un traitement est prévu en cas de résultat positif. Le cours en déduit une décision individuelle : le médecin propose un IGRA au silicotique s’il est prêt, avec lui, à traiter un résultat positif, et il recherche une tuberculose active devant toute aggravation.</p><p class="src">Textes : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, version 1.2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4664608/" target="_blank" rel="noopener">Getahun et al., Eur Respir J 2015</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a>.</p></template>
<template data-pop="j60-vaccins" data-title="Vaccinations du patient atteint de pneumoconiose"><p>Le Plan de vaccination suisse 2026 fonde les indications.</p><table class="t"><tr><th>Vaccin</th><th>Indication pertinente</th></tr><tr><td>Grippe saisonnière</td><td>Toute affection pulmonaire chronique</td></tr><tr><td>Pneumocoque, vaccin conjugué PCV20 ou PCV21 en dose unique</td><td>Toute personne de 65 ans ou plus ; avant 65 ans, selon la maladie associée (par exemple bronchopneumopathie obstructive de stade GOLD 3)</td></tr><tr><td>COVID-19</td><td>Dès 16 ans, pneumopathie interstitielle ou fibrose pulmonaire parmi les maladies préexistantes à risque ; en automne ou en hiver</td></tr></table><p>Dès 65 ans en présence d’un facteur de risque, et dès 75 ans pour tous, le Plan préfère un vaccin antigrippal à dose élevée. Les critères d’Helsinki recommandent aussi la vaccination contre la grippe et le pneumocoque en cas d’asbestose, sans essai spécifique.</p><p class="src">Références : <a href="https://www.bag.admin.ch/fr/plan-de-vaccination-suisse" target="_blank" rel="noopener">OFSP et CFV, Plan de vaccination suisse 2026</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-contentieux-vaccins" data-title="Contentieux : rythme de la vaccination pneumococcique"><p class="lab">Les positions</p><p>La fiche Silicose de la Suva (décembre 2012) recommande une vaccination antigrippale annuelle et une vaccination antipneumococcique tous les cinq ans, schéma qui correspondait au vaccin polysaccharidique. Le Plan de vaccination suisse 2026 ne recommande plus ce vaccin depuis 2014 et prévoit une dose unique de vaccin conjugué, PCV20 ou PCV21, selon l’âge et le risque.</p><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente, le Plan 2026, l’emporte : pas de rappel quinquennal, mais une dose unique de vaccin conjugué. La vaccination antigrippale annuelle reste commune aux deux textes.</p><p class="src">Textes : <a href="https://www.bag.admin.ch/fr/plan-de-vaccination-suisse" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012, texte en vigueur à sa date</a>.</p></template>
<template data-pop="j60-integrite" data-title="Indemnité pour atteinte à l’intégrité"><p class="lab">Définition</p><p>Prestation de l’assurance-accidents, versée en complément en cas d’atteinte importante et durable à l’intégrité physique due à une maladie professionnelle.</p><p class="lab">Calcul</p><p>Pour la silicose, elle se calcule selon la table 10 de la Suva, à partir des limitations fonctionnelles respiratoires mesurées. L’imagerie seule ne la fonde pas.</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/prevention/par-danger/materiaux-rayonnements-et-situations-a-risque/amiante/les-consequences-de-l-amiante" target="_blank" rel="noopener">Suva, maladies et prestations d’assurance</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a>.</p></template>
<template data-pop="j60-fraction-etiologique" data-title="Fraction étiologique et risque relatif supérieur à 2"><p class="lab">Raisonnement</p><p>La loi exige une cause professionnelle prépondérante, que la pratique traduit par une part supérieure à 50 % des causes. Selon la formule de Miettinen, la fraction étiologique vaut (risque relatif − 1) divisé par le risque relatif. Elle dépasse 50 % lorsque le risque relatif dépasse 2.</p><p class="lab">Exemple</p><p>Pour un risque relatif de 2,5, la fraction étiologique vaut 1,5/2,5, soit 60 % : la cause professionnelle est prépondérante. Le Tribunal fédéral des assurances a validé cette approche.</p><div class="key"><b>Nuance.</b> Les critères d’Helsinki 2014 estiment que le seuil peut être fixé plus bas que 2 selon les choix sociaux de chaque pays ; la Suisse retient le doublement.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-helsinki" data-title="Critères d’Helsinki (1997, mis à jour en 2014)"><p class="lab">Origine</p><p>Consensus international réuni à Helsinki en 1997, mis à jour en 2014 par l’Institut finlandais de santé au travail, sur le diagnostic des maladies de l’amiante et leur attribution.</p><p class="lab">Cancer bronchique</p><p>Un risque doublé est admis pour une exposition cumulée de 25 fibres-années, pour une charge pulmonaire de 2 millions de fibres d’amphibole de plus de 5 µm par gramme de tissu sec, ou en présence d’une asbestose ou d’un épaississement pleural diffus bilatéral. Une latence d’au moins dix ans est requise. Les plaques seules ne suffisent pas. Tous les types histologiques peuvent être attribués à l’amiante, et le tabac ne retranche rien à la part attribuable à l’amiante.</p><p class="lab">Apports de 2014</p><p>Dépistage par TDM à faible dose des exposés de risque comparable à celui de l’essai NLST ; cancers du larynx et de l’ovaire tenus pour causés par l’amiante ; seuils TDM de l’asbestose selon ICOERD ; fibrose rétropéritonéale considérée comme pouvant être causée par l’amiante. En Suisse, la Suva apprécie au cas par cas les cancers du larynx et de l’ovaire, faute de doublement du risque démontré.</p><p class="src">Références : <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., Scand J Work Environ Health 2015</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-efa" data-title="Fondation EFA"><p>La Fondation Fonds d’indemnisation des victimes de l’amiante (EFA) a été créée en 2017. Elle conseille et soutient financièrement les personnes atteintes d’un mésothéliome contracté en Suisse qui ne sont pas couvertes par l’assurance-accidents, en complément des prestations de l’assurance-maladie.</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/prevention/par-danger/materiaux-rayonnements-et-situations-a-risque/amiante/les-consequences-de-l-amiante" target="_blank" rel="noopener">Suva, maladies et prestations d’assurance</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-vme" data-title="Valeurs limites moyennes d’exposition"><p class="lab">Définition</p><p>Concentration moyenne admissible d’une substance dans l’air du poste de travail. La Suva les fixe en Suisse (ordonnance sur la prévention des accidents, article 50, alinéa 3), en concertation avec la Commission des valeurs limites de Suissepro. Respectées, elles protègent la grande majorité des travailleurs.</p><p class="lab">Cancérogènes sans seuil</p><p>Pour l’amiante, aucune concentration n’est sans risque : la valeur limite est fondée sur le risque, et l’exposition doit rester aussi basse que possible.</p><table class="t"><tr><th>Agent</th><th>Valeur en Suisse (liste en vigueur)</th><th>Repère européen</th></tr><tr><td>Amiante</td><td>0,01 fibre/ml depuis 2003 ; cancérogène avéré</td><td>0,1 fibre/ml dans la plupart des pays et l’Union européenne (Suva, 2019)</td></tr><tr><td>Silice cristalline alvéolaire (quartz, cristobalite, tridymite)</td><td>0,15 mg/m³ ; cancérogène avéré, toxicité critique : silicose et cancer pulmonaire</td><td>0,1 mg/m³ (directive européenne de 2017, selon Hoy 2022)</td></tr><tr><td>Béryllium et ses composés</td><td>0,0006 mg/m³ (fraction inhalable) ; sensibilisant</td><td>—</td></tr></table><p>La liste suisse retient la même valeur de 0,15 mg/m³ que la fiche de 2012. Une méta-analyse de 2024 plaide pour abaisser la limite à 0,05 mg/m³, surtout dans les mines.</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/services/grenzwerte" target="_blank" rel="noopener">Suva, liste des valeurs limites d’exposition en vigueur, export du 09.10.2026</a> ; <a href="https://www.suva.ch/fr-ch/download/directives-et-lois/valeurs-limites-d-exposition-aux-postes-de-travail/document--1903.f" target="_blank" rel="noopener">Suva, explications sur les valeurs limites d’exposition aux postes de travail</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9310854/" target="_blank" rel="noopener">Hoy et al., 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39107111/" target="_blank" rel="noopener">Howlett et al., 2024</a>.</p></template>
<template data-pop="j60-suivi-suva" data-title="Programme de suivi de la Suva après exposition à l’amiante"><p class="lab">Pourquoi la réforme de 2019</p><p>Pendant quarante ans, la Suva a proposé tous les deux à cinq ans une radiographie et une fonction respiratoire, pour dépister l’asbestose. Depuis 2012, ces examens n’en ont plus détecté de cas évident. L’ordonnance sur la radioprotection de 2018 exige une indication pour chaque imagerie, et le dépistage par TDM a révélé que 30 % des plaques échappaient à la radiographie.</p><p class="lab">Ce qui est proposé</p><table class="t"><tr><th>Groupe</th><th>Suivi</th></tr><tr><td>Exposition d’au moins 3 fibres-années</td><td>Conseil, anamnèse et bref examen tous les cinq ans jusqu’à 80 ans, examen technique seulement sur indication</td></tr><tr><td>Exposition inférieure à 3 fibres-années</td><td>Enregistrement nominatif, pas de suivi sans symptôme</td></tr><tr><td>Plaques pleurales</td><td>Contrôle à deux ans avec la même imagerie, puis tous les cinq ans sans examen technique</td></tr><tr><td>Désamianteurs</td><td>Suivi si l’activité a débuté avant 2005 et duré au moins dix ans</td></tr></table><p>Après 80 ans, le suivi se poursuit à la demande, sans préjudice pour les droits de l’assuré.</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/accident/pour-les-fournisseurs-de-prestations/suva-medical/publications/2020/juin/nouveautes-exposition-amiante" target="_blank" rel="noopener">Suva Medical, 2020</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-depistage-tdm" data-title="Dépistage du cancer bronchique par TDM chez les exposés à l’amiante"><p class="lab">Fondement</p><p>L’essai américain NLST a montré en 2011 qu’une TDM annuelle à faible dose réduit la mortalité par cancer bronchique des grands fumeurs de 55 à 74 ans. La Suva a transposé ce dépistage aux exposés à l’amiante dès 2012.</p><p class="lab">Résultats suisses</p><p>Jusqu’à fin 2017, 23 cancers ont été détectés, aux stades T1 (8), T2 (10) et T3 (5) ; aucun décédé n’avait de tumeur T1. Tous concernaient de gros fumeurs ; 13 ont été reconnus comme maladies professionnelles selon les critères d’Helsinki.</p><p class="lab">Critères depuis 2019</p><p>Âge de 55 à 75 ans ; exposition à l’amiante débutée avant 1985 et d’au moins dix ans ; tabagisme d’au moins 30 paquets-années ou asbestose. Le dépistage est annuel et volontaire, décidé par le médecin du travail régional de la Suva.</p><div class="key"><b>Message.</b> L’arrêt du tabac reste le meilleur moyen de prévenir le cancer du poumon ; il est abordé à chaque examen.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/accident/pour-les-fournisseurs-de-prestations/suva-medical/publications/2020/juin/nouveautes-exposition-amiante" target="_blank" rel="noopener">Suva Medical, 2020</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="pareto-j60-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j60-0,j60-1,j60-2,j60-3,j60-4,j60-5,j60-6"></p><ul><li>Une pneumoconiose est une maladie pulmonaire due à une poussière minérale ou métallique inhalée ; le nom de l’agent fonde la conduite.</li><li>Silice : nodules des régions supérieures, quatre formes selon l’intensité de l’exposition ; amiante : asbestose des bases et atteintes pleurales bénignes.</li><li>La silicose progresse après l’arrêt de l’exposition, car le cristal tue le macrophage et se recycle.</li><li>La silice expose à la tuberculose et à l’auto-immunité ; le béryllium cause une granulomatose qui imite la sarcoïdose.</li><li>Les plaques pleurales marquent une exposition significative ; elles ne sont pas un stade précoce de mésothéliome.</li><li>L’anamnèse professionnelle, datée et détaillée, est l’examen décisif ; la latence doit concorder avec la lésion.</li><li>L’examen mesure le retentissement : diffusion à l’effort, obstruction, restriction pleurale, cœur pulmonaire.</li></ul></template>
<template data-pop="pareto-j60-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j60-7"></p><ul><li>Exposition documentée, imagerie compatible et exclusion des autres causes font le diagnostic.</li><li>La radiographie lue selon la classification BIT méconnaît beaucoup de silicoses ; la TDM à faible dose lue selon ICOERD confirme.</li><li>Pléthysmographie, DLCO et ergospirométrie mesurent le retentissement.</li><li>Un aspect UIP isolé n’est pas une asbestose sans plaques associées.</li><li>Tuberculose, cancer, mésothéliome et bérylliose sont les diagnostics à ne pas manquer.</li></ul></template>
<template data-pop="pareto-j60-tt" data-title="Pareto — Complications et traitements"><p class="ratio" data-cover="j60-8,j60-9"></p><ul><li>Silicoprotéinose et silicotuberculose sont les deux urgences de la silice.</li><li>La silicose multiplie le risque de tuberculose par quatre ; la culture confirme.</li><li>Silice et amiante sont cancérogènes ; 25 fibres-années doublent le risque de cancer bronchique, et le tabac reste le premier facteur.</li><li>Aucun traitement ne fait régresser la fibrose : éviction, arrêt du tabac, bronchodilatateurs, traitement des infections et vaccination selon le Plan 2026.</li><li>Nintédanib si la fibrose progresse ; lavage total pour la silicoprotéinose ; corticoïdes pour la bérylliose ; transplantation pour les formes avancées.</li></ul></template>
<template data-pop="pareto-j60-crit" data-title="Pareto — Prévention, reconnaissance et critères"><p class="ratio" data-cover="j60-10,j60-11,j60-12,j60-13"></p><ul><li>Tout soupçon fondé est déclaré à l’assureur-accidents ; les plaques asymptomatiques sont enregistrées comme maladie professionnelle.</li><li>Un cancer est reconnu professionnel si le risque relatif dépasse 2 : critères d’Helsinki pour l’amiante, silicose de stade 1/1 pour la silice.</li><li>Prévention technique : substitution, mesures techniques, organisation, protection individuelle ; valeurs limites de 0,01 fibre/ml pour l’amiante et de 0,15 mg/m³ pour la silice cristalline alvéolaire.</li><li>Suivi de la Suva par conseil quinquennal dès 3 fibres-années ; dépistage annuel par TDM des plus exposés qui fument ou ont une asbestose.</li><li>Pierre artificielle, béryllium, métaux durs et exposition domestique sont les situations à reconnaître.</li></ul></template>
<template data-pop="pareto-j60-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j60-e-1,j60-e-2,j60-e-3"></p><ul><li>Chaque imagerie exige une indication ; la radiographie répétée sans motif n’est plus admise.</li><li>Classification BIT : petites opacités p, q, r ; profusion 1/1 ou plus pour une silicose ; grandes opacités A, B, C.</li><li>TDM sans injection, à faible dose, coupes fines et projections d’intensité maximale.</li><li>Silicose : obstruction, distension et baisse de la DLCO ; asbestose : restriction et DLCO basse ; plaques : fonction peu modifiée.</li><li>Un trouble purement obstructif n’est pas imputable à l’amiante.</li></ul></template>
<template data-pop="pareto-j60-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j60-p-1,j60-p-2,j60-p-3,j60-p-4"></p><ul><li>Le médicament suit la complication ; l’éviction reste le premier traitement.</li><li>Nintédanib 150 mg deux fois par jour si la fibrose progresse ; surveiller diarrhée, foie et grossesse.</li><li>Traitement préventif de la tuberculose : 6 ou 9 mois d’isoniazide, 4 mois de rifampicine ou 3 mois des deux.</li><li>La rifampicine baisse de moitié l’exposition au nintédanib et annule la contraception hormonale.</li><li>Corticoïdes hors indication pour la bérylliose ; aucun traitement spécifique de la silicose.</li></ul></template>
