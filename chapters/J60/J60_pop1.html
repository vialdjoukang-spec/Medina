<template data-pop="j60-pneumoconiose" data-title="Pneumoconiose"><p class="lab">Définition</p><p>La Suva définit les pneumoconioses comme des maladies pulmonaires liées à l’inhalation prolongée de poussières minérales ou métalliques. Elles sont toujours dues à des poussières inorganiques ; les maladies des poussières organiques, comme le poumon de fermier, n’en font pas partie.</p><p class="lab">Lésion</p><p>Selon la composition de la poussière, le poumon répond par une fibrose diffuse ou nodulaire, par une inflammation et par un dépôt de particules (AWMF, 2026). En Europe centrale, la grande majorité des « silicoses » sont en réalité des pneumoconioses à poussières mixtes, dues à des mélanges contenant une proportion variable de quartz (AWMF).</p><div class="key"><b>Conséquence.</b> Le diagnostic exige de nommer la poussière ; c’est elle qui fonde la prévention, la déclaration et le pronostic.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-mp" data-title="Maladie professionnelle en droit suisse"><p class="lab">Définition légale</p><p>Selon l’article 9, alinéa 1, de la loi fédérale sur l’assurance-accidents, une maladie est professionnelle lorsqu’elle est due, de manière prépondérante, à des facteurs professionnels, pour autant qu’une substance ou une affection inscrite à l’annexe 1 de l’ordonnance sur l’assurance-accidents en soit la cause. L’amiante figure à l’annexe 1.1, les pneumoconioses dues au quartz à l’annexe 1.2.</p><p class="lab">Conséquences</p><p>Une maladie professionnelle reconnue est assimilée à un accident professionnel : l’assureur-accidents prend en charge les traitements, verse des prestations en espèces et, en cas d’atteinte importante et durable, une indemnité pour atteinte à l’intégrité. Les maladies non professionnelles relèvent de l’assurance-maladie.</p><div class="key"><b>Mode d’emploi.</b> Le médecin annonce tout soupçon fondé à l’assureur-accidents compétent ; l’assureur instruit l’exposition et la causalité.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://www.suva.ch/fr-ch/prevention/par-danger/materiaux-rayonnements-et-situations-a-risque/amiante/les-consequences-de-l-amiante" target="_blank" rel="noopener">Suva, maladies et prestations d’assurance</a>.</p></template>
<template data-pop="j60-formes-silicose" data-title="Les quatre formes de la silicose"><p>L’intensité et la durée de l’exposition au quartz déterminent la forme clinique.</p><table class="t"><tr><th>Forme</th><th>Exposition</th><th>Délai d’apparition</th><th>Traits</th></tr><tr><td>Chronique simple</td><td>Modérée, prolongée</td><td>5 à 20 ans ou plus</td><td>Micronodules des régions supérieures, souvent asymptomatique</td></tr><tr><td>Chronique compliquée</td><td>Idem</td><td>Tardif</td><td>Fibrose massive progressive, obstruction</td></tr><tr><td>Accélérée</td><td>Intense, sur quelques mois</td><td>2 à 10 ans</td><td>Aspect identique à la forme chronique, progression rapide</td></tr><tr><td>Aiguë (silicoprotéinose)</td><td>Très intense, quelques semaines à 3 ans</td><td>Court</td><td>Comblement alvéolaire, insuffisance respiratoire</td></tr></table><p>La silicose de la pierre artificielle relève souvent de la forme accélérée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a>.</p></template>
<template data-pop="j60-fmp" data-title="Fibrose massive progressive"><p class="lab">Définition</p><p>Forme compliquée de la silicose et de la pneumoconiose des mineurs : les petites opacités confluent en consolidations de plus de 1 cm, les « cicatrices » silicotiques, souvent en haltère, orientées parallèlement à la paroi dans les régions supérieures. La classification BIT les cote A, B ou C selon leur taille.</p><p class="lab">Mécanisme et conséquences</p><p>Les masses se rétractent, migrent vers le hile, déforment bronches et vaisseaux et s’entourent d’emphysème. L’obstruction et la distension qui en résultent dominent la gêne du patient ; le cœur pulmonaire peut suivre.</p><div class="key"><b>Piège.</b> Un cancer bronchique débutant peut passer pour une progression de la fibrose massive ; la TEP-TDM aide, car le carcinome fixe en général davantage que le conglomérat.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-asbestose" data-title="Asbestose"><p class="lab">Définition</p><p>Fibrose interstitielle diffuse du poumon due à l’inhalation de poussière d’amiante (critères d’Helsinki). Elle suppose une exposition prolongée et intense, en règle nettement supérieure à la valeur limite actuelle ; une asbestose visible sans technique invasive suppose environ 5 fibres-années au moins (Suva, 2020).</p><p class="lab">Clinique et fonction</p><p>Elle prédomine aux bases, s’accompagne souvent de lésions pleurales et, aux stades avancés, donne une dyspnée, une restriction et une baisse de la diffusion.</p><p class="lab">Limite</p><p>Ni la clinique ni l’histologie ne la distinguent sûrement des autres fibroses sans preuve d’exposition. Un aspect UIP isolé ne lui est pas attribué de façon fiable sans plaques associées (AWMF, 2020).</p><div class="key"><b>Conséquence.</b> L’asbestose accroît le risque de cancer bronchique et suffit, selon la Suva, à faire reconnaître un tel cancer comme professionnel.</div><p class="src">Références : <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a> ; <a href="https://www.suva.ch/fr-ch/accident/pour-les-fournisseurs-de-prestations/suva-medical/publications/2020/juin/nouveautes-exposition-amiante" target="_blank" rel="noopener">Suva Medical, 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33728629/" target="_blank" rel="noopener">Kraus et Teschler, 2021</a>.</p></template>
<template data-pop="j60-plaques" data-title="Plaques pleurales"><p class="lab">Définition</p><p>Plages circonscrites de fibrose hyaline de la plèvre pariétale, formées lentement le long des côtes, sur les coupoles diaphragmatiques et la plèvre médiastinale, souvent calcifiées. Ce sont les lésions les plus fréquentes de l’amiante : elles existent chez plus de la moitié des travailleurs directement exposés, après une latence de vingt à trente ans.</p><p class="lab">Signification</p><p>Elles sont un marqueur quasi pathognomonique d’une exposition significative ; dans les régions où elles ne sont pas endémiques, 80 à 90 % des plaques bien définies sont attribuables à une exposition professionnelle. Elles ne causent habituellement ni symptôme ni retentissement fonctionnel et ne sont pas un stade précoce de mésothéliome.</p><p class="lab">Évolution</p><p>Le risque d’évolution est faible : extension des plaques dans 5 à 10 % des cas, épaississement diffus dans 2 à 5 %, mésothéliome dans 1 à 2 % (Ferreiro, 2025).</p><div class="key"><b>Conduite.</b> Déclaration à l’assureur-accidents, conseil, arrêt du tabac ; contrôle à deux ans puis tous les cinq ans selon la Suva. Seules, elles ne suffisent pas à attribuer un cancer bronchique à l’amiante.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-berylliose" data-title="Bérylliose chronique"><p class="lab">Définition</p><p>Granulomatose multisystémique due à une sensibilisation de type retardé au béryllium, qui touche surtout le poumon. Cliniquement, fonctionnellement et histologiquement, elle ne se distingue pratiquement pas de la sarcoïdose ; elle n’atteint cependant pas l’œil.</p><p class="lab">Épidémiologie</p><p>Dans une usine américaine citée par la Suva, 9,8 % de 264 travailleurs étaient sensibilisés et 2,3 % avaient une bérylliose ; la sensibilisation suit la concentration de béryllium, la maladie l’exposition cumulée. La latence est en général d’une dizaine d’années ; la maladie survient souvent après 40 ans et touche autant les femmes que les hommes.</p><p class="lab">Clinique</p><p>Dyspnée d’effort, toux irritative et fatigue s’installent insidieusement. L’imagerie montre des opacités micronodulaires ; la fonction peut être restrictive, obstructive ou limitée à une baisse de la diffusion. Hypercalcémie et lithiases sont possibles.</p><div class="key"><b>Conduite.</b> Éviction, déclaration à la Suva, corticoïdes si la maladie est active. Toute sarcoïdose mérite une anamnèse professionnelle.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique-berylliose--bases-de-la-med--du-trav/fiche-thematique-berylliose--bases-de-la-med--du-trav" target="_blank" rel="noopener">Suva, bérylliose, 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/16540500/" target="_blank" rel="noopener">Müller-Quernheim et al., 2006</a>.</p></template>
<template data-pop="j60-metaux-durs" data-title="Pneumopathie des métaux durs"><p class="lab">Définition</p><p>Fibrose pulmonaire due aux métaux durs, alliages de carbure de tungstène et de cobalt utilisés pour les outils de coupe et de forage. Son aspect histologique typique est la pneumopathie interstitielle à cellules géantes : fibrose centrolobulaire et cellules géantes multinucléées intra-alvéolaires qui phagocytent d’autres cellules. Le cobalt en serait l’agent principal, car une maladie semblable survient chez des travailleurs exposés au cobalt sans carbure de tungstène (Nemery, 1990).</p><p class="lab">Limite</p><p>L’aspect n’est pas pathognomonique : dans une série japonaise, 40 des 59 malades prouvés par la détection de tungstène avaient l’aspect à cellules géantes, et 13 aspects à cellules géantes ne contenaient ni tungstène ni cobalt (Moriyama, 2025). La maladie a récidivé sur des greffons pulmonaires.</p><div class="key"><b>Conséquence.</b> L’analyse élémentaire du tissu, demandée à un laboratoire spécialisé, rattache la lésion au métal.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/2178966/" target="_blank" rel="noopener">Nemery, Eur Respir J 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40815182/" target="_blank" rel="noopener">Moriyama et al., 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39438781/" target="_blank" rel="noopener">Fortarezza et al., 2025</a>.</p></template>
<template data-pop="j60-autres-poussieres" data-title="Sidérose, talcose et aluminose"><p class="lab">Sidérose</p><p>L’inhalation de composés du fer cause une pneumoconiose avec peu ou pas de fibrose (Nemery, 1990). Chez les soudeurs à l’arc, la TDM montre surtout des nodules centrolobulaires flous et du verre dépoli, sans les masses ni les adénopathies de la silicose ; les opacités peuvent régresser après l’éviction (Takahashi, 2018). Une exposition intense et prolongée aux fumées de soudage de l’acier peut toutefois causer une fibrose du type bronchiolite respiratoire, puis pneumopathie desquamative (Cosgrove, 2015).</p><p class="lab">Talcose</p><p>Le talc inhalé cause une talcosilicose, une talco-asbestose ou une talcose pure selon les minéraux associés ; une quatrième forme touche les usagers de drogues injectées. La TDM associe des nodules centrolobulaires et des masses contenant des zones très denses ; le microscope polarisé montre des particules aciculaires biréfringentes dans des cellules géantes (Marchiori, 2010).</p><p class="lab">Aluminium</p><p>La recommandation AWMF range l’aluminium, avec le béryllium, le titane et le zirconium, parmi les métaux capables de produire des granulomes pulmonaires ; elle le cite aussi parmi les poussières métalliques capables d’induire une protéinose alvéolaire. Nemery décrit une fibrose occasionnelle chez les sujets exposés à l’aluminium ou au titane, probablement par réaction immunitaire à médiation cellulaire. Les sources lues ne donnent ni fréquence ni critères diagnostiques de l’aluminose : c’est une lacune de ce cours.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/2178966/" target="_blank" rel="noopener">Nemery, 1990</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30292280/" target="_blank" rel="noopener">Takahashi et al., 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26152561/" target="_blank" rel="noopener">Cosgrove, Occup Med 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20155272/" target="_blank" rel="noopener">Marchiori et al., Lung 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026, tableau 2</a>.</p></template>
<template data-pop="j60-coeur-pulmonaire" data-title="Cœur pulmonaire de la silicose"><p class="lab">Définition</p><p>Surcharge du cœur droit due à l’élévation de la pression dans la circulation pulmonaire, elle-même consécutive à une obstruction sévère évolutive et à l’emphysème (Suva, 2012).</p><p class="lab">Conséquence</p><p>Son apparition assombrit le pronostic de la silicose, au même titre que la sévérité de l’obstruction et de la baisse de la diffusion. La recommandation AWMF fait rechercher la surcharge droite par échocardiographie, réservant le cathétérisme droit aux cas choisis (cours I27).</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-pierre-artificielle" data-title="Silicose de la pierre artificielle"><p class="lab">Le matériau</p><p>La pierre artificielle sert surtout aux plans de cuisine et de salle de bains. Sa teneur en silice est très élevée ; sa découpe et son polissage à sec libèrent des concentrations considérables de silice alvéolaire.</p><p class="lab">Les malades</p><p>Ce sont des hommes jeunes, souvent migrants, employés de très petites entreprises. Au Queensland, 236 des 1053 tailleurs de pierre dépistés (22,4 %) avaient une silicose, dont 32 une fibrose massive. Des épidémies ont été décrites en Espagne et en Israël. La première série britannique (2024) comptait huit hommes d’âge médian 34 ans, qui découpaient et polissaient à sec ; deux ont été adressés pour une évaluation de transplantation et la clinique imitait parfois une sarcoïdose.</p><p class="lab">L’évolution</p><p>La maladie progresse vite, même après l’arrêt de l’exposition : VEMS en baisse de 386 mL par an et CVF de 448 mL par an dans une série australienne. Chaque année d’exposition augmente de 9 % le risque de fibrose massive ; certains patients ont dû être transplantés.</p><div class="key"><b>Conduite.</b> Toute dyspnée ou toute micronodulation chez un ouvrier de la pierre artificielle impose une TDM, une éviction immédiate et une déclaration.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9310854/" target="_blank" rel="noopener">Hoy et al., 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28882991/" target="_blank" rel="noopener">Hoy et al., 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39107113/" target="_blank" rel="noopener">Feary et al., Thorax 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-biopersistance" data-title="Biopersistance et géométrie des fibres"><p class="lab">Définition</p><p>Durée pendant laquelle une particule résiste à l’élimination et à la dissolution dans le poumon. Plus une fibre persiste, plus elle entretient l’inflammation et les lésions fibrosantes ou cancérogènes.</p><p class="lab">Ce qui rend une fibre dangereuse</p><p>Sont biologiquement significatives les fibres de plus de 5 µm de long, de moins de 3 µm de diamètre et de rapport longueur sur diamètre supérieur à 3 (« fibres OMS »). Les fibres longues de plus de 8 µm et fines de moins de 0,25 µm seraient les plus dangereuses (hypothèse de Stanton). Les amphiboles, rigides et biopersistantes, sont plus cancérogènes que le chrysotile, plus rapidement épuré.</p><div class="key"><b>Conséquence.</b> Le chrysotile s’élimine plus vite : pour lui, l’anamnèse en fibres-années estime mieux le risque que le compte des fibres dans le poumon (critères d’Helsinki).</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-nodule-silicotique" data-title="Nodule silicotique"><p class="lab">Structure</p><p>Centre de collagène disposé en couches concentriques, en bulbe d’oignon, entouré d’une couronne lâche de cellules chargées de poussière. Les cristaux, biréfringents en lumière polarisée, sont visibles dans le granulome.</p><p class="lab">Dynamique</p><p>La couronne est la zone de croissance : les cristaux libérés par les macrophages morts y sont repris par de nouveaux macrophages, ce qui explique la progression après l’arrêt de l’exposition. Les nodules confluent en cicatrices, dont le centre peut se nécroser par ischémie.</p><div class="key"><b>Piège.</b> Un granulome impose toujours de chercher une infection associée, par colorations des bacilles acido-alcoolo-résistants et des champignons.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-silicotuberculose" data-title="Silicotuberculose"><p class="lab">Définition</p><p>Tuberculose pulmonaire active survenant chez un patient atteint de silicose. Elle peut provenir d’une contamination récente ou de la réactivation de bacilles persistant dans les nodules.</p><p class="lab">Fréquence et mécanisme</p><p>La silicose multiplie par 4,01 le risque de tuberculose ; le risque est plus grand en cas d’exposition forte, de silicose aiguë ou rapidement progressive et chez le sujet âgé, car la silice favorise la réplication des mycobactéries et leur sortie des macrophages.</p><p class="lab">Diagnostic</p><p>Cavités, nodules asymétriques, arbre en bourgeons et aggravation rapide orientent ; la cavitation est l’indice le plus fort. L’examen direct est souvent négatif et seule la culture confirme.</p><p class="lab">Traitement</p><p>La phase initiale standard dure deux mois. La Suva souligne un traitement prolongé et un risque élevé de récidive. La recommandation allemande de 2022, citée par l’AWMF, porte la continuation à six à dix mois (huit à douze mois au total), car les médicaments pénètrent mal le tissu fibreux. Le guide suisse de 2024 n’a pas de schéma propre à la silicose ; il prolonge à neuf mois la tuberculose cavitaire dont la culture reste positive après deux mois. La durée se décide avec un spécialiste.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9310854/" target="_blank" rel="noopener">Hoy et al., 2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, version 1.2024</a>, chapitre 7 ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a>.</p></template>
<template data-pop="j60-fibres-annees" data-title="Fibres-années"><p class="lab">Définition</p><p>Unité de dose cumulée d’amiante : concentration moyenne en fibres par millilitre d’air multipliée par le nombre d’années de travail. Dix ans à 0,3 fibre/ml représentent ainsi 3 fibres-années.</p><p class="lab">Seuils utiles</p><table class="t"><tr><th>Dose</th><th>Signification</th></tr><tr><td>3 fibres-années</td><td>Entrée dans le suivi de médecine du travail de la Suva</td></tr><tr><td>Environ 5 fibres-années</td><td>Asbestose détectable sans technique invasive</td></tr><tr><td>25 fibres-années</td><td>Doublement du risque de cancer bronchique (critères d’Helsinki)</td></tr></table><div class="key"><b>Limite.</b> La dose est le plus souvent reconstituée par un spécialiste d’hygiène du travail à partir du métier et des tâches ; la Suva retient pour cela des valeurs hautes, favorables à l’assuré.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://www.suva.ch/fr-ch/accident/pour-les-fournisseurs-de-prestations/suva-medical/publications/2020/juin/nouveautes-exposition-amiante" target="_blank" rel="noopener">Suva Medical, 2020</a>.</p></template>
<template data-pop="j60-hla-glu69" data-title="HLA-DPB1 Glu69 et bérylliose"><p class="lab">Définition</p><p>Variant du gène HLA-DPB1 qui code un acide glutamique en position 69 de la chaîne bêta de la molécule HLA-DP.</p><p class="lab">Données</p><p>Dans l’industrie nucléaire américaine, ce génotype multipliait le risque de sensibilisation ou de bérylliose par 6,06 ; une exposition moyenne supérieure à 0,1 µg/m³ par 3,98 ; l’association des deux par 24,1 (rapports de cotes cités par la Suva). Le variant figurait aussi parmi les paramètres de la série européenne de Marchand-Adam.</p><div class="key"><b>Conséquence.</b> La susceptibilité génétique explique qu’une minorité seulement des exposés tombe malade ; elle ne remplace ni la preuve de l’exposition ni le test au béryllium.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique-berylliose--bases-de-la-med--du-trav/fiche-thematique-berylliose--bases-de-la-med--du-trav" target="_blank" rel="noopener">Suva, bérylliose, 2012</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18757698/" target="_blank" rel="noopener">Marchand-Adam et al., 2008</a>.</p></template>
<template data-pop="j60-anamnese-pro" data-title="Anamnèse professionnelle structurée"><p class="lab">Méthode</p><p>Les critères d’Helsinki rappellent qu’un historique de travail fiable est la mesure la plus utile de l’exposition, et que des questionnaires structurés permettent de repérer une exposition significative. Le médecin reprend chaque emploi depuis l’apprentissage : années, entreprise, branche, tâche exacte, matériaux, outils, travail à sec ou à l’humide, ventilation, masque.</p><p class="lab">Questions qui rapportent</p><p>Pour l’amiante : isolation, flocage, amiante-ciment, garnitures de frein, joints, colles, mastics, travaux avant 1990, rénovations ultérieures. Pour le quartz : forage, taille, sablage, fonderie, céramique, pierre artificielle. Pour le béryllium : alliages de cuivre, prothèse dentaire, horlogerie, bijouterie. Les expositions des proches, par les vêtements de travail, sont aussi recherchées.</p><div class="key"><b>Piège.</b> « Je n’ai jamais touché l’amiante » ne suffit pas : beaucoup de métiers l’ont côtoyé sans le manipuler directement, par exemple à proximité d’isolations détruites.</div><p class="src">Références : <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-pleuresie-benigne" data-title="Pleurésie bénigne de l’amiante"><p class="lab">Définition</p><p>Épanchement pleural exsudatif dû à l’amiante, souvent unilatéral (80 %), parfois éosinophile ou hémorragique, sans caractère biochimique distinctif. Il survient tôt, souvent moins de dix ans après le début de l’exposition ; 21 % des patients atteints d’asbestose en ont présenté un dans une série ancienne.</p><p class="lab">Diagnostic d’exclusion</p><p>Il exige une exposition prouvée par l’anamnèse, l’exclusion des autres causes (infection, tuberculose, cancer, embolie, pancréatite, connectivite) et l’absence de tumeur pendant trois ans. La cytologie et la biopsie pleurale sont nécessaires pour exclure un mésothéliome.</p><p class="lab">Évolution</p><p>Il régresse spontanément en trois à quatre mois en moyenne, récidive dans un tiers des cas et peut laisser un épaississement pleural diffus. Il n’est drainé que s’il cause une dyspnée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-epaississement-diffus" data-title="Épaississement pleural diffus"><p class="lab">Définition</p><p>Fibrose étendue de la plèvre viscérale, souvent adhérente à la plèvre pariétale, définie en radiographie par un épaississement d’au moins 3 mm en continuité avec un cul-de-sac costodiaphragmatique comblé. Il succède en général à une pleurésie bénigne ou à des pleurites répétées ; sa latence moyenne atteint 34 ans.</p><p class="lab">Conséquences</p><p>Contrairement aux plaques, il limite la mobilité du poumon : trouble restrictif, baisse de la CVF, des volumes et de la DLCO, parfois insuffisance ventilatoire hypercapnique sans fibrose pulmonaire. Bilatéral et étendu, il témoigne d’une exposition proche de celle de l’asbestose et suffit à faire reconnaître un cancer bronchique.</p><div class="key"><b>Conduite.</b> Surveillance des symptômes et de la fonction ; décortication exceptionnelle si la progression est importante sans fibrose pulmonaire.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-atelectasie-ronde" data-title="Atélectasie ronde"><p class="lab">Définition</p><p>Collapsus périphérique d’une portion de poumon enroulée contre une plèvre viscérale épaissie. La TDM montre une masse arrondie au contact de la plèvre, d’où partent vers le hile des vaisseaux et des bronches incurvés : le signe de la « queue de comète ». Dans une série de cent cas, 95 % siégeaient dans le lobe moyen, la lingula ou les lobes inférieurs.</p><p class="lab">Mécanisme</p><p>Trois hypothèses complémentaires : repli du poumon comprimé par un épanchement cloisonné, rétraction d’un foyer de fibrose de la plèvre viscérale, distorsion des petites bronches avec résorption de l’air d’aval.</p><div class="key"><b>Conduite.</b> Le retentissement est en général minime et aucun traitement n’est nécessaire. Une TDM tous les six mois pendant deux ans vérifie la stabilité ; une TEP-TDM ou une ponction sont réservées au doute tumoral.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-bit" data-title="Classification BIT des radiographies de pneumoconiose"><p class="lab">Principe</p><p>Lecture standardisée de la radiographie de face par comparaison à des clichés types du Bureau international du Travail, dans sa révision de 2022 pour les images numériques. Elle code la forme et la taille des petites opacités, leur profusion en tiers et les grandes opacités.</p><table class="t"><tr><th>Élément</th><th>Codage</th></tr><tr><td>Petites opacités arrondies</td><td>p jusqu’à 1,5 mm ; q jusqu’à 3 mm ; r jusqu’à 10 mm</td></tr><tr><td>Petites opacités irrégulières</td><td>s, t, u</td></tr><tr><td>Profusion</td><td>De 0/1 à 3/3 ; 1/0 suspicion, 1/1 silicose débutante</td></tr><tr><td>Grandes opacités</td><td>A, B, C</td></tr></table><p class="lab">Valeur et limites</p><p>Pour la silicose, la déclaration repose sur une profusion de 1/1 ou plus en opacités p, q ou r avec gradient apico-basal. Mais la radiographie se trompe jusqu’à 30 % des cas dans les catégories basses et corrèle mal avec la fonction.</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-tdm-icoerd" data-title="TDM à faible dose et classification ICOERD"><p class="lab">Technique</p><p>L’examen se fait sans injection, à dose adaptée à la corpulence, avec coupes fines et projections d’intensité maximale ; une TDM injectée à dose standard le remplace si une tumeur est suspectée. Les examens antérieurs sont revus avant toute nouvelle irradiation.</p><p class="lab">Lecture ICOERD</p><p>La classification internationale des maladies professionnelles et environnementales en TDM compare les coupes à des examens de référence et attribue des grades par région.</p><table class="t"><tr><th>Maladie</th><th>Seuil</th></tr><tr><td>Silicose</td><td>Micronodules bien limités de grade 1 au moins dans les régions supérieures droite et gauche (somme d’au moins 2) ; seuil inférieur admis si des ganglions silicotiques sont associés</td></tr><tr><td>Asbestose</td><td>Somme de grades d’au moins 2 à 3 pour les opacités irrégulières bilatérales des bases, ou d’au moins 2 pour le rayon de miel</td></tr></table><div class="key"><b>Piège.</b> Une fibrose limitée existe dans la population générale et augmente avec l’âge ; le seuil ICOERD évite d’étiqueter « asbestose » une anomalie banale.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-efr" data-title="Épreuves fonctionnelles dans les pneumoconioses"><p class="lab">Bilan</p><p>Devant une suspicion de silicose, la Suva et l’AWMF demandent une pléthysmographie, une DLCO et une ergospirométrie. Les critères d’Helsinki recommandent une spirométrie tous les trois à cinq ans chez les exposés à l’amiante, la DLCO au bilan initial et en cas d’asbestose, mais pas pour le dépistage répété.</p><p class="lab">Gradation de la DLCO (AWMF)</p><table class="t"><tr><th>Atteinte</th><th>DLCO</th></tr><tr><td>Normale</td><td>Au-dessus de la LIN</td></tr><tr><td>Légère</td><td>Sous la LIN et au moins 60 % de la valeur prédite</td></tr><tr><td>Modérée</td><td>De 40 à moins de 60 %</td></tr><tr><td>Sévère</td><td>Moins de 40 %</td></tr></table><div class="key"><b>Limite.</b> Le tabac confond l’interprétation ; les anomalies existent pourtant chez des silicotiques non fumeurs.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026, tableau 8</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-corps-asbestosiques" data-title="Corps asbestosiques et charge en fibres"><p class="lab">Principe</p><p>Le compte des corps asbestosiques en microscopie optique et des fibres en microscopie électronique, dans le liquide de lavage ou le tissu, complète l’anamnèse lorsque l’exposition est incertaine. Chaque laboratoire établit ses propres valeurs de référence.</p><table class="t"><tr><th>Mesure</th><th>Seuil d’exposition probable</th><th>Seuil de doublement du risque de cancer (Suva)</th></tr><tr><td>Corps asbestosiques par millilitre de lavage</td><td>Plus de 1</td><td>5</td></tr><tr><td>Corps asbestosiques par gramme de tissu sec</td><td>Plus de 1000</td><td>Plus de 5000</td></tr><tr><td>Fibres d’amphibole de plus de 5 µm par gramme de tissu sec</td><td>Plus de 0,1 million</td><td>Plus de 2 millions</td></tr></table><div class="key"><b>Limite.</b> Le chrysotile s’épure plus vite que les amphiboles : un compte bas n’exclut pas une exposition ancienne au chrysotile.</div><p class="src">Références : <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a>.</p></template>
<template data-pop="j60-belpt" data-title="Test de prolifération lymphocytaire au béryllium"><p class="lab">Principe</p><p>Des lymphocytes du patient sont mis en présence de béryllium ; leur prolifération prouve une sensibilisation de type retardé. Le diagnostic de bérylliose exige un test positif dans deux laboratoires indépendants ; en 2012, la Suva indiquait qu’en Suisse l’Institut de santé au travail de Lausanne le pratiquait.</p><p class="lab">Valeur</p><p>Sa sensibilité est très élevée : un test négatif exclut une bérylliose chronique. Les faux positifs vont de 0 à 3,35 %. Chez des travailleurs exposés en bonne santé, 2 à 15 % sont positifs, et seul un tiers à la moitié des sensibilisés développe à terme une bérylliose.</p><div class="key"><b>Limite.</b> L’intérêt d’un dépistage systématique des exposés par ce test reste discuté : une décision d’inaptitude fondée sur un test positif nuirait inutilement à la majorité des sensibilisés.</div><p class="src">Référence : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique-berylliose--bases-de-la-med--du-trav/fiche-thematique-berylliose--bases-de-la-med--du-trav" target="_blank" rel="noopener">Suva, bérylliose, 2012</a>.</p></template>
<template data-pop="j60-igra" data-title="Test de libération d’interféron gamma"><p class="lab">Principe</p><p>Les lymphocytes d’un échantillon de sang sont incubés avec des peptides spécifiques de <i>Mycobacterium tuberculosis</i> ; l’interféron gamma libéré traduit une infection. Le test est plus spécifique que le test cutané à la tuberculine chez les personnes vaccinées par le BCG.</p><p class="lab">Usage chez le silicotique</p><p>Un test positif, une fois la tuberculose active exclue, conduit à proposer un traitement préventif, car la silicose accroît le risque de progression vers la maladie.</p><div class="key"><b>Limite.</b> Il ne distingue pas infection et maladie : devant des symptômes ou une image suspecte, ce sont les cultures qui tranchent.</div><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, version 1.2024, chapitre 4</a>.</p></template>
<template data-pop="j60-silicoproteinose" data-title="Silicoprotéinose aiguë"><p class="lab">Définition</p><p>Forme aiguë de la silicose, après une exposition très intense de quelques semaines à trois ans : les alvéoles se remplissent de composants du surfactant, comme dans une protéinose alvéolaire. La silice provoque l’apoptose des macrophages qui l’ont phagocytée ; les particules libérées sont reprises par de nouveaux macrophages, et ce cycle entretient l’inflammation et l’accumulation du surfactant.</p><p class="lab">Tableau</p><p>Dyspnée rapidement progressive, toux, fièvre possible, amaigrissement ; condensations bilatérales, verre dépoli et nodules centrolobulaires, parfois calcifiés. Le lavage ramène un liquide laiteux contenant un matériel coloré par l’acide périodique de Schiff. Les infections opportunistes sont fréquentes.</p><p class="lab">Traitement et pronostic</p><p>Le <button class="w" data-justification="1" data-k="j60-lavage-total">lavage pulmonaire total</button> est le traitement de choix ; rituximab et plasmaphérèse, seulement décrits, sont réservés aux formes réfractaires. Le pronostic est plus sombre que celui de la silicose chronique ; la transplantation se discute aux stades menaçants.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a>.</p></template>
<template data-pop="j60-mesotheliome" data-title="Mésothéliome : ce qu’il faut savoir ici"><p>Le mésothéliome relève du cours C45. Dans les pays occidentaux, 80 à 90 % des mésothéliomes de l’homme sont dus à une exposition ancienne à l’amiante ; la latence moyenne est d’environ 35 ans. Une exposition brève ou faible peut suffire, et le tabac n’influence pas son risque.</p><p>Tout mésothéliome est annoncé à l’assureur-accidents ; s’il n’est pas d’origine professionnelle reconnue, la Fondation EFA peut intervenir. Aucun marqueur sanguin ne permet aujourd’hui de le dépister.</p><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://doi.org/10.5271/sjweh.3462" target="_blank" rel="noopener">Wolff et al., 2015</a>.</p></template>
<template data-pop="j60-caplan-erasmus" data-title="Syndromes de Caplan et d’Erasmus"><p class="lab">Caplan</p><p>Décrit en 1953 par Anthony Caplan chez des mineurs : polyarthrite rhumatoïde associée à des opacités arrondies pulmonaires, des nodules rhumatoïdes contenant des particules de poussière, à nécrose fibrinoïde centrale entourée de cellules épithélioïdes en palissade.</p><p class="lab">Erasmus</p><p>Association d’une sclérodermie systémique et d’une exposition à la silice, décrite dès 1914 et nommée en 1957. Les poumons y sont souvent atteints : fibrose d’aspect PINS, hypertension artérielle pulmonaire, atteinte pleurale.</p><div class="key"><b>Conséquence.</b> Selon la Suva, une sclérodermie ou une polyarthrite rhumatoïde sur une silicose de stade 1/1 ou plus est reconnue comme liée à la silicose. L’AWMF souligne que l’exposition au quartz, même sans silicose, est associée à ces maladies.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a>.</p></template>
<template data-pop="j60-lavage-total" data-title="Lavage pulmonaire total"><p class="lab">Technique</p><p>Sous anesthésie générale et intubation par sonde à double lumière, les poumons sont rincés avec jusqu’à 30 litres de sérum physiologique, en plusieurs séances.</p><p class="lab">Indication</p><p>Traitement de choix de la silicoprotéinose aiguë, dont il retire le matériel alvéolaire accumulé. Les sources lues n’établissent pas son intérêt dans les autres formes de silicose.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p></template>
<template data-pop="j60-transplantation" data-title="Transplantation pulmonaire dans les pneumoconioses"><p class="lab">Données</p><p>Dans une étude espagnole de sept centres (2010-2023), 81 transplantés pour pneumoconiose, dont 78 silicoses, ont été comparés à 152 témoins. La chirurgie était plus complexe, mais les complications postopératoires et la survie ne différaient pas : survie médiane de 9,1 ans contre 7,9 ans. Le rejet chronique était moins fréquent. En Israël, la survie après transplantation pour silicose de la pierre artificielle n’était pas inférieure à celle des transplantés pour fibrose pulmonaire idiopathique.</p><div class="key"><b>Limite.</b> La pneumopathie des métaux durs a récidivé sur des greffons ; l’éviction définitive de l’exposition reste exigée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41672090/" target="_blank" rel="noopener">Mora-Cuesta et al., 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9310854/" target="_blank" rel="noopener">Hoy et al., 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39438781/" target="_blank" rel="noopener">Fortarezza et al., 2025</a>.</p></template>
<template data-pop="j60-rehabilitation" data-title="Réhabilitation respiratoire"><p>La mise à jour de 2020 de la recommandation AWMF sur les maladies professionnelles de l’amiante insiste, pour la première fois, sur la réhabilitation ambulatoire et l’entraînement physique. Les sources lues pour ce cours ne fournissent pas de données d’efficacité propres aux pneumoconioses : les modalités suivent celles des maladies respiratoires chroniques (cours J44 et J84).</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/33728629/" target="_blank" rel="noopener">Kraus et Teschler, 2021</a>.</p></template>
