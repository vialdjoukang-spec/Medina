<template data-pop="d50-d-sels" data-title="Sels ferreux : produits suisses et limites"><h3>Mécanisme et preuve</h3><p>Le fer ferreux absorbé par l’entérocyte alimente les protéines de transport et la synthèse d’hémoglobine. La <button class="w" data-k="d50-sources-guides">BSG</button> 2021 conclut que le fer oral corrige l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ; elle ne démontre pas une supériorité générale d’un sel sur les autres. Les trois préparations ci-dessous ont une libération modifiée : leur autorisation suisse ne prouve pas un avantage comparatif.</p><table class="t"><tr><th>Produit</th><th>Schéma adulte selon l’information professionnelle</th><th>Prise et durée</th></tr><tr><td>Tardyferon®</td><td>80 mg, un comprimé par jour ; deux, matin et soir, si état ferriprive grave</td><td>Avant ou pendant le repas selon tolérance ; avaler entier. Durée totale au plus six mois</td></tr><tr><td>ferro sanol®</td><td>100 mg, une gélule par jour ; deux au début d’une carence importante chez l’adolescent dès 15 ans et l’adulte d’au moins 50 kg. Au plus 5 mg/kg par jour</td><td>À jeun ou entre les repas. Les pellets ne se mâchent pas ; poursuite selon <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et réserves</td></tr><tr><td>Ferrum Hausmann®</td><td>100 mg, une capsule par jour ; deux ou trois en cas de carence grave</td><td>10 à 15 minutes avant le repas ; un à trois mois après correction de l’anémie, au plus six mois sans pertes chroniques</td></tr></table><p>Une prise quotidienne apporte 80 mg avec Tardyferon®, mais 100 mg avec ferro sanol® ou Ferrum Hausmann®. Le nombre de comprimés ou de capsules ne suffit donc pas à comparer les doses. Le schéma exact et la durée se vérifient avant tout remplacement.</p><h3>Contre-indications et précautions</h3><p>Pour ces trois produits, l’hypersensibilité, l’absence de carence certaine, la surcharge et les troubles d’utilisation du fer sont des contre-indications. Les atteintes hépatiques et rénales graves figurent également dans leurs contre-indications. Les formulations digestives doivent toutefois rester propres à chaque produit.</p><p>Parmi les contre-indications de Tardyferon® figure une intolérance prouvée, notamment lors d’altérations inflammatoires graves du tractus gastro-intestinal. Parmi celles de Ferrum Hausmann® figure une intolérance fondée, notamment lors de modifications inflammatoires sévères du système digestif. Ces qualificatifs ne permettent pas de classer toute maladie digestive inflammatoire comme une contre-indication.</p><p>Pour ferro sanol®, les maladies gastro-intestinales inflammatoires appellent la prudence selon la rubrique des mises en garde ; elles ne figurent pas comme telles parmi ses contre-indications. Une sténose œsophagienne et des transfusions sanguines fréquentes y sont, en revanche, contre-indiquées. La forme solide est discutée en présence de dysphagie : Tardyferon® expose à des lésions après aspiration ou maintien dans la bouche.</p><p>Les symptômes digestifs et la coloration foncée des selles sont fréquents. L’absence de réponse impose de vérifier prise, interactions, pertes et carences associées. Le guide Onkopedia prévoit un contrôle d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> vers quatre semaines, la <button class="w" data-k="d50-sources-guides">BSG</button> dès deux à quatre semaines ; l’information professionnelle Tardyferon® indique une évaluation biologique utile après trois mois. Le contrôle clinique précoce ne remplace pas cette évaluation plus tardive des réserves.</p><h3>Grossesse, allaitement, âge</h3><p>Tardyferon® peut être utilisé pendant la grossesse si nécessaire ; son information professionnelle est rassurante pour l’allaitement. Les produits ferro sanol® et Ferrum Hausmann® disposent de données plus limitées et demandent une prescription motivée selon leurs informations professionnelles. Tardyferon® est contre-indiqué avant dix ans ; ferro sanol® avant six ans ou sous 20 kg ; Ferrum Hausmann® est contre-indiqué avant six ans et son utilisation pédiatrique n’est pas étudiée. Le cours ne fournit pas de schéma enfant extrapolé de ces doses adultes.</p><div class="key"><b>À retenir.</b> Les interactions sont propres au produit et détaillées dans la <button class="w" data-k="d50-interactions">comparaison des intervalles</button>. Un rythme un jour sur deux diffère des informations professionnelles quotidiennes et constitue un choix clinique hors schéma approuvé.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">information professionnelle suisse Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">information professionnelle suisse ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">information professionnelle suisse Ferrum Hausmann®, mai 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-d-polymaltose" data-title="Fer ferrique polymaltose : Maltofer®"><h3>Mécanisme et preuve</h3><p>Le complexe d’hydroxyde ferrique-polymaltose fournit du fer absorbable puis lié aux protéines de transport et de stockage. Selon l’information professionnelle, les aliments ne réduisent pas sa biodisponibilité comme celle des sels ferreux. Une méta-analyse citée dans l’information professionnelle compare 319 adultes traités par polymaltose et 238 par sulfate ferreux : après huit à treize semaines à doses équivalentes, les taux moyens d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ne diffèrent pas significativement. Ce résultat ne démontre pas une supériorité.</p><h3>Schéma autorisé</h3><p>L’adulte et l’adolescent dès douze ans reçoivent 100 à 300 mg de fer par jour si l’anémie est présente, sinon 50 à 100 mg. La prise se fait pendant ou juste après le repas. Le comprimé à croquer Maltofer® présenté ici contient 100 mg de fer. La même information professionnelle couvre aussi le comprimé filmé à 100 mg et le sirop à 10 mg/mL. Ces formes ne se confondent pas : la dose liquide ne se déduit pas d’un nombre de comprimés. La barre du comprimé à croquer facilite sa fragmentation, sans garantir deux doses égales. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> se normalise en moyenne en trois à cinq mois selon l’information professionnelle, puis une dose de carence sans anémie reconstitue les réserves.</p><h3>Sécurité et suivi</h3><p>L’hypersensibilité, la surcharge, les troubles d’utilisation du fer et les anémies sans carence martiale contre-indiquent Maltofer®. Les troubles digestifs et les selles foncées sont fréquents. Une absence de réponse après trois semaines fait revoir le diagnostic et la prise selon l’information professionnelle. Les données n’établissent pas de schéma d’adaptation rénale ou hépatique ; cela ne permet pas d’affirmer que toute insuffisance est sans risque.</p><div class="key"><b>À retenir.</b> Pendant la grossesse et l’allaitement, l’utilisation reste prudente et suit un avis médical. Les données cliniques gestationnelles n’ont pas montré d’effet indésirable ; le passage lacté du complexe n’est pas documenté. Les comprimés ne sont pas recommandés avant douze ans. L’information professionnelle ne montre pas d’interaction clinique significative avec la tétracycline ou l’hydroxyde d’aluminium. La prise orale ne s’associe pas à une administration parentérale de fer.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680465370844" target="_blank" rel="noopener">information professionnelle suisse Maltofer®, août 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a>.</p></template>
<template data-pop="d50-d-maltol" data-title="Maltol ferrique : Feraccru®"><h3>Mécanisme et place</h3><p>Le complexe ferrique se dissocie dans le tube digestif et ne passe pas lui-même dans la circulation. Feraccru® est autorisé chez l’adulte carencé. Il offre une alternative après intolérance aux sels ferreux, sous réserve des limites digestives de son information professionnelle.</p><h3>Essais lus dans l’information professionnelle</h3><p>Chez 128 adultes atteints de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> inactives ou peu actives, avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> initiale de 95 à 120 g/L chez la femme et de 95 à 130 g/L chez l’homme, les essais AEGIS 1/2 trouvent une différence d’augmentation de l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> de 22 g/L en faveur du maltol à douze semaines ; 66 % des patients traités normalisent leur <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>. Dans l’essai rénal de 167 patients avec <button class="w" data-k="d50-filtration-renale">débit de filtration</button> de 15 à moins de 60 mL/min/1,73 m², l’augmentation moyenne d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> à seize semaines est de 5,0 g/L contre −0,2 g/L sous placebo. Ces populations ne permettent pas une extrapolation aux poussées intestinales sévères ou à l’insuffisance rénale plus avancée.</p><h3>Dose et limites</h3><p>Feraccru® s’administre à raison de 30 mg, soit une gélule, deux fois par jour à jeun. Au moins douze semaines sont généralement nécessaires, puis la durée dépend des réserves. Aucune adaptation n’est nécessaire pour un <button class="w" data-k="d50-filtration-renale">débit de filtration</button> ≥ 15 mL/min/1,73 m². L’information professionnelle ne fournit pas de donnée d’adaptation en dessous de 15 ni en insuffisance hépatique.</p><p>L’hypersensibilité et la surcharge, notamment l’hémochromatose, contre-indiquent Feraccru®. L’information professionnelle demande de ne pas l’utiliser en poussée aiguë de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ou en cas de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 95 g/L. Le produit s’évite par précaution pendant la grossesse et l’allaitement. Les effets digestifs sont fréquents ; <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et réserves sont surveillées.</p><div class="key"><b>À retenir.</b> Les médicaments chélatables de la liste de l’information professionnelle se prennent à au moins deux heures d’intervalle ; les tétracyclines demandent deux à trois heures. L’association au dimercaprol, au chloramphénicol et à la méthyldopa s’évite selon les avertissements spécifiques. Aucun schéma n’est établi avant dix-huit ans.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">information professionnelle suisse Feraccru®, août 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-d-carboxymaltose" data-title="Carboxymaltose ferrique : Ferinject®"><h3>Mécanisme et indication suisse</h3><p>Le complexe est capté par les macrophages, puis son fer rejoint les protéines de stockage et de transport. Ferinject® traite la carence de l’adulte lorsque la voie orale n’est pas assez efficace, est inefficace ou ne peut être utilisée ; la carence doit être biologiquement confirmée.</p><h3>Preuves et limites</h3><p>L’information professionnelle rapporte, dans l’anémie liée aux hémorragies utérines, une hausse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> supérieure à 20 g/L chez 82 % des patientes contre 61,8 % sous sulfate oral. En grossesse aux deuxième et troisième trimestres, l’essai de 121 contre 115 femmes trouve une différence de 2,7 g/L à trois semaines, non significative pour le critère principal, puis de 4,3 g/L à six semaines. Ce résultat tardif ne constitue pas un succès du critère principal. Dans les maladies intestinales chroniques, la non-infériorité à douze semaines a été montrée, avec une réponse plus rapide à quatre semaines.</p><h3>Administration</h3><p>La perfusion ne dépasse ni 20 mg/kg ni 1000 mg ; l’injection ne dépasse pas 15 mg/kg. Le total hebdomadaire ne dépasse pas 1000 mg. Une perfusion de plus de 500 à 1000 mg dure au moins quinze minutes ; celle de plus de 200 à 500 mg, au moins six minutes. La dilution utilise exclusivement du chlorure de sodium à 0,9 %, selon les volumes de l’information professionnelle. En hémodialyse, la dose quotidienne ne dépasse pas 200 mg. Le médecin réévalue l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> au plus tôt quatre semaines après la dernière dose. L’information professionnelle juge une <button class="w" data-k="d50-ferritine">ferritine</button> avant quatre semaines prématurée ; le Delphi suisse propose un contrôle à huit à douze semaines.</p><h3>Contre-indications et surveillance</h3><p>Le premier trimestre, la surcharge et l’anémie non ferriprive contre-indiquent le produit. Il en va de même d’une hypersensibilité au produit ou d’une hypersensibilité grave à un autre fer parentéral. En insuffisance hépatique, le médecin évalue le bénéfice et le risque ; il évite le produit si une surcharge contribue à l’atteinte. Les données d’adaptation ne permettent pas une règle générale. L’administration exige un personnel formé, un matériel de réanimation et une surveillance pendant au moins 30 minutes après chaque dose. Le traitement s’interrompt en cas de bactériémie, de réaction ou d’extravasation.</p><div class="key"><b>À retenir.</b> L’hypophosphatémie peut persister et conduire à une ostéomalacie. Le médecin contrôle le phosphate en cas de fortes doses répétées ou de facteurs de risque. Il recherche fatigue aggravée, myalgies et douleurs osseuses. L’information professionnelle de juin 2025 prévaut sur la qualification « non pertinente cliniquement » de l’avis gynécologique 2022. Après le premier trimestre, l’administration demande une évaluation stricte. Le risque de bradycardie fœtale impose une surveillance fœtale pendant l’administration. Le passage lacté est limité dans les données de l’information professionnelle, sans effet attendu aux doses thérapeutiques. L’usage n’est pas autorisé chez l’enfant ou l’adolescent dans cette information professionnelle suisse.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">information professionnelle suisse Ferinject®, juin 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis n° 77, 24.08.2022</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, degré d’accord indiqué dans le texte</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., méta-analyse 2021</a>.</p></template>
<template data-pop="d50-d-derisomaltose" data-title="Dérisomaltose ferrique : MonoFer®"><h3>Mécanisme et indication</h3><p>Le complexe ferrique-glucidique permet une libération contrôlée de fer biodisponible vers les protéines de transport et de stockage. MonoFer® traite une carence lorsque le fer oral est inefficace ou inutilisable, ou qu’une assimilation rapide est cliniquement nécessaire ; le déficit est confirmé biologiquement.</p><h3>Preuve et limite</h3><p>L’information professionnelle rapporte chez 351 patients hémodialysés une efficacité non inférieure à celle du fer-saccharose pour la dose totale étudiée de 500 mg. En revanche, la non-infériorité n’a pas été démontrée dans l’essai de 338 patients avec maladie intestinale comparant une dose calculée selon Ganzoni modifié au sulfate oral. La méta-analyse européenne 2021 trouve moins d’hypophosphatémies qu’avec le carboxymaltose, mais les essais et les doses sont hétérogènes : elle ne garantit pas l’absence de cet effet.</p><h3>Dose autorisée</h3><p>La perfusion ne dépasse pas 20 mg/kg par administration et par semaine. Jusqu’à 1000 mg, elle dure plus de quinze minutes ; au-delà de 1000 mg, au moins 30 minutes. Un besoin dépassant 20 mg/kg se fractionne à au moins une semaine d’intervalle. Le bolus ne dépasse pas 500 mg, jusqu’à trois fois par semaine, sans dépasser la limite hebdomadaire. La dilution au chlorure de sodium à 0,9 % suit l’information professionnelle. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> se mesure au plus tôt quatre semaines après la dernière administration.</p><h3>Sécurité et terrains</h3><p>Le produit est contre-indiqué au premier trimestre, en cas de surcharge, d’anémie non ferriprive ou de maladie hépatique décompensée. Une hypersensibilité au produit ou une hypersensibilité grave à un autre fer parentéral le contre-indiquent également. L’information professionnelle ne demande pas d’adaptation rénale. Les données hépatiques insuffisantes imposent prudence et bilan martial ; aucun schéma n’est établi avant dix-huit ans.</p><div class="key"><b>À retenir.</b> L’administration exige un personnel formé, une réanimation disponible et une surveillance pendant au moins 30 minutes. Le traitement s’interrompt en cas de réaction, d’extravasation ou de bactériémie. Après le premier trimestre, il demande une indication motivée, une évaluation du rapport bénéfice-risque et une surveillance fœtale. Le passage dans le lait est faible dans les données disponibles. Le produit ne s’associe pas au fer oral ; le suivi vérifie l’efficacité et le risque de surcharge.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">information professionnelle suisse MonoFer®, juin 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., méta-analyse 2021</a>.</p></template>
<template data-pop="d50-d-saccharose" data-title="Fer-saccharose : Venofer®"><h3>Mécanisme, indication et preuve</h3><p>Le complexe hydroxyde ferrique-saccharose est principalement capté par le système réticuloendothélial, puis son fer rejoint transferrine, <button class="w" data-k="d50-ferritine">ferritine</button> et hémoglobine. Venofer® traite une carence lorsque le traitement oral est insuffisamment efficace ou impossible. L’information professionnelle décrit une réponse hématologique plus rapide que sous les formulations orales solubles ; elle ne permet pas de conclure à une supériorité clinique universelle.</p><h3>Dose autorisée et durée</h3><p>La dose totale se calcule selon Ganzoni. L’adulte reçoit habituellement 100 à 200 mg une à trois fois par semaine. L’injection lente ne dépasse pas 200 mg et dure au moins dix minutes. Une perfusion de 200 mg dure au moins 30 minutes. La perfusion maximale de 500 mg s’administre au plus une fois par semaine, chez un patient de plus de 70 kg, en au moins trois heures et demie. À 70 kg ou moins, cette perfusion maximale est limitée à 7 mg/kg. Les petites doses ont leurs propres durées dans l’information professionnelle et ne suivent pas le modèle de Ferinject®.</p><h3>Risques et populations</h3><p>Le premier trimestre, la surcharge et l’anémie non ferriprive contre-indiquent Venofer®. Il en va de même d’une hypersensibilité au produit ou d’une hypersensibilité grave à un autre fer parentéral. L’administration exige une réanimation disponible, un personnel formé et une surveillance pendant au moins 30 minutes. Une extravasation impose l’arrêt immédiat et peut laisser une pigmentation prolongée. Le traitement s’interrompt en cas de bactériémie ; les autres infections demandent une évaluation bénéfice-risque.</p><div class="key"><b>À retenir.</b> L’insuffisance hépatique demande une évaluation stricte et la prévention de la surcharge. La voie dans la ligne du dialyseur est autorisée selon les mêmes limites que l’injection. Le cours n’extrapole pas de dose enfant ; l’information professionnelle déconseille l’usage avant trois ans faute d’expérience. Après le premier trimestre, l’indication gestationnelle doit être impérative ; en allaitement, les données limitées demandent une évaluation bénéfice-risque. L’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> et le bilan martial sont suivis. L’information professionnelle attend une hausse d’environ 1 g/L par jour, soit environ 10 à 20 g/L après une à deux semaines ; sans cette réponse, le médecin revoit le diagnostic et recherche une perte sanguine persistante.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">information professionnelle suisse Venofer®, mai 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-interactions" data-title="Fer oral : intervalles par produit"><p>Les intervalles d’une information professionnelle ne se transposent pas à tous les fers oraux. Le tableau sélectionne les interactions utiles au choix de la préparation ; toute association demande la lecture de son information professionnelle exacte.</p><table class="t"><tr><th>Produit</th><th>Interaction</th><th>Conduite de son information professionnelle</th></tr><tr><td>Tardyferon®</td><td>Lévothyroxine, bisphosphonates</td><td>Deux à trois heures d’intervalle</td></tr><tr><td>Tardyferon®</td><td>Quinolones</td><td>Quinolone quatre heures avant, ou quatre à six heures après le fer</td></tr><tr><td>Tardyferon®</td><td>Lévodopa, méthyldopa</td><td>Au moins trois heures</td></tr><tr><td>Tardyferon®</td><td>Colestyramine</td><td>Fer une à deux heures avant ou quatre à six heures après</td></tr><tr><td>Tardyferon®</td><td>Bictégravir</td><td>Bictégravir au moins deux heures avant le fer ; prise concomitante possible avec un repas selon l’information professionnelle. Cette règle ne s’extrapole pas à tous les inhibiteurs de l’intégrase</td></tr><tr><td>ferro sanol®</td><td>Lévothyroxine</td><td>Au moins deux heures</td></tr><tr><td>ferro sanol®</td><td>Tétracyclines, quinolones</td><td>Doxycycline à éviter ; autres tétracyclines au moins trois heures ; association aux quinolones déconseillée</td></tr><tr><td>Ferrum Hausmann®</td><td>Antiacides, médicaments complexables de sa liste</td><td>Trois heures si association inévitable ; lévothyroxine au moins deux heures</td></tr><tr><td>Feraccru®</td><td>Médicaments complexables de sa liste</td><td>Au moins deux heures ; tétracyclines deux à trois heures. Dimercaprol, chloramphénicol et méthyldopa sont à éviter</td></tr><tr><td>Maltofer®</td><td>Tétracycline, hydroxyde d’aluminium</td><td>Pas de diminution significative dans les études cliniques citées ; exception propre à ce complexe</td></tr><tr><td>Tous les produits concernés</td><td>Fer parentéral concomitant</td><td>Association déconseillée ou contre-indiquée selon l’information professionnelle ; absorption orale réduite</td></tr></table><div class="key"><b>À retenir.</b> Les antiacides, le thé, le café et certains aliments diminuent l’absorption des sels ferreux. Les inhibiteurs de la pompe à protons peuvent la réduire par hypochlorhydrie. Une perte d’efficacité sous fer peut donc relever d’une interaction plutôt que d’une maladie réfractaire.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">information professionnelle suisse Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">information professionnelle suisse ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">information professionnelle suisse Ferrum Hausmann®, mai 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">information professionnelle suisse Feraccru®, août 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680465370844" target="_blank" rel="noopener">information professionnelle suisse Maltofer®, août 2021</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>
<template data-pop="d50-mr" data-title="Contentieux : les formes à libération modifiée"><p>L’autorisation d’un médicament et la démonstration d’un avantage comparatif répondent à deux questions distinctes. Les positions ci-dessous doivent être lues avec cette distinction.</p><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td><button class="w" data-k="d50-sources-guides">BSG</button> 2021</td><td>Les formes à libération modifiée libèrent le fer au-delà des zones d’absorption maximale ; elles n’augmentent pas l’absorption, ne réduisent pas les effets indésirables et ne sont pas recommandées</td></tr><tr><td>Informations professionnelles suisses</td><td>Tardyferon®, ferro sanol® et Ferrum Hausmann®, tous à libération prolongée ou modifiée, sont autorisés dans l’anémie ferriprive et la carence latente</td></tr></table><p>L’autorisation suisse permet l’utilisation du produit dans ses indications ; elle ne démontre pas une absorption ou une tolérance supérieure. Chez un patient ne répondant pas, la prise et les pertes se réévaluent avant d’attribuer l’échec à la seule formulation.</p><p class="lab">Arbitrage</p><div class="key"><b>À retenir.</b> La <button class="w" data-k="d50-sources-guides">BSG</button> s’appuie sur des données d’absorption et de tolérance comparatives ; les informations suisses attestent l’autorisation, non une supériorité. En pratique suisse, ces préparations restent utilisables à raison d’une prise par jour ; la réponse se contrôle à deux à quatre semaines, et un échec fait vérifier l’adhésion avant de changer de voie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, préparations orales</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">Tardyferon®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">ferro sanol®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">Ferrum Hausmann®, information professionnelle suisse</a>.</p></template>
<template data-pop="pareto-d50-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="d50-0,d50-1,d50-2,d50-3,d50-4,d50-5,d50-6"></p><ul><li>Chez l’adulte de 15 à 65 ans, l’<button class="w" data-k="d50-sources-guides">OMS</button> 2024 définit l’anémie par une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 130 g/L chez l’homme et &lt; 120 g/L chez la femme non enceinte. Pendant la grossesse, le seuil est &lt; 110 g/L, sauf au deuxième trimestre où il est &lt; 105 g/L. L’altitude et le contexte modifient l’interprétation.</li><li>Sans inflammation, une <button class="w" data-k="d50-ferritine">ferritine</button> &lt; 15 µg/L indique des réserves épuisées ; &lt; 30 µg/L correspond à des réserves insuffisantes selon Onkopedia 2025. Le Delphi 2019 propose aussi 30–50 µg/L avec <button class="w" data-k="d50-tsat">TSAT</button> &lt; 20 % pour la carence sans anémie, avec accord critique.</li><li>La restriction érythropoïétique peut précéder la baisse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ; <button class="w" data-k="d50-ferritine">ferritine</button>, indices globulaires et <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ne mesurent pas la même étape.</li><li>L’hepcidine inhibe la ferroportine ; elle augmente sous inflammation et diminue habituellement dans la carence absolue.</li><li>Chez l’homme et la femme ménopausée explorés pour anémie ferriprive, environ un tiers ont une lésion digestive significative selon la <button class="w" data-k="d50-sources-guides">BSG</button> 2021. L’absence de symptôme digestif n’exclut pas la cause.</li><li>Le médecin recherche pertes, malabsorption et besoins accrus. Fatigue, pica et signes des phanères ne suffisent pas à prouver la carence.</li><li>La pâleur est plus fiable sur les conjonctives que sur la peau selon mediX 08/2025 ; elle déclenche un hémogramme sans mesurer l’hémoglobine.</li></ul></template>
<template data-pop="pareto-d50-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="d50-7,d50-8"></p><ul><li>Devant une pâleur ou une anémie, le médecin juge d’abord la tolérance, classe ensuite par le volume globulaire moyen, prouve la carence par la ferritine, puis cherche la cause. Environ 80 % des anémies sont ferriprives selon mediX ; la microcytose avec bilan martial normal oriente vers une thalassémie ou une inflammation.</li><li>La <button class="w" data-k="d50-ferritine">ferritine</button> se lit avec la <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button>. Une <button class="w" data-k="d50-tsat">TSAT</button> basse soutient une restriction, sans distinguer seule carence absolue et fonctionnelle. L’<button class="w" data-k="d50-sources-guides">OMS</button> 2020 propose conditionnellement &lt; 70 µg/L pour indiquer une carence sous inflammation.</li><li>Une hausse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> ≥ 10 g/L après deux semaines de fer oral quotidien est fortement évocatrice de carence absolue ; la cause reste à rechercher.</li><li>Le bilan d’une anémie ferriprive comprend une analyse d’urine et une sérologie cœliaque. L’exploration digestive haute et basse s’indique chez l’homme et la femme ménopausée selon risque et état général.</li><li><button class="w" data-k="d50-sources-guides">BSG</button>/<button class="w" data-k="d50-sources-guides">ACPGBI</button> 2025 : le test immunochimique fécal aide au tri, mais un résultat bas ne clôt pas le bilan.</li><li>Une persistance ou une récidive après des endoscopies adéquates négatives conduit à explorer le grêle par capsule et l’appareil rénal.</li><li>Un saignement actif, une dyspnée de repos ou une mauvaise tolérance circulatoire imposent une évaluation urgente. Pendant la grossesse, une <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 90 g/L justifie une discussion spécialisée de fer intraveineux après le premier trimestre.</li></ul></template>
<template data-pop="pareto-d50-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="d50-9,d50-10,d50-11"></p><ul><li>Le traitement d’une anémie carencée commence parallèlement à la recherche de cause, sauf si une coloscopie est imminente.</li><li>Selon Onkopedia et la <button class="w" data-k="d50-sources-guides">BSG</button>, les sels ferreux s’emploient initialement en prise unique de 50–100 mg. Les règles de repas et de durée suivent l’information professionnelle exacte. Un jour sur deux diffère des informations professionnelles quotidiennes et demande une justification explicite.</li><li>Le médecin contrôle la réponse d’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> après deux à quatre semaines. Selon la <button class="w" data-k="d50-sources-guides">BSG</button>, le traitement continue environ trois mois après normalisation, dans les limites de durée du produit.</li><li>L’intolérance conduit à adapter rythme et prise. Onkopedia 2025 permet l’essai d’une autre préparation, sans promesse de supériorité. Le maltol ou la voie intraveineuse se discutent si nécessaire.</li><li>Le fer intraveineux exige une indication précise, une dose calculée et une surveillance d’au moins 30 minutes. Pour Ferinject® et MonoFer®, l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> se contrôle au plus tôt quatre semaines après la dernière dose. Le Delphi 2019 propose la <button class="w" data-k="d50-ferritine">ferritine</button> à huit à douze semaines.</li><li>La transfusion se réserve à l’anémie sévère symptomatique ou mal tolérée. Un apport martial reste nécessaire.</li><li>Sans anémie, les recommandations suisses divergent. Le médecin distingue stade, symptômes, autres causes et populations particulières. Une perfusion ne découle pas de la <button class="w" data-k="d50-ferritine">ferritine</button> seule.</li></ul></template>
<template data-pop="pareto-d50-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="d50-12,d50-13,d50-14"></p><ul><li>Après correction, la <button class="w" data-k="d50-sources-guides">BSG</button> 2021 propose un hémogramme tous les trois mois la première année, puis tous les six mois. Le risque de récidive détermine l’adaptation du suivi.</li><li>Une récidive conduit à réévaluer qualité et ancienneté des endoscopies, grêle et appareil urinaire. Une cause irréversible peut justifier une substitution prolongée.</li><li>Pendant la grossesse, gynécologie suisse 2022 recommande la <button class="w" data-k="d50-ferritine">ferritine</button> au début et à 24–28 semaines, puis un traitement si elle est &lt; 30 µg/L. La voie intraveineuse demande une indication précise après le premier trimestre.</li><li>Dans les <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button>, le seuil de <button class="w" data-k="d50-ferritine">ferritine</button> dépend de l’inflammation. Une atteinte active et une intolérance favorisent la voie intraveineuse.</li><li>Dans la maladie rénale, Kidney Disease: Improving Global Outcomes 2026 distingue hémodialyse et autres situations ; ses seuils de traitement ne sont pas des seuils de réserve normale chez le sujet sain.</li><li>L’indication de fer dans l’insuffisance cardiaque relève du spécialiste. Le texte primaire 2026 n’étant pas accessible, aucun seuil thérapeutique ne lui est attribué.</li><li>En pédiatrie, forme, âge et poids sont propres au produit. Aucune dose adulte n’est extrapolée.</li></ul></template>
<template data-pop="pareto-d50-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="d50-e-1,d50-e-2,d50-e-3,d50-e-4,d50-e-5"></p><ul><li>Le bilan initial associe hémogramme, <button class="w" data-k="d50-ferritine">ferritine</button> et <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button> ; la <button class="w" data-k="d50-tsat">TSAT</button> le complète selon le contexte. L’examen médullaire n’est pas une exploration de routine.</li><li>Un <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> &lt; 80 fl définit la microcytose ; une <button class="w" data-k="d50-teneur-globulaire">TCMH</button> basse indique l’hypochromie. Les seuils réticulocytaires dépendent de l’automate.</li><li>Une <button class="w" data-k="d50-tsat">TSAT</button> et une <button class="w" data-k="d50-ferritine">ferritine</button> basses rendent probable une carence absolue. Une <button class="w" data-k="d50-tsat">TSAT</button> basse avec <button class="w" data-k="d50-ferritine">ferritine</button> normale fait discuter inflammation ou trouble de régulation.</li><li>Une microcytose disproportionnée avec bilan martial normal conduit à étudier l’hémoglobine. Une alpha-thalassémie peut avoir une électrophorèse normale.</li><li>Le bilan comprend une analyse d’urine dès le début ; l’exploration digestive dépend du terrain. Le test immunochimique fécal aide au tri sans exclure le cancer.</li><li>La capsule est préférée pour le grêle après un bilan endoscopique adéquat négatif et une réponse insuffisante ou une récidive.</li></ul></template>
<template data-pop="pareto-d50-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d50-p-1,d50-p-2,d50-p-3,d50-p-4,d50-p-5"></p><ul><li>Le choix du produit suit son information professionnelle suisse exacte. Dose, âge, repas, interactions, fonction rénale ou hépatique et grossesse ne sont pas interchangeables.</li><li>Ferinject® ne dépasse ni 20 mg/kg ni 1000 mg par perfusion, ni 1000 mg par semaine. MonoFer® ne dépasse pas 20 mg/kg par perfusion et par semaine. Sa perfusion dure plus de quinze minutes jusqu’à 1000 mg, puis au moins trente minutes au-delà.</li><li>Venofer® ne dépasse pas 200 mg par injection. Sa perfusion maximale est de 500 mg si le poids dépasse 70 kg, sinon 7 mg/kg. Elle dure au moins 3,5 heures et s’administre au plus une fois par semaine.</li><li>Le fer intraveineux exige personnel formé, matériel de réanimation et observation ≥ 30 minutes. Il est contre-indiqué au premier trimestre et s’interrompt en cas de bactériémie.</li><li>Sous Ferinject®, le phosphate se contrôle en présence de doses répétées élevées ou de facteurs de risque. Une hypophosphatémie persistante peut causer une ostéomalacie.</li><li>Les sels ferreux ont des interactions et des contre-indications rénales ou hépatiques graves propres au produit. Feraccru® s’évite pendant la grossesse et l’allaitement. Son information professionnelle demande de ne pas l’utiliser en poussée aiguë de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> ou en cas de <button class="w" data-k="d50-mici" title="Carence martiale et inflammation intestinale">maladies inflammatoires chroniques de l’intestin</button> avec <button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button> &lt; 95 g/L.</li><li>Tout apport demande une indication documentée. Une <button class="w" data-k="d50-ferritine">ferritine</button> élevée seule ne prouve pas une surcharge.</li></ul></template>

<template data-pop="pareto-d50-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d50-s-physio-body"></p><ul><li>Absorption duodénale et proximale, recyclage macrophagique et pertes déterminent le bilan martial.</li><li>L’hepcidine hépatique provoque l’internalisation de la ferroportine ; inflammation et réserves abondantes l’augmentent.</li><li>L’érythropoïétine stimule l’érythroferrone, qui diminue l’hepcidine quand l’érythropoïèse demande du fer.</li><li>Cette régulation explique <button class="w" data-k="d50-ferritine">ferritine</button> élevée avec disponibilité basse sous inflammation et l’intérêt d’adapter la prise orale.</li></ul></template>

<template data-pop="pareto-d50-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="d50-s-bioc-body"></p><ul><li>La transferrine assure le transport ; la <button class="w" data-k="d50-ferritine">ferritine</button> stocke le fer. L’hème incorpore le fer dans l’hémoglobine et d’autres protéines.</li><li>Une <button class="w" data-k="d50-tsat">TSAT</button> basse renseigne sur la disponibilité du fer. Elle ne mesure pas, seule, les réserves.</li><li>La carence d’incorporation augmente la protoporphyrine de zinc et le récepteur soluble quand la moelle manque de fer.</li><li>L’interprétation nécessite <button class="w" data-k="d50-proteine-c-reactive">protéine C réactive</button>, contexte clinique et méthode analytique.</li></ul></template>

<template data-pop="pareto-d50-s-histo" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="d50-s-histo-body"></p><ul><li>Le contenu en hémoglobine des réticulocytes reflète l’approvisionnement des cellules récemment produites.</li><li>Il réagit avant les indices moyens de toutes les hématies ; les seuils sont propres à l’automate.</li><li>Une restriction martiale prolongée entraîne hypochromie et microcytose. Le <button class="w" data-k="d50-volume-globulaire" title="Mesure et limites du volume globulaire moyen">volume globulaire moyen</button> peut rester normal si la carence est mixte ou débutante.</li><li>Sous fer, les réticulocytes augmentent avant l’<button class="w" data-k="d50-anemie-def" title="Seuils d’anémie selon la population OMS 2024">hémoglobine</button>. L’absence de réponse conduit à rechercher des pertes persistantes.</li></ul></template>

<template data-pop="pareto-d50-s-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="d50-s-gen-body"></p><ul><li>TMPRSS6 code la matriptase-2, qui atténue la synthèse d’hepcidine par la <button class="w" data-k="d50-voie-hepatique-hepcidine">voie hépatique des protéines morphogénétiques osseuses et de leurs médiateurs de signalisation</button>.</li><li>Les variants pathogènes entraînent une hepcidine inappropriée et une <button class="w" data-k="d50-tsat">TSAT</button> très basse. La réponse orale est mauvaise ; la réponse intraveineuse reste souvent partielle.</li><li>Le diagnostic génétique suit l’exclusion des causes acquises ; l’avis 2025 repose surtout sur des séries de cas.</li><li>Les anomalies des globines peuvent donner une microcytose sans carence ; une surcharge confirmée contre-indique les préparations martiales.</li></ul></template>

<template data-pop="d50-absorption" data-title="Anatomie et biochimie de l’absorption du fer"><h3>Du tube digestif au plasma</h3><p>Le duodénum est le principal site d’absorption ; le jéjunum proximal y participe. À la membrane apicale, le cytochrome b duodénal réduit le fer ferrique Fe³⁺ en fer ferreux Fe²⁺, qui peut franchir la membrane grâce à DMT1. Le passage basolatéral dépend de la ferroportine. L’héphæstine, une ferroxydase contenant du cuivre, réoxyde le Fe²⁺ en Fe³⁺ avant son transport lié à la transferrine.</p><h3>De la cellule normale à la carence</h3><p>L’entérocyte stocke aussi du fer dans la <button class="w" data-k="d50-ferritine">ferritine</button>. Si l’hepcidine provoque l’internalisation puis la dégradation de la ferroportine, l’export diminue. En carence, plusieurs protéines de ce système sont davantage exprimées ; cette adaptation demeure limitée et peut être dépassée par les pertes. Une dérivation digestive peut soustraire les sites d’absorption au trajet des aliments.</p><div class="key"><b>Science → clinique, examen, traitement.</b> Une alimentation suffisante n’exclut donc pas une malabsorption. Une <button class="w" data-k="d50-ferritine">ferritine</button> basse documente les réserves épuisées ; si une malabsorption explique l’échec du fer oral correctement utilisé, une substitution intraveineuse peut contourner l’étape intestinale, après vérification de l’indication et de la préparation.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec SGH/SSH et SGMO, avril 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021</a>.</p></template>

<template data-pop="d50-volume-globulaire" data-title="Volume globulaire moyen : mesure et limites"><h3>Mesure et seuil</h3><p>La référence du laboratoire suisse Viollier est de 80–100 fl dès 19 ans, pour les femmes et les hommes ; mesure par cytométrie sur sang anticoagulé. Les références pédiatriques sont différentes. Le volume globulaire moyen mesure le volume moyen des hématies circulantes, en femtolitres. Chez l’adulte, une valeur inférieure à 80 fl définit habituellement la microcytose ; l’intervalle complet dépend du laboratoire. Il s’agit d’une moyenne, qui ne décrit pas séparément chaque population cellulaire.</p><h3>Mécanisme et chronologie</h3><p>La restriction de fer produit des cellules progressivement hypochromes puis microcytaires. Les hématies anciennes restent longtemps majoritaires ; l’indice moyen peut donc rester normal au début. Les marqueurs réticulocytaires renseignent plus tôt sur l’approvisionnement de la production récente.</p><h3>Interprétation et pièges</h3><p>Une carence associée en vitamine B12 ou en folates peut relever la moyenne et masquer la microcytose. Une microcytose marquée pour une anémie légère, avec <button class="w" data-k="d50-ferritine">ferritine</button> et saturation de la transferrine normales, évoque plutôt une thalassémie. Le bilan martial précède donc l’attribution de la microcytose à une carence.</p><div class="key"><b>À retenir.</b> La microcytose n’est ni nécessaire ni suffisante pour diagnostiquer une carence martiale. Le médecin lit ensemble l’hémoglobine, les indices globulaires, la <button class="w" data-k="d50-ferritine">ferritine</button> et le contexte inflammatoire.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/19730" target="_blank" rel="noopener">Viollier, volume globulaire moyen</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia avec SGH/SSH, avril 2025, marqueurs biologiques</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017, tableau 3 et chronologie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, définitions et diagnostic différentiel</a>.</p></template>

<template data-pop="d50-anti-inflammatoires" data-title="Anti-inflammatoires non stéroïdiens et carence martiale"><h3>Exposition médicamenteuse et cause digestive</h3><p>Les anti-inflammatoires non stéroïdiens sont une exposition à rechercher dans l’anamnèse d’une carence martiale. La <button class="w" data-k="d50-sources-guides">BSG</button> 2021 cite leur utilisation prolongée parmi les facteurs contributifs et leur entéropathie parmi les causes digestives. Une prise régulière peut ainsi participer à une perte digestive ou à une atteinte du grêle.</p><p>Le médecin précise les médicaments utilisés et confronte cette exposition aux pertes, aux symptômes et aux autres facteurs de risque. Elle n’exclut pas une lésion associée : chez un patient âgé, une cause médicamenteuse plausible ne dispense pas du bilan digestif indiqué. Après des endoscopies adéquates négatives et une anémie persistante ou récidivante, la capsule peut identifier une entéropathie liée à ces médicaments.</p><div class="trap"><span class="k">Limite</span> Une exposition ne prouve pas à elle seule la cause de l’anémie. Cette fenêtre décrit la recherche étiologique ; elle ne prescrit ni un arrêt universel ni un médicament de remplacement sans indication individuelle.</div><div class="key"><b>À retenir.</b> L’inventaire des anti-inflammatoires non stéroïdiens fait partie du bilan de la carence, mais reste associé à la recherche des autres causes.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG, recommandations adultes 2021, tableau 1, anamnèse et capsule</a>.</p></template>
<template data-pop="d50-proteine-c-reactive" data-title="Protéine C réactive : lire la ferritine sous inflammation"><h3>Question diagnostique</h3><p>Chez Viollier, la référence est inférieure à 3,4 mg/L dès 1 an, pour les femmes et les hommes ; le dosage utilise le sérum et l’immunoturbidimétrie. Ce repère de laboratoire ne doit pas être remplacé par le seuil de 5 mg/L utilisé dans certains algorithmes d’indice ferritine. La protéine C réactive contribue à l’évaluation d’une inflammation dans le bilan martial. La <button class="w" data-k="d50-ferritine">ferritine</button> est une protéine de phase aiguë : une inflammation, une maladie hépatique ou un cancer peuvent l’augmenter indépendamment des réserves. Une valeur normale ou élevée de <button class="w" data-k="d50-ferritine">ferritine</button> ne suffit donc pas à exclure une carence dans ces situations.</p><p>Le bilan suisse associe notamment l’hémogramme, la <button class="w" data-k="d50-ferritine">ferritine</button> et la protéine C réactive ; la saturation de la transferrine complète l’analyse selon le contexte. Onkopedia demande également de confronter la <button class="w" data-k="d50-ferritine">ferritine</button> au contexte clinique et aux marqueurs inflammatoires. Le résultat de la protéine C réactive est lu avec la méthode et l’intervalle du laboratoire ; il ne détermine pas à lui seul les réserves ni la cause de l’inflammation.</p><div class="trap"><span class="k">Piège</span> Une protéine C réactive élevée ne démontre pas une anémie inflammatoire pure. Une carence absolue peut coexister ; les seuils de <button class="w" data-k="d50-ferritine">ferritine</button> propres à la grossesse, à l’intestin inflammatoire et à la maladie rénale restent distincts.</div><div class="key"><b>À retenir.</b> La protéine C réactive renseigne le contexte d’interprétation de la <button class="w" data-k="d50-ferritine">ferritine</button> ; elle ne remplace ni le bilan martial ni la recherche étiologique.</div><p class="src">Références : <a href="https://www.viollier.ch/fr/analysis/7480" target="_blank" rel="noopener">Viollier, protéine C réactive</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse, 2019, discussion du diagnostic biologique</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec participation suisse, avril 2025, paramètres du fer et diagnostic différentiel</a>.</p></template>
<template data-pop="d50-voie-hepatique-hepcidine" data-title="Signalisation hépatique : matriptase-2 et hepcidine"><h3>Fonction normale et perturbation génétique</h3><p>Le gène TMPRSS6 code la matriptase-2, une protéase transmembranaire qui atténue la synthèse hépatique d’hepcidine. Hoving et coll. décrivent son action sur la voie des protéines morphogénétiques osseuses et des médiateurs de signalisation. Le texte anglais nomme ces familles « Bone Morphogenetic Protein » et « Small Mothers Against Decapentaplegic » ; ces noms de famille ne sont pas développés artificiellement lettre par lettre.</p><p>Lorsque des variants pathogènes de TMPRSS6 altèrent ce contrôle, l’hepcidine reste trop élevée relativement au fer disponible. Le frein exercé sur la ferroportine limite l’apport de fer à la circulation et contribue à l’anémie ferriprive réfractaire au fer.</p><p>La faible disponibilité du fer, la réponse orale insuffisante et le contexte familial ou précoce motivent un bilan ciblé après exclusion des causes acquises. La <button class="w" data-k="d50-ferritine">ferritine</button> peut varier, notamment après fer intraveineux ; aucun seuil unique d’hepcidine n’est déduit de cette voie. L’avis de Hoving 2025 repose largement sur des observations et l’expérience spécialisée.</p><div class="key"><b>À retenir.</b> La matriptase-2 atténue le signal hépatique d’hepcidine ; son altération explique une restriction de fer malgré une supplémentation, sans rendre le test génétique systématique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et coll., 2025, introduction et figure 1</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, guide commun avec participation suisse, avril 2025, paramètres du fer et diagnostic différentiel</a>.</p></template>
<template data-pop="d50-sm-conjonctive" data-title="Pâleur conjonctivale : technique, valeur et limites"><h3>Technique</h3><p>Le médecin abaisse la paupière inférieure et compare deux zones de la conjonctive palpébrale. Chez le sujet sain, le bord antérieur paraît plus rouge que le bord postérieur. L’étude de Kalantri considère la conjonctive comme pâle lorsque le bord antérieur devient aussi pâle que le bord postérieur. La même étude examine le dos de la langue, les plis palmaires et le lit unguéal, avec une gradation de l’absence à la pâleur sévère.</p><h3>Mécanisme</h3><p>Onkopedia 2025 range la pâleur des conjonctives parmi les symptômes généraux de toute anémie. Elle reflète donc la baisse d’hémoglobine, quelle qu’en soit la cause, et non la carence en fer elle-même.</p><h3>Valeur</h3><p>mediX 08/2025 juge la pâleur cutanée peu sûre et la pâleur des muqueuses, en particulier des conjonctives, plus fiable. Aucune source suisse ou européenne lue ne la chiffre. Dans une étude indienne de 390 patients hospitalisés ou consultants de plus de 12 ans, une pâleur palmaire sévère avait un rapport de vraisemblance de 5,94 pour une hémoglobine inférieure à 90 g/L, avec un intervalle de confiance de 1,45 à 24,4. L’absence de pâleur palmaire avait un rapport de 0,25 pour une hémoglobine inférieure à 70 g/L.</p><div class="trap"><span class="k">Piège</span> La concordance entre deux examinateurs était faible, avec un coefficient kappa de 0,07 pour la conjonctive. L’étude portait sur une population où 64 % des patients étaient anémiques, sans examen standardisé : ses chiffres ne se transposent ni au cabinet suisse ni à l’enfant.</div><div class="key"><b>À retenir.</b> La pâleur conjonctivale fait demander un hémogramme ; elle ne mesure pas l’hémoglobine et n’indique pas la cause. Son absence rend surtout une anémie sévère moins probable.</div><p class="src">Références : <a href="https://doi.org/10.1371/journal.pone.0008545" target="_blank" rel="noopener">Kalantri et al., PLoS One 2010, méthodes et tableaux 2 et 3</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, Eisenmangel, 08/2025, chapitre 2</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025, § 3.1</a>.</p></template>
<template data-pop="d50-sm-fatigue" data-title="Fatigue : mécanisme, valeur et diagnostic différentiel"><h3>Mécanisme</h3><p>Le fer n’est pas seulement un transporteur d’oxygène ; il entre dans la chaîne respiratoire mitochondriale. Dans des modèles animaux, la carence sans anémie réduisait déjà le nombre de mitochondries et l’activité des enzymes respiratoires. Clénin en déduit que la carence atteint la capacité oxydative, alors que l’anémie atteint surtout le transport de l’oxygène.</p><h3>Interrogatoire</h3><p>Le médecin date la fatigue, en précise l’intensité et le retentissement sur l’effort, la concentration et le sommeil. Il recherche des pertes, un régime pauvre en fer et les signes d’une autre maladie.</p><h3>Valeur</h3><p>mediX 08/2025 souligne qu’il n’existe, dans la population, aucune relation entre une fatigue isolée et l’anémie. Chez la femme non ménopausée carencée sans anémie, le fer peut soulager la fatigue ; l’effet n’est toutefois significatif que pour une ferritine inférieure à 15 µg/L.</p><div class="trap"><span class="k">Piège</span> Avant tout traitement martial d’une fatigue inexpliquée, mediX demande d’envisager une dépression, une hypothyroïdie ou une hyperthyroïdie, une insuffisance rénale, un diabète, une hyperparathyroïdie et une hépatite chronique.</div><div class="key"><b>À retenir.</b> La fatigue motive le dosage de la ferritine, mais ne prouve pas la carence. Une amélioration sous fer reste un argument, non une preuve.</div><p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/2310/3501?inline=1" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017, « Influence of iron on physical performance and cognition »</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, Eisenmangel, 08/2025, chapitre 2</a>.</p></template>
<template data-pop="d50-sm-jambes" data-title="Jambes sans repos : critères, mécanisme et seuils"><h3>Reconnaître</h3><p>Le diagnostic exige cinq critères essentiels. Le patient ressent un besoin de bouger les jambes, généralement accompagné de sensations désagréables. Ce besoin apparaît ou s’aggrave au repos, il est soulagé partiellement ou totalement par le mouvement et il prédomine le soir ou la nuit. Enfin, aucune autre affection n’explique mieux les symptômes.</p><h3>Mécanisme</h3><p>La recommandation germano-austro-suisse 2024 rattache la maladie à une carence en fer du système nerveux central, notamment de la substance noire, et à une signalisation dopaminergique altérée. L’efficacité des traitements dopaminergiques appuie ce rôle de la dopamine.</p><h3>Seuils selon les sources</h3><p>La recommandation germano-austro-suisse propose un traitement martial pour une ferritine inférieure à 75 µg/L ou une saturation de la transferrine inférieure ou égale à 20 %, sans dépasser 300 µg/L de ferritine. Le Delphi suisse 2019 retient, chez le sujet âgé, une ferritine inférieure à 50 µg/L ou une saturation inférieure à 16 %. mediX 08/2025 juge le bénéfice insuffisamment démontré au-delà de 15 µg/L de ferritine.</p><div class="trap"><span class="k">Piège</span> Une polyneuropathie donne des paresthésies symétriques « en chaussettes » ; des crampes nocturnes des mollets, une akathisie ou une claudication intermittente imitent aussi la maladie. Le soulagement par le mouvement et la prédominance vespérale les distinguent.</div><div class="key"><b>À retenir.</b> Chez un patient atteint de jambes sans repos, le médecin dose la ferritine et la saturation de la transferrine. Le seuil de traitement dépend de la source et du spécialiste qui prend en charge.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener">Trenkwalder et al., Neurol Res Pract 2024, recommandation DGSM et DGN approuvée par la Société suisse de neurologie</a> ; <a href="https://smw.ch/index.php/smw/article/download/2646/4203?inline=1" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, 08/2025, chapitre 4.2</a>.</p></template>
<template data-pop="d50-sm-pica" data-title="Pica et pagophagie : rechercher ce que le patient ne dit pas"><h3>Définition</h3><p>Le pica désigne l’ingestion compulsive de substances non alimentaires, comme la terre. La pagophagie désigne l’envie impérieuse de croquer de la glace.</p><h3>Interrogatoire</h3><p>Le médecin pose la question directement, car le patient en parle rarement de lui-même. Il demande s’il croque des glaçons, mange de la terre, de l’argile ou d’autres substances, et depuis quand.</p><h3>Valeur et mécanisme</h3><p>La BSG range la pagophagie parmi les manifestations plus spécifiques de la carence martiale. mediX cite l’envie d’argile et de terre ; Gattermann cite le pica parmi les manifestations de la carence. Aucune source lue ne chiffre ces signes, et aucune n’en établit le mécanisme.</p><div class="trap"><span class="k">Piège</span> Le tableau des causes de la BSG mentionne aussi le syndrome de pica. Le comportement peut donc être à la fois une conséquence de la carence et une piste étiologique à explorer.</div><div class="key"><b>À retenir.</b> Une pagophagie ou un pica font doser la ferritine ; leur absence n’exclut rien.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, « Clinical features, history and examination » et tableau 1</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, 08/2025, chapitre 2</a> ; <a href="https://doi.org/10.3238/arztebl.m2021.0290" target="_blank" rel="noopener">Gattermann et al., Dtsch Arztebl Int 2021</a>.</p></template>
<template data-pop="d50-sm-trophiques" data-title="Troubles trophiques : ongles, bouche, langue et cheveux"><h3>Signes</h3><p>Onkopedia décrit une fragilité accrue des ongles et des cheveux, des fissures des commissures labiales et une atrophie de la muqueuse linguale avec dysphagie. mediX ajoute des ongles striés, une chute de cheveux, une peau sèche, un prurit et des aphtes. Le Delphi suisse cite la koilonychie, des ongles fragiles, une chéilite, une glossite atrophique, une alopécie et le syndrome de Plummer et Vinson. La BSG mentionne aussi des sclérotiques bleues.</p><h3>Technique</h3><p>Le médecin inspecte les ongles de face et de profil, les cheveux, les commissures labiales et la langue. Il recherche une concavité unguéale, une fissure commissurale ou une langue lisse dépapillée, et il interroge sur une gêne à la déglutition.</p><h3>Mécanisme</h3><p>Onkopedia rappelle que toutes les cellules ont besoin de fer, et pas seulement l’érythropoïèse. Les tissus qui se renouvellent souffrent donc de la carence, indépendamment de l’hémoglobine. Les sources lues ne détaillent pas le mécanisme propre à chaque signe.</p><h3>Valeur</h3><p>La BSG ne retrouve ces signes qu’à l’occasion ; Gattermann les décrit surtout dans la carence sévère. Aucune source lue ne les chiffre. Leur présence oriente vers la ferritine ; leur absence n’exclut rien.</p><div class="trap"><span class="k">Piège</span> Une chéilite angulaire peut avoir une cause locale, comme une prothèse dentaire ou une sécheresse buccale. La carence n’en est alors qu’un facteur possible.</div><div class="key"><b>À retenir.</b> Un trouble trophique désigne le manque de fer des tissus, même avec une hémoglobine normale. Une dysphagie associée fait discuter un syndrome de Plummer et Vinson.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025, § 3.1</a> ; <a href="https://www.medix.ch/wissen/guidelines/eisenmangel/" target="_blank" rel="noopener">mediX, 08/2025, chapitre 2</a> ; <a href="https://smw.ch/index.php/smw/article/download/2646/4203?inline=1" target="_blank" rel="noopener">Delphi suisse 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.3238/arztebl.m2021.0290" target="_blank" rel="noopener">Gattermann et al., 2021</a>.</p></template>
<template data-pop="d50-sm-pertes" data-title="Examen de la cause : abdomen, région anale, toucher rectal"><h3>Ce que recommande Onkopedia</h3><p>Le guide Onkopedia, auquel participe la Société suisse d’hématologie, place la perte sanguine digestive chronique au premier rang des causes à exclure. Son tableau 7 associe l’anamnèse ciblée à l’inspection de la région anale, à la palpation de l’abdomen et au toucher rectal. Une hématurie macroscopique ou microscopique impose une exploration urologique.</p><h3>Ce que précise la BSG</h3><p>La BSG juge l’examen physique généralement normal, même s’il apporte parfois le diagnostic. Elle ne mentionne pas le toucher rectal. Elle inclut l’analyse d’urine dans le premier bilan d’une anémie ferriprive confirmée.</p><div class="trap"><span class="k">Piège</span> Un examen abdominal et rectal normal n’exclut pas une lésion digestive. Les symptômes abdominaux ne prédisent ni la présence ni le siège d’une lésion ; l’exploration endoscopique dépend de l’âge, du sexe et du contexte.</div><div class="key"><b>À retenir.</b> L’examen cherche une piste vers la perte ; il ne remplace jamais l’exploration lorsque celle-ci est indiquée.</div><p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/eisenmangel-und-eisenmangelanaemie/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, avril 2025, § 3.6.2 et tableau 7</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, examen et recommandation 7</a>.</p></template>
