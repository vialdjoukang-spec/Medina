<p>Dans cette <b>vignette fictive</b>, un homme de 24 ans consulte parce que ses chevilles se tordent et que son pied « accroche » à la course. L’examen montre des pieds creux, des orteils en griffe, une fonte musculaire distale des jambes et des réflexes achilléens abolis. L’électroneuromyographie (<button class="w" data-k="g60-enmg">ENMG (profils et pièges de lecture)</button>) retrouve une vitesse de conduction motrice du nerf médian d’environ 21 m/s, valeur pédagogique voisine de la moyenne rapportée dans la forme la plus fréquente de <button class="w" data-k="g60-cmt">CMT (la maladie de Charcot-Marie-Tooth)</button>.</p>
<p>Le médecin doit répondre à cinq questions dans l’ordre : s’agit-il d’une neuropathie <b>héréditaire</b> plutôt qu’acquise ? Une cause acquise <b>traitable</b>, la <button class="w" data-k="g60-pidc">PIDC (polyradiculonévrite inflammatoire démyélinisante chronique)</button>, est-elle écartée ? Quelle étude génétique l’électrophysiologie oriente-t-elle ? Quels médicaments faut-il éviter dès aujourd’hui ? Quelle prise en charge de rééducation et d’orthopédie faut-il organiser ? Deux formes rares justifient une vigilance particulière parce qu’elles sont évitables ou traitables : la <button class="w" data-k="g60-refsum">maladie de Refsum</button> et la <button class="w" data-k="g60-hnpp">HNPP (neuropathie héréditaire avec hypersensibilité à la pression)</button>. Enfin, quand aucune cause n’est trouvée malgré un bilan approprié, la <button class="w" data-k="g60-ciap">CIAP (neuropathie axonale idiopathique chronique)</button> relève de la rubrique G60.3.</p>
<div class="key"><b>À retenir.</b> Devant une polyneuropathie lente, longueur-dépendante, à prédominance motrice distale et avec pieds creux, on pense d’abord à la CMT. On l’explore par la vitesse de conduction motrice, on écarte la PIDC, et l’on protège le patient des médicaments neurotoxiques avant même d’avoir le résultat génétique.</div>
</section>

<section class="ilot" id="g60-1"><h2><span class="n">1</span>Définition, codes et classification</h2>
<p>La rubrique G60 de la CIM-10-GM 2024 réunit les <b>neuropathies héréditaires et idiopathiques</b> au sein du bloc G60–G64 (polynévrites et autres affections du système nerveux périphérique). Elle ne contient aucune exclusion propre ; le bloc exclut la névralgie et la névrite sans précision (M79.2-), la névrite périphérique de la grossesse (O26.83) et la radiculite sans précision (M54.1-). Le tableau détaille les <button class="w" data-k="g60-codes">six sous-codes et leurs inclusions (lecture et limites du codage)</button>.</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé</th><th>Inclusions principales</th></tr></thead><tbody>
<tr><td>G60.0</td><td>Neuropathie héréditaire motrice et sensorielle</td><td>Maladie de Charcot-Marie-Tooth(-Hoffmann), maladie de Déjerine-Sottas, syndrome de Roussy-Lévy, neuropathie hypertrophique de la petite enfance, amyotrophie péronière</td></tr>
<tr><td>G60.1</td><td>Maladie de Refsum</td><td>Aucune inclusion listée</td></tr>
<tr><td>G60.2</td><td>Neuropathie associée à une ataxie héréditaire</td><td>Aucune inclusion listée</td></tr>
<tr><td>G60.3</td><td>Neuropathie progressive idiopathique</td><td>Aucune inclusion listée</td></tr>
<tr><td>G60.8</td><td>Autres neuropathies héréditaires et idiopathiques</td><td>Maladie de Morvan, syndrome de Nélaton, neuropathie sensitive à transmission dominante ou récessive</td></tr>
<tr><td>G60.9</td><td>Neuropathie héréditaire et idiopathique, sans précision</td><td>Aucune inclusion listée</td></tr></tbody></table>
<p>Ce tableau fixe l’architecture du cours : <b>G60.0</b> est le grand continent (la CMT), <b>G60.1</b> et <b>G60.2</b> sont des maladies métaboliques ou neurodégénératives dont la neuropathie est un élément, <b>G60.3</b> est un diagnostic d’exclusion, et <b>G60.8</b> accueille les neuropathies sensitives héréditaires. Deux précisions évitent des erreurs de codage ou de lecture.</p>
<div class="trap"><span class="k">Piège de codage</span> La HNPP n’est pas nommée dans les inclusions lues ; son rattachement à G60.0 ou à G60.8 n’est établi par aucune source du dossier. Elle est traitée ici pour sa valeur clinique, sans affirmer de code. De même, les maladies de Morvan, le syndrome de Nélaton et le syndrome de Roussy-Lévy ne sont que nommés par la classification : leur clinique n’est pas documentée dans les sources lues et n’est donc pas décrite.</div>
<p>Pour la CMT, la classification utile au lit du patient repose sur la <b>vitesse de conduction motrice du membre supérieur</b> et sur le mode de transmission (<button class="w" data-k="g60-seuil38">seuil de 38 m/s et sous-types (justification et limites)</button>).</p>
<table class="t"><thead><tr><th>Type</th><th>Vitesse motrice (membre supérieur)</th><th>Hérédité</th></tr></thead><tbody>
<tr><td>Démyélinisant, CMT1</td><td>inférieure à 38 m/s</td><td>autosomique dominante</td></tr>
<tr><td>Démyélinisant, CMT4</td><td>inférieure à 38 m/s</td><td>autosomique récessive</td></tr>
<tr><td>Axonal, CMT2</td><td>supérieure à 38 m/s</td><td>toute hérédité</td></tr>
<tr><td>Intermédiaire</td><td>25–45 m/s au début, puis 30–40 m/s</td><td>souvent liée à l’X (CMTX), formes autosomiques possibles</td></tr></tbody></table>
<p>La vitesse moyenne de la CMT1A est d’environ 21 m/s, et les formes démyélinisantes sévères ou récessives descendent souvent à 4–15 m/s. La nomenclature moderne met en avant le <b>nom du gène causal</b> : le guide espagnol dénombre environ 71 gènes de CMT, 20 gènes de neuronopathie motrice distale (<button class="w" data-k="g60-dhmn">dHMN (neuronopathies motrices distales héréditaires)</button>) et 23 gènes de neuropathie sensitive et autonome héréditaire (<button class="w" data-k="g60-hsan">HSN/HSAN (neuropathies sensitives et sensitivo-autonomes héréditaires)</button>). La CMT2 et la dHMN forment un continuum : un même gène, comme HSPB1, peut produire l’une ou l’autre.</p>
<div class="key"><b>À retenir.</b> La CMT se classe d’abord par la vitesse motrice (< 38 m/s : démyélinisante ; > 38 m/s : axonale), puis par le gène. Les rubriques G60.1, G60.2, G60.3 et G60.8 sont des entités distinctes, à ne pas confondre avec la CMT.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, bloc G60–G64</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM 2024 (fr), G60</a> ; <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</section>

<section class="ilot" id="g60-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>La CMT est la neuropathie héréditaire la plus fréquente. Sa prévalence mondiale est d’environ 1 pour 2500, avec de larges écarts selon les pays : de 9,7 pour 100 000 en Serbie à 82,3 pour 100 000 en Norvège dans une revue de dix études, soit 1/1214 en Akershus (Norvège) contre 1/9200 au Japon. La part des CMT1 varie de 37,6 à 84 % et celle des CMT2 de 12 à 35,9 % selon les séries. Au moins 10 % des CMT1A sont des cas sporadiques liés à une néomutation : une <button class="w" data-k="g60-arbre">histoire familiale négative</button> n’exclut donc jamais une forme héréditaire.</p>
<table class="t"><thead><tr><th>Gène ou forme</th><th>Fréquence rapportée</th></tr></thead><tbody>
<tr><td>CMT1A (duplication de PMP22)</td><td>40–50 % de toutes les CMT et 60–70 % des CMT1</td></tr>
<tr><td>CMT1B (MPZ)</td><td>environ 8 %</td></tr>
<tr><td>CMTX1 (GJB1)</td><td>7–12 %, deuxième forme en fréquence</td></tr>
<tr><td>Variants de SORD (surtout c.757delG)</td><td>jusqu’à 10 % des CMT2 et dHMN récessives</td></tr>
<tr><td>MT-ATP6</td><td>au moins 1 % des CMT axonales dans certaines séries</td></tr></tbody></table>
<p>Quatre gènes (PMP22, MPZ, GJB1 et MFN2) représentent plus de 90 % des cas confirmés génétiquement. Dans une cohorte allemande de 776 patients, la confirmation génétique atteignait 66 % des CMT1, 35 % des CMT2 et 58 % de l’ensemble : un test négatif n’exclut donc pas la maladie, surtout dans les formes axonales. Pour les formes rares, la HNPP touche environ 16 pour 100 000 personnes (jusqu’à 58,9 pour 100 000 selon un dépistage génétique néonatal) et reste vraisemblablement sous-diagnostiquée ; la maladie de Refsum de l’adulte, autosomique récessive, concerne environ 1 personne sur 1 000 000 ; la CIAP est diagnostiquée chez 10 à 25 % des personnes adressées pour un bilan de polyneuropathie, vers la sixième décennie, avec une prédominance masculine de 3 pour 2.</p>
<div class="trap"><span class="k">Lacune suisse</span> Aucune donnée d’épidémiologie suisse sur la CMT, sur le remboursement des analyses génétiques par l’assurance obligatoire des soins (<button class="w" data-k="g60-lacunes">OKP et lacunes du dossier</button>) ni sur les centres neuromusculaires n’a été trouvée. Seule une donnée de contexte suisse est disponible : les polyneuropathies sensitives touchent environ 30 % des personnes âgées, ce qui place les causes acquises en tête chez la personne âgée.</div>

<section class="ilot" id="g60-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le raisonnement part du nerf normal. La gaine de myéline des nerfs périphériques est fabriquée par la <b>cellule de Schwann</b>. La protéine zéro de la myéline (MPZ) en est le constituant protéique majeur ; la connexine 32 (GJB1) forme des jonctions communicantes de la cellule de Schwann, importantes pour l’équilibre de l’axone myélinisé. Un défaut de ces protéines, ou de l’axone lui-même, perturbe donc la conduction ou la survie de la fibre.</p>
<table class="t"><thead><tr><th>Forme</th><th>Anomalie</th><th>Mécanisme et conséquence</th></tr></thead><tbody>
<tr><td><button class="w" data-k="g60-cmt1a">CMT1A (duplication de PMP22)</button></td><td>duplication de 1,4 Mb incluant PMP22</td><td>la surexpression de PMP22 provoque une neuropathie démyélinisante ; la biopsie montre une démyélinisation avec « bulbes d’oignon »</td></tr>
<tr><td><button class="w" data-k="g60-mpz">CMT1B (MPZ)</button></td><td>variants de MPZ</td><td>atteinte de la myéline ; les formes très précoces et sévères évoquent la maladie de Déjerine-Sottas</td></tr>
<tr><td><button class="w" data-k="g60-cmtx1">CMTX1 (GJB1)</button></td><td>perte de connexine 32</td><td>neuropathie démyélinisante des cellules de Schwann myélinisantes ; hommes plus atteints</td></tr>
<tr><td><button class="w" data-k="g60-mfn2">CMT2A (MFN2)</button></td><td>mitofusine 2</td><td>dysfonction mitochondriale et neuropathie axonale</td></tr>
<tr><td><button class="w" data-k="g60-hnpp">HNPP</button></td><td>délétion 17p11.2-p12 incluant PMP22</td><td>renflements focaux de myéline (tomacula) ; blocs de conduction aux sites de compression</td></tr>
<tr><td><button class="w" data-k="g60-refsum">Refsum</button></td><td>perte de fonction de PHYH ou PEX7</td><td>accumulation d’acide phytanique dans la rétine, la myéline, le tissu adipeux et les organes</td></tr></tbody></table>
<p>Malgré cette diversité, les formes convergent vers une <b>voie commune</b> : une perte axonale progressive, longueur-dépendante, qui corrèle avec le déficit clinique. Les formes démyélinisantes impliquent des gènes de la gaine de myéline, de la réponse aux protéines mal repliées, du trafic endosomal ou des facteurs de transcription ; les formes axonales, la biologie mitochondriale, les aminoacyl-ARNt synthétases, les chaperons ou le cytosquelette axonal. C’est cette perte des fibres les plus longues qui explique l’ordre d’apparition : les pieds avant les mains, la faiblesse distale, l’aréflexie puis le déficit sensitif distal. Un <b>pied creux</b> signale une dénervation commencée dans l’enfance ; dans les deux premières années, un pied plat valgus peut être le premier signe (<button class="w" data-k="g60-pied-creux">pied creux (signe, mécanisme et pièges)</button>).</p>
<p>Le cas de la HNPP éclaire le lien entre mécanisme et clinique. Chez la souris HNPP, un bloc de conduction apparaît plus vite sous compression et récupère plus lentement : le nerf, fragilisé, ne supporte plus les compressions ordinaires, d’où des paralysies épisodiques indolores. Pour la maladie de Refsum, la majorité de l’acide phytanique est stockée dans le tissu adipeux ; le jeûne et la perte de poids mobilisent ce stock et provoquent des décompensations aiguës corrélées au taux circulant (<button class="w" data-k="g60-ap">acide phytanique (stockage et mobilisation)</button>).</p>
<div class="key"><b>À retenir.</b> Tout part de la cellule de Schwann (myéline) ou de l’axone (mitochondries, cytosquelette) ; l’aboutissement est une perte axonale longueur-dépendante. La HNPP est une maladie de la vulnérabilité à la compression ; le Refsum, une maladie du stock d’acide phytanique mobilisable.</div>

</section>

<section class="ilot" id="g60-4"><h2><span class="n">4</span>Causes et facteurs aggravants</h2>
<p>Les causes se répartissent selon les rubriques du code.</p>
<ul>
<li><b>G60.0 — CMT et formes apparentées.</b> Mutations de PMP22, MPZ, GJB1, MFN2 et de dizaines d’autres gènes, à transmission dominante, récessive ou liée à l’X ; la CMT1A, la CMTX1 et la CMT1B sont les plus fréquentes.</li>
<li><b>G60.1 — <button class="w" data-k="g60-refsum">Maladie de Refsum</button>.</b> Variants de perte de fonction de PHYH (au moins 90 % des cas) ou de PEX7, transmission autosomique récessive. Il faut la distinguer de la forme infantile (« infantile Refsum disease »), forme légère du spectre de Zellweger.</li>
<li><b>G60.2 — Neuropathie associée à une <button class="w" data-k="g60-ataxie">ataxie héréditaire</button>.</b> Dans les ataxies héréditaires, l’atteinte nerveuse la plus fréquente est une neuronopathie sensitive ou sensitivomotrice ; le syndrome CANVAS (variants de RFC1) en est un exemple, l’ataxie spastique de Charlevoix-Saguenay (SACS) une exception à conduction de type intermédiaire.</li>
<li><b>G60.3 — <button class="w" data-k="g60-ciap">Neuropathie axonale idiopathique chronique</button>.</b> Diagnostic d’exclusion après un bilan approprié.</li>
<li><b>G60.8 — neuropathies sensitives héréditaires</b> (HSN/HSAN), dont le détail clinique n’est pas documenté dans les sources lues.</li>
</ul>
<p>Plusieurs <b>facteurs aggravants</b> sont évitables et doivent être cherchés activement : les <button class="w" data-k="g60-neurotox">médicaments neurotoxiques (liste et niveaux de risque)</button>, surtout la vincristine et le paclitaxel ; les compressions et les traumatismes répétés chez les porteurs de HNPP ; le jeûne, l’infection intercurrente et l’amaigrissement rapide dans le Refsum ; enfin la grossesse, qui aggrave les symptômes chez environ un tiers des patientes atteintes de CMT. Le bilan d’une polyneuropathie recherche en parallèle les causes acquises usuelles — alcool, diabète, carence en vitamine B12, gammapathie monoclonale (<button class="w" data-k="g60-acquises">neuropathies acquises à exclure</button>).</p>
<div class="key"><b>À retenir.</b> Une neuropathie héréditaire se révèle souvent par un facteur évitable. Interroger sur la chimiothérapie, les compressions, le jeûne et la grossesse fait partie du bilan, au même titre que l’arbre généalogique.</div>

<section class="ilot" id="g60-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche l’âge de début, le rythme d’évolution, les antécédents familiaux et les facteurs aggravants. Le début se situe habituellement dans la première ou la deuxième décennie ; la CMT1 débute plus tôt que la CMT2. Une évolution <b>lente</b> oriente contre une cause immune, et une faiblesse ou une atrophie longueur-dépendante marquée oriente contre une neuropathie métabolique ou toxique « en chaussettes » à prédominance sensitive. L’<b><button class="w" data-k="g60-arbre">arbre généalogique</button></b> remonte à au moins trois générations.</p>
<p>Les symptômes sensitifs positifs sont rares dans la CMT. Les crampes sont rapportées jusqu’à 85 % des cas, la douleur chez 23 à 85 % des patients (<button class="w" data-k="g60-douleur">douleur et crampes (types et prise en charge)</button>), et la fatigue est fréquente.</p>
<div class="two"><div class="card"><h4>Forme typique : CMT</h4>
<p>Chevilles instables, entorses répétées, chute du pied, difficulté à courir ; puis atteinte des mains (maladresse, perte de force de pince). Antécédents familiaux souvent positifs, mais non obligatoires (néomutations). Les symptômes sensitifs positifs sont rares.</p></div>
<div class="card"><h4>Formes particulières</h4>
<p><b>HNPP :</b> mononeuropathies épisodiques, récidivantes, indolores, déclenchées par une compression ou une traction (57,8 %), à un site d’enclavement — nerf fibulaire à la tête de la fibula, ulnaire au coude, plexus brachial, radial à la gouttière, médian au poignet. Début à 26,5 ans en moyenne, délai diagnostique allant jusqu’à 40 ans.<br><b>Refsum :</b> cécité nocturne, perte de l’odorat, surdité, avec un délai moyen de 11 ans entre le premier avis ophtalmologique et le diagnostic.<br><b>Ataxie héréditaire :</b> imbalance progressive, oscillopsie, troubles sensitifs et toux sèche chronique (CANVAS).<br><b>CIAP :</b> début insidieux, évolution lente ou nulle sur au moins six mois, sensitivomotrice, axonale.</p></div></div>
<div class="quiz ui"><p><b>Cas.</b> Une femme de 31 ans présente un « pied tombant » apparu après une nuit passée jambes croisées, sans douleur, qui récupère en quelques semaines. Son père a eu une « main tombante » après avoir passé du temps accoudé. Quelle forme évoquer ?</p><button data-ok="1">HNPP : paralysies compressives épisodiques et indolores, avec antécédent familial</button><button data-ok="0">CMT1A typique, qui n’a jamais de caractère épisodique</button><button data-ok="0">CIAP, qui débute après 40 ans par des signes sensitifs distaux</button><p class="fb" hidden>Des mononeuropathies récidivantes, indolores, déclenchées par une compression et renforcées par un antécédent familial (64,5 % dans la série) orientent vers une HNPP, liée à une délétion de PMP22. La CMT1A progresse lentement sans épisodes et la CIAP débute tardivement sans histoire familiale.</p></div>
<button class="pareto-btn ui" data-k="pareto-g60-anamnese">▲ Loi de Pareto — Anamnèse</button>

<section class="ilot" id="g60-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes de déformation, force, réflexes, sensibilité, puis signes ciblant une forme particulière. Il documente la force par la cotation MRC et fournit le score initial de suivi (<button class="w" data-k="g60-cmtns">CMTNS et CMTES (échelles de suivi)</button>).</p>
<div class="two"><div class="card"><h4>CMT</h4>
<p>Faiblesse distale des membres inférieurs puis supérieurs ; <button class="w" data-k="g60-pied-creux">pied creux</button>, orteils en griffe, rétraction achilléenne ; atrophie distale en « mollet de coq » ou « bouteille de champagne inversée » ; réflexes diminués ou abolis, surtout aux membres inférieurs. Des <b><button class="w" data-k="g60-nerfs">nerfs hypertrophiés palpables</button></b> constituent un signe relativement spécifique de la CMT1A. Atteinte plus rare des nerfs crâniens, tremblement, scoliose, contractures. L’asymétrie est plus fréquente dans la CMT2 (environ 20 %). Dans la CMTX1, l’atteinte prédomine sur les muscles thénariens.</p></div>
<div class="card"><h4>Formes particulières</h4>
<p><b>HNPP :</b> pied creux (12,1 %), atrophie et douleur (17,7 %). <b>Refsum :</b> neuropathie axonale distale symétrique lentement progressive (71 %), ichtyose (43 %, corrélée au taux d’acide phytanique), raccourcissement des métacarpiens et métatarsiens, phalange terminale du pouce courte et conique. <b>CANVAS :</b> neuropathie sensitive et abolition bilatérale du réflexe vestibulo-oculaire.</p></div></div>
<p>Deux gestes valent une explication. La palpation des nerfs superficiels recherche un épaississement, signe relativement spécifique de la CMT1A. L’examen des réflexes tendineux, diminués ou abolis surtout aux membres inférieurs, confirme le caractère longueur-dépendant de l’atteinte (<button class="w" data-k="g60-areflexie">réflexes (technique et valeur)</button>). L’examen du pied note enfin si la déformation est souple ou structurée, car les orthèses et la toxine botulique concernent le pied creux souple, la chirurgie la déformation structurée.</p>
<div class="quiz ui"><p><b>Cas.</b> À l’examen d’un jeune patient, des nerfs ulnaires et fibulaires épaissis sont palpables ; la vitesse du nerf médian est de 20 m/s. Quelle recherche génétique faire en premier ?</p><button data-ok="1">Duplication ou délétion de PMP22 (par exemple par MLPA)</button><button data-ok="0">Séquençage de SORD, car il explique la majorité des CMT</button><button data-ok="0">Aucune, puisque la biopsie nerveuse est de référence</button><p class="fb" hidden>Une vitesse motrice du médian ou de l’ulnaire inférieure à 38 m/s déclenche, selon le guide espagnol, la recherche de duplication ou de délétion de PMP22, car la CMT1A est la cause la plus fréquente (40–50 % des CMT). La biopsie n’est réservée qu’à la suspicion d’une neuropathie traitable ou à la recherche.</p></div>
