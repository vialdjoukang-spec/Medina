<template data-pop="e30-lucrin" data-title="Leuproréline dépôt 3,75 mg — FI suisse mai 2025"><div class="lab">Formulation et indication</div><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">Lucrin Dépôt</a> contient par seringue double compartiment 3,75 mg d’acétate de leuproréline, correspondant à 3,57 mg de leuproréline. Après reconstitution, la suspension s’administre par voie sous-cutanée ou intramusculaire. Cette FI n’est pas celle d’une préparation à douze semaines [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<p>Pour la précocité centrale, la FI demande un développement rapidement progressif avec début de traitement avant huit ans chez la fille/neuf chez le garçon, test de stimulation positif et avance osseuse d’au moins un an. Le bilan recherche aussi causes surrénales, sécrétion chorionique et tumeurs. Ces critères de produit ne sont pas les seuls critères de diagnostic clinique de toute précocité [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Dose pédiatrique totale</div><p>Début recommandé : 0,3 mg/kg pour quatre semaines, minimum 7,5 mg, administré toutes les quatre semaines. La FI donne les paliers suivants ; ils ne sont pas remplacés par un calcul continu ou par une seule seringue [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<table class="t" data-e30-table="1"><thead><tr><th>Poids de la FI</th><th>Contenu total</th><th>Nombre d’unités 3,75 mg</th></tr></thead><tbody><tr><td>≤25 kg</td><td>7,5 mg</td><td>2</td></tr><tr><td>&gt;25 à 37,5 kg</td><td>11,25 mg</td><td>3</td></tr><tr><td>&gt;37,5 kg</td><td>15 mg</td><td>4</td></tr></tbody></table>
<p>Au maximum 2 ml par injection en un site ; si plusieurs injections sont nécessaires pour la dose totale, elles sont administrées en même temps selon la FI. Changer les sites et suivre les instructions de reconstitution. En suppression insuffisante, la FI prévoit des paliers de 3,75 mg par mois sous contrôle ; 15 mg n’est donc pas inventé comme plafond universel. Durée et arrêt sont spécialisés ; cette FI demande arrêt avant onze/douze ans [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Contrôle et mécanisme</div><p>Après stimulation initiale, l’exposition prolongée freine les gonadotrophines. Contrôler clinique, stéroïdes et stimulation un à deux mois après début ou changement ; âge osseux tous les six–douze mois selon cette FI. Une progression persistante appelle une réévaluation. Saignements possibles au début chez la fille ; s’ils surviennent après deux mois, informer le médecin [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<div class="lab">Contre-indications et risques</div><p>Hypersensibilité au produit/analogues, grossesse possible ou avérée et hémorragie vaginale non explorée figurent dans les limites. Éviter la voie intra-artérielle. Une apoplexie hypophysaire a été rapportée, notamment sur adénome ; la FI indique de ne pas traiter un adénome hypophysaire connu par agoniste. Une hypertension intracrânienne idiopathique est aussi signalée : céphalée, baisse visuelle ou œdème papillaire imposent évaluation urgente ; si confirmée, la FI demande arrêt durable par le prescripteur [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<p>Réactions locales/allergiques, changements d’humeur, symptômes de privation hormonale et modifications osseuses sont possibles. Les données adultes d’oncologie ne sont pas des incidences pédiatriques. Grossesse et allaitement sont exclus. Aucune étude d’interaction n’a été faite ; « aucune interaction connue » n’est pas « aucun risque avec tout médicament ». Les mises en garde sur allongement de la repolarisation ventriculaire concernent notamment la privation androgénique et demandent une analyse du contexte [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
<p>Une adaptation pédiatrique rénale/hépatique chiffrée n’est pas inventée dans ce cours ; vérifier l’ensemble de la FI et la situation avec l’équipe. Le traitement reste administré et suivi par des professionnels expérimentés [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>].</p>
</template>
<template data-pop="e30-pamorelin" data-title="Triptoréline 22,5 mg — FI suisse juillet 2026"><div class="lab">Produit et indication</div><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">Pamorelin LA</a> 22,5 mg contient la triptoréline sous forme d’embonate. Après reconstitution par 2 ml d’eau pour préparations injectables, la suspension contient 11,25 mg/ml. La FI indique la précocité centrale dès deux ans, dont le début est avant huit ans chez la fille/neuf chez le garçon. Le diagnostic est confirmé et les causes périphériques sont exclues [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<div class="lab">Dose, voie et suivi</div><p>22,5 mg par injection intramusculaire toutes les vingt-quatre semaines, sous contrôle d’une équipe experte. Vingt-quatre semaines correspondent à 168 jours ; on ne les transforme pas en six mois calendaires. Éviter toute injection intravasculaire et changer périodiquement le site. La préparation et le dispositif sont vérifiés par le personnel formé [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Contrôle hormonal adapté un à deux mois après la première injection, puis selon spécialiste ; taille tous les trois–six mois et surveillance osseuse régulière. La FI demande arrêt avant onze ans chez la fille et douze chez le garçon. Ni une durée universelle de deux ans ni un raccourcissement autonome de l’intervalle ne sont prescrits ici. Moins de deux ans : usage non recommandé faute d’étude [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<div class="lab">Bilan et contre-indications</div><p>Hypersensibilité, grossesse et allaitement contre-indiquent le produit. La FI demande d’exclure une tumeur intracrânienne ; les données pédiatriques en présence d’une telle tumeur manquent et un rapport bénéfice-risque individuel approfondi est requis. Un adénome hypophysaire connu est une autre précaution majeure mentionnée. Le débat d’imagerie de dépistage ne supprime pas cette évaluation du produit [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<div class="lab">Effets et interactions</div><p>La stimulation initiale peut entraîner des saignements vaginaux transitoires ; s’ils persistent, consulter. Les réactions locales, céphalées, bouffées, humeur et poids sont surveillés. Des réactions allergiques graves, convulsions, hypertension intracrânienne idiopathique et réactions cutanées sévères sont signalées. Fièvre avec lésions cutanées/muqueuses, signes neurologiques ou allergie imposent une évaluation urgente. Après arrêt, une douleur/boiterie de hanche peut faire rechercher une épiphysiolyse [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
<p>Les traitements affectant les gonadotrophines peuvent modifier la réponse et demandent contrôle. Les interactions pharmacocinétiques sont peu probables selon les données de la FI, ce qui ne supprime pas les interactions pharmacodynamiques et précautions. La FI ne demande pas d’adaptation rénale ou hépatique. La grossesse est exclue avant traitement si pertinente ; l’allaitement est contre-indiqué. Les données pédiatriques de fertilité à long terme et celles chez les garçons restent limitées : pas de garantie individuelle [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
</template>
<template data-pop="e30-testoviron" data-title="Énanthate de testostérone — FI suisse juillet 2026"><div class="lab">Formulation et mécanisme</div><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">Testoviron Dépôt</a> est une solution huileuse à 250 mg/ml d’énanthate de testostérone. L’ester libère la testostérone, qui agit sur les tissus et peut être aromatisée. Son utilisation pour induire des caractères secondaires ne remplace pas une stimulation gonadique de la spermatogenèse en déficit central [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
<div class="lab">Induction tardive du garçon</div><p>La FI décrit début à 50 mg toutes les quatre semaines, augmenté progressivement pour atteindre jusqu’à 250 mg toutes les trois semaines sur une période de trois ans. Cette rubrique est réservée aux médecins expérimentés en endocrinologie pédiatrique. La FI précise aussi l’absence d’études chez l’enfant/adolescent et l’absence d’indication avant l’âge pubertaire ; ces limites ne sont pas masquées [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
<p>Ne pas copier le début adulte à 250 mg toutes les deux–trois semaines pour une induction ordinaire. Le rythme dépend de la croissance, du stade, des besoins et de la tolérance. Le dosage sérique est suivi avec son moment par rapport à l’injection, notamment en fin d’intervalle selon la FI. Le schéma n’est pas un plafond universel de tous les patients [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
<div class="lab">Voie et risques</div><p>Injection exclusivement intramusculaire, très lente et profonde dans le muscle fessier, par professionnel avec matériel adapté. Une toux/dyspnée pendant ou juste après une injection huileuse mérite surveillance et évaluation. Ne pas injecter dans un vaisseau. Réactions locales, polyglobulie, prise pondérale, effets psychiques, acné et effets de surandrogénisation sont possibles ; la croissance et la maturation sont suivies [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
<p>Contre-indications : cancer prostatique ou mammaire masculin, hypercalcémie de cancer, tumeur hépatique passée/présente, hypersensibilité et population féminine selon la FI. Le produit n’est pas un traitement œstrogénique ; grossesse/allaitement sont exclus, avec risque de virilisation fœtale. Maladie rénale/hépatique : absence d’études dédiées, pas adaptation forfaitaire inventée ; tumeur hépatique contre-indiquée [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
<div class="lab">Interactions et suivi</div><p>Inducteurs et inhibiteurs enzymatiques peuvent modifier l’exposition. Les anticoagulants coumariniques demandent contrôle de coagulation ; les besoins antidiabétiques peuvent diminuer. La FI juillet 2026 signale une augmentation possible de l’érythrocytose avec certains inhibiteurs du transport rénal du glucose. Corticostéroïdes, risque d’œdème et autres traitements sont revus. Hématocrite, symptômes, pression et autres paramètres suivent l’âge, la dose et le contexte [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680176260359" target="_blank" rel="noopener">S13</a>].</p>
</template>
<template data-pop="e30-estradiol" data-title="Estradiol : protocole européen et produit suisse distincts"><div class="lab">But de l’induction</div><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">Endo-ERN</a> recommande le 17β-estradiol pour l’induction ou le maintien de la puberté féminine en déficit. Le schéma est progressif, en général sur deux–trois ans, avec suivi tous les trois–six mois. Il vise développement, acquisition osseuse et maturation utérine si un utérus est présent, en tenant compte de la croissance et du vécu. Les contraceptifs combinés ne sont pas le schéma initial d’induction recommandé [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<p>Le tableau européen cite, parmi ses repères de début transdermiques, 3–7 µg/j d’estradiol. Ce chiffre n’est pas une ordonnance de découper un dispositif : préparation, délivrance réelle, stabilité et cadre d’emploi doivent être vérifiés avec le centre et la pharmacie. Le texte européen souligne que certains patchs sont inadaptés à une petite fraction ou instables à chaleur élevée. Aucun fragment de patch ou de dragée n’est prescrit par ce cours [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
<div class="lab">Produit suisse relu</div><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">Progynova</a> 2 mg et <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">Progynova</a> mite 1 mg sont des dragées de valérate d’estradiol, FI octobre 2022. La dose adulte y débute normalement à 2 mg/j, éventuellement réduite à 1 mg/j. Ces milligrammes de produit adulte ne sont pas la dose de début pubertaire ci-dessus. La FI ne prévoit aucune indication chez l’enfant et l’adolescente ; un usage spécialisé hors indication ne devient pas une autorisation pédiatrique de la FI [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Utérus et progestatif</div><p>Dans l’induction, le moment d’ajout du progestatif dépend de la maturation, des saignements et de la durée, souvent aux premiers saignements intercurrents ou vers deux ans selon les recommandations européennes. La protection de l’endomètre est nécessaire si utérus et exposition œstrogénique prolongée. Le schéma adulte <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">Progynova</a> demandant au moins douze–quatorze jours de progestatif par cycle est distinct ; pas prescription automatique de ce schéma dès le premier jour pubertaire. Aucun produit progestatif non relu n’est dosé ici [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>].</p>
<div class="lab">Contre-indications et sécurité de <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">Progynova</a></div><p>Grossesse/allaitement, cancer hormonodépendant suspect/avéré, hyperplasie endométriale non traitée, saignement inexpliqué, tumeur/atteinte hépatique sévère, antécédent de thrombose ou risque thromboembolique important et hypersensibilité figurent parmi les contre-indications. Le risque et les données adultes ne sont pas des taux pédiatriques. Céphalée nouvelle intense, déficit visuel, signes thrombotiques ou atteinte hépatique imposent une évaluation rapide [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>].</p>
<p>Inducteurs enzymatiques peuvent diminuer l’effet, inhibiteurs l’augmenter ; les médicaments coadministrés sont revus. L’atteinte rénale est peu étudiée ; l’atteinte hépatique sévère est contre-indiquée, légère/modérée surveillée. Nausées, céphalées, troubles mammaires et saignements sont possibles. Le produit n’est pas contraceptif. La durée et le relais adulte se décident selon besoin, bénéfice et risques, sans transformer une préparation ménopausique en recette pédiatrique [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680331490423" target="_blank" rel="noopener">S14</a>].</p>
</template>
<template data-pop="e30-undecanoate" data-title="Undécanoate de testostérone adulte — FI juin 2026"><p><a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">Testosteron-Mepha</a> contient 1000 mg d’undécanoate de testostérone dans 4 ml de solution huileuse. La FI décrit chez l’adulte une injection intramusculaire profonde, très lente, toutes les dix–quatorze semaines ; le premier intervalle peut être raccourci jusqu’à six semaines. Ce n’est ni l’ester ni le rythme de la faible dose d’énanthate d’induction [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<p>Aucune étude n’a été menée sous dix-huit ans ; la FI ne l’indique pas avant la puberté. <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">Endo-ERN</a> conseille de ne pas l’utiliser au début/aux premiers stades d’induction, en raison du risque de maturation osseuse trop rapide et de réduction du potentiel de taille. Une transition adulte est une autre décision après le développement, pas un raccourci d’induction [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<p>Éviter toute voie intravasculaire. Une micro-embolie pulmonaire d’huile peut provoquer toux, dyspnée, douleur thoracique, malaise ou syncope pendant ou après l’injection : surveillance par professionnel et prise en charge adaptée. Les contre-indications incluent cancers androgénodépendants, tumeur hépatique, hypercalcémie tumorale, hypersensibilité et population féminine selon la FI. L’absence d’études rénales/hépatiques ne prouve pas absence de risque [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
<p>La monographie est comparative, non un schéma pédiatrique. Un produit exact et une indication adulte confirmée seraient requis pour une prescription ; aucune adaptation ni dose pédiatrique ne sont déduites de 1000 mg [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680689890012" target="_blank" rel="noopener">S15</a>].</p>
</template>
<template data-pop="e30-semio" data-title="Sémiologie structurée de la leçon"><p>Le volet Sciences commence par neuf rubriques : normal, signes, mécanismes, examen, interprétation, différentiels, urgence, limites et sources. Chaque signe est relié à une question et une action. Chronologie, croissance et progression empêchent de conclure sur une pilosité ou un chiffre isolé [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</template>
<template data-pop="e30-stades" data-title="Stades pubertaires et méthode de mesure"><p>La classification de Tanner décrit séparément le développement mammaire, génital et pileux. Le stade 2 mammaire correspond au début du développement glandulaire ; la pilosité peut suivre un autre calendrier. Le volume testiculaire est mesuré avec un outil identifié, notamment l’orchidomètre de Prader [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">Endo-ERN</a> utilise le repère ≥4 ml pour le début testiculaire ; le guide allemand et la cohorte suisse ancienne emploient d’autres repères. L’échographie n’est pas une conversion automatique de l’orchidomètre. Un âge limite indique une évaluation, pas une preuve unique d’étiologie ou une raison d’attendre malgré une maladie [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://register.awmf.org/assets/guidelines/174-022l_S1_Pubertas-tarda-und-Hypogonadismus_2021-12.pdf" target="_blank" rel="noopener">S8</a>, <a data-reference-source="1" href="https://pubmed.ncbi.nlm.nih.gov/6618890/" target="_blank" rel="noopener">S10</a>].</p>
<p>L’examen est expliqué, proportionné et respectueux. Aucun dessin de maturation génitale créé par intelligence artificielle n’est utilisé comme preuve anatomique [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e30-gonadotrophines" data-title="Gonadotrophines et stéroïdes : lire le profil"><p>L’hormone lutéinisante et l’hormone folliculostimulante sont des signaux hypophysaires. Elles agissent sur les gonades ; les stéroïdes sexuels et les peptides exercent des rétrocontrôles. Les compartiments et les produits mesurés ne sont pas équivalents [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-1-anatomy-and-physiology-of-the-testicular-reproductive-system" target="_blank" rel="noopener">S18</a>, <a data-reference-source="1" href="https://openstax.org/books/anatomy-and-physiology-2e/pages/27-2-anatomy-and-physiology-of-the-ovarian-reproductive-system" target="_blank" rel="noopener">S19</a>].</p>
<p>Le signal lutéinisant stimule notamment les cellules de Leydig ; le signal folliculostimulant agit sur le compartiment de soutien. Dans un déficit primaire, le signal peut être élevé face à une réponse gonadique faible ; dans un déficit central ou une inhibition fonctionnelle, il peut être bas ou inadapté. Le retard constitutionnel et le déficit permanent ont des recouvrements initiaux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>].</p>
<p>Un dosage conserve âge, stade, heure, méthode et traitements reçus. Les basses valeurs pédiatriques nécessitent une sensibilité analytique adaptée. Aucun seuil basal ou stimulé n’est déclaré universel ni suffisant seul [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</template>
<template data-pop="e30-imagerie" data-title="Imagerie : indication clinique et limites de produit"><p>Le guide danois approuvé février 2025 préconise une résonance magnétique cérébrale pour les filles centrales de moins de six ans, une discussion spécialisée à six–huit ans, et tous les garçons centraux de moins de neuf ans. La recommandation italienne publiée en 2024/2025 indique aussi l’imagerie chez tous les garçons centraux [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
<p>Une revue européenne 2026 analyse des séries italiennes sélectionnées où la fréquence des lésions est plus basse que dans certaines anciennes cohortes mêlant causes, sexes ou antécédents. Elle discute une approche sélective chez les garçons de huit–neuf ans sans signe neurologique et reprend une guideline américaine récente, tout en demandant validation prospective. Ce n’est ni une exclusion individuelle de tumeur ni un nouveau consensus européen universel [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>Jeune âge, progression rapide, signe neurologique, antécédent ou profil atypique renforcent la recherche structurale. Une histoire familiale ou un variant ne suppriment pas cette évaluation. L’urgence symptomatique est distincte d’un dépistage électif [<a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>La FI Lucrin mentionne une tomographie cérébrale dans son bilan, tandis que les parcours cliniques discutent la résonance magnétique. Pamorelin demande d’exclure une tumeur intracrânienne et souligne l’absence de données chez les enfants ayant cette lésion. Le prescripteur confronte bilan, méthode et conditions du produit ; ni irradiation automatique ni dispense universelle d’imagerie ne sont déduites de ce cours [<a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
</template>
<template data-pop="e30-genes" data-title="Variants et fonction : interprétation spécialisée"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">MKRN3</a> et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">DLK1</a> désignent des gènes participant aux freins de l’activation pubertaire ; des pertes de fonction avec expression paternelle soumise à empreinte sont décrites dans des précocités familiales. <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">KISS1</a> code la kisspeptine et <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">KISS1R</a> son récepteur ; de rares gains de fonction peuvent favoriser l’activation [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
<p>La transmission, la classification du variant, la famille et la clinique doivent être cohérentes. Un variant incertain n’est pas un diagnostic. Toutes les précocités ne sont pas monogéniques et un résultat familial ne remplace pas la recherche de drapeaux rouges. Dans le retard, les mécanismes centraux, gonadiques et chromosomiques requièrent une autre analyse orientée [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11729124/" target="_blank" rel="noopener">S6</a>, <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13422188/" target="_blank" rel="noopener">S17</a>].</p>
</template>
<template data-pop="e30-codes" data-title="Libellés et exclusions : périmètre daté"><table class="t" data-e30-table="1"><thead><tr><th>Code local suisse 2024</th><th>Libellé</th></tr></thead><tbody><tr><td>E30</td><td>Anomalies de la puberté, non classées ailleurs</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E30.0</a></td><td>Puberté retardée</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E30.1</a></td><td>Puberté précoce</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E30.8</a></td><td>Autres anomalies de la puberté</td></tr><tr><td><a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E30.9</a></td><td>Anomalie de la puberté, sans précision</td></tr></tbody></table>
<p>Les notes allemandes 2024 distinguent la forme centrale vers <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E22.8</a> et les causes surrénales ou <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">McCune-Albright</a> vers leurs catégories. Les formes isolées de thélarche/pubarche sont incluses dans <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E30.8</a>. Aucun diagnostic voisin ni remboursement 2026 n’est automatiquement déduit du seul symptôme [<a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">S1</a>, <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>].</p>
</template>
<template data-pop="e30-profiles" data-title="Objectifs suisses de formation"><p><a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">PROFILES</a> signifie Principal Relevant Objectives and Framework for Integrated Learning and Education in Switzerland. Les situations de croissance/puberte inhabituelles et d’examen génital sont reliées pédagogiquement à cette leçon. Aucun lien officiel avec la classification des maladies, aucune fréquence d’examen ni question fédérale garantie n’est revendiqué [<a data-reference-source="1" href="https://smifk-cims.ch/download_file/view/c28daec4-78b0-4a6e-a198-00ca757191fc/261" target="_blank" rel="noopener">S20</a>].</p>
</template>
<template data-pop="e30-chuv" data-title="Institution suisse et document daté"><p><a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">CHUV</a> désigne le Centre hospitalier universitaire vaudois, à Lausanne. La page clinique et la brochure 2021 sont distinguées dans les références ; cette dernière ne prouve pas absence d’effets indésirables, d’interactions ou remboursement actuel. Les FI exactes et le suivi spécialisé gardent priorité [<a data-reference-source="1" href="https://www.chuv.ch/fr/dedop/dedop-home/patients-et-famille/endocrinologie/troubles-de-la-puberte" target="_blank" rel="noopener">S3</a>, <a data-reference-source="1" href="https://www.chuv.ch/fileadmin/sites/dedop/52184_21_fiche_endocrinologie_pediatrique__1_.pdf" target="_blank" rel="noopener">S4</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680519030489" target="_blank" rel="noopener">S11</a>, <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680612380023" target="_blank" rel="noopener">S12</a>].</p>
</template>
<template data-pop="e30-europe" data-title="Recommandation du réseau européen endocrine"><p><a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">Endo-ERN</a> est le réseau européen de référence pour les maladies endocriniennes rares. Sa recommandation 2022 d’induction est soutenue par les sociétés européennes d’endocrinologie pédiatrique, d’endocrinologie et d’andrologie. Plusieurs recommandations reposent sur des preuves limitées et une expertise, ce qui est explicité. Elle ne remplace pas la FI suisse d’un produit [<a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9066594/" target="_blank" rel="noopener">S5</a>].</p>
</template>
<template data-pop="e30-syndrome" data-title="Syndrome étiologique et classement distinct"><p>Le syndrome de <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">McCune-Albright</a> fait partie des causes possibles de précocité périphérique ; le guide danois cite un mécanisme génétique d’activation. Les notes de classification le renvoient à <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">Q78.1</a>, distinct de <a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">E30.1</a>. La leçon ne pose pas ce diagnostic sur un signe isolé ; le bilan syndromique est spécialisé [<a data-reference-source="1" href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">S2</a>, <a data-reference-source="1" href="https://paediatri.dk/images/dokumenter/Retningslinjer_2025/Pubertas_pr%C3%A6cox_febr._2025.pdf" target="_blank" rel="noopener">S7</a>].</p>
</template>
