<template id="d64-e01-w1" data-pop="d64-e01-w1" data-title="Indices érythrocytaires : bases et calculs"><p>Le VGM s’exprime en femtolitres et se calcule pédagogiquement par hématocrite (%) × 10 / hématies (T/L). Avec 30 % et 3,0 T/L, il vaut 100 fL. La teneur corpusculaire moyenne en hémoglobine, ou TCMH, vaut hémoglobine (g/L) / hématies (T/L) ; avec 100 g/L et 3,0 T/L, elle vaut 33,3 pg. La concentration corpusculaire moyenne, ou CCMH, vaut hémoglobine (g/L) / hématocrite (L/L), soit 100 / 0,30 = 333 g/L. Ces valeurs fictives décrivent trois grandeurs différentes. Les intervalles du tableau local et la méthode restent nécessaires pour l’interprétation.</p><p class="src">Sources : <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">CSCQ — Fiche technique MCV, MCH, MCHC (Brakch et Kesseler, octobre 2011)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-e01-w2" data-pop="d64-e01-w2" data-title="Réticulocytes absolus et indice réticulaire : domaine d’usage"><p>Avec 3,0 T/L d’hématies et 2 % de réticulocytes, le nombre absolu vaut 60 G/L. Le document genevois définit aussi un indice réticulaire : pourcentage de réticulocytes × hématocrite du patient ÷ hématocrite visé. Si l’on choisit pour l’exercice un hématocrite visé de 45 % et un hématocrite du patient de 30 %, il vaut 2 × 30 ÷ 45 = 1,33. Le même document considère l’anémie comme régénérative lorsque l’indice atteint 2 et comme arégénérative en dessous.</p><p>La valeur de 45 % est une hypothèse de l’exercice, pas une référence universelle. Cet indice ne contient pas de correction de maturation ; il ne doit donc pas être confondu avec un indice de production réticulocytaire. Le contrôle zurichois rapporte, dans la dysérythropoïèse congénitale, un indice de production inférieur à 2 malgré des réticulocytes absolus normaux.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.mqzh.ch/cm/images/mq20152/pdf/bph2015_2_d.pdf" target="_blank" rel="noopener">Association suisse pour le contrôle de qualité médical — Kongenitale dyserythropoetische Anämie (MQZH 2015-02)</a>.</p></template>
<template id="pareto-d64-e01" data-pop="pareto-d64-e01" data-title="Loi de Pareto — Hémogramme et réticulocytes"><p class="ratio" data-cover="d64-e01"></p><ul><li>L’hémogramme décrit les cellules ; les réticulocytes décrivent leur arrivée récente dans le sang. Les calculs gardent leurs unités et leur portée descriptive.</li><li>3,0 × 10¹²/L × 0,02 = 60 × 10⁹/L. Le résultat peut être dans l’intervalle adulte sans constituer une réponse suffisante à l’anémie.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Retikulozyten" target="_blank" rel="noopener">Luzerner Kantonsspital — Retikulozyten (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.cscq.ch/SiteCSCQ/FichierPDF_FR/FT-MCV-MCH-MCHC-fr.pdf" target="_blank" rel="noopener">CSCQ — Fiche technique MCV, MCH, MCHC (Brakch et Kesseler, octobre 2011)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-e02-w1" data-pop="d64-e02-w1" data-title="Sidéroblastes : coloration et portée"><p>La coloration de Perls révèle le fer ferrique sous forme d’un dépôt bleu. Le sidéroblaste normal contient quelques granules dispersés ; la couronne exige au moins cinq granules autour d’au moins un tiers du noyau. Le pourcentage se compte parmi les précurseurs érythroïdes, et non parmi toutes les cellules médullaires. La planche compare des cellules sans granules ou à quelques granules dispersés à des cellules dont les granules sont nombreux ou en couronne ; elle ne donne pas à elle seule la cause. L’absence de barre d’échelle dans la publication empêche une mesure fiable de taille sur l’écran.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-e02-w2" data-pop="d64-e02-w2" data-title="Morphologie : description et diagnostic"><p>La description précède l’interprétation. Le compte rendu précise d’abord le prélèvement et la coloration, puis il décrit la taille relative, le noyau, le cytoplasme et la distribution des inclusions. Une ponctuation basophile concerne le sang périphérique et ne démontre pas un sidéroblaste médullaire. Des cellules binucléées orientent vers une dysérythropoïèse, mais le contexte distingue une maladie héréditaire d’anomalies acquises. La photographie électronique compare une organisation normale et une chromatine anormale ; elle ne permet pas un diagnostic moléculaire. La conclusion dit ce que l’image montre et ce qu’elle ne permet pas de décider.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-e02" data-pop="pareto-d64-e02" data-title="Loi de Pareto — Frottis, moelle et histologie"><p class="ratio" data-cover="d64-e02"></p><ul><li>La moelle montre un signe, non toute son étiologie. Le fer périnucléaire, les noyaux et la chromatine se décrivent avec la technique utilisée et ses limites.</li><li>La coloration et la distribution sont visibles. Le gène, la cause globale et une mesure de taille nécessitent d’autres données.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9318570/fullTextXML" target="_blank" rel="noopener">Lours et collaborateurs — Perls’ Stain Guidelines from the French-Speaking Cellular Hematology Group (Diagnostics 2022 ; 12:1698)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-e03-w1" data-pop="d64-e03-w1" data-title="Ferritine : bilan du fer et limites"><p>La ferritine reflète les réserves en fer, mais elle augmente aussi avec l’inflammation et l’atteinte hépatique. À Lucerne, l’intervalle adulte entre 20 et 60 ans est de 13 à 150 µg/L chez la femme et de 30 à 400 µg/L chez l’homme ; le document genevois retient une ferritine inférieure à 30 µg/L pour confirmer une carence devant une anémie microcytaire. La saturation de la transferrine, calculée à partir du fer et de la transferrine, renseigne le compartiment de transport. Leur association, le contexte inflammatoire et l’évolution sont plus informatifs qu’une valeur isolée.</p><p>Une ferritine élevée ne quantifie pas exactement le fer tissulaire ; une imagerie spécialisée ou un dosage du fer hépatique répond à cette question. Les seuils d’Exjade (500–1000 µg/L sous traitement, 1000 µg/L à l’introduction) servent une population traitée précise et ne définissent pas les intervalles du laboratoire. Enfin, une microcytose ne constitue jamais, à elle seule, une preuve de carence martiale.</p><p class="src">Sources : <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Ferritin" target="_blank" rel="noopener">Luzerner Kantonsspital — Ferritin (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Transferrinsaettigung" target="_blank" rel="noopener">Luzerner Kantonsspital — Transferrinsättigung (Page relue le 14 octobre 2026)</a>.</p></template>
<template id="d64-e03-w2" data-pop="d64-e03-w2" data-title="Génétique : variante et interprétation"><p>Un variant peut être pathogène, probablement pathogène, de signification incertaine ou sans lien causal démontré. L’interprétation confronte le phénotype, le mode de transmission et la ségrégation familiale, avec l’analyse du laboratoire spécialisé. Une variation incertaine ne justifie pas à elle seule une thérapeutique ciblée ou un dépistage prédictif présenté comme certain. Le compte rendu précise aussi les régions et types d’anomalies examinés. Une analyse négative n’exclut pas tout mécanisme génétique, particulièrement lorsque les signes cliniques et morphologiques restent très évocateurs.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a>.</p></template>
<template id="pareto-d64-e03" data-pop="pareto-d64-e03" data-title="Loi de Pareto — Bilans causaux, toxiques et génétiques"><p class="ratio" data-cover="d64-e03"></p><ul><li>Les examens s’organisent par hypothèse. Les associations biologiques orientent, tandis que les résultats discordants imposent une réévaluation explicite.</li><li>L’excès de zinc peut induire un déficit en cuivre ; cette hypothèse reste à confirmer.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Haematogramm_1_%28HG_1%29.html" target="_blank" rel="noopener">Luzerner Kantonsspital — Hämatogramm 1 (Page relue le 14 octobre 2026 ; source citée : manuel Sysmex 2022)</a>.</p></template>
<template id="d64-s01-w1" data-pop="d64-s01-w1" data-title="Moelle : organisation et cellules"><p>La moelle est un tissu organisé dans lequel mûrissent les cellules sanguines. Les précurseurs érythroïdes progressent vers une cellule spécialisée en hémoglobine, puis libèrent des réticulocytes. Leur développement dépend d’un microenvironnement et d’interactions avec des cellules de soutien ; les îlots érythroblastiques comprennent un macrophage central dans les modèles décrits. L’aspiration montre surtout les cellules isolées, tandis que la biopsie conserve l’architecture. Une moelle riche en précurseurs peut être inefficace si une fraction importante n’atteint pas la circulation.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a>.</p></template>
<template id="d64-s01-w2" data-pop="d64-s01-w2" data-title="Maturation érythroïde : étapes"><p>Le schéma publié conduit de la cellule souche hématopoïétique aux progéniteurs érythroïdes précoces, puis au proérythroblaste. Les stades suivants sont basophile, polychromatophile et orthochromatique. La cellule diminue de taille, s’enrichit en hémoglobine et condense sa chromatine. Après expulsion du noyau, le réticulocyte termine sa maturation avant de devenir une hématie. BFU-E et CFU-E désignent deux étapes fonctionnelles de progéniteurs étudiés par formation de colonies ; ces sigles ne sont pas des résultats de l’hémogramme. Le dessin montre l’ordre et les changements, sans reproduire une échelle cellulaire mesurable.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a>.</p></template>
<template id="pareto-d64-s01" data-pop="pareto-d64-s01" data-title="Loi de Pareto — Anatomie médullaire et histologie"><p class="ratio" data-cover="d64-s01"></p><ul><li>Une moelle riche peut produire peu d’hématies efficaces. Le prélèvement choisi dépend de la question : cellule, fer, architecture ou ultrastructure.</li><li>Le réticulocyte a perdu son noyau puis élimine progressivement le matériel résiduel.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a>.</p></template>
<template id="d64-s02-w1" data-pop="d64-s02-w1" data-title="Transport d’oxygène : grandeurs et unités"><p>Le contenu artériel CaO₂, en mL d’oxygène par dL de sang, est estimé par 1,34 × Hb × SaO₂ + 0,0031 × PaO₂. Hb doit être en g/dL, SaO₂ en fraction et PaO₂ en mmHg. Exemple fictif : Hb 100 g/L, SaO₂ 98 % et PaO₂ 100 mmHg. Il faut d’abord convertir l’Hb en 10 g/dL et la saturation en 0,98. L’oxygène lié vaut 1,34 × 10 × 0,98 = 13,132 mL/dL ; l’oxygène dissous vaut 0,0031 × 100 = 0,310 mL/dL ; le contenu total vaut 13,132 + 0,310 = 13,442 mL/dL. Le transport DO₂ vaut ce contenu multiplié par le débit cardiaque : à 5 L/min, multiplier encore par 10 dL/L donne 672,1 mL/min. La formule décrit une estimation globale, pas une cible thérapeutique ni la perfusion de chaque tissu.</p><p class="src">Sources : <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/06-le-monitorage-en-anesthesie-cardiaque/6-5-catheter-pulmonaire-arteriel-de-swan-ganz/6-5-9-transport-doxygene-et-rapport-do2-vo2" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Transport d’oxygène et rapport DO2/VO2 (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8269393/fullTextXML" target="_blank" rel="noopener">Tomc et Debeljak — Molecular Insights into the Oxygen-Sensing Pathway and Erythropoietin Expression Regulation in Erythropoiesis (International Journal of Molecular Sciences 2021 ; 22:7074)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-s02-w2" data-pop="d64-s02-w2" data-title="Régulation : bases et limites"><p>L’hypoxie rénale stabilise un facteur de transcription, notamment HIF2α, qui favorise l’expression de l’érythropoïétine. En présence d’oxygène, l’hydroxylation par les prolyl-hydroxylases et la reconnaissance par VHL favorisent la dégradation du facteur. En hypoxie, il peut s’associer à ARNT et activer des gènes cibles. La figure publiée résume plusieurs niveaux de régulation, y compris des mécanismes surtout étudiés en modèles cellulaires. Le signal hormonal agit sur des précurseurs capables de répondre ; il ne corrige pas automatiquement un défaut d’hème ou de maturation.</p><p class="src">Sources : <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/06-le-monitorage-en-anesthesie-cardiaque/6-5-catheter-pulmonaire-arteriel-de-swan-ganz/6-5-9-transport-doxygene-et-rapport-do2-vo2" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Transport d’oxygène et rapport DO2/VO2 (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8269393/fullTextXML" target="_blank" rel="noopener">Tomc et Debeljak — Molecular Insights into the Oxygen-Sensing Pathway and Erythropoietin Expression Regulation in Erythropoiesis (International Journal of Molecular Sciences 2021 ; 22:7074)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="pareto-d64-s02" data-pop="pareto-d64-s02" data-title="Loi de Pareto — Physiologie de l’érythropoïèse et de l’oxygène"><p class="ratio" data-cover="d64-s02"></p><ul><li>La saturation et le contenu en oxygène sont différents. L’hémoglobine, le débit cardiaque et les besoins tissulaires expliquent ensemble la tolérance.</li><li>La saturation est une fraction ; le contenu est une quantité par volume de sang.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/06-le-monitorage-en-anesthesie-cardiaque/6-5-catheter-pulmonaire-arteriel-de-swan-ganz/6-5-9-transport-doxygene-et-rapport-do2-vo2" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Transport d’oxygène et rapport DO2/VO2 (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://pac6.ch/fr/chapitres/28-transfusions-et-strategies-depargne-sanguine-en-anesthesie-cardiaque/28-2-la-transfusion-sanguine/28-2-5-risques-lies-a-la-depletion-erythrocytaire" target="_blank" rel="noopener">Précis d’anesthésie cardiaque 6 — Risques liés à la déplétion érythrocytaire (Édition en ligne relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8269393/fullTextXML" target="_blank" rel="noopener">Tomc et Debeljak — Molecular Insights into the Oxygen-Sensing Pathway and Erythropoietin Expression Regulation in Erythropoiesis (International Journal of Molecular Sciences 2021 ; 22:7074)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC8953437/fullTextXML" target="_blank" rel="noopener">Stevens-Hernandez et Bruce — Reticulocyte Maturation (Membranes 2022 ; 12:311)</a> ; <a data-reference-source="1" href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/documents/infos_soignants/anemie_arce.pdf" target="_blank" rel="noopener">HUG — Stratégie de médecine de premier recours : Anémie (2013)</a>.</p></template>
<template id="d64-s03-w1" data-pop="d64-s03-w1" data-title="Synthèse de l’hème : étapes, enzymes et compartiments"><p>La synthèse de l’hème mobilise huit enzymes. Les trois dernières et la première se trouvent dans la mitochondrie, les quatre autres dans le cytosol. Dans la matrice, la synthase de l’acide 5-aminolévulinique (ALAS, isoforme érythroïde ALAS2) condense glycine et succinyl-CoA grâce au phosphate de pyridoxal ; la glycine y entre par le transporteur SLC25A38.</p><p>Dans le cytosol, la porphobilinogène synthase (PBGS) condense deux acides 5-aminolévuliniques en porphobilinogène ; l’hydroxyméthylbilane synthase (HMBS) en unit quatre en une chaîne linéaire ; l’uroporphyrinogène III synthase (UROS) la referme en cycle ; l’uroporphyrinogène décarboxylase (UROD) retire quatre carboxyles et forme le coproporphyrinogène III. Celui-ci gagne l’espace intermembranaire, où la coproporphyrinogène oxydase (CPOX) forme le <a data-reference-source="1" href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15435" target="_blank" rel="noopener">protoporphyrinogène IX</a>, que la protoporphyrinogène oxydase (PPOX) oxyde en <a data-reference-source="1" href="https://www.ebi.ac.uk/chebi/searchId.do?chebiId=CHEBI:15430" target="_blank" rel="noopener">protoporphyrine IX</a>. Dans la matrice, la ferrochélatase (FECH) insère enfin le fer ferreux pour former l’hème.</p><p>Chaque étape correspond à une perturbation clinique précise : ALAS2 dans la forme liée à l’X, SLC25A38 pour la glycine, le plomb sur plusieurs enzymes dont la ferrochélatase, l’alcool sur la synthase de l’acide 5-aminolévulinique. Les transporteurs marqués d’un point d’interrogation restent inconnus dans cette revue de 2020.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC7140478/fullTextXML" target="_blank" rel="noopener">Swenson et collaborateurs — From Synthesis to Utilization: The Ins and Outs of Mitochondrial Heme (Cells 2020 ; 9:579)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a>.</p></template>
<template id="d64-s03-w2" data-pop="d64-s03-w2" data-title="Métabolisme du fer : lecture du bilan"><p>L’hepcidine, produite principalement par le foie, freine la disponibilité plasmatique du fer en agissant sur la ferroportine, exportateur cellulaire. Une stimulation érythroïde peut réduire ce frein, notamment par l’érythroferrone. Lors d’une érythropoïèse inefficace, cette réponse peut favoriser l’absorption malgré une surcharge déjà constituée. La transferrine transporte, la ferritine stocke et les macrophages recyclent : ces fonctions ne sont pas interchangeables. Le bilan biologique explore indirectement ces compartiments ; une élévation de ferritine isolée ne mesure pas exactement le fer de chaque organe.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2073-4409/9/3/579" target="_blank" rel="noopener">Swenson et collaborateurs — From Synthesis to Utilization: The Ins and Outs of Mitochondrial Heme (Cells 2020 ; 9:579)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="pareto-d64-s03" data-pop="pareto-d64-s03" data-title="Loi de Pareto — Biochimie du fer, de l’hème et de la mitochondrie"><p class="ratio" data-cover="d64-s03"></p><ul><li>Le fer disponible doit être incorporé dans l’hème. Les compartiments et les enzymes expliquent la microcytose, la surcharge et les réponses thérapeutiques différentes.</li><li>La synthèse nécessite des enzymes, des substrats et des compartiments fonctionnels.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/9512" target="_blank" rel="noopener">Camaschella, Nai et Silvestri — Iron metabolism and iron disorders revisited in the hepcidin era (Haematologica 2020 ; 105:260–272)</a> ; <a data-reference-source="1" href="https://www.mdpi.com/2073-4409/9/3/579" target="_blank" rel="noopener">Swenson et collaborateurs — From Synthesis to Utilization: The Ins and Outs of Mitochondrial Heme (Cells 2020 ; 9:579)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a>.</p></template>
<template id="d64-s04-w1" data-pop="d64-s04-w1" data-title="Transmission : risque et limites"><p>ALAS2 fournit l’exemple d’une transmission liée à l’X, tandis que SLC25A38 et les causes classiques de dysérythropoïèse I ou II sont récessives. Le type III lié à KIF23 peut être dominant. Un risque familial chiffré n’est proposé qu’après confirmation du variant et du statut parental ; le seul nom de la maladie ne suffit pas. Une femme peut être symptomatique pour une maladie liée à l’X. Une histoire familiale négative n’exclut donc pas une cause héréditaire. Le conseil explique aussi l’expression variable et les limites pronostiques du test.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="d64-s04-w2" data-pop="d64-s04-w2" data-title="Dysérythropoïèse : normal puis perturbation"><p>Normalement, la maturation coordonne condensation de la chromatine, hémoglobinisation et division, puis expulsion du noyau. Dans la dysérythropoïèse de type I, la chromatine peut présenter un aspect spongieux et des ponts internucléaires. La comparaison électronique publiée montre un témoin et une cellule pathologique cultivés ; elle illustre l’anomalie de structure. Le travail moléculaire récent relie CDIN1 à Codanin1, mais précise que certains modèles de trafic des histones restent hypothétiques. Il faut distinguer la lésion observée, le gène causal et une explication mécanistique encore incomplète.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="pareto-d64-s04" data-pop="pareto-d64-s04" data-title="Loi de Pareto — Génétique et dysérythropoïèse"><p class="ratio" data-cover="d64-s04"></p><ul><li>La génétique précise la cause sans effacer l’incertitude pronostique. La morphologie, le variant et le phénotype doivent rester concordants.</li><li>Le classement de la variation, la ségrégation et le phénotype font partie de l’interprétation.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9170004/fullTextXML" target="_blank" rel="noopener">BSH/EHA — The Use of Next-generation Sequencing in the Diagnosis of Rare Inherited Anaemias (HemaSphere 2022)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC13370696/fullTextXML" target="_blank" rel="noopener">Stojaspal et collaborateurs — Anemia-associated mutations disrupt the CDIN1-Codanin1 complex (FEBS Journal ; publication du 29 janvier 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/6492" target="_blank" rel="noopener">Iolascon et collaborateurs — Congenital dyserythropoietic anemias: molecular insights and diagnostic approach (Haematologica 2012)</a>.</p></template>
<template id="d64-p01-w1" data-pop="d64-p01-w1" data-title="Pyridoxine, Benadon 300 mg : monographie suisse"><p>Benadon 300 mg contient 300 mg de chlorhydrate de pyridoxine par comprimé pelliculé sécable (autorisation Swissmedic 25635, titulaire Teofarma, information de mars 2026). Dans l’organisme, la pyridoxine devient le phosphate de pyridoxal, cofacteur de nombreuses enzymes, dont la synthase érythroïde de l’acide 5-aminolévulinique, première enzyme de l’hème ; c’est le mécanisme qui explique la réponse de certaines formes liées à ALAS2.</p><p>La fiche retient comme indications les carences en pyridoxine par apport insuffisant, malabsorption ou besoin accru, y compris l’anémie hypochrome ; prophylaxie et traitement des carences provoquées par un antagoniste (isoniazide, pénicillamine, cyclosérine, hydralazine, thiosemicarbazone, contraceptifs oraux) ; enfin, les anémies et convulsions dépendantes de la pyridoxine. Dès 15 ans, la posologie est de 150 mg par jour pour la carence iatrogène ; 150 à 300 mg par jour, voire plus, pour l’anémie dépendante, adaptés au cas. La prise orale se fait sans croquer, avec un demi-verre de liquide, et ne dure pas plus de cinq mois sans interruption.</p><p>Le produit est contre-indiqué en cas d’hypersensibilité, de grossesse, d’allaitement, d’insuffisance hépatique ou rénale et chez l’enfant de moins de 12 ans ; il n’est pas recommandé entre 12 et 15 ans. La pyridoxine accélère la dégradation de la lévodopa : les mises en garde citent des doses quotidiennes de 5 mg ou plus, et la rubrique Interactions interdit, chez le patient sous lévodopa, des doses plusieurs fois supérieures au besoin quotidien de 2 mg ; un comprimé de 300 mg les dépasse toujours. L’interaction ne se produit pas lorsque la lévodopa est associée à un inhibiteur périphérique de la décarboxylase. Les autres interactions sont un effet diminué de la phénytoïne, du phénobarbital et de l’altrétamine, et une photosensibilité accrue sous amiodarone. Ses effets indésirables sont une neuropathie sensitive avec paresthésies lors d’une prise prolongée dès 50 mg par jour, des nausées et une photosensibilité ; ces troubles régressent généralement à l’arrêt. La fiche signale aussi un faux positif du test urinaire de l’urobilinogène.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC9498732/fullTextXML" target="_blank" rel="noopener">Rodriguez-Sevilla, Calvo et Arenillas — Causes and Pathophysiology of Acquired Sideroblastic Anemia (Genes 2022 ; 13:1562)</a>.</p></template>
<template id="d64-p01-w2" data-pop="d64-p01-w2" data-title="Pegasys : preuve, hors indication et contre-indications"><p>Pegasys contient du peginterféron alfa-2a (autorisation 55585, information de décembre 2023). Son indication suisse se limite aux hépatites chroniques B et C de l’adulte ; son emploi dans la dysérythropoïèse congénitale de type I est donc hors indication et relève d’un centre expert. La revue britannique de 2019 décrit des réponses en moins de quatre semaines, non universelles, et rapporte 30 à 50 µg par semaine de forme pégylée ; son mécanisme bénéfique reste inconnu.</p><p>Les contre-indications de la fiche s’appliquent pleinement : hypersensibilité aux interférons alfa, hépatite auto-immune, insuffisance hépatique grave ou cirrhose décompensée, cardiopathie sévère ou instable dans les six derniers mois, maladie psychiatrique sévère ancienne ou actuelle, en particulier la dépression, enfant de moins de 3 ans, grossesse et allaitement. Le traitement expose à une dépression avec idées suicidaires, à des exacerbations auto-immunes, à des troubles thyroïdiens et glycémiques et à des cytopénies ; une contraception efficace est exigée. Une petite série ne vaut pas preuve d’efficacité générale ; c’est pourquoi le bénéfice attendu se pèse contre ces risques pour chaque patient.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Décembre 2023)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-p01" data-pop="pareto-d64-p01" data-title="Loi de Pareto — Traitements propres à chaque forme"><p class="ratio" data-cover="d64-p01"></p><ul><li>La molécule, la forme suisse et l’indication forment un ensemble indissociable. Les usages spécialisés hors indication sont annoncés explicitement et ne deviennent pas des prescriptions générales.</li><li>La fiche étudiée concerne les comprimés à mettre en suspension et leurs modalités spécifiques.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555850126" target="_blank" rel="noopener">Swissmedic — Pegasys, information professionnelle ; autorisation 55585 (Décembre 2023)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="d64-p02-w1" data-pop="d64-p02-w1" data-title="Exjade dispersible : monographie et surveillance"><p>Exjade dispersible (déférasirox, autorisation 57466, information de mars 2022) chélate le fer et favorise son élimination. Ses indications suisses sont l’hémosidérose post-transfusionnelle et, dès 10 ans, la surcharge chronique de la thalassémie non dépendante des transfusions. Dans le premier cas, le traitement débute chez un patient transfusé régulièrement (plus de 8 unités par an) après environ 20 unités, soit 100 mL/kg, lorsque la ferritine dépasse 1000 µg/L ou que le fer hépatique dépasse 2 mg/g de poids sec.</p><p>La surveillance comprend la créatinine deux fois avant traitement, puis chaque semaine le premier mois et après chaque modification, ensuite chaque mois ; protéinurie chaque mois ; transaminases, bilirubine et phosphatase alcaline avant traitement, toutes les deux semaines le premier mois puis chaque mois ; ferritine chaque mois ; examen auditif et ophtalmologique avant traitement puis chaque année ; poids, taille et développement sexuel chaque année chez l’enfant. Chez l’adulte, une hausse non progressive de la créatinine de plus de 33 % à deux visites consécutives, sans autre cause, autorise une réduction de 10 mg/kg ; une hausse progressive ou persistante impose l’interruption.</p><p>Le traitement est arrêté en cas d’ulcère ou d’hémorragie digestive, de réaction cutanée sévère ou d’anaphylaxie, et une interruption est envisagée devant une cytopénie inexpliquée ou une acidose métabolique. Des troubles inexpliqués de l’état mental font mesurer l’ammoniémie, car une encéphalopathie hyperammoniémique est décrite. Les patients âgés ont présenté plus d’effets indésirables dans les études.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a>.</p></template>
<template id="d64-p02-w2" data-pop="d64-p02-w2" data-title="Surcharge : indication et limites de la chélation"><p>Dans la surcharge post-transfusionnelle, la fiche d’Exjade associe exposition transfusionnelle et preuve de surcharge avant l’introduction. La ferritine est suivie chaque mois ; la dose s’ajuste par paliers de 5 à 10 mg/kg tous les trois à six mois. La plage de 500 à 1000 µg/L est une cible de traitement, non un intervalle normal ; une ferritine durablement inférieure à 500 µg/L impose l’interruption, car le risque de toxicité augmente lorsque la charge en fer est faible. Dans la thalassémie non transfusée, le traitement n’est instauré qu’avec un fer hépatique d’au moins 5 mg/g de poids sec ou une ferritine durablement supérieure à 800 µg/L.</p><p>Ces critères ne se transfèrent pas automatiquement aux dysérythropoïèses ou aux sidéroblastiques non transfusées, même si leur surcharge relève du même mécanisme d’hepcidine effondrée. Dans la forme liée à ALAS2, des saignées modérées sous pyridoxine constituent l’alternative décrite par Cazzola et Invernizzi ; dans le type I, la revue britannique décrit des saignées rendues possibles par l’interféron.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://haematologica.org/article/view/5981" target="_blank" rel="noopener">Cazzola et Invernizzi — Ring sideroblasts and sideroblastic anemias (Haematologica 2011)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a>.</p></template>
<template id="pareto-d64-p02" data-pop="pareto-d64-p02" data-title="Loi de Pareto — Sécurité, surcharge et surveillance"><p class="ratio" data-cover="d64-p02"></p><ul><li>Un traitement efficace peut être toxique. Les contre-indications, les interactions et le calendrier de surveillance sont définis avant la première dose et relus lors de chaque adaptation.</li><li>Il s’agit d’un seuil de sécurité du produit exact ; une indication de chélation ne supprime pas cette contre-indication.</li></ul><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680256350192" target="_blank" rel="noopener">Swissmedic — Benadon 300 mg, information professionnelle ; autorisation 25635 (Mars 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680574660010" target="_blank" rel="noopener">Swissmedic — Exjade comprimés dispersibles 125/250/500 mg ; autorisation 57466 (Mars 2022)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680555580054" target="_blank" rel="noopener">Swissmedic — Zyvoxid comprimés pelliculés, information professionnelle ; autorisation 55558 (Mars 2026)</a> ; <a data-reference-source="1" href="https://www.ebi.ac.uk/europepmc/webservices/rest/PMC6519365/fullTextXML" target="_blank" rel="noopener">Roy et Babbs — The pathogenesis, diagnosis and management of congenital dyserythropoietic anaemia type I (British Journal of Haematology 2019 ; 185:436–449)</a> ; <a data-reference-source="1" href="https://www.smartermedicine.ch/fr/liste-top-5/translate-to-franzoesisch-haematologie-2023" target="_blank" rel="noopener">Société suisse d’hématologie — smarter medicine, liste Top 5 (2023)</a>.</p></template>
<template id="d64-e03-w3" data-pop="d64-e03-w3" data-title="Saturation de la transferrine : calcul et références"><p>La saturation de la transferrine rapporte le fer plasmatique à la capacité maximale de transport. Une molécule de transferrine, de masse 79 570 g/mol, fixe au plus deux atomes de fer. Un gramme de transferrine représente donc 12,6 µmol, qui fixent 25,1 µmol de fer, soit environ 1,4 mg. La formule devient : saturation (%) = fer (µmol/L) ÷ [transferrine (g/L) × 25,1] × 100, soit 3,98 × fer ÷ transferrine.</p><p>Exemple fictif : fer 20 µmol/L et transferrine 2,5 g/L donnent 3,98 × 20 ÷ 2,5 = 32 %. Au laboratoire de Lucerne, l’intervalle adulte est de 16 à 45 % (de 7 à 44 % avant 5 ans) ; le fer plasmatique est de 5,83 à 34,5 µmol/L et la transferrine de 2,0 à 3,6 g/L. Une saturation inférieure à 16 % y est considérée comme diagnostique d’une carence. Le prélèvement se fait à jeun, car le fer varie au cours de la journée. La page lucernoise imprime le facteur 398 dans une formule dont la mise en forme est ambiguë ; le calcul ci-dessus le reconstitue à partir de ses propres données moléculaires.</p><p>Limite : l’inflammation abaisse la transferrine ; le dénominateur diminue et la saturation peut paraître normale ou élevée malgré une carence. Inversement, une saturation élevée avant toute transfusion oriente vers une surcharge par érythropoïèse inefficace.</p><p class="src">Sources : <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Transferrinsaettigung" target="_blank" rel="noopener">Luzerner Kantonsspital — Transferrinsättigung (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Eisen-1" target="_blank" rel="noopener">Luzerner Kantonsspital — Eisen (Page relue le 14 octobre 2026)</a> ; <a data-reference-source="1" href="https://analysenverzeichnis.luks.ch/analysis/Transferrin" target="_blank" rel="noopener">Luzerner Kantonsspital — Transferrin (Page relue le 14 octobre 2026)</a>.</p></template>
