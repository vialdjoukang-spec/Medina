<template data-pop="a04-pa-icd" data-title="Infection à C. difficile : définition">
<p>Diarrhée (Bristol 6 à 7, au moins 3 fois par 24 heures) ou iléus, avec preuve microbiologique de toxines et sans diagnostic alternatif ; ou colite pseudomembraneuse constatée à l’endoscopie, à la colectomie ou à l’autopsie.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions et approche diagnostique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-s-spore" data-title="Spore et toxines">
<p>La spore assure la survie dans l’environnement et la transmission manuportée ; elle résiste à l’alcool. Les toxines A et B détruisent l’épithélium colique ; seules les souches toxinogènes sont pathogènes.</p><div class="src">Source : <a href="https://doi.org/10.1038/nrdp.2016.20" target="_blank" rel="noopener" data-reference-source="1">Smits WK et al., Nat Rev Dis Primers 2016;2:16020</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-e-sev" data-title="Cotation de sévérité">
<div class="lab">Sévère (un critère)</div><p>Leucocytes &gt; 15 G/L ; créatinine &gt; 1,5 mg/dL (environ 133 µmol/L) ou hausse &gt; 50 % ; température centrale &gt; 38,5 °C.</p><div class="lab">Compliquée</div><p>Hypotension, choc, lactate élevé, iléus, mégacôlon toxique, perforation, évolution fulminante.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, approche diagnostique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-shu" data-title="Syndrome hémolytique et urémique">
<p>Complication des infections à <i>E. coli</i> producteur de shigatoxine ou à <i>Shigella dysenteriae</i> : anémie hémolytique, thrombopénie et insuffisance rénale aiguë. Les antidiarrhéiques sont proscrits dans ces infections.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, complications et traitement de soutien</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-p-fidaxo" data-title="Fidaxomicine">
<p>Antibiotique macrocyclique bactéricide, peu absorbé, à spectre étroit. 200 mg toutes les 12 heures pendant 10 jours, au cours ou en dehors des repas ; enfant dès 6 ans et 12,5 kg à la même dose. Contre-indication : hypersensibilité. Grossesse : à éviter par précaution. Remboursement en première intention : limitation à vérifier auprès de l’assureur.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dificlir®, décembre 2024</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-p-vanco" data-title="Vancomycine orale">
<p>Glycopeptide non absorbé par voie orale, inefficace par cette voie contre les infections hors du côlon. 125 mg toutes les 6 heures pendant 10 jours ; jusqu’à 500 mg toutes les 6 heures si forme sévère ou compliquée. Enfant : 40 mg/kg par jour en 3 à 4 prises, maximum 2 g. Le contenu d’un flacon intraveineux de 500 mg peut être dilué et bu ou donné par sonde.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47074" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Vancocin® gélules, mars 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-p-metro" data-title="Métronidazole">
<p>Nitro-imidazolé actif sur les anaérobies. Place limitée dans l’infection à <i>C. difficile</i> : complément intraveineux des formes compliquées selon la SSI. Contre-indiqué au premier trimestre de grossesse et pendant l’allaitement ; effet antabuse ; durée habituellement limitée à 10 jours.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=26313" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Flagyl®, septembre 2025</a> ; <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a> ; <a href="https://doi.org/10.1016/j.cmi.2021.09.038" target="_blank" rel="noopener" data-reference-source="1">van Prehn J et al., document de traitement de la Société européenne de microbiologie clinique et des maladies infectieuses, Clin Microbiol Infect 2021</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-a04-clinique" data-title="Loi de Pareto — Reconnaître l’infection à C. difficile">
<p class="ratio" data-cover="a04-pa-1,a04-pa-2,a04-pa-3,a04-pa-4,a04-pa-5,a04-pa-6,a04-pa-7"></p><ul><li>Diarrhée sous ou après antibiotique, âge, hôpital, inhibiteur de la pompe à protons.</li><li>Algorithme : antigène puis toxines ; PCR seule = portage possible.</li><li>Sévère : leucocytes &gt; 15 G/L, créatinine, fièvre &gt; 38,5 °C. Compliquée : choc, iléus, mégacôlon.</li></ul>
</template>
<template data-pop="pareto-a04-traitement" data-title="Loi de Pareto — Traiter C. difficile">
<p class="ratio" data-cover="a04-pa-8,a04-pa-9,a04-pa-10,a04-pa-11"></p><ul><li>Arrêter l’antibiotique inutile, réhydrater, pas d’antipéristaltique.</li><li>Fidaxomicine 200 mg 2 fois par jour 10 jours ; vancomycine 125 mg 4 fois par jour en alternative.</li><li>Récidives multiples : microbiote fécal.</li><li>Précautions de contact ; eau et savon.</li><li>Autres diarrhées bactériennes : tester si conséquence, azithromycine si dysenterie ou sepsis.</li></ul>
</template>
<template data-pop="pareto-a04-examens" data-title="Loi de Pareto — Examens">
<p class="ratio" data-cover="a04-e-1,a04-e-2,a04-e-3"></p><ul><li>Seulement selles diarrhéiques ; pas de contrôle de guérison.</li><li>Antigène puis toxines ; discordance interprétée avec la clinique.</li><li>Tomodensitométrie si distension ou défense.</li></ul>
</template>
<template data-pop="pareto-a04-pharma" data-title="Loi de Pareto — Pharmacologie">
<p class="ratio" data-cover="a04-p-1,a04-p-2,a04-p-3,a04-p-4"></p><ul><li>Fidaxomicine : glycoprotéine P, macrolides.</li><li>Vancomycine orale : absorption si colite sévère et insuffisance rénale.</li><li>Métronidazole : alcool, coumariniques, grossesse.</li></ul>
</template>
<template data-pop="a04-pa-cpm" data-title="Colite pseudomembraneuse">
<p>Forme anatomique sévère : plaques jaunâtres surélevées d’exsudat (fibrine, mucus, cellules inflammatoires) adhérant à une muqueuse colique inflammatoire. Sa constatation à l’endoscopie, à la colectomie ou à l’autopsie suffit au diagnostic selon la SSI.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, approche diagnostique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-recid" data-title="Récidive, nouvel épisode, forme réfractaire">
<div class="lab">Récidive</div><p>Symptômes compatibles et confirmation microbiologique dans les 8 semaines suivant la résolution complète.</p><div class="lab">Nouvel épisode</div><p>Au-delà de 8 semaines.</p><div class="lab">Réfractaire</div><p>Absence de réponse après 3 à 5 jours de traitement.</p><div class="lab">Réponse</div><p>Résolution de la diarrhée pendant le traitement et au moins 48 heures après, avec amélioration des paramètres de sévérité.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-swissnoso" data-title="Surveillance suisse (Swissnoso)">
<p>Enquête par questionnaire dans les hôpitaux suisses de soins aigus : 3,8 épisodes pour 10 000 journées d’hospitalisation en 2022 (IC 95 % 3,2 à 4,5), avec une grande hétérogénéité des tests, des critères diagnostiques et des pratiques d’hygiène. La surveillance de laboratoire lancée en 2017 compte trop peu de laboratoires pour être représentative.</p><div class="src">Source : <a href="https://doi.org/10.57187/s.3571" target="_blank" rel="noopener" data-reference-source="1">Durovic A et al., Swiss Med Wkly 2024;154:3571 (Swissnoso)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-portage" data-title="Colonisation ou infection ?">
<p>La colonisation est la présence de <i>C. difficile</i>, éventuellement toxinogène, sans maladie. Elle ne se traite pas ; de plus, le dépistage des porteurs asymptomatiques n’est pas recommandé. Seule l’association d’une diarrhée et de toxines, sans autre cause, définit l’infection.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions et prévention</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-rf" data-title="Facteurs de risque (SSI)">
<div class="lab">Infection primaire</div><p>Antibiotiques systémiques, surtout bêtalactamine et inhibiteur de bêtalactamase, clindamycine, fluoroquinolones, céphalosporines de 2e à 4e génération, carbapénèmes ; âge &gt; 65 ans ; inhibiteurs de la pompe à protons ; hospitalisation récente ou prolongée, établissement de soins.</p><div class="lab">Récidive</div><p>Âge &gt; 65 ans ; nouvelle antibiothérapie ; inhibiteur de la pompe à protons ; insuffisance rénale.</p><div class="lab">Évolution défavorable</div><p>Âge avancé ; comorbidités multiples ; soins intensifs.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, facteurs de risque</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-e-algo" data-title="Algorithme microbiologique en deux temps">
<div class="lab">Étape 1</div><p>Antigène glutamate déshydrogénase (dépistage, très sensible).</p><div class="lab">Étape 2</div><p>Toxines A et B par immuno-essai (spécificité pour l’infection).</p><div class="lab">Discordance</div><p>Antigène positif, toxines négatives : un test moléculaire peut être intégré ; positif seul, il évoque un portage, à interpréter avec la clinique.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions</a> ; <a href="https://doi.org/10.3201/eid2610.190804" target="_blank" rel="noopener" data-reference-source="1">Widmer AF et al., Emerg Infect Dis 2020;26:2370 (76 hôpitaux suisses)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-mesures" data-title="Mesures générales (SSI)">
<ul><li>Interrompre toute antibiothérapie non nécessaire.</li><li>Hydratation et correction des électrolytes.</li><li>Éviter les antipéristaltiques.</li><li>Réévaluer les inhibiteurs de la pompe à protons.</li><li>Pas de traitement empirique en règle générale ; jamais de fidaxomicine empirique.</li></ul><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-p-local" data-title="Vancomycine délivrée localement">
<p>Lorsque la voie orale est impossible ou dans la forme compliquée, la SSI recommande une vancomycine délivrée localement (par sonde ou par voie rectale), avec ou sans métronidazole ou tigécycline intraveineux. L’information suisse permet de diluer 500 mg de vancomycine intraveineuse dans 30 mL d’eau pour une administration orale ou par sonde ; la directive en ligne ne précise pas de dose pour la voie rectale, lacune nommée.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47074" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Vancocin® gélules, mars 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-tmf" data-title="Transplantation de microbiote fécal">
<p>Administration de selles de donneur sélectionné pour restaurer la diversité du microbiote. Indication SSI : à partir de deux récidives, plus tôt chez certains patients, et dans les formes compliquées. En Suisse, le CHUV (Lausanne) est un centre certifié par Swissmedic (capsules cryogénisées ou formes liquides).</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a> ; <a href="https://doi.org/10.1056/NEJMoa1205037" target="_blank" rel="noopener" data-reference-source="1">van Nood E et al., N Engl J Med 2013;368:407</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-louie" data-title="Essai de Louie 2011">
<p>Essai de phase 3, 629 adultes : fidaxomicine 200 mg 2 fois par jour contre vancomycine 125 mg 4 fois par jour pendant 10 jours. Guérison clinique non inférieure (88,2 % contre 85,8 %) ; récidive à 4 semaines 15,4 % contre 25,3 %. Ce bénéfice s’observait toutefois avec les souches autres que le type nord-américain dominant de l’époque (type 1 en électrophorèse en champ pulsé).</p><div class="src">Source : <a href="https://doi.org/10.1056/NEJMoa0910812" target="_blank" rel="noopener" data-reference-source="1">Louie TJ et al., N Engl J Med 2011;364:422</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-rembours" data-title="Remboursement de la fidaxomicine">
<p>Selon la SSI, le remboursement est actuellement réservé à l’absence de réponse au métronidazole et à la vancomycine, aux récidives multiples (plus de 2) ou à la poursuite d’un traitement hospitalier par fidaxomicine. Par conséquent, une prise de contact avec l’assureur peut être nécessaire ; la SSI juge ces limitations dépassées par les données actuelles.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-p-pulse" data-title="Schéma pulsé de fidaxomicine">
<p>200 mg 2 fois par jour du jour 1 au jour 5, puis 200 mg toutes les 48 heures du jour 7 au jour 25. Ce schéma est à envisager selon la SSI lors d’une première récidive ; il sort du schéma de l’information professionnelle (200 mg 2 fois par jour pendant 10 jours).</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dificlir®, décembre 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-pa-nood" data-title="Essai de van Nood 2013">
<p>Essai randomisé néerlandais, infections récidivantes : infusion duodénale de selles de donneur après vancomycine contre vancomycine seule ou avec lavage intestinal. Résolution après la première infusion : 13 sur 16 (81 %), contre 31 % et 23 %. L’essai a été arrêté précocement après une analyse intermédiaire.</p><div class="src">Source : <a href="https://doi.org/10.1056/NEJMoa1205037" target="_blank" rel="noopener" data-reference-source="1">van Nood E et al., N Engl J Med 2013;368:407</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-e-indic" data-title="Indications de l’examen des selles (SSI)">
<div class="lab">Recommandé</div><p>Diarrhée sanglante ; immunosuppression (chimiothérapie, transplantation, VIH avec CD4 &lt; 200/µL) ; antibiotique ou hospitalisation récents ; fièvre &gt; 38,3 °C pendant au moins 72 heures ; fortes douleurs abdominales ; sepsis.</p><div class="lab">À envisager</div><p>Diarrhée de 7 jours ou plus ; âge ≥ 65 ans avec comorbidités ; raisons épidémiologiques.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a04-p-azi" data-title="Azithromycine dans la diarrhée bactérienne">
<p>500 mg par voie orale une fois par jour pendant 3 jours, en cas de dysenterie, de fièvre &gt; 38,3 °C avec douleurs modérées à sévères, de sepsis, d’infection extra-intestinale ou d’immunosuppression. En dehors de ces situations, le traitement est symptomatique.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=51352" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zithromax®, mars 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
