<section class="ilot" id="a04-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme K., 74 ans, hospitalisée pour une pneumonie traitée par amoxicilline-acide clavulanique et sous inhibiteur de la pompe à protons, présente toutefois au sixième jour cinq selles liquides par jour, des crampes et 38,2 °C. Or, une diarrhée qui apparaît sous antibiotique, chez une patiente âgée hospitalisée, impose de rechercher une <button class="w" data-k="a04-pa-icd">infection à <i>Clostridioides difficile</i> (définition)</button>. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, quand et comment tester sans confondre colonisation et infection ? Ensuite, comment juger la sévérité ? Puis, quel traitement pour un premier épisode et pour une récidive ? Enfin, quand faut-il, au contraire, s’abstenir de traiter une diarrhée bactérienne ?</p>
<div class="key"><b>À retenir.</b> Diarrhée sous ou après antibiotique, ou à l’hôpital : penser <i>C. difficile</i>, tester les selles diarrhéiques, isoler le patient.</div></section>

<section class="ilot" id="a04-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord situer la maladie dans sa catégorie. Ainsi, la catégorie A04 de la classification regroupe les infections intestinales bactériennes autres que choléra, salmonelloses et shigelloses : entérocolite à <i>C. difficile</i>, infections à <i>Escherichia coli</i> entéropathogènes, à <i>Campylobacter</i> et à <i>Yersinia</i>. Cependant, ce cours est centré sur <i>C. difficile</i>, première cause de diarrhée infectieuse à l’hôpital, tandis qu’il traite les autres agents dans l’îlot 10.</p>
<p>Selon la SSI, l’infection à <i>C. difficile</i> associe donc une diarrhée — selles de types 6 à 7 de l’échelle de Bristol, au moins 3 fois en 24 heures —, ou un iléus, et une preuve microbiologique de toxines, sans diagnostic alternatif. De plus, une <button class="w" data-k="a04-pa-cpm">colite pseudomembraneuse</button> vue à l’endoscopie suffit aussi. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions et approche diagnostique</a>.</p>
<table class="t"><thead><tr><th><button class="w" data-k="a04-e-sev">Forme (SSI)</button></th><th>Critères</th></tr></thead><tbody>
<tr><td>Non sévère</td><td>Aucun critère de sévérité</td></tr>
<tr><td>Sévère</td><td>Un critère : leucocytes &gt; 15 G/L ; créatinine &gt; 1,5 mg/dL (environ 133 µmol/L) ou hausse de plus de 50 % ; température centrale &gt; 38,5 °C</td></tr>
<tr><td>Compliquée</td><td>Hypotension, choc septique, lactate élevé, iléus, mégacôlon toxique, perforation, évolution fulminante</td></tr>
</tbody></table>
<p>Il faut toutefois préciser que la SSI exprime le seuil leucocytaire en « 15 000 cellules/mL » , alors que l’unité voulue est le microlitre, soit 15 G/L. Par ailleurs, la <button class="w" data-k="a04-pa-recid">récidive</button> est un nouvel épisode confirmé dans les 8 semaines suivant la résolution , tandis qu’au-delà il s’agit d’un nouvel épisode. Enfin, une forme est dite réfractaire en l’absence de réponse après 3 à 5 jours de traitement. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions</a>.</p>
<div class="key"><b>À retenir.</b> Trois niveaux — non sévère, sévère, compliqué — qui commandent le traitement.</div></section>

<section class="ilot" id="a04-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Une fois la maladie définie, reste à en mesurer la fréquence. Or, l’infection à <i>C. difficile</i> n’est pas à déclaration obligatoire en Suisse ; c’est pourquoi une <button class="w" data-k="a04-pa-swissnoso">enquête de Swissnoso</button> dans les hôpitaux de soins aigus estimait pour 2022 une incidence de <b>3,8 épisodes pour 10 000 journées d’hospitalisation</b> (intervalle de confiance à 95 % : 3,2 à 4,5), juste au-dessus de la moyenne européenne publiée par le Centre européen de prévention et de contrôle des maladies. <a href="https://doi.org/10.57187/s.3571" target="_blank" rel="noopener" data-reference-source="1">Durovic A et al., Swiss Med Wkly 2024;154:3571 (Swissnoso)</a>.</p>
<p>Cependant, la méthode de test change le chiffre. En effet, dans une étude de prévalence de 76 hôpitaux suisses (2015), la détection par immuno-essai donnait 5,7 à 6,4 cas pour 10 000 journées, alors que la PCR seule donnait 7,1 à 11,4. <a href="https://doi.org/10.3201/eid2610.190804" target="_blank" rel="noopener" data-reference-source="1">Widmer AF et al., Emerg Infect Dis 2020;26:2370 (76 hôpitaux suisses)</a>. Par ailleurs, dans deux centres universitaires suisses, l’âge médian au premier épisode était 67 ans et 36 % des épisodes étaient sévères ; enfin, la comorbidité prédisait la mortalité. <a href="https://doi.org/10.1016/j.idnow.2022.05.002" target="_blank" rel="noopener" data-reference-source="1">Kampouri E et al., Infect Dis Now 2022;52:267 (Lausanne et Zurich)</a>.</p>
<div class="key"><b>À retenir.</b> Environ quatre épisodes pour 10 000 journées d’hôpital en Suisse ; patients âgés et polymorbides ; la PCR seule surestime.</div></section>

<section class="ilot" id="a04-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Cette prédominance chez le patient âgé hospitalisé sous antibiotique s’explique par le mécanisme de la maladie. En effet, le microbiote colique normal empêche la germination des spores de <i>C. difficile</i>. Or, l’antibiotique le perturbe ; dès lors, les spores ingérées germent, puis les formes végétatives se multiplient et produisent les toxines A et B, qui détruisent l’épithélium colique et déclenchent une inflammation intense. Ainsi, la forme extrême est la colite pseudomembraneuse, avec des plaques jaunâtres d’exsudat adhérant à la muqueuse. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, facteurs de risque</a> ; <a href="https://doi.org/10.1038/nrdp.2016.20" target="_blank" rel="noopener" data-reference-source="1">Smits WK et al., Nat Rev Dis Primers 2016;2:16020</a>.</p>

<p>À l’inverse, la <button class="w" data-k="a04-pa-portage">colonisation</button> sans toxine ou sans symptôme est fréquente ; elle ne se traite donc pas. Enfin, la <button class="w" data-k="a04-s-spore">spore et les toxines</button> sont détaillées dans l’onglet Sciences.</p>
<div class="key"><b>Corrélation clinique.</b> La spore explique la transmission manuportée et la résistance aux solutions hydroalcooliques ; le microbiote altéré explique la récidive, et la transplantation de microbiote fécal en est le traitement logique.</div></section>

<section class="ilot" id="a04-pa-4"><h2><span class="n">4</span>Agents et facteurs de risque</h2>
<p>Ce mécanisme désigne directement les facteurs de risque. Ainsi, les <button class="w" data-k="a04-pa-rf">facteurs de risque</button> d’infection primaire selon la SSI sont : antibiothérapie systémique, surtout bêtalactamines associées à un inhibiteur de bêtalactamase, clindamycine, fluoroquinolones, céphalosporines de 2<sup>e</sup> à 4<sup>e</sup> génération et carbapénèmes ; âge supérieur à 65 ans ; inhibiteurs de la pompe à protons ; hospitalisation récente ou prolongée, séjour en établissement de soins. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, facteurs de risque</a>.</p>
<p>De plus, les facteurs de récidive sont : âge supérieur à 65 ans, nouvelle antibiothérapie systémique, inhibiteur de la pompe à protons, insuffisance rénale. Enfin, les facteurs d’évolution défavorable sont : âge, comorbidités multiples, séjour aux soins intensifs. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, facteurs de risque</a>.</p>
<div class="trap"><span class="k">Piège.</span> L’infection survient aussi après la fin de l’antibiotique, parfois des semaines plus tard : l’anamnèse médicamenteuse doit remonter loin.</div></section>

<section class="ilot" id="a04-pa-5"><h2><span class="n">5</span>Anamnèse et examen clinique</h2>
<p>Ces facteurs orientent l’interrogatoire, puis l’examen recherche les signes de gravité.</p>
<div class="two"><div class="card"><b>Anamnèse</b><p>Nombre et consistance des selles ; sang ; antibiotiques des semaines précédentes ; inhibiteur de la pompe à protons ; hospitalisation ; épisodes antérieurs et leur traitement ; voyage, aliments à risque, cas groupés (autres agents) ; immunosuppression.</p></div>
<div class="card"><b>Examen</b><p>Signes vitaux et hydratation ; douleur et distension abdominales ; défense ; diminution des selles avec distension, qui fait craindre un iléus ou un mégacôlon plutôt qu’une amélioration.</p></div></div>
<div class="trap"><span class="k">Piège.</span> L’arrêt de la diarrhée avec un ventre qui gonfle est un signe de gravité, non de guérison.</div></section>

<section class="ilot" id="a04-pa-6"><h2><span class="n">6</span>Diagnostic et sévérité</h2>
<p>L’examen clinique conduit ensuite au test microbiologique. Or, on ne teste que des selles diarrhéiques d’un patient symptomatique. Ainsi, l’approche recommandée par la SSI est un <button class="w" data-k="a04-e-algo">algorithme en deux temps</button> : dépistage par l’antigène glutamate déshydrogénase, puis confirmation des toxines A et B par immuno-essai. En outre, les tests d’amplification des acides nucléiques peuvent s’intégrer à l’algorithme . Cependant, utilisés seuls, ils détectent une colonisation plutôt qu’une infection. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions</a>.</p>

<p>Une fois le diagnostic posé, la sévérité se cote immédiatement par les critères de l’îlot 1 . Ainsi, la fenêtre <button class="w" data-k="a04-e-sev">cotation de sévérité</button> détaille les mesures. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, approche diagnostique</a>.</p>
<div class="key"><b>À retenir.</b> Pas de test sur selles formées, pas de test de contrôle après guérison.</div>
<button class="pareto-btn ui" data-k="pareto-a04-clinique">▲ Loi de Pareto — Reconnaître l’infection à C. difficile</button></section>

<section class="ilot" id="a04-pa-7"><h2><span class="n">7</span>Urgences et complications</h2>
<p>La cotation de sévérité sert d’abord à repérer les urgences.</p>
<div class="alert"><b>Forme compliquée.</b> Hypotension, choc, lactate élevé, iléus, mégacôlon toxique (côlon de plus de 6 cm avec sepsis), perforation : prise en charge hospitalière, avis chirurgical et infectiologique. Dès lors, le traitement selon la SSI associe vancomycine délivrée localement, avec ou sans métronidazole ou tigécycline intraveineux, et chirurgie si nécessaire. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions et traitement</a>.</div>

<section class="ilot" id="a04-pa-8"><h2><span class="n">8</span>Traitement de l’infection à C. difficile</h2>
<p>En dehors de ces urgences, le traitement suit une séquence codifiée. D’abord, les <button class="w" data-k="a04-pa-mesures">mesures générales</button> selon la SSI consistent à arrêter tout antibiotique non nécessaire, réhydrater et corriger les électrolytes, éviter les antipéristaltiques, réévaluer l’inhibiteur de la pompe à protons. Ensuite, un traitement empirique n’est pas recommandé en règle générale ; il se discute en cas de forme compliquée ou de confirmation retardée, et sans fidaxomicine empirique. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>.</p>
<table class="t"><thead><tr><th>Situation (SSI 2026)</th><th>Première ligne</th><th>Alternative</th></tr></thead><tbody>
<tr><td>Premier épisode, sans facteur de récidive</td><td><button class="w" data-k="a04-p-fidaxo">Fidaxomicine 200 mg 2 fois par jour, 10 jours</button></td><td><button class="w" data-k="a04-p-vanco">Vancomycine orale 125 mg 4 fois par jour, 10 jours</button></td></tr>
<tr><td>Premier épisode, avec facteur de récidive</td><td>Fidaxomicine 200 mg 2 fois par jour, 10 jours</td><td>—</td></tr>
<tr><td>Forme sévère, voie orale possible</td><td>Fidaxomicine ou vancomycine orale</td><td>—</td></tr>
<tr><td>Voie orale impossible, ou forme compliquée</td><td><button class="w" data-k="a04-p-local">Vancomycine délivrée localement</button>, avec ou sans <button class="w" data-k="a04-p-metro">métronidazole</button> ou tigécycline intraveineux</td><td>Chirurgie ; <button class="w" data-k="a04-pa-tmf">transplantation de microbiote fécal</button></td></tr>
</tbody></table>
<p>Le tableau montre ainsi la place centrale de la fidaxomicine. En effet, elle est privilégiée parce qu’elle réduit la récidive : dans l’<button class="w" data-k="a04-pa-louie">essai de phase 3 de Louie</button>, guérison clinique équivalente (88,2 % contre 85,8 %) mais récidive à 4 semaines de 15,4 % contre 25,3 % sous vancomycine. <a href="https://doi.org/10.1056/NEJMoa0910812" target="_blank" rel="noopener" data-reference-source="1">Louie TJ et al., N Engl J Med 2011;364:422</a>. Par ailleurs, la réponse se juge chaque jour et s’évalue après au moins 3 jours. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, définitions</a>.</p>
<p>Toutefois, le <button class="w" data-k="a04-pa-rembours">remboursement de la fidaxomicine</button> en première intention peut nécessiter une demande à l’assureur : la limitation en vigueur, que la SSI juge dépassée, le réserve à l’échec du métronidazole et de la vancomycine, aux récidives multiples ou à la poursuite d’un traitement hospitalier. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>. Enfin, le métronidazole oral n’est plus un traitement de première intention dans les recommandations européennes. <a href="https://doi.org/10.1016/j.cmi.2021.09.038" target="_blank" rel="noopener" data-reference-source="1">van Prehn J et al., document de traitement de la Société européenne de microbiologie clinique et des maladies infectieuses, Clin Microbiol Infect 2021</a>.</p>
<div class="trap"><span class="k">Erreur fréquente.</span> Poursuivre l’antibiotique déclenchant « par prudence » : chaque jour supplémentaire augmente le risque d’échec et de récidive.</div>
<button class="pareto-btn ui" data-k="pareto-a04-traitement">▲ Loi de Pareto — Traiter C. difficile</button></section>

<section class="ilot" id="a04-pa-9"><h2><span class="n">9</span>Récidives</h2>
<p>Malgré un traitement bien conduit, la récidive reste fréquente ; sa prise en charge est donc graduée. Ainsi, en cas de première récidive, on donne la fidaxomicine 200 mg 2 fois par jour pendant 10 jours, avec un <button class="w" data-k="a04-p-pulse">schéma pulsé</button> à envisager (200 mg 2 fois par jour du jour 1 au jour 5, puis 200 mg toutes les 48 heures du jour 7 au jour 25). En revanche, à partir de deux récidives, on recourt à la transplantation de microbiote fécal, après décision multidisciplinaire, éventuellement plus tôt chez certains patients. À cet égard, le CHUV à Lausanne est un centre certifié par Swissmedic pour cette transplantation. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, traitement</a>.</p>
<p>Cette stratégie repose sur des preuves solides. En effet, dans l’<button class="w" data-k="a04-pa-nood">essai néerlandais de van Nood</button>, l’infusion duodénale de selles de donneur guérissait 13 patients sur 16 (81 %) dès la première infusion, contre 31 % sous vancomycine seule. <a href="https://doi.org/10.1056/NEJMoa1205037" target="_blank" rel="noopener" data-reference-source="1">van Nood E et al., N Engl J Med 2013;368:407</a>. En revanche, si deux biothérapies standardisées à base de microbiote existent, aucune n’est autorisée par l’Agence européenne des médicaments ni par Swissmedic. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, nouvelles molécules</a>.</p>
<div class="key"><b>À retenir.</b> Récidive : fidaxomicine ; récidives multiples : microbiote fécal.</div></section>

<section class="ilot" id="a04-pa-10"><h2><span class="n">10</span>Autres infections intestinales bactériennes</h2>
<p>À côté de <i>C. difficile</i>, les autres bactéries de la catégorie relèvent d’une logique différente. En effet, <i>Campylobacter</i>, <i>E. coli</i> entéropathogènes et <i>Yersinia</i> donnent une gastro-entérite en général spontanément résolutive. C’est pourquoi la SSI pose deux principes : tester seulement si le résultat change la conduite, et traiter seulement après avoir testé. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a>.</p>
<p>Ainsi, un <button class="w" data-k="a04-e-indic">examen des selles</button> est recommandé en cas de diarrhée sanglante, d’immunosuppression, d’antibiothérapie ou d’hospitalisation récente (<i>C. difficile</i>), de fièvre au-delà de 38,3 °C pendant 72 heures ou plus, de fortes douleurs abdominales ou de sepsis ; on l’envisage après 7 jours de diarrhée, après 65 ans avec comorbidités, ou lors de cas groupés. Par ailleurs, les PCR multiplex sont aujourd’hui préférées à la culture, bien qu’elles ne testent pas la résistance. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, diagnostic</a>.</p>
<p>Quant au traitement, un traitement empirique par <button class="w" data-k="a04-p-azi">azithromycine</button> 500 mg une fois par jour pendant 3 jours est recommandé en cas de dysenterie, de fièvre au-delà de 38,3 °C avec douleurs modérées à sévères, de sepsis ou d’immunosuppression. En revanche, les antidiarrhéiques sont proscrits en cas de sang dans les selles, de forte fièvre, ou d’infection à <i>E. coli</i> producteur de shigatoxine, qui expose au <button class="w" data-k="a04-pa-shu">syndrome hémolytique et urémique</button>. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, traitement</a>.</p>
<div class="trap"><span class="k">Piège.</span> Un antibiotique ou un antidiarrhéique devant une diarrhée sanglante sans diagnostic peut aggraver une infection à <i>E. coli</i> producteur de shigatoxine.</div></section>

<section class="ilot" id="a04-pa-11"><h2><span class="n">11</span>Hygiène, déclaration et prévention</h2>
<p>Qu’il s’agisse de <i>C. difficile</i> ou des autres agents, la transmission doit ensuite être interrompue. Ainsi, à l’hôpital, les recommandations européennes reprises par la SSI préconisent une surveillance des infections avec retour rapide des taux, et des précautions de contact en situation endémique comme épidémique. En revanche, le dépistage systématique des porteurs asymptomatiques, patients ou soignants, n’est pas recommandé. De plus, les données sont insuffisantes pour recommander des probiotiques en prévention primaire. <a href="https://ssi.guidelines.ch/guideline/3120/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infection à Clostridioides difficile », validée le 17 avril 2026, prévention et hygiène</a>.</p>
<p>Par ailleurs, le lavage des mains à l’eau et au savon élimine mécaniquement les spores, contre lesquelles les solutions hydroalcooliques sont peu actives. <a href="https://doi.org/10.1038/nrdp.2016.20" target="_blank" rel="noopener" data-reference-source="1">Smits WK et al., Nat Rev Dis Primers 2016;2:16020</a>. Enfin, pour les autres gastro-entérites, certains agents sont soumis à déclaration obligatoire selon la liste de l’OFSP . En outre, dans la restauration, un arrêt de travail jusqu’à au moins 48 heures après la fin des symptômes doit être établi, les règles de reprise relevant des cantons. <a href="https://ssi.guidelines.ch/guideline/3465/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Gastro-entérite infectieuse », validée le 19 juin 2026, prévention</a>.</p>
<div class="key"><b>À retenir.</b> Chambre individuelle ou précautions de contact, gants et blouse, eau et savon : la spore résiste à l’alcool.</div></section>

<section class="ilot" id="a04-pa-12"><h2><span class="n">12</span>Situations particulières</h2>
<p>Ces règles générales s’adaptent toutefois à certains terrains.</p>
<p><b>Grossesse et allaitement.</b> D’abord, l’information suisse de la fidaxomicine demande, par précaution, d’éviter son emploi pendant la grossesse. De même, celle de la vancomycine orale la réserve aux cas de nécessité absolue pendant la grossesse et l’allaitement. En revanche, le métronidazole est contre-indiqué au premier trimestre et pendant l’allaitement. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dificlir®, décembre 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47074" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Vancocin® gélules, mars 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=26313" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Flagyl®, septembre 2025</a>.</p>
<p><b>Enfant.</b> Ensuite, la fidaxomicine est autorisée dès 6 ans et 12,5 kg à la dose adulte , tandis que la vancomycine orale se dose à 40 mg/kg par jour en 3 à 4 prises, au maximum 2 g par jour. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dificlir®, décembre 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47074" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Vancocin® gélules, mars 2026</a>.</p>
<p><b>Insuffisance rénale.</b> Par ailleurs, la fidaxomicine ne demande pas d’adaptation ; quant à la vancomycine orale, elle est très peu absorbée ; cependant, l’absorption augmente en cas d’inflammation intestinale, surtout avec une insuffisance rénale. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=62957" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dificlir®, décembre 2024</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47074" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Vancocin® gélules, mars 2026</a>.</p>
<p><b>Cas récapitulatif.</b> Pour conclure, chez Mme K., l’antigène et les toxines sont positifs ; de plus, les leucocytes atteignent 17 G/L, ce qui définit une forme sévère. Dès lors, l’amoxicilline-acide clavulanique est arrêtée si la pneumonie le permet, l’inhibiteur de la pompe à protons réévalué et les précautions de contact instaurées. Enfin, âgée de plus de 65 ans, elle a un facteur de récidive ; c’est pourquoi elle reçoit de la fidaxomicine 200 mg 2 fois par jour pendant 10 jours.</p></section>

<section class="ilot" id="a04-pa-13"><h2><span class="n">13</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les critères et valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Diarrhée</td><td>Bristol 6 à 7, au moins 3 fois en 24 heures</td></tr>
<tr><td>Sévérité</td><td>Leucocytes &gt; 15 G/L ; créatinine &gt; 1,5 mg/dL ou hausse &gt; 50 % ; température &gt; 38,5 °C</td></tr>
<tr><td>Mégacôlon toxique</td><td>Côlon &gt; 6 cm et sepsis</td></tr>
<tr><td>Récidive</td><td>Dans les 8 semaines suivant la résolution</td></tr>
<tr><td>Réfractaire</td><td>Pas de réponse après 3 à 5 jours</td></tr>
<tr><td>Incidence hospitalière suisse 2022</td><td>3,8 pour 10 000 journées</td></tr>
</tbody></table>
