<template data-pop="e34-carcinoide" data-title="Syndrome carcinoïde : définition, médiateurs et diagnostic">
<div class="lab">Définition</div><p>Le syndrome carcinoïde associe une diarrhée chronique et/ou un flush à une élévation de la sérotonine systémique ou de son métabolite, le 5-HIAA. Les autres causes doivent être recherchées (ENETS 2022). Une diarrhée est dite chronique si elle comprend au moins trois selles molles par jour pendant plus de quatre semaines.</p>
<div class="lab">Mécanisme</div><p>Un syndrome n’apparaît que si les médiateurs échappent au foie : métastases hépatiques (87 à 100 % des cas) ou primitif hors drainage portal. La sérotonine est le principal médiateur ; l’histamine, les tachykinines, la kallicréine et les prostaglandines y contribuent.</p>
<div class="lab">Fréquence</div><p>Il touche 19 à 35 % des patients porteurs de tumeur neuroendocrine, environ 30 % de ceux qui ont une tumeur de l’intestin grêle. La survie médiane est de 4,7 ans avec syndrome contre 7,1 ans sans.</p>
<div class="lab">Limite</div><p>Le diagnostic clinique ne suffit pas : il exige le marqueur biologique et l’exclusion d’autres causes de diarrhée ou de flush.</p>
</template>
<template data-pop="e34-petite-taille" data-title="Petite taille : variante normale ou maladie">
<div class="lab">Définition</div><p>Taille inférieure au 3e percentile, ce qui concerne 3 % des enfants par définition statistique. La croissance est pathologique si la vitesse est inférieure au 25e percentile avec une progression (AWMF 2023).</p>
<div class="lab">Variante normale</div><p>La petite taille non progressive, familiale, est bien plus fréquente que la maladie. Elle se reconnaît par la taille cible : moyenne des tailles parentales ± 6,5 cm selon le sexe.</p>
<div class="lab">Piège</div><p>Les sources suisses placent les prédicteurs d’un trouble de croissance à une taille inférieure à −1,6 écart-type ou au 5e percentile, un écart à la cible supérieur à −1,6 écart-type ou une courbe qui s’infléchit (Noordam 2023).</p>
</template>
<template data-pop="e34-hernie" data-title="Hernie inguinale chez une fille et insensibilité aux androgènes">
<div class="lab">Principe</div><p>Chez une fille, une hernie inguinale peut contenir un testicule. C’est un mode de découverte de l’insensibilité complète aux androgènes dans l’enfance (Batista 2018).</p>
<div class="lab">Conduite</div><p>Le caryotype est demandé. À la puberté, le même diagnostic se révèle par une aménorrhée primaire avec développement mammaire et pilosité rare.</p>
<div class="lab">Limite</div><p>Les sources lues ne donnent pas de fréquence des hernies dans cette population.</p>
</template>
<template data-pop="e34-ais" data-title="Insensibilité aux androgènes : formes et récepteur">
<div class="lab">Définition</div><p>Variante du développement sexuel 46,XY par défaut d’action des androgènes. Trois formes : complète, partielle et légère (organes génitaux masculins, infertilité et/ou gynécomastie) (Batista 2018 ; AWMF 2025).</p>
<div class="lab">Forme complète</div><p>Phénotype féminin, testicules abdominaux ou inguinaux, absence d’utérus, vagin borgne de 2,5 à 8 cm, pas de spermatogenèse. Les seins se développent à la puberté, qui est spontanée ; la pilosité pubienne est rare ou absente.</p>
<div class="lab">Forme partielle</div><p>De l’hypertrophie clitoridienne et des organes génitaux ambigus au phénotype masculin avec hypospadias ou micropénis ; gynécomastie pubertaire évocatrice.</p>
<div class="lab">Bilan</div><p>LH et testostérone élevées, FSH normale ; caryotype 46,XY ; variant du récepteur des androgènes.</p>
</template>
<template data-pop="e34-cim" data-title="CIM-10-GM 2024 : version de la classification">
<div class="lab">Principe</div><p>Les libellés de ce cours sont ceux de la CIM-10-GM 2024, version publiée en français par l’Office fédéral de la statistique, avec les notes d’inclusion et d’exclusion de l’Institut fédéral allemand (BfArM).</p>
<div class="lab">Limite</div><p>La cartographie vers la CIM-11 n’est pas établie dans ce cours. Un code ne définit pas une maladie : il regroupe des entités à traiter séparément.</p>
</template>
<template data-pop="e34-flush" data-title="Flush du syndrome carcinoïde">
<div class="lab">Caractérisation</div><p>Le flush est présent chez plus de 90 % des patients. Il est habituellement « sec », sans sueurs ; il en existe quatre types selon l’origine tumorale (ENETS 2022). Les sources lues ne détaillent pas ces quatre types (lacune).</p>
<div class="lab">Différentiel</div><p>Le flush de la ménopause est « humide », avec sueurs ; il faut aussi évoquer la mastocytose, le carcinome médullaire de la thyroïde et l’anxiété.</p>
<div class="lab">Piège</div><p>Un flush sans élévation de la sérotonine ou du 5-HIAA ne remplit pas la définition du syndrome carcinoïde.</p>
</template>
<template data-pop="e34-5hiaa" data-title="5-HIAA urinaire : dosage, normes et faux positifs">
<div class="lab">Principe</div><p>Le 5-HIAA est le produit de dégradation de la sérotonine éliminé dans l’urine. Son dosage sur 24 heures est le test de référence du syndrome carcinoïde (ENETS 2022).</p>
<div class="lab">Valeurs</div><p>Normes : 10,4 à 46,8 µmol/24 h (2 à 9 mg/24 h). Plus de 50 µmol/24 h est compatible avec le syndrome. Plus de 300 µmol/24 h multiplie par 2 à 3 le risque d’apparition ou de progression d’une cardiopathie.</p>
<div class="lab">Faux positifs</div><p>Aliments riches en sérotonine (bananes, ananas, tomates, prunes, aubergines, avocats, kiwis, noix), inhibiteurs de la recapture de la sérotonine, paracétamol.</p>
<div class="lab">Technique</div><p>Deux recueils sont préférés ; le rapport 5-HIAA sur créatinine sur échantillon sert au suivi. Le 5-HIAA plasmatique est une alternative de disponibilité limitée.</p>
</template>
<template data-pop="e34-tne" data-title="Tumeur neuroendocrine : sites, fonction et pronostic">
<div class="lab">Définition</div><p>Tumeur développée à partir de cellules neuroendocrines. Les sites sont l’intestin et le pancréas (60 à 70 %), le poumon (20 à 30 %) et d’autres sites (environ 10 %) (brochure SwissNET, 2019).</p>
<div class="lab">Fonction</div><p>Environ 70 % sont non fonctionnelles et environ 30 % fonctionnelles. Un syndrome fonctionnel associe un syndrome clinique et une preuve biochimique d’élévation hormonale inappropriée (ENETS 2023).</p>
<div class="lab">Suisse</div><p>Environ 4 à 5 nouveaux cas pour 100 000 habitants par an, soit 300 à 400 diagnostics par an. La brochure source est financée par l’industrie (SwissNET, 2019).</p>
</template>
<template data-pop="e34-portal" data-title="Veine porte, foie et contournement du filtre hépatique">
<div class="lab">Principe</div><p>La veine porte conduit le sang de l’intestin au foie, qui inactive les hormones libérées par la tumeur intestinale (ENETS 2022).</p>
<div class="lab">Contournement</div><p>Les métastases hépatiques ou un primitif hors drainage portal (ovaire, testicule, parfois poumon, grosse masse rétropéritonéale) déversent les médiateurs dans la circulation générale.</p>
<div class="lab">Conséquence</div><p>Un syndrome carcinoïde sans métastase hépatique (5 à 13 % des cas) impose de chercher un primitif extraportal.</p>
</template>
<template data-pop="e34-voie-serotonine" data-title="Voie tryptophane, sérotonine, 5-HIAA">
<div class="lab">Voie</div><p>Le tryptophane est transformé en sérotonine, enzyme limitante : la tryptophane hydroxylase. La sérotonine est dégradée en 5-HIAA, éliminé dans l’urine (ENETS 2022 ; Xermelo).</p>
<div class="lab">Usage</div><p>Le 5-HIAA sert au diagnostic et au suivi. Le télotristat inhibe la TPH périphérique et abaisse la production de sérotonine.</p>
<div class="lab">Limite</div><p>Le lien entre cette voie et la déplétion en niacine n’est pas détaillé dans les sources lues.</p>
</template>
<template data-pop="e34-cardiopathie" data-title="Cardiopathie carcinoïde : dépistage et traitement">
<div class="lab">Fréquence et pronostic</div><p>Elle touche 20 à 50 % des patients avec syndrome carcinoïde. La survie à 3 ans est de 31 % contre 69 % sans cardiopathie (ENETS 2022).</p>
<div class="lab">Mécanisme</div><p>Dépôts fibreux sur les valves droites et l’endocarde, insuffisance ou sténose tricuspide et pulmonaire, puis insuffisance cardiaque droite. Atteinte gauche si foramen ovale perméable, tumeur pulmonaire fonctionnelle ou taux hormonaux très élevés.</p>
<div class="lab">Dépistage</div><p>NT-proBNP puis échocardiographie transthoracique avec score synoptique ENETS et épreuve aux microbulles. Suivi tous les 6 à 12 mois à vie.</p>
<div class="lab">Traitement</div><p>Équipe multidisciplinaire, réduction agressive de la sécrétion hormonale, prudence avec diurétiques et antialdostérone, remplacement valvulaire discuté.</p>
</template>
<template data-pop="e34-ectopique" data-title="Sécrétion hormonale ectopique : mécanisme et conduite">
<div class="lab">Définition</div><p>Sécrétion, par des cellules tumorales endocrines ou neuroendocrines, de substances bioactives qui ne reflète pas la physiologie du tissu (Reisch et Reincke 2018).</p>
<div class="lab">Exemples</div><p>ADH (antidiurèse inappropriée et hyponatrémie), ACTH (syndrome de Cushing), CRH (très rare), GHRH (acromégalie). Pour le poumon : sérotonine, ACTH, GHRH.</p>
<div class="lab">Conduite</div><p>Le traitement de la tumeur est prioritaire ; le traitement symptomatique relève du palliatif. La sécrétion ne suit pas de façon fiable le stade ou le pronostic.</p>
</template>
<template data-pop="e34-laron" data-title="Syndrome de Laron et déficit primaire sévère en IGF-1">
<div class="lab">Définition internationale</div><p>Le déficit primaire sévère en IGF-1 est défini par une taille ≤ −3 écarts-types, un IGF-1 ≤ −3 écarts-types et une hormone de croissance normale ou élevée (Backeljauw 2023).</p>
<div class="lab">Définition allemande</div><p>Taille inférieure à −3 écarts-types, hormone de croissance normale ou augmentée, IGF-1 inférieur au 3e percentile, après exclusion d’autres causes d’IGF-1 bas (AWMF 2023).</p>
<div class="lab">Mécanisme</div><p>Le syndrome de Laron est un défaut du récepteur de l’hormone de croissance. Taille de −6 à −12 écarts-types dans l’enfance, taille adulte de 120 à 130 cm (Saavedra et Bang 2026).</p>
</template>
<template data-pop="e34-ar-dht" data-title="DHT et récepteur des androgènes">
<div class="lab">Principe</div><p>La testostérone est convertie en dihydrotestostérone par la 5α-réductase de type 2. La DHT se lie au récepteur des androgènes, facteur de transcription activé par son ligand, et masculinise les organes génitaux externes entre la 8e et la 14e semaine (Batista 2018).</p>
<div class="lab">Défaut</div><p>Un variant du récepteur abolit ou réduit la réponse à la testostérone et à la DHT : le phénotype va du féminin complet à l’infertilité isolée.</p>
</template>
<template data-pop="e34-progerine" data-title="Progérine : toxicité et cible thérapeutique">
<div class="lab">Mécanisme</div><p>La mutation LMNA c.1824C&gt;T produit une lamine A tronquée et farnésylée en permanence, la progérine (Ali 2026).</p>
<div class="lab">Clinique</div><p>Retard de croissance, lipodystrophie, atteintes musculosquelettiques, maladie vasculaire rapidement progressive ; décès surtout cardiovasculaire.</p>
<div class="lab">Cible</div><p>Le lonafarnib inhibe la farnésyltransférase, ce qui améliore l’atteinte vasculaire et la survie.</p>
</template>
<template data-pop="e34-diarrhee" data-title="Diarrhée du syndrome carcinoïde">
<div class="lab">Caractérisation</div><p>Souvent symptôme d’appel, présente chez 60 à 80 % des patients ayant un 5-HIAA urinaire élevé. Chronique : au moins trois selles molles par jour pendant plus de quatre semaines (ENETS 2022).</p>
<div class="lab">Sous analogue de la somatostatine</div><p>Une aggravation fait chercher stéatorrhée induite, pullulation bactérienne, ischémie mésentérique, malabsorption des sels biliaires après hémicolectomie droite, grêle court inférieur à 200 cm.</p>
</template>
<template data-pop="e34-bronchospasme" data-title="Bronchospasme du syndrome carcinoïde">
<div class="lab">Caractérisation</div><p>Environ 15 % des patients présentent un bronchospasme (ENETS 2022). Il fait partie des manifestations de la crise carcinoïde.</p>
<div class="lab">Limite</div><p>Les sources lues ne détaillent pas le traitement spécifique du bronchospasme hors crise (lacune).</p>
</template>
<template data-pop="e34-men1" data-title="Néoplasie endocrinienne multiple de type 1">
<div class="lab">Définition</div><p>Association de tumeurs neuroendocrines gastro-entéro-pancréatiques, d’hyperparathyroïdie primaire et d’adénome hypophysaire. Transmission autosomique dominante (brochure SwissNET, 2019).</p>
<div class="lab">Conduite</div><p>L’analyse génétique est proposée dans des cas choisis.</p>
</template>
<template data-pop="e34-ntprobnp" data-title="NT-proBNP et dépistage de l’atteinte cardiaque">
<div class="lab">Valeurs</div><p>Seuil de 235 à 260 pg/ml : sensibilité de 87 à 92 %, spécificité de 80 à 91 %. Moins de 260 pg/ml : valeur prédictive négative de 97 %. Plus de 260 pg/ml : échocardiographie (ENETS 2022).</p>
<div class="lab">Limite</div><p>L’examen clinique du cœur droit est peu sensible : 11 à 27 % des atteintes tricuspides modérées à sévères sont pauci- ou asymptomatiques.</p>
</template>
<template data-pop="e34-mesure" data-title="Mesure de la taille et courbes de référence">
<div class="lab">Technique</div><p>Avant 2 ans, mesure couchée par deux opérateurs ; après 2 ans, debout au stadiomètre mural. Report sur des courbes actuelles, spécifiques de la population et du sexe (AWMF 2023).</p>
<div class="lab">Suisse</div><p>Les courbes locales sont préférées aux courbes de l’OMS après 2 ans ; les courbes d’Eiholzer ont été publiées en 2019 (Noordam 2023).</p>
</template>
<template data-pop="e34-imagerie" data-title="Imagerie du syndrome carcinoïde">
<div class="lab">Scanner et IRM</div><p>Scanner injecté avec au minimum des phases artérielles précoces. IRM hépatique avec diffusion et produit hépatospécifique, supérieure pour les métastases.</p>
<div class="lab">TEP</div><p>La TEP/TDM aux récepteurs de la somatostatine est préférée pour le bilan corps entier. La TEP au 18F-FDG sert aux lésions négatives aux récepteurs avant radiothérapie interne vectorisée.</p>
<div class="lab">Rythme</div><p>TEP aux récepteurs tous les 6 à 12 mois ; scanner ou IRM tous les 3 à 6 mois ; échocardiographie tous les 6 à 12 mois (ENETS 2022).</p>
</template>
<template data-pop="e34-chromogranine" data-title="Chromogranine A : limite diagnostique">
<div class="lab">Principe</div><p>Marqueur général des tumeurs neuroendocrines. Dans le syndrome carcinoïde, elle ne distingue pas les patients avec et sans syndrome (ENETS 2022).</p>
</template>
<template data-pop="e34-vipome" data-title="VIPome : diarrhée aqueuse massive">
<div class="lab">Clinique</div><p>Tumeur très rare, souvent volumineuse et maligne, surtout pancréatique ; parfois paravertébrale chez l’enfant. Diarrhée aqueuse jusqu’à 8 l/j, troubles électrolytiques sévères, déshydratation, achlorhydrie, faiblesse musculaire, parfois flush (brochure SwissNET, 2019).</p>
<div class="lab">Traitement</div><p>L’octréotide est indiqué, avec une efficacité suffisamment documentée (Sandostatine).</p>
</template>
<template data-pop="e34-glucagonome" data-title="Glucagonome : éruption migratrice">
<div class="lab">Clinique</div><p>Hyperglycémie habituellement modérée, perte de poids marquée, anémie, alternance diarrhée et constipation, éruption migratrice chronique sévère des membres avec stomatite et glossite (brochure SwissNET, 2019).</p>
</template>
<template data-pop="e34-gastrinome" data-title="Gastrinome : ulcères et diarrhée">
<div class="lab">Clinique</div><p>Tumeur du pancréas ou du duodénum, souvent métastatique au diagnostic ; ulcères, douleurs, diarrhée. Probablement moins diagnostiqué depuis les inhibiteurs de la pompe à protons (brochure SwissNET, 2019).</p>
</template>
<template data-pop="e34-acth" data-title="ACTH ectopique : urgence endocrinienne">
<div class="lab">Gravité</div><p>Rare mais souvent sévère ; l’hypercortisolisme intense peut être dissocié de la tumeur. Il s’agit d’une urgence endocrinienne (Young 2020, résumé).</p>
<div class="lab">Conduite</div><p>Examens réduits au minimum si l’hypercortisolisme est intense. Traitement simultané des comorbidités, du cortisol et de la cause. Idéal : exérèse complète, éventuellement après anticortisoliques ; sinon combinaison pharmacologique, surrénalectomie bilatérale, traitements tumoraux, en équipe multidisciplinaire.</p>
<div class="lab">Limite</div><p>Cette source a été lue en résumé seulement ; aucun seuil biologique n’est repris.</p>
</template>
<template data-pop="e34-crise" data-title="Crise carcinoïde : déclencheurs, prévention, traitement">
<div class="lab">Définition</div><p>Décharge brutale de substances vasoactives : flush brusque, instabilité hémodynamique, diarrhée profuse, bronchospasme.</p>
<div class="lab">Déclencheurs</div><p>Biopsie, chirurgie, sympathomimétiques, anesthésie, embolisation hépatique, radiothérapie interne vectorisée.</p>
<div class="lab">Prévention</div><p>Octréotide de courte durée, 100–500 µg sous-cutané toutes les 6 à 8 heures, ou 50 µg/h intraveineux puis 100–200 µg/h, 12 heures avant la chirurgie jusqu’à stabilité. Radiothérapie interne : arrêt 8 à 24 heures avant, reprise 8 à 24 heures après.</p>
<div class="lab">Traitement</div><p>Remplissage, corticoïdes, vasopresseurs (phényléphrine et vasopressine préférées ; sympathomimétiques avec prudence, sous couverture d’octréotide) (ENETS 2022).</p>
</template>
<template data-pop="e34-agedosseux" data-title="Âge osseux : radiographie de la main gauche">
<div class="lab">Principe</div><p>La radiographie de la main gauche estime la maturation du squelette. Un âge osseux non retardé rend un trouble primaire plus probable (AWMF 2023 ; Noordam 2023).</p>
<div class="lab">Usage en haute taille</div><p>L’âge osseux (Greulich et Pyle) et le pronostic de taille (Bayley et Pinneau) guident la décision ; la limite d’âge osseux est de 14,5 ans (garçons) et 13,0 ans (filles) pour un traitement (AWMF 2022).</p>
</template>
<template data-pop="e34-genetique" data-title="Génétique de la petite taille">
<div class="lab">Rendement</div><p>Une cause génétique est identifiée dans environ 15 % des petites tailles dites idiopathiques. Les panels ciblés précèdent l’exome (trio). Le rendement est supérieur à celui de la sérologie (moins de 5 %) (Noordam 2023).</p>
<div class="lab">Caryotype</div><p>Le caryotype est obligatoire chez la fille pour exclure un syndrome de Turner (AWMF 2023).</p>
</template>
<template data-pop="e34-cible" data-title="Taille cible : calcul">
<div class="lab">Calcul</div><p>Moyenne des tailles parentales, avec une marge de ± 6,5 cm selon le sexe (AWMF 2023). Pour la haute taille familiale, la taille est dans la cible ± 8,5 cm (AWMF 2022).</p>
<div class="lab">Usage</div><p>Une taille éloignée de la cible oriente vers une maladie ; une taille dans la cible oriente vers une variante familiale.</p>
</template>
<template data-pop="e34-adressage" data-title="Critères d’adressage pour petite taille">
<div class="lab">0 à 3 ans</div><p>Taille moins taille cible inférieure à −1,6 écart-type sans rattrapage ; taille inférieure à −2,5.</p>
<div class="lab">3 à 10 ans</div><p>Mêmes seuils, ou perte de 1,0 écart-type sur toute période.</p>
<div class="lab">Toujours</div><p>Enfant petit pour l’âge gestationnel, aspect syndromique ou disproportion (AWMF 2023).</p>
</template>
<template data-pop="e34-niacine" data-title="Déplétion en niacine et pellagre">
<div class="lab">Mesure</div><p>La déplétion en niacine se mesure par le N1-méthylnicotinamide urinaire ou par l’index NAD/NADP. La pellagre clinique est rare et tardive (ENETS 2022 ; Baldini 2026).</p>
<div class="lab">Traitement</div><p>Niacine ou nicotinamide, 200–250 mg/j en cas de carence (ENETS 2022).</p>
<div class="lab">Limite</div><p>Le mécanisme de la déplétion n’est pas détaillé dans les sources lues (lacune).</p>
</template>
