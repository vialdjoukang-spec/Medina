<section class="ilot" id="b02-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme L., 72 ans, consulte pour une douleur en brûlure de l’hémithorax gauche apparue il y a quatre jours. Or, depuis la veille, des vésicules groupées sur fond rouge sont apparues en bande, sans franchir la ligne médiane. Ainsi, cette éruption unilatérale, limitée à un <button class="w" data-k="b02-pa-dermatome">dermatome</button> et précédée de douleur, est celle d’un zona. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, comment poser un diagnostic qui reste avant tout clinique ? Ensuite, quelles formes imposent un avis spécialisé immédiat ? Puis, à qui prescrire un antiviral, lequel et dans quel délai ? Enfin, comment prévenir la maladie et sa complication la plus fréquente, la névralgie post-zostérienne ?</p>
<div class="key"><b>À retenir.</b> Douleur dermatomique puis vésicules groupées unilatérales : zona jusqu’à preuve du contraire ; le délai de 72 heures guide l’antiviral.</div></section>

<section class="ilot" id="b02-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord définir la maladie. Le zona est la réactivation du <button class="w" data-k="b02-s-vzv">virus varicelle-zona</button>, resté latent dans un ganglion sensitif après une varicelle. Par conséquent, il ne survient que chez une personne ayant déjà rencontré le virus, par la maladie ou, plus rarement, par la vaccination. <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>.</p>
<p>Par ailleurs, la classification utile au clinicien distingue le zona non compliqué des <button class="w" data-k="b02-pa-compl">formes compliquées</button>. En effet, la ligne directrice européenne appelle zona « non compliqué » le zona thoracique ou lombaire, unilatéral, de la personne de moins de 50 ans sans signe de complication ; à l’inverse, la localisation à la tête et au cou, l’atteinte de plusieurs segments, l’atteinte muqueuse, la dissémination et l’immunodépression définissent un risque de complication. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 18 à 24</a>.</p>
<div class="key"><b>À retenir.</b> Zona = réactivation ; « non compliqué » = tronc, unilatéral, moins de 50 ans, immunocompétent.</div></section>

<section class="ilot" id="b02-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Une fois la maladie définie, reste à en mesurer le poids en Suisse. Ainsi, le système de surveillance Sentinella estimait, entre 1998 et 2001, environ 17 000 consultations annuelles pour zona chez les médecins de famille ; de plus, l’extrapolation de données allemandes suggère environ 30 000 nouveaux cas par an en Suisse. En outre, l’incidence passe d’environ 4 pour 1000 personnes par an chez les jeunes adultes à 7 pour 1000 à 50 ans, puis à 11 à 65 ans et à 14 à 75 ans et plus. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, épidémiologie</a>.</p>
<p>Quant au pronostic, il dépend surtout de l’âge. En effet, des complications surviennent dans environ 30 % des cas, et la plus fréquente est la <button class="w" data-k="b02-pa-npz">névralgie post-zostérienne</button> : elle touche environ 7 % des patients à 30 ans, 12 % à 50 ans et 18 % à 70 ans. Enfin, environ un tiers des personnes ayant eu la varicelle feront un zona au cours de leur vie. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a> ; <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>.</p>
<div class="key"><b>À retenir.</b> Le risque de zona et de névralgie post-zostérienne croît avec l’âge : c’est la base de la vaccination dès 65 ans.</div></section>

<section class="ilot" id="b02-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Cette progression avec l’âge s’explique par le mécanisme de la maladie. En effet, après la varicelle, le virus gagne les ganglions sensitifs — ganglions spinaux dorsaux et ganglions des nerfs crâniens — où il reste latent. Or, cette latence est contrôlée par l’<button class="w" data-k="b02-s-immun">immunité cellulaire spécifique</button> ; dès lors, quand celle-ci décline avec l’âge ou sous immunosuppression, le virus se réactive. <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a> ; <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a>.</p>
<p>Ensuite, le virus réactivé descend le long du nerf sensitif jusqu’à la peau du dermatome correspondant. Par conséquent, l’inflammation du ganglion et du nerf explique la douleur qui précède l’éruption, tandis que la réplication cutanée donne les vésicules. De plus, la lésion nerveuse peut persister après la cicatrisation : c’est le substrat de la névralgie post-zostérienne. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, douleur aiguë</a>.</p>
<div class="key"><b>Corrélation clinique.</b> La topographie suit un seul ganglion : c’est pourquoi l’éruption est unilatérale et s’arrête à la ligne médiane.</div></section>

<section class="ilot" id="b02-pa-4"><h2><span class="n">4</span>Agent pathogène et transmission</h2>
<p>Ce mécanisme éclaire aussi la contagiosité. Ainsi, le zona ne se transmet pas comme un zona : le contenu des vésicules contient du virus et peut, en revanche, donner une varicelle à une personne non immune. C’est pourquoi l’OFSP rappelle que le virus se transmet par gouttelettes ou par contact avec le liquide vésiculaire, et que la contagiosité dure jusqu’à ce que toutes les vésicules soient croûteuses. <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>.</p>
<p>Dès lors, la mesure pratique est simple : couvrir les lésions et éviter le contact avec les femmes enceintes non immunes, les nouveau-nés et les immunodéprimés jusqu’au stade de croûtes. Toutefois, en Suisse, 98 % des adultes possèdent des anticorps contre le virus, ce qui limite le risque en population générale. <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>.</p>
<div class="trap"><span class="k">Piège.</span> Un zona peut transmettre la varicelle, jamais le zona : le contact à risque est la personne non immune.</div></section>

<section class="ilot" id="b02-pa-5"><h2><span class="n">5</span>Présentation clinique</h2>
<p>Connaissant l’agent, on comprend la séquence clinique, qui commence avant l’éruption. En effet, une douleur, des brûlures, des paresthésies ou une <button class="w" data-k="b02-pa-allodynie">allodynie</button> précèdent souvent l’éruption de quelques jours ; ensuite apparaissent des vésicules groupées sur fond érythémateux, unilatérales, dans un dermatome. <a href="https://doi.org/10.1111/jdv.13995" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 1 : diagnostic, J Eur Acad Dermatol Venereol 2017;31:9-19, présentation clinique</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, douleur aiguë</a>.</p>

<p>Puis les vésicules se troublent, s’ouvrent et forment des croûtes en une à deux semaines environ ; enfin, la maladie peut durer de quelques jours à plusieurs semaines. Par ailleurs, la douleur aiguë touche au moins 95 % des patients de plus de 50 ans, et 60 à 70 % ont encore mal un mois après. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, douleur aiguë</a>.</p>

<section class="ilot" id="b02-pa-6"><h2><span class="n">6</span>Diagnostic et diagnostic différentiel</h2>
<p>Au terme de l’examen, le diagnostic est donc clinique. Ainsi, la ligne directrice européenne considère qu’une confirmation de laboratoire n’est pas nécessaire devant un zona typique ; en revanche, elle recommande une <button class="w" data-k="b02-e-pcr">amplification génique (PCR) du virus</button> dans les présentations atypiques, chez l’immunodéprimé et dans les formes compliquées. <a href="https://doi.org/10.1111/jdv.13995" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 1 : diagnostic, J Eur Acad Dermatol Venereol 2017;31:9-19, recommandations 1 à 3</a>.</p>
<p>Cependant, le diagnostic exige d’écarter ses imitations. En effet, un <button class="w" data-k="b02-pa-ddx">herpès simplex « zostériforme »</button> peut prendre la même disposition, surtout dans les régions génitale et labiale, sièges habituels de récurrences herpétiques ; de plus, au stade prodromique, la douleur peut faire évoquer une cause cardiaque, pleurale, biliaire ou radiculaire. <a href="https://doi.org/10.1111/jdv.13995" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 1 : diagnostic, J Eur Acad Dermatol Venereol 2017;31:9-19, diagnostic différentiel</a>.</p>
<div class="key"><b>À retenir.</b> Zona typique : aucun examen ; zona atypique, récidivant ou chez l’immunodéprimé : PCR sur frottis de lésion.</div>
<button class="pareto-btn ui" data-k="pareto-b02-clinique">▲ Loi de Pareto — Reconnaître le zona</button></section>

<section class="ilot" id="b02-pa-7"><h2><span class="n">7</span>Formes compliquées et urgences</h2>
<div class="alert"><b>Avis spécialisé immédiat.</b> Zona ophtalmique : avis ophtalmologique, car il peut rendre aveugle et impose un antiviral d’urgence ; zona otique avec paralysie faciale (syndrome de Ramsay Hunt) : avis oto-rhino-laryngologique ; zona disséminé, atteinte neurologique ou viscérale, immunodépression sévère : antiviral intraveineux. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 20, 26 à 28</a>.</div>
<p>Parmi ces formes, le <button class="w" data-k="b02-pa-ophtalmique">zona ophtalmique</button> est la plus fréquente et la plus menaçante. En effet, il représente environ 5 à 10 % des zonas selon l’OFSP, et sa complication la plus grave, la <button class="w" data-k="b02-pa-nra">nécrose rétinienne aiguë</button>, est une urgence qui exige de l’aciclovir intraveineux puis oral pendant trois à quatre mois. Par ailleurs, dans le zona otique avec atteinte du nerf facial, la ligne directrice suggère d’associer aciclovir intraveineux et corticoïdes systémiques. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 26 à 28</a>.</p>
<div class="trap"><span class="k">Piège.</span> Des vésicules sur l’aile ou la pointe du nez annoncent souvent une atteinte de la branche nasociliaire et donc de l’œil : avis ophtalmologique le jour même.</div></section>

<section class="ilot" id="b02-pa-8"><h2><span class="n">8</span>Traitement antiviral</h2>
<p>En l’absence de complication, la décision thérapeutique se résume à une question : faut-il un antiviral ? Or, la ligne directrice européenne le <button class="w" data-k="b02-pa-indic">recommande</button> chez toute personne de 50 ans et plus, en cas de zona de la tête ou du cou, de douleur modérée à sévère, de lésions hémorragiques ou nécrotiques, d’atteinte de plus d’un segment, de vésicules aberrantes, d’atteinte muqueuse, d’immunodépression ou de dermatose sévère ; en revanche, chez le moins de 50 ans avec zona du tronc non compliqué, elle le suggère seulement. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 18 et 19</a>.</p>

<tr><td><button class="w" data-k="b02-p-val">Valaciclovir</button></td><td>1000 mg trois fois par jour par voie orale</td><td>7 jours</td></tr>
<tr><td><button class="w" data-k="b02-p-fam">Famciclovir</button></td><td>500 mg deux fois par jour ; trois fois par jour possible après 50 ans</td><td>7 jours</td></tr>
<tr><td><button class="w" data-k="b02-p-bri">Brivudine</button></td><td>125 mg une fois par jour ; immunocompétent seulement</td><td>7 jours</td></tr>
<tr><td><button class="w" data-k="b02-p-aci">Aciclovir oral</button></td><td>800 mg cinq fois par jour</td><td>7 jours</td></tr>
<tr><td><button class="w" data-k="b02-p-aciv">Aciclovir intraveineux</button></td><td>10 mg/kg toutes les 8 heures chez l’immunodéprimé</td><td>5 jours et plus</td></tr>
</tbody></table>
<p>Le tableau montre ainsi des durées identiques ; c’est donc le délai qui compte. En effet, l’information professionnelle demande de commencer le plus tôt possible, au plus tard dans les 72 heures ; cependant, la ligne directrice suggère de traiter au-delà tant que de nouvelles vésicules apparaissent chez les patients à risque, en cas de zona ophtalmique ou otique, de dissémination ou d’immunodépression. À l’inverse, elle déconseille de débuter l’antiviral après 72 heures dans le zona non compliqué du sujet jeune. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=52693" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Famvir®, août 2023</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55465" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Brivex®, mai 2022</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 23 et 24</a>.</p>
<div class="trap"><span class="k">Erreur fréquente.</span> Prescrire de la brivudine à un patient sous fluoropyrimidine, y compris la capécitabine ou le 5-fluorouracile topique : l’interaction est potentiellement mortelle.</div>
<button class="pareto-btn ui" data-k="pareto-b02-traitement">▲ Loi de Pareto — Traiter le zona</button></section>

<section class="ilot" id="b02-pa-9"><h2><span class="n">9</span>Douleur et névralgie post-zostérienne</h2>
<p>L’antiviral ne suffit toutefois pas : la douleur se traite pour elle-même et tôt. Ainsi, la ligne directrice recommande de mesurer l’intensité par une échelle validée, puis de traiter selon le <button class="w" data-k="b02-p-paliers">palier de l’Organisation mondiale de la santé</button> adapté à cette intensité ; de plus, si la douleur est modérée à sévère ou si d’autres facteurs de risque de névralgie existent, elle propose d’ajouter un antidépresseur tricyclique ou un antiépileptique, hors autorisation pour cette indication. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 33 à 37</a>.</p>
<p>Par ailleurs, les <button class="w" data-k="b02-pa-rfnpz">facteurs de risque de névralgie post-zostérienne</button> sont connus : sexe féminin, âge supérieur à 50 ans, plus de 50 lésions, localisation crânienne ou sacrée, lésions hémorragiques et douleur prodromique. Enfin, en cas de douleur persistante, par exemple quatre semaines après la cicatrisation, la ligne directrice recommande d’adresser le patient à un spécialiste de la douleur. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 37 et 38</a>.</p>
<div class="key"><b>À retenir.</b> Antalgie précoce, systémique et proportionnée ; les traitements locaux anesthésiques ne sont pas recommandés en phase aiguë.</div></section>

<section class="ilot" id="b02-pa-10"><h2><span class="n">10</span>Prévention : vaccination</h2>
<p>Puisque le traitement ne prévient qu’imparfaitement la névralgie, la prévention repose surtout sur la vaccination. Ainsi, l’OFSP et la Commission fédérale pour les vaccinations recommandent le <button class="w" data-k="b02-p-shi">vaccin sous-unitaire adjuvanté Shingrix®</button> en deux doses espacées d’au moins deux mois selon trois <button class="w" data-k="b02-pa-cfv">groupes</button> : personnes immunocompétentes dès 65 ans, personnes de 50 ans et plus avec immunodéficience actuelle ou prévisible, et personnes de 18 ans et plus avec immunodéficience sévère. De plus, la vaccination est remboursée par l’assurance obligatoire des soins depuis février 2022. <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, recommandations</a> ; <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>.</p>
<p>En effet, son efficacité est élevée : dans l’<button class="w" data-k="b02-pa-zoe">essai ZOE-50</button>, la réduction du risque de zona atteignait 97,2 % après 50 ans, et 91,3 % après 70 ans dans l’analyse groupée de ZOE-50 et ZOE-70. Par ailleurs, aucune sérologie n’est recommandée avant la vaccination, et un antécédent de zona n’est pas une contre-indication. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=67987" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Shingrix®, mai 2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1501184" target="_blank" rel="noopener" data-reference-source="1">Lal H et al., essai ZOE-50, N Engl J Med 2015;372:2087</a> ; <a href="https://doi.org/10.1056/NEJMoa1603800" target="_blank" rel="noopener" data-reference-source="1">Cunningham AL et al., essai ZOE-70, N Engl J Med 2016;375:1019</a> ; <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, recommandations</a>.</p>
<div class="key"><b>À retenir.</b> Shingrix® : deux doses à deux mois d’intervalle, dès 65 ans, dès 50 ans si immunodéficience, dès 18 ans si immunodéficience sévère.</div></section>

<section class="ilot" id="b02-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p>Ces règles générales s’adaptent toutefois à certains terrains.</p>
<p><b>Grossesse.</b> D’abord, en l’absence de risque de complication, la ligne directrice suggère de ne pas débuter d’antiviral ; en revanche, en présence de facteurs de risque, elle propose l’aciclovir, molécule la mieux documentée. Par ailleurs, la brivudine est contre-indiquée pendant la grossesse. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 29 et 30</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55465" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Brivex®, mai 2022</a>.</p>
<p><b>Insuffisance rénale.</b> Ensuite, la ligne directrice recommande la brivudine par voie orale ou l’aciclovir intraveineux à dose adaptée ; de même, l’information suisse réduit la dose de valaciclovir dès une clairance de la créatinine inférieure à 50 ml/min. <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandation 25</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>.</p>
<p><b>Immunodépression.</b> Enfin, l’aciclovir intraveineux est privilégié dans les formes compliquées, et la brivudine est contre-indiquée. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55465" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Brivex®, mai 2022</a>.</p>
<p><b>Cas récapitulatif.</b> Pour conclure, Mme L. a plus de 50 ans et consulte au quatrième jour, avec de nouvelles vésicules. Par conséquent, un antiviral oral est justifié, avec une antalgie adaptée à l’intensité de la douleur ; ensuite, la vaccination par Shingrix® lui sera proposée après guérison.</p></section>

<section class="ilot" id="b02-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Délai d’instauration de l’antiviral</td><td>Au plus tard 72 heures ; au-delà si nouvelles vésicules et risque de complication</td></tr>
<tr><td>Durée du traitement oral</td><td>7 jours</td></tr>
<tr><td>Névralgie post-zostérienne</td><td>Environ 7 % à 30 ans, 12 % à 50 ans, 18 % à 70 ans</td></tr>
<tr><td>Zona ophtalmique</td><td>Environ 5 à 10 % des zonas</td></tr>
<tr><td>Vaccination (OFSP)</td><td>Dès 65 ans ; dès 50 ans si immunodéficience ; dès 18 ans si immunodéficience sévère ; 2 doses à 2 mois</td></tr>
</tbody></table>
