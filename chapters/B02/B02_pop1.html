<template data-pop="b02-pa-dermatome" data-title="Dermatome">
<p>Territoire cutané innervé par les fibres sensitives d’une seule racine spinale, donc d’un seul ganglion sensitif. Le zona suit ce territoire : éruption en bande, unilatérale, qui s’arrête à la ligne médiane.</p><div class="src">Sources : <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a> ; <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-s-vzv" data-title="Virus varicelle-zona">
<p>Herpèsvirus humain à ADN double brin. Primo-infection : varicelle ; latence dans les ganglions sensitifs ; réactivation : zona. Environ 98 % des adultes en Suisse ont des anticorps.</p><div class="src">Source : <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-compl" data-title="Zona compliqué ou à risque de complication">
<ul><li>Zona de la tête ou du cou, ophtalmique ou otique.</li><li>Atteinte de plus d’un segment, vésicules aberrantes ou satellites.</li><li>Lésions hémorragiques ou nécrotiques ; atteinte muqueuse.</li><li>Dissémination cutanée, viscérale ou neurologique.</li><li>Immunodépression ; dermatose sévère prédisposante.</li></ul><p>Le zona « non compliqué » est thoracique ou lombaire, unilatéral, chez une personne de moins de 50 ans sans ces signes.</p><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 18 à 24</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-npz" data-title="Névralgie post-zostérienne">
<p>Douleur neuropathique persistant dans le dermatome après la guérison de l’éruption, pendant des semaines, des mois ou des années ; brûlures, piqûres, allodynie. Fréquence selon l’OFSP : environ 7 % des zonas à 30 ans, 12 % à 50 ans, 18 % à 70 ans.</p><div class="src">Source : <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-s-immun" data-title="Immunité cellulaire et latence">
<p>Les lymphocytes T spécifiques du virus contrôlent sa latence dans les ganglions. Leur déclin avec l’âge, ou sous immunosuppression cellulaire (hémopathie, greffe, inhibiteurs de JAK, corticoïdes à forte dose, infection à VIH avec moins de 200 lymphocytes CD4 par microlitre), augmente le risque de zona.</p><div class="src">Source : <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, recommandations</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-allodynie" data-title="Allodynie">
<p>Douleur provoquée par un stimulus normalement non douloureux, par exemple le frottement d’un vêtement. Elle accompagne souvent la douleur prodromique et la névralgie post-zostérienne.</p><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, douleur aiguë</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-e-pcr" data-title="Amplification génique (PCR) du virus">
<div class="lab">Indications</div><p>Présentation atypique ; lésions génitales ou labiales (diagnostic différentiel de l’herpès simplex) ; immunodépression ; formes compliquées.</p><div class="lab">Performance</div><p>Sensibilité et spécificité de 95 à 100 % ; prélèvement sur lésion ouverte, vésicule décoiffée ou croûte.</p><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13995" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 1 : diagnostic, J Eur Acad Dermatol Venereol 2017;31:9-19, recommandations 1 à 3</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-ddx" data-title="Herpès simplex zostériforme et autres diagnostics">
<ul><li>Herpès simplex zostériforme : même aspect, surtout en région génitale ou labiale ; récurrences au même endroit ; PCR multiplex.</li><li>Au stade prodromique : douleur thoracique d’origine cardiaque ou pleurale, colique biliaire ou néphrétique, radiculopathie.</li><li>Dermatoses zostériformes : à distinguer en l’absence de distribution typique.</li></ul><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13995" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 1 : diagnostic, J Eur Acad Dermatol Venereol 2017;31:9-19, diagnostic différentiel</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-ophtalmique" data-title="Zona ophtalmique">
<p>Réactivation dans le ganglion trigéminal, territoire de la branche ophtalmique : environ 5 à 10 % des zonas selon le Bulletin de l’OFSP ; la page publique de l’OFSP indique 10 à 20 % d’atteinte oculaire, chiffre plus large. Risques : kératite, sclérite, uvéite, choriorétinite, nécrose rétinienne. Conduite : antiviral d’urgence et avis ophtalmologique, qui fixe la stratégie et le suivi.</p><div class="src">Sources : <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, tableau clinique</a> ; <a href="https://www.bag.admin.ch/fr/varicelle-zona" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Varicelle & Zona »</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, zona ophtalmique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-nra" data-title="Nécrose rétinienne aiguë">
<p>Urgence ophtalmologique rapidement progressive, pouvant gagner l’autre œil. Traitement selon la ligne directrice : aciclovir intraveineux 10 mg/kg trois fois par jour pendant 7 à 10 jours, puis aciclovir oral 800 mg cinq fois par jour pendant 3 à 4 mois, dose adaptée à la fonction rénale ; corticoïdes en appoint, jamais sans antiviral.</p><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 26 et 27</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-indic" data-title="Indications de l’antiviral (ligne directrice européenne)">
<div class="lab">Recommandé</div><ul><li>Toute localisation à partir de 50 ans.</li><li>Tête et cou à tout âge.</li><li>Douleur modérée à sévère ; lésions hémorragiques ou nécrotiques.</li><li>Plus d’un segment ; vésicules aberrantes ; atteinte muqueuse.</li><li>Immunodépression ; dermatose sévère ; enfant sous salicylés ou corticoïdes au long cours.</li></ul><div class="lab">Suggéré</div><p>Moins de 50 ans, tronc ou membres, sans risque de complication.</p><div class="lab">Déconseillé</div><p>Zona non compliqué du moins de 50 ans vu après 72 heures.</p><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 18, 19 et 24</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-val" data-title="Valaciclovir">
<p>Promédicament de l’aciclovir. Zona, y compris ophtalmique : 1000 mg trois fois par jour pendant 7 jours, à débuter au plus tard dans les 72 heures. Adaptation dès une clairance inférieure à 50 ml/min. Pas d’adaptation nécessaire dans la cirrhose légère à modérée.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-fam" data-title="Famciclovir">
<p>Promédicament du penciclovir. Zona de l’adulte immunocompétent : 500 mg deux fois par jour pendant 7 jours ; après 50 ans, 500 mg trois fois par jour possible, ce qui pourrait réduire la névralgie post-zostérienne. Pendant la grossesse : données insuffisantes, ne pas prescrire sauf nécessité.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=52693" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Famvir®, août 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-bri" data-title="Brivudine">
<p>125 mg une fois par jour pendant 7 jours, chez l’adulte immunocompétent, de préférence dans les 72 heures suivant l’éruption ou dans les 48 heures suivant les premières vésicules. Contre-indications : fluoropyrimidines (5-fluorouracile, capécitabine…), immunodépression, enfant et adolescent, grossesse, allaitement. Pas d’adaptation rénale ou hépatique nécessaire.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55465" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Brivex®, mai 2022</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-aci" data-title="Aciclovir oral">
<p>Varicelle et zona : 800 mg cinq fois par jour pendant 7 jours, à débuter dans les 72 heures. Chez l’immunodéprimé, préférer la voie intraveineuse. Hydratation suffisante en cas d’insuffisance rénale. L’effet sur la névralgie post-zostérienne n’est pas suffisamment prouvé selon l’information suisse.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-aciv" data-title="Aciclovir intraveineux">
<p>Zona de l’immunodéprimé à fonction rénale normale : 10 mg/kg toutes les 8 heures pendant 5 jours et plus. Adaptation : clairance 25 à 50 ml/min, dose usuelle toutes les 12 heures ; 10 à 25 ml/min, toutes les 24 heures. Indiqué aussi dans les formes disséminées et le zona ophtalmique compliqué.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a> ; <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandation 20</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-paliers" data-title="Antalgie selon les paliers de l’Organisation mondiale de la santé">
<ul><li>Douleur légère : anti-inflammatoires non stéroïdiens ou autres non opioïdes.</li><li>Douleur modérée : non opioïde associé à un opioïde faible.</li><li>Douleur sévère : non opioïde associé à un opioïde fort.</li><li>Composante neuropathique, facteurs de risque : ajout possible d’amitriptyline, de gabapentine ou de prégabaline, hors autorisation pour la douleur aiguë du zona.</li></ul><p>Le traitement débute directement au palier correspondant à l’intensité, sans escalade progressive.</p><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, recommandations 36 et 37</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-rfnpz" data-title="Facteurs de risque de névralgie post-zostérienne">
<ul><li>Sexe féminin.</li><li>Âge supérieur à 50 ans.</li><li>Plus de 50 lésions.</li><li>Localisation crânienne ou sacrée.</li><li>Lésions hémorragiques.</li><li>Douleur dermatomique prodromique.</li></ul><div class="src">Source : <a href="https://doi.org/10.1111/jdv.13957" target="_blank" rel="noopener" data-reference-source="1">Werner RN et al., ligne directrice européenne S2k sur le zona (EDF/EADV), partie 2 : traitement, J Eur Acad Dermatol Venereol 2017;31:20-29, douleur aiguë, d’après Meister 1998</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-p-shi" data-title="Shingrix®">
<p>Vaccin sous-unitaire, glycoprotéine E du virus associée à l’adjuvant AS01B ; non vivant, donc utilisable chez l’immunodéprimé. Deux doses de 0,5 ml par voie intramusculaire, la seconde 2 mois après la première (entre 2 et 6 mois si nécessaire ; 1 à 2 mois chez l’immunodéprimé). Ne prévient pas la varicelle. Effets indésirables très fréquents : douleur au point d’injection, fatigue, myalgies.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=67987" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Shingrix®, mai 2026</a> ; <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, recommandations</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-cfv" data-title="Groupes cibles de la vaccination (OFSP et Commission fédérale pour les vaccinations)">
<div class="lab">A — Recommandation complémentaire</div><p>Personnes immunocompétentes dès 65 ans, quels que soient leurs antécédents de varicelle ou de zona.</p><div class="lab">B1 — Groupe à risque</div><p>Dès 50 ans avec immunodéficience actuelle ou prévisible : infection à VIH, traitement oncologique, dialyse, biomédicaments, azathioprine, méthotrexate à faible dose, polyarthrite rhumatoïde, asthme sévère ou bronchopneumopathie chronique obstructive, diabète de type 1 mal contrôlé.</p><div class="lab">B2 — Immunodéficience sévère</div><p>Dès 18 ans : hémopathie maligne, greffe de cellules souches ou d’organe, inhibiteurs de JAK, immunosuppression intensive, infection à VIH avec moins de 200 lymphocytes CD4 par microlitre ; idéalement première dose au moins 4 semaines avant l’immunosuppression.</p><div class="src">Source : <a href="https://www.infovac.ch/docs/public/zona-herpes-zoster/nouvelles-recommandations-vaccination-zona---shingrix--.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et CFV, « Nouvelles recommandations concernant la vaccination contre le zona : vaccin Shingrix® », Bull OFSP 2021;47:8-15, recommandations 7.1</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b02-pa-zoe" data-title="Essais ZOE-50 et ZOE-70">
<p>Essais randomisés contre placebo, deux doses à 0 et 2 mois. ZOE-50 (50 ans et plus) : 6 cas de zona sous vaccin contre 210 sous placebo, efficacité 97,2 % (IC 95 % 93,7 à 99,0) sur un suivi médian de 3,1 ans. ZOE-50 et ZOE-70 groupés (70 ans et plus) : efficacité 91,3 % (IC 95 % 86,8 à 94,5).</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=67987" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Shingrix®, mai 2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1501184" target="_blank" rel="noopener" data-reference-source="1">Lal H et al., essai ZOE-50, N Engl J Med 2015;372:2087</a> ; <a href="https://doi.org/10.1056/NEJMoa1603800" target="_blank" rel="noopener" data-reference-source="1">Cunningham AL et al., essai ZOE-70, N Engl J Med 2016;375:1019</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-b02-clinique" data-title="Loi de Pareto — Reconnaître le zona">
<p class="ratio" data-cover="b02-pa-1,b02-pa-3,b02-pa-5,b02-pa-6,b02-pa-7"></p><ul><li>Douleur dermatomique, puis vésicules groupées unilatérales.</li><li>Diagnostic clinique ; PCR si atypique ou immunodéprimé.</li><li>Tête et cou, œil, oreille, dissémination : avis spécialisé, souvent aciclovir intraveineux.</li></ul>
</template>
<template data-pop="pareto-b02-traitement" data-title="Loi de Pareto — Traiter le zona">
<p class="ratio" data-cover="b02-pa-8,b02-pa-9,b02-pa-10"></p><ul><li>Antiviral dès 50 ans ou si risque, au plus tard à 72 heures, 7 jours.</li><li>Antalgie précoce selon l’intensité.</li><li>Shingrix® dès 65 ans, dès 50 ou 18 ans si immunodéficience.</li></ul>
</template>
<template data-pop="pareto-b02-examens" data-title="Loi de Pareto — Examens du zona">
<p class="ratio" data-cover="b02-e-1,b02-e-2"></p><ul><li>Aucun examen si typique.</li><li>PCR sur frottis si doute ou terrain à risque.</li><li>Tzanck ne distingue pas zona et herpès simplex.</li></ul>
</template>
<template data-pop="pareto-b02-pharma" data-title="Loi de Pareto — Pharmacologie du zona">
<p class="ratio" data-cover="b02-p-1,b02-p-2,b02-p-3"></p><ul><li>Valaciclovir 1000 mg trois fois par jour, adapté au rein.</li><li>Brivudine : jamais avec les fluoropyrimidines ni chez l’immunodéprimé.</li><li>Aciclovir intraveineux dans les formes graves.</li></ul>
</template>
