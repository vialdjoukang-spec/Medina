<div class="chap-head"><div class="code">A15–A16 — Tuberculose de l’appareil respiratoire · CIM-10-GM 2024 · I-03-Infectiologie</div><h1>Tuberculose pulmonaire</h1><span class="status">Version de travail · Sources lues le 9 octobre 2026 : guide national « Tuberculose en Suisse » de la Ligue pulmonaire suisse et de l’OFSP (V1.2024, rédigé avec la Société suisse d’infectiologie et la Société suisse de pneumologie) ; Bulletin de l’OFSP sur la tuberculose en 2025 (septembre 2026) ; informations professionnelles suisses Rimactan®, Myambutol®, Pyrazinamide Labatec®, Rifater® et Rifinah® (Swissmedic). Le cours couvre A15 (tuberculose respiratoire confirmée par bactériologie, biologie moléculaire ou histologie) et A16 (tuberculose respiratoire sans confirmation). Relecture médicale humaine non encore effectuée.</span></div>

<section class="ilot" id="a15-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. A., 19 ans, arrivé en Suisse il y a huit mois depuis la Somalie, consulte pour une toux depuis six semaines, des sueurs nocturnes et une perte de 5 kg ; or, l’OFSP observe depuis 2022 une hausse des cas, surtout chez les adolescents et les jeunes adultes nés à l’étranger. Ainsi, ce tableau impose d’évoquer une <button class="w" data-k="a15-pa-def">tuberculose pulmonaire</button>. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, comment confirmer le diagnostic et évaluer la contagiosité ? Ensuite, quand isoler le patient et quand déclarer le cas ? Puis, quel schéma prescrire et comment le surveiller ? Enfin, comment reconnaître le risque de résistance ?</p>
<div class="key"><b>À retenir.</b> Une toux prolongée avec des signes généraux chez une personne originaire d’un pays à forte incidence impose sans délai une radiographie du thorax et une PCR des expectorations.</div></section>

<section class="ilot" id="a15-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord distinguer l’infection de la maladie. En effet, le guide suisse définit l’<button class="w" data-k="a15-pa-itb">infection tuberculeuse</button> comme une réponse immunitaire persistante aux antigènes de <i>M. tuberculosis</i> sans manifestation clinique, tandis que la tuberculose est la maladie causée par une espèce du <button class="w" data-k="a15-s-complexe">complexe <i>Mycobacterium tuberculosis</i></button>. Par conséquent, la personne infectée n’est ni malade ni contagieuse. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>La CIM-10-GM 2024 distingue la tuberculose de l’appareil respiratoire confirmée par la bactériologie, la biologie moléculaire ou l’histologie (A15) de celle qui n’a pas reçu cette confirmation (A16).</p>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque paramètre fonde une décision : l’incidence suisse rappelle que la maladie touche surtout des personnes venues de pays à forte incidence ; la sensibilité limitée des tests immunologiques explique qu’ils n’excluent pas la tuberculose ; enfin, le schéma de 6 mois associe quatre antituberculeux au départ, pour tuer rapidement les bacilles et éviter la sélection de résistances. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div>
<p>Ainsi, la classification repose sur la preuve microbiologique ; or, de 2020 à 2025, 91 à 95 % des cas déclarés chaque année en Suisse ont été confirmés en laboratoire, de sorte que A15 est de loin le code le plus fréquent. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</p></section>

<section class="ilot" id="a15-pa-2"><h2><span class="n">2</span>Épidémiologie suisse et mondiale</h2>
<p>Une fois la maladie définie, reste à en mesurer le poids. En Suisse et au Liechtenstein, les cas déclarés sont passés de 350 en 2021, niveau le plus bas depuis 1988, à 544 en 2025, soit 6,0 cas pour 100 000 habitants ; la Suisse reste toutefois un pays à faible incidence, sous la moyenne européenne de 8,4 pour 100 000 en 2024. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</p>
<p>De plus, cette hausse concerne presque exclusivement les personnes nées à l’étranger, notamment en Érythrée, en Somalie et en Afghanistan, tandis que les cas des personnes nées en Suisse surviennent plutôt à un âge avancé, par réactivation. En outre, le taux de déclaration le plus élevé en 2025 touchait les 15 à 19 ans, avec 22,3 pour 100 000, et 94 % des malades avaient une atteinte pulmonaire. À l’échelle mondiale, enfin, l’OMS estime à 10,7 millions le nombre de nouveaux cas en 2024. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</p>
<div class="key"><b>À retenir.</b> En 2025, la Suisse a déclaré 544 cas, soit 6,0 pour 100 000 habitants ; la hausse est portée par les jeunes migrants, et 94 % des cas ont une atteinte pulmonaire.</div></section>

<section class="ilot" id="a15-pa-3"><h2><span class="n">3</span>Transmission et pathogenèse</h2>
<p>Ce poids épidémiologique s’explique par le mode de transmission. En effet, <i>M. tuberculosis</i> se transmet par voie aérienne : la toux et la parole produisent des gouttelettes dont les plus petites, une fois évaporées, restent en suspension pendant plusieurs heures ; c’est pourquoi aucune distance de sécurité ne peut être définie dans une pièce close ou mal ventilée. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>Ensuite, les particules inhalées atteignent les alvéoles, où les macrophages les phagocytent ; or, le bacille empêche leur destruction, se multiplie dans le macrophage, puis déclenche une réponse lymphocytaire. Il en résulte soit l’éradication, soit la persistance des bacilles dans un <button class="w" data-k="a15-s-granulome">granulome</button>. Par ailleurs, la contagiosité augmente avec la toux, la charge bacillaire, surtout en cas de forme cavitaire, et les gestes invasifs comme la bronchoscopie ; elle est rare avant l’âge de 12 ans. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>

hie : Department of Pathology, Calicut Medical College, <a href="https://commons.wikimedia.org/wiki/File:Tuberculous_lymph_node_with_caseating_granuloma_40X.jpg" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence <a href="https://creativecommons.org/licenses/by-sa/4.0" target="_blank" rel="noopener" data-reference-source="1">Creative Commons Attribution – Partage dans les mêmes conditions 4.0</a> ; réduite et convertie pour l’affichage.</figcaption></figure>
<div class="key"><b>Lecture et physiopathologie.</b> Le granulome est la réponse de l’hôte qui contient le bacille : des macrophages activés, transformés en cellules épithélioïdes et en cellules géantes, entourent le foyer, cerclés de lymphocytes. Au centre, la nécrose caséeuse, pauvre en oxygène, freine la multiplication des bacilles. C’est pourquoi ce granulome signe une infection contrôlée, et pourquoi son affaiblissement, par exemple sous anti-TNF, réactive la tuberculose. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div></section>

<section class="ilot" id="a15-pa-4"><h2><span class="n">4</span>Facteurs de progression</h2>
<p>Toutefois, la plupart des personnes infectées ne deviennent jamais malades. Ainsi, le risque de progression vers la maladie est maximal pendant les deux années qui suivent l’infection ; de plus, il est nettement accru chez le nourrisson et le jeune enfant, en cas d’<button class="w" data-k="a15-pa-vih">infection par le VIH</button> et d’immunosuppression médicamenteuse, par exemple après une transplantation d’organe solide. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>En outre, le guide suisse cite d’autres facteurs : silicose, insuffisance rénale chronique, diabète, tabagisme, malnutrition, ainsi que l’adolescence et le début de l’âge adulte. Par conséquent, ces situations justifient de rechercher l’infection chez les personnes exposées. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p></section>

<section class="ilot" id="a15-pa-5"><h2><span class="n">5</span>Présentation clinique</h2>
<p>Lorsque la maladie se déclare, son évolution est lente. En effet, elle associe des signes locaux, toux et expectorations peu abondantes, et des signes généraux : fièvre, malaise, fatigue, sueurs nocturnes, perte d’appétit et de poids. Cependant, aucun signe n’est pathognomonique, et les symptômes sont souvent discrets au début ; c’est pourquoi la suspicion repose sur l’ensemble des facteurs, origine du patient, durée des symptômes, exposition antérieure et radiologie. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>Par ailleurs, la présentation varie avec l’âge : le sujet âgé a moins de symptômes, et plus atypiques, tandis que l’enfant peut présenter une fièvre prolongée et un retard de croissance. Enfin, le guide décrit un spectre comprenant une proportion considérable de <button class="w" data-k="a15-pa-subcl">tuberculoses subcliniques</button>, peu ou pas symptomatiques. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<div class="alert"><b>Formes graves.</b> La miliaire, l’atteinte de plusieurs organes et la méningite tuberculeuse s’observent surtout chez l’immunodéprimé, le très jeune enfant et le sujet très âgé. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div></section>

<section class="ilot" id="a15-pa-6"><h2><span class="n">6</span>Imagerie thoracique</h2>
<p>Puisque la clinique est peu spécifique, l’imagerie oriente souvent le diagnostic. Ainsi, des infiltrats asymétriques des champs supérieurs, surtout s’ils contiennent des cavités ou des micronodules, sont hautement évocateurs ; en revanche, des localisations basales s’observent plus souvent chez le sujet âgé et l’immunodéprimé, et des adénopathies hilaires chez l’enfant. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>

graphie thoracique de face montrant des infiltrats bilatéraux des sommets (triangles blancs) et une cavité apicale droite (flèches noires)" width="400" height="367" loading="lazy" decoding="async" style="max-width:100%;height:auto;border-radius:6px"><figcaption>Figure 2 — Tuberculose pulmonaire bilatérale avancée : infiltrats des deux champs supérieurs (triangles blancs) et cavité apicale droite (flèches noires). Photographie : Auteur inconnu, <a href="https://commons.wikimedia.org/wiki/File:Tuberculosis-x-ray-1.jpg" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence domaine public ; réduite et convertie pour l’affichage.</figcaption></figure>
<div class="key"><b>Lecture et physiopathologie.</b> Les infiltrats des sommets traduisent la préférence du bacille aérobie pour les régions apicales, mieux ventilées et moins perfusées, donc riches en oxygène. Quand le caséum se vide dans une bronche, il laisse une cavité très riche en bacilles, source de toux productive et de contagion. C’est pourquoi une image apicale ou cavitaire impose des expectorations pour PCR et culture. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div>
<p>De plus, la tomodensitométrie, même à faible dose, détecte mieux les petites cavités, l’aspect en <button class="w" data-k="a15-e-arbre">« arbre en bourgeons »</button> et la miliaire. Toutefois, aucune image n’est spécifique, et l’imagerie ne distingue pas une tuberculose active d’une lésion guérie ; par conséquent, toute image compatible impose des examens microbiologiques. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p></section>

<section class="ilot" id="a15-pa-7"><h2><span class="n">7</span>Diagnostic microbiologique</h2>
<p>Ces examens apportent seuls le diagnostic définitif, qui repose sur l’identification d’une espèce du complexe <i>M. tuberculosis</i> par culture ou par amplification génique. Ainsi, en cas de suspicion de tuberculose pulmonaire, un premier échantillon d’expectoration est prélevé sur place pour une <button class="w" data-k="a15-e-pcr">PCR directe</button> immédiate, puis un second une heure plus tard. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>En revanche, les tests immunologiques, <button class="w" data-k="a15-e-igra">test de libération d’interféron gamma</button> et test tuberculinique, ne prouvent pas la maladie : leur sensibilité n’est que de 70 à 80 %, si bien que plus de 20 % des malades ont un test négatif. De plus, un test positif ne distingue pas la maladie de l’infection. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<div class="key"><b>À retenir.</b> Le diagnostic repose sur la PCR et la culture des expectorations ; le test immunologique ne confirme ni n’exclut la tuberculose maladie.</div>
<button class="pareto-btn ui" data-k="pareto-a15-clinique">▲ Loi de Pareto — Reconnaître une tuberculose pulmonaire</button></section>

<section class="ilot" id="a15-pa-8"><h2><span class="n">8</span>Isolement et déclaration</h2>
<p>Dès la suspicion, la priorité est d’éviter la transmission. En effet, à l’hôpital, le patient suspect non traité est isolé jusqu’à ce qu’au moins un premier échantillon respiratoire soit négatif en PCR ; à l’inverse, un cas non traité positif en PCR est considéré comme contagieux, et l’isolement, à domicile ou à l’hôpital, se poursuit jusqu’à 5 à 15 jours de traitement efficace, plus longtemps en cas de mutation de résistance à la rifampicine. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>Par ailleurs, la tuberculose est à <button class="w" data-k="a15-pa-decl">déclaration obligatoire</button> : le médecin déclare au médecin cantonal tout cas dès le début du traitement, puis l’issue du traitement. Ainsi, le service du médecin cantonal décide d’une <button class="w" data-k="a15-pa-entourage">enquête d’entourage</button>. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</p></section>

<section class="ilot" id="a15-pa-9"><h2><span class="n">9</span>Traitement standard</h2>
<p>Une fois le diagnostic posé, le traitement associe plusieurs antituberculeux. Avant de le débuter, le guide impose cependant de prélever les échantillons, d’évaluer le risque de résistance, de proposer un test VIH, d’évaluer les fonctions hépatique et rénale, et de dresser la liste complète des médicaments. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>Ensuite, le schéma standard <button class="w" data-k="a15-p-hrze">2 HRZE, puis isoniazide et rifampicine pendant 4 mois</button> comporte une phase intensive de deux mois, isoniazide, rifampicine, pyrazinamide et éthambutol, puis une phase de continuation de quatre mois, isoniazide et rifampicine, en une prise quotidienne, si possible le matin. De plus, la <button class="w" data-k="a15-p-b6">pyridoxine</button> est donnée avec l’isoniazide pour réduire le risque de neuropathie, et les associations à dose fixe simplifient la prise. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<div class="alert"><b>Adhésion.</b> Le traitement intermittent est fortement déconseillé en phase intensive ; de plus, la <button class="w" data-k="a15-p-dot">prise directement observée</button> est recommandée en cas de difficulté de communication, de situation sociale instable, de troubles psychiques, de traitement antérieur ou de multirésistance. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div>
<button class="pareto-btn ui" data-k="pareto-a15-traitement">▲ Loi de Pareto — Traiter une tuberculose pulmonaire</button></section>

<section class="ilot" id="a15-pa-10"><h2><span class="n">10</span>Résistances</h2>
<p>Ce schéma suppose toutefois une souche sensible. Or, le risque de résistance est particulièrement élevé après un traitement antituberculeux antérieur d’au moins un mois, après un contact avec un cas résistant, et chez les personnes originaires d’une région à forte prévalence de résistance, comme la plupart des pays de l’ex-Union soviétique. Ainsi, de 2020 à 2025, 32 % des isolats testés de patients originaires d’Ukraine étaient résistants à la rifampicine, contre 1,98 % de l’ensemble. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</p>
<p>Par conséquent, la conduite dépend du profil. En cas de <button class="w" data-k="a15-p-inh">résistance isolée à l’isoniazide</button>, l’OMS recommande rifampicine, pyrazinamide, éthambutol et lévofloxacine pendant 6 mois ; en revanche, une <button class="w" data-k="a15-p-mdr">résistance à la rifampicine</button> confirmée par le laboratoire national de référence de Zurich impose l’avis d’un spécialiste et un schéma de deuxième ligne, par exemple bédaquiline, prétomanide, linézolide et moxifloxacine pendant 6 mois. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p></section>

<section class="ilot" id="a15-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p>Au-delà du cas général, certaines situations modifient le schéma. D’abord, pendant la grossesse et l’allaitement, le schéma standard, 2 HRZE puis 4 mois d’isoniazide et de rifampicine, est recommandé. Ensuite, chez l’immunodéprimé, le schéma reste standard, mais les interactions de la rifampicine avec les antirétroviraux peuvent faire préférer la rifabutine. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>Par ailleurs, en cas d’insuffisance hépatique, le pyrazinamide ne doit pas être employé et le traitement est prolongé jusqu’à 9 mois ; de plus, une <button class="w" data-k="a15-p-hepato">hépatite médicamenteuse</button> impose d’arrêter les médicaments hépatotoxiques. Enfin, en cas d’insuffisance rénale avec clairance de la créatinine inférieure à 30 ml/min, l’éthambutol et le pyrazinamide sont espacés à trois prises par semaine ; sous hémodialyse, tous les médicaments sont donnés après la séance. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<div class="alert"><b>Point à trancher (audit).</b> L’information suisse de Rimactan® contre-indique la rifampicine si la clairance de la créatinine est inférieure à 25 ml/min, celles de Rifater® et de Rifinah® en dessous de 30 ml/min, alors que le guide national adapte seulement l’éthambutol et le pyrazinamide. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=34279" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rimactan®, octobre 2023</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47063" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rifater®, février 2026</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=38931" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rifinah®, février 2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div></section>

<section class="ilot" id="a15-pa-12"><h2><span class="n">12</span>Suivi et prévention</h2>
<p>Une fois le traitement engagé, son efficacité doit être documentée. Ainsi, les visites ont lieu tous les quinze jours en phase intensive, puis au moins une fois par mois ; de plus, l’examen microscopique et la culture des expectorations sont répétés à la fin du deuxième mois et avant la fin du cinquième. En revanche, la PCR reste positive plus de 6 mois et ne sert donc pas au suivi. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p>
<p>Enfin, la prévention repose avant tout sur le diagnostic précoce et l’enquête d’entourage ; en effet, la vaccination par le <button class="w" data-k="a15-pa-bcg">BCG</button> n’est plus recommandée aux résidents permanents de Suisse, sauf pour les nourrissons de moins de 12 mois qui vivront de manière permanente dans un pays dont l’incidence dépasse 50 cas pour 100 000 habitants par an. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</p></section>

<section class="ilot" id="a15-pa-13"><h2><span class="n">13</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Critère formel (guide suisse V1.2024).</b> Le diagnostic définitif repose sur l’identification d’une espèce du complexe <i>M. tuberculosis</i> dans un échantillon biologique, par culture et/ou amplification génique (A15) ; un traitement sur la seule base clinique ou radiologique (A16) est réservé à des situations exceptionnelles, en particulier chez l’enfant. Le guide l’estime à environ 20 % des cas déclarés ; cependant, le Bulletin 2025 rapporte 93,8 % de cas confirmés en laboratoire, écart signalé pour l’audit. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>.</div>
<p>En synthèse, les autres valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Cas en Suisse et au Liechtenstein, 2025</td><td>544 ; 6,0 pour 100 000 habitants</td></tr>
<tr><td>Sensibilité des tests immunologiques</td><td>70 à 80 %</td></tr>
<tr><td>Schéma standard</td><td>2 HRZE, puis isoniazide et rifampicine 4 mois (6 mois au total)</td></tr>
<tr><td>Isolement d’un cas positif en PCR</td><td>Jusqu’à 5 à 15 jours de traitement efficace</td></tr>
<tr><td>Transaminases</td><td>Au début, après 7 à 10 jours, puis mensuellement si atteinte hépatique ou facteur prédisposant</td></tr>
<tr><td>Hépatite médicamenteuse</td><td>ALAT ≥ 3 fois la normale avec symptômes, ou ≥ 5 fois sans symptômes</td></tr>
<tr><td>Résistance à la rifampicine, Suisse 2020–2025</td><td>1,98 % des isolats testés</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Le bilan suit la question clinique : l’imagerie montre l’atteinte, la PCR directe identifie le bacille et la résistance à la rifampicine en quelques heures, et la culture, plus lente, reste la référence pour l’antibiogramme complet. <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>.</div>
