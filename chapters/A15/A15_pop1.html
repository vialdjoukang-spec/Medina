<p>Réponse immunitaire persistante aux antigènes de <i>M. tuberculosis</i>, sans maladie ; la personne n’est pas contagieuse. Le terme « infection tuberculeuse latente » est considéré comme obsolète par l’OMS.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="a15-pa-vih" data-title="Tuberculose et VIH">
<p>L’infection par le VIH accroît considérablement le risque de progression ; un test VIH fait partie du bilan avant traitement ; interactions rifampicine-antirétroviraux, d’où la rifabutine possible.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-pa-subcl" data-title="Tuberculose subclinique">
<p>Forme de tuberculose présentant des symptômes légers ou inexistants, décrite dans le spectre de la maladie par les concepts récents.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-e-arbre" data-title="Aspect en arbre en bourgeons">
<p>Micronodules centrolobulaires branchés visibles en tomodensitométrie, témoins d’une dissémination endobronchique ; mieux détectés qu’à la radiographie.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-e-pcr" data-title="PCR directe (Xpert® MTB/RIF Ultra)">
<p>Amplification génique sur expectoration non traitée, en moins de 2 heures : détecte le complexe <i>M. tuberculosis</i> et la résistance à la rifampicine (<i>rpoB</i>). Test primaire recommandé par l’OMS. Reste positive plus de 6 mois : inutile pour le suivi. Moins sensible dans les épanchements et le liquide cérébro-spinal.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-e-igra" data-title="Test de libération d’interféron gamma">
<p>Test sanguin indirect de la réponse immunitaire à <i>M. tuberculosis</i>. Sensibilité de 70 à 80 % dans la maladie ; ne distingue pas l’infection de la maladie.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="a15-pa-decl" data-title="Déclaration obligatoire">
<p>Le médecin déclare les cas confirmés et ceux traités par au moins trois antituberculeux, dès le début du traitement, puis l’issue du traitement ; les laboratoires déclarent les résultats de microscopie, PCR, culture et résistance.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KgDGxmnGvfis/Bulletin-2026-Tuberculose.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP, « La tuberculose en Suisse et dans la Principauté de Liechtenstein en 2025 », Bulletin de l’OFSP, septembre 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-pa-entourage" data-title="Enquête d’entourage">
<p>Recherche des contacts d’un cas contagieux, décidée par le service du médecin cantonal ; son étendue dépend notamment de la charge bacillaire à la microscopie.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-hrze" data-title="Schéma standard : 2 HRZE, puis isoniazide et rifampicine">
<p>H = isoniazide, R = rifampicine, Z = pyrazinamide, E = éthambutol. Deux mois à quatre médicaments, puis quatre mois à deux médicaments, chaque jour. Prolongations : méningite 12 mois au total avec corticoïdes ; insuffisance hépatique sans pyrazinamide 9 mois ; <i>M. bovis</i> 9 mois sans pyrazinamide.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-b6" data-title="Pyridoxine">
<p>Vitamine du groupe B (dite B6) donnée avec l’isoniazide à toutes les personnes traitées, pour réduire le risque de neuropathie.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-dot" data-title="Prise directement observée">
<p>Observation de la prise par une tierce personne (centre spécialisé, ligue pulmonaire cantonale, pharmacie, soins à domicile) ; réduit le risque de résistance ; le traitement vidéo-observé est testé en Suisse.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-inh" data-title="Résistance isolée à l’isoniazide">
<p>Rifampicine, pyrazinamide, éthambutol et lévofloxacine pendant 6 mois (OMS), dès la découverte de la résistance ; toujours avec un spécialiste.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-mdr" data-title="Tuberculose résistante à la rifampicine">
<p>Confirmation obligatoire par le laboratoire national de référence de Zurich ; avis du groupe d’experts de la Ligue pulmonaire suisse. Exemple de schéma : bédaquiline, prétomanide, linézolide, moxifloxacine pendant 6 mois.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-hepato" data-title="Hépatite médicamenteuse">
<p>ALAT ≥ 3 fois la limite supérieure avec symptômes d’hépatite, ou ≥ 5 fois sans symptômes : arrêt des hépatotoxiques jusqu’à normalisation, puis réintroduction le plus souvent tolérée, avec un spécialiste.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-pa-bcg" data-title="Vaccin BCG">
<p>Souche atténuée de <i>M. bovis</i> ; protège surtout contre la méningite et la tuberculose disséminée de l’enfant. Suisse : seulement pour les nourrissons de moins de 12 mois qui vivront durablement dans un pays d’incidence &gt; 50 pour 100 000 par an ; vaccin non disponible en Suisse.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-rif" data-title="Rifampicine (Rimactan®)">
<p>10 (8–12) mg/kg par jour, maximum 600 mg, à jeun au moins une demi-heure avant un repas ; toujours associée. Contre-indications : hépatite médicamenteuse antérieure, hépatopathie aiguë, cirrhose, névrite périphérique, porphyrie, clairance &lt; 25 ml/min. Inducteur enzymatique puissant.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=34279" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rimactan®, octobre 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-inhm" data-title="Isoniazide">
<p>5 (4–6) mg/kg par jour chez l’adulte ; hépatotoxique ; neuropathie prévenue par la pyridoxine. Dans Rifater® : 4–10 mg/kg, maximum 300 mg.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=47063" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Rifater®, février 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-pza" data-title="Pyrazinamide">
<p>25 (20–30) mg/kg par jour en une prise, pendant les 2 mois de phase initiale. Contre-indiqué en cas d’affection hépatique aiguë et de porphyrie ; à éviter en cas d’insuffisance hépatique (guide suisse).</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=57699" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Pyrazinamide Labatec®, octobre 2022</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a15-p-emb" data-title="Éthambutol (Myambutol®)">
<p>15 (15–20) mg/kg par jour selon l’OMS ; jusqu’à 25 mg/kg en phase initiale selon l’information suisse. Névrite optique rétrobulbaire : contrôles oculaires réguliers (ophtalmoscopie, périmétrie, vision des couleurs). Contre-indiqué en cas de lésion du nerf optique.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=33153" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Myambutol®, août 2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener" data-reference-source="1">Ligue pulmonaire suisse et OFSP, « Tuberculose en Suisse – Guide à l’usage des professionnels de la santé », version V1.2024 (octobre 2024)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-a15-clinique" data-title="Loi de Pareto — Reconnaître une tuberculose pulmonaire">
<p class="ratio" data-cover="a15-pa-1,a15-pa-2,a15-pa-3,a15-pa-5,a15-pa-6,a15-pa-7"></p><ul><li>Une toux prolongée, des sueurs, une perte de poids et une origine à risque évoquent la tuberculose.</li><li>La radiographie montre un infiltrat apical ou une cavité.</li><li>La PCR et la culture des expectorations prouvent le diagnostic.</li><li>Le test immunologique ne prouve ni n’exclut la maladie.</li></ul>
</template>
<template data-pop="pareto-a15-traitement" data-title="Loi de Pareto — Traiter une tuberculose pulmonaire">
<p class="ratio" data-cover="a15-pa-8,a15-pa-9,a15-pa-10,a15-pa-11,a15-pa-12"></p><ul><li>On isole le patient et on déclare le cas.</li><li>Le traitement associe 2 mois de HRZE, puis 4 mois d’isoniazide et de rifampicine, avec de la pyridoxine.</li><li>Une résistance à la rifampicine impose l’avis d’un spécialiste.</li><li>On surveille les transaminases, la vision et les interactions.</li></ul>
</template>
<template data-pop="pareto-a15-examens" data-title="Loi de Pareto — Examens de la tuberculose">
<p class="ratio" data-cover="a15-e-1,a15-e-2"></p><ul><li>On recueille deux expectorations à une heure d’intervalle.</li><li>La PCR est rapide, et la culture reste la référence.</li><li>La microscopie mesure la contagiosité.</li></ul>
</template>
<template data-pop="pareto-a15-pharma" data-title="Loi de Pareto — Pharmacologie antituberculeuse">
<p class="ratio" data-cover="a15-p-1,a15-p-2,a15-p-3"></p><ul><li>Les doses sont de 5 mg/kg pour l’isoniazide, 10 pour la rifampicine, 25 pour le pyrazinamide et 15 pour l’éthambutol.</li><li>La rifampicine provoque de nombreuses interactions.</li><li>L’éthambutol menace la vision.</li></ul>
</template>
