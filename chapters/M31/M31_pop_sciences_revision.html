<template data-pop="m31-science-reading" data-title="ANCA : un anticorps soutient une hypothèse, pas toute la décision"><p>Les anticorps anti-PR3 ou anti-MPO peuvent soutenir une vascularite dans un tableau compatible. Une positivité isolée n’établit pas toute la maladie ni son activité.</p><p>L’évaluation recherche les organes atteints et la gravité. L’urine, la fonction rénale, la respiration, l’imagerie et les prélèvements répondent à des questions différentes. Les diagnostics infectieux et d’autres causes sont aussi considérés.</p><p>Une biopsie pauci-immune décrit des dépôts peu abondants. Ce mot n’affirme pas une inflammation légère. Des lésions importantes peuvent justifier une prise en charge urgente selon le contexte.</p><p>Les décisions thérapeutiques intègrent le tableau, les preuves et les risques. Une variation de titre seule ne remplace pas l’appréciation d’une rechute clinique.</p><div class="key"><b>À retenir.</b> Le résultat répond à une question précise. Son interprétation exige les autres informations du patient.</div></template>
<template data-pop="pareto-m31-sciences-revision" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="m31-sa,m31-si,m31-sg">Les parties reliées ci-dessous expliquent les mécanismes essentiels à cette synthèse.</p><ul><li>Le calibre et le siège expliquent le signe. Un échantillon négatif ne représente pas nécessairement tout le réseau vasculaire.</li><li>Une réponse immunitaire peut s’amplifier dans la paroi. Sa preuve et son activité nécessitent davantage qu’un anticorps positif.</li><li>Une association ne prouve pas une cause. La concordance moléculaire, fonctionnelle et clinique détermine l’utilité d’un test.</li></ul></template>
