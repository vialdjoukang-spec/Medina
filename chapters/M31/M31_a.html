<section class="ilot" id="m31-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 74 ans se plaint depuis trois semaines de céphalées temporales droites inhabituelles, d’une douleur de la mâchoire qui l’oblige à s’interrompre en mâchant, et de douleurs des épaules au réveil. Ce matin, elle a vu « un rideau noir » pendant quelques minutes devant l’œil droit. La CRP est à 86 mg/L. La question qui structure le cours est double : <b>face à ce tableau, combien de temps peut-on attendre avant de traiter ?</b> — aucun délai, car l’EULAR 2025 demande de débuter les corticostéroïdes sans attendre les examens de confirmation lorsque la suspicion est forte — et, plus largement, <b>comment reconnaître une vascularite, en déterminer le type selon la taille des vaisseaux atteints, la prouver et la traiter sans nuire par les corticostéroïdes ?</b></p>
<p>À la fin de ce cours, le médecin assistant sait classer les vascularites selon la nomenclature de Chapel Hill, reconnaître les signes d’appel (fièvre prolongée, purpura vasculaire, mononévrite multiple, glomérulonéphrite, hémorragie alvéolaire, claudication de la mâchoire), débuter sans délai le traitement de l’artérite à cellules géantes, interpréter les ANCA, identifier un syndrome pneumo-rénal, reconnaître une maladie de Kawasaki chez l’enfant, et conduire les traitements d’induction et d’entretien selon les recommandations européennes et l’information professionnelle suisse.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="m31-paroi">paroi artérielle et la taille des vaisseaux</button>, les <button class="w" data-k="m31-anca">ANCA (anticorps anti-cytoplasme des polynucléaires neutrophiles)</button> et le <button class="w" data-k="m31-purpura">purpura vasculaire (infiltré, déclive)</button>.</div>
</section>

<section class="ilot" id="m31-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Une vascularite est une <b>inflammation de la paroi des vaisseaux</b>, qui peut aboutir à leur rétrécissement, leur occlusion (ischémie, infarctus), leur rupture (hémorragie, anévrisme) ou à une fuite (œdème, purpura). Elle est <b>primitive</b>, maladie autonome, ou <b>secondaire</b> à une infection, un médicament, un cancer ou une connectivite comme le lupus ou la polyarthrite rhumatoïde.</p>
<p>La <b>nomenclature de Chapel Hill 2012</b> classe les vascularites selon le calibre des vaisseaux <b>principalement</b> atteints ; ce calibre explique la clinique.</p>
<table class="t"><tr><th>Calibre</th><th>Vascularites</th><th>Signes typiques</th></tr>
<tr><td><b>Gros vaisseaux</b> (aorte et ses branches)</td><td>Artérite à cellules géantes (maladie de Horton), artérite de Takayasu</td><td>Claudication (mâchoire, membres), abolition des pouls, souffles, asymétrie tensionnelle, anévrisme aortique</td></tr>
<tr><td><b>Vaisseaux de moyen calibre</b> (artères viscérales)</td><td>Périartérite noueuse, maladie de Kawasaki</td><td>Infarctus viscéraux, mononévrite multiple, nodules sous-cutanés, micro-anévrismes, anévrismes coronaires</td></tr>
<tr><td><b>Petits vaisseaux, associés aux ANCA</b></td><td>Granulomatose avec polyangéite, polyangéite microscopique, granulomatose éosinophilique avec polyangéite</td><td>Glomérulonéphrite, hémorragie alvéolaire, atteinte oto-rhino-laryngée, purpura, mononévrite</td></tr>
<tr><td><b>Petits vaisseaux, à complexes immuns</b></td><td>Vascularite à IgA (purpura rhumatoïde), cryoglobulinémique, anti-membrane basale glomérulaire, urticarienne hypocomplémentémique</td><td>Purpura palpable, arthralgies, douleurs abdominales, néphrite</td></tr>
<tr><td><b>Calibre variable</b></td><td>Maladie de Behçet, syndrome de Cogan</td><td>Aphtes buccaux et génitaux, uvéite, thromboses veineuses</td></tr>
<tr><td>Secondaires ou d’un seul organe</td><td>Vascularites du lupus, de l’hépatite B (périartérite) ou C (cryoglobulinémie), médicamenteuses, vascularite cutanée isolée, vascularite primitive du système nerveux central</td><td>Selon la cause</td></tr></table>
<div class="trap"><span class="k">Piège</span>Le calibre désigne les vaisseaux <b>principalement</b> atteints, non exclusivement : une vascularite des gros vaisseaux peut toucher des artères de moyen calibre, comme l’artère ophtalmique dans l’artérite à cellules géantes, et une vascularite à ANCA peut toucher des artères moyennes. La classification oriente ; elle n’enferme pas.</div>
<h3>1.1 Classification et diagnostic</h3>
<p>Les critères de classification ACR/EULAR 2022 sont destinés à la recherche : ils s’appliquent <b>après</b> qu’une vascularite des petits ou moyens vaisseaux a été diagnostiquée et que ses imitateurs ont été exclus. L’EULAR 2025 le rappelle explicitement : les critères de classification ne servent pas au diagnostic, qui repose sur les signes et symptômes et, dans l’artérite à cellules géantes et l’artérite de Takayasu, sur la confirmation par l’imagerie ou la biopsie. Leur connaissance reste utile, car ils résument les éléments les plus discriminants (§ 13).</p>
</section>

<section class="ilot" id="m31-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les vascularites sont rares, mais leur fréquence varie de plusieurs ordres de grandeur d’une forme à l’autre. L’artérite à cellules géantes, maladie du sujet âgé, est la plus fréquente de l’adulte ; l’artérite de Takayasu est exceptionnelle en Europe. Le tableau compare les incidences européennes ou mondiales publiées, exprimées dans l’unité de chaque étude.</p>
<table class="t"><tr><th>Vascularite</th><th>Incidence annuelle</th><th>Source</th></tr>
<tr><td>Artérite à cellules géantes</td><td>10 pour 100 000 personnes de plus de 50 ans ; 21,6 en Scandinavie, 7,3 dans le reste de l’Europe</td><td>Méta-analyse de 107 études, 2021</td></tr>
<tr><td>Artérite à cellules géantes, Italie du Nord</td><td>8,3 pour 100 000 personnes de plus de 50 ans : forme crânienne 6,1, forme des gros vaisseaux 3,4</td><td>Étude de population de Reggio d’Émilie, 2021</td></tr>
<tr><td>Artérite de Takayasu</td><td>0,5 à 0,8 par million d’habitants ; prévalence britannique de 7,5 par million</td><td>Études de population italienne et britannique, 2021</td></tr>
<tr><td>Vascularites à ANCA</td><td>17,2 par million : granulomatose avec polyangéite 9,0, polyangéite microscopique 5,9, granulomatose éosinophilique 1,7</td><td>Méta-analyse de 25 études, 2022</td></tr>
<tr><td>Maladie de Kawasaki, Suisse</td><td>8,4 pour 100 000 enfants de moins de 5 ans</td><td>Cohorte nationale suisse 2013–2017, Swiss Medical Weekly 2022</td></tr>
<tr><td>Vascularite à IgA</td><td>Vascularite systémique la plus fréquente de l’enfant</td><td>SHARE 2019</td></tr></table>
<p><b>Lecture.</b> Ces chiffres orientent la probabilité avant tout examen. Une céphalée récente chez une femme de 74 ans fait évoquer d’abord une artérite à cellules géantes, de l’ordre de cent fois plus fréquente qu’une artérite de Takayasu. L’incidence de l’artérite à cellules géantes augmente avec la latitude, d’où les taux scandinaves deux fois plus élevés. L’étude italienne rappelle aussi que la forme des gros vaisseaux représente environ un tiers des cas : elle échappe au diagnostic si l’on ne cherche que la forme crânienne. Aucune étude de population n’a mesuré ces incidences en Suisse ; une enquête nationale du groupe d’étude SCQM y montre toutefois que l’échographie et la biopsie temporale sont rapidement accessibles, l’échographie étant l’examen le plus utilisé par 83 % des spécialistes interrogés.</p>
<p>Le pronostic se lit ensuite forme par forme. Le tableau rassemble les données d’évolution des recommandations européennes et du protocole national français de 2019 sur les vascularites nécrosantes.</p>
<table class="t"><tr><th>Vascularite</th><th>Évolution</th><th>Source</th></tr>
<tr><td>Artérite à cellules géantes</td><td>Rechute chez 32 %, 44 % et 47 % des patients à 1, 2 et 5 ans ; perte visuelle permanente passée de 18,7 % et 26,8 % à 11,5 % et 12,7 % grâce aux filières rapides</td><td>EULAR 2025</td></tr>
<tr><td>Granulomatose avec polyangéite et polyangéite microscopique</td><td>Mortalité 2,6 fois supérieure à celle de la population ; décès de la première année dus à l’infection dans 48 % des cas, à la vascularite active dans 19 %</td><td>EULAR 2022 (535 patients)</td></tr>
<tr><td>Granulomatose avec polyangéite</td><td>Survie à 10 ans de 75 % ; rechute chez la moitié des patients dans les 5 ans</td><td>Protocole national français 2019</td></tr>
<tr><td>Polyangéite microscopique</td><td>Rechute chez environ un tiers des patients dans les 5 ans ; survie à 10 ans de 85 % dans les séries récentes</td><td>Protocole national français 2019</td></tr>
<tr><td>Granulomatose éosinophilique avec polyangéite</td><td>Rémission dans 90 % des cas, rechute chez 60 % lors de la décroissance des corticostéroïdes ; survie à 10 ans de 85 %</td><td>Protocole national français 2019</td></tr>
<tr><td>Périartérite noueuse</td><td>Sur 348 patients suivis 68 mois : rechute 21,8 %, décès 24,7 %</td><td>Groupe français d’étude des vascularites</td></tr></table>
<p><b>Pronostic.</b> Ces chiffres expliquent la stratégie : la première cause de décès précoce des vascularites à ANCA est l’<b>infection</b> liée au traitement, d’où l’effort de réduction des corticostéroïdes et la prophylaxie anti-infectieuse. Les rechutes fréquentes de la granulomatose avec polyangéite justifient le traitement d’entretien prolongé de l’îlot 11. L’artérite à cellules géantes menace surtout la vision, rechute souvent et expose aux complications de la corticothérapie prolongée ; c’est pourquoi l’EULAR 2025 vise une rémission sans corticostéroïdes.</p>
</section>

<section class="ilot" id="m31-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les mécanismes diffèrent selon le groupe, ce qui explique des traitements différents.</p>
<div class="two">
<div class="card"><h4>Vascularites des gros vaisseaux : immunité cellulaire granulomateuse</h4><p>Des cellules dendritiques de l’adventice, activées, recrutent des lymphocytes T CD4 (voies Th1, avec l’interféron gamma, et Th17) et des macrophages. Ces derniers forment des <b>granulomes</b> avec des <b>cellules géantes</b> multinucléées dans la média, détruisent la limitante élastique interne et produisent des facteurs de croissance qui épaississent l’intima : la lumière se rétrécit, d’où l’ischémie. L’<b>IL-6</b> contribue à la fièvre, à l’altération de l’état général et à la CRP élevée : c’est la cible du tocilizumab.</p></div>
<div class="card"><h4>Vascularites à ANCA : neutrophiles activés par des auto-anticorps</h4><p>Une infection ou une autre agression « amorce » les neutrophiles, qui exposent à leur surface la protéinase 3 (PR3) ou la myéloperoxydase (MPO). Les ANCA s’y fixent et activent ces neutrophiles, qui adhèrent à l’endothélium des capillaires et le détruisent (nécrose fibrinoïde). La voie alterne du complément amplifie le phénomène par le fragment C5a, qui attire et active d’autres neutrophiles. Le récepteur C5aR1 était la cible de l’avacopan, dont l’autorisation a été révoquée dans l’Union européenne le 4 août 2026 et sera révoquée en Suisse au 30 novembre 2026 (<button class="w" data-k="m31-d-avaco">décisions européenne et suisse</button>). Les lymphocytes B producteurs d’ANCA sont la cible du rituximab.</p></div>
<div class="card"><h4>Vascularites à complexes immuns</h4><p>Des complexes antigène-anticorps (IgA dans le purpura rhumatoïde, cryoglobulines dans l’hépatite C) se déposent dans la paroi des petits vaisseaux, activent le complément et attirent les neutrophiles : leucocytoclasie et purpura. La biopsie montre des <b>dépôts</b> en immunofluorescence, à l’inverse des vascularites à ANCA, dites « pauci-immunes ».</p></div>
<div class="card"><h4>Périartérite noueuse et maladie de Kawasaki</h4><p>La périartérite noueuse associe nécrose segmentaire des artères de moyen calibre, micro-anévrismes et thromboses ; l’hépatite B en est une cause classique. Chez l’enfant jeune, un déficit en adénosine désaminase 2 (DADA2) peut en mimer la présentation. La maladie de Kawasaki est une vascularite aiguë de l’enfant dont la principale menace est l’atteinte des artères coronaires.</p></div></div>

<div class="key"><b>Corrélation physiopathologie → clinique et traitement.</b> Rétrécissement des grosses artères : claudication et abolition des pouls. Nécrose des capillaires glomérulaires et alvéolaires : hématurie et hémoptysie. Complexes immuns dans les capillaires cutanés : purpura palpable des jambes. L’IL-6 des vascularites des gros vaisseaux justifie le tocilizumab ; les lymphocytes B producteurs d’ANCA justifient le rituximab. Le rôle biologique d’une voie ne suffit pas à établir le bénéfice clinique d’un médicament : l’avacopan en est l’exemple.</div>
</section>

<section class="ilot" id="m31-4"><h2><span class="n">4</span>Reconnaître une vascularite</h2>
<p>Une vascularite se présente rarement par un signe unique. Elle associe habituellement un <b>syndrome inflammatoire</b> (fièvre prolongée, amaigrissement, fatigue, CRP élevée) et une <b>atteinte d’organes</b> dont la combinaison est évocatrice.</p>
<table class="t"><tr><th>Signe d’appel</th><th>Vascularite évoquée</th></tr>
<tr><td>Céphalées récentes après 50 ans, claudication de la mâchoire, troubles visuels</td><td>Artérite à cellules géantes</td></tr>
<tr><td>Douleurs inflammatoires des épaules et des hanches après 50 ans</td><td>Pseudo-polyarthrite rhizomélique (± artérite)</td></tr>
<tr><td>Différence de pression entre les bras, pouls absent, claudication d’un bras, souffle sous-clavier chez une femme jeune</td><td>Takayasu</td></tr>
<tr><td><button class="w" data-k="m31-purpura">Purpura infiltré, déclive</button></td><td>Petits vaisseaux : vascularite à IgA, cryoglobulinémie, vascularites à ANCA</td></tr>
<tr><td><button class="w" data-k="m31-mono">Mononévrite multiple</button> (steppage brutal, main tombante)</td><td>Périartérite noueuse, vascularites à ANCA, cryoglobulinémie</td></tr>
<tr><td>Hématurie avec cylindres, protéinurie, créatinine qui monte</td><td><button class="w" data-k="m31-gnrp">Glomérulonéphrite rapidement progressive</button> : ANCA, anti-membrane basale, IgA</td></tr>
<tr><td>Hémoptysie, anémie, infiltrats alvéolaires bilatéraux</td><td>Hémorragie alvéolaire : syndrome pneumo-rénal</td></tr>
<tr><td>Rhinite croûteuse, épistaxis, sinusite rebelle, otite séreuse, nez en selle</td><td>Granulomatose avec polyangéite</td></tr>
<tr><td>Asthme tardif, éosinophilie, polypose</td><td>Granulomatose éosinophilique avec polyangéite</td></tr>
<tr><td>Fièvre d’au moins 5 jours chez un jeune enfant, conjonctivite, modifications des lèvres et de la bouche, éruption</td><td>Maladie de Kawasaki</td></tr>
<tr><td>Aphtes buccaux récidivants, aphtes génitaux, uvéite</td><td>Maladie de Behçet</td></tr></table>
<div class="alert"><b>Avant de conclure à une vascularite primitive, éliminer ses imitateurs</b> : <b>endocardite infectieuse</b> (hémocultures, échocardiographie : fièvre, purpura, glomérulonéphrite, emboles), embols de cholestérol, myxome de l’oreillette, syndrome des antiphospholipides, infections (hépatites B et C, VIH, syphilis), cocaïne coupée au lévamisole, lymphome intravasculaire, dysplasie fibromusculaire et syndromes génétiques comme l’Ehlers-Danlos vasculaire pour les atteintes artérielles. L’EULAR 2022 rappelle que des ANCA peuvent accompagner d’autres maladies inflammatoires, des infections ou une prise médicamenteuse.</div>
</section>
