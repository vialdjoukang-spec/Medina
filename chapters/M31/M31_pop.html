<template data-pop="m31-paroi" data-title="Paroi artérielle et calibre"><p>Trois tuniques : intima, média, adventice. <b>Gros</b> : aorte et branches principales (sous-clavières, carotides, temporales). <b>Moyens</b> : artères viscérales principales et leurs branches (rénales, mésentériques, coronaires). <b>Petits</b> : artérioles, capillaires, veinules, y compris glomérulaires et alvéolaires. Le calibre atteint prédit la sémiologie.</p></template>
<template data-pop="m31-anca" data-title="ANCA"><p>Anticorps dirigés contre des enzymes des granules des neutrophiles : protéinase 3 (PR3) et myéloperoxydase (MPO). L’EULAR 2022 recommande leur recherche par immunoessai spécifique de haute qualité. Anti-PR3 : surtout granulomatose avec polyangéite ; anti-MPO : polyangéite microscopique, granulomatose éosinophilique. Des ANCA s’observent aussi dans d’autres maladies inflammatoires, des infections ou après certains médicaments : le diagnostic ne repose jamais sur la sérologie seule.</p></template>
<template data-pop="m31-purpura" data-title="Purpura vasculaire"><p>Taches rouges ou violacées qui <b>ne s’effacent pas à la vitropression</b> (sang extravasé), <b>infiltrées</b> (palpables), <b>déclives</b> (jambes, fesses), parfois nécrotiques. Elles traduisent une vascularite des petits vaisseaux cutanés. À distinguer du purpura <b>plan</b> thrombopénique (pétéchies non infiltrées, muqueuses). Un purpura fébrile extensif impose d’éliminer un purpura fulminans méningococcique.</p></template>
<template data-pop="m31-mono" data-title="Mononévrite multiple"><p>Atteinte successive, asymétrique, de troncs nerveux distincts (fibulaire commun : pied tombant ; radial : main tombante ; ulnaire), brutale et douloureuse, par ischémie des <i>vasa nervorum</i>. L’électroneuromyogramme montre une atteinte axonale multifocale ; la biopsie neuromusculaire peut prouver la vascularite. Évocatrice de périartérite noueuse, de vascularites à ANCA et de cryoglobulinémie.</p></template>
<template data-pop="m31-gnrp" data-title="Glomérulonéphrite rapidement progressive"><p>Perte rapide de la fonction rénale en quelques semaines, avec hématurie glomérulaire, cylindres hématiques et protéinurie ; histologiquement, prolifération extracapillaire en croissants. Trois mécanismes : pauci-immun (ANCA), anti-membrane basale (dépôts linéaires), complexes immuns (IgA, lupus, post-infectieux). C’est une urgence néphrologique : biopsie et traitement en quelques jours.</p></template>
<template data-pop="m31-bvas" data-title="Score BVAS"><p>Birmingham Vasculitis Activity Score : relevé pondéré des manifestations actives par organe (général, peau, muqueuses et yeux, oto-rhino-laryngé, thorax, cœur, abdomen, rein, système nerveux). Un score nul correspond à l’absence d’activité ; dans MAINRITSAN, la rechute majeure était définie par un score supérieur à 0 avec atteinte d’au moins un organe majeur.</p></template>
<template data-pop="m31-echo" data-title="Échographie de l’artérite à cellules géantes"><p><b>Signe du halo</b> : épaississement hypoéchogène homogène de la paroi, en coupe transversale et longitudinale. <b>Signe de compression</b> : la paroi reste visible lors de la compression de l’artère par la sonde. L’EULAR 2023 en fait l’examen de première intention et inclut les artères axillaires dans l’examen standard. Un halo à l’échographie vaut +5 dans les critères de classification de 2022. La corticothérapie fait régresser les signes : l’examen se fait vite, dans une filière rapide, par un opérateur entraîné.</p></template>
<template data-pop="m31-d-toci" data-title="Tocilizumab"><div class="lab">Mécanisme</div><p>Anticorps anti-récepteur de l’IL-6, soluble et membranaire.</p><div class="lab">Preuve</div><p>GiACTA (2017, 251 patients) : rémission soutenue sans corticostéroïdes à 52 semaines chez 56 % des patients sous tocilizumab hebdomadaire et 53 % sous tocilizumab toutes les 2 semaines, contre 14 % et 18 % sous placebo avec décroissance de prednisone sur 26 ou 52 semaines.</p><div class="lab">Posologie suisse (artérite à cellules géantes)</div><p>Forme sous-cutanée seulement : 162 mg toutes les 2 semaines pour une première poussée, chaque semaine si le tableau l’exige ; chaque semaine pour une forme récidivante. Le traitement commence après le début des corticostéroïdes, à une dose de prednisone ne dépassant pas 60 mg par jour ; aucun effet sur les manifestations oculaires n’est démontré.</p><div class="lab">Surveillance</div><p>Neutrophiles, transaminases, lipides ; CRP non utilisable ; prudence en cas d’ulcère ou de diverticulite. Contre-indiqué avec un anti-TNF et jusqu’à 1 mois après.</p><p class="small">Information professionnelle suisse Actemra®, Swissmedic (AIPS), version 09-2026, consultée le 08.10.2026.</p></template>
<template data-pop="m31-d-ritux" data-title="Rituximab dans les vascularites"><p>Anti-CD20 : déplétion des lymphocytes B. RAVE (2010) : 375 mg/m² par semaine pendant 4 semaines, non inférieur au cyclophosphamide oral pour l’induction (rémission sans prednisone à 6 mois chez 64 % contre 53 %), possiblement supérieur dans les rechutes. MAINRITSAN (2014) : 500 mg aux jours 0 et 14 puis à 6, 12 et 18 mois ; rechutes majeures à 28 mois chez 5 % contre 29 % sous azathioprine. Le schéma suisse d’entretien reprend ce calendrier, puis tous les 6 mois selon l’évaluation clinique. Surveillance : immunoglobulines, neutrophiles, hépatite B, vaccinations terminées au moins 4 semaines avant la première perfusion.</p><p class="small">Information professionnelle suisse MabThera®, Swissmedic (AIPS), version 12-2025.</p></template>
<template data-pop="m31-d-cyclo" data-title="Cyclophosphamide"><p>Agent alkylant activé dans le foie ; un de ses métabolites, l’acroléine, est toxique pour la vessie. L’information professionnelle suisse l’autorise dans les maladies auto-immunes d’évolution menaçante, dont les vascularites systémiques, sans fixer de schéma propre : dans l’essai CYCLOPS (2009), des bolus de 15 mg/kg toutes les 2 à 3 semaines ont induit la rémission aussi bien que la voie orale quotidienne, avec une dose cumulée environ deux fois plus faible. L’information professionnelle exige le mesna au-delà de 10 mg/kg par voie intraveineuse, une hydratation suffisante, et une réduction de 50 % de la dose si le débit de filtration est inférieur à 10 mL/min. Contraception, préservation de la fertilité, surveillance de la formule sanguine.</p><p class="small">Information professionnelle suisse Endoxan®, Swissmedic (AIPS) ; de Groot K. et al., Annals of Internal Medicine 2009.</p></template>
<template data-pop="m31-d-avaco" data-title="Avacopan — décisions européenne et suisse 2026"><p>L’avacopan bloque C5aR1. Son mécanisme biologique ne démontre pas son bénéfice clinique.</p><p><b>Suisse</b> : dans une communication approuvée par Swissmedic le 09.09.2026, Swissmedic juge le rapport bénéfice-risque négatif, en raison de violations significatives des bonnes pratiques cliniques dans l’étude ADVOCATE et de préoccupations croissantes sur l’hépatotoxicité. L’autorisation de Tavneos® sera <b>révoquée au 30.11.2026</b> ; aucun nouveau patient ne doit être traité hors étude, et les patients traités doivent être contactés pour arrêter le traitement et discuter des alternatives.</p><p><b>Union européenne</b> : la Commission européenne a révoqué l’autorisation le 4 août 2026, après l’avis du comité scientifique de l’Agence européenne des médicaments du 25 juin 2026 ; elle signale des atteintes hépatiques médicamenteuses et des syndromes de disparition des canaux biliaires, parfois mortels, surtout dans les 3 premiers mois, et prévoit une surveillance hépatique des patients déjà traités.</p><p><b>Choix retenu</b> : la position suisse s’applique pour l’examen fédéral ; elle concorde avec la décision européenne sur le fond, avec une date d’effet propre.</p><p class="small">Swissmedic, communication importante relative à la sécurité des médicaments Tavneos® (avacopan), 09.09.2026 ; Agence européenne des médicaments, Tavneos, procédure de réévaluation, 2026 ; consultées le 08.10.2026.</p></template>
<template data-pop="m31-d-kawa" data-title="Traitement de la maladie de Kawasaki"><p>SHARE 2019 : traitement dès le diagnostic, forme complète ou incomplète ; immunoglobulines intraveineuses 2 g/kg en une perfusion ; aspirine 30 à 50 mg/kg par jour jusqu’à 48 heures d’apyrexie, puis 3 à 5 mg/kg par jour. Corticostéroïdes dans les formes sévères : résistance aux immunoglobulines (fièvre ou inflammation persistante 48 heures après la perfusion), score de Kobayashi d’au moins 5, syndrome d’activation macrophagique, choc, âge inférieur à 1 an, anévrismes coronaires ou périphériques. Infliximab si l’inflammation persiste malgré immunoglobulines, aspirine et corticostéroïdes. Anévrismes géants (diamètre interne d’au moins 8 mm ou score Z d’au moins 10) : anticoagulation par antivitamine K en plus de l’aspirine. Échocardiographie au diagnostic, à 2 semaines et à 6 à 8 semaines.</p></template>
<template data-pop="m31-ch-gca" data-title="Artérite à cellules géantes et pseudo-polyarthrite : position suisse"><p>Les recommandations européennes et les autorisations suisses ne se recouvrent pas entièrement.</p><table class="t"><tr><th>Point</th><th>EULAR 2025</th><th>Suisse (information professionnelle, Swissmedic)</th></tr><tr><td>Tocilizumab, artérite</td><td>Traitement adjuvant à envisager, surtout forme réfractaire ou récidivante ou risque cortisonique élevé</td><td>Autorisé : 162 mg toutes les 2 semaines pour une première poussée, chaque semaine pour une récidive ; début après les corticostéroïdes, prednisone ≤ 60 mg par jour</td></tr><tr><td>Upadacitinib, artérite</td><td>Alternative au tocilizumab</td><td>Autorisé seulement dans la forme <b>récidivante</b>, 15 mg par jour ; après 65 ans, tabac ou risque de cancer, seulement sans alternative</td></tr><tr><td>Anti-récepteur de l’IL-6, pseudo-polyarthrite</td><td>Sarilumab de préférence, tocilizumab en alternative, dans les formes récidivantes</td><td>Ni le sarilumab (autorisé dans la polyarthrite rhumatoïde) ni le tocilizumab ne sont autorisés dans cette indication : usage hors autorisation, avec demande préalable de prise en charge</td></tr><tr><td>Corticothérapie de la pseudo-polyarthrite</td><td>15 à 25 mg, arrêt visé en 1 an</td><td>Recommandations germano-austro-suisses 2026 cosignées par la Société suisse de rhumatologie : 15 à 25 mg après confirmation du diagnostic, décroissance sur 4 à 12 mois</td></tr></table><p><b>Choix retenu pour l’examen fédéral</b> : la stratégie suit l’EULAR 2025 et les recommandations germano-austro-suisses ; la prescription respecte l’autorisation suisse, et tout usage hors autorisation se signale comme tel.</p><p class="small">Information professionnelle suisse Actemra® (09-2026), Rinvoq®, Kevzara® ; Mukhtyar C. B. et al., Annals of the Rheumatic Diseases 2026 ; Buttgereit F. et al., Rheumatology 2026 ; consultées le 08.10.2026.</p></template>
<template data-pop="pareto-m31-clin" data-title="Pareto — Classification et grands tableaux"><p class="ratio" data-cover="m31-0,m31-1,m31-2,m31-3,m31-4,m31-5,m31-6,m31-7,m31-8,m31-9"></p><ul><li>Chapel Hill 2012 : gros (artérite à cellules géantes, Takayasu), moyens (périartérite, Kawasaki), petits à ANCA (granulomatose avec polyangéite, polyangéite microscopique, éosinophilique), petits à complexes immuns (IgA, cryoglobulinémie, anti-membrane basale), variables (Behçet).</li><li>Incidences : artérite à cellules géantes 10 pour 100 000 après 50 ans (21,6 en Scandinavie) ; vascularites à ANCA 17,2 par million ; Takayasu 0,5 à 0,8 par million.</li><li>Anti-PR3 dans 85 % des granulomatoses avec polyangéite systémiques ; anti-MPO dans 60 % des polyangéites microscopiques.</li><li>Signes d’appel : inflammation + purpura infiltré, mononévrite multiple, glomérulonéphrite, hémorragie alvéolaire, claudication, pouls absents ; éliminer l’endocardite.</li><li>Artérite à cellules géantes : plus de 50 ans, céphalée, claudication de la mâchoire, hyperesthésie du cuir chevelu, CRP élevée ; cécité ; corticostéroïdes immédiats, avis dans les 24 heures, échographie temporale et axillaire en première intention.</li><li>Pseudo-polyarthrite : pas d’urgence, corticostéroïdes après confirmation, pas d’essai diagnostique.</li><li>Takayasu : femme jeune, asymétrie tensionnelle, pouls absent ; IRM.</li><li>Anti-PR3 : granulomatose avec polyangéite ; anti-MPO : polyangéite microscopique ; éosinophilique : asthme, éosinophiles, cœur, ANCA chez 30 %.</li><li>Kawasaki : fièvre ≥ 5 jours + 4/5 signes, coronaires ; Suisse : 8,4/100 000 enfants de moins de 5 ans.</li><li>IgA : purpura, arthralgies, abdomen, néphrite ; urines et pression artérielle 6–12 mois.</li></ul></template>
<template data-pop="pareto-m31-tt" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="m31-10,m31-11"></p><ul><li>Urgences : symptôme visuel, syndrome pneumo-rénal, ischémie mésentérique, myocardite éosinophilique, infection.</li><li>Artérite à cellules géantes : prednisone 40–60 mg, 15–20 mg à 2–3 mois, arrêt en 12–18 mois ; tocilizumab ou upadacitinib, méthotrexate ; pas d’aspirine systématique.</li><li>Pseudo-polyarthrite : prednisone 15–25 mg, 10 mg à 1–2 mois.</li><li>Périartérite noueuse : prednisone 1 mg/kg (≤ 60 mg) ; score à cinq facteurs nul : corticostéroïdes seuls ; score ≥ 1 : cyclophosphamide ; hépatite B : antiviral, échanges plasmatiques, corticothérapie brève.</li><li>ANCA : prednisolone 50–75 mg, schéma réduit PEXIVAS ; rituximab ou cyclophosphamide ; échanges plasmatiques si créatinine &gt; 300 µmol/L ; entretien rituximab 24–48 mois ; cotrimoxazole ; avacopan retiré.</li><li>Kawasaki : immunoglobulines 2 g/kg + aspirine 30–50 puis 3–5 mg/kg.</li></ul></template>
<template data-pop="pareto-m31-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="m31-12,m31-13"></p><ul><li>Suivi : activité, toxicité, infections ; ANCA ne guident pas seuls ; CRP ininterprétable sous tocilizumab.</li><li>Artérite à cellules géantes (2022) : ≥ 50 ans, score ≥ 6 (biopsie ou halo +5, vitesse de sédimentation ≥ 50 ou CRP ≥ 10 +3, perte visuelle +3, autres +2).</li><li>Granulomatose avec polyangéite ≥ 5 ; polyangéite microscopique ≥ 5 ; éosinophilique ≥ 6.</li><li>Kawasaki : fièvre ≥ 5 jours + 4 des 5 critères. IgA : purpura obligatoire + 1 critère.</li></ul></template>
<template data-pop="pareto-m31-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="m31-e-1,m31-e-2,m31-e-3,m31-e-4"></p><ul><li>Urines chez tout suspect ; ANCA par immunoessai anti-PR3 et anti-MPO ; complément normal dans les vascularites à ANCA.</li><li>Cryoglobulines prélevées à 37 °C ; sérologies VHB, VHC ; hémocultures et échocardiographie si fièvre ; anti-membrane basale si syndrome pneumo-rénal.</li><li>Échographie : halo et compression, première intention, sensibilité 88 % et spécificité 96 % (93 % de sensibilité si axillaires explorées) ; tomographie par émission de positons ou IRM ; angiographie : micro-anévrismes.</li><li>Histologie : cellules géantes (segmentaire) ; nécrose pauci-immune (ANCA) ; dépôts d’IgA ; dépôts linéaires d’IgG (anti-membrane basale).</li></ul></template>
<template data-pop="pareto-m31-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="m31-p-1,m31-p-2,m31-p-3"></p><ul><li>Corticostéroïdes pour tous, réduction rapide ; tocilizumab (gros vaisseaux), rituximab (ANCA), cyclophosphamide (formes graves), mépolizumab ou benralizumab (éosinophilique non menaçante).</li><li>Tocilizumab suisse : 162 mg toutes les 2 semaines (première poussée) ou chaque semaine (récidive).</li><li>Rituximab : induction 375 mg/m² × 4 ; entretien 500 mg × 2 puis à 6, 12, 18 mois.</li><li>Risques : infections (cotrimoxazole, hépatite B, tuberculose), hypogammaglobulinémie, cystite et infertilité (cyclophosphamide), CRP masquée (tocilizumab), foie après avacopan.</li></ul></template>

<template data-pop="m31-d-cs" data-title="Corticostéroïdes dans les vascularites"><div class="lab">Place</div><p>Les corticostéroïdes induisent la rémission de toutes les vascularites, car ils éteignent rapidement l’inflammation de la paroi. Leur dose dépend de la maladie : prednisone 40 à 60 mg par jour dans l’artérite à cellules géantes et l’artérite de Takayasu, 15 à 25 mg dans la pseudo-polyarthrite rhizomélique (EULAR 2025), 50 à 75 mg de prednisolone selon le poids dans les vascularites à ANCA avec le schéma réduit de l’essai PEXIVAS (EULAR 2022). Les bolus de méthylprednisolone se réservent aux menaces d’organe. La réduction commence dès la rémission : la toxicité cumulée, surtout infectieuse, pèse sur le pronostic autant que la maladie.</p><div class="lab">Effets indésirables (information professionnelle suisse de la prednisone)</div><p>Le risque reste faible pour une cure courte. Un traitement prolongé expose au syndrome de Cushing, au diabète stéroïdien, à l’hyperlipidémie, à l’ostéoporose avec fractures vertébrales, surtout après la ménopause, à la myopathie, à l’ostéonécrose aseptique et à des troubles psychiques allant jusqu’à la psychose. Au-delà de 2 semaines, l’inhibition de l’ACTH peut atrophier les surrénales pour un an ou davantage : le traitement ne s’interrompt jamais brutalement après 8 à 10 jours, et un stress majeur (chirurgie, infection grave) impose une couverture supplémentaire.</p><p class="small">EULAR 2025 (Mukhtyar et al.) ; EULAR 2022 (Hellmich et al.) ; information professionnelle suisse Prednisone Streuli® et Solu-Medrol®, Swissmedic (AIPS), consultées le 08.10.2026.</p></template>
<template data-pop="m31-d-imm" data-title="Immunosuppresseurs conventionnels dans les vascularites"><p>Ces médicaments agissent lentement ; ils ne servent pas à éteindre une poussée menaçante, mais à épargner les corticostéroïdes et à prévenir les rechutes.</p><table class="t"><tr><th>Situation</th><th>Place</th><th>Source</th></tr><tr><td>Artérite de Takayasu</td><td>Chez tous les patients, avec les corticostéroïdes : méthotrexate, azathioprine, mycophénolate ou léflunomide</td><td>EULAR 2025</td></tr><tr><td>Artérite à cellules géantes</td><td>Méthotrexate en alternative au tocilizumab ou à l’upadacitinib</td><td>EULAR 2025</td></tr><tr><td>Vascularites à ANCA sans menace d’organe</td><td>Méthotrexate ou mycophénolate en alternative au rituximab pour l’induction</td><td>EULAR 2022</td></tr><tr><td>Entretien des vascularites à ANCA</td><td>Azathioprine ou méthotrexate si le rituximab n’est pas choisi ; MAINRITSAN : rechutes majeures 29 % sous azathioprine contre 5 % sous rituximab</td><td>EULAR 2022</td></tr><tr><td>Périartérite noueuse sans facteur de mauvais pronostic, non contrôlée</td><td>Azathioprine 2 à 3 mg/kg par jour ou méthotrexate 0,3 mg/kg par semaine pendant 12 à 18 mois</td><td>Protocole national français 2019</td></tr></table><p><b>Lecture.</b> Le choix dépend de la gravité : une menace d’organe appelle rituximab ou cyclophosphamide, non ces molécules. Le méthotrexate se prend <b>une fois par semaine</b> ; selon son information professionnelle suisse, il est contre-indiqué si la clairance de la créatinine est inférieure à 30 mL/min, ce qui l’écarte de nombreuses glomérulonéphrites. Le mycophénolate est tératogène et s’arrête plus de 6 semaines avant une conception (Société suisse de rhumatologie).</p><p class="small">EULAR 2025 ; EULAR 2022 ; protocole national français de diagnostic et de soins des vascularites nécrosantes systémiques (2019) ; information professionnelle suisse Metoject®, Swissmedic (AIPS), consultée le 08.10.2026.</p></template>
<template data-pop="m31-d-il5" data-title="Mépolizumab et benralizumab"><div class="lab">Mécanisme</div><p>L’interleukine 5 commande la production, la maturation et la survie des éosinophiles. Le mépolizumab neutralise cette cytokine ; le benralizumab se fixe sur son récepteur et entraîne la destruction des éosinophiles qui le portent. Les deux réduisent ainsi l’infiltrat éosinophile responsable de l’asthme, de la polypose et des atteintes d’organe de la granulomatose éosinophilique avec polyangéite.</p><div class="lab">Indications et doses en Suisse</div><p><b>Mépolizumab</b> (Nucala®) : granulomatose éosinophilique récidivante ou résistante, stabilisée par des corticostéroïdes systémiques et nécessitant un traitement d’entretien ; 300 mg par voie sous-cutanée toutes les 4 semaines. Il n’a pas été étudié dans les manifestations menaçant le pronostic vital. <b>Benralizumab</b> (Fasenra®) : granulomatose éosinophilique récidivante ou résistante, en l’absence d’atteinte active menaçant un organe ou le pronostic vital ; 30 mg par voie sous-cutanée toutes les 4 semaines.</p><div class="lab">Preuves</div><p>L’essai MIRRA a établi le mépolizumab dans les formes récidivantes ou réfractaires ; l’essai MANDARA (2024) a montré le benralizumab non inférieur au mépolizumab. Une forme avec myocardite ou mononévrite relève d’abord des corticostéroïdes à forte dose avec cyclophosphamide ou rituximab.</p><p class="small">Information professionnelle suisse Nucala® et Fasenra®, Swissmedic (AIPS), consultées le 08.10.2026 ; EULAR 2022.</p></template>
