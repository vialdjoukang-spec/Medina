<template data-pop="i97-pcis" data-title="Syndrome post-lésionnel cardiaque"><p><b>Définition (ESC 2025).</b> Terme générique désignant des syndromes péricardiques inflammatoires survenant après une lésion du cœur : péricardite tardive après infarctus (syndrome de Dressler), syndrome post-péricardiotomie et péricardite post-traumatique, avec ou sans saignement, aujourd’hui souvent iatrogène.</p><p><b>Mécanisme.</b> Auto-immun, déclenché par le sang dans le péricarde ou l’incision pleurale ; intervalle libre de quelques semaines, réponse aux anti-inflammatoires, récidives possibles.</p></template>
<template data-pop="i97-dressler" data-title="Syndrome de Dressler"><p>Péricardite tardive après infarctus du myocarde, typiquement 1 à 2 semaines après l’infarctus.</p><p><b>Fréquence (ESC 2025).</b> Moins de 1 % des infarctus à l’ère de la reperfusion, surtout après un infarctus étendu ou une reperfusion tardive. <b>Traitement.</b> Aspirine à haute dose en premier choix, associée à la colchicine.</p></template>
<template data-pop="i97-pps" data-title="Syndrome post-péricardiotomie"><p>Syndrome post-lésionnel qui suit une chirurgie ouvrant le péricarde (CIM-10-GM I97.0, syndrome post-cardiotomie).</p><p><b>Prévention (ESC 2025).</b> Colchicine adaptée au poids, débutée 48 à 72 heures avant l’opération et poursuivie 1 mois (classe IIa, niveau A) ; seule stratégie efficace dans la méta-analyse citée (rapport de cotes 0,38).</p></template>
<template data-pop="i97-criteres" data-title="Critères du syndrome post-lésionnel (ESC 2025)"><p><b>Au moins 2 critères sur 5.</b> 1. Fièvre sans autre cause. 2. Douleur thoracique péricardique ou pleurale. 3. Frottement péricardique ou pleural. 4. Épanchement péricardique. 5. Épanchement pleural avec protéine C réactive élevée.</p><p><b>Condition.</b> L’activité inflammatoire, par exemple une protéine C réactive élevée, est indispensable pour distinguer le syndrome des suites mécaniques de la chirurgie.</p></template>
<template data-pop="i97-tamponnade" data-title="Tamponnade postopératoire"><p>Compression des cavités cardiaques par un épanchement sous pression, qui réduit le remplissage et le débit cardiaque.</p><p><b>Après chirurgie cardiaque (ESC 2025, cours I30).</b> Épanchement modéré à abondant dans environ un tiers des cas ; évolution vers la tamponnade dans 10 % des cas au cours du premier mois ; drainage dans ce cas.</p><p><b>Signes.</b> Hypotension, turgescence jugulaire, pouls paradoxal ; collapsus des cavités et variation respiratoire des flux à l’échocardiographie.</p></template>
<template data-pop="i97-rupture" data-title="Rupture cardiaque subaiguë"><p>Fissuration de la paroi libre du ventricule gauche infarci, dont le saignement s’accumule progressivement dans le péricarde.</p><p><b>Règle (ESC 2025).</b> Après infarctus, un épanchement de plus de 10 mm en fin de diastole impose de rechercher une rupture subaiguë avant de conclure à une péricardite.</p></template>
<template data-pop="i97-constriction" data-title="Constriction péricardique"><p>Péricarde épaissi et rigide qui limite le remplissage diastolique ; elle se traduit par une insuffisance cardiaque à prédominance droite.</p><p><b>Après syndrome post-lésionnel (ESC 2025).</b> Suivi attentif pour l’exclure (classe IIa, niveau C) ; antagonistes de l’interleukine 1 dans les formes réfractaires pour la prévenir (classe I, niveau B).</p></template>
<template data-pop="i97-il1" data-title="Antagonistes de l’interleukine 1"><p>Médicaments qui bloquent l’interleukine 1, cytokine centrale de l’inflammation péricardique récidivante.</p><p><b>Place (ESC 2025).</b> Syndrome post-lésionnel réfractaire, pour prévenir récidives et constriction (classe I, niveau B). Molécules, doses et statut en Suisse : cours I30.</p></template>
<template data-pop="i97-prevention" data-title="Colchicine préventive"><p><b>Schéma (ESC 2025).</b> 0,5 mg une fois par jour jusqu’à 70 kg, 0,5 mg deux fois par jour au-delà, sans dose de charge ; début 48 à 72 heures avant la chirurgie cardiaque ; durée 1 mois ; si tolérée et non contre-indiquée (classe IIa, niveau A).</p><p><b>Preuve.</b> Méta-analyse : seule la colchicine réduit le syndrome post-péricardiotomie (rapport de cotes 0,38), avec davantage d’effets digestifs ; aspirine et corticoïdes inefficaces en prévention.</p></template>
<template data-pop="i97-fapo" data-title="Fibrillation atriale postopératoire"><p>Fibrillation atriale nouvelle survenant après une chirurgie ; 30 à 50 % des patients après chirurgie cardiaque (cours I48, d’après l’ESC 2024).</p><p><b>Règles (ESC 2024).</b> Péricardiotomie postérieure à envisager pendant la chirurgie cardiaque (classe IIa ; rapport de cotes 0,44 dans une méta-analyse). Anticoagulation au long cours à envisager si risque thromboembolique élevé (classe IIa, niveau B).</p></template>
<template data-pop="i97-lymph" data-title="Lymphoedème après mastectomie"><p>Lymphoedème secondaire du membre supérieur après chirurgie du cancer du sein (CIM-10-GM I97.2).</p><p><b>Risque (Société internationale de lymphologie 2023).</b> 19,9 % après curage axillaire, 5,6 % après biopsie du seul ganglion sentinelle ; l’obésité aggrave le risque. Diagnostic, stades et physiothérapie décongestive complexe : cours I89.</p></template>
<template data-pop="i97-doppler" data-title="Variation respiratoire du flux mitral"><p>Au Doppler pulsé, les vitesses du remplissage mitral diminuent à l’inspiration lorsque la pression péricardique rend les ventricules interdépendants : le cœur droit se remplit davantage aux dépens du cœur gauche.</p><p><b>Signification.</b> Une variation marquée traduit une compression hémodynamique et accompagne la tamponnade ; elle s’interprète avec la clinique et les autres signes échographiques.</p></template>
<template data-pop="pareto-i97-clin" data-title="Pareto — Notions et diagnostic"><p class="ratio" data-cover="i97-0,i97-1,i97-2,i97-3,i97-4"></p><ul>
<li>Syndrome post-lésionnel : Dressler, post-péricardiotomie, post-traumatique souvent iatrogène.</li>
<li>Dressler moins de 1 % ; péricardite chez environ 10 % après ablation de fibrillation atriale.</li>
<li>Mécanisme auto-immun, intervalle libre de quelques semaines.</li>
<li>Au moins 2 critères sur 5, avec inflammation démontrée.</li>
<li>Écarter infection, embolie pulmonaire, rupture après infarctus.</li></ul></template>
<template data-pop="pareto-i97-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="i97-5,i97-6"></p><ul>
<li>Tamponnade : 10 % des épanchements modérés à abondants le premier mois ; drainer.</li>
<li>Épanchement de plus de 10 mm après infarctus : chercher une rupture.</li>
<li>Anti-inflammatoire (I, B) ; aspirine à haute dose après infarctus (I, C).</li>
<li>Réfractaire : antagoniste de l’interleukine 1 (I, B).</li>
<li>Prévention : colchicine 1 mois, débutée 48 à 72 heures avant (IIa, A).</li></ul></template>
<template data-pop="pareto-i97-suivi" data-title="Pareto — Autres entités et critères"><p class="ratio" data-cover="i97-7,i97-8,i97-9"></p><ul>
<li>Fibrillation atriale postopératoire : 30 à 50 % après chirurgie cardiaque.</li>
<li>Péricardiotomie postérieure (IIa) ; anticoagulation au long cours si risque élevé (IIa, B).</li>
<li>Lymphoedème : 19,9 % après curage axillaire, 5,6 % après ganglion sentinelle.</li>
<li>I97.8, I97.9, I98, I99 : conduite de la cause.</li></ul></template>
<template data-pop="pareto-i97-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i97-e-1,i97-e-2"></p><ul>
<li>Protéine C réactive : preuve d’inflammation indispensable.</li>
<li>Échocardiographie : taille de l’épanchement, signes de tamponnade.</li>
<li>Scanner ou IRM : épanchement cloisonné, cas compliqués.</li></ul></template>
<template data-pop="pareto-i97-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i97-p-1,i97-p-2"></p><ul>
<li>Colchicine 0,5 mg une ou deux fois par jour selon 70 kg, sans dose de charge.</li>
<li>Aspirine à haute dose après infarctus, avec protection gastrique.</li>
<li>Interleukine 1 : formes réfractaires ; détails dans le cours I30.</li></ul></template>
