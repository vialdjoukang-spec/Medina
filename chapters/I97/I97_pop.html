<template data-pop="i97-pcis" data-title="Syndrome post-lésionnel cardiaque"><p><b>Définition (ESC 2025).</b> Ce terme générique désigne les syndromes péricardiques inflammatoires qui surviennent après une lésion du cœur : la péricardite tardive après infarctus (syndrome de Dressler), le syndrome post-péricardiotomie et la péricardite post-traumatique, avec ou sans saignement, aujourd’hui souvent iatrogène.</p><p><b>Mécanisme.</b> Le mécanisme est auto-immun, déclenché par le sang dans le péricarde ou par l’incision pleurale. Trois arguments le soutiennent : un intervalle libre de quelques semaines, la réponse aux anti-inflammatoires et la possibilité de récidives.</p></template>
<template data-pop="i97-dressler" data-title="Syndrome de Dressler"><p>Péricardite tardive après infarctus du myocarde, typiquement 1 à 2 semaines après l’infarctus.</p><p><b>Fréquence (ESC 2025).</b> Le syndrome touche moins de 1 % des infarctus à l’ère de la reperfusion, surtout après un infarctus étendu ou une reperfusion tardive, car la nécrose y est plus large. <b>Traitement.</b> L’aspirine à haute dose est le premier choix, associée à la colchicine ; elle est préférée parce qu’elle sert aussi le traitement de l’infarctus.</p></template>
<template data-pop="i97-pps" data-title="Syndrome post-péricardiotomie"><p>Syndrome post-lésionnel qui suit une chirurgie ouvrant le péricarde (CIM-10-GM I97.0, syndrome post-cardiotomie).</p><p><b>Prévention (ESC 2025).</b> La colchicine adaptée au poids est débutée 48 à 72 heures avant l’opération et poursuivie 1 mois (classe IIa, niveau A). C’est la seule stratégie efficace dans la méta-analyse citée (rapport de cotes 0,38).</p></template>
<template data-pop="i97-criteres" data-title="Critères du syndrome post-lésionnel (ESC 2025)"><p><b>Au moins 2 critères sur 5.</b> 1. Le patient a une fièvre sans autre cause. 2. Il ressent une douleur thoracique péricardique ou pleurale. 3. Le médecin entend un frottement péricardique ou pleural. 4. Un épanchement péricardique est présent. 5. Un épanchement pleural s’accompagne d’une protéine C réactive élevée.</p><p><b>Condition.</b> L’activité inflammatoire, par exemple une protéine C réactive élevée, est indispensable pour distinguer le syndrome des suites mécaniques de la chirurgie.</p></template>
<template data-pop="i97-tamponnade" data-title="Tamponnade postopératoire"><p>Compression des cavités cardiaques par un épanchement sous pression, qui réduit le remplissage et le débit cardiaque.</p><p><b>Après chirurgie cardiaque (ESC 2025, cours I30).</b> Un épanchement modéré à abondant survient dans environ un tiers des cas ; il évolue vers la tamponnade dans 10 % des cas au cours du premier mois, et le médecin le draine alors.</p><p><b>Signes.</b> La tamponnade provoque une hypotension, une turgescence jugulaire et un pouls paradoxal. À l’échocardiographie, elle montre un collapsus des cavités et une variation respiratoire des flux, car le péricarde sous tension empêche le remplissage.</p><figure><img src="images/cardiologie/i97_epanchement_pericardique_echo.gif" alt="Échographie réelle montrant un épanchement liquidien anéchogène autour du cœur, désigné par une flèche" width="396" height="347" loading="lazy" decoding="async">
<figcaption>Même image que la figure 2 du cours — Échographie cardiaque : épanchement péricardique, bande liquidienne anéchogène (noire) autour du cœur (flèche de l’auteur original). Image de James Heilman, MD, Wikimedia Commons, licence CC BY-SA 3.0 ; convertie pour l’atlas, dérivé sous la même licence.</figcaption></figure><p>Cette échographie réelle montre la bande liquidienne noire qui entoure le cœur. Lorsque le liquide s’accumule plus vite que le péricarde ne se distend, la pression intrapéricardique dépasse la pression de remplissage des cavités droites ; le cœur ne se remplit plus, et le débit chute : c’est la tamponnade.</p></template>
<template data-pop="i97-rupture" data-title="Rupture cardiaque subaiguë"><p>Fissuration de la paroi libre du ventricule gauche infarci, dont le saignement s’accumule progressivement dans le péricarde.</p><p><b>Règle (ESC 2025).</b> Après un infarctus, un épanchement de plus de 10 mm en fin de diastole impose de rechercher une rupture subaiguë avant de conclure à une péricardite, car la rupture exige une chirurgie urgente.</p></template>
<template data-pop="i97-constriction" data-title="Constriction péricardique"><p>Péricarde épaissi et rigide qui limite le remplissage diastolique ; elle se traduit par une insuffisance cardiaque à prédominance droite.</p><p><b>Après syndrome post-lésionnel (ESC 2025).</b> Un suivi attentif permet d’exclure une constriction (classe IIa, niveau C). Dans les formes réfractaires, les antagonistes de l’interleukine 1 la préviennent (classe I, niveau B).</p></template>
<template data-pop="i97-il1" data-title="Antagonistes de l’interleukine 1"><p>Médicaments qui bloquent l’interleukine 1, cytokine centrale de l’inflammation péricardique récidivante.</p><p><b>Place (ESC 2025).</b> Ces médicaments s’utilisent dans le syndrome post-lésionnel réfractaire, pour prévenir les récidives et la constriction (classe I, niveau B). Les molécules, les doses et le statut en Suisse figurent dans le cours I30.</p></template>
<template data-pop="i97-prevention" data-title="Colchicine préventive"><p><b>Schéma (ESC 2025).</b> La dose est de 0,5 mg une fois par jour jusqu’à 70 kg et de 0,5 mg deux fois par jour au-delà, sans dose de charge. Le traitement commence 48 à 72 heures avant la chirurgie cardiaque et dure 1 mois, s’il est toléré et non contre-indiqué (classe IIa, niveau A).</p><p><b>Preuve.</b> Méta-analyse : seule la colchicine réduit le syndrome post-péricardiotomie (rapport de cotes 0,38), avec davantage d’effets digestifs ; aspirine et corticoïdes inefficaces en prévention.</p></template>
<template data-pop="i97-fapo" data-title="Fibrillation atriale postopératoire"><p>La fibrillation atriale postopératoire est une fibrillation atriale nouvelle qui survient après une chirurgie ; elle touche 30 à 50 % des patients après chirurgie cardiaque (cours I48, d’après l’ESC 2024).</p><p><b>Règles (ESC 2024).</b> Une péricardiotomie postérieure est à envisager pendant la chirurgie cardiaque (classe IIa ; rapport de cotes 0,44 dans une méta-analyse). Une anticoagulation au long cours est à envisager si le risque thromboembolique est élevé (classe IIa, niveau B), car l’arythmie signale un risque ultérieur d’accident vasculaire cérébral.</p></template>
<template data-pop="i97-lymph" data-title="Lymphoedème après mastectomie"><p>Il s’agit d’un lymphoedème secondaire du membre supérieur après chirurgie du cancer du sein (CIM-10-GM I97.2).</p><p><b>Risque (Société internationale de lymphologie 2023).</b> Le risque atteint 19,9 % après curage axillaire et 5,6 % après biopsie du seul ganglion sentinelle ; l’obésité l’aggrave. Le diagnostic, les stades et la physiothérapie décongestive complexe sont traités dans le cours I89.</p></template>
<template data-pop="i97-doppler" data-title="Variation respiratoire du flux mitral"><p>Au Doppler pulsé, les vitesses du remplissage mitral diminuent à l’inspiration lorsque la pression péricardique rend les ventricules interdépendants : le cœur droit se remplit davantage aux dépens du cœur gauche.</p><p><b>Signification.</b> Une variation marquée traduit une compression hémodynamique et accompagne la tamponnade ; elle s’interprète avec la clinique et les autres signes échographiques.</p><figure><img src="images/cardiologie/i97_doppler_mitral_respiratoire.gif" alt="Enregistrement Doppler pulsé réel du flux mitral montrant des vitesses qui varient avec la respiration" width="600" height="478" loading="lazy" decoding="async">
<figcaption>Même image que la figure 3 du cours — Doppler pulsé du flux mitral chez un patient porteur d’un épanchement péricardique : variations respiratoires des vitesses de remplissage, la courbe respiratoire figurant en vert sous le tracé. Image de CardioNetworks ECHOpedia (AMC Echolab, Amsterdam), Wikimedia Commons, licence CC BY-SA 3.0 ; convertie pour l’atlas.</figcaption></figure><p>Ce tracé réel montre la variation respiratoire du flux mitral. Comme le péricarde sous tension fixe le volume total du cœur, l’inspiration remplit le ventricule droit aux dépens du gauche ; le flux mitral baisse donc à l’inspiration, ce qui traduit l’interdépendance ventriculaire.</p></template>
<template data-pop="pareto-i97-clin" data-title="Pareto — Notions et diagnostic"><p class="ratio" data-cover="i97-0,i97-1,i97-2,i97-3,i97-4"></p><ul>
<li>Le syndrome post-lésionnel regroupe le syndrome de Dressler, le syndrome post-péricardiotomie et la péricardite post-traumatique, souvent iatrogène.</li>
<li>Le syndrome de Dressler touche moins de 1 % des infarctus ; une péricardite survient chez environ 10 % des patients après ablation de fibrillation atriale.</li>
<li>Le mécanisme est auto-immun, avec un intervalle libre de quelques semaines.</li>
<li>Le diagnostic exige au moins 2 critères sur 5, avec une inflammation démontrée.</li>
<li>Le médecin écarte une infection, une embolie pulmonaire et une rupture après infarctus.</li></ul></template>
<template data-pop="pareto-i97-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="i97-5,i97-6"></p><ul>
<li>La tamponnade complique 10 % des épanchements modérés à abondants le premier mois ; il faut alors drainer.</li>
<li>Après un infarctus, un épanchement de plus de 10 mm impose de chercher une rupture.</li>
<li>Le traitement repose sur un anti-inflammatoire (I, B), et sur l’aspirine à haute dose après infarctus (I, C).</li>
<li>Dans les formes réfractaires, le médecin utilise un antagoniste de l’interleukine 1 (I, B).</li>
<li>En prévention, la colchicine se donne pendant 1 mois, débutée 48 à 72 heures avant l’opération (IIa, A).</li></ul></template>
<template data-pop="pareto-i97-suivi" data-title="Pareto — Autres entités et critères"><p class="ratio" data-cover="i97-7,i97-8,i97-9"></p><ul>
<li>La fibrillation atriale postopératoire touche 30 à 50 % des patients après chirurgie cardiaque.</li>
<li>Une péricardiotomie postérieure se discute (IIa), et une anticoagulation au long cours s’envisage si le risque est élevé (IIa, B).</li>
<li>Le lymphoedème touche 19,9 % des patientes après curage axillaire et 5,6 % après ganglion sentinelle.</li>
<li>Pour I97.8, I97.9, I98 et I99, la conduite dépend de la cause.</li></ul></template>
<template data-pop="pareto-i97-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="i97-e-1,i97-e-2"></p><ul>
<li>Protéine C réactive : preuve d’inflammation indispensable.</li>
<li>L’échocardiographie mesure l’épanchement et recherche des signes de tamponnade.</li>
<li>Scanner ou IRM : épanchement cloisonné, cas compliqués.</li></ul></template>
<template data-pop="pareto-i97-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i97-p-1,i97-p-2"></p><ul>
<li>La colchicine se donne à 0,5 mg une ou deux fois par jour selon le seuil de 70 kg, sans dose de charge.</li>
<li>L’aspirine à haute dose après infarctus s’associe à une protection gastrique, car elle irrite la muqueuse.</li>
<li>Les antagonistes de l’interleukine 1 sont réservés aux formes réfractaires ; leurs détails figurent dans le cours I30.</li></ul></template>
