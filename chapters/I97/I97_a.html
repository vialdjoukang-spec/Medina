<section class="ilot" id="i97-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Trois semaines après un remplacement valvulaire aortique, une femme de 68 ans revient pour une douleur thoracique majorée par l’inspiration, une fièvre à 38,2 °C et un essoufflement. Or, sa plaie sternale est propre, et l’échocardiographie montre un épanchement péricardique nouveau. Dès lors, il faut distinguer une réaction inflammatoire attendue de la chirurgie, une infection, une embolie pulmonaire ou une tamponnade débutante. La question qui structure ce cours est donc la suivante : <b>comment reconnaître et traiter les troubles circulatoires qui suivent un acte médical, au premier rang desquels le syndrome post-lésionnel cardiaque ?</b></p>
<p>Pour y répondre, ce cours poursuit trois objectifs. D’abord, définir le syndrome post-lésionnel cardiaque selon l’ESC 2025 et le distinguer des suites mécaniques de la chirurgie. Ensuite, poser son traitement et sa prévention par la colchicine. Enfin, situer les autres entités de la catégorie, la fibrillation atriale postopératoire et le lymphoedème après mastectomie, qui sont développées dans les cours I48 et I89 ; ce cours n’en retient donc que les règles propres à la période qui suit l’acte.</p>
</section>
<section class="ilot" id="i97-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>Il faut d’abord nommer précisément le syndrome principal. Selon l’ESC 2025, le <button class="w" data-k="i97-pcis">syndrome post-lésionnel cardiaque (définition ESC 2025)</button> est un terme générique qui regroupe des syndromes péricardiques inflammatoires : la péricardite tardive après infarctus, ou <button class="w" data-k="i97-dressler">syndrome de Dressler</button>, le <button class="w" data-k="i97-pps">syndrome post-péricardiotomie</button>, et la péricardite post-traumatique, avec ou sans saignement. Or, une grande partie des cas post-traumatiques sont aujourd’hui iatrogènes, c’est-à-dire liés aux interventions cardiovasculaires.</p>
<p>La CIM-10-GM range ensuite ces situations dans plusieurs sous-catégories. Ainsi, la catégorie I97 réunit les troubles circulatoires consécutifs à un acte médical, alors que I98 et I99 sont des codes de regroupement pour des atteintes circulatoires secondaires à des maladies classées ailleurs ou non précisées ; leur conduite est donc celle de la maladie causale.</p>

<tr><td><b>I97.2</b></td><td>Syndrome de lymphoedème après mastectomie</td><td>Ce cours (repères) ; cours I89</td></tr>

<p>Cette classification posée, la fréquence de chaque entité dépend du type d’acte ; l’épidémiologie se lit donc acte par acte.</p>
</section>
<section class="ilot" id="i97-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La fréquence du syndrome post-lésionnel augmente, car les actes invasifs se multiplient et la population vieillit (ESC 2025). En revanche, le syndrome de Dressler est devenu rare : il survient dans moins de 1 % des infarctus, surtout après un infarctus étendu ou une reperfusion tardive, typiquement 1 à 2 semaines après l’infarctus. À l’inverse, les péricardites après implantation d’un dispositif ou après ablation d’arythmie deviennent plus fréquentes ; ainsi, une péricardite survient chez environ 10 % des patients après ablation de fibrillation atriale (ESC 2025).</p>
<p>Le pronostic est, dans la majorité des cas, favorable sous traitement anti-inflammatoire. Cependant, deux évolutions doivent être surveillées : la tamponnade précoce et, plus tard, la constriction péricardique ; c’est pourquoi l’ESC 2025 recommande un suivi attentif.</p>
</section>
<section class="ilot" id="i97-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Pour comprendre ces évolutions, il faut revenir au mécanisme. L’ESC 2025 retient en effet une pathogénie auto-immune, déclenchée par le saignement dans le péricarde ou par l’incision de la plèvre. Plusieurs arguments la soutiennent : un intervalle libre, en général de quelques semaines, avant les premières manifestations ; la réponse aux anti-inflammatoires ; et la possibilité de récidives.</p>
<p>Ce mécanisme explique ensuite l’atteinte souvent combinée de la plèvre et du péricarde, parfois avec des infiltrats pulmonaires. Par conséquent, le syndrome n’est pas une simple péricardite ; c’est pourquoi ses critères diagnostiques incluent l’épanchement pleural et la fièvre.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Saignement ou incision : réaction immunitaire retardée de quelques semaines, d’où une douleur et une fièvre qui apparaissent après une période de bonne évolution. Inflammation : protéine C réactive élevée, réponse aux anti-inflammatoires et à la colchicine. Inflammation prolongée : risque de constriction.</div>
</section>
