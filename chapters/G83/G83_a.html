<p>Dans cette <b>vignette fictive</b>, un homme de 46 ans consulte aux urgences pour une lombosciatique des deux jambes, apparue il y a trois jours. Depuis la veille au soir, soit depuis une vingtaine d’heures, il urine avec peine et ne sent plus le contact du papier au niveau du périnée. L’échographie vésicale montre un <button class="w" data-k="g83-pvr-calcul">résidu post-mictionnel de 350 mL (comparaison au seuil de 200 mL)</button>. Ces valeurs sont pédagogiques ; elles servent à poser la question centrale du cours.</p>
<p>Un seul diagnostic, le <button class="w" data-k="g83-ces">syndrome de la queue de cheval (définition pratique)</button>, rassemble ici une douleur banale en apparence, un trouble mictionnel et une anesthésie en selle. La catégorie G83 de la classification internationale réunit pourtant des tableaux très éloignés : ce syndrome, qui est une urgence chirurgicale, mais aussi le <button class="w" data-k="g83-lis">locked-in syndrome</button>, la <button class="w" data-k="g83-todd">paralysie postcritique de Todd</button>, la paralysie faciale centrale et les paralysies d’un seul membre. Le cours apprend à reconnaître l’urgence, à ne pas confondre une paralysie postcritique avec un accident vasculaire cérébral, et à distinguer un patient conscient mais enfermé d’un patient qui ne répond pas.</p>
<div class="key"><b>À retenir.</b> G83 est une catégorie résiduelle. Sa valeur pratique tient à deux urgences qu’elle contient : la compression de la queue de cheval, qu’on fait imager sans attendre, et le locked-in syndrome, que l’on prend à tort pour un trouble de la conscience.</div>
</section>

<section class="ilot" id="g83-1"><h2><span class="n">1</span>Définition, périmètre et codage</h2>
<p>La catégorie G83, intitulée « Autres syndromes paralytiques » dans la <button class="w" data-k="g83-codage">CIM-10-GM 2024 (règles d’usage de la catégorie)</button>, appartient au bloc G80–G83 des paralysies. Elle recouvre toute paralysie, complète ou incomplète, qui n’est pas déjà classée sous la paralysie cérébrale (G80), l’hémiplégie (G81) ou la para- et tétraplégie (G82). La classification précise qu’elle s’emploie comme code primaire seulement si l’affection n’est pas précisée davantage, ou si elle est ancienne et de cause non précisée ; elle s’ajoute aussi en codage multiple, quelle qu’en soit la cause.</p>
<p>Le tableau suivant reprend les sous-catégories avec les libellés français de l’Office fédéral de la statistique. Il sert de carte du cours : chaque ligne correspond à un tableau clinique différent, et les lignes G83.4 et G83.5, qui nomment deux syndromes, portent l’essentiel des urgences du cours. La colonne de droite indique où le cours traite le sujet.</p>

<section class="ilot" id="g83-2"><h2><span class="n">2</span>Syndrome de la queue de cheval : anatomie et définition</h2>
<p>La moelle épinière se termine vers le niveau de la 2e vertèbre lombaire. Sous ce niveau ne descendent plus que des racines : ce faisceau de racines nerveuses, la <button class="w" data-k="g83-anat-cauda">queue de cheval (anatomie et segments en cause)</button>, comprend toutes les racines nées sous la 2e lombaire, dont les parties proximales des 3e, 4e et 5e lombaires et de la 1re sacrée. L’atteinte de 3e lombaire à 1re sacrée touche surtout les jambes. Pourtant, le terme « syndrome de la queue de cheval » désigne historiquement le dysfonctionnement des racines sacrées <b>2e à 5e racines sacrées</b>, qui commandent la vessie, l’intestin, la sensibilité du périnée et la fonction sexuelle.</p>
<p>Cette précision de vocabulaire explique le tableau clinique. Une compression qui épargne les racines sacrées donne une sciatique ou une faiblesse du pied, mais ni trouble des sphincters ni anesthésie en selle. C’est l’atteinte sacrée, et non la douleur, qui fait l’urgence. Elle explique aussi pourquoi un patient peut avoir une jambe presque normale et pourtant une atteinte vésicale.</p>
<figure><svg viewBox="0 0 420 300" role="img" aria-label="Figure 1 — Moelle, cône et queue de cheval" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="60" y="14" width="46" height="150" rx="10"/><path d="M60 164l23 34 23-34"/><path d="M71 164v100M77 164v110M83 164v118M89 164v110M95 164v100"/><path d="M52 70h62M52 110h62M52 150h62"/></g><g fill="currentColor"><text x="130" y="44">Moelle épinière</text><text x="130" y="114">Fin de la moelle (2e lombaire)</text><text x="130" y="188">Cône terminal</text><text x="130" y="230">Queue de cheval : racines lombaires</text><text x="130" y="246">et sacrées, sous le cône</text><text x="130" y="268">Racines sacrées 2 à 5 : vessie, intestin,</text><text x="130" y="284">périnée, fonction sexuelle</text></g></svg><figcaption>Figure 1 — Moelle, cône et queue de cheval. Schéma didactique, sans échelle : sous le niveau de la 2e lombaire, il ne reste plus que des racines.</figcaption></figure>
<p>Le <button class="w" data-k="g83-cone">syndrome du cône terminal (distinction anatomique)</button> se distingue par le niveau lésionnel : dans la littérature sur le traumatisme, il peut résulter d’une lésion des vertèbres 12e thoracique à 2e lombaire et atteint les structures nerveuses du segment médullaire 12e thoracique jusqu’à la 5e racine sacrée, alors que le syndrome de la queue de cheval peut résulter d’une lésion des vertèbres 3e à 5e lombaires et atteint les racines de la 3e lombaire à la 5e sacrée. On suppose que le second garde un meilleur pronostic fonctionnel ; cette hypothèse reste à tester.</p>
<p>La définition de ce syndrome est elle-même discutée. Une revue de 212 articles a recensé 17 définitions. Une analyse de 110 études (52 008 patients) montre que seules 16 d’entre elles, soit 14,5 %, employaient une définition établie. Le <button class="w" data-k="g83-heterogeneite">défaut d’unité des définitions (conséquences)</button> rend les comparaisons entre études fragiles et justifie la <button class="w" data-k="g83-ces">définition pratique</button> proposée : un diagnostic clinique qui résulte du dysfonctionnement d’une ou plusieurs racines sacrées à partir de la 2e, avec au moins un des éléments suivants : trouble vésical ou intestinal, diminution de la sensibilité en selle, trouble sexuel. La douleur lombaire et des jambes, les signes moteurs ou sensitifs des membres inférieurs sont fréquents mais non indispensables. La compression d’une racine est la cause la plus fréquente, et l’IRM est en général nécessaire pour confirmer.</p>
<p>La Revue Médicale Suisse formule la définition en termes cliniques : l’apparition de troubles sphinctériens par compression des racines sacrées, avec rétention urinaire ou incontinence par regorgement, parésie des membres inférieurs de degré divers et anesthésie en selle. Les deux formulations se complètent : l’une met l’accent sur la racine, l’autre sur le symptôme qui amène le patient.</p>
<div class="key"><b>À retenir.</b> Le syndrome de la queue de cheval est un diagnostic clinique de dysfonctionnement des racines sacrées à partir de la 2e ; la douleur et la faiblesse des jambes l’accompagnent souvent mais ne le définissent pas.</div>

</section>

<section class="ilot" id="g83-3"><h2><span class="n">3</span>Classifications du syndrome de la queue de cheval</h2>
<p>La classification la plus utilisée est celle de Gleave et MacFarlane (2002), qui sépare deux stades selon l’état de la miction. Le <button class="w" data-k="g83-cesi-cesr">syndrome incomplet (CESI) et le syndrome avec rétention (CESR)</button> ne sont pas deux maladies, mais deux moments d’une même évolution ; elle a une valeur pronostique, détaillée plus loin. Dans le premier, les troubles urinaires sont d’origine neurogène (sensation altérée, perte du besoin, jet faible, nécessité de pousser), mais le contrôle volontaire est conservé : la miction reste possible, même difficile. Dans le second, le contrôle volontaire est perdu et la rétention est indolore, avec regorgement.</p>
<table class="t"><thead><tr><th>Catégorie</th><th>Définition</th><th>Particularité</th></tr></thead><tbody><tr><td>CESS (suspicion)</td><td>Symptômes bilatéraux des jambes ou grosse hernie connue, sans symptôme de queue de cheval</td><td>Catégorie de surveillance</td></tr><tr><td>CESE (précoce)</td><td>Symptômes seuls : hypoesthésie périnéale à vessie normale, ou changement mictionnel à sensibilité normale</td><td>Stade où la vessie n’est pas encore touchée</td></tr><tr><td>CESI (incomplet)</td><td>Troubles urinaires neurogènes avec contrôle volontaire conservé</td><td>Miction possible, même difficile</td></tr><tr><td>CESR (avec rétention)</td><td>Perte du contrôle volontaire, rétention indolore avec regorgement</td><td>Un sondage précoce masque le tableau</td></tr><tr><td>CESC (complet)</td><td>Perte de toutes les fonctions sensitives et motrices de la queue de cheval</td><td>Pire que le CESR</td></tr></tbody></table>
<p>Ce tableau classe de la plus discrète à la plus sévère. Il appelle un commentaire : le sondage précoce de la vessie complique le diagnostic de CESR, parce qu’il empêche la distension et le regorgement qui le caractérisent. Le clinicien qui sonde avant d’avoir mesuré le résidu efface ainsi le signe sur lequel repose la classification.</p>
<p>Une autre classification, de Tandon et Sankaran, distingue trois types selon le mode de présentation ; le type 2 domine dans les litiges, et le type 3, souvent non urgent, concerne des patients plus âgés. Le détail des trois types n’a pas pu être lu dans le texte disponible. Retenons seulement que ce système, comme celui de Gleave et MacFarlane, décrit la <button class="w" data-k="g83-tandon">présentation (limites de ces classifications)</button> sans remplacer le jugement.</p>
<div class="trap"><span class="k">Piège</span> Ces catégories sont moins fiables qu’elles n’en ont l’air. Sur cent vignettes de cas réels, l’accord entre observateurs était insuffisant pour toutes les catégories. Le meilleur accord portait sur la question « CES avec rétention ou autre », avec un coefficient kappa de 0,34, soit un accord minimal ; le coefficient était de 0,17 chez les consultants spécialistes. Une <button class="w" data-k="g83-fiabilite">fiabilité faible (lecture du kappa)</button> interdit de fonder seul sur le stade la décision d’opérer vite.</div>
<p>Le lien avec le codage est le suivant : la CIM-10-GM sépare le syndrome complet (G83.40), incomplet (G83.41) et non précisé (G83.49). Aucune source lue ne donne de correspondance officielle entre ces trois codes et les catégories CESI et CESR ; le cours ne les assimile donc pas.</p>
<div class="key"><b>À retenir.</b> La perte du contrôle volontaire de la miction, avec rétention indolore et regorgement, définit le stade avec rétention. Mais l’accord entre observateurs est faible : la décision repose sur l’ensemble du tableau et sur l’imagerie.</div>
<button class="pareto-btn ui" data-k="pareto-g83-classification">▲ Loi de Pareto — Classifications</button>
</section>

<section class="ilot" id="g83-4"><h2><span class="n">4</span>Fréquence et causes</h2>
<p>La fréquence publiée de ce syndrome va de 0,34 à 7 cas pour 100 000 personnes par an. L’écart est large, et les définitions employées varient d’une étude à l’autre. En Suisse, la prévalence est évaluée à environ 0,04 % parmi les patients qui consultent pour une lombalgie, et le syndrome complique environ 2 % des hernies discales lombaires. La <button class="w" data-k="g83-incidence">rareté du syndrome (chiffres et prudence d’interprétation)</button> explique pourquoi un médecin peut n’en voir aucun cas pendant des années, et pourquoi le diagnostic échappe.</p>
<p>La <button class="w" data-k="g83-hernie">hernie discale lombaire massive (cause principale)</button> est la cause la plus fréquente. Les sources lues documentent aussi deux causes iatrogènes dont l’examen peut s’inspirer. Dans une publication de deux cas suisses (Balgrist), une injection péridurale de stéroïdes réalisée sans guidage par imagerie a provoqué un syndrome de la queue de cheval avec arachnoïdite dans un cas, un syndrome du cône après ponction durale dans l’autre, avec des séquelles vésico-intestinales encore présentes deux ans plus tard. Dans un autre cas, un bloc des branches médiales lombaires par méthylprednisolone particulaire a laissé des lésions ischémiques de la queue de cheval visibles à l’IRM. La <button class="w" data-k="g83-iatrogene">cause iatrogène (injections et prévention)</button> rappelle que le syndrome peut suivre un geste médical, et que l’anamnèse doit donc relever toute injection récente près du rachis.</p>
<p>Les tumeurs de la queue de cheval figurent dans le diagnostic différentiel de la littérature lue, par exemple une tumeur fibreuse solitaire qui imite un schwannome ; les sources lues ne chiffrent pas leur fréquence. L’IRM reste supérieure au scanner pour voir le sac dural et les tissus mous en cas de tumeur.</p>
<table class="t"><thead><tr><th>Cause</th><th>Fait documenté</th><th>Conséquence pour la pratique</th></tr></thead><tbody><tr><td>Hernie discale lombaire massive</td><td>Cause la plus fréquente</td><td>Chercher une compression sur l’IRM</td></tr><tr><td>Injection péridurale non guidée</td><td>Deux cas suisses, séquelles à 2 ans</td><td>Guider par imagerie</td></tr><tr><td>Bloc médial avec stéroïde particulaire</td><td>Lésions ischémiques à l’IRM</td><td>Rapporter la complication au geste (cas publiés)</td></tr><tr><td>Tumeur de la queue de cheval</td><td>Citée en différentiel</td><td>IRM, pas scanner seul</td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> Un patient qui présente des symptômes de type « queue de cheval » sans compression à l’IRM existe : on parle de CES à IRM négative, groupe non chirurgical décrit par Hoeritzauer. L’absence de compression n’efface pas la plainte ; elle déplace la prise en charge hors de la chirurgie.</div>
<button class="pareto-btn ui" data-k="pareto-g83-causes">▲ Loi de Pareto — Fréquence et causes</button>
</section>

<section class="ilot" id="g83-5"><h2><span class="n">5</span>Clinique : anamnèse et examen</h2>
<p>Le symptôme le plus constant est la rétention urinaire : sa sensibilité est d’environ 90 %, et en son absence la probabilité d’un syndrome de la queue de cheval est d’environ 1 sur 10 000. Dans une série de 44 hernies discales, tous les patients avaient une rétention ou une incontinence par regorgement avec anesthésie en selle, et l’installation s’était faite en moins de 24 heures chez 89 % d’entre eux. La <button class="w" data-k="g83-retention">rétention urinaire (valeur du signe et limite)</button> est donc le symptôme que l’on recherche en premier.</p>
<div class="two"><div class="card"><h4>Ce qu’on demande</h4><p>L’incontinence est un stade tardif. Il faut donc interroger finement la sensation urinaire, la force du jet et la fréquence des mictions, et ne pas se contenter de la question « êtes-vous incontinent ? ». On cherche aussi une douleur radiculaire, une faiblesse nouvelle d’une jambe et un trouble intestinal ou sexuel.</p></div><div class="card"><h4>Ce qu’on examine</h4><p>On examine la sensibilité du périnée, de la région périanale et des organes génitaux. L’hypoesthésie périnéale n’est pas absolument indispensable au stade incomplet. Le toucher rectal et la mesure du résidu post-mictionnel complètent l’évaluation.</p></div></div>
<p>Les <button class="w" data-k="g83-drapeaux">drapeaux rouges (neuf recommandations internationales comparées)</button> concordent sur un point : tous les documents revus retiennent les troubles sensitifs périanaux, périnéaux ou en selle, et la dysfonction vésicale ou intestinale. La douleur radiculaire figure dans 8 des 9 recommandations, la faiblesse motrice nouvelle dans 5, le toucher rectal dans 4 et le résidu post-mictionnel dans 5.</p>
<div class="trap"><span class="k">Piège</span> Un drapeau rouge isolé prédit mal le syndrome. Dans une étude prospective de 260 suspicions, la sciatique bilatérale avait une sensibilité de 32,4 %, une valeur prédictive positive de 17,2 % et une valeur prédictive négative de 88,3 %. Cela veut dire qu’une sciatique bilatérale ne permet ni de confirmer, ni d’écarter le diagnostic : elle impose de poser les questions sphinctériennes, pas de conclure.</div>
<div class="key"><b>À retenir.</b> Rechercher la rétention, l’anesthésie en selle et la dysfonction intestinale ou sexuelle, interroger la sensation avant la continence, examiner le périnée. Un signe isolé ne tranche pas.</div>
<button class="pareto-btn ui" data-k="pareto-g83-clinique">▲ Loi de Pareto — Clinique</button>
</section>
