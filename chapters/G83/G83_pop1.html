<template data-pop="g83-codage" data-title="Codage CIM-10-GM de la catégorie G83">
<div class="lab">Ce que couvre le code</div><p>La catégorie G83 « Autres syndromes paralytiques » appartient au bloc G80–G83 de la CIM-10-GM 2024. Elle comprend les paralysies, complètes ou incomplètes, à l’exception de celles classées G80 à G82. La note d’usage de l’Office allemand BfArM précise qu’elle sert de code primaire seulement si l’affection n’est pas précisée davantage, ou si elle est ancienne, de longue date et de cause non précisée. Elle peut aussi s’ajouter en codage multiple, quelle qu’en soit la cause.</p>
<div class="lab">Pourquoi cette prudence</div><p>Un code résiduel masque la cause. Un patient codé G83.9 ne dit rien du niveau de la lésion ni de l’urgence. Le code primaire n’est donc légitime que lorsque l’information manque.</p>
<div class="lab">Limite</div><p>La classification est celle de 2024 en CIM-10-GM. La correspondance avec la CIM-11 n’a pas été vérifiée dans ce dossier.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-codage-ces" data-title="Codes G83.40, G83.41 et G83.49">
<div class="lab">Les trois codes</div><table class="t"><thead><tr><th>Code</th><th>Libellé</th></tr></thead><tbody><tr><td>G83.40</td><td>Syndrome de la queue de cheval, complet</td></tr><tr><td>G83.41</td><td>Syndrome de la queue de cheval, incomplet</td></tr><tr><td>G83.49</td><td>Syndrome de la queue de cheval, non précisé</td></tr></tbody></table>
<div class="lab">Règle complémentaire</div><p>Pour documenter un trouble vésical neurogène, la classification demande d’ajouter un code G95.8-. Le code G83.4- note le syndrome ; le code G95.8- note la conséquence vésicale.</p>
<div class="lab">Limite</div><p>Aucune source lue ne donne la correspondance officielle entre ces codes et les catégories CESI (incomplet) et CESR (avec rétention). Il serait tentant d’associer G83.41 au CESI et G83.40 au CESR ; cette équivalence n’est pas documentée et n’est donc pas enseignée.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-faciale-centrale" data-title="Paralysie faciale centrale (G83.6)">
<div class="lab">Définition</div><p>Le code G83.6 désigne une parésie faciale par lésion du premier motoneurone. La paralysie faciale par lésion du deuxième motoneurone est périphérique et se code G51.0 : la classification l’exclut expressément de G83.6.</p>
<div class="lab">Lien anatomique</div><p>Les fibres corticobulbaires, qui commandent notamment les muscles de la face et de la langue, cheminent avec les faisceaux corticospinaux dans la partie ventrale du pont. Une lésion de cette zone peut donc associer une atteinte de la face et une atteinte des membres.</p>
<div class="lab">Lacune</div><p>Aucune source lue ne détaille la sémiologie qui distingue paralysie faciale centrale et périphérique, ni ses causes, ni sa conduite à tenir. Ces points ne sont pas enseignés ici ; ils doivent être lus dans une source avant d’être appris.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-anat-cauda" data-title="Queue de cheval : anatomie et segments">
<div class="lab">Anatomie</div><p>La moelle épinière se termine vers le niveau de la 2e vertèbre lombaire. Toutes les racines nées sous ce niveau forment la queue de cheval, dont les parties proximales des 3e, 4e et 5e lombaires et de la 1re sacrée.</p>
<div class="lab">Deux sens du mot « syndrome »</div><p>L’atteinte des racines 3e lombaire à 1re sacrée touche surtout les jambes. Historiquement, le syndrome de la queue de cheval désigne le dysfonctionnement des racines 2e à 5e racines sacrées, qui assurent la vessie, l’intestin, la sensibilité du périnée et la fonction sexuelle.</p>
<div class="lab">Conséquence clinique</div><p>Le symptôme qui fait l’urgence est sacré, non lombaire : une douleur de jambe sans trouble sphinctérien ni anesthésie en selle ne réalise pas le tableau.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-ces" data-title="Syndrome de la queue de cheval : définition pratique">
<div class="lab">Définition proposée</div><p>Une revue de 212 articles, qui avait recensé 17 définitions, propose la définition pratique suivante : diagnostic clinique résultant du dysfonctionnement d’une ou plusieurs racines sacrées à partir de la 2e, avec au moins un des éléments suivants : dysfonction vésicale ou intestinale, diminution de la sensibilité de la région en selle, dysfonction sexuelle.</p>
<div class="lab">Ce qui n’est pas indispensable</div><p>La douleur lombaire et des jambes, ainsi que les signes moteurs ou sensitifs des membres inférieurs, sont fréquents mais non indispensables au diagnostic.</p>
<div class="lab">Cause et confirmation</div><p>La compression radiculaire est la cause la plus fréquente. L’IRM est en général nécessaire pour confirmer.</p>
<div class="lab">Formulation suisse</div><p>La Revue Médicale Suisse définit le syndrome par l’apparition de troubles sphinctériens par compression des racines sacrées, avec rétention urinaire ou incontinence par regorgement, parésie des membres inférieurs de degré divers et anesthésie en selle.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et al., Revue Médicale Suisse 2010</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-cone" data-title="Cône terminal et queue de cheval">
<div class="lab">Distinction</div><table class="t"><thead><tr><th>Syndrome</th><th>Vertèbres lésées (traumatisme)</th><th>Structures atteintes</th></tr></thead><tbody><tr><td>Cône terminal</td><td>12e thoracique à 2e lombaire</td><td>Segment médullaire 12e thoracique jusqu’à la 5e racine sacrée</td></tr><tr><td>Queue de cheval</td><td>3e à 5e lombaires</td><td>Racines 3e lombaire à 5e sacrée</td></tr></tbody></table>
<div class="lab">Pronostic</div><p>L’hypothèse d’un meilleur pronostic fonctionnel du syndrome de la queue de cheval reste à tester : la revue ne la tient pas pour établie.</p>
<div class="lab">Limite</div><p>Cette distinction vient d’une revue de définitions du traumatisme. Elle ne dispense pas l’IRM de situer la lésion chez un patient donné.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28534496/" target="_blank" rel="noopener">Définitions du cône et de la queue de cheval traumatiques, Spinal Cord 2017</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-heterogeneite" data-title="Hétérogénéité des définitions">
<div class="lab">Constat</div><p>Dans une revue de 110 études (52 008 patients), seules 16 études, soit 14,5 %, employaient une définition établie (Fraser, BASS, Gleave et MacFarlane, entre autres). Une autre revue, de 212 articles, avait recensé 17 définitions.</p>
<div class="lab">Conséquence</div><p>Des études qui ne parlent pas de la même maladie ne se comparent pas facilement. Les fréquences, les délais et les pronostics publiés doivent être lus avec cette réserve.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37141301/" target="_blank" rel="noopener">Définition et délai chirurgical, PLoS One 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-cesi-cesr" data-title="CESI et CESR : stade incomplet et stade avec rétention">
<div class="lab">Classification de Gleave et MacFarlane (2002)</div><table class="t"><thead><tr><th>Stade</th><th>Miction</th><th>Particularité</th></tr></thead><tbody><tr><td>CESI (incomplet)</td><td>Troubles neurogènes (sensation altérée, perte du besoin, jet faible, poussée) ; contrôle volontaire conservé ; miction possible, même difficile</td><td>Hypoesthésie périnéale non indispensable</td></tr><tr><td>CESR (avec rétention)</td><td>Perte du contrôle volontaire ; rétention indolore avec regorgement</td><td>Le sondage précoce empêche distension et regorgement</td></tr></tbody></table>
<div class="lab">Valeur pronostique</div><p>Selon Gleave et MacFarlane, une fois au stade avec rétention, le délai opératoire n’influence plus le résultat ; ce point est contesté. DeLong observe un moins bon résultat avec une chirurgie plus tardive dans le stade avec rétention et rappelle que les deux stades ne doivent pas être analysés ensemble.</p>
<div class="lab">Pourquoi la rétention est indolore</div><p>Le patient perd la sensation de plénitude : la vessie se remplit sans signal, puis déborde. Le regorgement est l’écoulement de ce trop-plein, qu’il ne faut pas confondre avec une miction normale.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18377315/" target="_blank" rel="noopener">DeLong et al., J Neurosurg Spine 2008</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-tandon" data-title="Autres classifications et limites">
<div class="lab">Tandon et Sankaran</div><p>Cette classification décrit trois types de présentation. Le type 2 domine dans les litiges ; le type 3, souvent non urgent, concerne des patients plus âgés. Le détail des trois types n’était pas lisible dans le texte extrait : il n’est pas enseigné.</p>
<div class="lab">CESS, CESE, CESC</div><p>CESS désigne la suspicion (symptômes bilatéraux des jambes ou grosse hernie connue sans symptôme de queue de cheval). CESE désigne le stade précoce à symptômes seuls (hypoesthésie périnéale à vessie normale, ou changement mictionnel à sensibilité normale). CESC désigne le stade complet, avec perte de toutes les fonctions sensitives et motrices de la queue de cheval, pire que le stade avec rétention.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-fiabilite" data-title="Fiabilité des catégories : lire le kappa">
<div class="lab">Résultat</div><p>Sur 100 vignettes de cas réels, l’accord entre observateurs était insuffisant pour toutes les catégories. Le meilleur accord portait sur la question « syndrome avec rétention contre autres », avec un coefficient kappa de 0,34, soit un accord minimal. Les consultants spécialistes obtenaient 0,17.</p>
<div class="lab">Lecture du kappa</div><p>Le coefficient kappa mesure l’accord entre observateurs en retirant la part due au hasard. Il vaut 1 pour un accord parfait et 0 pour un accord égal au hasard. Des valeurs de 0,34 et de 0,17 sont donc proches de l’accord du hasard.</p>
<div class="lab">Conséquence</div><p>Un stade attribué par un observateur n’est pas reproduit par un autre. La décision d’imager et d’opérer ne doit pas dépendre de cette seule étiquette.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37652459/" target="_blank" rel="noopener">Fiabilité inter-observateurs des catégories, Bone Joint J 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-incidence" data-title="Fréquence du syndrome de la queue de cheval">
<div class="lab">Chiffres</div><table class="t"><thead><tr><th>Mesure</th><th>Valeur</th><th>Source</th></tr></thead><tbody><tr><td>Incidence publiée</td><td>0,34 à 7 pour 100 000 par an</td><td>Revue JBJS 2025</td></tr><tr><td>Prévalence parmi les lombalgiques</td><td>Environ 0,04 %</td><td>Revue Médicale Suisse 2010</td></tr><tr><td>Part des hernies discales lombaires</td><td>Environ 2 %</td><td>Kögl 2024</td></tr></tbody></table>
<div class="lab">Interprétation</div><p>Une prévalence de 0,04 % signifie environ 4 patients sur 10 000 lombalgiques. Le syndrome est donc rare, ce qui explique à la fois l’absence de familiarité des cliniciens et le risque de retard diagnostique.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39937930/" target="_blank" rel="noopener">Revue JBJS Reviews 2025</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et al., Revue Médicale Suisse 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et al., Dtsch Arztebl Int 2024</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-hernie" data-title="Hernie discale lombaire et queue de cheval">
<div class="lab">Cause principale</div><p>La hernie discale lombaire massive est la cause la plus fréquente du syndrome. À l’inverse, le syndrome ne complique qu’environ 2 % des hernies discales lombaires.</p>
<div class="lab">Série décrite</div><p>Dans une série de 44 hernies discales, tous les patients avaient une rétention ou une incontinence par regorgement avec anesthésie en selle, et l’installation s’était faite en moins de 24 heures chez 89 %.</p>
<div class="lab">Conséquence</div><p>La hernie est fréquente et son syndrome est rare : ce n’est pas la hernie qui fait l’urgence, mais l’atteinte sacrée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et al., Dtsch Arztebl Int 2024</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et al., Revue Médicale Suisse 2010</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-iatrogene" data-title="Causes iatrogènes documentées">
<div class="lab">Injection péridurale non guidée</div><p>Deux cas ont été rapportés à l’hôpital Balgrist : un syndrome de la queue de cheval avec arachnoïdite, et un syndrome du cône après ponction durale. Les séquelles vésico-intestinales persistaient deux ans plus tard.</p>
<div class="lab">Bloc des branches médiales</div><p>Après un bloc unilatéral des branches médiales lombaires avec méthylprednisolone particulaire, des lésions ischémiques de la queue de cheval ont été visibles à l’IRM (cas de Morges).</p>
<div class="lab">Limite</div><p>Ce sont des cas isolés : ils ne donnent pas de fréquence et ne démontrent pas un mécanisme. Ils justifient une question d’anamnèse sur les injections récentes.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40859168/" target="_blank" rel="noopener">Deux cas après injection péridurale non guidée, BMC Neurol 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35352467/" target="_blank" rel="noopener">Syndrome après blocs des branches médiales, Pain Pract 2022</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-retention" data-title="Rétention urinaire dans le syndrome">
<div class="lab">Chiffres</div><p>La rétention urinaire a une sensibilité d’environ 90 % pour le syndrome. En son absence, la probabilité du syndrome est d’environ 1 sur 10 000.</p>
<div class="lab">Lecture</div><p>Une sensibilité élevée signifie que presque tous les malades ont le signe. Son absence rend le diagnostic très improbable, d’où l’importance de la question. Mais la présence du signe ne prouve pas le syndrome : la spécificité n’est pas rapportée.</p>
<div class="lab">Piège de l’interrogatoire</div><p>L’incontinence est un stade tardif. Il faut interroger la sensation de besoin, le jet, la poussée et la fréquence. Le patient qui n’est pas incontinent peut déjà être en rétention.</p><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et al., Revue Médicale Suisse 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-drapeaux" data-title="Drapeaux rouges : neuf recommandations comparées">
<div class="lab">Consensus</div><table class="t"><thead><tr><th>Signe</th><th>Recommandations (sur 9)</th></tr></thead><tbody><tr><td>Trouble sensitif périanal, périnéal ou en selle</td><td>Toutes</td></tr><tr><td>Dysfonction vésicale ou intestinale</td><td>Toutes</td></tr><tr><td>Douleur radiculaire</td><td>8</td></tr><tr><td>Faiblesse motrice nouvelle</td><td>5</td></tr><tr><td>Résidu post-mictionnel</td><td>5</td></tr><tr><td>Toucher rectal</td><td>4</td></tr></tbody></table>
<div class="lab">Valeur d’un drapeau isolé</div><p>La sciatique bilatérale a une sensibilité de 32,4 %, une valeur prédictive positive de 17,2 % et une valeur prédictive négative de 88,3 % (260 suspicions, étude prospective). Elle ne sert donc ni à confirmer ni à écarter.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40000448/" target="_blank" rel="noopener">Revue des recommandations internationales, Eur Spine J 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32475252/" target="_blank" rel="noopener">Étude prospective du résidu post-mictionnel, Bone Joint J 2020</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-irm" data-title="IRM : examen de choix">
<div class="lab">Indication</div><p>L’IRM est l’examen de choix. Toutes les recommandations internationales revues la demandent en urgence devant des drapeaux rouges. La Revue Médicale Suisse précise que le scanner montre bien l’os mais analyse mal la queue de cheval, le sac dural et le liquide cérébrospinal.</p>
<div class="lab">Délais</div><p>Le standard britannique BASS demande une IRM immédiate, dans l’heure qui suit la présentation aux urgences. Le parcours britannique de 2025 demande une IRM disponible 24 heures sur 24, avec des séquences standardisées, et une imagerie plus proximale si la queue de cheval n’est pas comprimée.</p>
<div class="lab">IRM négative</div><p>Un patient peut avoir des symptômes de type syndrome sans compression : c’est le groupe décrit par Hoeritzauer, non chirurgical.</p><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et al., Revue Médicale Suisse 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40000448/" target="_blank" rel="noopener">Revue des recommandations internationales, Eur Spine J 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42053010/" target="_blank" rel="noopener">Revue narrative 2025 (parcours GIRFT), Br J Hosp Med</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38186331/" target="_blank" rel="noopener">Miller et al., Br J Hosp Med 2023 (standards BASS)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8782783/" target="_blank" rel="noopener">Définition et classification du syndrome de la queue de cheval, Int Orthop 2021</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-pvr" data-title="Résidu post-mictionnel : performances et limites">
<div class="lab">Étude prospective</div><p>Sur 260 patients, le seuil de 200 mL ou plus donnait une sensibilité de 94,1 %, une spécificité de 66,8 %, une valeur prédictive positive de 29,9 % et une valeur prédictive négative de 98,7 %. Treize pour cent des patients, classés à bas risque, ont eu une IRM non urgente sans compression retrouvée.</p>
<div class="lab">Méta-analyse</div><p>Sur sept études (734 patients analysables, 125 syndromes confirmés), 200 mL est le meilleur seuil, avec une sensibilité de 82 % et une spécificité de 65 %. L’intervalle de confiance publié pour la spécificité est incohérent avec la valeur ponctuelle : il n’est pas cité. Les auteurs concluent à un usage en complément, non comme outil d’exclusion.</p>
<div class="lab">Parcours britannique</div><p>Le scanner vésical est un outil d’inclusion (« rule-in »), non d’exclusion.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32475252/" target="_blank" rel="noopener">Étude prospective du résidu post-mictionnel, Bone Joint J 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37121596/" target="_blank" rel="noopener">Boktor et al., Bone Joint J 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42053010/" target="_blank" rel="noopener">Revue narrative 2025 (parcours GIRFT), Br J Hosp Med</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-pvr-calcul" data-title="Calcul : résidu de la vignette">
<div class="lab">Calcul</div><p>Le résidu mesuré dans la vignette est de 350 mL ; le seuil est de 200 mL. L’écart est 350 − 200 = 150 mL au-dessus du seuil. Le test est donc positif.</p>
<div class="lab">Interprétation</div><p>Selon l’étude prospective, un test positif a une valeur prédictive positive de 29,9 % : ce résultat seul ne confirme pas le syndrome, mais il justifie une IRM urgente, que le tableau clinique impose de toute façon. Dans la vignette, la combinaison d’un résidu élevé, d’une rétention et d’une anesthésie en selle rend l’IRM immédiate.</p>
<div class="lab">Limite</div><p>Les chiffres de la vignette sont fictifs.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32475252/" target="_blank" rel="noopener">Étude prospective du résidu post-mictionnel, Bone Joint J 2020</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-delai" data-title="Décompression chirurgicale : délai et niveau de preuve">
<div class="lab">Recommandations</div><p>En Suisse, la lombosciatique avec syndrome de la queue de cheval est adressée en urgence en milieu hospitalier. En Allemagne, c’est une urgence chirurgicale absolue avec décompression dans les 24 à 48 heures. Selon le parcours britannique de 2025, la décompression est en général faite dans les 24 heures.</p>
<div class="lab">Preuves</div><p>Les études sont observationnelles ou des méta-analyses d’études observationnelles. Une revue de 2025 note que le délai optimal est débattu. Aucun essai randomisé n’est cité dans les sources lues.</p>
<div class="lab">Lecture</div><p>Le consensus porte sur l’urgence, non sur un délai exact. Le cours retient « aussi tôt que possible, au plus tard 48 heures ».</p><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz et al., Revue Médicale Suisse 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et al., Dtsch Arztebl Int 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42053010/" target="_blank" rel="noopener">Revue narrative 2025 (parcours GIRFT), Br J Hosp Med</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39937930/" target="_blank" rel="noopener">Revue JBJS Reviews 2025</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-ahn" data-title="Ahn 2000">
<div class="lab">Étude</div><p>Cette méta-analyse porte sur 322 patients opérés d’un syndrome secondaire à une hernie discale lombaire. Elle trouve un avantage significatif d’une chirurgie à 48 heures ou moins par rapport à plus de 48 heures pour les résultats sensitif, moteur, urinaire et rectal. Elle ne trouve pas de différence entre moins de 24 heures et 24 à 48 heures.</p>
<div class="lab">Rapports de cotes rapportés par Kögl</div><table class="t"><thead><tr><th>Résultat</th><th>Rapport de cotes</th></tr></thead><tbody><tr><td>Incontinence urinaire</td><td>2,5</td></tr><tr><td>Déficit moteur</td><td>9,1</td></tr><tr><td>Dysfonction rectale</td><td>9,1</td></tr><tr><td>Déficit sensitif</td><td>3,5</td></tr></tbody></table>
<div class="lab">Autres facteurs</div><p>Une douleur lombaire chronique préopératoire et une dysfonction rectale préopératoire annoncent un moins bon résultat urinaire ; un âge plus élevé annonce une moins bonne fonction sexuelle.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/10851100/" target="_blank" rel="noopener">Ahn et al., Spine 2000</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et al., Dtsch Arztebl Int 2024</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-kumar" data-title="Kumar 2022 (cité par Kögl)">
<div class="lab">Étude</div><p>Cette revue regroupe 22 études, 852 patients, avec un suivi d’au moins un an. L’incontinence urinaire résiduelle est de 24,6 % lorsque la chirurgie a lieu en 48 heures ou moins, contre 50,3 % au-delà.</p>
<div class="lab">Lecture</div><p>Le risque d’incontinence résiduelle double environ quand l’opération a lieu après 48 heures. L’association n’est pas une preuve de causalité : les patients opérés tard peuvent aussi être ceux dont le tableau est le plus avancé.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et al., Dtsch Arztebl Int 2024</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-meta2026" data-title="Méta-analyse 2026 sur le délai">
<div class="lab">Étude</div><p>Quinze études, 26 627 adultes, syndrome dégénératif. Une chirurgie à 48 heures ou moins améliore la récupération urinaire (rapport de cotes environ 2,3), motrice et neurologique.</p>
<div class="lab">Nuances</div><p>L’effet est fort dans le syndrome incomplet. Il n’y a pas de différence significative liée au délai dans le syndrome avec rétention. Il n’y a pas d’avantage constant de moins de 24 heures contre 24 à 48 heures. À 12 mois ou plus, les différences s’atténuent et l’état vésical de départ domine le pronostic. Dans les bases nationales, la mortalité et la durée de séjour sont accrues au-delà de 48 heures.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41991105/" target="_blank" rel="noopener">Méta-analyse du délai chirurgical, Spine J 2026</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-delong" data-title="DeLong 2008">
<div class="lab">Étude</div><p>Cette méta-analyse d’études observationnelles porte sur le syndrome avec rétention. Le risque relatif d’un résultat moyen ou mauvais est plus élevé avec une chirurgie plus tardive : 1,77 à 2,19 selon le seuil de délai.</p>
<div class="lab">Lecture</div><p>Le stade incomplet et le stade avec rétention ne doivent pas être analysés ensemble. Ce travail s’oppose à l’idée que le délai n’importe plus au stade avec rétention.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18377315/" target="_blank" rel="noopener">DeLong et al., J Neurosurg Spine 2008</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-sequelles" data-title="Séquelles après syndrome de la queue de cheval">
<div class="lab">Fréquences</div><table class="t"><thead><tr><th>Séquelle</th><th>Fréquence</th></tr></thead><tbody><tr><td>Incontinence urinaire</td><td>43 %</td></tr><tr><td>Dysfonction rectale</td><td>31 %</td></tr><tr><td>Déficit sensitif</td><td>53 %</td></tr><tr><td>Déficit moteur</td><td>38 %</td></tr><tr><td>Dysfonction sexuelle</td><td>40 % (Kumar) ; 70 % des hommes et 60 % des femmes (Sangondimath)</td></tr></tbody></table>
<div class="lab">Lecture</div><p>Les chiffres viennent d’une synthèse et de deux études différentes pour la dysfonction sexuelle. Ils décrivent des populations et des définitions variables.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl et al., Dtsch Arztebl Int 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41991105/" target="_blank" rel="noopener">Méta-analyse du délai chirurgical, Spine J 2026</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-lis" data-title="Locked-in syndrome : définition et formes">
<div class="lab">Définition</div><p>Le locked-in syndrome est une tétraplégie avec mouvements verticaux des yeux et des paupières préservés et capacités cognitives conservées. Plum et Posner l’ont décrit en 1972.</p>
<div class="lab">Formes (Bauer, 1979)</div><table class="t"><thead><tr><th>Forme</th><th>Caractère</th></tr></thead><tbody><tr><td>Classique</td><td>Tétraplégie, anarthrie, seuls mouvements verticaux des yeux et clignement</td></tr><tr><td>Incomplète</td><td>Davantage de motricité volontaire ; peut être une étape de récupération</td></tr><tr><td>Complète</td><td>Aucun mouvement volontaire ni communication directe ; examens complémentaires indispensables</td></tr><tr><td>Locked-in plus</td><td>Troubles de la conscience associés (terme du Salzburg Coma Group)</td></tr></tbody></table>
<div class="lab">Codage</div><p>La CIM-10-GM code ce syndrome G83.5, avec le libellé « syndrome de déefférentation motrice ».</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-pont" data-title="Faisceaux du pont ventral">
<div class="lab">Anatomie</div><p>Dans la partie ventrale du pont cheminent côte à côte les faisceaux corticospinaux, qui commandent la motricité du corps, et les faisceaux corticobulbaires, qui commandent les nerfs crâniens caudaux (parole et langue).</p>
<div class="lab">Conséquence</div><p>Une lésion ventrale unique interrompt les deux faisceaux : le corps est paralysé et la parole est impossible, d’où la tétraplégie et l’anarthrie.</p>
<div class="lab">Regard</div><p>Les mouvements horizontaux sont perdus si la formation réticulée pontique paramédiane est atteinte. Les mouvements verticaux et le releveur de la paupière dépendent du mésencéphale (noyau interstitiel rostral du faisceau longitudinal médian, noyau interstitiel de Cajal, commissure postérieure, noyaux des nerfs oculomoteur et trochléaire) et sont préservés dans la forme classique ; leur atteinte donne la forme complète.</p>
<div class="lab">Conscience</div><p>Elle est altérée si la lésion s’étend au mésencéphale et au thalamus médian, ou au tegmentum dorsal (système réticulé activateur ascendant).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-warning" data-title="Pontine warning syndrome et causes">
<div class="lab">Pontine warning syndrome</div><p>Ce syndrome associe des symptômes moteurs ou sensitifs récidivants et fluctuants. Il comporte un haut risque d’infarctus basilaire, ce qui en fait une alerte avant l’installation du locked-in syndrome.</p>
<div class="lab">Autres causes</div><p>Dissection, anévrisme, myélinolyse centropontine, traumatisme crânien, tumeur, abcès, sclérose en plaques, hypoglycémie prolongée. Des états « locked-in like » existent dans la sclérose latérale amyotrophique avancée, le syndrome de Guillain-Barré sévère et les morsures de serpent.</p>
<div class="lab">Pronostic</div><p>Dans une série de 139 cas de 1986, la mortalité était de 60 %, surtout dans les quatre premiers mois. Une étude plus récente cite 75 % en phase aiguë. Les décès sont dus surtout aux complications pulmonaires et à une nouvelle atteinte du tronc.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-lis-ddx" data-title="Locked-in syndrome et troubles de la conscience">
<div class="lab">Diagnostics différentiels</div><table class="t"><thead><tr><th>État</th><th>Lésions</th></tr></thead><tbody><tr><td>Syndrome d’éveil non répondant (UWS)</td><td>Surtout supratentorielles</td></tr><tr><td>État de conscience minimale (MCS)</td><td>Surtout supratentorielles</td></tr><tr><td>Dissociation cognitivo-motrice (CMD)</td><td>Surtout supratentorielles</td></tr><tr><td>Mutisme akinétique</td><td>Surtout supratentorielles</td></tr><tr><td>Locked-in syndrome</td><td>Tronc cérébral</td></tr></tbody></table>
<div class="lab">Délai du diagnostic</div><p>Le délai moyen dépasse deux mois. Dans un quart des cas seulement, le médecin est le premier à reconnaître la conscience du patient (étude de 2002).</p>
<div class="lab">Conduite</div><p>Examen clinique répété et structuré, IRM ; sans communication établie, IRM fonctionnelle ou paradigmes d’EEG actifs.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-crs" data-title="Échelle CRS-R">
<div class="lab">Rôle</div><p>L’échelle CRS-R est l’étalon pour séparer le syndrome d’éveil non répondant de l’état de conscience minimale.</p>
<div class="lab">Limite</div><p>Elle manque les patients sans sortie comportementale, comme certains locked-in syndromes complets : l’absence de réponse mesurable ne démontre pas l’absence de conscience.</p>
<div class="lab">Recommandation</div><p>L’EAN propose une évaluation multimodale des troubles de la conscience (clinique, imagerie, paradigmes d’EEG actifs ou d’IRM fonctionnelle).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-eso" data-title="Recommandation ESO/ESMINT 2024 sur l’occlusion basilaire">
<div class="lab">Niveau de preuve</div><p>La certitude des preuves est généralement très faible et de nombreux énoncés reposent sur un consensus d’experts.</p>
<div class="lab">Énoncés</div><table class="t"><thead><tr><th>Situation</th><th>Énoncé</th></tr></thead><tbody><tr><td>Thrombolyse intraveineuse</td><td>Jusqu’à 24 heures sauf contre-indication (consensus)</td></tr><tr><td>Association</td><td>Thrombolyse puis traitement endovasculaire plutôt que traitement endovasculaire direct</td></tr><tr><td>NIHSS ≥ 10</td><td>Traitement endovasculaire et meilleur traitement médical plutôt que traitement médical seul (certitude très faible)</td></tr><tr><td>NIHSS &lt; 10</td><td>Aucune preuve en faveur du traitement endovasculaire</td></tr></tbody></table>
<div class="lab">Contexte</div><p>L’occlusion de l’artère basilaire représente 1 à 2 % des accidents vasculaires cérébraux, avec une évolution naturelle très défavorable.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/38752743/" target="_blank" rel="noopener">Recommandation ESO/ESMINT 2024, occlusion de l’artère basilaire</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-communication" data-title="Communication, récupération et qualité de vie">
<div class="lab">Communication</div><p>Des interfaces cerveau-ordinateur, surtout par EEG, sont employées. Dans une enquête, 63 % des patients utilisent des aides techniques avancées.</p>
<div class="lab">Récupération</div><p>72 % des patients chroniques d’une enquête récupèrent des mouvements fonctionnels, la récupération distale étant plus probable.</p>
<div class="lab">Qualité de vie</div><p>72 % se déclarent heureux ; 7 % expriment un souhait d’euthanasie. Les soignants sous-estiment le bien-être : 9 % des professionnels d’une enquête européenne pensent que ces patients ne ressentent pas la douleur, alors que la moitié des patients d’une enquête française en rapportent.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-todd" data-title="Paralysie de Todd">
<div class="lab">Codage</div><p>La paralysie de Todd (postcritique) est incluse dans G83.8 « autres syndromes paralytiques précisés ».</p>
<div class="lab">Période postcritique</div><p>Une revue systématique de 78 articles (45 en méta-analyse) a recensé 31 manifestations. Leur durée est habituellement inférieure à 24 heures, jusqu’à deux mois pour certains symptômes physiques et cognitivo-comportementaux.</p>
<div class="lab">Lacunes</div><p>La fréquence et la durée propres à la parésie de Todd, sa physiopathologie et sa conduite ne figurent pas dans les sources lues.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30978637/" target="_blank" rel="noopener">Subota et al., période postcritique, Epilepsy Behav 2019</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-mimics" data-title="Simulateurs d’AVC (stroke mimics)">
<div class="lab">Fréquence</div><p>Aux urgences d’un hôpital universitaire italien, 46,7 % des suspicions d’AVC de 6 998 patients (étude rétrospective) étaient des simulateurs. Un score de triage à 10 variables avait une aire sous la courbe de 0,777 et 0,774 en validation.</p>
<div class="lab">Parmi les thrombolysés</div><p>Sur 330 patients thrombolysés sans signe ischémique précoce ni occlusion (Lituanie), 11,2 % étaient des simulateurs. Les prédicteurs étaient un âge plus jeune, des symptômes sensitifs, un antécédent de migraine ou d’épilepsie et l’absence de fibrillation auriculaire. Aucune hémorragie intracrânienne n’est survenue chez les simulateurs thrombolysés.</p>
<div class="lab">Limite</div><p>Une aire sous la courbe de 0,77 correspond à une discrimination moyenne : le score aide au triage mais ne remplace pas l’évaluation.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40375550/" target="_blank" rel="noopener">Stroke Mimics Score, Eur Stroke J 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41426999/" target="_blank" rel="noopener">Klimbytė et al., Front Neurol 2025</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-monoparesie" data-title="Monoparésie, diplégie brachiale et codage">
<div class="lab">Codes</div><table class="t"><thead><tr><th>Code</th><th>Contenu</th></tr></thead><tbody><tr><td>G83.0</td><td>Diparésie et diplégie des membres supérieurs (paralysie des deux membres supérieurs)</td></tr><tr><td>G83.1</td><td>Monoplégie d’un membre inférieur (paralysie d’une jambe)</td></tr><tr><td>G83.2</td><td>Monoparésie et monoplégie d’un membre supérieur (paralysie d’un bras)</td></tr><tr><td>G83.3</td><td>Monoparésie et monoplégie, sans précision</td></tr></tbody></table>
<div class="lab">Lacune</div><p>Les causes et la démarche devant ces tableaux n’ont pas été lues. Le cours n’en propose aucune.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g80-g83.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G80–G83</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-lioresal-it" data-title="Liorésal intrathécal® (baclofène)">
<div class="lab">Mécanisme</div><p>Antispastique à point d’impact médullaire : il ralentit la transmission réflexe monosynaptique et polysynaptique par stimulation des récepteurs GABA-B. La transmission neuromusculaire n’est pas modifiée.</p>
<div class="lab">Indication</div><p>Spasticité chronique grave d’origine médullaire (traumatisme, sclérose en plaques, autres atteintes médullaires) ou cérébrale, ne répondant pas aux antispastiques oraux ou provoquant des effets indésirables inacceptables aux doses orales efficaces.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité ; voies intramusculaire, intraveineuse, péridurale, sous-cutanée ; épilepsie résistante au traitement.</p>
<div class="lab">Après traumatisme crânien</div><p>Traitement au long cours seulement quand la spasticité est stabilisée, au plus tôt un an après la lésion.</p>
<div class="lab">Prudence</div><p>Si une part de spasticité est nécessaire à la station debout, à l’équilibre ou à la marche.</p><p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Liorésal intrathécal, Swissmedic (AIPS via AmiKo)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10064471/" target="_blank" rel="noopener">Schnetzer et al., Locked-in syndrome revisited, Ther Adv Neurol Disord 2023</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-test-baclofene" data-title="Phase de test du baclofène intrathécal">
<div class="lab">Schéma</div><table class="t"><thead><tr><th>Étape</th><th>Adulte</th><th>Enfant</th></tr></thead><tbody><tr><td>Dose initiale</td><td>25 ou 50 µg en bolus intrathécal</td><td>25 µg</td></tr><tr><td>Paliers</td><td>25 µg, à au moins 24 heures d’intervalle</td><td>Selon l’information professionnelle</td></tr><tr><td>Objectif</td><td>Effet de 4 à 8 heures</td><td>Selon l’information professionnelle</td></tr></tbody></table>
<div class="lab">Sécurité</div><p>Le test se fait dans un centre équipé, avec matériel de réanimation prêt : le produit peut provoquer une dépression du système nerveux central, un collapsus ou une insuffisance respiratoire. La pompe n’est implantée qu’après évaluation de la réponse.</p>
<div class="lab">Calcul pédagogique</div><p>Une série de tests à 25, 50 puis 75 µg compte trois paliers à au moins 24 heures d’intervalle, soit au moins 48 heures entre la première et la dernière dose.</p><p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Liorésal intrathécal, Swissmedic (AIPS via AmiKo)</a>, lues le 15 octobre 2026.</p></template>
<template data-pop="g83-sevrage" data-title="Sevrage du baclofène intrathécal">
<div class="lab">Règle</div><p>L’arrêt est toujours progressif, sauf surdosage urgent. Il ne faut jamais interrompre soudainement le traitement : le sevrage peut mettre la vie en danger.</p>
<div class="lab">Surdosage</div><p>Hypotonie excessive, somnolence, vertiges, sédation, crises, hypothermie, ptyalisme, nausées ; en cas de fort surdosage, dépression respiratoire, apnée et coma.</p>
<div class="lab">Limite</div><p>Les signes cliniques détaillés du sevrage n’ont pas été extraits du dossier : ils se lisent dans l’information professionnelle.</p><p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Liorésal intrathécal, Swissmedic (AIPS via AmiKo)</a>, lues le 15 octobre 2026.</p></template>
