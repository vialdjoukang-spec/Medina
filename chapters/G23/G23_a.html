<p>Dans cette <b>vignette fictive</b>, un homme de 62 ans consulte pour un syndrome parkinsonien installé depuis deux ans. Il est tombé trois fois en arrière en quatre mois. Les comprimés de lévodopa prescrits par son médecin traitant n’ont presque rien modifié. Il se plaint aussi d’étourdissements au lever et de mictions impérieuses. Ces éléments sont choisis pour illustrer la question du chapitre : devant un parkinsonisme qui chute tôt, répond peu à la lévodopa ou s’accompagne d’une atteinte autonome précoce, de quelle maladie s’agit-il, et que peut-on réellement lui offrir ?</p>
<p>Le groupe G23 de la classification CIM-10-GM 2024 répond à cette question en réunissant des maladies rares : l’<button class="w" data-k="g23-ams">atrophie multisystématisée (définition et sous-types)</button>, la <button class="w" data-k="g23-psp">paralysie supranucléaire progressive (définition et phénotypes)</button>, la <button class="w" data-k="g23-nbia">neurodégénérescence avec accumulation cérébrale de fer (PKAN)</button>, la calcification des noyaux gris centraux et, par rattachement de codage non vérifié, la <button class="w" data-k="g23-dcb">dégénérescence corticobasale (diagnostic neuropathologique et syndrome clinique)</button>. Leur point commun clinique est un syndrome parkinsonien atypique, plus rare que la maladie de Parkinson, d’évolution nettement plus rapide et de réponse dopaminergique faible ou nulle selon Parkinson Suisse (<a href="https://www.parkinson.ch/fr/themen/syndromes-parkinsoniens-atypiques" target="_blank" rel="noopener">Parkinson Suisse, syndromes parkinsoniens atypiques 2025</a>).</p>
<p>Quatre questions guident la lecture : quels signes font douter d’une maladie de Parkinson, quels critères internationaux distinguent les entités, quelles complications engagent le pronostic (surtout la dysphagie et l’hypotension orthostatique neurogène), et que peut faire la prise en charge. La réponse est sobre : aucun traitement modificateur de la maladie n’est approuvé, de sorte que la décision porte sur la rééducation, sur des essais thérapeutiques bornés et sur le traitement des complications.</p>
<div class="key"><b>À retenir.</b> Un parkinsonisme avec chutes précoces, dysautonomie précoce, trouble oculomoteur vertical ou syndrome cérébelleux doit faire évoquer un syndrome parkinsonien atypique. Le diagnostic reste clinique, probabiliste et révisable ; le diagnostic définitif relève de l’examen du tissu cérébral.</div>
</section>

<section class="ilot" id="g23-1"><h2><span class="n">1</span>Définitions et classification</h2>
<p>La CIM-10-GM 2024 de l’Office fédéral de la statistique, dans la version française, et la classification allemande de l’Institut fédéral des médicaments et dispositifs médicaux (BfArM) découpent la catégorie G23 en six sous-codes (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, libellés français (OFS)</a>). Le tableau suivant les énumère. La colonne de droite indique l’entité clinique qui correspond à chacun d’après les sources lues, avec les mentions d’inclusion et d’exclusion de la classification allemande (<button class="w" data-k="g23-cim">sous-codes, inclusions et limites du codage</button>).</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé</th><th>Entité clinique</th></tr></thead><tbody>
<tr><td>G23.0</td><td>Maladie de Hallervorden-Spatz</td><td>Neurodégénérescence avec accumulation cérébrale de fer, surtout <button class="w" data-k="g23-nbia">PKAN</button> ; inclut la dégénérescence pigmentaire du pallidum</td></tr>
<tr><td>G23.1</td><td>Ophtalmoplégie supranucléaire progressive [Steele-Richardson-Olszewski]</td><td><button class="w" data-k="g23-psp">Paralysie supranucléaire progressive</button></td></tr>
<tr><td>G23.2</td><td>Atrophie multisystématisée de forme Parkinson [AMS-P]</td><td><button class="w" data-k="g23-ams">Atrophie multisystématisée</button>, forme parkinsonienne</td></tr>
<tr><td>G23.3</td><td>Atrophie multisystématisée de forme cérébelleuse [AMS-C]</td><td><button class="w" data-k="g23-ams">Atrophie multisystématisée</button>, forme cérébelleuse</td></tr>

<tr><td>G23.9</td><td>Maladie dégénérative des noyaux gris centraux, sans précision</td><td>Catégorie de repli</td></tr>
</tbody></table>
<p>Ce tableau relie un code à une entité, mais il ne donne pas les critères qui permettent de poser le diagnostic. Ces critères sont présentés à la section 7. Il faut retenir ici que la même maladie peut être codée de deux manières : l’atrophie multisystématisée dépend de la forme dominante (parkinsonienne, G23.2 ; cérébelleuse, G23.3), alors que l’hypotension orthostatique d’origine non précisée relève de la catégorie I95.1 et non de G23 selon l’exclusion de la classification allemande (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a>).</p>
<h3>1.1 Définitions des entités</h3>
<p>L’<b>atrophie multisystématisée</b> (AMS) est une maladie neurodégénérative sporadique, progressive, de l’adulte de plus de 30 ans. Elle associe une perte neuronale et une gliose dans le système striato-nigrique, le système olivo-ponto-cérébelleux et les centres autonomes. Son marqueur histologique est la présence d’inclusions cytoplasmiques d’α-synucléine dans les oligodendrocytes (<a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>). Cette localisation <b>oligodendrogliale</b> la distingue de la maladie de Parkinson et de la démence à corps de Lewy, où les corps de Lewy siègent dans les neurones (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>) : <button class="w" data-k="g23-gci">inclusions oligodendrogliales (marqueur histologique)</button>.</p>
<p>La <b>paralysie supranucléaire progressive</b> (PSP) est une tauopathie. Elle est définie sur le plan neuropathologique par l’agrégation de la protéine tau, surtout de l’isoforme à quatre répétitions (4R), sous forme de dégénérescences neurofibrillaires, de <i>coiled bodies</i> oligodendrogliaux et d’astrocytes touffus. Les dépôts prédominent dans les noyaux gris centraux et le tronc cérébral. Le diagnostic définitif est neuropathologique (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p>La <b>dégénérescence corticobasale</b> (DCB) est une tauopathie 4R primaire, avec plaques astrocytaires et neurones ballonnés, dont l’atteinte corticale est plus fréquente. Le terme DCB désigne aujourd’hui un diagnostic neuropathologique ; le tableau clinique correspondant s’appelle <b>syndrome corticobasal</b> (SCB), et un SCB peut avoir une autre cause neuropathologique (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<p>La <b>neurodégénérescence avec accumulation cérébrale de fer</b> (NBIA) est un groupe hétérogène de maladies génétiques rares caractérisées par une accumulation de fer dans les noyaux gris centraux visible à l’imagerie par résonance magnétique. La forme la plus fréquente est la neurodégénérescence associée à la pantothénate kinase (PKAN), environ la moitié des cas (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>). La <b>calcification cérébrale primaire familiale</b> (PFBC, ancienne « maladie de Fahr ») est définie par des calcifications bilatérales des noyaux gris centraux, parfois du thalamus, du cervelet et de la substance blanche (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<div class="trap"><span class="k">Piège</span> La dégénérescence corticobasale n’a pas de sous-code nommé dans G23. Son rattachement à G23.8 est une inférence de codage que le dossier de sources n’a pas pu vérifier dans l’index alphabétique. Le syndrome de Shy-Drager est une dénomination historique encore présente dans la classification (G23.8), assimilée à l’atrophie multisystématisée sans source moderne lue sur son statut actuel.</div>
<div class="key"><b>À retenir.</b> Trois mots à ne pas confondre : DCB (diagnostic neuropathologique), SCB (tableau clinique) et AMS-P ou AMS-C (sous-types cliniques d’une seule maladie, caractérisée par l’α-synucléine). Le code CIM sert au codage ; il ne remplace pas les critères diagnostiques.</div>

</section>

<section class="ilot" id="g23-2"><h2><span class="n">2</span>Fréquence et évolution</h2>
<p>Ces maladies sont rares, et aucune étude épidémiologique suisse n’a été lue. Deux fiches de Parkinson Suisse, rédigées par des neurologues suisses, donnent des ordres de grandeur. L’atrophie multisystématisée débute après la cinquantaine, avec une prévalence d’environ 4 pour 100 000 et une espérance de vie de six à dix ans après les premiers symptômes (<a href="https://www.parkinson.ch/fileadmin/parkinson/docs/diverse_fr/latrophie_multi-systematisee_f_ams_129_27_parkinson.pdf" target="_blank" rel="noopener">Parkinson Suisse, fiche AMS (professeur Sturzenegger)</a>). La paralysie supranucléaire progressive représente 4 à 6 % des syndromes parkinsoniens, ne débute pas avant 40 à 50 ans et évolue en 2 à 12 ans, en moyenne 5 à 7 ans (<a href="https://www.parkinson.ch/fileadmin/parkinson/docs/diverse_fr/paralysie_supranucleaire_progressive_f_psp_130_27_parkinson.pdf" target="_blank" rel="noopener">Parkinson Suisse, fiche PSP (professeur Ghika)</a>). Ces chiffres sont des estimations d’experts, sans population ni méthode décrites ; les revues européennes du tableau restent la référence chiffrée. Les autres chiffres proviennent de revues européennes et d’une cohorte américaine. Le tableau les rassemble avec leur provenance, car les chiffres ne se comparent pas entre eux sans connaître la population étudiée (<button class="w" data-k="g23-epidemio-limites">limites des chiffres épidémiologiques</button>).</p>
<table class="t"><thead><tr><th>Entité</th><th>Fréquence</th><th>Début et évolution</th><th>Source</th></tr></thead><tbody>
<tr><td>PSP</td><td>Prévalence 5–6 pour 100 000 ; rapport hommes/femmes proche de 1</td><td>Début moyen aux 6e–7e décennies ; survie moyenne de 6 à 9 ans</td><td><a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></td></tr>
<tr><td>DCB</td><td>Prévalence proche de 1 pour 100 000</td><td>Démence chez plus de la moitié des patients aux stades avancés ; la survie propre à la DCB n’est pas rapportée séparément dans le dossier</td><td><a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a></td></tr>
<tr><td>AMS</td><td>Prévalence de 1,9 à 3,4 pour 100 000 (chiffres cités par une cohorte américaine)</td><td>Âge moyen de début d’environ 55 ans ; espérance de vie moyenne d’environ 7 ans après le diagnostic</td><td><a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a></td></tr>
<tr><td>NBIA</td><td>Prévalence estimée à environ 1 pour 500 000 ; PKAN environ la moitié des cas</td><td>PKAN classique : début vers 3 ans en moyenne</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a></td></tr>
<tr><td>PFBC</td><td>Environ un tiers des porteurs de calcifications sont asymptomatiques</td><td>Troubles moteurs, cognitifs et psychiatriques</td><td><a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a></td></tr>
</tbody></table>
<p>Le tableau appelle trois commentaires. Premièrement, la durée de survie courte (6 à 9 ans pour la PSP, environ 7 ans pour l’AMS) explique pourquoi le pronostic et les soins palliatifs sont abordés dès le diagnostic. Deuxièmement, aucun cas d’AMS autopsié n’a débuté avant la troisième décennie (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>), ce qui justifie la limite d’âge des critères. Troisièmement, la répartition des sous-types varie selon les populations : la forme parkinsonienne prédomine en Europe, alors que la forme cérébelleuse atteint jusqu’à 73 % des cas en Asie de l’Est (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<p>La progression de l’AMS est rapide : environ un tiers des patients utilisent une aide à la marche dans les trois ans, et jusqu’à 60 % sont en fauteuil roulant après cinq ans (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Le diagnostic de PSP est typiquement posé trois à quatre ans après le début des symptômes (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>), délai identique à celui estimé pour les deux tauopathies 4R dans la revue de Munich (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="trap"><span class="k">Piège</span> Les chiffres d’AMS (prévalence, âge, survie) sont cités de seconde main dans une étude américaine monocentrique ; aucune source européenne primaire sur l’incidence n’a été lue. Les proportions du syndrome de Richardson dans la PSP (environ 25 % pour la revue de Munich, alors que 76 % des PSP autopsiées avaient un autre phénotype pour les critères MDS) viennent de cohortes différentes et ne se confondent pas.</div>
<div class="key"><b>À retenir.</b> Maladies rares, à survie de 6 à 9 ans après le diagnostic, dont le diagnostic est tardif de trois à quatre ans. L’absence de données suisses est une lacune du dossier, pas une preuve d’absence de la maladie.</div>
</section>

<section class="ilot" id="g23-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie s’organise autour de la protéine qui s’agrège, de la région qui dégénère et du signe clinique qui en résulte. Les maladies de ce groupe ne partagent pas la même protéine : l’AMS est une synucléinopathie, la PSP et la DCB sont des tauopathies 4R, la PKAN est une maladie du métabolisme du coenzyme A avec dépôt de fer, la calcification familiale relève de gènes du phosphate et de l’unité neurovasculaire (<a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9970616/" target="_blank" rel="noopener">pathogénie de la PKAN, 2022</a> ; <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<h3>3.1 Atrophie multisystématisée</h3>
<p>Dans l’AMS, l’α-synucléine s’agrège dans les oligodendrocytes. Des souches spécifiques d’α-synucléine et un mécanisme d’ensemencement sont décrits (<a href="https://doi.org/10.1016/S1474-4422(24)00396-X" target="_blank" rel="noopener">Lancet Neurology 2024 (résumé)</a> ; <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a> ; <button class="w" data-k="g23-synucleine">agrégation et ensemencement (mécanisme)</button>). Cette agrégation s’accompagne d’une perte neuronale dans trois systèmes, et chacun explique une partie du tableau clinique :</p>
<ul><li>le système <b>striato-nigrique</b> : parkinsonisme peu sensible à la lévodopa ;</li><li>le système <b>olivo-ponto-cérébelleux</b> : syndrome cérébelleux avec ataxie ;</li><li>les <b>centres autonomes centraux</b> : hypotension orthostatique, troubles mictionnels, dysfonction érectile (<a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a>).</li></ul>
<p>L’atteinte autonome est <b>préganglionnaire</b>. Elle explique que la scintigraphie cardiaque à la MIBG et la noradrénaline plasmatique de repos (supérieure à 100 pg/mL) soient habituellement normales, à l’inverse de la maladie de Parkinson où l’atteinte est post-ganglionnaire (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a> ; <button class="w" data-k="g23-preganglionnaire">atteinte préganglionnaire (conséquences pour les examens)</button>).</p>
<h3>3.2 Pourquoi la lévodopa échoue</h3>
<p>La lévodopa fournit un précurseur de la dopamine. Son effet suppose que les neurones du striatum qui reçoivent la dopamine, dits <b>post-synaptiques</b>, soient conservés. Dans la PSP, la dégénérescence dopaminergique striatale post-synaptique est un indice d’imagerie (IF2) ; elle est cohérente avec la faible réponse à la lévodopa (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). Dans l’AMS, la faible réponse est constatée ; son mécanisme n’est pas détaillé dans les sources lues. L’hypothèse est développée dans la fenêtre : <button class="w" data-k="g23-post-synaptique">atteinte post-synaptique (raison de la mauvaise réponse à la lévodopa)</button>.</p>
<h3>3.3 Tauopathies 4R : PSP et DCB</h3>
<p>Dans la PSP et la DCB, la tau 4R s’agrège. Ni dépôt de β-amyloïde ni tau mixte 3R/4R n’est observé (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). La topographie explique le tableau : le tronc cérébral et les noyaux gris centraux, dans la PSP, correspondent à l’atteinte de l’oculomotricité verticale et aux chutes ; la prédominance corticale de la DCB correspond à l’apraxie et aux signes corticaux asymétriques (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <button class="w" data-k="g23-tau4r">tauopathies 4R (topographie et signes)</button>).</p>
<h3>3.4 NBIA et calcification cérébrale</h3>
<p>Dans la PKAN, le gène <i>PANK2</i> code une pantothénate kinase mitochondriale. La maladie est une erreur innée du métabolisme du coenzyme A ; les lésions touchent surtout le globus pallidus et parfois la substance noire. Le mécanisme exact reste non résolu ; une hypothèse invoque l’activation insuffisante de la protéine porteuse d’acyles mitochondriale dépendante du coenzyme A (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9970616/" target="_blank" rel="noopener">pathogénie de la PKAN, 2022</a> ; <button class="w" data-k="g23-pkan-meca">PKAN (mécanisme et hypothèse)</button>). Dans la calcification cérébrale primaire familiale, sept gènes sont impliqués ; les hypothèses invoquent la dysfonction de l’unité neurovasculaire, l’homéostasie du phosphate et la mitochondrie (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a> ; <button class="w" data-k="g23-pfbc-meca">PFBC (gènes et hypothèses)</button>).</p>
<figure><svg viewBox="0 0 420 252" role="img" aria-label="Figure 1 — De la protéine anormale au signe clinique" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="30" width="120" height="50" rx="5"/><rect x="150" y="30" width="120" height="50" rx="5"/><rect x="292" y="30" width="120" height="50" rx="5"/><rect x="8" y="100" width="120" height="50" rx="5"/><rect x="150" y="100" width="120" height="50" rx="5"/><rect x="292" y="100" width="120" height="50" rx="5"/><rect x="8" y="170" width="120" height="50" rx="5"/><rect x="150" y="170" width="120" height="50" rx="5"/><rect x="292" y="170" width="120" height="50" rx="5"/><path d="M128 55h22m-4-4l4 4-4 4M270 55h22m-4-4l4 4-4 4M128 125h22m-4-4l4 4-4 4M270 125h22m-4-4l4 4-4 4M128 195h22m-4-4l4 4-4 4M270 195h22m-4-4l4 4-4 4"/></g><g fill="currentColor" text-anchor="middle"><text x="68" y="20" font-weight="bold">Protéine ou voie</text><text x="210" y="20" font-weight="bold">Structures atteintes</text><text x="352" y="20" font-weight="bold">Signe</text><text x="68" y="59">α-synucléine</text><text x="68" y="74">oligodendrocytes</text><text x="210" y="59">striato-nigrique</text><text x="210" y="74">olive, pont, cervelet</text><text x="352" y="59">parkinsonisme,</text><text x="352" y="74">ataxie, dysautonomie</text><text x="68" y="129">tau 4R</text><text x="68" y="144">PSP</text><text x="210" y="129">tronc cérébral,</text><text x="210" y="144">noyaux gris centraux</text><text x="352" y="129">regard vertical,</text><text x="352" y="144">chutes en arrière</text><text x="68" y="199">tau 4R</text><text x="68" y="214">DCB</text><text x="210" y="199">cortex asymétrique</text><text x="210" y="214">et sous-cortical</text><text x="352" y="199">apraxie, membre</text><text x="352" y="214">étranger</text></g></svg><figcaption>Figure 1. Correspondance entre la protéine, la topographie et le signe clinique (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>, <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>, <a href="https://doi.org/10.1038/s41572-022-00382-6" target="_blank" rel="noopener">Nature Reviews Disease Primers 2022 (résumé)</a>).</figcaption></figure>
<div class="key"><b>Science → clinique.</b> Le signe dépend moins du nom de la protéine que de la région touchée : un parkinsonisme sans réponse dopaminergique durable est compatible avec une atteinte post-synaptique ; une hypotension orthostatique dont le rapport entre accélération cardiaque et baisse de pression reste inférieur à 0,5 est dite neurogène, et sa lésion est préganglionnaire dans l’AMS.</div>
<button class="pareto-btn ui" data-k="pareto-g23-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g23-4"><h2><span class="n">4</span>Origines et facteurs de risque</h2>
<p>Les syndromes parkinsoniens atypiques de ce chapitre sont, pour la plupart, <b>sporadiques</b>. Le caractère sporadique est un critère d’inclusion de l’AMS (« maladie sporadique, progressive », début après 30 ans) et de la PSP (« sporadique, début à 40 ans ou plus ») dans les critères de la société internationale MDS (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>). Pour la DCB, le critère de classification de 2013 exige l’absence d’histoire familiale et de mutation connue du gène de la protéine tau (<a href="https://doi.org/10.1212/WNL.0b013e31827f0fd1" target="_blank" rel="noopener">critères d’Armstrong, dégénérescence corticobasale, 2013 (résumé)</a>).</p>
<p>Deux maladies du groupe sont génétiques. La PKAN est liée au gène <i>PANK2</i> (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9970616/" target="_blank" rel="noopener">pathogénie de la PKAN, 2022</a>) et le diagnostic de NBIA repose sur une analyse génétique ciblée, un panel ou un exome (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>). La calcification cérébrale primaire familiale peut résulter de variants de sept gènes, dont quatre dominants (<i>SLC20A2, PDGFRB, PDGFB, XPR1</i>) et trois récessifs (<i>MYORG, JAM2, CMPK2</i>) ; environ 50 % des patients n’ont pas de variant identifié (<a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</p>
<p>Les sources lues ne rapportent <b>aucun facteur de risque modifiable établi</b> pour l’AMS, la PSP ou la DCB. Cette lacune a une conséquence pédagogique : il n’existe pas de prévention primaire à proposer. Parkinson Suisse recommande des mesures générales de santé (facteurs de risque vasculaires, activité physique, sommeil, alimentation, contacts sociaux, absence d’alcool et de tabac) qui visent la qualité de vie et non la modification de la maladie (<a href="https://www.parkinson.ch/fr/themen/syndromes-parkinsoniens-atypiques" target="_blank" rel="noopener">Parkinson Suisse, syndromes parkinsoniens atypiques 2025</a>).</p>
<div class="trap"><span class="k">Piège</span> L’ataxie peut aussi être toxique (alcool, carbamazépine, phénytoïne, lithium) ; un syndrome cérébelleux chez un patient exposé à ces substances ne suffit donc pas à évoquer une AMS cérébelleuse (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</div>
<div class="key"><b>À retenir.</b> L’AMS, la PSP et la DCB sont sporadiques. La PKAN et la calcification familiale sont génétiques. Aucune prévention primaire n’est documentée dans les sources lues.</div>
</section>

<section class="ilot" id="g23-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche d’abord ce qui distingue le patient d’un parkinsonien typique : la date et la nature du premier symptôme, la rapidité de l’évolution, la réponse à la lévodopa et les signes autonomes. Elle cherche ensuite les causes de confusion.</p>
<h3>5.1 Antécédents et contexte à rechercher</h3>
<ul><li>L’<b>âge de début</b> : au moins 40 ans pour la PSP, plus de 30 ans pour l’AMS, au moins 50 ans pour le syndrome corticobasal probable (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a> ; <a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</li><li>La <b>chronologie</b> : une évolution soudaine, par paliers ou très rapide est un critère d’exclusion de la PSP (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</li><li>L’<b>exposition médicamenteuse ou toxique</b> pouvant expliquer une ataxie (alcool, carbamazépine, phénytoïne, lithium) (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</li><li>Les <b>antécédents familiaux</b> et l’âge d’apparition chez l’enfant pour les formes génétiques (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <a href="https://doi.org/10.3390/ijms241310886" target="_blank" rel="noopener">revue génétique de la calcification cérébrale primaire familiale, 2023 (résumé)</a>).</li><li>La <button class="w" data-k="g23-levodopa-reponse">réponse à la lévodopa (mesure et interprétation)</button> déjà essayée.</li></ul>
<h3>5.2 Symptômes de l’atrophie multisystématisée, par fréquence</h3>
<p>Une étude descriptive américaine monocentrique de 30 patients (<a href="https://doi.org/10.1007/s10286-017-0500-0" target="_blank" rel="noopener">cohorte de 30 patients, premiers symptômes, 2018</a>) fournit les premiers symptômes. Ces chiffres sont indicatifs : l’effectif est petit et l’étude rétrospective.</p>
<table class="t"><thead><tr><th>Symptôme</th><th>Fréquence ou moment</th><th>Fenêtre</th></tr></thead><tbody>
<tr><td>Premier symptôme autonome</td><td>73 %</td><td><button class="w" data-k="g23-premiers-sympt">premiers symptômes (autonomes, sommeil, moteurs)</button></td></tr>
<tr><td>Premier symptôme lié au sommeil</td><td>17 %</td><td><button class="w" data-k="g23-tcsp">trouble du comportement en sommeil paradoxal</button></td></tr>
<tr><td>Premier symptôme moteur</td><td>10 %</td><td><button class="w" data-k="g23-premiers-sympt">premiers symptômes</button></td></tr>
<tr><td>Dysfonction érectile</td><td>chez tous les hommes interrogés, environ 4 ans avant le diagnostic</td><td><button class="w" data-k="g23-premiers-sympt">premiers symptômes</button></td></tr>
<tr><td>Étourdissements orthostatiques</td><td>89 % à terme</td><td><button class="w" data-k="g23-ho">hypotension orthostatique neurogène</button></td></tr>
<tr><td>Mise en acte des rêves</td><td>77 %</td><td><button class="w" data-k="g23-tcsp">trouble du comportement en sommeil paradoxal</button></td></tr>
<tr><td>Impériosité urinaire</td><td>62 %</td><td><button class="w" data-k="g23-retention">rétention et impériosité urinaires</button></td></tr>
<tr><td>Ronflement</td><td>57 %</td><td><button class="w" data-k="g23-stridor">stridor et troubles respiratoires du sommeil</button></td></tr>
</tbody></table>
<p>Le tableau montre que la dysautonomie précède souvent le syndrome moteur. Une dysfonction érectile précoce chez l’homme, une impériosité mictionnelle ou des étourdissements au lever, chez un patient dont le parkinsonisme répond mal à la lévodopa, orientent donc vers l’AMS. La rétention urinaire est très spécifique de l’AMS par rapport à la maladie de Parkinson ; un score d’au moins 2 sur quatre éléments (instabilité posturale, hypotension orthostatique neurogène, vessie hyperactive, rétention dans les deux premières années) distingue l’AMS de la maladie de Parkinson avec une sensibilité de 78 % et une spécificité de 86 % (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p>
<h3>5.3 Formes typiques et formes atypiques</h3>
<div class="two"><div class="card"><h4>AMS parkinsonienne (G23.2)</h4><p>Bradykinésie avec rigidité ou tremblement, peu sensible à la lévodopa. Une réponse transitoire existe chez 42 à 57 % des patients et s’épuise vers 3,5 ans ; au total, la réponse est jugée médiocre chez 74 % (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). C’est la forme prédominante en Europe.</p></div><div class="card"><h4>AMS cérébelleuse (G23.3)</h4><p>Ataxie de la marche et des membres, dysarthrie cérébelleuse, signes oculomoteurs. Elle atteint jusqu’à 73 % des cas en Asie de l’Est (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p></div></div>
<div class="two"><div class="card"><h4>PSP : syndrome de Richardson</h4><p>Chutes en arrière précoces, dès la première année, et paralysie verticale du regard, spécifique de la PSP (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>). Le syndrome de Richardson reste le phénotype le plus fréquent, mais il ne regroupe qu’environ un quart des cas ; les autres phénotypes convergent souvent vers lui au cours de l’évolution (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a> ; <button class="w" data-k="g23-phenotypes-psp">phénotypes de la PSP</button>). Dans l’AMS, 28 % des patients tombent aussi dès la première année : une chute précoce isolée ne tranche donc pas entre les deux maladies (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</p></div><div class="card"><h4>PSP : autres phénotypes</h4><p>Akinésie avec freezing, parkinsonisme, présentation frontale, aphasie non fluente, syndrome corticobasal, forme à prédominance oculomotrice (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p></div></div>
<div class="two"><div class="card"><h4>PKAN classique</h4><p>Début précoce (âge moyen d’environ 3 ans), troubles de la marche, dystonie des membres inférieurs, rétinopathie pigmentaire fréquente, acanthocytes chez une minorité (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a> ; <button class="w" data-k="g23-pkan-clinique">PKAN : clinique</button>).</p></div><div class="card"><h4>PKAN atypique</h4><p>Début plus tardif, parkinsonisme, troubles neuropsychiatriques et de la parole précoces (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8235601/" target="_blank" rel="noopener">revue sur les NBIA, 2018</a>).</p></div></div>
<p>Le syndrome corticobasal se reconnaît à une présentation asymétrique associant des signes corticaux (apraxie, perte sensitive corticale, membre étranger) et des signes sous-corticaux (rigidité, dystonie, myoclonies d’un membre) (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). Les troubles du comportement en sommeil paradoxal, les impatiences, les troubles respiratoires du sommeil et les hallucinations sont <b>rares</b> dans la PSP et la DCB, ce qui oriente vers une synucléinopathie lorsqu’ils sont présents (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>).</p>
<div class="trap"><span class="k">Piège</span> Une réponse transitoire à la lévodopa n’exclut pas une AMS. Seule une réponse substantielle et durable est un critère d’exclusion (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a>).</div>
<div class="key"><b>À retenir.</b> Dans l’AMS, la dysautonomie précède souvent le syndrome moteur. Dans la PSP, les chutes en arrière et le trouble du regard vertical dominent. La rétention urinaire oriente vers l’AMS.</div>
</section>

<section class="ilot" id="g23-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre état général, signes vitaux, puis signes ciblés. Il vise à rassembler les éléments qui entrent dans les critères MDS : dysautonomie objectivée, signes cérébelleux, troubles oculomoteurs, instabilité posturale, signes corticaux. Chaque signe est expliqué dans une fenêtre.</p>
<h3>6.1 État général et signes vitaux</h3>
<p>La <b>pression artérielle couchée puis debout</b>, mesurée avec le pouls, objective le critère autonome cardiovasculaire des critères MDS. En population générale, l’hypotension orthostatique correspond à une chute de la pression systolique d’au moins 20 mmHg, ou de la pression diastolique d’au moins 10 mmHg, ou à une pression systolique inférieure à 90 mmHg (<a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">lignes directrices ESC sur la syncope, 2018</a>). Dans l’AMS, le critère est une chute de la pression systolique d’au moins 20 mmHg, habituellement accompagnée d’une chute diastolique d’au moins 10 mmHg. La chute systolique seule suffit, car elle reconnaît 95 % des hypotensions neurogènes ; la chute diastolique isolée n’est pas spécifique et ne s’utilise pas seule. La chute doit survenir dans les 3 minutes pour la forme cliniquement établie, et dans les 10 minutes pour la forme probable ; ce délai de 10 minutes ajoute les hypotensions retardées, survenues entre 3 et 10 minutes. Le caractère neurogène est suggéré par un rapport entre l’augmentation de la fréquence cardiaque et la baisse de la pression systolique inférieur à 0,5 battement par minute et par mmHg (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <button class="w" data-k="g23-ho">hypotension orthostatique neurogène (technique et seuils)</button>).</p>
<h3>6.2 Signes ciblés</h3>
<div class="two"><div class="card"><h4>Signes moteurs et oculomoteurs</h4><ul><li><button class="w" data-k="g23-oculomoteur">Regard vertical, saccades, ondes carrées, ouverture des paupières</button></li><li><button class="w" data-k="g23-pulltest">Test de traction (<i>pull test</i>)</button> et chutes</li><li><button class="w" data-k="g23-cerebelleux">Signes cérébelleux (marche, membres, parole)</button></li><li><button class="w" data-k="g23-dystonie">Rigidité, akinésie, dystonie cranio-cervicale</button></li><li><button class="w" data-k="g23-babinski-myoclonie">Signe de Babinski et tremblement myoclonique</button></li></ul></div><div class="card"><h4>Signes corticaux, autonomes et généraux</h4><ul><li><button class="w" data-k="g23-corticaux">Apraxie, perte sensitive corticale, membre étranger</button></li><li><button class="w" data-k="g23-cognition">Langage et fonctions exécutives</button></li><li><button class="w" data-k="g23-dysphagie">Déglutition et dysarthrie</button></li><li><button class="w" data-k="g23-stridor">Soupirs inspiratoires et stridor</button></li><li><button class="w" data-k="g23-signes-peripheriques">Mains et pieds froids et violacés</button></li></ul></div></div>
<p>Les critères MDS reposent sur ces observations de la marche, du regard et de la parole. Au <i>pull test</i>, une tendance à la chute est un critère de la PSP de niveau P-2, et plus de deux pas en arrière un critère de niveau P-3 (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>).</p>
<div class="trap"><span class="k">Piège</span> Une mesure trop brève peut manquer l’hypotension orthostatique : la prolongation de la mesure à 10 minutes augmente la sensibilité de 18 % (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</div>
<section data-semiology-clinical="G23" id="g23-6-semiologie">
<h3>6.3 Sémiologie analytique : du symptôme au signe qui discrimine</h3>
<p>Un syndrome parkinsonien qui chute tôt, répond mal à la lévodopa ou s’accompagne d’une défaillance autonome précoce ne se comporte pas comme une maladie de Parkinson. Le médecin cherche alors six familles de signes : instabilité posturale précoce, trouble supranucléaire du regard vertical, défaillance autonome objectivée, syndrome cérébelleux, signes corticaux asymétriques, troubles respiratoires et bulbaires (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’atrophie multisystématisée, 2022</a> ; <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la paralysie supranucléaire progressive, 2017</a>). Aucun signe isolé ne pose le diagnostic ; seule l’association de signes de domaines différents atteint la spécificité des critères (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>).</p>

<h4>Symptômes et anamnèse analytique</h4>
<p>L’interrogatoire porte sur le patient et sur son entourage, car plusieurs symptômes ne sont pas rapportés spontanément (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a> ; <a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>). Chaque plainte se qualifie par son ancienneté par rapport au syndrome parkinsonien, surtout dans les 3 premières années, et par sa spécificité.</p>
<ul>
<li><button class="w" data-k="g23-sm-chutes">Chutes</button> : le médecin précise leur date d’apparition, leur direction et leur caractère non provoqué. Des chutes répétées non provoquées dans les 3 ans définissent le niveau P-1 de la paralysie supranucléaire progressive (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>) ; 28 % des patients atteints d’atrophie multisystématisée tombent aussi dès la première année (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</li>
<li><button class="w" data-k="g23-sm-ho">Étourdissements au lever</button>, malaises ou pertes de connaissance en station debout : ils traduisent l’interruption de la voie efférente du baroréflexe (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</li>
<li><button class="w" data-k="g23-sm-vessie">Troubles mictionnels</button> : l’impériosité et l’incontinence par impériosité sont sensibles mais peu spécifiques (spécificité 34 %) ; la difficulté de vidange et la rétention pèsent bien davantage (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Une hypertrophie prostatique, une chirurgie pelvienne antérieure ou un prolapsus doivent être écartés (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</li>
<li><button class="w" data-k="g23-sm-erectile">Dysfonction érectile</button> : ce symptôme est banal chez l’homme âgé ; isolé, il oriente peu (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</li>
<li><button class="w" data-k="g23-sm-tcsp">Mise en acte des rêves</button>, rapportée par le conjoint : les noyaux pontins de l’atonie du sommeil paradoxal sont touchés dans les synucléinopathies (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a>).</li>
<li><button class="w" data-k="g23-sm-stridor">Bruit respiratoire nocturne aigu</button>, souvent décrit comme un ronflement forcé : il évoque un stridor, qui peut n’exister que pendant le sommeil (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne, 2019</a>).</li>
<li><button class="w" data-k="g23-sm-bulbaire">Troubles de la parole et de la déglutition</button> : le médecin demande explicitement les fausses routes (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a>).</li>
</ul>

<h4>Signes et examen orienté</h4>
<p>Quatre gestes alimentent directement les critères. Le médecin mesure la pression et le pouls couché, puis debout à 3 minutes et jusqu’à 10 minutes ; une chute systolique d’au moins 20 mmHg suffit, et une chute diastolique isolée ne s’utilise pas seule (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>). Il calcule ensuite le rapport entre la hausse du pouls et la baisse de la pression systolique : un rapport inférieur à 0,5 signe une hypotension neurogène, après exclusion des bêtabloquants (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Par exemple, une pression qui passe de 140 à 105 mmHg avec un pouls qui passe de 70 à 78 par minute donne 8 / 35 = 0,23 : l’hypotension est neurogène.</p>
<p>Il examine les <button class="w" data-k="g23-oculomoteur">saccades verticales commandées</button>, vers des cibles situées à plus de 20 degrés, et non la poursuite lente ; des saccades lentes définissent le niveau O-2, une limitation volontaire du regard vertical le niveau O-1 (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>). Au <button class="w" data-k="g23-pulltest">test de traction</button>, plus de deux pas en arrière définissent le niveau P-3 (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>). Il cherche enfin le syndrome cérébelleux (ataxie de la marche et des membres, dysarthrie, nystagmus) et les signes corticaux : apraxie, déficit sensitif cortical testé par la reconnaissance tactile d’un objet familier, membre étranger (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich, 2026</a>). Chez l’homme, l’échographie mesure le résidu post-mictionnel ; un résidu supérieur à 100 mL, sans hypertrophie prostatique, est spécifique à 95 % contre la maladie de Parkinson (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>).</p>

<h4>Discrimination clinique</h4>
<div class="two"><div class="card"><b>Oriente vers ce groupe</b><p>Une défaillance autonome sévère dans les 3 premières années rend l’atrophie multisystématisée 3,4 fois plus probable que la paralysie supranucléaire progressive (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Un syndrome oculomoteur supranucléaire écarte l’atrophie multisystématisée ; une dysautonomie d’au moins 30/15 mmHg en 3 minutes écarte la paralysie supranucléaire progressive (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>). L’apraxie, la perte sensitive corticale et l’aphasie n’ont jamais été décrites dans les atrophies multisystématisées confirmées à l’autopsie (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p></div><div class="card"><b>Oriente ailleurs</b><p>Une réponse substantielle et durable à la lévodopa et une anosmie orientent vers la maladie de Parkinson ; des hallucinations visuelles récurrentes ou une cognition fluctuante dans les 3 ans orientent vers la démence à corps de Lewy (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a>). Un début avant 45 ans fait chercher une maladie de Wilson, une maladie de Niemann-Pick de type C, une hypoparathyroïdie, une neuroacanthocytose ou une neurosyphilis (<a href="https://doi.org/10.1002/mds.26987" target="_blank" rel="noopener">critères MDS de la PSP, 2017</a>). Une ataxie subaiguë fait chercher une lésion structurelle, une sclérose en plaques, une cause toxique ou médicamenteuse, une infection ou une cause métabolique (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a>).</p></div></div>
<div class="trap"><span class="k">Piège</span> L’ataxie est la première cause d’atrophie multisystématisée prise pour une paralysie supranucléaire progressive. Dans les 3 premières années, l’absence de signes de soutien n’exclut pas l’atrophie multisystématisée (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck sur le diagnostic clinique de l’atrophie multisystématisée, 2023</a>).</div>

<h4>Situations urgentes</h4>
<div class="alert"><b>Priorité clinique.</b> Le stridor fait demander une laryngoscopie, car la mort subite pendant le sommeil compte parmi les causes de décès de l’atrophie multisystématisée ; une laryngoscopie de veille normale ne l’exclut pas (<a href="https://doi.org/10.1212/WNL.0000000000008208" target="_blank" rel="noopener">consensus de Bologne sur le stridor, 2019</a>). La dysphagie fait demander une évaluation de la déglutition, car elle est une cause majeure de morbidité et de mortalité de la paralysie supranucléaire progressive et de la dégénérescence corticobasale (<a href="https://doi.org/10.1055/a-2895-4480" target="_blank" rel="noopener">revue de Munich sur les tauopathies 4R, 2026</a>). L’hypotension orthostatique avec chutes fait réviser les médicaments vasoactifs (<a href="https://doi.org/10.1002/mds.29005" target="_blank" rel="noopener">critères MDS de l’AMS, 2022</a> ; <a href="https://doi.org/10.1093/eurheartj/ehy037" target="_blank" rel="noopener">ESC syncope, 2018</a>). Un résidu supérieur à 100 mL expose aux infections urinaires et à l’insuffisance rénale secondaire, et contre-indique la midodrine (<a href="https://doi.org/10.1007/s12311-022-01453-w" target="_blank" rel="noopener">revue d’Innsbruck, 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680449770288" target="_blank" rel="noopener">information professionnelle suisse Gutron®, mars 2021</a>). Les sources lues ne fixent pas de délai chiffré.</div>
<p>Le réseau européen ERN-RND demande d’adresser à un spécialiste des troubles du mouvement tout patient parkinsonien qui présente tôt une réponse faible à la lévodopa, une progression rapide, des chutes, un trouble du regard vertical, une dysautonomie, une dysphagie ou un stridor, des signes cérébelleux marqués ou une apraxie (<a href="https://www.ern-rnd.eu/wp-content/uploads/2023/07/Final-text-diagnosis-Atypical-PD_brief-summary-for-GPs_sp.pdf" target="_blank" rel="noopener">ERN-RND, information brève pour médecins généralistes, 2020</a>).</p>
<p>La technique détaillée, les mécanismes et la valeur chiffrée de chaque signe figurent dans le sous-onglet « Sémiologie fondamentale et analytique » de l’onglet Sciences fondamentales.</p>
</section>
<div class="key"><b>À retenir.</b> Les gestes qui alimentent les critères sont la mesure prolongée de la pression couchée puis debout, l’observation du regard vertical, le test de traction et la recherche des signes cérébelleux et corticaux.</div>
