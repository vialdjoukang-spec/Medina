<template data-pop="e01-tdci" data-title="Troubles dus à la carence iodée : spectre complet">
<div class="lab">Définition</div><p>L’Organisation mondiale de la santé regroupe sous ce nom tous les effets d’un apport d’iode insuffisant. Le terme remplace le seul mot « goitre », parce que la carence touche l’ensemble de la vie, du fœtus à l’adulte âgé.</p>
<div class="lab">Contenu</div><p>À tout âge : goitre, hypothyroïdie et sensibilité accrue aux radiations nucléaires. Chez l’enfant, l’adolescent et l’adulte : altération des fonctions mentales et hyperthyroïdie induite par l’iode. Le syndrome congénital relève d’une autre catégorie (E00).</p>
<div class="lab">Application</div><p>Un adulte âgé à goitre ancien appartient au spectre par deux voies opposées : le goitre résiduel de la carence, et le risque d’hyperthyroïdie induite par l’iode lors d’une charge d’iode.</p>
<p class="src">Source : OMS, UNICEF et ICCIDD, <i>Assessment of iodine deficiency disorders and monitoring their elimination</i>, 3e édition, tableau 1.</p></template>

<template data-pop="e01-goitre-oms" data-title="Goitre : définition clinique et grades de l’OMS">
<div class="lab">Définition</div><p>La thyroïde est goitreuse lorsque chaque lobe latéral a un volume supérieur à celui de la phalange distale du pouce de la personne examinée. Le repère est individuel, car il adapte la mesure à la taille du sujet.</p>
<div class="lab">Grades</div><p>Grade 0 : ni palpable ni visible. Grade 1 : palpable, non visible cou en position normale ; les nodules dans une thyroïde non augmentée entrent dans ce grade. Grade 2 : tuméfaction visible cou en position normale, compatible à la palpation avec une thyroïde augmentée.</p>
<div class="lab">Limite</div><p>Sensibilité et spécificité faibles pour les grades 0 et 1, avec forte variation entre examinateurs. En carence légère à modérée, l’échographie est préférable.</p>
<p class="src">Source : OMS 2007, tableau 6 et paragraphes 4.3.1 à 4.3.2.</p></template>

<template data-pop="e01-tgr" data-title="Taux total de goitre et iodurie : seuils de gravité de population">
<div class="lab">Taux total de goitre chez l’écolier</div><p>Moins de 5 % : pas de carence. De 5,0 à 19,9 % : légère. De 20,0 à 29,9 % : modérée. Au moins 30 % : sévère. Un taux d’au moins 5 % chez les écoliers de 6 à 12 ans signale un problème de santé publique.</p>
<div class="lab">Iodurie médiane chez l’écolier</div><p>Moins de 20 µg/l : sévère. 20–49 : modérée. 50–99 : légère. 100–199 : adéquate. 200–299 : au-dessus des besoins. 300 ou plus : excessive.</p>
<div class="lab">Femme enceinte</div><p>Moins de 150 µg/l : insuffisant. 150–249 : adéquat.</p>
<div class="lab">Limite</div><p>La prévalence du goitre répond lentement à la correction de l’apport ; l’iodurie répond vite. Ces seuils jugent des populations, non des individus.</p>
<p class="src">Source : OMS 2007, tableaux 4, 5 et 7.</p></template>

<template data-pop="e01-gmn" data-title="Goitre multinodulaire et nodulogenèse">
<div class="lab">Définition</div><p>Évolution de l’hyperplasie thyroïdienne précoce vers des structures nodulaires, de nature majoritairement néoplasique au sens clonal.</p>
<div class="lab">Mécanisme établi</div><p>Des mutations somatiques interviennent, avec des conséquences physiopathologiques directes et indirectes.</p>
<div class="lab">Lacune</div><p>Seul le résumé de Krohn et collaborateurs a été lu. Les mécanismes moléculaires détaillés (mutations du récepteur de la TSH, facteurs de croissance) ne sont donc pas enseignés ici.</p>
<p class="src">Source : Krohn K, Paschke R et collaborateurs, <i>Endocrine Reviews</i>, résumé.</p></template>

<template data-pop="e01-eutirads" data-title="EU-TIRADS : catégories, risque et seuils de ponction">
<div class="lab">Principe</div><p>Le système européen d’évaluation du risque de malignité des nodules thyroïdiens classe le nodule en cinq catégories selon l’échographie, et fixe un seuil de taille de ponction par catégorie.</p>
<div class="lab">Catégories</div><p>1 : aucun nodule. 2 : bénin (kyste pur, spongiforme) ≈ 0 %. 3 : risque bas 2–4 %, ponction au-delà de 20 mm. 4 : intermédiaire 6–17 %, au-delà de 15 mm. 5 : élevé 26–87 %, au-delà de 10 mm.</p>
<div class="lab">Signes de haute suspicion</div><p>Microcalcifications, contours irréguliers, orientation non parallèle, hypoéchogénicité marquée de la partie solide.</p>
<p class="src">Source : ETA 2017 (échographie) reprise par ETA 2023, tableaux 2 et 3.</p></template>

<template data-pop="e01-bethesda" data-title="Système de Bethesda : cytologie thyroïdienne">
<div class="lab">Catégories citées</div><p>I, non diagnostique : malignité 5–10 %. II, bénin (nodule adénomatoïde, hyperplasique ou colloïde) : 0–3 %, fréquence attendue 55–74 %. III, atypies ou lésion folliculaire de signification indéterminée : 10–30 %.</p>
<div class="lab">Limite</div><p>La troisième édition modifie légèrement ces estimations. Bethesda II peut correspondre à une thyroïdite lymphocytaire.</p>
<p class="src">Source : ETA 2023, tableau 5, citant le système de Bethesda 2017.</p></template>

<template data-pop="e01-huins" data-title="Classification de Huins du goitre plongeant">
<div class="lab">Situation</div><p>Il n’existe pas de définition consensuelle du goitre plongeant.</p>
<div class="lab">Grades</div><p>Grade 1 : au-dessus de la crosse aortique, opérable par cervicotomie. Grade 2 : entre la crosse et le péricarde, sternotomie partielle. Grade 3 : au-delà.</p>
<div class="lab">Conséquence</div><p>Le niveau détermine la voie d’abord. 95 % des goitres plongeants peuvent être retirés par cervicotomie.</p>
<p class="src">Source : Unlu et collaborateurs, <i>Sisli Etfal Hastan Tip Bul</i>.</p></template>

<template data-pop="e01-suisse-histoire" data-title="Histoire de la carence iodée en Suisse">
<div class="lab">Avant la prophylaxie</div><p>Dans certaines régions, 0,5 % des habitants étaient crétins, presque 100 % des écoliers avaient un gros goitre et jusqu’à 30 % des jeunes hommes étaient inaptes au service militaire à cause d’un goitre volumineux.</p>
<div class="lab">Après le sel iodé</div><p>Régression rapide chez le nouveau-né et l’écolier, plus lente chez les recrues, incomplète chez l’adulte âgé. Dans les cantons qui n’ont autorisé le sel iodé qu’en 1952, la régression a été retardée d’autant : cette preuve naturelle désigne le sel iodé comme cause.</p>
<div class="lab">Conséquence pour la leçon</div><p>Le goitre de l’adulte âgé est un reliquat. Il explique pourquoi la consultation moderne voit des goitres nodulaires anciens chez des patients nés avant l’iodation efficace.</p>
<p class="src">Source : Bürgi H et collaborateurs, <i>Acta Endocrinologica</i> (cent ans après l’enquête de Kocher).</p></template>

<template data-pop="e01-sel" data-title="Chronologie de l’iodation du sel en Suisse">
<div class="lab">Étapes</div><p>1922 : 3,75 mg d’iode par kg. 1962 et 1980 : doublements jusqu’à 15 mg/kg. 1999 : 20 mg/kg. Janvier 2014 : 25 mg/kg, marge autorisée de 20 à 40 mg/kg.</p>
<div class="lab">Résultats</div><p>En 1988, 92 % du sel de détail et 76 % de tout le sel de consommation humaine étaient iodés, bien que l’usage soit volontaire. L’iodurie est passée de 18–64 à 150 µg par jour. L’augmentation de 1999 a nettement amélioré l’état iodé de la population suisse.</p>
<p class="src">Sources : Bürgi (Acta Endocrinol) ; <i>Am J Clin Nutr</i> (relèvement à 20 mg/kg) ; <i>Eur J Nutr</i> 2020–2022 ; Office fédéral de la sécurité alimentaire et des affaires vétérinaires, page « Jodiertes Salz ».</p></template>

<template data-pop="e01-etude2020" data-title="Étude nationale suisse 2020–2022">
<div class="lab">Résultats principaux</div><p>Iodurie médiane de 127 µg/l chez l’écolier (adéquate) et de 97 µg/l chez la femme enceinte (insuffisante), 30 % de moins qu’en 2015 (140 µg/l). Supplément pris par 47 % des femmes enceintes (150–220 µg d’iode par jour) : 129 µg/l chez les utilisatrices, 81 µg/l chez les autres.</p>
<div class="lab">Thyroglobuline et TSH</div><p>Thyroglobuline sur goutte de sang séché : médiane 26,0 µg/l ; valeur élevée (au-dessus de 43,5 µg/l) chez 17,0 % des femmes enceintes. TSH médiane 1,8 mU/l.</p>
<div class="lab">Limite</div><p>Programme volontaire. Les 150–220 µg des suppléments sont un fait observé, non une recommandation chiffrée suisse.</p>
<p class="src">Source : <i>Eur J Nutr</i>, étude transversale sur l’apport en iode de la population suisse cent ans après l’introduction du sel iodé.</p></template>

<template data-pop="e01-danemark" data-title="Cohortes danoises : structure thyroïdienne et incidences">
<div class="lab">Étude échographique</div><p>2656 sujets de 41 à 71 ans, région à carence limite (iodurie médiane 70 µg/l) : structure multinodulaire chez 23 % (de 20 à 46 % chez la femme et de 7 à 23 % chez l’homme selon l’âge) ; nodule froid solitaire de plus de 10 mm chez 2,4 % ; thyroïde augmentée (plus de 18 ml chez la femme, plus de 25 ml chez l’homme) chez 13,1 % des femmes et 6,2 % des hommes ; augmentation de volume associée à une iodurie inférieure à 50 µg par jour.</p>
<div class="lab">Registres avant iodation</div><p>Hyperthyroïdie franche : 92,9 pour 100 000 par an à Aalborg (iodurie 45 µg/l) contre 65,4 à Copenhague (61 µg/l) ; hypothyroïdie franche : 26,5 contre 40,1. L’apport optimal se situe dans une plage étroite autour de 150 µg par jour.</p>
<div class="lab">Limite</div><p>Seuils de volume propres à l’étude, non universels.</p>
<p class="src">Sources : <i>Eur J Endocrinol</i> (structure thyroïdienne) ; <i>J Clin Endocrinol Metab</i> (incidences).</p></template>

<template data-pop="e01-slovenie" data-title="Slovénie et Pologne : leçons de l’iodation">
<div class="lab">Slovénie</div><p>Passage de 10 à 25 mg d’iodure de potassium par kg de sel en 1999 : baisse de l’incidence du goitre diffus et de l’autonomie thyroïdienne ; patients autonomes plus âgés et moins souvent hyperthyroïdiens ; hyperthyroïdie induite par l’iode moins sévère ; hausse de l’incidence de la thyroïdite de Hashimoto.</p>
<div class="lab">Pologne</div><p>Après l’iodation obligatoire de 1997 (30 mg d’iodure de potassium par kg de chlorure de sodium), l’incidence de l’hyperthyroïdie induite par l’iode est restée à un niveau acceptable.</p>
<div class="lab">Lecture</div><p>L’iodation fait baisser la maladie nodulaire autonome, mais déplace une part du fardeau vers la thyroïdite auto-immune.</p>
<p class="src">Sources : Gaberšček et collaborateurs, <i>Arh Hig Rada Toksikol</i> ; <i>J Endocrinol Invest</i>.</p></template>

<template data-pop="e01-nis" data-title="Symporteur sodium-iodure et besoins quotidiens en iode">
<div class="lab">Mécanisme</div><p>Le symporteur sodium-iodure assure le transport actif de l’iodure dans le thyrocyte. C’est la première étape de la synthèse des hormones thyroïdiennes.</p>
<div class="lab">Besoins quotidiens (OMS, UNICEF, ICCIDD)</div><p>90 µg de 0 à 59 mois ; 120 µg de 6 à 12 ans ; 150 µg chez l’adolescent et l’adulte ; 250 µg pendant la grossesse et l’allaitement. La valeur suisse de 250 µg/jour pour l’allaitement est, selon l’autorité suisse, faiblement étayée.</p>
<p class="src">Sources : OMS 2007, §2 ; Portulano et collaborateurs, <i>Endocrine Reviews</i> ; Office fédéral de la sécurité alimentaire et des affaires vétérinaires.</p></template>

<template data-pop="e01-adaptation" data-title="Adaptation hormonale à la carence et marqueurs">
<div class="lab">Adaptation</div><p>Augmentation de la captation puis de la masse (goitre) ; sécrétion préférentielle de T3 ; TSH élevée.</p>
<div class="lab">Dosages en population</div><p>T4 plus basse et T3 plus haute que dans une population normale, avec chevauchement large. La TSH d’une population carencée est plus élevée, mais la différence est trop faible chez l’écolier et l’adulte pour servir de marqueur individuel. La thyroglobuline augmente avec l’hyperplasie ; elle reflète l’état iodé des mois ou années précédents.</p>
<p class="src">Sources : OMS 2007, §4.4 ; Knobel et collaborateurs, <i>Arq Bras Endocrinol Metabol</i>.</p></template>

<template data-pop="e01-autonomie" data-title="Carence sévère ou légère : deux trajectoires">
<div class="lab">Carence sévère</div><p>Malgré l’activité maximale de la thyroïde, l’iode reste insuffisant : goitre et hypothyroïdie.</p>
<div class="lab">Carence légère à modérée</div><p>La suractivité compense et maintient l’euthyroïdie chez la plupart ; en contrepartie, la stimulation chronique accroît dans la population la prévalence du goitre nodulaire toxique et de l’hyperthyroïdie.</p>
<div class="lab">Conséquence</div><p>Le sujet âgé suisse, ancien habitant d’une région à carence légère à modérée, est dans la seconde trajectoire.</p>
<p class="src">Source : Zimmermann et Boelaert, <i>Lancet Diabetes &amp; Endocrinology</i>.</p></template>

<template data-pop="e01-wolff" data-title="Effet Wolff-Chaikoff, échappement et phénomène de Jod-Basedow">
<div class="lab">Wolff-Chaikoff</div><p>Un excès pharmacologique d’iode inhibe l’organification de l’iodure, la protéolyse de la thyroglobuline et la sécrétion hormonale. La TSH monte transitoirement, puis la thyroïde normale échappe à cet effet.</p>
<div class="lab">Défaut d’échappement</div><p>Hypothyroïdie. Il concerne surtout les régions suffisantes en iode, la thyroïdite auto-immune, le fœtus et le nouveau-né.</p>
<div class="lab">Jod-Basedow</div><p>Un tissu autonome (goitre nodulaire, maladie de Basedow latente) produit des hormones en excès sous charge iodée, sans contrôle régulateur.</p>
<p class="src">Source : <i>European Thyroid Association</i> 2021, lignes directrices sur la dysfonction thyroïdienne induite par les produits de contraste iodés.</p></template>

<template data-pop="e01-hii" data-title="Hyperthyroïdie induite par l’iode : fenêtre de risque">
<div class="lab">Qui</div><p>Plus souvent le sujet âgé porteur d’un goitre nodulaire préexistant, même avec un apport iodé normal.</p>
<div class="lab">Quand</div><p>Surtout pendant les 5 à 10 ans qui suivent l’introduction du sel iodé dans une région carencée. L’OMS déconseille un apport supérieur à 300 µg par jour dans les régions anciennement carencées.</p>
<div class="lab">Information professionnelle suisse de l’iodure de potassium</div><p>Une dose élevée d’iode peut déclencher une hyperthyroïdie chez les patients prédisposés, surtout ceux qui ont un goitre ; cela peut arriver avec des quantités considérées comme physiologiques dans d’autres pays.</p>
<p class="src">Sources : OMS 2007, §4.2 ; information professionnelle suisse de l’iodure de potassium (Axapharm, Swissmedic).</p></template>

<template data-pop="e01-facteurs" data-title="Facteurs associés au goitre et aux nodules : sélénium, tabac, alcool">
<div class="lab">Association</div><p>Les carences en iode et en sélénium sont associées à une prévalence accrue du goitre. Au Danemark, les nodules sont associés aux anticorps anti-peroxydase. Le tabac influence la prévalence du goitre ; une consommation modérée à élevée d’alcool est associée à moins de goitre et de nodules solitaires.</p>
<div class="lab">Limite</div><p>Ce sont des associations d’études d’observation, sans quantification lue pour la leçon et sans preuve de causalité ; elles ne fondent aucune recommandation.</p>
<p class="src">Sources : ETA 2023 ; <i>Eur J Endocrinol</i> ; Knudsen et collaborateurs, <i>Clin Endocrinol</i>.</p></template>

<template data-pop="e01-contraste" data-title="Produits de contraste iodés : charge d’iode, fréquence, délai, conduite">
<div class="lab">Charge</div><p>Un scanner injecté apporte 18 à 45 g d’iode (60 à 150 ml à 300 mg/ml).</p>
<div class="lab">Fréquence</div><p>Dysfonction thyroïdienne chez 1 à 15 % des patients exposés ; hyperthyroïdie chez 0 à 9 %, plus souvent en zone carencée ou avec goitre nodulaire ; nombre nécessaire pour nuire d’environ 1 pour 250. Délai : surtout 3 à 10 semaines, jusqu’à un an.</p>
<div class="lab">Conduite</div><p>Pas de TSH systématique en population générale ; TSH avant l’examen chez les patients à haut risque ; pas de contraste en cas d’hyperthyroïdie franche ; pas de prophylaxie systématique ; méthimazole et/ou perchlorate à envisager avant un examen urgent chez un patient vulnérable ; contrôle de la fonction à 3–4 semaines. Interroger l’exposition : hyperthyroïdie nouvelle, deux à trois mois ; hypothyroïdie nouvelle, un à deux ans.</p>
<p class="src">Source : <i>European Thyroid Association</i> 2021, recommandations 14, 15, 17, 20 à 22 et 25.</p></template>

<template data-pop="e01-amiodarone" data-title="Amiodarone et goitre nodulaire">
<div class="lab">Constat</div><p>La teneur élevée en iode de l’amiodarone peut provoquer une hyperthyroïdie ou une hypothyroïdie.</p>
<div class="lab">Prudence</div><p>En cas de goitre nodulaire, qui peut contenir une autonomie non détectée, la prudence s’impose.</p>
<p class="src">Source : information professionnelle suisse d’Euthyrox® (Merck, Swissmedic), rubrique interactions ; <i>European Thyroid Association</i> 2021.</p></template>
