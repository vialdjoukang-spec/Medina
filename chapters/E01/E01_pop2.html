<template data-pop="e01-compression" data-title="Symptômes compressifs du goitre plongeant et seuils trachéaux">
<div class="lab">Fréquences</div><p>Masse cervicale 69–97 % ; symptômes respiratoires 42–96 % (dyspnée, toux, sensation d’étouffement, dyspnée d’effort, orthopnée) ; dysphagie 26–60 % (extension rétro-œsophagienne) ; obstruction aiguë 1–5 % ; plus rarement dysphonie, thyrotoxicose, syndrome cave supérieur.</p>
<div class="lab">Trachée</div><p>Dyspnée d’effort sous 8 mm de diamètre ; stridor et sifflement sous 5 mm ; symptômes d’obstruction aiguë possiblement absents jusqu’à 75 % d’obstruction.</p>
<div class="lab">Piège</div><p>Un sifflement chronique est souvent pris à tort pour de l’asthme. Une dysphonie, une invasion ou une dyspnée évoquent une malignité.</p>
<p class="src">Source : Unlu et collaborateurs, <i>Sisli Etfal Hastan Tip Bul</i>.</p></template>

<template data-pop="e01-pemberton" data-title="Signe de Pemberton">
<div class="lab">Geste</div><p>Le patient lève les bras.</p>
<div class="lab">Signe</div><p>Dilatation des veines jugulaires externes, érythème facial, parfois cyanose : obstruction veineuse transitoire au défilé thoracique.</p>
<div class="lab">Valeur</div><p>Présent chez moins de 5 % des goitres plongeants : un signe négatif n’exclut rien.</p>
<p class="src">Source : Unlu et collaborateurs.</p></template>

<template data-pop="e01-cave" data-title="Syndrome cave supérieur">
<div class="lab">Signes</div><p>Pléthore faciale, cyanose, œdème des bras, circulation collatérale thoracique.</p>
<div class="lab">Cause</div><p>Plus souvent une malignité, qu’il faut exclure dans un goitre plongeant.</p>
<p class="src">Source : Unlu et collaborateurs.</p></template>

<template data-pop="e01-palpation" data-title="Technique de palpation de l’OMS">
<div class="lab">Technique</div><p>Inspection du cou en position normale puis en hyperextension. Palpation au pouce le long de la trachée, entre le cartilage cricoïde et le sternum. La thyroïde monte à la déglutition. Chaque lobe est comparé à la phalange distale du pouce du patient.</p>
<div class="lab">Limite</div><p>Faible fiabilité des grades 0 et 1 ; l’échographie mesure mieux le volume.</p>
<p class="src">Source : OMS 2007, §4.3.1.</p></template>

<template data-pop="e01-paf" data-title="Ponction à l’aiguille fine : indications et contre-indications">
<div class="lab">Indications</div><p>Selon EU-TIRADS (catégorie 3 au-delà de 20 mm, 4 au-delà de 15, 5 au-delà de 10), ou quel que soit le score en cas d’adénopathie pathologique ou de suspicion d’extension extrathyroïdienne. Éléments qui la renforcent : sexe masculin, jeune âge, nodule solitaire, symptômes compressifs, antécédent familial de cancer médullaire ou de néoplasie endocrinienne multiple de type 2, irradiation cervicale dans l’enfance.</p>
<div class="lab">Contre-indications</div><p>Trouble sévère de la coagulation. Une anticoagulation avec INR inférieur à 3 ne l’est pas, ni un antiagrégant.</p>
<div class="lab">Technique</div><p>Sous guidage échographique.</p>
<p class="src">Source : ETA 2023, tableaux 3 et 4.</p></template>

<template data-pop="e01-echo-cr" data-title="Compte rendu échographique et croissance nodulaire">
<div class="lab">Compte rendu</div><p>Trois diamètres et volume de chaque lobe ; extension sous-sternale ou compression ; nodules de plus de 10 mm, et nodules de 5–10 mm suspects ; si plus de trois nodules par lobe, le plus grand et les suspects ; ganglions pathologiques.</p>
<div class="lab">Croissance significative</div><p>Augmentation d’au moins 20 % de deux diamètres avec au minimum 2 mm, ou augmentation de volume de plus de 50 %. Sur cinq ans, elle survient chez environ 16 % des nodules.</p>
<p class="src">Source : ETA 2023, tableau 2 et surveillance clinique.</p></template>

<template data-pop="e01-calcitonine" data-title="Calcitonine : indications et seuils">
<div class="lab">Indications</div><p>Avant chirurgie ou technique mini-invasive ; cytologie indéterminée ; échographie suspecte ; obligatoire en cas d’antécédent personnel ou familial de cancer médullaire ou de néoplasie endocrinienne multiple de type 2.</p>
<div class="lab">Seuils</div><p>Supérieurs à 30 pg/ml chez la femme et à 34 pg/ml chez l’homme. Au plus une personne dépistée sur 200 a un cancer médullaire.</p>
<p class="src">Source : ETA 2023, évaluation initiale.</p></template>

<template data-pop="e01-scinti" data-title="Scintigraphie thyroïdienne : indications et pièges">
<div class="lab">Indication</div><p>TSH abaissée ou à la limite inférieure de la normale. Point clé pour la carence : des nodules hyperfonctionnels existent aussi à TSH normale en zone de carence actuelle ou passée.</p>
<div class="lab">Utilité</div><p>Éviter la ponction d’un nodule hyperfonctionnel, rarement malin ; séparer les nodules hypofonctionnels des hyperfonctionnels dans un goitre multinodulaire ; évaluer l’éligibilité à l’iode radioactif.</p>
<div class="lab">Piège</div><p>La captation peut être supprimée environ deux mois après un contraste iodé ; éviter scintigraphie et iode radioactif un à deux mois après une exposition.</p>
<p class="src">Sources : ETA 2023 ; ETA 2021.</p></template>

<template data-pop="e01-imagerie" data-title="Scanner, résonance magnétique, tomographie et incidentalomes">
<div class="lab">Scanner</div><p>Étend le bilan au médiastin supérieur, à la trachée et à l’œsophage ; supérieur à la résonance magnétique pour les rapports vasculaires et pour prédire la nécessité d’une sternotomie. Un contraste injecté expose au risque de thyrotoxicose.</p>
<div class="lab">Incidentalomes</div><p>Risque de malignité de 5 à 13 % au scanner ou à la résonance magnétique, environ 35 % pour les lésions hyperactives à la tomographie par émission de positons au fluorodésoxyglucose.</p>
<div class="lab">Fonction respiratoire</div><p>Les courbes débit-volume évaluent l’obstruction des voies aériennes supérieures.</p>
<p class="src">Sources : ETA 2023 ; Unlu et collaborateurs.</p></template>

<template data-pop="e01-tg-iodurie" data-title="Thyroglobuline et iodurie : marqueurs de population">
<div class="lab">Iodurie</div><p>Marqueur de l’apport récent, de population. En individuel, utile seulement pour étayer un excès d’iode quand le diagnostic d’hyperthyroïdie induite par l’iode est incertain.</p>
<div class="lab">Thyroglobuline sur goutte de sang séché</div><p>Intervalle de référence de 4 à 40 µg/l chez l’écolier iodosuffisant ; étude suisse : médiane 26,0 µg/l chez la femme enceinte, valeur élevée (au-dessus de 43,5 µg/l) chez 17,0 %.</p>
<p class="src">Sources : OMS 2007, §4.4.2 ; <i>Eur J Nutr</i> ; ETA 2021, recommandation 17.</p></template>

<template data-pop="e01-levothyroxine" data-title="Lévothyroxine dans le goitre : arbitrage entre sources">
<div class="lab">Recommandation européenne 2023 (la plus récente)</div><p>En l’absence de TSH élevée, la lévothyroxine destinée à abaisser la TSH est déconseillée : morbidité et mortalité accrues, et surtout efficacité insuffisante sur les nodules symptomatiques.</p>
<div class="lab">Information professionnelle suisse d’Euthyrox® (février 2023)</div><p>Indications conservées : goitre bénin euthyroïdien ; prévention de la récidive après résection ; 75–200 µg par jour, mois ou années ; en cas d’échec, envisager la chirurgie ou la radiothérapie. Avant le traitement : exclure l’autonomie fonctionnelle et l’hyperthyroïdie infraclinique (test à la TRH ou scintigraphie de suppression). Dose initiale de 25 µg chez le sujet âgé.</p>
<div class="lab">Essai LISA (historique)</div><p>1024 patients euthyroïdiens, TSH visée 0,2–0,8 mU/l, un an. Réduction du volume nodulaire de −17,3 % avec lévothyroxine plus iode, −7,3 % (non significatif) avec lévothyroxine seule, −4,0 % (non significatif) avec iode seul.</p>
<div class="lab">Arbitrage</div><p>La source applicable la plus récente prime pour la conduite : la recommandation de 2023, défavorable. Le texte d’autorisation en vigueur et l’essai historique restent accessibles ici.</p>
<p class="src">Sources : ETA 2023 ; information professionnelle suisse d’Euthyrox® ; Grussendorf et collaborateurs (essai LISA), <i>J Clin Endocrinol Metab</i>.</p></template>

<template data-pop="e01-iode131" data-title="Iode radioactif (131I) dans le goitre">
<div class="lab">Indication</div><p>Alternative à la chirurgie, surtout si le risque opératoire est élevé.</p>
<div class="lab">Résultats</div><p>Réduction typique du volume de 40 % en 12 mois, soulagement des symptômes chez la plupart. Nodule hyperfonctionnel : activité fixe (185 à 370 MBq), euthyroïdie le plus souvent, réduction de 30 à 50 % en 12 mois.</p>
<div class="lab">Risques</div><p>Hypothyroïdie rare (10–20 % à dix ans), suivi à vie. Dans le goitre plongeant : réduction modérée et risque d’aggravation aiguë de l’obstruction.</p>
<div class="lab">Lacune</div><p>Les modalités suisses (radioprotection, hospitalisation) n’ont pas été lues pour cette leçon.</p>
<p class="src">Sources : ETA 2023 ; Unlu et collaborateurs.</p></template>

<template data-pop="e01-rhtsh" data-title="TSH recombinante humaine avant l’iode radioactif">
<div class="lab">Indication</div><p>Faible captation ou gros goitre : la préstimulation augmente la réduction de volume.</p>
<div class="lab">Preuves</div><p>Méta-analyse Cochrane (6 essais randomisés, 321 patients) : réduction de volume supplémentaire de 11,9 % (intervalle de confiance à 95 % 4,4–19,4), au prix de plus d’hypothyroïdie : 32,5 % contre 12,1 %, risque relatif 2,53.</p>
<p class="src">Source : Cochrane Database Syst Rev ; ETA 2023.</p></template>

<template data-pop="e01-chirurgie" data-title="Chirurgie du goitre : indications et contexte suisse">
<div class="lab">Indications (ETA 2023)</div><p>Maladie nodulaire symptomatique ; nodules bénins devenus symptomatiques ; Bethesda III–IV non éligibles à la surveillance ou Bethesda V–VI ; nodule bénin d’au moins 4 cm ; gêne esthétique ; extension rétroclaviculaire ou médiastinale ; nodules hyperfonctionnels et goitre multinodulaire toxique en option. Dans un goitre nodulaire, thyroïdectomie quasi totale à envisager.</p>
<div class="lab">Suisse</div><p>Environ 4000 thyroïdectomies par an ; trois indications couvrent 90 % des interventions (cancer ou suspicion de cancer, hyperthyroïdie, goitre volumineux ou intrathoracique) ; mortalité presque nulle.</p>
<p class="src">Sources : ETA 2023 ; Vidal Fortuny, Triponez et collaborateurs, <i>Swiss Medical Weekly</i>.</p></template>

<template data-pop="e01-plongeant-ttt" data-title="Traitement du goitre plongeant">
<div class="lab">Chirurgie</div><p>95 % peuvent être retirés par cervicotomie ; la thyroïdectomie totale est préférée à la subtotale. Le scanner prédit la nécessité d’une sternotomie.</p>
<div class="lab">Autres moyens</div><p>La lévothyroxine y est controversée et peu efficace ; l’iode radioactif n’apporte qu’une réduction modérée, avec un risque d’aggravation aiguë de l’obstruction.</p>
<div class="lab">Malignité</div><p>3,7 à 23,3 % des goitres plongeants opérés ; 23,3 % contre 10,4 % dans une série de 19 662 goitres.</p>
<p class="src">Source : Unlu et collaborateurs.</p></template>

<template data-pop="e01-prophylaxie" data-title="Sel iodé, grossesse et allaitement : recommandations suisses">
<div class="lab">Sel iodé</div><p>Utiliser le sel avec modération, mais toujours iodé, sans augmenter la consommation totale ; vérifier le sel iodé dans les produits transformés ; varier l’alimentation (poisson, produits laitiers, œufs) ; végétariens et végétaliens : sel iodé ; algues avec parcimonie.</p>
<div class="lab">Grossesse et allaitement</div><p>Les suppléments doivent contenir de l’iode. Poursuivre pendant l’allaitement le supplément commencé pendant la grossesse ; apport recommandé de 250 µg par jour.</p>
<div class="lab">Lacune</div><p>La page lue ne donne aucune dose suisse pour la grossesse ; la référence chiffrée reste les 250 µg de l’OMS.</p>
<p class="src">Sources : Office fédéral de la sécurité alimentaire et des affaires vétérinaires, « Jodiertes Salz » et « Jodtabletten für stillende Mütter » ; Zimmermann, <i>Endocrine Reviews</i>.</p></template>

<template data-pop="e01-ki65" data-title="Comprimés d’iodure de potassium de la Confédération (65 mg)">
<div class="lab">Indication</div><p>Prophylaxie de l’incorporation d’iode radioactif en cas d’accident nucléaire, sur ordre du Conseil fédéral. Ils ne traitent pas le goitre.</p>
<div class="lab">Contre-indications et risques</div><p>Hyperthyroïdie, maladie de Basedow, autonomie locale ou diffuse. Hyperthyroïdie possible chez les patients prédisposés ; hypothyroïdie et goitre fœtaux en grossesse ; hypothyroïdie du nourrisson de moins d’un mois. Crise thyréotoxique : traitement intensif, en dernier recours plasmaphérèse ou thyroïdectomie.</p>
<p class="src">Source : information professionnelle suisse de l’iodure de potassium Axapharm 65 mg (Swissmedic).</p></template>

<template data-pop="e01-ats" data-title="Antithyroïdiens de synthèse et perchlorate : doses rapportées">
<div class="lab">Indications (ETA 2021)</div><p>Hyperthyroïdie induite par l’iode sévère : méthimazole, carbimazole ou propylthiouracile ; perchlorate en cas de réponse partielle ; même la forme légère est traitée après 65 ans, surtout avec comorbidités ; les formes légères sont surveillées sans nouvel apport d’iode, sous bêtabloquant.</p>
<div class="lab">Doses rapportées</div><p>Méthimazole 20–30 mg par jour pendant 14 jours en prophylaxie, jusqu’à 40–60 mg par jour en traitement ; perchlorate jusqu’à 1 g par jour pendant 4 semaines au plus.</p>
<div class="lab">Lacune</div><p>Ces doses proviennent de la recommandation européenne. L’information professionnelle suisse des antithyroïdiens et du perchlorate n’a pas été lue pour cette leçon : aucune posologie Swissmedic n’est donnée.</p>
<p class="src">Source : <i>European Thyroid Association</i> 2021.</p></template>

<template data-pop="e01-grossesse" data-title="Grossesse et iode">
<div class="lab">Apport</div><p>Insuffisant en Suisse sans supplément : iodurie médiane 97 µg/l, apport habituel inadéquat chez 31 % des non-utilisatrices d’un supplément contre 0,2 % des utilisatrices.</p>
<div class="lab">Excès</div><p>L’iodure traverse le placenta et peut provoquer hypothyroïdie et goitre fœtaux lors de prises d’iodure de potassium à dose pharmacologique.</p>
<p class="src">Sources : <i>Eur J Nutr</i> ; information professionnelle suisse de l’iodure de potassium.</p></template>

<template data-pop="e01-mnemo" data-title="Aide mnémotechnique : trois questions devant un goitre">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Trois mots ordonnent la consultation : <b>F</b>onction (TSH, scintigraphie si TSH basse ou limite), <b>N</b>odule (échographie, EU-TIRADS, ponction), <b>C</b>ompression (clinique, scanner, courbes débit-volume). Un quatrième réflexe s’y ajoute avant un examen injecté : <b>I</b>ode, c’est-à-dire l’exposition récente.</p></template>

<template data-pop="e01-sources-guides" data-title="Sources et limites de la leçon">
<div class="lab">Références principales</div><p>Classification statistique suisse CIM-10-GM 2024 (Office fédéral de la statistique) ; classification OMS 2019 ; OMS, UNICEF et ICCIDD 2007 ; Office fédéral de la sécurité alimentaire et des affaires vétérinaires et étude nationale 2020–2022 ; <i>European Thyroid Association</i> 2023 (nodules), 2021 (produits de contraste iodés) et 2017 (EU-TIRADS) ; informations professionnelles suisses d’Euthyrox® et de l’iodure de potassium.</p>
<div class="lab">Limites</div><p>Aucune recommandation de société savante suisse sur le goitre n’a été lue ; la conduite repose sur des recommandations européennes. L’information professionnelle suisse des antithyroïdiens et du perchlorate et les modalités suisses de l’iode radioactif n’ont pas été lues. Aucune prévalence actuelle du goitre de l’adulte suisse n’a été lue. Revue par intelligence artificielle, distincte d’une validation médicale humaine.</p></template>

<template data-pop="pareto-e01-definition" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="e01-1,e01-2"></p><ul><li>Goitre : lobe plus gros que la phalange distale du pouce ; grades OMS 0, 1, 2 ; E01.0 diffus, E01.1 multinodulaire, E01.2 sans précision, E01.8 autres dont hypothyroïdie acquise.</li><li>Carence de population : taux de goitre ≥ 5 % ou iodurie médiane &lt; 100 µg/l chez l’écolier ; &lt; 150 µg/l chez la femme enceinte.</li><li>Suisse : écolier adéquat (127 µg/l), femme enceinte insuffisante (97 µg/l), goitre de l’adulte âgé résiduel.</li></ul></template>
<template data-pop="pareto-e01-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="e01-3,e01-4"></p><ul><li>Carence légère ou modérée : euthyroïdie au prix d’une stimulation chronique, puis nodules et autonomie.</li><li>Charge d’iode sur tissu autonome : hyperthyroïdie (Jod-Basedow) ; sur thyroïde normale : Wolff-Chaikoff puis échappement.</li><li>Risques actuels : grossesse sans supplément, régime végétal, peu de lait, sel non iodé ; déclencheurs : contraste iodé, amiodarone, algues.</li></ul></template>
<template data-pop="pareto-e01-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="e01-5,e01-6"></p><ul><li>Rechercher compression, signe de malignité, exposition iodée récente.</li><li>Palpation OMS ; Pemberton présent chez moins de 5 % ; trachée silencieuse jusqu’à 75 % d’obstruction.</li><li>Un sifflement chronique n’est pas toujours de l’asthme.</li></ul></template>
<template data-pop="pareto-e01-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="e01-7,e01-8"></p><ul><li>TSH et échographie chez tous ; scintigraphie si TSH basse ou limite ; ponction selon EU-TIRADS (&gt; 20, &gt; 15, &gt; 10 mm).</li><li>Urgences : obstruction aiguë des voies aériennes ; crise thyréotoxique sur hyperthyroïdie induite par l’iode.</li><li>Traiter l’hyperthyroïdie induite par l’iode même légère après 65 ans.</li></ul></template>
<template data-pop="pareto-e01-prise-en-charge" data-title="Pareto — Prise en charge et situations particulières">
<p class="ratio" data-cover="e01-9,e01-10,e01-11"></p><ul><li>Bénin et asymptomatique : surveiller ; pas de lévothyroxine suppressive (ETA 2023).</li><li>Symptomatique : chirurgie ou 131I (−40 % à 12 mois, hypothyroïdie 10–20 % à 10 ans) ; hyperfonctionnel : 131I ou mini-invasif sans ponction.</li><li>Contraste iodé chez le sujet à risque : TSH avant, fonction à 3–4 semaines ; iodure de potassium de la Confédération : accident nucléaire seulement.</li></ul></template>
<template data-pop="pareto-e01-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e01-e-1,e01-e-2,e01-e-3,e01-e-4,e01-e-5,e01-e-6"></p><ul><li>TSH puis hormones libres ; anticorps selon la TSH ; calcitonine avant chirurgie ou si antécédent familial.</li><li>EU-TIRADS : seuils de ponction 20, 15 et 10 mm ; croissance ≥ 20 % sur deux diamètres.</li><li>Scintigraphie justifiée même à TSH normale en zone de carence ; iodurie = marqueur de population.</li></ul></template>
<template data-pop="pareto-e01-s-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e01-s-anat-cours"></p><ul><li>Défilé thoracique : Pemberton et syndrome cave supérieur.</li><li>Trachée : dyspnée sous 8 mm, stridor sous 5 mm.</li><li>Huins 1, 2, 3 par rapport à la crosse aortique.</li></ul></template>
<template data-pop="pareto-e01-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e01-s-physio-cours"></p><ul><li>La carence augmente captation, masse, T3 et TSH.</li><li>L’excès d’iode freine la glande normale et nourrit la glande autonome.</li></ul></template>
<template data-pop="pareto-e01-s-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e01-s-bioch-cours"></p><ul><li>Un contraste apporte 120 000 à 300 000 fois le besoin quotidien.</li><li>Thyroglobuline : état iodé sur des mois ; iodurie : apport récent.</li></ul></template>
<template data-pop="pareto-e01-s-sante" data-title="Pareto — Santé publique">
<p class="ratio" data-cover="e01-s-sante-cours"></p><ul><li>Le sel iodé a supprimé le crétinisme endémique ; il peut démasquer transitoirement l’autonomie.</li><li>Apport optimal dans une plage étroite autour de 150 µg par jour.</li></ul></template>
<template data-pop="pareto-e01-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e01-p-1,e01-p-2,e01-p-3,e01-p-4"></p><ul><li>Pas de lévothyroxine suppressive sans TSH élevée ; exclure l’autonomie avant toute lévothyroxine.</li><li>Antithyroïdien (±perchlorate) pour l’hyperthyroïdie induite par l’iode ; doses européennes seulement.</li><li>Iodure de potassium 65 mg : accident nucléaire, pas le goitre.</li></ul></template>
