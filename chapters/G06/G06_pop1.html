<template data-pop="g06-codage" data-k="g06-codage"><h3>Lire les sous-codes sans les transformer en conduite clinique</h3><p>Dans la classification GM 2024 du BfArM, G06.0 couvre les abcès et granulomes intracrâniens, y compris cérébraux et les collections intracrâniennes épidurales, extradurales ou sous-durales. G06.1 couvre les formes intrarachidiennes, médullaires et épidurales, extradurales ou sous-durales spinales. G06.2 décrit un abcès extradural ou sous-dural sans précision.</p><p>La note permet un code complémentaire B95–B98 pour l’agent identifié. Une maladie classée ailleurs peut exiger un code causal et G07* plutôt que G06 : abcès amibien, gonococcique, certaines atteintes tuberculeuses ou parasitaires. Le compte rendu doit préciser site, preuve et cause avant codage ; ce tableau allemand 2024 ne certifie pas une facture suisse 2026.</p><p>Sources : <button class="w" data-k="g06-r15">[15]</button></p></template>
<template data-pop="g06-chronologie" data-k="g06-chronologie"><h3>Quand une histoire rachidienne doit changer de priorité</h3><p>Une douleur persistante ou inhabituelle associée à une infection récente, un geste, un terrain à risque ou une anomalie neurologique doit faire envisager l’infection rachidienne. Un déficit peut apparaître après une phase douloureuse. Attendre l’association douleur-fièvre-paralysie expose à une perte de temps.</p><p>Noter l’heure du dernier état neurologique stable, l’apparition de la faiblesse et des troubles sphinctériens. Cette précision aide l’équipe chirurgicale, sans créer un délai chiffré de tolérance. Une aggravation nouvelle exige réévaluation et imagerie urgente, même si une première consultation avait conclu à une cause mécanique.</p><p>Sources : <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r7">[7]</button></p></template>
<template data-pop="g06-mrc" data-k="g06-mrc"><h3>Force musculaire : comprendre les grades 0à 5</h3><table class="t"><thead><tr><th>Grade</th><th>Réponse observée</th></tr></thead><tbody><tr><td>0</td><td>Aucune contraction.</td></tr><tr><td>1</td><td>Ébauche de contraction, sans mouvement utile.</td></tr><tr><td>2</td><td>Mouvement possible lorsque la pesanteur est supprimée.</td></tr><tr><td>3</td><td>Mouvement possible contre la pesanteur.</td></tr><tr><td>4</td><td>Mouvement contre la pesanteur et une résistance.</td></tr><tr><td>5</td><td>Force normale pour le muscle et le contexte.</td></tr></tbody></table><p>Isoler l’action musculaire, limiter les mouvements de compensation et comparer les côtés. Le grade 4 recouvre une gamme large ; il ne mesure pas à lui seul la vitesse de dégradation. L’EANS considère notamment un déficit radiculaire inférieur à 4/5, une dysfonction vésicosphinctérienne neurogène ou des signes sensitifs médullaires comme des indications de décompression dans son périmètre de spondylodiscite.</p><p>Paraphrase française du manuel officiel. ©Crown, Open Government Licence 3.0. Used with the permission of the Medical Research Council. Cette attribution ne signifie aucune approbation du cours.</p><p>Sources : <button class="w" data-k="g06-r3">[3]</button> · <button class="w" data-k="g06-r14">[14]</button></p></template>
<template data-pop="g06-attente" data-k="g06-attente"><h3>Le report de l’antibiotique n’est pas une attente systématique de 24 heures</h3><p>L’ESCMID permet conditionnellement de différer l’antibiothérapie avant aspiration ou excision chez certains patients sans maladie grave, si le prélèvement peut être réalisé rapidement, de préférence dans les 24 heures suivant le diagnostic radiologique. Le but est d’améliorer le rendement microbiologique. Cette option exclut notamment sepsis, rupture imminente et menace d’engagement.</p><p>Elle ne signifie pas attendre 24 heures chez un patient qui se dégrade, ni différer un traitement parce que le bloc est indisponible. Chez le patient grave, obtenir rapidement les hémocultures si cela ne retarde pas les soins, puis débuter le traitement indiqué et organiser le contrôle du foyer. La sélection doit être discutée avec neurochirurgie et infectiologie, avec surveillance et possibilité de changer immédiatement de stratégie.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r3">[3]</button></p></template>
<template data-pop="g06-certitude" data-k="g06-certitude"><h3>Distinguer suspicion radiologique et cause confirmée</h3><p>Un syndrome compatible associé à une lésion évocatrice permet de parler de diagnostic probable et d’agir. L’identification d’un microorganisme dans un prélèvement pertinent peut documenter l’étiologie. Un tissu peut aussi révéler une tumeur, une inflammation granulomateuse ou une autre cause. Le degré de certitude doit donc être formulé séparément pour la lésion et pour sa cause.</p><p>Un rehaussement en couronne n’est pas une signature microbiologique. Une diffusion restreinte peut être très utile dans le bon contexte, mais ne dispense pas d’évaluer les diagnostics alternatifs. L’absence de bactérie cultivée après traitement n’est pas une preuve d’absence d’infection. Aucun score unique validé ne couvre toutes les catégories G06.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r8">[8]</button> · <button class="w" data-k="g06-r9">[9]</button></p></template>
<template data-pop="g06-duree" data-k="g06-duree"><h3>Durée cérébrale : distinguer aspiration, excision et exceptions</h3><p>L’ESCMID propose 6à 8 semaines de traitement IV pour l’abcès cérébral aspiré ou pris en charge sans chirurgie. Une durée plus courte après excision, par exemple 4 semaines, repose sur avis d’experts et ne constitue pas une règle automatique. La réponse clinique, les images, l’agent et la qualité du contrôle du foyer doivent être intégrés.</p><p>Le guide ne formule pas de recommandation pour un relais oral précoce faute de données suffisantes. Il ne recommande pas habituellement une consolidation orale après au moins 6 semaines IV, mais réserve des exceptions, notamment certaines anomalies neuroanatomiques permanentes et les infections tuberculeuses, à Nocardia, toxoplasmiques ou fongiques. Cette durée globale n’annule pas les précautions de prolongation de chaque produit.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r6">[6]</button></p></template>
<template data-pop="pareto-g06-path" data-k="pareto-g06-path"><h3>Territoire, gravité et contrôle du foyer</h3><p>Fièvre absente ne rassure pas. IRM adaptée, hémocultures et prélèvement du foyer lorsque possible. Patient grave traité sans délai dangereux ; report antibiotique seulement sélectionné. Déficit spinal et troubles sphinctériens imposent décision urgente. Les protocoles cérébraux et rachidiens ne sont pas interchangeables.</p></template>
<template data-pop="g06-irm" data-k="g06-irm"><h3>Diffusion, contraste et localisation : trois informations différentes</h3><p>La restriction de diffusion peut soutenir la présence de pus dans un abcès cérébral. Le rehaussement en couronne montre une zone de prise de contraste, mais n’identifie pas à lui seul une bactérie. L’effet de masse et les rapports avec les ventricules apportent une information de gravité distincte de la cause.</p><p>Dans les infections épidurales, le phlegmon peut présenter un rehaussement plus homogène, tandis qu’une collection organisée peut présenter un rehaussement périphérique. La série IRM lue ne comporte que 27 patients sélectionnés avec confirmation opératoire/pathologique et ne valide pas une sensibilité générale. Une image atypique ne doit pas être résumée par une règle visuelle unique.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r8">[8]</button></p></template>
<template data-pop="g06-pl" data-k="g06-pl"><h3>Pourquoi la PL est généralement évitée dans cette situation</h3><p>Dans le guide ESCMID, la ponction lombaire est relativement contre-indiquée et habituellement de faible rendement dans l’abcès cérébral. Une lésion expansive avec œdème ou effet de masse modifie la sécurité du geste. Le liquide lombaire ne prélève pas directement le pus parenchymateux.</p><p>La conduite initiale repose donc sur l’imagerie, les hémocultures et le prélèvement du foyer lorsque possible. Cette formulation ne signifie pas qu’aucun patient ne pourra jamais avoir de PL : une autre question diagnostique peut exister, mais sa justification et sa sécurité relèvent de l’équipe après évaluation. La stratégie d’une méningite sans lésion expansive ne se transpose pas automatiquement à une infection focale.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button></p></template>
<template data-pop="pareto-g06-exam" data-k="pareto-g06-exam"><h3>Une question pour chaque examen</h3><p>IRM pour territoire et gravité ; sang et pus/tissu pour preuve ; méthodes moléculaires si cultures négatives selon contexte. CRP et fièvre ne sont pas des tests d’exclusion. PL non routinière dans l’abcès cérébral. Dégradation clinique : réévaluation urgente.</p></template>
<template data-pop="g06-ceftriaxone" data-k="g06-ceftriaxone"><h3>Ceftriaxon Labatec : produit, rythme et limite rénale</h3><p>La notice de juin 2025 concerne notamment le flacon IV de 2 g. Elle décrit chez l’adulte et l’enfant de plus de 12 ans une dose habituelle de 1à 2 g une fois par jour ; dans les infections sévères, jusqu’à 4 g en une dose quotidienne unique. Le guide Spital Thurgau prescrit 2 g deux fois par jour pour l’abcès cérébral : la dose journalière est 4 g, mais la fréquence diffère de la notice. Cette différence doit être attribuée au protocole hospitalier, pas effacée.</p><p>Dans cette FI, une clairance de créatinine inférieure à 10 ml/min et la dialyse imposent un maximum de 2 g par jour. Le schéma Spital Thurgau de 4 g/j ne peut donc pas être repris sans réévaluation. Une atteinte combinée hépatique et rénale demande une surveillance adaptée. La perfusion dure au moins 30 minutes. Ne pas reconstituer ni mélanger avec une solution contenant du calcium ; les modalités de lignes et de rinçage doivent suivre la notice et le protocole.</p><p>Le flacon 2 g contient 166 mg de sodium. La notice ne nomme pas une indication spécifique d’abcès cérébral ; le choix de cette indication vient des recommandations cliniques. Pendant la grossesse, l’indication doit être formelle ; si le traitement est indispensable pendant l’allaitement, la FI demande d’interrompre celui-ci. Ces informations sont propres au produit lu.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r5">[5]</button></p></template>
<template data-pop="g06-metronidazole" data-k="g06-metronidazole"><h3>Metronidazol i.v. B. Braun : dose, durée et signaux d’alerte</h3><p>La préparation contient 500 mg dans 100 ml, soit 5 mg/ml, et 311 mg de sodium par 100 ml. Sa FI de février 2026 inclut l’abcès cérébral parmi les indications. Elle décrit une charge de 15 mg/kg puis 7,5 mg/kg toutes les 6 heures pendant trois jours et ensuite toutes les 12 heures, avec un maximum de 4 g/j. Ce schéma n’est pas le rythme fixe 500 mg trois fois/j du guide Spital Thurgau. Ne pas combiner les deux sans prescription explicite.</p><p>La FI décrit habituellement 5à 7 jours et normalement pas plus de 10 jours ; une prolongation est exceptionnelle, justifiée et accompagnée de contrôles, notamment hémogramme et recherche d’effets neurologiques. Le traitement global d’un abcès selon ESCMID peut durer 6à 8 semaines IV. La prise en charge spécialisée doit réconcilier ces exigences et documenter la surveillance, sans arrêt arbitraire de l’infection profonde ni reconduction sans contrôle.</p><p>Ataxie, paresthésies, confusion, vertiges inhabituels, myoclonies ou convulsions font rechercher une neurotoxicité et imposent interruption/réévaluation selon la notice. Une progression infectieuse reste à exclure. L’atteinte hépatique sévère demande réduction/surveillance ; une clairance<10ml/min peut favoriser l’accumulation de métabolites. Le premier trimestre de grossesse et le syndrome de Cockayne sont contre-indiqués. Les coumarines nécessitent surveillance de l’INR, le lithium une attention spécifique ; éviter l’alcool pendant le traitement et le lendemain selon cette FI.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r6">[6]</button></p></template>
<template data-pop="g06-coamoxicilline" data-k="g06-coamoxicilline"><h3>Pourquoi deux flacons de 1,2 g ne remplacent pas un flacon de 2,2 g</h3><p>Co-Amoxicillin Labatec 2,2 g contient 2000 mg d’amoxicilline et 200 mg d’acide clavulanique. Le flacon 1,2 g contient 1000 mg et 200 mg. Deux flacons 1,2 g apporteraient donc 2000 mg d’amoxicilline et 400 mg de clavulanate : ce n’est pas la même composition. La masse totale du nom ne suffit pas à choisir une présentation.</p><p>La FI d’octobre 2024 décrit dans les infections sévères de l’adulte et du patient>40 kg 2,2 g trois à quatre fois/j, en perfusion d’au moins 30 minutes. Le schéma Spital Thurgau quatre fois/j se situe dans cette plage pour un patient adapté. La présentation 2,2 g n’est pas indiquée si ClCr<30ml/min ; le tableau rénal de la FI comporte une ligne10–30ml/min avec charge1,2g puis600mg toutes12h et une ligne<10 avec600mg toutes24h après charge. Le libellé au point30 doit être vérifié individuellement, sans arrondi improvisé.</p><p>Allergie pertinente aux bêta-lactamines et antécédent d’ictère ou d’atteinte hépatique liée à cette association sont des contre-indications. Contrôler rein, foie et hémogramme lors du traitement prolongé, et l’INR avec anticoagulants coumariniques. Grossesse : nécessité absolue ; la notice demande de ne pas allaiter pendant ce traitement. La dose de l’abcès épidural vient du protocole Spital Thurgau, pas d’une indication épidurale explicitement nommée dans la FI.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r10">[10]</button></p></template>
<template data-pop="g06-cefepime" data-k="g06-cefepime"><h3>Céfépime OrPha : dose sévère et adaptation rénale</h3><p>La FI de septembre 2025 présente un flacon 2 g pour voie IV. Pour l’adulte et le patient de plus de 40 kg, une infection très grave peut recevoir 2 g toutes les 8 heures, maximum 6 g/j. Ce rythme correspond à l’exemple postopératoire Spital Thurgau. La notice prévoit une adaptation lorsque la clairance de créatinine est≤50 ml/min. Aucun tableau de paliers non relu n’est reconstruit ici ; la prescription doit consulter le tableau exact du produit.</p><p>Encéphalopathie, myoclonies, convulsions et état de mal non convulsif sont décrits, en particulier chez le patient âgé, en cas de rein altéré ou d’exposition excessive. Des cas peuvent survenir à une dose usuelle en présence d’insuffisance rénale. Une confusion nouvelle doit donc faire revoir immédiatement fonction rénale et prescription, sans omettre l’évaluation de l’infection ou d’une crise.</p><p>Les indications pédiatriques de méningite ne démontrent pas une indication adulte d’abcès cérébral dans la notice. Le contexte postopératoire de la leçon est attribué au protocole hospitalier. Vérifier allergies et autres précautions dans la notice complète avant prescription ; la lecture ciblée du cours n’est pas une substitution à cette consultation.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r11">[11]</button></p></template>
<template data-pop="g06-vancomycine" data-k="g06-vancomycine"><h3>Vancomycine Sandoz IV : calculer une durée minimale</h3><p>La FI de mars 2026 décrit chez les patients≥12 ans 15à 20 mg/kg toutes les 8à 12 heures, avec un maximum de 2 g par dose. Spital Thurgau indique 20 mg/kg toutes 12 heures en contexte postopératoire. Ces chiffres ne constituent pas un schéma fixe pour tout insuffisant rénal : adaptation, concentrations et fonction rénale doivent être suivies, avec gestion particulière de la dialyse.</p><p>La perfusion doit durer au moins 60 minutes et respecter un débit maximal de 10 mg/min, en retenant la durée la plus longue. Exemple calculé : pour 2000 mg,2000÷10=200 minutes au minimum. Une poche de 2 g ne doit donc pas être administrée en 60 minutes sur la seule base du minimum d’une heure. La dilution et la concentration suivent également la FI et le protocole du centre ; ne pas administrer en bolus.</p><p>Surveiller néphrotoxicité, ototoxicité, réactions de perfusion et réactions cutanées sévères. Un acouphène est un signal à évaluer ; une réaction cutanée sévère impose l’arrêt selon la notice. Les traitements prolongés exigent notamment suivi sanguin et rénal. La voie orale utilisée pour certaines infections intestinales ne remplace pas la voie IV systémique. La grossesse et l’allaitement nécessitent une nécessité absolue selon ce produit.</p><p>Sources : <button class="w" data-k="g06-r1">[1]</button> · <button class="w" data-k="g06-r13">[13]</button></p></template>
<template data-pop="g06-meropenem" data-k="g06-meropenem"><h3>Méropénème et valproate : ne pas corriger par une simple augmentation</h3><p>Le méropénème figure dans les propositions ESCMID d’abcès cérébral postopératoire, associé à vancomycine ou linézolide. La FI Fresenius de février 2026 décrit les doses adultes générales et une adaptation rénale ; la mention adulte 2 g toutes 8 heures pour méningite repose sur une expérience très limitée. Le tableau « méningite, abcès cérébral » de l’annexe SwissPedDose concerne l’enfant et ne doit pas être lu comme une validation de dose adulte d’abcès.</p><p>La notice décrit une baisse de 60à 100% des concentrations de valproate en environ deux jours sous carbapénème. L’association doit être évitée ; augmenter simplement la dose de valproate ne permet pas de gérer sûrement cette interaction. L’équipe doit revoir le traitement anti-infectieux ou antiépileptique selon les possibilités et surveiller les crises. Cette question compte particulièrement chez un patient ayant déjà une atteinte cérébrale.</p><p>Le schéma rénal commence à être adapté sous 51 ml/min dans cette notice. La dose adulte précise d’abcès n’est pas inventée à partir d’une annexe pédiatrique ; consulter protocole et infectiologue. La lecture ciblée ne justifie pas d’ajouter automatiquement cet antibiotique au schéma Spital Thurgau déjà choisi.</p><p>Sources : <button class="w" data-k="g06-r2">[2]</button> · <button class="w" data-k="g06-r12">[12]</button></p></template>
<template data-pop="pareto-g06-pharm" data-k="pareto-g06-pharm"><h3>Produit, population et surveillance</h3><p>Protocoles Spital Thurgau 2026 nommés ; fréquences des FI distinctes visibles. Ne pas convertir 2,2 g en deux 1,2 g, ni donner 2 g de vancomycine en 60 min. Fonction rénale et neurotoxicité à réévaluer. Durée cérébrale longue réconciliée avec les précautions de chaque molécule ; aucune dose pédiatrique présentée comme adulte.</p></template>
<template data-pop="pareto-g06-sci" data-k="pareto-g06-sci"><h3>Du normal au signe, puis à la décision</h3><p>Anatomie normale sur originaux humains ; inflammation/œdème/compression expliquent les signes, pas l’agent. Histologie et microbiologie se complètent. Diffusion/rehaussement ne remplacent pas preuve et clinique. Exposition dans le liquide céphalorachidien≠exposition dans le pus. Les limites des sources sont conservées.</p></template>
