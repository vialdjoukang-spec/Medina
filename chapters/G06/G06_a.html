<h1>Abcès et granulome intracrâniens et intrarachidiens</h1><span class="status">Adulte, avec repères pédiatriques limités · abcès cérébral, empyème sous-dural, abcès épidural intracrânien et spinal · socle : ligne directrice <button class="w" data-k="g06-sources">DGN</button> 2021 co-signée par la <button class="w" data-k="g06-sources">SNG</button> (validité échue), <button class="w" data-k="g06-sources">ESCMID</button> 2024 (résumé lu), cohortes suisses et européennes, informations professionnelles suisses 2025–2026 · état au 15.10.2026 · Cycle Betta 34 · audit différé, revue par intelligence artificielle, aucune validation médicale humaine</span></div>

<section class="ilot" id="g06-0"><h2><span class="n">0</span>Question clinique</h2><p>Dans cette <b>vignette fictive</b>, un homme de 48 ans consulte pour une céphalée croissante depuis dix jours. Il a une température de 38,3 °C, un vomissement matinal et une faiblesse discrète de la main droite apparue la veille. Il a subi une extraction dentaire trois semaines plus tôt. Aucune valeur de laboratoire n’est donnée volontairement : la question porte sur la démarche, non sur un chiffre.</p><p>Trois décisions s’enchaînent. La première concerne l’imagerie : une <b>IRM cérébrale avec injection de gadolinium et séquence de diffusion</b> est l’examen décisif, car elle distingue un abcès d’une tumeur nécrotique. La deuxième concerne la <button class="w" data-k="g06-pl">ponction lombaire (pourquoi elle est contre-indiquée en cas d’effet de masse)</button> : elle ne se fait pas avant l’imagerie et reste exclue si la lésion comprime le parenchyme, car un engagement cérébral peut en résulter. La troisième concerne le calendrier : des <button class="w" data-k="g06-hemocultures">hémocultures</button> se prélèvent avant la première dose d’antibiotique, et le neurochirurgien est contacté sans attendre, puisque le pus prélevé donne le germe.</p><p>Ce cours suit ensuite le même raisonnement pour tous les abcès de ce groupe : où le pus se collecte (parenchyme, espace sous-dural, espace épidural crânien ou rachidien), par quelle voie le germe est arrivé, quel geste évacue la collection et quel antibiotique atteint le foyer. Il traite aussi, dans un îlot séparé, l’<button class="w" data-k="g06-sepi-clinique">abcès épidural spinal (présentation, diagnostic et décision)</button>, dont la rachialgie fébrile précède le déficit.</p><div class="key"><b>À retenir.</b> Une céphalée fébrile avec signe focal impose une imagerie par résonance magnétique avec diffusion avant toute ponction lombaire, des hémocultures avant les antibiotiques et un avis neurochirurgical précoce. Un empyème sous-dural est une urgence chirurgicale.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §1–3, §5</a> ; <a href="https://doi.org/10.1093/qjmed/hcm100" target="_blank" rel="noopener">Sendi et al., QJM 2008</a>.</p></section>
<section class="ilot" id="g06-1"><h2><span class="n">1</span>Définitions, codage et classifications</h2><p>Le groupe G06 de la CIM-10-GM 2024 réunit les collections infectieuses du système nerveux central situées <b>dans le crâne</b> ou <b>dans le canal rachidien</b>. Il ne décrit pas une seule maladie : le traitement dépend de l’espace atteint, du germe et du stade évolutif. Quatre définitions sont à connaître, selon la ligne directrice allemande, autrichienne et suisse (<button class="w" data-k="g06-sources">DGN 2021 co-signée par la SNG</button>).</p><ul><li><b>Abcès cérébral</b> : infection locale du parenchyme. Elle commence comme une encéphalite focale, appelée <b>cérébrite</b>, puis évolue lentement vers une collection de pus entourée d’une capsule de tissu conjonctif.</li><li><b>Empyème sous-dural</b> : collection purulente dans l’espace sous-dural. Elle s’étale volontiers en nappe sur l’hémisphère, avec une forme en croissant comme l’hématome sous-dural.</li><li><b>Abcès épidural intracrânien</b> (rare) : pus entre la dure-mère et la voûte. Sa forme est <b>biconvexe</b>, car la dure-mère est solidement adhérente à l’os, comme dans l’hématome épidural.</li><li><b>Abcès épidural spinal</b> : infection de l’espace épidural du canal rachidien.</li></ul><p>Le tableau suivant rapproche chaque sous-code de son contenu. Les intitulés sont traduits de la classification allemande (BfArM) ; l’Office fédéral de la statistique ne détaille pas ces sous-codes dans le registre utilisé ici. Il sert à relier un diagnostic clinique à sa catégorie, sans remplacer la description anatomique qui suit.</p><table class="t"><tr><th>Sous-code</th><th>Contenu</th><th>Inclusions</th></tr><tr><td>G06.0</td><td><button class="w" data-k="g06-codage">Abcès et granulome intracrâniens</button></td><td>Abcès embolique du cerveau (toute partie), otogène, cérébelleux ou cérébral ; abcès ou granulome intracrânien épidural, extradural ou sous-dural</td></tr><tr><td>G06.1</td><td>Abcès et granulome intrarachidiens</td><td>Abcès embolique de la moelle (toute partie) ; abcès ou granulome intrarachidien épidural, extradural ou sous-dural</td></tr><tr><td>G06.2</td><td>Abcès extradural et sous-dural, sans précision</td><td>Aucune inclusion : localisation non précisée</td></tr></table><p>Pour nommer le germe, la classification demande un <b>code supplémentaire B95–B98</b>. Certaines lésions ressemblent à un abcès mais appartiennent à la catégorie <b>G07*</b>, codée par la maladie causale : l’abcès cérébral amibien (A06.6†), gonococcique (A54.8†) ou tuberculeux (A17.8†), le granulome cérébral de la schistosomiase (B65.-†) et le tuberculome cérébral (A17.8†) ou méningé (A17.1†). La toxoplasmose cérébrale et les tuberculomes imitent un abcès à l’imagerie mais sont exclus de la ligne directrice sur l’abcès bactérien ; ils sont rappelés dans le diagnostic différentiel.</p><h3>Trois façons de classer un abcès cérébral</h3><p>La <b>voie d’infection</b> oriente la recherche du foyer : par contiguïté (otite, mastoïdite, sinusite, méningite), par voie hématogène, par inoculation directe (traumatisme crânien ouvert, neurochirurgie) ou cryptogène quand aucun foyer n’est trouvé. Le <b>lieu d’acquisition</b> oriente l’antibiothérapie empirique : communautaire, post-opératoire, post-traumatique ou nosocomial, ou survenu sous immunodépression sévère (greffe, chimiothérapie). Le <b>stade radiologique</b> oriente le geste : une cérébrite ne se drainera pas, une capsule constituée peut l’être.</p><table class="t"><tr><th>Stade (Britt et Enzmann)</th><th>Délai approximatif</th><th>Aspect en imagerie</th></tr><tr><td>1. Cérébrite précoce</td><td>Jours 1 à 3</td><td>Hypodensité à la tomodensitométrie ou signal T1 bas mal limité ; prise de contraste absente ou irrégulière</td></tr><tr><td>2. Cérébrite tardive</td><td>Jours 4 à 8</td><td>Prise de contraste annulaire floue</td></tr><tr><td>3. Capsule précoce</td><td>Jours 9 à 13</td><td>Anneau net</td></tr><tr><td>4. Capsule tardive</td><td>À partir du jour 13</td><td>Capsule visible sans contraste (hypersignal T1), anneau net après contraste</td></tr></table><p>Ce découpage, repris par la ligne directrice de 2021, est un repère de chronologie moyenne et non une règle d’horloge : l’examen clinique et l’imagerie du patient priment. Sa valeur pratique est double. Il explique pourquoi une lésion récente ne contient pas encore de pus évacuable (<button class="w" data-k="g06-stades">les quatre stades en détail</button>), et il rappelle qu’une prise de contraste annulaire n’est pas synonyme de collection mûre. Le pronostic se résume par un <b><button class="w" data-k="g06-isi">Imaging Severity Index (score de gravité d’imagerie)</button></b> combinant le nombre de lésions, leur localisation, le diamètre maximal, l’œdème et la déviation de la ligne médiane.</p><p>L’abcès épidural spinal se classe, lui, en forme <b>primaire</b> (hématogène) ou <b>secondaire</b> à un geste rachidien (infiltration, chirurgie), distinction retenue dans la série bâloise.</p><div class="trap"><span class="k">Erreur fréquente</span> Un granulome non bactérien n’est pas un abcès à drainer : devant un anneau rehaussé chez un voyageur ou un patient infecté par le virus de l’immunodéficience humaine, penser à la toxoplasmose, au tuberculome ou à une parasitose avant de fixer le geste.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, G06 et G07*, G06, G07*</a> ; <a href="https://www.bfs.admin.ch/bfs/fr/home/statistiques/sante/nomenclatures/medsta.html" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 (fr), G06</a> ; <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §1, §3.1, §7</a> ; <a href="https://doi.org/10.1007/s00586-011-1838-y" target="_blank" rel="noopener">Zimmerer et al., Eur Spine J 2011</a>.</p></section>
<section class="ilot" id="g06-2"><h2><span class="n">2</span>Épidémiologie</h2><p>Dans les pays développés, l’incidence de l’abcès cérébral se situe entre <b>0,3 et 0,9 pour 100 000 personnes par an</b> (jusqu’à 1,3 selon les séries). Au Danemark, elle est passée de 0,60 pour 100 000 personnes-années en 1982–1988 à 0,90 en 2010–2016. <b>Aucune incidence suisse spécifique n’a été trouvée</b> ; les données suisses disponibles proviennent de séries hospitalières (Bâle, Liestal, Berne, Aarau), non de registres.</p><p>Une méta-analyse de 9699 patients décrit un sex-ratio de <b>2,4 hommes pour 1 femme</b> et un âge moyen de 34 ans. Une condition prédisposante existe chez 86 % des patients. Dans la série citée par la ligne directrice, les facteurs prédisposants se répartissent ainsi :</p><table class="t"><tr><th>Mécanisme</th><th>Part des cas</th><th>Précision</th></tr><tr><td>Contiguïté</td><td>Otite ou mastoïdite 33 % ; sinusite 10 % ; méningite 6 %</td><td>Rôle décroissant des foyers ORL dans les pays développés</td></tr><tr><td>Voie hématogène</td><td>33 %</td><td>Endocardite 13 % ; poumon 8 % ; dents 5 %</td></tr><tr><td>Inoculation directe</td><td>Traumatisme crânien 14 % ; neurochirurgie 9 %</td><td>Post-traumatique ou post-opératoire</td></tr><tr><td>Cryptogène</td><td>10 à 25 %</td><td>Aucun foyer retrouvé malgré le bilan</td></tr></table><p>Les terrains à risque sont l’immunodépression et le shunt droite-gauche pulmonaire ou cardiaque. Plus rarement, un hématome ou une métastase se surinfecte. Parmi les épisodes de méningite bactérienne communautaire dans une cohorte néerlandaise (2006–2023), <b>1,9 %</b> se sont compliqués d’un abcès cérébral ; cette proportion monte jusqu’à 52 % avec <i>Streptococcus anginosus</i> et atteint 4,6 % avec <i>Listeria</i>.</p><p>L’<b>abcès épidural spinal</b> représente 2,5 à 3 cas pour 10 000 hospitalisations, avec une tendance à la hausse ; il touche plus souvent l’homme âgé, et 75 % des cas sont d’abord mal diagnostiqués. La série bâloise de 36 patients (âge médian 56 ans) comptait 44 % de formes primaires et 56 % de formes secondaires à un geste rachidien.</p><div class="key"><b>À retenir.</b> Un abcès cérébral frappe plutôt un homme jeune, et une cause favorisante existe dans 86 % des cas ; 10 à 25 % restent cryptogènes. La fréquence de l’abcès épidural spinal augmente et le retard diagnostique est la règle.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §1–2</a> ; <a href="https://doi.org/10.1212/WNL.0000000000000172" target="_blank" rel="noopener">Brouwer et al., Neurology 2014</a> ; <a href="https://doi.org/10.1111/ene.70524" target="_blank" rel="noopener">Liechti et al., Eur J Neurol 2026</a> ; <a href="https://doi.org/10.1007/s00586-011-1838-y" target="_blank" rel="noopener">Zimmerer et al., Eur Spine J 2011</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a>.</p></section>
<section class="ilot" id="g06-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Comprendre la forme et la gravité d’un abcès demande d’abord de situer les espaces. La dure-mère crânienne adhère à l’os de la voûte : une collection épidurale reste donc limitée et prend une forme <b>biconvexe</b>. L’espace sous-dural, au contraire, ne présente pas cette adhérence ; le pus s’y étale en nappe, parfois en quelques heures, sur la convexité ou le long de la faux du cerveau. Cette différence explique pourquoi le pronostic d’un abcès épidural crânien est bien meilleur que celui d’un empyème sous-dural, qui est une urgence neurochirurgicale. La <button class="w" data-k="g06-anatomie-note">figure du panneau Sciences (formes des collections)</button> le schématise.</p><p>Dans le parenchyme, l’infection suit une chronologie. Une <b>cérébrite</b> (encéphalite focale) précède une nécrose centrale, puis une capsule conjonctive se forme en environ deux semaines. La conséquence thérapeutique est directe : au stade de cérébrite, il n’existe pas de pus à évacuer et l’exérèse n’a pas de place ; le traitement est conservateur. Plus tard, la capsule rend la lésion accessible à l’aspiration ou à l’exérèse.</p><p>La <b>microbiologie</b> est souvent plus riche qu’une culture ne le montre. Les infections sont fréquemment polymicrobiennes, aérobies et anaérobies. Chez 20 patients, la PCR ciblant l’ARN ribosomal 16S a identifié 72 souches contre 22 par culture, avec jusqu’à 16 espèces dans un seul abcès (<button class="w" data-k="g06-microbio">pourquoi la culture sous-estime les germes</button>). Les germes buccaux donnent des abcès polymicrobiens ; <i>Staphylococcus aureus</i> et <i>Pseudomonas aeruginosa</i> sont plus souvent seuls. Des germes viables persistent fréquemment après le début des antibiotiques, ce qui justifie de prélever le pus tôt et de maintenir un antibiotique actif contre les anaérobies même si seuls des aérobies poussent.</p><p>L’<b>effet de masse</b> et l’œdème périfocal élèvent la pression intracrânienne et peuvent aboutir à un engagement. Un abcès proche des ventricules peut s’y rompre et provoquer une ventriculite ; la mortalité à un an d’une ventriculite, toutes causes confondues, est de 33,7 %, et de 27,6 % lorsqu’elle complique un abcès. Enfin, la <b>pénétration des antibiotiques</b> dans le système nerveux central varie : la vancomycine traverse peu la barrière hémato-encéphalique sans inflammation méningée, la ceftriaxone atteint jusqu’à 25 % de son taux plasmatique dans le liquide cérébrospinal en cas de méningite et 2 % sans inflammation, alors que le métronidazole diffuse dans l’abcès à une concentration comparable à celle du sérum. Ces écarts fondent le choix des molécules (<button class="w" data-k="g06-penetration">tableau de pénétration</button>).</p><div class="key"><b>À retenir.</b> Forme (biconvexe ou en nappe) → vitesse d’extension → urgence. Stade (cérébrite ou capsule) → présence de pus → geste. Microbiologie polymicrobienne → couverture des anaérobies. Pénétration → choix de la molécule.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §1, §2, §4, §5.1, §5.6, §5.8, §7</a> ; <a href="https://doi.org/10.1093/brain/awaf178" target="_blank" rel="noopener">Luque Paz et al., Brain 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener">information professionnelle suisse Ceftriaxon Labatec®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680480180251" target="_blank" rel="noopener">information professionnelle suisse Metronidazol B. Braun, février 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680572360035" target="_blank" rel="noopener">information professionnelle suisse Vancomycine Sandoz®, mars 2026</a>.</p></section>
<section class="ilot" id="g06-4"><h2><span class="n">4</span>Causes et germes</h2><p>Les germes d’un abcès bactérien dépendent de la voie d’entrée. Le tableau reprend les fréquences de la ligne directrice de 2021. Une culture est positive dans 59,5 % des cas, plusieurs germes sont isolés dans 17 %, et aucun dans 27,5 % (série citée) ; ces chiffres reflètent en partie la limite des cultures décrite plus haut. La méta-analyse de 2014 trouve des streptocoques dans 34 % et des staphylocoques dans 18 % des bactéries cultivées, avec une répartition stable sur soixante ans.</p><table class="t"><tr><th>Germe (abcès bactérien)</th><th>Fréquence</th></tr><tr><td>Streptocoques (surtout du groupe <i>viridans</i>)</td><td>35 à 50 %</td></tr><tr><td><i>Staphylococcus aureus</i></td><td>10 à 15 %</td></tr><tr><td>Staphylocoques à coagulase négative</td><td>5 à 10 %</td></tr><tr><td>Anaérobies stricts (par exemple <i>Bacteroides</i>)</td><td>15 à 40 %</td></tr><tr><td>Bacilles à Gram négatif aérobies (entérobactéries, <i>Pseudomonas</i>)</td><td>15 à 30 %</td></tr></table><p>Les pourcentages dépassent 100 % au total, parce que beaucoup d’abcès sont polymicrobiens. Chez l’<b>immunodéprimé</b>, le spectre s’élargit : entérobactéries, <i>Pseudomonas</i>, <i>Nocardia</i>, <i>Actinomyces</i> et champignons (<i>Aspergillus</i>, <i>Candida</i>, <i>Cryptococcus</i>, Mucorales). <i>Scedosporium</i> est décrit après une quasi-noyade. Selon le voyage, il faut penser à la mélioïdose, à <i>Entamoeba</i> et aux helminthes (schistosomes, échinocoque, <i>Taenia solium</i>) ; la toxoplasmose concerne l’infection par le virus de l’immunodéficience humaine.</p><p>Une série de Freiburg im Breisgau et d’Aarau couvrant 2000–2021 montre un <b>spectre en mutation</b> : la part des champignons, des parasites, des mycobactéries et des anaérobies augmente. Pour l’abcès épidural spinal, <i>S. aureus</i> est le germe le plus fréquent (50 % dans la série bâloise) ; viennent ensuite les bacilles à Gram négatif et les streptocoques. Les foyers d’origine sont la peau, les tissus mous, les voies urinaires, une spondylodiscite ou un geste iatrogène (anesthésie péridurale). Les prédispositions sont le diabète, la toxicomanie intraveineuse, la bactériémie, l’alcoolisme, un traumatisme et l’immunosuppression.</p><div class="key"><b>À retenir.</b> Streptocoques et anaérobies dominent l’abcès cérébral communautaire ; <i>S. aureus</i> domine l’abcès épidural spinal. Le contexte (greffe, voyage, neurochirurgie, infection par le virus de l’immunodéficience humaine) change la liste.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), Tab. 1, §4</a> ; <a href="https://doi.org/10.1212/WNL.0000000000000172" target="_blank" rel="noopener">Brouwer et al., Neurology 2014</a> ; <a href="https://doi.org/10.1007/s00586-011-1838-y" target="_blank" rel="noopener">Zimmerer et al., Eur Spine J 2011</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a> ; <a href="https://doi.org/10.1007/s00701-024-06349-8" target="_blank" rel="noopener">Kraus et al., Acta Neurochir 2024</a>.</p></section>
<section class="ilot" id="g06-5"><h2><span class="n">5</span>Anamnèse</h2><p>L’interrogatoire cherche deux choses : un tableau neurologique d’évolution plutôt <b>subaiguë</b> et un <b>foyer infectieux source</b>. Les antécédents utiles sont une otite, une mastoïdite ou une sinusite, des soins dentaires récents, une endocardite, une infection pulmonaire, une neurochirurgie ou un traumatisme crânien, une immunodépression (virus de l’immunodéficience humaine, diabète, alcool, toxicomanie), puis les voyages et les expositions. Une cardiopathie avec shunt droite-gauche est aussi à rechercher (<button class="w" data-k="g06-voies">voies d’infection et foyers à chercher</button>).</p><p>La fréquence des symptômes de l’abcès cérébral, d’après la ligne directrice, est la suivante :</p><table class="t"><tr><th>Symptôme ou signe</th><th>Fréquence</th></tr><tr><td>Céphalée (souvent avec nausées et vomissements)</td><td>environ 70 %</td></tr><tr><td>Fièvre</td><td>environ 50 %</td></tr><tr><td>Crises épileptiques</td><td>environ 25 %</td></tr><tr><td>Baisse de vigilance ou signes focaux</td><td>30 à 60 %</td></tr><tr><td>Triade céphalée, fièvre et déficit focal</td><td>environ 20 %</td></tr></table><p>La <button class="w" data-k="g06-triade">triade classique (céphalée, fièvre, déficit focal)</button> est donc minoritaire : l’absence de l’une de ses composantes n’écarte pas le diagnostic. Les signes d’engagement apparaissent lorsque l’évolution est rapide ou lorsque l’abcès se rompt.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Un homme de 34 ans, ancien patient d’une otite chronique, présente depuis une semaine une céphalée croissante, des vomissements et une faiblesse d’un membre. La température est modérée. L’imagerie montre une lésion annulaire solitaire. La voie de contiguïté est la plus plausible.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un patient sans foyer apparent (forme cryptogène, 10 à 25 %), un patient immunodéprimé dont la fièvre manque, un tableau limité à des crises, ou un abcès épidural spinal dont la rachialgie est prise pour une douleur banale. Dans ces cas, la triade fait défaut et le retard diagnostique s’allonge.</p></div></div><h3>Anamnèse de l’abcès épidural spinal</h3><p>La plupart des patients présentent une <b>douleur rachidienne localisée et intense</b> ; la triade douleur, fièvre et déficit manque souvent au premier contact. Les fréquences médianes à la présentation (Sendi, 2008) sont les suivantes :</p><table class="t"><tr><th>Signe</th><th>Fréquence (%)</th></tr><tr><td>Rachialgie</td><td>75</td></tr><tr><td>Sensibilité rachidienne</td><td>58</td></tr><tr><td>Faiblesse musculaire</td><td>40</td></tr><tr><td>Douleur irradiée</td><td>38</td></tr><tr><td>Troubles sensitifs</td><td>36</td></tr><tr><td>Fièvre</td><td>32</td></tr><tr><td>Troubles vésico-sphinctériens</td><td>27</td></tr><tr><td>Paralysie</td><td>27</td></tr></table><div class="trap"><span class="k">Piège</span> Dans l’abcès épidural spinal, la fièvre n’est présente que dans un tiers des cas : une rachialgie intense sans fièvre n’écarte pas le diagnostic, surtout chez un patient diabétique, toxicomane, ou ayant subi un geste rachidien.</div><div class="key"><b>À retenir.</b> L’anamnèse cible le foyer et la chronologie. Elle ne cherche pas la triade complète, présente dans environ un cas sur cinq.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §2</a> ; <a href="https://doi.org/10.1212/WNL.0000000000000172" target="_blank" rel="noopener">Brouwer et al., Neurology 2014</a> ; <a href="https://doi.org/10.1093/qjmed/hcm100" target="_blank" rel="noopener">Sendi et al., QJM 2008</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014, Tab. 1</a>.</p></section>
<section class="ilot" id="g06-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen suit l’ordre habituel : état général, constantes, puis examen ciblé. Les sources lues décrivent les <b>manifestations</b> et leur fréquence, mais pas la technique gestuelle de chaque signe ; cette limite est assumée plutôt que comblée de mémoire.</p><div class="two"><div class="card"><h4>Général et constantes</h4><p>La fièvre existe dans environ la moitié des abcès cérébraux : son absence n’exclut donc pas le diagnostic. L’examen cherche le foyer source mentionné par les sources : cavité buccale et dents, sphère oto-rhino-laryngologique (oreille, sinus, mastoïde), endocardite, atteinte pulmonaire.</p><p>Un trouble de la vigilance ou une crise épileptique orientent vers l’hospitalisation en soins intensifs si l’état de mal ou une série de crises s’installent.</p></div><div class="card"><h4>Neurologique</h4><p>Les signes focaux dépendent du siège de l’abcès. Le fond d’œil recherche un œdème papillaire, signe péjoratif. Une mydriase, un coma ou une aggravation neurologique rapide traduisent un engagement.</p><p>Une localisation exposant à l’hydrocéphalie, notamment cérébelleuse, justifie une surveillance rapprochée et, selon la ligne directrice, le recours aux glucocorticoïdes.</p></div></div><div class="two"><div class="card"><h4>Rachidien</h4><p>Rechercher une sensibilité rachidienne, une faiblesse, des troubles sensitifs et des troubles vésico-sphinctériens. Un déficit déjà installé annonce un pronostic réservé : la récupération dépend de la durée du déficit avant la chirurgie.</p></div><div class="card"><h4>Foyers à identifier</h4><p>Dents, oreille, sinus : source de contiguïté. Peau, tissus mous, voies urinaires : source de l’abcès épidural spinal. Rachis opéré ou infiltré : cause iatrogène.</p></div></div><div class="trap"><span class="k">Piège</span> La contre-indication de la ponction lombaire se juge sur l’imagerie : chez un patient fébrile avec céphalée et déficit focal, l’IRM précède donc toute ponction.</div><div class="key"><b>À retenir.</b> L’examen documente l’état neurologique initial, cherche des signes d’engagement et localise le foyer. Une aggravation sous traitement impose une nouvelle imagerie.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §2, §5.8, §7, §8</a> ; <a href="https://doi.org/10.1093/qjmed/hcm100" target="_blank" rel="noopener">Sendi et al., QJM 2008</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a>.</p></section>
<section class="ilot" id="g06-7"><h2><span class="n">7</span>Démarche diagnostique et différentiel</h2><p>Le diagnostic repose sur un faisceau : une lésion annulaire rehaussée avec restriction de diffusion centrale à l’IRM, un contexte favorisant et, si possible, une confirmation microbiologique du pus. Aucun critère formel validé n’a été trouvé dans les sources lues ; le faisceau retenu figure à l’îlot final. La <button class="w" data-k="g06-irm-diffusion">séquence de diffusion (principe et pièges)</button> est l’élément qui oriente le plus, avec une sensibilité et une spécificité voisines de 95 %. La tomodensitométrie seule ne suffit ni à affirmer ni à exclure le diagnostic.</p><p>L’algorithme pratique suit cinq étapes : (1) soupçonner l’abcès devant céphalée, fièvre ou déficit focal ; (2) réaliser l’IRM avec diffusion avant toute ponction lombaire ; (3) prélever les hémocultures avant l’antibiotique ; (4) obtenir l’avis neurochirurgical pour l’aspiration ou l’exérèse, qui donne le germe ; (5) chercher le foyer source. Le <button class="w" data-k="g06-mnemo">moyen mnémotechnique des cinq étapes (aide pédagogique)</button> résume cette séquence.</p><p>Le diagnostic différentiel se hiérarchise par gravité et par risque d’erreur :</p><table class="t"><tr><th>Diagnostic</th><th>Ce qui oriente</th><th>Piège</th></tr><tr><td>Tumeur à nécrose centrale (glioblastome, métastase)</td><td>Anneau rehaussé ; la diffusion aide à distinguer, sans trancher toujours</td><td>La diffusion ne tranche pas toujours : métastases mucineuses et glioblastome peuvent restreindre</td></tr><tr><td>Aspergillome</td><td>Anneau rehaussé avec restriction de diffusion sur la face interne de la capsule</td><td>Terrain d’immunodépression ; exérèse souvent nécessaire car le contenu est ferme</td></tr><tr><td>Toxoplasmose cérébrale</td><td>Virus de l’immunodéficience humaine</td><td>Traitement spécifique ; pas de chirurgie systématique</td></tr><tr><td>Tuberculome, granulomes ou kystes parasitaires</td><td>Voyage, contexte d’exposition</td><td>Classés en G07* ou ailleurs</td></tr><tr><td>Abcès épidural spinal (rachialgie banale, autre infection)</td><td>Rachialgie intense ± fièvre</td><td>75 % de diagnostics initiaux manqués</td></tr></table><div class="trap"><span class="k">Piège</span> Devant une lésion annulaire, ne pas conclure à une tumeur sur la seule absence de fièvre : la fièvre n’existe que dans la moitié des abcès. Inversement, des bulles gazeuses sont pathognomoniques mais rares.</div><div class="key"><b>À retenir.</b> IRM avec diffusion en première ligne, microbiologie du pus pour confirmer, recherche du foyer source. La tomodensitométrie est un examen d’urgence, pas un examen de décision.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §3.1</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a>.</p><button class="pareto-btn ui" data-k="pareto-g06-clinique">▲ Loi de Pareto — Pathologie : définitions, clinique et diagnostic</button></section>
