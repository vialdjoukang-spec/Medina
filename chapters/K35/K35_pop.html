<template data-pop="pareto-k35-clinique" data-title="Loi de Pareto — Appendicite aiguë"><p class="ratio" data-cover="k35-3,k35-4,k35-6,k35-7,k35-9"></p><ul><li>Scores AIR et AAS pour stratifier.</li><li>Échographie d’abord ; scanner faible dose ensuite.</li><li>Laparoscopie dans les 24 h.</li><li>Antibiotiques premiers : forme simple sans stercolithe.</li><li>Abcès : laparoscopie ou antibiotiques ± drainage ; ≥ 40 ans : coloscopie.</li><li>Dose unique ; 3-5 jours au plus si compliquée.</li></ul></template>
<template data-pop="pareto-k35-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k35-e-1,k35-e-2"></p><ul><li>Score d’abord.</li><li>Échographie en première ligne.</li><li>Scanner faible dose si échographie négative.</li><li>Stercolithe et complication à rechercher.</li><li>Histologie systématique.</li></ul></template>
<template data-pop="pareto-k35-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k35-p-1,k35-p-2,k35-p-3"></p><ul><li>Dose unique préopératoire.</li><li>Co-amoxicilline i.v. en premier choix.</li><li>Allergie : ciprofloxacine + métronidazole.</li><li>Arrêt à J3 si critères réunis.</li></ul></template>
<template data-pop="k35-aa" data-title="Appendicite aiguë"><p class="lab">Définition</p><p>Inflammation aiguë de l’appendice vermiforme.</p><p class="lab">Épidémiologie</p><p>Pic 10-30 ans ; risque vie entière ≈ 8 % en Europe.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-simple" data-title="Appendicite non compliquée"><p class="lab">Définition</p><p>Inflammation sans gangrène, perforation, phlegmon, abcès ni péritonite.</p><p class="lab">Options</p><p>Laparoscopie < 24 h ou antibiotiques premiers si pas de stercolithe.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-compliquee" data-title="Appendicite compliquée"><p class="lab">Définition</p><p>Gangrène, perforation, phlegmon, abcès périappendiculaire ou péritonite.</p><p class="lab">Mortalité</p><p>≈ 5 % en cas de perforation.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-scores" data-title="Scores cliniques de l’appendicite"><p class="lab">Recommandés</p><p>AIR et AAS (recommandation 1.4, forte).</p><p class="lab">Alvarado</p><p>Utile pour exclure ; ne pas l’utiliser pour confirmer chez l’adulte (1.3).</p><p class="lab">Haut risque</p><p>AIR 9-12, Alvarado 9-10, AAS ≥ 16.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-air" data-title="Score AIR"><p class="lab">Nom</p><p>Appendicitis Inflammatory Response score (Andersson, 2008).</p><p class="lab">Haut risque</p><p>9-12.</p><p class="lab">Place</p><p>Score recommandé, avec l’AAS (1.4).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-aas" data-title="Score AAS"><p class="lab">Nom</p><p>Adult Appendicitis Score.</p><p class="lab">Seuils</p><p>≥ 16 : forte probabilité (spécificité 93 % dans l’étude citée) ; < 11 : faible probabilité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-alvarado" data-title="Score d’Alvarado"><p class="lab">Haut risque</p><p>9-10.</p><p class="lab">Limite</p><p>Pas assez spécifique pour confirmer chez l’adulte (recommandation 1.3).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-echo" data-title="Échographie au lit du patient"><p class="lab">Place</p><p>Première ligne chez l’adulte et l’enfant si une imagerie est indiquée (1.10, forte).</p><p class="lab">Grossesse</p><p>Échographie par compression graduée en premier (1.13.1).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-tdm" data-title="Scanner injecté à faible dose"><p class="lab">Place</p><p>Adolescent et adulte jeune avec échographie négative (1.11, forte).</p><p class="lab">Avant 40 ans à haut risque</p><p>Peut être évité avant la laparoscopie (1.9).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-lap" data-title="Appendicectomie laparoscopique"><p class="lab">Place</p><p>Approche préférée pour les formes simples et compliquées (4.1, forte).</p><p class="lab">Délai</p><p>Dans les 24 h, pas au-delà (3.1, 3.2).</p><p class="lab">Technique</p><p>Trois trocarts ; ligature simple du moignon ; pas de drain chez l’adulte.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-nom" data-title="Traitement antibiotique premier"><p class="lab">Indication</p><p>Appendicite non compliquée sans stercolithe, patient sélectionné et informé (2.1.1, forte).</p><p class="lab">Risque</p><p>Récidive jusqu’à 39 % à 5 ans ; APPAC : 27,3 % opérés dans l’année.</p><p class="lab">Contre</p><p>Grossesse (2.1.2).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-stercolithe" data-title="Stercolithe (appendicolithe)"><p class="lab">Définition</p><p>Concrétion fécale calcifiée dans la lumière appendiculaire.</p><p class="lab">Portée</p><p>Augmente l’échec des antibiotiques ; chirurgie recommandée chez l’enfant dans ce cas.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-phlegmon" data-title="Phlegmon appendiculaire"><p class="lab">Définition</p><p>Masse inflammatoire périappendiculaire sans collection drainable.</p><p class="lab">Traitement</p><p>Laparoscopie si expertise ; sinon antibiotiques (6.1, 6.2).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-neo" data-title="Tumeurs appendiculaires"><p class="lab">Fréquence</p><p>3-17 % chez l’adulte ≥ 40 ans avec appendicite compliquée.</p><p class="lab">Conduite</p><p>Coloscopie et scanner injecté d’intervalle après traitement non opératoire (6.4).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-grade" data-title="Grading peropératoire"><p class="lab">Exemples</p><p>Score WSES 2015 ou score AAST de chirurgie générale d’urgence.</p><p class="lab">Intérêt</p><p>Corrèle mieux que l’histologie avec la morbidité ; guide la suite (5.2).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-d-coamox" data-title="Amoxicilline-acide clavulanique"><p class="lab">Indications suisses (i.v.)</p><p>Notamment péritonite et prophylaxie en chirurgie abdominale.</p><p class="lab">Doses (FI)</p><p>1 200 mg 3-4 ×/j (modérée) ; 2 200 mg 3-4 ×/j (grave) ; prophylaxie : dose unique à l’induction.</p><p class="lab">Contre-indications</p><p>Allergie aux pénicillines ou céphalosporines ; ictère antérieur sous co-amoxicilline.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Co-Amoxi-Mepha i.v., Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Augmentin®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k35-d-cipro" data-title="Ciprofloxacine"><p class="lab">Place</p><p>Allergie aux bêta-lactamines, toujours avec le métronidazole.</p><p class="lab">Dose (CHUV)</p><p>i.v. 400 mg/12 h ; per os 500 mg/12 h.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></template>
<template data-pop="k35-d-metro" data-title="Métronidazole"><p class="lab">Rôle</p><p>Couverture des anaérobies.</p><p class="lab">Dose (CHUV)</p><p>500 mg toutes les 8 h, i.v. ou per os.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></template>
