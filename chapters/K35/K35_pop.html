<template data-pop="pareto-k35-clinique" data-title="Loi de Pareto — Appendicite aiguë"><p class="ratio" data-cover="k35-3,k35-4,k35-6,k35-7,k35-9"></p><ul><li>Scores AIR et AAS pour stratifier.</li><li>On fait d’abord une échographie, puis un scanner faible dose.</li><li>Laparoscopie dans les 24 h.</li><li>Les antibiotiques premiers ne conviennent qu’à la forme simple sans stercolithe.</li><li>L’abcès se traite par laparoscopie ou par antibiotiques avec un drainage si nécessaire ; à partir de 40 ans, on fait une coloscopie.</li><li>La prophylaxie est une dose unique, et la forme compliquée reçoit 3-5 jours au plus.</li></ul></template>
<template data-pop="pareto-k35-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k35-e-1,k35-e-2"></p><ul><li>Score d’abord.</li><li>L’échographie est l’examen de première ligne.</li><li>On fait un scanner faible dose si l’échographie est négative.</li><li>Stercolithe et complication à rechercher.</li><li>L’histologie est systématique.</li></ul></template>
<template data-pop="pareto-k35-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k35-p-1,k35-p-2,k35-p-3"></p><ul><li>Dose unique préopératoire.</li><li>La co-amoxicilline i.v. est le premier choix.</li><li>En cas d’allergie, on donne la ciprofloxacine avec le métronidazole.</li><li>Arrêt à J3 si critères réunis.</li></ul></template>
<template data-pop="k35-aa" data-title="Appendicite aiguë"><p class="lab">Définition</p><p>C’est une inflammation aiguë de l’appendice vermiforme.</p><p class="lab">Épidémiologie</p><p>Elle culmine entre 10 et 30 ans, et le risque sur la vie entière atteint environ 8 % en Europe.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>

<template data-pop="k35-compliquee" data-title="Appendicite compliquée"><p class="lab">Définition</p><p>Gangrène, perforation, phlegmon, abcès périappendiculaire ou péritonite.</p><p class="lab">Mortalité</p><p>Elle atteint environ 5 % en cas de perforation.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-scores" data-title="Scores cliniques de l’appendicite"><p class="lab">Recommandés</p><p>La WSES recommande l’AIR et l’AAS (recommandation 1.4, forte).</p><p class="lab">Alvarado</p><p>Il sert à exclure, mais pas à confirmer chez l’adulte (1.3), car sa spécificité est insuffisante.</p><p class="lab">Haut risque</p><p>Le risque est haut pour un AIR de 9-12, un Alvarado de 9-10 ou un AAS ≥ 16.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-air" data-title="Score AIR"><p class="lab">Nom</p><p>Appendicitis Inflammatory Response score (Andersson, 2008).</p><p class="lab">Haut risque</p><p>9-12.</p><p class="lab">Place</p><p>Score recommandé, avec l’AAS (1.4).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-aas" data-title="Score AAS"><p class="lab">Nom</p><p>AAS signifie Adult Appendicitis Score.</p><p class="lab">Seuils</p><p>Un score ≥ 16 signale une forte probabilité (spécificité 93 % dans l’étude citée), et un score < 11 une faible probabilité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>

<template data-pop="k35-lap" data-title="Appendicectomie laparoscopique"><p class="lab">Place</p><p>Approche préférée pour les formes simples et compliquées (4.1, forte).</p><p class="lab">Délai</p><p>On opère dans les 24 h, mais pas au-delà (3.1, 3.2), car le risque de complication augmente ensuite.</p><p class="lab">Technique</p><p>Le chirurgien utilise trois trocarts et une ligature simple du moignon, et il ne draine pas chez l’adulte.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-nom" data-title="Traitement antibiotique premier"><p class="lab">Indication</p><p>Appendicite non compliquée sans stercolithe, patient sélectionné et informé (2.1.1, forte).</p><p class="lab">Risque</p><p>La récidive atteint 39 % à 5 ans, et dans APPAC, 27,3 % des patients ont été opérés dans l’année.</p><p class="lab">Contre</p><p>On ne le propose pas pendant la grossesse (2.1.2).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-stercolithe" data-title="Stercolithe (appendicolithe)"><p class="lab">Définition</p><p>Concrétion fécale calcifiée dans la lumière appendiculaire.</p><p class="lab">Portée</p><p>Il augmente l’échec des antibiotiques, car il obstrue la lumière ; c’est pourquoi on opère l’enfant dans ce cas.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-phlegmon" data-title="Phlegmon appendiculaire"><p class="lab">Définition</p><p>C’est une masse inflammatoire périappendiculaire sans collection drainable.</p><p class="lab">Traitement</p><p>On opère par laparoscopie si l’expertise existe ; sinon, on donne des antibiotiques (6.1, 6.2).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-neo" data-title="Tumeurs appendiculaires"><p class="lab">Fréquence</p><p>3-17 % chez l’adulte ≥ 40 ans avec appendicite compliquée.</p><p class="lab">Conduite</p><p>Coloscopie et scanner injecté d’intervalle après traitement non opératoire (6.4).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-grade" data-title="Grading peropératoire"><p class="lab">Exemples</p><p>Le score WSES 2015 et le score AAST de chirurgie générale d’urgence en sont des exemples.</p><p class="lab">Intérêt</p><p>Il prédit mieux la morbidité que l’histologie et guide la suite (5.2).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></template>
<template data-pop="k35-d-coamox" data-title="Amoxicilline-acide clavulanique"><p class="lab">Indications suisses (i.v.)</p><p>Notamment péritonite et prophylaxie en chirurgie abdominale.</p><p class="lab">Doses (FI)</p><p>On donne 1 200 mg 3-4 ×/j dans l’infection modérée et 2 200 mg 3-4 ×/j dans l’infection grave ; en prophylaxie, une dose unique suffit à l’induction.</p><p class="lab">Contre-indications</p><p>Elle est contre-indiquée en cas d’allergie aux pénicillines ou aux céphalosporines et d’ictère antérieur sous co-amoxicilline.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Co-Amoxi-Mepha i.v., Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Augmentin®, Swissmedic (AIPS), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k35-d-cipro" data-title="Ciprofloxacine"><p class="lab">Place</p><p>On la donne en cas d’allergie aux bêta-lactamines, toujours avec le métronidazole, car elle ne couvre pas les anaérobies.</p><p class="lab">Dose (CHUV)</p><p>i.v. 400 mg/12 h ; per os 500 mg/12 h.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></template>
<template data-pop="k35-d-metro" data-title="Métronidazole"><p class="lab">Rôle</p><p>Il couvre les anaérobies.</p><p class="lab">Dose (CHUV)</p><p>On donne 500 mg toutes les 8 h, i.v. ou per os.</p><p class="src">Références : <a href="https://www.chuv.ch/fileadmin/sites/min/552801_22_DM_DAM_guide_antibiotherapie_version_mai_2022.pdf" target="_blank" rel="noopener">Service des maladies infectieuses et Pharmacie du CHUV, Guide d’antibiothérapie empirique chez l’adulte, version de mai 2022 (infections intra-abdominales, p. 22-23 ; posologies usuelles, p. 52)</a>.</p></template>
