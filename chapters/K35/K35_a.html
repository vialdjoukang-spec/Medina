<h1>Appendicite aiguë</h1><span class="status">Adulte (avec repères pour l’enfant et la grossesse) · appendicite aiguë non compliquée et compliquée (perforation, phlegmon, abcès, péritonite) · rédaction du 09.10.2026 · référentiels WSES Jérusalem 2020, guide d’antibiothérapie empirique du CHUV 2022, informations professionnelles suisses</span></div>

<section class="ilot" id="k35-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 24 ans consulte aux urgences pour une douleur abdominale apparue depuis 18 heures, désormais localisée dans la fosse iliaque droite, avec des nausées et une fièvre à 38,1 °C. <b>La question est donc de savoir s’il a une <button class="w" data-k="k35-aa">appendicite aiguë</button>, si elle est compliquée, et s’il faut l’opérer ou la traiter par antibiotiques.</b></p><p>Pour y répondre, le médecin doit savoir : calculer un <button class="w" data-k="k35-scores">score clinique</button> pour classer le risque ; choisir l’imagerie selon ce risque, en commençant par l’<button class="w" data-k="k35-echo">échographie</button> ; distinguer l’<button class="w" data-k="k35-simple">appendicite non compliquée</button> de l’<button class="w" data-k="k35-compliquee">appendicite compliquée</button> ; ensuite, proposer une <button class="w" data-k="k35-lap">appendicectomie laparoscopique</button> dans les 24 heures ou discuter un <button class="w" data-k="k35-nom">traitement antibiotique premier</button> ; enfin, doser l’antibiothérapie au juste nécessaire.</p><div class="key"><b>Point de départ.</b> Devant une douleur de la fosse iliaque droite, une fièvre et des nausées, on calcule un score clinique, puis on choisit l’imagerie selon le risque, et enfin on opère ou l’on donne des antibiotiques.</div></section>
<section class="ilot" id="k35-1"><h2><span class="n">1</span>Définition et épidémiologie</h2><p>L’<button class="w" data-k="k35-aa">appendicite aiguë</button> est l’inflammation aiguë de l’appendice vermiforme ; or, elle reste l’une des urgences chirurgicales abdominales les plus fréquentes. En effet, son incidence culmine entre 10 et 30 ans, et le risque de la présenter au cours de la vie est d’environ 8 % en Europe, contre 9 % aux États-Unis et 2 % en Afrique (WSES 2020).</p><p>Par ailleurs, la gravité varie beaucoup. Ainsi, la perforation survient dans 16 à 40 % des cas, plus souvent chez les jeunes (40 à 57 %) et après 50 ans (55 à 70 %). De plus, la mortalité est inférieure à 0,1 % dans l’appendicite non gangréneuse, atteint 0,6 % dans la forme gangréneuse et environ 5 % en cas de perforation (WSES 2020). C’est pourquoi distinguer les formes simples des formes <button class="w" data-k="k35-compliquee">compliquée</button>s est l’enjeu central.</p><div class="key"><b>À retenir.</b> L’appendicite culmine entre 10 et 30 ans, avec un risque sur la vie entière d’environ 8 % en Europe. Elle perfore dans 16-40 % des cas, et sa mortalité passe de < 0,1 % (simple) à 0,6 % (gangréneuse) et à environ 5 % (perforée).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></section>
<section class="ilot" id="k35-2"><h2><span class="n">2</span>Physiopathologie et formes évolutives</h2><p>L’obstruction de la lumière appendiculaire, par exemple par un <button class="w" data-k="k35-stercolithe">stercolithe</button>, a longtemps été tenue pour le moteur unique de la maladie ; cependant, la WSES souligne que la perforation n’en est pas l’issue obligatoire. En effet, des données croissantes indiquent que toutes les appendicites n’évoluent pas vers la perforation, et que la résolution spontanée pourrait même être fréquente.</p><p>Dès lors, on distingue deux formes. D’une part, l’appendicite <button class="w" data-k="k35-simple">non compliquée</button>, inflammatoire, sans gangrène ni perforation. D’autre part, l’appendicite <button class="w" data-k="k35-compliquee">compliquée</button>, avec gangrène, perforation, <button class="w" data-k="k35-phlegmon">phlegmon</button>, abcès périappendiculaire ou péritonite. Par conséquent, la présence d’un stercolithe compte : elle augmente le risque d’échec du traitement antibiotique, si bien que la chirurgie est recommandée dans ce cas chez l’enfant (WSES 2020, énoncé 2.2).</p><div class="key"><b>À retenir.</b> Simple ou compliquée (gangrène, perforation, phlegmon, abcès, péritonite) ; la perforation n’est pas inéluctable ; le stercolithe prédit l’échec des antibiotiques.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></section>
<section class="ilot" id="k35-3"><h2><span class="n">3</span>Présentation clinique et scores</h2><p>Le diagnostic clinique est difficile ; en effet, chaque signe isolé a une faible valeur, si bien que la WSES recommande une démarche individualisée selon la probabilité, le sexe et l’âge (recommandation 1.1). C’est pourquoi les scores cliniques sont au centre de la démarche. Ainsi, les scores d’Alvarado, <button class="w" data-k="k35-air">AIR</button> et <button class="w" data-k="k35-aas">AAS</button> sont assez sensibles pour exclure l’appendicite et identifier les patients à risque intermédiaire qui ont besoin d’une imagerie (recommandation 1.2.1).</p><p>Cependant, ces scores n’ont pas la même valeur. En effet, le score d’<button class="w" data-k="k35-alvarado">Alvarado</button> n’est pas assez spécifique pour confirmer le diagnostic chez l’adulte (recommandation 1.3, contre son usage dans ce but) ; en revanche, les scores AIR et AAS ont le meilleur pouvoir discriminant et sont recommandés (recommandation 1.4, forte). Par ailleurs, chez la femme enceinte, le diagnostic ne repose jamais sur les seuls symptômes : la biologie et la CRP sont toujours demandées (recommandation 1.2.2).</p><div class="quiz ui"><p>Un homme de 24 ans a un score AIR de 10 et un score AAS de 17. Que dit la WSES 2020 de l’imagerie ?</p><button data-ok="0">Un scanner est obligatoire avant toute chirurgie</button><button data-ok="1">Le scanner peut être évité avant une laparoscopie, car le risque est élevé et l’âge inférieur à 40 ans</button><button data-ok="0">Le score d’Alvarado doit d’abord confirmer le diagnostic</button><p class="fb" hidden>Chez le patient à haut risque de moins de 40 ans (AIR 9-12, Alvarado 9-10, AAS ≥ 16), l’imagerie en coupes peut être évitée avant la <button class="w" data-k="k35-lap">laparoscopi</button>e diagnostique et thérapeutique (recommandation 1.9, faible).</p></div><div class="key"><b>À retenir.</b> Scores pour stratifier : AIR et AAS recommandés ; Alvarado pour exclure, non pour confirmer ; grossesse : biologie et CRP toujours.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></section>
<section class="ilot" id="k35-4"><h2><span class="n">4</span>Démarche diagnostique et imagerie</h2><p>Une fois le risque estimé, l’imagerie suit cette classe. Ainsi, le patient à risque intermédiaire bénéficie d’une imagerie rapide et systématique (recommandation 1.8) ; en revanche, le patient à haut risque de moins de 40 ans peut aller en <button class="w" data-k="k35-lap">laparoscopi</button>e sans scanner préalable (recommandation 1.9). De plus, la combinaison des scores cliniques et de l’échographie améliore la sensibilité et la spécificité (recommandation 1.7, forte).</p><p>Ensuite, le choix de la technique est précis. En effet, l’<button class="w" data-k="k35-echo">échographie au lit du patient</button> est l’examen de première ligne chez l’adulte comme chez l’enfant (recommandation 1.10, forte). Si elle est négative chez l’adolescent ou l’adulte jeune, un <button class="w" data-k="k35-tdm">scanner injecté à faible dose</button> est préféré au scanner à dose standard (recommandation 1.11, forte). Enfin, chez la femme enceinte, l’échographie par compression graduée vient d’abord, puis l’IRM si elle n’est pas concluante (recommandations 1.13.1 et 1.13.2).</p><figure><img src="data:image/gif;base64,R0lGODdhWALCAYUAAL+/v42NjX19fXNzc2xsbGVlZWBgYFtbW1dXV1JSUk5OTkxMTElJSUZGRkREREJCQkBAQD09PTs7Ozo6Ojg4ODc3NzY2NjQ0NDIyMjExMTAwMC8vLy4uLiwsLCsrKyoqKikpKSgoKCcnJyYmJiUlJSQkJCMjIyIiIiEhISAgIB8fHx4eHh0dHRwcHBoaGhgYGBcXFxYWFhMTExEREQ8PDw4ODgwMDAoKCggICAcHBwYGBgQEBAMDAwICAgEBAQAAACwAAAAAWALCAUAI/wB/CBxIsKDBgwgTKlzIsGHBHjtCVNiAAcUPHT16/NjhA6MPEhc4ZPBwocYPHw4F8ujBY+OOHxY6VHhx0uAOHjxCXnDBsocPlC9dWMCoY+cPGxJo8EhxwacOHDh0PN3hU+PLHS9/hNRwwQZDn0EpcNjAgWWICx0snKhZ4cIKgRlY8MiBMqXdu3jz6t3Lt6/fv4ADCx5MuLDhvS8DAFgc4IUOjhk54vgRIIAPuhzx+uB4+YeCxQBuXPSBYzGHjp4Z0xj9g+XLAgBQ9gBA4EcHABd8wBYNGvSFjR0399BhIkFvDxczZ+ShPKNoAosFjFYMujYAAT4+A2j82EfLw+DDi/8fT768+fPo05tvuVggCQAbWgPWqIH2DxftcX4nuHlHjpfbJafDDxsAwAEACSh2UQ857DfQSgNqJABoIeygQ32LDYAVRCvd1dIHi4Hwg4PqlWjiiSimqOKKLArGXgD3ATDADxkAEMMPE/5wgIwP/aQ <section class="ilot" id="k35-5"><h2><span class="n">5</span>Douleur persistante et imagerie négative</h2><p>Il reste le patient dont les examens sont normaux, mais dont la douleur de la fosse iliaque droite ne cède pas. Dans ce cas, la WSES recommande une imagerie en coupes avant toute chirurgie (recommandation 1.12) ; en effet, elle évite des appendicectomies inutiles. Ensuite, après une imagerie négative, une prise en charge non opératoire initiale est appropriée.</p><p>Cependant, si la douleur progresse ou persiste, une <button class="w" data-k="k35-lap">laparoscopi</button>e exploratrice est recommandée pour établir ou exclure l’appendicite ou un autre diagnostic. De plus, si l’appendice paraît « normal » pendant l’intervention et qu’aucune autre cause n’est trouvée chez un patient symptomatique, son ablation est suggérée (recommandation 5.3), car le jugement macroscopique des formes débutantes est peu fiable.</p><div class="key"><b>À retenir.</b> Si la douleur persiste avec un bilan normal, on fait une imagerie en coupes ; si elle est négative, on surveille, et si la douleur progresse, on fait une laparoscopie exploratrice.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7386163/" target="_blank" rel="noopener">Di Saverio S. et al., Diagnosis and treatment of acute appendicitis: 2020 update of the WSES Jerusalem guidelines, World J Emerg Surg 2020;15:27</a>.</p></section>
