<section class="ilot" id="k85-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 58 ans arrive aux urgences pour une douleur épigastrique intense, apparue brutalement après un repas et irradiant dans le dos ; elle vomit. Or, la <button class="w" data-k="k85-lipase">lipase</button> dépasse dix fois la limite supérieure de la normale, et une échographie montre une vésicule lithiasique. <b>La question n’est donc pas seulement de poser le diagnostic de pancréatite aiguë, mais de prévoir sa gravité et d’en traiter la cause.</b></p><p>Pour répondre à cette question, le médecin doit savoir : poser le diagnostic selon les <button class="w" data-k="k85-criteres">critères d’Atlanta révisés</button> ; classer la gravité selon la <button class="w" data-k="k85-atlanta">classification d’Atlanta révisée</button> ; reconnaître la <button class="w" data-k="k85-defaillance">défaillance d’organe</button> et sa persistance au-delà de 48 heures ; conduire la réanimation liquidienne et l’analgésie ; décider d’une <button class="w" data-k="k85-cpre">CPRE</button> en urgence ; enfin, prendre en charge une <button class="w" data-k="k85-necrose-infectee">nécrose infectée</button> selon une stratégie progressive.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="k85-criteres">deux critères sur trois</button> pour le diagnostic ; <button class="w" data-k="k85-defaillance">défaillance d’organe persistante</button> pour la gravité.</div></section>
<section class="ilot" id="k85-1"><h2><span class="n">1</span>Définition et classification</h2><p>La pancréatite aiguë est une inflammation aiguë du pancréas, caractérisée à l’histologie par une destruction des cellules acineuses (WSES 2019). Ainsi, la classification d’<button class="w" data-k="k85-atlanta">Atlanta</button> révisée en 2012 distingue deux formes morphologiques : la <button class="w" data-k="k85-interstitielle">pancréatite interstitielle œdémateuse</button>, de loin la plus fréquente, et la <button class="w" data-k="k85-necrosante">pancréatite nécrosante</button>. De plus, elle décrit deux phases : une phase précoce, dominée par la <button class="w" data-k="k85-sirs">réponse inflammatoire systémique</button> et la défaillance d’organe, puis une phase tardive, marquée par les complications locales.</p><p>À partir de ces formes, la gravité se classe en trois degrés. La forme légère ne comporte ni défaillance d’organe ni complication ; en revanche, la forme modérément sévère comporte une défaillance d’organe transitoire, de moins de 48 heures, ou une complication locale ou systémique. Enfin, la forme sévère se définit par une <button class="w" data-k="k85-defaillance">défaillance d’organe persistante</button>, de plus de 48 heures, unique ou multiple.</p><table class="t"><tr><th>Degré (Atlanta 2012)</th><th>Défaillance d’organe</th><th>Complications locales ou systémiques</th></tr><tr><td>Légère</td><td>Aucune</td><td>Aucune</td></tr><tr><td>Modérément sévère</td><td>Transitoire (< 48 h)</td><td>Possibles, sans défaillance persistante</td></tr><tr><td>Sévère</td><td>Persistante (> 48 h), unique ou multiple</td><td>Habituelles</td></tr></table><p>Le tableau se lit par la colonne du milieu : en effet, c’est la durée de la défaillance d’organe, et non l’aspect de la nécrose, qui sépare la forme sévère des autres. Par ailleurs, la <button class="w" data-k="k85-dbc">classification fondée sur les déterminants</button> ajoute un degré « critique » (défaillance persistante et <button class="w" data-k="k85-necrose-infectee">nécrose infectée</button>) ; toutefois, la WSES 2019 juge les deux classifications équivalentes.</p><div class="key"><b>À retenir.</b> Deux formes (interstitielle, nécrosante), deux phases (précoce, tardive), trois degrés : la défaillance d’organe persistante au-delà de 48 heures définit la forme sévère.</div><p class="src">Références : <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></section>
<section class="ilot" id="k85-2"><h2><span class="n">2</span>Épidémiologie et étiologies</h2><p>Après la définition, la fréquence et les causes situent l’enjeu. Ainsi, selon la WSES 2019, la plupart des patients ont une forme légère ; cependant, 20 à 30 % développent une forme sévère, dont la mortalité hospitalière atteint environ 15 %. De plus, la nécrose s’infecte chez 20 à 40 % des patients atteints d’une forme sévère, ce qui aggrave les défaillances d’organe.</p><p>Les deux causes principales sont la <button class="w" data-k="k85-biliaire">lithiase biliaire</button> et la consommation excessive d’alcool. En outre, en l’absence de lithiase et d’alcool, il faut doser les triglycérides et le calcium : une <button class="w" data-k="k85-tg">hypertriglycéridémie</button> supérieure à 11,3 mmol/l (1000 mg/dl) suffit à expliquer la pancréatite (WSES 2019). Enfin, on parle de pancréatite <button class="w" data-k="k85-idiopathique">idiopathique</button> lorsque le bilan initial ne trouve aucune cause.</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée nationale suisse d’incidence n’a été retrouvée lors de la rédaction ; les chiffres cités sont ceux de la WSES 2019, attribués.</div><div class="key"><b>À retenir.</b> La lithiase biliaire et l’alcool dominent ; sinon, on recherche des triglycérides > 11,3 mmol/l et une hypercalcémie. La forme sévère touche 20 à 30 % des patients, avec une mortalité d’environ 15 %.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></section>
<section class="ilot" id="k85-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Pour comprendre la gravité, il faut suivre l’agression de la cellule acineuse. Normalement, les enzymes pancréatiques sont sécrétées sous forme inactive et activées dans le duodénum. Or, au cours de la pancréatite, elles s’activent dans le pancréas lui-même ; dès lors, la glande et la graisse qui l’entoure sont digérées. C’est ainsi qu’apparaît la <button class="w" data-k="k85-cytosteatonecrose">cytostéatonécrose</button>, nécrose de la graisse par la <button class="w" data-k="k85-lipase">lipase</button>.</p><p>Ensuite, la lésion locale déclenche une <button class="w" data-k="k85-sirs">réponse inflammatoire systémique</button>. En effet, la perméabilité capillaire augmente, le liquide fuit vers le troisième secteur et l’hémoconcentration s’installe ; par conséquent, la microcirculation pancréatique se dégrade, ce qui favorise la nécrose. De plus, la barrière intestinale s’altère, si bien que des bactéries d’origine digestive peuvent coloniser la nécrose (WSES 2019).</p><figure><img src="data:image/gif;base64,R0lGODdhWAKQAYUAAOTS++HP+eDM+ObD+drF9dDA8uS18+Ks79ew7cm378es6dyj6duW486g5M2U38Kh5cKY4bmc4cGR3beR29iF2s6E2MeJ2cd+1L+J2r+I0r9+0rmI1biC0bGF0bd8zq97y8ZvzLluybJuxqZqw65Yva43qIxGrnEckQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAKQAUAI/wAHABgoAMAAAgESChAQoGDDhQsfQnw4QIOJEQgGDGDYkEABBREiKDAogEBJkwcJqDS5UCXEliZXnix5EqUFEiZIMDBgAMODBAVWqixAVKjRowUQJPCINKhKBBkcHNS40mkBoAk6jAgRooIBmC4rjjBAtCyCswjKXlUwVG1Sj0QzaKjgAEGEDQwujBhxAsJVoGUTpE3wYMNWECAYVCBRogQIx48bSwZhIsQICBAycEUMgquDBKAVgE6goLTo0aIVjJigAEFp0qNDE46g9LTs0Aoe2IYN+sHq0g8miDT9OkEDDCRIaHht+sEDCB2GKxA+YcKHDhBM5DQhQkMGzBF0E/8HrqCB9Q0fTIg3TTr1aQUdxhNHXZz3gw4dTJz43OHECAwYdPDBCCJccIF33+0WW2gjmDCgdiNsAJpSsT2gHXcaQCAcBB/8BNpfC4YoYgITmACBASMmEAFWpAm4AQQ/gXjVjFlFF0GDHaT1V1CAxYbfYKPtiBVRQQo5IYcPGKDRCB0Y4IADFjiwAAMZNDDAWQU41BJHDAEA0QAinHDBRi+VCREBXgLQgAkZ1cQQTTS5tNAAEIzggQcNzCRnTEIhINOWR/F <section class="ilot" id="k85-4"><h2><span class="n">4</span>Présentation clinique</h2><p>La démarche commence donc par la clinique. Le symptôme cardinal est une douleur épigastrique aiguë, intense, souvent transfixiante vers le dos, associée à des nausées et des vomissements. Par ailleurs, l’examen recherche les signes de gravité : tachycardie, hypotension, polypnée, oligurie et confusion, car ils traduisent une défaillance d’organe débutante.</p><p>Plus rarement, une ecchymose péri-ombilicale (<button class="w" data-k="k85-cullen">signe de Cullen</button>) ou des flancs (signe de Grey-Turner) témoigne d’une diffusion hémorragique rétropéritonéale. Cependant, ces signes sont tardifs et inconstants ; ils ne doivent donc pas retarder l’évaluation de la gravité.</p><figure><img src="data:image/gif;base64,R0lGODdhMQJsAYYAAP/////+/////f//+f3//vf///79+sjc7LPL49OznbS7x5y21c2qk8ipk8ikj8iiiMGijYmmycSdhL2dhsCXfLibhLSYgrWVfK+UfrqQcrGQdbeJarCHaauPeKqHaoiYrqOLc6KHbZyGcJ6DbKCCY5iCbGiZx1SVzHGLrVOPxEyPx0qLxESGwKh+XZ1+YJh+aZh9YaR4V6RuUZlyUJJ9aJF6ZZF5Xo90XZBzUZBrSoh2YIdyW4VwW4ZvVIRsUoVmSXtrV3poUXdlTlNzljVyqyFpq5FfPpJTOH9fQX5UM3BgTHFeRXBUOWJZSmFUP1hLOS1dizJNZhNamnRAKFNBLURDO0I9Mm0wIEMxH1UYFDg8PSU8USwtLCshFhYeJREKDAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAMQJsAUAI/wABCBxIsOBAAQIGKBxgwADCABADJFSI8GHEiAAIaCSAcCFFAQY0Nmy4sWRJABcrqhRA0KRLkwZjypxJs6bNmzhjvtzJ82VOgT1h5rxItKjRowEErlyqEqlRplCjSnUKUQDVogQKaN3KtavXr2DDFnAodeVPAGWbXl1b9OzPAhvhwo2bdW7JrSa5Bi1ptK5duGwjEsCZVWPGnhkP7x3M2DDjxD3twnxMGTLkvI4fyxycGOhGzwYnW27MGWdSwUhRBtB4msDpi6qJopz9OnRpzydt3h64c+VIkCMbWg1MnLXr444vzx2d/PjqwssLZFwtFnNl0s0FmNRekvviyNA1Sv93e1PrggjoTahHYQKFe/YRFiCYT3/BefXo7cu3H+F9/AMAAjhfgAcgcB56COpHn4EHovfBEFFooUUVTzjRhBJKNHFhhhp22CGGIGK4IYcbCiHihydiGIQQJoIoxIonaujEEjTWOGONSzSRI4g0OuGjjzhquASPTfhYpBNPJJkkFUxWWOGFRSZpoYxPxnikhzn+qOWWRiJJRYVTHqkkFVZY0SSSSj7BZJNgpplmFWVWIaecbio55xNz5qlnnlZoYYWeE1YhoaASFmrooHo2EUWiQAyBAoRefPGFF1EM8YF9BB  si le diagnostic reste douteux, le scanner tranche (WSES 2019).</div><div class="key"><b>À retenir.</b> Le patient a une douleur épigastrique transfixiante et des vomissements ; une tachycardie, une hypotension, une polypnée, une oligurie et une confusion signalent la défaillance d’organe.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></section>
<section class="ilot" id="k85-5"><h2><span class="n">5</span>Diagnostic</h2><p>Au terme de l’examen, le diagnostic repose sur <button class="w" data-k="k85-criteres">deux des trois critères</button> suivants : une douleur abdominale compatible ; une <button class="w" data-k="k85-lipase">lipase</button> ou une amylase sériques supérieures à trois fois la limite supérieure de la normale ; enfin, des signes caractéristiques à l’imagerie. Ainsi, lorsque la douleur est typique et la lipase élevée, aucune imagerie n’est nécessaire au diagnostic.</p><p>De plus, la lipase est préférée à l’amylase, car elle est plus spécifique et reste élevée plus longtemps (WSES 2019). En revanche, son niveau ne reflète pas la gravité. Enfin, une <button class="w" data-k="k85-echo">échographie abdominale</button> est faite dès l’admission, non pour confirmer la pancréatite, mais pour rechercher une lithiase biliaire.</p><div class="quiz ui"><p>Un homme de 45 ans a une douleur épigastrique typique depuis 6 heures ; la lipase vaut 5 fois la normale. Faut-il un scanner pour poser le diagnostic ?</p><button data-ok="0">Oui, le scanner est indispensable</button><button data-ok="1">Non, deux critères sur trois sont réunis</button><button data-ok="0">Oui, mais seulement après 72 heures</button><p class="fb" hidden>Douleur compatible et lipase supérieure à trois fois la normale suffisent ; le scanner est réservé au doute diagnostique ou, plus tard, au bilan des complications (WSES 2019).</p></div><div class="key"><b>À retenir.</b> Le diagnostic exige deux critères sur trois : la douleur, une lipase ou une amylase > 3 fois la normale, et l’imagerie. L’échographie se fait dès l’admission, car elle cherche la cause biliaire.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p></section>
<section class="ilot" id="k85-6"><h2><span class="n">6</span>Évaluation de la gravité</h2><p>Une fois le diagnostic posé, la question devient celle de la gravité. Or, aucun score n’est un gold standard ; toutefois, la WSES 2019 et l’ESGE 2018 retiennent le <button class="w" data-k="k85-bisap">score BISAP</button> dans les 24 premières heures, simple et aussi performant que l’APACHE II. De plus, plusieurs marqueurs simples complètent ce score : un <button class="w" data-k="k85-hematocrite">hématocrite supérieur à 44 %</button> est un facteur de risque indépendant de nécrose, et une urée élevée, ou qui augmente, prédit la mortalité.</p><p>Ensuite, la <button class="w" data-k="k85-crp">CRP</button> supérieure ou égale à 150 mg/l au troisième jour est un facteur pronostique de forme sévère (WSES 2019). Cependant, le critère décisif reste la <button class="w" data-k="k85-defaillance">défaillance d’organe</button> : par conséquent, tout patient qui présente une défaillance d’organe doit être admis en soins intensifs dès que possible (WSES 2019).</p><div class="quiz ui"><p>Un patient a un BISAP à 3 à l’admission et une hypoxémie qui persiste à 60 heures malgré l’oxygène. Quel degré selon <button class="w" data-k="k85-atlanta">Atlanta</button> 2012 ?</p><button data-ok="0">Légère</button><button data-ok="0">Modérément sévère</button><button data-ok="1">Sévère</button><p class="fb" hidden>Une défaillance d’organe qui persiste plus de 48 heures définit la forme sévère, quel que soit le score initial (Atlanta 2012, WSES 2019).</p></div><div class="key"><b>À retenir.</b> On calcule le BISAP dans les 24 heures ; un hématocrite > 44 %, une urée qui monte et une CRP ≥ 150 mg/l au 3e jour annoncent une forme sévère. Une défaillance d’organe impose les soins intensifs.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></section>
