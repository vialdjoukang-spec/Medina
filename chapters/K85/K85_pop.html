<template data-pop="pareto-k85-clinique" data-title="Loi de Pareto — Pancréatite aiguë"><p class="ratio" data-cover="k85-1,k85-5,k85-6,k85-7,k85-8,k85-11"></p><ul><li>Diagnostic : deux critères sur trois (douleur, lipase > 3 fois la normale, imagerie).</li><li>Forme sévère : défaillance d’organe > 48 heures.</li><li>Cristalloïdes précoces, réévalués souvent ; pas d’antibioprophylaxie.</li><li>Angiocholite : CPRE dans les 24 heures ; sinon pas de CPRE de routine.</li><li>Forme biliaire légère : cholécystectomie pendant l’hospitalisation.</li><li>Nécrose infectée : différer, drainer, puis nécrosectomie mini-invasive.</li></ul></template>
<template data-pop="pareto-k85-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k85-e-1,k85-e-2,k85-e-3"></p><ul><li>Lipase > 3 fois la normale : diagnostic, pas gravité.</li><li>Échographie à l’admission pour la lithiase.</li><li>Scanner injecté à 72-96 heures, pas avant, dans la forme sévère.</li><li>Index de Balthazar = inflammation (0-4) + nécrose (0-6).</li><li>Cause inconnue : bili-IRM ou écho-endoscopie.</li></ul></template>
<template data-pop="pareto-k85-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k85-p-1,k85-p-2,k85-p-3"></p><ul><li>Aucun traitement spécifique ; pas d’antibioprophylaxie.</li><li>Cristalloïdes précoces, réévalués souvent.</li><li>Analgésie multimodale dans les 24 heures.</li><li>Méropénème 1 g toutes les 8 h si nécrose infectée grave.</li><li>Métamizole : agranulocytose ; injection lente.</li></ul></template>
<template data-pop="k85-criteres" data-title="Critères diagnostiques (Atlanta 2012)"><p class="lab">Deux critères sur trois</p><p>1. Douleur abdominale compatible ; 2. lipase ou amylase sériques > 3 fois la limite supérieure de la normale ; 3. signes caractéristiques à l’imagerie.</p><p class="lab">Conséquence</p><p>Si 1 et 2 sont présents, l’imagerie n’est pas nécessaire au diagnostic.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p></template>
<template data-pop="k85-atlanta" data-title="Classification d’Atlanta révisée (2012)"><p class="lab">Légère</p><p>Ni défaillance d’organe ni complication locale ou systémique ; résolution habituelle en une semaine.</p><p class="lab">Modérément sévère</p><p>Défaillance d’organe transitoire (< 48 h), complication locale ou systémique, ou décompensation d’une comorbidité.</p><p class="lab">Sévère</p><p>Défaillance d’organe persistante (> 48 h), unique ou multiple.</p><p class="lab">Phases</p><p>Précoce (1re semaine) puis tardive.</p><p class="src">Références : <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-defaillance" data-title="Défaillance d’organe"><p class="lab">Organes</p><p>Cardiovasculaire, respiratoire et rénal.</p><p class="lab">Transitoire</p><p>Moins de 48 heures : forme au plus modérément sévère.</p><p class="lab">Persistante</p><p>Plus de 48 heures : forme sévère ; risque de décès élevé, surtout si une nécrose infectée s’y associe.</p><p class="lab">Conduite</p><p>Admission en soins intensifs dès que possible (WSES 2019, grade 1C).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p></template>
<template data-pop="k85-cpre" data-title="CPRE dans la pancréatite biliaire"><p class="lab">Urgente (≤ 24 h)</p><p>Angiocholite associée (ESGE 2018, recommandation forte).</p><p class="lab">Dans les 72 h</p><p>Obstruction biliaire persistante.</p><p class="lab">Non indiquée</p><p>Ni angiocholite ni obstruction, même si la pancréatite est prédite sévère (ESGE 2018 ; WSES 2019, grade 2B).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-necrose-infectee" data-title="Nécrose infectée"><p class="lab">Fréquence</p><p>20 à 40 % des formes sévères (WSES 2019).</p><p class="lab">Pronostic</p><p>Mortalité 35,2 % si défaillance d’organe associée.</p><p class="lab">Conduite</p><p>Antibiotiques, puis intervention différée et progressive.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-interstitielle" data-title="Pancréatite interstitielle œdémateuse"><p class="lab">Définition</p><p>Inflammation avec œdème diffus de la glande, rehaussement homogène au scanner, sans nécrose.</p><p class="lab">Évolution</p><p>Habituellement favorable en une semaine ; une collection tardive devient un pseudokyste.</p><p class="src">Références : <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-necrosante" data-title="Pancréatite nécrosante"><p class="lab">Définition</p><p>Nécrose du parenchyme pancréatique et/ou du tissu péripancréatique.</p><p class="lab">Imagerie</p><p>Zones non rehaussées au scanner injecté, visibles de façon fiable après 72 heures.</p><p class="lab">Évolution</p><p>Collection nécrotique aiguë, puis nécrose organisée après 4 semaines ; infection possible.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-dbc" data-title="Classification fondée sur les déterminants"><p class="lab">Degrés</p><p>Légère ; modérée (nécrose stérile et/ou défaillance transitoire) ; sévère (nécrose infectée ou défaillance persistante) ; critique (les deux).</p><p class="lab">Limite</p><p>Elle exige de connaître le statut de la nécrose, donc s’applique mal à la première semaine (ESGE 2018).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-biliaire" data-title="Pancréatite biliaire"><p class="lab">Mécanisme</p><p>Calcul ou sludge qui migre et obstrue transitoirement l’ampoule de Vater.</p><p class="lab">Indices</p><p>Lithiase vésiculaire à l’échographie, cytolyse et cholestase.</p><p class="lab">Prévention</p><p>Cholécystectomie pendant la même hospitalisation si la forme est légère.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-tg" data-title="Hypertriglycéridémie"><p class="lab">Seuil</p><p>Triglycérides > 11,3 mmol/l (1000 mg/dl) : cause retenue (WSES 2019, grade 2C).</p><p class="lab">Quand doser</p><p>En l’absence de lithiase et de consommation importante d’alcool, avec la calcémie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-idiopathique" data-title="Pancréatite idiopathique"><p class="lab">Définition</p><p>Aucune cause après le bilan biologique et d’imagerie initial.</p><p class="lab">Bilan</p><p>Au moins deux échographies ; puis scanner et écho-endoscopie à distance (microlithiase, tumeur, pancréatite chronique) ; IRM si l’écho-endoscopie est normale.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-cytosteatonecrose" data-title="Cytostéatonécrose"><p class="lab">Définition</p><p>Nécrose du tissu adipeux par la lipase pancréatique ; les acides gras libérés se combinent au calcium (saponification).</p><p class="lab">Conséquence</p><p>Plages blanchâtres « en taches de bougie » à la chirurgie ; hypocalcémie possible.</p></template>
<template data-pop="k85-cullen" data-title="Signes de Cullen et de Grey-Turner"><p class="lab">Cullen</p><p>Ecchymose péri-ombilicale.</p><p class="lab">Grey-Turner</p><p>Ecchymose des flancs.</p><p class="lab">Signification</p><p>Diffusion d’un épanchement hémorragique rétropéritonéal ; signes tardifs et inconstants.</p></template>
<template data-pop="k85-lipase" data-title="Lipase sérique"><p class="lab">Seuil</p><p>> 3 fois la limite supérieure de la normale.</p><p class="lab">Avantages</p><p>Plus spécifique que l’amylase ; élévation plus prolongée (WSES 2019).</p><p class="lab">Limites</p><p>Son niveau ne reflète pas la gravité ; élévations non pancréatiques possibles (insuffisance rénale, appendicite, cholécystite).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-echo" data-title="Échographie abdominale"><p class="lab">Moment</p><p>À l’admission ou dans les 48 premières heures.</p><p class="lab">But</p><p>Rechercher une lithiase vésiculaire, un sludge, une dilatation des voies biliaires.</p><p class="lab">Limite</p><p>Le pancréas est souvent mal vu à cause des gaz digestifs.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-bisap" data-title="Score BISAP"><p class="lab">Un point par critère</p><p>Urée > 8,9 mmol/l ; troubles de la conscience ; syndrome de réponse inflammatoire systémique ; âge > 60 ans ; épanchement pleural à la radiographie.</p><p class="lab">Usage</p><p>Dans les 24 premières heures ; prédit gravité, défaillance d’organe et décès (WSES 2019 ; ESGE 2018, recommandation faible).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-hematocrite" data-title="Hématocrite"><p class="lab">Seuil</p><p>> 44 % : facteur de risque indépendant de nécrose (WSES 2019, grade 1B).</p><p class="lab">Mécanisme</p><p>Hémoconcentration par fuite capillaire.</p><p class="lab">Suivi</p><p>Sa baisse sous remplissage est un objectif de perfusion.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-crp" data-title="CRP"><p class="lab">Seuil</p><p>≥ 150 mg/l au 3e jour : facteur pronostique de forme sévère (WSES 2019, grade 2A).</p><p class="lab">Limite</p><p>Retard d’ascension : peu utile à l’admission.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-remplissage" data-title="Réanimation liquidienne"><p class="lab">Principe</p><p>Précoce, sans attendre l’aggravation hémodynamique, par cristalloïdes isotoniques (WSES 2019, grade 1B).</p><p class="lab">Débit</p><p>Par exemple Ringer lactate 5 à 10 ml/kg/h au début (ESGE 2018), adapté au patient.</p><p class="lab">Surveillance</p><p>Hémodynamique, diurèse, hématocrite, urée, créatinine, lactate ; éviter la surcharge.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-analgesie" data-title="Analgésie multimodale"><p class="lab">Règle</p><p>Toute pancréatite reçoit une analgésie dans les 24 premières heures (WSES 2019).</p><p class="lab">Moyens</p><p>Antalgiques non opioïdes, opioïdes, analgésie péridurale ou contrôlée par le patient.</p><p class="lab">Prudence</p><p>AINS évités en cas d’insuffisance rénale aiguë.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-nutrition" data-title="Nutrition dans la pancréatite aiguë"><p class="lab">Forme légère</p><p>Alimentation orale précoce.</p><p class="lab">Forme sévère</p><p>Nutrition entérale polymérique si l’alimentation orale n’est pas tolérée après 72 heures (ESGE 2018, recommandation forte).</p><p class="lab">Voie</p><p>Sonde nasogastrique d’abord, nasojéjunale en cas d’intolérance ; parentérale si échec ou objectif calorique non atteint.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-angiocholite" data-title="Angiocholite"><p class="lab">Définition</p><p>Infection de la voie biliaire obstruée.</p><p class="lab">Clinique</p><p>Douleur, fièvre, ictère.</p><p class="lab">Conduite</p><p>Antibiotiques et drainage biliaire par CPRE dans les 24 heures.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-cholecystectomie" data-title="Cholécystectomie après pancréatite biliaire"><p class="lab">Forme légère</p><p>Pendant la même hospitalisation (WSES 2019, grade 1A), même après sphinctérotomie (grade 1B).</p><p class="lab">Collections</p><p>Différée jusqu’à leur résolution ou stabilisation (grade 2C).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-apfc" data-title="Collection liquidienne péripancréatique aiguë"><p class="lab">Délai</p><p>Moins de 4 semaines, dans une pancréatite interstitielle.</p><p class="lab">Aspect</p><p>Liquide sans paroi définie.</p><p class="lab">Évolution</p><p>Résorption spontanée habituelle ; pas de drainage.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p></template>
<template data-pop="k85-anc" data-title="Collection nécrotique aiguë"><p class="lab">Délai</p><p>Moins de 4 semaines, dans une pancréatite nécrosante.</p><p class="lab">Contenu</p><p>Liquide et nécrose en proportions variables.</p><p class="lab">Évolution</p><p>Nécrose organisée après 4 semaines.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-pseudokyste" data-title="Pseudokyste pancréatique"><p class="lab">Définition</p><p>Collection liquidienne entourée d’une paroi bien définie, sans matériel solide, après au moins 4 semaines d’une pancréatite interstitielle.</p><p class="lab">Traitement</p><p>Drainage seulement s’il est symptomatique ou s’il grossit (WSES 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-won" data-title="Nécrose organisée (walled-off necrosis)"><p class="lab">Définition</p><p>Collection encapsulée de nécrose partiellement liquéfiée, après au moins 4 semaines.</p><p class="lab">Traitement</p><p>Drainage si infection ou symptômes ; endoscopique ou percutané en premier.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-dpds" data-title="Syndrome du canal déconnecté"><p class="lab">Définition</p><p>Rupture du canal pancréatique principal qui isole un segment de glande encore sécrétant.</p><p class="lab">Conséquence</p><p>Collection récidivante ; indication d’intervention s’il est symptomatique (WSES 2019).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-pct" data-title="Procalcitonine"><p class="lab">Usage</p><p>Test biologique le plus sensible pour détecter l’infection de la nécrose ; une valeur basse est un fort argument contre (WSES 2019, grade 2A).</p><p class="lab">Limite</p><p>Ne remplace pas la clinique et l’imagerie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-atb" data-title="Antibiotiques dans la nécrose infectée"><p class="lab">Indication</p><p>Infection suspectée ou prouvée ; jamais en prophylaxie.</p><p class="lab">Pénétration pancréatique</p><p>Bonne : carbapénèmes, quinolones, métronidazole ; intermédiaire : pipéracilline-tazobactam, céphalosporines de 3e génération ; mauvaise : aminosides.</p><p class="lab">Épargne</p><p>Quinolones si allergie aux bêtalactamines ; carbapénèmes chez les patients très graves.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-step-up" data-title="Stratégie progressive (step-up)"><p class="lab">Étape 1</p><p>Antibiotiques et support des organes ; attendre l’organisation de la nécrose (environ 4 semaines).</p><p class="lab">Étape 2</p><p>Drainage endoscopique transmural ou percutané.</p><p class="lab">Étape 3</p><p>Nécrosectomie endoscopique ou chirurgie mini-invasive si absence d’amélioration.</p><p class="lab">Résultat</p><p>Le drainage seul guérit 25 à 60 % des patients (WSES 2019, grade 1A).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-necrosectomie" data-title="Nécrosectomie"><p class="lab">Endoscopique</p><p>Ablation de la nécrose à travers une prothèse transgastrique.</p><p class="lab">Chirurgicale mini-invasive</p><p>Débridement rétropéritonéal vidéo-assisté.</p><p class="lab">Comparaison</p><p>Moins de défaillances d’organe nouvelles que la chirurgie ouverte, mais plus de gestes (WSES 2019, grade 1B).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-sca" data-title="Syndrome du compartiment abdominal"><p class="lab">Définition</p><p>Hyperpression intra-abdominale soutenue avec défaillance d’organe nouvelle.</p><p class="lab">Traitement</p><p>Mesures conservatrices d’abord ; laparotomie de décompression si elles échouent (WSES 2019).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-scanner" data-title="Scanner injecté"><p class="lab">Moment</p><p>72 à 96 heures après le début dans la forme sévère (WSES 2019, grade 1C) ; plus tôt seulement si le diagnostic est douteux.</p><p class="lab">Apport</p><p>Nécrose, collections, complications vasculaires.</p><p class="lab">Limite</p><p>Scanners répétés : irradiation, peu d’effet sur la décision.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-bilirm" data-title="Bili-IRM et écho-endoscopie"><p class="lab">Indication</p><p>Rechercher un calcul caché de la voie biliaire principale si l’échographie est négative et la cause inconnue.</p><p class="lab">Avantage</p><p>Évitent une CPRE diagnostique, invasive (WSES 2019).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-ctsi" data-title="Index de sévérité scanographique (Balthazar)"><p class="lab">Grade</p><p>A pancréas normal 0 ; B augmentation de volume 1 ; C inflammation et/ou graisse péripancréatique 2 ; D une collection 3 ; E ≥ 2 collections et/ou air rétropéritonéal 4.</p><p class="lab">Nécrose</p><p>Aucune 0 ; < 30 % 2 ; 30 à 50 % 4 ; > 50 % 6.</p><p class="lab">Pronostic</p><p>Index 7-10 : morbidité 92 %, mortalité 17 %.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-d-metamizole" data-title="Métamizole (Novalgin®)"><p class="lab">Dose i.v. adulte</p><p>0,5 à 1 g lentement (max. 1 ml/min), répétable toutes les 6 à 8 h ; max. 5 g/j.</p><p class="lab">Risques</p><p>Agranulocytose potentiellement mortelle ; hypotension, choc en injection rapide.</p><p class="lab">Contre-indication</p><p>Antécédent d’agranulocytose aux pyrazolones.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Novalgin® solution injectable, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k85-d-hydromorphone" data-title="Hydromorphone (Palladon® Inject)"><p class="lab">Dose i.v.</p><p>Adulte naïf d’opioïdes ≥ 50 kg : 1 à 1,5 mg toutes les 3 à 4 h en 2 à 3 minutes ; perfusion 0,15 à 0,45 mg/h.</p><p class="lab">Analgésie contrôlée</p><p>Bolus de 0,2 mg, intervalle de 5 à 10 minutes.</p><p class="lab">Surdosage</p><p>Naloxone 0,4 à 2 mg i.v.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Palladon® Inject, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-d-meropeneme" data-title="Méropénème (Meronem®)"><p class="lab">Indication suisse</p><p>Infections sévères, dont intra-abdominales et sepsis.</p><p class="lab">Dose</p><p>500 mg à 1 g i.v. toutes les 8 h (1,5 à 6 g/j) ; adaptation rénale.</p><p class="lab">Place</p><p>Nécrose infectée chez le patient très grave ; épargne des carbapénèmes (WSES 2019).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Meronem® i.v., Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-sirs" data-title="Syndrome de réponse inflammatoire systémique"><p class="lab">Critères</p><p>Au moins deux parmi : température anormale, tachycardie, polypnée ou hypocapnie, leucocytose ou leucopénie.</p><p class="lab">Valeur</p><p>Critère du score BISAP ; sa persistance annonce la défaillance d’organe.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-ringer" data-title="Ringer lactate"><p class="lab">Nature</p><p>Cristalloïde isotonique balancé.</p><p class="lab">Place</p><p>Proposé par l’ESGE 2018 ; supériorité sur le sérum physiologique faiblement démontrée (WSES 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
