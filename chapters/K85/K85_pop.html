<template data-pop="pareto-k85-clinique" data-title="Loi de Pareto — Pancréatite aiguë"><p class="ratio" data-cover="k85-1,k85-5,k85-6,k85-7,k85-8,k85-11"></p><ul><li>Le diagnostic exige deux critères sur trois (douleur, lipase > 3 fois la normale, imagerie).</li><li>La forme sévère se définit par une défaillance d’organe > 48 heures.</li><li>Cristalloïdes précoces, réévalués souvent ; pas d’antibioprophylaxie.</li><li>Une angiocholite impose une CPRE dans les 24 heures ; sinon, on ne fait pas de CPRE de routine.</li><li>Dans la forme biliaire légère, la cholécystectomie se fait pendant l’hospitalisation.</li><li>Nécrose infectée : différer, drainer, puis nécrosectomie mini-invasive.</li></ul></template>
<template data-pop="pareto-k85-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k85-e-1,k85-e-2,k85-e-3"></p><ul><li>Une lipase > 3 fois la normale pose le diagnostic, mais ne mesure pas la gravité.</li><li>L’échographie à l’admission recherche la lithiase.</li><li>Scanner injecté à 72-96 heures, pas avant, dans la forme sévère.</li><li>Index de Balthazar = inflammation (0-4) + nécrose (0-6).</li><li>Cause inconnue : bili-IRM ou écho-endoscopie.</li></ul></template>
<template data-pop="pareto-k85-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k85-p-1,k85-p-2,k85-p-3"></p><ul><li>Aucun traitement spécifique n’existe, et l’on ne donne pas d’antibioprophylaxie.</li><li>Cristalloïdes précoces, réévalués souvent.</li><li>L’analgésie multimodale débute dans les 24 heures.</li><li>Méropénème 1 g toutes les 8 h si nécrose infectée grave.</li><li>Le métamizole expose à l’agranulocytose et s’injecte lentement.</li></ul></template>
<template data-pop="k85-criteres" data-title="Critères diagnostiques (Atlanta 2012)"><p class="lab">Deux critères sur trois</p><p>Le diagnostic exige deux critères sur trois : une douleur abdominale compatible, une lipase ou une amylase sériques > 3 fois la limite supérieure de la normale et des signes caractéristiques à l’imagerie.</p><p class="lab">Conséquence</p><p>Si 1 et 2 sont présents, l’imagerie n’est pas nécessaire au diagnostic.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p></template>
<template data-pop="k85-atlanta" data-title="Classification d’Atlanta révisée (2012)"><p class="lab">Légère</p><p>La forme légère n’a ni défaillance d’organe ni complication locale ou systémique, et elle guérit habituellement en une semaine.</p><p class="lab">Modérément sévère</p><p>La forme modérément sévère associe une défaillance d’organe transitoire (< 48 h), une complication locale ou systémique, ou la décompensation d’une comorbidité.</p><p class="lab">Sévère</p><p>Défaillance d’organe persistante (> 48 h), unique ou multiple.</p><p class="lab">Phases</p><p>Précoce (1re semaine) puis tardive.</p><p class="src">Références : <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-defaillance" data-title="Défaillance d’organe"><p class="lab">Organes</p><p>Cardiovasculaire, respiratoire et rénal.</p><p class="lab">Transitoire</p><p>Une défaillance de moins de 48 heures classe la forme au plus en modérément sévère.</p><p class="lab">Persistante</p><p>Une défaillance de plus de 48 heures définit la forme sévère ; le risque de décès est alors élevé, surtout si une nécrose infectée s’y associe.</p><p class="lab">Conduite</p><p>Le patient est admis en soins intensifs dès que possible (WSES 2019, grade 1C).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p></template>
<template data-pop="k85-cpre" data-title="CPRE dans la pancréatite biliaire"><p class="lab">Urgente (≤ 24 h)</p><p>Une angiocholite associée impose une CPRE dans les 24 heures (ESGE 2018, recommandation forte), car le pus biliaire sous pression entretient le sepsis.</p><p class="lab">Dans les 72 h</p><p>Une obstruction biliaire persistante justifie une CPRE dans les 72 heures.</p><p class="lab">Non indiquée</p><p>Sans angiocholite ni obstruction, la CPRE n’est pas indiquée, même si la pancréatite est prédite sévère (ESGE 2018 ; WSES 2019, grade 2B), car elle n’améliore pas le pronostic.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-necrose-infectee" data-title="Nécrose infectée"><p class="lab">Fréquence</p><p>Elle complique 20 à 40 % des formes sévères (WSES 2019).</p><p class="lab">Pronostic</p><p>Mortalité 35,2 % si défaillance d’organe associée.</p><p class="lab">Conduite</p><p>On donne des antibiotiques, puis on intervient de façon différée et progressive.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-interstitielle" data-title="Pancréatite interstitielle œdémateuse"><p class="lab">Définition</p><p>La glande est inflammatoire et œdémateuse de façon diffuse, se rehausse de façon homogène au scanner et ne montre pas de nécrose.</p><p class="lab">Évolution</p><p>Elle guérit habituellement en une semaine ; une collection tardive devient un pseudokyste.</p><p class="src">Références : <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-necrosante" data-title="Pancréatite nécrosante"><p class="lab">Définition</p><p>Le parenchyme pancréatique, le tissu péripancréatique ou les deux sont nécrosés.</p><p class="lab">Imagerie</p><p>Zones non rehaussées au scanner injecté, visibles de façon fiable après 72 heures.</p><p class="lab">Évolution</p><p>Une collection nécrotique aiguë se forme, puis devient une nécrose organisée après 4 semaines, et elle peut s’infecter.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-dbc" data-title="Classification fondée sur les déterminants"><p class="lab">Degrés</p><p>La forme est légère sans déterminant, modérée en cas de nécrose stérile ou de défaillance transitoire, sévère en cas de nécrose infectée ou de défaillance persistante, et critique quand les deux s’associent.</p><p class="lab">Limite</p><p>Elle exige de connaître le statut de la nécrose, donc s’applique mal à la première semaine (ESGE 2018).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-biliaire" data-title="Pancréatite biliaire"><p class="lab">Mécanisme</p><p>Calcul ou sludge qui migre et obstrue transitoirement l’ampoule de Vater.</p><p class="lab">Indices</p><p>Une lithiase vésiculaire à l’échographie, une cytolyse et une cholestase orientent vers l’origine biliaire.</p><p class="lab">Prévention</p><p>Cholécystectomie pendant la même hospitalisation si la forme est légère.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-tg" data-title="Hypertriglycéridémie"><p class="lab">Seuil</p><p>Triglycérides > 11,3 mmol/l (1000 mg/dl) : cause retenue (WSES 2019, grade 2C).</p><p class="lab">Quand doser</p><p>On les dose avec la calcémie en l’absence de lithiase et de consommation importante d’alcool.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-idiopathique" data-title="Pancréatite idiopathique"><p class="lab">Définition</p><p>Elle est idiopathique quand le bilan biologique et d’imagerie initial ne trouve aucune cause.</p><p class="lab">Bilan</p><p>On fait au moins deux échographies, puis un scanner et une écho-endoscopie à distance à la recherche d’une microlithiase, d’une tumeur ou d’une pancréatite chronique ; si l’écho-endoscopie est normale, on fait une IRM.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-cytosteatonecrose" data-title="Cytostéatonécrose"><p class="lab">Définition</p><p>La lipase pancréatique nécrose le tissu adipeux, et les acides gras libérés se combinent au calcium (saponification).</p><p class="lab">Conséquence</p><p>Le chirurgien voit des plages blanchâtres « en taches de bougie », et une hypocalcémie peut survenir.</p><figure><img src="data:image/gif;base64,R0lGODdhWAKQAYUAAOTS++HP+eDM+ObD+drF9dDA8uS18+Ks79ew7cm378es6dyj6duW486g5M2U38Kh5cKY4bmc4cGR3beR29iF2s6E2MeJ2cd+1L+J2r+I0r9+0rmI1biC0bGF0bd8zq97y8ZvzLluybJuxqZqw65Yva43qIxGrnEckQAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAKQAUAI/wAHABgoAMAAAgESChAQoGDDhQsfQnw4QIOJEQgGDGDYkEABBREiKDAogEBJkwcJqDS5UCXEliZXnix5EqUFEiZIMDBgAMODBAVWqixAVKjRowUQJPCINKhKBBkcHNS40mkBoAk6jAgRooIBmC4rjjBAtCyCswjKXlUwVG1Sj0QzaKjgAEGEDQwujBhxAsJVoGUTpE3wYMNWECAYVCBRogQIx48bSwZhIsQICBAycEUMgquDBKAVgE6goLTo0aIVjJigAEFp0qNDE46g9LTs0Aoe2IYN+sHq0g8miDT9OkEDDCRIaHht+sEDCB2GKxA+YcKHDhBM5DQhQkMGzBF0E/8HrqCB9Q0fTIg3TTr1aQUdxhNHXZz3gw4dTJz43OHECAwYdPDBCCJccIF33+0WW2gjmDCgdiNsAJpSsT2gHXcaQCAcBB/8BNpfC4YoYgITmACBASMmEAFWpAm4AQQ/gXjVjFlFF0GDHaT1V1CAxYbfYKPtiBVRQQo5IYcPGKDRCB0Y4IADFjiwAAMZNDDAWQU41BJHDAEA0QAinHDBRi+VCREBXgLQgAkZ1cQQTTS5tNAAEIzggQcNzCRnTEIhINOWR/FJAAISaDfBWRI0+MFXRgXlVKNLNfooXEQZwJh2G/jpqFucdvrACf6J4MFee+GEAYVE7qgqizMSCZoDFzD/RoIBYTpGAggknOBYCSRUwNUFTzpAwbAlgFoCAxSEQAEDuIqwwAIZbMCBCMndekBtDexlAQbhLajARwrCBh9zoiEAwQb4bYABBxtIgMEIH2CQgQUicHXCdh9IgJN2JIjQ4L0aOJBBBh9wsG7BA3vwwZ0Fc5AvBhMswBdfJDigncILZ6DwwXt5oMHHd6r77sUNEHdWcPhN8JNzzoUEHJMf5HoCCRZAAGAInRkLbF0UnnaWfjiTcMECZPEWYn2hXag0qdp9cFa3rfGlXmwg6rYgUap9sBuIoTl3mltDRqCfro5x8C1prYL9YWCobejhaJY6xsABz9KNQAADAYC33gpx/6SQmohJdmkDMfXtd0RmCrBAmMmZYIEBaGl0wJ0S+JnACFKlxCegJYm2559gGVUTU04Zt4DmglIqVE2PEnVWAw1c4CxclBZVe1GcEhBjp2qtHVgEvHONQAMekMBVBSY0dq+oOBl7b+WgDZobfBjEHMIHsPN1bwj1Gh9CcrziFIJw0aGWomgfsfYebu3JBlwHDUCHbgeJgnoBV5btCyqoOeGUHv84qdatNIABDzQNAgn4X8A4AKMHRKBE9wLggTzGgQp2YAMbmIBhRPCBDOJHAh4AlbN <template data-pop="k85-lipase" data-title="Lipase sérique"><p class="lab">Seuil</p><p>Le seuil diagnostique est > 3 fois la limite supérieure de la normale.</p><p class="lab">Avantages</p><p>Elle est plus spécifique que l’amylase et reste élevée plus longtemps (WSES 2019).</p><p class="lab">Limites</p><p>Son niveau ne reflète pas la gravité ; élévations non pancréatiques possibles (insuffisance rénale, appendicite, cholécystite).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-echo" data-title="Échographie abdominale"><p class="lab">Moment</p><p>On la fait à l’admission ou dans les 48 premières heures.</p><p class="lab">But</p><p>Elle recherche une lithiase vésiculaire, un sludge ou une dilatation des voies biliaires, car la cause biliaire change la conduite.</p><p class="lab">Limite</p><p>Le pancréas est souvent mal vu à cause des gaz digestifs.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-bisap" data-title="Score BISAP"><p class="lab">Un point par critère</p><p>Chaque critère vaut un point : urée > 8,9 mmol/l, troubles de la conscience, syndrome de réponse inflammatoire systémique, âge > 60 ans et épanchement pleural à la radiographie.</p><p class="lab">Usage</p><p>On le calcule dans les 24 premières heures ; il prédit la gravité, la défaillance d’organe et le décès (WSES 2019 ; ESGE 2018, recommandation faible).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-hematocrite" data-title="Hématocrite"><p class="lab">Seuil</p><p>> 44 % : facteur de risque indépendant de nécrose (WSES 2019, grade 1B).</p><p class="lab">Mécanisme</p><p>La fuite capillaire concentre le sang ; l’hématocrite monte donc.</p><p class="lab">Suivi</p><p>Sa baisse sous remplissage est un objectif de perfusion.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-crp" data-title="CRP"><p class="lab">Seuil</p><p>Une CRP ≥ 150 mg/l au 3e jour prédit une forme sévère (WSES 2019, grade 2A).</p><p class="lab">Limite</p><p>Elle monte avec retard ; elle est donc peu utile à l’admission.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-remplissage" data-title="Réanimation liquidienne"><p class="lab">Principe</p><p>Précoce, sans attendre l’aggravation hémodynamique, par cristalloïdes isotoniques (WSES 2019, grade 1B).</p><p class="lab">Débit</p><p>Par exemple Ringer lactate 5 à 10 ml/kg/h au début (ESGE 2018), adapté au patient.</p><p class="lab">Surveillance</p><p>Hémodynamique, diurèse, hématocrite, urée, créatinine, lactate ; éviter la surcharge.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-analgesie" data-title="Analgésie multimodale"><p class="lab">Règle</p><p>Toute pancréatite reçoit une analgésie dans les 24 premières heures (WSES 2019).</p><p class="lab">Moyens</p><p>Antalgiques non opioïdes, opioïdes, analgésie péridurale ou contrôlée par le patient.</p><p class="lab">Prudence</p><p>On évite les AINS en cas d’insuffisance rénale aiguë, car ils réduisent la perfusion rénale.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-nutrition" data-title="Nutrition dans la pancréatite aiguë"><p class="lab">Forme légère</p><p>Le patient s’alimente précocement par la bouche.</p><p class="lab">Forme sévère</p><p>Si l’alimentation orale n’est pas tolérée après 72 heures, on donne une nutrition entérale polymérique (ESGE 2018, recommandation forte), car elle préserve la barrière intestinale.</p><p class="lab">Voie</p><p>On utilise d’abord une sonde nasogastrique, puis nasojéjunale en cas d’intolérance ; la voie parentérale ne sert qu’en cas d’échec ou si l’objectif calorique n’est pas atteint.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-angiocholite" data-title="Angiocholite"><p class="lab">Définition</p><p>Infection de la voie biliaire obstruée.</p><p class="lab">Clinique</p><p>Le patient présente une douleur, une fièvre et un ictère.</p><p class="lab">Conduite</p><p>On donne des antibiotiques et l’on draine la bile par CPRE dans les 24 heures.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-cholecystectomie" data-title="Cholécystectomie après pancréatite biliaire"><p class="lab">Forme légère</p><p>On l’opère pendant la même hospitalisation (WSES 2019, grade 1A), même après une sphinctérotomie (grade 1B), car la récidive précoce est fréquente.</p><p class="lab">Collections</p><p>En présence de collections, on la diffère jusqu’à leur résolution ou leur stabilisation (grade 2C).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-apfc" data-title="Collection liquidienne péripancréatique aiguë"><p class="lab">Délai</p><p>Elle apparaît dans les 4 premières semaines d’une pancréatite interstitielle.</p><p class="lab">Aspect</p><p>Liquide sans paroi définie.</p><p class="lab">Évolution</p><p>Elle se résorbe habituellement seule ; on ne la draine donc pas.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://doi.org/10.1136/gutjnl-2012-302779" target="_blank" rel="noopener">Banks P. A. et al., Classification of acute pancreatitis 2012: revision of the Atlanta classification, Gut 2013;62:102-111 (définitions reprises par la WSES 2019 et l’ESGE 2018)</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAL5AYQAAOPj46mpqZeXl4+Pj4uLi4iIiIWFhYODg4GBgX5+fnt7e3l5eXZ2dnFxcWxsbGdnZ2FhYVtbW1RUVE5OTkhISD8/PzIyMiYmJh4eHhkZGRQUFBAQEAwMDAcHBwICAgAAACwAAAAAWAL5AUAI/wA/CBxIsKDBgwgTKlzIsKHDhxAjSpxIsaLFixgzatzIsaPHjyBDihxJsqTJkyhTqlTpoWVLgS4/vCzooYNLDxsyaNCQoScGDBcsWLgQNOhQoUKJVqCQlOgFDR04dNiAASrBmzKxrtzKtavXr2DDxrxJlizMlh0McrjwMwPVoRg2rF1aQWgFCXgnUKiwVG9dC3z5Al66V2jhoUaPDh4KVcNPokAFI5WslG5dvhT8At4r2KlTtxs0bKjJgcOGDR2ippZaOnVqDx+iSp0q93Rt26Vx25Rt+rRr01JzskWdmqdODjeBR+VplcPO06JPZ1hsd0KFpxcypM1qNqz37+DDe/+f6aH39MlIFwNlTLVqBqAY3DpHDT306dIces6eXdN4z50+AUWUfI7Jl5p99i33nk4alCbacwou2FZO//HEFoEAvtcgcM7F95xpC25o3E6Q8eThTm3pJBd+vTnXoHErEtfbfcFB2N9ODcpYnwaQCViVYx6i5mCFC4ZIIYrZRfdeVTJ+iB+OoeGIpAUUVGlBXLCdJd6WXHa5VVkCdfBeYkTB9VN8x+EXFYVtBVdhaD9lWFVrzvUkVwYXogkUgyjGeZqAPerUE4EVMvfgg2eKNiiSVa25JJo5NqjghLbhGGdwlcoXpYb3UdgTW9HBxxaabk1lYnb5tWWUZ1QGttcEEOD/JcEEtOIFwQMPOOBArBHc2gADCRyQAAMKDKurAw0ooAADCyBQwAINIEvsAgwQi8AAAxywQAIIJEBttcUy8KsCyC5L7LK7QhABrREwBap/Ns1ok0y0ySVlUHRdcBZsM3np779bviTwW4GVORSD/x1oKI4qTlqhjzp1wOOogDql50+AIWVwUq0G1leVe2UmQQSz4hpBr70+EC0Etz4Aga4u/5ruAwso0 <template data-pop="k85-won" data-title="Nécrose organisée (walled-off necrosis)"><p class="lab">Définition</p><p>Collection encapsulée de nécrose partiellement liquéfiée, après au moins 4 semaines.</p><p class="lab">Traitement</p><p>On la draine en cas d’infection ou de symptômes, d’abord par voie endoscopique ou percutanée.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-dpds" data-title="Syndrome du canal déconnecté"><p class="lab">Définition</p><p>Rupture du canal pancréatique principal qui isole un segment de glande encore sécrétant.</p><p class="lab">Conséquence</p><p>La collection récidive ; s’il est symptomatique, il justifie une intervention (WSES 2019).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-pct" data-title="Procalcitonine"><p class="lab">Usage</p><p>Test biologique le plus sensible pour détecter l’infection de la nécrose ; une valeur basse est un fort argument contre (WSES 2019, grade 2A).</p><p class="lab">Limite</p><p>Ne remplace pas la clinique et l’imagerie.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-atb" data-title="Antibiotiques dans la nécrose infectée"><p class="lab">Indication</p><p>On les donne en cas d’infection suspectée ou prouvée, mais jamais en prophylaxie.</p><p class="lab">Pénétration pancréatique</p><p>Les carbapénèmes, les quinolones et le métronidazole pénètrent bien dans le pancréas ; la pipéracilline-tazobactam et les céphalosporines de 3e génération pénètrent moyennement, et les aminosides mal.</p><p class="lab">Épargne</p><p>On choisit les quinolones en cas d’allergie aux bêtalactamines et l’on réserve les carbapénèmes aux patients très graves.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-step-up" data-title="Stratégie progressive (step-up)"><p class="lab">Étape 1</p><p>On donne des antibiotiques, on soutient les organes et on attend que la nécrose s’organise (environ 4 semaines).</p><p class="lab">Étape 2</p><p>On draine par voie endoscopique transmurale ou percutanée.</p><p class="lab">Étape 3</p><p>En l’absence d’amélioration, on fait une nécrosectomie endoscopique ou une chirurgie mini-invasive.</p><p class="lab">Résultat</p><p>Le drainage seul guérit 25 à 60 % des patients (WSES 2019, grade 1A).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-necrosectomie" data-title="Nécrosectomie"><p class="lab">Endoscopique</p><p>L’endoscopiste retire la nécrose à travers une prothèse transgastrique.</p><p class="lab">Chirurgicale mini-invasive</p><p>Le chirurgien débride le rétropéritoine par vidéo-assistance.</p><p class="lab">Comparaison</p><p>Elle cause moins de nouvelles défaillances d’organe que la chirurgie ouverte, mais demande plus de gestes (WSES 2019, grade 1B).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-sca" data-title="Syndrome du compartiment abdominal"><p class="lab">Définition</p><p>Hyperpression intra-abdominale soutenue avec défaillance d’organe nouvelle.</p><p class="lab">Traitement</p><p>On commence par des mesures conservatrices ; si elles échouent, on fait une laparotomie de décompression (WSES 2019).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-scanner" data-title="Scanner injecté"><p class="lab">Moment</p><p>Dans la forme sévère, on le fait 72 à 96 heures après le début (WSES 2019, grade 1C), car la nécrose n’est visible qu’à ce moment ; on ne l’avance que si le diagnostic est douteux.</p><p class="lab">Apport</p><p>Il montre la nécrose, les collections et les complications vasculaires.</p><p class="lab">Limite</p><p>Scanners répétés : irradiation, peu d’effet sur la décision.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a>.</p></template>
<template data-pop="k85-bilirm" data-title="Bili-IRM et écho-endoscopie"><p class="lab">Indication</p><p>Rechercher un calcul caché de la voie biliaire principale si l’échographie est négative et la cause inconnue.</p><p class="lab">Avantage</p><p>Elles évitent une CPRE diagnostique, qui est invasive (WSES 2019).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-ctsi" data-title="Index de sévérité scanographique (Balthazar)"><p class="lab">Grade</p><p>Le grade A (pancréas normal) vaut 0, B (augmentation de volume) 1, C (inflammation de la graisse péripancréatique) 2, D (une collection) 3, et E (≥ 2 collections ou air rétropéritonéal) 4.</p><p class="lab">Nécrose</p><p>Aucune 0 ; < 30 % 2 ; 30 à 50 % 4 ; > 50 % 6.</p><p class="lab">Pronostic</p><p>Un index de 7 à 10 s’accompagne d’une morbidité de 92 % et d’une mortalité de 17 %.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-d-metamizole" data-title="Métamizole (Novalgin®)"><p class="lab">Dose i.v. adulte</p><p>On injecte 0,5 à 1 g lentement (au plus 1 ml/min), répétable toutes les 6 à 8 h, sans dépasser 5 g/j.</p><p class="lab">Risques</p><p>Il peut provoquer une agranulocytose potentiellement mortelle et, en injection rapide, une hypotension ou un choc.</p><p class="lab">Contre-indication</p><p>Antécédent d’agranulocytose aux pyrazolones.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Novalgin® solution injectable, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k85-d-hydromorphone" data-title="Hydromorphone (Palladon® Inject)"><p class="lab">Dose i.v.</p><p>Chez l’adulte naïf d’opioïdes de ≥ 50 kg, on injecte 1 à 1,5 mg toutes les 3 à 4 h en 2 à 3 minutes, ou l’on perfuse 0,15 à 0,45 mg/h.</p><p class="lab">Analgésie contrôlée</p><p>Le bolus est de 0,2 mg, avec un intervalle de 5 à 10 minutes.</p><p class="lab">Surdosage</p><p>On injecte de la naloxone 0,4 à 2 mg i.v.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Palladon® Inject, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-d-meropeneme" data-title="Méropénème (Meronem®)"><p class="lab">Indication suisse</p><p>Infections sévères, dont intra-abdominales et sepsis.</p><p class="lab">Dose</p><p>On donne 500 mg à 1 g i.v. toutes les 8 h (1,5 à 6 g/j) et l’on adapte la dose à la fonction rénale.</p><p class="lab">Place</p><p>Nécrose infectée chez le patient très grave ; épargne des carbapénèmes (WSES 2019).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Meronem® i.v., Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-sirs" data-title="Syndrome de réponse inflammatoire systémique"><p class="lab">Critères</p><p>Au moins deux parmi : température anormale, tachycardie, polypnée ou hypocapnie, leucocytose ou leucopénie.</p><p class="lab">Valeur</p><p>Il fait partie du score BISAP, et sa persistance annonce la défaillance d’organe.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
<template data-pop="k85-ringer" data-title="Ringer lactate"><p class="lab">Nature</p><p>C’est un cristalloïde isotonique balancé.</p><p class="lab">Place</p><p>Proposé par l’ESGE 2018 ; supériorité sur le sérum physiologique faiblement démontrée (WSES 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2018_a_0588_5365.pdf" target="_blank" rel="noopener">Arvanitakis M. et al., ESGE, prise en charge endoscopique de la pancréatite aiguë nécrosante, Endoscopy 2018;50:524-546</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6567462/" target="_blank" rel="noopener">Leppäniemi A. et al., 2019 WSES guidelines for the management of severe acute pancreatitis, World J Emerg Surg 2019;14:27</a>.</p></template>
