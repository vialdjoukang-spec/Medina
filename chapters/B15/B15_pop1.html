>L’ictère est la coloration jaune de la peau et des sclères par la bilirubine. Au cours d’une hépatite, il survient parce que les hépatocytes lésés n’excrètent plus la bilirubine conjuguée dans la bile. Il apparaît d’abord sur les sclères, riches en élastine qui fixe la bilirubine.</p><div class="src">Source : <a href="https://www.bag.admin.ch/fr/hepatite-a" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite A »</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="b15-pa-inr" data-title="INR">
<p>L’INR, ou rapport normalisé international, exprime le temps de prothrombine du patient rapporté à une référence. Il s’allonge quand le foie ne synthétise plus assez de facteurs de coagulation ; c’est pourquoi l’EASL utilise un INR supérieur à 1,5 pour définir l’hépatite B aiguë sévère.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/HepB-English-report.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « 2017 Clinical Practice Guidelines on the management of hepatitis B virus infection », J Hepatol 2017;67:370–398, section « Acute hepatitis B »</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b15-p-na" data-title="Analogue nucléos(t)idique">
<p>Un analogue nucléos(t)idique est un antiviral qui imite un nucléotide et bloque la transcriptase inverse du virus de l’hépatite B. Dans l’hépatite B aiguë sévère, il prévient l’insuffisance hépatique s’il est débuté tôt. L’EASL cite le ténofovir disoproxil, l’entécavir et la lamivudine.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/HepB-English-report.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « 2017 Clinical Practice Guidelines on the management of hepatitis B virus infection », J Hepatol 2017;67:370–398, section « Acute hepatitis B »</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-b15-virus" data-title="Loi de Pareto — Les cinq virus">
<p class="ratio" data-cover="b15-pa-1,b15-pa-2,b15-pa-3,b15-pa-4,b15-pa-5"></p><ul><li>Les virus A et E se transmettent par voie digestive et ne deviennent pas chroniques chez l’immunocompétent.</li><li>Le virus B devient chronique chez moins de 5 % des adultes, mais chez 90 % des nouveau-nés.</li><li>Le virus C devient chronique dans 70 à 80 % des cas.</li><li>Le virus E peut devenir chronique chez l’immunodéprimé.</li></ul>
</template>
<template data-pop="pareto-b15-gravite" data-title="Loi de Pareto — Gravité">
<p class="ratio" data-cover="b15-pa-6"></p><ul><li>L’INR mesure la fonction du foie restant.</li><li>Un INR supérieur à 1,5 définit l’hépatite B aiguë sévère.</li><li>L’hépatite E de génotype 1 ou 2 est grave chez la femme enceinte.</li></ul>
</template>
<template data-pop="pareto-b15-examens" data-title="Loi de Pareto — Examens">
<p class="ratio" data-cover="b15-e-1,b15-e-2"></p><ul><li>Les IgM anti-virus de l’hépatite A prouvent l’hépatite A.</li><li>Les IgM anti-HBc prouvent l’hépatite B aiguë, hors réactivation.</li><li>Pour l’hépatite E, il faut associer sérologie et ARN.</li></ul>
</template>
<template data-pop="pareto-b15-prev" data-title="Loi de Pareto — Prévention et traitement">
<p class="ratio" data-cover="b15-p-1,b15-p-2"></p><ul><li>Le traitement est symptomatique, sauf dans l’hépatite B sévère.</li><li>Les vaccins contre les hépatites A et B sont disponibles en Suisse.</li><li>Aucun vaccin n’existe contre les hépatites C et E en Suisse.</li></ul>
</template>
<template data-pop="b15-e-igmhbc" data-title="IgM anti-HBc">
<p>Les IgM dirigées contre l’antigène de capside du virus de l’hépatite B apparaissent en premier après l’infection ; leur première détection définit donc l’hépatite B aiguë. Elles peuvent cependant réapparaître faiblement lors d’une réactivation d’hépatite chronique, ce qui impose de rechercher un portage connu.</p><div class="src">Source : <a href="https://beh.santepubliquefrance.fr/beh/2024/16-17/2024_16-17_5.html" target="_blank" rel="noopener" data-reference-source="1">Santé publique France, « Surveillance de l’hépatite B aiguë en France, 2011–2022 », BEH 2024;16-17, définition de cas</a>. Textes lus le 9 octobre 2026.</div>
</template>

nses/by/4.0" target="_blank" rel="noopener" data-reference-source="1">Creative Commons Attribution 4.0</a> ; réduite et convertie pour l’affichage.</figcaption></figure><p>Le corps acidophile est un hépatocyte mort par apoptose : il se rétracte, son cytoplasme devient très éosinophile et son noyau se fragmente. Sa présence témoigne de la destruction des hépatocytes infectés par les lymphocytes T cytotoxiques.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/HepB-English-report.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « 2017 Clinical Practice Guidelines on the management of hepatitis B virus infection », J Hepatol 2017;67:370–398, section « Acute hepatitis B »</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="b15-p-rbv" data-title="Ribavirine dans l’hépatite E">
<p>La ribavirine est un analogue nucléosidique qui inhibe la réplication du virus de l’hépatite E. L’EASL recommande 12 semaines de monothérapie si l’ARN persiste trois mois après sa détection, puis un contrôle de l’ARN dans le sérum et les selles ; si l’ARN reste détectable, le traitement peut être prolongé de trois mois. Pendant la grossesse, les données sont insuffisantes pour l’utiliser.</p><div class="src">Source : <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « Clinical Practice Guidelines on hepatitis E virus infection », J Hepatol 2018;68:1256–1271</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b15-s-hbs" data-title="Antigène HBs">
<p>L’antigène HBs est la protéine d’enveloppe du virus de l’hépatite B. Sa présence dans le sang signe une infection en cours, aiguë ou chronique ; à l’inverse, les anticorps anti-HBs signent l’immunité, vaccinale si les anti-HBc sont absents.</p><div class="src">Source : <a href="https://www.bag.admin.ch/fr/hepatite-b" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite B »</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/HepB-English-report.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « 2017 Clinical Practice Guidelines on the management of hepatitis B virus infection », J Hepatol 2017;67:370–398, section « Acute hepatitis B »</a>. Textes lus le 9 octobre 2026.</div>
</template>
