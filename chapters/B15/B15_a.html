<div class="chap-head"><div class="code">B15–B17 — Hépatites virales aiguës · CIM-10-GM 2024 · I-03-Infectiologie</div><h1>Hépatites virales aiguës</h1><span class="status">Version de travail · Sources lues le 9 octobre 2026 : pages de l’OFSP sur les hépatites A, B, C et E ; fiche de l’ECDC sur l’hépatite A ; recommandations de l’EASL sur l’hépatite B (2017) et l’hépatite E (2018) ; définition de cas de l’hépatite B aiguë de Santé publique France (2024) ; informations professionnelles suisses de Havrix® et d’Engerix®-B. Ce cours couvre B15 (hépatite A), B16 (hépatite B aiguë) et B17 (autres hépatites virales aiguës, dont C et E). L’hépatite delta aiguë n’est pas développée, faute de source lue : lacune nommée. Les formes chroniques sont traitées dans le cours B18. Relecture médicale humaine non encore effectuée.</span></div>

<section class="ilot" id="b15-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. R., 34 ans, rentre d’un séjour de trois semaines en Asie du Sud-Est. Depuis cinq jours, il a de la fièvre, des nausées et une perte d’appétit, et ses yeux sont devenus jaunes ce matin. Ce tableau d’<button class="w" data-k="b15-pa-ict">ictère</button> fébrile oriente vers une hépatite virale aiguë ; cependant, cinq virus peuvent la causer, et chacun a sa transmission, son risque de chronicité et sa prévention.</p>
<p>Ce cours répond donc à trois questions. D’abord, quel virus faut-il suspecter selon l’exposition ? Ensuite, quels marqueurs sériques prouvent l’infection aiguë ? Enfin, quels patients faut-il traiter, alors que la plupart guérissent seuls ? Contrairement à un manuel figé, chaque terme vert ouvre une fenêtre qui justifie la décision et donne sa source.</p>
<div class="key"><b>À retenir.</b> Les hépatites A et E se transmettent surtout par voie digestive et ne deviennent pas chroniques chez l’immunocompétent ; les hépatites B et C se transmettent par le sang ou les liquides biologiques et peuvent devenir chroniques. Cette opposition explique pourquoi la prévention repose sur l’hygiène et la cuisson dans le premier cas, et sur la vaccination contre l’hépatite B et la réduction des risques dans le second.</div></section>

<section class="ilot" id="b15-pa-1"><h2><span class="n">1</span>Définition et lésion commune</h2>
<p>Tous ces virus provoquent la même lésion de base. En effet, une hépatite virale aiguë est une inflammation du foie due à un virus hépatotrope, c’est-à-dire un virus qui se multiplie surtout dans l’hépatocyte. Or, la destruction des hépatocytes est due principalement à la réponse immunitaire contre les cellules infectées, ce qui explique que l’ictère apparaisse souvent quand l’immunité s’active.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Dans un foie normal, les travées d’hépatocytes rayonnent régulièrement autour de la veine centrale. Ici, cette architecture est désorganisée, parce que les lymphocytes T cytotoxiques infiltrent le lobule et tuent les hépatocytes infectés. Le <button class="w" data-k="b15-pa-acido">corps acidophile</button> désigné par la flèche est un hépatocyte mort par apoptose, rétracté et éosinophile. Enfin, la bile retenue dans les canalicules traduit l’incapacité des hépatocytes lésés à excréter la bilirubine ; c’est pourquoi la bilirubine conjuguée s’élève dans le sang et colore la peau et les sclères.</div>

<div class="key"><b>Lecture et physiopathologie.</b> La sclère est riche en élastine, qui fixe la bilirubine ; c’est pourquoi l’ictère y devient visible plus tôt que sur la peau. Cet ictère est un signe de cholestase hépatocellulaire et non de gravité en soi, car la gravité se mesure par la coagulation, comme le montre l’îlot 6.</div></section>

<section class="ilot" id="b15-pa-2"><h2><span class="n">2</span>Hépatite A</h2>
<p>Le premier virus à évoquer chez un voyageur est celui de l’hépatite A. En effet, il est éliminé par l’intestin et transmis par voie féco-orale, par des aliments, de l’eau ou des objets contaminés, ou lors de contacts étroits, y compris sexuels, en particulier entre hommes. En Suisse, jusqu’à 100 cas sont recensés chaque année, contractés en général lors d’un voyage. <a href="https://www.bag.admin.ch/fr/hepatite-a" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite A »</a>.</p>
<p>L’incubation dure de 15 à 50 jours, en général 25 à 30 jours. Chez l’enfant de moins de six ans, seuls 30 % des infections sont symptomatiques ; en revanche, chez l’enfant plus âgé et l’adulte, la maladie est le plus souvent apparente, avec un ictère dans 70 % des cas. La maladie dure plusieurs semaines, au plus six mois, guérit spontanément, ne devient jamais chronique et confère une immunité définitive. <a href="https://www.bag.admin.ch/fr/hepatite-a" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite A »</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Le jeune enfant infecté est souvent asymptomatique, parce que sa réponse immunitaire cytotoxique est moins intense ; or, c’est cette réponse qui détruit les hépatocytes. À l’inverse, l’adulte développe une réponse vigoureuse, d’où l’ictère. De plus, la contagiosité maximale se situe dans la seconde moitié de l’incubation, avant les symptômes, et la plupart des patients ne sont plus contagieux après la première semaine d’ictère ; c’est pourquoi l’hygiène des mains doit être renforcée dans l’entourage dès le diagnostic. La létalité est faible, de 0,1 à 0,3 %, mais elle atteint 1,8 % après 50 ans ou en cas de maladie hépatique sous-jacente, ce qui justifie de vacciner ces patients. <a href="https://www.ecdc.europa.eu/en/hepatitis-a/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about hepatitis A »</a>.</div>

<div class="key"><b>Lecture et physiopathologie.</b> Le virus de l’hépatite A est une petite particule sans enveloppe ; il résiste donc à l’acidité gastrique et à de nombreux procédés de conservation des aliments, comme l’acidification ou la congélation. C’est pourquoi plusieurs cas groupés doivent faire rechercher une source alimentaire commune. <a href="https://www.ecdc.europa.eu/en/hepatitis-a/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about hepatitis A »</a>.</div></section>

<section class="ilot" id="b15-pa-3"><h2><span class="n">3</span>Hépatite B aiguë</h2>
<p>Le virus de l’hépatite B, très contagieux, se transmet en revanche par les liquides biologiques, surtout le sang et les sécrétions génitales. Ainsi, l’infection survient principalement lors du partage de seringues ou de rapports sexuels, mais aussi par de petites lésions cutanées ou muqueuses, et de la mère à l’enfant lors de l’accouchement. <a href="https://www.bag.admin.ch/fr/hepatite-b" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite B »</a>.</p>
<p>Environ un tiers des infections sont asymptomatiques. Dans le tableau classique, une perte d’appétit, des nausées, des vomissements, des douleurs abdominales, parfois des arthralgies, de la fièvre ou une éruption apparaissent 45 à 180 jours après l’infection. En Suisse, une vingtaine de cas aigus sont déclarés chaque année, avec une tendance à la baisse ; environ deux tiers touchent des hommes de 30 à 59 ans. <a href="https://www.bag.admin.ch/fr/hepatite-b" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite B »</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> La <button class="w" data-k="b15-s-dane">particule de Dane</button> est le virion infectieux complet : une enveloppe portant l’antigène HBs entoure une capside portant l’antigène HBc et contenant l’ADN viral. Or, l’hépatocyte infecté produit aussi un large excès de particules vides d’antigène HBs ; c’est pourquoi l’antigène HBs est le marqueur sérique le plus facile à détecter. Le risque de chronicité dépend surtout de l’âge : moins de 5 % chez l’adulte, mais 90 % chez le nouveau-né infecté à la naissance, dont l’immunité tolère le virus. <a href="https://www.bag.admin.ch/fr/hepatite-b" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite B »</a>. C’est la raison pour laquelle la vaccination du nourrisson et le dépistage de la femme enceinte sont prioritaires.</div></section>

<section class="ilot" id="b15-pa-4"><h2><span class="n">4</span>Hépatite C aiguë</h2>
<p>Le virus de l’hépatite C se transmet lui aussi principalement par le sang. Ainsi, le risque est élevé lors du partage de seringues, d’actes médicaux avec du matériel mal stérilisé, ou de tatouages et piercings non stériles ; à l’inverse, la transmission sexuelle est très rare, parce que cette voie est peu efficace. <a href="https://www.bag.admin.ch/fr/hepatite-c" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite C »</a>.</p>
<p>Trois quarts des nouvelles infections sont asymptomatiques. Le quart restant développe, six à neuf semaines après l’infection et au plus tard après six mois, une perte d’appétit, des douleurs abdominales, des nausées, parfois de la fièvre et des arthralgies, et un ictère dans 5 à 10 % des cas. L’infection guérit spontanément en six mois dans 20 à 30 % des cas ; en revanche, elle devient chronique dans 70 à 80 % des cas. <a href="https://www.bag.admin.ch/fr/hepatite-c" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite C »</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Le virus de l’hépatite C est un virus à ARN dont la polymérase commet beaucoup d’erreurs ; il produit donc en permanence des variants qui échappent aux anticorps. C’est pourquoi l’infection devient si souvent chronique, et pourquoi une guérison, spontanée ou sous traitement, ne protège pas contre une nouvelle infection. <a href="https://www.bag.admin.ch/fr/hepatite-c" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite C »</a>. Puisque l’hépatite aiguë est le plus souvent silencieuse, le diagnostic repose surtout sur le dépistage des personnes exposées.</div></section>

<section class="ilot" id="b15-pa-5"><h2><span class="n">5</span>Hépatite E</h2>
<p>L’hépatite E, enfin, est en Europe une zoonose alimentaire. En effet, les génotypes 3 et 4 passent de l’animal, porc ou sanglier, à l’humain par la chaîne alimentaire, et les produits à base de foie de porc cru présentent un risque particulier ; à l’inverse, les génotypes 1 et 2 se transmettent par l’eau contaminée en Asie, en Afrique et au Mexique. <a href="https://www.bag.admin.ch/fr/hepatite-e" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite E »</a>.</p>
<p>L’incubation dure de 2 à 6 semaines, et plus de 90 % des infections seraient asymptomatiques. La maladie associe fièvre, myalgies, douleurs abdominales, perte d’appétit et nausées, plus rarement un ictère, et guérit le plus souvent sans traitement. Cependant, l’infection peut devenir chronique chez l’immunodéprimé ou le transplanté et évoluer vers la cirrhose ; de plus, des complications neurologiques, comme une paralysie douloureuse de l’épaule, sont décrites. <a href="https://www.bag.admin.ch/fr/hepatite-e" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite E »</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Le génotype 3, présent en Suisse, circule chez le porc sans le rendre malade ; la cuisson complète de la viande inactive le virus. C’est pourquoi l’OFSP recommande aux immunodéprimés, aux personnes atteintes d’une maladie du foie, aux femmes enceintes, aux personnes âgées et aux enfants d’éviter la viande crue de porc et de sanglier. L’immunodéprimé ne parvient pas à éliminer le virus, faute de lymphocytes T efficaces, d’où la chronicité. Aucun vaccin n’est disponible en Suisse. <a href="https://www.bag.admin.ch/fr/hepatite-e" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite E »</a>.</div>

<section class="ilot" id="b15-pa-6"><h2><span class="n">6</span>Gravité et insuffisance hépatique</h2>
<p>Quel que soit le virus, le danger immédiat est l’insuffisance hépatique aiguë. Pour l’hépatite B, l’EASL définit l’hépatite aiguë sévère par une coagulopathie, le plus souvent un <button class="w" data-k="b15-pa-inr">INR</button> supérieur à 1,5, par une évolution prolongée, avec symptômes ou ictère marqué au-delà de 4 semaines, ou par des signes d’insuffisance hépatique aiguë. <a href="https://easl.eu/wp-content/uploads/2018/10/HepB-English-report.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « 2017 Clinical Practice Guidelines on the management of hepatitis B virus infection », J Hepatol 2017;67:370–398, section « Acute hepatitis B »</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Le foie synthétise la plupart des facteurs de coagulation, dont certains ont une demi-vie de quelques heures. Par conséquent, l’allongement de l’INR mesure en temps réel la perte de fonction hépatique, bien mieux que les transaminases, qui reflètent la destruction cellulaire mais pas la capacité restante. C’est pourquoi un INR qui s’allonge, ou une confusion évoquant une encéphalopathie, impose le contact avec un centre de transplantation hépatique.</div>
<div class="alert"><b>Situation particulière : la grossesse.</b> Chez la femme enceinte infectée par les génotypes 1 ou 2 du virus de l’hépatite E, l’EASL recommande une prise en charge en unité de soins intermédiaires et le transfert vers une unité hépatologique en cas d’insuffisance hépatique, parce que cette infection est associée à une mortalité maternelle et périnatale élevée. Les données sont insuffisantes pour utiliser la ribavirine pendant la grossesse. <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « Clinical Practice Guidelines on hepatitis E virus infection », J Hepatol 2018;68:1256–1271</a>.</div>
<button class="pareto-btn ui" data-k="pareto-b15-gravite">▲ Loi de Pareto — Gravité</button></section>

<section class="ilot" id="b15-pa-7"><h2><span class="n">7</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Critères diagnostiques.</b> L’hépatite A aiguë se prouve par les IgM anti-virus de l’hépatite A. <a href="https://www.ecdc.europa.eu/en/hepatitis-a/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about hepatitis A »</a>. L’hépatite B aiguë se définit par la première détection d’IgM anti-HBc ; si elles n’ont pas été dosées, l’antigène HBs et les anticorps anti-HBc totaux dans un contexte d’hépatite aiguë suffisent, tandis que le portage chronique et la réactivation d’une hépatite B chronique sont exclus. <a href="https://beh.santepubliquefrance.fr/beh/2024/16-17/2024_16-17_5.html" target="_blank" rel="noopener" data-reference-source="1">Santé publique France, « Surveillance de l’hépatite B aiguë en France, 2011–2022 », BEH 2024;16-17, définition de cas</a>. L’hépatite E aiguë se prouve par l’ARN viral, avec ou sans anticorps, ou par l’association des IgM et d’IgG croissantes. <a href="https://easl.eu/wp-content/uploads/2018/10/EASL-CPG-hepatitis-E-virus-infection.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « Clinical Practice Guidelines on hepatitis E virus infection », J Hepatol 2018;68:1256–1271</a>.</div>
<p>Les valeurs suivantes résument la décision clinique.</p>
<div class="key"><b>Paramètres clés.</b> L’incubation dure 15 à 50 jours pour l’hépatite A, 45 à 180 jours pour l’hépatite B, 6 à 9 semaines pour l’hépatite C et 2 à 6 semaines pour l’hépatite E. La chronicité touche moins de 5 % des adultes infectés par le virus B, 90 % des nouveau-nés, et 70 à 80 % des personnes infectées par le virus C. Une hépatite B aiguë est sévère si l’INR dépasse 1,5. <a href="https://www.bag.admin.ch/fr/hepatite-a" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite A »</a> ; <a href="https://www.bag.admin.ch/fr/hepatite-b" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite B »</a> ; <a href="https://www.bag.admin.ch/fr/hepatite-c" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite C »</a> ; <a href="https://www.bag.admin.ch/fr/hepatite-e" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Hépatite E »</a> ; <a href="https://easl.eu/wp-content/uploads/2018/10/HepB-English-report.pdf" target="_blank" rel="noopener" data-reference-source="1">EASL, « 2017 Clinical Practice Guidelines on the management of hepatitis B virus infection », J Hepatol 2017;67:370–398, section « Acute hepatitis B »</a>.</div>
<div class="key"><b>Lecture et physiopathologie.</b> Ces durées d’incubation fixent la fenêtre d’anamnèse : un ictère trois semaines après un voyage évoque l’hépatite A ou E, alors qu’une exposition sanguine quatre mois plus tôt oriente vers l’hépatite B. Le risque de chronicité, lui, dicte le suivi : on contrôle à six mois la disparition de l’antigène HBs ou de l’ARN du virus C, mais pas celle du virus A.</div>
