<template data-pop="g22-parkinsonisme" data-k="g22-parkinsonisme"><h3>Bradykinésie, rigidité et tremblement : quels mots employer ?</h3><p>Le noyau moteur utilisé ici associe bradykinésie à rigidité et/ou tremblement de repos. La bradykinésie est une lenteur de l’initiation ou de l’exécution des gestes ; l’examen recherche aussi une réduction d’amplitude ou de vitesse au cours des répétitions. La rigidité est une résistance au mouvement passif qui ne dépend pas de la vitesse comme la spasticité. Une roue dentée sans augmentation de résistance ne suffit pas à définir une rigidité.</p><p>Le tremblement de repos peut manquer. Une lenteur liée à douleur, faiblesse, difficulté de compréhension ou trouble cérébelleux n’est pas automatiquement parkinsonienne. L’instabilité posturale est importante pour les chutes et le différentiel ; elle ne remplace pas à elle seule le noyau moteur. La définition large de certains passages DGN et les critères de maladie de Parkinson ne sont pas fusionnés en un score universel de G22.</p><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></template>
<template data-pop="g22-codage" data-k="g22-codage"><h3>Dague et étoile : portée réelle de G22*</h3><p>La CIM-10-GM française 2024 identifie G22* comme « Syndrome parkinsonien au cours de maladies classées ailleurs ». L’entrée inclut le parkinsonisme syphilitique avec A52.1†, dont le libellé est « Syphilis nerveuse symptomatique ». L’entrée A52.1 contient réciproquement cette manifestation. Il n’existe pas de subdivision de G22 à décimale dans l’édition consultée.</p><p>Le manuel suisse 2026, règle D03m, donne priorité au code étiologique dague, suivi immédiatement du code manifestation étoile. Un code étoile ne s’utilise jamais seul. Les conditions de diagnostic supplémentaire et les règles du diagnostic principal restent applicables ; la présence d’une association possible ne remplace pas les faits cliniques du séjour.</p><p>Les formes iatrogènes, vasculaires, toxiques ou métaboliques ne doivent pas être toutes déplacées vers G22 sur le seul mot secondaire. La maladie de Wilson figure dans E83.0, mais les passages lus ne vérifient pas une association automatique E83.0†–G22*. Une hypothèse clinique utile et un couple de codage autorisé sont des objets différents.</p><p>Sources : <button class="w" data-k="g22-r1">[1]</button> · <button class="w" data-k="g22-r2">[2]</button> · <button class="w" data-k="g22-r12">[12]</button></p></template>
<template data-pop="g22-causes" data-k="g22-causes"><h3>La cause change le traitement, pas seulement le nom du syndrome</h3><p>Un début aigu ou subaigu, un déficit focal, une altération cognitive rapide, une ataxie ou un contexte infectieux appellent un bilan différent d’une maladie de Parkinson lentement progressive. La revue européenne des formes lésionnelles décrit des causes vasculaires, structurales, métaboliques, infectieuses, toxiques et immunologiques. Elle ne propose pas que toutes reçoivent le code G22.</p><p>Dans la neurosyphilis, atteinte méningée, vasculaire ou parenchymateuse peut s’associer à des symptômes moteurs, cognitifs, psychiatriques ou oculaires. Dans Wilson, les manifestations neurologiques et hépatiques peuvent guider un bilan du cuivre. Les médicaments, notamment ceux susceptibles d’interférer avec la neurotransmission dopaminergique, doivent être recherchés avec leur date d’introduction et les changements de dose. Il faut discuter leur modification avec le prescripteur.</p><p>Une lésion des ganglions de la base n’explique pas mécaniquement tout signe moteur. Seule une partie des personnes avec certaines lésions développent un parkinsonisme ; la revue souligne l’importance des réseaux et de la vulnérabilité individuelle. L’interprétation exige une concordance entre histoire, examen, topographie et évolution.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></template>
<template data-pop="g22-histoire" data-k="g22-histoire"><h3>Questions ciblées et respect de la personne</h3><p>Recueillir la liste complète des médicaments, y compris traitements digestifs, psychotropes et produits ajoutés récemment. Rechercher douleur, maladie articulaire, faiblesse, trouble sensitif, atteinte visuelle ou difficultés de compréhension qui peuvent modifier les performances. Le niveau fonctionnel antérieur aide à mesurer le changement réel.</p><p>L’entretien sexuel est conduit avec confidentialité et sans inférer une infection à partir d’une identité ou d’une origine. Une syphilis ancienne, ses traitements documentés, les résultats sérologiques antérieurs et les symptômes neurologiques, oculaires ou auditifs orientent l’enquête. Pour Wilson, rechercher maladie hépatique, symptômes psychiatriques, antécédents familiaux et traitements anti-cuivre. Les questions découlent des hypothèses, non d’un dépistage stigmatisant.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r13">[13]</button></p></template>
<template data-pop="g22-examen" data-k="g22-examen"><h3>Un examen reproductible ne se limite pas à un résultat positif</h3><p>Expliquer et montrer le geste, vérifier la compréhension, puis regarder la performance. La douleur, une limitation articulaire, une parésie et la fatigue peuvent perturber la tâche. Le test passif se fait chez une personne relâchée ; il explore la résistance et ne mesure pas une force volontaire. Le tremblement est examiné au repos, en posture et lors d’une action pour préciser le phénotype.</p><p>Étudier ensuite force, réflexes, sensibilité, coordination, pupilles, oculomotricité, parole et fonctions cognitives selon le contexte. L’observation de la marche comporte démarrage, longueur des pas, ballant des bras et demi-tour, avec protection contre les chutes. Une manœuvre déstabilisante n’est pas un exercice à faire seul chez une personne à risque. Documenter les conditions et répéter les observations pertinentes après correction des facteurs réversibles.</p><p>Sources : <button class="w" data-k="g22-r4">[4]</button> · <button class="w" data-k="g22-r10">[10]</button> · <button class="w" data-k="g22-r11">[11]</button></p></template>
<template data-pop="g22-lcr-syph" data-k="g22-lcr-syph"><h3>De la sérologie à une hypothèse neurologique étayée</h3><p>Le guide DGN 2026, avec participation de la Société suisse de neurologie, repose sur la combinaison des éléments cliniques, de l’étude du liquide céphalorachidien et des anticorps tréponémiques intrathécaux. Un test sérique spécifique peut rester positif après une infection traitée ; il ne démontre pas à lui seul une activité neurologique ni la cause du parkinsonisme.</p><p>En cas de suspicion clinique, le guide commence par une recherche sérique spécifique, confirmation d’un résultat positif puis, lorsque l’indication est retenue, étude d’un couple liquide-sérum prélevé en même temps. Le laboratoire évalue inflammation et fonction de barrière ainsi que la synthèse intrathécale avec les corrections nécessaires. Les disponibilités de tests décrites en Allemagne ne sont pas supposées identiques dans chaque laboratoire suisse.</p><p>Un VDRL négatif dans le liquide ne suffit pas à exclure la neurosyphilis, et la PCR du liquide n’est pas recommandée comme outil universel de diagnostic ou d’exclusion. Des anticorps spécifiques intrathécaux peuvent persister longtemps après guérison. L’interprétation doit tenir compte du tableau, des traitements passés et des autres causes d’inflammation ; elle est discutée avec le laboratoire et les spécialistes.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button></p></template>
<template data-pop="g22-criteres" data-k="g22-criteres"><h3>Critères de neurosyphilis, Leipzig et syndrome moteur</h3><p>Dans le guide germanophone, une neurosyphilis probable combine au moins deux éléments parmi évolution neurologique/psychiatrique compatible, liquide pathologique et amélioration sous antibiotique recommandé, avec preuve sérologique spécifique confirmée selon le cadre décrit. Le critère de réponse est rétrospectif : il ne permet pas d’attendre passivement la preuve avant toute décision urgente.</p><p>La forme certaine ajoute, dans ce cadre, une production locale d’anticorps spécifiques, avec inflammation et/ou altération de barrière ; VDRL ou RPR positif renforce la confirmation mais leur négativité n’exclut pas. Ce système ne devient ni un score de sévérité ni un score universel de G22. Il ne faut pas inventer une pondération chiffrée.</p><p>Le score de Leipzig concerne Wilson : il combine plusieurs domaines, dont anneau cornéen, manifestations neuropsychiatriques ou image typique, hémolyse, cuivre urinaire ou hépatique, céruloplasmine et variants ATP7B. Le tableau EASL 2025 considère un total d’au moins quatre comme rendant le diagnostic hautement probable. On ne calcule pas un résultat à partir d’items manquants assimilés à zéro sans examen.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button></p></template>
<template data-pop="g22-wilson" data-k="g22-wilson"><h3>Ne pas exclure Wilson sur un seul dosage normal</h3><p>Wilson peut associer symptômes moteurs, neuropsychiatriques et atteinte hépatique. Le guide EASL-ERN 2025 recommande une approche multidisciplinaire, avec examens cliniques, céruloplasmine, cuivre urinaire des 24 heures, examen à la lampe à fente et investigations complémentaires selon la situation. Le transporteur ATP7B et l’élimination biliaire du cuivre sont centraux dans la compréhension de la maladie.</p><p>Une céruloplasmine normale ne suffit pas à exclure Wilson. La méthode du laboratoire influence la mesure, et le cuivre urinaire peut être affecté par collecte, contamination, cholestase et contexte hépatique aigu. La génétique apporte un argument et aide au dépistage familial ; l’absence de deux variants identifiés n’exclut pas à elle seule une présentation compatible.</p><p>Le cuivre échangeable relatif, rapport du cuivre échangeable au cuivre total, peut compléter les tests s’il est disponible et interprété avec le laboratoire. La table 2025 donne une forte suspicion au-delà de 15 %. L’algorithme de la même recommandation utilise une borne supérieure ou égale à 15 %. Un résultat exactement à 15 % nécessite donc une interprétation avec le laboratoire et le centre expert ; aucune frontière unique n’est reconstruite ici. Le cuivre libre calculé comporte des limites analytiques et peut produire des valeurs biologiquement impossibles ; il n’est pas une cible autonome pour ajuster un chélateur.</p><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></template>
<template data-pop="g22-traitement" data-k="g22-traitement"><h3>Deux objectifs : interrompre le mécanisme causal et réduire le handicap</h3><p>Une neurosyphilis étayée appelle un traitement anti-infectieux approprié et une surveillance clinique, avec prise en charge des autres infections sexuellement transmissibles selon indication. Le guide 2026 recommande principalement quatorze jours de pénicilline G intraveineuse ; la ceftriaxone à 2 g intraveineux toutes les 24 heures pendant quatorze jours est une alternative décrite. Allergies, organes, grossesse et contexte déterminent le choix réel.</p><p>Un exemple explicitement cité de pénicilline est quatre administrations de six millions d’unités internationales, soit vingt-quatre millions par jour. Le texte source donne d’autres schémas et une parenthèse d’équivalence qui ne concorde pas arithmétiquement avec eux. Le cours ne reproduit pas cette équivalence. Ce repère de guide doit être confronté au produit suisse et adapté par l’équipe ; il n’est pas une ordonnance pour toute personne présentant G22.</p><p>Dans Wilson, traitement anti-cuivre, suivi du foie et prise en charge neurologique sont organisés par spécialistes. La titration et la surveillance évitent sous-traitement et toxicité. Une amélioration peut prendre du temps et rester incomplète. Les traitements symptomatiques sont ajustés au handicap dominant, avec physiothérapie, ergothérapie, orthophonie et mesures de sécurité selon besoins ; il n’existe pas de prescription dopaminergique commune à toutes les causes.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r14">[14]</button></p></template>
<template data-pop="g22-pronostic" data-k="g22-pronostic"><h3>Ce que les observations permettent réellement de dire</h3><p>L’observation estonienne décrit la disparition du parkinsonisme, des myoclonies et de l’ataxie lors du suivi après antibiothérapie et soins associés. L’observation chinoise décrit une amélioration après plusieurs changements de traitement et une prise en charge anti-infectieuse. Ces trajectoires montrent une possibilité de récupération ; ce ne sont ni des essais comparatifs ni un taux de succès généralisable.</p><p>Les changements cognitifs, la marche et l’autonomie sont suivis avec les mêmes observations utiles au départ. Une persistance de symptômes peut refléter une séquelle, un contrôle causal insuffisant, une autre maladie ou un effet indésirable. L’absence d’amélioration immédiate ne permet pas, seule, de rejeter un diagnostic ni de prolonger automatiquement un traitement.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r9">[9]</button> · <button class="w" data-k="g22-r11">[11]</button></p></template>
<template data-pop="g22-declaration" data-k="g22-declaration"><h3>Syphilis : les responsabilités de déclaration sont distinctes</h3><p>Le guide OFSP 2026 indique un délai d’une semaine pour les résultats répondant aux critères de syphilis. Le médecin transmet la déclaration clinique au médecin cantonal ; le laboratoire transmet électroniquement à l’OFSP les résultats positifs spécifiques selon les critères du guide. Un résultat RPR ou VDRL non spécifique isolé, sans confirmation spécifique, ne constitue pas la déclaration de laboratoire décrite dans cette rubrique.</p><p>Les modalités et exceptions du guide doivent être appliquées au cas réel ; un nouveau traitement pour suspicion de non-réponse, un traitement prophylactique de partenaire et un traitement rétrospectivement non indiqué ne se déclarent pas comme un nouvel épisode selon la liste lue. La notification ne remplace ni le traitement ni l’information confidentielle et la prise en charge des partenaires indiquée.</p><p>Sources : <button class="w" data-k="g22-r13">[13]</button></p></template>
<template data-pop="pareto-g22-a" data-k="pareto-g22-a"><h3>Syndrome, cause, code</h3><p>G22* n’est pas le synonyme de tout parkinsonisme secondaire. Vérifier le noyau moteur, rechercher une cause traitable et les signes urgents, puis documenter le couple étiologie-manifestation. Un test isolé ne remplace pas le raisonnement clinique.</p></template>
<template data-pop="g22-imagerie" data-k="g22-imagerie"><h3>Concordance entre topographie et examen</h3><p>La revue des causes lésionnelles insiste sur l’association de l’examen neurologique et de l’imagerie. Des lésions à différents endroits d’un réseau peuvent produire un tableau ressemblant ; inversement, une lésion des ganglions de la base peut ne pas s’accompagner de parkinsonisme. La localisation aide à tester l’hypothèse, sans fournir une relation univoque entre une tache et un diagnostic.</p><p>Dans la neurosyphilis, l’imagerie peut rechercher complications vasculaires, hydrocéphalie, gomme ou autre atteinte. Les observations publiées montrent parfois une atrophie diffuse ou asymétrique non spécifique. La figure clinique ci-dessous n’est donc ni un test de dépistage ni une preuve autonome de neurosyphilis. Elle doit être lue avec l’histoire, l’examen et les analyses.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r8">[8]</button> · <button class="w" data-k="g22-r11">[11]</button></p></template>
<template data-pop="g22-lcr" data-k="g22-lcr"><h3>Pourquoi apparier liquide et sérum ?</h3><p>Des anticorps présents dans le liquide peuvent provenir du sang ou d’une synthèse locale. Les quotients des anticorps spécifiques doivent être rapportés aux immunoglobulines et à la fonction de barrière pour interpréter la production intrathécale. L’inflammation, les cellules, les protéines et les paramètres métaboliques sont examinés ensemble. Une interprétation sans contexte de barrière peut attribuer à tort une origine locale.</p><p>Le guide rappelle les limites de sensibilité du VDRL et du RPR dans le liquide, et celles de la PCR. Le marqueur CXCL13 peut aider dans certains contextes mais n’est ni spécifique d’un agent ni suffisamment établi pour devenir une preuve autonome. Un résultat doit être décrit avec sa méthode et sa question ; l’équipe recontacte le laboratoire si le tableau et le test divergent.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button></p></template>
<template data-pop="g22-cuivre-bilan" data-k="g22-cuivre-bilan"><h3>REC, cuivre urinaire et Leipzig : trois objets différents</h3><p>La céruloplasmine, le cuivre total, le cuivre échangeable, le rapport échangeable/total et le cuivre urinaire des 24 heures ne sont pas des mesures interchangeables. Le rapport REC est un pourcentage ; le guide EASL 2025 situe une forte suspicion au-dessus de 15%. Le compte rendu doit préciser méthode, intervalle de référence et disponibilité locale. La figure 2 utilise au contraire une borne supérieure ou égale à 15 %, et le texte cite aussi 18,5 % comme seuil d’une étude. Ces expressions ne sont pas harmonisées silencieusement ; un résultat exactement à 15 % se discute avec le laboratoire et le centre expert.</p><p>Le cuivre urinaire exige une collecte complète et peut être influencé par traitement, cholestase ou inflammation hépatique. Au cours d’une chélation, son sens change : il reflète aussi l’action du médicament. Le score de Leipzig combine plusieurs domaines ; les unités et conditions des items doivent être conservées. Aucun score ni seuil isolé n’est un code de manifestation.</p><p>Le cuivre non lié à la céruloplasmine obtenu par calcul suppose des relations analytiques qui peuvent donner des valeurs négatives. La FI Cuprior cite un repère de cuivre libre ; le guide EASL souligne les limites du calcul. La surveillance ne se réduit donc pas à viser mécaniquement un nombre calculé, surtout s’il contredit clinique ou autres analyses. La décision se prend avec laboratoire et centre expert.</p><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></template>
<template data-pop="pareto-g22-e" data-k="pareto-g22-e"><h3>Un test pour une question</h3><p>L’image localise ; les analyses documentent un mécanisme ou un agent ; la clinique teste leur cohérence. Toujours distinguer résultat, activité, causalité et codage.</p></template>
<template data-pop="pareto-g22-sci" data-k="pareto-g22-sci"><h3>Comprendre avant de compter</h3><p>La sémiologie décrit ; l’anatomie localise avec prudence ; les réseaux expliquent des ressemblances ; biochimie et microbiologie documentent des causes ; la pharmacologie sécurise l’exposition. Le code ne remplace aucune de ces étapes.</p></template>
<template data-pop="g22-penicilline" data-k="g22-penicilline"><h3>Guide de neurosyphilis et FI Grünenthal : deux niveaux à confronter</h3><p>Le guide DGN 2026 recommande principalement quatorze jours de pénicilline G intraveineuse pour une neurosyphilis. Un exemple listé est quatre administrations de six millions d’unités internationales par jour : le total est vingt-quatre millions d’unités par jour. D’autres rythmes sont listés ; la parenthèse d’équivalence du guide ne concorde pas arithmétiquement avec eux. Elle n’est pas recopiée comme une conversion fiable.</p><p>La FI suisse effectivement servie de Pénicilline Grünenthal porte la date de mai 2023. Le flacon 10Mega contient dix millions d’unités internationales de benzylpénicilline sous forme sodique ; la notice donne 386 mg de sodium pour ce flacon. Les repères de masse de sel ne sont pas des grammes de n’importe quelle pénicilline : on conserve l’unité et la formulation du produit.</p><p>Au-delà de deux millions d’unités, la FI impose une administration lente avec un maximum de 0,5million d’unités par minute. La préparation, la dilution et les compatibilités sont vérifiées avec le protocole du centre et la pharmacie ; aucun volume n’est déduit d’un simple nom de flacon. Ne pas mélanger à d’autres médicaments sans compatibilité vérifiée. Une formule de dose ne remplace ni le contrôle du débit ni l’examen du rein.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r7">[7]</button></p></template>
<template data-pop="g22-pen-rein" data-k="g22-pen-rein"><h3>Rein, sodium et neurotoxicité : une sécurité active</h3><p>La FI conserve la dose initiale en insuffisance rénale, puis décrit une diminution de l’entretien ou un allongement d’intervalle. Son tableau est rapporté à un poids de 70 kg et à des valeurs de filtration ; il ne doit pas être transformé en algorithme universel G22. La situation infectieuse, l’exposition et les fonctions d’organes demandent une adaptation spécialisée.</p><p>Les fortes doses peuvent entraîner des effets neurotoxiques, particulièrement en insuffisance rénale ou susceptibilité convulsive. Une confusion, des myoclonies, une hyperréflexie ou une crise imposent une réévaluation urgente de l’exposition et des autres causes. Le sodium du sel compte en cas de cardiopathie ou de trouble électrolytique. La notice recommande hémogramme, fonction rénale et électrolytes, notamment lors de traitement prolongé à forte dose.</p><p>Sources : <button class="w" data-k="g22-r7">[7]</button></p></template>
<template data-pop="g22-herxheimer" data-k="g22-herxheimer"><h3>Une réaction après la première dose demande une analyse clinique</h3><p>La réaction de Jarisch-Herxheimer peut survenir au début du traitement d’une infection à spirochètes, avec fièvre, frissons et modification des symptômes. La FI cite un délai habituel de 2–12 heures ; le guide décrit une fenêtre initiale de 12–24 heures. Ces descriptions ne sont pas fusionnées en un seuil horaire permettant de classer seul chaque réaction.</p><p>Le guide recommande surveillance et traitement de soutien sans interrompre pour ce seul mécanisme une antibiothérapie nécessaire. Il n’existe pas d’études démontrant un bénéfice des corticoïdes adjuvants systématiques dans la neurosyphilis. Le protocole d’un cas publié qui en utilisait ne devient pas une recommandation générale.</p><p>À l’inverse, la FI pénicilline considère l’urticaire immédiate comme un signal imposant l’arrêt du traitement ; une réaction anaphylactique exige les mesures urgentes appropriées. Une réaction cutanée grave appelle aussi arrêt et réévaluation selon notice. Dyspnée, instabilité ou réaction sévère ne sont jamais banalisées sous une étiquette de Jarisch-Herxheimer sur le seul critère de l’heure.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r7">[7]</button> · <button class="w" data-k="g22-r9">[9]</button></p></template>
<template data-pop="g22-ceftriaxone" data-k="g22-ceftriaxone"><h3>Ceftriaxon Labatec : dose, rein et limites de la notice</h3><p>Le guide neurosyphilis 2026 décrit la ceftriaxone à 2 g intraveineux toutes les 24 heures pendant 14 jours. Il ne trouve pas de données prouvant le bénéfice d’une dose de charge initiale de 4 g. Le choix en cas d’allergie exige une évaluation adaptée ; l’existence d’une alternative ne dispense pas de préciser la réaction et les risques propres au produit.</p><p>La FI Ceftriaxon Labatec de juin 2025 a été réellement lue par Sol pour G06 et est réutilisée explicitement. Elle décrit des doses adultes générales de 1–2 g/j, avec possibilité de 4 g/j dans des infections graves. En dessous de 10 ml/min de clairance ou en dialyse, cette spécialité limite la dose à 2 g/j. La fréquence et la durée de neurosyphilis viennent du guide, pas d’une transformation de la plage générale en protocole de G22.</p><p>Les contre-indications et restrictions de compatibilité, notamment avec solutions contenant du calcium, doivent être relues pour la présentation utilisée et la population réelle. Une fenêtre pédagogique ne remplace pas la notice complète de prescription. L’antibiotique ne corrige pas automatiquement les séquelles motrices ; le suivi clinique et fonctionnel reste nécessaire.</p><p>Sources : <button class="w" data-k="g22-r3">[3]</button> · <button class="w" data-k="g22-r14">[14]</button></p></template>
<template data-pop="g22-cuprior" data-k="g22-cuprior"><h3>Trientine : l’équivalence de base ne permet pas une substitution silencieuse</h3><p>La FI Cuprior, médicament de comparaison étranger juillet 2025, indique une quantité de tétrahydrochlorure équivalant à 150 mg de trientine par comprimé. Il s’agit de la masse de base utilisée dans les doses de la notice. La masse exacte du sel n’est pas reconstruite ici. Les formulations de trientine ont des caractéristiques différentes et ne sont pas échangées sur une simple égalité de milligrammes.</p><p>L’indication libellée concerne les adultes, adolescents et enfants d’au moins 5 ans atteints de Wilson et ne tolérant pas la D-pénicillamine. L’initiation est réservée à des spécialistes expérimentés. Chez l’adulte, la plage de la notice est 450–975 mg de trientine base par jour, soit 3à 6½comprimés, en 2–4prises. La dose initiale est généralement la plus basse de la plage, puis adaptée à la réponse ; cette plage n’est pas une prescription automatique pour tout syndrome parkinsonien.</p><p>Chez l’enfant d’au moins 5 ans, la notice donne 225–600 mg/j en 2–4prises ; cette information ne devient pas une dose pondérale copiée de l’adulte. En dessous de 5 ans, la formulation n’a pas une efficacité et une sécurité établies. Pour les fonctions rénale ou hépatique altérées, les données sont limitées et la notice demande une surveillance, plutôt qu’une formule de réduction inventée.</p><p>Sources : <button class="w" data-k="g22-r6">[6]</button></p></template>
<template data-pop="g22-cuprior-prises" data-k="g22-cuprior-prises"><h3>Prises, interactions et surveillance de la réponse</h3><p>Prendre la trientine à jeun, au moins une heure avant ou deux heures après un repas, et à au moins une heure des autres médicaments, aliments ou lait, selon la FI. L’absorption est diminuée par les aliments et des complexes peuvent se former avec les métaux. L’association avec le zinc est déconseillée dans cette notice ; fer et autres produits doivent être espacés avec l’équipe, sans improviser un régime de plusieurs chélateurs.</p><p>Une aggravation neurologique initiale peut survenir. La FI recommande prudence de titration et suivi neurologique toutes les deux à trois semaines au début jusqu’à la dose cible. Le guide EASL recommande aussi de commencer bas et d’augmenter lentement les chélateurs, tout en soulignant que cela ne supprime pas tout risque. L’observance, les symptômes, le foie et les paramètres du cuivre sont confrontés avant une adaptation.</p><p>La surveillance vise aussi à éviter une carence en cuivre. Le repère de cuivre libre de la FI ne doit pas effacer les limites du cuivre calculé décrites par EASL. Les symptômes et le bilan sont lus ensemble ; une baisse urinaire isolée ne dicte pas mécaniquement une augmentation ni un arrêt. Les décisions de traitement et leur raison sont documentées.</p><p>Sources : <button class="w" data-k="g22-r5">[5]</button> · <button class="w" data-k="g22-r6">[6]</button></p></template>
<template data-pop="pareto-g22-p" data-k="pareto-g22-p"><h3>Produit, preuve et patient</h3><p>Pénicilline : unités, rythme, rein et débit. Trientine : base, formulation, indication et prises. Le traitement causal et le soutien fonctionnel sont suivis avec les symptômes et les analyses, sans dose universelle de G22.</p></template>
