<template data-pop="g22-trientine" data-title="Trientine — Cuprior®">
<div class="lab">Indication suisse</div><p>Adultes, adolescents et enfants dès 5 ans <b>intolérants à la D-pénicillamine</b>. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a></p>
<div class="lab">Dose</div><p>450 à 975 mg par jour de trientine base, en 2 à 4 prises ; enfant 225 à 600 mg par jour. Formes neurologiques : augmentation lente, contrôle toutes les deux à trois semaines jusqu’à la dose cible. À prendre au moins une heure avant ou deux heures après les repas. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a></p>
<div class="lab">Surveillance</div><p>Aggravation neurologique initiale possible (excès de cuivre libre sérique) ; surtraitement : carence en cuivre, anémie sidéroblastique ; suivi au moins deux fois par an ; cuivre libre normal 100 à 150 µg/L. En grossesse, la dose est ajustée pour une cuprémie normale. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a></p>
<div class="lab">Limite</div><p>Fiche lue avec une mise à jour de juillet 2025 pour un médicament de comparaison étranger ; l’indication suisse est étroite.</p>
<p class="src">Référence : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a>.</p></template>
<template data-pop="g22-dpenicillamine" data-title="D-pénicillamine et sels de zinc">
<div class="lab">Statut</div><p>Aucune information professionnelle suisse n’a été trouvée par l’outil de recherche pour la D-pénicillamine et le zinc. Les posologies lues proviennent d’un texte de formation français (spécialités Cufence et Wilzin). <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a></p>
<div class="lab">Contenu lu</div><p>Départ de la pénicillamine à 300 mg par jour en forme neurologique, paliers mensuels ; aggravation paradoxale « ++(+) » pour la pénicillamine, « + » pour le zinc ; en atteinte hépatique significative, seuls les chélateurs sont recommandés. <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a> <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a></p>
<div class="lab">Limite</div><p>Aucune dose n’est reprise ici comme dose suisse.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a> ; <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a>.</p></template>
<template data-pop="g22-penicilline" data-title="Benzylpénicilline sodique — Pénicilline «Grünenthal»">
<div class="lab">Indication suisse</div><p>Infections à spirochètes et méningite ; la neurosyphilis n’est pas nommée. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Pénicilline Grünenthal)</a></p>
<div class="lab">Dose en neurosyphilis (ligne directrice)</div><p>4 × 6, 5 × 5 ou 3 × 10 millions d’unités internationales par jour, 14 jours (au moins 10). <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Précautions</div><p>Injecter lentement au-delà de 2 millions d’unités (au plus 0,5 million par minute). Neurotoxicité à 40 à 60 millions d’unités par jour avec un rein normal, 20 millions en insuffisance rénale légère à modérée, 10 millions en insuffisance sévère. Un flacon de 10 millions d’unités contient 386 mg de sodium. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Pénicilline Grünenthal)</a></p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Pénicilline Grünenthal)</a>.</p></template>
<template data-pop="g22-ceftriaxone" data-title="Ceftriaxone — Rocephin®">
<div class="lab">Information suisse</div><p>Dose 1 à 2 g par jour, jusqu’à 4 g ; <i>T. pallidum</i> est sensible ; la neurosyphilis n’est pas nommée dans les indications. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Rocephin)</a></p>
<div class="lab">Dose en neurosyphilis</div><p>2 g par jour par voie intraveineuse, 14 jours (au moins 10). <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Précautions</div><p>Réaction de Jarisch-Herxheimer possible ; au plus 2 g par jour si la clairance est inférieure à 10 mL par minute. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Rocephin)</a></p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Rocephin)</a>.</p></template>
<template data-pop="g22-jarisch" data-title="Réaction de Jarisch-Herxheimer">
<div class="lab">Constat</div><p>Elle survient peu après le début de l’antibiotique, est autolimitée, et ne doit pas faire interrompre le traitement. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Rocephin)</a></p>
<div class="lab">Limite</div><p>Les symptômes précis et leur durée n’ont pas été lus dans la source.</p>
<p class="src">Référence : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Rocephin)</a>.</p></template>
<template data-pop="g22-levodopa" data-title="Lévodopa et agonistes dopaminergiques">
<div class="lab">Rôle</div><p>Un essai de lévodopa est utile si la lésion est présynaptique nigrostriée. Il est conseillé dans le parkinsonisme wilsonien et peut être tenté dans le manganisme, avec des réponses souvent faibles. Les agonistes dopaminergiques sont une option si le parkinsonisme est invalidant. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<div class="lab">Limite</div><p>Aucune information professionnelle suisse de la lévodopa n’a été lue dans ce dossier ; aucune dose n’est proposée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a>.</p></template>
<template data-pop="g22-datscan" data-title="DaTSCAN — ioflupane marqué à l’iode 123">
<div class="lab">Indication suisse</div><p>Visualiser la perte des terminaisons dopaminergiques dans les syndromes parkinsoniens cliniquement douteux. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse DaTSCAN)</a></p>
<div class="lab">Lecture</div><p>Normal dans la plupart des dégénérescences hépatocérébrales ; il ne distingue pas fiablement la maladie de Wilson de la maladie de Parkinson. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<div class="lab">Limite</div><p>Fiche reprise d’un dossier voisin sans relecture. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse DaTSCAN)</a></p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse DaTSCAN)</a>.</p></template>
<template data-pop="g22-sources" data-title="Sources, hiérarchie des preuves et lacunes">
<div class="lab">Hiérarchie</div><p>Classification (BfArM, OFS), étude populationnelle suisse, ligne directrice DGN et Société suisse de neurologie 2026, recommandation européenne 2025 (résumé), revues narratives, textes de formation. La source primaire la plus récente prime.</p>
<div class="lab">Lacunes</div><ol><li>Règles suisses de codage dague-astérisque non lues ; rattachement à G22* vérifié pour la seule syphilis.</li><li>Aucune source ne décrit le parkinsonisme syphilitique.</li><li>Recommandation EASL-ERN 2025 : texte intégral inaccessible.</li><li>Pas d’information professionnelle suisse pour la D-pénicillamine et le zinc.</li><li>Test de soustraction de l’hydrocéphalie à pression normale non lu.</li><li>Critères de la maladie de Creutzfeldt-Jakob non lus.</li><li>Incidence suisse de la syphilis non lue.</li><li>Aucune recommandation suisse dédiée au G22* retrouvée.</li><li>S16 à S19 repris d’un dossier voisin sans relecture.</li></ol>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> ; <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">(BfArM, structure des codes)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a> ; <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a>.</p></template>
<template data-pop="pareto-g22-definition" data-title="Pareto — Définitions et codage">
<p class="ratio" data-cover="g22-0,g22-1"></p><ul><li>G22* est une manifestation parkinsonienne, jamais un diagnostic isolé ; elle se code après la maladie causale.</li><li>Le parkinsonisme est une bradykinésie avec rigidité ou tremblement de repos.</li><li>La classification ne nomme que la syphilis (A52.1†) ; les autres causes viennent de la littérature clinique.</li></ul></template>
<template data-pop="pareto-g22-epidemio" data-title="Pareto — Épidémiologie">
<p class="ratio" data-cover="g22-2"></p><ul><li>À Genève, 20 % des parkinsonismes sont non dégénératifs.</li><li>Les causes de G22* sont rares mais traitables, et leurs fréquences viennent de séries de cas.</li><li>La maladie de Wilson a une prévalence d’environ 1/30 000.</li></ul></template>
<template data-pop="pareto-g22-meca" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g22-3"></p><ul><li>La voie nigrostriée et les noyaux gris en aval portent le parkinsonisme.</li><li>La lévodopa agit si la lésion est présynaptique nigrostriée isolée.</li><li>Le déficit de l’ATP7B accumule le cuivre dans le foie puis le cerveau.</li></ul></template>
<template data-pop="pareto-g22-causes" data-title="Pareto — Causes et classification">
<p class="ratio" data-cover="g22-4"></p><ul><li>Huit groupes de causes : vasculaire, hydrocéphalie, expansif, métabolique, hypoxo-ischémique, toxique, infectieux, immun.</li><li>Le terrain oriente avant l’imagerie.</li><li>Aucune source ne décrit le parkinsonisme syphilitique.</li></ul></template>
<template data-pop="pareto-g22-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g22-5,g22-6"></p><ul><li>Le rythme d’installation oriente vers la cause.</li><li>Un parkinsonisme symétrique et axial est plutôt métabolique ou toxique.</li><li>Les drapeaux rouges imposent de chercher une cause.</li></ul></template>
<template data-pop="pareto-g22-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g22-7"></p><ul><li>L’IRM cérébrale est l’examen central.</li><li>Sérologie positive avec signes neurologiques : ponction lombaire obligatoire.</li><li>Une IRM normale n’exclut ni la maladie de Wilson ni une encéphalite auto-immune.</li></ul></template>
<template data-pop="pareto-g22-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g22-8"></p><ul><li>Hématome sous-dural : drainage.</li><li>Myélinolyse osmotique : prévention par correction lente.</li><li>Wilson fulminant : transplantation ; neurosyphilis : pénicilline G intraveineuse ; encéphalite auto-immune : immunothérapie précoce.</li></ul></template>
<template data-pop="pareto-g22-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g22-9,g22-10"></p><ul><li>Traiter la cause prime sur le traitement du parkinsonisme.</li><li>Wilson : chélateurs ou zinc, paliers lents en forme neurologique.</li><li>Neurosyphilis : pénicilline G ou ceftriaxone 14 jours ; essai de lévodopa si lésion présynaptique.</li></ul></template>
<template data-pop="pareto-g22-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g22-11,g22-12"></p><ul><li>Suivi de la cause : score UWDRS, cuprurie, cuivre échangeable dans le Wilson ; VDRL dans la neurosyphilis.</li><li>Trientine dès 5 ans ; poursuite en grossesse avec cuprémie normale.</li><li>Insuffisance rénale : réduire la pénicilline G.</li></ul></template>
<template data-pop="pareto-g22-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g22-e-1,g22-e-2,g22-e-3,g22-e-4"></p><ul><li>Un examen répond à une question ; le score de Leipzig organise le diagnostic de Wilson.</li><li>Céruloplasmine normale chez 5 à 20 % des malades ; VDRL du liquide peu sensible.</li><li>Le DaTSCAN ne distingue pas Wilson et Parkinson.</li></ul></template>
<template data-pop="pareto-g22-s-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g22-s-anat-cours"></p><ul><li>Le parkinsonisme naît de la substance noire, du striatum ou du pallidum.</li><li>Chaque cause a un siège préférentiel.</li></ul></template>
<template data-pop="pareto-g22-s-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g22-s-histo-cours"></p><ul><li>Wilson : tamponnement astrocytaire puis démyélinisation.</li><li>Nécrose pallidale et striatale en hypoxo-ischémie.</li></ul></template>
<template data-pop="pareto-g22-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g22-s-physio-cours"></p><ul><li>Récepteurs striataux intacts : la lévodopa agit.</li><li>Récepteurs détruits : elle agit rarement.</li></ul></template>
<template data-pop="pareto-g22-s-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g22-s-bioch-cours"></p><ul><li>ATP7B déficient : cuivre accumulé, toxicité mitochondriale et oxydative.</li><li>Manganèse pallidal dans la dégénérescence hépatocérébrale acquise.</li></ul></template>
<template data-pop="pareto-g22-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g22-p-1,g22-p-2,g22-p-3,g22-p-4,g22-p-5"></p><ul><li>Trientine suisse : intolérance à la D-pénicillamine uniquement.</li><li>Pénicilline G : neurotoxicité à haute dose, surtout en insuffisance rénale.</li><li>Aucune fiche suisse lue pour D-pénicillamine, zinc, lévodopa.</li></ul></template>
