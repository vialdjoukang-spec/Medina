<template data-pop="g22-r1" data-k="g22-r1"><h3>[1] OFS : CIM-10-GM française, fichier structuré de la classification 2024</h3><p>G22* est une manifestation sans subdivision ; parkinsonisme syphilitique associé à A52.1† explicitement indiqué dans les deux sens. E83.0 inclut Wilson et Menkes sans constituer une paire G22 automatique.</p><p><b>Passages lus :</b> Entrée G22 complète, inclusion réciproque A52.1 et inclusions E83.0 ; lignes correspondantes fichier des codes également lues. <b>Version :</b> 2024, export 31 octobre 2024. <b>Limites :</b> Pas toutes les règles de facturation 2026 lues ; autre source fichier des codes asset 32686265 distincte. A52.1 au-delà des inclusions pertinentes non utilisé.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g22-r2" data-k="g22-r2"><h3>[2] BfArM : entrée G22 complète</h3><p>La classification allemande confirme G22* et son inclusion syphilitique A52.1†, sans sous-code à décimale.</p><p><b>Passages lus :</b> Entrée G22 complète jusqu’à G23. <b>Version :</b> ICD-10-GM 2024. <b>Limites :</b> Classification, pas guide thérapeutique ni certification de codage suisse. Premier parseur format structuré a échoué sur format de page web, lecture obtenue ensuite par un parseur textuel.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener noreferrer">Consulter la source — BfArM</a></p></template>
<template data-pop="g22-r3" data-k="g22-r3"><h3>[3] DGN/SNG : Neurosyphilis</h3><p>Diagnostic combinant clinique, sérum et liquide céphalorachidien ; anticorps tréponémiques persistants ne prouvent pas activité. VDRL négatif ne suffit pas à exclure. PCR non recommandée comme test universel. Anticorps intrathécaux corrigés des quotients et fonction de barrière. Traitement principal pénicilline G 14 jours ou ceftriaxone 2 g IV par jour 14 jours. Un schéma cité est 4 doses de 6 millions UI par jour. Pas d’études en faveur des corticoïdes adjuvants systématiques. Contrôle clinique prioritaire, ponction selon réponse et contexte.</p><p><b>Passages lus :</b> document numérique pages imprimées 1–19 et 21–30 par service web ; méthodes, critères, formes, tests, traitement, suivi, notification et tables. <b>Version :</b> S1 v 6.0, actualisation 16 mars 2026, validité 15 mars 2031. <b>Limites :</b> Parenthèse d’équivalence des doses source incohérente : ne pas la recopier ni la corriger silencieusement. Tests disponibles en Allemagne non extrapolés aux laboratoires suisses. Critères de neurosyphilis, pas score universel G22. accès au document direct a retourné page web textuelle, lecture effective du document numérique par autre service sans changement d’identité. Page 20 non revendiquée.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — DGN et sociétés participantes dont Société suisse de neurologie</a></p></template>
<template data-pop="g22-r4" data-k="g22-r4"><h3>[4] DGN : Parkinson-Krankheit, sémiologie et diagnostic</h3><p>Bradykinésie explorée par mouvements répétés, rigidité indépendante de la vitesse ; roue dentée isolée sans résistance insuffisante. Tremblement non obligatoire. Instabilité posturale demande d’exclure atteintes sensorielles/cérébelleuses. Un syndrome secondaire clinique ne détermine pas à lui seul le code G22. MDS critères de maladie de Parkinson nécessitent exclusions et signes de soutien.</p><p><b>Passages lus :</b> Définitions pages 24–25 ; question 3 pages 33–34, en-tête ; pas traitement complet. <b>Version :</b> S2k 2023. <b>Limites :</b> Définition syndromique large de DGN inclut instabilité posturale ; ne pas la confondre avec noyau moteur strict MDS. Guide maladie de Parkinson non transférable à toutes les causes G22. Métadonnées détaillées version 8.1 à vérifier si utilisées.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://register.awmf.org/assets/guidelines/030-010l_Parkinson_Krankheit_2023-11_1.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — DGN</a></p></template>
<template data-pop="g22-r5" data-k="g22-r5"><h3>[5] EASL-ERN Clinical Practice Guidelines on Wilson’s disease</h3><p>Diagnostic par faisceau incluant céruloplasmine, cuivre urinaire 24 h, examen lampe à fente, génétique ATP7B et score Leipzig. Table 5 : REC > 15 % ; figure 2 : REC ≥ 15 %. Borne exactement 15 % à discuter ; 18,5 % est un seuil d’étude cité, pas une limite unique à recopier. Céruloplasmine normale ne suffit pas à exclure. Aggravation neurologique initiale possible, doses de chélateur commencées faibles et augmentées lentement ; surveillance spécialisée. Cuivre libre calculé peut être négatif et biologiquement incohérent, ne pas en faire une cible isolée. Continuité de thérapie anti-cuivre recommandée en grossesse/allaitement au niveau du guide ; FI Cuprior exige analyse bénéfice-risque et décision spécifique d’allaitement, ne pas effacer cette différence.</p><p><b>Passages lus :</b> Résumé base bibliographique européenne puis document numérique : diagnostic p 695–696 tables 5–6 ; aggravation neurologique p 707 ; prévention p 714 ; surveillance p 716–717 ; grossesse et traitements symptomatiques p 708. <b>Version :</b> 2025, volume 82,690–728, identifiant de publication : 10.1016/j.jhep.2024.11.007. <b>Limites :</b> Wilson constitue ici un différentiel causal ; pas d’attribution automatique G22. Méta-analyse rétrospective ne permet pas de classer précisément le risque par médicament. Toutes les sections transplantation, pédiatrie, grossesse pas encore lues.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://easlcampus.eu/sites/default/files/2025-03/EASL-ERN_CPG_on_Wilson%27s_Disease.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — EASL-ERN, Journal of Hepatology</a></p></template>
<template data-pop="g22-r6" data-k="g22-r6"><h3>[6] Cuprior : information professionnelle suisse</h3><p>Un comprimé équivaut à 150 mg de trientine base, tétrahydrochlorure non interchangeable silencieusement. Indiqué dès 5 ans dans Wilson avec intolérance à D-pénicillamine, initiation spécialisée. Adulte 450–975 mg/j en 2–4prises ; début faible et adaptation clinique. Suivi neurologique toutes 2–3 semaines initialement. À jeun 1 h avant/2 h après repas et 1 h des autres médicaments/aliments/lait. Association zinc déconseillée. Grossesse nécessite analyse bénéfice-risque et dose efficace minimale ; allaitement décision individuelle.</p><p><b>Passages lus :</b> Composition, indications, doses adulte/enfant/rein/foie/âge, administration, avertissements, interactions, grossesse-allaitement, date. <b>Version :</b> Médicament de comparaison étranger juillet 2025. <b>Limites :</b> Pas de masse du sel inventée. Valeur de cuivre libre calculé FI à discuter avec limites EASL et laboratoire, pas cible décisionnelle autonome. Rein/foie données limitées avec surveillance. Pas une prescription générale G22.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680677190018" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information via AmiKo</a></p></template>
<template data-pop="g22-r7" data-k="g22-r7"><h3>[7] Pénicilline Grünenthal : information professionnelle suisse</h3><p>10 millions d’unités internationales de benzylpénicilline sous forme sodique contiennent 386 mg de sodium. Dose et intervalle selon foyer et fonction rénale ; tableau rénal donné pour 70 kg non protocole G22. Au-delà 2 millions d’unités internationales, débit maximal 0,5 million d’unités internationales/min. Allergie pénicilline contre-indiquée ; urticaire immédiate impose arrêt et évaluation urgente, distinct d’une réaction de Jarisch-Herxheimer. Hautes doses et insuffisance rénale favorisent neurotoxicité et convulsions. Surveillance hémogramme, rein, électrolytes. Élimination surtout rénale et courte demi-vie ; diffusion méningée accrue par inflammation. Grossesse autorisée, allaitement exposition faible mais sensibilisation/flore possibles.</p><p><b>Passages lus :</b> Composition, indications, doses, tableau rénal, débit, contre-indications, neurotoxicité, sodium, interactions, grossesse-allaitement, pharmacocinétique, date. <b>Version :</b> Mai 2023 effectivement servi. <b>Limites :</b> Date mai 2023 contredit date juin 2025 héritée, cette dernière écartée. FI générale et recommandation neurosyphilis distinctes ; ne pas transposer sa plage 20–60 millions d’unités internationales en prescription automatique. Coquille FI sodium plus de 10 unités internationales/j non utilisée.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680562710024" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information via AmiKo</a></p></template>
<template data-pop="g22-r8" data-k="g22-r8"><h3>[8] Sabre et coll. : Neurosyphilis as a great imitator, case report</h3><p>Cas 42 ans associant déclin cognitif, myoclonies, ataxie, bradykinésie-rigidité asymétrique et anomalies pupillaires, avec inflammation et sérologie du liquide. Amélioration décrite après antibiothérapie et soins associés. IRM avec atrophie, non spécifique de l’agent.</p><p><b>Passages lus :</b> Résumé et présentation clinique complète ; droits Creative Commons Attribution 4.0 ; consentement écrit de patient pour publication et images, légende complète figure 1, identifiant du fichier original et pixels inspectés. <b>Version :</b> 2016, identifiant de publication : 10.1186/s13104-016-2176-2. <b>Limites :</b> Observation unique, ni incidence ni réversibilité universelle. IRM avec atrophie asymétrique plus marquée à droite selon légende ; pas signe pathognomonique ni preuve autonome de cause. Original manuel Creative Commons Attribution 4.0, pixels inchangés, tableau français ajouté. Aucun schéma historique additionnel n’est repris comme recommandation.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4964046/" target="_blank" rel="noopener noreferrer">Consulter la source — BMC Research Notes ; Tartu, Estonie</a></p></template>
<template data-pop="g22-r9" data-k="g22-r9"><h3>[9] Shi et coll. : Unmasking the hidden culprit, neurosyphilis mimicking parkinsonism</h3><p>Cas 50 ans avec troubles cognitifs/comportementaux, bradykinésie et tremblement ; rôle des psychotropes discuté, amélioration après plusieurs interventions. IRM atrophie non spécifique. Consentement écrit familial pour publication des images selon auteurs et approbation éthique rapportée.</p><p><b>Passages lus :</b> Résumé et présentation clinique, licence, éthique et consentement. <b>Version :</b> 2025, identifiant de publication : 10.1186/s12883-025-04101-y. <b>Limites :</b> Observation chinoise, pas fondement européen de conduite. Pas de recommandation de corticoïdes systématiques ni reprise des injections retard historiques. Retrait psychotropes et traitements concomitants empêchent attribution causale simple.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11887257/" target="_blank" rel="noopener noreferrer">Consulter la source — BMC Neurology ; Kaifeng, Chine</a></p></template>
<template data-pop="g22-r10" data-k="g22-r10"><h3>[10] HUG : Syndromes parkinsoniens, update pour le praticien</h3><p>Bradykinésie au premier plan, tests vitesse/amplitude, recherche rigidité et tremblement au repos ; examen actif et passif distincts. Interroger traitements, chronologie, symétrie et terrain ; rechercher signes atypiques, cognition, coordination et oculomotricité.</p><p><b>Passages lus :</b> Identifier 1–3 et Investiguer 1–3. <b>Version :</b> Avril 2018, date du document conservée. <b>Limites :</b> Enseignement suisse ancien, pas recommandation thérapeutique 2026. Pas reprise exhaustive du tableau médicamenteux ancien.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Vanessa Fleury et Yves-Laurent Jackson, Hôpitaux universitaires de Genève</a></p></template>
<template data-pop="g22-r11" data-k="g22-r11"><h3>[11] Secondary parkinsonism associated with focal brain lesions</h3><p>Le noyau clinique associe bradykinésie à rigidité et/ou tremblement de repos. Lésion mésencéphalique, ganglions de la base ou réseau connecté peuvent produire un syndrome ; lésion visible ne détermine pas seule le phénotype. Causes infectieuses, toxiques et métaboliques se distinguent par contexte, tempo, image et autres signes. Opportunistes et toxicité de traitements coexistent au diagnostic différentiel.</p><p><b>Passages lus :</b> Résumé, introduction, infections et opportunistes, discussion anatomie/réseaux et conclusion. <b>Version :</b> 2024, identifiant de publication : 10.3389/fneur.2024.1438885. <b>Limites :</b> Revue narrative, pas directive suisse G22 ni table automatique de codage. Pas tous les chapitres de causes lus, ni preuves originales de chaque réseau relues. Réversibilité variable et non garantie.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener noreferrer">Consulter la source — Berlot, Pavlović, Kojović ; Frontiers in Neurology, Ljubljana</a></p></template>
<template data-pop="g22-r12" data-k="g22-r12"><h3>[12] Manuel de codage médical, version 2026</h3><p>Étiologie dague prioritaire, suivie immédiatement de manifestation étoile ; code étoile jamais seul. Définition du diagnostic supplémentaire et règles de diagnostic principal restent applicables. Les associations ne se généralisent pas à tous les couples cause-manifestation hors système.</p><p><b>Passages lus :</b> Présentation officielle et D03m codes dague-étoile, page 34. <b>Version :</b> 2026, publié 30septembre 2025,544-2600. <b>Limites :</b> Règle ciblée lue, pas audit de facturation ni totalité du manuel 2026 et de ses mises à jour.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/36144082/master" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la statistique</a></p></template>
<template data-pop="g22-r13" data-k="g22-r13"><h3>[13] Guide de la déclaration obligatoire 2026 : syphilis</h3><p>Critères cliniques et laboratoire détaillés, délai 1semaine. Médecin adresse formulaire au médecin cantonal ; laboratoire analyse positive spécifique déclare électroniquement à OFSP. RPR/VDRL isolés sans confirmation spécifique ne constituent pas les résultats laboratoire à déclarer dans cette rubrique. Syphilis environ 12/100000 et près 90 % d’hommes indiqués dans guide, pas données G22. Dépistage VIH/autres infections et partenaires selon situation.</p><p><b>Passages lus :</b> Page web responsabilités puis guide avant-propos et page 109 syphilis. <b>Version :</b> 2026, document lié 5février 2026. <b>Limites :</b> Lecture par service web aprèsaccès au documentdirect 503 ; pas contournement. Pas toutes les définitions de surveillance des pages 110–111 lues ; statistiques ne sont ni incidence neurosyphilis ni incidence G22.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.bag.admin.ch/dam/fr/sd-web/MDjbgfEN6jEf/guide-de-la-declaration-obligatoire.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — Office fédéral de la santé publique</a></p></template>
<template data-pop="g22-r14" data-k="g22-r14"><h3>[14] Ceftriaxon Labatec : information professionnelle</h3><p>Ceftriaxon Labatec dose adulte générale 1–2 g/j avec possibilité 4 g/j pour infections graves. Sous 10 ml/min ou dialyse maximum 2 g/j ; restrictions de mélange/calcium et allergies propres au produit. Inhibition de la paroi bactérienne.</p><p><b>Passages lus :</b> Lecture Sol G06 composition, dose adulte, rein/foie, calcium, mécanisme et date, réellement réutilisée G07/G08 puis G22. <b>Version :</b> Juin 2025. <b>Limites :</b> Pas de nouvelle lecture intégrale ; durée 14 jours et indication neurosyphilis viennent du guide DGN 2026 et non d’une dose universelle de FI.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener noreferrer">Consulter la source — Swissmedic, information professionnelle via AmiKo</a></p></template>
<template data-pop="g22-r15" data-k="g22-r15"><h3>[15] PROFILES 2017 : situations neurologiques</h3><p>Correspondance pédagogique locale avec troubles de marche, mouvements et cognition ; la leçon fait raisonner cause, signes et urgence.</p><p><b>Passages lus :</b> Listes situations cliniques 96–105 réellement relues : équilibre/chutes, marche, mouvements involontaires/tremblement, parole, cognition, parésie et crises. <b>Version :</b> 2017. <b>Limites :</b> Pas une nouvelle table officielle CIM-PROFILES 2026 ni une promesse de contenu d’examen.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener noreferrer">Consulter la source — PROFILES, objectifs nationaux suisses</a></p></template>
<template data-pop="g22-r16" data-k="g22-r16"><h3>[16] Gray 764 : voie motrice et droits de l’original</h3><p>Voie motrice corticospinale historique normale, étiquettes cortex, capsule interne, décussation et faisceaux. Sert à distinguer force et lenteur ; aucune maladie de patient ni représentation des réseaux dopaminergiques.</p><p><b>Passages lus :</b> Page de droits : auteur, source 1918, reproduction mécanique et domaine public ; pixels originaux affichés et inspectés. <b>Version :</b> 1918, droits réinspectés 2 novembre 2026. <b>Limites :</b> Image historique schématique, pas imagerie opératoire ; annotations françaises adjacentes ajoutées, pixels inchangés, aucune validation médicale humaine.</p><p>Lecture ciblée attribuée à Sol, consultation ou réutilisation explicitée dans le journal du 2 novembre 2026. Une heure de journalisation ne mesure pas une lecture intégrale.</p><p><a data-reference-source href="https://commons.wikimedia.org/wiki/File:Gray764.png" target="_blank" rel="noopener noreferrer">Consulter la source — Gray, Anatomy of the Human Body ; illustration Henry Vandyke Carter, Commons</a></p></template>
