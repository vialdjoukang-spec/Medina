<p>Une femme de 27 ans, <b>vignette fictive</b>, consulte pour un ralentissement des gestes, une raideur des membres et une parole devenue pâteuse. Elle a un antécédent d’anomalies hépatiques non explorées. Le tableau moteur ressemble à celui d’une maladie de Parkinson, mais l’âge, la dysarthrie et le terrain hépatique sortent du cadre habituel. La question pratique est donc la suivante : <b>une maladie générale ou une lésion cérébrale identifiable explique-t-elle ce parkinsonisme, et peut-on la traiter ?</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p>Cette question prime parce que beaucoup de parkinsonismes secondaires régressent quand la cause est supprimée, et que d’autres bénéficient d’un traitement symptomatique. Une imagerie cérébrale anormale chez un patient parkinsonien suggère une étiologie secondaire et impose une démarche propre. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="key"><b>À retenir.</b> Le code <b>G22*</b> ne désigne pas une maladie, mais la <b>manifestation parkinsonienne</b> d’une maladie décrite ailleurs. Le cours porte donc sur les maladies causales dont le parkinsonisme est une expression, et sur la démarche qui les démasque.</div>
</section>

<section class="ilot" id="g22-1"><h2><span class="n">1</span>Définitions et codage</h2>
<h3>1.1 Parkinsonisme et parkinsonisme secondaire</h3>
<p>Le <button class="w" data-k="g22-parkinsonisme">parkinsonisme (définition clinique et critères MDS)</button> est une bradykinésie associée à une rigidité, à un tremblement de repos, ou aux deux. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">(Postuma et collaborateurs 2015)</a> Le parkinsonisme <b>secondaire</b> est un parkinsonisme d’origine identifiable, ni génétique ni dégénératif. La cause iatrogène y est la plus fréquente ; elle relève du code G21 et fait l’objet d’une autre leçon. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p>Deux tableaux sémiologiques se distinguent. Les formes <b>métaboliques et toxiques</b> donnent une bradykinésie et une rigidité symétriques, avec un trouble marqué de la marche et peu ou pas de tremblement de repos. Les lésions <b>expansives et vasculaires</b> sont plutôt unilatérales et peuvent comporter un tremblement de repos. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> Cette distinction guide l’examen, sans remplacer l’imagerie, car la rigidité, la bradykinésie et les troubles de la marche sont plus fréquents que le tremblement de repos, et d’autres mouvements anormaux ou signes neurologiques associés orientent vers la cause. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<h3>1.2 Le code G22* de la CIM-10-GM 2024</h3>
<p>Le tableau suivant résume ce que la classification établit. Il se lit ligne par ligne : la dernière ligne conditionne l’usage du code dans tout dossier.</p>
<table class="t"><thead><tr><th>Élément</th><th>Contenu</th></tr></thead><tbody>
<tr><td>Libellé</td><td>« Syndrome parkinsonien au cours de maladies classées ailleurs » (OFS) ; « Parkinson-Syndrom bei anderenorts klassifizierten Krankheiten » (BfArM) <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">(OFS, CIM-10-GM 2024)</a></td></tr>
<tr><td>Subdivision</td><td>Aucune : G22* est une catégorie à trois caractères <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a></td></tr>
<tr><td>Inclusion</td><td>Syndrome parkinsonien au cours de la syphilis, codée A52.1† <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a></td></tr>
<tr><td>Exclusions et notes</td><td>Aucune sous G22* <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a></td></tr>
<tr><td>Règle de l’astérisque</td><td>Le code astérisque désigne la manifestation. Il ne s’emploie jamais seul, mais avec un code dague (étiologie) ou un autre code primaire <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">(BfArM, structure des codes)</a></td></tr></tbody></table>
<p>Le <button class="w" data-k="g22-codage">système dague-astérisque (étiologie et manifestation)</button> impose donc d’écrire d’abord la maladie causale, puis le parkinsonisme qui en découle. Dans la classification, la seule causalité nommée est la syphilis. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> Les voisins sont G20, la maladie de Parkinson, et G21, le parkinsonisme secondaire par médicaments, agents externes, séquelle d’encéphalite ou cause vasculaire. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a></p>
<div class="trap"><span class="k">Piège</span> Le libellé de G22* ne dresse pas la liste des maladies à rechercher. La classification ne nomme que la syphilis ; les autres causes de ce cours proviennent de la littérature clinique, et leur rattachement exact à G22* n’a pas été vérifié à la source. La règle suisse de codage des couples dague-astérisque n’a pas non plus été lue ; seule la règle allemande du BfArM est citée. <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">(BfArM, structure des codes)</a></div>
<div class="key"><b>À retenir.</b> G22* est une manifestation, jamais un diagnostic isolé. Un dossier qui porte G22* sans code étiologique est incomplet.</div>
<button class="pareto-btn ui" data-k="pareto-g22-definition">▲ Loi de Pareto — Définitions et codage</button>
</section>

<section class="ilot" id="g22-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>En Suisse, l’étude populationnelle de Fleury et collaborateurs a recensé 1235 patients parkinsoniens dans le canton de Genève (diagnostics 2003–2012). Quatre-vingts pour cent avaient un parkinsonisme dégénératif et <b>20 %</b> un parkinsonisme non dégénératif. Parmi ces derniers, 43,4 % étaient médicamenteux, 37 % vasculaires, 5,1 % dus à une hydrocéphalie à pression normale et 3,8 % psychiatriques ou fonctionnels. <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Fleury et collaborateurs 2018)</a> Le <button class="w" data-k="g22-geneve">résumé genevois (limites de lecture)</button> ne détaille pas le dixième restant : la part des causes « classées ailleurs » n’est donc pas connue.</p>
<p>Les fréquences propres aux causes proviennent de séries de cas et de revues, avec des dénominateurs variables. Le tableau les réunit ; chaque ligne indique la population de référence, car un pourcentage sans dénominateur ne se compare pas.</p>
<table class="t"><thead><tr><th>Cause</th><th>Donnée lue</th><th>Source</th></tr></thead><tbody>
<tr><td>Parkinsonisme après AVC</td><td>6 parkinsonismes parmi 56 séquelles motrices anormales sur 1500 AVC ; 1 parkinsonisme sur 11 infarctus striataux parmi 622 AVC consécutifs</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Dégénérescence hépatocérébrale acquise</td><td>1 à 2 % des insuffisances hépatiques chroniques ou shunts porto-systémiques</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Calcifications des noyaux gris</td><td>0,2 à 2 % des scanners de routine, près de 40 % à 70 ans ; une calcification pallidale isolée est habituellement sans portée</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Hypoparathyroïdie</td><td>Parkinsonisme = trouble moteur le plus fréquent sur 223 cas revus ; délai diagnostique moyen environ 10 ans</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Neurocysticercose</td><td>Parkinsonisme = trouble moteur le plus fréquent sur 590 patients, mais inférieur à 3 %</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Lupus ; syndrome des antiphospholipides</td><td>Environ 40 cas publiés ; 9 cas</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Maladie de Wilson</td><td>Prévalence génétique environ 1/30 000 ; hétérozygotes 1/40 à 1/90 ; prévalence clinique française environ 1,5/100 000</td><td><a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> <a href="https://archive-ouverte.unige.ch/unige:45348" target="_blank" rel="noopener">(Chilcott-Lauber et collaborateurs 2005 (résumé))</a></td></tr>
<tr><td>Maladie de Creutzfeldt-Jakob en Suisse</td><td>10 à 15 cas par an, tous de forme classique ; aucun variant déclaré à ce jour</td><td><a href="https://www.bag.admin.ch/fr/maladie-de-creutzfeldt-jakob-mcj" target="_blank" rel="noopener">(Office fédéral de la santé publique, maladie de Creutzfeldt-Jakob)</a></td></tr>
<tr><td>Syphilis</td><td>Allemagne 2024 : 9519 cas, soit 11,2 pour 100 000 ; incidence suisse non lue</td><td><a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> Ces chiffres ne s’additionnent pas et ne se transposent pas à la Suisse. Les séries de cas surestiment la fréquence de la cause étudiée parmi les parkinsonismes ; seul le résultat genevois repose sur une population définie. <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Fleury et collaborateurs 2018)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></div>
<div class="key"><b>À retenir.</b> Un parkinsonisme sur cinq est non dégénératif à Genève, et la majorité de ceux-là est médicamenteuse ou vasculaire. Les causes de G22* sont rares, mais ce sont celles qu’on peut guérir ou freiner.</div>

</section>

<section class="ilot" id="g22-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le parkinsonisme naît de l’atteinte de la <b>voie nigrostriée</b>, de la substance noire <i>pars compacta</i> vers le striatum, ou des noyaux gris situés en aval, le pallidum et le putamen. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> Plus de 90 % des localisations lésionnelles qui provoquent un parkinsonisme sont connectées au mésencéphale, aux noyaux gris centraux, au cortex cingulaire antérieur et au cervelet ; la connectivité avec le <b>claustrum</b> est la plus sensible et la plus spécifique. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<h3>3.1 La règle qui commande le traitement</h3>
<p>La <button class="w" data-k="g22-levodopa-regle">règle présynaptique et post-synaptique</button> relie le siège de la lésion à la réponse à la lévodopa. Celle-ci est surtout efficace quand la lésion est <b>présynaptique, nigrostriée et isolée</b>, parce que les récepteurs striataux sont intacts et peuvent encore recevoir la dopamine produite. Elle l’est rarement quand la lésion touche le striatum ou le pallidum, car la cible du médicament est détruite. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> Un hématome sous-dural, une tumeur comprimante, une intoxication au monoxyde de carbone, un lupus ou un syndrome des antiphospholipides rendent ainsi la lévodopa habituellement inefficace. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<h3>3.2 Mécanismes selon la cause</h3>
<table class="t"><thead><tr><th>Cause</th><th>Mécanisme lu</th><th>Conséquence</th></tr></thead><tbody>
<tr><td>Maladie de Wilson</td><td>Déficit du transporteur <button class="w" data-k="g22-wilson">ATP7B</button> : l’excrétion biliaire du cuivre diminue, le cuivre s’accumule dans le foie puis dans le cerveau. <a href="https://archive-ouverte.unige.ch/unige:45348" target="_blank" rel="noopener">(Chilcott-Lauber et collaborateurs 2005 (résumé))</a> Dans le cerveau, le cuivre est multiplié par environ 10 ; il entraîne une toxicité mitochondriale, un stress oxydatif et une atteinte membranaire. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></td><td>Lésions maximales dans le putamen ; lésions pré- et post-synaptiques, donc réponse variable à la lévodopa <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></td></tr>
<tr><td>Dégénérescence hépatocérébrale acquise</td><td>Accumulation de <button class="w" data-k="g22-manganese">manganèse</button>, surtout pallidale <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td><td>Hypersignal T1 pallidal ; DaTSCAN habituellement normal <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Hydrocéphalie obstructive</td><td>Parkinsonisme rare, mois ou années après la présentation, souvent après des dysfonctions répétées de dérivation <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td><td>Excellente réponse à la dérivation <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Tumeurs</td><td>Compression (masse, œdème), infiltration, compression mésencéphalique, déconnexion des circuits noyaux gris–cortex, hydrocéphalie <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td><td>Réversible si la cause est une compression, non si elle est une infiltration <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Fistule durale artério-veineuse</td><td>Hypoperfusion des noyaux gris ou trouble du drainage veineux profond <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td><td>Angiographie de référence <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr></tbody></table>
<p>Dans la maladie de Wilson, la barrière protectrice cède par étapes. Les astrocytes et les oligodendrocytes tamponnent d’abord le cuivre ; quand leur capacité est dépassée, la barrière hémato-encéphalique se rompt et la démyélinisation s’installe. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> Cette séquence explique deux faits cliniques : l’atteinte neurologique est plus tardive que l’atteinte hépatique, et elle s’accompagne souvent déjà d’une cirrhose, constatée chez environ la moitié des patients neurologiques au diagnostic. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<div class="key"><b>À retenir.</b> Le siège de la lésion, présynaptique ou post-synaptique, prédit la réponse à la lévodopa et la réversibilité. Le mécanisme de chaque cause dicte donc le traitement avant même que le nom de la cause soit connu.</div>
<button class="pareto-btn ui" data-k="pareto-g22-meca">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g22-4"><h2><span class="n">4</span>Causes et classification</h2>
<p>La revue de Ljubljana, qui exclut les formes médicamenteuses, classe les causes en huit groupes. Le tableau les réunit avec des exemples ; la maladie de Wilson et la neurosyphilis, absentes ou marginales dans cette revue, y sont ajoutées à partir d’autres sources. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<table class="t"><thead><tr><th>Groupe</th><th>Exemples lus</th></tr></thead><tbody>
<tr><td>Vasculaire</td><td>Parkinsonisme après AVC aigu ; parkinsonisme vasculaire progressif ; fistules durales artério-veineuses <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Hydrocéphalie</td><td>Obstructive ; <button class="w" data-k="g22-hpn">à pression normale idiopathique</button> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Lésions expansives</td><td>Tumeurs (compression, infiltration gliale ou lymphomateuse, craniopharyngiome mésencéphalique) ; <button class="w" data-k="g22-hematome">hématome sous-dural</button> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td><button class="w" data-k="g22-metabolique">Métabolique (fiches par cause)</button></td><td>Dégénérescence hépatocérébrale acquise ; encéphalopathie urémique diabétique ; hypocalcémie et hypoparathyroïdie avec calcifications des noyaux gris ; myélinolyse osmotique ; hyperglycémie non cétosique <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <b>maladie de Wilson</b> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></td></tr>
<tr><td>Hypoxo-ischémique</td><td>Nécrose pallidale et striatale <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Toxique</td><td>Méthanol, monoxyde de carbone, cyanure, disulfure de carbone et disulfirame, manganèse, MPTP, drogues ; ces formes relèvent du code G21.2 et de la leçon G21 <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Infectieux</td><td>Encéphalite japonaise, virus West Nile, VIH, SARS-CoV-2, <i>Mycoplasma pneumoniae</i>, neurocysticercose, toxoplasmose, cryptococcose, HHV-6, Creutzfeldt-Jakob <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <b>neurosyphilis</b> <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></td></tr>
<tr><td>Immun</td><td>Encéphalites paranéoplasiques et auto-immunes (anti-Ma2, anti-Ri, CRMP5, NMDAR, LGI1, CASPR2, IgLON5) ; lupus, syndrome des antiphospholipides, Sjögren ; sclérose en plaques <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> La syphilis n’est pas mentionnée dans la revue de Ljubljana, et la ligne directrice sur la neurosyphilis ne décrit pas le parkinsonisme en propre : seuls un tremblement de la langue et un tremblement de la mimique figurent dans la paralysie générale. Aucune source lue ne décrit la sémiologie du parkinsonisme syphilitique. Le lien avec G22* repose sur la classification, non sur une description clinique. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></div>
<h3>4.1 Terrain qui oriente</h3>
<div class="two"><div class="card"><h4>Terrain métabolique ou hépatique</h4><p>Une hépatopathie ou un shunt porto-systémique évoque la dégénérescence hépatocérébrale acquise ; un sujet jeune avec hépatopathie ou troubles psychiatriques évoque la maladie de Wilson. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p></div><div class="card"><h4>Terrain infectieux, tumoral ou immun</h4><p>Une infection sexuellement transmissible ou une infection par le VIH évoque la neurosyphilis ; un cancer connu évoque une cause paranéoplasique ou une compression ; une correction récente de la natrémie évoque une myélinolyse osmotique. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p></div></div>
<div class="key"><b>À retenir.</b> Huit groupes de causes couvrent le champ. Le groupe se devine à l’âge, au terrain et au rythme d’installation, avant que l’imagerie ne le confirme.</div>
<button class="pareto-btn ui" data-k="pareto-g22-causes">▲ Loi de Pareto — Causes et classification</button>
</section>

<section class="ilot" id="g22-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire commence par exclure les causes du code G21 : médicaments et toxiques, antécédents d’encéphalite et de traumatisme crânien. <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger 2018)</a> Il fixe ensuite le <b>rythme d’installation</b>, car chaque rythme correspond à des causes différentes. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<table class="t"><thead><tr><th>Rythme</th><th>Causes évoquées</th></tr></thead><tbody>
<tr><td>Aigu</td><td>AVC, myélinolyse osmotique, encéphalopathie urémique, hypoxie <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Subaigu</td><td>Hématome sous-dural, neurocysticercose, encéphalite auto-immune <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr>
<tr><td>Chronique</td><td>Hydrocéphalie à pression normale, maladie de Wilson, hépatopathie <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></td></tr></tbody></table>
<p>Le terrain complète le rythme : hépatopathie ou shunt, âge jeune, troubles psychiatriques, infection sexuellement transmissible, VIH, cancer connu, correction récente de la natrémie. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a> Le rôle de l’anticoagulation ou d’une chute dans l’hématome sous-dural est classique, mais il n’a pas été vérifié dans les sources lues et ne sert ici que de rappel d’examen.</p>
<div class="key"><b>À retenir.</b> Deux questions suffisent pour orienter : depuis quand, et sur quel terrain. Le rythme sépare les causes aiguës des causes chroniques ; le terrain nomme la cause probable.</div>
</section>

<section class="ilot" id="g22-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen confirme d’abord le parkinsonisme : bradykinésie avec décrément, associée à une rigidité et ou à un tremblement de repos. <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger 2018)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">(Postuma et collaborateurs 2015)</a> Il décrit ensuite la <b>symétrie</b>, la prédominance axiale ou aux membres inférieurs, et la présence ou l’absence de tremblement de repos, car ces éléments séparent les causes métaboliques et toxiques (symétriques) des lésions expansives et vasculaires (plutôt unilatérales). <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="two"><div class="card"><h4>Signes qui orientent vers la cause</h4><p>Anneau de Kayser-Fleischer, dystonie et dysarthrie : maladie de Wilson. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> Anomalies pupillaires et troubles cognitifs : neurosyphilis. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a> Paralysie verticale du regard : hydrocéphalie obstructive, anti-Ma2, CRMP5. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p></div><div class="card"><h4>Autres signes d’alerte</h4><p>Myoclonies et déclin rapide : prions. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> Signes pyramidaux et céphalées : hématome sous-dural. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> Cécité : méthanol. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p></div></div>
<p>Les <button class="w" data-k="g22-drapeaux">drapeaux rouges contre la maladie de Parkinson</button> signalent qu’une autre cause est probable : chutes précoces, dysautonomie précoce, syndrome cérébelleux, syndrome pyramidal, troubles oculomoteurs, troubles cognitifs précoces, parkinsonisme symétrique à prédominance des membres inférieurs. <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, Hôpitaux universitaires de Genève 2018)</a></p>
<div class="key"><b>À retenir.</b> Un parkinsonisme symétrique, axial, sans tremblement de repos, ou accompagné d’un signe étranger à la maladie de Parkinson, impose de chercher la cause avant d’étiqueter la maladie.</div>
