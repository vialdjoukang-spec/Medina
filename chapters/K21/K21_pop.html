<template data-pop="pareto-k21-clinique" data-title="Loi de Pareto — Reflux et Barrett"><p class="ratio" data-cover="k21-1,k21-5,k21-6,k21-8,k21-9,k21-12"></p><ul><li>Le reflux devient pathologique quand il cause des symptômes gênants ou des lésions.</li><li>Symptômes typiques sans alarme : IPP d’épreuve ; alarme ou échec : endoscopie.</li><li>La preuve repose sur un grade B, C ou D de Los Angeles, un Barrett, une sténose ou une exposition acide > 6 %.</li><li>Réfractaire après 8 semaines de dose double : pH-impédancemétrie et manométrie.</li><li>Le reflux non compliqué se traite à la demande, alors que les grades C et D et la sténose demandent un traitement continu.</li><li>Le Barrett se surveille tous les 5 ans (1 à < 3 cm) ou tous les 3 ans (3 à < 10 cm).</li></ul></template>
<template data-pop="pareto-k21-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k21-e-1,k21-e-2,k21-e-3"></p><ul><li>L’endoscopie s’impose en cas d’alarme, d’échec ou de symptômes anciens.</li><li>Sans IPP, la pH-métrie est pathologique au-delà de 6 % d’exposition acide et normale en dessous de 4 %.</li><li>pH-impédancemétrie sous IPP pour le reflux réfractaire.</li><li>La manométrie à haute résolution précède toute chirurgie.</li><li>La classification de Prague mesure C et M en centimètres.</li></ul></template>
<template data-pop="pareto-k21-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k21-p-1,k21-p-2,k21-p-3"></p><ul><li>L’IPP se prend environ 1 heure avant le repas, et l’alginate après.</li><li>Ésoméprazole 40 mg/j 4 à 8 semaines pour l’œsophagite, 20 mg/j en entretien.</li><li>Le reflux réfractaire reçoit une dose double en deux prises pendant 8 semaines.</li><li>L’association du clopidogrel à l’ésoméprazole est déconseillée.</li><li>Arrêter l’IPP quand l’indication disparaît.</li></ul></template>
<template data-pop="k21-alarme" data-title="Signes d’alarme du reflux"><p class="lab">Liste (S2k 2023)</p><p>Les signes d’alarme sont la dysphagie, l’odynophagie, les signes d’hémorragie digestive y compris l’anémie ferriprive, l’anorexie, la perte de poids involontaire, les vomissements répétés et les antécédents familiaux de tumeur digestive.</p><p class="lab">Conduite</p><p>Ils imposent une endoscopie immédiate, sans traitement d’épreuve préalable, car un cancer ou une complication doit être exclu.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-los-angeles" data-title="Classification de Los Angeles"><p class="lab">Grade A</p><p>Une ou plusieurs lésions ≤ 5 mm, ne reliant pas le sommet de deux plis.</p><p class="lab">Grade B</p><p>Au moins une lésion > 5 mm, ne reliant pas le sommet de deux plis.</p><p class="lab">Grade C</p><p>Lésions reliant le sommet de deux plis ou plus, sur moins de 75 % de la circonférence.</p><p class="lab">Grade D</p><p>Lésions sur au moins 75 % de la circonférence.</p><p class="lab">Valeur</p><p>Selon Lyon 2.0, les grades B, C et D sont concluants, alors que la S2k 2023 ne retient que les grades C et D.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-barrett" data-title="Œsophage de Barrett"><p class="lab">Définition</p><p>L’épithélium malpighien de l’œsophage distal est remplacé sur au moins 1 cm par un épithélium cylindrique avec métaplasie intestinale.</p><p class="lab">Risque</p><p>Il progresse vers une dysplasie de haut grade ou un adénocarcinome chez 0,3 à 0,8 % des patients par an (ESGE 2023).</p><p class="lab">Conduite</p><p>On le biopsie selon le protocole, on le surveille selon sa longueur et on traite la dysplasie par voie endoscopique.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p><figure><img src="data:image/gif;base64,R0lGODlhCAJrAYUAAO/y8uzv7+zs7Ofs6+rn6Obn5eXm5eHm5ejf4+Te4eLf3+Df397g393b3dnc3tfY3OPU2t7U2dvT2dfU3NbT09/L09rK0tjK0tXL09XFztLS2NLK0s3N1cvI0NDF0s/EycfEzda+ydC9yM29yMi9y8i7ws21wcytu8WwvsG5xMGxvbu0wbKzwr6qu72osq+ouL+gsbKgsLuVqbCTpqScr6OPpJOVq46JoZKBmoxyjm9zkGRigVtQcj9FajQtUxoaQyH+HEFDRCBTeXN0ZW1zIERpZ2l0YWwgSW1hZ2luZwAALAAAAAAIAmsBQAj/ACkIHChwg0GBDxoQJPig4YSGDiI+kBjRAYOLBzAyOMCx40YDBwoYGHkAZMeMHEeCHDCg5IEFCjZuLPCSZkcDBFayNNCSJc2WB1gOEBA06IACBYQOCCBSKAGWAVgCEBog6oCVUbMeEFA1KkeqVqkKAGC16tClAcimBaA2AFe2ad0CEDAA7tS6cLPOFUD3aVoCSZO6XVqAK1qWT43SPWp4qIACBPj29WmALl+ykfkuJZB5sVK+gHcitSwAsM6UIwssKNHAgAKkKkUagK1gpIKUCmDWVkngQG0Fr2sjrc1AONKSwJMvYICUQYPdwJfn1v1cQYMI0RVGgADBeoQGMA0s/3CwAPyC8hYbqNdO4TmDhuAnMnCg3rn65c7bX1eoP/d1CthFIFADEGTgQg487NBDDzqsUEIJC1HwQIQUfPBBQR+UcGFBG1joYYYuhEihhBM98NCEDUE0X0UXRWReAx5xdNF7DmRU3EkumYTjjkXxqJIBH80m5EwmzcaZSEbxNJJSLNFVGGI8MalUWFTdVZZQoEFFVpNmMUnWl3l1lRdabIHZ1ZltrTVVXGmVBtljXFX1pV5ZDabUnHJ <template data-pop="k21-rgo-def" data-title="Maladie de reflux gastro-œsophagien"><p class="lab">Définition (S2k 2023, énoncé 1.1)</p><p>Reflux du contenu gastrique qui provoque des symptômes gênants ou des lésions de l’œsophage.</p><p class="lab">Définition « actionnable » (Lyon 2.0)</p><p>Le reflux est « actionnable » quand l’endoscopie ou la pH-métrie apporte une preuve objective associée à des symptômes compatibles.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-preuve" data-title="Preuve objective du reflux"><p class="lab">Endoscopie</p><p>L’endoscopie prouve le reflux quand elle montre une œsophagite de grade B, C ou D, un Barrett histologique ou une sténose peptique.</p><p class="lab">pH-métrie sans IPP</p><p>Temps d’exposition acide > 6 %.</p><p class="lab">Ce qui ne prouve pas</p><p>La réponse aux IPP ne prouve pas le reflux (S2k 2023, énoncé 1.3), et les biopsies ne le prouvent pas dans la maladie non érosive.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-oesophagite" data-title="Œsophagite érosive"><p class="lab">Définition</p><p>Ce sont des pertes de substance de la muqueuse œsophagienne distale, visibles à l’endoscopie.</p><p class="lab">Classification</p><p>On la classe de A à D selon Los Angeles.</p><p class="lab">Traitement</p><p>On donne un IPP à dose pleine pendant 4 à 8 semaines, puis un traitement continu pour les grades C et D, car ils récidivent et se compliquent.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhCAKGAYYAAN6VttyMrduLqeCGpNSGoN6Am9d/mtJ/l7yPn8OEmcuBl7qBlMl9krh9kNl4ktN4kM53j8h3kMd2hb93j792hr51f7Z2haZ1hMpwhchqfsFsf7xuhLttebtmeLNthLNsebJrdLNkd7Fjb6ZthahsdqdkdqZgc6dlaqZgaaZeaZxrfJxhdZxhZpRlcYZlaa9aaadZZqRaaaNYYaBZaJ9XX5tbZ5tWZZNaaZNWZ5pYXppUXZJXXaRRXp1RXJpRXJJRYpJRW5JQVppMV5BMVZNGT4hSXYhMVohIU4dGSoFJU3RHTXM7QDolJQUPBwUKCgUKBgUKBAENBQ0FDAYIBwUHDAQICQUGCAQIBwQJBQQJAwUGBAIIDQIJCQMHCAIIBAEDAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAACAKGAUAI/wCnCBxIsKDBgwgTKlzIsCHDK1m8ZBGopaLFixgtTql45YqXjiBDXjGIsSPBKxxFYsFyhQuXLS6vYJEYUYtJgSMHXqlixUqXLiCfPJmCRUuXnj0JFtUy04tTmlmiWnzqBYuTmS6rcOkyBQoULQKxCGVJNaIXKGazoPXyhAtIJ1VCOv3C1snWLlyeRnUaNWJfqjZHohRs5YqVjWB1Gq1S5SfZtx0rUowqFgrLjiy7rFzKFOPGvmY/giTqefPmjl4Co9RyeKPTJ3W/5BztsLbt2xQ94yZquvdpkcBl+h5O3HRw4MVNNxyK0wsXJ1akMFmiJIkRI0mya09SpMj1I0e2Y//XDh789e7WjXT3rn699+7X438vf2QIEB1AgPywwf+Hjh9ABDGEfdcBscMOAQahoBFBHLiegAMOKJ98QxhxBBIYIhEEEkdYyGB8GYZIH4MRDtHhdSJ2WGF29CGxBIcmcnghEgO2GGKG9JWH44w39rjEjz9a98MO3mVXXRJKKNFjfTWO2B4Q3UH5w5RU4nBDDTdkqeWWN1h5gwstbNnCmGRqSeaZaLbgwppgksnmm0kykUUUfEHRBGyXgZTcnnz26eefgIIm6KCEgtZnoYgWSpITGw0FhRSQMnFkEdtt596lmGbn3pQ44DDlgfkFkV9+JZZqqn0GHqjqgTjs4AKRRYz/Kmt+CKaqK <template data-pop="k21-nerd" data-title="Maladie de reflux non érosive"><p class="lab">Définition</p><p>Le patient a des symptômes typiques et un reflux pathologique en pH-métrie, sans lésion endoscopique.</p><p class="lab">Piège</p><p>Les biopsies ne permettent pas ce diagnostic (S2k 2023, énoncé 1.9).</p><p class="lab">Traitement</p><p>Guidé par les symptômes, souvent à la demande.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-obesite" data-title="Surpoids et reflux"><p class="lab">Mécanisme</p><p>La pression abdominale augmente et favorise la hernie hiatale.</p><p class="lab">Preuve</p><p>Dans l’étude HUNT citée par la S2k, la perte de poids améliorait les symptômes, proportionnellement à la baisse de l’indice de masse corporelle.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-hernie" data-title="Hernie hiatale"><p class="lab">Par glissement</p><p>La jonction œsogastrique remonte dans le thorax ; la barrière anti-reflux s’affaiblit.</p><p class="lab">Para-œsophagienne</p><p>L’estomac s’engage à côté de l’œsophage et risque un volvulus ; c’est pourquoi on opère si elle est symptomatique (S2k 2023, recommandation 3.8).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-jog" data-title="Jonction œsogastrique"><p class="lab">Repère endoscopique</p><p>La jonction se situe au sommet des plis gastriques, vue sans insufflation excessive ni péristaltisme (S2k 2023, recommandation 4.4).</p><p class="lab">Ligne Z</p><p>La ligne Z est la limite visible entre la muqueuse malpighienne pâle et la muqueuse cylindrique rouge ; normalement, elle se situe au niveau de la jonction.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-metaplasie" data-title="Métaplasie intestinale"><p class="lab">Définition</p><p>Un épithélium est remplacé par un épithélium de type intestinal, qui contient des cellules caliciformes.</p><p class="lab">Signification</p><p>Elle définit le Barrett et précède la dysplasie.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-pyrosis" data-title="Pyrosis"><p class="lab">Définition</p><p>Le pyrosis est une brûlure rétrosternale ascendante, qui survient souvent après les repas ou en décubitus.</p><p class="lab">Valeur</p><p>Symptôme typique du reflux, mais insuffisant pour en prouver la nature pathologique.</p><p class="lab">Piège</p><p>Une douleur thoracique impose d’exclure d’abord une cause cardiaque.</p></template>
<template data-pop="k21-regurgitation" data-title="Régurgitation"><p class="lab">Définition</p><p>La régurgitation est une remontée sans effort de contenu gastrique dans la bouche, sans nausée.</p><p class="lab">Diagnostic différentiel</p><p>Rumination, achalasie (régurgitation d’aliments non digérés).</p></template>
<template data-pop="k21-epreuve" data-title="Traitement d’épreuve par IPP"><p class="lab">Indication</p><p>On le propose en cas de symptômes typiques, sans signe d’alarme, sans antécédent familial de cancer digestif haut et sans facteur de risque de complication (S2k 2023, recommandation 2.3).</p><p class="lab">Durée</p><p>Il dure 4 à 8 semaines en dose standard.</p><p class="lab">Échec</p><p>Après 8 semaines bien conduites : exploration (recommandation 2.5).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-phmetrie" data-title="pH-métrie œsophagienne"><p class="lab">Technique</p><p>Capteur de pH placé dans l’œsophage distal pendant 24 heures (sonde) ou jusqu’à 96 heures (capsule sans fil).</p><p class="lab">Condition</p><p>Sans IPP pour prouver le reflux ; sous IPP pour explorer un reflux réfractaire prouvé.</p><p class="lab">Seuils (Lyon 2.0)</p><p>Un temps d’exposition acide > 6 % est pathologique, alors qu’un temps < 4 % est normal.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-lyon" data-title="Consensus de Lyon 2.0"><p class="lab">Nature</p><p>Consensus international d’experts sur le diagnostic moderne du reflux, publié dans Gut en 2024.</p><p class="lab">Apports</p><p>Lyon 2.0 rend concluant le grade B de Los Angeles, fixe les seuils de la pH-métrie et introduit la notion de reflux « actionnable ».</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-mesures" data-title="Mesures générales"><p class="lab">Efficaces</p><p>La perte de poids, la tête du lit surélevée en cas de symptômes nocturnes, l’absence de repas tardif et l’arrêt du tabac chez le patient de poids normal sont efficaces.</p><p class="lab">Plausibles</p><p>Le décubitus latéral gauche, la respiration abdominale et l’absence de vêtements serrés sont plausibles, mais moins prouvés.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-alginate" data-title="Alginates (Gaviscon®)"><p class="lab">Composition</p><p>Gaviscon® contient de l’alginate de sodium, du bicarbonate de sodium et du carbonate de calcium.</p><p class="lab">Mécanisme</p><p>Formation d’un radeau visqueux qui flotte sur le contenu gastrique et limite le reflux.</p><p class="lab">Posologie suisse</p><p>2 à 4 comprimés à croquer après les repas et au coucher, jusqu’à 4 fois par jour.</p><p class="lab">Précaution</p><p>Chaque comprimé apporte environ 63 mg de sodium, ce qui compte chez l’insuffisant cardiaque ou rénal.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Gaviscon®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k21-refractaire" data-title="Reflux réfractaire"><p class="lab">Définition (S2k 2023)</p><p>Réponse insuffisante après au moins 8 semaines d’IPP à double dose (1-0-1).</p><p class="lab">Causes</p><p>Mauvaise observance, reflux persistant, hypersensibilité, trouble fonctionnel, œsophagite à éosinophiles, autre diagnostic.</p><p class="lab">Conduite</p><p>On fait une endoscopie avec biopsies, une pH-impédancemétrie et une manométrie, car il faut prouver le reflux et écarter un autre diagnostic.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-eoe" data-title="Œsophagite à éosinophiles"><p class="lab">Définition</p><p>C’est une inflammation chronique de l’œsophage d’origine immuno-allergique, avec un infiltrat éosinophile.</p><p class="lab">Indice</p><p>Une dysphagie, des impactions alimentaires ou un reflux réfractaire doivent la faire évoquer.</p><p class="lab">Diagnostic</p><p>Biopsies étagées de plusieurs niveaux de l’œsophage (S2k 2023, recommandation 1.10).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-impedance" data-title="pH-impédancemétrie"><p class="lab">Principe</p><p>Mesure de l’impédance électrique, qui détecte le passage du bol refluant qu’il soit acide ou non, couplée au pH.</p><p class="lab">Indications</p><p>On la demande en cas de reflux réfractaire sous IPP, avant une chirurgie anti-reflux pour prouver le reflux, et devant des éructations ou une rumination.</p><p class="lab">Lecture</p><p>Elle compte les épisodes de reflux, mesure l’exposition acide et calcule l’association entre symptômes et reflux.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-manometrie" data-title="Manométrie œsophagienne à haute résolution"><p class="lab">Principe</p><p>Sonde à capteurs multiples qui mesure la pression du sphincter et le péristaltisme.</p><p class="lab">Indications</p><p>On la fait avant toute chirurgie anti-reflux et quand le diagnostic est incertain, pour exclure une achalasie ou un trouble moteur (S2k 2023, recommandations 1.12 et 3.3).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-fundoplicature" data-title="Fundoplicature laparoscopique"><p class="lab">Principe</p><p>La grosse tubérosité est enroulée autour de l’œsophage distal pour reconstituer une barrière anti-reflux ; le hiatus est refermé.</p><p class="lab">Place</p><p>Intervention de première intention si l’indication est posée (S2k 2023, recommandation 3.5).</p><p class="lab">Effets indésirables</p><p>Dysphagie, ballonnements, difficulté à éructer.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-stenose" data-title="Sténose peptique"><p class="lab">Mécanisme</p><p>Une œsophagite chronique cicatrise par fibrose et rétrécit la lumière.</p><p class="lab">Clinique</p><p>Le patient présente une dysphagie progressive aux solides.</p><p class="lab">Conduite</p><p>On fait une endoscopie avec biopsies pour exclure un cancer, puis on donne un IPP continu (S2k 2023, recommandation 2.10) et on dilate si nécessaire.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhzAHAAYUAAP3y9fXX7fPB5unC5PSy3fWo1+6u2uWu1PGg0/Ca0fCYye6PyO6Jv+eUyeeHwd2Mv+mBvOl6ueR9u+t4r+N3suZwreltoOlml+Nlnd97t99xr99qqN9lnNl0r9lmoNJrpL5rnOdbiOJbi+BajN1dlt1XhNNel9NXktRZhtNThOBMc9dMeNFOhNFKcuQ4U9U7YdsrQ9cjP8JYjMJPgcVKe7hJeL9BcK8/a7U1WrwpRJ9Da50zV4A+YX8yUZIqTV0iPywAAAAAzAHAAUAI/wB/CBxIsCCPgggR9lhI8GDChwIXSoQ48UePgRIzMoxYkaPGjxp37PABUuRHHTw+WlyYUiOPlzBj9ojJQ4fNmzhv0oRpkyfKljOBgsz4EudOnC517CjaU2dNo09zxuwZtObOq1Y3fkzJQ+SOnjFF+iBJc+HYsxKpvsw48uPZt0PjypXrseDFhBk9boSocC/fh1gRwrz7l6BfvHpZgkwsUWgPknK/jvUacqSPH5Dfaras2WVVlkxvfs2Z8+wOjUh9mOzx1bJY1Ta9vv2quKvatTm9iiQde7JSyKx514CKdfDMn1ZJmnaN84bukSZn686s2mts6zczah67kDPaztS9d/+W+Bru3PPmVZo9nzeiYIgOC8ufP3clSMesl841zf2xxOribbfddJMJONlz5QGI4Ghi4QTdghA+p8MNvUmHA2cRZgjhZtdhh6BoN9Ug4nC8lWiiUrs5KNtm2KG4wwwz7IahgdLRuFl1NvIn4IMB5ujjj2j9F+Rhgg32Q0x4zUTYfBHpwN6TwTlVlU0HujajasthWWCPVeo42w023CDmgmKWWeaFIuGAg3O6sbnmDmqiuYOYasLpFZprlqlbnD7E6adYXt1w4Q0i6qmamYK2iaiZIFLIW4o4kSiiDJSOOKJNNcwgwww1OLqgi2M+1+Vyv+Vo5ZwUEjiaDiNqaoIMnbr/WJ6opnI5IJA+2nrWkQkBZdhnF2mlkn3BzrUWlGlVuKODo1b5HJsZymnnnYRS+iqMKdAQppmdFrpop2KOaMO45GbKKaE0pGvDmuTaACOMIsJ7rrk1bDutn+OKacOIzpVp6b/dfnspqIQCzJujmI5YaQ2UwgpwqCKFqueCa74Z8Zy0/rmgdBNG2vCmnNYAwgcggAAcgxhCO93FCJrmXJYb4yrzW/FRtJJQ+NVElE0dseWkRts9VmCNA7YMM8sX4qjgs2OGyu+g/sJIQ6c2pBtvpi <template data-pop="k21-prague" data-title="Classification de Prague"><p class="lab">C</p><p>C mesure en centimètres l’extension circonférentielle de la muqueuse cylindrique au-dessus de la jonction.</p><p class="lab">M</p><p>M mesure en centimètres l’extension maximale, languettes comprises.</p><p class="lab">Usage</p><p>La valeur M guide l’intervalle de surveillance de l’ESGE 2023.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></template>
<template data-pop="k21-surveillance" data-title="Surveillance du Barrett sans dysplasie"><p class="lab">ESGE 2023</p><p>Un Barrett de M ≥ 1 et < 3 cm se surveille tous les 5 ans, et de M ≥ 3 et < 10 cm tous les 3 ans ; à partir de 10 cm, il relève d’un centre expert. Une ligne Z irrégulière < 1 cm ne justifie ni biopsies ni surveillance.</p><p class="lab">S2k 2023</p><p>La S2k propose un contrôle à 1 an, puis tous les 3 à 5 ans selon les facteurs de risque.</p><p class="lab">Biopsies</p><p>Biopsies ciblées, puis quatre quadrants tous les 1 à 2 cm.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-dysplasie" data-title="Dysplasie de bas grade dans le Barrett"><p class="lab">Confirmation</p><p>Un second pathologiste expérimenté confirme le diagnostic, puis une endoscopie à 2 à 3 mois exclut une lésion visible (S2k 2023, recommandation 4.9).</p><p class="lab">Traitement</p><p>Si elle est confirmée sur deux endoscopies, on fait une ablation endoscopique (ESGE 2023, recommandation forte) ; sinon, on surveille à 6 mois, puis chaque année.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-resection" data-title="Résection endoscopique"><p class="lab">Indication</p><p>Toute lésion visible avec dysplasie ou cancer muqueux se résèque, car la pièce permet le staging.</p><p class="lab">Critères de guérison</p><p>Cancer pT1 sm1 (< 500 µm), sans invasion lymphatique ni veineuse, bien ou moyennement différencié, résection complète (S2k 2023, recommandation 4.16).</p><p class="lab">Suite</p><p>Ablation du Barrett résiduel, puis endoscopies à 3, 6 et 12 mois, puis annuelles.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></template>
<template data-pop="k21-ogd" data-title="Œsogastroduodénoscopie dans le reflux"><p class="lab">Indications</p><p>On la fait en cas de signes d’alarme, d’échec du traitement d’épreuve ou de symptômes anciens de plusieurs années, pour dépister un Barrett.</p><p class="lab">Moment</p><p>Idéalement, on la fait 2 à 4 semaines après l’arrêt des IPP si le reflux n’est pas prouvé, car les IPP cicatrisent l’œsophagite (Lyon 2.0).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-tea" data-title="Temps d’exposition acide"><p class="lab">Définition</p><p>Pourcentage du temps d’enregistrement pendant lequel le pH œsophagien est inférieur à 4.</p><p class="lab">Seuils</p><p>Un temps > 6 % est pathologique, un temps < 4 % est normal, et un temps de 4 à 6 % n’est pas concluant (Lyon 2.0).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-impedance-basale" data-title="Impédance basale"><p class="lab">Définition</p><p>C’est l’impédance de la muqueuse entre les épisodes de reflux ; elle baisse quand la muqueuse est lésée, car les espaces intercellulaires s’élargissent.</p><p class="lab">Seuils (Lyon 2.0)</p><p>< 1500 ohms : argument en faveur du reflux ; > 2500 ohms : argument contre.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-d-ipp" data-title="IPP dans le reflux"><p class="lab">Mécanisme</p><p>Prodrogue activée en milieu acide, inhibition irréversible des pompes H⁺/K⁺-ATPase actives.</p><p class="lab">Prise</p><p>On prend l’IPP environ 1 heure avant un repas (information professionnelle Pantozol®), car il n’inhibe que les pompes activées par le repas.</p><p class="lab">Posologies suisses</p><p>L’ésoméprazole se donne à 40 mg/j pendant 4 à 8 semaines pour l’œsophagite, puis à 20 mg/j en entretien ; le pantoprazole se donne à 20 mg/j dans le reflux léger et à 40 mg/j dans l’œsophagite modérée.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pantozol®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k21-anti-h2" data-title="Antihistaminiques H2"><p class="lab">Mécanisme</p><p>Ils bloquent les récepteurs H2 de la cellule pariétale ; leur effet est moins puissant et plus bref que celui de l’IPP.</p><p class="lab">Place</p><p>On les réserve aux symptômes légers, et ils sont une option pendant la grossesse avant l’IPP (S2k 2023, recommandations 2.4 et 2.14).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-ipp-long-cours" data-title="IPP au long cours"><p class="lab">Hypomagnésémie</p><p>Elle apparaît après au moins 3 mois, surtout après un an.</p><p class="lab">Fractures</p><p>Risque modérément accru après plus d’un an à dose élevée.</p><p class="lab">Règle</p><p>Réévaluer et arrêter si l’indication disparaît (S2k 2023, recommandation 2.15).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-hypersensibilite" data-title="Hypersensibilité au reflux"><p class="lab">Définition (Lyon 2.0)</p><p>L’exposition acide est normale (< 4 %), mais les symptômes sont associés aux épisodes de reflux.</p><p class="lab">Conséquence</p><p>Trouble de l’interaction intestin-cerveau ; l’escalade des IPP est peu utile.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-adk" data-title="Adénocarcinome de l’œsophage"><p class="lab">Origine</p><p>Il naît le plus souvent sur un œsophage de Barrett, par la séquence métaplasie, dysplasie puis cancer.</p><p class="lab">Précoce</p><p>Une lésion visible avec dysplasie ou cancer muqueux se traite par résection endoscopique.</p><p class="lab">Renvoi</p><p>Le cours C15 — Tumeur maligne de l’œsophage traite le cancer invasif.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></template>
<template data-pop="k21-achalasie" data-title="Achalasie"><p class="lab">Définition</p><p>Défaut de relaxation du sphincter inférieur et absence de péristaltisme.</p><p class="lab">Pertinence</p><p>Elle peut imiter un reflux réfractaire ; une fundoplicature l’aggraverait. C’est pourquoi la manométrie précède toute chirurgie anti-reflux.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-clopidogrel" data-title="IPP et clopidogrel, méthotrexate"><p class="lab">Clopidogrel</p><p>Association à l’ésoméprazole déconseillée en raison d’une interaction pharmacocinétique et pharmacodynamique documentée ; l’ésoméprazole inhibe le CYP2C19 (information professionnelle suisse).</p><p class="lab">Méthotrexate</p><p>Taux accrus de méthotrexate ; suspendre l’IPP en cas de méthotrexate à forte dose.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
