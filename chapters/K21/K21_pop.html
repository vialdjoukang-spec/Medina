<template data-pop="pareto-k21-clinique" data-title="Loi de Pareto — Reflux et Barrett"><p class="ratio" data-cover="k21-1,k21-5,k21-6,k21-8,k21-9,k21-12"></p><ul><li>Reflux pathologique : symptômes gênants ou lésions.</li><li>Symptômes typiques sans alarme : IPP d’épreuve ; alarme ou échec : endoscopie.</li><li>Preuve : Los Angeles B, C ou D, Barrett, sténose, ou exposition acide > 6 %.</li><li>Réfractaire après 8 semaines de dose double : pH-impédancemétrie et manométrie.</li><li>Non compliqué : traitement à la demande ; C, D, sténose : traitement continu.</li><li>Barrett : surveillance tous les 5 ans (1 à < 3 cm) ou 3 ans (3 à < 10 cm).</li></ul></template>
<template data-pop="pareto-k21-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k21-e-1,k21-e-2,k21-e-3"></p><ul><li>Endoscopie si alarme, échec ou symptômes anciens.</li><li>pH-métrie sans IPP : exposition acide > 6 % pathologique, < 4 % normale.</li><li>pH-impédancemétrie sous IPP pour le reflux réfractaire.</li><li>Manométrie à haute résolution avant toute chirurgie.</li><li>Prague : C et M en centimètres.</li></ul></template>
<template data-pop="pareto-k21-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k21-p-1,k21-p-2,k21-p-3"></p><ul><li>IPP environ 1 heure avant le repas ; alginate après.</li><li>Ésoméprazole 40 mg/j 4 à 8 semaines pour l’œsophagite, 20 mg/j en entretien.</li><li>Réfractaire : dose double en deux prises 8 semaines.</li><li>Clopidogrel : association à l’ésoméprazole déconseillée.</li><li>Arrêter l’IPP quand l’indication disparaît.</li></ul></template>
<template data-pop="k21-alarme" data-title="Signes d’alarme du reflux"><p class="lab">Liste (S2k 2023)</p><p>Dysphagie, odynophagie, signes d’hémorragie digestive y compris anémie ferriprive, anorexie, perte de poids involontaire, vomissements répétés, antécédents familiaux de tumeur digestive.</p><p class="lab">Conduite</p><p>Endoscopie immédiate, sans traitement d’épreuve préalable.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-los-angeles" data-title="Classification de Los Angeles"><p class="lab">Grade A</p><p>Une ou plusieurs lésions ≤ 5 mm, ne reliant pas le sommet de deux plis.</p><p class="lab">Grade B</p><p>Au moins une lésion > 5 mm, ne reliant pas le sommet de deux plis.</p><p class="lab">Grade C</p><p>Lésions reliant le sommet de deux plis ou plus, sur moins de 75 % de la circonférence.</p><p class="lab">Grade D</p><p>Lésions sur au moins 75 % de la circonférence.</p><p class="lab">Valeur</p><p>B, C et D sont concluants selon Lyon 2.0 ; C et D seulement selon la S2k 2023.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-barrett" data-title="Œsophage de Barrett"><p class="lab">Définition</p><p>Remplacement de l’épithélium malpighien de l’œsophage distal par un épithélium cylindrique avec métaplasie intestinale, sur au moins 1 cm.</p><p class="lab">Risque</p><p>Progression vers dysplasie de haut grade ou adénocarcinome : 0,3 à 0,8 % par an (ESGE 2023).</p><p class="lab">Conduite</p><p>Biopsies selon le protocole, surveillance selon la longueur, traitement endoscopique de la dysplasie.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-rgo-def" data-title="Maladie de reflux gastro-œsophagien"><p class="lab">Définition (S2k 2023, énoncé 1.1)</p><p>Reflux du contenu gastrique qui provoque des symptômes gênants ou des lésions de l’œsophage.</p><p class="lab">Définition « actionnable » (Lyon 2.0)</p><p>Preuve objective à l’endoscopie ou en pH-métrie, associée à des symptômes compatibles.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-preuve" data-title="Preuve objective du reflux"><p class="lab">Endoscopie</p><p>Œsophagite de grade B, C ou D ; Barrett histologique ; sténose peptique.</p><p class="lab">pH-métrie sans IPP</p><p>Temps d’exposition acide > 6 %.</p><p class="lab">Ce qui ne prouve pas</p><p>La réponse aux IPP (S2k 2023, énoncé 1.3) ; les biopsies dans la maladie non érosive.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-oesophagite" data-title="Œsophagite érosive"><p class="lab">Définition</p><p>Pertes de substance de la muqueuse œsophagienne distale, visibles à l’endoscopie.</p><p class="lab">Classification</p><p>Los Angeles A à D.</p><p class="lab">Traitement</p><p>IPP à dose pleine 4 à 8 semaines ; traitement continu pour les grades C et D.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-nerd" data-title="Maladie de reflux non érosive"><p class="lab">Définition</p><p>Symptômes typiques et reflux pathologique en pH-métrie, sans lésion endoscopique.</p><p class="lab">Piège</p><p>Les biopsies ne permettent pas ce diagnostic (S2k 2023, énoncé 1.9).</p><p class="lab">Traitement</p><p>Guidé par les symptômes, souvent à la demande.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-obesite" data-title="Surpoids et reflux"><p class="lab">Mécanisme</p><p>La pression abdominale augmente et favorise la hernie hiatale.</p><p class="lab">Preuve</p><p>Dans l’étude HUNT citée par la S2k, la perte de poids améliorait les symptômes, proportionnellement à la baisse de l’indice de masse corporelle.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-hernie" data-title="Hernie hiatale"><p class="lab">Par glissement</p><p>La jonction œsogastrique remonte dans le thorax ; la barrière anti-reflux s’affaiblit.</p><p class="lab">Para-œsophagienne</p><p>L’estomac s’engage à côté de l’œsophage ; risque de volvulus ; chirurgie si symptomatique (S2k 2023, recommandation 3.8).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-jog" data-title="Jonction œsogastrique"><p class="lab">Repère endoscopique</p><p>Sommet des plis gastriques, sans insufflation excessive ni péristaltisme (S2k 2023, recommandation 4.4).</p><p class="lab">Ligne Z</p><p>Limite visible entre muqueuse malpighienne pâle et muqueuse cylindrique rouge ; normalement au niveau de la jonction.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-metaplasie" data-title="Métaplasie intestinale"><p class="lab">Définition</p><p>Remplacement d’un épithélium par un épithélium de type intestinal, avec cellules caliciformes.</p><p class="lab">Signification</p><p>Elle définit le Barrett et précède la dysplasie.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-pyrosis" data-title="Pyrosis"><p class="lab">Définition</p><p>Brûlure rétrosternale ascendante, souvent après les repas ou en décubitus.</p><p class="lab">Valeur</p><p>Symptôme typique du reflux, mais insuffisant pour en prouver la nature pathologique.</p><p class="lab">Piège</p><p>Une douleur thoracique impose d’exclure d’abord une cause cardiaque.</p></template>
<template data-pop="k21-regurgitation" data-title="Régurgitation"><p class="lab">Définition</p><p>Remontée sans effort de contenu gastrique dans la bouche, sans nausée.</p><p class="lab">Diagnostic différentiel</p><p>Rumination, achalasie (régurgitation d’aliments non digérés).</p></template>
<template data-pop="k21-epreuve" data-title="Traitement d’épreuve par IPP"><p class="lab">Indication</p><p>Symptômes typiques, sans signe d’alarme, sans antécédent familial de cancer digestif haut, sans facteur de risque de complication (S2k 2023, recommandation 2.3).</p><p class="lab">Durée</p><p>4 à 8 semaines en dose standard.</p><p class="lab">Échec</p><p>Après 8 semaines bien conduites : exploration (recommandation 2.5).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-phmetrie" data-title="pH-métrie œsophagienne"><p class="lab">Technique</p><p>Capteur de pH placé dans l’œsophage distal pendant 24 heures (sonde) ou jusqu’à 96 heures (capsule sans fil).</p><p class="lab">Condition</p><p>Sans IPP pour prouver le reflux ; sous IPP pour explorer un reflux réfractaire prouvé.</p><p class="lab">Seuils (Lyon 2.0)</p><p>Temps d’exposition acide > 6 % : pathologique ; < 4 % : normal.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-lyon" data-title="Consensus de Lyon 2.0"><p class="lab">Nature</p><p>Consensus international d’experts sur le diagnostic moderne du reflux, publié dans Gut en 2024.</p><p class="lab">Apports</p><p>Grade B de Los Angeles concluant ; seuils de la pH-métrie ; notion de reflux « actionnable ».</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-mesures" data-title="Mesures générales"><p class="lab">Efficaces</p><p>Perte de poids ; tête du lit surélevée en cas de symptômes nocturnes ; éviter les repas tardifs ; arrêt du tabac chez le patient de poids normal.</p><p class="lab">Plausibles</p><p>Décubitus latéral gauche ; respiration abdominale ; éviter les vêtements serrés.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-alginate" data-title="Alginates (Gaviscon®)"><p class="lab">Composition</p><p>Alginate de sodium, bicarbonate de sodium et carbonate de calcium.</p><p class="lab">Mécanisme</p><p>Formation d’un radeau visqueux qui flotte sur le contenu gastrique et limite le reflux.</p><p class="lab">Posologie suisse</p><p>2 à 4 comprimés à croquer après les repas et au coucher, jusqu’à 4 fois par jour.</p><p class="lab">Précaution</p><p>Environ 63 mg de sodium par comprimé.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Gaviscon®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k21-refractaire" data-title="Reflux réfractaire"><p class="lab">Définition (S2k 2023)</p><p>Réponse insuffisante après au moins 8 semaines d’IPP à double dose (1-0-1).</p><p class="lab">Causes</p><p>Mauvaise observance, reflux persistant, hypersensibilité, trouble fonctionnel, œsophagite à éosinophiles, autre diagnostic.</p><p class="lab">Conduite</p><p>Endoscopie avec biopsies, pH-impédancemétrie, manométrie.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-eoe" data-title="Œsophagite à éosinophiles"><p class="lab">Définition</p><p>Inflammation chronique de l’œsophage d’origine immuno-allergique, avec infiltrat éosinophile.</p><p class="lab">Indice</p><p>Dysphagie, impactions alimentaires, reflux réfractaire.</p><p class="lab">Diagnostic</p><p>Biopsies étagées de plusieurs niveaux de l’œsophage (S2k 2023, recommandation 1.10).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-impedance" data-title="pH-impédancemétrie"><p class="lab">Principe</p><p>Mesure de l’impédance électrique, qui détecte le passage du bol refluant qu’il soit acide ou non, couplée au pH.</p><p class="lab">Indications</p><p>Reflux réfractaire sous IPP ; avant chirurgie anti-reflux pour prouver le reflux ; éructations, rumination.</p><p class="lab">Lecture</p><p>Nombre d’épisodes, exposition acide, association symptomatique.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-manometrie" data-title="Manométrie œsophagienne à haute résolution"><p class="lab">Principe</p><p>Sonde à capteurs multiples qui mesure la pression du sphincter et le péristaltisme.</p><p class="lab">Indications</p><p>Avant toute chirurgie anti-reflux ; diagnostic incertain, pour exclure une achalasie ou un trouble moteur (S2k 2023, recommandations 1.12 et 3.3).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-fundoplicature" data-title="Fundoplicature laparoscopique"><p class="lab">Principe</p><p>La grosse tubérosité est enroulée autour de l’œsophage distal pour reconstituer une barrière anti-reflux ; le hiatus est refermé.</p><p class="lab">Place</p><p>Intervention de première intention si l’indication est posée (S2k 2023, recommandation 3.5).</p><p class="lab">Effets indésirables</p><p>Dysphagie, ballonnements, difficulté à éructer.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-stenose" data-title="Sténose peptique"><p class="lab">Mécanisme</p><p>Fibrose cicatricielle d’une œsophagite chronique.</p><p class="lab">Clinique</p><p>Dysphagie progressive aux solides.</p><p class="lab">Conduite</p><p>Endoscopie avec biopsies pour exclure un cancer ; IPP continu (S2k 2023, recommandation 2.10) ; dilatation si nécessaire.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-prague" data-title="Classification de Prague"><p class="lab">C</p><p>Extension circonférentielle de la muqueuse cylindrique au-dessus de la jonction, en centimètres.</p><p class="lab">M</p><p>Extension maximale, languettes comprises, en centimètres.</p><p class="lab">Usage</p><p>La valeur M guide l’intervalle de surveillance de l’ESGE 2023.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></template>
<template data-pop="k21-surveillance" data-title="Surveillance du Barrett sans dysplasie"><p class="lab">ESGE 2023</p><p>M ≥ 1 et < 3 cm : tous les 5 ans ; M ≥ 3 et < 10 cm : tous les 3 ans ; M ≥ 10 cm : centre expert ; ligne Z irrégulière < 1 cm : ni biopsies ni surveillance.</p><p class="lab">S2k 2023</p><p>Contrôle à 1 an, puis tous les 3 à 5 ans selon les facteurs de risque.</p><p class="lab">Biopsies</p><p>Biopsies ciblées, puis quatre quadrants tous les 1 à 2 cm.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-dysplasie" data-title="Dysplasie de bas grade dans le Barrett"><p class="lab">Confirmation</p><p>Second pathologiste expérimenté ; contrôle endoscopique à 2 à 3 mois pour exclure une lésion visible (S2k 2023, recommandation 4.9).</p><p class="lab">Traitement</p><p>Ablation endoscopique si elle est confirmée sur deux endoscopies (ESGE 2023, recommandation forte) ; sinon surveillance à 6 mois puis annuelle.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-resection" data-title="Résection endoscopique"><p class="lab">Indication</p><p>Toute lésion visible avec dysplasie ou cancer muqueux ; la pièce permet le staging.</p><p class="lab">Critères de guérison</p><p>Cancer pT1 sm1 (< 500 µm), sans invasion lymphatique ni veineuse, bien ou moyennement différencié, résection complète (S2k 2023, recommandation 4.16).</p><p class="lab">Suite</p><p>Ablation du Barrett résiduel, puis endoscopies à 3, 6 et 12 mois, puis annuelles.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></template>
<template data-pop="k21-ogd" data-title="Œsogastroduodénoscopie dans le reflux"><p class="lab">Indications</p><p>Signes d’alarme ; échec du traitement d’épreuve ; symptômes anciens de plusieurs années pour dépister un Barrett.</p><p class="lab">Moment</p><p>Idéalement 2 à 4 semaines après l’arrêt des IPP si le reflux n’est pas prouvé (Lyon 2.0).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-tea" data-title="Temps d’exposition acide"><p class="lab">Définition</p><p>Pourcentage du temps d’enregistrement pendant lequel le pH œsophagien est inférieur à 4.</p><p class="lab">Seuils</p><p>> 6 % : pathologique ; < 4 % : normal ; 4 à 6 % : non concluant (Lyon 2.0).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-impedance-basale" data-title="Impédance basale"><p class="lab">Définition</p><p>Impédance de la muqueuse entre les épisodes de reflux ; elle baisse quand la muqueuse est lésée.</p><p class="lab">Seuils (Lyon 2.0)</p><p>< 1500 ohms : argument en faveur du reflux ; > 2500 ohms : argument contre.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-d-ipp" data-title="IPP dans le reflux"><p class="lab">Mécanisme</p><p>Prodrogue activée en milieu acide, inhibition irréversible des pompes H⁺/K⁺-ATPase actives.</p><p class="lab">Prise</p><p>Environ 1 heure avant un repas (information professionnelle Pantozol®).</p><p class="lab">Posologies suisses</p><p>Ésoméprazole 40 mg/j 4 à 8 semaines pour l’œsophagite, 20 mg/j en entretien ; pantoprazole 20 mg/j dans le reflux léger, 40 mg/j dans l’œsophagite modérée.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Pantozol®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k21-anti-h2" data-title="Antihistaminiques H2"><p class="lab">Mécanisme</p><p>Blocage des récepteurs H2 de la cellule pariétale ; effet moins puissant et plus bref que l’IPP.</p><p class="lab">Place</p><p>Symptômes légers, option de la grossesse avant l’IPP (S2k 2023, recommandations 2.4 et 2.14).</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-ipp-long-cours" data-title="IPP au long cours"><p class="lab">Hypomagnésémie</p><p>Après au moins 3 mois, surtout après un an.</p><p class="lab">Fractures</p><p>Risque modérément accru après plus d’un an à dose élevée.</p><p class="lab">Règle</p><p>Réévaluer et arrêter si l’indication disparaît (S2k 2023, recommandation 2.15).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-hypersensibilite" data-title="Hypersensibilité au reflux"><p class="lab">Définition (Lyon 2.0)</p><p>Exposition acide normale (< 4 %) mais association positive entre les symptômes et les épisodes de reflux.</p><p class="lab">Conséquence</p><p>Trouble de l’interaction intestin-cerveau ; l’escalade des IPP est peu utile.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></template>
<template data-pop="k21-adk" data-title="Adénocarcinome de l’œsophage"><p class="lab">Origine</p><p>Le plus souvent sur un œsophage de Barrett, par la séquence métaplasie, dysplasie, cancer.</p><p class="lab">Précoce</p><p>Lésion visible avec dysplasie ou cancer muqueux : résection endoscopique.</p><p class="lab">Renvoi</p><p>Le cancer invasif est traité dans le cours C15 — Tumeur maligne de l’œsophage.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></template>
<template data-pop="k21-achalasie" data-title="Achalasie"><p class="lab">Définition</p><p>Défaut de relaxation du sphincter inférieur et absence de péristaltisme.</p><p class="lab">Pertinence</p><p>Elle peut imiter un reflux réfractaire ; une fundoplicature l’aggraverait. C’est pourquoi la manométrie précède toute chirurgie anti-reflux.</p><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></template>
<template data-pop="k21-clopidogrel" data-title="IPP et clopidogrel, méthotrexate"><p class="lab">Clopidogrel</p><p>Association à l’ésoméprazole déconseillée en raison d’une interaction pharmacocinétique et pharmacodynamique documentée ; l’ésoméprazole inhibe le CYP2C19 (information professionnelle suisse).</p><p class="lab">Méthotrexate</p><p>Taux accrus de méthotrexate ; suspendre l’IPP en cas de méthotrexate à forte dose.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></template>
