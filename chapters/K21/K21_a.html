<section class="ilot" id="k21-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 52 ans, en surpoids, se plaint depuis des années de brûlures rétrosternales après les repas et en position couchée. Il prend « de temps en temps » un antiacide. Or, depuis deux mois, il a l’impression que les aliments solides « restent bloqués ». <b>La question n’est donc plus seulement de soulager le reflux, mais de savoir si une complication est apparue.</b></p><p>Pour répondre à cette question, le médecin doit savoir : définir le reflux pathologique ; reconnaître les symptômes typiques et les <button class="w" data-k="k21-alarme">signes d’alarme</button> ; décider quand un traitement d’épreuve suffit et quand l’endoscopie s’impose ; interpréter la <button class="w" data-k="k21-los-angeles">classification de Los Angeles</button> et les seuils de la pH-métrie ; prescrire un <button class="w" data-k="k21-d-ipp">IPP</button> à la bonne dose et pour la bonne durée, puis l’arrêter quand il n’est plus utile ; enfin, reconnaître et surveiller un <button class="w" data-k="k21-barrett">œsophage de Barrett</button>.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="k21-rgo-def">reflux gastro-œsophagien pathologique (définition)</button> ; <button class="w" data-k="k21-preuve">preuve objective (endoscopie ou pH-métrie)</button>.</div></section>
<section class="ilot" id="k21-1"><h2><span class="n">1</span>Définition et classification</h2><p>Le reflux du contenu gastrique dans l’œsophage est physiologique en petite quantité, surtout après les repas. En revanche, selon la S2k 2023 (énoncé 1.1), on parle de <b>maladie de reflux gastro-œsophagien</b> lorsque ce reflux provoque des symptômes gênants ou des lésions de l’œsophage. Cette définition repose donc sur la gêne ou sur la lésion, et non sur la simple présence de reflux.</p><p>À partir de cette définition, on distingue plusieurs formes. L’<button class="w" data-k="k21-oesophagite">œsophagite érosive</button> comporte des pertes de substance visibles à l’endoscopie. À l’inverse, la <button class="w" data-k="k21-nerd">maladie de reflux non érosive</button> associe des symptômes typiques et un reflux pathologique, sans lésion visible. Enfin, les complications sont la <button class="w" data-k="k21-stenose">sténose peptique</button>, l’œsophage de <button class="w" data-k="k21-barrett">Barrett</button> et l’<button class="w" data-k="k21-adk">adénocarcinome</button>.</p><table class="t"><tr><th>Forme</th><th>Critère</th><th>Conséquence</th></tr><tr><td>Œsophagite érosive</td><td>Lésions endoscopiques, gradées A à D (<button class="w" data-k="k21-los-angeles">Los Angeles</button>)</td><td>Grades C et D : traitement continu</td></tr><tr><td>Maladie non érosive</td><td>Symptômes et reflux pathologique en pH-métrie, endoscopie normale</td><td>Traitement guidé par les symptômes</td></tr><tr><td>Hypersensibilité au reflux</td><td>Exposition acide normale, mais symptômes associés aux épisodes de reflux</td><td>Prise en charge d’un trouble fonctionnel</td></tr><tr><td>Complications</td><td>Sténose peptique, Barrett, adénocarcinome</td><td>Endoscopie, biopsies, surveillance</td></tr></table><p>Le tableau se lit par la colonne de droite : en effet, la forme décide de la durée du traitement et de la surveillance.</p><div class="key"><b>À retenir.</b> Le reflux devient une maladie lorsqu’il gêne ou lèse. La forme (érosive, non érosive, <button class="w" data-k="k21-hypersensibilite">hypersensibilité</button>, complication) commande la suite.</div><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali C. P. et al., Updates to the modern diagnosis of GERD: Lyon consensus 2.0, Gut 2024;73:361-371</a>.</p></section>
<section class="ilot" id="k21-2"><h2><span class="n">2</span>Épidémiologie et facteurs de risque</h2><p>Après la définition, la fréquence situe l’enjeu. Ainsi, selon la S2k 2023, la prévalence du reflux pathologique atteint 15 à 25 % dans les pays à haut niveau de vie, contre environ 10 % dans les pays plus pauvres, et elle augmente. Les facteurs de risque établis sont l’<button class="w" data-k="k21-obesite">indice de masse corporelle élevé</button>, le tabac, une prédisposition génétique et la <button class="w" data-k="k21-hernie">hernie hiatale</button>. À l’inverse, l’infection à Helicobacter pylori semble diminuer ce risque.</p><p>Par ailleurs, l’œsophage de <button class="w" data-k="k21-barrett">Barrett</button> touche environ 2 % des personnes de 50 ans et plus qui ont des symptômes de reflux, d’après une étude de dépistage citée par l’ESGE 2023. Toutefois, son risque de progression vers une <button class="w" data-k="k21-resection">dysplasie de haut grade</button> ou un <button class="w" data-k="k21-adk">adénocarcinome</button> reste faible : 0,3 à 0,8 % par an.</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée nationale suisse de prévalence n’a été retrouvée lors de la rédaction ; les chiffres cités sont européens et attribués.</div><div class="key"><b>À retenir.</b> Le reflux est fréquent (15 à 25 %), surtout en cas de surpoids et de hernie hiatale ; un Barrett touche environ 2 % des patients symptomatiques de plus de 50 ans, mais il progresse peu.</div><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2023_a-2176-2440.pdf" target="_blank" rel="noopener">Weusten B. L. A. M. et al., ESGE, diagnostic et prise en charge de l’œsophage de Barrett, Endoscopy 2023;55:1124-1146</a>.</p></section>
<section class="ilot" id="k21-3"><h2><span class="n">3</span>Physiopathologie</h2><p>Pour comprendre ces facteurs, il faut décrire la barrière anti-reflux. Normalement, la <button class="w" data-k="k21-jog">jonction œsogastrique</button> est fermée par le sphincter inférieur de l’œsophage, renforcé par le diaphragme crural. Or, cette barrière s’ouvre de façon transitoire après les repas : ce sont les relaxations transitoires du sphincter, principal mécanisme du reflux. De plus, la <button class="w" data-k="k21-hernie">hernie hiatale</button> dissocie le sphincter et le diaphragme, si bien que la barrière s’affaiblit.</p><p>Ensuite, la gravité dépend de l’agression et de la clairance. En effet, l’acide et la pepsine lèsent l’épithélium malpighien ; le surpoids augmente la pression abdominale ; enfin, une motricité œsophagienne faible ralentit l’évacuation du reflux. Par conséquent, l’exposition acide se prolonge et les lésions apparaissent.</p><p>À long terme, l’agression chronique peut transformer l’épithélium. Ainsi, l’épithélium malpighien est remplacé par un <button class="w" data-k="k21-metaplasie">épithélium cylindrique de type intestinal</button> : c’est l’œsophage de <button class="w" data-k="k21-barrett">Barrett</button>, qui peut évoluer vers la dysplasie puis l’<button class="w" data-k="k21-adk">adénocarcinome</button>.</p><figure><img src="data:image/gif;base64,R0lGODdhQAHgAYUAAP78/fz6/f36+/75/fr6+/32/Pzs+/7h/Pbg9PzX+frW8frP8/nO6/PT8PPM7e/P7OjP5/bI7fTH5e7I7O7H5PTB6PPA4OzB5uzA3ujG5ujC5Oi+5Oi+3OTC4uS9396/3e+53ua53fCy3Oey2OG54OC52OC12eCx1tu33Nu21Nqw2Nqv0Na01dau09Kw0s2vzuqm09qnz9Kq0NGkzMyozMuiyceix8Ghw9mZyMWZw7+YwLeVu76MuqyIsaZ7qYpfkCwAAAAAQAHgAUAI/wAJCAwAoCCAAAgTKlyocIDDAQwjJnxIseJDARgzatwowKJHhwQ4ihxJUqFBAAIJIDQoMeLJkw0vCswYUkBNjARQFjSQk4DDAg4BDECpcmgBAwAgdFDAoSmDAilvYgRQoIBBlQWrDijQoCsFCg8aYPjwgUUKCBAQYCxgM2uDDwcMNHCBAsUNFi46HNgLFejDAgjQQmhw4OgBCSNGgLDAGERiDBQydECQUgACymhbapZI8aBKggE+M/zokaRI0hZNqzYtsWBCmCxdr3T98upnijZvzuSY03Xvzg7bovjxo0cJDhKQQiUq+mFgCoxFi oösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></section>
<section class="ilot" id="k21-4"><h2><span class="n">4</span>Anamnèse et symptômes</h2><p>La démarche commence donc par l’interrogatoire. Les symptômes typiques sont le <button class="w" data-k="k21-pyrosis">pyrosis</button>, une brûlure rétrosternale ascendante, et les <button class="w" data-k="k21-regurgitation">régurgitations</button> acides. Par ailleurs, il existe des manifestations extra-œsophagiennes : toux chronique, enrouement, asthme, érosions dentaires. Cependant, leur lien avec le reflux est plus difficile à établir.</p><p>L’interrogatoire recherche ensuite les <button class="w" data-k="k21-alarme">signes d’alarme</button>, car ils imposent une endoscopie immédiate. De plus, il précise l’ancienneté des symptômes, le poids, le tabac, l’alcool, les médicaments et les traitements déjà essayés.</p><div class="trap"><span class="k">Piège</span>Attribuer une douleur thoracique au reflux sans avoir exclu une origine cardiaque : la cause coronarienne est éliminée en premier.</div><div class="key"><b>À retenir.</b> Pyrosis et régurgitations sont typiques ; dysphagie, odynophagie, saignement, anémie ferriprive, perte de poids, vomissements répétés et antécédents familiaux de cancer digestif sont des signes d’alarme.</div><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></section>
<section class="ilot" id="k21-5"><h2><span class="n">5</span>Démarche diagnostique</h2><p>Au terme de l’interrogatoire, deux situations se présentent. D’une part, chez un patient aux symptômes typiques, sans signe d’alarme ni facteur de risque de complication, la S2k 2023 propose un <button class="w" data-k="k21-epreuve">traitement d’épreuve par IPP en dose standard</button> (recommandation 2.3). D’autre part, en présence de signes d’alarme ou en cas d’échec du traitement d’épreuve, une œsogastroduodénoscopie est indiquée (recommandation 1.5).</p><p>Il faut cependant savoir que la réponse aux <button class="w" data-k="k21-d-ipp">IPP</button> ne prouve pas le diagnostic (énoncé 1.3). En effet, aucun examen n’est un gold standard ; la preuve est apportée par l’endoscopie ou par la <button class="w" data-k="k21-phmetrie">pH-métrie</button>. De plus, en cas de symptômes anciens de plusieurs années, une endoscopie est conseillée pour dépister un œsophage de <button class="w" data-k="k21-barrett">Barrett</button> (recommandation 1.6).</p><div class="quiz ui"><p>Une femme de 38 ans a un pyrosis typique depuis 3 mois, sans signe d’alarme. Quelle conduite ?</p><button data-ok="0">Gastroscopie d’emblée</button><button data-ok="1">IPP en dose standard pendant 4 à 8 semaines</button><button data-ok="0">pH-métrie avant tout traitement</button><p class="fb" hidden>En l’absence de signe d’alarme et de facteur de risque de complication, la S2k 2023 recommande un traitement d’épreuve par IPP ; l’endoscopie est réservée à l’échec ou aux signes d’alarme.</p></div><div class="key"><b>À retenir.</b> Des symptômes typiques sans alarme justifient un traitement d’épreuve, alors qu’une alarme ou un échec imposent une endoscopie. La réponse aux IPP ne prouve rien, car l’effet placebo et les autres causes acido-sensibles répondent aussi.</div><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a>.</p></section>
<section class="ilot" id="k21-6"><h2><span class="n">6</span>Preuve objective : quand le reflux est-il établi ?</h2><p>Lorsque le diagnostic doit être prouvé, deux sources européennes récentes divergent sur un point. D’un côté, la S2k 2023 retient comme preuve concluante une œsophagite de grade C ou D, un <button class="w" data-k="k21-barrett">Barrett</button> de plus de 1 cm confirmé par histologie ou une <button class="w" data-k="k21-stenose">sténose peptique</button> (énoncé 1.2). De l’autre, le <button class="w" data-k="k21-lyon">consensus de Lyon 2.0</button>, publié en 2024, considère que le grade B est lui aussi concluant, sur la base d’études récentes de pH-métrie prolongée.</p><p>Par conséquent, le cours suit la source la plus récente, tout en signalant l’écart. De plus, Lyon 2.0 fixe les seuils de la pH-métrie sans <button class="w" data-k="k21-d-ipp">IPP</button> : un <button class="w" data-k="k21-tea">temps d’exposition acide</button> supérieur à 6 % est diagnostique, alors qu’un temps inférieur à 4 % sur tous les jours d’enregistrement, sans association symptomatique, exclut le reflux pathologique. Enfin, l’endoscopie doit idéalement être faite 2 à 4 semaines après l’arrêt des IPP chez un patient sans reflux prouvé.</p><figure><img src="data:image/gif;base64,R0lGODdhCAKGAYYAAN6VttyMrduLqeCGpNSGoN6Am9d/mtJ/l7yPn8OEmcuBl7qBlMl9krh9kNl4ktN4kM53j8h3kMd2hb93j792hr51f7Z2haZ1hMpwhchqfsFsf7xuhLttebtmeLNthLNsebJrdLNkd7Fjb6ZthahsdqdkdqZgc6dlaqZgaaZeaZxrfJxhdZxhZpRlcYZlaa9aaadZZqRaaaNYYaBZaJ9XX5tbZ5tWZZNaaZNWZ5pYXppUXZJXXaRRXp1RXJpRXJJRYpJRW5JQVppMV5BMVZNGT4hSXYhMVohIU4dGSoFJU3RHTXM7QDolJQUPBwUKCgUKBgUKBAENBQ0FDAYIBwUHDAQICQUGCAQIBwQJBQQJAwUGBAIIDQIJCQMHCAIIBAEDAwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAACAKGAUAI/wCnCBxIsKDBgwgTKlzIsCHDK1m8ZBGopaLFixgtTql45YqXjiBDXjGIsSPBKxxFYsFyhQuXLS6vYJEYUYtJgSMHXqlixUqXLiCfPJmCRUuXnj0JFtUy04tTmlmiWnzqBYuTmS6rcOkyBQoULQKxCGVJNaIXKGazoPXy <section class="ilot" id="k21-7"><h2><span class="n">7</span>Traitement : mesures générales et traitement d’épreuve</h2><p>Une fois le diagnostic posé ou probable, le traitement associe mesures générales et médicaments. D’abord, la S2k 2023 demande d’informer tout patient de la place des <button class="w" data-k="k21-mesures">mesures générales</button> (recommandation 2.2). Ainsi, la perte de poids améliore les symptômes et l’efficacité des médicaments ; de même, surélever la tête du lit et éviter les repas tardifs réduisent le reflux nocturne.</p><p>Ensuite, le traitement médicamenteux de référence est l’<button class="w" data-k="k21-d-ipp">IPP</button>. En cas de reflux prouvé ou probable, il est donné pendant au moins 4 à 8 semaines, à une dose adaptée au phénotype et au statut d’autorisation du produit (recommandation 2.6). Par ailleurs, chez un patient aux symptômes typiques sans alarme, d’autres produits sont possibles s’ils suffisent au patient : <button class="w" data-k="k21-alginate">alginates</button>, antiacides ou <button class="w" data-k="k21-anti-h2">antihistaminiques H2</button> (recommandation 2.4).</p><div class="key"><b>À retenir.</b> Le patient perd du poids, surélève la tête du lit et évite les repas tardifs ; il reçoit un IPP 4 à 8 semaines, ou des alginates et des antiacides s’ils suffisent.</div><p class="src">Références : <a href="https://register.awmf.org/de/leitlinien/detail/021-013" target="_blank" rel="noopener">Madisch A. et al., S2k-Leitlinie Gastroösophageale Refluxkrankheit und eosinophile Ösophagitis (DGVS), Z Gastroenterol 2023;61:862-933</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Gaviscon®, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a>.</p></section>
