<section class="ilot" id="n29-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 28 ans, originaire d’Afrique subsaharienne et installé en Suisse depuis deux ans, consulte pour une hématurie survenue en fin de miction, une pollakiurie et des brûlures mictionnelles. La culture d’urine standard ne trouve aucun germe, alors que la bandelette révèle des leucocytes. Ces valeurs pédagogiques servent à poser la question centrale de la catégorie : quelle maladie générale se manifeste ici par le rein ou la voie urinaire ?</p>
<p>Deux hypothèses se disputent ce tableau. La <button class="w" data-k="n29-tb-hematogene">tuberculose urogénitale</button> donne classiquement une <button class="w" data-k="n29-pyurie-sterile">leucocyturie stérile</button>. La <button class="w" data-k="n29-schisto-cycle">schistosomiase urinaire</button> donne une hématurie terminale chez un migrant exposé à l’eau douce infestée. Le cours enseigne comment les départager, puis comment prendre en charge chacune, et il complète le tableau par deux atteintes plus rares : la syphilis tardive et la <button class="w" data-k="n29-cyst-gene">cystinose néphropathique</button>.</p>
<div class="key"><b>À retenir.</b> La catégorie N29 ne décrit pas une maladie rénale autonome. Elle décrit le rein et l’uretère <i>atteints par une maladie générale</i>, dont la cause doit toujours être nommée et traitée.</div>
</section>

<section class="ilot" id="n29-1"><h2><span class="n">1</span>Définition clinique et périmètre</h2><p>Une maladie générale peut altérer le rein par une infection du parenchyme, une inflammation et une obstruction des voies excrétrices, ou un défaut métabolique des cellules tubulaires. Cette leçon suit quatre situations : tuberculose urogénitale, schistosomiase urinaire, syphilis tardive et cystinose néphropathique. Leur point commun est une atteinte rénale ou urétérale dont la prise en charge exige d’identifier la cause.</p><p>Il faut d’emblée distinguer la lésion dominante : <b>obstacle</b> compromettant l’écoulement, <b>atteinte tubulaire</b> responsable de pertes urinaires, ou <b>atteinte glomérulaire</b> imposant un raisonnement néphrologique propre. Les glomérulopathies infectieuses sont expliquées pour cette distinction, sans les confondre avec toute manifestation urinaire. Le classement administratif détaillé est conservé après la conclusion clinique.</p><div class="key"><b>À retenir.</b> Partir du syndrome observé, rechercher son mécanisme, prouver sa cause et mesurer son retentissement : un intitulé de classification ne remplace aucune de ces étapes.</div><p>Sources : guide suisse de tuberculose 2024, EAU§3.16, RMS 2018 et recommandations cystinose 2026 ; périmètre de la classification conservé en annexe.</p></section>

<section class="ilot" id="n29-2"><h2><span class="n">2</span>Fréquence et contexte épidémiologique</h2>
<p>Les quatre maladies n’ont ni la même fréquence ni la même histoire. Il faut donc les considérer séparément, en précisant à chaque fois la population concernée.</p>
<h3>2.1 Tuberculose</h3>
<p>La tuberculose génito-urinaire représente <b>jusqu’à un quart des tuberculoses extrapulmonaires</b>. Plus de 90 % des cas surviennent dans les pays en développement, où elle est la deuxième forme extrapulmonaire. Elle touche environ deux hommes pour une femme, avec un âge médian proche de 40 ans. Le délai après l’infection pulmonaire peut dépasser 30 ans, et le risque de réactivation sur la vie est estimé jusqu’à 15 %. Ces chiffres proviennent d’une revue non systématique.</p>
<p>En <b>Suisse et au Liechtenstein</b>, 544 cas de tuberculose ont été déclarés en 2025 (<button class="w" data-k="n29-tb-epidemio">données du Bulletin</button>). Le taux de déclaration est passé de 4,8 à 6,0 pour 100 000 habitants, contre une moyenne européenne de 8,4 en 2024. Parmi ces cas, 268 étaient exclusivement pulmonaires, 238 pulmonaires et extrapulmonaires, et 32 exclusivement extrapulmonaires. Sur la période 2020–2025, la part exclusivement extrapulmonaire est de 4,2 %, et les poumons sont atteints chez 94 % des malades. En 2022,73 % des cas déclarés n’étaient pas d’origine suisse ; l’augmentation actuelle concerne surtout de jeunes personnes issues de la migration.</p>
<div class="trap"><span class="k">Lacune assumée</span> Le Bulletin de l’Office fédéral de la santé publique ne ventile pas les formes extrapulmonaires par organe. La fréquence suisse de la tuberculose urogénitale est donc inconnue ; aucun chiffre ne doit en être déduit des données étrangères.</div>
<h3>2.2 Schistosomiase</h3>
<p>Au moins 253,7 millions de personnes avaient besoin d’un traitement préventif en 2024. Dans la cohorte européenne citée ici, les données viennent d’un centre de dépistage de migrants ; elles ne décrivent ni toute l’Europe ni la population suisse. À Barcelone, entre 2014 et 2023,855 des 3214 migrants subsahariens dépistés avaient une schistosomiase (26,6 %) ; il s’agissait à 87 % d’hommes, d’âge médian 22 ans. Parmi les 213 cas confirmés, <i>S. haematobium</i> représentait 42,7 % des cas, <i>S. mansoni</i> 33,3 % et <i>S. intercalatum/guineensis</i> 21,6 %.</p>
<h3>2.3 Syphilis</h3>
<p>La Suisse a déclaré 1078 cas de syphilis en 2022 ; la déclaration est obligatoire. La syphilis tertiaire survient chez environ 10 % des patients non traités. L’atteinte rénale de la syphilis précoce est rare : le syndrome néphrotique touche environ 0,28 % des patients. Aucune fréquence n’est disponible pour une atteinte rénale tertiaire.</p>
<h3>2.4 Cystinose</h3>
<p>L’incidence est d’environ 0,5 à 1 pour 100 000 naissances. La cystinose est la cause la plus fréquente de <b>syndrome de Fanconi héréditaire</b> du jeune enfant. La forme infantile néphropathique représente environ 95 % des cas.</p>
<div class="key"><b>À retenir.</b> Chez un migrant avec symptômes urinaires, la tuberculose et la schistosomiase restent à évoquer ensemble ; la syphilis est une infection à déclaration obligatoire ; la cystinose se cherche chez l’enfant avec un syndrome de Fanconi.</div>
<button class="pareto-btn ui" data-k="pareto-n29-definition">▲ Loi de Pareto — Définition et fréquence</button>
</section>

<section class="ilot" id="n29-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le rein normal filtre le plasma, puis les tubules ajustent la composition du filtrat. Les urines sont ensuite évacuées par les cavités excrétrices, l’uretère et la vessie. Chacune des quatre maladies perturbe cette chaîne à un niveau différent : le parenchyme et les voies par une infection bactérienne, la paroi des voies basses par des œufs de parasite, le glomérule par des complexes immuns, le tubule proximal par une surcharge lysosomale.</p>
<figure id="n29-figure-clinical-kidney" data-n29-figure="kidney"><div data-n29-imagebox="kidney"><img src="assets/img/n29/alpha/codex/Kidney_section_vertical.png" width="417" height="700" loading="lazy" alt="Coupe humaine historique du rein normal avec cortex, pyramides, bassinet et uretère"><span data-n29-marker="kidney-1" aria-label="Repère1">1</span><span data-n29-marker="kidney-2" aria-label="Repère2">2</span><span data-n29-marker="kidney-3" aria-label="Repère3">3</span><span data-n29-marker="kidney-4" aria-label="Repère4">4</span></div><figcaption><b>Niveau rénal : repères normaux avant l’analyse des lésions</b><ol><li><b>1.</b> Cortex : repère du foyer initial décrit dans la tuberculose.</li><li><b>2.</b> Pyramide médullaire : distinguer la papille et son ouverture vers un calice.</li><li><b>3.</b> Bassinet : collecte les urines avant leur passage dans l’uretère.</li><li><b>4.</b> Uretère : voie d’écoulement, non représentée ici sur toute sa longueur.</li></ol><p>Planche anatomique normale historique ; aucune lésion tuberculeuse, sténose ou fonction rénale n’est représentée.</p><p>Original : Henry Vandyke Carter ; Henry Gray, Anatomy of the Human Body, édition 1918, planche 1127 ; <a href="https://commons.wikimedia.org/wiki/File:Kidney_section_vertical.png" target="_blank" rel="noopener">source</a>, <a href="https://creativecommons.org/publicdomain/mark/1.0/" target="_blank" rel="noopener">Domaine public</a>. Pixels conservés ; repères et légende pédagogiques superposés à l’image par Codex, sous la même licence lorsqu’elle s’applique.</p></figcaption></figure>
<h3>3.1 Tuberculose urogénitale</h3>
<p>La propagation est <button class="w" data-k="n29-tb-hematogene">hématogène</button> : le bacille atteint le rein à partir d’une tuberculose pulmonaire latente, parfois dès la primo-infection. Le foyer cortical cicatrise, puis se réactive souvent à partir d’un foyer unique, parfois des décennies plus tard. Les lésions des <button class="w" data-k="n29-papille">papilles</button> se caséifient, forment des cavités et s’ouvrent dans les voies excrétrices. Cette ouverture explique la présence de bacilles dans l’urine, donc la possibilité du diagnostic microbiologique urinaire.</p>
<p>Les bacilles descendent ensuite avec l’urine. Les <button class="w" data-k="n29-stenose-uretere">sténoses urétérales</button> siègent surtout aux jonctions urétéro-vésicale et pyélo-urétérale ; au scanner, le tiers distal est le siège le plus fréquent. La vessie s’enflamme d’abord autour du méat urétéral, puis, sans traitement, évolue vers la fibrose et la <button class="w" data-k="n29-vessie-retractee">petite vessie rétractée</button>. Au stade avancé, le parenchyme peut être remplacé par des calcifications : c’est l’<button class="w" data-k="n29-autonephrectomie">autonéphrectomie</button>. Une atteinte bilatérale peut conduire à l’insuffisance rénale.</p>
<div class="key"><b>À retenir.</b> Le rein tuberculeux s’atteint par le sang, mais les complications obstructives surviennent sur l’uretère et la vessie. Le dommage fonctionnel dépend donc autant de l’obstacle que de la destruction parenchymateuse.</div>
<h3>3.2 Schistosomiase urinaire</h3>
<p>La lésion élémentaire est le <button class="w" data-k="n29-granulome">granulome</button> formé autour de l’œuf piégé dans la paroi : il s’agit d’une réponse d’hypersensibilité de type IV. Les vers adultes eux-mêmes ne lèsent pas directement l’hôte. <i>S. haematobium</i> atteint la vessie, la partie basse des uretères, les vésicules séminales et, plus rarement, la prostate et le tractus génital féminin. Les vers gagnent l’appareil urinaire par des anastomoses veineuses mésentérico-périurétérales situées vers la troisième vertèbre lombaire. C’est pourquoi les lésions urétérales siègent typiquement dans la <b>moitié inférieure</b> des uretères (<button class="w" data-k="n29-uretere-bas">distribution des lésions</button>).</p>
<p>La <b>phase inflammatoire</b> forme des pseudotubercules, des nodules et des ulcérations. L’œdème de la jonction urétéro-vésicale peut créer une obstruction ou un reflux transitoires, <b>réversibles sous traitement antiparasitaire</b>. La <b>phase fibreuse</b> produit des plaques sablonneuses qui se calcifient (calcification vésicale linéaire), une cystite kystique, une rétraction vésicale, des troubles urodynamiques, une obstruction du col vésical et une urétérite kystique. L’uretère supérieur compense souvent par une dilatation-hypertrophie qui protège le rein.</p>
<p>La <button class="w" data-k="n29-schisto-obstruction">néphropathie obstructive</button> survient lorsque cette compensation échoue ou en présence d’un reflux ; l’infection ascendante l’aggrave. La <button class="w" data-k="n29-nic">néphrite interstitielle chronique</button> suit une triade précoce : défaut de concentration, perte sodée et acidose tubulaire. La surinfection bactérienne est fréquente, notamment à salmonelles en zone d’endémie, et les lithiases infectieuses sont fréquentes. Enfin, le <button class="w" data-k="n29-schisto-cancer">cancer de la vessie</button> est une complication tardive majeure.</p>
<h3>3.3 Syphilis tardive et rein</h3>
<p>La syphilis précoce correspond à une infection de moins d’un an, la syphilis tardive à une infection d’au moins un an selon la définition européenne, ou de durée inconnue (<button class="w" data-k="n29-syph-stades">stades</button>). La syphilis tertiaire comprend la forme gommeuse (nodules, plaques ou ulcères cutanés, muqueux ou viscéraux), la neurosyphilis tardive et la syphilis cardiovasculaire. La <button class="w" data-k="n29-syph-glomerulo">glomérulonéphrite</button> est possible dès la syphilis secondaire et dans la syphilis congénitale ; elle se code N08.0*. Dans la syphilis précoce, la lésion la plus fréquente est la glomérulonéphrite extramembraneuse, dont le mécanisme proposé est le dépôt sous-épithélial de complexes immuns contenant des antigènes tréponémiques.</p>
<div class="trap"><span class="k">Lacune du dossier</span> Aucune source lue ne décrit la gomme rénale ni l’atteinte rénale de la syphilis tertiaire proprement dite. Le cours ne peut affirmer ni sa fréquence ni sa présentation ; il décrit ce que la littérature lue documente (la glomérulopathie) en signalant son code distinct.</div>
<h3>3.4 Cystinose néphropathique</h3>
<p>La cystinose est une maladie lysosomale <b>autosomique récessive</b>, due à des variants bialléliques du gène <i>CTNS</i> (17p13.2), qui code la <b>cystinosine</b>, un symport cystine/proton lysosomal (<button class="w" data-k="n29-cyst-gene">génétique et biochimie</button>). Le défaut d’efflux lysosomal de la cystine conduit à son accumulation et à la formation de cristaux dans la plupart des tissus. La fonction tubulaire est préservée à la naissance ; le <button class="w" data-k="n29-fanconi">syndrome de Fanconi</button> débute vers 4 à 6 mois (6 à 12 mois selon une autre source). La cystéamine ne corrige généralement pas les lésions tubulaires déjà installées. Les recommandations 2026 rapportent toutefois qu’un début très précoce, dans les deux premiers mois de vie, peut fortement atténuer le syndrome de Fanconi ; il faut donc éviter une négation absolue de ce bénéfice précoce (Hohenfellner et al., 2026, diagnostic et encadrés 1–3).</p>
<div class="key"><b>À retenir.</b> Le même niveau d’atteinte (le rein) recouvre quatre mécanismes : dissémination bactérienne, granulome d’œuf, complexes immuns, accumulation lysosomale. Le traitement ne se déduit donc jamais du code, mais de la maladie causale.</div>
<button class="pareto-btn ui" data-k="pareto-n29-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="n29-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes de N29 sont les maladies générales elles-mêmes. Pour chacune, le terrain oriente la probabilité avant tout examen.</p>
<table class="t"><thead><tr><th>Maladie causale</th><th>Terrain et facteurs de risque</th><th>Ce que le terrain change</th></tr></thead><tbody><tr><td>Tuberculose urogénitale</td><td>Origine d’un pays à forte incidence ; antécédent de tuberculose (environ un tiers des patients extrapulmonaires) ; insuffisance rénale chronique et diabète, cités parmi les situations à risque de progression</td><td>Elle justifie de chercher une tuberculose chez un migrant avec symptômes urinaires, même sans signe pulmonaire</td></tr><tr><td>Schistosomiase urinaire</td><td>Contact avec de l’eau douce infestée en zone d’endémie ; en Europe, migrants subsahariens, surtout des hommes jeunes</td><td>Elle justifie la recherche d’œufs dans l’urine et une sérologie chez un migrant exposé</td></tr><tr><td>Syphilis tardive</td><td>Infection non traitée d’au moins un an ou de durée inconnue ; la syphilis tertiaire survient chez environ 10 % des patients non traités</td><td>Elle justifie une sérologie devant toute atteinte multisystémique compatible</td></tr><tr><td>Cystinose</td><td>Transmission autosomique récessive, deux variants du gène <i>CTNS</i></td><td>Elle justifie le dosage de la cystine leucocytaire devant un syndrome de Fanconi du jeune enfant</td></tr></tbody></table>
<p>Le tableau associe à chaque maladie un terrain précis. Ce terrain ne remplace pas le diagnostic : il hiérarchise seulement les hypothèses. Une absence de facteur de risque ne dispense pas du bilan lorsque le tableau clinique est évocateur.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer une hématurie ou une leucocyturie stérile à une cause banale parce que le patient est « sans antécédent ». Dans la tuberculose urogénitale, le délai entre l’infection pulmonaire et l’atteinte rénale peut dépasser 30 ans : l’absence d’antécédent connu n’exclut rien.</div>
<button class="pareto-btn ui" data-k="pareto-n29-causes">▲ Loi de Pareto — Causes et terrain</button>
</section>

<section class="ilot" id="n29-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord la maladie causale, car l’atteinte rénale en est la conséquence. Il établit l’origine géographique, les séjours, le contact avec l’eau douce, les antécédents infectieux, l’âge de début des symptômes chez l’enfant et les traitements déjà reçus.</p>
<div class="two"><div class="card"><h4>Tuberculose urogénitale</h4><p>La tuberculose rénale est souvent <b>asymptomatique</b> malgré des lésions importantes. Les premiers signes sont souvent des symptômes urinaires bas non spécifiques ou une <button class="w" data-k="n29-pyurie-sterile">leucocyturie stérile</button>, avec ou sans <button class="w" data-k="n29-hematurie">hématurie</button>.</p>
<p>L’atteinte vésicale donne hématurie, pollakiurie, dysurie et douleurs abdominales, lombaires ou sus-pubiennes. Chez l’homme, on peut trouver une masse scrotale ou épididymaire ; chez la femme, des troubles menstruels ou des douleurs pelviennes.</p>
</div><div class="card"><h4>Schistosomiase urinaire</h4><p>Le signe classique est l’<b>hématurie terminale</b>, avec pollakiurie et dysurie. En Europe, la maladie est le plus souvent <b>silencieuse</b> : 2,2 % des migrants infectés étaient symptomatiques (hématurie 1,8 %, dysurie 1,6 %).</p>
<p>Les formes génitales féminines donnent des lésions génitales, des saignements, une dyspareunie et des nodules vulvaires ; chez l’homme, des douleurs éjaculatoires, une hémospermie et une infertilité possible. Elles augmentent le risque d’infection par le virus de l’immunodéficience humaine.</p>
</div></div>
<div class="two"><div class="card"><h4>Syphilis tardive</h4><p>Le dossier ne décrit pas de symptôme rénal propre à la syphilis tardive. L’interrogatoire cherche le contexte : infection de plus d’un an, ou de durée inconnue, antécédents de syphilis non traitée ou traitée de manière incertaine, manifestations cutanées, neurologiques ou cardiovasculaires.</p>
<p>Dans la syphilis précoce, un syndrome néphrotique (œdèmes) oriente vers la glomérulopathie, qui se code N08.0*.</p>
</div><div class="card"><h4>Cystinose néphropathique</h4><p>L’enfant présente une polyurie, une polydipsie, un retard de croissance, des vomissements, une constipation, une déshydratation et un rachitisme. Au moins 50 % des enfants sont diagnostiqués après l’âge d’un an.</p>
<p>Chez l’adolescent ou l’adulte, l’histoire peut être plus discrète : photophobie, érosions cornéennes, protéinurie isolée ou Fanconi atténué selon la forme.</p>
</div></div>
<div class="key"><b>À retenir.</b> Une hématurie en fin de miction chez un migrant évoque la schistosomiase ; une leucocyturie stérile oriente vers la tuberculose ; un retard de croissance avec polyurie chez le nourrisson oriente vers la cystinose. Aucun de ces signes ne suffit sans confirmation biologique.</div>
</section>

<section class="ilot" id="n29-6"><h2 data-semiology-clinical="N29"><span class="n">6</span>Examen clinique</h2>
<p>L’examen commence par l’état général et les signes vitaux, puis recherche les signes de la maladie causale et ceux de l’atteinte urinaire. Les constatations sont généralement pauvres ; c’est l’orientation par le terrain qui donne leur valeur aux examens complémentaires.</p>
<div class="two"><div class="card"><h4>Tuberculose</h4><p>L’examen peut être normal, car la tuberculose rénale est souvent asymptomatique. Chez l’homme, on palpe le scrotum et l’épididyme (masse) et on inspecte le pénis (ulcération) ; chez la femme, on recherche une douleur pelvienne.</p>
<p>Une douleur lombaire ou sus-pubienne, rapportée par le patient ou provoquée à la palpation, oriente vers l’atteinte vésicale ou urétérale.</p>
</div><div class="card"><h4>Schistosomiase</h4><p>Elle est le plus souvent silencieuse à l’examen. On recherche l’hématurie macroscopique et les signes de retentissement obstructif ou génital (nodules vulvaires, hémospermie).</p>
<p>La bandelette urinaire détecte l’hématurie microscopique, quasi constante chez l’enfant infecté par <i>S. haematobium</i>.</p>
</div></div>
<div class="two"><div class="card"><h4>Syphilis</h4><p>L’examen cherche les stigmates de syphilis tertiaire : lésions gommeuses cutanées ou muqueuses, signes neurologiques et cardiovasculaires. Les œdèmes orientent vers un syndrome néphrotique.</p>
<p>Un examen normal n’exclut pas la maladie.</p>
</div><div class="card"><h4>Cystinose</h4><p>L’examen mesure la croissance et la taille, recherche un rachitisme (signes osseux, douleurs osseuses), une déshydratation et une photophobie. À la bandelette : faible densité, glycosurie et albuminurie modérée.</p>
<p>La créatinine est souvent normale chez le jeune enfant : la fonction glomérulaire préservée ne signifie pas l’absence de maladie tubulaire.</p>
</div></div>
<div class="trap"><span class="k">Piège</span> Un examen clinique normal est fréquent dans ces quatre maladies. La décision d’explorer repose sur le terrain (origine, contact avec l’eau douce, âge de l’enfant) et sur les anomalies urinaires.</div>
