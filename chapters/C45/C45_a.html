<section class="ilot" id="c45-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Monsieur R., 71 ans, a travaillé comme électricien de 1972 à 1995 dans la rénovation de bâtiments. Il consulte parce qu’il s’essouffle depuis deux mois en montant un étage et qu’une douleur sourde, profonde et permanente occupe son hémithorax droit. De plus, il a perdu 4 kg. La radiographie montre un épanchement pleural droit abondant, et le scanner décrit un épaississement pleural nodulaire qui entoure le poumon.</p>
<p>Ce tableau soulève trois questions que le cours traite dans l’ordre. D’abord, pourquoi l’association d’un épanchement unilatéral, d’une douleur thoracique et d’une exposition ancienne à l’amiante doit-elle faire évoquer un mésothéliome ? Ensuite, quel prélèvement apporte un diagnostic certain, alors que la cytologie du liquide est souvent négative ? Enfin, quels traitements prolongent la survie, et quelles démarches sociales le médecin doit-il engager dès le diagnostic ?</p>
<div class="key"><b>Objectifs.</b> Vous saurez relier l’exposition à l’amiante au <button class="w" data-k="c45-mecanisme">mécanisme de cancérogenèse (fenêtre détaillée)</button>, obtenir une preuve histologique par <button class="w" data-k="c45-thoraco">thoracoscopie (technique et raisons de ce choix)</button>, choisir entre <button class="w" data-k="c45-nivoipi">l’association nivolumab et ipilimumab (monographie)</button> et la <button class="w" data-k="c45-pemetrexed">chimiothérapie par pémétrexed et sel de platine (monographie)</button>, et déclarer la maladie à l’assurance-accidents.</div>
<p class="src">Références : <a href="https://www.annalsofoncology.org/article/S0923-7534(21)04820-1/fulltext" target="_blank" rel="noopener">Popat et al., ESMO 2022</a> ; <a href="https://academic.oup.com/ejcts/article/58/1/1/5843681" target="_blank" rel="noopener">Scherpereel et al., ERS/ESTS/EACTS/ESTRO 2020</a>.</p></section>
<section class="ilot" id="c45-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Le mésothéliome est une tumeur maligne primitive née des cellules mésothéliales, c’est-à-dire de la couche cellulaire unique qui tapisse les séreuses : la plèvre, le péritoine, le péricarde et la vaginale du testicule. Il se distingue donc des métastases pleurales d’un cancer bronchique, mammaire ou ovarien, qui sont beaucoup plus fréquentes et qui peuvent l’imiter à l’imagerie comme à l’œil nu. Dans la CIM-10-GM, le quatrième caractère du code C45 précise la localisation : 0 pour la plèvre, qui représente la grande majorité des cas, 1 pour le péritoine, 2 pour le péricarde, 7 pour les autres sièges et 9 en l’absence de précision. Ce cours traite surtout la forme pleurale, et il signale les particularités des autres sièges dans l’îlot 12.</p>
<h3>Trois sous-types histologiques</h3>
<p>La <button class="w" data-k="c45-oms">classification de l’OMS de 2021 (sous-types et grade)</button> distingue trois sous-types, parce que leur pronostic et leur réponse aux traitements diffèrent. Le sous-type <b>épithélioïde</b> est le plus fréquent et le moins défavorable ; l’ESMO recommande d’en préciser le grade, car le grade sépare des groupes de survie différente. Le sous-type <b>sarcomatoïde</b>, fait de cellules fusiformes, est le plus agressif et répond mal à la chimiothérapie. Le sous-type <b>biphasique</b> associe enfin les deux composantes. Par ailleurs, l’OMS de 2021 a abandonné l’adjectif « malin », car tous les mésothéliomes diffus sont malins ; l’expression « mésothéliome malin » reste cependant d’usage courant et désigne la même maladie.</p>
<div class="trap"><span class="k">Piège</span>Une tumeur pleurale diffuse n’est pas forcément un mésothéliome. En effet, les métastases pleurales d’un adénocarcinome et même un cancer à petites cellules peuvent engainer le poumon de la même façon ; seule l’immunohistochimie tranche.</div>
<div class="key"><b>À retenir.</b> Le mésothéliome naît du mésothélium, siège surtout dans la plèvre et se divise en sous-types épithélioïde, sarcomatoïde et biphasique, dont dépendent le pronostic et le choix du traitement.</div>
<p class="src">Références : ESMO 2022, section Pathology ; ERS/ESTS/EACTS/ESTRO 2020, section Pathology.</p></section>
<section class="ilot" id="c45-2"><h2><span class="n">2</span>Épidémiologie en Suisse</h2>
<p>Ces définitions posées, il faut mesurer l’ampleur du problème en Suisse. Le Registre suisse du cancer a recensé 342 mésothéliomes sur la période 1984–1988, puis 846 sur la période 2004–2008, soit plus du double en vingt ans (swissinfo, d’après les registres). Cette hausse s’explique par le long délai entre l’exposition et la maladie : l’amiante, très employé dans la construction et l’industrie au cours des années 1960 et 1970, n’est en effet interdit en Suisse que depuis 1989–1990.</p>
<p>Par conséquent, la maladie continue de toucher des personnes exposées il y a plusieurs décennies. Selon la Revue médicale suisse (2023), l’exposition professionnelle à l’amiante cause chaque année environ 135 décès par mésothéliome en Suisse ; la Suva estime de son côté qu’environ 120 personnes par an meurent d’un mésothéliome. De plus, une analyse d’Unisanté fondée sur les données de la Suva attribue 85 % des mésothéliomes pleuraux à une exposition professionnelle. Enfin, de nouveaux cas apparaissent encore chez des ouvriers exposés lors d’assainissements de bâtiments mal protégés, ce qui explique l’obligation de rechercher l’amiante avant tout chantier dans un bâtiment construit avant 1990.</p>
<div class="key"><b>À retenir.</b> En Suisse, le mésothéliome cause environ 120 à 135 décès par an ; l’interdiction de l’amiante date de 1989–1990, mais le délai de latence fait que les cas persistent.</div>

<section class="ilot" id="c45-3"><h2><span class="n">3</span>De la fibre d’amiante à la tumeur</h2>
<p>Pour comprendre la maladie, il faut suivre la fibre depuis l’inhalation. Les fibres d’amiante, longues et fines, échappent en effet à l’épuration mucociliaire des bronches et atteignent le poumon profond ; une partie migre ensuite vers la plèvre par les voies lymphatiques, où elle se fixe surtout sur la plèvre pariétale. Les macrophages tentent alors de phagocyter ces fibres, mais ils n’y parviennent pas lorsqu’elles sont plus longues qu’eux : cette <b>phagocytose frustrée</b> entretient une inflammation chronique, avec production de radicaux libres et de cytokines.</p>
<p>Cette inflammation persistante endommage l’ADN des cellules mésothéliales et stimule leur prolifération pendant des décennies. Ainsi s’accumulent des pertes de gènes suppresseurs de tumeur, principalement <button class="w" data-k="c45-bap1">BAP1 et CDKN2A (rôle et intérêt diagnostique)</button>. Une cellule qui a perdu ces freins se divise sans contrôle ; c’est pourquoi le délai entre la première exposition et le diagnostic atteint typiquement plusieurs décennies, de l’ordre de 40 ans.</p>
<h3>Des mécanismes aux symptômes</h3>
<p>La tumeur se développe d’abord sous forme de petits nodules de la plèvre pariétale, qui confluent ensuite en une gangue continue autour du poumon. Deux conséquences en découlent. D’une part, la tumeur sécrète du liquide et bloque son drainage lymphatique, d’où l’épanchement pleural et la dyspnée. D’autre part, elle envahit la paroi thoracique et ses nerfs intercostaux, d’où une douleur profonde et permanente, alors que la gangue tumorale bride le poumon et réduit son expansion.</p>

<section class="ilot" id="c45-4"><h2><span class="n">4</span>Facteurs de risque et anamnèse professionnelle</h2>
<p>L’<b>amiante</b> est de loin le principal facteur de risque. Les métiers exposés comprennent notamment les plombiers et chauffagistes, les électriciens, les mécaniciens automobiles, les charpentiers et couvreurs, les ouvriers des chantiers navals, les démolisseurs et aujourd’hui les travailleurs du désamiantage (Unisanté). Comme la latence est longue, l’interrogatoire doit remonter à toute la carrière et pas seulement au dernier emploi ; il faut aussi rechercher une exposition domestique, par exemple chez une personne qui lavait les vêtements de travail d’un proche.</p>
<p>D’autres facteurs sont plus rares. Une radiothérapie thoracique antérieure augmente le risque, et une prédisposition héréditaire existe : le <button class="w" data-k="c45-bap1">syndrome de prédisposition tumorale lié à BAP1 (fenêtre)</button> associe mésothéliome, mélanome uvéal et autres cancers. Toutefois, l’ESMO ne recommande pas de rechercher une mutation germinale chez un patient dont la tumeur a perdu BAP1, sauf si l’histoire familiale évoque ce syndrome, car la perte de BAP1 est le plus souvent acquise dans la tumeur seule.</p>
<p>En revanche, les <button class="w" data-k="c45-plaques">plaques pleurales (signification)</button> ne sont pas une lésion précancéreuse. Elles témoignent seulement d’une exposition passée à l’amiante ; c’est pourquoi leur découverte impose de noter l’exposition et d’informer le patient, sans justifier de dépistage, puisqu’aucune étude ne soutient un dépistage du mésothéliome chez les personnes exposées (ESMO 2022).</p>

<div class="trap"><span class="k">Erreur fréquente</span>Le tabac n’est pas un facteur de risque du mésothéliome, contrairement au cancer bronchique. En revanche, l’amiante et le tabac multiplient leurs effets sur le risque de cancer bronchique ; c’est pourquoi un ancien ouvrier exposé et fumeur doit être interrogé sur les deux expositions.</div>
<div class="key"><b>À retenir.</b> Interrogez toute la carrière professionnelle et l’environnement domestique ; les plaques pleurales prouvent l’exposition, mais elles ne dégénèrent pas.</div>

<section class="ilot" id="c45-5"><h2><span class="n">5</span>Interroger</h2>
<p>L’interrogatoire précise d’abord l’<button class="w" data-k="c45-expo">exposition à l’amiante (questions à poser)</button>, puis l’état fonctionnel, parce que l’accès aux traitements dépend de l’<button class="w" data-k="c45-ecog">indice de performance de l’Eastern Cooperative Oncology Group (échelle)</button>. Il recherche ensuite les symptômes, qui sont peu spécifiques ; c’est leur association avec une exposition qui doit alerter.</p>
<div class="two"><div class="card"><h4>Présentation typique</h4><p>Un homme âgé, exposé à l’amiante des décennies plus tôt, se plaint d’une dyspnée progressive due à l’épanchement et d’une douleur thoracique sourde, latérale et permanente, qui traduit l’envahissement de la paroi. De plus, il signale souvent un amaigrissement et des sueurs.</p></div><div class="card"><h4>Présentations trompeuses</h4><p>Un épanchement pleural « idiopathique » récidive après plusieurs ponctions dont la cytologie est négative. Parfois, une douleur thoracique isolée précède l’épanchement ; parfois encore, une ascite révèle une forme péritonéale. Dans tous ces cas, l’absence de cellules malignes dans le liquide n’écarte pas le diagnostic.</p></div></div>
<div class="key"><b>À retenir.</b> Devant un épanchement pleural unilatéral avec douleur thoracique, demandez toujours le métier exercé tout au long de la vie.</div>
<p class="src">Références : ESMO 2022, section Diagnosis ; ERS/ESTS/EACTS/ESTRO 2020, section Monitoring.</p></section>
<section class="ilot" id="c45-6"><h2><span class="n">6</span>Examiner</h2>
<p>L’examen clinique mesure d’abord la tolérance de la maladie, puis il recherche ses extensions. En effet, l’ERS de 2020 retient l’indice de performance comme l’un des trois facteurs pronostiques majeurs, avec le sous-type histologique et le volume tumoral.</p>
<div class="two"><div class="card"><h4>État général et constantes</h4><p>Le médecin note le poids et la perte de poids en pourcentage, la fréquence respiratoire et la saturation pulsée en oxygène au repos. Une désaturation au repos traduit un épanchement abondant ou un poumon bridé, et elle impose d’abord un geste d’évacuation.</p></div><div class="card"><h4>Signes thoraciques</h4><p>Une matité, une abolition du murmure vésiculaire et des vibrations vocales signent l’<button class="w" data-k="c45-epanch">épanchement pleural (signes et mécanisme)</button>. À un stade avancé, l’hémithorax se rétracte et les espaces intercostaux se pincent, parce que la gangue tumorale fige le poumon ; à l’inverse, un épanchement libre refoule le médiastin vers le côté opposé.</p></div></div>
<div class="two"><div class="card"><h4>Paroi et trajets</h4><p>Le médecin palpe la paroi et les cicatrices de ponction ou de thoracoscopie, car le mésothéliome peut envahir les trajets d’aiguille et y former un nodule sous-cutané.</p></div><div class="card"><h4>Extension</h4><p>Il recherche enfin une adénopathie sus-claviculaire, une ascite et un frottement ou un assourdissement des bruits du cœur, qui évoquent une atteinte péricardique.</p></div></div>
<div class="key"><b>À retenir.</b> L’indice de performance, le sous-type et le volume tumoral déterminent le pronostic ; un hémithorax rétracté avec matité oriente vers une gangue pleurale plutôt que vers un épanchement libre.</div>
<p class="src">Références : ERS/ESTS/EACTS/ESTRO 2020, section Monitoring.</p>
