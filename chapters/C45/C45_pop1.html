<template data-pop="c45-mecanisme" data-title="De la fibre d’amiante au mésothéliome">
<p class="lab">Étape 1 : la fibre atteint la plèvre</p><p>Les fibres d’amiante sont longues et fines ; elles échappent donc au tapis mucociliaire, atteignent les alvéoles puis migrent vers la plèvre pariétale par les lymphatiques, où elles restent piégées près des stomates.</p>
<p class="lab">Étape 2 : la phagocytose échoue</p><p>Le macrophage ne peut pas englober une fibre plus longue que lui. Il libère alors des radicaux libres et des cytokines inflammatoires, et ce phénomène, appelé phagocytose frustrée, se répète pendant des années puisque la fibre ne se dégrade pas.</p>
<p class="lab">Étape 3 : l’ADN s’altère</p><p>Les radicaux libres lèsent l’ADN des cellules mésothéliales, tandis que les cytokines les poussent à se diviser. Au fil des divisions s’accumulent des pertes de gènes suppresseurs, en particulier BAP1 et CDKN2A ; la cellule échappe alors au contrôle de sa prolifération.</p>
<div class="key"><b>Conséquence pratique.</b> Comme ce processus dure des décennies, le mésothéliome apparaît typiquement une quarantaine d’années après la première exposition ; c’est pourquoi l’anamnèse professionnelle doit couvrir toute la vie active.</div></template>
<template data-pop="c45-oms" data-title="Classification de l’OMS de 2021 des mésothéliomes">
<p>L’OMS distingue les lésions précurseurs, comme le mésothéliome in situ, et le mésothéliome diffus, qu’elle divise en trois sous-types. Le sous-type épithélioïde est fait de cellules cubiques organisées en tubes, papilles ou massifs ; l’ESMO recommande d’en préciser le grade, parce que le grade sépare des pronostics différents. Le sous-type sarcomatoïde est fait de cellules fusiformes, et il a le pronostic le plus sombre. Le sous-type biphasique associe enfin les deux contingents.</p>
<div class="key"><b>Pourquoi c’est utile.</b> Le sous-type oriente le traitement : dans les formes non épithélioïdes, l’immunothérapie apporte le bénéfice le plus net, car la chimiothérapie y est peu active.</div></template>
<template data-pop="c45-bap1" data-title="BAP1 et CDKN2A : gènes suppresseurs perdus">
<p>BAP1 code une enzyme nucléaire qui retire l’ubiquitine des protéines et qui participe à la réparation de l’ADN ; sa perte, fréquente dans le sous-type épithélioïde, se voit en immunohistochimie par l’absence de coloration nucléaire. CDKN2A, situé sur le chromosome 9 en 9p21.3, code la protéine p16, qui freine le cycle cellulaire ; sa délétion est fréquente dans le sous-type sarcomatoïde. Comme le gène MTAP se trouve juste à côté, sa perte en immunohistochimie sert de témoin de la délétion de CDKN2A, avec une spécificité de 96 % et une sensibilité de 78 %.</p>
<p>Une mutation germinale de BAP1 définit un syndrome de prédisposition qui associe mésothéliome, mélanome uvéal et autres cancers. Toutefois, l’ESMO ne recommande pas de recherche germinale systématique chez un patient dont la tumeur a perdu BAP1, sauf si l’histoire familiale évoque ce syndrome, car la perte est le plus souvent acquise dans la seule tumeur.</p>
<div class="key"><b>Source.</b> ESMO 2022, section Pathology and molecular biology.</div></template>

<p>Les plaques pleurales sont des épaississements fibreux, souvent calcifiés, de la plèvre pariétale et diaphragmatique. Elles traduisent une exposition passée à l’amiante, car les fibres déposées près des stomates provoquent une cicatrisation lente. Elles ne gênent en général pas la respiration et ne se transforment pas en mésothéliome.</p>
<div class="key"><b>Conduite.</b> Notez l’exposition, informez le patient et signalez la situation à l’assureur-accidents si l’exposition était professionnelle ; aucun dépistage du mésothéliome n’est recommandé.</div></template>
<template data-pop="c45-expo" data-title="Questions pour reconstituer l’exposition à l’amiante">
<p>Le médecin demande la liste chronologique des emplois depuis l’apprentissage, car l’exposition responsable remonte souvent à plusieurs décennies. Il précise pour chaque poste les travaux effectués : découpe ou perçage de plaques de fibrociment, isolation de conduites, flocage, remplacement de garnitures de freins, démolition ou rénovation de bâtiments construits avant 1990. Il demande aussi si le patient a lavé les vêtements de travail d’un proche exposé, car l’exposition domestique suffit à causer la maladie.</p>
<div class="key"><b>Pourquoi c’est indispensable.</b> Cette anamnèse soutient le diagnostic, et elle conditionne la reconnaissance en maladie professionnelle, qui ouvre des droits au patient et à sa famille.</div></template>
<template data-pop="c45-ecog" data-title="Indice de performance de l’Eastern Cooperative Oncology Group">
<table class="t"><tr><th>Grade</th><th>Description</th></tr><tr><td>0</td><td>Le patient est pleinement actif, sans restriction.</td></tr><tr><td>1</td><td>Il est limité dans les activités physiques intenses, mais il marche et peut effectuer un travail léger.</td></tr><tr><td>2</td><td>Il marche et s’occupe de lui-même, mais il ne peut pas travailler ; il est debout plus de la moitié de la journée.</td></tr><tr><td>3</td><td>Il ne s’occupe de lui-même que partiellement et reste au lit ou au fauteuil plus de la moitié de la journée.</td></tr><tr><td>4</td><td>Il est totalement dépendant et confiné au lit ou au fauteuil.</td></tr><tr><td>5</td><td>Le patient est décédé.</td></tr></table>
<div class="key"><b>Pourquoi le mesurer.</b> CheckMate 743 n’a inclus que des patients de grade 0 ou 1 ; le bénéfice des traitements systémiques n’est donc démontré que dans ce groupe.</div></template>
<template data-pop="c45-epanch" data-title="Signes d’épanchement pleural et leur mécanisme">
<p>Le liquide s’interpose entre le poumon et la paroi. Il empêche donc la transmission des vibrations vocales, ce qui explique leur abolition, et il rend la percussion mate parce que le liquide ne résonne pas comme l’air. Le murmure vésiculaire disparaît enfin, car le poumon refoulé ventile moins et le liquide arrête le son.</p>
<div class="key"><b>Particularité du mésothéliome.</b> Un épanchement libre refoule le médiastin vers le côté opposé ; à l’inverse, une gangue tumorale rétracte l’hémithorax, et le médiastin reste en place ou attiré du côté malade.</div></template>

<p>Le scanner injecté du thorax et de l’abdomen supérieur est l’examen d’imagerie de référence. Quatre signes évoquent une plèvre maligne plutôt qu’une pleurésie bénigne : un épaississement circonférentiel, un aspect nodulaire, une épaisseur de plus de 1 cm et une atteinte de la plèvre médiastinale. Le scanner recherche aussi des plaques pleurales calcifiées, qui témoignent de l’exposition, ainsi qu’une extension à la paroi, au diaphragme ou au péricarde.</p>
<div class="key"><b>Conseil pratique.</b> Réalisez le scanner avant d’évacuer tout le liquide, car l’épanchement aide à voir la plèvre, alors qu’un pneumothorax ou un talcage préalable en modifie l’aspect.</div></template>
<template data-pop="c45-cyto" data-title="Cytologie du liquide pleural : pourquoi elle déçoit">
<p>Les cellules d’un mésothéliome épithélioïde ressemblent beaucoup aux cellules mésothéliales réactives, et les formes sarcomatoïdes desquament peu dans le liquide. C’est pourquoi le rendement de la cytologie varie de 0 à 73 % selon les séries. De plus, la cytologie ne montre pas l’invasion des tissus profonds, qui est le critère morphologique de malignité.</p>
<div class="key"><b>Conduite.</b> Une cytologie positive avec immunohistochimie confirmée oriente fortement ; une cytologie négative ne permet jamais d’exclure le diagnostic et conduit à la thoracoscopie.</div></template>

e qui engaine le poumon montre ce que l’opérateur voit et biopsie lors d’une thoracoscopie : une plèvre épaissie et nodulaire. Source : <a href="https://commons.wikimedia.org/wiki/File:Diffuse_pleural_mesothelioma.jpg" target="_blank" rel="noopener" data-reference-source="1">The Armed Forces Institute of Pathology (AFIP), Wikimedia Commons</a> ; <a href="https://commons.wikimedia.org/wiki/Help:Public_domain" target="_blank" rel="noopener" data-reference-source="1">licence Public domain</a> ; image redimensionnée et allégée pour l’atlas.</figcaption></figure>
<p>Le pneumologue ou le chirurgien introduit une optique dans l’espace pleural, sous anesthésie locale avec sédation (pleuroscopie) ou sous anesthésie générale (chirurgie thoracique vidéo-assistée). Il évacue le liquide, inspecte la plèvre pariétale, viscérale et diaphragmatique, puis prélève des biopsies profondes sur plusieurs sites.</p>
<p>Ce geste est préféré pour trois raisons. D’abord, des biopsies profondes, idéalement sur trois sites, montrent l’invasion de la graisse ou du muscle et suffisent à préciser le sous-type. Ensuite, l’inspection directe évalue l’extension. Enfin, le talc peut être pulvérisé dans le même temps pour prévenir la récidive de l’épanchement.</p>
<div class="key"><b>Alternative.</b> En cas de symphyse pleurale ou d’état général altéré, des biopsies percutanées guidées par le scanner ou l’échographie sont une bonne alternative.</div></template>

<p>Pour un mésothéliome épithélioïde, le pathologiste associe au moins deux marqueurs mésothéliaux, choisis parmi la calrétinine, la protéine WT-1 et la cytokératine 5/6, et deux marqueurs de carcinome, comme l’antigène carcino-embryonnaire, Ber-EP4 ou MOC-31. Les marqueurs mésothéliaux doivent être positifs et ceux de carcinome négatifs. Il ajoute ensuite d’autres marqueurs selon le cancer primitif suspecté, par exemple TTF-1 pour un adénocarcinome bronchique.</p>
<div class="key"><b>Pourquoi deux et deux.</b> Aucun marqueur n’est parfaitement spécifique ; la combinaison affirme une lignée et en écarte une autre, ce qui réduit le risque de confondre un mésothéliome avec une métastase.</div></template>
<template data-pop="c45-tnm" data-title="Classification TNM du mésothéliome pleural, 8e édition">
<p class="lab">Tumeur (T)</p><p>T1 désigne une tumeur limitée à la plèvre pariétale homolatérale, avec ou sans atteinte de la plèvre viscérale, médiastinale ou diaphragmatique. T2 ajoute une invasion du muscle diaphragmatique ou du parenchyme pulmonaire. T 3 désigne une tumeur localement avancée mais potentiellement résécable, qui atteint le fascia endothoracique, la graisse médiastinale, un foyer unique de la paroi ou le péricarde sans le traverser. T 4 désigne une tumeur non résécable, qui envahit la paroi de façon diffuse, le péritoine à travers le diaphragme, la plèvre controlatérale, les organes médiastinaux, le rachis ou le myocarde.</p>
<p class="lab">Ganglions (N) et métastases (M)</p><p>N1 correspond aux ganglions intrathoraciques homolatéraux, y compris médiastinaux et mammaires internes. N2 correspond aux ganglions médiastinaux controlatéraux ou sus-claviculaires. M1 désigne des métastases à distance.</p>
<div class="key"><b>Source.</b> UICC, 8e édition, retenue par l’ESMO 2022 et l’ERS 2020 ; la distinction entre T 3 et T 4 sert surtout à juger de la résécabilité.</div></template>
<template data-pop="c45-talc" data-title="Talcage pleural : mécanisme de la symphyse">
<p>Le talc pulvérisé dans l’espace pleural provoque une inflammation qui fait adhérer la plèvre viscérale à la plèvre pariétale ; l’espace pleural disparaît alors, et le liquide ne peut plus s’accumuler. Pour que cette symphyse se forme, le poumon doit se réexpandre et venir au contact de la paroi.</p>
<div class="key"><b>Choix de la technique.</b> L’ESMO préfère le talcage par thoracoscopie à la pleurectomie partielle vidéo-assistée. Si le poumon reste bridé, un drain pleural tunnélisé permet des évacuations répétées à domicile.</div></template>
<template data-pop="c45-suva" data-title="Déclarer un mésothéliome à l’assurance-accidents">
<p>La liste des substances nocives et des affections professionnelles figure à l’annexe 1 de l’ordonnance sur l’assurance-accidents, et la loi fédérale sur l’assurance-accidents assimile une maladie professionnelle reconnue à un accident professionnel. Le médecin informe donc le patient et transmet une déclaration à l’assureur-accidents auquel le patient était affilié au moment de l’exposition, souvent la Suva.</p>
<p>Une fois la maladie reconnue, l’assureur prend en charge les traitements et alloue des prestations en espèces, y compris aux survivants. Si l’exposition n’était pas professionnelle, la prise en charge relève de l’assurance-maladie obligatoire.</p>
<div class="key"><b>Pourquoi agir tôt.</b> L’enquête sur l’exposition peut être longue, et le patient doit pouvoir y participer ; l’ESMO souligne aussi la portée médico-légale de la confirmation histologique.</div></template>
<template data-pop="c45-pemetrexed" data-title="Pémétrexed : monographie">
<p class="lab">Mécanisme</p><p>Le pémétrexed est un antifolate qui inhibe plusieurs enzymes de la synthèse des nucléotides, dont la thymidylate synthase. La cellule tumorale manque alors des précurseurs de l’ADN et ne peut plus se diviser.</p>
<p class="lab">Preuves</p><p>L’association au cisplatine est le standard de chimiothérapie de première ligne du mésothéliome, et elle servait de bras de comparaison dans CheckMate 743.</p>
<p class="lab">Posologie</p><p>La dose est de 500 mg/m² par voie intraveineuse le premier jour de chaque cycle de 21 jours, avec cisplatine 75 mg/m² ou carboplatine pour une aire sous la courbe de 5, jusqu’à six cycles.</p>
<p class="lab">Prémédication obligatoire</p><p>Le patient prend de l’acide folique, de 350 à 1000 µg par jour, et reçoit de la vitamine B12, 1000 µg par voie intramusculaire tous les trois cycles, afin de réduire la toxicité ; il prend aussi de la dexaméthasone, 4 mg deux fois par jour pendant trois jours, afin de prévenir les réactions cutanées.</p>
<p class="lab">Contre-indications et surveillance</p><p>Le pémétrexed n’est pas recommandé si la clairance de la créatinine est inférieure à 45 mL/min, parce qu’il s’élimine par le rein. Avant chaque cycle, les neutrophiles doivent atteindre au moins 1500/mm³ et les plaquettes 100 000/mm³.</p>
<div class="key"><b>Source.</b> Résumé des caractéristiques du produit Alimta, Agence européenne des médicaments, consulté le 09.10.2026 ; information professionnelle suisse à confronter.</div></template>
<template data-pop="c45-nivoipi" data-title="Nivolumab et ipilimumab : monographie">
<p class="lab">Mécanisme</p><p>Le nivolumab bloque le récepteur PD-1 des lymphocytes T et empêche la tumeur d’éteindre les lymphocytes déjà activés. L’ipilimumab bloque CTLA-4, un frein qui agit plus tôt, lors de l’activation des lymphocytes dans les ganglions. Les deux blocages se complètent, car ils lèvent deux freins à deux étapes différentes de la réponse immunitaire.</p>
<p class="lab">Preuves</p><p>Dans CheckMate 743, 605 patients non opérables, d’indice de performance 0 ou 1, ont reçu soit l’association, soit une chimiothérapie. La survie globale a augmenté (rapport de risque 0,74), avec 23 % de survivants à trois ans contre 15 %, et le bénéfice était maximal dans les formes non épithélioïdes.</p>
<p class="lab">Posologie</p><p>L’essai et l’ESMO emploient le nivolumab à 3 mg/kg toutes les 2 semaines et l’ipilimumab à 1 mg/kg toutes les 6 semaines, pendant deux ans au plus ; le schéma autorisé en Suisse doit être lu dans les informations professionnelles Opdivo et Yervoy.</p>
<p class="lab">Effets indésirables</p><p>Les effets immunitaires peuvent toucher le poumon, l’intestin, le foie, la thyroïde, l’hypophyse et la peau ; dans l’essai, ils ont conduit à l’arrêt du traitement chez 23 % des patients.</p>
<div class="key"><b>Sources.</b> ESMO 2022 ; Baas et al., Lancet 2021.</div></template>
<template data-pop="pareto-c45-clin" data-title="Pareto — Mécanismes et clinique"><p class="ratio" data-cover="c45-0,c45-1,c45-2,c45-3,c45-4,c45-5,c45-6"></p><ul><li>Le mésothéliome naît du mésothélium, surtout pleural, et se divise en trois sous-types.</li><li>En Suisse, il cause environ 120 à 135 décès par an, malgré l’interdiction de l’amiante en 1989–1990.</li><li>La phagocytose frustrée et la perte de BAP1 et CDKN2A expliquent une latence d’environ 40 ans.</li><li>Un épanchement unilatéral avec douleur thoracique chez une personne exposée doit faire évoquer le diagnostic.</li><li>Les plaques pleurales prouvent l’exposition, mais elles ne dégénèrent pas.</li></ul></template>
<template data-pop="pareto-c45-ttt" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="c45-7,c45-8,c45-9,c45-10"></p><ul><li>Le scanner injecté oriente, la thoracoscopie avec biopsies profondes prouve, et l’immunohistochimie confirme.</li><li>Une cytologie négative n’exclut jamais le diagnostic.</li><li>L’association nivolumab et ipilimumab est recommandée en première ligne, avec un bénéfice maximal dans les formes non épithélioïdes.</li><li>Le talcage prévient la récidive de l’épanchement si le poumon se réexpand.</li></ul></template>
<template data-pop="pareto-c45-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="c45-s-anat-body,c45-s-histo-body,c45-s-phys-body"></p><ul><li>Seule la plèvre pariétale est innervée, ce qui explique la douleur d’envahissement.</li><li>La calrétinine marque la lignée mésothéliale.</li><li>L’épanchement résulte d’une filtration accrue et d’un drainage lymphatique bloqué.</li></ul></template>
<template data-pop="pareto-c45-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c45-p-1,c45-p-2,c45-p-3"></p><ul><li>Le pémétrexed exige acide folique, vitamine B12 et dexaméthasone, ainsi qu’une clairance d’au moins 45 mL/min.</li><li>L’immunothérapie expose à des effets immunitaires qu’il faut rechercher devant tout symptôme nouveau.</li></ul></template>
