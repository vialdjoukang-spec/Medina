<template data-pop="r04-d-atx" data-title="Acide tranexamique"><p class="lab">Mécanisme</p><p>L’acide tranexamique est un antifibrinolytique : il inhibe la transformation du plasminogène en plasmine et empêche donc la dissolution de la fibrine du caillot. Son activité est environ dix fois celle de l’acide aminocaproïque. Sa biodisponibilité orale est d’environ 40 %, sa demi-vie de 2 heures, et il est presque totalement éliminé par le rein sous forme inchangée, ce qui explique la réduction de dose en cas d’insuffisance rénale.</p><p class="lab">Preuves dans l’hémoptysie</p><p>La revue Cochrane de 2016 n’a retenu que deux essais randomisés : acide tranexamique oral chez 46 patients en Thaïlande, intraveineux chez 24 patients tuberculeux au Pérou. La durée du saignement était réduite d’environ 19,5 heures (différence moyenne pondérée −19,47 heures), sans effet sur la rémission à sept jours ; les preuves sont jugées insuffisantes pour recommander ou rejeter le traitement. Deux essais plus récents ont testé la nébulisation (fenêtre dédiée). Le Collège français le juge non systématique, par voie intraveineuse ou inhalée.</p><p class="lab">Statut en Suisse et posologie</p><p>L’hémoptysie ne figure pas dans les indications suisses ; son usage y est donc hors indication. Par voie intraveineuse (Tranexamic acid Leman®), la dose est de 0,5 à 1 g en injection lente de 1 mL/min deux à trois fois par jour pour une fibrinolyse locale, et de 1 g toutes les 6 à 8 heures pour une fibrinolyse générale. Par voie orale (Cyklokapron®), le patient prend 2 à 3 comprimés de 500 mg deux à trois fois par jour. La dose est réduite selon la créatinine (îlot Doses).</p><p class="lab">Effets indésirables</p><p>Nausées, vomissements, diarrhée (plus de 5 % par voie orale), céphalées, vertiges ; rarement troubles de la vision des couleurs et événements thromboemboliques ; convulsions, surtout à forte dose intraveineuse ; bradycardie et asystolie si l’injection est trop rapide.</p><p class="lab">Contre-indications</p><p>Thrombose veineuse ou artérielle aiguë, antécédent de convulsions, insuffisance rénale grave, coagulation intravasculaire disséminée (sauf fibrinolyse prédominante avec hémorragie grave), voie intrathécale ou péridurale ; pour la forme orale, en outre, antécédent connu de thrombose et hémorragie sous-arachnoïdienne.</p><div class="key"><b>Surveillance.</b> Signes de thrombose, vision, fonction rénale ; prudence sous contraception œstroprogestative.</div><p class="src">Références : informations professionnelles suisses Tranexamic acid Leman® (février 2024) et Cyklokapron® (juin 2026), Swissmedic (AIPS via <a href="https://amiko.oddb.org/fr/fi?gtin=7680337410494" target="_blank" rel="noopener">AmiKo</a>, consultées le 09.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6464927/" target="_blank" rel="noopener">Prutsky et al., Cochrane 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3829500/" target="_blank" rel="noopener">Moen et al., 2013</a>.</p></template>
<template data-pop="r04-d-atx-inhale" data-title="Acide tranexamique nébulisé : les essais"><table class="t"><tr><th>Essai</th><th>Population</th><th>Schéma</th><th>Résultat principal</th></tr><tr><td>Wand et al., Israël, 2018</td><td>47 patients hospitalisés, hémoptysie non massive ; double aveugle</td><td>500 mg nébulisés trois fois par jour contre sérum physiologique</td><td>Arrêt en 5 jours : 96 % contre 50 % ; séjour 5,7 contre 7,8 jours ; gestes invasifs 0 % contre 18,2 %</td></tr><tr><td>Gopinath et al., Inde, 2023</td><td>110 patients aux urgences, hémoptysie active, stables ; essai pilote ouvert</td><td>500 mg nébulisés contre 500 mg intraveineux, trois fois par jour</td><td>Arrêt à 30 minutes : 40 contre 28 patients ; embolisations 13 contre 21</td></tr></table><p>L’essai de Wand excluait les hémoptysies massives et ne rapportait aucun effet indésirable ; celui de Gopinath excluait les patients instables, ventilés ou nécessitant un geste immédiat. Dans ce dernier, deux patients du bras nébulisé ont présenté une bronchoconstriction asymptomatique, réversible sous bêta-2-mimétique de courte durée d’action.</p><div class="key"><b>Portée.</b> Petits essais monocentriques ; aucune forme pour inhalation n’est autorisée en Suisse, et la nébulisation de la solution injectable est hors indication. La voie ne s’applique pas à l’hémoptysie grave, qui relève de l’embolisation.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30321510/" target="_blank" rel="noopener">Wand et al., Chest 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36410494/" target="_blank" rel="noopener">Gopinath et al., Chest 2023</a>.</p></template>
<template data-pop="r04-d-terlipressine" data-title="Terlipressine (Glypressine®)"><p class="lab">Mécanisme</p><p>Analogue synthétique de la vasopressine (triglycyl-lysine-vasopressine), prodrogue transformée en lysine-vasopressine. Elle contracte les petits vaisseaux, notamment intestinaux et utérins, et la musculature lisse ; l’effet persiste 2 à 10 heures après une dose. Elle possède une légère activité antidiurétique.</p><p class="lab">Place dans l’hémoptysie</p><p>Indication suisse limitée au traitement aigu des varices œsophagiennes hémorragiques : l’usage dans l’hémoptysie est hors indication. Le Collège français la réserve à l’hémoptysie grave quand l’embolisation n’est pas disponible rapidement, ou à la menace vitale immédiate ; elle empêche une embolisation interprétable pendant les 6 heures suivantes. Aucun essai randomisé n’a été trouvé dans les sources lues.</p><p class="lab">Posologie autorisée la plus proche</p><p>Le patient de plus de 50 kg reçoit 1 à 2 mg par voie intraveineuse toutes les 4 à 6 heures, et celui de moins de 50 kg 1 mg toutes les 4 à 6 heures. La dose ne dépasse pas 12 mg par jour pendant 36 heures, puis 6 mg, et la durée maximale est de 5 jours, car la vasoconstriction expose à une ischémie coronaire, intestinale ou cutanée.</p><p class="lab">Contre-indications et risques</p><p>Insuffisance coronaire, événement ischémique cardiovasculaire au cours des trois derniers mois, grossesse (sauf indication vitale), hypersensibilité. La Revue médicale suisse ajoute l’AVC ischémique récent et la crise hypertensive. Allongement de l’intervalle QT et torsades de pointes, surtout avec hypokaliémie, hypomagnésémie ou médicaments allongeant le QT ; hyponatrémie par effet antidiurétique. Le Collège français cite le risque d’infarctus du myocarde et d’accident vasculaire cérébral chez le patient athéromateux.</p><div class="key"><b>Surveillance.</b> ECG préalable puis continu, pression artérielle, SpO₂, natrémie, kaliémie et bilan hydrique.</div><p class="src">Références : information professionnelle suisse Glypressine® (mars 2024), Swissmedic (AIPS via <a href="https://amiko.oddb.org/fr/fi?gtin=7680444700129" target="_blank" rel="noopener">AmiKo</a>, consultée le 09.10.2026) ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-d-pcc" data-title="Concentré de complexe prothrombinique et vitamine K"><p class="lab">Mécanisme</p><p>Le concentré apporte les facteurs II, VII, IX et X, dont l’antivitamine K a réduit la synthèse ; la correction est habituellement obtenue environ 30 minutes après l’injection. La vitamine K relance la synthèse hépatique de ces facteurs ; son effet commence en 4 à 6 heures, d’où son association systématique.</p><p class="lab">Posologie (Beriplex® P/N)</p><table class="t"><tr><th>INR initial</th><th>Dose de facteur IX</th></tr><tr><td>2,0 à 3,9</td><td>25 UI/kg (1 mL/kg)</td></tr><tr><td>4,0 à 6,0</td><td>35 UI/kg (1,4 mL/kg)</td></tr><tr><td>Supérieur à 6,0</td><td>50 UI/kg (2 mL/kg)</td></tr></table><p>La dose ne dépasse pas 5000 UI par administration, et une administration répétée n’est pas étayée par des données cliniques. Le concentré est contre-indiqué en cas d’hypersensibilité, de thrombocytopénie induite par l’héparine connue, car le produit contient de l’héparine, et de coagulopathie de consommation non interrompue.</p><div class="key"><b>Surveillance.</b> INR après l’injection, signes de thrombose.</div><p class="src">Référence : information professionnelle suisse Beriplex® P/N (octobre 2022), Swissmedic (AIPS via <a href="https://amiko.oddb.org/fr/fi?gtin=7680006650015" target="_blank" rel="noopener">AmiKo</a>, consultée le 09.10.2026). Lacune nommée : la seule information professionnelle suisse de vitamine K<sub>1</sub> accessible (AmiKo, 09.10.2026) est celle de Konakion® MM paediatric, ampoules de 2 mg, indiquée chez le nouveau-né ; aucune dose adulte autorisée n’a donc pu être lue, et le cours n’en donne pas. Beriplex® P/N conseille de demander l’avis d’un spécialiste de l’hémostase.</p></template>
<template data-pop="r04-d-idarucizumab" data-title="Idarucizumab (Praxbind®)"><p class="lab">Mécanisme</p><p>Fragment d’anticorps monoclonal humanisé qui lie le dabigatran avec une affinité environ 300 fois supérieure à celle du dabigatran pour la thrombine ; il neutralise son effet anticoagulant sans agir sur les autres anticoagulants.</p><p class="lab">Indication et posologie</p><p>Saignement grave incontrôlable sous dabigatran, ou geste urgent. Dose de 5 g par voie intraveineuse, en deux perfusions consécutives de 2,5 g de 5 à 10 minutes chacune ou en bolus ; une seconde dose de 5 g peut être envisagée si un saignement cliniquement pertinent réapparaît avec des temps de coagulation allongés. Aucune contre-indication.</p><div class="key"><b>Surveillance.</b> Paramètres de coagulation avant, puis 12 et 24 heures après ; reprise du dabigatran possible 24 heures après si le patient est stable et l’hémostase obtenue.</div><p class="src">Référence : information professionnelle suisse Praxbind® (mars 2021), Swissmedic (AIPS via <a href="https://amiko.oddb.org/fr/fi?gtin=7680658040011" target="_blank" rel="noopener">AmiKo</a>, consultée le 09.10.2026).</p></template>
<template data-pop="r04-d-andexanet" data-title="Andexanet alfa (Ondexxya®)"><p class="lab">Mécanisme</p><p>Forme recombinante modifiée du facteur Xa humain, privée d’activité enzymatique ; elle fixe et séquestre l’apixaban et le rivaroxaban.</p><p class="lab">Indication et posologie</p><p>L’andexanet alfa est indiqué chez l’adulte sous apixaban ou rivaroxaban dont l’hémorragie est incontrôlée ou menace le pronostic vital. À faible dose, il se donne en bolus de 400 mg à 30 mg/min, puis à 4 mg/min pendant 120 minutes. La dose élevée, soit un bolus de 800 mg puis 8 mg/min pendant 120 minutes, s’applique si la dernière dose dépassait 5 mg d’apixaban ou 10 mg de rivaroxaban et datait de moins de 8 heures. Son usage n’est pas recommandé pour l’edoxaban ou l’énoxaparine.</p><p class="lab">Risques</p><p>L’andexanet expose à des événements thrombotiques. Il neutralise aussi l’héparine, ce qui interdit de l’utiliser avant une héparinisation programmée, et il ne convient pas au prétraitement d’une chirurgie urgente ; de plus, les tests anti-Xa commerciaux deviennent inutilisables après son administration. Il est contre-indiqué en cas d’hypersensibilité ou d’allergie aux protéines de hamster.</p><div class="key"><b>Surveillance.</b> Clinique de l’hémostase et des thromboses ; reprise de l’anticoagulation dès que médicalement possible.</div><p class="src">Référence : information professionnelle suisse Ondexxya® (avril 2025), Swissmedic (AIPS via <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener">AmiKo</a>, consultée le 09.10.2026).</p></template>
<template data-pop="pareto-r04-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="r04-0,r04-1,r04-2,r04-3,r04-4,r04-5,r04-6"></p><ul><li>L’hémoptysie est un rejet de sang au cours d’un effort de toux, venu des voies sous-glottiques ; elle constitue toujours une urgence.</li><li>La gravité dépend du volume (au moins 200 mL chez le sujet sain), du terrain respiratoire, de la persistance et de la tolérance.</li><li>Le décès vient de l’asphyxie, car 150 à 200 mL suffisent à remplir les voies de conduction ; l’hémoglobine ne baisse que tard.</li><li>90 % des saignements viennent des artères bronchiques hypertrophiées, à pression systémique.</li><li>Les causes graves dominantes sont les bronchectasies, le cancer, la tuberculose et l’aspergillose, alors que l’infection aiguë est la cause fréquente. Chez un patient atteint de BPCO, il faut rechercher un cancer, et un saignement sous anticoagulant révèle souvent une lésion sous-jacente.</li><li>La mortalité atteint 9,2 % au premier séjour et la récidive 16,3 % à trois ans ; le cancer est le facteur qui prédit le décès.</li><li>L’anamnèse précise l’effort de toux, le volume, la chronologie et les antécédents ; l’examen mesure la SpO₂ et recherche une latéralisation et des signes d’orientation.</li></ul></template>
<template data-pop="pareto-r04-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="r04-7"></p><ul><li>La démarche poursuit quatre objectifs : confirmer l’hémoptysie, juger sa gravité, trouver sa cause et localiser le site du saignement.</li><li>L’angioscanner thoracique est l’examen de première intention : il trouve la cause dans 60 à 77 % des cas et le site dans 63 à 100 %, et il fournit la cartographie artérielle utile à l’embolisation.</li><li>La bronchoscopie localise le site dans 73 à 93 % des cas, mais elle trouve la cause dans seulement 2,5 à 8 % ; elle passe donc en premier seulement s’il faut sécuriser les voies aériennes.</li><li>La biologie comprend l’hémogramme, la coagulation, le dosage de l’anticoagulant et le groupe sanguin ; un ECG précède tout vasoconstricteur, qui peut provoquer une ischémie coronaire.</li><li>Écarter hémorragie alvéolaire, embolie pulmonaire, œdème pulmonaire, hématémèse et saignement oto-rhino-laryngologique.</li></ul></template>
<template data-pop="pareto-r04-tt" data-title="Pareto — Urgence et traitement"><p class="ratio" data-cover="r04-8,r04-9"></p><ul><li>Une hémoptysie grave relève des soins intensifs d’un centre spécialisé ; la SpO₂ est maintenue au-dessus de 90 %, et le patient est couché en décubitus latéral du côté qui saigne pour protéger le poumon sain.</li><li>Intubation par sonde à double lumière, intubation sélective ou bloqueur si l’hypoxémie progresse.</li><li>L’embolisation des artères bronchiques est le traitement de référence, avec un succès technique de 90 à 100 % ; sa seule contre-indication absolue est une branche spinale, cérébrale ou coronaire, que l’embolisation risquerait d’occlure.</li><li>Terlipressine réservée à l’embolisation indisponible ou à la menace immédiate ; acide tranexamique d’appoint, hors indication.</li><li>La chirurgie s’adresse à l’échec de l’embolisation, à une origine artérielle pulmonaire destructrice et à une lésion localisée, de préférence à froid.</li><li>Le score de Fartoukh prédit une mortalité de 1 % à 91 % selon six facteurs.</li></ul></template>
<template data-pop="pareto-r04-crit" data-title="Pareto — Suivi, situations et critères"><p class="ratio" data-cover="r04-10,r04-11,r04-12"></p><ul><li>Après embolisation, la récidive touche 1 à 27 % des patients le premier mois et 10 à 55 % ensuite, tant que la cause persiste.</li><li>Le fumeur et le patient dont l’hémoptysie reste cryptogénique doivent être surveillés, car un cancer est révélé chez 4 % d’entre eux à trois ans.</li><li>L’anticoagulant est antagonisé selon sa classe : par le concentré de complexe prothrombinique et la vitamine K, par l’idarucizumab ou par l’andexanet alfa.</li><li>En cas de cancer, le seuil d’embolisation est plus bas ; en cas d’aspergillome, la récidive atteint 30 à 100 %, d’où l’exérèse si elle est possible.</li><li>Pendant la grossesse, la terlipressine est proscrite ; en cas d’insuffisance rénale, l’acide tranexamique est adapté à la créatinine ; si une tuberculose est possible, le patient est isolé jusqu’à une PCR négative.</li></ul></template>
<template data-pop="pareto-r04-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="r04-e-1,r04-e-2,r04-e-3"></p><ul><li>L’angioscanner thoracique est l’examen de référence ; l’artériographie n’est pratiquée qu’en vue d’une embolisation.</li><li>Une artère bronchique normale mesure 1,6 ± 0,3 mm ; elle est pathologique au-delà de 2 mm, lorsqu’elle est tortueuse et hypervascularisante.</li><li>Un verre dépoli localisé traduit du sang inhalé et désigne le site probable ; une artère dans la paroi d’une cavité évoque une origine artérielle pulmonaire.</li><li>Bronchoscopie dans les 24 à 48 heures ; prélèvements et traitement.</li><li>Hémoglobine normale non rassurante ; trouble de la coagulation jamais suffisant.</li></ul></template>
<template data-pop="pareto-r04-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r04-p-1,r04-p-2,r04-p-3,r04-p-4"></p><ul><li>Aucun médicament ne ferme la brèche ; acide tranexamique et terlipressine sont hors indication en Suisse.</li><li>Acide tranexamique intraveineux 0,5 à 1 g deux à trois fois par jour, réduit selon la créatinine ; nébulisé 500 mg trois fois par jour dans les essais.</li><li>Terlipressine 1 à 2 mg toutes les 4 à 6 heures, au plus 5 jours ; ECG, coronaropathie et grossesse exclues.</li><li>Les antidotes sont le concentré de complexe prothrombinique à 25 à 50 UI/kg avec de la vitamine K, l’idarucizumab à 5 g et l’andexanet alfa selon la dose et le délai.</li><li>Il faut éviter un vasoconstricteur réflexe lorsqu’une embolisation est disponible, le maintien de l’anticoagulant et un antifibrinolytique seul dans l’hémoptysie grave.</li></ul></template>
