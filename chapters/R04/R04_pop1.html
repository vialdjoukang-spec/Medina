<template data-pop="r04-definition" data-title="L’hémoptysie"><p class="lab">Définition</p><p>L’hémoptysie est un saignement, extériorisé ou non, des voies respiratoires sous-glottiques. Le plus souvent, du sang rouge vif est rejeté par la bouche au cours d’un effort de toux ; il peut aussi inonder les alvéoles sans être expectoré. Le volume va du crachat strié de sang à l’hémoptysie massive mortelle.</p><p class="lab">Pourquoi en faire une urgence</p><p>Un épisode minime peut récidiver sous une forme beaucoup plus grave, et même un saignement de faible abondance révèle le plus souvent une maladie pulmonaire qui exige un traitement propre. Toute hémoptysie conduit donc à une démarche étiologique.</p><div class="key"><b>Limite.</b> Le terme désigne un symptôme, non une maladie : il ne dispense jamais du diagnostic de la cause.</div><p class="src">Référence : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, introduction</a>.</p></template>
<template data-pop="r04-pseudo" data-title="Pseudo-hémoptysie : hématémèse, épistaxis, saignement pharyngé"><p>La pseudo-hémoptysie est un rejet de sang par la bouche dont la source n’est pas sous-glottique.</p><table class="t"><tr><th>Origine</th><th>Indices</th><th>Examen qui tranche</th></tr><tr><td>Voies respiratoires sous-glottiques</td><td>Effort de toux ; sang rouge vif, aéré, alcalin ; gêne respiratoire, chaleur thoracique</td><td>Angioscanner, bronchoscopie</td></tr><tr><td>Tube digestif haut</td><td>Effort de vomissement ; sang sombre, acide ; débris alimentaires ; douleurs abdominales, nausées</td><td>Endoscopie œso-gastro-duodénale</td></tr><tr><td>Nez et pharynx</td><td>Épistaxis postérieure, saignement pharyngolaryngé ; source visible à l’inspection</td><td>Endoscopie oto-rhino-laryngologique</td></tr></table><p>Le critère le plus utile est la notion de sang rejeté au cours d’un effort de toux. Une hémoptysie déglutie peut toutefois être vomie et simuler une hématémèse ; l’endoscopie tranche alors. L’angioscanner oriente aussi vers une hémoptysie lorsqu’il montre du verre dépoli ou des condensations alvéolaires.</p><div class="key"><b>Épistaxis.</b> L’épistaxis n’est traitée ici qu’en diagnostic différentiel. L’information professionnelle suisse de Cyklokapron® cite l’épistaxis prolongée ou récidivante parmi ses indications : 2 comprimés de 500 mg trois fois par jour pendant 7 jours.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; information professionnelle suisse Cyklokapron® (juin 2026).</p></template>
<template data-pop="r04-volume" data-title="Estimer le volume d’une hémoptysie"><p class="lab">Repères concrets</p><p>Hors de l’hôpital, le médecin fait estimer le volume avec des contenants familiers : une cuillère à soupe pleine aux trois quarts contient environ 10 mL ; un verre ou un crachoir plein aux trois quarts, environ 100 mL ; un bol plein aux trois quarts, environ 500 mL. À l’hôpital, toutes les expectorations sont recueillies dans des récipients gradués, par tranches de trois heures.</p><p class="lab">Seuils publiés</p><p>Les standards CIRSE rapportent un consensus usuel : hémoptysie légère sous 100 mL par jour ou 50 mL par épisode, modérée entre 100 et 300 mL par jour. Le Collège français retient 200 mL chez un sujet sain comme seuil de gravité.</p><div class="key"><b>En pratique.</b> L’estimation verbale reste approximative : dès l’admission, le recueil gradué la remplace, et la SpO₂ renseigne sur la tolérance.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, figures 1 et 2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-contentieux-massive" data-title="Contentieux : définir l’hémoptysie grave"><p class="lab">Les positions</p><table class="t"><tr><th>Source</th><th>Définition proposée</th></tr><tr><td>Revue médicale suisse, 2015 (Hôpitaux universitaires de Genève)</td><td>Plus de 250 mL en 24 heures, ou hémoptysie continue menaçant les fonctions vitales, selon l’atteinte respiratoire préexistante</td></tr><tr><td>Revue allemande, 2017</td><td>Seuils publiés de 100 à 1000 mL en 24 heures, la plupart entre 300 et 600 mL</td></tr><tr><td>Standards CIRSE, 2022</td><td>Plus de 100 mL en 24 heures ; ou insuffisance respiratoire (SpO₂ inférieure à 60 %) imposant l’intubation ; ou instabilité hémodynamique</td></tr><tr><td>Collège des enseignants de pneumologie (SPLF), 2023</td><td>Abondance d’au moins 200 mL chez un sujet sain, terrain respiratoire et persistance du saignement</td></tr></table><p class="lab">Choix retenu</p><p>La source primaire applicable la plus récente est le texte du Collège français de 2023 ; ce cours en retient l’approche fonctionnelle (volume, terrain, persistance). Le seuil plus bas de 100 mL des standards CIRSE est conservé pour les indications d’embolisation, car il correspond au plus petit volume rapporté comme mortel. Toutes les sources s’accordent sur un point : un saignement modeste chez un insuffisant respiratoire est grave.</p><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-asphyxie" data-title="L’asphyxie, cause du décès"><p class="lab">Mécanisme</p><p>Les voies aériennes de conduction d’un adulte contiennent environ 150 à 200 mL. Le sang qui les remplit empêche la ventilation et inonde les alvéoles saines ; l’échange gazeux s’effondre. La mort survient par asphyxie bien avant toute perte sanguine détectable ou tout choc hémorragique.</p><p class="lab">Conséquences pratiques</p><p>La gravité se juge sur l’oxygénation et le travail respiratoire, non sur l’hémoglobine. La première mesure protège le poumon sain : position, intubation sélective ou bloqueur bronchique. La capacité du patient à expectorer et sa fonction respiratoire préalable fixent le volume critique.</p><div class="key"><b>Erreur fréquente.</b> Rassurer devant une hémoglobine normale ; la chute de l’hémoglobine est exceptionnelle et tardive.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a>.</p></template>
<template data-pop="r04-double-circulation" data-title="La double circulation pulmonaire"><p>Le poumon reçoit une circulation fonctionnelle et une circulation nourricière.</p><table class="t"><tr><th>Caractère</th><th>Circulation pulmonaire</th><th>Circulation bronchique</th></tr><tr><td>Origine</td><td>Ventricule droit</td><td>Aorte, le plus souvent</td></tr><tr><td>Débit</td><td>Tout le débit cardiaque ; environ 99 % de la perfusion pulmonaire</td><td>Environ 1 %</td></tr><tr><td>Pression</td><td>Basse : 14,0 ± 3,3 mmHg en moyenne au repos</td><td>Systémique, haute</td></tr><tr><td>Rôle</td><td>Échanges gazeux</td><td>Nutrition de la trachée, des bronches, des parois vasculaires, de la plèvre viscérale médiastinale</td></tr><tr><td>Part des hémoptysies</td><td>Environ 5 %</td><td>Environ 90 % ; 5 % viennent d’artères systémiques non bronchiques</td></tr></table><p>Le drainage veineux bronchique proximal rejoint le système azygos ; le drainage bronchique distal et pleural, environ 70 % du débit, rejoint les veines pulmonaires et forme une partie du shunt physiologique.</p><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, note 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19324955/" target="_blank" rel="noopener">Kovacs et al., 2009</a>.</p></template>
<template data-pop="r04-hvs" data-title="Hypervascularisation systémique"><p class="lab">Mécanisme</p><p>Trois situations stimulent la croissance des artères bronchiques : la destruction du lit capillaire pulmonaire (tuberculose, cancer, fibrose), l’hyperhémie d’une infection chronique (bronchectasies, abcès) et toute altération de la circulation artérielle pulmonaire (vasoconstriction hypoxique, embolie, vascularite), qui libère des facteurs de croissance néo-angiogéniques. Les artères s’élargissent, deviennent tortueuses et forment des néovaisseaux à paroi mince.</p><p class="lab">Conséquence</p><p>Ces vaisseaux reçoivent la pression aortique et s’ouvrent dans un tissu inflammatoire ou tumoral : ils se rompent dans les bronches. Si la plèvre est symphysée, des artères systémiques non bronchiques, intercostales ou mammaires internes, participent au réseau.</p><div class="key"><b>Conséquence thérapeutique.</b> L’embolisation vise ce réseau néoformé ; une récidive après embolisation fait rechercher une collatérale non bronchique.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a>.</p></template>
<template data-pop="r04-abcde" data-title="Moyen mnémotechnique « ABCDE »"><p><b>Aide pédagogique, non critère officiel.</b> Le Collège des enseignants de pneumologie résume les causes dominantes ainsi : A pour aspergillome, B pour bacille de Koch (tuberculose active ou séquellaire), C pour cancer bronchopulmonaire, D pour dilatations des bronches (bronchectasies), E pour embolie pulmonaire.</p><div class="key"><b>Limite.</b> L’embolie pulmonaire donne une hémoptysie de faible abondance ; l’hémorragie alvéolaire, l’œdème pulmonaire, les anticoagulants et l’hémoptysie cryptogénique échappent à ce moyen.</div><p class="src">Référence : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-bronchectasies" data-title="Bronchectasies et hémoptysie"><p>Les bronchectasies représentent 6,8 % des hémoptysies hospitalisées en France et 40 % des hémoptysies graves admises dans un centre de référence parisien. L’infection chronique entretient l’hypervascularisation bronchique ; les épisodes récidivent volontiers, et les bronchectasies sont le premier facteur de récidive dans la cohorte italienne (rapport de cotes 2,6).</p><p>Le scanner sans injection suffit souvent à les montrer chez un patient qui crache des sécrétions striées ; l’angioscanner s’impose si le saignement est abondant ou si une embolisation se discute. Le traitement de fond, en particulier de la surinfection, relève du cours J47 — Bronchectasies.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26022949/" target="_blank" rel="noopener">Abdulmalak et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8336236/" target="_blank" rel="noopener">Mondoni et al., 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-tuberculose" data-title="Tuberculose : hémoptysie, diagnostic et isolement"><p>La tuberculose est la première cause d’hémoptysie dans le monde ; en France, elle représentait 2,7 % des hémoptysies hospitalisées et 14 % des hémoptysies graves admises à l’hôpital Tenon. La tuberculose évolutive saigne par érosion vasculaire dans une caverne ; ses séquelles saignent par bronchectasies ou par aspergillome greffé sur une cavité détergée.</p><p>Une artère pulmonaire exposée dans la paroi d’une caverne peut former un anévrisme de Rasmussen : le saignement est alors d’origine artérielle pulmonaire et l’embolisation bronchique seule échoue. Le traitement antituberculeux réduit la récidive après embolisation.</p><p class="lab">Diagnostic et isolement en Suisse</p><p>Le guide suisse fait de la PCR directe des expectorations le test primaire de toute suspicion de tuberculose pulmonaire ; microscopie et culture la complètent, la culture restant nécessaire aux tests de résistance. Le patient hospitalisé non traité, suspect sur des arguments cliniques ou radiologiques, est isolé jusqu’à ce qu’au moins un premier échantillon respiratoire soit négatif en PCR ; si la probabilité reste forte, un second échantillon est examiné avant de lever l’isolement. Une PCR positive conduit au traitement ; l’isolement est maintenu jusqu’à l’amélioration clinique sous traitement, généralement 5 à 15 jours. Le personnel porte un masque FFP2 ou N95 ajusté, et le patient un masque chirurgical lorsqu’il quitte la chambre. Tout cas traité est déclaré au médecin cantonal.</p><div class="key"><b>Conséquence pratique.</b> Chez un patient qui saigne et peut être tuberculeux, l’isolement commence dès la suspicion, et la bronchoscopie, qui produit des aérosols, se réalise avec les protections adaptées.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">OFSP et Ligue pulmonaire suisse, Tuberculose en Suisse, guide V1.2024</a>, chapitres 6 et 7.5 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-aspergillome" data-title="Aspergillome et aspergillose pulmonaire chronique"><p>L’aspergillome est une prolifération d’<i>Aspergillus fumigatus</i> dans une cavité séquellaire, souvent tuberculeuse. L’aspergillose pulmonaire chronique cavitaire, plus étendue, touche des patients non immunodéprimés porteurs d’une maladie pulmonaire ; son diagnostic exige une cavité ou un nodule, une preuve d’infection aspergillaire et l’exclusion d’autres causes pendant au moins trois mois. Les anticorps anti-Aspergillus sont élevés dans plus de 90 % des cas.</p><p class="lab">Hémoptysie</p><p>La récidive après embolisation y atteint 30 à 100 %, et la mortalité dans le mois suivant un saignement a été rapportée à 50 %. La recommandation ERS et ESCMID de 2016 contrôle l’hémoptysie par l’acide tranexamique et l’embolisation, plus rarement par l’exérèse ; un antifongique oral prolongé est recommandé dans la forme cavitaire chronique, et une hémoptysie sous traitement peut signaler un échec ou une résistance.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26699723/" target="_blank" rel="noopener">Denning et al., Eur Respir J 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a>.</p></template>
<template data-pop="r04-cancer" data-title="Cancer bronchopulmonaire et hémoptysie"><p>Le cancer représente 17,4 % des hémoptysies hospitalisées en France. Il est le principal facteur de décès après une hémoptysie : dans la cohorte italienne, le rapport de cotes de mortalité à 18 mois était de 38,2. La mortalité d’une hémoptysie maligne est d’environ 21 %, contre 5 % pour une cause bénigne, et la survie sans récidive après embolisation n’est que de 34 % à un an.</p><p class="lab">Conduite</p><p>Chez un fumeur, une hémoptysie impose un scanner et une bronchoscopie, puis une surveillance prolongée même si les deux sont normaux. Le NICE britannique recommande d’adresser par la filière de suspicion de cancer toute personne de 40 ans ou plus présentant une hémoptysie inexpliquée. Le bilan et le traitement relèvent du cours C34 — Cancer bronchopulmonaire.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26022949/" target="_blank" rel="noopener">Abdulmalak et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8336236/" target="_blank" rel="noopener">Mondoni et al., 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://www.nice.org.uk/guidance/ng12/chapter/Recommendations-organised-by-site-of-cancer" target="_blank" rel="noopener">NICE, recommandation 1.1.1 sur la suspicion de cancer</a>.</p></template>
<template data-pop="r04-ep" data-title="Embolie pulmonaire et hémoptysie"><p>L’embolie pulmonaire représente 2,6 % des hémoptysies hospitalisées en France. L’hémoptysie y est de faible abondance. Le contexte oriente : alitement, chirurgie récente, immobilisation. Le diagnostic, l’évaluation et le traitement relèvent du cours I26 — Embolie pulmonaire.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26022949/" target="_blank" rel="noopener">Abdulmalak et al., 2015</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-hemorragie-alveolaire" data-title="Hémorragie alvéolaire diffuse"><p class="lab">Définition et gravité</p><p>Le saignement naît des capillaires alvéolaires et inonde le parenchyme de façon diffuse. Il constitue une urgence thérapeutique, car il conduit vite à une insuffisance respiratoire aiguë. L’association hémoptysie, anémie et infiltrats pulmonaires évoque le diagnostic, mais l’hémoptysie manque chez environ un tiers des patients.</p><p class="lab">Diagnostic et causes</p><p>Le lavage broncho-alvéolaire confirme le diagnostic. Le médecin écarte d’abord une cause septique, puis distingue une cause immunologique (vascularite associée aux anticorps anticytoplasme des neutrophiles, connectivite, syndrome de Goodpasture), cherchée par les auto-anticorps et la biopsie d’un organe accessible, d’une cause non immunologique (insuffisance cardiaque gauche, rétrécissement mitral, médicaments, toxiques comme le crack), cherchée par l’échocardiographie.</p><div class="key"><b>Conséquence thérapeutique.</b> Une cause immunologique relève des corticoïdes et du cyclophosphamide, du rituximab dans certaines formes, des échanges plasmatiques dans le syndrome de Goodpasture.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25891303/" target="_blank" rel="noopener">Parrot et al., Rev Mal Respir 2015</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-anticoag" data-title="Anticoagulants, antiagrégants et hémoptysie"><p>Les traitements anticoagulants ou thrombolytiques sont impliqués dans environ 3,5 % des hémoptysies hospitalisées. Le Collège français rappelle qu’un trouble de la coagulation, ou un surdosage, ne peut être l’unique cause d’une hémoptysie : il révèle une lésion.</p><p class="lab">Conduite</p><p>Le médecin dose l’anticoagulant (INR, activité anti-Xa, dosage spécifique de l’AOD), l’arrête et l’antagonise si le saignement est grave. Il recherche ensuite la lésion causale comme chez tout patient. Dans une cohorte prospective, les anticoagulants et antiagrégants n’étaient associés ni à la mortalité ni à la récidive.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017, tableau 1</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8336236/" target="_blank" rel="noopener">Mondoni et al., 2021</a>.</p></template>
<template data-pop="r04-cryptogenique" data-title="Hémoptysie cryptogénique"><p class="lab">Définition</p><p>L’hémoptysie est dite cryptogénique, ou idiopathique, lorsque l’angioscanner thoracique et la bronchoscopie n’identifient aucune cause. Sa fréquence varie selon les séries : 50 % dans la base hospitalière française, plus d’un tiers selon le Collège français, environ 15 % dans la Revue médicale suisse, 15 à 20 % selon les standards CIRSE et 11 % parmi les hémoptysies graves d’un centre de référence.</p><p class="lab">Évolution</p><p>Dans une cohorte de 81 patients, les mesures conservatrices et l’embolisation ont contrôlé le saignement chez 90 % d’entre eux ; aucun cancer n’est apparu pendant un suivi moyen de 47 mois, mais l’hémoptysie a récidivé chez 10 patients. Une atteinte vasculaire bronchique de type Dieulafoy a été trouvée chez cinq des neuf patients opérés. À l’inverse, 4 % des hémoptysies cryptogéniques de la cohorte française recevaient un diagnostic de cancer dans les trois ans, et les standards CIRSE rapportent qu’une hémoptysie cryptogénique précède une tumeur maligne dans 10 % des cas.</p><div class="key"><b>Conséquence.</b> Le diagnostic cryptogénique impose un suivi, surtout chez le fumeur.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17332480/" target="_blank" rel="noopener">Savale et al., 2007</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, tableau 1</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26022949/" target="_blank" rel="noopener">Abdulmalak et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-bpco" data-title="La BPCO n’est pas une cause d’hémoptysie"><p>Le Collège des enseignants de pneumologie l’énonce explicitement : la BPCO n’est pas une cause d’hémoptysie. Les standards CIRSE rangent pourtant la BPCO et la bronchite chronique parmi les causes d’hémoptysie massive, et la cohorte italienne retient l’« exacerbation de BPCO » comme diagnostic initial chez quelques patients. Les deux lectures convergent sur la conduite : chez un patient atteint de BPCO, une hémoptysie impose de rechercher une maladie sous-jacente, en particulier un cancer bronchopulmonaire, par une tomodensitométrie thoracique et une endoscopie bronchique systématiques, suivies d’une surveillance prolongée.</p><div class="key"><b>Exemple.</b> Dans la cohorte italienne, deux patients d’abord classés « exacerbation de BPCO », tous deux fumeurs de plus de 20 paquets-années, ont reçu un diagnostic de cancer au cours du suivi ; deux autres, un diagnostic de bronchectasies.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022, encadré des causes</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8336236/" target="_blank" rel="noopener">Mondoni et al., 2021, tableau 2</a>.</p></template>
<template data-pop="r04-prodromes" data-title="Prodromes et caractères du sang"><p>Avant ou pendant l’épisode, le patient décrit souvent une sensation de chaleur rétrosternale, une angoisse, une gêne ou un chatouillement laryngé, un goût métallique dans la bouche. Une gêne latéralisée peut indiquer le côté qui saigne.</p><p>Le sang respiratoire est rouge vif, aéré, mousseux et alcalin. Un sang rouge foncé ou noirâtre avec des caillots oriente vers un saignement ancien ou dégluti.</p><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a>.</p></template>
<template data-pop="r04-signes-orientation" data-title="Signes cliniques d’orientation étiologique"><table class="t"><tr><th>Signe</th><th>Orientation</th></tr><tr><td>Hippocratisme digital</td><td>Bronchectasies, cancer, cardiopathie congénitale</td></tr><tr><td>Altération de l’état général</td><td>Cancer bronchopulmonaire</td></tr><tr><td>Télangiectasies cutanéo-muqueuses</td><td>Maladie de Rendu et Osler et malformations artérioveineuses</td></tr><tr><td>Valvulopathie mitrale</td><td>Rétrécissement mitral</td></tr><tr><td>Signes de vascularite systémique</td><td>Hémorragie alvéolaire immunologique</td></tr><tr><td>Crépitants localisés, gêne latéralisée</td><td>Côté du saignement</td></tr></table><p>Ces signes orientent l’enquête mais ne dispensent ni de l’angioscanner ni, chez le fumeur, de la recherche d’un cancer.</p><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a>.</p></template>
<template data-pop="r04-examen-orl" data-title="Inspection de la bouche et du nasopharynx"><p>L’inspection soigneuse de la bouche, du pharynx et du nasopharynx fait partie du bilan initial. Elle recherche une source haute : épistaxis postérieure, lésion de la cavité buccale ou saignement pharyngolaryngé. En cas de doute, l’endoscopie oto-rhino-laryngologique tranche.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-angioscanner" data-title="Angioscanner thoracique"><p class="lab">Technique</p><p>Tomodensitométrie multibarrette injectée au temps aortique, en apnée, avec reconstructions en fenêtres parenchymateuse et médiastinale et en coupes fines. En cas de saignement actif grave, l’acquisition va de la base du cou aux artères rénales, pour repérer les artères bronchiques ectopiques et non bronchiques.</p><p class="lab">Rendement</p><p>Le site est identifié dans 63 à 100 % des cas et la cause dans 60 à 77 %. Chez le patient qui crache des sécrétions striées avec des bronchectasies probables, un scanner sans injection suffit : il identifie la cause et le site dans 82 à 100 % des cas. Dans une série de 162 hémoptysies graves, la cause était connue chez 69 % des patients après la clinique, la radiographie et la bronchoscopie, et chez 91 % après le scanner.</p><p class="lab">Signes à lire</p><p>Lésion causale ; verre dépoli ou condensation localisés, témoins du sang inhalé ; artères bronchiques de plus de 2 mm, tortueuses ; collatérales non bronchiques ; signes d’origine artérielle pulmonaire (pseudo-anévrisme, anévrisme, artère dans la paroi d’une cavité).</p><div class="key"><b>Limite.</b> Un caillot endobronchique peut masquer ou simuler une tumeur ; la bronchoscopie complète.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., 2007</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17989162/" target="_blank" rel="noopener">Khalil et al., 2008</a>.</p></template>
<template data-pop="r04-radiographie" data-title="Radiographie thoracique"><p>Rapide, peu coûteuse, disponible partout et peu irradiante, la radiographie de face et de profil montre une pneumonie, un abcès, une tumeur, une caverne ou une cardiopathie. Elle précise toutefois le côté du saignement dans 33 à 82 % des cas seulement et la cause dans 35 à 50 %. Dans une série de 80 hémoptysies abondantes, elle était normale chez 13 % des patients, dont 70 % avaient des bronchectasies.</p><div class="key"><b>Conséquence.</b> Une radiographie normale n’exclut rien : l’angioscanner doit être réalisé malgré son résultat, sauf hémoptysie minime au contexte évident.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12388502/" target="_blank" rel="noopener">Revel et al., 2002</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a>.</p></template>
<template data-pop="r04-bronchoscopie" data-title="Bronchoscopie diagnostique"><p class="lab">Rendement et moment</p><p>Elle localise le saignement dans 73 à 93 % des cas lorsqu’elle est faite pendant le saignement ou dans les 24 à 48 heures qui suivent ; elle n’en identifie la cause que dans 2,5 à 8 % des cas, sauf tumeur proximale visible.</p><p class="lab">Apports propres</p><p>Elle juge l’activité du saignement, prélève pour la microbiologie, la cytologie et l’histologie, localise un saignement quand le scanner montre des lésions bilatérales et sécurise les voies aériennes. Chez le patient instable, la bronchoscopie souple au lit, après intubation, est la procédure de choix ; la bronchoscopie rigide associée est la plus sûre dans l’hémoptysie menaçante.</p><div class="key"><b>Piège.</b> L’endoscopie élève la pression systémique et provoque la toux : elle se pratique en milieu sécurisé, par un opérateur expérimenté.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a>.</p></template>
<template data-pop="r04-biologie" data-title="Bilan biologique initial"><p class="lab">Pour la gravité et les gestes</p><p>SpO₂ et gaz du sang si l’hémoptysie est grave (hypoxémie, hypercapnie) ; hémoglobine et plaquettes ; INR, temps de céphaline activée, activité anti-Xa ou dosage spécifique de l’AOD ; groupe sanguin, même si la transfusion est exceptionnelle.</p><p class="lab">Pour la cause</p><p>Bacilles acido-alcoolo-résistants dans l’expectoration si une tuberculose est possible ; sérologie et parfois antigénémie aspergillaire ; marqueurs inflammatoires ; auto-anticorps (anticorps anticytoplasme des neutrophiles, anticorps antinucléaires, anticorps anti-ADN double brin) si une hémorragie alvéolaire ou une vascularite est suspectée. Un ECG est indispensable avant tout vasoconstricteur ; l’échocardiographie recherche un œdème pulmonaire hémorragique.</p><div class="key"><b>Piège.</b> Un trouble de la coagulation ne peut à lui seul expliquer l’hémoptysie.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a>.</p></template>
<template data-pop="r04-decubitus" data-title="Décubitus latéral du côté qui saigne"><p>Lorsque le côté du saignement est connu, le patient est couché sur ce côté. La gravité retient le sang dans le poumon déclive et l’empêche de couler vers le poumon sain, dont la ventilation est ainsi préservée.</p><p>Pendant l’embolisation, le décubitus dorsal est souvent mal toléré par l’insuffisant respiratoire ; les standards CIRSE conseillent d’incliner la table si le patient n’est pas intubé.</p><div class="key"><b>Piège.</b> Coucher le patient du mauvais côté exposerait le poumon sain ; lorsque le côté est incertain, la bronchoscopie le précise.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017, tableau 2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-intubation" data-title="Intubation et isolement pulmonaire"><p>L’intubation s’impose devant une hémorragie active avec insuffisance respiratoire ou instabilité hémodynamique. Les options, selon l’expertise disponible, sont :</p><table class="t"><tr><th>Technique</th><th>Principe</th></tr><tr><td>Sonde à double lumière</td><td>Ventile séparément chaque poumon et protège le poumon sain</td></tr><tr><td>Intubation sélective du poumon sain</td><td>La sonde est poussée dans la bronche souche du côté qui ne saigne pas</td></tr><tr><td>Bloqueur bronchique</td><td>Ballonnet gonflé dans la bronche du côté qui saigne (par exemple bloqueur d’Arndt)</td></tr><tr><td>Sonde endotrachéale de gros calibre</td><td>Intubation temporaire proposée par la revue allemande dans l’hémoptysie massive</td></tr></table><p>La bronchoscopie suit l’intubation aussi vite que possible pour localiser et contrôler le saignement.</p><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-fartoukh" data-title="Score de Fartoukh (mortalité hospitalière)"><p>Le score a été construit sur 1087 patients admis en réanimation pour hémoptysie dans un hôpital universitaire parisien ; la mortalité hospitalière était de 6,5 % et l’aire sous la courbe du modèle de 0,87.</p><table class="t"><tr><th>Facteur à l’admission</th><th>Points</th></tr><tr><td>Alcoolisme chronique</td><td>1</td></tr><tr><td>Atteinte artérielle pulmonaire</td><td>1</td></tr><tr><td>Infiltrats d’au moins deux quadrants sur la radiographie</td><td>1</td></tr><tr><td>Cancer</td><td>2</td></tr><tr><td>Aspergillose</td><td>2</td></tr><tr><td>Ventilation mécanique au transfert</td><td>2</td></tr></table><p>La mortalité prédite est de 1 % pour un score de 0, de 2 % pour 1, de 6 % pour 2, de 16 % pour 3, de 34 % pour 4, de 58 % pour 5, de 79 % pour 6 et de 91 % pour 7. Un patient ventilé, porteur d’un cancer et d’infiltrats étendus totalise ainsi 5 points, soit 58 %.</p><div class="key"><b>Limite.</b> Score monocentrique et rétrospectif, construit en réanimation ; il aide à définir l’hémoptysie grave et à discuter le niveau de soins, sans remplacer le jugement clinique.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22025193/" target="_blank" rel="noopener">Fartoukh et al., Respiration 2012</a>.</p></template>
<template data-pop="r04-vasoocclusion" data-title="Hémoptysie d’origine artérielle pulmonaire"><p>Environ 5 % des hémoptysies, et 5 à 10,5 % des cas selon la revue allemande, viennent des artères pulmonaires : anévrisme de Rasmussen dans une caverne tuberculeuse, pseudo-anévrisme, malformation artérioveineuse, rupture iatrogène après cathétérisme cardiaque droit ou biopsie. Dans une série de 189 patients traités par voie endovasculaire, 13 avaient une origine artérielle pulmonaire ; l’angioscanner montrait un pseudo-anévrisme, un anévrisme ou une artère pulmonaire dans la paroi d’une cavité.</p><p class="lab">Traitement</p><p>Vaso-occlusion artérielle pulmonaire par spirales ou ballonnet, par abord veineux, ou chirurgie. Une hypertrophie bronchique associée impose de traiter les deux réseaux.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17989162/" target="_blank" rel="noopener">Khalil et al., Chest 2008</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-hemostase-endo" data-title="Hémostase endobronchique"><table class="t"><tr><th>Technique</th><th>Indication</th></tr><tr><td>Aspiration, cryosonde pour extraire les caillots</td><td>Désobstruction des voies aériennes</td></tr><tr><td>Sérum physiologique à 4 °C, adrénaline diluée, terlipressine locale</td><td>Vasoconstriction locale ; effets systémiques à surveiller</td></tr><tr><td>Ballonnet d’occlusion, tamponnade par compresses</td><td>Saignement distal non visible ; isolement du territoire</td></tr><tr><td>Plasma d’argon, laser, électrocoagulation, cryothérapie</td><td>Lésion endobronchique proximale visible</td></tr></table><p>Le ballonnet ou la tamponnade sont retirés dans les 72 heures, sous antibiotique, pour éviter une infection en aval de l’occlusion. Le Collège français juge l’instillation de sérum froid ou d’adrénaline d’indication anecdotique dans l’hémoptysie non grave et proscrit la mobilisation du caillot qui obture la brèche.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>

b">Indications (CIRSE 2022)</p><p>Toute hémoptysie qui compromet les voies aériennes ou provoque une détresse respiratoire ; trois épisodes ou plus d’au moins 100 mL en une semaine ; saignements chroniques ou croissants ; crachats striés suivis d’épisodes d’abondance croissante, qui précèdent souvent l’hémoptysie menaçante ; pont vers la transplantation dans la mucoviscidose.</p><p class="lab">Technique</p><p>Abord artériel fémoral, parfois brachial ou radial ; cathétérisme sélectif des artères repérées à l’angioscanner ; vérification de l’absence de branche spinale, cérébrale ou coronaire ; microcathéter ; particules de polyalcool de vinyle de 355 à 500 µm, microsphères calibrées de plus de 300 µm ou colle ; jamais de particules de moins de 300 µm, qui provoqueraient une nécrose bronchique ou œsophagienne.</p><p class="lab">Résultats</p><p>Succès technique 90 à 100 % ; arrêt du saignement à 24 heures 82 à 100 %, à 30 jours 70 à 92 %, à un an 64 à 92 %. La récidive, jusqu’à 47 %, s’explique par une embolisation incomplète, une collatérale non bronchique, une recanalisation ou la progression de la maladie.</p><div class="key"><b>Contre-indication absolue.</b> Une branche destinée au cœur, à la moelle ou au cerveau. Toutes les autres contre-indications sont relatives, car le risque de ne pas traiter l’emporte en général.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a>.</p></template>
<template data-pop="r04-eab-complications" data-title="Complications de l’embolisation bronchique"><table class="t"><tr><th>Complication</th><th>Fréquence rapportée</th></tr><tr><td>Douleur thoracique transitoire</td><td>Jusqu’à 91 %</td></tr><tr><td>Syndrome post-embolisation (douleur, fièvre, leucocytose)</td><td>1,7 à 31 %</td></tr><tr><td>Dysphagie</td><td>0,7 à 30 %</td></tr><tr><td>Dissection ou perforation de l’artère bronchique</td><td>0,3 à 13 %</td></tr><tr><td>Infarctus médullaire, myélite transverse</td><td>0,2 à 6,5 % ; moins de 1 % dans les séries récentes</td></tr><tr><td>Ischémie transitoire, accident vasculaire cérébral, cécité corticale</td><td>0,6 à 2 %</td></tr></table><p>Ces complications graves relèvent d’une embolisation non ciblée. Un déficit neurologique après le geste impose oxygène, remplissage, pression artérielle moyenne au-dessus de 80 mmHg et drainage du liquide cérébrospinal si l’infarctus médullaire ne peut être confirmé immédiatement.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022, tableau 9</a>.</p></template>
<template data-pop="r04-contentieux-terlipressine" data-title="Contentieux : terlipressine avant l’embolisation"><p class="lab">Les positions</p><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>Revue médicale suisse, 2015</td><td>Vasoconstricteur de choix pour toute hémoptysie majeure active, sauf contre-indication ; embolisation repoussée si possible au-delà de 6 heures</td></tr><tr><td>Centre de référence parisien, 2007</td><td>Usage évité autant que possible, car il peut compromettre l’embolisation</td></tr><tr><td>Standards CIRSE, 2022</td><td>Vasoconstricteur systémique avant l’embolisation classé parmi les facteurs de récidive</td></tr><tr><td>Collège français (SPLF), 2023</td><td>Réservée à l’hémoptysie grave quand l’embolisation n’est pas disponible ou réalisable rapidement, ou à la menace vitale immédiate</td></tr></table><p class="lab">Choix retenu</p><p>La source primaire applicable la plus récente, le texte du Collège français de 2023, l’emporte et concorde avec les standards CIRSE : la terlipressine n’est pas un réflexe ; elle sert de pont quand l’embolisation tarde ou que la vie est immédiatement menacée, après un ECG et en l’absence de coronaropathie. Le texte suisse de 2015 reste consultable pour sa position antérieure.</p><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022, tableau 8</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-chirurgie" data-title="Chirurgie d’exérèse"><p class="lab">Indications</p><p>En urgence, la chirurgie s’impose en cas d’échec ou de contre-indication de l’embolisation, notamment lors d’une récidive dans les 72 heures alors que l’embolisation ne peut pas être rendue efficace (CIRSE), lors d’un saignement artériel pulmonaire dû à un processus destructeur (cancer, pneumonie nécrosante, mycétome) ou lors d’une lésion vasculaire traumatique ou iatrogène. À froid, elle s’adresse à une lésion localisée à haut risque de récidive, comme un aspergillome, des bronchectasies localisées ou un cancer opérable, chez un patient dont la fonction respiratoire permet l’exérèse.</p><p class="lab">Résultats</p><p>Jusqu’aux années 1980, la mortalité chirurgicale atteignait 37 à 42 % en urgence et 7 à 18 % entre deux épisodes ; elle reste de 4 à 19 % dans les séries récentes, en raison du saignement peropératoire et d’une exérèse parfois mal ciblée. À froid, l’exérèse est curative : la récidive n’est que de 2,2 à 3,4 %. Le Collège français la limite aux lésions localisées et unilatérales, autorisant une lobectomie ou plus rarement une pneumonectomie.</p><div class="key"><b>Principe.</b> Opérer après l’hémostase par embolisation et le bilan fonctionnel, plutôt que pendant le saignement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., 2015</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a>.</p></template>
<template data-pop="r04-suivi" data-title="Suivi après une hémoptysie"><p class="lab">Données</p><p>Dans la cohorte italienne de 606 patients suivis 18 mois, 13,7 % sont décédés, le plus souvent de la maladie causale, et 17 % ont récidivé ; 3,6 % des diagnostics ont changé, dont des cancers d’abord classés hémoptysie idiopathique, pneumonie ou exacerbation de BPCO. Les auteurs recommandent un suivi des patients d’abord classés infection respiratoire basse ou saignement idiopathique.</p><p class="lab">Contenu</p><p>Contrôle de la cessation du saignement ; traitement de la cause ; nouvelle imagerie et bronchoscopie si l’hémoptysie récidive ; surveillance prolongée du fumeur. Après une embolisation, une récidive fait rechercher une collatérale non bronchique puis une origine artérielle pulmonaire.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8336236/" target="_blank" rel="noopener">Mondoni et al., 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">CIRSE 2022</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a>.</p></template>
<template data-pop="r04-grossesse" data-title="Hémoptysie pendant la grossesse"><p>Les sources européennes lues ne proposent pas de conduite spécifique validée. Un cas publié dans <i>Pneumologie</i> en 2019 illustre le risque : une patiente de 41 ans a présenté une hémoptysie à 29 semaines, interprétée comme inflammatoire, puis une hémoptysie abondante avec vertiges à 34 semaines, révélant une malformation artérioveineuse pulmonaire idiopathique. Bronchoscopie, césarienne en urgence, scanner thoracique puis résection segmentaire ont été menés en concertation interdisciplinaire.</p><div class="key"><b>Médicaments.</b> La terlipressine est contre-indiquée pendant la grossesse, sauf indication vitale évaluée au cas par cas, car elle peut provoquer des contractions utérines ; l’acide tranexamique n’est pas recommandé au premier trimestre et ne s’emploie qu’en cas de nécessité absolue ensuite ; l’allaitement n’est pas recommandé sous acide tranexamique injectable.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30895588/" target="_blank" rel="noopener">Forster et Schulte, Pneumologie 2019</a> ; informations professionnelles suisses Glypressine® et Tranexamic acid Leman® (consultées le 09.10.2026).</p></template>
