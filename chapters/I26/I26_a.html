<div class="chap-head"><div class="code">I26 · CIM-10-GM 2026 · Poumon, plèvre et ventilation</div><h1>Embolie pulmonaire aiguë de l’adulte</h1><span class="status">Édition du 26.09.2026 · ESC/ERS 2019 et AHA/ACC 2026 · audit clinique indépendant requis</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’embolie pulmonaire</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Embolie pulmonaire : du soupçon à la décision</b><ol><li><a href="#i26-0">Question clinique</a></li><li><a href="#i26-1">Définir et classer</a></li><li><a href="#i26-2">Épidémiologie suisse</a></li><li><a href="#i26-3">Mécanismes</a></li><li><a href="#i26-4">Étiologies</a></li><li><a href="#i26-5">Anamnèse</a></li><li><a href="#i26-6">Examen clinique</a></li><li><a href="#i26-7">Diagnostic</a></li><li><a href="#i26-8">Gravité</a></li><li><a href="#i26-9">Traitement</a></li><li><a href="#i26-10">Suivi</a></li><li><a href="#i26-11">Situations particulières</a></li><li><a href="#i26-12">Diagnostic formel</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="i26-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><div class="key"><b>Cas fil rouge.</b> Une femme de 68 ans, opérée du genou il y a douze jours, présente une dyspnée nouvelle et une douleur basithoracique gauche. Elle respire 26 fois par minute ; sa pression systolique est de 118 mmHg. La question immédiate est double : l’embolie est-elle probable et menace-t-elle la circulation ?</div><p>À la fin du cours, savoir choisir une stratégie de confirmation selon la stabilité et la probabilité clinique ; distinguer le diagnostic de la gravité ; prescrire l’anticoagulation initiale adaptée au terrain ; décider de la durée et du suivi. Une saturation ou une radiographie normale ne ferment pas l’enquête.</p></section>
<section class="ilot" id="i26-1"><h2><span class="n">1</span>Définition et classification</h2><p>L’embolie pulmonaire aiguë est l’obstruction d’une artère pulmonaire par un thrombus, le plus souvent formé dans le réseau veineux profond. Un thrombus directement visible dans une artère pulmonaire segmentaire ou proximale en angiographie tomodensitométrique est un signe diagnostique ; sa seule taille anatomique n’établit pas le risque de décès.</p><p>L’ESC/ERS 2019 distingue le <button class="w" data-k="i26-hautrisque">haut risque hémodynamique (définition)</button>, puis, si le patient est stable, le risque faible, intermédiaire bas et intermédiaire haut en tenant compte du score clinique, du ventricule droit et des biomarqueurs. L’AHA/ACC 2026 ajoute les <button class="w" data-k="i26-categories">catégories cliniques A à E (répartition)</button>. Ces deux cadres ne sont pas interchangeables mot pour mot.</p><div class="trap"><span class="k">Piège</span>« Embolie massive » est ambigu : documenter la pression artérielle, la perfusion, les besoins respiratoires et le ventricule droit plutôt que le seul siège du caillot.</div></section>
<section class="ilot" id="i26-2"><h2><span class="n">2</span>Épidémiologie et conséquences</h2><p>La cohorte nationale suisse de Wolf et collaborateurs, publiée en 2025, a étudié <b>180 600 hospitalisations</b> pour embolie pulmonaire chez les personnes d’au moins 15 ans entre 2003 et 2022. Ce total porte sur les hospitalisations pendant vingt ans et ne constitue ni une incidence annuelle ni un nombre de personnes distinctes ; les cas traités exclusivement en ambulatoire ne sont pas comptés. Les épisodes avec instabilité hémodynamique avaient une létalité hospitalière nettement supérieure dans cette étude.</p><p>À court terme, l’obstruction peut provoquer une défaillance du ventricule droit et un choc. À distance, les complications concernent la récidive et une maladie thromboembolique pulmonaire chronique ; toute dyspnée persistante mérite une évaluation sans présumer qu’elle est due au déconditionnement.</p></section>
<section class="ilot" id="i26-3"><h2><span class="n">3</span>Physiopathologie : caillot, charge ventriculaire, hypoxémie</h2><p>En situation normale, le ventricule droit propulse le sang à travers un lit vasculaire pulmonaire à faible résistance. Un <button class="w" data-k="i26-thrombus">thrombus veineux (formation et migration)</button> obstrue une partie de ce lit ; la résistance vasculaire augmente. Le ventricule droit se dilate, l’interdépendance des ventricules gêne le remplissage gauche, et le débit cardiaque peut chuter. Ce trajet explique pourquoi une hypotension persistante exige une réponse urgente.</p><p>Les alvéoles situées en aval d’une artère bouchée peuvent rester ventilées sans être perfusées : <button class="w" data-k="i26-espace">espace mort et déséquilibre ventilatoire (mécanisme)</button>. La redistribution du débit, l’atélectasie et une éventuelle baisse du débit cardiaque contribuent à l’hypoxémie. Une irritation pleurale liée à un infarctus périphérique explique parfois une douleur inspiratoire et une hémoptysie discrète.</p><svg viewBox="0 0 380 118" role="img" aria-label="Circulation pulmonaire normale et embolie avec charge du ventricule droit" style="max-width:100%;height:auto"><g fill="none" stroke="#222" stroke-width="2"><rect x="8" y="24" width="168" height="70" rx="8"/><rect x="204" y="24" width="168" height="70" rx="8"/><path d="M35 65 H149 M226 65 H350"/><path d="M277 51 l14 14 -14 14"/></g><g fill="#222" font-size="11"><text x="20" y="16">1 · Débit pulmonaire normal</text><text x="211" y="16">2 · Thrombus dans une artère</text><text x="24" y="51">Ventricule droit → poumon</text><text x="215" y="48">Ventricule droit dilaté</text><text x="215" y="87">Perfusion diminuée</text></g></svg><div class="key"><b>Corrélation physiologique.</b> Une troponine élevée dans une embolie confirmée peut traduire une lésion ventriculaire droite et sert à stratifier le risque ; elle ne prouve ni l’embolie ni un infarctus coronaire.</div><button class="pareto-btn ui" data-k="pareto-i26-fondements">▲ Loi de Pareto — Définition et mécanismes</button></section>
<section class="ilot" id="i26-4"><h2><span class="n">4</span>Facteurs de risque et circonstances</h2><p>Rechercher une chirurgie ou un traumatisme récent, une immobilisation, un cancer actif, une grossesse ou un post-partum, les œstrogènes, une thrombose antérieure et les facteurs persistants tels qu’un syndrome des antiphospholipides. Une chirurgie majeure récente constitue un facteur transitoire fort ; un cancer actif modifie le choix de l’anticoagulant et la durée. L’absence de facteur identifiable n’écarte pas l’embolie.</p><p>Qualifier le facteur causal avant d’envisager l’arrêt de l’anticoagulation : <button class="w" data-k="i26-provocation">facteur majeur transitoire ou persistant (conséquences)</button>. Une enquête exhaustive de cancer par tomodensitométrie systématique n’est pas justifiée par la seule embolie sans signe d’appel ; appliquer les dépistages appropriés à l’âge et l’examen clinique.</p></section>
<section class="ilot" id="i26-5"><h2><span class="n">5</span>Anamnèse ciblée</h2><h3>5.1 Antécédents pertinents et médicaments</h3><div class="two"><div class="card"><b>Terrain thrombotique</b><p><button class="w" data-k="i26-a-chir">chirurgie et immobilisation (questions)</button> ; <button class="w" data-k="i26-a-cancer">cancer actif (questions)</button> ; <button class="w" data-k="i26-a-vte">thrombose antérieure (questions)</button> ; <button class="w" data-k="i26-a-oes">œstrogènes et grossesse (questions)</button>.</p></div><div class="card"><b>Sécurité du traitement</b><p><button class="w" data-k="i26-a-bleed">saignement et anticoagulants (questions)</button> ; maladie rénale, hépatopathie, allergies au contraste, médicaments inducteurs ou inhibiteurs enzymatiques, accès au suivi et souhaits de la patiente.</p></div></div><h3>5.2 Signes fonctionnels et présentations</h3><div class="two"><div class="card"><b>Tableau fréquent</b><p><button class="w" data-k="i26-s-dysp">dyspnée (caractérisation)</button>, <button class="w" data-k="i26-s-pain">douleur thoracique (caractérisation)</button>, <button class="w" data-k="i26-s-leg">douleur ou gonflement unilatéral de jambe (examen)</button>.</p></div><div class="card"><b>Tableaux menaçants ou trompeurs</b><p><button class="w" data-k="i26-s-syn">syncope (urgence)</button>, hémoptysie, tachycardie inexpliquée ou aggravation d’une insuffisance cardiorespiratoire. Une embolie peut avoir peu de signes subjectifs chez la personne âgée.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span>Une toux fébrile ou une radiographie anormale n’exclut pas une embolie associée ; chercher la discordance entre dyspnée, examen et facteurs de risque.</div></section>
<section class="ilot" id="i26-6"><h2><span class="n">6</span>Examen clinique : gravité avant certitude</h2><p><b>État général :</b> mesurer conscience, perfusion périphérique et capacité à parler. <b>Constantes :</b> pression répétée, fréquence cardiaque et respiratoire, saturation avec indication de l’oxygène délivré, température. <b>Anthropométrie :</b> poids pour doses dépendantes du poids ; ne retarder aucun geste vital pour l’obtenir.</p><div class="two"><div class="card"><b>Circulation et respiration</b><ul><li><button class="w" data-k="i26-x-bp">hypotension et signes de choc (mesure et seuil)</button></li><li><button class="w" data-k="i26-x-oxy">tachypnée et saturation (mesure et limites)</button></li><li><button class="w" data-k="i26-x-heart">tachycardie et jugulaires (interprétation)</button></li></ul></div><div class="card"><b>Signes localisés</b><ul><li><button class="w" data-k="i26-x-leg">jambe asymétrique (technique et piège)</button></li><li><button class="w" data-k="i26-x-lung">auscultation et plèvre (interprétation)</button></li><li>Rechercher aussi un pneumothorax sous tension, une insuffisance cardiaque aiguë ou une dissection selon le contexte.</li></ul></div></div><div class="alert"><b>Priorité.</b> Hypotension persistante, syncope avec mauvaise perfusion, altération de conscience ou hypoxémie sévère imposent surveillance et bilan immédiats. Un score clinique faible ne remplace jamais ces observations.</div><button class="pareto-btn ui" data-k="pareto-i26-clinique">▲ Loi de Pareto — Terrain et clinique</button></section>
