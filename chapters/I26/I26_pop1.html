<template data-pop="i26-hautrisque" data-title="Instabilité hémodynamique : définition de l’ESC/ERS 2019">
<div class="lab">Définition</div><p>L’ESC/ERS 2019 définit l’embolie à haut risque par l’une de trois présentations. La première est l’arrêt cardiaque, qui impose une réanimation cardiopulmonaire. La deuxième est le choc obstructif : une pression systolique inférieure à 90 mmHg, ou des vasopresseurs nécessaires pour atteindre 90 mmHg malgré un remplissage adéquat, associée à une hypoperfusion des organes. La troisième est l’hypotension persistante. La pression systolique reste inférieure à 90 mmHg, ou elle chute d’au moins 40 mmHg, pendant plus de 15 minutes. Aucune arythmie nouvelle, aucune hypovolémie et aucun sepsis ne l’expliquent.</p>
<div class="lab">Signes d’hypoperfusion</div><p>L’hypoperfusion se reconnaît à une altération de l’état mental, à une peau froide et moite, à une oligurie ou une anurie, et à un lactate sérique élevé (ESC/ERS 2019, tableau 4).</p>
<div class="lab">Pourquoi ces critères</div><p>Ils traduisent une défaillance du ventricule droit assez grave pour faire baisser le débit systémique. Ils prédisent un risque élevé de décès précoce, hospitalier ou à 30 jours.</p>
<div class="lab">Piège</div><p>Un patient peut garder une pression normale malgré une hypoperfusion. L’AHA/ACC 2026 nomme cette situation « choc normotensif » et la classe dans sa catégorie D. Ce patient impose une surveillance rapprochée, même s’il n’entre pas dans la définition du haut risque de l’ESC/ERS 2019.</p>
<div class="lab">Conséquence pratique</div><p>Devant l’un de ces critères, le médecin débute l’héparine non fractionnée, appelle l’équipe de soins critiques et prépare une reperfusion. Il ne calcule pas le score PESI et n’attend pas la troponine, que l’ESC/ERS 2019 juge inutiles à la décision dans ce cas.</p></template>
<template data-pop="i26-categories" data-title="Catégories A à E de l’AHA/ACC 2026">
<div class="lab">Principe</div><p>L’AHA/ACC 2026 classe l’embolie en cinq catégories cliniques, de A à E, par gravité croissante. Cette grille ne remplace pas la classification de l’ESC/ERS 2019 : elle s’en rapproche sans lui correspondre mot pour mot.</p>
<div class="lab">Catégories A et B</div><p>La catégorie A regroupe les embolies infracliniques, découvertes fortuitement et asymptomatiques. La catégorie B regroupe les embolies symptomatiques dont le score de sévérité clinique est faible. Son premier sous-groupe comprend l’embolie sous-segmentaire, unique ou multiple ; son second comprend l’embolie non sous-segmentaire.</p>
<div class="lab">Catégorie C</div><p>La catégorie C regroupe les embolies symptomatiques dont le score de sévérité clinique est élevé. Elle se subdivise selon le ventricule droit et les biomarqueurs. Dans le premier sous-groupe, le ventricule droit et les biomarqueurs sont normaux. Dans le deuxième, le ventricule droit est anormal ou au moins un biomarqueur est anormal. Dans le troisième, le ventricule droit est anormal et au moins un biomarqueur est anormal.</p>
<div class="lab">Catégories D et E</div><p>La catégorie D correspond à une défaillance cardiorespiratoire débutante. Son premier sous-groupe est l’hypotension transitoire ; son second est le choc normotensif. La figure officielle n’en donne pas le détail. La synthèse de <i>Critical Care and Resuscitation</i> (2026) décrit ce choc comme une pression artérielle normale ou presque normale associée à un signe d’hypoperfusion. Ce signe peut être un lactate élevé, une oligurie ou une insuffisance rénale aiguë. Il peut aussi être une altération de l’état mental ou un index cardiaque bas. La catégorie E correspond à la défaillance cardiorespiratoire. Son premier sous-groupe associe une hypotension récidivante ou persistante à un choc cardiogénique. Son second est le choc cardiogénique réfractaire ou l’arrêt cardiaque.</p>
<div class="lab">Modificateur respiratoire</div><p>Le modificateur respiratoire R peut s’ajouter aux catégories C, D et E, avec un seuil propre à chacune. Pour la catégorie C, il s’agit d’une saturation inférieure à 90 %, d’une fréquence respiratoire d’au moins 30 par minute ou d’un besoin en oxygène. Pour la catégorie D, il s’agit d’un débit d’oxygène supérieur à 6 L/min par lunettes nasales ou d’un masque à haute concentration. Pour la catégorie E, il s’agit d’une insuffisance respiratoire hypoxémique ou ventilatoire.</p>
<div class="lab">Conséquence pratique</div><p>L’AHA/ACC 2026 propose d’hospitaliser les catégories C, D et E et d’envisager une sortie précoce pour les catégories A et B. Les sous-groupes modifient certaines décisions de reperfusion, mais aucune lettre ne prescrit à elle seule un traitement interventionnel.</p></template>
<template data-pop="i26-thrombus" data-title="Formation et migration du thrombus veineux">
<div class="lab">Définition</div><p>Le thrombus veineux est un caillot formé dans une veine profonde, le plus souvent d’un membre inférieur. Il contient beaucoup de fibrine et de globules rouges.</p>
<div class="lab">Mécanisme</div><p>Trois conditions favorisent sa formation : la stase sanguine, l’hypercoagulabilité et la lésion de la paroi veineuse. Cette triade, décrite par Virchow, explique l’action des facteurs de risque ; elle n’est pas un score diagnostique. Une partie du caillot se détache ensuite et remonte par la veine cave inférieure, l’oreillette droite et le ventricule droit jusqu’à l’artère pulmonaire.</p>
<div class="lab">Chiffres</div><p>Dans une étude par phlébographie citée par l’ESC/ERS 2019, une thrombose veineuse profonde existait chez 70 % des patients porteurs d’une embolie prouvée. L’échographie de compression en retrouve chez 30 à 50 % des patients. L’embolie provient rarement d’une thrombose du membre supérieur, le plus souvent liée à un cathéter veineux.</p>
<div class="lab">Piège</div><p>Une échographie normale des jambes au moment de la consultation n’exclut pas l’embolie : le caillot a pu migrer entièrement, ou siéger dans une veine que l’examen limité n’explore pas.</p>
<div class="lab">Conséquence pratique</div><p>Chez un patient suspect d’embolie, une thrombose proximale prouvée suffit à traiter. Une échographie négative ne dispense pas de l’imagerie thoracique.</p></template>
<template data-pop="i26-espace" data-title="Espace mort et déséquilibre ventilation-perfusion">
<div class="lab">Le normal</div><p>Dans un poumon sain, chaque alvéole reçoit à la fois de l’air et du sang, dans des proportions voisines. Cet appariement permet au sang de s’oxygéner et de rejeter le dioxyde de carbone.</p>
<div class="lab">Mécanisme dans l’embolie</div><p>En aval d’une artère obstruée, les alvéoles restent ventilées mais ne sont plus perfusées : elles forment un espace mort, qui ne participe plus aux échanges. Le sang détourné afflue dans les territoires restés perméables, où la perfusion dépasse la ventilation ; ce sang s’oxygène mal. L’ESC/ERS 2019 attribue l’hypoxémie à ce déséquilibre, aggravé par la baisse du débit cardiaque et parfois par un shunt par foramen ovale perméable. Des atélectasies y contribuent aussi.</p>
<div class="lab">Conséquences mesurables</div><p>Le patient hyperventile, ce qui abaisse la PaCO₂ : l’hypocapnie est fréquente. La saturation peut pourtant rester normale, chez jusqu’à 40 % des patients selon l’ESC/ERS 2019.</p>
<div class="lab">Piège</div><p>Une oxygénation normale ne garantit ni l’absence d’embolie ni une circulation stable. À l’inverse, une hypoxémie très sévère et réfractaire à l’oxygène fait chercher un shunt droite-gauche.</p></template>
<template data-pop="i26-provocation" data-title="Facteur déclenchant : transitoire, persistant ou absent">
<div class="lab">Définition</div><p>Le facteur déclenchant est la circonstance qui a favorisé l’épisode. L’ESC/ERS 2019 le qualifie par sa force et par sa persistance, et elle renonce aux termes « provoqué », « non provoqué » et « idiopathique ».</p>
<div class="lab">Catégories</div><p>Le facteur transitoire ou réversible majeur multiplie le risque par plus de dix. Il peut s’agir d’une chirurgie sous anesthésie générale de plus de 30 minutes. Il peut s’agir aussi d’un alitement hospitalier d’au moins trois jours pour une maladie aiguë, ou d’un traumatisme avec fracture. Le facteur transitoire mineur multiplie le risque au plus par dix : chirurgie mineure, traitement œstrogénique, grossesse ou post-partum, vol long-courrier, blessure de jambe sans fracture. Le facteur persistant non cancéreux comprend la maladie inflammatoire de l’intestin et la maladie auto-immune active. Les situations à haut risque réunissent le cancer actif, les épisodes récidivants sans facteur majeur et le syndrome des antiphospholipides.</p>
<div class="lab">Pourquoi cette qualification</div><p>Elle prédit le risque de récidive si l’anticoagulation s’arrête à trois mois (ESC/ERS 2019, tableau 11). Ce risque est inférieur à 3 % par an après un facteur majeur. Il vaut 3 à 8 % par an après un facteur mineur, avec un facteur persistant non cancéreux ou sans facteur identifiable. Il dépasse 8 % par an dans les situations à haut risque.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin note la date, la force et la disparition du facteur dès l’admission. Cette qualification décide, à trois mois, de l’arrêt ou de la poursuite de l’anticoagulation. Elle se rediscute si les facteurs changent.</p></template>
<template data-pop="i26-a-chir" data-title="Chirurgie et immobilisation : les questions à poser">
<div class="lab">Questions</div><p>Le médecin demande la date et le type de l’intervention, ainsi que le type et la durée de l’anesthésie. Il demande la durée de l’alitement et la présence d’un plâtre ou d’une attelle. Il fait préciser la difficulté à mobiliser la jambe et la prophylaxie reçue, avec ses dates.</p>
<div class="lab">Pourquoi</div><p>L’ESC/ERS 2019 classe ces circonstances selon leur force. La prothèse de hanche ou de genou, la fracture d’un membre inférieur et le traumatisme majeur sont des facteurs forts. L’arthroscopie du genou est un facteur modéré. La chirurgie laparoscopique et l’alitement de plus de trois jours sont des facteurs faibles. La chirurgie lèse les veines, immobilise le patient et active la coagulation.</p>
<div class="lab">Dans les scores</div><p>Le score de Wells compte 1,5 point pour une immobilisation de plus de trois jours ou une chirurgie dans les quatre semaines précédentes. Le score de Genève révisé compte 2 points pour une chirurgie ou une fracture dans le mois précédent. La règle PERC exige l’absence de chirurgie ou de traumatisme récents.</p>
<div class="lab">Piège</div><p>Une prophylaxie médicamenteuse, en cours ou récente, n’écarte pas l’embolie. La durée de l’anesthésie compte aussi : au-delà de 30 minutes d’anesthésie générale, l’ESC/ERS 2019 considère la chirurgie comme un facteur transitoire majeur.</p>
<div class="lab">Conséquence pratique</div><p>Chez la patiente du cas, la prothèse du genou posée douze jours plus tôt compte dans les deux scores. Elle constitue un facteur transitoire majeur : l’anticoagulation pourra s’arrêter à trois mois.</p></template>
<template data-pop="i26-a-cancer" data-title="Cancer : questions et conséquences">
<div class="lab">Questions</div><p>Le médecin demande la localisation et le stade du cancer, ainsi que la présence de métastases. Il fait préciser les traitements en cours ou récents et les saignements digestifs ou urinaires. Il consulte enfin le chiffre des plaquettes.</p>
<div class="lab">Pourquoi</div><p>Le cancer est un facteur de risque modéré, maximal en cas de métastases (ESC/ERS 2019). Les cancers du pancréas, les hémopathies malignes et les cancers du poumon, de l’estomac et du cerveau exposent au risque le plus élevé. Le cancer augmente aussi la mortalité toutes causes après l’épisode.</p>
<div class="lab">Dans les scores</div><p>Le score de Wells compte 1 point pour un cancer en cours de traitement, traité dans les six derniers mois ou en phase palliative. Le score de Genève révisé compte 2 points pour un cancer actif. Le sPESI compte 1 point et le PESI 30 points pour un cancer.</p>
<div class="lab">Conséquences pratiques</div><p>Le cancer modifie le choix de l’anticoagulant, surtout en cas de cancer digestif, et impose une durée prolongée, indéfinie ou jusqu’à la guérison. Une embolie découverte fortuitement sur un scanner de bilan se traite parfois comme une embolie symptomatique (ESC/ERS 2019). C’est le cas si elle atteint une branche segmentaire ou plus proximale, ou plusieurs branches sous-segmentaires. C’est aussi le cas si elle atteint une seule branche sous-segmentaire avec une thrombose veineuse prouvée.</p>
<div class="lab">Piège</div><p>Une embolie sans facteur apparent ne justifie pas un scanner abdominal systématique à la recherche d’un cancer occulte. Un bilan limité, fondé sur l’interrogatoire, l’examen, une biologie de base et une radiographie thoracique, suffit (ESC/ERS 2019).</p></template>
<template data-pop="i26-a-vte" data-title="Antécédent de thrombose ou d’embolie">
<div class="lab">Questions</div><p>Le médecin documente la date, le siège, la circonstance et la durée du traitement de chaque épisode antérieur, ainsi que les interruptions d’anticoagulation. Il demande les comptes rendus d’imagerie, car un antécédent non prouvé n’a pas la même valeur.</p>
<div class="lab">Pourquoi</div><p>Un antécédent de maladie thromboembolique veineuse est un facteur fort, qui multiplie le risque par plus de dix (ESC/ERS 2019). Il signale un terrain thrombogène qui persiste.</p>
<div class="lab">Dans les scores</div><p>Le score de Wells compte 1,5 point et le score de Genève révisé 3 points pour une thrombose ou une embolie antérieure. La règle PERC exige l’absence d’antécédent.</p>
<div class="lab">Conséquence pratique</div><p>Une récidive non liée à un facteur transitoire majeur fait recommander une anticoagulation orale de durée indéfinie (ESC/ERS 2019, classe I, niveau B). Une embolie survenue sous anticoagulation efficace fait envisager un filtre cave (classe IIa, niveau C) et exclut le traitement à domicile selon la règle de Hestia.</p></template>
<template data-pop="i26-a-oes" data-title="Œstrogènes, grossesse et post-partum">
<div class="lab">Questions</div><p>Le médecin demande à la patiente sa contraception, un traitement hormonal de la ménopause, une grossesse possible, la date d’un accouchement récent et une éventuelle fécondation in vitro.</p>
<div class="lab">Pourquoi</div><p>La contraception orale combinée multiplie le risque par deux à six environ. C’est le facteur de risque le plus fréquent chez la femme en âge de procréer. Les pilules de troisième génération exposent davantage que celles de deuxième génération. Le risque du traitement hormonal de la ménopause dépend de sa formulation. Le risque augmente pendant la grossesse et culmine après l’accouchement. Après une fécondation in vitro, le rapport de risques instantanés atteignait 4,22 au premier trimestre dans un registre suédois (ESC/ERS 2019).</p>
<div class="lab">Dans les scores</div><p>La règle PERC exige l’absence de prise hormonale orale.</p>
<div class="lab">Alternatives</div><p>Les dispositifs intra-utérins libérant un progestatif et certaines pilules progestatives seules n’augmentent pas significativement le risque. Après conseil, ils sont souvent proposés aux femmes ayant un antécédent personnel ou familial marqué de thrombose (ESC/ERS 2019).</p>
<div class="lab">Conséquence pratique</div><p>Une grossesse change le diagnostic et le traitement : l’héparine de bas poids moléculaire remplace les anticoagulants oraux directs, qui ne sont recommandés ni pendant la grossesse ni pendant l’allaitement.</p></template>
<template data-pop="i26-a-bleed" data-title="Risque hémorragique : ce qu’il faut interroger">
<div class="lab">Questions</div><p>Le médecin recherche un saignement actif et un antécédent d’hémorragie, en particulier intracrânienne. Il demande s’il y a eu une chirurgie ou un accident vasculaire cérébral récents. Il recherche une maladie du foie ou du rein, une anémie et un chiffre de plaquettes bas. Il interroge enfin sur les chutes et sur les médicaments qui favorisent le saignement.</p>
<div class="lab">Facteurs retenus par l’ESC/ERS 2019</div><p>Huit facteurs augmentent le risque de saignement sous anticoagulant.</p><ul><li>L’âge est avancé, surtout au-delà de 75 ans.</li><li>Le patient a eu une hémorragie antérieure, ou il a une anémie.</li><li>Il a un cancer actif.</li><li>Il a eu un accident vasculaire cérébral.</li><li>Il a une maladie rénale ou hépatique chronique.</li><li>Il prend en plus un antiagrégant ou un anti-inflammatoire non stéroïdien.</li><li>Il a une autre maladie grave.</li><li>Son anticoagulation est mal contrôlée.</li></ul><p>Le médecin réévalue ces facteurs pendant tout le traitement.</p>
<div class="lab">Critères de la règle de Hestia</div><p>La règle de Hestia retient un risque hémorragique élevé dans six situations.</p><ul><li>Le patient a eu une hémorragie digestive dans les 14 jours.</li><li>Il a eu un accident vasculaire cérébral il y a moins de quatre semaines.</li><li>Il a été opéré il y a moins de deux semaines.</li><li>Il a un trouble de l’hémostase.</li><li>Ses plaquettes sont inférieures à 75 × 10⁹/L.</li><li>Son hypertension n’est pas contrôlée : la pression systolique dépasse 180 mmHg ou la diastolique 110 mmHg.</li></ul><p>Une seule de ces situations exclut le traitement à domicile selon cette règle.</p>
<div class="lab">Piège</div><p>Une contre-indication relative n’annule pas la nécessité de traiter une embolie menaçante : le médecin pèse les deux risques au lieu d’en ignorer un.</p>
<div class="lab">Conséquence pratique</div><p>Le risque hémorragique guide le choix de la molécule, la décision de thrombolyse, le lieu de soins et la durée du traitement. Il se réévalue ensuite régulièrement.</p></template>
<template data-pop="i26-s-dysp" data-title="Dyspnée">
<div class="lab">Définition</div><p>La dyspnée est une sensation de respiration difficile ou insuffisante. Dans l’embolie, elle est le symptôme le plus fréquent.</p>
<div class="lab">Fréquence</div><p>Dans PIOPED II, 73 % des patients sans maladie cardiopulmonaire préalable avaient une dyspnée : au repos chez 55 %, à l’effort seulement chez 16 %. Une orthopnée existait chez 28 %. Parmi les patients dyspnéiques, la dyspnée s’était installée en quelques secondes ou minutes chez 72 %, mais sur plusieurs jours chez 17 %.</p>
<div class="lab">Mécanisme</div><p>La dyspnée résulte du déséquilibre ventilation-perfusion, de l’hypoxémie et de la baisse du débit cardiaque. Selon l’ESC/ERS 2019, elle peut être brutale et sévère dans l’embolie centrale, mais légère et transitoire dans une petite embolie périphérique.</p>
<div class="lab">Caractérisation</div><p>Le médecin précise le mode de début, l’intensité au repos et à l’effort, l’existence d’une dyspnée antérieure et la saturation, en notant si le patient respire de l’air ou de l’oxygène.</p>
<div class="lab">Piège</div><p>Chez l’insuffisant cardiaque ou respiratoire, l’aggravation de la dyspnée habituelle peut être le seul symptôme. Chez le sujet âgé sans maladie cardiopulmonaire, la dyspnée est moins fréquente. Une dyspnée plus marquée que ne l’expliquent l’auscultation et l’image augmente la suspicion, sans être spécifique.</p></template>
<template data-pop="i26-s-pain" data-title="Douleur thoracique">
<div class="lab">Fréquence</div><p>Dans PIOPED II, une douleur pleurale existait chez 44 % des patients sans maladie cardiopulmonaire préalable, et une douleur thoracique non pleurale chez 19 %.</p>
<div class="lab">Caractérisation</div><p>La douleur pleurale est latéralisée et augmente à l’inspiration profonde ou à la toux. Selon l’ESC/ERS 2019, elle vient le plus souvent d’une irritation pleurale par des emboles distaux, responsables d’un infarctus pulmonaire. Dans l’embolie centrale, la douleur peut avoir un caractère angineux, probablement par ischémie du ventricule droit.</p>
<div class="lab">Diagnostics à écarter</div><p>Une douleur oppressive avec irradiation fait chercher un syndrome coronarien aigu. Une douleur brutale, déchirante ou migratrice fait chercher une dissection aortique. Ces deux diagnostics changent radicalement le traitement, et la dissection contre-indique l’anticoagulation.</p>
<div class="lab">Piège</div><p>L’absence de douleur ne rassure pas : plus de la moitié des patients de PIOPED II n’avaient pas de douleur pleurale.</p></template>
<template data-pop="i26-s-leg" data-title="Symptômes de jambe">
<div class="lab">Fréquence</div><p>Dans PIOPED II, 44 % des patients sans maladie cardiopulmonaire préalable signalaient une douleur du mollet ou de la cuisse, et 41 % un gonflement. Une douleur ou un gonflement de la cuisse sans atteinte du mollet était rare.</p>
<div class="lab">Mécanisme</div><p>Ces symptômes traduisent une thrombose veineuse profonde, source habituelle de l’embole.</p>
<div class="lab">Questions</div><p>Le médecin demande le côté atteint, la date de début, la douleur spontanée, le gonflement, une immobilisation et un épisode antérieur.</p>
<div class="lab">Dans les scores</div><p>Le score de Genève révisé compte 3 points pour une douleur unilatérale d’un membre inférieur. La règle PERC exige l’absence de gonflement unilatéral de jambe.</p>
<div class="lab">Piège</div><p>L’absence de symptôme de jambe n’exclut ni une thrombose ni une embolie déjà constituée. Après une chirurgie du membre inférieur, le gonflement peut aussi être postopératoire.</p></template>
<template data-pop="i26-s-syn" data-title="Syncope">
<div class="lab">Mécanisme</div><p>Dans l’embolie, la syncope traduit une chute brutale du débit cardiaque par défaillance du ventricule droit. Selon l’ESC/ERS 2019, elle s’associe à une fréquence plus élevée d’instabilité hémodynamique et de dysfonction du ventricule droit.</p>
<div class="lab">Fréquence de l’embolie chez les patients syncopés</div><p>Une étude italienne publiée en 2016 par Prandoni et collaborateurs, citée par l’ESC/ERS 2019, a recherché systématiquement l’embolie chez 560 patients hospitalisés pour une première syncope, d’âge moyen 76 ans. Elle en a trouvé chez 17,3 % d’entre eux, et chez 12,7 % des patients qui avaient une autre explication à leur syncope. D’autres travaux trouvent des chiffres bien plus faibles. Dans des bases administratives de quatre pays, l’embolie concernait 0,06 à 0,55 % des patients vus aux urgences pour syncope (Costantino et collaborateurs, 2018). Dans une étude multicentrique dirigée depuis Bâle, elle concernait 1,4 % de 1 397 patients non sélectionnés et 2,3 % des patients hospitalisés (Badertscher et collaborateurs, 2019).</p>
<div class="lab">Questions</div><p>Le médecin précise les circonstances, la durée de la perte de connaissance, un traumatisme et des palpitations. Il mesure la pression artérielle à plusieurs reprises. Il cherche aussi une arythmie ou un saignement, autres causes de syncope.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin ne recherche pas l’embolie chez tout patient syncopé, car sa prévalence reste faible aux urgences. Il la recherche lorsque d’autres éléments la suggèrent : dyspnée, tachycardie, facteur de risque, signe de thrombose. Chez un patient dont l’embolie est confirmée, une syncope signale une gravité potentielle et impose l’évaluation de l’instabilité et du ventricule droit.</p></template>
<template data-pop="i26-x-bp" data-title="Pression artérielle et perfusion">
<div class="lab">Technique</div><p>Le médecin utilise un brassard adapté à la circonférence du bras, mesure la pression aux deux bras, puis la répète à intervalles réguliers. Il note en même temps le pouls, la conscience, la coloration, la température des extrémités et la diurèse.</p>
<div class="lab">Seuils</div><p>Une pression systolique inférieure à 90 mmHg persistante, ou une chute d’au moins 40 mmHg pendant plus de 15 minutes, sans arythmie nouvelle, hypovolémie ni sepsis, définit le haut risque (ESC/ERS 2019). Une pression systolique inférieure à 100 mmHg compte 1 point dans le sPESI et 30 points dans le PESI.</p>
<div class="lab">Valeur</div><p>La pression mesure le résultat de la boucle d’aggravation du ventricule droit : quand elle baisse, la compensation est dépassée.</p>
<div class="lab">Piège</div><p>Une pression normale n’exclut pas une hypoperfusion : un lactate élevé, une oligurie ou une confusion peuvent précéder l’hypotension. Une asymétrie de pression entre les deux bras fait évoquer une dissection aortique, qui contre-indique l’anticoagulation.</p>
<div class="lab">Conséquence pratique</div><p>Une hypotension persistante impose l’échocardiographie au lit, l’héparine non fractionnée et l’appel de l’équipe de soins critiques.</p></template>
<template data-pop="i26-x-oxy" data-title="Fréquence respiratoire et oxygénation">
<div class="lab">Technique</div><p>Le médecin compte la fréquence respiratoire pendant une minute complète. Il note la saturation pulsée et le débit d’oxygène éventuellement administré.</p>
<div class="lab">Seuils</div><p>Dans PIOPED II, la tachypnée, définie par au moins 20 cycles par minute, touchait 54 % des patients sans maladie cardiopulmonaire préalable. Une fréquence supérieure à 30 par minute compte 20 points dans le PESI. Une saturation inférieure à 90 % compte dans le sPESI et le PESI, et elle indique l’oxygène selon l’ESC/ERS 2019. Une saturation supérieure à 94 % fait partie des critères de la règle PERC.</p>
<div class="lab">Valeur</div><p>La tachypnée est l’un des signes les plus fréquents : une dyspnée ou une tachypnée existait chez 84 % des patients de PIOPED II. La saturation, elle, reste normale chez jusqu’à 40 % des patients (ESC/ERS 2019).</p>
<div class="lab">Piège</div><p>Le mouvement, une mauvaise perfusion et certains vernis à ongles faussent l’oxymètre. Une saturation normale ne permet pas d’écarter une embolie.</p>
<div class="lab">Selon l’AHA/ACC 2026</div><p>Le modificateur respiratoire de la catégorie C correspond à une saturation inférieure à 90 %, à une fréquence respiratoire d’au moins 30 par minute ou à un besoin en oxygène. Pour la catégorie D, il correspond à un débit d’oxygène supérieur à 6 L/min ou à un masque à haute concentration.</p></template>
<template data-pop="i26-x-heart" data-title="Fréquence cardiaque, rythme et jugulaires">
<div class="lab">Technique</div><p>Le médecin mesure la fréquence et apprécie la régularité du pouls, puis il confirme le rythme sur l’électrocardiogramme. Il inspecte les veines jugulaires, patient installé en position demi-assise, et il note la position utilisée.</p>
<div class="lab">Fréquence et seuils</div><p>Dans PIOPED II, une fréquence cardiaque supérieure à 100/min touchait 24 % des patients sans maladie cardiopulmonaire préalable. Sur l’électrocardiogramme, l’ESC/ERS 2019 rapporte une tachycardie sinusale chez 40 % des patients, dans d’autres séries. La fréquence entre dans plusieurs scores, avec des seuils distincts. Le score de Genève révisé distingue 75 à 94/min et au moins 95/min. Le score de Wells retient plus de 100/min, et la règle PERC exige moins de 100/min. Le sPESI retient au moins 110/min.</p>
<div class="lab">Jugulaires</div><p>Une turgescence jugulaire existait chez 14 % des patients de PIOPED II. Elle suggère une pression élevée dans l’oreillette droite, donc une surcharge du cœur droit.</p>
<div class="lab">Piège</div><p>La tachycardie est fréquente mais non spécifique, et une fibrillation auriculaire nouvelle peut accompagner l’embolie. La turgescence jugulaire n’est pas un critère diagnostique ; associée à des bruits du cœur assourdis, elle fait évoquer une tamponnade.</p></template>
<template data-pop="i26-x-leg" data-title="Examen des membres inférieurs">
<div class="lab">Technique</div><p>Le médecin inspecte et palpe les deux jambes, du pied à la cuisse, en comparant les côtés. Il palpe les trajets veineux profonds et mesure, si besoin, la circonférence des deux mollets à la même hauteur.</p>
<div class="lab">Valeur</div><p>Dans PIOPED II, des signes de thrombose veineuse du mollet ou de la cuisse existaient chez 47 % des patients sans maladie cardiopulmonaire préalable. L’œdème en était le signe le plus fréquent. L’association d’un gonflement du mollet et d’une douleur à la palpation des veines profondes existait chez 32 % de l’ensemble des patients.</p>
<div class="lab">Dans les scores</div><p>Les signes cliniques de thrombose veineuse profonde valent 3 points dans le score de Wells. Ils se définissent au minimum par un gonflement de la jambe et une douleur à la palpation des veines profondes. La douleur à la palpation veineuse profonde avec un œdème unilatéral vaut 4 points dans le score de Genève révisé.</p>
<div class="lab">Piège</div><p>L’absence de signe n’exclut pas une thrombose, et le signe de Homans n’est pas fiable. Après une chirurgie du membre inférieur, la jambe opérée gonfle souvent sans thrombose. Seule l’échographie de compression tranche.</p></template>
<template data-pop="i26-x-lung" data-title="Auscultation pulmonaire et plèvre">
<div class="lab">Technique</div><p>Le médecin ausculte les deux champs pulmonaires de façon symétrique, percute le thorax et recherche un frottement pleural.</p>
<div class="lab">Valeur</div><p>Dans PIOPED II, l’examen pulmonaire n’était anormal que chez 29 % des patients sans maladie cardiopulmonaire préalable. Les crépitants (18 %) et la diminution du murmure vésiculaire (17 %) en étaient les anomalies les plus fréquentes. Les sibilants et les ronchi étaient rares, et le frottement pleural exceptionnel.</p>
<div class="lab">Mécanisme</div><p>Les crépitants et la matité traduisent une atélectasie, un infarctus pulmonaire ou un petit épanchement.</p>
<div class="lab">Piège</div><p>Une auscultation normale n’écarte pas l’embolie : c’est même la situation la plus fréquente. À l’inverse, un foyer de crépitants oriente aussi vers une pneumonie, et un silence auscultatoire unilatéral avec tympanisme fait chercher un pneumothorax.</p></template>
