<template data-pop="i26-hautrisque" data-title="Instabilité hémodynamique selon ESC/ERS 2019"><p>Le haut risque comprend arrêt cardiaque, choc obstructif ou hypotension persistante : pression systolique inférieure à 90 mmHg, ou baisse d’au moins 40 mmHg durant plus de quinze minutes, sans autre explication comme arythmie, hypovolémie ou sepsis. Un patient transitoirement normotendu malgré hypoperfusion impose aussi vigilance rapprochée.</p></template>
<template data-pop="i26-categories" data-title="Catégories A à E de l’AHA/ACC 2026"><p>A : embolie asymptomatique ; B : symptômes avec faible score de sévérité clinique ; C : sévérité clinique élevée et/ou biomarqueurs ou dysfonction ventriculaire droite ; D : défaillance cardiorespiratoire débutante ; E : défaillance avec hypotension persistante. Les sous-catégories modifient certaines décisions de reperfusion ; se référer au texte intégral pour les définir et ne pas déduire un traitement interventionnel automatique de la seule lettre.</p></template>
<template data-pop="i26-thrombus" data-title="Formation et migration du thrombus"><p>Stase veineuse, hypercoagulabilité et lésion endothéliale favorisent la thrombose ; ce triptyque physiopathologique n’est pas un score diagnostique. Une portion du caillot gagne la circulation pulmonaire en passant par le cœur droit. Une échographie négative des jambes au moment de la consultation n’exclut donc pas l’embolie pulmonaire.</p></template>
<template data-pop="i26-espace" data-title="Espace mort et trouble des échanges"><p>L’unité alvéolaire ventilée mais privée de perfusion contribue à l’espace mort ; la redistribution du débit produit aussi des zones de déséquilibre ventilation/perfusion. Cette combinaison, avec baisse du débit cardiaque ou atélectasie, explique l’hypoxémie. Une oxygénation encore normale ne garantit pas une circulation stable.</p></template>
<template data-pop="i26-provocation" data-title="Facteur transitoire ou persistant"><p>Préciser la force, le calendrier et la disparition du facteur : chirurgie majeure ou immobilisation récente sont des événements transitoires ; cancer actif ou syndrome des antiphospholipides peuvent persister. Cette qualification oriente l’anticoagulation au-delà de trois à six mois et doit être rediscutée si les facteurs changent.</p></template>
<template data-pop="i26-a-chir" data-title="Questionner chirurgie et immobilisation"><p>Rechercher date, type d’opération, séjour alité, plâtre, difficulté à mobiliser une jambe et prophylaxie reçue. Une opération du genou récente augmente la probabilité prétest ; le traitement déjà préventif ne suffit pas à écarter une embolie.</p></template>
<template data-pop="i26-a-cancer" data-title="Questionner le cancer"><p>Demander localisation, activité, métastases, traitements récents et saignements digestifs ou urinaires ; consulter les résultats de plaquettes. Ces éléments influencent risque de récidive, traitement et interactions, sans obliger à une recherche radiologique systématique d’un cancer occulte.</p></template>
<template data-pop="i26-a-vte" data-title="Antécédents de thrombose"><p>Documenter date, siège, circonstance et durée des épisodes antérieurs, ainsi que les interruptions d’anticoagulation. Dans Wells, un antécédent documenté de thrombose veineuse profonde ou d’embolie compte dans la probabilité clinique.</p></template>
<template data-pop="i26-a-oes" data-title="Œstrogènes, grossesse et période post-partum"><p>Demander contraception combinée, traitement hormonal, grossesse possible et date d’accouchement. Cette information modifie l’estimation du risque et le choix de l’anticoagulant ; les anticoagulants oraux directs ne sont pas le traitement habituel pendant grossesse ou allaitement.</p></template>
<template data-pop="i26-a-bleed" data-title="Interroger le risque hémorragique"><p>Rechercher saignement actif, hémorragie intracrânienne passée, chirurgie récente, plaquettes basses, maladie du foie ou du rein, médicaments antiagrégants et chutes. Une contre-indication relative n’annule pas la nécessité d’évaluer le risque d’une embolie menaçante.</p></template>
<template data-pop="i26-s-dysp" data-title="Caractériser la dyspnée"><p>Préciser début, caractère brusque ou progressif, dyspnée au repos et à l’effort, symptômes préexistants et saturation sous air ambiant ou oxygène. Une dyspnée disproportionnée par rapport à une auscultation pauvre augmente la suspicion sans être spécifique.</p></template>
<template data-pop="i26-s-pain" data-title="Caractériser la douleur thoracique"><p>Douleur pleurétique : latéralisée, aggravée par l’inspiration ou la toux ; rechercher une douleur oppressive, une irradiation et une douleur déchirante car infarctus coronarien et dissection restent des diagnostics dangereux. L’absence de douleur ne rassure pas.</p></template>
<template data-pop="i26-s-leg" data-title="Symptôme veineux de jambe"><p>Demander côté, début, douleur spontanée et gonflement, immobilisation et épisode antérieur. L’absence de symptôme jambier n’exclut pas une thrombose veineuse profonde ni une embolie déjà constituée.</p></template>
<template data-pop="i26-s-syn" data-title="Syncope et hypoperfusion"><p>Rechercher circonstances, durée de la perte de connaissance, traumatismes, palpitation et pression artérielle répétée. La syncope peut accompagner une réduction brutale du débit cardiaque par défaillance ventriculaire droite ; elle impose aussi la recherche d’arythmie ou de saignement.</p></template>
<template data-pop="i26-x-bp" data-title="Mesurer pression et perfusion"><p>Utiliser un brassard approprié, répéter la mesure et noter pouls, conscience, coloration et diurèse. Une pression systolique inférieure à 90 mmHg persistante ou une chute d’au moins 40 mmHg pendant plus de quinze minutes exige une investigation immédiate, après examen des autres causes.</p></template>
<template data-pop="i26-x-oxy" data-title="Mesurer respiration et oxygénation"><p>Compter une minute complète la fréquence respiratoire ; noter la saturation et le débit d’oxygène en cours. Le mouvement, la mauvaise perfusion et certains vernis faussent l’oxymètre. Une saturation normale ne permet pas d’écarter une embolie.</p></template>
<template data-pop="i26-x-heart" data-title="Examiner fréquence cardiaque et jugulaires"><p>Mesurer fréquence et rythme ; inspecter la pression jugulaire dans une position documentée. La tachycardie est fréquente mais non spécifique ; la turgescence jugulaire peut suggérer une surcharge du cœur droit, sans constituer un critère de diagnostic.</p></template>
<template data-pop="i26-x-leg" data-title="Comparer les membres inférieurs"><p>Inspecter et palper mollet et cuisse des deux côtés ; mesurer les circonférences à hauteur identique si utile. Œdème unilatéral et douleur du trajet veineux renforcent la suspicion ; ni l’absence de signe ni le signe de Homans n’excluent une thrombose.</p></template>
<template data-pop="i26-x-lung" data-title="Auscultation pulmonaire et signes pleuraux"><p>Auscultation symétrique et percussion ; une embolie peut laisser l’auscultation normale. Un foyer de crépitants ou un frottement pleural peut apparaître, mais oriente aussi vers d’autres diagnostics. Chercher un silence auscultatoire unilatéral compatible avec pneumothorax.</p></template>
