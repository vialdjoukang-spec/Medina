<template data-pop="i26-wells" data-title="Score de Wells à deux catégories">
<div class="lab">Items et points</div><p>Le score de Wells additionne sept items. Le tableau suivant donne leurs points.</p>
<table><tr><th>Item</th><th>Points</th></tr><tr><td>Signes cliniques de thrombose veineuse profonde : au minimum gonflement de la jambe et douleur à la palpation des veines profondes</td><td>3</td></tr><tr><td>Embolie plus probable qu’un autre diagnostic</td><td>3</td></tr><tr><td>Fréquence cardiaque supérieure à 100/min</td><td>1,5</td></tr><tr><td>Immobilisation de plus de trois jours ou chirurgie dans les quatre semaines précédentes</td><td>1,5</td></tr><tr><td>Antécédent de thrombose veineuse profonde ou d’embolie</td><td>1,5</td></tr><tr><td>Hémoptysie</td><td>1</td></tr><tr><td>Cancer en cours de traitement, traité dans les six derniers mois ou en phase palliative</td><td>1</td></tr></table>
<p>Les deux premières lignes pèsent le plus, avec 6 points sur 12,5 possibles. À elles seules, elles classent déjà l’embolie « probable ».</p>
<div class="lab">Seuils</div><p>Dans la version à deux catégories, un total inférieur ou égal à 4 classe l’embolie « peu probable », et un total supérieur à 4 la classe « probable ». Selon l’ESC/ERS 2019, l’embolie est finalement confirmée chez environ 12 % des patients « peu probables » et 30 % des patients « probables ».</p>
<div class="lab">Mode d’emploi</div><p>Le score sert à choisir le premier test : les D-dimères si l’embolie est peu probable, l’imagerie si elle est probable. Il aide à estimer la probabilité prétest, mais il ne prouve ni la présence ni l’absence de l’embolie.</p>
<div class="lab">Piège</div><p>L’item « embolie plus probable qu’un autre diagnostic » est subjectif et pèse 3 points : deux médecins peuvent obtenir des totaux différents. Le score de Genève révisé évite cet item.</p>
<div class="lab">Exemple</div><p>La patiente du cas obtient 9 points. Les signes de thrombose veineuse et l’embolie la plus probable valent chacun 3 points. La chirurgie récente et la tachycardie valent chacune 1,5 point. L’embolie est donc « probable ».</p>
<div class="lab">Source des définitions</div><p>Les définitions de l’immobilisation, du cancer et des signes de thrombose suivent la table de Geersing et collaborateurs (<i>British Medical Journal</i>, 2012). Le résumé de Wells et collaborateurs (2000) indique seulement « immobilisation ou chirurgie dans les quatre semaines précédentes » et « cancer ».</p></template>
<template data-pop="i26-ddimer" data-title="D-dimères : seuils, unités et pièges">
<div class="lab">Définition</div><p>Les D-dimères sont des fragments produits par la dégradation de la fibrine réticulée. Leur taux s’élève en cas de thrombose aiguë, parce que la coagulation et la fibrinolyse s’activent en même temps (ESC/ERS 2019).</p>
<div class="lab">Valeur</div><p>Le test a une valeur prédictive négative élevée : un taux normal rend l’embolie improbable. Les dosages quantitatifs immuno-enzymatiques ont une sensibilité d’au moins 95 % et peuvent exclure l’embolie en cas de probabilité faible ou intermédiaire. Leur valeur prédictive positive est faible : un taux élevé ne confirme pas l’embolie.</p>
<div class="lab">Seuils</div><p>Le seuil conventionnel est de 500 µg/L pour un dosage quantitatif sensible, chez un patient à probabilité non élevée. Après 50 ans, l’ESC/ERS 2019 permet le seuil ajusté à l’âge, égal à l’âge multiplié par 10 µg/L (classe IIa, niveau B). Dans l’étude ADJUST-PE, ce seuil a permis d’exclure l’embolie chez 29,7 % des patients de 75 ans ou plus, contre 6,4 % avec le seuil fixe. Selon l’ESC/ERS 2019, il n’a pas ajouté de faux négatif.</p>
<div class="lab">Unités</div><p>Ces seuils valent pour le dosage validé et dans son unité. Un résultat exprimé en unités équivalentes fibrinogène ne se compare pas directement à un résultat exprimé en unités D-dimères. Le médecin vérifie l’unité et la méthode du laboratoire avant toute comparaison.</p>
<div class="lab">Limites</div><p>La spécificité baisse avec l’âge, jusqu’à environ 10 % après 80 ans. Les D-dimères sont souvent élevés en cas de cancer, d’hospitalisation, d’infection sévère, de maladie inflammatoire et de grossesse. Le nombre de patients à tester pour exclure une embolie passe alors de 3 à 10 ou plus. Les tests réalisés au lit du patient ont une sensibilité plus faible, de 88 %, et ne s’emploient que si la probabilité est faible.</p>
<div class="lab">Piège</div><p>Un résultat négatif ne remplace pas l’imagerie lorsque la probabilité clinique est élevée : l’ESC/ERS 2019 déconseille alors le dosage (classe III, niveau A).</p></template>
<template data-pop="i26-perc" data-title="Règle PERC : exclusion à très faible probabilité">
<div class="lab">Définition</div><p>La règle PERC réunit huit critères cliniques associés à l’absence d’embolie. Elle a été développée aux urgences pour repérer les patients dont la probabilité est si faible que l’exploration ne devrait même pas commencer (ESC/ERS 2019).</p>
<div class="lab">Les huit critères, tous requis</div><p>La règle n’exclut l’embolie que si les huit critères suivants sont tous remplis.</p><ul><li>Le patient a moins de 50 ans.</li><li>Son pouls est inférieur à 100/min.</li><li>Sa saturation en oxygène dépasse 94 %.</li><li>Il n’a pas d’œdème unilatéral de jambe.</li><li>Il n’a pas d’hémoptysie.</li><li>Il n’a eu ni chirurgie ni traumatisme récents.</li><li>Il n’a pas d’antécédent de maladie thromboembolique veineuse.</li><li>Il ne prend pas d’hormones par voie orale.</li></ul>
<div class="lab">Mode d’emploi</div><p>Le médecin n’applique la règle que si son jugement initial classe déjà le patient à très faible probabilité. Si les huit critères sont remplis, aucun examen n’est demandé. Si un seul critère manque, ou si la probabilité est plus forte, il applique l’algorithme diagnostique habituel.</p>
<div class="lab">Preuves</div><p>L’essai randomisé français PROPER a été publié en 2018 et mené chez 1 916 patients à faible probabilité. La stratégie fondée sur la règle y a réduit la proportion d’angiographies tomodensitométriques de 23 à 13 %. Une seule embolie (0,1 %) a été diagnostiquée pendant les trois mois de suivi dans ce groupe.</p>
<div class="lab">Limite</div><p>L’ESC/ERS 2019 note que la faible prévalence de l’embolie dans ces études ne permet pas de généraliser le résultat à des populations plus à risque.</p></template>
<template data-pop="i26-ctpa" data-title="Angiographie tomodensitométrique pulmonaire">
<div class="lab">Principe</div><p>L’angiographie tomodensitométrique injecte un produit de contraste iodé et acquiert des images des artères pulmonaires jusqu’au niveau sous-segmentaire. Le caillot apparaît comme un défaut de remplissage entouré de contraste, ou qui interrompt l’artère.</p>
<div class="lab">Critères diagnostiques</div><p>Un défaut segmentaire ou plus proximal confirme l’embolie chez un patient à probabilité intermédiaire ou élevée (ESC/ERS 2019, classe I, niveau B). Un scanner normal l’exclut chez un patient à probabilité faible ou intermédiaire (classe I, niveau A).</p>
<div class="lab">Valeur</div><p>Dans PIOPED II, avec des scanners surtout à quatre détecteurs, la sensibilité était de 83 % et la spécificité de 96 %. La valeur prédictive négative atteignait 96 % en cas de probabilité faible, mais 60 % en cas de probabilité élevée. La valeur prédictive positive atteignait 92 à 96 % en cas de probabilité intermédiaire ou élevée, mais 58 % en cas de probabilité faible. Les résultats non concluants restent rares, de 3 à 5 %.</p>
<div class="lab">Informations supplémentaires</div><p>Le même examen mesure le rapport des diamètres des ventricules droit et gauche, utile au pronostic. Il peut aussi montrer un autre diagnostic, comme une pneumonie ou une dissection.</p>
<div class="lab">Limites</div><p>L’examen irradie : sa dose efficace est de 3 à 10 millisieverts, contre 0,1 millisievert pour une radiographie thoracique. Selon l’ESC/ERS 2019, le produit iodé en limite l’usage en cas d’allergie ou d’hyperthyroïdie, comporte des risques pendant la grossesse et l’allaitement, et le contre-indique en cas d’insuffisance rénale sévère. La signification d’une embolie sous-segmentaire isolée reste incertaine, et la facilité d’accès favorise le surdiagnostic.</p>
<div class="lab">Piège</div><p>Un scanner négatif chez un patient à forte probabilité, ou une acquisition de mauvaise qualité, demande une réévaluation plutôt qu’une conclusion automatique.</p></template>
<template data-pop="i26-spesi" data-title="Score pronostique : PESI et sPESI">
<div class="lab">Définition</div><p>Le PESI est un score pronostique qui estime le risque de décès à 30 jours en intégrant la sévérité de l’embolie et les comorbidités. Le sPESI en est la version simplifiée, à six items.</p>
<div class="lab">Items et points</div><p>Le tableau suivant compare les deux versions, d’après le tableau 7 de l’ESC/ERS 2019. Le PESI original additionne l’âge en années et dix items pondérés. Le sPESI donne 1 point à chacun de ses six items.</p>
<table><tr><th>Item</th><th>PESI original</th><th>sPESI</th></tr><tr><td>Âge</td><td>âge en années</td><td>1 point au-delà de 80 ans</td></tr><tr><td>Sexe masculin</td><td>10</td><td>non compté</td></tr><tr><td>Cancer</td><td>30</td><td>1</td></tr><tr><td>Insuffisance cardiaque chronique</td><td>10</td><td rowspan="2">1 pour une maladie cardiopulmonaire chronique</td></tr><tr><td>Maladie pulmonaire chronique</td><td>10</td></tr><tr><td>Fréquence cardiaque d’au moins 110/min</td><td>20</td><td>1</td></tr><tr><td>Pression systolique inférieure à 100 mmHg</td><td>30</td><td>1</td></tr><tr><td>Fréquence respiratoire supérieure à 30/min</td><td>20</td><td>non comptée</td></tr><tr><td>Température inférieure à 36 °C</td><td>20</td><td>non comptée</td></tr><tr><td>Altération de l’état mental</td><td>60</td><td>non comptée</td></tr><tr><td>Saturation artérielle en oxygène inférieure à 90 %</td><td>20</td><td>1</td></tr></table>
<p>Le lecteur remarque que le sPESI réunit l’insuffisance cardiaque et la maladie pulmonaire en un seul item. Il abandonne le sexe, la fréquence respiratoire, la température et l’état mental.</p>
<div class="lab">Mortalité</div><p>Un sPESI nul correspond à une mortalité à 30 jours de 1,0 %. Un sPESI d’au moins 1 point correspond à une mortalité de 10,9 % (ESC/ERS 2019, tableau 7). Le PESI original se lit en cinq classes, présentées dans le tableau suivant.</p>
<table><tr><th>Classe du PESI</th><th>Points</th><th>Mortalité à 30 jours</th></tr><tr><td>I</td><td>65 ou moins</td><td>0 à 1,6 %</td></tr><tr><td>II</td><td>66 à 85</td><td>1,7 à 3,5 %</td></tr><tr><td>III</td><td>86 à 105</td><td>3,2 à 7,1 %</td></tr><tr><td>IV</td><td>106 à 125</td><td>4,0 à 11,4 %</td></tr><tr><td>V</td><td>plus de 125</td><td>10,0 à 24,5 %</td></tr></table>
<p>Les classes I et II forment le groupe à faible risque clinique. La mortalité croît ensuite d’une classe à l’autre, avec des intervalles qui se chevauchent.</p>
<div class="lab">Mode d’emploi</div><p>Le score se calcule chez le patient stable (ESC/ERS 2019, classe IIa, niveau B). Un sPESI nul, ou un PESI de classe I ou II, identifie un risque de décès faible.</p>
<div class="lab">Piège</div><p>Le score ne diagnostique pas l’embolie et n’autorise pas à lui seul une sortie. Environ un tiers des patients à « faible risque » selon ce score ont une dysfonction du ventricule droit. L’ESC/ERS 2019 recommande donc d’évaluer le ventricule droit même lorsque le sPESI est nul (classe IIa, niveau B). Le sPESI exclut aussi tout patient cancéreux de la catégorie à faible risque.</p></template>
<template data-pop="i26-anticoag" data-title="Anticoagulation curative">
<div class="lab">Objectif</div><p>L’anticoagulation curative empêche l’extension du thrombus et la récidive pendant que la fibrinolyse naturelle dissout le caillot. Elle ne dissout pas elle-même le caillot.</p>
<div class="lab">Quand la débuter</div><p>Elle débute sans délai dès que la probabilité clinique est élevée ou intermédiaire, pendant le bilan diagnostique (ESC/ERS 2019, classe I, niveau C). Chez le patient instable, elle commence par l’héparine non fractionnée avec un bolus adapté au poids (classe I, niveau C).</p>
<div class="lab">Choix</div><p>Chez le patient stable éligible, un anticoagulant oral direct est préféré à un antagoniste de la vitamine K (ESC/ERS 2019, classe I, niveau A). Si le traitement commence par voie parentérale, l’héparine de bas poids moléculaire ou le fondaparinux sont préférés à l’héparine non fractionnée (classe I, niveau A). Le choix tient compte de la stabilité, d’une grossesse, d’un cancer et des fonctions rénale et hépatique. Il tient compte aussi du risque hémorragique, des interactions et de la capacité à prendre et à absorber un traitement oral.</p>
<div class="lab">Schémas initiaux</div><p>L’apixaban débute à 10 mg deux fois par jour pendant sept jours, puis 5 mg deux fois par jour. Le rivaroxaban débute à 15 mg deux fois par jour pendant 21 jours, puis 20 mg une fois par jour avec un repas. Le dabigatran et l’édoxaban exigent au moins cinq jours d’anticoagulation parentérale préalable. L’énoxaparine se donne à 1 mg/kg toutes les douze heures.</p>
<div class="lab">Durée</div><p>La phase de traitement dure au moins trois mois dans tous les cas (ESC/ERS 2019, classe I, niveau A). La nécessité d’une phase prolongée se décide ensuite selon le facteur déclenchant et le risque hémorragique.</p>
<div class="lab">Piège</div><p>La dose d’un anticoagulant oral direct utilisée dans la fibrillation auriculaire ne convient pas à l’embolie aiguë, et la phase initiale à dose plus élevée ne se supprime pas.</p></template>
<template data-pop="i26-reperf" data-title="Reperfusion : indications, contre-indications, résultats">
<div class="lab">Principe</div><p>La reperfusion dissout ou retire le caillot pour lever l’obstruction et soulager rapidement le ventricule droit. Elle expose à un risque hémorragique, qui ne se justifie que devant une menace vitale.</p>
<div class="lab">Techniques</div><p>La thrombolyse systémique perfuse un activateur du plasminogène. L’ESC/ERS 2019 préfère l’activateur tissulaire recombinant, à la dose de 100 mg en deux heures, aux perfusions prolongées de streptokinase ou d’urokinase. Le traitement dirigé par cathéter fragmente ou aspire le caillot, souvent avec une petite dose de thrombolytique sur place. L’embolectomie chirurgicale retire le caillot sous circulation extracorporelle.</p>
<div class="lab">Indications selon l’ESC/ERS 2019</div><p>La thrombolyse systémique est recommandée dans l’embolie à haut risque (classe I, niveau B). L’embolectomie chirurgicale est recommandée si la thrombolyse est contre-indiquée ou a échoué (classe I, niveau C). Le traitement par cathéter doit alors être envisagé (classe IIa, niveau C). Une thrombolyse de sauvetage est recommandée si l’état se dégrade sous anticoagulation (classe I, niveau B). La thrombolyse de routine n’est pas recommandée dans l’embolie à risque intermédiaire ou faible (classe III, niveau B).</p>
<div class="lab">Contre-indications de la fibrinolyse (ESC/ERS 2019, tableau 10)</div><p>Le tableau 10 de l’ESC/ERS 2019 sépare les contre-indications absolues et relatives. Le tableau suivant les reprend.</p>
<table><tr><th>Contre-indications absolues</th><th>Contre-indications relatives</th></tr><tr><td>Antécédent d’accident vasculaire cérébral hémorragique ou d’origine inconnue</td><td>Accident ischémique transitoire dans les six mois</td></tr><tr><td>Accident ischémique cérébral dans les six mois</td><td>Anticoagulation orale</td></tr><tr><td>Tumeur du système nerveux central</td><td>Grossesse ou première semaine du post-partum</td></tr><tr><td>Traumatisme majeur, chirurgie ou traumatisme crânien dans les trois semaines</td><td>Ponctions non compressibles</td></tr><tr><td>Diathèse hémorragique</td><td>Réanimation traumatique</td></tr><tr><td>Saignement actif</td><td>Hypertension réfractaire, avec une systolique au-delà de 180 mmHg</td></tr><tr><td></td><td>Hépatopathie avancée</td></tr><tr><td></td><td>Endocardite infectieuse</td></tr><tr><td></td><td>Ulcère peptique évolutif</td></tr></table>
<p>Une contre-indication absolue fait choisir l’embolectomie chirurgicale ou le cathéter, recommandés quand la thrombolyse est contre-indiquée. Une contre-indication relative oblige à peser le risque hémorragique contre le bénéfice attendu. L’information suisse d’Actilyse contient sa propre liste, détaillée dans l’onglet Pharmacologie.</p>
<div class="lab">Résultats</div><p>Une méta-analyse a réuni des essais qui incluaient, sans s’y limiter, des embolies à haut risque. La thrombolyse y a réduit le critère combinant mortalité et récidive. Elle a causé 9,9 % d’hémorragies graves et 1,7 % d’hémorragies intracrâniennes. Le bénéfice est maximal dans les 48 heures qui suivent le début des symptômes. L’essai PEITHO a inclus des patients normotendus à risque intermédiaire haut. La ténectéplase y a réduit les décès ou décompensations à sept jours de 5,6 à 2,6 %. Elle a porté les hémorragies majeures extracrâniennes de 1,2 à 6,3 %, et les accidents vasculaires cérébraux de 0,2 à 2,4 %.</p>

<div class="lab">Organisation</div><p>L’ESC/ERS 2019 conseille une équipe pluridisciplinaire pour l’embolie à haut risque et certains cas à risque intermédiaire (classe IIa, niveau C). Cette équipe peut réunir cardiologues, pneumologues, hématologues et angiologues. Elle peut aussi réunir anesthésistes-réanimateurs, chirurgiens cardiothoraciques et radiologues interventionnels.</p>
<div class="lab">Piège</div><p>Une artère proximale obstruée chez un patient stable n’est pas une indication de thrombolyse : la décision repose sur l’hémodynamique, pas sur l’anatomie.</p></template>
<template data-pop="i26-d-apix" data-title="Apixaban : mécanisme, dose et précautions"><p class="lab">Mécanisme</p><p>L’apixaban inhibe directement le facteur Xa et réduit ainsi la formation de thrombine.</p><p class="lab">Preuve</p><p>Essai AMPLIFY, 2013, chez 5 395 adultes avec thrombose veineuse profonde proximale ou embolie pulmonaire symptomatique : récidive thromboembolique ou décès lié 2,3 % contre 2,7 % (non-infériorité) et hémorragies majeures 0,6 % contre 1,8 %, face à l’énoxaparine relayée par la warfarine ; les patients nécessitant une thrombolyse ou une embolectomie étaient exclus.</p><p class="lab">Dose suisse embolie</p><p>10 mg oral deux fois par jour sept jours (maximum 20 mg par jour), puis 5 mg deux fois par jour (maximum 10 mg par jour) ; 2,5 mg deux fois par jour uniquement pour prévention prolongée après au moins six mois.</p><p class="lab">Risques</p><p>Saignement ; interactions (prudence et surveillance clinique avec les inhibiteurs puissants combinés du CYP3A4 et de la glycoprotéine P, association aux inducteurs puissants non recommandée dans cette indication) ; non recommandé sous 15 mL/min ou en dialyse, sans adaptation de dose de 15 à 29 mL/min ; contre-indiqué en cas d’insuffisance hépatique sévère ou d’hépatopathie avec coagulopathie.</p><p class="lab">Grossesse et allaitement</p><p>Utilisation non recommandée pendant la grossesse ; pendant l’allaitement, interrompre soit l’allaitement, soit l’apixaban (information suisse).</p><p class="lab">Suivi</p><p>Saignement, adhésion, rein et traitements concomitants.</p></template>
<template data-pop="i26-d-riva" data-title="Rivaroxaban : mécanisme, dose et précautions"><p class="lab">Mécanisme</p><p>Le rivaroxaban inhibe directement le facteur Xa.</p><p class="lab">Preuve</p><p>Essai EINSTEIN-PE, 2012, chez 4 832 patients avec embolie symptomatique, avec ou sans thrombose veineuse profonde : récidive 2,1 % contre 1,8 % (non-infériorité) et hémorragies majeures 1,1 % contre 2,2 %, face à l’énoxaparine relayée par un antagoniste de la vitamine K.</p><p class="lab">Dose suisse embolie</p><p>15 mg oral deux fois par jour pendant 21 jours, puis 20 mg oral une fois par jour, avec nourriture pour les comprimés de 15 et 20 mg ; au-delà de six mois, 20 mg une fois par jour si le risque de récidive est élevé, 10 ou 20 mg une fois par jour s’il est faible.</p><p class="lab">Risques</p><p>Hémorragie ; interactions (antifongiques azolés systémiques et inhibiteurs de la protéase du VIH non recommandés) ; exposition accrue en insuffisance rénale : prudence de 15 à 29 mL/min, ne pas utiliser sous 15 mL/min, contre-indiqué en dialyse ; contre-indiqué en cas d’hépatopathie avec coagulopathie ; grossesse et allaitement contre-indiqués selon l’information suisse.</p><p class="lab">Suivi</p><p>Fonction rénale, saignement et observance.</p></template>
<template data-pop="i26-d-enox" data-title="Énoxaparine : mécanisme, dose et précautions"><p class="lab">Mécanisme</p><p>L’énoxaparine est une héparine de bas poids moléculaire ; elle accélère l’effet de l’antithrombine contre le facteur Xa.</p><p class="lab">Preuves</p><p>Essai de Merli et collaborateurs (<i>Annals of Internal Medicine</i>, 2001 ; 900 patients avec thrombose veineuse profonde symptomatique, dont 287, soit 32 %, avec embolie pulmonaire confirmée) : 1 mg/kg deux fois par jour ou 1,5 mg/kg une fois par jour aussi efficaces que l’héparine non fractionnée intraveineuse (récidive à trois mois 2,9 %, 4,4 % et 4,1 %), sans différence d’hémorragies majeures (1,3 %, 1,7 % et 2,1 %) ; comparateur initial dans EINSTEIN-PE (2012) et AMPLIFY (2013). L’ESC/ERS 2019 préfère l’héparine de bas poids moléculaire à l’héparine non fractionnée chez la plupart des patients lorsque l’anticoagulation débute par voie parentérale (classe I, niveau A).</p><p class="lab">Dose suisse</p><p>1 mg/kg sous-cutané toutes les douze heures dans la thrombose veineuse profonde avec ou sans embolie ; une autre option de 1,5 mg/kg une fois par jour est réservée aux patients sans problème thromboembolique compliqué, et déconseillée chez le patient obèse ou atteint d’un cancer. Insuffisance rénale sévère, clairance inférieure à 30 mL/min selon l’information suisse : 1 mg/kg une fois par jour, en raison d’une exposition nettement accrue ; le texte européen harmonisé fixe ce palier de 15 à 30 mL/min et ne recommande pas l’énoxaparine sous 15 mL/min, hors prévention de la coagulation du circuit d’hémodialyse.</p><p class="lab">Risques</p><p>Hémorragie, thrombopénie induite par l’héparine ; surveiller plaquettes, rein et saignement.</p><p class="lab">Grossesse</p><p>L’ESC/ERS 2019 recommande une dose thérapeutique fixe d’héparine de bas poids moléculaire fondée sur le poids du début de grossesse (classe I, niveau B) ; l’information suisse réserve l’énoxaparine aux besoins cliniques établis et déconseille l’allaitement.</p><p class="lab">Neutralisation</p><p>La protamine ne neutralise l’activité anti-Xa qu’à 60 % au plus.</p></template>
<template data-pop="i26-d-alte" data-title="Altéplase : dose suisse et sécurité"><p class="lab">Mécanisme</p><p>L’altéplase est un activateur tissulaire du plasminogène recombinant ; il convertit le plasminogène lié à la fibrine en plasmine, qui dégrade la fibrine.</p><p class="lab">Preuves</p><p>La reperfusion réduit rapidement la charge hémodynamique en embolie à haut risque. L’essai PEITHO (2014) a étudié la <b>ténectéplase</b>, et non l’altéplase : bolus unique associé à l’héparine, contre placebo et héparine, chez 1 006 patients normotendus à risque intermédiaire-élevé (dysfonction ventriculaire droite et troponine positive). Décès ou décompensation hémodynamique à sept jours : 2,6 % contre 5,6 %, gain porté par la décompensation hémodynamique (1,6 % contre 5,0 %, chiffres du texte intégral repris par la méta-analyse de Zhang et collaborateurs, 2022), sans différence significative de mortalité à sept jours (1,2 % contre 1,8 %) ni à trente jours (2,4 % contre 3,2 %) ; hémorragies majeures extracrâniennes : 6,3 % contre 1,2 % ; accidents vasculaires cérébraux : 2,4 % contre 0,2 %, hémorragiques pour 10 des 12 survenus sous ténectéplase. D’où l’absence de thrombolyse systémique de routine dans ce groupe ; ces chiffres ne se transposent pas tels quels à l’altéplase.</p><p class="lab">Dose suisse (Actilyse®, embolie massive avec instabilité)</p><p>≥ 65 kg : 10 mg en bolus sur 1–2 minutes puis 90 mg en deux heures (total 100 mg, jamais davantage) ; &lt; 65 kg : bolus 10 mg puis perfusion sans dépasser 1,5 mg/kg au total sur deux heures.</p><p class="lab">Relais</p><p>Héparine commencée ou poursuivie lorsque le temps de céphaline activée est inférieur au double de la limite supérieure de la normale, cible 50 à 70 secondes (information suisse).</p><p class="lab">Contre-indications</p><p>Hémorragie grave manifeste ou survenue dans les six derniers mois, anticoagulation orale efficace, traumatisme crânien dans les trois derniers mois ou lésion du système nerveux central, hypertension sévère non contrôlée, chirurgie importante ou traumatisme dans les dix derniers jours, accouchement de moins de dix jours, antécédent d’accident vasculaire cérébral hémorragique ou d’étiologie inconnue ; à confronter à la menace vitale.</p><p class="lab">Risque majeur</p><p>Hémorragie intracrânienne ; surveillance continue en soins intensifs.</p></template>
<template data-pop="i26-d-dabi" data-title="Dabigatran : mécanisme, dose et précautions"><p class="lab">Mécanisme</p><p>Le dabigatran étexilate est une prodrogue orale transformée en dabigatran, inhibiteur direct, compétitif et réversible de la thrombine libre et liée au caillot ; son élimination est principalement rénale.</p><p class="lab">Preuves</p><p>Essais RE-COVER (2009 ; 2 539 patients) et RE-COVER II (2014 ; 2 589 patients), chez des adultes présentant une thrombose veineuse profonde ou une embolie pulmonaire aiguë, traités d’abord par héparine parentérale : le dabigatran 150 mg deux fois par jour était non inférieur à la warfarine pour la récidive thromboembolique à six mois (2,4 % contre 2,1 % ; 2,3 % contre 2,2 %), sans différence significative d’hémorragies majeures dans chaque essai, avec moins d’hémorragies de tout type (16,1 % contre 21,9 % ; 15,6 % contre 22,1 %) et, dans l’analyse poolée de l’information suisse, moins d’hémorragies majeures ou cliniquement pertinentes.</p><p class="lab">Dose suisse</p><p>Après au moins cinq jours d’anticoagulation parentérale, 150 mg deux fois par jour de 18 à 80 ans, 110 mg deux fois par jour pouvant être envisagés si le risque hémorragique est accru ; à partir de 80 ans, 110 mg deux fois par jour ; clairance de 30 à 50 mL/min : 110 mg deux fois par jour ; en association avec l’amiodarone ou le vérapamil, prise du dabigatran au moins deux heures avant, et 110 mg deux fois par jour si la clairance est de 30 à 50 mL/min. Le résumé européen des caractéristiques du produit prévoit 110 mg deux fois par jour chez tout patient traité par vérapamil.</p><p class="lab">Contre-indications (information suisse)</p><p>Clairance de la créatinine inférieure à 30 mL/min ; insuffisance hépatique (classes A à C de Child-Pugh) ; quinidine, dronédarone, ritonavir, tipranavir, nelfinavir, saquinavir, ciclosporine, tacrolimus, kétoconazole ou itraconazole systémiques ; saignement actif ; valve cardiaque artificielle. L’association fixe glécaprévir/pibrentasvir est une mise en garde en Suisse et une contre-indication dans le résumé européen.</p><p class="lab">Grossesse et allaitement</p><p>Pas d’utilisation pendant la grossesse sauf nécessité absolue ; allaitement déconseillé.</p><p class="lab">Effets indésirables</p><p>Hémorragies, dyspepsie.</p><p class="lab">Surveillance</p><p>Clairance avant le début puis dans toute situation qui peut la réduire (déshydratation, hypovolémie, médicament néphrotoxique) ; observance, car la demi-vie est courte.</p><p class="lab">Antidote</p><p>Idarucizumab 5 g par voie intraveineuse.</p></template>
<template data-pop="i26-d-edox" data-title="Édoxaban : mécanisme, dose et précautions"><p class="lab">Mécanisme</p><p>L’édoxaban inhibe le facteur Xa de façon directe, sélective et réversible.</p><p class="lab">Preuve</p><p>Essai Hokusai-VTE (2013), 8 292 adultes avec thrombose veineuse profonde ou embolie pulmonaire symptomatique, traités d’abord par héparine : l’édoxaban une fois par jour était non inférieur à la warfarine pour la récidive thromboembolique (3,2 % contre 3,5 %) et causait moins d’hémorragies majeures ou non majeures cliniquement pertinentes, critère principal de sécurité (8,5 % contre 10,3 %).</p><p class="lab">Dose suisse</p><p>Après au moins cinq jours d’anticoagulation parentérale, 60 mg une fois par jour ; 30 mg une fois par jour si la clairance de la créatinine est de 15 à 50 mL/min, si le poids est ≤ 60 kg, ou en cas de traitement par ciclosporine, dronédarone, érythromycine, kétoconazole, quinidine ou vérapamil (information suisse ; le résumé européen ne retient que les quatre premiers) ; aucune réduction avec l’amiodarone.</p><p class="lab">Limites</p><p>Non recommandé sous 15 mL/min, en dialyse ou en cas d’insuffisance hépatique sévère ; contre-indiqué en cas d’hépatopathie associée à une coagulopathie et pendant la grossesse ou l’allaitement.</p><p class="lab">Réversion</p><p>Aucun antidote spécifique selon l’information suisse.</p><p class="lab">Surveillance</p><p>Poids, clairance, interactions, saignement et observance.</p></template>
<template data-pop="i26-d-hnf" data-title="Héparine non fractionnée : mécanisme, dose et surveillance"><p class="lab">Mécanisme</p><p>L’héparine potentialise l’antithrombine, qui inactive la thrombine et le facteur Xa ; sa demi-vie courte et la possibilité de la neutraliser rapidement par la protamine en font l’anticoagulant des situations où une reperfusion ou un geste invasif peut survenir.</p><p class="lab">Place selon ESC/ERS 2019</p><p>Patient instable ou candidat à une reperfusion primaire, clairance de la créatinine ≤ 30 mL/min, obésité sévère ; ailleurs, l’héparine de bas poids moléculaire est préférée.</p><p class="lab">Dose</p><p>Nomogramme pondéral de l’essai randomisé de Raschke (1993) : bolus de 80 UI/kg par voie intraveineuse, puis perfusion continue de 18 UI/kg/heure ; 97 % des patients dépassaient le seuil thérapeutique en 24 heures, contre 77 % avec un schéma fixe.</p><p class="lab">Surveillance</p><p>Temps de céphaline activée maintenu à 1,5–2,5 fois la norme (information suisse de Liquémine), proche de la zone thérapeutique de l’essai de Raschke (1,5 à 2,3 fois le témoin) ; la cible s’adapte aux réactifs du laboratoire ; contrôles 1 à 2, 6, 12 et 24 heures après le début de la perfusion continue selon l’information suisse, toutes les six heures dans l’essai de Raschke ; numération plaquettaire répétée. Dose indicative de l’information suisse : 5 000 à 10 000 UI initiales puis 20 000 à 30 000 UI par jour en perfusion, augmentée le premier jour d’une embolie avec état de choc (par exemple 40 000 à 60 000 UI) selon la coagulation.</p><p class="lab">Effets indésirables</p><p>Hémorragie ; thrombopénie induite par l’héparine, plus fréquente qu’avec les héparines de bas poids moléculaire.</p><p class="lab">Antidote</p><p>Sulfate de protamine.</p></template>
<template data-pop="i26-d-avk" data-title="Antagonistes de la vitamine K : relais, cible et surveillance"><p class="lab">Mécanisme</p><p>Les antagonistes de la vitamine K inhibent la vitamine K époxyde réductase, ce qui empêche la gamma-carboxylation des facteurs II, VII, IX et X et des protéines C et S ; l’effet antithrombotique complet demande plusieurs jours.</p><p class="lab">Produits autorisés en Suisse</p><p>Phenprocoumone (Marcoumar), de demi-vie longue (environ 160 heures), et acénocoumarol (Sintrom), de demi-vie courte (8 à 11 heures), selon leurs informations suisses ; la warfarine des essais internationaux n’en fait pas partie.</p><p class="lab">Relais</p><p>Chevauchement avec l’anticoagulant parentéral d’au moins cinq jours et jusqu’à un INR entre 2,0 et 3,0 deux jours consécutifs (ESC/ERS 2019). L’ESC/ERS 2019 ne fixe pas le jour du début ; l’information suisse de Marcoumar prévoit le relais une fois la phase aiguë surmontée, au plus tôt après deux jours (dix jours et plus dans les cas graves), et celle de Sintrom un début soit simultané, soit plus tardif, selon le tableau clinique.</p><p class="lab">Cible</p><p>INR 2,5 (intervalle 2,0–3,0) selon ESC/ERS 2019.</p><p class="lab">Place</p><p>Alternative aux anticoagulants oraux directs ; en cas de syndrome des antiphospholipides, traitement par antagoniste de la vitamine K de durée indéfinie (ESC/ERS 2019, classe I, niveau B). En insuffisance rénale sévère, où l’ESC/ERS 2019 déconseille les anticoagulants oraux directs selon des seuils propres à chacun, le choix dépend de la molécule : Sintrom y est contre-indiqué ; Marcoumar reste possible avec réduction de dose envisagée et contrôles plus fréquents (informations suisses).</p><p class="lab">Surveillance</p><p>INR rapproché pendant l’instauration, puis espacé lorsque la valeur est stable ; contrôle à chaque changement de traitement associé ou d’alimentation riche en vitamine K.</p><p class="lab">Contre-indications</p><p>Grossesse (Marcoumar, Sintrom) ; insuffisance hépatique ou rénale sévère (Sintrom) ; lésion grave du parenchyme hépatique (Marcoumar) ; situations où le risque hémorragique l’emporte sur le bénéfice (informations suisses).</p><p class="lab">Réversion</p><p>Vitamine K par voie intraveineuse et concentré de complexe prothrombinique en cas d’hémorragie grave.</p></template>
<template data-pop="pareto-i26-fondements" data-title="Pareto — Définition et mécanismes"><p class="ratio" data-cover="i26-0,i26-1,i26-2,i26-3"></p><ul>
<li>Le médecin se pose deux questions distinctes : l’embolie est-elle probable, et la circulation est-elle menacée ?</li>
<li>Jusqu’à 40 % des patients ont une saturation normale, et une radiographie normale n’exclut pas l’embolie.</li>
<li>L’embolie est l’obstruction d’une artère pulmonaire par un caillot veineux migré. Avec la thrombose veineuse profonde, elle forme la maladie thromboembolique veineuse.</li>
<li>Un défaut segmentaire ou plus proximal au scanner confirme l’embolie chez un patient à probabilité intermédiaire ou élevée. Un défaut sous-segmentaire isolé se discute.</li>
<li>La gravité se mesure par l’hémodynamique, pas par le siège du caillot, et le terme « massive » est ambigu.</li>
<li>L’ESC/ERS 2019 définit le haut risque par l’arrêt cardiaque, le choc obstructif ou l’hypotension persistante. Chez le patient stable, le score clinique, le ventricule droit et la troponine séparent les risques intermédiaire haut, intermédiaire bas et faible.</li>
<li>Un score clinique bas avec un ventricule droit dilaté ou une troponine élevée relève du risque intermédiaire, et non du risque faible.</li>
<li>Le facteur déclenchant, transitoire majeur, mineur, persistant ou absent, décide de la durée du traitement.</li>
<li>En Europe, l’incidence annuelle de l’embolie varie de 39 à 115 pour 100 000 habitants. La maladie thromboembolique est presque huit fois plus fréquente après 80 ans qu’entre 40 et 49 ans.</li>
<li>En Suisse, l’incidence de l’embolie hospitalisée est passée de 87 à 119 pour 100 000 habitants entre 2003 et 2022. La létalité hospitalière est passée de 9,8 à 7,9 % entre 2003 et 2019, et les cas ambulatoires ne sont pas comptés.</li>
<li>Une grande partie des décès survient avant le diagnostic, mais le surdiagnostic existe aussi.</li>
<li>Un sPESI nul prédit une mortalité à 30 jours de 1,0 %, et un sPESI positif une mortalité de 10,9 %.</li>
<li>La récidive après l’arrêt atteint 2,5 % par an après un facteur transitoire et 4,5 % par an sans facteur connu. L’hypertension pulmonaire thromboembolique chronique touche 0,79 % des patients à deux ans en Suisse.</li>
<li>La pression artérielle pulmonaire moyenne normale vaut 14 mmHg, et un ventricule droit non préparé ne dépasse pas 40 mmHg de pression moyenne.</li>
<li>La pression pulmonaire monte au-delà de 30 à 50 % d’obstruction du lit artériel. Le TXA₂ et la sérotonine ajoutent une vasoconstriction.</li>
<li>La dilatation du ventricule droit refoule le septum et réduit le remplissage gauche, le débit et la pression. La baisse de la perfusion coronaire droite entretient l’ischémie et aggrave la défaillance.</li>
<li>Une déstabilisation secondaire peut survenir 24 à 48 heures après l’embolie.</li>
<li>L’hypoxémie vient du déséquilibre ventilation-perfusion, de la baisse du débit et parfois d’un shunt par foramen ovale perméable. L’hypocapnie est fréquente.</li>
<li>Les emboles distaux causent l’infarctus pulmonaire, avec douleur pleurale, hémoptysie et épanchement minime.</li>
<li>La troponine et les peptides natriurétiques mesurent la gravité, et les D-dimères servent à exclure. Aucun de ces marqueurs ne localise le caillot.</li></ul></template>
<template data-pop="pareto-i26-clinique" data-title="Pareto — Terrain et clinique"><p class="ratio" data-cover="i26-4,i26-5,i26-6"></p><ul>
<li>Chaque facteur de risque agit sur la stase, l’hypercoagulabilité ou la paroi veineuse, mais 40 % des patients n’ont aucun facteur identifiable.</li>
<li>La fracture d’un membre inférieur, la prothèse de hanche ou de genou, le traumatisme majeur et la lésion médullaire sont des facteurs forts. L’infarctus, l’hospitalisation pour insuffisance cardiaque ou fibrillation auriculaire dans les trois mois et l’antécédent thromboembolique le sont aussi.</li>
<li>Le cancer, la contraception orale, le post-partum, l’infection, la chimiothérapie et la thrombophilie sont des facteurs modérés. L’alitement de plus de trois jours, l’obésité, l’âge, la grossesse et le long voyage sont des facteurs faibles.</li>
<li>La contraception combinée multiplie le risque par deux à six, alors qu’un dispositif intra-utérin au progestatif et certaines pilules progestatives seules ne l’augmentent pas significativement.</li>
<li>Une chirurgie sous anesthésie générale de plus de 30 minutes, un alitement hospitalier d’au moins trois jours et un traumatisme avec fracture sont des facteurs transitoires majeurs.</li>
<li>Une embolie sans facteur apparent justifie un bilan de cancer limité, sans scanner abdominal systématique.</li>
<li>L’anamnèse estime la probabilité, cherche un diagnostic concurrent et prépare la sécurité du traitement, dont le risque hémorragique et les médicaments en cours.</li>
<li>Dans PIOPED II, la dyspnée touchait 73 % des patients, la douleur pleurale 44 % et la douleur de jambe 44 %. Le gonflement de jambe touchait 41 % et la toux 34 %, alors que l’hémoptysie était rare et peu abondante.</li>
<li>Une dyspnée, une tachypnée, une douleur pleurale ou un signe de thrombose veineuse existaient chez 98 % des patients, mais aucun de ces éléments n’est spécifique.</li>
<li>Le sujet âgé, l’insuffisant cardiaque ou respiratoire et le patient syncopé présentent souvent des formes atypiques. Une fièvre supérieure à 38,5 °C est rare.</li>
<li>La syncope signale une gravité potentielle, mais la prévalence de l’embolie chez les patients syncopés des urgences reste faible.</li>
<li>L’examen mesure d’abord la perfusion et les constantes. Une pression systolique inférieure à 90 mmHg persistante, ou une chute d’au moins 40 mmHg pendant plus de 15 minutes, définit l’instabilité.</li>
<li>Les seuils de fréquence cardiaque diffèrent selon le score. Le score de Genève révisé utilise 95/min, le score de Wells et la règle PERC 100/min, et le sPESI 110/min.</li>
<li>L’oxygène est indiqué sous 90 % de saturation. Une fréquence respiratoire supérieure à 30/min et une température inférieure à 36 °C comptent dans le PESI.</li>
<li>Le poids fixe les doses : l’énoxaparine se dose à 1 mg/kg et le bolus d’héparine non fractionnée à 80 UI/kg. L’altéplase est plafonnée à 1,5 mg/kg sous 65 kg, et l’édoxaban passe à 30 mg à 60 kg ou moins.</li>
<li>Les signes de thrombose veineuse existaient chez 47 % des patients, alors que l’examen pulmonaire n’était anormal que chez 29 %.</li>
<li>Après une chirurgie du genou, la jambe gonfle souvent sans thrombose, et seule l’échographie de compression tranche.</li></ul></template>
<template data-pop="pareto-i26-diagnostic" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="i26-7,i26-8"></p><ul>
<li>Chez le patient instable, l’échocardiographie au lit et l’héparine non fractionnée viennent d’abord. Un ventricule droit normal écarte l’embolie comme cause du choc.</li>
<li>Un ventricule droit défaillant sans autre cause suffit à reperfuser un patient intransportable, et le scanner confirme dès que possible.</li>
<li>Chez le patient stable, la probabilité clinique s’estime par le jugement, le score de Wells ou le score de Genève révisé.</li>
<li>L’embolie est confirmée chez environ 10, 30 et 65 % des patients à probabilité faible, intermédiaire et élevée. Elle l’est chez 12 et 30 % des patients « peu probables » et « probables ».</li>
<li>Le score de Wells classe l’embolie « peu probable » à 4 points ou moins, et « probable » au-delà.</li>
<li>La règle PERC n’exclut l’embolie que chez le patient à très faible probabilité qui remplit ses huit critères.</li>
<li>Les D-dimères excluent l’embolie sous 500 µg/L, ou sous l’âge multiplié par 10 µg/L après 50 ans, chez le patient à probabilité non élevée. L’algorithme YEARS retient 1 000 ng/mL sans item et 500 ng/mL avec un item ou plus.</li>
<li>Les D-dimères ne se dosent pas si la probabilité est élevée, et ils perdent leur utilité chez le patient hospitalisé, cancéreux ou enceinte.</li>
<li>Un scanner normal exclut l’embolie en cas de probabilité faible ou intermédiaire. Un défaut segmentaire ou plus proximal la confirme en cas de probabilité intermédiaire ou élevée.</li>
<li>La valeur prédictive négative du scanner tombe à 60 % en cas de probabilité élevée, et sa valeur prédictive positive à 58 % en cas de probabilité faible.</li>
<li>Une scintigraphie de perfusion normale exclut l’embolie, une scintigraphie de haute probabilité la confirme, et une thrombose proximale à l’échographie de compression suffit à traiter.</li>
<li>L’électrocardiogramme, la radiographie et les gaz du sang orientent, mais ils ne confirment jamais l’embolie.</li>
<li>L’anticoagulation débute sans attendre l’imagerie dès que la probabilité est élevée ou intermédiaire.</li>
<li>Chez le patient stable, le sPESI ou le PESI, la dysfonction du ventricule droit et la troponine classent le risque. La dysfonction droite et la troponine positives ensemble définissent le risque intermédiaire haut.</li>
<li>Un rapport des ventricules droit et gauche d’au moins 1,0 et un TAPSE inférieur à 16 mm signent la dysfonction droite. Une troponine T ultrasensible inférieure à 14 pg/mL a une forte valeur prédictive négative.</li>
<li>L’arrêt cardiaque, le choc et la déstabilisation des 24 à 48 premières heures sont les urgences, et l’hémorragie domine les complications du traitement.</li>
<li>Le médecin écarte d’abord le syndrome coronarien aigu, la dissection aortique, le pneumothorax sous tension, la tamponnade et le choc septique. Il cherche ensuite une pneumonie ou une insuffisance cardiaque associée.</li></ul></template>
<template data-pop="pareto-i26-prise" data-title="Pareto — Traitement, suivi et situations particulières"><p class="ratio" data-cover="i26-9,i26-10,i26-11,i26-12"></p><ul>
<li>Le traitement maintient d’abord la perfusion, puis il empêche l’extension du caillot, évite l’hémorragie et choisit le lieu de soins.</li>
<li>L’oxygène se donne sous 90 % de saturation. La ventilation non invasive ou le haut débit nasal sont préférés à l’intubation, qui peut provoquer un collapsus.</li>
<li>Le remplissage ne dépasse pas 500 mL, et la noradrénaline soutient la pression et la perfusion coronaire droite.</li>
<li>L’anticoagulation débute sans délai, et un anticoagulant oral direct est préféré chez le patient stable éligible. Si la voie parentérale est choisie, l’héparine de bas poids moléculaire est préférée à l’héparine non fractionnée.</li>
<li>L’héparine non fractionnée se réserve à l’instabilité, à la reperfusion prévisible, à une clairance inférieure ou égale à 30 mL/min et à l’obésité sévère.</li>
<li>L’apixaban débute à 10 mg deux fois par jour pendant sept jours, puis 5 mg deux fois par jour. Le rivaroxaban débute à 15 mg deux fois par jour pendant 21 jours, puis 20 mg une fois par jour avec un repas. Le dabigatran et l’édoxaban exigent cinq jours d’héparine préalable.</li>
<li>La dose utilisée dans la fibrillation auriculaire ne convient pas à l’embolie aiguë.</li>
<li>La thrombolyse systémique traite l’embolie à haut risque. L’altéplase se donne à 100 mg en deux heures dès 65 kg, sans dépasser 1,5 mg/kg sous 65 kg. La chirurgie ou le cathéter la remplacent si elle est contre-indiquée ou échoue.</li>
<li>Chez le patient à risque intermédiaire haut, la thrombolyse de routine n’est pas recommandée. Il est surveillé sous héparine de bas poids moléculaire pendant deux à trois jours, avec une thrombolyse de sauvetage en cas de dégradation.</li>
<li>Le filtre cave se discute seulement en cas de contre-indication absolue à l’anticoagulation ou de récidive sous traitement efficace.</li>
<li>La sortie précoce exige un risque faible, l’absence de comorbidité grave et un suivi assuré. Avant 24 à 48 heures, elle exige aussi un ventricule droit normal, et le sPESI ou la règle de Hestia sélectionnent ces patients.</li>
<li>Tout patient reçoit au moins trois mois d’anticoagulation, et l’arrêt est recommandé après une première embolie liée à un facteur transitoire majeur.</li>
<li>Le traitement se prolonge sans date de fin après une récidive non liée à un facteur majeur, un syndrome des antiphospholipides ou un cancer actif. Il se discute sans facteur identifiable, avec un facteur mineur ou avec un facteur persistant.</li>
<li>Après six mois de traitement prolongé, l’apixaban à 2,5 mg deux fois par jour ou le rivaroxaban à 10 mg une fois par jour peuvent être proposés.</li>
<li>Le risque hémorragique augmente avec l’âge au-delà de 75 ans, les saignements antérieurs, le cancer, l’accident vasculaire cérébral, l’insuffisance rénale ou hépatique et les antiagrégants. Il se réévalue régulièrement.</li>
<li>Chaque patient est revu trois à six mois après l’embolie. Une dyspnée persistante mène à l’échocardiographie, puis à la scintigraphie.</li>
<li>La limitation fonctionnelle est fréquente et souvent due au déconditionnement, alors que l’hypertension pulmonaire thromboembolique chronique est rare.</li>
<li>La prévention repose sur la bonne durée, l’adhésion, la prophylaxie des situations futures à risque et une contraception choisie après conseil.</li>
<li>Pendant la grossesse, l’échographie de compression passe en premier si la jambe est suspecte. Le traitement repose sur l’héparine de bas poids moléculaire à dose fixe selon le poids initial, et les anticoagulants oraux directs sont exclus.</li>
<li>La ponction péridurale attend 24 heures après la dernière dose thérapeutique. Le traitement dure au moins six semaines après l’accouchement et trois mois au total.</li>
<li>Chez le patient cancéreux, l’héparine de bas poids moléculaire est proposée pendant les six premiers mois, ou l’édoxaban ou le rivaroxaban en l’absence de cancer digestif. Le traitement se prolonge ensuite pour une durée indéfinie ou jusqu’à la guérison du cancer.</li>
<li>La clairance se calcule par la formule de Cockcroft-Gault. Le dabigatran est contre-indiqué sous 30 mL/min et réduit à 110 mg deux fois par jour entre 30 et 50 mL/min. L’édoxaban passe à 30 mg entre 15 et 50 mL/min, et aucun anticoagulant oral direct ne convient sous 15 mL/min.</li>
<li>Le syndrome des antiphospholipides impose un antagoniste de la vitamine K.</li>
<li>Le diagnostic formel repose sur un défaut segmentaire ou plus proximal au scanner, une scintigraphie de haute probabilité ou une thrombose proximale à l’échographie de compression.</li></ul></template>
<template data-pop="pareto-i26-examens" data-title="Pareto — Examens"><p class="ratio" data-cover="i26-e-1,i26-e-2,i26-e-3,i26-e-4,i26-e-5"></p><ul><li>Examen principal de confirmation : angiographie tomodensitométrique si faisable ; scintigraphie selon contre-indication.</li><li>D-dimères seulement avec probabilité non élevée et méthode/unité connues.</li><li>Échographie des jambes prouve une thrombose proximale, mais sa négativité n’exclut pas une embolie.</li><li>D-dimères : &lt; 500 µg/L ; après 50 ans, âge × 10 µg/L, avec le dosage validé et dans son unité.</li><li>Scintigraphie : défaut perfusionnel segmentaire sans défaut ventilatoire ; résultat non diagnostique, autre examen.</li><li>Choc : échocardiographie au lit ; une dilatation droite n’est pas spécifique.</li><li>Troponine et peptide natriurétique : pronostic, jamais diagnostic ; radiographie et électrocardiogramme orientent sans confirmer.</li><li>Grossesse avec signes de jambe : échographie de compression d’abord.</li></ul></template>
<template data-pop="pareto-i26-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="i26-s-a,i26-s-h,i26-s-p,i26-s-b,i26-s-g"></p><ul><li>Le caillot suit veine profonde, cœur droit et artère pulmonaire ; l’échographie de compression ne retrouve la thrombose que chez 30 à 50 % des patients.</li><li>La triple vascularisation pulmonaire rend l’infarctus inconstant ; un foramen ovale perméable, présent chez un tiers des patients, expose à l’embolie paradoxale.</li><li>Le thrombus se résorbe en quelques mois sous anticoagulant ; sa persistance fibreuse cause l’hypertension pulmonaire thromboembolique chronique (0,79 % à deux ans en Suisse).</li><li>La pression pulmonaire normale vaut 14 mmHg ; elle monte au-delà de 30 à 50 % d’obstruction, et un ventricule droit non préparé ne dépasse pas 40 mmHg.</li><li>Le ventricule droit dilaté refoule le septum, réduit le débit gauche et sa propre perfusion coronaire : la gravité est circulatoire, la saturation peut rester normale.</li><li>La thrombine forme la fibrine, la plasmine la dégrade en D-dimères ; l’anticoagulant freine la formation, le thrombolytique accélère la dégradation.</li><li>La thrombophilie est un facteur modéré ; le syndrome des antiphospholipides impose un antagoniste de la vitamine K.</li></ul></template>
<template data-pop="pareto-i26-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i26-p-1,i26-p-2,i26-p-3,i26-p-4"></p><ul><li>Apixaban : 10 mg deux fois par jour sept jours puis 5 mg deux fois par jour.</li><li>Rivaroxaban : 15 mg deux fois par jour 21 jours puis 20 mg une fois par jour avec nourriture.</li><li>Héparine parentérale pour circonstances particulières ; altéplase uniquement si indication de reperfusion et balance hémorragique adaptée.</li><li>Ne jamais appliquer à l’embolie aiguë la dose réduite utilisée dans une autre indication.</li><li>Dabigatran et édoxaban : au moins cinq jours d’anticoagulation parentérale d’abord ; dabigatran 150 mg deux fois par jour (110 mg à partir de 80 ans ou si clairance 30–50 mL/min), contre-indiqué sous 30 mL/min ; édoxaban 60 mg une fois par jour, 30 mg si clairance 15–50 mL/min, poids ≤ 60 kg ou traitement par ciclosporine, dronédarone, érythromycine, kétoconazole, quinidine ou vérapamil.</li><li>Héparine non fractionnée : 80 UI/kg puis 18 UI/kg/heure ; temps de céphaline activée 1,5–2,5 fois le témoin, cible adaptée aux réactifs.</li><li>Antagoniste de la vitamine K : chevauchement d’au moins cinq jours, INR cible 2,0–3,0 ; Sintrom contre-indiqué en insuffisance rénale ou hépatique sévère, Marcoumar en cas de lésion grave du parenchyme hépatique.</li><li>Altéplase : 10 mg puis 90 mg en deux heures dès 65 kg (jamais plus de 100 mg), maximum 1,5 mg/kg sous 65 kg.</li></ul></template>
