<template data-pop="i26-wells" data-title="Wells à deux catégories : probabilité clinique"><p>Signes cliniques de thrombose veineuse profonde : 3 points ; embolie jugée plus probable qu’un autre diagnostic : 3 ; fréquence cardiaque &gt; 100/min : 1,5 ; immobilisation d’au moins trois jours ou chirurgie dans les quatre dernières semaines : 1,5 ; antécédent de thrombose ou embolie : 1,5 ; hémoptysie : 1 ; cancer actif ou traité dans les six derniers mois : 1. Total ≤ 4 : embolie « peu probable » ; &gt; 4 : « probable ». Utiliser le score comme aide à la probabilité prétest, pas comme preuve de présence ou d’absence.</p></template>
<template data-pop="i26-ddimer" data-title="D-dimères : unités, seuils et pièges"><p>Seuil conventionnel de 500 µg/L en unités équivalentes fibrinogène pour un dosage sensible chez un patient à probabilité non élevée ; chez les plus de 50 ans, l’ESC/ERS 2019 permet le seuil ajusté à l’âge : âge × 10 µg/L dans ces mêmes unités. Vérifier l’unité du laboratoire et sa méthode avant toute comparaison. Une hausse est peu spécifique ; un résultat négatif ne remplace pas l’imagerie lorsque la probabilité est élevée.</p></template>
<template data-pop="i26-perc" data-title="PERC : règle d’exclusion à très faible probabilité"><p>Huit conditions toutes requises : âge &lt; 50 ans ; pouls &lt; 100/min ; saturation en oxygène ≥ 95 % ; pas d’œdème unilatéral de jambe ; pas d’hémoptysie ; pas de chirurgie ou traumatisme récent ; pas d’antécédent de maladie thromboembolique veineuse ; pas de prise d’hormones œstrogéniques. Cette règle s’emploie seulement si le jugement initial classe déjà le patient à très faible probabilité. Si une seule de ces huit conditions de faible risque n’est pas remplie, ou si la probabilité clinique est plus forte, appliquer l’algorithme diagnostique habituel.</p></template>
<template data-pop="i26-ctpa" data-title="Angiographie tomodensitométrique pulmonaire"><p>Examen avec contraste iodé recherchant un défaut de remplissage intraluminal des artères pulmonaires. Contrôler technique, bolus, mouvement, siège et cohérence avec probabilité clinique. Un résultat négatif chez un patient à forte probabilité ou une acquisition non diagnostique demande réévaluation plutôt qu’une conclusion mécanique.</p></template>
<template data-pop="i26-spesi" data-title="Score pronostique simplifié"><p>Six facteurs valant chacun un point : âge &gt; 80 ans, cancer, maladie cardiopulmonaire chronique, fréquence cardiaque ≥ 110/min, pression artérielle systolique &lt; 100 mmHg, saturation artérielle en oxygène &lt; 90 %. Aucun facteur : score 0, risque clinique faible dans sa population de validation ; ≥ 1 : risque plus élevé. Le score n’est ni une règle pour diagnostiquer l’embolie ni une autorisation automatique de retour à domicile.</p></template>
<template data-pop="i26-anticoag" data-title="Anticoagulation curative"><p>Objectif : empêcher extension du thrombus et récidive pendant la fibrinolyse naturelle. Choix selon stabilité, grossesse, cancer, fonction rénale, risque hémorragique, interactions et possibilité d’absorber le traitement oral. Les anticoagulants oraux directs éligibles sont préférés aux antagonistes de la vitamine K selon AHA/ACC 2026. La phase initiale dure au moins trois mois dans la plupart des cas, et la nécessité d’une phase prolongée se réévalue.</p></template>
<template data-pop="i26-reperf" data-title="Reperfusion et rapport bénéfice-risque"><p>Une embolie responsable de choc ou hypotension persistante nécessite une décision urgente de reperfusion si le risque hémorragique le permet. Options : thrombolyse systémique, traitement dirigé par cathéter, thrombectomie mécanique et embolectomie chirurgicale selon ressources et contre-indications. Chez la personne stable à risque intermédiaire, la thrombolyse de routine expose à un saignement sans bénéfice justifiant sa généralisation ; surveillance et traitement de sauvetage en cas de décompensation.</p></template>
<template data-pop="i26-d-apix" data-title="Apixaban : mécanisme, dose et précautions"><p><b>Mécanisme :</b> inhibition directe du facteur Xa, réduisant la formation de thrombine. <b>Preuve :</b> essai AMPLIFY, 2013, chez des adultes avec événement thromboembolique aigu ; efficacité non inférieure et moins d’hémorragies majeures que l’association énoxaparine et warfarine dans la population étudiée. <b>Dose suisse embolie :</b> 10 mg oral deux fois par jour sept jours, puis 5 mg deux fois par jour ; 2,5 mg deux fois par jour uniquement pour prévention prolongée après au moins six mois. <b>Risques :</b> saignement, interactions, prudence selon fonction rénale ; contre-indiqué pendant grossesse ou allaitement selon information suisse. <b>Suivi :</b> saignement, adhésion, rein et traitements concomitants.</p></template>
<template data-pop="i26-d-riva" data-title="Rivaroxaban : mécanisme, dose et précautions"><p><b>Mécanisme :</b> inhibition directe du facteur Xa. <b>Preuve :</b> essai EINSTEIN-PE, 2012, chez des patients avec embolie symptomatique ; non-infériorité face à énoxaparine puis antagoniste de la vitamine K dans cette population. <b>Dose suisse embolie :</b> 15 mg oral deux fois par jour pendant 21 jours, puis 20 mg oral une fois par jour, avec nourriture pour les comprimés de 15 et 20 mg. <b>Risques :</b> hémorragie, interactions et exposition accrue en insuffisance rénale ; grossesse et allaitement contre-indiqués selon la monographie. <b>Suivi :</b> fonction rénale, saignement et observance.</p></template>
<template data-pop="i26-d-enox" data-title="Énoxaparine : mécanisme, dose et précautions"><p><b>Mécanisme :</b> héparine de bas poids moléculaire qui accélère l’effet de l’antithrombine contre le facteur Xa. <b>Preuves :</b> essai de Merli et collaborateurs (<i>Annals of Internal Medicine</i>, 2001 ; 900 patients avec thrombose veineuse profonde symptomatique, dont 32 % avec embolie pulmonaire confirmée) : 1 mg/kg deux fois par jour ou 1,5 mg/kg une fois par jour aussi efficaces que l’héparine non fractionnée intraveineuse, sans différence de sécurité ; comparateur initial dans EINSTEIN-PE (2012) et AMPLIFY (2013). L’ESC/ERS 2019 préfère l’héparine de bas poids moléculaire à l’héparine non fractionnée chez la plupart des patients lorsque l’anticoagulation débute par voie parentérale (classe I, niveau A). <b>Dose suisse :</b> 1 mg/kg sous-cutané toutes les douze heures dans la thrombose veineuse profonde avec ou sans embolie ; une autre option de 1,5 mg/kg une fois par jour existe pour certains cas non compliqués. Insuffisance rénale sévère, clairance de 15 à 30 mL/min : 1 mg/kg une fois par jour, en raison d’une exposition nettement accrue ; non recommandée sous 15 mL/min, hors prévention de la coagulation du circuit d’hémodialyse. <b>Risques :</b> hémorragie, thrombopénie induite par l’héparine ; surveiller plaquettes, rein et saignement. <b>Grossesse :</b> l’ESC/ERS 2019 recommande une dose thérapeutique fixe d’héparine de bas poids moléculaire fondée sur le poids du début de grossesse (classe I, niveau B).</p></template>
<template data-pop="i26-d-alte" data-title="Altéplase : dose suisse et sécurité"><p><b>Mécanisme :</b> activateur tissulaire du plasminogène recombinant ; il convertit le plasminogène lié à la fibrine en plasmine, qui dégrade la fibrine. <b>Preuves :</b> la reperfusion réduit rapidement la charge hémodynamique en embolie à haut risque. L’essai PEITHO (2014) a étudié la <b>ténectéplase</b>, et non l’altéplase : bolus unique adapté au poids associé à l’héparine, contre placebo et héparine, chez 1 006 patients normotendus à risque intermédiaire-élevé (dysfonction ventriculaire droite et troponine positive). Décès ou décompensation hémodynamique à sept jours : 2,6 % contre 5,6 %, gain porté par la décompensation hémodynamique (1,6 % contre 5,0 %), sans différence significative de mortalité ; hémorragies majeures extracrâniennes : 6,3 % contre 1,2 % ; accidents vasculaires cérébraux : 2,4 % contre 0,2 %, hémorragiques pour 10 des 12 survenus sous ténectéplase. D’où l’absence de thrombolyse systémique de routine dans ce groupe ; ces chiffres ne se transposent pas tels quels à l’altéplase. <b>Dose suisse Actilyse pour embolie aiguë à haut risque :</b> &gt; 65 kg : 10 mg en bolus sur 1–2 minutes puis 90 mg en deux heures (total 100 mg) ; &lt; 65 kg : bolus 10 mg puis perfusion sans dépasser 1,5 mg/kg au total sur deux heures. <b>Relais :</b> héparine commencée ou reprise lorsque le temps de céphaline activée est inférieur au double de la limite supérieure de la normale, cible 50 à 70 secondes. <b>Contre-indications :</b> saignement actif, antécédent d’hémorragie intracrânienne, chirurgie ou traumatisme majeurs récents, à confronter à la menace vitale. <b>Risque majeur :</b> hémorragie intracrânienne ; surveillance continue en soins intensifs.</p></template>
<template data-pop="i26-d-dabi" data-title="Dabigatran : mécanisme, dose et précautions"><p><b>Mécanisme :</b> le dabigatran étexilate est une prodrogue orale transformée en dabigatran, inhibiteur direct, compétitif et réversible de la thrombine libre et liée au caillot ; son élimination est principalement rénale. <b>Preuves :</b> essais RE-COVER (2009) et RE-COVER II (2014), chez des adultes présentant une thrombose veineuse profonde ou une embolie pulmonaire aiguë, traités d’abord par héparine parentérale : le dabigatran 150 mg deux fois par jour était non inférieur à la warfarine pour la récidive thromboembolique à six mois, avec moins d’hémorragies cliniquement pertinentes. <b>Dose suisse :</b> après au moins cinq jours d’anticoagulation parentérale, 150 mg deux fois par jour de 18 à 80 ans, ou 110 mg deux fois par jour si le risque hémorragique est accru ; au-delà de 80 ans, 110 mg deux fois par jour. Le résumé européen des caractéristiques du produit prévoit 110 mg deux fois par jour chez le patient traité par vérapamil. <b>Contre-indications :</b> clairance de la créatinine inférieure à 30 mL/min ; kétoconazole ou itraconazole systémiques, ciclosporine, dronédarone et association fixe glécaprévir/pibrentasvir (information professionnelle Pradaxa) ; saignement actif ; prothèse valvulaire mécanique. <b>Effets indésirables :</b> hémorragies, dyspepsie. <b>Surveillance :</b> clairance avant le début puis dans toute situation qui peut la réduire (déshydratation, hypovolémie, médicament néphrotoxique) ; observance, car la demi-vie est courte. <b>Antidote :</b> idarucizumab 5 g par voie intraveineuse.</p></template>
<template data-pop="i26-d-edox" data-title="Édoxaban : mécanisme, dose et précautions"><p><b>Mécanisme :</b> inhibiteur direct, sélectif et réversible du facteur Xa. <b>Preuve :</b> essai Hokusai-VTE (2013), 8 292 adultes avec thrombose veineuse profonde ou embolie pulmonaire symptomatique, traités d’abord par héparine : l’édoxaban une fois par jour était non inférieur à la warfarine pour la récidive thromboembolique (3,2 % contre 3,5 %) et causait moins d’hémorragies cliniquement pertinentes (8,5 % contre 10,3 %). <b>Dose suisse :</b> après au moins cinq jours d’anticoagulation parentérale, 60 mg une fois par jour ; 30 mg une fois par jour si la clairance de la créatinine est de 15 à 50 mL/min, si le poids est ≤ 60 kg, ou en cas de traitement par ciclosporine, dronédarone, érythromycine ou kétoconazole. <b>Limites :</b> non recommandé sous 15 mL/min ; contre-indiqué en cas d’hépatopathie associée à une coagulopathie et pendant la grossesse ou l’allaitement. <b>Surveillance :</b> poids, clairance, interactions, saignement et observance.</p></template>
<template data-pop="i26-d-hnf" data-title="Héparine non fractionnée : mécanisme, dose et surveillance"><p><b>Mécanisme :</b> l’héparine potentialise l’antithrombine, qui inactive la thrombine et le facteur Xa ; sa demi-vie courte et sa neutralisation complète par la protamine en font l’anticoagulant des situations où une reperfusion ou un geste invasif peut survenir. <b>Place selon ESC/ERS 2019 :</b> patient instable ou candidat à une reperfusion primaire, clairance de la créatinine ≤ 30 mL/min, obésité sévère ; ailleurs, l’héparine de bas poids moléculaire est préférée. <b>Dose :</b> nomogramme pondéral de Raschke (1993), repris par l’American College of Chest Physicians en 2012 : bolus de 80 UI/kg par voie intraveineuse, puis perfusion continue de 18 UI/kg/heure. <b>Surveillance :</b> temps de céphaline activée maintenu à 1,5–2,5 fois le témoin, ou activité anti-Xa de 0,3 à 0,7 UI/mL lorsque le laboratoire la propose ; premier contrôle six heures après le bolus, puis six heures après chaque modification ; numération plaquettaire répétée. <b>Effets indésirables :</b> hémorragie ; thrombopénie induite par l’héparine, plus fréquente qu’avec les héparines de bas poids moléculaire. <b>Antidote :</b> sulfate de protamine.</p></template>
<template data-pop="i26-d-avk" data-title="Antagonistes de la vitamine K : relais, cible et surveillance"><p><b>Mécanisme :</b> inhibition de la vitamine K époxyde réductase, qui empêche la gamma-carboxylation des facteurs II, VII, IX et X et des protéines C et S ; l’effet antithrombotique complet demande plusieurs jours. <b>Produits autorisés en Suisse :</b> phenprocoumone (Marcoumar), de demi-vie longue (de l’ordre de 140 heures), et acénocoumarol (Sintrom), de demi-vie courte (de l’ordre de 10 heures) ; la warfarine des essais internationaux n’en fait pas partie. <b>Relais :</b> début dès le premier jour de l’anticoagulation parentérale, chevauchement d’au moins cinq jours et jusqu’à un INR entre 2,0 et 3,0 deux jours consécutifs. <b>Cible :</b> INR 2,5 (intervalle 2,0–3,0) selon ESC/ERS 2019. <b>Place :</b> alternative aux anticoagulants oraux directs, préférée en cas de syndrome des antiphospholipides ou d’insuffisance rénale sévère. <b>Surveillance :</b> INR rapproché pendant l’instauration, puis espacé lorsque la valeur est stable ; contrôle à chaque changement de traitement associé ou d’alimentation riche en vitamine K. <b>Contre-indication :</b> grossesse. <b>Réversion :</b> vitamine K par voie intraveineuse et concentré de complexe prothrombinique en cas d’hémorragie grave.</p></template>
<template data-pop="pareto-i26-fondements" data-title="Pareto — Fondements"><p class="ratio" data-cover="i26-0,i26-1,i26-2,i26-3"></p><ul><li>Thrombus veineux migré → obstacle pulmonaire → surcharge ventriculaire droite et possible choc.</li><li>Le haut risque est hémodynamique ; la taille anatomique seule ne suffit pas.</li><li>Connaître les deux cadres : ESC/ERS 2019 et catégories A–E AHA/ACC 2026.</li></ul></template>
<template data-pop="pareto-i26-clinique" data-title="Pareto — Clinique"><p class="ratio" data-cover="i26-4,i26-5,i26-6"></p><ul><li>Facteurs : chirurgie, immobilisation, cancer, œstrogènes, grossesse, antécédent.</li><li>Dyspnée et douleur peuvent coexister avec un examen pulmonaire pauvre.</li><li>Pression, fréquence respiratoire, saturation et perfusion priment sur l’absence de signe de jambe.</li></ul></template>
<template data-pop="pareto-i26-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="i26-7,i26-8"></p><ul><li>Instable : soins critiques, échographie au lit, imagerie si transport possible.</li><li>Stable : probabilité prétest → D-dimères seulement si non élevée → image ciblée.</li><li>Un D-dimère positif n’établit pas l’embolie ; un D-dimère négatif ne l’exclut pas en forte probabilité.</li><li>Ventricule droit et biomarqueurs déterminent le pronostic après diagnostic.</li><li>Seuils : Wells ≤ 4 « peu probable », &gt; 4 « probable » ; D-dimères &lt; 500 µg/L, ou âge × 10 µg/L après 50 ans ; règle PERC seulement si probabilité très faible.</li><li>Haut risque : arrêt cardiaque, choc obstructif ou pression systolique &lt; 90 mmHg (ou chute ≥ 40 mmHg) plus de quinze minutes.</li><li>Écarter d’abord syndrome coronarien aigu, dissection aortique, pneumothorax sous tension, tamponnade et choc septique.</li></ul></template>
<template data-pop="pareto-i26-prise" data-title="Pareto — Traitement et suivi"><p class="ratio" data-cover="i26-9,i26-10,i26-11,i26-12"></p><ul><li>Anticoagulation curative au moins trois mois ; intensité et durée adaptées au terrain.</li><li>Choc : reperfusion urgente après balance hémorragique ; patient stable : pas de thrombolyse systématique.</li><li>Évaluer récidive et saignement avant toute interruption, et rechercher les symptômes fonctionnels durant au moins un an.</li><li>Choc : remplissage prudent, vasopresseur si hypotension persistante ; aucun filtre cave systématique.</li><li>Sortie précoce seulement si risque pronostique faible, sans hypoxémie et avec suivi assuré.</li><li>Au-delà de trois à six mois : poursuivre si aucun facteur transitoire majeur ou si un facteur persiste.</li><li>Grossesse : héparine de bas poids moléculaire ; anticoagulants oraux directs exclus. Dabigatran contre-indiqué sous 30 mL/min de clairance.</li><li>Critère formel : défaut de remplissage intraluminal en angiographie tomodensitométrique ; une thrombose veineuse proximale suffit à traiter.</li></ul></template>
<template data-pop="pareto-i26-examens" data-title="Pareto — Examens"><p class="ratio" data-cover="i26-e-1,i26-e-2,i26-e-3,i26-e-4,i26-e-5"></p><ul><li>Examen principal de confirmation : angiographie tomodensitométrique si faisable ; scintigraphie selon contre-indication.</li><li>D-dimères seulement avec probabilité non élevée et méthode/unité connues.</li><li>Échographie des jambes prouve une thrombose proximale, mais sa négativité n’exclut pas une embolie.</li><li>D-dimères : &lt; 500 µg/L en unités équivalentes fibrinogène ; après 50 ans, âge × 10 µg/L.</li><li>Scintigraphie : défaut perfusionnel segmentaire sans défaut ventilatoire ; résultat non diagnostique, autre examen.</li><li>Choc : échocardiographie au lit ; une dilatation droite n’est pas spécifique.</li><li>Troponine et peptide natriurétique : pronostic, jamais diagnostic ; radiographie et électrocardiogramme orientent sans confirmer.</li><li>Grossesse avec signes de jambe : échographie de compression d’abord.</li></ul></template>
<template data-pop="pareto-i26-sciences" data-title="Pareto — Sciences"><p class="ratio" data-cover="i26-s-a,i26-s-h,i26-s-p,i26-s-b"></p><ul><li>Source usuelle de l’embole : thrombose veineuse proximale des membres inférieurs.</li><li>Caillot riche en fibrine et en globules rouges ; sa résolution incomplète expose à la maladie thromboembolique chronique.</li><li>Thrombus → postcharge droite accrue → défaillance du ventricule droit → débit systémique diminué.</li><li>Alvéole ventilée non perfusée : espace mort ; saturation parfois normale malgré une forme grave.</li><li>D-dimères : dégradation de la fibrine, sans localisation du caillot.</li></ul></template>
<template data-pop="pareto-i26-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i26-p-1,i26-p-2,i26-p-3,i26-p-4"></p><ul><li>Apixaban : 10 mg deux fois par jour sept jours puis 5 mg deux fois par jour.</li><li>Rivaroxaban : 15 mg deux fois par jour 21 jours puis 20 mg une fois par jour avec nourriture.</li><li>Héparine parentérale pour circonstances particulières ; altéplase uniquement si indication de reperfusion et balance hémorragique adaptée.</li><li>Ne jamais appliquer à l’embolie aiguë la dose réduite utilisée dans une autre indication.</li><li>Dabigatran et édoxaban : au moins cinq jours d’anticoagulation parentérale d’abord ; dabigatran 150 mg deux fois par jour (110 mg au-delà de 80 ans), contre-indiqué sous 30 mL/min ; édoxaban 60 mg une fois par jour, 30 mg si clairance 15–50 mL/min, poids ≤ 60 kg ou traitement par ciclosporine, dronédarone, érythromycine ou kétoconazole.</li><li>Héparine non fractionnée : 80 UI/kg puis 18 UI/kg/heure, temps de céphaline activée 1,5–2,5 fois le témoin ou anti-Xa 0,3–0,7 UI/mL.</li><li>Antagoniste de la vitamine K : chevauchement d’au moins cinq jours, INR cible 2,0–3,0.</li><li>Altéplase : 10 mg puis 90 mg en deux heures, maximum 1,5 mg/kg sous 65 kg.</li></ul></template>
