<template data-pop="i26-wells" data-title="Wells à deux catégories : probabilité clinique"><p>Signes cliniques de thrombose veineuse profonde : 3 points ; embolie jugée plus probable qu’un autre diagnostic : 3 ; fréquence cardiaque &gt; 100/min : 1,5 ; immobilisation d’au moins trois jours ou chirurgie dans les quatre dernières semaines : 1,5 ; antécédent de thrombose ou embolie : 1,5 ; hémoptysie : 1 ; cancer actif ou traité dans les six derniers mois : 1. Total ≤ 4 : embolie « peu probable » ; &gt; 4 : « probable ». Utiliser le score comme aide à la probabilité prétest, pas comme preuve de présence ou d’absence.</p></template>
<template data-pop="i26-ddimer" data-title="D-dimères : unités, seuils et pièges"><p>Seuil conventionnel de 500 µg/L en unités équivalentes fibrinogène pour un dosage sensible chez un patient à probabilité non élevée ; chez les plus de 50 ans, l’ESC/ERS 2019 permet le seuil ajusté à l’âge : âge × 10 µg/L dans ces mêmes unités. Vérifier l’unité du laboratoire et sa méthode avant toute comparaison. Une hausse est peu spécifique ; un résultat négatif ne remplace pas l’imagerie lorsque la probabilité est élevée.</p></template>
<template data-pop="i26-perc" data-title="PERC : règle d’exclusion à très faible probabilité"><p>Huit conditions toutes requises : âge &lt; 50 ans ; pouls &lt; 100/min ; saturation en oxygène ≥ 95 % ; pas d’œdème unilatéral de jambe ; pas d’hémoptysie ; pas de chirurgie ou traumatisme récent ; pas d’antécédent de maladie thromboembolique veineuse ; pas de prise d’hormones œstrogéniques. Cette règle s’emploie seulement si le jugement initial classe déjà le patient à très faible probabilité. Si une seule de ces huit conditions de faible risque n’est pas remplie, ou si la probabilité clinique est plus forte, appliquer l’algorithme diagnostique habituel.</p></template>
<template data-pop="i26-ctpa" data-title="Angiographie tomodensitométrique pulmonaire"><p>Examen avec contraste iodé recherchant un défaut de remplissage intraluminal des artères pulmonaires. Contrôler technique, bolus, mouvement, siège et cohérence avec probabilité clinique. Un résultat négatif chez un patient à forte probabilité ou une acquisition non diagnostique demande réévaluation plutôt qu’une conclusion mécanique.</p></template>
<template data-pop="i26-spesi" data-title="Score pronostique simplifié"><p>Six facteurs valant chacun un point : âge &gt; 80 ans, cancer, maladie cardiopulmonaire chronique, fréquence cardiaque ≥ 110/min, pression artérielle systolique &lt; 100 mmHg, saturation artérielle en oxygène &lt; 90 %. Aucun facteur : score 0, risque clinique faible dans sa population de validation ; ≥ 1 : risque plus élevé. Le score n’est ni une règle pour diagnostiquer l’embolie ni une autorisation automatique de retour à domicile.</p></template>
<template data-pop="i26-anticoag" data-title="Anticoagulation curative"><p>Objectif : empêcher extension du thrombus et récidive pendant la fibrinolyse naturelle. Choix selon stabilité, grossesse, cancer, fonction rénale, risque hémorragique, interactions et possibilité d’absorber le traitement oral. Les anticoagulants oraux directs éligibles sont préférés aux antagonistes de la vitamine K selon AHA/ACC 2026. La phase initiale dure au moins trois mois dans la plupart des cas, et la nécessité d’une phase prolongée se réévalue.</p></template>
<template data-pop="i26-reperf" data-title="Reperfusion et rapport bénéfice-risque"><p>Une embolie responsable de choc ou hypotension persistante nécessite une décision urgente de reperfusion si le risque hémorragique le permet. Options : thrombolyse systémique, traitement dirigé par cathéter, thrombectomie mécanique et embolectomie chirurgicale selon ressources et contre-indications. Chez la personne stable à risque intermédiaire, la thrombolyse de routine expose à un saignement sans bénéfice justifiant sa généralisation ; surveillance et traitement de sauvetage en cas de décompensation.</p></template>
<template data-pop="i26-d-apix" data-title="Apixaban : mécanisme, dose et précautions"><p><b>Mécanisme :</b> inhibition directe du facteur Xa, réduisant la formation de thrombine. <b>Preuve :</b> essai AMPLIFY, 2013, chez des adultes avec événement thromboembolique aigu ; efficacité non inférieure et moins d’hémorragies majeures que l’association énoxaparine et warfarine dans la population étudiée. <b>Dose suisse embolie :</b> 10 mg oral deux fois par jour sept jours, puis 5 mg deux fois par jour ; 2,5 mg deux fois par jour uniquement pour prévention prolongée après au moins six mois. <b>Risques :</b> saignement, interactions, prudence selon fonction rénale ; contre-indiqué pendant grossesse ou allaitement selon information suisse. <b>Suivi :</b> saignement, adhésion, rein et traitements concomitants.</p></template>
<template data-pop="i26-d-riva" data-title="Rivaroxaban : mécanisme, dose et précautions"><p><b>Mécanisme :</b> inhibition directe du facteur Xa. <b>Preuve :</b> essai EINSTEIN-PE, 2012, chez des patients avec embolie symptomatique ; non-infériorité face à énoxaparine puis antagoniste de la vitamine K dans cette population. <b>Dose suisse embolie :</b> 15 mg oral deux fois par jour pendant 21 jours, puis 20 mg oral une fois par jour, avec nourriture pour les comprimés de 15 et 20 mg. <b>Risques :</b> hémorragie, interactions et exposition accrue en insuffisance rénale ; grossesse et allaitement contre-indiqués selon la monographie. <b>Suivi :</b> fonction rénale, saignement et observance.</p></template>
<template data-pop="i26-d-enox" data-title="Énoxaparine : mécanisme, dose et précautions"><p><b>Mécanisme :</b> héparine de bas poids moléculaire qui accélère l’effet de l’antithrombine contre le facteur Xa. <b>Dose suisse :</b> 1 mg/kg sous-cutané toutes les douze heures dans la thrombose veineuse profonde avec ou sans embolie ; une autre option de 1,5 mg/kg une fois par jour existe pour certains cas non compliqués. Vérifier adaptations rénales et poids réel selon monographie. <b>Risques :</b> hémorragie, thrombopénie induite par l’héparine ; surveiller plaquettes, rein et saignement. La notice actuelle conditionne son utilisation en grossesse à l’évaluation spécialisée.</p></template>
<template data-pop="i26-d-alte" data-title="Altéplase : dose suisse et sécurité"><p><b>Mécanisme :</b> activateur tissulaire du plasminogène qui favorise la dégradation de la fibrine. <b>Preuves :</b> la reperfusion réduit rapidement la charge hémodynamique en embolie à haut risque ; dans l’essai PEITHO, 2014, l’usage routinier d’une thrombolyse dans une embolie stable à risque intermédiaire a augmenté les saignements, d’où la restriction. <b>Dose suisse Actilyse pour embolie aiguë à haut risque :</b> &gt; 65 kg : 10 mg en bolus sur 1–2 minutes puis 90 mg en deux heures (total 100 mg) ; &lt; 65 kg : bolus 10 mg puis perfusion sans dépasser 1,5 mg/kg au total sur deux heures. <b>Risque majeur :</b> saignement intracrânien. Vérifier contre-indications, poids, protocole et surveillance intensive.</p></template>
<template data-pop="pareto-i26-fondements" data-title="Pareto — Fondements"><p class="ratio" data-cover="i26-0,i26-1,i26-2,i26-3"></p><ul><li>Thrombus veineux migré → obstacle pulmonaire → surcharge ventriculaire droite et possible choc.</li><li>Le haut risque est hémodynamique ; la taille anatomique seule ne suffit pas.</li><li>Connaître les deux cadres : ESC/ERS 2019 et catégories A–E AHA/ACC 2026.</li></ul></template>
<template data-pop="pareto-i26-clinique" data-title="Pareto — Clinique"><p class="ratio" data-cover="i26-4,i26-5,i26-6"></p><ul><li>Facteurs : chirurgie, immobilisation, cancer, œstrogènes, grossesse, antécédent.</li><li>Dyspnée et douleur peuvent coexister avec un examen pulmonaire pauvre.</li><li>Pression, fréquence respiratoire, saturation et perfusion priment sur l’absence de signe de jambe.</li></ul></template>
<template data-pop="pareto-i26-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="i26-7,i26-8"></p><ul><li>Instable : soins critiques, échographie au lit, imagerie si transport possible.</li><li>Stable : probabilité prétest → D-dimères seulement si non élevée → image ciblée.</li><li>Un D-dimère positif n’établit pas l’embolie ; un D-dimère négatif ne l’exclut pas en forte probabilité.</li><li>Ventricule droit et biomarqueurs déterminent le pronostic après diagnostic.</li></ul></template>
<template data-pop="pareto-i26-prise" data-title="Pareto — Traitement et suivi"><p class="ratio" data-cover="i26-9,i26-10,i26-11,i26-12"></p><ul><li>Anticoagulation curative au moins trois mois ; intensité et durée adaptées au terrain.</li><li>Choc : reperfusion urgente après balance hémorragique ; patient stable : pas de thrombolyse systématique.</li><li>Évaluer récidive et saignement avant toute interruption, et rechercher les symptômes fonctionnels durant au moins un an.</li></ul></template>
<template data-pop="pareto-i26-examens" data-title="Pareto — Examens"><p class="ratio" data-cover="i26-e-1,i26-e-2,i26-e-3,i26-e-4,i26-e-5"></p><ul><li>Examen principal de confirmation : angiographie tomodensitométrique si faisable ; scintigraphie selon contre-indication.</li><li>D-dimères seulement avec probabilité non élevée et méthode/unité connues.</li><li>Échographie des jambes prouve une thrombose proximale, mais sa négativité n’exclut pas une embolie.</li></ul></template>
<template data-pop="pareto-i26-sciences" data-title="Pareto — Sciences"><p class="ratio" data-cover="i26-3,i26-e-4"></p><ul><li>Le thrombus élève la postcharge droite ; la défaillance du ventricule droit diminue le débit systémique.</li><li>Une alvéole ventilée sans débit devient de l’espace mort ; saturation normale possible malgré une maladie grave.</li><li>Les D-dimères reflètent la dégradation de fibrine, sans localiser le caillot.</li></ul></template>
<template data-pop="pareto-i26-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i26-p-1,i26-p-2,i26-p-3,i26-p-4"></p><ul><li>Apixaban : 10 mg deux fois par jour sept jours puis 5 mg deux fois par jour.</li><li>Rivaroxaban : 15 mg deux fois par jour 21 jours puis 20 mg une fois par jour avec nourriture.</li><li>Héparine parentérale pour circonstances particulières ; altéplase uniquement si indication de reperfusion et balance hémorragique adaptée.</li><li>Ne jamais appliquer à l’embolie aiguë la dose réduite utilisée dans une autre indication.</li></ul></template>
