<!-- ===== FENÊTRES NOUVELLES DE L’ONGLET 1 (réécriture pédagogique du 26.09.2026) ===== -->
<template data-pop="i26-circ" data-title="Circulation pulmonaire normale">
<div class="lab">Définition</div><p>La circulation pulmonaire conduit le sang du ventricule droit aux capillaires alvéolaires, puis à l’oreillette gauche. Elle reçoit à chaque instant le même débit que la circulation systémique, car les deux circuits sont montés en série.</p>
<div class="lab">Valeurs normales</div><p>Chez le sujet sain au repos, la pression artérielle pulmonaire moyenne vaut 14,0 ± 3,3 mmHg. Elle dépasse rarement 20 mmHg et ne dépend ni du sexe ni de l’origine. Ces chiffres proviennent d’une revue de 47 études et de 1 187 sujets sains explorés par cathétérisme cardiaque droit (Kovacs et collaborateurs, 2009).</p>
<div class="lab">Pourquoi la résistance est basse</div><p>Le lit capillaire pulmonaire est très étendu, et ses vaisseaux sont minces et compliants. Quand le débit augmente, des capillaires peu perfusés au repos s’ouvrent et les autres se distendent : la résistance baisse, et la pression monte peu. Dans la revue de Kovacs, la pression moyenne à l’effort léger atteignait 19,4 ± 4,8 mmHg avant 50 ans et 29,4 ± 8,4 mmHg à partir de 50 ans.</p>
<div class="lab">Le ventricule droit</div><p>Le ventricule droit a une paroi fine, adaptée à cette faible résistance. Il supporte une surcharge de volume, mais pas une surcharge de pression brutale. Sans préparation par une hypertension pulmonaire ancienne, il ne peut pas générer une pression moyenne supérieure à 40 mmHg (ESC/ERS 2019).</p>
<div class="lab">Conséquence clinique</div><p>Une petite embolie est absorbée par la réserve du lit pulmonaire. Une embolie qui obstrue plus de 30 à 50 % du lit dépasse cette réserve : la pression monte, et le ventricule droit peut défaillir. Une pression pulmonaire très élevée au moment d’une embolie supposée aiguë fait donc suspecter une hypertension pulmonaire chronique préexistante.</p></template>
<template data-pop="i26-hemostase" data-title="Hémostase, fibrinolyse et D-dimères">
<div class="lab">La coagulation</div><p>La coagulation transforme le fibrinogène soluble en fibrine, sous l’action de la thrombine. La fibrine forme un réseau qui consolide le caillot.</p>
<div class="lab">La fibrinolyse</div><p>La plasmine, formée à partir du plasminogène, dégrade la fibrine. La dégradation de la fibrine réticulée libère des D-dimères. Dans une thrombose aiguë, la coagulation et la fibrinolyse s’activent en même temps, ce qui élève les D-dimères (ESC/ERS 2019).</p>
<div class="lab">Ce que visent les traitements</div><p>Les anticoagulants freinent la formation de fibrine. L’héparine renforce l’action de l’antithrombine. Les anticoagulants oraux directs inhibent le facteur Xa ou la thrombine. Les antagonistes de la vitamine K diminuent la synthèse des facteurs de coagulation qui dépendent de cette vitamine. Ces médicaments empêchent l’extension du caillot sans le dissoudre. Les thrombolytiques, comme l’altéplase, transforment le plasminogène lié à la fibrine en plasmine et dissolvent le caillot, au prix d’un risque hémorragique majeur.</p>
<div class="lab">Conséquence pratique</div><p>Cette distinction explique pourquoi l’anticoagulation suffit à la plupart des patients, et pourquoi la thrombolyse se réserve à ceux dont la vie est menacée. Elle explique aussi que les D-dimères signalent un caillot quelque part dans l’organisme, sans le localiser.</p></template>
<template data-pop="i26-bayes" data-title="Probabilité avant et après un test">
<div class="lab">Définitions</div><p>La probabilité prétest est la probabilité qu’un patient soit atteint avant le résultat d’un test. Elle s’estime par le jugement clinique ou par un score. La probabilité post-test est la probabilité après le résultat. Selon l’ESC/ERS 2019, la probabilité après un examen d’imagerie dépend non seulement des qualités du test, mais aussi de la probabilité prétest.</p>
<div class="lab">Valeurs prédictives</div><p>La valeur prédictive négative est la probabilité qu’un test négatif corresponde à une absence réelle de maladie. La valeur prédictive positive est la probabilité qu’un test positif corresponde à une maladie réelle. Ces deux valeurs varient avec la probabilité prétest, alors que la sensibilité et la spécificité restent propres au test.</p>
<div class="lab">Exemple</div><p>Dans PIOPED II, un scanner normal avait une valeur prédictive négative de 96 % en cas de probabilité faible, mais de 60 % en cas de probabilité élevée. Un scanner anormal avait une valeur prédictive positive de 58 % en cas de probabilité faible, et de 92 à 96 % en cas de probabilité intermédiaire ou élevée.</p>
<div class="lab">Conséquence pratique</div><p>Un test d’exclusion très sensible, comme les D-dimères, ne s’emploie que si la probabilité prétest n’est pas élevée. Un résultat qui contredit fortement la probabilité clinique fait envisager un examen complémentaire plutôt qu’une conclusion automatique.</p></template>
<template data-pop="i26-defvd" data-title="Défaillance ventriculaire droite aiguë">
<div class="lab">Définition</div><p>Selon l’ESC/ERS 2019, la défaillance ventriculaire droite aiguë est un syndrome d’évolution rapide, avec congestion systémique, dû à un remplissage altéré du ventricule droit ou à une baisse de son débit. Elle est la principale cause de décès de l’embolie grave.</p>
<div class="lab">Mécanismes enchaînés</div><p>La hausse brutale de la résistance pulmonaire dilate le ventricule droit et augmente la tension de sa paroi. Sa contraction se prolonge jusqu’au début de la diastole gauche : le septum bombe vers la gauche, et le remplissage du ventricule gauche diminue. Un bloc de branche droit peut aggraver cette désynchronisation. Le débit cardiaque et la pression artérielle baissent.</p>
<div class="lab">Ischémie du ventricule droit</div><p>La perfusion coronaire du ventricule droit dépend de la pression artérielle systémique, alors que ses besoins en oxygène augmentent avec la tension de sa paroi. Le déséquilibre entre apport et besoin lèse les cardiomyocytes et réduit encore leur contractilité, même si l’infarctus du ventricule droit reste rare. L’élévation de la troponine, associée à un pronostic plus sombre, témoigne de cette souffrance.</p>
<div class="lab">Réaction inflammatoire</div><p>Chez des patients décédés dans les 48 heures, le myocarde droit contenait d’importants infiltrats inflammatoires, peut-être favorisés par une libération massive d’adrénaline. Cette réaction pourrait expliquer les déstabilisations secondaires observées 24 à 48 heures après l’embolie. Une récidive précoce en est l’autre explication possible (ESC/ERS 2019).</p>
<div class="lab">Conséquence pratique</div><p>Le traitement agit sur chaque étape : la reperfusion réduit la postcharge, le vasopresseur restaure la pression qui perfuse les coronaires, et la prudence du remplissage évite d’aggraver la dilatation.</p></template>
<template data-pop="i26-shunt" data-title="Foramen ovale perméable et shunt droite-gauche">
<div class="lab">Définition</div><p>Le foramen ovale est une communication entre les deux oreillettes, normale chez le fœtus, qui reste perméable chez une partie des adultes. Il reste habituellement fermé en pratique, car la pression de l’oreillette gauche dépasse celle de l’oreillette droite.</p>
<div class="lab">Mécanisme dans l’embolie</div><p>Lorsque la pression de l’oreillette droite dépasse celle de l’oreillette gauche, le gradient s’inverse : du sang désaturé passe directement dans la circulation systémique. Selon l’ESC/ERS 2019, ce shunt est détecté par échocardiographie chez environ un tiers des patients.</p>
<div class="lab">Conséquences</div><p>Le shunt peut provoquer une hypoxémie sévère, réfractaire à l’oxygène. Il expose aussi à une embolie paradoxale : un caillot veineux traverse le foramen et provoque un accident vasculaire cérébral ischémique, surtout en cas de dysfonction du ventricule droit. Sa présence s’associe à une mortalité plus élevée.</p>
<div class="lab">Conséquence pratique</div><p>Une hypoxémie disproportionnée ou un déficit neurologique chez un patient atteint d’embolie font rechercher ce shunt par échocardiographie. Un déficit impose en outre une imagerie cérébrale.</p></template>
<template data-pop="i26-infarctus" data-title="Infarctus pulmonaire">
<div class="lab">Définition</div><p>L’infarctus pulmonaire est une zone d’hémorragie alvéolaire, parfois de nécrose, en aval d’une petite artère obstruée. Il siège surtout en périphérie, au contact de la plèvre.</p>
<div class="lab">Mécanisme</div><p>Les petits emboles distaux ont peu d’effet hémodynamique, mais ils peuvent créer des zones d’hémorragie alvéolaire (ESC/ERS 2019). Le tissu pulmonaire reçoit aussi de l’oxygène par les artères bronchiques et par l’air alvéolaire. Cette triple alimentation explique qu’une obstruction n’entraîne pas toujours d’infarctus.</p>
<div class="lab">Signes</div><p>L’infarctus donne une douleur pleurale, parfois une hémoptysie de faible abondance et un épanchement pleural habituellement minime. Au scanner, il peut prendre l’aspect d’une opacité périphérique à base pleurale. Dans PIOPED II, la présentation associant hémoptysie ou douleur pleurale, autrefois appelée syndrome d’infarctus pulmonaire, concernait 41 % des patients sans maladie cardiopulmonaire préalable.</p>
<div class="lab">Valeur</div><p>Son effet sur les échanges gazeux reste modeste, sauf chez le patient qui avait déjà une maladie cardiorespiratoire. Selon PIOPED II, les patients qui présentent ce tableau ont des embolies moins étendues que ceux qui présentent une dyspnée isolée.</p>
<div class="lab">Piège</div><p>Une opacité et une douleur pleurale font facilement conclure à une pneumonie. La probabilité clinique et les facteurs de risque doivent alors faire rechercher l’embolie.</p></template>
<template data-pop="i26-tropo" data-title="Troponine, peptides natriurétiques et lactate">
<div class="lab">Troponine cardiaque</div><p>La troponine s’élève lorsque des cardiomyocytes du ventricule droit sont lésés. Selon l’ESC/ERS 2019, elle est élevée chez 30 % des patients avec les dosages conventionnels et jusqu’à 60 % avec les dosages ultrasensibles. Son élévation s’associe à une mortalité plus élevée, y compris chez le patient stable, avec un rapport de cotes de 5,9.</p>
<div class="lab">Valeur négative</div><p>Dans une cohorte de 526 patients normotendus, une troponine T ultrasensible inférieure à 14 pg/mL avait une valeur prédictive négative de 98 % pour exclure une évolution hospitalière défavorable. Des seuils ajustés à l’âge ont été proposés : 14 pg/mL avant 75 ans et 45 pg/mL à partir de 75 ans.</p>
<div class="lab">Peptides natriurétiques</div><p>Le BNP et le NT-proBNP sont libérés par le myocarde étiré. Dans une méta-analyse, 51 % des patients avaient des taux élevés, avec un risque de décès précoce de 10 %. Un NT-proBNP inférieur à 500 pg/mL a servi à sélectionner des patients pour un traitement à domicile. Un seuil d’au moins 600 pg/mL augmente la spécificité pronostique.</p>
<div class="lab">Lactate</div><p>Un lactate artériel d’au moins 2 mmol/L traduit un déséquilibre entre l’apport et le besoin en oxygène des tissus. Il prédit les complications, même chez le patient initialement normotendu.</p>
<div class="lab">Mode d’emploi</div><p>Ces marqueurs servent au pronostic de l’embolie confirmée chez le patient stable : une troponine élevée associée à une dysfonction du ventricule droit définit le risque intermédiaire haut. Chez le patient instable, l’ESC/ERS 2019 ne les juge pas nécessaires à la décision.</p>
<div class="lab">Piège</div><p>Ces marqueurs ne diagnostiquent pas l’embolie. Une troponine élevée chez un patient dyspnéique peut traduire un syndrome coronarien aigu, un sepsis ou une autre maladie cardiaque. Un peptide natriurétique élevé peut traduire une insuffisance cardiaque gauche.</p></template>
<template data-pop="i26-vd" data-title="Dysfonction du ventricule droit : critères">
<div class="lab">À l’échocardiographie</div><p>L’ESC/ERS 2019 décrit cinq signes de surcharge droite.</p><ul><li>Le ventricule droit est dilaté, avec un rapport des diamètres droit et gauche supérieur à 1,0.</li><li>Le septum interventriculaire est aplati.</li><li>La veine cave inférieure est dilatée et se collabe peu à l’inspiration.</li><li>L’excursion systolique du plan de l’anneau tricuspide est inférieure à 16 mm.</li><li>La vitesse systolique de l’anneau tricuspide est inférieure à 9,5 cm/s en Doppler tissulaire.</li></ul><p>Les deux derniers signes mesurent la contraction longitudinale du ventricule droit. Un rapport d’au moins 1,0 et un TAPSE inférieur à 16 mm sont les signes le plus souvent associés à un pronostic défavorable.</p>
<div class="lab">Au scanner</div><p>Le scanner diagnostique mesure le même rapport sur une coupe transversale ou des quatre cavités. Une méta-analyse a réuni 49 études et plus de 13 000 patients. Un rapport d’au moins 1,0 y multipliait par 2,5 la cote du décès toutes causes. Il multipliait par 5,0 la cote du décès lié à l’embolie. Une dilatation légère, avec un rapport à peine supérieur à 0,9, se voit chez plus de la moitié des patients stables et a peu de valeur pronostique.</p>
<div class="lab">Signes plus spécifiques</div><p>Deux signes échographiques gardent une bonne valeur prédictive positive, même en cas de maladie cardiorespiratoire préexistante. Le premier associe un temps d’accélération de l’éjection pulmonaire inférieur à 60 ms à un gradient tricuspide inférieur à 60 mmHg. Le second est une contractilité diminuée de la paroi libre du ventricule droit, alors que l’apex se contracte normalement. Ils ne sont présents que chez 12 % et 20 % des patients non sélectionnés.</p>
<div class="lab">Piège</div><p>Une dilatation préexistante, due à une maladie cardiaque ou respiratoire, peut être attribuée à tort à l’embolie. Une paroi épaissie ou une vitesse d’insuffisance tricuspide supérieure à 3,8 m/s orientent vers une hypertension pulmonaire chronique.</p>
<div class="lab">Conséquence pratique</div><p>La dysfonction du ventricule droit fait passer un patient stable du risque faible au risque intermédiaire, même avec un sPESI nul. Associée à une troponine élevée, elle définit le risque intermédiaire haut.</p></template>
<template data-pop="i26-a-cardio" data-title="Maladie cardiaque récente">
<div class="lab">Questions</div><p>Le médecin demande une hospitalisation récente pour insuffisance cardiaque, fibrillation ou flutter auriculaire, un infarctus du myocarde récent, et l’existence d’une insuffisance cardiaque ou respiratoire chronique.</p>
<div class="lab">Pourquoi</div><p>Selon l’ESC/ERS 2019, deux situations cardiaques récentes sont des facteurs forts, qui multiplient le risque par plus de dix. La première est une hospitalisation pour insuffisance cardiaque, fibrillation ou flutter auriculaire dans les trois mois. La seconde est un infarctus du myocarde dans les trois mois. L’insuffisance cardiaque congestive et l’insuffisance respiratoire sont des facteurs modérés. La stase liée au bas débit et l’immobilisation expliquent en partie ce risque.</p>
<div class="lab">Dans les scores</div><p>Une maladie cardiopulmonaire chronique compte 1 point dans le sPESI. L’insuffisance cardiaque chronique et la maladie pulmonaire chronique comptent chacune 10 points dans le PESI.</p>
<div class="lab">Piège</div><p>Chez ces patients, l’aggravation de la dyspnée habituelle peut être le seul signe de l’embolie, que le médecin attribue alors trop vite à une décompensation cardiaque.</p>
<div class="lab">Lien réciproque</div><p>Un épisode thromboembolique augmente en retour le risque ultérieur d’infarctus du myocarde, d’accident vasculaire cérébral et d’embolie artérielle périphérique (ESC/ERS 2019).</p></template>
<template data-pop="i26-a-thrombo" data-title="Thrombophilie et histoire familiale">
<div class="lab">Questions</div><p>Le médecin demande les thromboses survenues chez les parents, les frères et les sœurs, leur âge et leur circonstance, ainsi qu’un bilan de thrombophilie déjà réalisé. Il recherche aussi des fausses couches répétées ou des thromboses artérielles, qui font évoquer un syndrome des antiphospholipides.</p>
<div class="lab">Pourquoi</div><p>La thrombophilie est un facteur de risque modéré (ESC/ERS 2019). Elle regroupe d’abord des anomalies héréditaires, comme les déficits en antithrombine, en protéine C ou en protéine S. Le facteur V Leiden et la mutation G20210A de la prothrombine en font aussi partie. Elle comprend enfin une anomalie acquise, le syndrome des antiphospholipides.</p>
<div class="lab">Qui tester</div><p>Selon l’ESC/ERS 2019, un bilan peut être envisagé chez le patient jeune, par exemple avant 50 ans, sans facteur identifiable. Ce bilan inclut les anticorps antiphospholipides et l’anticoagulant lupique. Des antécédents familiaux marqués renforcent l’indication.</p>
<div class="lab">Conséquence pratique</div><p>Certaines thrombophilies font souvent proposer une anticoagulation indéfinie après une première embolie sans facteur majeur. Il s’agit d’un déficit confirmé en antithrombine, en protéine C ou en protéine S. Il s’agit aussi d’une forme homozygote du facteur V Leiden ou de la mutation de la prothrombine. Aucun bénéfice d’un traitement prolongé n’est démontré chez les porteurs hétérozygotes de ces deux mutations. Le syndrome des antiphospholipides impose un antagoniste de la vitamine K.</p></template>
<template data-pop="i26-a-medic" data-title="Médicaments en cours">
<div class="lab">Questions</div><p>Le médecin relève tout anticoagulant, antiagrégant plaquettaire ou anti-inflammatoire non stéroïdien. Il relève aussi les hormones et les agents stimulant l’érythropoïèse. Il note enfin les médicaments qui induisent ou inhibent les enzymes hépatiques et la glycoprotéine P.</p>
<div class="lab">Pourquoi</div><p>Une embolie survenue sous anticoagulation efficace signale un échec du traitement. Elle fait envisager un filtre cave (ESC/ERS 2019, classe IIa, niveau C). Elle exclut aussi le traitement à domicile selon la règle de Hestia. Les antiagrégants et les anti-inflammatoires augmentent le risque hémorragique. Les hormones et les agents stimulant l’érythropoïèse augmentent le risque de thrombose.</p>
<div class="lab">Interactions</div><p>Certains inhibiteurs ou inducteurs puissants modifient l’exposition aux anticoagulants oraux directs et aux antagonistes de la vitamine K. L’onglet Pharmacologie détaille ces interactions molécule par molécule.</p>
<div class="lab">Conséquence pratique</div><p>La liste des médicaments décide parfois de la molécule : un traitement associé incompatible fait préférer une autre classe d’anticoagulant.</p></template>
<template data-pop="i26-s-toux" data-title="Toux et sibilants">
<div class="lab">Fréquence</div><p>Dans PIOPED II, une toux existait chez 34 % des patients sans maladie cardiopulmonaire préalable. Elle était le plus souvent sèche, mais parfois productive, avec une expectoration claire ou purulente. Des sibilants étaient signalés par 21 % des patients, mais rarement entendus à l’auscultation, chez 2 %.</p>
<div class="lab">Valeur</div><p>Ces symptômes ne sont pas spécifiques : ils existaient à des fréquences voisines chez les patients sans embolie de la même cohorte.</p>
<div class="lab">Piège</div><p>Une toux productive ou des sibilants orientent facilement vers une bronchite, un asthme ou une exacerbation de bronchopneumopathie chronique obstructive. Ces diagnostics n’excluent pas une embolie associée, surtout en présence de facteurs de risque.</p></template>
<template data-pop="i26-s-hemo" data-title="Hémoptysie">
<div class="lab">Définition</div><p>L’hémoptysie est l’émission de sang lors d’un effort de toux, en provenance des voies respiratoires situées sous la glotte.</p>
<div class="lab">Fréquence et aspect</div><p>Dans PIOPED II, l’hémoptysie était moins fréquente que la douleur pleurale. Lorsqu’elle survenait, elle restait de faible abondance : crachats rosés, striés de sang, ou sang pur en quantité inférieure à une cuillère à café.</p>
<div class="lab">Mécanisme</div><p>Elle traduit une hémorragie alvéolaire en aval d’un petit embole distal, c’est-à-dire un infarctus pulmonaire.</p>
<div class="lab">Dans les scores</div><p>L’hémoptysie vaut 1 point dans le score de Wells et 2 points dans le score de Genève révisé. Elle est l’un des trois items de l’algorithme YEARS, et la règle PERC exige son absence.</p>
<div class="lab">Piège</div><p>Une hémoptysie abondante n’est pas typique de l’embolie. Elle fait chercher une autre cause, comme un cancer bronchique, une tuberculose ou des bronchectasies. Elle pèse aussi sur la décision d’anticoaguler.</p></template>
<template data-pop="i26-x-etat" data-title="État général, conscience et température">
<div class="lab">Technique</div><p>Le médecin observe l’éveil, l’orientation, la capacité à parler en phrases complètes, la coloration, les marbrures et la température des extrémités. Il mesure la température centrale.</p>
<div class="lab">Signification</div><p>Une altération de l’état mental, une peau froide et moite ou des marbrures traduisent une hypoperfusion. Associées à une hypotension, elles définissent le choc obstructif (ESC/ERS 2019). Une altération de l’état mental ajoute 60 points au PESI, et une température inférieure à 36 °C en ajoute 20.</p>
<div class="lab">Fièvre</div><p>Une fièvre supérieure à 38,5 °C est rare dans l’embolie : elle concernait 1 % des patients de PIOPED II. Elle oriente vers une infection, sans exclure une embolie associée.</p>
<div class="lab">Piège</div><p>Chez le patient âgé, une confusion peut être la seule traduction d’une hypoperfusion. Le médecin mesure alors le lactate et répète la pression artérielle.</p></template>
<template data-pop="i26-x-poids" data-title="Poids et anthropométrie">
<div class="lab">Intérêt de la pesée</div><p>Plusieurs doses dépendent du poids réel. L’énoxaparine curative se dose à 1 mg/kg toutes les douze heures. L’héparine non fractionnée débute par un bolus de 80 UI/kg, suivi de 18 UI/kg par heure. L’altéplase ne dépasse pas 1,5 mg/kg sous 65 kg. L’édoxaban passe à 30 mg à 60 kg ou moins. Pendant la grossesse, la dose d’héparine de bas poids moléculaire se fixe sur le poids du début de grossesse.</p>
<div class="lab">Obésité</div><p>En cas d’obésité sévère, l’ESC/ERS 2019 retient l’héparine non fractionnée pour l’anticoagulation parentérale. La formule de Cockcroft-Gault, qui utilise le poids réel, surestime la fonction rénale chez le patient obèse.</p>
<div class="lab">Pronostic</div><p>Un indice de masse corporelle élevé fait partie des facteurs qui prédisent une dyspnée d’effort persistante après l’embolie (ESC/ERS 2019).</p>
<div class="lab">Piège</div><p>Chez le patient en choc, le médecin ne retarde aucun geste vital pour obtenir le poids : il utilise un poids estimé, puis il le corrige dès que possible.</p></template>
<template data-pop="i26-x-coeur" data-title="Auscultation cardiaque et signes du cœur droit">
<div class="lab">Technique</div><p>Le médecin ausculte le foyer pulmonaire, au deuxième espace intercostal gauche, pour apprécier la composante pulmonaire du deuxième bruit. Il palpe la région parasternale gauche pour chercher un soulèvement du ventricule droit, puis il ausculte le foyer tricuspide.</p>
<div class="lab">Valeur</div><p>Dans PIOPED II, l’examen cardiaque était anormal chez 21 % des patients sans maladie cardiopulmonaire préalable. Un éclat de la composante pulmonaire du deuxième bruit existait chez 15 %. Un soulèvement du ventricule droit existait chez 4 %, et une turgescence jugulaire chez 14 %.</p>
<div class="lab">Mécanisme</div><p>L’éclat du deuxième bruit traduit une pression artérielle pulmonaire élevée ; le soulèvement traduit un ventricule droit dilaté et surchargé.</p>
<div class="lab">Piège</div><p>Ces signes sont rares et peuvent préexister à l’embolie, par exemple dans une hypertension pulmonaire chronique. Leur absence n’exclut rien.</p></template>
<template data-pop="i26-geneve" data-title="Score de Genève révisé">
<div class="lab">Items et points</div><p>Le score de Genève révisé repose uniquement sur des variables objectives (Le Gal et collaborateurs, 2006). Il existe en version originale et en version simplifiée. Le tableau suivant reprend le tableau 5 de l’ESC/ERS 2019.</p>
<table><tr><th>Item</th><th>Version originale</th><th>Version simplifiée</th></tr><tr><td>Thrombose veineuse profonde ou embolie antérieure</td><td>3</td><td>1</td></tr><tr><td>Fréquence cardiaque de 75 à 94/min</td><td>3</td><td>1</td></tr><tr><td>Fréquence cardiaque d’au moins 95/min</td><td>5</td><td>2</td></tr><tr><td>Chirurgie ou fracture dans le mois précédent</td><td>2</td><td>1</td></tr><tr><td>Hémoptysie</td><td>2</td><td>1</td></tr><tr><td>Cancer actif</td><td>2</td><td>1</td></tr><tr><td>Douleur unilatérale d’un membre inférieur</td><td>3</td><td>1</td></tr><tr><td>Douleur à la palpation veineuse profonde et œdème unilatéral</td><td>4</td><td>1</td></tr><tr><td>Âge supérieur à 65 ans</td><td>1</td><td>1</td></tr></table>
<p>Les deux lignes de fréquence s’excluent : le patient ne reçoit que les points de l’une d’elles. Dans la version originale, la fréquence cardiaque et la palpation douloureuse avec œdème pèsent le plus. La version simplifiée donne 1 point à chaque item, sauf à la fréquence d’au moins 95/min, qui en vaut 2.</p>
<div class="lab">Seuils</div><p>Le score se lit à trois niveaux ou à deux niveaux. Le tableau suivant donne les seuils de chaque version.</p>
<table><tr><th>Catégorie</th><th>Version originale</th><th>Version simplifiée</th></tr><tr><td>Probabilité faible</td><td>0 à 3</td><td>0 à 1</td></tr><tr><td>Probabilité intermédiaire</td><td>4 à 10</td><td>2 à 4</td></tr><tr><td>Probabilité élevée</td><td>11 ou plus</td><td>5 ou plus</td></tr><tr><td>Embolie « peu probable »</td><td>0 à 5</td><td>0 à 2</td></tr><tr><td>Embolie « probable »</td><td>6 ou plus</td><td>3 ou plus</td></tr></table>
<p>Les trois premières lignes forment la lecture à trois niveaux. Les deux dernières forment la lecture à deux niveaux. Le médecin utilise la lecture que demande l’algorithme diagnostique qu’il suit.</p>
<div class="lab">Valeur</div><p>Dans la cohorte de validation, l’embolie était confirmée chez 8 % des patients à probabilité faible, 28 % à probabilité intermédiaire et 74 % à probabilité élevée.</p>
<div class="lab">Avantage et limite</div><p>Le score a été construit pour ne pas dépendre du jugement implicite du médecin. L’accord entre examinateurs n’a toutefois pas été étudié dans l’étude princeps.</p>
<div class="lab">Exemple</div><p>La patiente du cas obtient 15 points dans la version originale. L’âge compte 1 point, la chirurgie 2 et la douleur du mollet 3. La palpation douloureuse avec œdème compte 4 points, et la fréquence de 104/min en compte 5. Dans la version simplifiée, elle obtient 6 points. Sa probabilité est élevée dans les deux versions.</p></template>
<template data-pop="i26-years" data-title="Algorithme YEARS">
<div class="lab">Principe</div><p>L’algorithme YEARS évalue en même temps trois items du score de Wells et le taux de D-dimères. Il adapte le seuil des D-dimères au nombre d’items présents (van der Hulle et collaborateurs, 2017).</p>
<div class="lab">Les trois items</div><p>Les items sont les signes cliniques de thrombose veineuse profonde, l’hémoptysie et une embolie jugée comme le diagnostic le plus probable.</p>
<div class="lab">Règle</div><p>Sans aucun item, l’embolie est exclue si les D-dimères sont inférieurs à 1 000 ng/mL, soit 1 000 µg/L. Avec un item ou plus, elle est exclue si les D-dimères sont inférieurs à 500 ng/mL. Tous les autres patients ont une angiographie tomodensitométrique.</p>
<div class="lab">Preuves</div><p>Dans l’étude princeps, menée dans 12 hôpitaux néerlandais chez 3 465 patients, l’embolie a été exclue d’emblée chez 2 946 patients (85 %) laissés sans traitement. Parmi eux, 18 (0,61 %) ont présenté une maladie thromboembolique symptomatique pendant les trois mois de suivi. L’algorithme a évité le scanner chez 48 % des patients, contre 34 % avec le score de Wells et un seuil fixe de 500 ng/mL.</p>
<div class="lab">Place</div><p>L’ESC/ERS 2019 propose ce seuil adapté à la probabilité comme alternative au seuil fixe ou ajusté à l’âge (classe IIa, niveau B). Une version adaptée à la grossesse a été évaluée chez 498 femmes.</p>
<div class="lab">Piège</div><p>Les seuils de YEARS ne se combinent pas librement avec le score de Wells ni avec le seuil ajusté à l’âge. Le médecin choisit une stratégie validée et l’applique entière.</p></template>
<template data-pop="i26-vq" data-title="Scintigraphie pulmonaire de ventilation et de perfusion">
<div class="lab">Principe</div><p>La scintigraphie de perfusion injecte des particules d’albumine marquées au technétium 99m, qui se bloquent dans les capillaires perfusés. La scintigraphie de ventilation fait inhaler un gaz ou un aérosol radioactif. Dans l’embolie, un segment est mal perfusé mais normalement ventilé : on parle de défaut non concordant.</p>
<div class="lab">Lecture</div><p>Le résultat se classe en trois niveaux. Une scintigraphie normale exclut l’embolie. Une scintigraphie de haute probabilité la confirme chez la plupart des patients. Une scintigraphie non diagnostique impose une autre étape.</p>
<div class="lab">Règles de l’ESC/ERS 2019</div><p>Une perfusion normale exclut l’embolie sans autre examen (classe I, niveau A). Une haute probabilité confirme l’embolie (classe IIa, niveau B). Si la probabilité clinique est faible, une confirmation par un autre examen doit être envisagée. Une scintigraphie non diagnostique exclut l’embolie si elle s’associe à une échographie de compression proximale négative chez un patient à probabilité faible (classe IIa, niveau B).</p>
<div class="lab">Indications préférentielles</div><p>La scintigraphie convient au patient ambulatoire à probabilité faible dont la radiographie est normale. Elle convient aussi au sujet jeune, surtout à la femme, et à la femme enceinte. Elle convient enfin au patient ayant fait une anaphylaxie au produit de contraste et à l’insuffisant rénal sévère. Sa dose efficace est d’environ 2 millisieverts, contre 3 à 10 pour le scanner.</p>
<div class="lab">Limites</div><p>La scintigraphie planaire est non concluante dans environ la moitié des cas. Elle n’est diagnostique que chez 30 à 50 % des patients des urgences. Elle ne propose aucun autre diagnostic si l’embolie est exclue. La tomoscintigraphie réduit les résultats non concluants à moins de 3 %, mais elle n’a pas été validée par des études prospectives de prise en charge (classe IIb, niveau B).</p></template>
<template data-pop="i26-cus" data-title="Échographie de compression veineuse">
<div class="lab">Technique</div><p>Le médecin comprime la veine avec la sonde d’échographie. Une veine normale s’écrase complètement ; une veine thrombosée ne s’écrase pas entièrement. Dans la suspicion d’embolie, l’examen peut se limiter à quatre points : les deux plis de l’aine et les deux creux poplités (ESC/ERS 2019).</p>
<div class="lab">Critère</div><p>Le seul critère diagnostique validé de thrombose est la compressibilité incomplète de la veine. Les mesures de flux ne sont pas fiables.</p>
<div class="lab">Valeur</div><p>L’échographie a une sensibilité supérieure à 90 % et une spécificité d’environ 95 % pour la thrombose proximale symptomatique. Chez le patient suspect d’embolie, elle est très spécifique (96 %) mais peu sensible (41 %) : elle confirme souvent, mais elle exclut mal.</p>
<div class="lab">Règles</div><p>Une thrombose proximale chez un patient suspect d’embolie établit la maladie thromboembolique et suffit à traiter (ESC/ERS 2019, classe I, niveau A). La gravité de l’embolie doit ensuite être évaluée (classe IIa, niveau C). Une thrombose seulement distale fait envisager un autre examen pour confirmer l’embolie (classe IIa, niveau B).</p>
<div class="lab">Situations utiles</div><p>L’échographie aide lorsque le scanner est contre-indiqué, chez la femme enceinte avec des signes de jambe et chez le patient instable, au lit. Sa probabilité d’être positive est plus élevée en présence de symptômes de jambe.</p>
<div class="lab">Piège</div><p>Une échographie normale n’exclut pas l’embolie. Pendant la grossesse, elle n’explore pas les veines pelviennes : un gonflement de toute la jambe ou une douleur fessière fait discuter une phlébographie par résonance magnétique.</p></template>
<template data-pop="i26-echo" data-title="Échocardiographie au lit">
<div class="lab">Question posée</div><p>Chez le patient instable, l’échocardiographie transthoracique au lit recherche une surcharge du ventricule droit et, en même temps, une autre cause de choc.</p>
<div class="lab">Valeur dans le choc</div><p>Selon l’ESC/ERS 2019, l’absence de signe de surcharge ou de dysfonction du ventricule droit exclut pratiquement l’embolie comme cause de l’instabilité. À l’inverse, des signes nets de surcharge, surtout s’ils sont spécifiques, justifient une reperfusion urgente lorsque le scanner est impossible chez un patient à forte probabilité sans autre cause évidente.</p>
<div class="lab">Autres causes de choc</div><p>L’examen peut montrer une tamponnade, une dysfonction valvulaire aiguë, une dysfonction globale ou régionale du ventricule gauche, une dissection aortique ou une hypovolémie. Il peut aussi montrer un thrombus mobile dans les cavités droites, présent chez moins de 4 % des patients non sélectionnés et jusqu’à 18 % en soins intensifs. Ce thrombus confirme pratiquement l’embolie et s’associe à une mortalité précoce élevée.</p>
<div class="lab">Limites chez le patient stable</div><p>Chez le patient stable, l’échocardiographie n’est pas obligatoire au diagnostic. Sa valeur prédictive négative n’est que de 40 à 50 %, et des signes de surcharge droite peuvent venir d’une maladie cardiaque ou respiratoire préexistante. Chez 10 % des patients, elle montre des anomalies trompeuses, comme une dysfonction du ventricule gauche ou une valvulopathie.</p>
<div class="lab">Piège</div><p>Une akinésie de la paroi libre du ventricule droit peut aussi venir d’un infarctus du ventricule droit. L’absence de signe de surcharge de pression oriente alors vers la cause coronaire.</p></template>

<div class="lab">Ce que l’on cherche</div><p>L’électrocardiogramme cherche d’abord un diagnostic concurrent, surtout un syndrome coronarien aigu. Il cherche ensuite des signes de surcharge du ventricule droit et une arythmie.</p>
<div class="lab">Signes de surcharge droite</div><p>Selon l’ESC/ERS 2019, l’inversion des ondes T de V1–V4, l’aspect S1Q3T3 et le bloc de branche droit complet ou incomplet s’observent surtout dans les formes sévères. Dans les formes légères, la seule anomalie est souvent une tachycardie sinusale, présente chez 40 % des patients. Des arythmies auriculaires, surtout une fibrillation auriculaire, peuvent accompagner l’embolie.</p>
<div class="lab">Valeur</div><p>Aucun de ces signes n’est assez sensible ni assez spécifique pour confirmer ou exclure l’embolie. L’aspect S1Q3T3 est inconstant.</p>
<div class="lab">Piège</div><p>Une inversion des ondes T de V1–V4 peut faire conclure à tort à une ischémie antérieure. Le contexte, l’échocardiographie et la cinétique de la troponine aident à trancher.</p></template>
<template data-pop="i26-rx" data-title="Radiographie thoracique">
<div class="lab">Valeur</div><p>La radiographie thoracique est souvent anormale dans l’embolie, mais ses anomalies ne sont pas spécifiques. Elle ne montre pas le caillot (ESC/ERS 2019).</p>
<div class="lab">Utilité</div><p>Elle sert surtout à chercher une autre cause de dyspnée ou de douleur, comme un pneumothorax, une pneumonie ou un œdème pulmonaire. Elle précède la scintigraphie, dont elle aide l’interprétation : chez un patient dont la radiographie est normale, tout défaut de perfusion est considéré comme non concordant. Pendant la grossesse, une radiographie normale oriente vers la scintigraphie de perfusion ou le scanner, et une radiographie anormale vers le scanner.</p>
<div class="lab">Irradiation</div><p>Sa dose efficace est d’environ 0,1 millisievert, et la dose fœtale reste inférieure à 0,01 milligray.</p>
<div class="lab">Piège</div><p>Une radiographie normale n’exclut pas l’embolie ; une radiographie anormale n’exclut pas une embolie associée à une pneumonie.</p></template>
<template data-pop="i26-gaz" data-title="Gaz du sang artériel">
<div class="lab">Ce que l’examen mesure</div><p>Les gaz du sang mesurent la PaO₂, la PaCO₂, le pH et souvent le lactate. Ils quantifient l’insuffisance respiratoire et l’hypoperfusion ; ils ne constituent pas un test d’exclusion de l’embolie.</p>
<div class="lab">Résultats habituels</div><p>PIOPED II a analysé 48 patients sans maladie cardiopulmonaire préalable qui avaient un gaz du sang en air ambiant. Parmi eux, 63 % avaient une PaCO₂ inférieure ou égale à 35 mmHg, et 40 % un pH supérieur à 7,45. L’hyperventilation produit donc une alcalose respiratoire. Une PaO₂ d’au moins 80 mmHg existait chez 38 % d’entre eux, et un gradient alvéolo-artériel inférieur ou égal à 20 mmHg chez 35 %.</p>
<div class="lab">Lactate</div><p>Un lactate artériel d’au moins 2 mmol/L prédit les complications liées à l’embolie (ESC/ERS 2019).</p>
<div class="lab">Piège</div><p>Des gaz du sang normaux n’excluent pas l’embolie. Une hypoxémie très sévère et réfractaire fait chercher un shunt par foramen ovale perméable.</p></template>
<template data-pop="i26-oxy" data-title="Oxygène et ventilation">
<div class="lab">Indication</div><p>L’oxygène est indiqué lorsque la saturation artérielle est inférieure à 90 % (ESC/ERS 2019).</p>
<div class="lab">Moyens</div><p>En cas d’hypoxémie sévère, l’oxygénothérapie à haut débit par canule nasale ou la ventilation non invasive sont préférées. L’intubation ne se fait que si le patient ne tolère pas ou ne supporte plus la ventilation non invasive.</p>
<div class="lab">Pourquoi cette prudence</div><p>Le patient dont le ventricule droit défaille est souvent hypotendu, et il peut s’effondrer lors de l’induction anesthésique, de l’intubation et de la ventilation en pression positive. La pression positive intrathoracique réduit le retour veineux et aggrave le bas débit.</p>
<div class="lab">Règles si la ventilation mécanique est nécessaire</div><p>Le médecin applique la pression expiratoire positive avec prudence. Il utilise des volumes courants d’environ 6 mL/kg de poids maigre, pour garder une pression de plateau inférieure à 30 cm d’eau. Pour l’induction, il évite les agents anesthésiques les plus susceptibles de provoquer une hypotension.</p>
<div class="lab">Limite</div><p>L’hypoxémie ne se corrige pas complètement sans reperfusion pulmonaire, car sa cause principale est l’obstruction elle-même.</p></template>
<template data-pop="i26-vaso" data-title="Remplissage, vasopresseurs et inotropes">
<div class="lab">Remplissage</div><p>Si la pression veineuse centrale est basse, un remplissage modeste, de 500 mL au plus en 15 à 30 minutes, peut augmenter l’index cardiaque. Une veine cave inférieure petite ou collabable à l’échographie indique un volume bas. Dès que la pression veineuse centrale s’élève, le remplissage s’arrête, car il distend le ventricule droit et réduit le débit systémique.</p>
<div class="lab">Noradrénaline</div><p>La noradrénaline, de 0,2 à 1,0 µg/kg/min, améliore la pression systémique, l’interaction entre les ventricules et la perfusion coronaire, sans modifier la résistance vasculaire pulmonaire. Son usage se limite au patient en choc cardiogénique.</p>
<div class="lab">Dobutamine</div><p>La dobutamine, de 2 à 20 µg/kg/min, peut être envisagée chez le patient dont l’index cardiaque est bas et la pression normale. Elle peut toutefois aggraver le déséquilibre ventilation-perfusion en redistribuant le débit, et provoquer une hypotension si elle est donnée sans vasopresseur.</p>
<div class="lab">Autres traitements</div><p>Les vasodilatateurs intraveineux peuvent aggraver l’hypotension. Le monoxyde d’azote inhalé et le lévosimendan n’ont pas démontré de bénéfice clinique (ESC/ERS 2019).</p>
<div class="lab">Recommandation</div><p>L’ESC/ERS 2019 envisage la noradrénaline ou la dobutamine dans l’embolie à haut risque (classe IIa, niveau C), en parallèle de la reperfusion ou en l’attendant.</p></template>
<template data-pop="i26-acr" data-title="Arrêt cardiaque sur embolie">
<div class="lab">Reconnaissance</div><p>L’embolie fait partie des causes d’arrêt cardiaque à rythme non choquable, sur fond d’activité électrique sans pouls (ESC/ERS 2019).</p>
<div class="lab">Conduite</div><p>Le médecin applique les recommandations de réanimation avancée. La décision de traiter l’embolie doit être prise tôt, tant qu’une bonne évolution reste possible. La thrombolyse doit être envisagée. Une fois le thrombolytique administré, la réanimation se poursuit au moins 60 à 90 minutes avant d’y renoncer.</p>
<div class="lab">Schéma accéléré</div><p>Le schéma accéléré d’activateur tissulaire du plasminogène délivre 0,6 mg/kg en 15 minutes, sans dépasser 50 mg. Il n’est pas officiellement approuvé. Il est parfois utilisé dans l’instabilité extrême, comme l’arrêt cardiaque (ESC/ERS 2019, tableau 10). L’adrénaline est le vasopresseur de l’arrêt cardiaque.</p>
<div class="lab">Assistance circulatoire</div><p>L’assistance extracorporelle veino-artérielle peut être envisagée avec une embolectomie chirurgicale ou un traitement par cathéter en cas de collapsus réfractaire ou d’arrêt cardiaque (classe IIb, niveau C). Utilisée seule avec l’anticoagulation, elle reste controversée.</p></template>
<template data-pop="i26-hestia" data-title="Règle de Hestia">
<div class="lab">Principe</div><p>La règle de Hestia est une liste de onze questions posées au lit du patient. Si toutes les réponses sont négatives, le patient peut être traité à domicile ; une seule réponse positive impose l’hospitalisation. La règle intègre la gravité de l’embolie, les comorbidités et la faisabilité du traitement à domicile.</p>
<div class="lab">Les onze questions</div><p>Le patient est-il instable sur le plan hémodynamique ? Une thrombolyse ou une embolectomie est-elle nécessaire ? Existe-t-il un saignement actif ou un risque hémorragique élevé ? Faut-il plus de 24 heures d’oxygène pour maintenir la saturation au-dessus de 90 % ? L’embolie est-elle survenue sous traitement anticoagulant ? Une douleur sévère exige-t-elle des antalgiques intraveineux pendant plus de 24 heures ? Une raison médicale ou sociale, comme une infection, un cancer ou l’absence d’entourage, impose-t-elle plus de 24 heures d’hospitalisation ? La clairance de la créatinine est-elle inférieure à 30 mL/min ? Existe-t-il une insuffisance hépatique sévère ? La patiente est-elle enceinte ? Existe-t-il un antécédent documenté de thrombopénie induite par l’héparine ?</p>
<div class="lab">Précisions</div><p>L’instabilité comprend, à l’appréciation du médecin, une pression systolique inférieure à 100 mmHg avec une fréquence cardiaque supérieure à 100/min, ou une situation qui exige les soins intensifs. Le risque hémorragique élevé comprend une hémorragie digestive dans les 14 jours et un accident vasculaire cérébral de moins de quatre semaines. Il comprend aussi une opération de moins de deux semaines et un trouble de l’hémostase. Des plaquettes inférieures à 75 × 10⁹/L et une hypertension non contrôlée complètent la liste. La clairance se calcule par la formule de Cockcroft-Gault (essai HOME-PE, 2021).</p>
<div class="lab">Preuves</div><p>Dans l’étude Hestia, les 297 patients traités à domicile ont présenté 2,0 % de récidives thromboemboliques et 1,0 % de décès en trois mois. Dans l’essai HOME-PE, la règle de Hestia et le sPESI ont donné la même sécurité. Le critère composite à 30 jours touchait 3,8 % et 3,6 % des patients. Plus d’un tiers d’entre eux ont été traités à domicile. Selon l’ESC/ERS 2019, un dosage du NT-proBNP n’a pas montré de bénéfice supplémentaire chez les patients sélectionnés par la règle de Hestia, sans que l’étude puisse l’exclure.</p>
<div class="lab">Piège</div><p>La règle de Hestia n’évalue pas directement le ventricule droit. Avant une sortie dans les 24 à 48 heures, l’ESC/ERS 2019 juge prudent d’exclure une dysfonction du ventricule droit et un thrombus des cavités droites.</p>
<div class="lab">Exemple</div><p>La patiente du cas donne une réponse positive : son opération date de moins de deux semaines, ce qui correspond à un risque hémorragique élevé. Elle est donc hospitalisée.</p></template>
<template data-pop="i26-filtre" data-title="Filtre cave">
<div class="lab">Principe</div><p>Le filtre, posé par voie percutanée dans la veine cave inférieure, empêche mécaniquement les caillots veineux d’atteindre les poumons. La plupart des filtres actuels peuvent être retirés après quelques semaines ou quelques mois, ou laissés en place au long cours.</p>
<div class="lab">Indications selon l’ESC/ERS 2019</div><p>Le filtre doit être envisagé en cas d’embolie aiguë avec contre-indication absolue à l’anticoagulation, et en cas de récidive sous anticoagulation efficace (classe IIa, niveau C). Son usage de routine n’est pas recommandé (classe III, niveau A).</p>
<div class="lab">Preuves</div><p>Dans un premier essai randomisé, un filtre permanent a réduit les récidives d’embolie mais augmenté les thromboses veineuses profondes, sans modifier la mortalité. Dans un second essai, chez 399 patients anticoagulés, un filtre retirable n’a pas réduit les récidives. Une méta-analyse de 11 études a évalué le filtre. Il réduisait d’environ 50 % l’incidence de l’embolie, mais augmentait d’environ 70 % le risque de thrombose veineuse profonde. Il n’avait pas d’effet sur la mortalité.</p>
<div class="lab">Complications</div><p>Les complications sont fréquentes : dans une revue de 9 002 procédures, le filtre avait pénétré la paroi veineuse dans 19 % des cas. Elles comprennent aussi la fracture ou la migration du filtre et la thrombose de la veine cave.</p>
<div class="lab">Conséquence pratique</div><p>Le filtre ne remplace pas l’anticoagulation : celle-ci débute dès qu’elle devient sûre (ESC/ERS 2019).</p></template>
<template data-pop="i26-cteph" data-title="Hypertension pulmonaire thromboembolique chronique">
<div class="lab">Définition</div><p>Cette maladie résulte de l’obstruction persistante des artères pulmonaires par des caillots organisés, transformés en tissu fibreux. L’obstruction redistribue le débit et entraîne un remodelage secondaire de la microcirculation, qui augmente progressivement la résistance pulmonaire (ESC/ERS 2019).</p>
<div class="lab">Fréquence</div><p>L’incidence cumulée rapportée varie de 0,1 à 9,1 % dans les deux ans suivant une embolie symptomatique. En Suisse, Coquoz et collaborateurs ont suivi de façon prospective 508 patients dans 11 centres, entre 2009 et 2016. Ils ont mesuré une incidence de 3,7 pour 1 000 années-patients. L’incidence cumulée atteignait 0,79 % à deux ans (publication de 2018).</p>
<div class="lab">Facteurs de risque</div><p>L’ESC/ERS 2019 cite des éléments de l’épisode aigu. Il s’agit d’épisodes antérieurs et de gros caillots au scanner. Il s’agit aussi de signes échographiques d’hypertension pulmonaire ou de dysfonction droite, et de signes scanographiques de maladie chronique préexistante. Elle cite aussi des maladies associées. Les premières sont une dérivation ventriculo-atriale, un cathéter veineux ou un stimulateur infectés et une splénectomie. D’autres touchent la coagulation : syndrome des antiphospholipides, facteur VIII élevé et groupe sanguin non O. S’y ajoutent l’hypothyroïdie substituée, le cancer et le syndrome myéloprolifératif. La maladie inflammatoire de l’intestin et l’ostéomyélite chronique complètent la liste.</p>
<div class="lab">Diagnostic</div><p>Le diagnostic se pose après au moins trois mois d’anticoagulation efficace, pour le distinguer de l’embolie aiguë. La scintigraphie de ventilation et de perfusion est l’examen de première intention : sa sensibilité atteint 96 à 97 % et sa spécificité 90 à 95 %. Le cathétérisme cardiaque droit confirme l’hypertension pulmonaire, et l’imagerie des artères précise les lésions.</p>
<div class="lab">Traitement</div><p>L’endartériectomie pulmonaire chirurgicale est le traitement de choix des formes opérables ; sa mortalité hospitalière atteignait 4,7 % selon l’ESC/ERS 2019. L’angioplastie pulmonaire par ballonnet traite les formes inopérables, et l’ESC/ERS 2019 citait le riociguat comme seul médicament approuvé dans ces formes. Une anticoagulation à vie est recommandée. L’ESC/ERS 2019 la prévoyait par antagoniste de la vitamine K, faute de données sur les anticoagulants oraux directs à cette date.</p>
<div class="lab">Conséquence pratique</div><p>Le dépistage se fonde sur les symptômes : une dyspnée persistante après trois mois mène à l’échocardiographie, puis à la scintigraphie. Des défauts de perfusion non concordants imposent d’adresser le patient à un centre expert (ESC/ERS 2019, classe I, niveau C).</p></template>
<template data-pop="i26-postpe" data-title="Limitation fonctionnelle après embolie">
<div class="lab">Fréquence</div><p>Une dyspnée persistante ou croissante et une capacité physique réduite sont fréquentes de six mois à trois ans après l’embolie. Selon les études citées par l’ESC/ERS 2019, 20 à 75 % des patients jugent leur état de santé moins bon à six mois qu’au moment du diagnostic.</p>
<div class="lab">Mesure objective</div><p>Dans une cohorte canadienne de 100 patients suivis un an, 47 % avaient une consommation maximale d’oxygène inférieure à 80 % de la valeur prédite. Cette limitation s’accompagnait d’une qualité de vie et d’une distance de marche en six minutes plus faibles, alors que la fonction respiratoire et l’échocardiographie restaient le plus souvent normales.</p>
<div class="lab">Facteurs prédictifs</div><p>Plusieurs éléments prédisent une dyspnée d’effort persistante. Le terrain compte : âge avancé, comorbidité cardiaque ou pulmonaire, indice de masse corporelle élevé et tabagisme. L’épisode aigu compte aussi : pression pulmonaire élevée et dysfonction droite au diagnostic. Une obstruction résiduelle à la sortie complète la liste.</p>
<div class="lab">Cause principale</div><p>Selon l’ESC/ERS 2019, le déconditionnement musculaire, surtout en présence d’un excès de poids et de comorbidités, explique la plupart de ces limitations. Elles ne sont que rarement dues à de gros caillots résiduels ou à une hypertension pulmonaire.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin interroge systématiquement la dyspnée et la tolérance à l’effort. Il écarte une hypertension pulmonaire thromboembolique chronique par une démarche par étapes, puis il propose une réadaptation, une activité physique progressive et le traitement des comorbidités. L’épreuve d’effort cardiopulmonaire aide à identifier les candidats à la réadaptation.</p></template>
<template data-pop="i26-grossesse-img" data-title="Imagerie et irradiation pendant la grossesse">
<div class="lab">Doses reçues</div><p>Le tableau 12 de l’ESC/ERS 2019 estime les doses absorbées par le fœtus et par le sein maternel. Le tableau suivant les reprend, en milligrays.</p>
<table><tr><th>Examen</th><th>Dose au fœtus</th><th>Dose au sein maternel</th></tr><tr><td>Radiographie thoracique</td><td>moins de 0,01</td><td>moins de 0,1</td></tr><tr><td>Scintigraphie de perfusion à faible activité (40 mégabecquerels)</td><td>0,02 à 0,20</td><td>0,16 à 0,5</td></tr><tr><td>Scintigraphie de perfusion à forte activité (200 mégabecquerels)</td><td>0,20 à 0,60</td><td>1,2</td></tr><tr><td>Scintigraphie de ventilation</td><td>0,10 à 0,30</td><td>moins de 0,01</td></tr><tr><td>Angiographie tomodensitométrique</td><td>0,05 à 0,5</td><td>3 à 10</td></tr></table>
<p>Le lecteur compare d’abord les deux colonnes. Les doses fœtales de la scintigraphie et du scanner sont du même ordre, et toutes restent faibles. Le scanner irradie en revanche beaucoup plus le sein que la scintigraphie.</p>
<div class="lab">Interprétation</div><p>Pour la scintigraphie comme pour le scanner, les doses fœtales restent très inférieures au seuil associé aux complications fœtales, situé entre 50 et 100 millisieverts. Les techniques modernes de scanner peuvent réduire la dose au sein à 3 à 4 milligrays. L’augmentation du risque de cancer maternel sur la vie entière devient alors négligeable, d’un facteur de 1,0003 à 1,0007.</p>
<div class="lab">Examens à éviter</div><p>L’angiographie pulmonaire conventionnelle expose le fœtus à 2,2 à 3,7 millisieverts et doit être évitée. L’angiographie par résonance magnétique n’est pas recommandée, car les effets à long terme du gadolinium sur le fœtus sont inconnus.</p>
<div class="lab">Conséquence pratique</div><p>Le choix entre scintigraphie et scanner dépend surtout de la radiographie et de l’expertise locale. Les résultats non concluants touchent 4 à 33 % des examens, surtout en fin de grossesse. La crainte du cancer maternel ne justifie pas de renoncer au scanner.</p></template>
<template data-pop="i26-afe" data-title="Embolie amniotique">
<div class="lab">Définition</div><p>L’embolie amniotique est une complication rare de la grossesse ou des suites immédiates de l’accouchement. Elle se manifeste par une détérioration cardiovasculaire ou respiratoire brutale et inexpliquée, souvent accompagnée d’une coagulation intravasculaire disséminée (ESC/ERS 2019).</p>
<div class="lab">Fréquence et gravité</div><p>Son incidence est d’environ 2 à 7 pour 100 000 maternités, et sa mortalité de 0,5 à 6 décès pour 100 000 accouchements. Sa létalité atteignait 13 % dans une étude californienne de plus de 3,5 millions d’accouchements et 19 % dans une étude britannique prospective. Elle reste l’une des principales causes de mort maternelle directe dans les pays à revenu élevé.</p>
<div class="lab">Facteurs de risque</div><p>Les facteurs évoqués comprennent une maladie cardiaque, cérébrovasculaire ou rénale préexistante, un placenta praevia, un hydramnios, une mort fœtale, une chorioamniotite, une hypertension de la grossesse, un accouchement instrumental et une césarienne.</p>
<div class="lab">Diagnostic et conduite</div><p>Le diagnostic est clinique et se pose par exclusion. La prise en charge repose sur une réanimation immédiate de haute qualité et sur le traitement rapide de l’hémorragie et de la coagulopathie. L’ESC/ERS 2019 propose d’évoquer ce diagnostic devant un arrêt cardiaque, une hypotension soutenue ou une détérioration respiratoire inexpliqués, surtout avec une coagulation intravasculaire disséminée (classe IIa, niveau C).</p></template>
<template data-pop="i26-cancer-tt" data-title="Anticoagulation du patient cancéreux">
<div class="lab">Le problème</div><p>Le patient cancéreux récidive davantage et saigne davantage. Sous héparine de bas poids moléculaire, la récidive atteint encore 7 à 9 %, contre 1,5 à 3 % chez le patient non cancéreux traité de façon conventionnelle (ESC/ERS 2019).</p>
<div class="lab">Héparine de bas poids moléculaire</div><p>Par rapport aux antagonistes de la vitamine K, les héparines de bas poids moléculaire réduisent la récidive d’environ 40 %, avec un risque d’hémorragie majeure comparable. Elles sont devenues le traitement de référence, au prix d’injections quotidiennes et d’un coût élevé.</p>
<div class="lab">Anticoagulants oraux directs</div><p>Dans un essai de 1 050 patients, l’édoxaban, débuté après cinq jours d’héparine, était non inférieur à la daltéparine pour le critère combinant récidive et hémorragie majeure à 12 mois. Il causait toutefois plus d’hémorragies majeures (6,9 % contre 4,0 %), surtout chez les patients porteurs d’un cancer digestif. Dans un essai de 406 patients, le rivaroxaban réduisait la récidive par rapport à la daltéparine. Il causait plus d’hémorragies majeures (6 % contre 4 %) et d’hémorragies non majeures cliniquement pertinentes (13 % contre 4 %).</p>
<div class="lab">Recommandations de l’ESC/ERS 2019</div><p>L’héparine de bas poids moléculaire ajustée au poids doit être envisagée pendant les six premiers mois (classe IIa, niveau A). L’édoxaban (classe IIa, niveau B) et le rivaroxaban (classe IIa, niveau C) en sont des alternatives, sauf en cas de cancer digestif. L’anticoagulation se poursuit ensuite pour une durée indéfinie ou jusqu’à la guérison du cancer (classe IIa, niveau B).</p>
<div class="lab">Situations particulières</div><p>L’héparine de bas poids moléculaire reste préférable en cas de cancer digestif, de troubles de la prise ou de l’absorption orale et d’insuffisance rénale sévère. Aucune donnée ne soutient l’ajout d’un filtre cave à l’anticoagulation chez le patient cancéreux. Le filtre se discute seulement si l’anticoagulation est impossible.</p></template>
<template data-pop="i26-sapl" data-title="Syndrome des antiphospholipides">
<div class="lab">Définition</div><p>Le syndrome des antiphospholipides associe des thromboses ou une morbidité obstétricale à la présence persistante d’anticorps antiphospholipides : anticoagulant lupique, anticorps anticardiolipine ou anticorps anti-bêta-2-glycoprotéine I.</p>
<div class="lab">Pourquoi il change le traitement</div><p>Un essai randomisé ouvert a inclus des patients triple positifs. Le rivaroxaban y a causé davantage d’événements thromboemboliques et d’hémorragies majeures que la warfarine. Le rapport de risques instantanés valait 6,7 pour le critère composite. Les anticoagulants oraux directs ne remplacent donc pas les antagonistes de la vitamine K dans ce syndrome (ESC/ERS 2019).</p>
<div class="lab">Recommandations</div><p>Un antagoniste de la vitamine K est recommandé pour une durée indéfinie (ESC/ERS 2019, classe I, niveau B). Les anticoagulants oraux directs n’y sont pas recommandés (classe III, niveau C). Les informations professionnelles suisses de Pradaxa, d’Eliquis et de Xarelto ne les recommandent pas non plus dans ce syndrome.</p>
<div class="lab">Qui tester</div><p>La recherche des anticorps se discute chez le patient jeune dont l’embolie survient sans facteur identifiable, surtout en cas d’antécédents familiaux. Elle se discute aussi devant des thromboses artérielles ou une morbidité obstétricale.</p></template>
<template data-pop="i26-cg" data-title="Clairance de la créatinine selon Cockcroft-Gault">
<div class="lab">Formule</div><p>Avec une créatinine exprimée en µmol/L, la clairance en mL/min vaut (140 − âge) × poids en kg × k / créatinine. Le coefficient k vaut environ 1,23 chez l’homme et 1,04 chez la femme. Il découle de la formule originale, qui retranchait 15 % chez la femme (Cockcroft et Gault, 1976).</p>
<div class="lab">Exemple</div><p>La patiente du cas, 68 ans, 72 kg, créatinine de 88 µmol/L, a une clairance de (140 − 68) × 72 × 1,04 / 88, soit environ 61 mL/min. Aucune adaptation de la dose d’apixaban n’est nécessaire.</p>
<div class="lab">Pourquoi cette formule</div><p>L’information professionnelle de Pradaxa prescrit cette formule, et elle a été employée pendant le développement de l’édoxaban. Elle intègre le poids réel, déterminant chez le sujet âgé de faible poids, chez qui la créatinine peut rester normale malgré une fonction rénale réduite.</p>
<div class="lab">Limites</div><p>La formule surestime la fonction rénale chez le patient obèse, car elle utilise le poids total. Elle ne s’applique pas lorsque la créatinine n’est pas stable, par exemple en insuffisance rénale aiguë.</p>
<div class="lab">Conséquence pratique</div><p>Les seuils rénaux des anticoagulants oraux directs s’expriment en clairance de la créatinine : 15, 30 et 50 mL/min selon la molécule. Le médecin calcule donc cette clairance avant toute prescription.</p></template>
