<template data-pop="g63-croix" data-title="Système croix-astérisque : principe du double code">
<div class="lab">Principe</div><p>Dans la classification internationale des maladies, dixième révision, version allemande 2024, la maladie de base porte un code marqué d’une croix (†) et la manifestation d’organe un code marqué d’un astérisque (*). La catégorie G63.-* désigne la polyneuropathie, manifestation d’une maladie classée ailleurs. Elle ne s’emploie jamais seule : elle exige de nommer la maladie de base.</p>
<div class="lab">Application</div><p>Pour une polyneuropathie diabétique, le code primaire est un code de diabète sucré (E10 à E14, quatrième position .4) et le code de la manifestation est G63.2*. Pour la neuropathie urémique, le code primaire relève de N18.-† et la manifestation de G63.8*.</p>
<div class="lab">Limite</div><p>Les règles exactes de double codage de chaque entité n’ont pas été lues. La neuropathie médicamenteuse, dont celle du traitement anticancéreux, se code G62.0 et la neuropathie alcoolique G62.1, hors de la catégorie G63.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener">Institut fédéral allemand des médicaments, CIM-10-GM 2024, bloc G60–G64</a> ; libellés français de l’Office fédéral de la statistique (registre du projet, consulté le 15 octobre 2026).</p></template>
<template data-pop="g63-petitesfibres" data-title="Neuropathie des petites fibres : conduction normale et biopsie cutanée">
<div class="lab">Définition</div><p>La neuropathie des petites fibres est une polyneuropathie dont la conduction nerveuse mesurée à la neurographie est normale (Feldman et coll., 2019). Elle se manifeste par une brûlure distale, nocturne, et par une perte de la piqûre et du froid.</p>
<div class="lab">Diagnostic</div><p>L’étalon est la biopsie cutanée avec mesure de la densité des fibres intra-épidermiques ; les tests sensitifs quantitatifs la complètent (Sommer et coll., 2018). Une neurographie normale ne l’exclut donc pas.</p>
<div class="lab">Données</div><p>Dans une cohorte de 921 patients suivis à Maastricht, 53 % n’avaient aucune cause et 47 % avaient au moins une affection associée. Parmi les affections associées figurent le syndrome de Sjögren (1,3 %), la sarcoïdose (3,0 %) et la maladie cœliaque (0,5 %). Le bortézomib touche surtout les petites fibres.</p>
<div class="lab">Limite</div><p>La cohorte est tertiaire, avec un biais de recrutement, et la carence en vitamine B12 y est définie par le seul taux sérique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5814938/" target="_blank" rel="noopener">de Greef et coll., European Journal of Neurology, 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7096070/" target="_blank" rel="noopener">Feldman et coll., Nature Reviews Disease Primers, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., Deutsches Ärzteblatt International, 2018</a>.</p></template>
<template data-pop="g63-induite" data-title="Neuropathie diabétique aiguë douloureuse et neuropathie induite par le traitement">
<div class="lab">Définition</div><p>La neuropathie diabétique aiguë douloureuse est une neuropathie aiguë des petites fibres, d’évolution rémittente. Une série suisse du Centre hospitalier universitaire vaudois et des Hôpitaux universitaires de Genève en distingue deux sous-types : la neuropathie induite par le traitement et la cachexie neuropathique diabétique.</p>
<div class="lab">Particularité</div><p>Elle survient de façon paradoxale après une correction rapide de la glycémie, avec une douleur intense. La récupération est possible.</p>
<div class="lab">Données</div><p>Chez 4 patients, l’hémoglobine glyquée moyenne est passée de 14,2 % à 7,0 % en 4,5 mois (durée moyenne) ; la résolution est survenue en 12,7 mois en moyenne chez 3 patients.</p>
<div class="lab">Limite</div><p>Série de 4 cas, lue en résumé seulement : elle illustre le risque d’un contrôle trop rapide sans en chiffrer la fréquence.</p>
<p class="src">Références : <a href="https://doi.org/10.4414/smw.2015.14131" target="_blank" rel="noopener">Tran et coll., Swiss Medical Weekly, 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7096070/" target="_blank" rel="noopener">Feldman et coll., 2019</a>.</p></template>
<template data-pop="g63-dyingback" data-title="Axonopathie dépendante de la longueur : dégénérescence à partir de l’extrémité">
<div class="lab">Principe</div><p>Les axones sensitifs les plus longs dégénèrent en premier, à leur extrémité. L’atteinte débute aux pieds, forme une distribution en chaussettes, puis en gants.</p>
<div class="lab">Conséquence clinique</div><p>Les réflexes achilléens disparaissent tôt ; la faiblesse des pieds est tardive. Chez le diabétique, les petites fibres sont touchées avant les grosses : brûlure et perte de la piqûre et du froid, puis perte de la vibration et de la proprioception.</p>
<div class="lab">Contraste</div><p>Dans la neuronopathie sensitive paranéoplasique, le corps cellulaire du neurone est atteint et le déficit ne dépend pas de la longueur. Cette différence de distribution est un critère pratique pour distinguer les deux situations.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7096070/" target="_blank" rel="noopener">Feldman et coll., Nature Reviews Disease Primers, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8237398/" target="_blank" rel="noopener">Graus et coll., 2021</a>.</p></template>
<template data-pop="g63-diab-meca" data-title="Voies métaboliques délétères du diabète pour le nerf">
<div class="lab">Voies</div><p>L’hyperglycémie active les voies des polyols et des hexosamines, ce qui produit des espèces réactives de l’oxygène et de l’inflammation. Les produits de glycation avancée agissent par le récepteur RAGE.</p>
<div class="lab">Mitochondrie</div><p>La surcharge en substrats entraîne une défaillance mitochondriale : baisse de la production d’énergie et formation d’acylcarnitines, toxiques pour les cellules de Schwann et les neurones.</p>
<div class="lab">Microangiopathie et soutien du nerf</div><p>La microangiopathie associe un épaississement de la membrane basale à une vasodilatation épineurale altérée. La perte de soutien neurotrophique et l’insulinorésistance neuronale complètent le tableau.</p>
<div class="lab">Conséquence thérapeutique</div><p>L’insulinorésistance neuronale pourrait expliquer en partie le moindre bénéfice du contrôle glycémique dans le type 2 ; c’est une hypothèse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7096070/" target="_blank" rel="noopener">Feldman et coll., Diabetic neuropathy, Nature Reviews Disease Primers, 2019</a>, consulté le 15 octobre 2026.</p></template>
<template data-pop="g63-alcool" data-title="Neuropathie alcoolique : mécanismes, distinction de Koike et pronostic">
<div class="lab">Mécanismes</div><p>Malnutrition avec carence en vitamines B, toxicité directe de l’éthanol, rôle de l’acétaldéhyde (variant ALDH2*2) et stress oxydatif. Le mécanisme n’est pas résolu.</p>
<div class="lab">Distinction de Koike</div><p>La neuropathie alcoolique proprement dite est lente, sensitive et touche les petites fibres. La neuropathie par carence en thiamine est souvent rapide (moins d’un mois dans 56 % des cas), motrice et touche les grosses fibres. La distinction oriente le diagnostic.</p>
<div class="lab">Risque</div><p>La dose cumulée sur la vie entière compte ; plus de 100 g par jour pendant plusieurs années est probablement pathogène. Une consommation continue ou fréquente s’associe à environ 30 % de neuropathie (29,6 % et 29,9 %) contre 11,3 % chez les buveurs épisodiques (Wetterling, cité par Julian et coll., 2019).</p>
<div class="lab">Évolution</div><p>L’abstinence et la correction nutritionnelle permettent une régression sur des mois à des années. Les vitamines B, dont la thiamine, constituent la meilleure preuve disponible, mais elle reste rare. L’amélioration sensitive survient en jours, la motrice en semaines à mois, jusqu’à deux ans dans les formes sévères ; des séquelles sont possibles.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6851213/" target="_blank" rel="noopener">Julian et coll., Journal of Neurology, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a>.</p></template>
<template data-pop="g63-b12" data-title="Vitamine B12 : besoin, réserves, protoxyde d’azote et clinique">
<div class="lab">Besoin et réserves</div><p>Le besoin journalier est d’environ 1 à 2 µg ; la réserve totale est de 2 à 5 mg, dont environ 1 mg dans le foie. Une carence d’apport met donc des années à apparaître.</p>
<div class="lab">Protoxyde d’azote</div><p>Une exposition prolongée peut induire une carence fonctionnelle avec atteinte neurologique grave malgré des réserves normales.</p>
<div class="lab">Clinique</div><p>Paresthésies subaiguës des pieds, ataxie sensitive, parésie rare ; myéloneuropathie combinée avec réflexes vifs et signes pyramidaux. Environ 50 % des patients n’ont pas d’anémie macrocytaire.</p>
<div class="lab">Conduite</div><p>Substituer rapidement. Sous metformine, l’information professionnelle suisse de Glucophage recommande de contrôler la vitamine B12 régulièrement, par exemple chaque année, surtout en cas de neuropathie. Les troubles de la marche installés depuis plus de 2 ans ne sont pas toujours réversibles.</p>
<p class="src">Références : information professionnelle suisse Vitarubine Dépôt, Streuli Pharma AG, état de juillet 2025, lue via AmiKo, consultée le 15 octobre 2026 ; information professionnelle suisse Glucophage, Merck (Schweiz) AG, état d’octobre 2025, lue via AmiKo, consultée le 16 octobre 2026 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a>.</p></template>
<template data-pop="g63-uremie" data-title="Neuropathie urémique : fréquence, mécanisme et traitement">
<div class="lab">Fréquence</div><p>Elle atteint environ 90 % des dialysés et jusqu’à 70 % des patients non encore dialysés dans les cohortes récentes. La dysautonomie touche plus de la moitié des hémodialysés.</p>
<div class="lab">Mécanisme</div><p>Le ralentissement de la conduction est diffus, sensitif et moteur ; il est interprété comme un effet toxique systémique. Aucune toxine urémique n’est formellement démontrée. L’hyperkaliémie altère la fonction nerveuse de façon dose-dépendante et réversible.</p>
<div class="lab">Traitement</div><p>La transplantation rénale est considérée comme le traitement le plus efficace ; l’hémodiafiltration pourrait améliorer la fonction nerveuse ; la restriction potassique est une piste.</p>
<div class="lab">Limite</div><p>La revue ne donne pas de seuils posologiques rénaux chiffrés : les doses des médicaments suivent leurs monographies.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5102165/" target="_blank" rel="noopener">Arnold et coll., Neurological complications in chronic kidney disease, JRSM Cardiovascular Disease, 2016</a>, consultée le 15 octobre 2026.</p></template>
<template data-pop="g63-neuronopathie" data-title="Neuronopathie sensitive paranéoplasique : atteinte du ganglion rachidien dorsal">
<div class="lab">Définition</div><p>La neuronopathie sensitive est l’atteinte des neurones des ganglions rachidiens dorsaux. Le déficit sensitif ne dépend pas de la longueur des nerfs.</p>
<div class="lab">Anticorps et risque</div><p>Les anticorps « à haut risque » s’associent à un cancer dans plus de 70 % des cas ; l’anti-Hu s’associe à un cancer bronchique à petites cellules dans plus de 85 %. Graus et coll. citent aussi CV2/CRMP5 et l’amphiphysine, avec le cancer bronchique à petites cellules et le cancer du sein.</p>
<div class="lab">Règle de prudence</div><p>Un syndrome de Guillain-Barré ou une polyradiculoneuropathie inflammatoire démyélinisante chronique chez un patient cancéreux n’est pas paranéoplasique sans anticorps à haut risque.</p>
<div class="lab">Limite</div><p>Les tableaux 1 et 2 de la publication de 2021 (images) et les derniers 28 % du texte n’ont pas été lus.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8237398/" target="_blank" rel="noopener">Graus et coll., Neurology Neuroimmunology and Neuroinflammation, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a>.</p></template>
<template data-pop="g63-chimio" data-title="Neuropathie du traitement anticancéreux : dose, coasting et limites">
<div class="lab">Fréquence et début</div><p>La prévalence est souvent citée entre 30 et 40 %, très variable selon le produit. Le début est sensitif, dans les deux premiers mois.</p>
<div class="lab">Oxaliplatine</div><p>La neurotoxicité aiguë est réversible en 2 à 3 jours dans 60 à 80 % des cas ; une atteinte persistante est rapportée chez 73 % des patients après un traitement prolongé.</p>
<div class="lab">Coasting</div><p>Le terme décrit l’aggravation après l’arrêt du traitement, observée avec les platines et plus rarement avec la vincristine. La toxicité dépend de la dose unitaire, de la dose cumulée et de la durée ; environ 40 % des patients gardent une douleur chronique.</p>
<div class="lab">Limite</div><p>La recommandation ESMO-EONS-EANO de 2020 (métadonnées seules lues) ne permet aucune consigne de prévention ou de traitement dans ce cours. Cette neuropathie médicamenteuse se code G62.0, avec un code de substance, et non G63.1 (CIM-10-GM 2024).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a> ; <a href="https://doi.org/10.1016/j.annonc.2020.07.003" target="_blank" rel="noopener">Jordan et coll., recommandation ESMO-EONS-EANO, Annals of Oncology, 2020 (non lue)</a>.</p></template>
<template data-pop="g63-ttr" data-title="Amylose héréditaire à transthyrétine : signaux d’alerte, diagnostic et suivi">
<div class="lab">Clinique</div><p>Polyneuropathie axonale progressive dépendante de la longueur, qui touche d’abord la thermo-algésie. Les signaux d’alerte sont une dysautonomie sans diabète (hypotension orthostatique, diarrhée ou constipation, dysfonction érectile), une perte de poids importante, un syndrome du canal carpien, des troubles conductifs cardiaques et des syncopes. Aucun antécédent familial n’est retrouvé dans plus de la moitié des formes tardives non endémiques.</p>
<div class="lab">Diagnostic</div><p>Biopsie (graisse abdominale, rectum, nerf sural, glandes salivaires labiales ; rouge Congo, biréfringence vert pomme, immunohistochimie) et génotypage de la transthyrétine : les deux sont requis.</p>
<div class="lab">Prise en charge et suivi</div><p>Tafamidis au stade I ; transplantation hépatique historique ; suivi pluridisciplinaire (neurologue, cardiologue, ophtalmologue), génétique familiale. Contrôle à 3 mois, bilan pluridisciplinaire à 6 et 12 mois, puis au moins deux fois par an.</p>
<div class="lab">Limite</div><p>Consensus de 2016, dépassé pour les thérapies actuelles ; le statut suisse n’a pas été vérifié.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4739312/" target="_blank" rel="noopener">Adams et coll., premier consensus européen sur l’amylose à transthyrétine, Current Opinion in Neurology, 2016</a>, consulté le 15 octobre 2026.</p></template>
<template data-pop="g63-lyme" data-title="Neuroborréliose de Lyme : définition, critères et limites">
<div class="lab">Définition</div><p>La neuroborréliose est définie par des symptômes neurologiques, une pléiocytose du liquide cérébrospinal et des anticorps intrathécaux anti-Borrelia. Elle est dite définie si les trois critères sont réunis, possible si deux critères sur trois le sont.</p>
<div class="lab">Place dans G63.0*</div><p>La maladie de Lyme figure parmi les maladies infectieuses citées comme maladie de base de G63.0*.</p>
<div class="lab">Limite</div><p>La recommandation européenne de l’EFNS n’a été lue qu’en résumé et ne détaille pas la polyneuropathie associée à l’acrodermatite. Aucune source clinique n’a été lue pour la diphtérie, la lèpre, la syphilis, le zona ou l’infection par le virus de l’immunodéficience humaine.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1468-1331.2009.02862.x" target="_blank" rel="noopener">Mygland et coll., recommandation de l’EFNS sur la neuroborréliose européenne, European Journal of Neurology, 2010</a> (résumé).</p></template>
<template data-pop="g63-atcd" data-title="Médicaments et toxiques à rechercher : liste et justification">
<div class="lab">Anamnèse</div><p>L’histoire porte sur les antécédents personnels, la revue des systèmes, l’exposition professionnelle, les habitudes sociales et les antécédents familiaux.</p>
<div class="lab">Médicaments</div><p>Métronidazole, nitrofurantoïne, quinolones, thalidomide, tacrolimus, colchicine, amiodarone, lithium, disulfirame, pyridoxine, phénytoïne. À ces produits s’ajoutent les traitements anticancéreux (platines, vinca-alcaloïdes, taxanes, inhibiteurs du protéasome, anticorps, inhibiteurs de points de contrôle).</p>
<div class="lab">Toxiques</div><p>Arsenic, plomb, mercure, thallium, solvants, acrylamide, sulfure de carbone. Pour les métaux lourds, l’éviction est associée à des chélateurs et à la diurèse forcée.</p>
<div class="lab">Justification</div><p>L’éviction d’un produit neurotoxique est parfois le seul traitement efficace de la neuropathie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., Polyneuropathies, Deutsches Ärzteblatt International, 2018</a>, consulté le 15 octobre 2026.</p></template>
<template data-pop="g63-signes" data-title="Signe clé de la polyneuropathie : aréflexie distale et baisse de la pallesthésie">
<div class="lab">Définition</div><p>L’association d’une aréflexie distale et d’une baisse de la perception vibratoire ou de la piqûre est décrite comme sensible et spécifique de la polyneuropathie.</p>
<div class="lab">Application</div><p>Les réflexes achilléens, la pallesthésie (diapason) et la piqûre sont examinés aux deux pieds. Les symptômes sensitifs, moteurs et autonomiques sont recherchés dans le même temps.</p>
<div class="lab">Limite</div><p>La revue ne chiffre pas la sensibilité et la spécificité du signe. L’aréflexie achilléenne isolée est moins discriminante : dans une cohorte viennoise de 2022 diabétiques, elle manquait chez 68,6 % des patients dont la vibration était anormale, mais aussi chez 24,8 % de ceux dont la vibration était normale (Kästenbauer et coll., 2004). Une neuropathie des petites fibres peut laisser réflexes et pallesthésie normaux.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5832891/" target="_blank" rel="noopener">Sommer et coll., 2018</a> ; <a href="https://doi.org/10.1111/j.1464-5491.2004.01205.x" target="_blank" rel="noopener">Kästenbauer et coll., Diabetic Medicine, 2004</a> (résumé).</p></template>
<template data-pop="g63-mono" data-title="Monofilament de 10 g : technique et lecture">
<div class="lab">Technique</div><p>Le monofilament est d’abord démontré sur l’avant-bras. Le patient a les yeux fermés. Le filament est appliqué jusqu’à sa flexion, pendant environ une seconde, sur quatre sites prédéfinis non calleux de chaque pied.</p>
<div class="lab">Lecture</div><p>Quatre sites sur quatre identifiés : sensibilité protectrice suffisante. L’incapacité de sentir le filament en un site ou plus est associée à une neuropathie des grosses fibres. Sensibilité de 65 à 90 % et spécificité de 35 à 85 % pour le risque d’ulcère.</p>
<div class="lab">Piège</div><p>Une callosité fausse la perception ; les sites sont donc non calleux. Le guide suisse de 2023 définit « pas de neuropathie » par un monofilament 4/4 et une pallesthésie supérieure à 4/8.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/Zusatzinfo_Checkliste_Fuss-Management_16-06-02_D_def.pdf" target="_blank" rel="noopener">Société suisse d’endocrinologie et de diabétologie, informations complémentaires du test de risque, 2016</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare, guide pratique, 2023</a>.</p></template>
<template data-pop="g63-diapason" data-title="Diapason gradué de Rydel-Seiffer : technique et lecture">
<div class="lab">Technique</div><p>Le diapason de 128 Hz (ou de 64 Hz) est démontré d’abord au poignet, puis appliqué sur l’articulation métatarso-phalangienne médiale de l’hallux. La valeur lue sur la graduation est notée sur 8.</p>
<div class="lab">Lecture</div><p>La valeur normale dépend de l’âge ; en dépistage, une valeur d’au moins 5/8 est retenue. Une valeur de 4/8 ou moins est pathologique.</p>
<div class="lab">Limite</div><p>Le diapason est moins prédictif de l’ulcère que le monofilament ; il le complète sans le remplacer.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/Fuss-Managements_bei_DM2_2013.pdf" target="_blank" rel="noopener">Société suisse d’endocrinologie et de diabétologie, QualiCCare, 2013</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/Zusatzinfo_Checkliste_Fuss-Management_16-06-02_D_def.pdf" target="_blank" rel="noopener">version de 2016</a>.</p></template>
<template data-pop="g63-pied" data-title="Échelle de risque du pied diabétique : catégories et fréquence des contrôles">
<p>Le tableau reprend la classification du groupe international de travail sur le pied diabétique, telle que la Société suisse d’endocrinologie et de diabétologie l’applique en soins de premier recours.</p>
<table class="t"><thead><tr><th>Catégorie</th><th>Définition</th><th>Contrôles</th></tr></thead><tbody><tr><td>0</td><td>Sans polyneuropathie, sans artériopathie, sans déformation</td><td>Une fois par an</td></tr><tr><td>1</td><td>Polyneuropathie sans artériopathie ni déformation</td><td>Au moins deux fois par an, soins protecteurs, chaussures adaptées</td></tr><tr><td>2a</td><td>Polyneuropathie avec déformation</td><td>Au moins deux fois par an</td></tr><tr><td>2b</td><td>Polyneuropathie avec artériopathie</td><td>Au moins quatre fois par an, bilan de revascularisation</td></tr><tr><td>3a, 3b</td><td>Après ulcère, après amputation</td><td>Au moins quatre fois par an</td></tr></tbody></table>
<p>Un ulcère aigu, un pied de Charcot ou une nécrose relèvent d’un centre de niveau 3, en urgence pour la gangrène. L’assurance-invalidité peut prendre en charge des chaussures adaptées au diabète si le patient a moins de 65 ans (homme) ou 64 ans (femme). Les documents de 2013 et 2016 sont anciens ; le guide de 2023 porte sur l’ulcère aigu.</p>
<p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/Fuss-Managements_bei_DM2_2013.pdf" target="_blank" rel="noopener">Société suisse d’endocrinologie et de diabétologie, QualiCCare, adopté le 15 août 2013, état de septembre 2014</a>.</p></template>
<template data-pop="g63-sural" data-title="Nerf sural : siège de la neurographie et de la biopsie">
<div class="lab">Neurographie</div><p>Feldman et coll. citent, comme exemple de valeurs normales du nerf sural, une amplitude supérieure à 6 µV et une vitesse supérieure à 39 m/s. Ces valeurs dépendent du laboratoire.</p>
<div class="lab">Biopsie</div><p>Le nerf sural figure parmi les sites de biopsie de l’amylose à transthyrétine (avec la graisse abdominale, le rectum et les glandes salivaires labiales).</p>
<div class="lab">Limite</div><p>Les sources lues ne décrivent pas le trajet anatomique du nerf ; ce cours ne le décrit donc pas.</p>
