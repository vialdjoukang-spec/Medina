<template data-pop="pareto-k80-clinique" data-title="Loi de Pareto — Lithiase biliaire"><p class="ratio" data-cover="k80-5,k80-6,k80-7,k80-9,k80-11,k80-12"></p><ul><li>Échographie d’abord ; scanner peu précis pour la cholécystite.</li><li>La lithiase symptomatique s’opère par laparoscopie, alors que la lithiase asymptomatique ne s’opère pas.</li><li>La cholécystite s’opère dans les 7 jours après l’admission et dans les 10 jours après le début.</li><li>Un risque cholédocien intermédiaire justifie une bili-IRM ou une écho-endoscopie, et un risque haut une CPRE.</li><li>L’angiocholite reçoit des antibiotiques et un drainage, dans les 12 h en cas de choc septique.</li><li>Après la CPRE, la cholécystectomie se fait pendant la même prise en charge.</li></ul></template>
<template data-pop="pareto-k80-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k80-e-1,k80-e-2"></p><ul><li>L’échographie est l’examen de première intention.</li><li>Bilan hépatique seul insuffisant pour le calcul cholédocien.</li><li>Un risque intermédiaire justifie une bili-IRM ou une écho-endoscopie.</li><li>CPRE pour traiter, pas pour diagnostiquer.</li><li>Le scanner est peu précis pour la cholécystite.</li></ul></template>
<template data-pop="pareto-k80-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k80-p-1,k80-p-2,k80-p-3"></p><ul><li>La colique se traite par un AINS (diclofénac).</li><li>Communautaire : amoxicilline-acide clavulanique 2,2 g/8 h.</li><li>Sévère ou instable : pipéracilline-tazobactam ou imipénem.</li><li>On arrête les antibiotiques 24 h après une cholécystectomie sans complication.</li><li>Pas de litholyse médicamenteuse (EASL 2016).</li></ul></template>
<template data-pop="k80-colique" data-title="Colique biliaire"><p class="lab">Définition (EASL 2016)</p><p>Crise de douleur intense de l’hypocondre droit ou de l’épigastre, d’au moins 15 à 30 minutes, irradiant vers le dos ou l’épaule droite, soulagée par les antalgiques.</p><p class="lab">Mécanisme</p><p>Un calcul obstrue de façon transitoire le collet ou le canal cystique ; la vésicule se distend contre l’obstacle.</p><p class="lab">Conduite</p><p>On la traite par un AINS, puis on fait la cholécystectomie le plus tôt possible, car les récidives et les complications sont fréquentes après une première colique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-cholecystite" data-title="Cholécystite aiguë lithiasique"><p class="lab">Clinique</p><p>Fièvre, douleur de l’hypocondre droit de plusieurs heures, signe de Murphy.</p><p class="lab">Diagnostic</p><p>On l’affirme en associant l’anamnèse, l’examen, la CRP et les leucocytes et l’échographie (WSES 2020), car aucun signe isolé ne suffit.</p><p class="lab">Traitement</p><p>Cholécystectomie laparoscopique ≤ 7 jours après l’admission et ≤ 10 jours après le début.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAKZAYUAAMjIumpqcVhYYUxMVERETD8/Rjo5PzQzOS8uNCwrMSopLScmKyQkKSMiJyIhJSAfIx8eIx4dIR0cIBsbHxoaHBoZHhgYGxcWGRUVGBQUFxMTFRIRFBEQFQ8QEQ4NDwwMDQsKDAkJCggICQcHBwYGBgUFBQMDBAICAgEBAwIBAQEBAQABAQEBAAMAAwAAAgAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAKZAUAI/wBNmDih4oXBgwgTKjSo4sSJhRAjSpxIsaLFixgzatzIsaPHjyBDihxJsqTJkyhTqlzJsqXLlzBjypxJs6bNmzhz6syoQoXAEiVIjBBBNIRREEhBhCAx8OHOp1CjSp1KtarVq1izat3KtavXr2DDih1LtqzZs2h5auzJtmDCngsLtnXL0OeLhnDhmmDrMC/avQAAKDh4YcCIDgESB4jwogAABAMEvxD4IrJiAo0BHPigOECGggwSB8YcWvSAFw4UJ3ixIMCAxBJelHgRGkPlACVEuJbQucOLAAA2AP9wwsSLCIEBBGgQGHgACiYoBBj8QLEBApIdL0AQQEDiApNfeP9XLuKE9MQCXii47JBy2vfw45+kKx/h3uIDexb3WVAgX7lsGUSQT/698BB//vlUQnsENbWXQPs19VBfb/03kEAmkNCQcXcNeF+EJfTUlIAS/gThfSIahxdBBE1WYnENPtihhPXVaOONOJq1oQmBpRcifTkGKeSQRO6k30MODCCAAhdMZ8F0CAgAmQAGFPBAAQdIaYACBAgwQAh2veACCiiIQMAADYzQIVwq7WWXAoE5EN5dWREoZmECWDCmC3wW6eefgD5V0GxdtnYAAQU8J8ABHlApAAHdCSCChhei8AECDkiwgALXEeBpAQZUGeoCDSxw6AAHPGACCsWFuBedHJH/ <template data-pop="k80-risque-vbp" data-title="Risque de calcul de la voie biliaire principale (WSES 2020)"><p class="lab">Très forts</p><p>Un calcul cholédocien visible à l’échographie et une angiocholite sont des prédicteurs très forts.</p><p class="lab">Forts</p><p>Un cholédoque > 6 mm (vésicule en place) et une bilirubine totale > 1,8 mg/dl sont des prédicteurs forts.</p><p class="lab">Modérés</p><p>Une autre anomalie du bilan hépatique, un âge > 55 ans et une pancréatite biliaire sont des prédicteurs modérés.</p><p class="lab">Classes</p><p>Le risque est haut en présence d’un prédicteur très fort, faible en l’absence de tout prédicteur, et intermédiaire dans tous les autres cas.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-angiocholite" data-title="Angiocholite aiguë"><p class="lab">Définition</p><p>Infection d’une voie biliaire obstruée, le plus souvent par un calcul.</p><p class="lab">Clinique</p><p>Fièvre et frissons, douleur abdominale et/ou ictère (EASL 2016) ; l’association fièvre, douleur et ictère est la triade de Charcot.</p><p class="lab">Traitement</p><p>On donne immédiatement des antibiotiques et l’on décomprime la voie biliaire selon la gravité de Tokyo 2018, car le pus sous pression passe dans le sang.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-cholecystectomie" data-title="Cholécystectomie laparoscopique"><p class="lab">Indication</p><p>On l’indique dans la lithiase symptomatique (EASL 2016, recommandation forte) et dans la cholécystite aiguë (WSES 2020).</p><p class="lab">Technique</p><p>Le chirurgien utilise quatre trocarts : deux d’au moins 10 mm et deux d’au moins 5 mm (EASL 2016).</p><p class="lab">Risques</p><p>La mortalité est de 0,1 à 1 %, et la plaie de la voie biliaire survient dans 0,2 à 1,5 % des cholécystites (WSES 2020).</p><p class="lab">Ambulatoire</p><p>Elle peut se faire en ambulatoire en l’absence de maladie systémique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-cpre" data-title="CPRE dans la lithiase"><p class="lab">Indications</p><p>Calcul cholédocien prouvé ou haut risque ; angiocholite ; pancréatite biliaire avec angiocholite.</p><p class="lab">Geste</p><p>L’endoscopiste fait une sphinctérotomie et extrait le calcul ; si l’extraction est incomplète, il pose une prothèse temporaire.</p><p class="lab">Antibioprophylaxie</p><p>Elle n’est pas systématique avant une CPRE pour calcul (ESGE 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p><figure><img src="data:image/gif;base64,R0lGODdhWAJnAoUAAPX49vLw7e3q5ufn4uXj3uPd193a1NzUy9fTytfNxNfHu9LNxNHIvdDEuNLAsszAssy6qsW7rMS1pMGwnb6rl7epk7Wii6yehKiXeqeSc6KRcqKNbKGIZ5uJaJeDYZR+XI18WYt2VIJyT31sSXlnRXJlQG5eO2VaNGFVMFpOKlBEI0Y+HDgwDx0WAgEBCwMABwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACwAAAAAWAJnAkAI/wBdCBxIsKDBgwgTKlzI8IXDhxAhMmw40cULgRIHRtzI8WLHjy1CaqDQ4IFJkxEiOGjAksGClwgQLDgQEwHNBQxyMlDA0oHPBxAgpJQgYQIFChWOWriAoWlTC1CTUphANGhQohOMVohaIWlWqkSrQvDp4EGEsEJTRjDJkuUDlikbMFipoC7PtiVNkt2r1uqECheWYugAYsSIEiZSqFjBeAWLkJAjS54M+THly5ItY94c8kXnFixYeOZMuvTm0CEfo568OvRq07Avq0btGvLH27hz667Iu7fv38Ab6h5O3GGL2wUEEFDQ1WvWsBLG/sTbloFbuQliHjBggCaCBOBfWv+/nhdoUaxGkQJm2jSw1KlUrUIwKV/o/L71T1p9QPZq/JT88deAXQQWWFcCOFHXVllWFfVVVl1hkIEHIYgwggkopNCYaxxqllpoK4AGWm2xkeZhhxySZlyJLFZ2Ioowxthhiy7GuOEKKqSgY4aLqeDjjz36iMIKxRV5W3BIJqkkbxk9ZNFGTxp5W2c5qoBBBElBdcEFgFnQVVRHhTkVWvXtVdZJ1OUkl07gtYmgSzjp1MBKDjSInphHNQffc0QBeBJKa7FVUnlz+oQXWYUaihdbOS3gZpsHPlpXWxAcBRZ6fzUHGAYbcEChCCSQUIJiPjom46kjklijqqueGmOLo9n/tmKJrsLoWGO45g <template data-pop="k80-pancreatite" data-title="Pancréatite biliaire"><p class="lab">Mécanisme</p><p>Calcul migré obstruant l’ampoule de Vater.</p><p class="lab">Conduite</p><p>On fait une CPRE dans les 24 heures en cas d’angiocholite, et la cholécystectomie pendant la même hospitalisation si la forme est légère.</p><p class="lab">Renvoi</p><p>Le cours K85 — Pancréatite aiguë la traite en détail.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-metabolique" data-title="Syndrome métabolique et calculs"><p class="lab">Composantes</p><p>L’obésité, le diabète et l’insulinorésistance en sont les composantes.</p><p class="lab">Prévention</p><p>L’EASL 2016 conseille un mode de vie sain, une activité physique et un poids idéal (recommandation faible).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-perte-poids" data-title="Perte de poids rapide"><p class="lab">Situations</p><p>Un régime très hypocalorique et la chirurgie bariatrique provoquent une perte de poids rapide.</p><p class="lab">Prévention</p><p>On donne de l’acide ursodésoxycholique ≥ 500 mg/j jusqu’à la stabilisation du poids (EASL 2016).</p><p class="lab">Chirurgie bariatrique</p><p>On ne fait pas de cholécystectomie prophylactique systématique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-sludge" data-title="Sludge biliaire"><p class="lab">Définition</p><p>Bile épaissie contenant des cristaux et du mucus, échogène, sans cône d’ombre.</p><p class="lab">Signification</p><p>Il traduit la stase ; il n’est pas en lui-même la cause des calculs (EASL 2016).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-murphy" data-title="Signe de Murphy"><p class="lab">Technique</p><p>Palpation profonde de l’hypocondre droit pendant l’inspiration.</p><p class="lab">Positif</p><p>Le signe est positif quand la douleur arrête l’inspiration pendant la palpation de l’hypocondre droit.</p><p class="lab">Valeur</p><p>Rapport de vraisemblance positif 2,8, intervalle de confiance incluant 1 : il ne suffit pas seul (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-eus" data-title="Écho-endoscopie"><p class="lab">Principe</p><p>Une sonde d’échographie, placée au bout d’un endoscope, explore la voie biliaire au contact du duodénum.</p><p class="lab">Indication</p><p>On la fait quand un calcul cholédocien reste suspecté sans preuve échographique (ESGE 2019, recommandation forte).</p><p class="lab">Avantage</p><p>Elle détecte très bien les petits calculs et évite une CPRE diagnostique.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-bilirm" data-title="Bili-IRM"><p class="lab">Principe</p><p>IRM pondérée en T2 qui visualise la bile sans produit de contraste.</p><p class="lab">Indication</p><p>On la demande en cas de risque intermédiaire de calcul cholédocien et de symptômes après cholécystectomie.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-d-ains" data-title="Diclofénac (Voltarène® solution injectable)"><p class="lab">Dose</p><p>On injecte 75 mg en i.m. intraglutéale profonde, exceptionnellement 2 × 75 mg/j dans les coliques, ou l’on perfuse 75 mg en 30 min à 2 h, sans dépasser 150 mg/24 h.</p><p class="lab">Interdit</p><p>Le bolus intraveineux est interdit.</p><p class="lab">Place</p><p>Il traite la colique biliaire (EASL 2016), car il bloque les prostaglandines qui entretiennent la douleur et l’inflammation.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Voltarène® solution injectable, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-porcelaine" data-title="Vésicule porcelaine"><p class="lab">Définition</p><p>La paroi vésiculaire est calcifiée.</p><p class="lab">Conduite</p><p>On peut opérer même sans symptôme (EASL 2016, recommandation faible).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-subtotale" data-title="Cholécystectomie subtotale"><p class="lab">Principe</p><p>Exérèse partielle de la vésicule, sans disséquer le triangle de Calot.</p><p class="lab">Indication</p><p>On la choisit quand l’anatomie est difficile et que le risque de plaie biliaire est élevé (WSES 2020, recommandation forte).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-drainage" data-title="Drainage de la vésicule"><p class="lab">Indication</p><p>On draine la vésicule quand le patient atteint de cholécystite n’est pas opérable (WSES 2020, recommandation forte).</p><p class="lab">Techniques</p><p>Le drainage est percutané transhépatique, endoscopique transpapillaire ou transmural écho-guidé par une prothèse métallique, qu’on retire dans les 4 semaines.</p><p class="lab">Ensuite</p><p>Cholécystectomie différée après réduction du risque.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-atb" data-title="Antibiotiques des infections biliaires"><p class="lab">Communautaire légère à modérée</p><p>On donne de la ceftriaxone 2 g/24 h, éventuellement avec du métronidazole 500 mg/8 h, ou de l’amoxicilline-acide clavulanique 2,2 g/8 h.</p><p class="lab">Associée aux soins</p><p>Pipéracilline-tazobactam 4,5 g/8 h, ou céfépime 2 g/8 h + métronidazole.</p><p class="lab">Sévère</p><p>On donne de la pipéracilline-tazobactam ou de l’imipénem 500 mg/6 h, et l’imipénem d’emblée en cas d’instabilité.</p><p class="lab">Durée</p><p>Le traitement dure 4 à 7 jours, ou 24 h après une cholécystectomie sans complication.</p><p class="src">Références : <a href="https://kssg.guidelines.ch/guideline/58/de" target="_blank" rel="noopener">Babouee Flury B., Flury D., Schlegel M. (validation Boggian K.), Cholezystitis/Cholangitis, directive d’infectiologie KSSG / HOCH Health Ostschweiz, guidelines.ch, validée le 02.02.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-tokyo" data-title="Gravité de l’angiocholite (Tokyo 2018)"><p class="lab">Sévère (grade III)</p><p>Dysfonction d’au moins un système : cardiovasculaire, neurologique, respiratoire, rénal, hépatique ou hématologique.</p><p class="lab">Modérée (grade II)</p><p>La forme est modérée en présence d’un critère : leucocytes > 12 000 ou < 4000/mm³, fièvre ≥ 39 °C, âge ≥ 75 ans, bilirubine totale ≥ 5 mg/dl ou hypoalbuminémie.</p><p class="lab">Légère (grade I)</p><p>La forme est légère quand aucun critère de forme modérée ou sévère n’est présent.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-drainage-biliaire" data-title="Drainage biliaire de l’angiocholite"><p class="lab">Délai (ESGE 2019)</p><p>La forme sévère se draine dès que possible, et dans les 12 h en cas de choc septique ; la forme modérée se draine en 48 à 72 h, et la forme légère de façon élective.</p><p class="lab">Voie</p><p>On draine de préférence par endoscopie ; la voie percutanée ou chirurgicale sert en cas d’échec ou d’impossibilité.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-sphincterotomie" data-title="Sphinctérotomie endoscopique"><p class="lab">Principe</p><p>Section du sphincter d’Oddi au cours de la CPRE pour extraire les calculs.</p><p class="lab">Calculs difficiles</p><p>On associe une sphinctérotomie limitée à une dilatation au ballonnet, ou l’on fragmente le calcul par lithotritie mécanique ou par cholangioscopie (ESGE 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-hida" data-title="Scintigraphie HIDA"><p class="lab">Principe</p><p>Le traceur est excrété dans la bile ; si la vésicule ne se remplit pas, le cystique est obstrué.</p><p class="lab">Valeur</p><p>Sensibilité et spécificité les plus élevées pour la cholécystite, selon l’expertise locale (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-calot" data-title="Triangle de Calot"><p class="lab">Limites</p><p>Il est limité par le canal cystique, le canal hépatique commun et le bord inférieur du foie.</p><p class="lab">Contenu</p><p>Artère cystique.</p><p class="lab">Enjeu</p><p>Identification avant toute section pour éviter la plaie de la voie biliaire principale.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-d-coamoxi" data-title="Amoxicilline-acide clavulanique i.v. (Co-Amoxi-Mepha®)"><p class="lab">Dose (FI suisse)</p><p>L’infection modérée reçoit 1,2 g 3 à 4 fois par jour, et l’infection grave 2,2 g 3 à 4 fois par jour, en perfusion d’au moins 30 minutes.</p><p class="lab">Directive KSSG</p><p>La KSSG prescrit 2,2 g i.v. toutes les 8 h, puis un relais par 1 g p.o. toutes les 8 h.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Co-Amoxi-Mepha® i.v., Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://kssg.guidelines.ch/guideline/58/de" target="_blank" rel="noopener">Babouee Flury B., Flury D., Schlegel M. (validation Boggian K.), Cholezystitis/Cholangitis, directive d’infectiologie KSSG / HOCH Health Ostschweiz, guidelines.ch, validée le 02.02.2026</a>.</p></template>
<template data-pop="k80-d-audc" data-title="Acide ursodésoxycholique (Ursofalk®)"><p class="lab">Prévention</p><p>On donne ≥ 500 mg/j lors d’une perte de poids rapide (EASL 2016).</p><p class="lab">Dissolution (FI suisse)</p><p>L’information professionnelle prévoit environ 10 mg/kg/j le soir pendant 6 à 24 mois, avec un arrêt si les calculs ne diminuent pas à 12 mois ou se calcifient ; cependant, l’EASL 2016 ne recommande pas la litholyse.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Ursofalk® 500 mg, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
