<template data-pop="pareto-k80-clinique" data-title="Loi de Pareto — Lithiase biliaire"><p class="ratio" data-cover="k80-5,k80-6,k80-7,k80-9,k80-11,k80-12"></p><ul><li>Échographie d’abord ; scanner peu précis pour la cholécystite.</li><li>Lithiase symptomatique : cholécystectomie laparoscopique ; asymptomatique : abstention.</li><li>Cholécystite : chirurgie ≤ 7 jours après l’admission et ≤ 10 jours après le début.</li><li>Risque cholédocien intermédiaire : bili-IRM ou écho-endoscopie ; haut : CPRE.</li><li>Angiocholite : antibiotiques et drainage, ≤ 12 h si choc septique.</li><li>Après CPRE : cholécystectomie pendant la même prise en charge.</li></ul></template>
<template data-pop="pareto-k80-examens" data-title="Loi de Pareto — Examens"><p class="ratio" data-cover="k80-e-1,k80-e-2"></p><ul><li>Échographie en première intention.</li><li>Bilan hépatique seul insuffisant pour le calcul cholédocien.</li><li>Risque intermédiaire : bili-IRM ou écho-endoscopie.</li><li>CPRE pour traiter, pas pour diagnostiquer.</li><li>Scanner peu précis pour la cholécystite.</li></ul></template>
<template data-pop="pareto-k80-pharma" data-title="Loi de Pareto — Pharmacologie"><p class="ratio" data-cover="k80-p-1,k80-p-2,k80-p-3"></p><ul><li>Colique : AINS (diclofénac).</li><li>Communautaire : amoxicilline-acide clavulanique 2,2 g/8 h.</li><li>Sévère ou instable : pipéracilline-tazobactam ou imipénem.</li><li>Arrêt 24 h après une cholécystectomie sans complication.</li><li>Pas de litholyse médicamenteuse (EASL 2016).</li></ul></template>
<template data-pop="k80-colique" data-title="Colique biliaire"><p class="lab">Définition (EASL 2016)</p><p>Crise de douleur intense de l’hypocondre droit ou de l’épigastre, d’au moins 15 à 30 minutes, irradiant vers le dos ou l’épaule droite, soulagée par les antalgiques.</p><p class="lab">Mécanisme</p><p>Obstruction transitoire du collet ou du canal cystique.</p><p class="lab">Conduite</p><p>AINS ; cholécystectomie le plus tôt possible.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-cholecystite" data-title="Cholécystite aiguë lithiasique"><p class="lab">Clinique</p><p>Fièvre, douleur de l’hypocondre droit de plusieurs heures, signe de Murphy.</p><p class="lab">Diagnostic</p><p>Association anamnèse, examen, CRP et leucocytes, échographie (WSES 2020).</p><p class="lab">Traitement</p><p>Cholécystectomie laparoscopique ≤ 7 jours après l’admission et ≤ 10 jours après le début.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-echo" data-title="Échographie biliaire"><p class="lab">Place</p><p>Première intention, recommandation forte (WSES 2020).</p><p class="lab">Calcul</p><p>Image hyperéchogène, mobile, cône d’ombre postérieur.</p><p class="lab">Cholécystite</p><p>Paroi épaissie, liquide péri-vésiculaire, Murphy échographique.</p><p class="lab">Limite</p><p>Cholédoque distal mal vu.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-risque-vbp" data-title="Risque de calcul de la voie biliaire principale (WSES 2020)"><p class="lab">Très forts</p><p>Calcul cholédocien visible à l’échographie ; angiocholite.</p><p class="lab">Forts</p><p>Cholédoque > 6 mm (vésicule en place) ; bilirubine totale > 1,8 mg/dl.</p><p class="lab">Modérés</p><p>Autre anomalie du bilan hépatique ; âge > 55 ans ; pancréatite biliaire.</p><p class="lab">Classes</p><p>Haut : un prédicteur très fort ; faible : aucun ; intermédiaire : tous les autres.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-angiocholite" data-title="Angiocholite aiguë"><p class="lab">Définition</p><p>Infection d’une voie biliaire obstruée, le plus souvent par un calcul.</p><p class="lab">Clinique</p><p>Fièvre et frissons, douleur abdominale et/ou ictère (EASL 2016) ; l’association fièvre, douleur et ictère est la triade de Charcot.</p><p class="lab">Traitement</p><p>Antibiotiques immédiats et décompression biliaire selon la gravité de Tokyo 2018.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-cholecystectomie" data-title="Cholécystectomie laparoscopique"><p class="lab">Indication</p><p>Lithiase symptomatique (EASL 2016, recommandation forte), cholécystite aiguë (WSES 2020).</p><p class="lab">Technique</p><p>Quatre trocarts : deux d’au moins 10 mm et deux d’au moins 5 mm (EASL 2016).</p><p class="lab">Risques</p><p>Mortalité 0,1 à 1 % ; plaie de la voie biliaire 0,2 à 1,5 % dans la cholécystite (WSES 2020).</p><p class="lab">Ambulatoire</p><p>Possible sans maladie systémique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-cpre" data-title="CPRE dans la lithiase"><p class="lab">Indications</p><p>Calcul cholédocien prouvé ou haut risque ; angiocholite ; pancréatite biliaire avec angiocholite.</p><p class="lab">Geste</p><p>Sphinctérotomie et extraction ; prothèse temporaire si extraction incomplète.</p><p class="lab">Antibioprophylaxie</p><p>Non systématique avant CPRE pour calcul (ESGE 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-cholesterol" data-title="Calculs de cholestérol"><p class="lab">Fréquence</p><p>90 à 95 % des calculs en Occident (EASL 2016).</p><p class="lab">Siège</p><p>Vésicule.</p><p class="lab">Facteurs</p><p>Syndrome métabolique, perte de poids rapide, âge, sexe féminin.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-pancreatite" data-title="Pancréatite biliaire"><p class="lab">Mécanisme</p><p>Calcul migré obstruant l’ampoule de Vater.</p><p class="lab">Conduite</p><p>CPRE ≤ 24 h si angiocholite ; cholécystectomie pendant la même hospitalisation si forme légère.</p><p class="lab">Renvoi</p><p>Traitée en détail dans le cours K85 — Pancréatite aiguë.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-metabolique" data-title="Syndrome métabolique et calculs"><p class="lab">Composantes</p><p>Obésité, diabète, insulinorésistance.</p><p class="lab">Prévention</p><p>Mode de vie sain, activité physique, poids idéal (EASL 2016, recommandation faible).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-perte-poids" data-title="Perte de poids rapide"><p class="lab">Situations</p><p>Régime très hypocalorique, chirurgie bariatrique.</p><p class="lab">Prévention</p><p>Acide ursodésoxycholique ≥ 500 mg/j jusqu’à stabilisation du poids (EASL 2016).</p><p class="lab">Chirurgie bariatrique</p><p>Pas de cholécystectomie prophylactique systématique.</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-sludge" data-title="Sludge biliaire"><p class="lab">Définition</p><p>Bile épaissie contenant des cristaux et du mucus, échogène, sans cône d’ombre.</p><p class="lab">Signification</p><p>Il traduit la stase ; il n’est pas en lui-même la cause des calculs (EASL 2016).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-murphy" data-title="Signe de Murphy"><p class="lab">Technique</p><p>Palpation profonde de l’hypocondre droit pendant l’inspiration.</p><p class="lab">Positif</p><p>Arrêt de l’inspiration par la douleur.</p><p class="lab">Valeur</p><p>Rapport de vraisemblance positif 2,8, intervalle de confiance incluant 1 : il ne suffit pas seul (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-eus" data-title="Écho-endoscopie"><p class="lab">Principe</p><p>Sonde d’échographie au bout d’un endoscope, au contact du duodénum.</p><p class="lab">Indication</p><p>Suspicion persistante de calcul cholédocien sans preuve échographique (ESGE 2019, recommandation forte).</p><p class="lab">Avantage</p><p>Très sensible pour les petits calculs ; évite une CPRE diagnostique.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-bilirm" data-title="Bili-IRM"><p class="lab">Principe</p><p>IRM pondérée en T2 qui visualise la bile sans produit de contraste.</p><p class="lab">Indication</p><p>Risque intermédiaire de calcul cholédocien ; symptômes après cholécystectomie.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-d-ains" data-title="Diclofénac (Voltarène® solution injectable)"><p class="lab">Dose</p><p>75 mg i.m. intraglutéale profonde ; exceptionnellement 2 × 75 mg/j dans les coliques ; perfusion 75 mg en 30 min à 2 h ; max. 150 mg/24 h.</p><p class="lab">Interdit</p><p>Bolus intraveineux.</p><p class="lab">Place</p><p>Traitement de la colique biliaire (EASL 2016).</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Voltarène® solution injectable, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-porcelaine" data-title="Vésicule porcelaine"><p class="lab">Définition</p><p>Calcification de la paroi vésiculaire.</p><p class="lab">Conduite</p><p>Cholécystectomie possible même sans symptôme (EASL 2016, recommandation faible).</p><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-subtotale" data-title="Cholécystectomie subtotale"><p class="lab">Principe</p><p>Exérèse partielle de la vésicule, sans disséquer le triangle de Calot.</p><p class="lab">Indication</p><p>Anatomie difficile, risque élevé de plaie biliaire (WSES 2020, recommandation forte).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-drainage" data-title="Drainage de la vésicule"><p class="lab">Indication</p><p>Cholécystite chez un patient non opérable (WSES 2020, recommandation forte).</p><p class="lab">Techniques</p><p>Percutané transhépatique ; endoscopique transpapillaire ; transmural écho-guidé par prothèse métallique, à retirer dans les 4 semaines.</p><p class="lab">Ensuite</p><p>Cholécystectomie différée après réduction du risque.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-atb" data-title="Antibiotiques des infections biliaires"><p class="lab">Communautaire légère à modérée</p><p>Ceftriaxone 2 g/24 h ± métronidazole 500 mg/8 h, ou amoxicilline-acide clavulanique 2,2 g/8 h.</p><p class="lab">Associée aux soins</p><p>Pipéracilline-tazobactam 4,5 g/8 h, ou céfépime 2 g/8 h + métronidazole.</p><p class="lab">Sévère</p><p>Pipéracilline-tazobactam ou imipénem 500 mg/6 h ; imipénem d’emblée si instabilité.</p><p class="lab">Durée</p><p>4 à 7 jours ; 24 h après cholécystectomie sans complication.</p><p class="src">Références : <a href="https://kssg.guidelines.ch/guideline/58/de" target="_blank" rel="noopener">Babouee Flury B., Flury D., Schlegel M. (validation Boggian K.), Cholezystitis/Cholangitis, directive d’infectiologie KSSG / HOCH Health Ostschweiz, guidelines.ch, validée le 02.02.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-tokyo" data-title="Gravité de l’angiocholite (Tokyo 2018)"><p class="lab">Sévère (grade III)</p><p>Dysfonction d’au moins un système : cardiovasculaire, neurologique, respiratoire, rénal, hépatique ou hématologique.</p><p class="lab">Modérée (grade II)</p><p>Un critère : leucocytes > 12 000 ou < 4000/mm³, fièvre ≥ 39 °C, âge ≥ 75 ans, bilirubine totale ≥ 5 mg/dl, hypoalbuminémie.</p><p class="lab">Légère (grade I)</p><p>Aucun critère de forme modérée ou sévère.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-drainage-biliaire" data-title="Drainage biliaire de l’angiocholite"><p class="lab">Délai (ESGE 2019)</p><p>Sévère : dès que possible, ≤ 12 h si choc septique ; modérée : 48 à 72 h ; légère : électif.</p><p class="lab">Voie</p><p>Endoscopique de préférence ; percutanée ou chirurgicale si échec ou impossibilité.</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></template>
<template data-pop="k80-sphincterotomie" data-title="Sphinctérotomie endoscopique"><p class="lab">Principe</p><p>Section du sphincter d’Oddi au cours de la CPRE pour extraire les calculs.</p><p class="lab">Calculs difficiles</p><p>Sphinctérotomie limitée avec dilatation au ballonnet ; lithotritie mécanique ou par cholangioscopie (ESGE 2019).</p><p class="src">Références : <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
<template data-pop="k80-hida" data-title="Scintigraphie HIDA"><p class="lab">Principe</p><p>Traceur excrété dans la bile ; la non-visualisation de la vésicule signe l’obstruction du cystique.</p><p class="lab">Valeur</p><p>Sensibilité et spécificité les plus élevées pour la cholécystite, selon l’expertise locale (WSES 2020).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-calot" data-title="Triangle de Calot"><p class="lab">Limites</p><p>Canal cystique, canal hépatique commun, bord inférieur du foie.</p><p class="lab">Contenu</p><p>Artère cystique.</p><p class="lab">Enjeu</p><p>Identification avant toute section pour éviter la plaie de la voie biliaire principale.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></template>
<template data-pop="k80-d-coamoxi" data-title="Amoxicilline-acide clavulanique i.v. (Co-Amoxi-Mepha®)"><p class="lab">Dose (FI suisse)</p><p>Infection modérée : 1,2 g 3 à 4 fois par jour ; grave : 2,2 g 3 à 4 fois par jour en perfusion d’au moins 30 minutes.</p><p class="lab">Directive KSSG</p><p>2,2 g i.v. toutes les 8 h ; relais 1 g p.o. toutes les 8 h.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Co-Amoxi-Mepha® i.v., Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://kssg.guidelines.ch/guideline/58/de" target="_blank" rel="noopener">Babouee Flury B., Flury D., Schlegel M. (validation Boggian K.), Cholezystitis/Cholangitis, directive d’infectiologie KSSG / HOCH Health Ostschweiz, guidelines.ch, validée le 02.02.2026</a>.</p></template>
<template data-pop="k80-d-audc" data-title="Acide ursodésoxycholique (Ursofalk®)"><p class="lab">Prévention</p><p>≥ 500 mg/j lors d’une perte de poids rapide (EASL 2016).</p><p class="lab">Dissolution (FI suisse)</p><p>Environ 10 mg/kg/j le soir, 6 à 24 mois ; arrêt si pas de réduction à 12 mois ou calcification ; litholyse non recommandée par l’EASL 2016.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr" target="_blank" rel="noopener">Information professionnelle suisse Ursofalk® 500 mg, Swissmedic (AIPS via AmiKo), consultée le 09.10.2026</a> ; <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></template>
