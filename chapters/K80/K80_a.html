<section class="ilot" id="k80-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 47 ans, en surpoids, consulte pour une douleur de l’hypocondre droit qui dure depuis 10 heures, avec fièvre à 38,4 °C. Or, elle décrit depuis un an des crises brèves de même siège après les repas, qui cédaient en une heure. <b>La question n’est donc plus seulement de reconnaître une colique hépatique, mais de savoir si une complication est en cours et laquelle.</b></p><p>Pour répondre à cette question, le médecin doit savoir : distinguer la <button class="w" data-k="k80-colique">colique biliaire</button> simple de la <button class="w" data-k="k80-cholecystite">cholécystite aiguë</button> ; confirmer les calculs par l’<button class="w" data-k="k80-echo">échographie</button> ; estimer le <button class="w" data-k="k80-risque-vbp">risque de calcul de la voie biliaire principale</button> ; reconnaître et classer une <button class="w" data-k="k80-angiocholite">angiocholite</button> selon <button class="w" data-k="k80-tokyo">Tokyo 2018</button> ; enfin, fixer le moment de la <button class="w" data-k="k80-cholecystectomie">cholécystectomie laparoscopique</button> et de la <button class="w" data-k="k80-cpre">CPRE</button>.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="k80-colique">Colique</button> : douleur brève ; <button class="w" data-k="k80-cholecystite">cholécystite</button> : douleur prolongée, fièvre, <button class="w" data-k="k80-murphy">signe de Murphy</button> ; <button class="w" data-k="k80-angiocholite">angiocholite</button> : fièvre, frissons, ictère.</div></section>
<section class="ilot" id="k80-1"><h2><span class="n">1</span>Définition et formes</h2><p>La lithiase biliaire est la présence de calculs dans la vésicule ou dans les voies biliaires. Ainsi, l’EASL 2016 distingue trois types : les <button class="w" data-k="k80-cholesterol">calculs de cholestérol</button>, qui représentent 90 à 95 % des calculs dans les populations occidentales ; les calculs pigmentaires noirs, surtout en cas d’hémolyse chronique ou de cirrhose ; enfin, les calculs pigmentaires bruns, qui se forment surtout dans la voie biliaire principale. De plus, les calculs de cholestérol et les pigmentaires noirs naissent presque toujours dans la vésicule.</p><p>À partir de ces types, la clinique se décline en plusieurs formes. D’une part, la lithiase peut rester asymptomatique ; d’autre part, elle peut provoquer une <button class="w" data-k="k80-colique">colique biliaire</button>, puis des complications : <button class="w" data-k="k80-cholecystite">cholécystite aiguë</button>, calcul de la voie biliaire principale, <button class="w" data-k="k80-angiocholite">angiocholite</button> et <button class="w" data-k="k80-pancreatite">pancréatite biliaire</button>.</p><table class="t"><tr><th>Forme</th><th>Mécanisme</th><th>Conséquence</th></tr><tr><td>Lithiase asymptomatique</td><td>Calculs sans symptôme</td><td>Pas de traitement systématique</td></tr><tr><td>Colique biliaire</td><td>Obstruction transitoire du collet ou du canal cystique</td><td>Cholécystectomie, le plus tôt possible</td></tr><tr><td>Cholécystite aiguë</td><td>Obstruction prolongée et inflammation de la paroi</td><td>Cholécystectomie précoce</td></tr><tr><td>Calcul de la voie biliaire principale</td><td>Migration ou formation dans le <button class="w" data-k="k80-risque-vbp">cholédoque</button></td><td>Extraction</td></tr><tr><td>Angiocholite</td><td>Obstruction et infection de la voie biliaire</td><td>Antibiotiques et drainage urgent</td></tr></table><p>Le tableau se lit de haut en bas : en effet, chaqu <section class="ilot" id="k80-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2><p>Après la définition, la fréquence situe l’enjeu. Ainsi, selon l’EASL 2016, la lithiase biliaire touche jusqu’à 20 % de la population en Europe ; c’est la maladie digestive qui motive le plus d’hospitalisations dans les pays européens. De plus, sa fréquence augmente avec l’âge et elle est plus élevée chez la femme.</p><p>Cependant, environ 80 % des porteurs restent asymptomatiques. En effet, les symptômes apparaissent chez 1 à 4 % des porteurs par an, et 20 % deviennent symptomatiques en 20 ans. Par conséquent, le risque de complication est faible sans symptôme (0,1 à 0,3 % par an), alors qu’il atteint 1 à 3 % par an après une première colique (EASL 2016).</p><div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée nationale suisse de prévalence n’a été retrouvée lors de la rédaction ; les chiffres cités sont européens et attribués à l’EASL 2016.</div><div class="key"><b>À retenir.</b> Jusqu’à 20 % de la population ; 80 % asymptomatiques ; complications 0,1 à 0,3 %/an sans symptôme, 1 à 3 %/an après une colique.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></section>
<section class="ilot" id="k80-3"><h2><span class="n">3</span>Facteurs de risque et prévention</h2><p>Pour comprendre la prévention, il faut connaître les facteurs de risque. Ainsi, les calculs de cholestérol sont liés au <button class="w" data-k="k80-metabolique">syndrome métabolique</button> : obésité, diabète et insulinorésistance. De plus, certaines situations favorisent la lithiase : la <button class="w" data-k="k80-perte-poids">perte de poids rapide</button> (régime très hypocalorique, chirurgie bariatrique), les analogues de la somatostatine, la nutrition parentérale totale et le traitement hormonal substitutif. Enfin, les calculs pigmentaires noirs s’associent à l’hémolyse chronique, par exemple la sphérocytose héréditaire ou la drépanocytose.</p><p>Par conséquent, l’EASL 2016 propose un mode de vie sain, une activité physique régulière et le maintien d’un poids idéal (recommandation faible). En revanche, la prévention médicamenteuse n’est pas conseillée dans la population générale. Toutefois, lors d’une perte de poids rapide, l’<button class="w" data-k="k80-d-audc">acide ursodésoxycholique</button> à au moins 500 mg par jour jusqu’à la stabilisation du poids peut être recommandé.</p><div class="key"><b>À retenir.</b> Syndrome métabolique, perte de poids rapide, somatostatine, nutrition parentérale, hormones ; hémolyse pour les pigmentaires. Perte de poids rapide : acide ursodésoxycholique ≥ 500 mg/j.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></section>
<section class="ilot" id="k80-4"><h2><span class="n">4</span>Physiopathologie</h2><p>La formation d’un calcul de cholestérol exige trois conditions. D’abord, la bile est sursaturée en cholestérol ; ensuite, ce cholestérol cristallise ; enfin, une vésicule hypomobile retient les cristaux, qui grossissent. De plus, le <button class="w" data-k="k80-sludge">sludge biliaire</button> apparaît avec la stase et la réduction du cycle entéro-hépatique ; cependant, selon l’EASL 2016, il n’est pas en lui-même la cause des calculs.</p><p>Ensuite, les symptômes naissent de l’obstruction. En effet, un calcul enclavé au collet ou dans le canal cystique distend la vésicule : c’est la colique, qui cède quand le calcul se dégage. Or, si l’obstruction persiste, la paroi s’œdématie, s’inflamme puis se surinfecte par des germes digestifs ; c’est ainsi que survient la cholécystite. Enfin, un calcul qui migre dans le <button class="w" data-k="k80-risque-vbp">cholédoque</button> peut obstruer la voie biliaire et l’ampoule, ce qui expose à l’<button class="w" data-k="k80-angiocholite">angiocholite</button> et à la pancréatite.</p><div class="key"><b>À retenir.</b> Sursaturation, cristallisation, hypomobilité vésiculaire ; obstruction transitoire = colique, persistante = cholécystite, cholédocienne = angiocholite ou pancréatite.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></section>
<section class="ilot" id="k80-5"><h2><span class="n">5</span>Clinique : colique biliaire et cholécystite</h2><p>La démarche commence donc par la clinique. Selon l’EASL 2016, la <button class="w" data-k="k80-colique">colique biliaire</button> est une douleur intense de l’hypocondre droit ou de l’épigastre, durant au moins 15 à 30 minutes, irradiant vers le dos ou l’épaule droite et soulagée par les antalgiques. En effet, seuls trois symptômes sont associés de façon significative aux calculs : la colique, la douleur irradiée et le recours aux antalgiques.</p><p>À l’inverse, la <button class="w" data-k="k80-cholecystite">cholécystite aiguë</button> est suspectée devant une fièvre, une douleur intense de l’hypocondre droit qui dure plusieurs heures et une douleur à la palpation de l’hypocondre droit, le <button class="w" data-k="k80-murphy">signe de Murphy</button> (EASL 2016, recommandation forte). Cependant, aucun signe isolé ne suffit à poser ou à exclure le diagnostic ; c’est pourquoi la WSES 2020 demande d’associer l’anamnèse, l’examen, la biologie (CRP, leucocytes) et l’imagerie.</p><div class="quiz ui"><p>Une patiente a une douleur de l’hypocondre droit depuis 40 minutes, cédant sous antalgique, sans fièvre ; l’échographie montre des calculs sans épaississement pariétal. Quel diagnostic ?</p><button data-ok="0">Cholécystite aiguë</button><button data-ok="1">Colique biliaire</button><button data-ok="0">Angiocholite</button><p class="fb" hidden>Douleur brève, sans fièvre ni signe pariétal : c’est une colique biliaire ; elle justifie une cholécystectomie le plus tôt possible (EASL 2016).</p></div><div class="key"><b>À retenir.</b> Colique : 15 à 30 minutes ou plus, irradiée, soulagée. Cholécystite : douleur de plusieurs heures, fièvre, Murphy, CRP et leucocytes élevés.</div><p class="src">Références : <a href="https://easl.eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a>.</p></section>
<section class="ilot" id="k80-6"><h2><span class="n">6</span>Diagnostic : échographie et recherche des calculs cholédociens</h2><p>Au terme de l’examen, l’<button class="w" data-k="k80-echo">échographie abdominale</button> est l’examen de première intention, en raison de son coût, de sa disponibilité et de sa bonne précision (WSES 2020, recommandation forte). Ainsi, elle montre les calculs, mobiles et suivis d’un cône d’ombre, et les signes de cholécystite : paroi épaissie, liquide péri-vésiculaire, <button class="w" data-k="k80-murphy">Murphy</button> échographique. En revanche, la précision diagnostique du scanner est faible pour la cholécystite.</p><p>Ensuite, il faut rechercher un calcul de la voie biliaire principale. Or, le bilan hépatique seul ne suffit pas (WSES 2020). Par conséquent, on combine le bilan hépatique et l’échographie pour estimer la probabilité (ESGE 2019) ; de plus, en cas de suspicion persistante sans preuve échographique, l’<button class="w" data-k="k80-eus">écho-endoscopie</button> ou la <button class="w" data-k="k80-bilirm">bili-IRM</button> sont recommandées (ESGE 2019, recommandation forte).</p><figure><img src="data:image/gif;base64,R0lGODdhWAJcAoUAAP////X19dvb28/Pz8PDw7u7u7W1ta+vr6mpqaampqGhoZycnJmZmZWVlZCQkIqKioaGhoKCgn19fXh4eHNzc3BwcG5ubmpqamhoaGZmZmNjY2BgYF5eXltbW1lZWVZWVlRUVFBQUE1NTUtLS0dHR0VFRUFBQT09PTo6OjY2NjMzMzExMS4uLioqKicnJyUlJSAgIB0dHRoaGhUVFRISEg8PDwwMDAoKCggICAYGBgUFBQQEBAMDAwICAgEBAQAAACwAAAAAWAJcAkAI/wB/CBxIsKDBgwgTKlzIsKHDhxAjSpxIsaJFiz4y/rAxgwYNGTNmxGiRwkQJEyM+ZJgAwUGDBxEkyJQwgQKGDR06aMigoQOInz8/eOCwAecHoB86ZLiQYcPRECRMoEjB4oWMGjhyaOXxI6OPHz3C8tBIUGOPr127or3IlqFXsgp99ACbViDZsHjnovVRw0ZfGiVPmDBBYkQIECMSh0jawcPTEVFTrFBxwvDPDkI7cNBwoQKFCxqKbtCwEwMGoqiJku4QAnIKFS1ijG1Lu7bt27hz697Nm63cHzh26KgxQ0YMGDBetHABo8YOHjvmDhTud8YLFSVAHO2AgeWDBw7CO//4Tt4BhAmeJXyPACFCTc8UKoD20BryYRAh7uOvL0JECBGGLbYBBwTSR0IJCJ5Egn8gcJBBBhhcIKEFFVRYgQUZVCACDQMI4OGHIIb4IQssUCDagARykJNmmmFAIWgqbmCBet9NgKGKjX3QGglRmSDYCSjA9oILRL5gpAvLtbBCCig0aYIIIHjQwQYVyFQ .eu/wp-content/uploads/2016/10/EASL-CPG-Gallstones.pdf" target="_blank" rel="noopener">EASL Clinical Practice Guidelines on the prevention, diagnosis and treatment of gallstones, J Hepatol 2016;65:146-181</a>.</p></section>
<section class="ilot" id="k80-7"><h2><span class="n">7</span>Stratifier le risque de calcul cholédocien</h2><p>Une fois les calculs vésiculaires prouvés, le risque cholédocien oriente l’examen suivant. Ainsi, la WSES 2020 classe les <button class="w" data-k="k80-risque-vbp">prédicteurs</button> en trois niveaux : très forts (calcul visible dans le cholédoque à l’échographie, <button class="w" data-k="k80-angiocholite">angiocholite</button>), forts (cholédoque de plus de 6 mm vésicule en place, bilirubine totale supérieure à 1,8 mg/dl) et modérés (autre anomalie du bilan hépatique, âge supérieur à 55 ans, <button class="w" data-k="k80-pancreatite">pancréatite biliaire</button>).</p><p>Par conséquent, le patient à haut risque, qui présente un prédicteur très fort, bénéficie d’une <button class="w" data-k="k80-cpre">CPRE</button> préopératoire, d’une cholangiographie peropératoire ou d’une échographie laparoscopique. À l’inverse, le patient à risque intermédiaire bénéficie d’abord d’une <button class="w" data-k="k80-bilirm">bili-IRM</button>, d’une <button class="w" data-k="k80-eus">écho-endoscopie</button> ou d’une exploration peropératoire (WSES 2020, recommandations fortes). Enfin, le calcul cholédocien doit être extrait chez tout patient qui peut supporter le geste, qu’il soit symptomatique ou non (ESGE 2019).</p><div class="trap"><span class="k">Origine de la grille</span>La grille de la WSES 2020 est adaptée d’une classification de sociétés américaines (ASGE, SAGES) ; la WSES la rend plus restrictive, en réservant le haut risque aux prédicteurs très forts, pour limiter les CPRE inutiles.</div><div class="quiz ui"><p>Une patiente a des calculs vésiculaires, un cholédoque à 8 mm et une bilirubine à 2,5 mg/dl, sans calcul visible ni angiocholite. Quel niveau de risque ?</p><button data-ok="0">Haut : CPRE d’emblée</button><button data-ok="1">Intermédiaire : bili-IRM ou écho-endoscopie</button><button data-ok="0">Faible : cholécystectomie seule</button><p class="fb" hidden>Deux prédicteurs forts mais aucun très fort : risque intermédiaire selon la WSES 2020 ; la bili-IRM ou l’écho-endoscopie évitent une CPRE inutile.</p></div><div class="key"><b>À retenir.</b> Très fort (calcul visible, angiocholite) : haut risque, CPRE. Fort ou modéré seulement : intermédiaire, bili-IRM ou écho-endoscopie. Tout calcul cholédocien est extrait.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7643471/" target="_blank" rel="noopener">Pisano M. et al., 2020 WSES updated guidelines for the diagnosis and treatment of acute calculus cholecystitis, World J Emerg Surg 2020;15:61</a> ; <a href="https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf" target="_blank" rel="noopener">Manes G. et al., ESGE, prise en charge endoscopique des calculs de la voie biliaire principale, Endoscopy 2019;51:472-491</a>.</p></section>
