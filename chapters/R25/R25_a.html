<p>Dans cette <b>vignette fictive</b>, une infirmière de 45 ans consulte pour trois plaintes. Des crampes la réveillent la nuit au niveau des mollets. Un muscle de sa cuisse « frémit » sous la peau depuis plusieurs semaines. Ses mains tremblent légèrement quand elle tient une tasse. Elle craint d’avoir une maladie du motoneurone, car elle en a vu des cas dans son service. Aucune de ces plaintes ne correspond, à ce stade, à une maladie précise.</p>
<p>Pour cette situation, la classification utilise la catégorie <button class="w" data-k="r25-codage">R25 (sous-codes, inclusions et exclusions)</button>, qui est un code de <b>symptôme</b> du chapitre XVIII. On l’emploie quand le mouvement est décrit sans qu’une maladie du groupe G20–G26, un tic ou une stéréotypie ait été diagnostiqué. La leçon enseigne donc une <b>démarche</b>, et non une maladie : nommer le mouvement, chercher une cause traitable, repérer les drapeaux rouges, puis recoder dès que le diagnostic est posé.</p>
<p>Trois questions guident le cours. <b>Quel mouvement ?</b> car le traitement dépend du syndrome reconnu. <b>Quelle cause ?</b> car la plupart des mouvements anormaux vus en médecine interne ne sont pas dégénératifs : ils relèvent d’un médicament, d’une encéphalopathie métabolique ou inflammatoire, et leur évolution est le plus souvent favorable quand la cause est supprimée. <b>Quel danger ?</b> car une fasciculation avec faiblesse, une crampe avec myoglobinurie ou un spasme diffus ne se traitent pas comme une crampe banale.</p>
<div class="key"><b>À retenir.</b> Devant un mouvement involontaire : le nommer, chercher la cause réversible, écarter le danger, puis remplacer R25 par le code de la maladie une fois celle-ci établie. À l’examen fédéral, la situation de départ 98 (mouvements involontaires anormaux, tremblement, tic, incoordination) s’appuie sur cette démarche, avec les situations 96 (équilibre, chutes), 97 (démarche) et 103 (parésie).</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc R25–R29, catégorie R25</a>; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>; <a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener" data-reference-source="1">PROFILES 2017, situations de départ 96, 97, 98 et 103</a>.</p>
</section>
<section class="ilot" id="r25-1"><h2><span class="n">1</span>Définitions, périmètre et classifications</h2>
<p>La catégorie R25 appartient au bloc R25–R29 de la CIM-10-GM 2024. Ses exclusions fixent la règle de codage : les troubles moteurs spécifiques (G20–G26), les stéréotypies motrices (F98.4) et les tics (F95) ne se codent pas en R25. Les cinq sous-codes — tête, tremblement, crampe et spasme, fasciculation, autres mouvements — sont détaillés dans la <button class="w" data-k="r25-codage">fenêtre de codage (liste complète des sous-codes et de leurs exclusions)</button>. Dès qu’un tremblement est reconnu comme essentiel, intentionnel ou fonctionnel, il quitte R25.1 ; dès qu’une crampe correspond à un spasme carpopédal de tétanie, elle quitte R25.2.</p>
<p>Nommer exactement le mouvement est le premier geste clinique. Le tableau ci-dessous reprend les définitions de référence ; chacune contient le critère qui sépare un mouvement de ses voisins. Les deux grandes familles sont les syndromes akinétiques et les hyperkinésies, aussi appelées dyskinésies ; R25 ne concerne que les secondes.</p>
<table class="t"><thead><tr><th>Mouvement</th><th>Définition opératoire</th><th>Critère discriminant</th></tr></thead><tbody>
<tr><td>Tremblement</td><td>Mouvement involontaire, rythmique et oscillatoire d’une partie du corps</td><td>Rythme régulier</td></tr>
<tr><td>Myoclonie</td><td>Secousse brève, soudaine, « en éclair », d’environ 100 ms (jusqu’à 300 ms en axial)</td><td>Positive (bouffée d’activité musculaire) ou négative (silence musculaire : astérixis)</td></tr>
<tr><td>Chorée</td><td>Mouvements irréguliers, imprévisibles, fluides, distaux, majorés par le stress</td><td>Hypotonie, réflexes pendulaires, impersistance motrice, anosognosie</td></tr>
<tr><td>Ballisme</td><td>Chorée proximale, ample, brusque, explosive</td><td>Amplitude et proximalité</td></tr>
<tr><td>Dystonie</td><td>Contraction soutenue ou intermittente simultanée des agonistes et des antagonistes, avec posture en flexion, extension ou torsion</td><td>Geste antagoniste ; majorée par l’action</td></tr>
<tr><td>Tic</td><td>Mouvement ou son bref, soudain, non rythmique</td><td>Précédé d’une sensation prémonitoire, suggestible, temporairement suppressible</td></tr>
<tr><td>Stéréotypie</td><td>Mouvement répétitif</td><td>Aucune sensation prémonitoire</td></tr>
<tr><td>Crampe</td><td>Contraction aiguë, douloureuse, involontaire d’un muscle ou d’une partie de muscle, durée de secondes à minutes</td><td>Durcissement palpable ; autolimitée</td></tr>
<tr><td>Fasciculation</td><td>Contraction spontanée brève d’un petit nombre de fibres musculaires</td><td>Frémissement visible sous la peau</td></tr>
<tr><td>Myorythmie</td><td>Mouvement rythmique non sinusoïdal</td><td>Exemple : muscle pectoral stimulé par la sonde d’un stimulateur cardiaque</td></tr>
<tr><td>Akathisie</td><td>Sensation interne désagréable avec besoin de bouger et agitation (déambulation, piétinement)</td><td>Besoin intérieur de mouvement</td></tr>
</tbody></table>
<p>Ce tableau se lit par paires. Le tremblement s’oppose à la myoclonie par son rythme oscillatoire ; le tic s’oppose à la stéréotypie par la sensation prémonitoire ; la dystonie s’oppose à la chorée par la posture soutenue et le geste antagoniste. La <button class="w" data-k="r25-mouvements">fenêtre sur les définitions (mécanisme de chaque critère et pièges)</button> développe ces oppositions.</p>
<div class="trap"><span class="k">Piège</span> Une crampe n’est pas une fasciculation : la crampe est douloureuse et durcit tout le muscle, la fasciculation est brève, indolore et ne déplace pas le segment. Le piège inverse existe aussi : appeler « tic » une stéréotypie, qui n’est pas précédée d’une sensation prémonitoire.</div>
<h3>1.1 Classifier le tremblement</h3>
<p>Le consensus de la <button class="w" data-k="r25-mds">Movement Disorder Society de 2018 (deux axes, conditions d’activation, fréquence)</button> classe le tremblement sur deux axes. L’axe 1 est clinique : âge de début, antécédents familiaux, évolution, topographie, condition d’activation, signes associés, examens. L’axe 2 est étiologique : tremblement acquis, génétique ou idiopathique. Cette double lecture évite de confondre le descriptif et la cause.</p>
<div class="two"><div class="card"><h4>Condition d’activation</h4><p>Le <b>repos</b> désigne la main pendante et détendue sur l’accoudoir. L’<b>action</b> regroupe le tremblement postural (bras tendus), orthostatique, cinétique simple, intentionnel, spécifique d’une tâche et isométrique. Une suppression du tremblement à l’initiation du mouvement oriente vers un syndrome dopaminergique déficitaire.</p></div><div class="card"><h4>Fréquence</h4><p>Le consensus distingue moins de 4 Hz, 4 à 8 Hz, 8 à 12 Hz et plus de 12 Hz. La plupart des tremblements pathologiques se situent entre 4 et 8 Hz : la fréquence isolée est donc rarement diagnostique. La ligne directrice allemande, autrichienne et suisse sépare les fréquences basse (moins de 4 Hz), moyenne (4 à 7 Hz) et haute (plus de 8 Hz).</p></div></div>
<h3>1.2 Classifier crampes, myoclonies et fasciculations</h3>
<p>Les <b>crampes</b> sont idiopathiques ou symptomatiques. Une crampe idiopathique survient sans cause, au repos, la nuit, au mollet et à la voûte plantaire. Une crampe symptomatique accompagne un effort, un trouble électrolytique, une neuropathie, une endocrinopathie, la grossesse, la dialyse, une cirrhose ou un médicament. Les <b>myoclonies</b> se classent selon leur générateur anatomique : corticale, sous-corticale, segmentaire ou périphérique ; la neurophysiologie établit ce classement. Les <b>fasciculations</b> sont isolées et bénignes, ou intégrées à un syndrome des fasciculations bénignes, à un syndrome crampes-fasciculations, ou à une maladie du motoneurone.</p>
<p>Le symptôme R25 lui-même ne possède aucun stade de sévérité. Pour les crampes, la ligne directrice propose une échelle visuelle analogique de 0 à 10, tenue pendant 4 à 8 semaines avant tout traitement, afin de mesurer l’effet d’une intervention sur un chiffre plutôt que sur une impression.</p>
<div class="key"><b>À retenir.</b> Définir le mouvement par son critère discriminant, classer le tremblement sur deux axes, et ne jamais conclure sur la seule fréquence. La classification de R25 sert à orienter, non à stadifier.</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc R25–R29, catégorie R25</a>; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener" data-reference-source="1">CIM-10-GM 2024, libellés français (Office fédéral de la statistique)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §1.1; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §1 et §2; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener" data-reference-source="1">European clinical guidelines for Tourette syndrome and other tic disorders, version 2.0, Part I (2022)</a>; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>
</section>
<section class="ilot" id="r25-2"><h2><span class="n">2</span>Fréquence</h2>
<p>Aucune donnée suisse de prévalence spécifique aux mouvements involontaires anormaux n’a pu être lue : cette lacune est déclarée et non comblée. Les chiffres disponibles proviennent de lignes directrices et de revues européennes ; ils décrivent des populations différentes et ne se comparent pas entre eux.</p>
<table class="t"><thead><tr><th>Symptôme</th><th>Population</th><th>Fréquence rapportée</th></tr></thead><tbody>
<tr><td>Tremblement essentiel</td><td>Population générale</td><td>Prévalence estimée de 1,3 à 5,1 % ; pas de prédominance de sexe</td></tr>
<tr><td>Tremblement pathologique</td><td>Plus de 80 ans</td><td>Plus de 30 %</td></tr>
<tr><td>Crampes isolées</td><td>Jeunes adultes</td><td>Plus de 90 %</td></tr>
<tr><td>Crampes régulières</td><td>Personnes âgées</td><td>30 à 55 % ; 30 à 40 % plus de trois fois par semaine</td></tr>
<tr><td>Crampes sans effort préalable</td><td>Population générale</td><td>Environ un tiers, en augmentation avec l’âge</td></tr>
<tr><td>Crampes d’effort</td><td>Sportifs</td><td>20 à 70 % selon la discipline</td></tr>
<tr><td>Crampes de grossesse</td><td>Femmes enceintes</td><td>35 à 55 %</td></tr>
<tr><td>Crampes de dialyse</td><td>Hémodialysés</td><td>35 à 85 %</td></tr>
<tr><td>Crampes de cirrhose</td><td>Cirrhotiques</td><td>30 à 90 %</td></tr>
<tr><td>Crampes de maladie du motoneurone</td><td>Patients concernés</td><td>Jusqu’à 90 à 95 %</td></tr>
<tr><td>Crampes de polyneuropathie</td><td>Patients concernés</td><td>30 à 65 % ; 70 à 80 % pour les formes héréditaires</td></tr>
<tr><td>Myoclonies pathologiques persistantes</td><td>Population générale</td><td>Incidence d’environ 1 pour 100 000 personnes-années ; prévalence vie entière inférieure à 10 pour 100 000</td></tr>
</tbody></table>
<p>Ce tableau montre un gradient : la crampe est un phénomène presque universel à l’échelle de la vie, alors que la myoclonie persistante est rare. Les pourcentages élevés des maladies chroniques (dialyse, cirrhose, motoneurone) signifient que, dans ces contextes, la crampe est banale et ne suffit pas à orienter le diagnostic. Un quart des patients crampeux a un antécédent familial positif. Le <b>syndrome des fasciculations bénignes</b> touche surtout des hommes jeunes (78 % des 180 patients de la revue systématique) ; la crainte d’une maladie du motoneurone y est particulièrement fréquente chez les soignants, ce qui éclaire la vignette d’ouverture.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Utiliser la fréquence d’un contexte pour un autre. Que 90 % des cirrhotiques aient des crampes ne rend pas la crampe diagnostique de cirrhose ; que plus de 90 % des jeunes adultes en aient eu ne la rend pas pathologique.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.1.1; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §1 à §11; <a href="https://doi.org/10.1007/s10072-024-07867-0" target="_blank" rel="noopener" data-reference-source="1">Clinical progression of benign fasciculation syndrome: a systematic literature review (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders (2017)</a>.</p>

<section class="ilot" id="r25-3"><h2><span class="n">3</span>Physiopathologie : du normal au pathologique</h2>
<p>Chaque mouvement anormal prolonge un phénomène normal dont un seuil, une inhibition ou une excitabilité a été franchi. Comprendre ce passage explique à la fois le symptôme, l’examen qui le démasque et le traitement qui le corrige.</p>
<h3>3.1 Le tremblement : un phénomène physiologique devenu visible</h3>
<p>Un <button class="w" data-k="r25-physio-tremblement">tremblement physiologique (toujours présent, discret, composante bêta-adrénergique périphérique)</button> existe chez tout le monde, mais il est habituellement invisible. On parle pragmatiquement de tremblement pathologique lorsqu’il devient visible à l’œil nu. Le tremblement physiologique <b>renforcé</b> est un tremblement d’action et postural, bilatéral, de 8 à 15 Hz. Son amplitude augmente sous l’effet de l’adrénaline injectée par voie intraveineuse ; cet effet est bloqué par le propranolol perfusé dans l’artère du membre étudié. Cette expérience démontre qu’une part du tremblement dépend de récepteurs bêta-adrénergiques périphériques, ce qui explique pourquoi les bêta-mimétiques et l’hyperthyroïdie l’aggravent et pourquoi un bêtabloquant peut l’atténuer.</p>
<h3>3.2 La crampe : une décharge neurogène qui échappe à l’inhibition</h3>
<p>La crampe est déclenchée de façon neurogène, dans les <b>axones moteurs efférents</b>. Les afférences (fuseaux neuromusculaires et organes tendineux, fibres de type Ia, Ib et II), les circuits spinaux et les efférences centrales y participent. L’électromyogramme enregistre pendant la crampe des potentiels d’action de configuration normale, à haute fréquence de décharge : ce profil est cohérent avec un déclenchement nerveux plutôt qu’avec une anomalie de la fibre musculaire. Le raccourcissement du muscle facilite la crampe, et les muscles qui franchissent plusieurs articulations sont plus souvent touchés. À l’effort, l’hypothèse dominante invoque un <b>déséquilibre entre influx activateurs et inhibiteurs sur le motoneurone alpha</b> spinal, en plus des pertes d’eau et d’électrolytes. La <button class="w" data-k="r25-crampe-meca">fenêtre sur le mécanisme de la crampe (voies, preuves électromyographiques, limites)</button> détaille ces éléments.</p>
<p>Ce mécanisme éclaire le geste thérapeutique : l’<button class="w" data-k="r25-etirement">étirement (inhibition autogène par les organes tendineux)</button> arrête la crampe parce qu’il augmente l’activité inhibitrice des organes tendineux de Golgi et abaisse l’activité des motoneurones du muscle étiré.</p>
<h3>3.3 La fasciculation : une activité ectopique du système moteur</h3>
<p>La <button class="w" data-k="r25-fascic">fasciculation (origine ectopique, proximale puis distale dans la maladie du motoneurone)</button> est une activité ectopique du système moteur. Dans la sclérose latérale amyotrophique, son origine est proximale au début, puis distale, avec le bourgeonnement des axones de réinnervation. Elle se distingue des trains de décharges répétitives de la neuromyotonie. La fasciculation seule ne tranche donc pas : c’est l’examen de la force, de la trophicité et des réflexes qui sépare le syndrome bénin de la maladie du motoneurone.</p>
<h3>3.4 Hyperexcitabilité auto-immune, myoclonie et myorythmie</h3>
<p>Dans l’<button class="w" data-k="r25-caspr2">hyperexcitabilité nerveuse périphérique auto-immune (anticorps anti-CASPR2, spectre clinique)</button>, les anticorps dirigés contre la protéine CASPR2 sont directement pathogènes. Le spectre comprend le syndrome crampes-fasciculations, le syndrome d’Isaacs, le syndrome de Morvan et l’encéphalite limbique. Il faut doser les anticorps anti-CASPR2 et anti-LGI1 plutôt que les anciens anticorps « VGKC » (canaux potassiques voltage-dépendants).</p>
<p>La <button class="w" data-k="r25-myoclonie">myoclonie corticale (hyperexcitabilité, dysfonction GABAergique, générateurs)</button> résulte d’une hyperexcitabilité corticale liée à une dysfonction des interneurones inhibiteurs GABAergiques. La myorythmie d’un stimulateur cardiaque résulte, plus simplement, de la stimulation directe du muscle pectoral par la sonde.</p>
<table class="t"><thead><tr><th>Phénomène normal</th><th>Perturbation</th><th>Manifestation</th><th>Conséquence pour la décision</th></tr></thead><tbody>
<tr><td>Tremblement physiologique invisible</td><td>Stimulation bêta-adrénergique (médicament, hyperthyroïdie, anxiété, fatigue)</td><td>Tremblement d’action ou postural, 8 à 15 Hz</td><td>Chercher et corriger la cause avant de traiter</td></tr>
<tr><td>Équilibre entre influx activateurs et inhibiteurs du motoneurone</td><td>Déséquilibre à l’effort, pertes hydro-électrolytiques, atteinte neurogène</td><td>Crampe douloureuse avec durcissement</td><td>Étirement en aigu ; bilan des causes symptomatiques</td></tr>
<tr><td>Activité motrice de repos silencieuse</td><td>Activité ectopique du système moteur</td><td>Fasciculation</td><td>Rechercher faiblesse, amyotrophie et hyperréflexie</td></tr>
<tr><td>Excitabilité du nerf périphérique contrôlée</td><td>Anticorps anti-CASPR2</td><td>Crampes, fasciculations, neuromyotonie</td><td>Doser CASPR2 et LGI1 ; immunothérapie si cause auto-immune</td></tr>
<tr><td>Inhibition GABAergique corticale</td><td>Dysfonction des interneurones</td><td>Myoclonie corticale</td><td>Bilan neurologique spécialisé</td></tr>
</tbody></table>
<p>Chaque ligne se lit de gauche à droite comme une chaîne causale, et la dernière colonne indique l’action qui en découle. La première ligne donne l’exemple le plus pratique : devant un tremblement apparu en quelques semaines chez une personne qui prend un bêta-mimétique, on revoit d’abord le traitement et la thyroïde avant de traiter le tremblement.</p>
<div class="key"><b>À retenir.</b> Tremblement physiologique renforcé : composante bêta-adrénergique périphérique. Crampe : décharge neurogène du motoneurone, arrêtée par l’étirement. Fasciculation : activité ectopique. Myoclonie corticale : perte d’inhibition GABAergique.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.2.1; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §2 et §6; <a href="https://doi.org/10.1136/jnnp-2017-315574" target="_blank" rel="noopener" data-reference-source="1">Fasciculation in amyotrophic lateral sclerosis: origin and pathophysiological relevance (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders (2017)</a>; <a href="https://doi.org/10.1097/WCO.0000000000001104" target="_blank" rel="noopener" data-reference-source="1">Autoimmune neuromyotonia (2022)</a>; <a href="https://doi.org/10.1097/WCO.0000000000000963" target="_blank" rel="noopener" data-reference-source="1">Neuromuscular hyperexcitability syndromes (2021)</a>; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>

<section class="ilot" id="r25-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>La recherche de cause suit le symptôme. Les tableaux ci-dessous regroupent les causes par mouvement ; les listes de médicaments, longues, se trouvent dans des fenêtres.</p>
<h3>4.1 Tremblement (R25.1)</h3>
<p>Les causes les plus fréquentes d’un tremblement physiologique renforcé sont un effet indésirable médicamenteux et l’<b>hyperthyroïdie</b> ; l’anxiété et la fatigue y contribuent. La liste des <button class="w" data-k="r25-med-tremblement">médicaments et toxiques inducteurs de tremblement (valproate, lithium, bêta-mimétiques, mercure…)</button> est longue, et le sevrage d’alcool ou de drogues en fait partie. Le tremblement intentionnel ou cérébelleux a pour cause la plus fréquente la <button class="w" data-k="r25-cerebelleux">sclérose en plaques (tremblement chez 25 à 50 % des patients)</button>.</p>
<h3>4.2 Crampes (R25.2)</h3>
<table class="t"><thead><tr><th>Famille</th><th>Éléments cités</th></tr></thead><tbody>
<tr><td>Facteurs de risque</td><td>Âge, sédentarité, alcool, maladies veineuses ou artérielles périphériques, carence en calcium ou en magnésium, insuffisance hépatique ou rénale sévère, lésions neurogènes périphériques, statines (risque relatif 1,09, décroissant après la première année), pneumopathies chroniques</td></tr>
<tr><td>Effort</td><td>Chaleur, sudation, perte de sel, trois premières semaines d’entraînement</td></tr>
<tr><td>Troubles hydro-électrolytiques</td><td>Hypovolémie, hyponatrémie, carence en calcium ou en magnésium</td></tr>
<tr><td>Atteinte neurologique</td><td>Neuropathies, radiculopathies, plexopathies, atteinte de la corne antérieure (séquelles de poliomyélite, sclérose latérale amyotrophique, maladie de Kennedy, amyotrophie spinale)</td></tr>
<tr><td>Endocrinopathies</td><td>Hypothyroïdie, hypoparathyroïdie, maladie d’Addison</td></tr>
<tr><td>Situations</td><td>Grossesse, hémodialyse, cirrhose, alcool, toxiques</td></tr>
<tr><td>Génétique</td><td>Ataxies spinocérébelleuses, neuropathies héréditaires, myotonies, canalopathies (Nav1.4), maladie de Fabry, syndrome HANAC, dystrophinopathies, maladie de McArdle</td></tr>
</tbody></table>
<p>Ce tableau classe les causes par niveau, de l’extérieur (effort, médicament) vers l’intérieur (nerf, corne antérieure, gène). Pour les statines, le risque relatif de 1,09 est modeste et il diminue après la première année : la statine reste un facteur parmi d’autres, et les sources lues ne donnent aucune conduite d’arrêt. Les <button class="w" data-k="r25-med-crampes">médicaments inducteurs de crampes (liste du tableau 1 de la ligne directrice)</button> sont nombreux ; les diurétiques, les bêta-agonistes, le lithium et les statines en font partie.</p>
<h3>4.3 Fasciculations (R25.3)</h3>
<p>Les fasciculations peuvent être bénignes, isolées ou associées à des crampes. Elles accompagnent aussi une maladie du motoneurone, des séquelles de poliomyélite, une thyrotoxicose ou une hyperparathyroïdie (rarement avec atrophie, faiblesse et hyperréflexie), une neuropathie motrice multifocale et la maladie de Kennedy (fasciculations péri-orales, gynécomastie, atrophie testiculaire). Un syndrome crampes-fasciculations porte des anticorps anti-VGKC ou anti-CASPR2 dans un tiers des cas ; de rares mutations des gènes TRPA1, RFC1 ou de l’alpha-galactosidase ont été décrites.</p>
<h3>4.4 Autres mouvements (R25.0, R25.8)</h3>
<p>Une <button class="w" data-k="r25-choree">chorée aiguë du sujet âgé (hyperglycémie non cétosique)</button> a pour cause principale une hyperglycémie ; le lupus, le syndrome des antiphospholipides, une endocrinopathie, la grossesse, un contraceptif, une polyglobulie ou la cocaïne sont d’autres causes. Une dystonie aiguë survient après un neuroleptique ou le métoclopramide, ou en lien avec un contraceptif ou une grossesse. Les myoclonies multifocales se rencontrent dans les encéphalopathies hépatique, rénale ou médicamenteuse, y compris la prégabaline en cas d’insuffisance rénale.</p>
<div class="trap"><span class="k">Piège</span> Chercher une maladie neurologique rare avant de relire l’ordonnance. La cause la plus fréquente d’un mouvement anormal en médecine interne est un médicament ou un trouble métabolique, et sa suppression change l’évolution.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.2.1 et §2.6.1; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §2.1 à §2.3 et tableau 1; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders (2017)</a>.</p>
</section>
<section class="ilot" id="r25-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire précise le mouvement, son contexte et sa temporalité. Les questions suivantes viennent de la ligne directrice pour le tremblement, de celle pour les crampes et des revues sur les fasciculations.</p>
<div class="two"><div class="card"><h4>Tremblement</h4><p>Date de début et évolution : quelques semaines à mois pour un tremblement physiologique renforcé, au moins trois ans pour un tremblement essentiel. Antécédents familiaux. Effet de l’alcool : il améliore 50 à 90 % des tremblements essentiels. Liste exhaustive des médicaments. Une instabilité debout qui disparaît assis ou couché évoque un <button class="w" data-k="r25-orthostatique">tremblement orthostatique (électromyogramme debout, 13 à 18 Hz)</button>.</p></div><div class="card"><h4>Crampes</h4><p>Situation déclenchante (nuit, effort), contexte familial, médicamenteux, sportif. Les crampes nocturnes du mollet sont typiques, et une douleur locale persiste souvent un jour ou plus. Soixante pour cent des patients avec un syndrome des jambes sans repos rapportent aussi des crampes : le <button class="w" data-k="r25-sjsr">syndrome des jambes sans repos (besoin de bouger, soulagé par le mouvement)</button> est à différencier. Pour les crampes des mains, penser au canal carpien, à une dystonie de fonction, à une maladie du motoneurone ou à une myotonie ; trois quarts des cirrhotiques ont des crampes des mains.</p></div></div>
<div class="two"><div class="card"><h4>Fasciculations</h4><p>Localisation (les mollets sont les plus fréquents dans la forme bénigne), faiblesse, perte de poids, troubles bulbaires. Ces trois derniers éléments, s’ils sont présents, changent la signification du symptôme.</p></div><div class="card"><h4>Limites de la source</h4><p>La fréquence relative des différents mouvements anormaux dans la population générale n’a pas été retrouvée dans les sources lues. Le cours ne peut donc pas classer les motifs de consultation par fréquence.</p></div></div>
<p>La logique est simple : l’anamnèse sépare un phénomène de contexte (effort, médicament, grossesse), un phénomène chronique et familial (tremblement essentiel) et un phénomène qui évoque une atteinte du motoneurone (fasciculation avec faiblesse ou troubles bulbaires). Chaque question oriente vers une famille de causes décrite dans l’îlot précédent.</p>
<div class="key"><b>À retenir.</b> Trois questions rentables : depuis quand et sur quel mode ? quels médicaments ? quel contexte (effort, famille, grossesse, dialyse, cirrhose) ?</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.1.1 et §2.2.1 et §2.7.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §1 et §2 et §4.1 et §4.2; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>.</p>
</section>
<section class="ilot" id="r25-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre état général, signes vitaux, puis signes ciblés. Il s’attache à la position dans laquelle le mouvement apparaît, car la condition d’activation sépare les tremblements. Le tableau récapitule les gestes de l’examen, ce qu’ils démasquent et la source.</p>
<table class="t"><thead><tr><th>Geste</th><th>Technique</th><th>Ce qu’il indique</th></tr></thead><tbody>
<tr><td>Tremblement de repos</td><td>Main pendante, détendue, sur l’accoudoir</td><td>Condition d’activation de repos</td></tr>
<tr><td>Tremblement postural</td><td>Bras tendus</td><td>Condition d’activation posturale</td></tr>
<tr><td>Tremblement cinétique</td><td>Mouvements de haut en bas, bras tendus</td><td>Condition d’activation cinétique</td></tr>
<tr><td>Tremblement intentionnel</td><td>Épreuve doigt-nez, transvasement d’eau</td><td>Tremblement cérébelleux ; IRM obligatoire</td></tr>
<tr><td>Suppression à l’initiation du mouvement</td><td>Observer le début du geste</td><td>Syndrome dopaminergique déficitaire</td></tr>
<tr><td>Signes du <button class="w" data-k="r25-fonctionnel">tremblement fonctionnel (distractibilité, entraînement, co-contraction)</button></td><td>Observer l’effet d’une distraction et la fréquence du tremblement pendant un autre mouvement</td><td>Début brutal, fluctuations, distractibilité, entraînement de fréquence, co-contraction : diagnostic positif</td></tr>
<tr><td>Chorée</td><td>Bras tendus, langue tirée ; tonus ; réflexes</td><td>Hypotonie, réflexes pendulaires, impersistance motrice, anosognosie</td></tr>
<tr><td>Dystonie</td><td>Observer posture, geste antagoniste, diffusion</td><td>Geste antagoniste, diffusion (overflow), mouvements en miroir</td></tr>
<tr><td>Fasciculation</td><td>Force, trophicité, réflexes, langue</td><td>Faiblesse, amyotrophie, réflexes vifs : maladie du motoneurone ; fasciculations bilatérales de la langue : fortement évocatrices de sclérose latérale amyotrophique</td></tr>
<tr><td>Crampe</td><td>Statut neurologique ciblé sur les causes symptomatiques</td><td>Indices de myopathie : « second souffle », raideur, réaction myotonique, faiblesse, hypertrophie, myoglobinurie</td></tr>
</tbody></table>
<p>Une phrase résume l’importance de la fasciculation : une fasciculation <b>sans</b> faiblesse, amyotrophie ni hyperréflexie oriente vers un syndrome bénin, même de début brutal. À l’inverse, une fasciculation avec l’un de ces trois signes impose une évaluation neurologique rapide. Les <button class="w" data-k="r25-mnemo">trois signes à chercher devant une fasciculation (aide pédagogique)</button> sont regroupés dans une fenêtre.</p>
<p>La sensibilité et la spécificité de ces signes n’ont pas été retrouvées dans les sources lues ; le cours donne donc leurs interprétations qualitatives sans valeur prédictive chiffrée.</p>
<div class="trap"><span class="k">Piège</span> Rassurer un patient qui présente des fasciculations sans avoir examiné la force, l’amyotrophie et les réflexes. La rassurance repose précisément sur l’absence de ces trois signes.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §1.1 et §2.8.1; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §3 et §4.1; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>; <a href="https://doi.org/10.1136/jnnp-2017-315574" target="_blank" rel="noopener" data-reference-source="1">Fasciculation in amyotrophic lateral sclerosis: origin and pathophysiological relevance (2017)</a>.</p>
