<template data-pop="r25-sjsr" data-title="Syndrome des jambes sans repos et crampes">
<div class="lab">Différence</div>
<p>Le syndrome des jambes sans repos est un besoin impérieux de bouger les jambes, soulagé par le mouvement, sans contraction douloureuse. La crampe est une contraction douloureuse avec durcissement.</p>
<div class="lab">Coexistence</div>
<p>Soixante pour cent des patients avec un syndrome des jambes sans repos rapportent aussi des crampes. Les crampes nocturnes sont à distinguer de ce syndrome dans le diagnostic différentiel de la ligne directrice.</p>
<div class="lab">Piège</div>
<p>Confondre crampes nocturnes et syndrome des jambes sans repos. La polysomnographie n’est pas nécessaire pour les crampes.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neurological society (2024)</a>; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §2.</p>
</template>
<template data-pop="r25-mnemo" data-title="Trois signes à chercher devant une fasciculation">
<div class="lab">Aide pédagogique, non critère officiel</div>
<p>Trois signes se cherchent systématiquement : <b>F</b>aiblesse, <b>A</b>myotrophie, <b>R</b>éflexes vifs. Le sigle « FAR » ne figure pas dans les sources : il aide seulement à retenir l’examen que les sources demandent.</p>
<div class="lab">Interprétation</div>
<p>Les trois absents orientent vers un syndrome bénin ; l’un des trois présent impose une évaluation neurologique rapide. Des fasciculations bilatérales de la langue suggèrent fortement une sclérose latérale amyotrophique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>; <a href="https://doi.org/10.1136/jnnp-2017-315574" target="_blank" rel="noopener" data-reference-source="1">Fasciculation in amyotrophic lateral sclerosis: origin and pathophysiological relevance (2017)</a>.</p>
</template>
<template data-pop="r25-fonctionnel" data-title="Tremblement fonctionnel">
<div class="lab">Signes positifs</div>
<p>Début brutal, facteur déclenchant, fluctuations, distractibilité, entraînement de la fréquence, co-contraction. Le diagnostic est positif et non d’exclusion.</p>
<div class="lab">Code</div>
<p>Le tremblement hystérique (F44.4) est exclu de R25.1.</p>
<div class="lab">Examens</div>
<p>Le DaT-SPECT peut aider en cas de doute avec un parkinsonisme ou un tremblement fonctionnel.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.8.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc R25–R29, catégorie R25</a>.</p>
</template>
<template data-pop="r25-dystonie-tetanie" data-title="Dystonie aiguë ou tétanie">
<div class="lab">Dystonie aiguë</div>
<p>Elle survient après un neuroleptique ou du métoclopramide, ou en lien avec un contraceptif ou une grossesse. Le bipéridène par voie intraveineuse est le traitement cité, répétable après 30 minutes.</p>
<div class="lab">Tétanie</div>
<p>Elle reflète une hypocalcémie (calcium inférieur à 2 mmol/L), une hypomagnésémie ou une hypokaliémie. On dose calcium, magnésium, potassium et parathormone. Les spasmes carpopédaux sont codés R29.0 et non R25.2.</p>
<div class="lab">Piège</div>
<p>Les deux produisent des spasmes ; seules l’anamnèse médicamenteuse et la biologie les séparent.</p>
<p class="src">Références : <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc R25–R29, catégorie R25</a>.</p>
</template>
<template data-pop="r25-tic-stereo" data-title="Tic, stéréotypie et tic fonctionnel">
<div class="lab">Tic</div>
<p>Mouvement ou son bref, soudain, non rythmique, précédé d’une sensation prémonitoire, suggestible et temporairement suppressible.</p>
<div class="lab">Stéréotypie et tic fonctionnel</div>
<p>La stéréotypie est un mouvement répétitif sans sensation prémonitoire. Le tic fonctionnel n’a pas non plus de sensation prémonitoire.</p>
<div class="lab">Code</div>
<p>Tics (F95) et stéréotypies (F98.4) sont exclus de R25.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener" data-reference-source="1">European clinical guidelines for Tourette syndrome and other tic disorders, version 2.0, Part I (2022)</a>; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc R25–R29, catégorie R25</a>.</p>
</template>
<template data-pop="r25-akathisie" data-title="Akathisie">
<div class="lab">Définition</div>
<p>Sensation interne désagréable avec besoin de bouger et agitation (déambulation, piétinement).</p>
<div class="lab">Différence avec le syndrome des jambes sans repos</div>
<p>L’akathisie est une agitation intérieure et motrice sans rythme circadien.</p>
<p class="src">Références : <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neurological society (2024)</a>.</p>
</template>
<template data-pop="r25-sla-fascic" data-title="Fasciculations et sclérose latérale amyotrophique">
<div class="lab">Signal d’alerte</div>
<p>Fasciculations avec faiblesse, amyotrophie ou signes pyramidaux, ou fasciculations bilatérales de la langue.</p>
<div class="lab">Action</div>
<p>Évaluation rapide par un neurologue expérimenté et électroneuromyogramme prioritaire. Aucun délai chiffré n’a été retrouvé.</p>
<div class="lab">Pronostic</div>
<p>La survie médiane est de 3 ans après le début, surtout par insuffisance respiratoire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11235832/" target="_blank" rel="noopener" data-reference-source="1">EAN guideline on the management of ALS in collaboration with ERN EURO-NMD (2024)</a>.</p>
</template>
<template data-pop="r25-benin" data-title="Fasciculations bénignes">
<div class="lab">Données</div>
<p>Une revue systématique de 3 études et 180 patients rapporte une persistance des fasciculations chez 98,3 % des patients après 8 mois à plusieurs années, une amélioration chez 51,7 % et une aggravation chez 4,1 %. Aucun patient n’a évolué vers une maladie du motoneurone. Le syndrome touche surtout les hommes jeunes.</p>
<div class="lab">Conduite</div>
<p>Information claire sur la bénignité, suivi clinique et neurophysiologique, orientation vers un psychologue si l’anxiété persiste.</p>
<div class="lab">Limite</div>
<p>Cette revue ne repose que sur trois études et n’a été lue qu’en résumé.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10072-024-07867-0" target="_blank" rel="noopener" data-reference-source="1">Clinical progression of benign fasciculation syndrome: a systematic literature review (2024)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>.</p>
</template>
<template data-pop="r25-bio-crampes" data-title="Biologie des crampes">
<div class="lab">Bilan de base</div>
<p>Hémogramme, électrolytes (sodium, potassium, magnésium, calcium), glycémie, créatinine, débit de filtration glomérulaire, urée, créatine kinase, aspartate aminotransférase, gamma-glutamyl transférase, TSH.</p>
<div class="lab">Bilan élargi sur suspicion</div>
<p>fT3, fT4, phosphate, vitamine D, parathormone, vitesse de sédimentation, hémoglobine glyquée, ferritine, zinc, albumine, électrophorèse, fonction surrénalienne, épreuve d’hyperglycémie provoquée, taux de médicaments, anticorps (antinucléaires, anti-cytoplasme des polynucléaires neutrophiles, Ro/La, gangliosides, canaux calciques voltage-dépendants, CASPR2, LGI1, GAD), alpha-galactosidase, lactate, test d’effort non ischémique au lactate, génétique.</p>
<div class="lab">Limite</div>
<p>Les valeurs normales ne sont pas données par les sources lues.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §4.1 et tableau 2.</p>
</template>
<template data-pop="r25-myopathie" data-title="Indices de myopathie métabolique">
<div class="lab">Indices cliniques</div>
<p>« Second souffle », raideur, réaction myotonique, faiblesse, hypertrophie, myoglobinurie.</p>
<div class="lab">Conduite</div>
<p>Créatine kinase, lactate, électroneuromyogramme. L’électromyogramme est silencieux dans la contracture myogène.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §3 et §4.1 et tableau 2.</p>
</template>
<template data-pop="r25-goldcoast" data-title="Critères de Gold Coast">
<div class="lab">Contenu</div>
<p>Atteinte du motoneurone central et périphérique dans au moins une région, ou périphérique dans au moins deux régions ; potentiels de fasciculation équivalents aux signes électromyographiques de dénervation-réinnervation ; progression ; exclusion des autres maladies.</p>
<div class="lab">Usage dans la leçon</div>
<p>Ils servent de drapeau rouge devant des fasciculations : la leçon n’enseigne pas le diagnostic de sclérose latérale amyotrophique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>.</p>
</template>
<template data-pop="r25-ssp" data-title="PROFILES : situations de départ">
<div class="lab">Correspondance</div>
<p>La situation 98 réunit les mouvements involontaires anormaux, le tremblement, le tic et l’incoordination ; les situations 96 (équilibre, chutes), 97 (démarche) et 103 (parésie) y sont voisines.</p>
<div class="lab">Limite</div>
<p>Cette correspondance est pédagogique, propre au dépôt, sans table officielle entre la CIM et PROFILES.</p>
<p class="src">Références : <a href="https://www.siwf.ch/files/pdf24/profiles_2017-broschuere.pdf" target="_blank" rel="noopener" data-reference-source="1">PROFILES 2017, situations de départ 96, 97, 98 et 103</a>.</p>
</template>
<template data-pop="r25-d-propranolol" data-title="Propranolol (Inderal®) dans le tremblement essentiel">
<div class="lab">Indication</div>
<p>Tremblement essentiel, autorisé en Suisse. La mise à jour de l’information professionnelle date de janvier 2023.</p>
<div class="lab">Posologie</div>
<p>Dose initiale de 40 mg, 2 à 3 fois par jour ; augmentation hebdomadaire possible ; dose usuelle de 80 à 160 mg/jour.</p>
<div class="lab">Contre-indications</div>
<p>Asthme ou bronchospasme, bradycardie, hypotension, insuffisance cardiaque décompensée, bloc auriculo-ventriculaire du deuxième ou du troisième degré, maladie du sinus, troubles circulatoires périphériques graves.</p>
<div class="lab">Mécanisme et preuves</div>
<p>Les sections lues de l’information n’exposent ni le mécanisme ni les essais. L’expérience d’infusion artérielle montre une composante bêta-adrénergique périphérique du tremblement physiologique renforcé.</p>
<div class="lab">Limites</div>
<p>Les effets indésirables, interactions, surveillance et adaptations rénales ou hépatiques n’ont pas été lus : à consulter avant toute prescription.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Inderal®, mise à jour janvier 2023 (AmiKo GTIN 7680317060015)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.2.1.</p>
</template>
<template data-pop="r25-d-magnesium" data-title="Aspartate de magnésium (Magnesiocard®)">
<div class="lab">Information suisse (avril 2025)</div>
<p>Indications citées : crampes du mollet, myoclonies, impatiences. Dose moyenne de 4,5 mg/kg/jour, jusqu’à 9 mg/kg/jour en cas de carence ; adulte : 2 comprimés pelliculés (2,5 mmol) 3 fois par jour. Contre-indications : débit de filtration glomérulaire inférieur à 30 mL/min, exsiccose. Prudence en insuffisance rénale légère à modérée (accumulation). Effets indésirables occasionnels : diarrhée, selles molles. Utilisable pendant la grossesse et l’allaitement selon l’information.</p>
<div class="lab">Ligne directrice</div>
<p>Efficacité non démontrée pour les crampes idiopathiques (revue Cochrane, 5 études, 100 à 520 mg/jour) ; correction d’une carence mesurée ; ne pas utiliser en insuffisance rénale, troubles du rythme, myasthénie ; diarrhée dose-dépendante.</p>
<div class="lab">Voir aussi</div>
<p>La <button class="w" data-k="r25-div-magnesium">divergence entre ces deux sources</button> explique pourquoi l’autorisation n’établit pas l’efficacité.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Magnesiocard®, mise à jour avril 2025 (AmiKo GTIN 7680457261181)</a>; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §5.2.</p>
</template>
<template data-pop="r25-div-magnesium" data-title="Divergence : magnésium et crampes du mollet">
<div class="lab">Les deux positions</div>
<p>L’information professionnelle suisse de Magnesiocard® (avril 2025) mentionne les crampes du mollet parmi ses indications. La ligne directrice allemande coapprouvée par la Société suisse de neurologie (2023, publiée en 2024) juge l’efficacité du magnésium non démontrée sur les crampes idiopathiques.</p>
<div class="lab">Règle de choix</div>
<p>Pour une question d’efficacité clinique, la source primaire applicable la plus récente l’emporte : ici, la ligne directrice. L’autorisation de mise sur le marché fonde la possibilité de prescrire, non la preuve d’efficacité.</p>
<div class="lab">Texte en vigueur</div>
<p>Les deux textes sont actuellement en vigueur (l’information de 2025, la ligne directrice valable jusqu’en novembre 2028). Aucun texte ancien n’est en jeu dans ce différend.</p>
<div class="lab">Conduite</div>
<p>Corriger une carence mesurée ; ne pas promettre d’efficacité aux crampes idiopathiques ; respecter les contre-indications rénales.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Magnesiocard®, mise à jour avril 2025 (AmiKo GTIN 7680457261181)</a>; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>.</p>
</template>
<template data-pop="r25-d-quinine" data-title="Quinine et crampes">
<div class="lab">Preuve</div>
<p>Seul traitement suffisamment démontré : réduction de 28 % des épisodes et de 10 % de l’intensité.</p>
<div class="lab">Indication et posologie</div>
<p>Crampes très douloureuses ou très fréquentes, perturbant le sommeil, après échec des mesures non médicamenteuses ; 200 mg après le souper, jusqu’à 400 mg ; arrêt si inefficace en 4 semaines ; réévaluation tous les 3 mois.</p>
<div class="lab">Contre-indications et risques</div>
<p>Grossesse, allaitement, insuffisance hépatique, bradycardie, arythmie. Allongement de l’intervalle QT ; thrombopénie, purpura thrombotique thrombocytopénique, syndrome hémolytique et urémique, coagulation intravasculaire disséminée (surtout pendant les deux premières semaines) ; troubles visuels et auditifs. Non recommandée dans les crampes d’effort.</p>
<div class="lab">Statut suisse</div>
<p>Aucune spécialité de quinine n’a été trouvée dans AmiKo (recherches « chinin », « quinine », « hydrochinin », « chininsulfat »). L’absence dans cette base ne prouve pas l’absence d’autorisation : à vérifier sur la liste des préparations autorisées par Swissmedic.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §5.2 et §6.2; <a href="https://amiko.oddb.org" target="_blank" rel="noopener" data-reference-source="1">Recherche AmiKo d’une spécialité suisse de quinine (15 octobre 2026)</a>.</p>
</template>
<template data-pop="r25-d-sla" data-title="Crampes de la sclérose latérale amyotrophique">
<div class="lab">Recommandation européenne (2024)</div>
<p>Envisager les bloqueurs sodiques (ranolazine, quinine, mexilétine, carbamazépine), la gabapentine, la prégabaline ou le baclofène. La quinine est proposée à faible dose (100 à 200 mg/jour) avec surveillance cardiaque.</p>
<div class="lab">Limite</div>
<p>Plusieurs recommandations de cette ligne directrice sont adaptées de recommandations britanniques. Les informations professionnelles suisses de ces médicaments n’ont pas été lues dans ce dossier.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11235832/" target="_blank" rel="noopener" data-reference-source="1">EAN guideline on the management of ALS in collaboration with ERN EURO-NMD (2024)</a>, recommandation 6b.</p>
</template>
<template data-pop="r25-d-biperidene" data-title="Bipéridène et dystonie aiguë">
<div class="lab">Fait</div>
<p>Dystonie aiguë après neuroleptique ou métoclopramide : bipéridène par voie intraveineuse, répétable après 30 minutes.</p>
<div class="lab">Limite</div>
<p>L’information professionnelle suisse de ce médicament a été lue dans un autre dossier du cycle 35 (leçon G21) et n’a pas été relue ici : dose, contre-indications et effets indésirables ne sont donc pas repris.</p>
<p class="src">Références : <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>
</template>
<template data-pop="r25-lacunes" data-title="Limites de la leçon">
<div class="lab">Onze lacunes conservées</div>
<ol>
<li>Épidémiologie suisse : aucune donnée trouvée (le site de Swiss Medical Forum était inaccessible).</li>
<li>Fréquence relative des mouvements anormaux en soins primaires.</li>
<li>Sensibilité et spécificité des signes cliniques.</li>
<li>Délais chiffrés de prise en charge des drapeaux rouges.</li>
<li>Valeurs normales des électrolytes.</li>
<li>Statut suisse de la quinine (AmiKo sans résultat).</li>
<li>Information suisse du bipéridène non relue.</li>
<li>Remboursement par la liste des spécialités non vérifié.</li>
<li>Données pédiatriques propres à R25.</li>
<li>Déclaration à l’Office fédéral de la santé publique du tétanos, aptitude à la conduite, assurance-invalidité, Suva.</li>
<li>Article de la Revue Médicale Suisse sur les tremblements médicamenteux, annoncé mais non retrouvé.</li>
</ol>
<p>Ces points ne sont pas comblés dans la leçon.</p>
</template>
<template data-pop="pareto-r25-bases" data-title="Pareto — Bases du cours">
<p class="ratio" data-cover="r25-0,r25-1,r25-2,r25-3"></p><ul><li>R25 est un code de symptôme : nommer le mouvement, chercher la cause traitable, écarter le danger, recoder.</li><li>Définir chaque mouvement par son critère discriminant ; ne jamais classer un tremblement sur sa seule fréquence.</li><li>Crampes très fréquentes en population, myoclonies persistantes rares.</li><li>Tremblement physiologique renforcé : composante bêta-adrénergique ; crampe : décharge neurogène arrêtée par l’étirement ; fasciculation : activité ectopique.</li></ul>
</template>
<template data-pop="pareto-r25-clinique" data-title="Pareto — Anamnèse, examen et démarche">
<p class="ratio" data-cover="r25-4,r25-5,r25-6,r25-7"></p><ul><li>Médicaments et hyperthyroïdie d’abord pour le tremblement ; relire l’ordonnance pour les crampes.</li><li>Fasciculation : examiner force, trophicité et réflexes avant de rassurer.</li><li>Le tremblement fonctionnel est un diagnostic positif ; l’orthostatique demande l’électromyogramme debout.</li><li>Différentiel par gravité : tétanos et homme raide, motoneurone, myopathie métabolique, tétanie, puis les causes bénignes.</li></ul>
</template>
<template data-pop="pareto-r25-pec" data-title="Pareto — Prise en charge, suivi et situations">
