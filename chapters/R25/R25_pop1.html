<template data-pop="r25-codage" data-title="Codage CIM-10-GM de R25">
<div class="lab">Ce que dit la classification</div>
<p>La catégorie R25, « Mouvements involontaires anormaux », appartient au bloc R25–R29 de la CIM-10-GM 2024 publiée par l’institut allemand BfArM. Elle exclut les troubles moteurs spécifiques (G20–G26), les stéréotypies motrices (F98.4) et les tics (F95). Les libellés français sont ceux de l’Office fédéral de la statistique, lus dans le registre du dépôt et non dans le fichier brut de l’Office.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé</th><th>Précisions</th><th>Traitement dans la leçon</th></tr></thead><tbody>
<tr><td>R25.0</td><td>Mouvements anormaux de la tête</td><td>—</td><td>Tremblement de la tête et de la voix : toxine botulique ou stimulation cérébrale profonde si tremblement essentiel sévère</td></tr>
<tr><td>R25.1</td><td>Tremblement, sans précision</td><td>Exclut la chorée non précisée (G25.5), le tremblement essentiel (G25.0), hystérique (F44.4) et intentionnel (G25.2)</td><td>Tri du tremblement : îlots 3 à 9</td></tr>
<tr><td>R25.2</td><td>Crampe et spasme</td><td>Exclut les spasmes carpopédaux (R29.0) et les spasmes infantiles (G40.4)</td><td>Crampes musculaires : îlots 3 à 11</td></tr>
<tr><td>R25.3</td><td>Fasciculation</td><td>Inclut les secousses sans précision</td><td>Fasciculations bénignes et maladie du motoneurone</td></tr>
<tr><td>R25.8</td><td>Mouvements involontaires anormaux, autres et non précisés</td><td>—</td><td>Mouvements inclassables, myorythmies, myoclonies non précisées</td></tr>
</tbody></table>
<div class="lab">Règle pratique</div>
<p>Le code R25 est provisoire : il décrit le symptôme tant que la cause n’est pas connue. Il est remplacé dès que le diagnostic est posé.</p>
<div class="lab">Limite</div>
<p>Le catalogue du dépôt reste en CIM-10-GM 2024 ; la correspondance avec la CIM-11 n’est pas établie.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-r25-r29.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc R25–R29</a>; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener" data-reference-source="1">CIM-10-GM 2024, libellés français</a>.</p>
</template>
<template data-pop="r25-mouvements" data-title="Distinguer les mouvements anormaux">
<div class="lab">Ce qui sépare les mouvements</div>
<p>Le <b>tremblement</b> est rythmique et oscillatoire. La <b>myoclonie</b> est une secousse brève, soudaine, d’environ 100 ms : positive si une bouffée d’activité musculaire la produit, négative si une interruption d’activité la cause (astérixis). La <b>chorée</b> est faite de mouvements irréguliers, imprévisibles et fluides, majorés par le stress ; le <b>ballisme</b> est une chorée proximale, ample et explosive. La <b>dystonie</b> associe contraction simultanée des agonistes et des antagonistes, posture soutenue et geste antagoniste. Le <b>tic</b> est bref, soudain, non rythmique, précédé d’une sensation prémonitoire et temporairement suppressible.</p>
<div class="lab">Pourquoi ces critères</div>
<p>Chaque critère se vérifie à l’examen : l’oscillation régulière pour le tremblement, la brièveté pour la myoclonie, la posture soutenue avec geste antagoniste pour la dystonie, la sensation prémonitoire pour le tic.</p>
<div class="lab">Piège</div>
<p>Quand la clinique hésite entre tremblement et myoclonie, l’électromyogramme de surface tranche : activité rythmique pour le tremblement, bouffées irrégulières pour la myoclonie.</p>
<div class="lab">Erreur fréquente</div>
<p>Appeler « tic » une stéréotypie : elle n’est pas précédée d’une sensation prémonitoire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener" data-reference-source="1">European clinical guidelines for Tourette syndrome and other tic disorders, version 2.0, Part I (2022)</a>.</p>
</template>
<template data-pop="r25-mds" data-title="Classification du tremblement (Movement Disorder Society, 2018)">
<div class="lab">Deux axes</div>
<p>L’axe 1 est clinique : âge de début, antécédents familiaux, évolution, topographie, condition d’activation, signes associés, examens. L’axe 2 est étiologique : tremblement acquis, génétique ou idiopathique. La première étape décrit, la seconde explique.</p>
<div class="lab">Conditions d’activation et fréquence</div>
<p>Le tremblement de repos se voit membre détendu ; le tremblement d’action regroupe le postural, l’orthostatique, le cinétique simple, l’intentionnel, le tremblement spécifique d’une tâche et l’isométrique. La fréquence se range en moins de 4 Hz, 4 à 8 Hz, 8 à 12 Hz et plus de 12 Hz. La plupart des tremblements pathologiques sont entre 4 et 8 Hz.</p>
<div class="lab">Piège</div>
<p>La fréquence seule est rarement diagnostique : la plupart des tremblements pathologiques occupent la même plage de 4 à 8 Hz.</p>
<div class="lab">Limite</div>
<p>La ligne directrice allemande, autrichienne et suisse utilise des bornes légèrement différentes (moins de 4 Hz, 4 à 7 Hz, plus de 8 Hz) ; les deux découpages coexistent.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §1.1.</p>
</template>
<template data-pop="r25-physio-tremblement" data-title="Le tremblement physiologique renforcé">
<div class="lab">Fait</div>
<p>Un tremblement physiologique existe chez tout le monde, discret et habituellement invisible. Il devient visible, donc « pathologique » au sens pragmatique, quand il est assez ample pour être vu à l’œil nu. Le tremblement physiologique renforcé oscille entre 8 et 15 Hz.</p>
<div class="lab">Preuve du mécanisme</div>
<p>L’adrénaline injectée par voie intraveineuse augmente l’amplitude du tremblement. Le propranolol perfusé dans l’artère du membre étudié bloque cet effet de ce côté seulement, ce qui montre l’existence d’une composante bêta-adrénergique périphérique.</p>
<div class="lab">Conséquence clinique</div>
<p>Les causes les plus fréquentes sont les médicaments et l’hyperthyroïdie ; l’anxiété et la fatigue y contribuent. On corrige la cause avant de traiter le tremblement.</p>
<div class="lab">Limite</div>
<p>L’expérience décrit un mécanisme, non une indication thérapeutique : le propranolol n’est proposé qu’au cas par cas pour un tremblement physiologique renforcé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.2.1; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>
</template>
<template data-pop="r25-crampe-meca" data-title="Mécanisme de la crampe">
<div class="lab">Où naît la crampe</div>
<p>La crampe est déclenchée de façon neurogène dans les axones moteurs efférents. Les afférences (fuseaux neuromusculaires et organes tendineux, fibres Ia, Ib et II), les circuits spinaux et les efférences centrales y participent. L’électromyogramme enregistre des potentiels d’action de configuration normale à haute fréquence.</p>
<div class="lab">Facteurs</div>
<p>Le raccourcissement du muscle facilite la crampe. Les muscles qui franchissent plusieurs articulations sont plus touchés. À l’effort, l’hypothèse dominante est un déséquilibre entre influx activateurs et inhibiteurs sur le motoneurone alpha, en plus de pertes d’eau et d’électrolytes.</p>
<div class="lab">Limite</div>
<p>La ligne directrice décrit des voies qui participent à la crampe, et non une chaîne causale démontrée de bout en bout.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §2 et §6.</p>
</template>
<template data-pop="r25-etirement" data-title="Pourquoi l’étirement arrête la crampe">
<div class="lab">Mécanisme</div>
<p>L’étirement augmente l’activité inhibitrice des organes tendineux de Golgi et diminue l’activité des motoneurones du muscle étiré. Cette inhibition est dite autogène : elle part du muscle lui-même.</p>
<div class="lab">Conduite</div>
<p>En aigu, étirement statique du muscle ou contraction des antagonistes. En prévention des crampes nocturnes, étirements des mollets avant le coucher : un essai de 80 patients a montré une baisse de 1,2 épisode par nuit et de 1,3 point sur 10 sur l’intensité, mais les autres essais sont discordants.</p>
<div class="lab">Erreur fréquente</div>
<p>Présenter l’étirement comme prouvé en prévention : l’évidence est discordante.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §5.1 et §6.1.</p>
</template>
<template data-pop="r25-fascic" data-title="La fasciculation">
<div class="lab">Définition et origine</div>
<p>Une fasciculation est une contraction spontanée brève d’un petit nombre de fibres musculaires, visible comme un frémissement sous la peau. Elle traduit une activité ectopique du système moteur. Dans la sclérose latérale amyotrophique, l’origine est proximale au début, puis distale avec le bourgeonnement des axones de réinnervation.</p>
<div class="lab">Distinction</div>
<p>La fasciculation se différencie des trains de décharges répétitives de la neuromyotonie.</p>
<div class="lab">Conséquence</div>
<p>Une fasciculation sans faiblesse, amyotrophie ni hyperréflexie oriente vers un syndrome bénin, même de début brutal.</p>
<div class="lab">Limite</div>
<p>Cette synthèse repose sur un résumé de revue : la source n’a pas été lue en texte intégral.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/jnnp-2017-315574" target="_blank" rel="noopener" data-reference-source="1">Fasciculation in amyotrophic lateral sclerosis: origin and pathophysiological relevance (2017)</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10796809/" target="_blank" rel="noopener" data-reference-source="1">de Carvalho M., Swash M., Diagnosis and differential diagnosis of ALS, 2023</a>.</p>
</template>
<template data-pop="r25-caspr2" data-title="Hyperexcitabilité nerveuse auto-immune">
<div class="lab">Fait</div>
<p>Les anticorps dirigés contre CASPR2 sont directement pathogènes. Ils définissent un spectre : syndrome crampes-fasciculations, syndrome d’Isaacs, syndrome de Morvan, encéphalite limbique.</p>
<div class="lab">Conduite</div>
<p>Doser CASPR2 et LGI1 plutôt que les anticorps « VGKC ». Si la cause est auto-immune, l’immunothérapie comprend corticoïdes, immunoglobulines par voie intraveineuse, échanges plasmatiques et rituximab. Dans le syndrome crampes-fasciculations, la carbamazépine est efficace.</p>
<div class="lab">Limite</div>
<p>Les sources sont deux résumés de revues récentes et un résumé ancien (2005) ; les anticorps anti-VGKC y sont désormais remplacés par anti-CASPR2 et anti-LGI1.</p>
<p class="src">Références : <a href="https://doi.org/10.1097/WCO.0000000000001104" target="_blank" rel="noopener" data-reference-source="1">Autoimmune neuromyotonia (2022)</a>; <a href="https://doi.org/10.1097/WCO.0000000000000963" target="_blank" rel="noopener" data-reference-source="1">Neuromuscular hyperexcitability syndromes (2021)</a>; <a href="https://pubmed.ncbi.nlm.nih.gov/16340924/" target="_blank" rel="noopener" data-reference-source="1">Lagueny A., Le syndrome crampes-fasciculations (2005)</a>; <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §12.</p>
</template>
<template data-pop="r25-myoclonie" data-title="La myoclonie">
<div class="lab">Définition et durée</div>
<p>Secousse brève, soudaine, en éclair, d’environ 100 ms (jusqu’à 300 ms en position axiale). Positive ou négative selon qu’une bouffée d’activité musculaire ou un silence la produit.</p>
<div class="lab">Générateurs</div>
<p>La classification anatomique distingue les myoclonies corticales, sous-corticales, segmentaires et périphériques. La myoclonie corticale résulte d’une hyperexcitabilité par dysfonction des interneurones inhibiteurs GABAergiques. Les myoclonies multifocales se voient dans les encéphalopathies hépatique, rénale et médicamenteuse, y compris sous prégabaline en insuffisance rénale.</p>
<div class="lab">Fréquence</div>
<p>Les myoclonies pathologiques persistantes ont une incidence d’environ 1 pour 100 000 personnes-années.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders (2017)</a>; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>
</template>
<template data-pop="r25-med-tremblement" data-title="Médicaments et toxiques inducteurs de tremblement">
<div class="lab">Médicaments</div>
<p>Valproate, carbamazépine, phénytoïne, tétrabénazine, antidépresseurs, sympathomimétiques, bêta-2-mimétiques, lithium, neuroleptiques, métoclopramide, amiodarone, hormones thyroïdiennes, certains anticancéreux, sevrage d’alcool ou de drogues. En médecine interne, la revue suisse ajoute la caféine, la théine, les corticoïdes, les tricycliques et les immunosuppresseurs.</p>
<div class="lab">Toxiques</div>
<p>Mercure, plomb, manganèse, arsenic, monoxyde de carbone, toluène.</p>
<div class="lab">Conduite</div>
<p>Établir la liste exhaustive des médicaments à l’anamnèse, car la suppression de la cause est le traitement.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors (Movement Disorder Society, 2018)</a>; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>
</template>
<template data-pop="r25-cerebelleux" data-title="Tremblement intentionnel et cérébelleux">
<div class="lab">Fait</div>
<p>La sclérose en plaques est la cause la plus fréquente du tremblement intentionnel ou cérébelleux ; 25 à 50 % des patients atteints de sclérose en plaques ont un tremblement.</p>
<div class="lab">Examen</div>
<p>Épreuve doigt-nez ou transvasement d’eau. L’IRM est obligatoire devant un tremblement cérébelleux.</p>
<div class="lab">Piège</div>
<p>Un tremblement de début brutal ou aggravé par paliers exclut le tremblement essentiel.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.6.1 et §1.1.</p>
</template>
<template data-pop="r25-med-crampes" data-title="Médicaments inducteurs de crampes">
<div class="lab">Liste du tableau 1</div>
<p>Inhibiteurs de l’acétylcholinestérase, amiodarone, amphétamines, bêta-agonistes, bêtabloquants, inhibiteurs calciques (nifédipine), ciclosporine, cimétidine, cisplatine, diurétiques, donépézil, fibrates, imatinib, insuline, contraceptifs, corticoïdes, lithium, myorelaxants dépolarisants, naproxène, acide nicotinique, opioïdes, pénicillamine, phénothiazines, pyrazinamide, raloxifène, sévélamer, sirolimus, statines, tamoxifène, tériparatide, testostérone, tolcapone, vinca-alcaloïdes.</p>
<div class="lab">Conduite</div>
<p>Relire l’ordonnance devant toute crampe symptomatique. Pour les statines, le risque relatif est de 1,09 et diminue après la première année.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-037l_S1_Crampi-Muskelkrampf_2024-02.pdf" target="_blank" rel="noopener" data-reference-source="1">Crampi/Muskelkrämpfe, S1-Leitlinie, AWMF 030/037, version 6.0 (2024)</a>, §2.1 et tableau 1.</p>
</template>
<template data-pop="r25-choree" data-title="Chorée aiguë du sujet âgé">
<div class="lab">Cause principale</div>
<p>L’hyperglycémie non cétosique, avec une glycémie de 25 à 30 mmol/L, est la cause principale de chorée aiguë après 65 ans. D’autres causes : lupus, syndrome des antiphospholipides, endocrinopathie, grossesse, contraceptif, polyglobulie, cocaïne.</p>
<div class="lab">Conduite</div>
<p>Corriger la glycémie. La chorée expose à un épuisement métabolique et cardiorespiratoire.</p>
<div class="lab">Limite</div>
<p>La prise en charge pharmacologique d’une chorée non huntingtonienne n’est pas détaillée dans les sources de cette leçon.</p>
<p class="src">Références : <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener" data-reference-source="1">Ghika J., Mouvements anormaux et médecine interne, Revue Médicale Suisse 2018</a>.</p>
</template>
<template data-pop="r25-orthostatique" data-title="Tremblement orthostatique">
<div class="lab">Clinique</div>
<p>Instabilité debout qui disparaît assis ou couché.</p>
<div class="lab">Examen indispensable</div>
<p>L’électromyogramme des jambes debout montre une activité de 13 à 18 Hz. Sans cet examen, le diagnostic est manqué.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie, AWMF 030/011 (2022)</a>, §2.7.1.</p>
</template>
