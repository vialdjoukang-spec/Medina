<template data-pop="e11-score2d" data-title="Catégories de risque cardiovasculaire du diabétique (Société européenne de cardiologie 2023)"><p>Chez un adulte atteint de diabète de type 2, la maladie athéroscléreuse ou une atteinte sévère d’organe impose directement un risque très élevé. En leur absence, SCORE2-Diabetes estime un risque cardiovasculaire à dix ans ; ses quatre catégories sont présentées ci-dessous.</p><table class="t"><tr><th>Catégorie</th><th>Condition <button class="w" data-k="e11-gl-14">ESC</button> 2023</th></tr><tr><td>Faible</td><td>SCORE2-Diabetes &lt; 5 %</td></tr><tr><td>Modéré</td><td>≥ 5 et &lt; 10 %</td></tr><tr><td>Élevé</td><td>≥ 10 et &lt; 20 %</td></tr><tr><td>Très élevé</td><td>≥ 20 %, ou maladie athéroscléreuse avérée, ou atteinte sévère d’organe cible</td></tr></table><p>L’atteinte sévère d’organe cible correspond à un <button class="w" data-k="e11-gl-16">DFG</button> &lt; 45 mL/min/1,73 m² quelle que soit l’albuminurie, à un <button class="w" data-k="e11-gl-16">DFG</button> de 45 à 59 mL/min/1,73 m² avec une albuminurie <button class="w" data-k="e11-gl-21">A2</button>, à une albuminurie <button class="w" data-k="e11-gl-22">A3</button> ou à une atteinte microvasculaire d’au moins trois territoires. Le modèle est validé de 40 à 69 ans sans maladie athéroscléreuse ni atteinte sévère. Il combine facteurs usuels et âge au diagnostic, HbA1c, <button class="w" data-k="e11-gl-16">DFG</button> ; ce n’est pas un quotient simple. On utilise l’outil validé pour la région de risque et ses unités, sans reconstruire des coefficients de mémoire. Ces frontières fixent l’intensité de prévention, pas la probabilité de chaque événement chez un individu.</p><div class="key"><b>Conséquence.</b> La catégorie fixe la cible de cholestérol <button class="w" data-k="e11-proxy-ldl">LDL</button> et l’intensité de la prévention ; la recommandation suisse de 2023 souligne le risque souvent élevé ; le score européen de 2023 distingue néanmoins quatre catégories et évite de classer tout patient de la même façon.</div><p class="src">Références : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, tableau 7</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p><p><button class="w" data-k="e11-score2-methode">Bases, données, unités et étapes de SCORE2-Diabetes</button>.</p></template>
<template data-pop="e11-insulinoresistance" data-title="Insulinorésistance"><p>L’insulinorésistance est une réponse diminuée des cellules à l’insuline. Le muscle squelettique en est le principal site extrapancréatique : il capte moins de glucose parce que le transporteur GLUT4 migre mal vers la membrane. Le tissu adipeux résistant libère des acides gras libres, et le foie, qui ne freine plus sa production de glucose, entretient l’hyperglycémie à jeun. L’obésité viscérale et l’inactivité physique en sont les causes principales.</p><div class="key"><b>Limite.</b> Une insulinémie normale ne prouve pas une sécrétion suffisante : face à une résistance extrême, même une insulinémie « normale » ne maintient plus la glycémie (SSED 2023).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-type1-lada" data-title="Diabète de type 1 et LADA chez l’adulte"><p>Le diabète de type 1 résulte d’une destruction auto-immune des cellules β, avec un déficit absolu en insuline ; il représente 5 à 10 % des diabètes (<button class="w" data-k="e11-gl-14">ESC</button> 2023). Il peut débuter à tout âge. Chez l’adulte, sa forme lente, dite LADA, est un diabète auto-immun d’évolution lente (<button class="w" data-k="e11-gl-14">ESC</button> 2023). Une évolution brève, des symptômes osmotiques et un amaigrissement le suggèrent ; les anticorps anti-<button class="w" data-k="e11-gl-24">GAD</button>, anti-<button class="w" data-k="e11-gl-17">IA2</button> ou anti-<button class="w" data-k="e11-proxy-znt8">ZnT8</button> le confirment, mais ils manquent chez 5 à 10 % des patients.</p><div class="key"><b>Conséquence.</b> Le traitement est l’insuline. Une « lune de miel » de plus de cinq ans doit faire reconsidérer le type de diabète.</div><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2</a>.</p></template>
<template data-pop="e11-mody" data-title="Diabète monogénique (MODY)"><p>Le MODY est un diabète monogénique. Une hyperglycémie chez un sujet jeune, avec sécrétion d’insuline conservée, sans auto-anticorps et avec des cas sur plusieurs générations doit conduire à un avis spécialisé ; aucun seuil isolé de peptide C ne prouve un MODY.</p><p>La SSED 2023 distingue les MODY 1 et 3, qui peuvent répondre aux sulfonylurées, du MODY 2 lié à la glucokinase, dont la conduite diffère. Le résultat génétique et le contexte, notamment une grossesse, guident la conduite ; il ne faut pas transposer le traitement courant du type 2 à toute forme monogénique.</p><div class="key"><b>Conséquence.</b> Le médecin demande un avis diabétologique et génétique lorsque l’histoire familiale et le phénotype le suggèrent. Un tableau de carence insulinique exige un traitement immédiat, sans attendre la classification définitive.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, déficit insulinique et diabètes monogéniques</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2</a>.</p></template>
<template data-pop="e11-sousgroupes" data-title="Sous-groupes du diabète de l’adulte"><p>Une analyse de 8980 diabétiques suédois nouvellement diagnostiqués a défini cinq groupes à partir de six variables : anticorps anti-<button class="w" data-k="e11-gl-24">GAD</button>, âge au diagnostic, IMC, HbA1c, fonction β et insulinorésistance. Le groupe le plus insulinorésistant avait davantage de néphropathie, le groupe insulinodéficient davantage de rétinopathie. La SSED en résume les proportions : environ 6 % de types 1 méconnus, 18 % de déficits insuliniques sans anticorps, 15 % d’insulinorésistances sévères, 20 % de diabètes liés à l’obésité et 40 % liés à l’âge.</p><div class="key"><b>Limite.</b> Cette classification guide la réflexion ; elle n’est pas un critère diagnostique officiel.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29503172/" target="_blank" rel="noopener">Ahlqvist et al., 2018</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-masld" data-title="Stéatose hépatique associée à une dysfonction métabolique"><p>La MASLD associe une stéatose hépatique à au moins un facteur de risque cardiométabolique, après exclusion d’une consommation importante d’alcool et des autres causes. Elle touche plus de 70 % des diabétiques de type 2 ; le consensus 2026 rapporte aussi une stéatohépatite chez plus de la moitié ; ce chiffre de population ne prédit pas une évolution individuelle. Le stade de fibrose, surtout à partir du stade 2, détermine la mortalité hépatique, cardiovasculaire et globale.</p><div class="key"><b>Conséquence.</b> La perte de poids est le traitement de base ; les agonistes du <button class="w" data-k="e11-gl-13">GLP-1</button> et la pioglitazone ont des preuves histologiques, alors que les inhibiteurs du SGLT2 ne se choisissent pas pour le foie (ADA/EASD 2026).</div><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-glucolipotox" data-title="Glucolipotoxicité"><p>Dans l’obésité, l’excès d’acides gras saturés et l’hyperglycémie lèsent la cellule β. Ils provoquent un stress du réticulum endoplasmique, activent une réponse aux protéines mal repliées qui peut conduire à l’apoptose et génèrent un stress oxydant. La synthèse accrue de proinsuline et de polypeptide amyloïde des îlots aggrave le mauvais repliement ; l’interleukine 1β attire des macrophages dans l’îlot.</p><div class="key"><b>Conséquence.</b> L’hyperglycémie altère la cellule β qui la provoque. C’est pourquoi, après la correction d’une hyperglycémie majeure par l’insuline, celle-ci peut parfois être arrêtée chez un diabétique de type 2 (SSED 2023).</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a>.</p></template>
<template data-pop="e11-incretine" data-title="Effet incrétine"><p>Le glucose pris par la bouche déclenche une sécrétion d’insuline deux à trois fois plus forte que le même glucose perfusé. Le <button class="w" data-k="e11-proxy-gip">GIP</button>, des cellules K de l’intestin proximal, et le <button class="w" data-k="e11-gl-13">GLP-1</button>, des cellules L de l’intestin distal, en sont responsables. Dans le diabète de type 2, cet effet est diminué ou absent, surtout parce que la cellule β répond mal au <button class="w" data-k="e11-proxy-gip">GIP</button> ; le <button class="w" data-k="e11-gl-13">GLP-1</button> donné à dose pharmacologique garde ses effets insulinotrope et glucagonostatique.</p><div class="key"><b>Conséquence.</b> Ce constat fonde les agonistes du <button class="w" data-k="e11-gl-13">GLP-1</button> et les inhibiteurs de la <button class="w" data-k="e11-proxy-dpp4">DPP-4</button>.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/29364588/" target="_blank" rel="noopener">Nauck et Meier, 2018</a>.</p></template>
<template data-pop="e11-remission" data-title="Rémission du diabète de type 2 (essai DiRECT)"><p>Le consensus international cosigné par l’EASD en 2021 définit la rémission par une HbA1c &lt; 6,5 % mesurée <b>au moins trois mois après l’arrêt des médicaments hypoglycémiants</b>. Une glycémie contrôlée sous traitement ne suffit pas à prouver une rémission indépendante des médicaments. Le dépistage des complications et un contrôle glycémique au moins annuel se poursuivent.</p><p>Dans DiRECT, 149 patients par groupe entraient dans l’analyse : diabète depuis moins de six ans, âge de 20 à 65 ans, IMC de 27 à 45 kg/m², sans insuline. Le programme, encadré en premier recours, comportait 825 à 853 kcal par jour pendant trois à cinq mois, puis réintroduction alimentaire et maintien pondéral. À un an, 46 % étaient en rémission contre 4 %. L’essai utilisait alors un arrêt des antidiabétiques de deux mois : <b>ce critère historique ne remplace pas la définition actuelle de trois mois</b>.</p><div class="key"><b>Limites.</b> L’effet dépend de la perte de poids et de son maintien. Le consensus 2026 rapporte une rémission à cinq ans chez 13 % du sous-groupe recevant un soutien prolongé, soit 7 % du groupe intervention initial ; ces dénominateurs ne sont pas interchangeables. Une restriction énergétique intensive nécessite une surveillance clinique et une adaptation des médicaments.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-021-05542-z" target="_blank" rel="noopener">Riddle et al., consensus de rémission 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29221645/" target="_blank" rel="noopener">Lean et al., DiRECT 2018, résumé consulté</a> ; <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, rémission</a>.</p><p><button class="w" data-k="e11-calcul-poids">Calcul de l’IMC et du pourcentage de perte pondérale</button>.</p></template>
<template data-pop="e11-mecanismes-complications" data-title="Voies biochimiques des complications"><p>L’hyperglycémie chronique accroît la production mitochondriale d’espèces réactives de l’oxygène. Ce stress oxydant active cinq voies : la voie des polyols, la formation de produits de glycation avancée, l’expression de leur récepteur, l’activation de la protéine kinase C et la voie des hexosamines. Il en résulte une angiogenèse défectueuse, une inflammation et des modifications épigénétiques durables.</p><div class="key"><b>Conséquence.</b> Ces modifications durables expliquent qu’une hyperglycémie ancienne continue de nuire après sa correction, d’où l’intérêt d’un contrôle précoce.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a>.</p></template>
<template data-pop="e11-memoire" data-title="Mémoire métabolique : l’effet héritage de l’UKPDS"><p>Dans l’UKPDS, 3867 patients nouvellement diagnostiqués ont reçu un traitement intensif ou conventionnel ; l’HbA1c a été de 7,0 contre 7,9 % pendant dix ans, avec 25 % de complications microvasculaires en moins. Après l’essai, l’écart d’HbA1c a disparu en un an, mais le bénéfice a persisté et s’est étendu : vingt-quatre ans plus tard, la mortalité restait réduite de 10 % avec sulfonylurée ou insuline et de 20 % avec metformine, et le risque d’infarctus de 17 % et de 31 % respectivement.</p><div class="key"><b>Conséquence.</b> Le contrôle glycémique précoce rapporte des décennies plus tard. La directive suisse de conduite 2025 utilise aussi la notion d’exposition cumulée en « HbA1c-années ». Ce repère ne permet ni de prévoir les complications individuelles ni de remplacer leur dépistage.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9742976/" target="_blank" rel="noopener">UKPDS 33, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38772405/" target="_blank" rel="noopener">Adler et al., UKPDS 91, 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED–SGRM, directive de conduite, 2025</a>.</p></template>
<template data-pop="e11-hypercortisolisme" data-title="Hypercortisolisme et diabète résistant"><p>Un diabète insuffisamment contrôlé malgré plusieurs traitements peut justifier une recherche ciblée d’hypercortisolisme. Le consensus conjoint ADA/EASD 2026 rapporte une fréquence proche d’un quart dans une population <b>sélectionnée</b> de patients mal contrôlés ; ce chiffre ne décrit pas tous les diabétiques de type 2.</p><p>L’âge, un IMC relativement bas et certaines caractéristiques de la maladie ou de ses traitements étaient associés à la probabilité d’un test positif. Ces associations ne prouvent pas que les médicaments causent l’hypercortisolisme. Le bilan se discute avec un spécialiste lorsque la présentation clinique l’évoque ; il n’est pas un examen systématique de tout diabète.</p><div class="key"><b>Contexte suisse.</b> Le traitement antagoniste étudié dans ce sous-groupe et cité par le consensus ne constitue pas une autorisation de prescription suisse ; la conduite reste l’évaluation étiologique spécialisée.</div><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, hypercortisolisme</a>.</p></template>
<template data-pop="e11-depistage" data-title="Dépistage du diabète de type 2"><p>Le dépistage recherche une maladie encore silencieuse par glycémie plasmatique à jeun ou HbA1c standardisée. Le consensus ADA/EASD 2026 cite les standards américains de 2025 : dépistage dès 35 ans, et à tout âge en cas de surpoids ou d’obésité avec un facteur de risque. Ce calendrier est américain ; il éclaire la décision sans la fonder en Suisse. L’histoire familiale, cardiométabolique et obstétricale contribue à l’évaluation du risque. Si le résultat est normal, le médecin programme le contrôle selon le risque et le résultat, en le rapprochant si le poids, les médicaments ou les antécédents évoluent.</p><div class="key"><b>Contexte suisse.</b> La prise de position SSED 2011 permet l’HbA1c standardisée pour le diagnostic et le dépistage. Les recommandations suisses de traitement 2023 ne fixent pas de calendrier national de dépistage, et aucun calendrier européen spécifique n’a été retrouvé : cette lacune est assumée. L’<button class="w" data-k="e11-gl-14">ESC</button> 2023 demande le dépistage du diabète chez tout patient atteint d’une maladie cardiovasculaire.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-026-06855-7" target="_blank" rel="noopener">Consensus conjoint ADA/EASD 2026, dépistage</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, diagnostic</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011</a>.</p></template>
<template data-pop="e11-symptomes-osmotiques" data-title="Polyurie, polydipsie et amaigrissement"><p>Quand la glycémie dépasse la capacité de réabsorption du tubule, le glucose filtré passe dans l’urine et entraîne l’eau et le sodium : c’est la diurèse osmotique. La polyurie provoque la soif ; la perte urinaire de glucose et le catabolisme dû au manque d’insuline font maigrir. Ces symptômes classiques permettent le diagnostic sur une seule glycémie aléatoire ≥ 11,1 mmol/L.</p><div class="key"><b>Conséquence.</b> Un amaigrissement ou une cétose signalent une carence insulinique : l’insuline se discute d’emblée (SSED 2023).</div><p>Une polyurie avec glycémie normale relève d’un autre mécanisme, puisque l’urine n’est plus chargée de glucose. Le <button class="w" data-k="e11-ssp-polydipsie">raisonnement devant une soif excessive</button> distingue alors les causes électrolytiques, médicamenteuses et hormonales.</p><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">consensus 2024 sur les crises hyperglycémiques</a>.</p></template>
<template data-pop="e11-vision" data-title="Vision floue et variations glycémiques"><p>Une vision floue fait partie des manifestations possibles d’une hyperglycémie. Il faut distinguer un symptôme fluctuant d’une baisse visuelle persistante ou brutale, qui exige un examen ophtalmologique plutôt qu’une simple attribution à la glycémie.</p><div class="alert"><b>Urgence.</b> Une perte soudaine de vision sous sémaglutide demande une évaluation immédiate ; la <button class="w" data-k="e11-gl-23">FI</button> suisse mentionne la neuropathie optique ischémique antérieure non artéritique. Le dépistage de la rétinopathie continue même en l’absence de plainte.</div><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, manifestations et diagnostic</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-ic-depistage" data-title="Insuffisance cardiaque : dépistage chez le diabétique"><p>La SSED et la Société suisse de cardiologie recommandent de rechercher à chaque rencontre la dyspnée d’effort, l’orthopnée, la dyspnée nocturne, une baisse de la tolérance à l’effort, la fatigue et les œdèmes. Chez le patient <b>symptomatique hors contexte aigu</b>, un NT-proBNP ≥ 125 ng/L ou un BNP ≥ 35 ng/L conduit à compléter le bilan, notamment par échocardiographie.</p><table class="t"><tr><th>Patient asymptomatique de 60 ans ou plus</th><th>Orientation suisse 2024</th></tr><tr><td>NT-proBNP &lt; 125 ng/L ; BNP &lt; 35 ng/L</td><td>Insuffisance cardiaque peu probable ; poursuivre le suivi annuel.</td></tr><tr><td>NT-proBNP 125 à 299 ; BNP 35 à 89 ng/L</td><td>Zone intermédiaire : réévaluer symptômes et facteurs de risque ; cardiologue ou nouveau dosage à six mois selon le contexte.</td></tr><tr><td>NT-proBNP ≥ 300 ; BNP ≥ 90 ng/L</td><td>Insuffisance cardiaque subclinique probable ; adresser au cardiologue.</td></tr></table><div class="key"><b>Limites et niveau de preuve.</b> Le dépistage annuel dès 60 ans et ces seuils asymptomatiques relèvent du consensus suisse d’experts, distinct du diagnostic symptomatique. Avant 60 ans, le dosage peut se discuter en cas de facteurs de risque associés. La fibrillation atriale et la maladie rénale augmentent les peptides ; l’obésité les abaisse. Le remboursement se vérifie séparément et ne se déduit pas d’une recommandation clinique.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/smw-2024-4000.pdf" target="_blank" rel="noopener">Paul et al., recommandations suisses 2024, algorithme et discussion</a>.</p><p>Les seuils de peptides natriurétiques du consensus suisse se lisent avec les symptômes, l’âge et le contexte non aigu. Le tableau indique des repères décisionnels, pas des valeurs normales universelles.</p><table class="t"><tr><th>Patient / contexte</th><th>NT-proBNP ; BNP, ng/L</th><th>Conséquence</th></tr><tr><td>Asymptomatique, dépistage vers 60 ans et au-delà</td><td>&lt; 125 ; &lt; 35</td><td>IC peu probable ; poursuite annuelle selon consensus.</td></tr><tr><td>Asymptomatique</td><td>125–299 ; 35–89</td><td>IC possible : réévaluer les symptômes ; avis ou nouveau dosage à six mois selon risques.</td></tr><tr><td>Asymptomatique</td><td>≥ 300 ; ≥ 90</td><td>IC probable : cardiologue et échocardiographie.</td></tr><tr><td>Symptomatique hors contexte aigu</td><td>≥ 125 ; ≥ 35</td><td>Évaluation cardiologique et échographie ; le peptide seul ne confirme pas l’IC.</td></tr></table><p>Avant 60 ans, le dosage peut se discuter si plusieurs facteurs de risque ; l’interrogatoire sur dyspnée, orthopnée, fatigue et chevilles gonflées se fait à chaque rencontre. L’obésité abaisse les peptides ; la fibrillation atriale et la maladie rénale les élèvent. L’échographie confirme et caractérise. Les seuils de dépistage asymptomatique reposent sur le consensus du groupe d’experts suisses, que la recommandation signale par la mention « Swiss C ». La frontière d’âge s’écrit « plus de 60 ans » dans le texte et « 60 ans » dans l’algorithme ; l’âge ne remplace pas le jugement clinique.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/smw-2024-4000.pdf" target="_blank" rel="noopener">SSED–Société suisse de cardiologie 2024, recommandations et discussion p.3–4</a>.</p><p><button class="w" data-k="e11-proxy-fevg">Fraction d’éjection : définition et contexte du dépistage</button>.</p></template>
<template data-pop="e11-neuropathie" data-title="Neuropathie diabétique"><p>La neuropathie périphérique peut réduire la perception de la douleur et de la pression. Une plaie ou une ischémie peut alors progresser sans douleur : son absence ne rassure pas. Le monofilament et le diapason recherchent la perte de sensibilité de protection et vibratoire ; l’inspection, les pouls et les antécédents complètent la stratification.</p><p>Une atteinte neurologique ne doit pas être attribuée automatiquement au diabète. Sous metformine, le médecin recherche notamment une carence en vitamine B12 en cas de neuropathie ou d’anémie ; un déficit atypique ou rapidement progressif justifie une évaluation spécialisée. Le traitement symptomatique de la douleur relève d’une prescription individualisée et du chapitre neurologique dédié.</p><div class="key"><b>Priorité.</b> Le pied neuropathique nécessite la prévention des traumatismes, une surveillance, un chaussage adapté et la décharge d’une plaie. Un pied chaud, gonflé et déformé peut être un pied de Charcot aigu : la grille suisse prévoit alors un circuit urgent interprofessionnel.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, stratification et urgence</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, dépistage neurologique</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, artériopathie et neuropathie</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680260610169" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-monofilament" data-title="Test au monofilament"><p>Le monofilament de 10 g explore la sensibilité de protection. La grille suisse QualiCCare 2023 utilise quatre réponses perçues sur quatre dans ses critères du pied sans neuropathie ; ce score ne se confond pas avec les répétitions du protocole IWGDF.</p><p><b>Technique IWGDF 2023, annexe 1.</b> L’examinateur montre d’abord la sensation sur la main du patient ; celui-ci ne regarde pas les sites testés. L’examinateur teste trois sites sur chaque pied et pose le filament perpendiculairement jusqu’à sa courbure ; l’ensemble approche–contact–retrait prend environ deux secondes. Il évite les ulcères, les callosités, les cicatrices et les nécroses ; il ne fait pas glisser le filament.</p><p>L’examinateur répète deux contacts au même site en les alternant avec au moins une application simulée, soit trois questions. La sensation est conservée si au moins deux réponses sur trois sont correctes ; elle est absente si au moins deux sont incorrectes.</p><div class="key"><b>Conséquence.</b> Une perte de protection fait craindre une plaie non perçue : l’équipe adapte le chaussage, l’inspection et le suivi. L’examen se combine à la vibration et à l’évaluation vasculaire. L’examinateur emploie un filament en bon état et suit le protocole complet choisi, sans additionner les scores de méthodes différentes.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, page 3</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandations pratiques, annexe 1, page 26</a>.</p></template>
<template data-pop="e11-vibration" data-title="Sensibilité vibratoire au diapason gradué"><p>La sensibilité vibratoire complète le monofilament. La directive suisse de conduite décrit un examen au gros orteil ; la grille QualiCCare 2023 utilise une valeur supérieure à 4/8 pour sa condition d’absence de neuropathie au diapason gradué.</p><p><b>Autre protocole : IWGDF 2023.</b> L’examinateur montre d’abord la vibration au poignet avec un diapason de 128 Hz. Le patient ne regarde pas l’application. L’examinateur pose le diapason perpendiculairement sur une partie osseuse dorsale de la phalange distale du gros orteil. Il fait deux applications vibrantes et une simulée ; la perception est conservée si au moins deux réponses sur trois sont correctes. Si elle est absente à l’orteil, il répète le test plus proximalement.</p><div class="key"><b>Interprétation.</b> Le score gradué sur huit et le test qualitatif avec applications simulées sont deux méthodes : l’examinateur conserve la méthode et sa règle d’interprétation. Il intègre monofilament, peau, déformations, pouls et antécédent d’ulcère avant de classer le risque.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, page 3</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, annexe 1, pages 27–28</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et SGRM 2025, suivi neurologique</a>.</p></template>
<template data-pop="e11-pied" data-title="Pied diabétique : stratification suisse"><p>Une plaie diabétique exige de chercher une neuropathie, une artériopathie, une infection et la profondeur de l’atteinte. Le guide suisse QualiCCare distingue les trois niveaux ci-dessous ; une incertitude conduit au niveau spécialisé, jamais à attendre sans suivi.</p><table class="t"><tr><th>Niveau</th><th>Critères</th><th>Organisation</th></tr><tr><td>1 : faible, « simple »</td><td>Tous : plaie superficielle, sans infection, artériopathie significative, neuropathie ni déformation</td><td>Soins de première ligne ; contrôle dans une semaine.</td></tr><tr><td>2 : moyen, « complexe »</td><td>Au moins un : plaie profonde, évolution insuffisante, infection, artériopathie, neuropathie, ulcère ou amputation antérieurs</td><td>Réseau spécialisé, exploration, soins et décharge structurés.</td></tr><tr><td>3 : urgence</td><td>Au moins un : cellulite, gangrène, infection systémique, ischémie aiguë, Charcot aigu</td><td>Équipe interprofessionnelle du pied, prise en charge urgente.</td></tr></table><p>Le suivi est au moins hebdomadaire à chaque niveau. Le grade anatomique mesure la profondeur. Il ne correspond pas au niveau d’organisation des soins ; le tableau suivant distingue ces deux questions.</p><table class="t"><tr><th>Grade anatomique de plaie</th><th>Profondeur QualiCCare</th></tr><tr><td>1</td><td>Ne dépasse pas le derme</td></tr><tr><td>2</td><td>Atteint les structures sous-cutanées, fascia, muscle, tendon ou capsule</td></tr><tr><td>3</td><td>Atteint os ou articulation</td></tr></table><p>La perte de substance et l’infection déterminent l’urgence avec la perfusion. <button class="w" data-k="e11-calcul-ips">Mesurer et comprendre l’indice cheville/bras et la réduction de surface</button>.</p><p>Le niveau simple se subdivise selon l’ancienneté de la plaie et l’infection. Les conditions ci-dessous s’appliquent ensemble ; une incertitude conduit au réseau spécialisé.</p>
<table class="t"><tr><th>Première ligne QualiCCare</th><th>Conditions du guide suisse</th><th>Suivi et changement de niveau</th></tr>
<tr><td>1A</td><td>La plaie est de grade 1, non plantaire, présente depuis moins d’une semaine. Elle est sans infection, déformation, <button class="w" data-k="e11-pied-mesures">neuropathie démontrée ni artériopathie significative</button>.</td><td>La prise en charge standard vise 1–2 semaines, avec contrôle obligatoire dans une semaine. Une infection locale sans signes systémiques ou une durée dépassant une semaine et inférieure à quatre semaines conduit à 1B.</td></tr>
<tr><td>1B</td><td>La plaie reste de grade 1, non plantaire et de durée inférieure à quatre semaines. La neuropathie et l’artériopathie significative sont absentes ; une infection localisée sans signes systémiques peut être présente.</td><td>Les soins incluent une décharge efficace et un contrôle au moins hebdomadaire. La prise en charge standard est limitée à 3–4 semaines ; une évolution insuffisante impose une orientation.</td></tr>
<tr><td>Passage au niveau 2</td><td>Un ulcère antérieur ou une amputation, une déformation, une artériopathie suspectée, des plaies multiples, profondes ou plantaires, ou une durée supérieure à quatre semaines modifient le parcours. Une <button class="w" data-k="e11-calcul-plaie">réduction de surface inférieure à 10 % par semaine</button> est insuffisante selon le guide.</td><td>Un plan structuré associe soins, décharge et exploration vasculaire. Un signal d’alarme impose immédiatement le niveau 3.</td></tr></table>
<p>La plaie récente et non plantaire de 1A peut évoluer vers 1B sans devenir une plaie profonde. La profondeur, l’infection et l’évolution se réévaluent séparément ; une plaie plantaire ou une complication ne relève pas d’un simple délai d’attente.</p>
<p>Les signaux suivants motivent l’orientation urgente vers l’équipe du niveau 3. Ils complètent la taille de la plaie et évitent de retarder le recours spécialisé devant une menace différente.</p>
<table class="t"><tr><th>Signal d’alarme suisse</th><th>Conséquence</th></tr>
<tr><td>L’infection locale s’accompagne de signes systémiques ou progresse rapidement.</td><td>Le patient relève d’une évaluation urgente du foyer et de l’état général.</td></tr>
<tr><td>L’<button class="w" data-k="e11-calcul-ips">indice cheville/bras est inférieur à 0,5</button>, la <button class="w" data-k="e11-pied-mesures">pression transcutanée d’oxygène est inférieure à 25 mmHg ou celle de l’orteil à 30 mmHg</button>.</td><td>Le guide les retient comme signaux d’une urgence ischémique critique ; ce sont des seuils d’alarme de perfusion, non des intervalles de référence.</td></tr>
<tr><td>Une plaie noire fait suspecter une nécrose. Un ulcère de grade 3, qui atteint l’os ou l’articulation, fait aussi envisager le niveau 3.</td><td>La viabilité et la profondeur sont évaluées rapidement.</td></tr>
<tr><td>Une déformation sévère nécessite une correction chirurgicale, un Charcot aigu est suspecté, ou une neuropathie aiguë devient douloureuse.</td><td>Une évaluation spécialisée urgente précise la cause et la décharge.</td></tr>
<tr><td>Le patient a une maladie rénale au stade terminal, traitée par dialyse.</td><td>Le guide demande le niveau le plus élevé ; une petite plaie ne suffit pas à rassurer.</td></tr>
<tr><td>La plaie diminue de moins de 50 % en quatre semaines sous soins adaptés.</td><td>La réponse insuffisante impose le niveau 3 ; le <button class="w" data-k="e11-calcul-plaie">calcul de réduction et ses limites</button> évite une estimation imprécise.</td></tr></table>
<p>Une bonne réduction de surface ne neutralise ni une ischémie, ni une infection systémique, ni le terrain de dialyse. Le signal le plus préoccupant commande le niveau de soins ; le suivi reste au moins hebdomadaire à chaque niveau.</p>
<figure><img src="assets/img/cycle1/e11/neuropathic_heel_ulcer_diabetic.jpg" alt="Face plantaire d’un talon tenu par une main gantée : ulcération ronde à fond rouge bourgeonnant, bordée d’une peau blanchâtre macérée" loading="lazy"><figcaption>Figure 10 — Ulcère neuropathique plantaire du talon chez une patiente diabétique de 47 ans porteuse d’une neuropathie périphérique profonde ; la lésion a débuté par une phlyctène. Photographie clinique réelle. Source : Jonathan Moore, The Foot and Ankle Online Journal 2008, CC BY 3.0, Wikimedia Commons.</figcaption></figure><p>Cette plaie est plantaire et siège sur une zone d’appui : dans la grille suisse, ces deux caractéristiques suffisent à exclure le niveau simple et imposent le réseau spécialisé, quelle que soit sa surface. Le fond rouge bourgeonnant correspond à un tissu de granulation ; il ne renseigne ni sur la profondeur ni sur la perfusion, qui doivent être évaluées séparément. Comme la neuropathie supprime la douleur, l’appui sur la lésion peut se poursuivre sans aucune alerte ; c’est pourquoi une décharge efficace accompagne toujours les soins locaux.</p><div class="key"><b>Signaux d’alarme.</b> Une ischémie critique (<button class="w" data-k="e11-gl-12">IPS</button> &lt; 0,5, pression d’orteil &lt; 30 mmHg) ou une plaie réduite de moins de 50 % en quatre semaines imposent le niveau le plus élevé. L’organisation de la podologie et sa prise en charge financière se vérifient selon le besoin et les règles suisses applicables.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023</a>.</p></template>
<template data-pop="e11-hba1c" data-title="HbA1c : principe, avantages et pièges"><p>L’HbA1c est l’hémoglobine glyquée ; elle reflète la glycémie moyenne des semaines précédentes. La SSED l’a adoptée pour le diagnostic en 2011 si la méthode est standardisée selon le DCCT et l’UKPDS. Elle varie peu (environ 2 % contre 12 à 15 % pour la glycémie à jeun), ne dépend ni de l’heure ni du stress et prédit mieux les complications.</p><div class="key"><b>Pièges.</b> Elle n’est pas adaptée comme critère diagnostique dans certaines situations, notamment en cas d’hémoglobinopathie, d’hémolyse, de transfusion, d’insuffisance rénale ou hépatique sévère, de diabète gestationnel ou de suspicion de type 1. La carence en fer l’élève faussement ; les fortes doses de vitamines C et E la perturbent ; après 70 ans, elle s’élève d’environ 0,4 point de pourcentage.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011, tableaux 1 et 2</a>.</p><p><button class="w" data-k="e11-calcul-hba1c">Glycation, unités et conversion de l’HbA1c</button>.</p></template>
<template data-pop="e11-hgpo" data-title="Hyperglycémie provoquée par voie orale"><p>Après un jeûne de 8 heures, le patient boit 75 g de glucose ; la glycémie plasmatique est mesurée à deux heures. Une valeur ≥ 11,1 mmol/L signe un diabète, une valeur de 7,8 à 11,0 mmol/L une intolérance au glucose. Pendant le test, le patient reste au repos et ne mange pas.</p><div class="key"><b>Contentieux.</b> L’<button class="w" data-k="e11-gl-14">ESC</button> 2023 la retient dans les cas douteux, notamment lorsque glycémie et HbA1c ne concordent pas. Après une hyperglycémie de stress, le médecin recontrôle la glycémie à distance ; la valeur mesurée pendant la maladie aiguë ne suffit pas à classer une dysglycémie chronique.</div><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023</a>.</p></template>
<template data-pop="e11-prediabete" data-title="Prédiabète : des seuils discutés"><p>Les seuils de prédiabète définissent une zone de risque sous les critères du diabète. Ils diffèrent selon l’organisation ; le tableau compare leur portée et distingue le repère suisse en vigueur.</p><table class="t"><tr><th>Organisation / texte</th><th>HbA1c</th><th>Glucose plasmatique à jeun</th></tr><tr><td>SSED 2011, seuil suisse retenu</td><td>5,7–6,4 %</td><td>5,6–6,9 mmol/L</td></tr><tr><td>OMS, comparaison rapportée par <button class="w" data-k="e11-gl-14">ESC</button> 2023</td><td>6,0–6,4 %</td><td>6,1–6,9 mmol/L</td></tr><tr><td>Association américaine, comparaison rapportée par <button class="w" data-k="e11-gl-14">ESC</button></td><td>5,7–6,4 %</td><td>5,6–6,9 mmol/L</td></tr></table><p>Le jeûne dure au moins huit heures. Un intervalle de laboratoire est une autre notion : Viollier donne 3,3–5,5 mmol/L à jeun chez les 16–99 ans. Les mmol/mol d’HbA1c se lisent avec la <button class="w" data-k="e11-calcul-hba1c">conversion calibrée</button>. Le terme « prédiabète » ne commande pas à lui seul une prescription ; il motive des mesures de mode de vie et une surveillance adaptées au contexte.</p><div class="key"><b>Arbitrage.</b> La SSED a adopté en 2011 les seuils larges (HbA1c 5,7 à 6,4 %, glycémie 5,6 à 6,9 mmol/L) ; c’est le texte suisse en vigueur. La priorité est le mode de vie et la surveillance du risque ; la décision médicamenteuse ne découle pas du seul terme « prédiabète ». Les seuils différents classent des populations différentes et doivent être explicités.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011 (texte en vigueur)</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, tableau 6</a>.</p></template>
<template data-pop="e11-cpeptide" data-title="Auto-anticorps et peptide C"><p>Les auto-anticorps anti-<button class="w" data-k="e11-gl-24">GAD</button>, anti-<button class="w" data-k="e11-gl-17">IA2</button> et anti-<button class="w" data-k="e11-proxy-znt8">ZnT8</button> étayent un diabète auto-immun ; leur absence ne l’exclut pas. Le peptide C, libéré avec l’insuline endogène lors du clivage de la proinsuline, explore la sécrétion résiduelle.</p><p>La SSED 2023 cite un peptide C de 200 à 600 pmol/L, avec anticorps négatifs et sans histoire familiale forte, comme profil de déficit insulinique. Cette plage sert à orienter et non à diagnostiquer à elle seule un type ; la glycémie lors du prélèvement et la situation clinique comptent. La SSED propose une réévaluation trois ans plus tard si la classification reste incertaine.</p><div class="alert"><b>Priorité.</b> Une cétose, un amaigrissement ou une décompensation aiguë imposent de rechercher l’acidose et de traiter la carence insulinique ; le résultat des anticorps ne doit pas retarder l’insuline. La génétique d’un éventuel MODY se discute avec le spécialiste.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/SGED-SSED_long_Recommendations_2023_en.pdf" target="_blank" rel="noopener">SSED 2023, recommandation sur le déficit insulinique</a> ; <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2</a> ; <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, diagnostic</a>.</p><p><button class="w" data-k="e11-normalite">Valeurs de référence suisses, conditions et distinction avec les seuils</button>.</p></template>
<template data-pop="e11-stress" data-title="Hyperglycémie de stress"><p>Une hyperglycémie apparaît souvent à l’hôpital, au cours d’un syndrome coronarien aigu ou d’une insuffisance cardiaque, sans diabète préexistant. Une glycémie élevée avec une HbA1c normale la suggère. Elle s’associe à un pronostic hospitalier défavorable.</p><div class="key"><b>Conduite.</b> L’<button class="w" data-k="e11-gl-14">ESC</button> propose une <button class="w" data-k="e11-gl-25">HGPO</button> quelques semaines après la sortie pour écarter un diabète ou une intolérance au glucose.</div><p class="src">Référence : <a href="https://www.giornaledicardiologia.it/articoli.php?archivio=yes&amp;vol_id=4162&amp;id=41558" target="_blank" rel="noopener">ESC 2023, section 3.2.4</a>.</p></template>
<template data-pop="e11-hypo" data-title="Hypoglycémie : niveaux et conséquences"><p>La classification conjointe EASD/International Hypoglycaemia Study Group sépare le signal d’alerte, la baisse significative et la gravité clinique. Le tableau évite de définir la sévérité par un chiffre unique.</p><table class="t"><tr><th>Niveau</th><th>Définition</th></tr><tr><td>1 : alerte</td><td>Glucose de 3,0 à 3,9 mmol/L</td></tr><tr><td>2 : cliniquement significative</td><td>Glucose &lt; 3,0 mmol/L</td></tr><tr><td>3 : sévère</td><td>Altération exigeant l’aide d’un tiers, quelle que soit la glycémie mesurée</td></tr></table><p>Les hypoglycémies répétées peuvent abaisser les seuils des symptômes et faire perdre la perception ; l’absence de signes ne rassure donc pas. Les exigences suisses de conduite classent séparément le risque iatrogène et les antécédents.</p><div class="key"><b>Conséquences.</b> Les hypoglycémies sévères sont associées à des événements cardiovasculaires et à une mortalité accrue dans des populations à risque ; ces associations ne prouvent pas une causalité unique (prise de position conjointe 2017). Dans <button class="w" data-k="e11-gl-27">ACCORD</button>, viser une HbA1c inférieure à 6,0 % a augmenté la mortalité (257 contre 203 décès) avec davantage d’hypoglycémies sévères.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6518070/" target="_blank" rel="noopener">International Hypoglycaemia Study Group, 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED–SGRM, diabète et conduite, édition août 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18539917/" target="_blank" rel="noopener">ACCORD, 2008</a>.</p></template>
<template data-pop="e11-glucagon" data-title="Glucagon par voie nasale"><p><b>Baqsimi®, <button class="w" data-k="e11-gl-23">FI</button> mars 2026.</b> Le glucagon nasal traite l’hypoglycémie sévère du diabétique dès un an : <b>la dose unique est de 3 mg dans une narine</b>. L’absorption est passive, sans inspiration requise. Le dispositif est unidose ; la <button class="w" data-k="e11-gl-23">FI</button> ne fournit pas de schéma répété universel. L’entourage prévient les secours, surveille le patient et ne lui fait rien avaler tant qu’il ne peut pas déglutir en sécurité.</p><p>Quand le patient a récupéré et peut avaler, son entourage lui donne des glucides par voie orale pour reconstituer les réserves hépatiques et prévenir la récidive. Le glucagon agit peu si le glycogène est épuisé, notamment après jeûne prolongé ou abus chronique d’alcool ; un apport de glucose par les professionnels peut être nécessaire.</p><p><b>Restrictions.</b> Contre-indications : hypersensibilité et phéochromocytome ; prudence en cas d’insulinome. Aucune adaptation de dose rénale ou hépatique n’est prévue, mais ces situations n’ont fait l’objet d’aucune étude formelle. La <button class="w" data-k="e11-gl-23">FI</button> permet l’usage pendant la grossesse et l’allaitement. Les proches doivent connaître le dispositif avant l’urgence.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674650010" target="_blank" rel="noopener">Information professionnelle suisse Baqsimi® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-shh" data-title="État hyperglycémique hyperosmolaire"><p>L’état hyperglycémique hyperosmolaire conserve assez d’insuline pour limiter la cétogenèse, mais pas assez pour empêcher l’hyperglycémie. La glycosurie entraîne une diurèse osmotique ; la déshydratation réduit la filtration et amplifie l’hyperglycémie.</p><div class="alert"><b>Critères du consensus conjoint 2024 : les quatre doivent être réunis.</b> Glycémie ≥ 33,3 mmol/L ; osmolalité efficace &gt; 300 mOsm/kg ou totale &gt; 320 mOsm/kg ; β-hydroxybutyrate &lt; 3,0 mmol/L ou cétonurie &lt; 2+ ; <button class="w" data-k="e11-gl-7">pH</button> ≥ 7,3 et bicarbonates ≥ 15 mmol/L. L’osmolalité efficace se calcule par 2 × <button class="w" data-k="e11-gl-6">Na⁺</button> + glucose ; la totale ajoute l’urée, toutes les concentrations en mmol/L.</div><p>Le traitement relève de l’hôpital : réhydratation par cristalloïde isotone, recherche du facteur déclenchant, surveillance glycémique, rénale, potassique et neurologique. Le choix du débit d’insuline du consensus 2024 dépend des cétones et de l’acidose : le tableau distingue les deux branches. Le seuil de bicarbonates utilisé pour cette décision est de 18 mmol/L, alors que le critère diagnostique de l’état hyperosmolaire est de 15 mmol/L. La <button class="w" data-k="e11-gl-23">FI</button> de NovoRapid® autorise la voie intraveineuse uniquement sous contrôle professionnel, avec surveillance du glucose et du potassium. Le protocole JBDS 2023 attend la fin de la baisse glycémique sous réhydratation dans la forme isolée ; cette attente ne s’applique pas à une acidocétose associée.</p><div class="key"><b>Sécurité.</b> La baisse de l’osmolalité doit rester de 3 à 8 mOsm/kg/heure. Le remplissage est plus prudent chez le sujet âgé ou insuffisant cardiaque ou rénal. Si le potassium est &lt; 3,5 mmol/L, le consensus 2024 demande de corriger d’abord l’hypokaliémie et de différer l’insuline jusqu’à ce que le potassium dépasse 3,5 mmol/L ; l’équipe applique le protocole hospitalier avec surveillance rapprochée. La mortalité varie fortement selon la population et les causes associées : aucun pourcentage unique n’est applicable à tous les patients.</div><p class="src">Références : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, figure 2 et traitement</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">JBDS 2023, traitement</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680550450024" target="_blank" rel="noopener">Information professionnelle suisse NovoRapid® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p>Ces critères guident l’insulinothérapie hospitalière ; les conjonctions « et » et « ou » sont déterminantes.</p><table class="t"><tr><th>Situation biologique</th><th>Débit intraveineux du consensus 2024</th></tr><tr><td>Absence de cétose significative, évaluée par β-hydroxybutyrate &lt; 3 mmol/L (absent ou de 1 à &lt; 3) <b>ou</b> cétonurie &lt; 2+ ; aucun critère de la seconde ligne ; <button class="w" data-k="e11-gl-7">pH</button> ≥ 7,3 <b>et</b> bicarbonates ≥ 18 mmol/L</td><td>0,05 unité/kg/heure</td></tr><tr><td>β-hydroxybutyrate ≥ 3 mmol/L <b>ou</b> cétonurie ≥ 2+ <b>ou</b> <button class="w" data-k="e11-gl-7">pH</button> &lt; 7,3 <b>ou</b> bicarbonates &lt; 18 mmol/L</td><td>0,1 unité/kg/heure : branche « mixte » du protocole</td></tr></table><p>Un seul critère de la seconde ligne suffit à choisir cette branche du protocole. Il ne suffit pas à diagnostiquer une acidocétose, dont les trois groupes de critères doivent être réunis. La priorité reste le remplissage, le potassium et la surveillance. Le JBDS retarde l’insuline dans l’état hyperosmolaire isolé jusqu’à ce que la glycémie cesse de baisser sous remplissage ; en cas de cétose significative, cette attente ne s’applique pas.</p><p><button class="w" data-k="e11-calcul-dose">Comprendre unité/kg/heure et calculer une dose pédagogique</button> ; <button class="w" data-k="e11-osmolalite">Comprendre et calculer l’osmolalité</button>.</p><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, Insulin therapy, état hyperosmolaire</a>.</p><p><button class="w" data-k="e11-normalite">Valeurs de référence suisses, conditions et distinction avec les seuils</button>.</p></template>
<template data-pop="e11-acd-isglt2" data-title="Acidocétose sous inhibiteur du SGLT2"><p>L’acidocétose associe trois éléments : diabète connu ou glycémie ≥ 11,1 mmol/L ; β-hydroxybutyrate ≥ 3,0 mmol/L ou cétonurie ≥ 2+ ; <button class="w" data-k="e11-gl-7">pH</button> &lt; 7,3 et/ou bicarbonates &lt; 18 mmol/L. Environ 10 % des cas sont euglycémiques, avec une glycémie &lt; 11,1 mmol/L ; un inhibiteur du SGLT2 en est un facteur de risque.</p><p>Devant des nausées, des vomissements, une douleur abdominale, une dyspnée ou une grande fatigue sous ce traitement, le médecin mesure les cétones et le gaz du sang quelle que soit la glycémie. Il arrête le produit et organise une évaluation hospitalière immédiate. La cétose seule ne suffit pas à poser une acidocétose : il faut rechercher l’acidose.</p><div class="alert"><b>Conduite hospitalière.</b> Le traitement associe liquides et insuline, avec correction et surveillance des électrolytes, puis traitement de la cause. Si le potassium est &lt; 3,5 mmol/L, il doit être corrigé avant l’insuline ; des apports de glucose permettent de poursuivre l’insuline lorsque la glycémie est déjà basse. La reprise ultérieure d’un inhibiteur du SGLT2 n’est pas automatique : le médecin vérifie le facteur déclenchant et le bénéfice–risque.</div><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, diagnostic et traitement</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680632270014" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-acidose-lactique" data-title="Acidose lactique sous metformine"><p>L’acidose lactique est très rare, de 3 à 5 cas pour 100 000 années-patients. Elle survient presque toujours lors d’une insuffisance rénale aiguë ou d’une hypoxie : déshydratation, sepsis, choc, insuffisance cardiaque décompensée, infarctus récent, intoxication alcoolique. Elle associe une dyspnée acidosique, des douleurs abdominales, des crampes, une hypothermie, puis un coma ; le <button class="w" data-k="e11-gl-7">pH</button> est inférieur à 7,35 et les lactates dépassent 5 mmol/L.</p><div class="key"><b>Conduite.</b> Le patient est hospitalisé immédiatement ; l’hémodialyse élimine le lactate et la metformine.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a>.</p><p><button class="w" data-k="e11-normalite">Valeurs de référence suisses, conditions et distinction avec les seuils</button>.</p></template>
<template data-pop="e11-fournier" data-title="Gangrène de Fournier"><p>La fasciite nécrosante du périnée est une infection rare et grave rapportée chez des hommes et des femmes sous inhibiteur du SGLT2. Une douleur, une sensibilité, un érythème ou une tuméfaction génitale ou périnéale, avec fièvre ou malaise, imposent un examen immédiat.</p><div class="key"><b>Conduite.</b> L’équipe arrête le médicament, administre des antibiotiques à large spectre et réalise un débridement chirurgical si nécessaire.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (07.2025)</a>.</p></template>
<template data-pop="e11-mrc" data-title="Maladie rénale diabétique"><p>Le dépistage comprend, au moins une fois par an, la créatinine avec le <button class="w" data-k="e11-gl-16">DFG</button> estimé et le rapport albumine/créatinine urinaire. Une anomalie persistante pendant au moins trois mois établit la chronicité : <button class="w" data-k="e11-gl-16">DFG</button> &lt; 60 mL/min/1,73 m² ou albuminurie au moins de catégorie <button class="w" data-k="e11-gl-21">A2</button> (≥ 3 mg/mmol). Le médecin classe ensemble la cause, le <button class="w" data-k="e11-gl-16">DFG</button> et l’albuminurie ; il contrôle de nouveau un résultat inhabituel.</p><p>En cas d’hypertension albuminurique, la recommandation suisse utilise un bloqueur du système rénine–angiotensine avec contrôle de la créatinine et du potassium. Le médecin ajoute un inhibiteur du SGLT2 adapté à son indication et à sa <button class="w" data-k="e11-gl-23">FI</button> ; les seuils d’initiation sont propres au produit, et Forxiga® s’arrête avant dialyse ou transplantation. La finérénone peut se discuter si l’albuminurie persiste, si le <button class="w" data-k="e11-gl-16">DFG</button> est ≥ 25 et si le potassium est compatible ; sa dose et ses contrôles suivent la <button class="w" data-k="e11-gl-23">FI</button> Kerendia®.</p><p><b>Résultats d’essais.</b> Dans <button class="w" data-k="e11-proxy-flow">FLOW</button> (3533 patients, sémaglutide 1 mg par semaine), la réduction relative d’un critère composite d’événements rénaux majeurs, décès cardiovasculaire inclus, atteint 24 %. Dans FIDELIO-DKD, la réduction relative du critère rénal composite sous finérénone est de 18 %, chez des patients albuminuriques déjà sous blocage rénine–angiotensine maximal toléré ; ces critères ne sont pas identiques.</p><p>La lésion rénale que traduit l’albuminurie se voit au microscope. La figure ci-dessous montre un glomérule biopsié chez un patient diabétique.</p><figure><img src="assets/img/cycle1/e11/diabetic_glomerulosclerosis_4_pas.jpg" alt="Coupe histologique colorée en magenta d’un glomérule rénal : à gauche, un nodule mésangial homogène acellulaire ; capsule et membranes basales épaissies" loading="lazy"><figcaption>Figure 9 — Glomérulosclérose diabétique, coloration à l’acide périodique de Schiff : nodule mésangial acellulaire (lésion de Kimmelstiel-Wilson) à gauche du flocculus, membranes basales épaissies. Photographie histologique réelle d’une biopsie avec syndrome néphrotique. Source : KGH, CC BY-SA 3.0, Wikimedia Commons.</figcaption></figure><p>La coloration à l’acide périodique de Schiff teinte en magenta les membranes basales et la matrice mésangiale. Le nodule homogène, presque dépourvu de noyaux, correspond à une accumulation de matrice dans le mésangium. La classification anatomopathologique internationale de 2010 range cette lésion dans la classe III, entre, d’une part, l’épaississement isolé de la membrane basale (classe I) et l’expansion mésangiale (classe II) et, d’autre part, la sclérose globale de plus de la moitié des glomérules (classe IV). Ce remaniement du filtre glomérulaire accompagne la fuite d’albumine puis la perte de filtration ; toutefois, la biopsie n’est pas un examen de routine : elle se discute lorsque des signaux d’alarme évoquent une autre néphropathie.</p><p class="src">Référence : <a href="https://doi.org/10.1681/ASN.2010010010" target="_blank" rel="noopener">Tervaert et al., classification anatomopathologique de la néphropathie diabétique, Renal Pathology Society, 2010, résumé consulté</a>.</p><div class="key"><b>Adresser au néphrologue.</b> Le médecin adresse le patient en cas d’hématurie persistante, de sédiment actif, de chute rapide et durable du <button class="w" data-k="e11-gl-16">DFG</button>, d’albuminurie <button class="w" data-k="e11-gl-22">A3</button> en progression, de syndrome néphrotique ou d’histoire familiale suggérant une autre cause. La grille suisse cite notamment une baisse &gt; 5 mL/min/an ; le contexte décide de l’urgence et du suivi.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED et Société suisse de néphrologie 2024, dépistage et signaux d’alarme</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38785209/" target="_blank" rel="noopener">FLOW 2024, résumé consulté</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33264825/" target="_blank" rel="noopener">FIDELIO-DKD 2020, résumé consulté</a>.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680632270014" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680651760015" target="_blank" rel="noopener">Information professionnelle suisse Forxiga® (AIPS via AmiKo), consultée le 11.10.2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680681300014" target="_blank" rel="noopener">Information professionnelle suisse Kerendia® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p><p><button class="w" data-k="e11-normalite">Valeurs de référence suisses, conditions et distinction avec les seuils</button>.</p><p><button class="w" data-k="e11-calcul-acr">Bases et calcul du rapport albumine/créatinine</button>.</p><p>La maladie rénale se classe sur deux axes. Les limites ci-dessous proviennent de la grille suisse maladie rénale chronique ; <button class="w" data-k="e11-mrc">G1</button>–<button class="w" data-k="e11-mrc">G2</button> sans autre marqueur ne suffisent pas à diagnostiquer une maladie chronique.</p><table class="t"><tr><th>Catégorie G</th><th><button class="w" data-k="e11-gl-16">DFG</button> estimé, mL/min/1,73 m²</th></tr><tr><td><button class="w" data-k="e11-mrc">G1</button></td><td>≥ 90</td></tr><tr><td><button class="w" data-k="e11-mrc">G2</button></td><td>60–89</td></tr><tr><td><button class="w" data-k="e11-mrc">G3a</button></td><td>45–59</td></tr><tr><td><button class="w" data-k="e11-mrc">G3b</button></td><td>30–44</td></tr><tr><td><button class="w" data-k="e11-mrc">G4</button></td><td>15–29</td></tr><tr><td><button class="w" data-k="e11-mrc">G5</button></td><td>&lt; 15</td></tr></table><table class="t"><tr><th>Catégorie A</th><th>Rapport albumine/créatinine urinaire, mg/mmol</th></tr><tr><td><button class="w" data-k="e11-gl-20">A1</button></td><td>&lt; 3</td></tr><tr><td><button class="w" data-k="e11-gl-21">A2</button></td><td>≥ 3 et &lt; 30</td></tr><tr><td><button class="w" data-k="e11-gl-22">A3</button></td><td>≥ 30</td></tr></table><p>Le tableau de risque croise les deux axes ; les chiffres indiquent les contrôles minimaux annuels proposés par la brochure suisse. Le stade et la chronicité doivent être confirmés.</p><table class="t"><tr><th><button class="w" data-k="e11-gl-16">DFG</button></th><th><button class="w" data-k="e11-gl-20">A1</button></th><th><button class="w" data-k="e11-gl-21">A2</button></th><th><button class="w" data-k="e11-gl-22">A3</button></th></tr><tr><td><button class="w" data-k="e11-mrc">G1</button> / <button class="w" data-k="e11-mrc">G2</button></td><td>Faible, 1 ; maladie chronique seulement si autre marqueur</td><td>Modéré, 1</td><td>Élevé, 3 ; traiter ou adresser</td></tr><tr><td><button class="w" data-k="e11-mrc">G3a</button></td><td>Modéré, 1</td><td>Élevé, 2 ; traiter ou adresser</td><td>Très élevé, 3 ; traiter ou adresser</td></tr><tr><td><button class="w" data-k="e11-mrc">G3b</button></td><td>Élevé, 2</td><td>Très élevé, 3</td><td>Très élevé, 3 ; traiter ou adresser</td></tr><tr><td><button class="w" data-k="e11-mrc">G4</button></td><td>Très élevé, 3 ; traiter ou adresser</td><td>Très élevé, 3 ; traiter ou adresser</td><td>Très élevé, ≥ 4 ; traiter ou adresser</td></tr><tr><td><button class="w" data-k="e11-mrc">G5</button></td><td>Très élevé, ≥ 4 ; traiter ou adresser</td><td>Très élevé, ≥ 4 ; traiter ou adresser</td><td>Très élevé, ≥ 4 ; traiter ou adresser</td></tr></table><p>La brochure contient un libellé &gt; 3 mg/mmol dans la phrase de diagnostic et des bornes ≥ 3 dans sa grille ; le cours explicite les catégories de la grille, sans déplacer 30 vers <button class="w" data-k="e11-gl-21">A2</button>. L’urgence dépend de la clinique, pas du nombre annuel. L’avis rénal est aussi évalué si le <button class="w" data-k="e11-gl-16">DFG</button> est &lt; 75 avant 40 ans, &lt; 60 entre 40 et 65 ans ou &lt; 45 après 65 ans, en cas d’hypertension résistante (&gt; 140/90 sous trois classes dont un diurétique) ou de baisse &gt; 30 % après un bloqueur rénine–angiotensine.</p><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED–Société suisse de néphrologie, mai 2024, grille et Red flags</a>.</p><p><button class="w" data-k="e11-rein2025">Actualité suisse 2025 en cas de maladie rénale : cibles et divergences des éditions</button>.</p></template>
<template data-pop="e11-retino" data-title="Rétinopathie diabétique"><p>L’ophtalmologue recherche une rétinopathie au diagnostic et organise ensuite la surveillance selon le résultat et le risque. La grille suisse de qualité 2017 prévoit un examen au moins tous les deux ans ; un patient déjà atteint nécessite un calendrier spécialisé plus rapproché. Toute baisse visuelle aiguë impose une évaluation urgente.</p><p>Une amélioration glycémique rapide peut aggraver transitoirement une rétinopathie préexistante. Dans SUSTAIN-6, la <button class="w" data-k="e11-gl-23">FI</button> suisse d’Ozempic® rapporte des complications rétiniennes chez 3,0 % contre 1,8 % sous placebo ; plus de 80 % des cas concernés avaient une rétinopathie initiale. Il faut en informer le patient et surveiller les patients à risque, particulièrement sous insuline. La figure 8 de l’îlot 9 montre les lésions élémentaires à reconnaître.</p><div class="alert"><b>Autre signal oculaire.</b> La <button class="w" data-k="e11-gl-23">FI</button> 07.2026 d’Ozempic® mentionne la neuropathie optique ischémique antérieure non artéritique : une perte soudaine de vision exige un examen ophtalmologique urgent ; le traitement s’arrête si ce diagnostic est confirmé.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED 2017, suivi ophtalmologique</a>.</p><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680666040010" target="_blank" rel="noopener">Information professionnelle suisse Ozempic® (AIPS via AmiKo), consultée le 11.10.2026</a>.</p></template>
<template data-pop="e11-b12" data-title="Vitamine B12 sous metformine"><p>La metformine au long cours diminue l’absorption de la vitamine B12 ; le risque de carence augmente avec la dose et la durée. L’information professionnelle suisse recommande un dosage régulier, par exemple annuel, surtout en cas d’anémie ou de neuropathie.</p><div class="key"><b>Piège.</b> La <button class="w" data-k="e11-gl-23">FI</button> de Glucophage® demande de rechercher un déficit en B12 devant une anémie ou une neuropathie ; le diagnostic de neuropathie diabétique ne dispense pas de ce contrôle.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a>.</p></template>
<template data-pop="e11-cetones" data-title="Corps cétoniques, gaz veineux et osmolalité"><p>Le dosage direct du β-hydroxybutyrate sanguin est préférable à la bandelette urinaire, qui mesure surtout l’acétoacétate et peut sous-estimer la cétose au début puis la surestimer pendant la guérison. Un seuil ≥ 3,0 mmol/L a une sensibilité et une spécificité supérieures à 90 % pour l’acidocétose dans le consensus 2024, mais s’interprète avec le diabète et l’acidose.</p><table class="t"><tr><th>Gravité de l’acidocétose</th><th>Acidose et cétones (consensus 2024, tableau 2)</th></tr><tr><td>Légère</td><td><button class="w" data-k="e11-gl-7">pH</button> &gt; 7,25 à &lt; 7,30 ou bicarbonates 15 à 18 ; β-hydroxybutyrate 3 à 6 mmol/L.</td></tr><tr><td>Modérée</td><td><button class="w" data-k="e11-gl-7">pH</button> 7,0 à 7,25 ou bicarbonates 10 à &lt; 15 ; β-hydroxybutyrate 3 à 6.</td></tr><tr><td>Sévère</td><td><button class="w" data-k="e11-gl-7">pH</button> &lt; 7,0 ou bicarbonates &lt; 10 ; β-hydroxybutyrate &gt; 6 ; altération marquée de la conscience.</td></tr></table><div class="key"><b>Interprétation.</b> L’état mental et la situation clinique déterminent aussi le niveau de soins ; toutes les variables d’une colonne n’ont pas à être réunies. Pour l’état hyperosmolaire, le médecin calcule l’osmolalité efficace 2 × <button class="w" data-k="e11-gl-6">Na⁺</button> + glucose (&gt; 300), ou la totale en ajoutant l’urée (&gt; 320), en mOsm/kg.</div><p class="src">Référence : <a href="https://link.springer.com/article/10.1007/s00125-024-06183-8" target="_blank" rel="noopener">Consensus conjoint 2024, figure 2 et tableau 2</a>.</p></template>

<template data-pop="e11-calcul-plaie" data-title="Réduction de surface d’une plaie : pourcentage et durée"><p>La surface décrit l’étendue de la plaie, en cm². La réduction relative compare la surface perdue à la surface au début de la période : (surface initiale − surface actuelle) ÷ surface initiale × 100. Les cm² s’annulent ; il reste un pourcentage.</p><p><b>Exemple fictif sur une semaine.</b> Une surface passe de 4 à 3,7 cm² : la réduction est de 0,3 cm², puis 0,3 ÷ 4 × 100 = 7,5 %. Elle reste inférieure à 10 % en une semaine, repère suisse de réponse insuffisante conduisant au niveau 2.</p><p><b>Exemple fictif sur quatre semaines.</b> Une plaie passe de 4 à 2,4 cm² : (4 − 2,4) ÷ 4 × 100 = 40 %. La réduction reste inférieure à 50 % sur quatre semaines ; le guide demande alors le niveau 3. Un pourcentage hebdomadaire ne s’additionne pas mécaniquement si le dénominateur change chaque semaine.</p><p>Les deux surfaces doivent être mesurées par une méthode reproductible et datées. La multiplication longueur × largeur n’est qu’une approximation pour une plaie irrégulière. Les seuils guident l’orientation ; ils ne remplacent pas l’infection, la profondeur, la perfusion ou le terrain. Une peau saine ne possède pas une « surface normale de plaie » comparable.</p><p class="src">Source : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, niveaux 1A, 1B et signaux d’alarme</a>.</p></template>
<template data-pop="e11-pied-mesures" data-title="Mesures du pied : sens, seuils suisses et limites"><p>Le guide QualiCCare 2023 décrit l’absence de neuropathie par un monofilament à 4/4 et une perception vibratoire supérieure à 4/8 selon son protocole. Ces résultats concernent la sensibilité du pied. Ils ne sont pas des concentrations sanguines ; le nombre de sites et la technique doivent correspondre au protocole utilisé.</p><p>Pour sa première ligne, deux pouls du pied palpables et un indice cheville/bras d’au moins 0,9 soutiennent l’absence d’artériopathie significative. Un nombre de pouls inférieur à deux ou un indice inférieur à 0,9 fait suspecter l’artériopathie et conduit au niveau spécialisé. L’<button class="w" data-k="e11-calcul-ips">indice, ses mesures et ses limites</button> sont détaillés séparément.</p><p>La pression transcutanée d’oxygène évalue l’oxygène au niveau des tissus à travers la peau. La pression d’orteil est une pression artérielle systolique. Les deux s’expriment en mmHg, mais mesurent des phénomènes différents ; elles ne deviennent ni une saturation sanguine ni un rapport sans unité.</p><p>Le tableau ci-dessous rassemble les repères suisses de recours urgent. La technique standardisée et le contexte vasculaire restent nécessaires ; aucun intervalle universel de normalité n’est ajouté.</p><table class="t"><tr><th>Mesure</th><th>Repère QualiCCare d’ischémie critique</th></tr><tr><td>Indice cheville/bras</td><td>&lt; 0,5, sans unité</td></tr><tr><td>Pression transcutanée d’oxygène</td><td>&lt; 25 mmHg</td></tr><tr><td>Pression systolique d’orteil</td><td>&lt; 30 mmHg</td></tr></table><p>Un de ces signaux suffit à demander le niveau urgent dans le guide suisse. Un résultat au-dessus de sa borne ne suffit pas à exclure une artériopathie ou une plaie menacée ; on le confronte au pied et aux autres examens.</p><p class="src">Sources : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023, pages 3–4</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-Guidelines-2023.pdf" target="_blank" rel="noopener">IWGDF 2023, exploration vasculaire</a>.</p></template>
