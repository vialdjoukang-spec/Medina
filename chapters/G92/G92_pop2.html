<template data-pop="g92-dexa" data-title="Dexaméthasone dans l’ICANS">
<div class="lab">Place</div><p>Grade 2 et 3.</p>
<div class="lab">Posologie</div><p>10 à 20 mg par voie intraveineuse toutes les 6 heures.</p>
<div class="lab">Limite</div><p>Les corticoïdes préventifs sont déconseillés en routine. Effets indésirables et contre-indications ne sont pas détaillés dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://amiko.oddb.org (GTIN 7680669860011)" target="_blank" rel="noopener">Information professionnelle suisse Yescarta</a>.</p>
</template>
<template data-pop="g92-methylpred" data-title="Méthylprednisolone dans l’ICANS">
<div class="lab">Place</div><p>Grade 3 et 4.</p>
<div class="lab">Posologie</div><p>1000 mg par jour pendant 3 jours, puis, en grade 4, 250 mg toutes les 12 heures pendant 2 jours, 125 mg pendant 2 jours, 60 mg pendant 2 jours.</p>
<div class="lab">Limite</div><p>Effets indésirables non détaillés dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a>.</p>
</template>
<template data-pop="g92-anakinra" data-title="Anakinra">
<div class="lab">Place</div><p>ICANS réfractaire aux corticoïdes (pas d’amélioration d’un grade 3 ou 4 après trois jours de fortes doses).</p>
<div class="lab">Posologie</div><p>Jusqu’à 12 mg/kg/jour, typiquement 800 mg/jour par voie intraveineuse ; réponse globale d’environ 77 % dans des données observationnelles.</p>
<div class="lab">Preuves</div><p>À Berne (80 patients), l’anakinra prophylactique de 100 mg sous-cutané du jour 0 au jour 6 n’a pas réduit l’ICANS (35 % contre 25 %, p = 0,464).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13256764/" target="_blank" rel="noopener">Schmid et coll., anakinra prophylactique (Inselspital, Berne)</a>.</p>
</template>
<template data-pop="g92-tocilizumab" data-title="Tocilizumab">
<div class="lab">Mécanisme</div><p>Bloque le récepteur de l’interleukine 6.</p>
<div class="lab">Place</div><p>Traitement du syndrome de relargage de cytokines, non de l’ICANS isolé ; prophylaxie de routine non recommandée.</p>
<div class="lab">Posologie</div><p>8 mg/kg (30 kg ou plus) ou 12 mg/kg (moins de 30 kg) sur 60 minutes, jusqu’à 3 doses supplémentaires, intervalle d’au moins 8 heures, au plus 800 mg par perfusion.</p>
<div class="lab">Preuves</div><p>À Zurich, chez 26 patients de 70 ans et plus, le tocilizumab donné une heure avant la perfusion a été associé à moins de complications (p = 0,039) dans une petite série rétrospective.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13563374/" target="_blank" rel="noopener">Ussowicz et coll., revue européenne 2026 sur les complications précoces des CAR-T</a> ; <a href="https://amiko.oddb.org (GTIN 7680588680011)" target="_blank" rel="noopener">Information professionnelle suisse Actemra</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12432026/" target="_blank" rel="noopener">Stolz et coll., tocilizumab prophylactique (Zurich)</a>.</p>
</template>
<template data-pop="g92-cefepime" data-title="Céfépime">
<div class="lab">Risque</div><p>Encéphalopathie, myoclonies, convulsions dont état de mal non convulsif, surtout en cas de surdosage ou d’insuffisance rénale, chez le sujet âgé.</p>
<div class="lab">Posologie</div><p>Adapter si la clairance de la créatinine est de 50 mL/min ou moins ; l’hémodialyse de 3 heures élimine environ 68 % du produit.</p>
<div class="lab">Facteurs de risque</div><p>Débit de filtration glomérulaire estimé inférieur à 30 mL/min/1,73 m² (rapport de cotes 10,06 ; intervalle de confiance à 95 % de 5,05 à 20,03) ; perfusion continue associée à un rapport de cotes plus bas ; seuils de suivi proposés : creux de 20 mg/L (intermittent), concentration à l’équilibre de 63 mg/L (continu).</p>
<div class="lab">Évolution</div><p>Dans 85 % des cas d’une série de 73 patients, résolution en 1 à 5 jours.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680700080019)" target="_blank" rel="noopener">Information professionnelle suisse Cefepim Leman</a> ; <a href="https://doi.org/10.1002/bcp.70120" target="_blank" rel="noopener">Hardi et coll. 2025, méta-analyse sur la neurotoxicité du céfépime</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10370502/" target="_blank" rel="noopener">Ajibola et coll., revue systématique de cas de neurotoxicité du céfépime</a>.</p>
</template>
<template data-pop="g92-ifosfamide" data-title="Ifosfamide">
<div class="lab">Risque</div><p>Encéphalopathie, parfois mortelle, dans les heures ou jours après l’administration.</p>
<div class="lab">Évolution</div><p>Résolution le plus souvent en 48 à 72 heures après l’arrêt ; persistance ou guérison incomplète possibles.</p>
<div class="lab">Facteurs de risque</div><p>Hypoalbuminémie, atteinte rénale, mauvais état général, maladie pelvienne, cisplatine ; toxicité dose-dépendante.</p>
<div class="lab">Conduite</div><p>Interrompre en cas de toxicité du système nerveux central ; prudence ou arrêt des dépresseurs du système nerveux central ; le bleu de méthylène peut être envisagé (posologie non lue).</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680412170817)" target="_blank" rel="noopener">Information professionnelle suisse Holoxan</a>.</p>
</template>
<template data-pop="g92-valproate" data-title="Valproate de sodium">
<div class="lab">Mécanisme</div><p>Abaisse la carnitine, perturbe la bêta-oxydation et le cycle de l’urée, provoque une hyperammoniémie.</p>
<div class="lab">Risque</div><p>Encéphalopathie hyperammoniémique, coma, léthargie, syndrome parkinsonien réversible, ataxie ; rarement démence réversible avec atrophie cérébrale.</p>
<div class="lab">Conduite</div><p>Hyperammoniémie modérée sans symptôme : pas d’arrêt obligatoire ; avec symptômes : investigations ; surdosage : carnitine par voie intraveineuse, hémodialyse en cas de surdosage massif.</p>
<div class="lab">Contre-indication</div><p>Déficit du cycle de l’urée ; prudence avec mutations de POLG.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680347340125)" target="_blank" rel="noopener">Information professionnelle suisse Depakine</a>.</p>
</template>
<template data-pop="g92-metronidazole" data-title="Métronidazole">
<div class="lab">Risque</div><p>Très rare : encéphalopathie, céphalées, somnolence, vertiges, troubles visuels, ataxie, dysarthrie, convulsions.</p>
<div class="lab">Conduite</div><p>Arrêter en cas de convulsions, myoclonies, neuropathie périphérique, ataxie, vertiges ou confusion ; réduire la dose en insuffisance hépatique sévère.</p>
<p class="src">Références : <a href="https://amiko.oddb.org (GTIN 7680708870018)" target="_blank" rel="noopener">Information professionnelle suisse MetronidazoleSINT i.v.</a>.</p>
</template>
<template data-pop="g92-methotrexate" data-title="Méthotrexate">
<div class="lab">Risque</div><p>Neurotoxicité de quelques heures à plusieurs années après l’administration, transitoire à sévère.</p>
<div class="lab">Facteurs de risque</div><p>Prédisposition génétique, interactions, insuffisance rénale, radiothérapie concomitante.</p>
<div class="lab">Prévention</div><p>Hydratation, acide folinique (leucovorine), glucarpidase.</p>
<div class="lab">Limite</div><p>Source : résumé d’une revue de 2025 ; les doses ne sont pas reprises.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jns.2025.123514" target="_blank" rel="noopener">Besora et coll. 2025, neurotoxicité du méthotrexate</a>.</p>
</template>
<template data-pop="pareto-g92-definition" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="g92-0,g92-1,g92-2"></p><ul><li>G92 regroupe les atteintes cérébrales diffuses dues à un agent exogène ; G92.0 est l’ICANS, G92.9 les autres.</li><li>L’ICANS touche 20 à 60 % des receveurs de CAR-T et débute vers le jour 5.</li><li>Le diagnostic est clinique ; la source suisse impose une surveillance d’au moins 7 jours.</li></ul></template>
<template data-pop="pareto-g92-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="g92-3,g92-4"></p><ul><li>La cascade cytokinique rend la barrière hémato-encéphalique perméable.</li><li>Le tocilizumab prophylactique n’est pas recommandé en routine.</li><li>L’insuffisance rénale est le facteur de risque majeur du céfépime.</li></ul></template>
<template data-pop="pareto-g92-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g92-5,g92-6"></p><ul><li>L’exposition (date de perfusion, médicaments, fonction rénale) se recherche en premier.</li><li>L’écriture dégradée est un signe précoce ; le grade vient du paramètre le plus sévère.</li><li>Les céphalées isolées ne sont pas un marqueur utile.</li></ul></template>
<template data-pop="pareto-g92-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="g92-7,g92-8"></p><ul><li>Le diagnostic d’ICANS est clinique et d’exclusion.</li><li>EEG dès le grade 2 ; IRM ou scanner au grade 3 ou plus.</li><li>Crises, patient non évaluable ou signes d’hypertension intracrânienne : urgence vitale.</li></ul></template>
<template data-pop="pareto-g92-prise-en-charge" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g92-9,g92-10,g92-11"></p><ul><li>Grade 1 : soins de support ; grade 2 : dexaméthasone ; grades 3 et 4 : soins intensifs et méthylprednisolone.</li><li>Anakinra en cas d’ICANS réfractaire ; tocilizumab pour le syndrome de relargage de cytokines.</li><li>Pour une encéphalopathie médicamenteuse : adapter ou arrêter l’agent.</li></ul></template>
<template data-pop="pareto-g92-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="g92-e-1,g92-e-2"></p><ul><li>Gold standard de l’ICANS : examen clinique répété.</li><li>Le score ICE ne suffit pas : crises, motricité et œdème fixent aussi le grade.</li><li>Ponction lombaire et IRM excluent les autres causes.</li></ul></template>
<template data-pop="pareto-g92-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="g92-s-immuno-cours"></p><ul><li>Cytokines puis barrière perméable.</li><li>Pic des cytokines aux jours 7 à 14.</li></ul></template>
<template data-pop="pareto-g92-neuro" data-title="Pareto — Neurophysiologie">
<p class="ratio" data-cover="g92-s-neuro-cours"></p><ul><li>L’aphasie précède les crises et l’œdème.</li><li>L’électroencéphalogramme reconnaît l’état de mal non convulsif.</li></ul></template>
<template data-pop="pareto-g92-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g92-s-bioch-cours"></p><ul><li>Valproate : carnitine basse, cycle de l’urée altéré, hyperammoniémie.</li></ul></template>
<template data-pop="pareto-g92-imagerie" data-title="Pareto — Imagerie">
<p class="ratio" data-cover="g92-s-imagerie-cours"></p><ul><li>Hypersignal symétrique de la substance blanche, réversible si arrêt précoce.</li></ul></template>
<template data-pop="pareto-g92-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g92-p-1,g92-p-2,g92-p-3,g92-p-4"></p><ul><li>Le traitement suit le mécanisme.</li><li>Adapter la dose à la fonction rénale ; prudence avec les dépresseurs du système nerveux central.</li><li>Corticoïdes préventifs et tocilizumab prophylactique non recommandés en routine.</li></ul></template>
