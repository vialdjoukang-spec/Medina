<section class="ilot" id="b00-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme D., 24 ans, consulte pour des ulcérations vulvaires très douloureuses apparues il y a deux jours, avec fièvre, céphalées et brûlures mictionnelles. Or, à l’examen, de petites érosions groupées, à fond propre, siègent sur les petites lèvres, avec des adénopathies inguinales sensibles. Ainsi, ce tableau évoque un premier épisode d’<button class="w" data-k="b00-pa-gen">herpès génital</button>. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, comment confirmer le diagnostic et pourquoi le typage du virus importe ? Ensuite, quand traiter, avec quel schéma et pendant combien de temps ? Puis, quelles formes sont des urgences ? Enfin, comment gérer les récidives, la grossesse et l’immunodépression ?</p>
<div class="key"><b>À retenir.</b> Herpès génital suspecté : prélever la lésion pour PCR et traiter sans attendre le résultat.</div></section>

<section class="ilot" id="b00-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Pour répondre à ces questions, il faut d’abord définir les infections en cause. Les virus herpès simplex de type 1 et 2 (<button class="w" data-k="b00-s-hsv">HSV-1 et HSV-2</button>) infectent la peau et les muqueuses, puis restent latents dans les ganglions sensitifs. Par ailleurs, la recommandation européenne distingue la <button class="w" data-k="b00-pa-classif">primo-infection, l’épisode initial non primaire et la récurrence</button> ; en effet, cette distinction conditionne la durée du traitement et le conseil donné. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction</a>.</p>
<p>De plus, la topographie ne désigne plus le type viral. Ainsi, l’HSV-1, cause habituelle de l’herpès oro-labial, peut aussi provoquer un herpès génital ; en revanche, les récurrences génitales sont plus fréquentes avec l’HSV-2. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction</a>.</p>
<div class="key"><b>À retenir.</b> Type viral et caractère primaire ou non de l’épisode, et non le seul siège, déterminent le pronostic et le conseil.</div></section>

<section class="ilot" id="b00-pa-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Une fois les infections définies, reste à en mesurer la fréquence en Suisse. Or, l’herpès simplex n’est pas à déclaration obligatoire ; c’est pourquoi les meilleures données suisses sont séroépidémiologiques. En effet, dans une étude de population menée en 1992–1993 en Suisse romande et italienne sur 3120 sérums, la séroprévalence était de 80,0 % pour l’HSV-1 et de 19,3 % pour l’HSV-2 chez les adultes de 35 à 64 ans. <a href="https://doi.org/10.1186/1471-2334-4-10" target="_blank" rel="noopener" data-reference-source="1">Bünzli D et al., séroépidémiologie des virus herpès simplex en Suisse romande et italienne, BMC Infect Dis 2004;4:10</a>.</p>
<p>De plus, les deux séroprévalences augmentaient avec l’âge, et le sexe féminin était un facteur de risque d’infection par l’HSV-2. Cependant, ces données datent de plus de trente ans : aucune estimation suisse plus récente n’a été lue pour ce cours, ce qui constitue une lacune nommée. Enfin, seul un tiers des personnes qui acquièrent un herpès génital présentent des signes reconnus au moment de l’infection. <a href="https://doi.org/10.1186/1471-2334-4-10" target="_blank" rel="noopener" data-reference-source="1">Bünzli D et al., séroépidémiologie des virus herpès simplex en Suisse romande et italienne, BMC Infect Dis 2004;4:10</a> ; <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction</a>.</p>
<div class="key"><b>À retenir.</b> Infection très répandue et souvent méconnue : la plupart des porteurs ignorent leur infection.</div></section>

<section class="ilot" id="b00-pa-3"><h2><span class="n">3</span>Physiopathologie : latence et réactivation</h2>
<p>Cette fréquence des infections méconnues s’explique par la biologie du virus. En effet, après la primo-infection, le virus remonte le long des axones sensitifs jusqu’au ganglion correspondant, où il devient latent. Ensuite, il se réactive périodiquement ; dès lors, il provoque soit des lésions symptomatiques, soit une <button class="w" data-k="b00-pa-excretion">excrétion virale asymptomatique</button>, néanmoins contagieuse. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction</a>.</p>
<p>Par conséquent, la primo-infection est souvent la plus bruyante : lésions étendues, signes généraux, complications locales. À l’inverse, les récurrences sont plus brèves et plus localisées, car l’immunité déjà acquise limite la réplication. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, premier épisode</a>.</p>
<div class="key"><b>Corrélation clinique.</b> L’excrétion asymptomatique explique que la plupart des transmissions se produisent en l’absence de lésion visible.</div></section>

<section class="ilot" id="b00-pa-4"><h2><span class="n">4</span>Transmission</h2>
<p>Ce mécanisme commande le conseil de prévention. Ainsi, le risque de transmission est maximal pendant les lésions et les prodromes ; c’est pourquoi la recommandation conseille l’abstinence sexuelle pendant ces périodes. Toutefois, la transmission peut aussi survenir sans lésion, du fait de l’excrétion asymptomatique. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, risque de transmission</a>.</p>
<p>Dès lors, deux moyens réduisent le risque : le préservatif, dont l’efficacité est mieux démontrée de l’homme vers la femme, et le <button class="w" data-k="b00-p-supp">traitement suppressif</button>. De plus, la recommandation insiste sur un conseil franc, qui rappelle aussi la faible morbidité physique et la forte prévalence de l’infection. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, préservatifs et conseil</a>.</p>
<div class="trap"><span class="k">Piège.</span> Une sérologie négative du partenaire ou l’absence de lésion ne suppriment pas le risque : l’excrétion est intermittente et asymptomatique.</div></section>

<section class="ilot" id="b00-pa-5"><h2><span class="n">5</span>Herpès oro-labial</h2>
<p>Connaissant la transmission, on peut décrire les formes cliniques, en commençant par la plus fréquente. Ainsi, l’herpès labial récurrent se manifeste par des picotements ou des brûlures, puis par un bouquet de vésicules sur la jonction cutanéo-muqueuse de la lèvre, qui s’érodent et croûtent en quelques jours. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a>.</p>

<p>En revanche, la primo-infection oro-labiale de l’enfant peut prendre la forme d’une gingivostomatite étendue et fébrile. Par ailleurs, chez l’immunocompétent, l’herpès labial récurrent est bénin ; dès lors, un traitement oral précoce se discute surtout lorsque les récidives sont fréquentes ou gênantes. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>.</p></section>

<section class="ilot" id="b00-pa-6"><h2><span class="n">6</span>Herpès génital</h2>
<p>L’herpès génital, quant à lui, pose davantage de problèmes de diagnostic et de conseil. En effet, le premier épisode associe souvent des ulcérations multiples et douloureuses, des adénopathies inguinales, de la fièvre et des céphalées ; de plus, il peut se compliquer de <button class="w" data-k="b00-pa-compl">rétention urinaire, de méningite ou d’atteinte systémique</button>. À l’inverse, les récurrences, souvent annoncées par des prodromes, sont plus brèves et unilatérales. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, premier épisode</a>.</p>
<p>Cependant, le diagnostic clinique est insuffisant : la recommandation européenne demande une confirmation de laboratoire chez tout patient suspect, par <button class="w" data-k="b00-e-pcr">PCR sur frottis de la base de la lésion</button>, avec typage HSV-1 ou HSV-2 lors d’un premier épisode. Par ailleurs, il faut écarter les autres causes d’<button class="w" data-k="b00-pa-ddx">ulcération génitale</button>, au premier rang desquelles la syphilis. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, diagnostic</a>.</p>

<section class="ilot" id="b00-pa-7"><h2><span class="n">7</span>Urgences : encéphalite, œil, nouveau-né</h2>
<div class="alert"><b>Encéphalite herpétique.</b> Fièvre, confusion, troubles du comportement, crises convulsives ou signes focaux : hospitalisation, imagerie de préférence par IRM, ponction lombaire avec PCR, et aciclovir intraveineux 10 mg/kg toutes les 8 heures sans attendre les résultats, habituellement pendant 10 jours. <a href="https://doi.org/10.1111/j.1468-1331.2010.02970.x" target="_blank" rel="noopener" data-reference-source="1">Steiner I et al., recommandations de l’European Federation of Neurological Societies sur les méningo-encéphalites virales, Eur J Neurol 2010;17:999</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a>.</div>
<p>Parmi les urgences, l’<button class="w" data-k="b00-pa-ence">encéphalite herpétique</button> est la plus grave. En effet, l’aciclovir est le seul traitement antiviral dont l’efficacité est établie au niveau de preuve le plus élevé ; c’est pourquoi tout retard aggrave le pronostic. Ensuite, la <button class="w" data-k="b00-pa-kerat">kératite herpétique</button> relève de l’ophtalmologue. Enfin, l’<button class="w" data-k="b00-pa-neonat">herpès néonatal</button> impose un aciclovir intraveineux de 14 à 21 jours selon l’information suisse. <a href="https://doi.org/10.1111/j.1468-1331.2010.02970.x" target="_blank" rel="noopener" data-reference-source="1">Steiner I et al., recommandations de l’European Federation of Neurological Societies sur les méningo-encéphalites virales, Eur J Neurol 2010;17:999</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a>.</p>
<div class="trap"><span class="k">Piège.</span> Une encéphalite fébrile avec troubles du langage ou du comportement est herpétique jusqu’à preuve du contraire : l’aciclovir précède le résultat de la PCR.</div></section>

<section class="ilot" id="b00-pa-8"><h2><span class="n">8</span>Traitement de l’herpès génital</h2>
<p>En dehors des urgences, le traitement de l’herpès génital dépend du type d’épisode. Ainsi, le premier épisode doit être traité au plus tôt, sur la seule suspicion clinique, car il est long et souvent compliqué sans traitement. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, premier épisode</a>.</p>
<table class="t"><thead><tr><th>Premier épisode (IUSTI 2017)</th><th>Schéma, 5 à 10 jours</th></tr></thead><tbody>
<tr><td><button class="w" data-k="b00-p-aci">Aciclovir</button></td><td>400 mg trois fois par jour, ou 200 mg cinq fois par jour</td></tr>
<tr><td><button class="w" data-k="b00-p-val">Valaciclovir</button></td><td>500 mg deux fois par jour</td></tr>
<tr><td><button class="w" data-k="b00-p-fam">Famciclovir</button></td><td>250 mg trois fois par jour</td></tr>
</tbody></table>
<p>Le tableau montre ainsi des schémas équivalents ; dès lors, le choix tient au coût et à l’observance. De plus, si l’on choisit 5 jours, le patient doit être revu tôt, car la persistance de nouvelles lésions ou de signes généraux impose de prolonger. Enfin, des bains au sérum physiologique et une antalgie adaptée complètent le traitement ; la lidocaïne en gel est utilisable, en revanche la benzocaïne, très sensibilisante, est à éviter. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, premier épisode, mesures de soutien</a>.</p>
<button class="pareto-btn ui" data-k="pareto-b00-traitement">▲ Loi de Pareto — Traiter l’herpès</button></section>

<section class="ilot" id="b00-pa-9"><h2><span class="n">9</span>Récidives et traitement suppressif</h2>
<p>Une fois le premier épisode passé, l’enjeu devient la récidive. Or, la recommandation propose trois stratégies, choisies avec le patient : soins de soutien seuls, traitement épisodique ou traitement suppressif. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, récurrences</a>.</p>
<p>D’abord, le <button class="w" data-k="b00-p-epis">traitement épisodique</button> réduit la durée de l’épisode d’environ 1 à 2 jours, surtout s’il est pris par le patient dans les 24 heures ; c’est pourquoi les cures courtes sont recommandées en premier, par exemple valaciclovir 500 mg deux fois par jour pendant 3 jours. Ensuite, le <button class="w" data-k="b00-p-supp">traitement suppressif</button> réduit fortement la fréquence des récidives, par exemple aciclovir 400 mg deux fois par jour, ou valaciclovir 500 mg une fois par jour en dessous de 10 récidives par an. Enfin, il réduit l’excrétion virale et la transmission ; toutefois, son effet complet n’apparaît qu’après environ cinq jours. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, traitement épisodique et suppressif</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>.</p>
<div class="key"><b>À retenir.</b> Récidives rares : traitement épisodique court, à garder sur soi ; récidives fréquentes ou partenaire à protéger : traitement suppressif, réévalué périodiquement.</div></section>

<section class="ilot" id="b00-pa-10"><h2><span class="n">10</span>Grossesse</h2>
<p>Ces stratégies s’adaptent ensuite à la grossesse, où l’enjeu est l’herpès néonatal. Ainsi, en cas de récurrences connues, le risque néonatal est faible ; dès lors, un accouchement par voie basse est approprié en l’absence de lésion au travail. Par ailleurs, l’<button class="w" data-k="b00-p-grossesse">aciclovir 400 mg trois fois par jour dès 36 semaines</button> peut prévenir les lésions à terme et donc la césarienne. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, grossesse</a>.</p>
<p>En revanche, une primo-infection au troisième trimestre expose à une excrétion virale très élevée pendant le travail. C’est pourquoi la recommandation propose d’envisager une césarienne chez toutes ces femmes, en particulier si les symptômes apparaissent dans les six semaines précédant l’accouchement, et d’informer le pédiatre. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, grossesse</a>.</p>
<div class="trap"><span class="k">Piège.</span> Le risque néonatal majeur vient de la primo-infection en fin de grossesse, et non de la récurrence maternelle connue.</div></section>

<section class="ilot" id="b00-pa-11"><h2><span class="n">11</span>Immunodépression et situations particulières</h2>
<p>Les mêmes principes valent enfin chez l’immunodéprimé, avec des doses ou des durées plus importantes. Ainsi, chez la personne vivant avec le VIH, la recommandation européenne retient un traitement épisodique d’environ cinq jours et des cures ultracourtes à utiliser avec prudence ; de plus, une résistance à l’aciclovir est plus fréquente chez l’immunodéprimé sévère et demande un avis spécialisé. <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, VIH</a>.</p>
<p>Par ailleurs, l’insuffisance rénale impose d’adapter la dose de tous les analogues nucléosidiques et d’assurer une hydratation suffisante. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>.</p>
<p><b>Cas récapitulatif.</b> Pour conclure, Mme D. a un frottis prélevé pour PCR avec typage et un dépistage de la syphilis et du VIH ; ensuite, elle reçoit un antiviral oral pendant 5 à 10 jours, une antalgie et des bains au sérum physiologique. Enfin, le résultat HSV-1 ou HSV-2 guidera le conseil sur les récidives.</p></section>

<section class="ilot" id="b00-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>

<tr><td>Premier épisode génital</td><td>5 à 10 jours d’antiviral oral</td></tr>
<tr><td>Épisodique</td><td>Cures courtes, dans les 24 heures ; gain de 1 à 2 jours</td></tr>
<tr><td>Grossesse avec récurrences</td><td>Aciclovir 400 mg trois fois par jour dès 36 semaines</td></tr>
