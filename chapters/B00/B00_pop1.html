<p>Herpèsvirus alpha humains à ADN double brin. HSV-1 : herpès oro-labial, de plus en plus génital. HSV-2 : surtout génital, avec des récurrences génitales plus fréquentes. Latence dans les ganglions sensitifs.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="b00-pa-classif" data-title="Types d’épisodes">
<ul><li>Primo-infection : premier contact avec HSV-1 ou HSV-2, sans anticorps préexistants.</li><li>Épisode initial non primaire : premier épisode clinique d’un type chez une personne déjà porteuse d’anticorps contre l’autre type.</li><li>Récurrence : réactivation d’un type déjà présent.</li></ul><p>La sérologie spécifique de type permet, au premier épisode, de distinguer ces situations.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, introduction et sérologie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-pa-excretion" data-title="Excrétion virale asymptomatique">
<p>Réactivation sans lésion visible, au cours de laquelle du virus est présent sur les muqueuses. Intermittente, elle explique la transmission en l’absence de symptômes ; le traitement suppressif la réduit sans l’annuler.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, transmission</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-pa-compl" data-title="Complications du premier épisode génital">
<ul><li>Une rétention urinaire peut survenir.</li><li>Un méningisme ou une méningite lymphocytaire peut survenir.</li><li>Atteinte systémique sévère, nécessitant parfois une hospitalisation.</li></ul><p>Le traitement intraveineux n’est indiqué que si la voie orale est impossible, par exemple en cas de vomissements.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, premier épisode</a>. Textes lus le 9 octobre 2026.</div>
</template>

<p>Méthode de référence : plus sensible et plus spécifique que la culture. Frottis de la base de la lésion, vésicule décoiffée avec une aiguille ; prélèvement aussi précoce que possible. Typage HSV-1 ou HSV-2 recommandé au premier épisode. Pas de frottis chez l’asymptomatique.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, diagnostic</a>. Textes lus le 9 octobre 2026.</div>

<template data-pop="b00-pa-ddx" data-title="Ulcération génitale : diagnostic différentiel">
<ul><li>Syphilis primaire : chancre souvent unique, induré, peu douloureux ; sérologie et PCR.</li><li>Lymphogranulomatose vénérienne, chancre mou : rares en Suisse, contexte d’exposition.</li><li>Causes non infectieuses : aphtose, maladie de Behçet, toxidermie fixe, traumatisme.</li></ul><p>En pratique : PCR herpès et dépistage des autres infections sexuellement transmissibles, dont le VIH et la syphilis.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-pa-ence" data-title="Encéphalite herpétique">
<div class="lab">Diagnostic</div><p>Analyse du liquide cérébrospinal avec PCR (niveau A) et imagerie, de préférence par IRM (niveau B) ; hospitalisation avec accès aux soins intensifs.</p><div class="lab">Traitement</div><p>Aciclovir intraveineux, seul antiviral d’efficacité démontrée (niveau A) : 10 mg/kg toutes les 8 heures, habituellement 10 jours selon l’information suisse, perfusé en une heure, dose adaptée à la fonction rénale. Les corticoïdes ne sont pas généralement considérés comme efficaces.</p><div class="src">Sources : <a href="https://doi.org/10.1111/j.1468-1331.2010.02970.x" target="_blank" rel="noopener" data-reference-source="1">Steiner I et al., recommandations de l’European Federation of Neurological Societies sur les méningo-encéphalites virales, Eur J Neurol 2010;17:999</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-pa-kerat" data-title="Kératite herpétique">
<p>Atteinte cornéenne par le virus herpès simplex, indication reconnue de l’aciclovir dans l’information suisse ; œil rouge douloureux avec baisse de vision : avis ophtalmologique le jour même.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-pa-neonat" data-title="Herpès néonatal">
<p>Infection du nouveau-né, le plus souvent acquise au passage de la filière génitale lors d’une primo-infection maternelle de fin de grossesse. Traitement : aciclovir intraveineux, habituellement 14 à 21 jours selon l’information suisse.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a> ; <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, grossesse</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-p-aci" data-title="Aciclovir">
<p>Analogue nucléosidique activé par la thymidine kinase virale. Voie orale : herpès cutanéo-muqueux 200 mg cinq fois par jour, toutes les 4 heures avec pause nocturne, 5 jours et plus ; suppression 200 mg quatre fois par jour ou 400 mg deux fois par jour, avec pause périodique après 6 à 12 mois. Voie intraveineuse : herpès 5 mg/kg toutes les 8 heures ; encéphalite 10 mg/kg toutes les 8 heures.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=45343" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® comprimés, décembre 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44772" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Zovirax® i.v., décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-p-val" data-title="Valaciclovir">
<p>Promédicament de l’aciclovir. Herpès : 500 mg deux fois par jour, 5 jours en cas de récurrence, jusqu’à 10 jours pour une primo-infection sévère, à débuter dès les prodromes. Suppression : 500 mg une fois par jour ; 250 mg deux fois par jour si au moins 10 récidives par an ; arrêt au plus tard à 12 mois pour réévaluer.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-p-fam" data-title="Famciclovir">
<p>Promédicament du penciclovir. Recommandation européenne : premier épisode génital 250 mg trois fois par jour pendant 5 à 10 jours ; récurrence en cure ultracourte 1 g deux fois par jour pendant un jour. Données insuffisantes pendant la grossesse.</p><div class="src">Sources : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=52693" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Famvir®, août 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-p-epis" data-title="Traitement épisodique des récurrences génitales">
<div class="lab">Cures courtes, en premier</div><ul><li>Aciclovir 800 mg trois fois par jour pendant 2 jours.</li><li>Famciclovir 1 g deux fois par jour pendant 1 jour.</li><li>Valaciclovir 500 mg deux fois par jour pendant 3 jours.</li></ul><div class="lab">Effet</div><p>Gain médian de 1 à 2 jours ; efficacité maximale si débuté par le patient dans les 24 heures ; jusqu’à un tiers de lésions avortées. Le patient garde quelques comprimés sur lui.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, traitement épisodique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-p-supp" data-title="Traitement suppressif">
<div class="lab">Doses (IUSTI 2017)</div><ul><li>Aciclovir 400 mg deux fois par jour.</li><li>Valaciclovir 500 mg une fois par jour si moins de 10 récidives par an ; 1 g une fois par jour au-delà.</li></ul><div class="lab">Effets</div><p>Forte baisse des récidives ; réduction de l’excrétion et de la transmission, en association avec le préservatif. Effet complet après environ 5 jours ; réévaluation périodique.</p><div class="src">Sources : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, traitement suppressif</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=53116" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Valtrex®, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-p-grossesse" data-title="Aciclovir en fin de grossesse">
<p>Aciclovir 400 mg trois fois par jour dès 36 semaines d’aménorrhée chez la femme ayant des récurrences génitales, pour prévenir les lésions à terme et donc la césarienne. Primo-infection au troisième trimestre : césarienne à envisager, aciclovir jusqu’à l’accouchement, information du pédiatre.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, grossesse</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b00-e-sero" data-title="Sérologie spécifique de type">
<p>Recherche d’anticorps IgG dirigés contre la glycoprotéine G propre à HSV-1 ou à HSV-2. Pas en routine chez l’asymptomatique ; utile en cas de récidives atypiques à PCR négative, ou pour distinguer primo-infection et infection ancienne. Les IgM ne sont pas recommandées.</p><div class="src">Source : <a href="https://doi.org/10.1177/0956462417727194" target="_blank" rel="noopener" data-reference-source="1">Patel R et al., « 2017 European guidelines for the management of genital herpes » (IUSTI-Europe), Int J STD AIDS 2017;28:1366-1379, sérologie</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-b00-clinique" data-title="Loi de Pareto — Reconnaître l’herpès">
<p class="ratio" data-cover="b00-pa-1,b00-pa-3,b00-pa-5,b00-pa-6,b00-pa-7"></p><ul><li>Des vésicules groupées laissent place à des érosions douloureuses, et les récurrences surviennent au même endroit.</li><li>Un herpès génital justifie une PCR sur frottis, un typage et un dépistage de la syphilis et du VIH.</li><li>Une fièvre avec confusion fait suspecter une encéphalite et impose l’aciclovir intraveineux immédiat.</li></ul>
</template>
<template data-pop="pareto-b00-traitement" data-title="Loi de Pareto — Traiter l’herpès">
<p class="ratio" data-cover="b00-pa-8,b00-pa-9,b00-pa-10"></p><ul><li>Le premier épisode se traite par antiviral oral pendant 5 à 10 jours.</li><li>Les récurrences se traitent par cure courte épisodique ou par traitement suppressif.</li><li>Pendant la grossesse, l’aciclovir débute dès 36 semaines en cas de récurrences.</li></ul>
</template>
<template data-pop="pareto-b00-examens" data-title="Loi de Pareto — Examens de l’herpès">
<p class="ratio" data-cover="b00-e-1,b00-e-2"></p><ul><li>La PCR se fait sur un frottis précoce.</li><li>La sérologie de type est réservée à des cas choisis.</li><li>Le cytodiagnostic de Tzanck et l’immunofluorescence sont abandonnés.</li></ul>
</template>
<template data-pop="pareto-b00-pharma" data-title="Loi de Pareto — Pharmacologie de l’herpès">
<p class="ratio" data-cover="b00-p-1,b00-p-2,b00-p-3"></p><ul><li>L’aciclovir, le valaciclovir et le famciclovir ont une efficacité équivalente.</li><li>L’encéphalite se traite par aciclovir intraveineux.</li><li>On adapte la dose à la fonction rénale, et l’aciclovir est préféré pendant la grossesse.</li></ul>
</template>
