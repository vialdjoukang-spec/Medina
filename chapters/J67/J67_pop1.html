<template data-pop="j67-definition" data-title="Pneumopathie d’hypersensibilité : définition"><p class="lab">Définition</p><p>La recommandation ATS/JRS de 2020 définit la PHS comme une maladie inflammatoire et/ou fibrosante du parenchyme pulmonaire et des petites voies aériennes, résultant typiquement d’une réaction immunitaire provoquée par un antigène inhalé, apparent ou occulte, chez un sujet prédisposé. La recommandation allemande S2k 2024 précise que la réaction n’est pas médiée par les IgE.</p><p class="lab">Noms et variantes</p><p>« Alvéolite allergique extrinsèque » est l’ancien nom. Chaque variante porte le nom de sa source : poumon de fermier, d’éleveur d’oiseaux, des humidificateurs, des machinistes. Lorsque aucun antigène n’est retrouvé malgré une enquête complète, certains experts parlent de PHS cryptogénique ; son existence reste débattue.</p><div class="key"><b>Conséquence.</b> Le mot « sensibilisé » rappelle qu’une exposition ne suffit pas : la plupart des exposés ne tombent jamais malades.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Définition</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Définition</a>.</p></template>
<template data-pop="j67-delai" data-title="Délai entre exposition et symptômes"><p class="lab">Données</p><p>Dans la forme aiguë, fièvre, frissons, céphalées, arthralgies, toux sèche, oppression et dyspnée surviennent trois à douze heures après une exposition intense et répétée, puis disparaissent en 24 à 48 heures après l’éviction, souvent sans traitement. Des symptômes débutant quatre à huit heures après l’exposition figurent parmi les six prédicteurs cliniques de l’étude prospective internationale de Lacasse, avec l’exposition, les anticorps, les épisodes récidivants, les crépitants et l’amaigrissement.</p><p class="lab">Mécanisme</p><p>La réaction n’est pas médiée par les IgE : elle ne se déclare pas dans les minutes qui suivent l’exposition. Au test de provocation, la réponse typique est tardive, avec fièvre et trouble restrictif ; une réponse immédiate de type asthmatique est possible mais n’est pas la règle.</p><div class="key"><b>Piège.</b> Le critère chronologique manque dans les formes chroniques, où l’exposition est continue et faible.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/12842854/" target="_blank" rel="noopener">Lacasse et al., 2003</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Forme aiguë et Test de provocation</a>.</p></template>
<template data-pop="j67-classification" data-title="Classer la PHS : fibrosante ou non"><p class="lab">Recommandation ATS/JRS de 2020</p><p>Les catégories aiguë, subaiguë et chronique étaient mal délimitées et variaient d’une étude à l’autre. Le comité de l’ATS, de la JRS et de l’Asociación Latinoamericana de Tórax a donc retenu, à l’unanimité, deux phénotypes : non fibrosant (purement inflammatoire) et fibrosant (inflammatoire et fibrosant, ou purement fibrosant). En cas de lésions mixtes, la prédominance décide. La fibrose radiologique ou histologique est en effet le principal déterminant du pronostic.</p><p class="lab">Recommandation allemande S2k 2024</p><p>La forme subaiguë s’est révélée difficile à définir dans une analyse en grappes de 168 patients. La recommandation garde l’opposition aiguë ou chronique, qui décrit mieux les « bouffées » professionnelles ou domestiques, puis divise la forme chronique en non fibrosante et fibrosante (consensus fort, 100 %).</p><div class="key"><b>Usage.</b> Les deux classifications convergent sur l’essentiel : la présence d’une fibrose change le pronostic et le traitement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandation 1</a>.</p></template>
<template data-pop="j67-s2k" data-title="Recommandation allemande S2k 2024"><p>Publiée en 2024 en allemand dans Pneumologie, puis en 2025 en anglais dans Respiration, elle émane de la Société allemande de pneumologie et de la Société allemande d’allergologie et d’immunologie clinique. Elle remplace les recommandations diagnostiques allemandes de 2007 et formule douze recommandations de consensus. C’est la première recommandation sur la PHS à inclure le traitement.</p><p class="lab">Apports</p><p>Classification aiguë ou chronique puis fibrosante ou non ; questionnaire standardisé ; IgG spécifiques avec seuils publiés ; classement radiologique pragmatique inflammatoire ou fibrosant ; abandon du rapport CD4/CD8 du LBA ; critères diagnostiques séparés ; stratégie anti-inflammatoire et antifibrosante ; aspects de maladie professionnelle.</p><div class="key"><b>Place dans ce cours.</b> Source européenne la plus récente sur la PHS identifiée au 09.10.2026, elle fonde toutes les conduites du cours. La recommandation de 2020 (ATS, JRS, Asociación Latinoamericana de Tórax) n’est cosignée par aucune société européenne : elle sert ici de source de définitions et de données, et ses divergences sont exposées dans la fenêtre consacrée au contentieux.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., Respiration 2025</a>.</p></template>
<template data-pop="j67-byssinose" data-title="Byssinose et maladies des poussières textiles"><p class="lab">Deux définitions</p><p>La définition de l’OMS repose sur l’oppression thoracique liée au travail ; celle de Schilling y ajoute, au grade le plus élevé, une baisse du VEMS. Dans l’enquête Multitex de 2031 ouvriers de Karachi, la prévalence était de 3 % selon l’OMS et de 4 % selon Schilling, alors que 15 % rapportaient une oppression thoracique.</p><p class="lab">Épidémiologie</p><p>Une revue systématique de 26 études dans des pays à revenu faible ou intermédiaire rapporte une prévalence de 8 à 38 %, fortement corrélée au niveau de poussière de coton (r = 0,72). La maladie est devenue rare dans les pays à haut revenu, où les expositions ont baissé.</p><div class="key"><b>Lacune.</b> Aucune donnée européenne récente propre à la maladie du lin ou à la cannabinose n’a été trouvée ; une étude turque de 2016 rapporte 28,2 % de byssinose chez les ouvriers exposés au chanvre et au jute.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9985716/" target="_blank" rel="noopener">Nafees et al., 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35073782/" target="_blank" rel="noopener">Nafees et al., revue systématique, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26489943/" target="_blank" rel="noopener">Er et al., 2016</a>.</p></template>
<template data-pop="j67-odts" data-title="Syndrome toxique des poussières organiques"><p class="lab">Définition et mécanisme</p><p>L’ODTS est une maladie fébrile non infectieuse causée par les endotoxines des parois des bactéries à Gram négatif ou par des mycotoxines. Comme la PHS aiguë, il provoque de la fièvre trois à douze heures après l’inhalation de poussières organiques ; il s’accompagne de toux, d’hyperréactivité bronchique, d’une dyspnée modérée, de céphalées et d’un malaise. On l’appelle « fièvre du battage » chez l’agriculteur et « fièvre des humidificateurs » chez les sujets exposés aux humidificateurs.</p><p class="lab">Distinction avec la PHS</p><p>L’ODTS ne s’accompagne habituellement ni d’IgG spécifiques élevées, ni de trouble fonctionnel, ni d’anomalie radiographique. Chez les éleveurs de porcs néerlandais, sa prévalence était de 6,4 % contre 2,6 % chez des témoins ruraux.</p><div class="key"><b>Conséquence.</b> Devant une fièvre liée au travail, l’anamnèse professionnelle détaillée oriente le diagnostic ; une méconnaissance de la PHS, à l’inverse, peut aboutir à la transplantation (revue suisse de 2024).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Diagnostic différentiel</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10086208/" target="_blank" rel="noopener">Vogelzang et al., 1999</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38655831/" target="_blank" rel="noopener">Schumacher, Clarenbach et Dressel, Ther Umsch 2024</a>.</p></template>
<template data-pop="j67-pronostic" data-title="Facteurs pronostiques"><p class="lab">Imagerie</p><p>Dans une cohorte américaine, la survie médiane sans transplantation dépassait 14,7 ans dans la forme non fibrosante et 7,9 ans dans la fibrose sans rayon de miel, contre 5,2 ans dans la FPI ; avec rayon de miel, elle tombait à 2,8 ans, comme dans la FPI. Le piégeage et la mosaïque s’associent au contraire à une meilleure survie.</p><p class="lab">Clinique et fonction</p><p>Une CVF basse, une baisse de la CVF d’au moins 10 % en six à douze mois, une DLCO inférieure à 50 % de la valeur prédite et la désaturation d’effort prédisent la mortalité. L’absence d’antigène identifié est un facteur indépendant de survie plus courte : 4,9 contre 8,75 ans dans une cohorte de 142 patients. L’HTP, l’hippocratisme digital et les variants des gènes des télomères aggravent aussi le pronostic ; une lymphocytose du LBA s’associe au contraire à un meilleur pronostic et à une meilleure réponse à l’immunosuppression.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6514431/" target="_blank" rel="noopener">Salisbury et al., Chest 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23828161/" target="_blank" rel="noopener">Fernández Pérez et al., Chest 2013</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Paramètres pronostiques</a>.</p></template>
<template data-pop="j67-neutro" data-title="Alvéolite à neutrophiles initiale"><p>Dans les 48 heures qui suivent une exposition, le LBA montre une alvéolite à neutrophiles, médiée par l’interleukine 8 ; la lymphocytose ne s’installe qu’après 48 à 72 heures. Dans la forme chronique fibrosante, une lymphocytose faible ou absente avec des neutrophiles élevés est également possible.</p><div class="key"><b>Conséquence.</b> Un LBA réalisé juste après une exposition ou un test de provocation peut sous-estimer la lymphocytose ; le moment du prélèvement doit être noté.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Pathogenèse et LBA</a>.</p></template>
<template data-pop="j67-type3" data-title="Composante humorale : rôle des IgG"><p>La PHS associe une composante humorale, dite de type III, et une composante cellulaire, dite de type IV. Les IgG spécifiques, produites par les lymphocytes B activés, sont considérées comme des marqueurs d’exposition ; leur rôle propre dans la maladie reste mal compris, car on les trouve aussi chez des sujets exposés sains.</p><div class="key"><b>Conséquence.</b> Les IgG orientent vers l’antigène, mais leur seule présence ne fait pas le diagnostic.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Pathogenèse</a>.</p></template>
<template data-pop="j67-granulome" data-title="Granulome de la PHS"><p class="lab">Formation</p><p>Les macrophages alvéolaires activés stimulent les lymphocytes Th1, dont le TNF-α est nécessaire à la formation des granulomes ; les cytokines Th1 conduisent à une infiltration prédominante de lymphocytes T CD8.</p><p class="lab">Aspect</p><p>Le granulome de la PHS est petit, mal limité, non nécrosant, fait de cellules épithélioïdes et de cellules géantes, et dispersé dans l’interstitium péribronchiolaire. Il manque chez un tiers des biopsies de forme non fibrosante. Celui de la sarcoïdose est au contraire volumineux, bien formé, parfois confluent, et suit les lymphatiques.</p><div class="key"><b>Piège.</b> Un granulome nécrosant impose de rechercher une mycobactérie ou un champignon par colorations, cultures et amplification génique.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Pathogenèse et Histopathologie</a>.</p></template>
<template data-pop="j67-piegeage" data-title="Piégeage aérique et mosaïque"><p class="lab">Mécanisme</p><p>La bronchiolite crée une obstruction des petites voies aériennes ; les lobules en aval restent hyperinflatés. En expiration, ils ne perdent ni volume ni densité, alors que le poumon sain se densifie. Dans ces lobules, la vasoconstriction pulmonaire hypoxique réduit le calibre des vaisseaux.</p><p class="lab">Lecture</p><p>Le piégeage se voit mieux en expiration et sur les reconstructions en intensité minimale. Il ne compte comme signe bronchiolaire qu’en dehors des zones fibreuses, où la distorsion crée un piégeage secondaire. La probabilité de PHS fibrosante augmente si le piégeage touche plus de trois lobes ou plus de 5 % du parenchyme ; ce dernier seuil donnait une sensibilité de 91 % et une spécificité de 77 % face aux autres PID fibrosantes.</p><div class="key"><b>Limite.</b> Un piégeage existe aussi dans les connectivites et la sarcoïdose.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Radiologie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020</a>.</p></template>
<template data-pop="j67-fermier" data-title="Poumon de fermier"><p class="lab">Antigènes</p><p>Il résulte d’expositions répétées au foin et à la paille humides. Les actinomycètes thermophiles (Saccharopolyspora rectivirgula, Thermoactinomyces vulgaris, Laceyella sacchari) et des moisissures (Aspergillus, Alternaria, Lichtheimia corymbifera) en sont les principaux antigènes.</p><p class="lab">Évolution</p><p>Dans sa forme chronique, un emphysème peut dominer la fibrose. L’incidence augmente dans les régions pluvieuses, surtout à la période des récoltes.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Poumon de fermier et Pneumopathie fibrosante</a>.</p></template>
<template data-pop="j67-oiseaux" data-title="Poumon d’éleveur d’oiseaux et duvet"><p class="lab">Antigènes</p><p>Il est probablement la forme la plus fréquente dans le monde. Les antigènes sont les protéines des fientes, des plumes, surtout du duvet sous-jacent, et du sérum des pigeons, perruches et perroquets, mais aussi des oiseaux sauvages. Une exposition indirecte suffit : les antigènes aviaires sont considérés comme ubiquitaires.</p><p class="lab">Duvet</p><p>L’alvéolite au duvet d’oie ou de canard prend une place croissante : dans une série espagnole de 127 PHS, elle en expliquait 26 % ; sa prévalence était de 6,2 pour 100 000 personnes exposées au duvet, contre 54,6 pour 100 000 éleveurs d’oiseaux.</p><p class="lab">Éviction</p><p>Les antigènes persistent jusqu’à dix-huit mois dans la poussière domestique après le départ des oiseaux ; leur quantité prédisait l’aggravation dans une série japonaise de 23 patients. Oreillers, couettes et vêtements en duvet doivent aussi disparaître.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Poumon d’éleveur d’oiseaux</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26010749/" target="_blank" rel="noopener">Tsutsui et al., 2015</a>.</p></template>
<template data-pop="j67-humidificateur" data-title="Sources hydriques : humidificateurs, fluides de coupe, bains bouillonnants"><p class="lab">Humidificateurs</p><p>Le poumon des humidificateurs fut d’abord une maladie professionnelle des menuiseries, reliures et imprimeries ; des mesures d’hygiène l’ont fait reculer. Les fontaines et brumisateurs à ultrasons des logements et des cabinets médicaux ont créé une forme nouvelle.</p><p class="lab">Fluides de coupe</p><p>Le poumon des machinistes touche les ouvriers exposés aux fluides d’usinage contaminés. Dans un registre britannique, l’exposition professionnelle expliquait 50 des 206 PHS, surtout par contamination de ces fluides. Le panel d’IgG doit comprendre au moins un antigène de Pseudomonas et Mycobacterium immunogenum.</p><p class="lab">Bains bouillonnants</p><p>Le complexe Mycobacterium avium des jacuzzis, douches ou piscines privées provoque une maladie à la fois infectieuse et immunologique, qui guérit souvent avec l’éviction ou des corticoïdes, sans traitement antimycobactérien.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Variantes de la maladie</a>.</p></template>
<template data-pop="j67-genetique" data-title="Prédisposition génétique"><p>Seule une minorité des exposés développe une PHS, et des agrégations familiales existent. Des variants du complexe majeur d’histocompatibilité (HLA-DR3 dans le poumon d’éleveur d’oiseaux) et du promoteur du gène du TNF ont été décrits. L’allèle mineur T du polymorphisme de MUC5B est plus fréquent dans la forme chronique et s’associe à l’étendue de la fibrose et à une survie plus courte. Environ 10 % des patients atteints de forme chronique portent des variants rares des gènes des télomères, associés à des télomères courts et à une survie sans transplantation réduite.</p><div class="key"><b>Conséquence.</b> Une fibrose d’allure familiale fait redouter une moins bonne tolérance de l’immunosuppression.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Susceptibilité génétique</a>.</p></template>
<template data-pop="j67-tabac" data-title="Tabac : effet paradoxal"><p class="lab">Mécanisme</p><p>Les propriétés immunosuppressives du tabac, en particulier de la nicotine inhalée, altèrent la fonction des macrophages alvéolaires et réduisent la production de TNF-α. Après une forte exposition, les fumeurs ont des IgG spécifiques plus basses que les non-fumeurs.</p><p class="lab">Conséquences</p><p>Le tabac s’associe à un risque plus faible de PHS, mais les formes chroniques fibrosantes sont plus souvent associées au tabagisme, et le tabac aggrave le pronostic. Les IgG remontent après le sevrage.</p><div class="key"><b>Piège.</b> Une sérologie négative chez un fumeur ne permet pas d’exclure une sensibilisation.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Facteurs de risque et IgG</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Pronostic</a>.</p></template>
<template data-pop="j67-dyspnee" data-title="Dyspnée de la forme chronique"><p>Dans la forme chronique insidieuse, la dyspnée d’effort progressive est souvent le seul symptôme ; une fibrose avancée peut déjà exister lors de la première consultation. Elle traduit le trouble restrictif et l’altération du transfert gazeux, avec hypoxémie de repos ou d’effort. Toux, amaigrissement et sibilants peuvent s’y ajouter.</p><div class="key"><b>Conséquence.</b> Une dyspnée inexpliquée avec crépitants justifie une TDM en haute résolution, puis l’enquête d’exposition.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Forme chronique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020</a>.</p></template>
<template data-pop="j67-questionnaire" data-title="Questionnaires d’exposition"><p class="lab">Données</p><p>Dans deux études observationnelles de 19 et 46 patients, un questionnaire a identifié l’antigène dans 59 et 100 % des cas. Il l’identifiait plus souvent que l’anamnèse simple (risque relatif 3,80) ou que les IgG (1,58). Un bon questionnaire tient compte des particularités régionales, culturelles et saisonnières.</p><p class="lab">Outil suisse</p><p>Le groupe suisse des pneumopathies interstitielles et rares et la Société suisse de pneumologie ont publié en 2023 un questionnaire d’exposition adapté aux conditions régionales, conçu pour être simple à utiliser par les patients et les cliniciens. Seule sa notice bibliographique a pu être consultée ; son contenu n’est pas détaillé ici.</p><p class="lab">Position des recommandations</p><p>La recommandation allemande conseille un questionnaire standardisé, qui ne remplace pas l’anamnèse. La recommandation ATS/JRS de 2020 ne se prononce ni pour ni contre, faute de questionnaire validé.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandation 2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37088078/" target="_blank" rel="noopener">Pohle et al., questionnaire suisse, Respiration 2023</a>.</p></template>
<template data-pop="j67-crepitants" data-title="Crépitants inspiratoires"><p>Des crépitants inspiratoires fins s’entendent dans la forme aiguë et figurent parmi les cinq critères non invasifs de la recommandation allemande. Associés à une exposition évidente, à des accès liés à l’exposition et à des IgG positives, ils portent la probabilité de PHS à 97 %.</p><div class="key"><b>Limite.</b> Ils ne distinguent pas la PHS des autres PID ; ils indiquent une atteinte parenchymateuse qui justifie l’imagerie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, tableau 9</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12842854/" target="_blank" rel="noopener">Lacasse et al., 2003</a>.</p></template>
<template data-pop="j67-squeaks" data-title="Couinements mésoinspiratoires"><p>Ce sont des bruits brefs et aigus de milieu d’inspiration, appelés en anglais « squeaks », « chirping rales » ou « squawks ». La recommandation ATS/JRS de 2020 les cite parmi les signes fréquents des deux phénotypes et parmi les prédicteurs potentiels du diagnostic, d’utilité limitée.</p><div class="key"><b>Limite.</b> Leur mécanisme n’est pas détaillé par les recommandations lues ; leur présence renforce la suspicion sans la confirmer.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Symptômes et signes</a>.</p></template>
<template data-pop="j67-hippocratisme" data-title="Hippocratisme digital"><p>On le trouve chez jusqu’à la moitié des patients atteints de PHS chronique, où il annonce un pronostic défavorable.</p><div class="key"><b>Conséquence.</b> Un hippocratisme chez un patient exposé impose de rechercher une fibrose et d’en mesurer l’évolution.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Forme chronique</a>.</p></template>
<template data-pop="j67-confiance" data-title="Niveaux de confiance diagnostique (2020)"><p class="lab">Principe</p><p>La recommandation ATS/JRS de 2020 intègre trois domaines : identification de l’exposition (anamnèse, IgG, provocation en centre expert), aspect TDM (typique, compatible ou indéterminé) et lymphocytose du LBA ou histologie. Elle exprime le diagnostic en confiance : certain (au moins 90 %), élevé (80 à 89 %), modéré (70 à 79 %) ou faible (51 à 69 %).</p><p class="lab">Usage</p><p>Une exposition identifiée, un aspect TDM typique et une lymphocytose du LBA donnent un diagnostic de confiance élevée sans autre examen. Les autres combinaisons passent en discussion multidisciplinaire, éventuellement suivie d’un prélèvement histologique. Un diagnostic de faible confiance peut suffire lorsque d’autres examens ne changeraient pas la conduite ou sont trop risqués ; il est réévalué aux visites suivantes.</p><div class="key"><b>Limite.</b> L’accord entre équipes multidisciplinaires reste faible pour la PHS (kappa 0,29, contre 0,79 pour la FPI).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Critères diagnostiques</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Diagnostic différentiel</a>.</p></template>
<template data-pop="j67-contentieux" data-title="Contentieux : recommandation allemande 2024 ou recommandation ATS/JRS 2020"><p class="lab">Points de divergence</p><table class="t"><tr><th>Question</th><th>ATS/JRS 2020</th><th>Allemande S2k 2024</th></tr><tr><td>Classification</td><td>Fibrosante ou non seulement</td><td>Aiguë ou chronique, puis fibrosante ou non</td></tr><tr><td>TDM</td><td>Typique, compatible, indéterminée</td><td>Inflammatoire ou fibrosante, avec pondération</td></tr><tr><td>Questionnaire</td><td>Aucune recommandation</td><td>Recommandé, sans remplacer l’anamnèse</td></tr><tr><td>Critères</td><td>Niveaux de confiance</td><td>Deux jeux de critères, aigu et fibrosant</td></tr><tr><td>Cryobiopsie</td><td>Aucune recommandation dans la forme non fibrosante ; suggérée dans la forme fibrosante</td><td>Pince ou cryobiopsie dans la forme non fibrosante ; cryobiopsie dans la forme fibrosante</td></tr><tr><td>Provocation</td><td>Possible en centre expert dans l’évaluation de l’exposition</td><td>Possible dans la forme aiguë en centre expérimenté ; déconseillée dans la forme chronique fibrosante</td></tr></table><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente l’emporte : ce cours suit la recommandation allemande S2k, publiée en 2024 et en 2025, qui a intégré le texte de 2020. Elle est aussi la seule des deux à émaner de sociétés européennes ; le texte de 2020, cosigné par l’ATS, la JRS et l’Asociación Latinoamericana de Tórax, ne fonde donc aucune conduite dans ce cours. La recommandation allemande juge les niveaux de confiance difficiles à appliquer en expertise professionnelle, car ils imposeraient des examens invasifs même dans une PHS aiguë évidente. Le texte de 2020 reste consultable, et sa grille de confiance est présentée à titre de comparaison.</p><p class="src">Textes en vigueur : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., Respiration 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., Am J Respir Crit Care Med 2020</a>.</p></template>
<template data-pop="j67-exacerbation" data-title="Exacerbation aiguë de la PHS fibrosante"><p>De nouvelles opacités en verre dépoli ou des condensations en TDM peuvent signer une exacerbation aiguë, comme dans les autres PID fibrosantes. Dans une cohorte japonaise, elle survenait chez 3 % des patients atteints de PHS fibrosante à un an et 10 % à trois ans, contre 8 et 20 % dans la FPI. L’exposition antigénique, un âge plus jeune et une fonction réduite en augmentent le risque. La mortalité est élevée.</p><div class="key"><b>Conséquence.</b> Une aggravation aiguë fait rechercher une nouvelle exposition antigénique, facteur de risque suggéré par les données récentes.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, aspects radiologiques particuliers et Pronostic</a>.</p></template>
<template data-pop="j67-htp" data-title="Hypertension pulmonaire dans la PHS"><p>Un aspect fibrosant en TDM prédit l’HTP. La TDM sans injection peut en donner des signes indirects : tronc de l’artère pulmonaire d’au moins 29 mm chez l’homme et 27 mm chez la femme, rapport artère pulmonaire sur aorte ascendante supérieur à 1 ; un calibre normal ne l’exclut pas. Dans une étude prospective, le cathétérisme droit l’a trouvée chez 43 % des patients atteints de forme chronique ; elle s’associe à une survie nettement réduite.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Radiologie et Pronostic</a>.</p></template>
<template data-pop="j67-emphyseme" data-title="Emphysème du non-fumeur"><p>Un emphysème coexiste chez 17 à 33 % des patients atteints de PHS d’origine agricole ou aviaire, et chez 18 à 36 % des non-fumeurs. Dans le poumon de fermier chronique, il a été décrit chez 48 % des patients, plus marqué que la fibrose. L’inflammation et l’obstruction bronchiolaires en sont tenues pour responsables. Des formes purement emphysémateuses existent, indépendamment du tabac.</p><div class="key"><b>Piège.</b> Un emphysème chez un agriculteur non fumeur ne doit pas faire écarter une PHS ; il peut expliquer un trouble obstructif.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Fonction pulmonaire et PHS fibrosante</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020</a>.</p></template>
<template data-pop="j67-eviction" data-title="Éviction de l’antigène"><p class="lab">Modalités</p><p>Le patient supprime la source (oiseau, fontaine, couette en duvet, humidificateur) et nettoie le logement ; le médecin vérifie ensuite l’effet clinique et fonctionnel. Dans l’agriculture, l’éviction complète est souvent impossible : la substitution et les mesures techniques prennent le relais.</p><p class="lab">Test d’éviction</p><p>Une amélioration clinique ou fonctionnelle après éviction soutient le diagnostic, plus dans la forme aiguë que dans la forme fibrosante. Après deux semaines d’éviction dans la forme chronique, sa sensibilité était de 51 % et sa spécificité de 81 %. L’amélioration concernait 41 % des formes fibrosantes et 52 à 100 % des formes aiguës ou non fibrosantes. Une absence d’amélioration n’exclut pas la PHS.</p><p class="lab">Effet sur la survie</p><p>Les données divergent : aucun bénéfice de survie dans une analyse de 116 patients de la cohorte de Louvain (HR 1,29, non significatif) ; dans une série brésilienne, une amélioration sous éviction s’associait à une mortalité moindre (HR 0,18).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandation 9 et Pronostic</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28883091/" target="_blank" rel="noopener">Gimenez et al., 2018</a>.</p></template>
<template data-pop="j67-epargne" data-title="Immunosuppresseurs d’épargne cortisonique"><p>Chez le patient qui répond aux glucocorticoïdes, l’azathioprine ou le mycophénolate mofétil permettent de réduire la dose de corticoïdes. Cette stratégie repose seulement sur des études rétrospectives. En Suisse, aucune de ces deux molécules n’est autorisée dans la PHS : l’azathioprine l’est dans des maladies auto-immunes et en transplantation, le mycophénolate en transplantation seulement.</p><div class="key"><b>Prudence.</b> Chez les patients à télomères courts, l’immunosuppression s’associe à une évolution défavorable et à une surmortalité.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Forme chronique</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Imurek® et CellCept®, consultées le 09.10.2026</a>.</p></template>
<template data-pop="j67-transplantation" data-title="Transplantation pulmonaire"><p>Une PHS fibrosante qui progresse malgré le traitement relève d’une évaluation précoce en vue de transplantation. Dans une cohorte du groupe de transplantation pulmonaire de l’ESTS (114 patients, sept centres européens et deux nord-américains), la survie était de 85,2 % à un an, 74,4 % à trois ans et 70,4 % à cinq ans, avec une survie médiane de 9,2 ans. Selon la recommandation allemande, la survie après greffe est meilleure que dans la FPI (HR 0,25), et une récidive dans le greffon reste rare.</p><div class="key"><b>Conséquence.</b> L’éviction reste nécessaire après la greffe, d’où l’importance d’identifier l’antigène.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9008138/" target="_blank" rel="noopener">Nosotti et al., Transpl Int 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandation 11</a>.</p></template>
<template data-pop="j67-endotoxine" data-title="Endotoxines et poussières textiles"><p class="lab">Données</p><p>Les endotoxines sont des composants des parois des bactéries à Gram négatif. Dans la cohorte de Shanghai suivie 25 ans, l’exposition récente aux endotoxines s’associait à la byssinose, à la bronchite chronique et à la toux ; l’exposition passée, à un VEMS plus bas chez les retraités. Les poussières fines de chanvre contenaient 605 unités d’endotoxine par mg, contre 0,27 pour les tiges fraîches.</p><p class="lab">Limite</p><p>Dans l’analyse à onze ans de la même cohorte, la poussière cumulée, et non l’endotoxine, s’associait au déclin du VEMS. Le rôle respectif de la poussière, des endotoxines et du tabac reste discuté.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20797932/" target="_blank" rel="noopener">Shi et al., 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10086207/" target="_blank" rel="noopener">Christiani et al., 1999</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26489943/" target="_blank" rel="noopener">Er et al., 2016</a>.</p></template>
<template data-pop="j67-schilling" data-title="Grades de Schilling"><p>Le classement de Schilling repose sur l’oppression thoracique au retour au travail après le repos hebdomadaire ou les vacances ; la définition de l’OMS repose sur le même symptôme, sans critère spirométrique.</p><table class="t"><tr><th>Grade</th><th>Définition</th></tr><tr><td>½</td><td>Symptômes certains premiers jours de reprise</td></tr><tr><td>1</td><td>Symptômes la plupart des premiers jours de reprise</td></tr><tr><td>2</td><td>Symptômes le premier jour et les jours suivants</td></tr><tr><td>3</td><td>Grade 2 avec VEMS inférieur à 80 % de la valeur prédite</td></tr></table><p>Les grades se lisent comme une progression : le symptôme déborde du premier jour, puis la fonction se dégrade de façon permanente. Les ouvriers ont souvent du mal à rattacher leurs symptômes aux jours de la semaine, ce qui limite la fiabilité de la classification en enquête.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9985716/" target="_blank" rel="noopener">Nafees et al., 2023, méthodes et discussion</a>.</p></template>
<template data-pop="j67-stop" data-title="Principe STOP"><p>La recommandation allemande ordonne la prévention selon le principe STOP : substitution (par exemple l’ensilage à la place du foin potentiellement moisi), mesures techniques (aspiration), mesures organisationnelles (réorganisation du poste ou des procédés), puis protection individuelle, surtout par appareils respiratoires à ventilation assistée. Les trois premiers niveaux priment sur le dernier.</p><div class="key"><b>Contexte.</b> Cette hiérarchie est décrite dans le cadre de l’assurance-accidents allemande ; les documents de prévention de la Suva propres à la PHS n’ont pas pu être consultés pour ce cours.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, aspects de maladie professionnelle</a>.</p></template>
<template data-pop="j67-protection" data-title="Protection respiratoire individuelle"><p>Des appareils de protection respiratoire, y compris les masques FFP2, peuvent être utilisés en prévention secondaire ; ils ne remplacent en aucun cas l’éviction de l’antigène. Les appareils filtrants à ventilation assistée sont la protection individuelle de premier choix lorsqu’elle est nécessaire.</p><div class="key"><b>Piège.</b> Un masque autorise rarement la poursuite d’une exposition intense chez un patient déjà malade.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Prévention et aspects professionnels</a>.</p></template>
<template data-pop="j67-suva" data-title="Maladie professionnelle en Suisse"><p class="lab">Texte légal</p><p>Selon l’article 9, alinéa 1, de la LAA, sont réputées maladies professionnelles les maladies dues exclusivement ou de manière prépondérante, dans l’exercice de l’activité professionnelle, à des substances nocives ou à certains travaux, selon la liste du Conseil fédéral. L’annexe 1 de l’OLAA, chiffre 2, lettre b, y range les « affections de l’appareil respiratoire » liées aux « travaux dans les poussières de coton, de chanvre, de lin, de céréales et de leurs farines, d’enzymes, de moisissures et dans d’autres poussières organiques ». L’alinéa 2 couvre les autres maladies dont il est prouvé qu’elles ont été causées exclusivement ou de manière nettement prépondérante par l’activité professionnelle. La maladie professionnelle est assimilée à un accident professionnel dès qu’elle s’est déclarée.</p><p class="lab">Personnes assurées</p><p>L’assurance est obligatoire pour les travailleurs occupés en Suisse (art. 1a LAA). Les indépendants domiciliés en Suisse et les membres de leur famille qui collaborent à l’entreprise peuvent s’assurer à titre facultatif (art. 4 LAA) : un exploitant agricole indépendant n’est donc couvert que s’il a conclu cette assurance.</p><p class="lab">Conséquence pratique</p><p>La recommandation allemande note que la Suva reconnaît la PHS sur la base de l’article 9, alinéa 1. Le dossier médical documente l’exposition, la chronologie et le diagnostic.</p><div class="key"><b>Lacune.</b> Les procédures d’annonce et les documents de la Suva propres au poumon de fermier n’ont pas pu être consultés (recherche du 09.10.2026 sur suva.ch sans résultat) ; ils ne sont pas résumés ici.</div><p class="src">Références : <a href="https://www.fedlex.admin.ch/eli/cc/1982/1676_1676_1676/fr" target="_blank" rel="noopener">LAA, art. 1a, 4 et 9 (état au 01.01.2026)</a> ; <a href="https://www.fedlex.admin.ch/eli/cc/1983/38_38_38/fr" target="_blank" rel="noopener">OLAA, annexe 1 (état au 01.01.2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k</a>.</p></template>
<template data-pop="j67-actinomycetes" data-title="Actinomycètes thermophiles"><p>Bactéries à Gram positif qui trouvent dans le foin stocké humide leurs conditions optimales : l’humidité et la fermentation élèvent la température entre 40 et 60 °C. Saccharopolyspora rectivirgula (autrefois Micropolyspora faeni), Thermoactinomyces vulgaris, Thermoactinomyces viridis et Laceyella sacchari comptent parmi les principaux antigènes du poumon de fermier. Thermoactinomyces sacchari et Laceyella sacchari causent aussi la bagassose, liée aux résidus moisis de la canne à sucre.</p><div class="key"><b>Conséquence.</b> Le panel d’IgG d’un agriculteur suspect inclut les actinomycètes thermophiles et les moisissures.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Poumon de fermier et tableaux 2 et 3</a>.</p></template>
