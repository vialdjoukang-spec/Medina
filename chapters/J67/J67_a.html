<h1>Pneumopathies d’hypersensibilité et maladies des poussières organiques</h1><span class="status">Adulte · poumon de fermier, poumon d’éleveur d’oiseaux, byssinose · recommandation allemande S2k 2024 (version anglaise 2025), prise de position européenne EAACI 2016 · état au 09.10.2026</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’hypersensibilité pulmonaire</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#j67-0">Question clinique</a></li><li><a href="#j67-1">Définitions et classification</a></li><li><a href="#j67-2">Épidémiologie et pronostic</a></li><li><a href="#j67-3">De l’antigène inhalé à la fibrose</a></li><li><a href="#j67-4">Antigènes, sources et terrain</a></li><li><a href="#j67-5">Interroger pour trouver l’exposition</a></li><li><a href="#j67-6">Examiner pour reconnaître</a></li><li><a href="#j67-7">Établir le diagnostic</a></li><li><a href="#j67-8">Gravité et complications</a></li><li><a href="#j67-9">Traiter la pneumopathie d’hypersensibilité</a></li><li><a href="#j67-10">Byssinose et maladies des voies aériennes</a></li><li><a href="#j67-11">Suivi, prévention et maladie professionnelle</a></li><li><a href="#j67-12">Situations particulières</a></li><li><a href="#j67-13">Critères formels du diagnostic</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="j67-0"><h2><span class="n">0</span>Question clinique</h2><p>Un agriculteur laitier de 48 ans, non fumeur, consulte en janvier pour la troisième fois de l’hiver. En effet, chaque soir où il a distribué du foin, il frissonne, tousse, s’essouffle et mesure 38,6 °C ; le lendemain matin, il va mieux. Or, deux traitements antibiotiques n’ont rien changé. À l’examen, l’auscultation révèle des crépitants inspiratoires fins aux deux bases. <b>Dès lors, des épisodes fébriles répétés qui débutent quelques heures après une exposition organique et régressent loin d’elle imposent d’évoquer une pneumopathie d’hypersensibilité avant une nouvelle infection.</b></p><p>La pneumopathie d’hypersensibilité (PHS) est une réaction immunitaire du poumon à un antigène inhalé. Elle peut guérir sans séquelle si l’antigène est écarté tôt, ou évoluer vers une fibrose qui ressemble à la fibrose pulmonaire idiopathique (FPI). Le pronostic dépend donc de deux gestes : reconnaître l’exposition, puis la supprimer avant que la fibrose ne s’installe.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j67-definition">La pneumopathie d’hypersensibilité (définition et anciens noms)</button> ; <button class="w" data-justification="1" data-k="j67-delai">le délai de quatre à huit heures (mécanisme et valeur diagnostique)</button>.</div></section>
<section class="ilot" id="j67-1"><h2><span class="n">1</span>Définitions et classification</h2><p>La PHS est une maladie inflammatoire et/ou fibrosante du parenchyme pulmonaire et des petites voies aériennes. Elle résulte d’une réaction immunitaire, non médiée par les IgE, provoquée par un antigène inhalé, apparent ou occulte, chez un sujet sensibilisé et prédisposé. Ainsi, les antigènes sont surtout des glycoprotéines de haut poids moléculaire d’origine microbienne, animale ou végétale ; plus rarement, ce sont des molécules chimiques de bas poids moléculaire. Par ailleurs, l’ancien nom d’« alvéolite allergique extrinsèque » reste en usage.</p><p>Deux classifications coexistent, car elles servent deux décisions différentes. La <button class="w" data-justification="1" data-k="j67-s2k">recommandation allemande S2k 2024 (source principale du cours)</button> classe d’abord la maladie en aiguë ou chronique, distinction utile en médecine du travail, puis subdivise la forme chronique en non fibrosante et fibrosante. D’autre part, la <button class="w" data-justification="1" data-k="j67-classification">recommandation de 2020 de l’ATS, de la JRS et de l’Asociación Latinoamericana de Tórax (fibrosante ou non)</button> ne retient que la présence d’une fibrose radiologique ou histologique, principal déterminant du pronostic.</p><table class="t"><tr><th>Forme</th><th>Exposition typique</th><th>Lésion dominante</th><th>Évolution attendue</th></tr><tr><td>Aiguë</td><td>Intense et intermittente</td><td>Inflammation, bronchiolite</td><td>Guérison en 24 à 48 heures après l’éviction</td></tr><tr><td>Chronique non fibrosante</td><td>Faible et prolongée, ou épisodes répétés</td><td>Inflammation persistante</td><td>Amélioration fonctionnelle après éviction</td></tr><tr><td>Chronique fibrosante</td><td>Prolongée, souvent méconnue</td><td>Fibrose, avec ou sans inflammation</td><td>Progression possible malgré l’éviction</td></tr></table><p>La lecture commence par la dernière colonne : seule la forme fibrosante peut encore progresser une fois l’antigène écarté. Ainsi, un éleveur de pigeons dont la TDM ne montre que du verre dépoli a une forme non fibrosante, même si ses symptômes durent depuis un an ; une réticulation avec bronchiectasies de traction le fait basculer dans la forme fibrosante.</p><p>Le même chapitre de la classification réunit des <b>maladies des voies aériennes</b> dues à des poussières végétales spécifiques : la <button class="w" data-justification="1" data-k="j67-byssinose">byssinose (coton), la maladie des travailleurs du lin et la cannabinose (chanvre)</button>. Elles touchent les bronches et non l’alvéole ; elles ne sont pas des PHS. Le <button class="w" data-justification="1" data-k="j67-odts">syndrome toxique des poussières organiques (ODTS)</button>, enfin, imite la forme aiguë sans aucune sensibilisation.</p><div class="key"><b>À retenir.</b> Une PHS est d’abord dite aiguë ou chronique, puis fibrosante ou non ; la fibrose commande le pronostic et le traitement. Byssinose et ODTS appartiennent aux maladies des poussières organiques sans être des pneumopathies d’hypersensibilité.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., recommandation S2k des sociétés allemandes de pneumologie et d’allergologie, Respiration 2025 (version allemande 2024), recommandation 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., recommandation ATS/JRS et Asociación Latinoamericana de Tórax, 2020, section Définition</a>.</p></section>
<section class="ilot" id="j67-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>La PHS est rare. Ainsi, dans la population britannique, son incidence est restée stable autour d’un nouveau cas pour 100 000 habitants par an entre 1991 et 2003 ; au Danemark, elle atteignait 1,16 pour 100 000 entre 1998 et 2010. De même, sa part parmi les pneumopathies interstitielles diffuses (PID) varie de 1,5 à 47,3 % selon les registres, car elle dépend du climat, de l’agriculture et des habitudes domestiques. En revanche, aucune incidence suisse publiée n’a été identifiée.</p><p>La maladie frappe l’adulte, les deux sexes de façon comparable ; l’âge moyen d’une grande cohorte était de 52 ans, et la prévalence culmine après 65 ans. En outre, contrairement aux autres PID, elle survient surtout chez le non-fumeur. Ainsi, le poumon de fermier touche de 0,25 à 10,4 % des personnes travaillant dans l’agriculture ; le poumon d’éleveur de pigeons, jusqu’à 21 % des colombophiles. Toutefois, le poumon de fermier, autrefois fréquent en Europe, recule depuis que les conditions de stockage du fourrage et les techniques d’affouragement ont changé.</p><p>Le pronostic suit la fibrose. Ainsi, dans une cohorte de Louvain de 202 patients, la forme non fibrosante avait une survie excellente, tandis que la forme fibrosante avait une survie médiane de 9,2 ans. De plus, le <button class="w" data-justification="1" data-k="j67-pronostic">rayon de miel étendu (facteurs pronostiques)</button> rapproche la survie de celle de la FPI.</p><div class="key"><b>À retenir.</b> La PHS est rare et touche surtout le non-fumeur exposé aux oiseaux ou aux moisissures. Sans fibrose, son pronostic est excellent ; avec fibrose, elle réduit la survie et peut rejoindre celle de la FPI.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, section Épidémiologie</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30577667/" target="_blank" rel="noopener">De Sadeleer et al., cohorte de Louvain, J Clin Med 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, section Épidémiologie</a>.</p></section>
<section class="ilot" id="j67-3"><h2><span class="n">3</span>De l’antigène inhalé à la fibrose</h2><p>Les antigènes en cause sont inhalés sous forme de particules de moins de 5 µm. Ainsi, la lésion initiale est centrée sur la bronchiole : bronchiolite, infiltrat interstitiel péribronchiolaire et granulomes s’organisent autour d’elle. Pourtant, la plupart des exposés ne tombent pas malades ; beaucoup produisent seulement des anticorps : 10 % des agriculteurs et 40 % des éleveurs d’oiseaux asymptomatiques ont des IgG spécifiques, sans valeur pronostique.</p><p>Chez le sujet prédisposé, la réaction s’emballe. Ainsi, dans les 48 premières heures, une <button class="w" data-justification="1" data-k="j67-neutro">alvéolite à neutrophiles (fenêtre temporelle du lavage)</button> précède la réponse lymphocytaire. Parallèlement, des IgG spécifiques se forment : c’est la <button class="w" data-justification="1" data-k="j67-type3">composante humorale, dite de type III (rôle des IgG)</button>. Les macrophages activés stimulent ensuite des lymphocytes Th1, dont le TNF-α est nécessaire à la formation des <button class="w" data-justification="1" data-k="j67-granulome">granulomes mal limités (composante de type IV)</button> ; l’infiltrat devient à prédominance de lymphocytes T CD8. Enfin, une <button class="w" data-justification="1" data-k="j67-lymphocytose">lymphocytose alvéolaire marquée (seuils)</button> s’installe en 48 à 72 heures.</p><p>Le tableau clinique découle de deux cibles. D’une part, l’alvéolite épaissit la paroi alvéolaire et altère le transfert gazeux : la DLCO baisse, et une hypoxémie apparaît au repos ou à l’effort. D’autre part, la bronchiolite rétrécit les petites voies aériennes : <button class="w" data-justification="1" data-k="j67-piegeage">piégeage aérique et aspect en mosaïque (mécanisme)</button>. Lorsque l’exposition persiste, la réponse bascule vers un profil Th2, comme dans la FPI ; l’apoptose épithéliale et l’activation des fibroblastes installent une fibrose qui peut progresser même après l’éviction.</p><div class="key"><b>Conséquence thérapeutique.</b> L’inflammation des premières étapes régresse avec l’éviction, plus vite sous glucocorticoïdes. La fibrose des dernières étapes ne régresse plus : un antifibrosant en freine seulement la progression, et la transplantation remplace le poumon détruit.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, section Pathogenèse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, section Dysrégulation immunologique</a>.</p></section>
<section class="ilot" id="j67-4"><h2><span class="n">4</span>Antigènes, sources et terrain</h2><p>Plusieurs dizaines de sources ont été décrites ; six familles d’agents les regroupent : bactéries, moisissures, protéines animales, protéines végétales, produits chimiques de bas poids moléculaire et métaux. Dès lors, le clinicien doit connaître les sources fréquentes en Suisse, car c’est leur suppression qui soigne.</p><table class="t"><tr><th>Maladie</th><th>Antigène</th><th>Source</th></tr><tr><td><button class="w" data-justification="1" data-k="j67-fermier">Poumon de fermier</button></td><td>Actinomycètes thermophiles, Aspergillus, Lichtheimia</td><td>Foin, paille, céréales moisis</td></tr><tr><td><button class="w" data-justification="1" data-k="j67-oiseaux">Poumon d’éleveur d’oiseaux</button></td><td>Protéines des fientes, des plumes, du sérum</td><td>Pigeons, perruches, perroquets ; duvet d’oie ou de canard</td></tr><tr><td><button class="w" data-justification="1" data-k="j67-humidificateur">Poumon des humidificateurs et des climatiseurs</button></td><td>Bactéries, actinomycètes, moisissures, levures</td><td>Humidificateurs, fontaines à ultrasons, climatisation</td></tr><tr><td>Poumon des machinistes</td><td>Pseudomonas, Mycobacterium immunogenum</td><td>Fluides de coupe contaminés de l’usinage des métaux</td></tr><tr><td>Poumon des bains bouillonnants</td><td>Complexe Mycobacterium avium</td><td>Jacuzzis, douches, piscines privées</td></tr><tr><td>Subérose, poumon des malteurs, des champignonnistes, des écorceurs d’érable</td><td>Penicillium, Aspergillus clavatus, actinomycètes, Cryptostroma corticale</td><td>Liège, orge moisie, compost, écorce d’érable</td></tr><tr><td>Poumon des isocyanates</td><td>Diisocyanates</td><td>Vernis, mousses de polyuréthane, colles</td></tr></table><p>Les deux premières lignes représentent les formes les plus fréquentes. Toutefois, le piège réside dans les sources indirectes : la couette en duvet, les plumes rapportées sur les vêtements d’un conjoint colombophile ou un humidificateur de chambre. Ainsi, chez une enseignante de 66 ans sans oiseau, une couette en duvet artisanale peut suffire.</p><p>Seule une minorité des exposés tombe malade, ce qui implique une <button class="w" data-justification="1" data-k="j67-genetique">prédisposition génétique (complexe majeur d’histocompatibilité, MUC5B, télomères)</button>. Le <button class="w" data-justification="1" data-k="j67-tabac">tabac (effet protecteur paradoxal)</button> s’associe à un risque plus faible de PHS, mais les formes chroniques fibrosantes sont plus souvent liées au tabagisme. Enfin, les infections virales et les pesticides sont discutés comme cofacteurs.</p><div class="key"><b>À retenir.</b> Oiseaux, duvet, foin moisi, humidificateurs et fluides de coupe couvrent la majorité des cas ; l’interrogatoire cherche aussi les sources indirectes.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, tableaux 2 et 3, sections Facteurs de risque et Variantes</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26913451/" target="_blank" rel="noopener">Quirce et al., prise de position EAACI sur la PHS professionnelle, Allergy 2016</a>.</p></section>
<section class="ilot" id="j67-5"><h2><span class="n">5</span>Interroger pour trouver l’exposition</h2><p>L’exposition est le prédicteur le plus puissant du diagnostic : dans une étude prospective multicentrique, une exposition apparente était associée à un rapport de cotes de 38,8. Pourtant, l’antigène reste introuvable chez jusqu’à la moitié des patients atteints de forme chronique, et cet échec assombrit le pronostic. L’interrogatoire est donc systématique devant toute PID nouvelle.</p><p>Dans la forme aiguë, le médecin recherche des <button class="w" data-justification="1" data-k="j67-delai">symptômes pseudo-grippaux trois à douze heures après l’exposition</button> : fièvre, frissons, céphalées, arthralgies, toux sèche, oppression thoracique et dyspnée, qui cèdent en 24 à 48 heures loin de la source. À l’inverse, dans la forme chronique, le seul symptôme est souvent une <button class="w" data-justification="1" data-k="j67-dyspnee">dyspnée d’effort progressive (mécanisme)</button> avec toux et amaigrissement, sans rythme lié à l’exposition.</p><p>L’interrogatoire couvre le domicile (oiseaux, duvet, humidité, moisissures, humidificateurs, jacuzzi), le travail (agriculture, menuiserie, usinage, laboratoires animaliers) et les loisirs. Il précise la durée, l’intensité et la date de la dernière exposition. De plus, les sociétés allemandes recommandent d’y ajouter un <button class="w" data-justification="1" data-k="j67-questionnaire">questionnaire standardisé (outil suisse et limites)</button> ; il complète l’anamnèse sans la remplacer.</p><div class="two"><div class="card"><b>Forme aiguë typique.</b> Un agriculteur non fumeur fait des accès fébriles le soir des jours où il manipule le foin en hiver ; il guérit en un à deux jours et garde des crépitants fins.</div><div class="card"><b>Formes trompeuses.</b> Une dyspnée lente chez un sujet âgé sans exposition évidente, des « pneumonies » récidivantes, un « asthme » avec sibilants ou un emphysème chez un agriculteur non fumeur peuvent cacher une PHS.</div></div><div class="trap"><span class="k">Erreur fréquente</span> Le médecin prescrit des antibiotiques successifs pour des « bronchites fébriles » qui récidivent au même rythme que l’exposition. La chronologie, notée sur un calendrier, révèle le lien.</div><div class="key"><b>À retenir.</b> Toute PID nouvelle impose un inventaire écrit des expositions domestiques, professionnelles et de loisirs, aidé d’un questionnaire standardisé.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, sections Forme aiguë, Anamnèse d’exposition, recommandation 2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Histoire naturelle</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12842854/" target="_blank" rel="noopener">Lacasse et al., prédicteurs cliniques, 2003</a>.</p></section>
<section class="ilot" id="j67-6"><h2><span class="n">6</span>Examiner pour reconnaître</h2><p>Le médecin mesure la température, la fréquence respiratoire et la SpO₂ au repos puis à l’effort, et pèse le patient, car l’amaigrissement compte parmi les prédicteurs du diagnostic. Ainsi, pendant un accès aigu, la fièvre, la tachypnée et une désaturation coïncident avec des <button class="w" data-justification="1" data-k="j67-crepitants">crépitants inspiratoires fins (mécanisme)</button>. Par ailleurs, des <button class="w" data-justification="1" data-k="j67-squeaks">couinements mésoinspiratoires (signe et limites)</button>, fréquents dans les deux phénotypes, renforcent la suspicion.</p><p>Dans la forme chronique, l’examen peut être pauvre. Toutefois, un <button class="w" data-justification="1" data-k="j67-hippocratisme">hippocratisme digital</button>, présent jusque chez la moitié des patients, signale un pronostic défavorable. De plus, une dyspnée disproportionnée à l’étendue des lésions fait rechercher une hypertension pulmonaire (HTP), fréquente dans les formes chroniques. Enfin, des sibilants n’excluent pas le diagnostic : jusqu’à la moitié des formes aiguës ont une hyperréactivité bronchique non spécifique.</p><div class="key"><b>À retenir.</b> Crépitants fins, couinements et désaturation d’effort orientent vers la PHS ; l’hippocratisme et une HTP signalent une forme fibrosante grave.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, Symptômes et signes</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, sections Forme chronique et Fonction pulmonaire</a>.</p><button class="pareto-btn ui" data-k="pareto-j67-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
