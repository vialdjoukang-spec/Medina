<template data-pop="a84-pa-def" data-title="Méningo-encéphalite à tiques">
<p>Infection du système nerveux central par le virus de l’encéphalite à tiques, transmis par <i>Ixodes ricinus</i> ; maladie à déclaration obligatoire, sans traitement spécifique, prévenue par un vaccin.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>

gcaption></figure><p>Chaque stade, larve, nymphe puis adulte, prend un repas sanguin ; la nymphe, minuscule, passe souvent inaperçue, ce qui explique qu’une partie seulement des patients se souvienne d’une piqûre. Réservoir et vecteur ; présente jusqu’à 2100 m.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-pa-biph" data-title="Évolution biphasique">
<p>Phase virémique de 1 à 8 jours (moyenne 5), intervalle libre de 1 à 20 jours, puis phase neurologique ; 74 à 85 % des formes symptomatiques ; 30 à 50 % guérissent après la première phase.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-e-igm" data-title="IgM et IgG spécifiques">
<p>IgM dans le liquide cérébro-spinal ou IgM et IgG sériques : cas confirmé. Apparition 0 à 6 jours après les symptômes ; persistance des IgM jusqu’à 10 mois ; réactions croisées des IgG avec d’autres flavivirus.</p><div class="src">Source : <a href="https://www.ecdc.europa.eu/en/tick-borne-encephalitis/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about tick-borne encephalitis » et définition de cas de l’Union européenne</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-pa-decl" data-title="Déclaration obligatoire">
<p>Surveillance intégrée au système suisse de déclaration obligatoire depuis 1988 ; données publiées en continu par l’OFSP.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a> ; <a href="https://idd.bag.admin.ch/api/v1/export/latest/TBE_oblig/csv" target="_blank" rel="noopener" data-reference-source="1">OFSP, données du système de déclaration obligatoire FSME (export opendata, consulté le 9 octobre 2026)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-p-vacc" data-title="Vaccination contre la méningo-encéphalite à tiques">
<p>Recommandée en général dès 3 ans (avant 2024 : dès 6 ans), envisageable dès 1 an si exposition accrue, pour toute personne exposée aux tiques en Suisse hors Tessin. Trois doses, rappel tous les 10 ans si le risque persiste. Prise en charge par l’assurance obligatoire des soins ou par l’employeur en cas d’exposition professionnelle.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a> ; <a href="https://www.bag.admin.ch/dam/de/sd-web/YpS1SvBd4hRv/schweizerischer-impfplan.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, Plan de vaccination suisse 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-pa-myel" data-title="Myélite de la méningo-encéphalite à tiques">
<p>Atteinte des motoneurones de la corne antérieure de la moelle : paralysies flasques asymétriques, souvent de la ceinture scapulaire ; au niveau cervical haut, risque de paralysie respiratoire. Mécanisme : destruction neuronale virale et inflammatoire, sans régénération.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-pa-nb" data-title="Neuroborréliose">
<p>Atteinte nerveuse due à <i>Borrelia burgdorferi</i>, transmise par la même tique ; contrairement à la méningo-encéphalite à tiques, elle se traite par antibiotique, d’où l’importance de la rechercher. La co-infection peut brouiller le tableau.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-p-acc" data-title="Schéma accéléré">
<p>Deuxième dose 14 jours après la première, quand la primo-vaccination débute en saison chaude et qu’une protection rapide est souhaitée ; l’intervalle avant la troisième dose reste inchangé.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a84-s-sous" data-title="Sous-types du virus">
<p>Occidental (Europe, transmis par <i>Ixodes ricinus</i>, seul présent en Suisse, généralement moins sévère), oriental et sibérien (transmis surtout par <i>Ixodes persulcatus</i>, en Russie et en Asie).</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-a84-maladie" data-title="Loi de Pareto — Comprendre la maladie">
<p class="ratio" data-cover="a84-pa-1,a84-pa-2,a84-pa-3,a84-pa-4"></p><ul><li>Flavivirus, <i>Ixodes ricinus</i>, toute la Suisse sauf le Tessin.</li><li>Transmission en minutes ; lait cru.</li><li>Incubation 4 à 14 jours ; deux phases.</li></ul>
</template>
<template data-pop="pareto-a84-clinique" data-title="Loi de Pareto — Diagnostiquer et traiter">
<p class="ratio" data-cover="a84-pa-5,a84-pa-6,a84-pa-7,a84-pa-8"></p><ul><li>Méningite, encéphalite, myélite ; mortalité 1 %.</li><li>IgM et IgG ; statut vaccinal.</li><li>Exclure bactérie, herpès, borréliose.</li><li>Pas d’antiviral : soins de soutien.</li></ul>
</template>
<template data-pop="pareto-a84-examens" data-title="Loi de Pareto — Examens">
<p class="ratio" data-cover="a84-e-1,a84-e-2"></p><ul><li>Ponction lombaire, puis sérologie.</li><li>IgM isolée = probable ; persistance post-vaccinale.</li></ul>
</template>
<template data-pop="pareto-a84-vaccin" data-title="Loi de Pareto — Vaccination">
<p class="ratio" data-cover="a84-p-1,a84-p-2,a84-p-3"></p><ul><li>Deux vaccins inactivés.</li><li>0, 1–3 mois, puis 5–12 ou 9–12 mois ; rappel 10 ans.</li><li>Efficacité 95 % après 3 doses.</li></ul>
</template>
