<div class="chap-head"><div class="code">A84 — Encéphalite virale transmise par des tiques · CIM-10-GM 2024 · I-03-Infectiologie</div><h1>Méningo-encéphalite à tiques</h1><span class="status">Version de travail · Sources lues le 9 octobre 2026 : recommandations OFSP et Commission fédérale pour les vaccinations sur la méningo-encéphalite à tiques (juillet 2024) ; Plan de vaccination suisse 2025 ; données de déclaration obligatoire de l’OFSP (2013 à 2025) ; fiche et définition de cas de l’ECDC. Le cours traite surtout A84.1 (encéphalite d’Europe centrale), seule forme acquise en Suisse ; A84.0 (encéphalite de la taïga) est citée pour le voyageur. Relecture médicale humaine non encore effectuée.</span></div>

<section class="ilot" id="a84-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. B., 62 ans, jardinier dans le canton de Berne et non vacciné, a eu en juin une « grippe » de quatre jours, puis s’est senti bien une semaine ; il revient maintenant avec une fièvre à 39,8 °C, des céphalées intenses, une raideur de nuque et un tremblement des mains. Ainsi, ce tableau en deux temps, après une saison d’activité des tiques, évoque une <button class="w" data-k="a84-pa-def">méningo-encéphalite à tiques</button>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, pourquoi la maladie évolue-t-elle en deux phases ? Ensuite, comment confirmer le diagnostic, alors que le virus a souvent disparu du sang ? Puis, que proposer en l’absence d’antiviral ? Enfin, qui vacciner, et selon quel schéma ? Contrairement à un manuel figé, chaque notion renvoie ici à une fenêtre qui en donne la source, le mécanisme et l’application au lit du patient.</p>
<div class="key"><b>À retenir.</b> Une fièvre biphasique avec des signes méningés ou encéphalitiques, entre le printemps et l’automne, en Suisse hors du Tessin, doit faire penser à la méningo-encéphalite à tiques et demander le statut vaccinal.</div></section>

<section class="ilot" id="a84-pa-1"><h2><span class="n">1</span>Définition et codes</h2>
<p>Pour poser ce diagnostic, il faut d’abord nommer l’agent. En effet, le <button class="w" data-k="a84-s-vet">virus de l’encéphalite à tiques</button> appartient au genre <i>Flavivirus</i> ; il est neurotrope, c’est-à-dire capable de franchir la barrière hémato-encéphalique et d’infecter le système nerveux central. Il en existe trois <button class="w" data-k="a84-s-sous">sous-types</button>, occidental, oriental et sibérien ; or, seul le sous-type occidental circule en Suisse, et il est généralement moins sévère. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<p>La CIM-10-GM 2024 code l’encéphalite d’Europe centrale transmise par des tiques en A84.1 et l’encéphalite de la taïga, acquise en voyage, en A84.0 ; A84.8 et A84.9 désignent les autres formes et les formes sans précision.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Ces codes traduisent une réalité géographique : le sous-type d’Europe centrale, transmis par <i>Ixodes ricinus</i>, produit une maladie plus souvent bénigne que les sous-types d’Asie, transmis par <i>Ixodes persulcatus</i>. Par conséquent, le code A84.1 décrit le patient suisse, tandis que A84.0 concerne surtout le voyageur revenant de Russie ou d’Asie.</div></section>

<section class="ilot" id="a84-pa-2"><h2><span class="n">2</span>Épidémiologie suisse</h2>
<p>Une fois l’agent défini, reste à mesurer la fréquence. Selon les données de déclaration obligatoire de l’OFSP, la Suisse et le Liechtenstein ont enregistré 112 cas en 2014, 433 en 2020, puis 502 en 2025, soit 5,5 cas pour 100 000 habitants, le chiffre le plus élevé de la série 2013–2025. <a href="https://idd.bag.admin.ch/api/v1/export/latest/TBE_oblig/csv" target="_blank" rel="noopener" data-reference-source="1">OFSP, données du système de déclaration obligatoire FSME (export opendata, consulté le 9 octobre 2026)</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Ces chiffres oscillent d’une année à l’autre, car l’activité des tiques et l’exposition humaine dépendent du climat et des loisirs en plein air ; cependant, la tendance de fond est à la hausse. De plus, la zone touchée, d’abord centrée sur le nord-est du pays, s’est étendue vers le sud et l’ouest, et des foyers sont décrits jusqu’à 2100 m d’altitude ; c’est pourquoi, depuis 2024, toute la Suisse sauf le Tessin est zone à risque. Enfin, l’incidence la plus élevée touche les 50 à 79 ans et les hommes, ce qui reflète à la fois l’exposition et la vulnérabilité liée à l’âge. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</div></section>

<section class="ilot" id="a84-pa-3"><h2><span class="n">3</span>Vecteur et transmission</h2>
<p>Ce risque géographique dépend du vecteur. En effet, la tique <button class="w" data-k="a84-s-ixodes"><i>Ixodes ricinus</i></button> est à la fois réservoir et vecteur, tandis que les petits rongeurs servent d’hôtes amplificateurs ; le virus passe dans la salive de la tique dans les minutes qui suivent la piqûre, si bien qu’un retrait immédiat n’évite pas sûrement l’infection. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>

oite, plus petit et noir" width="400" height="290" loading="lazy" decoding="async" style="max-width:100%;height:auto;border-radius:6px"><figcaption>Figure 1 — <i>Ixodes ricinus</i> : femelle (à gauche) et mâle (à droite). Photographie : Alan R Walker, <a href="https://commons.wikimedia.org/wiki/File:Ixodes-ricinus-female-male.jpg" target="_blank" rel="noopener" data-reference-source="1">Wikimedia Commons</a>, licence <a href="https://creativecommons.org/licenses/by-sa/3.0" target="_blank" rel="noopener" data-reference-source="1">Creative Commons Attribution – Partage dans les mêmes conditions 3.0</a> ; réduite et convertie pour l’affichage.</figcaption></figure>
<div class="key"><b>Lecture et physiopathologie.</b> La femelle, plus grande, prend le repas sanguin le plus long ; or, la transmission virale, contrairement à celle de <i>Borrelia</i>, est précoce, car le virus réside déjà dans les glandes salivaires. Par conséquent, l’ablation rapide de la tique protège bien contre la borréliose mais mal contre la méningo-encéphalite. En outre, en Suisse, moins de 1 % des tiques en quête de repas portent le virus en général, de 0 à moins de 15 % selon les lieux ; et comme un tiers seulement des personnes infectées sont symptomatiques, environ une piqûre sur 100 entraîne une maladie. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</div>
<p>Par ailleurs, la transmission alimentaire existe : chèvres, moutons et bovins infectés excrètent le virus dans le lait, et des cas liés à des produits laitiers non pasteurisés ont été rapportés ; en revanche, l’humain est un hôte final, qui ne transmet pas le virus. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p></section>

<section class="ilot" id="a84-pa-4"><h2><span class="n">4</span>Évolution en deux phases</h2>
<p>Une fois inoculé, le virus suit une chronologie précise. D’abord, l’incubation dure de 4 à 14 jours, en moyenne 7 à 10, avec des extrêmes de 4 et 28 jours ; elle est plus courte, de 2 à 4 jours, après une contamination alimentaire. Ensuite, chez l’adulte, environ un tiers des personnes infectées développent des symptômes. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<p>Dans 74 à 85 % des infections symptomatiques, la maladie est <button class="w" data-k="a84-pa-biph">biphasique</button>. Ainsi, une première phase, virémique, dure de 1 à 8 jours, en moyenne 5, avec fièvre, céphalées, malaise, fatigue et myalgies ; elle guérit définitivement dans 30 à 50 % des cas. Pour les autres, après un intervalle libre de 1 à 20 jours, survient une seconde phase neurologique avec fièvre supérieure à 40 °C, méningite, encéphalite, myélite ou radiculite. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> La première phase correspond à la multiplication du virus au point de piqûre, dans les ganglions puis dans le sang ; la réponse immunitaire contrôle ensuite la virémie, d’où l’intervalle libre. Cependant, si le virus a franchi la barrière hémato-encéphalique avant ce contrôle, l’inflammation du système nerveux central produit la seconde phase. C’est pourquoi, au moment des signes neurologiques, le virus a généralement quitté le sang et le diagnostic repose sur les anticorps plutôt que sur la PCR.</div>
<button class="pareto-btn ui" data-k="pareto-a84-maladie">▲ Loi de Pareto — Comprendre la maladie</button></section>

<section class="ilot" id="a84-pa-5"><h2><span class="n">5</span>Formes cliniques et gravité</h2>
<p>Cette seconde phase revêt plusieurs formes. Ainsi, la clinique va des céphalées aux troubles de la conscience, jusqu’au coma, et aux parésies. Chez l’enfant, au contraire, les symptômes sont généralement plus légers et moins spécifiques : la fièvre isolée est plus fréquente, et la méningite, avec céphalées, nausées, vomissements, vertiges et raideur de nuque, en est la forme neurologique la plus courante. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<div class="alert"><b>Gravité.</b> Le risque de forme grave augmente après 50 à 60 ans, avec les comorbidités et l’immunosuppression ; la mortalité est d’environ 1 % chez l’adulte comme chez l’enfant. Une paralysie respiratoire persistante peut mettre en jeu le pronostic vital. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</div>
<div class="key"><b>Lecture et physiopathologie.</b> La gravité dépend du territoire atteint : la méningite seule enflamme les enveloppes et guérit le plus souvent ; l’encéphalite touche le parenchyme, d’où troubles de conscience, tremblement et ataxie ; la <button class="w" data-k="a84-pa-myel">myélite</button> atteint les motoneurones de la corne antérieure, ce qui explique des paralysies flasques, typiquement de la ceinture scapulaire, et, au niveau cervical haut, une paralysie respiratoire. Ainsi, l’examen neurologique répété oriente la surveillance.</div>
<p>En outre, une co-infection par <i>Borrelia burgdorferi</i>, transmise par la même tique, peut brouiller le tableau. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p></section>

<section class="ilot" id="a84-pa-6"><h2><span class="n">6</span>Diagnostic</h2>
<p>Puisque le virus a souvent disparu du sang lors de la phase neurologique, la preuve est sérologique. En effet, selon l’ECDC, le diagnostic repose sur la détection d’<button class="w" data-k="a84-e-igm">IgM spécifiques</button> dans le liquide cérébro-spinal ou le sérum, surtout par ELISA ; ces anticorps apparaissent 0 à 6 jours après le début des symptômes et sont en général présents au stade neurologique. <a href="https://www.ecdc.europa.eu/en/tick-borne-encephalitis/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about tick-borne encephalitis » et définition de cas de l’Union européenne</a>.</p>
<p>Cependant, les IgM peuvent persister jusqu’à 10 mois après une infection ou une vaccination, et les IgG croisent avec d’autres flavivirus ; par conséquent, l’interprétation exige l’anamnèse vaccinale et de voyage. Enfin, la PCR peut aider au diagnostic précoce, pendant la phase virémique. <a href="https://www.ecdc.europa.eu/en/tick-borne-encephalitis/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about tick-borne encephalitis » et définition de cas de l’Union européenne</a>.</p>
<div class="key"><b>À retenir.</b> À la phase neurologique, on dose les IgM et IgG sériques et les IgM du liquide cérébro-spinal, et on demande toujours les dates de vaccination.</div></section>

<section class="ilot" id="a84-pa-7"><h2><span class="n">7</span>Diagnostic différentiel</h2>
<p>Avant de retenir ce diagnostic, il faut écarter les urgences traitables. Ainsi, devant une méningite fébrile, la méningite bactérienne impose une antibiothérapie sans délai ; de plus, une encéphalite herpétique justifie l’aciclovir jusqu’à exclusion, et une <button class="w" data-k="a84-pa-nb">neuroborréliose</button>, transmise par la même tique, se traite par antibiotique. Enfin, les autres méningites virales, notamment à entérovirus en été, restent fréquentes.</p>
<div class="alert"><b>Piège.</b> Une sérologie de méningo-encéphalite à tiques positive chez une personne récemment vaccinée ne prouve pas la maladie ; inversement, rechercher la borréliose ne dispense pas de rechercher le virus, car les deux infections peuvent coexister. <a href="https://www.ecdc.europa.eu/en/tick-borne-encephalitis/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about tick-borne encephalitis » et définition de cas de l’Union européenne</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</div></section>

<section class="ilot" id="a84-pa-8"><h2><span class="n">8</span>Prise en charge</h2>
<p>Une fois le diagnostic retenu, le traitement reste symptomatique, car il n’existe aucun antiviral ni immunomodulateur efficace. En effet, l’OFSP précise de plus que les immunoglobulines spécifiques post-exposition ne sont pas recommandées en Europe occidentale. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<p>Par conséquent, la méningite, l’encéphalite et la méningomyélite nécessitent une hospitalisation et des soins de soutien adaptés à la gravité : antalgie, antipyrétiques, hydratation, surveillance neurologique et respiratoire, et soins intensifs en cas de coma ou de paralysie respiratoire. <a href="https://www.ecdc.europa.eu/en/tick-borne-encephalitis/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about tick-borne encephalitis » et définition de cas de l’Union européenne</a>. Par ailleurs, la maladie est à <button class="w" data-k="a84-pa-decl">déclaration obligatoire</button> en Suisse depuis 1988. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<button class="pareto-btn ui" data-k="pareto-a84-clinique">▲ Loi de Pareto — Diagnostiquer et traiter</button></section>

<section class="ilot" id="a84-pa-9"><h2><span class="n">9</span>Séquelles et pronostic</h2>
<p>Au-delà de la phase aiguë, le pronostic dépend des séquelles. Ainsi, chez l’adulte ayant eu une atteinte du système nerveux central, des séquelles persistent chez 30 à 50 % des personnes ; elles sont légères dans 20 à 30 % des cas, modérées dans 50 à 60 % et sévères dans 10 %. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p>
<div class="key"><b>Lecture et physiopathologie.</b> Le neurone infecté est détruit par le virus et par la réponse inflammatoire ; or, le neurone ne se renouvelle pas, si bien que la récupération dépend de la plasticité des réseaux restants, moindre avec l’âge. Ainsi s’expliquent la fatigue, les céphalées persistantes, les troubles de mémoire et de concentration, et, dans les formes sévères, ataxie, tremblement et parésies. Chez l’enfant, les séquelles neurologiques concerneraient 0 à 10 % des cas neurologiques ; cependant, des troubles cognitifs et attentionnels durables sont décrits même après une forme bénigne. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</div>
<p>Enfin, après une infection naturelle, les IgG persistent à vie et protègent probablement d’une réinfection. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p></section>

<section class="ilot" id="a84-pa-10"><h2><span class="n">10</span>Prévention</h2>
<p>Puisqu’il n’existe pas de traitement spécifique, la prévention est décisive. D’abord, la <button class="w" data-k="a84-p-vacc">vaccination</button> est l’intervention la plus efficace ; elle est recommandée, en général dès 3 ans, à toutes les personnes qui s’exposent aux tiques en zone à risque, c’est-à-dire dans toute la Suisse sauf le Tessin. Ensuite, des vêtements couvrants, des répulsifs, l’inspection de la peau après une promenade et le retrait rapide des tiques complètent la protection. Enfin, la pasteurisation du lait, en particulier de chèvre, prévient la transmission alimentaire. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a> ; <a href="https://www.bag.admin.ch/dam/de/sd-web/YpS1SvBd4hRv/schweizerischer-impfplan.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, Plan de vaccination suisse 2025</a>.</p>
<div class="key"><b>À retenir.</b> Le vaccin est recommandé dès 3 ans, et envisageable dès 1 an si l’exposition est accrue ; il comporte 3 doses, avec un rappel tous les 10 ans si le risque persiste.</div></section>

<section class="ilot" id="a84-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p>Certaines situations modifient cependant la conduite. D’abord, pendant la grossesse et l’allaitement, les vaccins inactivés ne présentent pas de risque particulier ; néanmoins, faute d’études contrôlées, la vaccination ne s’envisage qu’après évaluation du rapport bénéfice-risque et pour une indication précise. Ensuite, chez l’immunodéprimé, la réponse vaccinale peut être réduite : ainsi, chez des transplantés cardiaques sous ciclosporine et chez des personnes vivant avec le VIH vaccinées selon un schéma abrégé, la séroconversion était diminuée. Enfin, une allergie bénigne aux protéines de l’œuf ne contre-indique pas le vaccin. <a href="https://www.bag.admin.ch/dam/fr/sd-web/GaSnHcNnmEXI/zeckenenzephalitis-empfehlung-impfung.pdf" target="_blank" rel="noopener" data-reference-source="1">OFSP et Commission fédérale pour les vaccinations, « Recommandations de vaccination contre la méningo-encéphalite à tiques (FSME) », directives et recommandations, juillet 2024</a>.</p></section>

<section class="ilot" id="a84-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<div class="alert"><b>Critères de cas confirmé (définition de l’Union européenne, ECDC).</b> Signes d’inflammation du système nerveux central (méningite, méningo-encéphalite, encéphalomyélite, encéphaloradiculite) et au moins un des cinq critères biologiques : IgM et IgG spécifiques dans le sang ; IgM spécifiques dans le liquide cérébro-spinal ; séroconversion ou multiplication par quatre des anticorps sur deux sérums ; détection d’acide nucléique viral ; isolement du virus. Une IgM sérique isolée définit un cas probable. <a href="https://www.ecdc.europa.eu/en/tick-borne-encephalitis/facts" target="_blank" rel="noopener" data-reference-source="1">ECDC, « Facts about tick-borne encephalitis » et définition de cas de l’Union européenne</a>.</div>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Incubation</td><td>4 à 14 jours (2 à 4 jours si alimentaire)</td></tr>
<tr><td>Forme biphasique</td><td>74 à 85 % des formes symptomatiques</td></tr>
<tr><td>Mortalité</td><td>Environ 1 %</td></tr>
<tr><td>Séquelles après atteinte neurologique (adulte)</td><td>30 à 50 %</td></tr>
<tr><td>Cas en Suisse et au Liechtenstein, 2025</td><td>502 ; 5,5 pour 100 000</td></tr>
<tr><td>Efficacité vaccinale, 3 doses ou plus (adultes suisses)</td><td>95,0 %</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque ligne relie un mécanisme à une décision : l’incubation fixe la fenêtre d’anamnèse à rechercher ; la biphasie explique pourquoi la sérologie remplace la PCR ; la fréquence des séquelles justifie la vaccination, puisqu’aucun traitement ne les prévient.</div>
