<template data-pop="e45-cim" data-title="CIM-10-GM 2024 : E45 et son bloc"><h3>Ce que dit la classification</h3><p>L’Office fédéral de la statistique publie en français la CIM-10-GM 2024 : E45 y est libellé « Retard de développement après malnutrition protéino-énergétique », sans sous-code, dans le chapitre IV et le bloc E40–E46. Le texte allemand de l’Institut fédéral allemand des médicaments et des dispositifs médicaux (BfArM) ajoute les inclusions « retard de développement d’origine alimentaire, petite taille » et « retard physique par malnutrition », sans exclusion propre : les exclusions du bloc s’appliquent.</p><table class="t"><tr><th>Exclusion du bloc E40–E46</th><th>Code</th></tr><tr><td>Anémies alimentaires</td><td>D50–D53</td></tr><tr><td>Séquelles de malnutrition protéino-énergétique</td><td>E64.0</td></tr><tr><td>Mort par inanition</td><td>T73.0</td></tr><tr><td>Malabsorption intestinale</td><td>K90.-</td></tr><tr><td>Cachexie liée au VIH</td><td>B22</td></tr></table><p>La note du bloc juge le degré de dénutrition sur le poids en écarts-types sous la moyenne de référence : 3 ou plus = grave, 2 à moins de 3 = modérée, 1 à moins de 2 = légère. Une perte de poids, ou chez l’enfant l’absence de prise de poids, indique d’ordinaire une malnutrition ; une mesure isolée ne donne qu’un diagnostic provisoire. Sans poids disponible, on se fonde sur la clinique.</p><div class="trap"><span class="k">Limite</span> Les sources lues ne précisent pas la frontière temporelle entre E45 (retard dû à la malnutrition) et E64.0 (séquelles). Le choix du code relève d’une décision de codage que ce cours ne tranche pas.</div></template>
<template data-pop="e45-haz" data-title="HAZ : taille pour l’âge en écarts-types"><h3>Ce que mesure le HAZ</h3><p>Le HAZ (Z-score taille pour l’âge) exprime en écarts-types l’écart entre la taille de l’enfant et la médiane de référence pour son âge et son sexe. Le retard de croissance linéaire (stunting) est défini par un HAZ inférieur à −2 ; un HAZ inférieur à −3 est un retard grave. Un HAZ entre −2 et moins de −1 correspond à un « stunting » sans être « stunted ».</p><p>Le seuil de −2 est un indicateur statistique de population. Perumal et collaborateurs rappellent qu’il n’a pas de fondement biologique comme classificateur individuel : des enfants au-dessus et au-dessous du seuil subissent les mêmes facteurs limitants. Le chiffre sert donc à repérer et à comparer des groupes ; chez un enfant, il se lit avec la trajectoire.</p><div class="trap"><span class="k">Piège</span> Croire qu’un HAZ à −1,9 exclut un problème. Seule la courbe répétée et la vitesse de croissance disent si l’enfant décroche.</div></template>
<template data-pop="e45-wasting" data-title="Stunting, wasting, underweight"><h3>Trois indices, trois questions</h3><table class="t"><tr><th>Indice</th><th>Mesure</th><th>Ce qu’il reflète</th></tr><tr><td>Stunting</td><td>Taille pour l’âge bas (HAZ inférieur à −2)</td><td>Déficit chronique</td></tr><tr><td>Wasting (émaciation)</td><td>Poids pour la taille bas</td><td>Déficit récent</td></tr><tr><td>Underweight</td><td>Poids pour l’âge bas</td><td>Ne distingue pas stunting et wasting</td></tr></table><p>Les trois peuvent s’associer, avec un risque cumulatif : stunting et poids pour l’âge bas associés ont un rapport de risques instantanés de mortalité de 3,4 ; avec le wasting en plus, 12,3 (53 767 enfants). Dans les pays à faible revenu, 4,7 % des enfants cumulent stunting et wasting, avec une mortalité multipliée par 4,8.</p></template>
<template data-pop="e45-syndrome" data-title="Le syndrome de stunting"><h3>Plus qu’une petite taille</h3><p>La petite taille n’est pas en elle-même pathologique : elle marque un ensemble d’altérations. Prendergast et Humphrey décrivent un syndrome qui associe morbidité et mortalité accrues, capacités physiques, neurodéveloppementales et économiques réduites, et risque métabolique à l’âge adulte. Cette notion explique pourquoi le code E45 parle de « développement » et non de simple taille.</p></template>
<template data-pop="e45-vc" data-title="Vitesse de croissance et décrochage"><h3>Définition et valeurs</h3><p>La vitesse de croissance (VC) est le gain de taille par unité de temps ; elle se mesure sur 6 à 12 mois. Les ordres de grandeur du consensus SIP/SIEDP sont de 22 à 24 cm la première année, environ 10 cm la deuxième, 5 à 6 cm par an avant la puberté, et 10 à 12 cm par an au pic pubertaire en moyenne.</p><p>Une vitesse inférieure à −1 écart-type sur les 6 derniers mois suffit à repérer un retard, même si la taille n’a pas franchi −2. Un enfant peut ainsi sortir de sa trajectoire avant le seuil statistique. Chez le nourrisson, la croissance est épisodique, avec des stases de 2 à 63 jours : une mesure trop rapprochée peut tomber dans une stase.</p><div class="trap"><span class="k">Piège</span> Calculer une vitesse sur un intervalle trop court. Le consensus propose 6 à 12 mois.</div></template>
<template data-pop="e45-courbes" data-title="Courbes de croissance en Suisse"><h3>Ce que dit pädiatrie schweiz</h3><p>Dans un statement d’octobre 2020, pädiatrie schweiz (Société suisse de pédiatrie) recommande de conserver les courbes de croissance standard recommandées depuis 2011, après la publication des données Eiholzer et collaborateurs de 2019. Le statement distingue les courbes descriptives (« Referenz ») des courbes prescriptives (« Standard »), dérivées d’individus en santé optimale : ces dernières servent au dépistage des écarts de croissance dus à une maladie. Il compare les nouvelles données aux courbes de l’OMS (médianes de l’indice de masse corporelle identiques) et indique que les percentiles hauts d’indice de masse corporelle de nouvelles données incluant des enfants obèses masqueraient le surpoids de plus de 6 % des enfants.</p><div class="trap"><span class="k">Limite</span> Le nom exact des courbes suisses de 2011 n’est pas lisible dans le texte consulté. Il est donc volontairement omis ici.</div><p>Le dépistage précoce de troubles comme Turner ou la maladie cœliaque exige un suivi longitudinal avec plusieurs paramètres, car une mesure isolée est souvent dans la norme. Toute évaluation de croissance doit inclure le stade pubertaire, le plus souvent avec un âge osseux.</p></template>
<template data-pop="e45-gh-igf" data-title="Axe hormone de croissance – IGF-I sous jeûne"><h3>Mécanisme</h3><p>Un jeûne bref élève l’hormone de croissance (GH). Un jeûne prolongé provoque une résistance périphérique à la GH : GH élevée, IGF-I hépatique et circulant bas. Le défaut siège au niveau du récepteur dans les formes sévères et en aval du récepteur dans les formes moins sévères. L’IGF-I est sensible à l’apport protéique et énergétique : il faut les deux pour le normaliser, et les acides aminés essentiels comptent pour sa restauration.</p><p>L’IGFBP-1 et l’IGFBP-2 augmentent, ce qui accroît la clairance et réduit la biodisponibilité de l’IGF-I ; l’IGFBP-3 suit l’IGF-I. Cette baisse est une adaptation : le catabolisme protéique fournit des acides aminés à la néoglucogenèse pour le cerveau.</p><h3>Conséquence clinique</h3><p>Dans les plaques de croissance de souris restreintes, l’IGF-I et l’expression du récepteur de la GH diminuent. Cela explique la faible réponse à la GH administrée chez l’animal et chez l’enfant malnutris. L’IGF-I d’un enfant dénutri est bas ; il ne prouve pas un déficit en GH.</p></template>
<template data-pop="e45-fgf21" data-title="FGF21 : signal de restriction protéique"><h3>Rôle</h3><p>Le FGF21 est un signal de restriction protéique. Il réduit l’expression hépatique du récepteur de la GH et inhibe la signalisation de la GH, y compris dans la plaque de croissance. Il est inversement lié à la croissance linéaire du nourrisson. Il illustre que la croissance est freinée activement, et non seulement par manque de substrat.</p></template>
<template data-pop="e45-plaque" data-title="Plaque de croissance et sénescence"><h3>Un organe à capital limité</h3><p>La plaque de croissance (cartilage de conjugaison) est l’organe cible de la croissance linéaire. Ses chondrocytes ont une capacité proliférative finie, progressivement épuisée ; cette sénescence ralentit puis arrête la croissance et conduit à la fusion épiphysaire. Une inhibition transitoire ralentit aussi la sénescence : démontré pour les glucocorticoïdes, ce mécanisme explique le rattrapage, car la plaque moins sénescente croît plus vite que pour son âge. Les sources sont des études de recherche fondamentale ; leur application à la dénutrition de l’enfant est un raisonnement par analogie.</p></template>
<template data-pop="e45-eed" data-title="Entéropathie environnementale (EED)"><h3>Définition et mécanisme</h3><p>L’entéropathie environnementale associe atrophie villositaire et inflammation chronique de l’intestin grêle, entretenues par l’exposition fécale-orale. Elle entraîne une malabsorption modérée et une perméabilité accrue ; la translocation microbienne provoque une inflammation systémique qui supprime l’IGF-I. La protéine C réactive est plus élevée chez les nourrissons qui décrochent dès 6 semaines.</p><p>Chaque épisode de diarrhée augmente les chances de stunting à 24 mois ; 25 % du stunting seraient attribuables à au moins 5 épisodes. Les sources sont des revues, dont une lue en résumé seulement (Budge 2019).</p></template>
<template data-pop="e45-prenatal" data-title="Origine prénatale du retard"><h3>Chiffres</h3><p>Environ 20 % du stunting a une origine fœtale. Le risque de stunting postnatal est multiplié par 1,93 après une naissance prématurée, 2,43 pour un petit poids pour l’âge gestationnel et 4,51 si les deux s’associent. La taille maternelle prédit celle de l’enfant, ce qui installe un cycle intergénérationnel. Ces données viennent d’une revue (Prendergast 2014).</p></template>
<template data-pop="e45-1000j" data-title="Les 1000 premiers jours"><h3>Fenêtre critique</h3><p>La fenêtre va de la conception au deuxième anniversaire. Environ 70 % du déficit de taille survient pendant cette période et 30 % entre 2 et 5 ans. Les interventions étudiées sont la supplémentation maternelle (énergie-protéines : −31 % de petit poids pour l’âge gestationnel ; micronutriments multiples : −9 % ; fer : −20 % de faible poids de naissance), l’allaitement exclusif de 6 mois, l’éducation à l’alimentation de complément (gain d’environ +0,7 HAZ au mieux) et l’eau, l’assainissement et l’hygiène (différence moyenne +0,08 HAZ).</p></template>
<template data-pop="e45-had" data-title="Piège : le HAZ qui s’améliore avec l’âge"><h3>Explication</h3><p>Le HAZ divise l’écart à la médiane par l’écart-type de la taille, qui augmente avec l’âge. Un enfant peut donc voir son HAZ remonter alors que son déficit en centimètres s’aggrave : en différence absolue de taille (HAD), le déficit continue de croître. Cette lecture évite de conclure trop vite à un rattrapage. La fenêtre de rattrapage pourrait s’étendre au-delà de 24 mois (cohortes COHORTS, Gambie, Young Lives, citées par Prendergast).</p></template>
<template data-pop="e45-rattrapage" data-title="Rattrapage linéaire et seuil de 85 %"><h3>Ce que montrent les sources</h3><p>Chez l’enfant dénutri, le rattrapage linéaire survient lorsqu’environ 85 % du poids pour la taille est récupéré (Inzaghi 2022) : le poids décroche d’abord, la taille ensuite. Le rattrapage sous réhabilitation nutritionnelle est aussi un argument a posteriori en faveur d’une cause nutritionnelle. Dans l’anorexie mentale, il est souvent incomplet.</p></template>
<template data-pop="e45-anorexie" data-title="Croissance et anorexie mentale"><h3>Ce que montrent les séries</h3><p>Chez 12 garçons adolescents, la croissance ralentit pendant la maladie et le rattrapage est souvent incomplet (9 sur 12) ; le ralentissement statural peut précéder le diagnostic. Chez 255 filles, la taille adulte est significativement inférieure à la taille cible parentale ; les prédicteurs d’amélioration sont l’âge et l’âge osseux à l’admission, la croissance pendant l’hospitalisation et l’évolution de la LH. La GH se normalise par la renutrition. Le poids cible doit se fonder sur le percentile de taille prémorbide.</p></template>
<template data-pop="e45-adoption" data-title="Puberté précoce chez les enfants adoptés"><h3>Résultats contrastés</h3><p>Au Danemark, le risque de puberté précoce est multiplié par 10 à 20 chez les filles adoptées, davantage si l’adoption a lieu après 2 ans ; il n’est pas augmenté chez les enfants migrant avec leur famille. Une cohorte de filles adoptées de Chine n’a pas montré d’avance de la ménarche (données déclarées par les parents). Le résultat dépend du contexte ; l’âge des adoptés est parfois incertain.</p></template>
<template data-pop="e45-mesure" data-title="Mesurer la taille correctement"><h3>Technique</h3><p>Le consensus européen recommande le stadiomètre de Harpenden ou une toise murale fiable. Avant 2 ans, on mesure la longueur couchée avec un infantomètre. Les instruments se contrôlent régulièrement. Chez le prématuré, on utilise l’âge corrigé jusqu’à au moins 24 mois après le terme.</p></template>
<template data-pop="e45-pc" data-title="Périmètre crânien"><h3>Seuil et signification</h3><p>Un périmètre crânien inférieur à −2 écarts-types est un seuil diagnostique dans le consensus SIP/SIEDP. La macrocéphalie oriente vers une dysplasie osseuse ou un syndrome et non vers une cause nutritionnelle.</p></template>
<template data-pop="e45-proportions" data-title="Proportions corporelles"><h3>Pourquoi les examiner</h3><p>Une disproportion entre segments évoque une dysplasie squelettique. Les dysmorphies et les signes de maladie d’organe orientent vers une cause primaire. Les gènes ACAN, FGFR3, NPR2, SHOX et IHH figurent parmi les causes de dysplasie citées par le consensus.</p></template>
<template data-pop="e45-pubertaire" data-title="Stades pubertaires"><h3>Pourquoi les inclure</h3><p>Toute évaluation de croissance doit inclure les stades pubertaires, le plus souvent avec un âge osseux, selon pädiatrie schweiz. L’évolution de la puberté situe l’enfant dans son pic de croissance et conditionne l’interprétation de la vitesse.</p></template>
