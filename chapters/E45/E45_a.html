<div class="chap-head"><div class="code">E45 — Retard de développement après malnutrition protéino-énergétique · retard de croissance linéaire (stunting) d’origine nutritionnelle · renvois : E40 — Kwashiorkor, E41 — Marasme nutritionnel, E42 — Kwashiorkor avec marasme · CIM-10-GM 2024 · Endocrinologie et métabolisme</div>
<h1>Retard de développement après malnutrition protéino-énergétique</h1><span class="status">Enfant et adolescent · retentissement statural et développemental de la dénutrition · sources : <button class="w" data-k="e45-cim">CIM-10-GM 2024 (OFS, BfArM)</button> ; pädiatrie schweiz 2020 ; consensus SIP/SIEDP 2026 ; revues Prendergast 2014 et Inzaghi 2022 · état au 15.10.2026, <button class="w" data-k="e45-lacunes">lacunes de sources nommées</button> · audit différé, revue par intelligence artificielle, distincte d’une validation médicale humaine</span></div>

<section class="ilot" id="e45-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Une fillette de 4 ans est amenée en consultation parce que ses vêtements restent trop grands d’une année à l’autre. Le carnet de santé montre une taille qui suivait la courbe de 25e percentile à 12 mois, puis qui s’est détachée vers le bas ; le poids, lui, a décroché plus tôt. Un enfant de cet âge ne paraît pas malade, il paraît petit. <b>La question décisive est de savoir si cette petite taille est la trace d’une alimentation insuffisante ou d’infections répétées, ou si elle masque une maladie que personne n’a encore cherchée.</b></p><p>Cette distinction commande tout le chapitre. Le code E45 désigne le <b>retentissement sur la croissance et le développement</b> d’une malnutrition protéino-énergétique ; il ne décrit pas l’urgence nutritionnelle aiguë, traitée aux leçons E40 à E42. Il suppose un <button class="w" data-k="e45-lien-causal">lien causal entre la dénutrition et le retard</button>, donc un diagnostic en deux temps : établir le retard statural, puis démontrer, ou du moins rendre vraisemblable, qu’il est nutritionnel après avoir écarté raisonnablement les causes primaires. Le ralentissement de la croissance est souvent le premier signe d’une maladie occulte, comme la maladie cœliaque, une maladie inflammatoire chronique de l’intestin ou un syndrome de Turner.</p><div class="key"><b>Point de départ.</b> Le diagnostic associe la <button class="w" data-k="e45-haz">taille pour l’âge en écarts-types (HAZ)</button> et la <button class="w" data-k="e45-vc">vitesse de croissance</button> mesurée dans le temps. Une mesure isolée ne suffit pas : c’est la trajectoire sur la courbe qui renseigne.</div><p>Le chapitre suit l’ordre d’une consultation : définir (îlots 1 et 2), comprendre la croissance normale puis sa perturbation (îlots 3 à 5), interroger et examiner (îlots 6 et 7), poser le diagnostic (îlot 8), reconnaître les situations graves et traiter (îlots 9 à 11), enfin suivre et conclure (îlots 12 à 14).</p><p class="src">Références : <a href="https://doi.org/10.1179/2046905514Y.0000000158" target="_blank" rel="noopener">Prendergast et Humphrey, Paediatr Int Child Health 2014</a> ; <a href="https://doi.org/10.1186/s13052-025-02190-6" target="_blank" rel="noopener">consensus SIP/SIEDP, Ital J Pediatr 2026</a>.</p></section>
<section class="ilot" id="e45-1"><h2><span class="n">1</span>Définitions et classifications</h2><h3>Ce que désigne le code</h3><p>La <button class="w" data-k="e45-cim">CIM-10-GM 2024</button> de l’Office fédéral de la statistique libelle E45 « Retard de développement après malnutrition protéino-énergétique ». La catégorie n’a pas de sous-code. Le texte allemand de la classification (BfArM) y range les termes « retard de développement d’origine alimentaire », « petite taille » et « retard physique par malnutrition ». E45 fait partie du bloc E40–E46, consacré à la malnutrition, et c’est le seul code de ce bloc qui décrit un retentissement sur la croissance. Les autres codes décrivent le degré de dénutrition : E43 (grave), E44.0 (modérée), E44.1 (légère), E46 (sans précision).</p><table class="t"><tr><th>Code voisin</th><th>Contenu</th><th>Quand le préférer à E45</th></tr><tr><td>E43</td><td>Malnutrition protéino-énergétique grave, sans précision ; poids à au moins 3 écarts-types sous la référence ; inclut l’œdème de famine</td><td>Dénutrition aiguë grave au premier plan</td></tr><tr><td>E44.0</td><td>Malnutrition protéino-énergétique modérée ; 2 à moins de 3 écarts-types sous la référence</td><td>Déficit pondéral modéré sans retard statural documenté</td></tr><tr><td>E44.1</td><td>Malnutrition protéino-énergétique légère ; 1 à moins de 2 écarts-types sous la référence</td><td>Déficit pondéral léger</td></tr><tr><td>E46</td><td>Malnutrition protéino-énergétique, sans précision</td><td>Dénutrition sans degré renseigné</td></tr><tr><td>E64.0</td><td>Séquelles de malnutrition protéino-énergétique ; exclu du bloc E40–E46</td><td>Codage de séquelles ; la source lue ne précise pas la frontière temporelle avec E45</td></tr></table><p>Le tableau montre que E45 n’est pas une échelle de gravité : on le choisit pour la conséquence staturale, non pour l’intensité de la dénutrition. La note du bloc précise en outre que le degré de dénutrition se juge d’ordinaire sur le poids, en écarts-types sous la moyenne de référence ; chez l’enfant, l’absence de prise de poids indique d’ordinaire une malnutrition, et une mesure isolée ne donne qu’un diagnostic provisoire.</p><h3>Les indices anthropométriques</h3><p>Trois indices décrivent la croissance d’un enfant, et ils ne mesurent pas la même chose. Le <button class="w" data-k="e45-haz">retard de croissance linéaire (stunting)</button> correspond à une taille, ou une longueur, pour l’âge inférieure à −2 écarts-types. Le <button class="w" data-k="e45-wasting">wasting (émaciation)</button> correspond à un poids pour la taille bas et reflète un déficit récent. Le poids pour l’âge bas (<i>underweight</i>) ne distingue pas les deux. Un enfant peut cumuler les trois.</p><div class="trap"><span class="k">Piège</span> Le seuil de −2 écarts-types est un indicateur statistique de population. Il n’a pas de fondement biologique comme limite entre un enfant atteint et un enfant sain : des enfants situés juste au-dessus et juste au-dessous du seuil subissent les mêmes facteurs limitants. Un enfant à −1,8 n’est pas rassurant par principe, un enfant à −2,2 qui suit sa courbe n’est pas malade par principe.</div><h3>Repérer un retard statural en pratique</h3><p>Le consensus européen SIP/SIEDP de 2026 retient trois critères, dont un seul suffit à repérer : taille inférieure à −2 écarts-types, ou au 3e percentile, pour l’âge, le sexe et la population ; taille inadéquate par rapport à la taille cible génétique ; <button class="w" data-k="e45-vc">vitesse de croissance</button> inférieure à −1 écart-type sur les six derniers mois. Le troisième critère rappelle qu’un enfant peut sortir de sa trajectoire avant d’avoir franchi un seuil.</p><div class="key"><b>À retenir.</b> E45 = conséquence sur la croissance ; le degré de dénutrition se code ailleurs. Stunting, wasting et underweight sont trois indices distincts. Le seuil −2 écarts-types est un repère de population, pas une limite biologique.</div><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, OFS</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc E40–E46, BfArM (texte allemand)</a> ; <a href="https://doi.org/10.1093/jn/nxx064" target="_blank" rel="noopener">Perumal et al., J Nutr 2017</a> ; <a href="https://doi.org/10.1186/s13052-025-02190-6" target="_blank" rel="noopener">SIP/SIEDP 2026</a>.</p></section>
<section class="ilot" id="e45-2"><h2><span class="n">2</span>Épidémiologie</h2><p>Le retard de croissance linéaire est la forme de dénutrition la plus répandue au monde. Une estimation citée en 2014 compte environ 165 millions d’enfants de moins de 5 ans avec une taille pour l’âge inférieure à −2 écarts-types, et la dénutrition sous-tend 45 % des décès avant 5 ans. Ces chiffres décrivent surtout des pays à revenu faible ou intermédiaire ; ils servent ici à comprendre l’ampleur du phénomène et ses déterminants, non à estimer la fréquence en Suisse.</p><table class="t"><tr><th>Donnée</th><th>Valeur</th><th>Source</th></tr><tr><td>Prévalence dans le quintile le plus pauvre, comparée au plus riche (79 pays)</td><td>2,47 fois plus élevée (extrêmes 1,00 à 7,64)</td><td>Prendergast 2014</td></tr><tr><td>Garçons plus souvent atteints, Afrique subsaharienne</td><td>Rapport de cotes 1,16 (intervalle de confiance à 95 % : 1,12 à 1,20)</td><td>Prendergast 2014</td></tr><tr><td>Enfants cumulant stunting et wasting, pays à faible revenu (50 pays, 2000–2015)</td><td>4,7 % ; mortalité multipliée par 4,8</td><td>Victora 2021</td></tr><tr><td>Mortalité, stunting et poids pour l’âge bas associés</td><td>Rapport de risques instantanés 3,4 (2,6 à 4,3)</td><td>Prendergast 2014</td></tr><tr><td>Mortalité, stunting, poids pour l’âge bas et wasting associés</td><td>Rapport de risques instantanés 12,3 (7,7 à 19,6), 53 767 enfants</td><td>Prendergast 2014</td></tr></table><p>Le tableau montre que la pauvreté est le premier gradient et que les atteintes se cumulent : chaque indice anormal ajouté multiplie la mortalité. Stunting et wasting peuvent exister dès la naissance, avec une incidence maximale dans les six premiers mois. Entre 2000 et 2015, le stunting a reculé dans les 50 pays étudiés, plus nettement dans les pays à revenu intermédiaire. Les déterminants des baisses nationales sont les actifs du ménage, l’éducation parentale, l’assainissement, les soins maternels (suivi prénatal, accouchement assisté), la planification familiale et la taille maternelle.</p><h3>Contexte suisse et européen</h3><p>Aucune donnée suisse de prévalence du stunting nutritionnel n’a été trouvée dans les sources lues. Les sources indiquent que, dans un pays comme la Suisse, la cause nutritionnelle relève surtout de populations particulières : enfants adoptés à l’international, adolescents avec trouble du comportement alimentaire, enfants atteints de maladie chronique (maladie cœliaque, maladie inflammatoire de l’intestin, insuffisance rénale). C’est une <button class="w" data-k="e45-lacunes">lacune de sources</button> qu’il faut nommer plutôt que combler par une estimation.</p><div class="key"><b>À retenir.</b> Mondialement, le stunting est la dénutrition la plus répandue et il suit la pauvreté. En Suisse, aucun chiffre de prévalence n’est établi dans les sources lues ; le raisonnement part des populations à risque et d’une maladie chronique à ne pas manquer.</div><p class="src">Références : <a href="https://doi.org/10.1179/2046905514Y.0000000158" target="_blank" rel="noopener">Prendergast 2014</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00394-9" target="_blank" rel="noopener">Victora et al., Lancet 2021</a> ; <a href="https://doi.org/10.1093/ajcn/nqaa159" target="_blank" rel="noopener">Vaivada et al., Am J Clin Nutr 2020</a>.</p></section>
<section class="ilot" id="e45-3"><h2><span class="n">3</span>La croissance normale</h2><p>Comprendre le retard exige de connaître ce qu’il perturbe. La croissance de l’enfant traverse quatre phases : fœtale, nourrisson, enfance et puberté. Chacune dépend d’un contrôle différent. La nutrition domine pendant la vie fœtale et la première année ; le contrôle endocrinien domine pendant l’enfance et la puberté. Un déficit nutritionnel frappe donc d’autant plus fort qu’il survient tôt, au moment où la nutrition règle presque seule la croissance.</p><h3>Une croissance qui avance par à-coups</h3><p>Chez le nourrisson, la croissance est épisodique : des stases de 2 à 63 jours alternent avec des poussées, et l’enfant ne grandit pas pendant 90 à 95 % du temps. Une seule mesure peut donc tomber dans une stase et ne pas refléter la trajectoire ; il faut des mesures répétées. Jusqu’à 2 ans, des enfants de régions différentes grandissent de façon remarquablement semblable lorsque leurs besoins sont couverts. L’environnement (nutrition maternelle, alimentation, hygiène, infections, soins) est le principal déterminant de ces deux premières années. La taille adulte est très héritable, mais plus de 200 gènes n’en expliquent qu’environ 10 % de la variance.</p><h3>Un organe cible : la plaque de croissance</h3><p>Les os longs s’allongent au niveau de la <button class="w" data-k="e45-plaque">plaque de croissance</button> (cartilage de conjugaison). Les chondrocytes y prolifèrent, puis se différencient. Ils ont une capacité proliférative finie, épuisée progressivement : cette sénescence ralentit puis arrête la croissance, jusqu’à la fusion épiphysaire. Les régulateurs endocriniens sensibles à la nutrition agissent sur cet organe : hormone de croissance, <button class="w" data-k="e45-gh-igf">IGF-I</button>, stéroïdes sexuels, hormones thyroïdiennes, insuline, leptine et glucocorticoïdes.</p><table class="t"><tr><th>Âge ou période</th><th>Vitesse de croissance moyenne</th></tr><tr><td>Première année</td><td>22 à 24 cm</td></tr><tr><td>Deuxième année</td><td>environ 10 cm par an</td></tr><tr><td>Avant la puberté</td><td>environ 5 à 6 cm par an</td></tr><tr><td>Pic pubertaire</td><td>10 à 12 cm par an en moyenne</td></tr></table><p>Ces ordres de grandeur, tirés du consensus SIP/SIEDP, se mesurent sur 6 à 12 mois. Ils servent de repères pour juger si une <button class="w" data-k="e45-vc">vitesse de croissance</button> est trop basse.</p><div class="key"><b>À retenir.</b> Nutrition d’abord (vie fœtale et première année), endocrinologie ensuite (enfance et puberté). Le cartilage de croissance a un capital de divisions limité. Un retard précoce est donc le plus sensible à la nutrition.</div><p class="src">Références : <a href="https://doi.org/10.1179/2046905514Y.0000000158" target="_blank" rel="noopener">Prendergast 2014</a> ; <a href="https://doi.org/10.3390/nu14091752" target="_blank" rel="noopener">Inzaghi et al., Nutrients 2022</a> ; <a href="https://doi.org/10.1007/s00467-004-1689-4" target="_blank" rel="noopener">Nilsson et Baron, Pediatr Nephrol 2005</a> ; <a href="https://doi.org/10.1186/s13052-025-02190-6" target="_blank" rel="noopener">SIP/SIEDP 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-e45-notions">▲ Loi de Pareto — Définitions, épidémiologie et croissance normale</button></section>
<section class="ilot" id="e45-4"><h2><span class="n">4</span>De la malnutrition au retard : les mécanismes</h2><p>Un enfant qui mange trop peu ne cesse pas de grandir par simple manque de matière première. L’organisme règle activement sa croissance en fonction de ce qu’il reçoit, et ce réglage passe par plusieurs voies que le médecin doit pouvoir enchaîner.</p><h3>1. L’axe hormone de croissance – IGF-I devient résistant</h3><p>Un jeûne bref élève l’hormone de croissance. Un jeûne prolongé installe une <button class="w" data-k="e45-gh-igf">résistance périphérique à l’hormone de croissance</button> : l’hormone reste élevée, mais l’IGF-I produit par le foie et circulant s’effondre. Le défaut siège au niveau du récepteur dans les formes sévères et en aval du récepteur dans les formes moins sévères. L’IGF-I dépend à la fois de l’apport protéique et de l’apport énergétique : il faut les deux pour le normaliser, et les acides aminés essentiels comptent pour sa restauration. Les protéines de liaison IGFBP-1 et IGFBP-2 augmentent, ce qui accélère la clairance de l’IGF-I et réduit sa biodisponibilité.</p><p>Cette baisse est une adaptation. Le catabolisme protéique libère des acides aminés pour la néoglucogenèse, qui nourrit le cerveau. L’organisme sacrifie la croissance pour préserver l’organe le plus précieux. Conséquence clinique directe : dans les plaques de croissance de souris restreintes, l’IGF-I et l’expression du récepteur de l’hormone de croissance diminuent, ce qui explique la faible réponse à l’hormone de croissance administrée chez l’animal et chez l’enfant malnutris.</p><h3>2. Les autres signaux nutritionnels</h3><p>Le <button class="w" data-k="e45-fgf21">FGF21</button> signale une restriction protéique : il réduit l’expression hépatique du récepteur de l’hormone de croissance et inhibe la signalisation de cette hormone, y compris dans la plaque. L’insuline est mitogène par le récepteur de l’IGF-I. La leptine stimule l’hormone de croissance et les chondrocytes. Un déficit en MC3R est associé à un retard pubertaire, à une croissance altérée et à un IGF-I bas. Les hormones thyroïdiennes dépendent de l’iode, du sélénium, du zinc, du fer et de la vitamine A, et régulent l’ossification endochondrale.</p><h3>3. L’inflammation et l’intestin</h3><p>L’<button class="w" data-k="e45-eed">entéropathie environnementale</button> associe une atrophie villositaire et une inflammation chronique de l’intestin grêle, entretenues par l’exposition fécale-orale. Elle entraîne une malabsorption modérée et une perméabilité accrue ; des microbes traversent la barrière, d’où une inflammation systémique qui supprime l’IGF-I. Les infections répétées comptent aussi : chaque épisode de diarrhée augmente les chances de stunting à 24 mois, et 25 % du stunting seraient attribuables à cinq épisodes ou plus. Le paludisme a un effet causal démontré par randomisation mendélienne (trait drépanocytaire), et la schistosomiase perturbe l’axe de l’hormone de croissance avec un IGF-I réduit.</p><h3>4. Une origine souvent prénatale</h3><p>Environ 20 % du stunting a une <button class="w" data-k="e45-prenatal">origine fœtale</button>. Le risque de stunting postnatal augmente après une naissance prématurée (rapport de cotes 1,93), un petit poids pour l’âge gestationnel (2,43) ou les deux (4,51). La taille maternelle prédit celle de l’enfant, ce qui installe un cycle intergénérationnel.</p><table class="t"><tr><th>Voie</th><th>Perturbation</th><th>Conséquence sur la croissance</th></tr><tr><td>Axe GH – IGF-I</td><td>Résistance à la GH, IGFBP-1 et IGFBP-2 en hausse</td><td>Moins d’IGF-I actif à la plaque</td></tr><tr><td>Signal de restriction</td><td>FGF21 élevé</td><td>Récepteur GH hépatique et plaque moins sensibles</td></tr><tr><td>Intestin</td><td>Entéropathie environnementale</td><td>Inflammation systémique, IGF-I supprimé</td></tr><tr><td>Infections</td><td>Diarrhée, paludisme, schistosomiase</td><td>Pertes, catabolisme, axe GH perturbé</td></tr><tr><td>Prénatal</td><td>Prématurité, petit poids pour l’âge gestationnel</td><td>Point de départ plus bas</td></tr></table><div class="key"><b>À retenir.</b> La malnutrition ralentit la croissance en rendant l’axe GH – IGF-I résistant, par adaptation métabolique. Les protéines et l’énergie sont toutes deux nécessaires. L’inflammation intestinale et les infections s’ajoutent au manque d’apport.</div><div class="trap"><span class="k">Piège</span> Conclure que la dénutrition « n’a pas d’effet sur l’hormone de croissance » parce que celle-ci est normale ou haute. Dans le jeûne prolongé, c’est l’IGF-I qui est bas et la résistance à l’hormone, non son absence, qui explique le retard.</div><p class="src">Références : <a href="https://doi.org/10.3390/nu14091752" target="_blank" rel="noopener">Inzaghi 2022</a> ; <a href="https://doi.org/10.1179/2046905514Y.0000000158" target="_blank" rel="noopener">Prendergast 2014</a> ; <a href="https://doi.org/10.1093/nutrit/nuy068" target="_blank" rel="noopener">Budge et al., Nutr Rev 2019</a> ; <a href="https://doi.org/10.1098/rstb.2025.0044" target="_blank" rel="noopener">Colt et al. 2025</a>.</p></section>
<section class="ilot" id="e45-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2><p>La cause d’un retard statural d’allure nutritionnelle dépend du contexte, et les sources lues séparent nettement les situations de ressources limitées de celles d’un pays comme la Suisse.</p><table class="t"><tr><th>Contexte</th><th>Causes à envisager</th><th>Source</th></tr><tr><td>Ressources limitées</td><td>Alimentation de complément insuffisante entre 6 et 24 mois ; infections répétées ; carences en micronutriments ; entéropathie environnementale ; mycotoxines (aflatoxine, fumonisine) ; facteurs maternels</td><td>Prendergast 2014 ; Victora 2021</td></tr><tr><td>Europe et Suisse</td><td>Maladie chronique avec retard statural isolé : anémie, déficit en hormone de croissance, hypothyroïdie, maladie cœliaque, insuffisance rénale, maladies osseuses métaboliques, acidose tubulaire rénale, maladie inflammatoire de l’intestin, syndrome de Turner</td><td>Wit 2019</td></tr><tr><td>Adolescent</td><td>Anorexie mentale ; diabète de type 1 mal contrôlé (insuline basse)</td><td>Inzaghi 2022 ; Modan-Moses 2003</td></tr><tr><td>Migration et adoption</td><td>Privation antérieure (adoption internationale, migration)</td><td>Teilmann 2006</td></tr></table><p>La lecture du tableau est utile : en Suisse, on trouve rarement une « simple » sous-alimentation chez un enfant vivant dans sa famille, et un retard statural doit d’abord faire penser à une maladie qui consomme, perd ou empêche d’absorber. À l’inverse, l’enfant venu d’un contexte de privation relève d’un autre raisonnement, où la nutrition passée prime.</p><div class="trap"><span class="k">Piège</span> Poser le code E45 sur la seule petite taille. Sans histoire nutritionnelle documentée et sans bilan de dépistage, c’est un diagnostic d’exclusion non démontré.</div><p class="src">Références : <a href="https://doi.org/10.1159/000499915" target="_blank" rel="noopener">Wit et al., Horm Res Paediatr 2019</a> ; <a href="https://doi.org/10.1542/peds.111.2.270" target="_blank" rel="noopener">Modan-Moses et al., Pediatrics 2003</a> ; <a href="https://doi.org/10.1542/peds.2005-2939" target="_blank" rel="noopener">Teilmann et al., Pediatrics 2006</a>.</p></section>
<section class="ilot" id="e45-6"><h2><span class="n">6</span>Anamnèse</h2><p>L’interrogatoire reconstitue la trajectoire de croissance et cherche la cause. Les sources européennes donnent la liste des éléments utiles.</p><table class="t"><tr><th>Élément</th><th>Ce qu’on cherche</th><th>Pourquoi</th></tr><tr><td>Mesures antérieures (carnet de santé)</td><td>Taille, poids, vitesse de croissance, âge du décrochage</td><td>Tracer la courbe : la trajectoire prime sur la valeur isolée</td></tr><tr><td>Taille des deux parents, antécédents familiaux</td><td>Taille cible génétique</td><td>Distinguer une petite taille familiale d’un décrochage</td></tr><tr><td>Naissance</td><td>Âge gestationnel, poids et taille de naissance</td><td>Prématurité et petit poids pour l’âge gestationnel augmentent le risque</td></tr><tr><td>Alimentation</td><td>Quantité, qualité, diversité, restriction volontaire</td><td>Établir le lien causal avec la dénutrition</td></tr><tr><td>Symptômes digestifs, infections répétées, maladies chroniques</td><td>Diarrhée, douleurs, retard pubertaire, maladie connue</td><td>Orienter vers cœliaque, maladie inflammatoire, entéropathie</td></tr><tr><td>Médicaments</td><td>Glucocorticoïdes</td><td>Ils inhibent la plaque de croissance</td></tr><tr><td>Adolescent</td><td>Aménorrhée, comportement alimentaire</td><td>Le ralentissement statural peut précéder le diagnostic d’anorexie mentale</td></tr><tr><td>Contexte psychosocial, migration, adoption</td><td>Privation, âge à l’adoption</td><td>Contexte nutritionnel passé et risque de puberté précoce</td></tr></table><p>Le tableau regroupe les questions par utilité. Deux d’entre elles méritent d’être expliquées. La taille des parents n’est utile que rapportée à celle de l’enfant : le consensus italien retient une taille « inadéquate par rapport à la taille cible » comme critère de repérage, mais la source lue ne donne pas la formule de calcul, que l’on ne reconstruit donc pas de mémoire. La prise de glucocorticoïdes est souvent oubliée parce qu’elle paraît lointaine ; elle ralentit pourtant la plaque de croissance.</p><div class="key"><b>À retenir.</b> Sans courbe, pas de diagnostic. On demande le carnet de santé, la taille des deux parents, la naissance, l’alimentation et les médicaments avant toute prescription d’examens.</div><p class="src">Références : <a href="https://doi.org/10.1186/s13052-025-02190-6" target="_blank" rel="noopener">SIP/SIEDP 2026</a> ; <a href="https://doi.org/10.1159/000499915" target="_blank" rel="noopener">Wit 2019</a> ; <a href="https://doi.org/10.1159/000321244" target="_blank" rel="noopener">Lui et Baron, effets des glucocorticoïdes sur la plaque de croissance</a>.</p></section>
