<template data-pop="a46-pa-def" data-title="Érysipèle : définition clinique">
<p>Infection aiguë du derme superficiel par streptocoque bêta-hémolytique : plaque rouge, chaude, douloureuse, surélevée, à bord net, le plus souvent sur la jambe ou le visage, avec fièvre possible avant la rougeur.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, présentation clinique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-s-strepto" data-title="Streptocoques de l’érysipèle">
<p>Groupe A (<i>S. pyogenes</i>) surtout, parfois groupes C ou G. Cocci à Gram positif en chaînettes, bêta-hémolytiques, sensibles à la pénicilline.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56271" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Pénicilline «Grünenthal», mai 2023</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-pa-ddx" data-title="Fausse jambe rouge">
<ul><li>Dermite de stase : bilatérale, chronique, prurigineuse, sans fièvre.</li><li>Thrombose veineuse profonde : œdème, douleur du mollet ; échographie-doppler si doute.</li><li>Eczéma de contact : prurit, vésicules, contact identifiable.</li><li>Goutte ou arthrite : centrée sur une articulation.</li><li>Érythème migrant : peu inflammatoire, apyrétique, après piqûre de tique.</li></ul><p>La liste est une aide au raisonnement ; la SSI insiste avant tout sur l’inspection de la peau et la recherche de la porte d’entrée.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, diagnostic</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-e-bio" data-title="Biologie inflammatoire">
<p>Leucocytose et protéine C réactive augmentée sont fréquentes mais non spécifiques ; la SSI mentionne la leucocytose parmi les manifestations systémiques possibles. Aucun seuil ne pose ni n’exclut le diagnostic.</p><div class="src">Source : <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, présentation clinique</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-p-contentieux" data-title="Amoxicilline : directive suisse ou information professionnelle ?">
<div class="lab">Divergence</div><p>SSI 2025 : amoxicilline 500 mg toutes les 12 heures, durée 5 jours. Amoxi-Mepha® (août 2024) : 375 à 750 mg trois à quatre fois par jour, et au moins dix jours pour une infection à streptocoque bêta-hémolytique afin de prévenir le rhumatisme articulaire aigu et la glomérulonéphrite.</p>
<div class="lab">Lecture</div><p>La durée courte de 5 jours est soutenue par la référence nord-américaine citée par la SSI. La dose de 500 mg toutes les 12 heures, identique dans les versions allemande et française de la directive, reste inhabituellement basse ; elle doit être confirmée auprès des auteurs ; c’est une lacune nommée de ce cours. Une prescription hors des schémas de l’information professionnelle relève de la responsabilité du prescripteur.</p><div class="src">Sources : <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44911" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Amoxi-Mepha®, août 2024</a> ; <a href="https://doi.org/10.1093/cid/ciu296" target="_blank" rel="noopener" data-reference-source="1">Stevens DL et al., Clin Infect Dis 2014;59:e10 (référence citée par la SSI)</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-p-peni" data-title="Pénicilline G et amoxicilline">
<p>Bêtalactamines bactéricides, inhibant la synthèse de la paroi. Benzylpénicilline intraveineuse : utilisable pendant la grossesse ; contre-indiquée en cas d’allergie avérée à la pénicilline. Amoxicilline orale : dose adulte usuelle 375 à 750 mg trois à quatre fois par jour selon l’information suisse.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56271" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Pénicilline «Grünenthal», mai 2023</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44911" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Amoxi-Mepha®, août 2024</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-p-cefa" data-title="Céfazoline">
<p>Céphalosporine de première génération active sur les streptocoques bêta-hémolytiques du groupe A et sur <i>S. aureus</i>. Allergie croisée possible avec la pénicilline. Pendant les trois premiers mois de grossesse, à utiliser seulement après évaluation sérieuse du rapport bénéfice-risque.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=55729" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Céfazoline Sandoz®, février 2026</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="a46-p-clinda" data-title="Clindamycine">
<p>Lincosamide inhibant la synthèse protéique, avec effet anti-toxinique utile dans la fasciite streptococcique. Risque élevé de colite à <i>C. difficile</i> ; réactions cutanées sévères possibles. Pendant la grossesse : seulement en cas de nécessité absolue.</p><div class="src">Sources : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=35438" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dalacin® C, juillet 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, fasciite nécrosante</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-a46-clinique" data-title="Loi de Pareto — Reconnaître l’érysipèle">
<p class="ratio" data-cover="a46-pa-1,a46-pa-3,a46-pa-4,a46-pa-6,a46-pa-7,a46-pa-8"></p><ul><li>Plaque rouge, chaude, à bord net, fièvre ; jambe ou visage.</li><li>Porte d’entrée : intertrigo interorteil ; terrain : lymphœdème.</li><li>Diagnostic clinique, pas d’hémocultures en routine.</li><li>Douleur disproportionnée, phlyctènes, nécrose, hypoesthésie, choc : fasciite, chirurgie urgente.</li></ul>
</template>
<template data-pop="pareto-a46-traitement" data-title="Loi de Pareto — Traiter l’érysipèle">
<p class="ratio" data-cover="a46-pa-9,a46-pa-10"></p><ul><li>Pénicilline ou amoxicilline ; clindamycine si allergie.</li><li>Durée de base 5 jours selon la SSI, prolongée si nécessaire.</li><li>Surélévation, thromboprophylaxie, traitement de la porte d’entrée.</li><li>Récidives fréquentes : prophylaxie par pénicilline, efficace tant qu’elle dure.</li></ul>
</template>
<template data-pop="pareto-a46-examens" data-title="Loi de Pareto — Examens de l’érysipèle">
<p class="ratio" data-cover="a46-e-1,a46-e-2,a46-e-3"></p><ul><li>Aucun examen dans la forme typique.</li><li>Prélèvements : immunosuppression, neutropénie, morsure, fasciite.</li><li>Imagerie si doute de fasciite ou d’ostéomyélite, sans retarder la chirurgie.</li></ul>
</template>
<template data-pop="pareto-a46-pharma" data-title="Loi de Pareto — Pharmacologie de l’érysipèle">
<p class="ratio" data-cover="a46-p-1,a46-p-2,a46-p-3"></p><ul><li>Spectre étroit : pénicillines.</li><li>Céfazoline en alternative intraveineuse ; clindamycine si allergie.</li><li>Clindamycine : surveiller la diarrhée (C. difficile).</li></ul>
</template>
