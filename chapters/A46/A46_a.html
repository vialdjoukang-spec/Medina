<section class="ilot" id="a46-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. R., 68 ans, insuffisant veineux, consulte pour une jambe rouge, chaude et douloureuse depuis la veille. La fièvre et les frissons ont précédé la rougeur de quelques heures. La plaque est vive, surélevée, à bord net ; entre ses orteils, la peau est macérée et fissurée. Ce tableau aigu, fébrile, avec une plaque bien limitée et une porte d’entrée, est celui d’un <button class="w" data-k="a46-pa-def">érysipèle (définition clinique)</button>. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, présentation clinique</a>.</p>
<p>Ce cours répond à quatre questions. Comment poser le diagnostic sans examen inutile ? Quels signes doivent faire craindre une infection profonde qui se joue en heures ? Quel antibiotique, par quelle voie et pour combien de temps ? Comment éviter la récidive ?</p>
<div class="key"><b>À retenir.</b> L’érysipèle est un diagnostic clinique ; la seule urgence est de ne pas méconnaître une fasciite nécrosante.</div></section>

<section class="ilot" id="a46-pa-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>L’érysipèle est une infection bactérienne aiguë de la couche superficielle du derme, due presque toujours aux streptocoques bêta-hémolytiques. La Société suisse d’infectiologie (SSI) le range avec la cellulite parmi les infections cutanées non purulentes, et l’oppose à la fasciite nécrosante, infection profonde. Ce qui les distingue est la profondeur atteinte, et donc l’aspect de la lésion. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, diagnostic différentiel</a>.</p>
<table class="t"><thead><tr><th></th><th>Érysipèle</th><th>Cellulite (phlegmon)</th><th>Fasciite nécrosante</th></tr></thead><tbody>
<tr><td>Tissu atteint</td><td>Derme superficiel</td><td>Derme profond et hypoderme</td><td>Fascia, muscle, tissus profonds</td></tr>
<tr><td>Aspect</td><td>Bord net, surélevé</td><td>Bord flou, sans démarcation</td><td>Progression rapide, nécrose, phlyctènes, teinte violacée</td></tr>
<tr><td>Germes</td><td>Streptocoques bêta-hémolytiques du groupe A, parfois C ou G</td><td>Streptocoques bêta-hémolytiques, <i>S. aureus</i></td><td>Souvent polymicrobienne</td></tr>
</tbody></table>
<p>Le tableau se lit en profondeur : plus l’infection descend, plus la bordure s’efface et plus le pronostic s’assombrit. Dans la littérature anglophone, « cellulitis » recouvre souvent érysipèle et cellulite. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, diagnostic différentiel</a> ; <a href="https://doi.org/10.1093/cid/ciu296" target="_blank" rel="noopener" data-reference-source="1">Stevens DL et al., Clin Infect Dis 2014;59:e10 (référence citée par la SSI)</a>.</p>
<div class="key"><b>À retenir.</b> Bord net = derme superficiel = érysipèle ; bord flou = cellulite ; douleur disproportionnée = fasciite jusqu’à preuve du contraire.</div></section>

<section class="ilot" id="a46-pa-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’érysipèle n’est pas une maladie à déclaration obligatoire en Suisse, et aucune donnée suisse d’incidence n’a pu être lue pour ce cours : c’est une lacune nommée des sources consultées. Les données européennes disponibles proviennent surtout d’études hospitalières françaises et britanniques. <a href="https://doi.org/10.1136/bmj.318.7198.1591" target="_blank" rel="noopener" data-reference-source="1">Dupuy A et al., BMJ 1999;318:1591 (étude cas-témoins, 7 centres français)</a> ; <a href="https://doi.org/10.1056/NEJMoa1206300" target="_blank" rel="noopener" data-reference-source="1">Thomas KS et al., essai PATCH I, N Engl J Med 2013;368:1695</a>.</p>
<p>Le pronostic immédiat est bon sous traitement ; le problème majeur est la récidive. Dans l’essai PATCH I, chez des patients ayant déjà fait au moins deux épisodes, 37 % des patients sous placebo récidivaient pendant les 12 mois d’observation sous traitement. <a href="https://doi.org/10.1056/NEJMoa1206300" target="_blank" rel="noopener" data-reference-source="1">Thomas KS et al., essai PATCH I, N Engl J Med 2013;368:1695</a>.</p>
<div class="key"><b>À retenir.</b> Guérison habituelle, mais récidive fréquente si les facteurs locaux persistent.</div></section>

<section class="ilot" id="a46-pa-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le streptocoque pénètre par une effraction cutanée — intertrigo interorteil fissuré, ulcère, plaie, dermatose — puis se propage dans les vaisseaux lymphatiques du derme superficiel. L’inflammation qu’il déclenche à ce niveau donne la plaque rouge, chaude, surélevée, à bord net : la limite visible correspond au front de l’infection dans le derme superficiel. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, présentation clinique</a> ; <a href="https://doi.org/10.1136/bmj.318.7198.1591" target="_blank" rel="noopener" data-reference-source="1">Dupuy A et al., BMJ 1999;318:1591 (étude cas-témoins, 7 centres français)</a>.</p>

<p>Les signes généraux — fièvre, frissons, tachycardie — peuvent précéder la rougeur de plusieurs heures. Chaque épisode altère un peu plus le drainage lymphatique ; l’œdème lymphatique résiduel favorise à son tour l’épisode suivant. Ce cercle explique la récidive. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, présentation clinique</a> ; <a href="https://doi.org/10.1136/bmj.318.7198.1591" target="_blank" rel="noopener" data-reference-source="1">Dupuy A et al., BMJ 1999;318:1591 (étude cas-témoins, 7 centres français)</a>.</p>
<div class="key"><b>Corrélation clinique.</b> Traiter la porte d’entrée et l’œdème n’est pas accessoire : c’est la seule façon de rompre le cercle lymphœdème–récidive.</div></section>

<section class="ilot" id="a46-pa-4"><h2><span class="n">4</span>Agent pathogène et facteurs de risque</h2>
<p>L’agent est <i>Streptococcus pyogenes</i> (streptocoque bêta-hémolytique du groupe A), parfois un streptocoque du groupe C ou G ; le <button class="w" data-k="a46-s-strepto">streptocoque (notions de microbiologie)</button> est détaillé dans l’onglet Sciences. Il ne s’agit pas d’une maladie contagieuse au sens pratique ; la transmission interhumaine n’est pas au premier plan. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, diagnostic différentiel</a>.</p>
<p>Les facteurs de risque sont surtout locaux. Dans une étude cas-témoins française (167 cas, 294 témoins), les facteurs indépendants étaient : lymphœdème (rapport des cotes 71,2), effraction de la barrière cutanée (23,8), insuffisance veineuse (2,9), œdème de jambe (2,5) et surpoids (2,0). Le diabète, l’alcool et le tabac n’étaient pas associés. L’intertrigo interorteil représentait 61 % du risque attribuable dans la population. <a href="https://doi.org/10.1136/bmj.318.7198.1591" target="_blank" rel="noopener" data-reference-source="1">Dupuy A et al., BMJ 1999;318:1591 (étude cas-témoins, 7 centres français)</a>.</p>
<div class="trap"><span class="k">Piège.</span> Chercher la porte d’entrée entre les orteils : l’intertrigo mycosique fissuré est la plus fréquente et la plus facile à traiter.</div></section>

<section class="ilot" id="a46-pa-5"><h2><span class="n">5</span>Anamnèse</h2>
<div class="two"><div class="card"><b>Histoire de la maladie</b><p>Début brutal ; fièvre et frissons parfois avant la rougeur ; extension en heures ou en jours ; intensité de la douleur, à confronter à l’aspect local.</p></div>
<div class="card"><b>Terrain</b><p>Épisodes antérieurs ; lymphœdème (curage ganglionnaire, chirurgie veineuse) ; insuffisance veineuse ; mycose des pieds ; immunosuppression, chimiothérapie ; hépatopathie ; morsure animale ; traumatisme ou chirurgie récents ; allergie aux bêtalactamines.</p></div></div>
<p>Plusieurs de ces éléments — immunosuppression, traumatisme ou intervention récents, hépatopathie — sont des signaux d’alarme selon la SSI et modifient la conduite. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, signaux d’alarme</a>.</p></section>

<section class="ilot" id="a46-pa-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen mesure les signes vitaux, décrit la plaque, recherche la porte d’entrée et les signes de profondeur.</p>

<div class="two"><div class="card"><b>Signes d’érysipèle</b><p>Plaque rouge vif, chaude, douloureuse, surélevée, à bord net ; siège typique : jambe, visage. Adénopathie et traînée de lymphangite possibles. Marquer le bord au feutre permet de suivre l’évolution.</p></div>
<div class="card"><b>Signes de profondeur</b><p>Douleur disproportionnée par rapport à l’aspect, œdème sous tension, phlyctènes, ecchymoses ou nécrose, hypoesthésie locale, crépitation sous-cutanée, aggravation rapide de l’état général. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, présentation clinique</a>.</p></div></div>

<section class="ilot" id="a46-pa-7"><h2><span class="n">7</span>Diagnostic et diagnostic différentiel</h2>
<p>Le diagnostic est clinique. La SSI ne recommande pas d’hémocultures en routine, ni d’aspiration ou de biopsie de la lésion ; elle réserve les prélèvements à des situations particulières, et l’imagerie au doute sur une fasciite ou une ostéomyélite. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, diagnostic</a>.</p>
<p>Le diagnostic différentiel principal est la <button class="w" data-k="a46-pa-ddx">fausse jambe rouge (liste raisonnée)</button> : dermite de stase bilatérale, thrombose veineuse profonde, eczéma de contact, goutte ou arthrite. La bilatéralité et l’absence de fièvre plaident contre l’érysipèle. Autre différentiel infectieux : l’érythème migrant de la borréliose, peu inflammatoire et apyrétique.</p>
<div class="key"><b>À retenir.</b> Une jambe rouge bilatérale sans fièvre n’est presque jamais un érysipèle.</div>
<button class="pareto-btn ui" data-k="pareto-a46-clinique">▲ Loi de Pareto — Reconnaître l’érysipèle</button></section>

<section class="ilot" id="a46-pa-8"><h2><span class="n">8</span>Urgences : signaux d’alarme et fasciite nécrosante</h2>
<div class="alert"><b>Signaux d’alarme selon la SSI.</b> Aggravation rapide ; sepsis, choc ou confusion ; immunosuppression ; traumatisme ou chirurgie récents ; hépatopathie ; hypoesthésie ou anesthésie de la zone ; douleur disproportionnée ; progression malgré l’antibiotique. Ils imposent d’envisager une infection profonde. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, signaux d’alarme</a>.</div>
<p>Devant une suspicion de fasciite nécrosante, l’antibiothérapie à large spectre commence immédiatement — par exemple pipéracilline-tazobactam 4,5 g toutes les 8 heures plus clindamycine 600 à 900 mg toutes les 8 heures par voie intraveineuse — et l’avis chirurgical est demandé en urgence, car le débridement précoce est le traitement décisif. La clindamycine est ajoutée pour son effet anti-toxinique. L’imagerie ne doit pas retarder la décision. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, fasciite nécrosante</a>.</p>
<p>La version en ligne de la directive indique « 4.5 mg » pour la pipéracilline-tazobactam ; il s’agit d’une coquille manifeste pour 4,5 g, dose usuelle de cette association. Chez un patient cirrhotique ayant consommé des fruits de mer, la SSI rappelle de penser à <i>Vibrio vulnificus</i> et d’ajouter une céphalosporine de troisième génération. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, fasciite nécrosante</a>.</p>
<div class="trap"><span class="k">Piège.</span> La fasciite débute comme une cellulite banale ; seule la douleur hors de proportion avec l’aspect cutané alerte tôt.</div></section>

<section class="ilot" id="a46-pa-9"><h2><span class="n">9</span>Prise en charge</h2>
<p>Les objectifs sont de guérir l’infection, de soulager, et de traiter la porte d’entrée pour prévenir la récidive. Mesures générales selon la SSI : repos et surélévation du membre, thromboprophylaxie, traitement de l’œdème, de l’eczéma et de la mycose interorteil. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, traitement</a>.</p>
<table class="t"><thead><tr><th>Situation (SSI 2025)</th><th>Antibiotique</th><th>Durée</th></tr></thead><tbody>
<tr><td>Cas léger, ambulatoire</td><td>Amoxicilline 500 mg toutes les 12 h par voie orale, ou clindamycine 300 à 450 mg toutes les 6 h par voie orale</td><td>5 jours, prolongés si pas d’amélioration</td></tr>
<tr><td>Cas hospitalisé</td><td>Pénicilline G 2 à 4 millions d’unités toutes les 4 à 6 h, ou céfazoline 1 à 2 g toutes les 8 h, ou clindamycine 600 mg toutes les 8 h, par voie intraveineuse</td><td>5 jours, prolongés si complication</td></tr>
</tbody></table>
<p>L’érysipèle typique étant streptococcique, la SSI privilégie la pénicilline ou l’amoxicilline ; la clindamycine est l’option en cas d’allergie aux bêtalactamines. La surveillance est clinique : fièvre, douleur et extension du bord marqué ; la rougeur régresse plus lentement que la fièvre. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, traitement</a>.</p>
<p>La dose orale d’amoxicilline publiée par la SSI est nettement plus basse que celle de l’information professionnelle suisse, qui recommande 375 à 750 mg trois à quatre fois par jour et au moins dix jours pour une infection à streptocoque bêta-hémolytique. Ce <button class="w" data-k="a46-p-contentieux">contentieux de dose et de durée</button> est expliqué en fenêtre ; en l’absence de clarification, il reste un point à vérifier, signalé comme lacune nommée. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, traitement</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44911" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Amoxi-Mepha®, août 2024</a>.</p>
<div class="trap"><span class="k">Erreur fréquente.</span> Élargir le spectre parce que la rougeur persiste à 48 heures alors que la fièvre a disparu : la régression cutanée est lente.</div>
<button class="pareto-btn ui" data-k="pareto-a46-traitement">▲ Loi de Pareto — Traiter l’érysipèle</button></section>

<section class="ilot" id="a46-pa-10"><h2><span class="n">10</span>Récidive et prévention</h2>
<p>La prévention secondaire commence par les facteurs locaux : traiter l’intertrigo et la mycose, soigner les plaies, contrôler l’œdème par la contention. Une antibioprophylaxie est à envisager selon la SSI en cas de récidives fréquentes (3 à 4 épisodes par an ou plus) : amoxicilline orale ou benzathine-pénicilline G intramusculaire. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, traitement</a>.</p>
<p>Dans l’essai PATCH I, la pénicilline V 250 mg deux fois par jour pendant 12 mois réduisait la récidive de 37 % à 22 % (nombre de patients à traiter : 5), mais l’effet disparaissait à l’arrêt. <a href="https://doi.org/10.1056/NEJMoa1206300" target="_blank" rel="noopener" data-reference-source="1">Thomas KS et al., essai PATCH I, N Engl J Med 2013;368:1695</a>.</p>
<div class="key"><b>À retenir.</b> Prophylaxie efficace tant qu’elle dure : elle ne remplace pas le traitement du lymphœdème et de la porte d’entrée.</div></section>

<section class="ilot" id="a46-pa-11"><h2><span class="n">11</span>Situations particulières</h2>
<p><b>Grossesse.</b> L’information suisse de la benzylpénicilline autorise son emploi pendant la grossesse ; pour la clindamycine, elle demande de la réserver aux cas de nécessité absolue. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=56271" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Pénicilline «Grünenthal», mai 2023</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=35438" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Dalacin® C, juillet 2026</a>.</p>
<p><b>Enfant.</b> L’amoxicilline se dose à 50 à 100 mg/kg par jour en 3 à 4 prises jusqu’à 40 kg. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=44911" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Amoxi-Mepha®, août 2024</a>.</p>
<p><b>Immunosuppression, neutropénie, morsure.</b> Ce sont les situations où la SSI recommande des prélèvements microbiologiques (hémocultures, aspiration) ; le spectre doit alors être discuté avec l’infectiologue. <a href="https://ssi.guidelines.ch/guideline/3010/fr" target="_blank" rel="noopener" data-reference-source="1">SSI, « Infections non purulentes de la peau et des tissus mous », validée le 30 juin 2025, diagnostic</a>.</p>
<p><b>Cas récapitulatif.</b> M. R. ne présente aucun signal d’alarme. Il reçoit un traitement oral par bêtalactamine, la surélévation de la jambe, un traitement antifongique de l’intertrigo, et le bord de la plaque est marqué. Il est revu à 48 heures ; une contention veineuse est prévue après guérison.</p></section>

<section class="ilot" id="a46-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Durée standard (SSI)</td><td>5 jours, prolongée si pas d’amélioration</td></tr>
<tr><td>Prophylaxie à envisager</td><td>3 à 4 récidives par an ou plus</td></tr>
<tr><td>Facteur de risque majeur</td><td>Lymphœdème (rapport des cotes 71,2) ; effraction cutanée (23,8)</td></tr>
