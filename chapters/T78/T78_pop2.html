<template data-pop="pareto-t78-clin" data-title="Pareto — Définitions, mécanismes et clinique"><p class="ratio" data-cover="t78-0,t78-1,t78-2,t78-3,t78-4,t78-5,t78-6"></p><ul>
<li>Anaphylaxie = réaction systémique aiguë de type immédiat, potentiellement mortelle ; le plus souvent IgE-dépendante, parfois sans sensibilisation (MRGPRX2, complément).</li>
<li>Décès par obstruction des voies aériennes ou défaillance cardiovasculaire ; l’adrénaline s’oppose à tous les mécanismes.</li>
<li>Grades I à IV de la recommandation S2k ; la peau manque dans 10 à 20 % des cas, présentation fréquente des formes mortelles.</li>
<li>Registre germanophone : enfant, aliments 60 % ; adulte, venins 52 % et médicaments 22 % ; guêpe prédominante en Suisse.</li>
<li>Cofacteurs : effort, alcool, infection, stress, anti-inflammatoires ; gravité : asthme mal traité, cardiopathie, mastocytose, bêtabloquant (rapport de cotes 1,86), inhibiteur de l’enzyme de conversion.</li>
<li>Choc distributif et hypovolémique, avec dépression myocardique ; ischémie possible sur coronaires saines (syndrome de Kounis) ; jamais debout ; évolution biphasique chez 5 à 20 %, après 6 à 24 heures.</li>
<li>Europe : incidence de 1,5 à 7,9 pour 100 000 personnes-années ; décès favorisés par l’asthme mal contrôlé et l’adrénaline tardive.</li>
<li>Examen ABCDE ; une fréquence normale ou basse n’exclut pas le choc : la bradycardie est souvent tardive et précède l’arrêt.</li></ul></template>
<template data-pop="pareto-t78-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="t78-7"></p><ul>
<li>Diagnostic clinique, trois situations (S2k 2021, EAACI 2021) : peau + respiration ou chute tensionnelle ; deux systèmes après allergène probable ; chute tensionnelle après allergène connu, même sans peau.</li>
<li>Aucun examen ne retarde l’adrénaline.</li>
<li>Différentiels : syncope vasovagale, autres chocs, asthme isolé, angio-œdème bradykinique (pas d’urticaire, pas de réponse à l’adrénaline), panique, flush endocrinien, intoxication histaminique.</li></ul></template>
<template data-pop="pareto-t78-urg" data-title="Pareto — Traitement en urgence"><p class="ratio" data-cover="t78-8"></p><ul>
<li>Arrêter l’exposition, appeler, <b>adrénaline intramusculaire dans la cuisse</b> : adulte 0,5 mg, 6–12 ans 0,3 mg, 6 mois–6 ans 0,15 mg, répéter toutes les 5 minutes (information professionnelle suisse).</li>
<li>Position allongée jambes surélevées ; demi-assis si dyspnée ; latéral gauche si grossesse.</li>
<li>Oxygène à haute concentration, remplissage 500–1 000 mL (enfant 20 mL/kg), salbutamol, adrénaline nébulisée si œdème laryngé.</li>
<li>Antihistaminique et glucocorticoïde seulement après stabilisation.</li>
<li>Réfractaire après deux doses : adrénaline intraveineuse titrée par une équipe entraînée ; glucagon sous bêtabloquant (hors indication suisse).</li></ul></template>
<template data-pop="pareto-t78-crit" data-title="Pareto — Suivi, allergies et critères"><p class="ratio" data-cover="t78-9,t78-10,t78-11,t78-12,t78-13,t78-14"></p><ul>
<li>Surveillance 24 heures après une réaction sévère (S2k) ; 6–8 heures après une atteinte respiratoire et 12–24 heures après une hypotension (EAACI).</li>
<li>Sortie : auto-injecteurs (deux selon les informations professionnelles suisses), plan écrit, éviction, revue des bêtabloquants, allergologue, tests au plus tôt 4 semaines après.</li>
<li>Aliments : 14 allergènes à déclaration obligatoire en Suisse ; albumines 2S (Ara h 2) prédictives ; PR-10 détruites par la chaleur, protéines de transfert lipidique stables ; arachide et œuf cuit introduits entre 4 et 6 mois (Pédiatrie Suisse 2025).</li>
<li>Venins : immunothérapie efficace chez 91–96 % (vespidés) et 77–84 % (abeille), au moins 5 ans, prolongée si mastocytose.</li>
<li>Médicaments : plus de 90 % des étiquettes de pénicilline infirmées ; stratification en quatre groupes ; risque croisé selon la chaîne latérale R1 ; DRESS et nécrolyse : pas de provocation.</li>
<li>Critères : trois situations de la recommandation S2k ; tryptase aiguë &gt; 1,2 × base + 2 µg/L.</li></ul></template>
<template data-pop="pareto-t78-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="t78-e-1,t78-e-2,t78-e-3,t78-e-4,t78-e-5"></p><ul>
<li>Pendant la crise, seul prélèvement utile : tryptase à 30 minutes–2 heures ; valeur de base au moins 24 heures après ; seuil 1,2 × base + 2 µg/L ; une valeur normale n’exclut rien.</li>
<li>Prick-test lu à 15–20 minutes, positif si papule ≥ 3 mm ; arrêter les antihistaminiques de deuxième génération environ 7 jours avant.</li>
<li>IgE spécifiques = sensibilisation ; composants : albumines 2S, PR-10, protéines de transfert lipidique, venins, alpha-gal.</li>
<li>Test de provocation : établit la pertinence clinique ; exclu après DRESS ou nécrolyse ; test d’activation des basophiles en centre spécialisé.</li></ul></template>
<template data-pop="pareto-t78-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="t78-p-1,t78-p-2,t78-p-3"></p><ul>
<li>Adrénaline : aucune contre-indication absolue dans l’anaphylaxie ; 1 mg/mL non diluée en intramusculaire ; voie intraveineuse diluée, par des soignants expérimentés.</li>
<li>Auto-injecteurs suisses : 0,3 mg au-delà de 30 kg, 0,15 mg de 15 à 30 kg ; seconde injection après 5 à 15 minutes.</li>
<li>Clémastine 2 mg intraveineuse lente chez l’adulte, après l’adrénaline ; glucagon 1 mg intraveineux sous bêtabloquant, hors indication.</li>
<li>Bêtabloquants : antagonisent l’adrénaline ; tricycliques et inhibiteurs de la monoamine oxydase la renforcent ; pas de gélatines ni de dextrans comme remplissage.</li></ul></template>
