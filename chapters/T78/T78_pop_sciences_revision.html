<template data-pop="t78-science-reading" data-title="Tryptase : comparer l’épisode aigu et la valeur de base"><p>La tryptase aiguë et la tryptase de base répondent à deux questions. La première dit si les mastocytes se sont activés ; la seconde dit combien ils sont.</p><p>La tryptase s’élève de 15 minutes à 3 heures ou davantage après le début et culmine entre 1 et 2 heures (WAO 2020). Sa demi-vie d’environ 2 heures la ramène souvent à la normale en 6 à 8 heures (Resuscitation Council UK 2021). L’EAACI 2021 recommande donc un prélèvement 30 minutes à 2 heures après le début, puis une valeur de base au moins 24 heures après la résolution.</p><p>L’activation est significative si la valeur aiguë dépasse 1,2 × tryptase de base + 2 µg/L (EAACI 2021). Exemple : base 4 µg/L, seuil 6,8 µg/L ; une valeur aiguë de 9 µg/L confirme l’activation, bien qu’elle reste sous la norme du laboratoire. Une valeur normale n’exclut pas l’anaphylaxie : 36 à 40 % des valeurs aiguës restent inférieures à 11,4 µg/L (WAO 2020).</p><p>Une valeur de base durablement élevée oriente vers une mastocytose ou une alpha-tryptasémie héréditaire ; elle ne prouve pas une activation au moment du prélèvement (Valent, 2021).</p><div class="key"><b>À retenir.</b> Tryptase aiguë entre 30 minutes et 2 heures, tryptase de base au moins 24 heures après ; seuil 1,2 × base + 2 µg/L ; une valeur normale n’exclut rien.</div></template>
<template data-pop="pareto-t78-sciences-revision" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="t78-sh,t78-si,t78-sp,t78-sb,t78-sg"></p><ul><li>Mastocytes et basophiles portent FcεRI ; ils libèrent des médiateurs stockés (histamine, tryptase, héparine) et synthétisés (leucotriènes, prostaglandines, facteur d’activation plaquettaire).</li><li>Bêta-tryptase mature = activation ; protryptases = masse mastocytaire. Mastocytose : amas d’au moins 15 mastocytes, KIT D816V chez environ 90 % des adultes non avancés, tryptase de base &gt; 20 µg/L.</li><li>Voie des IgE : sensibilisation puis pontage. Voies sans IgE : MRGPRX2 (curares, fluoroquinolones), complément (C3a, C5a), IgG, opiacés ; possibles dès la première exposition.</li><li>Choc : vasodilatation, fuite capillaire, dépression myocardique ; bradycardie souvent tardive ; jamais debout.</li><li>Adrénaline : alpha (vasoconstriction, œdème), bêta-1 (inotropie), bêta-2 (bronches, mastocytes freinés). Glucagon : inotrope sans récepteur bêta, sous bêtabloquant.</li><li>Alpha-tryptasémie héréditaire : copies de TPSAB1, dominante, tryptase de base corrigée = valeur / (1 + copies supplémentaires). HLA-B*57:01 avant abacavir.</li></ul></template>
