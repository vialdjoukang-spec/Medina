<template data-pop="t78-science-reading" data-title="Tryptase : comparer l’épisode aigu et la valeur de base"><p>La tryptase contribue au bilan d’une activation mastocytaire. La valeur aiguë et la valeur basale répondent à des questions différentes. Le moment du prélèvement doit accompagner le résultat.</p><p>Une hausse soutient le mécanisme dans un tableau compatible. Une valeur normale n’exclut pas une anaphylaxie. Le traitement d’une urgence respiratoire ou circulatoire ne doit donc pas attendre le dosage.</p><p>Une valeur basale durablement élevée peut orienter une alpha-tryptasémie héréditaire, une maladie mastocytaire ou une autre situation. Elle ne prouve pas à elle seule une activation aiguë au moment du prélèvement.</p><p>Le bilan spécialisé relie l’exposition, la cinétique, les manifestations et les tests. Il organise ensuite la prévention sans transformer un chiffre isolé en cause certaine.</p><div class="key"><b>À retenir.</b> Le résultat répond à une question précise. Son interprétation exige les autres informations du patient.</div></template>
<template data-pop="pareto-t78-sciences-revision" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="t78-sh,t78-si,t78-sp,t78-sb,t78-sg">Les parties reliées ci-dessous expliquent les mécanismes essentiels à cette synthèse.</p><ul><li>Le mastocyte explique des manifestations rapides. Aucun signe cutané ni dosage isolé ne décrit toute l’anaphylaxie.</li><li>Un test positif peut montrer une sensibilisation. L’histoire clinique détermine ce qu’elle signifie pour le patient.</li><li>La circulation peut se dégrader rapidement. Comprendre le retour veineux évite un déplacement qui aggrave une instabilité.</li><li>Une cible pharmacologique explique un effet. Elle ne remplace ni le traitement initial approprié ni la réévaluation du patient.</li><li>La génétique regroupe plusieurs types d’information. Leur utilité dépend du mécanisme, du produit concerné et du contexte familial.</li></ul></template>
