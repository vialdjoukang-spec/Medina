<template data-pop="t78-hs" data-title="Hypersensibilité : allergique ou non">
<div class="lab">Description</div><p>Réaction décrite par sa chronologie (immédiate ou retardée), sa clinique et son mécanisme ; seul le bilan allergologique confirme le mécanisme (position germanophone 2025 sur les bêtalactamines).</p>
<div class="lab">Allergique</div><p>Mécanisme immunologique spécifique : IgE pour les réactions immédiates, lymphocytes T pour les réactions retardées, plus rarement anticorps cytotoxiques ou complexes immuns (position germanophone 2025 sur les bêtalactamines).</p>
<div class="lab">Non allergique</div><p>Libération de médiateurs indépendante des IgE, possiblement par le récepteur MRGPRX2, activation directe du complément, interaction avec le système kallicréine-kinine ou avec le métabolisme de l’acide arachidonique (S2k 2021). Aucune sensibilisation préalable n’est nécessaire.</p>
<div class="lab">Conséquence</div><p>Le mécanisme oriente les tests, le risque croisé et les possibilités de réintroduction ; le traitement immédiat d’une anaphylaxie reste le même.</p></template>
<template data-pop="t78-masto" data-title="Le mastocyte et ses médiateurs">
<p>Cellule tissulaire d’origine médullaire, dont le développement dépend du récepteur KIT. Elle porte le récepteur de haute affinité des IgE, FcεRI. Activés, les mastocytes et les basophiles libèrent histamine, prostaglandines, leucotriènes, tryptase, facteur d’activation plaquettaire, héparine, protéases, sérotonine et cytokines (S2k 2021). La tryptase sert de marqueur biologique de leur activation (EAACI 2021).</p></template>
<template data-pop="t78-sensib" data-title="Sensibilisation n’est pas allergie">
<p>La <b>sensibilisation</b> est la présence d’IgE spécifiques, révélée par un test cutané ou sanguin. L’<b>allergie</b> exige des symptômes reproductibles à l’exposition. Une sensibilisation découverte fortuitement, sans réaction clinique, n’est pas une indication d’immunothérapie aux venins (EAACI 2018) ; un aliment toléré ne doit pas être évité sur la seule foi d’un test positif. Le test de provocation tranche lorsqu’un doute persiste.</p></template>
<template data-pop="t78-mrg" data-title="Récepteur MRGPRX2">
<p>Récepteur couplé aux protéines G exprimé par les mastocytes. La recommandation S2k 2021 le cite comme voie possible de libération de médiateurs indépendante des IgE, et la WAO 2020 comme voie d’activation directe des mastocytes par certaines molécules. Ces réactions peuvent survenir dès la première exposition. La liste des molécules concernées n’a pas été relue dans une source primaire pour cette révision : lacune nommée.</p></template>
<template data-pop="t78-mastocyt" data-title="Mastocytose systémique : critères de consensus 2021">
<div class="lab">Critère majeur</div><p>Infiltrats multifocaux denses de mastocytes (au moins 15 mastocytes en amas) dans la moelle osseuse ou un autre organe extracutané.</p>
<div class="lab">Critères mineurs</div><p>(a) Au moins 25 % de mastocytes atypiques ou fusiformes ; (b) mutation activatrice de KIT au codon 816 ou dans une autre région critique ; (c) expression de CD2, CD25 ou CD30 par les mastocytes ; (d) tryptase de base &gt; 20 µg/L, à corriger en cas d’alpha-tryptasémie héréditaire.</p>
<div class="lab">Diagnostic</div><p>Un critère majeur et un mineur, ou trois critères mineurs (Valent et al., consensus 2021, publié par l’Association européenne d’hématologie).</p>
<div class="lab">Lien avec l’anaphylaxie</div><p>La mastocytose expose à des réactions sévères, notamment aux venins ; la tryptase s’élève nettement au-dessus de la valeur de base pendant une anaphylaxie. Une mastocytose doit être recherchée même lorsqu’un déclencheur est identifié, surtout après une piqûre (WAO 2020).</p></template>
<template data-pop="t78-hypot" data-title="Seuils d’hypotension dans l’anaphylaxie">
<p><b>EAACI 2021</b> — Adulte : systolique &lt; 90 mmHg ou baisse &gt; 30 % de la valeur habituelle. Enfant : 1 mois à 1 an &lt; 70 mmHg ; 1 à 10 ans &lt; 70 + (2 × âge) mmHg ; 11 à 17 ans &lt; 90 mmHg ; ou baisse &gt; 30 %.</p>
<p><b>Valeurs d’alarme de la recommandation S2k 2021</b>, indicatives : systolique &lt; 50 mmHg avant 1 an, &lt; 60 mmHg de 1 à 14 ans, &lt; 70 mmHg après 14 ans ; saturation &lt; 92 % à tout âge.</p></template>
<template data-pop="t78-tryp" data-title="Tryptase : quand et comment">
<p>Prélever <b>30 minutes à 2 heures</b> après le début (EAACI 2021), idéalement 1 à 3 heures selon la recommandation S2k, sans retarder le traitement ; un prélèvement plus tardif peut encore être élevé. Doser la <b>tryptase de base</b> au moins 24 heures après la résolution complète. Activation significative si la valeur aiguë dépasse 1,2 × tryptase de base + 2 µg/L. Une valeur de base élevée oriente vers une maladie mastocytaire ou une alpha-tryptasémie héréditaire. Une tryptase normale n’exclut pas l’anaphylaxie, en particulier chez l’enfant et dans les réactions alimentaires (EAACI 2021).</p></template>
<template data-pop="t78-crd" data-title="Diagnostic moléculaire (composants)">
<p>Dosage des IgE contre des protéines purifiées ou recombinantes d’une source allergénique. Les albumines 2S de stockage (Ara h 2, Cor a 14, Ana o 3) prédisent le mieux la pertinence clinique d’une sensibilisation aux arachides et aux fruits à coque (S2k 2021). Les protéines PR-10 sont détruites par la chaleur et la digestion, alors que les protéines de transfert lipidique y résistent (étude de Scheurer, 2004). Pour les venins, les composants aident à interpréter une double sensibilisation sans distinguer à eux seuls sensibilisation et allergie (EAACI 2018).</p></template>
<template data-pop="t78-penfast" data-title="Score PEN-FAST et position suisse">
<p>Le score PEN-FAST classe le risque d’allergie vraie à partir de quatre questions sur une allergie à la pénicilline rapportée : réaction récente, anaphylaxie ou angio-œdème, réaction cutanée sévère, traitement nécessaire. La position germanophone 2025, cosignée par la Société suisse d’allergologie et d’immunologie, reconnaît sa simplicité mais estime que sa sécurité doit être confirmée dans des études plus larges avant un usage général. Elle recommande une <b>stratification en quatre groupes</b> fondée sur l’anamnèse : risque faible de réaction légère, risque de réaction immédiate modérée, risque de réaction immédiate sévère, risque de réaction retardée sévère. Pour l’examen fédéral, la stratification suisse et germanophone prévaut.</p></template>
<template data-pop="t78-hla" data-title="HLA et toxidermies graves">
<p><b>HLA-B*15:02</b> : forte association entre ce variant et le syndrome de Stevens-Johnson ou la nécrolyse épidermique toxique sous carbamazépine chez les patients d’origine chinoise Han ou thaïlandaise ; dépistage recommandé avant traitement dans les populations à risque (information professionnelle suisse Tégrétol®). <b>HLA-A*31:01</b> : facteur de risque de nécrolyse, de DRESS et d’exanthème sous carbamazépine ; fréquence d’environ 6,7 % en Europe de l’Ouest ; examen recommandé avant traitement lorsque l’origine du patient suggère un risque (même source). <b>HLA-B*57:01</b> : dépistage obligatoire chez tout patient infecté par le VIH avant l’abacavir, quelle que soit son origine ; pas d’abacavir chez les porteurs sauf absence d’alternative (information professionnelle suisse Ziagen®). <b>HLA-B*58:01</b> : associé aux réactions graves à l’allopurinol, mais le génotypage n’a pas fait ses preuves comme outil de décision (information professionnelle suisse Allopur®). Un dépistage négatif ne remplace pas la surveillance clinique.</p></template>
<template data-pop="t78-d-adre" data-title="Adrénaline (épinéphrine)">
<div class="lab">Mécanisme</div><p>Agoniste alpha et bêta : vasoconstriction, baisse de la perméabilité vasculaire, bronchodilatation, réduction de l’œdème et effet inotrope positif ; elle s’oppose fonctionnellement à tous les mécanismes de l’anaphylaxie (S2k 2021).</p>
<div class="lab">Posologie</div><p>Solution à 1 mg/mL par voie intramusculaire, face antérolatérale de la cuisse : plus de 12 ans 0,5 mg ; 6–12 ans 0,3 mg ; 6 mois–6 ans 0,15 mg ; moins de 6 mois 0,01 mg/kg ; répéter toutes les 5 minutes si nécessaire (information professionnelle suisse Adrenalin Sintetica 1 mg/ml®).</p>
<div class="lab">Effets indésirables</div><p>Arythmies, élévation tensionnelle, ischémie myocardique, surtout par voie intraveineuse ; hyperglycémie, qui peut imposer d’adapter le traitement du diabète (information professionnelle suisse Epipen®).</p>
<div class="lab">Auto-injecteur</div><p>Injection intramusculaire dans la face antérolatérale de la cuisse, possible à travers les vêtements ; appeler le 144 en mentionnant « anaphylaxie », même si l’état s’améliore ; s’allonger jambes surélevées, ou s’asseoir en cas de gêne respiratoire ; seconde injection 5 à 15 minutes plus tard si l’effet est insuffisant ; deux dispositifs à porter sur soi (informations professionnelles suisses Jext®, Epipen®).</p></template>
<template data-pop="t78-d-gluc" data-title="Glucagon dans l’anaphylaxie">
<p>Le glucagon exerce un effet inotrope positif sans passer par les récepteurs bêta ; il n’agit que sur les symptômes cardiaques (S2k 2021). <b>Indication</b> : patient sous bêtabloquant qui ne répond pas à plusieurs doses d’adrénaline ou d’autres vasopresseurs (S2k 2021), après remplissage adéquat (Resuscitation Council UK 2021). <b>Dose</b> : adulte 1 mg intraveineux, à répéter ou suivi d’une perfusion de 1 à 2 mg/h ; enfant 20 à 30 µg/kg, maximum 1 mg, à répéter toutes les 5 minutes (Resuscitation Council UK 2021). <b>Surveiller</b> hyperglycémie, vomissements, hypokaliémie et hypocalcémie. En Suisse, l’information professionnelle de GlucaGen® ne mentionne que l’hypoglycémie sévère et l’inhibition de la motilité digestive : l’usage dans l’anaphylaxie est hors indication.</p></template>
<template data-pop="t78-d-antih" data-title="Antihistaminiques H1">
<p>Leur rôle dans l’urticaire aiguë et la rhinoconjonctivite est établi ; leur effet sur la circulation et la bronchoconstriction n’a pas été démontré (S2k 2021). Ils agissent plus lentement que l’adrénaline. <b>Clémastine</b> injectable : 2 mg par voie intraveineuse lente chez l’adulte, en traitement secondaire après l’adrénaline (information professionnelle suisse Tavegyl®). <b>Deuxième génération</b> par voie orale (cétirizine, lévocétirizine, fexofénadine, bilastine, desloratadine) : moins sédatives, non autorisées dans l’anaphylaxie ; la recommandation S2k admet jusqu’à quatre fois la dose unitaire. <b>Première génération</b> : sédation et effets anticholinergiques à forte dose.</p></template>
<template data-pop="t78-d-ita" data-title="Immunothérapie aux venins">
<div class="lab">Principe</div><p>Injections sous-cutanées d’extrait de venin à doses croissantes puis d’entretien ; seule mesure qui prévient de nouvelles réactions systémiques (EAACI 2018).</p>
<div class="lab">Schéma</div><p>Dose d’entretien de référence 100 µg de venin, plus efficace que 50 µg ; 200 µg après une réaction sous 100 µg. Intervalles proposés par consensus : 4 semaines la première année, 6 semaines la deuxième, 8 semaines de la troisième à la cinquième (EAACI 2018). Avec Alutard SQ® Venins d’insectes : dose d’entretien de 100 000 SQ-U, injections toutes les 4 à 8 semaines, traitement d’au moins 3 ans, surveillance d’au moins 30 minutes après chaque injection (information professionnelle suisse).</p>
<div class="lab">Efficacité</div><p>Protection de 91 à 96 % pour les vespidés et de 77 à 84 % pour l’abeille ; au moins 5 ans de traitement sont supérieurs à une durée plus courte (EAACI 2018).</p>
<div class="lab">Précautions</div><p>Pas de contre-indication liée à un bêtabloquant ou à une maladie cardiovasculaire ; prévention des piqûres pendant la phase de progression ; arrêt de l’apiculture jusqu’à la dose d’entretien (EAACI 2018).</p></template>
<template data-pop="t78-src-criteres" data-title="Critères diagnostiques : Suisse, Europe et WAO">
<div class="lab">Choix retenu pour l’examen fédéral</div><p>Les <b>trois situations de la recommandation S2k 2021</b>, cosignée par la Société suisse d’allergologie et d’immunologie. L’EAACI 2021 utilise trois critères équivalents, issus d’un consensus de 2006 dont la sensibilité est élevée.</p>
<div class="lab">Proposition de la WAO (2020)</div><p>Deux critères : (1) signes cutanéo-muqueux et au moins une atteinte respiratoire, circulatoire ou digestive sévère ; (2) hypotension, bronchospasme ou atteinte laryngée après exposition à un allergène connu ou hautement probable, même sans signe cutané. Elle simplifie les critères précédents et rend explicite l’anaphylaxie sans signe cutané.</p>
<div class="lab">Relation entre les sources</div><p>La proposition de la WAO est antérieure aux textes suisse et européen de 2021, qui ne l’ont pas adoptée. Les trois versions concordent sur l’essentiel : une hypotension ou une atteinte respiratoire brutale après exposition suffit, même sur une peau normale, et le traitement ne doit pas attendre la réunion formelle des critères.</p></template>
<template data-pop="t78-src-adre" data-title="Adrénaline : information professionnelle suisse et recommandations européennes">
<div class="lab">Dose intramusculaire retenue</div><p>Information professionnelle suisse : 0,5 mg au-delà de 12 ans, 0,3 mg de 6 à 12 ans, 0,15 mg de 6 mois à 6 ans, 0,01 mg/kg avant 6 mois, à répéter toutes les 5 minutes. La WAO 2020 retient 0,01 mg/kg, maximum 0,5 mg, à répéter toutes les 5 à 15 minutes ; la recommandation S2k admet 0,15 à 0,6 mg, à répéter toutes les 5 à 10 minutes.</p>
<div class="lab">Auto-injecteurs</div><p>Les informations professionnelles suisses fixent 0,3 mg au-delà de 30 kg et 0,15 mg de 15 à 30 kg ; de 7,5 à 15 kg, Epipen® Junior se discute au cas par cas, alors que Jext® n’est pas recommandé sous 15 kg hors danger de mort. L’EAACI 2021 propose 0,15 mg de 7,5 à 25–30 kg et 0,3 mg au-delà, et envisage 0,5 mg chez l’adulte en surpoids ou après une anaphylaxie menaçant la vie. Aucun auto-injecteur de 0,5 mg ne figure dans les informations professionnelles suisses consultées. <b>En Suisse, l’information professionnelle prime.</b></p>
<div class="lab">Nombre de dispositifs</div><p>Les informations professionnelles suisses recommandent deux auto-injecteurs, comme l’Agence européenne des médicaments citée par l’EAACI. La recommandation S2k réserve le second dispositif à des situations précises (anaphylaxie très sévère, poids supérieur à 100 kg, asthme non contrôlé, soins éloignés, mastocytose après anaphylaxie, crèche ou école).</p></template>
<template data-pop="t78-src-ahgc" data-title="Traitements associés : Suisse et Europe">
<div class="lab">Position suisse (recommandation S2k 2021)</div><p>Antihistaminique H1 dans toute anaphylaxie, <b>après stabilisation des fonctions vitales</b> ; glucocorticoïde après stabilisation, à forte dose (équivalent prednisolone 250 à 1 000 mg chez l’adulte) ; remplissage de 500 à 1 000 mL en 5 minutes chez l’adulte, 20 mL/kg chez l’enfant.</p>
<div class="lab">EAACI 2021 et Resuscitation Council UK 2021</div><p>Antihistaminiques réservés aux signes cutanés ; glucocorticoïdes non recommandés en routine, preuves limitées et effet possiblement délétère chez l’enfant (EAACI), réservés à l’asthme mal contrôlé ou à l’anaphylaxie réfractaire (Resuscitation Council UK). Remplissage de 500 mL chez l’adulte et de 10 mL/kg chez l’enfant (maximum 500 mL par bolus), répété (EAACI).</p>
<div class="lab">Point commun</div><p>Toutes ces sources placent l’adrénaline intramusculaire en premier et interdisent de la retarder. La divergence porte sur la place des traitements secondaires ; pour l’examen fédéral, la position cosignée par la société suisse s’applique.</p></template>
<template data-pop="t78-src-obs" data-title="Durée de surveillance après une anaphylaxie">
<div class="lab">Recommandation S2k 2021</div><p>Hospitalisation et surveillance de 24 heures après une réaction sévère, par exemple ayant nécessité un auto-injecteur, en raison du risque de réaction biphasique.</p>
<div class="lab">EAACI 2021</div><p>6 à 8 heures après une atteinte respiratoire ; au moins 12 à 24 heures après une hypotension ; prolongation selon les facteurs du patient et de la réaction.</p>
<div class="lab">Application</div><p>Les deux textes datent de 2021 ; la WAO 2020 constate l’absence de consensus sur cette durée. En Suisse, la surveillance de 24 heures des réactions sévères (S2k) est retenue ; les durées européennes servent à moduler la surveillance des réactions moins graves.</p></template>
<template data-pop="t78-src-trousse" data-title="Trousse d’urgence prescrite en Suisse">
<p>La recommandation S2k 2021, cosignée par la Société suisse d’allergologie et d’immunologie, décrit la pratique germanophone : un auto-injecteur d’adrénaline adapté au poids, un antihistaminique H1 par voie orale (jusqu’à quatre fois la dose unitaire), un glucocorticoïde de 50 à 100 mg d’équivalent prednisolone par voie orale ou rectale et, en cas d’asthme ou de bronchospasme antérieur, un bêta-2 agoniste inhalé. Un passeport d’anaphylaxie accompagne la trousse. L’EAACI 2021 ne retient que l’auto-injecteur et un plan écrit. Dans les deux cas, l’adrénaline est le premier geste, et le patient appelle le 144.</p></template>
<template data-pop="t78-d-saba" data-title="Salbutamol dans l’anaphylaxie">
<p>Le salbutamol stimule sélectivement les récepteurs bêta-2 des muscles bronchiques : par inhalation, la bronchodilatation survient en 5 minutes et dure environ 4 heures (information professionnelle suisse Ventolin®). Dose en aérosol doseur pour un bronchospasme aigu : 1 à 2 inhalations dès 12 ans, 1 inhalation de 4 à 12 ans, avec une chambre d’inhalation chez le jeune enfant. La recommandation S2k 2021 le donne en complément de l’adrénaline lorsque l’obstruction bronchique domine, 2 bouffées puis 4 à 8 si l’effet est insuffisant. Il ne corrige ni le choc ni l’œdème laryngé.</p></template>
<template data-pop="t78-d-gc" data-title="Glucocorticoïdes dans l’anaphylaxie">
<p>Leur début d’action est lent ; aucune étude systématique n’a démontré leur effet dans l’anaphylaxie, mais ils sont efficaces dans l’asthme (S2k 2021). La recommandation S2k les administre après stabilisation des fonctions vitales, à forte dose (équivalent prednisolone 250 mg de 30 à 60 kg, 500 à 1 000 mg au-delà de 60 kg), ou par voie orale ou rectale (2 mg/kg) chez le petit enfant sans voie veineuse. L’EAACI 2021 juge les preuves limitées et les estime possiblement délétères chez l’enfant. L’information professionnelle suisse de Solu-Medrol® rappelle que l’adrénaline est le premier choix dans l’œdème laryngé.</p></template>
<template data-pop="t78-d-omali" data-title="Omalizumab">
<p>Anticorps anti-IgE. En Suisse, ses indications sont l’asthme allergique persistant sévère dès 6 ans, les polypes nasaux de l’adulte et l’urticaire chronique spontanée dès 12 ans (information professionnelle suisse Xolair®) ; l’allergie alimentaire n’y figure pas. La recommandation S2k 2021 évoque un traitement de fond par anti-IgE en cas de réactions récidivantes ; l’omalizumab gêne les tests cutanés pendant plus de 4 semaines (standards européens, 2013).</p></template>
