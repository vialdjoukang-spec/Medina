<section class="ilot" id="t78-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 56 ans, traité par bisoprolol pour une hypertension, est piqué par une guêpe en taillant sa haie. Dix minutes plus tard, il ressent un prurit généralisé, des vertiges et une oppression thoracique. À l’arrivée de l’ambulance, il est pâle, couvert de plaques d’urticaire ; sa pression artérielle est de 78/40 mmHg, sa fréquence cardiaque de 62/min, sa saturation de 92 %. Quatre questions structurent le cours : <b>s’agit-il d’une anaphylaxie, quel geste sauve la vie dans la minute, pourquoi la réponse peut-elle être incomplète chez ce patient, et comment éviter qu’une nouvelle piqûre ne le tue ?</b></p>
<p>À la fin du cours, le médecin assistant reconnaît une anaphylaxie selon les critères cliniques retenus en Suisse, y compris sans atteinte cutanée ; il injecte l’adrénaline par voie intramusculaire à la dose de l’information professionnelle suisse ; il conduit la prise en charge d’une forme réfractaire ; il prélève la tryptase au bon moment ; il organise la sortie avec auto-injecteurs, plan d’urgence et adressage allergologique ; il sait enfin que l’immunothérapie aux venins protège la grande majorité des patients piqués par une guêpe.</p>
<div class="key"><b>Message fondateur.</b> L’anaphylaxie tue par <b>obstruction des voies aériennes</b> et par <b>défaillance cardiovasculaire</b>, directe ou secondaire au choc (recommandation S2k 2021). L’<button class="w" data-k="t78-d-adre">adrénaline par voie intramusculaire (mécanismes, dose, sécurité)</button> s’oppose fonctionnellement à tous ces mécanismes : vasoconstriction, baisse de la perméabilité vasculaire, bronchodilatation, réduction de l’œdème et effet inotrope positif. Les antihistaminiques n’ont pas démontré d’effet sur la circulation ni sur la bronchoconstriction ; les glucocorticoïdes agissent trop lentement. Ni les uns ni les autres ne doivent retarder l’adrénaline.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="t78-hs">hypersensibilité et ses mécanismes (allergique ou non)</button>, le <button class="w" data-k="t78-masto">mastocyte et ses médiateurs</button> et la <button class="w" data-k="t78-sensib">différence entre sensibilisation et allergie</button>. L’onglet Sciences fondamentales développe ces notions.</div>
</section>

<section class="ilot" id="t78-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<h3>1.1 Hypersensibilité, allergie, anaphylaxie</h3>
<p>L’<b>hypersensibilité</b> désigne des symptômes reproductibles déclenchés par une exposition à une dose tolérée par les sujets normaux. Elle est <b>allergique</b> lorsqu’un mécanisme immunologique spécifique intervient (anticorps IgE, lymphocytes T), <b>non allergique</b> dans le cas contraire. La distinction oriente les tests, le risque de réaction croisée et la possibilité de réintroduire le produit.</p>
<p>L’<b>anaphylaxie</b> est une réaction systémique aiguë de type immédiat, qui peut toucher tout l’organisme et devenir mortelle (S2k 2021). La World Allergy Organization la définit comme une réaction d’hypersensibilité systémique grave, habituellement rapide, potentiellement mortelle ; sa forme sévère compromet les voies aériennes, la respiration ou la circulation, et peut survenir <b>sans signe cutané ni choc</b> (WAO 2020). Le mécanisme est le plus souvent IgE-dépendant ; certaines anaphylaxies surviennent sans sensibilisation détectable, par activation directe des mastocytes ou du complément (S2k 2021). La présentation et le traitement immédiat sont les mêmes.</p>
<h3>1.2 Mécanisme et chronologie des réactions</h3>
<p>La classification de Coombs et Gell distingue quatre mécanismes. Le délai entre l’exposition et les symptômes permet d’en suspecter un, sans le prouver : seul le bilan allergologique le confirme (position germanophone 2025 sur les bêtalactamines, cosignée par la Société suisse d’allergologie et d’immunologie).</p>
<table class="t"><tr><th>Type</th><th>Mécanisme</th><th>Délai habituel</th><th>Exemples</th></tr>
<tr><td><b>I — immédiat</b></td><td>IgE fixées sur mastocytes et basophiles</td><td>Minutes, en général moins d’une heure, rarement jusqu’à 6 heures</td><td>Urticaire, angio-œdème, anaphylaxie</td></tr>
<tr><td>II — cytotoxique</td><td>Anticorps contre des antigènes cellulaires</td><td>Réactions très rares</td><td>Anémie hémolytique, cytopénies médicamenteuses</td></tr>
<tr><td>III — complexes immuns</td><td>Complexes antigène-anticorps</td><td>Réactions très rares</td><td>Vascularite médicamenteuse</td></tr>
<tr><td><b>IV — retardé</b></td><td>Lymphocytes T</td><td>Plus de 6 heures à quelques jours ; 4 à 14 jours sans sensibilisation préalable ; jusqu’à 4 à 8 semaines pour les formes sévères</td><td>Exanthème maculopapuleux, DRESS, syndrome de Stevens-Johnson, nécrolyse épidermique toxique</td></tr></table>
<p>Ce tableau oppose surtout deux familles. Une réaction <b>immédiate</b> évoque un mécanisme IgE et un risque d’anaphylaxie à la réexposition. Une réaction <b>retardée</b> évoque un mécanisme lymphocytaire ; ses formes sévères interdisent toute réexposition.</p>
<h3>1.3 Grades de sévérité</h3>
<p>La recommandation S2k 2021, élaborée avec la Société suisse d’allergologie et d’immunologie, utilise une classification en quatre grades, modifiée de Ring et Messmer. Le grade est celui du signe le plus grave ; aucun signe n’est obligatoire.</p>
<table class="t"><tr><th>Grade</th><th>Peau et signes généraux</th><th>Abdomen</th><th>Voies respiratoires</th><th>Cœur et circulation</th></tr>
<tr><td>I</td><td>Prurit, flush, urticaire, angio-œdème</td><td>—</td><td>—</td><td>—</td></tr>
<tr><td>II</td><td>Idem</td><td>Nausées, crampes, vomissements</td><td>Rhinorrhée, raucité, dyspnée</td><td>Tachycardie (hausse ≥ 20/min), hypotension (baisse systolique de 20 mmHg), arythmie</td></tr>
<tr><td>III</td><td>Idem</td><td>Vomissements, défécation</td><td>Œdème laryngé, bronchospasme, cyanose</td><td>Choc</td></tr>
<tr><td>IV</td><td>Idem</td><td>Idem</td><td>Arrêt respiratoire</td><td>Arrêt circulatoire</td></tr></table>
<p>Le grade décrit la gravité observée ; il ne prédit pas l’évolution. Une réaction de grade I peut progresser en quelques minutes ou s’arrêter spontanément (S2k 2021).</p>
</section>

<section class="ilot" id="t78-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les publications récentes estiment l’incidence mondiale de l’anaphylaxie entre <b>50 et 112 épisodes pour 100 000 personnes-années</b> et sa prévalence sur la vie entre <b>0,3 et 5,1 %</b> ; les écarts tiennent aux définitions et aux méthodes (WAO 2020). Les hospitalisations augmentent, surtout pour les causes alimentaires chez l’enfant et médicamenteuses chez l’adulte, alors que la mortalité reste stable : environ <b>1 à 3 décès par million d’habitants et par an</b> (S2k 2021). Une récidive survient chez <b>26,5 à 54 %</b> des patients suivis de 1,5 à 25 ans (WAO 2020).</p>
<p>Le registre germanophone de l’anaphylaxie, alimenté par des centres d’Allemagne, d’Autriche et de Suisse, décrit les déclencheurs des réactions sévères. Le tableau compare l’enfant et l’adulte.</p>
<table class="t"><tr><th>Déclencheur</th><th>Enfants</th><th>Adultes</th></tr>
<tr><td>Aliments</td><td><b>60 %</b></td><td>16 %</td></tr>
<tr><td>Venins d’insectes</td><td>22 %</td><td><b>52 %</b></td></tr>
<tr><td>Médicaments</td><td>7 %</td><td>22 %</td></tr>
<tr><td>Autres</td><td>5 %</td><td>3 %</td></tr>
<tr><td>Inconnu</td><td>7 %</td><td>6 %</td></tr></table>
<p>Ces données (registre de mars 2017, 8 046 cas, S2k 2021) placent les aliments au premier rang chez l’enfant, les venins puis les médicaments chez l’adulte. En Europe centrale, dont la Suisse, la <b>guêpe</b> est l’insecte le plus souvent en cause (WAO 2020). Chez l’enfant, les garçons sont plus souvent touchés, différence qui disparaît après la puberté (S2k 2021).</p>
</section>

<section class="ilot" id="t78-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Sensibilisation</h3>
<p>Lors d’un premier contact, sans symptôme, l’allergène oriente une réponse lymphocytaire de type 2 qui conduit les lymphocytes B à produire des <b>IgE spécifiques</b>. Ces IgE se fixent sur le récepteur de haute affinité FcεRI des <button class="w" data-k="t78-masto">mastocytes</button> et des basophiles. Le sujet est alors <b>sensibilisé</b>. La sensibilisation n’est pas l’allergie : seuls des symptômes à l’exposition définissent l’allergie.</p>
<h3>3.2 Déclenchement</h3>
<p>Lors d’une nouvelle exposition, l’allergène relie deux IgE voisines à la surface du mastocyte (pontage). Les mastocytes et les basophiles activés libèrent histamine, prostaglandines, leucotriènes, tryptase, facteur d’activation plaquettaire, héparine, protéases, sérotonine et cytokines (S2k 2021). L’importance relative de chaque médiateur chez l’homme reste discutée ; le rôle de l’histamine est établi, car son injection intraveineuse reproduit des symptômes anaphylactiques chez le volontaire sain.</p>
<h3>3.3 Des médiateurs aux symptômes</h3>
<p>La vasodilatation et l’augmentation de la perméabilité déplacent du liquide vers les tissus. Il en résulte une hémoconcentration, une hypovolémie intravasculaire, puis une hypotension et une tachycardie ; arythmie ou bradycardie peuvent aussi survenir (S2k 2021). Dans les voies aériennes, l’œdème laryngé peut obstruer rapidement le passage de l’air, et la bronchoconstriction domine chez l’enfant et l’adolescent, d’autant plus que l’asthme est sévère.</p>

<h3>3.4 Réactions non allergiques</h3>
<p>Certaines anaphylaxies surviennent sans sensibilisation immunologique détectable. Leurs mécanismes comprennent une libération de médiateurs indépendante des IgE, possiblement par le récepteur <button class="w" data-k="t78-mrg">MRGPRX2</button>, l’activation directe du complément, une interaction avec le système kallicréine-kinine ou avec le métabolisme de l’acide arachidonique (S2k 2021). Ces réactions peuvent survenir dès la première exposition, puisqu’elles ne demandent pas de sensibilisation.</p>
<h3>3.5 Évolution prolongée ou biphasique</h3>
<p>Après un traitement efficace, <b>5 à 20 %</b> des patients présentent une évolution prolongée ou biphasique, avec une récidive des symptômes <b>6 à 24 heures</b> plus tard (S2k 2021). Environ la moitié des réactions biphasiques surviennent dans les 6 à 12 premières heures (WAO 2020). L’adrénaline précoce semble réduire ce risque (EAACI 2021). Cette évolution justifie la surveillance après la crise.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> La fuite plasmatique et la vasodilatation réduisent le retour veineux. Le patient hypotendu est donc allongé ; se lever ou marcher peut provoquer un collapsus brutal (S2k 2021). Le remplissage compense la composante hypovolémique, l’adrénaline la composante vasoplégique et bronchique. Le bêtabloquant bloque les effets cardiostimulants et stabilisateurs des mastocytes de l’adrénaline ; l’inhibiteur de l’enzyme de conversion réduit la dégradation de la bradykinine et majore la vasodilatation (S2k 2021). Chez ce patient, la fréquence de 62/min avec une systolique de 78 mmHg est un signe de gravité, non un signe rassurant.</div>
</section>

<section class="ilot" id="t78-4"><h2><span class="n">4</span>Déclencheurs, cofacteurs et facteurs de gravité</h2>
<h3>4.1 Déclencheurs</h3>
<table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Particularités</th></tr>
<tr><td><b>Aliments</b></td><td>Enfant : arachide, noisette, lait, œuf ; adulte : blé, céleri, crustacés ; pêche dans le sud de l’Europe (EAACI 2021)</td><td>Délai habituel court ; réaction retardée de plusieurs heures dans l’allergie à l’alpha-gal (viande de mammifère)</td></tr>
<tr><td><b>Venins d’hyménoptères</b></td><td>Guêpe, abeille</td><td>Guêpe prédominante en Suisse ; apiculteurs exposés à l’abeille</td></tr>
<tr><td><b>Médicaments</b></td><td>Antibiotiques (surtout bêtalactamines), anti-inflammatoires non stéroïdiens (EAACI 2021) ; chlorhexidine, polyéthylène glycol, biologiques (WAO 2020)</td><td>Réaction rapide par voie parentérale, parfois retardée par voie entérale (S2k 2021)</td></tr>
<tr><td>Autres</td><td>Latex, liquide séminal, produits de contraste, colorants, médicaments de l’anesthésie (WAO 2020)</td><td>Anaphylaxie périopératoire : voir § 12</td></tr>
<tr><td>Idiopathique</td><td>Aucun déclencheur identifié</td><td>Rechercher une <button class="w" data-k="t78-mastocyt">maladie mastocytaire</button> et des allergènes cachés comme l’alpha-gal ou des excipients (EAACI 2021)</td></tr></table>
<h3>4.2 Cofacteurs</h3>
<p>Un cofacteur abaisse le seuil de réaction ou aggrave la réaction. La recommandation S2k cite l’effort physique, l’alcool, le stress, l’infection, l’exposition simultanée à d’autres allergènes et les médicaments ; la WAO ajoute le manque de sommeil et la période prémenstruelle. Les anti-inflammatoires non stéroïdiens augmentent la production de leucotriènes et facilitent l’absorption des allergènes ingérés (S2k 2021). Exemple : l’anaphylaxie alimentaire induite par l’effort, le plus souvent due au blé ou à des variétés proches comme l’épeautre.</p>
<h3>4.3 Facteurs de gravité</h3>
<div class="two">
<div class="card"><h4>Liés au patient</h4><p>Âge avancé, <b>maladie cardiovasculaire sévère</b>, <b>asthme mal traité</b> (facteur majeur dans l’anaphylaxie alimentaire), <b>mastocytose</b> ou tryptase de base élevée (S2k 2021) ; comportements à risque de l’adolescent (WAO 2020).</p></div>
<div class="card"><h4>Liés au traitement et au déclencheur</h4><p><b>Bêtabloquants</b> : risque d’anaphylaxie sévère augmenté (rapport de cotes 1,86 dans le registre européen) ; inhibiteurs de l’enzyme de conversion ; allergènes puissants comme l’arachide ou le poisson (S2k 2021). Position debout et marche pendant la réaction (S2k 2021).</p></div></div>
</section>

<section class="ilot" id="t78-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>En urgence, l’anamnèse se limite à l’essentiel, selon la démarche structurée de la recommandation S2k : allergies connues et déclencheurs possibles, médicaments, antécédents, dernier repas, circonstances. Après la stabilisation, une anamnèse détaillée guide tout le bilan allergologique.</p>
<h3>5.1 Ce qu’il faut documenter</h3>
<ul>
<li>Tout ce qui a été ingéré, injecté, piqué ou touché avant la réaction, avec les quantités, les marques et les ingrédients ; conserver si possible le déclencheur (S2k 2021).</li>
<li><b>Délai</b> entre exposition et premiers symptômes ; ordre d’apparition des signes.</li>
<li><b>Cofacteurs</b> : effort, anti-inflammatoires, alcool, infection, stress.</li>
<li>Symptômes par organe, constantes mesurées par les secours, heure de l’adrénaline et réponse.</li>
<li>Réactions antérieures et tolérance ultérieure du même produit.</li>
<li>Terrain : asthme, maladie cardiovasculaire, mastocytose, bêtabloquant, inhibiteur de l’enzyme de conversion.</li></ul>
<h3>5.2 Symptômes</h3>
<p>Les signes cutanéo-muqueux sont les plus fréquents (plus de 90 % des cas), suivis des signes respiratoires et cardiovasculaires (plus de 50 %) (EAACI 2021). Les <b>prodromes</b> comprennent un prurit ou une brûlure des paumes, des plantes ou de la région anogénitale, un goût métallique, une anxiété, des céphalées ; le jeune enfant exprime plutôt agitation et repli (S2k 2021). L’atteinte laryngée se traduit par une voix étouffée, une dysphagie, une hypersialorrhée ou un stridor inspiratoire ; l’atteinte bronchique par des sibilants et une expiration prolongée. Les signes digestifs comprennent crampes, nausées, vomissements, diarrhée, besoin impérieux d’uriner ou de déféquer et contractions utérines. Chez l’enfant, des signes buccaux discrets avec vomissements peuvent être les seuls signes d’une anaphylaxie alimentaire (S2k 2021).</p>
<div class="trap"><span class="k">Piège</span>Les signes cutanés manquent dans <b>10 à 20 %</b> des anaphylaxies, et cette présentation est fréquente dans les formes mortelles (WAO 2020). Une réaction cardiovasculaire primaire peut survenir sans signe cutané ou respiratoire préalable (S2k 2021). Une hypotension ou un bronchospasme brutal après une exposition connue suffit donc à évoquer le diagnostic, même sur une peau normale.</div>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme cardiovasculaire</h4><p>Choc, parfois sans signe cutané ; arythmie ou bradycardie possibles (S2k 2021).</p></div>
<div class="card"><h4>Forme respiratoire</h4><p>Bronchoconstriction au premier plan, surtout chez l’enfant asthmatique ; la sévérité de l’asthme est corrélée à celle de l’anaphylaxie (S2k 2021).</p></div>
<div class="card"><h4>Forme retardée</h4><p>Allergie à l’alpha-gal : symptômes plusieurs heures après un repas de viande de mammifère (S2k 2021).</p></div>
<div class="card"><h4>Forme périopératoire</h4><p>Le patient ne peut signaler prurit ni nausées : hypotension ou tachycardie inattendues, érythème parfois débutant au bras perfusé, baisse du débit expiratoire, désaturation (S2k 2021).</p></div></div>
</section>

<section class="ilot" id="t78-6"><h2><span class="n">6</span>Examen clinique et gravité</h2>
<p>L’examen suit l’approche <b>ABCDE</b> (voies aériennes, respiration, circulation, état neurologique, exposition de la peau). Elle hiérarchise les menaces vitales et impose de traiter d’abord le symptôme le plus menaçant (S2k 2021).</p>
<table class="t"><tr><th>Étape</th><th>Signes recherchés</th><th>Signification</th></tr>
<tr><td><b>A — voies aériennes</b></td><td>Voix étouffée, langue ou luette tuméfiée, stridor, hypersialorrhée</td><td>Obstruction haute : risque d’hypoxie rapide</td></tr>
<tr><td><b>B — respiration</b></td><td>Dyspnée, stridor, sibilants, saturation</td><td>Bronchospasme, hypoxémie</td></tr>
<tr><td><b>C — circulation</b></td><td>Temps de recoloration (front ou sternum), pouls, pression artérielle</td><td>Choc ; <button class="w" data-k="t78-hypot">seuils d’hypotension selon l’âge</button></td></tr>
<tr><td><b>D — neurologie</b></td><td>Conscience, glycémie</td><td>Hypoperfusion cérébrale ou hypoxie</td></tr>
<tr><td><b>E — exposition</b></td><td>Peau et muqueuses visibles ; nausées, céphalées, oppression thoracique</td><td>Confirme le tableau et parfois la cause</td></tr></table>
<p>La recommandation S2k fixe des valeurs d’alarme indicatives, à répéter au cours du traitement. Chez l’adulte et l’adolescent de plus de 14 ans, il s’agit d’une fréquence cardiaque supérieure à 110/min, d’une systolique inférieure à 70 mmHg, d’une fréquence respiratoire supérieure à 25/min et d’une saturation inférieure à 92 %. Ces seuils ne reposent pas sur des études cliniques ; ils servent d’alerte, non de critère diagnostique.</p>
<div class="trap"><span class="k">Piège</span>La tachycardie est habituelle, mais une <b>fréquence normale ou basse</b> n’exclut pas le choc : bradycardie possible au cours de l’anaphylaxie et effet d’un bêtabloquant (S2k 2021). L’agitation ou la confusion traduisent d’abord une hypoperfusion ou une hypoxie, non une anxiété.</div>
