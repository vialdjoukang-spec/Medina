<section class="ilot" id="t78-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 56 ans, traité par bisoprolol pour une hypertension, est piqué par une guêpe en taillant sa haie dans le jardin. Dix minutes plus tard, il ressent un prurit généralisé, des vertiges et une oppression thoracique. À l’arrivée de l’ambulance, il est pâle, couvert de plaques d’urticaire, sa pression artérielle est de 78/40 mmHg, sa fréquence cardiaque de 62/min, sa saturation de 92 %. La question qui structure tout le chapitre est la suivante : <b>s’agit-il d’une anaphylaxie, quel geste sauve la vie dans la minute, pourquoi la réponse peut-elle être incomplète chez ce patient, et que faire ensuite pour qu’une nouvelle piqûre ne le tue pas ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître une anaphylaxie selon les critères de la World Allergy Organization (WAO), y compris sans atteinte cutanée ; administrer sans délai l’adrénaline par voie intramusculaire à la bonne dose ; conduire la réanimation d’une anaphylaxie réfractaire ; prélever la tryptase au bon moment ; organiser la sortie avec deux auto-injecteurs et un plan d’urgence ; et orienter le patient vers le bilan allergologique, qui distingue une allergie vraie d’une réaction non allergique et ouvre, pour les venins, la voie d’une immunothérapie efficace à plus de 90 %.</p>
<div class="key"><b>Message fondateur.</b> L’anaphylaxie tue par <b>obstruction des voies aériennes</b>, par <b>bronchospasme</b> ou par <b>collapsus cardiovasculaire</b>, parfois en quelques minutes. Le seul traitement qui agit sur ces trois mécanismes à la fois est l’<button class="w" data-k="t78-d-adre">adrénaline par voie intramusculaire (mécanismes, dose, sécurité)</button>. Les antihistaminiques et les corticostéroïdes n’agissent sur aucun des trois dans les délais utiles : ils ne remplacent jamais l’adrénaline et ne doivent jamais la retarder. Le retard à l’adrénaline est le principal facteur associé aux décès.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="t78-hs">hypersensibilité et ses mécanismes (allergique ou non)</button>, le <button class="w" data-k="t78-masto">mastocyte et ses médiateurs</button> et la <button class="w" data-k="t78-sensib">différence entre sensibilisation et allergie</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="t78-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<h3>1.1 Hypersensibilité, allergie, anaphylaxie</h3>
<p>L’<b>hypersensibilité</b> désigne tout symptôme reproductible déclenché par une exposition à un stimulus défini, à une dose tolérée par les sujets normaux. Elle est <b>allergique</b> lorsqu’un mécanisme immunologique spécifique est démontré ou fortement suspecté (anticorps IgE, lymphocytes T), <b>non allergique</b> dans le cas contraire (activation directe des mastocytes, inhibition enzymatique). La distinction n’est pas académique : elle détermine les tests à pratiquer, le risque de réaction croisée et la possibilité de réintroduire le produit.</p>
<p>L’<b>anaphylaxie</b> est une <b>réaction d’hypersensibilité systémique grave, d’installation habituellement rapide, potentiellement mortelle</b>, caractérisée par des atteintes des voies aériennes, de la respiration ou de la circulation, le plus souvent associées à des signes cutanéo-muqueux. Elle peut être allergique (médiée par les IgE dans la grande majorité des cas) ou non allergique. L’ancien terme de « réaction anaphylactoïde » est abandonné : on parle d’anaphylaxie quel qu’en soit le mécanisme, car la présentation et le traitement sont identiques.</p>
<p>Exemple : un patient qui fait une urticaire généralisée, un stridor et une hypotension une minute après l’injection d’un produit de contraste iodé fait une anaphylaxie. Le mécanisme peut être allergique (IgE spécifiques) ou non allergique (activation directe des mastocytes) : on ne le saura qu’au bilan, et le traitement immédiat est le même.</p>
<h3>1.2 Classification de Gell et Coombs, élargie</h3>
<table class="t"><tr><th>Type</th><th>Mécanisme</th><th>Délai</th><th>Exemples</th></tr>
<tr><td><b>I — immédiat</b></td><td>IgE fixées sur mastocytes et basophiles ; dégranulation</td><td>Minutes à 1–2 heures</td><td>Anaphylaxie, urticaire aiguë, asthme allergique, rhinite</td></tr>
<tr><td>II — cytotoxique</td><td>IgG ou IgM contre des antigènes de surface</td><td>Heures à jours</td><td>Anémie hémolytique ou thrombopénie médicamenteuse</td></tr>
<tr><td>III — complexes immuns</td><td>Dépôts de complexes antigène-anticorps, complément</td><td>1 à 3 semaines</td><td>Maladie sérique, vascularite médicamenteuse</td></tr>
<tr><td><b>IV — retardé</b></td><td>Lymphocytes T (sous-types a à d selon la cellule effectrice)</td><td>24 heures à plusieurs semaines</td><td>Eczéma de contact, exanthème maculopapuleux, DRESS, syndrome de Stevens-Johnson</td></tr></table>
<p>L’EAACI a proposé en 2023 une nomenclature élargie qui ajoute notamment les réactions liées aux cellules épithéliales et à l’activation directe des cellules effectrices ; en pratique clinique, la distinction <b>immédiate (moins d’une heure, souvent IgE)</b> versus <b>retardée (plus d’une heure, souvent lymphocytaire)</b> reste la plus utile, car elle oriente les tests et le risque.</p>
<h3>1.3 Grades de sévérité (Ring et Messmer)</h3>
<p>La recommandation germanophone S2k 2021, rédigée avec la Société suisse d’allergologie et d’immunologie, utilise la classification de Ring et Messmer, largement employée en Suisse :</p>
<table class="t"><tr><th>Grade</th><th>Peau et état général</th><th>Abdomen</th><th>Voies respiratoires</th><th>Cœur et circulation</th></tr>
<tr><td>I</td><td>Prurit, flush, urticaire, angio-œdème</td><td>—</td><td>—</td><td>—</td></tr>
<tr><td>II</td><td>Idem</td><td>Nausées, crampes, vomissements</td><td>Rhinorrhée, raucité, dyspnée</td><td>Tachycardie (augmentation ≥ 20/min), hypotension (baisse ≥ 20 mmHg), arythmie</td></tr>
<tr><td>III</td><td>Idem</td><td>Vomissements, défécation</td><td>Œdème laryngé, bronchospasme, cyanose</td><td>Choc</td></tr>
<tr><td>IV</td><td>Idem</td><td>Idem</td><td>Arrêt respiratoire</td><td>Arrêt circulatoire</td></tr></table>
<p>Le grade retenu est celui du signe le plus grave, quel que soit l’organe. Les signes cutanés peuvent manquer à tous les grades.</p>
<h3>1.4 Codage CIM-10-GM</h3>
<p>T78.0 : choc anaphylactique dû à une intolérance alimentaire. T78.1 : autres réactions d’intolérance alimentaire. T78.2 : choc anaphylactique, sans précision. T78.3 : œdème angioneurotique (angio-œdème non héréditaire). T78.4 : allergie, sans précision. Les chocs anaphylactiques dus à un médicament correctement administré (T88.6) ou à un sérum (T80.5) et les réactions aux venins sont traités dans ce cours par renvoi.</p>
</section>

<section class="ilot" id="t78-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’incidence de l’anaphylaxie en Europe est estimée entre <b>1,5 et 7,9 pour 100 000 personnes par an</b>, et la prévalence sur la vie d’environ <b>0,3 %</b>, avec une nette augmentation des hospitalisations depuis vingt ans, surtout pour les causes alimentaires chez l’enfant. La mortalité reste faible (moins de 1 % des épisodes), mais les décès touchent des patients souvent jeunes et sont en grande partie évitables. Les données suisses proviennent surtout du Registre européen de l’anaphylaxie, auquel participent des centres suisses ; la codification variable de l’anaphylaxie dans la CIM-10 limite les chiffres nationaux.</p>
<div class="two">
<div class="card"><h4>Chez l’enfant</h4><p>Les <b>aliments</b> dominent : arachide, fruits à coque (noix de cajou, noisette), lait de vache, œuf, poisson, crustacés. L’adolescent et le jeune adulte allergiques aux aliments ont le risque de décès le plus élevé (prise de risque, retard à l’adrénaline, asthme associé).</p></div>
<div class="card"><h4>Chez l’adulte</h4><p><b>Venins d’hyménoptères</b> (guêpe, abeille : cause fréquente en Suisse, en été), <b>médicaments</b> (bêtalactamines, anti-inflammatoires non stéroïdiens, curares et chlorhexidine en anesthésie, produits de contraste), puis aliments. Chez le sujet âgé, les causes médicamenteuses et le terrain cardiovasculaire rendent les formes plus graves.</p></div></div>
<p>La <b>récidive</b> est fréquente si le déclencheur n’est pas identifié et évité : environ un tiers des patients ayant fait une anaphylaxie en refont une. Après une anaphylaxie au venin sans immunothérapie, le risque d’une nouvelle réaction systémique lors d’une piqûre ultérieure est de l’ordre de 30 à 60 %.</p>
</section>

<section class="ilot" id="t78-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Sensibilisation</h3>
<p>Lors d’un premier contact, sans symptôme, l’allergène est présenté aux lymphocytes T auxiliaires de type 2, qui font produire par les lymphocytes B des <b>IgE spécifiques</b>. Ces IgE se fixent sur le récepteur de haute affinité FcεRI des <button class="w" data-k="t78-masto">mastocytes</button> (tissus) et des basophiles (sang). Le sujet est alors <b>sensibilisé</b>. Un sujet sensibilisé n’est pas forcément allergique : seule la survenue de symptômes à l’exposition définit l’allergie.</p>
<h3>3.2 Déclenchement</h3>
<p>Lors d’une nouvelle exposition, l’allergène relie deux IgE voisines à la surface du mastocyte (pontage). Le mastocyte libère en quelques secondes ses <b>médiateurs préformés</b> (histamine, tryptase, chymase, héparine), puis produit en quelques minutes des <b>médiateurs néoformés</b> (leucotriènes cystéinylés, PGD₂, facteur d’activation plaquettaire), et enfin des cytokines qui entretiennent la réaction.</p>
<h3>3.3 Des médiateurs aux symptômes</h3>
<table class="t"><tr><th>Effet</th><th>Médiateurs principaux</th><th>Traduction clinique</th></tr>
<tr><td>Vasodilatation</td><td>Histamine, facteur d’activation plaquettaire, prostaglandines</td><td>Flush, hypotension, perte de résistance vasculaire</td></tr>
<tr><td>Fuite capillaire</td><td>Histamine, facteur d’activation plaquettaire, bradykinine</td><td>Urticaire, angio-œdème, œdème laryngé, <b>hypovolémie</b> (jusqu’à 35 % du volume plasmatique en 10 minutes)</td></tr>
<tr><td>Contraction des muscles lisses</td><td>Leucotriènes, histamine, PGD₂</td><td>Bronchospasme, crampes abdominales, vomissements, diarrhée</td></tr>
<tr><td>Effets cardiaques</td><td>Histamine, leucotriènes (vasoconstriction coronaire), facteur d’activation plaquettaire</td><td>Tachycardie, arythmie, ischémie myocardique (syndrome de Kounis)</td></tr>
<tr><td>Stimulation nerveuse</td><td>Histamine</td><td>Prurit, sensation de mort imminente</td></tr></table>

<h3>3.4 Réactions non allergiques</h3>
<p>Certaines substances activent directement le mastocyte, sans IgE : par le récepteur <button class="w" data-k="t78-mrg">MRGPRX2</button> (opiacés comme la morphine et la codéine, vancomycine, fluoroquinolones, certains curares, icatibant), par l’activation du complément (produits de contraste, certains excipients comme le polyéthylène glycol et le polysorbate), ou par une déviation du métabolisme de l’acide arachidonique (anti-inflammatoires non stéroïdiens inhibant la cyclo-oxygénase 1). Ces réactions ne nécessitent pas de sensibilisation préalable : elles peuvent survenir dès la première exposition, et les tests cutanés sont habituellement négatifs.</p>
<h3>3.5 Réaction biphasique</h3>
<p>Une récidive des symptômes survient, sans nouvelle exposition, chez environ 5 % des patients (1 à 20 % selon les études), le plus souvent dans les <b>12 heures</b>, parfois jusqu’à 72 heures. Facteurs de risque : anaphylaxie initiale sévère, dose d’adrénaline insuffisante ou retardée, besoin de plus d’une dose, déclencheur inconnu, présentation initiale avec pression différentielle élargie. Ce phénomène justifie la surveillance après la crise.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> La fuite capillaire massive explique pourquoi le patient hypotendu doit être <b>allongé, jambes surélevées</b>, et recevoir un <b>remplissage rapide</b> : le lever brutalement peut provoquer un désamorçage cardiaque (« ventricule vide ») et l’arrêt. Les bêtabloquants bloquent les récepteurs sur lesquels agit l’adrénaline et activent les réflexes vagaux : c’est pourquoi le patient de l’îlot 0 a une fréquence cardiaque inappropriée de 62/min et peut répondre mal à l’adrénaline, d’où l’intérêt du glucagon.</div>
</section>

<section class="ilot" id="t78-4"><h2><span class="n">4</span>Déclencheurs, cofacteurs et facteurs de gravité</h2>
<h3>4.1 Déclencheurs</h3>
<table class="t"><tr><th>Groupe</th><th>Exemples fréquents</th><th>Particularités</th></tr>
<tr><td><b>Aliments</b></td><td>Arachide, fruits à coque, lait, œuf, poisson, crustacés, sésame, céleri (Suisse), blé, fruits de la famille des rosacées (pêche)</td><td>Délai habituel de 5 à 30 minutes ; exceptions : alpha-gal (3 à 6 heures), allergie au blé induite par l’effort</td></tr>
<tr><td><b>Venins d’hyménoptères</b></td><td>Guêpe (<i>Vespula</i>), abeille (<i>Apis mellifera</i>), frelon</td><td>Délai de quelques minutes ; apiculteurs et leurs proches exposés</td></tr>
<tr><td><b>Médicaments</b></td><td>Bêtalactamines, anti-inflammatoires non stéroïdiens, curares, chlorhexidine, produits de contraste, biologiques (rituximab, anticorps), vaccins (rarement)</td><td>Délai de quelques secondes à minutes par voie intraveineuse, plus long par voie orale</td></tr>
<tr><td>Latex</td><td>Gants, matériel médical</td><td>Devenu rare depuis l’abandon des gants poudrés en latex</td></tr>
<tr><td>Idiopathique</td><td>Aucun déclencheur identifié malgré le bilan</td><td>Rechercher une <button class="w" data-k="t78-mastocyt">mastocytose ou un trouble de l’activation mastocytaire</button> et une allergie à l’alpha-gal</td></tr></table>
<h3>4.2 Cofacteurs</h3>
<p>Un cofacteur abaisse le seuil de réaction : le même aliment toléré au repos déclenche une anaphylaxie s’il est suivi d’un effort. Les principaux cofacteurs sont l’<b>effort physique</b>, les <b>anti-inflammatoires non stéroïdiens</b>, l’<b>alcool</b>, les infections aiguës, le manque de sommeil, le stress, la période prémenstruelle. Ils sont présents dans environ 20 à 30 % des anaphylaxies de l’adulte. Exemple : un joggeur fait une anaphylaxie une demi-heure après un sandwich au pain complet ; au repos, il tolère le blé. Il s’agit de l’anaphylaxie au blé induite par l’effort, liée aux IgE contre l’oméga-5-gliadine.</p>
<h3>4.3 Facteurs de gravité et de décès</h3>
<div class="two">
<div class="card"><h4>Liés au patient</h4><p>Âge avancé, <b>maladie cardiovasculaire</b>, <b>asthme non contrôlé</b> (facteur majeur de décès par anaphylaxie alimentaire), <b>mastocytose</b> ou tryptase de base élevée, adolescence (comportements à risque), grossesse.</p></div>
<div class="card"><h4>Liés à la réaction et au traitement</h4><p><b>Retard à l’adrénaline</b>, voie intraveineuse de l’allergène, venin, position debout pendant la réaction, bêtabloquants et inhibiteurs de l’enzyme de conversion (réactions plus sévères ou réfractaires, surtout pour les venins).</p></div></div>
</section>

<section class="ilot" id="t78-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>En urgence, l’anamnèse est réduite à l’essentiel : exposition récente, délai, symptômes, antécédents d’allergie, médicaments (bêtabloquants). Après la stabilisation, une anamnèse détaillée est l’outil diagnostique principal : elle guide tout le bilan allergologique.</p>
<h3>5.1 Ce qu’il faut documenter (fiche de la réaction)</h3>
<ul>
<li>Tout ce qui a été <b>ingéré, injecté, piqué ou touché dans les 6 heures</b> précédentes (et jusqu’à 12 heures pour l’alpha-gal), avec les quantités, les marques et les ingrédients.</li>
<li><b>Délai</b> entre exposition et premiers symptômes ; ordre d’apparition des signes.</li>
<li><b>Cofacteurs</b> : effort, anti-inflammatoires, alcool, infection, cycle menstruel.</li>
<li>Symptômes par organe, pression artérielle, fréquence cardiaque, saturation mesurées par les secours, traitement reçu (heure de l’adrénaline) et réponse.</li>
<li>Réactions antérieures au même produit ou à des produits voisins ; tolérance ultérieure (un aliment consommé sans problème depuis n’est pas en cause).</li>
<li>Terrain : asthme, atopie, maladie cardiovasculaire, mastocytose, piqûres d’insecte, profession, animaux, piqûres de tiques (alpha-gal).</li></ul>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<p><b>Cutanéo-muqueux (80 à 90 %)</b> — Prurit (paumes, plantes, cuir chevelu, région génitale : un prurit palmoplantaire est un signe précoce évocateur), flush, urticaire généralisée, angio-œdème des lèvres, de la langue, des paupières. <b>Respiratoires (≈ 70 %)</b> — Voix rauque, dysphonie, dysphagie, sensation de gorge serrée (atteinte laryngée), toux, dyspnée sifflante (bronchospasme), rhinite. <b>Cardiovasculaires (≈ 45 %)</b> — Malaise, vertiges, perte de connaissance, douleur thoracique, palpitations, incontinence. <b>Digestifs (≈ 45 %)</b> — Crampes abdominales, nausées, vomissements, diarrhée ; chez la femme, contractions utérines. <b>Neurologiques</b> — Sensation de mort imminente, anxiété, confusion ; céphalées.</p>
<div class="trap"><span class="k">Piège</span>L’anaphylaxie <b>sans signe cutané</b> existe dans 10 à 20 % des cas, surtout dans les formes les plus graves (choc d’emblée, venin, anesthésie). Une hypotension ou un bronchospasme brutal après une exposition connue suffit au diagnostic, même sur une peau normale. Inversement, l’urticaire peut apparaître <b>après</b> la correction de l’hypotension, quand la peau est de nouveau perfusée.</div>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Quelques minutes après l’exposition : prurit, urticaire, puis dyspnée, malaise et hypotension ; évolution favorable sous adrénaline.</p></div>
<div class="card"><h4>Choc d’emblée</h4><p>Après une piqûre ou une injection intraveineuse : perte de connaissance en quelques minutes, sans urticaire ; fréquent chez le patient avec mastocytose ou sous bêtabloquant.</p></div>
<div class="card"><h4>Forme respiratoire prédominante</h4><p>Chez l’enfant allergique alimentaire et asthmatique : toux, sifflements, détresse respiratoire ; le décès survient par bronchospasme réfractaire.</p></div>
<div class="card"><h4>Forme digestive</h4><p>Vomissements répétés et douleurs abdominales, parfois isolés au début ; chez le nourrisson, peut précéder un malaise hypotonique.</p></div>
<div class="card"><h4>Forme retardée</h4><p>Allergie à l’alpha-gal : urticaire et anaphylaxie la nuit, 3 à 6 heures après un repas de viande rouge, chez un sujet piqué par des tiques.</p></div>
<div class="card"><h4>Forme périopératoire</h4><p>Hypotension et désaturation à l’induction, sans possibilité de plainte du patient ; bronchospasme, augmentation des pressions de ventilation, baisse du CO₂ expiré, urticaire masquée par les champs.</p></div></div>
</section>

<section class="ilot" id="t78-6"><h2><span class="n">6</span>Examen clinique et gravité</h2>
<p>L’examen suit l’approche <b>ABCDE</b> (voies aériennes, respiration, circulation, état neurologique, exposition de la peau), qui hiérarchise les menaces vitales et évite de s’attarder sur l’urticaire.</p>
<table class="t"><tr><th>Étape</th><th>Signes recherchés</th><th>Signification</th></tr>
<tr><td><b>A — voies aériennes</b></td><td>Œdème de la langue ou des lèvres, voix rauque, stridor inspiratoire, hypersialorrhée</td><td>Obstruction haute : risque d’asphyxie ; appeler de l’aide expérimentée</td></tr>
<tr><td><b>B — respiration</b></td><td>Fréquence respiratoire, sibilants, tirage, saturation, cyanose, fatigue</td><td>Bronchospasme, hypoxémie</td></tr>
<tr><td><b>C — circulation</b></td><td>Pression artérielle, fréquence cardiaque, temps de recoloration, pâleur, extrémités froides, marbrures</td><td>Choc ; <button class="w" data-k="t78-hypot">seuils d’hypotension selon l’âge</button></td></tr>
<tr><td><b>D — neurologie</b></td><td>Agitation, confusion, somnolence, perte de connaissance</td><td>Hypoperfusion cérébrale ou hypoxie</td></tr>
<tr><td><b>E — exposition</b></td><td>Urticaire, érythème, angio-œdème, point de piqûre (dard d’abeille à retirer), site d’injection</td><td>Confirme le tableau et parfois la cause</td></tr></table>
<div class="trap"><span class="k">Piège</span>La tachycardie est habituelle, mais une <b>fréquence normale ou basse</b> n’exclut pas le choc : bêtabloquant, réflexe vagal (réflexe de Bezold-Jarisch par ventricule vide) ou stade préterminal. Chez le patient de l’îlot 0, 62/min avec 78 mmHg de systolique est un signe de gravité, non un signe rassurant.</div>
