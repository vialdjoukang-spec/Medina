<div class="chap-head"><div class="code">B50 — Paludisme à Plasmodium falciparum · CIM-10-GM 2024 · I-03-Infectiologie</div><h1>Paludisme</h1><span class="status">Version de travail · Sources lues le 9 octobre 2026 : lignes directrices de l’OMS sur le paludisme (version du 13 août 2025) ; OFSP, page « Malaria (Paludisme) » ; recommandations 2019 du Comité suisse d’experts en médecine des voyages (Bull OFSP 2019;30) ; informations professionnelles suisses Riamet® et Malarone® (Swissmedic). Il n’existe pas de directive de la Société suisse d’infectiologie sur le traitement du paludisme ; de plus, aucune information professionnelle suisse de l’artésunate injectable n’a été trouvée dans la base AIPS. Relecture médicale humaine non encore effectuée.</span></div>

<section class="ilot" id="b50-pa-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. K., 42 ans, consulte aux urgences pour une fièvre à 39,5 °C avec frissons et céphalées ; or, il est rentré il y a dix jours d’un séjour chez sa famille au Cameroun, sans prophylaxie. Ainsi, ce tableau impose d’exclure en urgence un <button class="w" data-k="b50-pa-def">paludisme</button>, car l’OFSP rappelle que toute fièvre pendant ou après un séjour en zone d’endémie doit le faire suspecter. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</p>
<p>Dès lors, ce cours répond à quatre questions. D’abord, comment confirmer le diagnostic sans délai ? Ensuite, comment reconnaître un <button class="w" data-k="b50-pa-grave">paludisme grave</button> ? Puis, quel traitement choisir selon la gravité et l’espèce ? Enfin, comment prévenir l’infection chez le voyageur ?</p>
<div class="key"><b>À retenir.</b> Une fièvre au retour d’une zone d’endémie est un paludisme jusqu’à preuve du contraire ; c’est une urgence médicale.</div></section>

<section class="ilot" id="b50-pa-1"><h2><span class="n">1</span>Définition et espèces</h2>
<p>Pour répondre à ces questions, il faut d’abord définir la maladie. Le paludisme est une infection par un protozoaire du genre <i>Plasmodium</i>, transmise à l’humain par la piqûre de moustiques femelles du genre <button class="w" data-k="b50-pa-anoph"><i>Anopheles</i></button>, qui piquent le soir et la nuit. En outre, cinq espèces infectent l’humain : <i>P. falciparum</i>, <i>P. vivax</i>, <i>P. ovale</i>, <i>P. malariae</i> et <i>P. knowlesi</i>. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</p>

<tr><td><i>P. falciparum</i></td><td>Forme la plus dangereuse ; évolution rapide vers la forme grave, notamment cérébrale</td><td>B50</td></tr>
<tr><td><i>P. vivax</i></td><td><button class="w" data-k="b50-s-hypno">Hypnozoïtes</button> hépatiques ; rechutes possibles</td><td>B51</td></tr>

</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ce tableau distingue les espèces selon leur biologie : <i>P. falciparum</i> se multiplie vite et adhère aux capillaires, d’où les formes graves ; <i>P. vivax</i> et <i>P. ovale</i> laissent dans le foie des hypnozoïtes dormants, d’où des rechutes tardives qui imposent une cure radicale. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</div>
<p>Ainsi, l’espèce conditionne à la fois le risque vital et la nécessité d’un traitement des formes hépatiques ; c’est pourquoi ce cours, centré sur B50, traite aussi des autres espèces lorsque la conduite diffère. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p></section>

<section class="ilot" id="b50-pa-2"><h2><span class="n">2</span>Épidémiologie mondiale et suisse</h2>
<p>Une fois les espèces définies, reste à mesurer le poids de la maladie. À l’échelle mondiale, l’OMS estime à 263 millions le nombre de cas et à 597 000 le nombre de décès en 2023 ; de plus, selon l’OFSP, l’Afrique subsaharienne concentre plus de 90 % des cas. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a> ; <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</p>
<p>En Suisse, en revanche, il n’existe aucune transmission, car le vecteur n’y est pas présent ; tous les cas sont donc importés. Ainsi, de 2014 à 2018, la Suisse a enregistré en moyenne 340 cas par an ; parmi les quelque 230 cas annuels liés au voyage, 87 % faisaient suite à un séjour en Afrique. Par ailleurs, une grande partie des cas importés touchent des <button class="w" data-k="b50-pa-vfr">personnes migrantes rendant visite à leurs proches</button>, qui sous-estiment souvent le risque. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a>.</p>

<div class="key"><b>À retenir.</b> En Suisse, le paludisme est toujours importé, surtout d’Afrique, et touche souvent des voyageurs qui rendent visite à leurs proches.</div></section>

<section class="ilot" id="b50-pa-3"><h2><span class="n">3</span>Cycle et physiopathologie</h2>
<p>Ce risque s’explique par le cycle du parasite. En effet, après la piqûre infectante, les parasites se multiplient d’abord dans le foie, puis dans les globules rouges, qu’ils détruisent ; par conséquent, l’OFSP indique qu’au minimum 6 jours, et parfois plusieurs années, séparent la piqûre des premiers symptômes. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</p>
<p>De plus, chez <i>P. vivax</i> et <i>P. ovale</i>, des formes hépatiques dormantes, les hypnozoïtes, peuvent se réactiver des mois plus tard ; c’est pourquoi seule une 8-aminoquinoléine, qui détruit ces formes, prévient les rechutes. À l’inverse, <i>P. falciparum</i> ne forme pas d’hypnozoïtes, mais sa multiplication sanguine rapide explique la gravité, la mortalité du paludisme grave non traité approchant 100 %. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<div class="key"><b>Corrélation clinique.</b> Une fièvre jusqu’à plusieurs mois après le retour reste compatible avec un paludisme, surtout à <i>P. vivax</i> ou <i>P. ovale</i>.</div></section>

<section class="ilot" id="b50-pa-4"><h2><span class="n">4</span>Présentation clinique</h2>
<p>Cette destruction des globules rouges se traduit par un tableau peu spécifique. Ainsi, l’OFSP décrit une fièvre supérieure à 38 °C, des frissons, des céphalées, des myalgies, et parfois des vomissements et une diarrhée. Or, ces signes ressemblent à ceux d’une grippe ou d’une gastro-entérite ; c’est pourquoi seul le contexte de voyage oriente le diagnostic. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</p>
<p>En outre, l’infection à <i>P. falciparum</i> peut évoluer rapidement vers une forme grave, la complication la plus redoutée étant l’atteinte cérébrale, avec convulsions, coma et décès. Par ailleurs, la femme enceinte et le jeune enfant sont particulièrement exposés aux complications. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a>.</p>
<div class="alert"><b>Seuil d’alerte suisse.</b> Toute fièvre supérieure à 37,5 °C survenant au moins 7 jours après une exposition doit conduire à consulter le plus rapidement possible pour exclure un paludisme. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a>.</div></section>

<section class="ilot" id="b50-pa-5"><h2><span class="n">5</span>Paludisme grave : critères de l’OMS</h2>
<p>Puisque l’évolution peut être fulgurante, il faut rechercher d’emblée les signes de gravité. Selon l’OMS, le paludisme grave à <i>P. falciparum</i> se définit par au moins un des critères suivants, en présence d’une parasitémie asexuée et en l’absence d’autre cause identifiée. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<table class="t"><thead><tr><th>Critère</th><th>Seuil chez l’adulte (OMS)</th></tr></thead><tbody>
<tr><td><button class="w" data-k="b50-pa-coma">Trouble de la conscience</button></td><td>Score de Glasgow &lt; 11</td></tr>
<tr><td>Prostration</td><td>Incapacité de s’asseoir, de se tenir debout ou de marcher sans aide</td></tr>
<tr><td>Convulsions multiples</td><td>Plus de deux épisodes en 24 h</td></tr>
<tr><td><button class="w" data-k="b50-pa-acid">Acidose</button></td><td>Déficit en bases &gt; 8 mEq/L, ou bicarbonate &lt; 15 mmol/L, ou lactate veineux ≥ 5 mmol/L</td></tr>
<tr><td>Hypoglycémie</td><td>Glucose &lt; 2,2 mmol/L</td></tr>
<tr><td>Anémie palustre grave</td><td>Hémoglobine &lt; 7 g/dL ou hématocrite &lt; 20 %, avec parasitémie &gt; 10 000/µL</td></tr>
<tr><td>Atteinte rénale</td><td>Créatinine &gt; 265 µmol/L ou urée &gt; 20 mmol/L</td></tr>
<tr><td>Ictère</td><td>Bilirubine &gt; 50 µmol/L avec parasitémie &gt; 100 000/µL</td></tr>
<tr><td>Œdème pulmonaire</td><td>Confirmé à la radiographie, ou SpO₂ &lt; 92 % à l’air ambiant avec fréquence respiratoire &gt; 30/min</td></tr>
<tr><td>Saignement significatif</td><td>Épistaxis, gingivorragies ou saignements aux points de ponction récidivants ; hématémèse ou méléna</td></tr>
<tr><td><button class="w" data-k="b50-pa-choc">Choc</button></td><td>Décompensé : pression systolique &lt; 80 mmHg chez l’adulte, avec signes d’hypoperfusion</td></tr>
<tr><td><button class="w" data-k="b50-pa-hyper">Hyperparasitémie</button></td><td><i>P. falciparum</i> &gt; 10 %</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Chaque critère traduit une souffrance d’organe : l’adhérence des hématies parasitées dans les capillaires cérébraux altère la conscience, l’hypoperfusion et le métabolisme anaérobie produisent l’acidose, et le parasite consomme le glucose. Un seul critère suffit donc à définir le paludisme grave, qui impose l’artésunate intraveineux. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</div>
<p>Cependant, l’OMS précise que le clinicien ne doit pas s’attarder sur les définitions : dès qu’un paludisme grave est possible, le traitement parentéral doit commencer sans délai. De plus, pour <i>P. vivax</i>, les mêmes critères s’appliquent, mais sans seuil de densité parasitaire. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<button class="pareto-btn ui" data-k="pareto-b50-clinique">▲ Loi de Pareto — Reconnaître un paludisme grave</button></section>

<section class="ilot" id="b50-pa-6"><h2><span class="n">6</span>Diagnostic parasitologique</h2>
<p>La gravité ne peut toutefois être établie qu’après la preuve parasitologique. En effet, l’OMS retient deux méthodes : la <button class="w" data-k="b50-e-frottis">microscopie du frottis mince et de la goutte épaisse</button>, qui révèle les parasites dans presque tous les paludismes symptomatiques, et le <button class="w" data-k="b50-e-tdr">test de diagnostic rapide</button>, qui détecte des antigènes parasitaires. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>

<div class="key"><b>Lecture et physiopathologie.</b> Seule la femelle d’anophèle pique, car elle a besoin de sang pour ses œufs ; lors du repas, elle injecte avec sa salive des sporozoïtes qui gagnent le foie en quelques minutes. Comme l’anophèle pique surtout du crépuscule à l’aube, la protection contre les piqûres repose sur la moustiquaire imprégnée, les répulsifs et les vêtements couvrants le soir. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</div>
<p>Or, un premier examen négatif n’exclut pas le diagnostic : devant un tableau compatible avec un paludisme grave, l’OMS recommande de répéter les frottis toutes les 6 à 12 heures, ou de réaliser un test rapide, de préférence détectant l’antigène PfHRP2. Ainsi, seule la négativité des deux examens rend le paludisme extrêmement improbable. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p></section>

<section class="ilot" id="b50-pa-7"><h2><span class="n">7</span>Traitement du paludisme non compliqué</h2>
<p>Une fois le diagnostic posé et la gravité écartée, le traitement est oral. Ainsi, l’OMS recommande de traiter le voyageur atteint d’un paludisme à <i>P. falciparum</i> non compliqué par une <button class="w" data-k="b50-p-act">combinaison thérapeutique à base d’artémisinine (CTA)</button> ; de plus, si l’espèce n’est pas connue avec certitude, il faut traiter comme un paludisme à <i>P. falciparum</i>. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<p>En Suisse, deux spécialités sont autorisées pour cette indication. D’une part, l’<button class="w" data-k="b50-p-ria">artéméther-luméfantrine (Riamet®)</button> se prend en 6 doses sur 3 jours, avec un aliment gras ; d’autre part, l’<button class="w" data-k="b50-p-mal">atovaquone-proguanil (Malarone®)</button> se prend en 4 comprimés par jour pendant 3 jours. Toutefois, Riamet® est contre-indiqué dans le paludisme grave défini par l’OMS, et Malarone® n’est pas indiqué dans les formes graves. <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Riamet®, décembre 2019</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54150" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Malarone®, décembre 2025</a>.</p>
<p>En outre, l’OMS souligne que l’hyperparasitémie, même sans signe de gravité, expose à l’échec, à l’aggravation et au décès ; c’est pourquoi ces patients doivent être étroitement surveillés. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p></section>

<section class="ilot" id="b50-pa-8"><h2><span class="n">8</span>Traitement du paludisme grave</h2>
<p>À l’inverse, la forme grave impose un traitement parentéral immédiat. En effet, l’OMS recommande l’<button class="w" data-k="b50-p-artes">artésunate</button> intraveineux ou intramusculaire pendant au moins 24 heures et jusqu’à ce que la voie orale soit tolérée, puis un relais par une CTA pendant 3 jours ; l’adulte et l’enfant de plus de 20 kg reçoivent 2,4 mg/kg par dose. Par ailleurs, l’artésunate a réduit la mortalité par rapport à la quinine dans les plus grands essais randomisés. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<p>De plus, la prise en charge associe des mesures immédiates : glycémie, hémoglobine, parasitémie et fonction rénale dès l’admission ; hémocultures ; ponction lombaire chez le patient inconscient pour exclure une méningite bactérienne ; enfin, bilan hydrique rigoureux, pour éviter la surcharge comme la déshydratation. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<div class="alert"><b>Hémolyse retardée.</b> Une hémolyse débutant plus d’une semaine après l’artésunate a été décrite chez des voyageurs non immuns hyperparasités ; elle est prévisible, car les hématies débarrassées des anneaux par la rate retournent dans la circulation avec une durée de vie raccourcie. Par conséquent, ces patients doivent être suivis pour dépister une anémie tardive. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</div>
<button class="pareto-btn ui" data-k="pareto-b50-traitement">▲ Loi de Pareto — Traiter un paludisme</button></section>

<section class="ilot" id="b50-pa-9"><h2><span class="n">9</span>P. vivax et P. ovale : prévenir les rechutes</h2>
<p>Le traitement de la phase sanguine ne suffit pas pour deux espèces. En effet, pour <i>P. vivax</i> et <i>P. ovale</i>, l’OMS recommande, là où la chloroquine reste efficace, une CTA ou la chloroquine, et sinon une CTA ; ensuite, la <button class="w" data-k="b50-p-pq">primaquine</button> prévient les rechutes. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<p>Or, la primaquine peut provoquer une hémolyse en cas de <button class="w" data-k="b50-pa-g6pd">déficit en G6PD</button> ; c’est pourquoi l’OMS exige de connaître le statut G6PD avant de la prescrire. Ainsi, le patient non déficitaire peut recevoir 0,5 mg/kg par jour pendant 7 ou 14 jours ; de plus, la tafénoquine en dose unique est une alternative si l’activité G6PD dépasse 70 % de la normale, mais pas pendant la grossesse ni l’allaitement. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<div class="alert"><b>Lacune nommée.</b> Aucune information professionnelle suisse de la primaquine ni de la tafénoquine n’a été trouvée dans la base des informations Swissmedic consultée le 9 octobre 2026 ; par conséquent, ce cours ne précise pas leurs modalités d’obtention en Suisse.</div></section>

<section class="ilot" id="b50-pa-10"><h2><span class="n">10</span>Situations particulières</h2>
<p>Au-delà du cas général, certaines personnes exigent une conduite propre. D’abord, chez la femme enceinte, l’OMS recommande l’artéméther-luméfantrine au premier trimestre depuis 2022 ; cependant, l’information suisse de Riamet® déconseille son usage au premier trimestre si d’autres antipaludiques adaptés sont disponibles. De plus, l’artésunate parentéral reste le traitement du paludisme grave à tous les trimestres. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Riamet®, décembre 2019</a>.</p>
<p>Ensuite, chez l’enfant de moins de 20 kg, l’artésunate parentéral se dose à 3 mg/kg, afin d’obtenir une exposition équivalente à celle de l’adulte. Enfin, chez la femme enceinte ou qui allaite atteinte de <i>P. vivax</i>, la primaquine est contre-indiquée ; ainsi, l’OMS propose une chimioprophylaxie hebdomadaire par chloroquine jusqu’à la fin de l’allaitement, puis la primaquine. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>.</p>
<div class="alert"><b>Point à trancher (audit).</b> Au premier trimestre, l’OMS recommande depuis 2022 l’artéméther-luméfantrine, alors que l’information suisse de Riamet® de 2019 conseille de l’éviter si une alternative existe. <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Riamet®, décembre 2019</a>.</div></section>

<section class="ilot" id="b50-pa-11"><h2><span class="n">11</span>Prévention chez le voyageur</h2>
<p>Puisque la maladie est entièrement importée en Suisse, la prévention se joue avant le départ. Ainsi, l’OFSP conseille de consulter 4 à 6 semaines avant un voyage en zone à risque ; de plus, il n’existe pas de vaccin pour le voyageur, d’où la protection contre les piqûres : vêtements couvrants, répulsifs et moustiquaires imprégnées. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</p>
<p>Par ailleurs, depuis 2019, le Comité suisse d’experts en médecine des voyages module la stratégie selon le <button class="w" data-k="b50-pa-risque">niveau de risque de la région</button> : protection contre les piqûres seule (M), complétée dans les situations à risque par un <button class="w" data-k="b50-pa-ttu">autotraitement d’urgence</button> (T*), ou <button class="w" data-k="b50-pa-chimio">chimioprophylaxie</button> (P). Enfin, le CEMV demande au médecin de famille de conseiller les migrants avant tout voyage vers leur pays d’origine, même lors d’une consultation de routine. <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a>.</p>
<div class="key"><b>À retenir.</b> La prévention associe la protection contre les piqûres et une stratégie M, M (+T*) ou P selon la région, indiquée sur healthytravel.ch.</div></section>

<section class="ilot" id="b50-pa-12"><h2><span class="n">12</span>Critères formels et paramètres clés</h2>
<p>En synthèse, les valeurs à retenir se résument ainsi.</p>
<table class="t"><thead><tr><th>Paramètre</th><th>Valeur</th></tr></thead><tbody>
<tr><td>Incubation minimale</td><td>6 jours (jusqu’à plusieurs années)</td></tr>
<tr><td>Seuil de consultation au retour</td><td>Fièvre &gt; 37,5 °C au moins 7 jours après l’exposition</td></tr>
<tr><td>Cas importés en Suisse</td><td>340 par an en moyenne (2014–2018)</td></tr>
<tr><td>Hyperparasitémie (grave)</td><td><i>P. falciparum</i> &gt; 10 %</td></tr>
<tr><td>Artésunate parentéral</td><td>2,4 mg/kg par dose (3 mg/kg si &lt; 20 kg), ≥ 24 h, puis CTA 3 jours</td></tr>
<tr><td>Riamet®, adulte</td><td>4 comprimés à 0 h, 8 h, puis matin et soir 2 jours (24 comprimés)</td></tr>
<tr><td>Malarone®, traitement adulte</td><td>4 comprimés par jour, 3 jours</td></tr>
<tr><td>Primaquine (G6PD normal)</td><td>0,5 mg/kg par jour, 7 ou 14 jours</td></tr>
</tbody></table>
<div class="key"><b>Lecture et physiopathologie.</b> Ces valeurs encadrent le raisonnement : l’incubation minimale de 6 jours correspond à la phase hépatique obligatoire, si bien qu’une fièvre survenue plus tôt n’est pas un paludisme de ce séjour ; à l’inverse, une fièvre survenue des mois après le retour reste compatible. <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>.</div>
