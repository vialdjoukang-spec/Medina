<template data-pop="b50-pa-def" data-title="Paludisme">
<p>Infection par <i>Plasmodium</i> transmise par la piqûre de l’anophèle femelle. Cinq espèces humaines ; <i>P. falciparum</i> donne les formes graves. Incubation d’au moins 6 jours. Urgence médicale.</p><div class="src">Source : <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-grave" data-title="Paludisme grave (OMS)">
<p>Au moins un critère, avec parasitémie asexuée et sans autre cause : conscience altérée (Glasgow &lt; 11), prostration, convulsions répétées, acidose, hypoglycémie &lt; 2,2 mmol/L, anémie grave, atteinte rénale, ictère, œdème pulmonaire, saignement, choc, hyperparasitémie &gt; 10 %. Traitement : artésunate parentéral sans délai.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-anoph" data-title="Anopheles">
<p>Genre de moustique vecteur ; seule la femelle pique, le soir et la nuit. Absent de Suisse : pas de transmission locale.</p><div class="src">Source : <a href="https://www.bag.admin.ch/fr/malaria-paludisme" target="_blank" rel="noopener" data-reference-source="1">OFSP, page « Malaria (Paludisme) »</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-s-hypno" data-title="Hypnozoïtes">
<p>Formes hépatiques dormantes de <i>P. vivax</i> et <i>P. ovale</i>, responsables de rechutes ; seules les 8-aminoquinoléines (primaquine, tafénoquine) les éliminent.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-vfr" data-title="Voyageurs « visiting friends and relatives »">
<p>Personnes issues de la migration qui retournent dans leur pays d’origine ; elles représentent une grande partie des cas importés en Suisse, car elles se croient à tort encore immunisées et consultent rarement avant le départ.</p><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-coma" data-title="Trouble de la conscience">
<p>Adulte : score de Glasgow &lt; 11 ; enfant : score de Blantyre &lt; 3. Chez le patient inconscient, ponction lombaire pour exclure une méningite bactérienne.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-acid" data-title="Acidose (critère OMS)">
<p>Déficit en bases &gt; 8 mEq/L ; à défaut, bicarbonate plasmatique &lt; 15 mmol/L ou lactate veineux ≥ 5 mmol/L. Cliniquement : respiration rapide, profonde, laborieuse. L’acidose est associée à une mortalité élevée.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-choc" data-title="Choc (critère OMS)">
<p>Compensé : temps de recoloration ≥ 3 s, sans hypotension. Décompensé : pression systolique &lt; 80 mmHg chez l’adulte (&lt; 70 mmHg chez l’enfant) avec hypoperfusion.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-hyper" data-title="Hyperparasitémie">
<p>Critère de gravité : <i>P. falciparum</i> &gt; 10 % des hématies. Hyperparasitémie « non compliquée » : ≥ 4 % sans signe de gravité ; risque accru d’échec, d’aggravation et de décès, d’où une surveillance étroite. <i>P. knowlesi</i> : &gt; 100 000/µL.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-e-frottis" data-title="Goutte épaisse et frottis mince">
<p>Goutte épaisse : détection sensible. Frottis mince : espèce et parasitémie. Si négatifs avec suspicion de forme grave : répéter toutes les 6 à 12 h ou test rapide PfHRP2.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-e-tdr" data-title="Test de diagnostic rapide">
<p>Test immunochromatographique détectant des antigènes parasitaires, spécifiques du genre ou de l’espèce (PfHRP2, pLDH, aldolase). Utile si la microscopie n’est pas disponible, ou après un traitement incomplet.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-p-act" data-title="Combinaison thérapeutique à base d’artémisinine">
<p>Association d’un dérivé de l’artémisinine, rapide, et d’une molécule partenaire, lente, sur 3 jours. OMS : artéméther-luméfantrine, artésunate-amodiaquine, artésunate-méfloquine, dihydroartémisinine-pipéraquine, artésunate + sulfadoxine-pyriméthamine, artésunate-pyronaridine.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-p-ria" data-title="Artéméther-luméfantrine (Riamet®)">
<p>Comprimé à 20 mg + 120 mg. Adulte ≥ 35 kg : 6 doses de 4 comprimés sur 3 jours (24 comprimés), avec un aliment gras. Contre-indications : paludisme grave, QTc long, médicaments allongeant le QTc, insuffisance rénale ou hépatique sévère.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Riamet®, décembre 2019</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-p-mal" data-title="Atovaquone-proguanil (Malarone®)">
<p>Comprimé à 250 mg + 100 mg. Traitement adulte &gt; 40 kg : 4 comprimés par jour, 3 jours. Prophylaxie : 1 comprimé par jour, de 1 à 2 jours avant jusqu’à 7 jours après le séjour ; contre-indiquée si clairance &lt; 30 ml/min.</p><div class="src">Source : <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54150" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Malarone®, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-p-artes" data-title="Artésunate parentéral">
<p>Traitement de choix de tout paludisme grave, y compris pendant la grossesse. 2,4 mg/kg par dose (3 mg/kg si &lt; 20 kg), par voie intraveineuse ou intramusculaire, au moins 24 h, puis CTA 3 jours. Solution préparée extemporanément. Surveiller une hémolyse retardée (&gt; 1 semaine).</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-p-pq" data-title="Primaquine">
<p>8-aminoquinoléine : cure radicale de <i>P. vivax</i> et <i>P. ovale</i>. Si G6PD normal : 0,5 mg/kg par jour, 7 ou 14 jours. Contre-indiquée pendant la grossesse et l’allaitement. Hémolyse en cas de déficit en G6PD.</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-g6pd" data-title="Déficit en G6PD">
<p>Déficit enzymatique érythrocytaire exposant à une hémolyse sous 8-aminoquinoléine. Statut à connaître avant la primaquine ; tafénoquine seulement si l’activité dépasse 70 % de la normale (test quantitatif ou semi-quantitatif).</p><div class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/26a6af2d-060c-4449-8207-1f25e63c6cc3/content" target="_blank" rel="noopener" data-reference-source="1">OMS, <i>WHO guidelines for malaria</i>, version du 13 août 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-risque" data-title="Niveaux de risque (CEMV 2019)">
<ul><li>Élevé : &gt; 10 cas importés pour 100 000 voyageurs par an → prophylaxie (P).</li><li>Faible : &gt; 1 à 10 pour 100 000 → protection + autotraitement d’urgence dans les situations à risque (T*).</li><li>Minime : ≤ 1 pour 100 000 → protection seule (M).</li></ul><div class="src">Source : <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-ttu" data-title="Autotraitement d’urgence">
<p>Depuis 2019, réservé aux séjours en région à faible risque sans accès à un diagnostic ou à un traitement dans les 48 heures. À prendre si la fièvre persiste plus de 24 heures ou récidive sans consultation possible, puis consulter rapidement. Riamet® est autorisé dans cette indication.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54594" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Riamet®, décembre 2019</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="b50-pa-chimio" data-title="Chimioprophylaxie">
<p>Recommandée en région à risque élevé, et pour la femme enceinte qui ne peut éviter une région à faible risque (méfloquine de choix selon les experts). Atovaquone-proguanil : de 1 à 2 jours avant jusqu’à 7 jours après le séjour.</p><div class="src">Sources : <a href="https://www.bag.admin.ch/dam/fr/sd-web/KtpVYMPLq-by/malaria-nsb-prophylaxe.pdf" target="_blank" rel="noopener" data-reference-source="1">Comité suisse d’experts en médecine des voyages (CEMV), actualisation des recommandations de prévention du paludisme, Bull OFSP 2019;30:8-12</a> ; <a href="https://www.swissmedicinfo.ch/ShowText.aspx?textType=FI&amp;lang=FR&amp;authNr=54150" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Malarone®, décembre 2025</a>. Textes lus le 9 octobre 2026.</div>
</template>
<template data-pop="pareto-b50-clinique" data-title="Loi de Pareto — Reconnaître un paludisme grave">
<p class="ratio" data-cover="b50-pa-1,b50-pa-3,b50-pa-4,b50-pa-5,b50-pa-6"></p><ul><li>Fièvre au retour : frottis et goutte épaisse en urgence.</li><li>Conscience, acidose, hypoglycémie, rein, parasitémie &gt; 10 %.</li><li>Un seul critère suffit.</li></ul>
</template>
<template data-pop="pareto-b50-traitement" data-title="Loi de Pareto — Traiter un paludisme">
<p class="ratio" data-cover="b50-pa-7,b50-pa-8,b50-pa-9,b50-pa-10"></p><ul><li>Grave : artésunate intraveineux sans délai.</li><li>Non compliqué : CTA ou atovaquone-proguanil.</li><li><i>P. vivax</i> et <i>P. ovale</i> : G6PD, puis primaquine.</li></ul>
</template>
<template data-pop="pareto-b50-examens" data-title="Loi de Pareto — Examens du paludisme">
<p class="ratio" data-cover="b50-e-1,b50-e-2"></p><ul><li>Goutte épaisse + frottis mince.</li><li>Répéter si négatif et suspicion forte.</li><li>Ne jamais retarder le traitement d’une forme grave.</li></ul>
</template>
<template data-pop="pareto-b50-pharma" data-title="Loi de Pareto — Pharmacologie antipaludique">
<p class="ratio" data-cover="b50-p-1,b50-p-2,b50-p-3"></p><ul><li>Riamet® : QTc, aliment gras.</li><li>Malarone® : rein, peau.</li><li>Primaquine : G6PD.</li></ul>
</template>
