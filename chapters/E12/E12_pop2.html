<template data-pop="e12-douleur" data-title="Douleur pancréatique de la FCPD">
<div class="lab">Caractéristiques</div><p>Douleur épigastrique récurrente depuis l’enfance, irradiant dans le dos, soulagée en antéflexion ou en décubitus ventral.</p>
<div class="lab">Suite</div><p>La stéatorrhée apparaît ensuite ; le diabète survient en général 10 à 20 ans après les premières douleurs.</p>
<div class="lab">Traitement</div><p>Antalgiques non opioïdes, antioxydants, extraction endoscopique des calculs ou lithotripsie ; chirurgie de drainage dans les cas réfractaires.</p>
</template>
<template data-pop="e12-imagerie" data-title="Imagerie du pancréas">
<div class="lab">Technique</div><p>Radiographie et échographie en première intention ; CT, IRM ou CPRE si elles sont négatives. Le CT est préféré à l’échographie pour confirmer un pancréas normal dans le « type 5 ».</p>
<div class="lab">Lésions</div><p>Gros calculs intracanalaires discrets (signe classique de la FCPD), dilatation canalaire, hypoplasie.</p>
<div class="lab">Piège</div><p>Une imagerie normale n’exclut pas un défaut des îlots ; elle sépare « type 5 » et FCPD, sans suffire au diagnostic.</p>
</template>
<template data-pop="e12-elastase" data-title="Élastase fécale et tests exocrines">
<div class="lab">Principe</div><p>L’élastase fécale-1 est basse en cas d’insuffisance exocrine. Elle n’est pas modifiée par les enzymes administrées. La chymotrypsine fécale est un autre test ; le test à la sécrétine-pancréozymine est plus lourd.</p>
<div class="lab">Piège</div><p>Ne pas répéter l’élastase pour juger de l’efficacité des enzymes.</p>
</template>
<template data-pop="e12-ewald" data-title="Critères d’Ewald et Bretzel (type 3c)">
<div class="lab">Majeurs (tous obligatoires)</div><p>Insuffisance pancréatique exocrine ; imagerie pancréatique pathologique ; absence d’auto-anticorps du diabète de type 1.</p>
<div class="lab">Mineurs</div><p>Dysfonction bêta ; pas d’insulinorésistance excessive ; baisse des incrétines ou du polypeptide pancréatique ; vitamines liposolubles basses (Revue médicale suisse 2022).</p>
</template>
<template data-pop="e12-spink1" data-title="Génétique de la pancréatite chronique tropicale">
<div class="lab">Gènes</div><p>SPINK1 (variant N34S chez environ 33 % en Inde), PRSS1, PRSS2, chymotrypsinogène C ; modèle à deux coups.</p>
<div class="lab">Indication de test</div><p>Pancréatite chronique avant 20 ans ou histoire familiale (HaPanEU, 2C).</p>
<div class="lab">Limite</div><p>Les variants prédisposent ; ils ne remplacent pas les critères de la FCPD.</p>
</template>
<template data-pop="e12-hypo" data-title="Hypoglycémie dans le diabète pancréatoprive">
<div class="lab">Mécanisme</div><p>Absence de glucagon contre-régulateur et absorption désorganisée des glucides par maldigestion ; les enzymes pancréatiques réduisent les hypoglycémies.</p>
<div class="lab">Facteurs aggravants</div><p>Alcool persistant après pancréatectomie totale ; non-perception après des hypoglycémies répétées. Jusqu’à 25 % de diabètes instables.</p>
<div class="lab">Limite</div><p>La conduite de l’hypoglycémie sévère n’est pas détaillée dans les sources lues.</p>
</template>
<template data-pop="e12-nutrition" data-title="Nutrition dans le diabète de malnutrition">
<div class="lab">« Type 5 »</div><p>Réhabilitation nutritionnelle en protéines, énergie et micronutriments ; aliments locaux, peu coûteux, riches en protéines et glucides complexes ; aliments thérapeutiques prêts à l’emploi si carence sévère.</p>
<div class="lab">FCPD</div><p>Alimentation équilibrée, régime pauvre en graisses si stéatorrhée, restriction des sucres simples, apport protéique suffisant, vitamines liposolubles et vitamine D, arrêt du tabac et de l’alcool, pas de restriction calorique.</p>
</template>
<template data-pop="e12-cancer" data-title="Vigilance oncologique dans la FCPD">
<div class="lab">Signes d’alerte</div><p>Perte de poids, douleur dorsale, ictère.</p>
<div class="lab">Conduite</div><p>CA 19-9 pour la vigilance ; certains experts recommandent une imagerie (IRM, échoendoscopie) au diagnostic d’un diabète pancréatoprive. Risque de décès disproportionné, surtout chez la femme.</p>
</template>
<template data-pop="e12-prevention" data-title="Prévention du « type 5 »">
<div class="lab">Mesures</div><p>Lutte contre la pauvreté et la faim (objectifs de développement durable 1 et 2) ; aliments riches en protéines pour les femmes en âge de procréer, nourrissons et enfants ; allaitement ; dépistage de la dénutrition ; formation des soignants.</p>
<div class="lab">Niveau de preuve</div><p>Mesures de santé publique proposées par un consensus d’experts ; aucun essai ne les évalue pour cette entité.</p>
</template>
<template data-pop="e12-mnemo" data-title="Moyen mnémotechnique : SANS">
<p><b>Aide pédagogique, non critère officiel.</b> Pour retenir le profil du « type 5 » : <b>S</b>écrétion d’insuline basse mais mesurable, <b>A</b>nticorps négatifs, <b>N</b>on-cétosique, <b>S</b>ensibilité à l’insuline conservée. Le moyen sert à l’examen oral ; il ne remplace ni le typage biologique ni l’imagerie du pancréas, et ne vaut pas critère diagnostique.</p>
</template>
<template data-pop="e12-insuline" data-title="Insuline : arbitrage entre sources">
<div class="lab">Positions</div><p>Vellore : minimiser l’insuline quand c’est cliniquement approprié. Consensus 2025 : souvent doses minimales. SGED 2023 : donner de l’insuline n’est jamais faux en cas de suspicion de diabète de type 1, d’HbA1c > 10 % ou de carence insulinique. HaPanEU : insuline en premier choix en cas de dénutrition sévère.</p>
<div class="lab">Arbitrage</div><p>Les populations diffèrent (étude de Vellore et consensus : sujets à IMC bas ; SGED : diabète de type 2 ; HaPanEU : pancréatite chronique). La conciliation retenue ici est celle de la dose : insuline si carence ou hyperglycémie sévère, mais basse et surveillée.</p>
</template>
<template data-pop="e12-glargine" data-title="Lantus® (insuline glargine 100 U/mL)">
<div class="lab">Source</div><p>Information professionnelle suisse, Sanofi, Suisse, mise à jour septembre 2022.</p>
<div class="lab">Indication et posologie</div><p>Diabète nécessitant de l’insuline dès l’âge de 2 ans ; une injection par jour à heure fixe ; dose individualisée.</p>
<div class="lab">Surveillance</div><p>Formation du patient à l’autosurveillance et aux situations d’hypo- et d’hyperglycémie, notamment en cas de repas insuffisants ou omis.</p>
<div class="lab">Limite</div><p>Les effets indésirables et contre-indications détaillés n’ont pas été relevés dans le dossier ; relire l’information professionnelle avant prescription.</p>
</template>
<template data-pop="e12-metformine" data-title="Glucophage® (metformine)">
<div class="lab">Source</div><p>Information professionnelle suisse, Merck, Suisse, mise à jour octobre 2025.</p>
<div class="lab">Indication</div><p>Diabète de type 2, complément au diabète de type 1. Usage dans E12 : hors indication, empirique selon le consensus 2025.</p>
<div class="lab">Posologie</div><p>Début 500 à 1 000 mg/jour, + 500 mg tous les 5 à 7 jours, maximum 3 000 mg/jour ; DFGe 30 à 59 mL/min : maximum 1 000 mg/jour.</p>
<div class="lab">Contre-indications</div><p>Acidose métabolique, insuffisance rénale grave (DFGe < 30 mL/min), hypoxie tissulaire, insuffisance hépatique, alcoolisme.</p>
<div class="lab">Place</div><p>Sans donnée chez IMC < 18,5 kg/m² ; ne corrige pas le défaut sécrétoire ; peut faire perdre du poids. Dans la FCPD et le type 3c, à discuter si hyperglycémie modérée avec insulinorésistance, à éviter si alcool persistant.</p>
</template>
<template data-pop="e12-creon" data-title="Creon® (pancréatine)">
<div class="lab">Source</div><p>Information professionnelle suisse, Viatris, mise à jour janvier 2025.</p>
<div class="lab">Indication</div><p>Insuffisance pancréatique exocrine de l’enfant et de l’adulte (pancréatite chronique, chirurgie pancréatique).</p>
<div class="lab">Posologie</div><p>Pendant ou juste après le repas, gélules avalées entières ; repas principal 25 000 à 80 000 U Ph. Eur. de lipase, collation moitié ; maximum 10 000 à 12 000 U/kg/jour ; enfant 1 000 U/kg/repas avant 4 ans, 500 U/kg/repas après.</p>
<div class="lab">Risque</div><p>Colopathie fibrosante au-delà de 10 000 U/kg/jour en cas de mucoviscidose.</p>
<div class="lab">Effet attendu</div><p>Améliore la stéatorrhée et la glycémie (sécrétion endogène de GLP-1) et réduit les hypoglycémies (Endotext 2024 ; Revue médicale suisse 2022).</p>
</template>
<template data-pop="e12-sulfo" data-title="Sulfonylurées et glinides">
<div class="lab">Position</div><p>Consensus 2025 : potentiellement utiles dans le « type 5 », avec prudence. Type 3c : sulfonylurées non recommandées (hypoglycémies prolongées, hépatopathie fréquente) ; glinides (répaglinide) envisageables à faible dose.</p>
<div class="lab">Lacune</div><p>Aucune information professionnelle suisse lue : ni dose, ni contre-indication ne sont donc fournies.</p>
</template>
<template data-pop="e12-dpp4" data-title="Inhibiteurs de la DPP-4">
<div class="lab">Position</div><p>Consensus 2025 : sûrs, mais peut-être insuffisants vu la carence insulinique. FCPD : incrétines non recommandées (lien discuté avec la pancréatite) ; revue suisse : question ouverte, avec méta-analyses récentes rassurantes.</p>
<div class="lab">Lacune</div><p>Aucune information professionnelle suisse lue.</p>
</template>
<template data-pop="e12-glp1" data-title="Agonistes du GLP-1">
<div class="lab">Position</div><p>Consensus 2025 : rôle improbable dans le « type 5 », en raison de la perte de poids et de la sarcopénie. FCPD : non recommandés ; revue suisse : question ouverte, avec perte de poids et effets digestifs indésirables.</p>
<div class="lab">Lacune</div><p>Aucune information professionnelle suisse lue.</p>
</template>
<template data-pop="e12-sglt2" data-title="Inhibiteurs du SGLT2">
<div class="lab">Position</div><p>Consensus 2025 : mécanisme indépendant de l’insuline, mais perte calorique et pondérale peu souhaitable. HaPanEU : non recommandés tant que la sécurité n’est pas prouvée (acidocétose euglycémique chez l’insulinodéficient).</p>
<div class="lab">Lacune</div><p>Aucune étude dans le type 3c selon la revue suisse ; aucune information professionnelle lue.</p>
</template>
