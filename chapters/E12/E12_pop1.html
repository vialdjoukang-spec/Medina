<template data-pop="pareto-e12-bases" data-title="Pareto — Définition à physiopathologie">
<p class="ratio" data-cover="e12-0,e12-1,e12-2,e12-3"></p><ul><li>Forme décrite chez des sujets jeunes, maigres (IMC < 18,5 kg/m²), dénutris depuis l’enfance, sans cétose et sans auto-anticorps.</li><li>Le défaut est sécrétoire : foie et muscle restent sensibles à l’insuline (Vellore 2022).</li><li>La classe OMS a été retirée en 1999 ; le « type 5 » de 2025 est une proposition d’experts sans critères validés.</li><li>La FCPD, ancien sous-type, relève du diabète du pancréas exocrine (type 3c).</li></ul></template>
<template data-pop="pareto-e12-clinique" data-title="Pareto — Causes, anamnèse, examen, diagnostic">
<p class="ratio" data-cover="e12-4,e12-5,e12-6,e12-7"></p><ul><li>Terrain nutritionnel et origine rurale orientent vers le « type 5 » ; douleurs depuis l’enfance puis stéatorrhée vers la FCPD.</li><li>La démarche : seuils de glycémie, anticorps, C-peptide, imagerie du pancréas.</li><li>Diagnostics à écarter : diabète de type 1, diabète cétosique, type 2 amaigri, pancréatique, MODY, lipodystrophies.</li><li>Un IMC bas ne prouve pas la dénutrition dans une population constitutionnellement mince.</li></ul></template>
<template data-pop="pareto-e12-prise" data-title="Pareto — Urgences, prise en charge, suivi">
<p class="ratio" data-cover="e12-8,e12-9,e12-10,e12-11"></p><ul><li>Le risque aigu principal du « type 5 » est l’hypoglycémie iatrogène ; l’acidocétose est généralement absente.</li><li>Jamais de perte de poids prescrite ; nutrition d’abord ; insuline à doses minimales si besoin.</li><li>FCPD et type 3c : insuline, enzymes pancréatiques, arrêt de l’alcool et du tabac.</li><li>Cancer du pancréas : complication la plus redoutée de la FCPD.</li></ul></template>
<template data-pop="pareto-e12-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e12-e-1,e12-e-2,e12-e-3,e12-e-4,e12-e-5"></p><ul><li>Pas de gold standard du « type 5 » ; imagerie démontrant les calculs pour la FCPD ; glycémie pour le diabète.</li><li>HbA1c < 6,5 % n’exclut pas le diabète : confirmer par la glycémie à jeun.</li><li>Anticorps négatifs et C-peptide bas mais mesurable : défaut sécrétoire sans auto-immunité.</li><li>L’élastase fécale est diagnostique, non un outil de suivi des enzymes.</li></ul></template>
<template data-pop="pareto-e12-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e12-s-anat-cours"></p><ul><li>Pancréas normal en imagerie : « type 5 ». Calculs intracanalaires : FCPD.</li><li>Le type 3c est un diabète du pancréas exocrine.</li></ul></template>
<template data-pop="pareto-e12-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="e12-s-histo-cours"></p><ul><li>Masse bêta réduite sans fibrose : « type 5 ». Destruction alpha et bêta par fibrose : FCPD.</li><li>Aucune biopsie humaine du « type 5 » dans les sources lues.</li></ul></template>
<template data-pop="pareto-e12-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e12-s-physio-cours"></p><ul><li>Sensibilité à l’insuline conservée, sécrétion réduite.</li><li>Dans le type 3c : moins d’incrétines, moins de glucagon, résistance hépatique.</li></ul></template>
<template data-pop="pareto-e12-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e12-s-bioch-cours"></p><ul><li>C-peptide : 1,2 ng/mL (IMC bas), 0,1 (type 1), 2,1 (type 2).</li><li>L’hypothèse antioxydante n’est pas une conduite.</li></ul></template>
<template data-pop="pareto-e12-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="e12-s-gen-cours"></p><ul><li>SPINK1 N34S chez environ 33 % en Inde ; modèle à deux coups.</li><li>Test génétique si pancréatite avant 20 ans ou histoire familiale (HaPanEU, 2C).</li></ul></template>
<template data-pop="pareto-e12-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e12-p-1,e12-p-2,e12-p-3,e12-p-4"></p><ul><li>Aucun essai dans le « type 5 » : traitement empirique, doses minimales, surveillance de l’hypoglycémie.</li><li>FCPD : insuline et enzymes ; éviter sulfonylurées, alpha-glucosidases, glitazones, incrétines, SGLT2.</li><li>Metformine : contre-indiquée si alcoolisme ou DFGe < 30 mL/min ; hors indication ici.</li></ul></template>
<template data-pop="e12-type5" data-title="Diabète de malnutrition, « type 5 » (consensus 2025)">
<div class="lab">Définition</div><p>Le consensus de Vellore (janvier 2025, 39 signataires), reconnu par la Fédération internationale du diabète en avril 2025, désigne par « type 5 » un diabète des sujets maigres avec antécédent de dénutrition. Le nom vient de ce que des types 3 et 4 avaient déjà été décrits.</p>
<div class="lab">Caractéristiques proposées</div><p>Fréquentes : IMC < 18,5 kg/m² ; hyperglycémie modérée à sévère ; C-peptide bas ; résistance à la cétose ; pas de signe d’insulinorésistance ; anticorps anti-GAD65 négatifs. Occasionnelles : dénutrition précoce, pancréas normal, masse grasse basse, génétique monogénique négative, bas niveau socio-économique, origine rurale.</p>
<div class="lab">Limite</div><p>Le texte est une déclaration d’experts, non une recommandation gradée. Aucun critère diagnostique n’est validé ; les seuils d’IMC sont provisoires. Le groupe de travail de la Fédération internationale du diabète doit établir critères et recommandations.</p>
</template>
<template data-pop="e12-histoire" data-title="Chronologie du diabète lié à la malnutrition">
<div class="lab">1955 à 1999</div><p>En 1955, Hugh-Jones décrit en Jamaïque le diabète « de type J ». En 1985, l’OMS reconnaît le diabète lié à la malnutrition. En 1999, l’OMS retire la classe faute de preuve que la dénutrition ou la carence protéique cause à elle seule le diabète.</p>
<div class="lab">2019 à 2025</div><p>La classification OMS de 2019 range la FCPD parmi les « autres types spécifiques ». L’étude de Vellore (2022) montre un défaut sécrétoire sans résistance. La déclaration de 2025 propose le « type 5 » ; une revue critique la juge injustifiée en l’état.</p>
<div class="lab">Limite</div><p>Les documents de l’OMS de 1985, 1999 et 2019 n’ont pas été lus directement ; leur contenu est rapporté par les articles cités.</p>
</template>
<template data-pop="e12-critique" data-title="Revue critique de 2025 (Misra et coll.)">
<div class="lab">Arguments</div><p>Les auteurs jugent le reclassement actuellement injustifié. Ils soulignent que la baisse de la dénutrition réduit la pertinence de l’entité, qu’un IMC bas est un mauvais substitut de la dénutrition dans des populations constitutionnellement minces, et que la dénutrition serait plus souvent une conséquence qu’une cause du diabète. Les types 3 et 4 invoqués n’ont pas de reconnaissance formelle.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu. La position contredit celle du consensus ; le cours présente les deux sans trancher.</p>
</template>
<template data-pop="e12-dt1" data-title="Erreur de typage : diabète de type 1 posé à tort">
<div class="lab">Mécanisme</div><p>Le patient à IMC bas conserve une sécrétion d’insuline (C-peptide médian de 1,2 ng/mL contre 0,1 chez le diabétique de type 1) et une sensibilité normale. Un schéma complet d’insuline, calculé pour une carence absolue, dépasse son besoin réel.</p>
<div class="lab">Conséquence</div><p>Le consensus 2025 avertit que ce diagnostic erroné peut provoquer des hypoglycémies iatrogènes graves, d’autant que l’insécurité alimentaire rend les repas irréguliers.</p>
<div class="lab">Décision</div><p>Typer avant de traiter : anticorps, C-peptide, imagerie du pancréas. Si la carence est établie ou l’hyperglycémie sévère, l’insuline reste possible, à doses basses et sous surveillance.</p>
</template>
<template data-pop="e12-cetose" data-title="Pourquoi l’acidocétose manque">
<div class="lab">Mécanisme</div><p>La sécrétion résiduelle d’insuline suffit à freiner la cétogenèse, mais pas à empêcher les pics glycémiques après les repas. D’autres explications ont été proposées : mobilisation retardée des acides gras libres et suppression post-prandiale du glucagon (Diabetes Care 2022). Dans la FCPD, la cétose est rare grâce à la sécrétion résiduelle, à une réserve de glucagon diminuée par la destruction des cellules alpha et à un substrat lipidique réduit (Endotext 2024).</p>
<div class="lab">Conséquence</div><p>Une glycémie très élevée sans cétose chez un sujet maigre n’est pas un argument contre le diabète ; l’absence de cétose oriente vers un défaut sécrétoire partiel.</p>
<div class="lab">Piège</div><p>L’absence de cétose ne distingue pas le « type 5 » de la FCPD ni du type 2.</p>
</template>
<template data-pop="e12-vellore" data-title="Étude de Vellore (Diabetes Care 2022)">
<div class="lab">Méthode</div><p>Étude transversale chez des hommes, avec clamp et déconvolution du C-peptide, après correction de la glucotoxicité deux semaines avant. Groupes comparés : IMC bas, diabète de type 1, diabète de type 2, témoins maigres.</p>
<div class="lab">Résultats</div><p>Sécrétion d’insuline plus basse que chez les témoins et les diabétiques de type 2, supérieure à celle du type 1 ; production hépatique de glucose 0,50 contre 0,84 mg/kg·min ; captation périphérique 10,1 contre 4,2 mg/kg·min ; graisse viscérale et lipides hépatiques plus bas ; masse maigre totale la plus basse.</p>
<div class="lab">Limites</div><p>Petit effectif, hommes seulement, pas de suivi, étude indienne. On ignore si les sécrétagogues seraient efficaces.</p>
</template>
<template data-pop="e12-pdx" data-title="Antioxydants, PDX-1 et MafA">
<div class="lab">Hypothèse</div><p>Une carence en vitamines A, C, E, catalase et glutathion peroxydase laisserait s’accumuler des espèces réactives de l’oxygène. Celles-ci altéreraient PDX-1 et MafA, facteurs de transcription du gène de l’insuline, et favoriseraient l’apoptose bêta (Lancet Global Health 2025).</p>
<div class="lab">Limite</div><p>Hypothèse. Aucun essai de supplémentation n’est cité ; elle ne justifie aucune prescription.</p>
</template>
<template data-pop="e12-fcpd" data-title="Pancréatopathie fibrocalculeuse (FCPD)">
<div class="lab">Définition</div><p>Diabète survenant après une pancréatite chronique tropicale, chez des adolescents ou jeunes adultes maigres, surtout en Inde du Sud. La phase pré-diabétique est la pancréatite chronique tropicale.</p>
<div class="lab">Clinique</div><p>Douleurs abdominales depuis l’enfance, puis stéatorrhée, puis diabète 10 à 20 ans plus tard, entre 15 et 35 ans. Acidocétose remarquablement inhabituelle ; complications microvasculaires fréquentes ; macrovasculaires rares.</p>
<div class="lab">Critères (Endotext)</div><p>Pays tropical ; diabète ; calculs pancréatiques ou au moins trois critères sur quatre de pancréatite chronique ; absence d’autre cause.</p>
<div class="lab">Risque</div><p>Cancer du pancréas, complication la plus redoutée.</p>
</template>
<template data-pop="e12-type3c" data-title="Diabète de type 3c (pancréatoprive)">
<div class="lab">Définition</div><p>Diabète par maladie du pancréas exocrine ; la FCPD en est une sous-classe dans la classification reprise par la Revue médicale suisse. Il représente environ 1 à 9 % de tous les diabètes.</p>
<div class="lab">Étiologies</div><p>Pancréatite chronique 79 %, néoplasie 8 %, hémochromatose 7 %, mucoviscidose 4 %, pancréatectomie 2 %.</p>
<div class="lab">Particularités</div><p>Hypoglycémies fréquentes et profondes (déficit en glucagon), insuline souvent nécessaire, enzymes pancréatiques indispensables.</p>
</template>
<template data-pop="e12-cpept" data-title="Lecture du C-peptide">
<div class="lab">Valeurs rapportées</div><p>Vellore : médianes à jeun de 1,2 ng/mL (IMC bas), 0,1 (type 1), 2,1 (type 2) ; au repas test, > 0,5 ng/mL chez les sujets à IMC bas, < 0,5 chez les diabétiques de type 1. SGED : 200 à 600 pmol/L avec anticorps négatifs et sans histoire familiale forte = carence insulinique.</p>
<div class="lab">Conduite</div><p>Si un diabète de type 1 reste possible à un stade précoce, répéter le C-peptide trois ans plus tard (SGED 2023).</p>
<div class="lab">Piège</div><p>Les unités diffèrent entre sources ; aucun facteur de conversion n’est fourni.</p>
</template>
<template data-pop="e12-seuils" data-title="Seuils diagnostiques du diabète">
<div class="lab">Valeurs</div><p>Glycémie à jeun ≥ 7,0 mmol/L (126 mg/dl) ; HbA1c ≥ 6,5 % (48 mmol/mol) ; glycémie à 2 heures de l’HGPO 75 g ≥ 11,1 mmol/L (200 mg/dl) ; glycémie aléatoire ≥ 11,1 mmol/L.</p>
<div class="lab">Application</div><p>Une HbA1c < 6,5 % n’exclut pas le diagnostic : confirmer par la glycémie à jeun. En cas de doute, répéter ou réaliser l’HGPO (HaPanEU 2017 ; SGED/SGRM 2025).</p>
</template>
<template data-pop="e12-imc" data-title="Repères anthropométriques de dénutrition">
<div class="lab">Valeurs</div><p>Adulte : IMC < 18,5 kg/m². Enfant de moins de 5 ans : rapport poids/taille < −3 déviations standard. De 5 à 19 ans : IMC < −3 déviations standard (consensus 2025).</p>
<div class="lab">Limite</div><p>Un IMC bas est un mauvais substitut de la dénutrition dans des populations constitutionnellement minces ; les seuils sont provisoires.</p>
</template>
