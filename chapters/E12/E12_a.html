<section class="ilot" id="e12-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 24 ans consulte pour une soif intense et un amaigrissement. Son indice de masse corporelle, ou IMC, est de 16,8 kg/m². Il est originaire d’une zone rurale d’un pays à revenu faible. Sa mère était dénutrie pendant la grossesse et il a grandi dans l’insécurité alimentaire. La glycémie à jeun atteint 17 mmol/L, sans cétose ; les anticorps anti-GAD sont négatifs. Ces valeurs pédagogiques servent à poser la question : faut-il le traiter comme un <button class="w" data-k="e12-dt1">diabète de type 1 (risque d’une erreur de typage)</button>, avec un schéma basal-bolus complet ?</p>
<p>La réponse prudente est non, du moins pas sans typage. Le consensus international de 2025 avertit qu’un diagnostic erroné de diabète de type 1 chez ces patients peut provoquer des <b>hypoglycémies iatrogènes graves</b> (Lancet Global Health 2025). L’étude métabolique de Vellore montre en effet une sécrétion d’insuline réduite mais non abolie, et une sensibilité à l’insuline normale (Diabetes Care 2022). Le patient n’a donc ni la carence absolue d’un diabète de type 1 ni la résistance d’un diabète de type 2.</p>
<p>Ce cours décrit une entité <b>historique et contestée</b>. Il expose le <button class="w" data-k="e12-type5">diabète de malnutrition, ou « type 5 » (consensus 2025)</button>, la <button class="w" data-k="e12-fcpd">pancréatopathie fibrocalculeuse (FCPD)</button> qui en fut longtemps un sous-type, et les diagnostics à écarter avant de retenir l’une ou l’autre.</p>
<div class="key"><b>À retenir.</b> Chez un adulte maigre, dénutri depuis l’enfance, avec un diabète sans cétose et sans auto-anticorps, l’insuline n’est pas la réponse automatique : le typage précède le traitement, et la nutrition fait partie du traitement.</div>
</section>
<section class="ilot" id="e12-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>Le diabète sucré de malnutrition est une forme décrite depuis 1955 chez des sujets <b>jeunes (moins de 30 ans) et maigres (IMC inférieur à 18,5 kg/m²)</b>, dont l’histoire évoque une <b>dénutrition</b> présente depuis la vie fœtale et l’enfance. Le phénotype associe une altération marquée de la sécrétion d’insuline, une sensibilité hépatique et périphérique à l’insuline normale, l’absence d’acidocétose et l’absence d’auto-anticorps dirigés contre les îlots (Lancet Global Health 2025).</p>
<p>La Classification statistique internationale des maladies, dans sa version 10 de l’OMS, regroupe sous E12 le diabète de malnutrition « de type 1 » et « de type 2 ». Elle en exclut le diabète de la grossesse (O24.-), la glycosurie isolée, l’intolérance au glucose et le diabète néonatal. La version allemande modifiée (CIM-10-GM 2024) de l’Office fédéral de la statistique reprend le libellé « Diabète sucré de malnutrition » et décline, comme pour les autres diabètes, les complications aiguës et chroniques (OFS 2024 ; OMS 2019). Cette rubrique persiste alors que la classe clinique a été retirée de la classification de l’OMS en 1999 : le cours doit donc distinguer le nom du registre de la réalité physiopathologique.</p>
<p>La chronologie suivante montre pourquoi l’entité a disparu puis réapparu. Elle se lit de haut en bas ; chaque ligne ajoute une preuve ou une objection.</p>
<table class="t"><thead><tr><th>Date</th><th>Événement</th><th>Enseignement</th></tr></thead><tbody><tr><td>1955</td><td>Hugh-Jones, en Jamaïque, décrit un diabète « de type J » : sujets jeunes et maigres, sans cétose</td><td>Premier portrait clinique ; besoins en insuline jugés élevés, à tort selon les mesures ultérieures</td></tr><tr><td>1985</td><td>L’OMS reconnaît le diabète lié à la malnutrition comme classe distincte</td><td>L’entité entre dans la classification officielle</td></tr><tr><td>1999</td><td>L’OMS retire la classe</td><td>Aucune preuve que la dénutrition ou la carence protéique cause à elle seule le diabète</td></tr><tr><td>2022</td><td>Étude métabolique de Vellore (clamp, déconvolution du C-peptide)</td><td>Défaut de sécrétion sans résistance à l’insuline</td></tr><tr><td>2025</td><td>Déclaration de Vellore : « diabète de type 5 », reconnu par la Fédération internationale du diabète (IDF)</td><td>Un groupe de travail doit établir critères diagnostiques et recommandations thérapeutiques</td></tr><tr><td>2025</td><td>Revue critique : reclassement « actuellement injustifié »</td><td>Les questions de causalité restent ouvertes</td></tr></tbody></table>
<p>Le nom « type 5 » a été choisi parce que des types 3 et 4 avaient déjà été décrits dans la littérature ; une revue critique objecte que ces deux types n’ont pas de reconnaissance formelle (Misra et coll., 2025). Pour approfondir : <button class="w" data-k="e12-histoire">chronologie détaillée et sources</button> et <button class="w" data-k="e12-critique">arguments de la revue critique</button>.</p>
<p>Une seconde famille doit être connue. La pancréatopathie fibrocalculeuse, ou FCPD, figurait dans la classe OMS de 1985. La classification OMS de 2019 la range parmi les « autres types spécifiques ». La classification reprise par la Revue médicale suisse la place dans les diabètes de la maladie du pancréas exocrine, ou <button class="w" data-k="e12-type3c">diabète de type 3c (pancréatoprive)</button> (Revue médicale suisse 2022 ; Endotext 2024).</p>
<div class="trap"><span class="k">Piège de classification</span> Dire « type 5 » ne crée pas une catégorie validée : le consensus de 2025 précise lui-même qu’aucun critère diagnostique n’est encore validé et que les seuils d’IMC sont provisoires. Il faut présenter le terme comme une proposition d’experts, pas comme un diagnostic de la classification officielle.</div>

</section>
<section class="ilot" id="e12-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Le consensus de 2025 estime à <b>25 millions</b> le nombre de personnes atteintes. Ce chiffre dérive des données de prévalence globale et de la part des diabétiques vivant dans les pays à revenu faible et intermédiaire. Les pays qui rapportent le phénotype sont l’Inde, le Pakistan, le Bangladesh, l’Ouganda, l’Éthiopie, le Rwanda, le Nigeria et l’Indonésie ; la Corée et la Thaïlande s’y ajoutent dans l’étude de Vellore. Le diagnostic survient habituellement dans la troisième décennie (Lancet Global Health 2025 ; Diabetes Care 2022).</p>
<p>Les anciennes descriptions donnent le cadre : âge inférieur à 30 ans, <b>prédominance masculine d’environ 85 %</b>, glycémie à jeun supérieure à 200 mg/dl (11,1 mmol/L) sans cétonurie, besoins en insuline supérieurs à 60 UI par jour ou 2,0 U/kg/j. En Inde et en Iran, la proportion parmi les diabétiques varie de 6 à 21 % une fois exclues les pancréatopathies visibles. En Éthiopie rurale, plus de 4 700 patients dépendants de l’insuline avaient un IMC moyen de 16,7 kg/m² chez les hommes et 16,5 chez les femmes, un rapport hommes/femmes de 2 pour 1, et presque tous étaient résistants à la cétose (Diabetes Care 2022). Le profil socio-démographique associe un bas niveau socio-économique, une origine rurale et un faible apport en protéines et en calories.</p>
<p>Les réserves méritent la même attention que les chiffres. La baisse de la dénutrition dans les pays à revenu faible et intermédiaire réduit la pertinence actuelle de l’entité. Un IMC bas est un mauvais substitut de la dénutrition dans des populations constitutionnellement minces. Enfin, la dénutrition serait plus souvent une <b>conséquence</b> qu’une cause du diabète (Misra et coll., 2025).</p>
<p>Pour la FCPD, la maladie touche surtout l’Inde du Sud, chez des adolescents et de jeunes adultes maigres. Dans l’enquête indienne de 2008 (32 centres, 1 033 patients), la pancréatite tropicale ne représentait plus que <b>3,8 %</b> des pancréatites chroniques, avec un IMC souvent normal et un début plus tardif ; sa prévalence est en déclin. Le diabète complique environ 50 % des pancréatites chroniques en Malaisie et 55 % en Inde du Sud (formes tropicales ou idiopathiques), contre environ 5 % en Australie et 7 % en Corée du Sud (formes surtout alcooliques) (Endotext 2024 ; HaPanEU 2017).</p>
<p>Le diabète de type 3c dans son ensemble représente environ <b>1 à 9 %</b> de tous les diabètes et reste souvent sous-diagnostiqué. Ses étiologies se répartissent ainsi : pancréatite chronique 79 %, néoplasie 8 %, hémochromatose 7 %, mucoviscidose 4 %, pancréatectomie 2 % (Revue médicale suisse 2022).</p>
<div class="trap"><span class="k">Lacune assumée</span> Aucune donnée de prévalence suisse, ni chez les migrants originaires de pays à revenu faible, n’a été trouvée dans les sources lues. Le cours ne l’extrapole pas : en Suisse, l’entité se rencontrerait d’abord comme diagnostic d’exclusion chez un adulte maigre issu de la migration.</div>
</section>
<section class="ilot" id="e12-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le raisonnement se fait en trois temps : ce qui est normal, ce qui est perturbé, ce qui se manifeste. Chez un sujet sain, l’insuline sécrétée par les cellules bêta freine la production hépatique de glucose et favorise sa captation par le muscle. Chez un diabétique de type 2, ce couple est altéré par la résistance à l’insuline. Chez le patient de l’étude de Vellore, c’est la sécrétion qui est en cause.</p>
<p><b>Ce que montrent les mesures.</b> Chez des hommes dont la glucotoxicité avait été corrigée deux semaines avant, la sécrétion totale d’insuline au repas test était plus basse que chez les témoins maigres et les diabétiques de type 2, mais plus élevée que chez les diabétiques de type 1. Le C-peptide à jeun (médianes) valait 1,2 ng/mL chez les sujets à IMC bas, 0,1 chez les diabétiques de type 1 et 2,1 chez les diabétiques de type 2. La production hépatique de glucose était de 0,50 ± 0,1 mg/kg·min contre 0,84 ± 0,1 pour le type 2, et la captation périphérique de 10,1 ± 0,7 contre 4,2 ± 0,5. La graisse viscérale et les lipides hépatocellulaires étaient plus bas que dans le type 2, et la masse maigre totale la plus basse de tous les groupes (Diabetes Care 2022).</p>
<figure><svg viewBox="0 0 640 250" role="img" aria-label="Figure 1 — Production hépatique de glucose et captation périphérique : sujets à IMC bas et diabétiques de type 2"><g fill="none" stroke="currentColor" stroke-width="1.6"><path d="M70 30v170h520"/><rect x="110" y="143" width="60" height="57" fill="currentColor" fill-opacity=".15"/><rect x="190" y="116" width="60" height="84" fill="currentColor" fill-opacity=".5"/><rect x="370" y="60" width="60" height="140" fill="currentColor" fill-opacity=".15"/><rect x="450" y="153" width="60" height="47" fill="currentColor" fill-opacity=".5"/></g><g fill="currentColor" font-size="13" text-anchor="middle"><text x="140" y="136">0,50</text><text x="220" y="109">0,84</text><text x="400" y="53">10,1</text><text x="480" y="146">4,2</text><text x="180" y="222" font-size="14">Production hépatique de glucose</text><text x="440" y="222" font-size="14">Captation périphérique du glucose</text><text x="140" y="240">IMC bas</text><text x="220" y="240">Type 2</text><text x="400" y="240">IMC bas</text><text x="480" y="240">Type 2</text></g></svg><figcaption>Figure 1 — Données de l’étude de Vellore (Diabetes Care 2022), en mg/kg·min, après correction de la glucotoxicité. Les barres claires représentent les sujets diabétiques à IMC bas, les barres foncées les diabétiques de type 2. Le foie freine mieux sa production de glucose (0,50 contre 0,84) et le muscle capte plus de glucose (10,1 contre 4,2) : la sensibilité à l’insuline est conservée. Hommes seulement, petit effectif ; schéma non calibré à l’échelle d’un patient.</figcaption></figure>
<p>Le foie et le muscle restent donc sensibles à l’insuline : le diabète naît d’un défaut de sécrétion, pas d’une résistance. Voir <button class="w" data-k="e12-vellore">l’étude de Vellore (méthode, résultats, limites)</button>.</p>
<p><b>Pourquoi l’acidocétose manque.</b> La sécrétion résiduelle d’insuline suffit à freiner la cétogenèse, sans empêcher les excursions glycémiques après les repas. L’absence de cétose a aussi été attribuée à une mobilisation retardée des acides gras libres et à une suppression post-prandiale du glucagon (Diabetes Care 2022). Le mécanisme éclaire le risque thérapeutique : le patient n’a pas la carence absolue qui justifierait des doses complètes d’insuline. Voir <button class="w" data-k="e12-cetose">explication de la résistance à la cétose</button>.</p>
<p><b>Pourquoi les besoins en insuline paraissaient élevés.</b> Cette impression venait des observations cliniques anciennes ; les études physiologiques montrent une sensibilité à l’insuline normale (Lancet Global Health 2025 ; Diabetes Care 2022).</p>
<p><b>Hypothèses pathogéniques.</b> Le consensus retient une dénutrition intra-utérine puis persistante pendant l’enfance et l’adolescence, qui fait « sous-performer » les cellules bêta. Il oppose cette trajectoire à celle du diabète de type 2, où un faible poids de naissance suivi d’une suralimentation entraîne rattrapage de croissance, adiposité, graisse ectopique et insulinorésistance. Une carence en antioxydants (vitamines A, C, E, catalase, glutathion peroxydase) altérerait les facteurs de transcription PDX-1 et MafA, d’où un défaut d’expression du gène de l’insuline ; l’excès d’espèces réactives de l’oxygène favoriserait l’apoptose et réduirait la masse bêta. Comme la plupart des sujets dénutris ne deviennent pas diabétiques, des facteurs génétiques ou épigénétiques interviennent probablement : la physiopathologie est multifactorielle (Lancet Global Health 2025). Voir <button class="w" data-k="e12-pdx">antioxydants, PDX-1 et MafA</button>.</p>
<p><b>Pancréatopathie fibrocalculeuse.</b> Sa phase pré-diabétique est la <b>pancréatite chronique tropicale</b> ; le terme de FCPD désigne la maladie une fois le diabète établi. La pathogenèse reste non élucidée : stress oxydatif, carences en micronutriments, toxines alimentaires (le lien avec le manioc est jugé douteux) et auto-immunité sont évoqués, sans preuve concluante, et la dénutrition y serait plutôt une conséquence. Des variants de SPINK1 (N34S chez environ 33 % des patients en Inde), PRSS1, PRSS2 et du chymotrypsinogène C suggèrent un modèle « à deux coups ». Dans le diabète de la FCPD, la sécrétion basale et stimulée d’insuline est réduite ; la cétose est rare grâce à la sécrétion résiduelle, à une réserve de glucagon diminuée par la destruction des cellules alpha et à un substrat lipidique réduit. Une insulinorésistance hépatique est possible, attribuée notamment à un déficit en polypeptide pancréatique (Endotext 2024 ; Revue médicale suisse 2022). Voir <button class="w" data-k="e12-spink1">génétique de la pancréatite chronique tropicale</button>.</p>
<p>Dans le diabète de type 3c, la fibrose détruit les îlots bêta et alpha ; la résistance hépatique à l’insuline s’explique par la baisse du polypeptide pancréatique et par des cytokines ; la maldigestion diminue les incrétines (GLP-1, GIP) et, secondairement, la sécrétion d’insuline (Revue médicale suisse 2022).</p>
<div class="key"><b>Science → clinique.</b> Défaut de sécrétion sans résistance : la glycémie monte surtout après les repas, la cétose manque, et l’insuline à pleines doses expose à l’hypoglycémie. Dans la FCPD, la destruction du glucagon et la maldigestion ajoutent un risque d’instabilité glycémique.</div>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer à la dénutrition seule le diabète : l’OMS a retiré la classe en 1999 faute de preuve de causalité, et la revue critique de 2025 rappelle que la dénutrition serait plus souvent une conséquence. La phrase correcte est « association, hypothèse pathogénique plausible, causalité non démontrée ».</div>
</section>
<section class="ilot" id="e12-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Pour le diabète de malnutrition, les facteurs décrits sont la dénutrition fœtale et infantile (faible poids de naissance, malnutrition aiguë sévère, retard de croissance), la dénutrition persistante à l’âge adulte, la pauvreté, la ruralité et un faible apport protéique (Lancet Global Health 2025 ; Diabetes Care 2022). Des données animales et humaines soutiennent le lien : progéniture de rongeurs soumis à une carence protéique maternelle avec masse bêta réduite, nouveau-nés petits pour l’âge gestationnel avec moins d’îlots et moins de vascularisation pancréatique, cohortes de famine.</p>
<p>Pour la FCPD, le diagnostic suppose l’absence de cause secondaire de pancréatite (l’alcool notamment) ; le terrain génétique (SPINK1 et autres) joue un rôle, et les facteurs environnementaux restent non identifiés (Endotext 2024 ; Acta Diabetologica 2015).</p>
<p>Dans toute pancréatite chronique, le risque de diabète augmente avec la chirurgie (surtout la pancréatectomie distale), l’âge, un tabagisme important, les calcifications et la durée d’évolution ; les mutations génétiques ne semblent pas modifier ce risque (HaPanEU 2017).</p>
<div class="key"><b>À retenir.</b> Le contexte nutritionnel oriente vers le « type 5 », le contexte de pancréatite vers la FCPD ou le type 3c. L’anamnèse nutritionnelle et l’imagerie du pancréas tranchent entre les deux.</div>
</section>
<section class="ilot" id="e12-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord le <b>terrain nutritionnel</b>, puis des indices de pancréatopathie, enfin des arguments contre les autres diabètes.</p>
<div class="lab">Antécédents et contexte</div><p>Le médecin note l’origine géographique (pays à revenu faible, zone rurale, tropiques), le statut socio-économique et la sécurité alimentaire. Il demande le poids de naissance, la malnutrition de la petite enfance et le retard de croissance (Lancet Global Health 2025). Il vérifie l’absence d’épisode d’acidocétose, critère d’inclusion des études (Diabetes Care 2022). Il exclut les antécédents familiaux évoquant un MODY (diabète monogénique), des signes de lipodystrophie et une insulinorésistance clinique.</p>
<div class="lab">Symptômes</div><p>Dans le diabète de malnutrition, les symptômes sont ceux d’une hyperglycémie modérée à sévère, sans cétose. Le tableau suivant sépare les deux formes à reconnaître.</p>
<div class="two"><div class="card"><h4>Forme « type 5 » : sujet maigre dénutri</h4><p>Pas de douleur pancréatique, pas de stéatorrhée. L’histoire est nutritionnelle : dénutrition dès l’enfance, bas niveau socio-économique, origine rurale. Le pancréas est normal en imagerie. Le typage biologique (<button class="w" data-k="e12-cpept">C-peptide bas, anticorps négatifs</button>) confirme le défaut sécrétoire.</p>
</div><div class="card"><h4>Forme FCPD : pancréatopathie tropicale</h4><p>Douleurs abdominales récurrentes <b>depuis l’enfance</b> (épigastre, irradiation dorsale, soulagées en antéflexion ou décubitus ventral), puis <b>stéatorrhée</b> (selles huileuses, mousseuses). Le diabète apparaît en général 10 à 20 ans après le début des douleurs, entre 15 et 35 ans (Endotext 2024). Voir <button class="w" data-k="e12-douleur">sémiologie de la douleur pancréatique</button>.</p>
</div></div>
<p>Pour un diabète pancréatoprive en général, la Revue médicale suisse (2022) liste comme éléments en faveur : l’absence de syndrome métabolique, l’alcool ou le tabac, un antécédent de pancréatite, des douleurs abdominales chroniques, un antécédent familial de pancréatite chronique, une stéatorrhée, une perte de poids inexpliquée et un ictère.</p>
<div class="trap"><span class="k">Piège</span> L’absence de douleur ne retire pas la FCPD : le diagnostic repose sur l’imagerie. Inversement, l’absence de cétose ne prouve pas un « type 5 », car la FCPD n’en donne pas non plus.</div>
<div class="quiz ui"><p>Un homme de 22 ans, IMC 17 kg/m², raconte des douleurs épigastriques irradiant dans le dos depuis l’âge de 8 ans, des selles huileuses, puis un diabète découvert à 20 ans. Quelle hypothèse est la plus cohérente ?</p><button data-ok="0">A. Diabète de type 1 auto-immun : la maigreur et l’âge jeune suffisent.</button><button data-ok="1">B. FCPD : l’histoire douloureuse puis stéatorrhéique précède le diabète ; l’imagerie pancréatique est indiquée.</button><button data-ok="0">C. Diabète de malnutrition sans pancréatopathie : les douleurs sont sans rapport.</button><p class="fb" hidden>Réponse B. Les douleurs depuis l’enfance, puis la stéatorrhée, puis un diabète 10 à 20 ans plus tard définissent le portrait de la FCPD (Endotext 2024). Le « type 5 » suppose au contraire un pancréas normal en imagerie (Lancet Global Health 2025).</p></div>
</section>
