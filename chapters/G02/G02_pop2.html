<template data-pop="g02-d-aciclovir" data-title="Aciclovir intraveineux : Labatec®"><div class="lab">Indications et doses</div><p>Adulte et plus de 12 ans : herpès simplex 5 mg/kg toutes les 8 heures ; zona de l’immunocompétent 5 mg/kg toutes les 8 heures ; zona de l’immunodéprimé à fonction rénale normale 10 mg/kg toutes les 8 heures pendant au moins 5 jours ; encéphalite herpétique 10 mg/kg toutes les 8 heures pendant 10 jours. Enfant de 3 mois à 12 ans : 250 mg/m² toutes les 8 heures. Nouveau-né : 20 mg/kg toutes les 8 heures, 21 jours en cas d’atteinte du système nerveux. Perfusion lente en une heure.</p><div class="lab">Adaptation rénale</div><p>Clairance supérieure à 50 ml/min : dose usuelle toutes les 8 heures ; 25–50 : toutes les 12 heures ; 10–25 : toutes les 24 heures.</p><div class="lab">Effets indésirables et précautions</div><p>Hydratation suffisante ; fonction rénale à surveiller aux fortes doses. Neurotoxicité (confusion, hallucinations, convulsions, coma) surtout en insuffisance rénale ou chez le sujet âgé, réversible, avec dialyse souvent efficace. Allaitement déconseillé.</p><div class="lab">Limites</div><p>L’information professionnelle ne comporte aucune indication « méningite » : le dosage dans la méningite est une extrapolation. Le palier de clairance inférieur à 10 ml/min et la dialyse n’ont pas été relevés.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-aciclovir-duree" data-title="Contentieux : 10 jours ou au moins 14 jours d’aciclovir dans l’encéphalite herpétique ?"><div class="lab">Les deux textes</div><p>L’information professionnelle suisse (mise à jour de décembre 2025) indique 10 mg/kg toutes les 8 heures pendant <b>10 jours</b>. La directive S1 de la Société allemande de neurologie (février 2025) recommande 10 mg/kg trois fois par jour pendant <b>au moins 14 jours</b>.</p><div class="lab">Arbitrage</div><p>La règle du cours est que la source primaire applicable la plus récente l’emporte. Le texte en vigueur le plus récent est l’information professionnelle suisse ; elle fixe la durée autorisée du produit en Suisse. La directive, plus ancienne mais spécifique à l’encéphalite, propose une durée plus longue sans que les sources lues expliquent l’écart. La présentation retient donc : durée de l’information professionnelle comme repère réglementaire, et durée de la directive comme alternative lue à connaître.</p><div class="lab">Limite</div><p>Ce choix est un arbitrage de rédaction, non une décision clinique : la durée finale dépend de l’évolution et de l’avis spécialisé.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-d-valaciclovir" data-title="Valaciclovir : Mepha® et prévention des récidives"><p>L’information professionnelle suisse concerne les atteintes cutanéo-muqueuses (herpès génital, prévention des récidives, au maximum 12 mois avant réévaluation) ; elle ne comporte pas d’indication méningée. Adaptation rénale et neurotoxicité figurent comme pour l’aciclovir. Dans l’essai suédois de 101 adultes, 2 × 500 mg par jour pendant un an après 1 g trois fois par jour pendant une semaine n’ont pas empêché les récidives méningées (rebond la deuxième année, rapport de risques de 3,29).</p><p class="src">Références : <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680589210088" target="_blank" rel="noopener">Information professionnelle suisse Valaciclovir-Mepha®, décembre 2025</a>.</p></template>
<template data-pop="g02-d-brivudine" data-title="Brivudine : alternative et contre-indication"><p>La brivudine est citée comme alternative dans le zona. Elle est <b>contre-indiquée avec les fluoropyrimidines</b> (5-fluoro-uracile, capécitabine, tégafur, flucytosine) jusqu’à quatre semaines après leur arrêt : la toxicité est potentiellement mortelle. Les posologies n’ont pas été lues dans les sources du dossier.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-d-ambisome" data-title="Amphotéricine B liposomale : AmBisome®"><div class="lab">Doses</div><p>Induction standard : 3–6 mg/kg/j en association pendant au moins 14 jours ; induction à haute dose : 10 mg/kg au 1er jour avec flucytosine 100 mg/kg/j et fluconazole 1200 mg/j pendant 14 jours. L’essai AMBITION compare la dose unique (mortalité 24,8 %) à la voie standard (28,7 %).</p><div class="lab">Toxicité</div><p>Moindre néphrotoxicité que la forme conventionnelle, mais réelle ; hypokaliémie 19 % ; hyperkaliémie possible. Surveillance du potassium, du magnésium, des fonctions rénale et hépatique et de l’hémogramme.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a>.</p></template>
<template data-pop="g02-d-flucytosine" data-title="Flucytosine : lacune suisse"><p>Dans la cryptococcose, la flucytosine (25 mg/kg 4 fois par jour) est associée à l’amphotéricine B liposomale en induction. Aucune information professionnelle suisse n’a été trouvée par la recherche « flucytosin » : son statut d’autorisation en Suisse n’est pas vérifié. Elle interagit avec la brivudine.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-d-fluconazole" data-title="Fluconazole : Sandoz® eco"><p>Méningite : 400 mg le premier jour, puis 200–400 mg/j (jusqu’à 800 mg si menace vitale), au moins 6 à 8 semaines. Prophylaxie des récidives : 200 mg/j, durée illimitée. La concentration dans le liquide atteint environ 80 % de la concentration plasmatique en cas de méningite. Prudence avec l’intervalle QT et les substrats du CYP3A4. En consolidation de la cryptococcose : 400–800 mg/j pendant 8 semaines, puis 200 mg/j pendant 12 mois.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></template>
<template data-pop="g02-d-fexinidazole" data-title="Fexinidazole : trypanosomiase africaine"><p>Antiparasitaire oral recommandé par l’OMS pour la forme gambiense depuis 2019 et désormais pour la forme rhodesiense. L’efficacité dépend de la prise après un repas et d’une cure complète de dix jours ; à défaut, une alternative est nécessaire. Les autres schémas (NECT, mélarsoprol, acoziborole) n’ont pas été lus.</p><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p></template>
<template data-pop="g02-interactions" data-title="Interactions et précautions"><table class="t"><thead><tr><th>Association</th><th>Risque</th><th>Conduite</th></tr></thead><tbody><tr><td>Brivudine + fluoropyrimidines</td><td>Toxicité potentiellement mortelle</td><td>Contre-indiquée, jusqu’à 4 semaines après l’arrêt</td></tr><tr><td>Fluconazole + substrats du CYP3A4 ou médicaments allongeant le QT</td><td>Interactions, allongement du QT</td><td>Prudence</td></tr><tr><td>Aciclovir + insuffisance rénale ou âge avancé</td><td>Neurotoxicité</td><td>Adapter la dose, hydrater, dialyser si besoin</td></tr></tbody></table><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680562350145" target="_blank" rel="noopener">Information professionnelle suisse Fluconazole Sandoz® eco, juillet 2025</a>.</p></template>
<template data-pop="g02-eviter" data-title="Médicaments à éviter : justification"><p>Le valaciclovir préventif n’a pas montré de bénéfice. Les corticoïdes systématiques, l’acétazolamide et le mannitol sont possiblement délétères dans la cryptococcose. La brivudine est dangereuse avec les fluoropyrimidines. L’amphotéricine B désoxycholate n’est recommandée pour aucune indication de la candidose (ESCMID 2012).</p><p class="src">Références : <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://doi.org/10.1111/1469-0691.12039" target="_blank" rel="noopener">ESCMID, maladies à Candida, 2012</a>.</p></template>
<template data-pop="g02-mnemo" data-title="Aides pédagogiques (non critères officiels)"><p><b>2-8-12</b> : induction 2 semaines, consolidation 8 semaines, entretien 12 mois dans la cryptococcose. <b>CCF</b> : Conscience altérée, Crise, signe Focal → aciclovir immédiat. Ces mnémoniques sont une aide pédagogique, non un critère officiel.</p></template>
<template data-pop="pareto-g02-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="g02-0,g02-1,g02-2,g02-3,g02-4,g02-5,g02-6"></p><ul><li>Le code G02* est un astérisque : il accompagne toujours le code † de la maladie causale ; méningite sans agent = G03.0 ; atteinte du parenchyme = G05.1*.</li><li>La méningite virale respecte la conscience : pas de signe focal, moins de 1000 cellules par µl, protéines et lactate peu élevés.</li><li>Entérovirus 39 %, herpès simplex de type 2 16 %, varicelle-zona 15 %, inconnu 27 % ; incidence 4,7 pour 100 000 par an (Danemark).</li><li>Le liquide précoce est mixte (4–48 h), puis lymphocytaire ; un liquide à granulocytes n’exclut pas un virus.</li><li>La triade complète n’existe que chez 28 % ; l’absence de raideur de nuque n’exclut rien.</li><li>Contextes à chercher : immunodépression, VIH, voyage, tique, herpès génital, zona, médicaments.</li></ul></template>
<template data-pop="pareto-g02-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="g02-7,g02-8"></p><ul><li>Procalcitonine inférieure à 0,5 ng/ml : orientation virale ; elle est toujours élevée dans les méningites bactériennes aiguës.</li><li>PCR du liquide en première intention ; indice d’anticorps tardif (après 10 jours).</li><li>Signe d’encéphalite → aciclovir i.v. immédiat, sans attendre la ponction ni la PCR.</li><li>Doute bactérien → céphalosporine de 3e génération + ampicilline.</li><li>Cryptococcose : pression d’ouverture d’au moins 20 cm d’eau = ponctions évacuatrices.</li></ul></template>
<template data-pop="pareto-g02-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="g02-9,g02-10,g02-11"></p><ul><li>Méningite virale isolée : traitement symptomatique ; la PCR rapide des entérovirus permet d’arrêter les antibiotiques.</li><li>Valaciclovir préventif des récidives de méningite à herpès simplex de type 2 : non recommandé.</li><li>Aciclovir : 10 mg/kg/8 h dans l’encéphalite, 10 jours (information professionnelle) ou au moins 14 jours (directive S1).</li><li>Brivudine contre-indiquée avec les fluoropyrimidines (dont la flucytosine).</li><li>Cryptococcose : amphotéricine B liposomale + flucytosine 2 semaines, fluconazole 8 semaines puis 12 mois, antirétroviral à 4–6 semaines.</li><li>Prévention des oreillons, de la rougeole et de la rubéole par le vaccin ROR/RORV.</li></ul></template>
<template data-pop="pareto-g02-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="g02-12,g02-13,g02-14"></p><ul><li>Pronostic défavorable à 30 jours chez 20 % des adultes, quel que soit le virus.</li><li>Mollaret : 22 % des méningites à herpès simplex de type 2 évoluent ainsi ; récidive hospitalisée 6 % par an.</li><li>Elsberg : rétention urinaire chez tous ; 11 % encore sondés à 30 jours.</li><li>Cryptococcose : mortalité 24–47 % à 10 semaines.</li><li>Nouveau-né : aciclovir 20 mg/kg/8 h, 21 jours en cas d’atteinte du système nerveux.</li></ul></template>
<template data-pop="pareto-g02-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g02-e-1,g02-e-2,g02-e-3,g02-e-4,g02-e-5,g02-e-6"></p><ul><li>Question avant examen : écarter l’urgence, puis caractériser le liquide, puis identifier l’agent.</li><li>Liquide : moins de 5 cellules normalement ; viral : moins de 1000 par µl.</li><li>PCR d’ADN pour les herpèsvirus, PCR d’ARN pour les entérovirus.</li><li>IRM, méthode de choix dans l’encéphalite ; scanner insuffisant.</li><li>Cryptocoque : pression d’ouverture, antigène du liquide et du sang, culture.</li></ul></template>
<template data-pop="pareto-g02-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g02-p-1,g02-p-2,g02-p-3,g02-p-4,g02-p-5,g02-p-6"></p><ul><li>Aciclovir i.v. : seule molécule indispensable à l’encéphalite herpétique ; adapter à la clairance.</li><li>Amphotéricine B liposomale : surveiller le potassium (hypokaliémie 19 %).</li><li>Fluconazole : QT et CYP3A4.</li><li>À éviter : valaciclovir préventif, dexaméthasone systématique, acétazolamide, mannitol, brivudine avec fluoropyrimidine.</li></ul></template>
<template data-pop="pareto-g02-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="g02-s-physio-body"></p><ul><li>Moins de 5 leucocytes par µl normalement.</li><li>Phase mixte puis lymphocytaire.</li><li>La pression élevée explique la baisse visuelle et auditive de la cryptococcose.</li></ul></template>
<template data-pop="pareto-g02-s-immu" data-title="Pareto — Immunologie"><p class="ratio" data-cover="g02-s-immu-body"></p><ul><li>Pas de synthèse intrathécale dans la méningite virale.</li><li>Indice supérieur à 1,5 après plus de 10 jours dans l’encéphalite.</li><li>L’immunosuppression élargit les agents à rechercher.</li></ul></template>
<template data-pop="pareto-g02-s-viro" data-title="Pareto — Virologie"><p class="ratio" data-cover="g02-s-viro-body"></p><ul><li>PCR d’ADN : herpèsvirus ; PCR d’ARN : entérovirus et VIH.</li><li>PCR rapide : 60 h → 5 h.</li><li>La PCR du virus d’Epstein-Barr peut être faussement positive en cas de pléiocytose.</li></ul></template>
<template data-pop="pareto-g02-s-myco" data-title="Pareto — Mycologie et parasitologie"><p class="ratio" data-cover="g02-s-myco-body"></p><ul><li>Certains tests d’antigène manquent C. gattii.</li><li>Gambiense : lent, 92 % des cas ; rhodesiense : rapide.</li><li>Stade 2 : troubles du sommeil, coma.</li></ul></template>
