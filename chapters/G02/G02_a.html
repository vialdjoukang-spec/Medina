<section class="ilot" id="g02-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p>
<p>Un homme de 27 ans consulte aux urgences après deux jours de céphalées intenses, de fièvre à 38,6 °C et d’une gêne à la lumière. Il est vigil, sans déficit moteur ni crise. La nuque résiste à la flexion. La ponction lombaire ramène un liquide clair contenant 210 cellules par µl, presque toutes des lymphocytes. La <button class="w" data-k="g02-pct">procalcitonine</button> sanguine mesure 0,2 ng/ml. Une <button class="w" data-k="g02-pcr-rapide-ev">PCR rapide des entérovirus</button> rend un résultat positif cinq heures après le prélèvement. <b>Les antibiotiques commencés par prudence peuvent être arrêtés et le patient peut rentrer, car la question décisive n’est pas « quel virus ? » mais « ce tableau cache-t-il une urgence qui ne tolère aucun retard ? ».</b></p>
<p>Une <button class="w" data-k="g02-meningo-enceph">méningite virale</button> guérit le plus souvent seule. Deux diagnostics voisins, en revanche, engagent le pronostic en quelques heures : la méningite bactérienne et l’encéphalite herpétique. Le médecin doit donc, dans l’ordre, (1) écarter ces deux urgences ou les traiter sans attendre, (2) identifier l’agent par <button class="w" data-k="g02-pcr-lcr">PCR du liquide céphalo-rachidien</button> afin de ne pas prolonger inutilement antibiotiques et hospitalisation, et (3) reconnaître les contextes qui changent la conduite : immunodépression, récidives, voyage en zone tropicale.</p>
<p>Ce chapitre traite la catégorie G02*, c’est-à-dire la méningite <i>au cours</i> d’une maladie infectieuse ou parasitaire non bactérienne, classée à part. En pratique européenne, l’immense majorité des cas relève de trois virus : les entérovirus, le virus herpès simplex de type 2 et le virus varicelle-zona. La <button class="w" data-k="g02-cryptocoque">cryptococcose</button> est la méningite fongique de l’immunodéprimé. La trypanosomiase africaine appartient à la médecine des voyages et de la migration.</p>
<div class="key"><b>Point de départ.</b> Le diagnostic repose sur trois piliers : le <button class="w" data-k="g02-triade">tableau méningé sans signe d’encéphalite</button>, un <button class="w" data-k="g02-lcr-normal">liquide céphalo-rachidien lymphocytaire</button> et l’<button class="w" data-k="g02-hsve">exclusion de l’encéphalite herpétique et de la méningite bactérienne</button>.</div>
<p>Le chapitre suit l’ordre d’une consultation : définir et classer (îlots 1 à 3), comprendre le mécanisme et recueillir les indices (îlots 4 à 6), poser le diagnostic et reconnaître l’urgence (îlots 7 et 8), traiter (îlots 9 à 11), puis surveiller et trancher les situations particulières (îlots 12 à 14).</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a>.</p></section>
<section class="ilot" id="g02-1"><h2><span class="n">1</span>Définitions et logique de codage</h2><p>Une <b>méningite virale</b> associe des céphalées, des nausées, parfois des vomissements, une raideur de nuque, une photophobie et une phonophobie. Elle ne comporte <b>ni signe focal ni trouble de la conscience</b>. Le liquide céphalo-rachidien contient moins de 1000 cellules par µl ; ses protéines et son lactate sont normaux ou à peine élevés. L’évolution est spontanément favorable en quelques jours à quelques semaines (<button class="w" data-k="g02-sources-guides">directive S1 de la Société allemande de neurologie</button>, 2025).</p>
<p>Une <b>méningo-encéphalite</b> ajoute un trouble quantitatif ou qualitatif de la conscience, souvent des signes focaux (parésie, aphasie) ou des crises ; le méningisme peut même manquer. Les <button class="w" data-k="g02-criteres-ie">critères de l’International Encephalitis Consortium</button> formalisent cette bascule : un critère majeur (altération de la conscience, de la personnalité ou manifestation psychiatrique pendant plus de 24 heures sans autre cause) et des critères mineurs. Cette frontière est la plus importante du chapitre, car elle sépare une maladie le plus souvent bénigne d’une urgence thérapeutique.</p>
<h3>Une catégorie astérisque</h3>
<p>G02* est une <b>catégorie à astérisque</b> : elle code la <i>manifestation</i> méningée, tandis que la maladie causale porte son propre code à croix (†). Le code G02* ne s’emploie donc jamais seul ; il accompagne le code de la maladie à l’origine de la méningite. La <button class="w" data-k="g02-codage">règle de double codage</button> détaille cette logique. L’exclusion est explicite : la méningo-encéphalite et la méningomyélite au cours de ces maladies se codent G05.1* (virales) et G05.2* (autres infectieuses et parasitaires).</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Intitulé (OFS)</th><th>Affections causales incluses (code †)</th></tr></thead><tbody><tr><td>G02.0*</td><td>Méningite au cours d’infections virales classées ailleurs</td><td>Adénovirus (A87.1†), entérovirus (A87.0†), herpès simplex (B00.3†), mononucléose infectieuse (B27.-†), rougeole (B05.1†), oreillons (B26.1†), rubéole (B06.0†), varicelle (B01.0†), zona (B02.1†)</td></tr><tr><td>G02.1*</td><td>Méningite au cours de mycoses classées ailleurs</td><td>Candidose (B37.5†), coccidioïdomycose (B38.4†), cryptococcose (B45.1†)</td></tr><tr><td>G02.8*</td><td>Méningite au cours d’autres maladies infectieuses et parasitaires précisées classées ailleurs</td><td>Trypanosomiase africaine (B56.-†), maladie de Chagas chronique (B57.4†)</td></tr></tbody></table>
<p>Le tableau se lit ligne par ligne : la colonne de droite indique la maladie qui reçoit le code à croix, celle de gauche la méningite qui reçoit le code à astérisque. Retenir G02.0* pour toute méningite « virale » est pourtant une erreur de voisinage : quand le virus n’est pas identifié, le codage relève de G03.0, la méningite non purulente (dite abactérienne). Les <button class="w" data-k="g02-voisinages">voisins G01*, G03 et G05*</button> se distinguent par l’agent, non par la gravité.</p>
<div class="trap"><span class="k">Piège</span> Une méningite lymphocytaire dont le virus reste inconnu n’est pas une G02.0*. Sans agent identifié, il n’existe pas de maladie causale à coder en croix : le code est G03.0.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></section>
<section class="ilot" id="g02-2"><h2><span class="n">2</span>Classer par agent, par syndrome et par urgence</h2><p>Quatre classements se complètent, parce qu’ils répondent à quatre questions différentes.</p>
<ol><li><b>Par agent</b> (structure de la CIM) : viral (G02.0*), fongique (G02.1*), parasitaire (G02.8*). Ce classement sert au codage et à l’épidémiologie.</li>
<li><b>Par syndrome</b> (directive S1, tableau 1) : méningite aseptique (coxsackie, échovirus, adénovirus, herpès simplex de type 2, varicelle-zona, virus Toscana, poliovirus, rougeole, FSME, oreillons, virus d’Epstein-Barr, rubéole, entérovirus 71, VIH, parvovirus B19, herpèsvirus humain 6, dengue) ; méningo-encéphalite ; atteinte des nerfs crâniens (varicelle-zona, herpès simplex, cytomégalovirus, VIH, FSME, oreillons). Ce classement guide la clinique.</li>
<li><b>Par évolution</b> : aiguë, récidivante bénigne (<button class="w" data-k="g02-mollaret">méningite de Mollaret</button>, surtout liée à l’herpès simplex de type 2), chronique ou subaiguë (cryptocoque).</li></ol>
<p>Le quatrième classement mérite plus d’attention, car il hiérarchise l’<b>effort diagnostique</b> selon la possibilité d’agir. La directive S1 distingue <button class="w" data-k="g02-dgn-niveaux">quatre niveaux</button>.</p>
<table class="t"><thead><tr><th>Niveau</th><th>Contenu</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>1</td><td>Virus pour lesquels un traitement existe : herpès simplex 1 et 2, varicelle-zona, cytomégalovirus, VIH</td><td>Recherche systématique et rapide, car un antiviral change le pronostic</td></tr><tr><td>2</td><td>Traitement potentiel non disponible : virus d’Epstein-Barr, échovirus et coxsackie</td><td>Identification utile surtout pour arrêter les autres traitements</td></tr><tr><td>3</td><td>Virus fréquents sans traitement : FSME, adénovirus, herpèsvirus humain 6, rougeole, rubéole</td><td>Recherche selon le contexte épidémiologique</td></tr><tr><td>4</td><td>Constellations particulières : poliovirus, rage, LCMV, hantavirus, voyage</td><td>Recherche guidée par l’anamnèse</td></tr></tbody></table>
<p>Ce dernier tableau explique pourquoi le laboratoire demande d’abord les herpèsvirus : le niveau 1 regroupe les agents dont l’identification déclenche un geste thérapeutique. Les échovirus et les coxsackie relèvent du niveau 2 ; leur recherche reste pourtant précieuse, car un résultat positif rapide permet de renoncer aux antibiotiques (<button class="w" data-k="g02-pcr-rapide-ev">effet de la PCR rapide</button>).</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></section>
<section class="ilot" id="g02-3"><h2><span class="n">3</span>Épidémiologie</h2><p>Les chiffres les mieux établis proviennent de la <button class="w" data-k="g02-cohorte-danoise"><b>cohorte nationale prospective danoise 2015–2020</b></button>, qui a recensé 1066 épisodes de méningite virale de l’adulte. L’incidence atteint <b>4,7 pour 100 000 personnes par an</b>. L’âge médian est de 33 ans et 54 % des patients sont des femmes. Le virus est identifié dans 73 % des épisodes.</p>
<table class="t"><thead><tr><th>Agent</th><th>Part des épisodes</th><th>Particularité (cohorte danoise)</th></tr></thead><tbody><tr><td><button class="w" data-k="g02-enterovirus">Entérovirus</button></td><td>39 %</td><td>Cause la plus fréquente de méningite aseptique</td></tr><tr><td>Herpès simplex de type 2</td><td>16 %</td><td>77 % de femmes</td></tr><tr><td><button class="w" data-k="g02-vzv">Varicelle-zona</button></td><td>15 %</td><td>Immunosuppression 20 % ; zona concomitant 60 %</td></tr><tr><td>Autres virus</td><td>3 %</td><td>—</td></tr><tr><td>Non identifié</td><td>27 %</td><td>Pronostic comparable aux épisodes identifiés</td></tr></tbody></table>
<p>La somme des lignes à agent identifié (39 + 16 + 15 + 3 = 73 %) ajoutée aux 27 % de cas sans agent donne 100 %. La proportion de cas sans virus identifié rappelle que le laboratoire ne répond pas toujours : l’absence de résultat n’autorise pas à écarter une cause virale.</p>
<h3>Repères suisses</h3>
<ul><li>À Genève (Hôpitaux universitaires, 2013–2015), l’<b>échovirus 30</b> prédomine chez l’enfant de 3 ans et plus et chez l’adulte. Chez l’enfant, l’infection entérovirale est disséminée (sang, selles) ; chez l’adulte, aucun cas n’était positif dans les selles ni dans le sang.</li>
<li>Les oreillons causent moins de 1000 cas par an en Suisse ces dernières années. La méningite est l’une des complications les plus fréquentes chez l’enfant et guérit en général sans séquelle (OFSP).</li>
<li>La <button class="w" data-k="g02-fsme">FSME</button>, voisine mais classée en A84, a compté 245 cas en Suisse en 2023 ; tous les cantons sauf le Tessin sont considérés comme zones à risque.</li></ul>
<p>Après les entérovirus viennent, par fréquence décroissante, le virus ourlien, les arbovirus, les herpèsvirus, le VIH et le LCMV ; la vaccination a fait reculer la méningite ourlienne.</p>
<h3>Situations à part</h3>
<ul><li><b>Récidive</b> : l’incidence de la <button class="w" data-k="g02-mollaret">méningite de Mollaret</button> est de 1,2 par million d’adultes et par an ; 22 % (intervalle de confiance à 95 % : 15–30 %) des méningites à herpès simplex de type 2 évoluent vers une forme récidivante.</li>
<li><b>Cryptococcose</b> : troisième infection fongique invasive du transplanté d’organe solide ; 50 à 70 % des infections à <i>C. gattii</i> touchent des hôtes apparemment immunocompétents ; mortalité de la méningite de 24 à 47 % à 10 semaines.</li>
<li><b><button class="w" data-k="g02-tha">Trypanosomiase africaine</button></b> : la forme gambiense (Afrique occidentale et centrale, évolution lente) a représenté 92 % des cas de 2018 à 2022 ; la forme rhodesiense (Afrique orientale et australe) évolue vite.</li></ul>
<div class="key"><b><button class="w" data-k="g02-lacunes">Lacune assumée.</button></b> Aucune recommandation suisse dédiée à la méningite virale ou fongique n’a été retrouvée ; les repères suisses ci-dessus proviennent d’études de Lausanne et de Genève et des pages de l’OFSP. Les chiffres annuels suisses d’entérovirus et de FSME pour 2024–2025 n’ont pas été trouvés à la source officielle.</div>
<p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a> ; <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a> ; <a href="https://www.bag.admin.ch/de/zeckenuebertragene-krankheiten" target="_blank" rel="noopener">OFSP, maladies transmises par les tiques</a>.</p></section>
<section class="ilot" id="g02-4"><h2><span class="n">4</span>Du liquide céphalo-rachidien normal à la méningite virale</h2><p>Comprendre la cinétique du liquide céphalo-rachidien évite deux erreurs opposées : traiter par antibiotiques une méningite virale précoce, ou rassurer à tort devant un liquide encore riche en polynucléaires.</p>
<h3>Le liquide normal</h3>
<p>Le liquide céphalo-rachidien normal est clair et compte moins de 5 leucocytes par µl, seuil retenu par les critères d’encéphalite et d’auto-immunité cités par la directive S1. Dès que le virus atteint les méninges, les cellules immunitaires y affluent : la <button class="w" data-k="g02-lcr-normal">pléiocytose</button> (augmentation du nombre de cellules) est le signe biologique de la méningite.</p>
<h3>La cinétique cellulaire</h3>
<p>Dans les <b>4 à 48 premières heures</b>, la pléiocytose est <b>mixte</b> : 25 à 1000 cellules par µl, avec des lymphocytes, des monocytes et des granulocytes. Elle devient ensuite <b>lymphocytaire</b>. Les protéines et le lactate restent normaux dans la méningite, ou peu élevés dans l’encéphalite (le lactate ne dépasse alors pas 4,0 mmol/l).</p>
<figure><svg viewBox="0 0 420 302" role="img" aria-label="Cinétique du liquide céphalo-rachidien dans la méningite virale" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="2"><rect x="12" y="12" width="396" height="44" rx="6"/><path d="M210 56v14m-5 -7l5 7 5 -7"/><rect x="12" y="70" width="396" height="62" rx="6"/><path d="M210 132v14m-5 -7l5 7 5 -7"/><rect x="12" y="146" width="396" height="62" rx="6"/><path d="M210 208v14m-5 -7l5 7 5 -7"/><rect x="12" y="222" width="396" height="62" rx="6"/></g><g fill="#222" text-anchor="middle"><text x="210" y="39">Virus dans le liquide céphalo-rachidien</text><text x="210" y="97">4 à 48 h : cellules mixtes</text><text x="210" y="115">25 à 1000 par µl (lymphocytes, monocytes, granulocytes)</text><text x="210" y="173">Ensuite : prédominance lymphocytaire</text><text x="210" y="191">protéines et lactate normaux ou peu élevés</text><text x="210" y="249">Après plus de 10 jours, encéphalites seulement :</text><text x="210" y="267">synthèse intrathécale d’anticorps (indice supérieur à 1,5)</text></g></svg><figcaption>Figure 1 — Évolution du liquide céphalo-rachidien dans une infection virale du système nerveux. Schéma didactique original, d’après la directive S1 de la Société allemande de neurologie (2025) ; ce n’est pas une image clinique.</figcaption></figure>
<p>La <button class="w" data-k="g02-pleiocytose-mixte">conséquence pratique</button> est capitale : un liquide précoce riche en polynucléaires <b>n’exclut pas un virus</b>. Tant qu’une méningite bactérienne n’est pas exclue, l’antibiothérapie provisoire reste justifiée. L’ensemble du tableau (procalcitonine, lactate, évolution) tranche ensuite.</p>
<h3>Quand les anticorps apparaissent</h3>
<p>Dans la méningite virale, il n’existe pas de synthèse intrathécale d’anticorps. Dans les encéphalites (herpès simplex, varicelle-zona, cytomégalovirus, FSME), elle apparaît après plus de 10 jours. L’<button class="w" data-k="g02-synthese-intrathecale">indice d’anticorps</button> se calcule par le rapport (anticorps du liquide × IgG du sérum) / (IgG du liquide × anticorps du sérum) et devient positif au-dessus de 1,5. La <b>sérologie intrathécale est donc un outil tardif</b> ; la PCR est l’outil précoce.</p>
<h3>Comment le virus arrive</h3>
<p>Chez l’enfant, l’infection entérovirale est disséminée avec une virémie élevée. Chez l’adulte, aucune virémie détectable n’a été retrouvée : les voies d’accès au système nerveux sont probablement différentes, sans que les sources lues en précisent le trajet. L’herpès simplex de type 2 procède d’une réactivation récurrente, ce qui explique les récidives (voir <button class="w" data-k="g02-hsv2">méningite à herpès simplex de type 2</button>).</p>
<div class="key"><b>Mécanisme → décision.</b> Cellules mixtes puis lymphocytaires : ne pas écarter un virus sur un liquide précoce. Synthèse d’anticorps tardive : ne pas attendre une sérologie intrathécale pour décider. Pas de virémie chez l’adulte : un prélèvement de sang ou de selles ne remplace pas le liquide.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a>.</p></section>
<section class="ilot" id="g02-5"><h2><span class="n">5</span>Causes, contextes et anamnèse</h2><p>L’anamnèse ne sert pas seulement à reconnaître une méningite : elle oriente vers un agent et, surtout, repère les terrains où le traitement change. La directive S1 propose de penser à une étiologie virale devant les contextes suivants.</p>
<table class="t"><thead><tr><th>Contexte</th><th>Agents évoqués</th></tr></thead><tbody><tr><td>Cas dans l’entourage</td><td>Oreillons, varicelle, poliovirus</td></tr><tr><td>Piqûre de tique ou d’insecte, morsure animale</td><td>FSME ; rage</td></tr><tr><td>Risque de VIH, transfusion ou greffe</td><td>VIH, cytomégalovirus, parvovirus B19</td></tr><tr><td>Immunosuppression</td><td>Cytomégalovirus, JCV, varicelle-zona, herpèsvirus humain 6, virus d’Epstein-Barr, herpès simplex 1 et 2 ; entérovirus 71 sous anti-CD20</td></tr><tr><td><button class="w" data-k="g02-voyage">Voyage</button></td><td>Virus Toscana (Italie), West Nile (Méditerranée), encéphalite japonaise (Asie du Sud-Est), dengue et rage (monde entier)</td></tr></tbody></table>
<p>D’autres indices se rapportent à un agent précis : un <b>herpès génital</b> évoque le syndrome d’Elsberg (lésions concomitantes chez 46 % des patients) ; un <b>zona</b> accompagne 60 % des méningites à varicelle-zona ; un patient infecté par le VIH avec des CD4 inférieurs à 200 par mm³ doit faire penser au cryptocoque ; un séjour en Afrique subsaharienne évoque la trypanosomiase. Enfin, la prise d’<b>anti-inflammatoires non stéroïdiens (ibuprofène) ou d’antibiotiques</b> peut causer une <button class="w" data-k="g02-diam">méningite aseptique médicamenteuse</button>, cliniquement identique.</p>
<h3>Symptômes par fréquence</h3>
<p>Dans la cohorte danoise : céphalées 95 %, fièvre 71 %, photophobie et hyperacousie 67 %, raideur de nuque 36 %. La <b>triade complète</b> (fièvre, céphalée, raideur de nuque) n’apparaît que chez <b>28 %</b> des patients. La <button class="w" data-k="g02-triade">raideur de nuque absente</button> ne permet donc jamais d’écarter une méningite : le signe manque chez près de deux patients sur trois.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Une femme de 31 ans a des céphalées, de la fièvre et une photophobie depuis un jour. Le liquide contient 160 cellules par µl, surtout lymphocytaires ; la PCR identifie un entérovirus. Elle quitte l’hôpital le jour même, avec antalgiques et consigne de consulter si la vigilance baisse.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un homme de 40 ans n’a ni fièvre ni raideur de nuque ; ses céphalées durent depuis trois jours. Le liquide est pourtant pathologique. À l’inverse, une femme sous traitement immunosuppresseur présente des céphalées subaiguës et une baisse visuelle : une pression d’ouverture élevée et un antigène cryptococcique positif révèlent une <button class="w" data-k="g02-cryptocoque">cryptococcose</button>.</p></div></div>
<div class="key"><b>Antécédents à demander.</b> Immunosuppression, VIH, greffe, vaccinations (rougeole, oreillons, rubéole, varicelle), voyages, piqûre de tique, herpès génital ou zona, médicaments récents (anti-inflammatoires non stéroïdiens, antibiotiques), épisodes antérieurs de méningite.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p></section>
<section class="ilot" id="g02-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen clinique poursuit deux objectifs : confirmer le syndrome méningé et traquer, sans relâche, les signes qui font basculer vers l’encéphalite.</p>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p>La fièvre est présente dans 71 % des cas. L’état de conscience s’évalue à chaque examen : une somnolence, un délire ou une confusion changent le diagnostic. Les constantes se relèvent avant la ponction ; tant qu’une méningite bactérienne n’est pas exclue, l’antibiothérapie provisoire reste de mise.</p></div><div class="card"><h4>Signes méningés</h4><p>La <button class="w" data-k="g02-triade">raideur de nuque</button>, la photophobie et la phonophobie (hyperacousie) se recherchent à chaque examen. Leur absence n’exclut rien : seuls 28 % des patients présentent la triade complète.</p></div></div>
<h3>Signes de basculement encéphalitique</h3>
<p>Un trouble de la vigilance, un délire, des crises, une aphasie ou une hémiparésie signalent une atteinte du parenchyme. Ces signes imposent d’agir comme pour une <button class="w" data-k="g02-hsve">encéphalite herpétique</button>, sans attendre le résultat de la ponction.</p>
<h3>Signes propres à certains agents</h3>
<ul><li><b>Herpès simplex de type 2 : radiculite lombosacrée (syndrome d’Elsberg).</b> Une <button class="w" data-k="g02-elsberg">rétention urinaire</button> est présente chez tous les patients de la série danoise (sondage chez 61 %), des signes méningés chez 82 % et des lésions génitales chez 46 %.</li>
<li><b>Oreillons.</b> Une <button class="w" data-k="g02-oreillons">parotidite</button>, d’abord unilatérale puis souvent bilatérale, suit 1 à 2 jours de prodromes ; une orchite touche 20 à 30 % des hommes pubères.</li>
<li><b>Cryptococcose.</b> Une baisse visuelle ou auditive traduit l’<button class="w" data-k="g02-pic">hypertension intracrânienne</button>.</li>
<li><b>Trypanosomiase.</b> Le stade 1 est hémolymphatique et peu spécifique ; le stade 2 (méningo-encéphalitique) comporte des troubles du sommeil, puis un coma.</li></ul>
<div class="trap"><span class="k">Erreur fréquente</span> Une raideur de nuque absente et un patient bien vigilant ne protègent pas : une méningite bactérienne débutante ou une cryptococcose subaiguë peuvent se présenter de façon discrète. C’est le liquide céphalo-rachidien qui tranche.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a>.</p><button class="pareto-btn ui" data-k="pareto-g02-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
