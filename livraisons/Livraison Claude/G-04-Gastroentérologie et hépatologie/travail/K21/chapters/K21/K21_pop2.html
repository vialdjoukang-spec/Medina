<template data-pop="k21-d-ipp" data-title="Inhibiteurs de la pompe à protons"><p class="lab">Mécanisme</p><p>Les IPP sont des benzimidazoles substitués. Base faible, l’IPP se concentre dans les canalicules acides de la cellule pariétale, y devient un sulfénamide cyclique et bloque durablement l’H⁺/K⁺-ATPase, voie finale de la sécrétion acide, quel que soit le stimulus.</p><p class="lab">Preuves</p><p>Les IPP sont plus efficaces que les antihistaminiques H2 et les prokinétiques pour soulager et cicatriser. Après quatre semaines, leur gain sur le placebo atteint 48,0 % dans l’œsophagite contre 27,2 % dans le reflux non érosif, groupe hétérogène qui comprend des patients sans reflux acide anormal (DGVS 2023).</p><p class="lab">Puissance relative aux doses standard</p><p>Rapportée à l’oméprazole 20 mg (1,0) : pantoprazole 0,23, lansoprazole 0,90, ésoméprazole 1,62, rabéprazole 1,82. Dans l’œsophagite sévère, l’ésoméprazole 40 mg apporte un bénéfice cliniquement pertinent à quatre et huit semaines.</p><p class="lab">Prise et tolérance</p><p>Le pantoprazole se prend une heure avant le repas, le lansoprazole au moins trente minutes avant. Effets fréquents : céphalées, douleurs abdominales, constipation, diarrhée, flatulences, nausées, polypes glandulaires fundiques bénins. Contre-indication : hypersensibilité aux benzimidazoles substitués.</p><p class="src">Références : DGVS 2023, recommandations 2.6 et 2.8 ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">informations professionnelles suisses Nexium®, Pantoprazol-Mepha®, PANTOZOL Control® et Agopton®</a>.</p></template>
<template data-pop="k21-d-esomeprazole" data-title="Ésoméprazole (Nexium®)"><p class="lab">Indications suisses</p><p>Œsophagite de reflux, prévention de ses récidives, reflux symptomatique sans œsophagite, éradication d’<i>Helicobacter pylori</i>, ulcères liés aux AINS et leur prévention, hypersécrétion pathologique, prévention des récidives hémorragiques d’ulcère.</p><p class="lab">Posologie</p><p>Œsophagite : 40 mg par jour pendant quatre semaines, prolongées de quatre si nécessaire. Prévention des récidives : 20 mg par jour. Reflux sans œsophagite : 20 mg par jour ; examens si les symptômes persistent après quatre semaines ; puis 20 mg à la demande. Insuffisance hépatique grave : 20 mg au plus.</p><p class="lab">Pharmacologie</p><p>À 20 et 40 mg pendant cinq jours, le pH gastrique reste supérieur à 4 en moyenne 13 et 17 heures par jour. La biodisponibilité passe de 64 à 89 % en prise répétée de 40 mg ; la demi-vie est d’environ 1,3 heure. Le métabolisme passe par le CYP2C19 et le CYP3A4 ; la clarithromycine double l’exposition.</p><div class="key"><b>Précautions.</b> Association au clopidogrel déconseillée. Grossesse : prudence. Allaitement : à ne pas utiliser selon l’information professionnelle.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Nexium®, comprimés, Swissmedic (AIPS via AmiKo, mise à jour 06.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="k21-d-pantoprazole" data-title="Pantoprazole"><p class="lab">Posologie (Pantoprazol-Mepha®)</p><p>20 mg par jour dans le reflux léger, puis à la demande, et en prévention des récidives (40 mg en cas de récidive). 40 mg par jour dans l’œsophagite modérée, quatre semaines puis quatre de plus ; dose doublée possible en cas de résistance. Comprimé avalé entier, une heure avant un repas. Insuffisance hépatique sévère : 20 mg au plus. Sujet âgé et insuffisance rénale : 40 mg au plus.</p><p class="lab">Automédication (PANTOZOL Control®)</p><p>20 mg par jour chez l’adulte, pour un traitement court du reflux ; consultation si aucune amélioration après deux semaines, et pas plus de quatre semaines sans avis médical.</p><p class="lab">Pharmacologie</p><p>Demi-vie d’environ une heure, sans lien avec la durée d’action. Environ 3 % des Européens sont métaboliseurs lents du CYP2C19 : leur exposition est environ six fois plus élevée. Puissance relative de 0,23 par rapport à l’oméprazole 20 mg (DGVS).</p><div class="key"><b>Précautions.</b> Grossesse : seulement en cas de nécessité absolue. Méthotrexate à forte dose : toxicité accrue. Non indiqué dans les troubles gastro-intestinaux légers comme la dyspepsie fonctionnelle.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Pantoprazol-Mepha® (12.2022) et PANTOZOL Control® (09.2026), consultées le 09.10.2026</a> ; DGVS 2023, recommandation 2.8.</p></template>
<template data-pop="k21-d-omeprazole" data-title="Oméprazole (Antramups®)"><p class="lab">Posologie</p><p>Œsophagite de reflux : 20 mg par jour, guérison en quatre semaines chez la plupart des patients, quatre de plus si nécessaire ; 40 mg en cas de réponse insuffisante, guérison en huit semaines. Prévention des récidives : 10 mg par jour, jusqu’à 20 à 40 mg si nécessaire, la dose de 10 mg exposant à plus de récidives. Reflux symptomatique : 20 mg par jour ; examens si échec à quatre semaines.</p><p class="lab">Grossesse et allaitement</p><p>L’information professionnelle demande la prudence pendant la grossesse. L’oméprazole passe en faible quantité dans le lait, où il est inactivé par l’acidité de l’estomac du nouveau-né. La DGVS note que l’expérience la plus large en grossesse concerne l’oméprazole et le préfère chez la femme qui planifie une conception.</p><div class="key"><b>Interaction.</b> Avec 80 mg d’oméprazole, la concentration du métabolite actif du clopidogrel baisse en moyenne de 46 % et l’inhibition plaquettaire de 16 % ; l’écart des prises ne corrige pas l’interaction, et l’association est déconseillée.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Antramups® (06.2026), consultée le 09.10.2026</a> ; DGVS 2023, recommandation 2.14.</p></template>
<template data-pop="k21-d-alginate" data-title="Alginate (Gaviscon®)"><p class="lab">Composition et mécanisme</p><p>Alginate de sodium, bicarbonate de sodium et carbonate de calcium. Au contact de l’acide, il forme un gel d’acide alginique au pH presque neutre, qui flotte sur le contenu gastrique, gêne le reflux jusqu’à quatre heures et protège l’œsophage de l’acide, de la pepsine et de la bile. Il agit sans absorption systémique et se localise sur la poche acide.</p><p class="lab">Preuves</p><p>Chez des patients qui avaient un pyrosis deux à six jours par semaine, un alginate quatre fois par jour pendant quatorze jours a été non inférieur à l’oméprazole 20 mg (DGVS 2.4). Son effet sur la cicatrisation de l’œsophagite est inconnu. En ajout à un IPP insuffisant, il a augmenté le nombre de nuits sans symptôme.</p><p class="lab">Posologie</p><p>Deux à quatre comprimés à croquer, ou 10 à 20 mL, après les repas et au coucher, jusqu’à quatre fois par jour ; consultation si aucune amélioration après sept jours.</p><div class="key"><b>Précautions.</b> Un comprimé apporte environ 63 mg de sodium, un sachet de 10 mL 142,6 mg : prudence en régime pauvre en sel. Utilisable pendant la grossesse et l’allaitement selon l’information professionnelle.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Gaviscon® (06.2023), consultée le 09.10.2026</a> ; DGVS 2023, recommandations 2.4, 2.7 et 2.13.</p></template>
<template data-pop="k21-d-antiacide" data-title="Antiacides (magaldrate, Riopan®)"><p class="lab">Mécanisme</p><p>Le magaldrate, hydroxyde d’aluminium et de magnésium en réseau multicouche, neutralise l’acide et fixe la pepsine, les sels biliaires et la lysolécithine. 800 mg neutralisent environ 18 à 25 milliéquivalents d’acide chlorhydrique. L’action est rapide mais brève.</p><p class="lab">Posologie</p><p>800 mg une demi-heure à une heure après le repas ou à l’apparition des symptômes ; 6 400 mg par jour au plus. Avis médical si les symptômes persistent plus de deux semaines.</p><p class="lab">Place</p><p>Les antiacides servent aux symptômes occasionnels. Dans une méta-analyse citée par la DGVS, ils étaient inférieurs aux alginates ; à fortes doses, ils ne sont pas dénués d’effets indésirables.</p><div class="key"><b>Précautions.</b> Contre-indiqué en cas d’hypophosphatémie. Pendant la grossesse et l’allaitement, seulement en cas de nécessité absolue selon l’information professionnelle, bien que la DGVS place les antiacides au premier palier de l’escalade.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Riopan® (04.2025), consultée le 09.10.2026</a> ; DGVS 2023, recommandations 2.4, 2.6 et 2.14.</p></template>
<template data-pop="k21-d-neuromod" data-title="Neuromodulateurs dans l’hypersensibilité au reflux"><p class="lab">Principe</p><p>Certains antidépresseurs élèvent le seuil de perception de l’œsophage. Lorsque l’acidité est déjà contrôlée mais que des reflux normaux restent perçus, ils agissent sur la cause du symptôme.</p><p class="lab">Preuves et indication</p><p>Dans un essai cité par la DGVS, la fluoxétine a été plus efficace que l’IPP chez les patients hypersensibles, mais non chez ceux dont l’exposition acide restait élevée. La DGVS réserve cette option à l’hypersensibilité prouvée par une exploration fonctionnelle. La révision de Rome de 2026 juge la modulation de la perception prometteuse, avec des données encore limitées.</p><div class="key"><b>Statut.</b> Aucune information professionnelle suisse ne mentionne le RGO ou l’hypersensibilité œsophagienne : l’usage est hors indication et la dose n’est fixée par aucune des sources lues ; la prescription relève d’un avis spécialisé.</div><p class="src">Références : DGVS 2023, recommandations 1.11 et 2.7 ; <a href="https://pubmed.ncbi.nlm.nih.gov/42031441/" target="_blank" rel="noopener">Gyawali et al., 2026 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a>.</p></template>
<template data-pop="k21-d-baclofene" data-title="Baclofène (Liorésal®)"><p class="lab">Mécanisme</p><p>Agoniste du récepteur GABA-B, le baclofène inhibe partiellement les relaxations transitoires du sphincter inférieur et réduit le nombre d’épisodes de reflux.</p><p class="lab">Place</p><p>La DGVS limite son emploi à des cas individuels justifiés, à cause d’un profil d’effets indésirables défavorable ; Boeckxstaens et collaborateurs le jugent inadapté au traitement courant du RGO en raison de ses effets centraux. Les molécules apparentées développées pour cette indication ont été abandonnées.</p><div class="key"><b>Statut.</b> En Suisse, l’information professionnelle de Liorésal® vise la spasticité musculaire ; l’usage dans le RGO est hors indication.</div><p class="src">Références : DGVS 2023, recommandation 2.7 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Liorésal® (01.2025)</a>.</p></template>
<template data-pop="pareto-k21-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="k21-0,k21-1,k21-2,k21-3,k21-4,k21-5,k21-6"></p><ul><li>Le RGO est un reflux gastrique qui provoque des symptômes gênants ou des lésions ; une décision lourde exige une preuve objective.</li><li>Quatre phénotypes : œsophagite, reflux non érosif, hypersensibilité, pyrosis fonctionnel.</li><li>Prévalence suisse : 17,6 % ; récidive fréquente, progression rare.</li><li>Relaxations transitoires, hernie hiatale, poche acide et clairance lente créent le reflux ; la sécrétion acide est normale.</li><li>Obésité abdominale, tabac et hernie sont les facteurs principaux ; homme de plus de 50 ans au reflux ancien : chercher un Barrett.</li><li>Symptômes typiques : pyrosis, régurgitation, douleur thoracique ; les symptômes extra-œsophagiens isolés sont rarement dus au reflux.</li><li>Signes d’alarme : dysphagie, odynophagie, saignement ou anémie, amaigrissement, vomissements, antécédent familial de cancer digestif.</li></ul></template>
<template data-pop="pareto-k21-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="k21-7"></p><ul><li>Symptômes typiques sans alarme : IPP à dose standard quatre semaines, sans endoscopie.</li><li>La réponse à l’IPP ne prouve pas le RGO.</li><li>OGD si alarme, échec de huit semaines ou reflux ancien ; idéalement deux à quatre semaines sans IPP.</li><li>Preuve concluante : œsophagite B à D, Barrett, sténose peptique, exposition acide supérieure à 6 %.</li><li>Exclure d’abord un syndrome coronarien et un cancer ; penser à l’œsophagite à éosinophiles et à l’achalasie.</li></ul></template>
<template data-pop="pareto-k21-tt" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="k21-8,k21-9"></p><ul><li>Urgences : saignement, dysphagie avec amaigrissement, volvulus d’une hernie para-œsophagienne.</li><li>Perte de poids pour tous ; surélévation du lit et pas de repas tardif si symptômes nocturnes.</li><li>Œsophagite : IPP quatre semaines (A, B) à huit semaines (C, D).</li><li>Au long cours : à la demande si reflux non érosif ou œsophagite A ou B ; continu si C, D ou sténose.</li><li>Échec : vérifier la prise, changer d’IPP, doubler, ajouter un alginate ; après huit semaines, explorer.</li><li>Chirurgie : reflux prouvé par pH-impédancemétrie, manométrie préalable.</li></ul></template>
<template data-pop="pareto-k21-crit" data-title="Pareto — Barrett, suivi et critères"><p class="ratio" data-cover="k21-10,k21-11,k21-12,k21-13"></p><ul><li>Barrett : au moins 1 cm de muqueuse cylindrique avec métaplasie intestinale.</li><li>Surveillance ESGE : cinq ans de 1 à 3 cm, trois ans de 3 à 10 cm, centre expert au-delà ; arrêt vers 75 ans.</li><li>Dysplasie confirmée par un second pathologiste : centre expert, résection des lésions visibles, ablation.</li><li>IPP au long cours réévalué ; arrêt par paliers ; pas de relais par antihistaminique H2.</li><li>Éradiquer <i>Helicobacter pylori</i> avant un IPP au long cours.</li><li>Clopidogrel : éviter oméprazole et ésoméprazole ; grossesse : escalade prudente.</li></ul></template>
<template data-pop="pareto-k21-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="k21-e-1,k21-e-2,k21-e-3"></p><ul><li>Aucun examen isolé n’est un standard de référence.</li><li>Endoscopie : grade de Los Angeles, souvent normale, sous-estimée sous IPP.</li><li>pH-métrie hors IPP : moins de 4 % normal, plus de 6 % pathologique ; impédance : moins de 40 ou plus de 80 reflux par jour.</li><li>Sous IPP, exposition acide supérieure à 4 % et plus de 80 reflux : RGO réfractaire.</li><li>Manométrie avant chirurgie ; transit baryté inutile au diagnostic.</li></ul></template>
<template data-pop="pareto-k21-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="k21-p-1,k21-p-2,k21-p-3,k21-p-4"></p><ul><li>IPP pour l’acidité, alginate pour la poche acide, neuromodulateur pour la perception.</li><li>Œsophagite : dose pleine quatre à huit semaines ; puis dose minimale ou à la demande.</li><li>Prise avant le repas.</li><li>Clopidogrel, méthotrexate à forte dose, atazanavir : interactions majeures.</li><li>Magnésémie sous diurétique ou digoxine.</li><li>Pas de prokinétique ni de relais par antihistaminique H2.</li></ul></template>
