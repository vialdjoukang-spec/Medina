<div class="chap-head"><div class="code">K21 — Reflux gastro-œsophagien · couvre K21.0 et K21.9 · renvois : K22.7 — Œsophage de Barrett, K44 — Hernie diaphragmatique · CIM-10-GM 2024 · Appareil digestif</div>
<h1>Reflux gastro-œsophagien</h1><span class="status">Adulte · œsophagite de reflux, œsophage de Barrett et hernie hiatale · consensus de Lyon 2.0 (2024), recommandation DGVS S2k (2023), recommandation ESGE sur l’œsophage de Barrett (2023) · état au 09.10.2026</span></div>

<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#k21-0">Question clinique</a></li><li><a href="#k21-1">Définitions et classifications</a></li><li><a href="#k21-2">Épidémiologie et histoire naturelle</a></li><li><a href="#k21-3">De la barrière anti-reflux à la lésion</a></li><li><a href="#k21-4">Facteurs de risque</a></li><li><a href="#k21-5">Interroger pour orienter</a></li><li><a href="#k21-6">Examiner pour trier</a></li><li><a href="#k21-7">Établir le diagnostic</a></li><li><a href="#k21-8">Complications et urgences</a></li><li><a href="#k21-9">Traiter le reflux</a></li><li><a href="#k21-10">Œsophage de Barrett</a></li><li><a href="#k21-11">Suivi, désescalade et prévention</a></li><li><a href="#k21-12">Situations particulières</a></li><li><a href="#k21-13">Critères formels du diagnostic</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="k21-0"><h2><span class="n">0</span>Question clinique</h2><p>Un homme de 52 ans, indice de masse corporelle à 31 kg/m², consulte pour des brûlures rétrosternales qui montent après les repas, trois soirs par semaine depuis quatre ans. La nuit, un liquide acide lui remonte dans la bouche. Il prend des antiacides en pharmacie. Il n’a ni dysphagie, ni amaigrissement, ni anémie. <b>Trois décisions se posent : peut-on traiter sans endoscopie, combien de temps, et faut-il chercher un œsophage de Barrett chez ce patient symptomatique depuis des années ?</b></p><p>Le <button class="w" data-justification="1" data-k="k21-pyrosis">pyrosis (définition et valeur)</button> et la <button class="w" data-justification="1" data-k="k21-regurgitation">régurgitation (définition et pièges)</button> évoquent le reflux, mais ne le prouvent pas. Le cours apprend à reconnaître le reflux, à distinguer ses phénotypes, à traiter au juste niveau, puis à désescalader. Il apprend aussi à repérer les complications, au premier rang desquelles l’œsophage de Barrett, lésion précancéreuse.</p><div class="key"><b>Point de départ.</b> Des symptômes typiques sans signe d’alarme autorisent un traitement d’épreuve ; ils ne suffisent pas à poser un diagnostic définitif ni à justifier un traitement à vie.</div></section>
<section class="ilot" id="k21-1"><h2><span class="n">1</span>Définitions et classifications</h2><p>Selon la <button class="w" data-justification="1" data-k="k21-montreal">définition de Montréal (2006)</button>, reprise par la recommandation allemande DGVS de 2023, la maladie de reflux gastro-œsophagien (RGO) existe lorsque le reflux du contenu gastrique dans l’œsophage provoque des symptômes gênants ou des lésions. La définition ne précise ni l’acidité du reflux ni la méthode de mesure ; elle inclut le patient asymptomatique porteur d’une complication, comme un œsophage de Barrett.</p><p>Le <button class="w" data-justification="1" data-k="k21-lyon">consensus de Lyon 2.0 (2024)</button> resserre cette définition. Un RGO « justifiant une décision » exige une preuve objective : lésion concluante à l’endoscopie ou exposition acide anormale en pH-métrie, chez un patient dont les symptômes sont compatibles. Cette exigence protège le patient d’un traitement à vie ou d’une chirurgie fondés sur des symptômes seuls.</p><h3>Les phénotypes du reflux</h3><p>Le tableau distingue les phénotypes, car chacun appelle une conduite propre.</p><table class="t"><tr><th>Phénotype</th><th>Définition</th><th>Conséquence</th></tr><tr><td><button class="w" data-justification="1" data-k="k21-la">Œsophagite érosive (grades A à D de Los Angeles)</button></td><td>Pertes de substance muqueuse visibles en endoscopie</td><td>Traitement par inhibiteur de la pompe à protons (IPP), durée selon le grade</td></tr><tr><td>Reflux non érosif</td><td>Symptômes typiques, endoscopie normale, exposition acide anormale</td><td>IPP, puis traitement à la demande</td></tr><tr><td><button class="w" data-justification="1" data-k="k21-hypersensibilite">Hypersensibilité au reflux</button></td><td>Exposition acide normale, symptômes associés aux épisodes de reflux</td><td>Neuromodulateur à discuter, en complément</td></tr><tr><td><button class="w" data-justification="1" data-k="k21-pyrosis-fonctionnel">Pyrosis fonctionnel</button></td><td>Exposition acide normale, aucune association symptôme-reflux</td><td>Pas de traitement antireflux ; prise en charge d’un trouble de l’interaction intestin-cerveau</td></tr></table><p>La lecture commence par l’endoscopie, puis par la pH-métrie si l’endoscopie est normale. Un patient dont la pH-métrie est normale et dont les symptômes ne coïncident avec aucun reflux ne relève pas d’un IPP : le prolonger ne ferait qu’ajouter des effets indésirables.</p><h3>Complications et lésions associées</h3><p>L’<button class="w" data-justification="1" data-k="k21-barrett-def">œsophage de Barrett</button> est un épithélium cylindrique d’au moins 1 cm dans l’œsophage distal, avec métaplasie intestinale à l’histologie (ESGE 2023). La sténose peptique est une cicatrice fibreuse de l’œsophagite. La <button class="w" data-justification="1" data-k="k21-hernie">hernie hiatale (formes axiale, para-œsophagienne et mixte)</button> n’est pas une complication du reflux mais l’un de ses moteurs.</p><div class="key"><b>À retenir.</b> Le RGO se définit par des symptômes gênants ou des lésions ; une décision lourde exige une preuve objective. Le clinicien raisonne en phénotypes, car l’IPP n’aide que si le reflux acide cause les symptômes.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali et al., consensus de Lyon 2.0, Gut 2024</a> ; <a href="https://www.dgvs.de/wp-content/uploads/2024/10/ZFG_LL-Reflux_Leitlinie_final_englisch_15.10.24.pdf" target="_blank" rel="noopener">Madisch et al., recommandation DGVS S2k sur le RGO, version anglaise, Z Gastroenterol 2024 (version allemande 2023), énoncés 1.1 et 1.2</a> ; <a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">Weusten et al., recommandation ESGE sur l’œsophage de Barrett, Endoscopy 2023</a>.</p></section>
<section class="ilot" id="k21-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2><p>En Suisse, une enquête téléphonique en population adulte germanophone et francophone a estimé la prévalence du RGO à 17,6 %, soit environ 993 000 personnes (Schwenkglenks, 2004). Plus d’un tiers de ces personnes, 38 %, prenait régulièrement un médicament. En Europe, la revue systématique d’El-Serag (2014) rapporte des prévalences de 8,8 à 25,9 % pour un pyrosis ou une régurgitation au moins hebdomadaire. Aucune donnée suisse plus récente n’a été identifiée.</p><p>L’évolution est le plus souvent chronique mais rarement progressive. Après l’arrêt d’un traitement efficace, une récidive survient chez environ 75 % des patients dans les essais contrôlés ; à l’inverse, peu d’œsophagites légères évoluent vers un grade sévère. Dans une cohorte danoise, le risque absolu d’adénocarcinome à dix ans après une œsophagite de reflux était de 0,24 % (DGVS 2023).</p><p>L’œsophage de Barrett touche jusqu’à 1 à 2 % de la population générale et 8 à 13 % des patients ayant des symptômes de reflux chroniques (ESGE 2023). Son risque de progression vers un cancer est faible : 0,12 % par an dans la cohorte nationale danoise de <button class="w" data-justification="1" data-k="k21-hvid">Hvid-Jensen (11 028 patients)</button>.</p><div class="key"><b>À retenir.</b> Le RGO touche environ un adulte suisse sur six. Il récidive souvent mais progresse rarement ; le risque de cancer existe surtout par l’intermédiaire de l’œsophage de Barrett et reste faible en valeur absolue.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15040129/" target="_blank" rel="noopener">Schwenkglenks et al., épidémiologie et coûts du RGO en Suisse, Soz Praventivmed 2004</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4046948/" target="_blank" rel="noopener">El-Serag et al., épidémiologie du RGO, Gut 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21995385/" target="_blank" rel="noopener">Hvid-Jensen et al., N Engl J Med 2011</a> ; DGVS 2023, chapitre 2.2.</p></section>
<section class="ilot" id="k21-3"><h2><span class="n">3</span>De la barrière anti-reflux à la lésion</h2><p>Chez le sujet sain, un peu de contenu gastrique reflue chaque jour, surtout après les repas. Ce reflux physiologique reste bref, car la jonction œso-gastrique se referme et l’œsophage se vide aussitôt. La jonction associe deux structures : le sphincter inférieur de l’œsophage (SIO) et le pilier diaphragmatique qui l’entoure ; le pilier prévient surtout les reflux déclenchés par l’effort et l’augmentation de pression abdominale (Boeckxstaens, 2014).</p><p>Le reflux devient pathologique par l’addition de plusieurs défaillances. Le mécanisme dominant n’est pas un sphincter constamment hypotonique, mais la <button class="w" data-justification="1" data-k="k21-rtsio">relaxation transitoire du SIO (déclencheur et rôle)</button>, ouverture brève et réflexe sans déglutition. La <button class="w" data-justification="1" data-k="k21-hernie">hernie hiatale</button> désolidarise sphincter et pilier : elle abaisse la pression de barrière, multiplie les relaxations transitoires, ralentit la clairance et place la <button class="w" data-justification="1" data-k="k21-poche-acide">poche acide postprandiale (formation et cible thérapeutique)</button> au-dessus du diaphragme. L’obésité abdominale accroît la pression intra-abdominale, qui pousse le contenu gastrique vers l’œsophage et favorise la hernie.</p><figure><svg viewBox="0 0 680 255" role="img" aria-label="Mécanismes de la barrière anti-reflux et de sa défaillance" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><path d="M110 20v90"/><path d="M150 20v90"/><path d="M110 110c-40 30-50 90 20 100s110-20 90-70c-10-25-40-30-70-30"/><path d="M60 110h40M160 110h40" stroke-width="5"/><path d="M430 20v60"/><path d="M470 20v60"/><path d="M430 80c-30 10-30 40 0 45h40c30-5 30-35 0-45"/><path d="M380 150h50M470 150h50" stroke-width="5"/><path d="M430 150c-40 20-40 70 30 70s80-40 40-70"/><path d="M450 60v-30" stroke-dasharray="4 3"/><path d="M445 35l5-8 5 8"/></g><g fill="#222"><text x="165" y="40">œsophage</text><text x="205" y="105">pilier diaphragmatique</text><text x="165" y="70">SIO au contact du pilier</text><text x="40" y="248">A. Jonction normale</text><text x="530" y="100">hernie : SIO au-dessus</text><text x="530" y="118">du diaphragme</text><text x="530" y="160">pilier élargi</text><text x="360" y="248">B. Hernie hiatale et reflux</text></g></svg><figcaption>Figure 1 — A. Le SIO et le pilier diaphragmatique superposés forment une barrière double. B. Dans la hernie hiatale, le SIO remonte au-dessus du pilier : les deux composantes ne s’additionnent plus, et le reflux (flèche) s’échappe plus facilement. Schéma pédagogique, non à l’échelle.</figcaption></figure><p>La lésion dépend surtout de la durée de contact. Une clairance œsophagienne lente, par péristaltisme insuffisant ou reflux nocturne, prolonge l’exposition de l’épithélium à l’acide et à la pepsine ; c’est ce temps de contact, plus que le nombre de reflux, qui détermine l’œsophagite. Le symptôme, enfin, dépend aussi de la perception : un œsophage hypersensible ressent des reflux normaux, et un reflux faiblement acide peut encore brûler. La sécrétion acide gastrique, elle, est le plus souvent normale chez les patients atteints de RGO (Boeckxstaens, 2014).</p><div class="key"><b>Conséquence thérapeutique.</b> L’IPP corrige l’acidité, non la barrière : il guérit l’œsophagite, mais contrôle moins bien la régurgitation, qui dépend du volume reflué. La chirurgie et la perte de poids agissent sur la barrière elle-même.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., Symptomatic reflux disease, Gut 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29037470/" target="_blank" rel="noopener">Tack et Pandolfino, physiopathologie du RGO, Gastroenterology 2018 (résumé)</a>.</p></section>
<section class="ilot" id="k21-4"><h2><span class="n">4</span>Facteurs de risque</h2><p>Le RGO n’a pas de cause unique ; il naît de l’accumulation de facteurs qui dégradent la barrière ou augmentent la pression qui s’exerce sur elle. Les facteurs établis sont l’excès de poids, le tabac, la prédisposition génétique et la hernie hiatale (DGVS 2023). L’obésité abdominale pèse plus que l’indice de masse corporelle : dans une méta-analyse, elle doublait presque le risque d’œsophagite et d’œsophage de Barrett (Boeckxstaens, 2014).</p><p>La grossesse est un facteur transitoire : 40 à 85 % des femmes enceintes rapportent des symptômes de reflux selon la DGVS, 75 % selon la recommandation suisse mediX. L’infection à <i>Helicobacter pylori</i> semble au contraire réduire le risque d’œsophagite et de Barrett, par la gastrite du corps qu’elle provoque et la baisse de sécrétion acide qui en résulte. La recommandation mediX cite encore les <button class="w" data-justification="1" data-k="k21-declencheurs">déclencheurs alimentaires et médicamenteux</button>, dont l’effet individuel est inconstant.</p><p>Les facteurs de risque d’œsophage de Barrett chez un patient qui a du reflux sont l’âge de 50 ans ou plus, le sexe masculin, l’ethnie blanche, l’obésité, le tabac et un apparenté du premier degré atteint de Barrett ou d’adénocarcinome (ESGE 2023). Un reflux hebdomadaire apparu avant 30 ans multiplie aussi ce risque, indépendamment de la durée cumulée des symptômes (Boeckxstaens, 2014).</p><div class="key"><b>À retenir.</b> Poids, tabac et hernie hiatale sont les facteurs modifiables ou mesurables ; le profil « homme de plus de 50 ans, obèse, fumeur, reflux ancien » est celui qui doit faire rechercher un œsophage de Barrett.</div><p class="src">Références : DGVS 2023, énoncé 1.1 et recommandation 2.14 ; <a href="https://www.medix.ch/wissen/guidelines/gastrooesophageale-refluxkrankheit-gerd/" target="_blank" rel="noopener">mediX, guideline « Gastroösophageale Refluxkrankheit », révision 10/2023 (partie publique)</a> ; ESGE 2023, recommandation 2 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a>.</p></section>
<section class="ilot" id="k21-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>L’interrogatoire cherche trois choses : des symptômes typiques, des signes d’alarme, et un autre diagnostic qui se déguiserait en reflux. Les symptômes typiques sont le <button class="w" data-justification="1" data-k="k21-pyrosis">pyrosis</button>, la <button class="w" data-justification="1" data-k="k21-regurgitation">régurgitation</button> et la douleur thoracique d’origine œsophagienne (Lyon 2.0). Le médecin précise leur fréquence, leur horaire, leur lien avec les repas et le décubitus, et leur retentissement sur le sommeil.</p><p>Les <button class="w" data-justification="1" data-k="k21-extra">symptômes extra-œsophagiens (toux, asthme, laryngite)</button> ont une relation beaucoup plus faible avec le reflux. Enrouement, globus, nausées et douleurs épigastriques isolés, sans pyrosis ni régurgitation, sont rarement dus au reflux. Une dysphagie sans pyrosis, surtout avec blocage alimentaire, oriente vers une <button class="w" data-justification="1" data-k="k21-eoe">œsophagite à éosinophiles</button> ou un trouble moteur.</p><div class="alert"><b>Signes d’alarme (DGVS 2023).</b> Dysphagie, odynophagie, saignement digestif ou anémie ferriprive, anorexie, amaigrissement involontaire, vomissements répétés, antécédent familial de cancer digestif. Chacun impose une œsogastroduodénoscopie (OGD) sans attendre un traitement d’épreuve.</div><div class="trap"><span class="k">Piège</span> Une régurgitation sans effort, juste après les repas, qui s’arrête quand le contenu devient acide, évoque une <button class="w" data-justification="1" data-k="k21-rumination">rumination</button>, non un reflux résistant. Elle se traite par une rééducation comportementale, non par un IPP ou une fundoplicature.</div><div class="key"><b>À retenir.</b> L’interrogatoire classe les symptômes en typiques ou atypiques, recherche les signes d’alarme et repère les imitateurs : rumination, éructation, œsophagite à éosinophiles, achalasie et cardiopathie ischémique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024, tableau 2 et figure 1</a> ; DGVS 2023, recommandation 1.5.</p></section>
<section class="ilot" id="k21-6"><h2><span class="n">6</span>Examiner pour trier</h2><p>L’examen physique est le plus souvent normal dans le RGO : sa valeur tient à ce qu’il détecte d’autre. Le médecin note le poids, l’indice de masse corporelle et le <button class="w" data-justification="1" data-k="k21-tour-taille">tour de taille (pourquoi il compte)</button>, car l’obésité abdominale aggrave le reflux et le risque de Barrett. Il recherche une pâleur, une perte de poids et une adénopathie sus-claviculaire, qui sont des signes d’alarme.</p><p>Devant une douleur thoracique, l’examen cardiovasculaire et l’électrocardiogramme précèdent toute hypothèse œsophagienne. La DGVS rappelle qu’une réponse à un IPP n’exclut pas une maladie coronarienne : les deux affections partagent les mêmes facteurs de risque. Un sifflement expiratoire, une toux chronique ou une dysphonie conduisent à une évaluation pneumologique ou oto-rhino-laryngologique avant d’accuser le reflux.</p><div class="key"><b>À retenir.</b> L’examen ne confirme pas le reflux ; il écarte une urgence, un cancer ou une cause cardiaque, et mesure le poids qui sera la première cible du traitement.</div><p class="src">Références : DGVS 2023, recommandations 1.5 et 2.12 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p><button class="pareto-btn ui" data-k="pareto-k21-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
