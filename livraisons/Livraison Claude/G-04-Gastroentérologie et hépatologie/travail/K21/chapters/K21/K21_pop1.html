<template data-pop="k21-pyrosis" data-title="Pyrosis"><p class="lab">Définition</p><p>Le pyrosis est une sensation de brûlure située derrière le sternum. Il fait partie, avec la régurgitation et la douleur thoracique œsophagienne, des trois symptômes typiques du RGO selon le consensus de Lyon 2.0.</p><p class="lab">Valeur diagnostique</p><p>Les symptômes typiques sont peu sensibles (30 à 76 %) et inégalement spécifiques (62 à 96 %) pour le RGO (DGVS 2023). Environ deux tiers à trois quarts des patients qui ont un pyrosis répondent à un IPP de courte durée, mais l’effet placebo atteint 10 à 25 %. Un pyrosis peut aussi naître d’une achalasie ou d’un trouble fonctionnel de l’œsophage.</p><div class="key"><b>Piège.</b> Certains patients appellent « brûlure d’estomac » une brûlure épigastrique : le médecin fait montrer le trajet de la douleur avant de conclure à un pyrosis.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; DGVS 2023, recommandation 2.1.</p></template>
<template data-pop="k21-regurgitation" data-title="Régurgitation"><p class="lab">Définition</p><p>La régurgitation est la remontée sans effort d’un contenu gastrique acide ou amer jusque dans la bouche. Elle se distingue du vomissement, qui s’accompagne de nausées et d’un effort de contraction abdominale.</p><p class="lab">Mécanisme et conséquence</p><p>Elle dépend surtout du volume reflué, donc de l’incompétence de la barrière anti-reflux, plus que de l’acidité. Sous IPP, le reflux devient faiblement acide mais persiste : le gain thérapeutique de l’IPP sur le placebo n’est que de 17 % pour la régurgitation, et 12 à 13 % des patients dont le pyrosis est contrôlé gardent des régurgitations fréquentes (DGVS 2023).</p><div class="key"><b>Piège.</b> Une régurgitation qui résiste à l’IPP fait d’abord rechercher une rumination, une achalasie ou une gastroparésie, avant de conclure à un reflux réfractaire.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; DGVS 2023, recommandation 2.8.</p></template>
<template data-pop="k21-montreal" data-title="Définition de Montréal"><p>Le consensus mondial de Montréal (2006) définit le RGO comme le reflux du contenu gastrique provoquant des symptômes gênants ou des complications. La DGVS l’a repris en 2023.</p><p class="lab">Ce que la définition englobe</p><p>Elle regroupe l’œsophagite érosive, le reflux non érosif, la douleur thoracique de reflux, l’hypersensibilité au reflux, les manifestations extra-œsophagiennes, les complications (saignement, sténose) et l’œsophage de Barrett. Pour les manifestations extra-œsophagiennes, elle décrit une association, non une causalité démontrée.</p><div class="key"><b>Limite.</b> La définition est symptomatique et ne précise ni l’acidité du reflux ni la méthode de mesure ; elle n’a pas été conçue comme critère diagnostique. Lyon 2.0 y ajoute l’exigence d’une preuve objective avant toute décision lourde.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/16928254/" target="_blank" rel="noopener">Vakil et al., définition de Montréal, 2006, cité d’après la DGVS</a> ; DGVS 2023, énoncé 1.1.</p></template>
<template data-pop="k21-lyon" data-title="Consensus de Lyon 2.0 (2024)"><p>Le consensus de Lyon, publié en 2018 puis actualisé en 2024, fixe les critères objectifs du diagnostic de RGO. La mise à jour a été votée en 2023 par vingt membres de plusieurs continents, dont des gastroentérologues de Bordeaux, Padoue, Londres et Zurich, selon la méthode RAND/UCLA.</p><p class="lab">Apports principaux</p><p>Le RGO « justifiant une décision » exige une preuve objective lorsque le traitement sera prolongé, intensifié ou invasif. Le grade B de Los Angeles devient concluant. La pH-métrie sans fil prolongée de 96 heures devient l’outil préféré lorsque le RGO n’est pas prouvé. Des seuils sont proposés pour les examens réalisés sous IPP et pour l’impédance basale nocturne.</p><div class="key"><b>Usage.</b> Le consensus distingue le RGO non prouvé, exploré hors traitement pour l’établir ou l’exclure, et le RGO prouvé, exploré sous traitement pour juger d’une persistance.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Gyawali et al., Gut 2024</a>.</p></template>
<template data-pop="k21-la" data-title="Classification de Los Angeles"><p>La classification de Los Angeles grade l’œsophagite selon l’étendue des pertes de substance muqueuse. Elle est la seule recommandée par la DGVS.</p><table class="t"><tr><th>Grade</th><th>Description</th></tr><tr><td>A</td><td>Une ou plusieurs pertes de substance de 5 mm au plus</td></tr><tr><td>B</td><td>Au moins une perte de substance de plus de 5 mm, sans continuité entre les sommets de deux plis</td></tr><tr><td>C</td><td>Pertes de substance continues entre les sommets d’au moins deux plis, sur moins de 75 % de la circonférence</td></tr><tr><td>D</td><td>Pertes de substance sur au moins 75 % de la circonférence</td></tr></table><p>Le grade corrèle avec l’exposition acide : 9,3 % du temps pour A, 13,7 % pour B, 11,7 % pour C et 19,1 % pour D dans l’étude de validation. Le critère « continuité entre les plis » a été retenu parce qu’il donnait un accord acceptable entre observateurs.</p><div class="key"><b>Piège.</b> Le grade A existe chez 5 à 7,5 % des sujets sains. Certaines informations professionnelles suisses, comme celle du pantoprazole, emploient encore la classification ancienne de Savary-Miller.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1727604/" target="_blank" rel="noopener">Lundell et al., Gut 1999 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12535775/" target="_blank" rel="noopener">Rezaeinasab et al., 2025, définitions des grades</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-hypersensibilite" data-title="Hypersensibilité au reflux"><p class="lab">Définition</p><p>L’hypersensibilité au reflux associe une exposition acide normale et une association positive entre les symptômes et les épisodes de reflux. Elle a remplacé le terme d’« œsophage hypersensible ».</p><p class="lab">Mécanisme</p><p>L’œsophage perçoit des reflux physiologiques, acides ou faiblement acides, qui ne seraient pas ressentis par un sujet sain. Parmi les patients qui ont des symptômes typiques, une endoscopie normale et une pH-métrie normale, environ un tiers ont une hypersensibilité et deux tiers un pyrosis fonctionnel (DGVS 2023).</p><p class="lab">Conséquence</p><p>Augmenter l’IPP n’apporte rien si l’acidité est déjà contrôlée. Un antidépresseur qui élève le seuil de perception, comme la fluoxétine dans un essai cité par la DGVS, a été plus efficace que l’IPP ; cet usage est hors indication.</p><p class="src">Références : DGVS 2023, recommandations 1.11 et 2.6 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-pyrosis-fonctionnel" data-title="Pyrosis fonctionnel"><p class="lab">Définition</p><p>Le pyrosis fonctionnel est une brûlure, une douleur ou une gêne rétrosternale qui persiste malgré un traitement antisécrétoire optimal, après exclusion du RGO, d’une lésion histologique, d’un trouble moteur défini et d’une cause structurelle (critères de Rome cités par la DGVS).</p><p class="lab">Mécanisme</p><p>La révision de Rome publiée en 2026 attribue ces troubles à une hypersensibilité viscérale, périphérique ou centrale, et à une hypervigilance modulée par des facteurs cognitifs, affectifs et psychosociaux.</p><p class="lab">Conséquence</p><p>Réduire encore un reflux déjà physiologique n’apporte que peu de bénéfice ; les approches qui modulent la perception sont prometteuses, mais leurs données restent limitées. Une fundoplicature est contre-productive.</p><p class="src">Références : DGVS 2023, recommandation 2.8 ; <a href="https://pubmed.ncbi.nlm.nih.gov/42031441/" target="_blank" rel="noopener">Gyawali et al., troubles œsophagiens fonctionnels, Gastroenterology 2026 (résumé)</a>.</p></template>
<template data-pop="k21-barrett-def" data-title="Œsophage de Barrett : définition"><p>L’ESGE définit l’œsophage de Barrett comme un revêtement cylindrique de l’œsophage distal d’au moins 1 cm, en languettes ou circulaire, contenant une métaplasie intestinale à l’histologie.</p><p class="lab">Pourquoi la métaplasie intestinale</p><p>La DGVS retient elle aussi la métaplasie intestinale à cellules caliciformes. Les données qui fondent la surveillance concernent ces patients ; le risque d’un épithélium cylindrique sans cellules caliciformes n’est pas établi avec certitude, même si la société britannique de gastroentérologie l’inclut depuis 2005.</p><p class="lab">Fréquence</p><p>Jusqu’à 1 à 2 % de la population générale, 8 à 13 % des patients ayant un reflux chronique ; 2 % dans une étude prospective de dépistage après 50 ans.</p><div class="key"><b>Limite.</b> Une ligne Z irrégulière ou un épithélium cylindrique de moins de 1 cm n’est pas un Barrett et ne justifie pas de surveillance.</div><p class="src">Références : <a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">ESGE 2023</a> ; DGVS 2023, énoncé 4.1 et recommandation 4.18.</p></template>
<template data-pop="k21-hernie" data-title="Hernie hiatale"><p class="lab">Définition et formes</p><p>La hernie hiatale est l’ascension d’une partie de l’estomac à travers le hiatus œsophagien du diaphragme. La DGVS distingue la hernie axiale, où la jonction glisse dans le thorax et qui peut devenir une grande hernie mixte avec œsophage court, et la hernie para-œsophagienne vraie, où le cardia reste en place et l’estomac s’engage à côté de l’œsophage, jusqu’au retournement intrathoracique.</p><p class="lab">Rôle dans le reflux</p><p>La hernie est aujourd’hui considérée comme un acteur central : elle abaisse la pression de la barrière, augmente les relaxations transitoires, ralentit la clairance et déplace la poche acide au-dessus du diaphragme. Elle explique l’association aux formes les plus sévères et aux œsophagites.</p><div class="key"><b>Conséquence.</b> Lyon 2.0 considère une hernie vue en endoscopie comme un argument d’appoint pour le RGO ; la recommandation de l’EAES sur les hernies para-œsophagiennes concerne les types II à IV contenant au moins 50 % de l’estomac.</div><p class="src">Références : DGVS 2023, recommandation 3.8 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37910246/" target="_blank" rel="noopener">EAES 2023 (résumé)</a>.</p></template>
<template data-pop="k21-hvid" data-title="Cohorte danoise de Hvid-Jensen (2011)"><p>Cette étude nationale a suivi tous les patients atteints d’œsophage de Barrett au Danemark de 1992 à 2009, soit 11 028 patients, pendant une médiane de 5,2 ans, à partir des registres nationaux de pathologie et de cancer.</p><p class="lab">Résultats</p><p>Dans la première année, 131 adénocarcinomes ont été découverts : ils existaient probablement déjà lors de l’endoscopie initiale. Ensuite, 66 cancers sont apparus, soit 1,2 cas pour 1 000 années-patients et un risque annuel de 0,12 %, onze fois celui de la population générale. L’incidence était de 1,0 pour 1 000 sans dysplasie et de 5,1 avec une dysplasie de bas grade initiale.</p><div class="key"><b>Conséquence.</b> Le risque absolu est bien inférieur aux 0,5 % par an supposés autrefois : c’est l’argument principal pour espacer la surveillance du Barrett sans dysplasie. L’ESGE cite, pour la progression vers la dysplasie de haut grade ou le cancer, une fourchette de 0,3 à 0,8 % par an.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21995385/" target="_blank" rel="noopener">Hvid-Jensen et al., N Engl J Med 2011 (résumé)</a> ; <a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">ESGE 2023</a>.</p></template>
<template data-pop="k21-rtsio" data-title="Relaxation transitoire du sphincter inférieur de l’œsophage"><p class="lab">Définition</p><p>C’est une ouverture brève et réflexe du sphincter inférieur de l’œsophage, indépendante de la déglutition. Elle sert physiologiquement à évacuer l’air de l’estomac proximal, sous forme d’éructation gastrique.</p><p class="lab">Rôle dans le RGO</p><p>Les relaxations transitoires, plutôt qu’une hypotonie permanente du sphincter, sont le mécanisme dominant des épisodes de reflux. La hernie hiatale les rend plus fréquentes ; l’effort sportif les favorise aussi, ce qui explique le reflux fréquent des athlètes.</p><div class="key"><b>Conséquence thérapeutique.</b> Le baclofène, agoniste du récepteur GABA-B, réduit partiellement ces relaxations, mais ses effets indésirables centraux limitent son usage à des cas choisis ; les molécules apparentées ont été abandonnées.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; DGVS 2023, recommandations 2.2 et 2.7.</p></template>
<template data-pop="k21-poche-acide" data-title="Poche acide postprandiale"><p class="lab">Formation</p><p>Après un repas, l’acide nouvellement sécrété s’accumule dans l’estomac proximal, au-dessus du bol alimentaire, avec lequel il se mélange peu. Cette couche reste très acide alors que le contenu gastrique est tamponné.</p><p class="lab">Rôle</p><p>Le reflux acide de la période postprandiale naît de cette poche. Dans la hernie hiatale, elle se situe au-dessus du diaphragme, ce qui facilite son passage dans l’œsophage.</p><div class="key"><b>Conséquence thérapeutique.</b> Un alginate se localise sur la poche acide, l’éloigne de la jonction et peut la faire disparaître ; dans une étude citée par la DGVS, un alginate, mais pas un antiacide, l’a supprimée après un repas tardif.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a> ; DGVS 2023, recommandation 2.13.</p></template>
<template data-pop="k21-declencheurs" data-title="Déclencheurs alimentaires et médicamenteux"><p>La recommandation mediX cite comme facteurs de risque le chocolat, la menthe, l’alcool, une alimentation riche en graisses, certains antihypertenseurs et les anti-inflammatoires non stéroïdiens (AINS).</p><p class="lab">Ce que montrent les données</p><p>La DGVS relève que l’effet d’une éviction sélective (alcool, chocolat, café, épices, agrumes, graisses, boissons gazeuses) n’a pas été démontré de façon concluante et universelle. Une grande cohorte d’infirmières a associé café, thé et eau gazeuse à davantage de symptômes. Les vêtements serrés gênent la clairance œsophagienne, et le manque de sommeil augmente la sensibilité de la muqueuse à l’acide.</p><div class="key"><b>Conséquence pratique.</b> Le médecin ne prescrit pas un régime d’exclusion standard ; il conseille d’éviter ce que le patient identifie lui-même comme déclencheur.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/gastrooesophageale-refluxkrankheit-gerd/" target="_blank" rel="noopener">mediX, révision 10/2023 (partie publique)</a> ; DGVS 2023, recommandation 2.2.</p></template>
<template data-pop="k21-extra" data-title="Symptômes extra-œsophagiens"><p class="lab">Position des sources</p><p>La définition de Montréal reconnaît une association entre reflux et toux, asthme, laryngite ou érosions dentaires, sans causalité démontrée. Lyon 2.0 attribue à la toux chronique et aux sifflements une relation faible mais possible ; à l’enrouement, au globus et au raclement isolés, une relation peu probable.</p><p class="lab">Données d’efficacité</p><p>Dans la toux avec RGO objectivé, l’IPP a fait mieux que le placebo (33 % contre 9 %). Dans la laryngite, un essai de 82 patients était positif, mais le plus grand, de 145 patients sous double dose d’ésoméprazole pendant seize semaines, ne l’était pas. Chez les patients qui ont des signes laryngés, la pH-impédancemétrie hors IPP confirme un RGO chez moins d’un patient sur cinq.</p><div class="key"><b>Conduite.</b> La DGVS propose un IPP à double dose pendant douze semaines, arrêté s’il est inefficace ; Lyon 2.0 préfère l’exploration initiale par pH-impédancemétrie. La pH-métrie pharyngée isolée n’est pas recommandée.</div><p class="src">Références : DGVS 2023, recommandations 1.13 et 2.11 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-eoe" data-title="Œsophagite à éosinophiles"><p class="lab">Pourquoi y penser</p><p>L’œsophagite à éosinophiles peut se présenter par un pyrosis isolé ; c’est l’erreur de diagnostic la plus fréquente devant un pyrosis résistant aux IPP. Une dysphagie avec blocage alimentaire, surtout sans pyrosis, doit la faire rechercher.</p><p class="lab">Comment la prouver</p><p>Le diagnostic est histologique : au moins six biopsies prélevées à plusieurs hauteurs, y compris l’œsophage proximal, en ciblant les zones anormales. Les signes endoscopiques et histologiques peuvent disparaître sous IPP : si possible, le traitement inefficace est interrompu trois à quatre semaines avant l’endoscopie.</p><div class="key"><b>Limite.</b> Sans dysphagie ni anomalie endoscopique, le rendement des biopsies est quasi nul chez les patients dont le pyrosis résiste (0 et 1,9 % dans l’étude citée par Lyon 2.0).</div><p class="src">Références : DGVS 2023, recommandations 1.10 et 2.8 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-rumination" data-title="Rumination et éructation supragastrique"><p class="lab">Rumination</p><p>La rumination est un comportement postprandial appris et inconscient, parfois agréable, qui ramène le contenu gastrique dans la bouche ; il s’arrête typiquement quand le contenu devient acide. Elle est souvent prise pour un RGO résistant aux IPP.</p><p class="lab">Éructation supragastrique</p><p>Dans l’éructation supragastrique, l’air aspiré dans l’œsophage en ressort avant d’atteindre l’estomac. La pH-impédancemétrie en est l’examen de référence. Elle a été observée chez 48 % de 50 patients atteints de RGO.</p><div class="key"><b>Conséquence.</b> Une manométrie prolongée après un repas, chez des patients au pyrosis résistant, a retrouvé une régurgitation supragastrique chez 42 % et une rumination chez 20 %. Ces troubles relèvent d’une thérapie comportementale, non d’un IPP ni d’une chirurgie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; DGVS 2023, recommandation 1.12.</p></template>
<template data-pop="k21-tour-taille" data-title="Tour de taille et obésité abdominale"><p class="lab">Pourquoi le mesurer</p><p>Le tour de taille et le rapport taille-hanches sont plus fortement associés que l’indice de masse corporelle à l’œsophagite, au Barrett et à l’adénocarcinome. Dans une méta-analyse, l’adiposité centrale multipliait le risque par 1,87 pour l’œsophagite, 1,98 pour le Barrett et 2,51 pour l’adénocarcinome, même après ajustement sur l’indice de masse corporelle.</p><p class="lab">Mécanisme</p><p>La graisse abdominale augmente la pression intra-abdominale, qui pousse le contenu gastrique vers l’œsophage et favorise la hernie hiatale ; la graisse viscérale agit aussi par des médiateurs métaboliques indépendants du reflux.</p><div class="key"><b>Conséquence.</b> Une baisse de l’indice de masse corporelle de plus de 3,5 kg/m² augmente nettement la probabilité de disparition des symptômes et l’efficacité des médicaments (cohorte norvégienne).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23358462/" target="_blank" rel="noopener">Ness-Jensen et al., 2013 (résumé)</a>.</p></template>
<template data-pop="k21-test-ipp" data-title="Le « test IPP »"><p class="lab">Principe</p><p>Le test consiste à conclure au RGO si les symptômes disparaissent sous IPP.</p><p class="lab">Valeur</p><p>La DGVS énonce que la réponse à l’IPP n’a aucune valeur pour confirmer le diagnostic. Dans une étude citée par la DGVS, ont répondu 69 % des patients atteints d’œsophagite, 49 % de ceux qui avaient un reflux non érosif, mais aussi 35 % de ceux qui n’avaient aucune preuve de RGO. Sa sensibilité est de 71 % et sa spécificité de 44 % pour les symptômes typiques ; il répond aussi dans la dyspepsie fonctionnelle.</p><div class="key"><b>Conséquence.</b> Le succès autorise à poursuivre un traitement à la demande ; il n’autorise ni un traitement à vie ni une chirurgie, qui exigent une preuve objective.</div><p class="src">Références : DGVS 2023, énoncé 1.3 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-ogd" data-title="Œsogastroduodénoscopie dans le RGO"><p class="lab">Indications</p><p>Signe d’alarme ; échec d’un IPP correctement pris pendant huit semaines ; reflux de plusieurs années, une fois, pour rechercher un Barrett ; demande du patient ou symptômes difficiles à classer (DGVS 1.4 à 1.6). L’ESGE suggère une recherche ciblée du Barrett après 50 ans en cas de reflux chronique associé à un facteur de risque.</p><p class="lab">Préparation et compte rendu</p><p>Dans un reflux non encore prouvé, l’IPP est arrêté deux à quatre semaines avant. Le compte rendu indique le grade de Los Angeles, la position de la jonction et de l’empreinte diaphragmatique, la longueur d’un éventuel segment cylindrique selon Prague, et décrit toute lésion visible.</p><p class="lab">Rendement</p><p>Sur 73 335 endoscopies pour reflux non compliqué, la DGVS rapporte 0,1 % de tumeurs œsophagiennes, 0,1 % de tumeurs gastriques, 2,8 % de sténoses, 2 % d’œsophagites sévères et 5,6 % d’œsophages de Barrett.</p><p class="src">Références : DGVS 2023, recommandations 1.4 à 1.6 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; <a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">ESGE 2023</a>.</p></template>
<template data-pop="k21-contentieux-lab" data-title="Contentieux : l’œsophagite de grade B prouve-t-elle le RGO ?"><p class="lab">Les positions</p><p>Le consensus de Lyon de 2018, repris dans le tableau de la DGVS (mars 2023), ne retenait comme concluants que les grades C et D ; les grades A et B étaient « limites ». Le commentaire de la DGVS ajoutait qu’avec des symptômes typiques, un grade B laisse peu de doute. Le consensus de Lyon 2.0 (publié en ligne en 2023, Gut 2024) rend le grade B concluant : son exposition acide est comparable à celle du grade C (13,7 contre 11,7 %), et la réponse à l’IPP aussi (74 contre 70 %).</p><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente, Lyon 2.0, l’emporte : un grade B bien caractérisé prouve le RGO sans pH-métrie. Le grade A reste insuffisant, car il existe chez des sujets sains.</p><p class="lab">Textes en vigueur</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, texte intégral</a> ; <a href="https://www.dgvs.de/wp-content/uploads/2024/10/ZFG_LL-Reflux_Leitlinie_final_englisch_15.10.24.pdf" target="_blank" rel="noopener">DGVS 2023, version anglaise, tableau 5</a>.</p></template>
<template data-pop="k21-phmetrie" data-title="pH-métrie et pH-impédancemétrie"><p class="lab">Techniques</p><p>La pH-métrie par sonde mesure le pH de l’œsophage distal pendant 24 heures. La pH-métrie sans fil fixe une capsule à la muqueuse lors de l’endoscopie et enregistre jusqu’à 96 heures, ce qui intègre la variabilité d’un jour à l’autre ; elle ne mesure que l’acidité. La pH-impédancemétrie détecte en plus les reflux faiblement acides, non acides et gazeux, l’éructation supragastrique et la rumination.</p><p class="lab">Seuils hors IPP (Lyon 2.0)</p><p>Temps d’exposition acide inférieur à 4 % : physiologique ; 4 à 6 % : non concluant ; supérieur à 6 % : pathologique. En pH-métrie sans fil, un TEA supérieur à 6 % pendant au moins deux jours prouve le RGO ; inférieur à 4 % tous les jours, sans association aux symptômes, il l’exclut.</p><div class="key"><b>Piège.</b> Les valeurs normales diffèrent selon le système d’enregistrement : le 95ᵉ centile du TEA était de 2,8 % avec un fabricant et de 5 % avec l’autre chez des volontaires sains.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-manometrie" data-title="Manométrie haute résolution"><p class="lab">Rôle</p><p>La manométrie mesure les pressions le long de l’œsophage et à la jonction. Elle ne diagnostique pas le RGO ; elle écarte une achalasie chez le patient qui ne répond pas à l’IPP, et elle est obligatoire avant toute chirurgie antireflux (DGVS 1.12 et 3.3).</p><p class="lab">Ce qu’elle montre</p><p>Une jonction hypotonique, une hernie hiatale ou une hypomotilité œsophagienne soutiennent le diagnostic de RGO. Un trouble moteur majeur peut contre-indiquer la fundoplicature ou en modifier le type.</p><div class="key"><b>Erreur fréquente.</b> Une achalasie peut provoquer un pyrosis ; opérée par fundoplicature à tort, elle s’aggrave. La manométrie préopératoire évite cette erreur.</div><p class="src">Références : DGVS 2023, recommandations 1.12, 2.8 et 3.3 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-stenose" data-title="Sténose peptique"><p class="lab">Mécanisme</p><p>La sténose peptique est la cicatrice fibreuse d’une œsophagite prolongée. Elle rétrécit la lumière et provoque une dysphagie aux solides.</p><p class="lab">Place diagnostique</p><p>Elle prouve le RGO (Lyon 2.0). Sa récidive sous IPP optimisé signe un RGO réfractaire.</p><p class="lab">Traitement</p><p>Elle est devenue beaucoup plus rare depuis les IPP. Après dilatation endoscopique, une inhibition acide efficace et continue conditionne le maintien du résultat (DGVS 2.10).</p><div class="key"><b>Piège.</b> Une dysphagie progressive ne doit pas être attribuée à une sténose peptique avant que l’endoscopie et les biopsies aient exclu un cancer.</div><p class="src">Références : DGVS 2023, recommandation 2.10 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
<template data-pop="k21-hernie-pe" data-title="Hernie para-œsophagienne : quand opérer"><p class="lab">Recommandations</p><p>La DGVS recommande d’opérer la hernie para-œsophagienne symptomatique et l’estomac retourné dans le thorax. L’EAES (2023), pour les hernies de types II à IV contenant au moins la moitié de l’estomac, suggère la chirurgie même lorsque la hernie est asymptomatique ou peu symptomatique, sauf chez le patient fragile, pour qui l’abstention est fortement recommandée.</p><p class="lab">Technique</p><p>L’EAES suggère une fundoplicature plutôt qu’une gastropexie en chirurgie programmée, et une gastropexie chez le patient instable opéré en urgence. Elle suggère aussi un renfort prothétique du hiatus, alors que la DGVS déconseille de l’utiliser systématiquement ; la recommandation la plus récente, celle de l’EAES, l’emporte pour ces hernies volumineuses.</p><p class="src">Références : DGVS 2023, recommandations 3.7 et 3.8 ; <a href="https://pubmed.ncbi.nlm.nih.gov/37910246/" target="_blank" rel="noopener">Markar et al., EAES 2023 (résumé)</a>.</p></template>
<template data-pop="k21-mesures" data-title="Mesures générales"><p>La DGVS recommande de conseiller ces mesures à tout patient, en les ciblant selon les symptômes.</p><table class="t"><tr><th>Mesure</th><th>Effet documenté</th><th>Pour qui</th></tr><tr><td>Perte de poids</td><td>Moins de symptômes, pH œsophagien amélioré, moins d’IPP</td><td>Surpoids ou prise de poids récente</td></tr><tr><td>Surélévation de la tête du lit</td><td>Symptômes et pH améliorés (trois essais randomisés)</td><td>Symptômes nocturnes</td></tr><tr><td>Pas de repas tardif</td><td>Acidité nocturne réduite</td><td>Symptômes nocturnes</td></tr><tr><td>Respiration abdominale</td><td>Symptômes, pH et consommation d’IPP réduits</td><td>Patient demandeur</td></tr><tr><td>Arrêt du tabac</td><td>Amélioration chez le fumeur de poids normal</td><td>Tous</td></tr></table><p>Le décubitus latéral gauche réduit le reflux nocturne pour des raisons anatomiques. Les sports qui sollicitent fortement la presse abdominale sont plutôt défavorables.</p><p class="src">Références : DGVS 2023, recommandation 2.2 et tableau 6 ; <a href="https://pubmed.ncbi.nlm.nih.gov/23358462/" target="_blank" rel="noopener">Ness-Jensen et al., 2013 (résumé)</a>.</p></template>
<template data-pop="k21-fundoplicature" data-title="Fundoplicature laparoscopique"><p class="lab">Principe</p><p>La chirurgie ramène l’œsophage distal dans l’abdomen, rétrécit le hiatus et entoure l’œsophage terminal d’une manchette gastrique, totale (Nissen) ou partielle postérieure (Toupet). Elle réduit tous les types de reflux, acides ou non.</p><p class="lab">Résultats</p><p>Dans les centres expérimentés, la morbidité est inférieure à 10 %, les complications à 5 % et la mortalité à 0,2 %. Plus de 80 % des patients gardent un bon contrôle quinze ans après une Nissen ; la récidive atteint 5,2 % à cinq ans et 6,9 % à dix ans dans une grande série, et jusqu’à 30 % des opérés reprennent un IPP au cours de leur vie. Dans l’essai européen Lotus, IPP et chirurgie ont donné des rémissions comparables à cinq ans ; la régurgitation persistait davantage sous IPP, la dysphagie et les ballonnements davantage après chirurgie.</p><div class="key"><b>Limite.</b> Chez le patient porteur d’un Barrett, la chirurgie ne protège pas de l’adénocarcinome (rapport d’un exposé suisse, ARS Medici 2024).</div><p class="src">Références : DGVS 2023, recommandations 3.5 et 3.9 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a> ; <a href="https://rosenfluh.ch/media/arsmedici/2024/24/Refluxerkrankung-PPI-Therapie-kann-optimiert-werden.pdf" target="_blank" rel="noopener">Frühauf, compte rendu, ARS Medici 2024</a>.</p></template>
<template data-pop="k21-icarus" data-title="Consensus ICARUS (2019)"><p>Ce consensus Delphi de 35 experts internationaux, coordonné à Louvain, précise comment sélectionner les patients pour une chirurgie antireflux.</p><p class="lab">Bons candidats</p><p>Patients dont le pyrosis répondait de façon satisfaisante à l’IPP, porteurs d’une hernie hiatale, d’une œsophagite de grade B ou plus, ou d’un œsophage de Barrett.</p><p class="lab">Examens obligatoires</p><p>Endoscopie ; manométrie pour exclure un trouble moteur majeur ; pH-métrie, avec ou sans impédance, hors IPP si l’endoscopie ne montre pas d’œsophagite indiscutable. Un transit baryté est fait si une hernie ou un œsophage court est suspecté.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/31375601/" target="_blank" rel="noopener">Pauwels et al., Gut 2019 (résumé)</a>.</p></template>
<template data-pop="k21-contentieux-fundo" data-title="Contentieux : fundoplicature totale ou partielle"><p class="lab">Les positions</p><p>La recommandation rapide UEG et EAES (novembre 2022), fondée sur une méta-analyse en réseau, suggère une fundoplicature partielle postérieure plutôt que totale ou antérieure à 90°, avec une recommandation faible : le contrôle du reflux est comparable, la dysphagie moindre. La DGVS (mars 2023) recommande la manchette partielle de Toupet dans les centres peu expérimentés avec la Nissen, et la Nissen dans les centres expérimentés pour son efficacité à long terme.</p><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente, la DGVS, l’emporte : le type de manchette dépend de l’expérience du centre. Les deux textes s’accordent pour que la manchette partielle soit disponible, et pour qu’un trouble moteur oriente vers elle.</p><p class="lab">Textes en vigueur</p><p><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9731663/" target="_blank" rel="noopener">UEG et EAES 2022, texte intégral</a> ; <a href="https://www.dgvs.de/wp-content/uploads/2024/10/ZFG_LL-Reflux_Leitlinie_final_englisch_15.10.24.pdf" target="_blank" rel="noopener">DGVS 2023, recommandation 3.5</a>.</p></template>
<template data-pop="k21-linx" data-title="Anneau magnétique LINX"><p class="lab">Principe</p><p>Un anneau souple de billes magnétiques est placé par laparoscopie autour de la jonction œso-gastrique ; il renforce la barrière tout en s’ouvrant à la déglutition.</p><p class="lab">Données</p><p>Dans une étude sans groupe contrôle, l’exposition acide est passée de 10,9 à 3,3 %. Chez des patients au RGO prouvé, plus de 80 reflux par jour sous double dose d’IPP prédisaient la satisfaction : 85 % étaient améliorés, 93 % lorsque la régurgitation dominait. La recommandation UEG et EAES n’a trouvé aucun essai randomisé comparant l’anneau à la fundoplicature avec un recul suffisant.</p><div class="key"><b>Conduite.</b> La DGVS ouvre cette option aux patients au RGO prouvé avec une petite hernie, dans des études ou des centres sélectionnés.</div><p class="src">Références : DGVS 2023, recommandation 3.6 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9731663/" target="_blank" rel="noopener">UEG et EAES 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014</a>.</p></template>
<template data-pop="k21-prague" data-title="Classification de Prague C et M"><p>La classification de Prague décrit l’étendue d’un épithélium cylindrique de l’œsophage par deux mesures prises au-dessus de la jonction œso-gastrique : C, l’extension circulaire, et M, l’extension maximale, languettes comprises.</p><p class="lab">Exemple</p><p>Un segment circulaire de 2 cm surmonté d’une languette atteignant 5 cm s’écrit C = 2 cm, M = 5 cm. L’intervalle de surveillance de l’ESGE se fonde sur M.</p><p class="lab">Repères</p><p>La jonction se situe au sommet des plis gastriques, sans insufflation excessive ni péristaltisme. L’accord entre observateurs est excellent à partir de 1 cm : c’est pourquoi le diagnostic de Barrett exige au moins 1 cm. Les îlots situés au-dessus du segment sont notés séparément.</p><p class="src">Références : DGVS 2023, recommandations 4.3 et 4.4 ; <a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">ESGE 2023, recommandation 5</a>.</p></template>
<template data-pop="k21-seattle" data-title="Protocole de Seattle et qualité de la surveillance"><p class="lab">Protocole</p><p>L’endoscopiste biopsie d’abord toute lésion visible (une à deux biopsies si une résection est envisageable), puis prélève des biopsies aléatoires dans les quatre quadrants tous les 2 cm, en partant du sommet des plis gastriques (ESGE). La DGVS indique un intervalle de 1 à 2 cm.</p><p class="lab">Qualité</p><p>L’ESGE recommande l’endoscopie haute définition, la chromoendoscopie à l’acide acétique ou virtuelle, une minute d’inspection par centimètre, des photographies de chaque centimètre et un créneau d’au moins trente minutes.</p><div class="key"><b>Piège.</b> En présence d’une œsophagite C ou D, les biopsies aléatoires sont inutiles : l’inflammation imite la dysplasie. L’endoscopie est répétée au moins six semaines après l’optimisation du traitement.</div><p class="src">Références : <a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">ESGE 2023, recommandations 4 et 5</a> ; DGVS 2023, recommandation 4.6.</p></template>
<template data-pop="k21-contentieux-barrett" data-title="Contentieux : surveillance et chimioprévention du Barrett"><p class="lab">Intervalles de surveillance</p><p>La DGVS (mars 2023) propose une endoscopie de contrôle à un an, puis tous les trois à cinq ans selon la longueur, le sexe et le tabac. L’ESGE (2023, publiée après) fixe cinq ans de 1 à moins de 3 cm, trois ans de 3 à moins de 10 cm, et un centre expert au-delà.</p><p class="lab">Chimioprévention</p><p>La DGVS juge la chimioprévention non établie et limite l’IPP aux symptômes et aux lésions. L’ESGE suggère un IPP à dose standard une fois par jour chez tout patient porteur de Barrett (recommandation faible) et recommande de ne pas utiliser l’aspirine ni les AINS dans ce but. Elle s’appuie sur une méta-analyse d’études observationnelles (risque divisé par deux) et sur l’essai AspECT (2 557 patients, 8,9 ans), où la double dose d’ésoméprazole a amélioré un critère composite incluant la mortalité, sans groupe sans IPP.</p><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente, l’ESGE 2023, l’emporte pour les intervalles et la chimioprévention. La dysplasie de bas grade suit aussi l’ESGE : centre expert, contrôle à six mois, ablation si elle est confirmée sur deux endoscopies.</p><p class="lab">Textes en vigueur</p><p><a href="https://doi.org/10.1055/a-2176-2440" target="_blank" rel="noopener">ESGE 2023</a> ; <a href="https://www.dgvs.de/wp-content/uploads/2024/10/ZFG_LL-Reflux_Leitlinie_final_englisch_15.10.24.pdf" target="_blank" rel="noopener">DGVS 2023, chapitre 4</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6083438/" target="_blank" rel="noopener">Jankowski et al., AspECT, Lancet 2018 (résumé)</a>.</p></template>
<template data-pop="k21-desescalade" data-title="Désescalade des IPP"><p class="lab">Méthode</p><p>Aucune méthode idéale n’a été démontrée. La DGVS propose une réduction par paliers : double dose vers dose simple, puis demi-dose, puis prise alternée, avec un traitement à la demande pour les symptômes intercurrents. Dans une étude ouverte de 6 249 patients dyspeptiques sous IPP continu, 75,1 % ont réduit ou arrêté leur IPP en un an grâce à une information et à un alginate en cas de besoin.</p><p class="lab">Rebond acide</p><p>Chez le sujet sain sans <i>Helicobacter pylori</i>, l’arrêt brutal d’un IPP peut provoquer une hypersécrétion acide de rebond, d’autant plus que le traitement a été long. Un relais par antihistaminique H2 ne l’évite pas, car cette classe provoque elle-même un rebond.</p><div class="key"><b>Option nouvelle.</b> Une pH-métrie sans fil faite après au moins sept jours d’arrêt prédit le succès de l’arrêt : dans un essai de 100 patients, l’absence d’exposition acide pathologique était le meilleur facteur prédictif.</div><p class="src">Référence : DGVS 2023, recommandation 2.15.</p></template>
<template data-pop="k21-securite-ipp" data-title="Sécurité des IPP au long cours"><p class="lab">Ce que disent les essais</p><p>Dans l’essai randomisé COMPASS, 17 598 patients ont reçu pantoprazole 40 mg ou placebo pendant une médiane de trois ans : seule une légère augmentation des infections entériques a été observée. La DGVS conclut que le risque absolu est faible et que le bénéfice l’emporte dans le RGO ; aucune association n’a été retrouvée avec la démence dans les études prospectives.</p><p class="lab">Ce que disent les informations professionnelles</p><p>Elles mentionnent une augmentation modérée du risque de fracture (10 à 40 % dans les études observationnelles), l’hypomagnésémie, une malabsorption de la cobalamine après plusieurs années, une légère augmentation des infections intestinales, des polypes glandulaires fundiques bénins et, très rarement, une néphrite interstitielle ou un lupus cutané subaigu.</p><div class="key"><b>Conséquence.</b> La sécurité ne justifie pas une prescription sans indication, ni l’arrêt d’un IPP nécessaire.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31152740/" target="_blank" rel="noopener">Moayyedi et al., 2019 (résumé)</a> ; DGVS 2023, énoncé 2.16 ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">informations professionnelles Nexium® et Pantoprazol-Mepha®</a>.</p></template>
<template data-pop="k21-hypomagnesemie" data-title="Hypomagnésémie sous IPP"><p class="lab">Survenue</p><p>Des hypomagnésémies sévères ont été rapportées après au moins trois mois d’IPP, le plus souvent après un an. Leur mécanisme n’est pas détaillé dans les informations professionnelles.</p><p class="lab">Signes</p><p>Fatigue, tétanie, délire, convulsions, vertiges et arythmies ventriculaires ; le début peut être insidieux. Une hypomagnésémie sévère peut entraîner une hypocalcémie et une hypokaliémie.</p><p class="lab">Conduite</p><p>La magnésémie se mesure avant et pendant un traitement prolongé chez le patient qui prend de la digoxine ou un diurétique. Le trouble s’améliore le plus souvent après apport de magnésium et arrêt de l’IPP.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Nexium® (06.2026) et Pantoprazol-Mepha® (12.2022)</a>.</p></template>
<template data-pop="k21-association" data-title="Association symptôme-reflux"><p class="lab">Principe</p><p>Pendant l’enregistrement, le patient signale ses symptômes ; le logiciel calcule s’ils suivent un épisode de reflux dans une fenêtre de deux minutes. Une probabilité d’association supérieure à 95 % ou un index symptomatique supérieur à 50 % renforce le lien.</p><p class="lab">Usage</p><p>Combinée à l’exposition acide, l’association définit quatre situations : reflux anormal et association positive, reflux anormal sans association, reflux normal avec association (hypersensibilité), reflux normal sans association (pyrosis fonctionnel). La réponse à un traitement antireflux est la plus probable dans la première.</p><div class="key"><b>Limite.</b> L’association dépend de la promptitude avec laquelle le patient signale ses symptômes ; elle n’est pas toujours fiable.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4078752/" target="_blank" rel="noopener">Boeckxstaens et al., 2014, figure 5</a>.</p></template>
<template data-pop="k21-impedance-basale" data-title="Impédance basale nocturne"><p class="lab">Principe</p><p>L’impédance électrique de la muqueuse œsophagienne au repos, mesurée la nuit en dehors des déglutitions et des reflux, reflète l’intégrité de l’épithélium : une muqueuse perméable conduit mieux le courant.</p><p class="lab">Seuils (Lyon 2.0)</p><p>Moins de 1 500 ohms : argument en faveur du RGO, ce seuil correspondant au 5ᵉ centile des sujets sains. Plus de 2 500 ohms : argument contre.</p><div class="key"><b>Limite.</b> L’impédance basale baisse aussi dans d’autres inflammations et en cas de stase liquidienne, comme dans l’achalasie : elle reste un argument d’appoint.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10846564/" target="_blank" rel="noopener">Lyon 2.0, 2024</a>.</p></template>
