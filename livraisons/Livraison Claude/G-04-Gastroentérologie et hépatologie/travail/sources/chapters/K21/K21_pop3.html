
<!-- ===== FENÊTRES : œsophagites non peptiques et médicaments ===== -->
<template data-pop="k21-agree" data-title="Critères diagnostiques de l’œsophagite à éosinophiles (2018)">
<div class="lab">Source</div><p>Dellon E. S. et collègues, Gastroenterology 2018;155:1022–1033 : conférence de consensus internationale réunissant des gastroentérologues, allergologues et pathologistes de 14 pays, dont l’équipe suisse d’Olten et de Lausanne.</p>
<div class="lab">Critères</div><p>Symptômes de dysfonction œsophagienne ; au moins 15 éosinophiles par champ à fort grossissement, environ 60 par mm², sur une biopsie œsophagienne ; évaluation complète des autres maladies capables de provoquer ou d’entretenir une éosinophilie œsophagienne.</p>
<div class="lab">Ce qui a changé</div><p>L’essai d’IPP préalable a été supprimé. Les patients répondeurs aux IPP, autrefois classés à part, ont les mêmes caractéristiques cliniques, histologiques et moléculaires que les autres. Les IPP sont désormais un traitement de l’EoE et non un critère diagnostique.</p>
<div class="lab">Portée</div><p>Ces critères s’appliquent à l’enfant et à l’adulte. Les recommandations européennes de 2017 (UEG, EAACI, ESPGHAN, EUREOS) restent la référence européenne pour le traitement.</p></template>

<template data-pop="k21-adapt" data-title="Comportements d’adaptation dans l’œsophagite à éosinophiles">
<div class="lab">Description</div><p>Le patient mastique très longuement, coupe ses aliments en petits morceaux, boit après chaque bouchée, mange lentement et évite la viande, le pain ou le riz. Il finit souvent son repas après les autres.</p>
<div class="lab">Pourquoi c’est important</div><p>Ces adaptations réduisent la dysphagie ressentie. Un patient qui répond « non » à la question « avez-vous du mal à avaler ? » peut avoir une EoE avancée. Les questions doivent porter sur les comportements.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>Le médecin peut retenir six questions : boit-il pour faire passer, modifie-t-il les aliments, mange-t-il plus lentement, évite-t-il des textures, mâche-t-il longuement, évite-t-il les comprimés ? Une réponse positive justifie la recherche d’une EoE.</p></template>

<template data-pop="k21-erefs" data-title="Score endoscopique EREFS">
<div class="lab">Composantes</div><p>Œdème (perte du dessin vasculaire), anneaux (fixes, concentriques), exsudats (points ou plaques blanches d’éosinophiles), sillons longitudinaux, sténose.</p>
<div class="lab">Lecture</div><p>Œdème, exsudats et sillons traduisent l’inflammation et régressent sous traitement. Anneaux et sténose traduisent la fibrose et persistent souvent.</p>
<div class="lab">Limite</div><p>L’endoscopie peut paraître normale dans une EoE active. Le diagnostic reste histologique.</p></template>

<template data-pop="k21-biopsie" data-title="Biopsies étagées de l’œsophage">
<div class="lab">Technique</div><p>Au moins six biopsies réparties sur l’œsophage proximal et distal, en ciblant les zones anormales (exsudats, sillons). Les recommandations européennes de 2017 les demandent même si la muqueuse paraît normale, et conseillent des biopsies gastriques et duodénales au diagnostic.</p>
<div class="lab">Pourquoi</div><p>Les éosinophiles se répartissent en foyers. Un nombre insuffisant de biopsies manque le pic qui sert au diagnostic. L’atteinte proximale distingue l’EoE du reflux, limité au distal.</p>
<div class="lab">Piège</div><p>Sous IPP ou corticostéroïde topique, le comptage peut être faussement bas. Le médecin précise au pathologiste les traitements en cours.</p></template>

<template data-pop="k21-diete" data-title="Régimes d’éviction dans l’œsophagite à éosinophiles">
<div class="lab">Principe</div><p>Retirer les aliments les plus souvent responsables, puis les réintroduire un à un avec un contrôle endoscopique et histologique, pour identifier le déclencheur.</p>
<div class="lab">Efficacité (recommandations européennes 2017)</div><p>Éviction de six aliments (lait, blé, œuf, soja, fruits à coque, poissons et crustacés) : rémission histologique chez environ trois quarts des patients. Quatre aliments chez l’adulte : environ 50 %. Deux aliments (lait et céréales à gluten) : environ 40 %. Régime élémentaire : jusqu’à 90 %, mais difficile à suivre.</p>
<div class="lab">Limite</div><p>Les tests allergologiques guident mal le choix des aliments ; un régime guidé par eux donne une rémission chez moins d’un tiers des adultes. L’approche par étapes, commencée par deux aliments, réduit le nombre d’endoscopies. Un diététicien encadre le régime.</p></template>

<template data-pop="k21-dilat" data-title="Dilatation endoscopique">
<div class="lab">Indication</div><p>Sténose ou calibre réduit avec dysphagie ou impaction qui persiste malgré le traitement anti-inflammatoire, dans l’EoE ; sténose peptique ou caustique.</p>
<div class="lab">Efficacité</div><p>Dans l’EoE, elle améliore la dysphagie chez environ trois quarts des adultes avec calibre réduit, sans agir sur l’inflammation.</p>
<div class="lab">Risques</div><p>Douleur thoracique transitoire fréquente ; perforation inférieure à 1 % dans l’EoE selon les recommandations européennes de 2017. Après une ingestion caustique, le risque de perforation est plus élevé et la WSES recommande d’attendre environ la troisième semaine.</p></template>

<template data-pop="k21-cand" data-title="Candidose œsophagienne">
<div class="lab">Terrain</div><p>Corticostéroïdes inhalés ou oraux, antibiotiques, diabète, IPP au long cours, cancer, greffe, infection par le VIH avec immunodépression. Elle se code B37.81.</p>
<div class="lab">Clinique et endoscopie</div><p>Odynophagie, dysphagie ; muguet buccal fréquent mais inconstant. Plaques blanchâtres adhérentes qui laissent une muqueuse érythémateuse quand on les décolle.</p>
<div class="lab">Diagnostic</div><p>Biopsie ou brossage montrant levures et pseudo-filaments. L’IDSA 2016 juge approprié un essai antifongique avant l’endoscopie dans un tableau typique.</p>
<div class="lab">Traitement</div><p>Toujours systémique : fluconazole par voie orale. En cas d’échec, l’endoscopie recherche une résistance ou une autre cause.</p></template>

<template data-pop="k21-hsv" data-title="Œsophagite herpétique">
<div class="lab">Terrain</div><p>Immunodépression surtout, parfois adulte immunocompétent après une primo-infection.</p>
<div class="lab">Endoscopie et histologie</div><p>Vésicules puis ulcères superficiels, bien limités, souvent multiples. Les biopsies se font au bord des ulcères, où se trouvent les cellules multinucléées à inclusions ; l’immunohistochimie ou l’amplification génique confirment.</p>
<div class="lab">Traitement</div><p>Aciclovir par voie intraveineuse chez le patient qui ne peut pas avaler ou qui est immunodéprimé sévère, puis relais oral ; valaciclovir par voie orale dans les formes moins sévères. Chez l’immunocompétent, la guérison spontanée est possible, mais le traitement accélère la récupération.</p></template>

<template data-pop="k21-cmv" data-title="Œsophagite à cytomégalovirus">
<div class="lab">Terrain</div><p>Immunodépression sévère : greffe d’organe ou de moelle, infection par le VIH avec lymphocytes CD4 très bas, chimiothérapie.</p>
<div class="lab">Endoscopie et histologie</div><p>Ulcères profonds, allongés, parfois géants. Le virus infecte les cellules endothéliales et stromales : les biopsies se font au fond de l’ulcère.</p>
<div class="lab">Traitement</div><p>Ganciclovir par voie intraveineuse, 5 mg/kg toutes les 12 heures pendant 14 à 21 jours selon l’information professionnelle suisse de Cymevene, adapté à la clairance de la créatinine ; relais oral possible selon l’avis infectiologique. Le cours I-03-Infectiologie traite les infections à cytomégalovirus (B25).</p></template>

<template data-pop="k21-pill" data-title="Œsophagite médicamenteuse">
<div class="lab">Mécanisme</div><p>Le comprimé reste au contact de la paroi, surtout au niveau de l’empreinte aortique ou d’une sténose. Il libère une solution acide (doxycycline), caustique (bisphosphonates, chlorure de potassium) ou toxique (AINS, fer) qui ulcère la muqueuse.</p>
<div class="lab">Facteurs favorisants</div><p>Prise couchée ou au coucher, avec peu d’eau ; sujet âgé ; sténose, trouble moteur ou compression par l’oreillette gauche dilatée.</p>
<div class="lab">Clinique</div><p>Douleur rétrosternale brutale et odynophagie quelques heures après la prise. L’endoscopie, si elle est faite, montre un ulcère isolé ou des ulcères en miroir, au tiers moyen.</p>
<div class="lab">Prévention et traitement</div><p>Prise debout avec un grand verre d’eau, à distance du coucher ; alendronate au lever, position droite 30 minutes, selon son information professionnelle suisse. Arrêt ou changement de forme du médicament. La guérison prend quelques jours à quelques semaines.</p></template>

<template data-pop="k21-caust" data-title="Ingestion de caustique">
<div class="lab">Agents</div><p>Bases fortes : déboucheurs, détergents pour lave-vaisselle, produits de décapage. Acides forts : détartrants, nettoyants de sanitaires. L’eau de Javel ménagère diluée produit le plus souvent des lésions légères.</p>
<div class="lab">Mécanisme</div><p>Les bases provoquent une nécrose de liquéfaction, qui saponifie les graisses et progresse en profondeur. Les acides provoquent une nécrose de coagulation qui limite la pénétration, mais atteignent souvent l’estomac.</p>
<div class="lab">Conduite initiale (WSES 2015)</div><p>Identifier le produit et appeler Tox Info Suisse (145). Ne pas faire vomir, pas de lavage, pas de lait ni d’eau pour diluer, aucune neutralisation. Sécuriser les voies aériennes, de préférence sous fibroscopie. Éviter la sonde nasogastrique. Pas de corticostéroïdes systématiques ; ils se discutent en cas d’atteinte des voies aériennes.</p>
<div class="lab">Évaluation : contentieux endoscopie ou tomodensitométrie</div><p>L’endoscopie, réalisée habituellement 3 à 6 heures après l’ingestion selon la WSES, grade les lésions selon Zargar et reste la référence. La tomodensitométrie détecte mieux la nécrose transmurale. La WSES (2015, faible niveau de preuve) propose la tomodensitométrie pour guider la décision chirurgicale dans les grades 3b et la considère comme une alternative possible à l’endoscopie chez certains patients. Des études plus récentes la jugent prédictive des complications, sans la valider comme examen unique. MEDINA retient donc la WSES 2015, source de recommandation la plus récente identifiée, avec cette limite explicite.</p>
<div class="lab">Codage</div><p>K20.8 pour l’œsophagite due à des substances chimiques ; T28 (brûlure et corrosion d’organes internes) et T54 (effet toxique de substances corrosives) relèvent du fragment M-19-Médecine d’urgence, traumatologie et toxicologie.</p></template>

<template data-pop="k21-zargar" data-title="Classification endoscopique de Zargar">
<div class="lab">Grades</div><p>0 : muqueuse normale. 1 : œdème et érythème. 2a : friabilité, hémorragies, érosions, exsudats, ulcérations superficielles. 2b : ulcérations profondes, isolées ou circonférentielles. 3a : petites zones de nécrose dispersées. 3b : nécrose étendue.</p>
<div class="lab">Valeur</div><p>Les grades 0 à 2a guérissent habituellement sans séquelle. Les grades 2b et 3 exposent aux sténoses. Le grade 3b fait discuter la chirurgie, selon la WSES.</p>
<div class="lab">Limite</div><p>L’endoscopie voit la surface et estime mal la profondeur de la nécrose ; c’est la raison de l’essor de la tomodensitométrie.</p></template>

<template data-pop="k21-radique" data-title="Œsophagite radique">
<div class="lab">Mécanisme</div><p>Les rayonnements tuent les cellules basales en division. L’épithélium de surface continue de desquamer sans être remplacé ; la perte de substance apparaît après un délai de deux à trois semaines.</p>
<div class="lab">Facteurs de gravité</div><p>Dose et volume d’œsophage irradiés, chimiothérapie concomitante.</p>
<div class="lab">Conduite</div><p>Antalgiques, anesthésiques locaux avant les repas, alimentation molle, recherche d’une candidose surajoutée, nutrition entérale si l’apport devient insuffisant. Une sténose tardive se dilate prudemment. La prise en charge de la radiothérapie relève du fragment O-09-Oncologie, génétique médicale et soins palliatifs.</p></template>

<template data-pop="k21-tb" data-title="Tuberculose de l’œsophage">
<div class="lab">Mécanisme</div><p>Atteinte le plus souvent secondaire, par extension d’adénopathies médiastinales tuberculeuses à la paroi ; l’atteinte primitive est exceptionnelle.</p>
<div class="lab">Clinique</div><p>Dysphagie, odynophagie, fièvre, perte de poids, toux à la déglutition si une fistule œso-trachéale ou œso-bronchique s’est formée.</p>
<div class="lab">Diagnostic</div><p>Endoscopie : ulcère ou masse du tiers moyen. Biopsies : granulomes épithélioïdes avec nécrose caséeuse, culture et amplification génique de <i>Mycobacterium tuberculosis</i>. La tomodensitométrie montre les adénopathies.</p>
<div class="lab">Codage et traitement</div><p>A18.8† et K23.0*. Traitement antituberculeux standard, traité dans le fragment I-03-Infectiologie.</p></template>

<template data-pop="k21-chagas" data-title="Méga-œsophage chagasique">
<div class="lab">Mécanisme</div><p><i>Trypanosoma cruzi</i>, transmis par des punaises en Amérique latine, par la transfusion ou de la mère à l’enfant, détruit des années plus tard les neurones du plexus myentérique.</p>
<div class="lab">Conséquence</div><p>Le sphincter inférieur ne se relâche plus et le péristaltisme disparaît : le tableau ressemble à une achalasie, avec dysphagie, régurgitations et dilatation progressive. Le côlon et le cœur peuvent être atteints.</p>
<div class="lab">Diagnostic</div><p>Sérologie de <i>Trypanosoma cruzi</i> ; manométrie de type achalasie ; électrocardiogramme et échocardiographie pour la cardiomyopathie.</p>
<div class="lab">Codage</div><p>B57.3† et K23.1*. La maladie de Chagas relève du fragment I-03-Infectiologie ; le traitement de la dysphagie suit les principes de l’achalasie (cours K22).</p></template>

<template data-pop="k21-d-ipp" data-title="Monographie : inhibiteurs de la pompe à protons">
<div class="lab">Mécanisme</div><p>Promédicaments activés dans le canalicule acide de la cellule pariétale ; liaison covalente aux cystéines de la H⁺/K⁺-ATPase active, qui bloque l’étape finale de la sécrétion acide.</p>
<div class="lab">Preuves</div><p>Supérieurs aux antagonistes H2 pour cicatriser l’œsophagite (ACG 2022, recommandation forte, preuve élevée) et pour l’entretien. Dans LOTUS, l’ésoméprazole maintenait la rémission chez 92 % des patients à cinq ans.</p>
<div class="lab">Posologie</div><p>Dose standard une fois par jour, 30 à 60 minutes avant le premier repas : ésoméprazole 40 mg pour l’œsophagite et 20 mg pour les symptômes, oméprazole 20 mg, pantoprazole 40 mg, lansoprazole 30 mg, rabéprazole 20 mg. Voir le tableau de l’onglet Pharmacologie.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, troubles digestifs ; au long cours, hypomagnésémie, infections intestinales, lupus cutané subaigu, rares réactions cutanées graves.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux benzimidazoles substitués. Association déconseillée avec le clopidogrel (oméprazole, ésoméprazole), l’atazanavir et le nelfinavir.</p>
<div class="lab">Surveillance</div><p>Indication documentée et revue au moins chaque année ; magnésémie si digoxine ou diurétique ; arrêt 5 à 14 jours avant un dosage de chromogranine A.</p></template>

<template data-pop="k21-d-alg" data-title="Monographie : alginates et antiacides">
<div class="lab">Mécanisme</div><p>Au contact de l’acide gastrique, l’alginate de sodium forme un gel ; le bicarbonate libère du gaz carbonique qui le fait flotter. Ce radeau se place au-dessus du contenu gastrique, sur la poche acide, et diminue le reflux. Le carbonate de calcium neutralise l’acide.</p>
<div class="lab">Posologie (Gaviscon, information professionnelle suisse)</div><p>Dès 12 ans : 2 à 4 comprimés à croquer ou 10 à 20 mL de suspension après les repas et au coucher, jusqu’à quatre fois par jour. Consultation si aucune amélioration après sept jours.</p>
<div class="lab">Précautions</div><p>Un comprimé contient 63,16 mg de sodium : prudence en cas de régime pauvre en sel. Les antiacides diminuent l’absorption de nombreux médicaments ; un intervalle d’environ deux heures est prudent.</p>
<div class="lab">Place</div><p>Traitement à la demande, complément d’un IPP pour les symptômes post-prandiaux ou nocturnes, grossesse. Ils ne cicatrisent pas une œsophagite sévère.</p></template>

<template data-pop="k21-d-h2" data-title="Antagonistes H2, sucralfate et vonoprazan en Suisse">
<div class="lab">Constat</div><p>Une recherche sur ch.oddb.org le 08.10.2026 n’a trouvé aucune spécialité de famotidine, ranitidine, nizatidine, cimétidine, sucralfate ou vonoprazan. Une synthèse suisse de 2022 (Ars Medici) indiquait déjà que les antagonistes H2 n’étaient plus commercialisés en Suisse.</p>
<div class="lab">Conséquence</div><p>Les options de l’ACG 2022 qui les utilisent (antagoniste H2 au coucher, sucralfate pendant la grossesse) ne sont pas transposables directement. Le vonoprazan, inhibiteur compétitif de la pompe disponible dans d’autres pays, n’a pas été trouvé dans la base suisse.</p>
<div class="lab">Limite</div><p>Une importation individuelle reste possible dans des cas particuliers ; elle sort du cadre de ce cours.</p></template>

<template data-pop="k21-d-bot" data-title="Monographie : budésonide orodispersible (Jorveza)">
<div class="lab">Mécanisme</div><p>Corticostéroïde à forte action locale et à fort premier passage hépatique. La forme orodispersible libère le budésonide dans la salive, qui le dépose sur la muqueuse œsophagienne pendant la déglutition.</p>
<div class="lab">Preuves</div><p>Induction (Lucendo, Gastroenterology 2019, 88 adultes) : rémission complète 58 % contre 0 % à six semaines ; rémission histologique 93 % ; 85 % en rémission après douze semaines. Entretien (Straumann, Gastroenterology 2020, 204 adultes) : 73,5 % (0,5 mg deux fois par jour) et 75 % (1 mg deux fois par jour) restaient en rémission à 48 semaines, contre 4,4 % sous placebo.</p>
<div class="lab">Posologie (information professionnelle suisse, état décembre 2022)</div><p>Induction : 1 mg matin et soir après les repas, six semaines, jusqu’à douze en cas de réponse insuffisante. Entretien : 0,5 mg ou 1 mg matin et soir ; 1 mg deux fois par jour en cas d’histoire longue ou d’atteinte étendue. Le comprimé fond sur la langue contre le palais ; pas de liquide ni de nourriture, ni d’hygiène buccale pendant 30 minutes.</p>
<div class="lab">Populations</div><p>Adulte seulement. Insuffisance hépatique : ne pas traiter. Insuffisance rénale sévère : non recommandé.</p>
<div class="lab">Effets indésirables</div><p>Candidose buccale ou œsophagienne (environ 5 % symptomatiques dans l’essai d’induction), rarement baisse du cortisol. Interaction avec les inhibiteurs puissants du CYP3A4, qui augmentent l’exposition systémique.</p></template>

<template data-pop="k21-d-dupi" data-title="Monographie : dupilumab (Dupixent) dans l’EoE">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humain dirigé contre la chaîne alpha du récepteur de l’IL-4 (IL-4Rα), commune aux récepteurs de l’IL-4 et de l’IL-13. Il bloque les deux cytokines centrales de l’inflammation de type 2.</p>
<div class="lab">Preuves</div><p>Essai de phase 3 de Dellon (New England Journal of Medicine 2022), patients de 12 ans et plus : rémission histologique (6 éosinophiles ou moins par champ) chez 60 % sous 300 mg par semaine contre 5 % sous placebo, avec amélioration de la dysphagie. La dose toutes les deux semaines n’améliorait pas la dysphagie chez l’adulte et l’adolescent.</p>
<div class="lab">Indication et posologie (information professionnelle suisse, état janvier 2025)</div><p>EoE dès 1 an et 15 kg, insuffisamment contrôlée par un traitement conventionnel, intolérante ou contre-indiquée. Dès 40 kg : 300 mg par voie sous-cutanée chaque semaine ; 30 à 40 kg : 300 mg toutes les deux semaines ; 15 à 30 kg : 200 mg toutes les deux semaines. Traitement au long cours ; l’administration au-delà de 52 semaines n’a pas été étudiée dans l’EoE.</p>
<div class="lab">Effets indésirables</div><p>Réactions au point d’injection, conjonctivite, infections des voies respiratoires hautes, éosinophilie transitoire.</p></template>

<template data-pop="k21-d-fluco" data-title="Monographie : fluconazole dans la candidose œsophagienne">
<div class="lab">Mécanisme</div><p>Azolé qui inhibe la 14-alpha-déméthylase fongique et bloque la synthèse de l’ergostérol de la membrane des levures.</p>
<div class="lab">Posologie selon l’information professionnelle suisse (Diflucan, état juillet 2026)</div><p>200 à 400 mg le premier jour, puis 100 à 200 mg une fois par jour pendant 14 à 30 jours jusqu’à la rémission ; durée prolongeable chez l’immunodéprimé sévère.</p>
<div class="lab">Posologie selon l’IDSA 2016</div><p>200 à 400 mg (3 à 6 mg/kg) par jour par voie orale pendant 14 à 21 jours (recommandation forte, preuve élevée). Par voie intraveineuse, 400 mg par jour ou une échinocandine si la voie orale est impossible. En cas de récidives, suppression par 100 à 200 mg trois fois par semaine.</p>
<div class="lab">Arbitrage</div><p>La monographie suisse est la source applicable la plus récente en Suisse et fixe le cadre de l’autorisation. La recommandation américaine, plus ancienne mais fondée sur des essais chez l’immunodéprimé, propose une dose d’entretien plus élevée et une durée plus courte. Le médecin applique la monographie chez le patient courant et suit l’avis infectiologique chez l’immunodéprimé sévère.</p>
<div class="lab">Précautions</div><p>Clairance de la créatinine ≤ 50 mL/min : 50 % de la dose (après une dose de charge). Inhibiteur des CYP2C9, CYP2C19 et CYP3A4, avec un effet qui persiste 4 à 5 jours après l’arrêt.</p></template>

<template data-pop="k21-d-antiv" data-title="Monographie : antiviraux des œsophagites herpétique et à cytomégalovirus">
<div class="lab">Aciclovir et valaciclovir</div><p>Analogues nucléosidiques activés par la thymidine kinase virale, qui bloquent l’ADN polymérase du virus herpès simplex. Aciclovir par voie intraveineuse : 5 mg/kg toutes les 8 heures chez l’adulte selon son information professionnelle suisse. Valaciclovir : 500 mg deux fois par jour pendant 5 à 10 jours pour l’herpès simplex selon la monographie de Valtrex ; la durée chez l’immunodéprimé relève de l’avis infectiologique. Adaptation à la fonction rénale et hydratation suffisante.</p>
<div class="lab">Ganciclovir</div><p>Analogue nucléosidique phosphorylé par la kinase UL97 du cytomégalovirus. Cymevene est indiqué pour les infections à cytomégalovirus menaçantes chez l’immunodéprimé, y compris viscérales : 5 mg/kg toutes les 12 heures pendant 14 à 21 jours, réduits selon la clairance de la créatinine. Il n’est pas commencé si les neutrophiles sont sous 500/µL, les plaquettes sous 25 000/µL ou l’hémoglobine sous 8 g/dL.</p>
<div class="lab">Source</div><p>Informations professionnelles suisses Aciclovir Labatec, Valtrex et Cymevene consultées sur ch.oddb.org le 08.10.2026 (états décembre 2025 et janvier 2026).</p></template>

<template data-pop="k21-d-motr" data-title="Baclofène et prokinétiques dans le reflux">
<div class="lab">Baclofène</div><p>Agoniste des récepteurs GABA-B qui diminue les relaxations transitoires du sphincter. L’ACG 2022 le déconseille sans preuve objective de RGO (recommandation forte) ; son usage reste hors indication et limité par la somnolence et les vertiges.</p>
<div class="lab">Métoclopramide et dompéridone</div><p>Antagonistes dopaminergiques qui accélèrent la vidange gastrique. L’ACG 2022 ne les recommande pas sans gastroparésie prouvée. Le métoclopramide expose à des effets extrapyramidaux, la dompéridone à un allongement de l’intervalle QT.</p>
<div class="lab">Conséquence pratique</div><p>Dans un RGO réfractaire, ces molécules ne remplacent pas la démarche diagnostique objective.</p></template>
