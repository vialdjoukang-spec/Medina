
<!-- ===== FENÊTRES : diagnostic, examens et traitement du reflux ===== -->
<template data-pop="k21-essai" data-title="Essai thérapeutique d’IPP">
<div class="lab">Mode d’emploi</div><p>IPP à dose standard, une prise par jour 30 à 60 minutes avant le premier repas, pendant huit semaines (ACG 2022, recommandation forte, preuve modérée). Le médecin évalue la réponse, puis tente l’arrêt si les symptômes ont disparu.</p>
<div class="lab">Valeur et limites</div><p>Lyon 2.0 rapporte une réponse chez environ deux tiers à trois quarts des patients avec pyrosis et chez environ la moitié en cas de douleur thoracique non cardiaque. La réponse au placebo atteint 10 à 25 %. Une réponse ne prouve donc pas le RGO, et un échec ne l’exclut pas.</p>
<div class="lab">Indications</div><p>Pyrosis ou régurgitation typiques, sans signe d’alarme et sans facteurs de risque multiples d’endobrachyœsophage. L’essai ne convient pas aux symptômes extra-œsophagiens isolés.</p>
<div class="lab">Piège</div><p>Un essai mal conduit, IPP pris au coucher ou de façon irrégulière, conduit à un faux échec. Le médecin vérifie l’horaire avant de conclure.</p></template>

<template data-pop="k21-endo" data-title="Endoscopie œso-gastro-duodénale">
<div class="lab">Technique</div><p>Le gastroentérologue introduit un endoscope souple par la bouche, le plus souvent sous sédation, et examine l’œsophage, l’estomac et le duodénum. Il peut prélever des biopsies, dilater une sténose ou retirer un corps étranger.</p>
<div class="lab">Ce qu’elle prouve</div><p>Les grades B, C et D de Los Angeles, un endobrachyœsophage prouvé par biopsie et une sténose peptique prouvent le RGO. Elle montre aussi une hernie hiatale, une EoE, une infection ou un cancer.</p>
<div class="lab">Conditions</div><p>Pour un RGO non prouvé, arrêt des IPP pendant deux à quatre semaines. En cas de signe d’alarme, l’endoscopie se fait sans attendre, sous traitement s’il le faut.</p>
<div class="lab">Limite</div><p>Une endoscopie normale n’exclut pas le RGO : environ la moitié ou plus des patients avec RGO ont un reflux non érosif. Le monitorage prend alors le relais.</p></template>

<template data-pop="k21-phm" data-title="Monitorage ambulatoire du pH">
<div class="lab">Techniques</div><p>Capsule sans fil fixée 6 cm au-dessus de la jonction pendant l’endoscopie, qui enregistre jusqu’à 96 heures ; ou sonde nasale qui enregistre 24 heures, éventuellement couplée à l’impédance.</p>
<div class="lab">Mesures</div><p>Temps d’exposition acide : proportion du temps avec un pH inférieur à 4. Nombre d’épisodes. Association entre les épisodes et les symptômes notés par le patient.</p>
<div class="lab">Seuils (Lyon 2.0)</div><p>Inférieur à 4 % : normal. 4 à 6 % : non concluant. Supérieur à 6 % : RGO prouvé, sur au moins deux jours pour la capsule.</p>
<div class="lab">Pourquoi 96 heures</div><p>L’exposition acide varie d’un jour à l’autre. Plusieurs jours permettent d’identifier un profil dominant et prédisent mieux le succès d’un arrêt des IPP, selon Lyon 2.0.</p>
<div class="lab">Piège</div><p>L’examen diagnostique se fait sans IPP. Le patient vit normalement pendant l’enregistrement ; un régime de circonstance fausserait le résultat.</p></template>

<template data-pop="k21-imp" data-title="pH-impédancemétrie">
<div class="lab">Principe</div><p>Des électrodes mesurent la résistance électrique entre elles. Un liquide, bon conducteur, fait baisser l’impédance ; l’air la fait monter. La progression de la baisse du bas vers le haut signe un reflux, quelle que soit son acidité.</p>
<div class="lab">Indications</div><p>Sous IPP : RGO prouvé et symptômes persistants, pour savoir si un reflux faiblement acide les explique. Sans IPP : éructations excessives, suspicion de rumination, symptômes respiratoires.</p>
<div class="lab">Seuils sous IPP (Lyon 2.0)</div><p>Une exposition acide supérieure à 4 % associée à plus de 80 reflux par jour prouve un RGO réfractaire justifiant une action.</p></template>

<template data-pop="k21-mnbi" data-title="Impédance basale nocturne moyenne">
<div class="lab">Définition</div><p>Moyenne de l’impédance de la muqueuse œsophagienne distale mesurée pendant le sommeil, à distance des reflux et des déglutitions.</p>
<div class="lab">Mécanisme</div><p>Une muqueuse saine, aux jonctions serrées, résiste au courant ; des espaces intercellulaires élargis par le reflux le laissent passer et abaissent l’impédance.</p>
<div class="lab">Seuils (Lyon 2.0)</div><p>Inférieure à 1500 ohms : argument complémentaire en faveur du RGO. Supérieure à 2500 ohms : argument contre.</p>
<div class="lab">Limite</div><p>L’EoE, la stase de l’achalasie et d’autres inflammations abaissent aussi l’impédance ; la mesure reste donc complémentaire. Une étude coréenne suggère un seuil plus élevé dans les populations asiatiques.</p></template>

<template data-pop="k21-sap" data-title="Association entre reflux et symptômes">
<div class="lab">Principe</div><p>Le patient signale chaque symptôme pendant l’enregistrement. Le logiciel cherche un reflux dans les deux minutes qui précèdent.</p>
<div class="lab">Indices</div><p>L’index symptomatique est la proportion de symptômes précédés d’un reflux ; supérieur à 50 %, il est positif. La probabilité d’association symptomatique est un calcul statistique ; supérieure à 95 %, elle est positive.</p>
<div class="lab">Usage</div><p>Avec une exposition acide normale, une association positive définit l’hypersensibilité au reflux et une association négative le pyrosis fonctionnel.</p>
<div class="lab">Limite</div><p>Le résultat dépend de la qualité du signalement par le patient et devient instable si les symptômes sont très rares ou très fréquents.</p></template>

<template data-pop="k21-hrm" data-title="Manométrie haute résolution">
<div class="lab">Technique</div><p>Une sonde nasale porte environ 36 capteurs de pression. Le patient avale des gorgées d’eau ; le logiciel affiche une topographie colorée des pressions.</p>
<div class="lab">Interprétation</div><p>La classification de Chicago 4.0 classe la relaxation de la jonction et le péristaltisme : achalasie, obstruction de la jonction, spasme, hypercontractilité, motricité inefficace, absence de contractilité.</p>
<div class="lab">Place dans le RGO</div><p>Elle ne prouve pas le reflux. Elle est obligatoire avant une chirurgie antireflux, pour exclure une achalasie ou une absence de contractilité qui transformeraient la valve en obstacle. Elle localise le sphincter pour placer une sonde de pH.</p></template>

<template data-pop="k21-impaction" data-title="Impaction alimentaire dans l’œsophage">
<div class="lab">Définition</div><p>Blocage d’un bol alimentaire, le plus souvent de viande, dans l’œsophage.</p>
<div class="lab">Gravité</div><p>Un patient qui ne peut plus avaler sa salive, qui bave et crache, a une obstruction complète, avec risque d’inhalation et de nécrose de pression.</p>
<div class="lab">Conduite (ESGE 2016)</div><p>Pas d’imagerie pour un bol alimentaire non osseux sans complication ; pas de transit baryté. Endoscopie de préférence dans les 2 heures, au plus tard dans les 6 heures, en cas d’obstruction complète ; dans les 24 heures sinon. Le bol est poussé doucement dans l’estomac ou extrait. Un traitement médical ne doit pas retarder l’endoscopie.</p>
<div class="lab">Après</div><p>L’ESGE recommande de rechercher la maladie sous-jacente, histologie comprise. L’EoE est en cause dans environ la moitié des cas selon les recommandations européennes de 2017 ; viennent ensuite la sténose peptique, les anneaux et le cancer.</p></template>

<template data-pop="k21-hemo" data-title="Hémorragie d’origine œsophagienne">
<div class="lab">Formes</div><p>Saignement occulte chronique d’une œsophagite sévère, révélé par une anémie ferriprive ; plus rarement hématémèse ou méléna sur ulcère œsophagien.</p>
<div class="lab">Codage</div><p>La CIM-10-GM 2024 demande le code supplémentaire K22.81 pour préciser une hémorragie de l’œsophage associée à K21.0.</p>
<div class="lab">Conduite</div><p>Une anémie ferriprive chez un patient avec reflux impose une endoscopie. L’hémorragie aiguë relève du cours <a href="#/entry/K92">K92 — Hémorragie digestive</a>.</p></template>

<template data-pop="k21-hyg" data-title="Mesures liées au mode de vie">
<div class="lab">Perte de poids</div><p>Recommandation forte de l’ACG 2022, preuve modérée. Elle réduit la pression abdominale et le gradient de pression vers l’œsophage.</p>
<div class="lab">Éviter les repas dans les deux à trois heures avant le coucher</div><p>Recommandation conditionnelle. Elle diminue la poche acide et les relaxations transitoires au moment où la clairance est la plus faible.</p>
<div class="lab">Surélever la tête du lit</div><p>Recommandation conditionnelle, pour les symptômes nocturnes. La gravité aide la clairance. Les oreillers seuls fléchissent l’abdomen et peuvent augmenter la pression.</p>
<div class="lab">Arrêter le tabac</div><p>Recommandation conditionnelle. Le tabac diminue la salive et le tonus du sphincter.</p>
<div class="lab">Éviter les aliments déclencheurs</div><p>Recommandation conditionnelle, limitée aux aliments que le patient a identifiés. Des listes d’exclusion générales n’ont pas de preuve suffisante. L’ACG juge les preuves concernant l’alcool faibles.</p></template>

<template data-pop="k21-timing" data-title="Moment de prise des IPP">
<div class="lab">Règle</div><p>Prendre l’IPP 30 à 60 minutes avant un repas, habituellement le premier de la journée ; la seconde prise éventuelle se place avant le repas du soir. L’ACG 2022 en fait une recommandation forte, preuve modérée.</p>
<div class="lab">Pourquoi</div><p>Les IPP ne bloquent que les pompes insérées dans la membrane du canalicule, et le repas déclenche cette insertion. Le pic de concentration plasmatique de l’IPP doit coïncider avec l’activation des pompes.</p>
<div class="lab">Erreur fréquente</div><p>Prendre l’IPP au coucher, après le repas ou « quand ça brûle ». L’effet est réduit, et le patient conclut à tort que le médicament ne marche pas.</p></template>

<template data-pop="k21-depres" data-title="Dose minimale efficace et déprescription des IPP">
<div class="lab">Principe (AGA 2022)</div><p>Aucun patient ne doit prendre un médicament sans attente raisonnable de bénéfice. Chaque IPP doit avoir une indication documentée, revue régulièrement, sous la responsabilité du médecin de premier recours.</p>
<div class="lab">Qui peut arrêter</div><p>Le patient au reflux non érosif ou à l’œsophagite A ou B guérie, sans endobrachyœsophage, et le patient qui prend un IPP sans indication claire.</p>
<div class="lab">Qui ne doit pas arrêter</div><p>Le patient avec endobrachyœsophage, œsophagite C ou D, sténose peptique ou indication de protection gastroduodénale persistante.</p>
<div class="lab">Comment</div><p>Réduire la dose, passer à la demande ou arrêter. Le rebond acide transitoire, lié à l’hypergastrinémie, peut faire croire à une rechute pendant quelques semaines ; un alginate aide à le passer.</p></template>

<template data-pop="k21-refract" data-title="RGO réfractaire">
<div class="lab">Définition</div><p>Pyrosis ou régurgitation persistants malgré un IPP à double dose pendant huit semaines, selon la définition la plus courante rapportée par l’ACG 2022 ; certains auteurs retiennent douze semaines.</p>
<div class="lab">Démarche</div><p>Optimiser d’abord l’IPP : observance, horaire, dose, changement de molécule au plus une fois. Si le RGO n’est pas prouvé, monitorage sans IPP. S’il est prouvé, pH-impédancemétrie sous IPP. Rechercher l’EoE, un trouble moteur, une hypersensibilité, un pyrosis fonctionnel ou une rumination.</p>
<div class="lab">Conséquence</div><p>Un reflux réfractaire prouvé, à prédominance de régurgitation, oriente vers la chirurgie ou l’augmentation magnétique. Un test négatif impose d’arrêter les IPP inutiles.</p></template>

<template data-pop="k21-fundo" data-title="Fundoplicature laparoscopique">
<div class="lab">Technique</div><p>Le chirurgien réduit la hernie, ferme le hiatus et enroule la grosse tubérosité autour de l’œsophage abdominal : à 360 degrés (Nissen) ou partiellement (Toupet, postérieure à 270 degrés).</p>
<div class="lab">Mécanisme</div><p>La valve recrée une zone de haute pression et diminue les relaxations transitoires ; elle agit sur le volume reflué, donc sur la régurgitation.</p>
<div class="lab">Indications (ACG 2022)</div><p>RGO objectivement prouvé, surtout œsophagite C ou D, grande hernie hiatale ou symptômes persistants, par un chirurgien expérimenté. Une manométrie préalable est obligatoire.</p>
<div class="lab">Effets indésirables</div><p>Dysphagie, ballonnement, impossibilité d’éructer ou de vomir, flatulences. Dans l’essai LOTUS, la dysphagie touchait 11 % des opérés contre 5 % sous ésoméprazole à cinq ans.</p></template>

<template data-pop="k21-lotus" data-title="Essai LOTUS (2011)">
<div class="lab">Population</div><p>554 adultes européens avec RGO chronique ayant initialement répondu à l’IPP, dans onze pays ; 372 suivis cinq ans.</p>
<div class="lab">Comparaison</div><p>Ésoméprazole 20 à 40 mg par jour, dose ajustable, contre fundoplicature laparoscopique standardisée.</p>
<div class="lab">Résultats</div><p>Rémission estimée à cinq ans : 92 % sous ésoméprazole et 85 % après chirurgie (différence non significative après modélisation des perdus de vue). Régurgitations acides : 13 % contre 2 %. Dysphagie : 5 % contre 11 %. Ballonnements : 28 % contre 40 %. Flatulences : 40 % contre 57 %.</p>
<div class="lab">Portée</div><p>Les deux stratégies sont efficaces chez des patients répondeurs à l’IPP ; le choix dépend du symptôme dominant et des préférences. L’essai ne s’applique pas aux non-répondeurs. Référence : Galmiche, JAMA 2011;305:1969–1977.</p></template>

<template data-pop="k21-msa" data-title="Augmentation magnétique du sphincter">
<div class="lab">Technique</div><p>Un anneau de billes de titane aimantées est placé par laparoscopie autour de l’œsophage abdominal. Il renforce la fermeture de la jonction tout en s’ouvrant lors de la déglutition.</p>
<div class="lab">Place (ACG 2022)</div><p>Alternative à la fundoplicature chez le patient au RGO prouvé dont la régurgitation ne répond pas au traitement médical (recommandation forte, preuve modérée).</p>
<div class="lab">Limites</div><p>Dysphagie postopératoire, rares érosions de l’anneau dans la paroi, interférences avec l’imagerie par résonance magnétique selon le modèle. La disponibilité en Suisse n’a pas été vérifiée pour ce cours.</p></template>

<template data-pop="k21-risques" data-title="Risques attribués aux IPP au long cours">
<div class="lab">Associations rapportées</div><p>Des études d’observation ont associé les IPP à des fractures, à des carences en magnésium et en vitamine B12, à des infections intestinales, à des pneumonies, à une maladie rénale chronique, à une démence et à une mortalité accrue.</p>
<div class="lab">Association n’est pas causalité</div><p>Les patients sous IPP sont plus âgés, plus malades et plus polymédiqués : ces facteurs de confusion expliquent une partie des associations. L’ACG 2022 souligne que les études de bonne qualité n’ont confirmé qu’une augmentation des infections intestinales.</p>
<div class="lab">Risques documentés dans la monographie</div><p>L’information professionnelle suisse de l’ésoméprazole décrit l’hypomagnésémie sévère, une augmentation possible du risque de fracture de 10 à 40 % en partie due à d’autres facteurs, un léger excès d’infections à salmonelles, <i>Campylobacter</i> et <i>Clostridioides difficile</i>, le lupus cutané subaigu et de rares réactions cutanées graves.</p>
<div class="lab">Conduite</div><p>Ne pas arrêter un IPP indiqué par crainte de ces associations ; arrêter un IPP non indiqué. L’ACG ne recommande pas de supplémentation systématique en calcium ni de densitométrie chez le patient sans autre facteur de risque.</p></template>

<template data-pop="k21-grossesse" data-title="Reflux pendant la grossesse">
<div class="lab">Mécanisme</div><p>La progestérone relâche le sphincter inférieur et ralentit la vidange gastrique ; l’utérus augmente la pression abdominale au troisième trimestre.</p>
<div class="lab">Conduite</div><p>Mesures de mode de vie, puis alginates ou antiacides. Un IPP est possible lorsque les symptômes persistent ; les monographies suisses de l’oméprazole et de l’ésoméprazole demandent la prudence faute d’études contrôlées. L’ACG cite le sucralfate, non disponible en Suisse.</p>
<div class="lab">Signes qui changent la conduite</div><p>Une douleur épigastrique en barre au troisième trimestre, avec hypertension, évoque une prééclampsie ou un syndrome HELLP, et non un reflux. Des vomissements incoercibles précoces évoquent une hyperémèse.</p></template>

<template data-pop="k21-nourrisson" data-title="Reflux du nourrisson et de l’enfant (NASPGHAN et ESPGHAN 2018)">
<div class="lab">Physiologie</div><p>Les régurgitations du nourrisson en bonne santé sont fréquentes ; elles s’expliquent par un œsophage court, un estomac de petite capacité et une alimentation liquide abondante. Elles diminuent avec l’âge.</p>
<div class="lab">Recommandations</div><p>Ne pas utiliser d’antagonistes H2 ni d’IPP pour les pleurs ou l’agitation d’un nourrisson par ailleurs en bonne santé (recommandation forte). Ne pas les utiliser pour des régurgitations visibles chez ce même nourrisson (forte). Épaissir les repas en cas de régurgitations ou vomissements visibles (faible). Chez le nourrisson nourri au lait artificiel, après échec des mesures non pharmacologiques, essai de deux à quatre semaines d’hydrolysat poussé de protéines ou de formule à base d’acides aminés (faible). Chez l’enfant plus âgé avec pyrosis typique, essai d’IPP de quatre à huit semaines (faible).</p>
<div class="lab">Signes d’alarme</div><p>Vomissements bilieux, hématémèse, cassure pondérale, fièvre, léthargie, fontanelle bombée, début après six mois : ils orientent vers une autre maladie et imposent une évaluation.</p></template>

<template data-pop="k21-clopi" data-title="IPP et clopidogrel">
<div class="lab">Mécanisme</div><p>Le clopidogrel est un promédicament activé surtout par le CYP2C19 du foie. L’oméprazole et l’ésoméprazole inhibent cette enzyme et diminuent la formation du métabolite actif, donc l’inhibition plaquettaire.</p>
<div class="lab">Recommandation</div><p>L’information professionnelle suisse de l’ésoméprazole déconseille l’association. Lorsqu’un patient sous clopidogrel a besoin d’une protection gastrique, le pantoprazole, moins inhibiteur du CYP2C19, est l’alternative habituelle.</p>
<div class="lab">Limite</div><p>L’effet est démontré sur les tests plaquettaires ; son impact sur les événements cardiovasculaires est discuté. La prudence pharmacologique prévaut néanmoins, puisque l’alternative existe.</p></template>
