<section class="ilot" id="k21-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un enseignant de 52 ans consulte son médecin de famille pour des brûlures rétrosternales qui montent vers la gorge après les repas. Elles surviennent quatre soirs par semaine depuis deux ans. La nuit, il se réveille avec un liquide acide dans la bouche et tousse. Il pèse 98 kg pour 1,78 m, soit un indice de masse corporelle de 31 kg/m². Il fume dix cigarettes par jour et dîne tard. Il achète à la pharmacie de l’ésoméprazole à 20 mg, qu’il prend « quand ça brûle », souvent au coucher. Il n’a ni difficulté à avaler, ni perte de poids, ni sang dans les selles.</p>
<p>La question qui structure le chapitre est la suivante : <b>ces symptômes traduisent-ils un reflux gastro-œsophagien pathologique, faut-il une endoscopie maintenant ou un essai thérapeutique d’abord, quelle preuve objective exiger avant un traitement prolongé ou une chirurgie, et quand faut-il penser à une autre œsophagite ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître le reflux typique et ses formes atypiques. Il repère les signes d’alarme qui imposent une endoscopie rapide. Il applique les critères de preuve du <button class="w" data-k="k21-lyon">consensus de Lyon 2.0 (preuve objective du reflux)</button>. Il prescrit un inhibiteur de la pompe à protons (IPP) au bon moment et à la bonne dose, puis il le réduit. Il distingue l’œsophagite peptique de l’œsophagite à éosinophiles, des œsophagites infectieuses, médicamenteuses, caustiques et radiques, et des atteintes œsophagiennes de maladies générales.</p>
<div class="key"><b>Message fondateur.</b> Le reflux de contenu gastrique dans l’œsophage est physiologique quelques dizaines de fois par jour. Il devient une maladie lorsqu’il provoque des symptômes gênants ou des lésions. Le pyrosis typique sans signe d’alarme autorise un essai d’IPP, mais une réponse favorable ne prouve pas le diagnostic. Un traitement au long cours, une escalade ou une chirurgie exigent une preuve objective : œsophagite de Los Angeles B, C ou D, endobrachyœsophage prouvé, sténose peptique, ou temps d’exposition acide supérieur à 6 %.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="k21-barriere">barrière antireflux (sphincter inférieur et diaphragme crural)</button>, la <button class="w" data-k="k21-clair">clairance œsophagienne (péristaltisme et salive)</button> et la <button class="w" data-k="k21-d-ipp">pompe à protons (cible des IPP)</button>. L’onglet Sciences fondamentales développe ces notions.</div>
<div class="key"><b>À retenir.</b> Le clinicien évalue trois choses à chaque consultation : la probabilité de reflux pathologique, la présence d’un signe d’alarme et le besoin d’une preuve objective. La partie suivante fixe le vocabulaire qui permet de les nommer.</div>
</section>

<section class="ilot" id="k21-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <button class="w" data-k="k21-montreal">définition de Montréal (consensus mondial de 2006)</button> définit le reflux gastro-œsophagien (RGO) pathologique comme une affection dans laquelle le reflux du contenu gastrique provoque des symptômes gênants ou des complications. Le mot « gênant » est central. Un pyrosis bref une fois par mois après un repas copieux n’est pas une maladie. Un pyrosis deux fois par semaine qui réveille le patient en est une, même si l’endoscopie est normale.</p>
<p>Montréal sépare des syndromes œsophagiens (symptômes typiques, œsophagite, sténose, endobrachyœsophage, adénocarcinome) et des syndromes extra-œsophagiens. Ces derniers sont soit établis (toux, laryngite, asthme, érosions dentaires), soit seulement proposés (sinusite, otite, fibrose pulmonaire). Le reflux peut contribuer à ces manifestations, mais il en est rarement la cause unique.</p>
<h3>1.1 Phénotypes du reflux selon les examens</h3>
<p>Les examens complémentaires permettent de classer un patient qui se plaint de pyrosis. La distinction compte, car chaque phénotype répond différemment aux IPP et à la chirurgie.</p>
<table class="t"><tr><th>Phénotype</th><th>Endoscopie</th><th>Monitorage du reflux sans IPP</th><th>Conséquence pratique</th></tr>
<tr><td>Œsophagite par reflux (érosive)</td><td>Pertes de substance muqueuses, grades A à D</td><td>Souvent anormal ; inutile pour le diagnostic si grade C ou D</td><td>IPP en cure de cicatrisation ; entretien au long cours si grade C ou D</td></tr>
<tr><td>Reflux non érosif</td><td>Normale</td><td>Temps d’exposition acide &gt; 6 %</td><td>IPP à la demande ou en cure ; reflux prouvé, donc éligible à une chirurgie si nécessaire</td></tr>
<tr><td><button class="w" data-k="k21-hyper">Hypersensibilité au reflux (Rome IV, Lyon 2.0)</button></td><td>Normale</td><td>Exposition acide normale, mais association positive entre reflux et symptômes</td><td>Réponse aux IPP inconstante ; modulateurs de la douleur viscérale</td></tr>
<tr><td>Pyrosis fonctionnel</td><td>Normale</td><td>Exposition acide normale et aucune association</td><td>Arrêt des IPP inutiles ; aucune chirurgie antireflux</td></tr></table>
<p>La lecture commence par l’endoscopie, puis par le monitorage. Un patient au pyrosis invalidant, à endoscopie normale et à exposition acide de 2 % sans association symptomatique a un pyrosis fonctionnel. Une fundoplicature ne lui apporterait que ses effets indésirables, sans bénéfice.</p>
<h3>1.2 Classification endoscopique de Los Angeles</h3>
<p>L’endoscopiste décrit une œsophagite par reflux avec la <button class="w" data-k="k21-la">classification de Los Angeles (grades A à D)</button>. Elle mesure la longueur des pertes de substance et leur extension entre les plis muqueux. Sa reproductibilité entre observateurs est acceptable, ce qui explique son usage universel.</p>
<table class="t"><tr><th>Grade</th><th>Description endoscopique</th><th>Valeur pour le diagnostic de reflux (Lyon 2.0)</th></tr>
<tr><td>A</td><td>Une ou plusieurs pertes de substance de 5 mm ou moins, qui ne s’étendent pas entre les sommets de deux plis</td><td>Non concluant à lui seul</td></tr>
<tr><td>B</td><td>Au moins une perte de substance de plus de 5 mm, sans continuité entre les sommets de deux plis</td><td>Preuve concluante</td></tr>
<tr><td>C</td><td>Pertes de substance continues entre les sommets d’au moins deux plis, sur moins de 75 % de la circonférence</td><td>Preuve concluante</td></tr>
<tr><td>D</td><td>Pertes de substance sur au moins 75 % de la circonférence</td><td>Preuve concluante</td></tr></table>
<p>Le grade A pose le piège principal. Des érosions de grade A existent chez des volontaires sans symptôme, et les observateurs s’accordent mal sur leur présence. Le consensus de Lyon 2.0 les classe donc comme non concluantes, alors que le grade B est devenu concluant depuis 2023. Un patient avec une seule érosion de 3 mm n’a donc pas encore de preuve de RGO.</p>
<h3>1.3 Œsophagites et catégories de la CIM-10-GM 2024</h3>
<p>Le mot œsophagite désigne une inflammation de la muqueuse œsophagienne, quelle qu’en soit la cause. La CIM-10-GM sépare l’œsophagite due au reflux (K21.0) des autres œsophagites (K20) et des atteintes œsophagiennes provoquées par une maladie classée ailleurs (K23). Le tableau répond à la question pratique du codage et indique le cours qui traite chaque entité.</p>
<table class="t"><tr><th>Code</th><th>Intitulé CIM-10-GM 2024</th><th>Où l’entité est traitée</th></tr>
<tr><td>K20.0</td><td>Œsophagite à éosinophiles</td><td>Îlot 10 de ce cours</td></tr>
<tr><td>K20.1</td><td>Œsophagite radique</td><td>Îlot 11</td></tr>
<tr><td>K20.8</td><td>Autre œsophagite précisée : abcès et érosion de l’œsophage, œsophagite due à des substances chimiques</td><td>Îlot 11 (caustiques, comprimés)</td></tr>
<tr><td>K20.9</td><td>Œsophagite, sans précision</td><td>Îlot 11</td></tr>
<tr><td>K21.0</td><td>Reflux gastro-œsophagien avec œsophagite (œsophagite par reflux, œsophagite peptique)</td><td>Îlots 1 à 9</td></tr>
<tr><td>K21.9</td><td>Reflux gastro-œsophagien sans œsophagite</td><td>Îlots 1 à 9</td></tr>
<tr><td>K23.0*</td><td>Œsophagite tuberculeuse (A18.8†)</td><td>Îlot 12</td></tr>
<tr><td>K23.1*</td><td>Méga-œsophage au cours de la maladie de Chagas (B57.3†)</td><td>Îlot 12</td></tr>
<tr><td>K23.8*</td><td>Atteintes de l’œsophage au cours d’autres maladies classées ailleurs</td><td>Îlot 12</td></tr></table>
<p>Trois règles de codage méritent l’attention. Une hémorragie œsophagienne associée au reflux reçoit le code supplémentaire K22.81. L’œsophagite à <i>Candida</i> possède son propre code, B37.81, dans le chapitre des maladies infectieuses. Les codes K23 portent un astérisque : ils ne s’emploient jamais seuls, mais toujours après le code de la maladie causale marqué d’une dague, selon le <button class="w" data-k="k21-dague">système dague-astérisque (étiologie et manifestation)</button>.</p>
<p>L’endobrachyœsophage (œsophage de Barrett, K22.7), l’ulcère de l’œsophage (K22.1), la sténose (K22.2), l’achalasie (K22.0) et le syndrome de Mallory-Weiss (K22.6) relèvent du cours <a href="#/entry/K22">K22 — Troubles moteurs et autres maladies de l’œsophage (G-04-Gastroentérologie et hépatologie)</a>. Ce chapitre les évoque seulement comme complications ou diagnostics différentiels.</p>
<div class="key"><b>À retenir.</b> Le RGO pathologique se définit par la gêne ou la lésion, et non par la seule présence de reflux. Los Angeles B, C et D prouvent le reflux ; le grade A ne le prouve pas. Le code K21.0 désigne l’œsophagite peptique, K20 les autres œsophagites, et K23 une manifestation œsophagienne qui suit toujours le code de sa maladie causale.</div>
</section>

<section class="ilot" id="k21-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Le RGO est l’une des affections digestives les plus fréquentes en médecine de premier recours. Une revue systématique de 2014 (El-Serag, Gut) a retenu les études de population définissant le RGO par un pyrosis ou des régurgitations au moins une fois par semaine. Elle rapporte une prévalence de 8,8 à 25,9 % en Europe et de 18,1 à 27,8 % en Amérique du Nord, contre 2,5 à 7,8 % en Asie de l’Est. L’incidence était d’environ 5 nouveaux cas pour 1000 personnes-années au Royaume-Uni et aux États-Unis.</p>
<p>Aucune étude de population suisse récente et directement exploitable n’a été trouvée pour la prévalence du RGO. Les chiffres européens sont donc les meilleurs repères disponibles pour la Suisse, avec cette réserve explicite. La prévalence a augmenté depuis 1995 dans la revue de 2014, une évolution parallèle à celle de l’obésité ; le lien entre les deux est mécanique (îlot 3) et pas seulement statistique.</p>
<h3>2.1 Pronostic du reflux</h3>
<p>La plupart des patients ont un reflux non érosif ou une œsophagite de grade A ou B. Ces formes évoluent rarement vers une œsophagite sévère, mais les symptômes récidivent souvent à l’arrêt des IPP. Une œsophagite de grade C ou D récidive presque toujours sans traitement d’entretien ; c’est la raison pour laquelle l’<button class="w" data-k="k21-acg">ACG 2022 (recommandations américaines)</button> recommande un entretien indéfini par IPP ou une chirurgie dans ce cas.</p>
<p>Les complications graves restent minoritaires : sténose peptique, hémorragie, endobrachyœsophage et adénocarcinome. L’<button class="w" data-k="k21-barrett">endobrachyœsophage (métaplasie intestinale, renvoi au cours K22)</button> est la seule lésion précancéreuse connue de l’adénocarcinome œsophagien. Le RGO chronique en est un facteur de risque, mais la très grande majorité des patients qui ont du pyrosis ne développeront jamais de cancer.</p>
<h3>2.2 Œsophagite à éosinophiles</h3>
<p>Les recommandations européennes de 2017 (UEG, EAACI, ESPGHAN et EUREOS) rapportent une incidence de 1 à 20 nouveaux cas pour 100 000 habitants par an, et une prévalence de 13 à 49 pour 100 000. La maladie prédomine nettement chez l’homme. Elle est diagnostiquée chez environ 23 % des adultes explorés pour dysphagie et chez environ 50 % de ceux qui consultent pour une impaction alimentaire.</p>
<p>La Suisse a contribué de façon décisive à ces données. La cohorte prospective de la région d’Olten (Hruz et Straumann, 2011) a montré une forte hausse de l’incidence à partir de 2003. Une présentation universitaire romande en cite une prévalence de 43 pour 100 000 habitants ; ce chiffre provient d’une source secondaire, car le texte intégral de l’article n’a pas été lu pour ce cours.</p>
<div class="key"><b>Chiffre à connaître.</b> Chez un adulte qui consulte pour une impaction alimentaire dans l’œsophage, l’œsophagite à éosinophiles est en cause dans environ la moitié des cas. C’est la raison pour laquelle l’endoscopiste prélève des biopsies après avoir levé l’impaction, même si la muqueuse paraît normale.</div>
<div class="key"><b>À retenir.</b> Le RGO touche environ un adulte européen sur dix à un sur quatre chaque semaine ; les données suisses spécifiques manquent. L’œsophagite à éosinophiles est rare dans la population, mais elle est fréquente parmi les dysphagies et les impactions. La physiopathologie explique ces deux réalités.</div>
</section>

<section class="ilot" id="k21-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le RGO résulte d’un déséquilibre entre ce qui pousse le contenu gastrique vers l’œsophage et ce qui l’en empêche ou l’en chasse. Chaque maillon de cette chaîne explique un symptôme et désigne une cible thérapeutique.</p>
<h3>3.1 État normal</h3>
<p>L’estomac sécrète de l’acide chlorhydrique et de la pepsine ; son pH à jeun est très bas, de l’ordre de 1 à 2. L’œsophage, tapissé d’un épithélium malpighien non kératinisé, n’est pas conçu pour supporter ce contact prolongé. La <button class="w" data-k="k21-barriere">barrière antireflux</button> sépare les deux organes. Elle associe le sphincter inférieur de l’œsophage (SIO), le pilier droit du diaphragme qui l’enserre, l’angle aigu de His et un segment d’œsophage situé sous le diaphragme, soumis à la pression abdominale.</p>
<p>Chez le sujet sain, des reflux brefs surviennent surtout après les repas. Ils sont chassés en quelques secondes par le péristaltisme, puis l’acide résiduel est neutralisé par le bicarbonate de la salive avalée. Cette <button class="w" data-k="k21-clair">clairance œsophagienne</button> explique qu’un sujet sain passe moins de 4 % de la journée avec un pH œsophagien inférieur à 4.</p>
<h3>3.2 Première charnière : défaillance de la barrière</h3>
<p>Le mécanisme dominant n’est pas un sphincter constamment faible. Il s’agit des <button class="w" data-k="k21-tlesr">relaxations transitoires du sphincter inférieur (réflexe vagal post-prandial)</button>. La distension de l’estomac après un repas déclenche un réflexe vago-vagal qui relâche le sphincter pendant plus de dix secondes, sans déglutition préalable. Ce réflexe sert normalement à évacuer l’air gastrique par l’éructation, mais il laisse aussi passer du liquide acide.</p>
<p>La <button class="w" data-k="k21-hh">hernie hiatale (ascension de la jonction au-dessus du diaphragme)</button> aggrave le problème de trois façons. Elle sépare le sphincter du diaphragme crural, si bien que les deux pressions ne s’additionnent plus. Elle crée un réservoir d’acide au-dessus du diaphragme, qui reflue à chaque relaxation. Elle augmente enfin la fréquence des relaxations transitoires.</p>
<p>La <button class="w" data-k="k21-poche">poche acide post-prandiale (couche d’acide sur le repas)</button> complète la chaîne. Après un repas, une couche d’acide non tamponné flotte sur le contenu gastrique, juste sous la jonction. Elle explique que le pyrosis soit post-prandial, et elle constitue la cible des alginates.</p>
<h3>3.3 Deuxième charnière : clairance insuffisante</h3>
<p>Un péristaltisme faible ou absent, comme dans la sclérodermie systémique, laisse l’acide au contact de la muqueuse pendant des minutes au lieu de secondes. La réduction de la salive pendant le sommeil, ou sous médicaments anticholinergiques, diminue la neutralisation. En position couchée, la gravité n’aide plus à vider l’œsophage. C’est la raison pour laquelle le reflux nocturne est le plus agressif pour la muqueuse.</p>
<h3>3.4 Troisième charnière : agression et réponse de la muqueuse</h3>
<p>L’acide et la pepsine élargissent les espaces entre les cellules épithéliales. Les ions hydrogène atteignent alors les terminaisons nerveuses sensibles de la couche profonde : c’est l’origine du pyrosis, même sans érosion visible. Une étude prospective préliminaire de Dunbar et collègues (JAMA 2016) a suivi 12 patients dont l’œsophagite sévère avait guéri sous IPP. Deux semaines après l’arrêt, les biopsies montraient une infiltration de lymphocytes T et un élargissement des espaces intercellulaires, sans perte des cellules de surface. Les auteurs en déduisent, sous réserve de réplication, que la lésion serait médiée par des cytokines plutôt que par une brûlure chimique directe.</p>
<p>Les acides biliaires et les enzymes duodénales refluées peuvent aggraver la lésion, notamment après une chirurgie gastrique. Leur rôle exact chez le patient non opéré reste discuté.</p>
<h3>3.5 Quatrième charnière : manifestations et complications</h3>
<p>Le reflux qui atteint l’œsophage proximal ou le pharynx peut provoquer toux, raclements et enrouement. Un réflexe vagal œso-bronchique peut aussi déclencher une toux ou une bronchoconstriction sans aspiration. Une inflammation répétée cicatrise par fibrose : la paroi se rétracte et produit une <button class="w" data-k="k21-stenose">sténose peptique (rétrécissement fibreux distal)</button>. Chez certains patients, l’épithélium malpighien détruit est remplacé par un épithélium cylindrique de type intestinal plus résistant à l’acide : c’est l’endobrachyœsophage.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Les IPP réduisent l’acidité du liquide reflué, sans diminuer le nombre de reflux : ils traitent le pyrosis et l’œsophagite, mais peu la régurgitation de volume. Les alginates forment un radeau sur la poche acide. La perte de poids diminue la pression abdominale. La fundoplicature restaure une barrière mécanique et agit donc aussi sur la régurgitation.</div>
<div class="key"><b>À retenir.</b> Le reflux pathologique naît surtout de relaxations transitoires du sphincter, aggravées par la hernie hiatale, la poche acide et une clairance lente. La lésion est d’abord inflammatoire, puis érosive, puis fibreuse ou métaplasique. Les facteurs de risque agissent sur l’un de ces maillons.</div>
</section>

<section class="ilot" id="k21-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Le RGO est rarement dû à une cause unique. Le clinicien recherche les facteurs qui altèrent la barrière, augmentent la pression abdominale, ralentissent la clairance ou augmentent l’acidité. Chaque facteur identifié est une cible de prévention.</p>
<h3>4.1 Facteurs du reflux gastro-œsophagien</h3>
<div class="two">
<div class="card"><h4>Facteurs mécaniques et métaboliques</h4><p>L’<button class="w" data-k="k21-obes">obésité abdominale (pression sur l’estomac)</button> augmente le gradient de pression entre l’estomac et l’œsophage et favorise la hernie hiatale. La grossesse associe le même effet mécanique et la relaxation du sphincter par la progestérone. La sleeve gastrectomie peut créer ou aggraver un reflux, car elle réduit la compliance gastrique et modifie l’angle de His.</p></div>
<div class="card"><h4>Comportements</h4><p>Les repas copieux et tardifs distendent l’estomac et multiplient les relaxations transitoires au moment du coucher. Le tabac diminue la salive et le tonus du sphincter. L’alcool et certains aliments déclenchent des symptômes chez certains patients, mais les preuves d’un effet général sont faibles ; l’ACG 2022 recommande seulement d’éviter les aliments déclencheurs identifiés par le patient.</p></div>
<div class="card"><h4>Maladies associées</h4><p>La <button class="w" data-k="k21-sclero">sclérodermie systémique (atteinte motrice de l’œsophage)</button> supprime le péristaltisme et la tonicité du sphincter ; elle produit des œsophagites sévères. La gastroparésie diabétique allonge la vidange gastrique. Le syndrome de Zollinger-Ellison augmente massivement la sécrétion acide, ce qui explique des œsophagites et des ulcères multiples.</p></div>
<div class="card"><h4>Médicaments</h4><p>Les <button class="w" data-k="k21-medsio">médicaments qui abaissent le tonus du sphincter (dérivés nitrés, anticalciques, anticholinergiques)</button> favorisent le reflux. D’autres lèsent directement la muqueuse : anti-inflammatoires non stéroïdiens (AINS), doxycycline, bisphosphonates oraux, chlorure de potassium et fer. Ces derniers produisent une œsophagite médicamenteuse, distincte du RGO (îlot 11).</p></div></div>
<h3>4.2 Panorama des œsophagites non peptiques</h3>
<p>Une œsophagite qui ne ressemble pas à une œsophagite peptique doit faire chercher une autre cause. La localisation et l’aspect orientent dès l’endoscopie, avant l’histologie.</p>
<table class="t"><tr><th>Cause</th><th>Terrain évocateur</th><th>Indice clinique ou endoscopique</th></tr>
<tr><td>Éosinophiles (K20.0)</td><td>Homme jeune atopique</td><td>Dysphagie aux solides, impaction ; anneaux, sillons, exsudats</td></tr>
<tr><td><i>Candida</i> (B37.81)</td><td>Corticostéroïdes inhalés ou oraux, immunodépression, diabète</td><td>Odynophagie ; plaques blanches adhérentes</td></tr>
<tr><td>Herpès simplex, cytomégalovirus</td><td>Greffe, chimiothérapie, infection par le VIH avancée</td><td>Odynophagie intense ; ulcères superficiels (herpès) ou profonds (cytomégalovirus)</td></tr>
<tr><td>Comprimé (K20.8)</td><td>Prise sans eau, au coucher</td><td>Douleur brutale ; ulcère unique au tiers moyen</td></tr>
<tr><td>Caustique (K20.8 avec T28 et T54)</td><td>Enfant (accident) ou adulte (geste suicidaire)</td><td>Lésions buccales parfois absentes ; nécrose possible</td></tr>
<tr><td>Radiothérapie (K20.1)</td><td>Irradiation thoracique</td><td>Odynophagie deux à trois semaines après le début des séances</td></tr></table>
<p>Ce tableau se lit par la colonne du terrain. Une patiente asthmatique sous fluticasone inhalée qui a mal en avalant a d’abord une candidose œsophagienne probable. Un étudiant qui avale de la doxycycline au lit et ressent une douleur rétrosternale le lendemain a une œsophagite médicamenteuse probable.</p>
<div class="key"><b>À retenir.</b> Obésité, hernie hiatale, repas tardifs, tabac et sclérodermie entretiennent le RGO. Une œsophagite atypique fait penser au terrain : atopie, immunodépression, comprimés, caustiques ou rayons. L’anamnèse cherche précisément ces éléments.</div>
</section>

<section class="ilot" id="k21-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse suffit souvent au diagnostic présomptif du RGO typique. Elle poursuit quatre buts : reconnaître les symptômes typiques, identifier les signes d’alarme, détecter une autre œsophagite et inventorier les médicaments.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Personnels</h4><p>Le médecin demande le poids et sa variation, une <button class="w" data-k="k21-hh">hernie hiatale connue</button>, une chirurgie bariatrique ou gastrique, un diabète, une sclérodermie, un asthme et une atopie. Il recherche une endoscopie antérieure et son résultat, notamment un <button class="w" data-k="k21-barrett">endobrachyœsophage</button>. Il note une immunodépression : greffe, chimiothérapie, corticostéroïdes, infection par le VIH.</p></div>
<div class="card"><h4>Médicamenteux et familiaux</h4><p>Il inventorie les IPP pris, leur dose, leur horaire et la réponse obtenue. Il cherche les AINS, l’aspirine, la doxycycline, les bisphosphonates, le potassium, le fer et les corticostéroïdes inhalés. Il demande les antécédents familiaux de cancer de l’œsophage ou de l’estomac et d’endobrachyœsophage, qui entrent dans l’évaluation du risque.</p></div></div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p><b>Pyrosis</b> — Le <button class="w" data-k="k21-pyrosis">pyrosis (brûlure rétrosternale ascendante)</button> part de l’épigastre et monte derrière le sternum. Il survient surtout après les repas, en se penchant ou en position couchée. C’est le symptôme le plus spécifique du RGO, mais un épigastre douloureux sans ascension évoque plutôt une dyspepsie.</p>
<p><b>Régurgitation</b> — La <button class="w" data-k="k21-regurg">régurgitation (retour passif de liquide acide ou alimentaire)</button> se produit sans effort ni nausée. Elle répond moins bien aux IPP que le pyrosis, car le volume reflué persiste même lorsqu’il devient moins acide.</p>
<p><b>Douleur thoracique</b> — Le reflux peut produire une <button class="w" data-k="k21-dthor">douleur thoracique non cardiaque (constrictive, sans pyrosis)</button>. Elle impose d’abord d’exclure une cause cardiaque, puis d’objectiver le reflux.</p>
<p><b>Symptômes extra-œsophagiens</b> — Toux chronique, enrouement, raclements de gorge et asthme mal contrôlé peuvent s’associer au reflux. L’ACG 2022 demande de rechercher d’abord leurs autres causes, car les <button class="w" data-k="k21-extra">manifestations extra-œsophagiennes (lien causal souvent incertain)</button> répondent mal aux IPP en l’absence de symptômes typiques.</p>
<p><b>Dysphagie et odynophagie</b> — La <button class="w" data-k="k21-dysph">dysphagie (aliment qui s’arrête)</button> est un signe d’alarme dans le RGO, car elle peut traduire une sténose ou un cancer. L’<button class="w" data-k="k21-odyno">odynophagie (douleur à la déglutition)</button> oriente vers une œsophagite infectieuse, médicamenteuse ou caustique plutôt que vers un RGO simple.</p>
<p><b>Éructations et nausées</b> — Des éructations fréquentes peuvent accompagner le RGO ou relever d’une <button class="w" data-k="k21-eruct">éructation supra-gastrique ou d’une rumination (comportements acquis)</button>. Ces diagnostics se confondent avec la régurgitation et ne relèvent pas des IPP.</p>
<div class="alert"><b>Signes d’alarme qui imposent une endoscopie première (ACG 2022).</b> Le médecin demande une endoscopie avant tout essai d’IPP lorsqu’il trouve l’un des éléments suivants : <button class="w" data-k="k21-alarm">dysphagie, perte de poids involontaire, signe d’hémorragie digestive ou anémie, vomissements persistants (liste et justification)</button>. Il la demande aussi chez un patient porteur de plusieurs facteurs de risque d’endobrachyœsophage. Une douleur thoracique impose d’abord l’exclusion d’une cause cardiaque.</div>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Adulte en surpoids, pyrosis post-prandial et régurgitations acides plusieurs fois par semaine, aggravés en se penchant et la nuit. Le patient a déjà été soulagé par un antiacide ou un IPP. Aucun signe d’alarme n’est présent.</p></div>
<div class="card"><h4>Forme extra-œsophagienne</h4><p>Toux chronique ou enrouement sans pyrosis. Le patient a souvent reçu des IPP sans effet. Le reflux n’est retenu qu’après un monitorage objectif, et seulement si les autres causes ont été écartées.</p></div>
<div class="card"><h4>Forme compliquée</h4><p>Homme de 70 ans, ancien pyrosis disparu, dysphagie progressive aux solides. Le pyrosis peut diminuer lorsque la sténose ou la métaplasie s’installe. La dysphagie impose une endoscopie rapide pour exclure un adénocarcinome.</p></div>
<div class="card"><h4>Forme de l’adulte jeune avec dysphagie</h4><p>Homme de 28 ans, rhinite allergique, mastique longuement et boit à chaque bouchée, impaction de viande au restaurant. Ce tableau évoque l’œsophagite à éosinophiles plutôt qu’un RGO (îlot 10).</p></div></div>
<div class="trap"><span class="k">Piège</span>Le patient âgé perçoit moins le pyrosis. Une œsophagite sévère ou un endobrachyœsophage peuvent se révéler directement par une anémie ferriprive, une hémorragie ou une dysphagie. L’absence de pyrosis n’exclut donc pas une maladie de reflux compliquée.</div>
<div class="key"><b>À retenir.</b> Pyrosis et régurgitation sont les symptômes typiques. Dysphagie, perte de poids, saignement, anémie et vomissements persistants sont des signes d’alarme. L’odynophagie oriente vers une autre œsophagite. L’examen clinique complète ce tri.</div>
</section>

<section class="ilot" id="k21-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique est normal dans le RGO non compliqué. Il sert à rechercher des signes de complication, une cause générale et un diagnostic différentiel. Un examen normal ne réduit donc pas la probabilité de reflux.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin mesure le poids, la taille et l’<button class="w" data-k="k21-obes">indice de masse corporelle et le tour de taille</button>, qui guident le conseil de perte de poids. Il note une perte de poids documentée, une pâleur conjonctivale et une tachycardie, qui orientent vers une anémie ou un saignement. La pression artérielle et la fréquence cardiaque comptent devant une douleur thoracique.</p></div>
<div class="card"><h4>Cavité buccale et cou</h4><p>Il inspecte les dents à la recherche d’<button class="w" data-k="k21-dents">érosions dentaires (perte d’émail des faces palatines)</button>. Il recherche un muguet buccal, qui accompagne souvent une candidose œsophagienne chez l’immunodéprimé. Il palpe le creux sus-claviculaire gauche, car une adénopathie y signale un cancer digestif avancé.</p></div>
<div class="card"><h4>Signes d’une maladie générale</h4><p>Une sclérodactylie, des télangiectasies, un phénomène de Raynaud et des calcinoses cutanées évoquent une <button class="w" data-k="k21-sclero">sclérodermie systémique</button>. Une dermatite atopique ou une rhinite allergique renforce la probabilité d’œsophagite à éosinophiles. Des lésions buccales de lichen plan orientent vers une atteinte œsophagienne de cette maladie.</p></div>
<div class="card"><h4>Abdomen et thorax</h4><p>La palpation abdominale recherche une masse épigastrique ou une hépatomégalie nodulaire. L’auscultation pulmonaire recherche des sibilants si le patient tousse. Devant une ingestion caustique, le médecin cherche un emphysème sous-cutané et une défense abdominale, signes de perforation.</p></div></div>
<div class="trap"><span class="k">Piège</span>Une douleur rétrosternale soulagée par un antiacide n’exclut pas une ischémie coronarienne. L’effet placebo des antiacides et la variabilité spontanée de l’angor rendent ce test thérapeutique sans valeur. Un électrocardiogramme et, si nécessaire, une troponine précèdent toute conclusion digestive.</div>
<div class="key"><b>À retenir.</b> L’examen ne prouve pas le RGO ; il cherche les complications, la sclérodermie, l’atopie, le muguet et les signes de cancer. Il oriente la démarche diagnostique qui suit.</div>
