
<!-- ===== FENÊTRES : définitions, mécanismes et clinique ===== -->
<template data-pop="k21-lyon" data-title="Consensus de Lyon 2.0">
<div class="lab">Définition</div><p>Le consensus de Lyon 2.0 est une révision internationale, publiée en ligne en septembre 2023 et dans Gut en 2024 (Gyawali et collègues), des critères qui prouvent ou excluent objectivement un RGO. Il remplace le consensus de Lyon de 2018.</p>
<div class="lab">Contenu</div><p>Il définit des preuves concluantes : œsophagite de Los Angeles B, C ou D, endobrachyœsophage prouvé par biopsie, sténose peptique, temps d’exposition acide supérieur à 6 %. Il définit une exclusion : exposition inférieure à 4 % sur tous les jours de mesure, sans association symptomatique. Il ajoute des arguments complémentaires : plus de 80 reflux par jour, impédance basale nocturne inférieure à 1500 ohms, hernie hiatale.</p>
<div class="lab">Ce qui change par rapport à 2018</div><p>Le grade B de Los Angeles devient concluant, alors que la version de 2018 n’acceptait que les grades C et D. Le seuil d’impédance nocturne baisse de 2292 à 1500 ohms. Le monitorage par capsule pendant 96 heures est préféré pour le RGO non prouvé. La notion de « RGO justifiant une action » est introduite : un reflux prouvé avec symptômes compatibles justifie un traitement prolongé ou une intervention.</p>
<div class="lab">Choix de la source</div><p>MEDINA retient Lyon 2.0, source primaire la plus récente sur ce sujet. Elle concerne l’adulte et des laboratoires de motricité ; sa population est celle des patients explorés pour symptômes de reflux. Le texte en vigueur auparavant, Lyon 2018 (Gyawali, Gut 2018), reste utile pour comprendre les comptes rendus anciens qui exigeaient les grades C ou D.</p>
<div class="lab">Piège</div><p>Les seuils ne valent que pour un examen fait sans IPP. Sous IPP, un temps d’exposition supérieur à 4 % avec plus de 80 reflux par jour suffit pour parler de RGO réfractaire prouvé.</p></template>

<template data-pop="k21-barriere" data-title="Barrière antireflux">
<div class="lab">Définition</div><p>Ensemble des structures qui empêchent le contenu gastrique de remonter : sphincter inférieur de l’œsophage, pilier droit du diaphragme, ligament phréno-œsophagien, angle de His et segment abdominal de l’œsophage.</p>
<div class="lab">Mécanisme normal</div><p>La pression du sphincter et celle du diaphragme se superposent au même niveau. À l’inspiration, la contraction diaphragmatique augmente la pression de la jonction, au moment même où la pression thoracique baisse et pourrait aspirer le contenu gastrique.</p>
<div class="lab">Perturbation</div><p>La hernie hiatale sépare les deux composantes ; l’obésité augmente le gradient de pression ; la sclérodermie supprime le tonus du sphincter. Les relaxations transitoires ouvrent la barrière sans déglutition.</p>
<div class="lab">Conséquence pratique</div><p>Les IPP ne réparent pas la barrière : ils rendent le reflux moins acide. Seule la chirurgie ou l’augmentation magnétique restaure une barrière mécanique.</p></template>

<template data-pop="k21-clair" data-title="Clairance œsophagienne">
<div class="lab">Définition</div><p>Capacité de l’œsophage à éliminer le liquide reflué, puis à neutraliser l’acide résiduel.</p>
<div class="lab">Mécanisme</div><p>Le péristaltisme chasse le volume en quelques secondes. La salive avalée apporte du bicarbonate qui ramène le pH de la muqueuse vers la neutralité. La gravité aide en position debout.</p>
<div class="lab">Perturbation</div><p>Sommeil, position couchée, sécheresse buccale, anticholinergiques et troubles moteurs allongent le contact acide. Un même reflux devient alors lésionnel.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin conseille de ne pas se coucher dans les deux à trois heures qui suivent un repas et de surélever la tête du lit en cas de symptômes nocturnes. Il recherche un trouble moteur avant une chirurgie, car une clairance absente contre-indique une valve serrée.</p></template>

<template data-pop="k21-montreal" data-title="Définition de Montréal">
<div class="lab">Définition</div><p>Consensus mondial publié en 2006 (Vakil et collègues, American Journal of Gastroenterology) selon une procédure Delphi réunissant 44 experts de 18 pays. Il définit le RGO comme une affection dans laquelle le reflux du contenu gastrique provoque des symptômes gênants ou des complications.</p>
<div class="lab">Apport</div><p>La définition est centrée sur le patient et indépendante de l’endoscopie. Elle sépare des syndromes œsophagiens et extra-œsophagiens, et reconnaît la toux, la laryngite, l’asthme et les érosions dentaires comme des manifestations possibles.</p>
<div class="lab">Limite</div><p>Une définition fondée sur la gêne ne prouve pas que les symptômes viennent du reflux. C’est pourquoi Lyon 2.0 exige une preuve objective avant un traitement prolongé.</p></template>

<template data-pop="k21-hyper" data-title="Hypersensibilité au reflux et pyrosis fonctionnel">
<div class="lab">Définitions</div><p>Selon les critères de Rome IV et Lyon 2.0, l’hypersensibilité au reflux associe des symptômes œsophagiens, une endoscopie normale, une exposition acide normale et une association positive entre les reflux et les symptômes. Le pyrosis fonctionnel associe les mêmes examens normaux à une association négative.</p>
<div class="lab">Mécanisme</div><p>Les nerfs sensitifs de l’œsophage, sensibilisés périphériquement et centralement, perçoivent comme douloureux des reflux physiologiques. Dans le pyrosis fonctionnel, la sensation ne dépend même plus du reflux.</p>
<div class="lab">Conséquence pratique</div><p>Ces patients répondent peu aux IPP et ne doivent pas être opérés. Les modulateurs de la douleur viscérale et les approches comportementales se discutent en milieu spécialisé. Le médecin arrête un IPP inefficace plutôt que de l’augmenter.</p></template>

<template data-pop="k21-la" data-title="Classification de Los Angeles">
<div class="lab">Définition</div><p>Classification endoscopique de l’œsophagite par reflux, validée en 1999 (Lundell et collègues, Gut). Elle repose sur la longueur des pertes de substance et sur leur extension entre les sommets des plis muqueux.</p>
<div class="lab">Grades</div><p>A : perte de substance de 5 mm ou moins, sans extension entre deux plis. B : plus de 5 mm, sans extension entre deux plis. C : extension entre au moins deux plis, sur moins de 75 % de la circonférence. D : au moins 75 % de la circonférence.</p>
<div class="lab">Valeur</div><p>Le critère « entre les sommets des plis » donne un accord acceptable entre observateurs, alors que l’estimation en pourcentages de circonférence donnait un accord médiocre. Les grades sont liés à l’exposition acide, à la réponse aux IPP et au risque de rechute.</p>
<div class="lab">Piège</div><p>Le grade A existe chez des sujets sans symptôme et n’est pas concluant. Le grade se décrit sans IPP depuis deux à quatre semaines, faute de quoi la cicatrisation le sous-estime.</p></template>

<template data-pop="k21-dague" data-title="Système dague-astérisque">
<div class="lab">Définition</div><p>Règle de la CIM-10 qui associe deux codes : le code de la maladie causale, marqué d’une dague (†), et le code de la manifestation dans un organe, marqué d’un astérisque (*).</p>
<div class="lab">Exemple</div><p>Une tuberculose de l’œsophage se code A18.8† pour la tuberculose d’autres organes et K23.0* pour l’atteinte œsophagienne. Un méga-œsophage chagasique se code B57.3† et K23.1*.</p>
<div class="lab">Règle</div><p>Le code astérisque ne s’emploie jamais seul. Les règles de codage suisses publiées par l’Office fédéral de la statistique précisent l’ordre et les cas d’emploi.</p></template>

<template data-pop="k21-acg" data-title="Recommandations de l’ACG 2022">
<div class="lab">Source</div><p>Katz P. O. et collègues, American Journal of Gastroenterology 2022;117:27–56. Recommandations de l’American College of Gastroenterology, établies selon la méthode GRADE, consultées en texte intégral le 08.10.2026.</p>
<div class="lab">Points principaux</div><p>Essai d’IPP de huit semaines pour le RGO typique sans alarme (forte, modérée). Endoscopie après deux à quatre semaines sans IPP en cas d’échec ou de rechute (forte, faible). Endoscopie première en cas de dysphagie, perte de poids, saignement ou facteurs de risque multiples d’endobrachyœsophage (forte, faible). Entretien indéfini ou chirurgie pour les grades C et D (forte, modérée). IPP 30 à 60 minutes avant un repas (forte, modérée).</p>
<div class="lab">Portée en Suisse</div><p>Aucune recommandation suisse spécifique et plus récente n’a été trouvée ; une synthèse suisse destinée aux médecins de famille (Ars Medici 2022) reprend l’ACG. Les antagonistes H2 et le sucralfate cités par l’ACG ne sont pas disponibles en Suisse.</p></template>

<template data-pop="k21-barrett" data-title="Endobrachyœsophage (renvoi au cours K22)">
<div class="lab">Définition</div><p>Remplacement de l’épithélium malpighien de l’œsophage distal par un épithélium cylindrique de type intestinal, sur au moins un centimètre au-dessus de la jonction, prouvé par biopsie. Il se code K22.7.</p>
<div class="lab">Mécanisme</div><p>Le reflux chronique détruit l’épithélium malpighien ; la régénération se fait par un épithélium plus résistant à l’acide. Cette adaptation porte un risque de dysplasie puis d’adénocarcinome.</p>
<div class="lab">Lien avec ce cours</div><p>L’endobrachyœsophage prouve le RGO et justifie un IPP au long cours. Ses facteurs de risque (sexe masculin, âge supérieur à 50 ans, RGO ancien, tabac, obésité abdominale, antécédent familial) guident l’indication d’une endoscopie première. Le suivi endoscopique et le traitement de la dysplasie relèvent du cours <a href="#/entry/K22">K22 — Troubles moteurs et autres maladies de l’œsophage</a>.</p></template>

<template data-pop="k21-tlesr" data-title="Relaxations transitoires du sphincter inférieur">
<div class="lab">Définition</div><p>Ouvertures du sphincter inférieur de l’œsophage qui surviennent sans déglutition et durent plus longtemps qu’une relaxation de déglutition.</p>
<div class="lab">Mécanisme</div><p>La distension du fundus après un repas stimule des fibres afférentes vagales. Un centre du tronc cérébral commande la relaxation du sphincter et l’inhibition du diaphragme crural. Ce réflexe permet l’éructation de l’air gastrique.</p>
<div class="lab">Valeur</div><p>C’est le mécanisme principal des reflux, chez le sujet sain comme chez le malade. Le malade a plus de relaxations accompagnées de reflux acide, surtout s’il a une hernie hiatale.</p>
<div class="lab">Conséquence pratique</div><p>Les repas copieux et tardifs multiplient ces relaxations au coucher. Le baclofène, agoniste GABA-B, les diminue, mais ses effets centraux en limitent l’usage.</p></template>

<template data-pop="k21-hh" data-title="Hernie hiatale">
<div class="lab">Définition</div><p>Ascension d’une partie de l’estomac dans le thorax par le hiatus œsophagien. La forme par glissement fait monter la jonction ; la forme par roulement laisse la jonction en place et fait monter la grosse tubérosité à côté d’elle.</p>
<div class="lab">Mécanisme du reflux</div><p>La forme par glissement sépare le sphincter du diaphragme, crée un réservoir d’acide supra-diaphragmatique et favorise les relaxations transitoires.</p>
<div class="lab">Valeur</div><p>Lyon 2.0 en fait un argument complémentaire, non concluant. Une grande hernie favorise une œsophagite sévère.</p>
<div class="lab">Renvoi</div><p>Les hernies diaphragmatiques (K44) et leurs complications sont traitées dans le cours <a href="#/entry/K40">K40 — Hernies de la paroi abdominale et du diaphragme</a>.</p></template>

<template data-pop="k21-poche" data-title="Poche acide post-prandiale">
<div class="lab">Définition</div><p>Couche d’acide non tamponné qui se forme à la surface du contenu gastrique, juste sous la jonction, après un repas.</p>
<div class="lab">Mécanisme</div><p>Le repas tamponne l’acide au centre de l’estomac, mais la sécrétion continue au contact du fundus où l’acide ne se mélange pas. Cette couche est la première à refluer lors d’une relaxation.</p>
<div class="lab">Conséquence pratique</div><p>Elle explique le pyrosis post-prandial malgré un pH gastrique moyen élevé après le repas. L’alginate forme un gel flottant qui la déplace vers le bas et diminue son reflux.</p></template>

<template data-pop="k21-stenose" data-title="Sténose peptique">
<div class="lab">Définition</div><p>Rétrécissement fibreux de l’œsophage distal, cicatrice d’une œsophagite par reflux chronique. Elle se code K22.2 avec K21.0.</p>
<div class="lab">Clinique</div><p>Dysphagie progressive aux solides, parfois impaction ; le pyrosis peut diminuer quand la sténose s’installe.</p>
<div class="lab">Conduite</div><p>Endoscopie avec biopsies pour exclure un cancer, dilatation progressive, IPP au long cours pour prévenir la récidive. Lyon 2.0 en fait une preuve concluante de RGO ; une récidive sous IPP optimisé signe un RGO réfractaire.</p></template>

<template data-pop="k21-obes" data-title="Obésité et reflux">
<div class="lab">Mécanisme</div><p>La graisse abdominale augmente la pression intra-gastrique et le gradient entre l’estomac et l’œsophage. Elle favorise la hernie hiatale et augmente le nombre de relaxations transitoires accompagnées de reflux.</p>
<div class="lab">Mesure</div><p>L’indice de masse corporelle est le poids en kilogrammes divisé par le carré de la taille en mètres. Le tour de taille reflète mieux la graisse abdominale. Exemple : 98 kg pour 1,78 m donnent 98 / 3,17 = 31 kg/m².</p>
<div class="lab">Conséquence pratique</div><p>L’ACG 2022 recommande fortement la perte de poids chez le patient en surpoids ou obèse avec RGO. Le bypass gastrique de Roux-en-Y traite les deux maladies ; la sleeve gastrectomie peut aggraver le reflux.</p></template>

<template data-pop="k21-sclero" data-title="Sclérodermie systémique et œsophage">
<div class="lab">Mécanisme</div><p>La sclérodermie atteint d’abord la vascularisation et l’innervation, puis remplace le muscle lisse par de la fibrose. Les deux tiers inférieurs de l’œsophage, en muscle lisse, perdent leur péristaltisme et le sphincter inférieur perd son tonus.</p>
<div class="lab">Conséquence</div><p>Le reflux est fréquent et la clairance quasi nulle : les œsophagites sont sévères et les sténoses fréquentes. Les micro-inhalations peuvent aggraver une pneumopathie interstitielle.</p>
<div class="lab">Conduite</div><p>IPP au long cours ; la fundoplicature est risquée, car l’absence de péristaltisme expose à une dysphagie sévère après une valve. La manométrie confirme l’absence de contractilité.</p></template>

<template data-pop="k21-medsio" data-title="Médicaments qui favorisent le reflux">
<div class="lab">Mécanisme</div><p>Les dérivés nitrés et les anticalciques relâchent le muscle lisse, dont celui du sphincter inférieur. Les anticholinergiques diminuent le tonus du sphincter, la salive et le péristaltisme. La progestérone agit de façon comparable pendant la grossesse.</p>
<div class="lab">Limite</div><p>L’effet est variable d’un patient à l’autre, et l’indication du médicament prime souvent sur le reflux. Le médecin réévalue seulement ceux qui ne sont pas indispensables.</p>
<div class="lab">Distinction</div><p>Les AINS, la doxycycline, les bisphosphonates, le potassium et le fer agissent autrement : ils lèsent directement la muqueuse et produisent une œsophagite médicamenteuse.</p></template>

<template data-pop="k21-pyrosis" data-title="Pyrosis">
<div class="lab">Définition</div><p>Sensation de brûlure rétrosternale qui monte de l’épigastre vers le cou.</p>
<div class="lab">Mécanisme</div><p>L’acide traverse les espaces intercellulaires élargis et stimule les nocicepteurs sensibles à l’acidité de la couche profonde de l’épithélium.</p>
<div class="lab">Caractérisation</div><p>Le médecin demande la fréquence par semaine, l’horaire, le lien avec les repas, la position et l’effet des antiacides. Un pyrosis au moins deux fois par semaine ou qui réveille le patient est gênant au sens de Montréal.</p>
<div class="lab">Piège</div><p>Le patient appelle parfois « brûlure d’estomac » une douleur épigastrique sans ascension, qui relève de la dyspepsie. La question « la brûlure monte-t-elle derrière le sternum ? » corrige l’interprétation.</p></template>

<template data-pop="k21-regurg" data-title="Régurgitation">
<div class="lab">Définition</div><p>Remontée passive de liquide acide ou d’aliments dans la bouche ou le pharynx, sans nausée ni effort de vomissement.</p>
<div class="lab">Valeur</div><p>Elle oriente vers un reflux de volume et une barrière défaillante. Elle répond moins bien aux IPP que le pyrosis, car le volume persiste.</p>
<div class="lab">Diagnostic différentiel</div><p>Des aliments non digérés remontant longtemps après le repas évoquent une achalasie. Une remontée sans effort dans les minutes qui suivent le repas, puis remastiquée, évoque une rumination.</p>
<div class="lab">Conséquence pratique</div><p>Une régurgitation prédominante, prouvée et réfractaire, est la meilleure indication de la fundoplicature ou de l’augmentation magnétique.</p></template>

<template data-pop="k21-dthor" data-title="Douleur thoracique non cardiaque">
<div class="lab">Définition</div><p>Douleur thoracique d’allure angineuse dont une cause cardiaque a été exclue.</p>
<div class="lab">Mécanisme</div><p>Le cœur et l’œsophage partagent des voies afférentes viscérales ; leur douleur est perçue au même endroit. Le reflux et les troubles moteurs en sont les causes œsophagiennes principales.</p>
<div class="lab">Conduite</div><p>L’ACG 2022 recommande, après exclusion d’une cardiopathie, une preuve objective par endoscopie ou monitorage plutôt qu’un essai d’IPP isolé. Lyon 2.0 rappelle que la réponse à l’IPP n’atteint qu’environ la moitié des patients dans cette indication.</p>
<div class="lab">Piège</div><p>L’ordre ne s’inverse jamais : l’électrocardiogramme et, si nécessaire, la troponine précèdent toute conclusion digestive.</p></template>

<template data-pop="k21-extra" data-title="Manifestations extra-œsophagiennes">
<div class="lab">Lesquelles</div><p>Toux chronique, enrouement, laryngite, raclements, asthme mal contrôlé, érosions dentaires.</p>
<div class="lab">Mécanismes</div><p>Le reflux qui atteint le pharynx peut irriter le larynx ou être inhalé. Le reflux distal peut déclencher une toux ou une bronchoconstriction par un réflexe vagal, sans aspiration.</p>
<div class="lab">Limite</div><p>Ces symptômes ont d’autres causes plus fréquentes. Le lien causal est souvent incertain, et les IPP ont un effet faible en l’absence de symptômes typiques.</p>
<div class="lab">Conduite (ACG 2022)</div><p>Rechercher d’abord les autres causes ; faire un monitorage avant les IPP si les symptômes typiques manquent ; accepter un essai d’IPP deux fois par jour pendant 8 à 12 semaines si des symptômes typiques coexistent ; ne pas opérer sans preuve objective.</p></template>

<template data-pop="k21-dysph" data-title="Dysphagie">
<div class="lab">Définition</div><p>Sensation que les aliments s’arrêtent pendant leur passage entre la bouche et l’estomac.</p>
<div class="lab">Caractérisation</div><p>Le médecin distingue la dysphagie oropharyngée, qui survient dès le début de la déglutition avec toux ou fausse route, de la dysphagie œsophagienne, ressentie derrière le sternum quelques secondes après. Il demande si elle concerne les solides seuls, ce qui oriente vers un obstacle, ou aussi les liquides, ce qui oriente vers un trouble moteur. Il précise l’évolution : progressive dans le cancer, intermittente dans l’EoE et les anneaux.</p>
<div class="lab">Valeur</div><p>Dans un tableau de reflux, elle est un signe d’alarme qui impose une endoscopie.</p>
<div class="lab">Renvoi</div><p>La démarche complète devant une dysphagie figure dans le cours <a href="#/entry/R13">R13 — Dysphagie et pyrosis (G-04-Gastroentérologie et hépatologie)</a>.</p></template>

<template data-pop="k21-odyno" data-title="Odynophagie">
<div class="lab">Définition</div><p>Douleur provoquée par la déglutition.</p>
<div class="lab">Mécanisme</div><p>Le bol alimentaire étire et frotte une muqueuse ulcérée ou inflammée, dont les nerfs sont exposés.</p>
<div class="lab">Valeur</div><p>Elle est rare dans le RGO simple. Elle oriente vers une œsophagite infectieuse, médicamenteuse, caustique ou radique, ou vers un ulcère profond.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin cherche le terrain : immunodépression, comprimé pris couché, ingestion de produit, radiothérapie. Une odynophagie intense empêche de boire ; elle peut imposer une hydratation intraveineuse.</p></template>

<template data-pop="k21-eruct" data-title="Éructation supra-gastrique et rumination">
<div class="lab">Éructation supra-gastrique</div><p>Le patient aspire ou avale de l’air dans l’œsophage, puis l’expulse aussitôt, sans qu’il atteigne l’estomac. Les éructations sont très fréquentes, cessent pendant le sommeil et augmentent sous stress ou à l’attention.</p>
<div class="lab">Rumination</div><p>Une contraction abdominale réflexe, non perçue, fait remonter le repas dans la bouche dans les minutes qui suivent ; le patient remastique ou recrache, sans nausée.</p>
<div class="lab">Diagnostic</div><p>La pH-impédancemétrie sans IPP montre le profil caractéristique. Lyon 2.0 recommande cet examen dans ces indications.</p>
<div class="lab">Conduite</div><p>Le traitement est comportemental, notamment la respiration diaphragmatique. Les IPP et la chirurgie sont inutiles.</p></template>

<template data-pop="k21-alarm" data-title="Signes d’alarme">
<div class="lab">Liste</div><p>Dysphagie, perte de poids involontaire, hémorragie digestive (hématémèse, méléna) ou anémie ferriprive, vomissements persistants. La synthèse suisse de l’ACG (Ars Medici 2022) cite aussi la douleur thoracique, qui impose d’abord l’exclusion d’une cause cardiaque.</p>
<div class="lab">Pourquoi</div><p>Chacun peut traduire une complication (sténose, ulcère qui saigne) ou un cancer de l’œsophage ou de l’estomac. L’IPP peut améliorer ces symptômes et masquer le cancer.</p>
<div class="lab">Conduite</div><p>Endoscopie rapide, avant tout traitement d’épreuve. L’information professionnelle suisse de l’ésoméprazole demande d’exclure une malignité dans ces situations.</p>
<div class="lab">Aussi</div><p>L’ACG 2022 recommande aussi une endoscopie première chez le patient porteur de plusieurs facteurs de risque d’endobrachyœsophage.</p></template>

<template data-pop="k21-dents" data-title="Érosions dentaires">
<div class="lab">Définition</div><p>Perte d’émail d’origine chimique, sans bactérie, à la différence de la carie.</p>
<div class="lab">Valeur</div><p>Dans le reflux, elles touchent surtout les faces palatines des dents supérieures, exposées à l’acide reflué. Les érosions des faces vestibulaires évoquent plutôt une alimentation acide.</p>
<div class="lab">Conséquence pratique</div><p>Le dentiste peut être le premier à suspecter un reflux ou des vomissements répétés, par exemple dans un trouble des conduites alimentaires.</p></template>
