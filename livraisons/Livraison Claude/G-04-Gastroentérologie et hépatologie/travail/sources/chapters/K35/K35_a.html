<section class="ilot" id="k35-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un étudiant de 24 ans consulte aux urgences de Neuchâtel à 22 heures. Sa douleur a commencé la veille au soir autour du nombril, sourde et mal localisée. Au matin, elle s’est déplacée dans la fosse iliaque droite et elle est devenue vive. Il n’a rien mangé depuis midi, il a vomi une fois et sa température axillaire atteint 38,0 °C. La toux et les secousses de la voiture réveillent la douleur. Les leucocytes valent 13,8 × 10⁹/L, avec 82 % de neutrophiles, et la <button class="w" data-k="k35-crp">protéine C-réactive (cinétique, seuils)</button> vaut 38 mg/L.</p>
<p>La question qui structure le chapitre est la suivante : <b>ce patient a-t-il une appendicite, est-elle simple ou compliquée, faut-il une imagerie, et doit-il être opéré, ou un traitement antibiotique est-il une option raisonnable ?</b> La réponse n’est plus univoque depuis dix ans. L’appendicectomie reste la référence, mais des essais randomisés ont montré qu’une partie des appendicites simples guérit sous antibiotiques, et même parfois sans antibiotique.</p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître la séquence clinique typique et ses formes trompeuses. Il calcule un score de probabilité et décide en conséquence de l’observation, de l’imagerie ou de la chirurgie. Il distingue l’appendicite simple de l’appendicite compliquée, car ce tri commande le délai opératoire et la durée des antibiotiques. Il conduit une décision partagée sur le traitement antibiotique, adapte la démarche à l’enfant, à la femme enceinte et au sujet âgé, et reconnaît une tumeur appendiculaire derrière un tableau d’appendicite.</p>
<div class="key"><b>Message fondateur.</b> L’appendicite n’est pas une seule maladie qui évolue toujours vers la perforation. Les données épidémiologiques et les essais randomisés suggèrent deux formes : une forme simple, qui peut régresser, et une forme compliquée, qui progresse vite vers la gangrène et la perforation. Le travail du clinicien consiste donc à repérer la forme compliquée sans délai et à éviter d’opérer inutilement ceux qui n’ont pas d’appendicite.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="k35-anat">anatomie de l’appendice (position, vascularisation, innervation)</button>, la <button class="w" data-k="k35-douleur">physiologie de la douleur viscérale et pariétale</button> et la notion de <button class="w" data-k="k35-complique">appendicite compliquée (définition opérationnelle)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="k35-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>L’appendicite aiguë est une inflammation aiguë de l’appendice vermiforme, le diverticule borgne implanté sur le cæcum. Le diagnostic de certitude est histologique : l’anatomopathologiste exige une infiltration de la musculeuse par des polynucléaires neutrophiles. Une inflammation limitée à la muqueuse ou à la séreuse ne suffit pas, car elle accompagne aussi une salpingite, une iléite ou une péritonite d’autre origine.</p>
<h3>1.1 Appendicite simple et appendicite compliquée</h3>
<p>Le tri clinique le plus utile oppose deux catégories. L’<b>appendicite simple</b>, ou non compliquée, désigne un appendice enflammé, éventuellement phlegmoneux, sans nécrose ni perforation. L’<b>appendicite compliquée</b> comprend la gangrène, la perforation, l’abcès péri-appendiculaire, le plastron et la péritonite. La définition varie entre les études : certaines y rangent la présence d’un <button class="w" data-k="k35-stercolithe">stercolithe (appendicolithe)</button>, d’autres non. Cette variabilité explique une partie des écarts entre les essais.</p>
<p>Cette distinction change trois décisions. Elle fixe le délai opératoire, car la forme compliquée s’opère dans les heures qui suivent la réanimation. Elle exclut le traitement antibiotique seul, réservé à la forme simple. Elle détermine enfin la durée des antibiotiques après l’intervention, nulle dans la forme simple et courte dans la forme compliquée.</p>
<h3>1.2 Classification opératoire de la WSES</h3>
<p>La World Society of Emergency Surgery a proposé en 2015 une <button class="w" data-k="k35-wses-grade">classification de gravité en cinq grades (0 à 4)</button>. Elle combine la clinique, l’imagerie et l’aspect opératoire. Dans l’étude observationnelle mondiale de 4282 patients publiée en 2018, la moitié des patients avait un grade 1, appendice enflammé sans nécrose, et 10 % un grade 4, péritonite généralisée.</p>
<table class="t"><tr><th>Grade WSES</th><th>Aspect</th><th>Conséquence pratique</th></tr>
<tr><td>0</td><td>Appendice d’aspect normal</td><td>Appendicectomie suggérée si aucune autre cause n’est trouvée (2C)</td></tr>
<tr><td>1</td><td>Appendice enflammé (hyperhémie, œdème, fibrine), sans nécrose</td><td>Forme simple : pas d’antibiotique après l’intervention</td></tr>
<tr><td>2a et 2b</td><td>Nécrose segmentaire (2a) ou de la base (2b)</td><td>Forme compliquée ; une nécrose de la base complique la fermeture du moignon</td></tr>
<tr><td>3a, 3b, 3c</td><td>Plastron (3a), abcès de moins de 5 cm (3b), abcès de plus de 5 cm (3c), sans air libre</td><td>Antibiotiques, drainage ou chirurgie selon l’expertise locale</td></tr>
<tr><td>4</td><td>Péritonite généralisée, avec ou sans air libre</td><td>Réanimation puis chirurgie urgente</td></tr></table>
<p>La lecture du tableau commence par la colonne de droite, car elle porte la décision. Chez le patient de l’îlot 0, un appendice turgescent et rouge sans nécrose correspondrait au grade 1 : il serait opéré sans antibiotique au-delà de la dose préopératoire. L’erreur fréquente consiste à prolonger les antibiotiques dans un grade 1 parce que l’appendice « paraissait très enflammé » : l’appréciation macroscopique varie beaucoup d’un chirurgien à l’autre.</p>
<h3>1.3 Codage CIM-10-GM 2024 des catégories K35 à K38</h3>
<p>Le bloc K35–K38 de la CIM-10-GM 2024 regroupe les maladies de l’appendice. Le codage traduit directement le tri simple ou compliqué : un code par niveau de diffusion péritonéale. Le tableau suivant reprend les sous-codes publiés par le BfArM.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Traduction clinique</th></tr>
<tr><td>K35.2</td><td>Appendicite aiguë avec péritonite généralisée</td><td>Perforation ou rupture avec péritonite diffuse (grade WSES 4)</td></tr>
<tr><td>K35.30</td><td>Appendicite aiguë avec péritonite localisée, sans perforation ni rupture</td><td>Réaction péritonéale de voisinage, appendice intact</td></tr>
<tr><td>K35.31</td><td>Appendicite aiguë avec péritonite localisée, avec perforation ou rupture</td><td>Perforation contenue par l’épiploon et les anses</td></tr>
<tr><td>K35.32</td><td>Appendicite aiguë avec abcès péritonéal</td><td>Abcès péri-appendiculaire (grades 3b et 3c)</td></tr>
<tr><td>K35.8</td><td>Appendicite aiguë, sans précision</td><td>Aucune mention de péritonite ; la majorité des formes simples</td></tr>
<tr><td>K36</td><td>Autres formes d’appendicite</td><td>Appendicite chronique ou récidivante (îlot 11.5)</td></tr>
<tr><td>K37</td><td>Appendicite, sans précision</td><td>Code de dernier recours, sans caractère aigu ou chronique précisé</td></tr>
<tr><td>K38</td><td>Autres maladies de l’appendice</td><td>Hyperplasie, concrétions, diverticule, fistule, invagination (îlot 12)</td></tr></table>
<p>Pour le patient de l’îlot 0, une appendicite opérée sans péritonite se code K35.8. Le piège consiste à coder K37 une appendicite aiguë documentée : K37 ne s’emploie que lorsque le dossier ne précise rien. Les tumeurs de l’appendice ne relèvent pas de K38 ; elles se codent au chapitre des tumeurs de la classification (C18, D12 ou D37 selon leur nature), ce qui justifie leur traitement à part dans l’îlot 12.</p>
<div class="key"><b>À retenir.</b> Le diagnostic de certitude est histologique, mais la décision clinique repose sur le tri entre forme simple et forme compliquée. Ce tri fixe le délai opératoire, l’éligibilité au traitement antibiotique et la durée des antibiotiques. Le codage de la CIM-10-GM suit la même logique, du K35.8 sans péritonite au K35.2 avec péritonite généralisée. La physiopathologie de l’îlot 3 explique pourquoi certaines formes progressent et d’autres régressent.</div>
</section>

<section class="ilot" id="k35-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’appendicite est l’urgence chirurgicale abdominale la plus fréquente. La WSES estime le risque de la faire au cours de la vie à 8 % en Europe et à 9 % aux États-Unis. Les recommandations nationales suédoises de 2025 rapportent une incidence d’environ 120 cas pour 100 000 habitants par an, avec un pic entre 10 et 25 ans et une prédominance masculine. Aucune incidence nationale suisse publiée et datée n’a été retrouvée pour la population générale ; ce chiffre suédois sert de repère européen.</p>
<p>Une donnée suisse existe chez l’enfant. Entre 2014 et 2018, la surveillance nationale des infections du site opératoire de Swissnoso a recensé 7174 appendicectomies chez des enfants de 16 ans ou moins. Cette surveillance est obligatoire pour l’appendicectomie dans les hôpitaux suisses, ce qui rend ces données exhaustives.</p>
<h3>2.1 Perforation et âge</h3>
<p>La proportion de perforations varie de 16 % à 40 % selon les séries de la WSES 2020. Elle atteint 40 à 57 % chez les jeunes enfants et 55 à 70 % après 50 ans. Deux mécanismes l’expliquent. Le jeune enfant exprime mal sa douleur et son épiploon court cloisonne mal l’infection. Le sujet âgé a une réponse inflammatoire atténuée et consulte plus tard, avec des signes moins francs.</p>
<p>Une proportion de perforations doit être lue avec prudence. Elle dépend du numérateur (perforations) et du dénominateur (toutes les appendicites diagnostiquées). Lorsque l’imagerie détecte davantage de formes simples, la proportion baisse sans que le nombre absolu de perforations change. Les auteurs suédois relèvent cet artefact lors de l’introduction de la tomodensitométrie.</p>
<h3>2.2 Mortalité et morbidité</h3>
<p>Dans les pays à revenu élevé, la mortalité est de 0,09 à 0,24 % selon les recommandations suédoises. L’étude mondiale de la WSES, menée dans 116 services de 44 pays, a mesuré 0,28 %. Les seuls facteurs indépendants de décès y étaient un score de comorbidité de Charlson supérieur à 5 et les grades WSES 3c et 4. La gravité tient donc au terrain et à la diffusion péritonéale plus qu’à l’appendice lui-même.</p>
<div class="key"><b>À retenir.</b> Le risque d’appendicite au cours de la vie est d’environ 8 % en Europe. La perforation touche surtout les deux extrêmes de la vie, parce que la clinique y est moins parlante et la défense locale moins efficace. Le décès est rare et lié aux comorbidités et à la péritonite. La physiopathologie explique ce gradient de gravité.</div>
</section>

<section class="ilot" id="k35-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se lit comme une chaîne. Chaque maillon explique un symptôme, et chaque décision thérapeutique agit sur un maillon. Une incertitude réelle demeure cependant : l’obstruction de la lumière, longtemps tenue pour la cause universelle, n’est retrouvée que dans une partie des cas.</p>
<h3>3.1 État normal</h3>
<p>L’appendice normal mesure de 6 à 10 cm de long et quelques millimètres de diamètre. Sa paroi contient un tissu lymphoïde abondant chez l’enfant et l’adolescent. Sa muqueuse sécrète en continu du mucus qui s’écoule vers le cæcum. Sa lumière étroite se vide donc en permanence, et la pression intraluminale reste basse.</p>
<h3>3.2 Première charnière : obstruction ou agression muqueuse</h3>
<p>Chez une partie des patients, la lumière se ferme. Les causes sont un <button class="w" data-k="k35-stercolithe">stercolithe</button>, une hyperplasie des follicules lymphoïdes après une infection virale, plus rarement une tumeur ou un parasite. Chez d’autres, aucune obstruction n’est trouvée ; une agression de la muqueuse par un agent infectieux est alors invoquée. Les recommandations suédoises de 2025 concluent à une étiologie multifactorielle.</p>
<h3>3.3 Deuxième charnière : distension et douleur viscérale</h3>
<p>Le mucus continue d’être sécrété derrière l’obstacle. La lumière se distend et la pression monte. La distension stimule les fibres afférentes viscérales, qui rejoignent la moelle au niveau du dixième segment thoracique. Ce segment innerve aussi la peau péri-ombilicale : le cerveau projette donc la douleur autour du nombril. C’est la <button class="w" data-k="k35-douleur">douleur viscérale, sourde et mal localisée</button>, accompagnée de nausées par voie réflexe.</p>
<h3>3.4 Troisième charnière : ischémie et invasion bactérienne</h3>
<p>Lorsque la pression intraluminale dépasse la pression veineuse, le retour veineux s’arrête. La paroi devient œdémateuse puis ischémique. La muqueuse ischémique perd sa fonction de barrière, et les bactéries de la lumière envahissent la paroi. Les polynucléaires neutrophiles affluent : la fièvre, la leucocytose et l’élévation de la protéine C-réactive traduisent cette réponse systémique.</p>
<h3>3.5 Quatrième charnière : irritation péritonéale</h3>
<p>L’inflammation atteint la séreuse et le péritoine pariétal voisin. Celui-ci reçoit une innervation somatique précise, segmentaire. La douleur devient alors vive et localisée en fosse iliaque droite : c’est la <b>migration</b> classique. Tout ce qui mobilise le péritoine enflammé la réveille, la toux, la marche, le saut ou la décompression brusque de l’abdomen.</p>
<h3>3.6 Cinquième charnière : gangrène, perforation ou cloisonnement</h3>
<p>L’artère appendiculaire est une artère terminale, sans suppléance. Une thrombose ou une compression suffit à nécroser la paroi : c’est la gangrène, puis la perforation. Si l’épiploon et les anses grêles entourent l’appendice à temps, l’infection reste cloisonnée et forme un <button class="w" data-k="k35-abces">plastron ou un abcès</button>. Sinon, le contenu infecté diffuse et provoque une péritonite généralisée.</p>

<p>La figure se lit de gauche à droite, puis vers le bas. La branche pointillée n’est pas théorique. Dans l’essai finlandais <button class="w" data-k="k35-appac3">APPAC III contre placebo</button>, 87 % des patients atteints d’une appendicite simple confirmée par tomodensitométrie ont guéri en dix jours sous placebo. Le patient de l’îlot 0 se situe à la charnière 5 : douleur migrée, défense, fièvre. Il n’a pas encore de signe de perforation.</p>
<div class="key"><b>À retenir.</b> La douleur commence autour du nombril parce que l’appendice distendu stimule des fibres viscérales du dixième segment thoracique. Elle migre en fosse iliaque droite quand le péritoine pariétal, innervé de façon somatique, est atteint. L’artère appendiculaire terminale explique la gangrène et la perforation. Une partie des formes simples régresse spontanément ; les causes de cette évolution sont développées dans l’îlot 4.</div>
</section>

<section class="ilot" id="k35-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>L’appendicite n’a pas de cause unique. Les recommandations suédoises de 2025 retiennent une origine multifactorielle : obstruction, environnement, sexe, âge, facteurs génétiques et immunologiques. Les causes d’obstruction se hiérarchisent selon l’âge, ce qui oriente l’imagerie et l’examen histologique.</p>
<table class="t"><tr><th>Cause</th><th>Terrain typique</th><th>Mécanisme et conséquence</th></tr>
<tr><td>Stercolithe (appendicolithe)</td><td>Tout âge</td><td>Obstruction mécanique ; associé à la perforation et à l’échec du traitement antibiotique</td></tr>
<tr><td>Hyperplasie lymphoïde</td><td>Enfant, adolescent</td><td>Follicules gonflés après une infection virale ; fermeture transitoire de la lumière</td></tr>
<tr><td>Tumeur appendiculaire</td><td>Adulte de plus de 40 ans</td><td>Obstruction par une néoplasie mucineuse ou une tumeur neuroendocrine ; fréquence de 3 à 17 % dans les formes compliquées après 40 ans</td></tr>
<tr><td>Parasite (<i>Enterobius vermicularis</i>)</td><td>Enfant</td><td>Obstruction ou irritation muqueuse ; découverte histologique</td></tr>
<tr><td>Maladie de Crohn iléo-cæcale</td><td>Adulte jeune</td><td>Atteinte transmurale qui s’étend à l’appendice ; à évoquer devant une iléite associée</td></tr></table>
<p>Le tableau impose une lecture par l’âge. Chez l’adolescent de 15 ans, une hyperplasie lymphoïde est la cause la plus vraisemblable. Chez une femme de 62 ans avec un abcès appendiculaire, la tumeur devient une hypothèse à exclure activement : c’est la raison de la coloscopie et de la tomodensitométrie de contrôle décrites à l’îlot 10.</p>
<h3>4.1 Deux formes de maladie</h3>
<p>Plusieurs observations suggèrent que la forme simple et la forme compliquée sont deux entités distinctes. Pendant la pandémie de maladie à coronavirus 2019, les appendicites simples diagnostiquées ont diminué, alors que les formes compliquées sont restées stables. L’incidence des formes simples varie selon les régions et les époques, celle des formes compliquées beaucoup moins. Enfin, retarder l’intervention de 24 heures après l’admission n’augmente pas la proportion de perforations. Ces faits sont des associations : ils n’établissent pas un mécanisme, mais ils justifient de ne plus opérer en urgence nocturne toute forme simple. Voir la fenêtre <button class="w" data-k="k35-deux-formes">deux formes d’appendicite (arguments et limites)</button>.</p>
<h3>4.2 Facteurs associés</h3>
<p>Des agrégats familiaux sont décrits, mais une étude de jumeaux suédoise n’a pas retrouvé d’effet génétique net et a souligné le rôle de l’environnement. Une association inverse existe entre l’appendicectomie avant 20 ans et la rectocolite hémorragique ; elle est décrite aussi au sein des familles. Ces associations n’autorisent aucune appendicectomie préventive.</p>
<div class="key"><b>À retenir.</b> Le stercolithe compte pour deux raisons : il favorise la perforation et il fait échouer le traitement antibiotique. La tumeur est une cause rare mais à rechercher après 40 ans, surtout devant un abcès. Les arguments en faveur de deux formes distinctes justifient une prise en charge graduée selon la gravité. L’anamnèse permet de situer le patient dans cette chaîne.</div>
</section>

<section class="ilot" id="k35-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche la séquence temporelle plus que chaque symptôme isolé. Aucun symptôme pris seul ne suffit au diagnostic, mais leur ordre d’apparition a une valeur. Elle doit aussi écarter activement les diagnostics gynécologiques, urinaires et digestifs qui imitent l’appendicite.</p>
<h3>5.1 Symptômes, par fréquence</h3>
<p>Dans l’étude mondiale de la WSES, la douleur de la fosse iliaque droite était présente chez 91,2 % des patients, les vomissements chez 42 % et la fièvre chez 24,7 %. La <button class="w" data-k="k35-migration">migration de la douleur (de l’ombilic vers la fosse iliaque droite)</button> est l’élément le plus caractéristique. L’<button class="w" data-k="k35-anorexie">anorexie (perte d’appétit précoce)</button> précède souvent les vomissements. Une douleur réveillée par la toux ou les secousses en voiture traduit l’irritation péritonéale.</p>
<p>L’ordre a un sens physiopathologique. La douleur précède les vomissements, parce que la distension viscérale déclenche d’abord la douleur puis le réflexe nauséeux. Des vomissements qui précèdent la douleur orientent plutôt vers une gastro-entérite. Une diarrhée abondante oriente aussi vers une gastro-entérite, mais un appendice pelvien au contact du rectum peut en provoquer.</p>
<h3>5.2 Antécédents et contexte</h3>
<p>Le médecin demande s’il existe un épisode antérieur semblable, car un traitement antibiotique d’une appendicite expose à une récidive dans environ 38 % des cas à dix ans. Il précise une appendicectomie antérieure, qui n’exclut pas une <button class="w" data-k="k35-moignon">appendicite du moignon</button>. Chez la femme en âge de procréer, il interroge sur les dernières règles, la contraception, des pertes vaginales et une infection sexuellement transmissible. Chez le sujet de plus de 40 ans, il recherche un amaigrissement, une anémie ou une modification du transit, qui évoquent une tumeur.</p>
<h3>5.3 Formes typique et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Douleur péri-ombilicale puis fosse iliaque droite en 12 à 24 heures, anorexie, un ou deux vomissements, fébricule à 38 °C. C’est la forme du patient de l’îlot 0, la plus fréquente chez l’adulte jeune.</p></div>
<div class="card"><h4>Appendice rétrocæcal</h4><p>L’appendice placé derrière le cæcum ne touche pas la paroi antérieure. La douleur est lombaire ou du flanc, la défense antérieure discrète, et le signe du psoas positif. Une leucocyturie par contact urétéral peut égarer vers une pyélonéphrite.</p></div>
<div class="card"><h4>Appendice pelvien</h4><p>L’appendice plonge dans le petit bassin. La douleur est sus-pubienne, avec pollakiurie, ténesme ou diarrhée. Le toucher rectal ou vaginal est douloureux à droite, alors que la palpation abdominale reste pauvre.</p></div>
<div class="card"><h4>Enfant de moins de 5 ans</h4><p>Les symptômes sont peu spécifiques : vomissements, refus de marcher, irritabilité, fièvre. L’évolution est plus rapide et la perforation plus fréquente. Voir l’îlot 11.1.</p></div>
<div class="card"><h4>Sujet âgé</h4><p>La douleur est modérée, la fièvre absente ou faible, la leucocytose inconstante. Le tableau peut se limiter à une occlusion fébrile ou à une confusion. La perforation est présente dans 55 à 70 % des cas après 50 ans.</p></div>
<div class="card"><h4>Grossesse</h4><p>L’utérus refoule le cæcum vers le haut au troisième trimestre. La douleur peut siéger dans tout le flanc droit. Nausées et leucocytose physiologiques réduisent la valeur des scores. Voir l’îlot 11.2.</p></div></div>
<p>Les cartes montrent un principe commun. La position de l’appendice et le terrain modifient la topographie et l’intensité des signes, pas la physiopathologie. Une absence de douleur en fosse iliaque droite n’exclut donc pas une appendicite rétrocæcale ou pelvienne.</p>
<div class="key"><b>À retenir.</b> La séquence douleur péri-ombilicale, migration, anorexie puis vomissement a plus de valeur que chaque symptôme pris seul. Chez la femme jeune, l’anamnèse gynécologique et le test de grossesse sont obligatoires. Après 40 ans, des signes d’alarme orientent vers une tumeur. L’examen clinique confirme ou infirme l’irritation péritonéale suggérée par l’anamnèse.</div>
</section>

<section class="ilot" id="k35-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen cherche une irritation péritonéale localisée et apprécie la gravité. Il commence par l’état général et les signes vitaux, car un sepsis change l’ordre des priorités. Chaque signe abdominal se compare au côté opposé et à un abdomen normal.</p>
<h3>6.1 État général et signes vitaux</h3>
<p>Le patient avec une appendicite simple reste souvent immobile, car tout mouvement réveille la douleur. Une température supérieure à 38,5 °C, une fréquence cardiaque élevée ou une hypotension évoquent une forme compliquée ou une autre cause. Le médecin applique les critères de sepsis du cours <a href="#/entry/A41">A41 — Sepsis</a> lorsqu’il existe une dysfonction d’organe.</p>
<h3>6.2 Examen abdominal : le normal d’abord</h3>
<p>L’abdomen normal est souple, dépressible et indolore ; la décompression brusque ne provoque aucune douleur. Le médecin palpe d’abord à distance de la zone douloureuse, puis termine par la fosse iliaque droite. Cette progression évite une défense réflexe généralisée qui masquerait la localisation.</p>
<div class="two">
<div class="card"><h4>Douleur provoquée au point de McBurney</h4><p>La pression au <button class="w" data-k="k35-mcburney">point de McBurney (repère, valeur)</button> réveille une douleur nette. Une douleur provoquée de la fosse iliaque droite était notée chez 69,6 % des patients de l’étude mondiale de la WSES ; son absence ne suffit donc pas à exclure le diagnostic.</p></div>
<div class="card"><h4>Défense et douleur à la décompression</h4><p>La <button class="w" data-k="k35-rebond">défense et le signe de Blumberg (technique, valeur)</button> traduisent l’irritation du péritoine pariétal. Leur intensité est graduée dans le score de réponse inflammatoire de l’appendicite.</p></div>
<div class="card"><h4>Signe de Rovsing</h4><p>La <button class="w" data-k="k35-rovsing">pression de la fosse iliaque gauche (signe de Rovsing)</button> provoque une douleur à droite. Le gaz refoulé vers le cæcum mobilise l’appendice enflammé.</p></div>
<div class="card"><h4>Signes du psoas et de l’obturateur</h4><p>Le <button class="w" data-k="k35-psoas">signe du psoas et celui de l’obturateur (positions de l’appendice)</button> orientent vers un appendice rétrocæcal ou pelvien. Leur sensibilité est faible ; leur absence n’exclut rien.</p></div>
<div class="card"><h4>Toucher rectal et examen gynécologique</h4><p>Le <button class="w" data-k="k35-toucher">toucher rectal et l’examen pelvien (indication, interprétation)</button> sont utiles devant une forme pelvienne et chez la femme. Une douleur à la mobilisation du col oriente vers une salpingite.</p></div>
<div class="card"><h4>Masse de la fosse iliaque droite</h4><p>Une masse sensible, mal limitée, après plus de trois jours de symptômes, évoque un <button class="w" data-k="k35-abces">plastron ou un abcès</button>. Elle impose une imagerie avant toute décision chirurgicale.</p></div></div>
<p>Ces signes se combinent. Aucun signe isolé n’a une valeur suffisante, ce qui justifie leur intégration dans un score. Chez le patient de l’îlot 0, la douleur au point de McBurney, la défense modérée et la douleur à la toux composent un tableau d’irritation péritonéale localisée.</p>
<div class="trap"><span class="k">Piège</span>Une défense généralisée, un ventre de bois ou une distension silencieuse signent une péritonite diffuse. Ce n’est plus le moment de chercher les signes fins de localisation : le patient relève de la réanimation et de la chirurgie urgente décrites à l’îlot 8.</div>
<div class="key"><b>À retenir.</b> L’examen commence par les signes vitaux, puis par l’abdomen normal, à distance de la zone douloureuse. La douleur au point de McBurney et la défense localisée sont les signes les plus utiles. Les signes du psoas et de l’obturateur orientent la position de l’appendice sans pouvoir exclure le diagnostic. La démarche diagnostique de l’îlot 7 intègre ces signes dans un score.</div>
<button class="pareto-btn ui" data-k="pareto-k35-clin">▲ Loi de Pareto — Définitions, mécanismes et clinique</button>
</section>

<section class="ilot" id="k35-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche répond à deux questions successives : la probabilité d’appendicite est-elle faible, intermédiaire ou élevée, et, si l’appendicite est probable, est-elle simple ou compliquée ? La WSES 2020 recommande une démarche individualisée selon l’âge, le sexe et la clinique (recommandation forte, niveau de preuve modéré, 1B). Elle recommande l’usage d’un score clinique pour exclure le diagnostic et repérer les patients à risque intermédiaire qui ont besoin d’une imagerie (1A).</p>
<h3>7.1 Examens biologiques de première ligne</h3>
<p>Le médecin demande une formule sanguine avec le pourcentage de neutrophiles, une protéine C-réactive, une bandelette urinaire et, chez toute femme en âge de procréer, un dosage de la gonadotrophine chorionique. Les recommandations suédoises ajoutent un ionogramme : il prépare l’anesthésie, et une hyponatrémie inférieure à 136 mmol/L est associée à une forme compliquée chez l’enfant. Les fiches d’interprétation figurent dans l’onglet Examens complémentaires.</p>
<h3>7.2 Scores cliniques</h3>
<p>Les scores combinent des éléments de l’anamnèse, de l’examen et de la biologie. Le <button class="w" data-k="k35-alvarado">score d’Alvarado (8 éléments, 10 points)</button> est le plus ancien et le plus cité. Le <button class="w" data-k="k35-air">score de réponse inflammatoire de l’appendicite (Appendicitis Inflammatory Response, 12 points)</button> et le <button class="w" data-k="k35-aas">score de l’appendicite de l’adulte (Adult Appendicitis Score)</button> sont les plus performants selon la WSES 2020, qui recommande leur emploi (1A). Le tableau ci-dessous détaille le score de réponse inflammatoire, que les recommandations suédoises placent en premier choix à tout âge.</p>
<table class="t"><tr><th>Élément</th><th>Points</th></tr>
<tr><td>Vomissements</td><td>1</td></tr>
<tr><td>Douleur de la fosse iliaque droite</td><td>1</td></tr>
<tr><td>Défense ou douleur à la décompression : légère, modérée, forte</td><td>1, 2 ou 3</td></tr>
<tr><td>Température ≥ 38,5 °C</td><td>1</td></tr>
<tr><td>Leucocytes 10 à 14,9 × 10⁹/L ; ≥ 15 × 10⁹/L</td><td>1 ; 2</td></tr>
<tr><td>Neutrophiles 70 à 84 % ; ≥ 85 %</td><td>1 ; 2</td></tr>
<tr><td>Protéine C-réactive 10 à 49 mg/L ; ≥ 50 mg/L</td><td>1 ; 2</td></tr>
<tr><td><b>Total</b> : 0 à 3 probabilité faible ; 4 à 8 intermédiaire ; 9 à 12 élevée</td><td>12</td></tr></table>
<p>La lecture se fait en deux temps. Le médecin additionne les points, puis place le patient dans l’une des trois zones, qui commandent chacune une conduite différente. Le patient de l’îlot 0 obtient 1 (vomissement) + 1 (douleur) + 2 (défense modérée) + 0 (38,0 °C) + 1 (leucocytes 13,8) + 1 (neutrophiles 82 %) + 1 (protéine C-réactive 38 mg/L), soit 7 : probabilité intermédiaire. L’erreur fréquente consiste à conclure à l’appendicite sur un score intermédiaire ; il appelle une observation active ou une imagerie. Les seuils exacts de chaque zone font l’objet d’une <button class="w" data-k="k35-air-seuils">variation entre la publication originale et la version suédoise</button>.</p>
<h3>7.3 Conduite selon la probabilité</h3>
<p>Une probabilité faible autorise un retour à domicile avec une réévaluation le lendemain, ou plus tôt si l’état s’aggrave. Une probabilité intermédiaire justifie une observation hospitalière avec un nouvel examen clinique et biologique après 4 à 8 heures, puis une imagerie si le doute persiste. Une probabilité élevée oriente vers la chirurgie. Chez un patient de moins de 40 ans à haut risque sur les trois scores (réponse inflammatoire 9 à 12, Alvarado 9 à 10, score de l’adulte ≥ 16), la WSES 2020 suggère que la tomodensitométrie peut être évitée avant la cœlioscopie (2B). Cette proposition n’a obtenu que 68 % d’accord au sein du panel, ce qui traduit un débat réel.</p>
<h3>7.4 Imagerie</h3>
<p>Lorsqu’une imagerie est indiquée, la WSES recommande l’<button class="w" data-k="k35-echo">échographie (signes, performances)</button> en première intention chez l’adulte et l’enfant (1B). Après une échographie négative ou non concluante, elle recommande une <button class="w" data-k="k35-tdm">tomodensitométrie à faible dose avec injection</button> plutôt qu’une tomodensitométrie à dose standard (1A). Cette stratégie conditionnelle réduit de moitié le nombre de tomodensitométries sans manquer davantage d’appendicites. Chez la femme enceinte, l’<button class="w" data-k="k35-irm">imagerie par résonance magnétique</button> vient après une échographie non concluante (2B).</p>

<p>L’algorithme se parcourt de haut en bas. La colonne de droite contient une exception importante : même avec une probabilité élevée, une imagerie reste indiquée après 40 ans, après plus de trois jours de symptômes ou devant une masse palpable. Ces trois situations font craindre un abcès, un plastron ou une tumeur, qui ne s’opèrent pas de la même manière. Pour le patient de l’îlot 0, score 7, le chemin passe par la colonne centrale : observation, nouvel examen, échographie.</p>
<h3>7.5 Diagnostic différentiel, hiérarchisé par gravité</h3>
<p>Le différentiel se classe d’abord selon la gravité, car un diagnostic grave manqué coûte plus qu’une appendicite retardée de quelques heures. Le tableau donne pour chaque diagnostic le critère qui le discrimine.</p>
<table class="t"><tr><th>Diagnostic</th><th>Gravité</th><th>Critère discriminant</th></tr>
<tr><td>Grossesse extra-utérine rompue</td><td>Menace vitale</td><td>Gonadotrophine chorionique positive, épanchement à l’échographie, choc</td></tr>
<tr><td>Torsion d’annexe</td><td>Menace d’organe</td><td>Douleur brutale, vomissements, masse annexielle à l’échographie</td></tr>
<tr><td>Ischémie mésentérique</td><td>Menace vitale</td><td>Sujet âgé, fibrillation atriale, douleur intense et examen pauvre, lactate</td></tr>
<tr><td>Diverticulite droite ou sigmoïdienne longue</td><td>Variable</td><td>Âge, tomodensitométrie</td></tr>
<tr><td>Salpingite, abcès tubo-ovarien</td><td>Variable</td><td>Douleur bilatérale, pertes, douleur à la mobilisation du col</td></tr>
<tr><td>Pyélonéphrite, colique néphrétique</td><td>Variable</td><td>Douleur lombaire, leucocyturie ou hématurie, fièvre élevée</td></tr>
<tr><td>Iléite de Crohn, iléite infectieuse</td><td>Modérée</td><td>Diarrhée, épaississement iléal à l’imagerie</td></tr>
<tr><td>Adénite mésentérique</td><td>Bénigne</td><td>Enfant, infection virale, ganglions et appendice normal à l’échographie</td></tr>
<tr><td>Gastro-entérite</td><td>Bénigne</td><td>Vomissements et diarrhée précédant la douleur, examen sans défense</td></tr></table>
<p>La colonne de gravité impose l’ordre de vérification. Chez une femme de 26 ans avec une douleur de la fosse iliaque droite, le premier geste est le dosage de la gonadotrophine chorionique, avant même le score. Le différentiel général d’une douleur abdominale aiguë est développé dans le cours <a href="#/entry/R10">R10 — Douleur abdominale (G-04-Gastroentérologie et hépatologie)</a>.</p>
<div class="quiz ui"><p>Une femme de 23 ans a une douleur de la fosse iliaque droite depuis 20 heures. Score de réponse inflammatoire : 6. Test de grossesse négatif. Quelle conduite est la plus adaptée ?</p><button data-ok="0">Appendicectomie cœlioscopique immédiate, car le score est supérieur à 4</button><button data-ok="1">Observation hospitalière avec nouvel examen et biologie après 4 à 8 heures, échographie et examen gynécologique si le doute persiste</button><button data-ok="0">Retour à domicile sans réévaluation</button><p class="fb" hidden>Un score de 4 à 8 situe la patiente dans la zone intermédiaire. Un score de 4 à 8 appelle, selon la WSES 2020, une imagerie systématique et rapide (2B) ; les recommandations suédoises proposent une observation active de 4 à 8 heures. Chez une femme jeune, les causes gynécologiques justifient un examen pelvien et une échographie.</p></div>
<button class="pareto-btn ui" data-k="pareto-k35-diag">▲ Loi de Pareto — Démarche diagnostique</button>
<div class="key"><b>À retenir.</b> Le score clinique trie les patients en trois zones de probabilité. La zone faible autorise une réévaluation différée, la zone intermédiaire impose observation ou imagerie, et la zone élevée oriente vers la chirurgie. L’échographie est l’imagerie de première intention ; la tomodensitométrie à faible dose et l’imagerie par résonance magnétique viennent en second recours. L’îlot 8 traite les situations où la gravité commande d’agir avant la fin du bilan.</div>
</section>
