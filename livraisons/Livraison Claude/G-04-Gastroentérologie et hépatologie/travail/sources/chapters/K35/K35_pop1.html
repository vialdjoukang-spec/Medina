
<!-- ===== FENÊTRES : notions cliniques et mécanismes ===== -->
<template data-pop="k35-anat" data-title="Anatomie de l’appendice">
<div class="lab">Définition</div><p>L’appendice vermiforme est un diverticule borgne du cæcum, long de 6 à 10 cm chez l’adulte. Sa base se trouve à la convergence des trois bandelettes longitudinales du côlon ; sa pointe peut être rétrocæcale, pelvienne, sous-cæcale, pré-iléale ou rétro-iléale.</p>
<div class="lab">Vascularisation et innervation</div><p>L’artère appendiculaire, branche de l’artère iléo-colique, est terminale. Les fibres viscérales rejoignent la moelle au dixième segment thoracique ; le péritoine pariétal voisin reçoit une innervation somatique segmentaire.</p>
<div class="lab">Conséquence clinique</div><p>La position de la pointe change la topographie de la douleur. L’artère terminale explique la gangrène. Le drainage lymphatique iléo-colique explique l’hémicolectomie droite pour certaines tumeurs.</p>
<div class="lab">Source</div><p>Onglet Sciences fondamentales, discipline Anatomie ; série d’autopsies de Wakeley (1933) pour la fréquence des positions.</p></template>

<template data-pop="k35-douleur" data-title="Douleur viscérale, douleur projetée et douleur pariétale">
<div class="lab">État normal</div><p>Un viscère creux n’est pas sensible à la coupure ; il est sensible à la distension et à l’ischémie. Ses fibres afférentes sont peu nombreuses et convergent sur des neurones médullaires qui reçoivent aussi des fibres cutanées.</p>
<div class="lab">Perturbation</div><p>La distension de l’appendice active les fibres viscérales qui rejoignent le dixième segment thoracique. Le cerveau attribue ce message à la peau péri-ombilicale, innervée par le même segment : c’est une douleur projetée, sourde et mal localisée, accompagnée de nausées. Quand l’inflammation atteint le péritoine pariétal, innervé par des nerfs somatiques précis, la douleur devient vive et localisée.</p>
<div class="lab">Conséquence clinique</div><p>La migration de la douleur de l’ombilic vers la fosse iliaque droite traduit le passage de l’atteinte viscérale à l’atteinte pariétale. Elle prend en général 12 à 24 heures.</p>
<div class="lab">Limite</div><p>Un appendice rétrocæcal ou pelvien ne touche pas la paroi antérieure ; la phase pariétale peut alors donner une douleur lombaire ou pelvienne.</p></template>

<template data-pop="k35-complique" data-title="Appendicite compliquée : définition opérationnelle">
<div class="lab">Définition</div><p>Appendicite avec gangrène, perforation, abcès péri-appendiculaire, plastron ou péritonite. La présence d’un stercolithe est classée tantôt comme facteur de forme compliquée, tantôt à part, selon les études.</p>
<div class="lab">Pourquoi la distinguer</div><p>La forme compliquée ne guérit pas par antibiotiques seuls lorsqu’elle comporte une gangrène ou une péritonite, car la paroi nécrosée n’est plus perfusée. Elle s’opère dans les heures qui suivent la réanimation et reçoit 2 à 3 jours d’antibiotiques après l’intervention (WSES 2025).</p>
<div class="lab">Signes d’alerte avant l’intervention</div><p>Fièvre ≥ 38,5 °C, symptômes depuis plus de 72 heures, défense diffuse, protéine C-réactive à trois chiffres, stercolithe, air extraluminal ou collection à l’imagerie.</p>
<div class="lab">Limite</div><p>La tomodensitométrie détecte mal la perforation ; aucun signe isolé ne prédit parfaitement la forme compliquée.</p></template>

<template data-pop="k35-stercolithe" data-title="Stercolithe (appendicolithe)">
<div class="lab">Définition</div><p>Concrétion de matières fécales, souvent calcifiée, dans la lumière de l’appendice. Codée K38.1 lorsqu’elle est isolée.</p>
<div class="lab">Mécanisme</div><p>Le stercolithe ferme la lumière et maintient l’obstruction, ce qui entretient l’hyperpression et l’ischémie. Les antibiotiques ne lèvent pas cet obstacle mécanique.</p>
<div class="lab">Preuves</div><p>Dans l’essai CODA, 41 % des patients avec stercolithe traités par antibiotiques ont été opérés à 90 jours, contre 25 % sans stercolithe ; leurs complications étaient de 20,2 pour 100 participants contre 3,6 sous appendicectomie. Chez l’enfant, l’échec du traitement antibiotique atteint 47 à 60 %.</p>
<div class="lab">Conséquence pratique</div><p>Un stercolithe visible à l’imagerie fait préférer l’appendicectomie. Un stercolithe découvert chez un sujet asymptomatique ne justifie pas d’intervention.</p></template>

<template data-pop="k35-wses-grade" data-title="Classification de gravité de la WSES">
<div class="lab">Principe</div><p>Classification proposée par la World Society of Emergency Surgery en 2015, fondée sur la clinique, l’imagerie et l’aspect opératoire. Elle vise une stratification homogène des patients et une conduite postopératoire adaptée à la gravité.</p>
<table class="t"><tr><th>Grade</th><th>Description</th><th>Fréquence dans l’étude mondiale (2018)</th></tr>
<tr><td>0</td><td>Appendice d’aspect normal</td><td>3,8 %</td></tr>
<tr><td>1</td><td>Appendice enflammé sans nécrose</td><td>50,4 %</td></tr>
<tr><td>2a</td><td>Nécrose segmentaire</td><td>16,8 %</td></tr>
<tr><td>2b</td><td>Nécrose de la base</td><td>3,4 %</td></tr>
<tr><td>3a</td><td>Plastron</td><td>8,8 %</td></tr>
<tr><td>3b</td><td>Abcès de moins de 5 cm sans air libre</td><td>4,8 %</td></tr>
<tr><td>3c</td><td>Abcès de plus de 5 cm sans air libre</td><td>1,9 %</td></tr>
<tr><td>4</td><td>Péritonite généralisée</td><td>10,0 %</td></tr></table>
<div class="lab">Valeur</div><p>Dans l’étude mondiale de 4282 patients, les grades 3c et 4 étaient des facteurs indépendants de décès. La WSES 2020 suggère l’adoption systématique d’une classification opératoire (2B).</p>
<div class="lab">Limite</div><p>Les descriptions détaillées de chaque grade proviennent de la publication de 2016, non relue intégralement pour ce cours ; les fréquences proviennent de l’étude de 2018, lue en texte intégral.</p></template>

<template data-pop="k35-deux-formes" data-title="Deux formes d’appendicite : arguments et limites">
<div class="lab">Hypothèse</div><p>L’appendicite simple et l’appendicite compliquée seraient deux évolutions différentes, et non deux stades successifs obligatoires.</p>
<div class="lab">Arguments</div><p>Pendant la pandémie de maladie à coronavirus 2019, les formes simples diagnostiquées ont diminué et les formes compliquées sont restées stables. Retarder l’intervention jusqu’à 24 heures après l’admission n’augmente pas les perforations. Dans les essais contre placebo, plus de 80 % des formes simples ont guéri sans antibiotique. Une plus grande utilisation de l’imagerie augmente le nombre de formes simples diagnostiquées, ce qui suggère que beaucoup régressaient auparavant sans diagnostic.</p>
<div class="lab">Limites</div><p>Ces données sont des associations, issues surtout d’études observationnelles. La progression d’une forme simple vers une forme compliquée reste possible chez un patient donné ; aucune méthode ne prédit avec certitude l’évolution.</p>
<div class="lab">Conséquence pratique</div><p>La forme compliquée est opérée sans délai ; la forme simple peut attendre jusqu’à 24 heures ou relever d’une décision partagée sur les antibiotiques.</p>
<div class="lab">Source</div><p>Recommandations nationales suédoises 2025, section histoire naturelle (texte intégral lu le 08.10.2026).</p></template>

<template data-pop="k35-migration" data-title="Migration de la douleur">
<div class="lab">Définition</div><p>Déplacement de la douleur de la région péri-ombilicale ou épigastrique vers la fosse iliaque droite, en quelques heures.</p>
<div class="lab">Mécanisme</div><p>Passage d’une douleur viscérale projetée à une douleur pariétale somatique quand le péritoine voisin s’enflamme.</p>
<div class="lab">Valeur</div><p>C’est l’un des éléments les plus évocateurs ; il compte un point dans le score d’Alvarado.</p>
<div class="lab">Piège</div><p>Elle manque souvent chez l’enfant, le sujet âgé et dans les positions rétrocæcale ou pelvienne. Son absence n’exclut pas le diagnostic.</p></template>

<template data-pop="k35-anorexie" data-title="Anorexie">
<div class="lab">Définition</div><p>Perte de l’appétit, souvent précoce, qui précède ou accompagne la douleur.</p>
<div class="lab">Mécanisme</div><p>La distension viscérale et les cytokines inflammatoires inhibent la motricité gastrique et la faim par voie réflexe et centrale.</p>
<div class="lab">Valeur et piège</div><p>Elle compte un point dans le score d’Alvarado. Un patient qui réclame à manger rend l’appendicite moins probable, mais ce signe isolé ne permet pas de l’exclure.</p></template>

<template data-pop="k35-mcburney" data-title="Point de McBurney">
<div class="lab">Repère</div><p>Point situé à la jonction du tiers latéral et des deux tiers médiaux de la ligne qui relie l’épine iliaque antéro-supérieure droite à l’ombilic. Il correspond approximativement à la base de l’appendice.</p>
<div class="lab">Technique</div><p>Le médecin appuie doucement avec deux doigts, après avoir palpé le reste de l’abdomen, et compare avec la fosse iliaque gauche.</p>
<div class="lab">Valeur</div><p>Une douleur provoquée de la fosse iliaque droite est le signe le plus fréquent ; elle était notée chez 69,6 % des patients de l’étude mondiale de la WSES.</p>
<div class="lab">Piège</div><p>La pointe de l’appendice, siège de l’inflammation, peut être éloignée de ce point ; une douleur maximale ailleurs n’exclut rien.</p></template>

<template data-pop="k35-rebond" data-title="Défense et douleur à la décompression (signe de Blumberg)">
<div class="lab">Technique</div><p>Le médecin enfonce lentement la main dans la fosse iliaque droite, puis la retire brusquement. Une douleur plus vive au relâchement qu’à l’appui est le signe de Blumberg. La défense est une contraction musculaire involontaire à la palpation.</p>
<div class="lab">Mécanisme</div><p>Le relâchement mobilise le péritoine pariétal enflammé, innervé de façon somatique. La défense est un réflexe de protection.</p>
<div class="lab">Valeur</div><p>Le score de réponse inflammatoire gradue cette réponse en légère (1 point), modérée (2) et forte (3). Chez l’enfant, la douleur provoquée par la toux, le saut ou la percussion explore le même mécanisme de façon moins pénible ; elle compte dans le score pédiatrique de Samuel.</p>
<div class="lab">Piège</div><p>Une défense généralisée signe une péritonite diffuse ; une défense absente chez le sujet âgé ou obèse n’exclut pas l’appendicite.</p></template>

<template data-pop="k35-rovsing" data-title="Signe de Rovsing">
<div class="lab">Technique</div><p>La pression de la fosse iliaque gauche provoque une douleur dans la fosse iliaque droite.</p>
<div class="lab">Mécanisme</div><p>La pression refoule le gaz colique vers le cæcum et mobilise le péritoine enflammé de la région appendiculaire.</p>
<div class="lab">Valeur et limite</div><p>Il traduit une irritation péritonéale droite, sans spécificité absolue. Sa sensibilité est faible : son absence n’a pas de valeur d’exclusion.</p></template>

<template data-pop="k35-psoas" data-title="Signes du psoas et de l’obturateur">
<div class="lab">Signe du psoas</div><p>Le patient couché sur le côté gauche ; l’extension passive de la hanche droite, ou la flexion contre résistance, réveille la douleur. Un appendice rétrocæcal au contact du muscle psoas l’explique.</p>
<div class="lab">Signe de l’obturateur</div><p>La rotation interne passive de la hanche droite fléchie réveille une douleur hypogastrique. Un appendice pelvien au contact du muscle obturateur interne l’explique.</p>
<div class="lab">Valeur</div><p>Ces signes orientent la position de l’appendice. Leur sensibilité est faible : leur absence n’exclut rien.</p>
<div class="lab">Piège</div><p>Un abcès du psoas ou une coxopathie donnent aussi un signe du psoas.</p></template>

<template data-pop="k35-toucher" data-title="Toucher rectal et examen pelvien">
<div class="lab">Indication</div><p>Suspicion d’appendice pelvien, femme en âge de procréer, doute diagnostique.</p>
<div class="lab">Interprétation</div><p>Une douleur latéralisée à droite au toucher rectal oriente vers un appendice pelvien ou un abcès du cul-de-sac. Une douleur à la mobilisation du col utérin, des pertes et une douleur bilatérale orientent vers une salpingite.</p>
<div class="lab">Limite</div><p>Le toucher rectal systématique n’ajoute pas d’information chez le patient typique ; il est réservé aux situations ci-dessus. L’examen gynécologique et l’échographie endovaginale relèvent du gynécologue en cas de doute.</p></template>

<template data-pop="k35-abces" data-title="Plastron et abcès appendiculaire">
<div class="lab">Définitions</div><p>Le plastron est une masse inflammatoire formée par l’appendice, l’épiploon et les anses accolées, sans collection. L’abcès est une collection purulente cloisonnée. Ils surviennent chez 2 à 7 % des patients.</p>
<div class="lab">Signes</div><p>Symptômes depuis plus de trois jours, masse sensible de la fosse iliaque droite, protéine C-réactive à trois chiffres. L’imagerie en coupes confirme et mesure la collection.</p>
<div class="lab">Conduite</div><p>Antibiotiques intraveineux pendant au moins 5 jours ; drainage percutané à discuter de 3 à 5 cm et systématique au-delà de 5 cm (recommandations suédoises 2025). La cœlioscopie d’emblée est une alternative en centre expert (WSES 2020, 2B), avec un risque de résection colique d’environ 10 % et d’appendicectomie incomplète d’environ 13 % dans l’essai de Mentula.</p>
<div class="lab">Après la guérison</div><p>Pas d’appendicectomie d’intervalle systématique avant 40 ans ; recherche de tumeur après 40 ans.</p></template>

<template data-pop="k35-pyle" data-title="Pyléphlébite (thrombophlébite septique portale)">
<div class="lab">Définition</div><p>Thrombose infectée de la veine porte ou de ses branches, secondaire à une infection du territoire mésentérique, dont l’appendicite et la diverticulite.</p>
<div class="lab">Mécanisme</div><p>Le sang veineux de l’appendice rejoint la veine mésentérique supérieure puis la veine porte. Une thrombophlébite locale peut s’étendre et emboliser des germes vers le foie.</p>
<div class="lab">Signes et conséquence</div><p>Fièvre élevée avec frissons, douleur de l’hypocondre droit, ictère, abcès hépatiques. Le diagnostic se fait par tomodensitométrie avec injection. Le traitement associe le contrôle de la source et une antibiothérapie prolongée ; l’anticoagulation se discute au cas par cas.</p>
<div class="lab">Limite</div><p>Complication rare ; aucune fréquence fiable n’est donnée par les sources consultées pour ce cours.</p></template>

<template data-pop="k35-moignon" data-title="Appendicite du moignon">
<div class="lab">Définition</div><p>Inflammation du segment d’appendice laissé en place après une appendicectomie.</p>
<div class="lab">Mécanisme</div><p>Un moignon long conserve une lumière qui peut s’obstruer comme un appendice entier. Les recommandations suédoises demandent un moignon de 0,5 cm au plus pour cette raison.</p>
<div class="lab">Conséquence pratique</div><p>Un antécédent d’appendicectomie n’exclut pas une appendicite. Devant une douleur typique, l’imagerie recherche un moignon enflammé.</p></template>

<template data-pop="k35-crp" data-title="Protéine C-réactive dans l’appendicite">
<div class="lab">Pourquoi la doser</div><p>Elle mesure la réponse inflammatoire hépatique induite par l’interleukine 6 et entre dans le score de réponse inflammatoire (1 point de 10 à 49 mg/L, 2 points à partir de 50 mg/L).</p>
<div class="lab">Comment l’interpréter</div><p>Valeur usuelle inférieure à 5 mg/L. Elle monte après 12 à 24 heures et culmine vers 48 heures. Une valeur normale après moins de 12 heures de symptômes n’exclut rien ; une valeur normale après plus de 12 heures rend l’appendicite moins probable. Une valeur à trois chiffres fait rechercher un abcès ou un plastron.</p>
<div class="lab">Comment agir</div><p>Une protéine C-réactive intermédiaire conduit à répéter l’examen et le dosage après 4 à 8 heures. Chez la femme enceinte, elle est toujours dosée (WSES 2020, 2C).</p>
<div class="lab">Limite</div><p>Elle n’est pas spécifique : salpingite, pyélonéphrite et iléite l’élèvent aussi.</p></template>

<template data-pop="k35-pct" data-title="Procalcitonine">
<div class="lab">Définition</div><p>Précurseur de la calcitonine, libéré par de nombreux tissus lors des infections bactériennes systémiques.</p>
<div class="lab">Valeur dans l’appendicite</div><p>Peu utile pour poser le diagnostic, mais plus performante pour la forme compliquée : sensibilité de 0,89 et spécificité de 0,90 dans une méta-analyse citée par la WSES 2020.</p>
<div class="lab">Conséquence pratique</div><p>Elle n’est pas demandée de routine ; elle peut aider à suspecter une forme compliquée lorsque l’imagerie est indisponible ou non concluante.</p></template>
