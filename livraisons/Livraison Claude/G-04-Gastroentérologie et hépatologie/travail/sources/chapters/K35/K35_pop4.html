
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-k35-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="k35-0,k35-1,k35-2,k35-3,k35-4,k35-5,k35-6"></p>
<ul>
<li>Certitude = histologie (neutrophiles dans la musculeuse) ; décision = tri simple ou compliquée (gangrène, perforation, abcès, plastron, péritonite).</li>
<li>Codes : K35.8 sans péritonite, K35.30 à K35.32 péritonite localisée ou abcès, K35.2 péritonite généralisée ; K36 chronique ou récidivante ; K37 sans précision ; K38 autres maladies.</li>
<li>Risque sur la vie environ 8 % ; pic 10 à 25 ans ; perforation 40 à 57 % chez le jeune enfant et 55 à 70 % après 50 ans ; décès lié aux comorbidités et aux grades WSES 3c et 4.</li>
<li>Chaîne : obstruction → distension (douleur péri-ombilicale projetée) → ischémie d’une artère terminale et invasion bactérienne → péritoine pariétal (douleur en fosse iliaque droite) → gangrène, perforation ou cloisonnement ; la forme simple peut régresser.</li>
<li>Stercolithe : perforation et échec des antibiotiques ; tumeur à rechercher après 40 ans.</li>
<li>Séquence douleur, migration, anorexie, vomissement ; formes rétrocæcale, pelvienne, enfant, sujet âgé, grossesse ; test de grossesse chez toute femme en âge de procréer.</li>
<li>Examen : signes vitaux d’abord ; douleur de la fosse iliaque droite, défense, décompression ; psoas et obturateur sans valeur d’exclusion ; masse après 3 jours = abcès ou plastron.</li>
</ul></template>

<template data-pop="pareto-k35-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="k35-7"></p>
<ul>
<li>Biologie : leucocytes, neutrophiles, protéine C-réactive, urines, gonadotrophine chorionique, ionogramme.</li>
<li>Score de réponse inflammatoire : 0 à 3 faible (réévaluation à 24 heures), 4 à 8 intermédiaire (observation 4 à 8 heures, puis imagerie), 9 à 12 élevée (chirurgie).</li>
<li>Imagerie même si score élevé : âge ≥ 40 ans, symptômes de plus de 3 jours, masse.</li>
<li>Échographie d’abord ; tomodensitométrie à faible dose avec injection si non concluante ; imagerie par résonance magnétique chez la femme enceinte.</li>
<li>Différentiel par gravité : grossesse extra-utérine, torsion d’annexe, ischémie mésentérique avant les causes bénignes.</li>
</ul></template>

<template data-pop="pareto-k35-ttt" data-title="Pareto — Urgences, traitement et suivi">
<p class="ratio" data-cover="k35-8,k35-9,k35-10"></p>
<ul>
<li>Délais : sepsis 2 heures ; forme compliquée 6 à 8 heures (enfant 8 heures) ; forme simple jusqu’à 24 heures après l’admission.</li>
<li>Analgésie précoce, opioïdes compris ; dose unique d’antibiotique 0 à 60 minutes avant l’incision.</li>
<li>Forme simple : cœlioscopie à trois trocarts, ligature simple, histologie systématique, aucun antibiotique après l’intervention.</li>
<li>Option antibiotique (WSES 2025) : forme simple prouvée, sans stercolithe, hors grossesse ; appendicectomie 29 % à 90 jours (CODA), 44,3 % à dix ans (APPAC).</li>
<li>Forme compliquée : aspiration sans lavage, pas de drain, 2 à 3 jours d’antibiotique si la source est contrôlée.</li>
<li>Abcès : antibiotiques au moins 5 jours, drainage au-delà de 3 à 5 cm, ou cœlioscopie experte ; pas d’appendicectomie d’intervalle systématique ; après 40 ans, coloscopie et tomodensitométrie à 6 à 8 semaines.</li>
<li>Fièvre après le troisième jour postopératoire : rechercher un abcès.</li>
</ul></template>

<template data-pop="pareto-k35-part" data-title="Pareto — Situations particulières, tumeurs et critères">
<p class="ratio" data-cover="k35-11,k35-12,k35-13"></p>
<ul>
<li>Enfant : échographie d’abord, pas de tomodensitométrie en première ligne ; échec des antibiotiques de 47 à 60 % avec stercolithe ; relais oral après 48 heures, moins de 7 jours.</li>
<li>Grossesse : biologie, échographie puis imagerie par résonance ; cœlioscopie préférée ; pas d’antibiotique seul ; appendicectomie négative 36 %.</li>
<li>Sujet âgé : imagerie presque toujours, tumeur 3 % ; cœlioscopie suggérée.</li>
<li>K38 : hyperplasie, concrétions, diverticule, fistule, invagination ; mucocèle = aspect qui peut cacher une néoplasie mucineuse, à enlever sans rupture.</li>
<li>Pas de critères officiels : score, imagerie, puis histologie comme seule certitude.</li>
</ul></template>

<template data-pop="pareto-k35-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="k35-e-1,k35-e-2,k35-e-3,k35-e-4,k35-e-5,k35-e-6,k35-e-7"></p>
<ul>
<li>Leucocytes en quelques heures ; protéine C-réactive après 12 à 24 heures, maximum à 48 heures ; neutrophiles plus informatifs que le total.</li>
<li>Échographie : appendice incompressible de plus de 6 mm ; non vu = non concluant.</li>
<li>Tomodensitométrie faible dose : sensibilité 0,95, spécificité 0,94 ; probabilité de 4 % après un examen négatif.</li>
<li>Imagerie par résonance pendant la grossesse : spécificité supérieure à 97 %, non-visualisation possible.</li>
<li>Histologie : neutrophiles dans la musculeuse ; péri-appendicite = cause voisine.</li>
<li>Biologie normale avant 12 heures : répéter ; protéine C-réactive à trois chiffres : rechercher un abcès ; abcès après 40 ans : coloscopie et tomodensitométrie.</li>
</ul></template>

<template data-pop="pareto-k35-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="k35-p-1,k35-p-2,k35-p-3,k35-p-4"></p>
<ul>
<li>Toujours couvrir entérobactéries et anaérobies : céfuroxime ou ceftriaxone avec métronidazole, ou amoxicilline et acide clavulanique.</li>
<li>Durées : dose unique (forme simple opérée), 2 à 3 jours (compliquée, source contrôlée), au moins 5 jours (abcès), 7 à 10 jours (option antibiotique).</li>
<li>Céfuroxime 1,5 g à l’induction ; métronidazole 15 mg/kg puis 7,5 mg/kg toutes les 6 heures, au plus 4 g par jour ; ceftriaxone 1 à 2 g par jour ; ertapénème 1 g par jour.</li>
<li>Paracétamol intraveineux au plus 4 g par jour et 2 jours ; métamizole au plus 5 g par jour ; morphine titrée.</li>
<li>Interactions : métronidazole avec alcool et antivitamines K ; ertapénème avec acide valproïque ; fluoroquinolones avec intervalle QT et corticostéroïdes.</li>
<li>Grossesse : métronidazole évité au premier trimestre, métamizole aux premier et troisième trimestres.</li>
</ul></template>
