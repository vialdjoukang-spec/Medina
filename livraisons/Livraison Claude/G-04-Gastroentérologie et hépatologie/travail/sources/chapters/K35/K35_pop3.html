
<!-- ===== FENÊTRES : situations particulières, K38, tumeurs et médicaments ===== -->
<template data-pop="k35-grossesse" data-title="Appendicite et grossesse">
<div class="lab">Fréquence</div><p>Environ un cas pour 1000 à 1500 grossesses ; première cause de chirurgie non obstétricale. L’incidence est plus basse qu’en dehors de la grossesse, surtout aux premier et troisième trimestres, puis augmente dans les semaines qui suivent l’accouchement (recommandations suédoises 2025).</p>
<div class="lab">Difficulté diagnostique</div><p>Nausées, vomissements et leucocytose modérée sont physiologiques. L’utérus refoule le cæcum : au troisième trimestre, la douleur peut siéger dans tout le flanc droit. Le score d’Alvarado est moins exact ; sa sensibilité est de 78,9 % et sa spécificité de 80 % au seuil de 7 points.</p>
<div class="lab">Risques fœtaux</div><p>La perforation et la péritonite exposent surtout à l’accouchement prématuré. Une appendicectomie négative expose aussi à un accouchement prématuré ; son taux atteint 36 % dans les données suédoises. Une appendicectomie avant 24 semaines n’a pas modifié le pronostic de la grossesse dans ces données ; plus tard, elle s’associe à un risque d’accouchement prématuré dans la semaine.</p>
<div class="lab">Conduite</div><p>Biologie et protéine C-réactive (2C) ; échographie (2C), puis imagerie par résonance magnétique (2B), puis, à défaut, tomodensitométrie à dose optimisée. Cœlioscopie préférée lorsque l’expertise existe (2B) : entrée ouverte, pression de 15 mmHg au plus, bascule latérale gauche après le premier trimestre ; voie ouverte souvent préférée au troisième trimestre. Obstétricien associé dès 22 semaines. Prophylaxie thromboembolique. Pas de traitement antibiotique seul (2C).</p>
<div class="lab">Limite</div><p>La méta-analyse qui associait la cœlioscopie à plus de pertes fœtales (rapport des cotes 1,72) dépendait d’une étude ; sans elle, la différence disparaissait (1,16).</p></template>

<template data-pop="k35-chronique" data-title="Appendicite chronique et récidivante (K36)">
<div class="lab">Définitions</div><p>L’appendicite récidivante désigne de nouveaux épisodes aigus, surtout après un traitement antibiotique réussi. L’appendicite chronique désigne des douleurs récurrentes ou persistantes de la fosse iliaque droite, avec à l’histologie une fibrose et une inflammation chronique.</p>
<div class="lab">Mécanisme proposé</div><p>Une obstruction partielle ou intermittente, par exemple par un stercolithe, entretiendrait une inflammation à bas bruit. Ce mécanisme reste discuté.</p>
<div class="lab">Conduite</div><p>La récidive après antibiotiques se traite le plus souvent par appendicectomie. L’appendicite chronique est un diagnostic d’exclusion : imagerie, exclusion d’une maladie de Crohn, d’une cause gynécologique ou urinaire, puis discussion d’une appendicectomie. Une série citée par la WSES a rapporté la disparition des symptômes après ablation d’appendices macroscopiquement normaux contenant des stercolithes.</p>
<div class="lab">Limite</div><p>Les preuves sont observationnelles ; aucun critère diagnostique consensuel de l’appendicite chronique n’existe.</p></template>

<template data-pop="k35-mucocele" data-title="Mucocèle appendiculaire">
<div class="lab">Définition</div><p>Dilatation de l’appendice par du mucus. Le terme décrit un aspect d’imagerie ou opératoire ; il ne préjuge pas de la cause, qui va de la simple rétention à la néoplasie mucineuse.</p>
<div class="lab">Signes</div><p>Découverte fortuite à l’imagerie, masse de la fosse iliaque droite, tableau d’appendicite, invagination. À l’imagerie : structure tubulaire ou kystique à contenu liquidien, parfois à paroi calcifiée. Un appendice dilaté d’au moins 15 mm fait partie des critères d’exclusion du traitement antibiotique dans l’essai finlandais APPAC IV.</p>
<div class="lab">Conduite</div><p>Exérèse complète sans rupture, avec la base et une marge contrôlée, puis examen histologique complet. Une rupture expose au pseudomyxome péritonéal. Une tumeur de haut grade ou une diffusion péritonéale relèvent d’un centre spécialisé des tumeurs péritonéales.</p>
<div class="lab">Codage</div><p>Une rétention simple relève de K38 ; une néoplasie relève du chapitre des tumeurs (C18, D12, D37).</p></template>

<template data-pop="k35-lamn" data-title="Néoplasie mucineuse appendiculaire de bas grade (LAMN)">
<div class="lab">Définition</div><p>Tumeur mucineuse de l’appendice avec atypies de bas grade, qui repousse la paroi sans l’infiltrer. Le consensus PSOGI de 2016 a adopté ce terme et a abandonné celui de cystadénome.</p>
<div class="lab">Classification PSOGI 2016</div><p>Néoplasie mucineuse de bas grade (LAMN) ; néoplasie mucineuse de haut grade (HAMN), sans invasion infiltrante mais avec atypies de haut grade ; adénocarcinome mucineux, réservé à l’invasion infiltrante ; polype festonné avec ou sans dysplasie, limité à la muqueuse.</p>
<div class="lab">Conséquence pratique</div><p>Le risque principal n’est pas l’invasion mais la dissémination péritonéale de mucus et de cellules après une rupture. Le compte rendu précise la marge et la présence de mucus ou de cellules hors de l’appendice.</p></template>

<template data-pop="k35-pmp" data-title="Pseudomyxome péritonéal">
<div class="lab">Définition</div><p>Accumulation intrapéritonéale de mucus due à une néoplasie mucineuse, le plus souvent appendiculaire, avec un phénomène de redistribution vers les zones déclives.</p>
<div class="lab">Classification PSOGI 2016</div><p>Bas grade, haut grade, haut grade avec cellules en bague à chaton ; le mucus acellulaire est classé à part.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement associe, dans des centres spécialisés, une chirurgie de cytoréduction complète et une chimiothérapie hyperthermique intrapéritonéale. Toute suspicion conduit à un avis spécialisé avant une chirurgie incomplète qui compromettrait le pronostic.</p></template>

<template data-pop="k35-tne" data-title="Tumeur neuroendocrine de l’appendice">
<div class="lab">Définition</div><p>Tumeur bien différenciée née des cellules neuroendocrines de l’appendice, souvent découverte sur une pièce d’appendicectomie.</p>
<div class="lab">Décision</div><p>La taille, le siège à la base, l’envahissement du méso-appendice, l’invasion vasculaire ou lymphatique, le grade et la marge déterminent si l’appendicectomie suffit ou si une hémicolectomie droite avec curage est nécessaire. Les seuils de taille utilisés figurent dans le guide de l’ENETS de 2023, dont seul le résumé a été lu pour ce cours ; la décision se prend en colloque d’oncologie.</p>
<div class="lab">Mécanisme</div><p>Le drainage lymphatique vers les ganglions iléo-coliques explique l’intérêt du curage en cas de facteurs de risque.</p></template>

<template data-pop="k35-d-cefuro" data-title="Céfuroxime">
<div class="lab">Mécanisme</div><p>Céphalosporine de deuxième génération ; inhibe la synthèse de la paroi bactérienne en se liant aux protéines liant la pénicilline. Active sur de nombreuses entérobactéries communautaires, inactive sur les anaérobies et les entérocoques, d’où l’association au métronidazole.</p>
<div class="lab">Posologie suisse (Zinacef 1,5 g)</div><p>Prophylaxie digestive : 1,5 g par voie intraveineuse à l’induction, éventuellement 750 mg 8 et 16 heures plus tard. Infection intra-abdominale : 750 mg toutes les 8 heures ; infection grave : 1,5 g toutes les 8 heures. Enfant de 3 semaines à 12 ans et moins de 40 kg : 30 à 100 mg/kg par jour en 3 à 4 doses.</p>
<div class="lab">Preuve</div><p>Dans la surveillance suisse de l’enfant (2014–2018), l’association céfuroxime et métronidazole était liée à moins d’infections du site opératoire que l’amoxicilline et acide clavulanique (1,1 % contre 2,8 % ; rapport des cotes ajusté 0,35). Étude observationnelle : causalité non démontrée.</p>
<div class="lab">Précautions</div><p>Allergie aux bêtalactamines ; adaptation en insuffisance rénale selon l’information professionnelle complète ; le résumé suisse mentionne l’allaitement parmi les restrictions.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Zinacef 1,5 g, consultée le 08.10.2026 (résumé du produit).</p></template>

<template data-pop="k35-d-metro" data-title="Métronidazole">
<div class="lab">Mécanisme</div><p>Nitro-imidazolé réduit dans les bactéries anaérobies en dérivés qui cassent l’ADN. Cette activation exige un métabolisme anaérobie : le métronidazole est inactif sur les aérobies et s’associe toujours à une autre molécule.</p>
<div class="lab">Posologie suisse</div><p>Perfusion (500 mg/100 mL) : 15 mg/kg puis 7,5 mg/kg toutes les 6 heures pendant 3 jours, puis toutes les 12 heures ; maximum 4 g par jour. Prophylaxie : 15 mg/kg en 30 à 60 minutes, terminés 1 heure avant l’intervention. Voie orale (Flagyl 500 mg) : 500 mg trois fois par jour dans les infections à anaérobies.</p>
<div class="lab">Contre-indications et précautions</div><p>Syndrome de Cockayne ; grossesse au premier trimestre ; allaitement suspendu jusqu’à 2 à 3 jours après la forme intraveineuse et 24 heures après la forme orale. Alcool proscrit. Potentialisation des antivitamines K.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Metronidazole Sintetica 500 mg/100 mL et Flagyl 500 mg, consultée le 08.10.2026 (résumés des produits).</p></template>

<template data-pop="k35-d-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération à longue demi-vie, ce qui permet une seule dose par jour. Active sur les entérobactéries communautaires, inactive sur les anaérobies et les entérocoques.</p>
<div class="lab">Posologie suisse (Rocephin 2 g)</div><p>Adulte et enfant de plus de 12 ans ou de plus de 50 kg : 1 à 2 g une fois par jour, jusqu’à 4 g ; perfusion d’au moins 30 minutes. Prophylaxie : 1 à 2 g en dose unique 30 à 90 minutes avant l’intervention. Enfant de 15 jours à 12 ans : 20 à 80 mg/kg une fois par jour.</p>
<div class="lab">Contre-indications</div><p>Association à des solutions calciques intraveineuses et hyperbilirubinémie chez le nouveau-né ; prématuré d’âge post-menstruel inférieur à 41 semaines. Le résumé suisse mentionne aussi l’allaitement ; le texte intégral en précise les conditions. Une encéphalopathie a été ajoutée aux effets indésirables en 2021.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Rocephin 2 g i.v., consultée le 08.10.2026 (résumé du produit).</p></template>

<template data-pop="k35-d-coamox" data-title="Amoxicilline et acide clavulanique">
<div class="lab">Mécanisme</div><p>L’amoxicilline inhibe la synthèse de la paroi ; l’acide clavulanique bloque de nombreuses bêtalactamases, ce qui étend le spectre aux anaérobies et à une partie des entérobactéries productrices de pénicillinase.</p>
<div class="lab">Posologie suisse (Co-Amoxi-Mepha 1,2 g et 2,2 g)</div><p>Adulte et enfant de 40 kg ou plus : infection modérée, 1,2 g trois à quatre fois par jour en injection lente ; infection grave, 2,2 g trois à quatre fois par jour, jusqu’à six fois, en perfusion d’au moins 30 minutes. La prophylaxie en chirurgie abdominale figure parmi les indications.</p>
<div class="lab">Contre-indications et risques</div><p>Ictère ou atteinte hépatique lors d’un traitement antérieur, mononucléose, leucémie lymphatique ; restrictions pendant la grossesse et l’allaitement selon l’information professionnelle. Cholestase parfois retardée. Avertissements récents : syndrome d’entérocolite médicamenteuse (2024) et lymphohistiocytose hémophagocytaire (2026).</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Co-Amoxi-Mepha 2200 mg i.v., consultée le 08.10.2026 (résumé du produit et rubrique des nouveautés).</p></template>

<template data-pop="k35-d-pipt" data-title="Pipéracilline et tazobactam">
<div class="lab">Mécanisme</div><p>Uréidopénicilline à large spectre associée à un inhibiteur de bêtalactamase ; couvre les entérobactéries, <i>Pseudomonas aeruginosa</i>, les entérocoques sensibles à l’ampicilline et les anaérobies.</p>
<div class="lab">Place</div><p>Péritonite grave, sepsis, infection associée aux soins. Son usage dans une appendicite communautaire simple sélectionne inutilement des résistances.</p>
<div class="lab">Posologie</div><p>Adulte : 2 à 4 g de pipéracilline trois (à quatre) fois par jour en perfusion de 30 minutes (résumé suisse, Piperacillin/Tazobactam Sandoz 4,5 g). Insuffisance rénale (information européenne) : clairance de 20 à 40 mL/min, 4,5 g toutes les 8 heures au plus ; moins de 20 mL/min, toutes les 12 heures.</p>
<div class="lab">Sources</div><p>Information professionnelle suisse, compendium.ch, Piperacillin/Tazobactam Sandoz 4,5 g, consultée le 08.10.2026 ; Agence européenne des médicaments, Tazocin, annexe III de l’arbitrage, consultée le 08.10.2026.</p></template>

<template data-pop="k35-d-erta" data-title="Ertapénème">
<div class="lab">Mécanisme</div><p>Carbapénème stable vis-à-vis des bêtalactamases à spectre étendu ; actif sur les entérobactéries et les anaérobies, inactif sur <i>Pseudomonas aeruginosa</i> et les entérocoques. Sa demi-vie permet une dose par jour.</p>
<div class="lab">Preuve</div><p>Molécule intraveineuse de l’essai APPAC (1 g par jour pendant 3 jours, puis relais oral).</p>
<div class="lab">Posologie suisse (Invanz 1 g)</div><p>Plus de 13 ans : 1 g une fois par jour en perfusion de 30 minutes, pendant 3 à 14 jours. De 3 mois à 13 ans : 15 mg/kg deux fois par jour, au plus 500 mg deux fois par jour.</p>
<div class="lab">Précautions</div><p>Information européenne : non recommandé si la clairance est de 30 mL/min/1,73 m² ou moins, ni en hémodialyse ; association à l’acide valproïque déconseillée. Le résumé suisse mentionne l’allaitement parmi les restrictions. Réserver aux situations qui le justifient, pour épargner les carbapénèmes.</p>
<div class="lab">Sources</div><p>Information professionnelle suisse, compendium.ch, Invanz 1 g, consultée le 08.10.2026 ; Agence européenne des médicaments, Invanz, information sur le produit, consultée le 08.10.2026.</p></template>

<template data-pop="k35-d-fq" data-title="Fluoroquinolones (lévofloxacine, moxifloxacine, ciprofloxacine)">
<div class="lab">Mécanisme</div><p>Inhibition de l’ADN gyrase et de la topo-isomérase IV ; bonne biodisponibilité orale.</p>
<div class="lab">Place</div><p>Relais oral des essais finlandais (lévofloxacine 500 mg une fois par jour avec métronidazole 500 mg trois fois par jour ; moxifloxacine 400 mg par jour dans APPAC II). Alternative en cas d’allergie grave aux bêtalactamines, en association au métronidazole pour la ciprofloxacine (schémas de la WSES 2017).</p>
<div class="lab">Risques</div><p>Tendinopathies et ruptures tendineuses, surtout avec les corticostéroïdes et chez le sujet âgé ; allongement de l’intervalle QT ; troubles glycémiques ; effets neuropsychiatriques. Les autorités européennes en ont restreint l’usage en 2019 pour ces raisons. Leur emploi dans une appendicite doit donc être motivé.</p>
<div class="lab">Limite</div><p>Les monographies suisses de ces molécules n’ont pas été relues pour ce cours ; les doses citées sont celles des essais.</p></template>

<template data-pop="k35-d-para" data-title="Paracétamol intraveineux">
<div class="lab">Mécanisme</div><p>Analgésique et antipyrétique d’action centrale, sans effet anti-inflammatoire périphérique notable ni effet sur l’hémostase.</p>
<div class="lab">Posologie suisse (solution 1 g/100 mL)</div><p>Plus de 50 kg : 1 g jusqu’à quatre fois par jour, au moins 4 heures d’intervalle, au plus 4 g par jour ; voie intraveineuse limitée à 2 jours. De 33 à 50 kg : 15 mg/kg jusqu’à quatre fois par jour, au plus 60 mg/kg par jour.</p>
<div class="lab">Contre-indications</div><p>Insuffisance hépatique grave, hépatite aiguë, maladie hépatique décompensée, clairance inférieure à 10 mL/min, déficit en glucose-6-phosphate déshydrogénase, maladie de Gilbert (Meulengracht), enfant de moins de 2 mois.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Paracetamol Sintetica 1 g/100 mL, consultée le 08.10.2026 (résumé du produit).</p></template>

<template data-pop="k35-d-metam" data-title="Métamizole">
<div class="lab">Mécanisme</div><p>Analgésique et antipyrétique non opioïde, avec un effet spasmolytique ; mécanisme central et périphérique incomplètement élucidé.</p>
<div class="lab">Posologie suisse (Novalgin 1 g/2 mL)</div><p>Adulte : 1 à 2 mL (0,5 à 1 g) par voie intraveineuse lente ou intramusculaire, à répéter toutes les 6 à 8 heures ; au plus 5 mL (2,5 g) par dose et 10 mL (5 g) par jour ; débit intraveineux de 500 mg par minute au plus.</p>
<div class="lab">Contre-indications</div><p>Antécédent d’agranulocytose aux pyrazolones, troubles de l’hématopoïèse, porphyrie hépatique, déficit en glucose-6-phosphate déshydrogénase, circulation instable, hypotension ; premier et troisième trimestres de grossesse ; allaitement jusqu’à 48 heures après la dernière dose.</p>
<div class="lab">Surveillance</div><p>L’agranulocytose est rare mais grave : fièvre, angine ou ulcération buccale imposent l’arrêt et une formule sanguine. L’injection rapide peut provoquer une hypotension.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Novalgin 1 g/2 mL, consultée le 08.10.2026 (résumé du produit).</p></template>

<template data-pop="k35-d-morph" data-title="Morphine">
<div class="lab">Mécanisme</div><p>Agoniste des récepteurs opioïdes mu ; diminue la transmission médullaire et la perception centrale de la douleur.</p>
<div class="lab">Preuve dans l’abdomen aigu</div><p>Revue Cochrane de 2011 : l’analgésie opioïde ne fausse ni le diagnostic ni la décision opératoire.</p>
<div class="lab">Posologie suisse (solution 10 mg/mL)</div><p>Douleur aiguë de l’adulte : 2 à 10 mg par voie intraveineuse, ou 5 à 20 mg par voie intramusculaire ou sous-cutanée toutes les 4 à 6 heures ; analgésie autocontrôlée, bolus de 1 à 1,5 mg avec un intervalle de 5 à 15 minutes. Enfant : 0,05 à 0,1 mg/kg en injection intraveineuse lente.</p>
<div class="lab">Surveillance</div><p>Vigilance, fréquence respiratoire, nausées, rétention urinaire, constipation. Prudence avec les sédatifs. Restrictions pendant la grossesse et l’allaitement selon l’information professionnelle.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Morphin Amino 10 mg/mL (chlorhydrate de morphine), consultée le 08.10.2026 (résumé du produit).</p></template>
