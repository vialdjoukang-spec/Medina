
<!-- ===== FENÊTRES : scores, imagerie, essais et contentieux ===== -->
<template data-pop="k35-alvarado" data-title="Score d’Alvarado">
<div class="lab">Composition (10 points)</div><table class="t"><tr><th>Élément</th><th>Points</th></tr>
<tr><td>Migration de la douleur vers la fosse iliaque droite</td><td>1</td></tr><tr><td>Anorexie</td><td>1</td></tr><tr><td>Nausées ou vomissements</td><td>1</td></tr>
<tr><td>Douleur provoquée de la fosse iliaque droite</td><td>2</td></tr><tr><td>Douleur à la décompression</td><td>1</td></tr><tr><td>Température élevée (seuil de 37,3 °C dans la publication originale)</td><td>1</td></tr>
<tr><td>Leucocytose supérieure à 10 × 10⁹/L</td><td>2</td></tr><tr><td>Déviation à gauche (neutrophiles supérieurs à 75 %)</td><td>1</td></tr></table>
<div class="lab">Valeur</div><p>Un score inférieur à 5 exclut l’appendicite avec une sensibilité de 99 % selon la WSES 2020. Le score est en revanche trop peu spécifique pour confirmer le diagnostic : la WSES suggère de ne pas l’utiliser pour cela (2B). Il ne distingue pas forme simple et forme compliquée chez le sujet âgé et il est moins sensible chez les personnes vivant avec le VIH.</p>
<div class="lab">Aide mnémotechnique</div><p>L’acronyme anglais MANTRELS reprend les huit éléments (Migration, Anorexia, Nausea, Tenderness, Rebound, Elevated temperature, Leukocytosis, Shift).</p><p class="small">Aide pédagogique, non critère officiel.</p>
<div class="lab">Source</div><p>Alvarado A., Annals of Emergency Medicine 1986 (publication originale, non relue pour ce cours) ; performances : WSES 2020, texte intégral lu le 08.10.2026.</p></template>

<template data-pop="k35-air" data-title="Score de réponse inflammatoire de l’appendicite">
<div class="lab">Définition</div><p>Score suédois publié par Andersson en 2008 (Appendicitis Inflammatory Response), sur 12 points : vomissements, douleur de la fosse iliaque droite, défense graduée en trois niveaux, température ≥ 38,5 °C, leucocytes, pourcentage de neutrophiles et protéine C-réactive, chacun gradué. Le détail figure dans l’îlot 7 de l’onglet Pathologie.</p>
<div class="lab">Pourquoi il est préféré</div><p>Il gradue l’intensité de la réponse inflammatoire au lieu de la noter en tout ou rien. Il inclut la protéine C-réactive. Dans une revue de validations, il a obtenu la meilleure combinaison de sensibilité (92 %) et de spécificité (63 %). Les recommandations suédoises de 2025 le placent en premier choix à tout âge.</p>
<div class="lab">Effet démontré</div><p>Dans un essai randomisé, un algorithme fondé sur ce score a réduit chez les patients à faible risque l’imagerie (19,2 % contre 34,5 %), les hospitalisations (29,5 % contre 42,8 %) et les explorations négatives (1,6 % contre 3,2 %).</p>
<div class="lab">Valeurs prédictives</div><p>Au-dessus de 8, la valeur prédictive positive est de 86 %, et de 96 % chez l’enfant de moins de 15 ans. Au-dessous de 4, la valeur prédictive négative pour une forme compliquée est de 99 % (recommandations suédoises 2025).</p></template>

<template data-pop="k35-air-seuils" data-title="Seuils du score de réponse inflammatoire : source retenue">
<div class="lab">Le contentieux</div><p>La publication originale d’Andersson (2008), utilisée dans l’étude mondiale de la WSES (2018), place la probabilité faible de 0 à 4, intermédiaire de 5 à 8 et élevée de 9 à 12 ; la WSES 2020 reprend la zone élevée de 9 à 12. Les recommandations nationales suédoises de 2025 placent la probabilité faible au-dessous de 4, intermédiaire de 4 à 8 et élevée au-dessus de 8.</p>
<div class="lab">Portée de la différence</div><p>Seul le score de 4 change de zone : il est faible dans la version originale et intermédiaire dans la version suédoise. Les zones élevées sont identiques (9 à 12).</p>
<div class="lab">Source retenue</div><p>Le cours retient les seuils suédois de 2025, source primaire la plus récente lue en texte intégral et applicable à une population européenne adulte et pédiatrique : <b>0 à 3 faible, 4 à 8 intermédiaire, 9 à 12 élevée</b>. Ce choix classe un score de 4 dans la zone où l’observation est requise, ce qui est la conduite la plus prudente. La WSES 2025 n’a pu être lue qu’en résumé ; ses seuils éventuels n’ont pas été vérifiés.</p>
<div class="lab">Accès aux textes</div><p>Recommandations suédoises 2025 : <a href="https://doi.org/10.1093/bjsopen/zrae165">doi 10.1093/bjsopen/zrae165</a>. WSES 2020 : <a href="https://doi.org/10.1186/s13017-020-00306-3">doi 10.1186/s13017-020-00306-3</a>.</p></template>

<template data-pop="k35-aas" data-title="Score de l’appendicite de l’adulte">
<div class="lab">Définition</div><p>Score finlandais (Adult Appendicitis Score) qui combine la douleur de la fosse iliaque droite, sa migration, la douleur provoquée (pondérée différemment chez la femme de 16 à 49 ans), la défense, les leucocytes, le pourcentage de neutrophiles et la protéine C-réactive pondérée selon la durée des symptômes.</p>
<div class="lab">Seuils</div><p>Au-dessous de 11 : probabilité faible ; de 11 à 15 : intermédiaire ; 16 ou plus : élevée.</p>
<div class="lab">Valeur</div><p>Dans l’étude de développement (829 adultes), 58 % des appendicites avaient un score d’au moins 16, avec une spécificité de 93 %. Seules 4 % des appendicites avaient un score inférieur à 11, et aucune n’était compliquée. Dans une étude britannique de 5345 patients, il a été le meilleur score chez la femme.</p>
<div class="lab">Source</div><p>WSES 2020, texte intégral lu le 08.10.2026 ; la pondération détaillée de chaque élément figure dans la publication originale de Sammalkorpi (2014), non reproduite ici.</p></template>

<template data-pop="k35-pas" data-title="Score pédiatrique de Samuel">
<div class="lab">Définition</div><p>Score pédiatrique sur 10 points (Pediatric Appendicitis Score, Samuel 2002). Il reprend des éléments proches du score d’Alvarado et ajoute un signe propre à l’enfant : la douleur de la fosse iliaque droite à la toux, au saut ou à la percussion.</p>
<div class="lab">Valeur</div><p>Il aide à exclure l’appendicite, mais la WSES suggère de ne pas poser le diagnostic sur un score seul chez l’enfant (2C). Une revue systématique lui attribue un surdiagnostic d’environ 35 %. Le score de réponse inflammatoire a montré un meilleur pouvoir discriminant chez l’enfant dans une étude de 747 enfants.</p>
<div class="lab">Piège</div><p>Chez l’enfant d’âge préscolaire, les scores sont plus bas à gravité égale, alors que la perforation est plus fréquente.</p></template>

<template data-pop="k35-echo" data-title="Échographie de l’appendice">
<div class="lab">Technique</div><p>Compression graduée de la fosse iliaque droite avec une sonde linéaire, pour écarter les anses et le gaz. Le doppler couleur étudie la vascularisation de la paroi.</p>
<div class="lab">Normal</div><p>Structure tubulaire borgne, compressible, de 6 mm ou moins de diamètre externe.</p>
<div class="lab">Pathologique</div><p>Appendice incompressible de plus de 6 mm, paroi hypervascularisée, graisse voisine hyperéchogène ; stercolithe hyperéchogène avec cône d’ombre ; collection ou interruption pariétale dans la forme compliquée.</p>
<div class="lab">Performances</div><p>Sensibilité 76 % et spécificité 95 % (WSES 2020) ; 91 % et 97 % pour l’échographie au lit faite par un clinicien entraîné.</p>
<div class="lab">Piège</div><p>Un appendice non vu ne signifie pas un appendice normal. L’examen dépend de l’opérateur, de l’obésité et de la position rétrocæcale.</p></template>

<template data-pop="k35-tdm" data-title="Tomodensitométrie à faible dose avec injection">
<div class="lab">Indication</div><p>Adulte à probabilité intermédiaire dont l’échographie est négative ou non concluante ; suspicion de forme compliquée ; âge ≥ 40 ans ou masse.</p>
<div class="lab">Signes</div><p>Appendice de plus de 6 mm à paroi épaissie et rehaussée, infiltration de la graisse, stercolithe ; air extraluminal, collection et défaut de rehaussement pariétal dans la forme compliquée.</p>
<div class="lab">Performances</div><p>Sensibilité 0,95 et spécificité 0,94 (revue Cochrane de 64 études). La faible dose est aussi exacte que la dose standard (WSES 2020, 1A), avec 3,33 contre 4,44 millisieverts dans l’essai comparatif finlandais.</p>
<div class="lab">Limite</div><p>Elle détecte mal la perforation et expose aux rayonnements et au produit de contraste iodé. Elle n’est pas l’imagerie de première intention chez l’enfant (2B).</p></template>

<template data-pop="k35-irm" data-title="Imagerie par résonance magnétique de l’appendice">
<div class="lab">Indication</div><p>Femme enceinte après une échographie non concluante (WSES 2020, 2B) ; enfant en seconde intention selon les ressources locales.</p>
<div class="lab">Signes</div><p>Appendice dilaté à paroi épaissie, hypersignal de la paroi et de la graisse voisine sur les séquences pondérées en T2, stercolithe en hyposignal.</p>
<div class="lab">Performances</div><p>Pendant la grossesse : sensibilité 90,5 à 94 %, spécificité 97 à 98,6 % selon trois méta-analyses.</p>
<div class="lab">Limite</div><p>Non-visualisation de l’appendice dans 30 à 43 % des cas dans certaines séries, surtout au troisième trimestre ; disponibilité réduite en urgence. Un examen non concluant n’exclut pas l’appendicite.</p></template>

<template data-pop="k35-histo" data-title="Examen histologique de la pièce d’appendicectomie">
<div class="lab">Pourquoi</div><p>C’est la seule preuve de l’appendicite et le seul moyen de découvrir une tumeur inattendue. La WSES le recommande de façon systématique (1B).</p>
<div class="lab">Critère</div><p>Infiltration de la musculeuse par des polynucléaires neutrophiles. Une inflammation limitée à la séreuse est une péri-appendicite, d’origine voisine.</p>
<div class="lab">Ce que le médecin en fait</div><p>Il lit le compte rendu. Une tumeur conduit à un colloque d’oncologie ; une péri-appendicite conduit à rechercher une salpingite ou une iléite.</p>
<div class="lab">Limite</div><p>Le chirurgien et le pathologiste divergent dans 12,5 % des cas ; l’aspect macroscopique ne remplace pas l’histologie.</p></template>

<template data-pop="k35-coda" data-title="Essai CODA (2020)">
<div class="lab">Question</div><p>Le traitement antibiotique est-il non inférieur à l’appendicectomie pour la qualité de vie à 30 jours chez l’adulte atteint d’appendicite confirmée par l’imagerie ?</p>
<div class="lab">Méthode</div><p>Essai pragmatique randomisé, non aveugle, de non-infériorité, dans 25 centres des États-Unis ; 1552 adultes, dont 414 avec un stercolithe. Antibiotiques pendant 10 jours ; 47 % des patients du groupe antibiotique n’ont pas été hospitalisés ; 96 % des appendicectomies ont été faites par cœlioscopie.</p>
<div class="lab">Résultats</div><p>Non-infériorité sur le questionnaire de qualité de vie à 30 jours. Appendicectomie à 90 jours dans le groupe antibiotique : 29 % (41 % avec stercolithe, 25 % sans). Complications : 8,1 contre 3,5 pour 100 participants, excès concentré chez les porteurs d’un stercolithe (20,2 contre 3,6).</p>
<div class="lab">Portée et limites</div><p>Population américaine adulte, diagnostic par l’imagerie. L’essai ne compare pas l’antibiotique au placebo et ne dit pas si la guérison est due à l’antibiotique.</p>
<div class="lab">Source</div><p>New England Journal of Medicine 2020;383:1907–1919 (résumé lu le 08.10.2026).</p></template>

<template data-pop="k35-appac" data-title="Essai APPAC et suivi à dix ans">
<div class="lab">Méthode</div><p>Essai finlandais randomisé de 530 adultes de 18 à 60 ans avec une appendicite simple confirmée par tomodensitométrie, entre 2009 et 2012. Appendicectomie ouverte contre ertapénème intraveineux 1 g par jour pendant 3 jours, puis lévofloxacine 500 mg une fois par jour et métronidazole 500 mg trois fois par jour pendant 7 jours.</p>
<div class="lab">Résultats</div><p>À un an, 27,3 % des patients du groupe antibiotique avaient été opérés ; à cinq ans, la récidive atteignait 39,1 %. À dix ans, la récidive vraie était de 37,8 % et l’appendicectomie cumulée de 44,3 %. Les complications cumulées à dix ans étaient de 27,4 % dans le groupe opéré et de 8,5 % dans le groupe antibiotique. La qualité de vie ne différait pas.</p>
<div class="lab">Limites</div><p>Le groupe opéré a eu une appendicectomie ouverte, ce qui majore ses complications par rapport à la cœlioscopie actuelle. Les patients avec stercolithe étaient exclus.</p>
<div class="lab">Source</div><p>JAMA 2015 et 2018 (résultats cités par la WSES 2020) ; suivi à dix ans : JAMA 2026, doi 10.1001/jama.2025.25921 (résumé lu le 08.10.2026).</p></template>

<template data-pop="k35-appac2" data-title="Essai APPAC II : antibiotique oral seul">
<div class="lab">Méthode</div><p>599 adultes avec une appendicite simple confirmée par tomodensitométrie : moxifloxacine orale 400 mg par jour pendant 7 jours, contre ertapénème intraveineux 1 g par jour pendant 2 jours puis lévofloxacine et métronidazole oraux pendant 5 jours.</p>
<div class="lab">Résultats</div><p>Succès à un an : 70,2 % sous traitement oral contre 73,8 % sous traitement intraveineux puis oral ; la non-infériorité n’a pas été démontrée. À trois ans : 63,4 % contre 65,2 %.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement oral d’emblée n’est pas validé comme équivalent ; la WSES 2020 recommande de commencer par voie intraveineuse (1B).</p>
<div class="lab">Source</div><p>JAMA 2021, doi 10.1001/jama.2020.23525 ; JAMA Surgery 2024 (résumés lus le 08.10.2026).</p></template>

<template data-pop="k35-appac3" data-title="Essai APPAC III : antibiotique contre placebo">
<div class="lab">Méthode</div><p>Essai randomisé en double aveugle de supériorité : antibiotiques contre placebo chez 72 adultes avec une appendicite simple confirmée par tomodensitométrie.</p>
<div class="lab">Résultats</div><p>Succès à 10 jours : 97 % sous antibiotiques et 87 % sous placebo ; la différence n’est pas statistiquement significative.</p>
<div class="lab">Limites</div><p>L’effectif n’a atteint que le plus petit des scénarios prévus, faute de recrutement. L’essai ne démontre pas l’équivalence du placebo ; il justifie un essai de non-infériorité, l’essai APPAC IV en cours.</p>
<div class="lab">Source</div><p>British Journal of Surgery 2022, doi 10.1093/bjs/znac086 (résumé lu le 08.10.2026).</p></template>

<template data-pop="k35-nom-contentieux" data-title="Traitement antibiotique de l’appendicite simple : source retenue">
<div class="lab">Le contentieux</div><p>La WSES (2020, confirmée en 2025) considère le traitement antibiotique comme une option sûre et efficace chez des patients sélectionnés. Les recommandations nationales suédoises de 2025 ne le recommandent pas, parce que deux essais contre placebo n’ont pas montré la supériorité de l’antibiotique sur le traitement symptomatique.</p>
<div class="lab">Source retenue</div><p>La WSES 2025, publiée le 28.01.2026 dans JAMA Surgery, est la source primaire applicable la plus récente. Le cours retient donc l’option antibiotique chez des adultes sélectionnés, avec une appendicite simple confirmée par l’imagerie, sans stercolithe, hors grossesse, après une information sur le risque d’échec et de récidive. La WSES 2020 attribuait à cette recommandation un niveau de preuve élevé et une force forte (1A).</p>
<div class="lab">Relation entre les deux sources</div><p>Les deux sources s’accordent sur les faits : guérison initiale fréquente, récidive d’environ 40 % à cinq et dix ans, échec plus fréquent avec un stercolithe. Elles divergent sur l’interprétation : la source suédoise attribue la guérison à l’histoire naturelle plutôt qu’à l’antibiotique. Un traitement symptomatique seul n’est recommandé par aucune des deux.</p>
<div class="lab">Limites</div><p>Seul le résumé de la WSES 2025 a pu être lu ; ses critères de sélection détaillés n’ont pas été vérifiés. Aucune recommandation suisse propre n’existe.</p>
<div class="lab">Accès aux textes</div><p>WSES 2025 : <a href="https://doi.org/10.1001/jamasurg.2025.6218">doi 10.1001/jamasurg.2025.6218</a>. WSES 2020 : <a href="https://doi.org/10.1186/s13017-020-00306-3">doi 10.1186/s13017-020-00306-3</a>. Recommandations suédoises 2025 : <a href="https://doi.org/10.1093/bjsopen/zrae165">doi 10.1093/bjsopen/zrae165</a>.</p></template>

<template data-pop="k35-antibio-postop" data-title="Durée des antibiotiques après une appendicite compliquée : source retenue">
<div class="lab">Les positions</div><p>WSES 2020 : ne pas dépasser 3 à 5 jours lorsque la source est contrôlée (1A). Recommandations suédoises 2025 : 3 à 5 jours après une perforation, 24 heures après une gangrène sans perforation. WSES 2025 : traitements courts de 2 à 3 jours dans la forme compliquée.</p>
<div class="lab">Mécanisme</div><p>Quand la source est contrôlée, l’inoculum résiduel est faible et les défenses péritonéales suffisent. Prolonger l’antibiotique n’ajoute pas de bénéfice, mais augmente les effets indésirables et la sélection de résistances.</p>
<div class="lab">Preuves</div><p>Dans l’essai de Sawyer (2015, 518 infections intra-abdominales compliquées), environ 4 jours d’antibiotique après contrôle de la source donnaient les mêmes résultats qu’environ 8 jours. Dans un essai de 80 patients, 24 heures d’antibiotique après une appendicite compliquée n’ont pas augmenté les complications et ont raccourci le séjour.</p>
<div class="lab">Source retenue et limites</div><p>Le cours retient 2 à 3 jours (WSES 2025), source la plus récente, compatible avec la limite supérieure de la WSES 2020. La source n’a été lue qu’en résumé. La durée s’allonge si la source n’est pas contrôlée ou si un abcès persiste. Chez l’enfant, la WSES 2020 recommande un relais oral après 48 heures et une durée totale inférieure à 7 jours (1B).</p>
<div class="lab">Accès aux textes</div><p>WSES 2025 : <a href="https://doi.org/10.1001/jamasurg.2025.6218">doi 10.1001/jamasurg.2025.6218</a>. WSES 2020 : <a href="https://doi.org/10.1186/s13017-020-00306-3">doi 10.1186/s13017-020-00306-3</a>.</p></template>

<template data-pop="k35-coelio" data-title="Appendicectomie par cœlioscopie">
<div class="lab">Technique</div><p>Trois trocarts ; dissection du méso-appendice par coagulation monopolaire ou bipolaire ; fermeture de la base par anse, ligature ou clip polymère, sans enfouissement ; moignon de 0,5 cm au plus ; extraction protégée ; aspiration sans lavage en cas de pus ; pas de drain.</p>
<div class="lab">Avantages démontrés</div><p>Moins de douleur, moins d’infections du site opératoire, séjour plus court, reprise plus rapide et meilleure qualité de vie que la voie ouverte (WSES 2020, 1A). L’avantage persiste chez le sujet âgé, l’obèse et le patient à haut risque (2B).</p>
<div class="lab">Limites</div><p>Les anciennes méta-analyses montraient plus d’abcès intra-abdominaux après cœlioscopie ; cet écart a disparu dans les essais récents. La voie ouverte reste utile en fin de grossesse ou en cas de contre-indication.</p></template>

<template data-pop="k35-drainage" data-title="Drainage percutané d’un abcès appendiculaire">
<div class="lab">Indication</div><p>Abcès de 3 à 5 cm : drainage à discuter ; au-delà de 5 cm : drainage systématique (recommandations suédoises 2025). Le drainage se fait sous échographie ou tomodensitométrie.</p>
<div class="lab">Effet</div><p>Chez l’enfant, une grande cohorte taïwanaise a associé le drainage à moins de récidives et moins d’appendicectomies d’intervalle. Chez l’adulte, environ 25 % des patients drainés échouent et sont opérés.</p>
<div class="lab">Piège</div><p>Une ponction qui ramène du mucus au lieu de pus évoque une tumeur mucineuse ; elle impose une imagerie et un avis spécialisé avant tout geste supplémentaire.</p></template>

<template data-pop="k35-neoplasie40" data-title="Néoplasie appendiculaire après 40 ans">
<div class="lab">Les chiffres</div><p>Une tumeur inattendue est découverte chez 3 % des sujets âgés et 1,5 % des plus jeunes opérés pour appendicite. Après une appendicite compliquée traitée par appendicectomie d’intervalle, une néoplasie est trouvée jusqu’à 11 % des cas. Dans un essai finlandais arrêté prématurément, 17 % des patients avaient une tumeur après un abcès, tous âgés de plus de 40 ans.</p>
<div class="lab">Mécanisme</div><p>Une tumeur de la base ou de la lumière obstrue l’appendice et provoque une appendicite, parfois compliquée ; l’inflammation masque la lésion à l’imagerie initiale.</p>
<div class="lab">Conduite</div><p>Après un traitement non opératoire à 40 ans ou plus : coloscopie et tomodensitométrie avec injection (WSES 2020, 2C), programmées 6 à 8 semaines après l’épisode selon les recommandations suédoises.</p></template>

<template data-pop="k35-analgesie" data-title="Analgésie avant le diagnostic">
<div class="lab">Ancienne crainte</div><p>On retardait l’analgésie de peur de masquer les signes péritonéaux et de fausser la décision opératoire.</p>
<div class="lab">Preuve</div><p>Une revue Cochrane de 2011 (huit essais randomisés chez l’adulte) a montré que les opioïdes soulagent la douleur sans augmenter le risque d’erreur diagnostique ni d’erreur de décision thérapeutique.</p>
<div class="lab">Conséquence pratique</div><p>Le patient reçoit une analgésie dès l’évaluation initiale : paracétamol, métamizole et morphine titrée selon l’intensité. Les doses figurent dans l’onglet Pharmacologie.</p></template>
