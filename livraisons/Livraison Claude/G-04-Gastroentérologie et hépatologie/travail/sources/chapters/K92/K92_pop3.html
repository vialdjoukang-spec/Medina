
<!-- ===== FENÊTRES : traitements et antithrombotiques ===== -->
<template data-pop="k92-ippavant" data-title="Inhibiteur de la pompe à protons avant l’endoscopie">
<div class="lab">Recommandation</div><p>L’ESGE 2021 suggère d’envisager une forte dose intraveineuse avant l’endoscopie (recommandation faible, niveau de preuve élevé), sans retarder l’examen.</p>
<div class="lab">Ce qui est démontré</div><p>Le traitement préalable réduit la proportion de stigmates à haut risque trouvés à l’endoscopie et donc le besoin d’hémostase endoscopique. Aucun bénéfice n’est démontré sur la récidive, la chirurgie ou la mortalité. La recommandation a été affaiblie en 2021 pour cette raison.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin peut le prescrire en attendant l’endoscopie, surtout si celle-ci sera tardive. Il ne s’en sert jamais comme argument pour différer l’examen au-delà de 24 heures.</p></template>
<template data-pop="k92-ery" data-title="Érythromycine avant l’endoscopie">
<div class="lab">Recommandation</div><p>L’ESGE 2021 recommande l’érythromycine intraveineuse chez les patients dont le saignement est cliniquement grave ou actif (recommandation forte, niveau de preuve élevé). L’ACG 2021 la suggère également.</p>
<div class="lab">Mécanisme</div><p>Agoniste du récepteur de la motiline, elle déclenche des contractions antrales puissantes qui vident l’estomac du sang et des caillots.</p>
<div class="lab">Bénéfice</div><p>Selon les méta-analyses citées par l’ESGE, elle améliore la visibilité de la muqueuse et réduit le besoin d’une seconde endoscopie, la durée de séjour et la transfusion. Une analyse de coût la juge rentable.</p>
<div class="lab">Modalités</div><p>Dose unique de 250 mg, administrée 30 à 120 minutes avant l’endoscopie selon l’ESGE. L’information professionnelle suisse d’Erythrocin i.v. impose une perfusion d’au moins 60 minutes et ne mentionne pas cette indication : l’usage est hors indication enregistrée.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux macrolides, QT long, hypokaliémie, hypomagnésémie, insuffisance hépatique sévère et plusieurs associations médicamenteuses (fiche de l’onglet Pharmacologie).</p></template>
<template data-pop="k92-txa" data-title="Acide tranexamique : pourquoi il n’est pas recommandé">
<div class="lab">Mécanisme théorique</div><p>L’acide tranexamique bloque la liaison du plasminogène à la fibrine et empêche la fibrinolyse. Il réduit la mortalité par hémorragie dans le traumatisme, ce qui a motivé son essai dans l’hémorragie digestive.</p>
<div class="lab">Preuve</div><p>L’essai HALT-IT (Lancet 2020) a inclus 12 009 patients avec hémorragie digestive haute ou basse importante, traités par 1 g en 10 minutes puis 3 g en 24 heures, ou par placebo. La mort par hémorragie à 5 jours était de 4 % dans les deux groupes (risque relatif 0,99). Les thromboses veineuses étaient plus fréquentes sous acide tranexamique (0,8 % contre 0,4 %).</p>
<div class="lab">Recommandation</div><p>L’ESGE 2021 ne recommande pas l’acide tranexamique dans l’hémorragie haute non variqueuse (recommandation forte, niveau de preuve élevé).</p>
<div class="lab">Limite</div><p>L’essai testait une forte dose prolongée ; il ne répond pas à la question d’une utilisation topique ou de faibles doses, qui ne sont pas recommandées faute de preuve.</p></template>
<template data-pop="k92-hemostase" data-title="Techniques d’hémostase endoscopique">
<div class="lab">Injection</div><p>Adrénaline diluée au 1/10 000 ou au 1/20 000, en aliquotes de 0,5 à 2 mL dans et autour de l’ulcère. Elle ralentit le saignement par vasoconstriction et compression, mais son effet est transitoire ; l’ESGE 2021 la proscrit en monothérapie (forte, élevé).</p>
<div class="lab">Moyens thermiques</div><p>Les sondes de contact (bipolaire, sonde chauffante) compriment le vaisseau et le soudent par la chaleur. La pince hémostatique est une alternative suggérée.</p>
<div class="lab">Moyens mécaniques</div><p>Les clips passés dans le canal opérateur ferment le vaisseau. Le clip monté sur capuchon, plus grand, saisit davantage de tissu ; l’ESGE le suggère en première intention pour les ulcères de plus de 2 cm, les vaisseaux de plus de 2 mm, les zones à haut risque et les ulcères fibreux, et en cas de récidive.</p>
<div class="lab">Poudre hémostatique</div><p>Projetée sur la lésion, elle forme une barrière mécanique et concentre les facteurs de coagulation. Elle est proposée en cas d’échec des moyens standard ; dans une série citée par l’ESGE, la récidive atteignait 26,7 % au 8e jour, ce qui en fait un traitement d’attente plutôt que définitif.</p></template>
<template data-pop="k92-ippapres" data-title="Inhibiteur de la pompe à protons après l’hémostase : choix de la source">
<div class="lab">Phase intraveineuse</div><p>L’ESGE 2021 recommande 80 mg en bolus puis 8 mg par heure pendant 72 heures après hémostase endoscopique ou pour un caillot adhérent non traité (forte, élevé). Des bolus intraveineux ou des prises orales à forte dose, deux fois par jour, sont des alternatives. Une méta-analyse citée par l’ESGE trouvait le schéma intermittent au moins aussi efficace que la perfusion continue.</p>
<div class="lab">Phase orale : le contentieux</div><p>L’information professionnelle suisse de Nexium i.v. (état juin 2026) prévoit ensuite 40 mg d’ésoméprazole une fois par jour pendant 4 semaines. L’ACG 2021 (texte le plus récent sur ce point) et le groupe de consensus international 2019 recommandent un traitement oral deux fois par jour jusqu’au 14e jour, puis une fois par jour pour une durée fixée par la lésion.</p>
<div class="lab">Choix retenu</div><p>Ce cours retient le schéma de l’ACG 2021, recommandation primaire la plus récente fondée sur une revue systématique, pour les ulcères à haut risque traités endoscopiquement. Le schéma de l’information professionnelle reste le texte enregistré en Suisse ; il couvre un ulcère de risque moindre. Le médecin documente le choix dans le dossier.</p>
<div class="lab">Limites</div><p>Le bénéfice du rythme biquotidien jusqu’au 14e jour repose sur des données de qualité modérée, issues surtout d’essais asiatiques. Les recommandations ne s’appliquent pas à un ulcère Forrest IIc ou III, pour lequel une dose orale standard suffit.</p></template>
<template data-pop="k92-tae" data-title="Embolisation artérielle">
<div class="lab">Principe</div><p>Le radiologue introduit un cathéter dans l’artère qui saigne, par voie fémorale ou radiale, et l’occlut par des microspirales, une colle ou des particules, au plus près de la lésion.</p>
<div class="lab">Indications</div><p>Hémorragie haute : échec de la seconde tentative d’hémostase endoscopique, ou saignement réfractaire à tous les moyens endoscopiques (ESGE 2021). Hémorragie basse : fuite active à l’angioscanner chez un patient instable, ou saignement non accessible à l’endoscopie ; l’ESGE recommande alors d’emboliser dans les 60 minutes.</p>
<div class="lab">Risques</div><p>Ischémie digestive, plus redoutée dans le côlon, dont la vascularisation collatérale est moins riche que celle de l’estomac et du duodénum ; néphrotoxicité du contraste ; complication au point de ponction.</p>
<div class="lab">Place de la chirurgie</div><p>La chirurgie vient si l’embolisation n’est pas disponible ou échoue.</p></template>
<template data-pop="k92-aas" data-title="Aspirine à faible dose pendant une hémorragie">
<div class="lab">Prévention primaire</div><p>L’ESGE 2021 recommande de la suspendre et de ne la reprendre qu’après réévaluation de l’indication (forte, faible). Le bénéfice de l’aspirine en prévention primaire est faible et ne justifie souvent pas le risque hémorragique.</p>
<div class="lab">Prévention secondaire</div><p>Elle n’est pas interrompue ; si elle l’a été, elle est reprise dès que possible, de préférence dans les 3 à 5 jours (forte, modéré). Les données citées par l’ESGE associent l’arrêt de l’antithrombotique à une mortalité et à des thromboses plus fréquentes.</p>
<div class="lab">Mécanisme</div><p>L’aspirine acétyle de façon irréversible la cyclo-oxygénase 1 des plaquettes, qui ne peuvent plus produire de thromboxane ; l’effet dure la vie de la plaquette, soit environ 7 à 10 jours.</p>
<div class="lab">Exemple</div><p>M. Rossier, porteur d’un stent coronaire, poursuit son aspirine ; son ibuprofène est arrêté.</p></template>
<template data-pop="k92-dapt" data-title="Double antiagrégation">
<div class="lab">Situation</div><p>Patient sous aspirine et inhibiteur du récepteur P2Y12 (clopidogrel, prasugrel, ticagrélor), souvent après un syndrome coronarien aigu ou un stent récent.</p>
<div class="lab">Recommandation</div><p>Hémorragie haute : l’aspirine est poursuivie, le second agent interrompu et repris dès que possible, de préférence dans les 5 jours, avec avis cardiologique (ESGE 2021, forte, faible). Hémorragie basse : la double antiagrégation n’est pas arrêtée systématiquement avant l’avis cardiologique ; l’inhibiteur du P2Y12 est poursuivi ou suspendu selon la gravité et le risque ischémique, et repris dans les 5 jours.</p>
<div class="lab">Raison</div><p>La thrombose d’un stent récent a une mortalité élevée. Le délai de reprise équilibre ce risque et celui de la récidive hémorragique.</p>
<div class="lab">Prévention</div><p>L’ESGE recommande un inhibiteur de la pompe à protons associé tant que dure la double antiagrégation après une hémorragie haute.</p></template>
<template data-pop="k92-avk" data-title="Antivitamines K pendant une hémorragie">
<div class="lab">Mécanisme</div><p>Les antivitamines K (acénocoumarol, phenprocoumone, warfarine) bloquent le recyclage de la vitamine K et réduisent la synthèse active des facteurs II, VII, IX et X. Leur effet se mesure par l’INR.</p>
<div class="lab">Conduite</div><p>Elles sont suspendues. En cas d’instabilité, le médecin associe de la vitamine K et un concentré de complexe prothrombinique, ou du plasma frais congelé si le concentré manque (ESGE 2021, forte, faible). L’endoscopie n’attend pas la correction : les résultats endoscopiques étaient comparables chez les patients avec INR normal ou corrigé sous 2,5, selon les études citées par l’ESGE.</p>
<div class="lab">Piège</div><p>Une correction rapide de l’INR a été associée à davantage de thromboses. Une hémorragie basse mineure (score d’Oakland de 8 ou moins) n’impose pas l’arrêt, selon une suggestion faible de l’ESGE.</p>
<div class="lab">Reprise</div><p>Dès le saignement contrôlé, de préférence vers le 7e jour ; plus tôt, avec relais par héparine, chez le porteur de valve mécanique mitrale ou après une thrombose veineuse de moins de 3 mois.</p></template>
<template data-pop="k92-aod" data-title="AOD pendant une hémorragie">
<div class="lab">Molécules</div><p>Dabigatran, inhibiteur direct de la thrombine ; apixaban, édoxaban et rivaroxaban, inhibiteurs directs du facteur Xa.</p>
<div class="lab">Conduite</div><p>L’AOD est suspendu et l’endoscopie n’est pas retardée (ESGE 2021, forte, faible). Leur effet disparaît en 12 à 24 heures si la fonction rénale est normale. En cas de saignement grave persistant, un antidote spécifique ou un concentré de complexe prothrombinique est envisagé, en lien avec l’hémostasien.</p>
<div class="lab">Antidotes</div><p>Idarucizumab pour le dabigatran ; andexanet alfa pour l’apixaban et le rivaroxaban ; concentré de complexe prothrombinique pour l’édoxaban ou en l’absence d’antidote.</p>
<div class="lab">Piège</div><p>L’INR ne mesure pas l’effet des AOD. L’insuffisance rénale prolonge l’effet du dabigatran.</p></template>
<template data-pop="k92-reprise" data-title="Reprise de l’anticoagulation">
<div class="lab">Recommandation</div><p>L’ESGE 2021 recommande de reprendre l’anticoagulation dès que le saignement est contrôlé, de préférence dans les 7 jours ou peu après, selon le risque thromboembolique (forte, faible). Pour l’hémorragie basse majeure, elle suggère une reprise à partir du 7e jour.</p>
<div class="lab">Preuve</div><p>Des études observationnelles et trois méta-analyses citées par l’ESGE montrent un bénéfice net de la reprise sur les thromboses et la mortalité, malgré davantage de récidives hémorragiques. Ce sont des associations, sujettes aux biais de sélection : les patients repris étaient souvent les moins graves.</p>
<div class="lab">Mise en œuvre</div><p>Les AOD agissent en quelques heures ; les antivitamines K demandent plusieurs jours. Chez le patient à haut risque thrombotique, les sociétés de cardiologie proposent une héparine de bas poids moléculaire titrée en 48 à 72 heures. Un inhibiteur de la pompe à protons accompagne l’anticoagulation après une hémorragie haute.</p></template>
