
<!-- ===== FENÊTRES : scores, examens et gestes ===== -->
<template data-pop="k92-gbs" data-title="Score de Glasgow-Blatchford">
<div class="lab">Définition</div><p>Score de 0 à 23 points, publié par Blatchford et al. (Lancet 2000), qui prédit avant l’endoscopie le besoin d’une intervention hospitalière : transfusion, geste endoscopique, embolisation, chirurgie, ou le décès.</p>
<div class="lab">Composantes</div><p>Urée (2 à 6 points), hémoglobine selon le sexe (1 à 6), pression systolique (1 à 3), fréquence cardiaque de 100 ou plus (1), méléna (1), syncope (2), hépatopathie (2), insuffisance cardiaque (2). Le tableau complet figure dans l’îlot 7.</p>
<div class="lab">Pourquoi ces éléments</div><p>L’urée reflète la digestion du sang et l’hypovolémie ; l’hémoglobine, la pression et la fréquence mesurent la perte ; la syncope signe une perte décompensée ; l’hépatopathie et l’insuffisance cardiaque réduisent la tolérance.</p>
<div class="lab">Valeur</div><p>L’ESGE 2021 le recommande pour la stratification avant l’endoscopie (recommandation forte, niveau de preuve modéré). Dans une cohorte internationale de 3012 patients citée par l’ESGE, son aire sous la courbe pour le besoin d’intervention ou le décès était de 0,86, la meilleure des scores comparés ; un seuil de 1 ou moins avait une sensibilité de 98,6 % et une spécificité de 34,6 %. Une étude de 1521 patients des urgences de Suisse romande l’a aussi classé premier (European Journal of Emergency Medicine 2023).</p>
<div class="lab">Limites</div><p>Il prédit mal la mortalité et la récidive. L’insuffisance rénale fausse l’urée. Il a été conçu pour l’hémorragie haute ; l’hémorragie basse a son propre score.</p>
<div class="lab">Décision</div><p>Score de 0 ou 1 : sortie avec gastroscopie ambulatoire. Score de 2 ou plus : hospitalisation et gastroscopie dans les 24 heures.</p></template>
<template data-pop="k92-oakland" data-title="Score d’Oakland">
<div class="lab">Définition</div><p>Score de 0 à 35 points, dérivé de 2336 hémorragies basses de l’audit britannique de 2015 et validé à Londres (Oakland et al., Lancet Gastroenterology and Hepatology 2017). Il prédit la « sortie sans danger » : absence de récidive, de transfusion, de geste hémostatique, de décès et de réadmission pour saignement à 28 jours.</p>
<div class="lab">Composantes</div><p>Âge, sexe, hospitalisation antérieure pour hémorragie basse, sang au toucher rectal, fréquence cardiaque, pression systolique et hémoglobine, qui pèse jusqu’à 22 points. Le tableau figure dans l’îlot 11.</p>
<div class="lab">Valeur</div><p>Un score de 8 ou moins correspond à une probabilité de 95 % de sortie sans danger. Il a été validé dans une cohorte américaine de 38 067 patients citée par l’ESGE. L’ESGE 2021 l’utilise pour autoriser la sortie (recommandation forte, niveau de preuve modéré).</p>
<div class="lab">Limites</div><p>Il ne s’applique qu’à un saignement arrêté sans critère de gravité. Les valeurs d’hémoglobine sont en g/L, malgré l’en-tête « g/dL » du tableau de l’ESGE. Des seuils plus élevés ont été étudiés, mais ne sont pas ceux de l’ESGE 2021.</p></template>
<template data-pop="k92-rockall" data-title="Score de Rockall et AIMS65">
<div class="lab">Rockall</div><p>Le score de Rockall (Gut 1996) existe en version préendoscopique (âge, choc, comorbidités) et complète, qui ajoute le diagnostic endoscopique et les stigmates de saignement récent. Il a été conçu pour prédire la mortalité et la récidive.</p>
<div class="lab">AIMS65</div><p>Score simple de mortalité hospitalière fondé sur l’albumine, l’INR, l’état mental, la pression systolique et l’âge de 65 ans ou plus.</p>
<div class="lab">Comparaison</div><p>Dans une revue citée par l’ESGE 2021, la sensibilité pour les événements graves à 30 jours était de 0,98 pour le score de Glasgow-Blatchford, de 0,93 pour le Rockall préendoscopique et de 0,79 pour l’AIMS65. Pour décider de la sortie, le score de Glasgow-Blatchford est donc préféré.</p></template>
<template data-pop="k92-forrest" data-title="Classification de Forrest">
<div class="lab">Définition</div><p>Classification endoscopique des stigmates de saignement d’un ulcère. Saignement actif : Ia en jet, Ib en suintement. Saignement récent : IIa vaisseau visible, IIb caillot adhérent, IIc tache pigmentée plane. Pas de stigmate : III, fond propre.</p>
<div class="lab">Valeur pronostique</div><p>Dans les séries historiques sans traitement endoscopique résumées par Laine et Peterson (New England Journal of Medicine 1994), la récidive était d’environ 55 % pour le saignement actif, 43 % pour le vaisseau visible, 22 % pour le caillot adhérent, 10 % pour la tache plane et 5 % pour le fond propre.</p>
<div class="lab">Recommandation</div><p>L’ESGE 2021 recommande d’utiliser la classification chez tous les patients avec ulcère hémorragique (recommandation forte, niveau de preuve élevé), de traiter les classes Ia, Ib et IIa, d’envisager l’ablation du caillot IIb, et de ne pas traiter les classes IIc et III.</p>
<div class="lab">Piège</div><p>La distinction entre vaisseau visible et caillot dépend de l’endoscopiste ; un lavage ciblé aide à décider.</p></template>
<template data-pop="k92-angioct" data-title="Angioscanner abdominal">
<div class="lab">Principe</div><p>Scanner avec injection rapide de contraste iodé, acquis en phase artérielle puis portale. Une extravasation de contraste dans la lumière digestive signe un saignement actif et le localise.</p>
<div class="lab">Valeur</div><p>L’ESGE 2021 rapporte une sensibilité de 79 à 95 % et une spécificité de 95 à 100 % dans des séries rétrospectives. L’examen est rapide et disponible jour et nuit.</p>
<div class="lab">Indication</div><p>Patient instable avec saignement actif, avant tout geste endoscopique ou radiologique (ESGE 2021, recommandation forte, niveau de preuve faible) ; suspicion de fistule aorto-entérique ; hémorragie haute réfractaire avant embolisation.</p>
<div class="lab">Limites</div><p>Il est souvent négatif si le saignement s’est arrêté. Le contraste iodé expose à une néphrotoxicité, rarement décisive face à une hémorragie qui menace la vie.</p></template>
<template data-pop="k92-hp" data-title="Helicobacter pylori pendant une hémorragie">
<div class="lab">Recommandation</div><p>L’ESGE 2021 recommande de rechercher <i>Helicobacter pylori</i> dès l’endoscopie initiale, de traiter l’infection détectée, de répéter le test s’il est négatif et de documenter l’éradication (recommandations fortes, niveau de preuve élevé).</p>
<div class="lab">Pourquoi des faux négatifs</div><p>L’inhibiteur de la pompe à protons réduit la densité bactérienne et la déplace vers le fundus. Le sang dans l’estomac gêne la lecture des tests rapides à l’uréase.</p>
<div class="lab">Conséquence</div><p>Un ulcère dont l’infection n’est pas éradiquée récidive et peut saigner de nouveau. Les schémas d’éradication et le délai d’arrêt de l’inhibiteur avant le contrôle sont traités dans K25.</p></template>
<template data-pop="k92-delai" data-title="Délai de la gastroscopie : 24 heures et non 6">
<div class="lab">Recommandation</div><p>L’ESGE 2021 recommande une endoscopie dans les 24 heures après la réanimation (recommandation forte, niveau de preuve élevé) et déconseille l’endoscopie dans les 12 heures (forte, élevé) et dans les 6 heures (forte, modéré).</p>
<div class="lab">Preuve</div><p>Dans l’essai de Lau et al. (New England Journal of Medicine 2020), 516 patients à haut risque (score de Glasgow-Blatchford de 12 ou plus) ont été endoscopés dans les 6 heures ou entre 6 et 24 heures après l’avis gastro-entérologique. La mortalité à 30 jours était de 8,9 % contre 6,6 %, et la récidive de 10,9 % contre 7,8 %, sans différence significative. Une cohorte danoise de 12 601 patients associait l’endoscopie de moins de 6 heures à une mortalité plus élevée chez les patients instables.</p>
<div class="lab">Interprétation</div><p>Endoscoper trop tôt revient souvent à endoscoper un patient insuffisamment réanimé. Une méta-analyse de 2026 portant sur 10 785 patients n’a pas montré de bénéfice de l’endoscopie de moins de 6 heures sur la mortalité ou la récidive (publiée en 2026, doi 10.7717/peerj.21702, résumé lu).</p>
<div class="lab">Exception</div><p>Un saignement actif qui persiste malgré la réanimation, ou une suspicion de rupture variceuse, justifient une endoscopie plus précoce.</p></template>
<template data-pop="k92-transf" data-title="Transfusion restrictive">
<div class="lab">Recommandation</div><p>Chez le patient stable, l’ESGE 2021 recommande de transfuser à 70 g/L ou moins, avec une cible de 70 à 90 g/L, sans maladie cardiovasculaire (forte, modéré), et à 80 g/L ou moins, avec une cible de 100 g/L ou plus, en cas de maladie cardiovasculaire (forte, faible). L’hémorragie basse suit les mêmes seuils.</p>
<div class="lab">Preuve</div><p>Dans l’essai de Villanueva et al. (New England Journal of Medicine 2013), 921 patients avec hémorragie haute grave ont été répartis entre un seuil de 70 g/L et un seuil de 90 g/L. La survie à 6 semaines était de 95 % contre 91 %, et la récidive de 10 % contre 16 % en faveur de la stratégie restrictive. Le bénéfice était net chez les cirrhotiques Child-Pugh A ou B ; chez eux, la stratégie libérale augmentait le gradient de pression portale.</p>
<div class="lab">Mécanisme</div><p>La transfusion excessive augmente la volémie et la pression dans les vaisseaux qui saignent, ce qui peut déloger le caillou ; chez le cirrhotique, elle élève la pression portale.</p>
<div class="lab">Limite</div><p>Le patient coronarien a une réserve en oxygène limitée : un apport artériel d’oxygène réduit par l’anémie peut déclencher une ischémie. D’où le seuil plus élevé, fondé sur un niveau de preuve faible. L’essai excluait les hémorragies massives, où la transfusion suit le débit.</p></template>
<template data-pop="k92-cristal" data-title="Remplissage par cristalloïdes">
<div class="lab">Recommandation</div><p>L’ESGE 2021 recommande un remplissage initial par cristalloïdes en cas d’instabilité (recommandation forte, niveau de preuve faible).</p>
<div class="lab">Choix du soluté</div><p>L’ESGE note que le sérum salé isotonique ou un cristalloïde balancé conviennent. Chez des patients de réanimation, pour la plupart sans hémorragie digestive, un cristalloïde balancé comme le Ringer lactate a été associé à une mortalité plus faible que le sérum salé. Les colloïdes n’apportent pas de bénéfice démontré.</p>
<div class="lab">Limite</div><p>Le remplissage dilue les facteurs de coagulation et les plaquettes. Il vise une perfusion suffisante des organes, jugée sur la conscience, la diurèse et le lactate.</p></template>
<template data-pop="k92-intub" data-title="Intubation avant l’endoscopie">
<div class="lab">Recommandation</div><p>L’ESGE 2021 ne recommande pas l’intubation prophylactique systématique (forte, élevé). Elle la recommande seulement en cas d’hématémèse active, d’agitation ou d’encéphalopathie qui empêchent de protéger les voies aériennes (forte, faible).</p>
<div class="lab">Raison</div><p>Les données citées par l’ESGE associent l’intubation systématique à davantage de pneumonies, sans bénéfice démontré sur la mortalité.</p>
<div class="lab">Décision</div><p>Le cirrhotique encéphalopathe qui vomit du sang est l’exemple type de patient à intuber.</p></template>
