
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="k92-d-eso" data-title="Ésoméprazole par voie intraveineuse (Nexium i.v.)">
<div class="lab">Mécanisme</div><p>Prodrogue activée dans le canalicule acide de la cellule pariétale ; elle bloque de façon irréversible la H⁺/K⁺-ATPase active. La perfusion continue maintient un pH gastrique élevé en bloquant les pompes au fur et à mesure de leur apparition.</p>
<div class="lab">Indication en Suisse</div><p>Prévention de la récidive hémorragique d’un ulcère gastrique ou duodénal après hémostase endoscopique, quand la voie orale n’est pas possible (information professionnelle suisse, compendium.ch, Nexium i.v., état juin 2026, consultée le 08.10.2026).</p>
<div class="lab">Posologie</div><p>40 à 80 mg en perfusion de 30 minutes, puis 8 mg par heure pendant 72 heures ; relais oral par 40 mg une fois par jour pendant 4 semaines selon l’information professionnelle. Insuffisance hépatique sévère : 4 mg par heure. Insuffisance rénale : pas d’adaptation, prudence si sévère. Sujet âgé : pas d’adaptation.</p>
<div class="lab">Contre-indication</div><p>Hypersensibilité à l’ésoméprazole ou aux benzimidazoles substitués.</p>
<div class="lab">Interactions</div><p>Inhibition du CYP2C19 : baisse d’environ 40 % du métabolite actif du clopidogrel, association déconseillée ; hausse possible du diazépam, du citalopram et de la phénytoïne ; surveillance de l’INR sous warfarine et des taux de tacrolimus ; exposition diminuée à l’atazanavir et au nelfinavir.</p>
<div class="lab">Grossesse et allaitement</div><p>Prudence pendant la grossesse ; ne pas utiliser pendant l’allaitement selon l’information professionnelle.</p>
<div class="lab">Effets indésirables à surveiller</div><p>Céphalées, troubles digestifs ; lors d’un traitement prolongé, hypomagnésémie et infections digestives.</p></template>
<template data-pop="k92-d-panto" data-title="Pantoprazole par voie intraveineuse (Pantozol i.v.)">
<div class="lab">Indications en Suisse</div><p>Ulcère duodénal ou gastrique aigu, œsophagite de reflux, syndrome d’hypersécrétion acide, chez le patient qui ne peut pas prendre la voie orale (information professionnelle suisse, compendium.ch, Pantozol, état septembre 2026, consultée le 08.10.2026). L’hémorragie n’est pas mentionnée.</p>
<div class="lab">Posologie enregistrée</div><p>40 mg une fois par jour par voie intraveineuse, habituellement 3 à 7 jours, puis relais oral. En hypersécrétion, 80 mg par jour au départ ; une dose initiale de 2 fois 80 mg permet un contrôle rapide de l’acidité. Insuffisance hépatique sévère : 20 mg par jour au maximum. Sujet âgé et insuffisance rénale : 40 mg par jour au maximum dans les indications enregistrées.</p>
<div class="lab">Usage dans l’hémorragie</div><p>Le schéma de l’ESGE 2021 (80 mg puis 8 mg par heure pendant 72 heures) est appliqué avec le pantoprazole dans de nombreux hôpitaux. En Suisse, il constitue un usage hors indication enregistrée, à documenter.</p>
<div class="lab">Grossesse et allaitement</div><p>Pendant la grossesse, seulement si clairement nécessaire ; pendant l’allaitement, décision au cas par cas, car le pantoprazole passe dans le lait.</p>
<div class="lab">Intérêt</div><p>Son information professionnelle ne mentionne pas d’interaction avec le clopidogrel.</p></template>
<template data-pop="k92-d-ery" data-title="Érythromycine par voie intraveineuse (Erythrocin i.v.)">
<div class="lab">Mécanisme</div><p>Macrolide antibactérien qui agit aussi comme agoniste du récepteur de la motiline : il accélère la vidange gastrique.</p>
<div class="lab">Usage dans l’hémorragie</div><p>250 mg en dose unique, administrée 30 à 120 minutes avant la gastroscopie chez le patient qui saigne activement (ESGE 2021). Usage hors indication enregistrée en Suisse.</p>
<div class="lab">Forme et administration</div><p>Flacon de 1000 mg à reconstituer. Perfusion d’au moins 60 minutes, car une perfusion rapide favorise arythmies et hypotension ; bolus, voie intramusculaire et voie intra-artérielle contre-indiqués (information professionnelle suisse, compendium.ch, Erythrocin i.v., état juin 2025, consultée le 08.10.2026).</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux macrolides ; insuffisance hépatique sévère ; QT long congénital ou acquis, arythmie ventriculaire ; hypokaliémie ou hypomagnésémie ; ergotamine, dihydroergotamine, lomitapide, simvastatine, lovastatine, astémizole, terfénadine, cisapride, dompéridone, pimozide.</p>
<div class="lab">Grossesse et allaitement</div><p>Pendant la grossesse, seulement si clairement nécessaire ; passage dans le lait avec risque de troubles digestifs et de sténose du pylore chez le nourrisson.</p>
<div class="lab">Surveillance</div><p>ECG et potassium avant la perfusion chez le patient âgé, cardiaque ou qui a vomi.</p></template>
<template data-pop="k92-d-adre" data-title="Adrénaline injectée par voie endoscopique">
<div class="lab">Préparation</div><p>Adrénaline diluée au 1/10 000 ou au 1/20 000 dans du sérum salé, injectée en aliquotes de 0,5 à 2 mL dans et autour du fond de l’ulcère (ESGE 2021).</p>
<div class="lab">Mécanisme</div><p>Vasoconstriction locale par les récepteurs alpha et compression mécanique par le volume injecté ; le saignement ralentit et le champ s’éclaircit.</p>
<div class="lab">Limite</div><p>L’effet est transitoire ; l’ESGE proscrit l’adrénaline seule et l’associe toujours à un moyen thermique ou mécanique.</p>
<div class="lab">Précaution</div><p>Une absorption systémique peut provoquer tachycardie et hypertension, surtout lors d’injections répétées chez le patient cardiaque.</p></template>
<template data-pop="k92-d-vitk" data-title="Phytoménadione (Konakion)">
<div class="lab">Mécanisme</div><p>La vitamine K permet la carboxylation des facteurs II, VII, IX et X ; elle restaure leur synthèse lorsque l’antivitamine K est arrêtée.</p>
<div class="lab">Délai</div><p>Effet après 1 à 3 heures par voie intraveineuse, 4 à 6 heures par voie orale (information professionnelle suisse, compendium.ch, Konakion, état janvier 2022, consultée le 08.10.2026) ; normalisation de l’INR en environ 24 heures selon l’ESGE.</p>
<div class="lab">Posologie</div><p>Intoxication aiguë par antivitamine K : 10 à 20 mg par jour par voie intraveineuse lente (au moins 30 secondes). En cas d’hémorragie digestive menaçant la vie, l’information professionnelle prévoit l’apport prioritaire de facteurs de coagulation associé à la vitamine K. L’ESGE recommande une faible dose sans la chiffrer, pour ne pas gêner la reprise de l’anticoagulation.</p>
<div class="lab">Précautions</div><p>Surveillance de l’INR en cas d’insuffisance hépatique sévère. Grossesse : indication stricte ; allaitement : pas d’inconvénient attendu aux doses thérapeutiques.</p></template>
<template data-pop="k92-d-ccp" data-title="Concentré de complexe prothrombinique (Beriplex P/N)">
<div class="lab">Composition et mécanisme</div><p>Facteurs II, VII, IX et X humains, avec les protéines C et S. Il remplace immédiatement les facteurs que l’antivitamine K a rendus inactifs.</p>
<div class="lab">Posologie (antivitamine K)</div><p>Selon l’INR initial : 2,0 à 3,9 : 25 UI de facteur IX par kg ; 4,0 à 6,0 : 35 UI/kg ; plus de 6,0 : 50 UI/kg ; dose unique maximale de 5000 UI. Correction attendue en 30 minutes environ ; vitamine K associée ; répétition non soutenue par des données (information professionnelle suisse, compendium.ch, Beriplex P/N, état octobre 2022, consultée le 08.10.2026).</p>
<div class="lab">AOD</div><p>L’ESGE propose le concentré si l’antidote spécifique n’est pas disponible ou pour l’édoxaban ; cette utilisation n’est pas dans l’indication enregistrée.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité ; coagulopathie de consommation avant son interruption ; antécédent de thrombopénie induite par l’héparine.</p>
<div class="lab">Risque</div><p>Événements thromboemboliques ; utilisation pendant la grossesse et l’allaitement après évaluation soigneuse.</p></template>
<template data-pop="k92-d-idaru" data-title="Idarucizumab (Praxbind)">
<div class="lab">Mécanisme</div><p>Fragment d’anticorps monoclonal humanisé qui lie spécifiquement le dabigatran et neutralise son effet en quelques minutes. Il n’agit sur aucun autre anticoagulant.</p>
<div class="lab">Indication</div><p>Saignement grave non contrôlable ou geste urgent chez un patient sous dabigatran.</p>
<div class="lab">Posologie</div><p>5 g (deux flacons de 2,5 g/50 mL) par voie intraveineuse, en deux perfusions successives de 5 à 10 minutes ou en bolus. Une seconde dose de 5 g peut se discuter si le saignement récidive avec des tests de coagulation encore allongés, car du dabigatran libre peut réapparaître jusqu’à 24 heures après (information professionnelle suisse, compendium.ch, Praxbind, état mars 2021, consultée le 08.10.2026).</p>
<div class="lab">Contre-indications</div><p>Aucune ; le risque d’une hypersensibilité connue se pèse contre le bénéfice. Grossesse : utilisable si le bénéfice l’emporte.</p></template>
<template data-pop="k92-d-andex" data-title="Andexanet alfa (Ondexxya)">
<div class="lab">Mécanisme</div><p>Protéine recombinante modifiée du facteur Xa, sans activité enzymatique, qui capte les inhibiteurs du facteur Xa. Elle inhibe aussi l’inhibiteur de la voie du facteur tissulaire, ce qui peut favoriser la thrombose.</p>
<div class="lab">Indication en Suisse</div><p>Adulte sous apixaban ou rivaroxaban avec hémorragie menaçant la vie ou non contrôlable (information professionnelle suisse, compendium.ch, Ondexxya, état avril 2025, consultée le 08.10.2026). Non recommandé pour l’édoxaban.</p>
<div class="lab">Posologie</div><p>Faible dose : bolus de 400 mg à 30 mg/min puis 4 mg/min pendant 120 minutes (5 flacons de 200 mg). Forte dose : bolus de 800 mg puis 8 mg/min pendant 120 minutes (9 flacons). La forte dose s’applique si la dernière prise date de moins de 8 heures et dépasse 5 mg d’apixaban ou 10 mg de rivaroxaban ; sinon, faible dose. Pas de recommandation si la dose ou l’heure sont inconnues.</p>
<div class="lab">Surveillance</div><p>Clinique (hémostase, récidive, thrombose) ; les tests anti-Xa commerciaux ne sont pas interprétables après l’administration. Grossesse : non recommandé ; allaitement à interrompre.</p></template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-k92-diag" data-title="Pareto — Reconnaître et stratifier">
<p class="ratio" data-cover="k92-0,k92-1,k92-2,k92-3,k92-4,k92-5,k92-6,k92-7"></p>
<ul>
<li>La gravité se lit sur les constantes : l’hémoglobine initiale reste presque normale tant que la dilution n’a pas eu lieu.</li>
<li>Hématémèse et marc de café : source haute ; méléna : sang digéré, haut le plus souvent ; hématochézie : bas, sauf choc.</li>
<li>Haut = en amont de l’angle de Treitz ; bas = en aval de la valvule iléo-cæcale (ESGE 2021) ; entre les deux, le grêle.</li>
<li>K92.0, K92.1 et K92.2 codent le symptôme ; le code de la lésion les remplace dès qu’elle est trouvée.</li>
<li>Mortalité de 1 à 5 % en haut, 3,4 % en bas, surtout par décompensation des comorbidités.</li>
<li>L’ulcère domine en haut ; diverticule et lésions anorectales en bas ; AINS plus antithrombotique = facteur évitable majeur.</li>
<li>L’acide empêche le caillou de tenir ; l’urée monte par digestion du sang et hypovolémie ; la tachycardie précède l’hypotension.</li>
<li>Anamnèse : syncope, vomissements préalables, liste exacte des antithrombotiques, cirrhose, prothèse aortique.</li>
<li>Indice de choc normal inférieur à 0,7 ; toucher rectal systématique ; pas de sonde nasogastrique en routine.</li>
<li>Score de Glasgow-Blatchford de 0 ou 1 : sortie ; gastroscopie, examen de référence en haut ; coloscopie si bas stable ; angioscanner si bas instable.</li>
</ul></template>
<template data-pop="pareto-k92-ttt" data-title="Pareto — Traiter, suivre et décider">
<p class="ratio" data-cover="k92-8,k92-9,k92-10,k92-11,k92-12,k92-13,k92-14,k92-15"></p>
<ul>
<li>Choc : deux voies veineuses, groupe, cristalloïdes, monitorage ; intubation seulement si hématémèse active ou conscience altérée.</li>
<li>Cirrhose : vasoactif et antibiotique dès la suspicion, gastroscopie dans les 12 heures (I85).</li>
<li>Transfusion à 70 g/L (cible 70 à 90), à 80 g/L si maladie cardiovasculaire (cible 100 ou plus).</li>
<li>Avant l’endoscopie : inhibiteur à forte dose envisagé, érythromycine 250 mg si saignement grave ; ni acide tranexamique, ni octréotide.</li>
<li>Gastroscopie dans les 24 heures, pas avant 12 heures en routine ; Forrest Ia, Ib, IIa traités par deux moyens ; IIb décollé.</li>
<li>Après : 80 mg puis 8 mg/h pendant 72 heures ; <i>Helicobacter pylori</i> recherché, traité, contrôlé.</li>
<li>Récidive : nouvelle endoscopie, puis embolisation, puis chirurgie.</li>
<li>Aspirine de prévention secondaire poursuivie ; second antiagrégant repris dans les 5 jours ; anticoagulant repris vers le 7e jour.</li>
<li>Bas stable : Oakland 8 ou moins, sortie ; sinon coloscopie préparée pendant le séjour. Bas instable : angioscanner, embolisation dans les 60 minutes.</li>
<li>Grêle : vidéocapsule dans les 48 heures après un saignement visible.</li>
<li>Pas de critères chiffrés consensuels : saignement digestif extériorisé, localisation présumée, source identifiée.</li>
</ul></template>
<template data-pop="pareto-k92-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="k92-e-1,k92-e-2,k92-e-3,k92-e-4,k92-e-5"></p>
<ul>
<li>La gastroscopie localise, classe et traite ; la coloscopie préparée fait de même en bas chez le patient stable.</li>
<li>L’angioscanner localise le saignement actif chez le patient instable (sensibilité 79 à 95 %) ; la scintigraphie n’est pas recommandée.</li>
<li>Hémoglobine répétée ; urée élevée avec créatinine normale = source haute ; INR non fiable pour les AOD.</li>
<li>Thrombopénie et INR élevé : penser cirrhose et varices.</li>
<li>Forrest : récidive d’environ 55 % (actif), 43 % (vaisseau visible), 22 % (caillot), 10 % (tache), 5 % (fond propre).</li>
<li>Test d’<i>Helicobacter pylori</i> négatif pendant l’hémorragie : à répéter.</li>
<li>Glasgow-Blatchford : sensible pour la sortie, peu spécifique ; Oakland pour le bas.</li>
</ul></template>
<template data-pop="pareto-k92-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="k92-sa,k92-sh,k92-sp,k92-sb,k92-sm"></p>
<ul>
<li>L’artère gastroduodénale passe derrière le bulbe : ulcère bulbaire postérieur = saignement artériel massif.</li>
<li>Érosion : muqueuse, capillaires ; ulcère : sous-muqueuse, artérioles ; Dieulafoy : artère large sous une érosion minuscule.</li>
<li>Hypotension au-delà d’environ 30 % de perte ; hémoglobine abaissée par dilution sur 24 à 72 heures.</li>
<li>Coagulation perturbée dès pH 6,8, abolie à pH 5,4 ; cible de pH supérieure à 6 après hémostase.</li>
<li>Inhibiteur de la pompe à protons : prodrogue, blocage irréversible des pompes actives, d’où la perfusion continue ; inhibition du CYP2C19.</li>
<li>Érythromycine : agoniste de la motiline, vidange gastrique.</li>
</ul></template>
<template data-pop="pareto-k92-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="k92-p-1,k92-p-2,k92-p-3,k92-p-4,k92-p-5"></p>
<ul>
<li>Nexium i.v. : 40 à 80 mg en 30 minutes puis 8 mg/h pendant 72 heures, indication enregistrée ; 4 mg/h si insuffisance hépatique sévère.</li>
<li>Pantozol i.v. : hémorragie hors indication enregistrée en Suisse.</li>
<li>Érythromycine 250 mg avant l’endoscopie, perfusion d’au moins 60 minutes ; contre-indiquée si QT long, hypokaliémie, hypomagnésémie.</li>
<li>Antivitamine K : Beriplex P/N 25, 35 ou 50 UI/kg selon l’INR, plus vitamine K.</li>
<li>Dabigatran : idarucizumab 5 g. Apixaban, rivaroxaban : andexanet, forte dose si forte dose prise il y a moins de 8 heures.</li>
<li>Pas d’acide tranexamique, pas de transfusion plaquettaire systématique ; ésoméprazole déconseillé avec le clopidogrel.</li>
</ul></template>
