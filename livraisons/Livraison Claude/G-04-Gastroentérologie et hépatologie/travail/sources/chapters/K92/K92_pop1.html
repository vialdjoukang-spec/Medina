
<!-- ===== FENÊTRES : présentations et notions cliniques ===== -->
<template data-pop="k92-hematemese" data-title="Hématémèse">
<div class="lab">Définition</div><p>L’hématémèse est le vomissement de sang rouge, de caillots ou d’un liquide brun-noir granuleux dit « en marc de café ». Elle signe une source située en amont de l’angle de Treitz. Son code est K92.0 tant que la cause n’est pas connue.</p>
<div class="lab">Mécanisme</div><p>Le sang irrite l’estomac et le distend, ce qui déclenche le vomissement. Le sang rouge témoigne d’un saignement récent ou abondant. Le marc de café témoigne d’un sang resté assez longtemps au contact de l’acide pour que l’hémoglobine soit transformée en hématine brune.</p>
<div class="lab">Diagnostic différentiel</div><p>L’hémoptysie est émise lors d’une toux, souvent aérée et mousseuse. Le sang d’une épistaxis postérieure peut être dégluti la nuit puis vomi le matin. Un examen du nez et de la gorge règle souvent la question.</p>
<div class="lab">Conséquence pratique</div><p>Une hématémèse active expose à l’inhalation : elle fait partie des rares indications d’intubation avant l’endoscopie selon l’ESGE 2021. Le marc de café n’exclut pas une lésion grave ; il impose le même calcul du score de Glasgow-Blatchford.</p></template>
<template data-pop="k92-melena" data-title="Méléna">
<div class="lab">Définition</div><p>Le méléna est l’émission par l’anus de selles noires, brillantes, goudronneuses, collantes et d’odeur fétide. Il traduit la présence de sang digéré. Son code est K92.1 ; la CIM-10-GM exclut le sang occulte, codé R19.5.</p>
<div class="lab">Mécanisme</div><p>L’acide gastrique transforme l’hémoglobine en hématine, puis les bactéries intestinales dégradent l’hème en pigments noirs. Il faut pour cela un séjour de plusieurs heures dans l’intestin. Une source haute à débit modéré donne donc le plus souvent un méléna ; une source grêle ou colique droite lente peut aussi en donner un.</p>
<div class="lab">Technique</div><p>Le toucher rectal permet de voir la couleur et la consistance. Le méléna est noir et poisseux ; il laisse une trace qui ne s’efface pas facilement du doigtier.</p>
<div class="lab">Piège</div><p>Le fer oral et les sels de bismuth donnent des selles noires mais moulées, non collantes et sans odeur fétide. Un test de recherche de sang ne départage pas toujours, car il ne mesure pas l’abondance.</p>
<div class="lab">Conséquence pratique</div><p>Le méléna ajoute 1 point au score de Glasgow-Blatchford. Il oriente vers une gastroscopie en première intention.</p></template>
<template data-pop="k92-hematochezie" data-title="Hématochézie et rectorragie">
<div class="lab">Définition</div><p>L’hématochézie est l’émission par l’anus de sang rouge ou marron, mêlé ou non aux selles. Le terme rectorragie désigne habituellement un sang rouge vif d’origine anorectale ou colique gauche. Une hémorragie de l’anus et du rectum se code K62.5 (cours K63) ; une hémorragie intestinale sans précision se code K92.2.</p>
<div class="lab">Mécanisme</div><p>Le sang reste rouge parce qu’il sort vite, sans avoir été digéré. Plus la source est distale, plus le sang est rouge vif ; un sang marron ou mêlé de caillots oriente vers le côlon droit ou le grêle.</p>
<div class="lab">Piège</div><p>Une hémorragie haute massive peut traverser l’intestin assez vite pour sortir rouge. Elle s’accompagne alors d’un choc. C’est pourquoi l’ESGE 2021 recommande une gastroscopie chez le patient instable avec hématochézie, sauf si l’angioscanner a déjà localisé la source dans le côlon.</p>
<div class="lab">Conséquence pratique</div><p>Chez le patient stable, le score d’Oakland décide de la sortie ou de l’hospitalisation ; chez le patient instable, l’angioscanner vient en premier.</p></template>
<template data-pop="k92-src-esge" data-title="Référentiels : ESGE 2021 et autres recommandations">
<div class="lab">Ce qui est retenu</div><p>Ce cours suit les deux recommandations de la Société européenne d’endoscopie gastro-intestinale publiées en 2021 : hémorragie haute non variqueuse (Gralnek et al., Endoscopy 2021;53:300–332) et hémorragie basse (Triantafyllou et al., Endoscopy 2021;53:850–868). Leurs textes intégraux ont été lus le 08.10.2026 sur esge.com.</p>
<div class="lab">Pourquoi ce choix</div><p>Aucune recommandation nationale suisse de l’hémorragie digestive n’a été retrouvée le 08.10.2026. Les centres suisses appliquent les recommandations européennes. Les recommandations américaines plus récentes (ACG 2021 pour le haut, ACG 2023 pour le bas) concordent sur les points majeurs : sortie à score de Glasgow-Blatchford de 0 ou 1, transfusion à 70 g/L, endoscopie dans les 24 heures, coloscopie non urgente.</p>
<div class="lab">Divergences</div><p>Le groupe de consensus international 2019 propose un seuil transfusionnel de 80 g/L sans maladie cardiovasculaire ; l’ESGE 2021 et l’ACG 2021, plus récents, retiennent 70 g/L. L’ESGE recommande l’érythromycine (forte), l’ACG la suggère. La recommandation de l’ESGE sur l’hémorragie basse annonce une révision en 2026 ; elle n’était pas publiée le 08.10.2026.</p>
<div class="lab">Limites</div><p>Les niveaux de preuve sont souvent faibles, notamment pour les antithrombotiques. Les recommandations de 2021 restent celles en vigueur à la date de rédaction.</p></template>
<template data-pop="k92-codage" data-title="Codage de l’hémorragie digestive (CIM-10-GM 2024)">
<div class="lab">Règle</div><p>Le code K92.0, K92.1 ou K92.2 décrit un symptôme hémorragique de cause non précisée. Dès que la cause est connue, le codeur utilise le code de la lésion, car la CIM-10-GM exclut ces causes de K92.2 (BfArM, bloc K90–K93, consulté le 08.10.2026).</p>
<div class="lab">Exclusions de K92.2</div><p>Ulcère gastroduodénal avec hémorragie (K25 à K28) ; gastrite hémorragique aiguë (K29.0) ; angiodysplasie gastroduodénale avec saignement (K31.82) ; angiodysplasie du côlon (K55.22) et du grêle (K55.32) avec hémorragie ; hémorragie de l’anus et du rectum (K62.5) ; hémorragie de l’œsophage (K22.81). La catégorie K92 exclut aussi l’hémorragie digestive du nouveau-né (P54).</p>
<div class="lab">Codes résiduels</div><p>K92.8 regroupe d’autres maladies digestives précisées qui n’ont pas de code propre ; K92.9 désigne une maladie digestive non précisée. Leur emploi doit rester exceptionnel, car un diagnostic précis possède presque toujours un code dédié.</p>
<div class="lab">Exemple</div><p>M. Rossier est codé K92.1 à l’admission. Après la gastroscopie, son diagnostic devient un ulcère duodénal aigu avec hémorragie, codé dans K26 ; le code K92.1 disparaît.</p></template>
<template data-pop="k92-treitz" data-title="Angle de Treitz">
<div class="lab">Anatomie</div><p>L’angle duodéno-jéjunal est la jonction entre la quatrième portion du duodénum et le jéjunum, à gauche de la deuxième vertèbre lombaire. Il est suspendu par le muscle suspenseur du duodénum, appelé ligament de Treitz.</p>
<div class="lab">Intérêt clinique</div><p>Il sert de frontière entre l’hémorragie haute et le reste du tube digestif. Cette frontière correspond à la portée d’une gastroscopie standard, qui s’arrête au deuxième ou au troisième duodénum.</p>
<div class="lab">Limite</div><p>L’ESGE 2021 définit l’hémorragie basse à partir de la valvule iléo-cæcale. Le segment compris entre l’angle de Treitz et cette valvule correspond au grêle, exploré par la vidéocapsule et l’entéroscopie.</p></template>
<template data-pop="k92-baro" data-title="Baroréflexe et réponse à l’hémorragie">
<div class="lab">Normal</div><p>Les barorécepteurs du sinus carotidien et de la crosse aortique sont des terminaisons nerveuses sensibles à l’étirement de la paroi artérielle. Ils informent en permanence le tronc cérébral de la pression artérielle.</p>
<div class="lab">Perturbation</div><p>Quand la volémie baisse, l’étirement diminue et la décharge des barorécepteurs ralentit. Le tronc cérébral réduit le tonus vagal et augmente le tonus sympathique. La fréquence cardiaque, la contractilité et les résistances vasculaires augmentent ; les veines se contractent et remobilisent le sang qu’elles contiennent.</p>
<div class="lab">Conséquence clinique</div><p>La pression reste longtemps normale. La tachycardie, la pâleur et les extrémités froides apparaissent avant l’hypotension. Un bêtabloquant ou un stimulateur cardiaque à fréquence fixe empêchent la tachycardie et masquent la gravité.</p>
<div class="lab">Décision</div><p>Le médecin juge la gravité sur l’ensemble des constantes, sur la conscience et sur la diurèse, et pas sur la seule pression.</p></template>
<template data-pop="k92-phcoag" data-title="Acide gastrique et coagulation">
<div class="lab">Donnée de base</div><p>Green et al. (Gastroenterology 1978) ont étudié in vitro l’effet du pH sur la coagulation. Tous les tests étaient anormaux dès pH 6,8. À pH 6,4, les temps de coagulation doublaient et l’agrégation plaquettaire baissait de plus de moitié. À pH 5,4, la coagulation et l’agrégation étaient pratiquement abolies, et les agrégats formés se désagrégeaient ; la pepsine accentuait cette désagrégation.</p>
<div class="lab">Conséquence</div><p>Le contenu gastrique, à pH inférieur à 2, empêche le caillou de se former et de durer sur un ulcère. Maintenir un pH supérieur à 6 est l’objectif de la perfusion continue d’inhibiteur de la pompe à protons après l’hémostase.</p>
<div class="lab">Limite</div><p>Il s’agit d’une étude de laboratoire. Le bénéfice clinique de l’inhibiteur repose sur les essais randomisés après hémostase endoscopique, résumés par l’ESGE 2021.</p></template>
<template data-pop="k92-gda" data-title="Artère gastroduodénale">
<div class="lab">Anatomie</div><p>Branche de l’artère hépatique commune, elle descend derrière la face postérieure du premier duodénum avant de se diviser en artères gastro-omentale droite et pancréatico-duodénales supérieures.</p>
<div class="lab">Intérêt clinique</div><p>Un ulcère de la face postérieure du bulbe peut éroder sa paroi et donner une hémorragie massive. L’ESGE 2021 cite l’artère gastroduodénale et l’artère gastrique gauche parmi les zones vasculaires à haut risque, où un clip monté sur capuchon peut être envisagé en première intention.</p>
<div class="lab">Conséquence pratique</div><p>Ces ulcères échouent plus souvent au traitement endoscopique. Le radiologue interventionnel peut emboliser l’artère gastroduodénale ; l’irrigation collatérale du duodénum limite l’ischémie.</p></template>
<template data-pop="k92-hbretard" data-title="Hémoglobine initiale faussement rassurante">
<div class="lab">Mécanisme</div><p>Au moment de la perte, le sang perdu contient globules et plasma dans la même proportion que le sang restant. La concentration d’hémoglobine ne change donc presque pas. Elle baisse quand le liquide interstitiel puis les perfusions diluent le sang restant, ce qui prend 24 à 72 heures.</p>
<div class="lab">Exemple</div><p>Un homme de 70 kg a environ 5 litres de sang à 150 g/L. S’il perd rapidement 1 litre, son hémoglobine reste proche de 150 g/L. Quand son volume est reconstitué à 5 litres par dilution, elle descend vers 120 g/L.</p>
<div class="lab">Piège</div><p>Une hémoglobine normale à l’admission ne permet pas de conclure à une hémorragie mineure. À l’inverse, une chute après deux litres de cristalloïdes peut traduire la dilution plus que la récidive.</p>
<div class="lab">Décision</div><p>Le médecin juge la gravité sur les constantes et répète l’hémoglobine après quelques heures. La transfusion suit le seuil restrictif chez le patient stable et le débit du saignement chez le patient instable.</p></template>
<template data-pop="k92-uree" data-title="Urée élevée dans l’hémorragie haute">
<div class="lab">Pourquoi la doser</div><p>L’urée est l’élément le plus pondéré du score de Glasgow-Blatchford, de 2 points dès 6,5 mmol/L à 6 points à 25 mmol/L ou plus.</p>
<div class="lab">Mécanisme</div><p>Les protéines du sang versé dans l’estomac sont digérées et absorbées ; le foie transforme leur azote en urée. L’hypovolémie diminue en même temps la filtration glomérulaire, ce qui réduit l’élimination de l’urée. La créatinine, qui ne dépend pas de l’apport protéique, s’élève moins.</p>
<div class="lab">Interprétation</div><p>Une urée élevée avec une créatinine normale oriente vers une source haute et une hypovolémie. Aucun seuil du rapport urée sur créatinine n’est validé pour exclure une source basse.</p>
<div class="lab">Piège</div><p>L’insuffisance rénale chronique élève l’urée indépendamment du saignement et surestime le score. Une urée normale n’exclut pas une hémorragie haute débutante.</p></template>
<template data-pop="k92-syncope" data-title="Syncope au cours d’une hémorragie digestive">
<div class="lab">Mécanisme</div><p>La syncope traduit une baisse transitoire de la perfusion cérébrale. Au cours d’une hémorragie, elle survient souvent au lever, quand la redistribution du sang vers les jambes s’ajoute à l’hypovolémie, ou lors d’une défécation avec réflexe vagal.</p>
<div class="lab">Valeur</div><p>Elle ajoute 2 points au score de Glasgow-Blatchford, autant qu’une insuffisance cardiaque, car elle signe une perte suffisante pour dépasser les compensations.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, une chute ou une confusion peuvent être la seule trace d’une syncope ; l’hémorragie se découvre au toucher rectal.</p></template>
<template data-pop="k92-shock" data-title="Indice de choc">
<div class="lab">Définition</div><p>L’indice de choc est le rapport entre la fréquence cardiaque et la pression artérielle systolique. Chez l’adulte sain, il est inférieur à 0,7 ; par exemple, 70 / 120 = 0,58.</p>
<div class="lab">Mécanisme</div><p>Le baroréflexe augmente la fréquence avant que la pression ne baisse. Le rapport augmente donc plus tôt que chacune des deux valeurs prise seule.</p>
<div class="lab">Valeur</div><p>La British Society of Gastroenterology (2019) définit l’instabilité de l’hémorragie basse par un indice supérieur à 1 et propose alors un angioscanner ; ce seuil est rapporté ici d’après le résumé et des sources secondaires, le texte intégral n’ayant pas été accessible le 08.10.2026. L’indice de choc ne remplace pas les scores validés, qui intègrent l’hémoglobine et les comorbidités.</p>
<div class="lab">Piège</div><p>Un bêtabloquant, un stimulateur cardiaque ou une hypertension habituelle faussent le calcul.</p></template>
<template data-pop="k92-hepato" data-title="Signes d’hépatopathie chronique">
<div class="lab">Signes</div><p>Angiomes stellaires du thorax, érythrose palmaire, gynécomastie, ictère, ascite, circulation veineuse collatérale abdominale, splénomégalie, astérixis.</p>
<div class="lab">Mécanisme</div><p>Ces signes traduisent l’insuffisance hépatocellulaire, qui perturbe le métabolisme des œstrogènes, et l’hypertension portale, qui ouvre des voies de dérivation veineuse et fait apparaître des varices.</p>
<div class="lab">Conséquence pratique</div><p>Leur présence fait suspecter une rupture variceuse. Le médecin débute dès l’arrivée un médicament vasoactif et une antibioprophylaxie et organise une gastroscopie dans les 12 heures (cours I85). Une hépatopathie connue ajoute 2 points au score de Glasgow-Blatchford.</p></template>
<template data-pop="k92-tr" data-title="Toucher rectal">
<div class="lab">Technique</div><p>Le patient est en décubitus latéral gauche, genoux fléchis. Le médecin inspecte la marge anale, puis introduit l’index ganté et lubrifié, palpe les parois du rectum et regarde le doigtier.</p>
<div class="lab">Normal</div><p>La muqueuse est souple, sans masse ; le doigtier ramène des selles brunes.</p>
<div class="lab">Pathologique</div><p>Un méléna, du sang rouge, des caillots ou une masse rectale. Une fissure ou des hémorroïdes visibles n’expliquent pas forcément un saignement abondant.</p>
<div class="lab">Valeur</div><p>Le sang au doigtier ajoute 1 point au score d’Oakland. L’ESGE 2021 inclut le toucher rectal dans l’évaluation initiale de toute hémorragie basse.</p></template>
<template data-pop="k92-sng" data-title="Sonde nasogastrique">
<div class="lab">Recommandation</div><p>L’ESGE 2021 ne recommande pas l’aspiration ou le lavage par sonde nasogastrique ou orogastrique en routine (recommandation forte, niveau de preuve modéré).</p>
<div class="lab">Raisons</div><p>L’aspiration ne distingue pas de façon fiable une source haute d’une source basse chez le patient avec méléna ; un aspirat clair n’exclut pas un ulcère duodénal, car le pylore peut empêcher le reflux du sang. Le lavage n’améliore ni la visibilité de façon démontrée ni le pronostic, et il est mal toléré.</p>
<div class="lab">Alternative</div><p>Pour vider l’estomac avant l’endoscopie, l’érythromycine par voie intraveineuse est recommandée chez le patient qui saigne activement.</p></template>
<template data-pop="k92-varices" data-title="Quand suspecter une rupture variceuse">
<div class="lab">Indices</div><p>Cirrhose connue, consommation d’alcool importante, hépatite chronique, signes d’hépatopathie à l’examen, thrombopénie associée à un INR élevé, antécédent de varices ou de ligature.</p>
<div class="lab">Pourquoi suspecter avant de prouver</div><p>La rupture variceuse a une mortalité plus élevée que l’hémorragie ulcéreuse. Le médicament vasoactif réduit la pression portale et l’antibioprophylaxie réduit les infections et la récidive ; leur bénéfice dépend de la précocité.</p>
<div class="lab">Renvoi</div><p>Les doses de terlipressine, d’octréotide et de ceftriaxone, le délai de 12 heures pour l’endoscopie, la ligature, le seuil transfusionnel et le shunt portosystémique sont traités dans I85 — Varices œsophagiennes et varices d’autres localisations (C-01-Cardiologie), îlot 8.</p></template>
<template data-pop="k92-fae" data-title="Fistule aorto-entérique">
<div class="lab">Définition</div><p>Communication entre l’aorte et le tube digestif, le plus souvent la troisième ou quatrième portion du duodénum. Elle est surtout secondaire à une prothèse aortique ; la forme primitive, sur anévrisme, est plus rare.</p>
<div class="lab">Présentation</div><p>Un petit saignement « sentinelle » qui cesse spontanément précède souvent une hémorragie massive. Une fièvre évoque une infection de prothèse associée.</p>
<div class="lab">Piège</div><p>La gastroscopie standard ne va pas toujours jusqu’au troisième duodénum et peut être normale. Un saignement bref chez un porteur de prothèse aortique impose un angioscanner sans attendre.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement est chirurgical ou endovasculaire, en urgence, avec les chirurgiens vasculaires.</p></template>
<template data-pop="k92-mw" data-title="Syndrome de Mallory-Weiss">
<div class="lab">Définition</div><p>Déchirure longitudinale de la muqueuse de la jonction œso-gastrique, provoquée par des efforts de vomissement. Elle est codée dans la catégorie K22 (cours K22).</p>
<div class="lab">Mécanisme</div><p>Le vomissement crée une hausse brutale de la pression intragastrique contre un cardia mal relâché ; la muqueuse se déchire. La déchirure ouvre des vaisseaux muqueux et sous-muqueux de petit calibre.</p>
<div class="lab">Indice</div><p>Des vomissements sans sang précèdent l’hématémèse : alcool, gastro-entérite, grossesse, chimiothérapie.</p>
<div class="lab">Évolution</div><p>Le saignement s’arrête spontanément dans la grande majorité des cas. Un saignement actif à l’endoscopie se traite par clip ou par moyen thermique.</p></template>
<template data-pop="k92-dieulafoy" data-title="Lésion de Dieulafoy">
<div class="lab">Définition</div><p>Artère sous-muqueuse de calibre anormalement large, qui ne se ramifie pas et affleure la muqueuse, le plus souvent dans l’estomac proximal, le long de la petite courbure.</p>
<div class="lab">Mécanisme</div><p>Une érosion minuscule de la muqueuse suffit à ouvrir cette artère : le saignement est massif, artériel et intermittent, sans ulcère visible autour.</p>
<div class="lab">Piège</div><p>Entre deux épisodes, la lésion peut être invisible. Une gastroscopie normale chez un patient qui a saigné massivement doit être répétée, au besoin après vidange par érythromycine.</p>
<div class="lab">Traitement</div><p>Hémostase endoscopique mécanique ou thermique ; embolisation en cas d’échec.</p></template>
<template data-pop="k92-angiodys" data-title="Angiodysplasie">
<div class="lab">Définition</div><p>Dilatation de veines et de capillaires de la muqueuse et de la sous-muqueuse, à paroi fine, sans inflammation. Elle siège dans l’estomac, le grêle ou le côlon droit.</p>
<div class="lab">Terrain</div><p>Sujet âgé, insuffisance rénale chronique et sténose aortique. Dans la sténose aortique, une perte acquise des grands multimères du facteur de von Willebrand favoriserait le saignement ; ce lien est décrit sous le nom de syndrome de Heyde.</p>
<div class="lab">Présentation</div><p>Saignement lent et récidivant, anémie ferriprive, parfois hémorragie visible.</p>
<div class="lab">Traitement</div><p>L’ESGE 2021 recommande la coagulation au plasma d’argon pour l’angiodysplasie colique qui saigne. Les angiodysplasies du grêle et du côlon sont traitées dans K55, celles de l’estomac et du duodénum dans K31.</p></template>
<template data-pop="k92-capsule" data-title="Vidéocapsule du grêle">
<div class="lab">Principe</div><p>Caméra miniature avalée, qui transmet des images de la muqueuse pendant le transit du grêle.</p>
<div class="lab">Recommandation</div><p>L’ESGE 2022 (Pennazio et al., Endoscopy 2023) recommande la vidéocapsule comme premier examen d’un saignement suspect du grêle (recommandation forte, niveau de preuve modéré), dès que possible et idéalement dans les 48 heures après un saignement visible (recommandation forte, niveau de preuve élevé). Elle ne recommande pas de répéter systématiquement gastroscopie et coloscopie avant la capsule.</p>
<div class="lab">Limites</div><p>La capsule ne permet ni biopsie ni traitement ; l’entéroscopie assistée par dispositif confirme et traite. Elle peut se bloquer dans une sténose.</p>
<div class="lab">Décision</div><p>Une capsule de bonne qualité et normale autorise une attitude conservatrice selon l’ESGE 2022.</p></template>
