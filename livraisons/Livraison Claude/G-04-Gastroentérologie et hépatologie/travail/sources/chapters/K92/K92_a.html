<section class="ilot" id="k92-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. Rossier, 72 ans, retraité à Fribourg, arrive aux urgences un samedi à 7 heures. Depuis deux jours, ses selles sont noires, collantes et malodorantes. Ce matin, il a fait un malaise en se levant et s’est réveillé au sol. Il prend de l’aspirine 100 mg par jour depuis la pose d’un stent coronaire il y a quatre ans. Depuis trois semaines, il prend aussi de l’ibuprofène 400 mg trois fois par jour pour une gonarthrose. Sa fréquence cardiaque est de 108 par minute, sa pression artérielle systolique de 98 mmHg. Son hémoglobine est de 92 g/L et son urée de 14,2 mmol/L.</p>
<p>La question qui structure ce chapitre est la suivante : <b>ce patient saigne-t-il du tube digestif haut ou bas, à quel point son état est-il grave, que faut-il faire dans la première heure, quand faut-il l’endoscoper, et que faire de son aspirine ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître une <button class="w" data-k="k92-hematemese">hématémèse (sang vomi, rouge ou en marc de café)</button>, un <button class="w" data-k="k92-melena">méléna (selles noires de sang digéré)</button> et une <button class="w" data-k="k92-hematochezie">hématochézie (sang rouge ou marron par l’anus)</button>. Il évalue la gravité par les constantes et par un score validé. Il réanime sans transfuser à l’excès, prescrit un inhibiteur de la pompe à protons à bon escient, organise l’endoscopie au bon moment et gère les antithrombotiques. Le référentiel principal est celui de l’<button class="w" data-k="k92-src-esge">ESGE (deux recommandations de 2021)</button>, suivi en Suisse en l’absence de recommandation nationale propre.</p>
<div class="key"><b>Message fondateur.</b> La gravité d’une hémorragie digestive se lit d’abord sur les constantes et sur l’état de conscience, et non sur l’hémoglobine initiale. Dans les premières heures, le sang perdu emporte globules rouges et plasma en même temps : la concentration d’hémoglobine reste presque normale tant que l’organisme n’a pas dilué le sang restant. Un patient tachycarde et hypotendu avec 130 g/L d’hémoglobine saigne gravement.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="k92-treitz">angle duodéno-jéjunal de Treitz (limite entre haut et bas)</button>, la <button class="w" data-k="k92-baro">réponse hémodynamique à l’hémorragie (baroréflexe et vasoconstriction)</button> et le <button class="w" data-k="k92-phcoag">rôle de l’acide gastrique sur la coagulation</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="k92-1"><h2><span class="n">1</span>Définitions, classification et codage</h2>
<p>Une hémorragie digestive est un saignement dont la source se trouve entre la bouche et l’anus. Le médecin la classe d’abord selon le siège de la source, car le siège oriente l’examen qui la trouvera et la traitera. Il la classe ensuite selon sa gravité, car la gravité décide du lieu de soins et du délai de l’endoscopie.</p>
<h3>1.1 Siège : haut, grêle et bas</h3>
<p>L’hémorragie <b>haute</b> provient de l’œsophage, de l’estomac ou du duodénum, en amont de l’angle de Treitz. Elle est accessible à la gastroscopie, que l’on appelle aussi œso-gastro-duodénoscopie. L’hémorragie <b>basse</b> provient, selon la définition de l’ESGE de 2021, d’un site situé en aval de la valvule iléo-cæcale, rectum compris. Entre les deux, l’hémorragie du <b>grêle</b> provient du jéjunum ou de l’iléon. Elle n’est vue ni par la gastroscopie standard, ni par la coloscopie, et se cherche par la <button class="w" data-k="k92-capsule">vidéocapsule endoscopique</button>.</p>
<h3>1.2 Mode de présentation</h3>
<p>Le mode de présentation dépend du siège, du débit et du temps de transit. Le sang qui séjourne plusieurs heures dans l’intestin est transformé en pigment noir : il donne un méléna. Le sang qui sort vite reste rouge. Un même ulcère duodénal donne donc un méléna s’il saigne lentement, et une hématochézie s’il saigne de façon massive.</p>
<table class="t"><tr><th>Présentation</th><th>Ce que voit le patient</th><th>Siège le plus probable</th><th>Piège</th></tr>
<tr><td>Hématémèse</td><td>Vomissement de sang rouge ou de caillots</td><td>Haut, en amont de Treitz</td><td>Sang dégluti d’une épistaxis ; hémoptysie</td></tr>
<tr><td>Vomissement en marc de café</td><td>Vomissement brun-noir granuleux</td><td>Haut, saignement lent ou arrêté</td><td>Ne signe pas l’absence de gravité</td></tr>
<tr><td>Méléna</td><td>Selles noires, goudronneuses, collantes, malodorantes</td><td>Haut le plus souvent ; possible grêle ou côlon droit</td><td>Selles noires du fer ou du bismuth</td></tr>
<tr><td>Hématochézie</td><td>Sang rouge ou marron par l’anus</td><td>Bas le plus souvent</td><td>Hémorragie haute massive avec choc</td></tr>
<tr><td>Saignement occulte</td><td>Rien ; anémie ferriprive</td><td>N’importe quel segment</td><td>Code R19.5, hors de K92</td></tr></table>
<p>Le tableau se lit en deux temps. Le médecin repère d’abord la présentation, qui donne une probabilité de siège. Il cherche ensuite le piège de la ligne, car chaque présentation a son imitateur. Par exemple, une femme qui vomit du sang rouge après une épistaxis nocturne n’a pas d’hématémèse vraie : un examen du nasopharynx précède la gastroscopie.</p>
<h3>1.3 Gravité</h3>
<p>L’ESGE ne fixe pas une classification unique de la gravité. Elle utilise des seuils décisionnels. En hémorragie haute, un <button class="w" data-k="k92-gbs">score de Glasgow-Blatchford (0 à 23 points)</button> de 0 ou 1 définit un très faible risque et autorise une prise en charge ambulatoire. En hémorragie basse, un saignement qui s’est arrêté spontanément sans critère de gravité et avec un <button class="w" data-k="k92-oakland">score d’Oakland (0 à 35 points)</button> de 8 ou moins est qualifié de mineur. Tout autre saignement bas est majeur, avec ou sans instabilité hémodynamique.</p>
<h3>1.4 Codage CIM-10-GM 2024</h3>
<p>La catégorie K92 rassemble des codes de symptôme hémorragique et des codes résiduels. Le médecin code le symptôme seulement si la cause n’est pas connue. Dès que l’endoscopie a trouvé la lésion, il code la lésion, car la CIM-10-GM exclut expressément plusieurs causes de K92.2. La <button class="w" data-k="k92-codage">règle de codage détaillée</button> est expliquée dans sa fenêtre.</p>
<table class="t"><tr><th>Code</th><th>Intitulé (BfArM, CIM-10-GM 2024)</th><th>Usage</th></tr>
<tr><td>K92.0</td><td>Hématémèse</td><td>Vomissement de sang de cause non précisée</td></tr>
<tr><td>K92.1</td><td>Méléna</td><td>Selles noires de sang de cause non précisée ; le sang occulte est exclu (R19.5)</td></tr>

<tr><td>K92.9</td><td>Maladie du système digestif, sans précision</td><td>Diagnostic digestif non précisé</td></tr></table>
<p>Ce tableau montre que K92 sert de point d’entrée et non de diagnostic final. Les exclusions de K92.2 renvoient aux cours voisins : l’ulcère hémorragique à <a href="#/entry/K25">K25 — Ulcère gastroduodénal (G-04-Gastroentérologie et hépatologie)</a>, la gastrite hémorragique aiguë K29.0 et l’angiodysplasie gastroduodénale K31.82 à K29, l’hémorragie de l’œsophage K22.81 à K22, les angiodysplasies du côlon K55.22 et du grêle K55.32 à K55, et l’hémorragie de l’anus et du rectum K62.5 à <a href="#/entry/K63">K63 — Polypes colorectaux et autres maladies de l’intestin (G-04-Gastroentérologie et hépatologie)</a>. L’hémorragie du nouveau-né relève de la catégorie P54.</p>
<div class="key"><b>À retenir.</b> Le siège se définit par rapport à l’angle de Treitz et à la valvule iléo-cæcale. La présentation (hématémèse, méléna, hématochézie) oriente vers le siège, mais un débit élevé peut faire sortir rouge un sang d’origine haute. Le code K92 décrit un symptôme ; il est remplacé par le code de la lésion dès qu’elle est trouvée. L’îlot suivant donne la fréquence et le pronostic de ces hémorragies.</div>
</section>

<section class="ilot" id="k92-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’hémorragie digestive est une urgence fréquente, dont la mortalité dépend surtout de l’âge et des maladies associées. Les données suisses publiées sont hospitalières ; aucune incidence nationale suisse n’a été retrouvée le 08.10.2026.</p>
<h3>2.1 Hémorragie haute</h3>
<p>Aux États-Unis, l’incidence annuelle de l’hémorragie haute non variqueuse était d’environ 67 pour 100 000 habitants en 2012, avec une mortalité de 1 à 5 % (Lanas et al., Nature Reviews Disease Primers 2018). L’ulcère gastroduodénal reste la première cause ; il est lié surtout à <i>Helicobacter pylori</i>, aux anti-inflammatoires non stéroïdiens (AINS) et à l’aspirine à faible dose.</p>
<p>En Suisse romande, une étude des urgences d’un hôpital universitaire a inclus 1521 patients consécutifs pour hémorragie haute (Eur J Emerg Med 2023). L’âge médian était de 68 ans et 62 % étaient des hommes. Au total, 28 % ont eu besoin d’une transfusion, d’un geste endoscopique ou chirurgical, ou sont décédés ; 5 % sont décédés à l’hôpital. Le score de Glasgow-Blatchford y discriminait le mieux le besoin d’intervention ou le décès. Un seul patient avec un score de 0 a eu besoin d’un geste endoscopique.</p>
<h3>2.2 Hémorragie basse</h3>
<p>Le premier audit national britannique a inclus 2528 hémorragies basses en 2015 (Oakland et al., Gut 2018). L’âge médian était de 74 ans. Au total, 29,4 % des patients prenaient un antiagrégant et 15,9 % un anticoagulant. Le choc était rare (2,3 %), mais 26,3 % ont été transfusés. Les causes principales étaient le saignement diverticulaire (26,4 %) et les lésions anorectales bénignes (16,7 %). La mortalité hospitalière était de 3,4 %. Elle dépendait des maladies associées et non de l’abondance du saignement : elle atteignait 17,8 % chez les patients déjà hospitalisés pour une autre raison.</p>
<h3>2.3 Ce qui fait mourir</h3>
<p>Les patients meurent rarement d’exsanguination. Ils meurent surtout de la décompensation d’une maladie préexistante, que l’anémie et l’hypovolémie aggravent : ischémie myocardique, insuffisance cardiaque, insuffisance rénale aiguë, pneumonie d’inhalation, décompensation d’une cirrhose. Cette observation explique pourquoi les scores de risque intègrent l’insuffisance cardiaque et l’hépatopathie, et pourquoi la récidive hémorragique est le facteur pronostique modifiable le plus important. Dans l’audit britannique, la mortalité doublait presque en cas de récidive (7,1 %).</p>
<div class="key"><b>À retenir.</b> L’hémorragie haute non variqueuse tue 1 à 5 % des patients, l’hémorragie basse environ 3 %, surtout par décompensation des comorbidités. Près d’un patient sur trois atteint d’hémorragie haute aux urgences a besoin d’une intervention ; une minorité peut rentrer à domicile. La physiopathologie suivante explique ces chiffres.</div>
</section>

<section class="ilot" id="k92-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le saignement digestif résulte de la rencontre entre une lésion de la paroi et un vaisseau. Sa gravité dépend du calibre du vaisseau atteint, de la capacité de l’organisme à former un caillou stable et de sa réserve hémodynamique.</p>
<h3>3.1 De la lésion au saignement</h3>
<p>Chez le sujet sain, la muqueuse digestive est protégée par le mucus, le bicarbonate et un renouvellement rapide de l’épithélium. Une <b>érosion</b> reste dans la muqueuse : elle ne franchit pas la musculaire muqueuse et saigne peu, par des capillaires. Un <b>ulcère</b> franchit la musculaire muqueuse et atteint la sous-muqueuse, où cheminent des artérioles de plus gros calibre. Quand l’ulcère creuse jusqu’à la paroi d’une artère, il l’ouvre : le saignement devient artériel. C’est pourquoi un ulcère de la face postérieure du bulbe duodénal est redouté : il peut ouvrir l’<button class="w" data-k="k92-gda">artère gastroduodénale</button>, qui passe juste derrière.</p>
<h3>3.2 Pourquoi l’estomac entretient le saignement</h3>
<p>L’acide gastrique gêne l’hémostase. In vitro, l’agrégation plaquettaire et la coagulation plasmatique sont perturbées dès un pH de 6,8 et presque abolies à un pH de 5,4 ; la pepsine dissout en outre les agrégats déjà formés (Green et al., Gastroenterology 1978). Le pH gastrique normal est inférieur à 2. Cette donnée de laboratoire fonde l’emploi d’un inhibiteur de la pompe à protons à forte dose après l’hémostase endoscopique : en maintenant un pH élevé, il stabilise le caillou qui obture le vaisseau.</p>
<h3>3.3 Réponse de l’organisme à la perte de sang</h3>
<p>La perte de volume baisse le retour veineux et le débit cardiaque. Les barorécepteurs carotidiens et aortiques détectent la baisse de pression et activent le système sympathique. Le cœur accélère et les artérioles de la peau, du tube digestif et du rein se contractent. La pression artérielle est ainsi maintenue au prix d’une tachycardie, d’une pâleur et d’une oligurie. Elle ne chute qu’après une perte importante, ce qui fait de la <button class="w" data-k="k92-shock">tachycardie et de l’indice de choc</button> des signes plus précoces que l’hypotension. Un bêtabloquant masque la tachycardie et retire ce signal d’alarme.</p>
<p>La concentration d’hémoglobine ne baisse qu’avec retard. Le liquide interstitiel puis les perfusions diluent progressivement le sang restant ; la baisse complète demande souvent 24 à 72 heures. La <button class="w" data-k="k92-hbretard">fenêtre sur l’hémoglobine initiale</button> détaille ce piège.</p>
<h3>3.4 Pourquoi l’urée augmente et les selles noircissent</h3>
<p>Le sang versé dans l’estomac est digéré. Ses protéines, surtout l’hémoglobine, sont dégradées en acides aminés absorbés par l’intestin grêle ; le foie transforme leur azote en urée. L’hypovolémie réduit en outre la filtration glomérulaire et la clairance de l’urée. L’<button class="w" data-k="k92-uree">urée élevée</button> signale donc à la fois un saignement d’origine haute et une hypovolémie, ce qui explique son poids dans le score de Glasgow-Blatchford. Au cours du transit, l’acide et les bactéries oxydent l’hème en pigments noirs : c’est l’origine du <button class="w" data-k="k92-melena">méléna</button>.</p>

<p>La figure se lit de gauche à droite, dans le sens du transit. Plus la source est haute et plus le sang séjourne longtemps dans l’intestin, plus il est noir. Un patient en choc avec du sang rouge par l’anus peut donc saigner d’un ulcère duodénal ; dans ce cas, le sang a traversé tout l’intestin trop vite pour être digéré.</p>
<div class="key"><b>À retenir.</b> Un ulcère saigne gravement quand il atteint une artère de la sous-muqueuse. L’acide gastrique empêche le caillou de se former et de tenir, d’où l’intérêt d’élever le pH. La tachycardie précède l’hypotension et l’hémoglobine baisse avec retard. L’urée monte quand le sang est digéré et quand le rein est moins perfusé. Les causes concrètes de ces lésions suivent.</div>
</section>

<section class="ilot" id="k92-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La cause d’une hémorragie digestive détermine son traitement définitif. Le médecin raisonne par siège, puis par terrain, car le terrain rend certaines causes beaucoup plus probables. Chaque cause a son propre cours ; ce chapitre traite la démarche commune.</p>
<h3>4.1 Causes de l’hémorragie haute</h3>

<tr><td>Cancer de l’œsophage ou de l’estomac</td><td>Tumeur ulcérée et friable</td><td>Amaigrissement, dysphagie, anémie chronique</td><td>Fragment O-09</td></tr>
<tr><td><button class="w" data-k="k92-fae">Fistule aorto-entérique</button></td><td>Communication entre l’aorte et le duodénum</td><td>Prothèse aortique, petit saignement « sentinelle »</td><td>Chirurgie vasculaire</td></tr></table>
<p>Ce tableau se lit à partir de l’indice clinique. Le médecin cherche d’abord l’indice qui change la conduite immédiate : une cirrhose impose la prise en charge de la rupture variceuse dès la suspicion, et une prothèse aortique impose l’angioscanner sans attendre. Chez M. Rossier, l’association aspirine, ibuprofène et méléna rend l’ulcère gastroduodénal de loin le plus probable.</p>
<h3>4.2 Causes de l’hémorragie basse</h3>
<p>Le saignement diverticulaire est la première cause hospitalière, suivi des lésions anorectales bénignes (hémorroïdes, fissure). Viennent ensuite la colite ischémique, les colites inflammatoires, l’hémorragie après polypectomie, le cancer colorectal, les angiodysplasies et la rectite radique. Dans l’audit britannique, aucune cause n’a été trouvée chez près d’un patient sur quatre (22,8 % selon l’ESGE 2021). Les cours de référence sont <a href="#/entry/K57">K57 — Diverticulose et diverticulite (G-04-Gastroentérologie et hépatologie)</a>, K64 pour les hémorroïdes, K55 pour la colite ischémique, K50 et K51 pour les maladies inflammatoires, et K63 pour les polypes et l’hémorragie anorectale.</p>
<h3>4.3 Facteurs de risque</h3>
<p>Les facteurs de risque agissent de deux manières. Certains créent la lésion : les AINS inhibent la synthèse des prostaglandines protectrices de la muqueuse, <i>Helicobacter pylori</i> entretient une inflammation ulcérogène. D’autres font saigner une lésion existante : l’aspirine bloque durablement la fonction plaquettaire, les anticoagulants retardent la formation de fibrine. L’association des deux familles multiplie le risque, ce qui est exactement la situation de M. Rossier. Pour le saignement diverticulaire, l’ESGE cite l’alcool, le tabac, les AINS, l’aspirine et les autres antiagrégants comme facteurs indépendants. Ces données sont des associations observationnelles ; le mécanisme plaquettaire rend toutefois la causalité plausible pour les antithrombotiques.</p>
<div class="key"><b>À retenir.</b> En hémorragie haute, l’ulcère domine ; la cirrhose oriente vers les varices, une prothèse aortique vers la fistule. En hémorragie basse, le diverticule et la pathologie anorectale dominent. L’association d’un AINS et d’un antithrombotique est le facteur évitable le plus fréquent. L’anamnèse doit rechercher chacun de ces éléments.</div>
</section>

<section class="ilot" id="k92-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse d’une hémorragie digestive poursuit trois buts : confirmer qu’il s’agit bien de sang d’origine digestive, estimer le siège et la gravité, et trouver la cause et les médicaments à gérer. Elle se fait pendant la réanimation, jamais à sa place.</p>
<h3>5.1 Le saignement lui-même</h3>
<p>Le médecin demande la couleur, le moment de début, le nombre d’épisodes et la présence de caillots. Il demande si des vomissements sans sang ont précédé l’hématémèse : cette chronologie oriente vers un <button class="w" data-k="k92-mw">syndrome de Mallory-Weiss</button>. Il demande si le patient a eu un malaise ou une perte de connaissance : la <button class="w" data-k="k92-syncope">syncope</button> traduit une hypoperfusion cérébrale et ajoute 2 points au score de Glasgow-Blatchford. Il vérifie enfin que le sang ne vient pas du nez ou des poumons.</p>
<h3>5.2 Les médicaments</h3>
<p>La liste des médicaments est la partie la plus rentable de l’anamnèse. Le médecin cherche l’aspirine, les autres antiagrégants (clopidogrel, prasugrel, ticagrélor), les antivitamines K, les AOD (anticoagulants oraux directs), les AINS, y compris en automédication, les corticoïdes et les inhibiteurs sélectifs de la recapture de la sérotonine. Pour chaque antithrombotique, il note l’indication, la dose, l’heure de la dernière prise et la date du dernier événement thrombotique. Ces informations décident de l’arrêt, de l’antagonisation et de la reprise (îlot 10). Il demande aussi la prise de fer ou de bismuth, qui noircit les selles sans saignement.</p>
<h3>5.3 Les antécédents</h3>
<p>Le médecin recherche un ulcère ou une hémorragie antérieurs, une infection à <i>Helicobacter pylori</i>, une cirrhose ou une consommation d’alcool, une prothèse aortique, une polypectomie récente, une radiothérapie pelvienne, une maladie inflammatoire de l’intestin, un amaigrissement et une modification du transit. Il note les comorbidités qui aggravent le pronostic : cardiopathie ischémique, insuffisance cardiaque, insuffisance rénale, hépatopathie.</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Un homme de 70 ans sous aspirine et AINS présente un méléna depuis 48 heures, une asthénie et une dyspnée d’effort. Il a eu un malaise orthostatique. L’anamnèse oriente vers un ulcère duodénal et donne d’emblée deux facteurs aggravants.</p></div>
<div class="card"><h4>Formes atypiques</h4><p>Une femme de 85 ans est admise pour une confusion et une chute, sans plainte digestive ; seul le toucher rectal montre un méléna. Un patient sous bêtabloquant saigne abondamment sans tachycardie. Un homme porteur d’une prothèse aortique a vomi une seule fois un peu de sang il y a deux jours : cet épisode bref peut annoncer une fistule aorto-entérique.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse confirme l’origine digestive, cherche la syncope et les vomissements préalables, et dresse la liste exacte des antithrombotiques et des AINS avec l’heure de la dernière prise. Elle recherche la cirrhose, la prothèse aortique et la polypectomie récente, qui changent la conduite. L’examen clinique mesure ensuite la gravité.</div>
</section>

<section class="ilot" id="k92-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique mesure le retentissement de la perte sanguine et cherche les signes d’une cause particulière. Il commence par les constantes, car elles décident de l’urgence des gestes.</p>
<div class="two"><div class="card"><h4>État général et constantes</h4><p>Un adulte sain au repos a une fréquence cardiaque de 60 à 100 par minute, une pression systolique de 100 à 140 mmHg et un temps de recoloration cutanée inférieur à 3 secondes. En cas de perte sanguine, la fréquence cardiaque s’élève d’abord. Le médecin calcule l’<button class="w" data-k="k92-shock">indice de choc (fréquence cardiaque divisée par la pression systolique)</button> : il est normalement inférieur à 0,7. Chez M. Rossier, 108 / 98 = 1,1. Le médecin évalue aussi la conscience, la diurèse, la pâleur et les extrémités froides.</p></div>
<div class="card"><h4>Signes orientant vers une cause</h4><p>Les <button class="w" data-k="k92-hepato">signes d’hépatopathie chronique</button> (angiomes stellaires, érythrose palmaire, ascite, ictère, circulation veineuse collatérale) orientent vers une hémorragie variceuse. Une cicatrice de laparotomie aortique oriente vers une fistule aorto-entérique. Des télangiectasies des lèvres orientent vers une maladie de Rendu-Osler. Un abdomen sensible et défendu après une hématémèse doit faire évoquer une perforation associée.</p></div></div>
<h3>6.1 Le toucher rectal</h3>
<p>Le <button class="w" data-k="k92-tr">toucher rectal</button> est indispensable. Il confirme le méléna ou l’hématochézie quand l’anamnèse est imprécise, et il cherche une tumeur rectale. Il entre aussi dans le score d’Oakland : la présence de sang au doigtier ajoute 1 point.</p>
<h3>6.2 Ce qu’il ne faut pas faire</h3>
<p>Le test d’orthostatisme expose un patient déjà hypotendu à une syncope et ne change pas la décision lorsque la tachycardie de repos est déjà présente. L’aspiration par sonde nasogastrique n’est pas recommandée en routine par l’ESGE 2021 (recommandation forte, niveau de preuve modéré) : elle est inconfortable, ne distingue pas de façon fiable une source haute d’une source basse chez un patient avec méléna et ne modifie pas le pronostic (<button class="w" data-k="k92-sng">détail de la sonde nasogastrique</button>).</p>
<div class="key"><b>À retenir.</b> Les constantes viennent avant tout : tachycardie, indice de choc supérieur à 1, hypotension, confusion et oligurie signent une hémorragie grave. Le toucher rectal est systématique. Les signes d’hépatopathie font suspecter des varices. Ces données alimentent la démarche diagnostique.</div>
</section>

<section class="ilot" id="k92-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche répond à quatre questions successives : le patient est-il stable, le saignement est-il haut ou bas, quel est son risque, et quel examen trouvera et traitera la source ? La réanimation commence avant toute réponse.</p>
<h3>7.1 Haut ou bas</h3>
<p>Une hématémèse ou des vomissements en marc de café signent une origine haute. Un méléna oriente vers le haut dans la grande majorité des cas ; une urée élevée par rapport à la créatinine renforce cette orientation, sans seuil validé pour l’exclure. Une hématochézie oriente vers le bas, sauf en cas de choc. L’ESGE 2021 recommande une gastroscopie chez un patient instable avec hématochézie, sauf si un <button class="w" data-k="k92-angioct">angioscanner</button> a déjà localisé la source dans le côlon.</p>
<h3>7.2 Stratifier le risque</h3>
<p>En hémorragie haute, l’ESGE 2021 recommande le score de Glasgow-Blatchford avant l’endoscopie (recommandation forte, niveau de preuve modéré). Il utilise des données disponibles aux urgences : urée, hémoglobine, pression systolique, fréquence cardiaque, méléna, syncope, hépatopathie et insuffisance cardiaque. Le score de <button class="w" data-k="k92-rockall">Rockall et l’AIMS65 (autres scores)</button> prédisent moins bien le besoin d’intervention.</p>
<table class="t"><tr><th>Élément du score de Glasgow-Blatchford</th><th>Valeur</th><th>Points</th></tr>
<tr><td>Urée sanguine (mmol/L)</td><td>6,5 à 7,9 / 8,0 à 9,9 / 10,0 à 24,9 / 25 ou plus</td><td>2 / 3 / 4 / 6</td></tr>
<tr><td>Hémoglobine chez l’homme (g/L)</td><td>120 à 129 / 100 à 119 / moins de 100</td><td>1 / 3 / 6</td></tr>
<tr><td>Hémoglobine chez la femme (g/L)</td><td>100 à 119 / moins de 100</td><td>1 / 6</td></tr>
<tr><td>Pression systolique (mmHg)</td><td>100 à 109 / 90 à 99 / moins de 90</td><td>1 / 2 / 3</td></tr>
<tr><td>Fréquence cardiaque</td><td>100 par minute ou plus</td><td>1</td></tr>
<tr><td>Méléna</td><td>Présent</td><td>1</td></tr>
<tr><td>Syncope</td><td>Présente</td><td>2</td></tr>
<tr><td>Hépatopathie connue</td><td>Présente</td><td>2</td></tr>
<tr><td>Insuffisance cardiaque</td><td>Présente</td><td>2</td></tr></table>
<p>Le score se calcule ligne par ligne, puis s’additionne (Blatchford et al., Lancet 2000). Chez M. Rossier : urée 14,2 mmol/L, 4 points ; hémoglobine 92 g/L chez un homme, 6 points ; pression systolique 98 mmHg, 2 points ; fréquence 108, 1 point ; méléna, 1 point ; syncope, 2 points. Le total est de 16 sur 23. L’erreur fréquente est de lire ce score comme un score de mortalité : il prédit le besoin d’une intervention hospitalière, et sa force est d’identifier les patients à très faible risque (0 ou 1) qui peuvent rentrer.</p>
<p>En hémorragie basse, le score d’Oakland identifie les patients qui peuvent sortir sans danger. Il est détaillé dans l’îlot 11 et dans sa fenêtre.</p>
<h3>7.3 Choisir l’examen</h3>
<p>L’examen de référence de l’hémorragie haute est la gastroscopie : elle trouve la lésion, donne son risque de récidive par la <button class="w" data-k="k92-forrest">classification de Forrest</button> et la traite dans le même temps. Chez le patient stable avec hémorragie basse, l’examen de premier choix est la coloscopie après préparation, réalisée pendant le séjour. Chez le patient instable avec hémorragie basse, l’angioscanner précède tout traitement pour localiser le saignement.</p>

<p>L’algorithme se lit de haut en bas. Le premier embranchement est clinique : haut ou bas. Le second est le risque : un score bas autorise la sortie, un score élevé impose l’hospitalisation. Le cadre inférieur rappelle qu’une cirrhose change la conduite dès l’arrivée, avant toute endoscopie. Chez M. Rossier, la branche est haute, le score vaut 16 : il est hospitalisé et endoscopé dans les 24 heures.</p>
<h3>7.4 Diagnostics différentiels</h3>
<p>Le médecin écarte d’abord ce qui imite le sang digestif. L’hémoptysie est rouge, aérée, émise lors d’une toux. Le sang d’une épistaxis peut être dégluti puis vomi. Le fer et le bismuth donnent des selles noires mais non collantes et non malodorantes. La betterave colore l’urine et les selles en rouge. Il écarte ensuite les urgences qui se présentent comme une hémorragie : la fistule aorto-entérique, la rupture d’un anévrisme dans le tube digestif et la colite ischémique étendue.</p>
<div class="quiz ui"><p>Une femme de 24 ans vomit trois fois de la bile après une soirée, puis un peu de sang rouge. Sa fréquence cardiaque est de 76 par minute, sa pression systolique de 122 mmHg, son hémoglobine de 134 g/L, son urée de 4,1 mmol/L. Elle n’a ni méléna, ni syncope, ni maladie connue. Que proposez-vous ?</p><button data-ok="0">Hospitalisation et gastroscopie dans les 12 heures</button><button data-ok="1">Retour à domicile avec gastroscopie ambulatoire si l’indication persiste</button><button data-ok="0">Sonde nasogastrique pour vérifier l’arrêt du saignement</button><p class="fb" hidden>Le score de Glasgow-Blatchford vaut 0 : urée inférieure à 6,5 mmol/L, hémoglobine féminine de 120 g/L ou plus, pression systolique de 110 mmHg ou plus, fréquence inférieure à 100, ni méléna, ni syncope, ni comorbidité. L’ESGE 2021 autorise une prise en charge ambulatoire dès un score de 0 ou 1. Le tableau évoque un syndrome de Mallory-Weiss, qui cesse spontanément dans la grande majorité des cas. La sonde nasogastrique n’est pas recommandée.</p></div>
<button class="pareto-btn ui" data-k="pareto-k92-diag">▲ Loi de Pareto — Reconnaître et stratifier</button>
<div class="key"><b>À retenir.</b> La réanimation précède le diagnostic. Le médecin distingue haut et bas par la présentation, stratifie par le score de Glasgow-Blatchford en haut et par le score d’Oakland en bas, puis choisit la gastroscopie, la coloscopie ou l’angioscanner. L’îlot suivant traite le patient qui saigne au point de menacer sa vie.</div>
</section>
