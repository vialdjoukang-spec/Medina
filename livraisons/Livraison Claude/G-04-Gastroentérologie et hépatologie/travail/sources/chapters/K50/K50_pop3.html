
<!-- ===== FENÊTRES K50 : monographies ===== -->
<template data-pop="k50-d-bud" data-title="Budésonide oral à libération iléale">
<div class="lab">Mécanisme</div><p>Glucocorticoïde puissant libéré dans l’iléon et le côlon ascendant. Il agit localement sur la muqueuse, puis il est largement inactivé par le foie au premier passage : biodisponibilité systémique de 10 à 20 % chez le patient en poussée (Entocort CIR) et de 9 à 13 % (Budenofalk).</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande pour induire la rémission de la maladie légère à modérée de l’iléon ou du côlon ascendant (énoncé 2.1, recommandation forte, preuves de qualité modérée). Il est moins efficace que les corticoïdes systémiques dans les formes plus sévères et n’a pas de place en entretien.</p>
<div class="lab">Posologie suisse</div><p>9 mg une fois par jour, jusqu’à 8 semaines, puis réduction progressive. Entocort CIR mentionne 6 mg par jour pour l’entretien ; ECCO 2024 ne recommande pas d’entretien par budésonide.</p>
<div class="lab">Limites</div><p>Inefficace sur une atteinte digestive haute, jéjunale ou colique gauche : le produit n’y est pas libéré. Budenofalk n’est pas indiqué dans l’atteinte digestive haute.</p>
<div class="lab">Effets indésirables</div><p>Moins d’effets systémiques que la prednisone, mais acné, troubles de l’humeur et freinage surrénalien restent possibles ; les inhibiteurs puissants du CYP3A4 augmentent l’exposition.</p></template>

<template data-pop="k50-d-cort" data-title="Corticoïdes systémiques">
<div class="lab">Mécanisme</div><p>Le récepteur des glucocorticoïdes réprime les facteurs de transcription pro-inflammatoires et réduit toute la cascade de cytokines, de manière non spécifique.</p>
<div class="lab">Preuves</div><p>Dans deux essais regroupés par une revue Cochrane et cités par ECCO 2024, ils doublent la probabilité de rémission par rapport au placebo. ECCO 2024 suggère leur usage dans la maladie modérée à sévère (énoncé 2.2) mais seulement si aucune alternative n’est disponible à temps, ou comme pont.</p>
<div class="lab">Posologie des essais</div><p>Prednisolone 0,50 à 0,75 mg/kg par jour, au maximum 60 mg, puis décroissance ; méthylprednisolone 48 mg par jour décrue en six semaines. En colite aiguë grave hospitalisée, la voie intraveineuse est utilisée.</p>
<div class="lab">Effets indésirables</div><p>Infections, hyperglycémie, hypertension, ostéoporose, cataracte, troubles de l’humeur et du sommeil, insuffisance surrénalienne à l’arrêt brutal ; ils augmentent les complications après chirurgie, d’où leur réduction avant une intervention (ECCO 2024, chirurgie, énoncé 4.9).</p>
<div class="lab">Règle</div><p>Jamais d’entretien par corticoïdes ; toute cure prévoit son traitement d’entretien.</p></template>

<template data-pop="k50-d-thio" data-title="Thiopurines : azathioprine et 6-mercaptopurine">
<div class="lab">Mécanisme</div><p>L’azathioprine se transforme en 6-mercaptopurine, puis en nucléotides de 6-thioguanine qui s’incorporent dans l’acide nucléique des lymphocytes activés et induisent leur apoptose. La thiopurine méthyltransférase et la xanthine oxydase dégradent la 6-mercaptopurine en métabolites inactifs.</p>
<div class="lab">Preuves</div><p>ECCO 2024 déconseille la monothérapie en induction (énoncé 3.1) et la suggère en entretien (énoncé 3.2, preuves faibles). Leur intérêt principal est l’association à l’infliximab, qui réduit l’immunogénicité (énoncés 5.3 et 5.4 ; essai SONIC).</p>
<div class="lab">Posologie</div><p>Azathioprine 1,0 à 2,5 mg/kg par jour dans les essais cités par ECCO ; délai d’action de deux à trois mois. En Suisse, la maladie de Crohn ne figure pas dans les indications d’Imurek (avril 2026) : usage hors indication à documenter.</p>
<div class="lab">Effets indésirables</div><p>Myélosuppression (déficit en thiopurine méthyltransférase, variant NUDT15), pancréatite aiguë dans les premières semaines, hépatotoxicité, nausées, lymphomes, cancers cutanés non mélanocytaires, lymphome T hépatosplénique chez l’homme jeune en association avec un anti-TNF.</p>
<div class="lab">Surveillance</div><p>Formule sanguine chaque semaine pendant 8 semaines, puis au moins tous les 3 mois ; tests hépatiques ; protection solaire et examen cutané.</p>
<div class="lab">Interactions</div><p>Allopurinol : dose réduite au quart ; fébuxostat déconseillé ; mésalazine et sulfasalazine inhibent la thiopurine méthyltransférase.</p></template>

<template data-pop="k50-d-mtx" data-title="Méthotrexate par voie sous-cutanée">
<div class="lab">Mécanisme</div><p>Antagoniste de l’acide folique qui inhibe la dihydrofolate réductase ; aux faibles doses utilisées, l’effet anti-inflammatoire passe aussi par l’adénosine extracellulaire. Le mécanisme exact dans la maladie de Crohn reste incertain.</p>
<div class="lab">Preuves</div><p>Dans l’essai cité par ECCO, 25 mg par semaine par voie intramusculaire ont permis un sevrage des corticoïdes chez des patients corticodépendants. ECCO 2024 suggère le méthotrexate parentéral en induction et en entretien (énoncés 4.1 et 4.2, preuves faibles à modérées). La voie orale n’a pas montré d’efficacité.</p>
<div class="lab">Posologie suisse (Metoject, février 2025)</div><p>25 mg une fois par semaine par voie sous-cutanée en induction, réponse attendue en 8 à 12 semaines ; 15 mg une fois par semaine en entretien. Indication suisse : maladie légère à modérée après échec ou intolérance des thiopurines.</p>
<div class="lab">Contre-indications</div><p>Grossesse et allaitement, insuffisance hépatique, alcoolisme, clairance de la créatinine inférieure à 30 mL/min, cytopénies, infections graves, ulcères digestifs connus.</p>
<div class="lab">Surveillance</div><p>Formule sanguine, tests hépatiques et rénaux ; acide folique selon les recommandations ; contraception ; erreur de prise quotidienne à prévenir.</p></template>

<template data-pop="k50-d-ifx" data-title="Infliximab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal chimérique de type IgG1 qui neutralise le TNF-α soluble et membranaire et induit l’apoptose des cellules inflammatoires qui l’expriment.</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande fortement en induction et en entretien (énoncés 5.1 et 5.2), avec une thiopurine au début (5.3) et pendant au moins 6 à 12 mois (5.4). Il est le seul traitement recommandé avec un niveau de preuve élevé pour les fistules anopérinéales complexes (chirurgie, énoncé 3.3). Essais ACCENT I et II, SONIC, PROFILE.</p>
<div class="lab">Posologie suisse (Remicade, mars 2025)</div><p>5 mg/kg en perfusion de 2 heures aux semaines 0, 2 et 6, puis toutes les 8 semaines. Absence de réponse 2 semaines après la première perfusion : la poursuite n’est pas soutenue par les données. Forme sous-cutanée disponible pour l’entretien avec certains produits.</p>
<div class="lab">Contre-indications</div><p>Tuberculose ou autre infection grave (sepsis, abcès, infection opportuniste) ; insuffisance cardiaque de classe III ou IV de la New York Heart Association ; hypersensibilité aux protéines murines.</p>
<div class="lab">Effets indésirables</div><p>Réactions à la perfusion (surveillance d’au moins une heure), infections, réactivation tuberculeuse et de l’hépatite B, hépatite, lymphome T hépatosplénique en association avec une thiopurine, lésions psoriasiformes, anticorps anti-infliximab.</p>
<div class="lab">Grossesse</div><p>Utilisable après discussion ; pas de vaccin vivant chez le nourrisson exposé pendant 12 mois, sauf taux indétectable.</p></template>

<template data-pop="k50-d-ada" data-title="Adalimumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humain anti-TNF-α administré par voie sous-cutanée.</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande en induction et en entretien (énoncés 6.1 et 6.2) ; chez le patient naïf de biothérapie, la monothérapie est suggérée plutôt que l’association à une thiopurine (6.3 et 6.4). Essais CLASSIC, CHARM, SEAVUE : efficacité comparable à l’ustékinumab chez le patient naïf de biothérapie (énoncés 10.1 et 10.2).</p>
<div class="lab">Posologie suisse (Humira, janvier 2025)</div><p>160 mg à la semaine 0 (en un jour ou 80 mg deux jours de suite), 80 mg à la semaine 2, puis 40 mg toutes les 2 semaines. Indication pédiatrique dès 6 ans dans la maladie sévère.</p>
<div class="lab">Effets indésirables et précautions</div><p>Mêmes que les autres anti-TNF : infections, tuberculose, hépatite B, réactions au point d’injection, insuffisance cardiaque, maladies démyélinisantes, lymphomes.</p>
<div class="lab">Surveillance</div><p>Taux résiduel moyen d’environ 7 µg/mL en entretien selon l’information professionnelle ; un taux bas sans anticorps fait discuter une intensification en cas de perte de réponse.</p></template>

<template data-pop="k50-d-czp" data-title="Certolizumab pégol">
<div class="lab">Mécanisme</div><p>Fragment Fab’ humanisé anti-TNF-α couplé au polyéthylène glycol, sans fragment Fc : il ne traverse presque pas le placenta par le mécanisme actif des IgG.</p>
<div class="lab">Statut</div><p>Autorisé en Suisse dans la maladie de Crohn active après réponse insuffisante au traitement conventionnel (Cimzia, août 2025). Il n’est pas autorisé dans cette indication par l’Agence européenne des médicaments. ECCO 2024 le suggère en induction et en entretien (énoncés 7.1 et 7.2) ; preuves insuffisantes pour les fistules anales.</p>
<div class="lab">Posologie</div><p>400 mg par voie sous-cutanée aux semaines 0, 2 et 4, puis toutes les 4 semaines.</p>
<div class="lab">Intérêt particulier</div><p>Le faible passage placentaire en fait une option discutée pendant la grossesse ; l’information professionnelle rappelle que la maladie active augmente elle-même les fausses couches et les naissances prématurées.</p></template>

<template data-pop="k50-d-vedo" data-title="Védolizumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humanisé dirigé contre l’intégrine α4β7. Il empêche les lymphocytes de se lier à MAdCAM-1 et d’entrer dans la muqueuse digestive : son action est sélective de l’intestin.</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande en induction et en entretien (énoncés 12.1 et 12.2 ; essais GEMINI II et III). Son effet est plus lent que celui des anti-TNF. Preuves insuffisantes pour les fistules anales.</p>
<div class="lab">Posologie suisse (Entyvio, octobre 2025)</div><p>300 mg par voie intraveineuse aux semaines 0, 2 et 6, puis toutes les 8 semaines ; dose supplémentaire à la semaine 10 chez le non-répondeur ; intervalle de 4 semaines en cas de perte de réponse. Forme sous-cutanée : 108 mg toutes les 2 semaines après au moins deux perfusions.</p>
<div class="lab">Effets indésirables</div><p>Rhinopharyngites, céphalées, arthralgies, nausées ; risque infectieux systémique faible ; pas de cas de leucoencéphalopathie attribuable démontré dans les essais.</p>
<div class="lab">Place</div><p>Patient âgé, risque infectieux ou néoplasique ; moins adapté lorsque dominent une spondyloarthrite axiale ou d’autres manifestations extra-intestinales indépendantes.</p></template>

<template data-pop="k50-d-uste" data-title="Ustékinumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humain dirigé contre la sous-unité p40 commune à l’IL-12 et à l’IL-23 : il réduit les réponses Th1 et Th17.</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande en induction et en entretien (énoncés 9.1 et 9.2 ; essais UNITI). SEAVUE : efficacité comparable à l’adalimumab chez le patient naïf de biothérapie. SEQUENCE : moins efficace que le risankizumab après échec d’un anti-TNF.</p>
<div class="lab">Posologie suisse (Stelara, février 2025)</div><p>Perfusion unique d’environ 6 mg/kg : 260 mg jusqu’à 55 kg, 390 mg de plus de 55 à 85 kg, 520 mg au-delà ; puis 90 mg par voie sous-cutanée à la semaine 8, puis toutes les 12 semaines, ou toutes les 8 semaines en cas de réponse insuffisante ou de forte charge inflammatoire. Absence de réponse à 16 semaines sous rythme de 8 semaines : arrêt à envisager. Des biosimilaires existent.</p>
<div class="lab">Effets indésirables</div><p>Profil infectieux favorable, rhinopharyngites, réactions au point d’injection ; dépistage de la tuberculose avant le début.</p>
<div class="lab">Place</div><p>Psoriasis associé ; patient à risque infectieux ; projet de grossesse, avec des données rassurantes.</p></template>

<template data-pop="k50-d-risa" data-title="Risankizumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humanisé de type IgG1 dirigé contre la sous-unité p19 de l’IL-23 : il bloque l’entretien des lymphocytes Th17 sans toucher l’IL-12.</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande en induction et en entretien avec des preuves de qualité élevée (énoncés 11.1 et 11.2 ; essais ADVANCE, MOTIVATE, FORTIFY). Dans SEQUENCE, il a été supérieur à l’ustékinumab après échec d’un anti-TNF. Aucune donnée suffisante pour les fistules anales.</p>
<div class="lab">Posologie suisse (Skyrizi, mai 2025)</div><p>600 mg par voie intraveineuse aux semaines 0, 4 et 8, puis 360 mg par voie sous-cutanée à la semaine 12 et toutes les 8 semaines. Absence de bénéfice à 12 semaines : arrêt à envisager. Pas d’adaptation rénale ou hépatique.</p>
<div class="lab">Contre-indications et précautions</div><p>Infection active cliniquement importante, dont la tuberculose active ; dépistage de la tuberculose ; pas de vaccin vivant.</p>
<div class="lab">Indication suisse</div><p>Adulte avec maladie modérée à sévère après échec ou intolérance d’un traitement conventionnel ou d’un biologique.</p></template>

<template data-pop="k50-d-guse" data-title="Guselkumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humain dirigé contre la sous-unité p19 de l’IL-23.</p>
<div class="lab">Preuves</div><p>Essais GALAXI 2 et 3 (induction intraveineuse, comparateur ustékinumab) et GRAVITI (induction sous-cutanée) décrits dans l’information professionnelle suisse. Il est postérieur aux lignes directrices ECCO 2024, qui n’en traitent pas.</p>
<div class="lab">Posologie suisse (Tremfya, février 2026)</div><p>Induction : 200 mg par voie intraveineuse, ou 400 mg par voie sous-cutanée, aux semaines 0, 4 et 8. Entretien : 100 mg par voie sous-cutanée à la semaine 16 puis toutes les 8 semaines, ou 200 mg à la semaine 12 puis toutes les 4 semaines selon le jugement clinique. Absence de réponse à 12 semaines : arrêt à envisager.</p>
<div class="lab">Effets indésirables</div><p>Élévations des transaminases plus fréquentes que sous placebo dans les études de la maladie de Crohn (environ 3 % au-delà de trois fois la normale) ; infections ; réactions au point d’injection.</p></template>

<template data-pop="k50-d-miri" data-title="Mirikizumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humanisé dirigé contre la sous-unité p19 de l’IL-23.</p>
<div class="lab">Statut</div><p>Autorisé en Suisse dans la maladie de Crohn modérée à sévère après échec d’un traitement conventionnel ou d’un biologique (Omvoh, février 2026). Postérieur aux lignes directrices ECCO 2024.</p>
<div class="lab">Posologie suisse</div><p>900 mg par voie intraveineuse en au moins 90 minutes aux semaines 0, 4 et 8, puis 300 mg par voie sous-cutanée toutes les 4 semaines dès la semaine 12. Absence de bénéfice à 12 semaines : arrêt.</p>
<div class="lab">Précautions</div><p>Contraception pendant le traitement et au moins 10 semaines après ; dépistage de la tuberculose ; pas de vaccin vivant.</p></template>

<template data-pop="k50-d-upa" data-title="Upadacitinib">
<div class="lab">Mécanisme</div><p>Inhibiteur oral préférentiel de JAK1, qui bloque la signalisation intracellulaire de plusieurs cytokines.</p>
<div class="lab">Preuves</div><p>ECCO 2024 le recommande en induction (preuves de qualité élevée) et en entretien (énoncés 13.1 et 13.2 ; essais U-EXCEL, U-EXCEED, U-ENDURE). Rémission clinique sous 45 mg à 12 semaines : 44,4 % contre 25,1 % sous placebo dans la méta-analyse d’ECCO. Une analyse a posteriori suggère un effet sur les fistules.</p>
<div class="lab">Posologie suisse (Rinvoq, juin 2026)</div><p>45 mg une fois par jour pendant 12 semaines ; prolongation possible de 12 semaines à 30 mg ; entretien 15 mg ou 30 mg, dose minimale efficace ; 15 mg dès 65 ans ; avec un inhibiteur puissant du CYP3A4, 30 mg en induction et 15 mg en entretien. Arrêt si absence de bénéfice après 24 semaines. Indication : après échec, intolérance ou contre-indication d’au moins un biologique.</p>
<div class="lab">Effets indésirables</div><p>Infections graves, zona (environ 4 à 7 % en entretien selon la dose), élévation des lipides et de la créatine kinase, acné, neutropénie ; thromboembolies veineuses, événements cardiovasculaires majeurs et cancers à considérer chez les patients à risque.</p>
<div class="lab">Grossesse</div><p>Ne pas utiliser sauf nécessité absolue ; contraception jusqu’à 4 semaines après la dernière dose.</p></template>

<template data-pop="k50-d-5asa" data-title="Mésalazine dans la maladie de Crohn">
<div class="lab">Constat</div><p>ECCO 2024 recommande contre son usage en induction (énoncé 1.1, preuves de qualité modérée) et en entretien (énoncé 1.2), quelle que soit la localisation : aucune efficacité n’a été démontrée de manière constante.</p>
<div class="lab">Pourquoi l’erreur persiste</div><p>La mésalazine est le traitement de base de la rectocolite hémorragique ; l’analogie entre les deux MICI pousse à la prescrire.</p>
<div class="lab">Conséquence</div><p>Prescrire de la mésalazine retarde un traitement efficace et ajoute un risque d’interaction avec les thiopurines.</p></template>

<template data-pop="k50-d-atb" data-title="Antibiotiques dans la maladie de Crohn">
<div class="lab">Indications</div><p>Abcès intra-abdominal (avec drainage) ; sepsis périanal ; pullulation bactérienne en amont d’une sténose.</p>
<div class="lab">Fistules anales</div><p>ECCO 2024 (chirurgie) ne recommande pas les antibiotiques en monothérapie pour fermer les fistules complexes, car les essais sont petits et négatifs. La ciprofloxacine peut améliorer l’effet à court terme d’un anti-TNF, sans bénéfice démontré à long terme.</p>
<div class="lab">Effets indésirables</div><p>Métronidazole prolongé : neuropathie périphérique, goût métallique, effet antabuse. Ciprofloxacine : tendinopathies, allongement de l’intervalle QT. Tous : risque d’infection à <i>Clostridioides difficile</i>.</p></template>

<template data-pop="k50-d-tdm" data-title="Dosage des taux résiduels et des anticorps anti-médicament">
<div class="lab">Principe</div><p>Mesure de la concentration du médicament juste avant l’administration suivante et des anticorps dirigés contre lui.</p>
<div class="lab">Recommandation</div><p>ECCO 2024 ne trouve pas assez de preuves pour un dosage proactif systématique des anti-TNF (énoncé 8.1), mais admet le dosage pour optimiser la dose (point pratique 1). Pour les biothérapies autres que les anti-TNF, l’usage courant n’est pas soutenu.</p>
<div class="lab">Interprétation en perte de réponse</div><p>Taux bas sans anticorps : intensifier la dose ou rapprocher les administrations. Taux bas avec anticorps élevés : changer de molécule. Taux adéquat avec maladie active : changer de mécanisme, après exclusion d’une complication.</p>
<div class="lab">Limites</div><p>Les seuils cibles varient selon les tests et les situations ; la variabilité entre laboratoires reste un problème selon ECCO.</p></template>
