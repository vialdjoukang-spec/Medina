
<!-- ===== FENÊTRES K50 : Pareto ===== -->
<template data-pop="pareto-k50-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="k50-0,k50-1,k50-2,k50-3,k50-4,k50-5,k50-6"></p>
<ul>
<li>Inflammation chronique <b>transmurale et segmentaire</b> de la bouche à l’anus ; iléon terminal le plus souvent ; rectum souvent épargné.</li>
<li>Transmurale donc sténoses, fistules, abcès ; les lésions progressent même quand les symptômes s’atténuent.</li>
<li>Montréal : âge (A), localisation (L1 iléale, L2 colique, L3 iléocolique, L4 haute), comportement (B inflammatoire, sténosant, pénétrant) et « p » périanal.</li>
<li>Codage : K50.0 grêle, K50.1 gros intestin, K50.82 plusieurs segments dont iléocolique, K50.80 estomac, K50.81 œsophage, K50.88 autres, K50.9 sans précision.</li>
<li>Suisse : environ 1 personne sur 500 ; âge médian 26 ans ; délai diagnostique médian 9 mois, associé aux sténoses et à la chirurgie.</li>
<li>Chaîne : NOD2 et autophagie → bactéries persistantes → IL-12, IL-23, TNF-α → lésion transmurale → complications et malabsorption iléale.</li>
<li>Tabac : aggrave tout, seul facteur modifiable ; AINS et infection déclenchent des poussées.</li>
<li>Alarmes : diarrhée nocturne, sang, amaigrissement, fièvre, lésion anale, anémie, syndrome inflammatoire.</li>
<li>Examen : poids, fièvre, masse de la fosse iliaque droite, marge anale toujours, peau, yeux, articulations ; corticoïdes masquent les signes péritonéaux.</li></ul></template>

<template data-pop="pareto-k50-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="k50-7"></p>
<ul>
<li>Pas de critère unique : faisceau clinique, endoscopique, histologique, radiologique et biologique, infection exclue.</li>
<li>Calprotectine : &lt; 50 µg/g inflammation peu probable ; élevée → iléocoloscopie.</li>
<li>Iléocoloscopie avec iléon et biopsies étagées = examen de référence ; entéro-IRM ou échographie pour le grêle ; capsule seulement sans sténose.</li>
<li>Lésion anale → IRM pelvienne, examen sous anesthésie si abcès.</li>
<li>Urgence → tomodensitométrie d’abord.</li>
<li>Différentiels graves : tuberculose intestinale (avant tout anti-TNF), lymphome, ischémie ; puis Yersinia, cytomégalovirus, Clostridioides difficile, AINS, rectocolite hémorragique.</li></ul></template>

<template data-pop="pareto-k50-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="k50-8"></p>
<ul>
<li>Urgences : perforation, occlusion, abcès avec sepsis, hémorragie, colite aiguë grave ; signes masqués sous corticoïdes.</li>
<li>Abcès : antibiotiques intraveineux et drainage percutané, anticorps suspendus ; chirurgie programmée plutôt qu’urgente.</li>
<li>Sténose courte du grêle &lt; 5 cm : dilatation ; longue ou compliquée : résection ou stricturoplastie.</li>
<li>Chroniques : carences (fer, B12, vitamine D), anémie, cancer colorectal sur colite étendue, lymphome sous thiopurine.</li></ul></template>

<template data-pop="pareto-k50-tt" data-title="Pareto — Traitement">
<p class="ratio" data-cover="k50-9"></p>
<ul>
<li>Cible : symptômes, CRP et calprotectine normalisées, puis cicatrisation endoscopique (STRIDE-II) ; modifier si cible manquée.</li>
<li>Tous : arrêt du tabac, pas d’AINS, carences, bilan avant immunosuppression, vaccins.</li>
<li>Légère iléocæcale : budésonide 9 mg. Modérée à sévère : traitement avancé ; corticoïdes systémiques seulement comme pont, jamais en entretien.</li>
<li>Mésalazine : aucune place. Thiopurine seule : pas d’induction.</li>
<li>Avancés recommandés (ECCO 2024) : infliximab, adalimumab, ustékinumab, risankizumab, védolizumab, upadacitinib ; pas d’ordre imposé.</li>
<li>Infliximab avec thiopurine 6 à 12 mois ; PROFILE : traitement d’emblée 79 % contre 15 % de rémission soutenue.</li>
<li>Fistule anale complexe : drainage et séton lâche, puis infliximab ; fermeture chirurgicale si rectum sain.</li>
<li>Iléite courte : résection iléocæcale laparoscopique = alternative à l’infliximab ; iléocoloscopie 6 à 12 mois après résection (Rutgeerts ≥ i2 = récidive).</li></ul></template>

<template data-pop="pareto-k50-crit" data-title="Pareto — Manifestations, suivi, situations particulières et critères">
<p class="ratio" data-cover="k50-10,k50-11,k50-12,k50-13"></p>
<ul>
<li>Manifestations extra-intestinales chez 43 % (cohorte suisse) ; parallèles : arthrite des grosses articulations, érythème noueux, aphtes ; indépendantes : axiale, uvéite, cholangite sclérosante.</li>
<li>Iléon : calculs biliaires et rénaux oxaliques.</li>
<li>Suivi : CRP et calprotectine tous les 3 à 6 mois, endoscopie de cicatrisation ; surveillance propre à chaque médicament.</li>
<li>Grossesse : rémission avant conception ; méthotrexate contre-indiqué, upadacitinib à éviter ; pas de vaccin vivant 12 mois chez le nourrisson exposé à l’infliximab.</li>
<li>Enfant : nutrition entérale exclusive ; avant 6 ans, forme monogénique. Sujet âgé : éviter corticoïdes, upadacitinib 15 mg maximum.</li>
<li>Diagnostic formel : clinique + endoscopie + histologie + imagerie, infection exclue ; granulome inconstant.</li></ul></template>

<template data-pop="pareto-k50-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="k50-e-1,k50-e-2,k50-e-3,k50-e-4,k50-e-5,k50-e-6"></p>
<ul>
<li>Calprotectine : neutrophiles muqueux ; non spécifique ; seuils selon le test.</li>
<li>CRP normale n’exclut pas l’activité ; très élevée avec fièvre → abcès.</li>
<li>Ferritine &lt; 100 µg/L compatible avec carence en fer en cas d’inflammation.</li>
<li>Iléocoloscopie : intuber l’iléon ; SES-CD pour l’activité, Rutgeerts après résection.</li>
<li>Imagerie : entéro-IRM (référence du grêle), échographie (suivi), tomodensitométrie (urgence) ; IRM pelvienne pour les fistules.</li>
<li>Avant immunosuppression : tuberculose, hépatite B, VHC, VIH, varicelle, thiopurine méthyltransférase, vaccins.</li></ul></template>

<template data-pop="pareto-k50-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="k50-p-1,k50-p-2,k50-p-3,k50-p-4"></p>
<ul>
<li>Corticoïdes induisent ; immunomodulateurs maintiennent ; traitements avancés font les deux.</li>
<li>Infliximab 5 mg/kg semaines 0, 2, 6 puis toutes les 8 semaines ; adalimumab 160/80 puis 40 mg toutes les 2 semaines.</li>
<li>Védolizumab 300 mg semaines 0, 2, 6 puis toutes les 8 semaines ; ustékinumab environ 6 mg/kg puis 90 mg toutes les 8 à 12 semaines.</li>
<li>Risankizumab 600 mg intraveineux ×3 puis 360 mg toutes les 8 semaines ; upadacitinib 45 mg 12 semaines puis 15 ou 30 mg.</li>
<li>Azathioprine : hors indication suisse ; allopurinol → dose au quart ; formule sanguine hebdomadaire 8 semaines.</li>
<li>Méthotrexate : une fois par semaine ; contre-indiqué en grossesse.</li>
<li>Éviter : AINS, lopéramide en colite sévère, opioïdes au long cours, mésalazine inutile.</li></ul></template>
