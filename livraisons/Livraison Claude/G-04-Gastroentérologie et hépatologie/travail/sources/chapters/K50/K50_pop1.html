
<!-- ===== FENÊTRES K50 : définitions, mécanismes, clinique ===== -->
<template data-pop="k50-montreal" data-title="Classification de Montréal de la maladie de Crohn">
<div class="lab">Définition</div><p>Classification phénotypique proposée au congrès mondial de gastroentérologie de Montréal en 2005 et publiée par Satsangi et collaborateurs (Gut 2006;55:749-753). Elle décrit le patient selon l’âge au diagnostic (A), la localisation (L) et le comportement (B), avec deux modificateurs : L4 pour l’atteinte digestive haute et « p » pour l’atteinte périanale.</p>
<div class="lab">Pourquoi trois axes</div><p>L’âge au diagnostic prédit l’agressivité : un début avant 17 ans est associé à une maladie plus étendue. La localisation prédit les complications : l’atteinte iléale se complique plus souvent de sténose. Le comportement résume l’histoire naturelle : la maladie évolue de l’inflammation pure vers la sténose ou la pénétration.</p>
<div class="lab">Exemple</div><p>Un homme de 45 ans avec colite isolée et fistule anale est noté A&#8288;3 L2 B&#8288;1p. Une femme de 19 ans avec iléite sténosante et atteinte duodénale est notée A&#8288;2 L1 L4 B&#8288;2.</p>
<div class="lab">Limites</div><p>Le comportement change au cours du temps et doit être réévalué. La classification ne mesure ni l’activité ni la gravité d’une poussée. Chez l’enfant, la classification de Paris l’adapte (sous-groupes d’âge et de croissance).</p>
<div class="lab">Conséquence pratique</div><p>Un comportement B&#8288;2 ou B&#8288;3, un modificateur p ou une atteinte L4 sont des facteurs de mauvais pronostic qui plaident pour un traitement avancé précoce.</p></template>

<template data-pop="k50-transmural" data-title="Inflammation transmurale">
<div class="lab">Définition</div><p>Inflammation qui atteint toutes les couches de la paroi digestive, de la muqueuse jusqu’à la séreuse et au mésentère, sous forme d’agrégats lymphoïdes, de fissures et de granulomes.</p>
<div class="lab">Normal puis pathologique</div><p>Dans une paroi normale, les cellules immunitaires se concentrent dans la muqueuse. Dans la maladie de Crohn, l’inflammation descend le long des vaisseaux et des lymphatiques jusqu’à la séreuse.</p>
<div class="lab">Conséquences</div><p>Une fissure qui traverse la paroi s’ouvre dans un organe voisin (fistule) ou dans la graisse (abcès). La cicatrisation répétée de toute l’épaisseur dépose du collagène et épaissit la musculeuse (sténose). La rectocolite hémorragique, limitée à la muqueuse, ne donne presque jamais ces complications.</p>
<div class="lab">Comment la voir</div><p>Les biopsies n’atteignent que la muqueuse. L’épaisseur de paroi, les fistules et la graisse rampante se voient à l’entéro-IRM, à l’échographie intestinale ou à la tomodensitométrie, et sur la pièce opératoire.</p></template>

<template data-pop="k50-granulome" data-title="Granulome épithélioïde sans nécrose caséeuse">
<div class="lab">Définition</div><p>Amas compact de macrophages transformés en cellules épithélioïdes, parfois avec des cellules géantes multinucléées, entouré de lymphocytes, sans nécrose centrale.</p>
<div class="lab">Mécanisme</div><p>Les macrophages qui ne parviennent pas à détruire un antigène bactérien persistant se regroupent et l’isolent sous l’effet de l’interféron gamma et du TNF-α.</p>
<div class="lab">Valeur et limites</div><p>Très évocateur lorsqu’il est isolé, petit et à distance d’une crypte rompue. Il n’est trouvé que dans une minorité des biopsies : son absence n’exclut pas le diagnostic. Il existe aussi dans la tuberculose (grand, confluent, caséeux), la yersiniose, la sarcoïdose et la réaction à une crypte rompue.</p>
<div class="lab">Piège</div><p>Un granulome caséeux chez un patient venant d’une région de forte endémie tuberculeuse impose une recherche de mycobactéries avant tout anti-TNF.</p></template>

<template data-pop="k50-il23" data-title="Axe interleukine 23 et lymphocytes Th17">
<div class="lab">Définition</div><p>L’interleukine 23 (IL-23) est une cytokine produite par les macrophages et les cellules dendritiques. Elle est formée de deux sous-unités, p40, partagée avec l’IL-12, et p19, qui lui est propre. Elle maintient et active les lymphocytes Th17.</p>
<div class="lab">Mécanisme</div><p>Les lymphocytes Th17 produisent IL-17 et IL-22 ; ils attirent des neutrophiles et entretiennent l’inflammation de la paroi. Des variants du gène IL23R modifient le risque de maladie de Crohn, ce qui soutient un rôle causal de cette voie.</p>
<div class="lab">Conséquence thérapeutique</div><p>L’ustékinumab bloque p40, donc IL-12 et IL-23. Le risankizumab, le guselkumab et le mirikizumab bloquent p19, donc seulement l’IL-23. Dans l’essai SEQUENCE, après échec d’un anti-TNF, le risankizumab a obtenu plus de rémissions cliniques et endoscopiques que l’ustékinumab (ECCO 2024, point pratique 3).</p>
<div class="lab">Limite</div><p>Bloquer l’IL-17 en aval est inefficace, voire nuisible, dans la maladie de Crohn : l’IL-17 participe aussi à la protection de la barrière. La cible utile est donc l’IL-23, en amont.</p></template>

<template data-pop="k50-hbi" data-title="Indice de Harvey-Bradshaw">
<div class="lab">Définition</div><p>Score clinique simplifié publié en 1980 (Harvey et Bradshaw, Lancet), calculé sur la journée précédente : bien-être général, douleur abdominale, nombre de selles liquides, masse abdominale et complications (arthralgies, uvéite, érythème noueux, aphtes, pyoderma, fissure anale, nouvelle fistule, abcès).</p>
<div class="lab">Interprétation usuelle (seuils de la littérature)</div><p>Moins de 5 : rémission ; 5 à 7 : activité légère ; 8 à 16 : activité modérée ; plus de 16 : activité sévère.</p>
<div class="lab">Usage</div><p>Il se calcule en une minute au cabinet. L’essai PROFILE l’a utilisé : une poussée y était définie par un indice d’au moins 5 avec une protéine C-réactive ou une calprotectine élevée.</p>
<div class="lab">Limites</div><p>Il mesure des symptômes. Une sténose fibreuse, un intestin irritable associé ou une diarrhée cholérétique l’élèvent sans inflammation ; des ulcères profonds peuvent coexister avec un indice bas. Il doit être associé à un marqueur objectif.</p></template>

<template data-pop="k50-sescd" data-title="Score endoscopique simplifié de la maladie de Crohn (SES-CD)">
<div class="lab">Définition</div><p>Score endoscopique publié par Daperno et collaborateurs (Gastrointestinal Endoscopy 2004). Il note de 0 à 3, dans cinq segments (iléon, côlon droit, côlon transverse, côlon gauche, rectum), la taille des ulcères, la surface ulcérée, la surface atteinte et la présence d’une sténose.</p>
<div class="lab">Interprétation usuelle</div><p>0 à 2 : rémission endoscopique ; 3 à 6 : activité légère ; 7 à 15 : modérée ; plus de 15 : sévère. Les essais récents d’inclusion exigent un score d’au moins 6, ou d’au moins 4 en cas d’atteinte iléale isolée (informations professionnelles suisses du risankizumab et du guselkumab).</p>
<div class="lab">Usage</div><p>Il objective l’activité au diagnostic et la cicatrisation sous traitement, qui est la cible à long terme de STRIDE-II.</p>
<div class="lab">Limite</div><p>Il ne voit pas le grêle proximal, ni la profondeur de la paroi. Il ne s’applique pas à l’anastomose après résection, qui utilise le score de Rutgeerts.</p></template>

<template data-pop="k50-sibdcs" data-title="Cohorte suisse des MICI">
<div class="lab">Définition</div><p>La Swiss Inflammatory Bowel Disease Cohort Study recrute depuis novembre 2006, dans toute la Suisse, des patients atteints de maladie de Crohn, de rectocolite hémorragique ou de colite indéterminée, suivis chaque année par leur gastroentérologue, en centre universitaire, en hôpital régional ou en cabinet.</p>
<div class="lab">Apports utiles au clinicien</div><p>Délai diagnostique médian de 9 mois dans la maladie de Crohn, associé aux sténoses et à la chirurgie (Schoepfer, American Journal of Gastroenterology 2013). Manifestations extra-intestinales chez 43 % des patients atteints de maladie de Crohn (Vavricka, American Journal of Gastroenterology 2011). Délai plus court chez l’enfant (3 mois en médiane) que chez l’adulte (6 mois) dans une analyse ultérieure (Schoepfer, Journal of Crohn’s and Colitis 2019).</p>
<div class="lab">Limites</div><p>Les patients des centres universitaires y sont surreprésentés (68 % dans l’analyse de 2013). Les associations observées ne prouvent pas la causalité.</p></template>

<template data-pop="k50-delai" data-title="Délai diagnostique et complications">
<div class="lab">Donnée</div><p>Dans la cohorte suisse, 905 patients atteints de maladie de Crohn avaient un délai médian de 9 mois entre les premiers symptômes et le diagnostic (écart interquartile 3 à 24 mois). Un délai d’au moins 25 mois était associé à une sténose intestinale (rapport des cotes 1,76) ; un délai de 10 à 24 mois et d’au moins 25 mois, à une chirurgie intestinale (rapports des cotes 1,76 et 2,03).</p>
<div class="lab">Mécanisme plausible</div><p>Une inflammation transmurale non traitée cicatrise par fibrose et creuse des fissures. Plus elle dure, plus les lésions irréversibles s’accumulent.</p>
<div class="lab">Limite</div><p>Il s’agit d’une association d’observation. Une maladie lentement progressive peut être à la fois diagnostiquée tard et plus fibrosante.</p>
<div class="lab">Conséquence pratique</div><p>Un jeune adulte avec diarrhée chronique et signe d’alarme reçoit une calprotectine et, si elle est élevée, un avis gastroentérologique rapide.</p>
<div class="lab">Source</div><p>Schoepfer A. M. et al. American Journal of Gastroenterology 2013;108:1744-1753, doi 10.1038/ajg.2013.248.</p></template>

<template data-pop="k50-nod2" data-title="NOD2 et défaut de défense contre les bactéries">
<div class="lab">Fonction normale</div><p>NOD2 est un récepteur intracellulaire des monocytes, des macrophages et des cellules de Paneth. Il reconnaît le muramyl dipeptide, fragment de la paroi de presque toutes les bactéries, et déclenche la sécrétion de défensines et la destruction des bactéries phagocytées.</p>
<div class="lab">Dans la maladie de Crohn</div><p>Les variants perte de fonction diminuent cette réponse. Les bactéries persistent dans la muqueuse iléale et entretiennent une stimulation chronique. Le risque est plus élevé chez les porteurs de deux variants que chez les porteurs d’un seul.</p>
<div class="lab">Corrélation clinique</div><p>Les variants de NOD2 sont associés à l’atteinte iléale, à un début plus jeune et au comportement sténosant. Ils expliquent en partie pourquoi la maladie prédomine dans l’iléon, siège des cellules de Paneth.</p>
<div class="lab">Limite</div><p>La plupart des porteurs ne développent jamais la maladie. Le génotypage n’a pas de place dans le diagnostic courant.</p></template>

<template data-pop="k50-fistule" data-title="Fistules de la maladie de Crohn">
<div class="lab">Définition</div><p>Trajet anormal qui relie deux surfaces épithéliales : deux anses (entéro-entérique), l’intestin et la vessie (entéro-vésicale), le vagin (recto-vaginale), la peau (entéro-cutanée) ou la marge anale (anopérinéale).</p>
<div class="lab">Mécanisme</div><p>Une fissure transmurale traverse la séreuse et adhère à un organe voisin. L’épithélium tapisse ensuite le trajet, qui ne se ferme plus spontanément.</p>
<div class="lab">Clinique</div><p>Entéro-vésicale : pneumaturie, fécalurie, infections urinaires à germes digestifs répétées. Recto-vaginale : gaz ou selles par le vagin. Entéro-cutanée : écoulement digestif sur une cicatrice. Entéro-entérique : souvent asymptomatique, parfois diarrhée par court-circuit.</p>
<div class="lab">Conduite</div><p>Toute fistule fait chercher un abcès associé. Les fistules internes asymptomatiques peuvent être surveillées sous traitement ; les fistules symptomatiques vers la vessie, le vagin ou la peau relèvent souvent de la chirurgie, après contrôle du sepsis et de la nutrition.</p></template>

<template data-pop="k50-abces" data-title="Abcès intra-abdominal">
<div class="lab">Mécanisme</div><p>Une fistule borgne débouche dans le mésentère, l’espace rétropéritonéal ou le psoas, sans organe pour recevoir son contenu. Le contenu intestinal infecté forme une collection.</p>
<div class="lab">Clinique</div><p>Fièvre avec frissons, douleur localisée, masse sensible, protéine C-réactive très élevée. Un abcès du psoas donne une douleur à l’extension de la hanche (psoïtis).</p>
<div class="lab">Diagnostic</div><p>Tomodensitométrie avec contraste en urgence, ou échographie et IRM chez le patient stable.</p>
<div class="lab">Conduite</div><p>ECCO 2024 (chirurgie, énoncé 4.4) suggère antibiotiques par voie intraveineuse et drainage percutané guidé par l’imagerie en première ligne, puis un traitement conservateur après drainage réussi ; une résection programmée suit souvent. Les anticorps immunosuppresseurs sont suspendus jusqu’au contrôle du sepsis.</p></template>

<template data-pop="k50-stenose" data-title="Sténose de la maladie de Crohn">
<div class="lab">Définition</div><p>Rétrécissement permanent de la lumière avec épaississement pariétal et dilatation en amont.</p>
<div class="lab">Trois types</div><p>Inflammatoire : œdème et infiltrat, réversible sous traitement anti-inflammatoire. Fibreuse : collagène et hypertrophie musculaire, irréversible. Mixte : la plus fréquente.</p>
<div class="lab">Comment les distinguer</div><p>L’entéro-IRM et l’échographie évaluent le rehaussement, l’œdème et la vascularisation de la paroi. Une sténose très rehaussée et œdématiée répond mieux au traitement médical.</p>
<div class="lab">Traitement</div><p>Sténose inflammatoire : intensification médicale. Sténose courte du grêle, moins de 5 cm : dilatation au ballonnet si l’expertise existe (ECCO 2024, chirurgie, énoncé 4.5). Sténose longue, multiple ou compliquée : résection ou stricturoplastie.</p>
<div class="lab">Piège</div><p>Une sténose colique doit toujours être biopsiée : elle peut cacher un cancer.</p></template>

<template data-pop="k50-b12" data-title="Carence en vitamine B12 après atteinte iléale">
<div class="lab">Mécanisme</div><p>Le complexe vitamine B12 et facteur intrinsèque n’est absorbé que dans l’iléon terminal. Une atteinte étendue ou une résection de cette zone supprime l’absorption.</p>
<div class="lab">Délai</div><p>Les réserves hépatiques couvrent plusieurs années : la carence apparaît tardivement, souvent après une résection ancienne.</p>
<div class="lab">Conséquences</div><p>Anémie macrocytaire, glossite, atteinte neurologique (sclérose combinée de la moelle, neuropathie), parfois irréversible si elle est traitée tard.</p>
<div class="lab">Conduite</div><p>Dosage annuel après atteinte ou résection iléale ; substitution parentérale lorsque l’absorption iléale est compromise.</p></template>

<template data-pop="k50-selsbil" data-title="Diarrhée cholérétique et stéatorrhée">
<div class="lab">Diarrhée cholérétique</div><p>Lorsque l’iléon atteint ou réséqué sur une longueur limitée laisse passer des sels biliaires dans le côlon, ceux-ci stimulent la sécrétion d’eau et de chlore et accélèrent le transit. Le foie compense la perte et la digestion des graisses reste suffisante.</p>
<div class="lab">Stéatorrhée</div><p>Après une résection d’environ 100 cm ou plus, la perte dépasse la capacité de synthèse hépatique. Le stock de sels biliaires s’effondre, les graisses ne sont plus émulsionnées et passent dans les selles.</p>
<div class="lab">Conséquence thérapeutique</div><p>La cholestyramine lie les sels biliaires et traite la diarrhée cholérétique. Elle aggrave la stéatorrhée, car elle réduit encore le stock disponible.</p>
<div class="lab">Complications associées</div><p>Calculs biliaires de cholestérol et calculs rénaux d’oxalate.</p></template>

<template data-pop="k50-tabac" data-title="Tabac et maladie de Crohn">
<div class="lab">Constat</div><p>Le tabagisme est associé à un risque plus élevé de maladie de Crohn, à plus de poussées, de complications, de chirurgie et de récidive après résection. ECCO 2024 (chirurgie) range le tabagisme parmi les facteurs de haut risque de récidive postopératoire.</p>
<div class="lab">Mécanismes proposés</div><p>Le tabac altère la microcirculation muqueuse, modifie le microbiote, perturbe l’autophagie et la fonction des macrophages. Ces mécanismes sont partiellement établis.</p>
<div class="lab">Contraste</div><p>Dans la rectocolite hémorragique, le tabac est au contraire associé à un risque plus faible ; cette observation ne justifie jamais de fumer.</p>
<div class="lab">Conséquence pratique</div><p>L’arrêt du tabac est proposé à chaque consultation, avec substitution nicotinique ou autre aide médicamenteuse et accompagnement. C’est la mesure modifiable la plus utile pour le pronostic.</p></template>

<template data-pop="k50-perianal" data-title="Atteinte anopérinéale et toucher rectal">
<div class="lab">Lésions</div><p>Marisques œdémateuses, fissures larges ou latérales peu douloureuses, ulcérations du canal anal, abcès, fistules simples ou complexes, sténose anale.</p>
<div class="lab">Technique d’examen</div><p>Inspection avec écartement doux des fesses, recherche d’orifices externes, palpation d’une induration le long d’un trajet, puis toucher rectal doux à la recherche d’une sténose, d’un orifice interne induré et d’une douleur localisée.</p>
<div class="lab">Valeur</div><p>L’atteinte périanale peut précéder les symptômes intestinaux de plusieurs années. Elle définit le modificateur « p » de Montréal et un pronostic plus sévère.</p>
<div class="lab">Piège</div><p>Une fissure latérale, multiple ou indolore n’est pas une fissure anale banale : elle fait évoquer une maladie de Crohn, une infection sexuellement transmissible ou un cancer. Un abcès anal récidivant chez un jeune adulte doit faire demander une calprotectine.</p></template>

<template data-pop="k50-diarrhee" data-title="Mécanismes de la diarrhée dans la maladie de Crohn">
<div class="lab">Diarrhée inflammatoire</div><p>La muqueuse ulcérée perd des protéines, du sang et des électrolytes, et sa capacité d’absorption diminue. Les cytokines stimulent la sécrétion.</p>
<div class="lab">Diarrhée cholérétique</div><p>Par perte de sels biliaires après atteinte ou résection iléale limitée.</p>
<div class="lab">Stéatorrhée</div><p>Par résection longue ou atteinte étendue du grêle.</p>
<div class="lab">Pullulation bactérienne</div><p>En amont d’une sténose ou après perte de la valvule iléocæcale : les bactéries déconjuguent les sels biliaires et consomment la vitamine B12.</p>
<div class="lab">Conséquence pratique</div><p>Une diarrhée persistante en rémission endoscopique ne justifie pas d’intensifier l’immunosuppression : elle fait chercher l’un des mécanismes non inflammatoires, ou un trouble fonctionnel associé.</p></template>

<template data-pop="k50-masse" data-title="Masse de la fosse iliaque droite">
<div class="lab">Signification</div><p>Elle correspond à des anses iléales épaissies et agglutinées avec leur mésentère inflammatoire, ou à un abcès.</p>
<div class="lab">Technique</div><p>Palpation douce à plat, mains réchauffées, du quadrant opposé vers la fosse iliaque droite ; noter taille, sensibilité, mobilité.</p>
<div class="lab">Distinction</div><p>Une masse sensible avec fièvre élevée et frissons évoque un abcès et impose une imagerie en coupes. Chez le sujet âgé, une masse cæcale fait d’abord évoquer un cancer.</p></template>

<template data-pop="k50-eryth" data-title="Érythème noueux">
<div class="lab">Aspect</div><p>Nodules sous-cutanés rouges puis violacés, chauds et douloureux, de 1 à 5 cm, sur les faces antérieures des jambes, évoluant comme une ecchymose.</p>
<div class="lab">Mécanisme</div><p>Panniculite septale d’hypersensibilité, liée à l’activité inflammatoire intestinale.</p>
<div class="lab">Valeur</div><p>Présent chez 6 % des patients atteints de maladie de Crohn dans la cohorte suisse. Il évolue parallèlement aux poussées.</p>
<div class="lab">Conduite</div><p>Traiter la poussée intestinale ; repos, contention ; corticoïdes systémiques si besoin. Exclure les autres causes (streptocoque, sarcoïdose, tuberculose, médicaments).</p></template>

<template data-pop="k50-pyoderma" data-title="Pyoderma gangrenosum">
<div class="lab">Aspect</div><p>Pustule ou nodule qui s’ulcère rapidement, avec bord violacé, surélevé et décollé, et fond nécrotique ; souvent sur les jambes ou autour d’une stomie.</p>
<div class="lab">Mécanisme</div><p>Dermatose neutrophilique, sans infection.</p>
<div class="lab">Piège majeur</div><p>Le débridement chirurgical aggrave la lésion (phénomène de pathergie). Le diagnostic est clinique et d’exclusion.</p>
<div class="lab">Conduite</div><p>Avis dermatologique ; corticoïdes ; anti-TNF dans les formes résistantes. Un pyoderma gangrenosum isolé relève aussi du cours L88 du fragment de dermatologie.</p></template>

<template data-pop="k50-uveite" data-title="Épisclérite et uvéite">
<div class="lab">Épisclérite</div><p>Rougeur sectorielle, gêne modérée, vision normale ; elle suit l’activité intestinale et guérit avec elle.</p>
<div class="lab">Uvéite antérieure</div><p>Œil rouge douloureux, photophobie, baisse visuelle, rougeur péri-cornéenne ; souvent indépendante de l’activité intestinale et associée à la spondyloarthrite.</p>
<div class="lab">Conséquence pratique</div><p>L’uvéite impose un examen ophtalmologique à la lampe à fente le jour même, car elle menace la vision. Dans la cohorte suisse, l’uvéite concernait 6 % des patients atteints de maladie de Crohn.</p></template>

<template data-pop="k50-csp" data-title="Cholangite sclérosante primitive">
<div class="lab">Définition</div><p>Inflammation et fibrose des voies biliaires intra- et extrahépatiques, qui évolue vers la cirrhose biliaire.</p>
<div class="lab">Lien avec la maladie de Crohn</div><p>Elle est plus fréquente dans la rectocolite hémorragique (4 %) que dans la maladie de Crohn (1 %) dans la cohorte suisse, surtout en cas d’atteinte colique.</p>
<div class="lab">Signes d’appel</div><p>Phosphatase alcaline et gamma-glutamyltransférase élevées, prurit, ictère, cholangites.</p>
<div class="lab">Conséquence pratique</div><p>Diagnostic par IRM des voies biliaires ; surveillance du cholangiocarcinome et coloscopie annuelle en cas de colite associée. Le détail relève du cours K83.</p></template>
