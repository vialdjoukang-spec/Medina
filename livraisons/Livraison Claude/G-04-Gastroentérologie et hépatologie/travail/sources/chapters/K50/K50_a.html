<section class="ilot" id="k50-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une étudiante de 24 ans consulte son médecin de famille à Neuchâtel pour une diarrhée non sanglante qui dure depuis quatre mois. Elle va à selles cinq fois par jour, dont une fois la nuit. Elle décrit des douleurs de la fosse iliaque droite après les repas et a perdu 6 kg. Elle fume dix cigarettes par jour. Elle signale des aphtes buccaux récidivants et une tuméfaction douloureuse près de l’anus il y a deux mois, incisée aux urgences. La protéine C-réactive vaut 38 mg/L, l’hémoglobine 108 g/L et la calprotectine fécale 820 µg/g.</p>
<p>La question qui structure tout le cours est la suivante : <b>cette patiente a-t-elle une maladie de Crohn, comment le prouver et en préciser l’étendue, quelles complications chercher maintenant, et quel traitement empêchera la destruction progressive de son intestin ?</b></p>
<p>À la fin du cours, le médecin assistant sait reconnaître un tableau évocateur, organiser l’<button class="w" data-k="k50-ileocolo">iléocoloscopie avec biopsies (examen central du diagnostic)</button> et l’imagerie du grêle, classer la maladie selon <button class="w" data-k="k50-montreal">la classification de Montréal (âge, localisation, comportement)</button>, reconnaître une urgence chirurgicale, et expliquer la place de chaque traitement selon les lignes directrices de l’European Crohn’s and Colitis Organisation (ECCO) 2024 et les informations professionnelles suisses.</p>
<div class="key"><b>Message fondateur.</b> La maladie de Crohn est une inflammation chronique <b>transmurale</b> qui peut toucher tout le tube digestif, de la bouche à l’anus. Parce qu’elle traverse toute l’épaisseur de la paroi, elle ne se contente pas d’ulcérer la muqueuse : elle fabrique avec le temps des <b>sténoses</b>, des <b>fistules</b> et des <b>abcès</b>. Les symptômes peuvent s’atténuer pendant que les lésions progressent. C’est pourquoi le traitement vise la cicatrisation objective de l’intestin, et pas seulement le confort du patient.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="k50-transmural">inflammation transmurale (pourquoi elle crée sténoses et fistules)</button>, le <button class="w" data-k="k50-granulome">granulome épithélioïde sans nécrose caséeuse (lésion histologique évocatrice)</button> et l’<button class="w" data-k="k50-il23">axe interleukine 23 et lymphocytes Th17 (cible des traitements récents)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="k50-1"><h2><span class="n">1</span>Définition, classifications et codage</h2>
<p>La maladie de Crohn appartient aux <b>maladies inflammatoires chroniques de l’intestin (MICI)</b>, avec la rectocolite hémorragique. Elle se définit par une inflammation chronique, évoluant par poussées, segmentaire et transmurale, qui peut atteindre n’importe quel segment digestif. Aucun examen isolé ne la prouve. Le diagnostic repose sur un faisceau associant clinique, endoscopie, histologie, imagerie et biologie, après exclusion des causes infectieuses et des autres causes d’entérocolite.</p>
<h3>1.1 Ce qui distingue la maladie de Crohn de la rectocolite hémorragique</h3>
<p>Les deux maladies se confondent parfois lorsque seul le côlon est atteint. La distinction compte, car le pronostic, la chirurgie et certains traitements diffèrent. Le tableau suivant met en regard les caractères qui orientent le plus souvent.</p>
<table class="t"><tr><th>Caractère</th><th>Maladie de Crohn</th><th>Rectocolite hémorragique</th></tr>
<tr><td>Siège</td><td>Toute la longueur du tube digestif ; iléon terminal le plus souvent</td><td>Rectum constant, extension continue vers le côlon proximal</td></tr>
<tr><td>Distribution</td><td>Segmentaire, avec zones saines entre les lésions</td><td>Continue, sans intervalle sain</td></tr>
<tr><td>Profondeur</td><td>Transmurale</td><td>Muqueuse et sous-muqueuse superficielle</td></tr>
<tr><td>Lésions anopérinéales</td><td>Fréquentes : fistules, abcès, fissures atypiques</td><td>Rares</td></tr>
<tr><td>Granulomes</td><td>Présents dans une minorité de biopsies, très évocateurs</td><td>Absents</td></tr>
<tr><td>Effet du tabac</td><td>Aggrave la maladie</td><td>Associé à un risque plus faible</td></tr></table>
<p>La lecture commence par le rectum : un rectum sain à côté d’un côlon ulcéré oriente vers la maladie de Crohn, car la rectocolite hémorragique débute presque toujours au rectum. L’erreur fréquente consiste à conclure sur une seule coloscopie faite sous traitement, car un traitement local peut faire cicatriser le rectum. Chez notre patiente, l’abcès de la marge anale et la douleur iléale orientent déjà vers la maladie de Crohn. La rectocolite hémorragique relève du cours <a href="#/entry/K51">K51 — Rectocolite hémorragique (G-04-Gastroentérologie et hépatologie)</a>. Lorsqu’une colite reste inclassable après un bilan complet, la CIM-10-GM la range parmi les colites indéterminées de la catégorie <a href="#/entry/K52">K52 — Autres colites non infectieuses (G-04-Gastroentérologie et hépatologie)</a>.</p>
<h3>1.2 Classification de Montréal</h3>
<p>La <button class="w" data-k="k50-montreal">classification de Montréal (Satsangi, Gut 2006)</button> décrit chaque patient par trois lettres. Elle sert à prédire l’évolution et à choisir le traitement, car une maladie pénétrante ou périanale se comporte autrement qu’une iléite inflammatoire pure.</p>
<table class="t"><tr><th>Axe</th><th>Classe</th><th>Définition</th></tr>
<tr><td rowspan="3">Âge au diagnostic (A)</td><td>A&#8288;1</td><td>16 ans ou moins</td></tr>
<tr><td>A&#8288;2</td><td>17 à 40 ans</td></tr>
<tr><td>A&#8288;3</td><td>Plus de 40 ans</td></tr>
<tr><td rowspan="4">Localisation (L)</td><td>L1</td><td>Iléale (iléon terminal, avec ou sans atteinte cæcale limitée)</td></tr>
<tr><td>L2</td><td>Colique</td></tr>
<tr><td>L3</td><td>Iléocolique</td></tr>
<tr><td>L4</td><td>Modificateur ajouté : atteinte digestive haute (œsophage, estomac, duodénum, jéjunum)</td></tr>
<tr><td rowspan="4">Comportement (B)</td><td>B&#8288;1</td><td>Inflammatoire, ni sténosant ni pénétrant</td></tr>
<tr><td>B&#8288;2</td><td>Sténosant</td></tr>
<tr><td>B&#8288;3</td><td>Pénétrant (fistule interne, abcès)</td></tr>
<tr><td>p</td><td>Modificateur ajouté : atteinte périanale</td></tr></table>
<p>Le comportement change avec le temps : beaucoup de patients classés B&#8288;1 au diagnostic deviennent B&#8288;2 ou B&#8288;3 au fil des années. La localisation reste au contraire stable. Notre patiente, si l’iléon terminal est seul atteint et qu’une fistule anale est confirmée, sera notée A&#8288;2 L1 B&#8288;1p. Le « p » signale à lui seul un pronostic plus sévère et oriente vers un traitement avancé précoce.</p>
<h3>1.3 Activité de la maladie</h3>
<p>L’activité se mesure par des indices cliniques et endoscopiques. L’<button class="w" data-k="k50-hbi">indice de Harvey-Bradshaw (score clinique simple)</button> est utilisable au cabinet. Le Crohn’s Disease Activity Index est l’indice des essais thérapeutiques. Le <button class="w" data-k="k50-sescd">score endoscopique simplifié SES-CD</button> mesure les lésions visibles. Ces trois mesures divergent souvent : une patiente peut se sentir bien avec des ulcères profonds, ou souffrir sans inflammation à cause d’une sténose fibreuse ou d’un trouble fonctionnel associé.</p>
<h3>1.4 Codage CIM-10-GM 2024</h3>
<p>La catégorie K50 regroupe toutes les formes ; l’entérite granulomateuse y est incluse. La rectocolite hémorragique (K51) et la colite indéterminée (K52) en sont exclues. Le tableau indique le sous-code selon le siège réellement atteint, ce qui impose de connaître l’extension complète avant de coder.</p>
<table class="t"><tr><th>Sous-code</th><th>Intitulé</th><th>Exemple</th></tr>
<tr><td>K50.0</td><td>Maladie de Crohn de l’intestin grêle (duodénale, jéjunale, iléale)</td><td>Iléite terminale isolée</td></tr>
<tr><td>K50.1</td><td>Maladie de Crohn du gros intestin (côlon, rectum)</td><td>Colite granulomateuse isolée</td></tr>
<tr><td>K50.80</td><td>Maladie de Crohn gastrique</td><td>Ulcères antraux avec granulomes</td></tr>
<tr><td>K50.81</td><td>Maladie de Crohn de l’œsophage</td><td>Ulcères œsophagiens profonds</td></tr>
<tr><td>K50.82</td><td>Maladie de Crohn de plusieurs segments, dont grêle et gros intestin</td><td>Forme iléocolique (Montréal L3)</td></tr>
<tr><td>K50.88</td><td>Autres formes de la maladie de Crohn</td><td>Forme précisée ne relevant d’aucun code ci-dessus</td></tr>
<tr><td>K50.9</td><td>Maladie de Crohn, sans précision</td><td>Entérite régionale sans précision</td></tr></table>
<p>Le piège de codage le plus fréquent concerne la forme iléocolique : elle ne se code ni K50.0 ni K50.1, mais K50.82, car la CIM-10-GM exclut explicitement l’atteinte combinée des deux premiers sous-codes. La catégorie K50.8 sert d’intitulé de regroupement pour K50.80 à K50.88. Une arthrite associée se code en plus dans la catégorie M07 (arthrites entéropathiques), avec la maladie digestive comme étiologie.</p>
</section>

<section class="ilot" id="k50-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>Selon une synthèse de données populationnelles suisses publiée en 2019 (Schoepfer et Safroneeva, Therapeutische Umschau), les MICI touchent environ <b>0,4 % de la population suisse</b>, soit une personne sur 250. La maladie de Crohn et la rectocolite hémorragique y contribuent à parts égales : environ <b>une personne sur 500</b> vit avec une maladie de Crohn. Environ 80 % des patients atteints de MICI ont au moins une comorbidité, surtout cardiovasculaire, rhumatologique ou psychique. Les coûts annuels augmentent, et les médicaments ambulatoires en sont le principal moteur.</p>
<p>La <button class="w" data-k="k50-sibdcs">cohorte suisse des MICI (Swiss Inflammatory Bowel Disease Cohort Study, depuis 2006)</button> suit des milliers de patients et fournit les données suisses les plus utiles. Dans son analyse de 905 patients atteints de maladie de Crohn, l’âge médian au diagnostic était de <b>26 ans</b> et le <button class="w" data-k="k50-delai">délai diagnostique médian de 9 mois (et ses conséquences)</button>. Un délai d’au moins 25 mois était associé à plus de sténoses intestinales et de chirurgie intestinale. Cette association n’est pas une preuve de causalité, mais elle est cohérente avec la progression lésionnelle d’une inflammation non traitée.</p>
<h3>2.1 Histoire naturelle</h3>
<p>La maladie évolue par poussées et rémissions, mais les dommages s’accumulent entre les poussées. Une inflammation persistante remplace progressivement la paroi par de la fibrose (sténose) ou la creuse jusqu’à traverser la séreuse (fistule, abcès). Ce passage d’un comportement inflammatoire à un comportement sténosant ou pénétrant explique que le risque chirurgical augmente avec la durée de la maladie. La localisation iléale y est particulièrement exposée, car la lumière iléale est étroite et la valvule iléocæcale forme un point de rétrécissement physiologique.</p>
<div class="key"><b>À retenir.</b> En Suisse, environ une personne sur 500 vit avec une maladie de Crohn, diagnostiquée en général vers 25 ans. Le délai diagnostique, de 9 mois en médiane dans la cohorte suisse, est associé à davantage de sténoses et d’opérations. Le médecin de famille raccourcit ce délai lorsqu’il demande une calprotectine fécale devant une diarrhée chronique avec signes d’alarme. La physiopathologie explique pourquoi ce délai compte.</div>
</section>

<section class="ilot" id="k50-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La maladie de Crohn résulte d’une réponse immunitaire excessive et persistante contre la flore intestinale, chez un hôte génétiquement prédisposé, sous l’influence de facteurs d’environnement. La chaîne se lit de la barrière muqueuse jusqu’à la complication. Chaque maillon explique un signe et désigne une cible thérapeutique.</p>
<h3>3.1 État normal</h3>
<p>Chez le sujet sain, une seule couche de cellules épithéliales sépare environ 10<sup>13</sup> à 10<sup>14</sup> bactéries de l’organisme. Le mucus, les peptides antimicrobiens sécrétés par les cellules de Paneth de l’iléon et les immunoglobulines A empêchent les bactéries de toucher l’épithélium. Les quelques bactéries qui franchissent la barrière sont détruites par les macrophages, sans inflammation durable. Cet état s’appelle la tolérance : le système immunitaire muqueux ignore la flore commensale.</p>
<h3>3.2 Première charnière : défaut de reconnaissance et de destruction bactérienne</h3>
<p>Le gène <button class="w" data-k="k50-nod2">NOD2 (premier gène de susceptibilité identifié, 2001)</button> code un capteur intracellulaire de fragments de paroi bactérienne. Ses variants perte de fonction diminuent la sécrétion de défensines par les cellules de Paneth et la destruction des bactéries dans les macrophages. Les variants des gènes d’autophagie ATG16L1 et IRGM réduisent la dégradation des bactéries phagocytées. Les bactéries persistent alors dans la paroi et entretiennent une stimulation immunitaire. Ce défaut explique la prédominance iléale de la maladie, car les cellules de Paneth sont surtout iléales.</p>
<h3>3.3 Deuxième charnière : réponse Th1 et Th17 entretenue</h3>
<p>Les macrophages et les cellules dendritiques stimulés produisent de l’interleukine 12 et de l’<button class="w" data-k="k50-il23">interleukine 23 (IL-23)</button>. L’IL-12 oriente les lymphocytes T vers un profil Th1 producteur d’interféron gamma. L’IL-23 maintient des lymphocytes Th17 producteurs d’IL-17 et d’IL-22. Les macrophages activés libèrent du facteur de nécrose tumorale alpha (TNF-α). Le TNF-α active l’endothélium, attire de nouveaux leucocytes et tue des cellules épithéliales. Les lymphocytes activés exprimant l’intégrine α4β7 sont recrutés dans la muqueuse intestinale par la molécule d’adressage MAdCAM-1 de l’endothélium digestif. Chaque élément de cette description correspond à un médicament : anti-TNF, anti-IL-12 et IL-23, anti-IL-23, anti-intégrine, inhibiteur des Janus kinases.</p>
<h3>3.4 Troisième charnière : lésion transmurale</h3>
<p>L’inflammation n’est pas limitée à la muqueuse. Des agrégats lymphoïdes et des granulomes se forment dans toute l’épaisseur de la paroi et dans le mésentère. Les ulcérations commencent comme de petites ulcérations aphtoïdes au-dessus des follicules lymphoïdes, puis deviennent des ulcères linéaires et des fissures qui s’enfoncent dans la paroi. Entre les ulcères, la muqueuse œdématiée réalise l’aspect en « pavé ». Le mésentère réagit en entourant l’anse d’une graisse hypertrophique appelée graisse rampante, visible à l’imagerie et par le chirurgien.</p>
<h3>3.5 Quatrième charnière : complications et manifestations</h3>
<p>Une fissure qui traverse la séreuse rencontre une anse voisine, la vessie, le vagin ou la peau : c’est une <button class="w" data-k="k50-fistule">fistule (trajet anormal entre deux épithéliums)</button>. Si elle débouche dans le tissu graisseux sans trouver d’organe, elle forme un <button class="w" data-k="k50-abces">abcès intra-abdominal</button>. Si l’inflammation cicatrise par fibrose et hypertrophie musculaire, la lumière se rétrécit : c’est la <button class="w" data-k="k50-stenose">sténose (inflammatoire, fibreuse ou mixte)</button>. L’atteinte de l’iléon terminal empêche l’absorption de la <button class="w" data-k="k50-b12">vitamine B12 et des sels biliaires</button>. Le défaut d’absorption des sels biliaires provoque une <button class="w" data-k="k50-selsbil">diarrhée cholérétique</button>, puis une stéatorrhée si la perte dépasse la capacité de synthèse hépatique.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Les corticoïdes freinent toute la cascade de manière non spécifique et ne cicatrisent pas durablement la paroi. Les anti-TNF neutralisent le médiateur effecteur commun ; les anti-IL-23 et l’ustékinumab coupent l’entretien des lymphocytes Th17 ; le védolizumab empêche les lymphocytes d’entrer dans l’intestin ; l’upadacitinib bloque la signalisation intracellulaire de plusieurs cytokines. Aucun traitement ne dissout une sténose fibreuse constituée : elle relève d’une dilatation ou de la chirurgie.</div>
</section>

<section class="ilot" id="k50-4"><h2><span class="n">4</span>Facteurs de risque et déclencheurs</h2>
<p>Trois notions doivent rester distinctes. Les facteurs de risque expliquent pourquoi une personne développe la maladie. Les déclencheurs expliquent pourquoi une poussée survient maintenant. Les facteurs de mauvais pronostic désignent le patient qui risque une évolution compliquée ; ils sont traités à l’îlot 9.</p>
<h3>4.1 Facteurs de risque de développer la maladie</h3>
<div class="two">
<div class="card"><h4>Facteurs de l’hôte</h4><p><b>Antécédents familiaux</b> : un apparenté au premier degré atteint de MICI est le facteur de risque le plus fort connu ; dans la cohorte suisse, une histoire familiale de MICI était aussi associée aux manifestations extra-intestinales actives. <b>Génétique</b> : plus de 200 régions génomiques sont associées aux MICI ; NOD2 est la plus forte pour la maladie de Crohn iléale. Chez le jeune enfant, une forme monogénique (déficit du récepteur de l’IL-10, par exemple) doit être recherchée lorsque la maladie débute avant six ans.</p></div>
<div class="card"><h4>Facteurs d’environnement</h4><p><b>Tabac</b> : il augmente le risque de maladie de Crohn, la fréquence des poussées, des complications et des récidives postopératoires. Le <button class="w" data-k="k50-tabac">tabac (mécanismes, bénéfice de l’arrêt)</button> est le seul facteur modifiable dont l’arrêt améliore nettement l’évolution. <b>Antibiotiques répétés</b> dans l’enfance, alimentation riche en produits ultra-transformés et pauvre en fibres, vie urbaine : ces facteurs sont associés au risque dans des études d’observation, sans preuve de causalité.</p></div></div>
<h3>4.2 Déclencheurs de poussée</h3>
<p>Les plus fréquents sont l’arrêt ou l’irrégularité du traitement d’entretien, la perte de réponse à un anticorps par formation d’anticorps anti-médicament, la reprise du tabac, une infection intestinale et la prise d’<b>anti-inflammatoires non stéroïdiens</b>. Les AINS inhibent les prostaglandines qui protègent la muqueuse et augmentent sa perméabilité ; leur prise doit être recherchée à chaque poussée. Une infection à <i>Clostridioides difficile</i> ou à cytomégalovirus mime une poussée ; elle doit être exclue avant d’intensifier l’immunosuppression, car l’intensification aggraverait l’infection.</p>
<div class="trap"><span class="k">Piège</span>Une « poussée » qui ne répond pas aux corticoïdes peut être une infection à cytomégalovirus de la muqueuse colique, un abcès méconnu ou une sténose fibreuse. Augmenter l’immunosuppression sans réévaluer ces trois hypothèses expose à une perforation ou à un sepsis.</div>
<div class="key"><b>À retenir.</b> L’histoire familiale et le tabac sont les deux facteurs de risque à rechercher systématiquement ; seul le tabac est modifiable, et son arrêt change le pronostic. Devant toute poussée, le médecin vérifie l’adhésion, les AINS et une infection intestinale avant d’intensifier le traitement. L’anamnèse organise cette recherche.</div>
</section>

<section class="ilot" id="k50-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche quatre éléments : un profil de symptômes chroniques organiques, des signes d’alarme qui distinguent une maladie inflammatoire d’un trouble fonctionnel, des indices de complication, et les manifestations extra-intestinales. Elle précise aussi le terrain avant tout traitement immunosuppresseur.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Personnels</h4><p><button class="w" data-k="k50-perianal">Abcès ou fistule de la marge anale (atteinte périanale)</button> ; aphtes buccaux récidivants ; douleurs articulaires, nodules douloureux des jambes, œil rouge douloureux ; anémie ou carence en fer inexpliquée ; retard de croissance ou de puberté chez l’adolescent ; appendicectomie pour une « appendicite » à évolution atypique ; tuberculose, hépatite B, zona et vaccinations, utiles avant une immunosuppression.</p></div>
<div class="card"><h4>Familiaux, médicamenteux et sociaux</h4><p>MICI, maladie cœliaque ou spondyloarthrite chez les apparentés. Tabac en paquets-années. AINS, antibiotiques récents et contraception. Voyages et contacts infectieux (diarrhée infectieuse, tuberculose). Projet de grossesse, car il influence le choix du traitement. Retentissement scolaire, professionnel et psychique.</p></div></div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p><b>Diarrhée chronique</b> — Présente chez la majorité des patients. Elle dure plus de quatre semaines et réveille souvent la nuit. Le <button class="w" data-k="k50-diarrhee">mécanisme de la diarrhée (inflammatoire, cholérétique, stéatorrhée, sténose)</button> dépend du siège : l’atteinte colique donne des selles fréquentes et parfois glairo-sanglantes, l’atteinte iléale des selles plus volumineuses.</p>
<p><b>Douleur abdominale</b> — Typiquement dans la fosse iliaque droite pour l’atteinte iléale, postprandiale et soulagée par l’émission de gaz ou de selles lorsqu’une sténose gêne le transit. Une douleur à type de crampes avec ballonnement et vomissements évoque une sténose serrée.</p>
<p><b>Amaigrissement et asthénie</b> — Ils résultent de l’anorexie inflammatoire, de la peur de manger quand le repas déclenche la douleur, de la malabsorption et de l’anémie.</p>
<p><b>Fièvre</b> — Une fébricule accompagne l’inflammation active ; une fièvre élevée avec frissons et masse douloureuse évoque un abcès jusqu’à preuve du contraire.</p>
<p><b>Symptômes anopérinéaux</b> — Écoulement purulent, douleur pulsatile, tuméfaction : ils signalent une fistule ou un abcès et peuvent précéder les symptômes digestifs de plusieurs années.</p>
<div class="key"><b>Signes d’alarme qui orientent vers une maladie organique plutôt qu’un intestin irritable.</b> Diarrhée nocturne ; sang dans les selles ; amaigrissement involontaire ; fièvre ; atteinte anopérinéale ; anémie, carence en fer ou syndrome inflammatoire ; début après 50 ans ; antécédent familial de MICI ou de cancer colorectal. Un seul de ces signes justifie un bilan biologique avec calprotectine et, selon le résultat, un avis gastroentérologique.</div>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Iléite terminale (forme typique)</h4><p>Jeune adulte, douleur de la fosse iliaque droite, diarrhée, amaigrissement, parfois masse palpable. Une présentation aiguë peut imiter une appendicite.</p></div>
<div class="card"><h4>Colite de Crohn</h4><p>Diarrhée parfois sanglante, douleurs coliques, rectum souvent épargné. La distinction d’avec la rectocolite hémorragique repose sur l’endoscopie et l’histologie.</p></div>
<div class="card"><h4>Forme périanale</h4><p>Fistules complexes, abcès récidivants, fissures latérales ou indolores, marisques œdémateuses. Elle aggrave le pronostic et impose une IRM pelvienne.</p></div>
<div class="card"><h4>Forme sténosante</h4><p>Douleurs postprandiales, ballonnement, épisodes subocclusifs. Le syndrome de König, douleur suivie d’un gargouillement et d’un soulagement, traduit le passage du contenu à travers la sténose.</p></div>
<div class="card"><h4>Forme pénétrante</h4><p>Fistule entéro-vésicale (pneumaturie, infections urinaires à germes digestifs), entéro-vaginale, entéro-cutanée, ou abcès du psoas avec douleur à l’extension de hanche.</p></div>
<div class="card"><h4>Forme haute et forme de l’enfant</h4><p>Dyspepsie, vomissements, ulcères duodénaux sans Helicobacter pylori. Chez l’enfant, le retard statural peut être le seul signe ; il impose de mesurer la courbe de croissance.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Étiqueter « intestin irritable » un jeune adulte qui a une diarrhée nocturne ou un amaigrissement. Le syndrome de l’intestin irritable ne réveille pas la nuit et ne fait pas maigrir ; une calprotectine normale le soutient, une calprotectine élevée impose une endoscopie. Le trouble fonctionnel est traité dans <a href="#/entry/K58">K58 — Syndrome de l’intestin irritable et troubles fonctionnels (G-04-Gastroentérologie et hépatologie)</a>.</div>
</section>

<section class="ilot" id="k50-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen évalue la gravité, cherche une masse ou une complication, et inspecte systématiquement la région anale, la bouche, la peau, les yeux et les articulations. Il peut être normal entre les poussées. Un examen normal n’exclut donc pas la maladie.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p><b>Poids, taille et indice de masse corporelle</b>, comparés au poids habituel : une perte de plus de 10 % en six mois signe une dénutrition. Chez l’enfant, la courbe de croissance remplace l’IMC. <b>Température</b> : une fièvre au-dessus de 38,5 °C avec frissons fait chercher un abcès. <b>Fréquence cardiaque et pression artérielle</b> : une tachycardie et une hypotension traduisent une hypovolémie par diarrhée, une hémorragie ou un sepsis. <b>Pâleur</b> : anémie.</p></div>
<div class="card"><h4>Abdomen</h4><p>À l’état normal, l’abdomen est souple et indolore, sans masse. En cas d’atteinte iléale, la palpation trouve une sensibilité de la fosse iliaque droite et parfois une <button class="w" data-k="k50-masse">masse de la fosse iliaque droite (anses agglutinées ou abcès)</button>. Un ballonnement avec bruits hydroaériques intenses évoque une sténose. Une défense ou une contracture évoque une perforation. Rechercher les orifices cutanés d’une fistule, souvent sur une cicatrice opératoire.</p></div>
<div class="card"><h4>Région anopérinéale</h4><p>L’inspection, avec écartement doux des fesses, est obligatoire à chaque bilan initial. Elle cherche des marisques œdémateuses, une fissure latérale ou large, un orifice fistuleux externe, une tuméfaction rouge et chaude. Le <button class="w" data-k="k50-perianal">toucher rectal</button> évalue une induration, une sténose et la tonicité sphinctérienne. Un abcès douloureux impose un avis chirurgical le jour même.</p></div>
<div class="card"><h4>Manifestations extra-intestinales visibles</h4><p>Aphtes buccaux ; <button class="w" data-k="k50-eryth">érythème noueux</button> (nodules rouges douloureux des faces antérieures des jambes) ; <button class="w" data-k="k50-pyoderma">pyoderma gangrenosum</button> (ulcère à bord violacé décollé) ; œil rouge (<button class="w" data-k="k50-uveite">épisclérite ou uvéite</button>) ; synovites des grosses articulations ; douleur des sacro-iliaques ; hippocratisme digital dans les formes anciennes ; ictère discret (<button class="w" data-k="k50-csp">cholangite sclérosante primitive</button>).</p></div></div>
<div class="trap"><span class="k">Piège</span>Les corticoïdes masquent la fièvre, la défense et une partie de la douleur. Chez un patient sous corticoïdes ou sous anticorps monoclonal, une douleur abdominale modérée avec une protéine C-réactive élevée peut révéler un abcès ou une perforation couverte. L’imagerie en coupes doit alors être faite sans attendre l’aggravation clinique.</div>
