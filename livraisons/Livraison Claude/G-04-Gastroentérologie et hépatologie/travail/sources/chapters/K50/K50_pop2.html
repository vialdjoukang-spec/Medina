
<!-- ===== FENÊTRES K50 : examens, complications, stratégie ===== -->
<template data-pop="k50-crp" data-title="Protéine C-réactive dans la maladie de Crohn">
<div class="lab">Pourquoi la doser</div><p>Elle objective une inflammation systémique, aide à distinguer une poussée d’un trouble fonctionnel, et sert de marqueur de suivi chez les patients qui l’élèvent.</p>
<div class="lab">Mécanisme</div><p>L’interleukine 6 produite dans la paroi inflammatoire stimule sa synthèse hépatique. Sa concentration monte en quelques heures et redescend vite lorsque l’inflammation cède.</p>
<div class="lab">Interprétation</div><p>Une valeur élevée soutient une inflammation active ; une valeur très élevée avec fièvre fait chercher un abcès. Une valeur normale n’exclut pas une maladie active, en particulier iléale ou chez un patient qui ne l’élève jamais.</p>
<div class="lab">Conduite</div><p>STRIDE-II fixe sa normalisation comme cible à court terme. Sa remontée chez un patient en rémission justifie une réévaluation clinique, biologique et par imagerie.</p></template>

<template data-pop="k50-calpro" data-title="Calprotectine fécale">
<div class="lab">Définition</div><p>Protéine liant le calcium et le zinc, abondante dans le cytoplasme des neutrophiles. Sa concentration fécale reflète la migration des neutrophiles dans la lumière intestinale.</p>
<div class="lab">Pourquoi la doser</div><p>Au diagnostic, pour trier une diarrhée chronique : organique ou fonctionnelle. Au suivi, pour détecter une inflammation persistante ou une rechute sans endoscopie répétée.</p>
<div class="lab">Interprétation usuelle chez l’adulte</div><p>Moins de 50 µg/g : inflammation peu probable (seuil retenu notamment par le NICE dans son évaluation de 2013). Plus de 250 µg/g : inflammation active probable ; ce seuil a servi de critère d’intensification dans des essais de stratégie. Entre les deux : zone grise à répéter. Les seuils dépendent du test et du laboratoire.</p>
<div class="lab">Limites</div><p>Elle n’est pas spécifique : infection, AINS, inhibiteur de la pompe à protons, polypes, cancer, diverticulite l’élèvent. Elle sous-estime parfois une atteinte limitée au grêle.</p>
<div class="lab">Piège</div><p>Chez une personne de plus de 50 ans ou avec saignement, une calprotectine élevée impose une coloscopie, car elle peut révéler un cancer colorectal.</p>
<div class="lab">Conséquence pratique</div><p>Chez un patient connu, l’essai PROFILE définissait une inflammation résolue par une protéine C-réactive normale et une calprotectine inférieure à 200 µg/g.</p></template>

<template data-pop="k50-ileocolo" data-title="Iléocoloscopie avec biopsies">
<div class="lab">Rôle</div><p>Examen de référence de première intention pour le diagnostic : il visualise les lésions coliques et iléales terminales et permet les biopsies.</p>
<div class="lab">Technique</div><p>Préparation colique, sédation, exploration jusqu’au cæcum, intubation de la valvule iléocæcale et de l’iléon terminal. Biopsies étagées : iléon et chaque segment colique, rectum compris, y compris en zone d’aspect normal.</p>
<div class="lab">Résultats évocateurs</div><p>Ulcérations aphtoïdes, ulcères profonds linéaires, aspect pavimenteux, intervalles sains, rectum épargné, sténose, orifice fistuleux.</p>
<div class="lab">Limites et risques</div><p>Elle ne voit pas le grêle proximal ni la paroi profonde. En colite aiguë grave, une coloscopie complète expose à une perforation : une rectosigmoïdoscopie prudente suffit alors.</p>
<div class="lab">Suivi</div><p>Elle confirme la cicatrisation sous traitement et, après résection iléocolique, elle est recommandée 6 à 12 mois après l’opération (ECCO 2024, chirurgie, énoncé 4.22).</p></template>

<template data-pop="k50-entero-irm" data-title="Entéro-IRM">
<div class="lab">Principe</div><p>IRM de l’abdomen après distension du grêle par ingestion d’un liquide hyperosmolaire non résorbable (souvent 1 à 1,5 L), avec injection de gadolinium et un antispasmodique.</p>
<div class="lab">Ce qu’elle montre</div><p>Épaisseur et rehaussement de la paroi, œdème en T2, longueur atteinte, sténose avec dilatation d’amont, fistule, abcès, graisse rampante, ganglions.</p>
<div class="lab">Avantages</div><p>Tout le grêle est exploré, sans irradiation, ce qui compte chez des patients jeunes appelés à de nombreux examens. Elle aide à distinguer une composante inflammatoire d’une composante fibreuse.</p>
<div class="lab">Limites</div><p>Durée de 30 à 45 minutes, disponibilité, claustrophobie. Contre-indications de l’IRM (certains dispositifs implantés).</p></template>

<template data-pop="k50-echo" data-title="Échographie intestinale">
<div class="lab">Principe</div><p>Échographie de la paroi digestive avec sonde haute fréquence, sans préparation lourde, souvent faite par le gastroentérologue.</p>
<div class="lab">Signes d’activité</div><p>Épaisseur de paroi supérieure à 3 mm, perte de la stratification, hypervascularisation au Doppler couleur, graisse mésentérique hyperéchogène, ganglions. Elle détecte aussi sténoses, fistules et abcès.</p>
<div class="lab">Place</div><p>La guideline conjointe de 2025 (ECCO, ESGAR, Société européenne de pathologie, International Bowel Ultrasound Group) en élargit l’usage comme imagerie de première ligne du diagnostic et du suivi ; son texte intégral n’a pas pu être lu pour ce cours (accès refusé le 08.10.2026).</p>
<div class="lab">Limites</div><p>Dépend de l’opérateur et de la morphologie ; voit mal le jéjunum profond, le rectum et le pelvis.</p></template>

<template data-pop="k50-capsule" data-title="Vidéocapsule du grêle">
<div class="lab">Principe</div><p>Capsule munie d’une caméra, avalée, qui transmet des images de tout le grêle pendant plusieurs heures.</p>
<div class="lab">Indication</div><p>Suspicion de maladie de Crohn du grêle malgré une iléocoloscopie et une imagerie non concluantes ; recherche de lésions proximales.</p>
<div class="lab">Risque principal</div><p>Rétention de la capsule en amont d’une sténose, avec risque d’occlusion. La perméabilité du grêle se vérifie avant par imagerie ou par une capsule de perméabilité, qui se dissout si elle reste bloquée.</p>
<div class="lab">Limite</div><p>Elle ne permet ni biopsie ni traitement ; des ulcérations du grêle existent aussi sous AINS.</p></template>

<template data-pop="k50-irm-pelv" data-title="IRM pelvienne des fistules anales">
<div class="lab">Rôle</div><p>Examen de référence pour cartographier une fistule anopérinéale : trajet principal, ramifications, rapport avec les sphincters, abcès.</p>
<div class="lab">Classification</div><p>Selon Parks : intersphinctérienne, transsphinctérienne, suprasphinctérienne, extrasphinctérienne. En pratique clinique : fistule simple (basse, un orifice, sans abcès, sans rectite) ou complexe (haute, multiple, abcès, rectite, sténose).</p>
<div class="lab">Conséquence</div><p>La classification décide du geste : fistulotomie possible pour une fistule simple basse ; séton lâche et traitement médical pour une fistule complexe. Le suivi par IRM montre que la fermeture radiologique complète est rare sous traitement médical seul, ce qui explique l’intérêt d’une fermeture chirurgicale secondaire (ECCO 2024, chirurgie).</p></template>

<template data-pop="k50-tbc" data-title="Tuberculose intestinale et dépistage avant anti-TNF">
<div class="lab">Pourquoi elle imite la maladie de Crohn</div><p>Les deux atteignent la région iléocæcale, forment des granulomes et des ulcères, et donnent fièvre, diarrhée et amaigrissement.</p>
<div class="lab">Arguments en faveur de la tuberculose</div><p>Origine ou séjour en zone d’endémie, ulcères transversaux, valvule iléocæcale béante, granulomes grands, confluents et caséeux, atteinte pulmonaire associée.</p>
<div class="lab">Examens</div><p>Biopsies avec coloration, culture et amplification génique des mycobactéries ; radiographie thoracique ; test de libération de l’interféron gamma.</p>
<div class="lab">Conséquence</div><p>Un anti-TNF administré à un patient atteint de tuberculose méconnue peut provoquer une forme disséminée. L’information professionnelle suisse de l’infliximab contre-indique son usage en cas de tuberculose ; une tuberculose latente est traitée avant le début.</p></template>

<template data-pop="k50-yersinia" data-title="Iléites infectieuses aiguës">
<div class="lab">Agents</div><p><i>Yersinia enterocolitica</i>, <i>Campylobacter</i>, <i>Salmonella</i>, plus rarement d’autres bactéries.</p>
<div class="lab">Tableau</div><p>Début aigu, fièvre, diarrhée, douleur de la fosse iliaque droite ; adénite mésentérique fréquente avec <i>Yersinia</i>, qui peut simuler une appendicite.</p>
<div class="lab">Distinction</div><p>Coprocultures et amplification génique positives ; évolution favorable en quelques semaines ; histologie sans distorsion chronique des cryptes.</p>
<div class="lab">Conséquence</div><p>Une iléite aiguë de moins de quatre à six semaines n’est pas étiquetée maladie de Crohn sans preuve de chronicité.</p></template>

<template data-pop="k50-perfo" data-title="Perforation intestinale">
<div class="lab">Mécanisme</div><p>Un ulcère transmural, souvent en amont d’une sténose où la pression augmente, traverse la séreuse et ouvre la lumière dans la cavité péritonéale.</p>
<div class="lab">Signes</div><p>Douleur brutale, défense ou contracture, fièvre, état de choc. Sous corticoïdes, les signes péritonéaux peuvent manquer.</p>
<div class="lab">Diagnostic</div><p>Tomodensitométrie : air libre, épanchement, collection.</p>
<div class="lab">Conduite</div><p>Réanimation, antibiotiques à large spectre par voie intraveineuse, chirurgie urgente avec résection, souvent stomie temporaire.</p></template>

<template data-pop="k50-dilatation" data-title="Dilatation endoscopique au ballonnet">
<div class="lab">Indication</div><p>Sténose courte, de moins de 5 cm, du grêle accessible ou de l’anastomose, sans fistule ni abcès, lorsque l’expertise endoscopique existe (ECCO 2024, chirurgie, énoncé 4.5).</p>
<div class="lab">Données</div><p>Dans une revue de 1 463 patients et 3 213 dilatations citée par ECCO, chaque centimètre de sténose supplémentaire augmentait de 8 % le besoin de chirurgie.</p>
<div class="lab">Limites</div><p>Plusieurs séances peuvent être nécessaires ; le risque principal est la perforation. Les sténoses longues ou multiples relèvent de la chirurgie.</p></template>

<template data-pop="k50-anemie" data-title="Anémie de la maladie de Crohn">
<div class="lab">Mécanismes</div><p>Carence en fer par pertes sanguines et absorption duodénale réduite ; anémie inflammatoire par excès d’hepcidine, induit par l’interleukine 6, qui bloque la sortie du fer des macrophages et des entérocytes ; carence en vitamine B12 ou en folates ; toxicité médicamenteuse.</p>
<div class="lab">Pourquoi elle aggrave l’état du patient</div><p>La baisse de l’hémoglobine diminue le transport artériel d’oxygène. L’organisme compense par une tachycardie et une augmentation du débit cardiaque, ce qui explique l’asthénie et la dyspnée d’effort, même sans poussée.</p>
<div class="lab">Diagnostic</div><p>Ferritine et coefficient de saturation de la transferrine. En présence d’inflammation, une ferritine jusqu’à 100 µg/L reste compatible avec une carence en fer.</p>
<div class="lab">Traitement</div><p>Fer par voie intraveineuse si l’anémie est marquée, si la maladie est active ou si le fer oral est mal toléré ; correction de la cause.</p></template>

<template data-pop="k50-cancer" data-title="Cancer colorectal et surveillance">
<div class="lab">Mécanisme</div><p>L’inflammation chronique de la muqueuse colique favorise une dysplasie, puis un adénocarcinome, selon une séquence différente de celle de l’adénome sporadique.</p>
<div class="lab">Qui surveiller</div><p>Les patients dont la colite de Crohn touche une part étendue du côlon. Le risque augmente avec la durée et l’étendue de la colite, l’inflammation persistante et une cholangite sclérosante associée.</p>
<div class="lab">Conduite</div><p>Coloscopie de surveillance débutée plusieurs années après le début des symptômes, puis répétée selon le risque, de préférence avec chromoendoscopie et biopsies ciblées, selon les lignes directrices ECCO sur les MICI et les cancers. En cas de cholangite sclérosante, surveillance annuelle dès le diagnostic. Les délais précis n’ont pas été relus en texte intégral pour ce cours.</p>
<div class="lab">Piège</div><p>Une sténose colique nouvelle doit être biopsiée : elle peut être maligne.</p></template>

<template data-pop="k50-t2t" data-title="STRIDE-II et traitement par cible">
<div class="lab">Définition</div><p>STRIDE-II est un consensus de l’International Organization for the Study of Inflammatory Bowel Diseases publié en 2021 (Turner, Gastroenterology 2021;160:1570-1583). Il fixe des cibles hiérarchisées pour guider le traitement.</p>
<div class="lab">Cibles</div><p>Court terme : réponse puis soulagement des symptômes, normalisation de la protéine C-réactive et de la calprotectine. Long terme : rémission clinique, cicatrisation endoscopique, absence d’invalidité, qualité de vie restaurée, croissance normale chez l’enfant. La cicatrisation transmurale n’est pas une cible formelle mais mesure la profondeur de la rémission.</p>
<div class="lab">Mise en œuvre</div><p>Fixer la cible et son délai au début du traitement, la mesurer, puis modifier le traitement si elle n’est pas atteinte. ECCO 2024 recommande cette approche (point pratique 6).</p>
<div class="lab">Limite</div><p>La plupart des données concernent les anti-TNF ; un essai de stratégie avec l’ustékinumab n’a pas montré de bénéfice d’une escalade guidée par l’endoscopie précoce.</p></template>

<template data-pop="k50-vaccins" data-title="Vaccinations du patient immunosupprimé">
<div class="lab">Principe</div><p>Les vaccins inactivés sont autorisés à tout moment, mais leur réponse est moins bonne sous immunosuppression. Les vaccins vivants (rougeole, oreillons, rubéole, varicelle, fièvre jaune) sont contre-indiqués sous traitement immunosuppresseur et doivent être faits avant, avec un délai d’au moins 4 semaines.</p>
<div class="lab">À vérifier au diagnostic</div><p>Statut vaccinal et sérologies (varicelle, hépatite B, rougeole). Plan de vaccination suisse de l’Office fédéral de la santé publique pour les personnes immunosupprimées : grippe annuelle, pneumocoques, hépatite B si non immun, zona par vaccin inactivé, papillomavirus selon l’âge, COVID-19 selon les recommandations en vigueur.</p>
<div class="lab">Source</div><p>Informations professionnelles suisses des anticorps et de l’upadacitinib (vaccins vivants) ; Plan de vaccination suisse, Office fédéral de la santé publique, édition en vigueur. Les calendriers détaillés relèvent des cours d’infectiologie.</p></template>

<template data-pop="k50-een" data-title="Nutrition entérale exclusive">
<div class="lab">Définition</div><p>Alimentation exclusivement par une formule liquide nutritionnellement complète, bue ou administrée par sonde, habituellement pendant 6 à 8 semaines.</p>
<div class="lab">Preuves</div><p>Chez l’enfant atteint de maladie luminale légère à modérée, elle est le traitement d’induction de première ligne selon ECCO et la société européenne de gastroentérologie pédiatrique, avec une cicatrisation muqueuse supérieure aux corticoïdes. Chez l’adulte, elle est inférieure aux corticoïdes en intention de traiter mais comparable chez les patients qui la tolèrent ; ECCO 2024 la suggère chez l’adulte motivé, avec soutien diététique (énoncé 14.1).</p>
<div class="lab">Avantages</div><p>Pas d’effet indésirable des corticoïdes, correction de la dénutrition, préparation à la chirurgie.</p>
<div class="lab">Limite</div><p>Adhésion difficile ; rechute fréquente à la reprise alimentaire sans traitement d’entretien.</p></template>

<template data-pop="k50-pronostic" data-title="Facteurs de mauvais pronostic">
<div class="lab">Au diagnostic</div><p>Âge jeune, atteinte étendue du grêle, atteinte digestive haute, atteinte périanale, ulcères profonds à l’endoscopie, comportement sténosant ou pénétrant d’emblée, recours précoce aux corticoïdes, tabagisme.</p>
<div class="lab">Pourquoi ils comptent</div><p>Ils signalent une maladie susceptible de détruire rapidement l’intestin. Chez ces patients, attendre l’échec de plusieurs lignes expose à des complications irréversibles.</p>
<div class="lab">Conséquence pratique</div><p>Ils plaident pour un traitement avancé précoce, comme l’association infliximab et immunomodulateur évaluée dans l’essai PROFILE.</p>
<div class="lab">Limite</div><p>Ces facteurs viennent d’études d’observation et ne prédisent pas l’évolution individuelle avec certitude ; le biomarqueur transcriptionnel testé dans PROFILE n’a pas montré d’utilité clinique.</p></template>

<template data-pop="k50-profile" data-title="Essai PROFILE (2024)">
<div class="lab">Question</div><p>Faut-il traiter d’emblée par infliximab et immunomodulateur un patient nouvellement diagnostiqué, plutôt que d’escalader après les poussées ? Et un biomarqueur sanguin permet-il de choisir ?</p>
<div class="lab">Méthode</div><p>Essai multicentrique britannique, ouvert, randomisé : 386 adultes avec maladie de Crohn active nouvellement diagnostiquée, inclus en médiane 12 jours après le diagnostic. Bras « descendant » : infliximab et immunomodulateur d’emblée. Bras « progressif accéléré » : corticoïdes, puis immunomodulateur, puis anti-TNF en cas de poussées.</p>
<div class="lab">Résultats</div><p>Rémission soutenue sans corticoïde ni chirurgie jusqu’à la semaine 48 : 79 % contre 15 %. Moins d’événements indésirables graves (15 contre 42) et de chirurgies abdominales pour complication (1 contre 10). Le biomarqueur n’a pas eu d’utilité clinique.</p>
<div class="lab">Limites</div><p>Essai ouvert, suivi d’un an, population britannique, critère composite.</p>
<div class="lab">Source</div><p>Noor N. M. et al. Lancet Gastroenterology and Hepatology 2024;9:415-427, PubMed 38402895.</p></template>

<template data-pop="k50-ecco-ch" data-title="ECCO 2024 et indications suisses : quelle règle suivre ?">
<div class="lab">Le contentieux</div><p>ECCO 2024 (traitement médical) a retiré de toutes ses recommandations l’exigence d’un échec, d’une intolérance ou d’une contre-indication au traitement « conventionnel » avant un traitement avancé. Les informations professionnelles suisses en vigueur restent formulées autrement : infliximab après échec d’un traitement conventionnel par corticoïdes ou immunosuppresseurs ; upadacitinib après échec d’au moins un biologique.</p>
<div class="lab">Source primaire la plus récente</div><p>Pour la stratégie clinique, ECCO 2024 est la source primaire la plus récente et applicable ; elle s’appuie notamment sur l’essai PROFILE. Pour le cadre réglementaire et le remboursement en Suisse, l’information professionnelle et la liste des spécialités en vigueur s’appliquent.</p>
<div class="lab">Conséquence pratique</div><p>Le gastroentérologue peut proposer un traitement avancé précoce chez un patient à haut risque ; hors indication suisse ou hors limitation de remboursement, il documente la justification et demande une garantie de prise en charge à l’assureur.</p>
<div class="lab">Textes</div><p>Gordon H. et al. Journal of Crohn’s and Colitis 2024;18(10):1531-1555, doi 10.1093/ecco-jcc/jjae091. Informations professionnelles suisses de Remicade (mars 2025) et de Rinvoq (juin 2026), compendium.ch, consultées le 08.10.2026.</p></template>

<template data-pop="k50-seton" data-title="Séton lâche">
<div class="lab">Définition</div><p>Fil ou lacet souple passé dans le trajet fistuleux et noué sans tension, qui maintient le trajet ouvert et drainé.</p>
<div class="lab">Pourquoi</div><p>Un trajet drainé ne forme plus d’abcès. Le séton permet de commencer sans danger un anti-TNF, qui fermerait sinon l’orifice externe au-dessus d’une collection.</p>
<div class="lab">Recommandations</div><p>ECCO 2024 (chirurgie) recommande le drainage par séton avant le traitement médical ou chirurgical des fistules complexes (énoncé 3.17). Elle déconseille le séton serrant, qui sectionne le sphincter et expose à l’incontinence, et le séton à vie comme seul traitement, sauf en situation palliative.</p></template>

<template data-pop="k50-ileocaecal" data-title="Résection iléocæcale laparoscopique précoce">
<div class="lab">Donnée</div><p>Un essai randomisé néerlandais a comparé chez 143 patients atteints d’iléite terminale non sténosante une résection iléocæcale laparoscopique à l’infliximab. La qualité de vie à 12 mois était comparable. À 5 ans, aucun patient opéré n’avait nécessité de nouvelle résection, alors que la moitié du groupe infliximab avait été opérée.</p>
<div class="lab">Recommandation</div><p>ECCO 2024 (chirurgie, énoncé 4.12) recommande la résection laparoscopique comme alternative à l’infliximab, et la suggère comme alternative à l’adalimumab, dans la maladie iléale ou iléocæcale limitée.</p>
<div class="lab">Conséquence pratique</div><p>L’option chirurgicale est présentée au patient dès le diagnostic d’une iléite courte, sans attendre l’échec de plusieurs traitements. Un traitement préventif postopératoire se discute selon le risque de récidive.</p></template>

<template data-pop="k50-rutgeerts" data-title="Score de Rutgeerts">
<div class="lab">Définition</div><p>Score endoscopique de la récidive postopératoire sur l’iléon néoterminal après résection iléocolique (Rutgeerts, Gastroenterology 1990).</p>
<div class="lab">Grades</div><p>i0 : aucune lésion. i1 : cinq ulcérations aphtoïdes ou moins. i2 : plus de cinq ulcérations aphtoïdes avec muqueuse normale entre elles, lésions plus larges espacées, ou lésions limitées à l’anastomose. i3 : iléite aphtoïde diffuse avec muqueuse inflammatoire. i4 : ulcères larges, nodules ou sténose.</p>
<div class="lab">Valeur</div><p>Un score d’au moins i2 prédit une récidive clinique et définit habituellement la récidive endoscopique.</p>
<div class="lab">Conduite</div><p>Iléocoloscopie 6 à 12 mois après la résection (ECCO 2024, chirurgie, énoncé 4.22) ; renforcement du traitement en cas de score i2 ou plus.</p></template>

<template data-pop="k50-eim" data-title="Manifestations extra-intestinales : données suisses">
<div class="lab">Étude</div><p>Cohorte suisse des MICI, 950 patients, dont 580 atteints de maladie de Crohn (Vavricka, American Journal of Gastroenterology 2011;106:110-119, doi 10.1038/ajg.2010.343).</p>
<div class="lab">Résultats dans la maladie de Crohn</div><p>43 % avaient une à cinq manifestations : arthrite 33 %, aphtes 10 %, uvéite 6 %, érythème noueux 6 %, spondylarthrite ankylosante 6 %, psoriasis 2 %, pyoderma gangrenosum 2 %, cholangite sclérosante primitive 1 %.</p>
<div class="lab">Facteurs associés</div><p>Maladie active (rapport des cotes 1,95) et antécédent familial de MICI (1,77).</p>
<div class="lab">Limite</div><p>Questionnaires remplis par les médecins dans une cohorte clinique ; les fréquences ne valent pas incidence populationnelle.</p></template>

<template data-pop="k50-arthr" data-title="Arthropathies entéropathiques">
<div class="lab">Arthrite périphérique pauciarticulaire</div><p>Moins de cinq grosses articulations (genoux, chevilles), aiguë, parallèle aux poussées, sans destruction articulaire.</p>
<div class="lab">Arthrite périphérique polyarticulaire</div><p>Petites articulations, symétrique, évolution indépendante de l’activité intestinale.</p>
<div class="lab">Atteinte axiale</div><p>Sacro-iliite et spondyloarthrite, indépendantes de l’activité intestinale.</p>
<div class="lab">Traitement</div><p>Les AINS soulagent mais peuvent déclencher une poussée : leur usage est bref et prudent. Les anti-TNF traitent à la fois l’intestin et l’articulation, y compris l’atteinte axiale. Le codage associe la catégorie M07 (arthrites entéropathiques) du fragment de rhumatologie.</p></template>

<template data-pop="k50-oxalate" data-title="Lithiase rénale oxalique entérique">
<div class="lab">Normal</div><p>Dans l’intestin sain, le calcium alimentaire se lie à l’oxalate et l’élimine dans les selles sous forme insoluble.</p>
<div class="lab">Après atteinte ou résection iléale</div><p>Les acides gras non absorbés captent le calcium. L’oxalate reste libre et soluble ; les sels biliaires augmentent la perméabilité colique. L’oxalate est absorbé par le côlon et précipite dans les urines avec le calcium.</p>
<div class="lab">Condition</div><p>Le côlon doit être en place : cette lithiase manque chez les patients porteurs d’une iléostomie, qui font plutôt des calculs d’acide urique par déshydratation.</p>
<div class="lab">Prévention</div><p>Hydratation abondante, régime pauvre en oxalate et en graisses, apport de calcium aux repas.</p></template>

<template data-pop="k50-grossesse" data-title="Grossesse et accouchement">
<div class="lab">Principe</div><p>L’activité de la maladie, et non la plupart des traitements d’entretien, est le principal danger pour la grossesse.</p>
<div class="lab">Voie d’accouchement</div><p>La voie basse est la règle. Une atteinte anopérinéale active ou une anastomose iléo-anale font discuter une césarienne, afin de ne pas aggraver les lésions sphinctériennes ; la décision se prend avec l’obstétricien et le gastroentérologue.</p>
<div class="lab">Nourrisson exposé</div><p>Les anticorps de type IgG1 traversent le placenta surtout au troisième trimestre. L’information professionnelle suisse de l’infliximab recommande de ne pas administrer de vaccin vivant pendant 12 mois après la naissance, sauf taux indétectable chez le nourrisson ; un décès par infection disséminée au BCG a été rapporté.</p>
<div class="lab">Réserve</div><p>Les lignes directrices ECCO sur la grossesse n’ont pas été relues en texte intégral pour ce cours.</p></template>

<template data-pop="k50-bilan" data-title="Bilan avant immunosuppression">
<div class="lab">Infections</div><p>Tuberculose latente (test de libération de l’interféron gamma, radiographie thoracique) ; hépatite B (antigène HBs, anticorps anti-HBc et anti-HBs) ; hépatite C ; VIH ; varicelle.</p>
<div class="lab">Pharmacogénétique</div><p>Thiopurine méthyltransférase et, selon l’origine, génotype NUDT15 avant une thiopurine.</p>
<div class="lab">Vaccinations</div><p>Mise à jour avant le début ; vaccins vivants au moins 4 semaines avant.</p>
<div class="lab">Autres</div><p>Formule sanguine, créatinine, transaminases, lipides avant upadacitinib, test de grossesse avant méthotrexate ou upadacitinib, examen gynécologique de dépistage.</p>
<div class="lab">Pourquoi</div><p>Ces infections se réactivent lorsque l’immunité cellulaire ou le TNF-α sont bloqués, parfois de manière mortelle ; les déficits enzymatiques exposent à une toxicité médullaire grave.</p></template>

<template data-pop="k50-jak" data-title="Janus kinases et upadacitinib">
<div class="lab">Normal</div><p>De nombreux récepteurs de cytokines n’ont pas d’activité enzymatique propre. Lorsqu’une cytokine s’y fixe, des Janus kinases associées se phosphorylent et activent des facteurs de transcription STAT, qui entrent dans le noyau.</p>
<div class="lab">Blocage</div><p>L’upadacitinib inhibe de manière préférentielle JAK1 et bloque ainsi la signalisation de plusieurs cytokines inflammatoires à la fois, dont l’interleukine 6 et l’interféron gamma.</p>
<div class="lab">Conséquences</div><p>Effet rapide par voie orale ; mais aussi zona, élévation des lipides et de la créatine kinase, neutropénie. Après 65 ans, l’information professionnelle suisse signale un risque accru d’infections graves, d’infarctus du myocarde et de cancers.</p></template>

<template data-pop="k50-madcam" data-title="MAdCAM-1 et intégrine α4β7">
<div class="lab">Normal</div><p>Les lymphocytes activés dans les ganglions mésentériques expriment l’intégrine α4β7. Celle-ci se lie à la molécule MAdCAM-1, exprimée par les veinules de la muqueuse digestive : le lymphocyte adhère, puis traverse la paroi vasculaire vers l’intestin.</p>
<div class="lab">Blocage</div><p>Le védolizumab se lie à α4β7 et empêche cette adhésion. Comme MAdCAM-1 est presque absent du cerveau, il ne réduit pas la surveillance immunitaire du système nerveux central.</p>
<div class="lab">Conséquence</div><p>Profil infectieux systémique favorable, efficacité intestinale, effet limité sur les manifestations extra-intestinales indépendantes de l’activité intestinale. Le natalizumab, qui bloque aussi α4β1, expose au contraire à la leucoencéphalopathie multifocale progressive.</p></template>
