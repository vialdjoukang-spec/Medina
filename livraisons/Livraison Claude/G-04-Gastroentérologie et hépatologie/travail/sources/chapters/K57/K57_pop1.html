<!-- ===== FENÊTRES : définitions, mécanismes, épidémiologie ===== -->
<template data-pop="k57-pseudo" data-title="Pseudodiverticule colique">
<div class="lab">Définition</div><p>Un pseudodiverticule est une hernie de la muqueuse et de la sous-muqueuse à travers la musculeuse. Il est dit « faux » parce que sa paroi ne contient pas de muscle, à la différence du diverticule de Meckel, qui contient toutes les couches.</p>
<div class="lab">Mécanisme</div><p>La muqueuse passe par l’orifice où le vaisseau droit traverse la musculeuse circulaire. Une pression endoluminale élevée la pousse vers l’extérieur. Le sac ainsi formé mesure habituellement quelques millimètres à un centimètre.</p>
<div class="lab">Conséquence clinique</div><p>Sans muscle, le dôme résiste mal à la pression et se perfore plus facilement. Le vaisseau droit, étiré contre ce dôme, peut se rompre et saigner.</p>
<div class="lab">Limite</div><p>Le terme « diverticule » employé seul en clinique désigne presque toujours ce pseudodiverticule acquis.</p></template>

<template data-pop="k57-laplace" data-title="Loi de Laplace appliquée au côlon">
<div class="lab">Énoncé</div><p>Pour un cylindre, la tension pariétale T égale la pression P multipliée par le rayon r : T = P × r. À tension constante, la pression varie donc en raison inverse du rayon.</p>
<div class="lab">Application</div><p>Le sigmoïde, segment le plus étroit du côlon, développe les pressions les plus élevées lors des contractions segmentaires. Cette pression pousse la muqueuse à travers les points faibles. Le cæcum, large, subit au contraire la tension pariétale la plus forte lorsqu’il est distendu, d’où sa perforation dans les occlusions coliques.</p>
<div class="lab">Exemple chiffré</div><p>À tension égale, un segment de 1,5 cm de rayon supporte une pression deux fois plus élevée qu’un segment de 3 cm.</p>
<div class="lab">Limite</div><p>Le côlon n’est pas un cylindre rigide ; la loi décrit une tendance physique et n’explique pas à elle seule la maladie, qui dépend aussi du tissu conjonctif et de la génétique.</p></template>

<template data-pop="k57-vasa" data-title="Vaisseaux droits (vasa recta) du côlon">
<div class="lab">Anatomie</div><p>Les vaisseaux droits sont les branches terminales des artères coliques. Ils naissent de l’arcade marginale, contournent le côlon et traversent la musculeuse circulaire pour vasculariser la sous-muqueuse et la muqueuse.</p>
<div class="lab">Rôle dans la maladie</div><p>Leur point de pénétration est une zone sans continuité musculaire. Les diverticules s’y forment, en deux rangées de part et d’autre du ténia mésentérique. Le vaisseau reste plaqué contre le dôme ou le collet du diverticule.</p>
<div class="lab">Conséquence</div><p>L’étirement chronique amincit la paroi artérielle du côté luminal. Sa rupture donne une hémorragie artérielle indolore, sans inflammation : c’est l’hémorragie diverticulaire.</p></template>

<template data-pop="k57-sudd" data-title="Maladie diverticulaire symptomatique non compliquée">
<div class="lab">Définition</div><p>Elle associe des douleurs abdominales récidivantes ou des troubles du transit à une diverticulose, sans inflammation aiguë démontrée. La classification allemande la nomme type 3a.</p>
<div class="lab">Mécanisme proposé</div><p>Une hypersensibilité viscérale, une inflammation de bas grade et une modification du microbiote ont été décrites. Le tableau ressemble au syndrome de l’intestin irritable.</p>
<div class="lab">Conduite</div><p>Le diagnostic est d’exclusion : il suppose une CRP normale, une imagerie sans diverticulite et une coloscopie qui écarte un cancer ou une colite. Les antibiotiques ne sont pas indiqués.</p>
<div class="lab">Piège</div><p>Une douleur gauche chronique avec CRP élevée et épaississement à la TDM évoque plutôt une diverticulite persistante, qui relève d’un avis chirurgical.</p></template>

<template data-pop="k57-smoulder" data-title="Diverticulite persistante (« smouldering »)">
<div class="lab">Définition</div><p>Les symptômes et des signes d’inflammation persistent des semaines après un épisode, sans guérison complète. Elle concerne 4 à 10 % des patients (Strate et Morris, Gastroenterology 2019).</p>
<div class="lab">Conduite</div><p>Le médecin exclut d’abord un cancer par coloscopie et une autre cause par imagerie. Une résection élective se discute ensuite, car le traitement médical a échoué. L’AGA 2021 recommande l’imagerie et l’endoscopie chez le patient avec symptômes chroniques.</p></template>

<template data-pop="k57-hinchey" data-title="Classification de Hinchey modifiée">
<div class="lab">Origine</div><p>Hinchey et collaborateurs ont décrit en 1978 quatre stades de diverticulite perforée selon les constatations opératoires. Wasvary et collaborateurs l’ont modifiée en 1999 (American Surgeon) pour y intégrer la diverticulite légère (stade 0) et pour séparer le phlegmon (Ia) de l’abcès péricolique (Ib).</p>
<div class="lab">Stades</div><p>0 : diverticulite clinique légère. Ia : inflammation péricolique limitée ou phlegmon. Ib : abcès péricolique ou mésocolique. II : abcès pelvien, intra-abdominal à distance ou rétropéritonéal. III : péritonite purulente généralisée. IV : péritonite stercorale généralisée.</p>
<div class="lab">Valeur</div><p>Elle sépare clairement les formes qui relèvent d’un traitement médical ou radiologique (0 à II) de celles qui relèvent de la chirurgie urgente (III et IV). Elle sert de langue commune aux essais LADIES et SCANDIV.</p>
<div class="lab">Limites</div><p>Elle ne décrit ni l’air extraluminal sans péritonite, ni la fistule, ni la sténose. Les stades III et IV se distinguent souvent seulement au bloc opératoire. Plusieurs adaptations tomodensitométriques coexistent ; c’est pourquoi la WSES a proposé sa propre classification.</p></template>

<template data-pop="k57-wses" data-title="Choix de classification : Hinchey modifiée, WSES ou CDD">
<div class="lab">Situation</div><p>Trois classifications coexistent en Europe. Aucune n’a démontré sa supériorité, et la WSES 2020 ne recommande aucun système particulier.</p>
<div class="lab">Classification WSES 2020 (texte intégral consulté)</div><p>Stade 0 : diverticules, épaississement pariétal, densification de la graisse. 1A : bulles d’air ou petite quantité de liquide péricolique, sans abcès, à moins de 5 cm du segment. 1B : abcès de 4 cm ou moins. 2A : abcès de plus de 4 cm. 2B : air à distance, à plus de 5 cm du segment. 3 : liquide diffus sans air libre à distance. 4 : liquide diffus avec air libre à distance.</p>
<div class="lab">Position suisse</div><p>Le consensus suisse 2024 n’a adopté aucune classification. Il a défini comme compliquées les formes avec abcès (accord de 88 %), fistule (84 %), air péricolique (86 %), air à distance (83 %) et extravasation du contraste rectal (95 %). La sténose (62 %) et le liquide libre pelvien (40 %) n’ont pas atteint le consensus.</p>
<div class="lab">Conséquence pour l’examen</div><p>Hinchey modifiée reste la classification la plus enseignée. Le médecin assistant doit savoir traduire un compte rendu de TDM dans l’une ou l’autre.</p>
<div class="lab">Sources</div><p>Sartelli M. et al., World Journal of Emergency Surgery 2020 ; Girardin T. et al., British Journal of Surgery Open 2024 ; consultés le 08.10.2026.</p></template>

<template data-pop="k57-cdd" data-title="Classification allemande de la maladie diverticulaire (CDD)">
<div class="lab">Origine</div><p>La recommandation allemande de niveau le plus élevé sur la maladie diverticulaire (DGVS et DGAV, registre AWMF 021-020, 2021) emploie la classification CDD, issue des classifications de Hansen et Stock et de Hinchey.</p>
<div class="lab">Types</div><p>Type 0 : diverticulose asymptomatique. Type 1a et 1b : diverticulite aiguë non compliquée, sans ou avec phlegmon. Type 2a et 2b : perforation couverte avec micro-abcès ou macro-abcès. Type 2c : perforation libre avec péritonite purulente (2c1) ou stercorale (2c2). Type 3a : maladie diverticulaire symptomatique non compliquée. Type 3b et 3c : diverticulite récidivante, sans ou avec complication (sténose, fistule, masse inflammatoire). Type 4 : hémorragie diverticulaire.</p>
<div class="lab">Limite</div><p>Le seuil de taille qui sépare le micro-abcès du macro-abcès diffère selon les versions et les synthèses consultées ; la table originale de 2021 n’a pas été relue en texte intégral lors de la rédaction. Cette classification est surtout utilisée dans les centres germanophones, dont une partie des hôpitaux suisses.</p></template>

<template data-pop="k57-cim" data-title="Codage CIM-10-GM 2024 de la catégorie K57">
<div class="lab">Règle du quatrième caractère</div><p>K57.0 : grêle, avec perforation et abcès. K57.1 : grêle, sans perforation ni abcès. K57.2 : côlon, avec perforation et abcès. K57.3 : côlon, sans perforation ni abcès. K57.4 : grêle et côlon, avec perforation et abcès. K57.5 : grêle et côlon, sans perforation ni abcès. K57.8 : siège non précisé, avec perforation et abcès. K57.9 : siège non précisé, sans perforation ni abcès.</p>
<div class="lab">Règle du cinquième caractère</div><p>0 : diverticulose sans saignement. 1 : diverticulose avec saignement. 2 : diverticulite sans saignement. 3 : diverticulite avec saignement. Les catégories avec perforation et abcès n’admettent que les cinquièmes caractères 2 et 3, puisqu’une perforation suppose une diverticulite.</p>
<div class="lab">Exemples</div><p>Diverticulite sigmoïdienne non compliquée : K57.32. Diverticulite avec abcès péricolique : K57.22. Hémorragie sur diverticulose colique : K57.31. Diverticulose colique fortuite : K57.30.</p>
<div class="lab">Exclusions</div><p>Diverticule de l’appendice (K38.2), diverticule de Meckel (Q43.0), diverticule congénital de l’intestin (Q43.8).</p>
<div class="lab">Source</div><p>BfArM, CIM-10-GM 2024, bloc K55–K64, page consultée le 08.10.2026. La correspondance avec la CIM-11 n’est pas encore établie.</p></template>

<template data-pop="k57-shahedi" data-title="Cohorte de Shahedi (2013)">
<div class="lab">Population</div><p>2222 patients porteurs d’une diverticulose découverte à la coloscopie, suivis en moyenne onze ans dans le système des vétérans de Los Angeles.</p>
<div class="lab">Résultats</div><p>95 patients (4,3 %) ont fait une diverticulite, soit 6 pour 1000 années-patients. Selon une définition stricte, confirmée par imagerie ou chirurgie, le taux était de 1 %. Chaque décennie d’âge supplémentaire au diagnostic réduisait le risque de 24 %.</p>
<div class="lab">Conséquence</div><p>Le porteur de diverticules peut être rassuré : le risque de diverticulite est faible, ce qui ne justifie ni traitement ni surveillance spécifique.</p>
<div class="lab">Limites</div><p>Population masculine de vétérans, étude rétrospective sur données administratives ; la transposition à une population suisse mixte reste approximative.</p>
<div class="lab">Source</div><p>Shahedi K. et al. Clinical Gastroenterology and Hepatology 2013 ; 11 : 1609–1613.</p></template>

<template data-pop="k57-recid" data-title="Récidive après une diverticulite">
<div class="lab">Chiffres</div><p>Après un premier épisode traité sans chirurgie, environ 8 % des patients récidivent dans l’année et 20 % dans les dix ans. Après un deuxième épisode, le risque atteint 18 % à un an et 55 % à dix ans (Strate et Morris, Gastroenterology 2019).</p>
<div class="lab">Gravité des récidives</div><p>Les complications surviennent surtout lors du premier épisode. Les récidives sont le plus souvent non compliquées ; le risque de perforation ne s’accroît pas avec le nombre d’épisodes (ACG 2026, AGA 2021).</p>
<div class="lab">Conséquence</div><p>La sigmoïdectomie après deux épisodes n’est plus une règle. La décision chirurgicale se fonde sur la qualité de vie, les symptômes persistants et le terrain.</p></template>

<template data-pop="k57-droite" data-title="Diverticulite droite">
<div class="lab">Épidémiologie</div><p>Les diverticules du côlon droit prédominent dans les populations d’Asie de l’Est. Ils peuvent être vrais ou faux et sont souvent uniques au niveau du cæcum.</p>
<div class="lab">Clinique</div><p>La douleur siège dans la fosse iliaque droite et imite une appendicite. La TDM distingue un appendice normal et un épaississement cæcal ou ascendant avec diverticule inflammatoire.</p>
<div class="lab">Traitement</div><p>Les principes sont ceux de la diverticulite gauche : traitement non opératoire sans péritonite diffuse, chirurgie dans les formes compliquées (WSES 2020). L’évolution est souvent favorable.</p></template>

<template data-pop="k57-microperf" data-title="Microperforation diverticulaire">
<div class="lab">Mécanisme</div><p>La paroi du diverticule est mince et parfois érodée par une inflammation de la muqueuse au collet. Une rupture microscopique laisse passer des bactéries et du contenu colique dans la graisse péricolique.</p>
<div class="lab">Réponse de l’hôte</div><p>L’épiploon, les macrophages et les polynucléaires circonscrivent la zone. Il en résulte une inflammation péricolique localisée : la diverticulite non compliquée.</p>
<div class="lab">Conséquence</div><p>Une perforation contenue guérit souvent sans antibiotique. Une perforation plus large ou un hôte immunodéprimé dépasse ces défenses et donne l’abcès ou la péritonite.</p>
<div class="lab">Incertitude</div><p>Le mécanisme exact de la diverticulite reste débattu. L’obstruction par stercolithe, le microbiote et l’inflammation chronique sont des hypothèses complémentaires, non exclusives.</p></template>

<template data-pop="k57-fistule" data-title="Fistules diverticulaires">
<div class="lab">Mécanisme</div><p>Un abcès péricolique au contact d’un organe voisin s’ouvre dans cet organe. Le trajet s’épithélialise et persiste parce que le segment colique malade continue de l’alimenter.</p>
<div class="lab">Formes</div><p>La fistule colovésicale est la plus fréquente, surtout chez l’homme, chez qui l’utérus ne s’interpose pas. Elle donne une pneumaturie, une fécalurie et des infections urinaires répétées à germes digestifs. La fistule colovaginale survient surtout après hystérectomie et donne des pertes fécaloïdes ou gazeuses. Les fistules colocutanées et coloentériques sont plus rares.</p>
<div class="lab">Diagnostic</div><p>La TDM montre l’air dans la vessie en l’absence de sondage et le segment épaissi au contact. La coloscopie exclut un cancer, qui peut aussi fistuliser.</p>
<div class="lab">Traitement</div><p>La guérison exige la résection élective du segment colique et la réparation de l’organe atteint, habituellement par voie laparoscopique dans un centre expérimenté.</p></template>

<template data-pop="k57-ains" data-title="Anti-inflammatoires non stéroïdiens et diverticulite">
<div class="lab">Association</div><p>Dans les cohortes, la prise d’anti-inflammatoires non stéroïdiens autres que l’aspirine au moins deux fois par semaine est associée à un risque relatif de diverticulite de 1,72 ; la prise de tous les anti-inflammatoires, de 1,62 (Strate et Morris 2019). L’association existe aussi pour la perforation et l’hémorragie.</p>
<div class="lab">Mécanisme proposé</div><p>L’inhibition des prostaglandines diminue la protection et la réparation de la muqueuse colique. Elle pourrait faciliter la translocation bactérienne au dôme du diverticule.</p>
<div class="lab">Limite</div><p>Il s’agit d’associations observationnelles. Aucun essai randomisé n’a montré que l’arrêt des anti-inflammatoires réduit la récidive.</p>
<div class="lab">Conséquence pratique</div><p>L’ACG 2026 suggère d’éviter leur usage régulier après une diverticulite, sauf indication clinique. L’AGA 2021 fait exception pour l’aspirine en prévention cardiovasculaire secondaire.</p></template>

<template data-pop="k57-noix" data-title="Noix, maïs et pop-corn : cohorte de Strate (2008)">
<div class="lab">Population</div><p>47 228 hommes de 40 à 75 ans de la cohorte américaine des professionnels de santé, suivis de 1986 à 2004.</p>
<div class="lab">Résultats</div><p>801 diverticulites et 383 hémorragies diverticulaires sont survenues. Comparée à une consommation de moins d’une fois par mois, une consommation d’au moins deux fois par semaine était associée à un rapport de risque de 0,80 pour les noix et de 0,72 pour le pop-corn. Aucune association n’a été trouvée avec l’hémorragie.</p>
<div class="lab">Conséquence</div><p>Le conseil d’éviter ces aliments n’a pas de fondement. L’ACG 2026 suggère de ne pas les éviter.</p>
<div class="lab">Limites</div><p>Cohorte masculine, données alimentaires déclaratives ; l’association inverse ne prouve pas un effet protecteur.</p>
<div class="lab">Source</div><p>Strate L. L. et al. JAMA 2008 ; 300 : 907–914.</p></template>
