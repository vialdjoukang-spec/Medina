<section class="ilot" id="k57-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 58 ans consulte au cabinet pour une douleur de la fosse iliaque gauche qui dure depuis deux jours. La douleur est continue et s’accentue à la marche. Sa température est de 38,1 °C, sa pression artérielle de 132/80 mmHg et sa fréquence cardiaque de 92 par minute. La palpation de la fosse iliaque gauche est douloureuse, sans défense généralisée. Sa protéine C-réactive (CRP) mesure 92 mg/L et ses leucocytes 12,4 G/L. Elle n’a jamais eu de coloscopie.</p>
<p>La question qui structure le chapitre est la suivante : <b>s’agit-il d’une diverticulite, est-elle compliquée, cette patiente peut-elle rentrer à domicile sans antibiotique, et que faut-il prévoir après l’épisode ?</b></p>
<p>À la fin du chapitre, le médecin assistant distingue diverticulose, maladie diverticulaire symptomatique, diverticulite et hémorragie diverticulaire. Il confirme une diverticulite par la tomodensitométrie (TDM) et la classe selon Hinchey modifiée ou selon la société mondiale de chirurgie d’urgence. Il décide du traitement ambulatoire sans antibiotique quand les critères sont réunis. Il reconnaît l’abcès, la péritonite et la fistule, et il sait quand demander une coloscopie et un avis chirurgical.</p>
<div class="key"><b>Message fondateur.</b> La diverticulite non compliquée de l’adulte immunocompétent guérit le plus souvent sans antibiotique. Deux essais randomisés, <button class="w" data-k="k57-avod">AVOD (Suède et Islande, 2012)</button> et <button class="w" data-k="k57-diabolo">DIABOLO (essai néerlandais, 2017)</button>, n’ont montré ni guérison plus rapide ni complication évitée par l’antibiotique. Le danger réel se situe ailleurs : méconnaître un abcès, une perforation ou un cancer qui imite une diverticulite.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="k57-pseudo">structure d’un pseudodiverticule (muqueuse herniée sans musculeuse)</button>, la <button class="w" data-k="k57-laplace">loi de Laplace (pression et rayon du côlon)</button> et le <button class="w" data-k="k57-vasa">trajet des vaisseaux droits (vasa recta) dans la paroi colique</button>. L’onglet Sciences fondamentales les développe.</div>
</section>

<section class="ilot" id="k57-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La maladie diverticulaire regroupe plusieurs situations qui ne relèvent ni du même pronostic ni du même traitement. Confondre ces entités conduit à des antibiotiques inutiles, à des coloscopies mal placées ou à une chirurgie inadaptée.</p>
<h3>1.1 Diverticule vrai et pseudodiverticule</h3>
<p>Un diverticule est une évagination de la paroi digestive. Le diverticule <b>vrai</b> contient toutes les couches de la paroi ; le diverticule de Meckel en est l’exemple. Le diverticule colique acquis est un <button class="w" data-k="k57-pseudo">pseudodiverticule (hernie de la muqueuse et de la sous-muqueuse à travers la musculeuse)</button>. Sa paroi est donc mince et dépourvue de muscle. Cette minceur explique sa fragilité : il se perfore plus facilement qu’un segment normal et il expose son vaisseau nourricier.</p>
<h3>1.2 Les entités cliniques</h3>
<p>Les définitions suivantes sont celles de la Société européenne de coloproctologie (ESCP 2020) et de l’American College of Gastroenterology (ACG 2026). Elles séparent l’anatomie (avoir des diverticules) de la maladie (en souffrir).</p>
<table class="t"><tr><th>Entité</th><th>Ce qui la définit</th><th>Conséquence pratique</th></tr>
<tr><td>Diverticulose</td><td>Présence de diverticules sans symptôme ni inflammation.</td><td>Découverte fortuite ; aucun traitement ni surveillance spécifique.</td></tr>
<tr><td><button class="w" data-k="k57-sudd">Maladie diverticulaire symptomatique non compliquée</button></td><td>Douleurs ou troubles du transit chez un patient porteur de diverticules, sans inflammation démontrée.</td><td>Diagnostic d’exclusion, proche de l’intestin irritable ; pas d’antibiotique.</td></tr>
<tr><td>Diverticulite aiguë non compliquée</td><td>Inflammation d’un segment diverticulaire, limitée à la paroi et à la graisse péricolique.</td><td>Traitement le plus souvent ambulatoire, sans antibiotique si le patient est immunocompétent.</td></tr>
<tr><td>Diverticulite aiguë compliquée</td><td>Abcès, air extraluminal, péritonite, fistule, sténose ou occlusion.</td><td>Hospitalisation, antibiotique, drainage ou chirurgie selon le stade.</td></tr>
<tr><td><button class="w" data-k="k57-smoulder">Diverticulite persistante (« smouldering »)</button></td><td>Symptômes et inflammation qui persistent des semaines après l’épisode.</td><td>Exclusion d’un cancer, discussion d’une résection.</td></tr>
<tr><td>Hémorragie diverticulaire</td><td>Saignement artériel d’un vaisseau droit au dôme d’un diverticule, sans inflammation.</td><td>Prise en charge de l’hémorragie digestive basse (cours K92).</td></tr></table>
<p>La lecture commence par la colonne centrale. Un patient de 70 ans dont la coloscopie de dépistage montre des diverticules sigmoïdiens a une diverticulose : il ne reçoit ni régime ni médicament. S’il souffre ensuite d’une douleur fébrile de la fosse iliaque gauche avec épaississement pariétal à la TDM, il a une diverticulite.</p>
<h3>1.3 Classification de Hinchey modifiée</h3>
<p>Hinchey a classé en 1978 les diverticulites perforées selon les constatations opératoires. Wasvary et collaborateurs l’ont modifiée en 1999 pour l’adapter à la TDM. Elle reste la langue commune des chirurgiens et des essais cliniques ; c’est pourquoi l’examen fédéral l’emploie.</p>
<table class="t"><tr><th>Stade</th><th>Lésion</th><th>Traitement habituel</th></tr>
<tr><td>0</td><td>Diverticulite clinique légère, épaississement pariétal.</td><td>Ambulatoire, sans antibiotique si immunocompétent.</td></tr>
<tr><td>Ia</td><td>Inflammation péricolique limitée ou phlegmon, sans abcès.</td><td>Comme le stade 0 ; air péricolique isolé : antibiotique et surveillance.</td></tr>
<tr><td>Ib</td><td>Abcès péricolique ou mésocolique.</td><td>Antibiotique ; drainage si l’abcès est volumineux.</td></tr>
<tr><td>II</td><td>Abcès pelvien, intra-abdominal à distance ou rétropéritonéal.</td><td>Drainage percutané et antibiotique ; chirurgie en cas d’échec.</td></tr>
<tr><td>III</td><td>Péritonite purulente généralisée.</td><td>Chirurgie urgente.</td></tr>
<tr><td>IV</td><td>Péritonite stercorale généralisée.</td><td>Chirurgie urgente, réanimation.</td></tr></table>
<p>Le stade se lit d’abord par la présence ou non d’une péritonite généralisée. Les stades III et IV imposent un chirurgien dans l’heure ; les stades 0 à II se traitent d’abord sans laparotomie. La fenêtre détaille la <button class="w" data-k="k57-hinchey">classification de Hinchey modifiée et ses limites</button>.</p>
<h3>1.4 Classifications tomodensitométriques concurrentes</h3>
<p>La société mondiale de chirurgie d’urgence (WSES 2020) propose une classification purement tomodensitométrique en sept stades. Elle distingue l’air péricolique (stade 1A), l’abcès de 4 cm ou moins (1B), l’abcès de plus de 4 cm (2A), l’air à distance (2B), puis la péritonite sans air libre (3) et avec air libre (4). La recommandation allemande de 2021 emploie sa propre classification de la maladie diverticulaire (<button class="w" data-k="k57-cdd">CDD, types 0 à 4</button>). Aucune classification n’a démontré sa supériorité ; le <button class="w" data-k="k57-wses">choix de classification</button> dépend du centre.</p>
<h3>1.5 Codage CIM-10-GM 2024</h3>
<p>La catégorie K57 code la maladie diverticulaire du grêle et du côlon. Le quatrième caractère indique le siège et la présence d’une perforation ou d’un abcès. Le cinquième caractère indique s’il s’agit d’une diverticulose ou d’une diverticulite et s’il existe un saignement. Le détail des seize sous-codes figure dans la <button class="w" data-k="k57-cim">fenêtre de codage CIM-10-GM K57</button>. Le diverticule appendiculaire (K38.2), le diverticule de Meckel (Q43.0) et les diverticules congénitaux (Q43.8) sont exclus de K57.</p>
<div class="key"><b>À retenir.</b> Le diverticule colique est une hernie de muqueuse sans muscle. Avoir des diverticules n’est pas une maladie ; la diverticulite est une inflammation, et sa gravité se lit par Hinchey modifiée. La présence d’une péritonite généralisée sépare le traitement médical de la chirurgie urgente. La partie suivante quantifie la fréquence de ces situations.</div>
</section>

<section class="ilot" id="k57-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>La diverticulose est fréquente, mais la diverticulite reste rare chez un porteur donné. Cette disproportion justifie de ne rien traiter chez le porteur asymptomatique et de rassurer le patient.</p>
<h3>2.1 Prévalence et incidence</h3>
<p>Plus de la moitié des personnes de plus de 60 ans ont une diverticulose dans les séries nord-américaines (Strate et Morris, Gastroenterology 2019). Le risque de faire une diverticulite au cours de la vie est estimé à 3 à 5 % (ACG 2026). Dans une cohorte de 2222 porteurs suivis onze ans, 4,3 % ont fait une diverticulite, et seulement 1 % selon une définition stricte confirmée par imagerie ou chirurgie (<button class="w" data-k="k57-shahedi">cohorte de Shahedi, 2013</button>). Chaque décennie d’âge supplémentaire au diagnostic réduisait ce risque de 24 % : le jeune porteur a plus d’années pour faire une diverticulite.</p>
<p>L’incidence augmente chez l’adulte jeune. Entre 1980 et 2007, elle a augmenté de 132 % chez les 40 à 49 ans dans une population du Minnesota (Strate et Morris 2019). En Europe et en Amérique du Nord, la maladie touche surtout le sigmoïde. En Asie de l’Est, les diverticules du côlon droit prédominent, ce qui fait confondre la <button class="w" data-k="k57-droite">diverticulite droite</button> avec une appendicite.</p>
<p>Aucune donnée populationnelle suisse publiée sur l’incidence de la diverticulite n’a été retrouvée lors de la rédaction. Les chiffres ci-dessus proviennent de cohortes nord-américaines et européennes ; leur transposition à la Suisse reste une approximation.</p>
<h3>2.2 Histoire naturelle après un premier épisode</h3>
<p>Environ 12 % des diverticulites sont compliquées. La complication survient surtout lors du <b>premier</b> épisode, et non après plusieurs récidives (ACG 2026, AGA 2021). Cette observation a renversé l’ancienne règle de la sigmoïdectomie après deux épisodes. La fenêtre détaille les <button class="w" data-k="k57-recid">taux de récidive après un premier puis un deuxième épisode</button>.</p>
<p>Exemple : un patient de 52 ans traité pour une diverticulite non compliquée a un risque d’environ 8 % de récidive dans l’année et de 20 % sur dix ans. Après un deuxième épisode, son risque de nouvelle récidive atteint 18 % à un an et 55 % à dix ans (Strate et Morris 2019). Ces récidives sont le plus souvent non compliquées.</p>
<div class="key"><b>À retenir.</b> Plus d’une personne sur deux après 60 ans porte des diverticules, mais 3 à 5 % seulement feront une diverticulite. La complication survient surtout au premier épisode. Les récidives sont fréquentes et le plus souvent bénignes. Les données suisses font défaut. La partie suivante explique pourquoi le sigmoïde est le siège électif.</div>
</section>

<section class="ilot" id="k57-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La maladie se lit comme une chaîne : un point faible de la paroi, une pression endoluminale élevée, puis une inflammation ou un saignement. Chaque maillon explique un signe clinique et une décision thérapeutique.</p>
<h3>3.1 État normal</h3>
<p>La paroi colique comprend la muqueuse, la sous-muqueuse, une musculeuse circulaire interne et une musculeuse longitudinale externe. Celle-ci se concentre en trois bandelettes, les ténias. Les <button class="w" data-k="k57-vasa">vaisseaux droits (vasa recta)</button> traversent la musculeuse circulaire entre le ténia mésentérique et les ténias antimésentériques. Leur point de passage est une zone de moindre résistance.</p>
<h3>3.2 Première charnière : la hernie muqueuse</h3>
<p>Le sigmoïde a le plus petit diamètre du côlon. Selon la <button class="w" data-k="k57-laplace">loi de Laplace</button>, la tension pariétale égale le produit de la pression par le rayon. Pour retenir le même contenu, un segment étroit doit générer une pression plus élevée. Les contractions segmentaires du sigmoïde isolent des chambres où la pression monte. La muqueuse est alors poussée à travers les orifices des vaisseaux droits. Le vieillissement du collagène et de l’élastine de la paroi facilite ce passage.</p>

<p>La figure se lit de gauche à droite. À gauche, les quatre couches sont continues. À droite, la musculeuse s’interrompt au point de passage du vaisseau ; la muqueuse forme un sac. Ce sac explique les deux complications : il retient des débris et s’enflamme, ou il étire son vaisseau qui saigne.</p>
<h3>3.3 Deuxième charnière : de la diverticulose à la diverticulite</h3>
<p>Le modèle ancien attribuait la diverticulite à l’obstruction du collet par un stercolithe, sur le modèle de l’appendicite. Ce modèle n’explique pas la plupart des cas. Les données actuelles décrivent une inflammation chronique de bas grade, une modification du microbiote et une <button class="w" data-k="k57-microperf">microperforation du dôme</button>. La bactérie franchit la paroi mince et provoque une inflammation péricolique. L’hôte la contient le plus souvent : c’est la diverticulite non compliquée.</p>
<p>Ce mécanisme explique l’efficacité limitée de l’antibiotique dans la forme non compliquée. L’inflammation y est déjà circonscrite par l’hôte ; l’antibiotique n’y ajoute pas de bénéfice démontré (AVOD, DIABOLO). Il garde sa place lorsque la défense de l’hôte est débordée, comme dans l’abcès, la péritonite ou l’immunodépression.</p>
<h3>3.4 Troisième charnière : les complications</h3>
<p>Une perforation plus large libère du pus dans la graisse : il se forme un phlegmon puis un abcès péricolique. Si l’abcès se rompt, une péritonite purulente apparaît (Hinchey III). Si la perforation reste ouverte vers la lumière, des selles se répandent dans le péritoine (Hinchey IV). Un abcès au contact d’un organe voisin peut s’y ouvrir et créer une <button class="w" data-k="k57-fistule">fistule colovésicale ou colovaginale</button>. Des épisodes répétés laissent une fibrose qui sténose la lumière.</p>
<h3>3.5 Le saignement, un mécanisme distinct</h3>
<p>L’hémorragie diverticulaire ne résulte pas d’une inflammation. Le vaisseau droit s’étire sur le dôme du diverticule et s’amincit du côté luminal. Une rupture artérielle entraîne une hématochézie indolore et abondante. C’est pourquoi un patient qui saigne d’un diverticule n’a habituellement ni fièvre ni douleur. Le détail figure dans l’îlot 13 et dans le cours K92.</p>
<div class="key"><b>À retenir.</b> La pression élevée d’un sigmoïde étroit pousse la muqueuse à travers les orifices des vaisseaux droits. Une microperforation contenue donne la diverticulite non compliquée ; une perforation non contenue donne l’abcès ou la péritonite. Le saignement résulte de l’étirement d’une artère, sans inflammation. La partie suivante identifie les facteurs qui favorisent ces mécanismes.</div>
</section>

<section class="ilot" id="k57-4"><h2><span class="n">4</span>Facteurs de risque</h2>
<p>La plupart des facteurs connus proviennent de grandes cohortes observationnelles. Ils indiquent des associations ; la causalité n’est démontrée pour aucun d’eux par un essai randomisé. Cette distinction compte lorsque le médecin conseille le patient.</p>
<table class="t"><tr><th>Facteur</th><th>Association avec la diverticulite</th><th>Mécanisme proposé</th></tr>
<tr><td>Hérédité</td><td>40 à 50 % du risque attribués aux facteurs génétiques (études de jumeaux).</td><td>Variants du tissu conjonctif et de la motricité ; voir l’onglet Sciences.</td></tr>
<tr><td>Obésité</td><td>Risque relatif 1,33 à 4,4 pour un indice de masse corporelle (IMC) ≥ 30 kg/m².</td><td>Inflammation viscérale et microbiote modifié.</td></tr>
<tr><td>Viande rouge</td><td>Risque relatif 1,58 pour le quintile le plus élevé.</td><td>Microbiote pro-inflammatoire, hypothèse.</td></tr>
<tr><td>Fibres alimentaires</td><td>Risque relatif 0,57 à 0,75 pour le quintile le plus élevé.</td><td>Selles plus volumineuses, pression segmentaire moindre, acides gras à chaîne courte.</td></tr>
<tr><td>Tabac</td><td>Risque relatif 1,23 à 1,89 ; association plus forte avec les formes compliquées.</td><td>Altération de la microcirculation et de la cicatrisation.</td></tr>
<tr><td><button class="w" data-k="k57-ains">Anti-inflammatoires non stéroïdiens</button></td><td>Risque relatif 1,72 pour une prise d’au moins deux fois par semaine (hors aspirine).</td><td>Lésion de la barrière muqueuse, moindre réparation.</td></tr>
<tr><td>Opioïdes</td><td>Risque relatif 2,16.</td><td>Hypertonie segmentaire et constipation.</td></tr>
<tr><td>Corticostéroïdes</td><td>Risque relatif 2,74 ; association avec la perforation.</td><td>Réponse inflammatoire et cicatrisation diminuées, signes masqués.</td></tr></table>
<p>Les risques relatifs proviennent de la synthèse de Strate et Morris (Gastroenterology 2019, tableau 1). Le facteur le plus utile en pratique est le médicament, car il se modifie. Une patiente de 64 ans sous prednisone 20 mg par jour pour une polymyalgie a un risque accru de diverticulite perforée, et ses signes péritonéaux peuvent être atténués : le médecin abaisse son seuil de TDM.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Interdire les noix, les graines, le maïs ou le pop-corn. Dans une cohorte de 47 228 hommes suivis dix-huit ans, leur consommation n’augmentait pas le risque de diverticulite ni de saignement ; le pop-corn était même associé à un risque moindre (<button class="w" data-k="k57-noix">cohorte de Strate, JAMA 2008</button>). L’ACG 2026 suggère de ne pas les éviter.</div>
<p>Certaines maladies du tissu conjonctif, comme le syndrome d’Ehlers-Danlos, et la polykystose rénale autosomique dominante sont associées à une diverticulose précoce. Elles expliquent une partie des diverticulites de l’adulte jeune.</p>
<div class="key"><b>À retenir.</b> Hérédité, obésité, tabac, sédentarité et alimentation pauvre en fibres sont associés à la diverticulite. Les anti-inflammatoires non stéroïdiens, les opioïdes et les corticostéroïdes sont des facteurs modifiables qui doivent être recherchés à chaque épisode. Les noix et les graines ne sont pas à interdire. La partie suivante transforme ces notions en questions d’anamnèse.</div>
</section>

<section class="ilot" id="k57-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit trois buts : reconnaître une diverticulite probable, détecter les signes d’une complication et repérer le terrain qui change le traitement.</p>
<h3>5.1 Antécédents</h3>
<p>Le médecin demande si le patient a déjà eu une diverticulite confirmée par imagerie et à quelle date remonte sa dernière <button class="w" data-k="k57-colo">coloscopie</button>. Il recherche une <button class="w" data-k="k57-immuno">immunodépression</button> : corticothérapie, chimiothérapie, transplantation, infection par le virus de l’immunodéficience humaine (VIH) non contrôlée. Il note les anticoagulants, les antiagrégants, les anti-inflammatoires non stéroïdiens et les opioïdes. Il demande aussi les antécédents familiaux de cancer colorectal.</p>
<h3>5.2 Symptômes</h3>
<p>La <button class="w" data-k="k57-douleur">douleur de la fosse iliaque gauche</button> est le symptôme dominant. Elle est continue, progressive depuis un à trois jours, et s’aggrave aux mouvements. La fièvre, les nausées, la constipation ou une diarrhée l’accompagnent souvent. Une pollakiurie ou une dysurie traduit le contact du sigmoïde inflammatoire avec la vessie.</p>
<p>Certains symptômes signalent une complication. Une douleur qui diffuse à tout l’abdomen évoque une péritonite. Des frissons et une fièvre élevée persistante évoquent un abcès. Une <b>pneumaturie</b> (air dans les urines) ou une <b>fécalurie</b> signent une fistule colovésicale. Un arrêt des matières et des gaz évoque une sténose ou une occlusion.</p>
<p>D’autres symptômes doivent faire douter du diagnostic. Une perte de poids, une anémie, un changement durable du transit ou du sang dans les selles depuis des semaines évoquent un cancer colorectal. Le médecin les note, car ils imposent une coloscopie après l’épisode.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Un patient de 55 à 75 ans présente une douleur de la fosse iliaque gauche depuis 48 heures, une fièvre modérée et une défense localisée. La CRP est élevée. La TDM montre un épaississement du sigmoïde et une infiltration de la graisse.</p></div>
<div class="card"><h4>Sujet âgé ou immunodéprimé</h4><p>La fièvre et la défense manquent souvent, alors que la complication est plus fréquente. Une confusion ou une simple anorexie peut être le premier signe. Le seuil de TDM est donc bas.</p></div>
<div class="card"><h4>Diverticulite droite</h4><p>Elle siège sur le cæcum ou le côlon ascendant. Elle imite une appendicite, surtout chez le patient originaire d’Asie de l’Est. La TDM fait la différence.</p></div>
<div class="card"><h4>Sigmoïde long et redondant</h4><p>Un sigmoïde qui croise la ligne médiane peut donner une douleur sus-pubienne ou de la fosse iliaque droite. La localisation de la douleur ne suffit donc pas à exclure le diagnostic.</p></div></div>
<div class="key"><b>À retenir.</b> Une douleur continue de la fosse iliaque gauche depuis un à trois jours, avec fièvre, oriente vers une diverticulite. La pneumaturie, la douleur diffuse et l’arrêt du transit signalent une complication. La perte de poids et l’anémie font craindre un cancer. L’immunodépression rend les signes trompeurs. La partie suivante décrit l’examen physique.</div>
</section>

<section class="ilot" id="k57-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen répond d’abord à une question de gravité : le patient a-t-il un sepsis ou une péritonite généralisée ? Il cherche ensuite les arguments locaux.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin mesure la température, la fréquence cardiaque, la pression artérielle, la fréquence respiratoire et la saturation. Un adulte normal a une fréquence respiratoire de 12 à 20 par minute et une pression systolique supérieure à 100 mmHg. Une fréquence respiratoire de 22 par minute ou plus, une pression systolique de 100 mmHg ou moins et une confusion forment le <button class="w" data-k="k57-sepsis">score qSOFA (repérage du sepsis)</button>.</p></div>
<div class="card"><h4>Inspection et palpation</h4><p>Normalement, l’abdomen est souple et indolore. Dans la diverticulite, la <button class="w" data-k="k57-palp">palpation de la fosse iliaque gauche</button> déclenche une douleur et souvent une défense localisée. Une masse sensible évoque un phlegmon ou un abcès.</p></div>
<div class="card"><h4>Signes péritonéaux</h4><p>Une défense ou une contracture généralisée, une douleur à la décompression dans tout l’abdomen et un abdomen silencieux signent une péritonite. Ces signes imposent un avis chirurgical immédiat.</p></div>
<div class="card"><h4>Examens complémentaires au lit</h4><p>Le toucher rectal recherche une douleur du cul-de-sac de Douglas ou un abcès pelvien. Chez la femme, l’examen gynécologique et le test de grossesse écartent une cause annexielle. La bandelette urinaire peut montrer une leucocyturie de contact, qui ne prouve pas une infection urinaire.</p></div></div>
<div class="trap"><span class="k">Piège</span>Une leucocyturie chez une patiente qui a mal à la fosse iliaque gauche fait conclure à une pyélonéphrite. Le sigmoïde enflammé au contact de la vessie suffit à produire cette leucocyturie. Une pneumaturie associée oriente vers une fistule colovésicale.</div>
<p>Revenons à la patiente de l’îlot 0. Elle a une fièvre de 38,1 °C, une fréquence cardiaque de 92 par minute et une douleur localisée sans défense généralisée. Son score qSOFA est à 0. Rien n’indique une péritonite. La suite de la démarche cherche à confirmer le diagnostic et à exclure une complication par l’imagerie.</p>
<div class="key"><b>À retenir.</b> L’examen cherche d’abord le sepsis et la péritonite généralisée, qui imposent une prise en charge chirurgicale urgente. La douleur localisée de la fosse iliaque gauche oriente, mais ne prouve rien. Une leucocyturie de contact ne doit pas égarer. La partie suivante construit le diagnostic.</div>
