<template data-pop="k57-d-amc" data-title="Amoxicilline-acide clavulanique">
<div class="lab">Mécanisme</div><p>L’amoxicilline inhibe la synthèse de la paroi bactérienne en se liant aux protéines de liaison des pénicillines. L’acide clavulanique inhibe les bêtalactamases qui la détruiraient. L’association couvre les entérobactéries sensibles, les entérocoques sensibles à l’amoxicilline et les anaérobies dont <i>Bacteroides fragilis</i>.</p>
<div class="lab">Place</div><p>Antibiotique de référence de la diverticulite lorsqu’un antibiotique est indiqué : voie orale pour la forme non compliquée à risque, voie intraveineuse pour la forme hospitalisée. Bras contrôle des essais DIABOLO et DINAMO.</p>
<div class="lab">Posologie suisse</div><p>Comprimé de 1 g (875/125 mg, Augmentin) : 625 mg trois fois par jour, ou 1 g deux fois par jour, jusqu’à 1 g trois fois par jour, au début du repas. Voie intraveineuse (Co-Amoxicillin Labatec) : infection grave, 2,2 g trois à quatre fois par jour en perfusion d’au moins 30 minutes, jusqu’à six fois par jour.</p>
<div class="lab">Insuffisance rénale</div><p>Comprimés : pas de comprimé de 1 g sous 30 mL/min ; 625 mg toutes les 12 heures entre 10 et 30 mL/min, toutes les 24 heures sous 10 mL/min. Voie intraveineuse : 1,2 g puis 600 mg toutes les 12 heures entre 10 et 30 mL/min, toutes les 24 heures sous 10 mL/min.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux pénicillines ou aux céphalosporines ; antécédent d’ictère ou de trouble hépatique sous amoxicilline-acide clavulanique.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Diarrhée, infection à <i>Clostridioides difficile</i>, réactions cutanées sévères, syndrome de Kounis, hépatite cholestatique. Surveillance de l’INR sous acénocoumarol ou warfarine.</p>
<div class="lab">Grossesse et allaitement</div><p>Pendant la grossesse, seulement en cas de nécessité absolue ; passage de traces dans le lait.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Augmentin comprimés filmés (mise à jour mars 2026) et Co-Amoxicillin Labatec (octobre 2024), consultées le 08.10.2026.</p></template>

<template data-pop="k57-d-metro" data-title="Métronidazole">
<div class="lab">Mécanisme</div><p>Dérivé nitro-imidazolé réduit dans la bactérie anaérobie en métabolites qui lèsent l’ADN. Il est actif sur les anaérobies stricts et inactif sur les aérobies.</p>
<div class="lab">Place</div><p>Toujours en association dans la diverticulite : avec la ceftriaxone ou avec la ciprofloxacine, pour couvrir les anaérobies.</p>
<div class="lab">Posologie suisse</div><p>Infection à anaérobies : 500 mg trois fois par jour par voie orale (Flagyl). La durée des traitements par nitro-imidazolés ne doit en règle pas dépasser dix jours ; au-delà, la formule sanguine et l’apparition d’une neuropathie se surveillent. La posologie intraveineuse n’a pas été relue dans une monographie lors de la rédaction.</p>
<div class="lab">Fonctions rénale et hépatique</div><p>Pas d’adaptation en insuffisance rénale ; dose supplémentaire possible après hémodialyse. Réduction de dose et surveillance en insuffisance hépatique grave.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux imidazolés, syndrome de Cockayne, premier trimestre de grossesse, allaitement jusqu’à 24 heures après la dernière prise.</p>
<div class="lab">Interactions</div><p>Effet antabuse avec l’alcool pendant le traitement et le jour suivant. Potentialisation des anticoagulants coumariniques. Augmentation du lithium et de la ciclosporine ; toxicité du 5-fluorouracile et du busulfan ; allongement de l’intervalle QT avec d’autres médicaments.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Flagyl (mise à jour septembre 2025), consultée le 08.10.2026.</p></template>

<template data-pop="k57-d-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération qui inhibe la synthèse de la paroi. Elle couvre les entérobactéries non productrices de bêtalactamases à spectre étendu, mais ni les anaérobies ni les entérocoques.</p>
<div class="lab">Place</div><p>Voie intraveineuse hospitalière, toujours associée au métronidazole dans la diverticulite.</p>
<div class="lab">Posologie suisse</div><p>Plus de 12 ans ou plus de 50 kg : 1 à 2 g une fois par jour, jusqu’à 4 g ; perfusion d’au moins 30 minutes ou injection lente.</p>
<div class="lab">Insuffisance rénale</div><p>Sous 10 mL/min, la dose ne dépasse pas 2 g par jour ; pas de dose supplémentaire après dialyse. Pas d’adaptation en insuffisance hépatique isolée.</p>
<div class="lab">Contre-indications</div><p>Hypersensibilité aux céphalosporines ; nouveau-né avec hyperbilirubinémie ou recevant du calcium intraveineux.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Rocephin (mise à jour juin 2025), consultée le 08.10.2026.</p></template>

<template data-pop="k57-d-pitazo" data-title="Pipéracilline-tazobactam">
<div class="lab">Mécanisme</div><p>Uréidopénicilline associée à un inhibiteur de bêtalactamase. Spectre large : entérobactéries, <i>Pseudomonas aeruginosa</i>, entérocoques sensibles et anaérobies.</p>
<div class="lab">Place</div><p>Diverticulite avec péritonite, sepsis, immunodépression sévère ou risque de germes résistants. Son indication suisse inclut les infections intra-abdominales.</p>
<div class="lab">Posologie suisse</div><p>À partir de 12 ans : 2,25 à 4,5 g trois à quatre fois par jour en perfusion de 30 minutes ; habituellement 4,5 g toutes les 8 heures dans l’infection grave.</p>
<div class="lab">Insuffisance rénale</div><p>Filtration de 20 à 40 mL/min : 4,5 g toutes les 8 heures ; de 2 à 19 mL/min : 4,5 g toutes les 12 heures. Prudence en raison d’une néphrotoxicité possible.</p>
<div class="lab">Grossesse et allaitement</div><p>Grossesse : se référer à l’information professionnelle ; l’allaitement figure parmi les contre-indications du résumé compendium.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Pipéracilline/Tazobactam Sandoz (mise à jour mars 2026), consultée le 08.10.2026.</p></template>

<template data-pop="k57-d-cipro" data-title="Ciprofloxacine">
<div class="lab">Mécanisme</div><p>Fluoroquinolone qui inhibe l’ADN gyrase et la topo-isomérase IV. Active sur les entérobactéries, inactive sur les anaérobies : elle s’associe au métronidazole.</p>
<div class="lab">Place</div><p>Alternative orale en cas d’allergie vraie aux bêtalactamines.</p>
<div class="lab">Posologie suisse</div><p>Infection intra-abdominale à germes à Gram négatif : 500 à 750 mg deux fois par jour, cinq à quatorze jours selon l’information professionnelle. Insuffisance rénale : 1000 mg par jour au plus entre 30 et 60 mL/min, 500 mg par jour sous 30 mL/min.</p>
<div class="lab">Mises en garde</div><p>Tendinites et ruptures tendineuses, neuropathies, effets sur le système nerveux central, anévrisme et dissection aortiques, allongement de l’intervalle QT. Ces effets peuvent persister ; ils imposent l’arrêt immédiat.</p>
<div class="lab">Contre-indications</div><p>Association à la tizanidine ou à l’agomélatine ; grossesse et allaitement.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Ciproxine (mise à jour août 2025), consultée le 08.10.2026.</p></template>

<template data-pop="k57-d-para" data-title="Paracétamol">
<div class="lab">Mécanisme</div><p>Antalgique et antipyrétique d’action centrale, sans effet anti-inflammatoire périphérique notable et sans toxicité muqueuse digestive.</p>
<div class="lab">Place</div><p>Antalgique de première intention de la diverticulite, car il n’expose pas au risque digestif des anti-inflammatoires non stéroïdiens.</p>
<div class="lab">Posologie suisse</div><p>Adulte de plus de 50 kg : 1 g par prise, intervalle de 4 à 8 heures, 4 g par jour au maximum. Clairance de 10 à 50 mL/min : intervalle de 6 heures et 3 g par jour au plus ; sous 10 mL/min : intervalle de 8 heures et 2 g par jour au plus.</p>
<div class="lab">Contre-indications</div><p>Insuffisance hépatique grave, hépatite aiguë, maladie hépatique décompensée, maladie de Gilbert.</p>
<div class="lab">Piège</div><p>Le surdosage involontaire survient par cumul de plusieurs spécialités contenant du paracétamol.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Dafalgan (mise à jour juillet 2026), consultée le 08.10.2026.</p></template>

<template data-pop="k57-d-metam" data-title="Métamizole">
<div class="lab">Mécanisme</div><p>Dérivé pyrazolé antalgique et antipyrétique, faible inhibiteur de la synthèse des prostaglandines.</p>
<div class="lab">Place</div><p>Douleur forte lorsque les autres antalgiques non opioïdes sont inefficaces ou contre-indiqués.</p>
<div class="lab">Posologie suisse</div><p>Adulte : 500 à 1000 mg par prise, 1000 à 3000 mg par jour en trois à quatre prises, 4000 mg au maximum. Éviter les doses élevées en insuffisance rénale ou hépatique.</p>
<div class="lab">Risque majeur</div><p>Agranulocytose idiosyncrasique, non liée à la dose, possible à tout moment du traitement et même peu après l’arrêt, parfois mortelle. Le patient arrête le traitement et consulte en cas de fièvre, de frissons, de maux de gorge ou de lésions des muqueuses.</p>
<div class="lab">Contre-indications et interactions</div><p>Antécédent d’agranulocytose aux pyrazolés, troubles de l’hématopoïèse, porphyrie hépatique, déficit en glucose-6-phosphate déshydrogénase ; premier et troisième trimestres de grossesse ; allaitement jusqu’à 48 heures après la prise. Association au méthotrexate à éviter ; diminution de l’effet antiagrégant de l’aspirine à faible dose.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Novalgin (mise à jour mars 2025), consultée le 08.10.2026.</p></template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-k57-bases" data-title="Pareto — Définitions, mécanismes et clinique"><p class="ratio" data-cover="k57-1,k57-2,k57-3,k57-4,k57-5,k57-6"></p><ul>
<li>Le diverticule colique est un pseudodiverticule : muqueuse herniée sans muscle, au passage des vaisseaux droits.</li>
<li>Diverticulose : anatomie sans maladie. Diverticulite : inflammation. Hémorragie : rupture artérielle sans inflammation.</li>
<li>Hinchey modifiée : 0 et Ia non compliquées ; Ib et II abcès ; III péritonite purulente ; IV stercorale.</li>
<li>Plus de 50 % des plus de 60 ans portent des diverticules ; 3 à 5 % feront une diverticulite.</li>
<li>La complication survient surtout au premier épisode ; la récidive atteint 20 % à dix ans.</li>
<li>Facteurs modifiables : obésité, tabac, anti-inflammatoires non stéroïdiens, opioïdes, corticoïdes ; les noix sont permises.</li>
<li>Douleur continue de la fosse iliaque gauche avec fièvre ; pneumaturie, défense diffuse et arrêt du transit signalent une complication.</li>
<li>L’immunodéprimé et le sujet âgé ont peu de signes et davantage de perforations.</li>
<li>Le sigmoïde, segment le plus étroit, subit les pressions les plus fortes (loi de Laplace) ; la microperforation contenue donne la forme non compliquée.</li>
<li>Leucocyturie de contact et pneumaturie : penser au sigmoïde au contact de la vessie, puis à la fistule colovésicale.</li>
<li>Codage : K57.3 pour le côlon sans perforation, K57.2 avec perforation ou abcès ; cinquième caractère 2 pour la diverticulite sans saignement.</li></ul></template>

<template data-pop="pareto-k57-trt" data-title="Pareto — Diagnostic et traitement"><p class="ratio" data-cover="k57-7,k57-8,k57-9,k57-10,k57-11"></p><ul>
<li>Le diagnostic se confirme par la TDM injectée ; l’échographie experte est une alternative.</li>
<li>Test de grossesse avant irradiation ; cancer et colite ischémique sont les différentiels à ne pas manquer.</li>
<li>Péritonite généralisée et choc septique : réanimation, antibiotique dans l’heure et chirurgie.</li>
<li>Non compliquée chez l’immunocompétent : domicile, paracétamol, sans antibiotique, réévaluation dans les sept jours.</li>
<li>Antibiotique si immunodépression, fragilité, inflammation systémique, air péricolique ou suivi impossible.</li>
<li>Abcès : antibiotique ; drainage au-delà de 3 cm (ESCP) ou 4 à 5 cm (WSES).</li>
<li>Péritonite chez le patient stable : anastomose primaire (LADIES) ; patient critique : Hartmann.</li>
<li>Quatre jours d’antibiotique après contrôle de la source.</li>
<li>Chirurgie élective selon la qualité de vie, l’immunodépression, la fistule et la sténose, jamais selon le seul nombre d’épisodes.</li></ul></template>

<template data-pop="pareto-k57-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="k57-12,k57-13,k57-14,k57-15"></p><ul>
<li>Coloscopie à six semaines ou plus après une forme compliquée, des signes d’alarme ou un dépistage non à jour.</li>
<li>Cancer après forme non compliquée prouvée par TDM : environ 0,5 %.</li>
<li>Aucune prévention médicamenteuse : ni mésalazine, ni rifaximine, ni probiotiques.</li>
<li>Hémorragie diverticulaire indolore, souvent spontanément résolutive ; prise en charge selon K92.</li>
<li>Grossesse : échographie puis IRM ; métronidazole contre-indiqué au premier trimestre.</li>
<li>Immunodéprimé : antibiotique systématique, TDM précoce, sigmoïdectomie élective discutée plus tôt.</li>
<li>Âge jeune : pas de chirurgie préventive ; exclure appendicite, maladie de Crohn et cause gynécologique.</li>
<li>Interactions : métamizole et méthotrexate à éviter ; INR à surveiller sous antivitamine K avec métronidazole ou amoxicilline.</li>
<li>Diagnostic formel : tableau compatible et confirmation par imagerie ; classement compliqué ou non compliqué.</li></ul></template>

<template data-pop="pareto-k57-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="k57-e-1,k57-e-2,k57-e-3,k57-e-4,k57-e-5"></p><ul>
<li>Examen de référence : TDM abdominopelvienne injectée.</li>
<li>Signes : épaississement segmentaire, infiltration de la graisse ; air, abcès et liquide classent la forme.</li>
<li>Épaississement court et asymétrique avec ganglions : craindre un cancer.</li>
<li>CRP normale précoce n’exclut rien ; très élevée, elle fait chercher une complication.</li>
<li>Créatinine avant injection ; test de grossesse avant irradiation.</li>
<li>Pas de coloscopie en phase aiguë ; coloscopie à distance selon la forme et le patient.</li></ul></template>

<template data-pop="pareto-k57-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="k57-p-1,k57-p-2,k57-p-3,k57-p-4"></p><ul>
<li>Paracétamol en première intention, 4 g par jour au plus ; anti-inflammatoires non stéroïdiens évités.</li>
<li>Antibiotique de référence : amoxicilline-acide clavulanique ; pas de comprimé de 1 g sous 30 mL/min.</li>
<li>Ceftriaxone toujours avec métronidazole ; ciprofloxacine avec métronidazole si allergie.</li>
<li>Métronidazole : pas d’alcool, contre-indiqué au premier trimestre.</li>
<li>Métamizole : agranulocytose, à éviter avec le méthotrexate.</li></ul></template>
