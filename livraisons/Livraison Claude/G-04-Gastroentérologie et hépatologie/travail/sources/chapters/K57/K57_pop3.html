<!-- ===== FENÊTRES : essais et décisions thérapeutiques ===== -->
<template data-pop="k57-avod" data-title="Essai AVOD (2012)">
<div class="lab">Question</div><p>L’antibiotique est-il nécessaire dans la diverticulite gauche non compliquée prouvée par TDM ?</p>
<div class="lab">Méthode</div><p>Essai randomisé multicentrique dans dix services de chirurgie suédois et un islandais : 623 patients hospitalisés, 314 avec et 309 sans antibiotique. Critère principal : guérison sans complication à douze mois.</p>
<div class="lab">Résultats</div><p>Perforation ou abcès chez 1,9 % des patients sans antibiotique et 1,0 % avec (p = 0,302). Durée médiane d’hospitalisation de trois jours dans les deux groupes. Récidive avec réhospitalisation à un an de 16 % dans les deux groupes.</p>
<div class="lab">Limites</div><p>Patients hospitalisés, essai sans placebo et en ouvert ; l’effectif ne permettait pas d’exclure une petite différence de complications rares.</p>
<div class="lab">Source</div><p>Chabok A. et al. British Journal of Surgery 2012 ; 99 : 532–539.</p></template>

<template data-pop="k57-diabolo" data-title="Essai DIABOLO (2017)">
<div class="lab">Question</div><p>Une stratégie d’observation sans antibiotique prolonge-t-elle la guérison d’un premier épisode de diverticulite gauche non compliquée ?</p>
<div class="lab">Méthode</div><p>Essai pragmatique randomisé dans 22 centres néerlandais : 528 patients avec diverticulite prouvée par TDM, Hinchey 1a ou 1b. Bras antibiotique : amoxicilline-acide clavulanique intraveineuse au moins 48 heures puis orale, dix jours au total.</p>
<div class="lab">Résultats à six mois</div><p>Durée médiane de guérison : 14 jours sans antibiotique contre 12 jours avec (rapport de risque instantané 0,91, non significatif). Diverticulite compliquée : 3,8 % contre 2,6 %. Réadmission : 17,6 % contre 12,0 % (non significatif). Hospitalisation plus courte sans antibiotique : 2 contre 3 jours (p = 0,006).</p>
<div class="lab">Résultats à 24 mois</div><p>Récidive : 15,4 % contre 14,9 % ; forme compliquée : 4,8 % contre 3,3 % ; sigmoïdectomie : 9,0 % contre 5,0 % (p = 0,085). L’âge inférieur à 50 ans et une douleur initiale de 8 sur 10 ou plus prédisaient la récidive ou la complication.</p>
<div class="lab">Limites</div><p>Essai ouvert sans placebo ; puissance insuffisante pour les critères secondaires. Les tendances numériques en faveur de l’antibiotique ne sont pas significatives mais ne sont pas exclues.</p>
<div class="lab">Sources</div><p>Daniels L. et al. British Journal of Surgery 2017 ; 104 : 52–61. Van Dijk S. T. et al. American Journal of Gastroenterology 2018 ; 113 : 1045–1052.</p></template>

<template data-pop="k57-dinamo" data-title="Essai DINAMO (2021)">
<div class="lab">Question</div><p>La diverticulite légère peut-elle être traitée à domicile sans antibiotique ?</p>
<div class="lab">Méthode</div><p>Essai randomisé de non-infériorité en ouvert dans quinze hôpitaux espagnols : 480 patients avec diverticulite légère prouvée par TDM. Bras contrôle : amoxicilline-acide clavulanique 875/125 mg toutes les 8 heures avec traitement symptomatique. Bras expérimental : traitement symptomatique seul.</p>
<div class="lab">Résultats</div><p>Hospitalisation : 3,3 % sans antibiotique contre 5,8 % avec, ce qui confirme la non-infériorité. Retour aux urgences : 7,0 % contre 6,7 %. Mauvais contrôle de la douleur à 48 heures : 2,3 % contre 5,7 %.</p>
<div class="lab">Limite</div><p>Essai ouvert ; les patients étaient sélectionnés pour une forme légère et un suivi ambulatoire possible.</p>
<div class="lab">Source</div><p>Mora López L. et al. Annals of Surgery 2021 ; 274 : e435–e442.</p></template>

<template data-pop="k57-sansab" data-title="Traitement sans antibiotique : arbitrage des recommandations">
<div class="lab">Recommandation retenue</div><p>La source primaire applicable la plus récente est l’ACG 2026. Elle suggère de ne pas prescrire d’antibiotique de routine au patient à faible risque avec diverticulite aiguë non compliquée. Elle réserve l’antibiotique aux caractéristiques à haut risque, à l’immunodépression, à la fragilité et à l’impossibilité d’assurer un suivi ambulatoire sûr. Périmètre : pratique ambulatoire de gastroentérologie ; énoncés lus dans le résumé PubMed et une synthèse, texte intégral payant non lu.</p>
<div class="lab">Texte européen en vigueur</div><p>La WSES 2020 recommande de ne pas prescrire d’antibiotique au patient immunocompétent sans signe d’inflammation systémique (recommandation forte, preuve de haute qualité) et, si un antibiotique est nécessaire, de préférer la voie orale. L’ESCP 2020 indique que la forme non compliquée ne requiert pas d’antibiotique de routine.</p>
<div class="lab">Position suisse</div><p>Le consensus suisse 2024 ne fixe ni molécule ni durée. Il ne considère pas, pris isolément, la fièvre (58 %) ni des leucocytes supérieurs à 20 G/L (49 %) comme contre-indications au traitement ambulatoire.</p>
<div class="lab">Relation entre les sources</div><p>Les trois textes convergent sur le principe. La nuance porte sur la définition du « haut risque » et sur l’inflammation systémique, que la WSES exclut explicitement de l’abstention.</p>
<div class="lab">Limites des preuves</div><p>Les essais AVOD et DIABOLO étaient ouverts, sans placebo, et ont inclus surtout des premiers épisodes gauches chez des immunocompétents. Ils ne s’appliquent pas à l’immunodéprimé, à la grossesse ni aux formes avec air péricolique.</p></template>

<template data-pop="k57-ambu" data-title="Critères du traitement ambulatoire">
<div class="lab">Conditions habituelles</div><p>Diverticulite non compliquée à l’imagerie ; absence de sepsis et de péritonite ; tolérance des boissons et de l’alimentation ; douleur contrôlée par des antalgiques oraux ; absence d’immunodépression et de comorbidité sévère ; entourage et possibilité de revenir rapidement.</p>
<div class="lab">Recommandation</div><p>La WSES 2020 suggère la prise en charge ambulatoire du patient sans comorbidité, avec réévaluation dans les sept jours, plus tôt si l’état s’aggrave (recommandation faible, preuve de qualité modérée).</p>
<div class="lab">Consignes au patient</div><p>Le patient revient si la fièvre augmente, si la douleur s’étend ou s’aggrave, s’il vomit ou ne peut plus boire, ou si un saignement apparaît.</p>
<div class="lab">Limite</div><p>Les critères diffèrent légèrement selon les essais et les centres ; ils supposent une organisation de suivi fiable.</p></template>

<template data-pop="k57-abces" data-title="Seuil de drainage d’un abcès diverticulaire">
<div class="lab">Contentieux</div><p>Les recommandations ne fixent pas le même seuil de taille au-delà duquel un abcès doit être drainé.</p>
<div class="lab">Positions</div><p>ESCP 2020 : drainage percutané envisagé au-delà de 3 cm, chirurgie en dernier recours (recommandation conditionnelle). ASCRS 2020 : drainage habituellement recommandé chez le patient stable au-delà de 3 cm (recommandation forte). WSES 2020 : antibiotique seul en première intention sous 4 à 5 cm, drainage au-delà (recommandations faibles, preuves de faible qualité). Consensus suisse 2024 : la discussion retient le drainage des abcès de plus de 4 cm.</p>
<div class="lab">Source retenue</div><p>Aucune source plus récente que le consensus suisse 2024 ne tranche ce seuil. En pratique, un abcès de plus de 4 cm est drainé si l’accès est sûr ; entre 3 et 4 cm, le choix dépend de l’accès, de la réponse clinique et du terrain.</p>
<div class="lab">Mécanisme</div><p>Plus l’abcès est volumineux, plus la diffusion de l’antibiotique au centre de la collection est faible et plus l’échec du traitement médical est fréquent.</p>
<div class="lab">Sources</div><p>Schultz J. K. et al., Colorectal Disease 2020 ; Hall J. et al., Diseases of the Colon and Rectum 2020 ; Sartelli M. et al., World Journal of Emergency Surgery 2020 ; Girardin T. et al., British Journal of Surgery Open 2024.</p></template>

<template data-pop="k57-hartmann" data-title="Intervention de Hartmann et anastomose primaire : essai LADIES">
<div class="lab">Intervention de Hartmann</div><p>Le chirurgien résèque le sigmoïde perforé, ferme le moignon rectal et abouche le côlon descendant à la peau. Il évite ainsi une anastomose en milieu infecté. Le rétablissement de la continuité exige une seconde intervention, que beaucoup de patients ne subissent jamais.</p>
<div class="lab">Essai LADIES</div><p>Essai randomisé belge, italien et néerlandais : 133 patients de 18 à 85 ans avec péritonite purulente (Hinchey III) ou stercorale (Hinchey IV). Survie sans stomie à douze mois : 94,6 % après anastomose primaire, 71,7 % après Hartmann. Morbidité : 39 % contre 44 % ; mortalité : 6 % contre 3 %, sans différence significative.</p>
<div class="lab">Conséquence</div><p>Chez le patient stable et immunocompétent de moins de 85 ans, l’anastomose primaire, avec ou sans iléostomie de protection, est préférable. La WSES 2020 la suggère chez le patient stable sans comorbidité et recommande l’intervention de Hartmann chez le patient en état critique.</p>
<div class="lab">Source</div><p>Lambrichts D. P. V. et al. Lancet Gastroenterology and Hepatology 2019 ; 4 : 599–610.</p></template>

<template data-pop="k57-damage" data-title="Chirurgie écourtée (« damage control »)">
<div class="lab">Principe</div><p>Chez le patient en choc septique, le chirurgien limite l’intervention au contrôle de la source : résection rapide du segment perforé sans rétablissement de la continuité, lavage, fermeture temporaire de l’abdomen. Le patient est réanimé, puis réopéré dans les 24 à 48 heures.</p>
<div class="lab">Intérêt</div><p>L’intervention courte limite l’hypothermie, l’acidose et la coagulopathie du patient instable. Une anastomose différée peut alors être envisagée chez le patient stabilisé.</p>
<div class="lab">Limite</div><p>Le consensus suisse 2024 la cite comme option chez l’instable sans la préférer à l’intervention de Hartmann ; les données comparatives restent limitées.</p></template>

<template data-pop="k57-lavage" data-title="Lavage péritonéal laparoscopique : essai SCANDIV">
<div class="lab">Principe</div><p>Le chirurgien aspire le pus et lave la cavité sous laparoscopie, sans réséquer le sigmoïde.</p>
<div class="lab">SCANDIV à cinq ans</div><p>Essai randomisé en Suède et en Norvège : 199 patients randomisés, 145 avec péritonite purulente confirmée. Complications sévères : 36 % après lavage, 35 % après résection. Mortalité globale : 32 % contre 25 %, sans différence significative. Stomie chez les survivants : 8 % contre 33 %. Récidive : 21 % contre 4 % ; 30 % des patients du groupe lavage ont finalement eu une sigmoïdectomie.</p>
<div class="lab">Recommandation</div><p>La WSES 2020 réserve le lavage à des patients très sélectionnés avec péritonite généralisée purulente. Le consensus suisse 2024 n’a pas atteint de consensus à son sujet.</p>
<div class="lab">Source</div><p>Azhar N. et al. JAMA Surgery 2021 ; 156 : 121–127.</p></template>

<template data-pop="k57-stopit" data-title="Durée courte de l’antibiotique : essai STOP-IT">
<div class="lab">Question</div><p>Après contrôle de la source d’une infection intra-abdominale compliquée, une durée fixe courte est-elle aussi efficace qu’une durée guidée par la normalisation clinique ?</p>
<div class="lab">Résultat</div><p>L’essai STOP-IT (Sawyer R. G. et al., New England Journal of Medicine 2015) a montré qu’environ quatre jours d’antibiotique après contrôle de la source n’étaient pas inférieurs à une durée plus longue.</p>
<div class="lab">Application</div><p>La WSES 2020 suggère quatre jours d’antibiotique postopératoire dans la diverticulite compliquée lorsque le contrôle de la source est adéquat (recommandation faible, preuve de qualité modérée). Une fièvre persistante après cinq à sept jours de traitement adéquat fait rechercher une collection résiduelle.</p>
<div class="lab">Limite</div><p>L’essai portait sur l’ensemble des infections intra-abdominales ; les patients immunodéprimés et les contrôles de source incomplets nécessitent une durée individualisée. Les chiffres détaillés de STOP-IT ont été lus dans la WSES 2020 et non dans l’article original.</p></template>

<template data-pop="k57-laser" data-title="Essai LASER (2021–2025)">
<div class="lab">Question</div><p>La sigmoïdectomie laparoscopique élective améliore-t-elle la qualité de vie par rapport au traitement conservateur après une diverticulite récidivante, compliquée ou douloureuse persistante ?</p>
<div class="lab">Méthode</div><p>Essai randomisé en ouvert dans six hôpitaux finlandais : 90 patients de 18 à 75 ans. Bras conservateur : éducation et supplément de fibres.</p>
<div class="lab">Résultats</div><p>À six mois, l’indice de qualité de vie gastro-intestinale était supérieur de 11,96 points après chirurgie, avec 10 % de complications majeures. À deux ans, 61 % des patients du bras conservateur avaient récidivé contre 11 % des opérés. À quatre ans, la qualité de vie ne différait plus significativement ; les récidives touchaient 92 % du bras conservateur contre 16 % du bras chirurgical, et 32 % des patients conservateurs avaient été opérés.</p>
<div class="lab">Conséquence</div><p>La chirurgie prévient les récidives. Elle se propose d’emblée au patient dont la qualité de vie est altérée ; le traitement conservateur reste une option si la qualité de vie est presque normale.</p>
<div class="lab">Sources</div><p>Santos A. et al. JAMA Surgery 2021 ; 156 : 129–136 ; JAMA Surgery 2023 ; 158 : 593–601 ; JAMA Surgery 2025 ; 160 : 615–622.</p></template>

<template data-pop="k57-prevent" data-title="Prévention médicamenteuse de la récidive : essais négatifs">
<div class="lab">Mésalazine</div><p>Les essais PREVENT1 et PREVENT2 (Raskin J. B. et al., Gastroenterology 2014) ont inclus 590 et 592 patients guéris d’au moins une diverticulite. La mésalazine à 1,2, 2,4 ou 4,8 g par jour pendant 104 semaines n’a pas réduit la récidive par rapport au placebo.</p>
<div class="lab">Rifaximine et probiotiques</div><p>Les données sont insuffisantes ou de faible qualité. L’ACG 2026 recommande de ne pas les prescrire pour prévenir la récidive, comme la mésalazine.</p>
<div class="lab">Ce qui reste</div><p>La prévention repose sur le mode de vie : alimentation riche en fibres, activité physique, contrôle du poids, arrêt du tabac, modération de l’alcool et limitation des anti-inflammatoires non stéroïdiens.</p></template>
