<!-- ===== FENÊTRES : clinique, diagnostic, suivi ===== -->
<template data-pop="k57-douleur" data-title="Douleur de la fosse iliaque gauche">
<div class="lab">Caractérisation</div><p>La douleur de la diverticulite est continue, d’installation progressive sur un à trois jours, localisée dans la fosse iliaque gauche ou l’hypogastre. Elle s’aggrave à la marche, à la toux et aux secousses.</p>
<div class="lab">Physiopathologie</div><p>L’inflammation atteint la graisse péricolique et le péritoine pariétal voisin, innervé par des fibres somatiques. C’est pourquoi la douleur est bien localisée, contrairement à la douleur viscérale mal localisée d’une distension.</p>
<div class="lab">Valeur et limites</div><p>Une douleur gauche fébrile est évocatrice, mais un sigmoïde long peut donner une douleur médiane ou droite. La diverticulite droite donne une douleur droite. La localisation ne suffit pas au diagnostic.</p>
<div class="lab">Piège</div><p>Une douleur brutale et diffuse évoque une perforation libre ou une autre urgence abdominale : le patient relève d’une évaluation chirurgicale immédiate.</p></template>

<template data-pop="k57-palp" data-title="Palpation de la fosse iliaque gauche">
<div class="lab">Technique</div><p>Le patient est en décubitus dorsal, genoux fléchis. Le médecin palpe d’abord la zone indolore, puis la fosse iliaque gauche, superficiellement puis profondément. Il recherche une défense, une masse et la douleur à la décompression.</p>
<div class="lab">Normal</div><p>L’abdomen est souple, la palpation profonde indolore ; le sigmoïde rempli de selles peut être perçu comme un cordon mobile non douloureux.</p>
<div class="lab">Pathologique</div><p>Une douleur provoquée avec défense localisée évoque une diverticulite. Une masse sensible évoque un phlegmon ou un abcès. Une défense généralisée ou une contracture évoque une péritonite.</p>
<div class="lab">Limite</div><p>Chez le sujet âgé, obèse ou sous corticoïdes, la défense peut manquer malgré une perforation.</p></template>

<template data-pop="k57-sepsis" data-title="Repérage du sepsis par le score qSOFA">
<div class="lab">Critères</div><p>Le score qSOFA (Sepsis-3, 2016) compte un point pour chacun des critères suivants : fréquence respiratoire de 22 par minute ou plus, pression artérielle systolique de 100 mmHg ou moins, altération de l’état mental.</p>
<div class="lab">Interprétation</div><p>Deux points ou plus chez un patient infecté identifient un risque accru de mauvaise évolution et imposent la recherche de défaillances d’organes, un lactate et une prise en charge hospitalière.</p>
<div class="lab">Limite</div><p>Le qSOFA est un outil de repérage, peu sensible : un score de 0 n’exclut pas un sepsis débutant. Le jugement clinique et les signes de péritonite restent déterminants.</p></template>

<template data-pop="k57-immuno" data-title="Diverticulite chez le patient immunodéprimé">
<div class="lab">Qui est concerné</div><p>Les patients sous corticothérapie prolongée, immunosuppresseurs, chimiothérapie, les transplantés d’organe et les patients infectés par le VIH avec immunodépression avancée.</p>
<div class="lab">Mécanisme</div><p>La réponse inflammatoire diminuée contient mal la microperforation. Les signes cliniques et biologiques sont atténués, alors que la perforation est plus fréquente.</p>
<div class="lab">Conduite</div><p>La WSES 2020 considère ces patients à haut risque d’échec du traitement non opératoire (recommandation faible). L’antibiotique est systématique, l’hospitalisation fréquente et la TDM précoce. L’AGA 2021 conseille fortement l’antibiotique. La sigmoïdectomie élective se discute plus tôt : le consensus suisse 2024 retient l’immunodépression comme indication (accord de 89 %).</p></template>

<template data-pop="k57-crp" data-title="CRP dans la diverticulite">
<div class="lab">Pourquoi la doser</div><p>La CRP, synthétisée par le foie sous l’effet de l’interleukine 6, mesure l’intensité de l’inflammation. Elle aide à apprécier la gravité et à suivre l’évolution.</p>
<div class="lab">Comment l’interpréter</div><p>Une valeur normale au tout début n’exclut pas la diverticulite, car l’ascension de la CRP est retardée. Dans les études citées par la WSES 2020, des seuils de 149,5 à 175 mg/L distinguaient les formes compliquées. Une comorbidité inflammatoire modifie la valeur de base et réduit sa fiabilité.</p>
<div class="lab">Comment agir</div><p>Une CRP très élevée ou qui augmente sous traitement fait demander ou répéter une TDM. Une CRP qui baisse accompagne habituellement l’amélioration clinique.</p>
<div class="lab">Limite</div><p>Aucun seuil de CRP ne remplace l’imagerie pour classer la diverticulite ; la WSES 2020 n’en fait pas une recommandation graduée.</p></template>

<template data-pop="k57-tdm" data-title="TDM abdominopelvienne dans la diverticulite">
<div class="lab">Indication</div><p>Elle est l’examen de première intention au premier épisode, en cas de doute, de gravité, d’immunodépression ou d’évolution défavorable (WSES 2020 ; consensus suisse 2024 ; ACG 2026).</p>
<div class="lab">Technique</div><p>Acquisition abdominopelvienne avec injection intraveineuse de produit de contraste iodé ; une opacification digestive n’est pas systématique.</p>
<div class="lab">Ce qu’elle montre</div><p>L’épaississement pariétal, l’infiltration de la graisse, les bulles d’air, l’abcès et sa taille, le liquide et l’air libres, une fistule. Elle reconnaît aussi l’appendicite, la colite ischémique, la pathologie gynécologique ou urinaire.</p>
<div class="lab">Limites et pièges</div><p>Elle irradie et nécessite une fonction rénale suffisante pour l’injection. Elle ne distingue pas toujours un cancer d’une diverticulite ; la coloscopie à distance tranche. La WSES 2020 la qualifie d’examen à excellente sensibilité et spécificité, sans en faire un critère unique.</p></template>

<template data-pop="k57-echo" data-title="Échographie dans la diverticulite">
<div class="lab">Technique</div><p>Sonde de haute fréquence, compression progressive sur le point douloureux. L’opérateur cherche un segment colique épaissi, non compressible, avec diverticule inflammatoire et graisse hyperéchogène autour.</p>
<div class="lab">Valeur</div><p>Entre des mains entraînées, elle confirme la diverticulite et détecte un abcès. Elle n’irradie pas et convient à la grossesse et à l’adulte jeune. La WSES 2020 la propose comme alternative, avec passage à la TDM si elle n’est pas concluante (recommandation faible, preuve de qualité modérée).</p>
<div class="lab">Limites</div><p>Elle dépend de l’opérateur et de la morphologie ; l’obésité et les gaz limitent l’analyse. L’air extraluminal et les collections profondes sont moins bien vus qu’en TDM.</p></template>

<template data-pop="k57-ischemie" data-title="Colite ischémique, diagnostic différentiel">
<div class="lab">Tableau</div><p>Un patient âgé, souvent vasculaire, présente une douleur abdominale brève suivie dans les heures d’une rectorragie ou d’une diarrhée sanglante.</p>
<div class="lab">Distinction</div><p>L’atteinte siège souvent au niveau de l’angle gauche ou du sigmoïde, zones de suppléance artérielle fragile. La TDM montre un épaississement segmentaire sans diverticule inflammatoire ; la coloscopie précoce montre une muqueuse œdémateuse et ulcérée.</p>
<div class="lab">Conséquence</div><p>Le traitement repose sur le soutien hémodynamique et non sur l’abstention antibiotique de la diverticulite. Le cours K55 détaille cette maladie.</p></template>

<template data-pop="k57-cancer" data-title="Cancer colorectal qui imite une diverticulite">
<div class="lab">Mécanisme</div><p>Un adénocarcinome sigmoïdien peut se perforer, s’abcéder ou sténoser le côlon. Il donne alors douleur, fièvre et épaississement pariétal, comme une diverticulite.</p>
<div class="lab">Indices</div><p>Un épaississement court et asymétrique, des ganglions mésentériques, une perte de poids, une anémie ferriprive ou des troubles du transit anciens orientent vers le cancer.</p>
<div class="lab">Chiffres</div><p>Après une diverticulite gauche prouvée par TDM, la prévalence du cancer est d’environ 2 % ; elle est d’environ 0,5 % dans les formes non compliquées et nettement plus élevée dans les formes compliquées (Rottier 2019 ; Cao 2022).</p>
<div class="lab">Conséquence</div><p>La coloscopie à distance est indispensable après une forme compliquée ou en présence de signes d’alarme.</p></template>

<template data-pop="k57-colo" data-title="Coloscopie après diverticulite : arbitrage des recommandations">
<div class="lab">Question</div><p>Faut-il une coloscopie après chaque diverticulite ? Les recommandations ont évolué depuis la généralisation de la TDM.</p>
<div class="lab">Données</div><p>Méta-analyse de Rottier (British Journal of Surgery 2019, 3296 patients) : cancer chez 2,1 % après diverticulite gauche prouvée par TDM, 0,5 % dans la forme non compliquée ; néoplasie avancée chez 6,9 %. Méta-analyse de Cao (Australian and New Zealand Journal of Surgery 2023, 13 905 patients) : cancer chez 2,0 %, adénome avancé chez 3,8 % ; rapport de cotes de cancer de 9,2 entre formes compliquées et non compliquées ; 85 % des cancers au niveau du segment enflammé.</p>
<div class="lab">Source retenue</div><p>La source primaire applicable la plus récente est l’ACG 2026 (American Journal of Gastroenterology, juillet 2026). Elle recommande la coloscopie après une diverticulite compliquée et la suggère après une forme non compliquée en cas de signes d’alarme ou de dépistage non à jour. Elle s’adresse à la pratique ambulatoire nord-américaine ; ses énoncés ont été lus dans le résumé et dans une synthèse, le texte intégral étant payant.</p>
<div class="lab">Textes en vigueur plus anciens</div><p>WSES 2020 : évaluation colique précoce à 4–6 semaines après un abcès traité sans chirurgie ; pas d’évaluation de routine après une forme non compliquée prouvée par TDM (recommandation faible). ESCP 2020 : suivi endoscopique à au moins six semaines chez les patients non opérés, discuté après une forme non compliquée. Ces textes sont compatibles avec l’ACG 2026.</p>
<div class="lab">Délai</div><p>Six semaines ou plus après l’épisode, pour laisser régresser l’inflammation et limiter le risque de perforation par l’insufflation.</p>
<div class="lab">Limite</div><p>La méta-analyse de Cao conclut au contraire en faveur d’une coloscopie de routine chez tout patient apte ; le débat n’est pas clos. Le contexte suisse du dépistage organisé doit aussi être pris en compte.</p></template>

<template data-pop="k57-depistage" data-title="Dépistage du cancer colorectal en Suisse">
<div class="lab">Principe</div><p>En Suisse, l’assurance obligatoire des soins rembourse depuis 2013 le dépistage du cancer colorectal à partir de 50 ans, par coloscopie tous les dix ans ou par test immunochimique de sang occulte fécal tous les deux ans. Plusieurs cantons organisent un programme qui exempte l’examen de la franchise.</p>
<div class="lab">Limite d’âge supérieure</div><p>Les sources consultées le 08.10.2026 divergent entre 69 et 74 ans ; la page officielle de l’Office fédéral de la santé publique n’a pas pu être consultée. Cette borne doit être lue dans l’ordonnance sur les prestations en vigueur.</p>
<div class="lab">Lien avec la diverticulite</div><p>Un patient qui n’est pas à jour de son dépistage et qui a fait une diverticulite reçoit une coloscopie à distance de l’épisode (ACG 2026).</p></template>

<template data-pop="k57-hemo" data-title="Hémorragie diverticulaire : synthèse">
<div class="lab">Tableau</div><p>Hématochézie abondante, indolore, sans fièvre, chez un adulte âgé, souvent sous aspirine, anti-inflammatoires ou anticoagulants.</p>
<div class="lab">Mécanisme</div><p>Rupture d’un vaisseau droit étiré au dôme ou au collet d’un diverticule, sans inflammation.</p>
<div class="lab">Évolution</div><p>Le saignement s’arrête spontanément dans la majorité des cas, mais récidive souvent.</p>
<div class="lab">Conduite</div><p>Évaluation hémodynamique, transfusion selon un seuil restrictif, coloscopie après préparation, angio-TDM si le saignement est actif et abondant, hémostase endoscopique ou embolisation. Les seuils et les étapes figurent dans le cours K92 — Hémorragie digestive.</p></template>

<template data-pop="k57-grossesse" data-title="Diverticulite pendant la grossesse">
<div class="lab">Fréquence</div><p>Elle est rare, car la diverticulose est une maladie de l’adulte plus âgé ; l’augmentation de l’âge maternel la rend toutefois possible.</p>
<div class="lab">Imagerie</div><p>L’échographie est l’examen de première ligne ; l’IRM sans gadolinium la complète. La TDM se réserve aux situations où l’IRM n’est pas disponible et où le diagnostic change la conduite.</p>
<div class="lab">Traitement</div><p>Les essais sans antibiotique n’ont pas porté sur la femme enceinte. L’antibiotique est habituellement prescrit par prudence. Selon l’information professionnelle suisse, le métronidazole est contre-indiqué au premier trimestre et l’amoxicilline-acide clavulanique ne s’utilise qu’en cas de nécessité absolue ; le choix se fait avec l’obstétricien.</p></template>

<template data-pop="k57-grele" data-title="Diverticules du grêle">
<div class="lab">Formes</div><p>Les diverticules duodénaux siègent souvent près de l’ampoule de Vater. Les diverticules jéjunaux et iléaux acquis, souvent multiples, siègent sur le bord mésentérique. Le diverticule de Meckel, congénital, est exclu de K57.</p>
<div class="lab">Complications</div><p>La stase dans les diverticules jéjunaux favorise une pullulation bactérienne avec diarrhée, malabsorption et carence en vitamine B12. Ils peuvent aussi s’enflammer, saigner ou se perforer.</p>
<div class="lab">Codage</div><p>K57.0 ou K57.1 pour le grêle seul, K57.4 ou K57.5 lorsque le côlon est également atteint. La malabsorption se traite dans le cours K90.</p></template>
