<section class="ilot" id="k51-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Madame L., 29 ans, enseignante à Neuchâtel, consulte son médecin de famille pour une diarrhée qui dure depuis six semaines. Elle va à selle six fois par jour, dont quatre fois avec du sang rouge mêlé à du mucus. Elle ressent des besoins impérieux, une sensation de vidange incomplète et une selle la réveille une nuit sur deux. Elle a arrêté de fumer il y a huit mois. Elle n’a pas voyagé, n’a pas pris d’antibiotique et son entourage n’est pas malade.</p>
<p>À l’examen, la fréquence cardiaque est de 92 par minute et la température de 37,4 °C. Le bilan montre une hémoglobine à 112 g/L, une protéine C-réactive à 18 mg/L, une albumine à 36 g/L et une <button class="w" data-k="k51-calpro">calprotectine fécale (marqueur de l’inflammation intestinale)</button> à 1 450 µg/g. La question qui structure le chapitre est la suivante : <b>cette patiente a-t-elle une rectocolite hémorragique, quelle est son extension et sa sévérité, comment écarter une infection, et quel traitement induira puis maintiendra une rémission sans exposer inutilement aux corticoïdes ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait reconnaître un syndrome rectal et une diarrhée sanglante chronique, éliminer les colites infectieuses, demander une iléocoloscopie avec biopsies étagées, classer la maladie selon Montréal et le score de Mayo, reconnaître une <button class="w" data-k="k51-tw">colite aiguë grave (critères de Truelove et Witts)</button> et la traiter, choisir un traitement d’entretien selon la recommandation ECCO 2026 et planifier la surveillance du cancer colorectal.</p>
<div class="key"><b>Message fondateur.</b> La rectocolite hémorragique est une inflammation <b>continue</b> de la muqueuse qui part toujours du rectum et remonte plus ou moins loin dans le côlon. Elle évolue par poussées et rémissions pendant toute la vie. L’objectif n’est pas seulement de faire disparaître le sang dans les selles, mais d’obtenir la cicatrisation de la muqueuse, car l’inflammation persistante prédit les rechutes, les hospitalisations, la colectomie et le cancer colorectal.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="k51-barriere">épithélium colique et sa barrière de mucus (première ligne de défense)</button>, la <button class="w" data-k="k51-mayo">notion de score d’activité (score de Mayo)</button> et la différence entre <button class="w" data-k="k51-crohn">rectocolite et maladie de Crohn (renvoi K50)</button>. Les bases anatomiques, histologiques et immunologiques sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="k51-1"><h2><span class="n">1</span>Définition, classifications et codage</h2>
<p>La rectocolite hémorragique est une maladie inflammatoire chronique de l’intestin limitée au côlon. L’inflammation atteint la muqueuse et, au plus, la partie superficielle de la sous-muqueuse. Elle commence au rectum et s’étend vers le haut de façon <b>continue</b>, sans intervalle de muqueuse saine. Ces trois traits la distinguent de la maladie de Crohn, qui peut toucher tout le tube digestif, atteint toute l’épaisseur de la paroi et laisse des zones saines entre les lésions.</p>
<p>Exemple : une coloscopie montre un rectum et un sigmoïde rouges, granités et saignant au contact, puis une muqueuse normale à partir de 35 cm de la marge anale. Cette limite nette et la continuité depuis le rectum orientent vers une rectocolite. Une atteinte du côlon droit avec un rectum épargné et des ulcères profonds orienterait au contraire vers un Crohn.</p>
<h3>1.1 Classification de Montréal : extension</h3>
<p>L’extension maximale observée en endoscopie décide du traitement local ou oral, du risque de cancer et du calendrier de surveillance. La <button class="w" data-k="k51-mont">classification de Montréal (2005)</button> distingue trois étendues.</p>
<table class="t"><tr><th>Classe</th><th>Extension</th><th>Conséquence principale</th></tr>
<tr><td>Rectite</td><td>Rectum seul, jusqu’à la jonction rectosigmoïdienne</td><td>Le suppositoire couvre toute la maladie ; aucun excès de risque de cancer colorectal démontré</td></tr>
<tr><td>Colite gauche</td><td>Jusqu’à l’angle colique gauche (splénique)</td><td>Le lavement atteint l’angle gauche ; risque de cancer intermédiaire</td></tr>
<tr><td>Colite étendue</td><td>Au-delà de l’angle gauche, jusqu’à la pancolite</td><td>Traitement oral nécessaire ; risque de cancer le plus élevé</td></tr></table>
<p>Pour lire ce tableau, on regarde d’abord la limite supérieure de l’inflammation, car elle fixe la portée d’un traitement rectal. Un suppositoire diffuse sur 15 à 20 cm environ, un lavement jusqu’à l’angle gauche. L’erreur fréquente consiste à classer selon la dernière coloscopie alors que la classe retient l’extension <b>maximale</b> jamais documentée. Madame L. a une inflammation jusqu’à 45 cm : elle a une colite gauche.</p>

<h3>1.2 Sévérité de la poussée</h3>
<p>Montréal classe aussi la sévérité en quatre niveaux : rémission ; poussée légère, avec quatre selles ou moins par jour, sans signe systémique ; poussée modérée, avec plus de quatre selles par jour et peu de signes systémiques ; poussée sévère, avec au moins six selles sanglantes par jour, une fréquence cardiaque d’au moins 90 par minute, une température d’au moins 37,5 °C, une hémoglobine inférieure à 105 g/L ou une vitesse de sédimentation d’au moins 30 mm/h. En pratique, l’activité se mesure par le <button class="w" data-k="k51-mayo">score de Mayo (0 à 12)</button> et l’endoscopie par le <button class="w" data-k="k51-uceis">sous-score endoscopique de Mayo et l’indice UCEIS</button>.</p>
<p>La poussée sévère de l’adulte hospitalisé se définit par les <button class="w" data-k="k51-tw">critères de Truelove et Witts</button> : au moins six selles sanglantes par jour et au moins un signe de toxicité systémique. Cette définition déclenche une hospitalisation, car elle sépare une maladie gérable en ambulatoire d’une colite qui peut perforer ou tuer.</p>
<h3>1.3 Profils évolutifs définis par ECCO</h3>
<div class="two">
<div class="card"><h4>Corticodépendance</h4><p>Le patient ne parvient pas à descendre sous 10 mg de prednisolone par jour dans les trois mois sans rechute, ou il rechute dans les trois mois suivant l’arrêt. Ce profil impose un traitement d’entretien efficace, car chaque nouvelle cure ajoute une toxicité cumulative.</p></div>
<div class="card"><h4>Corticorésistance</h4><p>La maladie reste active malgré une prednisolone jusqu’à 0,75 mg/kg par jour pendant quatre semaines. La corticorésistance impose de rechercher une infection et de passer à un traitement avancé.</p></div>
<div class="card"><h4>Rectite réfractaire</h4><p>La rectite persiste malgré les traitements rectaux et oraux bien conduits. On vérifie d’abord l’adhésion, la technique d’application et l’absence d’infection sexuellement transmissible.</p></div>
<div class="card"><h4>Colite aiguë grave</h4><p>Elle répond aux critères de Truelove et Witts. Elle reste la seule urgence médicale de la maladie et se traite à l’hôpital avec chirurgien et gastroentérologue dès le premier jour.</p></div></div>
<h3>1.4 Codage CIM-10-GM 2024</h3>
<p>La CIM-10-GM 2024 code la rectocolite hémorragique selon l’extension et selon une complication locale. Les sous-codes n’ont pas de cinquième caractère.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Précision utile</th></tr>
<tr><td>K51.0</td><td>Pancolite ulcéreuse (chronique)</td><td>Inclut la colite subtotale et l’<button class="w" data-k="k51-backwash">iléite de reflux (iléon terminal inflammatoire par contiguïté)</button> ; exclut la colite indéterminée</td></tr>
<tr><td>K51.2</td><td>Rectite ulcéreuse (chronique)</td><td>Correspond à la rectite de Montréal</td></tr>
<tr><td>K51.3</td><td>Rectosigmoïdite ulcéreuse (chronique)</td><td>Forme distale limitée au sigmoïde</td></tr>
<tr><td>K51.4</td><td>Polypes inflammatoires du côlon</td><td>Les <button class="w" data-k="k51-pseudopol">pseudo-polypes post-inflammatoires (cicatrices de muqueuse)</button> ne sont pas des adénomes</td></tr>
<tr><td>K51.5</td><td>Colite gauche</td><td>Hémicolite gauche ; correspond à la colite gauche de Montréal</td></tr>
<tr><td>K51.8</td><td>Autres rectocolites hémorragiques</td><td>Forme précisée non classée ailleurs</td></tr>
<tr><td>K51.9</td><td>Rectocolite hémorragique, sans précision</td><td>Extension non documentée</td></tr></table>
<p>Pour coder, on part de l’extension maximale documentée. Une colite qu’aucun critère ne permet de classer entre Crohn et rectocolite se code K52.3 (colite indéterminée) et relève du <button class="w" data-k="k51-renvois">cours K52 — Autres colites non infectieuses (renvois)</button>. Un ulcère, une perforation ou une fistule intestinale sans rectocolite relèvent de K63 — Polypes colorectaux et autres maladies de l’intestin.</p>
<div class="key"><b>À retenir.</b> La rectocolite part du rectum, reste continue, superficielle et limitée au côlon. On la classe par son extension maximale (rectite, colite gauche, colite étendue), sa sévérité (de la rémission à la poussée sévère, score de Mayo) et son profil vis-à-vis des corticoïdes. Ces trois informations décident du traitement, développé après l’étude de ses causes.</div>
</section>

<section class="ilot" id="k51-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>En Suisse, les maladies inflammatoires chroniques de l’intestin touchent environ 0,4 % de la population, soit une personne sur 250. La maladie de Crohn et la rectocolite y contribuent à parts égales, soit environ une personne sur 500 pour la rectocolite (Schoepfer et Safroneeva, Therapeutische Umschau, vol. 75). L’Europe du Nord a les prévalences les plus élevées au monde, jusqu’à 505 cas pour 100 000 habitants pour la rectocolite en Norvège (Ng et coll., Lancet 2017). L’incidence progresse dans les pays nouvellement industrialisés, ce qui oriente vers un rôle de l’environnement et de l’alimentation.</p>
<p>La maladie débute surtout entre 15 et 30 ans, avec un second pic plus modeste entre 50 et 70 ans. Les deux sexes sont touchés à peu près également. Les données suisses d’incidence récentes par canton ne sont pas publiées sous une forme directement exploitable ; la <button class="w" data-k="k51-sibdcs">cohorte suisse des maladies inflammatoires de l’intestin</button> renseigne surtout l’évolution et les traitements.</p>
<h3>2.1 Histoire naturelle</h3>
<p>Selon une revue des cohortes de population adultes (Fumery et coll., Clinical Gastroenterology and Hepatology 2018), 70 à 80 % des patients rechutent dans les dix ans suivant le diagnostic. Environ 10 à 15 % ont une maladie agressive. Une rectite ou une colite gauche s’étend vers le haut chez 10 à 30 % des patients au cours du suivi, ce qui change le traitement et la surveillance. Entre 15 et 25 % des patients sont hospitalisés au moins une fois pour une colite aiguë grave, souvent dès la première poussée (BSG 2019).</p>
<p>La mortalité globale des patients reste proche de celle de la population générale. Les décès évitables surviennent surtout lors d’une colite aiguë grave opérée trop tard, d’une thrombose veineuse ou d’un cancer colorectal non dépisté. Le risque de cancer colorectal dépend de la durée, de l’extension et de l’intensité de l’inflammation ; il est détaillé dans la <button class="w" data-k="k51-ccr">fenêtre du risque de cancer colorectal (chiffres et mécanisme)</button>.</p>
<div class="key"><b>À retenir.</b> Une personne sur 500 environ vit avec une rectocolite en Suisse. La maladie est chronique : sept à huit patients sur dix rechutent en dix ans, et un sur cinq environ connaît une hospitalisation pour poussée grave. L’extension peut progresser ; elle se réévalue donc pendant le suivi. Ces faits expliquent les mécanismes qui suivent.</div>
</section>

<section class="ilot" id="k51-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La rectocolite résulte d’une réponse immunitaire muqueuse inadaptée contre le microbiote colique chez un sujet génétiquement prédisposé, sous l’influence de l’environnement. La chaîne se lit en quatre charnières. Chaque charnière explique un symptôme et chaque traitement agit sur l’une d’elles.</p>
<h3>3.1 État normal</h3>
<p>Le côlon contient environ cent mille milliards de bactéries séparées de l’épithélium par une couche interne de mucus presque stérile. Les cellules épithéliales sont jointes par des jonctions serrées. Elles reçoivent du butyrate produit par les bactéries, qui leur fournit l’essentiel de leur énergie. Les cellules immunitaires de la lamina propria tolèrent ce microbiote grâce aux lymphocytes T régulateurs et à l’interleukine 10.</p>
<h3>3.2 Première charnière : défaut de barrière</h3>
<p>Chez le patient, la couche de mucus est plus fine et plus perméable, et les jonctions serrées sont moins étanches. Des produits bactériens atteignent alors la lamina propria. Ce <button class="w" data-k="k51-barriere">défaut de barrière épithéliale</button> explique pourquoi l’inflammation commence à la surface et reste superficielle.</p>
<h3>3.3 Deuxième charnière : activation immunitaire</h3>
<p>Les cellules dendritiques et les macrophages activés produisent du <button class="w" data-k="k51-tnf">facteur de nécrose tumorale alpha (TNF-α), cible des anti-TNF</button>, de l’interleukine 12 et de l’<button class="w" data-k="k51-il23">interleukine 23 (IL-23), cible des anti-IL-23</button>. Ces cytokines entretiennent des lymphocytes Th17 et des lymphocytes producteurs d’interleukine 13. La signalisation de nombreuses cytokines passe par les <button class="w" data-k="k51-jak">kinases Janus (JAK), cibles des petites molécules</button>.</p>
<h3>3.4 Troisième charnière : recrutement des leucocytes</h3>
<p>L’endothélium inflammatoire exprime la molécule d’adhésion MAdCAM-1, spécifique des vaisseaux intestinaux. Les lymphocytes porteurs de l’intégrine α4β7 s’y fixent et migrent vers la muqueuse. Les lymphocytes quittent par ailleurs les ganglions grâce au récepteur de la sphingosine-1-phosphate. Ces deux étapes sont les cibles du <button class="w" data-k="k51-homing">védolizumab et des modulateurs du récepteur S1P (domiciliation intestinale)</button>.</p>
<h3>3.5 Quatrième charnière : lésion et manifestations</h3>
<p>Les polynucléaires neutrophiles envahissent les cryptes et forment des abcès cryptiques. L’épithélium se détruit, la muqueuse saigne au contact et s’ulcère. La muqueuse lésée absorbe moins le sodium et l’eau, et elle sécrète du mucus et du plasma : la diarrhée en résulte. L’inflammation du rectum, très innervé, produit le <button class="w" data-k="k51-tenesme">syndrome rectal (ténesme, faux besoins, urgence)</button>. La perte de sang chronique et l’inflammation entraînent une <button class="w" data-k="k51-anemie">anémie (facteur aggravant de la poussée)</button>.</p>

<p>Pour lire la figure, on part de la barrière normale puis on descend : chaque flèche est une étape qu’un médicament peut interrompre. La calprotectine fécale, protéine des neutrophiles, mesure l’intensité du dernier niveau. Chez Madame L., la valeur de 1 450 µg/g traduit un afflux massif de neutrophiles dans la muqueuse, et non une simple diarrhée fonctionnelle.</p>
<div class="key"><b>À retenir.</b> Une barrière muqueuse défaillante laisse le microbiote activer une immunité dominée par le TNF-α, l’IL-23 et la voie JAK. Les lymphocytes sont recrutés par α4β7 et quittent les ganglions grâce au récepteur S1P. Les neutrophiles détruisent les cryptes : sang, mucus, diarrhée et ténesme en découlent. Les facteurs qui favorisent cette chaîne sont étudiés ensuite.</div>
</section>

<section class="ilot" id="k51-4"><h2><span class="n">4</span>Facteurs de risque et déclencheurs de poussée</h2>
<p>Aucun facteur isolé ne cause la rectocolite. Les études épidémiologiques décrivent des associations ; certaines ont un mécanisme plausible, d’autres restent inexpliquées. Il faut donc distinguer un facteur associé au risque d’un facteur démontré comme causal.</p>
<table class="t"><tr><th>Facteur</th><th>Sens de l’association</th><th>Mécanisme proposé et limite</th></tr>
<tr><td>Antécédent familial au premier degré</td><td>Risque augmenté</td><td>Prédisposition polygénique ; la plupart des patients n’ont aucun parent atteint</td></tr>
<tr><td>Arrêt du tabac</td><td>Risque augmenté dans les années qui suivent</td><td>Voir la <button class="w" data-k="k51-tabac">fenêtre du paradoxe du tabac</button> ; le tabac n’est jamais un traitement</td></tr>
<tr><td>Appendicectomie avant 20 ans pour appendicite</td><td>Risque diminué</td><td>Voir la <button class="w" data-k="k51-appendic">fenêtre de l’appendice</button> ; association, causalité non prouvée</td></tr>
<tr><td>Gastroentérite infectieuse récente</td><td>Risque transitoirement augmenté</td><td>Rupture de barrière et modification du microbiote ; peut aussi révéler une maladie préexistante</td></tr>
<tr><td>Antibiotiques répétés dans l’enfance</td><td>Risque modestement augmenté</td><td>Appauvrissement du microbiote ; facteurs de confusion possibles</td></tr></table>
<p>Pour lire ce tableau, on retient que seuls l’antécédent familial, le tabac et l’appendicectomie ont une association robuste et reproductible. L’erreur fréquente consiste à conseiller de reprendre le tabac : le risque cardiovasculaire et oncologique l’emporte largement sur un bénéfice digestif inconstant. Madame L. a arrêté de fumer huit mois avant le début des symptômes ; ce contexte est classique et ne doit pas la culpabiliser.</p>
<h3>4.1 Déclencheurs d’une poussée chez un patient connu</h3>
<p>Une poussée doit toujours faire chercher une cause corrigible avant d’intensifier le traitement. Les causes principales sont la mauvaise adhésion au traitement d’entretien, une infection à <button class="w" data-k="k51-cdiff">Clostridioides difficile (toxine A et B)</button>, une réactivation du <button class="w" data-k="k51-cmv">cytomégalovirus (CMV) dans la muqueuse</button>, la prise d’<button class="w" data-k="k51-ains">anti-inflammatoires non stéroïdiens (AINS)</button> et une gastroentérite bactérienne. Le stress psychologique est associé aux symptômes, mais son rôle causal sur l’inflammation mesurée reste incertain.</p>
<div class="key"><b>À retenir.</b> L’antécédent familial et l’arrêt du tabac augmentent le risque, l’appendicectomie précoce le diminue, sans causalité démontrée. Devant une poussée, on cherche d’abord une rupture de traitement, une infection à Clostridioides difficile ou à CMV et la prise d’AINS. L’anamnèse permet de repérer ces éléments.</div>
</section>

<section class="ilot" id="k51-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse établit la chronicité, le caractère rectal des symptômes et l’absence de cause infectieuse ou médicamenteuse. Elle mesure aussi la sévérité, car le nombre de selles sanglantes et les réveils nocturnes guident la décision d’hospitaliser.</p>
<h3>5.1 Antécédents et contexte</h3>
<p>Le médecin demande les antécédents familiaux de maladie inflammatoire de l’intestin et de cancer colorectal, le statut tabagique et sa chronologie, une appendicectomie, les voyages récents, les antibiotiques des trois derniers mois, la prise d’AINS, les rapports sexuels anaux réceptifs et les vaccinations. Les antibiotiques orientent vers Clostridioides difficile. Les rapports anaux orientent vers une <button class="w" data-k="k51-ist">rectite infectieuse sexuellement transmissible</button>, qui imite une rectite ulcéreuse.</p>
<h3>5.2 Symptômes par fréquence</h3>
<table class="t"><tr><th>Symptôme</th><th>Fréquence approximative</th><th>Explication</th></tr>
<tr><td><button class="w" data-k="k51-rectorragie">Rectorragies (sang rouge mêlé aux selles)</button></td><td>Plus de 90 % des patients</td><td>Muqueuse fragile qui saigne au contact des selles</td></tr>
<tr><td>Diarrhée avec mucus et glaires</td><td>Fréquente, absente dans la rectite isolée</td><td>Défaut d’absorption et exsudation de la muqueuse lésée</td></tr>
<tr><td><button class="w" data-k="k51-tenesme">Ténesme, faux besoins, urgence</button></td><td>Fréquents, maximaux dans la rectite</td><td>Rectum inflammatoire moins compliant et hypersensible</td></tr>
<tr><td><button class="w" data-k="k51-nocturne">Selles nocturnes</button></td><td>Dans les poussées modérées et sévères</td><td>Inflammation organique ; argument contre un trouble fonctionnel</td></tr>
<tr><td>Douleur abdominale crampoïde soulagée par la selle</td><td>Fréquente et modérée</td><td>Contraction d’un côlon inflammatoire ; une douleur intense continue fait craindre une complication</td></tr>
<tr><td>Fièvre, amaigrissement, asthénie</td><td>Dans les formes étendues et sévères</td><td>Inflammation systémique ; critères de gravité</td></tr></table>
<p>Pour lire ce tableau, on retient que le sang mêlé aux selles est présent chez presque tous les patients. Les réveils nocturnes pour aller à selle signent une maladie organique : un syndrome de l’intestin irritable ne réveille pas. L’erreur fréquente consiste à attribuer des rectorragies répétées à des hémorroïdes sans rectoscopie, ce qui retarde le diagnostic de plusieurs mois.</p>
<h3>5.3 Formes typique et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Un adulte jeune a depuis plusieurs semaines une diarrhée glairo-sanglante avec ténesme et selles nocturnes. Les coprocultures sont négatives et la calprotectine est élevée.</p></div>
<div class="card"><h4>Rectite isolée avec constipation</h4><p>Le patient émet du sang et du mucus, mais il se plaint de constipation. La stase du côlon proximal accompagne fréquemment la rectite ; un laxatif osmotique peut améliorer les symptômes.</p></div>
<div class="card"><h4>Révélation par une manifestation extra-intestinale</h4><p>Une arthrite, un érythème noueux, une uvéite ou une cholestase révèlent parfois la maladie. La liste et leur évolution figurent dans la <button class="w" data-k="k51-mei">fenêtre des manifestations extra-intestinales</button>.</p></div>
<div class="card"><h4>Début après 60 ans</h4><p>Le tableau ressemble souvent à une colite ischémique, infectieuse ou médicamenteuse. Le patient âgé tolère mal la déshydratation et l’anémie, et les biopsies sont décisives.</p></div></div>
<div class="key"><b>À retenir.</b> Le médecin recherche une diarrhée sanglante depuis plus de quatre semaines, un syndrome rectal et des selles nocturnes. Il note le tabac, les antibiotiques, les AINS, les voyages et les rapports anaux, qui orientent vers des diagnostics différentiels. L’examen clinique mesure ensuite la gravité.</div>
</section>

<section class="ilot" id="k51-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique d’une rectocolite est souvent normal en dehors des poussées. Son rôle est de reconnaître la gravité, la déshydratation, l’anémie, une complication abdominale et une manifestation extra-intestinale. On examine du général au particulier.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Chez l’adulte sain, la fréquence cardiaque de repos se situe entre 60 et 100 par minute et la température sous 37,5 °C. Une <button class="w" data-k="k51-tachy">tachycardie supérieure à 90 par minute (signe de toxicité systémique)</button> ou une fièvre supérieure à 37,8 °C font partie des critères de Truelove et Witts. Une hypotension orthostatique traduit une hypovolémie liée aux pertes digestives et sanguines.</p></div>
<div class="card"><h4>Anthropométrie et nutrition</h4><p>Le poids et l’indice de masse corporelle se comparent au poids habituel. Une perte de plus de 5 % en un mois ou des œdèmes déclives évoquent une dénutrition et une hypoalbuminémie, qui aggravent le pronostic de la poussée.</p></div>
<div class="card"><h4>Abdomen</h4><p>Normalement, l’abdomen est souple et indolore. Une sensibilité diffuse modérée est fréquente. Une <button class="w" data-k="k51-megacolon">distension abdominale avec tympanisme (mégacôlon toxique)</button> ou une défense font craindre une dilatation ou une perforation ; les corticoïdes peuvent masquer la défense.</p></div>
<div class="card"><h4>Région anale et toucher rectal</h4><p>La marge anale est habituellement normale. Une fistule, un abcès ou une fissure atypique oriente vers une maladie de Crohn. Le toucher rectal ramène du sang et du mucus ; il est douloureux en cas de rectite intense.</p></div>
<div class="card"><h4>Peau, yeux et articulations</h4><p>On recherche un <button class="w" data-k="k51-mei">érythème noueux, un pyoderma gangrenosum, un œil rouge ou une arthrite</button>. Leur présence modifie le choix du traitement, car certains suivent l’activité intestinale et d’autres non.</p></div>
<div class="card"><h4>Pâleur et signes d’anémie</h4><p>Une pâleur des conjonctives, une dyspnée d’effort ou un souffle systolique fonctionnel traduisent une anémie. L’<button class="w" data-k="k51-anemie">anémie aggrave la tolérance de la poussée</button> par la baisse du transport de l’oxygène.</p></div></div>
<div class="trap"><span class="k">Piège</span>Sous corticoïdes à forte dose, une perforation colique peut se présenter sans défense ni fièvre, avec seulement une tachycardie et une douleur mal localisée. Toute aggravation abdominale d’une colite aiguë grave impose une radiographie ou une tomodensitométrie le jour même.</div>
<div class="key"><b>À retenir.</b> Les signes vitaux mesurent la gravité : fréquence cardiaque au-delà de 90 par minute et température au-delà de 37,8 °C entrent dans les critères de colite aiguë grave. La distension abdominale et la défense signalent une complication. L’examen de la peau, des yeux et des articulations repère les manifestations extra-intestinales. Le diagnostic se confirme ensuite par l’endoscopie et l’histologie.</div>
<button class="pareto-btn ui" data-k="pareto-k51-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button>
</section>

<section class="ilot" id="k51-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>Aucun examen isolé ne prouve la rectocolite. Le diagnostic repose sur l’association d’un tableau clinique compatible, de lésions endoscopiques typiques, d’une histologie de colite chronique et de l’exclusion des colites infectieuses, médicamenteuses et ischémiques. La recommandation diagnostique ECCO et ESGAR 2025 fixe cette démarche.</p>
<h3>7.1 Étapes</h3>
<p>La première étape écarte une infection : coprocultures pour les bactéries entéropathogènes, recherche de toxine de Clostridioides difficile et examen parasitologique selon les voyages. La deuxième étape mesure l’inflammation : hémogramme, protéine C-réactive, albumine, ferritine, fonction rénale et hépatique, et calprotectine fécale. La troisième étape est une <button class="w" data-k="k51-coloscopie">iléocoloscopie avec au moins deux biopsies par segment (examen de référence)</button>. En poussée sévère, une rectosigmoïdoscopie prudente sans préparation colique suffit, car la coloscopie complète augmente le risque de perforation.</p>
<p>L’<button class="w" data-k="k51-histo">histologie de colite chronique (distorsion des cryptes, plasmocytose basale)</button> confirme la chronicité. La plasmocytose basale est le signe le plus précoce et distingue une colite chronique d’une colite infectieuse aiguë, dans laquelle l’architecture des cryptes est conservée. Les anticorps anticytoplasme des neutrophiles de type périnucléaire (pANCA) sont positifs chez une majorité de patients, mais leur faible spécificité ne permet pas de poser le diagnostic.</p>

<p>Pour lire l’algorithme, on évalue d’abord la gravité, car une colite aiguë grave change le lieu de soins et l’urgence. Les selles se prélèvent avant tout traitement, mais on ne retarde pas des corticoïdes urgents en attendant les résultats. Madame L. a des coprocultures et une toxine de Clostridioides difficile négatives. La coloscopie montre une atteinte continue jusqu’à 45 cm avec un sous-score endoscopique de Mayo de 2, et les biopsies montrent une distorsion cryptique et une plasmocytose basale : le diagnostic de rectocolite gauche modérée est posé.</p>
<h3>7.2 Diagnostics différentiels hiérarchisés par gravité</h3>
<table class="t"><tr><th>Diagnostic</th><th>Argument discriminant</th><th>Examen qui tranche</th></tr>
<tr><td>Colite à Clostridioides difficile</td><td>Antibiotiques récents, hospitalisation, sujet âgé</td><td>Test de la glutamate déshydrogénase et toxine dans les selles</td></tr>
<tr><td>Colite bactérienne (Campylobacter, Salmonella, Shigella, Escherichia coli entérohémorragique)</td><td>Début brutal, fièvre, durée inférieure à quatre semaines</td><td>Coproculture ou PCR multiplex ; histologie sans distorsion cryptique</td></tr>
<tr><td>Colite ischémique</td><td>Sujet âgé, douleur brutale du flanc gauche puis rectorragie, rectum épargné</td><td>Coloscopie, tomodensitométrie ; voir K55 — Ischémie intestinale</td></tr>
<tr><td>Maladie de Crohn colique</td><td>Lésions segmentaires, rectum épargné, atteinte anale, iléite profonde</td><td>Iléocoloscopie, granulomes, entéro-IRM ; voir K50</td></tr>
<tr><td>Amibiase</td><td>Séjour en zone d’endémie ; corticoïdes dangereux</td><td>Microscopie des selles, PCR, sérologie</td></tr>
<tr><td>Rectite sexuellement transmissible</td><td>Rapports anaux réceptifs, douleur anale</td><td>PCR de Chlamydia trachomatis (lymphogranulomatose vénérienne), gonocoque, syphilis, herpès</td></tr>
<tr><td>Colite médicamenteuse ou d’immunothérapie</td><td>AINS, inhibiteurs de points de contrôle immunitaire</td><td>Chronologie ; voir K52</td></tr>
<tr><td>Cancer colorectal</td><td>Âge, anémie ferriprive, rectorragie sans diarrhée</td><td>Coloscopie et biopsie ; voir K63</td></tr></table>
<p>Pour lire ce tableau, on élimine en premier ce qui tue vite ou ce qu’un traitement immunosuppresseur aggraverait : Clostridioides difficile, amibiase et cytomégalovirus. L’erreur fréquente consiste à poser un diagnostic de rectocolite sur une seule coloscopie faite pendant une diarrhée aiguë, alors qu’une colite infectieuse peut reproduire les mêmes lésions macroscopiques. Une colite qui reste inclassable après biopsies se nomme colite indéterminée (K52.3).</p>
<div class="quiz ui"><p>Un homme de 34 ans a depuis trois semaines une diarrhée sanglante avec fièvre à 38,5 °C, apparue au retour d’un séjour de trois mois en Inde. La rectoscopie montre des ulcérations. Quelle est la première mesure ?</p><button data-ok="0">Prednisone 40 mg par jour, puisque la rectoscopie montre une colite</button><button data-ok="1">Rechercher une amibiase et une infection bactérienne dans les selles avant tout corticoïde</button><button data-ok="0">Mésalazine orale et contrôle dans trois mois</button><p class="fb" hidden>Un séjour en zone d’endémie impose d’exclure une amibiase, car les corticoïdes peuvent provoquer une colite amibienne fulminante et une perforation. La durée inférieure à quatre semaines et la fièvre orientent aussi vers une cause infectieuse. Le diagnostic de rectocolite exige l’exclusion de ces causes et une histologie de chronicité.</p></div>
<button class="pareto-btn ui" data-k="pareto-k51-diag">▲ Loi de Pareto — Démarche diagnostique</button>
<div class="key"><b>À retenir.</b> Le diagnostic associe clinique, endoscopie continue depuis le rectum, histologie de chronicité et exclusion des infections. L’iléocoloscopie avec biopsies étagées est l’examen de référence, mais une rectosigmoïdoscopie sans préparation suffit en poussée sévère. L’étape suivante consiste à reconnaître et traiter la colite aiguë grave.</div>
</section>
