<section class="ilot" id="k80-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 52 ans se présente aux urgences un dimanche soir. Elle souffre depuis 30 heures d’une douleur de l’hypochondre droit, apparue après un repas de fête. Elle a eu trois crises plus brèves pendant l’année, chacune calmée en deux heures. Sa température atteint 38,4 °C. Son indice de masse corporelle vaut 31 kg/m². Les leucocytes sont à 14 G/L, la CRP à 120 mg/L, la bilirubine totale à 28 µmol/L et les phosphatases alcalines à 180 U/L.</p>
<p>La question qui structure ce cours est la suivante : <b>cette patiente a-t-elle une colique biliaire, une cholécystite aiguë ou un calcul de la voie biliaire principale, quelle est la gravité de son tableau, et dans quel ordre faut-il drainer, opérer et extraire ?</b></p>
<p>À la fin du cours, le médecin assistant sait distinguer les cinq syndromes de la lithiase biliaire selon le site de l’obstacle. Il pose le diagnostic de cholécystite avec les critères de Tokyo 2018 et en gradue la gravité. Il estime la probabilité d’un calcul cholédocien selon la stratification de l’ESGE 2019. Il connaît l’indication et le délai de la cholécystectomie, de la CPRE et du drainage. Il sait enfin quand une maladie de la vésicule sans calcul (K81, K82) impose une chirurgie.</p>
<div class="key"><b>Message fondateur.</b> Un calcul n’est dangereux que lorsqu’il bouche un conduit. Le même calcul donne une colique s’il bloque le canal cystique quelques heures, une cholécystite s’il le bloque durablement, un ictère s’il migre dans le cholédoque, une cholangite si la bile retenue s’infecte, et une pancréatite s’il obstrue l’ampoule. Le site de l’obstacle prédit donc la clinique, la biologie et le traitement. La <button class="w" data-k="k80-fig-sites">figure des sites d’obstruction (cinq syndromes)</button> sert de fil conducteur à tout le cours.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="k80-calot">anatomie du triangle de Calot (repères de la cholécystectomie)</button>, la <button class="w" data-k="k80-micelle">solubilisation du cholestérol dans la bile (micelles mixtes)</button> et le <button class="w" data-k="k80-enterohep">cycle entéro-hépatique des acides biliaires</button>. L’onglet Sciences fondamentales les développe.</div>
</section>

<section class="ilot" id="k80-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <b>lithiase biliaire</b> (cholélithiase) désigne la présence de calculs dans la vésicule ou dans les voies biliaires. La <b>cholécystolithiase</b> concerne la vésicule. La <b>cholédocholithiase</b> concerne la voie biliaire principale, c’est-à-dire le canal hépatique commun et le cholédoque. Un calcul vésiculaire peut rester muet toute la vie : sa seule présence n’est pas une maladie à traiter.</p>
<h3>1.1 Les cinq syndromes de la lithiase</h3>
<p>Le clinicien classe chaque patient selon le site et la durée de l’obstruction, car ces deux paramètres déterminent la conduite. Le tableau suivant répond à la question : quel syndrome correspond à quel obstacle, et quel signe le trahit ?</p>
<table class="t"><tr><th>Syndrome</th><th>Obstacle</th><th>Signe distinctif</th><th>Code CIM-10-GM</th></tr>
<tr><td><button class="w" data-k="k80-colique">Colique biliaire</button></td><td>Calcul bloqué de façon transitoire dans le collet ou le canal cystique</td><td>La douleur cède en moins de six heures, sans fièvre ni syndrome inflammatoire.</td><td>K80.2</td></tr>
<tr><td>Cholécystite aiguë lithiasique</td><td>Obstruction prolongée du canal cystique</td><td>La douleur dure plus de six heures, avec fièvre et <button class="w" data-k="k80-murphy">signe de Murphy</button>.</td><td>K80.0</td></tr>
<tr><td>Cholédocholithiase</td><td>Calcul dans la voie biliaire principale</td><td>La cholestase biologique s’associe à une dilatation des voies biliaires.</td><td>K80.5</td></tr>
<tr><td>Cholangite (angiocholite) lithiasique</td><td>Calcul cholédocien et bile infectée</td><td>La fièvre et l’ictère accompagnent la douleur ; le sepsis peut suivre.</td><td>K80.3</td></tr>
<tr><td>Pancréatite aiguë biliaire</td><td>Calcul migré dans l’ampoule de Vater</td><td>La lipase dépasse trois fois la limite supérieure de la normale.</td><td>K85.1</td></tr></table>
<p>La lecture commence par la durée de la douleur et par la fièvre. Une douleur de 30 heures avec 38,4 °C, comme chez la patiente de l’îlot 0, exclut une colique simple. La bilirubine à 28 µmol/L oblige ensuite à envisager un calcul cholédocien associé. L’erreur fréquente consiste à appeler « colique » toute douleur biliaire, puis à renvoyer à domicile une cholécystite débutante.</p>
<h3>1.2 Codage CIM-10-GM 2024 des catégories K80 à K82</h3>
<p>La catégorie K80 code la lithiase selon le site du calcul et l’inflammation associée. Un cinquième caractère précise l’obstruction des voies biliaires : 0 signifie sans obstruction, 1 avec obstruction. La catégorie K81 code les cholécystites <b>sans</b> calcul. La catégorie K82 regroupe les autres maladies de la vésicule.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Situation clinique typique</th></tr>
<tr><td>K80.0</td><td>Calcul de la vésicule avec cholécystite aiguë</td><td>Forme la plus fréquente de cholécystite.</td></tr>
<tr><td>K80.1</td><td>Calcul de la vésicule avec une autre forme de cholécystite</td><td>Cholécystite chronique lithiasique, vésicule scléro-atrophique.</td></tr>
<tr><td>K80.2</td><td>Calcul de la vésicule sans cholécystite</td><td>Lithiase asymptomatique ou colique biliaire.</td></tr>
<tr><td>K80.3</td><td>Calcul des canaux biliaires avec angiocholite</td><td>Cholangite lithiasique, traitée dans <a href="#/entry/K83">K83 — Cholangites et autres maladies des voies biliaires (G-04-Gastroentérologie et hépatologie)</a>.</td></tr>
<tr><td>K80.4</td><td>Calcul des canaux biliaires avec cholécystite</td><td>Cholécystite associée à une cholédocholithiase.</td></tr>
<tr><td>K80.5</td><td>Calcul des canaux biliaires sans angiocholite ni cholécystite</td><td>Cholédocholithiase isolée, lithiase intrahépatique.</td></tr>
<tr><td>K80.8</td><td>Autres cholélithiases</td><td>Formes non classées ailleurs.</td></tr>
<tr><td>K81.0 · K81.1 · K81.8 · K81.9</td><td>Cholécystite aiguë, chronique, autre, sans précision (sans calcul)</td><td><button class="w" data-k="k80-alith">Cholécystite alithiasique</button> du patient de réanimation.</td></tr>
<tr><td>K82.0 à K82.9</td><td>Occlusion, hydrocholécyste, perforation, fistule, cholestérolose, autres maladies, sans précision</td><td>Détaillés à l’îlot 11.</td></tr></table>
<p>Le codage suit la situation la plus complète. Une patiente qui a une cholécystite et un calcul cholédocien reçoit K80.4, et non deux codes K80.0 et K80.5. Le syndrome post-cholécystectomie (K91.5) et la vésicule exclue en imagerie (R93.2) sont exclus de K82 par la classification.</p>
<h3>1.3 Classification des calculs</h3>
<p>La composition du calcul révèle son mécanisme, donc sa prévention. Les <b>calculs de cholestérol</b>, purs ou mixtes, forment la grande majorité des calculs en Europe ; ils naissent d’une bile sursaturée en cholestérol. Les <button class="w" data-k="k80-pigment">calculs pigmentaires noirs et bruns</button> naissent d’un excès de bilirubine non conjuguée ou d’une infection biliaire. Le <button class="w" data-k="k80-sludge">sludge (boue biliaire)</button> est une suspension de microcristaux qui précède souvent le calcul.</p>
<div class="key"><b>À retenir.</b> Le diagnostic se formule en trois termes : le site du calcul, l’existence d’une inflammation et celle d’une infection. Cette formule donne directement le code de la CIM-10-GM et la conduite. La partie suivante quantifie le risque qu’un calcul muet devienne symptomatique.</div>
</section>

<section class="ilot" id="k80-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>Selon les recommandations de l’EASL 2016, 10 à 20 % des adultes des pays occidentaux portent des calculs vésiculaires. La fréquence augmente avec l’âge et elle est plus élevée chez la femme. Environ 80 % des porteurs restent asymptomatiques. L’Allemagne, dont la population et les habitudes ressemblent à celles de la Suisse, réalise plus de 175 000 cholécystectomies par an pour lithiase, selon le rapport de la recommandation allemande de la DGVS et de la DGAV publié en 2018.</p>
<p>Les données suisses récentes manquent. L’Enquête suisse sur la santé de 1992-1993, analysée en 1996 pour le canton du Tessin, estimait à 3,2 % la proportion de personnes déjà cholécystectomisées. Aucune statistique fédérale publiée sur la prévalence actuelle des calculs n’a été identifiée au 08.10.2026 ; la Statistique médicale des hôpitaux de l’Office fédéral de la statistique enregistre les interventions, mais elle ne mesure pas les porteurs asymptomatiques.</p>
<h3>2.1 Histoire naturelle d’un calcul muet</h3>
<p>Le risque évolutif dépend du premier épisode douloureux. Le tableau répond à la question : faut-il opérer un calcul découvert par hasard ?</p>
<table class="t"><tr><th>Situation</th><th>Risque annuel (EASL 2016)</th><th>Conséquence pratique</th></tr>
<tr><td>Calcul asymptomatique</td><td>Des symptômes apparaissent chez 1 à 4 % des porteurs par an ; 20 % deviennent symptomatiques en 20 ans.</td><td>L’abstention est la règle, car le risque opératoire dépasse le bénéfice.</td></tr>
<tr><td>Complications chez un porteur asymptomatique</td><td>Une complication survient chez 0,1 à 0,3 % des porteurs par an.</td><td>La surveillance échographique n’est pas utile.</td></tr>
<tr><td>Après une première colique</td><td>Une complication survient chez 1 à 3 % des patients par an.</td><td>La cholécystectomie devient indiquée, car le risque cumulé augmente.</td></tr></table>
<p>La lecture se fait ligne par ligne. Un homme de 60 ans porteur d’un calcul de 12 mm découvert lors d’une échographie rénale a un risque annuel de complication d’environ 0,1 à 0,3 % ; il n’est pas opéré. La même personne, après une première colique, voit ce risque multiplié par dix environ : elle est adressée au chirurgien.</p>
<div class="trap"><span class="k">Piège</span>La dyspepsie, les ballonnements et l’intolérance aux graisses ne sont pas des symptômes biliaires. L’EASL 2016 rapporte que seuls la colique, la douleur irradiée et la prise d’antalgiques sont associés à la présence de calculs. Opérer un patient pour des ballonnements laisse ses symptômes intacts après l’intervention.</div>
<div class="key"><b>À retenir.</b> Un calcul sur cinq devient symptomatique en vingt ans. La première colique change le pronostic et justifie la chirurgie. Les mécanismes de formation du calcul expliquent ensuite pourquoi certaines personnes en fabriquent.</div>
</section>

<section class="ilot" id="k80-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se déroule en deux temps : la formation du calcul, puis l’obstruction d’un conduit. Le premier temps explique les facteurs de risque. Le second explique les symptômes et les urgences.</p>
<h3>3.1 État normal</h3>
<p>Le foie sécrète chaque jour de l’ordre de 600 à 1000 mL de bile. Cette bile contient des acides biliaires, des phospholipides, surtout la phosphatidylcholine, du cholestérol et de la bilirubine conjuguée. Le cholestérol, insoluble dans l’eau, reste dissous dans des <button class="w" data-k="k80-micelle">micelles mixtes</button> formées avec les acides biliaires et les phospholipides. Entre les repas, la vésicule stocke et concentre la bile. Après un repas gras, la <button class="w" data-k="k80-cck">cholécystokinine (hormone de la contraction vésiculaire)</button> contracte la vésicule et relâche le sphincter d’Oddi.</p>
<h3>3.2 Première charnière : sursaturation en cholestérol</h3>
<p>Un calcul de cholestérol naît lorsque la bile contient plus de cholestérol que les micelles ne peuvent en dissoudre. Trois causes y conduisent. Le foie sécrète trop de cholestérol, par exemple dans l’obésité ou sous œstrogènes. Il sécrète trop peu d’acides biliaires, par exemple après une résection iléale. Il sécrète trop peu de phospholipides, comme dans le <button class="w" data-k="k80-lpac">syndrome LPAC (mutation du gène ABCB4)</button>.</p>
<h3>3.3 Deuxième charnière : nucléation et stase</h3>
<p>La sursaturation ne suffit pas. Des cristaux de cholestérol monohydraté doivent se former, puis s’agréger. La mucine sécrétée par la paroi vésiculaire favorise cette nucléation. Une vésicule qui se vide mal garde les cristaux assez longtemps pour qu’ils grossissent. C’est pourquoi le jeûne prolongé, la nutrition parentérale, la grossesse et les analogues de la somatostatine favorisent le sludge et les calculs.</p>
<h3>3.4 Troisième charnière : obstruction du canal cystique</h3>
<p>Lors d’une contraction vésiculaire, un calcul s’engage dans le collet ou le canal cystique. La pression intravésiculaire monte et distend la paroi, ce qui provoque une douleur viscérale. Si le calcul retombe dans la vésicule en quelques heures, la douleur cède : c’est la <button class="w" data-k="k80-colique">colique biliaire</button>. Si l’obstruction persiste, la paroi souffre.</p>
<h3>3.5 Quatrième charnière : inflammation, ischémie et infection</h3>
<p>La bile retenue lèse la muqueuse. La phospholipase A2 libérée transforme la lécithine en lysolécithine, toxique pour l’épithélium. Les prostaglandines entretiennent l’inflammation. La distension comprime ensuite les vaisseaux de la paroi : l’ischémie mène à la gangrène, puis à la perforation. L’infection bactérienne est souvent secondaire : selon les Tokyo Guidelines 2018 (TG18), les cultures de bile sont positives dans 28 à 93 % des cholécystites selon les séries.</p>
<h3>3.6 Cinquième charnière : migration dans la voie biliaire principale</h3>
<p>Un petit calcul peut franchir le canal cystique et tomber dans le cholédoque. Il bloque l’écoulement de la bile : la pression biliaire monte, la bilirubine conjuguée reflue dans le sang et l’ictère apparaît. Une bile stagnante s’infecte par voie ascendante depuis le duodénum ; la pression élevée fait passer les bactéries dans le sang, ce qui explique la gravité de la <a href="#/entry/K83">cholangite (K83 — Cholangites et autres maladies des voies biliaires)</a>. Un calcul enclavé dans l’ampoule gêne aussi l’écoulement du suc pancréatique et peut déclencher une <a href="#/entry/K85">pancréatite (K85 — Pancréatite aiguë)</a>.</p>

<p>La figure se lit de gauche à droite. Chaque case correspond à une cible thérapeutique : la perte de poids progressive et l’acide ursodésoxycholique agissent sur la sursaturation, la cholécystectomie supprime le réservoir où naissent les calculs, et l’extraction endoscopique supprime l’obstacle cholédocien.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> La douleur de la colique vient de la distension, d’où son caractère continu malgré son nom. La fièvre et l’hyperleucocytose de la cholécystite viennent de l’inflammation de la paroi. L’ictère traduit l’obstacle cholédocien, et non la cholécystite : un ictère franc au cours d’une cholécystite impose de chercher un calcul de la voie biliaire principale ou un <button class="w" data-k="k80-mirizzi">syndrome de Mirizzi</button>.</div>
</section>

<section class="ilot" id="k80-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Les facteurs de risque agissent sur l’une des trois étapes : sécrétion de cholestérol, solvants biliaires ou vidange vésiculaire. Les connaître permet de prévenir les calculs dans les situations à haut risque. Le <button class="w" data-k="k80-mnemo">moyen mnémotechnique des « cinq F »</button> résume une partie de ces facteurs, avec ses limites.</p>
<h3>4.1 Calculs de cholestérol</h3>
<table class="t"><tr><th>Facteur</th><th>Mécanisme</th><th>Conséquence pratique</th></tr>
<tr><td>Sexe féminin, grossesse, œstrogènes</td><td>Les œstrogènes augmentent la sécrétion biliaire de cholestérol ; la progestérone ralentit la vidange vésiculaire.</td><td>La grossesse favorise le sludge ; il régresse souvent après l’accouchement.</td></tr>
<tr><td>Âge</td><td>La sécrétion de cholestérol augmente et la synthèse d’acides biliaires diminue avec l’âge.</td><td>La prévalence croît après 40 ans.</td></tr>
<tr><td>Obésité, syndrome métabolique</td><td>L’insulinorésistance augmente la synthèse et la sécrétion de cholestérol.</td><td>L’EASL 2016 recommande une alimentation saine, l’activité physique et un poids stable.</td></tr>
<tr><td>Perte de poids rapide, chirurgie bariatrique</td><td>Le cholestérol mobilisé du tissu adipeux sature la bile, et le jeûne réduit la vidange.</td><td>L’acide ursodésoxycholique préventif est discuté à l’îlot 12.</td></tr>
<tr><td>Jeûne, nutrition parentérale</td><td>L’absence de repas supprime la contraction vésiculaire.</td><td>Le sludge apparaît en quelques semaines.</td></tr>
<tr><td>Analogues de la somatostatine</td><td>Ils inhibent la cholécystokinine et la vidange vésiculaire.</td><td>L’acide ursodésoxycholique peut être envisagé (EASL 2016).</td></tr>
<tr><td>Prédisposition génétique</td><td>Les études de jumeaux attribuent 25 % du risque aux gènes ; le variant D19H du transporteur ABCG8 double environ le risque.</td><td>Les antécédents familiaux au premier degré comptent.</td></tr>
<tr><td>Mutation ABCB4</td><td>Le défaut de phosphatidylcholine biliaire rend la bile lithogène.</td><td><button class="w" data-k="k80-lpac">Syndrome LPAC</button> du sujet jeune.</td></tr></table>
<p>La lecture se fait par question : la patiente a-t-elle un facteur modifiable ? La patiente de l’îlot 0 cumule le sexe féminin, l’âge et l’obésité ; seule l’obésité est modifiable, et sa correction doit être progressive.</p>
<h3>4.2 Calculs pigmentaires et causes médicamenteuses</h3>
<p>Une hémolyse chronique, une cirrhose ou une maladie de Crohn de l’iléon terminal augmentent la bilirubine non conjuguée biliaire : des <button class="w" data-k="k80-pigment">calculs pigmentaires noirs</button> se forment. Une infection biliaire chronique produit des calculs bruns dans les voies biliaires. La ceftriaxone forme avec le calcium un précipité vésiculaire, la <button class="w" data-k="k80-ceftri">pseudolithiase à la ceftriaxone</button>, réversible à l’arrêt.</p>
<h3>4.3 Cholécystite sans calcul</h3>
<p>La <button class="w" data-k="k80-alith">cholécystite alithiasique</button> (K81) survient surtout chez le patient de réanimation : sepsis, polytraumatisme, brûlures étendues, nutrition parentérale, ventilation mécanique. La stase et l’ischémie de la paroi en sont les deux mécanismes. Son diagnostic est difficile, car le patient sédaté ne localise pas sa douleur.</p>
<div class="key"><b>À retenir.</b> Les calculs de cholestérol viennent d’une bile sursaturée et d’une vésicule paresseuse. Les calculs pigmentaires signalent une hémolyse, une cirrhose ou une infection. La cholécystite sans calcul est une maladie du patient grave. Ces terrains orientent l’anamnèse qui suit.</div>

</section>

<section class="ilot" id="k80-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse identifie la douleur biliaire, mesure sa durée et cherche les signes d’une complication. Elle recherche aussi les arguments contre une cause biliaire, car la lithiase est fréquente et peut coexister avec une autre maladie.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Personnels</h4><p>Le médecin demande les crises douloureuses antérieures et leur durée, une <button class="w" data-k="k80-pancbil">pancréatite ou un ictère antérieurs</button>, une chirurgie bariatrique ou une perte de poids récente, une grossesse, une hémolyse connue, une cirrhose et une maladie de Crohn. Il recherche un diabète, car il masque la douleur et expose à la <button class="w" data-k="k80-emphys">cholécystite emphysémateuse</button>.</p></div>
<div class="card"><h4>Médicaments et famille</h4><p>Il note les œstrogènes, les fibrates, les analogues de la somatostatine et un traitement récent par ceftriaxone. Il demande les anticoagulants et les antiagrégants, qui modifient le moment de la chirurgie et de la sphinctérotomie. Il recherche des calculs chez les parents au premier degré, surtout avant 40 ans, ce qui évoque un <button class="w" data-k="k80-lpac">syndrome LPAC</button>.</p></div></div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p><b>Douleur biliaire</b> — L’EASL 2016 la définit comme une douleur intense de l’hypochondre droit ou de l’épigastre, durant au moins 15 à 30 minutes. Elle irradie vers le dos ou l’épaule droite et répond aux antalgiques. Elle est continue, malgré le nom de colique. Elle survient souvent la nuit ou après un repas copieux. Voir la <button class="w" data-k="k80-colique">fiche de la colique biliaire</button>.</p>
<p><b>Nausées et vomissements</b> — Ils accompagnent fréquemment la douleur. Isolés, ils n’orientent pas vers les voies biliaires.</p>
<p><b>Fièvre et frissons</b> — Une fièvre fait passer de la colique à la cholécystite. Des frissons avec ictère évoquent une cholangite, donc une bactériémie.</p>
<p><b>Ictère, urines foncées, selles décolorées</b> — Ces signes traduisent un obstacle de la voie biliaire principale. Le patient les remarque souvent avant l’ictère cutané.</p>
<div class="key"><b>Profil qui oriente vers une cause biliaire.</b> La douleur est épigastrique ou de l’hypochondre droit, intense, continue pendant plus de 15 à 30 minutes, irradiée vers l’épaule droite, et calmée par un antalgique.<br><b>Profil qui oriente ailleurs.</b> La douleur dure quelques secondes, varie avec les mouvements ou la respiration, ou s’accompagne seulement de ballonnements. La <a href="#/entry/R10">démarche devant une douleur abdominale (R10 — Douleur abdominale)</a> s’applique alors.</div>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Femme de 45 ans en surpoids. Une douleur épigastrique réveille la patiente à 2 heures du matin, irradie dans l’omoplate droite et cède en trois heures. Elle a eu deux crises semblables en six mois.</p></div>
<div class="card"><h4>Sujet âgé</h4><p>La douleur est modérée et la fièvre manque souvent. Une confusion ou une chute révèle parfois une cholécystite gangréneuse. L’absence de fièvre ne doit pas rassurer.</p></div>
<div class="card"><h4>Patient diabétique</h4><p>La neuropathie émousse la douleur. L’infection progresse plus vite, et l’air dans la paroi signe une forme emphysémateuse à opérer en urgence.</p></div>
<div class="card"><h4>Femme enceinte</h4><p>La douleur peut être déplacée vers le haut par l’utérus. Le diagnostic différentiel inclut le <button class="w" data-k="k80-difdiag">syndrome HELLP</button> et la stéatose aiguë gravidique.</p></div>
<div class="card"><h4>Patient de réanimation</h4><p>Une fièvre inexpliquée ou une cholestase chez un patient ventilé évoque une cholécystite alithiasique. L’échographie au lit est alors indispensable.</p></div>
<div class="card"><h4>Occlusion du grêle chez une femme âgée</h4><p>Des vomissements et une distension sans hernie ni chirurgie antérieure évoquent un <button class="w" data-k="k80-ileus">iléus biliaire</button> par fistule cholécysto-digestive.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer une douleur épigastrique à une colique biliaire chez un homme de 60 ans diabétique sans faire d’électrocardiogramme. Un infarctus inférieur peut donner une douleur épigastrique avec nausées. L’électrocardiogramme et la troponine précèdent l’étiquette biliaire chez tout patient à risque cardiovasculaire.</div>
<div class="key"><b>À retenir.</b> La durée de la douleur sépare la colique (moins de six heures) de la cholécystite. La fièvre, les frissons et l’ictère signalent la complication. L’examen clinique cherche ensuite la confirmation locale et la gravité générale.</div>
</section>

<section class="ilot" id="k80-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>Pendant une colique non compliquée, l’examen est souvent normal entre deux crises. En cas de cholécystite, l’examen localise l’inflammation et mesure son retentissement. Le médecin examine d’abord l’état général et les signes vitaux, car ils décident de l’urgence.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin note la température, la fréquence cardiaque, la pression artérielle, la fréquence respiratoire et la SpO₂. Une hypotension, une confusion ou une oligurie définissent une défaillance d’organe, donc une cholécystite de grade III selon les <button class="w" data-k="k80-tg18-grav">critères de gravité TG18</button>. Il calcule l’indice de masse corporelle et apprécie la fragilité, qui pèsent sur la décision opératoire.</p></div>
<div class="card"><h4>Abdomen normal</h4><p>Chez le sujet sain, la palpation profonde de l’hypochondre droit sous le rebord costal est indolore. L’inspiration profonde abaisse le foie et la vésicule sans déclencher de douleur. Le bord inférieur du foie est mousse et indolore.</p></div>
<div class="card"><h4>Signes de la cholécystite</h4><p>La sensibilité de l’hypochondre droit est le signe le plus constant. Le <button class="w" data-k="k80-murphy">signe de Murphy (arrêt de l’inspiration à la palpation)</button> est plus spécifique. Une masse douloureuse palpable traduit un plastron inflammatoire ou un hydrocholécyste ; elle classe la cholécystite en grade II. Une défense généralisée évoque une perforation.</p></div>
<div class="card"><h4>Signes de l’obstacle biliaire</h4><p>L’ictère se voit d’abord aux sclères, au-delà d’environ 40 à 50 µmol/L de bilirubine. Une grosse vésicule palpable et indolore chez un patient ictérique évoque un cancer du pancréas plutôt qu’une lithiase : c’est la <button class="w" data-k="k80-courvoisier">loi de Courvoisier-Terrier</button>.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un signe de Murphy négatif n’exclut pas une cholécystite. Selon la revue systématique de Trowbridge (2003), aucun signe isolé ne suffit à affirmer ou exclure le diagnostic. Le signe de Murphy est aussi souvent absent chez le sujet âgé. L’échographie reste donc indispensable dès que l’anamnèse est évocatrice.</div>
<div class="key"><b>À retenir.</b> L’examen sert d’abord à repérer une défaillance d’organe, ensuite à localiser l’inflammation. La fièvre, le signe de Murphy et une masse orientent ; aucun ne prouve. La démarche diagnostique combine donc clinique, biologie et imagerie.</div>
</section>

<section class="ilot" id="k80-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche répond successivement à quatre questions. Y a-t-il une cholécystite ? Quelle est sa gravité ? Un calcul occupe-t-il la voie biliaire principale ? Une cholangite ou une pancréatite complique-t-elle le tableau ? Chaque question a son outil validé.</p>
<h3>7.1 Bilan initial</h3>
<p>Devant une douleur biliaire, le médecin demande une formule sanguine, la CRP, la bilirubine totale et conjuguée, les ALAT, ASAT, PAL et GGT, la lipase, la créatinine et un électrocardiogramme si le risque cardiaque existe. Il demande ensuite une <button class="w" data-k="k80-echo">échographie abdominale</button>, examen d’imagerie de première intention selon l’EASL 2016 et l’ESGE 2019. Les <button class="w" data-k="k80-bilan-hep">tests hépatiques</button> servent surtout à estimer le risque de calcul cholédocien. Les hémocultures sont prélevées en cas de fièvre élevée, de frissons ou de signe de gravité.</p>
<h3>7.2 Diagnostic de la cholécystite aiguë</h3>
<p>Les <button class="w" data-k="k80-tg18-diag">critères diagnostiques TG18</button> combinent trois groupes : des signes locaux (A), des signes systémiques (B) et l’imagerie (C). Le diagnostic est suspecté avec un signe A et un signe B. Il est certain si l’imagerie montre en plus des signes caractéristiques. Ces critères, repris sans modification des TG13, ont été validés par de nombreuses études selon les TG18.</p>
<h3>7.3 Gravité de la cholécystite</h3>
<p>Les <button class="w" data-k="k80-tg18-grav">grades TG18</button> classent la cholécystite en légère (grade I), modérée (grade II) ou sévère (grade III). Le grade III exige une défaillance d’organe. Le grade II correspond à une inflammation locale marquée, qui rend la cholécystectomie plus difficile. La patiente de l’îlot 0 souffre depuis 30 heures, a 14 G/L de leucocytes et aucun signe de défaillance : elle est en grade I, sauf si l’échographie montre une gangrène ou un abcès.</p>
<h3>7.4 Probabilité d’un calcul de la voie biliaire principale</h3>
<p>L’ESGE 2019 classe la probabilité d’un calcul cholédocien en trois niveaux, à partir des tests hépatiques et de l’échographie : c’est la <button class="w" data-k="k80-esge-strat">stratification ESGE 2019</button>. Une probabilité élevée conduit directement à la CPRE. Une probabilité intermédiaire conduit d’abord à une <button class="w" data-k="k80-echoendo">échoendoscopie</button> ou à une <button class="w" data-k="k80-cholangioirm">cholangio-IRM</button>. Une probabilité faible permet la cholécystectomie sans autre examen.</p>

<h3>7.5 Diagnostics différentiels, du plus grave au moins grave</h3>
<p>Le <button class="w" data-k="k80-difdiag">diagnostic différentiel de la douleur de l’hypochondre droit</button> commence par les urgences vitales. Le syndrome coronarien aigu inférieur se reconnaît à l’électrocardiogramme et à la troponine. L’ulcère perforé donne un pneumopéritoine. La pancréatite aiguë élève la lipase au-delà de trois fois la normale. Viennent ensuite l’appendicite sous-hépatique, la pyélonéphrite droite, l’abcès hépatique, l’hépatite aiguë, la pneumonie de la base droite, la périhépatite gonococcique ou à chlamydia et le syndrome HELLP chez la femme enceinte.</p>
<div class="quiz ui"><p>Une femme de 39 ans a une douleur de l’hypochondre droit depuis 20 heures, une température de 38,2 °C, un signe de Murphy positif et une CRP à 85 mg/L. L’échographie montre une paroi vésiculaire de 5 mm et un calcul enclavé dans le collet. Quelle conclusion selon TG18 ?</p><button data-ok="1">Cholécystite aiguë certaine : un signe local, un signe systémique et une imagerie caractéristique</button><button data-ok="0">Cholécystite suspectée seulement, car les leucocytes manquent</button><button data-ok="0">Colique biliaire, car la douleur dure moins de 24 heures</button><p class="fb" hidden>Le signe de Murphy (A), la fièvre et la CRP élevée (B) et l’imagerie (C) sont réunis. Un seul signe de chaque groupe suffit ; les leucocytes ne sont pas obligatoires. Une douleur de 20 heures dépasse largement la durée d’une colique.</p></div>
<div class="key"><b>À retenir.</b> La cholécystite se prouve par TG18 et se gradue par TG18. Le calcul cholédocien se cherche selon la probabilité ESGE 2019. La cholangite et la pancréatite se reconnaissent d’emblée, car elles imposent leur propre urgence, présentée dans l’îlot suivant.</div>
</section>
