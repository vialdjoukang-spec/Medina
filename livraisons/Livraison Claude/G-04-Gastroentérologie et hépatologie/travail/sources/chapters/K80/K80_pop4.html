
<!-- ===== FENÊTRES K80 : monographies et Pareto ===== -->
<template data-pop="k80-d-ains" data-title="Anti-inflammatoires non stéroïdiens dans la colique biliaire">
<div class="lab">Mécanisme</div><p>Ils inhibent les cyclo-oxygénases et la synthèse des prostaglandines. Dans la vésicule obstruée, les prostaglandines sensibilisent les nocicepteurs, augmentent la sécrétion de liquide dans la lumière et entretiennent l’inflammation. Leur blocage réduit la douleur et la distension.</p>
<div class="lab">Preuves</div><p>L’EASL 2016 cite des essais randomisés où les anti-inflammatoires soulagent mieux que les antispasmodiques et réduisent l’évolution vers la cholécystite (recommandation faible, preuve modérée).</p>
<div class="lab">Posologie</div><p>Diclofénac 75 mg par voie intramusculaire profonde, une fois ; une seconde injection quelques heures plus tard reste exceptionnelle. La dose totale ne dépasse pas 150 mg par jour toutes formes confondues (information professionnelle européenne de Voltaren injectable, 2022 ; exemple de dose cité par l’EASL 2016).</p>
<div class="lab">Contre-indications</div><p>Insuffisance rénale, hypovolémie, ulcère gastroduodénal évolutif, hémorragie digestive, allergie aux anti-inflammatoires, insuffisance cardiaque sévère, troisième trimestre de la grossesse.</p>
<div class="lab">Surveillance</div><p>Créatinine et diurèse chez le patient fébrile, vomissant ou âgé.</p></template>

<template data-pop="k80-d-diclo-rect" data-title="Anti-inflammatoire rectal avant CPRE">
<div class="lab">Recommandation</div><p>L’ESGE 2020 recommande 100 mg de diclofénac ou d’indométacine par voie rectale immédiatement avant la CPRE, chez tout patient sans contre-indication (recommandation forte, preuve modérée).</p>
<div class="lab">Mécanisme</div><p>La pancréatite après CPRE résulte d’un traumatisme de la papille et d’une activation inflammatoire précoce. L’anti-inflammatoire bloque la cascade des prostaglandines et l’activation des polynucléaires au moment du traumatisme.</p>
<div class="lab">Limites</div><p>Les contre-indications des anti-inflammatoires s’appliquent. Chez un patient à très haut risque de pancréatite, l’endoscopiste ajoute une prothèse pancréatique selon l’ESGE 2020.</p></template>

<template data-pop="k80-d-busco" data-title="Butylscopolamine">
<div class="lab">Mécanisme</div><p>C’est un antagoniste des récepteurs muscariniques, à ammonium quaternaire, qui ne passe pas la barrière hémato-encéphalique. Il relâche le muscle lisse digestif et biliaire.</p>
<div class="lab">Posologie suisse</div><p>Buscopan inject 20 mg/mL : 20 à 40 mg par voie sous-cutanée, intramusculaire ou intraveineuse lente, plusieurs fois par jour, au plus 100 mg par jour (compendium.ch, consulté le 08.10.2026).</p>
<div class="lab">Contre-indications</div><p>Glaucome à angle fermé non traité, hypertrophie prostatique avec résidu, sténose digestive, iléus paralytique ou obstructif, tachycardie, mégacôlon, myasthénie ; la monographie cite aussi la grossesse, sauf pendant l’accouchement, et l’allaitement.</p>
<div class="lab">Place</div><p>Son efficacité est inférieure à celle des anti-inflammatoires selon l’EASL 2016 ; il sert de complément.</p></template>

<template data-pop="k80-d-metam" data-title="Métamizole">
<div class="lab">Mécanisme</div><p>Le métamizole est un antalgique et antipyrétique non opioïde de la famille des pyrazolones. Son mécanisme exact reste incomplètement élucidé ; il inhibe la synthèse centrale des prostaglandines et a un effet spasmolytique.</p>
<div class="lab">Posologie suisse</div><p>Novalgin 1 g/2 mL : 1 à 2 mL (0,5 à 1 g), jusqu’à 5 mL (2,5 g) par dose, à répéter toutes les 6 à 8 heures, au plus 10 mL (5 g) par jour ; injection intraveineuse à 500 mg par minute au plus (compendium.ch, consulté le 08.10.2026).</p>
<div class="lab">Risques</div><p>L’agranulocytose est rare mais grave et imprévisible. L’injection rapide provoque une hypotension. Les contre-indications comprennent une agranulocytose antérieure aux pyrazolones, l’hypotension, l’instabilité hémodynamique et les premier et troisième trimestres de la grossesse.</p>
<div class="lab">Surveillance</div><p>Toute fièvre, angine ou ulcération buccale sous métamizole impose une formule sanguine.</p></template>

<template data-pop="k80-d-opio" data-title="Opioïdes dans la douleur biliaire">
<div class="lab">Place</div><p>L’EASL 2016 réserve les opioïdes aux douleurs sévères. Les essais cités ne montrent pas de différence d’efficacité entre anti-inflammatoires et opioïdes.</p>
<div class="lab">Choix de la molécule</div><p>La morphine augmente le tonus du sphincter d’Oddi. L’EASL 2016 suggère que la buprénorphine le contracte moins ; cette différence est physiologique et n’a pas été démontrée sur un critère clinique.</p>
<div class="lab">Posologie</div><p>La posologie suit l’information professionnelle du produit choisi ; elle n’est pas détaillée ici, car aucune monographie suisse d’opioïde n’a été relue pour ce cours.</p>
<div class="lab">Précautions</div><p>Dépression respiratoire, sédation, nausées, constipation ; adaptation chez le sujet âgé et l’insuffisant rénal.</p></template>

<template data-pop="k80-d-ab" data-title="Antibiothérapie de la cholécystite aiguë (TG18)">
<div class="lab">Objectif</div><p>L’antibiotique limite la réponse septique et l’inflammation locale et prévient l’infection du site opératoire. Il ne remplace pas la cholécystectomie ni le drainage.</p>
<div class="lab">Choix probabiliste</div><p>Grade I communautaire : céphalosporine (céfazoline, céfuroxime, ceftriaxone) avec métronidazole, ou pénicilline avec inhibiteur de bêtalactamase si la résistance locale le permet. Grade II communautaire : ceftriaxone ou céfotaxime avec métronidazole, ou pipéracilline-tazobactam. Grade III et infection associée aux soins : pipéracilline-tazobactam, céfépime avec métronidazole, ou carbapénème, avec vancomycine au grade III.</p>
<div class="lab">Durée</div><p>Grades I et II : arrêt après la cholécystectomie (TG18, recommandation 1, niveau B). Perforation, forme emphysémateuse ou nécrose : 4 à 7 jours. Grade III : 4 à 7 jours après contrôle de la source (recommandation 2, niveau D). Bactériémie à cocci à Gram positif : au moins deux semaines.</p>
<div class="lab">Adaptation suisse</div><p>Les résistances d’<i>Escherichia coli</i> varient selon les régions et les hôpitaux. Le médecin suit le protocole local de son établissement, établi d’après les données de surveillance suisses.</p>
<div class="lab">Source</div><p>Gomi H. et al., J Hepatobiliary Pancreat Sci 2018 ; 25 : 3-16, tableaux 3 et 5, texte intégral lu le 08.10.2026.</p></template>

<template data-pop="k80-d-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération, elle inhibe la synthèse de la paroi bactérienne. Elle couvre bien les entérobactéries sensibles, mais ni les entérocoques ni les anaérobies ; d’où l’association au métronidazole.</p>
<div class="lab">Posologie suisse</div><p>Rocephin : chez l’adulte et l’enfant de plus de 12 ans ou de plus de 50 kg, 1 à 2 g une fois par jour, jusqu’à 4 g (compendium.ch, consulté le 08.10.2026). Dans la cholécystite, 2 g une fois par jour est la dose habituelle.</p>
<div class="lab">Particularités</div><p>Sa longue demi-vie permet une seule dose quotidienne. Son élimination biliaire explique la pseudolithiase. Elle est contre-indiquée chez le nouveau-né hyperbilirubinémique et avec des solutions calciques chez le nouveau-né.</p></template>

<template data-pop="k80-d-metro" data-title="Métronidazole">
<div class="lab">Mécanisme</div><p>Dérivé nitro-imidazolé, il est réduit dans la bactérie anaérobie en radicaux qui lèsent l’ADN. Il couvre les anaérobies stricts, comme <i>Bacteroides</i> et <i>Clostridium</i>.</p>
<div class="lab">Posologie</div><p>500 mg par voie intraveineuse toutes les 8 heures, avec relais oral possible (information professionnelle européenne ; monographie suisse non lue en texte intégral au 08.10.2026).</p>
<div class="lab">Interactions et effets</div><p>Il potentialise les antivitamines K : l’INR doit être contrôlé. La monographie déconseille l’alcool pendant le traitement. Un traitement prolongé expose à une neuropathie périphérique et à un goût métallique.</p></template>

<template data-pop="k80-d-pipt" data-title="Pénicillines avec inhibiteur de bêtalactamase">
<div class="lab">Mécanisme</div><p>La pénicilline inhibe la synthèse de la paroi ; l’inhibiteur protège la pénicilline contre de nombreuses bêtalactamases. Le spectre couvre les entérobactéries sensibles, les entérocoques sensibles à l’amoxicilline et les anaérobies.</p>
<div class="lab">Amoxicilline-acide clavulanique</div><p>Les formes suisses Co-Amoxi-Mepha i.v. 1200 (amoxicilline 1 g et acide clavulanique 200 mg) et 2200 (amoxicilline 2 g et acide clavulanique 200 mg) existent (ch.oddb.org, consulté le 08.10.2026). La posologie suit la monographie suisse, non lue en texte intégral pour ce cours. Les TG18 déconseillent l’ampicilline-sulbactam lorsque plus de 20 % des <i>Escherichia coli</i> locaux y sont résistants.</p>
<div class="lab">Pipéracilline-tazobactam</div><p>Elle couvre aussi <i>Pseudomonas aeruginosa</i>. Elle est réservée au grade III et aux infections associées aux soins. Posologie dans l’infection intra-abdominale : 4 g/0,5 g toutes les 8 heures (information professionnelle européenne ; monographie suisse non lue en texte intégral au 08.10.2026).</p>
<div class="lab">Contre-indication</div><p>Allergie aux pénicillines ; une allergie aux céphalosporines impose la prudence.</p></template>

<template data-pop="k80-d-udca" data-title="Acide ursodésoxycholique">
<div class="lab">Mécanisme</div><p>C’est un acide biliaire hydrophile. Il réduit l’absorption intestinale et la sécrétion biliaire du cholestérol, et il favorise sa solubilisation. La bile devient moins saturée.</p>
<div class="lab">Indications admises par l’EASL 2016</div><p>Prévention pendant une perte de poids rapide : au moins 500 mg par jour jusqu’à stabilisation du poids (recommandation faible, preuve modérée). Syndrome LPAC : 15 mg/kg par jour au long cours. Traitement prolongé par analogues de la somatostatine : traitement envisageable.</p>
<div class="lab">Ce qu’il ne fait pas</div><p>L’EASL 2016 déconseille la dissolution des calculs vésiculaires symptomatiques (recommandation forte) : la dissolution est lente, incomplète et suivie de récidives. Les informations européennes de l’Ursofalk décrivent une dose de dissolution d’environ 10 mg/kg par jour, réservée à des calculs radiotransparents de 15 mm au plus dans une vésicule fonctionnelle.</p>
<div class="lab">Interactions</div><p>La colestyramine et les antiacides à l’aluminium diminuent son absorption : les prises doivent être séparées.</p></template>

<template data-pop="pareto-k80-bases" data-title="Pareto — Définitions, épidémiologie et mécanismes">
<p class="ratio" data-cover="k80-0,k80-1,k80-2,k80-3,k80-4"></p>
<ul><li>Le site de l’obstacle définit le syndrome : cystique transitoire, colique ; cystique prolongé, cholécystite ; cholédoque, ictère ; bile infectée, cholangite ; ampoule, pancréatite.</li>
<li>K80 code la lithiase selon le site et l’inflammation ; K81 la cholécystite sans calcul ; K82 les autres maladies de la vésicule.</li>
<li>10 à 20 % des adultes occidentaux ont des calculs ; 80 % restent muets ; 1 à 4 % par an deviennent symptomatiques.</li>
<li>Après une première colique, les complications atteignent 1 à 3 % par an : la chirurgie devient indiquée.</li>
<li>Le calcul de cholestérol naît d’une sursaturation, d’une nucléation et d’une stase vésiculaire.</li>
<li>L’obstruction prolongée du canal cystique provoque inflammation chimique, ischémie, puis infection.</li>
<li>Facteurs de risque : sexe féminin, âge, obésité, perte de poids rapide, jeûne, grossesse, hérédité, mutation ABCB4 ; hémolyse et cirrhose pour les calculs pigmentaires.</li></ul></template>

<template data-pop="pareto-k80-clin" data-title="Pareto — Clinique, diagnostic et urgences">
<p class="ratio" data-cover="k80-5,k80-6,k80-7,k80-8"></p>
<ul><li>Colique : douleur de plus de 15 à 30 minutes, de moins de six heures, sans fièvre.</li>
<li>Cholécystite certaine (TG18) : un signe local, un signe systémique et une imagerie caractéristique.</li>
<li>Grade III : défaillance d’organe ; grade II : leucocytes supérieurs à 18 G/L, masse, plus de 72 heures ou inflammation locale marquée.</li>
<li>Calcul cholédocien (ESGE 2019) : probabilité élevée si cholangite ou calcul visible ; intermédiaire si tests hépatiques anormaux ou voie dilatée ; faible si tout est normal.</li>
<li>Aucun signe clinique isolé ne prouve la cholécystite ; l’échographie est indispensable.</li>
<li>Un électrocardiogramme élimine un infarctus inférieur chez le patient à risque.</li>
<li>Choc septique biliaire : drainage dans les 12 heures ; perforation et forme emphysémateuse : chirurgie urgente.</li></ul></template>

<template data-pop="pareto-k80-ttt" data-title="Pareto — Traitement de la lithiase">
<p class="ratio" data-cover="k80-9,k80-10"></p>
<ul><li>Colique : anti-inflammatoire non stéroïdien, puis cholécystectomie élective.</li>
<li>Lithiase asymptomatique : abstention, sauf polype de 10 mm ou plus ou vésicule porcelaine.</li>
<li>Cholécystite : antibiotique et cholécystectomie laparoscopique précoce, idéalement dans les 72 heures, au plus tard dans la première semaine ; pas entre le 7e et le 45e jour.</li>
<li>Patient inapte : traitement médical, puis drainage si nécessaire ; le drainage est inférieur à la chirurgie chez le patient opérable (CHOCOLATE).</li>
<li>Vue critique de sécurité avant toute section ; lésion biliaire majeure dans 0,2 à 0,4 % des cas.</li>
<li>Antibiotique arrêté après la chirurgie dans les grades I et II ; 4 à 7 jours dans le grade III.</li>
<li>Tout calcul cholédocien prouvé s’extrait ; CPRE après 100 mg de diclofénac rectal ; cholécystectomie dans les deux semaines.</li></ul></template>

<template data-pop="pareto-k80-crit" data-title="Pareto — Situations particulières et critères">
<p class="ratio" data-cover="k80-11,k80-12,k80-13"></p>
<ul><li>Polype : 10 mm ou plus, cholécystectomie ; 6 à 9 mm avec facteur de risque, cholécystectomie ; sinon surveillance à 6 mois, 1 an et 2 ans.</li>
<li>Cholestérolose et adénomyomatose asymptomatiques ne s’opèrent pas.</li>
<li>Après cholécystectomie, une plainte persistante appelle une cause précise ; la sphinctérotomie sans obstacle est inutile.</li>
<li>Perte de poids rapide : acide ursodésoxycholique, au moins 500 mg par jour.</li>
<li>Grossesse : cholécystectomie possible à tout trimestre si urgente, de préférence au deuxième.</li>
<li>Cirrhose de classe Child-Pugh A ou B : cholécystectomie laparoscopique préférée.</li></ul></template>

<template data-pop="pareto-k80-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="k80-e-1,k80-e-2,k80-e-3,k80-e-4,k80-e-5,k80-e-6"></p>
<ul><li>L’échographie à jeun est l’examen de référence de la vésicule.</li>
<li>Signes de cholécystite : paroi d’au moins 4 mm, distension, liquide, calcul enclavé, Murphy échographique.</li>
<li>Bilirubine et PAL estiment le risque de calcul cholédocien ; la lipase dépiste la pancréatite.</li>
<li>Probabilité intermédiaire : échoendoscopie (sensibilité 95 %) ou cholangio-IRM (93 %) avant toute CPRE.</li>
<li>La tomodensitométrie manque les petits calculs ; elle cherche les complications.</li>
<li>Leucocytes supérieurs à 18 G/L : grade II ; créatinine, INR et plaquettes : défaillances du grade III.</li>
<li>La CRP monte après 6 à 8 heures : une valeur normale très précoce n’exclut rien.</li>
<li>Des tests hépatiques normaux n’excluent pas totalement un calcul cholédocien (5,4 % des calculs prouvés).</li>
<li>Hémocultures non systématiques au grade I communautaire ; obligatoires en cas de frissons, de cholangite ou de gravité.</li>
<li>Triade de Charcot avec choc : drainage biliaire dans les 12 heures, sans attendre d’autre imagerie.</li></ul></template>

<template data-pop="pareto-k80-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="k80-p-1,k80-p-2,k80-p-3,k80-p-4"></p>
<ul><li>Diclofénac 75 mg par voie intramusculaire en première intention de la colique, sauf insuffisance rénale ou hypovolémie.</li>
<li>Butylscopolamine 20 à 40 mg, au plus 100 mg par jour ; métamizole 0,5 à 1 g, au plus 5 g par jour.</li>
<li>Cholécystite communautaire : ceftriaxone 2 g par jour avec métronidazole 500 mg toutes les 8 heures.</li>
<li>Grade III ou infection associée aux soins : pipéracilline-tazobactam ou carbapénème, avec vancomycine au grade III.</li>
<li>L’acide ursodésoxycholique prévient les calculs pendant une perte de poids rapide ; il ne traite pas la lithiase symptomatique.</li></ul></template>
