
<!-- ===== FENÊTRES K80 : traitement, essais et maladies de la vésicule ===== -->
<template data-pop="k80-acdc" data-title="Essai ACDC (2013)">
<div class="lab">Question</div><p>Faut-il opérer une cholécystite aiguë dès l’admission, ou la refroidir par antibiotiques puis opérer plus tard ?</p>
<div class="lab">Méthode</div><p>Essai randomisé ouvert : cholécystectomie laparoscopique dans les 24 heures après l’admission (304 patients) contre antibiothérapie initiale puis cholécystectomie entre le 7e et le 45e jour (314 patients). Tous les patients recevaient de la moxifloxacine pendant au moins 48 heures.</p>
<div class="lab">Résultats</div><p>La morbidité à 75 jours était de 11,8 % après chirurgie immédiate contre 34,4 % après chirurgie différée. La conversion et la mortalité ne différaient pas. Le séjour moyen était de 5,4 jours contre 10,0 jours.</p>
<div class="lab">Limites</div><p>Les patients inclus étaient opérables ; le résultat ne s’applique pas au patient instable ou très fragile.</p>
<div class="lab">Source</div><p>Gutt C. N. et al., Annals of Surgery 2013, PubMed 24022431, résumé lu le 08.10.2026.</p></template>

<template data-pop="k80-chocolate" data-title="Essai CHOCOLATE (2018) et score APACHE II">
<div class="lab">Question</div><p>Chez un patient à haut risque, le drainage percutané est-il préférable à la cholécystectomie ?</p>
<div class="lab">Méthode</div><p>Essai randomisé néerlandais, 142 patients avec cholécystite lithiasique et score APACHE II de 7 à 14. Le score APACHE II mesure la gravité physiologique à partir de signes vitaux, de la biologie, de l’âge et des maladies chroniques.</p>
<div class="lab">Résultats</div><p>Les complications majeures touchaient 12 % des patients opérés contre 65 % des patients drainés (risque relatif 0,19). Les récidives biliaires étaient de 5 % contre 53 %, et le séjour médian de 5 contre 9 jours. La mortalité ne différait pas significativement (3 % contre 9 %).</p>
<div class="lab">Conséquence</div><p>Un âge avancé ou des comorbidités ne suffisent pas à préférer le drainage. Le drainage reste réservé aux patients réellement inopérables.</p>
<div class="lab">Source</div><p>Loozen C. S. et al., British Medical Journal 2018, PubMed 30297544, résumé lu le 08.10.2026.</p></template>

<template data-pop="k80-drainage" data-title="Drainage de la vésicule">
<div class="lab">Drainage percutané transhépatique</div><p>Sous guidage échographique, un cathéter traverse le foie jusqu’à la vésicule. Le trajet transhépatique réduit le risque de fuite biliaire dans le péritoine. Le geste se fait sous anesthésie locale, au lit si nécessaire.</p>
<div class="lab">Indication</div><p>Il s’adresse au patient en grade III non opérable ou au patient de grade II qui ne répond pas au traitement médical et qui ne peut pas être opéré.</p>
<div class="lab">Alternatives</div><p>Le drainage vésiculaire guidé par échoendoscopie, par prothèse entre l’estomac ou le duodénum et la vésicule, se développe dans les centres experts. L’ASGE 2024 l’a évalué dans une recommandation sur l’échoendoscopie thérapeutique biliaire.</p>
<div class="lab">Limites</div><p>Le drainage laisse la vésicule et les calculs. Dans l’essai CHOCOLATE, la moitié des patients drainés ont récidivé. Une cholécystectomie différée se discute dès que l’état s’améliore.</p></template>

<template data-pop="k80-cvs" data-title="Vue critique de sécurité">
<div class="lab">Définition</div><p>La vue critique de sécurité est obtenue lorsque trois conditions sont réunies : le triangle hépatocystique est libéré de sa graisse et de son tissu fibreux ; le tiers inférieur de la vésicule est séparé du lit hépatique ; deux structures seulement, le canal cystique et l’artère cystique, entrent dans la vésicule.</p>
<div class="lab">Pourquoi</div><p>La lésion biliaire naît d’une confusion entre le cholédoque et le canal cystique. La vue critique de sécurité rend cette confusion impossible avant toute section.</p>
<div class="lab">Repères TG18</div><p>La dissection reste au-dessus de la ligne imaginaire qui relie la base du segment IV au sillon de Rouvière.</p>
<div class="lab">Procédure de repli</div><p>Si la vue ne peut être obtenue à cause d’une fibrose ou d’une cicatrice, le chirurgien choisit une cholécystectomie subtotale, une dissection à partir du fond ou une conversion.</p>
<div class="lab">Source</div><p>Wakabayashi G. et al., J Hepatobiliary Pancreat Sci 2018 ; 25 : 73-86, PubMed 29095575, résumé lu le 08.10.2026.</p></template>

<template data-pop="k80-lesion-vb" data-title="Lésion de la voie biliaire principale">
<div class="lab">Fréquence</div><p>Selon l’EASL 2016, les lésions majeures de la voie biliaire touchent 0,2 à 0,4 % des cholécystectomies, que l’abord soit ouvert ou laparoscopique. La fuite biliaire touche 0,4 à 1,5 % des patients.</p>
<div class="lab">Facteurs de risque</div><p>Un calcul enclavé dans le canal cystique, un syndrome de Mirizzi, un calcul de la poche de Hartmann, l’inflammation et les variantes anatomiques augmentent le risque.</p>
<div class="lab">Conséquence</div><p>L’EASL 2016 rapporte une mortalité à un et deux ans plus élevée chez les patients lésés. Une lésion reconnue tardivement expose à la cholangite, à la sténose et à la cirrhose biliaire secondaire.</p>
<div class="lab">Signes d’alerte</div><p>Après la cholécystectomie, une douleur, une fièvre, un ictère ou une ascite imposent une biologie et une imagerie (échographie, tomodensitométrie, cholangio-IRM) pendant une surveillance hospitalière.</p></template>

<template data-pop="k80-cpre" data-title="CPRE et sphinctérotomie">
<div class="lab">Principe</div><p>Un duodénoscope à vision latérale atteint la papille. Un cathéter est introduit dans le cholédoque, puis un produit de contraste opacifie les voies biliaires sous radioscopie. La sphinctérotomie sectionne le sphincter biliaire pour permettre l’extraction.</p>
<div class="lab">Extraction</div><p>Le ballonnet et le panier sont aussi efficaces et sûrs selon l’ESGE 2019. Le succès de la sphinctérotomie avec extraction atteint 80 à 90 %. Les calculs difficiles bénéficient d’une dilatation papillaire au grand ballonnet, d’une lithotripsie mécanique ou d’une lithotripsie sous cholangioscopie.</p>
<div class="lab">Complications</div><p>La pancréatite, l’hémorragie après sphinctérotomie, la perforation et la cholangite sont les principales. Le diclofénac ou l’indométacine rectaux à 100 mg préviennent la pancréatite (ESGE 2020).</p>
<div class="lab">Règle</div><p>La CPRE est un geste thérapeutique. Elle n’est plus utilisée pour un diagnostic que l’échoendoscopie ou la cholangio-IRM peuvent poser.</p></template>

<template data-pop="k80-gallriks" data-title="Registre GallRiks">
<div class="lab">Définition</div><p>GallRiks est le registre national suédois de la chirurgie biliaire et de la CPRE.</p>
<div class="lab">Données citées par l’ESGE 2019</div><p>Parmi 3969 patients avec un calcul cholédocien découvert pendant la cholangiographie peropératoire, 594 ont gardé leur calcul. Pendant un suivi allant jusqu’à quatre ans, 25,3 % des patients non traités ont présenté une pancréatite, une cholangite ou une obstruction, contre 12,7 % des patients traités. Les calculs de moins de 4 mm causaient encore 5,9 % de complications.</p>
<div class="lab">Limite</div><p>Il s’agit d’une étude observationnelle : les patients non traités pouvaient différer des patients traités. L’ESGE classe donc la preuve comme faible, tout en recommandant l’extraction.</p></template>

<template data-pop="k80-delai" data-title="Délai de la cholécystectomie après CPRE : 72 heures ou deux semaines">
<div class="lab">Les deux textes</div><p>L’EASL 2016 recommande une cholécystectomie dans les 72 heures après la CPRE (recommandation forte, preuve modérée), sur la base d’un essai randomisé comparant 72 heures et 6 à 8 semaines. L’ESGE 2019 recommande une cholécystectomie dans les deux semaines (recommandation forte, preuve modérée).</p>
<div class="lab">Choix retenu</div><p>Le texte le plus récent, l’ESGE 2019, est retenu dans ce cours. Il s’appuie sur une synthèse plus large : les récidives biliaires étaient de 2 à 10 % après chirurgie précoce contre 24 à 47 % après chirurgie différée ou à la demande, et les conversions de 4 à 23 % contre 8 à 55 %.</p>
<div class="lab">Relation entre les deux</div><p>Les deux textes ne se contredisent pas sur le principe : une cholécystectomie précoce vaut mieux qu’une attente de plusieurs semaines. L’ESGE fixe un plafond, l’EASL un idéal. Aucune étude citée n’a comparé directement deux à quatre semaines avec six à huit semaines.</p>
<div class="lab">Portée et limites</div><p>Ces recommandations concernent les patients aptes à la chirurgie. Un patient inapte peut garder sa vésicule après sphinctérotomie, au prix d’un risque accru de récidive.</p>
<div class="lab">Accès aux textes</div><p>ESGE 2019 : https://www.esge.com/assets/downloads/pdfs/guidelines/2019_a_0862_0346.pdf (section 7.1). EASL 2016 : texte intégral téléchargeable sur easl.eu, rubrique des recommandations cliniques. Les deux consultés le 08.10.2026.</p></template>

<template data-pop="k80-polypes" data-title="Polypes vésiculaires : recommandations de 2022 et de 2016">
<div class="lab">Texte retenu</div><p>Les recommandations communes ESGAR, EAES, EFISDS et ESGE de 2022 sont les plus récentes. Elles recommandent la cholécystectomie pour un polype de 10 mm ou plus, et pour un polype de 6 à 9 mm avec au moins un facteur de risque. Une surveillance échographique à 6 mois, 1 an et 2 ans s’applique aux polypes de 6 à 9 mm sans facteur de risque et aux polypes de 5 mm ou moins avec facteur de risque.</p>
<div class="lab">Facteurs de risque</div><p>Âge supérieur à 60 ans, cholangite sclérosante primitive, origine asiatique, polype sessile ou épaississement pariétal focal de plus de 4 mm.</p>
<div class="lab">Texte antérieur</div><p>L’EASL 2016 recommandait la cholécystectomie pour un polype d’au moins 1 cm, la considérait pour un polype de 6 à 10 mm associé à des calculs, et la proposait en cas de cholangite sclérosante primitive quelle que soit la taille.</p>
<div class="lab">Relation entre les deux</div><p>Les deux textes concordent sur le seuil de 10 mm. Le texte de 2022 affine la conduite pour les polypes de 6 à 9 mm en utilisant les facteurs de risque, et il limite la surveillance à deux ans. Il est retenu parce qu’il est plus récent et qu’il précise la durée du suivi.</p>
<div class="lab">Accès aux textes</div><p>Foley K. G. et al., European Radiology 2022 ; 32 : 3358-3368, texte libre sur PubMed Central. EASL 2016 : Journal of Hepatology 2016 ; 65 : 146-181. Consultés le 08.10.2026.</p></template>

<template data-pop="k80-porcelaine" data-title="Vésicule porcelaine">
<div class="lab">Définition</div><p>La paroi vésiculaire est partiellement ou totalement calcifiée, en général après une inflammation chronique. Elle est codée K82.8.</p>
<div class="lab">Risque de cancer</div><p>Les séries anciennes, fondées sur la radiographie, trouvaient un cancer dans jusqu’à 20 % des cas. L’EASL 2016 souligne que ce lien n’est pas confirmé partout et qu’un lien causal n’est pas établi. Le risque serait très faible pour une calcification homogène et d’environ 7 % pour une calcification ponctuée.</p>
<div class="lab">Conduite</div><p>L’EASL 2016 admet une cholécystectomie chez le patient asymptomatique (recommandation faible) et recommande une confirmation par tomodensitométrie avant l’intervention.</p></template>

<template data-pop="k80-cholesterolose" data-title="Cholestérolose vésiculaire">
<div class="lab">Définition</div><p>Des esters de cholestérol s’accumulent dans des macrophages du chorion muqueux. L’aspect macroscopique en petits points jaunes sur fond rouge explique le nom de « vésicule fraise ». Elle est codée K82.4.</p>
<div class="lab">Mécanisme</div><p>La muqueuse absorbe le cholestérol d’une bile sursaturée plus vite qu’elle ne l’exporte.</p>
<div class="lab">Imagerie</div><p>Les dépôts forment des pseudopolypes de cholestérol, souvent multiples et de moins de 10 mm, sans vascularisation au Doppler.</p>
<div class="lab">Conduite</div><p>La cholestérolose asymptomatique ne s’opère pas. La conduite devant un polype suit la taille et les facteurs de risque.</p></template>

<template data-pop="k80-adenomyo" data-title="Adénomyomatose vésiculaire">
<div class="lab">Définition</div><p>C’est un épaississement bénin de la paroi par hyperplasie de l’épithélium et de la musculeuse, avec des diverticules intramuraux, les sinus de Rokitansky-Aschoff dilatés. Elle peut être diffuse, segmentaire ou localisée au fond.</p>
<div class="lab">Imagerie</div><p>Des cristaux de cholestérol piégés dans les sinus donnent des artefacts en queue de comète à l’échographie ; la cholangio-IRM montre des microkystes pariétaux.</p>
<div class="lab">Conduite</div><p>La forme asymptomatique typique ne s’opère pas. Un épaississement focal atypique se discute comme un polype sessile, car un cancer peut s’y ressembler.</p></template>

<template data-pop="k80-rokitansky" data-title="Sinus de Rokitansky-Aschoff">
<div class="lab">Définition</div><p>Ce sont des invaginations de la muqueuse vésiculaire à travers la musculeuse.</p>
<div class="lab">Mécanisme</div><p>La vésicule n’a pas de musculaire muqueuse. Une pression intraluminale élevée et une inflammation chronique poussent la muqueuse dans les espaces de la musculeuse.</p>
<div class="lab">Signification</div><p>Ils signent une cholécystite chronique ou une adénomyomatose. Des calculs peuvent s’y former et entretenir l’inflammation.</p></template>

<template data-pop="k80-postchol" data-title="Plaintes après cholécystectomie">
<div class="lab">Fréquence</div><p>Selon l’EASL 2016, 10 à 40 % des patients gardent ou retrouvent des plaintes après la cholécystectomie.</p>
<div class="lab">Causes à chercher</div><p>Un calcul cholédocien résiduel ou récidivant, une fuite ou une sténose biliaire, une microlithiase, un syndrome LPAC, puis des causes non biliaires : dyspepsie fonctionnelle, syndrome de l’intestin irritable, reflux gastro-œsophagien. La dysfonction du sphincter d’Oddi est rare.</p>
<div class="lab">Ce qu’il ne faut pas faire</div><p>Un grand essai randomisé cité par l’EASL n’a montré aucun bénéfice de la sphinctérotomie chez les patients douloureux sans obstacle. Ce geste n’est donc pas recommandé.</p>
<div class="lab">Renvoi</div><p>K91 — Troubles digestifs après actes médicaux (G-04-Gastroentérologie et hépatologie) traite le code K91.5.</p></template>

<template data-pop="k80-grossesse" data-title="Lithiase biliaire pendant la grossesse">
<div class="lab">Mécanisme</div><p>Les œstrogènes augmentent la sécrétion biliaire de cholestérol. La progestérone relâche le muscle lisse et ralentit la vidange vésiculaire. La bile devient lithogène et stagne.</p>
<div class="lab">Fréquence</div><p>Selon l’EASL 2016, 5 % des femmes enceintes développent un sludge et 5 % des calculs ; 1,2 % seulement ont une douleur biliaire.</p>
<div class="lab">Conduite</div><p>La lithiase asymptomatique ne se traite pas, et l’acide ursodésoxycholique n’est pas indiqué contre le sludge. La cholécystectomie laparoscopique peut se faire à tout trimestre si l’indication est urgente ; le deuxième trimestre est le plus sûr. Les récidives sans chirurgie sont fréquentes : 92 %, 64 % et 44 % selon le trimestre de la première crise.</p>
<div class="lab">Calcul cholédocien</div><p>La CPRE thérapeutique, réalisée par un endoscopiste expérimenté avec une irradiation minimale, est sûre selon l’ESGE 2019. La grossesse augmente le risque de pancréatite après CPRE.</p>
<div class="lab">Piège</div><p>Une douleur de l’hypochondre droit au troisième trimestre impose de mesurer la pression artérielle et les plaquettes pour éliminer un syndrome HELLP.</p></template>

<template data-pop="k80-childpugh" data-title="Classe de Child-Pugh et cholécystectomie">
<div class="lab">Définition</div><p>La classification de Child-Pugh évalue la gravité d’une cirrhose avec la bilirubine, l’albumine, le temps de prothrombine ou l’INR, l’ascite et l’encéphalopathie. Elle sépare trois classes : A, B et C.</p>
<div class="lab">Conséquence chirurgicale</div><p>Le risque opératoire augmente avec la classe, à cause de l’hypertension portale, des troubles de la coagulation et de la mauvaise cicatrisation. L’EASL 2016 préfère la cholécystectomie laparoscopique chez le patient de classe A ou B ayant une lithiase symptomatique.</p>
<div class="lab">Renvoi</div><p>Le calcul détaillé du score relève de K74 — Fibrose et cirrhose hépatiques (G-04-Gastroentérologie et hépatologie).</p></template>
