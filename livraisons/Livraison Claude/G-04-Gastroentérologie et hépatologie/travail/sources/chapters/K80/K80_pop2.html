
<!-- ===== FENÊTRES K80 : critères et examens ===== -->
<template data-pop="k80-tg18-diag" data-title="Critères diagnostiques TG18 de la cholécystite aiguë">
<div class="lab">Contenu</div><p><b>A. Signes locaux</b> : signe de Murphy ; masse, douleur ou sensibilité de l’hypochondre droit. <b>B. Signes systémiques</b> : fièvre ; CRP élevée ; leucocytose. <b>C. Imagerie</b> : signes caractéristiques de cholécystite aiguë.</p>
<div class="lab">Règle</div><p>Un élément de A et un élément de B suffisent pour suspecter le diagnostic. L’ajout de C le rend certain.</p>
<div class="lab">Origine et validation</div><p>Les TG18 (Yokoe, 2018) ont repris sans modification les critères des TG13, après une revue de la littérature de 2013 à 2017. Les TG13 avaient amélioré la spécificité par rapport aux TG07.</p>
<div class="lab">Limites</div><p>Les critères décrivent un diagnostic clinique et radiologique. Ils ne distinguent pas la cholécystite lithiasique de la forme alithiasique, et ils peuvent manquer chez le sujet âgé peu fébrile.</p>
<div class="lab">Source</div><p>Yokoe M. et al., J Hepatobiliary Pancreat Sci 2018 ; 25 : 41-54, PubMed 29032636, résumé lu le 08.10.2026 ; critères confirmés par plusieurs reproductions indépendantes.</p></template>

<template data-pop="k80-tg18-grav" data-title="Grades de gravité TG18 de la cholécystite aiguë">
<div class="lab">Grade III, sévère</div><p>Une défaillance d’au moins un organe : hypotension traitée par dopamine à 5 µg/kg/min ou plus ou par noradrénaline à toute dose ; trouble de la conscience ; PaO₂/FiO₂ inférieur à 300 ; oligurie ou créatinine supérieure à 2,0 mg/dL (177 µmol/L) ; INR supérieur à 1,5 ; plaquettes inférieures à 100 G/L.</p>
<div class="lab">Grade II, modéré</div><p>Un des critères suivants : leucocytes supérieurs à 18 G/L ; masse douloureuse palpable de l’hypochondre droit ; symptômes depuis plus de 72 heures ; inflammation locale marquée, comme une gangrène, un abcès péri-vésiculaire ou hépatique, une péritonite biliaire ou une forme emphysémateuse.</p>
<div class="lab">Grade I, léger</div><p>Aucun critère de grade II ou III n’est présent.</p>
<div class="lab">Signification</div><p>Le grade III mesure le retentissement systémique. Le grade II mesure la difficulté technique prévisible de la cholécystectomie, car l’inflammation locale efface les plans de dissection. Selon les TG18, le grade est associé à la mortalité à 30 jours, à la durée d’hospitalisation et au taux de conversion.</p>
<div class="lab">Piège</div><p>Le grade se réévalue : un patient de grade I à l’admission peut passer en grade III en quelques heures.</p></template>

<template data-pop="k80-tg18-flow" data-title="Schéma décisionnel TG18 de la cholécystite aiguë">
<div class="lab">Principe</div><p>Les TG18 (Okamoto, 2018) croisent le grade de la cholécystite avec deux mesures du terrain : l’indice de comorbidité de Charlson et la classe physique de l’American Society of Anesthesiologists.</p>
<div class="lab">Grade I</div><p>La cholécystectomie laparoscopique précoce est recommandée si l’indice de Charlson est d’au plus 5 et la classe physique d’au plus 2.</p>
<div class="lab">Grade II</div><p>Avec les mêmes seuils, la cholécystectomie précoce est réalisée par un chirurgien expérimenté. Sinon, le traitement médical et, si nécessaire, le drainage précèdent une cholécystectomie différée.</p>
<div class="lab">Grade III</div><p>La cholécystectomie précoce n’est possible que dans un centre expert, chez un patient dont la défaillance d’organe est favorable, sans facteur prédictif négatif, avec un indice de Charlson d’au plus 3 et une classe physique d’au plus 2. Une défaillance favorable est cardiovasculaire ou rénale et se corrige rapidement. Les facteurs prédictifs négatifs sont l’ictère (bilirubine totale d’au moins 2 mg/dL), la défaillance neurologique et la défaillance respiratoire. Sinon, un drainage urgent ou précoce précède la cholécystectomie différée.</p>
<div class="lab">Source</div><p>Okamoto K. et al., J Hepatobiliary Pancreat Sci 2018 ; 25 : 55-72, PubMed 29045062 ; résumé lu le 08.10.2026 ; les définitions de la défaillance favorable et des facteurs prédictifs négatifs proviennent du texte des TG18, non relu en texte intégral pour ce cours.</p></template>

<template data-pop="k80-esge-strat" data-title="Stratification ESGE 2019 du risque de calcul cholédocien">
<div class="lab">Niveaux</div><p><b>Probabilité élevée</b> : signes de cholangite ou calcul visible à l’échographie. <b>Probabilité intermédiaire</b> : tests hépatiques anormaux, voie biliaire dilatée à l’échographie, ou les deux. <b>Probabilité faible</b> : tests hépatiques et échographie normaux, sans dilatation.</p>
<div class="lab">Conduite</div><p>Élevée : CPRE préopératoire, ou cholécystectomie avec exploration de la voie biliaire. Intermédiaire : échoendoscopie ou cholangio-IRM, puis CPRE seulement si le calcul est confirmé. Faible : cholécystectomie sans autre exploration, sauf symptômes persistants.</p>
<div class="lab">Pourquoi cette prudence</div><p>La CPRE expose à la pancréatite, à l’hémorragie et à la perforation. L’ESGE limite donc la CPRE aux calculs démontrés par un examen très spécifique, sauf en cas de cholangite.</p>
<div class="lab">Différence avec l’ASGE 2019</div><p>L’ASGE 2019 utilise aussi l’âge et une bilirubine supérieure à 4 mg/dL avec voie dilatée. Les études comparatives montrent que la stratification ESGE envoie plus de patients vers l’imagerie de deuxième ligne et moins vers une CPRE inutile.</p>
<div class="lab">Source</div><p>Manes G. et al., Endoscopy 2019 ; 51 : 472-491, figure 1 et section 4.3, texte intégral lu sur esge.com le 08.10.2026.</p></template>

<template data-pop="k80-echo" data-title="Échographie de la vésicule et de la cholécystite">
<div class="lab">Technique</div><p>L’examen se fait à jeun depuis au moins six heures, pour que la vésicule soit remplie. Le patient est examiné couché, puis en décubitus latéral gauche, pour vérifier la mobilité des calculs.</p>
<div class="lab">Signes de cholécystite (TG13, repris par TG18)</div><p>Le signe de Murphy échographique, une paroi d’au moins 4 mm en l’absence de maladie hépatique chronique, d’ascite ou d’insuffisance cardiaque droite, une vésicule distendue (grand axe d’au moins 8 cm ou petit axe d’au moins 4 cm), un calcul enclavé, des débris échogènes et un liquide péri-vésiculaire.</p>
<div class="lab">Complications visibles</div><p>Une paroi irrégulière, interrompue ou des membranes intraluminales évoquent une gangrène. Un épanchement collecté évoque un abcès. Des échos gazeux pariétaux évoquent une forme emphysémateuse.</p>
<div class="lab">Recommandation</div><p>L’EASL 2016 recommande une échographie abdominale chez tout patient ayant une histoire récente de douleur biliaire (recommandation forte, preuve élevée).</p>
<div class="lab">Erreur fréquente</div><p>Interpréter une paroi épaisse après un repas comme une cholécystite. La vésicule contractée a normalement une paroi épaisse.</p></template>

<template data-pop="k80-bilan-hep" data-title="Tests hépatiques dans la lithiase">
<div class="lab">Pourquoi les doser</div><p>Ils estiment la probabilité d’un calcul cholédocien et orientent vers l’imagerie de deuxième ligne. Ils ne prouvent pas une cholécystite.</p>
<div class="lab">Interprétation</div><p>Une cholestase élève les PAL et la GGT, puis la bilirubine conjuguée. Un obstacle aigu peut élever d’abord les ALAT et les ASAT, parfois au-delà de dix fois la normale, puis elles baissent vite. Selon l’ESGE 2019, une bilirubine supérieure à 22 µmol/L a une sensibilité de 84 % et une spécificité de 91 % ; des PAL supérieures à 125 U/L, une sensibilité de 91 % et une spécificité de 79 %.</p>
<div class="lab">Décision</div><p>Des tests anormaux placent le patient au moins en probabilité intermédiaire. Des tests normaux avec une échographie normale permettent la cholécystectomie sans autre examen.</p>
<div class="lab">Piège</div><p>Des tests normaux n’excluent pas totalement un calcul : l’ESGE cite une série où 5,4 % des calculs prouvés avaient des tests normaux, surtout après 55 ans et en présence de douleur.</p>
<div class="lab">Renvoi</div><p>L’analyse d’un ictère sans douleur relève de R17 — Ictère et hépatosplénomégalie (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k80-crp" data-title="CRP dans la cholécystite">
<div class="lab">Pourquoi la doser</div><p>La CRP est un critère B des TG18. Elle confirme une réaction inflammatoire systémique.</p>
<div class="lab">Cinétique</div><p>Le foie synthétise la CRP sous l’effet de l’interleukine 6. Sa concentration commence à monter 6 à 8 heures après le début de l’inflammation et culmine vers 48 heures. Une CRP normale au début n’exclut donc pas une cholécystite.</p>
<div class="lab">Décision</div><p>La CRP ne décide pas seule du grade TG18. Une CRP qui ne baisse pas après 48 à 72 heures d’antibiotique fait chercher une collection ou une gangrène.</p></template>

<template data-pop="k80-lipase" data-title="Lipase devant une douleur biliaire">
<div class="lab">Pourquoi la doser</div><p>Un calcul migré peut déclencher une pancréatite, dont la prise en charge diffère de celle de la cholécystite.</p>
<div class="lab">Interprétation</div><p>Une lipase supérieure à trois fois la limite supérieure de la normale, avec une douleur évocatrice, remplit un critère de la pancréatite aiguë. Une élévation inférieure s’observe dans la cholécystite, la cholangite, l’insuffisance rénale ou une perforation digestive.</p>
<div class="lab">Décision</div><p>Une pancréatite biliaire impose la recherche de défaillances d’organe et une cholécystectomie pendant la même hospitalisation si elle est légère. Voir K85 — Pancréatite aiguë (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k80-hemoc" data-title="Hémocultures dans l’infection biliaire">
<div class="lab">Indication</div><p>Les TG18 ne recommandent pas les hémocultures en routine dans la cholécystite communautaire de grade I. Elles sont prélevées en cas de fièvre élevée, de frissons, de cholangite, de grade II ou III et d’infection associée aux soins.</p>
<div class="lab">Pourquoi</div><p>Une bactériémie, surtout à entérocoque ou à streptocoque, prolonge l’antibiothérapie à au moins deux semaines à cause du risque d’endocardite. L’identification du germe permet aussi de réduire le spectre.</p>
<div class="lab">Bile</div><p>Les TG18 suggèrent de cultiver la bile et les tissus lorsqu’une perforation, une forme emphysémateuse ou une nécrose est découverte pendant l’intervention.</p></template>

<template data-pop="k80-echoendo" data-title="Échoendoscopie biliaire">
<div class="lab">Principe</div><p>Une sonde d’échographie placée au bout d’un endoscope examine le cholédoque depuis le duodénum, à quelques millimètres de distance. Les gaz duodénaux ne gênent plus l’examen.</p>
<div class="lab">Performance</div><p>Selon la méta-analyse citée par l’ESGE 2019, sa sensibilité est de 95 % et sa spécificité de 97 % pour le calcul cholédocien. Elle détecte mieux que la cholangio-IRM les calculs de moins de 5 mm.</p>
<div class="lab">Avantage décisionnel</div><p>Si un calcul est trouvé, la CPRE peut suivre dans la même séance de sédation. L’analyse coût-efficacité citée par l’ESGE la préfère lorsque la probabilité de calcul se situe entre 40 et 91 %, avec des limites liées aux coûts locaux.</p>
<div class="lab">Limites</div><p>Elle exige une sédation, un opérateur formé, et elle est difficile après une chirurgie gastrique avec anse exclue.</p></template>

<template data-pop="k80-cholangioirm" data-title="Cholangio-IRM">
<div class="lab">Principe</div><p>Des séquences fortement pondérées en T2 rendent la bile très brillante. Un calcul apparaît comme un défaut de remplissage noir dans la voie biliaire. Aucun produit de contraste ni aucune irradiation n’est nécessaire.</p>
<div class="lab">Performance</div><p>Selon la méta-analyse citée par l’ESGE 2019, sa sensibilité est de 93 % et sa spécificité de 96 % pour le calcul cholédocien. Elle perd en sensibilité pour les calculs de moins de 5 mm.</p>
<div class="lab">Avantages</div><p>Elle montre tout l’arbre biliaire, y compris les variantes anatomiques et le syndrome de Mirizzi. Elle reste possible après chirurgie gastrique.</p>
<div class="lab">Limites</div><p>La claustrophobie, une obésité importante, certains stimulateurs cardiaques et certains clips métalliques la limitent. L’analyse coût-efficacité citée par l’ESGE la préfère lorsque la probabilité de calcul est inférieure à 40 %.</p></template>

<template data-pop="k80-tdm" data-title="Tomodensitométrie dans la pathologie biliaire">
<div class="lab">Indication</div><p>Elle sert à chercher une complication (gangrène, perforation, abcès, forme emphysémateuse, iléus biliaire) et à éliminer un autre diagnostic. L’EASL 2016 admet son usage en cas de forte suspicion de cholécystite (recommandation faible).</p>
<div class="lab">Limites</div><p>Beaucoup de calculs de cholestérol ont une densité proche de celle de la bile et restent invisibles. Selon l’ESGE 2019, la sensibilité pour le calcul cholédocien est de 78 % et tombe à 56,5 % pour les calculs de moins de 5 mm.</p>
<div class="lab">Erreur fréquente</div><p>Conclure à l’absence de lithiase sur une tomodensitométrie normale. L’échographie reste l’examen de référence pour la vésicule.</p></template>

<template data-pop="k80-hida" data-title="Scintigraphie hépatobiliaire">
<div class="lab">Principe</div><p>Un traceur marqué au technétium 99m, dérivé de l’acide iminodiacétique, est capté par le foie et excrété dans la bile. Chez le sujet normal, il remplit la vésicule en moins d’une heure.</p>
<div class="lab">Interprétation</div><p>L’absence de remplissage vésiculaire, alors que le traceur passe dans le duodénum, signe l’obstruction du canal cystique, donc une cholécystite aiguë.</p>
<div class="lab">Place</div><p>Elle garde une place lorsque l’échographie est douteuse. Sa faible disponibilité en urgence et sa durée limitent son usage en Suisse. Le jeûne prolongé et la nutrition parentérale donnent des faux positifs.</p></template>
