
<!-- ===== FENÊTRES K80 : mécanismes et syndromes ===== -->
<template data-pop="k80-fig-sites" data-title="Les cinq syndromes selon le site de l’obstacle">
<div class="lab">Principe</div><p>Le calcul naît dans la vésicule. Sa position ultérieure décide du syndrome, de la biologie et du traitement. Le schéma se lit de la vésicule vers le duodénum.</p>
<svg viewBox="0 0 380 220" role="img" aria-label="Sites d’obstruction biliaire et syndromes correspondants" font-family="Inter,sans-serif" font-size="11"><g fill="none" stroke="#222" stroke-width="1.3"><ellipse cx="70" cy="90" rx="50" ry="24" transform="rotate(-20 70 90)"/><path d="M112 78 Q140 92 170 90 M170 20 V200 M170 200 Q190 212 220 205"/></g><g fill="#222"><circle cx="118" cy="82" r="5"/><circle cx="170" cy="150" r="5"/><circle cx="178" cy="200" r="5"/><text x="10" y="140">1 et 2. Collet, cystique</text><text x="190" y="150">3 et 4. Cholédoque</text><text x="200" y="196">5. Ampoule</text><text x="176" y="16">Canal hépatique commun</text></g></svg>
<div class="lab">Lecture</div><p>1. Un blocage du canal cystique de moins de six heures donne la colique biliaire. 2. Un blocage prolongé donne la cholécystite. 3. Un calcul dans le cholédoque donne la cholestase et l’ictère. 4. La même situation avec une bile infectée donne la cholangite. 5. Un calcul dans l’ampoule de Vater donne la pancréatite biliaire.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement suit le site : cholécystectomie pour la vésicule, CPRE ou exploration chirurgicale pour le cholédoque, drainage urgent pour la cholangite grave.</p></template>

<template data-pop="k80-colique" data-title="Colique biliaire">
<div class="lab">Définition</div><p>L’EASL 2016 décrit des épisodes de douleur intense de l’hypochondre droit ou de l’épigastre, d’au moins 15 à 30 minutes. La douleur irradie vers le dos ou l’épaule droite et répond aux antalgiques. Elle cède habituellement en moins de six heures.</p>
<div class="lab">Mécanisme</div><p>Un calcul obstrue transitoirement le collet ou le canal cystique pendant une contraction vésiculaire. La pression intravésiculaire monte et distend la paroi. La douleur est viscérale, donc mal localisée et continue. L’irradiation scapulaire vient des fibres afférentes qui partagent les segments médullaires de la région scapulaire droite.</p>
<div class="lab">Valeur et limites</div><p>L’EASL 2016 rapporte que la colique, la douleur irradiée et la prise d’antalgiques sont les trois seuls symptômes significativement associés aux calculs. La valeur prédictive positive des symptômes biliaires reste faible (0,25 dans l’étude citée).</p>
<div class="lab">Piège</div><p>Une douleur de plus de six heures, une fièvre ou une sensibilité persistante de l’hypochondre droit font sortir de la colique simple : il faut chercher une cholécystite.</p>
<div class="lab">Conséquence pratique</div><p>Le patient reçoit un anti-inflammatoire non stéroïdien, rentre à domicile s’il est soulagé et apyrétique, et est adressé pour une cholécystectomie élective.</p></template>

<template data-pop="k80-sludge" data-title="Sludge (boue biliaire)">
<div class="lab">Définition</div><p>Le sludge est une suspension de cristaux de cholestérol monohydraté, de granules de bilirubinate de calcium et de mucine dans la bile vésiculaire.</p>
<div class="lab">Mécanisme</div><p>Il se forme lorsque la vésicule se vide mal : jeûne, nutrition parentérale, grossesse, analogues de la somatostatine, ceftriaxone. La stase laisse le temps aux cristaux de s’agréger.</p>
<div class="lab">Échographie</div><p>Il forme un niveau échogène déclive, mobile, sans cône d’ombre acoustique.</p>
<div class="lab">Valeur clinique</div><p>Le sludge peut disparaître spontanément, rester muet, ou provoquer colique, cholécystite et pancréatite. L’EASL 2016 précise que le sludge de la grossesse n’est pas une indication d’intervention.</p></template>

<template data-pop="k80-pigment" data-title="Calculs pigmentaires noirs et bruns">
<div class="lab">Calculs noirs</div><p>Ils sont formés de polymères de bilirubinate de calcium et se forment dans la vésicule stérile. Leur cause est un excès de bilirubine non conjuguée dans la bile : hémolyse chronique (sphérocytose, drépanocytose, valve mécanique), cirrhose, maladie de Crohn iléale ou résection iléale.</p>
<div class="lab">Calculs bruns</div><p>Ils sont plus mous, riches en sels de calcium d’acides gras, et se forment dans les voies biliaires. Leur cause est une infection biliaire : les bêtaglucuronidases bactériennes déconjuguent la bilirubine, qui précipite. Ils s’observent après sphinctérotomie, en amont d’une sténose et dans certaines parasitoses.</p>
<div class="lab">Conséquence pratique</div><p>Un calcul noir chez un sujet jeune impose de chercher une hémolyse. Un calcul brun récidivant dans la voie biliaire impose de chercher une sténose ou une stase.</p></template>

<template data-pop="k80-lpac" data-title="Syndrome LPAC">
<div class="lab">Définition</div><p>Le syndrome LPAC est une lithiase associée à un bas niveau de phospholipides biliaires. Il est dû à des mutations du gène ABCB4, qui code la floppase MDR3.</p>
<div class="lab">Mécanisme</div><p>MDR3 transfère la phosphatidylcholine dans la bile. Sans elle, les micelles mixtes ne solubilisent plus le cholestérol, et la bile pauvre en phospholipides lèse l’épithélium biliaire. Des calculs de cholestérol se forment dans la vésicule et dans les canaux intrahépatiques.</p>
<div class="lab">Reconnaître</div><p>Selon l’EASL 2016, la lithiase débute avant 40 ans, les symptômes récidivent après cholécystectomie et des calculs intrahépatiques sont présents. Des antécédents familiaux au premier degré renforcent la suspicion. Le diagnostic repose sur l’histoire, la clinique et l’imagerie ; le test génétique n’est pas nécessaire.</p>
<div class="lab">Traitement</div><p>L’EASL 2016 rapporte que la majorité des patients bénéficient d’un traitement prolongé par acide ursodésoxycholique à 15 mg/kg par jour, débuté chez l’adulte jeune.</p></template>

<template data-pop="k80-micelle" data-title="Micelles mixtes et solubilité du cholestérol">
<div class="lab">Normal</div><p>Les acides biliaires ont une face hydrophile et une face hydrophobe. Ils s’assemblent en micelles, dont le cœur hydrophobe loge le cholestérol. La phosphatidylcholine s’insère dans la micelle et augmente sa capacité.</p>
<div class="lab">Perturbation</div><p>Si le cholestérol augmente, ou si les acides biliaires ou la phosphatidylcholine diminuent, la capacité des micelles est dépassée. Le cholestérol en excès passe dans des vésicules instables, qui fusionnent et forment des cristaux.</p>
<div class="lab">Conséquence</div><p>Une bile sursaturée ne forme un calcul que si la nucléation et la stase vésiculaire s’ajoutent. C’est pourquoi de nombreux sujets à bile sursaturée n’ont pas de calcul.</p>
<div class="lab">Décision</div><p>La perte de poids progressive et l’acide ursodésoxycholique diminuent la sursaturation ; la cholécystectomie supprime le lieu de la nucléation.</p></template>

<template data-pop="k80-enterohep" data-title="Cycle entéro-hépatique des acides biliaires">
<div class="lab">Normal</div><p>Le foie sécrète les acides biliaires dans la bile. Ils émulsionnent les graisses dans l’intestin, puis environ 95 % sont réabsorbés dans l’iléon terminal et retournent au foie par la veine porte. Le même stock circule plusieurs fois par jour.</p>
<div class="lab">Régulation</div><p>Les acides biliaires réabsorbés activent le récepteur FXR de l’entérocyte, qui libère FGF19. Cette hormone freine dans le foie la cholestérol 7-alpha-hydroxylase, première enzyme de la synthèse des acides biliaires.</p>
<div class="lab">Perturbation</div><p>Une maladie de Crohn iléale ou une résection iléale fait perdre les acides biliaires. Le foie ne compense pas entièrement : la bile manque de solvant et devient lithogène.</p>
<div class="lab">Conséquence pratique</div><p>Un patient opéré d’une résection iléale étendue a un risque accru de calculs de cholestérol et de calculs pigmentaires.</p></template>

<template data-pop="k80-cck" data-title="Cholécystokinine">
<div class="lab">Définition</div><p>La cholécystokinine est une hormone peptidique sécrétée par les cellules I du duodénum et du jéjunum.</p>
<div class="lab">Stimulus et effets</div><p>Les acides gras et les acides aminés du chyme déclenchent sa sécrétion. Elle contracte la vésicule, relâche le sphincter d’Oddi et stimule la sécrétion enzymatique pancréatique.</p>
<div class="lab">Corrélation clinique</div><p>Un repas gras provoque la contraction vésiculaire qui pousse le calcul dans le collet : la colique suit souvent le repas du soir. Les analogues de la somatostatine inhibent cette sécrétion et favorisent le sludge.</p></template>

<template data-pop="k80-calot" data-title="Triangle de Calot et triangle hépatocystique">
<div class="lab">Définition</div><p>Le triangle hépatocystique est limité par le canal cystique, le canal hépatique commun et le bord inférieur du foie. Le triangle de Calot décrit à l’origine avait pour bord supérieur l’artère cystique ; l’usage chirurgical actuel retient la définition hépatocystique.</p>
<div class="lab">Contenu</div><p>Il contient l’artère cystique, parfois l’artère hépatique droite et le ganglion cystique.</p>
<div class="lab">Importance</div><p>La dissection de ce triangle permet d’obtenir la vue critique de sécurité. Une inflammation sévère efface ses plans et explique le risque de lésion de la voie biliaire principale en cas de cholécystite.</p></template>

<template data-pop="k80-mnemo" data-title="Les « cinq F » — aide pédagogique, non critère officiel">
<div class="lab">Contenu</div><p>La formule anglaise des « cinq F » associe <i>female</i> (sexe féminin), <i>forty</i> (environ 40 ans), <i>fertile</i> (multiparité), <i>fat</i> (obésité) et <i>fair</i> (origine européenne). Elle rappelle des facteurs de risque des calculs de cholestérol.</p>
<div class="lab">Limites</div><p>Cette formule est une aide pédagogique, non un critère officiel. Elle oublie la perte de poids rapide, le jeûne, l’hérédité, l’hémolyse et la cirrhose. Elle ne doit jamais faire écarter une lithiase chez un homme mince ou un enfant hémolytique.</p></template>

<template data-pop="k80-alith" data-title="Cholécystite alithiasique">
<div class="lab">Définition</div><p>C’est une inflammation aiguë de la vésicule sans calcul, codée K81.0. Elle représente une minorité des cholécystites et touche surtout des patients graves.</p>
<div class="lab">Mécanisme</div><p>La stase biliaire (jeûne, opioïdes, ventilation mécanique) et l’ischémie de la paroi (choc, vasopresseurs) agissent ensemble. La bile concentrée lèse la muqueuse ischémique, puis l’infection et la gangrène suivent.</p>
<div class="lab">Terrains</div><p>Les patients de réanimation, les polytraumatisés, les grands brûlés, les patients sous nutrition parentérale et après chirurgie lourde sont concernés. Des infections, comme celles à cytomégalovirus chez l’immunodéprimé, et des vascularites peuvent aussi en être la cause.</p>
<div class="lab">Diagnostic et traitement</div><p>L’échographie au lit montre une vésicule distendue à paroi épaisse avec sludge. Le traitement associe antibiotiques et drainage percutané, ou cholécystectomie si l’état le permet. La gangrène est plus fréquente que dans la forme lithiasique.</p></template>

<template data-pop="k80-ceftri" data-title="Pseudolithiase à la ceftriaxone">
<div class="lab">Mécanisme</div><p>La ceftriaxone est éliminée en partie dans la bile. À forte concentration, elle précipite avec le calcium sous forme d’un sel insoluble dans la vésicule.</p>
<div class="lab">Clinique</div><p>Le précipité ressemble à un sludge ou à un calcul à l’échographie. Il est souvent asymptomatique, plus fréquent chez l’enfant et à dose élevée, et peut rarement provoquer une douleur biliaire ou une pancréatite.</p>
<div class="lab">Conduite</div><p>Le précipité disparaît en général après l’arrêt. Une image nouvelle sous ceftriaxone ne justifie pas une cholécystectomie.</p></template>

<template data-pop="k80-emphys" data-title="Cholécystite emphysémateuse">
<div class="lab">Définition</div><p>C’est une cholécystite avec de l’air dans la paroi ou la lumière vésiculaire, dû à des germes producteurs de gaz, notamment <i>Clostridium</i> et des entérobactéries.</p>
<div class="lab">Mécanisme</div><p>Une ischémie de la paroi, favorisée par la microangiopathie diabétique, permet la prolifération anaérobie.</p>
<div class="lab">Gravité</div><p>Selon les TG18, elle fait partie des inflammations locales marquées qui classent la cholécystite au moins en grade II. Le risque de gangrène et de perforation est élevé.</p>
<div class="lab">Conduite</div><p>La tomodensitométrie confirme l’air. La cholécystectomie urgente et une antibiothérapie couvrant les anaérobies s’imposent ; l’antibiothérapie se poursuit 4 à 7 jours selon les TG18.</p></template>

<template data-pop="k80-mirizzi" data-title="Syndrome de Mirizzi">
<div class="lab">Définition</div><p>Un calcul enclavé dans le collet ou le canal cystique comprime le canal hépatique commun ou l’érode jusqu’à créer une fistule.</p>
<div class="lab">Classification</div><p>La classification de Csendes (1989) distingue la compression extrinsèque (type I) et des fistules cholécysto-biliaires de taille croissante (types II à IV). L’EASL 2016 souligne la fréquence de la conversion en laparotomie dans le type II.</p>
<div class="lab">Clinique</div><p>L’ictère et la cholestase apparaissent pendant une cholécystite, alors que le cholédoque bas reste fin et vide. L’imagerie montre une dilatation des voies intrahépatiques en amont du collet.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic préopératoire par cholangio-IRM prépare le chirurgien : la dissection classique expose à sectionner la voie biliaire principale.</p></template>

<template data-pop="k80-ileus" data-title="Iléus biliaire et syndrome de Bouveret">
<div class="lab">Mécanisme</div><p>Une inflammation répétée colle la vésicule au duodénum et crée une fistule cholécysto-duodénale (K82.3). Un calcul volumineux passe dans l’intestin et s’enclave dans la partie la plus étroite, habituellement l’iléon terminal.</p>
<div class="lab">Clinique et imagerie</div><p>La patiente type est une femme âgée avec une occlusion du grêle sans antécédent chirurgical. La triade de Rigler associe aérobilie, occlusion du grêle et calcul ectopique ; la tomodensitométrie la montre.</p>
<div class="lab">Syndrome de Bouveret</div><p>Le calcul s’arrête dans le duodénum ou le pylore et provoque des vomissements par obstruction de la vidange gastrique.</p>
<div class="lab">Traitement</div><p>L’entérotomie extrait le calcul. La cure de la fistule se discute selon l’état du patient, souvent dans un second temps.</p></template>

<template data-pop="k80-pancbil" data-title="Pancréatite biliaire : repères">
<div class="lab">Mécanisme</div><p>Un calcul ou du sludge obstrue l’ampoule de Vater. Le reflux biliaire et l’hyperpression canalaire activent prématurément les enzymes pancréatiques.</p>
<div class="lab">Diagnostic</div><p>La lipase dépasse trois fois la normale avec une douleur typique. Des calculs vésiculaires et une élévation des ALAT au-delà de trois fois la normale orientent vers l’origine biliaire.</p>
<div class="lab">Essais clés</div><p>L’essai PONCHO (The Lancet, 2015) a comparé chez 266 patients avec pancréatite biliaire légère la cholécystectomie pendant la même hospitalisation et à 25 à 30 jours : les complications biliaires récidivantes ou le décès passaient de 17 % à 5 % (risque relatif 0,28). L’essai APEC (The Lancet, 2020) a montré qu’une CPRE urgente dans les 24 heures n’améliorait pas le critère composite dans la pancréatite biliaire prédite sévère sans cholangite.</p>
<div class="lab">Conséquence pratique</div><p>La cholécystectomie se fait pendant la même hospitalisation dans la forme légère. La CPRE est réservée à la cholangite ou à la cholestase persistante. La prise en charge complète relève de K85 — Pancréatite aiguë (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k80-charcot" data-title="Cholangite lithiasique : repères">
<div class="lab">Clinique</div><p>La triade de Charcot associe fièvre avec frissons, ictère et douleur de l’hypochondre droit. La pentade de Reynolds y ajoute une hypotension et une confusion.</p>
<div class="lab">Gravité TG18 citée par l’ESGE 2019</div><p>La forme sévère comporte une défaillance d’organe. La forme modérée comporte l’un des critères suivants : leucocytes supérieurs à 12 G/L ou inférieurs à 4 G/L, fièvre d’au moins 39 °C, âge d’au moins 75 ans, bilirubine totale d’au moins 5 mg/dL (85 µmol/L) ou hypoalbuminémie. La forme légère ne comporte aucun de ces critères.</p>
<div class="lab">Délai du drainage (ESGE 2019)</div><p>Le drainage, de préférence endoscopique, se fait le plus tôt possible et dans les 12 heures en cas de choc septique dans la forme sévère, dans les 48 à 72 heures dans la forme modérée, et de façon élective dans la forme légère.</p>
<div class="lab">Renvoi</div><p>Le diagnostic complet, l’antibiothérapie et les cholangites non lithiasiques sont traités dans K83 — Cholangites et autres maladies des voies biliaires (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k80-courvoisier" data-title="Loi de Courvoisier-Terrier">
<div class="lab">Énoncé</div><p>Chez un patient ictérique, une vésicule distendue, palpable et indolore oriente vers une obstruction tumorale basse de la voie biliaire principale plutôt que vers une lithiase.</p>
<div class="lab">Mécanisme</div><p>Une lithiase ancienne a fibrosé la vésicule, qui ne peut plus se distendre. Une tumeur de la tête du pancréas obstrue progressivement le cholédoque sous une vésicule restée souple, qui se dilate.</p>
<div class="lab">Limites</div><p>C’est une règle d’orientation, non un critère : des exceptions existent dans les deux sens. L’imagerie tranche toujours.</p></template>

<template data-pop="k80-murphy" data-title="Signe de Murphy">
<div class="lab">Technique</div><p>Le médecin place les doigts sous le rebord costal droit, au niveau du bord latéral du muscle droit, puis demande une inspiration profonde. Le signe est positif si le patient interrompt brutalement son inspiration à cause de la douleur.</p>
<div class="lab">Mécanisme</div><p>L’inspiration abaisse le foie et pousse la vésicule inflammatoire contre les doigts ; le contact du péritoine pariétal irrité déclenche la douleur.</p>
<div class="lab">Valeur</div><p>Dans la revue de Trowbridge (2003), le rapport de vraisemblance positif est de 2,8, avec un intervalle de confiance à 95 % de 0,8 à 8,6. Aucun signe isolé ne permet d’affirmer ou d’exclure la cholécystite.</p>
<div class="lab">Variante échographique</div><p>Le signe de Murphy échographique est la douleur maximale lorsque la sonde comprime la vésicule repérée. C’est un critère d’imagerie des TG18.</p>
<div class="lab">Piège</div><p>Le signe peut manquer chez le sujet âgé, le patient sous antalgiques ou en cas de gangrène, où l’innervation de la paroi est détruite.</p></template>

<template data-pop="k80-difdiag" data-title="Diagnostic différentiel de la douleur de l’hypochondre droit">
<div class="lab">Urgences vitales à éliminer d’abord</div><p>Le syndrome coronarien aigu inférieur se reconnaît à l’électrocardiogramme et à la troponine. L’ulcère perforé se reconnaît au pneumopéritoine. La pancréatite aiguë se reconnaît à une lipase supérieure à trois fois la normale. La rupture d’un anévrisme aortique se reconnaît chez un patient âgé hypotendu.</p>
<div class="lab">Causes abdominales</div><p>L’appendicite sous-hépatique, l’abcès hépatique, l’hépatite aiguë, la colique néphrétique et la pyélonéphrite droite simulent une douleur biliaire.</p>
<div class="lab">Causes thoraciques et pelviennes</div><p>La pneumonie de la base droite et l’embolie pulmonaire peuvent donner une douleur sous-costale. La périhépatite à gonocoque ou à chlamydia (syndrome de Fitz-Hugh-Curtis) touche la femme jeune avec une infection génitale haute.</p>
<div class="lab">Grossesse</div><p>Le syndrome HELLP et la stéatose aiguë gravidique donnent une douleur épigastrique ou de l’hypochondre droit au troisième trimestre ; la pression artérielle, les plaquettes et les transaminases les distinguent.</p></template>
