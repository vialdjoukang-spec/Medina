<!-- ===== FENÊTRES K85 : stratégies, sources et essais ===== -->
<template data-pop="k85-fluid" data-title="Remplissage dans la pancréatite aiguë">
<div class="lab">Rationnel</div><p>La fuite capillaire, les vomissements et le jeûne réduisent le volume circulant ; l’hypoperfusion pancréatique peut transformer un œdème en nécrose, et l’hypoperfusion rénale conduit à l’insuffisance rénale. Le remplissage précoce vise à interrompre ce cercle.</p>
<div class="lab">Schéma actuel</div><p>Ringer lactate à 1,5 mL/kg/h ; bolus de 10 mL/kg en cas d’hypovolémie ou d’hypotension ; réévaluation à la troisième heure puis à 12, 24, 48 et 72 heures (IAP 2025, ACG 2024, protocole de l’essai WATERFALL).</p>
<div class="lab">Cibles</div><p>Pression artérielle moyenne de 65 à 85 mmHg, diurèse d’au moins 0,5 mL/kg/h, urée inférieure à 7,1 mmol/L, hématocrite inférieur à 44 % (IAP 2025, bonne pratique).</p>
<div class="lab">Limites</div><p>Le bénéfice du remplissage est surtout plausible dans les 24 premières heures ; aucun essai n’a montré qu’un objectif biologique précis réduise la mortalité. L’ACG 2024 souligne que les revues d’essais de remplissage guidé par objectifs ne prouvent pas de réduction des défaillances persistantes ni de la mortalité.</p>
<div class="lab">Piège</div><p>Chez le patient âgé, cardiaque ou rénal, les volumes sont réduits et la surveillance des signes de surcharge est renforcée.</p></template>
<template data-pop="k85-src-fluid" data-title="Choix de la source : remplissage (contentieux)">
<div class="lab">Source retenue</div><p><b>IAP 2025</b> (Pancreatology 2025;25:770–814, consultée en texte intégral le 08.10.2026). Recommandation 10 : Ringer lactate (forte, niveau modéré). Recommandation 11 : débit modéré de 1,5 mL/kg/h, bolus en cas d’hypovolémie ou d’hypotension (forte, niveau modéré). Périmètre : adultes atteints de pancréatite aiguë, toutes causes, approuvé par des sociétés américaine, européenne, indienne et japonaise.</p>
<div class="lab">Textes antérieurs encore cités</div><p><b>ACG 2024</b> : remplissage « modérément agressif », Ringer lactate préféré (recommandations conditionnelles, niveau faible) ; 1,5 mL/kg/h sans hypovolémie, bolus de 10 mL/kg en cas d’hypovolémie, souvent 3 à 4 litres pendant les 24 premières heures selon l’IMC. <b>AGA 2018</b> : remplissage guidé par objectifs (conditionnel, niveau très faible) ; aucune préférence entre Ringer lactate et chlorure de sodium ; pas d’hydroxyéthylamidon. <b>IAP/APA 2013</b> et <b>ACG 2013</b> : remplissage plus agressif dans les premières heures ; ces débits élevés sont antérieurs à l’essai WATERFALL.</p>
<div class="lab">Pourquoi la source la plus récente l’emporte</div><p>L’IAP 2025 intègre l’essai contrôlé WATERFALL (2022), qui a montré davantage de surcharge hydrique sans bénéfice avec un remplissage agressif. Son contenu a été lu ; sa population correspond à celle des patients suisses hospitalisés. L’ACG 2024 converge sur le débit. Le texte de l’AGA 2018 reste en vigueur dans son pays mais précède les preuves décisives.</p>
<div class="lab">Limites</div><p>WATERFALL a été arrêté à l’analyse intermédiaire avec 249 patients ; son critère principal n’était pas significatif. Ses résultats ne s’appliquent pas directement au patient en choc établi ni à l’insuffisant cardiaque sévère, dont le remplissage relève de la réanimation individualisée.</p>
<div class="lab">Information professionnelle suisse</div><p>Ringer lactate « Bichsel » et Ringerlactat B. Braun (mai 2024) fixent 2 000 mL par jour en routine et autorisent davantage dans les états de choc. Le débit de 1,5 mL/kg/h dépasse ce plafond chez un adulte de plus de 55 kg ; il s’agit d’un usage guidé par la recommandation, sous surveillance clinique et biologique.</p></template>
<template data-pop="k85-waterfall" data-title="Essai WATERFALL (2022)">
<div class="lab">Nom</div><p>Nom d’essai choisi par les auteurs, non développable lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé ouvert dans 18 centres (de-Madaria, New England Journal of Medicine 2022). Remplissage agressif par Ringer lactate (bolus de 20 mL/kg puis 3 mL/kg/h) contre remplissage modéré (bolus de 10 mL/kg en cas d’hypovolémie, aucun bolus sinon, puis 1,5 mL/kg/h), ajusté à 12, 24, 48 et 72 heures.</p>
<div class="lab">Résultats</div><p>Arrêt à l’analyse intermédiaire de 249 patients. Pancréatite modérément sévère ou sévère : 22,1 % contre 17,3 % (différence non significative). Surcharge hydrique : 20,5 % contre 6,3 % (risque relatif ajusté 2,85). Durée médiane de séjour : 6 contre 5 jours.</p>
<div class="lab">Portée</div><p>Le remplissage agressif n’apporte aucun bénéfice et expose à la surcharge. L’essai fonde le débit de 1,5 mL/kg/h de l’IAP 2025 et de l’ACG 2024.</p></template>
<template data-pop="k85-stepup" data-title="Approche graduée de la nécrose infectée">
<div class="lab">Principe</div><p>Monter les marches d’invasivité seulement en cas d’échec de la marche précédente : antibiotiques, puis drainage percutané ou endoscopique, puis nécrosectomie mini-invasive.</p>
<div class="lab">Calendrier</div><p>L’intervention est différée, si possible, jusqu’à l’encapsulation (environ 3 à 4 semaines), car une nécrose limitée et liquéfiée se draine mieux et saigne moins. Un drainage plus précoce est possible chez le patient qui s’aggrave, si la collection est au moins partiellement encapsulée (IAP 2025).</p>
<div class="lab">Preuves</div><p>PANTER (2010) contre la nécrosectomie ouverte ; TENSION (2018) entre voies endoscopique et chirurgicale ; POINTER (2021) sur le moment du drainage.</p>
<div class="lab">Choix de la voie</div><p>Selon le siège de la collection et l’expertise : voie endoscopique transgastrique pour une collection au contact de l’estomac, voie percutanée rétropéritonéale pour une collection latérale. Prothèse métallique d’apposition luminale préférée si la nécrose encapsulée est infectée ou si la nécrose occupe plus de 30 % de la collection.</p>
<div class="lab">Conséquence pratique</div><p>Ces patients relèvent d’un centre expérimenté ; l’IAP 2025 recommande le transfert si l’expertise manque.</p></template>
<template data-pop="k85-analgesie" data-title="Stratégie d’analgésie">
<div class="lab">Évaluer</div><p>Échelle numérique de 0 à 10 répétée ; l’UEG 2026 la préfère pour son observance. La douleur est réévaluée après chaque dose.</p>
<div class="lab">Traiter</div><p>Douleur légère à modérée : paracétamol, métamizole, éventuellement anti-inflammatoire non stéroïdien chez un patient sans atteinte rénale. Douleur sévère : opioïde d’emblée, avec une démarche de désescalade ensuite (UEG 2026). Les opioïdes forts réduisent le besoin d’analgésie de secours par rapport aux non-opioïdes.</p>
<div class="lab">Sécurité</div><p>Les données ne montrent pas de manière constante qu’un opioïde aggrave la pancréatite ; les craintes de sécurité ne doivent pas retarder son emploi (UEG 2026). L’analgésie autocontrôlée intraveineuse se manie avec prudence. Les anti-inflammatoires non stéroïdiens peuvent aggraver une atteinte rénale.</p>
<div class="lab">Péridurale</div><p>Elle soulage mieux la douleur des formes sévères ; l’UEG 2026 la recommande lorsque l’expertise existe pour le contrôle de la douleur, mais son effet sur les complications reste incertain. Un essai de 148 patients, cité par l’IAP 2025, n’a pas montré de bénéfice sur les jours sans ventilation.</p></template>
<template data-pop="k85-nutrition" data-title="Nutrition dans la pancréatite aiguë">
<div class="lab">Forme légère à modérée</div><p>Réalimentation orale dès que le patient a faim et ne vomit plus, d’emblée par un repas solide pauvre en graisses (IAP 2025, recommandation forte). L’ACG 2024 et l’AGA 2018 proposent une réalimentation dans les 24 à 48 heures. Le passage progressif par des liquides clairs n’apporte rien et allonge le séjour.</p>
<div class="lab">Forme sévère ou intolérance</div><p>Nutrition entérale par sonde, de préférence dans les 72 heures, avec une formule polymérique, par voie nasogastrique ou nasojéjunale (IAP 2025). La voie nasogastrique est plus simple ; le patient est demi-assis pour limiter l’inhalation.</p>
<div class="lab">Délai</div><p>Dans l’essai PYTHON (2014), une sonde posée dans les 24 heures n’a pas réduit les infections ni la mortalité par rapport à une alimentation orale tentée à 72 heures puis par sonde si nécessaire (ACG 2024 : infections 25 % contre 26 %).</p>
<div class="lab">Parentérale</div><p>Réservée aux situations où la voie entérale ne couvre pas les besoins. Elle augmente les infections liées au cathéter ; les émulsions lipidiques sont proscrites au-delà de 4,5 mmol/L de triglycérides.</p></template>
<template data-pop="k85-cpre" data-title="Cholangiopancréatographie rétrograde endoscopique">
<div class="lab">Technique</div><p>Un duodénoscope atteint la papille ; un cathéter cathétérise la voie biliaire sur fil-guide, puis une sphinctérotomie permet d’extraire les calculs ou de poser une prothèse.</p>
<div class="lab">Indications dans la pancréatite</div><p>Cholangite associée : CPRE précoce, dans les 24 heures selon l’ACG 2024. Calcul résiduel démontré par cholangio-IRM ou échoendoscopie : CPRE élective. Patient inopérable : sphinctérotomie pour prévenir la récidive.</p>
<div class="lab">Non-indications</div><p>CPRE précoce sans cholangite, dans la forme légère comme dans la forme prédite sévère (IAP 2025). CPRE diagnostique.</p>
<div class="lab">Risque</div><p>La pancréatite est sa complication la plus fréquente ; le risque est plus élevé avec une voie biliaire fine et une bilirubine normale (ACG 2024). Prévention : remplissage par Ringer lactate, anti-inflammatoire non stéroïdien rectal, prothèse pancréatique chez le patient à haut risque.</p></template>
<template data-pop="k85-apec" data-title="Essai APEC (2020)">
<div class="lab">Nom</div><p>Nom d’essai formé à partir de l’intitulé anglais (pancréatite biliaire aiguë, cholangiopancréatographie urgente avec sphinctérotomie contre traitement conservateur), non développable lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé multicentrique néerlandais (Schepers, Lancet 2020) : CPRE urgente avec sphinctérotomie dans les 24 heures contre traitement conservateur chez des patients atteints de pancréatite biliaire prédite sévère sans cholangite.</p>
<div class="lab">Résultats</div><p>Pas de réduction des complications majeures ni de la mortalité. Les cholangites ont été moins fréquentes après CPRE urgente (2 % contre 10 %), et 41 % des patients du groupe conservateur ont eu une CPRE pendant le même séjour (IAP 2025).</p>
<div class="lab">Portée</div><p>La CPRE n’est pas systématique ; une surveillance de la cholestase et de la fièvre guide la décision.</p></template>
<template data-pop="k85-poncho" data-title="Essai PONCHO (2015)">
<div class="lab">Nom</div><p>Nom d’essai formé à partir de l’intitulé anglais (pancréatite d’origine biliaire, moment optimal de la cholécystectomie), non développable lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé multicentrique néerlandais (da Costa, Lancet 2015) : cholécystectomie pendant la même hospitalisation contre cholécystectomie différée après une pancréatite biliaire légère.</p>
<div class="lab">Résultat</div><p>La cholécystectomie précoce a réduit les réadmissions pour complication biliaire, sans augmenter les difficultés opératoires ; elle est aussi coût-efficace.</p>
<div class="lab">Portée</div><p>L’IAP 2025 recommande la cholécystectomie pendant l’hospitalisation initiale après une forme biliaire légère (recommandation forte). Elle est différée après une forme avec collections.</p></template>
<template data-pop="k85-pointer" data-title="Essai POINTER (2021)">
<div class="lab">Nom</div><p>Nom d’essai formé à partir de l’intitulé anglais (drainage différé ou immédiat de la pancréatite nécrosante infectée), non développable lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé néerlandais : drainage percutané ou endoscopique dans les 24 heures du diagnostic d’infection, contre drainage différé jusqu’à l’encapsulation, au-delà de quatre semaines, sous antibiotiques.</p>
<div class="lab">Résultats</div><p>Pas de différence sur l’indice global de complications. Le drainage immédiat a exigé davantage d’interventions ; une nécrosectomie a été nécessaire chez 51 % contre 22 % des patients. Dans le groupe différé, 39 % ont guéri par antibiotiques seuls (IAP 2025).</p>
<div class="lab">Portée</div><p>Le drainage peut attendre l’encapsulation chez un patient stable ; il n’est pas dangereux de drainer plus tôt un patient qui s’aggrave.</p></template>
<template data-pop="k85-panter" data-title="Essai PANTER (2010)">
<div class="lab">Nom</div><p>Nom d’essai formé à partir de l’intitulé anglais (pancréatite, nécrosectomie contre approche graduée), non développable lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé multicentrique (van Santvoort, New England Journal of Medicine 2010) chez 88 patients avec nécrose infectée : nécrosectomie ouverte d’emblée contre approche graduée (drainage percutané puis, si nécessaire, nécrosectomie rétropéritonéale vidéo-assistée).</p>
<div class="lab">Résultats</div><p>Complications majeures ou décès : 40 % avec l’approche graduée contre 69 % avec la nécrosectomie ouverte. Environ un tiers des patients du bras gradué n’ont eu besoin que d’un drainage. Les défaillances multiviscérales nouvelles et les coûts ont diminué.</p>
<div class="lab">Portée</div><p>Fondement de l’approche graduée, recommandée par l’IAP 2025 avec un niveau de preuve élevé.</p></template>
<template data-pop="k85-tension" data-title="Essai TENSION (2018)">
<div class="lab">Nom</div><p>Acronyme anglais de l’essai comparant les approches graduées endoscopique transluminale et chirurgicale mini-invasive, non strictement lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé néerlandais (van Brunschot, Lancet 2018) chez des patients avec nécrose infectée : drainage endoscopique transgastrique puis nécrosectomie endoscopique, contre drainage percutané puis nécrosectomie rétropéritonéale vidéo-assistée.</p>
<div class="lab">Résultats</div><p>Pas de différence sur les complications majeures ou le décès. La voie endoscopique a donné moins de fistules pancréatiques et une hospitalisation plus courte.</p>
<div class="lab">Portée</div><p>Les deux voies sont acceptables ; le choix dépend du siège de la collection et de l’expertise locale (IAP 2025).</p></template>
<template data-pop="k85-propatria" data-title="Essai PROPATRIA (2008)">
<div class="lab">Nom</div><p>Nom d’essai formé à partir de l’intitulé anglais (probiotiques dans la pancréatite), non développable lettre à lettre.</p>
<div class="lab">Plan</div><p>Essai randomisé en double aveugle (Besselink, Lancet 2008) : mélange de probiotiques par sonde entérale contre placebo dans la pancréatite prédite sévère.</p>
<div class="lab">Résultats</div><p>Les infections n’ont pas diminué ; la mortalité a été plus élevée dans le groupe probiotiques, avec des cas d’ischémie intestinale absents du groupe placebo.</p>
<div class="lab">Portée</div><p>L’IAP 2025 déconseille les probiotiques avec une recommandation forte fondée sur des preuves de niveau élevé.</p></template>
