<!-- ===== FENÊTRES K85 : monographies ===== -->
<template data-pop="k85-d-rl" data-title="Ringer lactate et chlorure de sodium à 0,9 %">
<div class="lab">Composition</div><p>Ringer lactate « Bichsel » sans glucose, par litre : sodium 131 mmol, potassium 4 mmol, calcium 1,5 mmol, chlorure 110 mmol, lactate 28 mmol (information professionnelle suisse, mai 2024). Le chlorure de sodium à 0,9 % contient 154 mmol de sodium et 154 mmol de chlorure par litre.</p>
<div class="lab">Mécanisme</div><p>Cristalloïde isotonique qui restaure le volume extracellulaire. Le lactate est métabolisé par le foie en bicarbonate ; la charge en chlorure plus faible évite l’acidose hyperchlorémique des grands volumes de chlorure de sodium (ACG 2024).</p>
<div class="lab">Preuves</div><p>Trois essais randomisés cités par l’ACG 2024 montrent moins de SIRS et moins d’admissions en soins intensifs avec le Ringer lactate. L’IAP 2025 le recommande (forte, niveau modéré).</p>
<div class="lab">Posologie</div><p>1,5 mL/kg/h ; bolus de 10 mL/kg si hypovolémie ; ajustement aux cibles. L’information professionnelle fixe 2 000 mL par jour en routine et autorise davantage dans les états de choc.</p>
<div class="lab">Contre-indications</div><p>Hyperhydratation, hyperkaliémie, hypernatrémie, hyperchlorémie, alcalose, hyperlactatémie, atteinte hépatique sévère, insuffisance rénale sévère, insuffisance cardiaque décompensée (information professionnelle). Hypercalcémie : chlorure de sodium à 0,9 % (IAP 2025).</p>
<div class="lab">Grossesse</div><p>Aucune donnée clinique selon l’information professionnelle ; emploi prudent, le bénéfice d’une volémie correcte pour la mère et le fœtus primant.</p></template>
<template data-pop="k85-d-para" data-title="Paracétamol par voie intraveineuse">
<div class="lab">Mécanisme</div><p>Inhibition centrale de la synthèse des prostaglandines ; effet antalgique et antipyrétique sans effet anti-inflammatoire périphérique notable ni toxicité rénale.</p>
<div class="lab">Posologie</div><p>Adulte de plus de 50 kg : 1 g en perfusion de 10 à 15 minutes, jusqu’à 4 fois par jour, intervalle d’au moins 4 heures, 4 g par jour au maximum. Hépatopathie, alcoolisme chronique, dénutrition, déshydratation ou cachexie : 2 g par jour au maximum. Durée intraveineuse : 2 jours au plus, puis relais oral (Paracetamol Sintetica, information professionnelle suisse, août 2025).</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité en surdosage, d’autant plus que les réserves de glutathion sont basses : patient alcoolique, dénutri, à jeun.</p>
<div class="lab">Piège</div><p>Le patient de pancréatite alcoolique cumule alcoolisme, jeûne et souvent dénutrition : le plafond de 2 g s’applique.</p></template>
<template data-pop="k85-d-meta" data-title="Métamizole">
<div class="lab">Mécanisme</div><p>Pyrazolone antalgique et antipyrétique, faible inhibiteur des prostaglandines, avec un effet spasmolytique.</p>
<div class="lab">Posologie</div><p>Adulte : 500 à 1 000 mg par prise, 3 à 4 prises par jour, 4 000 mg par jour au maximum (Novalgin, information professionnelle suisse, mars 2025). Par voie intraveineuse, l’injection est très lente, 1 mL par minute au plus.</p>
<div class="lab">Effets indésirables</div><p>Agranulocytose idiosyncrasique, réactions anaphylactiques plus fréquentes par voie parentérale, hypotension isolée surtout en cas d’hypovolémie, atteintes hépatiques immunoallergiques, réactions cutanées graves.</p>
<div class="lab">Contre-indications</div><p>Agranulocytose antérieure aux pyrazolones, atteinte médullaire, porphyrie hépatique, déficit en glucose-6-phosphate déshydrogénase, intolérance aux analgésiques ; troisième trimestre de la grossesse ; allaitement à interrompre 48 heures.</p>
<div class="lab">Dans la pancréatite</div><p>Utile en association ; à injecter seulement après correction de la volémie, en raison du risque d’hypotension.</p></template>
<template data-pop="k85-d-opio" data-title="Opioïdes dans la pancréatite aiguë">
<div class="lab">Mécanisme</div><p>Agonistes des récepteurs opioïdes mu ; la buprénorphine est un agoniste partiel.</p>
<div class="lab">Preuves</div><p>Les opioïdes, notamment la buprénorphine, réduisent le besoin d’analgésie de secours par rapport aux non-opioïdes ; les essais sont petits et hétérogènes (UEG 2026).</p>
<div class="lab">Posologie</div><p>Morphine chlorhydrate par voie intraveineuse : 2,5 mg toutes les 5 minutes jusqu’au soulagement ; perfusion : charge de 5 à 15 mg en 30 minutes puis 2,5 à 5 mg/h ; analgésie autocontrôlée : 1 à 1,5 mg avec 5 à 15 minutes de période réfractaire (chlorhydrate de morphine « Bichsel », février 2024). Buprénorphine sublinguale : 0,4 mg toutes les 6 à 8 heures (Temgesic, mars 2025). Hydromorphone orale : 2 mg toutes les 4 à 6 heures, jusqu’à 4 mg toutes les 3 à 6 heures (Palladon gouttes, mars 2024).</p>
<div class="lab">Effets indésirables et surveillance</div><p>Dépression respiratoire, sédation, nausées, iléus. Surveillance de la fréquence respiratoire et de la vigilance ; naloxone disponible. En insuffisance rénale, les métabolites actifs de la morphine s’accumulent : réduire les doses ou choisir une autre molécule.</p></template>
<template data-pop="k85-d-diclo" data-title="Diclofénac">
<div class="lab">Mécanisme</div><p>Anti-inflammatoire non stéroïdien, inhibiteur des cyclo-oxygénases ; il diminue les prostaglandines et l’activation des phospholipases.</p>
<div class="lab">Indication dans la pancréatite</div><p>Prévention de la pancréatite après CPRE : indométacine ou diclofénac par voie rectale chez tous les patients à risque moyen ou élevé (IAP 2025, recommandation forte). Dose de 100 mg en suppositoire autour du geste ; en Suisse, l’indométacine n’existe qu’en capsules à libération prolongée et cette prophylaxie par diclofénac est hors indication.</p>
<div class="lab">Posologie antalgique</div><p>Suppositoires de 12,5, 25, 50 et 100 mg ; 100 à 150 mg par jour en 2 à 3 prises, 150 mg par jour au maximum (Voltaren, information professionnelle suisse, avril 2026).</p>
<div class="lab">Contre-indications et précautions</div><p>Insuffisance rénale, hypovolémie non corrigée, cardiopathie ischémique, insuffisance cardiaque, ulcère actif, troisième trimestre de la grossesse. Ces situations sont fréquentes dans la pancréatite sévère : l’UEG 2026 rappelle le risque rénal.</p></template>
<template data-pop="k85-d-atb" data-title="Antibiotiques de la nécrose infectée">
<div class="lab">Indications</div><p>Nécrose infectée suspectée ou prouvée, cholangite, infection extrapancréatique documentée. Jamais en prophylaxie (IAP 2025).</p>
<div class="lab">Choix</div><p>Molécules pénétrant la nécrose : carbapénèmes, uréidopénicillines, céphalosporines de troisième ou quatrième génération, quinolones, métronidazole (IAP 2025, ACG 2024). Le choix tient compte de l’écologie locale et des cultures.</p>
<div class="lab">Méropénem</div><p>500 mg à 1 g toutes les 8 heures, 6 g par jour au maximum ; clairance de 26 à 50 mL/min : dose unitaire toutes les 12 heures ; 10 à 25 mL/min : demi-dose toutes les 12 heures ; moins de 10 mL/min : demi-dose toutes les 24 heures ; aucune adaptation hépatique (Meronem, février 2026). Interaction : baisse de 60 à 100 % de l’acide valproïque en environ 2 jours, association déconseillée.</p>
<div class="lab">Pipéracilline-tazobactam</div><p>2,25 à 4,5 g 3 à 4 fois par jour, adaptation à la fonction rénale, aucune adaptation hépatique (Piperacillin/Tazobactam Sandoz, mars 2026).</p>
<div class="lab">Durée et surveillance</div><p>La durée dépend du contrôle de la source ; une antibiothérapie empirique est arrêtée si les cultures sont négatives et qu’aucune source n’est trouvée (ACG 2024). Antifongiques non recommandés en routine.</p></template>
<template data-pop="k85-d-hbpm" data-title="Énoxaparine">
<div class="lab">Mécanisme</div><p>Héparine de bas poids moléculaire qui potentialise l’antithrombine contre le facteur Xa.</p>
<div class="lab">Posologie</div><p>Prophylaxie en médecine : 40 mg une fois par jour par voie sous-cutanée ; 20 mg en insuffisance rénale sévère ; durée d’au moins 6 jours, jusqu’à la mobilisation complète (Clexane, information professionnelle suisse, février 2026).</p>
<div class="lab">Dans la pancréatite</div><p>Thromboprophylaxie du patient alité. Dans l’hypertriglycéridémie, l’IAP 2025 admet un usage court de moins de 3 jours, car l’héparine libère la lipoprotéine lipase (recommandation conditionnelle).</p>
<div class="lab">Précautions</div><p>Pseudoanévrisme, hémorragie digestive, intervention prévue : le risque hémorragique est réévalué chaque jour. Contrôle des plaquettes.</p></template>
<template data-pop="k85-d-ins" data-title="Insuline dans la pancréatite hypertriglycéridémique">
<div class="lab">Mécanisme</div><p>L’insuline active la lipoprotéine lipase, qui dégrade les chylomicrons et les lipoprotéines de très basse densité ; les triglycérides baissent en quelques jours.</p>
<div class="lab">Recommandation</div><p>Insuline en première ligne chez le diabétique, à envisager chez le non-diabétique, en plus du traitement standard (IAP 2025, forte, niveau modéré).</p>
<div class="lab">Posologie</div><p>Perfusion intraveineuse d’insuline humaine rapide selon un protocole local, avec glucose chez le non-diabétique et glycémie horaire. L’information professionnelle (Actrapid, avril 2026) ne décrit pas cet usage ; aucune dose standard suisse n’est donc citée ici.</p>
<div class="lab">Surveillance</div><p>Glycémie, kaliémie, car l’insuline fait entrer le potassium dans les cellules, et triglycérides quotidiens jusqu’à moins de 5,6 mmol/L.</p></template>
<template data-pop="k85-d-enz" data-title="Enzymes pancréatiques">
<div class="lab">Indication</div><p>Insuffisance pancréatique exocrine après nécrose étendue : stéatorrhée ou dénutrition sévère avec élastase fécale inférieure à 100 µg/g (IAP 2025, recommandation conditionnelle ; le texte de l’IAP écrit « mg/g », alors que l’unité usuelle de l’élastase fécale est le µg/g).</p>
<div class="lab">Posologie</div><p>Pancréatine en microgranules gastrorésistants : 25 000 à 80 000 unités de lipase par repas principal, la moitié pour une collation, à prendre pendant ou juste après le repas ; en règle générale, pas plus de 10 000 à 12 000 unités de lipase/kg/jour (Creon, information professionnelle suisse, janvier 2025).</p>
<div class="lab">Surveillance</div><p>Poids, selles, vitamines liposolubles. Les gélules ne se croquent pas ; ouvertes, leur contenu se mélange à un aliment acide.</p></template>
