<section class="ilot" id="k85-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme R., 58 ans, se présente aux urgences à 2 heures du matin. Elle décrit une douleur épigastrique apparue brutalement six heures plus tôt, après un repas copieux. La douleur est continue, transfixiante vers le dos, et l’a fait vomir quatre fois. Elle est hypertendue et son indice de masse corporelle est de 31 kg/m². Elle boit un verre de vin par semaine. Sa fréquence cardiaque est de 112/min, sa pression artérielle de 112/68 mmHg, sa fréquence respiratoire de 22/min, sa température de 37,9 °C et sa saturation pulsée de 95 % à l’air ambiant.</p>
<p>Le laboratoire montre une lipase à 2 400 U/L, pour une limite supérieure de la normale de 60 U/L dans ce laboratoire. L’alanine aminotransférase atteint 310 U/L et la bilirubine totale 41 µmol/L. L’hématocrite est à 47 %, l’urée à 9,4 mmol/L, la créatinine à 98 µmol/L et les leucocytes à 15,8 G/L. La protéine C-réactive vaut 22 mg/L, le calcium corrigé 2,31 mmol/L et les triglycérides 1,9 mmol/L. L’échographie montre une vésicule remplie de petits calculs et une voie biliaire principale de 7 mm.</p>
<p>La question qui structure le chapitre est la suivante : <b>Mme R. a-t-elle une pancréatite aiguë, quelle en est la cause, va-t-elle évoluer vers une forme sévère, et quels gestes des premières heures, puis des premières semaines, réduisent son risque de défaillance d’organe, de nécrose infectée et de récidive ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait poser le diagnostic par deux critères sur trois, classer la gravité selon la <button class="w" data-k="k85-atlanta">classification d’Atlanta révisée (2012)</button>, rechercher la cause dès l’admission, conduire un <button class="w" data-k="k85-fluid">remplissage modéré par Ringer lactate (IAP 2025, essai WATERFALL)</button>, traiter la douleur sans retard, nourrir tôt par la bouche, s’abstenir d’antibiotiques prophylactiques, poser l’indication d’une cholangiopancréatographie rétrograde endoscopique et d’une cholécystectomie, puis appliquer l’<button class="w" data-k="k85-stepup">approche graduée (« step-up ») de la nécrose infectée</button>.</p>
<div class="key"><b>Message fondateur.</b> Aucun médicament ne bloque la cascade de la pancréatite aiguë : l’IAP 2025 ne recommande aucune thérapie ciblée. Le pronostic dépend donc de gestes de soutien bien dosés et bien chronométrés. Trop peu de liquide laisse s’installer l’hypoperfusion ; trop de liquide provoque une surcharge sans bénéfice. Une intervention trop précoce sur une nécrose non organisée augmente la mortalité ; une intervention retardée jusqu’à l’encapsulation la réduit.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="k85-trypsine">activation prématurée du trypsinogène (déclencheur intracellulaire)</button>, le <button class="w" data-k="k85-sirs">syndrome de réponse inflammatoire systémique (critères et signification)</button> et la <button class="w" data-k="k85-fuite">fuite capillaire (passage du plasma vers le troisième secteur)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="k85-1"><h2><span class="n">1</span>Définition, classification d’Atlanta et codage</h2>
<p>La pancréatite aiguë est une inflammation aiguë du pancréas. Elle naît d’une lésion des cellules acineuses, s’étend de façon variable aux tissus péripancréatiques et peut atteindre des organes à distance. Le terme « aiguë » suppose un pancréas antérieurement sain. Une poussée sur pancréatite chronique peut remplir les mêmes critères biologiques ; elle relève du cours <a href="#/entry/K86">K86 — Pancréatite chronique et autres maladies du pancréas</a>.</p>
<h3>1.1 Le diagnostic repose sur deux critères sur trois</h3>
<p>L’IAP 2025 (recommandation forte, niveau de preuve faible), l’ACG 2024 et la classification d’Atlanta révisée retiennent la même règle. Le diagnostic est posé lorsque deux des trois critères suivants sont présents : une douleur abdominale haute aiguë compatible ; une lipase ou une amylase sériques supérieures à trois fois la limite supérieure de la normale ; des signes d’inflammation pancréatique aiguë à l’imagerie. La règle évite deux erreurs : conclure sur une enzyme isolée, élevée dans d’autres maladies, et attendre un scanner chez un patient dont la clinique et la lipase suffisent.</p>
<p>Exemple : Mme R. a une douleur typique et une lipase à 40 fois la limite supérieure. Le diagnostic est posé sans tomodensitométrie. Le scanner n’ajouterait aucune information pronostique fiable à la deuxième heure, car la nécrose n’est souvent visible qu’après 72 heures.</p>
<p>La classification d’Atlanta date le début de la maladie au <b>début de la douleur</b>, et non à l’admission. Ce point compte pour trois décisions : le délai d’au moins 72 à 96 heures avant un scanner de gravité, la fenêtre de 48 heures qui sépare une défaillance d’organe transitoire d’une défaillance persistante, et le délai d’environ quatre semaines avant l’encapsulation d’une nécrose.</p>
<h3>1.2 Deux types morphologiques</h3>
<div class="two">
<div class="card"><h4>Pancréatite œdémateuse interstitielle</h4><p>Elle représente environ 80 % des cas (IAP 2025). Le pancréas est augmenté de volume et prend le contraste de façon homogène. L’œdème régresse habituellement en moins d’une semaine. Ce type correspond le plus souvent à une forme légère.</p></div>
<div class="card"><h4>Pancréatite nécrosante</h4><p>Une partie du parenchyme ou de la graisse péripancréatique meurt. L’ACG 2024 rapporte environ 45 % de nécroses purement péripancréatiques, 45 % de nécroses mixtes et 5 % de nécroses purement parenchymateuses. Une <button class="w" data-k="k85-necrose">nécrose (définition, stérile ou infectée)</button> expose aux collections tardives et à l’infection.</p></div></div>
<h3>1.3 Deux phases évolutives</h3>
<p>La <b>phase précoce</b> couvre en général la première semaine. Elle est dominée par la réponse inflammatoire systémique et par les défaillances d’organe ; la mort précoce relève de ce mécanisme. La <b>phase tardive</b> commence après la première semaine. Elle ne concerne que les formes modérément sévères ou sévères et elle est dominée par les complications locales, notamment l’infection de la nécrose. La gravité se juge donc sur la clinique pendant la première semaine, puis sur la morphologie ensuite.</p>
<h3>1.4 Trois degrés de sévérité</h3>
<p>La question clinique est la suivante : ce patient a-t-il une défaillance d’organe, et dure-t-elle plus de 48 heures ? La réponse classe la maladie et prédit la mortalité. La défaillance d’organe se mesure par le <button class="w" data-k="k85-marshall">score de Marshall modifié (respiratoire, rénal, cardiovasculaire)</button> : un score d’au moins 2 dans un des trois systèmes définit la défaillance.</p>
<table class="t"><tr><th>Sévérité (Atlanta révisée)</th><th>Défaillance d’organe</th><th>Complications locales ou systémiques</th><th>Conséquence pratique</th></tr>
<tr><td><b>Légère</b></td><td>Aucune</td><td>Aucune</td><td>Sortie habituelle en moins d’une semaine ; mortalité très faible</td></tr>
<tr><td><b>Modérément sévère</b></td><td>Transitoire, résolue en moins de 48 heures, ou absente</td><td>Collection, nécrose, ou décompensation d’une comorbidité</td><td>Hospitalisation prolongée ; surveillance des collections</td></tr>
<tr><td><b>Sévère</b></td><td>Persistante, au-delà de 48 heures, simple ou multiple</td><td>Habituellement présentes</td><td>Soins intensifs ; mortalité jusqu’à 40 % (IAP 2025)</td></tr></table>
<p>Le tableau se lit par la colonne « défaillance d’organe » d’abord. Mme R. n’a à l’admission ni hypotension, ni hypoxémie, ni insuffisance rénale : elle n’est pas encore classable. Elle sera classée « légère » si rien n’apparaît, « sévère » si une défaillance s’installe et persiste au-delà de 48 heures. L’erreur fréquente consiste à classer la sévérité à l’admission, alors qu’elle ne se confirme qu’à 48 heures.</p>
<div class="trap"><span class="k">Piège</span>La <b>sévérité</b> (Atlanta) n’est pas la <b>prédiction</b> de la sévérité. Les scores d’admission (SIRS, BISAP, hématocrite) prédisent un risque ; seule l’évolution des défaillances d’organe sur 48 heures classe la maladie. Un patient « prédit sévère » peut guérir en trois jours, et un patient « prédit léger » peut évoluer vers une défaillance multiviscérale.</div>
<h3>1.5 Complications locales : quatre collections</h3>
<p>La classification d’Atlanta nomme les collections selon deux critères : la présence de nécrose et le délai depuis le début de la douleur. Le nom choisi oriente directement la conduite.</p>
<table class="t"><tr><th>Délai depuis la douleur</th><th>Sans nécrose (forme interstitielle)</th><th>Avec nécrose (forme nécrosante)</th></tr>
<tr><td><b>Moins de 4 semaines</b></td><td>Collection liquidienne aiguë péripancréatique (APFC) : liquide homogène, sans paroi, souvent résolutive</td><td>Collection nécrotique aiguë (ANC) : contenu hétérogène, liquide et solide, sans paroi définie</td></tr>
<tr><td><b>Plus de 4 semaines</b></td><td><button class="w" data-k="k85-pseudokyste">Pseudokyste (paroi bien définie, contenu liquide)</button></td><td>Nécrose encapsulée (WON) : paroi inflammatoire mature autour d’un contenu nécrotique</td></tr></table>
<p>Le tableau se lit en croisant deux questions. La première est : y a-t-il de la nécrose ? La seconde est : la collection a-t-elle plus de quatre semaines ? Exemple : chez un patient avec une nécrose de 40 % du pancréas, la collection de la deuxième semaine est une collection nécrotique aiguë ; à la sixième semaine, la même collection est devenue une nécrose encapsulée, que l’on peut drainer par voie endoscopique. Le terme « pseudokyste » ne s’applique jamais à une collection contenant de la nécrose ; l’employer à tort conduit à un drainage inadapté d’un contenu solide. Chaque collection peut être <b>stérile ou infectée</b>. D’autres complications locales existent : dysfonction de la vidange gastrique, thrombose de la veine splénique ou porte, nécrose colique.</p>
<h3>1.6 Codage CIM-10-GM 2024</h3>
<p>La catégorie K85 se subdivise par la cause (quatrième caractère), puis par la présence d’une complication de l’organe (cinquième caractère obligatoire). Le codage suisse des séjours hospitaliers emploie la CIM-10-GM : un cinquième caractère omis rend le code invalide.</p>
<table class="t"><tr><th>Code à 4 caractères (cause)</th><th>Cinquième caractère 0 : sans complication de l’organe</th><th>Cinquième caractère 1 : avec complication de l’organe</th></tr>
<tr><td>K85.0 — Pancréatite aiguë idiopathique</td><td>K85.00</td><td>K85.01</td></tr>
<tr><td>K85.1 — Pancréatite aiguë d’origine biliaire (calculs biliaires)</td><td>K85.10</td><td>K85.11</td></tr>
<tr><td>K85.2 — Pancréatite aiguë alcoolique</td><td>K85.20</td><td>K85.21</td></tr>
<tr><td>K85.3 — Pancréatite aiguë médicamenteuse</td><td>K85.30</td><td>K85.31</td></tr>
<tr><td>K85.8 — Autres pancréatites aiguës</td><td>K85.80</td><td>K85.81</td></tr>
<tr><td>K85.9 — Pancréatite aiguë, sans précision</td><td>K85.90</td><td>K85.91</td></tr></table>
<p>Le cinquième caractère 1 regroupe, selon le texte du BfArM, l’abcès pancréatique, la nécrose pancréatique aiguë ou infectée, et la pancréatite hémorragique ou purulente. Le cinquième caractère 0 comprend la pancréatite aiguë ou subaiguë, y compris récidivante, sans ces lésions. Pour K85.3, la classification demande un code supplémentaire de cause externe du chapitre 20 afin d’identifier le médicament. K85.8 sert lorsqu’une cause est identifiée hors des quatre causes nommées : hypertriglycéridémie, hypercalcémie, traumatisme ou obstruction tumorale, par exemple. K85.0 suppose un bilan étiologique complet négatif ; K85.9 signale seulement une cause non documentée.</p>
<div class="trap"><span class="k">Piège</span>La « complication de l’organe » du cinquième caractère désigne une lésion du <b>pancréas lui-même</b> (nécrose, abcès, hémorragie). Elle ne désigne pas la défaillance d’organe de la classification d’Atlanta. Un patient avec une pancréatite biliaire interstitielle et une insuffisance rénale aiguë reçoit K85.10, et l’insuffisance rénale est codée séparément. Un patient avec une nécrose stérile sans aucune défaillance reçoit K85.11.</div>
<p>Mme R. recevra K85.10 si l’imagerie ultérieure ne montre pas de nécrose, et K85.11 si une nécrose apparaît. Les maladies voisines relèvent d’autres cours : la lithiase biliaire et la cholécystite de <a href="#/entry/K80">K80 — Lithiase biliaire et cholécystite</a>, la pancréatite chronique, le pseudokyste séquellaire et la pancréatite auto-immune de <a href="#/entry/K86">K86 — Pancréatite chronique et autres maladies du pancréas</a>, l’hépatopathie alcoolique associée de <a href="#/entry/K70">K70 — Maladie alcoolique du foie</a>.</p>
<div class="key"><b>À retenir.</b> Le diagnostic exige deux critères sur trois. La sévérité se classe en légère, modérément sévère ou sévère selon la défaillance d’organe et sa durée de 48 heures. Les collections se nomment selon la nécrose et le seuil de quatre semaines. Le code CIM-10-GM K85 exige la cause et un cinquième caractère qui décrit une lésion pancréatique, et non une défaillance systémique. La partie suivante mesure le poids de la maladie et ses causes dominantes.</div>
</section>

<section class="ilot" id="k85-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La pancréatite aiguë est une des premières causes d’hospitalisation digestive. Une revue européenne (Roberts, Pancreatology 2017) rapporte une incidence de 4,6 à 100 cas pour 100 000 habitants par an selon les pays, avec une augmentation médiane de 3,4 % par an. La méta-analyse mondiale citée par l’IAP 2025 estime l’incidence à 33,74 cas pour 100 000 personnes-années et la mortalité à 1,60 décès pour 100 000 personnes-années. L’ACG 2024 décrit une hausse annuelle de 2 à 5 % de l’incidence aux États-Unis.</p>
<p>Aucune donnée suisse d’incidence publiée sous une forme directement exploitable n’a été trouvée à la date de rédaction. Les hospitalisations suisses sont codées en CIM-10-GM et pourraient en fournir une estimation ; une statistique de séjours ne mesure toutefois pas l’incidence, car un même patient peut être hospitalisé plusieurs fois.</p>
<h3>2.1 Répartition des causes</h3>
<p>La lithiase biliaire est la première cause : jusqu’à 42 % des cas dans la méta-analyse de 46 études citée par l’IAP 2025, et 40 à 70 % selon l’ACG 2024. L’alcool représente 25 à 40 % des cas selon la population. Environ 20 % des cas restent sans cause identifiée pendant l’hospitalisation. La revue européenne montre un rapport lithiase/alcool plus élevé dans le sud de l’Europe et plus bas à l’est. L’augmentation de l’incidence est associée à celle de l’obésité et de la lithiase ; cette association épidémiologique ne prouve pas à elle seule une causalité.</p>
<h3>2.2 Pronostic</h3>
<p>La majorité des épisodes sont légers. Environ 20 % des patients évoluent vers une forme modérément sévère ou sévère (ACG 2024), et ces formes concentrent presque toute la mortalité. La mortalité atteint jusqu’à 40 % en cas de défaillance d’organe persistante (IAP 2025). Une défaillance multiviscérale persistante est le facteur pronostique le plus puissant. Une nécrose infectée associée à une défaillance d’organe expose à une mortalité nettement supérieure à celle d’une nécrose stérile ; l’ACG 2024 cite une mortalité moyenne de 30 % pour la nécrose infectée.</p>
<p>Une récidive survient chez 20 à 29 % des patients après un premier épisode (ACG 2024). Elle est plus fréquente chez l’homme, le fumeur et lorsque l’alcool est en cause. Une lithiase biliaire non traitée est une cause évitable de récidive. Les épisodes répétés peuvent conduire à une pancréatite chronique. Un diabète apparaît après l’épisode chez une proportion importante de patients : 39 % après une forme sévère contre 14 % après une forme légère, dans la méta-analyse citée par l’IAP 2025.</p>
<div class="key"><b>À retenir.</b> Huit patients sur dix guérissent en quelques jours ; deux sur dix évoluent vers une forme compliquée qui concentre la mortalité. La lithiase et l’alcool expliquent la majorité des cas. Le pronostic se joue sur la défaillance d’organe persistante, puis sur l’infection de la nécrose. Le suivi doit chercher un diabète et prévenir la récidive. La partie suivante explique pourquoi une glande peut déclencher une défaillance multiviscérale.</div>
</section>

<section class="ilot" id="k85-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se lit comme une chaîne. Chaque maillon explique un signe et chaque mesure thérapeutique agit sur un maillon précis.</p>
<h3>3.1 État normal</h3>
<p>La cellule acineuse synthétise des enzymes digestives sous forme de précurseurs inactifs, les zymogènes, stockés dans des granules. Le trypsinogène n’est activé en trypsine que dans le duodénum, par l’entéropeptidase de la bordure en brosse. Trois protections empêchent l’autodigestion : la séparation physique des zymogènes et des enzymes lysosomiales, un inhibiteur de la trypsine produit par la cellule acineuse, et un flux canalaire bicarbonaté qui évacue rapidement les enzymes vers le duodénum. Ces mécanismes sont détaillés dans l’onglet Sciences.</p>
<h3>3.2 Première charnière : lésion de la cellule acineuse</h3>
<p>Les causes convergent vers une élévation prolongée du calcium intracellulaire. Un calcul bloqué dans l’ampoule de Vater élève la pression canalaire et peut exposer les cellules aux acides biliaires. Les métabolites de l’éthanol et les acides gras libres libérés par l’hydrolyse des triglycérides agissent dans le même sens. Le calcium en excès épuise les mitochondries, fait chuter l’ATP et active prématurément le trypsinogène à l’intérieur de la cellule. La cellule meurt alors par nécrose plutôt que par apoptose, et cette mort libère des signaux de danger. Voir l’<button class="w" data-k="k85-trypsine">activation prématurée du trypsinogène</button>.</p>
<h3>3.3 Deuxième charnière : inflammation locale puis systémique</h3>
<p>Les débris cellulaires activent la voie NF-κB dans la cellule acineuse et dans les macrophages. Les cytokines (TNF-α, IL-1, IL-6) recrutent les neutrophiles. Ces cytokines passent dans la circulation et produisent un <button class="w" data-k="k85-sirs">syndrome de réponse inflammatoire systémique</button>. La lipase pancréatique libérée hydrolyse aussi les triglycérides de la graisse péripancréatique et viscérale. Les acides gras non saturés ainsi produits sont toxiques pour les cellules et pour l’endothélium ; ce mécanisme est une explication proposée du risque accru chez le patient obèse.</p>
<h3>3.4 Troisième charnière : fuite capillaire et hypovolémie</h3>
<p>L’endothélium lésé devient perméable. Le plasma passe dans le rétropéritoine, la cavité péritonéale et les plèvres : c’est la <button class="w" data-k="k85-fuite">fuite capillaire vers le troisième secteur</button>. L’ACG 2024 estime cette perte à 2 à 4 litres pendant les 48 premières heures. Les vomissements, le jeûne et la fièvre s’y ajoutent. Le volume circulant diminue, l’hématocrite monte par hémoconcentration et l’urée monte par baisse de la perfusion rénale. La microcirculation pancréatique, déjà altérée, se dégrade : l’hypoperfusion peut transformer un œdème en nécrose.</p>
<h3>3.5 Quatrième charnière : défaillances d’organe</h3>
<p>Le poumon est l’organe le plus souvent atteint. L’atteinte endothéliale pulmonaire, les épanchements pleuraux et la distension abdominale réduisent l’oxygénation et peuvent aboutir à un SDRA. Le rein souffre de l’hypovolémie et de l’inflammation. L’hypotension résulte de la vasoplégie inflammatoire et de l’hypovolémie. Une pression intra-abdominale élevée, par œdème et ascite, comprime la veine cave, les reins et le diaphragme ; elle aggrave toutes les défaillances.</p>
<h3>3.6 Cinquième charnière : la phase tardive</h3>
<p>Après la première semaine, la nécrose peut s’infecter. La voie principale proposée est la <button class="w" data-k="k85-translocation">translocation bactérienne depuis l’intestin (barrière muqueuse lésée)</button> ; les germes isolés sont surtout des bactéries d’origine digestive. Une nutrition entérale précoce maintient la barrière muqueuse ; c’est le rationnel de la recommandation de nourrir par voie digestive plutôt que parentérale.</p>

<p>La figure se lit de gauche à droite en haut, puis sur la frise du bas. Chez Mme R., le maillon actif à la sixième heure est la fuite capillaire : son hématocrite de 47 % et son urée de 9,4 mmol/L en témoignent. La décision immédiate porte donc sur le volume circulant, et non sur le pancréas lui-même.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> Aucun inhibiteur des protéases, ni la somatostatine ou l’octréotide, n’a prouvé de bénéfice (IAP 2025). Le remplissage corrige la fuite capillaire ; la nutrition entérale protège la barrière intestinale ; les antibiotiques ne servent qu’en cas d’infection prouvée ou fortement suspectée ; le drainage attend que la nécrose soit encapsulée. La cholécystectomie supprime la cause biliaire et prévient la récidive.</div>
<div class="key"><b>À retenir.</b> Un même premier maillon, l’activation intracellulaire de la trypsine, peut rester local ou devenir systémique. La fuite capillaire explique l’hémoconcentration et l’urée élevée des premières heures. L’infection tardive explique les décès de la deuxième phase. La partie suivante identifie les causes qui déclenchent cette chaîne.</div>
</section>

<section class="ilot" id="k85-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La recherche de la cause commence dès l’admission, pour deux raisons. Certaines causes imposent un geste immédiat : la cholangite biliaire ou une hypertriglycéridémie majeure. Toutes conditionnent la prévention de la récidive. L’IAP 2025 demande pour chaque patient l’anamnèse ciblée, un bilan hépatique, le calcium, les triglycérides et une échographie abdominale.</p>
<table class="t"><tr><th>Cause (code CIM-10-GM)</th><th>Mécanisme principal</th><th>Indice qui l’oriente</th><th>Conséquence</th></tr>
<tr><td><b>Lithiase biliaire</b> (K85.1)</td><td>Migration d’un calcul ou de boue biliaire dans le canal commun de l’ampoule ; obstruction et reflux</td><td><button class="w" data-k="k85-alat">alanine aminotransférase &gt; 150 U/L dans les 48 premières heures</button>, calculs vésiculaires, femme, obésité</td><td>Cholécystectomie ; cholangiopancréatographie rétrograde endoscopique seulement si cholangite ou obstruction persistante</td></tr>
<tr><td><b>Alcool</b> (K85.2)</td><td>Toxicité de l’éthanol et de ses métabolites, sensibilisation aux autres facteurs</td><td>Consommation importante et prolongée ; l’ACG 2024 exige plus de cinq ans de consommation et situe la consommation forte au-delà de 50 g par jour</td><td>Intervention brève sur l’alcool ; recherche d’une pancréatite chronique</td></tr>
<tr><td><b>Médicament</b> (K85.3)</td><td>Toxicité directe ou idiosyncrasique</td><td>Chronologie d’introduction ; causalité forte établie pour l’azathioprine, la 6-mercaptopurine, la didanosine et la L-asparaginase</td><td>Arrêt définitif ; code de cause externe du chapitre 20</td></tr>
<tr><td><b>Hypertriglycéridémie</b> (K85.8)</td><td>Hydrolyse des triglycérides en acides gras toxiques, hyperviscosité</td><td><button class="w" data-k="k85-tg">triglycérides &gt; 11,3 mmol/L (1 000 mg/dL) (seuils et prise en charge)</button>, sérum lactescent, diabète décompensé, grossesse</td><td>Insuline, jeûne de 48 heures, objectif de prévention secondaire</td></tr>
<tr><td><b>Hypercalcémie</b> (K85.8)</td><td>Activation intracellulaire du trypsinogène par le calcium</td><td>Calcium corrigé élevé, souvent par hyperparathyroïdie primaire</td><td>Dosage de la parathormone ; remplissage par chlorure de sodium à 0,9 %</td></tr>
<tr><td><b>Après cholangiopancréatographie rétrograde endoscopique</b></td><td>Traumatisme papillaire et canalaire, injection de contraste</td><td>Douleur dans les heures qui suivent le geste</td><td>Prévention par anti-inflammatoire non stéroïdien rectal et remplissage</td></tr>
<tr><td><b>Obstacle tumoral</b></td><td>Obstruction du canal pancréatique principal</td><td>Âge &gt; 40 ans sans cause évidente, perte de poids, épisode prolongé ou récidivant</td><td>Tomodensitométrie en coupes fines ou IRM avec cholangio-IRM, échoendoscopie</td></tr>
<tr><td><b>Causes génétiques</b></td><td>Activation excessive ou inhibition insuffisante de la trypsine</td><td>Épisodes récidivants dès l’enfance, antécédents familiaux</td><td>Tests génétiques après récidive sans cause (IAP 2025) ; voir l’onglet Sciences</td></tr>
<tr><td><b>Traumatisme, infection, ischémie</b></td><td>Lésion directe, atteinte virale, hypoperfusion</td><td>Contexte : choc du guidon, oreillons, chirurgie cardiaque</td><td>Traitement de la cause</td></tr>
<tr><td><b>Idiopathique</b> (K85.0)</td><td>Souvent une microlithiase méconnue</td><td>Bilan initial négatif</td><td>Échographie répétée, puis échoendoscopie, puis IRM avec cholangio-IRM (IAP 2025)</td></tr></table>
<p>Le tableau se lit en commençant par les deux premières lignes, qui couvrent plus des deux tiers des cas. Chez Mme R., les calculs vésiculaires et une alanine aminotransférase à 310 U/L désignent la lithiase : la valeur prédictive positive d’un taux supérieur à 150 U/L dépasse 85 % (IAP 2025). L’erreur fréquente est d’attribuer la pancréatite à l’alcool chez un buveur modéré sans chercher la lithiase, puis de laisser la vésicule en place.</p>
<div class="trap"><span class="k">Piège</span>Un taux de triglycérides mesuré après plusieurs jours de jeûne peut être faussement rassurant. L’ACG 2024 recommande de le doser tôt et de le contrôler à jeun un mois après la sortie lorsqu’une hypertriglycéridémie est suspectée, car un sérum lactescent est observé chez jusqu’à 20 % des patients. À l’inverse, l’alcool et la lithiase élèvent souvent les triglycérides de façon modérée, sans qu’ils soient la cause.</div>
<p><b>Médicaments.</b> La causalité est clairement établie pour quelques molécules seulement. L’ACG 2024 souligne que les causes médicamenteuses, infectieuses et métaboliques sont rares et souvent attribuées à tort. La <button class="w" data-k="k85-medic">pancréatite médicamenteuse (degré de preuve et démarche)</button> se retient après exclusion de la lithiase et de l’alcool, devant une chronologie compatible.</p>
<p><b>Facteurs de risque d’une forme sévère.</b> L’ACG 2024 cite l’urée élevée, l’hématocrite élevé, l’obésité, les comorbidités et la présence d’un SIRS. Le tabagisme augmente le risque de pancréatite aiguë dans deux revues systématiques citées par l’IAP 2025.</p>
<div class="key"><b>À retenir.</b> La lithiase et l’alcool dominent ; l’alanine aminotransférase au-delà de 150 U/L oriente vers la lithiase. Les triglycérides et le calcium sont dosés chez chaque patient dès l’admission. Après 40 ans, une pancréatite sans cause impose de chercher une tumeur. Une pancréatite dite idiopathique justifie une échographie répétée, puis une échoendoscopie. La partie suivante décrit ce que le patient raconte.</div>
</section>

<section class="ilot" id="k85-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse confirme la compatibilité de la douleur, cherche la cause et repère le terrain qui aggrave le pronostic.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<div class="card"><h4>Cause</h4><p>Le médecin demande s’il existe des coliques hépatiques antérieures, une lithiase connue, une cholécystite ou un ictère. Il quantifie la consommation d’alcool en grammes par jour et sa durée. Il fait la liste de tous les médicaments introduits dans les trois derniers mois. Il recherche une hypertriglycéridémie connue, un diabète mal équilibré, une hyperparathyroïdie, une cholangiopancréatographie récente, un traumatisme abdominal et des pancréatites dans la famille.</p></div>
<div class="card"><h4>Terrain et pronostic</h4><p>Le médecin recherche un âge supérieur à 60 ans, une obésité, une insuffisance cardiaque ou rénale, une broncho-pneumopathie chronique et une cirrhose. Ces comorbidités augmentent le risque de défaillance et limitent la tolérance au remplissage. Il note aussi les épisodes antérieurs de pancréatite, qui orientent vers une cause non corrigée ou vers une pancréatite chronique.</p></div></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<p><b>Douleur abdominale haute</b> — Elle est épigastrique ou de l’hypocondre gauche, d’installation rapide, continue et intense. Elle irradie souvent vers le dos, et le patient se penche en avant pour la soulager, car cette position réduit l’étirement du rétropéritoine inflammatoire. Voir la <button class="w" data-k="k85-douleur">douleur pancréatique (mécanisme, caractères, pièges)</button>. L’ACG 2024 précise que l’intensité et la localisation de la douleur ne sont pas corrélées à la sévérité. Une douleur sourde, en colique ou localisée au bas-ventre n’est pas compatible et doit faire chercher un autre diagnostic.</p>
<p><b>Nausées et vomissements</b> — Ils sont fréquents et ne soulagent pas la douleur. Ils traduisent une stimulation vagale et un iléus réflexe, et aggravent l’hypovolémie.</p>
<p><b>Distension abdominale et arrêt du transit</b> — Ils traduisent un iléus paralytique par inflammation rétropéritonéale.</p>
<p><b>Dyspnée</b> — Elle évoque un épanchement pleural, souvent gauche, une atteinte pulmonaire inflammatoire ou une distension abdominale. Elle est un signe d’alerte.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Femme de 55 ans, obèse, porteuse de calculs vésiculaires, douleur épigastrique transfixiante après un repas, vomissements, lipase à plus de dix fois la limite supérieure. L’évolution est favorable en quelques jours dans la majorité des cas, car 80 % des pancréatites sont interstitielles.</p></div>
<div class="card"><h4>Forme alcoolique</h4><p>Homme de 45 ans, consommation de 100 g d’alcool par jour depuis quinze ans, douleur après une période de consommation massive. L’amylase peut être normale dans la forme alcoolique (ACG 2024) ; la lipase est plus fiable. Un sevrage alcoolique peut compliquer l’évolution.</p></div>
<div class="card"><h4>Forme indolore ou masquée</h4><p>Patient âgé, sédaté ou en postopératoire, chez qui la pancréatite se révèle par une hypotension, une confusion ou une défaillance respiratoire. Le diagnostic repose alors sur la lipase et l’imagerie.</p></div>
<div class="card"><h4>Forme hypertriglycéridémique</h4><p>Patient diabétique mal équilibré ou femme enceinte au troisième trimestre, triglycérides supérieurs à 11,3 mmol/L. L’amylase peut être normale dans cette forme (ACG 2024), et le sérum lactescent peut gêner certains dosages ; la lipase et l’imagerie redressent le diagnostic.</p></div></div>
<div class="key"><b>À retenir.</b> Une douleur épigastrique continue et transfixiante, avec vomissements, est compatible ; une douleur en colique ou basse ne l’est pas. L’anamnèse quantifie l’alcool, liste les médicaments récents et recherche la lithiase. Le terrain cardiaque, rénal et l’âge limitent la tolérance au remplissage. La partie suivante décrit l’examen clinique, qui mesure surtout la gravité.</div>
</section>

<section class="ilot" id="k85-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique ne prouve pas le diagnostic ; il mesure la gravité et cherche une cause ou un diagnostic concurrent. Le médecin commence par les signes vitaux, car ils guident le remplissage dès la première heure.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Chez l’adulte sain, la fréquence cardiaque est de 60 à 100/min, la fréquence respiratoire de 12 à 20/min et la saturation pulsée d’au moins 95 %. Dans la pancréatite, la <b>tachycardie</b> traduit l’hypovolémie et l’inflammation. La <b>polypnée</b> et une saturation basse traduisent une atteinte respiratoire. Une <b>hypotension</b> et des marbrures signalent un choc. La <b>diurèse</b> se mesure par sonde urinaire chez le patient grave. La <b>confusion</b> fait partie du score BISAP. Le poids et l’IMC servent au calcul des volumes par kilogramme.</p></div>
<div class="card"><h4>Abdomen</h4><p>Le médecin trouve une sensibilité épigastrique, parfois une défense, rarement une contracture franche. La contracture généralisée doit faire évoquer d’abord une perforation d’ulcère. Le météorisme et les bruits intestinaux diminués traduisent l’iléus. Un abdomen tendu chez un patient ventilé doit faire mesurer la <button class="w" data-k="k85-pia">pression intra-abdominale (mesure vésicale, seuils)</button>.</p></div>
<div class="card"><h4>Signes d’orientation étiologique</h4><p>Un ictère et un signe de Murphy évoquent une lithiase de la voie biliaire principale ou une cholécystite. Une fièvre avec frissons et ictère évoque une <button class="w" data-k="k85-cholangite">cholangite (urgence de drainage biliaire)</button>. Des xanthomes éruptifs et une lipémie rétinienne évoquent une hypertriglycéridémie majeure. Les stigmates d’hépatopathie évoquent l’alcool.</p></div>
<div class="card"><h4>Signes de gravité tardifs</h4><p>L’<button class="w" data-k="k85-ecchymoses">ecchymose périombilicale de Cullen et l’ecchymose des flancs de Grey Turner</button> traduisent une diffusion hémorragique rétropéritonéale. Elles sont rares, tardives et associées aux formes nécrosantes. Une matité de base pulmonaire traduit un épanchement pleural.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un patient d’apparence peu malade peut évoluer vers une forme sévère. L’ACG 2024 rappelle que la plupart des patients qui développent une forme compliquée arrivent aux urgences sans défaillance ni nécrose. Les signes vitaux, la diurèse et l’urée sont réévalués à intervalles rapprochés pendant les 48 premières heures, quelle que soit l’impression initiale.</div>
<p>Chez Mme R., la fréquence cardiaque de 112/min, la fréquence respiratoire de 22/min et des leucocytes à 15,8 G/L remplissent trois critères du SIRS. L’absence d’hypotension et la saturation de 95 % indiquent qu’il n’y a pas encore de défaillance d’organe. Elle doit être surveillée en unité de soins continus ou à défaut avec une surveillance rapprochée.</p>
<div class="key"><b>À retenir.</b> L’examen mesure la gravité par la fréquence cardiaque, la fréquence respiratoire, la saturation, la pression artérielle, la conscience et la diurèse. Une contracture généralisée oriente vers une perforation. Un ictère fébrile impose de chercher une cholangite. Les ecchymoses de Cullen et de Grey Turner sont tardives et inconstantes. La partie suivante organise ces éléments en démarche diagnostique.</div>
