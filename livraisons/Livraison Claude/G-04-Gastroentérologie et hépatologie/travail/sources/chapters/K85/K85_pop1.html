<!-- ===== FENÊTRES K85 : notions cliniques, scores et examens ===== -->
<template data-pop="k85-atlanta" data-title="Classification d’Atlanta révisée (2012)">
<div class="lab">Définition</div><p>Consensus international publié par Banks et collaborateurs (Gut 2013, en ligne en 2012), après une consultation de pancréatologues et de onze associations. Il remplace la classification d’Atlanta de 1992. Il fixe une terminologie commune pour le diagnostic, les deux phases de la maladie, trois degrés de sévérité et quatre types de collections.</p>
<div class="lab">Pourquoi elle a été révisée</div><p>La version de 1992 classait « sévère » toute défaillance d’organe, même brève, et employait des termes ambigus comme « abcès » ou « phlegmon ». Or une défaillance qui se corrige en moins de 48 heures a un pronostic proche des formes légères, alors qu’une défaillance persistante concentre la mortalité. La révision a donc introduit la catégorie « modérément sévère » et le seuil de 48 heures.</p>
<div class="lab">Valeur et limites</div><p>Dans une cohorte de 338 patients (Pancreas 2016), la classification révisée prédit la mortalité avec une aire sous la courbe de 0,91, contre 0,81 pour celle de 1992. Elle ne distingue pas la défaillance simple de la défaillance multiviscérale, alors que cette dernière est le prédicteur de mortalité le plus fort. Une classification concurrente fondée sur les déterminants de la gravité (nécrose infectée et défaillance persistante) ajoute une catégorie « critique » ; elle donne des résultats comparables.</p>
<div class="lab">Conséquence pratique</div><p>La sévérité définitive ne se connaît qu’après 48 heures. Le médecin surveille donc chaque patient comme s’il pouvait s’aggraver pendant cette période.</p></template>
<template data-pop="k85-marshall" data-title="Score de Marshall modifié">
<div class="lab">Définition</div><p>Score retenu par la classification d’Atlanta révisée pour définir la défaillance d’organe dans trois systèmes. Chaque système est coté de 0 à 4 ; un score d’au moins 2 dans un système définit sa défaillance.</p>
<table class="t"><tr><th>Système</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th></tr>
<tr><td>Respiratoire : PaO₂/FiO₂ (mmHg)</td><td>&gt; 400</td><td>301–400</td><td>201–300</td><td>101–200</td><td>≤ 101</td></tr>
<tr><td>Rénal : créatinine (µmol/L)</td><td>≤ 134</td><td>134–169</td><td>170–310</td><td>311–439</td><td>&gt; 439</td></tr>
<tr><td>Cardiovasculaire : pression systolique (mmHg)</td><td>&gt; 90</td><td>&lt; 90, répond au remplissage</td><td>&lt; 90, ne répond pas au remplissage</td><td>&lt; 90, pH &lt; 7,3</td><td>&lt; 90, pH &lt; 7,2</td></tr></table>
<div class="lab">Mode d’emploi</div><p>Le score se calcule chaque jour. Une défaillance de moins de 48 heures est transitoire ; au-delà, elle est persistante et définit la forme sévère. Chez un patient sans gazométrie, la saturation et le débit d’oxygène permettent une estimation du rapport.</p>
<div class="lab">Piège</div><p>Chez un insuffisant rénal chronique, la créatinine de base est déjà élevée. La classification d’Atlanta demande alors de juger la dégradation par rapport à la valeur antérieure, et non le seuil absolu.</p>
<div class="lab">Conséquence pratique</div><p>Un score de 2 ou plus justifie le transfert en soins intensifs (IAP 2025).</p></template>
<template data-pop="k85-necrose" data-title="Nécrose pancréatique et péripancréatique">
<div class="lab">Définition</div><p>Zones de parenchyme pancréatique non viable, ou de graisse péripancréatique nécrosée. Au scanner, le parenchyme nécrosé ne prend pas le contraste. L’ACG 2024 retient une zone de plus de 3 cm ou de plus de 30 % du pancréas pour la nécrose parenchymateuse.</p>
<div class="lab">Mécanisme</div><p>La nécrose résulte de la mort des cellules acineuses par épuisement de l’ATP, aggravée par l’hypoperfusion microcirculatoire. Elle se constitue en 24 à 72 heures ; c’est pourquoi le scanner d’admission la sous-estime.</p>
<div class="lab">Stérile ou infectée</div><p>La nécrose reste stérile chez une majorité de patients. L’infection survient surtout après la première semaine. Une nécrose stérile se traite sans intervention ; une nécrose infectée relève des antibiotiques puis de l’approche graduée.</p>
<div class="lab">Piège</div><p>Une nécrose stérile et une nécrose infectée peuvent s’accompagner de la même défaillance d’organe (ACG 2024). C’est l’évolution clinique, le gaz et les cultures qui distinguent l’infection, et non la seule fièvre.</p></template>
<template data-pop="k85-pseudokyste" data-title="Pseudokyste pancréatique">
<div class="lab">Définition</div><p>Collection de liquide pancréatique entourée d’une paroi bien définie, sans débris solides, apparue plus de quatre semaines après une pancréatite interstitielle. Sa paroi n’a pas d’épithélium : c’est pourquoi on parle de « pseudo » kyste.</p>
<div class="lab">Évolution</div><p>Beaucoup de pseudokystes régressent. Un pseudokyste asymptomatique ne se draine pas, quelle que soit sa taille. Un drainage, endoscopique de préférence, se discute en cas de douleur, d’obstruction digestive ou biliaire, d’infection ou de saignement.</p>
<div class="lab">Piège</div><p>Une collection qui contient des débris de nécrose est une nécrose encapsulée et non un pseudokyste. Le pseudokyste séquellaire d’une pancréatite chronique relève de K86.</p></template>
<template data-pop="k85-trypsine" data-title="Activation prématurée du trypsinogène">
<div class="lab">Normal</div><p>Le trypsinogène est activé dans la lumière duodénale par l’entéropeptidase. Un inhibiteur de la trypsine et la chymotrypsine C neutralisent toute trypsine activée par erreur dans la glande.</p>
<div class="lab">Perturbation</div><p>Une élévation prolongée du calcium intracellulaire, une acidification et la fusion des granules de zymogène avec les lysosomes permettent à la cathepsine B de cliver le trypsinogène dans la cellule. La trypsine active les autres enzymes, qui digèrent la cellule.</p>
<div class="lab">Conséquence clinique</div><p>Cette étape est précoce et déjà engagée au moment de la consultation. C’est la raison pour laquelle les inhibiteurs de protéases donnés à l’admission n’ont pas amélioré le pronostic.</p>
<div class="lab">Limites</div><p>L’activation intracellulaire est démontrée dans les modèles expérimentaux et par la génétique (variants de PRSS1) ; chez l’homme, son poids exact par rapport aux autres voies, mitochondriales et inflammatoires, reste discuté.</p></template>
<template data-pop="k85-sirs" data-title="Syndrome de réponse inflammatoire systémique">
<div class="lab">Critères</div><p>Au moins deux des quatre critères : température &gt; 38 °C ou &lt; 36 °C ; fréquence cardiaque &gt; 90/min ; fréquence respiratoire &gt; 20/min ou PaCO₂ &lt; 32 mmHg ; leucocytes &gt; 12 G/L ou &lt; 4 G/L.</p>
<div class="lab">Mécanisme</div><p>Les cytokines libérées par le pancréas lésé agissent sur l’hypothalamus (fièvre), le cœur (tachycardie), la respiration et la moelle osseuse (hyperleucocytose).</p>
<div class="lab">Valeur pronostique</div><p>L’ACG 2024 rapporte qu’un SIRS dans les 24 premières heures a une sensibilité de 85 % pour la défaillance d’organe, mais une spécificité de 41 % seulement. L’IAP 2025 recommande de l’évaluer à l’admission et à 48 heures, éventuellement avec la protéine C-réactive ou l’IL-6. Un SIRS persistant à 48 heures est plus prédictif qu’un SIRS initial transitoire.</p>
<div class="lab">Conséquence pratique</div><p>Un SIRS justifie un lit surveillé et un remplissage attentif. Il ne justifie pas d’antibiotiques : dans la pancréatite, il traduit l’inflammation stérile.</p></template>
<template data-pop="k85-fuite" data-title="Fuite capillaire et troisième secteur">
<div class="lab">Normal</div><p>L’endothélium retient les protéines plasmatiques ; la pression oncotique maintient le plasma dans les vaisseaux.</p>
<div class="lab">Perturbation</div><p>Les cytokines et les enzymes activées ouvrent les jonctions endothéliales. Le plasma passe dans le rétropéritoine, le péritoine et les plèvres : ce compartiment hors circulation est appelé troisième secteur. L’ACG 2024 estime la perte à 2 à 4 litres en 48 heures.</p>
<div class="lab">Signes</div><p>Tachycardie, oligurie, hématocrite en hausse par hémoconcentration, urée en hausse par hypoperfusion rénale.</p>
<div class="lab">Conséquence pratique</div><p>Le remplissage précoce compense cette perte. La perméabilité persistante explique qu’un volume excessif finisse lui aussi dans le troisième secteur : ascite, œdème pulmonaire, hypertension intra-abdominale. D’où le choix d’un remplissage modéré et réévalué.</p></template>
<template data-pop="k85-translocation" data-title="Translocation bactérienne">
<div class="lab">Définition</div><p>Passage de bactéries intestinales ou de leurs produits à travers la paroi digestive vers les ganglions, le sang et la nécrose.</p>
<div class="lab">Mécanisme proposé</div><p>Hypoperfusion splanchnique précoce, iléus, atrophie muqueuse au jeûne et immunodépression relative de la deuxième phase. Les germes de la nécrose infectée sont majoritairement d’origine digestive, ce qui soutient cette hypothèse ; l’ACG 2024 évoque aussi l’infection par cathéter après la première semaine.</p>
<div class="lab">Conséquence pratique</div><p>La nutrition entérale précoce entretient la barrière muqueuse ; la nutrition parentérale, qui laisse l’intestin au repos, est associée à davantage d’infections.</p>
<div class="lab">Limite</div><p>Le mécanisme est solidement plausible mais n’a pas été démontré directement chez chaque patient ; les essais de décontamination digestive et de probiotiques n’ont pas confirmé un bénéfice préventif.</p></template>
<template data-pop="k85-alat" data-title="Alanine aminotransférase et origine biliaire">
<div class="lab">Pourquoi la doser</div><p>Un calcul qui passe dans la voie biliaire provoque une cholestase et une cytolyse hépatique brève ; l’alanine aminotransférase s’élève en quelques heures.</p>
<div class="lab">Interprétation</div><p>Une valeur supérieure à 150 U/L dans les 48 premières heures a une valeur prédictive positive supérieure à 85 % pour la cause biliaire (IAP 2025). Une valeur normale n’exclut pas une microlithiase.</p>
<div class="lab">Décision</div><p>Une valeur élevée impose de chercher attentivement des calculs et oriente vers une cholécystectomie. Avec une vésicule normale à l’échographie, l’IAP 2025 recommande une échoendoscopie après la guérison pour chercher une microlithiase.</p></template>
<template data-pop="k85-tg" data-title="Hypertriglycéridémie et pancréatite">
<div class="lab">Seuils</div><p>L’ACG 2024 attribue la pancréatite aux triglycérides surtout au-delà de 11,3 mmol/L (1 000 mg/dL). Le risque augmente déjà au-delà de 5,6 mmol/L (500 mg/dL). La conversion se fait en divisant les milligrammes par décilitre par 88,5.</p>
<div class="lab">Mécanisme</div><p>La lipase hydrolyse les triglycérides en acides gras libres toxiques ; les chylomicrons augmentent la viscosité et gênent la microcirculation pancréatique.</p>
<div class="lab">Fréquence</div><p>Environ 5 % des pancréatites selon l’ACG 2024, davantage pendant la grossesse.</p>
<div class="lab">Conduite</div><p>Insuline, jeûne de 48 heures puis régime pauvre en graisses ; héparine de bas poids moléculaire de courte durée possible ; plasmaphérèse en cas de défaillance persistante. Après la sortie, maintenir les triglycérides sous 5,6 mmol/L (IAP 2025).</p>
<div class="lab">Piège</div><p>Les triglycérides baissent vite au jeûne : un dosage tardif peut masquer la cause. Ils se dosent dès l’admission et se contrôlent à jeun après la sortie.</p></template>
<template data-pop="k85-medic" data-title="Pancréatite médicamenteuse">
<div class="lab">Définition</div><p>Pancréatite attribuée à un médicament après exclusion des autres causes, avec une chronologie compatible et, idéalement, une récidive à la réintroduction.</p>
<div class="lab">Molécules à causalité établie</div><p>Azathioprine et 6-mercaptopurine, didanosine (ACG 2024), L-asparaginase chez l’enfant leucémique (IAP 2025). Pour la plupart des autres molécules, les données sont limitées ; l’ACG 2024 cite une classification qui grade le niveau de preuve par médicament.</p>
<div class="lab">Démarche</div><p>Le médecin exclut d’abord la lithiase, l’alcool, les triglycérides et le calcium. Il arrête le médicament suspect, code K85.3 avec le code de cause externe du médicament, et déclare l’effet indésirable à Swissmedic.</p>
<div class="lab">Piège</div><p>Attribuer la pancréatite au médicament le plus récent sans échographie conduit à laisser en place une lithiase qui récidivera.</p></template>
<template data-pop="k85-douleur" data-title="Douleur pancréatique">
<div class="lab">Mécanisme</div><p>L’inflammation et l’œdème distendent la capsule et le rétropéritoine ; les médiateurs activent les fibres afférentes viscérales qui rejoignent le plexus cœliaque et les nerfs splanchniques.</p>
<div class="lab">Caractères</div><p>Épigastrique ou de l’hypocondre gauche, continue, intense, souvent transfixiante vers le dos, soulagée par la position penchée en avant, aggravée par le décubitus et l’alimentation.</p>
<div class="lab">Valeur</div><p>L’intensité et la localisation ne sont pas corrélées à la sévérité (ACG 2024). Une douleur en colique, sourde ou basse doit faire chercher un autre diagnostic.</p>
<div class="lab">Conséquence</div><p>Une douleur mal soulagée gêne la respiration, la mobilisation et la réalimentation. Elle se mesure par une échelle numérique et se traite sans attendre (UEG 2026).</p></template>
<template data-pop="k85-pia" data-title="Pression intra-abdominale">
<div class="lab">Mesure</div><p>Par une sonde vésicale : 25 mL de sérum sont instillés dans la vessie, et la pression est lue en fin d’expiration, patient à plat, transducteur au niveau de la ligne axillaire moyenne.</p>
<div class="lab">Seuils (IAP 2025)</div><p>Supérieure à 12 mmHg de façon soutenue ou répétée : hypertension intra-abdominale. Supérieure à 20 mmHg avec une défaillance d’organe nouvelle ou aggravée : syndrome du compartiment abdominal.</p>
<div class="lab">Conséquences</div><p>La pression comprime la veine cave inférieure et diminue le retour veineux, réduit le débit rénal et élève le diaphragme. Oligurie et hypoxémie s’aggravent.</p>
<div class="lab">Conduite</div><p>Drainage percutané de l’ascite et des collections, analgésie, sonde gastrique ou rectale, bilan hydrique non positif ; décompression chirurgicale en dernier recours.</p></template>
<template data-pop="k85-cholangite" data-title="Cholangite associée à une pancréatite biliaire">
<div class="lab">Définition</div><p>Infection de la bile en amont d’une obstruction de la voie biliaire principale, le plus souvent par un calcul enclavé.</p>
<div class="lab">Signes</div><p>Fièvre avec frissons, ictère et douleur de l’hypocondre droit ; hypotension dans les formes graves. Chez un patient avec SIRS, la distinction avec la pancréatite seule est difficile (IAP 2025) : une bilirubine croissante et des frissons orientent.</p>
<div class="lab">Conduite</div><p>Hémocultures, antibiotiques et drainage biliaire par CPRE avec sphinctérotomie, dans les 24 heures selon l’ACG 2024. Le détail relève du cours K83.</p>
<div class="lab">Piège</div><p>La fièvre isolée de la pancréatite ne suffit pas à poser le diagnostic de cholangite ; une CPRE inutile expose elle-même à une pancréatite.</p></template>
<template data-pop="k85-ecchymoses" data-title="Signes de Cullen et de Grey Turner">
<div class="lab">Description</div><p>Le signe de Cullen est une ecchymose périombilicale ; le signe de Grey Turner une ecchymose des flancs.</p>
<div class="lab">Mécanisme</div><p>Le sang et les enzymes diffusent dans le rétropéritoine, puis vers les flancs par l’espace pararénal, ou vers l’ombilic par le ligament falciforme et le ligament rond.</p>
<div class="lab">Valeur</div><p>Rares et tardifs, ils témoignent d’une forme hémorragique ou nécrosante. Leur absence n’exclut aucune gravité. Ils se voient aussi dans d’autres hémorragies rétropéritonéales, comme la rupture d’anévrisme ou la grossesse extra-utérine rompue.</p></template>
<template data-pop="k85-lipase" data-title="Lipase sérique">
<div class="lab">Origine</div><p>Enzyme produite presque exclusivement par la cellule acineuse ; une petite quantité passe normalement dans le sang.</p>
<div class="lab">Interprétation</div><p>Le critère diagnostique est une valeur supérieure à trois fois la limite supérieure de la normale du laboratoire, qui dépend de la méthode. La lipase reste élevée plus longtemps que l’amylase, ce qui aide en cas de consultation tardive.</p>
<div class="lab">Élévations hors pancréatite</div><p>Insuffisance rénale, maladies digestives inflammatoires, macrolipasémie, diabète ; l’ACG 2024 suggère qu’un seuil de 3 à 5 fois la limite peut être nécessaire chez le diabétique.</p>
<div class="lab">Piège</div><p>Le taux ne mesure ni la gravité ni l’évolution, et il ne guide pas la réalimentation. Une fois le diagnostic posé, il ne se répète pas.</p></template>
<template data-pop="k85-hct" data-title="Hématocrite dans la pancréatite aiguë">
<div class="lab">Pourquoi le doser</div><p>L’hématocrite est la fraction du volume sanguin occupée par les globules rouges. Lorsque le plasma fuit vers le troisième secteur, les globules rouges restent dans les vaisseaux et l’hématocrite monte.</p>
<div class="lab">Interprétation</div><p>Une valeur d’au moins 44 % à l’admission, ou une hausse à 24 heures, est associée à une forme sévère (ACG 2024). La valeur normale chez la femme se situe environ entre 36 et 46 %, chez l’homme entre 40 et 50 % selon les laboratoires ; le seuil de 44 % se lit donc par rapport au sexe et à la valeur antérieure.</p>
<div class="lab">Décision</div><p>Une hémoconcentration persistante justifie un bolus supplémentaire ; la cible de l’IAP 2025 est un hématocrite inférieur à 44 %.</p>
<div class="lab">Limite</div><p>Une anémie préexistante masque l’hémoconcentration ; une hémorragie la fait baisser. L’association pronostique ne signifie pas que l’hématocrite cause la gravité : il témoigne de la fuite capillaire.</p></template>
<template data-pop="k85-uree" data-title="Urée sanguine dans la pancréatite aiguë">
<div class="lab">Pourquoi la doser</div><p>L’urée filtrée est en partie réabsorbée ; lorsque la perfusion rénale baisse, la réabsorption augmente et la filtration diminue. L’urée monte donc tôt dans l’hypovolémie.</p>
<div class="lab">Interprétation</div><p>Une valeur d’au moins 7,1 mmol/L (20 mg/dL d’azote uréique), et surtout une hausse dans les 24 premières heures, est associée à une mortalité accrue (ACG 2024). La conversion en mmol/L se fait en multipliant les milligrammes par décilitre d’azote uréique par 0,357.</p>
<div class="lab">Décision</div><p>Une urée qui monte malgré le remplissage impose un nouveau bolus et la recherche d’une défaillance rénale ; la cible de l’IAP 2025 est une urée inférieure à 7,1 mmol/L.</p>
<div class="lab">Limite</div><p>Une hémorragie digestive, un apport protéique ou une corticothérapie élèvent aussi l’urée ; une hépatopathie la diminue.</p></template>
<template data-pop="k85-bisap" data-title="Score BISAP">
<div class="lab">Composition</div><p>Un point pour chacun des cinq critères relevés dans les 24 premières heures : urée supérieure à 8,9 mmol/L (25 mg/dL d’azote uréique) ; altération de la conscience ; SIRS ; âge supérieur à 60 ans ; épanchement pleural à l’imagerie.</p>
<div class="lab">Valeur</div><p>Un score d’au moins 3 est associé à une mortalité accrue. L’IAP 2025 cite une étude de 1 544 patients où le BISAP, le SIRS et un score d’exclusion simple ont tous une valeur prédictive négative supérieure à 98 % pour la défaillance multiviscérale.</p>
<div class="lab">Limite</div><p>Comme tous les scores, il exclut mieux qu’il ne prédit. L’ACG 2024 juge qu’il n’est probablement pas plus précis que la surveillance de l’urée et du SIRS.</p></template>
<template data-pop="k85-macroamy" data-title="Macroamylasémie">
<div class="lab">Définition</div><p>Formation de complexes entre l’amylase et des immunoglobulines. Le complexe est trop gros pour être filtré par le rein.</p>
<div class="lab">Conséquence</div><p>L’amylase sérique reste élevée en permanence, sans maladie pancréatique, tandis que l’amylase urinaire est basse.</p>
<div class="lab">Piège</div><p>Elle peut faire porter à tort un diagnostic de pancréatite chez un patient qui a une autre cause de douleur. La lipase normale et l’absence de douleur compatible orientent ; un phénomène identique existe pour la lipase.</p></template>
<template data-pop="k85-tdm" data-title="Tomodensitométrie : protocole et lecture">
<div class="lab">Quand</div><p>En cas de doute diagnostique, dès l’admission. Pour la gravité, au moins 72 à 96 heures après le début de la douleur (IAP 2025, recommandation forte). Un nouveau scanner se fait en cas d’aggravation ou avant une intervention.</p>
<div class="lab">Protocole (IAP 2025, bonne pratique)</div><p>Scanner multidétecteur en coupes de 2 mm ou moins, phases pancréatique et portale (délai de 50 à 70 secondes), après 100 à 150 mL de contraste non ionique injecté à 3 mL/s. Pour le suivi des collections, une seule phase portale suffit. Une phase artérielle s’ajoute si un pseudoanévrisme est suspecté.</p>
<div class="lab">Lecture</div><p>Le radiologue décrit le type interstitiel ou nécrosant, le pourcentage de nécrose, les collections selon la terminologie d’Atlanta, les complications vasculaires et digestives.</p>
<div class="lab">Piège</div><p>Le contraste iodé chez un patient hypovolémique peut aggraver une insuffisance rénale : le remplissage précède l’injection, et l’IRM sans gadolinium est une alternative.</p></template>
<template data-pop="k85-ctsi" data-title="Index de sévérité tomodensitométrique modifié">
<div class="lab">Principe</div><p>Score de 0 à 10 qui additionne l’inflammation (0, 2 ou 4), l’étendue de la nécrose (0, 2 ou 4) et la présence de complications extrapancréatiques (2).</p>
<div class="lab">Lecture</div><p>0 à 2 : atteinte légère ; 4 à 6 : modérée ; 8 à 10 : sévère.</p>
<div class="lab">Valeur et limites</div><p>Le score corrèle avec les complications et la durée de séjour. Il n’est fiable qu’après la constitution de la nécrose ; à l’admission, il sous-estime la gravité. L’IAP 2025 rapporte qu’aucun score morphologique ne dépasse nettement les scores cliniques pour prédire la mortalité.</p></template>
<template data-pop="k85-cck" data-title="Cholécystokinine">
<div class="lab">Origine</div><p>Hormone peptidique sécrétée par les cellules I de la muqueuse duodénale et jéjunale en réponse aux graisses et aux acides aminés du repas.</p>
<div class="lab">Effets</div><p>Elle stimule la sécrétion d’enzymes par les cellules acineuses, la contraction de la vésicule et le relâchement du sphincter d’Oddi.</p>
<div class="lab">Corrélation clinique</div><p>Un repas gras contracte la vésicule et peut chasser un calcul vers l’ampoule : c’est un déclencheur classique de la pancréatite biliaire. La réalimentation est pauvre en graisses pour limiter cette stimulation.</p></template>
<template data-pop="k85-diabete" data-title="Diabète après pancréatite aiguë">
<div class="lab">Fréquence</div><p>Dans la méta-analyse citée par l’IAP 2025, le risque est plus élevé après une forme sévère qu’après une forme légère (39 % contre 14 %), après une forme nécrosante (37 % contre 11 %) et après une cause alcoolique qu’après une cause biliaire (28 % contre 12 %).</p>
<div class="lab">Mécanismes</div><p>Perte d’îlots par nécrose, inflammation, résistance à l’insuline, démasquage d’une auto-immunité et prédisposition génétique.</p>
<div class="lab">Dépistage</div><p>Glycémie et HbA1c tous les 12 mois, à partir de 3 à 6 mois après la guérison, chez tous les patients (IAP 2025, recommandation forte).</p>
<div class="lab">Piège</div><p>Ce diabète, de type pancréatogène, expose aux hypoglycémies, car la sécrétion de glucagon peut aussi être réduite. Il est souvent classé à tort comme un diabète de type 2.</p></template>

<div class="lab">Mécanisme</div><p>Réaction idiosyncrasique, non dépendante de la dose, qui peut survenir à tout moment du traitement, même après une prise antérieure bien tolérée (information professionnelle suisse, Novalgin, mars 2025).</p>
<div class="lab">Signes</div><p>Fièvre, frissons, angine, ulcérations buccales ou génitales.</p>
<div class="lab">Conduite</div><p>Arrêt immédiat, formule sanguine complète avec différenciation, et contre-indication définitive si l’agranulocytose est confirmée.</p>
<div class="lab">Piège</div><p>Chez un patient fébrile sous antibiotiques, comme dans une nécrose infectée, les signes sont masqués : la formule sanguine est contrôlée devant toute fièvre nouvelle.</p></template>
