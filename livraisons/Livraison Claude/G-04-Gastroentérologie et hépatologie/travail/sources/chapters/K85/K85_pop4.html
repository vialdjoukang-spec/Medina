<!-- ===== FENÊTRES K85 : Pareto ===== -->
<template data-pop="pareto-k85-clin" data-title="Pareto — Définition, mécanismes, causes et clinique">
<p class="ratio" data-cover="k85-0,k85-1,k85-2,k85-3,k85-4,k85-5,k85-6"></p>
<ul>
<li>Diagnostic : deux critères sur trois, soit douleur compatible, lipase ou amylase &gt; 3 fois la limite supérieure, imagerie.</li>
<li>Atlanta : légère sans défaillance ; modérément sévère si défaillance de moins de 48 heures ou complication ; sévère si défaillance persistante au-delà de 48 heures.</li>
<li>Défaillance d’organe : Marshall modifié ≥ 2 (PaO₂/FiO₂ ≤ 300, créatinine ≥ 170 µmol/L, systolique &lt; 90 mmHg malgré le remplissage).</li>
<li>Collections : sans nécrose, collection aiguë puis pseudokyste ; avec nécrose, collection nécrotique aiguë puis nécrose encapsulée ; seuil de 4 semaines.</li>
<li>CIM-10-GM : cause au quatrième caractère, lésion pancréatique (nécrose, abcès) au cinquième, et non défaillance systémique.</li>
<li>80 % de formes interstitielles ; mortalité jusqu’à 40 % si défaillance persistante.</li>
<li>Causes : lithiase (jusqu’à 42 %), alcool (25 à 40 %), idiopathique (20 %) ; alanine aminotransférase &gt; 150 U/L oriente vers la lithiase.</li>
<li>Triglycérides et calcium à doser chez tous ; tumeur à chercher après 40 ans.</li>
<li>Chaîne : calcium intracellulaire, trypsine activée, nécrose, SIRS, fuite capillaire de 2 à 4 L, défaillances, puis infection tardive.</li>
<li>Examen : signes vitaux et diurèse mesurent la gravité ; Cullen et Grey Turner sont tardifs.</li></ul></template>
<template data-pop="pareto-k85-diag" data-title="Pareto — Diagnostic et gravité">
<p class="ratio" data-cover="k85-7,k85-8"></p>
<ul>
<li>Lipase préférée à l’amylase ; son taux ne mesure pas la gravité et ne se répète pas.</li>
<li>ECG systématique ; scanner seulement si doute ou après 72 à 96 heures sans amélioration.</li>
<li>Prédicteurs : SIRS à l’admission et à 48 heures, hématocrite ≥ 44 %, urée ≥ 7,1 mmol/L ou en hausse, BISAP ≥ 3 ; protéine C-réactive ≥ 150 mg/L à 48 heures seulement.</li>
<li>Marshall ≥ 2 : soins intensifs ; ictère fébrile : cholangite, CPRE dans les 24 heures.</li>
<li>Pression intra-abdominale &gt; 12 mmHg : hypertension ; &gt; 20 mmHg avec défaillance nouvelle : syndrome du compartiment abdominal.</li></ul></template>
<template data-pop="pareto-k85-tt" data-title="Pareto — Traitement initial, cause et nécrose">
<p class="ratio" data-cover="k85-9,k85-10,k85-11"></p>
<ul>
<li>Ringer lactate 1,5 mL/kg/h, bolus 10 mL/kg si hypovolémie ; cibles pression artérielle moyenne 65 à 85 mmHg, diurèse ≥ 0,5 mL/kg/h, urée &lt; 7,1 mmol/L, hématocrite &lt; 44 %.</li>
<li>Opioïdes sans retard pour la douleur sévère.</li>
<li>Repas solide pauvre en graisses dès la faim ; sinon sonde entérale dans les 72 heures ; parentérale en dernier recours.</li>
<li>Aucun antibiotique, probiotique ou antifongique prophylactique.</li>
<li>CPRE si cholangite ; cholécystectomie pendant la même hospitalisation après une forme biliaire légère.</li>
<li>Hypertriglycéridémie : insuline et jeûne 48 heures ; hypercalcémie : chlorure de sodium au lieu du Ringer lactate.</li>
<li>Nécrose infectée : antibiotiques d’abord, puis drainage, puis nécrosectomie mini-invasive, idéalement après 4 semaines.</li></ul></template>
<template data-pop="pareto-k85-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="k85-12,k85-13,k85-14"></p>
<ul>
<li>Sortie : alimentation tolérée, plus de fièvre, inflammation en baisse, antalgie non opioïde.</li>
<li>Glycémie et HbA1c chaque année dès 3 à 6 mois ; enzymes si stéatorrhée et élastase &lt; 100 µg/g.</li>
<li>Prévention : cholécystectomie, arrêt de l’alcool et du tabac, triglycérides &lt; 5,6 mmol/L.</li>
<li>Grossesse : échographie puis IRM sans gadolinium ; cholécystectomie au deuxième trimestre.</li>
<li>Après CPRE : Ringer lactate et anti-inflammatoire non stéroïdien rectal.</li>
<li>Critères : deux sur trois ; sévérité selon la défaillance d’organe et sa durée de 48 heures.</li></ul></template>
<template data-pop="pareto-k85-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="k85-e-1,k85-e-2,k85-e-3,k85-e-4,k85-e-5,k85-e-6"></p>
<ul>
<li>Bilan d’admission : lipase, échographie, bilan hépatique, triglycérides, calcium, hématocrite, urée, créatinine, ECG.</li>
<li>Lipase &gt; 3 fois la limite : critère biologique ; amylase normale chez jusqu’à un cinquième des patients.</li>
<li>Scanner de gravité après 72 à 96 heures ; index tomodensitométrique modifié de 0 à 10.</li>
<li>IRM sans gadolinium si grossesse ou insuffisance rénale ; cholangio-IRM ou échoendoscopie pour un calcul résiduel.</li>
<li>Infection de la nécrose : clinique, gaz, cultures ; ponction non systématique.</li></ul></template>
<template data-pop="pareto-k85-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="k85-p-1,k85-p-2,k85-p-3,k85-p-4"></p>
<ul>
<li>Aucune thérapie ciblée ; inhibiteurs de protéases et octréotide inefficaces.</li>
<li>Paracétamol 1 g jusqu’à 4 fois par jour, 2 g par jour au plus si alcoolisme ou dénutrition ; morphine 2,5 mg toutes les 5 minutes en titration.</li>
<li>Méropénem 1 g toutes les 8 heures adapté à la clairance, seulement si infection.</li>
<li>Énoxaparine 40 mg par jour ; diclofénac rectal 100 mg autour d’une CPRE.</li>
<li>Métamizole intraveineux lent et après correction de la volémie ; agranulocytose.</li>
<li>Méropénem et valproate : association déconseillée.</li></ul></template>
