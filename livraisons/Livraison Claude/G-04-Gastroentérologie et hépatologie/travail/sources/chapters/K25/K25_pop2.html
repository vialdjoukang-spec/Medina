<template data-pop="k25-resist" data-title="Surveillance suisse des résistances">
<div class="lab">Source</div><p>anresis est le système suisse de surveillance de la résistance aux antibiotiques, soutenu par l’OFSP. Les données sur <i>H. pylori</i> citées par Raichle et Burri (der informierte arzt, septembre 2024) donnent 41 % de résistance à la clarithromycine, 26 % à la lévofloxacine et 44 % au métronidazole.</p>
<div class="lab">Limite</div><p>Ces chiffres ne séparent pas les patients jamais traités des patients déjà traités ; ils surestiment probablement la résistance primaire. Ils dépassent cependant nettement les seuils de 15 % et de 30 % qui interdisent l’usage empirique.</p>
<div class="lab">Comparaison européenne</div><p>Résistance primaire en Europe en 2020–2024 : 24,4 % pour la clarithromycine, 20,7 % pour la lévofloxacine, 34,2 % pour le métronidazole, 3,3 % pour l’amoxicilline et 0,7 % pour la tétracycline (Nafria et al., Gut Microbes 2026, revue de 216 études). Les données suisses de cette revue sont anciennes et peu nombreuses : 27 % pour la clarithromycine en 1990–1999 et 66,3 % sur 216 patients en 2010–2019.</p></template>

<template data-pop="k25-resist-test" data-title="Test de résistance d’Helicobacter pylori">
<div class="lab">Pourquoi</div><p>La résistance à la clarithromycine fait chuter le taux d’éradication de la trithérapie. Connaître la sensibilité permet de garder une trithérapie simple chez la majorité des patients : le guide mediX 2024 estime que plus de 70 % des patients testés peuvent recevoir une trithérapie adaptée.</p>
<div class="lab">Comment</div><p>Pendant la gastroscopie, une biopsie supplémentaire est placée dans le milieu de transport indiqué par le laboratoire. Le test moléculaire recherche les mutations de résistance à la clarithromycine et à la lévofloxacine ; la culture teste six antibiotiques.</p>
<div class="lab">Limite</div><p>Le test exige une endoscopie, car le test moléculaire sur selles n’était pas proposé par les laboratoires suisses en 2024 (Raichle et Burri, 2024).</p></template>

<template data-pop="k25-uree-rapide" data-title="Test rapide à l’uréase">
<div class="lab">Principe</div><p>Une biopsie est placée dans un milieu contenant de l’urée et un indicateur de pH. L’uréase bactérienne produit de l’ammoniac, le pH monte et la couleur change, souvent en moins d’une heure.</p>
<div class="lab">Intérêt</div><p>Le résultat est disponible pendant ou juste après l’endoscopie, ce qui permet de prescrire l’éradication sans attendre l’histologie.</p>
<div class="lab">Limite</div><p>Faux négatifs sous inhibiteur de la pompe à protons, après antibiotiques et en cas de saignement ; une biopsie de l’antre et une du corps améliorent la détection.</p></template>

<template data-pop="k25-serologie" data-title="Sérologie d’Helicobacter pylori">
<div class="lab">Principe</div><p>Elle détecte des anticorps de type IgG dirigés contre la bactérie, témoins d’un contact ancien ou actuel.</p>
<div class="lab">Quand l’utiliser</div><p>Lorsque les tests directs sont faussés et ne peuvent pas être répétés : hémorragie récente, traitement antiacide impossible à interrompre, gastrite atrophique ou lymphome où la densité bactérienne est faible.</p>
<div class="lab">Limite majeure</div><p>Les anticorps persistent des mois ou des années après l’éradication : la sérologie ne prouve pas une infection active et ne contrôle jamais l’éradication (mediX 2024 ; Maastricht VI).</p></template>

<template data-pop="k25-preparation" data-title="Préparation des tests directs">
<div class="lab">Délais</div><p>Au moins deux semaines sans inhibiteur de la pompe à protons. Au moins quatre semaines sans antibiotique ni bismuth (Maastricht VI ; mediX 2024).</p>
<div class="lab">Mécanisme</div><p>Les antibiotiques et le bismuth réduisent fortement la charge bactérienne sans toujours l’éliminer ; il faut quelques semaines pour qu’elle redevienne détectable. L’inhibiteur de la pompe à protons élève le pH, diminue la densité bactérienne dans l’antre et l’activité de l’uréase.</p>
<div class="lab">Situation pratique</div><p>Les antiacides de contact peuvent remplacer l’inhibiteur pendant la période d’arrêt pour soulager les symptômes. Si l’arrêt est impossible, un résultat négatif n’est pas interprétable.</p></template>

<template data-pop="k25-mutations" data-title="Bases moléculaires de la résistance">
<div class="lab">Clarithromycine</div><p>La clarithromycine se fixe sur l’ARN ribosomique 23S de la sous-unité 50S et bloque la synthèse protéique. Des mutations ponctuelles du domaine V de cet ARN, surtout aux positions 2142 et 2143, empêchent sa fixation.</p>
<div class="lab">Lévofloxacine</div><p>La lévofloxacine inhibe l’ADN gyrase. Des mutations du gène <i>gyrA</i>, dans la région déterminant la résistance aux quinolones, rendent l’enzyme insensible.</p>
<div class="lab">Conséquence</div><p>Ces mutations uniques et connues se détectent par amplification génique en quelques heures. Elles sont sélectionnées par toute prise antérieure de macrolide ou de fluoroquinolone, même pour une autre infection.</p></template>

<template data-pop="k25-ecl" data-title="Cellules entérochromaffines">
<div class="lab">Fonction</div><p>Cellules endocrines du corps gastrique, situées près des cellules pariétales. Elles libèrent l’histamine sous l’effet de la gastrine et de l’acétylcholine.</p>
<div class="lab">Conséquence</div><p>L’histamine amplifie la sécrétion acide par les récepteurs histaminiques de type 2. Une hypergastrinémie prolongée stimule leur croissance : une hyperplasie se voit sous inhibiteur de la pompe à protons au long cours, sans cas de tumeur rapporté chez l’homme dans les données de l’information professionnelle de Nexium.</p></template>

<template data-pop="k25-sydney" data-title="Système de Sydney actualisé">
<div class="lab">Principe</div><p>Méthode standardisée de description de la gastrite. Le pathologiste note séparément dans l’antre et dans le corps la densité d’<i>H. pylori</i>, l’inflammation chronique, l’activité (polynucléaires), l’atrophie et la métaplasie intestinale.</p>
<div class="lab">Prélèvements</div><p>Deux biopsies de l’antre, une de l’angulus et deux du corps, placées dans des flacons séparés.</p>
<div class="lab">Utilité</div><p>Il précise la topographie de la gastrite, qui explique le type d’ulcère, et l’étendue de l’atrophie et de la métaplasie, qui fixe le risque de cancer gastrique. Les gastrites sont développées dans le cours K29 — Gastrites, duodénites et autres maladies de l’estomac (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k25-malt" data-title="Lymphome gastrique du tissu lymphoïde associé aux muqueuses">
<div class="lab">Mécanisme</div><p>L’estomac normal ne contient pas de tissu lymphoïde organisé. L’infection chronique y fait apparaître des follicules lymphoïdes ; une prolifération clonale de lymphocytes B de la zone marginale, stimulée par l’antigène bactérien, peut en naître.</p>
<div class="lab">Conséquence thérapeutique</div><p>Dans les formes localisées dépendantes de l’antigène, l’éradication seule peut faire régresser le lymphome. La prise en charge relève de l’hématologie et de l’oncologie.</p></template>
