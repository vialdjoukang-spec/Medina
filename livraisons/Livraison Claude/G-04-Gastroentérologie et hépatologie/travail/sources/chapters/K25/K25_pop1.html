<!-- ===== FENÊTRES : pathologie ===== -->
<template data-pop="k25-def" data-title="Ulcère peptique : définition">
<div class="lab">Définition</div><p>L’ulcère peptique est une perte de substance de la paroi digestive exposée à l’acide et à la pepsine, qui franchit la musculaire muqueuse. L’érosion, plus superficielle, reste dans la muqueuse.</p>
<div class="lab">Pourquoi la profondeur compte</div><p>Les artères de calibre notable et le plexus nerveux se trouvent dans la sous-muqueuse. Une lésion qui les atteint peut saigner abondamment ; une lésion qui traverse toute la paroi perfore. L’érosion n’atteint pas ces structures et guérit sans cicatrice.</p>
<div class="lab">Convention endoscopique</div><p>Les études cliniques définissent habituellement l’ulcère par une taille d’au moins 5 mm avec une profondeur visible. Ce seuil sert à comparer les essais ; il ne remplace pas la définition histologique (Lanas et Chan, Lancet 2017).</p></template>

<template data-pop="k25-cim4" data-title="Quatrièmes positions de K25 à K28">
<div class="lab">Règle</div><p>La CIM-10-GM 2024 attribue les mêmes quatrièmes positions aux quatre catégories : .0 aigu avec hémorragie, .1 aigu avec perforation, .2 aigu avec hémorragie et perforation, .3 aigu sans hémorragie ni perforation, .4 chronique ou non précisé avec hémorragie, .5 chronique ou non précisé avec perforation, .6 chronique ou non précisé avec hémorragie et perforation, .7 chronique sans hémorragie ni perforation, .9 ni aigu ni chronique précisé, sans hémorragie ni perforation.</p>
<div class="lab">Particularité</div><p>La CIM-10-GM ne comporte pas de position .8 pour ces catégories.</p>
<div class="lab">Conséquence pratique</div><p>Un ulcère qui saigne se code dans sa catégorie d’ulcère (par exemple <button class="w" data-k="k25-codes">K25.4</button>) et non dans K92, qui exclut les hémorragies dues à un ulcère digestif. Source : BfArM, CIM-10-GM 2024, bloc K20–K31, consulté le 08.10.2026.</p></template>

<template data-pop="k25-codes" data-title="Exemples de codage">
<div class="lab">Ulcère duodénal</div><p>K26.9 : ulcère bulbaire non compliqué, de caractère non précisé. K26.7 : ulcère duodénal chronique non compliqué. K26.5 : ulcère duodénal chronique ou non précisé perforé. K26.1 : ulcère duodénal aigu perforé.</p>
<div class="lab">Ulcère gastrique</div><p>K25.0 : ulcère gastrique aigu hémorragique, par exemple un ulcère de stress qui saigne. K25.4 : ulcère gastrique chronique ou non précisé hémorragique. K25.7 : ulcère gastrique chronique non compliqué.</p>
<div class="lab">Autres sièges</div><p>K27.9 : ulcère peptique sans siège précisé, non compliqué. K28.7 : ulcère anastomotique chronique non compliqué.</p>
<div class="lab">Cause médicamenteuse</div><p>Un code supplémentaire du vingtième chapitre (causes externes) identifie le médicament responsable, selon la note de codage de K25 et K26.</p></template>

<template data-pop="k25-p788" data-title="Ulcère du nouveau-né (P78.8)">
<div class="lab">Codage</div><p>L’ulcère gastroduodénal du nouveau-né est exclu de K27 et se code P78.8, parmi les autres affections périnatales précisées de l’appareil digestif (CIM-10-GM 2024).</p>
<div class="lab">Raison</div><p>Chez le nouveau-né, l’ulcère relève surtout du stress périnatal et de la réanimation, et non d’<i>H. pylori</i> ni des AINS. Sa prise en charge relève de la néonatologie.</p></template>

<template data-pop="k25-k633" data-title="Ulcère primitif de l’intestin grêle (K63.3)">
<div class="lab">Codage</div><p>Un ulcère du jéjunum ou de l’iléon sans lien avec une anastomose gastrique se code K63.3 et non K28 (CIM-10-GM 2024).</p>
<div class="lab">Causes à connaître</div><p>Les AINS lèsent aussi l’intestin grêle, ce que la capsule endoscopique révèle chez des patients anémiques sans lésion gastroduodénale. La maladie de Crohn, l’ischémie et certaines infections sont d’autres causes. Ces ulcères relèvent du cours K63 — Polypes colorectaux et autres maladies de l’intestin (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k25-johnson" data-title="Classification de Johnson">
<div class="lab">Principe</div><p>Johnson a classé en 1965 les ulcères gastriques selon leur siège et le niveau de sécrétion acide ; les types IV et V ont été ajoutés ensuite.</p>
<div class="lab">Types</div><p>Type I : petite courbure du corps, acidité normale ou basse. Type II : ulcère gastrique associé à un ulcère duodénal, acidité élevée. Type III : prépylorique, acidité élevée. Type IV : haut sur la petite courbure, près du cardia, acidité basse. Type V : n’importe quel siège, lié aux AINS.</p>
<div class="lab">Utilité et limites</div><p>Elle explique pourquoi les types II et III se comportent comme un ulcère duodénal. Elle guidait le choix des interventions de réduction acide, devenues rares ; elle ne modifie pas le traitement médical actuel.</p></template>

<template data-pop="k25-aspirine" data-title="Aspirine à faible dose et estomac">
<div class="lab">Mécanisme</div><p>L’aspirine acétyle de façon irréversible la COX-1. Dans la muqueuse, elle diminue les prostaglandines protectrices. Dans les plaquettes, qui ne synthétisent pas de nouvelle enzyme, elle bloque le thromboxane A2 pendant toute leur durée de vie, soit environ 7 à 10 jours.</p>
<div class="lab">Conséquence clinique</div><p>Même à 100 mg par jour, l’aspirine favorise l’ulcère et allonge le saignement d’une lésion. Le risque augmente avec un antécédent d’ulcère, l’âge, l’association à un autre antithrombotique et <i>H. pylori</i>.</p>
<div class="lab">Décision</div><p>L’aspirine de prévention secondaire n’est pas arrêtée durablement : son arrêt après un ulcère hémorragique s’associe à une mortalité plus élevée (Sung et al., Ann Intern Med 2010). Elle se protège par un inhibiteur de la pompe à protons et par l’éradication d’<i>H. pylori</i>.</p></template>

<template data-pop="k25-ains" data-title="AINS et ulcère">
<div class="lab">Mécanisme</div><p>Les AINS inhibent la COX-1 et la COX-2. L’inhibition de la COX-1 de la muqueuse réduit les prostaglandines qui entretiennent le mucus, le bicarbonate et le débit sanguin. Les AINS acides lèsent aussi l’épithélium par contact.</p>
<div class="lab">Conséquence clinique</div><p>Les ulcères sous AINS sont souvent gastriques, parfois multiples, et fréquemment silencieux, car l’AINS calme la douleur. Ils se révèlent volontiers par une hémorragie.</p>
<div class="lab">Gradation</div><p>Le risque dépend de la molécule et de la dose : risque relatif de 1,84 pour l’ibuprofène et de 4,10 pour le naproxène dans la méta-analyse de Castellsague et al. (Drug Safety 2012), deux à trois fois plus élevé à forte dose. Ces chiffres sont des associations observationnelles ajustées.</p></template>

<template data-pop="k25-bq" data-title="Quadrithérapie bismuthée">
<div class="lab">Composition</div><p>Un inhibiteur de la pompe à protons, un sel de bismuth, la tétracycline et le métronidazole. En Suisse, Pylera réunit le bismuth, le métronidazole et la tétracycline dans une gélule ; l’oméprazole s’y ajoute.</p>
<div class="lab">Pourquoi elle marche malgré les résistances</div><p>La résistance à la tétracycline reste très rare (0,7 % en Europe en 2020–2024, Nafria et al., 2026). La résistance au métronidazole, fréquente, est en partie surmontée par la dose et la durée. Le bismuth a une action antibactérienne propre et ne suscite pas de résistance connue.</p>
<div class="lab">Limites</div><p>Douze gélules par jour en quatre prises, effets digestifs, selles noires et interdiction de l’alcool réduisent l’adhésion. Le guide mediX 2024 réserve la prescription empirique aux patients dont l’adhésion paraît assurée. Pylera est contre-indiqué pendant la grossesse, l’allaitement, et en cas d’insuffisance rénale ou hépatique.</p></template>

<template data-pop="k25-pompe" data-title="Pompe à protons">
<div class="lab">Structure et fonction</div><p>La pompe à protons de la cellule pariétale est une enzyme membranaire qui échange un ion hydrogène intracellulaire contre un ion potassium de la lumière, en consommant de l’énergie. Elle peut générer un gradient d’ions hydrogène d’environ un million de fois entre le sang et la lumière gastrique.</p>
<div class="lab">Activation</div><p>Au repos, les pompes sont stockées dans des vésicules. La stimulation par l’acétylcholine, la gastrine et l’histamine les insère dans la membrane du canalicule sécrétoire.</p>
<div class="lab">Conséquence thérapeutique</div><p>Les inhibiteurs de la pompe à protons bloquent cette étape finale commune et ne touchent que les pompes actives ; d’où leur prise 30 minutes avant un repas.</p></template>

<template data-pop="k25-barriere" data-title="Barrière muqueuse gastroduodénale">
<div class="lab">Couches de défense</div><p>Un gel de mucus de quelques centaines de micromètres retient le bicarbonate sécrété par l’épithélium et maintient un pH proche de 7 à la surface des cellules, alors que la lumière est à pH 1 à 2. Les jonctions serrées empêchent l’acide de passer entre les cellules. L’épithélium se répare en quelques heures par migration des cellules voisines. Le débit sanguin muqueux apporte le bicarbonate et évacue les ions hydrogène qui ont pénétré.</p>
<div class="lab">Rôle des prostaglandines</div><p>Les prostaglandines produites par la COX-1 stimulent le mucus, le bicarbonate et le débit sanguin. Leur suppression par les AINS affaiblit chacune de ces couches.</p>
<div class="lab">Conséquence clinique</div><p>Le choc, en réduisant le débit muqueux, explique l’ulcère de stress ; les AINS, en supprimant les prostaglandines, expliquent l’ulcère médicamenteux.</p></template>

<template data-pop="k25-cox" data-title="Cyclo-oxygénases 1 et 2">
<div class="lab">COX-1</div><p>Elle est exprimée en permanence dans l’estomac, le rein et les plaquettes. Elle produit les prostaglandines de protection gastrique et le thromboxane plaquettaire.</p>
<div class="lab">COX-2</div><p>Elle est surtout induite par l’inflammation. Elle produit les prostaglandines de la douleur et de l’inflammation.</p>
<div class="lab">Conséquence thérapeutique</div><p>Les inhibiteurs sélectifs de la COX-2, comme le célécoxib, épargnent la COX-1 gastrique et causent moins d’ulcères. Ils n’ont pas d’effet antiplaquettaire et ne remplacent pas l’aspirine. Leur risque cardiovasculaire impose une évaluation individuelle.</p></template>

<template data-pop="k25-urease" data-title="Uréase d’Helicobacter pylori">
<div class="lab">Fonction</div><p>L’uréase hydrolyse l’urée du suc gastrique en ammoniac et en gaz carbonique. L’ammoniac neutralise l’acide autour de la bactérie et lui permet de traverser la lumière acide jusqu’au mucus.</p>
<div class="lab">Conséquence diagnostique</div><p>Cette activité est la base du test respiratoire à l’urée marquée et du test rapide à l’uréase sur biopsie.</p>
<div class="lab">Limite</div><p>D’autres bactéries uréasiques de la bouche ou de l’estomac achlorhydre peuvent rarement donner un faux positif ; un antiacide ou un antibiotique récent, en réduisant la charge bactérienne, donne des faux négatifs.</p></template>

<template data-pop="k25-caga" data-title="CagA et VacA">
<div class="lab">CagA</div><p>La protéine CagA est codée par l’îlot de pathogénicité cag. Elle est injectée dans la cellule épithéliale par un système de sécrétion de type IV, puis perturbe la signalisation cellulaire, la polarité et les jonctions. Les souches porteuses de CagA provoquent une inflammation plus intense et s’associent davantage à l’ulcère et au cancer gastrique.</p>
<div class="lab">VacA</div><p>La cytotoxine VacA forme des canaux dans les membranes, crée des vacuoles, favorise l’apoptose et freine les lymphocytes T.</p>
<div class="lab">Limite pratique</div><p>Le génotype de virulence ne change pas l’indication du traitement : toute infection découverte est traitée (Maastricht VI, 2022).</p></template>

<template data-pop="k25-ains-topique" data-title="Effet topique des AINS">
<div class="lab">Mécanisme</div><p>Les AINS acides restent non ionisés dans le suc gastrique, traversent la membrane des cellules épithéliales, puis s’ionisent dans le cytoplasme neutre et s’y accumulent. Ils découplent la mitochondrie et augmentent la perméabilité de l’épithélium.</p>
<div class="lab">Conséquence</div><p>Cet effet explique les érosions précoces. Les formes gastrorésistantes ou les voies non orales réduisent l’effet topique, mais pas l’effet systémique de suppression des prostaglandines : un AINS par voie rectale ou intramusculaire peut aussi causer un ulcère.</p></template>

<template data-pop="k25-agd" data-title="Artère gastroduodénale">
<div class="lab">Anatomie</div><p>Elle naît de l’artère hépatique commune, descend derrière le premier duodénum, puis se divise en artère gastro-omentale droite et en artères pancréatico-duodénales supérieures.</p>
<div class="lab">Conséquence clinique</div><p>Un ulcère de la face postérieure du bulbe peut l’éroder. L’hémorragie est alors abondante et récidive plus souvent après hémostase endoscopique.</p>
<div class="lab">Conséquence thérapeutique</div><p>En cas d’échec endoscopique, l’embolisation de cette artère par voie radiologique ou sa ligature chirurgicale arrête le saignement (WSES 2020 ; détails dans le cours K92).</p></template>

<template data-pop="k25-test-resp" data-title="Test respiratoire à l’urée marquée">
<div class="lab">Principe</div><p>Le patient boit de l’urée marquée au carbone 13. Si <i>H. pylori</i> est présent, son uréase libère du gaz carbonique marqué, absorbé puis expiré. L’appareil compare l’air expiré avant et après la prise.</p>
<div class="lab">Interprétation</div><p>Un résultat supérieur au seuil fixé par le fabricant signe une infection active. Le carbone 13 n’est pas radioactif : le test convient à l’enfant et à la femme enceinte.</p>
<div class="lab">Conditions</div><p>Patient à jeun, sans inhibiteur de la pompe à protons depuis deux semaines, sans antibiotique ni bismuth depuis quatre semaines (Maastricht VI ; mediX 2024).</p>
<div class="lab">Usage</div><p>Diagnostic sans endoscopie et contrôle d’éradication.</p></template>

<template data-pop="k25-ag-selles" data-title="Antigène fécal d’Helicobacter pylori">
<div class="lab">Principe</div><p>Un dosage immunologique à anticorps monoclonaux détecte des antigènes bactériens éliminés dans les selles. Seuls les tests monoclonaux de laboratoire sont recommandés pour le diagnostic et le contrôle.</p>
<div class="lab">Conditions</div><p>Mêmes délais que le test respiratoire. Les selles liquides diluent l’antigène et l’hémorragie digestive peut fausser le résultat.</p>
<div class="lab">Avantage</div><p>Le prélèvement se fait au domicile ; c’est une alternative pratique au test respiratoire.</p></template>

<template data-pop="k25-synergie" data-title="Cumul des facteurs de risque">
<div class="lab">Principe</div><p>Les facteurs agissent par des mécanismes différents : l’infection affaiblit ou sur-stimule la muqueuse, l’AINS supprime les prostaglandines, l’anticoagulant et l’antiplaquettaire empêchent une petite lésion de s’arrêter de saigner, les corticostéroïdes retardent la cicatrisation, et les ISRS diminuent la sérotonine plaquettaire.</p>
<div class="lab">Conséquence</div><p>Leurs effets s’additionnent ou se multiplient. Chez un sujet âgé qui reçoit un AINS, de l’aspirine et un ISRS, chaque médicament doit être justifié, et la protection par un inhibiteur de la pompe à protons s’impose.</p>
<div class="lab">Limite</div><p>Les estimations de risque combiné proviennent d’études observationnelles ; elles indiquent un ordre de grandeur et non un risque individuel exact.</p></template>

<template data-pop="k25-zes" data-title="Syndrome de Zollinger-Ellison">
<div class="lab">Définition</div><p>Un gastrinome, tumeur neuroendocrine du duodénum ou du pancréas, sécrète de la gastrine en permanence. La sécrétion acide devient maximale et continue. Il se code E16.4 dans la CIM-10-GM ; son bilan relève de l’endocrinologie.</p>
<div class="lab">Tableau évocateur</div><p>Ulcères multiples, distaux (deuxième duodénum, jéjunum), réfractaires ou récidivants après éradication, diarrhée chronique par inactivation des enzymes pancréatiques, œsophagite sévère.</p>
<div class="lab">Diagnostic</div><p>Une gastrinémie à jeun supérieure à dix fois la limite supérieure de la normale avec un pH gastrique inférieur à 2 établit le diagnostic. L’inhibiteur de la pompe à protons augmente aussi la gastrine, et son arrêt chez un porteur de gastrinome expose à une complication grave ; ce bilan se fait avec un spécialiste.</p>
<div class="lab">Contexte génétique</div><p>Une minorité de gastrinomes, de l’ordre d’un sur quatre dans les séries chirurgicales, s’intègrent dans une <button class="w" data-k="k25-nem1">néoplasie endocrinienne multiple de type 1</button>.</p></template>

<template data-pop="k25-nem1" data-title="Néoplasie endocrinienne multiple de type 1">
<div class="lab">Définition</div><p>Maladie héréditaire autosomique dominante due à une mutation du gène <i>MEN1</i>. Elle associe une hyperparathyroïdie, des tumeurs neuroendocrines duodéno-pancréatiques, dont le gastrinome, et des adénomes hypophysaires.</p>
<div class="lab">Conséquence pratique</div><p>Devant un syndrome de Zollinger-Ellison, la calcémie et la parathormone se dosent, et l’histoire familiale se reconstitue. La prise en charge relève de l’endocrinologie.</p></template>

<template data-pop="k25-idiopathique" data-title="Ulcère idiopathique">
<div class="lab">Définition</div><p>Ulcère sans <i>H. pylori</i>, sans AINS ni aspirine, et sans autre cause identifiable après recherche soigneuse.</p>
<div class="lab">Conditions du diagnostic</div><p>Au moins deux méthodes de recherche d’<i>H. pylori</i> négatives, réalisées hors antiacide et hors antibiotique ; interrogatoire répété sur l’automédication ; recherche d’un gastrinome, d’une maladie de Crohn, d’une infection virale et d’un cancer selon le contexte.</p>
<div class="lab">Pronostic et conduite</div><p>Ces ulcères récidivent et saignent plus souvent. Un inhibiteur de la pompe à protons au long cours est habituellement maintenu (Lanas et Chan, Lancet 2017).</p></template>

<template data-pop="k25-facteurs-ains" data-title="Facteurs de risque d’ulcère sous AINS">
<div class="lab">Facteurs reconnus</div><p>Âge supérieur à 65 ans ; antécédent d’ulcère, surtout compliqué ; AINS à forte dose ou plusieurs AINS ; prise concomitante d’aspirine, de corticostéroïdes ou d’anticoagulants (Lanza et al., Am J Gastroenterol 2009). L’infection à <i>H. pylori</i> s’y ajoute.</p>
<div class="lab">Gradation</div><p>Risque élevé : antécédent d’ulcère compliqué ou plus de deux facteurs. Risque modéré : un ou deux facteurs. Risque faible : aucun facteur.</p>
<div class="lab">Limite</div><p>Cette gradation date de 2009 ; elle reste utilisée, mais l’essai CONCERN (2017) a précisé la stratégie chez le patient qui cumule un risque digestif et un risque cardiovasculaire élevés.</p></template>

<template data-pop="k25-douleur" data-title="Chronologie de la douleur ulcéreuse">
<div class="lab">Ulcère duodénal</div><p>La douleur apparaît deux à trois heures après le repas, quand l’acide n’est plus tamponné par les aliments, et la nuit, quand la sécrétion basale n’est pas tamponnée. Le repas la calme.</p>
<div class="lab">Ulcère gastrique</div><p>La douleur peut être déclenchée par le repas, qui stimule la sécrétion au contact de l’ulcère ; une perte de poids par peur de manger est possible.</p>
<div class="lab">Limites</div><p>Ces profils se recoupent largement et ne permettent ni de poser le diagnostic ni de localiser l’ulcère. Leur utilité est d’orienter l’interrogatoire ; la gastroscopie tranche.</p></template>

<template data-pop="k25-alarme" data-title="Signes d’alarme digestifs hauts">
<div class="lab">Liste</div><p>Hématémèse, méléna, anémie ferriprive, perte de poids involontaire, dysphagie ou odynophagie, vomissements persistants, masse épigastrique, adénopathie sus-claviculaire gauche, ictère, symptômes nouveaux après 50 ans, antécédent familial de cancer gastrique.</p>
<div class="lab">Pourquoi ils comptent</div><p>Chacun peut traduire une complication (saignement, sténose) ou un cancer. Leur présence fait préférer une gastroscopie rapide à un traitement d’épreuve ou à la stratégie « tester et traiter ».</p>
<div class="lab">Limite</div><p>Leur valeur prédictive positive de cancer est faible pris isolément ; leur absence ne protège pas complètement d’un cancer chez une personne originaire d’une région à risque élevé.</p></template>

<template data-pop="k25-defense" data-title="Défense et contracture abdominales">
<div class="lab">Normal</div><p>L’abdomen se laisse déprimer sans résistance ni douleur, et la paroi suit la respiration.</p>
<div class="lab">Défense</div><p>Contraction réflexe localisée de la paroi lors de la palpation, que le patient ne peut empêcher ; elle traduit une irritation péritonéale localisée.</p>
<div class="lab">Contracture</div><p>Rigidité permanente, généralisée et douloureuse, « ventre de bois ». Dans la perforation, le liquide acide irrite tout le péritoine. Elle impose l’imagerie urgente et l’avis chirurgical.</p>
<div class="lab">Piège</div><p>Le sujet âgé, le patient sous corticostéroïdes et le patient confus peuvent ne présenter qu’une sensibilité modérée malgré une perforation.</p></template>

<template data-pop="k25-clapotage" data-title="Clapotage à jeun">
<div class="lab">Technique</div><p>Le patient est à jeun depuis au moins six heures. Le médecin secoue l’abdomen par de petites impulsions de la main posée sur l’épigastre et écoute un bruit liquidien.</p>
<div class="lab">Signification</div><p>Normalement, l’estomac est vide à jeun et le clapotage absent. Sa présence signe une stase gastrique : sténose pyloro-duodénale ulcéreuse ou tumorale, ou gastroparésie.</p></template>

<template data-pop="k25-alcalose" data-title="Alcalose des vomissements">
<div class="lab">Mécanisme</div><p>Les vomissements d’un estomac sténosé éliminent de l’acide chlorhydrique. Le bicarbonate produit en même temps par la cellule pariétale reste dans le sang : le pH monte et le chlore baisse.</p>
<div class="lab">Potassium</div><p>L’hypovolémie active l’aldostérone, qui fait réabsorber le sodium et perdre le potassium par le rein. Le rein réabsorbe aussi le bicarbonate pour conserver le sodium, ce qui entretient l’alcalose.</p>
<div class="lab">Décision</div><p>La correction repose sur le soluté salé isotonique et le potassium ; l’apport de chlore permet au rein d’éliminer l’excès de bicarbonate.</p></template>

<template data-pop="k25-test-treat" data-title="Stratégie « tester et traiter »">
<div class="lab">Principe</div><p>Chez un patient dyspeptique jeune sans signe d’alarme, un test non invasif d’<i>H. pylori</i> remplace la gastroscopie initiale. Un test positif conduit à l’éradication.</p>
<div class="lab">Justification</div><p>L’éradication traite l’ulcère méconnu, prévient la récidive et réduit le risque de cancer gastrique, sans exposer tous les patients à l’endoscopie (Maastricht VI, 2022).</p>
<div class="lab">Limites</div><p>Le seuil d’âge dépend du risque régional de cancer gastrique ; le guide mediX 2024 intègre l’origine du patient. Un patient dont les symptômes persistent après une éradication réussie relève d’une gastroscopie.</p></template>

<template data-pop="k25-ogd" data-title="Gastroscopie">
<div class="lab">Définition</div><p>Œso-gastro-duodénoscopie : examen par un endoscope souple de l’œsophage, de l’estomac et du duodénum jusqu’au deuxième duodénum.</p>
<div class="lab">Apports</div><p>Diagnostic de l’ulcère, biopsies, recherche d’<i>H. pylori</i> et de ses résistances, hémostase.</p>
<div class="lab">Risques</div><p>Les complications sont rares : réaction à la sédation, saignement après biopsie, perforation exceptionnelle. L’insufflation est évitée en cas de perforation suspectée.</p></template>

<template data-pop="k25-forrest" data-title="Classification de Forrest">
<div class="lab">Principe</div><p>Elle décrit l’aspect d’un ulcère qui a saigné : saignement actif en jet (Ia) ou en nappe (Ib), vaisseau visible (IIa), caillot adhérent (IIb), tache pigmentée (IIc), fond propre (III).</p>
<div class="lab">Conséquence</div><p>Le risque de récidive hémorragique décroît de Ia à III. Les stades Ia, Ib et IIa justifient une hémostase endoscopique. La conduite détaillée relève du cours K92 — Hémorragie digestive (G-04-Gastroentérologie et hépatologie).</p></template>

<template data-pop="k25-tdm-perf" data-title="Tomodensitométrie et perforation">
<div class="lab">Ce qu’elle montre</div><p>Air libre, même en petite quantité, liquide intrapéritonéal, épaississement de la paroi, parfois l’orifice et une fuite de produit de contraste hydrosoluble.</p>
<div class="lab">Recommandation</div><p>La WSES (2020) recommande la tomodensitométrie devant une suspicion de perforation (recommandation forte, preuve de faible qualité), et la radiographie si le scanner n’est pas rapidement disponible.</p>
<div class="lab">Limite</div><p>Jusqu’à 12 % des perforations peuvent avoir un scanner normal ; l’opacification hydrosoluble améliore la détection, et la clinique garde le dernier mot.</p></template>

<template data-pop="k25-boey" data-title="Score de Boey">
<div class="lab">Composantes</div><p>Trois facteurs, un point chacun : maladie associée grave, état de choc à l’admission (pression systolique inférieure à 100 mmHg), délai de plus de 24 heures depuis le début des symptômes.</p>
<div class="lab">Interprétation</div><p>La mortalité augmente avec le nombre de points. Le score aide à informer le patient et à choisir le niveau de soins.</p>
<div class="lab">Limite</div><p>La WSES (2020) note une précision variable selon les études ; l’hypoalbuminémie reste le facteur prédictif isolé le plus fort.</p></template>

<template data-pop="k25-contentieux" data-title="Choix du schéma d’éradication en Suisse">
<div class="lab">Sources en présence</div><p>1. Informations professionnelles suisses : Pylera, 10 jours avec oméprazole (novembre 2025) ; certains inhibiteurs de la pompe à protons décrivent encore des trithérapies de 7 jours (Nexium, juin 2026 ; Pantozol, septembre 2026). Ce sont les textes réglementaires en vigueur. 2. Maastricht VI/Florence (2022), consensus européen : test de sensibilité recommandé avant la première ligne ; en l’absence de test et si la résistance à la clarithromycine dépasse 15 %, quadrithérapie bismuthée ; durée de 14 jours pour les trithérapies et la quadrithérapie concomitante. 3. Guide suisse mediX, révision 07.2024, mise à jour 11.2025 : thérapie guidée par un test de sensibilité dès la première ligne ; quadrithérapie bismuthée empirique possible si l’adhésion paraît assurée ; trithérapies empiriques obsolètes ; choix empirique contre-indiqué après un échec.</p>
<div class="lab">Choix retenu</div><p>Le cours suit la source suisse la plus récente, le guide mediX 2024, compatible avec Maastricht VI : traitement guidé par la résistance, ou quadrithérapie bismuthée ; 14 jours pour les trithérapies.</p>
<div class="lab">Périmètre et niveau de preuve</div><p>Adultes en soins primaires et en gastroentérologie. Maastricht VI est un consensus d’experts gradé ; les niveaux de chaque énoncé n’ont pas pu être relus dans le texte intégral depuis l’environnement de rédaction. Le texte intégral de mediX est réservé aux membres inscrits ; son résumé public a été lu le 08.10.2026.</p>
<div class="lab">Limites</div><p>Les données suisses de résistance citées (41 % pour la clarithromycine) ne séparent pas les patients jamais traités des patients prétraités. Le test moléculaire sur selles n’était pas disponible en Suisse en 2024. Le Pylera n’est commercialisé qu’en boîte de 10 jours, ce qui renchérit un traitement de 14 jours (Raichle et Burri, 2024).</p>
<div class="lab">Accès aux textes</div><p>Maastricht VI : Gut 2022;71:1724–1762, doi:10.1136/gutjnl-2022-327745. mediX : medix.ch, guide « Infection à Helicobacter pylori et maladie ulcéreuse ». Informations professionnelles : compendium.ch et ch.oddb.org.</p></template>

<template data-pop="k25-sauvetage" data-title="Schémas de sauvetage">
<div class="lab">Principe</div><p>Après un échec, le guide mediX 2024 contre-indique un nouveau choix empirique : la culture avec antibiogramme guide le traitement. Un antibiotique déjà reçu est réutilisé seulement s’il ne sélectionne pas de résistance, comme l’amoxicilline ou la tétracycline.</p>
<div class="lab">Deuxième ligne</div><p>Après une quadrithérapie bismuthée : trithérapie ou quadrithérapie à la lévofloxacine si la souche est sensible. Après une trithérapie à la clarithromycine : quadrithérapie bismuthée ou lévofloxacine selon la sensibilité (Raichle et Burri, 2024, d’après le guide suisse).</p>
<div class="lab">Troisième ligne</div><p>Trithérapie à la rifabutine : inhibiteur de la pompe à protons deux fois par jour, amoxicilline 1000 mg deux fois par jour et rifabutine 150 mg deux fois par jour, 10 à 14 jours. La bithérapie à forte dose associe un inhibiteur à dose élevée et l’amoxicilline en trois ou quatre prises par jour. Ces doses proviennent de la littérature et des recommandations, car ni la rifabutine ni la lévofloxacine n’ont cette indication dans leur information professionnelle suisse.</p>
<div class="lab">Surveillance</div><p>La rifabutine peut provoquer une neutropénie et une coloration orangée des sécrétions ; elle induit de nombreux médicaments. La lévofloxacine expose aux tendinopathies et à l’allongement de l’intervalle QT.</p></template>

<template data-pop="k25-concern" data-title="Essai CONCERN">
<div class="lab">Question</div><p>Chez un patient qui a besoin d’aspirine et d’un AINS après un ulcère hémorragique, faut-il préférer le célécoxib ou le naproxène, chacun associé à un inhibiteur de la pompe à protons ?</p>
<div class="lab">Méthode</div><p>Essai randomisé en double aveugle, monocentrique à Hong Kong, chez 514 patients sans <i>H. pylori</i> : célécoxib 100 mg deux fois par jour ou naproxène 500 mg deux fois par jour, tous deux avec ésoméprazole 20 mg par jour et aspirine 80 mg par jour, pendant 18 mois.</p>
<div class="lab">Résultat</div><p>Récidive hémorragique haute de 5,6 % sous célécoxib contre 12,3 % sous naproxène (rapport de risques 0,44).</p>
<div class="lab">Limites</div><p>Population asiatique d’un seul centre, faible dose de célécoxib, essai non dimensionné pour comparer les événements cardiovasculaires (Chan et al., Lancet 2017).</p></template>

<template data-pop="k25-contentieux-ains" data-title="Célécoxib ou naproxène chez le patient sous aspirine">
<div class="lab">Sources en présence</div><p>L’American College of Gastroenterology (Lanza et al., 2009) proposait le naproxène associé à un inhibiteur de la pompe à protons chez le patient à risque cardiovasculaire élevé, en raison du profil cardiovasculaire jugé favorable du naproxène. L’essai CONCERN (2017) a montré, chez le patient sous aspirine avec antécédent d’ulcère hémorragique, deux fois moins de récidives hémorragiques sous célécoxib associé à l’ésoméprazole que sous naproxène associé à l’ésoméprazole.</p>
<div class="lab">Choix retenu</div><p>La source primaire la plus récente l’emporte pour le patient à risque digestif élevé : si un AINS est indispensable, le célécoxib associé à un inhibiteur de la pompe à protons est préféré au naproxène. Le naproxène associé à un inhibiteur reste l’option de la recommandation de 2009 lorsque le risque digestif est faible ou modéré.</p>
<div class="lab">Limites</div><p>CONCERN concerne une population précise (Hong Kong, sans <i>H. pylori</i>, après ulcère hémorragique). La meilleure option reste d’éviter tout AINS chez ces patients.</p></template>

<template data-pop="k25-controle" data-title="Contrôle de l’éradication">
<div class="lab">Pourquoi</div><p>Avec les résistances actuelles, l’échec est fréquent et souvent asymptomatique. Une infection persistante expose à la récidive de l’ulcère et à ses complications.</p>
<div class="lab">Comment</div><p>Test respiratoire à l’urée marquée ou antigène fécal monoclonal, au moins quatre semaines après la fin des antibiotiques et au moins deux semaines après l’arrêt de l’inhibiteur de la pompe à protons.</p>
<div class="lab">Après un échec</div><p>Culture avec antibiogramme, puis traitement guidé ; jamais la répétition du même schéma.</p></template>

<template data-pop="k25-marginal" data-title="Ulcère marginal">
<div class="lab">Définition</div><p>Ulcère du versant jéjunal d’une anastomose gastro-jéjunale, après gastrectomie partielle ou bypass gastrique ; il se code K28.</p>
<div class="lab">Mécanisme</div><p>La muqueuse jéjunale ne possède pas la défense de la muqueuse gastroduodénale contre l’acide. Le tabac, les AINS, l’ischémie de l’anastomose et la tension des sutures favorisent l’ulcère.</p>
<div class="lab">Conduite</div><p>Inhibiteur de la pompe à protons, arrêt du tabac et des AINS, recherche d’<i>H. pylori</i> dans l’estomac restant ; avis chirurgical en cas de perforation, de sténose ou d’ulcère réfractaire.</p></template>
