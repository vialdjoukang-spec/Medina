<template data-pop="k25-d-ipp" data-title="Inhibiteurs de la pompe à protons">
<div class="lab">Mécanisme</div><p>Prodrogues activées en milieu acide dans le canalicule de la cellule pariétale ; liaison covalente irréversible aux pompes actives. La sécrétion reprend quand de nouvelles pompes sont synthétisées.</p>
<div class="lab">Formes suisses</div><p>Pantoprazole 20 et 40 mg (Pantozol, comprimés gastrorésistants, granulés et forme intraveineuse) ; ésoméprazole 20 et 40 mg (Nexium, comprimés et forme intraveineuse) ; oméprazole (Antra) ; génériques.</p>
<div class="lab">Doses</div><p>Ulcère : pantoprazole 40 mg une fois par jour, 2 à 4 semaines pour le duodénum et 4 à 8 semaines pour l’estomac ; dose doublée possible dans un ulcère qui répond mal (Pantozol, septembre 2026). Prévention sous AINS : ésoméprazole 20 mg par jour (Nexium, juin 2026). Éradication : deux prises par jour.</p>
<div class="lab">Adaptations</div><p>Insuffisance hépatique grave : 20 mg par jour au maximum pour le pantoprazole et l’ésoméprazole. Insuffisance rénale et sujet âgé : pas plus de 40 mg par jour de pantoprazole.</p>
<div class="lab">Effets indésirables et précautions</div><p>Céphalées, troubles digestifs. Au long cours, associations observationnelles avec les fractures, l’hypomagnésémie, la carence en vitamine B12 et certaines infections intestinales. Le traitement peut masquer les symptômes d’un cancer gastrique : un signe d’alarme impose une endoscopie avant de le poursuivre.</p>
<div class="lab">Grossesse et allaitement</div><p>L’emploi se décide selon l’information professionnelle de chaque produit ; l’oméprazole est la molécule la mieux documentée pendant la grossesse.</p></template>

<template data-pop="k25-d-pylera" data-title="Pylera">
<div class="lab">Composition</div><p>Par gélule : sous-citrate de bismuth potassique 140 mg, métronidazole 125 mg et chlorhydrate de tétracycline 125 mg.</p>
<div class="lab">Indication suisse</div><p>Avec l’oméprazole, éradication d’<i>H. pylori</i> après échec d’une trithérapie ou en cas de résistance à la clarithromycine démontrée ou fortement suspectée.</p>
<div class="lab">Posologie</div><p>Trois gélules après le petit-déjeuner, le déjeuner, le dîner et au coucher, soit 12 gélules par jour, pendant 10 jours, avec oméprazole 20 mg deux fois par jour après le petit-déjeuner et le dîner. Une prise oubliée se rattrape en prolongeant le traitement, sans doubler une dose.</p>
<div class="lab">Contre-indications</div><p>Grossesse et allaitement, enfant de moins de 12 ans, insuffisance rénale ou hépatique, hypersensibilité aux dérivés nitro-imidazolés, syndrome de Cockayne.</p>
<div class="lab">Effets indésirables</div><p>Selles noires (17,2 %), nausées (10,6 %), diarrhée (10,4 %), goût métallique, élévation des transaminases. Arrêt immédiat en cas de signe neurologique ou d’éruption bulleuse grave.</p>
<div class="lab">Interactions</div><p>Pas d’alcool pendant le traitement et 24 heures après ; renforcement des coumariniques ; lithium ; antiacides, fer, calcium et produits laitiers à distance.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch et ch.oddb.org, Pylera, mise à jour novembre 2025, consultée le 08.10.2026.</p></template>

<template data-pop="k25-d-amox" data-title="Amoxicilline">
<div class="lab">Mécanisme</div><p>Bêta-lactamine qui bloque la synthèse de la paroi des bactéries en multiplication. L’élévation du pH par l’inhibiteur de la pompe à protons fait se multiplier <i>H. pylori</i> et le rend plus sensible.</p>
<div class="lab">Dose dans l’éradication</div><p>750 ou 1000 mg deux fois par jour avec un inhibiteur de la pompe à protons et un autre antibiotique, pendant 10 à 14 jours selon l’information professionnelle d’Amoxi-Mepha (août 2024) ; 1000 mg deux fois par jour pendant 14 jours dans les schémas recommandés.</p>
<div class="lab">Résistance</div><p>Rare en Europe (3,3 % en 2020–2024).</p>
<div class="lab">Précautions</div><p>Contre-indiquée en cas d’allergie vraie aux pénicillines ; moins de 5 % des allergies rapportées sont des allergies immunologiques confirmées, ce qui justifie un bilan allergologique (Raichle et Burri, 2024). Adaptation en cas d’insuffisance rénale sévère.</p></template>

<template data-pop="k25-d-clari" data-title="Clarithromycine">
<div class="lab">Mécanisme</div><p>Macrolide qui se fixe sur l’ARN ribosomique 23S et bloque la synthèse protéique.</p>
<div class="lab">Dose dans l’éradication</div><p>500 mg deux fois par jour avec l’amoxicilline 1000 mg deux fois par jour et un inhibiteur de la pompe à protons (Klacid, mars 2026). Les recommandations actuelles fixent la durée à 14 jours et réservent ce schéma aux souches sensibles.</p>
<div class="lab">Contre-indications et interactions</div><p>Association contre-indiquée avec la simvastatine, la lovastatine, les dérivés de l’ergot, la dompéridone, la quétiapine et d’autres médicaments qui allongent l’intervalle QT. Inhibition puissante du CYP3A4 et de la glycoprotéine P.</p>
<div class="lab">Effets indésirables</div><p>Goût métallique, troubles digestifs, allongement de l’intervalle QT.</p></template>

<template data-pop="k25-d-levo" data-title="Lévofloxacine">
<div class="lab">Mécanisme</div><p>Fluoroquinolone qui inhibe l’ADN gyrase.</p>
<div class="lab">Statut en Suisse</div><p>L’information professionnelle de Tavanic (mai 2026) ne mentionne pas <i>H. pylori</i> ; son emploi dans l’éradication est hors indication autorisée. Elle précise aussi que plusieurs indications ne sont retenues que si les antibiotiques de première intention ne conviennent pas, ce qui reflète les restrictions d’emploi des fluoroquinolones.</p>
<div class="lab">Place</div><p>Souche sensible documentée, de préférence en deuxième ligne ; trithérapie possible en première ligne selon mediX 2024 si la clarithromycine est résistante.</p>
<div class="lab">Risques</div><p>Tendinopathies et ruptures tendineuses, surtout après 60 ans et sous corticostéroïdes ; allongement de l’intervalle QT ; dysglycémies ; contre-indication avant 18 ans.</p></template>

<template data-pop="k25-d-rifab" data-title="Rifabutine">
<div class="lab">Mécanisme</div><p>Rifamycine qui inhibe l’ARN polymérase bactérienne. La résistance d’<i>H. pylori</i> à cette classe reste basse en Europe (rifampicine 6,9 % en 2020–2024, valeur indirecte).</p>
<div class="lab">Statut en Suisse</div><p>Mycobutin (avril 2026) est autorisé pour les mycobactérioses ; l’éradication d’<i>H. pylori</i> est hors indication autorisée.</p>
<div class="lab">Place</div><p>Troisième ligne, après antibiogramme, en trithérapie avec l’amoxicilline et un inhibiteur de la pompe à protons.</p>
<div class="lab">Risques</div><p>Neutropénie, uvéite à forte dose, coloration orangée des urines et des larmes, induction enzymatique avec perte d’efficacité des contraceptifs hormonaux et de nombreux médicaments. Avant de la prescrire, le médecin écarte une tuberculose active, pour ne pas sélectionner de résistance.</p></template>

<template data-pop="k25-d-miso" data-title="Misoprostol">
<div class="lab">Mécanisme</div><p>Analogue de synthèse des prostaglandines de la série E. Il restaure la défense muqueuse et diminue la sécrétion acide.</p>
<div class="lab">Doses suisses</div><p>Traitement de l’ulcère : 800 µg par jour en deux ou quatre prises, avec les repas et au coucher, pendant 4 à 8 semaines. Prévention sous AINS dans l’arthrose ou la polyarthrite sévère : 400 à 800 µg par jour en deux prises (Cytotec, février 2026). La prévention des complications graves n’est démontrée qu’à 800 µg par jour (Arthrotec, octobre 2024).</p>
<div class="lab">Contre-indication majeure</div><p>Grossesse : il provoque des contractions utérines et peut entraîner un avortement. Une contraception efficace est nécessaire chez la femme en âge de procréer.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée et douleurs abdominales, dose-dépendantes, qui limitent l’adhésion.</p></template>
