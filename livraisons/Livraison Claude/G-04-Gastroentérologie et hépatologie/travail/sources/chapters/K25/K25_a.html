<section class="ilot" id="k25-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 58 ans, chauffeur de bus à Neuchâtel, consulte pour une douleur du creux épigastrique qui dure depuis cinq semaines. La douleur est une brûlure, elle survient deux à trois heures après les repas et le réveille vers 2 heures du matin. Un repas ou un verre de lait la calme pendant une heure. Il prend de l’ibuprofène 400 mg trois fois par jour depuis six semaines pour une gonarthrose. Il reçoit aussi de l’<button class="w" data-k="k25-aspirine">aspirine à faible dose (100 mg par jour)</button> depuis la pose d’un stent coronaire en 2019. Il est né au Kosovo et vit en Suisse depuis 1994. Il fume 15 cigarettes par jour. L’hémoglobine est à 118 g/L et la ferritine à 18 µg/L.</p>
<p>La question qui structure le cours est la suivante : <b>cet homme a-t-il un ulcère gastroduodénal, quelle en est la cause, faut-il une gastroscopie et quand, comment traiter <i>Helicobacter pylori</i> malgré les résistances suisses, et comment protéger son estomac sans arrêter l’aspirine qui protège son stent ?</b></p>
<p>À la fin du cours, le médecin assistant sait reconnaître une douleur ulcéreuse et ses signes d’alarme. Il identifie les deux grandes causes, <i>Helicobacter pylori</i> et les <button class="w" data-k="k25-ains">anti-inflammatoires non stéroïdiens (AINS)</button>, et recherche les causes rares. Il prescrit une éradication guidée par la résistance ou, à défaut, une <button class="w" data-k="k25-bq">quadrithérapie bismuthée</button>, puis vérifie l’éradication. Il reconnaît la perforation et la sténose, oriente l’hémorragie vers la prise en charge du cours K92, et prévient les récidives chez le patient qui doit garder un antithrombotique.</p>
<div class="key"><b>Message fondateur.</b> Un ulcère gastroduodénal est une perte de substance de la muqueuse qui traverse la musculaire muqueuse. Il apparaît quand l’agression acide et peptique dépasse les défenses de la muqueuse. Dans la grande majorité des cas, une cause identifiable affaiblit ces défenses : <i>H. pylori</i>, un AINS ou l’aspirine. Le traitement ne se limite donc jamais à l’inhibition de l’acide : il supprime la cause, sinon l’ulcère récidive.</div>
<div class="key"><b>Prérequis.</b> La sécrétion acide de l’estomac et la barrière muqueuse sont développées dans l’onglet Sciences fondamentales. La conduite devant une hématémèse ou un méléna relève du cours K92 — Hémorragie digestive (G-04-Gastroentérologie et hépatologie). Les gastrites relèvent du cours K29 — Gastrites, duodénites et autres maladies de l’estomac, et la douleur épigastrique sans lésion relève du cours K30 — Dyspepsie fonctionnelle.</div>
</section>

<section class="ilot" id="k25-1"><h2><span class="n">1</span>Définitions, codage et classifications</h2>
<p>Un <button class="w" data-k="k25-def">ulcère peptique</button> est une perte de substance de la paroi digestive exposée à l’acide et à la pepsine. Il dépasse la musculaire muqueuse et atteint au moins la sous-muqueuse. Une <b>érosion</b> reste au contraire limitée à la muqueuse. Cette différence de profondeur a une conséquence directe : l’érosion guérit sans cicatrice en quelques jours, alors que l’ulcère peut atteindre les artères de la sous-muqueuse et saigner, ou traverser la paroi et perforer. À l’endoscopie, les études cliniques appellent habituellement « ulcère » une lésion d’au moins 5 mm avec une profondeur visible ; ce seuil est une convention d’étude, et non une définition histologique.</p>
<p>L’ulcère siège là où l’acide atteint la muqueuse. Il est le plus souvent duodénal, dans le bulbe, ou gastrique, surtout sur la petite courbure et l’antre. Il peut aussi siéger dans le bas œsophage, sur une anastomose gastro-jéjunale après chirurgie, ou dans un diverticule de Meckel qui contient de la muqueuse gastrique ectopique.</p>
<h3>1.1 Codage CIM-10-GM 2024</h3>
<p>Le codeur choisit d’abord la catégorie selon le siège, puis la quatrième position selon le caractère aigu ou chronique et selon la présence d’une hémorragie ou d’une perforation. La question utile est donc toujours : « Où est l’ulcère, et a-t-il saigné ou perforé ? »</p>
<table class="t"><tr><th>Catégorie</th><th>Intitulé CIM-10-GM 2024</th><th>Inclusions et exclusions principales</th></tr>
<tr><td>K25</td><td>Ulcère de l’estomac</td><td>Ulcère gastrique et pylorique. L’érosion aiguë de l’estomac et la gastrite érosive hémorragique relèvent de K29.</td></tr>
<tr><td>K26</td><td>Ulcère du duodénum</td><td>Ulcère duodénal et post-pylorique. L’érosion aiguë du duodénum relève de K29.</td></tr>
<tr><td>K27</td><td>Ulcère digestif, de siège non précisé</td><td>Ulcère peptique ou gastroduodénal sans autre précision. L’ulcère du nouveau-né se code <button class="w" data-k="k25-p788">P78.8</button>.</td></tr>
<tr><td>K28</td><td>Ulcère gastro-jéjunal</td><td>Ulcère ou érosion anastomotique, marginal ou stomal après gastrectomie. L’ulcère primitif de l’intestin grêle se code <button class="w" data-k="k25-k633">K63.3</button>.</td></tr></table>
<p>Les quatre catégories partagent les mêmes <button class="w" data-k="k25-cim4">quatrièmes positions</button>. Le tableau suivant les présente pour l’ulcère du duodénum, mais la règle est identique pour K25, K27 et K28.</p>
<table class="t"><tr><th>Position</th><th>Ulcère aigu</th><th>Ulcère chronique ou non précisé</th></tr>
<tr><td>Avec hémorragie</td><td>.0</td><td>.4</td></tr>
<tr><td>Avec perforation</td><td>.1</td><td>.5</td></tr>
<tr><td>Avec hémorragie et perforation</td><td>.2</td><td>.6</td></tr>
<tr><td>Sans hémorragie ni perforation</td><td>.3</td><td>.7 (chronique)</td></tr>
<tr><td>Ni aigu ni chronique précisé, sans complication</td><td colspan="2">.9</td></tr></table>
<p>La lecture se fait colonne par colonne. Exemple : le patient du cas fil rouge a un ulcère bulbaire non compliqué, de caractère non précisé ; il reçoit <button class="w" data-k="k25-codes">K26.9</button>. S’il avait saigné, le code serait K26.4 et non un code de la catégorie K92, car la CIM-10-GM exclut de K92 les hémorragies dues à un ulcère digestif. L’AINS responsable se code en plus par un code supplémentaire du vingtième chapitre (causes externes), comme le demande la note de codage de K25 et K26.</p>
<h3>1.2 Classification topographique des ulcères gastriques</h3>
<p>La <button class="w" data-k="k25-johnson">classification de Johnson</button> distingue les ulcères gastriques selon leur siège et leur rapport avec la sécrétion acide. Elle reste utile en chirurgie et pour comprendre pourquoi certains ulcères gastriques surviennent avec une acidité basse.</p>
<div class="two">
<div class="card"><h4>Type I</h4><p>Il siège sur la petite courbure du corps, près de l’angulus. L’acidité est normale ou basse. Le mécanisme dominant est une faiblesse de la muqueuse, souvent sur une gastrite à <i>H. pylori</i>.</p></div>
<div class="card"><h4>Types II et III</h4><p>Le type II associe un ulcère gastrique et un ulcère duodénal. Le type III est prépylorique. Les deux s’accompagnent d’une hypersécrétion acide et se comportent comme un ulcère duodénal.</p></div>
<div class="card"><h4>Type IV</h4><p>Il siège très haut sur la petite courbure, près de la jonction œso-gastrique. Il pose surtout des problèmes chirurgicaux.</p></div>
<div class="card"><h4>Type V</h4><p>Il peut siéger partout dans l’estomac. Il est provoqué par les AINS ou l’aspirine, qui suppriment la protection par les prostaglandines.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un ulcère gastrique n’est pas « bénin » parce qu’il cicatrise sous inhibiteur de la pompe à protons. Un adénocarcinome ulcéré peut se réépithélialiser partiellement. Tout ulcère gastrique est donc biopsié, et son contrôle endoscopique se discute jusqu’à cicatrisation (îlot 11).</div>
<div class="key"><b>À retenir.</b> L’ulcère dépasse la musculaire muqueuse, contrairement à l’érosion, ce qui explique l’hémorragie et la perforation. Le code dépend du siège (K25 estomac, K26 duodénum, K27 siège non précisé, K28 anastomose) et de la quatrième position (aigu ou chronique, hémorragie, perforation). La classification de Johnson relie le siège gastrique au niveau d’acidité.</div>
</section>

<section class="ilot" id="k25-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La maladie ulcéreuse touche 5 à 10 % de la population générale au cours de la vie, avec une incidence de 0,1 à 0,3 % par an. Les complications surviennent chez 10 à 20 % des patients (WSES 2020). L’incidence, les hospitalisations et la mortalité ont fortement baissé en trente ans. Cette baisse s’explique par deux facteurs démontrés : la diminution de la prévalence d’<i>H. pylori</i> et la diffusion des inhibiteurs de la pompe à protons (Lanas et Chan, 2017).</p>
<p>La Suisse a l’une des prévalences d’<i>H. pylori</i> les plus basses du monde. Une méta-analyse de 184 études l’estime à 18,9 % (intervalle de confiance à 95 % de 13,1 à 24,7 %), contre 87,7 % au Nigeria (Hooi et al., 2017). Cette moyenne masque une forte différence selon l’origine : l’infection s’acquiert dans l’enfance, et les personnes nées dans un pays de forte prévalence restent souvent infectées à l’âge adulte. Le patient du cas fil rouge, né au Kosovo, a donc une probabilité d’infection plus élevée que la moyenne suisse.</p>
<p>La part relative des causes a changé. Comme <i>H. pylori</i> recule et que la population vieillit, la proportion d’ulcères liés aux AINS, à l’aspirine et aux autres antithrombotiques augmente. Les ulcères sans <i>H. pylori</i> et sans AINS deviennent aussi plus fréquents et posent un problème diagnostique propre (Lanas et Chan, 2017).</p>
<h3>2.1 Résistances d’<i>H. pylori</i> en Suisse et en Europe</h3>
<p>La résistance aux antibiotiques est le premier déterminant de l’échec d’une éradication. Les seuils de décision sont fixés à 15 % pour la clarithromycine et la lévofloxacine et à 30 % pour le métronidazole : au-delà, l’usage empirique de l’antibiotique n’est plus recommandé (Maastricht VI, 2022). En Suisse, les données de surveillance citées en 2024 donnent 41 % de résistance à la clarithromycine, 26 % à la lévofloxacine et 44 % au métronidazole ; elles ne séparent pas les patients jamais traités des patients déjà traités (Raichle et Burri, 2024, d’après la surveillance suisse <button class="w" data-k="k25-resist">anresis</button>).</p>
<p>En Europe, la résistance primaire, mesurée avant tout traitement, atteint en 2020–2024 24,4 % pour la clarithromycine, 20,7 % pour la lévofloxacine et 34,2 % pour le métronidazole. Elle reste basse pour l’amoxicilline (3,3 %) et la tétracycline (0,7 %) (Nafria et al., 2026). Cette différence entre antibiotiques explique la construction des schémas actuels : l’amoxicilline et la tétracycline restent fiables, la clarithromycine ne l’est plus sans test.</p>
<div class="key"><b>Chiffre à connaître.</b> En Suisse, plus d’une souche d’<i>H. pylori</i> sur trois est résistante à la clarithromycine. Une trithérapie empirique à la clarithromycine est donc considérée comme obsolète par le guide suisse mediX de 2024 ; l’éradication se guide par un test de résistance ou, à défaut, utilise une quadrithérapie bismuthée.</div>
<h3>2.2 Pronostic</h3>
<p>Un ulcère non compliqué cicatrise sous inhibiteur de la pompe à protons en quatre à huit semaines. Le pronostic à long terme dépend de la cause : après une éradication réussie, la récidive devient rare ; si <i>H. pylori</i> persiste ou si l’AINS est repris sans protection, la récidive est fréquente. La mortalité de l’ulcère est celle de ses complications. Pour la perforation, chaque heure de retard entre l’admission et la chirurgie diminue la probabilité de survie d’environ 2,4 % dans une cohorte danoise de 2 688 patients citée par la WSES (2020).</p>
<div class="key"><b>À retenir.</b> L’ulcère est devenu moins fréquent, mais il touche des patients plus âgés, plus souvent sous AINS ou antithrombotiques. La Suisse a peu d’<i>H. pylori</i>, sauf chez les personnes nées dans des pays de forte prévalence, et ses souches sont très souvent résistantes à la clarithromycine. La physiopathologie explique ensuite pourquoi ces deux causes créent un ulcère.</div>

</section>

<section class="ilot" id="k25-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se résume à un déséquilibre entre deux forces : l’agression par l’acide et la pepsine, et la défense de la muqueuse. Chaque étiologie agit sur l’un des plateaux, et chaque traitement rétablit l’équilibre par un mécanisme précis.</p>
<h3>3.1 État normal : une muqueuse qui résiste à un pH de 1 à 2</h3>
<p>La cellule pariétale du fundus et du corps sécrète l’acide chlorhydrique par la <button class="w" data-k="k25-pompe">pompe à protons</button>. Trois signaux la stimulent : la gastrine venue de l’antre, l’histamine des cellules entérochromaffines et l’acétylcholine du nerf vague. La muqueuse survit à ce pH grâce à une <button class="w" data-k="k25-barriere">barrière muqueuse en plusieurs couches</button> : un gel de mucus riche en bicarbonate qui maintient un pH proche de 7 au contact des cellules, des jonctions serrées, un renouvellement rapide de l’épithélium et un débit sanguin qui évacue les ions hydrogène. Les <b>prostaglandines</b>, produites par la cyclo-oxygénase de type 1 (<button class="w" data-k="k25-cox">COX-1</button>), entretiennent chacune de ces défenses.</p>
<h3>3.2 Première charnière : <i>H. pylori</i> modifie la sécrétion et affaiblit la muqueuse</h3>
<p><i>H. pylori</i> survit à l’acide grâce à son <button class="w" data-k="k25-urease">uréase</button>, qui produit de l’ammoniac autour de la bactérie. Il colonise le mucus et adhère à l’épithélium. Ses facteurs de virulence, dont l’îlot <button class="w" data-k="k25-caga">CagA</button> et la toxine VacA, entretiennent une gastrite chronique active. La conséquence dépend de la topographie de cette gastrite.</p>
<p>Quand la gastrite prédomine dans l’<b>antre</b>, l’inflammation détruit les cellules à somatostatine. La somatostatine freine normalement la gastrine : sa baisse augmente donc la gastrine et la sécrétion acide. L’excès d’acide arrive dans le bulbe, y transforme l’épithélium en épithélium de type gastrique, que la bactérie colonise ensuite. Le résultat est l’<b>ulcère duodénal</b>. Quand la gastrite atteint aussi le <b>corps</b>, la masse de cellules pariétales diminue et l’acidité baisse : l’ulcère est alors <b>gastrique</b>, par faiblesse de la muqueuse plutôt que par excès d’acide. Cette même pangastrite atrophique fait le lit de l’adénocarcinome gastrique.</p>
<h3>3.3 Deuxième charnière : les AINS et l’aspirine suppriment la défense</h3>
<p>Les AINS bloquent la COX-1 de la muqueuse et donc la synthèse des prostaglandines protectrices. Le mucus et le bicarbonate diminuent, le débit sanguin muqueux baisse et l’épithélium se renouvelle moins vite. Les AINS acides lèsent aussi directement l’épithélium par un <button class="w" data-k="k25-ains-topique">effet topique</button>. L’aspirine ajoute un troisième effet : elle bloque de façon irréversible la COX-1 des plaquettes pour toute leur durée de vie. Une lésion qui saigne saigne donc plus longtemps. C’est pourquoi les ulcères médicamenteux sont souvent révélés par une hémorragie sans douleur préalable : l’AINS supprime aussi la douleur inflammatoire.</p>
<h3>3.4 Troisième charnière : de la lésion à la complication</h3>
<p>L’acide et la pepsine creusent la lésion. Quand le fond de l’ulcère atteint une artère de la sous-muqueuse ou de la paroi, l’ulcère saigne. Un ulcère bulbaire <b>postérieur</b> peut éroder l’<button class="w" data-k="k25-agd">artère gastroduodénale</button> et provoquer une hémorragie massive. Un ulcère de la face <b>antérieure</b> n’a pas d’organe qui le recouvre : il perfore dans la cavité péritonéale. Un ulcère postérieur qui traverse la paroi peut aussi pénétrer dans le pancréas. Enfin, la cicatrisation répétée d’un ulcère du canal pylorique ou du bulbe crée une fibrose qui rétrécit la lumière et provoque une sténose.</p>

<div class="key"><b>À retenir.</b> <i>H. pylori</i> agit selon la topographie de la gastrite : excès d’acide et ulcère duodénal si l’antre est atteint, faiblesse muqueuse et ulcère gastrique si le corps est atteint. Les AINS et l’aspirine suppriment les prostaglandines protectrices, et l’aspirine allonge le saignement. La face postérieure du bulbe saigne, la face antérieure perfore. Les étiologies précisent ensuite les causes à rechercher.</div>

<section class="ilot" id="k25-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Le médecin cherche systématiquement une cause, car c’est elle qui conditionne la récidive. Le tableau classe les causes selon leur fréquence en Europe et indique l’élément qui les fait reconnaître.</p>
<table class="t"><tr><th>Cause</th><th>Mécanisme principal</th><th>Indice qui oriente</th><th>Examen qui confirme</th></tr>
<tr><td><i>H. pylori</i></td><td>Gastrite chronique ; hypersécrétion ou faiblesse muqueuse</td><td>Origine d’un pays de forte prévalence ; ulcère duodénal ; antécédent familial</td><td>Biopsies, <button class="w" data-k="k25-test-resp">test respiratoire</button> ou <button class="w" data-k="k25-ag-selles">antigène fécal</button></td></tr>
<tr><td>AINS, aspirine</td><td>Suppression des prostaglandines ; effet antiplaquettaire</td><td>Prise documentée, y compris en automédication</td><td>Anamnèse médicamenteuse</td></tr>
<tr><td>Association de facteurs</td><td><button class="w" data-k="k25-synergie">Effets additifs</button> de l’infection, des AINS, des anticoagulants, des corticostéroïdes et des ISRS</td><td>Sujet âgé polymédiqué</td><td>Anamnèse et recherche d’<i>H. pylori</i></td></tr>
<tr><td><button class="w" data-k="k25-zes">Syndrome de Zollinger-Ellison</button></td><td>Gastrinome : sécrétion acide maximale permanente</td><td>Ulcères multiples, distaux ou récidivants ; diarrhée</td><td>Gastrinémie à jeun et pH gastrique</td></tr>
<tr><td>Ulcère de stress</td><td>Ischémie muqueuse en réanimation</td><td>Choc, ventilation mécanique, coagulopathie</td><td>Gastroscopie</td></tr>
<tr><td>Autres médicaments</td><td>Lésion directe ou ischémique</td><td>Bisphosphonates, chlorure de potassium, chimiothérapie intra-artérielle, cocaïne</td><td>Anamnèse</td></tr>
<tr><td>Causes rares</td><td>Infection, inflammation, tumeur</td><td>Immunodépression, maladie de Crohn, masse</td><td>Biopsies (cytomégalovirus, granulomes, carcinome, lymphome)</td></tr>
<tr><td><button class="w" data-k="k25-idiopathique">Ulcère idiopathique</button></td><td>Inconnu ; diagnostic d’exclusion</td><td>Tests <i>H. pylori</i> négatifs et aucun AINS</td><td>Exclusion répétée des autres causes</td></tr></table>
<p>La première ligne à vérifier est la troisième : les causes se cumulent. Exemple : le patient du cas fil rouge associe un AINS, de l’aspirine et une possible infection ; chacun de ces facteurs doit être traité, car traiter un seul laisse les autres actifs.</p>
<h3>4.1 Le risque médicamenteux se mesure</h3>
<p>Le risque de complication digestive haute varie selon l’AINS. Une méta-analyse de 28 études observationnelles donne un risque relatif de 1,45 pour le célécoxib, 1,84 pour l’ibuprofène, 3,34 pour le diclofénac, 4,10 pour le naproxène, 7,43 pour le piroxicam et 11,50 pour le kétorolac, par rapport à la non-utilisation. Les fortes doses quotidiennes doublent ou triplent le risque des faibles doses (Castellsague et al., 2012). Ces chiffres sont des associations observationnelles ajustées : ils classent les molécules, mais ne mesurent pas le risque individuel, qui dépend surtout des <button class="w" data-k="k25-facteurs-ains">facteurs de risque du patient</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Oublier l’automédication. L’ibuprofène et le naproxène sont vendus sans ordonnance en pharmacie, et l’aspirine figure dans des associations contre le rhume. Le médecin demande donc : « Prenez-vous des médicaments contre la douleur, la fièvre ou le rhume, même achetés sans ordonnance ? »</div>
<div class="key"><b>À retenir.</b> <i>H. pylori</i> et les AINS ou l’aspirine expliquent la majorité des ulcères, souvent ensemble. Un ulcère multiple, distal, récidivant ou accompagné de diarrhée fait rechercher un syndrome de Zollinger-Ellison. Un ulcère sans <i>H. pylori</i> ni AINS n’est déclaré idiopathique qu’après une recherche soigneuse des autres causes.</div>
</section>

<section class="ilot" id="k25-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit trois buts : reconnaître une douleur compatible, chercher les signes d’alarme qui imposent une gastroscopie rapide, et identifier la cause. Elle se mène dans cet ordre, car un signe d’alarme change immédiatement la conduite.</p>
<h3>5.1 La douleur</h3>
<p>La douleur typique est une brûlure ou une crampe du creux épigastrique, sans irradiation. Elle survient de façon rythmée par les repas et évolue par périodes de quelques semaines. La <button class="w" data-k="k25-douleur">chronologie de la douleur</button> oriente vers le siège : dans l’ulcère duodénal, elle apparaît deux à trois heures après le repas et la nuit, puis cède avec l’alimentation, qui tamponne l’acide ; dans l’ulcère gastrique, elle peut être déclenchée par le repas. Ces différences sont peu spécifiques et ne permettent pas de localiser l’ulcère sans endoscopie.</p>
<p>La valeur diagnostique de la douleur est faible. Beaucoup de patients dyspeptiques n’ont pas d’ulcère : leur diagnostic est une <b>dyspepsie fonctionnelle</b>, traitée dans le cours K30. À l’inverse, une partie des ulcères est silencieuse, surtout chez le sujet âgé et sous AINS, et se révèle par une complication.</p>
<h3>5.2 Signes d’alarme</h3>
<p>Certains signes font craindre une complication ou un cancer. Leur présence impose une gastroscopie rapide, au lieu d’un traitement d’épreuve. Les <button class="w" data-k="k25-alarme">signes d’alarme</button> sont l’hématémèse, le méléna, l’anémie ferriprive, la perte de poids involontaire, la dysphagie, les vomissements persistants, une masse palpable, et des symptômes nouveaux après 50 ans. Le guide mediX de 2024 tient aussi compte du risque de cancer gastrique propre à la région d’origine pour décider de rechercher <i>H. pylori</i>, car ce risque varie fortement d’un pays à l’autre.</p>
<h3>5.3 Recherche de la cause</h3>
<p>Le médecin établit la liste complète des médicaments, avec la dose et la durée : AINS, aspirine, antiplaquettaires, anticoagulants, corticostéroïdes, ISRS, bisphosphonates. Il demande les antécédents d’ulcère, d’hémorragie digestive et d’éradication, avec les antibiotiques déjà reçus, car chaque traitement antérieur augmente la probabilité de résistance. Il note le pays de naissance, le tabac et l’alcool. Le tabac retarde la cicatrisation et favorise la récidive ; l’alcool à forte dose lèse la muqueuse, mais n’est pas une cause démontrée d’ulcère chronique. Une diarrhée chronique, des calculs rénaux ou une hypercalcémie familiale orientent vers un gastrinome dans le cadre d’une <button class="w" data-k="k25-nem1">néoplasie endocrinienne multiple de type 1</button>.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Un homme de 45 ans, d’origine portugaise, a des douleurs épigastriques nocturnes calmées par les repas depuis trois semaines. Il n’a pas de signe d’alarme. Le test d’<i>H. pylori</i> est positif.</p></div>
<div class="card"><h4>Forme silencieuse sous AINS</h4><p>Une femme de 79 ans, sous diclofénac pour une coxarthrose, présente un méléna et un malaise sans douleur préalable. L’ulcère est découvert par sa complication.</p></div>
<div class="card"><h4>Forme compliquée inaugurale</h4><p>Un homme de 66 ans, fumeur, ressent une douleur épigastrique brutale « en coup de poignard » qui diffuse à tout l’abdomen. Il s’agit d’une perforation jusqu’à preuve du contraire.</p></div>
<div class="card"><h4>Forme atypique</h4><p>Un homme de 41 ans a des ulcères duodénaux récidivants malgré l’éradication et une diarrhée chronique. Le tableau fait rechercher un syndrome de Zollinger-Ellison.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un inhibiteur de la pompe à protons pris avant la consultation calme la douleur et peut cicatriser partiellement un cancer gastrique ulcéré. Il diminue aussi la sensibilité des tests d’<i>H. pylori</i>. Le médecin demande donc toujours si un traitement antiacide a été pris, quand et pendant combien de temps.</div>
<div class="key"><b>À retenir.</b> La douleur ulcéreuse est épigastrique, rythmée par les repas et périodique, mais elle n’est ni sensible ni spécifique. Les signes d’alarme imposent une gastroscopie rapide. L’anamnèse médicamenteuse complète, les éradications antérieures et le pays de naissance orientent la cause et le choix des antibiotiques.</div>
</section>

<section class="ilot" id="k25-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen d’un ulcère non compliqué est souvent normal, en dehors d’une sensibilité épigastrique. Son rôle principal est de repérer une complication et d’en mesurer la gravité. Le médecin compare chaque constatation au normal.</p>
<div class="two">
<div class="card"><h4>Constantes et état général</h4><p>Chez l’adulte au repos, la fréquence cardiaque normale est de 60 à 100 par minute et la pression artérielle systolique supérieure à 100 mmHg. Une tachycardie, une hypotension ou une pâleur font rechercher une hémorragie. La fièvre et la polypnée accompagnent une péritonite. Le poids se compare au poids habituel.</p></div>
<div class="card"><h4>Palpation de l’abdomen</h4><p>L’abdomen normal est souple et indolore. Une sensibilité épigastrique est fréquente mais non spécifique. Une <button class="w" data-k="k25-defense">défense ou une contracture</button> généralisée signe une péritonite et impose l’imagerie urgente.</p></div>
<div class="card"><h4>Percussion et succussion</h4><p>La disparition de la matité préhépatique évoque un pneumopéritoine, mais elle manque souvent. Un <button class="w" data-k="k25-clapotage">clapotage à jeun</button> évoque une stase gastrique sur sténose.</p></div>
<div class="card"><h4>Toucher rectal et signes indirects</h4><p>Le toucher rectal recherche un méléna, qui signe un saignement digestif haut ou du grêle. Une déshydratation et une alcalose métabolique accompagnent les vomissements prolongés de la sténose.</p></div></div>
<p>Exemple : le patient du cas fil rouge a une fréquence cardiaque de 84 par minute, une pression artérielle de 138/82 mmHg, une sensibilité épigastrique sans défense, un toucher rectal sans méléna et des conjonctives un peu pâles. L’examen ne montre pas de complication aiguë, mais l’anémie ferriprive est un signe d’alarme qui impose la gastroscopie.</p>
<div class="key"><b>À retenir.</b> Un ulcère non compliqué donne peu de signes. L’examen cherche avant tout l’hémorragie (tachycardie, hypotension, méléna), la perforation (contracture, disparition de la matité préhépatique) et la sténose (clapotage à jeun, vomissements, alcalose). La démarche diagnostique organise ensuite la confirmation et la recherche de la cause.</div>
