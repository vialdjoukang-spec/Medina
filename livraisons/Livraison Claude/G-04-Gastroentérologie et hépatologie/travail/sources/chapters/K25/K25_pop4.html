<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-k25-bases" data-title="Pareto — Définitions, codage et épidémiologie">
<p class="ratio" data-cover="k25-0,k25-1,k25-2"></p>
<ul>
<li>Ulcère = perte de substance qui franchit la musculaire muqueuse ; érosion = muqueuse seule. La profondeur explique hémorragie et perforation.</li>
<li>K25 estomac, K26 duodénum, K27 siège non précisé, K28 anastomose. Quatrième position : aigu .0 à .3, chronique .4 à .7, .9 sans précision ; un ulcère qui saigne reste dans K25–K28, pas dans K92.</li>
<li>Prévalence vie entière 5 à 10 % ; complications chez 10 à 20 %.</li>
<li><i>H. pylori</i> en Suisse : 18,9 %, plus fréquent chez les personnes nées dans un pays de forte prévalence.</li>
<li>Résistances suisses : clarithromycine 41 %, lévofloxacine 26 %, métronidazole 44 % ; seuils empiriques 15 % et 30 % → trithérapie empirique à la clarithromycine obsolète.</li>
<li>Tout ulcère gastrique est biopsié : un cancer ulcéré peut cicatriser sous antiacide.</li></ul></template>

<template data-pop="pareto-k25-meca" data-title="Pareto — Mécanismes, causes et clinique">
<p class="ratio" data-cover="k25-3,k25-4,k25-5,k25-6"></p>
<ul>
<li>Ulcère = agression acide et peptique plus forte que la défense (mucus, bicarbonate, débit sanguin, prostaglandines).</li>
<li><i>H. pylori</i> antral → gastrine et acide augmentés → ulcère duodénal ; pangastrite → acide bas, muqueuse faible → ulcère gastrique, risque de cancer.</li>
<li>AINS et aspirine → prostaglandines supprimées ; aspirine → saignement prolongé ; ulcères souvent silencieux.</li>
<li>Bulbe postérieur → hémorragie (artère gastroduodénale), pénétration pancréatique ; bulbe antérieur → perforation ; pylore → sténose.</li>
<li>Causes cumulatives ; ulcères multiples, distaux, réfractaires ou diarrhée → Zollinger-Ellison.</li>
<li>Douleur épigastrique rythmée par les repas, peu spécifique ; signes d’alarme → gastroscopie rapide.</li>
<li>Examen : chercher hémorragie, contracture, clapotage.</li></ul></template>

<template data-pop="pareto-k25-diag" data-title="Pareto — Diagnostic et complications">
<p class="ratio" data-cover="k25-7,k25-8"></p>
<ul>
<li>Jeune sans alarme → tester et traiter (test respiratoire ou antigène fécal) ; alarme ou complication → gastroscopie, biopsies antre et corps, bords d’un ulcère gastrique, test de résistance.</li>
<li>Écarter d’abord infarctus inférieur, pancréatite, colique biliaire.</li>
<li>Hémorragie → protocole du cours K92 ; tester <i>H. pylori</i> chez tous, répéter un test négatif.</li>
<li>Perforation : douleur brutale, contracture → tomodensitométrie, jeûne, sonde, antibiotiques, chirurgie sans délai (laparoscopie si stable, suture si moins de 2 cm) ; chaque heure compte.</li>
<li>Sténose : vomissements tardifs, clapotage, alcalose hypochlorémique hypokaliémique → biopsies, dilatation ou chirurgie.</li></ul></template>

<template data-pop="pareto-k25-pec" data-title="Pareto — Traitement, prévention et critères">
<p class="ratio" data-cover="k25-9,k25-10,k25-11,k25-12,k25-13"></p>
<ul>
<li>Inhibiteur de la pompe à protons : 2 à 4 semaines (duodénum), 4 à 8 semaines (estomac).</li>
<li>Arrêter l’AINS ; garder l’aspirine de prévention secondaire sous inhibiteur de la pompe à protons.</li>
<li>Éradication guidée par la résistance ou quadrithérapie bismuthée (Pylera 3 gélules quatre fois par jour et oméprazole 20 mg deux fois par jour, 10 à 14 jours) ; trithérapies 14 jours sur souche sensible ; jamais d’empirisme après un échec.</li>
<li>Risque digestif élevé : éviter l’AINS ou célécoxib associé à un inhibiteur ; clopidogrel n’est pas plus sûr que l’aspirine protégée.</li>
<li>Contrôle d’éradication : test respiratoire ou antigène fécal à au moins 4 semaines des antibiotiques et 2 semaines de l’inhibiteur ; jamais la sérologie.</li>
<li>Ulcère gastrique : contrôle endoscopique selon l’aspect, les biopsies et l’évolution.</li>
<li>Pylera contre-indiqué : grossesse, allaitement, insuffisance rénale ou hépatique.</li>
<li>Zollinger-Ellison : gastrine plus de 10 fois la normale avec pH inférieur à 2.</li></ul></template>

<template data-pop="pareto-k25-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="k25-e-1,k25-e-2,k25-e-3,k25-e-4,k25-e-5,k25-e-6,k25-e-7"></p>
<ul>
<li>Gastroscopie avec biopsies = référence ; l’aspect oriente, la biopsie tranche.</li>
<li>Tests directs (respiratoire, antigène fécal, histologie, uréase rapide) = infection active ; sérologie = contact, jamais pour le contrôle.</li>
<li>Préparation : 2 semaines sans inhibiteur, 4 semaines sans antibiotique ni bismuth.</li>
<li>Test moléculaire sur biopsie : mutation 23S (clarithromycine), <i>gyrA</i> (lévofloxacine) ; culture : six antibiotiques, après échec.</li>
<li>Anémie ferriprive = alarme ; créatinine avant Pylera ; gastrinémie seulement avec pH et hors inhibiteur.</li>
<li>Perforation : tomodensitométrie ; scanner normal possible jusqu’à 12 %.</li></ul></template>

<template data-pop="pareto-k25-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="k25-p-1,k25-p-2,k25-p-3,k25-p-4"></p>
<ul>
<li>Inhibiteur de la pompe à protons : prodrogue, avant le repas ; pantoprazole 40 mg par jour pour cicatriser ; 20 mg au maximum dans l’insuffisance hépatique grave.</li>
<li>Pylera : 12 gélules par jour et oméprazole 20 mg deux fois par jour ; selles noires (17,2 %), pas d’alcool, laitages et fer à distance.</li>
<li>Trithérapie : amoxicilline 1000 mg et clarithromycine 500 mg deux fois par jour, 14 jours, souche sensible.</li>
<li>Lévofloxacine et rifabutine : sauvetage, hors indication autorisée en Suisse.</li>
<li>Misoprostol 800 µg par jour : protège mais diarrhée ; contre-indiqué pendant la grossesse.</li>
<li>Clarithromycine : statines, dompéridone, quétiapine, ergot contre-indiqués ; ésoméprazole déconseillé avec le clopidogrel.</li></ul></template>
