<template id="ch-N04"><div class="chap"><div class="chap-head"><div class="code">N04 · N04.0–N04.9 · Néphrologie · Rénal et voies urinaires</div><h1>Syndrome néphrotique</h1><span class="status">Syndrome néphrotique de l’adulte et de l’enfant · Sources relues le 14 octobre 2026 · Statut : audit différé après le Cycle 30 ; revue par intelligence artificielle, sans validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">Pharmacologie du syndrome néphrotique</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan</b><ol>
<li><a href="#n04-a01">Cas initial, objectifs et prérequis</a></li><li><a href="#n04-a02">Définitions et classification</a></li><li><a href="#n04-a03">Épidémiologie et pronostic global</a></li><li><a href="#n04-a04">Physiopathologie : du filtre lésé aux complications</a></li><li><a href="#n04-a05">Étiologies et formes</a></li><li><a href="#n04-a06">Anamnèse et examen clinique</a></li><li><a href="#n04-a07">Démarche diagnostique et diagnostics différentiels</a></li><li><a href="#n04-a08">Urgences et complications</a></li><li><a href="#n04-a09">Traitement de soutien commun</a></li><li><a href="#n04-a10">Traitement spécifique selon la forme</a></li><li><a href="#n04-a11">Suivi, pronostic et situations particulières</a></li><li><a href="#n04-a12">Critères formels du diagnostic et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="n04-a01"><h2><span class="n">A01</span> Cas initial, objectifs et prérequis</h2><h3 id="n04-a01-partie-1">1. Un cas fictif suivi tout au long du cours</h3><p>M. R., 52 ans, personnage fictif, consulte pour des œdèmes des jambes apparus en quelques semaines et une prise de poids de 7 kg. Il urine moins qu’auparavant et remarque des urines mousseuses. La bandelette urinaire indique des protéines à 4+. Le rapport protéines/créatinine urinaire, ou <button class="w" data-k="n04-calc-rpc">RPC</button>, atteint 650 mg/mmol. L’albumine sérique est de 19 g/L (méthode au pourpre de bromocrésol, ou <button class="w" data-k="n04-calc-albumine">BCP</button>) et le cholestérol total s’élève à 9,4 mmol/L. La créatinine est normale : le débit de filtration glomérulaire estimé, ou DFGe, vaut 85 mL/min/1,73 m². Le sédiment urinaire montre une microhématurie. Les anticorps anti-<button class="w" data-k="n04-pla2r">PLA2R</button> sont fortement positifs selon le laboratoire.</p><p>Ces valeurs sont inventées pour apprendre un raisonnement ; elles ne décrivent aucun patient réel. Elles recouvrent pourtant quatre situations de départ du référentiel PROFILES : 63 (oligurie), 161 (marqueurs de la fonction rénale anormaux), 164 (sédiment urinaire anormal) et 173 (protéinurie). Chacune ouvre une question distincte : la quantité d’urine émise, la fiabilité de la créatinine, la nature des cellules et des cylindres, puis le débit de protéines perdues.</p><h3 id="n04-a01-partie-2">2. Quatre résultats attendus du raisonnement</h3><p>Le raisonnement poursuit quatre buts successifs. Le premier consiste à confirmer le syndrome, c’est-à-dire à vérifier la protéinurie de rang néphrotique et l’hypoalbuminémie. Le deuxième cherche la forme : lésions glomérulaires minimes (<button class="w" data-k="n04-mcd">MCD</button>), hyalinose segmentaire et focale (<button class="w" data-k="n04-fsgs">FSGS</button>), néphropathie membraneuse (<button class="w" data-k="n04-mn">MN</button>) ou glomérulopathie secondaire. Le troisième mesure le risque, qui se décline en thrombose, infection et atteinte rénale. Le quatrième choisit le traitement. Une seule étiquette ne remplit pas ces quatre fonctions : « syndrome néphrotique » décrit un syndrome clinique et biologique, mais ne nomme ni la lésion ni la cause.</p><h3 id="n04-a01-partie-3">3. Un message suisse : penser au syndrome néphrotique devant tout œdème</h3><p>Le résumé de la <i>Revue Médicale Suisse</i> (CHUV, 2022) rappelle qu’un syndrome néphrotique peut être l’expression précoce d’une affection non rénale éventuellement sévère et évolutive. Il faut donc y penser chez tout patient œdémateux, quels que soient son âge et ses comorbidités. La raison tient aux causes secondaires : infections, cancers, médicaments et maladies auto-immunes atteignent parfois le glomérule avant de se manifester par un autre signe. Cette recommandation repose sur le résumé de l’article, seul accessible sans abonnement.</p><h3 id="n04-a01-partie-4">4. Prérequis cliquables et contraste pédiatrique</h3><p>Deux notions soutiennent tout le raisonnement. La <button class="w" data-k="n04-filtration">barrière de filtration</button> retient normalement l’albumine dans le sang. La <button class="w" data-k="n04-oncotique">pression oncotique</button>, exercée par l’albumine, retient l’eau dans les capillaires. Quand la première cède, la seconde s’effondre et l’œdème apparaît.</p><p>Un contraste pédiatrique éclaire le reste. Léa, 4 ans, personnage fictif, se réveille avec les paupières gonflées. La bandelette indique 3+ de protéines. Après quatre semaines de prednisone à dose standard, les urines ne contiennent plus de protéines : le syndrome est corticosensible. L’adulte et l’enfant n’obéissent ni aux mêmes seuils ni aux mêmes règles de biopsie ; les deux sont comparés ci-dessous.</p><div class="key"><b>À retenir.</b> Un syndrome néphrotique se résout en quatre questions : le confirmer, trouver sa forme, mesurer son risque, le traiter. La barrière de filtration et la pression oncotique ouvrent l’explication de l’œdème. Deux patients fictifs, M. R. (adulte) et Léa (enfant), montrent ce que l’âge change.</div><p class="src">Sources : <a data-reference-source="1" href="https://www.revmed.ch/revue-medicale-suisse/2022/revue-medicale-suisse-771/syndrome-nephrotique-de-l-adulte-et-autres-proteinuries-de-fort-debit" target="_blank" rel="noopener">Ngatchou et Kissling — Rev Med Suisse 2022 ; 18(771):370 (résumé)</a>.</p></section><section class="ilot" id="n04-a02"><h2><span class="n">A02</span> Définitions et classification</h2><h3 id="n04-a02-partie-1">1. Le syndrome néphrotique de l’adulte</h3><p>Chez l’adulte, KDIGO 2021 définit le syndrome néphrotique par deux critères essentiels. Le premier est une protéinurie d’au moins 3,5 g par 24 heures ou un rapport protéines/créatinine d’au moins 3000 mg/g, soit 300 mg/mmol. Le second est une hypoalbuminémie, dont la valeur seuil dépend du laboratoire. L’œdème et l’hyperlipidémie sont des critères variables : leur absence n’exclut pas le diagnostic. Le calcul du rapport et la conversion entre mg/g et mg/mmol sont détaillés dans une <button class="w" data-k="n04-calc-rpc">fenêtre dédiée</button>.</p><p>La méthode de dosage de l’albumine compte autant que le chiffre. Le vert de bromocrésol donne des valeurs supérieures d’environ 5,5 g/L à celles du pourpre de bromocrésol, de l’électrophorèse capillaire ou de l’immunonéphélométrie. Un même sérum peut donc franchir ou non le seuil selon l’appareil ; la <button class="w" data-k="n04-calc-albumine">fenêtre sur la méthode</button> explique comment convertir.</p><h3 id="n04-a02-partie-2">2. Le syndrome néphrotique de l’enfant</h3><p>Chez l’enfant de 1 à 18 ans, KDIGO 2025 fixe la protéinurie de rang néphrotique à un rapport protéines/créatinine d’au moins 200 mg/mmol (2 g/g) sur un échantillon, ou à au moins 1000 mg/m² par jour sur 24 heures. À la bandelette, cela correspond à 3+ (300 à moins de 1000 mg/dl) ou 4+ (au moins 1000 mg/dl). Le syndrome néphrotique associe cette protéinurie et une albumine sérique inférieure à 30 g/L ; quand l’albumine n’est pas disponible, la présence d’un œdème remplace ce critère.</p><p>Le tableau compare les deux définitions. Il répond à une question pratique : un même patient peut-il être néphrotique selon un seuil et non selon l’autre ? La réponse est oui, parce que les protéinuries et les albuminémies de référence ne sont pas les mêmes. Lire d’abord la ligne de la protéinurie, puis celle de l’albumine ; une erreur fréquente consiste à appliquer le seuil de l’adulte (300 mg/mmol) à un enfant, ce qui retarde le diagnostic.</p><table class="t"><thead><tr><th>Critère</th><th>Adulte (KDIGO 2021)</th><th>Enfant 1–18 ans (KDIGO 2025)</th></tr></thead><tbody><tr><td>Protéinurie</td><td>≥ 3,5 g/24 h ou rapport ≥ 300 mg/mmol (3000 mg/g) ; critère essentiel</td><td>Rapport ≥ 200 mg/mmol (2 g/g) ou ≥ 1000 mg/m²/jour ; bandelette 3+ ou 4+</td></tr><tr><td>Albumine sérique</td><td>Hypoalbuminémie, valeur propre au laboratoire ; critère essentiel</td><td>&lt; 30 g/L (ou œdème si l’albumine manque)</td></tr><tr><td>Œdème</td><td>Variable</td><td>Remplace l’albumine si elle est indisponible</td></tr><tr><td>Hyperlipidémie</td><td>Variable</td><td>Non requise par la définition</td></tr></tbody></table><p>Le tableau montre que la bandelette n’intervient dans les sources lues que pour l’enfant. La lecture de la bandelette dépend du fabricant : négatif de 0 à moins de 15 mg/dl, traces de 15 à moins de 30, 1+ de 30 à moins de 100, 2+ de 100 à moins de 300, 3+ de 300 à moins de 1000, 4+ à partir de 1000 mg/dl.</p><h3 id="n04-a02-partie-3">3. Protéinurie de rang néphrotique sans syndrome néphrotique</h3><p>La protéinurie atteint parfois le seuil néphrotique sans que l’albumine baisse ni que l’œdème apparaisse. Elle est fréquente dans la hyalinose segmentaire et focale secondaire et dans la néphropathie à IgA. Les lipides sont alors normaux ou peu élevés. Cette distinction oriente le traitement : une protéinurie néphrotique sans syndrome signale souvent une cause secondaire, pour laquelle l’immunosuppression n’est pas indiquée. À l’inverse, une protéinurie non néphrotique se situe entre 0,3 et 3,4 g/24 h, avec albumine normale et sans symptôme. La figure source de KDIGO exprime cette borne par un rapport inférieur à 30 mg/mmol ; ce chiffre ne coïncide pas exactement avec 3,4 g/24 h, c’est pourquoi la valeur en grammes par 24 heures est retenue.</p><h3 id="n04-a02-partie-4">4. Le codage CIM-10-GM 2024 : un syndrome et dix sous-codes</h3><p>La catégorie N04 « Syndrome néphrotique » inclut le syndrome néphrotique congénital et la néphrose lipoïdique. Son quatrième caractère suit la liste commune du bloc N00–N08. Une règle de codage s’impose : les subdivisions .0 à .8 ne s’emploient normalement qu’après identification précise de la lésion par biopsie rénale ou autopsie ; la catégorie à trois caractères désigne le syndrome clinique. Un enfant traité sans biopsie reste donc codé N04.9. La <button class="w" data-k="n04-cim">fenêtre de codage</button> détaille cette règle et les codes supplémentaires.</p><p>Le tableau donne la lésion que désigne chaque sous-code. Il aide à relier un compte rendu de biopsie à un code, et inversement. Lire la colonne de la morphologie avant celle de l’exemple : seuls quatre sous-codes ont un exemple clinique dans les sources lues.</p><table class="t"><thead><tr><th>Code</th><th>Lésion (libellé OFS)</th><th>Exemple clinique</th></tr></thead><tbody><tr><td>N04.0</td><td>Anomalies glomérulaires mineures</td><td>Lésions glomérulaires minimes</td></tr><tr><td>N04.1</td><td>Lésions glomérulaires segmentaires et focales (hyalinose ou sclérose segmentaire et focale, glomérulonéphrite focale)</td><td>Hyalinose segmentaire et focale</td></tr><tr><td>N04.2</td><td>Glomérulonéphrite membraneuse diffuse</td><td>Néphropathie membraneuse</td></tr><tr><td>N04.3</td><td>Glomérulonéphrite mésangioproliférative diffuse</td><td>Définie par la morphologie</td></tr><tr><td>N04.4</td><td>Glomérulonéphrite proliférative endocapillaire diffuse</td><td>Définie par la morphologie</td></tr><tr><td>N04.5</td><td>Glomérulonéphrite mésangiocapillaire diffuse (membranoproliférative types 1 et 3, ou non précisée)</td><td>Définie par la morphologie</td></tr><tr><td>N04.6</td><td>Maladie à dépôts denses (membranoproliférative type 2)</td><td>Définie par la morphologie</td></tr><tr><td>N04.7</td><td>Glomérulonéphrite diffuse en croissant (extracapillaire)</td><td>Glomérulonéphrite à croissants</td></tr><tr><td>N04.8</td><td>Autres modifications morphologiques (proliférative non précisée)</td><td>Définie par la morphologie</td></tr><tr><td>N04.9</td><td>Type non précisé</td><td>Syndrome clinique sans biopsie, par exemple l’enfant corticosensible</td></tr></tbody></table><p>Les sources ne chiffrent aucune fréquence par sous-code ; aucune n’est donnée ici. Un patient comme M. R., biopsié et porteur de dépôts membraneux, serait codé N04.2 ; Léa, jamais biopsiée, resterait N04.9.</p><div class="key"><b>À retenir.</b> L’adulte est néphrotique au-delà de 300 mg/mmol avec une albumine basse selon la méthode du laboratoire ; l’enfant l’est dès 200 mg/mmol avec une albumine inférieure à 30 g/L ou un œdème. Une protéinurie néphrotique sans hypoalbuminémie évoque une cause secondaire. Les sous-codes N04.0 à N04.8 supposent une biopsie ; sans elle, le code est N04.9.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">OFS — CIM-10-GM 2024, version française (31.10.2024)</a>.</p></section><section class="ilot" id="n04-a03"><h2><span class="n">A03</span> Épidémiologie et pronostic global</h2><h3 id="n04-a03-partie-1">1. Combien de patients et de quelles formes</h3><p>Chez l’adulte, l’incidence du syndrome néphrotique est d’environ 2,7 à 3 nouveaux cas pour 100 000 personnes et par an, valeur restée stable au fil des années. Chez l’enfant, c’est la maladie glomérulaire la plus fréquente, avec une incidence de 1,15 à 16,9 pour 100 000 enfants. Aucune donnée d’incidence suisse n’a été trouvée dans les sources consultées ; les chiffres sont internationaux et européens et leur origine est indiquée.</p><p>La part de chaque forme varie avec l’âge. Le tableau les compare. Il répond à la question « devant un adulte néphrotique, quelle forme est la plus probable ? ». Lire d’abord la colonne de la fréquence, puis celle de l’évolution naturelle, qui fonde la décision d’attendre ou de traiter ; l’erreur fréquente est d’additionner des pourcentages calculés sur des dénominateurs différents, comme ceux de la ligne des lésions minimes.</p><table class="t"><thead><tr><th>Forme</th><th>Fréquence</th><th>Terrain</th><th>Évolution naturelle</th></tr></thead><tbody><tr><td>Néphropathie membraneuse</td><td>Environ 30 % des syndromes néphrotiques de l’adulte ; incidence 1/100 000 (ÖGN)</td><td>Pic aux 4e et 5e décennies ; hommes deux fois plus touchés</td><td>Rémission spontanée chez environ un tiers ; parmi les deux tiers restants, la moitié garde une protéinurie avec fonction conservée longtemps, l’autre moitié évolue plus vite vers l’insuffisance rénale terminale ; récidive après greffe dans environ 40 %</td></tr><tr><td>Lésions glomérulaires minimes</td><td>10–25 % des syndromes néphrotiques de l’adulte (KDIGO) ou 10–15 % des syndromes néphrotiques primaires (ÖGN) ; cause de loin la plus fréquente chez l’enfant</td><td>Hommes plus touchés</td><td>Rémission sous corticoïdes à forte dose dans 80 à 90 % des cas chez l’adulte (KDIGO) ; rechute chez environ deux tiers après l’arrêt (ÖGN)</td></tr><tr><td>Hyalinose segmentaire et focale</td><td>Environ 9 % des biopsies rénales de l’adulte en Europe ; la forme primaire est la deuxième cause de syndrome néphrotique de l’adulte ; la forme adaptative secondaire est probablement la plus fréquente</td><td>Non précisé dans les sources lues</td><td>Corticorésistance et insuffisance rénale possibles</td></tr></tbody></table><p>Les deux estimations des lésions minimes diffèrent parce que leurs dénominateurs diffèrent : KDIGO rapporte à tous les syndromes néphrotiques de l’adulte, l’ÖGN aux seuls syndromes primaires. Il ne s’agit pas d’une contradiction, mais de deux populations.</p><h3 id="n04-a03-partie-2">2. Le pronostic de l’enfant</h3><p>Avant les antibiotiques et la corticothérapie, environ 40 % des enfants néphrotiques mouraient d’infection, d’insuffisance rénale ou, plus rarement, de thrombose. Aujourd’hui, avec un traitement correct, la fonction rénale des formes corticosensibles est préservée. Le syndrome persiste toutefois à l’âge adulte dans 15 à 25 % des cas, et moins de 5 % des enfants deviennent secondairement corticorésistants, avec un risque élevé d’insuffisance rénale et de récidive après greffe. Léa, corticosensible, a donc une bonne probabilité de préserver ses reins, mais elle peut rechuter pendant des années.</p><div class="key"><b>À retenir.</b> Les formes se répartissent différemment selon l’âge : les lésions minimes dominent chez l’enfant, la néphropathie membraneuse chez l’adulte. Le pronostic de l’enfant s’est transformé grâce aux corticoïdes. La Suisse n’a pas de chiffres d’incidence publiés dans les sources lues ; cette lacune est nommée, non comblée.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a1">▲ Loi de Pareto — Définitions, classification et épidémiologie</button></section><section class="ilot" id="n04-a04"><h2><span class="n">A04</span> Physiopathologie : du filtre lésé aux complications</h2><h3 id="n04-a04-partie-1">1. Un filtre qui retient l’albumine, puis un filtre qui cède</h3><p>Le glomérule filtre le plasma à travers trois couches : l’endothélium, la membrane basale et les podocytes. Les podocytes sont des cellules post-mitotiques et terminalement différenciées dont les pédicelles s’interdigitent et sont reliés par un diaphragme de fente. Cet assemblage laisse passer l’eau et les petites molécules et retient l’albumine. La <button class="w" data-k="n04-filtration">fenêtre sur la barrière de filtration</button> reprend cette anatomie.</p><p>Quand le podocyte est lésé, ses pédicelles s’aplatissent et les diaphragmes de fente disparaissent. Cet effacement des pédicelles s’accompagne en général d’une protéinurie massive. Si la lésion persiste, des podocytes se perdent ou se détachent de la membrane basale ; le glomérule se cicatrise alors par sclérose segmentaire. La figure 1 oppose les deux états : la protéinurie vient d’une perte de sélectivité du filtre et non d’une obstruction.</p><figure id="n04-fig-filtre"><svg viewBox="0 0 740 330" role="img" aria-label="Schéma didactique du filtre glomérulaire : à gauche une barrière normale qui retient l’albumine, à droite une barrière lésée qui la laisse passer" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" font-size="12" fill="#222" stroke="#222" stroke-width="1.5">

<text x="410" y="262" stroke="none" font-size="12">Albumine filtrée : protéinurie, puis hypoalbuminémie.</text>
<text x="20" y="306" stroke="none" font-size="12">Conséquences : pression oncotique basse, œdème, rétention de sodium, hyperlipidémie, hypercoagulabilité.</text></svg>
<figcaption>Figure 1 — Schéma didactique du filtre glomérulaire, normal à gauche, lésé à droite. Les cercles représentent l’albumine ; les tailles ne sont pas à l’échelle. Sources : ÖGN 2023 (hyalinose segmentaire et focale), KDIGO 2021, Fratila et coll. 2024.</figcaption></figure><p>La lecture de la figure commence par les pédicelles : séparés à gauche, étalés et sans fentes à droite. Elle se poursuit par le sort des cercles blancs : ils restent dans le capillaire à gauche et traversent à droite. Chez M. R., cette traversée explique la bandelette à 4+.</p><h3 id="n04-a04-partie-2">2. La protéinurie : surtout de l’albumine, et une filtration paradoxale</h3><p>En moyenne, l’albumine représente environ 65 % de la protéinurie totale dans les glomérulopathies ; cette proportion est plus élevée dans certaines maladies, comme les lésions glomérulaires minimes. L’albumine est le principal contributeur de la pression oncotique plasmatique : sa perte abaisse donc cette pression.</p><p>Un paradoxe doit être connu. Dans les lésions glomérulaires minimes, la lésion podocytaire augmente la perméabilité à l’albumine mais diminue celle des petites molécules comme l’eau, l’urée et la créatinine. La filtration baisse alors d’environ 25 %, de façon réversible et souvent sans hausse de la créatinine. De plus, la sécrétion tubulaire de créatinine est accrue dans le syndrome néphrotique ; les formules fondées sur la créatinine surestiment alors systématiquement le débit de filtration. Ainsi, le DFGe de 85 de M. R. peut cacher une filtration réelle plus basse.</p><h3 id="n04-a04-partie-3">3. L’œdème : deux hypothèses qui coexistent</h3><p>L’hypothèse du sous-remplissage suit une chaîne : protéinurie, hypoalbuminémie, baisse de la pression oncotique plasmatique, fuite de liquide vers l’interstitium selon les forces de Starling, hypovolémie relative, puis activation compensatrice du système rénine-angiotensine-aldostérone et de la vasopressine, avec rétention d’eau et de sodium. L’<button class="w" data-k="n04-oncotique">explication des forces de Starling</button> précise ce raisonnement.</p><p>L’hypothèse du surremplissage invoque une rétention primaire de sodium par le rein, démontrée chez des patients dont la rénine et l’aldostérone sont basses. Des sérine-protéases filtrées, surtout la plasmine issue du plasminogène par l’activateur de type urokinase, clivent les sous-unités α et γ du canal sodique épithélial du néphron distal, ou <button class="w" data-k="n04-enac">ENaC</button>, et l’activent. L’amiloride bloque ce canal. KDIGO confirme que la plasmine urinaire peut activer ENaC et contribuer à la résistance aux diurétiques, tout en notant que l’effet de l’amiloride n’est pas validé par un essai randomisé. Une partie des preuves provient de modèles murins. Les deux mécanismes coexistent et interagissent ; l’un prédomine selon le patient. Cette coexistence justifie qu’on traite à la fois le sodium (régime, diurétiques) et la cause de la fuite.</p><h3 id="n04-a04-partie-4">4. Lipides, coagulation et infections</h3><p>La <button class="w" data-k="n04-lipides">dyslipidémie</button> associe une hausse du cholestérol, des triglycérides et des lipoprotéines contenant l’apolipoprotéine B, une baisse d’activité de la lipoprotéine lipase et de la lipase hépatique, et une hausse de la protéine PCSK9. Cette synthèse biochimique provient d’une revue américaine utilisée ici pour la seule biochimie. La <button class="w" data-k="n04-coagulation">tendance thrombotique</button> repose sur la perte urinaire d’antithrombine (65 kDa), la hausse plasmatique de protéines procoagulantes de haut poids moléculaire (fibrinogène, facteurs V et VIII), la thrombocytose fréquente et la fibrinolyse diminuée. Ainsi, l’héparine peut être moins efficace et exiger une dose plus élevée.</p><p>Les infections bactériennes restent une complication du syndrome : si elles se répètent, KDIGO recommande de doser les IgG.</p><div class="key"><b>À retenir.</b> Le filtre lésé laisse passer l’albumine. L’œdème naît de deux mécanismes qui coexistent : sous-remplissage par baisse de la pression oncotique, et surremplissage par activation d’ENaC. Le DFGe est surestimé. Les lipides montent et la coagulation s’emballe, ce qui prépare les complications de l’îlot 8.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5770189/" target="_blank" rel="noopener">Agrawal et coll. 2018 — Nat Rev Nephrol 14:57–70</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3302669/" target="_blank" rel="noopener">Kerlin et coll. 2012 — Clin J Am Soc Nephrol 7:513–520</a>.</p></section><section class="ilot" id="n04-a05"><h2><span class="n">A05</span> Étiologies et formes</h2><h3 id="n04-a05-partie-1">1. Primaire, secondaire, génétique</h3><p>Le syndrome néphrotique résulte d’une glomérulopathie primaire, d’une cause secondaire ou d’une anomalie génétique. La question de la cause précède celle du traitement, parce que traiter la cause secondaire suffit parfois et que l’immunosuppression d’une forme secondaire est inutile ou dangereuse. Les trois formes histologiques principales se déclinent ainsi.</p><p>Les lésions glomérulaires minimes ont une pathogenèse incomplètement connue : dysrégulation des lymphocytes T, rôle des lymphocytes B (suggéré par l’efficacité du rituximab), anticorps anti-néphrine chez environ 30 % des patients d’une étude récente ; les infections virales et les allergènes sont des déclencheurs possibles. La néphropathie membraneuse est une glomérulonéphrite à complexes immuns sous-épithéliaux, surtout d’IgG4, dirigés contre des antigènes podocytaires : le récepteur de type M de la phospholipase A2 (<button class="w" data-k="n04-pla2r">PLA2R</button>, environ 75 % des formes primaires) et la protéine à domaine de type 1 de la thrombospondine, de type 7A (<button class="w" data-k="n04-pla2r">THSD7A</button>, 5 à 10 % des formes PLA2R négatives). La hyalinose segmentaire et focale est primaire, secondaire ou génétique.</p><h3 id="n04-a05-partie-2">2. Les causes secondaires et leur dépistage</h3><p>Le tableau associe chaque forme à ses causes secondaires et à l’examen qui les dépiste. Il répond à la question « que chercher devant cette forme ? ». Lire la ligne de la forme biopsiée, puis les causes, puis l’examen. L’erreur fréquente est de s’arrêter à la positivité des anticorps anti-PLA2R : le bilan des conditions associées se fait que ces anticorps soient présents ou non.</p><table class="t"><thead><tr><th>Forme</th><th>Causes secondaires</th><th>Dépistage</th></tr></thead><tbody><tr><td>Lésions glomérulaires minimes</td><td>Médicaments (AINS, lithium, sels d’or, ampicilline, rifampicine, interféron, inhibiteurs de points de contrôle) ; infections ; atopie ; néoplasies (lymphomes de Hodgkin et non hodgkiniens, leucémie, myélome, thymome) ; maladies auto-immunes (lupus, syndrome de Sjögren) ; vaccinations</td><td>Anamnèse ; VIH, hépatites, tuberculose ; anticorps antinucléaires ; électrophorèse et chaînes légères libres selon le contexte</td></tr><tr><td>Hyalinose segmentaire et focale</td><td>Atteinte épithéliale : VIH (établi), CMV (probable), parvovirus B19, EBV et VHC (possibles), SARS-CoV-2 avec génotype APOL1 à risque ; médicaments (inhibiteurs de mTOR, anticalcineurines, anthracyclines, héroïne, lithium, interféron, stéroïdes anabolisants, AINS). Adaptation à une hypertension glomérulaire : nombre de néphrons réduit (néphropathie de reflux, dysplasie, oligoméganéphronie, drépanocytose, âge) ou normal (obésité, autres glomérulopathies, néphropathie diabétique ou hypertensive)</td><td>Contexte clinique ; dosage de l’albumine (un syndrome néphrotique complet oriente vers la forme primaire) ; test génétique selon indications</td></tr><tr><td>Néphropathie membraneuse (20 à 30 % de formes secondaires)</td><td>Infections (hépatite B, plus rarement C, syphilis) ; cancers (surtout solides : prostate, poumon, tube digestif ; plus rarement leucémie lymphoïde chronique) ; médicaments (AINS, sels d’or, pénicillamine) ; maladies auto-immunes (lupus, polyarthrite rhumatoïde) ; sarcoïdose ; réaction du greffon contre l’hôte</td><td>Anamnèse, examen cutané et articulaire, radiographie thoracique, échographie rénale, sérologies VHB, VHC, VIH et tréponème selon indication, anticorps antinucléaires, dépistage des cancers adapté à l’âge</td></tr><tr><td>Glomérulopathies secondaires hors forme primaire</td><td>Diabète (N08.3 avec E10–E14), amylose (E85), lupus, infections, cancers, médicaments</td><td>Sérologies, anticorps antinucléaires, électrophorèse et chaînes légères libres, biopsie (amylose, diabète)</td></tr></tbody></table><p>Cas de M. R. : il ne prend aucun anti-inflammatoire et ses sérologies hépatiques sont négatives, mais le dépistage du cancer adapté à son âge reste à faire, car la néphropathie membraneuse peut précéder un cancer solide. Une hyalinose segmentaire et focale sans syndrome néphrotique complet (albumine supérieure à 30 g/L) doit faire rechercher une cause secondaire et ne justifie pas d’immunosuppression.</p><h3 id="n04-a05-partie-3">3. Les formes génétiques</h3><p>Les formes génétiques de hyalinose segmentaire et focale résultent de mutations de protéines podocytaires et de la membrane basale ; elles sont familiales, sporadiques ou syndromiques. KDIGO juge le test génétique utile en cas d’antécédents familiaux forts, de signes syndromiques ou de corticorésistance, pour limiter l’exposition à l’immunosuppression, estimer le risque de récidive après greffe ou évaluer un donneur apparenté. Un syndrome néphrotique avant l’âge de 1 an doit aussi faire consulter la néphrologie pédiatrique.</p><div class="key"><b>À retenir.</b> La cause précède le traitement. Les anticorps anti-PLA2R n’exemptent pas du bilan des conditions associées. Une hyalinose sans syndrome néphrotique complet est secondaire jusqu’à preuve du contraire et ne reçoit pas d’immunosuppression. Un test génétique est indiqué en cas de contexte familial, syndromique ou de corticorésistance.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">OFS — CIM-10-GM 2024, version française (31.10.2024)</a>.</p></section><section class="ilot" id="n04-a06"><h2><span class="n">A06</span> Anamnèse et examen clinique</h2><h3 id="n04-a06-partie-1">1. Le motif de consultation et le début</h3><p>L’œdème est le principal motif de consultation. L’hypervolémie qui l’accompagne peut entraîner une congestion pulmonaire, une hypertension, une anasarque et une gêne à la mobilité. Le début oriente la forme, comme l’opposent les deux cartes suivantes.</p><div class="two"><div class="card"><h4>Lésions glomérulaires minimes</h4><p>Le syndrome néphrotique complet s’installe de façon brutale, en quelques jours à quelques semaines, et le patient date souvent l’apparition des œdèmes. La prise de poids est marquée. L’hypertension touche 30 à 47 % des patients et la microhématurie 29 à 59 %. Une insuffisance rénale aiguë (créatinine multipliée par 1,5) survient dans 10 à 40 % des cas, dont environ un quart reçoit une dialyse transitoire. Chez le sujet âgé, les formes sont atypiques : hypertension et fonction rénale altérée.</p></div><div class="card"><h4>Néphropathie membraneuse</h4><p>Le syndrome néphrotique est déjà présent au diagnostic chez 60 à 80 % des patients. Sinon, la protéinurie est d’abord non néphrotique et progresse vers le syndrome néphrotique dans environ 60 % des cas sans traitement. La microhématurie existe chez 30 à 40 % des patients, les cylindres érythrocytaires sont très rares et la fonction rénale est normale ou peu altérée chez 80 % des patients.</p></div></div><p>M. R., avec un début en quelques semaines, une albumine à 19 g/L, une fonction rénale conservée et une microhématurie, correspond davantage à une néphropathie membraneuse qu’à une forme minime, sans que cela suffise à trancher.</p><h3 id="n04-a06-partie-2">2. Ce que l’anamnèse doit chercher</h3><p>Le médecin demande la date de début des œdèmes et de la prise de poids, les signes de thrombose (douleur d’un mollet, douleur lombaire, essoufflement), les infections récentes et les médicaments en cours : anti-inflammatoires non stéroïdiens, lithium, sels d’or, pénicillamine, inhibiteurs de mTOR. Il demande aussi les antécédents familiaux de protéinurie ou de hyalinose, et les séjours en zone tropicale, car une strongyloïdose doit être dépistée avant une immunosuppression chez un patient ayant vécu dans une telle zone, surtout avec éosinophilie et IgE élevées.</p><h3 id="n04-a06-partie-3">3. L’examen clinique</h3><p>L’examen suit l’ordre état général, constantes, poids, signes ciblés. Il mesure la pression artérielle, objective les œdèmes (godet), recherche une anasarque et une ascite. Chez l’enfant avec ascite, une péritonite bactérienne spontanée doit être cherchée par examen microscopique et culture du liquide. L’examen cherche aussi des signes de maladie systémique : peau et articulations, évocateurs d’un lupus ou d’une néphropathie membraneuse secondaire.</p><figure id="n04-img-yeux"><img src="assets/img/cycle3/n04/nephrotic_eyes.jpg" alt="Visage d’un enfant endormi avec un gonflement marqué des deux paupières." loading="lazy"><figcaption>Figure 2 — Œdème palpébral bilatéral chez un enfant atteint de syndrome néphrotique : les paupières gonflées réduisent la fente palpébrale. <a data-reference-source="1" href="https://commons.wikimedia.org/wiki/File:Nephrotic_eyes.JPG" target="_blank" rel="noopener">Auteur non renseigné sur Commons (téléversé par Danvasilis le 19.01.2013), CC BY-SA 3.0, via Wikimedia Commons — fichier et licence</a>. <a href="assets/img/cycle3/n04/nephrotic_eyes.jpg" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></figcaption></figure><p>La photographie illustre l’œdème matinal de l’enfant, souvent confondu avec une allergie. Elle ne dit rien de la cause ni du taux d’albumine ; seule la bandelette puis le rapport protéines/créatinine tranchent. Léa, à son réveil, présentait exactement ce tableau.</p><div class="key"><b>À retenir.</b> L’œdème est le motif de consultation. Un début brutal en quelques jours évoque des lésions minimes ; un début plus lent avec fonction conservée évoque une néphropathie membraneuse. L’anamnèse recherche les médicaments, les voyages en zone tropicale et les signes de thrombose. L’ascite de l’enfant impose de chercher une péritonite.</div><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a2">▲ Loi de Pareto — Physiopathologie, étiologies et clinique</button></section><section class="ilot" id="n04-a07"><h2><span class="n">A07</span> Démarche diagnostique et diagnostics différentiels</h2><h3 id="n04-a07-partie-1">1. Confirmer et quantifier la protéinurie</h3><p>La première étape établit que la protéinurie est de rang néphrotique et mesure l’albumine. KDIGO préfère la récolte des urines de 24 heures lorsque l’on débute ou intensifie une immunosuppression, ou que l’état du patient change, parce qu’un rapport protéines/créatinine isolé varie avec la production de créatinine et la concentration de l’urine. Chez l’enfant, le rapport se mesure sur la première urine du matin. La première miction du matin sous-estime la protéinurie de 24 heures d’environ 20 % et ne détecte pas une protéinurie orthostatique ; un compromis consiste à doser le rapport sur une aliquote d’une récolte de 24 heures prévue. La <button class="w" data-k="n04-calc-rpc">fenêtre de calcul</button> détaille le rapport, et l’<button class="w" data-k="n04-orthostatique">encadré sur la protéinurie orthostatique</button> précise le piège.</p><h3 id="n04-a07-partie-2">2. Fonction rénale, sédiment et bilan de base</h3><p>Pour estimer le débit de filtration glomérulaire, KDIGO préfère l’équation CKD-EPI fondée sur la créatinine chez l’adulte et l’équation de Schwartz modifiée chez l’enfant. Le sédiment urinaire est examiné systématiquement : morphologie des érythrocytes, cylindres, acanthocytes. Une hématurie glomérulaire oriente vers une glomérulonéphrite et non vers une néphropathie purement podocytaire.</p><p>Chez tout adulte présentant un premier syndrome néphrotique, il faut doser les anticorps anti-PLA2R (ELISA ou immunofluorescence indirecte) et rechercher les causes secondaires. Le bilan de base proposé par le consensus autrichien pour la néphropathie membraneuse comprend : anticorps anti-PLA2R, anticorps antinucléaires, fractions C3 et C4, anticorps anti-MPO et anti-PR3 en cas de microhématurie, sérologies des hépatites B et C, anticorps anti-THSD7A si le test PLA2R est négatif, bandelette, sédiment, rapport protéines/créatinine, une récolte initiale de 24 heures pour étalonner le rapport, et chez tous une échographie abdominale et une radiographie (ou un scanner) du thorax. En Suisse, ces dosages sont disponibles (CHUV et Viollier : ELISA, deux fois par mois, délai de 1 à 2 semaines).</p><h3 id="n04-a07-partie-3">3. Biopsie ou pas : la décision qui change selon l’âge</h3><p>La biopsie rénale est l’examen de référence des glomérulopathies. Elle se justifie lorsque son résultat doit modifier le traitement ou apporter un pronostic. Le tableau oppose les situations. Il répond à la question « puis-je traiter sans biopsie ? ». Lire d’abord la colonne de l’âge ; l’erreur fréquente est d’étendre à l’adulte la règle pédiatrique du traitement d’épreuve par corticoïdes.</p><table class="t"><thead><tr><th>Situation</th><th>Biopsie ?</th><th>Justification</th></tr></thead><tbody><tr><td>Enfant &lt; 12 ans, syndrome néphrotique corticosensible, sans signe atypique</td><td>Non, traitement d’emblée</td><td>La réponse à quatre semaines de corticoïdes tient lieu de diagnostic</td></tr><tr><td>Enfant avec signe atypique (hématurie macroscopique, C3 bas, insuffisance rénale aiguë non liée à l’hypovolémie, hypertension soutenue, arthrite, éruption)</td><td>Oui, d’emblée</td><td>Ces signes évoquent une autre maladie</td></tr><tr><td>Enfant ≥ 12 ans à la présentation, corticorésistance (ou secondaire), baisse de fonction sous anticalcineurines ou exposition de 2 à 3 ans</td><td>Oui</td><td>Autre glomérulopathie ou toxicité</td></tr><tr><td>Adulte avec anti-PLA2R nettement positifs, DFGe &gt; 60 mL/min/1,73 m² et autres causes exclues</td><td>Non (position ÖGN, KDIGO : surtout si DFGe normal)</td><td>Spécificité de 0,99 du test, sensibilité de 0,78</td></tr><tr><td>Adulte, syndrome néphrotique aigu sans cause identifiée (par exemple sans anti-PLA2R)</td><td>Oui, en principe</td><td>Seule la biopsie distingue lésions minimes et hyalinose</td></tr><tr><td>Adulte, fonction altérée, croissants possibles, néphropathie diabétique associée</td><td>Oui</td><td>Le test sérologique ne suffit plus</td></tr></tbody></table><p>Le tableau se lit avec M. R. : anticorps nettement positifs et DFGe de 85, donc pas de biopsie selon le consensus autrichien. Léa, 4 ans, sans signe atypique, reçoit directement la prednisone.</p><p>La spécificité de 0,99 d’un test positif signifie que presque aucun patient sans néphropathie membraneuse n’est positif. La sensibilité de 0,78 signifie que 22 % des patients atteints sont négatifs ; un test négatif n’exclut donc pas la maladie, et il impose la biopsie chez l’adulte. Cette méta-analyse a porté sur 710 patients et 1502 témoins.</p><div class="quiz ui"><p>Un adulte de 48 ans a un syndrome néphrotique complet, des anticorps anti-PLA2R nettement positifs et un DFGe de 85 mL/min/1,73 m². Une biopsie rénale est-elle nécessaire avant de traiter ?</p><button data-ok="1">Non. Les anticorps nettement positifs avec DFGe supérieur à 60 mL/min/1,73 m² et autres causes exclues permettent de renoncer à la biopsie selon le consensus autrichien.</button><button data-ok="0">Oui, toute néphropathie de l’adulte exige une biopsie sans exception.</button><p class="fb" hidden>Le consensus autrichien et KDIGO admettent un traitement sans biopsie dans la néphropathie membraneuse à anti-PLA2R positifs, surtout si le DFGe est normal. Le bilan des conditions associées reste obligatoire.</p></div><figure id="n04-fig-algo"><svg viewBox="0 0 760 420" role="img" aria-label="Schéma didactique de la démarche diagnostique du syndrome néphrotique chez l’adulte et chez l’enfant" xmlns="http://www.w3.org/2000/svg" font-family="Inter,sans-serif" font-size="12" fill="#222" stroke="#222" stroke-width="1.5">

<figcaption>Figure 3 — Schéma didactique de la démarche diagnostique chez l’adulte (à gauche) et chez l’enfant (à droite). Les seuils viennent de KDIGO 2021 et 2025 et du consensus autrichien. Il ne remplace pas la décision spécialisée.</figcaption></figure><h3 id="n04-a07-partie-4">4. Les diagnostics différentiels, de la gravité à la fréquence</h3><p>Devant des œdèmes et une protéinurie, le médecin écarte d’abord les diagnostics qui menacent la vie ou le rein, puis les plus fréquents. Le tableau les classe dans cet ordre. Il répond à la question « que dois-je ne pas manquer ? ». La colonne du discriminant donne le signe qui sépare chaque entité du syndrome néphrotique simple ; la dernière colonne donne l’examen décisif.</p><table class="t"><thead><tr><th>Rang</th><th>Entité</th><th>Gravité</th><th>Discriminant</th><th>Examen décisif</th></tr></thead><tbody><tr><td>1</td><td>Syndrome néphrotique compliqué (thrombose de la veine rénale, embolie pulmonaire, péritonite de l’enfant, insuffisance rénale aiguë)</td><td>Menace vitale ou rénale</td><td>Douleur lombaire, LDH élevée, hématurie macroscopique (thrombose rénale) ; ascite fébrile de l’enfant ; hausse de la créatinine</td><td>Imagerie vasculaire selon le site ; ponction et culture d’ascite ; créatinine</td></tr><tr><td>2</td><td>Glomérulonéphrite rapidement progressive ou syndrome néphritique avec protéinurie abondante</td><td>Menace rénale</td><td>Hématurie glomérulaire, cylindres érythrocytaires, acanthocytes, hypertension, baisse rapide du DFG ; C3 bas, signes systémiques de vascularite</td><td>Sédiment, C3 et C4, ANCA (MPO et PR3), biopsie (N04.7 = croissants)</td></tr><tr><td>3</td><td>Néphropathie membraneuse (N04.2)</td><td>Risque thrombotique maximal</td><td>Adulte des 4e et 5e décennies, anti-PLA2R positifs (environ 75 % des formes primaires), microhématurie dans 30 à 40 %</td><td>Anti-PLA2R (diagnostic sans biopsie si nettement positifs et DFGe &gt; 60) ; biopsie sinon</td></tr><tr><td>4</td><td>Lésions glomérulaires minimes (N04.0)</td><td>Insuffisance rénale aiguë dans 10 à 40 %</td><td>Début brutal daté, enfant ou adulte jeune, réponse « tout ou rien » aux corticoïdes</td><td>Enfant &lt; 12 ans : réponse à 4 semaines de corticoïdes ; adulte : biopsie (effacement des pédicelles en microscopie électronique)</td></tr><tr><td>5</td><td>Hyalinose segmentaire et focale (N04.1) primaire, secondaire ou génétique</td><td>Corticorésistance, insuffisance rénale</td><td>Primaire : syndrome néphrotique complet ; secondaire : protéinurie néphrotique avec albumine &gt; 30 g/L ; génétique : familial, syndromique, &lt; 1 an, corticorésistance</td><td>Biopsie (microscopie optique et électronique) ; test génétique selon indications</td></tr><tr><td>6</td><td>Glomérulopathies secondaires (diabète N08.3 avec E10–E14, amylose E85, lupus, infections, cancers, médicaments)</td><td>Variable</td><td>Contexte (diabète, myélome, maladie systémique, AINS, lithium, voyages), sérologies</td><td>Sérologies, anticorps antinucléaires, électrophorèse et chaînes légères libres, biopsie</td></tr><tr><td>7</td><td>Protéinurie de rang néphrotique sans syndrome néphrotique (hyalinose secondaire, néphropathie à IgA)</td><td>Progression lente</td><td>Albumine normale, œdème absent ou discret</td><td>Albumine sérique avec méthode connue ; rapport protéines/créatinine</td></tr></tbody></table><p>Quand les œdèmes existent sans protéinurie de rang néphrotique, la cause est extrarénale : insuffisance cardiaque (voir le cours I50), cirrhose (voir K74), causes veineuses ou médicamenteuses. Ces entités ne sont pas développées ici faute de source lue pour leurs critères. À l’inverse, une protéinurie isolée sans œdème peut être orthostatique (première urine du matin non protéinurique) ou non néphrotique (0,3 à 3,4 g/24 h, albumine normale, sans symptôme).</p><p>Pour M. R., le rang 1 est écarté (pas de douleur lombaire, de fièvre ni de hausse de la créatinine) ; le rang 2 l’est aussi (dans ce cas fictif, ni hypertension ni cylindres érythrocytaires) ; le rang 3 est le plus probable.</p><h3 id="n04-a07-partie-5">5. Quand adresser en Suisse</h3><p>La Société suisse de néphrologie recommande d’adresser au néphrologue tout patient dont le rapport albumine/créatinine est constamment supérieur à 30 mg/mmol (300 mg/g), qui présente une hématurie glomérulaire, une maladie rénale d’origine inconnue, un DFGe inférieur à 30, une insuffisance rénale aiguë ou une chute brutale et persistante du DFGe, des anomalies persistantes du potassium ou une maladie héréditaire. Un syndrome néphrotique remplit toujours le premier critère.</p><div class="key"><b>À retenir.</b> Le diagnostic confirme d’abord le rang néphrotique et l’albumine, puis cherche la forme. Chez l’adulte, les anti-PLA2R se dosent d’emblée et permettent parfois d’éviter la biopsie ; chez l’enfant de moins de 12 ans sans signe atypique, la réponse aux corticoïdes remplace la biopsie. Un test anti-PLA2R négatif n’exclut pas la néphropathie membraneuse. Tout syndrome néphrotique est adressé au néphrologue.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a> ; <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/download/DLA_INV_01_00380?no_cache=1" target="_blank" rel="noopener">CHUV — catalogue des analyses, anticorps anti-PLA2R (V12, 27.09.2023)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></section><section class="ilot" id="n04-a08"><h2><span class="n">A08</span> Urgences et complications</h2><h3 id="n04-a08-partie-1">1. Les situations graves d’abord</h3><div class="alert"><b>Évaluation urgente.</b> Quatre situations imposent une évaluation urgente. <b>(1) Une thrombose</b> : douleur lombaire, hématurie macroscopique et LDH élevée évoquent une thrombose de la veine rénale ; une embolie pulmonaire peut être silencieuse. <b>(2) Une insuffisance rénale aiguë</b> : elle complique 10 à 40 % des lésions minimes de l’adulte et peut venir d’une déplétion volémique par diurétiques ou d’un bloqueur du système rénine-angiotensine à forte dose. <b>(3) Une infection</b>, notamment une péritonite chez l’enfant avec ascite fébrile. <b>(4) Une hyperkaliémie</b> sous spironolactone associée à un bloqueur du système rénine-angiotensine. Les sources lues ne publient pas de liste formelle d’hospitalisation : ces quatre situations sont celles que les sources qualifient de graves.</div><p>Les thromboses sont la complication la plus redoutée. Le risque artériel et veineux dépasse celui de la population générale, surtout pendant les six premiers mois. Les thromboses sont plus fréquentes chez l’adulte et plus souvent veineuses : thrombose veineuse profonde, thrombose de la veine rénale, embolie pulmonaire parfois silencieuse. Le risque est maximal dans la néphropathie membraneuse. Les meilleurs prédicteurs sont l’histologie, la protéinurie et l’albumine inférieure à 25 g/L ; s’y ajoutent un antécédent de thrombose, une thrombophilie, des antiphospholipides, l’immobilité, l’obésité, un cancer, une grossesse ou une chirurgie. Historiquement, la thrombose veineuse profonde survient dans environ 15 % des cas et l’embolie pulmonaire dans 10 à 30 % ; près de la moitié des thromboses surviennent à la première manifestation, et la corticothérapie à forte dose ajoute un risque. Ces données sont anciennes et probablement en baisse avec les traitements actuels, selon la source. Dans les lésions minimes, les thromboses veineuses touchent 10 à 37 % des patients et les thromboses artérielles 0,3 % par an.</p><h3 id="n04-a08-partie-2">2. Un tableau pour ne rien manquer</h3><p>Le tableau relie chaque complication à son mécanisme, à son signe d’alerte et à l’examen qui la confirme. Il répond à la question « que surveiller chez ce patient ? ». Lire la colonne du signe d’alerte avant celle de l’examen ; l’erreur fréquente est de se fier aux D-dimères : ils sont élevés dans le syndrome néphrotique sans thrombose cliniquement pertinente et ne servent pas à décider d’une prophylaxie.</p><table class="t"><thead><tr><th>Complication</th><th>Mécanisme</th><th>Signe d’alerte</th><th>Examen</th></tr></thead><tbody><tr><td>Thrombose veineuse ou artérielle, embolie pulmonaire</td><td>Perte d’antithrombine, protéines procoagulantes élevées, fibrinolyse diminuée</td><td>Mollet douloureux, dyspnée ; sinus veineux cérébraux et veines mésentériques possibles</td><td>Imagerie selon le site ; les D-dimères ne guident pas la décision</td></tr><tr><td>Thrombose de la veine rénale</td><td>Même mécanisme, risque maximal dans la néphropathie membraneuse</td><td>Douleur lombaire, LDH élevée, hématurie macroscopique ; bilatérale : insuffisance rénale aiguë</td><td>Imagerie vasculaire rénale</td></tr><tr><td>Infection bactérienne</td><td>Risque infectieux du syndrome ; IgG parfois abaissées</td><td>Fièvre ; infections répétées</td><td>Dosage des IgG en cas de récidive ; cultures</td></tr><tr><td>Péritonite bactérienne spontanée (enfant)</td><td>Ascite infectée</td><td>Ascite fébrile, signes abdominaux (bactériémie possible)</td><td>Examen microscopique et culture du liquide ; CRP utile, vitesse de sédimentation inutile ; antibiotiques par voie parentérale après prélèvements</td></tr><tr><td>Insuffisance rénale aiguë (surtout lésions minimes)</td><td>Sexe masculin, âge, hypertension, albumine basse, déplétion volémique, bloqueur du système rénine-angiotensine, néphrotoxiques</td><td>Hausse de la créatinine supérieure à 1,5 fois</td><td>Créatinine ; suspendre temporairement le bloqueur</td></tr><tr><td>Hypovolémie et hyperkaliémie iatrogènes</td><td>Diurétiques excessifs ; spironolactone avec bloqueur du système rénine-angiotensine</td><td>Fatigue, hypotension ; potassium élevé</td><td>Créatinine, potassium</td></tr></tbody></table><p>M. R. relève du risque thrombotique maximal : néphropathie membraneuse, albumine de 19 g/L. La prophylaxie anticoagulante, décidée à l’îlot 9, devient le premier acte de traitement de soutien.</p><div class="key"><b>À retenir.</b> La thrombose domine le risque, surtout dans la néphropathie membraneuse et pendant les six premiers mois. L’insuffisance rénale aiguë touche 10 à 40 % des lésions minimes. Les D-dimères ne guident pas la prophylaxie. L’enfant avec ascite fébrile doit bénéficier d’une ponction.</div><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p><button class="pareto-btn ui" data-k="pareto-n04-a3">▲ Loi de Pareto — Diagnostic, différentiels et urgences</button></section>
