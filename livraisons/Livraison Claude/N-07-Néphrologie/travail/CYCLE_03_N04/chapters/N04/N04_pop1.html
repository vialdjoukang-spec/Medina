<template data-pop="n04-filtration" data-title="Barrière de filtration glomérulaire"><p>Le glomérule filtre le plasma à travers trois couches successives : l’endothélium fenêtré du capillaire, la membrane basale glomérulaire et la couche des podocytes. Les podocytes sont des cellules épithéliales post-mitotiques et terminalement différenciées. Leurs pédicelles s’interdigitent avec ceux des podocytes voisins ; les espaces qui les séparent sont fermés par un diaphragme de fente. Cet ensemble laisse passer l’eau et les petites molécules (urée, créatinine) et retient les grosses protéines, dont l’albumine.</p><p>Dans le syndrome néphrotique, la lésion podocytaire se traduit d’abord par l’aplatissement des pédicelles et la perte des diaphragmes de fente, avec une protéinurie massive. La perte des podocytes et leur détachement de la membrane basale conduisent à la sclérose segmentaire. La conséquence pratique est simple : la protéinurie néphrotique signale une perte de sélectivité du filtre, et non un manque de production de l’albumine.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-oncotique" data-title="Pression oncotique et forces de Starling"><p>Un capillaire échange du liquide avec l’interstitium sous l’effet de deux forces opposées. La pression hydrostatique du sang pousse le liquide hors du vaisseau. La pression oncotique, exercée par les protéines plasmatiques, surtout l’albumine, retient le liquide dans le vaisseau. Ce sont les forces de Starling.</p><p>Les protéines totales sériques de référence se situent entre 64 et 83 g/L (18–60 ans) et l’albumine entre 31 et 45 g/L chez l’adulte (Viollier). Chez M. R., l’albumine de 19 g/L est inférieure de 12 g/L à la limite basse de référence : la pression oncotique plasmatique est abaissée, et le liquide sort du capillaire. Cette fuite appauvrit le volume plasmatique, ce qui active le système rénine-angiotensine-aldostérone et la vasopressine : le rein retient alors du sodium et de l’eau et l’œdème se majore. Le liquide perdu reste dans l’interstitium, il ne revient pas dans le plasma tant que l’albumine reste basse.</p><p>Limite : l’hypothèse du sous-remplissage explique une partie seulement de l’œdème, car la rétention primaire de sodium par activation d’ENaC coexiste.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-calc-rpc" data-title="Calcul : le rapport protéines/créatinine"><p><b>Ce que représente chaque grandeur.</b> Les protéines urinaires se mesurent en milligrammes par litre. La créatinine urinaire se mesure en millimoles par litre : l’organisme en produit une quantité à peu près constante par jour, de sorte que sa concentration dans l’urine varie surtout avec la dilution de l’urine.</p><p><b>Pourquoi diviser l’une par l’autre.</b> Une urine concentrée contient plus de protéines et plus de créatinine ; une urine diluée en contient moins des deux. Le rapport annule la dilution et estime donc la protéinurie de 24 heures à partir d’un seul échantillon. KDIGO fait correspondre une protéinurie de 3,5 g/24 h et un rapport de 3000 mg/g (300 mg/mmol).</p><p><b>Formule et unités.</b> Rapport (mg/mmol) = protéines urinaires (mg/L) ÷ créatinine urinaire (mmol/L).</p><p><b>Exemple chiffré.</b> Protéines : 2400 mg/L ; créatinine : 6 mmol/L. Étape 1 : 2400 ÷ 6 = 400. Étape 2 : l’unité est mg/mmol. Résultat : 400 mg/mmol, supérieur à 300 mg/mmol (rang néphrotique de l’adulte). La valeur de référence de Viollier est inférieure à 15 mg/mmol : le résultat est plus de vingt-six fois cette limite.</p><p><b>Conversion mg/g et mg/mmol.</b> La créatinine a une masse molaire d’environ 113 g/mol : 1 g de créatinine contient environ 8,84 mmol. Un rapport « par gramme » se divise donc par 8,84 pour devenir un rapport « par millimole ». Exemple : 4200 mg/g ÷ 8,84 ≈ 475 mg/mmol. Les recommandations arrondissent à une division par 10 (3000 mg/g ↔ 300 mg/mmol ; 200 mg/g ↔ 20 mg/mmol), soit environ 420 mg/mmol pour 4200 mg/g. Dans les deux cas, le résultat dépasse 300 mg/mmol. Pour M. R., 650 mg/mmol équivalent à environ 5750 mg/g par la multiplication exacte ou 6500 mg/g avec l’arrondi.</p><p><b>Limites.</b> La production de créatinine varie avec le sexe, le régime, l’origine et la condition physique ; un rapport isolé est imparfait. D’où la récolte de 24 heures avant d’initier ou d’intensifier une immunosuppression, ou le rapport sur une aliquote d’une récolte de 24 heures. La figure source de KDIGO donne la protéinurie non néphrotique par un rapport inférieur à 30 mg/mmol, ce qui ne coïncide pas exactement avec 3,4 g/24 h ; la valeur en grammes par 24 heures est retenue.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-calc-albumine" data-title="Calcul : la méthode de dosage de l’albumine"><p><b>Le problème.</b> Deux appareils peuvent donner deux valeurs différentes pour le même sérum. Le vert de bromocrésol donne des valeurs supérieures d’environ 5,5 g/L à celles du pourpre de bromocrésol (BCP), de l’électrophorèse capillaire ou de l’immunonéphélométrie. Le seuil d’hypoalbuminémie dépend donc de la méthode.</p><p><b>Règle de conversion.</b> Seuil au pourpre ≈ seuil au vert − 5 g/L. KDIGO arrondit 25 g/L au vert à 20 g/L au pourpre, et 32 g/L au vert à 30 g/L au pourpre. Le laboratoire Viollier utilise le pourpre : sa valeur de référence est de 31 à 45 g/L chez l’adulte ; avec la néphélométrie, elle est de 35 à 52 g/L.</p><p><b>Exemples.</b> M. R. : 19 g/L au pourpre, soit environ 24 g/L au vert (19 + 5) : il est sous les deux seuils de 20 et 25 g/L. Autre patient : 22 g/L au pourpre, soit environ 27 g/L au vert : au-dessus de 20 g/L (pourpre), donc l’indication de prophylaxie dépend des autres facteurs.</p><p><b>Limite.</b> Il faut toujours vérifier la méthode du laboratoire avant de comparer à un seuil.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-calc-sel" data-title="Calcul : sodium, millimoles et sel de cuisine"><p><b>Grandeurs.</b> Les recommandations expriment la limite de sodium alimentaire de deux manières : KDIGO en grammes de sodium (moins de 2,0 g/jour) et en millimoles (moins de 90 mmol/jour) ; la Société suisse de néphrologie en grammes de sel (moins de 5 g/jour).</p><p><b>Bases de chimie.</b> La masse molaire du sodium est de 23 g/mol ; celle du chlorure de sodium, de 58,4 g/mol. Le sodium représente donc environ 39 % de la masse du sel (23 ÷ 58,4).</p><p><b>Formules.</b> mmol = mg ÷ 23 ; sel (g) ≈ sodium (g) × 2,54.</p><p><b>Exemple.</b> 2,0 g de sodium = 2000 mg ÷ 23 ≈ 87 mmol (soit environ 90 mmol), et 2,0 × 2,54 ≈ 5,1 g de sel. Les deux cibles coïncident.</p><p><b>Limite.</b> Les masses molaires sont des constantes de chimie, non tirées des sources médicales lues.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.swissnephrology.ch/wp/wp-content/uploads/2025/03/Version-2025_Francais_V_17.03.2025_WZ.pdf" target="_blank" rel="noopener">SSN — dépistage et identification de la maladie rénale chronique (17.03.2025)</a>.</p></template>
<template data-pop="n04-cim" data-title="Codage CIM-10-GM : N04 et ses sous-codes"><p>La CIM-10-GM 2024 (version française suisse de l’Office fédéral de la statistique) classe le syndrome néphrotique en N04. L’inclusion comprend le syndrome néphrotique congénital et la néphrose lipoïdique. Le quatrième caractère est commun aux catégories N00 à N07 : .0 à .8 décrivent la morphologie, .9 le type non précisé.</p><p><b>Règle.</b> Les subdivisions .0 à .8 ne doivent normalement être utilisées qu’après identification précise par biopsie rénale ou autopsie ; la catégorie à trois caractères désigne le syndrome clinique. Conséquence pédagogique : un enfant traité sans biopsie reste codé N04.9.</p><p><b>Codes supplémentaires du bloc N00–N08.</b> I12 ou I13 pour une maladie rénale hypertensive, N18 pour une maladie rénale chronique, N17 ou N19 pour une insuffisance rénale aiguë ou non précisée, chapitre des causes externes pour la cause externe. Les glomérulopathies au cours de maladies classées ailleurs relèvent de N08 (N08.3 au cours du diabète sucré, E10 à E14, avec le quatrième caractère .2).</p><p class="src">Sources : <a data-reference-source="1" href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener">OFS — CIM-10-GM 2024, version française (31.10.2024)</a>.</p></template>
<template data-pop="n04-pla2r" data-title="Anticorps anti-PLA2R et anti-THSD7A : seuils et unités"><p>PLA2R est le récepteur de type M de la phospholipase A2, un antigène du podocyte ; THSD7A est la protéine à domaine de type 1 de la thrombospondine, de type 7A (« thrombospondin type-1 domain-containing 7A »). Les anticorps dirigés contre ces antigènes forment des complexes immuns sous-épithéliaux, surtout d’IgG4, dans la néphropathie membraneuse : anti-PLA2R dans environ 75 % des formes primaires, anti-THSD7A dans 5 à 10 % des formes PLA2R-négatives.</p><p>Le tableau suivant distingue quatre seuils qu’il ne faut pas confondre.</p><table class="t"><thead><tr><th>Seuil</th><th>Valeur</th><th>Signification</th><th>Source</th></tr></thead><tbody><tr><td>Valeur de référence</td><td>&lt; 14 U/mL (anti-PLA2R) ; &lt; 10 (anti-THSD7A)</td><td>Normal selon le laboratoire</td><td>Viollier</td></tr><tr><td>Seuil diagnostique sans biopsie</td><td>&gt; 20 unités relatives par ml (ELISA Euroimmun) ou immunofluorescence indirecte positive</td><td>Renoncer à la biopsie si DFGe &gt; 60 et autres causes exclues</td><td>ÖGN 2023</td></tr><tr><td>Seuil de risque</td><td>&gt; 50 RU/ml (non validé)</td><td>Critère de risque élevé</td><td>KDIGO 2021</td></tr><tr><td>Cible de rémission immunologique</td><td>&lt; 2 RU/ml (ELISA) ou immunofluorescence négative</td><td>Rémission immunologique complète</td><td>KDIGO 2021, ÖGN</td></tr></tbody></table><p>Une méta-analyse (710 patients, 1502 témoins) rapporte une sensibilité de 0,78 et une spécificité de 0,99. Un résultat positif est donc très évocateur ; un résultat négatif n’exclut pas la maladie. Les dosages sont disponibles au CHUV (ELISA, deux fois par mois, délai 1 à 2 semaines, analyse accréditée) et chez Viollier (ELISA, deux fois par mois, délai de 2 semaines). <b>Piège :</b> les unités (U/mL, unités relatives par ml, RU/ml) appartiennent chacune à une méthode ; les seuils de la littérature ne se transposent pas sans vérifier la méthode du laboratoire.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a> ; <a data-reference-source="1" href="https://catalogue.chuv.ch/analyses-examens/laboratoires/fiche/download/DLA_INV_01_00380?no_cache=1" target="_blank" rel="noopener">CHUV — catalogue des analyses, anticorps anti-PLA2R (V12, 27.09.2023)</a>.</p></template>
<template data-pop="n04-mcd" data-title="Lésions glomérulaires minimes"><p>Les lésions glomérulaires minimes sont une cause de 10 à 25 % des syndromes néphrotiques de l’adulte (KDIGO) et de loin la cause la plus fréquente chez l’enfant. La microscopie optique est normale ; la microscopie électronique montre un effacement étendu des pédicelles sans dépôts denses. La pathogenèse est incomplètement connue : dysrégulation des lymphocytes T, rôle des lymphocytes B (suggéré par l’efficacité du rituximab), anticorps anti-néphrine chez environ 30 % des patients d’une étude récente. Le début est brutal, en jours à semaines. Le traitement repose sur les glucocorticoïdes à forte dose, avec rémission chez 80 à 90 % des adultes. Code : N04.0.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a>.</p></template>
<template data-pop="n04-fsgs" data-title="Hyalinose segmentaire et focale"><p>La hyalinose segmentaire et focale désigne une sclérose d’un segment (segmentaire) de certains glomérules seulement (focale). Environ 9 % des biopsies rénales de l’adulte en Europe la montrent ; la forme primaire est la deuxième cause de syndrome néphrotique de l’adulte, mais la forme adaptative secondaire est probablement la plus fréquente. Trois groupes existent : primaire (syndrome néphrotique complet, effacement diffus des pédicelles), secondaire (protéinurie néphrotique avec albumine supérieure à 30 g/L) et génétique (familial, syndromique, avant 1 an, corticorésistance). Seule la forme primaire reçoit une immunosuppression. Code : N04.1.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511576/" target="_blank" rel="noopener">ÖGN 2023 — hyalinose segmentaire et focale</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-mn" data-title="Néphropathie membraneuse"><p>La néphropathie membraneuse est une glomérulonéphrite à complexes immuns sous-épithéliaux. Elle représente environ 30 % des syndromes néphrotiques de l’adulte, avec un pic aux 4e et 5e décennies et un sex-ratio de 2 hommes pour 1 femme. Elle est primaire dans 70 à 80 % des cas (anti-PLA2R dans environ 75 %) et secondaire dans 20 à 30 % (hépatite B, cancers, médicaments, lupus). Un tiers des patients entre en rémission spontanée. Le risque de thrombose y est maximal. Code : N04.2.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a>.</p></template>
<template data-pop="n04-enac" data-title="Le canal sodique épithélial ENaC et la plasmine"><p>ENaC est un canal qui réabsorbe le sodium dans le néphron distal. Il se compose de sous-unités α, β et γ. Dans le syndrome néphrotique, des sérine-protéases filtrées, surtout la plasmine (formée à partir du plasminogène par l’activateur de type urokinase), clivent les sous-unités α et γ : le canal devient actif et retient du sodium. Ce mécanisme est indépendant du système rénine-angiotensine-aldostérone et explique la rétention de sodium chez des patients à rénine et aldostérone basses. L’amiloride bloque ENaC ; KDIGO précise que cet effet n’est pas validé par un essai randomisé. Une partie des preuves provient de modèles murins.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10968602/" target="_blank" rel="noopener">Fratila et coll. 2024 — Biomedicines 12(3):569</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-lipides" data-title="Dyslipidémie néphrotique : lipoprotéines, LPL et PCSK9"><p>Les lipoprotéines transportent le cholestérol et les triglycérides : VLDL et IDL (riches en triglycérides, contenant l’apolipoprotéine B), puis LDL, puis HDL. La lipoprotéine lipase (LPL), située sur l’endothélium du muscle et du tissu adipeux, hydrolyse les triglycérides des VLDL. Dans le syndrome néphrotique, son activité diminue, ainsi que celle de la lipase hépatique ; la protéine PCSK9, qui régule les récepteurs des LDL, augmente. Les HDL sont immatures et l’efflux de cholestérol est réduit. Chez M. R., le cholestérol total (9,4 mmol/L) dépasse nettement la valeur de référence de 5,18 mmol/L. Une valeur de laboratoire comme le LDL inférieur à 2,60 mmol/L n’est pas une cible thérapeutique. Cette synthèse repose sur une revue américaine employée pour la seule biochimie, sans décision clinique.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5770189/" target="_blank" rel="noopener">Agrawal et coll. 2018 — Nat Rev Nephrol 14:57–70</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-coagulation" data-title="Hypercoagulabilité du syndrome néphrotique"><p>L’antithrombine, protéine de 65 kDa qui inhibe la coagulation, passe dans l’urine. Les protéines procoagulantes de haut poids moléculaire (fibrinogène, facteurs V et VIII) augmentent dans le plasma, la thrombocytose est fréquente et la fibrinolyse diminue. L’activité de l’antithrombine de référence (Viollier) est de 83 à 118 %. Conséquence : l’héparine, dont l’effet passe par l’antithrombine, peut être moins efficace ; KDIGO note qu’une dose plus élevée que d’habitude peut être nécessaire. Le risque est maximal dans la néphropathie membraneuse et pendant les 6 premiers mois.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3302669/" target="_blank" rel="noopener">Kerlin et coll. 2012 — Clin J Am Soc Nephrol 7:513–520</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://www.viollier.ch/fr/repertoire-des-analyses" target="_blank" rel="noopener">Viollier — répertoire des analyses (consulté le 14.10.2026)</a>.</p></template>
<template data-pop="n04-orthostatique" data-title="Protéinurie orthostatique"><p>Certains sujets, souvent jeunes, éliminent des protéines seulement en position debout. La première urine du matin, recueillie après le décubitus, ne contient alors pas de protéines. Piège : un rapport sur la première urine du matin sous-estime la protéinurie de 24 heures d’environ 20 % et manque cette forme. Pour la détecter, on recueille séparément la première urine du matin et on mesure son rapport protéines/créatinine. Cette forme ne s’accompagne ni d’hypoalbuminémie ni d’œdème.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-resistance" data-title="Résistance aux diurétiques de l’anse"><p>Un diurétique de l’anse doit atteindre l’anse de Henle sous forme active. Trois mécanismes limitent sa dose active dans le syndrome néphrotique : (1) un volume de distribution plus grand en hypoalbuminémie ; (2) la liaison du diurétique filtré à l’albumine tubulaire ; (3) l’œdème de la paroi intestinale, qui rend l’absorption orale incertaine. S’ajoutent le phénomène de freinage aigu (réponse atténuée après une dose) et l’adaptation tubulaire chronique. La stratégie suit le niveau de résistance : doubler la dose, passer au torasémide ou au bumétanide, associer un diurétique de mécanisme différent, utiliser la voie intraveineuse en perfusion continue, enfin l’ultrafiltration ou l’hémodialyse.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-rein-eponge" data-title="L’hypothèse du « rein-éponge »"><p>Au début de la maladie, les anticorps anti-PLA2R peuvent se fixer sur les podocytes et rester indétectables dans le sérum : le rein fonctionne comme une éponge. À l’inverse, après la rémission immunologique, l’antigène reste visible dans la biopsie plus longtemps que les anticorps sériques. La protéinurie suit la rémission immunologique avec un retard de plusieurs mois. Conséquence : un test sérique négatif n’exclut pas la maladie, et la protéinurie qui persiste après la négativation des anticorps ne signifie pas un échec du traitement.</p><p class="src">Sources : <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511554/" target="_blank" rel="noopener">ÖGN 2023 — néphropathie membraneuse (20.09.2023)</a>.</p></template>
<template data-pop="n04-iec-debut-brutal" data-title="Pourquoi ne pas débuter un bloqueur lors d’un début brutal"><p>Un syndrome néphrotique à début brutal est le plus souvent une lésion minime, qui répond aux corticoïdes. Dans cette situation, la filtration est déjà réduite et le patient peut être hypovolémique. Un inhibiteur de l’enzyme de conversion ou un antagoniste de l’angiotensine II dilate l’artériole efférente et abaisse la pression de filtration : il peut déclencher une insuffisance rénale aiguë. KDIGO recommande donc de ne pas les débuter lors d’un début brutal, et d’en différer l’introduction chez le non-hypertendu dont la podocytopathie répondra vite à l’immunosuppression. Une fois l’état stabilisé, ils reprennent leur place pour réduire la protéinurie.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-anticoag" data-title="Arbre de décision de la prophylaxie anticoagulante"><p>La décision suit cinq étapes. <b>1. Thrombose avérée ?</b> Si oui, anticoagulation curative pendant 6 à 12 mois et/ou la durée du syndrome néphrotique. <b>2. Albumine, avec sa méthode.</b> Convertir la valeur : 25 g/L au vert de bromocrésol valent environ 20 g/L au pourpre ou en immunodosage. <b>3. Facteurs de risque thrombotique.</b> Au moins un parmi : protéinurie supérieure à 10 g/jour, IMC supérieur à 35 kg/m², prédisposition génétique, insuffisance cardiaque NYHA III ou IV, chirurgie orthopédique ou abdominale récente, immobilisation prolongée ; la néphropathie membraneuse confère un risque particulièrement élevé. <b>4. Risque hémorragique.</b> Contre-indications relatives : préférence ou adhérence, diathèse hémorragique, lésion cérébrale à risque, mutations modifiant les antivitamines K, fragilité avec chutes, antécédent d’hémorragie digestive. <b>5. Choix du traitement.</b> Héparine de bas poids moléculaire à faible dose, puis relais par antivitamine K ; l’aspirine ne prévient pas la thrombose veineuse ; les anticoagulants oraux directs sont hors indication ; l’arrêt est envisagé quand l’albumine remonte durablement au-dessus de 25 à 30 g/L.</p><p>Dans l’algorithme KDIGO de la néphropathie membraneuse : albumine inférieure à 25 g/L (vert) ou 20 g/L (pourpre) avec risque veineux élevé : évaluer le saignement, antivitamine K si risque faible. Albumine inférieure à 32 g/L (vert) ou 30 g/L (pourpre) : estimer le risque artériel (Framingham, DFGe, diabète, antécédents) ; aspirine si plus de 20 pour 1000 patients-années. Cet algorithme est une opinion d’experts dont la valeur hors néphropathie membraneuse est inconnue. Les glucocorticoïdes augmentent eux-mêmes le risque thrombotique.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="n04-calc-anticoag" data-title="Calcul : doses d’énoxaparine et anti-Xa"><p><b>Grandeurs.</b> L’énoxaparine se prescrit en milligrammes ; son activité se mesure en unités internationales anti-Xa (UI), c’est-à-dire par l’inhibition du facteur Xa de la coagulation. Équivalence : 20 mg = 2000 UI ; 40 mg = 4000 UI.</p><p><b>Doses.</b> Prophylaxie en médecine : 40 mg par voie sous-cutanée une fois par jour ; clairance de la créatinine inférieure à 30 mL/min : 20 mg une fois par jour (FI suisse Clexane® et consensus autrichien). Traitement de la thrombose veineuse : 1 mg/kg toutes les 12 heures.</p><p><b>Contrôle.</b> Cible de l’anti-Xa selon le consensus autrichien : 0,3 à 0,5 UI/ml mesurés 4 heures après la dose, sans dépasser 0,8. Un contrôle est recommandé en cas de DFGe inférieur à 30, d’IMC supérieur à 40, de maigreur ou de grossesse.</p><p><b>Exemple.</b> Patient de DFGe 25 mL/min : 20 mg par jour, soit 2000 UI, avec un anti-Xa à contrôler. Patient de 85 kg en traitement d’une thrombose : 85 mg toutes les 12 heures (1 mg/kg).</p><p><b>Limite.</b> L’usage dans la prophylaxie du syndrome néphrotique est une position d’experts, non une indication de la FI.</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener">Information professionnelle Swissmedic — Clexane® (février 2026)</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a>.</p></template>
<template data-pop="n04-calc-prednisone" data-title="Calcul : la dose de prednisone de l’adulte"><p><b>Principe.</b> La dose initiale est de 1 mg par kilogramme et par jour, calculée sur le poids sec, c’est-à-dire le poids avant les œdèmes (ÖGN), plafonnée à 80 mg (KDIGO) ou 60 mg (ÖGN, recommandations nationales et essai TURING). Formule : dose = minimum de (1 mg × poids sec) et du plafond.</p><p><b>Pourquoi le poids sec.</b> Les œdèmes ajoutent des kilogrammes d’eau qui ne reçoivent pas le médicament : les inclure surdoserait.</p><p><b>Exemple.</b> Patient de 78 kg secs (86 kg avec œdèmes). Étape 1 : 1 mg × 78 = 78 mg. Étape 2 : comparer au plafond. Selon KDIGO, 78 mg (inférieur à 80) ; selon l’ÖGN, 60 mg. Dans les deux cas, le poids avec œdèmes (86 mg) ne sert pas. La FI suisse de la Prednisone Streuli® propose des comprimés sécables de 5, 20 et 50 mg et autorise des doses plus élevées que les doses habituelles de 5 à 60 mg/jour ; la FI de Spiricort® cite 80 à 120 mg/jour pour le traitement à dose élevée du syndrome néphrotique.</p><p><b>Interprétation.</b> La différence entre 60 et 80 mg est une divergence entre sources, non une erreur ; voir la <button class="w" data-k="n04-contentieux-prednisone">fenêtre « contentieux »</button>.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511370/" target="_blank" rel="noopener">ÖGN 2023 — lésions glomérulaires minimes de l’adulte</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680293490370" target="_blank" rel="noopener">Information professionnelle Swissmedic — Prednisone Streuli® (juin 2026)</a> ; <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680388400109" target="_blank" rel="noopener">Information professionnelle Swissmedic — Spiricort® (juin 2026)</a>.</p></template>
<template data-pop="n04-calc-mgm2" data-title="Calcul : la dose pédiatrique en mg/m²"><p><b>Bases.</b> La surface corporelle (en m²) intègre la taille et le poids de l’enfant. Dosée par surface, la prednisone évite de sous-doser le jeune enfant, car le métabolisme d’un petit enfant est relativement plus rapide que celui d’un adulte. La formule de calcul de la surface n’a pas été lue dans les sources : la surface est donnée comme une donnée de l’exemple.</p><p><b>Formules (KDIGO 2025).</b> Dose quotidienne = 60 mg × surface (m²), plafonnée à 60 mg. Dose un jour sur deux = 40 mg × surface, plafonnée à 40 mg. Alternative au poids : 2 mg/kg/jour (maximum 60 mg) puis 1,5 mg/kg (maximum 40 mg) un jour sur deux.</p><p><b>Exemple.</b> Léa, surface 0,7 m². Étape 1 : 60 × 0,7 = 42 mg par jour, inférieur au plafond de 60 mg, pendant 4 semaines (ou 6). Étape 2 : 40 × 0,7 = 28 mg un jour sur deux pendant 4 semaines (ou 6). Durée totale : 8 semaines (ou 12 semaines).</p><p><b>Limite.</b> Au-delà de 12 semaines, les effets indésirables augmentent sans réduire les rechutes (KDIGO 2025).</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a>.</p></template>
<template data-pop="n04-calc-ciclo" data-title="Calcul : ciclosporine et créatinine"><p><b>Bases.</b> La ciclosporine peut léser le rein de façon dose-dépendante ; on surveille donc la créatinine. La FI de Sandimmun Neoral® fixe l’induction à 5 mg/kg/jour chez l’adulte, en 2 prises, et la règle d’adaptation à la créatinine : réduire de 25 à 50 % si elle dépasse de plus de 30 % la valeur initiale.</p><p><b>Formules.</b> Dose initiale = 5 mg × poids. Seuil d’alerte = créatinine de base × 1,30.</p><p><b>Exemple.</b> Adulte de 70 kg : 5 × 70 = 350 mg par jour (175 mg deux fois). Créatinine de base 80 µmol/L : seuil 80 × 1,30 = 104 µmol/L. À 110 µmol/L, on réduit la dose à 175 à 263 mg par jour (350 × 0,5 et 350 × 0,75). Le taux résiduel cible vient de KDIGO (100 à 175 ng/ml dans la hyalinose).</p><p class="src">Sources : <a data-reference-source="1" href="https://amiko.oddb.org/fr/fi?gtin=7680526560283" target="_blank" rel="noopener">Information professionnelle Swissmedic — Sandimmun Neoral® (janvier 2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
<template data-pop="n04-calc-cyclo" data-title="Calcul : la dose cumulée de cyclophosphamide"><p><b>Principe.</b> Le risque de cancer et d’infertilité dépend de la dose totale reçue. Dose cumulée = dose quotidienne × nombre de jours de traitement. Plafonds : moins de 36 g (risque de cancer), en pratique 25 g au plus, 10 g au plus si la fertilité doit être préservée ; l’ÖGN, citant KDIGO, indique 200 mg/kg ; enfant : 168 mg/kg (2 mg/kg/jour pendant 12 semaines).</p><p><b>Exemple (homme de 80 kg).</b> Schéma cyclique : 2,5 mg/kg/jour = 200 mg par jour aux mois 2, 4 et 6, soit environ 18 g. Schéma continu : 1,5 mg/kg/jour = 120 mg par jour pendant 6 mois, soit environ 22 g. Pour cet homme, 200 mg/kg correspondent à 16 g : les sources ne concilient pas cette valeur avec les 18 g du schéma cyclique ; la décision revient au centre spécialisé.</p><p class="src">Sources : <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a> ; <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10511582/" target="_blank" rel="noopener">ÖGN 2023 — recommandations générales sur les glomérulopathies</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2025/04/KDIGO-2025-Guideline-for-Nephrotic-Syndrome-in-Children.pdf" target="_blank" rel="noopener">KDIGO 2025 — syndrome néphrotique de l’enfant (avril 2025)</a>.</p></template>
<template data-pop="n04-immunosuppression-severe" data-title="Immunosuppression sévère au sens du plan de vaccination suisse"><p>Le plan suisse définit l’immunosuppression sévère par : une corticothérapie d’au moins 2 mg/kg/jour (dose enfant) ou d’au moins 20 mg par jour d’équivalent prednisolone pendant plus de deux semaines ; une déplétion des lymphocytes B ; une chimiothérapie forte ; ou des associations. Les vaccins vivants atténués ne doivent en principe pas être donnés en cas de déficit immunitaire. KDIGO propose de différer les vaccins vivants jusqu’à une prednisone inférieure à 20 mg/jour et/ou 1 à 3 mois après l’arrêt des immunosuppresseurs.</p><p class="src">Sources : <a data-reference-source="1" href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">OFSP/CFV — Plan de vaccination suisse 2026 (février 2026)</a> ; <a data-reference-source="1" href="https://kdigo.org/wp-content/uploads/2017/02/KDIGO-Glomerular-Diseases-Guideline-2021-English.pdf" target="_blank" rel="noopener">KDIGO 2021 — glomérulopathies (Kidney Int 2021 ; 100(4S))</a>.</p></template>
