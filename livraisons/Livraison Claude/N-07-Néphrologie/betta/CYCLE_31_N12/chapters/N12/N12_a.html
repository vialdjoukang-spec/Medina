<template id="ch-N12"><div class="chap"><div class="chap-head"><div class="code">N 12 · Néphrologie · Rein, eau et électrolytes</div><h1>Néphrite tubulo-interstitielle, non précisée comme aiguë ou chronique</h1><span class="status">Cycle Betta 31 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la néphrite tubulo-interstitielle</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#n12-0">Question clinique</a></li><li><a href="#n12-1">Définition et périmètre du code N12</a></li><li><a href="#n12-2">Classifications</a></li><li><a href="#n12-3">Fréquence</a></li><li><a href="#n12-4">Physiopathologie</a></li><li><a href="#n12-5">Causes et facteurs de risque</a></li><li><a href="#n12-6">Anamnèse</a></li><li><a href="#n12-7">Examen clinique</a></li><li><a href="#n12-8">Démarche diagnostique et différentiel</a></li><li><a href="#n12-9">Urgences et complications</a></li><li><a href="#n12-10">Prise en charge</a></li><li><a href="#n12-11">Suivi et pronostic</a></li><li><a href="#n12-12">Situations particulières</a></li><li><a href="#n12-13">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="n12-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 68 ans consulte pour une fièvre et une douleur lombaire. Elle prend depuis des mois un <button class="w" data-k="n12-medic">inhibiteur de la pompe à protons (IPP) et un anti-inflammatoire non stéroïdien (AINS)</button> ; une ciprofloxacine lui a été prescrite neuf jours plus tôt pour une infection urinaire basse. Sa créatinine est passée de 85 à 190 µmol/L. La bandelette urinaire montre des leucocytes. Ces valeurs sont pédagogiques et ne proviennent d’aucun dossier réel.</p>
<p>Deux maladies très différentes peuvent produire ce tableau. Une <button class="w" data-k="n12-pyelo">pyélonéphrite</button> est une infection bactérienne du rein : elle exige une antibiothérapie immédiate. Une <button class="w" data-k="n12-hypersens">néphrite interstitielle aiguë (NIA)</button> est une inflammation immuno-allergique du tissu situé entre les tubules, le plus souvent déclenchée par un médicament : elle exige d’abord l’arrêt de ce médicament. La conduite diffère, d’où la nécessité de distinguer les deux avant d’agir.</p>
<p>Le code <b>N12</b> de la classification internationale désigne justement une néphrite tubulo-interstitielle dont on ne sait pas encore si elle est aiguë ou chronique. Ce cours enseigne donc la démarche qui permet de préciser le diagnostic, jusqu’à pouvoir recoder la maladie en forme aiguë ou chronique <button class="w" data-k="n12-codes">(périmètre exact du code)</button>.</p>
<div class="key"><b>À retenir.</b> Une insuffisance rénale aiguë avec leucocyturie impose de séparer deux causes tubulo-interstitielles : l’infection, qui se traite par antibiotiques, et l’atteinte immuno-allergique, qui se traite d’abord par l’éviction de la substance en cause. La suite du cours construit cette distinction.</div>
</section>
<section class="ilot" id="n12-1"><h2><span class="n">1</span>Définition et périmètre du code N12</h2>
<p>La <b>néphrite tubulo-interstitielle</b> est une atteinte inflammatoire des tubules rénaux et du tissu interstitiel qui les entoure. Dans sa forme aiguë immuno-allergique, la <button class="w" data-k="n12-hypersens">NIA</button>, l’inflammation s’accompagne d’un œdème de l’interstitium d’intensité variable, dont la conséquence principale est l’insuffisance rénale aiguë (<button class="w" data-k="n12-ira">IRA</button>) (Revue médicale suisse 2022). La maladie a été décrite pour la première fois en 1898 par Councilman, au cours de la diphtérie et de la scarlatine.</p>
<p>La classification <button class="w" data-k="n12-codes">CIM-10-GM 2024</button> regroupe sous les codes N10 à N16 les « maladies rénales tubulo-interstitielles ». Ce bloc <b>inclut la pyélonéphrite</b> ; lorsqu’une maladie rénale chronique est présente, un code N18 s’ajoute. Le code N12 est réservé à la néphrite tubulo-interstitielle non précisée comme aiguë ou chronique ; il inclut la néphrite interstitielle sans précision, la pyélite sans précision et la pyélonéphrite sans précision. Il n’a ni sous-code ni exclusion propre.</p>
<table class="t"><thead><tr><th>Code</th><th>Intitulé</th><th>Quand l’utiliser</th></tr></thead><tbody><tr><td>N10</td><td>Néphrite tubulo-interstitielle aiguë</td><td>Forme aiguë précisée, y compris la pyélonéphrite aiguë infectieuse ; le germe se code séparément (B95 à B98)</td></tr><tr><td>N11.-</td><td>Néphrite tubulo-interstitielle chronique</td><td>Forme chronique précisée : N11.0 avec reflux, N11.1 obstructive, N11.8 autres, N11.9 sans précision</td></tr><tr><td>N12</td><td>Non précisée comme aiguë ou chronique</td><td>Évolution encore inconnue au moment du codage</td></tr></tbody></table>
<p>Ce tableau montre que N12 est un code d’attente : il décrit un état d’incertitude, non une maladie à part. Dès que l’évolution est établie, le code se précise. C’est la raison pour laquelle la démarche diagnostique tient une place centrale dans ce cours.</p>
<p>Pour la gravité rénale, le cours emploie la définition <button class="w" data-k="n12-ira">KDIGO 2012</button> de l’IRA : une hausse de la créatinine d’au moins 26,5 µmol/L en 48 heures, ou à 1,5 fois la valeur de base en sept jours, ou une diurèse inférieure à 0,5 mL/kg/heure pendant six heures. Le critère urinaire peut révéler une atteinte avant que la créatinine ne monte.</p>
<div class="trap"><span class="k">Piège</span> Aucune recommandation de la Société suisse de néphrologie, ni de recommandation européenne dédiée, ne fixe des critères diagnostiques formels de la NIA dans les sources lues. Le diagnostic de certitude repose sur la biopsie rénale ; le reste est un diagnostic de présomption.</div>
<div class="key"><b>À retenir.</b> N12 = néphrite tubulo-interstitielle sans précision aiguë ou chronique, pyélonéphrite sans précision comprise. Le but clinique est de préciser la forme pour recoder en N10 ou N11.</div>

<section class="ilot" id="n12-2"><h2><span class="n">2</span>Classifications</h2>
<p>Plusieurs classifications se superposent, chacune répondant à une question différente. On distingue d’abord l’<b>évolution</b> : la NIA, d’installation brutale, et la néphrite interstitielle chronique, moins bien documentée et probablement moins fréquente, dont les causes toxiques et génétiques sont plus spécifiques <button class="w" data-k="n12-chronique">(forme chronique)</button>.</p>
<p>On classe ensuite la NIA selon son <b>étiologie</b>. Les médicaments dominent nettement, comme le montre le tableau ci-dessous <button class="w" data-k="n12-etiologies">(répartition et lecture)</button>.</p>
<table class="t"><thead><tr><th>Étiologie de la NIA</th><th>Part des cas</th></tr></thead><tbody><tr><td>Médicamenteuse, immuno-allergique</td><td>70 à 75 %</td></tr><tr><td>Maladies systémiques</td><td>10 à 20 %</td></tr><tr><td>Infections</td><td>4 à 10 %</td></tr><tr><td>Autres causes et formes idiopathiques</td><td>moins de 5 %</td></tr></tbody></table>
<p>Les médicaments expliquent ainsi près des trois quarts des cas : un patient avec une IRA inexpliquée et un médicament récemment introduit doit donc être suspecté de NIA en premier lieu. Les maladies systémiques et les infections viennent ensuite et se recherchent par l’anamnèse et le bilan.</p>
<p>Pour l’<b>infection urinaire</b>, la Société suisse d’infectiologie (<button class="w" data-k="n12-pyelo">SSI</button>) parle d’infection « non compliquée » en l’absence d’anomalie structurelle ou fonctionnelle, de sonde, de grossesse, de greffe rénale ou d’immunosuppression ; un diabète bien équilibré n’est pas retenu comme facteur de complication. L’Association européenne d’urologie (<button class="w" data-k="n12-eau">EAU</button>) 2026 a abandonné l’opposition compliqué/non compliqué : elle distingue désormais une infection <b>localisée</b> d’une infection <b>systémique</b> (fièvre ou hypothermie, frissons, confusion, hypotension, tachycardie).</p>
<p>Enfin, la gravité de l’IRA se classe en trois stades <button class="w" data-k="n12-ira">KDIGO</button> : stade 1 pour une créatinine à 1,5–1,9 fois la base ou en hausse de 26,5 µmol/L ; stade 2 pour 2,0–2,9 fois la base ; stade 3 pour 3,0 fois la base, une créatinine d’au moins 353,6 µmol/L ou le recours à l’épuration extrarénale. Le stade le plus sévère entre créatinine et diurèse est retenu.</p>
<div class="key"><b>À retenir.</b> Quatre grilles répondent à quatre questions : aiguë ou chronique (évolution), pourquoi (étiologie, médicaments 70 à 75 %), localisée ou systémique (infection), quelle gravité (stades KDIGO).</div>
</section>
<section class="ilot" id="n12-3"><h2><span class="n">3</span>Fréquence</h2>
<p>La NIA est retenue dans 1 à 10 % des biopsies rénales pratiquées tout venant, avec une moyenne de 2,8 % ; en Europe, les séries rapportent 1 à 4,7 %. Lorsque la biopsie est faite pour élucider une IRA, la NIA représente en moyenne 13,5 % des cas, et 15 à 27 % selon <button class="w" data-k="n12-hypersens">Praga et González</button>. Ces proportions décrivent des patients biopsiés et ne donnent pas l’incidence dans la population.</p>
<p>La fréquence augmente avec l’âge. Le registre espagnol montre, chez les plus de 65 ans, une hausse de 1,6 à 12,3 % entre 1994 et 2009, attribuée à l’augmentation du nombre de biopsies et de la consommation d’antibiotiques et d’AINS. La présentation a également changé : le tableau classique (antibiotique, éruption, fièvre, éosinophilie) cède la place à des formes pauci-symptomatiques, surtout chez la personne âgée exposée aux AINS et aux IPP <button class="w" data-k="n12-triade">(présentation actuelle)</button>.</p>
<p>Deux groupes à risque particulier méritent d’être connus. Chez les patients infectés par le virus de l’immunodéficience humaine, la NIA représente 11 à 13 % des diagnostics histologiques selon les séries. Sous <button class="w" data-k="n12-ipci">inhibiteurs de points de contrôle immunitaire (IPCI)</button>, une IRA survient chez jusqu’à 20 % des patients, dont 2 à 5 % sont liées à ces médicaments, et la néphrite tubulo-interstitielle est trouvée dans 80 à 90 % des biopsies selon le consensus ADQI.</p>
<p>En Suisse, 20 à 30 % des isolats urinaires cliniques sont résistants au triméthoprime-sulfaméthoxazole, ce qui explique que cette association ne soit pas un premier choix empirique de la pyélonéphrite <button class="w" data-k="n12-pyelo-ttt">(choix des antibiotiques)</button>. <b>Lacune :</b> aucun chiffre d’incidence suisse de la pyélonéphrite ni de résistance actualisée autre que celui-ci n’a été lu.</p>
<div class="key"><b>À retenir.</b> NIA : 1 à 10 % des biopsies, environ 13,5 % des biopsies faites pour IRA. Ces chiffres viennent de séries biopsiées, souvent hors de Suisse.</div>
</section>
<section class="ilot" id="n12-4"><h2><span class="n">4</span>Physiopathologie</h2>
<p>Le rein est particulièrement exposé aux antigènes, endogènes comme exogènes. Son débit sanguin est élevé, son activité métabolique intense et la surface de son endothélium étendue : ces trois facteurs augmentent le contact entre le tissu rénal et les substances circulantes, médicaments compris.</p>
<p>La forme médicamenteuse relève d’une <b>hypersensibilité retardée</b>, décrite en trois phases <button class="w" data-k="n12-hypersens">(détail des phases)</button>. Dans la première, des monocytes au contact de l’épithélium tubulaire reconnaissent et présentent l’antigène. Dans la deuxième, phase régulatrice, les lymphocytes T sont activés. Dans la troisième, phase effectrice, la réponse humorale s’ajoute. Cette séquence explique le <b>délai</b> entre l’exposition et la maladie : l’immunité doit d’abord se mettre en place.</p>
<p>Elle explique aussi trois traits cliniques. La réaction est <b>indépendante de la dose</b>, car elle dépend de la réponse immunitaire du patient et non de la quantité de substance. Elle <b>récidive à la réexposition</b>, car le système immunitaire garde la mémoire de l’antigène. Elle s’accompagne de <b>manifestations extrarénales</b> (fièvre, éruption), car la réaction n’est pas confinée au rein.</p>
<p>L’infiltrat inflammatoire comprend des lymphocytes T, des macrophages, des éosinophiles et des plasmocytes. Ces cellules libèrent des cytokines qui stimulent la matrice extracellulaire et la prolifération des fibroblastes. Il en résulte une <b>fibrose interstitielle</b> et une atrophie tubulaire, <b>détectables dès 7 jours</b> lorsque le traitement est retardé <button class="w" data-k="n12-fibrose">(chronologie et conséquences)</button>. Cette étape détermine le déclin rénal à long terme ; c’est pourquoi la pratique des Hôpitaux universitaires de Genève réserve les corticoïdes aux biopsies où la fibrose reste inférieure ou égale à 75 %, et justifie la reconnaissance rapide.</p>
<p>Les inhibiteurs de points de contrôle immunitaire agissent autrement. Ils rompent la tolérance immunitaire ; la latence est de semaines à mois, et l’atteinte peut persister après l’arrêt. Une revue 2026 décrit l’activation de lymphocytes T CD8 résidents de mémoire et une cascade de l’interféron gamma <button class="w" data-k="n12-ipci">(détail)</button>. Ce mécanisme reste issu d’une revue hors Europe et ne modifie pas la conduite.</p>
<p>Les conséquences fonctionnelles découlent de l’atteinte des tubules plus que du glomérule. Une atteinte tubulaire peut précéder la hausse de la créatinine et provoquer une acidose métabolique hyperchlorémique, une hyperkaliémie, un défaut de concentration des urines et, lorsque le tubule proximal est touché, un syndrome de Fanconi <button class="w" data-k="n12-tubulaire">(chaîne causale)</button>. L’œdème de l’interstitium distend la capsule rénale, ce qui explique les douleurs lombaires.</p>
<div class="key"><b>À retenir.</b> Exposition → présentation d’antigène → activation lymphocytaire → infiltrat et cytokines → fibrose dès 7 jours. Chaque étape rend la suivante plus difficile à inverser : le temps est un facteur pronostique.</div>

</section>
<section class="ilot" id="n12-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2>
<p>Les <b>médicaments</b> sont la cause la plus fréquente. Le tableau regroupe les classes citées par la revue suisse, avec la part de chaque classe dans une série de 133 biopsies (1993–2011).</p>
<table class="t"><thead><tr><th>Classe</th><th>Exemples cités</th><th>Part dans la série de 133 biopsies</th></tr></thead><tbody><tr><td>Antibiotiques</td><td>Bêtalactamines (dont méticilline), ciprofloxacine, rifampicine, sulfamides, vancomycine, tétracycline, cotrimoxazole</td><td>49 %</td></tr><tr><td>Inhibiteurs de la pompe à protons</td><td>—</td><td>14 %</td></tr><tr><td>Anti-inflammatoires non stéroïdiens</td><td>—</td><td>11 %</td></tr><tr><td>Autres</td><td>Diurétiques, antiépileptiques, allopurinol, aciclovir, cocaïne, mésalazine, inhibiteurs de points de contrôle</td><td>le reste (médicaments au total : 70 %)</td></tr></tbody></table>
<p>Une série espagnole de 61 NIA médicamenteuses prouvées par biopsie donne un ordre comparable : antibiotiques 56 %, AINS 37 %. Les informations professionnelles suisses confirment que le risque existe : la néphrite tubulo-interstitielle figure parmi les effets du pantoprazole (fréquence inconnue) et la néphrite interstitielle est signalée comme rare pour la ciprofloxacine <button class="w" data-k="n12-medic">(sources et limites)</button>. Ces séries sont des données de fréquence : elles n’établissent pas qu’un médicament donné cause la maladie chez un patient donné.</p>
<p>Les <b>maladies systémiques</b> forment le deuxième groupe : sarcoïdose, syndrome de Sjögren, syndrome de néphrite tubulo-interstitielle avec uvéite (TINU), maladie à IgG4, vascularites à ANCA, lupus. L’infiltrat peut comporter ou non des granulomes. Il faut aussi y penser devant une NIA qui rechute pendant la diminution des corticoïdes (NIA cortico-dépendante) <button class="w" data-k="n12-systemique">(différentiel systémique)</button>.</p>
<p>Les <b>infections</b> peuvent agir de deux manières : par invasion directe du rein, comme dans la pyélonéphrite, ou par réaction immunitaire. La revue suisse cite de nombreux agents bactériens, viraux, parasitaires et le bacille tuberculeux ; les formes infectieuses sont presque toujours réversibles <button class="w" data-k="n12-infect">(liste des agents)</button>.</p>
<p>Parmi les facteurs de risque, l’âge avancé, la polymédication avec AINS et IPP, l’infection par le virus de l’immunodéficience humaine, la greffe rénale (polyomavirus BK) et le traitement par IPCI sont documentés. Enfin, la forme <b>chronique</b> comprend des néphropathies toxiques endémiques (néphropathie des Balkans, acide aristolochique), souvent asymptomatiques jusqu’au stade terminal <button class="w" data-k="n12-chronique">(forme chronique)</button>.</p>
<div class="trap"><span class="k">Piège</span> Un patient peut recevoir plusieurs médicaments potentiellement en cause. L’arrêt de tous les suspects dont l’arrêt est possible est la règle ; le nom du coupable se déduit ensuite de la chronologie et de la réexposition éventuelle, jamais d’une série de fréquence.</div>
