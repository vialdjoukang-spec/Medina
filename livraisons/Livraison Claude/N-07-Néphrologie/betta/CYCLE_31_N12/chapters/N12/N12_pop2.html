<template data-pop="n12-pyelo" data-title="Pyélonéphrite : définition SSI">
<div class="lab">Définition</div><p>Selon la directive de la Société suisse d’infectiologie, la pyélonéphrite (infection urinaire haute) se manifeste par des douleurs de la loge rénale, de la fièvre, des nausées et des vomissements, avec une pyurie de plus de 10 leucocytes/mm³ et une culture avec uropathogène à 10³ UFC/mL ou plus. La directive qualifie la pyélonéphrite de maladie systémique.</p>
<div class="lab">Application</div><p>L’antibiothérapie est immédiate, sans prescription différée. Les examens sont une bandelette, éventuellement un sédiment, une culture urinaire et deux paires d’hémocultures. Une infection est « non compliquée » en l’absence d’anomalie structurelle ou fonctionnelle, de sonde, de grossesse, de greffe rénale ou d’immunosuppression.</p>
<div class="lab">Limite</div><p>La directive concerne la femme adulte non enceinte. La version consultée est valable jusqu’au 15 décembre 2026 et s’appuie en partie sur des références américaines et européennes de 2011 et 2018.</p>
<p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/2981/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, directive sur l’infection des voies urinaires, version validée le 25 septembre 2025</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-eau" data-title="EAU 2026 : infection localisée ou systémique">
<div class="lab">Définition</div><p>L’Association européenne d’urologie 2026 définit la pyélonéphrite par fièvre supérieure à 38 °C, frissons, douleur du flanc, nausées, vomissements ou sensibilité costo-vertébrale, avec ou sans signes de cystite. Elle a abandonné l’opposition compliqué/non compliqué pour « infection localisée » versus « infection systémique ».</p>
<div class="lab">Application</div><p>Fièvre ou hypothermie, frissons, confusion, hypotension ou tachycardie orientent vers une infection systémique. Une culture avec antibiogramme est recommandée chez tous les patients (niveau fort).</p>
<div class="lab">Limite</div><p>La page a été lue par extraction partielle ; les niveaux de preuve de la section 3.7 n’ont pas été lus.</p>
<p class="src">Références : <a href="https://uroweb.org/guidelines/urological-infections/chapter/the-guideline" target="_blank" rel="noopener">Association européenne d’urologie, recommandations sur les infections urologiques 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-imagerie" data-title="Imagerie">
<div class="lab">Définition</div><p>Dans la NIA, l’échographie montre des reins augmentés de taille par l’œdème. La scintigraphie au gallium n’a pas de rôle établi. Dans la pyélonéphrite, l’échographie exclut obstruction et calcul.</p>
<div class="lab">Application</div><p>Le scanner injecté est réservé à la fièvre persistante à 72 heures ou à la détérioration. Chez la femme enceinte, on choisit l’échographie ou l’imagerie par résonance magnétique.</p>
<div class="lab">Limite</div><p>Les performances chiffrées des examens d’imagerie ne figurent pas dans les sources lues.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://uroweb.org/guidelines/urological-infections/chapter/the-guideline" target="_blank" rel="noopener">Association européenne d’urologie, recommandations sur les infections urologiques 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-cortico" data-title="Corticoïdes dans la NIA : preuves">
<div class="lab">Définition</div><p>Aucun essai randomisé n’a évalué les corticoïdes dans la NIA. Des études rétrospectives suggèrent une récupération plus rapide et moins d’insuffisance rénale chronique et de dialyse.</p>
<div class="lab">Application</div><p>Dans une série espagnole de 61 patients, les corticoïdes dans les deux semaines après l’arrêt du médicament sont associés à une meilleure récupération ; un retard moyen de 34 jours laisse une récupération incomplète. Praga et González proposent des corticoïdes précoces, dans les 7 jours après le diagnostic.</p>
<div class="lab">Limite</div><p>Études rétrospectives, non randomisées ; résumés seuls lus. Aucune dose standard n’est fixée par une recommandation suisse ou européenne lue.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a> ; <a href="https://doi.org/10.1038/ki.2010.89" target="_blank" rel="noopener">Praga et González, Kidney International 2010</a> ; <a href="https://doi.org/10.1093/ndt/gfu326" target="_blank" rel="noopener">Praga et collaborateurs, Nephrology Dialysis Transplantation 2015</a> ; <a href="https://doi.org/10.1038/sj.ki.5002776" target="_blank" rel="noopener">González et collaborateurs, Kidney International 2008</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-hug" data-title="Algorithme des Hôpitaux universitaires de Genève">
<div class="lab">Définition</div><p>L’algorithme genevois propose : arrêt de l’agent suspecté et surveillance de 3 à 5 jours ; biopsie en l’absence d’amélioration ou en cas d’aggravation ; si la NIA est prouvée avec évolution défavorable, corticothérapie d’au moins 3 semaines.</p>
<div class="lab">Application</div><p>La fibrose à la biopsie décide : supérieure à 75 %, traitement symptomatique ; inférieure ou égale à 75 %, corticoïdes. La biopsie est considérée si l’amélioration manque 5 à 7 jours après l’arrêt.</p>
<div class="lab">Limite</div><p>Pratique d’un centre universitaire, non consensuelle au niveau national.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-pyelo-ttt" data-title="Pyélonéphrite : traitement SSI">
<div class="lab">Définition</div><p>Patiente stable : ciprofloxacine 500 mg par voie orale toutes les 12 heures pendant 7 jours. Patiente instable ou prétraitée par quinolone : ceftriaxone 1 g/jour par voie intraveineuse ou gentamicine 5 mg/kg/jour par voie intraveineuse jusqu’à l’antibiogramme.</p>
<div class="lab">Application</div><p>Relais ciblé : triméthoprime-sulfaméthoxazole 160/800 mg toutes les 12 heures pendant 7 à 14 jours ; ciprofloxacine pendant 7 jours ; amoxicilline 1000 mg toutes les 12 heures (ou amoxicilline-acide clavulanique 875/125 mg) pendant 7 à 14 jours ; céfuroxime 500 mg toutes les 12 heures pendant 7 à 14 jours. On privilégie le spectre le plus étroit.</p>
<div class="lab">Limite</div><p>Femme adulte non enceinte seulement. 20 à 30 % des isolats suisses sont résistants au triméthoprime-sulfaméthoxazole.</p>
<p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/2981/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, directive sur l’infection des voies urinaires, version validée le 25 septembre 2025</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-euro" data-title="Repères européens (EAU 2026)">
<div class="lab">Définition</div><p>Par voie orale : ciprofloxacine 500 à 750 mg deux fois par jour (7 jours) ; lévofloxacine 500 mg une fois (standard) ou deux fois par jour (haute dose), 5 jours ; céfpodoxime 200 mg deux fois par jour (10 jours) ; ceftibuten 400 mg une fois par jour (10 jours) ; triméthoprime-sulfaméthoxazole 160/800 mg deux fois par jour (14 jours, réservé). Les quinolones sont utilisables si la résistance est inférieure à 10 %.</p>
<div class="lab">Application</div><p>Par voie parentérale en première ligne : ciprofloxacine 400 mg deux fois par jour, lévofloxacine 500 mg, céfotaxime 2 g trois fois par jour, ceftriaxone 2 g une fois par jour ; en deuxième ligne : céfépime, pipéracilline-tazobactam, gentamicine 6 à 7 mg/kg, amikacine 25 à 30 mg/kg. Les carbapénèmes sont réservés aux germes multirésistants. Nitrofurantoïne, fosfomycine orale et pivmécillinam sont déconseillés dans la pyélonéphrite (niveau fort).</p>
<div class="lab">Limite</div><p>Extraction partielle de la page ; ces schémas ne se substituent pas à la directive suisse pour la femme adulte non enceinte.</p>
<p class="src">Références : <a href="https://uroweb.org/guidelines/urological-infections/chapter/the-guideline" target="_blank" rel="noopener">Association européenne d’urologie, recommandations sur les infections urologiques 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-homme" data-title="Pyélonéphrite chez l’homme">
<div class="lab">Définition</div><p>L’homme est exclu de la directive suisse. L’Association européenne d’urologie recommande, pour une infection urinaire fébrile ou une pyélonéphrite chez l’homme, au moins 14 jours, de préférence par fluoroquinolone.</p>
<div class="lab">Application</div><p>L’information professionnelle de la ciprofloxacine indique 2 à 4 semaines pour la prostatite aiguë.</p>
<div class="lab">Limite</div><p>Les articles suisses spécifiques (Primary and Hospital Care 2021, mediX) n’ont pas pu être lus.</p>
<p class="src">Références : <a href="https://uroweb.org/guidelines/urological-infections/chapter/the-guideline" target="_blank" rel="noopener">Association européenne d’urologie, recommandations sur les infections urologiques 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-enfant" data-title="Infection urinaire de l’enfant : consensus suisse">
<div class="lab">Définition</div><p>Jusqu’à 30 jours : amoxicilline par voie intraveineuse et aminoside ; de 31 à 60 jours : amoxicilline intraveineuse et ceftriaxone ; au-delà de 60 jours : amoxicilline-acide clavulanique par voie orale ou céphalosporine de 3e génération (par voie intraveineuse si mauvais état). Durée de 7 à 10 jours ; relais oral après au moins 3 jours par voie intraveineuse.</p>
<div class="lab">Application</div><p>Échographie rénale et vésicale environ 6 semaines après une première infection ; cystographie mictionnelle réservée (malformations, dilatation, germe autre qu’Escherichia coli, absence de réponse à 48 heures, créatinine élevée, au moins 2 pyélonéphrites). Prophylaxie généralement non recommandée. Réévaluation à J3–5.</p>
<div class="lab">Limite</div><p>Consensus pédiatrique ; il ne s’applique pas à la NIA de l’adulte.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7886823/" target="_blank" rel="noopener">Recommandations suisses de consensus sur les infections urinaires de l’enfant, 2021</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-pronostic" data-title="Pronostic de la NIA">
<div class="lab">Définition</div><p>La récupération est observée chez environ 65 % des patients et l’insuffisance rénale chronique chez environ 35 %. Une atteinte de moins de 2 semaines a un meilleur pronostic.</p>
<div class="lab">Application</div><p>Dans la NIA médicamenteuse traitée par corticoïdes, à 6 mois après la biopsie : récupération complète 49 %, partielle 39 %, insuffisance rénale chronique 12 %. La dialyse est nécessaire dans 10 à 30 % des cas.</p>
<div class="lab">Limite</div><p>Séries rétrospectives ; la différence entre 35 % et 12 % reflète des populations et des traitements différents.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:166715" target="_blank" rel="noopener">Revue médicale suisse 2022, Dos Reis et collaborateurs, néphrite interstitielle aiguë (HUG)</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-prednisone" data-title="Prednisone : information professionnelle suisse">
<div class="lab">Définition</div><p>Dose initiale habituelle 5 à 60 mg/jour. Si le traitement dépasse 8 à 10 jours, ne pas l’arrêter brusquement, mais par paliers.</p>
<div class="lab">Application</div><p>Au-delà de 2 semaines, risque d’insuffisance surrénale pouvant durer jusqu’à un an. Seuil de Cushing : 7,5 mg/jour.</p>
<div class="lab">Limite</div><p>Streuli, mise à jour juin 2026 ; l’information professionnelle ne contient aucune indication spécifique de NIA ni de posologie dans cette indication.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Prednisone Streuli (Swissmedic, via AmiKo), juin 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-cipro" data-title="Ciprofloxacine : information professionnelle suisse">
<div class="lab">Définition</div><p>Pyélonéphrite simple : 2 × 500 mg, 7 jours ; compliquée : 2 × 500 à 750 mg, au moins 10 jours. Prostatite aiguë : 2 à 4 semaines.</p>
<div class="lab">Application</div><p>Adaptation rénale : clairance de 30 à 60 mL/min, maximum 1000 mg/jour ; moins de 30 mL/min, maximum 500 mg/jour. Effets à surveiller : tendinites et ruptures, effets neurologiques, anévrisme ou dissection aortique, régurgitations valvulaires. Néphrite interstitielle : effet rare.</p>
<div class="lab">Limite</div><p>Zentiva, mise à jour août 2025. Chez l’enfant dès 1 an, seulement en 3e choix avec infectiologue.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Ciprofloxacin Zentiva (Swissmedic, via AmiKo), août 2025</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-ceftri" data-title="Ceftriaxone : information professionnelle suisse">
<div class="lab">Définition</div><p>Adulte : 1 à 2 g/jour, jusqu’à 4 g.</p>
<div class="lab">Application</div><p>Aucune adaptation rénale, sauf si la clairance de la créatinine est inférieure à 10 mL/min (maximum 2 g/jour). Une section de l’information professionnelle traite des précipités calcium-ceftriaxone.</p>
<div class="lab">Limite</div><p>Labatec, mise à jour juin 2025 ; le contenu de la mise en garde sur les précipités n’a pas été détaillé dans le dossier.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Ceftriaxon Labatec (Swissmedic, via AmiKo), juin 2025</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-pantopra" data-title="Pantoprazole : information professionnelle suisse">
<div class="lab">Définition</div><p>La néphrite tubulo-interstitielle figure parmi les effets indésirables du pantoprazole, de fréquence inconnue.</p>
<div class="lab">Application</div><p>Un patient sous inhibiteur de la pompe à protons avec insuffisance rénale aiguë inexpliquée doit voir ce médicament inclus dans la liste des suspects.</p>
<div class="lab">Limite</div><p>Takeda, mise à jour septembre 2026 ; la fréquence est inconnue, l’imputabilité dans un cas individuel reste à établir.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Pantoprazol Nycomed (Swissmedic, via AmiKo), septembre 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-biomarqueurs" data-title="Biomarqueurs urinaires">
<div class="lab">Définition</div><p>Des biomarqueurs urinaires (CXCL9, facteur de nécrose tumorale alpha, interleukine 9) sont proposés pour diagnostiquer la NIA sans biopsie.</p>
<div class="lab">Application</div><p>Ils sont prometteurs mais non validés ; ils ne remplacent pas la biopsie en pratique.</p>
<div class="lab">Limite</div><p>Résumés seuls lus ; auteurs américains ; utilisés pour décrire l’état de la recherche, pas pour guider une conduite.</p>
<p class="src">Références : <a href="https://doi.org/10.1097/MNH.0000000000001147" target="_blank" rel="noopener">Sadarangani et collaborateurs, 2026, biomarqueurs</a> ; <a href="https://doi.org/10.1681/ASN.0000001232" target="_blank" rel="noopener">Conférence de consensus ADQI 34, 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-grossesse" data-title="Grossesse">
<div class="lab">Définition</div><p>Un dépistage unique de la bactériurie asymptomatique est proposé au début du deuxième trimestre. L’imagerie d’une pyélonéphrite se fait par échographie ou imagerie par résonance magnétique.</p>
<div class="lab">Application</div><p>La grossesse exclut la directive suisse de pyélonéphrite : l’antibiothérapie est à décider avec un spécialiste.</p>
<div class="lab">Limite</div><p>Aucune recommandation suisse de traitement de la pyélonéphrite gravidique n’a été lue.</p>
<p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/2981/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, directive sur l’infection des voies urinaires, version validée le 25 septembre 2025</a> ; <a href="https://uroweb.org/guidelines/urological-infections/chapter/the-guideline" target="_blank" rel="noopener">Association européenne d’urologie, recommandations sur les infections urologiques 2026</a>, consultés le 14 octobre 2026.</p></template>
<template data-pop="n12-mnemo" data-title="Aide mnémotechnique">
<div class="lab">Définition</div><p>Quatre verbes ordonnent la conduite : écarter l’infection, arrêter le suspect, biopsier si besoin, traiter selon la biopsie.</p>
<div class="lab">Application</div><p>Cette suite correspond à la chronologie des décisions de ce cours : bandelette et culture, éviction du médicament, biopsie à 5 à 7 jours, puis corticoïdes selon la fibrose.</p>
<div class="lab">Limite</div><p>Aide pédagogique, non critère officiel.</p>
</template>
<template data-pop="pareto-n12-definition" data-title="Pareto — Définition et périmètre">
<p class="ratio" data-cover="n12-0,n12-1,n12-2"></p><ul><li>N12 est un code d’attente : il décrit une néphrite tubulo-interstitielle non précisée comme aiguë ou chronique, pyélonéphrite comprise.</li><li>La NIA est médicamenteuse dans 70 à 75 % des cas.</li><li>Les stades de l’<button class="w" data-k="n12-ira">IRA</button> suivent KDIGO 2012.</li></ul></template>
<template data-pop="pareto-n12-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="n12-3,n12-4"></p><ul><li>Hypersensibilité retardée en trois phases ; la fibrose est détectable dès 7 jours.</li><li>L’atteinte tubulaire peut précéder la hausse de créatinine.</li><li>NIA = 1 à 10 % des biopsies.</li></ul></template>
<template data-pop="pareto-n12-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="n12-5"></p><ul><li>Antibiotiques 49 %, IPP 14 %, AINS 11 % dans la série de 133 biopsies.</li><li>Maladies systémiques et infections sont les autres causes.</li><li>Dresser la liste exhaustive des médicaments.</li></ul></template>
<template data-pop="pareto-n12-clinique" data-title="Pareto — Anamnèse, examen et diagnostic">
<p class="ratio" data-cover="n12-6,n12-7,n12-8"></p><ul><li>Délai moyen de 7 à 10 jours ; la triade est complète dans 10 à 20 % seulement.</li><li>Leucocyturie stérile et cylindres leucocytaires orientent vers la NIA.</li><li>La biopsie est la référence, envisagée à 5 à 7 jours.</li></ul></template>
<template data-pop="pareto-n12-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="n12-10,n12-11,n12-12"></p><ul><li>Éviction du médicament, puis corticoïdes selon biopsie et délai.</li><li>Pyélonéphrite : ciprofloxacine 500 mg × 2 pendant 7 jours si la patiente est stable.</li><li>Réévaluation à 3 mois après toute IRA.</li></ul></template>
<template data-pop="pareto-n12-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="n12-e-1,n12-e-2,n12-e-3,n12-e-4,n12-e-5"></p><ul><li>Gold standard : biopsie rénale.</li><li>Éosinophilurie : sensibilité 67 %, spécificité 85 %.</li><li>Culture : seuil adulte différent du seuil pédiatrique.</li></ul></template>
<template data-pop="pareto-n12-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="n12-p-1,n12-p-2,n12-p-3,n12-p-4"></p><ul><li>Pas de médicament curateur : éviction du suspect.</li><li>Quinolones : adapter à la clairance.</li><li>Corticoïdes : aucune dose standard, ne jamais arrêter brusquement après plus de 8 à 10 jours.</li></ul></template>
