<template data-pop="j95-cppo" data-title="Complications pulmonaires postopératoires"><p class="lab">Définition</p><p>La revue suisse de Younossian retient la définition de Pedersen : toute anomalie pulmonaire postopératoire qui produit une maladie ou une dysfonction identifiable, cliniquement significative, exigeant une intervention médicale et modifiant défavorablement l’évolution. Atélectasie, infection, insuffisance respiratoire, ventilation mécanique prolongée, exacerbation d’une pneumopathie sous-jacente et bronchospasme en font partie.</p><p class="lab">Pourquoi des définitions standardisées</p><p>L’incidence publiée varie de 2 à 70 % selon les définitions et les populations. Les définitions EPCO (2015), puis l’initiative de standardisation des critères de jugement périopératoires (Abbott, 2018), ont proposé des critères précis et une gradation de gravité.</p><div class="key"><b>Conséquence pratique.</b> Le clinicien ne se contente pas du terme générique : il nomme la complication, car son traitement en dépend.</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25058504/" target="_blank" rel="noopener">Jammer et al., 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29661384/" target="_blank" rel="noopener">Abbott et al., Br J Anaesth 2018</a>.</p></template>
<template data-pop="j95-epco" data-title="Définitions européennes EPCO"><p class="lab">Origine</p><p>Un groupe de travail commun de la Société européenne d’anesthésiologie et de l’ESICM a défini en 2015 22 événements indésirables périopératoires, chacun avec une gradation de gravité.</p><p class="lab">Définitions respiratoires</p><table class="t"><tr><th>Complication</th><th>Critère</th></tr><tr><td>Infection respiratoire</td><td>Antibiotique pour suspicion d’infection, avec expectoration nouvelle, opacité nouvelle, fièvre ou leucocytes &gt; 12 × 10⁹/L</td></tr><tr><td>Insuffisance respiratoire</td><td>PaO₂ &lt; 8 kPa à l’air, PaO₂/FiO₂ &lt; 40 kPa ou SpO₂ &lt; 90 % nécessitant de l’oxygène</td></tr><tr><td>Atélectasie</td><td>Opacité attirant médiastin, hile ou coupole, avec surdistension compensatrice</td></tr><tr><td>Bronchospasme</td><td>Sibilants expiratoires nouveaux traités par bronchodilatateurs</td></tr><tr><td>Pneumopathie d’inhalation</td><td>Lésion pulmonaire aiguë après inhalation de contenu gastrique régurgité</td></tr></table><p>La pneumonie exige une image, un signe général (fièvre, leucocytes anormaux ou confusion après 70 ans) et deux signes respiratoires.</p><div class="key"><b>Conséquence pratique.</b> Ces critères tranchent entre atélectasie et pneumonie, deux complications que l’on confond souvent.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25058504/" target="_blank" rel="noopener">Jammer et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11704732/" target="_blank" rel="noopener">Lee et al., 2025, tableau 1</a>.</p></template>
<template data-pop="j95-ariscat" data-title="Score ARISCAT"><p class="lab">Construction</p><p>Canet a suivi 2464 opérés tirés au sort dans 59 hôpitaux de Catalogne. Sept facteurs indépendants prédisaient les complications pulmonaires : SpO₂ préopératoire basse, infection respiratoire du mois précédent, âge, anémie, chirurgie abdominale haute ou intrathoracique, durée d’au moins deux heures et urgence. L’aire sous la courbe atteignait 88 % dans l’échantillon de validation.</p><p class="lab">Interprétation</p><p>Moins de 26 points : risque bas (1,6 %) ; 26 à 44 : intermédiaire (13,3 %) ; 45 ou plus : élevé (42,1 %). Les essais européens de ventilation, dont celui de Hemmes, ont recruté sur ce score.</p><div class="key"><b>Limite.</b> Le score ne contient ni le tabagisme, ni la BPCO, ni le syndrome d’apnées obstructives du sommeil : l’anamnèse le complète.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21045639/" target="_blank" rel="noopener">Canet et al., 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11704732/" target="_blank" rel="noopener">Lee et al., 2025, tableau 3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6682759/" target="_blank" rel="noopener">Hemmes et al., 2014</a>.</p></template>
<template data-pop="j95-mecanismes" data-title="Les trois mécanismes de l’atélectasie"><p class="lab">Compression</p><p>La perte du tonus diaphragmatique, le poids du médiastin, l’obésité ou un pneumopéritoine augmentent la pression pleurale des régions déclives ; la pression transpulmonaire y devient négative et les alvéoles se ferment.</p><p class="lab">Résorption</p><p>Derrière une voie aérienne fermée ou très peu ventilée, le gaz alvéolaire passe dans le sang. L’oxygène, plus vite absorbé que l’azote, vide l’alvéole : une FiO₂ élevée accélère le phénomène.</p><p class="lab">Obstruction</p><p>Un bouchon muqueux ou des sécrétions retenues obstruent une bronche ; les anesthésiques et le tube endotrachéal ralentissent le transport mucociliaire.</p><div class="key"><b>Conséquence pratique.</b> La compression appelle la position et la pression positive, la résorption une FiO₂ modérée, l’obstruction la toux, la kinésithérapie ou la bronchoscopie.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9869183/" target="_blank" rel="noopener">Zeng et al., 2022</a>.</p></template>
<template data-pop="j95-shunt" data-title="Shunt et bas rapport ventilation-perfusion"><p class="lab">Définitions</p><p>Le shunt intrapulmonaire désigne le sang qui traverse des alvéoles non ventilées ; le bas rapport ventilation-perfusion désigne des alvéoles ventilées, mais insuffisamment pour leur perfusion.</p><p class="lab">Données</p><p>Chez 80 patients anesthésiés, le rapport PaO₂/FiO₂ médian passait de 441 à 368 mmHg. Le shunt dépendait de l’atélectasie et croissait avec l’indice de masse corporelle ; le bas rapport, lié à la fermeture des voies aériennes, croissait avec l’âge.</p><div class="key"><b>Conséquence pratique.</b> Le recrutement alvéolaire corrige rapidement le trouble des échanges dû à l’atélectasie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31045901/" target="_blank" rel="noopener">Hedenstierna et al., 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9869183/" target="_blank" rel="noopener">Zeng et al., 2022</a>.</p></template>
<template data-pop="j95-vph" data-title="Vasoconstriction pulmonaire hypoxique"><p class="lab">Mécanisme</p><p>L’hypoxie alvéolaire est détectée au niveau alvéolo-capillaire ; le signal remonte vers les artérioles, dont les cellules musculaires lisses se contractent. Le sang est détourné vers les régions ventilées : chez l’homme sain, 47 % du débit d’un lobe hypoxique en cinq minutes.</p><p class="lab">Ce qui l’affaiblit</p><p>Pneumonie, SDRA, sepsis, endotoxémie, inhibiteurs calciques et anesthésiques volatils au-delà d’une concentration alvéolaire minimale. Le propofol, la kétamine et le fentanyl l’altèrent peu ou pas.</p><div class="key"><b>Conséquence pratique.</b> Une atélectasie modeste peut devenir très hypoxémiante chez un patient septique ou atteint de pneumonie, dont le réflexe est émoussé.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9869183/" target="_blank" rel="noopener">Zeng et al., 2022</a>.</p></template>
<template data-pop="j95-curarisation" data-title="Curarisation résiduelle"><p class="lab">Définition</p><p>Persistance d’un bloc neuromusculaire après la fin de l’anesthésie. Elle affaiblit les muscles respiratoires et contribue à l’atélectasie et à l’hypoxémie postopératoires.</p><p class="lab">Données européennes</p><p>Dans l’étude prospective de Kirmeier (22 803 patients, 28 pays européens), l’usage de curares était associé aux complications pulmonaires (rapport de cotes ajusté 1,86). Ni la surveillance, ni l’antagonisation, ni le choix du sugammadex, telles qu’elles étaient pratiquées, n’étaient associés à une réduction du risque.</p><div class="key"><b>Conséquence pratique.</b> L’ESAIC recommande une surveillance quantitative et une décurarisation jusqu’à un rapport du train-de-quatre supérieur à 0,9 : c’est la qualité de la décurarisation, non le choix de la molécule, qui protège.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30224322/" target="_blank" rel="noopener">Kirmeier et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36377554/" target="_blank" rel="noopener">Fuchs-Buder et al., 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></template>
<template data-pop="j95-tabac" data-title="Arrêt du tabac avant une intervention"><p class="lab">Données</p><p>Dans une étude citée par la revue suisse, l’arrêt au moins huit semaines avant l’intervention ramenait les complications pulmonaires de 33 % à 14,5 %. Une autre étude n’a pas confirmé l’importance de ce délai, mais retrouvait moins de pneumonies chez les non-fumeurs (3 % contre 11 %).</p><p class="lab">Ce que fait le médecin</p><p>Il dépiste le tabagisme et fait de l’intervention une occasion d’arrêt, quel que soit le délai disponible.</p><div class="key"><b>Limite.</b> Le délai optimal reste discuté ; l’arrêt n’est jamais un motif de repousser une intervention urgente.</div><p class="src">Référence : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a>.</p></template>
<template data-pop="j95-bilan-preop" data-title="Examens préopératoires du poumon"><p class="lab">Spirométrie</p><p>Son utilité de routine n’est pas démontrée hors résection pulmonaire. Elle reste indiquée devant une dyspnée inexpliquée et pour optimiser une BPCO ou un asthme ; isolée, une valeur anormale ne contre-indique pas une chirurgie.</p><p class="lab">Gazométrie et radiographie</p><p>Les gaz du sang ne prédisent pas mieux que la clinique ; une PaO₂ inférieure à 9,33 kPa était un facteur de risque dans une seule étude rétrospective. La radiographie est recommandée avant une chirurgie abdominale, thoracique ou aortique après 50 ans ou en cas de maladie cardiovasculaire.</p><div class="key"><b>Conséquence pratique.</b> Un examen ne se demande que s’il peut modifier la technique ou l’estimation du risque.</div><p class="src">Référence : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a>.</p></template>
<template data-pop="j95-mendelson" data-title="Syndrome de Mendelson"><p class="lab">Définition</p><p>Pneumopathie chimique par inhalation de contenu gastrique au cours d’une anesthésie. Les définitions EPCO la décrivent comme une lésion pulmonaire aiguë après inhalation de contenu gastrique régurgité.</p><p class="lab">Classement</p><p>La classification range ce syndrome parmi les affections respiratoires après des actes médicaux ; survenu pendant la grossesse, l’accouchement ou le post-partum, il est classé avec les complications obstétricales.</p><div class="key"><b>Renvoi.</b> La physiopathologie, le diagnostic et le traitement des pneumopathies d’inhalation sont exposés dans le cours J69 — Pneumopathies d’inhalation et atteintes respiratoires toxiques.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11704732/" target="_blank" rel="noopener">Lee et al., 2025, tableau 1</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j95-j99.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a>.</p></template>
<template data-pop="j95-pnx-iatrogene" data-title="Pneumothorax après un geste"><p class="lab">Définition</p><p>Présence d’air dans la plèvre, sans trame vasculaire au-delà de la plèvre viscérale, survenue après un geste diagnostique ou thérapeutique. Les définitions EPCO l’incluent parmi les complications pulmonaires postopératoires.</p><div class="key"><b>Renvoi.</b> Les gestes en cause, la conduite et le drainage sont exposés dans le cours J93 — Pneumothorax.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11704732/" target="_blank" rel="noopener">Lee et al., 2025, tableau 1</a>.</p></template>
<template data-pop="j95-fistule-bp" data-title="Fistule bronchopleurale et fuite aérienne après résection"><p class="lab">Données de l’ESTS</p><p>Dans la base de données européenne de chirurgie thoracique, la fistule bronchopleurale compliquait 0,4 à 0,5 % des lobectomies et 1,4 à 1,8 % des pneumonectomies ; une fuite aérienne prolongée de plus de cinq jours survenait après 9 à 10 % des lobectomies.</p><p class="lab">Après chirurgie trachéale</p><p>Dans la série zurichoise de 37 résections trachéales ou cricotrachéales, aucune déhiscence ni fistule de la suture n’est survenue.</p><div class="key"><b>Conséquence pratique.</b> Après une pneumonectomie, la fistule bronchopleurale reste rare, mais elle est environ trois fois plus fréquente qu’après une lobectomie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7825477/" target="_blank" rel="noopener">Brunelli et al., Eur J Cardiothorac Surg 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33378546/" target="_blank" rel="noopener">Ferreirinha et al., 2020</a>.</p></template>
<template data-pop="j95-radio-atelectasie" data-title="Radiographie de l’atélectasie"><p class="lab">Signes</p><p>Opacité systématisée à un segment ou à un lobe, déplacement du médiastin ou de la coupole vers elle, et surdistension compensatrice du poumon aéré. À la TDM s’y ajoutent le déplacement des scissures, le pincement des espaces intercostaux et le déplacement du hile.</p><p class="lab">Angles morts</p><p>Sur une radiographie de face, les opacités postérieures basales et rétrocardiaques peuvent passer inaperçues.</p><div class="key"><b>Conséquence pratique.</b> Une radiographie normale n’exclut pas une atélectasie postérieure ; l’échographie ou la TDM la recherchent si l’hypoxémie persiste.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></template>
<template data-pop="j95-echo-pulm" data-title="Échographie pulmonaire"><p class="lab">Principe</p><p>L’air réfléchit les ultrasons ; un poumon désaéré devient échogène et prend un aspect tissulaire, comparable à celui du foie.</p><p class="lab">Valeur</p><p>L’échographie diagnostique l’atélectasie avec une grande exactitude et distingue une condensation d’un épanchement mieux que l’auscultation ou la radiographie au lit. Un bronchogramme aérique dynamique, synchrone de la ventilation, a une valeur prédictive positive de 86 à 97 % pour la pneumonie, mais une sensibilité de 61 %.</p><div class="key"><b>Limite.</b> L’absence de bronchogramme dynamique n’exclut pas une pneumonie : la clinique et la biologie complètent l’image.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></template>
<template data-pop="j95-courbe-dv" data-title="Courbe débit-volume de la sténose"><p class="lab">Ce que l’on voit</p><p>Une sténose fixe des voies aériennes centrales limite le débit maximal dans les deux sens : la branche inspiratoire et la branche expiratoire s’aplatissent.</p><p class="lab">Données suisses</p><p>Chez les 22 patients de Kather, le VEMS moyen valait 92,5 % de la valeur prédite avant traitement. Après la plastie endoscopique, les valeurs ont peu changé, mais la courbe a retrouvé sa forme normale et les plateaux ont disparu.</p><div class="key"><b>Conséquence pratique.</b> Devant un stridor, le médecin regarde la forme de la courbe, non le seul VEMS.</div><p class="src">Référence : <a href="https://smw.ch/index.php/smw/article/view/3363" target="_blank" rel="noopener">Kather et al., 2024</a>.</p></template>
<template data-pop="j95-myer-cotton" data-title="Grader une sténose laryngotrachéale"><p class="lab">Classification de Myer et Cotton</p><p>Elle compare le diamètre de la sonde qui franchit la sténose au diamètre attendu : grade I, obstruction jusqu’à 50 % ; II, 51 à 70 % ; III, plus de 70 % avec une lumière ; IV, aucune lumière.</p><p class="lab">Score de la Société européenne de laryngologie</p><p>Le consensus de 2015 propose une évaluation endoscopique en cinq étapes. Il combine le grade, le nombre d’étages atteints et l’état général du patient, et distingue la sténose fraîche de la sténose mature. Chez 166 adultes opérés, un score égal ou supérieur à IIIb prédisait l’échec de la décanulation et un taux de complications de 57,7 %, contre 32,8 % au-dessous.</p><div class="key"><b>Conséquence pratique.</b> Le grade et l’extension conditionnent le choix entre endoscopie et résection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/8154776/" target="_blank" rel="noopener">Myer et al., 1994</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25951790/" target="_blank" rel="noopener">Monnier et al., 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31508817/" target="_blank" rel="noopener">Fiz et al., 2020</a>.</p></template>
<template data-pop="j95-ira-postop" data-title="Insuffisance respiratoire aiguë postopératoire"><p class="lab">Définition opérationnelle</p><p>Dans l’essai de Jaber, mené dans 20 réanimations françaises : dans les sept jours suivant une chirurgie abdominale, PaO₂ &lt; 60 mmHg ou SpO₂ ≤ 90 % à l’air, ou PaO₂ &lt; 80 mmHg sous 15 L/min d’oxygène, avec une fréquence respiratoire &gt; 30 par minute ou des signes de travail respiratoire intense.</p><p class="lab">Résultats</p><p>Chez 293 patients, la VNI (aide inspiratoire 5 à 15 cm H₂O, PEEP 5 à 10 cm H₂O) a réduit les réintubations à sept jours de 45,5 % à 33,1 % et les infections associées aux soins de 49,2 % à 31,4 %. La mortalité à 90 jours (14,9 % contre 21,5 %) ne différait pas significativement.</p><div class="key"><b>Conséquence pratique.</b> L’opéré hypoxémique reçoit une pression positive tôt, dans un lieu où l’intubation reste possible.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26975890/" target="_blank" rel="noopener">Jaber et al., 2016</a>.</p></template>
<template data-pop="j95-contentieux-vni" data-title="Contentieux : VNI, CPAP ou haut débit après chirurgie"><p class="lab">Les textes en présence</p><p><b>Société européenne d’anesthésiologie et ESICM, 2020.</b> Chez l’opéré hypoxémique, VNI ou CPAP plutôt qu’oxygène conventionnel (1B) ; VNI ou CPAP dès l’extubation chez l’hypoxémique à risque après chirurgie abdominale. <b>SFAR et SRLF, 2019.</b> VNI pour traiter l’insuffisance respiratoire postopératoire, surtout après chirurgie abdominale ou résection pulmonaire ; haut débit nasal préventif après chirurgie cardiothoracique. <b>ERS, 2022.</b> Haut débit nasal ou oxygène conventionnel chez l’opéré à bas risque ; haut débit nasal ou VNI chez l’opéré à haut risque.</p><p class="lab">Arbitrage</p><p>La source primaire applicable la plus récente, l’ERS 2022, admet le haut débit nasal comme alternative à la VNI chez l’opéré à haut risque. Pour l’opéré déjà hypoxémique après chirurgie abdominale, aucun texte plus récent ne remet en cause la VNI ou la CPAP, appuyées par l’essai de Jaber : elles restent le premier choix.</p><div class="key"><b>Conséquence pratique.</b> Hypoxémie installée après laparotomie : VNI ou CPAP. Prévention chez l’opéré à haut risque : haut débit nasal ou VNI selon la tolérance et l’expertise locale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32132408/" target="_blank" rel="noopener">Leone et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6342741/" target="_blank" rel="noopener">Quintard et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34649974/" target="_blank" rel="noopener">Oczkowski et al., ERS, Eur Respir J 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26975890/" target="_blank" rel="noopener">Jaber et al., 2016</a>.</p></template>
<template data-pop="j95-ventilation-protectrice" data-title="Ventilation protectrice peropératoire"><p class="lab">Recommandations</p><p>Le consensus international de 2019 recommande un score dédié pour estimer le risque, un volume courant initial de 6 à 8 mL/kg de poids prédit et une PEEP de 5 cm H₂O, à individualiser ensuite. Une manœuvre de recrutement utilise la pression efficace la plus basse, pendant le temps le plus court.</p><p class="lab">Pourquoi pas plus</p><p>Les grands volumes courants empêchent l’atélectasie mais augmentent les complications ; une PEEP de 12 cm H₂O n’a pas fait mieux qu’une PEEP basse et a causé davantage d’hypotensions. Une pression motrice de 15 cm H₂O ou plus est associée aux complications.</p><div class="key"><b>Conséquence pratique.</b> Volume modéré, PEEP modérée, pas de PEEP nulle, recrutement réservé à une dysfonction évocatrice d’atélectasie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31587835/" target="_blank" rel="noopener">Young et al., 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></template>
<template data-pop="j95-peep-elevee" data-title="PEEP élevée et recrutement : les essais"><p class="lab">Chirurgie abdominale ouverte</p><p>Hemmes a randomisé 900 patients à risque : PEEP 12 cm H₂O avec recrutements ou PEEP ≤ 2 cm H₂O. Les complications pulmonaires sont survenues chez 40 % et 39 % (risque relatif 1,01) ; le groupe PEEP élevée a eu plus d’hypotensions et de vasopresseurs.</p><p class="lab">Patients obèses</p><p>Bluth a randomisé 2013 adultes d’indice de masse corporelle ≥ 35 : PEEP 12 avec recrutements contre PEEP 4. Les complications sont survenues chez 21,3 % et 23,6 %, différence non significative ; l’hypoxémie peropératoire était moins fréquente (5,0 % contre 13,6 %).</p><div class="key"><b>Conséquence pratique.</b> Améliorer l’oxygénation peropératoire ne suffit pas à prévenir les complications ; la PEEP élevée se réserve aux situations de collapsus marqué.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6682759/" target="_blank" rel="noopener">Hemmes et al., 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6582260/" target="_blank" rel="noopener">Bluth et al., 2019</a>.</p></template>
<template data-pop="j95-cpap-prophylactique" data-title="CPAP préventive après chirurgie"><p class="lab">Essai de 4806 patients</p><p>Des patients de 50 ans ou plus, après chirurgie abdominale ouverte programmée, ont reçu une CPAP dans les quatre heures ou les soins usuels. Pneumonie, réintubation ou décès à trente jours sont survenus chez 8,1 % et 8,2 %. Les auteurs ne recommandent pas la CPAP préventive systématique.</p><p class="lab">Ventilation individualisée</p><p>Dans un essai espagnol de 967 patients, une ventilation peropératoire individualisée suivie de CPAP n’a pas réduit les complications pulmonaires et systémiques par rapport à la ventilation protectrice standard.</p><div class="key"><b>Conséquence pratique.</b> La pression positive traite l’opéré hypoxémique ; elle n’est pas prescrite à tous à titre préventif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34153272/" target="_blank" rel="noopener">Groupe de l’essai de CPAP postopératoire, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29371130/" target="_blank" rel="noopener">Ferrando et al., Lancet Respir Med 2018</a>.</p></template>
<template data-pop="j95-kine" data-title="Kinésithérapie et expansion pulmonaire"><p class="lab">Avant l’intervention</p><p>Un entraînement des muscles inspiratoires d’au moins deux semaines a réduit les complications chez 279 patients à haut risque avant pontage aortocoronarien. Une séance unique de 30 minutes avant chirurgie abdominale haute les a réduites dans un essai.</p><p class="lab">Après l’intervention</p><p>Spirométrie incitative, respiration profonde, pression positive et mobilisation précoce rouvrent les bases ; la qualité des preuves pour la spirométrie incitative reste faible. La CPAP aide le patient incapable d’effectuer les exercices. L’ERS et l’ESICM retiennent l’atélectasie et l’encombrement parmi les cibles de la kinésithérapie, avec des preuves surtout de niveau C et D.</p><div class="key"><b>Conséquence pratique.</b> Expliquer les exercices avant l’intervention et soulager la douleur rend la kinésithérapie possible après.</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18283429/" target="_blank" rel="noopener">Gosselink et al., ERS et ESICM, Intensive Care Med 2008</a>.</p></template>
<template data-pop="j95-bronchoscopie" data-title="Bronchoscopie de l’atélectasie obstructive"><p class="lab">Indication</p><p>Chez le patient intubé, une atélectasie lobaire ou segmentaire par obstruction relève de la fibroscopie bronchique : elle confirme le diagnostic, aspire le bouchon et restaure l’aération.</p><p class="lab">Ce qu’elle cherche aussi</p><p>La TDM identifie un obstacle bronchique ou un épanchement compressif, c’est-à-dire la cause de l’atélectasie.</p><div class="key"><b>Conséquence pratique.</b> L’aspiration trachéale se fait à la demande, car l’aspiration systématique dérecrute le poumon et aggrave l’hypoxémie.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></template>
<template data-pop="j95-oedeme-larynge" data-title="Œdème laryngé après extubation"><p class="lab">Prévenir</p><p>La SFAR et la SRLF recommandent un test de fuite avant l’extubation chez tout patient de réanimation présentant un facteur de risque de stridor (1+). Si la fuite est faible ou nulle, un corticoïde débuté au moins six heures avant l’extubation est probablement indiqué.</p><p class="lab">L’essai de référence</p><p>Chez 761 adultes ventilés plus de 36 heures, 20 mg de méthylprednisolone 12 heures avant l’extubation puis toutes les 4 heures ont réduit l’œdème laryngé de 22 % à 3 % et les réintubations de 8 % à 4 %.</p><div class="key"><b>Conséquence pratique.</b> Le test de fuite précède l’extubation programmée d’un patient à risque ; le corticoïde exige d’anticiper l’extubation de plusieurs heures.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6342741/" target="_blank" rel="noopener">Quintard et al., 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17398307/" target="_blank" rel="noopener">François et al., 2007</a>.</p></template>
<template data-pop="j95-tracheotomie" data-title="Trachéotomie en réanimation"><p class="lab">Indications</p><p>Sevrage prolongé, au-delà de sept jours après la première épreuve de ventilation spontanée, et atteinte neuromusculaire acquise réversible. Dans l’insuffisance respiratoire chronique, la décision est multidisciplinaire et partagée avec le patient.</p><p class="lab">Technique et contre-indications</p><p>La technique percutanée est préférée lorsqu’elle est possible ; la fibroscopie réduit les complications précoces et l’échographie Doppler réduit le risque de ponction vasculaire. Instabilité hémodynamique et troubles de la coagulation non corrigés (plaquettes &lt; 50 000/mm³, rapport international normalisé &gt; 1,5) la contre-indiquent. L’antibioprophylaxie n’est pas recommandée.</p><div class="key"><b>Limite.</b> Une trachéotomie précoce, avant le quatrième jour, ne réduit ni la mortalité, ni les pneumonies, ni la durée de ventilation.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5854567/" target="_blank" rel="noopener">Trouillet et al., 2018</a>.</p></template>
<template data-pop="j95-soins-canule" data-title="Soins de la canule de trachéotomie"><p class="lab">Ballonnet et sécrétions</p><p>La pression du ballonnet ne dépasse pas 30 cm H₂O et se contrôle toutes les huit heures ; trop basse, elle laisse passer les sécrétions oropharyngées. Une canule avec aspiration sous-glottique évacue les sécrétions retenues.</p><p class="lab">Humidification et changement</p><p>L’absence d’humidification peut obstruer la canule. Le changement de canule se décide sur la clinique (infection, saignement, réduction de calibre) ; un changement précoce expose au déplacement.</p><p class="lab">Sevrage</p><p>Un protocole de sevrage et le dégonflage du ballonnet dès la déconnexion du ventilateur ont réduit les échecs de décanulation dans un essai de 195 patients.</p><div class="key"><b>Conséquence pratique.</b> Mesurer la pression du ballonnet est un geste de prévention de la sténose, à inscrire dans les soins de chaque équipe.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5854567/" target="_blank" rel="noopener">Trouillet et al., 2018</a>.</p></template>
<template data-pop="j95-urgence-tracheo" data-title="Urgence chez un patient trachéotomisé"><p class="lab">Deux mécanismes</p><p>Les complications graves, qui touchent environ 1 % des trachéotomisés, relèvent de l’obstruction (mucus, sang, corps étranger) ou du déplacement de la canule.</p><p class="lab">Séquence du projet britannique de sécurité des trachéotomies</p><p>Appeler à l’aide ; appliquer de l’oxygène à haut débit sur le visage et sur l’orifice ; retirer la valve de phonation et la canule interne ; passer une sonde d’aspiration. Si elle ne passe pas ou si la ventilation reste impossible : dégonfler le ballonnet, évaluer par endoscopie si la situation le permet, puis retirer la canule, et réévaluer en oxygénant par la bouche ou par l’orifice.</p><div class="key"><b>Conséquence pratique.</b> Une sonde d’aspiration qui passe n’exclut pas une obstruction partielle ; l’algorithme demande de poursuivre l’évaluation.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22731935/" target="_blank" rel="noopener">McGrath et al., 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8103083/" target="_blank" rel="noopener">McGrath, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12620918/" target="_blank" rel="noopener">Wragg et al., 2025</a>.</p></template>
<template data-pop="j95-hemorragie-tracheo" data-title="Saignement par l’orifice de trachéotomie"><p class="lab">Formes</p><p>Le saignement mineur de l’orifice est la complication la plus fréquente. Plus tard, une canule peut éroder le tronc veineux ou le tronc artériel brachiocéphalique : complication rare mais menaçant la vie.</p><p class="lab">Prévention</p><p>Une échographie Doppler avant la trachéotomie percutanée réduit le risque de ponction vasculaire ; un trouble de la coagulation non corrigé contre-indique le geste.</p><div class="key"><b>Lacune nommée.</b> La conduite détaillée devant une hémorragie massive par érosion artérielle n’est pas décrite dans les sources européennes lues.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5854567/" target="_blank" rel="noopener">Trouillet et al., 2018</a>.</p></template>
<template data-pop="j95-stenose-traitement" data-title="Sténose trachéale : endoscopie ou résection"><p class="lab">Endoscopie (Zurich, 2013–2022)</p><p>Vingt-deux patients, dont 86,4 % de femmes, ont reçu 38 plasties endoscopiques : incision radiaire, dilatation au trachéoscope rigide, sans complication grave ni décès. Les récidives atteignaient 54,5 % sans triamcinolone locale, 37 % avec, et un patient sur huit après ajout du budésonide inhalé.</p><p class="lab">Résection (Zurich, 2001–2016)</p><p>Trente-sept résections trachéales ou cricotrachéales : aucun décès à trente jours, complications chez 29,7 %, surtout une dysphonie transitoire ; récidive seulement dans les sténoses idiopathiques. Les séries publiées rapportent après chirurgie 4 à 36 % de resténoses et une mortalité de 1,8 à 5 %.</p><div class="key"><b>Conséquence pratique.</b> Une sténose simple de moins de 1 cm se traite d’abord par endoscopie ; une sténose complexe, longue ou avec atteinte cartilagineuse relève d’un centre de chirurgie trachéale.</div><p class="src">Références : <a href="https://smw.ch/index.php/smw/article/view/3363" target="_blank" rel="noopener">Kather et al., 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33378546/" target="_blank" rel="noopener">Ferreirinha et al., 2020</a>.</p></template>
<template data-pop="j95-tests-diaphragme" data-title="Explorer le diaphragme"><p class="lab">Imagerie</p><p>La radiographie a une sensibilité de 90 % pour la paralysie unilatérale mais une spécificité de 44 %. La fluoroscopie avec manœuvre de reniflement montre une ascension paradoxale de la coupole paralysée, mais 6 % des sujets normaux ont un mouvement paradoxal, et elle est inutile dans l’atteinte bilatérale. Par un opérateur expérimenté, l’échographie atteint une sensibilité de 93 % et une spécificité de 100 % ; elle mesure excursion, épaisseur et fraction d’épaississement.</p><p class="lab">Fonction respiratoire</p><p>La capacité vitale chute en décubitus de 10 à 30 % dans l’atteinte unilatérale, de 30 à 50 % dans l’atteinte bilatérale ; une mesure couchée normale exclut une paralysie significative. La pression transdiaphragmatique, référence, n’est pratiquée dans aucun hôpital universitaire suisse.</p><div class="key"><b>Conséquence pratique.</b> Capacité vitale assise et couchée, pressions inspiratoires et échographie suffisent le plus souvent.</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2020/revue-medicale-suisse-705/paresies-et-paralysies-diaphragmatiques" target="_blank" rel="noopener">Baskaralingam et al., 2020</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2021/revue-medicale-suisse-759/evaluation-diaphragmatique-par-echographie" target="_blank" rel="noopener">Kharat et Plojoux, Rev Med Suisse 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30956204/" target="_blank" rel="noopener">Laveneziana et al., 2019</a>.</p></template>
<template data-pop="j95-diaphragme-traitement" data-title="Traiter une paralysie diaphragmatique"><p class="lab">VNI nocturne</p><p>Elle corrige rapidement l’hypoventilation nocturne. Les critères usuels sont une PaCO₂ diurne ≥ 45 mmHg, une SpO₂ ≤ 88 % pendant cinq minutes consécutives de sommeil ou plus de 10 % de l’enregistrement, une pression inspiratoire maximale &lt; 60 cm H₂O ou une CVF &lt; 50 % de la valeur prédite.</p><p class="lab">Plicature et stimulation</p><p>La plicature d’une hémicoupole réduit le mouvement paradoxal et les atélectasies ; elle s’adresse à une paralysie unilatérale persistante et symptomatique, après jusqu’à deux ans d’attente après chirurgie cardiaque, ou six mois en cas de dyspnée sévère d’une autre cause. L’obésité morbide et les maladies neuromusculaires la contre-indiquent. La stimulation du nerf phrénique exige un nerf intact.</p><div class="key"><b>Conséquence pratique.</b> Traiter d’abord la cause et les comorbidités ; la chirurgie vient en dernier, après une récupération spontanée attendue.</div><p class="src">Référence : <a href="https://www.revmed.ch/revue-medicale-suisse/2020/revue-medicale-suisse-705/paresies-et-paralysies-diaphragmatiques" target="_blank" rel="noopener">Baskaralingam et al., 2020</a>.</p></template>
<template data-pop="j95-pneumomediastin" data-title="Pneumomédiastin spontané"><p class="lab">Tableau</p><p>Dans la série de Macia (41 cas), douleur thoracique (85 %), dyspnée (49 %) et emphysème sous-cutané (71 %) dominaient ; la radiographie suffisait au diagnostic. Le traitement associait repos, antalgiques et parfois oxygène ; le séjour moyen durait cinq jours, sans morbidité.</p><p class="lab">Nuances</p><p>Dans la série de Perna (47 cas), 55 % des patients avaient consommé de la cocaïne quelques heures avant ; un patient a dû être opéré pour compression trachéale. Les auteurs recommandent une TDM à l’admission. Une revue de 600 cas rapporte le pneumothorax sous tension comme complication la plus fréquente.</p><div class="key"><b>Conséquence pratique.</b> Traitement conservateur, mais recherche d’une cause toxique et surveillance d’une compression.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17420139/" target="_blank" rel="noopener">Macia et al., 2007</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19748792/" target="_blank" rel="noopener">Perna et al., 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24887879/" target="_blank" rel="noopener">Dajer-Fadel et al., 2014</a>.</p></template>
<template data-pop="j95-mediastinite" data-title="Médiastinite"><p class="lab">Formes</p><p>Après sternotomie, elle complique 0,25 à 5 % des interventions. Elle peut aussi naître d’une infection de l’œsophage, des voies aériennes ou du poumon, ou descendre d’une infection cervicale (médiastinite nécrosante descendante). La forme chronique fibrosante résulte surtout d’infections granulomateuses.</p><p class="lab">Traitement après sternotomie</p><p>Dans une série de 157 patients, le débridement suivi d’un traitement par pression négative a réduit les réinfections de 16,9 % à 1,4 % par rapport au traitement conventionnel.</p><div class="key"><b>Lacune nommée.</b> Le consensus EACTS 2017 n’a été lu qu’en résumé ; ses recommandations détaillées de prévention et d’antibiothérapie ne sont pas reprises ici.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28077503/" target="_blank" rel="noopener">Abu-Omar et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21841864/" target="_blank" rel="noopener">De Feo et al., 2011</a>.</p></template>
<template data-pop="j95-gvh" data-title="Bronchiolite oblitérante après greffe de cellules souches"><p class="lab">Épidémiologie</p><p>Elle touche 2 à 10 % des greffés allogéniques dans les cinq ans et 14 % des patients atteints de maladie chronique du greffon contre l’hôte.</p><p class="lab">Critères</p><p>VEMS &lt; 75 % de la valeur prédite avec baisse ≥ 10 % en moins de deux ans, sans correction par bronchodilatateur ; VEMS/capacité vitale &lt; 0,7 ; absence d’infection ; piégeage aérique ou épaississement des petites voies aériennes à la TDM, ou piégeage aux épreuves fonctionnelles.</p><p class="lab">Traitement</p><p>La recommandation européenne de 2024 (ERS et EBMT) examine les traitements inhalés, l’association fluticasone, azithromycine et montélukast, plusieurs inhibiteurs de kinases, la photophérèse extracorporelle, la transplantation pulmonaire et la réhabilitation.</p><div class="key"><b>Lacune nommée.</b> Le texte intégral de la recommandation de 2024 n’a pas été accessible ; le détail de ses recommandations n’est pas repris ici.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9309343/" target="_blank" rel="noopener">Glanville et al., 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38485149/" target="_blank" rel="noopener">Bos et al., ERS et EBMT, Eur Respir J 2024</a>.</p></template>
<template data-pop="j95-obesite" data-title="Obésité et poumon opéré"><p class="lab">Atélectasie</p><p>Le poids abdominal et thoracique comprime le poumon et remonte le diaphragme. L’atélectasie après intubation croît avec l’indice de masse corporelle ; la PEEP nécessaire pour garder une pression transpulmonaire positive passait de 9,1 cm H₂O pour un indice de 25 à 29,9 à 16,8 cm H₂O au-delà de 40.</p><p class="lab">Données discordantes</p><p>La revue suisse de 2011 notait que l’obésité n’augmentait pas le risque de complications pulmonaires dans les études alors disponibles. Chez 2013 obèses, une PEEP élevée n’a pas réduit les complications, survenues chez plus d’un patient sur cinq.</p><div class="key"><b>Conséquence pratique.</b> L’obèse a plus d’atélectasie, mais une PEEP élevée systématique ne l’a pas protégé ; elle se réserve aux situations de collapsus marqué, comme l’association avec un pneumopéritoine ou un Trendelenburg.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6582260/" target="_blank" rel="noopener">Bluth et al., 2019</a>.</p></template>
