<section class="ilot" id="j95-0"><h2><span class="n">0</span>Question clinique</h2><p>Une femme de 72 ans, dont la SpO₂ préopératoire était de 97 %, a subi une gastrectomie partielle par laparotomie sus-ombilicale, sous anesthésie générale de quatre heures. Au deuxième jour, elle respire à 28 par minute et sa SpO₂ tombe à 88 % à l’air ambiant. La base gauche est mate et silencieuse ; elle tousse peu, car l’incision la fait souffrir. <b>Chez un opéré du thorax ou de l’abdomen supérieur, une hypoxémie des premiers jours impose de chercher une complication pulmonaire postopératoire avant de l’attribuer à la douleur ou à l’âge.</b></p><p>Toute anesthésie générale altère le poumon ; la plupart de ces altérations restent silencieuses. Quand elles retentissent sur la clinique, elles portent le nom de <button class="w" data-justification="1" data-k="j95-cppo">complications pulmonaires postopératoires (définition et enjeu)</button>. Le même cours réunit les lésions des voies aériennes laissées par l’intubation ou la trachéotomie, puis d’autres affections respiratoires rares et souvent méconnues : atélectasie hors chirurgie, paralysie diaphragmatique, pneumomédiastin, médiastinite et atteinte pulmonaire de la maladie chronique du greffon contre l’hôte.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j95-mecanismes">Les trois mécanismes de l’atélectasie (compression, résorption, obstruction)</button> ; <button class="w" data-justification="1" data-k="j95-ariscat">le score ARISCAT (estimer le risque avant l’intervention)</button>.</div></section>
<section class="ilot" id="j95-1"><h2><span class="n">1</span>Définitions et classification</h2><p>Une complication pulmonaire postopératoire est une anomalie respiratoire qui survient après l’intervention, exige une intervention médicale et modifie défavorablement l’évolution. Cette définition générale, reprise par la Revue médicale suisse, englobe atélectasie, infection, insuffisance respiratoire, ventilation prolongée, exacerbation d’une pneumopathie et bronchospasme (Younossian, 2011). Pour comparer les études, la Société européenne d’anesthésiologie et l’ESICM ont fixé en 2015 des <button class="w" data-justification="1" data-k="j95-epco">définitions européennes des complications périopératoires, dites EPCO (critères de chaque complication)</button>.</p><p>Le cours couvre quatre familles. Le tableau les rassemble par mécanisme, car chacune appelle une démarche propre.</p><table class="t"><tr><th>Famille</th><th>Entités</th><th>Fil conducteur</th></tr><tr><td>Complications pulmonaires postopératoires</td><td>Atélectasie, insuffisance respiratoire aiguë, pneumonie, bronchospasme, épanchement pleural</td><td>Perte de volume pulmonaire et défaut de toux</td></tr><tr><td>Lésions des voies aériennes</td><td>Œdème laryngé après extubation, sténose sous-glottique ou trachéale, dysfonction de trachéostomie, fistule trachéo-œsophagienne</td><td>Ischémie de la muqueuse au contact d’un tube</td></tr><tr><td>Complications d’autres gestes</td><td><button class="w" data-justification="1" data-k="j95-pnx-iatrogene">pneumothorax iatrogène</button>, <button class="w" data-justification="1" data-k="j95-fistule-bp">fistule bronchopleurale et fuite aérienne après résection</button>, <button class="w" data-justification="1" data-k="j95-mendelson">syndrome de Mendelson</button></td><td>Effraction ou inhalation</td></tr><tr><td>Autres troubles respiratoires</td><td>Atélectasie obstructive, emphysème compensateur, pneumomédiastin, médiastinite, paralysie diaphragmatique, atteinte pulmonaire de la maladie chronique du greffon contre l’hôte</td><td>Plèvre, médiastin, diaphragme et petites voies aériennes</td></tr></table><p>Lu de gauche à droite, le tableau relie une entité à son mécanisme. Le piège consiste à ranger toute hypoxémie postopératoire sous « atélectasie » : une pneumonie, une embolie ou un œdème pulmonaire exigent d’autres traitements. L’emphysème compensateur désigne la surdistension du poumon resté aéré autour d’une atélectasie ; il en est un signe radiologique, non une maladie à traiter (Lagier, 2022).</p><div class="key"><b>À retenir.</b> Une complication pulmonaire postopératoire se définit par ses conséquences cliniques. Le clinicien la nomme précisément, car atélectasie, pneumonie et insuffisance respiratoire ne se traitent pas de la même manière.</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., Rev Med Suisse 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25058504/" target="_blank" rel="noopener">Jammer et al., définitions EPCO, Eur J Anaesthesiol 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., atélectasie périopératoire, partie II, Anesthesiology 2022</a>.</p></section>
<section class="ilot" id="j95-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’atélectasie est presque universelle sous anesthésie générale : elle apparaît chez 90 % des patients sans maladie cardiopulmonaire, et jusqu’à 20 à 25 % du poumon devient non aéré ou mal aéré (Zeng, 2022). Elle ne devient une complication que chez une minorité. Dans la cohorte catalane de Canet, 123 des 2464 opérés (5 %) ont présenté au moins une complication pulmonaire ; leur mortalité à trente jours atteignait 19,5 %, contre 0,5 % chez les autres.</p><p>Les complications pulmonaires sont aussi fréquentes que les complications cardiaques. Après chirurgie abdominale, une série citée par la revue suisse en comptait 9,6 %, contre 5,7 % de complications cardiaques, avec une mortalité identique et un séjour prolongé d’environ deux semaines (Younossian, 2011). Dans l’étude européenne de Kirmeier, menée dans 211 hôpitaux de 28 pays, 7,6 % des 21 694 patients opérés sous anesthésie générale ont présenté une complication pulmonaire.</p><p>Les autres entités sont rares. La sténose trachéale bénigne après intubation ou trachéotomie survient chez environ 4,9 personnes par million et par an (Kather, 2024). La maladie chronique du greffon contre l’hôte atteint les petites voies aériennes de 2 à 10 % des greffés de cellules souches hématopoïétiques dans les cinq ans (Glanville, 2022). La médiastinite complique 0,25 à 5 % des sternotomies (EACTS, 2017).</p><div class="key"><b>À retenir.</b> L’atélectasie peropératoire est la règle ; la complication pulmonaire cliniquement significative est l’exception, mais elle multiplie la mortalité postopératoire.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9869183/" target="_blank" rel="noopener">Zeng et al., atélectasie périopératoire, partie I, Anesthesiology 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21045639/" target="_blank" rel="noopener">Canet et al., Anesthesiology 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30224322/" target="_blank" rel="noopener">Kirmeier et al., Lancet Respir Med 2019</a> ; <a href="https://smw.ch/index.php/smw/article/view/3363" target="_blank" rel="noopener">Kather et al., Swiss Med Wkly 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9309343/" target="_blank" rel="noopener">Glanville et al., ERJ Open Res 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28077503/" target="_blank" rel="noopener">Abu-Omar et al., consensus EACTS 2017</a>.</p></section>
<section class="ilot" id="j95-3"><h2><span class="n">3</span>De l’anesthésie à l’hypoxémie</h2><p>Chez le sujet éveillé, la pression pleurale reste négative et le tonus du diaphragme empêche la pression abdominale de comprimer les bases. L’anesthésie supprime ce tonus. Le diaphragme remonte en quelques minutes, la capacité résiduelle fonctionnelle diminue et les régions déclives et postérieures se collabent : c’est l’<b>atélectasie de compression</b>. À cela s’ajoutent l’<b>atélectasie de résorption</b>, quand l’oxygène pur des alvéoles mal ventilées passe entièrement dans le sang, et l’<b>atélectasie obstructive</b>, due aux sécrétions que la toux n’évacue plus (Zeng, 2022).</p><p>Le poumon collabé reste perfusé : le sang qui le traverse ne s’oxygène pas. Ce <button class="w" data-justification="1" data-k="j95-shunt">shunt intrapulmonaire (différence avec les zones de bas rapport ventilation-perfusion)</button> abaisse la PaO₂ ; la <button class="w" data-justification="1" data-k="j95-vph">vasoconstriction pulmonaire hypoxique (protection et limites)</button> le limite sans le supprimer. Sous anesthésie, le rapport PaO₂/FiO₂ médian chutait ainsi de 441 à 368 mmHg dans la série de Hedenstierna.</p><p>Après l’intervention, trois facteurs entretiennent la perte de volume. La douleur d’une incision proche du diaphragme bride l’inspiration profonde et la toux. Le diaphragme lui-même fonctionne mal après chirurgie abdominale, thoracique ou cardiaque : 24 heures après une chirurgie thoracique, une atélectasie touchait 35 % des patients avec dysfonction diaphragmatique échographique, contre 13 % sans elle. Enfin, opioïdes et <button class="w" data-justification="1" data-k="j95-curarisation">curarisation résiduelle (mécanisme et conséquences)</button> dépriment la commande et la force respiratoires (Lagier, 2022).</p><div class="key"><b>Conséquence pratique.</b> Toute mesure qui rouvre le poumon (position assise, inspiration profonde, pression positive) ou qui préserve la toux (analgésie efficace, décurarisation complète) combat la cause, et non seulement l’hypoxémie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9869183/" target="_blank" rel="noopener">Zeng et al., 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31045901/" target="_blank" rel="noopener">Hedenstierna et al., Anesthesiology 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></section>
<section class="ilot" id="j95-4"><h2><span class="n">4</span>Facteurs de risque et causes</h2><h3>Complications pulmonaires postopératoires</h3><p>Les facteurs liés à l’intervention pèsent davantage que ceux du patient (Younossian, 2011). Le site opératoire domine : plus l’incision s’approche du diaphragme, plus le risque augmente, et la laparoscopie divise par deux le risque pulmonaire en chirurgie bariatrique. Une durée de plus de trois heures, l’urgence et les transfusions multiples l’accroissent aussi. Du côté du patient, le risque devient notable dès 60 ans et augmente avec la classe de l’American Society of Anesthesiologists et la dépendance fonctionnelle. Une BPCO ou un asthme bien contrôlés n’ajoutent qu’un risque modeste ; le <button class="w" data-justification="1" data-k="j95-tabac">tabagisme actif (bénéfice et délai de l’arrêt)</button>, le syndrome d’apnées obstructives du sommeil et l’hypertension artérielle pulmonaire symptomatique sont d’autres facteurs identifiés.</p><p>Le score ARISCAT réunit sept facteurs objectifs, mesurables avant l’intervention. Le tableau indique les points attribués ; la somme classe le patient.</p><table class="t"><tr><th>Facteur</th><th>Points</th></tr><tr><td>Âge 51 à 80 ans ; plus de 80 ans</td><td>3 ; 16</td></tr><tr><td>SpO₂ préopératoire 91 à 95 % ; 90 % ou moins</td><td>8 ; 24</td></tr><tr><td>Infection respiratoire dans le mois précédent</td><td>17</td></tr><tr><td>Anémie préopératoire (hémoglobine ≤ 10 g/dL)</td><td>11</td></tr><tr><td>Incision abdominale haute ; intrathoracique</td><td>15 ; 24</td></tr><tr><td>Durée de 2 à 3 heures ; plus de 3 heures</td><td>16 ; 23</td></tr><tr><td>Intervention urgente</td><td>8</td></tr></table><p>Moins de 26 points définit un risque bas (1,6 % de complications), 26 à 44 un risque intermédiaire (13,3 %), 45 ou plus un risque élevé (42,1 %). La patiente de l’îlot 0 cumule 3 points pour l’âge, 15 pour l’incision et 23 pour la durée : 41 points, soit un risque intermédiaire avant même l’intervention. L’erreur fréquente est d’ignorer la durée prévue, qui pèse autant qu’une thoracotomie.</p><h3>Lésions des voies aériennes et du diaphragme</h3><p>La sténose trachéale naît surtout de l’intubation prolongée et de la trachéotomie ; un ballonnet trop gonflé rend la muqueuse ischémique, et l’infection ou le reflux gastro-œsophagien endommagent le cartilage (Trouillet, 2018). La paralysie diaphragmatique unilatérale est le plus souvent iatrogène, après chirurgie cervicale, thoracique ou cardiaque qui lèse le nerf phrénique (Baskaralingam, 2020) ; un bloc interscalénique peut produire le même effet, transitoire (Lagier, 2022).</p><div class="key"><b>À retenir.</b> Le risque pulmonaire se calcule avant l’intervention : site, durée, urgence, âge, saturation, anémie et infection récente. Un score dédié est recommandé par le consensus européen de ventilation protectrice (Young, 2019).</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21045639/" target="_blank" rel="noopener">Canet et al., 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11704732/" target="_blank" rel="noopener">Lee et al., Tuberc Respir Dis 2025, tableau 3 (points du score)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31587835/" target="_blank" rel="noopener">Young et al., Br J Anaesth 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5854567/" target="_blank" rel="noopener">Trouillet et al., SFAR et SRLF, Ann Intensive Care 2018</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2020/revue-medicale-suisse-705/paresies-et-paralysies-diaphragmatiques" target="_blank" rel="noopener">Baskaralingam et al., Rev Med Suisse 2020</a>.</p></section>
<section class="ilot" id="j95-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>Avant l’intervention, l’anamnèse et l’examen sont les outils les plus performants pour estimer le risque (Younossian, 2011). Le médecin recherche une intolérance à l’effort, une dyspnée, une toux, une infection respiratoire du mois écoulé, le tabagisme et le ronflement associé à une somnolence diurne. Il juge le contrôle d’une BPCO ou d’un asthme, car une maladie décompensée justifie de différer une chirurgie programmée.</p><p>Après l’intervention, il date la dyspnée, la toux et l’expectoration, puis mesure la douleur à l’inspiration profonde et relit les doses d’opioïdes et l’heure de la dernière curarisation. Une dyspnée qui n’apparaît qu’en décubitus, ou une <b>bendopnée</b> (dyspnée à l’antéflexion du tronc), oriente vers une atteinte du diaphragme (Baskaralingam, 2020).</p><p>Des semaines ou des mois après une intubation ou une trachéotomie, une dyspnée d’effort avec un bruit inspiratoire évoque une sténose. Dans la série zurichoise de Kather, le stridor était présent chez 95,5 % des patients, le diagnostic tardait en moyenne de 14 mois, et trois patients sur 22 avaient d’abord été traités pour un asthme.</p><div class="trap"><span class="k">Erreur fréquente</span> Un « asthme » apparu après un séjour en soins intensifs, résistant aux bronchodilatateurs et accompagné d’un bruit inspiratoire, n’est pas un asthme tant qu’une sténose trachéale n’a pas été écartée par la courbe débit-volume et l’endoscopie.</div><div class="key"><b>À retenir.</b> L’interrogatoire préopératoire calcule le risque ; l’interrogatoire postopératoire cherche la douleur, les médicaments dépresseurs et le délai depuis l’intubation.</div><p class="src">Références : <a href="https://www.revmed.ch/revue-medicale-suisse/2011/revue-medicale-suisse-317/complications-pulmonaires-postoperatoires-comment-anticiper-et-prevenir-le-risque" target="_blank" rel="noopener">Younossian et al., 2011</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2020/revue-medicale-suisse-705/paresies-et-paralysies-diaphragmatiques" target="_blank" rel="noopener">Baskaralingam et al., 2020</a> ; <a href="https://smw.ch/index.php/smw/article/view/3363" target="_blank" rel="noopener">Kather et al., 2024</a>.</p></section>
<section class="ilot" id="j95-6"><h2><span class="n">6</span>Examiner pour reconnaître</h2><p>Le médecin mesure la fréquence respiratoire et la SpO₂ à l’air ambiant ; un test sans oxygène, répété, démasque une hypoxémie que l’oxygénothérapie cache (Lagier, 2022). Une matité, une diminution du murmure vésiculaire, des crépitants ou des sibilants localisent l’atteinte. Un examen thoracique normal ne suffit pas : l’échographie pulmonaire reconnaît l’atélectasie mieux que l’auscultation (Lagier, 2022).</p><p>Plusieurs signes changent immédiatement la conduite. Un <b>stridor inspiratoire</b> après extubation signale un œdème laryngé ; à distance, une sténose. Une <b>respiration abdominale paradoxale</b> en position couchée, où l’abdomen se creuse à l’inspiration, oriente vers une paralysie diaphragmatique bilatérale (Baskaralingam, 2020). Un <b>emphysème sous-cutané</b> cervical crépitant à la palpation accompagne 71 % des pneumomédiastins spontanés (Macia, 2007).</p><p>Chez le patient trachéotomisé, l’examen porte aussi sur la canule : position, perméabilité au passage d’une sonde d’aspiration, saignement de l’orifice et signes d’infection locale (Trouillet, 2018).</p><div class="key"><b>À retenir.</b> Fréquence respiratoire, SpO₂ à l’air, stridor, respiration paradoxale et emphysème sous-cutané orientent vers des diagnostics dont certains imposent une action immédiate.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2020/revue-medicale-suisse-705/paresies-et-paralysies-diaphragmatiques" target="_blank" rel="noopener">Baskaralingam et al., 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17420139/" target="_blank" rel="noopener">Macia et al., Eur J Cardiothorac Surg 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5854567/" target="_blank" rel="noopener">Trouillet et al., 2018</a>.</p><button class="pareto-btn ui" data-k="pareto-j95-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
