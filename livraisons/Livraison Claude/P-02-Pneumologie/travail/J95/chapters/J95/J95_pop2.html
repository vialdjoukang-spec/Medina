<template data-pop="j95-d-rocuronium" data-title="Rocuronium (Esmeron®)"><p class="lab">Mécanisme et indication</p><p>Curare non dépolarisant d’action rapide et de durée intermédiaire, il se fixe par compétition sur les récepteurs nicotiniques de la plaque motrice. Il est indiqué pendant l’anesthésie générale pour faciliter l’intubation et maintenir le relâchement musculaire.</p><p class="lab">Posologie</p><p>Intubation : 0,6 mg/kg, avec des conditions acceptables en 60 secondes chez 75 à 80 % des patients ; séquence rapide : 1,0 mg/kg. Entretien : 0,15 mg/kg, réduit à 0,075 à 0,1 mg/kg sous anesthésique volatil prolongé.</p><p class="lab">Précautions</p><p>Curarisation résiduelle possible : extuber seulement après une récupération suffisante, surtout après 65 ans. Aminosides, lincosamides, quinidine, quinine et magnésium peuvent provoquer une recurarisation.</p><div class="key"><b>Conséquence pratique.</b> Toute administration de rocuronium appelle une surveillance neuromusculaire et une décurarisation vérifiée.</div><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680526860598" target="_blank" rel="noopener">Information professionnelle suisse Esmeron®, Swissmedic (AIPS via AmiKo), mise à jour 07.2026, consultée le 09.10.2026</a>.</p></template>
<template data-pop="j95-d-sugammadex" data-title="Sugammadex (Bridion®)"><p class="lab">Mécanisme et indication</p><p>Cette gamma-cyclodextrine modifiée forme un complexe avec le rocuronium ou le vécuronium ; le curare encapsulé ne peut plus se lier aux récepteurs nicotiniques. Elle est indiquée dès l’âge de deux ans.</p><p class="lab">Posologie</p><p>2 mg/kg après réapparition de la deuxième réponse du train-de-quatre ; 4 mg/kg à 1 ou 2 réponses post-tétaniques ; 16 mg/kg pour une levée immédiate après 1,2 mg/kg de rocuronium. Chez l’obèse, la dose se calcule sur le poids réel. Récurrence du bloc : 0,20 % dans les études ; une dose supplémentaire de 4 mg/kg est alors recommandée.</p><p class="lab">Précautions</p><p>Non recommandé si la clairance de la créatinine est inférieure à 30 mL/min. Hypersensibilité, parfois anaphylactique ; bradycardie prononcée rare. Interaction avec les contraceptifs hormonaux, équivalente à l’oubli d’un comprimé.</p><div class="key"><b>Conséquence pratique.</b> L’ESAIC le recommande pour antagoniser les blocs profonds, modérés et superficiels induits par un aminostéroïde (1A).</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680585090011" target="_blank" rel="noopener">Information professionnelle suisse Bridion®, mise à jour 02.2026, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36377554/" target="_blank" rel="noopener">Fuchs-Buder et al., 2023</a>.</p></template>
<template data-pop="j95-d-neostigmine" data-title="Néostigmine et glycopyrronium (Robinul®-Néostigmine)"><p class="lab">Mécanisme et indication</p><p>La néostigmine inhibe la cholinestérase et augmente l’acétylcholine à la plaque motrice ; le glycopyrronium, anticholinergique, en limite les effets muscariniques. L’association lève un bloc neuromusculaire résiduel non dépolarisant.</p><p class="lab">Posologie</p><p>1 mL en 10 à 30 secondes par voie intraveineuse, ou 0,02 mL/kg (50 µg/kg de néostigmine et 10 µg/kg de glycopyrronium) ; dose totale maximale 2 mL.</p><p class="lab">Précautions</p><p>Contre-indiquée en cas d’obstruction mécanique digestive ou urinaire. Prudence en cas de bronchospasme, de bradycardie sévère, de coronaropathie ou d’arythmie. L’ESAIC demande une récupération spontanée avancée (rapport du train-de-quatre &gt; 0,2) avant l’injection.</p><div class="key"><b>Conséquence pratique.</b> Donnée à forte dose ou sans surveillance, la néostigmine a été associée à des atélectasies postopératoires.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680493890192" target="_blank" rel="noopener">Information professionnelle suisse Robinul®-Néostigmine, mise à jour 04.2020, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36377554/" target="_blank" rel="noopener">Fuchs-Buder et al., 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9885487/" target="_blank" rel="noopener">Lagier et al., 2022</a>.</p></template>
<template data-pop="j95-d-naloxone" data-title="Naloxone (Naloxon OrPha)"><p class="lab">Mécanisme et indication</p><p>Antagoniste des récepteurs opioïdes, elle lève la dépression du système nerveux central, en particulier la dépression respiratoire, induite par les opioïdes.</p><p class="lab">Posologie</p><p>Adulte : 0,1 à 0,2 mg par voie intraveineuse, puis 0,1 mg toutes les 2 à 3 minutes jusqu’à une respiration stable et une vigilance adéquate, sans douleur importante. Une nouvelle dose peut être nécessaire après 1 à 2 heures ; une perfusion prévient la récidive après un opioïde de longue durée d’action.</p><p class="lab">Précautions</p><p>Des tachycardies et fibrillations ventriculaires ont été rapportées chez des opérés ; prudence chez le patient âgé cardiaque.</p><div class="key"><b>Conséquence pratique.</b> Titrer par petites doses lève la dépression respiratoire sans supprimer l’analgésie.</div><p class="src">Référence : <a href="https://amiko.oddb.org/fr/fi?gtin=7680569520015" target="_blank" rel="noopener">Information professionnelle suisse Naloxon OrPha, mise à jour 07.2026, consultée le 09.10.2026</a>.</p></template>
<template data-pop="j95-d-methylpred" data-title="Méthylprednisolone (Solu-Medrol®)"><p class="lab">Indication</p><p>L’information professionnelle cite l’œdème laryngé aigu non infectieux parmi les états allergiques sévères, en précisant que l’adrénaline est le traitement de premier choix. La prévention de l’œdème après extubation n’y figure pas.</p><p class="lab">Usage hors indication</p><p>Dans l’essai de François, 20 mg par voie intraveineuse 12 heures avant l’extubation puis toutes les 4 heures jusqu’au retrait du tube ont réduit l’œdème laryngé de 22 % à 3 %. La SFAR et la SRLF proposent une corticothérapie débutée au moins six heures avant l’extubation lorsque le test de fuite est faible ou nul.</p><div class="key"><b>Conséquence pratique.</b> La prescription préventive est un usage hors indication, appuyé par un essai randomisé et une recommandation d’experts ; elle exige d’anticiper l’extubation.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680351120812" target="_blank" rel="noopener">Information professionnelle suisse Solu-Medrol®, mise à jour 08.2025, consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17398307/" target="_blank" rel="noopener">François et al., 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6342741/" target="_blank" rel="noopener">Quintard et al., 2019</a>.</p></template>
<template data-pop="j95-d-triamcinolone" data-title="Triamcinolone acétonide injectable (Kenacort®-A)"><p class="lab">Indication autorisée</p><p>Suspension pour injection intramusculaire, intra-articulaire, intrafocale ou sous-lésionnelle, notamment dans les chéloïdes. Elle ne doit jamais être injectée par voie intraveineuse.</p><p class="lab">Usage hors indication</p><p>Le service de pneumologie de l’Hôpital universitaire de Zurich injecte 20 à 40 mg de triamcinolone acétonide dans la muqueuse de l’ancienne sténose, à la fin de la plastie endoscopique, sur le modèle du traitement des chéloïdes. Les récidives sont passées de 54,5 % à 37 % dans cette série rétrospective non contrôlée.</p><div class="key"><b>Limite.</b> Le bénéfice repose sur une comparaison historique de petite taille ; l’injection trachéale reste hors indication.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680261770145" target="_blank" rel="noopener">Information professionnelle suisse Kenacort®-A 10 et A 40, mise à jour 12.2021, consultée le 09.10.2026</a> ; <a href="https://smw.ch/index.php/smw/article/view/3363" target="_blank" rel="noopener">Kather et al., 2024</a>.</p></template>
<template data-pop="j95-d-budesonide" data-title="Budésonide inhalé (Pulmicort®)"><p class="lab">Indication autorisée</p><p>Affections obstructives des voies respiratoires, comme l’asthme ou la bronchite chronique obstructive, nécessitant une corticothérapie d’entretien. Le patient se rince la bouche après chaque prise pour limiter le muguet.</p><p class="lab">Usage hors indication</p><p>Depuis 2020, le centre zurichois ajoute 200 µg deux fois par jour après la plastie trachéale, car l’effet de la triamcinolone injectée s’estompe ; une récidive est survenue chez un patient sur huit.</p><div class="key"><b>Limite.</b> L’effectif est très faible ; les auteurs demandent des études avant toute généralisation.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680501920163" target="_blank" rel="noopener">Information professionnelle suisse Pulmicort®, mise à jour 06.2023, consultée le 09.10.2026</a> ; <a href="https://smw.ch/index.php/smw/article/view/3363" target="_blank" rel="noopener">Kather et al., 2024</a>.</p></template>
<template data-pop="pareto-j95-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j95-0,j95-1,j95-2,j95-3,j95-4,j95-5,j95-6"></p><ul><li>Complication pulmonaire postopératoire : anomalie respiratoire cliniquement significative qui exige une intervention ; atélectasie, insuffisance respiratoire, pneumonie, bronchospasme.</li><li>Atélectasie chez 90 % des anesthésiés ; complication cliniquement significative chez 5 %, avec une mortalité à trente jours de 19,5 % contre 0,5 %.</li><li>Trois mécanismes : compression, résorption, obstruction ; douleur, dysfonction diaphragmatique, opioïdes et curarisation résiduelle entretiennent la perte de volume.</li><li>Score ARISCAT : âge, SpO₂, infection récente, anémie, site, durée, urgence ; &lt; 26, 26 à 44, ≥ 45 points.</li><li>Sténose après intubation : stridor, « asthme » rebelle ; paralysie diaphragmatique : orthopnée, bendopnée, respiration paradoxale.</li></ul></template>
<template data-pop="pareto-j95-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j95-7"></p><ul><li>Insuffisance respiratoire postopératoire : PaO₂ &lt; 8 kPa à l’air, PaO₂/FiO₂ &lt; 40 kPa ou SpO₂ &lt; 90 % sous oxygène.</li><li>Atélectasie : opacité qui attire les structures voisines ; la pneumonie exige en plus fièvre ou leucocytose et deux signes respiratoires.</li><li>Échographie au lit, TDM en référence ; la radiographie manque les opacités postérieures.</li><li>Sténose : courbe débit-volume aplatie, endoscopie ; diaphragme : capacité vitale couchée.</li></ul></template>
<template data-pop="pareto-j95-pec" data-title="Pareto — Urgences et traitement"><p class="ratio" data-cover="j95-8,j95-9,j95-10"></p><ul><li>Canule bouchée ou déplacée : oxygène visage et orifice, canule interne retirée, aspiration, ballonnet dégonflé, puis retrait.</li><li>Prévention : laparoscopie, volume courant 6 à 8 mL/kg, PEEP 5 cm H₂O, FiO₂ normoxique, décurarisation vérifiée, analgésie régionale.</li><li>PEEP élevée et CPAP préventive systématique : pas de bénéfice démontré.</li><li>Opéré hypoxémique : VNI ou CPAP plutôt qu’oxygène seul ; haut débit nasal possible chez l’opéré à haut risque.</li><li>Test de fuite avant extubation à risque ; ballonnet ≤ 30 cm H₂O ; sténose courte par endoscopie, complexe par résection.</li></ul></template>
<template data-pop="pareto-j95-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j95-11,j95-12,j95-13"></p><ul><li>Sténose : récidive fréquente après endoscopie, contrôle à six à huit semaines puis sur symptômes.</li><li>Paralysie unilatérale postopératoire : récupération possible jusqu’à deux ans ; VNI nocturne si hypoventilation ; plicature en dernier recours.</li><li>Pneumomédiastin spontané : homme jeune, emphysème sous-cutané, traitement conservateur, recherche de cocaïne.</li><li>Bronchiolite oblitérante après greffe : VEMS &lt; 75 % avec baisse ≥ 10 %, VEMS/capacité vitale &lt; 0,7, piégeage aérique.</li><li>Grades de Myer et Cotton : ≤ 50 %, 51 à 70 %, 71 à 99 %, aucune lumière.</li></ul></template>
<template data-pop="pareto-j95-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="j95-e-1,j95-e-2,j95-e-3"></p><ul><li>Préopératoire : clinique d’abord ; radiographie avant chirurgie abdominale, thoracique ou aortique après 50 ans ; pas de spirométrie ni de gazométrie de routine.</li><li>SpO₂/FiO₂ démasque l’hypoxémie sous oxygène ; la PaCO₂ cherche l’hypoventilation.</li><li>Bronchogramme dynamique : valeur prédictive positive élevée pour la pneumonie, sensibilité faible.</li><li>Radiographie du diaphragme : sensible, peu spécifique ; capacité vitale couchée et échographie confirment.</li></ul></template>
<template data-pop="pareto-j95-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j95-p-1,j95-p-2,j95-p-3,j95-p-4"></p><ul><li>Rocuronium 0,6 mg/kg ; curarisation résiduelle, recurarisation par aminosides ou magnésium.</li><li>Sugammadex 2, 4 ou 16 mg/kg selon la profondeur du bloc ; pas sous 30 mL/min de clairance ; contraception à compléter.</li><li>Néostigmine seulement après récupération spontanée avancée ; naloxone 0,1 à 0,2 mg, à répéter.</li><li>Méthylprednisolone avant extubation et corticoïdes locaux de la sténose : hors indication.</li></ul></template>
