<div class="chap-head"><div class="code">J82 — Éosinophilie pulmonaire, non classée ailleurs · couvre J82 · renvois : M31 — Vascularites systémiques, J45 — Asthme · CIM-10-GM 2024 · Appareil respiratoire</div>
<h1>Éosinophilies pulmonaires</h1><span class="status">Adulte · pneumopathies chronique et aiguë à éosinophiles, syndrome de Löffler · aspergillose bronchopulmonaire allergique et granulomatose éosinophilique en différentiel · état au 09.10.2026</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des éosinophilies pulmonaires</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#j82-0">Question clinique</a></li><li><a href="#j82-1">Définitions et classification</a></li><li><a href="#j82-2">Épidémiologie et pronostic</a></li><li><a href="#j82-3">De l’interleukine 5 à l’alvéole inondée</a></li><li><a href="#j82-4">Causes et facteurs de risque</a></li><li><a href="#j82-5">Interroger pour trouver la cause</a></li><li><a href="#j82-6">Examiner au-delà du poumon</a></li><li><a href="#j82-7">Établir le diagnostic</a></li><li><a href="#j82-8">Urgences et complications</a></li><li><a href="#j82-9">Traiter selon la forme</a></li><li><a href="#j82-10">Suivi, rechutes et prévention</a></li><li><a href="#j82-11">Situations particulières</a></li><li><a href="#j82-12">Critères formels du diagnostic</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="j82-0"><h2><span class="n">0</span>Question clinique</h2><p>Une femme de 46 ans, asthmatique depuis l’enfance, tousse et s’essouffle depuis six semaines. Elle a perdu 4 kg, transpire la nuit et a reçu deux antibiotiques sans effet. La radiographie montre des opacités alvéolaires bilatérales, collées à la paroi thoracique. L’hémogramme compte 3,2 G/L éosinophiles. <b>Une pneumonie qui résiste aux antibiotiques, avec des opacités périphériques et une éosinophilie, impose de rechercher une pneumopathie à éosinophiles avant de changer d’antibiotique.</b></p><p>Les éosinophilies pulmonaires réunissent les maladies dont la lésion dominante est une infiltration du poumon par des polynucléaires éosinophiles. Le clinicien doit répondre à trois questions successives : l’éosinophilie pulmonaire est-elle réelle ; a-t-elle une cause qu’il faut supprimer, comme un médicament, un parasite ou un champignon ; s’inscrit-elle dans une maladie systémique qui menace le cœur, les nerfs ou le rein ? La réponse change le traitement : un antiparasitaire, l’arrêt d’un médicament, une corticothérapie, ou une immunosuppression.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j82-eosino">Le polynucléaire éosinophile (production, circulation, tissus)</button> ; <button class="w" data-justification="1" data-k="j82-negatif">l’image en « négatif d’œdème pulmonaire » (valeur et limites)</button>.</div></section>
<section class="ilot" id="j82-1"><h2><span class="n">1</span>Définitions et classification</h2><p>L’éosinophilie sanguine se définit par un compte absolu supérieur à 0,5 G/L ; l’hyperéosinophilie commence à 1,5 G/L (Valent, 2023). Une pneumopathie à éosinophiles associe des opacités pulmonaires à une éosinophilie sanguine supérieure à 1 G/L, à une éosinophilie alvéolaire supérieure à 25 % au <button class="w" data-justification="1" data-k="j82-lba">lavage broncho-alvéolaire (seuils et technique)</button>, ou aux deux (Cottin et Cordier, 2005). L’éosinophilie sanguine peut manquer : au début d’une pneumopathie aiguë, ou chez un patient qui reçoit déjà des glucocorticoïdes.</p><p>La classification oppose trois groupes, car chacun appelle une conduite propre. Le tableau suivant les présente dans l’ordre où le médecin les envisage : il élimine d’abord les causes connues, puis les maladies systémiques, avant de retenir une forme idiopathique.</p><table class="t"><tr><th>Groupe</th><th>Entités</th><th>Conséquence</th></tr><tr><td>Cause identifiable</td><td>Médicament, tabac ou vapotage, parasite, <button class="w" data-justification="1" data-k="j82-abpa">aspergillose bronchopulmonaire allergique</button>, radiothérapie</td><td>Supprimer ou traiter la cause</td></tr><tr><td>Maladie systémique</td><td><button class="w" data-justification="1" data-k="j82-gepa">Granulomatose éosinophilique avec polyangéite</button>, <button class="w" data-justification="1" data-k="j82-she">syndrome hyperéosinophilique</button></td><td>Rechercher les atteintes cardiaque, nerveuse et rénale</td></tr><tr><td>Forme idiopathique pulmonaire</td><td>Syndrome de Löffler, <button class="w" data-justification="1" data-k="j82-pae-def">pneumopathie aiguë (PAE)</button>, <button class="w" data-justification="1" data-k="j82-pce-def">pneumopathie chronique (PCE)</button></td><td>Diagnostic d’exclusion ; glucocorticoïdes</td></tr></table><p>Le tableau se lit de haut en bas. Chez un patient revenu des tropiques avec une toux et des opacités fugaces, le premier groupe s’impose ; chez un asthmatique qui développe une mononévrite, le deuxième. Le syndrome de Löffler désigne des opacités transitoires avec éosinophilie, le plus souvent d’origine parasitaire (Cottin, 2023) : il chevauche donc les groupes « cause identifiable » et « forme idiopathique » selon que le parasite est trouvé ou non.</p><div class="trap"><span class="k">Piège</span> Une éosinophilie sanguine normale n’exclut pas une pneumopathie à éosinophiles. Dans la PAE, le compte est inférieur à 0,5 G/L chez deux patients sur trois au diagnostic (Marchand et Cordier, 2006) : seul le lavage tranche.</div><div class="key"><b>À retenir.</b> « Éosinophilie pulmonaire » désigne un mécanisme lésionnel, non une maladie. Le médecin passe du syndrome à la cause, car l’arrêt d’un médicament, un antiparasitaire et une immunosuppression ne se prescrivent pas au même patient.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9797433/" target="_blank" rel="noopener">Valent et al., critères des maladies à éosinophiles, Allergy 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15932372/" target="_blank" rel="noopener">Cottin et Cordier, Eosinophilic pneumonias, Allergy 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37055090/" target="_blank" rel="noopener">Cottin, Eosinophilic lung diseases, 2023</a>.</p></section>
<section class="ilot" id="j82-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Aucune donnée suisse d’incidence des pneumopathies à éosinophiles n’a été trouvée ; les chiffres suivants proviennent de séries européennes, surtout françaises. Leur rareté explique le retard diagnostique : la PCE représente 0 à 2,5 % des cas des registres européens de pneumopathies interstitielles (Marchand et Cordier, 2006).</p><table class="t"><tr><th>Entité</th><th>Terrain</th><th>Évolution</th></tr><tr><td>PCE</td><td>Femme deux fois plus souvent ; asthme chez un tiers à la moitié ; fumeurs : 6,5 % d’une série de 62 patients</td><td>Rechute jusqu’à 50 % ; 68,9 % encore sous glucocorticoïdes oraux après plus d’un an de suivi</td></tr><tr><td>PAE</td><td>Âge moyen de 29 ans ; 13 hommes et 9 femmes dans la série de Philit ; début ou reprise récente du tabac</td><td>Guérison de tous les patients ; aucune rechute</td></tr><tr><td>Granulomatose éosinophilique</td><td>Incidence de 0,5 à 4,2 par million et par an ; âge moyen voisin de 50 ans</td><td>Asthme souvent sévère et obstruction persistante</td></tr><tr><td>Aspergillose bronchopulmonaire allergique</td><td>Sensibilisation à <i>Aspergillus fumigatus</i> chez 25 % des asthmatiques adultes suivis en centre tertiaire</td><td>Exacerbation chez près de la moitié après l’arrêt du traitement</td></tr></table><p>La première ligne explique la place des glucocorticoïdes au long cours dans la PCE : la maladie guérit radiologiquement, mais elle revient. La deuxième montre qu’une forme d’apparence plus grave, la PAE, a un meilleur pronostic à long terme. Dans une cohorte de 62 PCE suivies à la Mayo Clinic, 37 % ont toutefois développé une fibrose, le plus souvent dans les deux ans ; l’âge plus avancé et le sexe masculin la prédisaient, l’asthme semblait protecteur (Previtero, 2026).</p><div class="key"><b>À retenir.</b> La PCE touche surtout la femme asthmatique non fumeuse et récidive ; la PAE touche l’adulte jeune qui vient de commencer à fumer et ne récidive pas. Les données suisses manquent.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, Orphanet J Rare Dis 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9772920/" target="_blank" rel="noopener">Marchand et al., 62 cas, Medicine 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12403693/" target="_blank" rel="noopener">Philit et al., 22 cas, 2002</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., recommandation européenne sur la granulomatose éosinophilique, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., Eur Respir J 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., Eur Respir Rev 2026</a>.</p></section>
<section class="ilot" id="j82-3"><h2><span class="n">3</span>De l’interleukine 5 à l’alvéole inondée</h2><p>À l’état normal, moins de 1 % des éosinophiles de l’organisme circulent dans le sang, où ils représentent moins de 5 % des leucocytes ; la plupart résident dans les muqueuses, surtout digestives (Jackson, 2022). Ils naissent dans la moelle osseuse sous l’effet de l’<button class="w" data-justification="1" data-k="j82-il5">interleukine 5 (récepteur, cellules productrices)</button>, produite par les lymphocytes Th2, les cellules ILC2 et les mastocytes.</p><p>La maladie commence lorsqu’un stimulus active la réponse de type 2 : un allergène, une larve de parasite, un champignon qui colonise les bronches, un médicament ou la fumée. L’excès d’IL-5 augmente la production, la sortie médullaire et la survie des éosinophiles ; les chimiokines les attirent dans l’alvéole. Activés, ils libèrent des <button class="w" data-justification="1" data-k="j82-granules">protéines granulaires cytotoxiques (protéine basique majeure, protéine cationique, peroxydase)</button> qui lèsent l’épithélium et l’endothélium. L’interstitium et l’alvéole se remplissent d’éosinophiles : la DLCO baisse et une hypoxémie apparaît (Marchand et Cordier, 2006).</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Chaîne physiopathologique des pneumopathies à éosinophiles, du stimulus à l’hypoxémie et à la fibrose" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="10" y="20" width="140" height="56" rx="6"/><rect x="180" y="20" width="140" height="56" rx="6"/><rect x="350" y="20" width="140" height="56" rx="6"/><rect x="520" y="20" width="150" height="56" rx="6"/><rect x="350" y="140" width="140" height="56" rx="6"/><rect x="520" y="140" width="150" height="56" rx="6"/><path d="M150 48h28M320 48h28M490 48h28M420 76v62M490 168h28"/><path d="M172 43l6 5-6 5M342 43l6 5-6 5M512 43l6 5-6 5M415 132l5 6 5-6M512 163l6 5-6 5"/></g><g fill="#222"><text x="20" y="42">Stimulus</text><text x="20" y="62">allergène, larve,</text><text x="20" y="74" font-size="11">champignon, tabac</text><text x="190" y="42">Réponse de type 2</text><text x="190" y="62">Th2, ILC2 : IL-5</text><text x="360" y="42">Éosinophiles</text><text x="360" y="62">moelle → alvéole</text><text x="530" y="42">Granules libérés</text><text x="530" y="62">épithélium lésé</text><text x="360" y="162">Alvéole infiltrée</text><text x="360" y="182">hypoxémie</text><text x="530" y="162">Persistance</text><text x="530" y="182">fibrose possible</text></g></svg><figcaption>Figure 1 — Du stimulus à la lésion alvéolaire. La même chaîne s’applique à la plupart des formes ; seul le stimulus change, et c’est lui que le médecin recherche. Schéma pédagogique.</figcaption></figure><p>Trois variations expliquent les différences cliniques. Dans la PCE, l’infiltrat touche aussi les voies aériennes : 68 % des patients ont un trouble ventilatoire, obstructif chez la moitié d’entre eux (Marchand, 1998). Dans l’<button class="w" data-justification="1" data-k="j82-abpa">aspergillose bronchopulmonaire allergique (mécanisme)</button>, la réaction vise un champignon qui colonise des bronches asthmatiques ; les bouchons muqueux dilatent les bronches proximales. Dans la granulomatose éosinophilique, une vascularite des petits vaisseaux s’ajoute à l’infiltration tissulaire. Lorsque l’inflammation persiste ou récidive, le TGF-β et l’IL-13 des éosinophiles activent les fibroblastes, ce qui rend compte des <button class="w" data-justification="1" data-k="j82-fibrose">formes fibrosantes de PCE (données 2026)</button>.</p><div class="key"><b>À retenir.</b> Une éosinophilie pulmonaire est une réponse de type 2 qui a trouvé son organe. Supprimer le stimulus, réduire l’IL-5 ou éteindre l’inflammation par un glucocorticoïde agissent sur trois maillons différents de la même chaîne.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9489126/" target="_blank" rel="noopener">Jackson, Akuthota et Roufosse, Eur Respir Rev 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9772920/" target="_blank" rel="noopener">Marchand et al., 1998</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></section>
<section class="ilot" id="j82-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Une pneumopathie à éosinophiles n’est dite idiopathique qu’après une enquête méticuleuse sur les médicaments, les drogues, les expositions et les infections, surtout parasitaires (Cottin, 2023). Le tableau suivant met en regard chaque cause et l’indice qui doit la faire évoquer.</p><table class="t"><tr><th>Cause</th><th>Indice anamnestique</th><th>Source</th></tr><tr><td><button class="w" data-justification="1" data-k="j82-medicaments">Médicaments</button> : AINS, sulfasalazine, minocycline, cotrimoxazole, daptomycine</td><td>Début du médicament quelques semaines avant ; daptomycine : deux à quatre semaines</td><td>Marchand 2006 ; information Cubicin®</td></tr><tr><td><button class="w" data-justification="1" data-k="j82-tabac">Tabac</button></td><td>Premières cigarettes ou reprise après une abstinence</td><td>De Giacomi 2017</td></tr><tr><td><button class="w" data-justification="1" data-k="j82-parasites">Helminthes</button> : <i>Ascaris</i>, <i>Toxocara</i>, <i>Strongyloides</i>, schistosomes, filaires</td><td>Migration, voyage tropical, éosinophilie connue</td><td>Marchand 2006 ; Cordaillat 2025</td></tr><tr><td><i>Aspergillus</i></td><td>Asthme ou mucoviscidose, bouchons muqueux expectorés</td><td>Agarwal 2024</td></tr><tr><td>Radiothérapie mammaire</td><td>PCE une à dix mois après l’irradiation</td><td>Cottin 2004</td></tr><tr><td>Hémopathie clonale</td><td>Hyperéosinophilie persistante sans cause réactive</td><td>Valent 2023</td></tr></table><p>Le tableau se lit en commençant par la colonne de gauche, dans cet ordre, car les premières causes sont les plus fréquentes et les plus faciles à supprimer. Un adulte de 20 ans hospitalisé pour une détresse respiratoire fébrile une semaine après sa première cigarette coche la deuxième ligne. Une patiente de 68 ans irradiée pour un cancer du sein il y a quatre mois, asthmatique, coche la cinquième : dans la série de Cottin, l’intervalle médian était de 3,5 mois.</p><p>L’asthme et l’atopie sont le terrain dominant de la PCE, de l’aspergillose et de la granulomatose éosinophilique. Dans cette dernière, l’exposition à la silice, aux solvants et aux travaux agricoles augmente le risque, alors que le tabagisme le diminue (Emmi, 2023). Une association entre <button class="w" data-justification="1" data-k="j82-montelukast">montélukast et granulomatose éosinophilique (débat)</button> a été rapportée ; son rôle causal reste discuté.</p><div class="key"><b>À retenir.</b> Avant le mot « idiopathique », le médecin a éliminé un médicament, le tabac, un parasite, <i>Aspergillus</i>, une irradiation et une hémopathie.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37055090/" target="_blank" rel="noopener">Cottin, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28286263/" target="_blank" rel="noopener">De Giacomi et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/14738224/" target="_blank" rel="noopener">Cottin et al., Eur Respir J 2004</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40313018/" target="_blank" rel="noopener">Cordaillat et al., Rev Med Suisse 2025</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cubicin®, Swissmedic (AIPS, mise à jour 11.2022), consultée le 09.10.2026</a>.</p></section>
<section class="ilot" id="j82-5"><h2><span class="n">5</span>Interroger pour trouver la cause</h2><p>L’anamnèse est l’examen le plus rentable, car elle seule révèle la plupart des causes curables. Le médecin la conduit dans un ordre fixe.</p><h3>Antécédents et expositions</h3><p>Il recherche un <button class="w" data-justification="1" data-k="j82-asthme">asthme (ancienneté, sévérité, aggravation récente)</button>, une rhinosinusite avec polypes, une liste exhaustive des <button class="w" data-justification="1" data-k="j82-medicaments">médicaments des six derniers mois</button>, le statut tabagique précis avec la date de la première ou de la dernière cigarette, une <button class="w" data-justification="1" data-k="j82-voyage">origine ou un séjour en zone tropicale</button>, une radiothérapie thoracique et une maladie hématologique connue.</p><h3>Symptômes</h3><p>Dans la PCE, la toux et la dyspnée sont constantes ; une respiration sifflante existe chez environ la moitié des patients ; l’asthénie, l’amaigrissement, les sueurs nocturnes et la fièvre sont fréquents. Les symptômes durent en général environ un mois avant le diagnostic (Marchand et Cordier, 2006). La PAE s’installe en moins de deux semaines, avec fièvre, dyspnée intense et souvent douleur thoracique pleurale. Le syndrome de Löffler associe toux sèche, sifflements, dyspnée, parfois hémoptysie et fièvre (Hoenigl, 2010).</p><div class="two"><div class="card"><b>Forme typique</b><p>Une femme asthmatique non fumeuse de 45 ans décrit depuis un mois une toux, une dyspnée croissante, des sueurs nocturnes et un amaigrissement. Deux antibiotiques ont échoué. C’est la présentation d’une PCE.</p></div><div class="card"><b>Formes trompeuses</b><p>Un homme de 22 ans en détresse respiratoire fébrile, sans éosinophilie sanguine, paraît atteint d’une pneumonie sévère : c’est une PAE si le lavage montre des éosinophiles. Un asthme qui s’aggrave malgré le traitement, puis des paresthésies d’un pied, annoncent une granulomatose éosinophilique. Un migrant asymptomatique avec 1,2 G/L éosinophiles porte souvent une helminthiase.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Le médecin interroge sur les médicaments « habituels » et oublie l’antibiotique de la semaine précédente, l’anti-inflammatoire en vente libre ou la cigarette électronique. L’interrogatoire doit nommer chaque catégorie.</div><div class="key"><b>À retenir.</b> Asthme, médicaments, tabac, voyage, irradiation : cinq questions orientent la majorité des diagnostics. La durée des symptômes distingue d’emblée la PAE, de moins d’un mois, de la PCE, qui évolue depuis plusieurs semaines.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20924692/" target="_blank" rel="noopener">Hoenigl et al., ascaridiose pulmonaire en Autriche, 2010</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></section>
<section class="ilot" id="j82-6"><h2><span class="n">6</span>Examiner au-delà du poumon</h2><p>L’examen thoracique est peu spécifique ; sa vraie valeur est ailleurs. La PCE ne comporte, par définition, aucune atteinte extrathoracique : tout signe hors du poumon oriente vers une granulomatose éosinophilique ou un syndrome hyperéosinophilique (Marchand et Cordier, 2006).</p><div class="two"><div class="card"><b>État général et thorax</b><p>Le médecin mesure la fréquence respiratoire, la <button class="w" data-justification="1" data-k="j82-hypoxemie">SpO₂ au repos et à l’effort</button> et la température. Une tachypnée avec hypoxémie profonde évoque une PAE : dans la série de Philit, 14 patients sur 22 ont été ventilés mécaniquement. L’auscultation entend des crépitants inspiratoires ou des sibilants expiratoires ; aucun n’est spécifique. Un épanchement pleural, rare dans la PCE, est fréquent dans la PAE.</p></div><div class="card"><b>Signes extrathoraciques d’alarme</b><p>Le médecin recherche un <button class="w" data-justification="1" data-k="j82-neuro">déficit moteur ou sensitif d’un tronc nerveux</button>, un <button class="w" data-justification="1" data-k="j82-coeur">signe d’atteinte cardiaque</button>, un purpura palpable, des polypes nasaux et des douleurs abdominales. Chacun fait suspecter une maladie systémique et modifie l’urgence et le traitement.</p></div></div><p>Exemple : un homme de 52 ans asthmatique, hospitalisé pour des opacités pulmonaires éosinophiliques, se plaint d’un pied qui « tombe » à droite. Ce déficit moteur d’un tronc nerveux évoque une mononévrite multiple, présente chez 50 à 70 % des patients atteints de granulomatose éosinophilique (Emmi, 2023). Il fait passer du diagnostic de PCE à celui de granulomatose éosinophilique avec atteinte neurologique, qui relève d’une induction plus intense.</p><div class="key"><b>À retenir.</b> Dans une éosinophilie pulmonaire, l’examen extrathoracique décide de la gravité. Nerfs, cœur, peau et sinus sont examinés chez chaque patient.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p><button class="pareto-btn ui" data-k="pareto-j82-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
