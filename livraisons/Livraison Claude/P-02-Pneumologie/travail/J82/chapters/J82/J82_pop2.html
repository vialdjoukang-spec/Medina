<template data-pop="j82-d-pred" data-title="Glucocorticoïdes : prednisone, prednisolone, méthylprednisolone"><p><b>Mécanisme.</b> Anti-inflammatoires puissants et non spécifiques. Dans la PCE, les symptômes et l’éosinophilie sanguine régressent en quelques heures et l’imagerie se normalise en quelques jours (Marchand et Cordier, 2006).</p><p><b>Statut suisse.</b> L’information de Solu-Medrol® cite la pneumopathie à éosinophiles, ou syndrome de Loeffler, ne pouvant être contrôlée par d’autres traitements. Celle de Prednisone Streuli® cite l’asthme bronchique sévère, avec une dose usuelle de 5 à 60 mg par jour, des doses plus élevées étant admises à court terme dans les formes aiguës sévères.</p><p><b>Posologie dans ce cours.</b> PCE : 0,5 à 1 mg/kg par jour, décroissance sur 6 à 12 mois. Aspergillose : prednisolone 0,5 mg/kg par jour, décroissance sur 4 mois. Granulomatose éosinophilique sévère : méthylprednisolone 500 à 1000 mg par jour pendant 3 jours, puis 0,75 à 1 mg/kg par jour (Emmi, 2023). Au-delà de 250 mg, la perfusion dure au moins 30 minutes ; des arythmies et des arrêts cardiaques ont suivi l’injection de plus de 0,5 g en moins de 10 minutes (Solu-Medrol®).</p><p><b>Effets indésirables et précautions.</b> Syndrome de Cushing, ostéoporose, diabète, infections, troubles psychiatriques. Un traitement de plus de deux semaines peut freiner l’axe corticotrope ; au-delà de 8 à 10 jours, l’arrêt se fait par paliers (Prednisone Streuli®). Les inhibiteurs puissants du CYP3A4, dont l’itraconazole, augmentent l’exposition. Une strongyloïdose connue ou suspectée impose la plus grande prudence. Les vaccins vivants sont évités pendant la corticothérapie.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Prednisone Streuli® (06.2026), Spiricort® (06.2026), Solu-Medrol® (08.2025), Swissmedic (AIPS), consultées le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1464381/" target="_blank" rel="noopener">Marchand et Cordier, 2006</a> ; <a href="https://www.nature.com/articles/s41584-023-00958-w" target="_blank" rel="noopener">Emmi et al., 2023</a>.</p></template>
<template data-pop="j82-d-albendazole" data-title="Albendazole et mébendazole"><p><b>Mécanisme.</b> L’albendazole, dérivé du benzimidazole, inhiberait la polymérisation de la tubuline des helminthes ; il bloque l’absorption du glucose, épuise leurs réserves énergétiques, les immobilise puis les tue. Il agit sur les parasites intestinaux et tissulaires (Zentel®). Le mébendazole agit localement dans la lumière intestinale, sur les microtubules de l’intestin du ver (Vermox®).</p><p><b>Indications et doses suisses.</b> Albendazole : ascaridiose, 400 mg en prise unique chez l’adulte et l’enfant de plus de 2 ans ; strongyloïdose, 400 mg par jour pendant 3 jours. Cette dernière posologie ne vaut que pour l’infection intestinale et ne convient pas à l’immunodéprimé atteint d’une forme viscérale. Mébendazole : ascaris et strongyloïdes, 100 mg matin et soir pendant 3 jours.</p><p><b>Contre-indications.</b> L’albendazole est contre-indiqué pendant la grossesse ; une contraception fiable est requise chez la femme en âge de procréer. Le mébendazole n’est pas administré pendant la grossesse, surtout au premier trimestre, sauf nécessité stricte.</p><div class="key"><b>Lecture.</b> Dans un syndrome de Löffler, les larves migrent dans les tissus ; l’action tissulaire revendiquée par l’albendazole, et non l’action intraluminale du mébendazole, correspond à cette phase. Les deux cas autrichiens ont toutefois guéri sous l’un ou l’autre (Hoenigl, 2010).</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Zentel® (10.2025) et Vermox® 100 mg (07.2025), Swissmedic (AIPS), consultées le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20924692/" target="_blank" rel="noopener">Hoenigl et al., 2010</a>.</p></template>
<template data-pop="j82-d-ivermectine" data-title="Ivermectine"><p><b>Usage.</b> L’algorithme des Hôpitaux universitaires de Genève et de l’Institut tropical et de santé publique suisse prescrit l’ivermectine à 200 µg/kg en cas de sérologie ou d’examen de selles positif, et empiriquement si aucun examen n’est disponible ou si l’urgence ne permet pas d’attendre. Une seule dose suffit chez le patient non immunodéprimé ; deux à quatre doses sont nécessaires en cas d’immunosuppression ou d’exposition récente (Carnino, 2021).</p><p><b>Statut suisse.</b> Aucune information professionnelle suisse de l’ivermectine par voie orale n’a été trouvée dans la base AIPS consultée via AmiKo le 09.10.2026. Les contre-indications, interactions et précautions ne peuvent donc pas être citées d’après un texte suisse : c’est une lacune nommée. Le médecin se procure le médicament et ses données auprès de la pharmacie hospitalière ou d’un centre de médecine tropicale.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8704417/" target="_blank" rel="noopener">Carnino et al., Trop Med Infect Dis 2021</a>.</p></template>
<template data-pop="j82-d-itra" data-title="Itraconazole"><p><b>Mécanisme et place.</b> Triazole antifongique. Dans l’aspergillose bronchopulmonaire allergique, il réduit la colonisation fongique ; son effet est comparable à celui des glucocorticoïdes, plus lent, avec une meilleure tolérance (Agarwal, 2024). Il est recommandé en première intention à la place de la prednisolone, notamment si les glucocorticoïdes sont contre-indiqués, et au long cours dans les formes dépendantes des traitements.</p><p><b>Posologie.</b> Gélules à 100 mg. Aspergillose bronchopulmonaire allergique : 400 mg par jour en deux prises pendant 4 mois, au moment des repas, avec un taux résiduel d’au moins 0,5 mg/L contrôlé à 2 semaines et à 3 mois (Agarwal, 2024). L’information suisse indique une prise immédiatement après un repas complet et réserve l’aspergillose à l’échec ou à l’intolérance du traitement standard.</p><p><b>Contre-indications et précautions (Sporanox®).</b> Insuffisance cardiaque présente ou passée, sauf infection menaçant la vie, car l’itraconazole est inotrope négatif ; nombreux substrats du CYP3A4, dont ceux qui allongent le QT ; grossesse, sauf situation mettant la vie en danger. Des hépatotoxicités graves et des pertes auditives ont été rapportées.</p><div class="trap"><span class="k">Piège</span> L’itraconazole associé à la fluticasone ou au budésonide inhalés peut provoquer un syndrome de Cushing ou une insuffisance surrénale.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Sporanox® (11.2024), Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></template>
<template data-pop="j82-d-mepo" data-title="Mépolizumab (Nucala®)"><p><b>Mécanisme.</b> Anticorps monoclonal humanisé dirigé contre l’IL-5, cytokine principale de la croissance, de la différenciation, du recrutement, de l’activation et de la survie des éosinophiles. À 300 mg dans la granulomatose éosinophilique, il réduit les éosinophiles sanguins de 83 % par rapport au placebo.</p><p><b>Indications suisses utiles ici.</b> Granulomatose éosinophilique récidivante ou réfractaire de l’adulte, préalablement stabilisée par corticothérapie systémique et exigeant un traitement d’entretien : 300 mg sous-cutanés toutes les 4 semaines. Syndrome hyperéosinophilique sans fusion FIP1L1-PDGFRA dès 12 ans : 300 mg toutes les 4 semaines. Asthme sévère à éosinophiles : 100 mg toutes les 4 semaines. La PCE n’est pas une indication ; les séries publiées utilisent surtout 100 mg toutes les 4 semaines (Previtero, 2026).</p><p><b>Preuves.</b> Essai MIRRA : 28 % de rémission d’au moins 24 semaines contre 3 % sous placebo. Dans le syndrome hyperéosinophilique, poussées ou sorties d’étude chez 28 % contre 56 % sous placebo (Jackson, 2022).</p><p><b>Précautions.</b> Traiter une helminthiase avant la première dose ; ne pas utiliser dans une exacerbation aiguë ; ne pas arrêter brutalement les corticostéroïdes ; réactions d’hypersensibilité immédiates ou retardées ; zona occasionnel. Non étudié dans les atteintes menaçant un organe ou la vie. Grossesse : seulement en cas de nécessité absolue.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Nucala® (12.2025), Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5548295/" target="_blank" rel="noopener">Wechsler et al., MIRRA, 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9489126/" target="_blank" rel="noopener">Jackson et al., 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., 2026</a>.</p></template>
<template data-pop="j82-d-benra" data-title="Benralizumab (Fasenra®)"><p><b>Mécanisme.</b> Anticorps monoclonal humanisé non fucosylé qui se lie à la chaîne alpha du récepteur de l’IL-5, exprimée par les éosinophiles et les basophiles. L’absence de fucose renforce sa liaison aux cellules NK, qui détruisent les cellules ciblées par cytotoxicité dépendante des anticorps. Dans la granulomatose éosinophilique, la déplétion sanguine est visible dès la première semaine.</p><p><b>Indications suisses utiles ici.</b> Granulomatose éosinophilique récidivante ou réfractaire de l’adulte sans atteinte active menaçant un organe ou la vie : 30 mg sous-cutanés toutes les 4 semaines. Syndrome hyperéosinophilique sans fusion FIP1L1-PDGFRA dès 12 ans : 30 mg toutes les 4 semaines. Asthme sévère : 30 mg toutes les 4 semaines pour les trois premières doses, puis toutes les 8 semaines. Dans la PCE, hors indication, les séries utilisent ce schéma de l’asthme (Previtero, 2026).</p><p><b>Preuves.</b> Essai MANDARA : non-infériorité face au mépolizumab, arrêt des glucocorticoïdes oraux chez 41 % contre 26 %.</p><p><b>Précautions.</b> Traiter une helminthiase avant la première dose et interrompre le traitement si elle ne répond pas. Céphalées chez 17 % des patients atteints de granulomatose éosinophilique. Grossesse : seulement en cas de nécessité absolue ; le passage placentaire augmente aux deuxième et troisième trimestres.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Fasenra® (03.2026), Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38393328/" target="_blank" rel="noopener">Wechsler et al., MANDARA, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13343205/" target="_blank" rel="noopener">Previtero et al., 2026</a>.</p></template>
<template data-pop="j82-d-omali" data-title="Omalizumab (Xolair®) dans l’aspergillose"><p><b>Mécanisme.</b> Anticorps anti-IgE. Comme l’aspergillose bronchopulmonaire allergique s’accompagne d’IgE très élevées, c’est la biothérapie la plus étudiée dans cette maladie : amélioration des symptômes, moins d’exacerbations et d’hospitalisations, meilleure fonction, épargne cortisonique. Le seul essai randomisé croisé, de 13 patients, a montré moins d’exacerbations que le placebo (Agarwal, 2024).</p><p><b>Statut.</b> L’information suisse autorise l’omalizumab dans l’asthme allergique, l’urticaire chronique spontanée et la polypose nasale ; son emploi dans l’aspergillose est hors indication. Le groupe de travail de 2024 le réserve, comme les autres biothérapies, aux formes dépendantes des traitements, jamais en première intention.</p><p><b>Précaution.</b> L’information Xolair® rappelle qu’un asthme allergique sévère peut rarement se compliquer d’une granulomatose éosinophilique. Pendant la grossesse, l’association à des glucocorticoïdes oraux augmente le risque d’accouchement prématuré (Agarwal, 2024).</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Xolair® (03.2025), Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10991853/" target="_blank" rel="noopener">Agarwal et al., 2024</a>.</p></template>
<template data-pop="j82-d-imatinib" data-title="Imatinib (Glivec®) dans le syndrome hyperéosinophilique"><p><b>Mécanisme et place.</b> Inhibiteur de tyrosine kinase. Dans les hyperéosinophilies clonales avec réarrangement d’un récepteur du facteur de croissance dérivé des plaquettes, dont la fusion FIP1L1-PDGFRA, il obtient une rémission complète chez presque tous les patients (Valent, 2023).</p><p><b>Indication et dose suisses.</b> Syndrome hyperéosinophilique de l’adulte, entre autres hémopathies avec éosinophilie : 100 mg par jour, augmentés jusqu’à 400 mg en l’absence d’effet indésirable si la réponse est insuffisante. Le traitement est suspendu si les neutrophiles tombent sous 1,0 G/L ou les plaquettes sous 50 G/L.</p><div class="alert"><b>Cœur.</b> Des chocs cardiogéniques et des insuffisances ventriculaires gauches ont été rapportés au début du traitement d’un syndrome hyperéosinophilique avec atteinte cardiaque. Une troponine et une échocardiographie sont envisagées avant le début ; si elles sont anormales, un glucocorticoïde à 1 à 2 mg/kg pendant une à deux semaines accompagne l’imatinib.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glivec® (07.2026), Swissmedic (AIPS), consultée le 09.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9797433/" target="_blank" rel="noopener">Valent et al., 2023</a>.</p></template>
<template data-pop="pareto-j82-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j82-0,j82-1,j82-2,j82-3,j82-4,j82-5,j82-6"></p><ul><li>Éosinophilie sanguine &gt; 0,5 G/L ; hyperéosinophilie ≥ 1,5 G/L ; éosinophilie alvéolaire pathologique &gt; 25 %.</li><li>Trois groupes : cause identifiable, maladie systémique, forme idiopathique (Löffler, PAE, PCE).</li><li>PCE : femme asthmatique non fumeuse, opacités périphériques, rechutes ; PAE : adulte jeune, tabac récent, détresse respiratoire, pas de rechute.</li><li>Mécanisme : réponse de type 2, IL-5, éosinophiles alvéolaires, protéines granulaires cytotoxiques ; fibrose possible si l’inflammation persiste.</li><li>Causes à éliminer : médicaments, tabac, helminthes, <i>Aspergillus</i>, radiothérapie, hémopathie.</li><li>Interroger sur l’asthme, les médicaments, le tabac, les voyages et l’irradiation.</li><li>Tout signe extrathoracique (nerf, cœur, peau, sinus) oriente vers une granulomatose éosinophilique ou un syndrome hyperéosinophilique.</li></ul></template>
<template data-pop="pareto-j82-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j82-7"></p><ul><li>Quatre temps : prouver l’éosinophilie pulmonaire, chercher une cause, chercher une maladie systémique, éliminer le plus grave.</li><li>Hémogramme avant tout glucocorticoïde ; lavage si le sang ne conclut pas.</li><li>Sérologie de strongyloïdose et selles si exposition ; IgE d’<i>Aspergillus</i> chez l’asthmatique ; ANCA, rein et cœur dans les formes systémiques.</li><li>La pneumopathie organisée cryptogénique se distingue par un lavage lymphocytaire.</li></ul></template>
<template data-pop="pareto-j82-tt" data-title="Pareto — Urgences, traitement et suivi"><p class="ratio" data-cover="j82-8,j82-9,j82-10,j82-11"></p><ul><li>Urgences : PAE hypoxémiante, granulomatose avec atteinte d’organe, cœur du syndrome hyperéosinophilique, hyperinfection à <i>Strongyloides</i>.</li><li>Exclure ou traiter la strongyloïdose avant tout glucocorticoïde (ivermectine 200 µg/kg).</li><li>PCE : prednisone 0,5 à 1 mg/kg, 6 à 12 mois ; rechute jusqu’à 50 % ; anti-IL-5 hors indication si corticodépendance.</li><li>PAE : oxygénation, arrêt du tabac, glucocorticoïde ; pas de rechute.</li><li>Löffler : antiparasitaire ; aspergillose : prednisolone ou itraconazole 4 mois.</li><li>Granulomatose éosinophilique : voir M31 ; mépolizumab ou benralizumab dans les formes récidivantes sans menace d’organe.</li><li>Suivi : rechute, asthme, os, fibrose ; IgE totales dans l’aspergillose ; cœur dans la granulomatose.</li><li>Grossesse : glucocorticoïdes oui, azoles et biothérapies non.</li></ul></template>
<template data-pop="pareto-j82-crit" data-title="Pareto — Critères et paramètres"><p class="ratio" data-cover="j82-12"></p><ul><li>PCE : symptômes &gt; 2 semaines, éosinophiles ≥ 40 % au lavage ou ≥ 1 G/L, opacités périphériques, aucune cause.</li><li>PAE : insuffisance respiratoire fébrile de moins d’un mois, éosinophilie au lavage.</li><li>Aspergillose : IgE spécifiques ≥ 0,35 kUA/L, IgE totales ≥ 500 UI/mL, deux critères complémentaires.</li><li>Granulomatose éosinophilique : score ACR/EULAR ≥ 6 ; syndrome hyperéosinophilique : ≥ 1,5 G/L deux fois et atteinte d’organe.</li></ul></template>
<template data-pop="pareto-j82-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j82-e-1,j82-e-2,j82-e-3,j82-e-4"></p><ul><li>Référence : formule du lavage dans un tableau compatible ; biopsie seulement si atypique.</li><li>Seuils : 0,5 et 1,5 G/L ; 25 et 40 % ; 0,35 kUA/L et 500 UI/mL.</li><li>Imagerie : périphérique (PCE), diffuse avec épanchements (PAE), nodules à halo (Löffler), bronchectasies proximales (aspergillose).</li><li>ANCA présents dans 30 à 40 % des granulomatoses éosinophiliques seulement.</li><li>Sérologie de strongyloïdose moins sensible chez l’immunodéprimé.</li></ul></template>
<template data-pop="pareto-j82-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j82-p-1,j82-p-2,j82-p-3,j82-p-4"></p><ul><li>La classe suit la forme : antiparasitaire, glucocorticoïde, antifongique, anti-IL-5.</li><li>Anti-IL-5 autorisés en Suisse dans la granulomatose éosinophilique et le syndrome hyperéosinophilique ; PCE hors indication.</li><li>Itraconazole : inhibiteur du CYP3A4, Cushing avec corticostéroïdes inhalés, QT, insuffisance cardiaque, grossesse.</li><li>Imatinib : regarder le cœur avant de débuter.</li><li>Daptomycine, AINS, sulfasalazine, minocycline, cotrimoxazole et dupilumab peuvent induire ou démasquer la maladie.</li></ul></template>
