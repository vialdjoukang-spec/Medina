<template data-pop="j86-echographie" data-title="Échographie thoracique"><p class="lab">Ce qu’elle montre</p><p>Chez le patient assis, la sonde explore les récessus postérieurs et latéraux. Elle mesure le volume du liquide et apprécie son échogénicité, ses cloisons et l’épaississement pleural. Un liquide échogène ou cloisonné est presque toujours un exsudat ; un liquide anéchogène peut être simple ou infecté.</p><p class="lab">Usage</p><p>La BTS 2023 exige, par une recommandation forte, que toute ponction pleurale soit guidée par l’imagerie, car ce guidage réduit les pneumothorax et les ponctions blanches.</p><div class="key"><b>Piège.</b> L’absence de cloisons n’exclut pas une infection ; seule la ponction mesure le pH.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-tdm" data-title="Scanner thoracique injecté"><p class="lab">Signes de l’empyème</p><p>La collection est lenticulaire ; les feuillets pariétal et viscéral, rehaussés, s’écartent autour du liquide (signe de la plèvre dédoublée) ; la graisse extrapleurale s’épaissit.</p><p class="lab">Apports</p><p>Le scanner dénombre les logettes, guide un drain et montre la pneumonie, un abcès, une tumeur, une perforation œsophagienne ou une collection médiastinale.</p><p class="lab">Limite</p><p>Le rehaussement pleural n’est pas spécifique de l’infection : il s’observe aussi dans les épanchements tumoraux.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-ponction" data-title="Ponction pleurale diagnostique"><p class="lab">Technique et prélèvements</p><p>La ponction, guidée par échographie, longe le bord supérieur de la côte pour épargner le paquet vasculonerveux intercostal. Une seringue sans héparine résiduelle ni anesthésique local sert au pH, analysé immédiatement sur un analyseur de gaz du sang. Des tubes servent au glucose, à la lactate déshydrogénase, aux protéines, à la cytologie, au Gram et à la culture. Des flacons d’hémoculture sont inoculés au lit du patient, comme la BTS le recommande fortement, car ils préservent les germes exigeants et augmentent le rendement.</p><div class="key"><b>Erreur fréquente.</b> Envoyer la seringue au laboratoire central et la mesurer une heure plus tard : le dioxyde de carbone s’échappe et le pH monte faussement.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-seuils-ph" data-title="Mesure et seuils du pH pleural"><p class="lab">Fiabilité</p><p>L’héparine et la lidocaïne, acides, abaissent faussement le pH ; un délai d’analyse l’élève par perte de dioxyde de carbone. Bandelettes et pH-mètres de laboratoire sont imprécis : la mesure se fait aussitôt sur un analyseur de gaz du sang. À défaut, un glucose &lt; 3,3 mmol/L sert de substitut.</p><div class="key"><b>Choix de la source.</b> La BTS 2023, recommandation la plus récente, retient « ≤ 7,2 » pour le drain ; des textes plus anciens, repris dans le cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>, écrivent « &lt; 7,2 ». La divergence ne concerne qu’un pH exactement égal à 7,2, pour lequel le seuil de la BTS 2023 est retenu.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-ldh" data-title="Lactate déshydrogénase pleurale"><p class="lab">Origine</p><p>Cette enzyme intracellulaire est libérée par les cellules détruites ; sa concentration mesure l’intensité de la lyse cellulaire, donc de l’inflammation.</p><p class="lab">Usage</p><p>Elle classe le liquide en exsudat (critères de Light) et, pour un pH entre 7,2 et 7,4, une valeur supérieure à 900 UI/L fait envisager un drain selon la BTS 2023.</p><p class="lab">Limite</p><p>Elle s’élève aussi dans les exsudats tumoraux et ne s’interprète qu’avec le pH, le glucose et la clinique.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-glucose" data-title="Glucose pleural"><p class="lab">Mécanisme</p><p>Le glucose pleural égale normalement le glucose plasmatique, car il traverse librement la plèvre. Dans l’infection, leucocytes et bactéries le consomment et la plèvre épaissie freine son entrée.</p><p class="lab">Seuils</p><p>Un glucose &lt; 3,3 mmol/L indique une infection pleurale probable lorsque le pH manque ; un glucose ≤ 4,0 mmol/L soutient l’indication du drain en zone intermédiaire (BTS 2023).</p><div class="key"><b>Piège.</b> La polyarthrite rhumatoïde abaisse fortement le glucose pleural sans infection.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-light" data-title="Critères de Light"><p class="lab">Règle</p><p>Un épanchement est un exsudat si au moins un critère est présent : rapport des protéines pleurales aux protéines sériques &gt; 0,5 ; rapport des lactate déshydrogénases pleurale et sérique &gt; 0,6 ; lactate déshydrogénase pleurale supérieure aux deux tiers de la limite supérieure de la normale sérique.</p><p class="lab">Mécanisme</p><p>L’exsudat traduit une plèvre ou des capillaires lésés ; le transsudat, un déséquilibre des pressions hydrostatique ou oncotique.</p><p class="lab">Limite</p><p>Très sensible, la règle classe à tort comme exsudats certains transsudats traités par diurétiques. Sa démarche complète est exposée dans le cours <a href="#/entry/J90">J90 — Épanchements pleuraux</a>.</p><p class="src">Références : <a href="https://doi.org/10.7326/0003-4819-77-4-507" target="_blank" rel="noopener">Light et al., 1972</a>.</p></template>
<template data-pop="j86-cancer-excave" data-title="Cancer bronchique excavé"><p class="lab">Arguments</p><p>Tabagisme, âge supérieur à 40 ans, absence de terrain d’inhalation, fièvre discrète, amaigrissement, hippocratisme, paroi épaisse et irrégulière et absence de régression sous antibiotique orientent vers la tumeur. Le carcinome épidermoïde est le type histologique qui s’excave le plus souvent.</p><p class="lab">Mécanisme et conduite</p><p>La tumeur se nécrose en son centre, ou obstrue une bronche en amont de laquelle se forme un abcès. Une bronchoscopie avec biopsie, ou une biopsie transthoracique, établit le diagnostic.</p><div class="key"><b>Erreur fréquente.</b> Attribuer à un abcès, chez un fumeur, une cavité qui ne régresse pas, sans contrôle endoscopique.</div><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-tuberculose" data-title="Tuberculose cavitaire"><p class="lab">Arguments</p><p>Une cavité des segments apicaux ou postérieurs des lobes supérieurs, une évolution sur des semaines, des sueurs nocturnes, un amaigrissement, des hémoptysies, une origine de forte endémie, un contact connu ou une immunodépression orientent vers la tuberculose.</p><p class="lab">Conduite</p><p>Trois expectorations sont analysées pour la recherche de bacilles acido-alcoolo-résistants, la culture et l’amplification génique ; l’isolement respiratoire est maintenu jusqu’à l’exclusion.</p><p class="lab">Conséquence</p><p>Un empyème tuberculeux sort du code J86 (A15–A16). Le traitement antituberculeux suit la preuve microbiologique ou une décision spécialisée, jamais une simple image cavitaire.</p></template>
<template data-pop="j86-empyeme-vs-abces" data-title="Empyème ou abcès : critères du scanner"><p class="lab">Empyème</p><p>Forme lenticulaire, angle obtus avec la paroi, paroi fine et régulière, plèvre dédoublée, poumon refoulé et vaisseaux déviés caractérisent l’empyème.</p><p class="lab">Abcès</p><p>Forme arrondie, angle aigu avec la paroi, paroi épaisse et irrégulière, siège intraparenchymateux et vaisseaux interrompus à son contact caractérisent l’abcès.</p><p class="lab">Conséquence pratique</p><p>L’empyème se draine par un drain thoracique ; l’abcès se traite d’abord par antibiotique, et un drain transpleural mal placé risque de créer une fistule bronchopleurale.</p></template>
<template data-pop="j86-mimes" data-title="Épanchements acides non infectieux"><p class="lab">Polyarthrite rhumatoïde</p><p>L’épanchement est chronique, à pH et glucose très bas, parfois pseudochyleux, chez un patient connu pour sa polyarthrite.</p><p class="lab">Cancer pleural avancé</p><p>Une charge tumorale élevée consomme le glucose ; la cytologie est souvent positive et le pronostic défavorable.</p><p class="lab">Rupture œsophagienne</p><p>La douleur suit des vomissements, l’épanchement siège à gauche et l’amylase salivaire du liquide est élevée : c’est une urgence chirurgicale.</p><div class="key"><b>Conséquence.</b> La BTS rappelle ces diagnostics devant un liquide acide qui ne s’inscrit pas dans une pneumonie.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-16s" data-title="Amplification de l’ADN ribosomique 16S"><p class="lab">Principe</p><p>Le gène de l’ARN ribosomique 16S existe chez toutes les bactéries ; ses régions variables identifient l’espèce après amplification et séquençage.</p><p class="lab">Valeur et limite</p><p>La méthode identifie des bactéries tuées par un antibiotique préalable ou incultivables, notamment des anaérobies. Elle ne fournit pas d’antibiogramme et peut détecter des contaminants : son résultat se confronte à la clinique.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-drain" data-title="Drain thoracique de petit calibre"><p class="lab">Recommandation</p><p>La BTS 2023 recommande un drain de 14 F ou moins pour le drainage initial de l’infection pleurale, posé sous imagerie.</p><p class="lab">Justification</p><p>Les petits drains se posent plus facilement et font moins souffrir ; avec des rinçages réguliers, ils évacuent le pus de manière comparable dans les données disponibles.</p><p class="lab">Surveillance</p><p>Le débit, l’aspect, le bullage, la douleur et la position à l’imagerie sont suivis. Un drain muet devant une collection persistante est obstrué, mal placé ou face à une collection cloisonnée.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-iet" data-title="Alteplase et dornase intrapleurales"><p class="lab">Protocole BTS 2023</p><p>Alteplase 10 mg et dornase alfa 5 mg sont instillées deux fois par jour pendant trois jours, lorsqu’une collection persiste après l’arrêt du débit du drain initial ; la recommandation est conditionnelle, par consensus. Selon des séries rétrospectives, 5 mg d’alteplase pourraient suffire ; cette dose convient au patient à risque hémorragique, notamment sous une anticoagulation qui ne peut être interrompue.</p><div class="key"><b>Contre-indications pratiques.</b> Fistule bronchopleurale, saignement actif, trouble majeur de l’hémostase. Le consentement du patient est recueilli.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-mist2" data-title="Essai MIST2 (2011)"><p class="lab">Plan</p><p>Cet essai randomisé en double aveugle et en plan factoriel 2 × 2 a inclus 210 patients dans 11 centres britanniques.</p><p class="lab">Résultats</p><p>L’opacité pleurale a diminué au septième jour de 29,5 % avec l’association contre 17,2 % sous placebo, soit une différence de 7,9 points. Le recours chirurgical à trois mois est passé de 16 % à 4 % et la durée d’hospitalisation a été réduite de 6,7 jours. Aucune molécule seule n’a fait mieux que le placebo ; la dornase seule a même porté le recours chirurgical à 39 %. Les événements indésirables ne différaient pas significativement.</p><p class="lab">Limites</p><p>Le critère principal était radiologique ; l’essai n’était pas dimensionné pour la mortalité.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1012740" target="_blank" rel="noopener">Rahman et al., New England Journal of Medicine 2011;365:518-26</a>.</p></template>
<template data-pop="j86-mist1" data-title="Essai MIST1 (2005)"><p class="lab">Plan</p><p>454 patients atteints d’infection pleurale ont reçu de la streptokinase intrapleurale, 250 000 UI deux fois par jour pendant trois jours, ou un placebo.</p><p class="lab">Résultat</p><p>Le décès ou la chirurgie à trois mois sont survenus chez 31 % des patients sous streptokinase contre 27 % sous placebo. Aucun bénéfice n’a été observé sur la mortalité, la chirurgie, l’image ou la durée d’hospitalisation, au prix de davantage d’effets indésirables graves.</p><p class="lab">Leçon</p><p>Dissoudre la fibrine ne suffit pas, car la viscosité due à l’ADN persiste ; cette hypothèse a conduit à MIST2.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa042473" target="_blank" rel="noopener">Maskell et al., New England Journal of Medicine 2005</a>.</p></template>
<template data-pop="j86-vats" data-title="Chirurgie thoracique vidéo-assistée"><p class="lab">Gestes et place</p><p>Le chirurgien débride les logettes, lave la cavité et, si le poumon est trappé, pratique une décortication. La BTS 2023 ne recommande pas la chirurgie d’emblée à la place du drain ; lorsque la chirurgie devient nécessaire, elle préfère la voie vidéo-assistée à la thoracotomie si elle permet un nettoyage complet. Les indications habituelles sont un sepsis persistant malgré drainage et enzymes, une collection organisée, un poumon trappé symptomatique ou une fistule.</p><div class="key"><b>Limite.</b> L’ERS/ESTS demande un avis chirurgical précoce, mais le moment optimal de l’intervention reste mal défini par les essais.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">ERS/ESTS 2023</a>.</p></template>
<template data-pop="j86-antibio-pleural" data-title="Antibiothérapie de l’infection pleurale"><p class="lab">Principe</p><p>Le spectre suit la bactériologie de Maskell : streptocoques et anaérobies dans l’infection communautaire ; staphylocoque résistant et bacilles à Gram négatif dans l’infection nosocomiale.</p><p class="lab">Choix pratiques</p><p>L’amoxicilline-acide clavulanique est le premier choix ; une céphalosporine associée au métronidazole ou, en cas d’allergie sévère, la clindamycine la remplacent. Un macrolide n’est ajouté que si un germe atypique est suspecté ; les aminosides sont évités.</p><div class="key"><b>Note suisse.</b> Les recommandations de la Société suisse d’infectiologie n’ont pas pu être lues pour l’empyème ; leur schéma de la pneumonie d’inhalation, cité dans le cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>, repose sur l’amoxicilline-acide clavulanique 2,2 g toutes les 8 heures par voie intraveineuse. Le protocole hospitalier local prime.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a> ; <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-duree" data-title="Durée de l’antibiothérapie pleurale"><p class="lab">Données</p><p>Aucun grand essai n’a fixé la durée. L’essai randomisé SLIM, mené chez 50 patients stabilisés sans chirurgie et au score RAPID ≤ 4, a comparé 14 à 21 jours à 28 à 42 jours : l’échec à six semaines a touché 16,7 % contre 12,5 % des patients, différence non significative. Un petit essai espagnol, deux contre trois semaines d’amoxicilline-acide clavulanique dans l’épanchement compliqué communautaire stabilisé, conclut dans le même sens.</p><p class="lab">Pratique et limite</p><p>La durée se décide sur le contrôle de la source, la clinique et l’imagerie, avec un relais oral précoce. Ces essais, trop petits pour démontrer l’équivalence, ne s’appliquent ni aux patients opérés ni aux patients instables.</p><p class="src">Références : <a href="https://doi.org/10.1183/23120541.00635-2022" target="_blank" rel="noopener">Hassan et al., essai SLIM, European Respiratory Journal Open Research 2023</a> ; <a href="https://doi.org/10.1183/20734735.0134-2023" target="_blank" rel="noopener">Skouras et al., synthèse des essais de durée, Breathe 2023</a>.</p></template>
<template data-pop="j86-antibio-abces" data-title="Antibiothérapie de l’abcès pulmonaire"><p class="lab">Choix</p><p>La couverture vise les anaérobies et les streptocoques : amoxicilline-acide clavulanique en première intention, clindamycine en cas d’allergie. Les aminosides, peu actifs dans la paroi chronique, ne sont pas recommandés.</p><p class="lab">Durée</p><p>La voie intraveineuse est maintenue 5 à 21 jours selon l’évolution, puis relayée par voie orale, pour un total de 28 à 48 jours dans les séries citées, jusqu’à disparition de la fièvre et de l’expectoration purulente.</p><p class="lab">Réponse attendue</p><p>La réponse à l’antibiotique se dessine en 3 à 4 jours, l’état général s’améliore en 4 à 7 jours et la radiographie se normalise en environ deux mois.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-drainage-abces" data-title="Drainage percutané et chirurgie de l’abcès"><p class="lab">Drainage percutané</p><p>Il est indiqué chez environ 11 à 21 % des patients après échec de l’antibiothérapie, devant un abcès volumineux ou sous tension, ou un sepsis persistant. Il est définitif chez environ 84 % des patients drainés, au prix d’environ 16 % de complications : pneumothorax, hémorragie, fistule bronchopleurale.</p><p class="lab">Chirurgie</p><p>La résection concerne environ 10 % des patients : hémoptysie grave, échec au-delà de six semaines, suspicion de cancer, cavité de plus de 6 cm, rupture dans la plèvre.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-mediastinite" data-title="Médiastinite nécrosante descendante"><p class="lab">Anatomie</p><p>Les espaces cervicaux profonds, notamment l’espace rétropharyngé, communiquent avec le médiastin. Une infection dentaire ou amygdalienne y descend sous l’effet de la gravité et de la pression intrathoracique négative.</p><p class="lab">Clinique</p><p>Douleur et tuméfaction cervicales, trismus et dysphagie précèdent la douleur thoracique, la dyspnée et le sepsis.</p><p class="lab">Conduite</p><p>Le scanner cervicothoracique injecté confirme le diagnostic ; les antibiotiques à large spectre, actifs sur aérobies et anaérobies, accompagnent un drainage chirurgical précoce, cervical et thoracique, dans une prise en charge pluridisciplinaire.</p><div class="key"><b>Autres causes de J85.3.</b> Perforation de l’œsophage, infection après sternotomie.</div><p class="src">Références : <a href="https://doi.org/10.21037/med-24-29" target="_blank" rel="noopener">Chaulk et al., 2025</a>.</p></template>
<template data-pop="j86-co-amoxi" data-title="Amoxicilline-acide clavulanique"><p class="lab">Mécanisme</p><p>L’amoxicilline inhibe la synthèse de la paroi bactérienne ; l’acide clavulanique neutralise les bêta-lactamases de nombreux anaérobies et des staphylocoques sensibles à la méticilline.</p><p class="lab">Indication et doses</p><p>Les indications suisses de la forme parentérale incluent les infections respiratoires basses et l’empyème ; les doses figurent dans le tableau de l’onglet Pharmacologie.</p><p class="lab">Tolérance et surveillance</p><p>Diarrhée, éruption et hépatite cholestatique sont les effets à connaître ; un ictère ou une atteinte hépatique sous un traitement antérieur par cette association la contre-indique. La fonction rénale guide l’adaptation des doses ; les tests hépatiques sont surveillés lors d’un traitement de plusieurs semaines.</p><p class="src">Références : <a href="https://compendium.ch/de/product/1505973-co-amoxicillin-labatec-trockensub-2-2-g" target="_blank" rel="noopener">Compendium, Co-Amoxicillin Labatec 2,2 g, consulté le 08.10.2026</a>.</p></template>
<template data-pop="j86-metronidazole" data-title="Métronidazole"><p class="lab">Mécanisme</p><p>Réduit dans la bactérie anaérobie, il forme des dérivés qui fragmentent son ADN ; il reste inactif sur les aérobies.</p><p class="lab">Place</p><p>Associé à une céphalosporine, il couvre les anaérobies lorsque l’aminopénicilline ne convient pas.</p><p class="lab">Risques</p><p>Goût métallique, troubles digestifs et neuropathie lors des traitements prolongés en sont les effets propres ; il peut réagir avec l’alcool et potentialise les antivitamines K. La posologie suit l’information professionnelle du produit choisi.</p></template>
<template data-pop="j86-clindamycine" data-title="Clindamycine"><p class="lab">Place et dose</p><p>Ce lincosamide inhibe la sous-unité ribosomique 50S et agit sur les anaérobies et les cocci à Gram positif. Il remplace les bêta-lactamines en cas d’allergie sévère, surtout dans l’abcès, à la dose intraveineuse de 600 mg toutes les 8 heures. Le relais oral, par exemple 300 mg toutes les 8 heures, reste dans l’intervalle de 600 à 1 800 mg par jour de l’information professionnelle allemande de Dalacin C ; l’information suisse n’a pas pu être lue.</p><p class="lab">Risque majeur</p><p>Une diarrhée sous traitement impose la recherche des toxines de <i>Clostridioides difficile</i>.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-alteplase" data-title="Alteplase"><p class="lab">Mécanisme et indications</p><p>Cet activateur tissulaire du plasminogène recombinant convertit en plasmine le plasminogène lié à la fibrine. Il est enregistré pour la thrombolyse de l’infarctus du myocarde, de l’embolie pulmonaire massive et de l’accident vasculaire cérébral ischémique ; l’usage intrapleural est hors indication.</p><p class="lab">Risque</p><p>L’hémothorax est le risque principal ; le passage systémique est faible, mais anticoagulants et antiagrégants accroissent le risque.</p><div class="key"><b>Accès à la monographie.</b> L’information professionnelle suisse d’Actilyse n’a pas pu être lue le 08.10.2026 (Compendium soumis à connexion). Les indications concordent dans le résumé britannique, mis à jour le 08.05.2026, et dans l’information professionnelle allemande d’avril 2026.</div><p class="src">Références : <a href="https://www.medicines.org.uk/emc/product/898/smpc" target="_blank" rel="noopener">Actilyse, résumé britannique des caractéristiques du produit</a> ; <a href="https://www.fachinfo.de/fi/detail/000011/actilyse-r" target="_blank" rel="noopener">Actilyse, information professionnelle allemande</a>.</p></template>
<template data-pop="j86-dornase" data-title="Dornase alfa"><p class="lab">Mécanisme et indication</p><p>Cette désoxyribonucléase I humaine recombinante coupe l’ADN extracellulaire libéré par les polynucléaires et réduit la viscosité des sécrétions purulentes. Elle est autorisée en inhalation de 2,5 mg une fois par jour dans la mucoviscidose ; l’usage intrapleural est hors indication et, sans alteplase, il augmentait le recours chirurgical dans MIST2.</p><div class="key"><b>Accès à la monographie.</b> L’information professionnelle suisse de Pulmozyme n’a pas pu être lue le 08.10.2026 ; l’indication provient du résumé britannique du produit.</div><p class="src">Références : <a href="https://www.medicines.org.uk/emc/product/1112/smpc" target="_blank" rel="noopener">Pulmozyme, résumé britannique des caractéristiques du produit</a>.</p></template>
<template data-pop="j86-saignement" data-title="Saignement pleural sous fibrinolyse"><p class="lab">Signes</p><p>Le liquide de drainage devient sanglant, l’hémoglobine baisse, une tachycardie puis une hypotension apparaissent et l’opacité augmente.</p><p class="lab">Conduite</p><p>Les instillations sont arrêtées. L’hématocrite du liquide pleural est mesuré : un hémothorax est retenu s’il dépasse la moitié de l’hématocrite sanguin. Un bilan d’hémostase et un avis chirurgical complètent la conduite.</p><p class="lab">Prévention</p><p>Le médecin recense anticoagulants et antiagrégants, corrige les troubles de l’hémostase et envisage la dose réduite de 5 mg d’alteplase.</p></template>
<template data-pop="j86-aminosides" data-title="Pourquoi éviter les aminosides dans le pus"><p class="lab">Mécanisme</p><p>Leur entrée dans la bactérie dépend d’un transport actif lié à l’oxygène et au potentiel membranaire, qui s’effondre en milieu acide et anaérobie ; ils diffusent en outre mal dans la paroi d’un abcès chronique.</p><p class="lab">Conséquence</p><p>Leur activité chute précisément dans le pus pleural ou cavitaire ; ils ajoutent une toxicité rénale et auditive sans bénéfice démontré.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="pareto-j86-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j86-0,j86-1,j86-2,j86-3,j86-4,j86-5,j86-6"></p><ul><li>Simple, compliqué, empyème : l’aspect, le pH et le Gram séparent ces stades.</li><li>Un patient sur dix meurt à trois mois ; le score RAPID mesure ce risque.</li><li>La glycolyse leucocytaire et bactérienne abaisse pH et glucose ; la fibrinolyse bloquée cloisonne ; l’organisation trappe le poumon.</li><li>Streptocoques du groupe anginosus et anaérobies dominent en ville, bactéries résistantes à l’hôpital.</li><li>Inhalation, mauvaise dentition et alcool sont les terrains majeurs.</li><li>Une fièvre persistante sous antibiotique fait chercher une collection.</li></ul></template>
<template data-pop="pareto-j86-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="j86-7"></p><ul><li>L’échographie précède toute ponction.</li><li>Pus franc ou pH ≤ 7,2 : drain ; pH 7,2–7,4 : lactate déshydrogénase &gt; 900 UI/L et contexte ; pH ≥ 7,4 : surveillance.</li><li>Le pH se mesure aussitôt sur analyseur de gaz du sang, sans héparine ni lidocaïne.</li><li>Devant une cavité, cancer excavé et tuberculose sont écartés d’abord.</li></ul></template>
<template data-pop="pareto-j86-tt" data-title="Pareto — Gravité et traitement"><p class="ratio" data-cover="j86-8,j86-9"></p><ul><li>Le sepsis impose un drainage sans délai ; une fistule impose le décubitus côté malade.</li><li>Antibiotique couvrant les anaérobies ; drain de 14 F ou moins.</li><li>Collection résiduelle : alteplase 10 mg et dornase 5 mg, deux fois par jour, trois jours ; jamais une enzyme seule.</li><li>Échec ou coque : chirurgie vidéo-assistée.</li><li>Abcès : antibiotique prolongé ; drainage ou chirurgie pour une minorité.</li></ul></template>
<template data-pop="pareto-j86-crit" data-title="Pareto — Suivi, situations et critères"><p class="ratio" data-cover="j86-10,j86-11,j86-12"></p><ul><li>Le suivi juge la trajectoire : fièvre, protéine C réactive, drain, imagerie.</li><li>Une cavité persistante chez un fumeur impose une bronchoscopie.</li><li>Une infection cervicale suivie d’une douleur thoracique évoque une médiastinite descendante.</li><li>Empyème : pus ou germes ; compliqué : pH ≤ 7,2 ; abcès : cavité de plus de 2 cm.</li></ul></template>
<template data-pop="pareto-j86-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j86-e-1,j86-e-2,j86-e-3,j86-e-4"></p><ul><li>Référence pleurale : la ponction ; référence de l’abcès : le scanner.</li><li>Lecture : aspect, puis pH, puis lactate déshydrogénase et glucose.</li><li>Scanner : plèvre dédoublée pour l’empyème, angle aigu et paroi épaisse pour l’abcès.</li><li>Liquide inoculé en flacons d’hémoculture ; une culture négative n’exclut rien.</li></ul></template>
<template data-pop="pareto-j86-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j86-p-1,j86-p-2,j86-p-3,j86-p-4"></p><ul><li>Amoxicilline-acide clavulanique : 2,2 g par voie intraveineuse trois à quatre fois par jour, puis 1 g par voie orale deux à trois fois par jour.</li><li>Alteplase et dornase intrapleurales : hors indication, consentement, risque hémorragique.</li><li>Fistule bronchopleurale : contre-indication à l’instillation.</li><li>Aminosides évités ; tests hépatiques et fonction rénale surveillés lors des traitements longs.</li></ul></template>
