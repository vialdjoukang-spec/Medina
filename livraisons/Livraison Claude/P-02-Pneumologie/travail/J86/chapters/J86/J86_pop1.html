<template data-pop="j86-continuum" data-title="Le continuum de l’infection pleurale"><p class="lab">Définition</p><p>L’épanchement parapneumonique simple est stérile, à pH élevé ; l’épanchement compliqué est envahi par les bactéries, acide et souvent cloisonné ; l’empyème contient du pus ou des germes visibles en culture ou au Gram.</p><p class="lab">Mécanisme</p><p>La perméabilité pleurale crée le liquide ; l’invasion bactérienne le rend acide par glycolyse ; la fibrine le cloisonne ; les fibroblastes l’organisent. Ces étapes se succèdent en quelques jours à quelques semaines, sans frontière nette.</p><p class="lab">Conséquence pratique</p><p>Le simple guérit par l’antibiotique ; le compliqué et l’empyème demandent un drain ; la collection organisée demande parfois la chirurgie.</p><div class="key"><b>Limite.</b> Le stade se lit sur le liquide et l’image, non sur la durée de la maladie : un empyème peut se constituer en quelques jours.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-abces-def" data-title="Abcès pulmonaire : définition et formes"><p class="lab">Définition</p><p>Cavité de plus de 2 cm creusée par une nécrose liquéfiante infectieuse, contenant pus ou débris. L’abcès est aigu avant six semaines, chronique au-delà. Il est primaire, environ 60 % des cas, quand il naît d’une infection du parenchyme ; secondaire quand il complique un obstacle bronchique, un embole septique ou la rupture d’un abcès voisin.</p><p class="lab">Conséquence pratique</p><p>Un abcès primaire chez un patient exposé à l’inhalation se traite par antibiotique prolongé. Un abcès secondaire impose de traiter sa cause : tumeur, corps étranger, endocardite.</p><div class="key"><b>Limite.</b> Une pneumonie nécrosante à micro-cavités multiples n’est pas encore un abcès collecté ; elle peut y évoluer.</div><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-fistule" data-title="Fistule bronchopleurale"><p class="lab">Définition</p><p>Communication entre une bronche et la cavité pleurale. Elle complique un abcès rompu, une pneumonie nécrosante ou une chirurgie pulmonaire.</p><p class="lab">Signes</p><p>Le patient expectore brutalement un liquide identique au liquide pleural ; le bocal du drain bulle en continu ; la radiographie montre un niveau hydroaérique pleural.</p><p class="lab">Conséquence pratique</p><p>Le pus peut inonder l’arbre bronchique : le patient est couché sur le côté atteint. La fibrinolyse intrapleurale est contre-indiquée, car l’enzyme passerait dans les bronches. Un avis chirurgical est nécessaire.</p><div class="key"><b>Piège.</b> Un bullage persistant n’est pas toujours une fistule ; une fuite du système de drainage doit d’abord être exclue.</div></template>
<template data-pop="j86-codes" data-title="Sous-codes du pyothorax avec fistule (CIM-10-GM 2024)"><p class="lab">Liste</p><p>J86.00 : fistule du parenchyme pulmonaire ; J86.01 : fistule bronchique ou trachéale ; J86.02 : fistule de la paroi thoracique, y compris l’empyème de nécessité ; J86.03 : fistule œsotrachéale ; J86.04 : fistule œsopleurale ; J86.05 : autre fistule œsophagienne ; J86.08 : autre fistule ; J86.09 : fistule non précisée. Un code B95–B98 peut préciser le germe.</p><p class="lab">Conséquence pratique</p><p>Le code décrit l’organe en communication ; une fistule œsophagienne impose un avis chirurgical et une alimentation adaptée.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j85-j86.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, consulté le 08.10.2026</a>.</p></template>
<template data-pop="j86-rapid" data-title="Score RAPID"><p class="lab">Calcul</p><table class="t"><tr><th>Variable</th><th>0 point</th><th>1 point</th><th>2 points</th></tr><tr><td>Urée sérique</td><td>&lt; 5,0 mmol/L</td><td>5,0 à 8,0 mmol/L</td><td>&gt; 8,0 mmol/L</td></tr><tr><td>Âge</td><td>&lt; 50 ans</td><td>50 à 70 ans</td><td>&gt; 70 ans</td></tr><tr><td>Liquide pleural</td><td>Purulent</td><td>Non purulent</td><td>—</td></tr><tr><td>Origine</td><td>Communautaire</td><td>Nosocomiale</td><td>—</td></tr><tr><td>Albumine sérique</td><td>&gt; 27 g/L</td><td>≤ 27 g/L</td><td>—</td></tr></table><p class="lab">Interprétation</p><p>Dans la validation prospective PILOT, la mortalité à trois mois atteignait 2,3 % pour un score de 0 à 2, 9,2 % pour 3 à 4 et 29,3 % pour 5 à 7. La statistique C était de 0,78.</p><p class="lab">Usage</p><p>La BTS 2023 recommande de l’envisager pour stratifier le risque et informer le patient. L’ERS/ESTS rappelle qu’il doit encore être testé dans des essais d’intervention avant de guider le traitement.</p><div class="key"><b>Limite.</b> Le liquide non purulent compte un point : ce paradoxe reflète peut-être un diagnostic tardif ou d’autres comorbidités, sans explication établie.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.13-1558" target="_blank" rel="noopener">Rahman et al., Chest 2014</a> ; <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">PILOT 2020</a>.</p></template>
<template data-pop="j86-ph" data-title="Pourquoi le pH pleural chute"><p class="lab">Normal</p><p>Le liquide pleural normal a un pH voisin de 7,60, supérieur à celui du sang, car la plèvre concentre le bicarbonate.</p><p class="lab">Mécanisme</p><p>Les polynucléaires et les bactéries consomment le glucose et produisent lactate et dioxyde de carbone. La plèvre épaissie retient ces acides. Le pH baisse donc proportionnellement à l’activité métabolique et à la séquestration.</p><p class="lab">Conséquence pratique</p><p>Un pH ≤ 7,2 signale une infection pleurale active, qui ne se résorbera pas sous antibiotique seul : un drain est indiqué.</p><div class="key"><b>Limite.</b> D’autres épanchements sont acides : polyarthrite rhumatoïde, cancer pleural avancé, rupture œsophagienne, tuberculose.</div></template>
<template data-pop="j86-pai1" data-title="Fibrinolyse bloquée et cloisons"><p class="lab">Mécanisme</p><p>L’inflammation active la coagulation dans la plèvre et fait produire par les cellules mésothéliales un excès d’inhibiteur de l’activateur du plasminogène de type 1. La plasmine n’est plus formée ; la fibrine déposée n’est plus dégradée et forme des cloisons.</p><p class="lab">Conséquence clinique</p><p>Le liquide se divise en logettes. Un drain n’en vide qu’une ; l’échographie montre des septations et l’opacité persiste.</p><p class="lab">Conséquence thérapeutique</p><p>L’alteplase intrapleurale apporte un activateur en excès pour contourner l’inhibition et dissoudre les cloisons.</p></template>
<template data-pop="j86-poumon-trappe" data-title="Poumon trappé et décortication"><p class="lab">Définition</p><p>Poumon empêché de se réexpandre par une gangue fibreuse développée sur la plèvre viscérale.</p><p class="lab">Mécanisme</p><p>Les fibroblastes organisent la fibrine en collagène. Cette coque rigide résiste à la pression pleurale négative.</p><p class="lab">Conséquence pratique</p><p>Le drainage vide la cavité, mais le poumon ne la comble pas. La décortication retire chirurgicalement la coque et rend au poumon sa capacité d’expansion. La BTS en fait une décision individuelle, selon l’état général du patient et le stade de l’empyème.</p></template>
<template data-pop="j86-necrose" data-title="Nécrose liquéfiante et abcès"><p class="lab">Mécanisme</p><p>Les anaérobies et les enzymes des polynucléaires digèrent le parenchyme et les petits vaisseaux d’un territoire infecté. Le tissu détruit se liquéfie. Une paroi inflammatoire, puis fibreuse, entoure la collection.</p><p class="lab">Évolution</p><p>Lorsque la collection s’ouvre dans une bronche, le pus est expectoré et l’air entre : un niveau hydroaérique apparaît. La rupture dans la plèvre produit un pyopneumothorax.</p><p class="lab">Conséquence pratique</p><p>Le drainage bronchique spontané explique que la plupart des abcès guérissent sans geste invasif, à condition que la bronche ne soit pas obstruée.</p></template>
<template data-pop="j86-milleri" data-title="Groupe Streptococcus anginosus"><p class="lab">Définition</p><p>Trois espèces commensales de la bouche et du tube digestif : <i>S. anginosus</i>, <i>S. intermedius</i> et <i>S. constellatus</i>, anciennement regroupées sous le nom de « milleri ».</p><p class="lab">Comportement</p><p>Elles forment volontiers des abcès : poumon, plèvre, cerveau, foie. Elles sont fréquentes dans l’empyème communautaire.</p><p class="lab">Conséquence pratique</p><p>Leur isolement fait rechercher d’autres collections, notamment cérébrales en présence de signes neurologiques. Elles restent généralement sensibles aux bêta-lactamines.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-anaerobies" data-title="Les anaérobies de la flore buccale"><p class="lab">Définition</p><p>Bactéries qui ne se multiplient qu’en l’absence d’oxygène : <i>Fusobacterium</i>, <i>Prevotella</i>, <i>Porphyromonas</i>, <i>Peptostreptococcus</i>. Elles abondent dans la plaque dentaire et le sillon gingival.</p><p class="lab">Rôle</p><p>Elles prospèrent dans un tissu nécrosé et pauvre en oxygène et produisent des acides gras volatils responsables de l’odeur fétide.</p><p class="lab">Conséquence pratique</p><p>Elles meurent pendant le transport et poussent lentement : la culture les sous-estime. La couverture anaérobie est donc probabiliste. Certaines produisent des bêta-lactamases, d’où l’intérêt d’un inhibiteur associé.</p></template>
<template data-pop="j86-saureus" data-title="Staphylococcus aureus et suppurations thoraciques"><p class="lab">Rôle</p><p>Agent de pneumonies nécrosantes, souvent après une grippe, et d’empyèmes nosocomiaux ou post-traumatiques. Dans la série de Maskell, le staphylocoque résistant à la méticilline représentait 25 % des infections pleurales nosocomiales.</p><p class="lab">Pronostic</p><p>La mortalité des infections pleurales à <i>S. aureus</i> atteignait 44 %, contre 17 % pour les infections streptococciques.</p><p class="lab">Conséquence pratique</p><p>Une infection nosocomiale ou postopératoire impose une couverture du staphylocoque résistant jusqu’aux résultats microbiologiques ; des hémocultures positives font rechercher une endocardite.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-inhalation" data-title="Inhalation et segments déclives"><p class="lab">Mécanisme</p><p>Un trouble de la conscience (alcool, sédatifs, épilepsie, anesthésie), une dysphagie neurologique ou un reflux abaissent les défenses des voies aériennes. La flore oropharyngée descend par gravité.</p><p class="lab">Topographie</p><p>En décubitus : segments postérieurs des lobes supérieurs, segments apicaux des lobes inférieurs, plus souvent à droite.</p><p class="lab">Conséquence pratique</p><p>Un abcès situé dans ces segments chez un patient à risque est cohérent avec l’inhalation. La prévention passe par l’évaluation de la déglutition et la réduction des sédatifs.</p></template>
<template data-pop="j86-dents" data-title="Hygiène buccodentaire et charge anaérobie"><p class="lab">Mécanisme</p><p>La parodontite et les caries augmentent la quantité d’anaérobies dans la salive. Une inhalation de la même quantité de salive apporte alors davantage de germes.</p><p class="lab">Données</p><p>Une mauvaise hygiène dentaire concernait 18 % des 545 patients de la cohorte PILOT.</p><p class="lab">Conséquence pratique</p><p>L’examen de la bouche fait partie de l’examen clinique ; un assainissement dentaire est programmé pour prévenir la récidive.</p><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">PILOT 2020</a>.</p></template>
<template data-pop="j86-alcool" data-title="Alcoolisme et suppurations pulmonaires"><p class="lab">Mécanismes</p><p>L’ivresse abolit les réflexes de protection des voies aériennes et favorise l’inhalation. L’alcool chronique altère la fonction des polynucléaires et des macrophages alvéolaires, et s’associe souvent à une hygiène dentaire médiocre et à une dénutrition.</p><p class="lab">Conséquence pratique</p><p>L’alcoolisme est le premier terrain de l’abcès pulmonaire. Le sevrage est accompagné pendant l’hospitalisation, avec prévention du syndrome de sevrage et supplémentation en thiamine.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-fievre-persistante" data-title="Fièvre persistante sous antibiotique"><p class="lab">Raisonnement</p><p>Une pneumonie traitée par un antibiotique adapté s’améliore en général en 48 à 72 heures. Une fièvre qui persiste fait rechercher une collection, un germe non couvert, une complication extrapulmonaire ou une cause non infectieuse.</p><p class="lab">Mécanisme</p><p>Le pus collecté est acide, peu vascularisé et cloisonné ; l’antibiotique y diffuse mal et les bactéries s’y multiplient lentement.</p><p class="lab">Conséquence pratique</p><p>L’échographie thoracique est le premier examen ; changer d’antibiotique sans chercher une collection retarde le drainage.</p></template>
<template data-pop="j86-expectoration" data-title="Expectoration fétide et vomique"><p class="lab">Signification</p><p>Une odeur fétide signe la présence d’anaérobies, qui produisent des acides gras volatils et des composés soufrés.</p><p class="lab">Vomique</p><p>Expectoration brutale et abondante de pus, lorsqu’un abcès ou un empyème s’ouvre dans une bronche. Elle soulage souvent le patient mais peut inonder l’autre poumon.</p><p class="lab">Conséquence pratique</p><p>La vomique impose une imagerie pour rechercher une fistule bronchopleurale ; le patient est couché sur le côté malade.</p></template>
<template data-pop="j86-sepsis" data-title="Sepsis et contrôle de la source"><p class="lab">Définition</p><p>Dysfonction d’organe menaçant la vie, causée par une réponse dérégulée à l’infection (définition Sepsis-3).</p><p class="lab">Mécanisme</p><p>Une collection pleurale non drainée entretient une charge bactérienne et des médiateurs inflammatoires que l’antibiotique seul ne réduit pas.</p><p class="lab">Conséquence pratique</p><p>Le drainage fait partie du traitement du sepsis au même titre que l’antibiotique et le remplissage ; il est réalisé sans délai. La prise en charge générale est détaillée dans le cours <a href="#/entry/A41">A41 — Sepsis</a>.</p></template>
<template data-pop="j86-matite" data-title="Signes physiques d’épanchement"><p class="lab">Physique</p><p>Le liquide transmet mal les vibrations vocales et sépare le poumon de la paroi : les vibrations et le murmure vésiculaire s’abolissent, la percussion devient mate. La matité est déclive dans un épanchement libre.</p><p class="lab">Valeur</p><p>L’examen détecte mal un épanchement de moins de 300 mL environ ; l’échographie le voit bien mieux.</p><p class="lab">Piège</p><p>Une matité suspendue, non déclive, suggère un épanchement cloisonné ou une condensation ; seule l’imagerie tranche.</p></template>
<template data-pop="j86-hippocratisme" data-title="Hippocratisme digital"><p class="lab">Définition</p><p>Bombement de la tablette unguéale avec perte de l’angle normal entre ongle et repli cutané.</p><p class="lab">Valeur</p><p>Il apparaît en quelques semaines au cours des suppurations chroniques (abcès, empyème, bronchiectasies) et des cancers bronchiques. Il ne s’observe pas dans la bronchopneumopathie chronique obstructive non compliquée.</p><p class="lab">Conséquence pratique</p><p>Sa présence devant une cavité impose d’écarter un cancer avant de conclure à un abcès simple.</p></template>
<template data-pop="j86-necessitatis" data-title="Empyème de nécessité"><p class="lab">Définition</p><p>Extension d’un empyème à travers la paroi thoracique, jusqu’au tissu sous-cutané, formant une tuméfaction parfois fistulisée à la peau.</p><p class="lab">Causes</p><p>Empyème négligé ; tuberculose et actinomycose sont classiques.</p><p class="lab">Conséquence pratique</p><p>Il se code J86.02. Le traitement associe drainage, antibiotique adapté au germe et souvent chirurgie.</p></template>
