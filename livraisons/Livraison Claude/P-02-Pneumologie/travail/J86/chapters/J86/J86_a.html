<section class="ilot" id="j86-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 58 ans est traité depuis cinq jours pour une pneumonie communautaire. La fièvre persiste, la douleur thoracique s’accentue et la radiographie montre un épanchement qui s’étend. Une femme de 64 ans, alcoolique et à la dentition délabrée, crache depuis trois semaines des sécrétions fétides ; le scanner révèle une cavité à niveau hydroaérique. <b>Dans les deux cas, du pus s’est collecté dans un espace que l’antibiotique atteint mal.</b> L’infection ne guérit qu’à deux conditions : un antibiotique adapté et, pour la plèvre, l’évacuation du liquide infecté.</p><p>À la fin du cours, le lecteur sait reconnaître le passage d’un épanchement parapneumonique simple à un épanchement compliqué puis à un empyème. Il sait interpréter une ponction pleurale, décider d’un drain, prescrire une fibrinolyse intrapleurale ou demander un avis chirurgical au bon moment. Il distingue un abcès pulmonaire d’un empyème enkysté, d’un cancer excavé et d’une tuberculose.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="j86-continuum">Le continuum pleural (de l’épanchement simple à l’empyème)</button> ; <button class="w" data-k="j86-abces-def">l’abcès pulmonaire (une nécrose collectée dans le parenchyme)</button>. La pneumonie elle-même relève du cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</div></section>
<section class="ilot" id="j86-1"><h2><span class="n">1</span>Définitions et classifications</h2><p>La plèvre normale contient quelques millilitres de liquide, qui permettent le glissement du poumon contre la paroi. Une pneumonie voisine augmente la perméabilité capillaire et produit un <b>épanchement parapneumonique</b>. Il reste <b>simple</b> tant qu’il est stérile et que son pH reste élevé ; il guérit alors avec l’antibiotique seul. Il devient <b>compliqué</b> lorsque les bactéries envahissent l’espace pleural : le pH chute, des cloisons de fibrine apparaissent et le liquide ne se résorbe plus spontanément. L’<b>empyème</b> désigne la présence de pus franc, ou de germes à la coloration de Gram ou en culture.</p><p>L’<b>abcès pulmonaire</b> est une cavité de plus de 2 cm creusée dans le parenchyme par une nécrose liquéfiante d’origine infectieuse. Il est dit aigu avant six semaines d’évolution et chronique au-delà. La <b>gangrène pulmonaire</b> correspond à une nécrose étendue, mal limitée, souvent avec thrombose vasculaire. L’abcès du médiastin, enfin, collecte le pus entre les deux plèvres médiastinales.</p><p>Le tableau suivant relie les codes du catalogue à la situation clinique qu’ils décrivent. Il sert à coder juste, et rappelle qu’une fistule change le traitement.</p><table class="t"><tr><th>Code et intitulé</th><th>Situation clinique</th></tr><tr><td><b>J85.0 — Gangrène et nécrose du poumon</b></td><td>Nécrose étendue, non collectée, à haut risque de rupture pleurale.</td></tr><tr><td><b>J85.1 — Abcès du poumon avec pneumonie</b></td><td>Cavité au sein d’une condensation ; si le germe est identifié, la pneumonie se code en J09–J16.</td></tr><tr><td><b>J85.2 — Abcès du poumon sans pneumonie</b></td><td>Cavité isolée, par exemple après inhalation ancienne ou embole septique.</td></tr><tr><td><b>J85.3 — Abcès du médiastin</b></td><td>Collection médiastinale : origine cervicale, œsophagienne ou postopératoire.</td></tr><tr><td><b>J86.0 — Pyothorax avec fistule</b></td><td>Communication avec la bronche (<button class="w" data-k="j86-fistule">fistule bronchopleurale (bulles persistantes et vomique)</button>), l’œsophage ou la paroi.</td></tr><tr><td><b>J86.9 — Pyothorax sans fistule</b></td><td>Empyème pleural, y compris chronique, sans communication.</td></tr></table><p>Le clinicien regarde d’abord la colonne de droite : une fistule bronchopleurale entretient l’infection et contre-indique une fibrinolyse intrapleurale. Un empyème tuberculeux sort de ce code et relève des chapitres A15–A16. <button class="w" data-k="j86-codes">Les sous-codes de fistule précisent l’organe atteint (liste complète)</button>.</p><div class="key"><b>À retenir.</b> Trois mots structurent la plèvre infectée : simple, compliqué, empyème. Le pH et l’aspect du liquide les séparent ; l’îlot suivant montre ce qu’ils pèsent sur le pronostic.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j85-j86.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, J85–J86, consulté le 08.10.2026</a> ; <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">Roberts et al., BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., abcès pulmonaire, 2015</a>.</p></section>
<section class="ilot" id="j86-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’infection pleurale reste grave malgré les antibiotiques. Dans la cohorte prospective internationale PILOT, qui a suivi 542 adultes, la mortalité atteignait 10 % à trois mois et 19 % à douze mois. Avant l’essai MIST2, plus de 30 % des patients mouraient ou nécessitaient une chirurgie. La déclaration ERS/ESTS de 2023 décrit une incidence en hausse dans les pays européens. Aucune donnée d’incidence suisse spécifique n’a pu être identifiée ; cette lacune est nommée plutôt que comblée par extrapolation.</p><p>Le pronostic dépend davantage du terrain que du germe seul. L’âge, une urée élevée, une albumine basse, une origine nosocomiale et, paradoxalement, un liquide non purulent prédisent la mortalité. Ces cinq variables composent le <button class="w" data-k="j86-rapid">score RAPID (calcul, seuils et limites)</button>. L’origine compte aussi : une infection nosocomiale tuait 47 % des patients dans la série bactériologique de Maskell, contre 17 % pour une infection communautaire.</p><p>L’abcès pulmonaire est devenu plus rare depuis l’antibiothérapie. Sa mortalité historique, proche de 75 % au début du vingtième siècle, est tombée à des valeurs très variables selon les séries, de 2 à 38 %. Les décès surviennent surtout chez les patients âgés, immunodéprimés ou porteurs d’une obstruction bronchique.</p><div class="key"><b>À retenir.</b> Un patient sur dix meurt dans les trois mois qui suivent une infection pleurale. Le terrain, mesuré par le score RAPID, explique une large part de ce risque.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">Corcoran et al., étude PILOT, Eur Respir J 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa1012740" target="_blank" rel="noopener">Rahman et al., MIST2, New England Journal of Medicine 2011</a> ; <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">Bedawi et al., déclaration ERS/ESTS, 2023</a> ; <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., bactériologie pleurale, 2006</a>.</p></section>
<section class="ilot" id="j86-3"><h2><span class="n">3</span>Du liquide réactionnel au pus organisé</h2><p>Le liquide pleural normal est filtré par les capillaires de la plèvre pariétale et réabsorbé par ses lymphatiques. Son pH, voisin de 7,60, dépasse celui du sang, et son glucose égale celui du plasma. L’inflammation d’un poumon voisin rompt cet équilibre en trois étapes successives, que l’on retrouve à l’échographie, à la ponction et au bloc opératoire.</p><p><b>Phase exsudative.</b> Les cytokines de la pneumonie rendent la plèvre viscérale perméable. Un liquide clair, stérile, riche en protéines s’accumule plus vite que les lymphatiques ne l’évacuent. Le pH et le glucose restent normaux : l’antibiotique suffit.</p><p><b>Phase fibrinopurulente.</b> Les bactéries franchissent la plèvre. Les polynucléaires et les germes consomment le glucose par glycolyse et rejettent lactate et dioxyde de carbone : <button class="w" data-k="j86-ph">le pH chute sous 7,2 (mécanisme de l’acidose pleurale)</button>. Simultanément, <button class="w" data-k="j86-pai1">la fibrinolyse est bloquée et la fibrine cloisonne la cavité (rôle de l’inhibiteur de l’activateur du plasminogène)</button>. Des logettes isolent le pus ; un drain unique n’en vide qu’une partie.</p><p><b>Phase organisée.</b> Les fibroblastes transforment la fibrine en une gangue collagène épaisse. Cette « peau » enserre le poumon et l’empêche de se réexpandre : c’est le <button class="w" data-k="j86-poumon-trappe">poumon trappé (pourquoi seule la décortication le libère)</button>. Les antibiotiques diffusent mal dans ce tissu peu vascularisé.</p><p>L’abcès pulmonaire suit une autre logique. Des bactéries anaérobies inhalées colonisent un territoire mal ventilé ; leurs enzymes et la réponse inflammatoire détruisent le parenchyme par <button class="w" data-k="j86-necrose">nécrose liquéfiante (de la pneumonie nécrosante à la cavité)</button>. Lorsque la collection rompt dans une bronche, le patient expectore du pus et de l’air remplace le liquide évacué : le niveau hydroaérique apparaît.</p><div class="key"><b>Conséquence thérapeutique.</b> Le pH bas signe une infection pleurale déjà installée ; les cloisons expliquent l’échec d’un drainage simple ; la gangue explique l’échec d’un traitement médical tardif. Chaque stade appelle un geste différent.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/13993003.01062-2022" target="_blank" rel="noopener">ERS/ESTS 2023</a>.</p></section>
<section class="ilot" id="j86-4"><h2><span class="n">4</span>Agents et facteurs de risque</h2><p>La bactériologie pleurale diffère de celle de la pneumonie. Le pneumocoque, premier agent des pneumonies, cède la place à des streptocoques commensaux de la bouche et à des anaérobies. Le tableau oppose les deux contextes, car le lieu d’acquisition fixe l’antibiothérapie probabiliste.</p><table class="t"><tr><th>Contexte</th><th>Agents dominants</th><th>Conséquence</th></tr><tr><td>Infection communautaire</td><td>Environ 50 % de streptocoques, dont le <button class="w" data-k="j86-milleri">groupe <i>Streptococcus anginosus</i> (ancien « milleri »)</button> et le pneumocoque ; environ 20 % d’<button class="w" data-k="j86-anaerobies">anaérobies (flore buccale)</button>.</td><td>Couvrir streptocoques et anaérobies d’emblée.</td></tr><tr><td>Infection nosocomiale</td><td>Environ 60 % de bactéries souvent résistantes : <button class="w" data-k="j86-saureus"><i>Staphylococcus aureus</i>, y compris résistant à la méticilline</button> 25 %, entérobactéries 18 %, entérocoques 12 %, <i>Pseudomonas</i> 5 %.</td><td>Élargir selon l’écologie locale.</td></tr><tr><td>Abcès pulmonaire</td><td>Flore polymicrobienne dans plus de 90 % des cas : <i>Fusobacterium</i>, <i>Prevotella</i>, <i>Peptostreptococcus</i>, streptocoques ; parfois <i>S. aureus</i> ou <i>Klebsiella pneumoniae</i>.</td><td>Couvrir les anaérobies ; rechercher une cause bronchique.</td></tr></table><p>La lecture commence par la ligne du contexte : un empyème apparu après une chirurgie thoracique ne se traite pas comme un empyème communautaire. L’erreur fréquente consiste à prescrire un traitement de pneumonie sans couverture anaérobie, alors qu’une culture pleurale négative ne prouve pas leur absence.</p><p>Trois terrains favorisent ces infections. <button class="w" data-k="j86-inhalation">L’inhalation (trouble de conscience, dysphagie, reflux)</button> amène la flore oropharyngée dans les segments déclives. <button class="w" data-k="j86-dents">Une mauvaise hygiène buccodentaire (charge anaérobie)</button> enrichit cette flore ; elle concernait 18 % des patients de PILOT. <button class="w" data-k="j86-alcool">L’alcoolisme (inhalation et immunité)</button> cumule les deux mécanismes et reste le premier terrain de l’abcès. Le diabète, l’immunodépression, la toxicomanie intraveineuse et une obstruction bronchique tumorale complètent la liste.</p><div class="key"><b>À retenir.</b> Le pus thoracique est souvent buccal par son origine. Le lieu d’acquisition dicte l’antibiotique ; la recherche d’une porte d’entrée, dentaire ou bronchique, prévient la récidive.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a> ; <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a> ; <a href="https://doi.org/10.1183/13993003.00130-2020" target="_blank" rel="noopener">PILOT 2020</a>.</p></section>
<section class="ilot" id="j86-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le symptôme le plus évocateur d’infection pleurale est une <button class="w" data-k="j86-fievre-persistante">fièvre qui persiste ou réapparaît sous antibiotique (pourquoi l’antibiotique échoue)</button>. Une pneumonie bien traitée s’améliore en 48 à 72 heures ; l’absence d’amélioration impose de rechercher un épanchement. La douleur pleurale, latérale et aggravée par l’inspiration, traduit l’irritation de la plèvre pariétale, seule innervée.</p><p>L’empyème à anaérobies évolue souvent à bas bruit pendant plusieurs semaines. Le patient décrit alors un amaigrissement, des sueurs nocturnes et une anémie, sans grande fièvre ; ce tableau subaigu mime un cancer ou une tuberculose. L’abcès pulmonaire se signale par une <button class="w" data-k="j86-expectoration">expectoration abondante et fétide, parfois une vomique (signification de l’odeur)</button>.</p><p>L’interrogatoire recherche ensuite les terrains : épisode de perte de conscience, crise convulsive, alcoolisation, troubles de la déglutition, soins dentaires négligés. Il précise aussi le lieu d’acquisition, une chirurgie thoracique ou œsophagienne récente, un traumatisme thoracique, des voyages ou un contact tuberculeux. Une hémoptysie oriente vers un abcès, un cancer ou une tuberculose plutôt que vers un empyème isolé.</p><div class="two"><div class="card"><b>Forme typique.</b> Pneumonie traitée depuis quelques jours ; la fièvre persiste, la douleur latéralisée s’accentue et un épanchement apparaît ou grossit.</div><div class="card"><b>Formes atypiques.</b> Sujet âgé confus sans fièvre ; empyème chronique amaigrissant ; empyème après chirurgie ou ponction ; tuméfaction de la paroi thoracique qui draine le pus vers la peau.</div></div><div class="key"><b>À retenir.</b> La chronologie fournit l’argument principal : une infection pulmonaire qui ne guérit pas cache souvent une collection. L’anamnèse cherche aussi la porte d’entrée.</div></section>
<section class="ilot" id="j86-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen mesure d’abord la gravité : température, fréquence respiratoire, saturation, pression artérielle et état de conscience. Un <button class="w" data-k="j86-sepsis">sepsis (dysfonction d’organe et urgence du drainage)</button> transforme le drainage en geste urgent. Il apprécie ensuite l’état nutritionnel, car une albumine basse et un amaigrissement aggravent le pronostic.</p><div class="two"><div class="card"><b>Signes d’épanchement.</b> <button class="w" data-k="j86-matite">Matité déclive, abolition du murmure et des vibrations (physique de l’épanchement)</button>. Un souffle pleurétique peut s’entendre à la limite supérieure. Un épanchement cloisonné peut donner une matité suspendue, non déclive.</div><div class="card"><b>Signes de suppuration chronique.</b> Haleine fétide, dents cariées ou parodontite, <button class="w" data-k="j86-hippocratisme">hippocratisme digital (suppuration prolongée)</button>, amaigrissement. Une tuméfaction fluctuante de la paroi évoque un empyème de nécessité.</div></div><p>Dans l’abcès pulmonaire, l’auscultation est souvent pauvre : quelques crépitants, parfois un souffle amphorique au-dessus d’une grande cavité. Un pneumothorax associé, avec tympanisme et abolition du murmure, signale une rupture dans la plèvre. L’examen de la bouche et du cou n’est jamais omis, car il oriente vers une porte d’entrée dentaire ou une infection cervicale descendante.</p><div class="key"><b>À retenir.</b> La clinique repère l’épanchement et la gravité ; elle ne distingue pas un liquide simple d’un liquide infecté. Seules l’échographie et la ponction tranchent.</div><button class="pareto-btn ui" data-k="pareto-j86-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
