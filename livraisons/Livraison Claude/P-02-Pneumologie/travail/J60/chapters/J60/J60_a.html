<section class="ilot" id="j60-0"><h2><span class="n">0</span>Question clinique</h2><p>Un homme de 67 ans, installateur sanitaire et chauffagiste de 1974 à 1995, consulte pour une dyspnée d’effort apparue depuis deux ans. Il a fumé vingt paquets-années et s’est arrêté à 50 ans. Une tomodensitométrie (TDM) thoracique demandée pour une toux montre des plaques pleurales calcifiées sur les deux coupoles diaphragmatiques et des réticulations sous-pleurales des deux bases. Sa fille demande s’il s’agit d’un cancer.</p><p>Trois questions guident la conduite. Les plaques signent-elles seulement une exposition ancienne à l’amiante, ou une maladie qui évolue ? Les réticulations des bases correspondent-elles à une asbestose, à une fibrose pulmonaire idiopathique ou à une autre pneumopathie interstitielle ? Quelles démarches médicales et assurantielles le patient doit-il entreprendre ? <b>Une plaque pleurale n’est pas un stade précoce de mésothéliome ; elle signale une exposition significative à l’amiante et ouvre une démarche de déclaration auprès de l’assureur-accidents.</b></p><div class="key"><b>Objectifs.</b> Reconnaître une pneumoconiose à partir d’une anamnèse professionnelle, d’une imagerie et d’une mesure fonctionnelle ; distinguer ses formes et leurs complications ; prescrire ce qui est utile et déclarer la maladie professionnelle. Prérequis : <button class="w" data-justification="1" data-k="j60-pneumoconiose">la notion de pneumoconiose (définition de la Suva)</button> ; <button class="w" data-justification="1" data-k="j60-mp">la maladie professionnelle en droit suisse (LAA, article 9)</button>.</div></section>
<section class="ilot" id="j60-1"><h2><span class="n">1</span>Définition et classification</h2><p>Une pneumoconiose est une maladie pulmonaire due à l’inhalation prolongée de poussières minérales ou métalliques. La Suva l’oppose aux maladies des poussières organiques, comme le poumon de fermier, qui n’en font pas partie. Selon la composition de la poussière, la lésion associe une fibrose diffuse ou nodulaire, une inflammation et un dépôt de particules (AWMF, 2026). La silicose est la plus fréquente des pneumoconioses ; l’asbestose en est une autre.</p><p>Le clinicien classe ces maladies selon l’agent, car chaque agent impose une conduite propre. Le tableau regroupe les entités couvertes par ce cours et la lésion qui les caractérise.</p><table class="t"><tr><th>Agent</th><th>Entité</th><th>Lésion dominante</th></tr><tr><td>Quartz et silice cristalline</td><td><button class="w" data-justification="1" data-k="j60-formes-silicose">Silicose chronique, accélérée ou aiguë</button></td><td>Nodules fibreux des lobes supérieurs, conglomérats</td></tr><tr><td>Poussières mixtes de mine</td><td>Pneumoconiose des mineurs de charbon (anthracosilicose)</td><td>Nodules pigmentés noirs, emphysème</td></tr><tr><td>Fibres d’amiante</td><td><button class="w" data-justification="1" data-k="j60-asbestose">Asbestose</button></td><td>Fibrose interstitielle diffuse des bases</td></tr><tr><td>Fibres d’amiante</td><td><button class="w" data-justification="1" data-k="j60-plaques">Plaques pleurales</button> et autres atteintes pleurales bénignes</td><td>Fibrose hyaline de la plèvre pariétale</td></tr><tr><td>Béryllium</td><td><button class="w" data-justification="1" data-k="j60-berylliose">Bérylliose chronique</button></td><td>Granulomes sans nécrose caséeuse</td></tr><tr><td>Métaux durs (carbure de tungstène, cobalt)</td><td><button class="w" data-justification="1" data-k="j60-metaux-durs">Pneumopathie des métaux durs</button></td><td>Pneumopathie interstitielle à cellules géantes</td></tr><tr><td>Fer, talc, aluminium</td><td><button class="w" data-justification="1" data-k="j60-autres-poussieres">Sidérose, talcose, aluminose</button></td><td>Surcharge peu fibrogène ou granulomes</td></tr></table><p>La première colonne commande l’enquête professionnelle et la déclaration ; la dernière oriente la lecture de l’imagerie et de l’histologie. Une même exposition produit souvent plusieurs lésions : un ancien isolateur peut porter des plaques, une asbestose et un cancer bronchique. La silicose se décline enfin en quatre formes, simple, compliquée par une <button class="w" data-justification="1" data-k="j60-fmp">fibrose massive progressive</button>, accélérée et aiguë, dont la gravité dépend de l’intensité de l’exposition.</p><div class="key"><b>À retenir.</b> « Pneumoconiose » désigne une famille de maladies définie par sa cause, une poussière inorganique inhalée. Le nom de l’agent précède toujours la description de la lésion, car il gouverne la prévention, la reconnaissance et le pronostic.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, fiche thématique Silicose, décembre 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">Preisser et al., recommandation AWMF S2k sur la silicose, Respiration 2026</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, fiche thématique Maladies professionnelles causées par l’amiante, octobre 2019</a>.</p></section>
<section class="ilot" id="j60-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>La silicose fut la plus lourde maladie professionnelle suisse du XXe siècle. En cinq décennies, près de 11 000 travailleurs des fonderies, des mines, des tunnels et des barrages en ont gardé des séquelles et plus de 3000 en sont morts ; un record de 879 cas fut enregistré en 1968 (Suva). Le nombre annuel de nouveaux cas reconnus est passé de 200 à 300 dans les années 1940 à 1960 à une centaine dès 1974, puis à 30 à 50 dès 1989 (Vu-Duc, 1999). À l’échelle mondiale, l’étude Global Burden of Disease comptait 23 695 nouveaux cas de silicose en 2017, soit 39 % des pneumoconioses ; en Europe occidentale, l’incidence standardisée a chuté de 0,12 à 0,04 pour 100 000 entre 1990 et 2017 (Hoy, 2022).</p><p>Le fardeau de l’amiante suit un calendrier différent, dicté par une latence de plusieurs décennies. L’amiante est interdit en Suisse depuis 1990, mais les importations ont culminé après 1975 : près de 150 personnes meurent encore chaque année d’une maladie due à l’amiante, et le mésothéliome reste en tête des maladies professionnelles reconnues (Suva). L’asbestose, en revanche, est devenue rare : les examens préventifs de la Suva n’en ont plus détecté de cas évident depuis 2012.</p><p>Le pronostic dépend de la forme. La silicose chronique évolue lentement ; il est gouverné par l’obstruction bronchique, la baisse de la diffusion et l’apparition d’un <button class="w" data-justification="1" data-k="j60-coeur-pulmonaire">cœur pulmonaire</button> (Suva, 2012). La <button class="w" data-justification="1" data-k="j60-pierre-artificielle">silicose de la pierre artificielle</button> atteint au contraire des hommes jeunes et progresse vite vers la fibrose massive. Les plaques pleurales isolées, enfin, n’entraînent habituellement ni symptôme ni retentissement fonctionnel.</p><div class="key"><b>À retenir.</b> La silicose recule en Suisse mais réapparaît dans des métiers nouveaux ; les maladies de l’amiante, issues d’expositions anciennes, n’ont pas encore décliné. Le pronostic se lit dans la fonction respiratoire, non dans l’étendue radiologique.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/autoportrait/la-suva/jalons/maladies-professionnelles/silicose" target="_blank" rel="noopener">Suva, La silicose, « la pire des maladies »</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10510836/" target="_blank" rel="noopener">Vu-Duc et Guillemin, Soz Praventivmed 1999</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9310854/" target="_blank" rel="noopener">Hoy et al., Respirology 2022</a> ; <a href="https://www.suva.ch/fr-ch/prevention/par-danger/materiaux-rayonnements-et-situations-a-risque/amiante/les-consequences-de-l-amiante" target="_blank" rel="noopener">Suva, L’amiante rend malade</a>.</p></section>
<section class="ilot" id="j60-3"><h2><span class="n">3</span>De la particule inhalée à la fibrose</h2><p>Une poussière n’est dangereuse que si elle atteint les alvéoles et y persiste. Le déterminant de la silicose est la fraction alvéolaire du quartz ; celui des maladies de l’amiante est la fibre longue et fine, que l’Organisation mondiale de la santé définit par une longueur supérieure à 5 µm, un diamètre inférieur à 3 µm et un rapport longueur sur diamètre supérieur à 3 (Suva). La dose cumulée, la teneur en agent toxique et la <button class="w" data-justification="1" data-k="j60-biopersistance">biopersistance</button> de la particule déterminent ensuite le risque.</p><h3>Silice : le macrophage qui meurt</h3><p>Le macrophage alvéolaire phagocyte le cristal de silice, puis en meurt. Sa destruction libère des médiateurs de l’inflammation, qui stimulent les fibroblastes, et libère aussi le cristal, aussitôt repris par un nouveau macrophage. Ce recyclage forme le <button class="w" data-justification="1" data-k="j60-nodule-silicotique">nodule silicotique</button> et entretient sa croissance : <b>la silicose progresse ainsi même après la fin de l’exposition</b> (AWMF, 2026). Les nodules confluent en masses de plus de 1 cm, qui se rétractent et créent un emphysème cicatriciel autour d’eux. Les particules gagnent enfin les ganglions hilaires, qui peuvent se calcifier.</p><h3>Amiante : la fibre qu’on ne peut pas éliminer</h3><p>Les fibres longues échappent à la phagocytose et à la clairance mucociliaire ; plus elles persistent, plus elles entretiennent inflammation, fibrose et lésions de l’ADN (Ferreiro, 2025). Dans l’interstitium des bases, elles produisent l’asbestose. Elles gagnent la plèvre pariétale par le flux lymphatique ou sanguin, où elles induisent les plaques. Les amphiboles, rigides et biopersistantes, sont plus cancérogènes que le chrysotile, qui représentait pourtant plus de 90 % de l’amiante utilisé (Suva, 2019).</p><h3>Immunité détournée</h3><p>La silice altère la défense contre les mycobactéries, ce qui explique la <button class="w" data-justification="1" data-k="j60-silicotuberculose">silicotuberculose</button>, et favorise des maladies auto-immunes. Le béryllium agit autrement : il déclenche une hypersensibilité retardée, qui produit des granulomes semblables à ceux de la sarcoïdose.</p><div class="key"><b>Conséquence pratique.</b> La fibrose des pneumoconioses ne régresse pas, et celle de la silice s’auto-entretient. Seule la soustraction précoce à l’exposition et la prévention des complications modifient l’histoire naturelle.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026, anatomie pathologique et silicotuberculose</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., Breathe (ERS) 2025</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019, toxicologie</a>.</p></section>
<section class="ilot" id="j60-4"><h2><span class="n">4</span>Expositions et facteurs de risque</h2><p>La cause d’une pneumoconiose se trouve dans le parcours professionnel, parfois des décennies avant les symptômes. Le tableau relie chaque agent aux métiers que la Suva et la recommandation AWMF désignent comme exposés.</p><table class="t"><tr><th>Agent</th><th>Métiers et situations exposés</th></tr><tr><td>Quartz</td><td>Construction de tunnels et de galeries, mines, carrières et gravières, taille de pierre, fonderies, céramique, verre, laboratoires de prothèse dentaire, fabrication et découpe de <button class="w" data-justification="1" data-k="j60-pierre-artificielle">pierre artificielle</button></td></tr><tr><td>Amiante</td><td>Installateurs sanitaires et chauffagistes, électriciens, isolateurs, mécaniciens automobiles (garnitures de frein), couvreurs (amiante-ciment), ouvriers de la production d’amiante-ciment, rénovation et démolition</td></tr><tr><td>Béryllium</td><td>Alliages cuivre-béryllium, électronique, horlogerie et bijouterie, technique dentaire, aéronautique</td></tr><tr><td>Métaux durs</td><td>Fabrication et usinage d’outils de coupe et de forage</td></tr><tr><td>Fer</td><td>Soudage à l’arc</td></tr></table><p>Le tableau se lit dans les deux sens. Devant un métier, le médecin recherche la maladie ; devant une imagerie évocatrice, il recherche le métier. Un ancien électricien qui a percé pendant dix ans, avant 1990, quelques heures par semaine des panneaux d’amiante atteint environ 3 <button class="w" data-justification="1" data-k="j60-fibres-annees">fibres-années</button>, seuil d’entrée dans le suivi de la Suva.</p><p>La dose cumulée est le facteur principal. Pour le quartz, réduire l’exposition cumulée de 4 à 2 mg/m³-années abaisse le risque relatif de silicose à 0,23 chez les mineurs (Howlett, 2024). Des facteurs individuels s’y ajoutent : filtration nasale insuffisante, antécédents de bronchite chronique ou de tuberculose, clairance mucociliaire diminuée (Suva, 2012). Le tabac n’est pas une cause de pneumoconiose, mais il renforce l’obstruction et augmente le risque de cancer bronchique (Suva, 2012). Pour le béryllium, un variant génétique, <button class="w" data-justification="1" data-k="j60-hla-glu69">l’allèle HLA-DPB1 Glu69</button>, augmente la susceptibilité.</p><div class="key"><b>À retenir.</b> Le métier, la période, la durée et la tâche précise font le diagnostic étiologique. L’exposition domestique ou de voisinage compte aussi pour l’amiante.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019, anamnèse professionnelle</a> ; <a href="https://www.suva.ch/fr-ch/accident/pour-les-fournisseurs-de-prestations/suva-medical/publications/2020/juin/nouveautes-exposition-amiante" target="_blank" rel="noopener">Suva Medical, nouveautés du suivi après exposition à l’amiante, 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39107111/" target="_blank" rel="noopener">Howlett et al., Thorax 2024</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique-berylliose--bases-de-la-med--du-trav/fiche-thematique-berylliose--bases-de-la-med--du-trav" target="_blank" rel="noopener">Suva, fiche thématique Bérylliose, septembre 2012</a>.</p></section>
<section class="ilot" id="j60-5"><h2><span class="n">5</span>Interroger pour retrouver l’exposition</h2><p>L’<button class="w" data-justification="1" data-k="j60-anamnese-pro">anamnèse professionnelle structurée (méthode et pièges)</button> est l’examen le plus rentable de ce cours. Le médecin reconstitue chaque emploi depuis l’apprentissage : entreprise, années, tâches, matériaux, outils, ventilation, protection respiratoire. Il demande aussi les expositions de loisir, l’exposition des proches par les vêtements de travail et les rénovations domestiques.</p><p>La latence oriente la question. Une silicose chronique apparaît en général cinq à vingt ans ou plus après le début de l’exposition, une silicose accélérée deux à dix ans après, une silicoprotéinose après quelques semaines à trois ans d’exposition intense. Les plaques pleurales exigent une latence de vingt à trente ans, le mésothéliome environ 35 ans, alors que la <button class="w" data-justification="1" data-k="j60-pleuresie-benigne">pleurésie bénigne de l’amiante</button> survient souvent moins de dix ans après le début de l’exposition.</p><p>Les symptômes sont pauvres et tardifs. La silicose légère est habituellement asymptomatique ; la dyspnée d’effort, liée à la baisse de la diffusion, en est le symptôme précoce. Une silicose radiologiquement étendue peut rester sans gêne : la Suva souligne la discordance entre plainte, fonction et image. Le médecin cherche enfin les signes d’une complication. Une altération de l’état général ou une aggravation fonctionnelle chez un silicotique fait rechercher une tuberculose ; des douleurs, une oppression thoracique et une dyspnée croissante chez un ancien exposé à l’amiante font craindre un mésothéliome.</p><div class="trap"><span class="k">Piège</span> Le diagnostic de sarcoïdose est porté sans anamnèse professionnelle. Dans une cohorte européenne, 34 patients sur 84 présumés sarcoïdosiques avaient en réalité une bérylliose, souvent liée à un laboratoire dentaire (Müller-Quernheim, 2006).</div><div class="key"><b>À retenir.</b> L’interrogatoire date l’exposition, en estime l’intensité et confronte la latence à la lésion observée. Une latence trop courte fait douter de l’agent présumé.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/16540500/" target="_blank" rel="noopener">Müller-Quernheim et al., Eur Respir J 2006</a>.</p></section>
<section class="ilot" id="j60-6"><h2><span class="n">6</span>Examiner pour mesurer le retentissement</h2><p>L’examen physique est souvent normal dans la silicose simple et dans les plaques pleurales isolées, qui n’entraînent habituellement ni symptôme ni retentissement fonctionnel. Il prend de la valeur lorsqu’il est rapporté au mécanisme. Le médecin mesure la fréquence respiratoire et la SpO₂ au repos puis à l’effort, car la limitation de la diffusion se démasque d’abord à l’effort ; c’est pourquoi la Suva intègre une ergospirométrie au bilan.</p><p>Chaque lésion a sa traduction. L’asbestose diminue l’élasticité du poumon et perturbe les échanges gazeux ; aux stades avancés, elle produit une dyspnée et un trouble ventilatoire restrictif. Un <button class="w" data-justification="1" data-k="j60-epaississement-diffus">épaississement pleural diffus</button> limite la mobilité pulmonaire et peut conduire, sans fibrose du poumon, à une insuffisance ventilatoire avec rétention de dioxyde de carbone. La silicose compliquée ajoute une obstruction bronchique, qui domine la gêne du patient. Les signes d’insuffisance cardiaque droite font rechercher un <button class="w" data-justification="1" data-k="j60-coeur-pulmonaire">cœur pulmonaire</button>. Les signes d’une polyarthrite rhumatoïde ou d’une sclérodermie systémique orientent vers une maladie auto-immune associée à la silice.</p><div class="key"><b>À retenir.</b> L’examen ne fait pas le diagnostic de pneumoconiose ; il en mesure le retentissement et repère les complications qui changent la conduite.</div><p class="src">Références : <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/fiche-thematique--silicose---maladie--traitement-et-prevention/fiche-thematique--silicose---maladie--traitement-et-prevention" target="_blank" rel="noopener">Suva, silicose, 2012</a> ; <a href="https://www.suva.ch/fr-ch/download/fiches-thematiques/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail/maladies-professionnelles-dues-a-l-amiante---factsheet-domaine-medecine-du-travail" target="_blank" rel="noopener">Suva, amiante, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12070196/" target="_blank" rel="noopener">Ferreiro et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13577655/" target="_blank" rel="noopener">AWMF, silicose, 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-j60-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
