<h1>Épanchements pleuraux</h1><span class="status">Adulte · transsudats, exsudats, épanchements malins, chyleux et hémorragiques · rédaction du 08.10.2026 · référentiels BTS 2023, ERS/EACTS 2018</span></div>

<section class="ilot" id="j90-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 68 ans, ancienne fumeuse, se plaint d’un essoufflement d’effort apparu en six semaines. L’hémithorax droit est mat à la percussion et silencieux à l’auscultation. La radiographie montre un épanchement qui occupe la moitié du champ pulmonaire. <b>La présence du liquide n’est pas un diagnostic : c’est un signe, dont il faut trouver la cause.</b></p><p>Un épanchement pleural est une accumulation anormale de liquide entre la plèvre viscérale, qui recouvre le poumon, et la plèvre pariétale, qui tapisse la paroi. Il naît d’un déséquilibre entre la formation et la résorption du liquide. Ses causes vont de l’insuffisance cardiaque, que les diurétiques font régresser, au cancer métastatique, qui impose une décision palliative : le liquide lui-même doit donc être lu.</p><p>La conduite s’ordonne en quatre décisions. Le médecin reconnaît l’épanchement et sa tolérance, décide si une <button class="w" data-justification="1" data-k="j90-ponction">ponction pleurale (technique et sécurité)</button> est nécessaire, interprète le liquide pour distinguer <button class="w" data-justification="1" data-k="j90-transsudat-exsudat">transsudat et exsudat (deux mécanismes, deux bilans)</button>, puis choisit un traitement proportionné à la cause et au pronostic.</p><div class="key"><b>À retenir.</b> Tout épanchement inexpliqué impose une enquête étiologique : du contexte clinique à l’échographie, de la ponction à la cause.</div></section>
<section class="ilot" id="j90-1"><h2><span class="n">1</span>Définitions et codage</h2><p>Le <b>transsudat</b> naît d’un déséquilibre des pressions de part et d’autre d’une plèvre saine : le liquide filtré est pauvre en protéines. L’<b>exsudat</b> naît d’une plèvre malade, inflammatoire, infectée ou envahie : la perméabilité capillaire augmente, ou le drainage lymphatique est bloqué, et le liquide s’enrichit en protéines et en lactate déshydrogénase. Cette distinction oriente d’emblée le bilan : un transsudat fait chercher une maladie du cœur, du foie ou du rein ; un exsudat fait chercher une maladie de la plèvre ou du poumon.</p><p>La CIM-10-GM 2024 répartit les épanchements en trois catégories. Le code se choisit après le diagnostic ; il ne le remplace jamais.</p><table class="t"><tr><th>Code et intitulé</th><th>Contenu dans ce cours</th></tr><tr><td><b>J90 — Épanchement pleural, non classé ailleurs</b></td><td>Épanchement, pleurésie avec épanchement comprise, sans code plus spécifique. Le chylothorax, la tuberculose et la pleurésie sans autre précision (R09.1) en sont exclus.</td></tr><tr><td><b>J91 — Épanchement pleural au cours de maladies classées ailleurs</b></td><td><button class="w" data-justification="1" data-k="j90-codage-etoile">Code « étoile » (pourquoi il accompagne la maladie causale)</button> : épanchement dû à une maladie codée dans un autre chapitre, une tumeur maligne par exemple ; il ne s’emploie jamais seul.</td></tr><tr><td><b>J94 — Autres affections pleurales</b></td><td>J94.0 — Épanchement chyleux ; J94.1 — Fibrothorax ; J94.2 — Hémothorax ; J94.8 — Autres affections précisées, dont l’hydrothorax ; J94.9 — Affection pleurale, sans précision.</td></tr></table><p>Deux exclusions piègent le codage. Un hémothorax traumatique ne relève pas de J94.2 mais de S27.1. Une pleurésie tuberculeuse relève des maladies infectieuses (A15–A16) ; seul son diagnostic est développé ici. L’épanchement purulent relève du cours <a href="#/entry/J86">J86 — Pleurésies purulentes et abcès du poumon</a>.</p><div class="key"><b>À retenir.</b> Transsudat et exsudat décrivent un mécanisme ; les codes décrivent une cause documentée. Le premier oriente le bilan, le second en résume le résultat.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j90-j94.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J90 à J94, version allemande officielle, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.7326/0003-4819-77-4-507" target="_blank" rel="noopener">Light et al., Ann Intern Med 1972</a>.</p></section>
<section class="ilot" id="j90-2"><h2><span class="n">2</span>Fréquence et pronostic</h2><p>L’épanchement pleural est l’une des situations les plus fréquentes de la médecine respiratoire hospitalière. Ses trois grandes causes sont l’insuffisance cardiaque, l’infection pulmonaire et le cancer. Aucune incidence suisse globale, datée et méthodologiquement comparable, n’est publiée. L’épanchement malin touche à lui seul plus de 750 000 personnes chaque année en Europe et aux États-Unis.</p><p>Le pronostic dépend de la cause et non du volume de liquide. Un épanchement cardiaque régresse en quelques jours sous diurétiques. Un <button class="w" data-justification="1" data-k="j90-malin">épanchement malin (signification pronostique)</button> signe au contraire une maladie disséminée : dans la cohorte qui a construit le <button class="w" data-justification="1" data-k="j90-lent">score LENT (estimer la survie)</button>, la survie médiane variait de 319 jours dans le groupe à faible risque à 44 jours dans le groupe à haut risque.</p><p>Deux maladies peuvent coexister : selon la British Thoracic Society, une infection pleurale s’associe à un cancer dans environ 5 % des cas. Des symptômes qui persistent après une infection guérie justifient donc une imagerie de contrôle.</p><div class="key"><b>À retenir.</b> Le même signe radiologique recouvre une survie de quelques semaines comme une guérison complète : le pronostic se lit dans la cause, l’état général et la biologie du liquide.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1716883" target="_blank" rel="noopener">Bhatnagar et al., N Engl J Med 2018</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2014-205285" target="_blank" rel="noopener">Clive et al., score LENT, Thorax 2014</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a>.</p></section>
<section class="ilot" id="j90-3"><h2><span class="n">3</span>Du liquide normal à l’épanchement</h2><p>À l’état normal, chaque cavité pleurale contient environ 8 mL de liquide, soit 0,26 mL/kg pour les deux côtés chez l’adulte non fumeur. Ce film lubrifie le glissement des deux feuillets. Il contient surtout des macrophages et des lymphocytes. Le liquide est filtré par les capillaires systémiques de la plèvre pariétale, selon la <button class="w" data-justification="1" data-k="j90-starling">loi de Starling (pressions hydrostatique et oncotique)</button>, puis réabsorbé par les <button class="w" data-justification="1" data-k="j90-lymphe">stomates lymphatiques de la plèvre pariétale (une réserve de drainage)</button>. La capacité lymphatique dépasse largement la production : un épanchement n’apparaît que si ce drainage est débordé ou bloqué.</p><figure><svg viewBox="0 0 680 220" role="img" aria-label="Formation et résorption du liquide pleural" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><path d="M40 40v150M200 40v150"/><path d="M60 70h120" marker-end="url(#j90a1)"/><path d="M180 150h-120" stroke-dasharray="6 4"/><rect x="250" y="40" width="180" height="150" rx="8"/><path d="M470 55h170M470 105h170M470 155h170"/></g><defs><marker id="j90a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#222"/></marker></defs><g fill="#222"><text x="18" y="28">Plèvre pariétale</text><text x="160" y="28">Plèvre viscérale</text><text x="62" y="62">filtration capillaire</text><text x="62" y="172">drainage lymphatique</text><text x="262" y="68">Excès de formation :</text><text x="262" y="90">pression capillaire ↑</text><text x="262" y="110">pression oncotique ↓</text><text x="262" y="130">perméabilité ↑</text><text x="262" y="160">Défaut de résorption :</text><text x="262" y="180">lymphe bloquée</text><text x="470" y="48">transsudat : cœur, foie, rein</text><text x="470" y="98">exsudat : inflammation, cancer</text><text x="470" y="148">chyle, sang : brèche d’un vaisseau</text></g></svg><figcaption>Figure 1 — Un épanchement apparaît quand la formation dépasse la capacité de résorption, ou quand un vaisseau se rompt dans la cavité. Schéma pédagogique original, non à l’échelle.</figcaption></figure><p>Une pression veineuse élevée dans l’insuffisance cardiaque augmente la filtration ; une hypoalbuminémie sévère diminue la force qui retient l’eau dans les capillaires. Ces deux mécanismes respectent la plèvre et produisent un transsudat. Une inflammation, une infection ou une infiltration tumorale rendent au contraire la paroi capillaire perméable aux protéines, tandis qu’une tumeur des ganglions médiastinaux bloque l’évacuation lymphatique : le liquide devient un exsudat. Le liquide peut enfin venir d’ailleurs : l’ascite de la cirrhose traverse des <button class="w" data-justification="1" data-k="j90-cirrhose">brèches du diaphragme (hydrothorax hépatique)</button>, et la rupture du canal thoracique déverse du chyle.</p><p>Le symptôme dominant, la dyspnée, ne s’explique pas seulement par la compression du poumon. Le liquide distend surtout la paroi et abaisse le diaphragme. <button class="w" data-justification="1" data-k="j90-dyspnee">Un diaphragme aplati ou inversé perd son efficacité (mécanisme de la dyspnée)</button> ; c’est pourquoi l’évacuation soulage souvent davantage que ne le laisserait prévoir le gain de volume pulmonaire.</p><div class="key"><b>À retenir.</b> Pression, oncotisme, perméabilité, drainage lymphatique et brèche vasculaire : cinq mécanismes expliquent tous les épanchements. Les deux premiers donnent un transsudat ; les autres, un exsudat ou un liquide spécifique.</div><p class="src">Références : <a href="https://doi.org/10.1164/ajrccm.162.3.9910050" target="_blank" rel="noopener">Noppen et al., Am J Respir Crit Care Med 2000</a> ; <a href="https://doi.org/10.1097/MCP.0000000000000174" target="_blank" rel="noopener">Thomas et al., Curr Opin Pulm Med 2015</a>.</p></section>
<section class="ilot" id="j90-4"><h2><span class="n">4</span>Causes et terrains</h2><p>Les causes se rangent en transsudats et exsudats, auxquels s’ajoutent les liquides spécifiques. Le médecin formule ainsi une hypothèse avant la ponction, puis la confronte au liquide obtenu.</p><table class="t"><tr><th>Famille</th><th>Causes fréquentes</th><th>Causes moins fréquentes à ne pas oublier</th></tr><tr><td><b>Transsudat</b></td><td><button class="w" data-justification="1" data-k="j90-ic">Insuffisance cardiaque (bilatérale le plus souvent)</button> ; cirrhose avec ascite</td><td>Syndrome néphrotique ; dialyse péritonéale ; hypothyroïdie ; atélectasie ; syndrome de Meigs</td></tr><tr><td><b>Exsudat</b></td><td><button class="w" data-justification="1" data-k="j90-parapneumonique">Pneumonie (épanchement parapneumonique)</button> ; <button class="w" data-justification="1" data-k="j90-malin">cancer (métastase pleurale, mésothéliome)</button></td><td><button class="w" data-justification="1" data-k="j90-embolie">Embolie pulmonaire</button> ; <button class="w" data-justification="1" data-k="j90-tuberculose">tuberculose</button> ; polyarthrite rhumatoïde et lupus ; pancréatite ; <button class="w" data-justification="1" data-k="j90-medicaments">médicaments</button> ; <button class="w" data-justification="1" data-k="j90-amiante">pleurésie bénigne de l’amiante</button> ; syndrome post-lésionnel cardiaque</td></tr><tr><td><b>Liquide spécifique</b></td><td>Hémothorax après traumatisme ou geste invasif</td><td><button class="w" data-justification="1" data-k="j90-chylothorax">Chylothorax</button> ; pseudochylothorax ; urinothorax</td></tr></table><p>Le terrain pondère le tableau. Un insuffisant cardiaque connu qui présente deux épanchements symétriques a très probablement un transsudat. Le même patient avec un épanchement unilatéral, fébrile et douloureux impose d’autres hypothèses, car deux causes peuvent coexister. L’erreur fréquente consiste à imputer d’office au cœur tout épanchement d’un insuffisant cardiaque.</p><p>Trois expositions modifient la probabilité de départ : l’<b>amiante</b>, même ancienne de plusieurs décennies, oriente vers un mésothéliome ou une pleurésie bénigne ; un <b>cancer connu</b> rend une métastase pleurale probable ; une <b>origine ou un séjour</b> dans un pays de forte prévalence tuberculeuse fait remonter la tuberculose dans la liste.</p><div class="key"><b>À retenir.</b> L’insuffisance cardiaque, la pneumonie et le cancer dominent. Les autres causes se recherchent lorsque le contexte, l’aspect du liquide ou l’échec du traitement initial l’imposent.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023</a> ; <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox, base des atteintes respiratoires médicamenteuses</a>.</p></section>
<section class="ilot" id="j90-5"><h2><span class="n">5</span>Anamnèse</h2><p>L’interrogatoire ouvre le diagnostic ; la British Thoracic Society le juge essentiel. La dyspnée d’effort est le symptôme le plus fréquent ; sa vitesse d’installation renseigne sur le rythme d’accumulation. Une <button class="w" data-justification="1" data-k="j90-douleur-pleurale">douleur pleurale (inflammation de la plèvre pariétale)</button> majorée par l’inspiration et la toux signe une atteinte inflammatoire ; elle peut disparaître quand le liquide sépare les feuillets. Une toux sèche, déclenchée par les changements de position, accompagne souvent les grands épanchements.</p><p>Le médecin recherche ensuite les indices de cause : orthopnée et œdèmes des membres inférieurs pour l’insuffisance cardiaque ; ascite et consommation d’alcool pour la cirrhose ; fièvre et expectoration pour une pneumonie ; amaigrissement, sueurs nocturnes et antécédent de cancer pour une néoplasie ; contage ou séjour en zone d’endémie pour la tuberculose. Il demande l’histoire professionnelle complète, car <button class="w" data-justification="1" data-k="j90-amiante">l’exposition à l’amiante (latence de plusieurs décennies)</button> est souvent oubliée. Il recense enfin tous les médicaments, en particulier les <button class="w" data-justification="1" data-k="j90-medicaments">inhibiteurs de tyrosine kinase, première cause médicamenteuse actuelle d’exsudat</button>.</p><div class="two"><div class="card"><h4>Présentation typique</h4><p>Une dyspnée d’effort progressive s’installe sur des jours ou des semaines. L’examen trouve un syndrome d’épanchement unilatéral. Le contexte oriente : insuffisance cardiaque connue, pneumonie récente ou cancer en cours de traitement.</p></div><div class="card"><h4>Présentations atypiques</h4><p>L’épanchement peut être découvert sur une radiographie systématique, chez un patient sans symptôme. Il peut aussi se révéler par une douleur d’épaule, projetée par la plèvre diaphragmatique centrale. Chez la personne âgée, une confusion ou une baisse de l’autonomie remplace parfois la dyspnée.</p></div></div><div class="key"><b>À retenir.</b> L’anamnèse étiologique interroge la rapidité d’installation, la douleur, la fièvre, l’amaigrissement, l’exposition à l’amiante et les médicaments.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS Guideline for pleural disease, Thorax 2023, section B</a>.</p></section>
<section class="ilot" id="j90-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par la tolérance : fréquence respiratoire, saturation pulsée en oxygène, pression artérielle, fréquence cardiaque et état de conscience. Un épanchement abondant avec hypotension fait envisager un <button class="w" data-justification="1" data-k="j90-hemothorax">hémothorax (perte sanguine dans la cavité)</button> ou un épanchement compressif. Le poids et la température complètent ce premier temps.</p><div class="two"><div class="card"><h4>Syndrome d’épanchement</h4><p>La <button class="w" data-justification="1" data-k="j90-matite">matité déclive (le liquide ne résonne pas)</button> est le signe le plus utile. Le <button class="w" data-justification="1" data-k="j90-murmure">murmure vésiculaire est diminué ou aboli (le liquide atténue le son)</button>. Les <button class="w" data-justification="1" data-k="j90-vibrations">vibrations vocales sont abolies (la transmission est interrompue)</button>. Un souffle pleurétique doux peut être entendu à la limite supérieure du liquide.</p></div><div class="card"><h4>Signes associés et signes de cause</h4><p>Un <button class="w" data-justification="1" data-k="j90-frottement">frottement pleural (deux feuillets inflammatoires)</button> traduit une pleurésie débutante ou en voie de résolution. Une <button class="w" data-justification="1" data-k="j90-deviation">déviation de la trachée (effet de masse ou rétraction)</button> renseigne sur la pression intrathoracique. La turgescence jugulaire, l’ascite, les adénopathies ou un hippocratisme digital orientent vers la cause.</p></div></div><p>Ces signes n’apparaissent qu’au-delà d’un certain volume et manquent souvent chez le patient obèse ou alité. Un examen normal n’exclut donc pas un petit épanchement, que l’échographie détecte avec une sensibilité bien supérieure.</p><div class="key"><b>À retenir.</b> Matité, abolition du murmure et des vibrations vocales définissent le syndrome d’épanchement. Les signes de gravité et de cause comptent autant que le diagnostic positif.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219371" target="_blank" rel="noopener">BTS Clinical Statement on pleural procedures, Thorax 2023</a>.</p><button class="pareto-btn ui" data-k="pareto-j90-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
