<template data-pop="j12-virus-respi" data-title="Les virus respiratoires communautaires"><p class="lab">Définition</p><p>Ce sont les virus qui circulent dans la population et se transmettent d’une personne à l’autre par gouttelettes, aérosols et contact. Au moins 26 virus ont été associés à la pneumonie communautaire : VRS, rhinovirus, influenza, hMPV, virus parainfluenza 1 à 4, bocavirus, coronavirus saisonniers, SARS-CoV-2, adénovirus et entérovirus en sont les principaux.</p><p class="lab">Circulation en Suisse</p><p>Le Centre national de référence de l’influenza analyse les frottis du réseau Sentinella pour le SARS-CoV-2, l’influenza, le VRS, le rhinovirus, l’adénovirus, le bocavirus, quatre coronavirus saisonniers, le hMPV et les virus parainfluenza. Le VRS circule de novembre à mars ou avril ; le rhinovirus surtout en été et en automne.</p><div class="key"><b>Conséquence pratique.</b> Plusieurs virus circulent en même temps : la saison oriente, mais seul un test identifie l’agent.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport 2023/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, VRS 2026</a>.</p></template>
<template data-pop="j12-immunosup" data-title="Immunosuppression sévère selon la SSI"><p class="lab">Définition</p><p>La recommandation suisse sur la pneumonie communautaire exclut les patients sévèrement immunodéprimés : neutropénie, corticothérapie à forte dose (20 mg d’équivalent prednisone pendant au moins quatre semaines), greffe d’organe solide, greffe de cellules souches hématopoïétiques, immunodéficience primaire, hypogammaglobulinémie et infection par le VIH avec CD4 inférieurs à 200/µL.</p><p class="lab">Pourquoi ce seuil change la conduite</p><p>Chez ces patients, les agents opportunistes (CMV, Aspergillus, <i>Pneumocystis</i>) s’ajoutent aux germes communautaires, et le traitement empirique standard ne les couvre pas. L’enquête microbiologique devient précoce et souvent invasive.</p><div class="key"><b>Limite.</b> D’autres traitements exposent au même risque : la SSI classe parmi les patients à haut risque de COVID-19 grave ceux qui reçoivent des anticorps anti-CD20 ou anti-CD19, un inhibiteur de la tyrosine kinase de Bruton ou des lymphocytes T à récepteur antigénique chimérique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a>.</p></template>
<template data-pop="j12-ecil-def" data-title="Pneumonie attribuable à un virus respiratoire chez l’immunodéprimé (ECIL-10)"><p class="lab">Quatre degrés de certitude</p><p><b>Possible</b> : signes d’infection respiratoire basse et virus détecté au frottis nasopharyngé. <b>Probable</b> : virus au frottis et infiltrat ou hypoxémie nouveaux ou progressifs. <b>Confirmée au laboratoire</b> : virus au lavage broncho-alvéolaire avec infiltrat ou hypoxémie. <b>Prouvée</b> : lésions virales à l’histologie pulmonaire.</p><p class="lab">Nuances</p><p>La détection de rhinovirus, de coronavirus saisonnier, de bocavirus ou d’adénovirus au seul frottis ne suffit pas pour une pneumonie probable : un prélèvement bas est nécessaire. Une contamination haute du lavage est peu probable si sa charge virale dépasse d’au moins dix fois celle du nasopharynx. Si l’imagerie est normale, une obstruction bronchique peut traduire l’atteinte basse.</p><div class="key"><b>Limite.</b> Ces critères sont proposés par des experts pour la recherche et la décision chez le patient d’hématologie ; ils ne s’appliquent pas tels quels à l’immunocompétent.</div><p class="src">Référence : <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, virus respiratoires communautaires, septembre 2024</a>.</p></template>
<template data-pop="j12-sentinella" data-title="Le réseau Sentinella et les virus détectés en 2023/2024"><p class="lab">Méthode</p><p>Des médecins de premier recours déclarent leurs consultations pour syndrome grippal ou infection respiratoire aiguë et envoient une partie des frottis nasopharyngés au Centre national de référence, qui les analyse par PCR multiplex. En 2023/2024, 1645 des 2616 frottis (62,9 %) contenaient au moins un virus et 5,2 % en contenaient plusieurs.</p><table class="t"><tr><th>Virus</th><th>Positivité annuelle</th></tr><tr><td>SARS-CoV-2</td><td>21,6 %</td></tr><tr><td>Rhinovirus</td><td>16,9 %</td></tr><tr><td>Influenza</td><td>14,0 %</td></tr><tr><td>hMPV</td><td>3,0 %</td></tr><tr><td>VRS</td><td>2,8 %</td></tr><tr><td>Parainfluenza 1 et 3</td><td>2,3 %</td></tr><tr><td>Adénovirus</td><td>2,0 %</td></tr></table><p>La positivité au SARS-CoV-2 augmentait avec l’âge ; celle de l’adénovirus, du rhinovirus et du VRS diminuait. La positivité aux virus parainfluenza 1 et 3 était plus élevée après 65 ans que chez l’adulte plus jeune.</p><div class="key"><b>Limite.</b> Ces chiffres concernent des infections vues en ambulatoire, non des pneumonies hospitalisées ; ils varient d’une saison à l’autre.</div><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40 du 30.09.2024</a>.</p></template>
<template data-pop="j12-fardeau-vrs" data-title="Le fardeau du VRS chez l’adulte en Suisse"><p class="lab">Données</p><p>Une modélisation européenne estime à 280 pour 100 000 (215 à 345) l’incidence des hospitalisations liées au VRS chez les adultes suisses de 60 ans ou plus. Les données de l’Office fédéral de la statistique, non corrigées, montrent un taux près de quatre fois plus élevé après 75 ans qu’entre 65 et 74 ans. La durée moyenne de séjour est de 7,9 jours entre 65 et 74 ans et de 9,9 jours au-delà ; la létalité atteint 2,4 % et 3,9 %.</p><p class="lab">Pourquoi le chiffre est sous-estimé</p><p>Les adultes excrètent moins de virus que les enfants et consultent souvent après le pic d’excrétion ; le VRS est rarement recherché. Selon l’OFSP, le sous-diagnostic va de 1,5 à plus de 20 fois.</p><div class="key"><b>Conséquence pratique.</b> L’OFSP retient 200 à 400 hospitalisations pour 100 000 après 75 ans, environ 2800 par an : c’est la base de la vaccination dès cet âge.</div><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, Recommandations VRS, mise à jour 2026, chapitre 4.3</a>.</p></template>
<template data-pop="j12-ace2" data-title="Entrée cellulaire du SARS-CoV-2 : ACE2 et TMPRSS2"><p class="lab">Mécanisme</p><p>La protéine de spicule du SARS-CoV-2 se fixe à l’enzyme de conversion de l’angiotensine 2, le même récepteur que celui du SARS-CoV de 2003. La sérine protéase cellulaire TMPRSS2 clive ensuite la spicule, étape d’amorçage nécessaire à la fusion. Un inhibiteur de TMPRSS2 bloque l’entrée in vitro.</p><p class="lab">Conséquence</p><p>Les cellules qui expriment ces deux protéines sont la porte d’entrée du virus. Le mécanisme explique la parenté clinique avec le SARS de 2003, et le sérum de convalescents de ce SARS neutralisait l’entrée du nouveau virus in vitro.</p><div class="key"><b>Limite.</b> Ces résultats proviennent de cultures cellulaires ; l’inhibiteur de TMPRSS2 étudié n’est pas un traitement recommandé de la COVID-19.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/32142651/" target="_blank" rel="noopener">Hoffmann et al., Cell 2020</a>.</p></template>
<template data-pop="j12-dad" data-title="Dommage alvéolaire diffus"><p class="lab">Définition</p><p>Lésion histologique des formes graves : desquamation des pneumocytes, œdème des cloisons et de la lumière alvéolaires, membranes hyalines tapissant l’alvéole, puis hyperplasie des pneumocytes de type 2. Elle a été décrite dans les décès dus au SARS, à la grippe H5N1, à la grippe pandémique de 2009 et à la COVID-19.</p><p class="lab">Conséquence</p><p>L’alvéole remplie n’échange plus les gaz : l’hypoxémie devient réfractaire à l’oxygène standard et le tableau évolue vers le SDRA. Dans la COVID-19, l’atteinte endothéliale et les microthrombi capillaires ajoutent un trouble de la perfusion.</p><div class="key"><b>Limite.</b> Ces descriptions proviennent de séries autopsiques de petite taille ; elles décrivent les formes mortelles, non les formes communes.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32437596/" target="_blank" rel="noopener">Ackermann et al., 2020</a>.</p></template>
<template data-pop="j12-hypox-silencieuse" data-title="Hypoxémie peu symptomatique de la COVID-19"><p class="lab">Observation</p><p>Chez plus de la moitié de 150 patients mesurés, une hypoxémie sévère coexistait avec une compliance respiratoire presque normale. Certains respiraient normalement malgré l’hypoxémie, d’autres étaient très dyspnéiques.</p><p class="lab">Mécanisme proposé</p><p>Le poumon contient encore un volume gazeux presque normal ; l’hypoxémie résulte d’une perte de la régulation de la perfusion et de la vasoconstriction hypoxique. La compliance conservée permet d’inspirer le volume attendu sans effort perçu ; l’hyperventilation abaisse la PaCO₂.</p><div class="key"><b>Conséquence pratique.</b> Toute suspicion de pneumonie impose l’oxymétrie, même chez un patient qui ne se plaint pas de dyspnée.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/32291463/" target="_blank" rel="noopener">Gattinoni et al., Intensive Care Med 2020 (hypothèse physiopathologique)</a>.</p></template>
<template data-pop="j12-biphasique" data-title="Évolution en deux phases de la COVID-19"><p class="lab">Description de la SSI</p><p>La première phase, entre le deuxième et le sixième jour environ, est dominée par la réplication virale et des symptômes d’infection des voies hautes. Chez une minorité, une seconde phase apparaît vers le sixième au dixième jour : réponse immunitaire innée intense et déréglée, tableau proche du SDRA, parfois défaillance multiviscérale, alors que la réplication décline chez l’immunocompétent.</p><p class="lab">Conséquence thérapeutique</p><p>Les antiviraux préviennent la forme grave lorsqu’ils sont donnés dans la première phase. Dans la seconde, les corticoïdes, les antagonistes du récepteur de l’interleukine 6 ou le baricitinib réduisent la mortalité.</p><div class="key"><b>Limite.</b> L’évolution complète en deux phases est devenue rare grâce à l’immunité acquise par vaccination ou infection.</div><p class="src">Référence : <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, version validée le 05.02.2026</a>.</p></template>
<template data-pop="j12-coinf" data-title="Co-infection virale et bactérienne"><p class="lab">Données</p><p>Une infection virale peut être suivie d’une surinfection bactérienne : la plupart des décès des pandémies grippales de 1918, 1957 et 1968 en relevaient probablement. Chez l’adulte atteint de pneumonie, une infection mixte est retrouvée dans 14 à 15 % des cas, le plus souvent rhinovirus ou influenza A avec <i>Streptococcus pneumoniae</i>. L’association grippe et <i>Staphylococcus aureus</i> peut être mortelle.</p><p class="lab">Pronostic</p><p>La mortalité est plus élevée en cas d’infection mixte (rapport de cotes 2,1).</p><div class="key"><b>Conséquence pratique.</b> Après une grippe, la SSI ajoute la clindamycine ou le linézolide à un traitement anti-staphylococcique jusqu’à exclusion d’une toxine de Panton-Valentine.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27246595/" target="_blank" rel="noopener">Burk et al., 2016</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a>.</p></template>
<template data-pop="j12-aspergillose" data-title="Aspergillose pulmonaire invasive"><p class="lab">Terrains</p><p>L’aspergillose invasive touche classiquement l’immunodéprimé ; l’ESCMID recommande une prophylaxie par posaconazole lors de l’induction d’une leucémie aiguë myéloïde ou d’un syndrome myélodysplasique. Elle complique aussi les pneumonies virales graves : dans une cohorte belgo-néerlandaise, 19 % des grippes admises en réanimation (32 % des immunodéprimés, 14 % des autres) ont développé une aspergillose, avec une mortalité à 90 jours de 51 % contre 28 %. Le SARS-CoV-2 lèse directement l’épithélium des voies aériennes et permet l’invasion aspergillaire.</p><p class="lab">Diagnostic et traitement</p><p>Le scanner et la bronchoscopie avec lavage sont fortement recommandés ; le galactomannane sérique et du lavage sert de marqueur. Le voriconazole et l’isavuconazole sont les traitements de première ligne ; l’amphotéricine B liposomale s’impose si une résistance aux azolés est à craindre.</p><div class="key"><b>Piège.</b> Les corticoïdes figuraient parmi les facteurs associés à l’aspergillose dans la cohorte grippale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29544767/" target="_blank" rel="noopener">Ullmann et al., ESCMID-ECMM-ERS, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30076119/" target="_blank" rel="noopener">Schauwvlieghe et al., 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33333012/" target="_blank" rel="noopener">Koehler et al., consensus ECMM et ISHAM, 2021</a>.</p></template>
<template data-pop="j12-risque-covid" data-title="Patients à haut risque de COVID-19 grave (SSI)"><p class="lab">Liste</p><p>Infection par le VIH avec CD4 inférieurs à 200/µL ; immunodéficience primaire ; anticorps anti-CD20 ou anti-CD19 et autres déplétions B, inhibiteurs de la tyrosine kinase de Bruton ; corticoïdes à plus de 20 mg d’équivalent prednisone par jour ; hémopathies malignes, greffe de cellules souches, lymphocytes T à récepteur antigénique chimérique, neutropénie inférieure à 1000/µL pendant une semaine ou plus ; drépanocytose ; greffe d’organe solide ; cancer sous chimiothérapie cytotoxique.</p><p class="lab">Âge</p><p>Aucun seuil d’âge n’est établi ; la plupart des hospitalisations concernent des adultes de plus de 70 ans. Le traitement précoce du sujet âgé se décide au cas par cas, selon les comorbidités, l’immunité et les antécédents.</p><div class="key"><b>Conséquence pratique.</b> L’immunité acquise rend la plupart des infections bénignes, même chez le patient à risque : la majorité des experts limite le traitement précoce à cette liste.</div><p class="src">Référence : <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a>.</p></template>
<template data-pop="j12-hmpv" data-title="Métapneumovirus humain et virus parainfluenza"><p class="lab">Clinique</p><p>Le hMPV infecte à tout âge. Des foyers mortels ont été décrits en établissement de soins de longue durée ; parmi les adultes hospitalisés pour une infection à hMPV, 27 % avaient un infiltrat, 12 % une assistance ventilatoire et 7 % sont décédés. Chez le greffé, l’ECIL range le hMPV et les virus parainfluenza parmi les virus à forte propension à gagner les voies basses.</p><p class="lab">Traitement</p><p>Aucun antiviral n’a démontré son efficacité. Chez le greffé, l’ECIL ne recommande pas la ribavirine de façon générale et propose des immunoglobulines intraveineuses en cas d’hypogammaglobulinémie inférieure à 4,5 g/L, ainsi qu’une réduction des corticoïdes au-dessous de 1 mg/kg par jour.</p><div class="key"><b>Limite.</b> Les données cliniques de ces virus restent limitées, souvent issues de séries hospitalières.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, 2024</a>.</p></template>
<template data-pop="j12-adenovirus" data-title="Pneumonie à adénovirus"><p class="lab">Clinique</p><p>L’adénovirus cause une faible part des pneumonies, mais les sérotypes 3, 7 et 14 peuvent provoquer une pneumonie nécrosante sévère, parfois mortelle. Il a été impliqué dans 90 % des hospitalisations pour pneumonie chez des recrues militaires.</p><p class="lab">Chez le greffé</p><p>L’adénovirus se dissémine volontiers. L’ECIL recommande de doser l’ADN adénoviral sanguin dès qu’il est détecté dans un prélèvement respiratoire, de réduire l’immunosuppression si possible, et de discuter le cidofovir intraveineux si la charge sanguine dépasse 1000 copies/mL chez un patient dont les lymphocytes sont inférieurs à 200/µL.</p><div class="key"><b>Piège.</b> La PCR est nettement plus sensible que la détection d’antigène pour l’adénovirus.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, 2024</a>.</p></template>
<template data-pop="j12-cmv" data-title="Pneumonie à cytomégalovirus"><p class="lab">Définitions (ECIL-7)</p><p>La pneumonie à CMV est prouvée par des signes de pneumonie (infiltrat, hypoxie, tachypnée ou dyspnée) et la mise en évidence du CMV dans le tissu pulmonaire ; elle est probable si le CMV est détecté au lavage broncho-alvéolaire chez un patient qui a des signes de pneumonie.</p><p class="lab">Interprétation du lavage</p><p>Une PCR négative au lavage a une valeur prédictive négative proche de 100 %. La probabilité de pneumonie croît avec la charge ; aucun seuil universel n’existe. Chez le greffé allogénique, une charge de 200 à 500 UI/mL a une valeur prédictive positive d’environ 50 %.</p><p class="lab">Traitement</p><p>L’ECIL recommande le ganciclovir intraveineux ; le foscarnet est une alternative ; des immunoglobulines peuvent être ajoutées. Le cidofovir ou l’association foscarnet-ganciclovir sont des options de deuxième ou troisième ligne ; le maribavir s’ajoute pour la maladie réfractaire ou résistante (ECIL-10).</p><div class="key"><b>Prévention.</b> Chez le receveur séropositif d’une greffe allogénique, le letermovir est la prophylaxie de choix, débutée au plus tard au 28e jour et poursuivie au moins jusqu’au 100e.</div><p class="src">Références : <a href="https://www.ecil-leukaemia.com/images/resources/2017/1_ECIL_7_CMV_final_slides_for_website.pdf" target="_blank" rel="noopener">ECIL-7, 2017</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/Recommendation_slides_ECIL_10_CMV_working_group_final_.pdf" target="_blank" rel="noopener">ECIL-10, CMV, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31153807/" target="_blank" rel="noopener">Ljungman et al., ECIL-7, Lancet Infect Dis 2019</a>.</p></template>
<template data-pop="j12-varicelle" data-title="Pneumonie varicelleuse"><p class="lab">Clinique</p><p>Dans une cohorte de 102 patients admis en réanimation dans 29 services, l’âge médian était de 39 ans et 52 % étaient immunodéprimés. Presque tous avaient l’éruption typique à l’admission. La moitié a été ventilée dans les 24 à 48 heures, avec un SDRA chez 80 % d’entre eux ; la mortalité atteignait 17 % en réanimation et 24 % à l’hôpital.</p><p class="lab">Traitement</p><p>Tous les patients ont reçu de l’aciclovir. Les corticoïdes n’ont pas modifié la mortalité mais ont accru les infections acquises en réanimation et allongé la ventilation.</p><div class="key"><b>Arbitrage.</b> Une revue de 2011 évoquait un bénéfice possible des corticoïdes associés à l’aciclovir ; la cohorte de 2017, plus récente et plus précise, ne le confirme pas et montre davantage d’infections.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28592328/" target="_blank" rel="noopener">Mirouse et al., Crit Care 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a>.</p></template>
<template data-pop="j12-rougeole" data-title="Pneumonie de la rougeole"><p class="lab">Données</p><p>La rougeole se complique de pneumonie dans 1 à 6 % des cas ; la pneumonie cause six décès liés à la rougeole sur dix. La létalité, de 1 à 3 pour 1000 cas, est maximale avant cinq ans et chez l’immunodéprimé ; elle tient surtout aux surinfections bactériennes.</p><p class="lab">Signe d’alerte</p><p>Une fièvre qui persiste plus de un à deux jours après le début de l’éruption fait suspecter une complication.</p><div class="key"><b>Conséquence pratique.</b> Les surinfections bactériennes sont traitées par antibiotique ; une antibioprophylaxie systématique n’est pas indiquée.</div><p class="src">Référence : <a href="https://www.ecdc.europa.eu/en/measles/facts" target="_blank" rel="noopener">ECDC, Facts about measles</a>.</p></template>
<template data-pop="j12-chlamydia" data-title="Chlamydia pneumoniae et Chlamydia psittaci"><p class="lab"><i>C. pneumoniae</i></p><p>Bactérie intracellulaire de la pneumonie communautaire. Elle s’associe souvent à <i>S. pneumoniae</i> ou à un virus respiratoire ; l’âge augmente le risque de pneumonie à <i>Chlamydia</i>. Les macrolides couvrent ce germe selon leur information professionnelle suisse.</p><p class="lab"><i>C. psittaci</i> : psittacose</p><p>Zoonose transmise par les oiseaux, d’exposition professionnelle ou domestique. Elle va de l’infection asymptomatique à la pneumonie atypique sévère avec atteinte systémique ; elle cause environ 1 % des pneumonies communautaires (0 à 6,7 % selon les études). En Belgique, le système de déclaration n’enregistrait que 24 % des résultats positifs.</p><div class="key"><b>Lacune nommée.</b> Aucune recommandation suisse ou européenne spécifique du traitement de la psittacose n’a été trouvée ; la doxycycline est retenue sur la base de son activité documentée dans l’information professionnelle suisse.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21951385/" target="_blank" rel="noopener">Woodhead et al., ERS et ESCMID, 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28946931/" target="_blank" rel="noopener">Hogerwerf et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30882289/" target="_blank" rel="noopener">Rybarczyk et al., 2020</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680659520017" target="_blank" rel="noopener">Information professionnelle Doxycyclin-Mepha</a>.</p></template>
<template data-pop="j12-fievreq" data-title="Fièvre Q"><p class="lab">Agent et transmission</p><p><i>Coxiella burnetii</i> a pour réservoir les bovins, ovins et chèvres. Les produits de la mise bas, en particulier le placenta, sont très infectieux ; l’homme s’infecte surtout en inhalant des poussières contaminées. La bactérie survit des mois dans la poussière sèche.</p><p class="lab">Clinique</p><p>L’infection est souvent asymptomatique. Dans environ la moitié des cas, la maladie débute deux à trois semaines après la contamination par une fièvre brutale, des frissons, des sueurs et des céphalées ; une toux sèche et des douleurs thoraciques sont fréquentes. Environ 1 % évolue vers une fièvre Q chronique, dominée par l’endocardite.</p><p class="lab">En Suisse</p><p>La déclaration est de nouveau obligatoire depuis novembre 2012 ; 40 à 100 cas sont déclarés chaque année. La SSI traite par doxycycline 100 mg toutes les 12 heures, avec une alternative par ciprofloxacine.</p><div class="key"><b>Piège.</b> Le bilan standard de la pneumonie ne comporte pas de test de <i>C. burnetii</i> : seule l’anamnèse d’exposition le fait demander.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/fievre-q" target="_blank" rel="noopener">OFSP, Fièvre Q</a> ; <a href="https://www.ecdc.europa.eu/en/q-fever/facts" target="_blank" rel="noopener">ECDC, Facts about Q fever</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a>.</p></template>
<template data-pop="j12-nocardiose" data-title="Nocardiose pulmonaire"><p class="lab">Quand y penser</p><p>Devant une pneumonie qui ne répond pas au traitement initial, la SSI recommande de rechercher les germes résistants ou rares, dont <i>Nocardia</i>, les mycobactéries et les champignons, par culture des expectorations ou bronchoscopie avec lavage, voire biopsie.</p><p class="lab">Traitement</p><p>L’information professionnelle suisse du triméthoprime-sulfaméthoxazole prévoit chez l’adulte 480 à 640 mg de triméthoprime par jour pendant au moins trois mois ; des traitements de 18 mois ont été rapportés. La dose s’adapte à l’âge, au poids, à la fonction rénale et à la gravité.</p><div class="key"><b>Lacune nommée.</b> Les sources consultées ne détaillent ni les terrains ni la présentation radiologique de la nocardiose.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680378870561" target="_blank" rel="noopener">Information professionnelle Bactrim® intraveineux, mars 2023</a>.</p></template>
<template data-pop="j12-signes-gravite" data-title="Signes d’alerte d’une infection respiratoire aiguë (SSI)"><p class="lab">Critères</p><p>La SSI fait envisager l’hospitalisation devant une mauvaise impression clinique générale, une pression systolique inférieure à 90 mmHg, une fréquence respiratoire d’au moins 30 par minute, une SpO₂ inférieure à 92 %, des hémoptysies, un stridor, une maladie pulmonaire sévère ou une immunodéficience sévère.</p><p class="lab">Pourquoi</p><p>La tachypnée traduit un travail respiratoire que le patient ne pourra pas soutenir longtemps ; l’hypotension, une hypoperfusion ; la désaturation, une atteinte des échanges gazeux.</p><div class="key"><b>Conséquence pratique.</b> Un seul de ces signes suffit à discuter l’hospitalisation, quel que soit l’agent.</div><p class="src">Référence : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, Infection respiratoire aiguë, version validée le 01.09.2026</a>.</p></template>
<template data-pop="j12-crb65" data-title="Score CRB-65"><p class="lab">Définition</p><p>Un point pour chacun des critères : confusion récente ; fréquence respiratoire d’au moins 30 par minute ; pression systolique inférieure à 90 mmHg ou diastolique inférieure ou égale à 60 mmHg ; âge d’au moins 65 ans. Plus de deux points définissent une pneumonie sévère.</p><p class="lab">Usage selon la SSI</p><p>L’hospitalisation se discute dès un point, sauf si l’âge est le seul critère. Elle se discute aussi, quel que soit le score, devant une SpO₂ inférieure à 90 %, une comorbidité instable, une complication ou un contexte social défavorable.</p><div class="key"><b>Limite.</b> Le score ne mesure pas l’oxygénation : il se complète toujours de la SpO₂ et de l’évaluation du statut fonctionnel.</div><p class="src">Référence : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, version validée le 09.09.2026</a>.</p></template>
<template data-pop="j12-imagerie" data-title="Imagerie de la pneumonie virale"><p class="lab">Radiographie et échographie</p><p>La SSI exige l’imagerie chez le patient hospitalisé et la recommande en ambulatoire devant une suspicion de pneumonie : radiographie de face et de profil, ou échographie pulmonaire si un opérateur qualifié est présent, qui ne voit pas les pneumonies centrales. Pour une simple infection respiratoire aiguë ambulatoire, la radiographie n’est pas recommandée de routine.</p><p class="lab">Aspects</p><p>Les virus donnent des infiltrats interstitiels ou alvéolaires ; dans la pneumonie à VRS, des infiltrats sous-segmentaires unilatéraux ou en plages et souvent une condensation lobaire. Au scanner, des micronodules en arbre en bourgeons, des condensations multifocales et du verre dépoli ont été décrits sans que les radiologues évoquent une cause virale.</p><div class="key"><b>Piège.</b> L’aspect radiologique ne permet pas de distinguer de manière fiable un virus d’une bactérie.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, Infection respiratoire aiguë, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, VRS 2026</a>.</p></template>
<template data-pop="j12-pcr" data-title="PCR virale : choix et interprétation"><p class="lab">Choix du test</p><p>Pour l’influenza, la PCR est le test de choix ; les tests moléculaires rapides au lit raccourcissent le délai. Les tests antigéniques rapides ne sont pas recommandés chez l’adulte pour l’influenza. Pour le SARS-CoV-2, la SSI accepte un test antigénique rapide ou une PCR pour confirmer l’infection avant un antiviral.</p><p class="lab">Prélèvement</p><p>Le prélèvement vient du site atteint : nasopharynx pour l’atteinte haute, lavage broncho-alvéolaire pour l’atteinte basse, ou à défaut aspiration trachéale ou expectoration. Les sérologies virales ne servent pas au diagnostic chez l’immunodéprimé.</p><p class="lab">Interprétation</p><p>La PCR détecte aussi une excrétion prolongée ou une infection asymptomatique : le rhinovirus est retrouvé chez environ 15 % des sujets sans symptôme. Plusieurs virus sont parfois détectés ensemble.</p><div class="key"><b>Conséquence pratique.</b> En ambulatoire, la SSI ne recommande un test spécifique que si un antiviral est envisagé ; une recherche de coqueluche peut se discuter en contexte épidémique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a>.</p></template>
<template data-pop="j12-crp-pct" data-title="CRP et procalcitonine : quand doser, comment lire"><p class="lab">Quand ne pas doser</p><p>Devant une toux aiguë avec au moins deux critères parmi rhinorrhée, mal de gorge ou enrouement, fièvre inférieure à 38,5 °C, et sans dyspnée, tachycardie ni râles, le bénéfice d’un antibiotique est estimé à moins de 1 à 3 % : la SSI déconseille le dosage.</p><p class="lab">Quand doser</p><p>Toux aiguë avec au moins un critère : fièvre d’au moins 38,5 °C depuis plus de trois jours, dyspnée, fréquence respiratoire d’au moins 22 par minute, anomalie focale à l’auscultation ou pouls d’au moins 100 par minute.</p><p class="lab">Seuils</p><p>Antibiotique envisagé si CRP ≥ 100 mg/L ou procalcitonine ≥ 0,25 µg/L ; traitement symptomatique si CRP &lt; 50 mg/L ou procalcitonine &lt; 0,25 µg/L ; décision partagée entre 50 et 100 mg/L. La procalcitonine monte 6 à 12 heures après le début d’une infection bactérienne et diminue de moitié chaque jour lorsqu’elle est contrôlée.</p><div class="key"><b>Limite.</b> En juin 2025, le dosage de la procalcitonine au cabinet n’était pas remboursé en Suisse ; aucun marqueur ne distingue seul virus et bactérie.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, Infection respiratoire aiguë, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a>.</p></template>
<template data-pop="j12-pcp" data-title="Pneumocystose, diagnostic différentiel de l’immunodéprimé"><p class="lab">Pourquoi y penser</p><p>Chez une personne vivant avec le VIH, la pneumonie à SARS-CoV-2 peut ressembler à la pneumocystose, que l’EACS place dans le diagnostic différentiel. En hématologie, la pneumocystose est plus aiguë et plus souvent sévère, liée aux corticoïdes, et sa mortalité atteint 30 à 60 % ; la plupart des cas surviennent sans prophylaxie adéquate.</p><p class="lab">Diagnostic</p><p>L’identification au lavage broncho-alvéolaire a une sensibilité supérieure à 95 %, contre 80 % au plus pour l’expectoration induite. La PCR en temps réel est la méthode de routine ; un β-D-glucane sérique négatif exclut la maladie chez le patient à risque.</p><p class="lab">Traitement</p><p>Le triméthoprime-sulfaméthoxazole à forte dose est le traitement de choix, pendant environ trois semaines, suivi d’une prophylaxie secondaire. Chez la personne vivant avec le VIH, la prednisone s’ajoute si la PaO₂ est inférieure à 70 mmHg ; hors VIH, l’ECIL décide des corticoïdes au cas par cas.</p><div class="key"><b>Piège.</b> La preuve au lavage ne doit pas retarder le traitement d’une pneumocystose suspectée.</div><p class="src">Références : <a href="https://www.eacsociety.org/media/guidelines-12.0.pdf" target="_blank" rel="noopener">EACS 12.0, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27550990/" target="_blank" rel="noopener">Cordonnier et al., 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27550991/" target="_blank" rel="noopener">Alanio et al., 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27550993/" target="_blank" rel="noopener">Maschmeyer et al., ECIL-5, traitement, 2016</a>.</p></template>
<template data-pop="j12-sdra" data-title="Assistance respiratoire : recommandations européennes"><p class="lab">Avant l’intubation</p><p>L’ESICM recommande l’oxygénothérapie nasale à haut débit plutôt que l’oxygène standard en cas d’insuffisance respiratoire aiguë hypoxémique sans œdème cardiogénique ni exacerbation de BPCO (recommandation forte). Dans la COVID-19, la CPAP ou la VNI peuvent la remplacer pour réduire l’intubation, et le décubitus ventral éveillé est suggéré. Les recommandations ERS, ESICM, ESCMID et Asociación Latinoamericana de Tórax suggèrent aussi le haut débit dans la pneumonie communautaire grave hypoxémique.</p><p class="lab">Après l’intubation</p><p>L’ESICM recommande un volume courant de 4 à 8 mL/kg de poids prédit dans le SDRA non lié à la COVID-19, et le décubitus ventral si le rapport PaO₂/FiO₂ reste inférieur à 150 mmHg avec une pression expiratoire positive d’au moins 5 cm d’eau.</p><div class="key"><b>Mécanisme.</b> Le haut débit délivre une FiO₂ élevée, un léger effet de pression positive et un lavage de l’espace mort ; le décubitus ventral homogénéise les contraintes pulmonaires.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37326646/" target="_blank" rel="noopener">Grasselli et al., ESICM, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37012484/" target="_blank" rel="noopener">Martin-Loeches et al., 2023</a>.</p></template>
<template data-pop="j12-stabilite" data-title="Stabilité clinique, relais oral et échec"><p class="lab">Critères de stabilité (SSI)</p><p>Prise orale possible, état mental normal, pression systolique d’au moins 90 mmHg, fréquence cardiaque d’au plus 100 par minute, température d’au plus 37,8 °C, fréquence respiratoire d’au plus 24 par minute, SpO₂ d’au moins 90 % ou retour à la valeur de base. Tous doivent être réunis pour le relais oral.</p><p class="lab">Échec</p><p>Pneumonie évolutive : aggravation dans les 72 heures malgré un traitement adéquat. Réponse retardée : absence de stabilité à 72 heures sans progression. Pneumonie persistante : infiltrat non résolu après 30 jours. Échec secondaire : aggravation après une stabilisation initiale.</p><div class="key"><b>Conséquence pratique.</b> Un échec impose de rechercher une complication (épanchement compliqué, empyème), un germe résistant ou rare et un diagnostic alternatif.</div><p class="src">Référence : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a>.</p></template>
<template data-pop="j12-contentieux-cortico" data-title="Corticoïdes dans les pneumonies virales : arbitrage entre sources"><p class="lab">Ce qui est établi</p><p>Dans la COVID-19, la dexaméthasone réduit la mortalité des patients sous oxygène ou ventilés, non celle des patients sans assistance respiratoire. Dans la grippe, la SSI déconseille les corticoïdes, sauf autre indication.</p><p class="lab">Le contentieux</p><p>La SSI (version validée le 09.09.2026) juge les corticoïdes clairement indiqués dans toute pneumonie communautaire sévère, même sans choc, par exemple hydrocortisone 200 mg par jour ou prednisone 50 mg par jour pendant quatre à huit jours. Les recommandations ERS, ESICM, ESCMID et Asociación Latinoamericana de Tórax de 2023 ne les suggèrent qu’en cas de choc (recommandation conditionnelle, preuve faible) et précisent que cette suggestion ne s’applique pas aux pneumonies virales graves (grippe, SARS, MERS), exclues des essais.</p><p class="lab">Choix retenu</p><p>La source primaire applicable la plus récente, la SSI 2026, est retenue pour la pneumonie communautaire sévère de cause bactérienne ou indéterminée. Pour une pneumonie virale documentée autre que la COVID-19, aucune des deux sources n’apporte de preuve directe : la décision reste individuelle. Chez le greffé, l’ECIL propose de réduire les corticoïdes au-dessous de 1 mg/kg par jour lors d’une infection basse à VRS, hMPV ou parainfluenza.</p><div class="key"><b>Textes en vigueur.</b> Les deux recommandations restent accessibles par leurs liens ; la SSI renvoie elle-même aux recommandations internationales, dont elle s’écarte sur ce point.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37012484/" target="_blank" rel="noopener">Martin-Loeches et al., 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32678530/" target="_blank" rel="noopener">Recovery Collaborative Group, 2021</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, 2024</a>.</p></template>
<template data-pop="j12-isolement" data-title="Mesures d’isolement"><p class="lab">Transmission</p><p>Le VRS se transmet par gouttelettes lors d’un contact rapproché, par aérosols et par les mains à partir de surfaces contaminées ; la contagiosité commence un jour avant les symptômes et dure trois à huit jours.</p><p class="lab">Recommandations de l’ECIL</p><p>Chez les patients d’hématologie et les greffés, l’ECIL applique les précautions gouttelettes et contact à tous les virus respiratoires communautaires : chambre individuelle, gants, surblouse, masque et protection oculaire pour le personnel et les visiteurs. Les soignants et visiteurs malades n’entrent pas dans le service.</p><div class="key"><b>Conséquence pratique.</b> La détection d’un virus chez un patient hospitalisé sert aussi à protéger ses voisins immunodéprimés.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/virus-respiratoire-syncytial-humain-vrs" target="_blank" rel="noopener">OFSP, VRS</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, 2024</a>.</p></template>
<template data-pop="j12-vaccin-vrs" data-title="Vaccination contre le VRS chez l’adulte (OFSP et CFV, 2026)"><p class="lab">Recommandation</p><p>Une dose d’un vaccin autorisé, de préférence entre mi-octobre et mi-novembre : à toute personne de 75 ans ou plus ; de 65 à 74 ans en cas de haut risque (par exemple insuffisance cardiaque NYHA II, BPCO GOLD 2, diabète avec atteinte d’organe, cancer traité, fragilité ou résidence en établissement de soins) ; de 18 à 64 ans en cas de très haut risque (par exemple BPCO GOLD 3, insuffisance rénale de stade 4, greffe, immunosuppression intensive).</p><p class="lab">Produits</p><p>Abrysvo®, Arexvy® et mRESVIA® sont autorisés dès 18 ans, sans préférence. Dans les essais, l’efficacité contre l’infection basse à VRS atteignait 67 à 86 % selon le vaccin et le critère, et 94 % contre la forme sévère avec Arexvy® ; elle diminue avec le temps, mais une dose protège au moins trois ans. La vaccination peut accompagner celles contre la grippe et la COVID-19.</p><div class="key"><b>Limites.</b> Aucune sérologie n’est recommandée avant ou après ; le vaccin n’est pas remboursé chez l’adulte non enceinte (automne 2026). Un syndrome de Guillain-Barré très rare a été signalé après Abrysvo® chez les plus de 60 ans, jusqu’à 4,6 cas par million de doses.</div><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, Recommandations VRS, mise à jour du 28.09.2026</a>.</p></template>
<template data-pop="j12-vaccin-covid" data-title="Vaccination contre la COVID-19 (Plan de vaccination 2026)"><p class="lab">Personnes visées</p><p>Personnes de 16 ans ou plus porteuses de certaines maladies (cardiovasculaires, pulmonaires dont BPCO GOLD II à IV et fibrose pulmonaire, cirrhose, insuffisance rénale avec débit de filtration inférieur à 60 mL/min, diabète compliqué, obésité avec IMC ≥ 35 kg/m², cancer traité, greffe, immunosuppression sévère) ; personnes atteintes de trisomie 21 ; femmes enceintes au deuxième ou au troisième trimestre ; enfants de 6 mois à 15 ans sévèrement immunodéprimés.</p><p class="lab">Schéma</p><p>Une dose annuelle, idéalement entre mi-octobre et décembre, au moins six mois après la dernière dose ou infection confirmée. L’enfant sévèrement immunodéprimé jamais vacciné reçoit trois doses ; celui qui l’a déjà été n’en reçoit pas d’autre.</p><div class="key"><b>Pourquoi.</b> L’immunité préexistante protège bien la population sans facteur de risque ; chez la personne à risque, elle est moins bonne et décline plus vite, ce que la dose annuelle compense pendant plusieurs mois.</div><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">OFSP et CFV, Plan de vaccination suisse 2026, chapitre 3.1.k</a>.</p></template>
<template data-pop="j12-vrs-nourrisson" data-title="Prévention du VRS chez le nourrisson"><p class="lab">Deux options équivalentes</p><p>Pour un terme prévu d’octobre à mars : vaccination maternelle par Abrysvo® entre 32 et 36 semaines de grossesse, idéalement au moins cinq semaines avant le terme, ou anticorps monoclonal à longue durée d’action au cours de la première semaine de vie. Pour une naissance d’avril à septembre : anticorps monoclonal en octobre ou dès que possible ensuite.</p><p class="lab">Exceptions</p><p>Le nouveau-né reçoit l’anticorps malgré la vaccination maternelle si la naissance survient moins de 14 jours après celle-ci, en cas de prématurité inférieure à 37 semaines, d’immunosuppression maternelle ou de risque de perte de l’immunité humorale. La vaccination maternelle n’est recommandée qu’une fois, non à chaque grossesse.</p><div class="key"><b>Produits.</b> Deux anticorps sont disponibles : le nirsévimab (Beyfortus®) et le clesrovimab (Enflonsia®).</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a> ; <a href="https://www.bag.admin.ch/fr/virus-respiratoire-syncytial-humain-vrs" target="_blank" rel="noopener">OFSP, VRS</a>.</p></template>
<template data-pop="j12-prophylaxies" data-title="Prophylaxies chez l’immunodéprimé"><p class="lab">Pneumocystose</p><p>Le triméthoprime-sulfaméthoxazole deux à trois fois par semaine est la molécule de choix en hématologie (ECIL-5), par exemple un comprimé forte trois fois par semaine selon l’information professionnelle. Indications principales : leucémie aiguë lymphoblastique, greffe allogénique, alemtuzumab, associations fludarabine-cyclophosphamide-rituximab, corticoïdes pendant plus de quatre semaines. Chez la personne vivant avec le VIH, la prophylaxie commence si les CD4 sont inférieurs à 200/µL et s’arrête lorsqu’ils dépassent 100/µL avec une charge virale indétectable depuis trois mois.</p><p class="lab">CMV et aspergillose</p><p>Le letermovir prévient le CMV chez le receveur séropositif d’une greffe allogénique (ECIL-10). Le posaconazole est fortement recommandé lors de l’induction d’une leucémie aiguë myéloïde ou d’un syndrome myélodysplasique (ESCMID).</p><div class="key"><b>Alternatives.</b> Pentamidine, atovaquone et dapsone sont des alternatives de deuxième ligne si le triméthoprime-sulfaméthoxazole est mal toléré ou contre-indiqué.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27550992/" target="_blank" rel="noopener">Maertens et al., ECIL-5, 2016</a> ; <a href="https://www.eacsociety.org/media/guidelines-12.0.pdf" target="_blank" rel="noopener">EACS 12.0, 2023</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680483060482" target="_blank" rel="noopener">Information professionnelle Bactrim forte</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/Recommendation_slides_ECIL_10_CMV_working_group_final_.pdf" target="_blank" rel="noopener">ECIL-10, CMV, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29544767/" target="_blank" rel="noopener">Ullmann et al., 2018</a>.</p></template>
