<h1>Pneumonies virales et pneumonies à micro-organismes particuliers</h1><span class="status">Adulte · SARS-CoV-2, virus respiratoire syncytial et autres virus respiratoires ; Chlamydia, Coxiella ; pneumonies du cytomégalovirus, de la varicelle, de la rougeole et de l’aspergillose · référentiels SSI 2026, OFSP 2026, ECIL 2017 à 2024, ESCMID-ECMM-ERS 2017, ESICM 2023 · état au 09.10.2026 · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>

<section class="ilot" id="j12-0"><h2><span class="n">0</span>Question clinique</h2><p>Une femme de 79 ans, atteinte d’une BPCO de stade GOLD 2, consulte en janvier. Une rhinorrhée et une toux sèche ont précédé de quatre jours une dyspnée sifflante. Sa température atteint 38,3 °C, sa fréquence respiratoire 26 par minute et sa SpO₂ 89 % à l’air ambiant. L’auscultation entend des râles et des sibilants aux deux bases.</p><p>Trois questions orientent la conduite. Existe-t-il une pneumonie, c’est-à-dire un infiltrat nouveau ? Quel agent la cause, et un traitement spécifique existe-t-il pour lui ? Le terrain expose-t-il à une évolution grave ou à un germe opportuniste ? <b>Chez l’adulte, un virus est retrouvé dans environ une pneumonie communautaire sur quatre ; le reconnaître évite un traitement inutile sans dispenser de chercher une bactérie associée.</b></p><div class="key"><b>Objectifs.</b> Reconnaître une pneumonie virale ou à germe particulier, en mesurer la gravité, identifier l’agent par l’examen adapté, prescrire l’antiviral ou l’immunomodulateur au bon moment et protéger les personnes à risque. Prérequis : <button class="w" data-justification="1" data-k="j12-virus-respi">les virus respiratoires communautaires (liste et circulation en Suisse)</button> ; <button class="w" data-justification="1" data-k="j12-immunosup">l’immunosuppression sévère (définition de la SSI)</button>.</div></section>
<section class="ilot" id="j12-1"><h2><span class="n">1</span>Définition et classification</h2><p>La SSI définit la pneumonie par l’association d’un <b>nouvel infiltrat pulmonaire</b>, visible à la radiographie, à l’échographie ou au scanner, et de symptômes d’infection respiratoire basse : fièvre, frissons, toux, expectorations, dyspnée, tachypnée ou douleur thoracique. Elle est dite communautaire si elle est acquise hors de l’hôpital ou débute dans les 48 heures suivant l’admission. Une pneumonie est virale lorsqu’un virus en est la cause ; elle est « particulière » lorsque son agent n’est pas une bactérie pyogène usuelle ou qu’elle complique une maladie infectieuse générale.</p><p>Le clinicien classe ces pneumonies selon deux axes, l’agent et le terrain, car ils commandent ensemble le test à demander et le traitement. Le tableau suivant regroupe les agents traités dans ce cours ; la grippe et les pneumonies bactériennes usuelles ont leurs propres cours.</p><table class="t"><tr><th>Famille</th><th>Agents principaux</th><th>Terrain typique</th></tr><tr><td>Virus respiratoires communautaires</td><td>SARS-CoV-2, VRS, hMPV, virus parainfluenza, adénovirus, rhinovirus, coronavirus saisonniers</td><td>Sujet âgé, comorbidité chronique, immunodéprimé</td></tr><tr><td>Bactéries intracellulaires</td><td><i>Chlamydia pneumoniae</i>, <i>Chlamydia psittaci</i>, <i>Coxiella burnetii</i></td><td>Adulte ; contact avec des oiseaux ou du bétail</td></tr><tr><td>Virus d’une maladie générale</td><td>CMV, VZV, virus de la rougeole</td><td>Greffé, varicelle de l’adulte, sujet non vacciné</td></tr><tr><td>Champignons et autres</td><td><i>Aspergillus</i>, <i>Nocardia</i></td><td>Neutropénie, greffe, pneumonie virale grave en réanimation</td></tr></table><p>La lecture commence par la colonne du terrain. Chez une patiente âgée en hiver, un virus communautaire est le premier suspect ; chez un greffé de moelle, le même tableau radiologique impose de penser au CMV et à l’aspergillose. Chez l’immunodéprimé, l’ECIL gradue la certitude d’une <button class="w" data-justification="1" data-k="j12-ecil-def">pneumonie attribuable à un virus respiratoire (possible, probable, confirmée, prouvée)</button>.</p><div class="key"><b>À retenir.</b> Une pneumonie se définit par un infiltrat nouveau et des signes d’infection basse ; son agent se déduit du terrain, de la saison et de l’exposition, puis se prouve par un test ciblé.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie acquise en communauté, version validée le 09.09.2026</a> ; <a href="https://www.ecil-leukaemia.com/images/ecil-10/CARVs_Update_2024_ECIL-10_final_4.pdf" target="_blank" rel="noopener">ECIL-10, virus respiratoires communautaires, septembre 2024</a>.</p></section>
<section class="ilot" id="j12-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>La PCR a révélé la place des virus. Une méta-analyse de 31 études d’adultes atteints de pneumonie communautaire retrouve une infection virale chez 24,5 % des patients ; la proportion monte à 44,2 % lorsque plus de la moitié des prélèvements proviennent des voies basses. Le frottis nasopharyngé sous-estime donc la part virale. La même analyse montre une mortalité plus élevée en cas d’infection mixte virale et bactérienne (rapport de cotes 2,1).</p><p>En Suisse, le réseau <button class="w" data-justification="1" data-k="j12-sentinella">Sentinella (méthode et taux de positivité)</button> a détecté en 2023/2024 un virus dans 62,9 % des frottis des consultations pour infection respiratoire aiguë. Le SARS-CoV-2 venait en tête (21,6 %), devant le rhinovirus (16,9 %) et l’influenza (14,0 %) ; hMPV, VRS, virus parainfluenza et adénovirus se situaient chacun entre 2 et 3 %. Ces chiffres décrivent des infections ambulatoires, non des pneumonies.</p><p>Le poids hospitalier se concentre chez le sujet âgé. L’OFSP estime à 200 à 400 pour 100 000 le taux annuel d’hospitalisation liée au VRS après 75 ans, soit environ 2800 séjours d’une dizaine de jours ; la létalité hospitalière atteint 2,4 % entre 65 et 74 ans et 3,9 % au-delà (<button class="w" data-justification="1" data-k="j12-fardeau-vrs">fardeau du VRS en Suisse</button>). Les germes particuliers sont plus rares : <i>C. psittaci</i> cause environ 1 % des pneumonies communautaires, et 40 à 100 cas de fièvre Q sont déclarés chaque année en Suisse.</p><div class="key"><b>À retenir.</b> Un virus est en cause dans une pneumonie communautaire de l’adulte sur quatre au moins ; le pronostic dépend surtout de l’âge, des comorbidités et d’une co-infection bactérienne.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27246595/" target="_blank" rel="noopener">Burk et al., Eur Respir Rev 2016</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/-HOKU4yikoc-/jahresbericht-respiratorischen-viren-2023_2024.pdf" target="_blank" rel="noopener">OFSP, Rapport annuel sur les virus respiratoires 2023/2024, Bulletin 40/2024</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, Recommandations VRS, mise à jour du 28.09.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28946931/" target="_blank" rel="noopener">Hogerwerf et al., Epidemiol Infect 2017</a> ; <a href="https://www.bag.admin.ch/fr/fievre-q" target="_blank" rel="noopener">OFSP, Fièvre Q</a>.</p></section>
<section class="ilot" id="j12-3"><h2><span class="n">3</span>Du virus à l’insuffisance respiratoire</h2><p>Le virus pénètre d’abord l’épithélium respiratoire par un récepteur précis. Le SARS-CoV-2, par exemple, se fixe à l’enzyme de conversion de l’angiotensine 2 et utilise une protéase de surface pour activer sa protéine de spicule : c’est l’<button class="w" data-justification="1" data-k="j12-ace2">entrée cellulaire ACE2 et TMPRSS2</button>. La réplication détruit des cellules épithéliales et déclenche une réponse inflammatoire.</p><p>Au microscope, la pneumonie virale associe habituellement une pneumonie interstitielle et un infiltrat lymphocytaire. Dans les formes graves, le <button class="w" data-justification="1" data-k="j12-dad">dommage alvéolaire diffus (membranes hyalines, œdème)</button> remplit les alvéoles ; dans la COVID-19, il s’y ajoute une atteinte endothéliale et des microthromboses capillaires. La perte de la vasoconstriction hypoxique, puis le passage du sang dans des alvéoles non aérées, expliquent l’hypoxémie, qui précède parfois la dyspnée : c’est l’<button class="w" data-justification="1" data-k="j12-hypox-silencieuse">hypoxémie peu symptomatique de la COVID-19</button>.</p><p>La chronologie a une portée thérapeutique. Dans la COVID-19, une phase de réplication virale (jours 2 à 6) précède, chez une minorité, une phase de réponse immunitaire déréglée (jours 6 à 10) : l’<button class="w" data-justification="1" data-k="j12-biphasique">évolution en deux phases</button> explique qu’un antiviral soit utile tôt et un immunomodulateur tard. L’infection virale prépare enfin la <button class="w" data-justification="1" data-k="j12-coinf">surinfection bactérienne</button> et, en lésant l’épithélium des voies aériennes, l’<button class="w" data-justification="1" data-k="j12-aspergillose">invasion aspergillaire</button>.</p><figure><svg viewBox="0 0 680 190" role="img" aria-label="Évolution en deux phases d’une pneumonie virale grave et place des traitements" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><path d="M40 150h600"/><path d="M60 140C140 40 200 40 260 120" /><path d="M260 120C330 150 380 60 460 50C520 45 580 90 620 130" stroke-dasharray="6 4"/></g><g fill="#222"><text x="40" y="172">jour 0</text><text x="230" y="172">jours 6 à 10</text><text x="580" y="172">temps</text><text x="70" y="40">charge virale</text><text x="430" y="38">inflammation</text><text x="60" y="110">antiviral précoce</text><text x="440" y="110">immunomodulateur</text></g></svg><figcaption>Figure 1 — La charge virale culmine les premiers jours (trait plein) ; l’inflammation domine ensuite chez une minorité (tirets). Schéma pédagogique fondé sur la description de la SSI pour la COVID-19, non à l’échelle.</figcaption></figure><div class="key"><b>À retenir.</b> La lésion épithéliale virale, puis l’inflammation, conduisent à l’hypoxémie ; la phase de la maladie décide de la classe thérapeutique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32142651/" target="_blank" rel="noopener">Hoffmann et al., Cell 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., Lancet 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32437596/" target="_blank" rel="noopener">Ackermann et al., N Engl J Med 2020</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, SARS-CoV-2/COVID-19, version validée le 05.02.2026</a>.</p></section>
<section class="ilot" id="j12-4"><h2><span class="n">4</span>Agents et terrains</h2><p>Chaque agent a son terrain et son indice d’orientation. Le tableau relie ces trois éléments à la conséquence pratique ; les fenêtres détaillent chaque agent.</p><table class="t"><tr><th>Agent</th><th>Terrain ou exposition</th><th>Indice</th></tr><tr><td><button class="w" data-justification="1" data-k="j12-risque-covid">SARS-CoV-2</button></td><td>Âge avancé, immunosuppression, comorbidités</td><td>Circulation toute l’année, recrudescence hivernale</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-fardeau-vrs">VRS</button></td><td>Âge ≥ 75 ans, cardiopathie, pneumopathie chronique</td><td>Hiver ; sibilants plus fréquents qu’avec la grippe</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-hmpv">hMPV et virus parainfluenza</button></td><td>Sujet âgé, établissement de soins, greffé</td><td>Foyers en institution</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-adenovirus">Adénovirus</button></td><td>Recrues militaires, greffé lymphopénique</td><td>Pneumonie nécrosante possible</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-cmv">CMV</button></td><td>Greffe de cellules souches ou d’organe</td><td>Réactivation, virémie quantifiée</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-varicelle">VZV</button></td><td>Varicelle de l’adulte, immunodéprimé</td><td>Éruption vésiculeuse</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-rougeole">Virus de la rougeole</button></td><td>Sujet non immunisé</td><td>Fièvre persistant plus de deux jours après l’éruption</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-chlamydia">Chlamydia pneumoniae et C. psittaci</button></td><td>Adulte ; oiseaux pour <i>C. psittaci</i></td><td>Pneumonie dite atypique</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-fievreq">Coxiella burnetii</button></td><td>Ovins, caprins, bovins, mise bas</td><td>Fièvre brutale, céphalées</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-aspergillose">Aspergillus</button></td><td>Leucémie aiguë myéloïde en induction, greffe, grippe ou COVID-19 en réanimation</td><td>Aggravation secondaire</td></tr><tr><td><button class="w" data-justification="1" data-k="j12-nocardiose">Nocardia</button></td><td>Pneumonie en échec du traitement initial</td><td>Recherche au lavage ou à la biopsie</td></tr></table><p>La colonne de l’exposition guide l’interrogatoire. Un éleveur de chèvres fébrile après les mises bas oriente vers la fièvre Q ; un propriétaire de perruches, vers la psittacose. Le facteur de risque le plus puissant reste l’<button class="w" data-justification="1" data-k="j12-immunosup">immunosuppression sévère</button>, qui fait sortir le patient des recommandations communautaires et impose une enquête microbiologique invasive.</p><div class="key"><b>À retenir.</b> Le terrain et l’exposition désignent l’agent probable ; l’immunosuppression sévère change de cadre diagnostique et thérapeutique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21435708/" target="_blank" rel="noopener">Ruuskanen et al., 2011</a> ; <a href="https://www.bag.admin.ch/fr/fievre-q" target="_blank" rel="noopener">OFSP, Fièvre Q</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30882289/" target="_blank" rel="noopener">Rybarczyk et al., psittacose, Acta Clin Belg 2020</a>.</p></section>
<section class="ilot" id="j12-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>L’interrogatoire date d’abord le début des symptômes, car l’efficacité des antiviraux de la COVID-19 se joue dans les cinq premiers jours. Il recherche ensuite les contacts malades, la saison et l’épidémie en cours, les expositions animales, une varicelle ou une rougeole dans l’entourage. Il inventorie enfin les <button class="w" data-justification="1" data-k="j12-immunosup">traitements immunosuppresseurs</button> et le statut vaccinal contre la COVID-19, la grippe, le pneumocoque et le VRS.</p><p>Chez l’adulte âgé infecté par le VRS, une rhinite précède souvent de deux à quatre jours l’atteinte basse. Une toux sèche existe chez environ 90 % des malades et une fièvre supérieure à 38 °C chez près de la moitié ; une odynophagie touche environ un quart d’entre eux. La dyspnée et l’aggravation d’une maladie chronique marquent l’extension aux voies basses.</p><div class="two"><div class="card"><b>Forme typique.</b> Prodromes rhinopharyngés, toux sèche, fièvre modérée, puis dyspnée progressive en quelques jours, en période épidémique.</div><div class="card"><b>Formes trompeuses.</b> La présentation est souvent atypique chez le sujet âgé. La fièvre manque plus volontiers à un âge avancé ou en cas d’immunodéficience sévère, et l’aggravation d’une maladie chronique peut dominer le tableau.</div></div><div class="trap"><span class="k">Piège</span> Une aggravation après une stabilisation initiale définit un échec secondaire. Elle impose de rechercher une complication, une surinfection ou un germe rare, et non d’attendre la fin d’une « évolution virale ».</div><div class="key"><b>À retenir.</b> L’interrogatoire fixe le jour de début, l’exposition et le terrain : ces trois données décident du test et du traitement.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, Recommandations VRS 2026, chapitre 4</a> ; <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, Infection respiratoire aiguë, version validée le 01.09.2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3352/de" target="_blank" rel="noopener">SSI, COVID-19, 2026</a>.</p></section>
<section class="ilot" id="j12-6"><h2><span class="n">6</span>Examiner pour mesurer la gravité</h2><p>L’examen commence par l’état général et les signes vitaux, car ils décident du lieu de soins. La SSI retient comme <button class="w" data-justification="1" data-k="j12-signes-gravite">signes d’alerte</button> une mauvaise impression clinique, une pression systolique inférieure à 90 mmHg, une fréquence respiratoire d’au moins 30 par minute, une SpO₂ inférieure à 92 %, des hémoptysies, un stridor, une pneumopathie sévère ou une immunodépression sévère. Le score <button class="w" data-justification="1" data-k="j12-crb65">CRB-65</button> complète cette évaluation.</p><p>L’auscultation entend des râles chez environ un tiers des adultes infectés par le VRS ; les sibilants y sont plus fréquents qu’avec la grippe, même sans maladie obstructive connue. La peau oriente parfois l’étiologie : <button class="w" data-justification="1" data-k="j12-varicelle">éruption vésiculeuse de la varicelle</button>, <button class="w" data-justification="1" data-k="j12-rougeole">exanthème de la rougeole</button>. Une SpO₂ basse chez un patient peu dyspnéique ne rassure pas : l’<button class="w" data-justification="1" data-k="j12-hypox-silencieuse">hypoxémie peut précéder la dyspnée</button>.</p><div class="trap"><span class="k">Erreur fréquente</span> Le médecin se fie à l’absence de détresse apparente et omet l’oxymétrie. Toute suspicion de pneumonie impose la mesure de la SpO₂ au repos.</div><div class="key"><b>À retenir.</b> Signes vitaux, SpO₂ et CRB-65 décident du lieu de soins ; la peau et l’auscultation orientent vers l’agent.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">SSI, Infection respiratoire aiguë, 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, Pneumonie, 2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, VRS 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32291463/" target="_blank" rel="noopener">Gattinoni et al., Intensive Care Med 2020</a>.</p><button class="pareto-btn ui" data-k="pareto-j12-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
