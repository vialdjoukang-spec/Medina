<section class="ilot" id="i27-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 38 ans s’essouffle depuis un an en montant les escaliers. Ses examens pulmonaires et sa radiographie sont jugés normaux ; l’essoufflement est mis sur le compte du déconditionnement. Un jour, elle perd connaissance en courant après un bus. <b>La dyspnée d’effort inexpliquée est le premier signe de l’hypertension pulmonaire, et la syncope d’effort en est un signe tardif.</b> Le délai entre les premiers symptômes et le diagnostic dépasse encore souvent deux ans.</p><p>Le médecin doit savoir évoquer la maladie, estimer sa probabilité par l’échocardiographie, reconnaître la cause la plus fréquente — cardiaque gauche ou respiratoire — et ne jamais manquer une forme thromboembolique chronique, curable. Il doit enfin comprendre pourquoi le pronostic dépend du ventricule droit, et pourquoi les traitements spécifiques ne s’adressent qu’à certains groupes.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="i27-circulation">La circulation pulmonaire normale (basse pression, haute compliance)</button> ; <button class="w" data-k="i27-retard">le retard diagnostique (pourquoi la maladie se cache)</button>.</div></section>
<section class="ilot" id="i27-1"><h2><span class="n">1</span>Une définition hémodynamique</h2><p>L’hypertension pulmonaire (HTP) est une élévation de la pression artérielle pulmonaire moyenne (PAPm) au-delà de 20 mmHg au repos, mesurée par cathétérisme cardiaque droit. La valeur normale est de 14 ± 3 mmHg ; le seuil de 20 mmHg correspond à la limite supérieure de la normale. <button class="w" data-k="i27-seuil20">Le seuil est passé de 25 à 20 mmHg (sources et arbitrage)</button>. La pression seule ne dit pas où siège l’obstacle : deux mesures complémentaires le localisent.</p><p>La <button class="w" data-k="i27-papo">pression artérielle pulmonaire d’occlusion, ou PAPO (reflet de la pression de l’oreillette gauche)</button> renseigne sur l’aval. Les <button class="w" data-k="i27-rvp">résistances vasculaires pulmonaires, ou RVP (calcul et exemple chiffré)</button> renseignent sur le lit artériel lui-même. Leur combinaison distingue trois profils hémodynamiques.</p><table class="t"><tr><th>Profil</th><th>PAPm</th><th>PAPO</th><th>RVP</th><th>Signification</th></tr><tr><td>Précapillaire</td><td>&gt; 20 mmHg</td><td>≤ 15 mmHg</td><td>&gt; 2 unités Wood</td><td>Obstacle dans les artères pulmonaires</td></tr><tr><td>Postcapillaire isolée</td><td>&gt; 20 mmHg</td><td>&gt; 15 mmHg</td><td>≤ 2 unités Wood</td><td>Pression transmise passivement depuis le cœur gauche</td></tr><tr><td>Post- et précapillaire combinée</td><td>&gt; 20 mmHg</td><td>&gt; 15 mmHg</td><td>&gt; 2 unités Wood</td><td>Cœur gauche en cause, avec remodelage artériel surajouté</td></tr></table><p>Le profil précapillaire caractérise les groupes 1, 3, 4 et souvent 5 ; le profil postcapillaire, le groupe 2. L’erreur fréquente consiste à appeler « hypertension artérielle pulmonaire » toute pression pulmonaire élevée : l’HTAP désigne seulement le groupe 1, profil précapillaire sans autre cause. L’<button class="w" data-k="i27-effort">HTP d’effort (pente pression-débit)</button> décrit une PAPm normale au repos qui s’élève anormalement à l’effort.</p><p>Dans la CIM-10-GM 2024, I27 regroupe l’HTAP idiopathique et héréditaire (I27.00), les formes associées (I27.01) et médicamenteuses (I27.02), la cardiopathie de cyphoscoliose (I27.1), la forme thromboembolique chronique (I27.20), les HTP des cardiopathies gauches (I27.21) et des maladies respiratoires (I27.22) et le cœur pulmonaire chronique (I27.9). I28 regroupe les fistules, anévrismes et sténoses des vaisseaux pulmonaires (îlot 13). Le cœur pulmonaire aigu de l’embolie relève du cours <a href="#/entry/I26">I26 — Embolie pulmonaire</a>.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">Humbert et al., recommandations ESC/ERS 2022, Eur Heart J 2022;43:3618-3731</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., définition et classification, 7e Symposium mondial, Eur Respir J 2024;64:2401324</a>.</p></section>
<section class="ilot" id="i27-2"><h2><span class="n">2</span>Cinq groupes, des fréquences inégales</h2><p>La classification clinique regroupe les maladies qui partagent un mécanisme, une démarche et une réponse au traitement. Le 7e Symposium mondial (2024) en a conservé les cinq groupes. Le tableau sert d’abord à une question pratique : à quel groupe appartient ce patient, et un traitement vasodilatateur spécifique y a-t-il fait ses preuves ?</p><table class="t"><tr><th>Groupe</th><th>Principales causes</th><th>Traitement spécifique validé</th></tr><tr><td>1 — HTAP</td><td>Idiopathique, héritable, médicaments et toxiques, connectivites, infection par le VIH, hypertension portale, cardiopathies congénitales, schistosomiase ; forme avec atteinte veineuse ou capillaire</td><td>Oui</td></tr><tr><td>2 — Cardiopathie gauche</td><td>Insuffisance cardiaque à fraction d’éjection préservée ou réduite, valvulopathies mitrales et aortiques</td><td>Non : traiter le cœur gauche</td></tr><tr><td>3 — Maladie respiratoire ou hypoxie</td><td>BPCO, pneumopathies interstitielles, hypoventilation (dont cyphoscoliose), altitude</td><td>Exceptionnel : tréprostinil inhalé dans certaines pneumopathies interstitielles</td></tr><tr><td>4 — Obstruction artérielle pulmonaire</td><td>HTP thromboembolique chronique (HTP-TEC) ; sarcome de l’artère pulmonaire, artérites, hydatidose</td><td>Oui : chirurgie, angioplastie, riociguat</td></tr><tr><td>5 — Mécanismes multiples ou incertains</td><td>Anémies hémolytiques, syndromes myéloprolifératifs, sarcoïdose, insuffisance rénale chronique, médiastinite fibrosante</td><td>Selon la cause</td></tr></table><p>L’HTP touche environ 1 % de la population mondiale, davantage après 65 ans. Le groupe 2 est le plus fréquent, le groupe 3 le deuxième. L’HTAP est rare : 6 nouveaux cas et 48 à 55 cas prévalents par million d’adultes. <button class="w" data-k="i27-epid">Épidémiologie européenne et suisse (registre, HTP-TEC après embolie)</button>. Un patient de 75 ans dyspnéique, hypertendu et diabétique avec une HTP a donc bien plus probablement une cardiopathie gauche qu’une HTAP.</p><div class="key"><b>À retenir.</b> Le groupe se déduit du profil hémodynamique et du contexte. Il commande le traitement : les vasodilatateurs pulmonaires ne sont validés que dans les groupes 1 et 4.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., Eur Respir J 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, sections 3 et 4</a>.</p></section>
<section class="ilot" id="i27-3"><h2><span class="n">3</span>De la résistance vasculaire au ventricule droit</h2><p>La circulation pulmonaire reçoit tout le débit cardiaque, environ 5 L/min, sous une pression six fois plus basse que la circulation systémique. Elle y parvient grâce à des artères minces et compliantes et à un réservoir de capillaires recrutables à l’effort. Dans l’HTAP, la paroi des petites artères s’épaissit et leur lumière se rétrécit : c’est le <button class="w" data-k="i27-remodelage">remodelage vasculaire (couches atteintes et lésions plexiformes)</button>.</p><p>Ce remodelage résulte d’un déséquilibre entre médiateurs. L’endothéline 1 vasoconstricte et fait proliférer ; le monoxyde d’azote et la prostacycline, déficitaires, ne relâchent ni ne freinent plus suffisamment le muscle lisse. <button class="w" data-k="i27-trois-voies">Trois voies historiques et une quatrième, l’activine (cibles thérapeutiques)</button>. Une mutation du gène BMPR2 rompt le frein antiprolifératif et prédispose à la maladie.</p><p>Le ventricule droit est conçu pour éjecter un volume, pas pour vaincre une pression. Face à une postcharge accrue, il s’hypertrophie d’abord et maintient son débit. <button class="w" data-k="i27-couplage">Il se dilate ensuite lorsque la contractilité ne suit plus (couplage ventriculo-artériel)</button>. La dilatation déforme l’anneau tricuspide, refoule le septum vers la gauche et gêne le remplissage du ventricule gauche : c’est l’<button class="w" data-k="i27-interdependance">interdépendance ventriculaire (pourquoi le débit gauche chute)</button>. Le débit cardiaque baisse, d’abord à l’effort, puis au repos.</p><div class="key"><b>Conséquence clinique.</b> Les symptômes traduisent un débit qui ne s’élève plus à l’effort. Le pronostic dépend de la fonction ventriculaire droite plus que du chiffre de pression : une pression qui baisse avec un débit effondré est un signe d’aggravation, non d’amélioration.</div></section>
<section class="ilot" id="i27-4"><h2><span class="n">4</span>Causes, terrains et dépistage</h2><p>Dans le groupe 3, l’hypoxie alvéolaire contracte les artérioles pour détourner le sang des zones mal ventilées. <button class="w" data-k="i27-hpv">Généralisée et chronique, cette vasoconstriction hypoxique élève la pression (mécanisme)</button>. Dans le groupe 2, la pression de l’oreillette gauche remonte passivement dans les veines puis les artères pulmonaires. Dans le groupe 4, des caillots organisés en tissu fibreux obstruent les artères et s’accompagnent d’une microvasculopathie distale.</p><p>Certains médicaments et toxiques ont une <button class="w" data-k="i27-toxiques">association certaine avec l’HTAP (liste 2024)</button> : anorexigènes dérivés de la fenfluramine, méthamphétamines, dasatinib, et depuis 2024 mitomycine C et carfilzomib. Une forme héritable se transmet sur le mode autosomique dominant avec une pénétrance incomplète.</p><p>Trois populations justifient un <button class="w" data-k="i27-depistage">dépistage organisé (sclérodermie, porteurs de mutation, hypertension portale)</button>. Les survivants d’une embolie pulmonaire encore dyspnéiques après trois mois d’anticoagulation doivent être explorés à la recherche d’une HTP-TEC.</p><div class="key"><b>À retenir.</b> Un même chiffre de pression peut traduire quatre mécanismes : vasoconstriction et remodelage, transmission passive, hypoxie ou obstruction mécanique. Chaque mécanisme a sa cause et son traitement.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., Eur Respir J 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29563171/" target="_blank" rel="noopener">Coquoz et al., dépistage suisse de l’HTP-TEC, Eur Respir J 2018</a>.</p></section>
<section class="ilot" id="i27-5"><h2><span class="n">5</span>Interroger</h2><p>Les symptômes sont non spécifiques et viennent de l’incapacité du cœur droit à augmenter son débit. Ils sont présentés par ordre de fréquence décroissante.</p><table class="t"><tr><th>Symptôme</th><th>Mécanisme et portée</th></tr><tr><td><button class="w" data-k="i27-dyspnee">Dyspnée d’effort progressive (caractérisation)</button></td><td>Premier symptôme, présent chez presque tous les patients ; débit fixe, espace mort accru</td></tr><tr><td>Fatigue, intolérance à l’effort</td><td>Transport d’oxygène insuffisant vers les muscles</td></tr><tr><td><button class="w" data-k="i27-angor">Douleur thoracique d’effort (ischémie du ventricule droit)</button></td><td>Ventricule hypertrophié mal perfusé ; parfois compression du tronc coronaire gauche</td></tr><tr><td><button class="w" data-k="i27-syncope">Syncope ou présyncope d’effort (débit fixe)</button></td><td>Signe de gravité : le débit ne compense plus la vasodilatation musculaire</td></tr><tr><td>Œdèmes, prise de poids, ballonnement</td><td>Congestion veineuse systémique : défaillance droite installée</td></tr><tr><td><button class="w" data-k="i27-compressions">Hémoptysie, dysphonie, toux (compressions et ruptures)</button></td><td>Artère pulmonaire dilatée, artères bronchiques hypertrophiées</td></tr></table><p>L’anamnèse recherche ensuite la cause : embolie ou thrombose antérieure, phénomène de Raynaud, reflux et sclérodactylie, hépatopathie, infection par le VIH, cardiopathie congénitale opérée ou non, prise d’anorexigènes ou de méthamphétamines, chimiothérapies, ronflements et apnées, séjour en zone d’endémie bilharzienne, apparentés atteints ou morts jeunes d’une cause cardiaque.</p><div class="key"><b>À retenir.</b> Une dyspnée d’effort que l’examen pulmonaire et la radiographie n’expliquent pas impose de penser au cœur droit. La syncope d’effort impose une évaluation rapide.</div></section>
<section class="ilot" id="i27-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen est souvent normal au début. Il apprécie d’abord la tolérance : fréquence cardiaque, pression artérielle, fréquence respiratoire, SpO₂ au repos puis à l’effort, poids et périmètre abdominal. Les signes de l’HTP elle-même apparaissent avant ceux de la défaillance droite.</p><div class="two"><div class="card"><b>Pression pulmonaire élevée</b><p><button class="w" data-k="i27-b2">Éclat de la composante pulmonaire du deuxième bruit (technique et valeur)</button>. Impulsion parasternale gauche du ventricule droit. <button class="w" data-k="i27-it">Souffle d’insuffisance tricuspide qui augmente à l’inspiration (manœuvre de Carvallo)</button>. Souffle diastolique d’insuffisance pulmonaire.</p></div><div class="card"><b>Défaillance ventriculaire droite</b><p><button class="w" data-k="i27-jugulaire">Turgescence jugulaire et reflux hépatojugulaire (pression de l’oreillette droite)</button>. Hépatomégalie douloureuse, ascite, œdèmes déclives. Troisième bruit droit. Extrémités froides et hypotension dans les formes graves.</p></div></div><p>L’examen cherche aussi la cause : crépitants d’une pneumopathie interstitielle, distension d’une BPCO, signes cutanés de sclérodermie, angiomes stellaires d’une hépatopathie, cyanose et hippocratisme d’un shunt congénital, souffle d’une valvulopathie gauche, cyphoscoliose, obésité. <button class="w" data-k="i27-signes-cause">Signes orientant vers un groupe (tableau commenté)</button>.</p><div class="key"><b>À retenir.</b> Un examen normal n’exclut pas l’HTP ; une turgescence jugulaire avec œdèmes signe une maladie déjà avancée.</div><button class="pareto-btn ui" data-k="pareto-i27-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button></section>
