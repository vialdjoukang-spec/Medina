<template data-pop="i27-circulation" data-title="La circulation pulmonaire normale"><p class="lab">Fonction</p><p>Le poumon reçoit tout le débit du ventricule droit, environ 5 L/min au repos et jusqu’à 20 L/min à l’effort intense. Sa PAPm reste voisine de 14 mmHg, contre 90 mmHg environ pour la pression artérielle moyenne systémique.</p><p class="lab">Mécanisme</p><p>Les artères pulmonaires ont une paroi mince et très compliante. À l’effort, des capillaires fermés s’ouvrent et les vaisseaux ouverts se distendent : la résistance baisse quand le débit monte, et la pression varie peu.</p><div class="key"><b>Conséquence.</b> Une perte de ce réservoir vasculaire se révèle d’abord à l’effort, ce qui explique une dyspnée d’effort longtemps isolée.</div></template>
<template data-pop="i27-retard" data-title="Pourquoi le diagnostic est tardif"><p>La dyspnée d’effort, la fatigue et la tachycardie sont attribuées à l’asthme, à l’anxiété, au surpoids ou au déconditionnement. L’examen et la radiographie restent longtemps normaux, car le cœur droit compense. Selon l’ESC/ERS 2022, plus de deux ans séparent souvent les premiers symptômes du diagnostic d’HTAP.</p><div class="key"><b>Conséquence pratique.</b> Une dyspnée d’effort inexpliquée après un premier bilan justifie une échocardiographie, surtout s’il existe une sclérodermie, une embolie antérieure, une hépatopathie ou un antécédent familial.</div></template>
<template data-pop="i27-seuil20" data-title="Seuil de 20 ou de 25 mmHg : arbitrage des sources"><p class="lab">Source retenue</p><p>ESC/ERS 2022 (août 2022), confirmée par le 7e Symposium mondial (publié en octobre 2024) : HTP si PAPm &gt; 20 mmHg, avec RVP &gt; 2 unités Wood pour le profil précapillaire. Ces textes s’appliquent à l’adulte européen et sont suivis en Suisse.</p><p class="lab">Texte antérieur</p><p>De 1973 à 2018, le seuil était de 25 mmHg, choisi de façon arbitraire. Le 6e Symposium mondial (2018) a proposé 20 mmHg avec RVP ≥ 3 unités Wood ; l’ESC/ERS 2022 a abaissé ce dernier seuil à 2.</p><p class="lab">Justification</p><p>Chez le sujet sain, la PAPm vaut 14 ± 3 mmHg : 20 mmHg correspond à deux écarts types. Des études de cohorte associent déjà une PAPm de 21 à 24 mmHg à un pronostic moins favorable.</p><div class="key"><b>Limite.</b> L’efficacité des médicaments de l’HTAP n’a été démontrée que chez des patients ayant une PAPm ≥ 25 mmHg et des RVP ≥ 3 unités Wood. Un patient entre ces seuils est malade selon la définition, mais son traitement spécifique n’est pas validé : il relève du centre.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, sections 3.1 et 6.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39209475/" target="_blank" rel="noopener">Kovacs et al., 2024</a>.</p></template>
<template data-pop="i27-papo" data-title="Pression artérielle pulmonaire d’occlusion"><p class="lab">Technique</p><p>Le ballonnet du cathéter gonflé dans une branche artérielle interrompt le flux. La colonne de sang immobile transmet alors la pression des veines pulmonaires et de l’oreillette gauche. On la lit en fin d’expiration, le zéro placé au niveau de l’oreillette droite (mi-thorax).</p><p class="lab">Valeur</p><p>Une PAPO &gt; 15 mmHg signe une composante postcapillaire : la pression vient du cœur gauche.</p><div class="key"><b>Piège.</b> Un patient sous diurétiques à forte dose peut avoir une PAPO faussement normale ; une épreuve de remplissage ou d’effort démasque parfois une insuffisance cardiaque à fraction d’éjection préservée.</div></template>
<template data-pop="i27-rvp" data-title="Résistances vasculaires pulmonaires"><p class="lab">Calcul</p><p>RVP = (PAPm − PAPO) / débit cardiaque, en unités Wood (mmHg·min/L). Une unité Wood vaut 80 dyn·s·cm⁻⁵.</p><p class="lab">Exemple</p><p>PAPm 45 mmHg, PAPO 10 mmHg, débit 3,5 L/min : RVP = 35 / 3,5 = 10 unités Wood. Le sujet normal a environ 1 unité Wood.</p><div class="key"><b>Intérêt.</b> La résistance isole l’atteinte du lit artériel. Une pression élevée avec un débit élevé, comme dans l’anémie ou un shunt, ne traduit pas forcément une maladie artérielle.</div></template>
<template data-pop="i27-effort" data-title="Hypertension pulmonaire d’effort"><p>Elle se définit par une pente PAPm/débit cardiaque supérieure à 3 mmHg/L/min entre repos et effort, mesurée par cathétérisme d’effort. Elle traduit une perte du recrutement vasculaire ou une cardiopathie gauche démasquée par l’effort.</p><div class="key"><b>Limite.</b> Cette entité n’est pas une HTAP ; aucun médicament spécifique n’y est validé. Elle justifie une surveillance, notamment dans la sclérodermie.</div></template>
<template data-pop="i27-epid" data-title="Épidémiologie européenne et suisse"><p>Selon l’ESC/ERS 2022, l’HTP concerne environ 1 % de la population mondiale. Les cardiopathies gauches en sont la première cause, les maladies respiratoires, surtout la BPCO, la deuxième. L’HTAP compte 6 nouveaux cas et 48 à 55 cas prévalents par million d’adultes ; la forme idiopathique en représente 50 à 60 %. Elle touche de plus en plus des sujets de plus de 65 ans.</p><p>En Suisse, le registre national de l’HTP a inclus 996 patients entre 1998 et 2012, dont 549 HTAP et 249 HTP-TEC. Après une embolie pulmonaire, un dépistage prospectif dans 11 centres suisses a trouvé une incidence cumulée d’HTP-TEC de 0,79 % à deux ans.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 4</a> ; <a href="https://forschung.kssg.ch/de/publications/5580-long-term-data-from-the-swiss-pulmonary-hypertension-registry" target="_blank" rel="noopener">Mueller-Mottet et al., registre suisse, Respiration 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29563171/" target="_blank" rel="noopener">Coquoz et al., 2018</a>.</p></template>
<template data-pop="i27-remodelage" data-title="Le remodelage vasculaire"><p>Les cellules musculaires lisses prolifèrent et résistent à l’apoptose ; la média s’épaissit et s’étend aux artérioles. Des cellules endothéliales et des myofibroblastes comblent l’intima. L’adventice se fibrose et s’enflamme. Les lésions plexiformes, faites de canaux endothéliaux désorganisés, marquent les formes avancées.</p><div class="key"><b>Conséquence.</b> La résistance varie comme l’inverse de la puissance quatrième du rayon : réduire la lumière de moitié multiplie la résistance par seize. D’où l’intérêt de traitements antiprolifératifs.</div></template>
<template data-pop="i27-trois-voies" data-title="Les quatre voies thérapeutiques"><table class="t"><tr><th>Voie</th><th>Anomalie</th><th>Médicaments</th></tr><tr><td>Endothéline</td><td>Excès</td><td>Antagonistes des récepteurs</td></tr><tr><td>Monoxyde d’azote</td><td>Déficit</td><td>Inhibiteurs de la phosphodiestérase 5, riociguat</td></tr><tr><td>Prostacycline</td><td>Déficit</td><td>Prostanoïdes, sélexipag</td></tr><tr><td>Activine et BMP</td><td>Déséquilibre prolifératif</td><td>Sotatercept</td></tr></table><p>Chaque ligne explique une classe médicamenteuse : on corrige un excès par un antagoniste et un déficit par un agoniste ou un inhibiteur de la dégradation. Détail moléculaire dans l’onglet Sciences.</p></template>
<template data-pop="i27-couplage" data-title="Couplage ventriculo-artériel"><p>Le ventricule droit s’adapte d’abord en augmentant sa contractilité : son volume reste normal. Quand cette réserve s’épuise, il se dilate et utilise la loi de Frank-Starling. La dilatation élargit l’anneau tricuspide et crée une fuite, qui réduit encore le volume éjecté.</p><div class="key"><b>Mesure.</b> Le rapport TAPSE/PAPS estime ce couplage : &lt; 0,19 mm/mmHg traduit un risque élevé selon l’ESC/ERS 2022.</div></template>
<template data-pop="i27-interdependance" data-title="Interdépendance ventriculaire"><p>Les deux ventricules partagent le septum et le péricarde. Un ventricule droit dilaté et sous pression refoule le septum vers la gauche : en échocardiographie, le ventricule gauche prend une forme de « D ». Son remplissage diminue, donc son volume d’éjection baisse.</p><div class="key"><b>Conséquence.</b> Le débit systémique chute alors que le ventricule gauche est sain. Un remplissage vasculaire aggrave ce refoulement : c’est pourquoi il est prudent dans la défaillance droite.</div></template>
<template data-pop="i27-hpv" data-title="Vasoconstriction pulmonaire hypoxique"><p class="lab">Mécanisme</p><p>L’hypoxie alvéolaire ferme des canaux potassiques des cellules musculaires lisses artériolaires. La cellule se dépolarise, le calcium entre, l’artériole se contracte. Le sang est détourné vers les alvéoles bien ventilées.</p><p class="lab">Conséquence</p><p>Locale, cette réponse optimise l’oxygénation. Généralisée et prolongée — BPCO, hypoventilation, altitude — elle élève la pression puis induit un remodelage.</p><div class="key"><b>Traitement.</b> Corriger l’hypoxémie par l’oxygène lève une partie de la vasoconstriction.</div></template>
<template data-pop="i27-toxiques" data-title="Médicaments et toxiques associés à l’HTAP"><p><b>Association certaine</b> (ESC/ERS 2022 et 7e Symposium mondial 2024) : aminorex, benfluorex, dexfenfluramine, fenfluramine, méthamphétamines, dasatinib, huile de colza frelatée ; ajout en 2024 de la mitomycine C et du carfilzomib.</p><p>Ces substances agissent notamment sur la sérotonine ou sur des kinases qui contrôlent la prolifération vasculaire. L’atteinte du dasatinib peut régresser à l’arrêt.</p><div class="key"><b>Conséquence pratique.</b> L’anamnèse médicamenteuse remonte des années en arrière ; une HTAP liée à un médicament fait partie des formes testées pour la vasoréactivité.</div></template>
<template data-pop="i27-depistage" data-title="Dépistage organisé"><p><b>Sclérodermie.</b> Le risque d’HTAP justifie un dépistage annuel ; un algorithme validé est recommandé si la maladie évolue depuis plus de trois ans, avec une capacité vitale forcée ≥ 40 % et une DLCO &lt; 60 %.</p><p><b>Porteurs d’une mutation de BMPR2 et apparentés.</b> Une échocardiographie annuelle est souvent proposée, par consensus d’experts.</p><p><b>Hypertension portale.</b> Une échocardiographie s’impose avant un shunt portosystémique ou une transplantation hépatique, car une HTP sévère accroît le risque opératoire.</p><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, section 5.3</a>.</p></template>
<template data-pop="i27-dyspnee" data-title="Dyspnée d’effort de l’hypertension pulmonaire"><p>Elle est progressive, survient pour des efforts de plus en plus modestes et ne s’accompagne ni de sifflements ni d’orthopnée au début. Le débit fixe limite l’apport d’oxygène ; les zones ventilées mais mal perfusées augmentent l’espace mort et la ventilation nécessaire.</p><div class="key"><b>Piège.</b> L’orthopnée et la dyspnée paroxystique nocturne orientent vers une cardiopathie gauche, donc vers le groupe 2.</div></template>
<template data-pop="i27-angor" data-title="Douleur thoracique d’effort"><p>Le ventricule droit hypertrophié consomme plus d’oxygène alors que sa perfusion systolique disparaît quand sa pression approche la pression aortique : il devient ischémique. Plus rarement, une artère pulmonaire très dilatée comprime le tronc coronaire gauche.</p><div class="key"><b>Conséquence.</b> Un angor d’effort chez un patient porteur d’HTP justifie une évaluation de la gravité et, s’il est typique, une recherche de compression coronaire.</div></template>
<template data-pop="i27-syncope" data-title="Syncope d’effort"><p>À l’effort, les muscles se vasodilatent. Un cœur sain augmente son débit pour maintenir la pression ; un ventricule droit au débit fixe n’y parvient pas. La pression cérébrale chute brutalement.</p><div class="key"><b>Gravité.</b> Une syncope répétée classe le patient dans le risque élevé de l’ESC/ERS 2022 ; elle impose un adressage urgent.</div></template>
<template data-pop="i27-compressions" data-title="Hémoptysie, dysphonie et toux"><p>Les artères bronchiques hypertrophiées, surtout dans l’HTP-TEC et les cardiopathies congénitales, peuvent saigner. Une artère pulmonaire dilatée peut comprimer le nerf laryngé récurrent gauche entre elle et l’aorte : la voix devient rauque (syndrome d’Ortner).</p><div class="key"><b>Conséquence.</b> Une hémoptysie abondante est une urgence ; l’embolisation des artères bronchiques est souvent le traitement.</div></template>
<template data-pop="i27-b2" data-title="Composante pulmonaire du deuxième bruit"><p class="lab">Technique</p><p>On ausculte le deuxième espace intercostal gauche. La composante pulmonaire suit la fermeture aortique ; elle devient forte, parfois palpable, et peut s’entendre jusqu’à l’apex.</p><p class="lab">Mécanisme</p><p>La valve pulmonaire se ferme avec force sous une pression diastolique élevée.</p><div class="key"><b>Valeur.</b> Signe précoce mais subjectif ; son absence n’exclut pas une HTP.</div></template>
<template data-pop="i27-it" data-title="Insuffisance tricuspide et manœuvre de Carvallo"><p>Le souffle holosystolique se perçoit au bord gauche du sternum. Il augmente à l’inspiration, car le retour veineux accru remplit davantage le ventricule droit : c’est le signe de Carvallo, qui le distingue d’une insuffisance mitrale.</p><div class="key"><b>Lien.</b> La même fuite permet la mesure échographique de la pression systolique pulmonaire.</div></template>
<template data-pop="i27-jugulaire" data-title="Turgescence jugulaire"><p class="lab">Technique</p><p>Le patient est incliné à 45 degrés. On mesure la hauteur de la pulsation de la veine jugulaire interne au-dessus de l’angle sternal ; plus de 3 cm traduit une pression veineuse centrale élevée. Une onde systolique ample reflète l’insuffisance tricuspide.</p><p class="lab">Reflux hépatojugulaire</p><p>Une pression abdominale prolongée élève durablement la pulsation quand le ventricule droit ne peut accueillir le surcroît de retour veineux.</p><div class="key"><b>Valeur.</b> Ce signe indique une défaillance droite installée ; il n’indique pas la cause.</div></template>
<template data-pop="i27-signes-cause" data-title="Signes orientant vers un groupe"><table class="t"><tr><th>Signe</th><th>Orientation</th></tr><tr><td>Sclérodactylie, télangiectasies, phénomène de Raynaud</td><td>Sclérodermie : groupe 1</td></tr><tr><td>Angiomes stellaires, ascite, splénomégalie</td><td>Hypertension portale : groupe 1</td></tr><tr><td>Cyanose, hippocratisme</td><td>Shunt congénital, maladie respiratoire</td></tr><tr><td>Crépitants secs des bases</td><td>Pneumopathie interstitielle : groupe 3</td></tr><tr><td>Souffle mitral ou aortique, orthopnée</td><td>Cardiopathie gauche : groupe 2</td></tr><tr><td>Obésité, cyphoscoliose, somnolence</td><td>Hypoventilation : groupe 3</td></tr><tr><td>Séquelles de thrombose veineuse</td><td>HTP-TEC : groupe 4</td></tr></table><p>La lecture va du signe à l’hypothèse, jamais au diagnostic : un patient âgé peut cumuler plusieurs causes.</p></template>
<template data-pop="i27-echo-proba" data-title="Probabilité échocardiographique d’hypertension pulmonaire"><p class="lab">Vitesse de régurgitation tricuspide</p><p>≤ 2,8 m/s ou non mesurable ; 2,9 à 3,4 m/s ; &gt; 3,4 m/s.</p><p class="lab">Signes indirects (trois catégories)</p><p>Ventricules : rapport des diamètres basaux droit/gauche &gt; 1, septum aplati, TAPSE/PAPS &lt; 0,55 mm/mmHg. Artère pulmonaire : temps d’accélération pulmonaire &lt; 105 ms ou encoche mésosystolique, vitesse de fuite pulmonaire protodiastolique &gt; 2,2 m/s, diamètre supérieur à celui de la racine aortique. Veine cave inférieure &gt; 21 mm peu compressible, surface de l’oreillette droite &gt; 18 cm².</p><p class="lab">Probabilité</p><p>Faible : vitesse ≤ 2,8 m/s sans signe indirect. Intermédiaire : vitesse ≤ 2,8 m/s avec signes, ou 2,9 à 3,4 m/s sans signes. Élevée : 2,9 à 3,4 m/s avec signes, ou &gt; 3,4 m/s. Les signes doivent appartenir à au moins deux catégories.</p><div class="key"><b>Piège.</b> L’échocardiographie estime une probabilité ; elle ne pose ni le diagnostic ni le groupe.</div></template>
<template data-pop="i27-scinti" data-title="Scintigraphie de ventilation-perfusion"><p class="lab">Principe</p><p>On compare la ventilation d’un gaz marqué à la perfusion de macroagrégats marqués. Une obstruction artérielle crée des défauts de perfusion segmentaires dans des territoires bien ventilés.</p><p class="lab">Valeur</p><p>Une scintigraphie normale exclut pratiquement une HTP-TEC. Elle est plus sensible que l’angioscanner pour les lésions distales.</p><div class="key"><b>Suite.</b> Des défauts non appariés après trois mois d’anticoagulation conduisent à l’angioscanner, au cathétérisme droit et à l’angiographie pulmonaire en centre.</div></template>
<template data-pop="i27-cathe" data-title="Cathétérisme cardiaque droit"><p class="lab">Mesures</p><p>Pressions de l’oreillette droite, du ventricule droit, de l’artère pulmonaire et d’occlusion ; débit cardiaque par thermodilution ou méthode de Fick directe ; saturation veineuse mélangée en oxygène. Le calcul des RVP en découle.</p><p class="lab">Risque</p><p>Dans les centres expérimentés, les complications graves surviennent dans environ 1,1 % des cas et la mortalité liée au geste est de 0,055 %.</p><div class="key"><b>Exigence.</b> Le zéro est placé à mi-thorax et les pressions se lisent en fin d’expiration ; une erreur de quelques millimètres de mercure change le groupe.</div></template>
<template data-pop="i27-vasoreactivite" data-title="Test de vasoréactivité aiguë"><p class="lab">Indication</p><p>Uniquement dans l’HTAP idiopathique, héritable ou liée à un médicament, lors du cathétérisme initial.</p><p class="lab">Technique</p><p>Monoxyde d’azote inhalé (10 à 20 ppm), iloprost inhalé ou époprosténol intraveineux. Le test ne se fait jamais avec un inhibiteur calcique, qui peut provoquer un collapsus.</p><p class="lab">Réponse positive</p><p>Baisse de la PAPm d’au moins 10 mmHg jusqu’à ≤ 40 mmHg, avec un débit stable ou accru. Moins de 10 % des patients testés répondent.</p><div class="key"><b>Conséquence.</b> Seuls les répondeurs reçoivent un inhibiteur calcique à forte dose, contrôlé après trois à six mois.</div></template>
<template data-pop="i27-defaillance" data-title="Réanimation du ventricule droit"><p>On traite le déclencheur : infection, arythmie, anémie, embolie, arrêt thérapeutique. On évite l’hypoxie, l’hypercapnie et l’acidose, qui contractent les artères pulmonaires. On retire l’excès de volume par diurétiques intraveineux. On maintient la pression systémique par la noradrénaline et l’on soutient la contractilité par la dobutamine. On abaisse la postcharge par monoxyde d’azote inhalé ou prostanoïde intraveineux.</p><div class="key"><b>Recours.</b> L’oxygénation extracorporelle peut servir de pont vers la transplantation chez un candidat éligible. L’intubation, à haut risque de collapsus, se prépare avec une équipe expérimentée.</div></template>
<template data-pop="i27-strates4" data-title="Modèle simplifié à quatre strates"><table class="t"><tr><th>Points</th><th>1</th><th>2</th><th>3</th><th>4</th></tr><tr><td>Classe fonctionnelle de l’OMS</td><td>I ou II</td><td>—</td><td>III</td><td>IV</td></tr><tr><td>Marche de six minutes</td><td>&gt; 440 m</td><td>320–440 m</td><td>165–319 m</td><td>&lt; 165 m</td></tr><tr><td>NT-proBNP</td><td>&lt; 300 ng/L</td><td>300–649 ng/L</td><td>650–1100 ng/L</td><td>&gt; 1100 ng/L</td></tr></table><p>On additionne les points, on divise par le nombre de variables et on arrondit à l’entier. Le résultat 1, 2, 3 ou 4 correspond au risque faible, intermédiaire-faible, intermédiaire-élevé ou élevé, avec une mortalité à un an croissante d’environ 0–3 % à plus de 20 %.</p><div class="key"><b>Usage.</b> Ce modèle sert au suivi, après trois à quatre mois de traitement ; il distingue mieux que le modèle à trois strates les patients du milieu.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, tableau 18</a>.</p></template>
<template data-pop="i27-strates3" data-title="Modèle à trois strates : variables complémentaires"><p>Outre la clinique, la marche, le peptide et l’hémodynamique, le modèle intègre l’épreuve d’effort cardiorespiratoire (pic de VO₂ &gt; 15, 11 à 15, &lt; 11 mL/min/kg), l’échocardiographie (surface de l’oreillette droite &lt; 18, 18 à 26, &gt; 26 cm² ; TAPSE/PAPS &gt; 0,32, 0,19 à 0,32, &lt; 0,19 mm/mmHg ; épanchement péricardique), l’IRM cardiaque et la saturation veineuse mélangée en oxygène (&gt; 65 %, 60 à 65 %, &lt; 60 %).</p><div class="key"><b>Principe.</b> Aucune variable ne suffit seule ; le clinicien pondère l’ensemble, en privilégiant les signes de défaillance droite.</div></template>
<template data-pop="i27-mesures" data-title="Mesures générales"><p>Le réentraînement supervisé améliore la capacité d’effort et la qualité de vie (classe I). La vaccination contre la grippe, le pneumocoque et le SARS-CoV-2 prévient des décompensations. L’oxygène est prescrit si la PaO₂ reste &lt; 8 kPa (60 mmHg). Une carence martiale est corrigée, par voie intraveineuse si l’absorption orale est mauvaise. Les diurétiques traitent la rétention hydrosodée. Un soutien psychologique est proposé.</p><div class="key"><b>Anticoagulation.</b> Elle n’est pas recommandée de façon générale dans l’HTAP, mais peut se discuter au cas par cas (classe IIb).</div></template>
<template data-pop="i27-combinaison" data-title="Bithérapie initiale et essai AMBITION"><p class="lab">Preuve</p><p>Dans AMBITION, 500 patients naïfs de traitement ont reçu ambrisentan plus tadalafil ou l’une des deux monothérapies. La combinaison a réduit de moitié le risque d’échec clinique (rapport des risques 0,50 ; intervalle de confiance à 95 % 0,35 à 0,72).</p><p class="lab">Logique</p><p>Les deux médicaments agissent sur des voies différentes ; leurs effets s’additionnent sans toxicité croisée majeure.</p><div class="key"><b>Limite.</b> Les patients âgés avec comorbidités cardiopulmonaires étaient peu représentés : chez eux, la monothérapie initiale reste préférée.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26308684/" target="_blank" rel="noopener">Galiè et al., N Engl J Med 2015;373:834-844</a>.</p></template>
<template data-pop="i27-sotatercept" data-title="Sotatercept : preuves et arbitrage des sources"><p class="lab">Preuves</p><p>STELLAR (323 patients en classe II–III sous traitement de fond) : gain de 40,8 m à la marche à 24 semaines et réduction de 84 % du décès ou de l’aggravation clinique (rapport des risques 0,16). ZENITH (172 patients à haut risque) : réduction du critère décès, transplantation ou hospitalisation (rapport des risques 0,24). Hyperion (320 patients diagnostiqués depuis moins d’un an) : réduction de l’aggravation clinique (rapport des risques 0,24).</p><p class="lab">Source retenue</p><p>L’ESC/ERS 2022, antérieure à ces essais, ne mentionne pas le sotatercept. L’algorithme du 7e Symposium mondial (2024) l’intègre comme option d’escalade au suivi pour les patients à risque intermédiaire ou élevé. Swissmedic l’a autorisé le 13.09.2024 en association au traitement standard en classes II–III, puis en classe IV depuis le 05.02.2026. Ces sources plus récentes et applicables en Suisse l’emportent sur ce point ; l’ESC/ERS 2022 reste le texte de référence pour le reste de la stratégie.</p><div class="key"><b>Limite.</b> Les essais ont inclus surtout des HTAP idiopathiques, héritables et associées aux connectivites ; les données manquent pour l’hypertension portopulmonaire et l’infection par le VIH.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36877098/" target="_blank" rel="noopener">STELLAR, N Engl J Med 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40167274/" target="_blank" rel="noopener">ZENITH, N Engl J Med 2025;392:1987-2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41025556/" target="_blank" rel="noopener">Hyperion, N Engl J Med 2025;393:1599-1611</a> ; <a href="https://doi.org/10.1183/13993003.01325-2024" target="_blank" rel="noopener">Chin et al., 2024</a> ; <a href="https://www.swissmedic.ch/swissmedic/de/home/humanarzneimittel/authorisations/new-medicines/winrevair-pulver-sotaterceptum.html" target="_blank" rel="noopener">Swissmedic, Winrevair</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36017548/" target="_blank" rel="noopener">ESC/ERS 2022, texte en vigueur</a>.</p></template>
<template data-pop="i27-greffe" data-title="Transplantation pulmonaire"><p>Elle s’envisage quand le patient reste à risque intermédiaire-élevé ou élevé malgré un traitement maximal, y compris un prostanoïde parentéral. L’adressage au centre de transplantation se fait tôt, car l’évaluation et l’attente prennent du temps. La transplantation bipulmonaire est la règle ; le ventricule droit récupère après la baisse de la postcharge.</p><div class="key"><b>Piège.</b> Attendre la défaillance droite terminale pour adresser expose au décès sur liste d’attente.</div></template>
<template data-pop="i27-endarteriectomie" data-title="Endartériectomie pulmonaire"><p>Le chirurgien ouvre les artères pulmonaires sous circulation extracorporelle et arrêt circulatoire en hypothermie profonde. Il retire le matériel fibreux qui adhère à la paroi des artères proximales, jusqu’aux branches segmentaires.</p><div class="key"><b>Portée.</b> Recommandée en classe I pour les lésions accessibles, elle normalise souvent l’hémodynamique. Une équipe spécialisée juge l’opérabilité ; une HTP persistante après chirurgie relève de l’angioplastie ou du riociguat.</div></template>
<template data-pop="i27-angioplastie" data-title="Angioplastie pulmonaire par ballonnet"><p>Le radiologue interventionnel dilate des membranes et des sténoses des artères segmentaires et sous-segmentaires, en plusieurs séances. Les RVP et la capacité d’effort s’améliorent.</p><div class="key"><b>Risques.</b> Lésion vasculaire avec hémoptysie et œdème de reperfusion ; la technique se pratique dans des centres expérimentés. Recommandée en classe I pour les patients inopérables ou avec HTP résiduelle.</div></template>
<template data-pop="i27-groupe2" data-title="Pourquoi pas de vasodilatateur pulmonaire dans le groupe 2"><p>Dans une HTP postcapillaire, l’obstacle est en aval. Dilater les artères pulmonaires augmente le flux vers une oreillette gauche déjà sous pression : la pression capillaire monte et l’œdème pulmonaire menace. Les essais d’antagonistes de l’endothéline et d’inhibiteurs de la phosphodiestérase dans l’insuffisance cardiaque n’ont pas montré de bénéfice, et certains ont montré un préjudice.</p><div class="key"><b>Recommandation.</b> L’ESC/ERS 2022 déconseille ces médicaments dans le groupe 2 (classe III).</div></template>
<template data-pop="i27-groupe3" data-title="Vasodilatateurs et maladies respiratoires"><p>Un vasodilatateur systémique relâche aussi les artérioles des alvéoles mal ventilées, que la vasoconstriction hypoxique avait fermées : le sang y retourne et l’hypoxémie s’aggrave.</p><p>Le tréprostinil inhalé fait exception : il atteint surtout les alvéoles ventilées. Il peut être envisagé dans l’HTP des pneumopathies interstitielles (classe IIb). L’ambrisentan est déconseillé dans la fibrose pulmonaire idiopathique, le riociguat dans les pneumopathies interstitielles idiopathiques (classe III).</p></template>
<template data-pop="i27-grossesse" data-title="Grossesse et contraception"><p>L’ESC/ERS 2022 recommande d’informer dès le diagnostic sur les risques d’une grossesse et de la déconseiller. La contraception doit être efficace ; le bosentan réduit l’efficacité des contraceptifs hormonaux. Antagonistes de l’endothéline, riociguat et sotatercept sont contre-indiqués pendant la grossesse.</p><div class="key"><b>Conduite.</b> Une grossesse débutée est prise en charge sans délai dans un centre expert, qui discute son interruption ou son suivi rapproché et adapte le traitement.</div></template>
<template data-pop="i27-altitude" data-title="Montagne et vol aérien"><p>La cabine d’un avion est pressurisée à une altitude pouvant atteindre 2438 m. L’oxygène en vol est recommandé si le patient reçoit déjà de l’oxygène ou si sa PaO₂ est &lt; 8 kPa ; 2 L/min ramènent la pression inspirée d’oxygène à celle du niveau de la mer.</p><p>Selon l’ESC/ERS 2022, le patient évite les séjours au-dessus de 1500 m sans oxygène. Des excursions d’une journée jusqu’à 2500 m ont été bien tolérées chez des patients non hypoxémiques.</p><div class="key"><b>Conseil.</b> Le voyageur emporte un résumé médical, la liste de ses traitements et des doses supplémentaires.</div></template>
<template data-pop="i27-fistules" data-title="Fistules artérioveineuses pulmonaires"><p class="lab">Cause</p><p>La plupart surviennent dans la télangiectasie hémorragique héréditaire (maladie de Rendu-Osler), maladie autosomique dominante d’une prévalence d’environ 1 sur 5000, liée surtout aux gènes ENG et ACVRL1.</p><p class="lab">Conséquences</p><p>Le shunt droit-gauche provoque une hypoxémie, une cyanose, une dyspnée, et laisse passer caillots et bactéries : accident vasculaire cérébral et abcès cérébral.</p><p class="lab">Démarche</p><p>Dépistage par échocardiographie transthoracique de contraste aux microbulles, confirmation par TDM. Les fistules accessibles sont embolisées par voie endovasculaire. Une antibioprophylaxie précède les gestes à risque de bactériémie, et des filtres à air équipent les perfusions.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/19553198/" target="_blank" rel="noopener">Faughnan et al., 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32894695/" target="_blank" rel="noopener">Faughnan et al., 2020</a>.</p></template>
<template data-pop="i27-criteres" data-title="Limites des critères hémodynamiques"><p>Les seuils dépendent d’une mesure rigoureuse : zéro à mi-thorax, lecture en fin d’expiration, débit mesuré et non estimé. Une PAPO proche de 15 mmHg laisse une zone d’incertitude, surtout chez le patient âgé à facteurs de risque d’insuffisance cardiaque à fraction d’éjection préservée. Une PAPm &gt; 20 mmHg avec PAPO ≤ 15 mmHg et RVP ≤ 2 unités Wood ne rentre dans aucun profil : l’ESC/ERS 2022 la nomme HTP non classée.</p><div class="key"><b>Conséquence.</b> Le diagnostic se pose en centre, avec l’ensemble du contexte clinique ; un chiffre isolé ne suffit pas.</div></template>
