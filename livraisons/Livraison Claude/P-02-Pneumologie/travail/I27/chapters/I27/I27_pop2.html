<template data-pop="i27-ecg" data-title="ECG de l’hypertension pulmonaire"><p class="lab">Signes</p><p>Déviation axiale droite, onde R dominante en V1 (rapport R/S &gt; 1), aspect qR en V1, onde P ample en D2 (≥ 0,25 mV) par dilatation de l’oreillette droite, bloc de branche droit, ondes T négatives de V1 à V3.</p><p class="lab">Mécanisme</p><p>L’hypertrophie du ventricule droit déplace le vecteur de dépolarisation vers la droite et l’avant.</p><div class="key"><b>Valeur.</b> Un ECG normal n’exclut pas une HTP ; associé à un NT-proBNP normal, il la rend peu probable. Le flutter et la fibrillation auriculaire sont fréquents et mal tolérés.</div></template>
<template data-pop="i27-bnp" data-title="NT-proBNP"><p>Le ventricule étiré sécrète le propeptide natriurétique, dont le fragment N-terminal se dose dans le sang. Sa concentration suit la contrainte pariétale du ventricule droit.</p><p>Seuils de risque de l’ESC/ERS 2022 : &lt; 300, 300 à 1100, &gt; 1100 ng/L (trois strates) ; 300, 650 et 1100 ng/L séparent les quatre strates du suivi.</p><div class="key"><b>Pièges.</b> Il augmente avec l’âge, l’insuffisance rénale, la fibrillation auriculaire et toute cardiopathie gauche ; il baisse avec l’obésité. Sa tendance chez un même patient compte plus qu’une valeur isolée.</div></template>
<template data-pop="i27-efr" data-title="Épreuves fonctionnelles, DLCO et gaz du sang"><p>La spirométrie et les volumes recherchent une obstruction ou une restriction (groupe 3). Dans l’HTAP, ils sont normaux ou peu modifiés, mais la DLCO baisse, car le lit capillaire se réduit.</p><p>Une DLCO &lt; 45 % de la valeur prédite oriente vers une maladie veino-occlusive, une sclérodermie, une maladie parenchymateuse ou un phénotype de sujet âgé à comorbidités, et assombrit le pronostic. Les gaz du sang montrent souvent une hypocapnie, par hyperventilation ; une hypercapnie oriente vers une hypoventilation.</p><div class="key"><b>Conséquence.</b> Une DLCO très basse avec une spirométrie normale doit faire chercher une maladie vasculaire pulmonaire.</div></template>
<template data-pop="i27-tdm" data-title="TDM thoracique et angioscanner"><p>La TDM montre un tronc pulmonaire dilaté (≥ 30 mm, ou plus large que l’aorte), des cavités droites agrandies et cherche emphysème ou pneumopathie interstitielle. Un verre dépoli centrolobulaire, des lignes septales et des adénopathies évoquent une maladie veino-occlusive.</p><p>L’angioscanner montre dans l’HTP-TEC des membranes, des bandes, des rétrécissements abrupts ou des occlusions, une perfusion en mosaïque et des artères bronchiques hypertrophiées.</p><div class="key"><b>Limite.</b> Un angioscanner normal n’exclut pas une HTP-TEC distale : la scintigraphie reste l’examen de dépistage.</div></template>
<template data-pop="i27-biologie" data-title="Biologie étiologique et de retentissement"><p>Formule sanguine, bilan martial, créatinine, électrolytes, tests hépatiques, thyréostimuline. Sérologies du VIH et des hépatites B et C. Anticorps antinucléaires avec anti-centromère, anti-topo-isomérase I et anti-ribonucléoprotéine, à la recherche d’une connectivite. Dans l’HTP-TEC, recherche d’un syndrome des antiphospholipides.</p><div class="key"><b>Logique.</b> Chaque test répond à une cause du groupe 1 ou 5, ou à un facteur d’aggravation comme l’anémie, la carence martiale ou la dysthyroïdie.</div></template>
<template data-pop="i27-marche" data-title="Test de marche de six minutes"><p>Le patient marche le plus loin possible dans un couloir de 30 m pendant six minutes, selon un protocole standardisé. On note la distance, la SpO₂, la fréquence cardiaque et la dyspnée.</p><p>Seuils de l’ESC/ERS 2022 : &gt; 440 m (risque faible), 165 à 440 m (intermédiaire), &lt; 165 m (élevé).</p><div class="key"><b>Limite.</b> La distance dépend de l’âge, de la taille, du poids, des troubles orthopédiques et de la motivation ; on compare surtout le patient à lui-même.</div></template>
<template data-pop="i27-genetique" data-title="Conseil et test génétiques"><p>Le test est proposé aux patients atteints d’HTAP idiopathique, familiale, liée aux anorexigènes, ou de maladie veino-occlusive, après un conseil génétique. Il cherche des variants de BMPR2 et d’autres gènes, dont EIF2AK4 dans la maladie veino-occlusive.</p><div class="key"><b>Conséquence.</b> Un variant pathogène permet de tester les apparentés ; un porteur asymptomatique reçoit un suivi régulier. La pénétrance incomplète impose d’expliquer qu’être porteur ne signifie pas être malade.</div></template>
<template data-pop="i27-d-ica" data-title="Inhibiteurs calciques dans l’HTAP"><p class="lab">Mécanisme</p><p>Ils bloquent les canaux calciques de type L du muscle lisse artériel et relâchent les artères pulmonaires chez les rares patients dont la maladie reste vasoréactive.</p><p class="lab">Usage</p><p>Nifédipine, diltiazem ou amlodipine, à doses élevées atteintes progressivement. Réévaluation complète, cathétérisme compris, après trois à six mois ; une bonne réponse se traduit par une classe fonctionnelle I–II.</p><div class="key"><b>Risque.</b> Chez un non-répondeur, ils abaissent la pression systémique et dépriment le ventricule droit. Effets indésirables : hypotension, œdèmes des membres inférieurs.</div></template>
<template data-pop="i27-d-are" data-title="Antagonistes des récepteurs de l’endothéline"><p class="lab">Mécanisme</p><p>Ils bloquent la fixation de l’endothéline 1 sur ses récepteurs de type A (ambrisentan, sélectif) ou A et B (bosentan, macitentan) : vasodilatation et effet antiprolifératif.</p><p class="lab">Preuves</p><p>Dans SERAPHIN, le macitentan 10 mg a réduit de 45 % le critère combiné de morbidité et mortalité (rapport des risques 0,55).</p><p class="lab">Effets indésirables et contre-indications</p><p>Selon l’information professionnelle suisse, tous sont contre-indiqués pendant la grossesse et si les transaminases dépassent trois fois la limite supérieure de la normale avant traitement. Bosentan : contrôle mensuel de la fonction hépatique, baisse dose-dépendante de l’hémoglobine ; contre-indiqué en cas d’insuffisance hépatique Child-Pugh B ou C et avec la ciclosporine A ou le glibenclamide. Ambrisentan : contre-indiqué dans la fibrose pulmonaire idiopathique et l’insuffisance hépatique sévère. Macitentan : test de grossesse mensuel recommandé.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23984728/" target="_blank" rel="noopener">Pulido et al., N Engl J Med 2013;369:809-818</a> ; informations professionnelles suisses Tracleer®, Volibris® et Opsumit®, Swissmedic (AIPS via AmiKo), consultées le 08.10.2026.</p></template>
<template data-pop="i27-d-ipde5" data-title="Inhibiteurs de la phosphodiestérase 5"><p class="lab">Mécanisme</p><p>La phosphodiestérase 5, abondante dans le poumon, dégrade le GMPc produit sous l’effet du monoxyde d’azote. L’inhiber prolonge la vasodilatation et l’effet antiprolifératif.</p><p class="lab">Usage</p><p>Sildénafil 20 mg trois fois par jour, à 6 à 8 heures d’intervalle. Tadalafil 40 mg une fois par jour ; 20 mg au début si la clairance de la créatinine est de 31 à 80 mL/min ou en cas d’insuffisance hépatique Child-Pugh A ou B ; non recommandé si la clairance est ≤ 30 mL/min ou en Child-Pugh C.</p><div class="key"><b>Effets et contre-indications.</b> Céphalées, bouffées vasomotrices, épistaxis, troubles visuels. Contre-indiqués avec les dérivés nitrés, la molsidomine et le riociguat, et après une neuropathie optique ischémique antérieure non artéritique. Le sildénafil est contre-indiqué avec les inhibiteurs puissants du CYP3A4 et en cas de pression artérielle &lt; 90/50 mmHg au début du traitement.</div><p class="src">Référence : information professionnelle suisse Revatio® et Adcirca®, Swissmedic (AIPS via AmiKo), consultée le 08.10.2026.</p></template>
<template data-pop="i27-d-riociguat" data-title="Riociguat"><p class="lab">Mécanisme</p><p>Il stimule directement la guanylate cyclase soluble et la sensibilise au monoxyde d’azote : le GMPc augmente même quand le monoxyde d’azote manque.</p><p class="lab">Preuves</p><p>CHEST-1 (HTP-TEC inopérable ou persistante) : gain de 46 m à la marche à 16 semaines contre placebo et baisse des RVP. PATENT-1 (HTAP) : gain de 36 m.</p><p class="lab">Usage</p><p>0,5 ou 1 mg trois fois par jour pendant deux semaines, puis paliers de 0,5 mg toutes les deux semaines jusqu’à 2,5 mg trois fois par jour au plus, si la pression systolique reste ≥ 95 mmHg sans signe d’hypotension (information professionnelle suisse).</p><div class="key"><b>Contre-indications.</b> Grossesse et allaitement ; dérivés nitrés et donneurs de monoxyde d’azote ; inhibiteurs spécifiques ou non spécifiques de la phosphodiestérase ; autres stimulants de la guanylate cyclase ; HTP associée à une pneumopathie interstitielle idiopathique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23883377/" target="_blank" rel="noopener">Ghofrani et al., CHEST-1, N Engl J Med 2013;369:319-329</a> ; information professionnelle suisse Adempas®, Swissmedic (AIPS via AmiKo), consultée le 08.10.2026.</p></template>
<template data-pop="i27-d-selexipag" data-title="Sélexipag"><p class="lab">Mécanisme</p><p>Agoniste oral sélectif du récepteur de la prostacycline, il n’est pas un analogue de structure : il augmente l’AMPc du muscle lisse.</p><p class="lab">Preuves</p><p>GRIPHON (1156 patients) : réduction de 40 % du critère combiné de morbidité et mortalité (rapport des risques 0,60), surtout par moins d’aggravations.</p><p class="lab">Usage</p><p>200 µg deux fois par jour, augmentés chaque semaine de 200 µg par prise jusqu’à la dose maximale tolérée, au plus 1600 µg deux fois par jour. Une seule prise par jour en cas d’insuffisance hépatique Child-Pugh B ou d’inhibiteur modéré du CYP2C8 (clopidogrel, déférasirox, tériflunomide) ; pas d’emploi en Child-Pugh C.</p><div class="key"><b>Effets et interactions.</b> Céphalées, diarrhée, douleurs de la mâchoire, myalgies. Contre-indiqué avec les inhibiteurs puissants du CYP2C8, comme le gemfibrozil, qui multiplient l’exposition au métabolite actif.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/26699168/" target="_blank" rel="noopener">Sitbon et al., GRIPHON, N Engl J Med 2015;373:2522-2533</a> ; information professionnelle suisse Uptravi®, Swissmedic (AIPS via AmiKo), consultée le 08.10.2026.</p></template>
<template data-pop="i27-d-prostanoides" data-title="Prostanoïdes"><p class="lab">Mécanisme</p><p>Analogues de la prostacycline : vasodilatation, effet antiprolifératif et antiagrégant plaquettaire.</p><p class="lab">Formes</p><p>Époprosténol intraveineux continu par cathéter central, de demi-vie très courte ; Tréprostinil sous-cutané ou intraveineux ; tréprostinil inhalé dans certaines pneumopathies interstitielles. Iloprost inhalé, 2,5 puis 5 µg par inhalation, habituellement cinq à six fois par jour selon l’information suisse.</p><div class="key"><b>Risques.</b> Infections et thromboses de cathéter, douleur au site sous-cutané, céphalées, diarrhée, douleurs de la mâchoire. L’interruption brutale provoque un rebond. L’information suisse contre-indique l’époprosténol et le tréprostinil parentéral dans l’insuffisance cardiaque par dysfonction ventriculaire gauche sévère, et le tréprostinil dans l’HTAP liée à une maladie veino-occlusive.</div><p class="src">Références : informations professionnelles suisses Veletri®, Remodulin® et Ventavis®, Swissmedic (AIPS via AmiKo), consultées le 08.10.2026.</p></template>
<template data-pop="i27-d-sotatercept" data-title="Sotatercept (Winrevair)"><p class="lab">Mécanisme</p><p>Protéine de fusion entre le domaine extracellulaire du récepteur de l’activine de type 2A et le fragment constant d’une immunoglobuline G1. Elle piège les activines et des facteurs de différenciation de la croissance, ce qui rééquilibre la signalisation au profit de la voie antiproliférative.</p><p class="lab">Posologie suisse</p><p>Sous-cutané toutes les trois semaines : 0,3 mg/kg, puis 0,7 mg/kg. Hémoglobine et plaquettes avant chacune des cinq premières doses. Report de trois semaines si l’hémoglobine augmente de plus de 2 g/dL par rapport à la dose précédente en dépassant la limite supérieure, si elle augmente de plus de 4 g/dL depuis le début, ou si les plaquettes tombent sous 50 × 10⁹/L.</p><div class="key"><b>Effets indésirables.</b> Épistaxis et saignements gingivaux, télangiectasies, érythrocytose, thrombopénie, hausse tensionnelle. Contraception efficace jusqu’à au moins quatre mois après la dernière dose.</div><p class="src">Référence : <a href="https://swissmedic.ch/dam/swissmedic/en/dokumente/zulassung/swisspar/69129-winrevair-01-swisspar-20241105.pdf.download.pdf/SwissPAR%20Winrevair.pdf" target="_blank" rel="noopener">Swissmedic, SwissPAR et information professionnelle de Winrevair</a>.</p></template>
<template data-pop="i27-d-diuretiques" data-title="Diurétiques"><p>La défaillance droite retient le sodium : la congestion veineuse rénale réduit la filtration et active le système rénine-angiotensine-aldostérone. Diurétiques de l’anse, thiazidiques et antagonistes des récepteurs minéralocorticoïdes s’emploient seuls ou associés, avec une surveillance du poids, de la créatinine et des électrolytes.</p><div class="key"><b>Piège.</b> Une déplétion excessive réduit la précharge d’un ventricule droit dépendant de son remplissage et fait chuter le débit. Des œdèmes peuvent aussi être un effet indésirable d’un antagoniste de l’endothéline.</div></template>
<template data-pop="i27-d-anticoag" data-title="Anticoagulation dans l’hypertension pulmonaire"><p><b>HTP-TEC.</b> Anticoagulation à dose curative à vie (classe I), par antivitamine K en cas de syndrome des antiphospholipides ; les AOD sont utilisés dans les autres cas.</p><p><b>HTAP.</b> Elle n’est pas recommandée de façon générale ; elle se discute au cas par cas (classe IIb), en pesant le risque hémorragique, accru par l’hypertension portale ou les télangiectasies.</p></template>
<template data-pop="i27-interactions" data-title="Mécanismes des interactions dangereuses"><p>Le riociguat, les inhibiteurs de la phosphodiestérase 5 et les dérivés nitrés augmentent tous le GMPc : leur association provoque une vasodilatation systémique et une hypotension grave. Le bosentan induit le CYP3A4 et le CYP2C9 : il réduit l’efficacité des contraceptifs hormonaux et de nombreux médicaments. La ciclosporine augmente fortement ses concentrations. Le gemfibrozil inhibe le CYP2C8, voie d’activation et d’élimination du sélexipag.</p><div class="key"><b>Conséquence.</b> Sous bosentan, l’information suisse demande une contraception supplémentaire ou alternative non hormonale ; l’ordonnance est revue à chaque nouvelle prescription.</div><p class="src">Référence : information professionnelle suisse Tracleer®, Adempas® et Uptravi®, Swissmedic (AIPS via AmiKo), consultée le 08.10.2026.</p></template>
<template data-pop="pareto-i27-clin" data-title="Pareto — Définition, mécanismes et clinique"><p class="ratio" data-cover="i27-0,i27-1,i27-2,i27-3,i27-4,i27-5,i27-6"></p><ul><li>HTP : PAPm &gt; 20 mmHg au cathétérisme ; précapillaire si PAPO ≤ 15 mmHg et RVP &gt; 2 unités Wood.</li><li>Cinq groupes ; le groupe 2 est le plus fréquent, l’HTAP (groupe 1) est rare.</li><li>Remodelage artériel par excès d’endothéline et déficit de monoxyde d’azote et de prostacycline ; le pronostic dépend du ventricule droit.</li><li>Dyspnée d’effort inexpliquée d’abord ; syncope d’effort et signes droits signent la gravité.</li></ul></template>
<template data-pop="pareto-i27-diag" data-title="Pareto — Diagnostic, urgence et risque"><p class="ratio" data-cover="i27-7,i27-8,i27-9"></p><ul><li>Échocardiographie pour la probabilité, scintigraphie pour l’HTP-TEC, cathétérisme droit en centre pour le diagnostic.</li><li>Défaillance droite aiguë : traiter le déclencheur, maintenir la pression systémique, éviter le remplissage massif.</li><li>Viser le risque faible : classe I–II, marche &gt; 440 m, NT-proBNP &lt; 300 ng/L.</li></ul></template>
<template data-pop="pareto-i27-tt" data-title="Pareto — Traitement, situations particulières et suivi"><p class="ratio" data-cover="i27-10,i27-11,i27-12,i27-13,i27-14"></p><ul><li>Inhibiteur calcique seulement après vasoréactivité positive.</li><li>HTAP typique : bithérapie initiale ; trithérapie avec prostanoïde parentéral au risque élevé ; escalade par sélexipag, riociguat ou sotatercept.</li><li>HTP-TEC : anticoagulation à vie, endartériectomie, angioplastie, riociguat ; groupes 2 et 3 : traiter la cause.</li><li>Grossesse déconseillée ; oxygène en vol si hypoxémie ; réévaluation du risque tous les trois à six mois.</li><li>Une fistule artérioveineuse expose à l’hypoxémie et à l’embolie paradoxale.</li></ul></template>
<template data-pop="pareto-i27-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="i27-e-1,i27-e-2,i27-e-3"></p><ul><li>Examen de référence : cathétérisme cardiaque droit.</li><li>Vitesse tricuspide ≤ 2,8, 2,9 à 3,4 ou &gt; 3,4 m/s, modulée par les signes indirects.</li><li>PAPO &gt; 15 mmHg : groupe 2 ; scintigraphie anormale : groupe 4 ; DLCO très basse : maladie veino-occlusive.</li></ul></template>
<template data-pop="pareto-i27-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i27-p-1,i27-p-2,i27-p-3"></p><ul><li>Quatre voies : endothéline, monoxyde d’azote, prostacycline, activine.</li><li>Jamais riociguat avec inhibiteur de la phosphodiestérase 5 ou dérivé nitré.</li><li>Tératogénicité des antagonistes de l’endothéline, du riociguat et du sotatercept ; transaminases sous bosentan ; hémoglobine et plaquettes sous sotatercept.</li></ul></template>
