<template data-pop="j84-interstitium" data-title="L’interstitium pulmonaire"><p class="lab">Définition et repères</p><p>L’interstitium est le tissu de soutien du poumon. Il comprend la cloison alvéolaire, avec sa membrane basale, ses fibres élastiques et ses capillaires, ainsi que les gaines conjonctives qui entourent les bronches, les vaisseaux et les septums interlobulaires.</p><p class="lab">Mécanisme</p><p>Dans les parois alvéolaires, l’interstitium est réduit à une épaisseur de l’ordre du dixième de micromètre là où l’air et le sang se touchent. Toute cellule inflammatoire, tout œdème ou tout collagène ajouté allonge la distance de diffusion et rigidifie la paroi.</p><p class="lab">Conséquence clinique</p><p>Une PID se manifeste par une dyspnée d’effort, une désaturation à la marche, un trouble restrictif et une baisse de la DLCO, avant même que l’imagerie standard ne soit franchement anormale.</p><div class="key"><b>Limite.</b> Le terme « interstitiel » est anatomique. De nombreuses PID atteignent aussi les alvéoles ou les bronchioles ; la TDM en haute résolution précise la distribution réelle.</div></template>
<template data-pop="j84-velcro" data-title="Crépitants « velcro »"><p class="lab">Définition et repères</p><p>Ce sont des crépitants fins, secs, nombreux, entendus en fin d’inspiration, surtout aux bases et dans les régions axillaires. Ils évoquent le bruit d’une bande auto-agrippante que l’on décolle.</p><p class="lab">Mécanisme</p><p>Les petites voies aériennes et les alvéoles des zones fibreuses restent fermées en fin d’expiration. Elles s’ouvrent brutalement en fin d’inspiration, lorsque la pression transpulmonaire devient suffisante ; chaque réouverture produit une brève onde sonore.</p><p class="lab">Conséquence clinique</p><p>Ces crépitants sont présents chez la grande majorité des patients atteints de FPI et peuvent précéder les anomalies radiographiques. Chez un adulte de plus de 60 ans, ils justifient une TDM en haute résolution.</p><div class="key"><b>Limite.</b> Les crépitants de l’œdème pulmonaire sont plus humides et varient avec le traitement diurétique ; ceux d’une pneumonie sont localisés et accompagnés de fièvre. La sarcoïdose et la pneumopathie d’hypersensibilité donnent moins souvent ce signe.</div><p class="src">Référence : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a>.</p></template>
<template data-pop="j84-classification" data-title="Classification ATS/ERS 2013 des pneumopathies interstitielles idiopathiques"><p class="lab">Définition et repères</p><p>La classification distingue six entités majeures, regroupées en trois familles, deux entités rares et une catégorie inclassable.</p><table class="t"><tr><th>Famille</th><th>Entités</th></tr><tr><td>Fibrosantes chroniques</td><td>FPI ; PINS idiopathique</td></tr><tr><td>Liées au tabac</td><td>Bronchiolite respiratoire avec PID ; pneumopathie interstitielle desquamative</td></tr><tr><td>Aiguës ou subaiguës</td><td>Pneumopathie organisée cryptogénique ; pneumopathie interstitielle aiguë</td></tr><tr><td>Rares</td><td>Pneumopathie interstitielle lymphoïde idiopathique ; fibroélastose pleuroparenchymateuse idiopathique</td></tr></table><p class="lab">Mécanisme</p><p>Chaque famille correspond à un mode d’agression : réparation aberrante pour la FPI, réaction à la fumée pour les formes tabagiques, lésion alvéolaire aiguë ou bourgeons conjonctifs intra-alvéolaires pour les formes aiguës.</p><p class="lab">Conséquence clinique</p><p>Les formes tabagiques régressent souvent à l’arrêt du tabac ; la pneumopathie organisée répond aux corticoïdes ; la FPI exige un antifibrosant.</p><div class="key"><b>Limite.</b> Ces entités sont dites idiopathiques seulement après exclusion des causes ; la même lésion peut être secondaire à une connectivite ou à un médicament.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/24032382/" target="_blank" rel="noopener">Travis et al., 2013</a>.</p></template>
<template data-pop="j84-tdm-uip" data-title="TDM en haute résolution : les quatre catégories"><p class="lab">Définition et repères</p><p>La recommandation 2022 classe l’aspect tomodensitométrique selon la probabilité d’une UIP histologique.</p><table class="t"><tr><th>Catégorie</th><th>Aspect</th><th>Confiance pour une UIP</th></tr><tr><td>UIP</td><td>Prédominance sous-pleurale et basale ; rayon de miel avec ou sans bronchiectasies de traction</td><td>Supérieure à 90 %</td></tr><tr><td>UIP probable</td><td>Même distribution ; réticulations et bronchiectasies de traction sans rayon de miel</td><td>70 à 89 %</td></tr><tr><td>Indéterminée</td><td>Fibrose diffuse sans prédominance sous-pleurale ni indice d’une autre cause</td><td>51 à 69 %</td></tr><tr><td>Diagnostic alternatif</td><td>Kystes, mosaïque, verre dépoli prédominant, nodules centrolobulaires, prédominance supérieure</td><td>50 % ou moins</td></tr></table><p class="lab">Mécanisme</p><p>Le rayon de miel traduit la destruction alvéolaire et sa transformation en kystes bronchiolisés ; les bronchiectasies de traction traduisent la rétraction du tissu fibreux qui écarte les parois bronchiques.</p><p class="lab">Conséquence clinique</p><p>Un aspect UIP ou UIP probable, dans un contexte compatible et sans cause, permet de retenir une FPI sans biopsie.</p><div class="key"><b>Piège.</b> Les opacités déclives des bases disparaissent en décubitus ventral ; sans ces coupes, une hypoventilation peut être prise pour une fibrose.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022, tableau 3</a>.</p></template>
<template data-pop="j84-fpi-def" data-title="Fibrose pulmonaire idiopathique"><p class="lab">Définition et repères</p><p>La FPI est une pneumopathie interstitielle fibrosante chronique et progressive, de cause inconnue, limitée au poumon, survenant surtout après 60 ans et associée à l’aspect UIP.</p><p class="lab">Mécanisme</p><p>Elle résulte de micro-lésions épithéliales répétées sur un épithélium vieilli ou génétiquement prédisposé, suivies d’une réparation aberrante par les myofibroblastes.</p><p class="lab">Conséquence clinique</p><p>Le diagnostic repose sur l’exclusion des causes et sur la discussion multidisciplinaire ; le traitement repose sur les antifibrosants et non sur l’immunosuppression.</p><div class="key"><b>Limite.</b> Le mot « idiopathique » n’exclut pas des facteurs de risque connus (tabac, poussières, génétique) ; il signifie qu’aucune cause suffisante n’est identifiée.</div></template>
<template data-pop="j84-reparation" data-title="Réparation aberrante de l’épithélium alvéolaire"><p class="lab">Définition et repères</p><p>La réparation normale d’une alvéole lésée passe par la prolifération des pneumocytes de type II, leur différenciation en type I et la résorption de la matrice provisoire.</p><p class="lab">Mécanisme</p><ol><li>Des micro-lésions répétées frappent un épithélium vieilli, aux télomères courts ou soumis à un stress du réticulum endoplasmique.</li><li>Les pneumocytes de type II, épuisés ou sénescents, ne régénèrent plus la surface et sécrètent des médiateurs profibrosants.</li><li>Le TGF-β activé transforme les fibroblastes en myofibroblastes, qui déposent du collagène.</li><li>La matrice rigide entretient l’activation des fibroblastes : la fibrose devient autonome.</li></ol><p class="lab">Conséquence clinique</p><p>La maladie progresse même après l’arrêt du tabac ; seuls les médicaments qui ciblent la fibrogenèse ralentissent son évolution.</p><div class="key"><b>Limite.</b> Ce modèle intègre les données actuelles mais reste incomplet ; le rôle exact du reflux, des virus et du microbiome pulmonaire est discuté.</div></template>
<template data-pop="j84-foyers" data-title="Foyers fibroblastiques"><p class="lab">Définition et repères</p><p>Les foyers fibroblastiques sont de petits amas de fibroblastes et de myofibroblastes dans une matrice jeune, recouverts d’un épithélium hyperplasique, à la jonction entre poumon fibreux et poumon encore normal.</p><p class="lab">Mécanisme</p><p>Ils représentent le front actif de la fibrose : c’est là que le collagène est produit. Leur juxtaposition à des zones de fibrose ancienne crée l’hétérogénéité temporelle propre à l’UIP.</p><p class="lab">Conséquence clinique</p><p>Leur nombre est associé à une évolution plus rapide dans plusieurs séries histologiques. Leur présence est un critère histologique de l’UIP.</p><div class="key"><b>Limite.</b> Les foyers fibroblastiques ne sont pas spécifiques de la FPI ; ils existent dans d’autres fibroses à aspect UIP.</div></template>
<template data-pop="j84-muc5b" data-title="Le variant de MUC5B"><p class="lab">Définition et repères</p><p>Le variant rs35705950, situé dans le promoteur du gène MUC5B, est retrouvé chez environ un tiers des patients atteints de FPI.</p><p class="lab">Mécanisme</p><p>Il augmente l’expression de la mucine 5B dans les bronchioles distales et les kystes du rayon de miel. Un excès de mucus pourrait gêner la clairance et prolonger l’exposition de l’épithélium aux agressions.</p><p class="lab">Conséquence clinique</p><p>Il explique une part du risque familial et sporadique. Il est aussi associé aux anomalies interstitielles découvertes fortuitement chez des sujets sans symptômes.</p><div class="key"><b>Limite.</b> Le variant n’est pas recherché en routine : il est fréquent dans la population générale et la plupart des porteurs ne développent jamais de fibrose.</div><p class="src">Référence : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1013660" target="_blank" rel="noopener">Seibold et al., 2011</a>.</p></template>
<template data-pop="j84-telomeres" data-title="Télomèropathies"><p class="lab">Définition et repères</p><p>Les télomèropathies sont des maladies héréditaires liées à des variants des gènes de maintenance des télomères : TERT, TERC, RTEL1, PARN et d’autres.</p><p class="lab">Mécanisme</p><p>Les télomères courts déclenchent la sénescence des cellules à renouvellement rapide. Dans le poumon, les pneumocytes de type II perdent leur capacité de régénération ; dans la moelle, la production des cellules sanguines diminue ; dans le foie, une cirrhose peut survenir.</p><p class="lab">Conséquence clinique</p><p>Une fibrose avant 50 ans, des cas familiaux, une cytopénie, une cirrhose inexpliquée ou une canitie très précoce doivent faire évoquer ce diagnostic et proposer un conseil génétique.</p><div class="key"><b>Limite.</b> Les variants de signification incertaine sont fréquents ; l’interprétation relève d’un centre spécialisé.</div></template>
<template data-pop="j84-genetique" data-title="Génétique des fibroses pulmonaires"><p class="lab">Définition et repères</p><p>On parle de fibrose pulmonaire familiale lorsqu’au moins deux apparentés biologiques sont atteints. Les gènes impliqués concernent la mucine (MUC5B), les télomères (TERT, TERC, RTEL1, PARN) et le surfactant (SFTPC et d’autres).</p><p class="lab">Mécanisme</p><p>Les variants du surfactant provoquent un mauvais repliement protéique dans les pneumocytes de type II ; ceux des télomères en épuisent la capacité de division. Les deux voies aboutissent à une réparation épithéliale défaillante.</p><p class="lab">Conséquence clinique</p><p>L’identification d’un variant pathogène permet un conseil familial et adapte la transplantation, car les télomèropathies augmentent la toxicité médullaire des immunosuppresseurs.</p><div class="key"><b>Limite.</b> Un test négatif n’exclut pas une prédisposition familiale ; de nombreux gènes restent inconnus.</div></template>
<template data-pop="j84-panther" data-title="Essai PANTHER-IPF"><p class="lab">Définition et repères</p><p>Essai randomisé publié en 2012 comparant l’association prednisone, azathioprine et N-acétylcystéine à un placebo chez des patients atteints de FPI légère à modérée.</p><p class="lab">Mécanisme</p><p>L’association reposait sur l’hypothèse d’une inflammation chronique à l’origine de la fibrose. Elle exposait à l’immunosuppression sans cibler la réparation aberrante.</p><p class="lab">Conséquence clinique</p><p>Le bras de triple association a été interrompu : 8 décès contre 1 et 23 hospitalisations contre 7 par rapport au placebo. Les corticoïdes au long cours et l’azathioprine sont donc proscrits comme traitement de fond de la FPI.</p><div class="key"><b>Limite.</b> Cet essai ne concerne pas les PID inflammatoires (connectivites, PINS cellulaire, pneumopathie organisée), où les corticoïdes et les immunosuppresseurs gardent leur place.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22607134/" target="_blank" rel="noopener">Raghu et al., 2012</a>.</p></template>
<template data-pop="j84-medicaments" data-title="Pneumopathies interstitielles médicamenteuses"><p class="lab">Définition et repères</p><p>Plusieurs centaines de médicaments peuvent provoquer une PID. Les plus fréquents en pratique sont l’amiodarone, le méthotrexate, la nitrofurantoïne, la bléomycine et les inhibiteurs de points de contrôle immunitaire.</p><p class="lab">Mécanisme</p><p>Les mécanismes sont une toxicité directe (amiodarone, accumulée dans les macrophages et les pneumocytes), une réaction d’hypersensibilité (méthotrexate, nitrofurantoïne) ou une activation immunitaire (inhibiteurs de points de contrôle).</p><p class="lab">Conséquence clinique</p><p>Le délai varie de quelques jours à plusieurs années. L’arrêt du médicament est la mesure essentielle ; une corticothérapie est discutée selon la gravité et le médicament.</p><div class="key"><b>Piège.</b> La nitrofurantoïne prescrite pendant des années en prévention des cystites peut provoquer une fibrose chronique qui ressemble à une FPI.</div><p class="src">Référence : <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox</a>.</p></template>
<template data-pop="j84-connectivites" data-title="PID des connectivites"><p class="lab">Définition et repères</p><p>Les connectivites qui atteignent le plus souvent l’interstitium sont la sclérodermie systémique, la polyarthrite rhumatoïde, les myopathies inflammatoires, dont le syndrome des antisynthétases, et le syndrome de Gougerot-Sjögren.</p><table class="t"><tr><th>Maladie</th><th>Aspect fréquent</th><th>Indice</th></tr><tr><td>Sclérodermie systémique</td><td>PINS</td><td>Anti-topoisomérase I, phénomène de Raynaud</td></tr><tr><td>Polyarthrite rhumatoïde</td><td>UIP ou PINS</td><td>Anti-CCP, homme fumeur</td></tr><tr><td>Myopathie inflammatoire</td><td>PINS, pneumopathie organisée</td><td>Anti-synthétases, anti-MDA5</td></tr><tr><td>Gougerot-Sjögren</td><td>PINS, pneumopathie lymphoïde</td><td>Sécheresse, anti-SSA</td></tr></table><p class="lab">Mécanisme</p><p>L’auto-immunité entraîne une inflammation interstitielle qui évolue, selon la maladie et le terrain, vers la guérison ou vers la fibrose.</p><p class="lab">Conséquence clinique</p><p>La recommandation ERS/EULAR 2025 propose un dépistage par TDM au diagnostic de la sclérodermie, de la connectivite mixte et des myopathies avec facteurs de risque, et un traitement immunosuppresseur adapté, avec ajout du nintédanib en cas de progression. Dans la sclérodermie, l’essai SENSCIS a montré un ralentissement du déclin de la CVF sous nintédanib.</p><div class="key"><b>Piège.</b> Une dermatomyosite à anticorps anti-MDA5 peut provoquer une PID rapidement progressive avec peu de signes musculaires ; elle exige un traitement immunosuppresseur intensif urgent.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1903076" target="_blank" rel="noopener">Distler et al., SENSCIS, 2019</a>.</p></template>
<template data-pop="j84-hypersensibilite" data-title="Pneumopathie d’hypersensibilité : renvoi"><p class="lab">Définition et repères</p><p>La pneumopathie d’hypersensibilité est une PID immunologique provoquée par l’inhalation répétée d’antigènes, souvent aviaires ou fongiques. Elle est traitée dans le cours J67.</p><p class="lab">Mécanisme</p><p>L’antigène inhalé atteint les bronchioles et les alvéoles ; la réponse lymphocytaire forme des granulomes mal limités et une bronchiolite, qui peuvent évoluer vers la fibrose.</p><p class="lab">Conséquence clinique</p><p>La TDM montre des nodules centrolobulaires, un aspect en mosaïque et un piégeage expiratoire ; le lavage montre souvent une lymphocytose. L’éviction de l’antigène est le traitement principal.</p><div class="key"><b>Piège.</b> Dans près de la moitié des cas, l’antigène n’est pas identifié ; une forme fibrosante sans exposition retrouvée peut être confondue avec une FPI.</div></template>
<template data-pop="j84-dyspnee" data-title="Dyspnée d’effort dans les PID"><p class="lab">Définition et repères</p><p>La dyspnée est la perception d’un effort respiratoire excessif. L’échelle mMRC la classe de 0 (essoufflement lors d’un effort intense seulement) à 4 (essoufflement à l’habillage).</p><p class="lab">Mécanisme</p><p>La baisse de compliance augmente le travail inspiratoire ; l’hypoxémie d’effort stimule les chémorécepteurs ; les récepteurs pulmonaires sensibles à l’étirement des zones fibreuses accélèrent la fréquence respiratoire.</p><p class="lab">Conséquence clinique</p><p>Une dyspnée qui progresse sur des mois avec une spirométrie non obstructive impose de mesurer la DLCO et de rechercher une PID.</p><div class="key"><b>Limite.</b> Une dyspnée disproportionnée par rapport aux volumes pulmonaires doit faire chercher une hypertension pulmonaire, une anémie ou une cardiopathie associée.</div></template>
<template data-pop="j84-toux" data-title="Toux de la fibrose pulmonaire"><p class="lab">Définition et repères</p><p>La toux sèche touche la majorité des patients atteints de FPI. Elle est souvent quinteuse, déclenchée par la parole ou l’effort.</p><p class="lab">Mécanisme</p><p>La distorsion mécanique des voies aériennes par la fibrose, la sensibilisation des afférences et l’hypersécrétion de mucine distale y contribuent ; un reflux associé peut l’aggraver.</p><p class="lab">Conséquence clinique</p><p>La toux altère le sommeil et la vie sociale ; elle est un facteur pronostique défavorable dans plusieurs cohortes. Son traitement relève de mesures ciblées et, dans les formes réfractaires, des opiacés à faible dose dans une démarche palliative.</p><div class="key"><b>Limite.</b> Les antitussifs habituels sont souvent peu efficaces ; les antiacides ne sont pas recommandés dans le seul but d’améliorer la fonction respiratoire.</div></template>
<template data-pop="j84-signes-systemiques" data-title="Signes de connectivite à rechercher"><p class="lab">Définition et repères</p><p>Le médecin recherche un phénomène de Raynaud, une sclérodactylie, des télangiectasies, des arthrites, une faiblesse musculaire proximale, des papules de Gottron, des « mains de mécanicien », une sécheresse buccale et oculaire.</p><p class="lab">Mécanisme</p><p>Ces signes traduisent l’atteinte vasculaire, cutanée, articulaire ou musculaire de la maladie auto-immune dont la PID peut être la première manifestation.</p><p class="lab">Conséquence clinique</p><p>Un seul signe suffit à demander un avis rhumatologique et un bilan d’auto-anticorps ciblé ; le diagnostic change le traitement.</p><div class="key"><b>Limite.</b> Certains patients présentent des signes et des auto-anticorps sans remplir les critères d’une connectivite ; ils sont alors suivis pour une évolution possible.</div></template>
<template data-pop="j84-desaturation" data-title="Désaturation d’effort et test de marche de six minutes"><p class="lab">Définition et repères</p><p>Le test de marche de six minutes mesure la distance parcourue sur un couloir plat, avec la SpO₂ et la fréquence cardiaque en continu. Un sujet sain âgé de 70 ans parcourt habituellement plus de 400 m sans désaturer.</p><p class="lab">Mécanisme</p><p>À l’effort, le temps de transit capillaire raccourcit et l’inégalité ventilation-perfusion s’accentue : la SpO₂ chute alors qu’elle était normale au repos.</p><p class="lab">Conséquence clinique</p><p>Une désaturation inférieure à 88 % est un marqueur pronostique défavorable, un critère d’oxygénothérapie d’effort et un élément du consensus ISHLT pour l’inscription en transplantation.</p><div class="key"><b>Limite.</b> Un signal de mauvaise qualité aux doigts froids sous-estime la saturation ; un capteur frontal ou au lobe de l’oreille est parfois préférable.</div></template>
<template data-pop="j84-hippocratisme" data-title="Hippocratisme digital"><p class="lab">Définition et repères</p><p>L’hippocratisme est un bombement de l’extrémité des doigts avec perte de l’angle normal entre l’ongle et le repli unguéal. Le signe de Schamroth recherche la disparition de la fenêtre losangique entre deux ongles accolés.</p><p class="lab">Mécanisme</p><p>Le mécanisme proposé implique des mégacaryocytes et des amas plaquettaires qui échappent au filtre pulmonaire et libèrent des facteurs de croissance (PDGF, VEGF) dans la pulpe digitale.</p><p class="lab">Conséquence clinique</p><p>Il est observé chez une partie des patients atteints de FPI ; il est plus rare dans la sarcoïdose et la pneumopathie d’hypersensibilité.</p><div class="key"><b>Piège.</b> Un hippocratisme d’apparition récente chez un fumeur impose de rechercher un cancer bronchique, plus fréquent sur un poumon fibreux.</div></template>
<template data-pop="j84-serologie" data-title="Bilan d’auto-immunité devant une PID"><p class="lab">Définition et repères</p><p>Le bilan initial recherche les anticorps antinucléaires, le facteur rhumatoïde et les anticorps anti-CCP. Il est complété selon la clinique par les anticorps anti-ENA, un panel de myosite (anti-synthétases, anti-MDA5) et les ANCA.</p><p class="lab">Mécanisme</p><p>Ces auto-anticorps témoignent d’une maladie auto-immune dont la PID est une manifestation, parfois inaugurale.</p><p class="lab">Conséquence clinique</p><p>Un résultat positif et concordant avec la clinique réoriente vers une PID de connectivite et vers l’immunosuppression.</p><div class="key"><b>Piège.</b> Un faible titre isolé d’anticorps antinucléaires est fréquent après 60 ans et n’exclut pas une FPI ; il ne vaut que s’il s’accompagne d’un aspect ou d’un signe concordant.</div><p class="src">Référence : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a>.</p></template>
<template data-pop="j84-dlco" data-title="Épreuves fonctionnelles : restriction et transfert"><p class="lab">Définition et repères</p><p>La DLCO mesure le transfert du monoxyde de carbone de l’alvéole vers l’hémoglobine. Elle est interprétée par rapport à la LIN et corrigée pour l’hémoglobine. Le KCO rapporte la DLCO au volume alvéolaire.</p><p class="lab">Mécanisme</p><p>La fibrose réduit la surface d’échange et la densité capillaire et épaissit la membrane : la DLCO baisse. La rétraction élastique réduit la CPT et la CVF ; le rapport VEMS/CVF reste normal ou augmente.</p><p class="lab">Conséquence clinique</p><p>Une DLCO inférieure à 40 % de la valeur prédite traduit une maladie avancée. Les baisses absolues de CVF de 5 % et de DLCO de 10 % en un an sont des critères de progression.</p><div class="key"><b>Piège.</b> Une anémie abaisse la DLCO sans atteinte pulmonaire ; un tabagisme récent l’abaisse aussi par le monoxyde de carbone déjà présent dans le sang.</div></template>
