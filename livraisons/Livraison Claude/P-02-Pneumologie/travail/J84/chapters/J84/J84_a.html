<div class="chap-head"><div class="code">J84 — Autres affections pulmonaires interstitielles · couvre J84.0, J84.1, J84.8 et J84.9 · renvois : D86 — Sarcoïdose, J67 — Pneumopathie d’hypersensibilité · CIM-10-GM 2024 · Appareil respiratoire</div>
<h1>Pneumopathies interstitielles diffuses</h1><span class="status">Adulte · fibrose pulmonaire idiopathique au premier plan · rédaction du 08.10.2026 · référentiels ATS/ERS/JRS/ALAT 2022 et ERS/EULAR 2025</span></div>

<section class="ilot" id="j84-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 71 ans, ancien fumeur, consulte pour un essoufflement d’effort qui s’aggrave depuis dix-huit mois et une toux sèche rebelle. Son médecin a déjà prescrit deux inhalateurs, sans effet. À l’auscultation, des crépitants fins et secs, comparables au décollement d’une bande auto-agrippante, occupent les deux bases. <b>Ce bruit, chez un adulte de plus de 60 ans, impose de rechercher une pneumopathie interstitielle fibrosante avant de conclure à une bronchopathie ou à une insuffisance cardiaque.</b></p><p>Les pneumopathies interstitielles diffuses (PID) atteignent la paroi alvéolaire, là où l’oxygène traverse vers le sang. Leur pronostic dépend d’une question précise : la fibrose est-elle idiopathique, secondaire à une cause qu’il faut supprimer, ou inflammatoire et sensible aux immunosuppresseurs ? Le lecteur sait reconnaître une PID, réunir les éléments d’une discussion multidisciplinaire, identifier la fibrose pulmonaire idiopathique (FPI), prescrire et surveiller un antifibrosant, et reconnaître une fibrose pulmonaire progressive (FPP).</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j84-interstitium">L’interstitium pulmonaire (ce qu’il contient et pourquoi sa fibrose essouffle)</button> ; <button class="w" data-justification="1" data-k="j84-velcro">les crépitants « velcro » (mécanisme et valeur diagnostique)</button>.</div></section>
<section class="ilot" id="j84-1"><h2><span class="n">1</span>Définitions et classification</h2><p>Une PID est une maladie dont la lésion dominante siège dans l’interstitium, c’est-à-dire le tissu conjonctif qui sépare l’épithélium alvéolaire de l’endothélium capillaire. L’inflammation ou la fibrose épaississent cette cloison et rigidifient le poumon. Plus de deux cents causes sont décrites. Le clinicien les range en quatre familles, car chacune appelle une conduite différente : PID de cause connue (médicaments, expositions, connectivites), granulomatoses (sarcoïdose, pneumopathie d’hypersensibilité), pneumopathies interstitielles idiopathiques, et formes rares (protéinose alvéolaire, lymphangioléiomyomatose, histiocytose).</p><p>La <button class="w" data-justification="1" data-k="j84-classification">classification ATS/ERS 2013 des pneumopathies interstitielles idiopathiques (six entités majeures, deux rares)</button> distingue les formes fibrosantes chroniques, les formes liées au tabac et les formes aiguës ou subaiguës. La FPI y occupe la première place par sa fréquence et sa gravité. Elle se définit comme une pneumopathie fibrosante chronique et progressive de cause inconnue, limitée au poumon, associée à l’aspect de <button class="w" data-justification="1" data-k="j84-tdm-uip">pneumopathie interstitielle commune, dite UIP (lésions élémentaires et catégories tomodensitométriques)</button>.</p><table class="t"><tr><th>Code et intitulé</th><th>Contenu développé dans ce cours</th></tr><tr><td><b>J84.0 — Pneumonies alvéolaires et pariéto-alvéolaires</b></td><td>Protéinose alvéolaire et microlithiase : formes rares, citées pour le diagnostic différentiel.</td></tr><tr><td><b>J84.1 — Autres affections pulmonaires interstitielles avec fibrose</b></td><td>FPI, pneumopathie interstitielle aiguë (syndrome de Hamman-Rich), PINS fibrosante idiopathique : cœur du cours.</td></tr><tr><td><b>J84.8 — Autres affections pulmonaires interstitielles précisées</b></td><td>Formes idiopathiques précisées non fibrosantes, par exemple pneumopathie organisée cryptogénique ou pneumopathie desquamative.</td></tr><tr><td><b>J84.9 — Affection pulmonaire interstitielle, sans précision</b></td><td>PID inclassable ou insuffisamment documentée : une étape d’attente, non un diagnostic final.</td></tr></table><p>Le cinquième caractère du code signale l’absence (0) ou la présence (1) d’une exacerbation aiguë. La CIM-10-GM exclut de J84 les fibroses dues aux agents externes : la <a href="#/entry/J67">J67 — Pneumopathie d’hypersensibilité</a>, les pneumoconioses et la fibrose post-radique ont leur propre code. La <a href="#/entry/D86">D86 — Sarcoïdose</a> relève également d’un autre cours. Ce regroupement pédagogique ne prouve pas la complétude de la CIM-11.</p><div class="key"><b>À retenir.</b> Le mot « interstitiel » désigne un siège lésionnel, non une maladie. La démarche consiste à passer du syndrome (PID) à l’entité, car la FPI, la PINS d’une connectivite et la pneumopathie d’hypersensibilité ne se traitent pas de la même manière.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24032382/" target="_blank" rel="noopener">Travis et al., classification ATS/ERS, 2013</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., recommandation ATS/ERS/JRS/ALAT, 2022</a>.</p></section>
<section class="ilot" id="j84-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2><p>La FPI est une maladie rare. En Europe, son incidence ajustée varie de 0,09 à 0,49 nouveau cas pour 10 000 habitants par an, et sa prévalence de 0,33 à 2,51 pour 10 000 selon la revue de Maher (2021). Elle touche surtout les hommes, après 60 ans, et le plus souvent d’anciens fumeurs. Aucune donnée d’incidence nationale suisse publiée n’a été identifiée à la date de rédaction ; les chiffres européens servent donc de référence.</p><p>Sans traitement, la capacité vitale forcée (CVF) diminue d’environ 200 mL par an : les groupes placebo des essais <button class="w" data-justification="1" data-k="j84-d-nintedanib">INPULSIS (nintédanib contre placebo)</button> perdaient 223,5 mL en 52 semaines. La médiane de survie après le diagnostic était classiquement de trois à cinq ans avant les antifibrosants. Cette moyenne masque une grande hétérogénéité : certains patients restent stables plusieurs années, d’autres déclinent vite, et une <button class="w" data-justification="1" data-k="j84-exacerbation">exacerbation aiguë (définition et pronostic)</button> peut interrompre brutalement une évolution lente.</p><p>Les PID des connectivites représentent l’autre grande source de fibrose. Elles concernent des patients plus jeunes, plus souvent des femmes, et leur évolution dépend de la maladie systémique. Une partie de ces fibroses, comme une partie des pneumopathies d’hypersensibilité, progresse malgré un traitement bien conduit : c’est la FPP.</p><div class="key"><b>À retenir.</b> La FPI est rare, mais elle tue plus vite que de nombreux cancers. L’hétérogénéité de son évolution justifie une mesure régulière de la fonction respiratoire plutôt qu’un pronostic annoncé d’emblée.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8261998/" target="_blank" rel="noopener">Maher et al., incidence et prévalence mondiales, 2021</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402584" target="_blank" rel="noopener">Richeldi et al., essais INPULSIS, 2014</a>.</p></section>
<section class="ilot" id="j84-3"><h2><span class="n">3</span>De la micro-lésion alvéolaire à la fibrose</h2><p>À l’état normal, la paroi alvéolaire mesure moins d’un micromètre d’épaisseur sur une surface de l’ordre de 70 à 100 m². Les pneumocytes de type I assurent l’échange gazeux ; les pneumocytes de type II produisent le surfactant et régénèrent l’épithélium après une agression. Une lésion banale est réparée sans cicatrice : les cellules de type II prolifèrent, se différencient en cellules de type I et la matrice provisoire est résorbée.</p><p>Dans la FPI, le modèle dominant n’est plus celui d’une inflammation chronique, mais celui d’une <button class="w" data-justification="1" data-k="j84-reparation">réparation aberrante après des micro-lésions épithéliales répétées (séquence cellulaire)</button>. Un épithélium vieilli, fragilisé par le tabac, les poussières, le reflux ou des virus, et prédisposé par des variants génétiques, ne se régénère plus correctement. Les cellules épithéliales lésées libèrent du TGF-β et d’autres médiateurs ; ceux-ci recrutent des fibroblastes qui se transforment en myofibroblastes. Ces cellules s’accumulent en <button class="w" data-justification="1" data-k="j84-foyers">foyers fibroblastiques (lésion active de la maladie)</button> et déposent un collagène abondant et rigide.</p><p>Deux prédispositions génétiques expliquent une part notable du risque. Le <button class="w" data-justification="1" data-k="j84-muc5b">variant du promoteur de MUC5B (fréquence, risque relatif et mécanisme)</button> augmente la production de mucine dans les bronchioles distales. Les <button class="w" data-justification="1" data-k="j84-telomeres">télomèropathies (TERT, TERC, RTEL1, PARN)</button> épuisent la capacité de division des pneumocytes de type II.</p><p>La matrice rigide entretient la maladie : elle active à son tour les fibroblastes, ce qui explique une progression autonome. Les alvéoles se rétractent, les bronchioles se dilatent par traction, puis des kystes aériens à paroi épaisse se groupent en rayon de miel. La paroi épaissie et la perte de capillaires réduisent le transfert des gaz ; le poumon rigide exige un travail inspiratoire accru. <b>Dyspnée, désaturation à l’effort et toux découlent directement de ces deux conséquences.</b></p><div class="key"><b>Conséquence thérapeutique.</b> Si la fibrose résulte d’une réparation aberrante plutôt que d’une inflammation, les corticoïdes ne peuvent pas la freiner ; c’est la raison biologique de l’échec de l’<button class="w" data-justification="1" data-k="j84-panther">essai PANTHER-IPF (corticoïdes et immunosuppresseurs nuisibles)</button> et de l’efficacité des antifibrosants.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1013660" target="_blank" rel="noopener">Seibold et al., variant de MUC5B, 2011</a>.</p></section>
<section class="ilot" id="j84-4"><h2><span class="n">4</span>Causes à rechercher et facteurs de risque</h2><p>Le diagnostic de FPI est un diagnostic d’exclusion : il exige d’avoir cherché, puis écarté, toute cause connue. Cette recherche n’est pas formelle. Supprimer un médicament toxique ou un antigène inhalé peut stabiliser une fibrose qui, attribuée à tort à la FPI, aurait continué de progresser.</p><table class="t"><tr><th>Cause à rechercher</th><th>Exemples</th><th>Pourquoi elle change la conduite</th></tr><tr><td><button class="w" data-justification="1" data-k="j84-medicaments">Médicaments pneumotoxiques (mécanisme et délai)</button></td><td>Amiodarone, méthotrexate, nitrofurantoïne, bléomycine, inhibiteurs de points de contrôle immunitaire</td><td>L’arrêt du médicament est le premier traitement ; certains répondent aux corticoïdes.</td></tr><tr><td><button class="w" data-justification="1" data-k="j84-connectivites">Connectivites (atteintes pulmonaires et indices extrapulmonaires)</button></td><td>Sclérodermie systémique, polyarthrite rhumatoïde, myopathies inflammatoires, syndrome de Gougerot-Sjögren</td><td>Immunosuppression fréquente ; pronostic et traitement propres.</td></tr><tr><td><button class="w" data-justification="1" data-k="j84-hypersensibilite">Antigènes inhalés (renvoi à la pneumopathie d’hypersensibilité)</button></td><td>Oiseaux, plumes, moisissures domestiques, foin moisi</td><td>L’éviction antigénique conditionne l’évolution.</td></tr><tr><td>Poussières minérales</td><td>Amiante, silice, métaux durs</td><td>Origine professionnelle, déclaration à l’assureur-accidents (Suva) et prévention des collègues.</td></tr><tr><td>Radiothérapie thoracique</td><td>Cancer du sein, du poumon, lymphome</td><td>Fibrose localisée au champ irradié, codée hors J84.</td></tr></table><p>Ce tableau se lit de gauche à droite : une cause plausible appelle une preuve et une mesure correctrice. Par exemple, une femme de 58 ans sous nitrofurantoïne au long cours pour des cystites récidivantes présente une PID ; l’arrêt du médicament précède toute autre décision. Chez un homme âgé sans exposition ni signe systémique, ces causes sont recherchées, puis la FPI devient l’hypothèse principale.</p><p>Les facteurs de risque de FPI sont l’âge, le sexe masculin, le tabagisme ancien ou actuel, les poussières de bois ou de métaux, le reflux gastro-œsophagien et une histoire familiale de fibrose. Leur présence augmente la probabilité ; leur absence n’exclut pas le diagnostic.</p><div class="key"><b>À retenir.</b> Chaque PID impose un inventaire des médicaments, des expositions domestiques et professionnelles, et des signes de connectivite. Cet inventaire est consigné, car la discussion multidisciplinaire en dépend.</div><p class="src">Références : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., diagnostic de la FPI, ATS/ERS/JRS/ALAT 2018</a> ; <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox, base de données des pneumopathies médicamenteuses</a>.</p></section>
<section class="ilot" id="j84-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>La <button class="w" data-justification="1" data-k="j84-dyspnee">dyspnée d’effort progressive (mécanisme et quantification)</button> est le symptôme cardinal. Elle s’installe sur des mois, souvent attribuée à l’âge, à la sédentarité ou au poids. Le médecin la quantifie par l’échelle mMRC et par une activité concrète, comme le nombre d’étages montés sans arrêt. La <button class="w" data-justification="1" data-k="j84-toux">toux sèche (pourquoi elle est fréquente et rebelle)</button> touche la majorité des patients et altère fortement la qualité de vie.</p><p>Les antécédents orientent l’étiologie. Le médecin demande la chronologie des médicaments sur plusieurs années, le métier exercé depuis l’apprentissage, les loisirs (pigeons, perruches, duvet), l’humidité du logement, une radiothérapie, et une fibrose ou une cirrhose chez un parent. Il recherche aussi les <button class="w" data-justification="1" data-k="j84-signes-systemiques">signes de connectivite (phénomène de Raynaud, arthrites, faiblesse proximale, sécheresse)</button>, car ils réorientent le diagnostic vers une PID secondaire.</p><div class="two"><div class="card"><b>Forme typique de FPI.</b><p>Un homme de plus de 60 ans, ancien fumeur, décrit une dyspnée progressive et une toux sèche depuis plus de six mois, sans fièvre ni douleur articulaire. Il n’a pas d’exposition antigénique identifiée.</p></div><div class="card"><b>Formes trompeuses.</b><p>Une découverte fortuite sur un scanner coronarien ou abdominal révèle des anomalies interstitielles chez un patient asymptomatique. À l’opposé, une exacerbation aiguë inaugurale simule une pneumonie ou un œdème pulmonaire.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Traiter pendant des mois une « bronchite » ou un « asthme du sujet âgé » par inhalateurs, sans spirométrie ni auscultation attentive des bases. Le retard diagnostique moyen de la FPI se compte encore en années.</div><div class="key"><b>À retenir.</b> L’interrogatoire établit la durée, quantifie la dyspnée et dresse l’inventaire des causes. Il prépare l’examen, qui recherche des signes simples et très informatifs.</div></section>
<section class="ilot" id="j84-6"><h2><span class="n">6</span>Examiner pour reconnaître</h2><p>L’état général est souvent conservé au début. Le médecin mesure la fréquence respiratoire, la SpO₂ au repos puis après un effort simple, le poids et l’indice de masse corporelle, car l’amaigrissement est un facteur pronostique et un effet indésirable des antifibrosants.</p><div class="two"><div class="card"><b>Signes respiratoires.</b><p><button class="w" data-justification="1" data-k="j84-velcro">Crépitants fins, secs, télé-inspiratoires, prédominant aux bases (« velcro »)</button> : présents chez la grande majorité des patients atteints de FPI. Une <button class="w" data-justification="1" data-k="j84-desaturation">désaturation à l’effort (mécanisme et mesure)</button> peut précéder l’hypoxémie de repos.</p></div><div class="card"><b>Signes extrarespiratoires.</b><p><button class="w" data-justification="1" data-k="j84-hippocratisme">Hippocratisme digital (technique d’examen et signification)</button> chez une partie des patients. Les signes d’hypertension pulmonaire (éclat du deuxième bruit, œdèmes) traduisent une maladie évoluée. Sclérodactylie, papules de Gottron ou synovites orientent vers une connectivite.</p></div></div><p>Des crépitants bilatéraux chez un patient sans fièvre ni surcharge hydrique suffisent à justifier une tomodensitométrie (TDM) thoracique en haute résolution. Les sibilants, en revanche, sont rares dans la FPI ; ils doivent faire chercher une bronchiolite, une pneumopathie d’hypersensibilité ou une maladie bronchique associée.</p><div class="key"><b>À retenir.</b> Les crépitants « velcro » sont le signe d’appel le plus précoce et le plus rentable. Leur présence oriente vers l’imagerie ; un examen extrapulmonaire soigneux oriente vers la cause.</div><p class="src">Références : <a href="https://www.atsjournals.org/doi/10.1164/rccm.201807-1255ST" target="_blank" rel="noopener">Raghu et al., 2018</a> ; <a href="https://boris.unibe.ch/106600" target="_blank" rel="noopener">Funke-Chambour et al., position suisse sur la FPI, 2017</a>.</p><button class="pareto-btn ui" data-k="pareto-j84-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
