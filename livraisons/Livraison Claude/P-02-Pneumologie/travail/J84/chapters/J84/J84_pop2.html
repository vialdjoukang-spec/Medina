<template data-pop="j84-dmd" data-title="Discussion multidisciplinaire"><p class="lab">Définition et repères</p><p>La discussion multidisciplinaire réunit au minimum un pneumologue, un radiologue thoracique et, si un prélèvement existe, un pathologiste, tous expérimentés dans les PID. Un rhumatologue y participe dès qu’une connectivite est envisagée.</p><p class="lab">Mécanisme</p><p>Chaque discipline apporte une probabilité partielle. Leur intégration produit un diagnostic plus fiable et plus reproductible que chaque examen isolé, et décide si un prélèvement supplémentaire changerait la conclusion.</p><p class="lab">Conséquence clinique</p><p>La discussion formule un diagnostic de travail avec un niveau de confiance (certain, probable, peu probable), décide du traitement et fixe la date de réévaluation.</p><div class="key"><b>Limite.</b> Un diagnostic de travail reste révisable : l’apparition d’une connectivite ou d’une exposition peut le modifier pendant le suivi.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-lba" data-title="Lavage broncho-alvéolaire"><p class="lab">Définition et repères</p><p>Chez le non-fumeur, la formule normale comporte plus de 80 % de macrophages, moins de 15 % de lymphocytes, moins de 3 % de neutrophiles et moins de 1 % d’éosinophiles.</p><p class="lab">Mécanisme</p><p>Le liquide recueilli reflète la population cellulaire des alvéoles. Une alvéolite lymphocytaire traduit une réponse immunitaire active, comme dans la pneumopathie d’hypersensibilité, la sarcoïdose ou une réaction médicamenteuse.</p><p class="lab">Conséquence clinique</p><p>Une lymphocytose nette rend la FPI moins probable et oriente vers une cause ; une éosinophilie supérieure à 25 % oriente vers une pneumopathie à éosinophiles. Le lavage recherche aussi une infection et une hémorragie alvéolaire.</p><div class="key"><b>Limite.</b> Le lavage n’est pas utile lorsque la TDM montre un aspect UIP typique ; il est réservé aux cas indéterminés, sur décision de la discussion multidisciplinaire.</div></template>
<template data-pop="j84-biopsie" data-title="Cryobiopsie transbronchique et biopsie chirurgicale"><p class="lab">Définition et repères</p><p>La biopsie pulmonaire chirurgicale, par vidéothoracoscopie, prélève plusieurs lobes et reste la référence histologique. La cryobiopsie transbronchique prélève, par bronchoscopie, des fragments de quelques millimètres après congélation du tissu par une sonde.</p><p class="lab">Mécanisme</p><p>Le diagnostic d’UIP exige de voir l’hétérogénéité de la fibrose ; un fragment plus grand et plusieurs sites augmentent la probabilité de la montrer.</p><p class="lab">Conséquence clinique</p><p>La recommandation 2022 considère la cryobiopsie comme une alternative acceptable à la biopsie chirurgicale dans les centres expérimentés (recommandation conditionnelle, preuves de très faible qualité). Ses complications principales sont le pneumothorax et le saignement ; la chirurgie expose à une mortalité et à des exacerbations plus fréquentes chez les patients fragiles.</p><div class="key"><b>Limite.</b> Une biopsie n’est indiquée que si son résultat peut changer la décision ; elle est évitée en cas de DLCO très basse, d’hypertension pulmonaire ou de grande fragilité.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-cpfe" data-title="Association fibrose et emphysème"><p class="lab">Définition et repères</p><p>Ce syndrome associe un emphysème des sommets et une fibrose des bases, presque toujours chez un grand fumeur.</p><p class="lab">Mécanisme</p><p>L’emphysème augmente la compliance et les volumes ; la fibrose les diminue. Les deux effets s’annulent sur la spirométrie, mais tous deux détruisent la surface d’échange, d’où une DLCO effondrée.</p><p class="lab">Conséquence clinique</p><p>Les volumes peuvent paraître normaux chez un patient très dyspnéique. L’hypertension pulmonaire et le cancer bronchique y sont fréquents et pèsent sur le pronostic.</p><div class="key"><b>Piège.</b> Une spirométrie normale ne rassure pas devant une dyspnée importante chez un fumeur : la DLCO et la TDM révèlent la maladie.</div></template>
<template data-pop="j84-exacerbation" data-title="Exacerbation aiguë de la FPI"><p class="lab">Définition et repères</p><p>Selon Collard et collaborateurs (2016), elle associe une aggravation respiratoire en moins d’un mois, de nouvelles opacités bilatérales en verre dépoli ou condensations sur un fond d’UIP, et l’absence d’explication complète par une insuffisance cardiaque ou une surcharge hydrique. Elle est dite déclenchée si une cause est identifiée (infection, chirurgie, inhalation), idiopathique sinon.</p><p class="lab">Mécanisme</p><p>Une lésion alvéolaire diffuse aiguë, histologiquement proche du syndrome de détresse respiratoire aiguë, se superpose à la fibrose ; la réserve déjà réduite ne permet pas de la compenser.</p><p class="lab">Conséquence clinique</p><p>Le traitement associe oxygène, recherche et traitement des causes, soins de support et, selon une recommandation ancienne faible, des corticoïdes à forte dose. L’essai EXAFIP a montré que l’ajout de cyclophosphamide augmentait la mortalité à trois mois (45 % contre 31 %). Environ la moitié des patients hospitalisés décèdent selon les séries.</p><div class="key"><b>Limite.</b> L’efficacité des corticoïdes dans cette situation n’est pas démontrée par un essai randomisé ; leur usage repose sur un avis d’experts. Les antifibrosants, dans EXAFIP, étaient associés à un risque de décès plus faible, sans preuve causale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/27299520/" target="_blank" rel="noopener">Collard et al., 2016</a> ; <a href="https://doi.org/10.1016/S2213-2600(21)00354-4" target="_blank" rel="noopener">Naccache et al., EXAFIP, 2021</a>.</p></template>
<template data-pop="j84-htp" data-title="Hypertension pulmonaire des PID"><p class="lab">Définition et repères</p><p>L’hypertension pulmonaire associée aux PID appartient au groupe 3 de la classification (maladies pulmonaires et hypoxie). Elle est confirmée par cathétérisme cardiaque droit.</p><p class="lab">Mécanisme</p><p>La destruction du lit capillaire par la fibrose, la vasoconstriction hypoxique et le remodelage artériolaire augmentent les résistances vasculaires pulmonaires ; le ventricule droit se dilate.</p><p class="lab">Conséquence clinique</p><p>Elle est suspectée devant une dyspnée disproportionnée, une DLCO très basse, une désaturation marquée à l’effort, des peptides natriurétiques élevés ou une PAPs élevée à l’ETT. Elle aggrave le pronostic et intervient dans l’inscription en transplantation.</p><div class="key"><b>Limite.</b> Les traitements de l’HTAP du groupe 1 ne sont pas transposables ; certains sont nuisibles dans les PID. Leur usage relève d’un centre spécialisé.</div></template>
<template data-pop="j84-d-nintedanib" data-title="Nintédanib"><p class="lab">Mécanisme</p><p>Le nintédanib est un inhibiteur intracellulaire des tyrosine kinases des récepteurs VEGFR, FGFR et PDGFR. Il freine la prolifération, la migration et la différenciation des fibroblastes.</p><p class="lab">Preuves</p><p>Dans les essais INPULSIS (1066 patients, 52 semaines), le déclin annuel de la CVF était de 113,6 mL sous nintédanib contre 223,5 mL sous placebo. INBUILD a étendu le bénéfice aux fibroses progressives non idiopathiques, SENSCIS à la PID de la sclérodermie.</p><p class="lab">Posologie</p><p>150 mg deux fois par jour au cours d’un repas ; 100 mg deux fois par jour en cas d’intolérance ou d’atteinte hépatique Child-Pugh A.</p><p class="lab">Effets indésirables et contre-indications</p><p>Diarrhée chez environ deux patients sur trois dans les essais, nausées, perte d’appétit et de poids, élévation des transaminases, saignements, rares événements thromboemboliques artériels et perforations digestives. Contre-indications : grossesse, hypersensibilité à l’arachide ou au soja (excipient).</p><p class="lab">Surveillance</p><p>Transaminases et bilirubine avant le traitement, pendant le premier mois, puis régulièrement ; poids ; contraception très efficace jusqu’à trois mois après l’arrêt.</p><div class="key"><b>Limite.</b> La monographie suisse n’a pas pu être lue sur compendium.ch ; ces données proviennent du résumé européen et britannique révisé le 02.10.2025.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402584" target="_blank" rel="noopener">Richeldi et al., 2014</a> ; <a href="https://www.medicines.org.uk/emc/product/7705/smpc" target="_blank" rel="noopener">Ofev, résumé des caractéristiques</a>.</p></template>
<template data-pop="j84-d-pirfenidone" data-title="Pirfénidone"><p class="lab">Mécanisme</p><p>La pirfénidone réduit la production de TGF-β et de facteurs inflammatoires, diminue la synthèse de collagène par les fibroblastes et possède une activité antioxydante. Son mécanisme moléculaire précis reste incomplètement connu.</p><p class="lab">Preuves</p><p>Après les essais CAPACITY, dont un seul était positif, l’essai ASCEND (555 patients) a réduit de 47,9 % à 52 semaines la proportion de patients ayant perdu au moins 10 % de CVF prédite ou décédés.</p><p class="lab">Posologie</p><p>Titration sur deux semaines jusqu’à 801 mg trois fois par jour (2403 mg par jour), toujours au cours des repas.</p><p class="lab">Effets indésirables et contre-indications</p><p>Nausées, dyspepsie, anorexie, photosensibilité et éruption cutanée, élévation des transaminases. Contre-indications : fluvoxamine, insuffisance hépatique sévère, insuffisance rénale sévère, antécédent d’angio-œdème sous pirfénidone.</p><p class="lab">Surveillance</p><p>Bilan hépatique avant le traitement, chaque mois pendant six mois puis tous les trois mois ; protection solaire ; arrêt du tabac, qui réduit l’exposition au médicament.</p><div class="key"><b>Limite.</b> Dans les fibroses progressives non idiopathiques, la recommandation 2022 n’a pas tranché pour la pirfénidone ; la recommandation ERS/EULAR 2025 la propose dans la PID rhumatoïde d’aspect UIP.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1402582" target="_blank" rel="noopener">King et al., 2014</a> ; <a href="https://www.medicines.org.uk/emc/product/7939/smpc" target="_blank" rel="noopener">Esbriet, résumé des caractéristiques</a>.</p></template>
<template data-pop="j84-d-nerandomilast" data-title="Nérandomilast"><p class="lab">Mécanisme</p><p>Le nérandomilast inhibe préférentiellement la PDE4B. L’augmentation de l’AMPc qui en résulte freine la transformation des fibroblastes en myofibroblastes et la libération de cytokines inflammatoires.</p><p class="lab">Preuves</p><p>FIBRONEER-IPF (1177 patients, 77,7 % sous antifibrosant) : déclin de la CVF à 52 semaines de 114,7 mL sous 18 mg deux fois par jour contre 183,5 mL sous placebo, soit 68,8 mL de différence. FIBRONEER-ILD (1176 patients atteints de FPP) : 98,6 mL contre 165,8 mL, soit 67,2 mL de différence. La diarrhée était l’effet le plus fréquent.</p><p class="lab">Posologie et statut</p><p>18 mg deux fois par jour ; 9 mg deux fois par jour en cas d’intolérance, sauf en association avec la pirfénidone selon l’étiquetage américain. Autorisé par la FDA en octobre 2025 pour la FPI, par la Commission européenne en juillet 2026 pour la FPI et la FPP.</p><div class="key"><b>Limite.</b> Aucune autorisation Swissmedic n’a pu être confirmée au 08.10.2026 ; la monographie suisse n’était pas accessible. Le critère secondaire principal de mortalité ou d’événements respiratoires n’a pas été atteint dans les deux essais.</div><p class="src">Références : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa2414108" target="_blank" rel="noopener">Richeldi et al., 2025</a> ; <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa2503643" target="_blank" rel="noopener">Maher et al., 2025</a> ; <a href="https://www.fda.gov/drugs/news-events-human-drugs/fda-approves-drug-treat-idiopathic-pulmonary-fibrosis" target="_blank" rel="noopener">FDA, 2025</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/jascayd" target="_blank" rel="noopener">EMA, Jascayd</a>.</p></template>
<template data-pop="j84-oxygene" data-title="Oxygénothérapie dans les PID"><p class="lab">Définition et repères</p><p>L’oxygénothérapie de longue durée est indiquée lorsque la PaO₂ de repos est inférieure ou égale à 7,3 kPa, ou à 8,0 kPa en présence d’un cœur pulmonaire ou d’une polyglobulie, selon les critères usuels établis dans la BPCO et appliqués aux PID.</p><p class="lab">Mécanisme</p><p>L’oxygène augmente la pression partielle alvéolaire, donc le gradient qui pousse l’oxygène à travers une membrane épaissie ; il réduit aussi la vasoconstriction hypoxique.</p><p class="lab">Conséquence clinique</p><p>L’oxygène d’effort améliore la qualité de vie et la dyspnée chez les patients qui désaturent à la marche, selon un essai randomisé britannique (Visca, 2018).</p><div class="key"><b>Limite.</b> Aucun essai n’a démontré de bénéfice de survie de l’oxygène dans les PID ; les critères de prescription sont extrapolés de la BPCO.</div></template>
<template data-pop="j84-rehabilitation" data-title="Réhabilitation respiratoire"><p class="lab">Définition et repères</p><p>Programme supervisé de huit à douze semaines associant entraînement à l’endurance et à la force, éducation et soutien psychologique.</p><p class="lab">Mécanisme</p><p>L’entraînement améliore l’extraction musculaire de l’oxygène et diminue la ventilation nécessaire pour un même effort ; il réduit la peur de l’essoufflement.</p><p class="lab">Conséquence clinique</p><p>La revue Cochrane de 2021 montre une augmentation de la distance de marche d’environ 40 m et une amélioration de la dyspnée et de la qualité de vie dans les PID.</p><div class="key"><b>Limite.</b> Le bénéfice s’atténue en quelques mois sans poursuite de l’activité ; l’oxygène d’effort est adapté pendant les séances.</div></template>
<template data-pop="j84-a-eviter" data-title="Traitements à éviter dans la FPI"><p class="lab">Définition et repères</p><p>Plusieurs traitements ont été évalués par essais randomisés et rejetés : corticoïdes au long cours avec azathioprine et N-acétylcystéine (PANTHER-IPF), warfarine (ACE-IPF), ambrisentan, ainsi que les antiacides et la chirurgie antireflux à visée respiratoire.</p><p class="lab">Mécanisme</p><p>L’immunosuppression favorise les infections sans freiner la fibrose ; l’anticoagulation n’agit pas sur la fibrogenèse et expose au saignement.</p><p class="lab">Conséquence clinique</p><p>L’essai ACE-IPF a été interrompu pour surmortalité sous warfarine. Une anticoagulation reste prescrite pour ses indications propres (fibrillation atriale, thrombose).</p><div class="key"><b>Limite.</b> Le reflux gastro-œsophagien symptomatique se traite pour lui-même ; seule la prescription dans le but d’améliorer la fonction respiratoire est déconseillée.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/22607134/" target="_blank" rel="noopener">Raghu et al., 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022</a>.</p></template>
<template data-pop="j84-transplantation" data-title="Transplantation pulmonaire : critères ISHLT 2021"><p class="lab">Définition et repères</p><p>Le consensus ISHLT 2021 distingue l’orientation vers un centre et l’inscription sur liste.</p><table class="t"><tr><th>Étape</th><th>Critères pour une PID fibrosante</th></tr><tr><td>Orientation</td><td>Aspect UIP ou PINS fibrosante quel que soit le niveau fonctionnel ; CVF inférieure à 80 % ou DLCO inférieure à 40 % ; déclin significatif de la CVF ou de la DLCO ; besoin d’oxygène</td></tr><tr><td>Inscription</td><td>Déclin de CVF d’au moins 10 % ou de DLCO d’au moins 10 % en six mois ; SpO₂ inférieure à 88 % ou distance inférieure à 250 m au test de marche ; hypertension pulmonaire ; hospitalisation pour exacerbation, pneumothorax ou déclin respiratoire</td></tr></table><p class="lab">Mécanisme</p><p>Le remplacement du poumon fibreux supprime le défaut d’échange gazeux ; l’immunosuppression à vie expose aux infections, au rejet chronique et aux cancers.</p><p class="lab">Conséquence clinique</p><p>L’évaluation prend des mois ; une orientation précoce évite qu’une exacerbation rende le patient inéligible. En Suisse, les transplantations pulmonaires sont réalisées dans des centres universitaires.</p><div class="key"><b>Limite.</b> L’âge biologique, les comorbidités, la fragilité et les télomèropathies modifient l’éligibilité ; la décision appartient au centre.</div><p class="src">Référence : <a href="https://doi.org/10.1016/j.healun.2021.07.005" target="_blank" rel="noopener">Leard et al., consensus ISHLT, 2021</a>.</p></template>
<template data-pop="j84-pins" data-title="Pneumopathie interstitielle non spécifique"><p class="lab">Définition et repères</p><p>La PINS se caractérise par une atteinte interstitielle homogène dans le temps, cellulaire ou fibrosante. En TDM, elle donne un verre dépoli et des réticulations basales, symétriques, souvent avec une épargne de la région immédiatement sous-pleurale.</p><p class="lab">Mécanisme</p><p>Une agression unique ou continue, souvent auto-immune, produit une inflammation de toutes les parois au même stade ; la fibrose apparaît secondairement.</p><p class="lab">Conséquence clinique</p><p>La PINS impose de rechercher une connectivite, une pneumopathie d’hypersensibilité ou un médicament. La forme cellulaire répond bien aux corticoïdes et aux immunosuppresseurs ; la forme fibrosante répond moins et peut évoluer en FPP.</p><div class="key"><b>Limite.</b> La PINS idiopathique est un diagnostic rare, retenu seulement après discussion multidisciplinaire et suivi.</div></template>
<template data-pop="j84-fpp" data-title="Fibrose pulmonaire progressive : critères 2022"><p class="lab">Définition et repères</p><p>Chez un patient atteint d’une PID fibrosante autre que la FPI, au moins deux des trois critères suivants au cours de l’année écoulée, sans autre explication.</p><table class="t"><tr><th>Domaine</th><th>Critère</th></tr><tr><td>Symptômes</td><td>Aggravation des symptômes respiratoires</td></tr><tr><td>Fonction</td><td>Baisse absolue de la CVF d’au moins 5 % de la valeur prédite, ou de la DLCO corrigée pour l’hémoglobine d’au moins 10 %</td></tr><tr><td>Imagerie</td><td>Majoration des bronchiectasies de traction, nouveau verre dépoli avec bronchiectasies de traction, nouvelles réticulations fines, réticulations plus étendues ou plus grossières, rayon de miel nouveau ou étendu, perte de volume lobaire accrue</td></tr></table><p class="lab">Mécanisme</p><p>Ces maladies partagent, au-delà de leur cause, une voie finale de fibrogenèse autonome comparable à celle de la FPI.</p><p class="lab">Conséquence clinique</p><p>La FPP justifie un antifibrosant (recommandation conditionnelle pour le nintédanib) en plus du traitement de la cause.</p><div class="key"><b>Limite.</b> La FPP n’est pas un diagnostic mais un comportement évolutif ; une insuffisance cardiaque, une infection ou une embolie doivent être exclues avant de la retenir.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9851481/" target="_blank" rel="noopener">Raghu et al., 2022, tableau 4</a>.</p></template>
<template data-pop="j84-inbuild" data-title="Essai INBUILD"><p class="lab">Définition et repères</p><p>Essai randomisé de 663 patients atteints de PID fibrosante progressive autre que la FPI : pneumopathie d’hypersensibilité, connectivites, PINS, PID inclassables, notamment.</p><p class="lab">Résultat</p><p>Le déclin annuel de la CVF était de 80,8 mL sous nintédanib contre 187,8 mL sous placebo. Le bénéfice était comparable chez les patients avec ou sans aspect UIP.</p><p class="lab">Conséquence clinique</p><p>Il a fondé le concept de phénotype fibrosant progressif et l’indication du nintédanib dans la FPP.</p><div class="key"><b>Limite.</b> Les critères de progression d’INBUILD diffèrent légèrement de la définition de 2022 ; la décision individuelle reste prise en discussion multidisciplinaire.</div><p class="src">Référence : <a href="https://www.nejm.org/doi/full/10.1056/NEJMoa1908681" target="_blank" rel="noopener">Flaherty et al., 2019</a>.</p></template>
<template data-pop="j84-gap" data-title="Indice GAP"><p class="lab">Définition et repères</p><p>L’indice attribue des points au sexe (homme 1), à l’âge (61 à 65 ans 1, plus de 65 ans 2), à la CVF (50 à 75 % 1, moins de 50 % 2) et à la DLCO (36 à 55 % 1, 35 % ou moins 2, mesure impossible 3). Stade I : 0 à 3 points ; stade II : 4 à 5 ; stade III : 6 à 8.</p><p class="lab">Mécanisme</p><p>Il combine l’âge et la sévérité fonctionnelle, deux déterminants indépendants de la mortalité.</p><p class="lab">Conséquence clinique</p><p>Mortalité à un an : 5,6 %, 16,2 % et 39,2 % aux stades I, II et III. Exemple : un homme de 72 ans avec une CVF à 65 % et une DLCO à 40 % totalise 1 + 2 + 1 + 1 = 5 points, stade II.</p><div class="key"><b>Limite.</b> L’indice a été établi avant les antifibrosants et sur des cohortes nord-américaines ; il décrit des groupes, pas un individu.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/22586007/" target="_blank" rel="noopener">Ley et al., 2012</a>.</p></template>
<template data-pop="j84-immunosuppresseurs" data-title="Immunosuppresseurs dans les PID inflammatoires"><p class="lab">Mécanisme</p><p>Le mycophénolate inhibe la synthèse des purines dans les lymphocytes ; le rituximab détruit les lymphocytes B porteurs de CD20 ; le cyclophosphamide est un agent alkylant ; le tocilizumab bloque le récepteur de l’IL-6.</p><p class="lab">Place</p><p>La recommandation ERS/EULAR 2025 les propose selon la connectivite : mycophénolate, éventuellement associé au nintédanib, dans la sclérodermie ; associations immunosuppressives avec glucocorticoïdes dans les myopathies inflammatoires ; immunosuppresseur avec nintédanib en cas de progression.</p><p class="lab">Surveillance</p><p>Numération sanguine, fonction hépatique, prévention des infections (vaccinations, prophylaxie de la pneumocystose selon le schéma), contraception pour les molécules tératogènes.</p><div class="key"><b>Limite.</b> Ces molécules sont nuisibles dans la FPI ; leur prescription exige un diagnostic de PID inflammatoire posé en discussion multidisciplinaire.</div><p class="src">Référence : <a href="https://doi.org/10.1016/j.ard.2025.08.021" target="_blank" rel="noopener">Antoniou et al., ERS/EULAR 2025</a>.</p></template>
<template data-pop="j84-corticoides" data-title="Glucocorticoïdes dans les PID"><p class="lab">Mécanisme</p><p>Les glucocorticoïdes inhibent la transcription des cytokines inflammatoires et le recrutement des lymphocytes ; ils n’agissent pas sur la fibrogenèse établie.</p><p class="lab">Place</p><p>Ils sont efficaces dans la pneumopathie organisée, la PINS cellulaire, certaines pneumopathies médicamenteuses et d’hypersensibilité, et sont utilisés à forte dose dans l’exacerbation aiguë de FPI selon un avis d’experts.</p><p class="lab">Effets indésirables</p><p>Diabète, ostéoporose, myopathie, infections, troubles de l’humeur ; une prévention de l’ostéoporose accompagne tout traitement prolongé.</p><div class="key"><b>Limite.</b> Dans la FPI, la corticothérapie au long cours est proscrite depuis PANTHER-IPF.</div></template>
<template data-pop="j84-interactions" data-title="Interactions des antifibrosants"><p class="lab">Pirfénidone</p><p>Métabolisée surtout par le CYP1A2. La fluvoxamine multiplie environ par quatre l’exposition : association contre-indiquée. La ciprofloxacine impose de réduire la pirfénidone à 534 mg trois fois par jour selon le résumé européen. Le tabac, inducteur du CYP1A2, réduit l’exposition : l’arrêt est encouragé et la dose n’est pas augmentée.</p><p class="lab">Nintédanib</p><p>Substrat de la glycoprotéine P. Les inhibiteurs puissants (kétoconazole, érythromycine, ciclosporine) augmentent son exposition : surveillance de la tolérance. Les inducteurs (rifampicine, carbamazépine, phénytoïne, millepertuis) la diminuent : alternative à rechercher. Les anticoagulants majorent le risque hémorragique.</p><p class="lab">Conséquence clinique</p><p>Chaque nouvelle prescription chez un patient sous antifibrosant est vérifiée ; une diarrhée ou des vomissements réduisent l’efficacité d’une contraception orale.</p><div class="key"><b>Limite.</b> Les interactions du nérandomilast sont décrites dans sa monographie, non accessible en version suisse à la date de rédaction.</div><p class="src">Références : <a href="https://www.medicines.org.uk/emc/product/7939/smpc" target="_blank" rel="noopener">Esbriet</a> ; <a href="https://www.medicines.org.uk/emc/product/7705/smpc" target="_blank" rel="noopener">Ofev</a>.</p></template>
<template data-pop="pareto-j84-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j84-0,j84-1,j84-2,j84-3,j84-4,j84-5,j84-6"></p><ul><li>Une PID atteint la paroi alvéolaire : dyspnée d’effort, toux sèche, trouble restrictif et DLCO basse.</li><li>La FPI est une fibrose chronique de cause inconnue, après 60 ans, avec aspect UIP ; diagnostic d’exclusion.</li><li>Sans traitement, la CVF baisse d’environ 200 mL par an ; l’évolution est hétérogène et ponctuée d’exacerbations.</li><li>Le mécanisme est une réparation aberrante de micro-lésions épithéliales, non une inflammation ; MUC5B et télomères prédisposent.</li><li>Rechercher médicaments, expositions, antigènes et connectivite avant de conclure.</li><li>Crépitants « velcro » des bases, hippocratisme et désaturation d’effort sont les signes clés.</li></ul></template>
<template data-pop="pareto-j84-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j84-7"></p><ul><li>TDM en haute résolution : UIP, UIP probable, indéterminée, alternative.</li><li>Aspect UIP ou UIP probable compatible, sans cause : FPI sans biopsie après discussion multidisciplinaire.</li><li>Lavage et biopsie seulement si leur résultat peut changer la décision.</li><li>Éliminer d’abord insuffisance cardiaque, infection, lymphangite et hémorragie alvéolaire.</li><li>UIP ne signifie pas FPI : polyarthrite rhumatoïde, hypersensibilité et asbestose l’imitent.</li></ul></template>
<template data-pop="pareto-j84-tt" data-title="Pareto — Urgences et traitements"><p class="ratio" data-cover="j84-8,j84-9,j84-10"></p><ul><li>Exacerbation aiguë : aggravation en moins d’un mois avec opacités nouvelles ; mortalité hospitalière proche de la moitié.</li><li>Antifibrosant dès le diagnostic de FPI : nintédanib ou pirfénidone ; nérandomilast autorisé aux États-Unis et dans l’Union européenne.</li><li>Oxygène, réhabilitation, vaccinations, arrêt du tabac, orientation précoce vers la transplantation.</li><li>Aucun corticoïde au long cours, aucune triple association, aucune warfarine sans indication.</li><li>Hors FPI : traiter la cause ; si progression (deux critères sur trois en un an), ajouter un antifibrosant.</li></ul></template>
<template data-pop="pareto-j84-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j84-11,j84-12,j84-13"></p><ul><li>CVF, DLCO et test de marche tous les trois à six mois ; une baisse de 5 à 10 % de CVF signale une progression.</li><li>Indice GAP : mortalité à un an de 5,6 %, 16,2 % et 39,2 %.</li><li>Soins palliatifs précoces et directives anticipées avant toute exacerbation.</li><li>Nintédanib contre-indiqué pendant la grossesse ; adaptation hépatique et rénale des antifibrosants.</li><li>FPI : exclusion des causes et aspect UIP, ou UIP probable compatible, ou concordance avec l’histologie.</li></ul></template>
<template data-pop="pareto-j84-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j84-e-1,j84-e-2,j84-e-3"></p><ul><li>Standard diagnostique : discussion multidisciplinaire ; référence lésionnelle : biopsie chirurgicale.</li><li>TDM en haute résolution avec coupes en expiration et en décubitus ventral.</li><li>Trouble restrictif, rapport VEMS/CVF normal, DLCO précocement abaissée ; piège de l’emphysème associé.</li><li>Sérologie : anticorps antinucléaires, facteur rhumatoïde, anti-CCP, panel de myosite selon la clinique.</li><li>Le contexte tranche entre FPI, connectivite, hypersensibilité et asbestose devant un même aspect.</li></ul></template>
<template data-pop="pareto-j84-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j84-p-1,j84-p-2,j84-p-3,j84-p-4"></p><ul><li>Phénotype fibrosant : antifibrosant ; phénotype inflammatoire : immunosuppresseur ; souvent les deux.</li><li>Nintédanib 150 mg deux fois par jour ; pirfénidone 801 mg trois fois par jour après titration ; au cours des repas.</li><li>Fluvoxamine contre-indiquée avec la pirfénidone ; glycoprotéine P et anticoagulants avec le nintédanib.</li><li>Surveiller transaminases, poids et tolérance digestive ; réduire plutôt qu’arrêter.</li><li>Éviter corticoïdes au long cours, triple association, warfarine et cyclophosphamide dans l’exacerbation.</li></ul></template>
