<template data-pop="r05-reflexe" data-title="Le réflexe de toux"><p class="lab">Définition</p><p>La toux est un réflexe vagal de protection : une inspiration, une brève expiration contre la glotte fermée, puis une expiration forcée glotte ouverte. Le débit élevé de cette dernière phase dégage les voies aériennes.</p><p class="lab">Mécanisme</p><p>Des terminaisons vagales du larynx et des voies aériennes de conduction détectent un stimulus nocif. Le message gagne le tronc cérébral, qui déclenche la séquence motrice ; le cortex peut la moduler, la déclencher volontairement ou la réprimer.</p><p class="lab">Conséquence clinique</p><p>Un patient dont le réflexe est affaibli, après une atteinte neurologique par exemple, fait des inhalations récidivantes souvent prises pour des « infections bronchiques ».</p><div class="key"><b>Limite.</b> Le réflexe utile ne doit pas être aboli : le traitement vise une sensibilité normale, non le silence.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., 2020</a>.</p></template>
<template data-pop="r05-hypersensibilite" data-title="Syndrome d’hypersensibilité de la toux"><p class="lab">Définition</p><p>Toux gênante déclenchée par des stimuli thermiques, mécaniques ou chimiques de faible intensité, qui ne font pas tousser le sujet sain. Un groupe de travail de l’ERS a validé ce concept en 2014 auprès de 44 experts ; l’ERS l’a adopté en 2020 comme diagnostic englobant de la toux chronique de l’adulte.</p><p class="lab">Mécanisme</p><p>Le réflexe est sensibilisé en périphérie, par l’inflammation, et au centre, par une amplification dans le tronc cérébral et une moindre inhibition corticale. La Société allemande de pneumologie le décrit comme une neuropathie du réflexe, à l’image de l’hyperalgésie dans la douleur.</p><p class="lab">Conséquence clinique</p><p>Les phénotypes asthmatique, rhinitique et de reflux deviennent des déclencheurs d’un même réflexe hypersensible ; lorsqu’aucun déclencheur ne reste, la toux est traitée comme une maladie du réflexe.</p><div class="key"><b>Limite.</b> L’hypersensibilité n’a pas de test diagnostique de routine ; le test à la capsaïcine reste un outil de recherche.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25142479/" target="_blank" rel="noopener">Morice et al., Eur Respir J 2014</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 6</a>.</p></template>
<template data-pop="r05-iec" data-title="Toux des inhibiteurs de l’enzyme de conversion"><p class="lab">Fréquence</p><p>L’ERS et les HUG estiment qu’environ 15 % des patients sous IEC toussent ; la Société allemande de pneumologie cite environ 10 % des femmes et 5 % des hommes. L’effet ne dépend pas de la dose.</p><p class="lab">Mécanisme</p><p>L’IEC empêche la dégradation de la bradykinine, qui sensibilise les récepteurs de la toux. Il s’agit d’un effet de classe : la réintroduction de n’importe quel IEC fait réapparaître la toux.</p><p class="lab">Chronologie</p><p>La toux apparaît en général dans la semaine suivant l’introduction, parfois jusqu’à six mois plus tard, parfois avec un prurit pharyngé. Après l’arrêt, elle peut persister un à trois mois, car le réflexe reste sensibilisé.</p><p class="lab">Conduite</p><p>Le médecin remplace l’IEC par une autre classe ; les antagonistes des récepteurs de l’angiotensine II n’agissent pas sur le réflexe. La Société allemande de pneumologie poursuit le bilan si la toux persiste plus de trois semaines après le changement.</p><div class="key"><b>Limite.</b> Le délai de guérison étant long, l’absence d’amélioration à trois semaines ne réhabilite pas l’IEC ; elle impose seulement de chercher d’autres causes en parallèle.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.12</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 10</a>.</p></template>
<template data-pop="r05-productive" data-title="Toux productive ou sèche"><p class="lab">Définition</p><p>La toux est productive lorsque l’expectoration atteint 5 à 30 mL par 24 heures ou davantage, soit d’une cuillère à café à deux cuillères à soupe.</p><p class="lab">Valeur d’orientation</p><p>Plus de 30 mL par jour font fortement suspecter une infection chronique ou des bronchiectasies ; 5 à 30 mL doivent les faire envisager ; moins de 5 mL rendent d’autres causes plus probables. L’aspect oriente aussi : muqueux dans la bronchite du fumeur, séreux et mousseux dans l’œdème pulmonaire, purulent dans une exacerbation, des bronchiectasies ou une bronchite à éosinophiles, sanglant dans un cancer ou des bronchiectasies, moulé dans l’aspergillose bronchopulmonaire allergique.</p><div class="key"><b>Piège.</b> L’envie de tousser est souvent ressentie comme un « encombrement » sans expectoration réelle. Le médecin fait décrire et quantifier ce qui est craché.</div><p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 1 et 6</a>.</p></template>
<template data-pop="r05-allotussie" data-title="Allotussie et hypertussie"><p class="lab">Définitions</p><p>L’allotussie est la toux déclenchée par un stimulus qui ne fait normalement pas tousser : odeur, rire, chant, parole, changement de température. L’hypertussie est une réponse exagérée à un stimulus normalement tussigène.</p><p class="lab">Déclencheurs les plus fréquents</p><p>Changements de température, téléphone et parole prolongée, rire, parfums, repas, position couchée, poussières, fumées et vapeurs.</p><p class="lab">Mécanisme</p><p>Ces termes transposent l’allodynie et l’hyperalgésie de la douleur : le seuil d’activation du réflexe est abaissé.</p><div class="key"><b>Conséquence pratique.</b> Une toux déclenchée par la parole ou les parfums oriente vers une hypersensibilité, mais n’exclut pas un trait traitable associé.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.1</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, encadré 4</a>.</p></template>
<template data-pop="r05-incontinence" data-title="Incontinence urinaire et autres conséquences"><p class="lab">Fréquence</p><p>L’incontinence urinaire d’effort et les troubles de la parole et de l’humeur pèsent le plus sur la qualité de vie. L’incontinence est sévère chez un quart des patientes concernées, mais elle est rarement évoquée spontanément.</p><p class="lab">Mécanisme</p><p>Chaque quinte élève brutalement la pression abdominale ; elle dépasse la résistance du sphincter urinaire, surtout chez la femme.</p><div class="key"><b>Conséquence pratique.</b> Le médecin pose la question à chaque patiente qui tousse. Un essai clinique du géfapixant a d’ailleurs été mené chez des femmes souffrant d’incontinence d’effort provoquée par la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, retentissement</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Lyfnua®</a>.</p></template>
<template data-pop="r05-syncope" data-title="Syncope de toux et troubles conductifs"><p class="lab">Données</p><p>La toux peut déclencher, probablement par une forte stimulation vagale, un bloc auriculo-ventriculaire du deuxième ou du troisième degré ; le bloc complet est discuté comme l’un des mécanismes de la syncope de toux. À l’inverse, une bradycardie par bloc de haut degré réduit le débit cardiaque, provoque une stase et peut faire tousser.</p><div class="key"><b>Conséquence pratique.</b> Une syncope pendant les quintes justifie un ECG et une évaluation du risque de conduite automobile.</div><div class="key"><b>Lacune.</b> Les sources lues ne chiffrent pas la fréquence de la syncope de toux.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 2</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 3</a>.</p></template>
<template data-pop="r05-atp" data-title="Sensibilisation périphérique des terminaisons vagales"><p class="lab">Mécanisme</p><p>Une cellule agressée libère de l’ATP ; l’inflammation libère aussi des protons, des prostaglandines, des cytokines et des facteurs neurotrophiques. Ces médiateurs activent leurs récepteurs sur les fibres vagales, déclenchent des potentiels d’action ou abaissent le seuil d’activation par d’autres stimuli.</p><p class="lab">Arguments chez l’homme</p><p>L’inhalation de prostaglandines sensibilise la toux provoquée par la capsaïcine chez le volontaire sain. Les patients atteints de toux réfractaire toussent davantage que les témoins après inhalation d’ATP.</p><div class="key"><b>Conséquence pratique.</b> Traiter l’inflammation (éosinophilique, reflux) réduit la sensibilisation ; bloquer le récepteur de l’ATP réduit la toux réfractaire.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., J Thorac Dis 2020</a>.</p></template>
<template data-pop="r05-reflux" data-title="Toux et reflux gastro-œsophagien"><p class="lab">Deux théories</p><p>Selon la théorie du reflux, le contenu gastrique remonte jusqu’au pharynx et aux voies aériennes. Selon la théorie du réflexe, le reflux distal stimule le réflexe de toux depuis l’œsophage. Chez l’adulte, les données soutiennent plutôt la seconde, et le volume du liquide refluant compte davantage que son acidité.</p><p class="lab">Données</p><p>Reflux et toux chronique coexistent plus souvent que par hasard, mais ni la chronologie ni un gradient de sévérité ne prouvent la causalité. Les troubles de la motricité œsophagienne sont fréquents chez le patient qui tousse. Le reflux non acide, liquide ou gazeux, est suspecté, sans technique qui le détecte de façon fiable.</p><p class="lab">Conséquence pratique</p><p>Les inhibiteurs de la pompe à protons réduisent l’acidité, non le reflux : ils n’aident que le patient qui a un reflux acide symptomatique. Le diagnostic repose sur l’anamnèse, aidée du questionnaire de Hull.</p><div class="key"><b>Limite.</b> La toux elle-même peut provoquer du reflux ; l’association ne dit pas le sens de la causalité.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-cva" data-title="Asthme à forme de toux"><p class="lab">Définition</p><p>Forme d’asthme dont la toux est la seule manifestation. Le test à la méthacholine est positif par définition ; la spirométrie et les variations du débit de pointe peuvent rester normales.</p><p class="lab">Place dans le spectre</p><p>L’ERS distingue trois formes de toux asthmatique : l’asthme classique, avec variabilité et hyperréactivité ; l’asthme à forme de toux ; la bronchite à éosinophiles, sans hyperréactivité. Les trois peuvent répondre au traitement anti-inflammatoire.</p><p class="lab">Évolution</p><p>Environ 30 à 40 % des patients développent ensuite un asthme classique (Société allemande de pneumologie).</p><p class="lab">Indices</p><p>Toux nocturne ou après l’effort, atopie, antécédents familiaux, variation saisonnière, éosinophilie ou FeNO élevé.</p><div class="key"><b>Conduite.</b> Le traitement suit celui de l’asthme, avec vérification de la technique d’inhalation ; voir le cours J45 — Asthme.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.3 et 6.3</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 9</a>.</p></template>
<template data-pop="r05-eb" data-title="Bronchite à éosinophiles non asthmatique"><p class="lab">Définition</p><p>Toux chronique avec éosinophilie de l’expectoration, sans dyspnée, sans obstruction et sans hyperréactivité bronchique. Plus de 3 % d’éosinophiles dans l’expectoration induite sans hyperréactivité la définissent ; le FeNO est en général élevé.</p><p class="lab">Fréquence</p><p>Jusqu’à 13 % des patients des consultations spécialisées de la toux (ERS).</p><p class="lab">Évolution</p><p>Elle récidive souvent, coexiste avec la BPCO, les pneumopathies d’exposition et les bronchiectasies, et peut évoluer vers un asthme.</p><div class="key"><b>Conduite.</b> Corticoïde inhalé ; corticoïde oral ou antileucotriène en cas de résistance au traitement inhalé. La dose et la durée optimales ne font pas consensus.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.4 et 6.4</a>.</p></template>
<template data-pop="r05-tabac" data-title="Tabac et réflexe de toux"><p class="lab">Données</p><p>Le tabac est la première cause évitable de toux chronique ; l’exposition cumulée et la consommation actuelle prédisent la fréquence objective de la toux. Paradoxalement, les fumeurs sains ont un réflexe moins sensible à la capsaïcine, et une dose de nicotine équivalente à une cigarette, délivrée par cigarette électronique, déprime ce réflexe.</p><p class="lab">Conséquence clinique</p><p>Au cours du premier mois de sevrage, la toux augmente souvent transitoirement, car l’inhibition par la nicotine disparaît. Prévenu, le patient interprète ce phénomène correctement et poursuit son sevrage.</p><div class="key"><b>Conduite.</b> Chaque fumeur qui tousse reçoit une aide au sevrage ; l’ERS évoque la cigarette électronique pour celui qui ne peut arrêter à cause de la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.7</a>.</p></template>
<template data-pop="r05-postinfectieux" data-title="Toux post-infectieuse"><p class="lab">Définition</p><p>Toux qui persiste plus de trois semaines après une infection respiratoire aiguë, en général moins de huit semaines, et guérit spontanément. Une toux sèche peut toutefois durer jusqu’à trois mois après une infection banale des voies aériennes supérieures.</p><p class="lab">Mécanisme</p><p>L’infection peut induire une hyperréactivité bronchique transitoire, souvent avec éosinophilie, sans autre signe d’asthme.</p><p class="lab">Conduite</p><p>Le diagnostic repose sur l’histoire et l’exclusion des autres causes. Un corticoïde inhalé, éventuellement associé à un bronchodilatateur de longue durée d’action, pendant 10 à 14 jours, peut en raccourcir la durée ; la coqueluche, elle, n’y répond pas.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 2.b</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.13</a>.</p></template>
<template data-pop="r05-coqueluche" data-title="Coqueluche et toux prolongée"><p class="lab">Situation</p><p>L’OFSP observe une augmentation des cas en Suisse depuis janvier 2024. La coqueluche est une infection bactérienne très contagieuse, transmise par gouttelettes, responsable d’une toux violente et prolongée, parfois de plus de huit semaines.</p><p class="lab">Présentation</p><p>L’enfant non vacciné fait des quintes en staccato. Le nourrisson fait plutôt une détresse respiratoire ou des apnées que des quintes. Chez l’adulte asthmatique ou atteint de BPCO, environ un cas sur dix se complique.</p><p class="lab">Diagnostic et traitement</p><p>Une PCR ou une culture est demandée en cas de suspicion. Le macrolide n’agit sur la maladie que pendant la phase catarrhale ; il réduit cependant la contagiosité, qui cesse en général après cinq jours de traitement, contre jusqu’à 21 jours sans traitement.</p><div class="key"><b>Prévention.</b> Une dose de vaccin à chaque grossesse protège le nouveau-né ; les proches et le personnel en contact avec des nourrissons de moins de six mois mettent leur vaccination à jour.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/coqueluche-la-vaccination-protege-les-nourrissons-dune-evolution-grave" target="_blank" rel="noopener">OFSP, coqueluche, consulté le 09.10.2026</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025</a>.</p></template>
<template data-pop="r05-postcovid" data-title="Toux après COVID-19"><p class="lab">Données</p><p>Avec la souche initiale, environ 86 % des patients toussaient pendant l’infection aiguë ; 50 % toussaient encore à trois semaines. Environ 23 % rapportent une toux chronique. Dans une cohorte américaine, environ un tiers des patients toussaient encore six mois après l’infection, avant comme pendant la période Omicron.</p><p class="lab">Mécanismes</p><p>La toux chronique peut traduire une hypersensibilité post-infectieuse ou une pneumopathie interstitielle séquellaire.</p><div class="key"><b>Conduite.</b> Aucun traitement n’est autorisé pour cette toux ; un traitement analogue à celui de la toux réfractaire aide environ 30 % des patients, et la toux peut guérir après plusieurs mois.</div><p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 5</a>.</p></template>
<template data-pop="r05-voies-sup" data-title="Syndrome de toux des voies aériennes supérieures"><p class="lab">Définition</p><p>Toux chronique attribuée à une rhinite allergique ou non allergique ou à une rhinosinusite chronique ; ce terme remplace celui de « rhinorrhée postérieure ». La rhinosinusite chronique associe au moins deux symptômes pendant plus de 12 semaines (obstruction nasale, écoulement antérieur ou postérieur, douleur faciale, trouble de l’odorat), confirmés par l’endoscopie ou l’imagerie.</p><p class="lab">Mécanisme</p><p>L’écoulement postérieur, l’inflammation chronique et une hypersensibilité nerveuse sont évoqués ; le mécanisme reste incertain. Peu de patients qui ont un écoulement postérieur toussent chroniquement, et l’ERS juge que les symptômes nasaux peuvent refléter une inflammation diffuse des voies aériennes.</p><p class="lab">Conduite</p><p>Éviction de l’allergène, corticoïde nasal et rinçages salins pendant au moins deux à quatre semaines ; association corticoïde-antihistaminique nasale dans la rhinite non allergique ; dans la rhinosinusite chronique, 8 à 12 semaines avant de discuter la chirurgie. L’endoscopie nasale et le scanner des sinus ne sont pas systématiques.</p><div class="key"><b>Limite.</b> Les antihistaminiques de première génération, autrefois recommandés, agiraient surtout comme anticholinergiques centraux.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 7.1</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.2 et 6.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-ilo" data-title="Obstruction laryngée induite"><p class="lab">Définition</p><p>Rétrécissement transitoire et réversible du larynx en réponse à un stimulus (effort, reflux, irritants, stress), glottique ou supraglottique ; l’ancien terme de « dysfonction des cordes vocales » n’en désigne qu’une forme.</p><p class="lab">Présentation</p><p>Dyspnée inspiratoire brutale avec stridor, de quelques secondes à quelques minutes, toux, oppression pharyngée, dysphonie. La toux peut être à la fois déclencheur et symptôme. Elle est souvent prise pour un asthme résistant.</p><p class="lab">Diagnostic et traitement</p><p>La laryngoscopie n’est démonstrative que pendant un épisode. Le traitement associe une explication rassurante, la visualisation de la dysfonction, la physiothérapie respiratoire et la logopédie ; le pronostic est bon lorsque le diagnostic est posé.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 7.2</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.14</a>.</p></template>
<template data-pop="r05-saos" data-title="Apnée obstructive du sommeil et toux"><p class="lab">Données</p><p>Toux chronique et apnée du sommeil coexistent plus souvent que le hasard ne le voudrait. Les mécanismes proposés sont un reflux laryngopharyngé favorisé par les variations de pression des apnées et une inflammation des muqueuses par le ronflement.</p><p class="lab">Conduite</p><p>Le dépistage repose sur l’anamnèse ; la polysomnographie reste l’examen de référence. Les HUG retiennent une efficacité de la ventilation en pression positive continue sur la toux après au moins six semaines ; la Société allemande de pneumologie juge les preuves encore insuffisantes.</p><div class="key"><b>Contentieux.</b> La source la plus récente applicable, HUG 2025, s’appuie sur un essai pilote randomisé ; le bénéfice est plausible mais fondé sur de petits effectifs.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.8 et 6.6</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 4</a>.</p></template>
<template data-pop="r05-harq" data-title="Questionnaire de reflux des voies aériennes de Hull"><p class="lab">Description</p><p>Questionnaire validé de 14 questions qui recherche les symptômes associés au reflux des voies aériennes ; des versions multilingues existent. Les HUG lui attribuent une sensibilité et une spécificité supérieures à 90 % pour le reflux dans la toux chronique.</p><div class="key"><b>Limite.</b> Il oriente l’anamnèse mais ne prouve pas que le reflux cause la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.5</a>.</p></template>
<template data-pop="r05-lcq" data-title="Mesurer la toux"><p class="lab">Outils</p><p>Le plus simple est de faire coter la toux de 0 à 10 à chaque consultation. Le questionnaire de toux de Leicester (LCQ) et le questionnaire de qualité de vie spécifique de la toux mesurent le retentissement de façon validée et permettent de juger un traitement.</p><p class="lab">Ordres de grandeur</p><p>Dans les essais, la morphine a amélioré le LCQ de 3,2 points par rapport à l’état initial, la gabapentine de 1,8 point par rapport au placebo ; pour la prégabaline, la différence minimale cliniquement importante retenue était de 1,3 point.</p><div class="key"><b>Conséquence pratique.</b> Sans mesure initiale, aucun essai thérapeutique ne peut être jugé.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17122382/" target="_blank" rel="noopener">Morice et al., 2007</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22951084/" target="_blank" rel="noopener">Ryan et al., 2012</a>.</p></template>
<template data-pop="r05-examen-orl" data-title="Examen du pharynx et de l’oreille"><p class="lab">Technique et signes</p><p>L’inspection de la cavité buccale recherche une traînée de sécrétions mucopurulentes sur la paroi pharyngée postérieure et une hypertrophie des cordons lymphoïdes, qui donne au pharynx un aspect « pavimenteux ». Ces signes orientent vers une atteinte des voies aériennes supérieures.</p><p class="lab">L’oreille</p><p>Le conduit auditif externe est innervé par un rameau du vague : un bouchon de cérumen ou un corps étranger peut entretenir la toux (réflexe d’Arnold).</p><div class="key"><b>Limite.</b> Ces signes sont peu spécifiques ; l’endoscopie nasale est réservée à l’échec du traitement.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, sections 5.2 et 5.16</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-auscultation" data-title="Crépitants fins et toux"><p class="lab">Valeur</p><p>Les crépitants fins des bases figurent dans l’examen de base de la toux chronique (« râles de fibrose »). Ils orientent vers une pneumopathie interstitielle, où la toux touche 30 à 90 % des patients et répond mal aux antitussifs usuels.</p><p class="lab">Pièges</p><p>Des crépitants bilatéraux avec œdèmes et turgescence jugulaire orientent plutôt vers une insuffisance cardiaque ; des râles localisés et fébriles vers une pneumonie.</p><div class="key"><b>Conduite.</b> Des crépitants fins inexpliqués justifient une tomodensitométrie ; voir le cours J84 — Pneumopathies interstitielles diffuses.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, encadré 5</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-red-flags" data-title="Signes d’alarme de la toux"><p class="lab">Toux aiguë et subaiguë</p><p>Hémoptysie, dyspnée, cyanose, stridor, tabagisme de plus de 40 paquets-années, suspicion de pneumonie ou de tuberculose, fièvre supérieure à 38,5 °C, tachycardie, douleur thoracique, SpO₂ inférieure à 90 %, inhalation toxique aiguë ; dans la toux subaiguë, s’y ajoute la dysphonie.</p><p class="lab">Toux chronique</p><p>Mêmes signes, auxquels s’ajoutent sueurs nocturnes, perte de poids, dysphagie, dénutrition, immunosuppression sévère, changement de la toux chez un fumeur de 55 à 80 ans et signes d’atteinte systémique. Les HUG ajoutent l’âge d’au moins 40 ans chez un fumeur, un ancien fumeur ou une personne exposée à l’amiante, les infections à répétition et toute anomalie de l’examen cardiopulmonaire.</p><div class="key"><b>Conduite.</b> Un signe d’alarme impose une exploration immédiate, souvent hospitalière, quelle que soit la durée de la toux.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, tableaux 2 et 3, figures 2 et 3</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 4.1</a>.</p></template>
<template data-pop="r05-rx" data-title="Radiographie thoracique"><p class="lab">Indication</p><p>Toute toux chronique, de face et de profil ; toute toux aiguë avec signe d’alarme.</p><p class="lab">Ce qu’elle recherche</p><p>Tuberculose, cancer, bronchiectasies, emphysème, pneumopathie interstitielle, signes de stase. Les bronchiectasies se traduisent par des parois bronchiques épaissies en « rails », des images en anneau et des opacités périphériques de bouchons mucopurulents.</p><div class="key"><b>Limite.</b> Une radiographie normale n’exclut ni des bronchiectasies débutantes, ni une pneumopathie interstitielle discrète ; la question posée est « le cliché explique-t-il la toux ? ».</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 2 et section 5.7</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 11</a>.</p></template>
<template data-pop="r05-spiro" data-title="Spirométrie dans la toux"><p class="lab">Indication</p><p>Obligatoire dans toute toux chronique ; le débit de pointe répété la remplace si elle n’est pas disponible.</p><p class="lab">Interprétation</p><p>Une obstruction réversible, avec un gain de VEMS supérieur à 12 à 15 % après salbutamol, soutient un asthme ; une obstruction fixe chez un fumeur oriente vers une BPCO.</p><div class="key"><b>Piège.</b> Ces tests ont une très faible valeur prédictive négative chez le patient qui tousse et dont la fonction est normale : une spirométrie normale n’exclut pas un asthme à forme de toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 2</a>.</p></template>
<template data-pop="r05-feno" data-title="Fraction expirée du monoxyde d’azote"><p class="lab">Principe</p><p>Le FeNO estime l’inflammation bronchique de type 2, éosinophilique, qui produit du monoxyde d’azote.</p><p class="lab">Valeur</p><p>Spécificité d’environ 0,85 pour l’asthme chez l’adulte qui tousse. L’algorithme de la Société allemande de pneumologie évoque une bronchite à éosinophiles au-delà de 50 ppb sans hyperréactivité.</p><div class="key"><b>Contentieux.</b> L’ERS 2020 juge l’utilité du FeNO pour prédire la réponse aux corticoïdes non démontrée et n’en fait qu’une recommandation de recherche. Les HUG 2025, source applicable la plus récente, le jugent utile pour prédire la réponse au corticoïde inhalé (preuve modérée, méta-analyse de 2021). Le cours retient la position des HUG : le FeNO aide la décision, mais aucun seuil consensuel n’existe dans la toux chronique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 2</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 2</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, figure 4</a>.</p></template>
<template data-pop="r05-eos" data-title="Éosinophiles du sang et de l’expectoration"><p class="lab">Sang</p><p>Une éosinophilie supérieure à 0,3 G/L suggère une inflammation éosinophilique des voies aériennes. Elle varie selon l’heure et la saison : plusieurs mesures sont nécessaires.</p><p class="lab">Expectoration induite</p><p>Plus de 3 % d’éosinophiles sans hyperréactivité bronchique signent une bronchite à éosinophiles. C’est le marqueur le plus exact, mais il demande du temps et une expertise et n’est disponible qu’en centre spécialisé.</p><div class="key"><b>Note de lecture.</b> Le texte de l’ERS écrit « 0,3 cellule par microlitre » ; le cours l’interprète comme 0,3 × 10⁹ par litre, soit 300 par microlitre, seule lecture compatible avec la biologie.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-metacholine" data-title="Test de provocation à la méthacholine"><p class="lab">Principe</p><p>L’inhalation de doses croissantes de méthacholine révèle une hyperréactivité bronchique, c’est-à-dire une bronchoconstriction excessive à un stimulus faible.</p><p class="lab">Place</p><p>Il est positif par définition dans l’asthme à forme de toux et négatif dans la bronchite à éosinophiles. Il se discute lorsque l’asthme reste incertain. L’ERS rapporte des pratiques divergentes : indispensable pour certains centres, peu utile pour d’autres. La Société allemande de pneumologie admet, à la place, un essai de corticoïde inhalé de quatre semaines.</p><div class="key"><b>Limite.</b> Environ 30 % de la population générale a une hyperréactivité bronchique : un test positif ne prouve pas que l’hyperréactivité cause la toux.</div><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 9</a>.</p></template>
<template data-pop="r05-tdm" data-title="Tomodensitométrie thoracique"><p class="lab">Recommandation</p><p>L’ERS suggère de ne pas réaliser de tomodensitométrie systématique lorsque la radiographie et l’examen sont normaux (recommandation conditionnelle, preuve très faible). Des anomalies sont trouvées chez 6,5 à 58 % des patients, mais elles expliquent rarement la toux, et l’irradiation expose à un risque de cancer, plus élevé chez l’enfant et la femme.</p><p class="lab">Indications</p><p>Toux productive (coupes de 1 mm, à la recherche de bronchiectasies), bilan négatif ou toux réfractaire (pneumopathie interstitielle discrète, bouchons muqueux), signe d’alarme.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 1</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 11</a>.</p></template>
<template data-pop="r05-phmetrie" data-title="Exploration fonctionnelle de l’œsophage"><p class="lab">pH-impédancemétrie de 24 heures</p><p>Réalisée sans inhibiteur de la pompe à protons, elle mesure le reflux acide et, par l’impédance, le reflux non acide. Une causalité entre reflux et toux n’est admise que si la probabilité d’association symptomatique atteint au moins 95 %. Sans pyrosis ni régurgitation, elle n’aide pas.</p><p class="lab">Manométrie à haute résolution</p><p>Elle précise le siège et le mécanisme d’un trouble moteur œsophagien, fréquent chez le patient qui tousse ; le transit baryté le détecte avec une faible sensibilité.</p><p class="lab">Endoscopie</p><p>L’œsogastroduodénoscopie ne diagnostique pas la toux de reflux ; elle recherche des complications.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 8 et 11</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.5</a>.</p></template>
<template data-pop="r05-laryngo" data-title="Laryngoscopie"><p class="lab">Valeur</p><p>Le larynx paraît souvent rouge et inflammatoire chez le patient qui tousse, mais ce signe est peu sensible et peu spécifique. L’examen identifie une obstruction laryngée induite, surtout pendant un épisode ; entre les épisodes, il est normal.</p><div class="key"><b>Conduite.</b> La laryngoscopie, la rhinoscopie et le scanner des sinus ne sont pas systématiques : leurs anomalies ne sont pas directement liées à la toux.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 5.14</a>.</p></template>
<template data-pop="r05-bnp" data-title="Bilan cardiaque et vasculaire de la toux"><p class="lab">Insuffisance cardiaque et arythmies</p><p>Sur indices cliniques, le bilan comprend un ECG, une échocardiographie et un dosage de BNP ou de NT-proBNP ; la stase pulmonaire répond au diurétique.</p><p class="lab">Embolies récidivantes</p><p>Une toux chronique avec dyspnée d’effort récente est un signal d’alarme. Le bilan associe D-dimères, peptides natriurétiques, échocardiographie et, en cas de forte suspicion, angioscanner thoracique. Chez le patient hospitalisé pour exacerbation de BPCO, une embolie est trouvée dans 4 à 6 % des cas.</p><p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitre 4</a>.</p></template>
<template data-pop="r05-compteur" data-title="Enregistrement objectif de la toux"><p class="lab">Principe</p><p>Un enregistreur sonore porté 24 heures compte les secousses de toux. Les essais récents utilisent la fréquence de toux sur 24 heures comme critère principal : environ 18 à 23 toux par heure au départ dans les essais du géfapixant.</p><div class="key"><b>Limite.</b> L’ERS réclame des appareils entièrement automatisés pour l’usage courant ; en pratique, le score de 0 à 10 et le questionnaire de Leicester restent les outils de consultation.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Lyfnua®, tableau 2</a>.</p></template>
<template data-pop="r05-trp" data-title="Canaux TRPV1 et TRPA1"><p class="lab">Rôle</p><p>Ces canaux ioniques des terminaisons vagales détectent les irritants et participent à la sensation de chatouillement qui précède la toux. L’inflammation allergique ou virale augmente l’expression de TRPV1 dans les neurones nodaux chez l’animal.</p><div class="key"><b>Conséquence thérapeutique.</b> Leurs antagonistes, efficaces chez l’animal, ont échoué en clinique ; la recherche s’est déplacée vers le récepteur P2X3.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., 2020</a>.</p></template>
<template data-pop="r05-epreuve" data-title="Traitement d’épreuve : contentieux entre sources"><p class="lab">Positions</p><p><b>ERS 2020</b> : lorsque l’évaluation ne désigne pas le trait en cause, des essais thérapeutiques successifs sont préférables, chacun arrêté en l’absence de réponse ; un corticoïde inhalé de 2 à 4 semaines est suggéré. <b>Société allemande de pneumologie, janvier 2025</b> : essai de corticoïde inhalé, éventuellement associé à un bronchodilatateur, pendant quatre semaines en cas de suspicion ; pas d’inhibiteur de la pompe à protons sans symptôme de reflux. <b>HUG, septembre 2025</b> : le traitement d’épreuve « n’est plus recommandé » sans argument au moins anamnestique, car plus de 40 % des patients n’y répondaient pas.</p><p class="lab">Arbitrage</p><p>La source applicable la plus récente, celle des HUG, l’emporte : aucun traitement empirique sans indice clinique. Les trois sources convergent sur un point : lorsque l’anamnèse ou les marqueurs désignent un trait, un essai limité dans le temps, évalué et arrêté s’il échoue, reste justifié.</p><p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 6 et 9</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></template>
<template data-pop="r05-antibio" data-title="Antibiotique dans la toux aiguë"><p class="lab">Règle</p><p>Pas d’antibiotique pour une toux aiguë liée à une infection des voies aériennes supérieures ou à une bronchite aiguë chez un patient qui n’est ni très altéré ni à haut risque de complications.</p><p class="lab">Patients à haut risque selon le NICE</p><p>Comorbidité significative (cœur, poumon, rein, foie, maladie neuromusculaire, immunosuppression, mucoviscidose) ; jeune enfant né prématuré ; plus de 65 ans avec au moins deux critères, ou plus de 80 ans avec au moins un critère, parmi : hospitalisation dans l’année, diabète, insuffisance cardiaque, corticothérapie orale. Chez eux, une prescription immédiate ou différée se discute.</p><p class="lab">Choix proposés par le NICE chez l’adulte</p><p>Doxycycline 200 mg le premier jour puis 100 mg par jour pendant 4 jours ; amoxicilline 500 mg trois fois par jour pendant 5 jours ; clarithromycine 250 à 500 mg deux fois par jour pendant 5 jours.</p><div class="key"><b>Limite.</b> Ces choix sont britanniques ; en Suisse, l’antibiothérapie de la bronchite et de la pneumonie suit les cours J40 — Bronchite et J18 — Pneumonies.</div><p class="src">Référence : <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE, toux aiguë, février 2019, recommandations 1.1.8 à 1.1.16 et 1.3</a>.</p></template>
<template data-pop="r05-miel" data-title="Miel, antitussifs et sécrétolytiques : preuves et contentieux"><p class="lab">NICE 2019</p><p>Des preuves limitées soutiennent le miel (après un an), le pélargonium et la guaïfénésine (après 12 ans), et les antitussifs autres que la codéine (après 12 ans, sans toux persistante ni sécrétions abondantes). Antihistaminiques, décongestionnants et codéine n’aident pas. Le NICE déconseille les mucolytiques dans la toux aiguë.</p><p class="lab">Société allemande de pneumologie 2025</p><p>Sur demande du patient, sécrétolytiques (ambroxol, acétylcystéine), dextrométhorphane et phytothérapie peuvent être prescrits ; le dextrométhorphane et plusieurs phytothérapies ont des preuves d’efficacité.</p><p class="lab">HUG 2025</p><p>Jusqu’à 85 % de l’effet des sirops serait un effet placebo ; le miel offre une efficacité presque comparable avec moins d’effets indésirables.</p><div class="key"><b>Arbitrage.</b> La source applicable la plus récente sur la toux aiguë, la Société allemande de pneumologie 2025, admet un traitement symptomatique à la demande. Le cours le présente comme une option de confort, brève, sans bénéfice sur la guérison.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE 2019</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 2 et 12</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 6.1</a>.</p></template>
<template data-pop="r05-cough-control" data-title="Thérapie de contrôle de la toux"><p class="lab">Contenu</p><p>Éducation sur la toux chronique et ses déclencheurs ; rétablissement d’une respiration nasale et diaphragmatique ; techniques pour éviter, interrompre ou atténuer la toux ; en logopédie, explication que la toux n’est pas « imaginaire », hygiène vocale et toux à moindre pression sous-glottique. Le patient apprend qu’une envie de tousser n’impose pas de tousser.</p><p class="lab">Preuves</p><p>Deux essais randomisés chez l’adulte réfractaire : baisse du score de toux de 2,8 points sur une échelle de 2 à 10 après deux mois ; amélioration du questionnaire de Leicester de 1,53 point et réduction de la fréquence objective après quatre séances hebdomadaires, maintenue trois mois. Aucun effet indésirable rapporté.</p><div class="key"><b>Limite.</b> Intervention complexe, réservée à des thérapeutes formés, encore rares.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 7</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 12.a et 12.b</a>.</p></template>
<template data-pop="r05-enfant" data-title="Toux chronique de l’enfant"><p class="lab">Définition</p><p>Toux de plus de quatre semaines ; entre trois et huit semaines, on parle aussi de toux aiguë prolongée. L’enfant n’est pas un petit adulte : maturation du réflexe, de l’immunité et des voies aériennes rendent les infections et les anomalies congénitales prédominantes.</p><p class="lab">Causes</p><p>Résolution spontanée post-infectieuse, asthme et bronchite bactérienne prolongée surtout ; trachéomalacie, bronchiectasies, corps étranger ; toux d’habitude ou tic, reconnaissable à sa suppressibilité, sa distractibilité et sa sensation prémonitoire.</p><p class="lab">Conduite</p><p>Anamnèse et examen détaillés, radiographie et spirométrie si l’enfant coopère. Sans indice ni anomalie, observation jusqu’à quatre semaines de plus, puis distinction toux sèche ou humide : essai de corticoïde inhalé de 2 à 4 semaines dans la toux sèche, antibiotique dans la toux humide. Les neuromodulateurs ne sont pas utilisés ; l’antileucotriène expose à des effets neuropsychiatriques transitoires chez plus de 10 % des enfants.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, toux chronique de l’enfant et questions 3 et 8</a>.</p></template>
<template data-pop="r05-pbb" data-title="Bronchite bactérienne prolongée"><p class="lab">Critères de l’ERS</p><p>Trois critères réunis : toux humide continue de plus de quatre semaines ; absence de signe orientant vers une autre cause ; guérison après 2 à 4 semaines d’un antibiotique oral approprié.</p><p class="lab">Preuve</p><p>Chez de jeunes enfants (âge médian 1,9 an), l’amoxicilline-acide clavulanique, 22,5 mg/kg par prise deux fois par jour pendant deux semaines, a guéri la toux chez 48 % contre 16 % sous placebo.</p><div class="key"><b>Portée.</b> Elle pourrait précéder des bronchiectasies : une récidive impose une évaluation spécialisée.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020, question 8</a>.</p></template>
