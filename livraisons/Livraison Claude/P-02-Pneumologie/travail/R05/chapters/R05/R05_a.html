<h1>Toux aiguë, subaiguë et chronique</h1><span class="status">Adulte, avec repères pédiatriques · référentiels ERS 2020, Société allemande de pneumologie 2025, HUG 2025, NICE 2019 · informations professionnelles suisses · état au 09.10.2026 · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>

<section class="ilot" id="r05-0"><h2><span class="n">0</span>Question clinique</h2><p>Une enseignante de 58 ans, non fumeuse, tousse depuis cinq mois. La toux a commencé avec un rhume, puis n’a plus cessé. Elle est sèche, déclenchée par le parfum d’une collègue, l’air froid et les conversations téléphoniques. La patiente perd des urines lors des quintes et dort mal. Elle prend un inhibiteur de l’enzyme de conversion (IEC) depuis huit mois pour une hypertension.</p><p>La toux est le plus souvent le symptôme d’une maladie : infection, asthme, reflux, cancer, insuffisance cardiaque. Elle peut aussi devenir une maladie en soi, lorsque le réflexe qui la produit est devenu hypersensible. <b>Le médecin doit donc répondre à trois questions successives : la toux signale-t-elle un danger immédiat, existe-t-il une cause traitable, et le réflexe lui-même est-il devenu pathologique ?</b></p><div class="key"><b>Point de départ.</b> <button class="w" data-k="r05-reflexe">Le réflexe de toux (arc nerveux et rôle protecteur)</button> ; <button class="w" data-k="r05-hypersensibilite">le syndrome d’hypersensibilité de la toux (définition et portée)</button> ; <button class="w" data-k="r05-iec">la toux des IEC (mécanisme et délai de résolution)</button>.</div></section>
<section class="ilot" id="r05-1"><h2><span class="n">1</span>Définitions et classifications</h2><p>La toux est un réflexe vagal de défense : une inspiration, une fermeture brève de la glotte, puis une expiration forcée glotte ouverte, dont le débit élevé chasse des voies aériennes ce qui les menace. Elle protège contre l’aspiration ; un patient qui ne tousse plus, après un accident vasculaire cérébral par exemple, s’expose aux pneumonies d’inhalation.</p><p>Le clinicien classe d’abord la toux selon sa durée, car la durée prédit la cause et règle l’intensité des examens. La Société allemande de pneumologie (2025) et les HUG (2025) retiennent trois catégories. L’ERS (2020) fixe le seuil de la toux chronique à huit semaines chez l’adulte et à quatre semaines chez l’enfant ; elle rappelle que ce seuil est arbitraire, car certaines toux évoluent par rechutes et rémissions.</p><table class="t"><tr><th>Catégorie</th><th>Durée chez l’adulte</th><th>Attitude initiale</th></tr><tr><td>Aiguë</td><td>Moins de 3 semaines</td><td>Anamnèse et examen ; examens seulement si signe d’alarme</td></tr><tr><td>Subaiguë</td><td>3 à 8 semaines</td><td>Même attitude ; rechercher coqueluche, hyperréactivité post-infectieuse, rhinosinusite</td></tr><tr><td>Chronique</td><td>Plus de 8 semaines</td><td>Bilan de base sans délai : radiographie, spirométrie, formule sanguine</td></tr></table><p>Le tableau se lit de gauche à droite : la durée change la conduite, non la gravité. Une toux de quatre jours avec hémoptysie et douleur thoracique impose des examens immédiats, alors qu’une toux de cinq semaines après une grippe, sans signe d’alarme, justifie l’attente. L’erreur fréquente consiste à prolonger l’attente au-delà de huit semaines par habitude.</p><p>La toux est ensuite dite <button class="w" data-k="r05-productive">productive ou sèche (seuil de 5 à 30 mL par 24 heures)</button>. Lorsque la toux chronique persiste malgré le traitement de sa cause présumée, elle est <b>réfractaire</b> ; lorsqu’aucune cause n’est trouvée après un bilan complet, elle est <b>inexpliquée</b>. Les deux formes partagent le même mécanisme : une <button class="w" data-k="r05-allotussie">allotussie et une hypertussie (définitions et exemples)</button>.</p><div class="key"><b>À retenir.</b> La durée sépare la toux aiguë (moins de 3 semaines), subaiguë (3 à 8) et chronique (plus de 8). La toux chronique réfractaire ou inexpliquée est une maladie du réflexe, non un simple symptôme. La partie suivante mesure la fréquence et le poids de ce problème.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">Morice et al., recommandations ERS sur la toux chronique, Eur Respir J 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie, recommandation sur la toux de l’adulte, version 4.1, janvier 2025</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG, stratégie « Toux chronique », 2025</a>.</p></section>
<section class="ilot" id="r05-2"><h2><span class="n">2</span>Épidémiologie et retentissement</h2><p>La toux est l’un des motifs de consultation les plus fréquents. La toux aiguë relève surtout du rhume : les rhinovirus en causent 30 à 50 % des cas, et la toux en est le symptôme le plus gênant et le plus durable, de deux à trois semaines (Société allemande de pneumologie, 2025). Le NICE rappelle qu’une toux aiguë peut durer trois à quatre semaines sans antibiotique.</p><p>Une méta-analyse estime la prévalence mondiale de la toux chronique de l’adulte à environ 10 % (Song, 2015, cité par l’ERS). En Allemagne, elle atteint 6,5 %. Dans les consultations spécialisées, deux patients sur trois sont des femmes, avec un pic dans la sixième décennie ; l’ERS attribue cette distribution à une différence de traitement cortical de la sensation de toux. Chez 30 à 40 % des patients adressés au pneumologue, aucune cause n’est trouvée. <b>Aucune prévalence suisse de la toux chronique de l’adulte n’a été identifiée.</b> Chez l’enfant zurichois de 6 à 17 ans, 25 % des parents rapportent une toux sans rhume et 11 % une toux sèche nocturne, mais ces chiffres dépendent fortement de la question posée (Mallet, 2023).</p><p>La toux chronique menace rarement la vie, mais elle détériore la qualité de vie. Les patients rapportent en moyenne huit conséquences : <button class="w" data-k="r05-incontinence">incontinence urinaire d’effort (fréquence et dépistage)</button>, troubles du sommeil, dysphonie, isolement social, dépression, et parfois <button class="w" data-k="r05-syncope">syncope de toux (mécanismes)</button>, fracture de côte ou pneumothorax.</p><div class="key"><b>À retenir.</b> Une toux aiguë dure souvent deux à quatre semaines ; une toux chronique touche environ un adulte sur dix, surtout la femme de 50 à 70 ans. Le retentissement se mesure à chaque consultation. La partie suivante explique pourquoi le réflexe peut s’emballer.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25657027/" target="_blank" rel="noopener">Song et al., épidémiologie mondiale de la toux chronique, Eur Respir J 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36912371/" target="_blank" rel="noopener">Mallet et al., prévalence de la toux de l’enfant, Swiss Med Wkly 2023</a> ; <a href="https://www.nice.org.uk/guidance/ng120" target="_blank" rel="noopener">NICE, toux aiguë, février 2019</a>.</p></section>
<section class="ilot" id="r05-3"><h2><span class="n">3</span>Du réflexe protecteur à l’hypersensibilité</h2><p>Chez le sujet sain, la toux répond à un stimulus réellement nocif. Des terminaisons nerveuses vagales tapissent le larynx, la trachée et les grosses bronches. Deux populations dominent : des <b>fibres C chimiosensibles</b>, issues du ganglion jugulaire, sensibles aux irritants et aux médiateurs de l’inflammation ; des <b>récepteurs Aδ de la toux</b>, issus du ganglion nodal, sensibles au contact mécanique et à l’acidité, qui défendent contre l’aspiration. Le message gagne le tronc cérébral, puis le générateur respiratoire déclenche la séquence motrice. Le cortex module ce réflexe : il produit la sensation d’envie de tousser et permet de la réprimer.</p><figure><svg viewBox="0 0 680 250" role="img" aria-label="Arc réflexe de la toux et sites de sensibilisation périphérique et centrale" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="20" y="150" width="150" height="60" rx="8"/><rect x="250" y="150" width="160" height="60" rx="8"/><rect x="250" y="30" width="160" height="60" rx="8"/><rect x="490" y="150" width="170" height="60" rx="8"/><path d="M170 180h80"/><path d="M410 180h80"/><path d="M330 150V90"/><path d="M330 90v60" stroke-dasharray="6 4"/></g><g fill="#222"><text x="30" y="175">Larynx, trachée,</text><text x="30" y="195">bronches : fibres C, Aδ</text><text x="260" y="175">Tronc cérébral :</text><text x="260" y="195">relais et générateur</text><text x="260" y="55">Cortex : envie de</text><text x="260" y="75">tousser, répression</text><text x="500" y="175">Muscles respiratoires</text><text x="500" y="195">et glotte : la toux</text><text x="20" y="235">① sensibilisation périphérique</text><text x="250" y="235">② gain central accru</text><text x="420" y="60">③ inhibition affaiblie</text><text x="175" y="170">nerf vague</text></g></svg><figcaption>Figure 1 — L’arc réflexe de la toux et ses trois points de dérèglement : terminaisons sensibilisées par l’inflammation (①), amplification dans le tronc cérébral (②), réseau cortical de répression moins recruté (③). Schéma pédagogique, non à l’échelle.</figcaption></figure><p>Dans la toux chronique, ce circuit devient hypersensible. En périphérie, l’inflammation libère de l’<button class="w" data-k="r05-atp">ATP, des protons et des prostaglandines (sensibilisation des terminaisons)</button>, qui abaissent le seuil d’activation des fibres. Au centre, l’imagerie fonctionnelle montre une activité accrue du mésencéphale et une moindre activation du réseau qui réprime la toux. Le patient tousse alors pour un stimulus anodin, comme parler ou rire.</p><p>Plusieurs causes agissent sur ce même circuit. Les IEC accumulent la bradykinine, qui sensibilise les récepteurs. Le <button class="w" data-k="r05-reflux">reflux gastro-œsophagien (théorie du réflexe et du reflux)</button> stimule le réflexe depuis l’œsophage. L’<button class="w" data-k="r05-cva">inflammation éosinophilique de l’asthme à forme de toux</button> irrite les terminaisons bronchiques. Le tabac, à l’inverse, déprime la sensibilité du réflexe : la toux augmente souvent au cours du premier mois de sevrage (<button class="w" data-k="r05-tabac">tabac et réflexe de toux</button>).</p><div class="key"><b>À retenir.</b> La toux chronique naît d’un réflexe sensibilisé à la périphérie et au centre. Ce modèle explique l’allotussie, l’efficacité des traitements de la cause lorsqu’elle existe, et celle des neuromodulateurs lorsqu’elle n’existe plus. La partie suivante recense ces causes.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7578480/" target="_blank" rel="noopener">Singh et al., mécanismes périphériques et centraux de l’hypersensibilité de la toux, J Thorac Dis 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, chapitres 8 et 10</a>.</p></section>
<section class="ilot" id="r05-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>La durée oriente vers des familles de causes différentes. Le clinicien cherche toujours, à côté des causes fréquentes, les causes rares mais graves, car ce sont elles que les signes d’alarme permettent de reconnaître.</p><table class="t"><tr><th>Durée</th><th>Causes fréquentes</th><th>Causes graves à ne pas manquer</th></tr><tr><td>Aiguë</td><td>Rhume viral, bronchite aiguë, rhinite allergique, crise d’asthme</td><td>Pneumonie, embolie pulmonaire, pneumothorax, œdème pulmonaire, corps étranger, inhalation toxique</td></tr><tr><td>Subaiguë</td><td><button class="w" data-k="r05-postinfectieux">Toux post-infectieuse et hyperréactivité transitoire</button>, rhinosinusite post-virale</td><td><button class="w" data-k="r05-coqueluche">Coqueluche</button>, pneumonie à mycoplasme, <button class="w" data-k="r05-postcovid">toux après COVID-19</button></td></tr><tr><td>Chronique</td><td>Tabac et bronchite chronique, asthme et bronchite à éosinophiles, reflux, maladies des voies aériennes supérieures, IEC</td><td>Cancer bronchique, tuberculose, pneumopathie interstitielle, insuffisance cardiaque, embolies récidivantes, bronchiectasies</td></tr></table><p>La colonne de droite commande la vigilance : chaque toux, quelle que soit sa durée, est confrontée aux signes d’alarme de l’îlot 8. Chez un fumeur de 65 ans dont la toux habituelle change de caractère, le cancer bronchique précède le reflux dans le raisonnement. Le cancer reste pourtant rare dans la toux chronique tout-venant : moins de 2 % selon les HUG.</p><p>Dans la toux chronique, les causes fréquentes sont appelées « traits traitables ». Ce sont l’<button class="w" data-k="r05-cva">asthme à forme de toux</button>, la <button class="w" data-k="r05-eb">bronchite à éosinophiles non asthmatique</button>, le <button class="w" data-k="r05-reflux">reflux</button>, le <button class="w" data-k="r05-voies-sup">syndrome de toux des voies aériennes supérieures</button>, l’<button class="w" data-k="r05-ilo">obstruction laryngée induite</button>, l’<button class="w" data-k="r05-saos">apnée obstructive du sommeil</button> et les <button class="w" data-k="r05-iec">médicaments</button>. Selon la Société allemande de pneumologie, l’asthme à forme de toux et la bronchite à éosinophiles expliquent 31 à 50 % des toux chroniques du non-fumeur dont la radiographie est normale et qui ne prend pas d’IEC. L’obésité est associée à une toux plus fréquente et plus sévère.</p><div class="trap"><span class="k">Piège</span> Un trait traitable associé n’est pas forcément la cause. La plupart des patients qui ont un reflux ou une rhinite ne toussent pas. Si la toux persiste malgré un traitement correct, il s’agit d’une association et la toux est réfractaire.</div><div class="key"><b>À retenir.</b> La toux aiguë est surtout virale ; la toux subaiguë surtout post-infectieuse ; la toux chronique relève du tabac, de traits traitables ou d’une hypersensibilité isolée. Les causes graves se cherchent à toutes les durées. La partie suivante montre comment l’anamnèse les distingue.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, tableau 1 et chapitres 4 à 10</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a>.</p></section>
<section class="ilot" id="r05-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>L’anamnèse est l’examen le plus rentable de la toux. Elle repère d’abord les signes d’alarme, puis les traits traitables, enfin le retentissement. Elle suit un ordre fixe pour ne rien omettre.</p><h3>Antécédents et expositions</h3><p>Le médecin chiffre le <button class="w" data-k="r05-tabac">tabagisme en paquets-années</button> ; au-delà de 40, la Société allemande de pneumologie le compte parmi les signes d’alarme. Il relève la profession et l’exposition à l’amiante, un asthme ou une atopie, une maladie cardiaque, une tuberculose ancienne, un accident vasculaire cérébral ou une maladie de Parkinson, qui exposent aux fausses routes. Il revoit <b>tous les médicaments</b> : IEC, bêtabloquants, amiodarone, méthotrexate, inhibiteurs de points de contrôle immunitaire, collyres de prostaglandines et inhalateurs à poudre peuvent faire tousser. Il demande l’état vaccinal contre la coqueluche et un contact infectieux récent.</p><h3>Caractériser la toux</h3><p>Il précise la date et le mode de début : brutal chez un enfant d’âge préscolaire, il évoque un corps étranger ; après un rhume, une toux post-infectieuse ou une hypersensibilité. Il fait quantifier l’expectoration : une cuillère à café ou plus par jour définit une toux productive, qui oriente vers une bronchite chronique, des bronchiectasies ou une infection chronique. Il recherche les déclencheurs : parler, rire, parfums, air froid, repas, position couchée. Ils signent une <button class="w" data-k="r05-allotussie">allotussie</button>.</p><h3>Symptômes associés</h3><p>Une toux nocturne ou d’effort avec sifflements oriente vers l’asthme. Écoulement nasal postérieur, obstruction nasale et raclements de gorge orientent vers les voies aériennes supérieures. Pyrosis, régurgitations et toux après les repas orientent vers le reflux ; le <button class="w" data-k="r05-harq">questionnaire de reflux des voies aériennes de Hull</button> les objective. Ronflement, somnolence diurne et surpoids orientent vers l’apnée du sommeil. Dysphonie et dyspnée inspiratoire brève orientent vers l’obstruction laryngée induite.</p><div class="two"><div class="card"><b>Présentation typique de l’hypersensibilité</b><p>Une femme de 50 à 70 ans tousse sec depuis des mois, parfois des années, depuis un rhume oublié. Elle décrit un chatouillement laryngé, une envie irrépressible de tousser et des quintes déclenchées par la parole, le téléphone ou les parfums.</p></div><div class="card"><b>Présentations trompeuses</b><p>La toux chronique passe pour des « bronchites à répétition », un asthme résistant ou des exacerbations de BPCO. Une sensation d’encombrement sans expectoration réelle traduit souvent l’envie de tousser, non une hypersécrétion.</p></div></div><h3>Retentissement</h3><p>Le médecin interroge sur l’incontinence urinaire, le sommeil, les syncopes, l’humeur et la vie sociale. Il fait coter la toux de 0 à 10 à chaque consultation ; le <button class="w" data-k="r05-lcq">questionnaire de toux de Leicester</button> mesure la qualité de vie de façon validée.</p><div class="key"><b>À retenir.</b> L’anamnèse chiffre le tabac, relit chaque médicament, quantifie l’expectoration, recherche les déclencheurs et les symptômes des traits traitables, puis mesure le retentissement. L’examen clinique vient ensuite confirmer ou corriger ces hypothèses.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, encadrés 4 et 5, tableau 5</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6942543/" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, tableau 1</a>.</p></section>
<section class="ilot" id="r05-6"><h2><span class="n">6</span>Examiner pour trier</h2><p>L’examen clinique répond à deux questions : le patient est-il en danger, et quel organe produit la toux ? Il commence par les paramètres vitaux, car une anomalie vitale court-circuite toute la démarche par durée.</p><div class="two"><div class="card"><b>État général et paramètres vitaux</b><p>Une fréquence respiratoire élevée, une cyanose ou une SpO₂ inférieure à 90 % signalent une atteinte cardiorespiratoire sévère. Une fréquence cardiaque supérieure à 120 par minute évoque une embolie pulmonaire ou un sepsis. Une température supérieure à 38,5 °C évoque une infection sévère. L’indice de masse corporelle repère l’obésité et l’amaigrissement.</p></div><div class="card"><b>Sphère oto-rhino-laryngologique et cou</b><p>Le médecin cherche une rhinorrhée, des sécrétions mucopurulentes sur la paroi pharyngée postérieure et un <button class="w" data-k="r05-examen-orl">aspect « pavimenteux » du pharynx</button>. Il inspecte le conduit auditif : un bouchon de cérumen ou un corps étranger peut déclencher la toux par le rameau auriculaire du vague. Un stridor impose une évaluation urgente.</p></div></div><div class="two"><div class="card"><b>Auscultation pulmonaire</b><p>Des sibilants orientent vers l’asthme ou la BPCO. Des <button class="w" data-k="r05-auscultation">crépitants fins des bases (valeur et pièges)</button> orientent vers une pneumopathie interstitielle ou une stase. Des râles localisés et fébriles orientent vers une pneumonie. Un murmure aboli et unilatéral évoque un épanchement, un pneumothorax ou une atélectasie.</p></div><div class="card"><b>Examen cardiovasculaire</b><p>Œdèmes, turgescence jugulaire, prise de poids et crépitants bilatéraux évoquent une insuffisance cardiaque. Une bradycardie peut traduire un bloc auriculo-ventriculaire, qui peut accompagner la toux. Ces signes justifient un ECG et un dosage des peptides natriurétiques.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Un examen normal ne prouve pas l’absence de cause. Dans l’asthme à forme de toux et le reflux, l’auscultation est souvent normale. Le bilan de base reste indispensable dès la huitième semaine.</div><div class="key"><b>À retenir.</b> L’examen commence par les paramètres vitaux, puis explore les voies aériennes supérieures, l’oreille, les poumons et le cœur. La partie suivante assemble anamnèse, examen et examens complémentaires dans une démarche par durée.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/020-003l_S2k_Fachaerztliche-Diagnostik-Therapie-erwachsene-Patienten-Husten__2025-02_1.pdf" target="_blank" rel="noopener">Société allemande de pneumologie 2025, tableaux 2 et 3, encadré 5</a> ; <a href="https://www.hug.ch/sites/interhug/files/2025-09/strategie_toux_chronique_2025_1.pdf" target="_blank" rel="noopener">HUG 2025, section 4.2</a>.</p><button class="pareto-btn ui" data-k="pareto-r05-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
