<template data-pop="j69-pneumonie-aspiration" data-title="Pneumonie d’aspiration"><p class="lab">Définition</p><p>Selon la BTS (2023), la pneumonie d’aspiration résulte de la microaspiration de sécrétions oropharyngées ou digestives riches en bactéries, en quantité suffisante pour provoquer une inflammation alvéolaire et systémique. Elle s’accompagne très souvent d’un trouble de la déglutition, parfois silencieux.</p><p class="lab">Place parmi les pneumonies</p><p>La classification habituelle des pneumonies repose sur le lieu où elles débutent, alors que la microaspiration peut survenir partout. Elle contribuerait à 5 à 15 % des pneumonies communautaires, davantage aux pneumonies nosocomiales, et à toutes les pneumonies acquises sous ventilation mécanique, car la sonde d’intubation est une voie de microaspiration.</p><p class="lab">Microbiologie</p><p>Elle est souvent polymicrobienne ; les bacilles à Gram négatif aérobies y sont surreprésentés, les cocci à Gram positif fréquents. Les anaérobies ne semblent modifier le pronostic que chez les patients les plus graves.</p><div class="key"><b>Conséquence pratique.</b> Le diagnostic reste rarement certain : le médecin traite l’épisode et cherche la cause de la dysphagie pour prévenir la récidive.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-pneumopathie-chimique" data-title="Pneumopathie chimique d’aspiration"><p class="lab">Définition</p><p>Agression chimique du poumon par un grand volume de liquide gastrique acide entré brusquement dans les voies aériennes. L’aspiration est souvent observée, le patient a habituellement une conscience abaissée (BTS, 2023).</p><p class="lab">Conséquence thérapeutique</p><p>La lésion initiale est stérile. La BTS rappelle qu’elle ne requiert pas d’antibiotique sauf infection secondaire. L’ESO (2026) propose de surseoir à l’antibiotique et de ne le débuter que si une infection bactérienne devient évidente après 24 à 48 heures.</p><p class="lab">Données</p><p>Dans une cohorte de 200 patients, l’antibioprophylaxie n’a pas réduit la mortalité (rapport de cotes ajusté 0,9) ni les transferts en soins intensifs (5 % contre 6 %) ; elle a augmenté les escalades d’antibiotique (8 % contre 1 %) et réduit les jours sans antibiotique (7,5 contre 10,9) (Dragan, 2018).</p><div class="trap"><span class="k">Piège</span> Le syndrome de Mendelson, aspiration gastrique liée à l’anesthésie, est classé à part dans la CIM-10-GM ; il relève du cours sur les complications respiratoires des actes médicaux.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42095755/" target="_blank" rel="noopener">ESO 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29438467/" target="_blank" rel="noopener">Dragan et al. 2018</a>.</p></template>
<template data-pop="j69-co" data-title="Intoxication au monoxyde de carbone"><p class="lab">Mécanisme</p><p>Le monoxyde de carbone se lie à l’hémoglobine et forme la carboxyhémoglobine (COHb) : il en résulte une anémie fonctionnelle. La coloration « rouge cerise » est rarement observée (Hampson, 2018).</p><p class="lab">Mesure</p><p>L’oxymètre de pouls conventionnel ne mesure pas la COHb ; la co-oxymétrie de laboratoire est la plus exacte, sur sang artériel ou veineux. Valeurs habituelles : moins de 2 % chez le non-fumeur, moins de 5 % chez le fumeur ; au-delà de 9 %, l’exposition exogène est presque certaine. Le taux ne prédit ni les symptômes ni le pronostic.</p><p class="lab">Traitement</p><p>Oxygène à 100 % immédiatement chez tout intoxiqué ; oxygénothérapie hyperbare selon les critères de l’ECHM. En 2025, Tox Info Suisse a donné 53 consultations pour monoxyde de carbone.</p><div class="key"><b>Conséquence pratique.</b> Une victime de feu ou de chauffage défectueux est co-oxymétrée même si sa SpO₂ est normale.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29734568/" target="_blank" rel="noopener">Hampson 2018</a> ; <a href="https://www.eubs.org/?p=583" target="_blank" rel="noopener">ECHM 2016</a> ; <a href="https://www.toxinfo.ch/jahresberichte_de" target="_blank" rel="noopener">Tox Info Suisse, annexe 2025</a>.</p></template>
<template data-pop="j69-cyanure" data-title="Intoxication au cyanure"><p class="lab">Sources</p><p>Fumées d’incendie en espace clos, acide cyanhydrique et ses sels, substances cyanogènes dont certaines plantes, nitriles aliphatiques, perfusion prolongée de nitroprussiate (information professionnelle Cyanokit).</p><p class="lab">Mécanisme</p><p>Le cyanure inhibe la cytochrome c oxydase, complexe IV de la chaîne respiratoire mitochondriale ; la cellule ne peut plus utiliser l’oxygène (Zuhra et Szabo, 2022).</p><p class="lab">Clinique</p><p>Céphalées, nausées, vomissements, confusion, oppression thoracique, dyspnée et tachypnée au début puis bradypnée ou apnée, hypertension puis hypotension, convulsions, coma, mydriase, lactate supérieur à 8 mmol/L. Le consensus européen retient quatre indices dans les fumées : feu en espace clos, trouble de conscience, atteinte cardiovasculaire, surtout une hypotension inexpliquée, et lactate élevé (Anseeuw, 2013).</p><div class="key"><b>Conséquence pratique.</b> Aucun dosage rapide du cyanure n’est disponible : la décision d’administrer l’hydroxocobalamine repose sur la clinique.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cyanokit®</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/22828651/" target="_blank" rel="noopener">Anseeuw et al. 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34297873/" target="_blank" rel="noopener">Zuhra et Szabo 2022</a>.</p></template>
<template data-pop="j69-pid-medicamenteuse" data-title="Pneumopathie interstitielle médicamenteuse"><p class="lab">Définition et fréquence</p><p>Pneumopathie interstitielle causée par un médicament, avec inflammation et parfois fibrose. Elle représente 3 à 5 % des pneumopathies interstitielles ; les anticancéreux en sont la première cause, suivis des antirhumatismaux, de l’amiodarone et des antibiotiques (Conte, 2022).</p><p class="lab">Mécanismes</p><p>Réaction immunitaire après modification haptène de protéines tissulaires ou dépôts d’immuns complexes ; toxicité directe sur les cellules épithéliales et endothéliales, décrite avec la bléomycine et l’amiodarone.</p><p class="lab">Diagnostic</p><p>Aucun critère clinique, biologique, radiologique ou histologique n’est pathognomonique. Le diagnostic repose sur l’exposition à un médicament connu pour sa toxicité pulmonaire et sur l’exclusion des autres causes (Spagnolo, ERS 2022). Le tableau va de symptômes légers à une insuffisance respiratoire rapidement progressive.</p><div class="key"><b>Conséquence pratique.</b> L’arrêt définitif du médicament est la mesure essentielle ; pour certains anticancéreux sans alternative, une réintroduction se discute en équipe.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35332071/" target="_blank" rel="noopener">Spagnolo et al. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></template>
<template data-pop="j69-pneumopathie-radique" data-title="Pneumopathie radique"><p class="lab">Définition</p><p>Phase aiguë, avant six mois, de la lésion pulmonaire due aux rayonnements ionisants ; la phase chronique, au-delà de six mois, est la fibrose radique. La pneumopathie apparaît le plus souvent quatre à douze semaines après l’irradiation.</p><p class="lab">Clinique</p><p>Dyspnée et toux, nouvelles ou aggravées, chez 20 à 40 % des patients atteints ; fébricule, crépitants, frottement pleural ; hypoxémie dans les formes sévères.</p><p class="lab">Imagerie</p><p>Verre dépoli habituellement limité au champ d’irradiation, pouvant évoluer vers une condensation ; régression en six mois ou fibrose rétractile qui progresse jusqu’à 24 mois.</p><div class="key"><b>Gravité.</b> Elle se cote par la CTCAE ou l’échelle du groupe américain de radiothérapie oncologique ; le traitement par corticoïdes concerne les formes symptomatiques.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a>.</p></template>
<template data-pop="j69-rads" data-title="Syndrome de dysfonction réactive des voies aériennes (RADS)"><p class="lab">Définition</p><p>Décrit par Brooks en 1985 : hyperréactivité bronchique aiguë et persistante avec symptômes d’asthme après une exposition unique et massive à un irritant inhalé. Les symptômes apparaissent dans les 24 heures et durent au moins quelques mois. La définition initiale exigeait l’absence de maladie respiratoire chronique antérieure, un événement toxique univoque et l’exclusion d’autres causes (Suva, 2026).</p><p class="lab">Phénotypes de l’EAACI</p><p>Asthme induit par les irritants <b>certain</b> (début en quelques heures après une exposition unique très intense, correspondant au RADS), <b>probable</b> (expositions intenses répétées), <b>possible</b> (exposition chronique modérée, lien seulement épidémiologique).</p><p class="lab">Exemples et pronostic</p><p>Chlore, ammoniac, dioxyde de soufre, fumées d’incendie, mélanges de détergents, gaz lacrymogène. Après l’effondrement du World Trade Center, près de 16 % des sauveteurs fortement exposés ont développé un asthme d’irritation, parfois après des jours ou des semaines. Près de 70 % des patients gardent une hyperréactivité des années plus tard.</p><p class="src">Références : <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24854136/" target="_blank" rel="noopener">Vandenplas et al., EAACI 2014</a>.</p></template>
<template data-pop="j69-lipidique" data-title="Pneumopathie lipidique exogène"><p class="lab">Définition</p><p>Accumulation de lipides dans les alvéoles. La forme exogène résulte le plus souvent de l’aspiration de substances huileuses ; la forme endogène accompagne une obstruction bronchique, un cancer ou une maladie inflammatoire (Singla, 2026).</p><p class="lab">Imagerie</p><p>Verre dépoli, condensation, aspect en « crazy paving », nodules ou masse qui peut simuler un cancer. Les opacités de densité graisseuse sont caractéristiques mais souvent absentes ; le lavage broncho-alvéolaire et l’histologie sont évocateurs sans être spécifiques.</p><p class="lab">Traitement</p><p>Supprimer l’exposition, réduire le risque d’aspiration, assurer les soins de soutien et traiter une infection surajoutée ; corticoïdes et lavage thérapeutique ont été employés dans des cas graves sélectionnés.</p><div class="trap"><span class="k">Piège</span> La BTS exclut explicitement la pneumopathie lipidique de la pneumonie d’aspiration : l’antibiotique ne la traite pas.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42468912/" target="_blank" rel="noopener">Singla et al. 2026 (résumé)</a> ; <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-toxinfo" data-title="Tox Info Suisse"><p class="lab">Rôle</p><p>Centre suisse d’information toxicologique, joignable jour et nuit au 145, ou au +41 44 251 51 51 depuis l’étranger. En 2025, il a traité 44 736 demandes, dont 229 consultations pour gaz de fumée et 53 pour monoxyde de carbone ; les produits blanchissants ont motivé 290 consultations.</p><p class="lab">Informations à préparer</p><p>Le produit, la voie (avalé, inhalé, projeté, contact cutané), la dose maximale, le moment, les symptômes et les premières mesures, ainsi qu’un numéro de rappel. Le produit ou sa photographie accompagne le patient.</p><div class="key"><b>Conséquence pratique.</b> Le centre publie des fiches de traitement destinées aux médecins, dont celle des cyanures (janvier 2026) ; ses données ont conduit à rendre plus sûres les huiles de lampe et les sprays d’imprégnation.</div><p class="src">Références : <a href="https://www.toxinfo.ch/notruf-145_fr" target="_blank" rel="noopener">Tox Info Suisse, numéro d’urgence 145</a> ; <a href="https://www.toxinfo.ch/jahresberichte_de" target="_blank" rel="noopener">rapport annuel 2025 et annexe</a>.</p></template>
<template data-pop="j69-suva" data-title="Maladie professionnelle respiratoire : reconnaissance par l’assurance-accidents"><p class="lab">Deux voies</p><p>Selon l’article 9 de la loi fédérale sur l’assurance-accidents, une maladie est reconnue si elle figure, ou sa substance, dans la liste de l’annexe 1 de l’ordonnance et si l’activité professionnelle en est la cause prépondérante, au moins 50 % (risque relatif d’au moins 2). Une maladie hors liste est reconnue si la part professionnelle atteint au moins 75 % (risque relatif d’au moins 4).</p><p class="lab">Trois conditions</p><p>Une atteinte à la santé qui exige un examen ou un traitement ou provoque une incapacité de travail ; une personne assurée obligatoirement ; une annonce à l’assureur par l’employeur, l’assuré ou le médecin avec l’accord du patient.</p><p class="lab">Conséquences</p><p>Prise en charge des frais sans franchise ni quote-part, indemnités journalières, rente ou indemnité pour atteinte à l’intégrité ; décision d’inaptitude si l’exposition doit cesser. L’aggravation durable et objectivée d’un asthme préexistant peut aussi être reconnue.</p><p class="src">Référence : <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026, chapitres 2 et 7</a>.</p></template>
<template data-pop="j69-deglutition" data-title="Déglutition normale"><p class="lab">Trois phases</p><p>Phase orale volontaire : lèvres, langue et dents forment le bol et le propulsent. Phase pharyngée : la base de langue pousse le bol, le larynx s’élève et avance, l’épiglotte bascule jusqu’aux aryténoïdes, les cordes vocales se ferment, le sphincter supérieur de l’œsophage s’ouvre. Phase œsophagienne : péristaltisme autonome.</p><p class="lab">Coordination respiratoire</p><p>La respiration s’arrête pendant la phase pharyngée ; une expiration précède et suit habituellement la déglutition. Chez certains sujets âgés, une inspiration pendant la déglutition favorise l’aspiration.</p><div class="key"><b>Conséquence pratique.</b> Un adulte produit environ 1,5 L de salive par jour : le patient à jeun continue d’avaler et peut aspirer sa propre salive.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, figure 1</a>.</p></template>
<template data-pop="j69-toux" data-title="Toux efficace"><p class="lab">Trois conditions</p><p>Une inspiration jusqu’à 85 à 90 % de la capacité pulmonaire totale ; une fermeture glottique d’environ 0,2 seconde pendant que les muscles expiratoires élèvent la pression intrapleurale au-delà de 190 cmH₂O ; une ouverture brutale qui produit un débit de pointe de toux élevé.</p><p class="lab">Mesure</p><p>Le débit de pointe de toux se mesure simplement au lit. Une valeur inférieure à 270 L/min conduit à une évaluation plus complète et à l’apprentissage de techniques d’aide à la toux.</p><p class="lab">Causes d’inefficacité</p><p>Conscience abaissée, lésion du tronc cérébral, antitussifs dont les opiacés, paralysie récurrentielle, candidose des cordes vocales, sensibilité pharyngolaryngée diminuée, faiblesse des muscles respiratoires.</p><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-silencieuse" data-title="Aspiration silencieuse"><p>Une aspiration est dite silencieuse lorsqu’elle ne provoque ni raclement ni toux visibles. Elle survient chez les patients dont la sensibilité laryngopharyngée ou la vigilance est diminuée, et elle est fréquente chez le sujet âgé, dont la sensibilité pharyngée est réduite ; la BTS estime que les troubles de la déglutition sont largement sous-estimés pour cette raison.</p><p class="lab">Mise en évidence</p><p>En vidéofluoroscopie, l’aspiration est définie par du baryum visible sous les vraies cordes vocales ; elle est silencieuse en l’absence de toux. Un examen unique peut la manquer, car l’aspiration est épisodique.</p><div class="key"><b>Conséquence pratique.</b> L’absence de toux pendant le repas ne rassure pas ; une suspicion d’aspiration silencieuse ou des pneumonies récidivantes justifient une évaluation logopédique.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-solubilite" data-title="Solubilité des gaz et siège de la lésion"><p>Le siège d’une lésion d’inhalation dépend de la solubilité du gaz dans l’eau et, pour les particules, de leur diamètre aérodynamique ; gaz et particules ultrafines peuvent aussi franchir la membrane alvéolo-capillaire et agir à distance (Akgün et Nemery, 2026).</p><p class="lab">Conséquence clinique</p><p>Un gaz très soluble irrite d’emblée les voies aériennes supérieures. Un gaz peu soluble atteint les alvéoles : le dioxyde d’azote provoque des lésions par radicaux libres, retardées de 3 à 30 heures (Perez-Lauterbach, 2019), et le phosgène un œdème pulmonaire après un intervalle où le patient se sent bien (Vaish, 2013).</p><div class="trap"><span class="k">Piège</span> L’absence de gêne immédiate après l’inhalation d’un gaz peu soluble ne permet pas de renvoyer le patient sans surveillance.</div><p class="src">Références : <a href="https://doi.org/10.4274/balkanmedj.galenos.2026.2026-7-35" target="_blank" rel="noopener">Akgün et Nemery 2026 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31060842/" target="_blank" rel="noopener">Perez-Lauterbach et al. 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3841534/" target="_blank" rel="noopener">Vaish et al. 2013</a>.</p></template>
<template data-pop="j69-facteurs-aspiration" data-title="Facteurs de risque de pneumonie d’aspiration (BTS, tableau 1)"><table class="t"><tr><th>Domaine</th><th>Facteurs</th></tr><tr><td>Général</td><td>Âge supérieur à 60 ans, vie en institution (actuelle ou dans les 90 derniers jours), tabac, dénutrition ou surpoids, décubitus prolongé, alimentation pressée</td></tr><tr><td>Conscience abaissée</td><td>Arrêt cardiaque, traumatisme crânien, opiacés et autres antalgiques, antipsychotiques, sédatifs, benzodiazépines, antiépileptiques, antihistaminiques, baclofène, alcool</td></tr><tr><td>Neurologique</td><td>Accident vasculaire cérébral, démence, maladie de Parkinson, sclérose latérale amyotrophique, sclérose en plaques, paralysie cérébrale, délirium</td></tr><tr><td>Muscle</td><td>Sarcopénie, myopathies, myasthénie</td></tr><tr><td>Digestif haut</td><td>Cancer œsogastrique, achalasie, reflux, hernie hiatale, gastroparésie, vomissements répétés</td></tr><tr><td>Bouche et larynx</td><td>Cancer, paralysie des cordes vocales, sécheresse buccale, hypersialorrhée, caries, plaque dentaire, candidose</td></tr><tr><td>Instrumentation</td><td>Endoscopie digestive, sonde nasogastrique, gastrostomie, sonde d’intubation, masque laryngé</td></tr></table><p>La BTS signale les facteurs modifiables : sédatifs, hygiène buccale, position, alimentation, nutrition. Les inhibiteurs de la pompe à protons, qui élèvent le pH gastrique, sont associés aux pneumonies.</p><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, tableau 1</a>.</p></template>
<template data-pop="j69-chlore" data-title="Chlore et produits de nettoyage"><p>L’eau de Javel mélangée à un acide dégage du chlore : c’est la cause des « accidents professionnels avec détergents » que décrit la Suva (2026). L’exposition massive au chlore figure parmi les causes classiques de RADS. D’autres mélanges de produits ménagers produisent des chloramines, catégorie d’exposition jugée sous-estimée (Akgün et Nemery, 2026).</p><p class="lab">Données suisses</p><p>En 2025, Tox Info Suisse a donné 290 consultations pour produits blanchissants et 792 pour détartrants et adoucissants.</p><div class="key"><b>Conséquence pratique.</b> Le médecin demande quels produits ont été mélangés, dans quel local et combien de temps ; il prévoit un contrôle pneumologique en cas d’exposition symptomatique.</div><p class="src">Références : <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026</a> ; <a href="https://www.toxinfo.ch/jahresberichte_de" target="_blank" rel="noopener">Tox Info Suisse, annexe 2025</a>.</p></template>
<template data-pop="j69-no2" data-title="Dioxyde d’azote : ensilage et explosifs"><p>Le dioxyde d’azote est produit par le métabolisme bactérien anaérobie des matières organiques, comme l’ensilage, et par la détonation d’explosifs. Il provoque une lésion pulmonaire par radicaux libres, qui peut être retardée de 3 à 30 heures et évoluer vers un SDRA mortel (Perez-Lauterbach, 2019). La maladie des ensileurs survient après exposition aux gaz d’un silo récemment rempli ; elle reste évitable (Amaza, 2020).</p><p class="lab">Conduite</p><p>La surveillance est plus prolongée que ne le suggère l’état initial. Dans une série de trois patients, le plus exposé a eu besoin d’une intubation, le moins exposé n’avait qu’une anomalie d’imagerie.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31060842/" target="_blank" rel="noopener">Perez-Lauterbach et al. 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30879430/" target="_blank" rel="noopener">Amaza et Kreidy 2020 (résumé)</a>.</p></template>
<template data-pop="j69-phosgene" data-title="Phosgène"><p>Gaz très toxique auquel des travailleurs peuvent être exposés accidentellement ; il se forme aussi lors d’incendies impliquant des plastiques et des solvants chlorés, ce qui concerne les intervenants d’urgence. L’inhalation irrite d’abord les voies respiratoires ; le patient se sent ensuite bien, puis peut mourir le lendemain d’un œdème pulmonaire.</p><div class="key"><b>Conduite proposée.</b> Toute personne exposée est hospitalisée pour au moins 24 heures d’observation, en raison du risque d’insuffisance respiratoire et de SDRA retardés. Cette proposition repose sur une revue et une série de dix cas, non sur une recommandation européenne.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3841534/" target="_blank" rel="noopener">Vaish et al., J Emerg Trauma Shock 2013</a>.</p></template>
<template data-pop="j69-sprays" data-title="Sprays imperméabilisants"><p>Fin 2002 et début 2003, Tox Info Suisse a enregistré une série de réactions respiratoires graves après l’usage de sprays d’imprégnation textile. Une modification de la composition produisait des gouttelettes plus fines, qui pénétraient profondément dans les voies aériennes et pouvaient conduire à l’hospitalisation. Les produits ont été identifiés rapidement, autorités et fabricants informés.</p><p>Akgün et Nemery (2026) rangent les agents fluorés des sprays imperméabilisants parmi les causes sous-reconnues de lésions d’inhalation.</p><div class="key"><b>Conséquence pratique.</b> Devant une détresse respiratoire après bricolage ou entretien de vêtements en espace clos, le médecin demande quel spray a été utilisé et appelle le 145.</div><p class="src">Références : <a href="https://www.toxinfo.ch/jahresberichte_de" target="_blank" rel="noopener">Tox Info Suisse, rapport annuel 2025, page 7</a> ; <a href="https://doi.org/10.4274/balkanmedj.galenos.2026.2026-7-35" target="_blank" rel="noopener">Akgün et Nemery 2026 (résumé)</a>.</p></template>
<template data-pop="j69-fumees" data-title="Inhalation de fumées d’incendie"><p class="lab">Trois processus</p><p>Lésion thermique des voies aériennes supérieures, irritation chimique des voies aériennes inférieures et des alvéoles, toxicité systémique des asphyxiants absorbés (Akgün et Nemery, 2026).</p><p class="lab">Gravité</p><p>La plupart des décès liés aux incendies sont dus à l’inhalation de fumées plutôt qu’aux brûlures ; du cyanure est retrouvé dans le sang de la plupart des victimes (Mintegi, 2013). Toute victime d’incendie en espace clos est suspecte d’intoxication au monoxyde de carbone et au cyanure.</p><p class="lab">Voies aériennes</p><p>L’intubation inutile est évitée ; la nasolaryngoscopie guide la décision. Chez l’intubé, la bronchoscopie retire les moules et évalue l’étendue des lésions ; aucun mode ventilatoire particulier n’a démontré sa supériorité (Gigengack, 2020).</p><p class="src">Références : <a href="https://doi.org/10.4274/balkanmedj.galenos.2026.2026-7-35" target="_blank" rel="noopener">Akgün et Nemery 2026 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24196100/" target="_blank" rel="noopener">Mintegi et al., consensus pédiatrique européen 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33060384/" target="_blank" rel="noopener">Gigengack et al. 2020</a>.</p></template>
<template data-pop="j69-dose-pulmonaire" data-title="Facteurs de risque de pneumopathie radique"><p class="lab">Dose</p><p>La dose totale reçue par le poumon est le principal facteur. Le pourcentage de poumon sain recevant au moins 20 Gy, des paramètres de faible dose et la dose pulmonaire moyenne sont associés au risque. En radiothérapie stéréotaxique, un volume recevant 20 Gy supérieur à 10 % et une dose moyenne supérieure à 6 Gy augmentent le risque de grade 2 ou plus.</p><p class="lab">Traitements associés et terrain</p><p>La toxicité pulmonaire est plus fréquente sous chimioradiothérapie qu’en monothérapie (32 % contre 6 %). Une pneumopathie interstitielle visible avant l’irradiation augmente nettement le risque de pneumopathie radique, y compris mortelle. Au-delà de 70 ans, les formes sévères sont plus fréquentes (6 % contre 1 %).</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a>.</p></template>
<template data-pop="j69-hydrocarbures" data-title="Hydrocarbures et huiles de lampe chez l’enfant"><p>L’ingestion et l’aspiration accidentelles d’hydrocarbures sont fréquentes chez l’enfant ; une pneumopathie survient chez jusqu’à 40 % d’entre eux. Deux enfants de 21 et 24 mois ont présenté, après une huile de lampe très fluide, des infiltrats confluents puis des pneumatocèles, guéris en trois et quatre semaines ; l’un des deux n’avait aucun symptôme les premiers jours (Thalhammer, 2005).</p><p class="lab">Prévention en Suisse</p><p>Après des complications pulmonaires graves chez de jeunes enfants, une classification de danger plus stricte, des fermetures de sécurité et l’interdiction des récipients transparents, des colorants et des parfums ont été imposées ; des huiles à base de colza ont été encouragées (Tox Info Suisse).</p><div class="key"><b>Conséquence pratique.</b> Toute ingestion d’huile de lampe ou de carburant chez un enfant justifie un appel au 145 et une surveillance respiratoire, même s’il est asymptomatique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15847196/" target="_blank" rel="noopener">Thalhammer et al. 2005</a> ; <a href="https://www.toxinfo.ch/jahresberichte_de" target="_blank" rel="noopener">Tox Info Suisse, rapport annuel 2025</a>.</p></template>
<template data-pop="j69-presentation-fragile" data-title="Présentation gériatrique"><p>Chez le patient âgé ou fragile, la pneumonie d’aspiration peut se révéler par un syndrome de fragilité : confusion hypoactive, chute, perte de mobilité. La réponse inflammatoire est souvent émoussée : fièvre et hyperleucocytose peuvent manquer.</p><div class="key"><b>Conséquence pratique.</b> Devant une confusion ou une chute inexpliquée chez un patient à risque, le médecin ausculte, mesure la SpO₂ et demande une radiographie ; il recueille le témoignage d’un proche ou d’un soignant.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, section Diagnosis</a>.</p></template>
<template data-pop="j69-pneumotox" data-title="Pneumotox"><p>Base de données en ligne des toxicités respiratoires des médicaments, citée comme référence par l’avis d’experts de Conte et collaborateurs (2022). Elle recense, par molécule, les atteintes décrites : pneumopathie interstitielle, pneumopathie organisée, œdème, hémorragie, bronchospasme, atteinte pleurale.</p><div class="key"><b>Mode d’emploi.</b> Devant un infiltrat inexpliqué, le médecin y vérifie chaque médicament pris dans les mois précédents, y compris les traitements anciens ou intermittents.</div><p class="src">Références : <a href="https://www.pneumotox.com" target="_blank" rel="noopener">Pneumotox</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></template>
<template data-pop="j69-rappel" data-title="Pneumopathie de rappel radique"><p>Réaction inflammatoire aiguë dans un poumon antérieurement irradié, déclenchée par un anticancéreux systémique. Le délai entre le début du traitement et la réaction va de quelques heures à plusieurs années, et la gravité ne dépend pas de l’intervalle depuis la radiothérapie. Les taxanes et les anthracyclines sont les plus souvent en cause ; les inhibiteurs de points de contrôle immunitaire ont été associés à davantage de pneumopathies sévères dans un poumon irradié.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a>.</p></template>
<template data-pop="j69-examen-buccal" data-title="Examen et soins de la bouche"><p>La BTS demande un examen buccal chez tout patient hospitalisé à risque de pneumonie d’aspiration ou suspect d’en avoir une, et au moins chaque semaine chez les résidents d’établissements de soins. Le médecin recherche une infection comme une candidose, l’état de la dentition, des résidus alimentaires et la propreté des muqueuses ; toute anomalie est traitée.</p><p class="lab">Exemples</p><p>La candidose orale, fréquente chez le diabétique, le patient cancéreux ou sous antibiotiques ou corticoïdes, se traite par nystatine locale. L’hypersialorrhée peut relever du glycopyrronium, de la scopolamine transdermique, de l’atropine orale ou de la toxine botulique.</p><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, section Oral care</a>.</p></template>
<template data-pop="j69-suie" data-title="Suie et victime de fumées"><p>La présence de suie autour de la bouche, du nez ou dans l’oropharynx témoigne d’une inhalation de fumées. Associée à une exposition en espace clos et à un trouble de conscience, elle fait administrer l’hydroxocobalamine sans attendre le dosage du lactate. Une hypotension ou un lactate d’au moins 10 mmol/L renforcent fortement la suspicion d’intoxication au cyanure.</p><div class="trap"><span class="k">Piège</span> Toutes les victimes de fumées n’ont pas de cyanure ; brûlures, traumatismes et autres toxiques peuvent expliquer le tableau.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cyanokit®, rubrique Mises en garde</a>.</p></template>
<template data-pop="j69-segments" data-title="Segments atteints par l’aspiration"><p>Le matériel aspiré suit la pesanteur. Chez un patient resté debout ou assis, il gagne les segments basaux des lobes inférieurs ; chez un patient surtout couché, le segment apical du lobe inférieur ou le segment postérieur du lobe supérieur. Le poumon droit est plus souvent atteint (BTS).</p><p class="lab">Pourquoi à droite</p><p>L’enseignement classique invoque une bronche souche droite plus verticale, plus courte et plus large. Ces différences existent en moyenne, mais elles ne distinguent pas les patients dont un corps étranger s’est logé à droite ; la longueur et le volume bronchiques pourraient compter davantage (Yildiran, 2026).</p><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42194877/" target="_blank" rel="noopener">Yildiran et al. 2026 (résumé)</a>.</p></template>
<template data-pop="j69-tdm" data-title="Tomodensitométrie thoracique"><p class="lab">Aspiration</p><p>La radiographie méconnaît jusqu’à 25 % des pneumonies d’aspiration visibles en TDM. La BTS propose la TDM lorsque la radiographie reste douteuse ou lorsqu’elle permet de mieux écarter un autre diagnostic.</p><p class="lab">Atteintes médicamenteuses</p><p>La TDM en haute résolution reconnaît les aspects de pneumopathie interstitielle aiguë, de pneumopathie organisée, de pneumopathie interstitielle non spécifique, de pneumopathie d’hypersensibilité et de SDRA. Dans les formes de grade 4, elle montre un verre dépoli diffus et bilatéral, souvent avec des lobules épargnés et parfois un aspect en « crazy paving » (Conte, 2022).</p><p class="lab">Atteintes radiques</p><p>Le verre dépoli est habituellement limité au champ d’irradiation ; la fibrose suit le trajet du faisceau.</p><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a>.</p></template>
<template data-pop="j69-pct" data-title="Procalcitonine et CRP"><p>La procalcitonine a été évaluée pour distinguer la pneumonie d’aspiration d’une pneumopathie non infectieuse chez des patients de soins intensifs, avec de mauvaises performances (BTS). En pneumonie communautaire légère, la SSI admet de ne pas prescrire d’antibiotique si la procalcitonine est inférieure à 0,25 µg/L, et propose CRP ou procalcitonine après trois à quatre jours pour suivre la réponse. Dans la pneumonie associée à l’accident vasculaire cérébral, la CRP plasmatique peut apporter une valeur diagnostique supplémentaire (ESO, 2026).</p><div class="trap"><span class="k">Piège</span> Une procalcitonine basse ne prouve pas qu’une aspiration est stérile ; la décision repose sur l’évolution clinique à 24–48 heures.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42095755/" target="_blank" rel="noopener">ESO 2026</a>.</p></template>
<template data-pop="j69-lactate" data-title="Lactate et cyanure"><p>Le cyanure empêche la cellule d’utiliser l’oxygène ; elle produit alors du lactate. L’acidose lactique est un marqueur parlant et rapidement disponible de l’intoxication au cyanure (Tox Info Suisse, 2026). Un lactate supérieur à 8 mmol/L accompagne l’intoxication ; chez une victime de fumées, le seuil d’alerte est d’au moins 10 mmol/L, car le monoxyde de carbone contribue aussi à l’acidose lactique (information professionnelle Cyanokit).</p><div class="key"><b>Conséquence pratique.</b> Le lactate soutient la décision ; il ne la retarde pas si la victime a été exposée en espace clos, porte de la suie et a un trouble de conscience.</div><p class="src">Références : <a href="https://www.toxinfo.ch/behandlungsschemata" target="_blank" rel="noopener">Tox Info Suisse, Vergiftungen durch Cyanide, 2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cyanokit®</a>.</p></template>
<template data-pop="j69-abces" data-title="Abcès pulmonaire et empyème après aspiration"><p>Lorsque la pneumonie d’aspiration ne s’améliore pas, la BTS demande de rechercher un épanchement pleural, un empyème ou un abcès pulmonaire, ou une autre maladie. La suspicion d’abcès ou d’empyème, une expectoration fétide ou une maladie dentaire évidente justifient une couverture anaérobie, par un agent actif sur les anaérobies ou par l’ajout de métronidazole.</p><p class="lab">Lacune nommée</p><p>Les sources lues pour ce cours ne fixent pas la durée du traitement d’un abcès pulmonaire ; la SSI réserve la durée habituelle aux pneumonies sans obstruction bronchique. La décision relève de l’avis infectiologique.</p><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI 2026</a>.</p></template>
<template data-pop="j69-radiographie" data-title="Radiographie thoracique"><p>La SSI exige une imagerie chez tout patient hospitalisé pour suspicion de pneumonie, par radiographie de face et de profil ; l’échographie pulmonaire est une alternative si un opérateur qualifié est disponible, mais elle ne voit pas les pneumonies centrales. Dans l’aspiration, la condensation siège volontiers dans les segments déclives.</p><div class="trap"><span class="k">Piège</span> Jusqu’à 25 % des pneumonies d’aspiration vues en TDM échappent à la radiographie ; une radiographie normale n’exclut pas le diagnostic chez un patient fébrile et hypoxémique.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI 2026</a> ; <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-microbiologie" data-title="Prélèvements microbiologiques"><p>Chez le patient hospitalisé, la SSI demande deux paires d’hémocultures, les antigènes urinaires de légionelle et de pneumocoque, et un examen direct avec culture de l’expectoration si elle peut être analysée dans les quatre heures. La BTS demande expectoration et hémocultures dans les formes modérées à sévères, sans retarder l’antibiotique au-delà des quelques minutes nécessaires.</p><p class="lab">Rendement</p><p>Un germe est rarement identifié : l’expectoration manque, la toux est faible, l’antibiotique précède souvent le prélèvement. Dans les pneumonies après accident vasculaire cérébral, les cultures isolent surtout des entérobactéries (21,8 %, dont <i>Klebsiella pneumoniae</i> 12,8 %), <i>Staphylococcus aureus</i> (10,1 %) et <i>Pseudomonas aeruginosa</i> (6 %) (ESO, 2026).</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI 2026</a> ; <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42095755/" target="_blank" rel="noopener">ESO 2026</a>.</p></template>
<template data-pop="j69-evaluation-deglutition" data-title="Évaluer la déglutition"><p class="lab">Évaluation logopédique</p><p>Le logopédiste recueille l’histoire et examine la motricité bucco-faciale et les nerfs crâniens ; au moins deux composantes anormales sont associées à un risque d’aspiration plus élevé (BTS).</p><p class="lab">Examens de référence</p><p>La vidéofluoroscopie suit un bol baryté et cote la pénétration et l’aspiration sur l’échelle en huit points de Rosenbek ; un examen unique peut manquer une aspiration épisodique. La nasofibroscopie de déglutition visualise directement des bols de textures variées, les résidus des vallécules et des sinus piriformes, et l’aspiration des sécrétions. Ces deux examens sont les références (BTS).</p><p class="lab">Dépistage</p><p>Aucun outil validé ne couvre tous les patients âgés hospitalisés ; après un accident vasculaire cérébral, le dépistage systématique est recommandé (ESO 2021).</p><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/34746431/" target="_blank" rel="noopener">ESO-ESSD 2021</a>.</p></template>
<template data-pop="j69-spirometrie" data-title="Spirométrie après une inhalation"><p>Après une inhalation d’irritant, la spirométrie avec test bronchodilatateur recherche une obstruction réversible ; la recherche d’une hyperréactivité bronchique non spécifique caractérise le RADS, défini par une hyperréactivité aiguë et persistante. Les tests allergologiques restent négatifs, car aucune sensibilisation n’est en cause (Suva, 2026).</p><div class="key"><b>Conséquence pratique.</b> Après un accident d’inhalation grave, la Suva recommande un contrôle par un pneumologue pour dépister tôt l’asthme d’irritation ; le premier bilan sert de référence.</div><p class="src">Référence : <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026</a>.</p></template>
<template data-pop="j69-dep" data-title="Débits de pointe sériés"><p class="lab">Technique</p><p>Mesures plusieurs fois par jour, idéalement quatre fois (au lever, à midi, en début de soirée et au coucher), et en cas de symptômes ; au moins deux à trois semaines de travail et une à deux semaines sans exposition. Les appareils électroniques à enregistrement automatique améliorent la qualité des données.</p><p class="lab">Lecture</p><p>Des baisses systématiques les jours de travail, avec une variabilité qui peut dépasser 20 %, et une récupération pendant les congés sont caractéristiques. Une courbe stable n’exclut pas un asthme professionnel, car la sensibilité est limitée.</p><p class="src">Référence : <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026, d’après ERS et EAACI</a>.</p></template>
<template data-pop="j69-depistage-dysphagie" data-title="Dépistage de la dysphagie après un accident vasculaire cérébral"><p>Plus de 50 % des patients ont une dysphagie à la phase aiguë d’un accident vasculaire cérébral. L’ESO et la Société européenne des troubles de la déglutition (2021) recommandent, sur des preuves de qualité modérée, un dépistage chez tous les patients pour prévenir la pneumonie et la mortalité précoce, puis une évaluation instrumentale chez les patients repérés à risque (preuves de faible qualité).</p><div class="key"><b>Conséquence pratique.</b> Aucun aliment ni boisson n’est donné avant le dépistage ; un échec conduit à l’évaluation logopédique et à un plan nutritionnel.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/34746431/" target="_blank" rel="noopener">Dziewas et al., ESO-ESSD 2021</a>.</p></template>
<template data-pop="j69-hygiene-buccale" data-title="Hygiène bucco-dentaire"><p>Une bonne hygiène buccale semble réduire la pneumonie d’aspiration ; le brossage mécanique a été associé à moins de pneumonies et de décès. À l’hôpital et en établissement, la BTS recommande de brosser au moins deux fois par jour les dents, la langue et le palais avec une brosse souple et un dentifrice non moussant chez le patient dysphagique.</p><div class="trap"><span class="k">Piège</span> Les bâtonnets en mousse nettoient mal et peuvent être aspirés. La chlorhexidine en bain de bouche n’est retenue en réanimation que pour la chirurgie cardiaque.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, section Oral care</a>.</p></template>
<template data-pop="j69-nutrition" data-title="Nutrition et instruction « rien par la bouche »"><p>Une instruction de « rien par la bouche » ne doit jamais rester isolée : elle précise le plan de nutrition, les mesures pour restaurer la déglutition et la date de la prochaine évaluation. Chez un patient dont la dysphagie récente expose à un risque élevé et qui n’est pas en fin de vie, une alimentation par sonde nasogastrique dans les trois jours améliore l’état nutritionnel et le pronostic. La gastrostomie se discute si le risque persiste ou si la sonde est mal tolérée ; elle n’est pas forcément définitive.</p><p class="lab">Textures</p><p>Les liquides épaissis réduisent la pénétration et l’aspiration mais peuvent augmenter le résidu pharyngé ; les preuves restent faibles. Des boissons gazeuses froides peuvent être essayées.</p><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023, section Feeding</a>.</p></template>
<template data-pop="j69-iec" data-title="Inhibiteurs de l’enzyme de conversion et toux"><p>L’enzyme de conversion dégrade la substance P, médiateur du réflexe de toux, dont le taux local est abaissé chez les patients dysphagiques. Les inhibiteurs de l’enzyme de conversion ont réduit la pneumonie d’aspiration après accident vasculaire cérébral chez des patients chinois et japonais ; aucun bénéfice clair n’a été démontré chez les patients caucasiens, et un petit essai de lisinopril chez des patients nourris par sonde a été arrêté pour surmortalité.</p><div class="key"><b>Conséquence pratique.</b> En Suisse, ce traitement n’est pas un moyen de prévention validé ; la BTS le réserve aux patients chinois et japonais, avec surveillance de la pression artérielle.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-stop" data-title="Principe STOP"><p>Hiérarchie des mesures de prévention en santé au travail : <b>S</b>ubstitution du produit dangereux, mesures <b>T</b>echniques (aspiration, ventilation, confinement), mesures <b>O</b>rganisationnelles (durée d’exposition, séparation des zones, formation), <b>P</b>rotection individuelle. Les mesures de rang supérieur sont plus efficaces et plus durables ; le masque respiratoire n’est qu’un complément.</p><p class="lab">Exemple</p><p>L’introduction de gants sans latex et non poudrés a fortement réduit l’allergie au latex dans le secteur de la santé.</p><p class="src">Référence : <a href="https://www.suva.ch/3601-37.f" target="_blank" rel="noopener">Suva 2026, chapitre 7</a>.</p></template>
<template data-pop="j69-pneumopathie-organisee" data-title="Pneumopathie organisée"><p>Prolifération de tissu de granulation dans la lumière des bronchioles distales et des alvéoles : amas de tissu riche en collagène, fibroblastes et myofibroblastes, avec un infiltrat de lymphocytes et de plasmocytes. En TDM, elle donne des plages multifocales de verre dépoli et de condensation à prédominance périphérique, parfois un signe du halo inversé. C’est l’un des aspects des pneumopathies médicamenteuses ; l’amiodarone en est une cause rare.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cordarone®</a>.</p></template>
<template data-pop="j69-ctcae" data-title="Échelle CTCAE de la pneumopathie"><table class="t"><tr><th>Grade</th><th>Définition</th></tr><tr><td>1</td><td>Anomalies radiologiques sans symptôme</td></tr><tr><td>2</td><td>Symptômes légers, sans retentissement sur la qualité de vie</td></tr><tr><td>3</td><td>Symptômes qui limitent la vie quotidienne, oxygène possible</td></tr><tr><td>4</td><td>Symptômes sévères et invalidants, hospitalisation, ventilation possible</td></tr><tr><td>5</td><td>Décès</td></tr></table><p>Version 5.0 (2017), adaptée par Conte et collaborateurs. Cette échelle américaine décrit la gravité ; elle ne constitue pas une recommandation thérapeutique.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></template>
<template data-pop="j69-pneumocystose" data-title="Prophylaxie de la pneumocystose sous corticoïdes"><p>Arroyo-Hernández et collaborateurs recommandent une prophylaxie de la pneumocystose chez les patients traités par fortes doses de corticoïdes pour une pneumopathie radique et chez ceux qui ont des facteurs de risque. Le méthotrexate expose lui-même, rarement, à la pneumocystose (information professionnelle Metoject).</p><p class="lab">Lacune nommée</p><p>Les sources lues ne fixent ni le seuil de dose ni la durée qui déclenchent la prophylaxie dans ces indications ; la décision suit les protocoles locaux et le cours sur les pneumonies de l’immunodéprimé.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Metoject®</a>.</p></template>
<template data-pop="j69-ohb" data-title="Oxygénothérapie hyperbare (ECHM 2016)"><p class="lab">Recommandations</p><p>Oxygène à 100 % immédiatement chez tout intoxiqué au monoxyde de carbone (type 1, niveau C). Oxygénothérapie hyperbare dans l’intoxication au monoxyde de carbone (type 1, niveau B), en particulier chez tout patient avec trouble de conscience ou signe neurologique, cardiaque, respiratoire ou psychologique, quel que soit le taux de COHb à l’admission (type 1, niveau B). Oxygénothérapie hyperbare chez toute femme enceinte intoxiquée, quelle que soit sa présentation.</p><p class="lab">Formes mineures et tardives</p><p>Une intoxication mineure peut recevoir douze heures d’oxygène normobare ou une séance hyperbare (type 3, niveau B). L’hyperbarie n’est pas recommandée chez le patient asymptomatique vu plus de 24 heures après la fin de l’exposition (type 1, niveau C).</p><p class="src">Référence : <a href="https://www.eubs.org/?p=583" target="_blank" rel="noopener">Mathieu et al., Diving Hyperb Med 2017</a>.</p></template>
