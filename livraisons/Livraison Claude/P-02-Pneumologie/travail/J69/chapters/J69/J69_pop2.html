<template data-pop="j69-d-coamox" data-title="Amoxicilline-acide clavulanique"><p class="lab">Place</p><p>Premier choix de la pneumonie d’aspiration selon la SSI (2026) et la BTS (2023). L’information professionnelle suisse cite parmi les indications la pneumonie bactérienne, l’abcès pulmonaire et l’empyème.</p><p class="lab">Posologie adulte</p><p>Voie intraveineuse : 2,2 g en perfusion d’au moins 30 minutes trois à quatre fois par jour, jusqu’à six fois si nécessaire ; la SSI retient 2,2 g toutes les 8 heures. Clairance de 10 à 30 mL/min : 1,2 g puis 600 mg toutes les 12 heures ; inférieure à 10 mL/min : 600 mg toutes les 24 heures. Voie orale : la SSI retient 1 g toutes les 8 heures, soit le maximum de l’information professionnelle (3 × 1000 mg par jour), à prendre au début du repas.</p><p class="lab">Contre-indications et effets indésirables</p><p>Hypersensibilité aux pénicillines, aux céphalosporines ou à l’acide clavulanique ; ictère ou atteinte hépatique lors d’un traitement antérieur. Une diarrhée sévère, persistante ou sanglante fait rechercher une colite à <i>Clostridioides difficile</i>.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Co-Amoxi-Mepha i.v. (08.2026) et Co-Amoxicilline Spirig comprimés pelliculés (03.2026)</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI 2026</a>.</p></template>
<template data-pop="j69-d-ceftriaxone" data-title="Ceftriaxone"><p class="lab">Place</p><p>Alternative de la SSI dans la pneumonie d’aspiration, 2 g par jour, avec ou sans antianaérobie. La BTS signale que les céphalosporines ont été moins utilisées au Royaume-Uni pour limiter leurs effets écologiques.</p><p class="lab">Posologie</p><p>1 à 2 g une fois par jour, jusqu’à 4 g dans les infections sévères ; aucune adaptation sauf clairance inférieure à 10 mL/min, où la dose quotidienne ne dépasse pas 2 g. La demi-vie, d’environ 8 heures chez l’adulte, est deux à trois fois plus longue après 75 ans.</p><p class="lab">Contre-indications et limites</p><p>Hypersensibilité à la ceftriaxone ou à une céphalosporine ; risque accru en cas d’antécédent d’hypersensibilité aux bêtalactamines. Certaines souches de <i>Klebsiella pneumoniae</i> productrices de bêtalactamases plasmidiques sont résistantes.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Rocephin® (06.2025)</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI 2026</a> ; <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-d-anaerobies" data-title="Clindamycine et métronidazole"><p class="lab">Place</p><p>Ajoutés à la ceftriaxone selon la SSI (« avec ou sans ») ; la BTS limite la couverture anaérobie aux patients à haut risque : maladie dentaire ou parodontale, expectoration fétide, abcès ou empyème.</p><p class="lab">Clindamycine</p><p>600 mg toutes les 8 heures par voie orale ou intraveineuse (SSI), soit 1800 mg par jour, dans la fourchette des infections sévères de l’information professionnelle (1200 à 1800 mg) ; au plus 1200 mg par perfusion d’une heure. Contre-indiquée en cas d’hypersensibilité à la clindamycine ou à la lincomycine.</p><p class="lab">Métronidazole</p><p>500 mg toutes les 8 heures (SSI) ; l’information professionnelle orale retient 1,5 g par jour en trois prises dans les infections à anaérobies, associé à un antibiotique actif sur les aérobies. Effet antabuse : aucun alcool pendant le traitement. Prudence en cas de maladie neurologique ; arrêt si neuropathie.</p><div class="trap"><span class="k">Piège</span> Une couverture anaérobie étendue n’a pas réduit la mortalité et a augmenté les colites à <i>Clostridioides difficile</i> dans une cohorte de 3999 patients (Bai, 2024).</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Dalacin® C (07.2026) et Flagyl® (09.2025)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11251078/" target="_blank" rel="noopener">Bai et al. 2024</a>.</p></template>
<template data-pop="j69-d-levofloxacine" data-title="Lévofloxacine"><p class="lab">Place</p><p>Alternative en cas d’allergie à la pénicilline (BTS). En Suisse, son indication dans la pneumonie communautaire est réservée aux situations où les antibiotiques recommandés en première intention sont jugés inappropriés.</p><p class="lab">Posologie</p><p>500 mg une à deux fois par jour dans la pneumonie communautaire ; réduction si la clairance est inférieure à 50 mL/min.</p><p class="lab">Contre-indications et risques</p><p>Enfant et adolescent, grossesse, allaitement, épilepsie, antécédent de tendinopathie sous fluoroquinolone, hypersensibilité aux quinolones. Les fluoroquinolones exposent à des effets indésirables invalidants et parfois irréversibles touchant plusieurs organes, dont tendinites et ruptures tendineuses, et à un allongement de l’intervalle QT.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Tavanic® (08.2026)</a>.</p></template>
<template data-pop="j69-d-piptazo" data-title="Pipéracilline-tazobactam"><p class="lab">Place</p><p>Deuxième ligne en cas d’échec de la pneumonie d’aspiration, en concertation avec un infectiologue (BTS) ; option de la pneumonie associée à l’accident vasculaire cérébral au-delà du septième jour, qui suit les principes de la pneumonie nosocomiale (ESO 2026).</p><p class="lab">Posologie</p><p>4,5 g toutes les 8 heures chez l’adulte de fonction rénale normale ; la dose se réduit selon le débit de filtration glomérulaire ; chez l’hémodialysé, une dose supplémentaire suit chaque séance.</p><p class="lab">Contre-indication</p><p>Allergie connue aux bêtalactamines ou aux inhibiteurs de bêtalactamases.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Piperacillin/Tazobactam Fresenius i.v. (03.2026)</a> ; <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j69-d-hydroxocobalamine" data-title="Hydroxocobalamine (Cyanokit)"><p class="lab">Mécanisme</p><p>Chaque molécule fixe un ion cyanure à la place du ligand hydroxo lié au cobalt ; la cyanocobalamine formée est stable, non toxique et éliminée dans l’urine.</p><p class="lab">Indication et posologie</p><p>Intoxication au cyanure confirmée ou suspectée, à tout âge. Adulte : 5 g en perfusion de 15 minutes, deuxième dose de 5 g selon la gravité et la réponse, total maximal de 10 g. Enfant : 70 mg/kg (5 g au plus), total maximal de 140 mg/kg. Aucune contre-indication ; aucune adaptation hépatique, rénale ou gériatrique. Utilisable pendant la grossesse.</p><p class="lab">Effets indésirables</p><p>Coloration rouge de la peau jusqu’à 15 jours et des urines jusqu’à 35 jours ; élévation transitoire de la pression artérielle ; insuffisance rénale aiguë avec oxalate de calcium urinaire ; interférences de laboratoire et alarme des générateurs d’hémodialyse.</p><div class="key"><b>Règle d’usage.</b> L’antidote ne remplace ni l’oxygénothérapie ni la libération des voies aériennes ; il ne les retarde pas.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cyanokit® (09.2018)</a> ; <a href="https://www.toxinfo.ch/behandlungsschemata" target="_blank" rel="noopener">Tox Info Suisse 2026</a>.</p></template>
<template data-pop="j69-d-corticoides" data-title="Glucocorticoïdes systémiques"><p class="lab">Place</p><p>Pneumopathies médicamenteuses à partir du grade 2 et pneumopathies radiques symptomatiques. Ces situations ne figurent pas parmi les indications de l’information professionnelle de la prednisone, qui cite l’alvéolite allergique et la sarcoïdose : l’usage est hors indication.</p><p class="lab">Schémas publiés</p><p>Pneumopathie médicamenteuse : prednisone 1 à 2 mg/kg par jour au grade 2, décroissance sur 4 à 6 semaines ; méthylprednisolone 1 à 2 mg/kg par jour au grade 3 ; 2 mg/kg par jour ou bolus de 500 à 1000 mg pendant 3 jours au grade 4 (Conte, 2022). Trastuzumab déruxtécan : au moins 1 mg/kg par jour pendant 14 jours, décroissance sur au moins 4 semaines. Pneumopathie radique : environ 60 mg de prednisone par jour pendant deux semaines, puis −10 mg par semaine (consensus Delphi).</p><p class="lab">Précautions</p><p>Des hépatites, parfois mortelles, ont été rapportées avec la méthylprednisolone à partir d’environ 1 g par jour. Contre-indications d’un traitement prolongé : ulcère digestif, ostéoporose sévère, diabète de type 2, hypertension sévère, antécédents psychiatriques, infections virales actives, mycoses systémiques, glaucome.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Prednisone Streuli (06.2026) et Solu-Medrol® (08.2025)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></template>
<template data-pop="j69-d-amiodarone" data-title="Amiodarone : toxicité pulmonaire"><p class="lab">Fréquence et formes</p><p>Sous amiodarone orale, la toxicité pulmonaire touche 2 à 7 % des patients et elle est mortelle dans environ 10 % des cas ; le risque est lié à la dose cumulée plutôt qu’à la dose quotidienne. Des formes aiguës ont été décrites après 8 à 14 jours. Formes : pneumopathie d’hypersensibilité, pneumopathie alvéolaire ou interstitielle, fibrose, rarement pneumopathie organisée, SDRA postopératoire, hémorragie pulmonaire.</p><p class="lab">Surveillance et conduite</p><p>Radiographie et fonction pulmonaire avant le traitement ; contrôle radiologique et fonctionnel devant une dyspnée d’effort ou une altération de l’état général. Le traitement est réévalué, car la pneumopathie est en général réversible si l’arrêt est précoce ; une corticothérapie peut être proposée. La clinique s’améliore en 3 à 4 semaines, l’imagerie en plusieurs mois. La demi-vie de 20 à 100 jours prolonge l’imprégnation après l’arrêt.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Cordarone® comprimés (04.2024)</a>.</p></template>
<template data-pop="j69-d-methotrexate" data-title="Méthotrexate : toxicité pulmonaire"><p>Une alvéolite ou pneumonie interstitielle est un effet indésirable fréquent ; fièvre, toux sèche irritative, dyspnée et hypoxémie avec infiltrat radiologique en sont les signes typiques. Elle peut survenir à toutes les doses. Des hémorragies alvéolaires ont été rapportées dans les indications rhumatologiques ; une pneumocystose est possible.</p><div class="key"><b>Conduite.</b> Toute toux sèche ou pneumonie atypique sous méthotrexate impose l’interruption du traitement, l’exclusion d’une infection et une surveillance attentive.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Metoject® (02.2025)</a>.</p></template>
<template data-pop="j69-d-nitrofurantoine" data-title="Nitrofurantoïne : réactions pulmonaires"><p class="lab">Trois formes</p><p><b>Aiguë</b> : tableau d’œdème pulmonaire allergique avec dyspnée subite, toux, fièvre et infiltrats, quelques heures après la dernière prise ; régression en 2 à 3 semaines après l’arrêt. <b>Subaiguë</b> : vers un mois de traitement, dyspnée, orthopnée, fièvre, toux, pneumonie interstitielle ou fibrose ; amélioration très lente. <b>Chronique</b> : après environ six mois, mêmes symptômes, lésions seulement partiellement réversibles.</p><div class="key"><b>Conduite.</b> Arrêt immédiat à toute réaction respiratoire ; surveillance régulière de la fonction pulmonaire en traitement prolongé, surtout chez le sujet âgé, chez qui les formes chroniques sont fréquentes et passent inaperçues.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Furadantine® retard (07.2025)</a>.</p></template>
<template data-pop="j69-d-bleomycine" data-title="Bléomycine : toxicité pulmonaire"><p class="lab">Fréquence</p><p>Les effets pulmonaires, les plus graves de la molécule, touchent environ 10 % des patients, pendant ou après le traitement ; une fibrose peut être mortelle.</p><p class="lab">Facteurs de risque</p><p>Dose cumulée au-delà de 400 × 10³ UI (environ 225 × 10³ UI/m²), âge, insuffisance rénale, maladie pulmonaire préexistante, radiothérapie thoracique, oxygène à une fraction inspirée d’au moins 30 %, association à d’autres cytotoxiques pneumotoxiques, facteurs de croissance granulocytaires. L’injection rapide en bolus est à éviter.</p><p class="lab">Surveillance et conduite</p><p>Radiographies fréquentes, de préférence hebdomadaires, jusqu’à quatre semaines après la fin. Les premiers signes sont de fins crépitants et une détresse respiratoire ; le traitement est arrêté et le patient reçoit corticoïdes et antibiotiques à large spectre.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Bléomycine Baxter (02.2024)</a>.</p></template>
<template data-pop="j69-d-ici" data-title="Inhibiteurs de points de contrôle immunitaire"><p class="lab">Fréquence</p><p>Sous pembrolizumab en monothérapie, une pneumopathie est survenue chez 4,2 % des patients, de grade 2, 3, 4 ou 5 chez 1,9 %, 1,1 %, 0,2 % et 0,1 % ; délai médian 3,9 mois (2 jours à 27,2 mois). Elle était plus fréquente après radiothérapie thoracique (8,1 % contre 3,9 %).</p><p class="lab">Conduite (information professionnelle)</p><p>Confirmation radiologique et exclusion des autres causes ; corticoïdes dès le grade 2 (prednisone 1 à 2 mg/kg par jour puis décroissance) ; suspension au grade 2 ; arrêt définitif au grade 3 ou 4 et en cas de grade 2 récidivant.</p><div class="trap"><span class="k">Piège</span> Les corticoïdes ne sont généralement pas utiles au grade 1 et pourraient nuire à l’efficacité de l’immunothérapie ; la réintroduction expose à 25 à 30 % de récidive (Conte, 2022).</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Keytruda® (08.2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></template>
<template data-pop="j69-d-tdxd" data-title="Trastuzumab déruxtécan"><p class="lab">Fréquence</p><p>Conjugué anticorps-médicament dirigé contre HER2. Dans les premiers essais, la pneumopathie a touché 15,8 % des patients, surtout de bas grade, avec 2,4 % de décès ; dans l’essai de phase III suivant, sa fréquence était de 10,5 % sans forme de grade 4 ni décès (Conte, 2022). Dans l’information professionnelle suisse, c’est la première cause d’arrêt définitif (8,3 % des patients d’une étude).</p><p class="lab">Conduite (information professionnelle)</p><p>Grade 1 : interrompre jusqu’à la résolution, envisager au moins 0,5 mg/kg par jour de prednisolone, reprendre à la même dose si la résolution survient en 28 jours au plus, sinon diminuer d’un palier. Grade 2 ou plus : arrêt définitif, au moins 1 mg/kg par jour de prednisolone pendant 14 jours puis décroissance sur au moins 4 semaines. L’insuffisance rénale modérée augmente l’incidence.</p><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Enhertu® (06.2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a>.</p></template>
<template data-pop="j69-contentieux-anaerobies" data-title="Arbitrage : couverture anaérobie et durée"><p class="lab">Les textes</p><p><b>SSI (septembre 2026)</b> : amoxicilline-acide clavulanique 2,2 g toutes les 8 heures ; alternative ceftriaxone avec ou sans clindamycine ou métronidazole, sans critère d’ajout ; durée comme les autres pneumonies, en principe cinq jours. <b>BTS (2023)</b> : même premier choix ; pas de couverture anaérobie systématique, réservée au terrain dentaire, à l’expectoration fétide, à l’abcès ou à l’empyème ; cinq jours. <b>ESO (mai 2026)</b> : pour la pneumonie après accident vasculaire cérébral, pas de couverture anaérobie de routine sauf aspiration massive ; sept à huit jours selon les principes de la pneumonie nosocomiale.</p><p class="lab">Arbitrage retenu</p><p>La source primaire applicable la plus récente en Suisse est la SSI 2026 : amoxicilline-acide clavulanique, qui couvre aussi les anaérobies, et cinq jours si l’évolution est favorable. Pour l’ajout d’un antianaérobie à la ceftriaxone, que la SSI laisse ouvert, les critères de la BTS servent de guide, car une couverture étendue n’apporte pas de bénéfice démontré et augmente les colites à <i>Clostridioides difficile</i> (Bai, 2024). La durée de sept à huit jours de l’ESO concerne la pneumonie après accident vasculaire cérébral prise en charge comme une pneumonie nosocomiale.</p><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, texte en vigueur validé le 09.09.2026</a> ; <a href="https://www.brit-thoracic.org.uk/clinical-resources/clinical-statements/aspiration-pneumonia/" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42095755/" target="_blank" rel="noopener">ESO 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11251078/" target="_blank" rel="noopener">Bai et al. 2024</a>.</p></template>
<template data-pop="j69-contentieux-corticoides" data-title="Arbitrage : corticoïdes des pneumopathies iatrogènes"><p class="lab">Les textes</p><p><b>Pneumopathie médicamenteuse</b> : l’ERS (2022) réserve les corticoïdes aux formes invalidantes ou progressives ; l’avis d’experts publié par l’ESMO (2022) les gradue (1 à 2 mg/kg par jour dès le grade 2) ; les informations professionnelles suisses du pembrolizumab et du trastuzumab déruxtécan fixent leurs propres doses, qui priment pour ces molécules. <b>Pneumopathie radique</b> : la revue d’Arroyo-Hernández (2021) cite la prednisone 1 à 2 mg/kg par jour avec décroissance sur 3 à 12 semaines ; le consensus Delphi (2024) décrit 60 mg par jour pendant deux semaines puis −10 mg par semaine, sans consensus formel sur la dose ; les recommandations françaises de la Société française de radiothérapie oncologique et de l’Association francophone des soins oncologiques de support (2025), lues sous forme de résumé seulement, graduent le traitement selon la toxicité.</p><p class="lab">Arbitrage retenu</p><p>Pour une molécule dont l’information professionnelle suisse fixe la conduite, celle-ci s’applique. Pour les autres situations, aucune recommandation suisse n’existe ; les schémas publiés sont hors indication et la dose se décide avec l’oncologue et le pneumologue, selon le grade et le terrain.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35332071/" target="_blank" rel="noopener">Spagnolo et al. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8881716/" target="_blank" rel="noopener">Conte et al. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7788688/" target="_blank" rel="noopener">Arroyo-Hernández et al. 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38788551/" target="_blank" rel="noopener">Delphi 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40796462/" target="_blank" rel="noopener">recommandations françaises de radiothérapie oncologique et de soins de support, 2025</a>.</p></template>
<template data-pop="pareto-j69-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j69-0,j69-1,j69-2,j69-3,j69-4,j69-5,j69-6"></p><ul><li>Pneumonie d’aspiration : infection par microaspiration de sécrétions colonisées ; pneumopathie chimique : brûlure stérile par liquide gastrique.</li><li>Gaz, médicaments et rayonnements forment deux autres familles ; l’agent commande la conduite.</li><li>Pneumonie d’aspiration : 5 à 15 % des pneumonies communautaires, mortalité hospitalière 10 à 15 % ; 12 % des accidents vasculaires cérébraux.</li><li>Déglutition et toux protègent le poumon ; l’âge, la vigilance abaissée et les sédatifs les altèrent ; l’aspiration peut être silencieuse.</li><li>La solubilité d’un gaz fixe son siège ; dioxyde d’azote et phosgène donnent un œdème retardé.</li><li>Monoxyde de carbone : transport de l’oxygène bloqué ; cyanure : utilisation bloquée, lactate élevé.</li><li>Interroger sur déglutition, médicaments, radiothérapie et métier ; examiner la bouche, chercher la suie.</li></ul></template>
<template data-pop="pareto-j69-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j69-7"></p><ul><li>Aspiration : syndrome infectieux, facteurs de risque, condensation déclive ; la radiographie manque jusqu’à 25 % des cas.</li><li>Aspiration massive observée chez un patient à la conscience abaissée : pneumopathie chimique, réévaluée à 24–48 heures.</li><li>Fumées : COHb par co-oxymétrie, lactate ; SpO₂ normale non rassurante.</li><li>Pneumopathie médicamenteuse : exposition et exclusion ; pneumopathie radique : 3 à 12 semaines, champ irradié.</li></ul></template>
<template data-pop="pareto-j69-urg" data-title="Pareto — Urgences et traitements"><p class="ratio" data-cover="j69-8,j69-9,j69-10,j69-11"></p><ul><li>Urgences : voies aériennes brûlées, asphyxiants, œdème différé, choc septique, pneumopathie médicamenteuse de grade 4.</li><li>Pneumonie d’aspiration : amoxicilline-acide clavulanique 2,2 g toutes les 8 heures, cinq jours ; antianaérobie seulement si abcès, empyème, dents ou expectoration fétide.</li><li>Pneumopathie chimique : pas d’antibiotique d’emblée.</li><li>Monoxyde de carbone : oxygène à 100 %, hyperbarie si signe neurologique, cardiaque, respiratoire ou psychologique, ou grossesse.</li><li>Cyanure : hydroxocobalamine 5 g en 15 minutes.</li><li>Pneumopathie iatrogène : arrêt de l’agent, corticoïdes dès le grade 2.</li></ul></template>
<template data-pop="pareto-j69-crit" data-title="Pareto — Prévention, situations particulières et critères"><p class="ratio" data-cover="j69-12,j69-13,j69-14"></p><ul><li>Dépistage de la dysphagie après accident vasculaire cérébral, hygiène buccale deux fois par jour, plan nutritionnel, sédatifs réduits.</li><li>Pas d’antibioprophylaxie après accident vasculaire cérébral ; principe STOP en entreprise.</li><li>Grossesse et monoxyde de carbone : hyperbarie ; enfant et huile de lampe : appel au 145.</li><li>Critères : BTS pour l’aspiration, Brooks et Suva pour le RADS, exposition et exclusion pour le médicament, chronologie et champ pour la radiation.</li></ul></template>
<template data-pop="pareto-j69-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j69-e-1,j69-e-2,j69-e-3"></p><ul><li>Radiographie, puis TDM si doute ; segments déclives, plus souvent à droite.</li><li>Vidéofluoroscopie et nasofibroscopie : références de la déglutition.</li><li>COHb : inférieure à 2 % ou 5 % ; au-delà de 9 %, exposition exogène ; lactate d’au moins 10 mmol/L : cyanure suspect.</li><li>Débits de pointe quatre fois par jour, travail et congés ; tests allergologiques négatifs dans l’asthme d’irritation.</li></ul></template>
<template data-pop="pareto-j69-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="j69-s-anat-body,j69-s-phys-body,j69-s-tox-body,j69-s-histo-body"></p><ul><li>Le larynx se ferme à trois étages ; le matériel aspiré suit la pesanteur.</li><li>Apnée de déglutition encadrée d’expirations ; toux efficace : inspiration profonde, glotte fermée, pression élevée ; débit de pointe de toux inférieur à 270 L/min insuffisant.</li><li>Solubilité du gaz : siège et délai ; monoxyde de carbone et cyanure bloquent transport et utilisation de l’oxygène.</li><li>Desquamation, exsudation, fibrose : les corticoïdes agissent avant la fibrose.</li></ul></template>
<template data-pop="pareto-j69-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j69-p-1,j69-p-2,j69-p-3,j69-p-4"></p><ul><li>L’agent dicte la classe : antibiotique, antidote, corticoïde ou arrêt du médicament.</li><li>Adapter l’amoxicilline-acide clavulanique sous 30 mL/min ; lévofloxacine si allergie, avec ses risques tendineux et rythmiques.</li><li>Oxygène dosé avec prudence sous amiodarone et bléomycine.</li><li>Hydroxocobalamine : urines rouges, interférences, alarme de dialyse.</li><li>Arrêt d’amiodarone, nitrofurantoïne, méthotrexate, bléomycine ou immunothérapie devant une pneumopathie.</li></ul></template>
