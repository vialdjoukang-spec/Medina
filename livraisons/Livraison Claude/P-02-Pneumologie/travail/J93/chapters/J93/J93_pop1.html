<template data-pop="j93-pression-pleurale" data-title="La pression pleurale négative"><p class="lab">Fonction normale</p><p>La cavité pleurale contient quelques millilitres de liquide qui couplent le poumon à la paroi. Le poumon tend à se rétracter, la paroi à s’expandre ; ces deux forces opposées abaissent la pression pleurale sous la pression atmosphérique.</p><p class="lab">Valeurs</p><p>En fin d’expiration calme, la pression pleurale vaut environ −5 cm d’eau. Elle atteint environ −8 cm d’eau en fin d’inspiration. Elle est plus négative aux apex en position debout, car le poids du poumon crée un gradient vertical.</p><p class="lab">Conséquence clinique</p><p>Une brèche de la plèvre viscérale ou pariétale laisse entrer l’air tant que la pression pleurale reste inférieure à celle de la source. Le gradient apical explique la fréquence des lésions et des fuites au sommet du poumon.</p><div class="key"><b>Limite.</b> Ces valeurs décrivent le sujet sain au repos ; l’emphysème, la fibrose ou la ventilation en pression positive les modifient profondément.</div></template>
<template data-pop="j93-retraction" data-title="La rétraction élastique du poumon"><p class="lab">Mécanisme</p><p>Le poumon contient des fibres élastiques étirées et des alvéoles tapissées d’un film liquidien soumis à la tension superficielle. Ces deux composantes tendent à réduire son volume ; le surfactant diminue la tension superficielle et stabilise les petites alvéoles.</p><p class="lab">Ce qui se passe lors d’un pneumothorax</p><p>Dès que l’air sépare les deux feuillets, plus rien ne retient le poumon contre la paroi. Il se rétracte vers le hile jusqu’à ce que sa pression de rétraction s’équilibre avec la pression pleurale nouvelle.</p><p class="lab">Conséquence clinique</p><p>Le poumon collabé reste perfusé mais n’est plus ventilé. Cet effet shunt provoque l’hypoxémie ; la vasoconstriction hypoxique la limite chez le sujet jeune.</p><div class="key"><b>Limite.</b> Un poumon fibrosé ou adhérent à la paroi se rétracte peu : le pneumothorax peut être cloisonné et atypique à l’imagerie.</div></template>
<template data-pop="j93-tension-mecanisme" data-title="Pneumothorax sous tension : la chaîne hémodynamique"><p class="lab">Mécanisme valvulaire</p><p>La brèche s’ouvre à l’inspiration, quand la pression pleurale baisse, et se ferme à l’expiration. L’air entre à chaque cycle sans pouvoir ressortir ; la pression intrapleurale devient positive pendant tout le cycle.</p><p class="lab">Retentissement</p><p>Le médiastin est refoulé vers le côté sain. Les veines caves et l’oreillette droite, structures à basse pression, sont comprimées ; le retour veineux chute, puis le débit cardiaque et la tension artérielle. Le poumon controlatéral est lui aussi comprimé, ce qui aggrave l’hypoxémie.</p><p class="lab">Conduite</p><p>La décompression immédiate évacue l’air sous pression et rompt la chaîne. Le remplissage vasculaire seul ne corrige pas un choc obstructif.</p><div class="key"><b>Limite.</b> La tension complique rarement un pneumothorax primaire ; elle est plus fréquente sous ventilation en pression positive et après traumatisme.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1016/j.resuscitation.2021.02.011" target="_blank" rel="noopener">ERC 2021</a>.</p></template>
<template data-pop="j93-blebs" data-title="Primaire ne veut pas dire poumon normal"><p class="lab">Constat</p><p>La BTS 2023 rappelle que la majorité des patients atteints de pneumothorax primaire présentent au scanner des modifications de type emphysémateux. Les blebs et les bulles prédominent aux apex.</p><p class="lab">Mécanisme</p><p>La contrainte mécanique apicale, l’inflammation bronchiolaire liée au tabac et une possible fragilité constitutionnelle du tissu élastique favorisent ces lésions. Une porosité diffuse de la plèvre viscérale peut aussi laisser fuir l’air sans bulle rompue.</p><p class="lab">Conséquence pratique</p><p>Le terme « primaire » désigne l’absence de maladie pulmonaire cliniquement établie. Il prédit une bonne tolérance et un traitement moins invasif, pas l’absence de récidive.</p><div class="key"><b>Limite.</b> L’ERS 2015 souligne que le rôle exact de la rupture des bulles reste discuté ; c’est pourquoi le traitement d’une récidive inclut une pleurodèse.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">ERS 2015</a>.</p></template>
<template data-pop="j93-traumatique" data-title="Pneumothorax traumatique (S27.0)"><p class="lab">Définition</p><p>Le pneumothorax traumatique résulte d’une plaie pénétrante ou d’un traumatisme fermé, souvent par fracture costale. Il est codé S27.0 et exclu de la catégorie J93.</p><p class="lab">Spécificités</p><p>Il s’associe fréquemment à un hémothorax, à des lésions pariétales et à d’autres atteintes. Le scanner du polytraumatisé révèle des pneumothorax occultes, invisibles en radiographie couchée. La ventilation en pression positive, souvent nécessaire, expose à la tension.</p><p class="lab">Conduite</p><p>Il suit les protocoles de traumatologie : examen primaire, décompression d’une tension, drainage d’un hémopneumothorax. La BTS 2023 ne l’intègre pas à son algorithme et signale des essais en cours sur la surveillance seule.</p><div class="key"><b>Renvoi.</b> Ce cours traite le pneumothorax spontané ; la prise en charge détaillée du traumatisme thoracique relève des cours de traumatologie.</div></template>
<template data-pop="j93-iatrogene" data-title="Pneumothorax iatrogène (J95.80)"><p class="lab">Gestes en cause</p><p>Les biopsies pulmonaires transthoraciques guidées par scanner, la pose de cathéter veineux central par voie sous-clavière ou jugulaire, la pose de stimulateur cardiaque, la ponction pleurale et la ventilation mécanique sont les causes principales.</p><p class="lab">Évolution</p><p>La BTS 2023 note que ces pneumothorax se résolvent souvent plus facilement et peuvent ne nécessiter aucune intervention : la brèche est ponctuelle et le poumon souvent sain. Une aspiration simple suffit fréquemment lorsqu’un geste est nécessaire.</p><p class="lab">Exception</p><p>Le barotraumatisme sous ventilation mécanique fait exception : la pression positive entretient la fuite et impose un drainage.</p><div class="key"><b>À retenir.</b> Après tout geste à risque, une dyspnée ou une douleur nouvelle fait rechercher un pneumothorax par échographie ou radiographie.</div></template>
<template data-pop="j93-tabac" data-title="Tabac : premier facteur modifiable"><p class="lab">Données</p><p>Dans une étude suédoise de 138 patients, le tabagisme multipliait le risque d’un premier pneumothorax spontané par environ 9 chez la femme et 22 chez l’homme, avec une relation dose-effet. Le risque sur la vie d’un gros fumeur était estimé à 12 %, contre 1 pour 1 000 chez le non-fumeur.</p><p class="lab">Mécanisme</p><p>La fumée provoque une bronchiolite respiratoire : neutrophiles et macrophages libèrent des protéases qui dégradent le tissu élastique et favorisent blebs, bulles et porosité pleurale. L’obstruction des petites voies aériennes augmente la pression alvéolaire régionale.</p><p class="lab">Conséquence</p><p>Dans la méta-analyse de Walker, l’arrêt du tabac s’associait à une réduction d’environ quatre fois du risque de récidive. Le cannabis fumé, souvent inhalé profondément avec manœuvre de Valsalva, est aussi incriminé.</p><div class="key"><b>Limite.</b> Ces données sont observationnelles ; elles montrent une association forte et cohérente, sans essai randomisé du sevrage.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., 1987</a> ; <a href="https://doi.org/10.1183/13993003.00864-2018" target="_blank" rel="noopener">Walker et al., 2018</a>.</p></template>
<template data-pop="j93-secondaire" data-title="Pneumothorax secondaire : la réserve fait la gravité"><p class="lab">Définition</p><p>Le pneumothorax secondaire survient sur une maladie pulmonaire établie. La BTS 2023 y rattache le patient de 50 ans ou plus avec tabagisme significatif, car il répond moins bien à l’aspiration.</p><p class="lab">Mécanisme de gravité</p><p>Le poumon controlatéral, lui aussi malade, ne peut pas compenser la perte de ventilation. Une petite réduction de volume suffit à provoquer hypoxémie et hypercapnie. Le parenchyme rigide ou emphysémateux cicatrise lentement ; les fuites persistantes sont plus fréquentes.</p><p class="lab">Conduite</p><p>Le patient est hospitalisé. Un drain est posé si un geste est sûr ; le scanner guide les cas difficiles. La pleurodèse peut être proposée dès le premier épisode lorsque la récidive serait dangereuse.</p><div class="key"><b>Piège.</b> Juger un pneumothorax secondaire sur sa taille radiologique sous-estime sa gravité ; la clinique et les gaz du sang priment.</div></template>
<template data-pop="j93-oxygene" data-title="Oxygène : corriger l’hypoxémie et accélérer la résorption"><p class="lab">Mécanisme</p><p>L’air pleural est surtout de l’azote. L’inhalation d’oxygène à haute concentration lave l’azote alvéolaire puis sanguin ; le gradient d’azote entre la cavité pleurale et le sang augmente, et l’air pleural se résorbe plus vite.</p><p class="lab">Données</p><p>La BTS 2010 indiquait une résorption spontanée de 1,25 à 2,2 % du volume de l’hémithorax par jour, multipliée jusqu’à quatre fois sous oxygène à haut débit, et recommandait l’oxygène chez le patient hospitalisé. La BTS 2023 ne revient pas sur ce point.</p><p class="lab">Cible</p><p>Selon la recommandation BTS sur l’oxygène, la saturation visée est de 94 à 98 %, ou de 88 à 92 % en cas de risque d’hypercapnie.</p><div class="key"><b>Limite.</b> Chez le patient atteint de BPCO hypercapnique, l’oxygène à haut débit non titré peut aggraver l’hypercapnie : la cible prime sur l’objectif de résorption.</div><p class="src">Références : <a href="https://doi.org/10.1136/thx.2010.136986" target="_blank" rel="noopener">BTS 2010, pneumothorax spontané</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2016-209729" target="_blank" rel="noopener">O’Driscoll et al., BTS oxygène 2017</a>.</p></template>
<template data-pop="j93-mucoviscidose" data-title="Pneumothorax et mucoviscidose"><p class="lab">Fréquence et pronostic</p><p>Le pneumothorax survient chez 0,64 % des patients par an et 3,4 % au cours de la maladie, surtout lorsque l’atteinte est avancée. La BTS 2023 cite une survie médiane de 30 mois après l’épisode et des récidives controlatérales jusqu’à 40 %.</p><p class="lab">Particularités</p><p>Le poumon collabé est rigide et encombré ; sa réexpansion est lente et exige kinésithérapie et antibiothérapie adaptées. Le drain seul laisse 50 % de récidives.</p><p class="lab">Prévention</p><p>La pleurectomie partielle est en général le traitement de choix des récidives ; la pleurodèse chimique est une alternative chez le patient inopérable.</p><div class="key"><b>Limite.</b> Le projet de transplantation pulmonaire se discute avec le centre de référence avant toute pleurodèse.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-genetique" data-title="Causes génétiques du pneumothorax"><p class="lab">Indices</p><p>Un antécédent familial, des récidives multiples, des kystes au scanner ou des signes extra-pulmonaires orientent vers une cause héréditaire. Environ 10 % des patients rapportent un antécédent familial.</p><p class="lab">Entités</p><p>Le syndrome de Birt‑Hogg‑Dubé (gène FLCN) associe kystes basaux, fibrofolliculomes et tumeurs rénales. La sclérose tubéreuse (TSC1, TSC2) peut se compliquer de lymphangioléiomyomatose. Les syndromes de Marfan (FBN1) et d’Ehlers‑Danlos vasculaire (COL3A1) fragilisent le tissu conjonctif.</p><p class="lab">Conduite</p><p>La BTS 2023 recommande un scanner et l’avis d’un centre spécialisé. Le diagnostic protège le patient, par le dépistage rénal ou aortique, et ses apparentés.</p><div class="key"><b>Limite.</b> Un scanner normal n’exclut pas toutes les formes ; l’indication d’un test génétique relève d’une consultation spécialisée.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, pneumothorax familial</a>.</p></template>
<template data-pop="j93-catamenial" data-title="Pneumothorax cataménial"><p class="lab">Reconnaître</p><p>La BTS 2023 décrit l’association de douleur thoracique, de dyspnée et parfois d’hémoptysie dans les 72 heures qui précèdent ou suivent les règles. Le pneumothorax est habituellement droit et récidive au rythme du cycle ; une endométriose pelvienne est souvent connue.</p><p class="lab">Fréquence</p><p>Chez les femmes opérées pour pneumothorax récidivant, le diagnostic est retenu jusqu’à 25 % des cas : la forme est probablement sous-diagnostiquée.</p><p class="lab">Mécanismes</p><p>L’air pourrait passer de l’abdomen et des voies génitales vers la plèvre par des fenestrations diaphragmatiques ; des implants endométriaux de la plèvre viscérale pourraient aussi éroder la surface pulmonaire.</p><p class="lab">Traitement</p><p>La prise en charge est pluridisciplinaire : vidéothoracoscopie qui traite fenestrations et implants, puis traitement hormonal qui met les ovaires au repos.</p><div class="key"><b>Piège.</b> Une femme qui récidive doit toujours être interrogée sur la chronologie de ses règles.</div></template>
<template data-pop="j93-douleur-pleurale" data-title="La douleur pleurale"><p class="lab">Mécanisme</p><p>La plèvre pariétale reçoit une innervation somatique des nerfs intercostaux et, pour le centre du diaphragme, du nerf phrénique. Son décollement et son étirement provoquent une douleur vive et localisée.</p><p class="lab">Caractères</p><p>La douleur est brutale, latérale, majorée par l’inspiration profonde et la toux. Une irradiation à l’épaule traduit une irritation diaphragmatique. Elle s’atténue souvent en quelques heures, même si le pneumothorax persiste.</p><p class="lab">Conséquence</p><p>L’atténuation de la douleur ne prouve pas la résolution ; des patients consultent après plusieurs jours avec un poumon encore collabé.</p><div class="key"><b>Diagnostic différentiel.</b> Une douleur pleurale brutale évoque aussi une embolie pulmonaire, une pneumonie ou une péricardite.</div></template>
<template data-pop="j93-dyspnee" data-title="La dyspnée dépend de la réserve"><p class="lab">Mécanisme</p><p>La dyspnée naît de l’effet shunt, de la baisse du volume ventilable et, dans la tension, de la chute du débit cardiaque.</p><p class="lab">Interprétation</p><p>Un sujet jeune compense en augmentant la ventilation du poumon sain ; il peut rester peu essoufflé malgré un collapsus important. Un patient atteint de BPCO, dont les deux poumons sont malades, décompense pour un petit pneumothorax.</p><p class="lab">Conséquence</p><p>La BTS 2023 fonde la décision sur les symptômes : une dyspnée significative fait sortir de la surveillance simple ; une dyspnée disproportionnée chez un patient pulmonaire fait classer le patient à haut risque.</p><div class="key"><b>Limite.</b> L’intensité ressentie varie d’un patient à l’autre ; la fréquence respiratoire, la saturation et l’effort ventilatoire objectivent la gêne.</div></template>
<template data-pop="j93-murmure" data-title="Murmure vésiculaire diminué ou aboli"><p class="lab">Technique</p><p>L’auscultation compare les deux hémithorax de façon symétrique, en avant, latéralement et en arrière.</p><p class="lab">Mécanisme</p><p>La couche d’air interposée réfléchit les sons et éloigne le poumon de la paroi ; le murmure transmis diminue ou disparaît.</p><p class="lab">Valeur et pièges</p><p>Le signe manque dans les petits pneumothorax. Dans l’emphysème, le murmure est déjà diminué des deux côtés, ce qui rend la comparaison peu fiable. Un épanchement liquidien diminue aussi le murmure, mais il s’accompagne d’une matité.</p><div class="key"><b>À retenir.</b> Murmure aboli plus tympanisme évoque l’air ; murmure aboli plus matité évoque le liquide.</div></template>
<template data-pop="j93-tympanisme" data-title="Tympanisme à la percussion"><p class="lab">Technique</p><p>La percussion médiate compare des points symétriques des deux hémithorax.</p><p class="lab">Mécanisme</p><p>L’air pleural vibre librement sous la paroi et produit un son plus sonore et plus prolongé que le poumon normal.</p><p class="lab">Valeur et pièges</p><p>Le tympanisme est difficile à percevoir dans un environnement bruyant et chez le patient emphysémateux, dont les deux hémithorax sont hypersonores.</p><div class="key"><b>Conséquence.</b> Un examen clinique normal n’exclut pas un pneumothorax ; l’imagerie tranche.</div></template>
<template data-pop="j93-emphyseme-sc" data-title="Emphysème sous-cutané"><p class="lab">Mécanisme</p><p>L’air s’échappe de la cavité pleurale ou du médiastin et dissèque les plans conjonctifs de la paroi, du cou et parfois du visage.</p><p class="lab">Reconnaître</p><p>La palpation perçoit une crépitation neigeuse caractéristique ; la radiographie montre des stries aériennes dans les parties molles.</p><p class="lab">Conduite</p><p>Il est le plus souvent bénin et régresse spontanément. Une majoration rapide sous drain fait vérifier la position, la perméabilité et le calibre du drain, ainsi que l’absence de fuite massive. La BTS 2023 renvoie à sa déclaration sur les gestes pleuraux pour sa gestion.</p><div class="key"><b>Piège.</b> Un emphysème sous-cutané étendu gêne l’échographie et peut masquer le pneumothorax sous-jacent.</div></template>
<template data-pop="j93-signes-tension" data-title="Signes de tension : précoces et tardifs"><p class="lab">Signes précoces</p><p>La détresse respiratoire, la tachycardie croissante, la désaturation et l’agitation apparaissent tôt. Chez le patient ventilé, l’augmentation des pressions d’insufflation, la chute du volume courant et l’hypotension sont souvent les premiers signes.</p><p class="lab">Signes tardifs</p><p>L’hypotension, la turgescence jugulaire et la déviation trachéale controlatérale traduisent une compression avancée. La déviation trachéale est tardive et inconstante ; la turgescence jugulaire manque chez le patient hypovolémique.</p><p class="lab">Conséquence</p><p>Attendre la déviation trachéale retarde un geste vital. Le diagnostic repose sur l’association d’un contexte compatible et d’une instabilité.</p><div class="key"><b>À retenir.</b> Chez un patient porteur de pneumothorax, une tachycardie croissante avec désaturation impose de penser à la tension.</div></template>
<template data-pop="j93-exsufflation" data-title="Décompression d’un pneumothorax sous tension"><p class="lab">Exsufflation à l’aiguille</p><p>Un cathéter court monté sur aiguille est introduit au ras du bord supérieur de la côte, du côté suspect. Selon la dixième édition de l’ATLS, le site recommandé chez l’adulte est le quatrième ou le cinquième espace intercostal, juste en avant de la ligne axillaire moyenne ; le deuxième espace sur la ligne médioclaviculaire reste le site de l’enfant.</p><p class="lab">Limites</p><p>Le deuxième espace antérieur échoue souvent chez l’adulte, car l’épaisseur de la paroi dépasse la longueur des cathéters courants. Un cathéter long, d’environ 8 cm, réduit cet échec. Le cathéter peut se plicaturer ou se boucher.</p><p class="lab">Thoracostomie</p><p>Chez le patient ventilé, une équipe entraînée peut ouvrir la plèvre au doigt par une incision latérale, ce que l’ERC 2021 privilégie dans l’arrêt cardiaque traumatique. Un drain thoracique suit toujours la décompression.</p><div class="key"><b>À retenir.</b> Le geste précède l’imagerie ; un sifflement d’air confirme la tension, son absence ne l’exclut pas si le cathéter est trop court.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.resuscitation.2021.02.011" target="_blank" rel="noopener">Lott et al., ERC 2021</a>.</p></template>
<template data-pop="j93-fuite-persistante" data-title="Fuite aérienne persistante"><p class="lab">Définition</p><p>La fuite est persistante lorsque le drain continue de buller ou que le poumon ne se réexpand pas après plusieurs jours de drainage.</p><p class="lab">Options</p><p>La BTS 2023 conseille un avis chirurgical lorsque la fuite persiste malgré 5 à 7 jours de drainage. Chez le patient inopérable, une pleurodèse au sang autologue ou un traitement endobronchique, par exemple des valves, peuvent être discutés. Aucune donnée ne démontre le bénéfice d’une aspiration continue.</p><p class="lab">Données</p><p>La pleurodèse au sang autologue semble raccourcir l’hospitalisation par rapport au drainage seul, avec un niveau de preuve non gradé.</p><div class="key"><b>Limite.</b> Le moment optimal de la chirurgie n’est pas établi ; la BTS 2010 proposait un avis à 3 à 5 jours, la BTS 2023 individualise la décision.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, question clinique 3</a>.</p></template>
<template data-pop="j93-oedeme-reexpansion" data-title="Œdème de réexpansion"><p class="lab">Mécanisme</p><p>Un poumon longtemps collabé subit une ischémie relative ; sa réexpansion brutale augmente la perméabilité capillaire et provoque un œdème lésionnel unilatéral.</p><p class="lab">Facteurs favorisants</p><p>Un collapsus ancien de plusieurs jours, un pneumothorax complet, un sujet jeune et une aspiration rapide ou sous dépression augmentent le risque.</p><p class="lab">Prévention et conduite</p><p>Le drain est raccordé à une valve sous eau sans aspiration initiale ; l’aspiration à l’aiguille s’interrompt en cas de toux ou de gêne thoracique. L’oxygène et, si besoin, un support ventilatoire traitent l’œdème constitué.</p><div class="key"><b>Limite.</b> La complication est rare mais peut être grave ; une toux et une dyspnée apparaissant pendant la réexpansion doivent l’évoquer.</div></template>
<template data-pop="j93-bts-ers" data-title="Quelle recommandation retenir ?"><p class="lab">Source retenue</p><p>La <b>recommandation BTS 2023</b> sur les maladies pleurales est la source primaire applicable la plus récente. Elle utilise la méthode GRADE et fonde la décision sur les symptômes, les caractéristiques à haut risque et la sécurité du geste. Ses recommandations sont conditionnelles et le niveau de preuve souvent faible.</p><p class="lab">Textes antérieurs</p><p>La <b>BTS 2010</b> guidait la conduite par la taille : 2 cm au hile définissaient un grand pneumothorax. La <b>déclaration ERS 2015</b>, présidée par le pneumologue valaisan Jean‑Marie Tschopp, affirmait déjà que l’approche d’un premier épisode primaire dépend des symptômes plutôt que de la taille, et que l’aspiration n’est requise que chez le patient symptomatique.</p><p class="lab">Relation entre les sources</p><p>La BTS 2023 prolonge l’orientation de l’ERS 2015 et remplace la BTS 2010. Elle ajoute la surveillance des grands pneumothorax peu symptomatiques et le dispositif ambulatoire, appuyés par les essais de 2020 et 2023. Aucune recommandation nationale suisse n’a été identifiée ; la recommandation allemande de 2018 est signalée comme expirée par son éditeur.</p><div class="key"><b>Application en Suisse.</b> Le dispositif ambulatoire suppose une filière de suivi locale ; en son absence, aspiration ou drain restent les options d’un patient symptomatique.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">ERS 2015</a> ; <a href="https://doi.org/10.1136/thx.2010.136986" target="_blank" rel="noopener">BTS 2010</a>.</p></template>
