<template data-pop="j93-radio" data-title="Radiographie thoracique : lire un pneumothorax"><p class="lab">Technique</p><p>Le cliché de face est réalisé debout, en inspiration. L’air monte alors à l’apex et le long de la paroi latérale.</p><p class="lab">Signe cardinal</p><p>Une ligne pleurale viscérale fine sépare le poumon d’une zone sans trame pulmonaire. Le cœur et la trachée sont en place, sauf dans la tension où le médiastin est refoulé du côté sain.</p><p class="lab">Pièges</p><p>Un pli cutané, le bord de l’omoplate ou la paroi d’une bulle simulent une ligne pleurale. En décubitus, l’air s’accumule en avant et en bas : un cul-de-sac costodiaphragmatique anormalement profond et clair, le signe du sillon profond, peut être le seul indice. Dans cette position, la sensibilité de la radiographie tombe à 50,2 % dans la méta-analyse d’Alrajhi.</p><div class="key"><b>À retenir.</b> Un cliché couché normal n’exclut pas un pneumothorax ; l’échographie ou le scanner complètent.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.11-0131" target="_blank" rel="noopener">Alrajhi et al., Chest 2012</a>.</p></template>
<template data-pop="j93-taille" data-title="Mesurer la taille d’un pneumothorax"><p class="lab">Pourquoi mesurer</p><p>La BTS 2023 n’utilise plus la taille pour décider d’un geste, mais pour juger s’il est sûr : un décollement d’au moins 2 cm, latéral ou apical, en radiographie, ou un espace accessible au scanner, permet en général une aspiration ou un drain.</p><p class="lab">Méthodes</p><p>La BTS 2010 qualifiait de grand un pneumothorax de 2 cm ou plus mesurés au niveau du hile, ce qui correspond à environ 50 % du volume de l’hémithorax. L’ACCP mesurait la distance entre l’apex pulmonaire et la coupole thoracique, avec un seuil de 3 cm. La formule de Collins estime le volume en pourcentage à 4,2 + 4,7 × (A + B + C), A étant la distance apicale, B et C les distances latérales aux moitiés supérieure et inférieure du poumon, mesurées en centimètres.</p><p class="lab">Limites</p><p>Ces méthodes se contredisent souvent pour un même cliché. Une mesure bidimensionnelle estime mal un volume tridimensionnel, surtout si le pneumothorax est cloisonné.</p><div class="key"><b>À retenir.</b> Mesurer pour la sécurité du geste, non pour décider à la place des symptômes.</div><p class="src">Références : <a href="https://doi.org/10.2214/ajr.165.5.7572489" target="_blank" rel="noopener">Collins et al., 1995</a> ; <a href="https://brit-thoracic.org.uk/document-library/guidelines/pleural-disease/bts-guideline-for-pleural-disease-appendix-1-clinical-pathwaysdecision-trees" target="_blank" rel="noopener">BTS 2023, annexe 1</a> ; <a href="https://doi.org/10.1136/thx.2010.136986" target="_blank" rel="noopener">BTS 2010</a>.</p></template>
<template data-pop="j93-echo" data-title="Échographie pleurale du pneumothorax"><p class="lab">Technique</p><p>Le patient est couché ; la sonde explore les espaces intercostaux antérieurs, là où l’air se collecte, puis progresse latéralement.</p><p class="lab">Signes normaux</p><p>Le glissement pleural traduit le mouvement de la plèvre viscérale contre la plèvre pariétale. Les lignes B, artefacts verticaux nés de la plèvre viscérale, et le pouls pulmonaire, transmis par le cœur, prouvent eux aussi le contact des deux feuillets. En mode temps-mouvement, le poumon normal donne un aspect granuleux sous la ligne pleurale.</p><p class="lab">Signes du pneumothorax</p><p>Le glissement, les lignes B et le pouls pulmonaire disparaissent ; seules persistent les lignes A horizontales. En mode temps-mouvement, des lignes parallèles remplacent l’aspect granuleux. Le point poumon, frontière où le glissement réapparaît, affirme le diagnostic avec une spécificité de 100 %.</p><p class="lab">Limites</p><p>L’absence de glissement se voit aussi en cas d’adhérences pleurales, d’apnée, d’intubation sélective ou d’emphysème bulleux. L’emphysème sous-cutané gêne l’examen.</p><div class="key"><b>Valeur.</b> Sensibilité 90,9 % et spécificité 98,2 % dans la méta-analyse d’Alrajhi, chez des patients surtout traumatisés et couchés ; la performance dépend de l’opérateur.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.11-0131" target="_blank" rel="noopener">Alrajhi et al., 2012</a> ; <a href="https://doi.org/10.1007/s001340000627" target="_blank" rel="noopener">Lichtenstein et al., 2000</a>.</p></template>
<template data-pop="j93-tdm" data-title="Scanner thoracique : l’examen de référence"><p class="lab">Ce qu’il montre</p><p>Le scanner détecte l’air pleural quel que soit son volume, distingue une bulle d’un pneumothorax, montre blebs, kystes, emphysème ou maladie interstitielle, et repère les adhérences.</p><p class="lab">Indications</p><p>Il est utile en cas de doute radiologique, de forme secondaire complexe, de suspicion de bulle géante, de geste jugé dangereux sur la radiographie, de récidive, de suspicion familiale ou génétique et avant chirurgie.</p><p class="lab">Limites</p><p>Il expose à des rayonnements et impose le transport du patient : il n’a pas sa place chez le patient instable ni chez le jeune patient typique stable.</p><div class="key"><b>À retenir.</b> Le scanner répond aux questions que la radiographie laisse ouvertes ; il ne remplace pas la décision clinique.</div></template>
<template data-pop="j93-bulle-geante" data-title="Bulle géante ou pneumothorax ?"><p class="lab">Le problème</p><p>Chez un patient emphysémateux, une grande bulle apicale crée une hyperclarté sans trame qui ressemble à un pneumothorax.</p><p class="lab">Indices</p><p>La paroi d’une bulle est concave vers la paroi thoracique ; une ligne pleurale vraie est parallèle à la paroi et convexe vers elle. Des fins septa traversent souvent la bulle et la trame reste visible à ses bords.</p><p class="lab">Conséquence</p><p>Un drain introduit dans une bulle crée une fistule bronchopleurale difficile à tarir. En cas de doute, le scanner précède tout geste.</p><div class="key"><b>Erreur fréquente.</b> Drainer sur une seule radiographie un patient atteint de BPCO sévère sans ligne pleurale nette.</div></template>
<template data-pop="j93-conservateur" data-title="Traitement conservateur : surveiller sans geste"><p class="lab">Principe</p><p>La brèche se ferme souvent spontanément ; l’air se résorbe ensuite lentement. Le traitement conservateur évite les complications d’un geste et semble réduire la récidive.</p><p class="lab">Indication selon la BTS 2023</p><p>Il peut être envisagé chez l’adulte atteint d’un pneumothorax primaire asymptomatique ou peu symptomatique, sans douleur ni dyspnée importantes ni retentissement physiologique, quelle que soit la taille.</p><p class="lab">Organisation</p><p>Le patient atteint de pneumothorax primaire est revu en ambulatoire tous les 2 à 4 jours, avec des consignes écrites de retour immédiat. Un pneumothorax secondaire surveillé l’est à l’hôpital. Une aggravation des symptômes ou un agrandissement font poser un drain.</p><div class="key"><b>Données.</b> Dans l’essai de Brown, 15,4 % des patients surveillés ont finalement eu besoin d’un geste ; les récidives à 12 mois étaient moins fréquentes que sous intervention.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a> ; <a href="https://doi.org/10.1056/NEJMoa1910775" target="_blank" rel="noopener">Brown et al., 2020</a>.</p></template>
<template data-pop="j93-valve-ambulatoire" data-title="Dispositif ambulatoire à valve unidirectionnelle"><p class="lab">Principe</p><p>Un petit cathéter pleural muni d’une valve unidirectionnelle, ou un drain relié à une valve de Heimlich, laisse sortir l’air sans le laisser entrer. Le patient rentre à domicile avec le dispositif.</p><p class="lab">Indication selon la BTS 2023</p><p>Il est à envisager pour le traitement initial du pneumothorax primaire symptomatique chez l’adulte bien entouré, dans un centre disposant de l’expertise et du suivi nécessaires.</p><p class="lab">Suivi</p><p>Le patient est revu tous les 2 à 3 jours ; le dispositif est retiré à la résolution. Un agrandissement ou des symptômes croissants conduisent à poser un drain et à hospitaliser.</p><div class="key"><b>Limite.</b> L’essai de Hallifax montre une hospitalisation plus courte au prix d’effets indésirables plus fréquents, notamment fuites, déplacements et dysfonctions du dispositif.</div></template>
<template data-pop="j93-aspiration" data-title="Aspiration à l’aiguille"><p class="lab">Technique</p><p>Sous anesthésie locale, un cathéter est introduit dans l’espace pleural, au bord supérieur de la côte, puis l’air est aspiré à la seringue par un robinet à trois voies. La BTS 2010 conseillait d’interrompre l’aspiration au-delà de 2,5 L, volume qui suggère une fuite persistante.</p><p class="lab">Résultat</p><p>Le succès se juge sur l’amélioration des symptômes et une amélioration radiologique durable. Dans l’essai de Marx, l’aspiration échouait à 24 heures chez 29 % des patients contre 18 % sous drain, mais elle était moins douloureuse.</p><p class="lab">Place</p><p>La BTS 2023 la propose, comme le drain, chez le patient symptomatique qui ne relève ni de la surveillance ni du dispositif ambulatoire. Elle raccourcit l’hospitalisation mais impose plus souvent un second geste.</p><div class="key"><b>Limite.</b> Le patient de 50 ans ou plus fumeur répond moins bien à l’aspiration, raison pour laquelle la BTS 2023 le classe avec les formes secondaires.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.202110-2409OC" target="_blank" rel="noopener">Marx et al., 2023</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-drain" data-title="Drain thoracique"><p class="lab">Matériel</p><p>Un drain de petit calibre, posé par technique de Seldinger dans le triangle de sécurité, suffit à la plupart des pneumothorax. Il est relié à un système à valve sous eau qui laisse sortir l’air sans le laisser entrer.</p><p class="lab">Surveillance</p><p>Le patient est revu chaque jour : bullage, oscillation du liquide avec la respiration, radiographie. Le bullage persistant signale une fuite active ; l’absence d’oscillation évoque un drain bouché, coudé ou un poumon réexpandu.</p><p class="lab">Retrait</p><p>Le drain est retiré lorsque le bullage a cessé et que le poumon est réexpandu. Aucune donnée ne démontre le bénéfice d’une aspiration continue.</p><div class="trap"><span class="k">Piège</span>Clamper un drain qui bulle peut créer un pneumothorax sous tension.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-brown2020" data-title="Essai de Brown, New England Journal of Medicine 2020"><p class="lab">Question</p><p>La surveillance est-elle une alternative acceptable à l’intervention dans le pneumothorax spontané primaire modéré à grand, non compliqué ?</p><p class="lab">Méthode</p><p>Essai ouvert, multicentrique, de non-infériorité, mené en Australie et en Nouvelle‑Zélande chez 316 patients de 14 à 50 ans présentant un premier pneumothorax primaire unilatéral modéré à grand. Le critère principal était la réexpansion à 8 semaines.</p><p class="lab">Résultats</p><p>La réexpansion à 8 semaines atteignait 98,5 % sous intervention et 94,4 % sous surveillance, différence compatible avec la non-infériorité. Sous surveillance, 15,4 % des patients ont eu besoin d’un geste. Les récidives à 12 mois concernaient 16,8 % des patients traités par intervention et 8,8 % des patients surveillés ; les événements indésirables graves étaient moins fréquents sous surveillance.</p><div class="key"><b>Limite.</b> Le résultat principal n’était pas robuste lorsque les données manquantes étaient comptées comme des échecs ; les auteurs parlent de preuve modeste. Les patients très symptomatiques étaient exclus.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1910775" target="_blank" rel="noopener">Brown et al., N Engl J Med 2020;382:405-415</a>.</p></template>
<template data-pop="j93-hallifax2020" data-title="Essai de Hallifax, Lancet 2020"><p class="lab">Question</p><p>Un dispositif ambulatoire réduit-il l’hospitalisation du pneumothorax primaire symptomatique par rapport à la prise en charge standard ?</p><p class="lab">Méthode</p><p>Essai ouvert randomisé, mené dans 24 hôpitaux britanniques chez 236 adultes de 16 à 55 ans ; comparaison entre dispositif ambulatoire et aspiration ou drain conventionnel.</p><p class="lab">Résultats</p><p>À 30 jours, la durée médiane d’hospitalisation était de 0 jour sous dispositif ambulatoire contre 4 jours sous traitement standard. Les effets indésirables touchaient 55 % des patients du groupe ambulatoire contre 39 % ; les 14 événements graves sont tous survenus dans le groupe ambulatoire, notamment par agrandissement du pneumothorax ou dysfonction du dispositif.</p><div class="key"><b>Conséquence.</b> Le dispositif ambulatoire est une option pour le patient qui privilégie l’absence d’hospitalisation, dans une filière organisée.</div><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(20)31043-6" target="_blank" rel="noopener">Hallifax et al., Lancet 2020</a>.</p></template>
<template data-pop="j93-marx2023" data-title="Essai de Marx, 2023 : aspiration ou drain"><p class="lab">Question</p><p>L’aspiration simple est-elle non inférieure au drain pour le pneumothorax primaire complet ?</p><p class="lab">Méthode</p><p>Essai randomisé ouvert mené dans 31 hôpitaux français chez 402 adultes de 18 à 50 ans présentant un décollement complet du poumon.</p><p class="lab">Résultats</p><p>L’échec à 24 heures concernait 29 % des patients aspirés et 18 % des patients drainés. L’aspiration provoquait moins de douleur et moins de problèmes de matériel. La récidive à un an était de 20 % contre 27 %, sans différence significative.</p><div class="key"><b>Conséquence.</b> L’aspiration est moins efficace au premier essai mais mieux tolérée ; le choix se discute avec le patient selon sa priorité.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.202110-2409OC" target="_blank" rel="noopener">Marx et al., Am J Respir Crit Care Med 2023;207:1475-1485</a>.</p></template>
<template data-pop="j93-analgesie" data-title="Analgésie : pourquoi elle précède le geste"><p class="lab">Mécanisme</p><p>La douleur pleurale limite l’inspiration profonde et la toux ; elle favorise l’hypoventilation et l’encombrement, surtout dans les formes secondaires.</p><p class="lab">Conduite</p><p>Le paracétamol traite la douleur légère à modérée. Un anti-inflammatoire non stéroïdien ou un opioïde peuvent compléter selon l’intensité et les contre-indications. La BTS 2023 demande une analgésie adéquate avant et après une pleurodèse chimique, très douloureuse.</p><p class="lab">Précautions</p><p>Les opioïdes dépriment la ventilation : chez le patient atteint de BPCO hypercapnique, ils se titrent prudemment et s’évitent en association avec les benzodiazépines.</p><div class="key"><b>À retenir.</b> Un patient soulagé respire mieux, tolère le geste et coopère à la surveillance.</div></template>
<template data-pop="j93-chirurgie" data-title="Chirurgie du pneumothorax"><p class="lab">Techniques</p><p>La vidéothoracoscopie introduit une caméra et des instruments par de petites incisions. Le chirurgien résèque les blebs ou bulles à l’agrafeuse et réalise une pleurodèse par abrasion pleurale, pleurectomie partielle ou poudrage de talc. La thoracotomie ouvre la paroi.</p><p class="lab">Résultats</p><p>Selon les méta-analyses de la BTS 2023, la récidive après chirurgie est d’environ 54 pour 1 000 contre 298 pour 1 000 après drain seul. Elle est légèrement plus élevée après vidéothoracoscopie, environ 31 pour 1 000, qu’après thoracotomie, 15 pour 1 000 ; la vidéothoracoscopie réduit en revanche la durée d’hospitalisation, la douleur et les complications.</p><p class="lab">Choix</p><p>La vidéothoracoscopie est l’abord habituel. La thoracotomie se discute lorsque le risque de récidive doit être le plus bas possible, par exemple pour certaines professions. La résection et la pleurodèse obtiennent des résultats comparables ; elles sont souvent associées.</p><div class="key"><b>Limite.</b> Le patient pèse le bénéfice sur la récidive contre le risque de douleur chronique et de paresthésies.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, questions cliniques 4 et 5</a>.</p></template>
<template data-pop="j93-pleurodese" data-title="Pleurodèse au talc"><p class="lab">Mécanisme</p><p>Le talc agresse le mésothélium et déclenche une inflammation, un dépôt de fibrine puis une prolifération fibroblastique. Les deux feuillets fusionnent : sans espace pleural, l’air ne peut plus s’accumuler.</p><p class="lab">Modalités</p><p>Le talc est soit poudré pendant une thoracoscopie, soit instillé en suspension par le drain, le poumon devant être réexpandu. Dans un essai randomisé suisse de Tschopp, le talcage thoracoscopique sous anesthésie locale a réduit le recours à un second geste : 1 patient sur 61 contre 10 sur 47 après drainage seul.</p><p class="lab">Précautions</p><p>La BTS 2023 recommande un talc calibré, car un talc non calibré, riche en petites particules, a été associé à des syndromes de détresse respiratoire aiguë. La douleur et une fièvre transitoire sont attendues ; l’analgésie se planifie.</p><div class="key"><b>Limite.</b> Une pleurodèse complique une chirurgie thoracique ultérieure ; elle se discute avant tout projet de transplantation.</div><p class="src">Références : <a href="https://doi.org/10.1183/09031936.02.00278202" target="_blank" rel="noopener">Tschopp et al., Eur Respir J 2002</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-avion" data-title="Avion après un pneumothorax"><p class="lab">Mécanisme</p><p>La cabine des avions de ligne est pressurisée à une altitude d’environ 2 400 m. Selon la loi de Boyle‑Mariotte, un volume d’air piégé y augmente d’environ 30 %, ce qui peut transformer un pneumothorax résiduel en pneumothorax compressif loin de tout secours.</p><p class="lab">Règle de la BTS</p><p>Un patient porteur d’un pneumothorax persistant ne prend pas de vol commercial avant la résolution radiologique complète. Lorsque la résolution est confirmée, le vol est possible 7 jours après la radiographie qui la démontre ; ce délai vise à exclure une récidive précoce.</p><div class="key"><b>Limite.</b> Le risque de récidive reste élevé pendant la première année ; un patient qui doit voler souvent ou loin peut discuter une prévention chirurgicale.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, qui renvoie à la déclaration BTS sur le voyage aérien 2022</a>.</p></template>
<template data-pop="j93-plongee" data-title="Plongée sous-marine après un pneumothorax"><p class="lab">Mécanisme</p><p>À 10 m de profondeur, la pression ambiante double. Pendant la remontée, l’air piégé dans une bulle ou une cavité pleurale double de volume entre 10 m et la surface ; un pneumothorax sous tension peut survenir sous l’eau, sans possibilité de secours.</p><p class="lab">Règle de la BTS</p><p>La plongée avec bouteilles est déconseillée définitivement après un pneumothorax, sauf si une stratégie de prévention définitive très sûre, comme une pleurectomie chirurgicale, a été réalisée.</p><div class="key"><b>Conséquence.</b> Un plongeur professionnel ou passionné doit recevoir cette information dès le premier épisode, car elle peut orienter vers la chirurgie.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j93-grossesse" data-title="Pneumothorax et grossesse"><p class="lab">Mécanisme</p><p>La grossesse augmente la consommation d’oxygène et la ventilation ; pendant le travail, la consommation d’oxygène peut croître de 50 % et les efforts expulsifs répétés élèvent la pression intrathoracique.</p><p class="lab">Conduite</p><p>Un petit pneumothorax de moins de 2 cm, sans dyspnée maternelle ni souffrance fœtale, peut être surveillé ; sinon, une aspiration ou un drain sont indiqués. Pneumologue, obstétricien et chirurgien thoracique coopèrent.</p><p class="lab">Accouchement</p><p>Pour éviter les efforts expulsifs, la BTS 2023 évoque un accouchement assisté programmé à terme sous anesthésie péridurale. Si une césarienne est nécessaire, une rachianesthésie est préférée à l’anesthésie générale.</p><div class="key"><b>Limite.</b> Les données sur la récidive lors des grossesses suivantes sont insuffisantes pour une recommandation ferme.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, grossesse</a>.</p></template>
<template data-pop="j93-ventile" data-title="Pneumothorax sous ventilation mécanique"><p class="lab">Mécanisme</p><p>La pression positive pousse l’air dans la brèche à chaque insufflation ; la fuite s’entretient et la tension s’installe rapidement.</p><p class="lab">Signes</p><p>En ventilation volumétrique, les pressions de crête et de plateau augmentent ; en ventilation en pression, le volume courant chute. Une désaturation brutale, une hypotension et une asymétrie auscultatoire complètent le tableau. L’échographie au lit montre l’abolition du glissement.</p><p class="lab">Conduite</p><p>La décompression puis le drainage sont la règle. La pression expiratoire positive et les volumes sont réévalués pour limiter la fuite.</p><div class="key"><b>Piège.</b> Une intubation sélective abolit aussi le glissement pleural du côté non ventilé ; la position de la sonde se vérifie.</div></template>
<template data-pop="j93-gaz" data-title="Gaz du sang artériel"><p class="lab">Valeurs normales</p><p>Chez l’adulte jeune en air ambiant, la PaO₂ se situe entre 10,5 et 13,5 kPa et la PaCO₂ entre 4,7 et 6,0 kPa ; le pH est compris entre 7,35 et 7,45.</p><p class="lab">Interprétation</p><p>Le pneumothorax provoque une hypoxémie par effet shunt. Chez le sujet jeune, l’hyperventilation abaisse la PaCO₂. Une PaCO₂ normale ou élevée chez un patient atteint de BPCO signale une réserve ventilatoire épuisée.</p><p class="lab">Indication</p><p>Les gaz du sang ne sont pas nécessaires chez le jeune patient stable dont la saturation est normale. Ils guident l’oxygène et la surveillance dans les formes secondaires.</p><div class="key"><b>À retenir.</b> Dans un pneumothorax secondaire, une hypercapnie classe le patient à haut risque.</div></template>
<template data-pop="j93-lidocaine" data-title="Lidocaïne : dose et toxicité"><p class="lab">Mécanisme</p><p>La lidocaïne bloque les canaux sodiques voltage-dépendants des fibres nerveuses ; la conduction de la douleur est interrompue dans la zone infiltrée.</p><p class="lab">Dose</p><p>Pour les gestes pleuraux, la BTS retient au plus 3 mg/kg ; pour l’instillation précédant la pleurodèse au talc, 3 mg/kg sans dépasser 250 mg. Infiltration et instillation se cumulent.</p><p class="lab">Toxicité</p><p>Les premiers signes sont des paresthésies péribuccales, un goût métallique, des acouphènes et une agitation. Viennent ensuite des convulsions, une dépression respiratoire et des troubles du rythme. Le médecin arrête l’injection, assure la ventilation, traite les convulsions et administre une émulsion lipidique dans les formes graves.</p><div class="key"><b>Prévention.</b> Calculer la dose au poids et aspirer avant chaque injection pour éviter une injection intravasculaire.</div><p class="src">Références : <a href="https://brit-thoracic.org.uk/document-library/clinical-statements/pleural-procedures/online-appendix-12-pleural-procedures-intrapleural-treatment" target="_blank" rel="noopener">BTS, gestes pleuraux 2023, annexe 12</a>.</p></template>
<template data-pop="pareto-j93-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j93-0,j93-1,j93-2,j93-3,j93-4,j93-5,j93-6"></p><ul><li>Le pneumothorax est de l’air dans la cavité pleurale ; spontané primaire sans maladie pulmonaire connue, secondaire sur poumon malade ou après 50 ans chez le fumeur.</li><li>La pression pleurale négative maintient le poumon contre la paroi ; une brèche la supprime et le poumon se rétracte.</li><li>Un mécanisme valvulaire rend la pression positive : la tension comprime les veines caves et provoque un choc obstructif.</li><li>Le tabac multiplie le risque et la récidive ; un patient sur trois récidive après un premier épisode primaire.</li><li>Douleur latérale brutale, dyspnée selon la réserve ; murmure aboli et tympanisme.</li></ul></template>
<template data-pop="pareto-j93-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j93-7"></p><ul><li>Radiographie debout chez le patient stable, échographie au lit, scanner en cas de doute.</li><li>La taille juge la sécurité du geste : au moins 2 cm latéral ou apical.</li><li>Une bulle géante simule un pneumothorax ; le scanner précède le drain.</li></ul></template>
<template data-pop="pareto-j93-tt" data-title="Pareto — Urgences et prise en charge"><p class="ratio" data-cover="j93-8,j93-9"></p><ul><li>La tension se diagnostique cliniquement et se décomprime avant l’imagerie, puis se draine.</li><li>BTS 2023 : symptômes, haut risque, sécurité du geste, puis choix partagé.</li><li>Peu symptomatique : surveillance quelle que soit la taille ; symptomatique sans haut risque : valve ambulatoire ou aspiration ; haut risque : drain et hospitalisation.</li><li>Un drain qui bulle ne se clampe jamais.</li></ul></template>
<template data-pop="pareto-j93-suivi" data-title="Pareto — Récidive, suivi et critères"><p class="ratio" data-cover="j93-10,j93-11,j93-12,j93-13"></p><ul><li>Chirurgie après une deuxième récidive homolatérale, un premier épisode controlatéral, une fuite persistante de 5 à 7 jours ou une profession à risque.</li><li>Arrêt du tabac, contrôle à 2 à 4 semaines, avion 7 jours après la résolution, plongée proscrite sans chirurgie définitive.</li><li>Le pneumothorax secondaire, même petit, se traite à l’hôpital.</li><li>Le diagnostic exige la preuve de l’air pleural ; la tension est un diagnostic clinique.</li></ul></template>
<template data-pop="pareto-j93-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j93-e-1,j93-e-2,j93-e-3"></p><ul><li>Scanner : référence ; radiographie : première intention chez le patient stable.</li><li>Ligne pleurale sans trame au-delà ; en décubitus, signe du sillon profond.</li><li>Échographie : glissement absent évocateur, point poumon spécifique.</li></ul></template>
<template data-pop="pareto-j93-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j93-p-1,j93-p-2,j93-p-3"></p><ul><li>Oxygène titré : 94 à 98 %, ou 88 à 92 % en cas de risque hypercapnique.</li><li>Lidocaïne au plus 3 mg/kg, dose cumulée ; talc calibré 4 à 5 g.</li><li>Pas de pression positive sur un pneumothorax non drainé sans surveillance étroite.</li></ul></template>
