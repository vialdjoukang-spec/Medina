<h1>Pneumothorax</h1><span class="status">Adulte · pneumothorax spontanés primaire, secondaire et sous tension · rédaction du 08.10.2026 · référentiels BTS 2023 et ERS 2015</span></div>

<section class="ilot" id="j93-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un étudiant de 22 ans, grand et mince, fumeur, ressent au repos une douleur thoracique droite en coup de poignard, suivie d’un essoufflement modéré. Il parle sans peine ; sa saturation pulsée atteint 97 % en air ambiant. La radiographie montre un décollement pleural de 3 cm à l’apex. <b>La taille de ce pneumothorax impressionne ; elle ne décide pourtant plus seule du traitement.</b> Les symptômes, la stabilité physiologique, le terrain pulmonaire et la priorité du patient guident désormais le choix.</p><p>Le pneumothorax est fréquent, souvent bénin chez le sujet jeune, parfois mortel lorsqu’il comprime le médiastin ou survient sur un poumon déjà malade. Le médecin doit donc savoir reconnaître en quelques minutes le pneumothorax sous tension, distinguer la forme primaire de la forme secondaire, choisir entre surveillance, aspiration, valve ambulatoire et drain, puis organiser la prévention des récidives et les conseils de vie.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="j93-pression-pleurale">La pression pleurale négative (pourquoi l’air entre et le poumon se rétracte)</button> ; <button class="w" data-k="j93-tension-mecanisme">le mécanisme valvulaire du pneumothorax sous tension (pourquoi il tue)</button>.</div></section>
<section class="ilot" id="j93-1"><h2><span class="n">1</span>Définition, classification et codage</h2><p>Le <b>pneumothorax</b> est la présence d’air dans la cavité pleurale, espace virtuel situé entre la plèvre viscérale, qui recouvre le poumon, et la plèvre pariétale, qui tapisse la paroi. Il est dit <b>spontané</b> lorsqu’il survient sans traumatisme ni geste médical. Le pneumothorax spontané <b>primaire</b> touche un sujet sans maladie pulmonaire connue ; le pneumothorax spontané <b>secondaire</b> complique une maladie pulmonaire établie, le plus souvent une BPCO. La recommandation BTS 2023 classe aussi en secondaire tout patient de 50 ans ou plus avec un tabagisme significatif, car ce groupe répond moins bien à l’aspiration.</p><p>Le terme « primaire » ne signifie pas « poumon normal » : la majorité de ces patients présente au scanner des <button class="w" data-k="j93-blebs">lésions apicales de type emphysémateux (blebs, bulles et porosité pleurale)</button>. La distinction reflète une différence de pronostic et de prise en charge, non une absence de lésion. Le <b>pneumothorax sous tension</b> est un mode évolutif : la pression intrapleurale devient positive pendant tout le cycle respiratoire et entrave le retour veineux.</p><table class="t"><tr><th>Code et intitulé</th><th>Situation couverte dans ce cours</th></tr><tr><td><b>J93.0 — Pneumothorax spontané avec pression positive</b></td><td>Pneumothorax spontané sous tension ; urgence vitale.</td></tr><tr><td><b>J93.1 — Autres pneumothorax spontanés</b></td><td>Pneumothorax spontané primaire ou secondaire sans tension.</td></tr><tr><td><b>J93.8 — Autres pneumothorax</b></td><td>Formes spontanées particulières non classées ailleurs, par exemple chroniques.</td></tr><tr><td><b>J93.9 — Pneumothorax, sans précision</b></td><td>Mécanisme non documenté ; préciser dès que possible.</td></tr></table><p>Le tableau se lit avec ses exclusions. Le <b>pneumothorax traumatique</b> relève de S27.0, le pneumothorax iatrogène de J95.80, la forme congénitale ou périnatale de P25.1 et le pneumothorax d’une tuberculose active de A15–A16 ; le pyopneumothorax relève de J86. Ce cours en traite les principes par renvoi : <button class="w" data-k="j93-traumatique">pneumothorax traumatique (spécificités et renvoi)</button> ; <button class="w" data-k="j93-iatrogene">pneumothorax iatrogène (gestes en cause et évolution)</button>.</p><div class="key"><b>À retenir.</b> Le codage suit le mécanisme : spontané, traumatique ou iatrogène. Le caractère primaire ou secondaire, puis la présence d’une tension, orientent ensuite toute la conduite.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j90-j94.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc J90–J94</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">Roberts et al., recommandation BTS 2023, Thorax</a>.</p></section>
<section class="ilot" id="j93-2"><h2><span class="n">2</span>Épidémiologie et récidive</h2><p>Dans la cohorte d’Olmsted County, l’incidence ajustée du pneumothorax spontané primaire atteignait 7,4 pour 100 000 hommes et 1,2 pour 100 000 femmes par an ; celle du pneumothorax secondaire, 6,3 et 2,0. Une série suédoise rapporte 18 et 6 pour 100 000. Au Royaume‑Uni, les admissions hospitalières sont passées de 9,1 à 14,1 pour 100 000 habitants en cinquante ans. Aucune donnée d’incidence nationale suisse publiée n’a été identifiée ; les chiffres européens servent donc de repère.</p><p>La forme primaire culmine entre 15 et 34 ans, chez des hommes grands et minces. La forme secondaire touche plutôt des sujets de plus de 50 ans porteurs d’une BPCO. <b>La récidive est la donnée qui pèse le plus sur le suivi</b> : une méta-analyse de 13 548 patients retrouve 29 % de récidive à un an et 32 % au total après un premier pneumothorax primaire, avec un risque maximal pendant la première année. Après un premier pneumothorax secondaire, la BTS cite 13 à 39 %.</p><p>Deux facteurs modulent ce risque. Le sexe féminin triple environ la probabilité de récidive, peut-être en partie par des formes cataméniales méconnues. L’arrêt du tabac la divise par quatre environ : <button class="w" data-k="j93-tabac">le tabac est le premier facteur modifiable (relation dose-effet et mécanisme)</button>.</p><div class="key"><b>À retenir.</b> Un patient sur trois récidive après un premier pneumothorax primaire, surtout dans l’année. L’arrêt du tabac est la mesure préventive la plus simple et l’une des plus efficaces.</div><p class="src">Références : <a href="https://doi.org/10.1164/arrd.1979.120.6.1379" target="_blank" rel="noopener">Melton et al., Am Rev Respir Dis 1979</a> ; <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., Chest 1987</a> ; <a href="https://doi.org/10.1183/13993003.00864-2018" target="_blank" rel="noopener">Walker et al., méta-analyse, Eur Respir J 2018</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023</a>.</p></section>
<section class="ilot" id="j93-3"><h2><span class="n">3</span>Du vide pleural au collapsus</h2><p>À l’état normal, le poumon tend à se rétracter vers le hile, tandis que la cage thoracique tend à s’expandre. Ces deux forces opposées créent dans la cavité pleurale une <button class="w" data-k="j93-pression-pleurale">pression négative d’environ −5 cm d’eau en fin d’expiration (origine et valeur)</button>. Le film liquidien pleural, de quelques millilitres, couple les deux feuillets : le poumon suit la paroi parce qu’aucun gaz ne peut s’interposer.</p><p>Dès qu’une brèche fait communiquer une alvéole ou l’extérieur avec la cavité pleurale, l’air s’engouffre selon le gradient de pression. Le couplage disparaît ; <button class="w" data-k="j93-retraction">la rétraction élastique du poumon (pourquoi il s’affaisse vers le hile)</button> l’emporte. L’air entre jusqu’à l’égalisation des pressions ou la fermeture de la brèche. Le poumon collabé reste perfusé mais n’est plus ventilé : cet effet shunt explique l’hypoxémie, souvent modeste chez le sujet jeune grâce à la vasoconstriction hypoxique.</p><p>Dans la forme primaire, la fuite naît le plus souvent d’une zone apicale fragilisée, où la contrainte mécanique est maximale. Dans la forme secondaire, <button class="w" data-k="j93-secondaire">un poumon malade tolère mal la perte de volume (réserve et gravité)</button> : un pneumothorax de petite taille peut alors provoquer une insuffisance respiratoire. Lorsque la brèche se comporte comme une valve unidirectionnelle, l’air entre à chaque inspiration sans ressortir ; la pression devient positive, refoule le médiastin et écrase les veines caves. C’est le <button class="w" data-k="j93-tension-mecanisme">pneumothorax sous tension (chaîne hémodynamique)</button>.</p><div class="key"><b>Conséquence pratique.</b> L’air pleural se résorbe lentement, environ 1,25 à 2,2 % du volume de l’hémithorax par jour selon les mesures physiologiques anciennes. <button class="w" data-k="j93-oxygene">L’oxygène accélère cette résorption (gradient d’azote)</button>, mais la fermeture de la brèche reste la condition de la guérison.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, définitions</a> ; <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">Tschopp et al., ERS 2015</a>.</p></section>
<section class="ilot" id="j93-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2><p>Le pneumothorax primaire associe un terrain morphologique, une exposition et parfois une prédisposition génétique. Le <b>tabac</b> multiplie le risque d’un premier épisode par 22 environ chez l’homme et par 9 chez la femme, avec une relation dose-effet nette ; le cannabis fumé y contribue aussi. La grande taille et la minceur augmentent la contrainte mécanique apicale. La plupart des épisodes surviennent au repos : l’effort n’en est pas la cause habituelle.</p><p>Le pneumothorax secondaire révèle ou complique une maladie du parenchyme. Le tableau classe les causes selon leur mécanisme, car celui-ci prédit la gravité et la conduite.</p><table class="t"><tr><th>Groupe</th><th>Exemples</th><th>Mécanisme de la fuite</th></tr><tr><td>Maladies des voies aériennes</td><td>BPCO avec emphysème, asthme sévère, <button class="w" data-k="j93-mucoviscidose">mucoviscidose (fréquence et pronostic)</button></td><td>Rupture de bulles ; hyperinflation et piégeage aérien</td></tr><tr><td>Infections</td><td>Pneumocystose chez la personne vivant avec le VIH, tuberculose, pneumonie nécrosante</td><td>Nécrose du parenchyme sous-pleural</td></tr><tr><td>Maladies kystiques et interstitielles</td><td>Lymphangioléiomyomatose, histiocytose langerhansienne, fibrose pulmonaire</td><td>Kystes sous-pleuraux ; rigidité du parenchyme</td></tr><tr><td>Maladies génétiques</td><td><button class="w" data-k="j93-genetique">Syndrome de Birt‑Hogg‑Dubé, sclérose tubéreuse, Marfan, Ehlers‑Danlos (gènes et indices)</button></td><td>Kystes ou fragilité du tissu conjonctif</td></tr><tr><td>Néoplasies</td><td>Cancer bronchique, métastases de sarcome</td><td>Nécrose tumorale sous-pleurale</td></tr><tr><td>Endométriose thoracique</td><td><button class="w" data-k="j93-catamenial">Pneumothorax cataménial (rythme et mécanismes)</button></td><td>Fenestrations diaphragmatiques ; dépôts pleuraux</td></tr></table><p>Le tableau se lit à partir du patient : une femme qui récidive autour des règles oriente vers l’endométriose ; des kystes pulmonaires et des antécédents familiaux orientent vers une cause génétique. Environ 10 % des patients rapportent un antécédent familial, ce qui justifie un scanner et un avis spécialisé.</p><div class="key"><b>À retenir.</b> Chez un fumeur jeune et mince, le pneumothorax primaire est l’hypothèse dominante. Une récidive cataméniale, des kystes ou une histoire familiale imposent de rechercher une cause sous-jacente.</div><p class="src">Références : <a href="https://doi.org/10.1378/chest.92.6.1009" target="_blank" rel="noopener">Bense et al., Chest 1987</a> ; <a href="https://doi.org/10.1136/thorax-2022-219784" target="_blank" rel="noopener">BTS 2023, pneumothorax familial et cataménial</a>.</p></section>
<section class="ilot" id="j93-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le maître symptôme est une <button class="w" data-k="j93-douleur-pleurale">douleur thoracique latérale brutale, majorée à l’inspiration (innervation de la plèvre pariétale)</button>. Elle survient typiquement au repos, s’atténue souvent en quelques heures et peut conduire le patient à consulter tardivement, parfois après plusieurs jours. La <button class="w" data-k="j93-dyspnee">dyspnée (déterminants et signification)</button> dépend moins de la taille que de la réserve respiratoire : un jeune peut tolérer un poumon largement collabé, un patient atteint de BPCO non.</p><p>L’interrogatoire recherche ensuite les éléments qui changent la conduite : maladie pulmonaire connue, tabagisme et cannabis, épisodes antérieurs du même côté ou du côté opposé, rythme cataménial, antécédents familiaux, profession exposée (pilote, plongeur) et projets de voyage aérien. Une toux, une fièvre ou une hémoptysie orientent vers une cause secondaire.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Un homme jeune décrit une douleur unilatérale soudaine, puis une gêne respiratoire modérée. Il est stable et ses constantes sont proches de la normale.</p></div><div class="card"><h4>Formes atypiques</h4><p>Un patient atteint de BPCO présente une dyspnée disproportionnée sans douleur nette. Une femme jeune récidive dans les 72 heures autour des règles. Un patient ventilé se désature brutalement avec des pressions d’insufflation élevées.</p></div></div><div class="key"><b>À retenir.</b> L’anamnèse évalue la tolérance, le terrain et le risque de récidive. Une dyspnée disproportionnée chez un patient pulmonaire signale une forme secondaire grave.</div></section>
<section class="ilot" id="j93-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par la gravité : fréquence respiratoire, saturation pulsée, fréquence cardiaque, tension artérielle, capacité à parler et état de conscience. Une tachycardie marquée, une hypotension ou une désaturation importante orientent vers une tension ou une forme secondaire décompensée. Un petit pneumothorax peut être cliniquement muet ; l’examen normal ne l’exclut donc pas.</p><div class="two"><div class="card"><h4>Signes du côté atteint</h4><p>L’hémithorax se soulève moins. Le <button class="w" data-k="j93-murmure">murmure vésiculaire est diminué ou aboli (mécanisme acoustique)</button>. La percussion révèle un <button class="w" data-k="j93-tympanisme">tympanisme (air sous la paroi)</button> et les vibrations vocales sont abolies.</p></div><div class="card"><h4>Signes d’alarme</h4><p>Un <button class="w" data-k="j93-emphyseme-sc">emphysème sous-cutané (crépitation neigeuse)</button>, une turgescence jugulaire, une hypotension ou une <button class="w" data-k="j93-signes-tension">déviation trachéale controlatérale (signe tardif de tension)</button> imposent une réévaluation immédiate.</p></div></div><p>Le tableau typique associe diminution du murmure, tympanisme et abolition des vibrations : ce triplet distingue le pneumothorax de l’épanchement liquidien, qui donne une matité. Chez le patient emphysémateux, l’hyperinflation bilatérale rend ces signes peu discriminants.</p><div class="key"><b>À retenir.</b> L’examen sert d’abord à repérer la tension. Le diagnostic positif repose ensuite sur l’imagerie, car les signes physiques manquent dans les petits pneumothorax.</div><p class="src">Références : <a href="https://doi.org/10.1183/09031936.00219214" target="_blank" rel="noopener">Tschopp et al., ERS 2015</a>.</p><button class="pareto-btn ui" data-k="pareto-j93-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
