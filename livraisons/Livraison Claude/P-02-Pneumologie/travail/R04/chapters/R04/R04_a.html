<div class="chap-head"><div class="code">R04 — Hémoptysie et autres hémorragies des voies respiratoires · couvre R04 · épistaxis et saignement pharyngé traités en diagnostic différentiel · renvois : J47 — Bronchectasies, I26 — Embolie pulmonaire, J18 — Pneumonie, C34 — Cancer bronchopulmonaire · CIM-10-GM 2024 · Appareil respiratoire</div>
<h1>Hémoptysie</h1><span class="status">Adulte · approche symptomatique · gravité, diagnostic étiologique et prise en charge urgente · Revue médicale suisse 2015, Collège des enseignants de pneumologie (SPLF) 2023, CIRSE 2022 · état au 09.10.2026</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’hémoptysie</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#r04-0">Question clinique</a></li><li><a href="#r04-1">Définition et degrés de gravité</a></li><li><a href="#r04-2">Épidémiologie et pronostic</a></li><li><a href="#r04-3">D’où vient le sang et pourquoi il tue</a></li><li><a href="#r04-4">Étiologies</a></li><li><a href="#r04-5">Interroger pour confirmer et orienter</a></li><li><a href="#r04-6">Examiner pour juger la tolérance</a></li><li><a href="#r04-7">Établir le diagnostic</a></li><li><a href="#r04-8">Hémoptysie grave et complications</a></li><li><a href="#r04-9">Traiter l’hémoptysie</a></li><li><a href="#r04-10">Suivi, récidive et pronostic</a></li><li><a href="#r04-11">Situations particulières</a></li><li><a href="#r04-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="r04-0"><h2><span class="n">0</span>Question clinique</h2><p>Un homme de 58 ans, fumeur de quarante paquets-années, crache depuis deux jours des sécrétions striées de sang. Ce matin, au cours d’une quinte de toux, il a rejeté un verre de sang rouge vif, soit environ 100 mL. Il est conscient, sa SpO₂ est à 93 % à l’air ambiant et sa pression artérielle est normale. <b>Une hémoptysie, même minime, se traite comme une urgence : un premier épisode modeste peut récidiver sous une forme massive.</b></p><p>Le médecin doit répondre à trois questions, dans cet ordre. S’agit-il bien de sang venu des voies respiratoires sous-glottiques ? Quelle est la gravité, c’est-à-dire le risque d’asphyxie ? Quelle lésion saigne, et de quel côté ? Chez ce patient, l’âge et le tabac imposent en outre d’écarter un cancer bronchopulmonaire, même si le saignement se tarit.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="r04-definition">L’hémoptysie (définition et limites du terme)</button> ; <button class="w" data-justification="1" data-k="r04-asphyxie">l’asphyxie, cause du décès (mécanisme)</button>.</div></section>
<section class="ilot" id="r04-1"><h2><span class="n">1</span>Définition et degrés de gravité</h2><p>L’hémoptysie est le rejet par la bouche, au cours d’un effort de toux, de sang provenant des voies respiratoires sous-glottiques. Le Collège des enseignants de pneumologie de la SPLF précise que le saignement peut aussi rester non extériorisé : une hémorragie alvéolaire peut inonder le poumon sans que le patient crache. Le diagnostic positif exige d’écarter la <button class="w" data-justification="1" data-k="r04-pseudo">pseudo-hémoptysie (hématémèse, épistaxis postérieure, saignement pharyngé)</button>, où le sang vient du tube digestif ou des voies aériennes supérieures.</p><p>La gravité n’a pas de définition consensuelle. Les seuils publiés vont de 100 mL à 1 L par 24 heures, la plupart entre 300 et 600 mL. Le volume seul trompe, car la tolérance dépend de la réserve respiratoire : un saignement modeste peut asphyxier un patient dont le VEMS est inférieur à 35 % de la valeur prédite. Les sources récentes définissent donc la gravité par trois éléments.</p><table class="t"><tr><th>Élément</th><th>Ce qu’il mesure</th><th>Repère chiffré</th></tr><tr><td><button class="w" data-justification="1" data-k="r04-volume">Abondance</button></td><td>Volume rejeté et débit</td><td>≥ 200 mL chez un sujet sain (SPLF 2023)</td></tr><tr><td>Terrain</td><td>Réserve respiratoire préalable</td><td>Insuffisance respiratoire, VEMS &lt; 35 %</td></tr><tr><td>Tolérance et persistance</td><td>Hypoxémie, détresse, saignement qui ne se tarit pas</td><td>SpO₂ basse malgré l’oxygène, besoin d’intubation</td></tr></table><p>Ce tableau se lit de droite à gauche chez le patient fragile : une SpO₂ qui chute signe la gravité, quel que soit le volume. Chez le patient de l’îlot 0, 100 mL chez un sujet sans insuffisance respiratoire connue définissent une hémoptysie de moyenne abondance, qui exige l’hospitalisation et l’exploration. Le choix entre les seuils publiés est discuté dans une fenêtre dédiée : <button class="w" data-justification="1" data-k="r04-contentieux-massive">définitions concurrentes de l’hémoptysie grave (contentieux et choix retenu)</button>.</p><div class="key"><b>À retenir.</b> L’hémoptysie vient des voies sous-glottiques ; sa gravité se juge sur le volume, le terrain et la tolérance respiratoire, jamais sur le volume seul.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">Collège des enseignants de pneumologie (SPLF), item 205 Hémoptysie, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9117352/" target="_blank" rel="noopener">Kettenbach et al., CIRSE Standards of Practice on Bronchial Artery Embolisation, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., Dtsch Arztebl Int 2017</a>.</p></section>
<section class="ilot" id="r04-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’hémoptysie touche environ 0,1 % des patients ambulatoires et 0,2 % des patients hospitalisés chaque année. La base hospitalière nationale française, analysée sur cinq ans (2008–2012), en recense environ 15 000 adultes par an ; leur âge moyen est de 62 ans et le rapport hommes-femmes de 2 pour 1. Aucune donnée suisse publiée n’a été identifiée : les chiffres européens servent de repère.</p><p>Plus de 90 % des hémoptysies cèdent spontanément. Les formes massives représentent moins de 5 % des cas, mais leur mortalité atteint 50 à 100 % sans traitement adapté. Dans la cohorte française, la mortalité était de 9,2 % au premier séjour, de 21,6 % à un an et de 27 % à trois ans ; la récidive survenait chez 16,3 % des patients en trois ans.</p><p>Le pronostic dépend surtout de la cause. Dans une cohorte prospective italienne de 606 patients suivis 18 mois, seul le cancer bronchopulmonaire prédisait le décès (rapport de cotes 38,2), et les bronchectasies prédisaient la récidive (rapport de cotes 2,6). Un traitement anticoagulant ou antiagrégant n’augmentait ni la mortalité ni la récidive.</p><div class="key"><b>À retenir.</b> L’hémoptysie est un symptôme fréquent en pneumologie ; sa gravité immédiate tient à l’asphyxie, son pronostic à long terme tient à la maladie causale, au premier rang le cancer.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26022949/" target="_blank" rel="noopener">Abdulmalak et al., Eur Respir J 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8336236/" target="_blank" rel="noopener">Mondoni et al., Respir Res 2021</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-495/prise-en-charge-de-l-hemoptysie-massive" target="_blank" rel="noopener">Théone et al., Revue médicale suisse 2015</a>.</p></section>
<section class="ilot" id="r04-3"><h2><span class="n">3</span>D’où vient le sang et pourquoi il tue</h2><p>Le poumon reçoit <button class="w" data-justification="1" data-k="r04-double-circulation">deux circulations (pressions et débits)</button>. La circulation pulmonaire transporte tout le débit cardiaque vers les capillaires alvéolaires sous basse pression : la pression artérielle pulmonaire moyenne normale est de 14,0 ± 3,3 mmHg au repos. La circulation bronchique, nourricière, ne reçoit qu’environ 1 % de la perfusion pulmonaire ; ses artères naissent de l’aorte et travaillent sous pression systémique.</p><p>Une maladie chronique du poumon transforme cette petite circulation. La destruction du lit capillaire par une tuberculose, un cancer ou une fibrose, l’hyperhémie d’une infection et toute altération de la circulation artérielle pulmonaire libèrent des facteurs de croissance néo-angiogéniques. Les artères bronchiques s’élargissent et se ramifient : c’est l’<button class="w" data-justification="1" data-k="r04-hvs">hypervascularisation systémique (mécanisme et conséquences)</button>. Ces néovaisseaux à paroi mince, soumis à la pression aortique et plongés dans un tissu inflammatoire ou tumoral, se rompent dans la lumière bronchique. Environ 90 % des hémoptysies viennent ainsi des artères bronchiques, 5 % des artères pulmonaires et 5 % d’artères systémiques non bronchiques.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Double circulation pulmonaire et origine de l’hémoptysie" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="30" y="40" width="120" height="50"/><rect x="30" y="140" width="120" height="50"/><path d="M150 65h120M150 165h120"/><rect x="270" y="40" width="150" height="150"/><path d="M420 115h60"/><path d="M470 105l10 10-10 10"/><rect x="490" y="80" width="170" height="70"/></g><g fill="#222"><text x="40" y="60">Artère pulmonaire</text><text x="40" y="78">14 mmHg · 99 %</text><text x="40" y="160">Artères bronchiques</text><text x="40" y="178">pression aortique · 1 %</text><text x="280" y="70">Poumon malade :</text><text x="280" y="95">néovaisseaux fragiles</text><text x="280" y="120">90 % des saignements</text><text x="280" y="145">d’origine bronchique</text><text x="500" y="105">Sang dans les bronches</text><text x="500" y="130">asphyxie avant le choc</text></g></svg><figcaption>Figure 1 — La circulation bronchique, minoritaire mais à pression systémique, est la source habituelle de l’hémoptysie ; l’inondation bronchique tue par asphyxie. Schéma pédagogique, non à l’échelle.</figcaption></figure><p>Le danger n’est pas la perte de sang mais l’<button class="w" data-justification="1" data-k="r04-asphyxie">inondation des voies aériennes</button>. Les voies de conduction d’un adulte contiennent environ 150 à 200 mL : un saignement de ce volume suffit à les remplir. Le sang inhalé dans les alvéoles saines crée un shunt et une hypoxémie ; le décès survient par asphyxie, bien avant un choc hémorragique. La chute de l’hémoglobine et le retentissement hémodynamique sont exceptionnels et tardifs.</p><div class="key"><b>Conséquence thérapeutique.</b> Puisque le sang vient le plus souvent d’une artère systémique, l’embolisation des artères bronchiques est le traitement de référence ; puisque le danger est l’asphyxie, la première mesure protège le poumon qui ne saigne pas.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017, anatomie et physiopathologie</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, mécanismes</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/19324955/" target="_blank" rel="noopener">Kovacs et al., Eur Respir J 2009</a>.</p></section>
<section class="ilot" id="r04-4"><h2><span class="n">4</span>Étiologies</h2><p>Les causes sont nombreuses, mais quatre dominent les séries européennes : bronchectasies, cancer bronchopulmonaire, tuberculose active ou séquellaire et aspergillose pulmonaire chronique. Le Collège français les résume par un <button class="w" data-justification="1" data-k="r04-abcde">moyen mnémotechnique (aide pédagogique)</button>. Le tableau classe les causes par mécanisme, car le mécanisme oriente l’examen décisif.</p><table class="t"><tr><th>Mécanisme</th><th>Causes</th><th>Indice d’orientation</th></tr><tr><td>Infectieux et inflammatoire</td><td><button class="w" data-justification="1" data-k="r04-bronchectasies">Bronchectasies</button>, <button class="w" data-justification="1" data-k="r04-tuberculose">tuberculose</button>, <button class="w" data-justification="1" data-k="r04-aspergillome">aspergillome et aspergillose chronique</button>, pneumonie nécrosante, abcès</td><td>Bronchorrhée ancienne, caverne, séquelle</td></tr><tr><td>Tumoral</td><td><button class="w" data-justification="1" data-k="r04-cancer">Cancer bronchopulmonaire</button>, métastases, tumeur carcinoïde</td><td>Âge, tabac, altération de l’état général</td></tr><tr><td>Vasculaire</td><td><button class="w" data-justification="1" data-k="r04-ep">Embolie pulmonaire</button>, malformation artérioveineuse, anévrisme artériel pulmonaire</td><td>Immobilisation ; télangiectasies</td></tr><tr><td>Hémorragie alvéolaire</td><td><button class="w" data-justification="1" data-k="r04-hemorragie-alveolaire">Vascularites, connectivites</button>, insuffisance cardiaque gauche, rétrécissement mitral, toxiques</td><td>Anémie, infiltrats pulmonaires, signes systémiques</td></tr><tr><td>Iatrogène et traumatique</td><td>Biopsie, cathétérisme cardiaque droit, contusion ; <button class="w" data-justification="1" data-k="r04-anticoag">anticoagulants</button></td><td>Geste récent ; traitement en cours</td></tr><tr><td>Sans cause</td><td><button class="w" data-justification="1" data-k="r04-cryptogenique">Hémoptysie cryptogénique</button></td><td>Diagnostic retenu après scanner et bronchoscopie</td></tr></table><p>Deux règles évitent les erreurs fréquentes. Un trouble de la coagulation ou un anticoagulant ne suffit pas à expliquer une hémoptysie : il révèle le plus souvent une lésion sous-jacente qu’il faut chercher. La <button class="w" data-justification="1" data-k="r04-bpco">BPCO n’est pas une cause d’hémoptysie (conséquence pratique)</button> : chez un fumeur atteint de BPCO, le saignement impose de rechercher un cancer.</p><div class="trap"><span class="k">Erreur fréquente</span> Attribuer l’hémoptysie d’un patient sous anticoagulant à son seul traitement. Dans la cohorte italienne, l’anticoagulation ne modifiait ni la mortalité ni la récidive ; c’est la lésion révélée qui fait le pronostic.</div><div class="key"><b>À retenir.</b> Bronchectasies, cancer, tuberculose et aspergillose dominent ; l’anticoagulant révèle une lésion, il ne la remplace pas ; la BPCO n’explique jamais une hémoptysie.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, tableau 1</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26022949/" target="_blank" rel="noopener">Abdulmalak et al., 2015</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., Respir Res 2007</a>.</p></section>
<section class="ilot" id="r04-5"><h2><span class="n">5</span>Interroger pour confirmer et orienter</h2><p>L’interrogatoire confirme d’abord l’origine respiratoire. Le point crucial est la notion de sang rejeté au cours d’un effort de toux. Des <button class="w" data-justification="1" data-k="r04-prodromes">prodromes (chaleur rétrosternale, chatouillement laryngé, goût métallique)</button> précèdent souvent l’épisode. Le sang respiratoire est rouge vif, aéré et mêlé de mucus ; le sang digestif est plus sombre, acide, rejeté en vomissant et mêlé de débris alimentaires.</p><p>Le médecin quantifie ensuite le volume avec des <button class="w" data-justification="1" data-k="r04-volume">repères concrets (cuillère, verre, bol)</button>, puis date l’épisode : premier saignement ou récidive, crachats striés croissants ou rejet brutal. Il recherche les antécédents respiratoires (bronchectasies, tuberculose, cancer, aspergillose), cardiaques (valvulopathie mitrale), le tabagisme, une immobilisation ou une chirurgie récente, la prise d’anticoagulants ou d’antiagrégants et l’exposition à des toxiques comme la cocaïne base (crack).</p><div class="two"><div class="card"><b>Forme typique</b><p>Toux, crachats striés pendant quelques jours, puis rejet de sang rouge vif ; chez les patients admis en soins intensifs pour hémoptysie grave, la toux était présente dans 73 % des cas et la dyspnée dans 66 %.</p></div><div class="card"><b>Formes trompeuses</b><p>Sang dégluti puis vomi, qui simule une hématémèse ; hémorragie alvéolaire, où l’hémoptysie manque chez environ un tiers des patients ; crachats striés répétés, qui précèdent souvent une hémoptysie massive.</p></div></div><div class="trap"><span class="k">Piège</span> Une épistaxis postérieure ou un saignement pharyngolaryngé s’écoule vers le pharynx et peut être rejeté par la bouche, comme une hémoptysie. L’inspection du nasopharynx et, en cas de doute, l’endoscopie oto-rhino-laryngologique tranchent.</div><div class="key"><b>À retenir.</b> L’interrogatoire établit l’origine respiratoire, le volume, la chronologie et le terrain ; ces quatre éléments décident du lieu de prise en charge.</div><p class="src">Références : <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5478790/" target="_blank" rel="noopener">Ittrich et al., 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25891303/" target="_blank" rel="noopener">Parrot et al., Rev Mal Respir 2015</a>.</p></section>
<section class="ilot" id="r04-6"><h2><span class="n">6</span>Examiner pour juger la tolérance</h2><p>L’examen commence par la tolérance, car elle décide du lieu de soins. Le médecin mesure la SpO₂, la fréquence respiratoire, la pression artérielle et le pouls ; il recherche une cyanose, un tirage, des troubles de la conscience et un épuisement respiratoire. Une gêne thoracique latéralisée ou des crépitants localisés orientent vers le côté qui saigne : dans une série de 196 hémoptysies graves, 48 % des patients avaient au moins une anomalie localisée à l’auscultation.</p><p>L’examen recherche ensuite la cause. Un <button class="w" data-justification="1" data-k="r04-signes-orientation">hippocratisme digital, des télangiectasies ou une valvulopathie mitrale (valeur d’orientation)</button> évoquent respectivement des bronchectasies ou un cancer, une maladie de Rendu-Osler ou un rétrécissement mitral. Des signes de vascularite systémique orientent vers une hémorragie alvéolaire immunologique. L’<button class="w" data-justification="1" data-k="r04-examen-orl">inspection de la bouche et du nasopharynx</button> écarte une source haute.</p><div class="key"><b>À retenir.</b> Les signes vitaux et l’oxymétrie fixent la gravité ; la latéralisation et les signes extrapulmonaires orientent vers le site et la cause.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC1802746/" target="_blank" rel="noopener">Fartoukh et al., 2007, tableau 1</a> ; <a href="https://cep.splf.fr/wp-content/uploads/2023/07/ITEM_205_HEMOPTYSIE-2023.pdf" target="_blank" rel="noopener">SPLF 2023, examen clinique</a>.</p><button class="pareto-btn ui" data-k="pareto-r04-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
