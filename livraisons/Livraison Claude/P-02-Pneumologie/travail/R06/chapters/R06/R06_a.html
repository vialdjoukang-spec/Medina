<h1>Dyspnée et anomalies de la respiration</h1><span class="status">Adulte · dyspnée aiguë et chronique, stridor, sifflement, respiration périodique, hyperventilation, hoquet · référentiels SFMU/SRLF 2025, ERS 2024, ESMO 2020, palliative.ch · état au 09.10.2026</span></div>

<section class="ilot" id="r06-0"><h2><span class="n">0</span>Question clinique</h2><p>Monsieur R., 71 ans, ancien fumeur, s’essouffle depuis six mois en montant l’escalier de son immeuble. Depuis trois nuits, il dort assis dans un fauteuil. Sa fréquence respiratoire est de 24 par minute et sa saturation pulsée en oxygène (SpO₂) de 93 % à l’air ambiant.</p><p>La dyspnée n’est pas un diagnostic : c’est un symptôme, que seul le patient perçoit. Le médecin doit donc répondre successivement à deux questions. La première est la gravité immédiate : ce malade va-t-il s’épuiser dans les heures qui viennent ? La seconde est la cause, souvent double chez un sujet âgé, car le cœur et le poumon s’associent volontiers.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="r06-definition">La définition de la dyspnée (sensation subjective, non signe objectif)</button> ; <button class="w" data-k="r06-gravite">les signes de gravité (ceux qui imposent d’agir avant de comprendre)</button>.</div></section>
<section class="ilot" id="r06-1"><h2><span class="n">1</span>Définitions et classification</h2><p>La dyspnée est l’expérience subjective d’un inconfort respiratoire, faite de sensations qualitativement distinctes et d’intensité variable : c’est la définition de l’American Thoracic Society de 1999, reprise par l’ERS et l’ESMO. L’ERS et l’ESICM la décrivent en 2024 comme la perception désagréable et angoissante de sa propre respiration. L’essoufflement du sujet sain à l’effort en diffère : il n’est pas désagréable et cède dès que l’effort diminue.</p><p>Trois notions voisines ne doivent pas être confondues. La dyspnée est rapportée par le patient. La <button class="w" data-k="r06-detresse">détresse respiratoire (signes cliniques observables)</button> se voit au lit du malade. L’<button class="w" data-k="r06-detresse">insuffisance respiratoire aiguë (définition gazométrique)</button> se mesure : PaO₂ inférieure à 60 mmHg ou SpO₂ inférieure à 90 % à l’air ambiant. Ces trois dimensions peuvent se dissocier : un patient hypoxémique peut ne pas se plaindre, un patient anxieux peut souffrir sans hypoxémie.</p><p>La durée oriente la démarche. Une dyspnée aiguë s’installe en minutes ou en heures ; une dyspnée chronique, en mois ou en années. Une dyspnée qui persiste malgré le traitement optimal de sa cause et qui entraîne un handicap définit le <button class="w" data-k="r06-chronique">syndrome de dyspnée chronique (consensus ERS 2017)</button>. La position compte aussi : l’<button class="w" data-k="r06-orthopnee">orthopnée</button> survient couché, la <button class="w" data-k="r06-platypnee">platypnée</button> debout ou assis.</p><p>Plusieurs anomalies de la respiration accompagnent ou remplacent la dyspnée. Le tableau les définit par ce que le clinicien entend ou observe.</p><table class="t"><tr><th>Anomalie</th><th>Ce que l’on observe</th><th>Mécanisme dominant</th></tr><tr><td><button class="w" data-k="r06-stridor">Stridor</button></td><td>Bruit aigu, surtout inspiratoire</td><td>Flux turbulent dans le larynx ou la trachée rétrécis</td></tr><tr><td>Sifflement</td><td>Bruit musical, surtout expiratoire</td><td>Air forcé dans de petites bronches rétrécies</td></tr><tr><td><button class="w" data-k="r06-cheyne">Respiration de Cheyne-Stokes</button></td><td>Amplitude croissante puis décroissante, puis apnée centrale</td><td>Instabilité du contrôle chimique de la ventilation</td></tr><tr><td><button class="w" data-k="r06-hyperventilation">Hyperventilation</button></td><td>Ventilation excessive, soupirs, vertiges, paresthésies</td><td>Ventilation supérieure aux besoins, hypocapnie</td></tr><tr><td><button class="w" data-k="r06-kussmaul">Respiration de Kussmaul</button></td><td>Respiration ample et profonde</td><td>Compensation d’une acidose métabolique</td></tr><tr><td><button class="w" data-k="r06-hoquet">Hoquet</button></td><td>Secousse inspiratoire brève avec bruit glottique</td><td>Contraction myoclonique du diaphragme et fermeture de la glotte</td></tr></table><p>La lecture commence par le bruit ou le rythme, puis remonte au siège. Un stridor désigne les voies aériennes hautes et constitue une urgence ; un sifflement désigne les bronches. Une respiration ample et profonde évoque une acidose métabolique, non une maladie pulmonaire. L’hyperventilation ne se confond pas avec la tachypnée : un patient peut respirer vite et superficiellement avec une PaCO₂ normale.</p><div class="key"><b>À retenir.</b> La dyspnée est un vécu, la détresse un signe, l’insuffisance respiratoire une mesure. Le clinicien précise d’abord la durée, la position et le bruit respiratoire, car ils orientent vers l’étage atteint.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">Hui et al., recommandation ESMO sur la dyspnée du patient atteint de cancer, ESMO Open 2020</a> ; <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">Le Borgne et al., recommandations SFMU/SRLF sur la dyspnée aiguë en urgence, 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/28546269/" target="_blank" rel="noopener">Johnson et al., syndrome de dyspnée chronique, Eur Respir J 2017</a>.</p></section>
<section class="ilot" id="r06-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Environ 20 % de la population mondiale souffrirait d’une dyspnée chronique. En situation aiguë, la dyspnée représente 5 à 10 % des motifs de consultation aux urgences et environ 10 % des admissions en hospitalisation conventionnelle (SFMU/SRLF 2025). Dans une étude danoise citée par ce texte, elle était le cinquième motif d’appel aux centrales d’urgence, soit 8 % des appels, avec une mortalité de 10,5 % à 24 heures.</p><p>Les données suisses proviennent surtout des urgences. Dans une <button class="w" data-k="r06-cohorte-suisse">cohorte de deux hôpitaux universitaires suisses (Belkin, 2025)</button>, les 1144 patients admis pour dyspnée aiguë avaient un âge médian de 74 ans ; 52 % avaient une insuffisance cardiaque aiguë. La mortalité atteignait 7 % à 90 jours et 28 % à deux ans. Aucune prévalence suisse de la dyspnée chronique en population générale n’a été trouvée.</p><p>Certaines populations sont particulièrement exposées. La dyspnée touche 20 à 70 % des patients atteints de cancer, surtout thoracique et avancé (ESMO 2020). Environ 40 % des patients sous ventilation mécanique invasive en réanimation la rapportent (ERS/ESICM 2024). Le pronostic dépend de la cause, mais l’intensité du handicap compte aussi : le degré de l’échelle du Medical Research Council s’associe à la distance de marche, à la qualité de vie et à l’humeur, beaucoup plus qu’au volume expiratoire maximal par seconde (VEMS).</p><div class="key"><b>À retenir.</b> La dyspnée aiguë est fréquente et grave : près d’un patient sur trois admis aux urgences pour ce motif meurt dans les deux ans en Suisse. Le handicap se mesure par une échelle d’activité, non par la spirométrie seule.</div><p class="src">Références : <a href="https://doi.org/10.57187/s.3785" target="_blank" rel="noopener">Belkin et al., Swiss Medical Weekly 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38387998/" target="_blank" rel="noopener">Demoule et al., déclaration ERS/ESICM, Eur Respir J 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10377201/" target="_blank" rel="noopener">Bestall et al., Thorax 1999</a>.</p></section>
<section class="ilot" id="r06-3"><h2><span class="n">3</span>Comment naît la sensation dyspnéique</h2><p>Chez le sujet sain, chaque inspiration naît d’une commande motrice émise par les centres respiratoires du tronc cérébral et par le cortex. Une copie de cette commande, la <button class="w" data-k="r06-decharge">décharge corollaire (copie interne de la commande motrice)</button>, parvient au cortex sensoriel. Des <button class="w" data-k="r06-afferences">afférences chimiques et mécaniques (récepteurs et stimulus)</button> renseignent en retour sur le gaz carbonique, l’oxygène, l’étirement pulmonaire et le mouvement de la paroi. Tant que la ventilation obtenue correspond à la commande, la respiration reste inconsciente.</p><p>La dyspnée apparaît lorsque cet accord se rompt. Une commande neurale élevée qui n’obtient qu’une réponse mécanique limitée définit la <button class="w" data-k="r06-dissociation">dissociation neuromécanique (mécanisme commun)</button>. Le volume courant ne peut plus augmenter ; le patient ressent une inspiration insatisfaite. Chez des volontaires sains, ajouter 0,6 L d’espace mort et sangler le thorax aggrave l’inconfort bien plus que chaque contrainte isolée (O’Donnell, 2020).</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Genèse de la dyspnée : commande motrice, décharge corollaire, afférences et comparaison corticale" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="20" y="20" width="190" height="50" rx="6"/><rect x="250" y="20" width="190" height="50" rx="6"/><rect x="480" y="20" width="180" height="50" rx="6"/><rect x="250" y="150" width="190" height="56" rx="6"/><rect x="480" y="150" width="180" height="56" rx="6"/><path d="M210 45h40M440 45h40"/><path d="M115 70v105h135"/><path d="M570 70v80"/><path d="M480 178h-40" stroke-dasharray="6 4"/><path d="M345 150V95"/></g><g fill="#222"><text x="32" y="42">Centres respiratoires</text><text x="32" y="60">tronc cérébral, cortex</text><text x="262" y="42">Muscles respiratoires</text><text x="262" y="60">et paroi thoracique</text><text x="492" y="42">Ventilation obtenue</text><text x="492" y="60">volume courant</text><text x="120" y="168">décharge corollaire</text><text x="262" y="172">Cortex sensoriel :</text><text x="262" y="192">comparaison, dyspnée</text><text x="492" y="172">Afférences chimiques</text><text x="492" y="192">et mécaniques</text><text x="352" y="108">insula, amygdale :</text><text x="352" y="126">composante de détresse</text></g></svg><figcaption>Figure 1 — La dyspnée naît d’un écart entre la commande envoyée (décharge corollaire) et la ventilation obtenue (afférences). Les régions limbiques ajoutent la composante affective. Schéma pédagogique.</figcaption></figure><p>La sensation a deux composantes. La composante sensorielle mesure l’intensité ; la composante affective, la détresse. L’activation des régions <button class="w" data-k="r06-limbique">limbiques et paralimbiques (insula antérieure, amygdale)</button>, associée à une activation sympathique, explique l’anxiété et la panique. Les mots du patient reflètent en partie le mécanisme : l’oppression thoracique évoque une bronchoconstriction, la « soif d’air » une hyperinflation dynamique ou une maladie restrictive.</p><p>Une <button class="w" data-k="r06-spirale">spirale de déconditionnement</button> entretient ensuite le symptôme : le patient évite l’effort, perd sa masse musculaire et s’essouffle pour des efforts de plus en plus faibles. Bronchodilatateurs, réentraînement, oxygène d’effort et opioïdes soulagent par une voie commune : ils réduisent la dissociation neuromécanique.</p><div class="key"><b>À retenir.</b> La dyspnée traduit un désaccord entre la commande respiratoire et la ventilation obtenue, amplifié par l’émotion. Tout traitement efficace réduit la commande, améliore la mécanique ou atténue la perception.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6979461/" target="_blank" rel="noopener">O’Donnell et al., mécanismes de la dyspnée dans la BPCO, Adv Ther 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., évaluation de la dyspnée, Breathe (ERS) 2025</a>.</p></section>
<section class="ilot" id="r06-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Les causes de dyspnée se rangent selon l’étage atteint : la commande, la pompe ventilatoire, l’échangeur gazeux, la circulation, le transport de l’oxygène. Le tableau relie chaque famille à l’indice qui l’oriente et au cours qui la développe.</p><table class="t"><tr><th>Famille</th><th>Exemples</th><th>Indice d’orientation</th></tr><tr><td>Cœur</td><td>Insuffisance cardiaque (I50), valvulopathie, arythmie, ischémie, péricarde</td><td>Orthopnée, œdèmes, peptide natriurétique élevé</td></tr><tr><td>Voies aériennes</td><td>Asthme (J45), BPCO (J44), obstruction haute, <button class="w" data-k="r06-oli">obstruction laryngée induite</button></td><td>Sifflement, stridor, variabilité</td></tr><tr><td>Parenchyme</td><td>Pneumonie, pneumopathie interstitielle, œdème</td><td>Crépitants, fièvre, désaturation d’effort</td></tr><tr><td>Circulation pulmonaire</td><td>Embolie pulmonaire (I26), hypertension pulmonaire</td><td>Début brutal, DLCO abaissée</td></tr><tr><td>Plèvre</td><td>Épanchement, pneumothorax</td><td>Matité ou tympanisme, murmure aboli</td></tr><tr><td>Paroi et muscles</td><td>Scoliose, maladie neuromusculaire, paralysie diaphragmatique</td><td>Faiblesse, orthopnée sans cardiopathie</td></tr><tr><td>Sang et métabolisme</td><td>Anémie, acidose métabolique, dysthyroïdie</td><td>Pâleur, respiration de Kussmaul</td></tr><tr><td>Fonctionnelle</td><td><button class="w" data-k="r06-hyperventilation">Respiration dysfonctionnelle et hyperventilation</button></td><td>Soupirs, bâillements, examens normaux</td></tr><tr><td>Autres</td><td>Déconditionnement, obésité</td><td>Dyspnée d’effort isolée</td></tr></table><p>Le tableau se lit d’abord par la colonne des indices, puis par les exemples. Cinq diagnostics aigus menacent la vie et doivent être écartés en premier : le pneumothorax, l’embolie pulmonaire, l’insuffisance cardiaque aiguë, l’asthme aigu grave et l’obstruction des voies aériennes supérieures. L’erreur fréquente est de s’arrêter à la première cause trouvée : dans une série de 250 patients atteints de dyspnée chronique inexpliquée, près de 40 % avaient une <button class="w" data-k="r06-multimorbidite">dyspnée multimorbide</button>, cardiaque et pulmonaire.</p><p>Les facteurs de risque sont ceux des maladies causales. Le tabac domine : dans une étude prospective de 123 patients, aucun patient ayant fumé moins de dix paquets-années n’avait de BPCO. L’âge, l’obésité, la sédentarité, l’anxiété et les expositions professionnelles s’y ajoutent.</p><div class="key"><b>À retenir.</b> Le clinicien pense par étage : commande, pompe, échangeur, circulation, transport de l’oxygène. Il écarte d’abord les cinq urgences, puis cherche une seconde cause lorsque la première n’explique pas tout.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., Breathe (ERS) 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12171858/" target="_blank" rel="noopener">Nic Aodha Bhuí et al., point de vue du cardiologue, Breathe (ERS) 2025</a> ; <a href="https://doi.org/10.53738/REVMED.2025.21.908.417" target="_blank" rel="noopener">Schreier et al., Revue médicale suisse 2025 (résumé)</a>.</p></section>
<section class="ilot" id="r06-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>L’interrogatoire date d’abord le symptôme. Une dyspnée apparue en quelques minutes évoque une embolie pulmonaire, un pneumothorax ou une crise d’asthme ; une dyspnée installée sur des mois oriente vers une maladie chronique. Une variabilité nocturne ou d’un jour à l’autre suggère un asthme.</p><p>Le médecin fait ensuite décrire la sensation, avec les mots du patient. Dans une étude de quinze descripteurs, « ma poitrine est serrée » avait une spécificité de 88 % pour l’asthme et « ma respiration est superficielle » de 84 % pour une pneumopathie interstitielle. Une inspiration jamais satisfaisante, des soupirs ou des bâillements fréquents évoquent une respiration dysfonctionnelle lorsque les examens sont normaux.</p><p>Les circonstances complètent l’orientation. L’<button class="w" data-k="r06-orthopnee">orthopnée et la dyspnée paroxystique nocturne (mécanismes)</button> évoquent l’insuffisance cardiaque, mais l’orthopnée existe aussi dans la BPCO avancée. Une gêne déclenchée par un parfum ou l’eau de Javel fait penser à l’asthme, mais aussi au larynx. Une dyspnée d’effort chez une femme âgée ou un diabétique peut être un <button class="w" data-k="r06-angor">équivalent angineux</button>. Les signes associés guident : douleur thoracique, hémoptysie, fièvre, perte de poids, palpitations, présyncope, œdèmes.</p><p>Le retentissement se mesure par une échelle. L’<button class="w" data-k="r06-mmrc">échelle mMRC (cinq degrés d’activité)</button> classe le handicap ; une <button class="w" data-k="r06-echelles">échelle numérique de 0 à 10 ou l’échelle de Borg modifiée</button> mesure l’intensité. L’ESMO recommande de demander quelles activités le patient a réduites ou abandonnées.</p><div class="two"><div class="card"><b>Forme typique.</b> Le patient décrit une dyspnée d’effort progressive, une limitation chiffrable (un étage, cent mètres) et des signes associés qui désignent un organe.</div><div class="card"><b>Formes trompeuses.</b> Le patient sédentaire nie la dyspnée parce qu’il ne fait plus d’effort. Le sportif garde un bon score malgré une perte réelle. Chez un insuffisant cardiaque ou respiratoire, l’aggravation de la dyspnée peut être le seul signe d’une embolie pulmonaire.</div></div><div class="trap"><span class="k">Piège</span> À la question « êtes-vous essoufflé ? », beaucoup de patients répondent « non », car ils ont cessé les activités qui les essoufflaient. L’ESMO qualifie cette dyspnée d’« invisible ». La bonne question porte sur les activités abandonnées.</div><div class="key"><b>À retenir.</b> L’interrogatoire date, décrit, contextualise et quantifie la dyspnée. Il recherche aussi l’anxiété, la dépression et les expositions, qui modifient la perception ou la cause.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., Breathe (ERS) 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7733213/" target="_blank" rel="noopener">Hui et al., ESMO 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32972985/" target="_blank" rel="noopener">Elbehairy et al., orthopnée dans la BPCO, Eur Respir J 2021</a>.</p></section>
<section class="ilot" id="r06-6"><h2><span class="n">6</span>Examiner pour mesurer la gravité</h2><p>L’examen poursuit deux buts : mesurer la gravité, puis orienter vers la cause. Les signes de gravité passent avant tout le reste, car ils décident de l’urgence.</p><div class="two"><div class="card"><b>Paramètres vitaux.</b> La <button class="w" data-k="r06-fr">fréquence respiratoire (mesure sur 30 secondes)</button> est le paramètre le plus prédictif : au-delà de 25 par minute, le risque d’intubation, d’admission en réanimation et de décès augmente. La <button class="w" data-k="r06-spo2">SpO₂ (valeur et limites)</button> estime l’oxygénation. La fréquence cardiaque, la pression artérielle, la température, la vigilance et l’indice de masse corporelle complètent le relevé.</div><div class="card"><b>Inspection.</b> Les <button class="w" data-k="r06-lutte">signes de lutte</button> (tirage, muscles accessoires, battement des ailes du nez) traduisent une charge accrue. Les <button class="w" data-k="r06-epuisement">signes d’épuisement</button> (phrases interrompues, respiration abdominale paradoxale, troubles de la conscience) annoncent la défaillance. La position assise penchée en avant et l’expiration à lèvres pincées s’observent dans la BPCO sévère.</div></div><p>L’<button class="w" data-k="r06-auscultation">auscultation (sibilants, crépitants, stridor)</button> localise l’atteinte : sibilants des petites bronches, crépitants grossiers de la pneumonie ou des bronchectasies, crépitants fins de l’œdème ou de la fibrose, stridor des voies hautes. Une matité oriente vers un épanchement ou une condensation, un tympanisme vers un pneumothorax. La turgescence jugulaire, les œdèmes, un galop ou un souffle orientent vers le cœur. Un hippocratisme digital, une déformation thoracique, une amyotrophie, une pâleur ou un goitre complètent l’inventaire.</p><p>Monsieur R. a une fréquence respiratoire de 26 par minute, des crépitants fins aux deux bases et une turgescence jugulaire. Il termine ses phrases et reste vigilant. Il n’est donc pas en détresse imminente, mais son orthopnée et ses signes droits orientent vers une insuffisance cardiaque.</p><div class="trap"><span class="k">Erreur fréquente</span> Le clinicien compte la fréquence respiratoire sur quelques secondes, ou ne la compte pas. Une étude multicentrique a montré que l’exactitude de la mesure dépend de sa durée ; la SFMU recommande au moins 30 secondes, dès l’admission et pendant toute la prise en charge.</div><div class="key"><b>À retenir.</b> Fréquence respiratoire, SpO₂, vigilance et signes d’épuisement mesurent la gravité. L’anamnèse et l’examen clinique suffisent au diagnostic chez deux patients sur trois.</div><p class="src">Références : <a href="https://www.sfmu.org/upload/consensus/RFE_Dyspneee_sfmu_srlf2025.pdf" target="_blank" rel="noopener">SFMU/SRLF 2025, recommandations recommandations 1.3 et 2.2</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11915126/" target="_blank" rel="noopener">Keane et al., Breathe (ERS) 2025</a>.</p><button class="pareto-btn ui" data-k="pareto-r06-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
