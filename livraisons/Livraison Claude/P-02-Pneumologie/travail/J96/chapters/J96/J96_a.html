<section class="ilot" id="j96-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 34 ans, sans antécédent, arrive aux urgences avec une pneumonie lobaire. Elle respire 32 fois par minute et sa SpO₂ vaut 86 % à l’air ambiant. La gazométrie artérielle montre une PaO₂ de 52 mmHg (6,9 kPa), une PaCO₂ de 30 mmHg (4,0 kPa) et un pH de 7,49. Dans le box voisin, un homme de 71 ans atteint d’une BPCO sévère a reçu 15 L/min d’oxygène au masque pendant son transport. Il est somnolent ; sa PaCO₂ atteint 82 mmHg (10,9 kPa), son pH 7,24 et ses bicarbonates 34 mmol/L.</p><p>Les deux patients présentent une insuffisance respiratoire aiguë. Leur mécanisme, leur cible d’oxygène et leur support ventilatoire diffèrent pourtant du tout au tout. <b>Quelle fonction a cédé — l’échangeur pulmonaire ou la pompe ventilatoire —, depuis combien de temps, et quel support rétablit l’échange gazeux sans nuire ?</b></p><p>À l’issue du cours, le médecin sait affirmer et classer une insuffisance respiratoire sur la gazométrie, en reconnaître le mécanisme par le gradient alvéolo-artériel, repérer les signes d’épuisement, prescrire l’oxygène comme un médicament, choisir entre oxygène standard, haut débit nasal, ventilation non invasive et intubation, puis poser les indications suisses de l’oxygénothérapie et de la ventilation à domicile.</p><div class="key"><b>Point de départ.</b> Deux systèmes en série assurent la respiration : <button class="w" data-k="j96-echangeur-pompe">l’échangeur et la pompe (deux défaillances, deux types)</button>. Leur fonctionnement se lit dans <button class="w" data-k="j96-equation-alveolaire">l’équation des gaz alvéolaires (calcul et usage clinique)</button>.</div></section>
<section class="ilot" id="j96-1"><h2><span class="n">1</span>Définitions, types et codage</h2><p>L’insuffisance respiratoire est l’incapacité du système respiratoire à assurer des échanges gazeux adaptés aux besoins de l’organisme. Elle se définit sur la gazométrie artérielle prélevée au repos, à l’air ambiant : une <b>PaO₂ inférieure à 60 mmHg (8 kPa)</b> définit l’hypoxémie, une <b>PaCO₂ supérieure à 45 mmHg (6 kPa)</b> définit l’hypercapnie. Le seuil de 60 mmHg n’est pas arbitraire. Il correspond au coude de la courbe de dissociation de l’hémoglobine, où la saturation vaut encore environ 90 % ; au-dessous, chaque millimètre de mercure perdu retire beaucoup plus d’oxygène au sang.</p><p>Deux types en découlent. Le <b>type 1, hypoxémique</b>, associe une hypoxémie à une PaCO₂ normale ou basse : l’échangeur est atteint, mais la pompe ventile assez, souvent trop, ce qui abaisse la PaCO₂. Le <b>type 2, hypercapnique</b>, associe une hypercapnie à une hypoxémie fréquente : la ventilation alvéolaire ne suffit plus à éliminer le dioxyde de carbone produit.</p><p>La temporalité se lit sur le pH et les bicarbonates. Dans une hypercapnie <b>aiguë</b>, le rein n’a pas eu le temps de retenir des bicarbonates : le pH chute. Dans une hypercapnie <b>chronique</b>, la rétention rénale de bicarbonates ramène le pH près de la normale. L’<b>acutisation</b> d’une forme chronique associe des bicarbonates déjà élevés à une nouvelle chute du pH au-dessous de 7,35 : c’est le cas du second patient. <button class="w" data-k="j96-compensation">La compensation rénale prend plusieurs jours (calculs attendus)</button>.</p><table class="t"><tr><th>Code CIM-10-GM 2024</th><th>Signification et règle d’emploi</th></tr><tr><td><b>J96.0</b> — Insuffisance respiratoire aiguë</td><td>Installation en heures ou en jours. Cinquième caractère : J96.00 type I hypoxémique, J96.01 type II hypercapnique, J96.09 type non précisé.</td></tr><tr><td><b>J96.1</b> — Insuffisance respiratoire chronique</td><td>Installation en mois ou en années. Même cinquième caractère (J96.10, J96.11, J96.19). Code supplémentaire Z99.1 si un respirateur est nécessaire au long cours.</td></tr><tr><td><b>J96.9</b> — Insuffisance respiratoire, sans précision</td><td>Temporalité non documentée ; ce code signale un dossier incomplet, pas une forme clinique.</td></tr><tr><td>Acutisation d’une forme chronique</td><td>Deux codes : J96.0 avec son type, et J96.1 avec son type.</td></tr><tr><td>Exclusions de J96</td><td>Syndrome de détresse respiratoire aiguë (J80), arrêt respiratoire (R09.2), troubles respiratoires après un acte médical (J95), détresse respiratoire du nouveau-né (P22).</td></tr></table><p>Le tableau se lit en deux temps : la catégorie fixe la temporalité, le cinquième caractère fixe le type gazométrique. Le codage exige donc une gazométrie interprétée ; une SpO₂ isolée ne permet pas de choisir entre J96.00 et J96.01. <button class="w" data-k="j96-codage">Exemples de codage et pièges (aiguë sur chronique, SDRA)</button>.</p><div class="key"><b>À retenir.</b> Le diagnostic est gazométrique : PaO₂ &lt; 60 mmHg, PaCO₂ &gt; 45 mmHg. Le type se lit sur la PaCO₂, la temporalité sur le pH et les bicarbonates. La physiologie normale explique ensuite pourquoi ces deux gaz se dissocient.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j95-j99.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc J95–J99</a> ; <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, définitions et valeurs normales</a>.</p></section>
<section class="ilot" id="j96-2"><h2><span class="n">2</span>Physiologie normale : l’échangeur et la pompe</h2><p>Chez l’adulte jeune assis, au niveau de la mer, la PaO₂ normale se situe entre 90 et 110 mmHg (12 à 14,6 kPa) et la saturation entre 96 et 98 %. La limite inférieure de la saturation descend vers 94 % après 70 ans. La PaCO₂ normale se situe entre 34 et 46 mmHg (4,6 à 6,1 kPa), le pH entre 7,35 et 7,45, les bicarbonates entre 22 et 26 mmol/L. Pendant le sommeil, la saturation baisse transitoirement chez tout sujet sain, avec un nadir moyen de 90 %.</p><p><b>L’oxygène dépend de l’échangeur.</b> La PaO₂ résulte de deux termes : la pression d’oxygène dans l’alvéole (PAO₂) et la perte entre l’alvéole et l’artère, appelée <button class="w" data-k="j96-gradient">gradient alvéolo-artériel (valeur normale selon l’âge)</button>. À l’air ambiant, la PAO₂ vaut environ 100 mmHg et le gradient 5 à 15 mmHg chez l’adulte jeune. Un gradient élevé signe une atteinte de l’échangeur ; un gradient normal avec une PaO₂ basse signe une baisse de la PAO₂, par hypoventilation ou par altitude.</p><p><b>Le dioxyde de carbone dépend de la pompe.</b> La PaCO₂ est proportionnelle à la production de dioxyde de carbone et inversement proportionnelle à la ventilation alvéolaire. Si la ventilation alvéolaire diminue de moitié, la PaCO₂ double. La pompe ventilatoire comprend la commande bulbaire, la moelle, les nerfs phréniques, la jonction neuromusculaire, les muscles respiratoires, la paroi thoracique et les voies aériennes.</p><p>La ventilation alvéolaire n’est pas la ventilation totale. Une partie de chaque inspiration, environ 150 mL, reste dans l’espace mort anatomique. Un patient qui respire 12 fois par minute avec 500 mL et un patient qui respire 24 fois avec 250 mL déplacent tous deux 6 L/min. Le premier ventile ses alvéoles à (500 − 150) × 12 = 4,2 L/min, le second à (250 − 150) × 24 = 2,4 L/min seulement. <b>La respiration rapide et superficielle d’un patient qui s’épuise fait donc monter la PaCO₂ malgré une fréquence élevée.</b></p><div class="key"><b>À retenir.</b> L’échangeur règle surtout l’oxygène, la pompe règle surtout le dioxyde de carbone. Le gradient alvéolo-artériel sépare les deux défaillances ; la section suivante détaille les cinq mécanismes d’une hypoxémie.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, sections 3 à 5 (valeurs normales et physiologie)</a>.</p></section>
<section class="ilot" id="j96-3"><h2><span class="n">3</span>Les cinq mécanismes de l’hypoxémie</h2><p>Une PaO₂ basse résulte de cinq mécanismes, souvent associés. Deux questions simples les distinguent au lit du patient : le gradient alvéolo-artériel est-il élevé, et la PaO₂ remonte-t-elle franchement sous oxygène ? Le tableau suivant croise ces deux questions.</p><table class="t"><tr><th>Mécanisme</th><th>Gradient</th><th>Réponse à l’oxygène</th><th>Exemple</th></tr><tr><td><button class="w" data-k="j96-altitude">Baisse de la pression inspirée d’oxygène (altitude)</button></td><td>Normal</td><td>Complète</td><td>Séjour à 3 500 m</td></tr><tr><td><button class="w" data-k="j96-hypoventilation">Hypoventilation alvéolaire (pompe)</button></td><td>Normal</td><td>Complète, mais la PaCO₂ reste élevée</td><td>Surdosage d’opioïdes</td></tr><tr><td><button class="w" data-k="j96-va-q">Inadéquation ventilation/perfusion</button></td><td>Élevé</td><td>Bonne</td><td>Exacerbation de BPCO, asthme, embolie pulmonaire</td></tr><tr><td><button class="w" data-k="j96-shunt">Shunt vrai (sang non ventilé)</button></td><td>Élevé</td><td>Faible, d’autant plus que le shunt est large</td><td>Pneumonie lobaire, SDRA, atélectasie</td></tr><tr><td><button class="w" data-k="j96-diffusion">Trouble de la diffusion</button></td><td>Élevé, surtout à l’effort</td><td>Bonne</td><td>Fibrose pulmonaire</td></tr></table><p>La lecture commence par le gradient. Un gradient normal oriente vers la pompe ou l’altitude ; la PaCO₂ tranche, car elle monte dans l’hypoventilation et baisse en altitude. Un gradient élevé oriente vers l’échangeur ; la réponse à l’oxygène sépare alors le shunt, qui résiste, des autres mécanismes, qui répondent. La patiente atteinte de pneumonie en est l’exemple : sa PaO₂ de 52 mmHg avec une PaCO₂ de 30 mmHg donne un gradient d’environ 60 mmHg, et un oxygène à fort débit ne la corrigera que partiellement parce que ses alvéoles condensées ne reçoivent plus d’air.</p><p>Une <b>désaturation du sang veineux mélangé</b> aggrave chacun de ces mécanismes. Lorsque le débit cardiaque chute ou que la consommation d’oxygène augmente, le sang revient plus désaturé ; la fraction qui traverse un shunt abaisse alors davantage la PaO₂. Un état de choc peut ainsi aggraver une hypoxémie sans modification pulmonaire.</p><div class="key"><b>À retenir.</b> Un gradient normal désigne la pompe ou l’altitude. Un gradient élevé avec une bonne réponse à l’oxygène désigne une inadéquation ventilation/perfusion ou un trouble de diffusion ; avec une réponse faible, il désigne un shunt. L’hypercapnie relève d’une autre logique, celle de la pompe.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 5 (physiologie avancée des gaz du sang)</a>.</p></section>
<section class="ilot" id="j96-4"><h2><span class="n">4</span>Hypercapnie et acutisation</h2><p>La pompe ventilatoire fonctionne tant que trois éléments restent en équilibre : la <b>commande</b> centrale, la <b>capacité</b> des muscles respiratoires et la <b>charge</b> qu’ils doivent vaincre. <button class="w" data-k="j96-charge-capacite">L’hypercapnie apparaît quand la charge dépasse la capacité ou quand la commande faiblit (balance et exemples)</button>. Le patient conserve d’abord sa PaCO₂ au prix d’un travail accru ; il la laisse monter ensuite, ce qui épargne ses muscles mais acidifie le sang.</p><p>La <b>charge</b> augmente de trois façons. La charge résistive croît avec l’obstruction bronchique. La charge élastique croît avec une paroi ou un poumon rigides, une obésité ou une distension abdominale. La charge à seuil naît de la distension dynamique de la BPCO : <button class="w" data-k="j96-pepi">la pression expiratoire positive intrinsèque oblige chaque inspiration à vaincre d’abord une pression résiduelle (mécanisme)</button>. La <b>capacité</b> diminue avec une maladie neuromusculaire, une hypokaliémie, une hypophosphatémie, une dénutrition ou une distension qui raccourcit et aplatit le diaphragme. La <b>commande</b> faiblit sous sédatifs et opioïdes, après un accident vasculaire du tronc cérébral ou dans certaines hypoventilations du sommeil.</p><p>Une augmentation de l’<b>espace mort</b> agit dans le même sens : l’air qui ventile des territoires non perfusés n’élimine aucun dioxyde de carbone. La pompe doit alors fournir une ventilation totale plus grande pour garder la même ventilation alvéolaire.</p><p>L’hypercapnie chronique débute souvent la nuit. Pendant le sommeil paradoxal, l’atonie des muscles accessoires laisse le diaphragme seul ; un diaphragme faible ou désavantagé ne suffit plus. <button class="w" data-k="j96-sommeil">L’hypoventilation du sommeil précède l’hypercapnie diurne (pourquoi la chercher)</button>. Le rein retient ensuite des bicarbonates, qui compensent l’acidose mais émoussent la réponse ventilatoire au dioxyde de carbone.</p><p>L’<b>acutisation</b> survient lorsqu’un facteur déclenchant rompt cet équilibre fragile : infection bronchique ou pulmonaire, insuffisance cardiaque, embolie pulmonaire, pneumothorax, sédatif, opioïde, chirurgie abdominale ou thoracique, ou <b>oxygène administré sans cible</b>. Le second patient du cours illustre cette dernière cause : un débit de 15 L/min a fait monter sa PaCO₂ jusqu’à la narcose.</p><div class="key"><b>À retenir.</b> L’hypercapnie traduit un déséquilibre entre commande, capacité et charge. Elle commence souvent la nuit, se compense par le rein, puis s’aggrave brutalement à l’occasion d’un facteur déclenchant qu’il faut toujours identifier.</div></section>
<section class="ilot" id="j96-5"><h2><span class="n">5</span>Causes et terrains</h2><p>Le diagnostic d’insuffisance respiratoire n’est qu’une première étape : il impose la recherche immédiate de sa cause, car le traitement étiologique conditionne le pronostic. Le tableau suivant classe les causes selon le niveau atteint, du centre respiratoire à l’alvéole.</p><table class="t"><tr><th>Niveau atteint</th><th>Causes principales</th><th>Type habituel</th></tr><tr><td>Commande centrale</td><td>Opioïdes, benzodiazépines, alcool, accident vasculaire ou tumeur du tronc cérébral, encéphalopathie</td><td>2</td></tr><tr><td>Moelle et nerfs</td><td>Lésion médullaire cervicale haute, polyradiculonévrite aiguë de Guillain et Barré, sclérose latérale amyotrophique, paralysie phrénique</td><td>2</td></tr><tr><td>Jonction et muscles</td><td>Myasthénie en crise, botulisme, myopathies, hypokaliémie ou hypophosphatémie sévères</td><td>2</td></tr><tr><td>Paroi et plèvre</td><td>Cyphoscoliose, obésité et <button class="w" data-k="j96-soh">syndrome obésité-hypoventilation (définition et prise en charge)</button>, volet costal, épanchement pleural massif, pneumothorax</td><td>2, parfois 1</td></tr><tr><td>Voies aériennes</td><td>Exacerbation de BPCO, asthme aigu grave, obstruction laryngée ou trachéale</td><td>2 ou mixte</td></tr><tr><td>Alvéoles et interstitium</td><td>Pneumonie, œdème pulmonaire cardiogénique, SDRA, hémorragie alvéolaire, pneumopathie interstitielle</td><td>1</td></tr><tr><td>Vaisseaux pulmonaires</td><td>Embolie pulmonaire, hypertension pulmonaire, shunt intracardiaque</td><td>1</td></tr></table><p>Le tableau se lit du haut vers le bas, comme le trajet de la commande nerveuse : plus l’atteinte est proximale, plus l’insuffisance est hypercapnique. Une hypoxémie avec poumon radiologiquement clair doit faire évoquer une embolie pulmonaire, une hypoventilation, une obstruction bronchique ou un shunt intracardiaque. Les causes se combinent volontiers : une pneumonie chez un patient atteint de BPCO associe un shunt, une inadéquation ventilation/perfusion et une charge accrue.</p><p>Les causes fréquentes disposent de leur propre cours : <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a>, <a href="#/entry/J45">J45 — Asthme</a> et <a href="#/entry/I26">I26 — Embolie pulmonaire aiguë</a>. Les maladies neuromusculaires, les déformations thoraciques et l’obésité sévère dominent les insuffisances chroniques hypercapniques traitées par ventilation à domicile, avec la BPCO. <button class="w" data-k="j96-neuromusculaire">Maladies neuromusculaires : une insuffisance qui se masque (pièges)</button>.</p><div class="key"><b>À retenir.</b> Chaque insuffisance respiratoire a une cause et souvent un facteur déclenchant. Une atteinte proximale de la pompe donne une hypercapnie, une atteinte alvéolaire ou vasculaire donne une hypoxémie.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Janssens et al., Société suisse de pneumologie, Respiration 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society, Thorax 2016</a>.</p><button class="pareto-btn ui" data-k="pareto-j96-meca">▲ Loi de Pareto — Définitions, physiologie et mécanismes</button></section>
<section class="ilot" id="j96-6"><h2><span class="n">6</span>Clinique et signes de gravité</h2><p>L’examen recherche trois choses : les effets de l’hypoxémie, ceux de l’hypercapnie et l’état de la pompe. Ce dernier point décide de l’urgence, car un patient qui s’épuise peut s’arrêter de respirer en quelques minutes, parfois avec une SpO₂ encore acceptable sous oxygène.</p><div class="two"><div class="card"><h4>Effets de l’hypoxémie</h4><p>La dyspnée, la tachypnée et la tachycardie traduisent la réponse des chémorécepteurs et du système sympathique. L’agitation, puis la confusion signalent la souffrance cérébrale. Une <button class="w" data-k="j96-cyanose">cyanose (seuil, pièges de l’anémie et de la polyglobulie)</button> apparaît tard et manque chez l’anémique. Des troubles du rythme et une ischémie myocardique peuvent compliquer une hypoxémie profonde.</p></div><div class="card"><h4>Effets de l’hypercapnie</h4><p>Le dioxyde de carbone dilate les vaisseaux cérébraux et cutanés : céphalées, sueurs, peau chaude et pouls bondissant en témoignent. L’acidose du liquide céphalorachidien altère ensuite la vigilance, jusqu’au coma. Un <button class="w" data-k="j96-signes-hypercapnie">astérixis et une somnolence (lecture clinique de l’hypercapnie)</button> doivent faire mesurer la PaCO₂ sans délai.</p></div></div><p><b>Signes de lutte.</b> Une fréquence respiratoire supérieure à 30 par minute, le <button class="w" data-k="j96-tirage">tirage et la mise en jeu des muscles accessoires (ce qu’ils mesurent)</button>, une parole hachée et l’orthopnée traduisent un travail respiratoire élevé. Ils indiquent que la charge s’approche de la capacité.</p><p><b>Signes d’épuisement.</b> Une <button class="w" data-k="j96-respiration-paradoxale">respiration abdominale paradoxale (diaphragme défaillant)</button>, une bradypnée après une phase de tachypnée, des pauses respiratoires et une baisse de la vigilance annoncent l’arrêt respiratoire. Une fréquence qui ralentit n’est rassurante que si la PaCO₂ et la vigilance s’améliorent.</p><p><b>Signes de chronicité.</b> Des œdèmes des membres inférieurs, une turgescence jugulaire et un éclat du deuxième bruit pulmonaire évoquent un <button class="w" data-k="j96-coeur-pulmonaire">cœur pulmonaire chronique (mécanisme et preuves)</button>. Une polyglobulie, des céphalées matinales, une somnolence diurne et un sommeil non réparateur orientent vers une hypoventilation nocturne.</p><div class="key"><b>À retenir.</b> La gravité se juge sur la pompe : fréquence, signes de lutte, respiration paradoxale et vigilance. Une SpO₂ normale sous oxygène ne prouve ni une ventilation suffisante ni l’absence d’épuisement.</div><p class="src">Références : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society, Thorax 2016</a> ; <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, évaluation clinique</a>.</p></section>
<section class="ilot" id="j96-7"><h2><span class="n">7</span>Démarche diagnostique</h2><p>La démarche suit un ordre fixe : stabiliser, mesurer, classer, expliquer. Le médecin évalue d’abord les voies aériennes, la respiration et la circulation, administre l’oxygène selon une cible, puis prélève les examens qui confirment et orientent.</p><p><b>Mesurer.</b> La SpO₂ dépiste ; la gazométrie artérielle confirme. La BTS recommande une gazométrie chez tout patient gravement malade, chez tout patient dont la saturation baisse ou dont le besoin en oxygène augmente, et chez tout patient à risque d’hypercapnie. La FiO₂ et le dispositif utilisé au moment du prélèvement doivent figurer sur la demande : sans eux, la PaO₂ est ininterprétable. <button class="w" data-k="j96-gaz-lecture">Lecture pas à pas d’une gazométrie (six étapes)</button>.</p><p><b>Classer.</b> La PaCO₂ fixe le type, le pH et les bicarbonates fixent la temporalité, le gradient alvéolo-artériel localise la défaillance. Le rapport PaO₂/FiO₂ chiffre l’hypoxémie sous oxygène : il vaut 400 à 500 mmHg chez le sujet sain et passe au-dessous de 300 mmHg dans une insuffisance hypoxémique franche. Un <button class="w" data-k="j96-lactate">lactate élevé (hypoxie tissulaire ou choc associé)</button> signale que l’apport d’oxygène aux tissus ne suffit plus.</p><p><b>Expliquer.</b> L’examen clinique, la radiographie thoracique et l’<button class="w" data-k="j96-echographie">échographie pulmonaire au lit (profils et limites)</button> orientent vers la cause. L’électrocardiogramme, le NT-proBNP, la CRP, les D-dimères selon la probabilité clinique, l’angio-TDM thoracique et l’échocardiographie complètent selon l’hypothèse. Une hypercapnie sans maladie bronchopulmonaire évidente impose de chercher un toxique, une atteinte neurologique ou neuromusculaire et une obésité avec hypoventilation.</p><table class="t"><tr><th>Profil gazométrique</th><th>Orientation prioritaire</th></tr><tr><td>PaO₂ basse, PaCO₂ basse, gradient élevé, radiographie anormale</td><td>Pneumonie, œdème pulmonaire, SDRA, atélectasie</td></tr><tr><td>PaO₂ basse, PaCO₂ basse, gradient élevé, radiographie normale</td><td>Embolie pulmonaire, asthme, shunt intracardiaque</td></tr><tr><td>PaCO₂ élevée, gradient normal</td><td>Hypoventilation pure : toxique, neurologique, neuromusculaire</td></tr><tr><td>PaCO₂ élevée, gradient élevé</td><td>BPCO ou autre maladie respiratoire avec épuisement de la pompe</td></tr><tr><td>PaCO₂ élevée, bicarbonates élevés, pH &lt; 7,35</td><td>Acutisation d’une insuffisance chronique</td></tr></table><p>Le tableau s’emploie après le calcul du gradient, jamais avant. L’erreur fréquente consiste à conclure à une BPCO devant toute hypercapnie : chez un patient obèse, somnolent, sans obstruction connue, la même gazométrie évoque d’abord un syndrome obésité-hypoventilation ou un toxique.</p><div class="key"><b>À retenir.</b> Stabiliser, mesurer, classer, expliquer : la gazométrie avec sa FiO₂ affirme et classe, le gradient localise, l’imagerie et le contexte désignent la cause.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandations sur la gazométrie</a> ; <a href="https://doi.org/10.1056/NEJMoa1503326" target="_blank" rel="noopener">Frat et al., essai FLORALI 2015 (seuil PaO₂/FiO₂ ≤ 300 mmHg)</a>.</p><button class="pareto-btn ui" data-k="pareto-j96-clin">▲ Loi de Pareto — Clinique et démarche diagnostique</button></section>
