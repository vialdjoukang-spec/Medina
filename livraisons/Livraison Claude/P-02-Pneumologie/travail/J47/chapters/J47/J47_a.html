<h1>Bronchectasies</h1><span class="status">Adulte · bronchectasies non liées à la mucoviscidose · rédaction du 08.10.2026 · référentiels ERS 2025, British Thoracic Society 2019</span></div>

<section class="ilot" id="j47-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Une femme de 58 ans, non fumeuse, crache chaque matin une à deux cuillerées à soupe de sécrétions jaunâtres depuis six ans. Elle reçoit trois fois par an un antibiotique pour une « bronchite ». Dans l’enfance, elle a eu une coqueluche sévère. Ce récit ne décrit pas une succession de bronchites : il décrit une maladie bronchique chronique qui n’a jamais été nommée.</p><p>Les <b>bronchectasies</b> sont des dilatations permanentes des bronches. Elles retiennent les sécrétions, entretiennent une infection et une inflammation chroniques, et exposent à des exacerbations répétées. Le médecin doit d’abord y penser devant une toux productive persistante, puis confirmer le diagnostic par la tomodensitométrie, rechercher une cause traitable, mesurer la gravité et enfin interrompre le cercle qui détruit la paroi bronchique.</p><div class="key"><b>À retenir.</b> Une toux productive quotidienne avec des infections respiratoires répétées impose de rechercher des bronchectasies, en particulier lorsque le patient ne fume pas. <button class="w" data-justification="1" data-k="j47-vortex">Le cercle vicieux de la maladie (quatre composantes liées)</button> explique toute la stratégie thérapeutique.</div></section>

<section class="ilot" id="j47-1"><h2><span class="n">1</span>Définition, formes et codage</h2><p>La recommandation de l’ERS de 2025 définit les bronchectasies cliniquement significatives par l’association de deux éléments : une dilatation bronchique permanente visible sur la tomodensitométrie thoracique et des symptômes caractéristiques. Une image isolée, sans toux ni expectoration, ne suffit donc pas ; une toux productive sans dilatation démontrée non plus. <button class="w" data-justification="1" data-k="j47-consensus">Les critères radiologiques et cliniques du consensus international (seuils et limites)</button> précisent cette double exigence.</p><p>La description morphologique classique distingue trois formes, de gravité croissante. Elle reflète l’intensité de la destruction pariétale, sans dicter à elle seule le traitement.</p><table class="t"><tr><th>Forme</th><th>Aspect tomodensitométrique</th><th>Signification</th></tr><tr><td>Cylindrique</td><td>Bronche régulièrement élargie, à contours parallèles</td><td>Atteinte la plus fréquente et la moins destructrice</td></tr><tr><td>Variqueuse</td><td>Calibre irrégulier, alternance de dilatations et de rétrécissements</td><td>Destruction plus marquée de la paroi</td></tr><tr><td>Kystique</td><td>Dilatations sacculaires en grappe, souvent avec niveaux liquides</td><td>Forme la plus sévère ; elle compte comme critère radiologique de gravité dans le score BSI</td></tr></table><p>Le lecteur repère d’abord la forme kystique, car elle signale une maladie avancée. Une patiente dont la tomodensitométrie montre des dilatations cylindriques des deux lobes inférieurs garde un pronostic meilleur qu’un patient porteur de kystes dans trois lobes. <button class="w" data-justification="1" data-k="j47-formes">Les formes morphologiques et leur histoire (classification de Reid)</button>.</p><p>Dans la CIM-10-GM 2024, la catégorie J47 — Bronchectasie inclut la bronchiolectasie. Elle exclut les bronchectasies congénitales (Q33.4) et tuberculeuses en phase active (A15-A16). Les bronchectasies de la mucoviscidose relèvent du code E84 et d’un autre fragment : <button class="w" data-justification="1" data-k="j47-mucoviscidose">mucoviscidose (pourquoi elle suit ses propres recommandations)</button>. Les dilatations de traction d’une fibrose pulmonaire résultent de la rétraction du parenchyme ; elles appartiennent à la pneumopathie interstitielle et non à J47.</p><div class="key"><b>À retenir.</b> Le diagnostic associe une preuve morphologique permanente et un tableau clinique compatible. La forme kystique et l’extension à plusieurs lobes signalent une maladie avancée.</div><p class="src">Références : <a href="https://publications.ersnet.org/content/erj/66/6/2501126" target="_blank" rel="noopener">Chalmers et al., recommandation ERS 2025, Eur Respir J 2025;66:2501126</a> ; <a href="https://doi.org/10.1016/S2213-2600(21)00277-0" target="_blank" rel="noopener">Aliberti et al., consensus international, Lancet Respir Med 2022</a>.</p></section>

<section class="ilot" id="j47-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>Aucune donnée de prévalence suisse publiée n’a été identifiée. En Allemagne, une estimation fondée sur les données de facturation de 2013 retient 67 cas pour 100 000 habitants ; les séries britanniques fondées sur les dossiers de médecine générale rapportent des chiffres plusieurs fois supérieurs. Ces écarts tiennent au recours inégal à la tomodensitométrie : la maladie reste sous-diagnostiquée lorsque l’on ne la cherche pas.</p><p>Le <button class="w" data-justification="1" data-k="j47-embarc">registre européen EMBARC (population, limites)</button> décrit 16 963 adultes suivis dans 27 pays européens et en Israël. L’âge médian y atteint 67 ans et 60,9 % des patients sont des femmes. Les patients présentent une médiane de deux exacerbations par an, et 26,4 % ont été hospitalisés pour exacerbation au cours de l’année précédente. La cause reste inconnue chez 38,1 % d’entre eux ; une origine post-infectieuse est retenue chez 21,2 %.</p><p>Le pronostic dépend surtout de la fréquence des exacerbations, de l’infection chronique à <i>Pseudomonas aeruginosa</i>, du VEMS et de l’étiologie. Une bronchopneumopathie chronique obstructive associée, une dyskinésie ciliaire primitive ou une polyarthrite rhumatoïde aggravent le risque. <button class="w" data-justification="1" data-k="j47-bsi">Le score BSI traduit ces facteurs en risque chiffré (calcul et mortalité)</button>.</p><div class="key"><b>À retenir.</b> Les bronchectasies sont fréquentes chez la femme âgée et sous-diagnostiquées. Une cause n’est retrouvée que dans six cas sur dix, d’où la nécessité d’un bilan étiologique systématique.</div><p class="src">Références : <a href="https://doi.org/10.1016/S2213-2600(23)00093-0" target="_blank" rel="noopener">Chalmers et al., registre EMBARC, Lancet Respir Med 2023;11:637-649</a> ; <a href="https://publications.ersnet.org/content/erj/46/6/1805" target="_blank" rel="noopener">Ringshausen et al., prévalence en Allemagne, Eur Respir J 2015;46:1805</a>.</p></section>

<section class="ilot" id="j47-3"><h2><span class="n">3</span>Physiopathologie : le cercle vicieux</h2><p>À l’état normal, les bronches se nettoient seules. Les cellules caliciformes et les glandes sous-muqueuses produisent un mucus qui piège les particules et les bactéries ; les cils, battant environ quinze fois par seconde, le propulsent vers le larynx. <button class="w" data-justification="1" data-k="j47-clairance">La clairance mucociliaire normale (vitesse, liquide périciliaire, toux d’appoint)</button> maintient ainsi des voies aériennes inférieures pratiquement stériles.</p><p>Les bronchectasies naissent lorsqu’une agression rompt cet équilibre : une infection grave, un défaut ciliaire, un déficit immunitaire ou une réaction allergique. Quatre composantes s’entretiennent alors mutuellement. La clairance altérée laisse stagner le mucus. Le mucus stagnant héberge une infection bactérienne chronique. L’infection recrute en masse des neutrophiles, dont les protéases, surtout l’<button class="w" data-justification="1" data-k="j47-elastase">élastase neutrophile (cible des traitements anti-inflammatoires)</button>, digèrent l’élastine et le cartilage de la paroi. La paroi détruite se dilate, perd ses cils et draine encore moins bien.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Cercle vicieux des bronchectasies : quatre composantes qui s’entretiennent" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="250" y="12" width="180" height="44" rx="8"/><rect x="480" y="92" width="180" height="44" rx="8"/><rect x="250" y="172" width="180" height="44" rx="8"/><rect x="20" y="92" width="180" height="44" rx="8"/><path d="M430 40 C500 45 560 60 570 88m-8-8 8 10 5-12"/><path d="M570 136 C560 170 500 190 434 194m10-8-10 8 10 7"/><path d="M250 194 C180 190 120 170 110 140m-6 10 6-12 8 10"/><path d="M110 92 C120 60 180 45 246 40m-10-7 10 7-10 6"/></g><g fill="#222" text-anchor="middle"><text x="340" y="39">Clairance altérée</text><text x="570" y="119">Infection chronique</text><text x="340" y="199">Inflammation neutrophilique</text><text x="110" y="119">Lésion structurelle</text><text x="340" y="112">Chaque composante</text><text x="340" y="130">aggrave les trois autres</text></g></svg><figcaption>Figure 1 — Le cercle vicieux des bronchectasies. Chaque traitement vise au moins une composante : la kinésithérapie de drainage la clairance, les antibiotiques l’infection, les macrolides et le brensocatib l’inflammation. Schéma pédagogique original.</figcaption></figure><p>La recommandation de l’ERS de 2025 décrit ce mécanisme comme un « vortex » : les quatre composantes interagissent toutes entre elles, et non selon un ordre fixe. <i>Pseudomonas aeruginosa</i> illustre cette interaction, car il forme un <button class="w" data-justification="1" data-k="j47-biofilm">biofilm (protection contre les antibiotiques et les neutrophiles)</button> dans le mucus stagnant. La néovascularisation inflammatoire hypertrophie en outre les artères bronchiques, issues de l’aorte et soumises à la pression systémique ; leur rupture explique les hémoptysies.</p><div class="key"><b>À retenir.</b> La maladie s’auto-entretient même lorsque l’agression initiale a disparu. Le traitement doit donc agir sur plusieurs composantes à la fois ; la cause initiale, lorsqu’elle persiste, doit aussi être traitée.</div><p class="src">Références : <a href="https://publications.ersnet.org/content/erj/66/6/2501126" target="_blank" rel="noopener">ERS 2025, concept du vortex</a> ; <a href="https://doi.org/10.1183/13993003.00629-2017" target="_blank" rel="noopener">Polverino et al., recommandation ERS 2017</a>.</p></section>

<section class="ilot" id="j47-4"><h2><span class="n">4</span>Étiologies</h2><p>La cause compte pour deux raisons : certaines étiologies disposent d’un traitement spécifique, et d’autres modifient le pronostic ou la surveillance. Le tableau classe les causes selon leur mécanisme et l’indice qui doit les faire évoquer.</p><table class="t"><tr><th>Cause</th><th>Mécanisme</th><th>Indice d’orientation</th></tr><tr><td><button class="w" data-justification="1" data-k="j47-postinfectieux">Post-infectieuse (rougeole, coqueluche, tuberculose, pneumonie grave)</button></td><td>Destruction pariétale lors de l’infection initiale</td><td>Infection grave datée, souvent dans l’enfance ; atteinte parfois localisée</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-abpa">Aspergillose bronchopulmonaire allergique (ABPA)</button></td><td>Réaction d’hypersensibilité à <i>Aspergillus</i>, bouchons muqueux</td><td>Asthme, éosinophilie, bronchectasies centrales des lobes supérieurs</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-deficit">Déficit immunitaire humoral</button></td><td>Défaut d’opsonisation des bactéries encapsulées</td><td>Infections oto-rhino-laryngologiques et pulmonaires répétées, sinusites ; immunoglobulines basses</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-dcp">Dyskinésie ciliaire primitive</button></td><td>Cils immobiles ou désorganisés</td><td>Détresse respiratoire néonatale, rhinosinusite et otites chroniques, situs inversus, infertilité</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-systemique">Polyarthrite rhumatoïde, connectivites, maladies inflammatoires de l’intestin</button></td><td>Inflammation systémique, traitements immunosuppresseurs</td><td>Maladie connue ou symptômes articulaires et digestifs</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-bpco">Bronchopneumopathie chronique obstructive et asthme</button></td><td>Inflammation et infection bronchiques chroniques</td><td>Obstruction spirométrique ; exacerbations plus fréquentes en cas d’association</td></tr><tr><td><button class="w" data-justification="1" data-k="j47-mnt">Mycobactéries non tuberculeuses</button></td><td>Cause et conséquence de la maladie</td><td>Femme mince âgée, atteinte du lobe moyen et de la lingula, nodules en arbre en bourgeon</td></tr><tr><td>Obstruction bronchique localisée</td><td>Rétention en aval d’un corps étranger, d’une tumeur ou d’une sténose</td><td>Atteinte d’un seul segment ou lobe : indication de bronchoscopie</td></tr><tr><td>Mucoviscidose, déficit en alpha-1 antitrypsine</td><td>Mucus déshydraté ; protéolyse non contrôlée</td><td>Début dans l’enfance, atteinte des lobes supérieurs ; emphysème basal</td></tr><tr><td>Idiopathique</td><td>Aucune cause retrouvée après bilan complet</td><td>Diagnostic d’exclusion, retenu dans près de quatre cas sur dix</td></tr></table><p>La distribution topographique guide la lecture : une atteinte localisée évoque une obstruction ou une séquelle d’infection ; une atteinte centrale des lobes supérieurs évoque une ABPA ou une mucoviscidose ; une atteinte du lobe moyen et de la lingula évoque des mycobactéries non tuberculeuses ou une dyskinésie ciliaire. L’erreur fréquente consiste à conclure à une séquelle infectieuse sur la seule foi d’une pneumonie ancienne, sans chercher une cause traitable.</p><div class="key"><b>À retenir.</b> Un bilan étiologique minimal est recommandé chez tout patient. Une maladie débutée dans l’enfance doit être considérée comme génétique jusqu’à preuve du contraire.</div><p class="src">Références : <a href="https://publications.ersnet.org/content/erj/66/6/2501126" target="_blank" rel="noopener">ERS 2025, question narrative 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13077454/" target="_blank" rel="noopener">Chalmers et al., résumé clinique, Breathe 2026</a>.</p></section>

<section class="ilot" id="j47-5"><h2><span class="n">5</span>Anamnèse</h2><p>Le symptôme cardinal est une toux productive quotidienne, présente chez la grande majorité des patients. Le médecin quantifie le volume d’expectoration, sa couleur et sa variation au fil de l’année. <button class="w" data-justification="1" data-k="j47-expectoration">Volume et purulence de l’expectoration (échelle colorimétrique de Murray)</button> renseignent sur la charge bactérienne et l’inflammation. La dyspnée, la fatigue et une diminution de la tolérance à l’effort complètent le tableau.</p><p>L’<button class="w" data-justification="1" data-k="j47-hemoptysie">hémoptysie (artères bronchiques et gravité)</button> survient souvent sous forme de stries lors des exacerbations. Une rhinosinusite chronique accompagne fréquemment la maladie. Un reflux gastro-œsophagien, une anxiété ou une dépression sont aussi recherchés, car ils altèrent la qualité de vie et l’adhésion au traitement.</p><p>Les antécédents orientent l’étiologie : infection grave de l’enfance, tuberculose, asthme, infections à répétition, otites chroniques, infertilité masculine, polyarthrite rhumatoïde, maladie inflammatoire de l’intestin et traitements immunosuppresseurs. Le nombre d’exacerbations traitées dans l’année et les hospitalisations sont consignés, car ils conditionnent la prévention.</p><div class="two"><div class="card"><b>Forme typique</b><p>Une femme de 65 ans tousse et crache chaque jour depuis des années. Elle décrit plusieurs épisodes annuels de purulence accrue, avec fatigue et dyspnée, chacun traité par antibiotique.</p></div><div class="card"><b>Formes atypiques</b><p>Une toux sèche peut s’observer, en particulier lorsque des bouchons muqueux obstruent les bronches. Chez un patient atteint de bronchopneumopathie chronique obstructive, des exacerbations fréquentes et une infection chronique révèlent parfois des bronchectasies associées.</p></div></div><div class="key"><b>À retenir.</b> L’anamnèse établit trois éléments : la charge symptomatique quotidienne, le nombre d’exacerbations annuelles et les indices d’une cause traitable.</div></section>

<section class="ilot" id="j47-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen commence par l’état général, l’indice de masse corporelle et les signes vitaux. Une maigreur traduit le coût métabolique de l’inflammation chronique ; elle aggrave le pronostic et fait évoquer une mycobactérie non tuberculeuse. La saturation pulsée en oxygène est mesurée au repos.</p><div class="two"><div class="card"><b>Auscultation</b><p>Des <button class="w" data-justification="1" data-k="j47-crepitants">crépitants grossiers (sécrétions dans les bronches dilatées)</button>, souvent inspiratoires et basaux, sont le signe le plus caractéristique. Des ronchi et des sibilants traduisent l’encombrement ou une obstruction associée.</p></div><div class="card"><b>Signes extrapulmonaires</b><p>Un hippocratisme digital, rare, signale une maladie sévère. Les signes d’hypertension pulmonaire et de cœur pulmonaire s’observent dans les formes évoluées. L’examen des sinus et des articulations recherche une cause ou une comorbidité.</p></div></div><p>Un examen normal n’exclut pas le diagnostic. À l’inverse, des crépitants persistants chez un patient qui tousse et crache chaque jour justifient une tomodensitométrie, même si la radiographie thoracique paraît normale.</p><div class="key"><b>À retenir.</b> Les crépitants grossiers qui se modifient après la toux sont le signe clinique évocateur ; l’examen évalue aussi la nutrition, l’oxygénation et le retentissement cardiaque droit.</div><button class="pareto-btn ui" data-k="pareto-j47-clin">▲ Loi de Pareto — Définition, mécanismes et clinique</button></section>
