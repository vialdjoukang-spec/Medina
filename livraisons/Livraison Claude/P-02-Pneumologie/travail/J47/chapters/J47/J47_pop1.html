<template data-pop="j47-vortex" data-title="Le cercle vicieux des bronchectasies"><p class="lab">Définition</p><p>Le modèle relie quatre composantes : clairance mucociliaire altérée, infection bactérienne chronique, inflammation neutrophilique et lésion structurelle de la paroi. Décrit d’abord comme un cercle, il est aujourd’hui présenté comme un « vortex », car chaque composante agit sur les trois autres.</p><p class="lab">Mécanisme</p><p>Le mucus stagnant nourrit les bactéries ; les bactéries attirent les neutrophiles ; les protéases des neutrophiles détruisent la paroi et ralentissent les cils ; la paroi dilatée retient davantage de mucus.</p><p class="lab">Conséquence clinique</p><p>Le traitement attaque plusieurs composantes en même temps. Corriger une seule d’entre elles laisse les autres relancer la maladie.</p><div class="key"><b>Limite.</b> Le modèle est explicatif ; il ne prédit pas, chez un patient donné, quelle composante domine. La bactériologie et la clinique le précisent.</div><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(18)31767-7" target="_blank" rel="noopener">Flume, Chalmers et Olivier, Lancet 2018</a> ; <a href="https://publications.ersnet.org/content/erj/66/6/2501126" target="_blank" rel="noopener">ERS 2025</a>.</p></template>
<template data-pop="j47-consensus" data-title="Critères diagnostiques du consensus international"><p class="lab">Définition</p><p>Le consensus publié en 2022 dans le Lancet Respiratory Medicine exige au moins un critère radiologique et des symptômes. Critères radiologiques : rapport entre diamètres bronchique et artériel égal ou supérieur à 1, mesuré sur le diamètre interne ou externe ; absence d’effilement ; bronches visibles près de la plèvre. Critères cliniques : au moins deux éléments parmi la toux la plupart des jours, l’expectoration la plupart des jours et des antécédents d’exacerbation.</p><p class="lab">Mécanisme</p><p>Le rapport broncho-artériel augmente physiologiquement avec l’âge. Exiger des symptômes évite de nommer maladie une variation radiologique sans conséquence.</p><p class="lab">Conséquence clinique</p><p>Un rapport de 1,5 ou plus apporte la plus grande certitude. Une dilatation isolée chez un sujet âgé asymptomatique ne justifie pas de traitement.</p><div class="key"><b>Limite.</b> Ces critères ont été conçus pour harmoniser les essais cliniques ; la recommandation de l’ERS de 2025 les reprend pour la pratique. Le jugement clinique reste nécessaire dans les cas limites.</div><p class="src">Références : <a href="https://doi.org/10.1016/S2213-2600(21)00277-0" target="_blank" rel="noopener">Aliberti et al., Lancet Respir Med 2022;10:298-306</a>.</p></template>
<template data-pop="j47-formes" data-title="Formes cylindrique, variqueuse et kystique"><p class="lab">Définition</p><p>Lynne Reid a décrit en 1950 trois formes à partir de pièces opératoires et de bronchographies : cylindrique, variqueuse et sacculaire ou kystique.</p><p class="lab">Mécanisme</p><p>La forme dépend de la profondeur de la destruction pariétale. La forme kystique correspond à une perte presque complète du cartilage et de l’élastine ; les bronchioles distales sont alors souvent oblitérées.</p><p class="lab">Conséquence clinique</p><p>Les formes kystiques s’accompagnent d’une expectoration plus abondante, d’une infection plus fréquente à <i>Pseudomonas</i> et d’un pronostic moins bon.</p><div class="key"><b>Limite.</b> Plusieurs formes coexistent chez un même patient. La forme ne désigne pas la cause.</div></template>
<template data-pop="j47-mucoviscidose" data-title="Mucoviscidose : une cause à part"><p class="lab">Définition</p><p>La mucoviscidose est une maladie génétique récessive du canal chlorure épithélial. Ses bronchectasies sont codées E84 et traitées dans un autre fragment.</p><p class="lab">Mécanisme</p><p>Le défaut de sécrétion de chlorure déshydrate le mucus ; l’infection à <i>Staphylococcus aureus</i> puis à <i>Pseudomonas</i> s’installe tôt.</p><p class="lab">Conséquence clinique</p><p>Des formes atténuées se révèlent à l’âge adulte : atteinte des lobes supérieurs, pancréatite, rhinosinusite avec polypes, infertilité masculine. L’ERS 2025 conseille un seuil bas de dépistage, car des modulateurs du canal chlorure transforment le pronostic.</p><div class="key"><b>Limite.</b> Les traitements validés dans la mucoviscidose, comme la désoxyribonucléase recombinante, ne s’appliquent pas aux autres bronchectasies.</div></template>
<template data-pop="j47-embarc" data-title="Le registre européen EMBARC"><p class="lab">Définition</p><p>EMBARC est un réseau européen de recherche sur les bronchectasies. Son registre a inclus 16 963 adultes entre 2015 et 2022, dans 27 pays européens et en Israël.</p><p class="lab">Apport</p><p>Il a décrit l’âge médian de 67 ans, la prédominance féminine, la fréquence des causes idiopathiques et post-infectieuses, et les différences régionales de bactériologie : plus d’<i>Haemophilus influenzae</i> au nord, plus de <i>Pseudomonas aeruginosa</i> au sud.</p><div class="key"><b>Limite.</b> Le registre recrute dans des centres spécialisés ; il surreprésente les formes suivies et ne mesure pas la prévalence dans la population.</div><p class="src">Références : <a href="https://doi.org/10.1016/S2213-2600(23)00093-0" target="_blank" rel="noopener">Chalmers et al., Lancet Respir Med 2023;11:637-649</a>.</p></template>
<template data-pop="j47-bsi" data-title="Score BSI : calcul et interprétation"><p class="lab">Définition</p><p>Le score BSI additionne neuf variables : âge (jusqu’à 6 points), indice de masse corporelle inférieur à 18,5 kg/m² (2), VEMS en pourcentage de la valeur prédite (jusqu’à 3), hospitalisation au cours des deux années précédentes (5), trois exacerbations ou plus dans l’année (2), dyspnée selon l’échelle du Medical Research Council (jusqu’à 3), colonisation par <i>Pseudomonas</i> (3), colonisation par une autre bactérie (1), atteinte d’au moins trois lobes ou forme kystique (1).</p><p class="lab">Interprétation</p><p>Un score de 0 à 4 définit une forme légère, de 5 à 8 une forme modérée, de 9 ou plus une forme sévère. Dans les cohortes de validation, la mortalité à quatre ans allait de 0 à 5,3 % pour les formes légères et de 9,9 à 29,2 % pour les formes sévères.</p><div class="key"><b>Limite.</b> Le score reflète un risque de groupe ; l’ERS 2025 rappelle qu’il peut mal classer un patient et ne remplace pas l’évaluation des symptômes et de la bactériologie.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.201309-1575OC" target="_blank" rel="noopener">Chalmers et al., Am J Respir Crit Care Med 2014;189:576-585</a>.</p></template>
<template data-pop="j47-faced" data-title="Score FACED"><p class="lab">Définition</p><p>Le score FACED retient cinq variables : VEMS inférieur à 50 % (2 points), âge de 70 ans ou plus (2), colonisation chronique par <i>Pseudomonas</i> (1), atteinte de plus de deux lobes (1), dyspnée de grade 3 ou 4 sur l’échelle mMRC (1).</p><p class="lab">Interprétation</p><p>Le total de 0 à 7 distingue des formes légères (0 à 2), modérées (3 et 4) et sévères (5 à 7). Il prédit surtout la mortalité.</p><div class="key"><b>Limite.</b> Le score FACED ne contient pas les exacerbations ; il prédit moins bien les hospitalisations que le score BSI. Une variante ajoute les hospitalisations pour exacerbation.</div><p class="src">Références : <a href="https://doi.org/10.1183/09031936.00026313" target="_blank" rel="noopener">Martínez-García et al., Eur Respir J 2014;43:1357-1367</a>.</p></template>
<template data-pop="j47-clairance" data-title="La clairance mucociliaire normale"><p class="lab">Définition</p><p>La clairance mucociliaire est le transport du mucus bronchique vers le larynx par le battement des cils. Elle élimine en continu les particules et les bactéries inhalées.</p><p class="lab">Mécanisme</p><p>Le mucus repose sur une couche périciliaire liquide d’environ 7 µm. Les cils, coordonnés en ondes, battent douze à quinze fois par seconde. Le mucus est ensuite dégluti sans être perçu. La toux ne prend le relais que lorsque cette voie est débordée.</p><p class="lab">Conséquence clinique</p><p>Chez le sujet sain, l’expectoration quotidienne est absente. Une expectoration chaque matin signifie que la clairance ne suffit plus.</p><div class="key"><b>Limite.</b> La mesure de la clairance par scintigraphie reste un outil de recherche ; elle n’est pas nécessaire au diagnostic.</div></template>
<template data-pop="j47-elastase" data-title="Élastase neutrophile"><p class="lab">Définition</p><p>L’élastase neutrophile est une protéase à sérine stockée dans les granules azurophiles du neutrophile.</p><p class="lab">Mécanisme</p><p>Libérée dans la lumière bronchique, elle dégrade l’élastine et le collagène, stimule la sécrétion de mucus, ralentit le battement ciliaire et clive des molécules de défense. Son activité dans l’expectoration est associée au risque d’exacerbation et au déclin fonctionnel.</p><p class="lab">Conséquence clinique</p><p>Elle est la cible indirecte du brensocatib, qui empêche son activation pendant la maturation du neutrophile.</p><div class="key"><b>Limite.</b> Le dosage de l’activité élastasique de l’expectoration n’est pas un examen de routine.</div></template>
<template data-pop="j47-biofilm" data-title="Biofilm de Pseudomonas aeruginosa"><p class="lab">Définition</p><p>Un biofilm est une communauté bactérienne enrobée dans une matrice qu’elle produit, ici surtout de l’alginate.</p><p class="lab">Mécanisme</p><p>La matrice freine la diffusion des antibiotiques et la phagocytose. Les bactéries profondes, peu actives, tolèrent les antibiotiques qui ciblent la division. La formation du biofilm dépend de la détection du quorum, communication chimique entre bactéries.</p><p class="lab">Conséquence clinique</p><p>L’infection devient chronique et non éradicable. Les macrolides perturbent la détection du quorum ; les antibiotiques inhalés obtiennent localement de fortes concentrations.</p><div class="key"><b>Limite.</b> Un antibiogramme réalisé sur bactéries libres surestime l’efficacité attendue dans le biofilm.</div></template>
<template data-pop="j47-postinfectieux" data-title="Bronchectasies post-infectieuses"><p class="lab">Définition</p><p>Ce sont des bronchectasies attribuées à une infection grave antérieure : rougeole, coqueluche, tuberculose, pneumonie nécrosante ou infection à adénovirus.</p><p class="lab">Mécanisme</p><p>L’infection détruit l’épithélium et la paroi ; une obstruction prolongée par les sécrétions ou des adénopathies aggrave la lésion.</p><p class="lab">Conséquence clinique</p><p>Elles représentaient 21,2 % des patients du registre EMBARC. La vaccination de l’enfance contre la rougeole et la coqueluche prévient une partie de ces séquelles.</p><div class="key"><b>Piège.</b> Une infection ancienne ne dispense pas du bilan étiologique minimal : un déficit humoral peut avoir favorisé l’infection initiale.</div></template>
<template data-pop="j47-abpa" data-title="Aspergillose bronchopulmonaire allergique"><p class="lab">Définition</p><p>L’ABPA est une réaction d’hypersensibilité à <i>Aspergillus fumigatus</i> colonisant les bronches, surtout chez l’asthmatique ou dans la mucoviscidose.</p><p class="lab">Mécanisme</p><p>Une réponse Th2 produit des IgE et recrute des éosinophiles ; des bouchons muqueux obstruent les bronches centrales, qui se dilatent.</p><p class="lab">Diagnostic</p><p>Les critères révisés de 2024 exigent une sensibilisation à <i>Aspergillus</i> et des IgE totales au moins égales à 500 UI/mL, avec des éléments de soutien comme l’éosinophilie, les IgG spécifiques ou des bouchons muqueux hyperdenses.</p><p class="lab">Conséquence clinique</p><p>Le traitement par prednisolone orale ou itraconazole réduit les poussées et protège les bronches.</p><div class="key"><b>Piège.</b> Une ABPA méconnue explique une détérioration rapide ; l’ERS 2025 la recherche au diagnostic et en cas d’aggravation.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00061-2024" target="_blank" rel="noopener">Agarwal et al., Eur Respir J 2024;63:2400061</a>.</p></template>
<template data-pop="j47-deficit" data-title="Déficit immunitaire humoral"><p class="lab">Définition</p><p>Le déficit immunitaire commun variable et les autres déficits de production d’anticorps diminuent les IgG, parfois les IgA et les IgM.</p><p class="lab">Mécanisme</p><p>Sans anticorps opsonisants, les bactéries encapsulées comme le pneumocoque et <i>Haemophilus influenzae</i> échappent à la phagocytose et provoquent des infections répétées.</p><p class="lab">Conséquence clinique</p><p>La substitution par immunoglobulines intraveineuses ou sous-cutanées réduit les infections et ralentit l’évolution. Le patient est adressé à un immunologue.</p><div class="key"><b>Piège.</b> Des immunoglobulines normales n’excluent pas un défaut fonctionnel ; l’ERS propose alors de mesurer la réponse vaccinale pneumococcique six semaines après vaccination.</div></template>
<template data-pop="j47-dcp" data-title="Dyskinésie ciliaire primitive"><p class="lab">Définition</p><p>Maladie génétique, le plus souvent autosomique récessive, des cils mobiles. Plus de cinquante gènes sont impliqués.</p><p class="lab">Mécanisme</p><p>Des cils immobiles ou désorganisés ne transportent plus le mucus. Pendant l’embryogenèse, les cils du nœud déterminent la latéralité, d’où un situs inversus chez environ la moitié des patients.</p><p class="lab">Diagnostic</p><p>La recommandation de l’ERS de 2017 associe la mesure du monoxyde d’azote nasal, abaissé, la vidéomicroscopie à haute vitesse, la microscopie électronique et la génétique, dans un centre spécialisé.</p><div class="key"><b>Piège.</b> Une détresse respiratoire néonatale à terme, une rhinite permanente depuis la naissance et des otites séromuqueuses chroniques doivent faire évoquer le diagnostic à tout âge.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01090-2016" target="_blank" rel="noopener">Lucas et al., Eur Respir J 2017</a>.</p></template>
<template data-pop="j47-systemique" data-title="Maladies systémiques associées"><p class="lab">Définition</p><p>La polyarthrite rhumatoïde, le syndrome de Sjögren, le lupus, la maladie de Crohn et la rectocolite hémorragique s’associent à des bronchectasies.</p><p class="lab">Mécanisme</p><p>L’inflammation systémique atteint la muqueuse bronchique ; les traitements immunosuppresseurs augmentent le risque infectieux.</p><p class="lab">Conséquence clinique</p><p>L’ERS 2025 classe la polyarthrite rhumatoïde parmi les étiologies à haut risque : l’association augmente la mortalité. Le choix d’un immunosuppresseur se discute avec le pneumologue.</p><div class="key"><b>Limite.</b> Une sérologie isolée sans signe articulaire, cutané ou digestif ne suffit pas à retenir une connectivite.</div></template>
<template data-pop="j47-bpco" data-title="Bronchectasies et bronchopneumopathie chronique obstructive"><p class="lab">Définition</p><p>Des bronchectasies sont fréquentes chez les patients atteints de bronchopneumopathie chronique obstructive sévère. L’association définit un phénotype propre.</p><p class="lab">Mécanisme</p><p>L’inflammation neutrophilique et l’infection bactérienne chronique sont partagées par les deux maladies.</p><p class="lab">Conséquence clinique</p><p>L’association augmente les exacerbations et la mortalité. Les corticostéroïdes inhalés gardent leur indication de bronchopneumopathie chronique obstructive, notamment si les éosinophiles sanguins sont élevés.</p><div class="key"><b>Limite.</b> L’ERS 2025 recommande d’explorer un asthme ou une bronchopneumopathie chronique obstructive suspectés ; une bronchectasie n’annule pas leurs traitements propres.</div></template>
<template data-pop="j47-mnt" data-title="Mycobactéries non tuberculeuses"><p class="lab">Définition</p><p>Le complexe <i>Mycobacterium avium</i> et <i>Mycobacterium abscessus</i> sont des mycobactéries de l’environnement, non transmises de personne à personne dans la plupart des cas.</p><p class="lab">Mécanisme</p><p>Elles colonisent les bronches dont la clairance est altérée, puis provoquent une maladie progressive, souvent du lobe moyen et de la lingula.</p><p class="lab">Diagnostic</p><p>La maladie exige des symptômes, une imagerie compatible et au moins deux cultures d’expectoration positives pour la même espèce, selon la recommandation conjointe ATS, ERS, ESCMID et IDSA de 2020.</p><div class="key"><b>Piège.</b> Un macrolide donné seul pour prévenir les exacerbations sélectionne une souche résistante ; l’ERS 2025 recommande de rechercher les mycobactéries chez tous les patients.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00535-2020" target="_blank" rel="noopener">Daley et al., Eur Respir J 2020</a>.</p></template>
<template data-pop="j47-expectoration" data-title="Volume et purulence de l’expectoration"><p class="lab">Définition</p><p>L’échelle colorimétrique de Murray classe l’expectoration en muqueuse, mucopurulente ou purulente à l’aide d’un nuancier.</p><p class="lab">Mécanisme</p><p>La couleur verte provient de la myéloperoxydase des neutrophiles. Plus l’expectoration est purulente, plus la charge bactérienne et l’activité élastasique sont élevées.</p><p class="lab">Conséquence clinique</p><p>Une purulence quotidienne marque un risque élevé d’exacerbation selon l’ERS 2025. Le patient note le volume et la couleur habituels pour reconnaître une exacerbation.</p><div class="key"><b>Limite.</b> La couleur seule ne désigne ni la bactérie ni l’antibiotique.</div></template>
<template data-pop="j47-hemoptysie" data-title="Hémoptysie et bronchectasies"><p class="lab">Définition</p><p>L’hémoptysie est l’émission de sang par la bouche lors d’un effort de toux, provenant des voies aériennes sous-glottiques.</p><p class="lab">Mécanisme</p><p>L’inflammation chronique hypertrophie les artères bronchiques, issues de l’aorte. Leurs néovaisseaux fragiles saignent sous pression systémique, surtout pendant les exacerbations.</p><p class="lab">Conséquence clinique</p><p>Des stries de sang lors d’une exacerbation sont fréquentes et cèdent avec l’antibiotique. Un saignement abondant menace la ventilation et impose une prise en charge urgente.</p><div class="key"><b>Piège.</b> Chez un fumeur, une hémoptysie ne doit pas être attribuée aux bronchectasies sans avoir exclu un cancer bronchique.</div></template>
<template data-pop="j47-crepitants" data-title="Crépitants grossiers"><p class="lab">Définition</p><p>Ce sont des bruits discontinus, graves et de durée relativement longue, entendus en début et milieu d’inspiration.</p><p class="lab">Mécanisme</p><p>Ils naissent du passage de l’air à travers des sécrétions dans des bronches dilatées et de la réouverture de voies aériennes collabées.</p><p class="lab">Valeur clinique</p><p>Ils se modifient après la toux, qui déplace les sécrétions. Ils se distinguent des crépitants fins de fin d’inspiration, dits en velcro, de la fibrose pulmonaire.</p><div class="key"><b>Limite.</b> Leur absence n’exclut pas le diagnostic ; leur présence ne précise pas l’étendue des lésions.</div></template>
