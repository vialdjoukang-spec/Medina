<template data-pop="j47-tdm" data-title="Signes tomodensitométriques des bronchectasies"><p class="lab">Technique</p><p>La tomodensitométrie thoracique est réalisée en coupes fines, d’environ 1 mm, sans injection, en inspiration profonde ; une acquisition à faible dose suffit souvent.</p><p class="lab">Signes directs</p><p>Le rapport broncho-artériel égal ou supérieur à 1 dessine la bague à chaton en coupe transversale. En coupe longitudinale, la bronche garde un calibre constant ou s’élargit vers la périphérie, au lieu de s’effiler, et reste visible dans le centimètre sous-pleural.</p><p class="lab">Signes indirects</p><p>L’épaississement pariétal, les bouchons muqueux, les micronodules en arbre en bourgeon et le piégeage expiratoire traduisent l’activité et l’atteinte des petites voies aériennes.</p><div class="key"><b>Piège.</b> Une tomodensitométrie réalisée pendant une pneumonie montre des dilatations transitoires ; le contrôle se fait à distance de l’épisode aigu.</div></template>
<template data-pop="j47-bilan" data-title="Bilan étiologique minimal de l’ERS 2025"><p class="lab">Contenu</p><p>Chez tout patient nouvellement diagnostiqué, l’ERS demande une formule sanguine avec éosinophiles, le dosage des IgG, IgA et IgM, les IgE totales et les anticorps IgE et IgG anti-<i>Aspergillus</i>. S’y ajoutent un examen direct et une culture pour mycobactéries, ainsi qu’une culture bactérienne de l’expectoration.</p><p class="lab">Raison</p><p>Ces tests sont peu coûteux, détectent des causes présentes chacune jusque chez 10 % des patients et modifient le traitement : substitution immunoglobulinique, traitement de l’ABPA, traitement d’une mycobactérie.</p><p class="lab">Tests ciblés</p><p>La mucoviscidose et la dyskinésie ciliaire sont recherchées si la maladie a débuté dans l’enfance ou si des signes évocateurs existent. L’alpha-1 antitrypsine est dosée en cas d’emphysème basal ou d’obstruction sévère ; les auto-anticorps sont demandés selon la clinique.</p><div class="key"><b>Limite.</b> Le bilan se répète lorsque l’état se dégrade : une cause nouvelle ou méconnue peut apparaître.</div><p class="src">Références : <a href="https://publications.ersnet.org/content/erj/66/6/2501126" target="_blank" rel="noopener">ERS 2025, question narrative 1</a>.</p></template>
<template data-pop="j47-embolisation" data-title="Embolisation des artères bronchiques"><p class="lab">Principe</p><p>Le radiologue interventionnel cathétérise les artères bronchiques depuis l’aorte et les occlut par des microparticules.</p><p class="lab">Mécanisme</p><p>Le saignement provient presque toujours de la circulation bronchique systémique, hypertrophiée par l’inflammation. L’occlusion supprime la pression qui alimente la fuite.</p><p class="lab">Place</p><p>C’est le traitement de première ligne d’une hémoptysie abondante, après sécurisation des voies aériennes. Un angioscanner préalable localise le saignement et cartographie les artères.</p><div class="key"><b>Limite.</b> Les récidives sont fréquentes, car la maladie persiste ; une artère spinale née d’une artère bronchique impose une grande prudence technique.</div></template>
<template data-pop="j47-exacerbation" data-title="Exacerbation : définition consensuelle"><p class="lab">Définition</p><p>Le consensus publié en 2017 retient l’aggravation d’au moins trois des six symptômes suivants pendant au moins 48 heures : toux, volume ou consistance de l’expectoration, purulence, dyspnée ou intolérance à l’effort, fatigue ou malaise, hémoptysie. Le médecin juge en outre qu’une modification du traitement est nécessaire.</p><p class="lab">Gravité</p><p>Une exacerbation est sévère lorsqu’elle requiert une hospitalisation ou un antibiotique intraveineux.</p><p class="lab">Causes</p><p>La charge bactérienne augmente souvent sans changement de germe ; les virus respiratoires déclenchent une part importante des épisodes.</p><div class="key"><b>Limite.</b> Cette définition a été conçue pour la recherche ; la recommandation de l’ERS de 2025 la reprend sous une forme pratique.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.00051-2017" target="_blank" rel="noopener">Hill et al., Eur Respir J 2017;49:1700051</a>.</p></template>
<template data-pop="j47-kine" data-title="Kinésithérapie de drainage bronchique"><p class="lab">Techniques</p><p>Le cycle actif des techniques respiratoires alterne contrôle ventilatoire, expansions thoraciques et expirations forcées à glotte ouverte. Le drainage autogène module le volume pulmonaire pour déplacer le mucus des petites vers les grosses bronches. Les dispositifs à pression expiratoire positive oscillante maintiennent les bronches ouvertes et fluidifient le mucus.</p><p class="lab">Preuve et modalités</p><p>L’ERS 2025 en fait une recommandation forte, avec une certitude très faible, car le bénéfice sur la qualité de vie est cohérent et le risque minime. La British Thoracic Society propose des séances de 10 à 30 minutes, une à deux fois par jour, enseignées par un physiothérapeute.</p><div class="key"><b>Limite.</b> Aucune technique n’a démontré sa supériorité : le choix suit la préférence et l’adhésion du patient.</div></template>
<template data-pop="j47-rehab" data-title="Réhabilitation respiratoire"><p class="lab">Définition</p><p>La réhabilitation est un programme supervisé d’entraînement à l’endurance et au renforcement, associé à une éducation thérapeutique.</p><p class="lab">Preuve</p><p>L’ERS 2025 la recommande fortement chez les patients dyspnéiques ou limités à l’effort : elle réduit la dyspnée et améliore la capacité d’exercice.</p><p class="lab">Conséquence pratique</p><p>Le volet éducatif intègre le drainage bronchique ; l’activité physique régulière est encouragée ensuite chez tous.</p><div class="key"><b>Limite.</b> Le bénéfice s’estompe si l’activité n’est pas poursuivie après le programme.</div></template>
<template data-pop="j47-vaccination" data-title="Vaccinations recommandées en Suisse"><p class="lab">Recommandations</p><p>Le Plan de vaccination suisse 2026 range les maladies respiratoires chroniques parmi les risques justifiant la vaccination annuelle contre la grippe et la vaccination antipneumococcique par un vaccin conjugué. L’OFSP recommande en outre la vaccination contre le virus respiratoire syncytial dès 75 ans et dès 60 ans en présence d’une maladie à risque, dans une recommandation publiée séparément en septembre 2025.</p><p class="lab">Mécanisme</p><p>Les virus déclenchent des exacerbations ; le pneumocoque cause des surinfections graves. Prévenir ces infections réduit les épisodes aigus.</p><div class="key"><b>Limite.</b> Le choix du vaccin pneumococcique et sa prise en charge suivent la version en vigueur du plan de vaccination et du document de référence de l’OFSP.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j47-eradication" data-title="Éradication de Pseudomonas aeruginosa"><p class="lab">Indication</p><p>L’ERS 2025 suggère une éradication lors d’un premier isolement ou d’un nouvel isolement après une longue période sans détection.</p><p class="lab">Schémas</p><p>Les pratiques varient. Un schéma courant associe la ciprofloxacine orale pendant deux semaines, puis une culture de contrôle ; d’autres ajoutent un antibiotique inhalé pendant quatre semaines à trois mois. En cas d’échec, une antibiothérapie intraveineuse antipseudomonas est discutée.</p><p class="lab">Résultat</p><p>Les études observationnelles rapportent une éradication chez environ 40 % des patients à douze mois et moins d’exacerbations l’année suivante.</p><div class="key"><b>Limite.</b> Aucun essai n’a comparé l’éradication à l’abstention ; la certitude est très faible.</div></template>
<template data-pop="j47-macrolides" data-title="Macrolides au long cours"><p class="lab">Mécanisme</p><p>À faible dose, l’azithromycine réduit le recrutement et l’activation des neutrophiles, diminue la sécrétion de mucus et perturbe la détection du quorum de <i>Pseudomonas</i>. Cet effet ne dépend pas d’une sensibilité bactérienne.</p><p class="lab">Preuves</p><p>Les essais EMBRACE, BAT et BLESS ont montré une réduction des exacerbations. La méta-analyse de l’ERS 2025 retrouve une réduction de 52 % et une amélioration cliniquement pertinente de la qualité de vie.</p><p class="lab">Avant et pendant</p><p>Le médecin exclut une mycobactérie non tuberculeuse, mesure le QTc et contrôle les fonctions hépatique et rénale. Il avertit le patient du risque d’acouphènes, de surdité et de vertiges, qui imposent l’arrêt. Les troubles digestifs touchent jusqu’à un patient sur cinq.</p><div class="key"><b>Limite.</b> L’emploi prolongé favorise la résistance aux macrolides de la flore oropharyngée ; en Suisse, il reste hors indication.</div><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(12)60953-2" target="_blank" rel="noopener">Wong et al., EMBRACE, Lancet 2012</a> ; <a href="https://doi.org/10.1001/jama.2013.1937" target="_blank" rel="noopener">Altenburg et al., BAT, 2013</a> ; <a href="https://doi.org/10.1016/S2213-2600(19)30191-2" target="_blank" rel="noopener">Chalmers et al., méta-analyse sur données individuelles, Lancet Respir Med 2019</a>.</p></template>
<template data-pop="j47-inhales" data-title="Antibiotiques inhalés"><p class="lab">Principe</p><p>Le colistiméthate, la tobramycine, la gentamicine ou l’aztréonam nébulisés atteignent dans le mucus des concentrations très supérieures à celles d’une voie orale, avec une faible exposition systémique.</p><p class="lab">Preuves</p><p>Dans la méta-analyse de l’ERS 2025, ils réduisent les exacerbations de 20 % et les exacerbations sévères de 43 %, sans amélioration significative de la qualité de vie. La résistance bactérienne double environ sous traitement.</p><p class="lab">Conduite</p><p>Ils sont prescrits pour une période définie, puis évalués ; inefficaces ou mal tolérés, ils sont arrêtés. La première dose est administrée sous surveillance, car un bronchospasme est possible.</p><div class="key"><b>Limite.</b> En Europe et en Suisse, ces spécialités sont autorisées pour la mucoviscidose ; leur emploi dans les autres bronchectasies est hors indication.</div><p class="src">Références : <a href="https://doi.org/10.1016/S2213-2600(24)00225-X" target="_blank" rel="noopener">Haworth et al., colistiméthate inhalé, Lancet Respir Med 2024</a>.</p></template>
<template data-pop="j47-mucoactifs" data-title="Traitements mucoactifs"><p class="lab">Définition</p><p>Le sérum salé hypertonique à 6 ou 7 % et le mannitol inhalé réhydratent le mucus par osmose ; la carbocistéine et la N-acétylcystéine orales modifient sa viscosité.</p><p class="lab">Preuves</p><p>L’ERS 2025 les suggère lorsque le drainage ne contrôle pas les symptômes, avec une certitude très faible ; les essais ne montrent pas de réduction globale des exacerbations.</p><p class="lab">Désoxyribonucléase recombinante</p><p>Efficace dans la mucoviscidose, elle a augmenté les exacerbations et le déclin du VEMS dans les autres bronchectasies : l’ERS la déconseille.</p><div class="key"><b>Piège.</b> Le sérum hypertonique peut provoquer un bronchospasme ; il est précédé d’un bronchodilatateur et d’une dose test.</div></template>
<template data-pop="j47-csi" data-title="Corticostéroïdes inhalés"><p class="lab">Position</p><p>L’ERS 2025 suggère de ne pas proposer de corticostéroïde inhalé au long cours sans asthme ni bronchopneumopathie chronique obstructive associés.</p><p class="lab">Mécanisme</p><p>L’inflammation des bronchectasies est surtout neutrophilique, peu sensible aux corticostéroïdes ; ceux-ci réduisent la défense locale et augmentent le risque de pneumonie.</p><p class="lab">Conséquence pratique</p><p>Un corticostéroïde inhalé prescrit sans indication claire est réévalué et souvent arrêté.</p><div class="key"><b>Limite.</b> Un sous-groupe à éosinophiles sanguins élevés pourrait en bénéficier ; aucune recommandation n’est encore possible.</div></template>
<template data-pop="j47-brensocatib" data-title="Brensocatib"><p class="lab">Mécanisme</p><p>Le brensocatib inhibe de façon réversible la DPP1 des promyélocytes médullaires. Il empêche l’activation de l’élastase, de la protéinase 3 et de la cathepsine G des futurs neutrophiles.</p><p class="lab">Essai ASPEN</p><p>Chez 1 721 adultes et 41 adolescents ayant eu au moins deux exacerbations dans l’année, les taux annuels d’exacerbation ont été de 1,02 avec 10 mg, 1,04 avec 25 mg et 1,29 sous placebo, soit des rapports de taux de 0,79 et 0,81. Le déclin du VEMS a été moindre avec 25 mg, de 38 mL par an.</p><p class="lab">Statut et emploi</p><p>Le brensocatib a été autorisé aux États-Unis en août 2025, puis dans l’Union européenne le 18 novembre 2025 à la dose de 25 mg par jour. Aucune autorisation Swissmedic n’était documentée dans les sources consultées le 08.10.2026. Les effets indésirables les plus fréquents sont les céphalées, l’hyperkératose, la dermatite et les parodontopathies.</p><div class="key"><b>Limite.</b> Les vaccins vivants atténués sont évités faute de données ; l’ERS prévoit d’évaluer la molécule dans une mise à jour.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa2411664" target="_blank" rel="noopener">Chalmers et al., N Engl J Med 2025;392:1569-1581</a> ; <a href="https://www.ema.europa.eu/en/medicines/human/EPAR/brinsupri" target="_blank" rel="noopener">Agence européenne des médicaments, Brinsupri</a>.</p></template>
<template data-pop="j47-cipro" data-title="Ciprofloxacine"><p class="lab">Mécanisme</p><p>Cette fluoroquinolone bactéricide inhibe l’ADN gyrase et la topo-isomérase IV. C’est le seul antibiotique oral actif sur <i>Pseudomonas aeruginosa</i>.</p><p class="lab">Emploi</p><p>Elle sert à l’éradication d’un premier isolement et au traitement des exacerbations à <i>Pseudomonas</i>, à 500 à 750 mg deux fois par jour pendant 14 jours. La dose est réduite en cas d’insuffisance rénale.</p><p class="lab">Effets indésirables</p><p>La ciprofloxacine expose aux tendinopathies et aux ruptures tendineuses, à l’allongement du QT, aux troubles neuropsychiatriques, aux dysglycémies et à la photosensibilité. Ces risques justifient des cures limitées.</p><div class="key"><b>Interactions.</b> La ciprofloxacine inhibe le CYP1A2 : la théophylline et la tizanidine s’accumulent. Les cations divalents, comme le calcium et le fer, réduisent son absorption.</div></template>
<template data-pop="j47-chirurgie" data-title="Chirurgie et transplantation"><p class="lab">Résection</p><p>Une lobectomie ou une segmentectomie se discute chez un patient à maladie localisée, dont les symptômes persistent malgré un traitement médical optimisé par un centre spécialisé.</p><p class="lab">Transplantation</p><p>L’ERS 2025 recommande d’adresser précocement les patients dont la maladie progresse malgré un traitement optimal : déclin rapide du VEMS, VEMS inférieur à 30 % de la valeur prédite ou PaCO₂ supérieure à 50 mmHg.</p><div class="key"><b>Limite.</b> La chirurgie ne guérit pas une maladie diffuse ; elle supprime un foyer qui entretient l’infection.</div></template>
<template data-pop="pareto-j47-clin" data-title="Pareto — Définition, mécanismes et clinique"><p class="ratio" data-cover="j47-0,j47-1,j47-2,j47-3,j47-4,j47-5,j47-6"></p><ul><li>Les bronchectasies associent une dilatation bronchique permanente en tomodensitométrie et des symptômes caractéristiques ; la mucoviscidose est codée à part (E84).</li><li>La clairance altérée, l’infection chronique, l’inflammation neutrophilique et la destruction pariétale s’entretiennent mutuellement.</li><li>Les causes principales sont post-infectieuses, allergiques (ABPA), immunitaires, ciliaires, systémiques ou liées à une bronchopneumopathie chronique obstructive ; quatre cas sur dix restent idiopathiques.</li><li>La toux productive quotidienne, les exacerbations répétées, les hémoptysies et les crépitants grossiers forment le tableau clinique.</li></ul></template>
<template data-pop="pareto-j47-pec" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="j47-7,j47-8,j47-9"></p><ul><li>Tout patient reçoit une tomodensitométrie en haute résolution, un bilan étiologique minimal et un score BSI.</li><li>L’hémoptysie abondante, traitée par embolisation, et l’exacerbation sévère sont les deux urgences.</li><li>Le socle associe drainage bronchique, réhabilitation, traitement de la cause et vaccinations.</li><li>Le patient à haut risque reçoit un macrolide, ou un antibiotique inhalé si <i>Pseudomonas</i> est chronique ; un premier isolement est éradiqué et une exacerbation se traite 14 jours.</li></ul></template>
<template data-pop="pareto-j47-crit" data-title="Pareto — Suivi et critères"><p class="ratio" data-cover="j47-10,j47-11,j47-12"></p><ul><li>Le suivi est clinique et microbiologique ; toute aggravation rapide relance l’enquête étiologique.</li><li>Chez le sujet âgé, l’ECG et l’audition sont contrôlés avant un macrolide.</li><li>Le diagnostic exige un rapport broncho-artériel égal ou supérieur à 1 ou une absence d’effilement, avec des symptômes ; l’exacerbation associe au moins trois symptômes aggravés pendant 48 heures.</li></ul></template>
<template data-pop="pareto-j47-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j47-e-1,j47-e-2"></p><ul><li>La tomodensitométrie en haute résolution est le gold standard ; la radiographie ne suffit pas.</li><li>Le minimum comprend formule sanguine, immunoglobulines, bilan aspergillaire et cultures bactérienne et mycobactérienne.</li><li>L’infection chronique exige deux cultures positives à trois mois d’intervalle ; aucun macrolide n’est donné sans exclure une mycobactérie.</li></ul></template>
<template data-pop="pareto-j47-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j47-p-1,j47-p-2,j47-p-3"></p><ul><li>L’azithromycine au long cours protège le patient à haut risque, après ECG et recherche de mycobactérie.</li><li>Un antibiotique inhalé s’ajoute en cas de <i>Pseudomonas</i> chronique, avec une première dose sous surveillance.</li><li>Le brensocatib, à 25 mg par jour, est autorisé dans l’Union européenne.</li><li>La désoxyribonucléase recombinante, le corticostéroïde inhalé sans indication et l’antitussif opioïde sont à éviter.</li></ul></template>
