<div class="chap-head"><div class="code">J21 — Bronchiolite aiguë · couvre J21.0, J21.1, J21.8, J21.9 et J22 — Infection aiguë des voies respiratoires inférieures, sans précision · renvois : J18 — Pneumonies de l’adulte, J40 — Bronchite, J45 — Asthme · CIM-10-GM 2024 · Appareil respiratoire</div>
<h1>Bronchiolite aiguë et infection aiguë des voies respiratoires inférieures</h1><span class="status">Nourrisson au premier plan, adulte ensuite · OFSP/CFV 2026, SSPP 2020, NICE 2021, Haute Autorité de santé 2019, ERS/ESCMID 2011 · état au 09.10.2026</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la bronchiolite et des infections respiratoires basses</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#j21-0">Question clinique</a></li><li><a href="#j21-1">Définitions et degrés de gravité</a></li><li><a href="#j21-2">Épidémiologie et pronostic</a></li><li><a href="#j21-3">De l’épithélium cilié à l’hypoxémie</a></li><li><a href="#j21-4">Virus en cause et terrains à risque</a></li><li><a href="#j21-5">Interroger les parents</a></li><li><a href="#j21-6">Examiner le nourrisson</a></li><li><a href="#j21-7">Établir le diagnostic</a></li><li><a href="#j21-8">Signes de gravité et complications</a></li><li><a href="#j21-9">Prendre en charge le nourrisson</a></li><li><a href="#j21-10">Infection respiratoire basse de l’adulte</a></li><li><a href="#j21-11">Suivi et prévention</a></li><li><a href="#j21-12">Situations particulières</a></li><li><a href="#j21-13">Critères formels du diagnostic</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="j21-0"><h2><span class="n">0</span>Question clinique</h2><p>Léa, 7 semaines, née à terme, est amenée aux urgences un soir de janvier. Son nez coule depuis deux jours ; depuis la veille, elle tousse et ne boit plus que la moitié de ses biberons. Après lavage du nez, elle respire à 64 cycles par minute avec un tirage intercostal ; l’auscultation entend des crépitants fins et des sibilants, et la SpO₂ en air ambiant est de 91 %. <b>Faut-il la renvoyer à domicile avec des conseils, ou l’hospitaliser ?</b></p><p>La bronchiolite aiguë est une infection virale des bronchioles du nourrisson, dominée par le virus respiratoire syncytial (VRS). Aucun médicament n’en raccourcit l’évolution : la décision repose sur l’évaluation de la gravité, le soutien respiratoire et hydrique, et la prévention par anticorps ou vaccination maternelle. Chez l’adulte, le même virus et d’autres agents provoquent des infections respiratoires basses dont la question centrale est inverse : reconnaître la pneumonie qui justifie un antibiotique, et épargner l’antibiotique aux autres.</p><div class="key"><b>Point de départ.</b> <button class="w" data-justification="1" data-k="j21-gravite">Les trois degrés de gravité (critères suisses et européens)</button> ; <button class="w" data-justification="1" data-k="j21-sspp">les recommandations suisses en vigueur (histoire et portée)</button>.</div></section>
<section class="ilot" id="j21-1"><h2><span class="n">1</span>Définitions et degrés de gravité</h2><p>La bronchiolite aiguë n’a pas de définition internationale unique. En Suisse, comme dans les recommandations britanniques et dans une grande partie de l’Europe centrale, elle désigne une maladie virale saisonnière du nourrisson associant fièvre, rhinorrhée et toux sèche, puis des crépitants inspiratoires fins ou des sibilants expiratoires aigus. Aux États-Unis, les sibilances suffisent jusqu’à 2 ans : les études américaines incluent donc des enfants que l’Europe classerait parmi les <button class="w" data-justification="1" data-k="j21-def-europe">bronchites obstructives (conséquence pour la lecture des essais)</button>.</p><p>Le <button class="w" data-justification="1" data-k="j21-nice">NICE (2015, mis à jour en 2021)</button> retient le diagnostic devant un prodrome rhinitique d’un à trois jours suivi d’une toux persistante, d’une tachypnée ou d’un tirage, et de sibilants ou de crépitants. La Haute Autorité de santé française (2019) limite sa définition au premier épisode avant 12 mois, quelle que soit la saison. Un deuxième épisode rapproché fait chercher un autre diagnostic, en particulier un asthme du jeune enfant.</p><p>La gravité, et non le nom de la maladie, commande la conduite. La mise à jour suisse de la SSPP (2020) classe l’épisode en trois degrés.</p><table class="t"><tr><th>Critère</th><th>Légère</th><th>Modérée</th><th>Sévère</th></tr><tr><td>État général</td><td>Normal</td><td>Irritable, agité</td><td>Apathique</td></tr><tr><td>Fréquence respiratoire</td><td>&lt; 60/min</td><td>≥ 60/min</td><td>&gt; 70/min</td></tr><tr><td>SpO₂ en air ambiant</td><td>&gt; 92 %</td><td>88 à 92 %</td><td>&lt; 88 %</td></tr><tr><td>Tirage, battement des ailes du nez</td><td>Absent</td><td>Présent</td><td>Marqué</td></tr><tr><td>Alimentation</td><td>Sans problème</td><td>Difficile, plus de 50 % de la ration</td><td>Moins de 50 % ; détresse en buvant</td></tr></table><p>Le critère le plus défavorable classe l’épisode : Léa, à 64 cycles par minute, 91 % de saturation et une ration réduite de moitié, atteint au moins le degré modéré et se situe à la limite du degré sévère pour l’alimentation. La grille européenne de la <button class="w" data-justification="1" data-k="j21-gravite">Haute Autorité de santé (seuils voisins, critères d’apnée et de fréquence cardiaque)</button> conduit à la même conclusion.</p><p>Chez l’adulte, la recommandation <button class="w" data-justification="1" data-k="j21-ers-def">ERS/ESCMID (définitions opérationnelles)</button> définit l’infection aiguë des voies respiratoires inférieures comme une maladie de 21 jours au plus, dominée par la toux, avec au moins un autre symptôme respiratoire bas (expectoration, dyspnée, sibilants, gêne ou douleur thoracique) et sans autre explication. C’est un terme générique, qui englobe la bronchite aiguë, la pneumonie et les exacerbations infectieuses des maladies chroniques, et qui s’emploie lorsque le cas n’entre dans aucun de ces cadres.</p><div class="key"><b>À retenir.</b> La bronchiolite est un diagnostic clinique du nourrisson, défini en Europe par les crépitants ou les sibilants après une rhinite. Sa gravité se gradue sur la fréquence respiratoire, la saturation, le tirage et l’alimentation. Chez l’adulte, « infection respiratoire basse » est un cadre d’attente qui oblige à rechercher une pneumonie.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben, Regamey et Hammer, Bronchiolite aiguë – une mise à jour, Forum Médical Suisse 2020, tableaux 1 et 2</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.1 à 1.1.7, version du 09.08.2021</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, premier épisode de bronchiolite aiguë, texte des recommandations, novembre 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., recommandation ERS/ESCMID sur les infections respiratoires basses de l’adulte, 2011, définitions</a>.</p></section>
<section class="ilot" id="j21-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>En Suisse, la saison du VRS s’étend de novembre à mars ou avril, avec un pic en janvier et février. Une saison forte alterne en général avec une saison faible. Pendant le semestre d’hiver, le VRS est le premier motif d’hospitalisation du nourrisson et du petit enfant.</p><p>De 2014-2015 à 2019-2020, 2,4 % des nourrissons ont été hospitalisés chaque année pour une infection à VRS, et 3,7 % pendant la saison 2022-2023. Le risque culmine au deuxième mois de vie et chute après le quatrième ; 55 % des séjours concernent les trois premiers mois. Le séjour moyen dure 4,4 jours, 5 à 10 % des nourrissons hospitalisés passent en soins intensifs, et la létalité reste très faible, de 0,012 % en moyenne. Ces chiffres sont détaillés dans la fenêtre des <button class="w" data-justification="1" data-k="j21-epi-ch">données suisses (OFSP 2026, registre hospitalier 2003-2021)</button>.</p><p>Le fait le plus important pour la prévention est le terrain : 75 à 90 % des nourrissons hospitalisés pour un VRS étaient nés à terme et en bonne santé. Un programme limité aux prématurés manquerait donc la majorité des hospitalisations, ce qui justifie l’immunisation de tous les nourrissons depuis l’automne 2024.</p><p>L’évolution aiguë dure environ dix jours ; une toux isolée peut persister jusqu’à quatre semaines. À plus long terme, plusieurs études associent une bronchiolite sévère à un risque accru de <button class="w" data-justification="1" data-k="j21-wheezing-long">sifflements récidivants et d’asthme (association ou causalité)</button>. Chez l’adulte, le VRS frappe surtout la personne âgée ou porteuse d’une maladie chronique, et son poids est sous-estimé parce qu’il est rarement recherché : c’est l’objet de la fenêtre sur le <button class="w" data-justification="1" data-k="j21-adulte-vrs">VRS de l’adulte (fréquence et sous-diagnostic)</button>.</p><div class="key"><b>À retenir.</b> En Suisse, un nourrisson sur quarante environ est hospitalisé chaque hiver pour un VRS, surtout avant 3 mois et le plus souvent sans facteur de risque. La mortalité est très faible lorsque la surveillance et le soutien respiratoire sont accessibles.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, recommandations VRS, mise à jour 2026, chapitre 4</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39328156/" target="_blank" rel="noopener">Stucki et al., charge hospitalière du VRS en Suisse 2003-2021, Euro Surveill 2024</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, fiche de conseils aux parents</a>.</p></section>
<section class="ilot" id="j21-3"><h2><span class="n">3</span>De l’épithélium cilié à l’hypoxémie</h2><p>Les bronchioles distales sont tapissées de cellules cylindriques ciliées qui chassent le mucus vers le haut. Le VRS infecte presque exclusivement ces cellules cylindriques, ciliées ou non. Sa <button class="w" data-justification="1" data-k="j21-ns2">protéine non structurale NS2 (desquamation de l’épithélium)</button> les arrondit et les détache ; elles tombent dans la lumière avec des débris nécrotiques et de très nombreux polynucléaires neutrophiles attirés par l’infection. L’excès de mucus et la bronchoconstriction ne jouent qu’un rôle secondaire dans les bronchioles du nourrisson.</p><p>Ce matériel cellulaire obstrue une lumière déjà minuscule : le diamètre moyen d’une bronchiole respiratoire est d’environ 120 µm à 2-4 mois, contre 250 µm chez l’adulte. Le nourrisson dispose en outre d’une <button class="w" data-justification="1" data-k="j21-diametre">ventilation collatérale peu développée (pourquoi l’obstruction ne se contourne pas)</button>. L’air entre mais sort mal : il se crée un piégeage, une distension thoracique et une tachypnée.</p><p>L’air piégé derrière un bouchon est ensuite résorbé, ce qui affaisse les alvéoles en micro-atélectasies. Les zones perfusées mais non ventilées créent un <button class="w" data-justification="1" data-k="j21-atelectasie">déséquilibre ventilation-perfusion et un shunt intrapulmonaire (mécanisme de l’hypoxémie)</button>. Chez le très jeune nourrisson, l’infection peut se révéler par des <button class="w" data-justification="1" data-k="j21-apnee">apnées (terrain et conduite)</button> avant tout signe respiratoire.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Chaîne physiopathologique de la bronchiolite à virus respiratoire syncytial" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="10" y="20" width="150" height="54" rx="6"/><rect x="180" y="20" width="150" height="54" rx="6"/><rect x="350" y="20" width="150" height="54" rx="6"/><rect x="520" y="20" width="150" height="54" rx="6"/><rect x="180" y="140" width="150" height="54" rx="6"/><rect x="350" y="140" width="150" height="54" rx="6"/><rect x="520" y="140" width="150" height="54" rx="6"/><path d="M160 47h20M330 47h20M500 47h20"/><path d="M595 74v66"/><path d="M520 167h-20M350 167h-20"/></g><g fill="#222"><text x="20" y="42">Infection des cellules</text><text x="20" y="60">cylindriques ciliées</text><text x="190" y="42">Desquamation (NS2),</text><text x="190" y="60">neutrophiles</text><text x="360" y="42">Bouchons dans des</text><text x="360" y="60">bronchioles de 120 µm</text><text x="530" y="42">Piégeage aérique,</text><text x="530" y="60">distension, tachypnée</text><text x="530" y="162">Résorption de l’air</text><text x="530" y="180">piégé : atélectasies</text><text x="360" y="162">Déséquilibre</text><text x="360" y="180">ventilation-perfusion</text><text x="190" y="162">Hypoxémie,</text><text x="190" y="180">travail respiratoire</text></g></svg><figcaption>Figure 1 — De l’infection épithéliale à l’hypoxémie. L’obstruction est d’abord cellulaire ; elle produit un piégeage puis des atélectasies de résorption. Schéma pédagogique d’après Pickles et al. (2015).</figcaption></figure><div class="key"><b>Conséquence thérapeutique.</b> Une obstruction faite de cellules desquamées ne cède ni aux bronchodilatateurs ni aux corticoïdes, ce qui explique leur inefficacité. L’oxygène corrige l’hypoxémie, la pression positive maintient ouvertes les voies aériennes collabées, et le temps permet la régénération de l’épithélium.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25302625/" target="_blank" rel="noopener">Pickles et al., le VRS et sa propension à provoquer la bronchiolite, J Pathol 2015</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.5</a>.</p></section>
<section class="ilot" id="j21-4"><h2><span class="n">4</span>Virus en cause et terrains à risque</h2><p>Le VRS cause 60 à 80 % des bronchiolites avant 12 mois. Le rhinovirus vient ensuite (14 à 30 %), puis le bocavirus humain, le métapneumovirus humain et, plus rarement, les entérovirus, adénovirus, coronavirus et virus de la grippe. Une co-infection par deux virus est retrouvée chez 20 à 30 % des enfants, sans gravité supplémentaire démontrée. La fenêtre sur les <button class="w" data-justification="1" data-k="j21-virus">virus de la bronchiolite (fréquences et profils)</button> distingue la bronchiolite à VRS du premier épisode sifflant à rhinovirus.</p><p>Le VRS se transmet par gouttelettes lors d’un contact rapproché, par aérosols et par les mains à partir de surfaces contaminées. L’incubation dure de deux à huit jours, et la contagiosité commence la veille des symptômes. L’immunité qui suit l’infection est brève, de six mois à deux ans : environ deux tiers des enfants sont infectés pendant leur première année et presque tous avant 3 ans.</p><p>Le risque de forme sévère dépend surtout de l’âge et de quelques terrains, réunis dans la fenêtre des <button class="w" data-justification="1" data-k="j21-facteurs-risque">facteurs de risque de bronchiolite grave (listes suisses et européennes)</button>.</p><table class="t"><tr><th>Terrain</th><th>Ce que disent les sources</th></tr><tr><td>Âge inférieur à 3 mois, a fortiori à 6 semaines</td><td>Bronchioles les plus étroites ; risque d’apnée, d’hypoxémie et de ventilation mécanique</td></tr><tr><td>Prématurité, surtout avant 32 semaines</td><td>Voies aériennes encore plus petites ; transfert d’anticorps maternels incomplet avant 37 semaines</td></tr><tr><td>Dysplasie bronchopulmonaire, mucoviscidose, malformation pulmonaire</td><td>Risque élevé et persistant de forme grave, jusqu’à la deuxième saison</td></tr><tr><td>Cardiopathie congénitale à retentissement hémodynamique, hypertension pulmonaire</td><td>Risque élevé et persistant de forme grave, jusqu’à la deuxième saison</td></tr><tr><td>Maladie neuromusculaire, polyhandicap, trisomie 21</td><td>Toux inefficace et fatigabilité musculaire</td></tr><tr><td>Déficit immunitaire</td><td>Risque accru de forme grave ; protection par anticorps parfois plus courte</td></tr></table><p>Ces terrains abaissent le seuil d’hospitalisation : à gravité égale, un ancien prématuré de 32 semaines est hospitalisé plus volontiers qu’un nourrisson né à terme. Des <button class="w" data-justification="1" data-k="j21-environnement">facteurs d’environnement (tabagisme passif, crèche, fratrie, allaitement)</button> augmentent aussi le recours aux soins. Chez l’adulte, le risque d’évolution grave du VRS croît nettement après 75 ans et en présence de maladies cardiaques, respiratoires, rénales, neurologiques ou d’une immunodépression.</p><div class="key"><b>À retenir.</b> Le VRS domine, mais tout virus respiratoire peut produire le même tableau. L’âge inférieur à 3 mois, la prématurité et les maladies cardiorespiratoires, neuromusculaires ou immunitaires désignent les nourrissons à surveiller de plus près.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar, Skjerven et Mikalsen, bronchiolite aiguë du nourrisson, Scand J Trauma Resusc Emerg Med 2014</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, recommandations VRS, mise à jour 2026, chapitres 1.2, 2.2 et 4.1</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.2.3</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, critères de vulnérabilité</a>.</p></section>
<section class="ilot" id="j21-5"><h2><span class="n">5</span>Interroger les parents</h2><p>L’histoire typique commence par un <button class="w" data-justification="1" data-k="j21-evolution">prodrome rhinitique d’un à trois jours (chronologie de la maladie)</button>, avec une fièvre modérée et une toux sèche. Les signes respiratoires culminent entre le troisième et le cinquième jour, période où le nourrisson peut s’aggraver. La fièvre n’existe que chez environ 30 % des enfants et dépasse rarement 39 °C ; une fièvre plus élevée fait discuter une pneumonie.</p><p>Le médecin quantifie l’<button class="w" data-justification="1" data-k="j21-alimentation">alimentation (pourcentage de la ration habituelle et signes de déshydratation)</button> : une ration inférieure à la moitié des apports habituels sur trois repas consécutifs marque une forme au moins modérée. Il demande si les parents ont observé une pause respiratoire, une coloration bleutée ou un malaise, car une apnée rapportée impose l’hospitalisation.</p><p>Il recherche ensuite les terrains à risque : âge gestationnel et âge corrigé, cardiopathie, maladie pulmonaire chronique, déficit immunitaire, maladie neuromusculaire, ainsi que le statut d’immunisation contre le VRS (anticorps reçu ou vaccination maternelle pendant la grossesse). Il note enfin l’exposition au tabac, la garde en crèche, la distance jusqu’aux soins et la capacité des parents à surveiller l’enfant.</p><div class="two"><div class="card"><b>Forme typique</b><p>Nourrisson de 3 à 6 mois, en hiver, avec un rhume puis une toux, une respiration rapide, un tirage et une alimentation réduite.</p></div><div class="card"><b>Formes trompeuses</b><p>Apnée isolée chez un nourrisson de moins de 6 semaines ou ancien prématuré ; premier épisode sifflant d’un enfant plus âgé et atopique, plus souvent dû au rhinovirus ; fièvre élevée ou crépitants localisés évoquant une pneumonie.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Prescrire un sirop contre la toux. Les antitussifs et fluidifiants sont contre-indiqués chez le nourrisson selon la Haute Autorité de santé, et la liste suisse « smarter medicine » de pédiatrie déconseille le traitement médicamenteux de la toux de l’enfant.</div><div class="key"><b>À retenir.</b> L’interrogatoire date le début des signes respiratoires, mesure l’alimentation, recherche les apnées et inventorie les terrains à risque et l’immunisation reçue.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.2 à 1.1.6</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, évaluation et traitements symptomatiques</a> ; <a href="https://www.smartermedicine.ch/fr/liste-top-5/pediatrie" target="_blank" rel="noopener">Pédiatrie Suisse, liste Top 5 « smarter medicine », 2021</a>.</p></section>
<section class="ilot" id="j21-6"><h2><span class="n">6</span>Examiner le nourrisson</h2><p>L’examen se fait chez un enfant calme, après <button class="w" data-justification="1" data-k="j21-desobstruction">désobstruction nasale (technique et limites)</button>, car un nez bouché suffit à accélérer la respiration et à abaisser la saturation. Le médecin apprécie d’abord l’état général : un enfant apathique, hypotonique ou geignard présente une forme grave.</p><div class="two"><div class="card"><b>Signes vitaux</b><p>La <button class="w" data-justification="1" data-k="j21-fr">fréquence respiratoire comptée sur une minute (seuils)</button> est le premier chiffre. La fréquence cardiaque est notée, une valeur supérieure à 180 ou inférieure à 80 par minute signant la gravité. La <button class="w" data-justification="1" data-k="j21-oxymetrie">SpO₂ par oxymètre pédiatrique (technique et pièges)</button> est mesurée chez tout nourrisson suspect, au besoin à plusieurs reprises, car elle varie beaucoup au début. La température et le poids complètent le bilan.</p></div><div class="card"><b>Signes respiratoires</b><p>Les <button class="w" data-justification="1" data-k="j21-tirage">signes de lutte (tirage, balancement, battement des ailes du nez)</button> mesurent le travail respiratoire. Les <button class="w" data-justification="1" data-k="j21-crepitants">crépitants inspiratoires fins (mécanisme et valeur)</button> et les <button class="w" data-justification="1" data-k="j21-sibilants">sibilants expiratoires (signification selon l’âge)</button> confirment l’atteinte des petites voies aériennes. L’hydratation est évaluée cliniquement ; une diurèse réduite et une perte de poids signalent une déshydratation débutante.</p></div></div><p>Des crépitants persistants et localisés, avec une fièvre supérieure à 39 °C, orientent au contraire vers une pneumonie. Chez le nouveau-né, toute détresse respiratoire fait aussi évoquer une infection bactérienne néonatale ou une insuffisance cardiaque.</p><div class="key"><b>À retenir.</b> Après désobstruction, quatre mesures suffisent à classer la gravité : état général, fréquence respiratoire sur une minute, signes de lutte et SpO₂. L’examen cherche aussi ce qui ne relève pas de la bronchiolite.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, niveaux de gravité et liste de contrôle</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.6, 1.1.8 et 1.1.9</a>.</p><button class="pareto-btn ui" data-k="pareto-j21-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
