<template data-pop="j21-gravite" data-title="Degrés de gravité de la bronchiolite"><p>Deux grilles européennes récentes gradent la bronchiolite après désobstruction nasale, chez un enfant calme. Elles reposent sur les mêmes signes et diffèrent surtout par les seuils.</p><table class="t"><tr><th>Critère</th><th>SSPP 2020 : sévère si</th><th>Haute Autorité de santé 2019 : grave si</th></tr><tr><td>État général</td><td>Apathie</td><td>Altération, hypotonie, geignement</td></tr><tr><td>Fréquence respiratoire</td><td>Supérieure à 70/min</td><td>70/min ou plus, ou inférieure à 30/min, respiration superficielle, apnée</td></tr><tr><td>Fréquence cardiaque</td><td>Non retenue</td><td>Supérieure à 180 ou inférieure à 80/min</td></tr><tr><td>Signes de lutte</td><td>Tirage marqué</td><td>Mise en jeu intense des muscles accessoires</td></tr><tr><td>SpO₂ en air ambiant</td><td>Inférieure à 88 %</td><td>90 % ou moins, ou cyanose</td></tr><tr><td>Alimentation</td><td>Moins de 50 %, détresse en buvant</td><td>Réduction importante ou refus</td></tr></table><p class="lab">Lecture</p><p>Dans la grille française, la forme légère exige que tous les critères soient rassurants ; un seul critère grave suffit à classer l’épisode comme grave. La forme modérée y correspond à une fréquence de 60 à 69 par minute, une SpO₂ entre 90 et 92 %, ou moins de 50 % des apports sur trois repas consécutifs.</p><div class="key"><b>Limite.</b> Ces grilles orientent ; elles ne remplacent pas le jugement clinique ni la réévaluation, car l’état varie beaucoup pendant les premiers jours.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020, tableau 2</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, formes cliniques</a>.</p></template>
<template data-pop="j21-sspp" data-title="Recommandations suisses sur la bronchiolite"><p class="lab">Ce qui existe</p><p>Le groupe suisse de pneumologie pédiatrique (SAPP) a publié en 2003 des recommandations de traitement de la bronchiolite aiguë du nourrisson. En 2020, trois pneumopédiatres de la SSPP ont publié dans le Forum Médical Suisse une mise à jour critique, évaluée par les pairs, qui confirme la stratégie d’intervention minimale et actualise les seuils d’oxygène. La prévention relève des recommandations de l’OFSP et de la CFV, mises à jour en septembre 2026.</p><p class="lab">Arbitrage de ce cours</p><p>Lorsque les textes divergent, la source primaire applicable la plus récente l’emporte. Pour la prise en charge, ce cours retient la mise à jour suisse de 2020 et la recommandation britannique du NICE, révisée en 2021 ; la recommandation française de 2019 complète les points que les deux autres ne traitent pas. Pour la prévention, seul le texte suisse de 2026 fait foi.</p><div class="key"><b>Limite.</b> La mise à jour de 2020 est un article de revue et non une recommandation formelle gradée ; le texte de 2003 reste le dernier document national de ce type.</div><p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, Paediatrica 2003;14(6):18-22</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben, Regamey et Hammer, Forum Médical Suisse 2020;20(9-10):155-159</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026</a>.</p></template>
<template data-pop="j21-def-europe" data-title="Bronchiolite : définition européenne et américaine"><p>En Suisse, dans les recommandations britanniques et dans une grande partie de l’Europe centrale, la bronchiolite est une maladie virale saisonnière caractérisée par de la fièvre, une rhinorrhée et une toux sèche, avec des crépitants inspiratoires fins ou des sibilants expiratoires aigus. L’Australie retient la même définition en insistant sur l’âge inférieur à 12 mois, le premier épisode et les crépitants.</p><p class="lab">Conséquence</p><p>Pour les cliniciens américains, ce sont les sibilants, et non les crépitants, qui définissent la bronchiolite après une infection virale, et la définition n’est pas limitée au nourrisson. Les études américaines incluent donc des enfants sifflants jusqu’à 2 ans, chez qui l’Europe aurait diagnostiqué une bronchite obstructive. Un essai réalisé dans une telle population peut montrer un effet des bronchodilatateurs qui ne s’applique pas au nourrisson européen.</p><div class="key"><b>Limite.</b> La frontière entre bronchiolite du nourrisson et bronchite obstructive du petit enfant est continue.</div><p class="src">Référence : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020</a>.</p></template>
<template data-pop="j21-nice" data-title="Recommandation NICE NG9"><p>Recommandation britannique « Bronchiolitis in children: diagnosis and management », publiée le 1<sup>er</sup> juin 2015 et mise à jour le 9 août 2021. La révision de 2021 a abaissé à 90 % le seuil de saturation pour l’hospitalisation, l’oxygène et la sortie chez l’enfant de 6 semaines ou plus, en s’appuyant sur un essai randomisé ; elle a maintenu 92 % avant 6 semaines et en cas de maladie sous-jacente.</p><p class="lab">Place dans ce cours</p><p>Le NICE est britannique et non suisse. Il est utilisé parce qu’il est la recommandation européenne gradée la plus récente sur la prise en charge, et qu’il concorde avec la mise à jour suisse de 2020 sur les points essentiels.</p><div class="key"><b>Limite.</b> Chaque recommandation du NICE porte l’année de sa formulation : beaucoup datent de 2015 et n’ont pas été revues en 2021.</div><p class="src">Référence : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, version du 09.08.2021</a>.</p></template>
<template data-pop="j21-ers-def" data-title="Définitions ERS/ESCMID des infections respiratoires basses de l’adulte"><p>La recommandation conjointe de l’ERS et de l’ESCMID (2011) propose des définitions pragmatiques, conservées depuis 2005, conçues pour être simples en pratique au prix d’une certaine imprécision.</p><table class="t"><tr><th>Entité</th><th>Définition</th></tr><tr><td>Infection respiratoire basse</td><td>Maladie aiguë de 21 jours au plus, avec toux et au moins un autre symptôme respiratoire bas, sans autre explication</td></tr><tr><td>Bronchite aiguë</td><td>Même tableau chez un patient sans maladie pulmonaire chronique</td></tr><tr><td>Pneumonie suspectée</td><td>Toux et au moins un signe : signes focaux nouveaux, fièvre de plus de quatre jours, dyspnée ou tachypnée</td></tr><tr><td>Pneumonie certaine</td><td>Même tableau avec une opacité radiographique probablement nouvelle ; chez la personne âgée, opacité et maladie aiguë sans autre cause</td></tr></table><p>Ces cadres ne s’excluent pas : « infection respiratoire basse » est le terme générique, employé aussi pour les cas inclassables.</p><div class="key"><b>Conséquence.</b> Le terme désigne une étape du raisonnement, non un diagnostic final : il oblige à chercher la pneumonie et les exacerbations.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., Clin Microbiol Infect 2011, définitions</a>.</p></template>
<template data-pop="j21-epi-ch" data-title="Données suisses sur le VRS"><p class="lab">Hospitalisations du nourrisson (OFSP 2026)</p><p>De 2014-2015 à 2019-2020, le taux annuel moyen d’hospitalisation pour VRS avant 1 an était de 2410 pour 100 000 (intervalle de confiance à 95 % : 2084 à 2760), soit 2,4 % des nourrissons. Il a atteint 3,7 % en 2022-2023. Environ 56 % de toutes les hospitalisations pour VRS concernent des nourrissons. Avant la pandémie, 6,4 % des nourrissons infectés pendant leur deuxième mois étaient hospitalisés, et 10,7 % en 2022-2023. La létalité moyenne est de 0,012 %.</p><p class="lab">Registre hospitalier 2003-2021</p><p>Les hospitalisations ont augmenté selon un rythme bisannuel jusqu’à 3575 en 2018-2019, puis 2487 en 2019-2020 et 902 en 2020-2021. Les deux tiers concernaient des nourrissons, d’âge moyen 118 jours ; les adultes hospitalisés avaient 74 ans en moyenne. Au total, 7,2 % des patients sont passés en soins intensifs, et 90,8 % des nourrissons hospitalisés étaient nés après 35 semaines sans dysplasie bronchopulmonaire ni cardiopathie congénitale.</p><p class="lab">Saisonnalité</p><p>Pendant la pandémie, l’épidémie s’est déplacée en été 2021, avant de revenir en hiver dès 2022, comme l’a observé l’hôpital du Jura à Delémont.</p><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.3</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39328156/" target="_blank" rel="noopener">Stucki et al., Euro Surveill 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39137355/" target="_blank" rel="noopener">étude de l’hôpital du Jura, Swiss Med Wkly 2024</a>.</p></template>
<template data-pop="j21-wheezing-long" data-title="Bronchiolite, sifflements récidivants et asthme"><p>Plusieurs études associent une bronchiolite sévère du nourrisson à un risque accru d’asthme et de sifflements récidivants pendant l’enfance. La bronchiolite à VRS est modestement associée aux sifflements récidivants ou à l’asthme à l’âge scolaire (rapports de cotes de 2,5 à 4,3), sans association avec l’atopie. Un premier épisode sifflant sévère à rhinovirus avant 2 ans est, lui, associé à l’asthme atopique scolaire (rapport de cotes de 5,0).</p><p class="lab">Association ou causalité</p><p>L’association ne prouve pas que le virus cause l’asthme : une prédisposition commune peut expliquer les deux. Les essais d’immunoprophylaxie chez le prématuré, qui réduisent les sifflements récidivants, plaident pour une part causale du VRS.</p><div class="key"><b>Conséquence.</b> Les corticoïdes inhalés ne sont pas recommandés pour prévenir l’asthme après une bronchiolite, ni les antileucotriènes pour prévenir les récidives.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30276826/" target="_blank" rel="noopener">Jartti et al., groupe de travail EAACI, Allergy 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.1</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>
<template data-pop="j21-adulte-vrs" data-title="Le VRS chez l’adulte"><p class="lab">Clinique</p><p>L’adulte âgé infecté présente d’abord une infection des voies respiratoires supérieures de deux à quatre jours. Une toux sèche initiale touche environ 90 % des malades et près de la moitié ont une fièvre supérieure à 38 °C, moins souvent à un âge avancé. Les sibilants sont plus fréquents qu’avec la grippe, même sans maladie obstructive préexistante.</p><p class="lab">Gravité</p><p>Chez l’adulte de 65 ans ou plus, une infection conduit à l’hospitalisation dans 4 à 17 % des cas ; 26 % des hospitalisés passent en soins intensifs, et la mortalité hospitalière atteint 8 %. Dans les pays à revenu élevé, une revue estime à plus de 5 millions les infections respiratoires aiguës à VRS par an après 60 ans, avec 470 000 hospitalisations et 33 000 décès hospitaliers.</p><p class="lab">Sous-diagnostic</p><p>Le VRS est rarement recherché chez l’adulte, la charge virale est faible et l’excrétion courte. Les consultations et hospitalisations liées au VRS seraient sous-diagnostiquées d’un facteur 1,5 à plus de 20 ; beaucoup sont enregistrées comme infections respiratoires basses non précisées ou comme décompensations de maladies chroniques.</p><p class="src">Référence : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitres 4.1 et 4.3.3, tableau 4</a>.</p></template>
<template data-pop="j21-ns2" data-title="Protéine NS2 et desquamation épithéliale"><p class="lab">Observation</p><p>Les cellules ciliées infectées par le VRS prennent une forme arrondie et sont expulsées de l’épithélium. Des virus mutants privés de gènes viraux ont montré que cette morphologie dépend d’un seul gène, celui de la protéine non structurale 2 ; un autre virus modifié pour exprimer NS2 reproduit le même aspect.</p><p class="lab">Conséquence</p><p>Les cellules desquamées s’accumulent dans la lumière étroite des bronchioles, avec des débris nécrotiques puis de nombreux neutrophiles. Cette accumulation obstrue les voies aériennes distales, d’autant plus facilement que leur calibre est petit, et la perte de clairance mécanique favorise l’extension de l’infection.</p><div class="key"><b>Limite.</b> Une partie de ces données provient de modèles animaux et de cultures cellulaires ; chez le nourrisson, elles concordent avec les observations anatomopathologiques.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/25302625/" target="_blank" rel="noopener">Pickles et al., J Pathol 2015</a>.</p></template>
<template data-pop="j21-diametre" data-title="Calibre des bronchioles et ventilation collatérale"><p>Le diamètre moyen d’une bronchiole respiratoire est d’environ 250 µm chez l’adulte et 120 µm chez le nourrisson de 2 à 4 mois. Une desquamation de même importance occupe donc une bien plus grande part de la lumière du nourrisson.</p><p class="lab">Ventilation collatérale</p><p>Chez l’adulte, la ventilation collatérale des régions alvéolaires permet de ventiler une zone dont la bronchiole est obstruée. Elle est peu développée chez le nourrisson, si bien que chaque obstruction retentit directement sur sa région.</p><div class="key"><b>Conséquence.</b> L’immaturité immunitaire, l’absence fréquente d’anticorps maternels protecteurs et ces dimensions expliquent ensemble que les formes graves se concentrent chez le très jeune nourrisson.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/25302625/" target="_blank" rel="noopener">Pickles et al., J Pathol 2015</a>.</p></template>
<template data-pop="j21-atelectasie" data-title="Du piégeage à l’hypoxémie"><p>L’obstruction bronchiolaire réduit la capacité d’expiration. Il en résulte un piégeage gazeux, une hyperexpansion pulmonaire, une accélération respiratoire et une dégradation rapide de la fonction respiratoire.</p><p class="lab">Atélectasie de résorption</p><p>L’air piégé derrière une obstruction complète est résorbé : des micro-atélectasies et des atélectasies sous-segmentaires apparaissent. Les régions perfusées mais mal ventilées créent un déséquilibre ventilation-perfusion et un shunt intrapulmonaire, qui aggravent l’hypoxémie.</p><p class="lab">Extension alvéolaire</p><p>Le virus peut aussi atteindre les alvéoles, directement ou par extension de l’inflammation bronchiolaire : œdème et lésions alvéolaires gênent alors les échanges gazeux, jusqu’à l’insuffisance respiratoire.</p><div class="key"><b>Conséquence clinique.</b> Les opacités radiographiques de la bronchiolite correspondent souvent à ces atélectasies et non à une surinfection.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25302625/" target="_blank" rel="noopener">Pickles et al., J Pathol 2015</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020, tableau 5</a>.</p></template>
<template data-pop="j21-apnee" data-title="Apnées du jeune nourrisson"><p class="lab">Terrain</p><p>Le jeune nourrisson, surtout avant 6 semaines, peut présenter une apnée sans autre signe clinique ; la prématurité accroît ce risque. L’âge inférieur à 2 mois, en âge corrigé, figure parmi les critères de vulnérabilité pour cette raison.</p><p class="lab">Conduite</p><p>Une apnée observée ou rapportée impose l’hospitalisation et, si elle se répète, fait discuter les soins intensifs. Le NICE recommande d’aspirer les voies aériennes supérieures d’un nourrisson qui présente une apnée, même sans sécrétions visibles. La surveillance continue de la saturation est indiquée avant 2 mois. La caféine n’est pas recommandée dans la bronchiolite compliquée d’apnées (Haute Autorité de santé, grade C).</p><div class="key"><b>Piège.</b> Un nourrisson de 4 semaines amené pour un « malaise » en hiver peut être au début d’une bronchiolite sans toux ni tirage.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.5, 1.3.2 et 1.4.8</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>
<template data-pop="j21-virus" data-title="Virus de la bronchiolite"><table class="t"><tr><th>Virus</th><th>Part avant 12 mois</th></tr><tr><td>Virus respiratoire syncytial</td><td>60 à 80 %</td></tr><tr><td>Rhinovirus</td><td>14 à 30 %</td></tr><tr><td>Bocavirus humain</td><td>14 à 15 %</td></tr><tr><td>Métapneumovirus humain</td><td>3 à 12 %</td></tr><tr><td>Entérovirus, adénovirus, coronavirus, virus de la grippe</td><td>1 à 8 %</td></tr></table><p>Plusieurs virus sont retrouvés ensemble chez 20 à 30 % des enfants, sans gravité supplémentaire démontrée. Le VRS comporte deux sous-groupes, A et B, cliniquement proches.</p><p class="lab">Deux profils</p><p>Le groupe de travail de l’EAACI distingue la bronchiolite à VRS, du nourrisson jeune, dominée par l’obstruction mécanique par mucus et débris cellulaires, et le premier épisode sifflant à rhinovirus, de l’enfant plus âgé, associé à une prédisposition atopique et à un risque élevé d’asthme ultérieur.</p><div class="key"><b>Conséquence.</b> Un premier épisode sifflant chez un enfant de 18 mois atopique n’a pas le même pronostic ni la même réponse thérapeutique qu’une bronchiolite à VRS d’un nourrisson de 2 mois.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30276826/" target="_blank" rel="noopener">Jartti et al., Allergy 2019</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>
<template data-pop="j21-facteurs-risque" data-title="Facteurs de risque de bronchiolite grave"><p class="lab">Listes des recommandations</p><p>Le NICE retient la maladie pulmonaire chronique, dont la dysplasie bronchopulmonaire, la cardiopathie congénitale à retentissement hémodynamique, l’âge inférieur à 3 mois, la prématurité surtout avant 32 semaines, les maladies neuromusculaires et le déficit immunitaire. La Haute Autorité de santé y ajoute la prématurité avant 36 semaines d’aménorrhée, l’âge inférieur à 2 mois, une ventilation néonatale prolongée, le polyhandicap et la trisomie 21.</p><p class="lab">Données suisses</p><p>Dans le registre suisse, la naissance entre octobre et mars, le faible poids de naissance, la naissance multiple, les malformations du cœur, des gros vaisseaux, des poumons, des voies aériennes ou biliaires, une maladie hépatique, l’hémophilie, la trisomie 21, un déficit immunitaire, une maladie neurologique centrale, cardiaque ou pulmonaire, la mucoviscidose, l’insuffisance rénale et une carence sévère en vitamine D sont associés à l’hospitalisation.</p><div class="key"><b>Conséquence.</b> Plus de 80 % des nourrissons hospitalisés n’ont aucun de ces facteurs : leur absence ne rassure pas, et elle ne dispense pas d’immuniser l’enfant.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.2.3</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.1</a>.</p></template>
<template data-pop="j21-environnement" data-title="Facteurs d’environnement"><p>La Haute Autorité de santé (2019) retient des critères d’environnement qui imposent une vigilance accrue, avec leur niveau de preuve.</p><table class="t"><tr><th>Facteur</th><th>Grade</th></tr><tr><td>Tabagisme passif : recours aux soins accru</td><td>A</td></tr><tr><td>Chez le prématuré de moins de 35 semaines : tabagisme pendant la grossesse, crèche, absence d’allaitement maternel</td><td>A</td></tr><tr><td>Naissance autour de l’épidémie à VRS</td><td>B</td></tr><tr><td>Fratrie</td><td>C</td></tr><tr><td>Contexte social défavorable, difficulté d’accès aux soins</td><td>C</td></tr></table><p>Le début des signes de lutte ou de la toux depuis moins de 48 heures compte aussi, car l’aggravation survient surtout pendant cette période.</p><div class="key"><b>Conséquence.</b> La protection stricte contre la fumée fait partie des conseils donnés aux parents.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, critères environnementaux</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 4</a>.</p></template>
<template data-pop="j21-evolution" data-title="Chronologie de la bronchiolite"><p class="lab">Phase de début</p><p>Un prodrome rhinitique d’un à trois jours précède la toux persistante, la tachypnée ou le tirage. Les difficultés alimentaires apparaissent typiquement entre le troisième et le cinquième jour.</p><p class="lab">Phase d’état</p><p>Les symptômes culminent entre le troisième et le cinquième jour ; tout nourrisson peut s’aggraver pendant les 48 premières heures de gêne respiratoire. La phase aiguë dure en moyenne dix jours.</p><p class="lab">Résolution</p><p>La toux disparaît chez 90 % des nourrissons en trois semaines ; une toux légère isolée peut persister jusqu’à quatre semaines. Au-delà, des signes quotidiens imposent un avis spécialisé.</p><div class="key"><b>Conséquence.</b> Les parents sont prévenus que la toux durera plusieurs semaines, ce qui évite des consultations et des prescriptions inutiles.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.2 à 1.1.4</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>
<template data-pop="j21-alimentation" data-title="Alimentation et déshydratation"><p class="lab">Mesure</p><p>Les apports se comparent aux apports habituels du nourrisson (allaitement, biberons, diversification). La Haute Autorité de santé classe en forme modérée une prise inférieure à 50 % sur trois repas consécutifs ; le NICE propose d’adresser ou d’hospitaliser l’enfant dont les apports tombent à 50 à 75 % de l’habituel, selon le terrain. Une diurèse diminuée et une perte de poids signalent une déshydratation débutante.</p><p class="lab">Conduite</p><p>Les repas sont fractionnés, plus fréquents et plus petits (grade A). L’allaitement maternel est poursuivi ; si l’enfant tète mal, la mère tire son lait. La mise à jour suisse conseille de surélever la tête après le repas pour limiter le reflux ; pour le sommeil, la Haute Autorité de santé rappelle le couchage sur le dos, à plat, et ne recommande pas la position proclive.</p><div class="key"><b>Conséquence.</b> L’alimentation insuffisante est le critère le plus fréquent d’hospitalisation ; elle se traite par sonde gastrique avant toute perfusion.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, support nutritionnel et positionnement</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.2.2 et 1.3.5</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003, tableau 2</a>.</p></template>
<template data-pop="j21-desobstruction" data-title="Désobstruction nasale"><p class="lab">Pourquoi</p><p>La désobstruction des voies aériennes supérieures améliore la respiration du nourrisson ; elle se fait avant l’évaluation de la gravité et la mesure de la SpO₂, car un nez encombré fausse les deux. L’hypoxémie s’améliore souvent déjà après une toilette nasopharyngée.</p><p class="lab">Comment</p><p>La mise à jour suisse de 2020 recommande des lavages au sérum physiologique (NaCl 0,9 %) et une aspiration régulière, superficielle à l’hôpital. La Haute Autorité de santé (2019) ne trouve aucune technique supérieure et déconseille les aspirations nasopharyngées profondes, plus souvent mal tolérées. Le NICE (2015) ne recommande pas l’aspiration systématique, mais la propose en cas de détresse ou de difficulté alimentaire due aux sécrétions, et l’impose en cas d’apnée.</p><p class="lab">Arbitrage</p><p>Le texte applicable le plus récent est la mise à jour suisse de 2020 : lavage au sérum physiologique et aspiration superficielle, adaptée à l’encombrement, sans aspiration profonde systématique.</p><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., Forum Médical Suisse 2020, tableaux 4 et 5</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.4.6 à 1.4.8</a>.</p></template>
<template data-pop="j21-fr" data-title="Fréquence respiratoire"><p class="lab">Technique</p><p>La fréquence se compte sur une minute entière, chez un enfant calme et désobstrué, et se note dans le dossier pour suivre l’évolution.</p><p class="lab">Seuils</p><table class="t"><tr><th>Source</th><th>Seuils</th></tr><tr><td>SSPP 2020</td><td>Légère sous 60/min ; modérée à 60/min ou plus ; sévère au-delà de 70/min</td></tr><tr><td>Haute Autorité de santé 2019</td><td>Modérée de 60 à 69/min ; grave à 70/min ou plus, ou sous 30/min</td></tr><tr><td>NICE 2015</td><td>Envisager l’hôpital au-delà de 60/min ; adresser en urgence au-delà de 70/min avec détresse sévère</td></tr></table><div class="key"><b>Piège.</b> Une fréquence inférieure à 30 par minute, ou une respiration superficielle, chez un nourrisson en détresse traduit l’épuisement : c’est un critère de gravité, non un signe rassurant.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 2</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.2.1 et 1.2.2</a>.</p></template>
<template data-pop="j21-oxymetrie" data-title="Oxymétrie de pouls chez le nourrisson"><p class="lab">Indication</p><p>La SpO₂ se mesure chez tout nourrisson suspect de bronchiolite, y compris au cabinet si un oxymètre pédiatrique est disponible. L’opérateur doit être formé à son emploi chez le nourrisson ; un appareil avec courbe de pouls permet de reconnaître les artefacts.</p><p class="lab">Pièges</p><p>Un capteur mal placé fausse la valeur. Certains appareils surestiment ou sous-estiment la saturation lorsqu’elle est proche des seuils, et une surestimation a été rapportée chez les personnes à peau foncée. La saturation fluctue au début de la maladie : elle se mesure à plusieurs reprises, et des chutes brèves sous 90 % n’imposent pas d’oxygène à elles seules.</p><p class="lab">Surveillance continue</p><p>Elle est indiquée dans les formes graves, sous oxygène, avant 2 mois et dans les formes modérées hospitalisées pendant au moins 24 heures ; elle n’est pas systématique chez l’enfant hospitalisé sans oxygène.</p><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.8 et 1.1.9</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, surveillance des besoins en oxygène</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a>.</p></template>
<template data-pop="j21-tirage" data-title="Signes de lutte respiratoire"><p class="lab">Définition</p><p>Les signes de lutte traduisent la mise en jeu des muscles respiratoires accessoires : tirage intercostal inférieur, contraction des sterno-cléido-mastoïdiens, balancement thoraco-abdominal et battement des ailes du nez. Le geignement est un signe de détresse sévère.</p><p class="lab">Valeur</p><p>Un tirage absent ou léger correspond à une forme légère, un tirage modéré à une forme modérée, une lutte intense à une forme grave. Un tirage marqué ou un geignement impose un transfert urgent.</p><div class="key"><b>Conséquence.</b> L’intensité des signes de lutte se réévalue après désobstruction et au cours de la journée, car elle varie avec l’encombrement nasal et la fatigue.</div><p class="src">Références : <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, liste de contrôle</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.2.1</a>.</p></template>
<template data-pop="j21-crepitants" data-title="Crépitants de la bronchiolite"><p class="lab">Mécanisme</p><p>Les crépitants fins naissent de la réouverture des plus petites voies aériennes pendant la fin de l’inspiration. La mise à jour suisse les tient pour pathognomoniques de la bronchiolite, et leur présence est corrélée à la gravité clinique.</p><p class="lab">Valeur selon l’âge</p><p>Chez les plus jeunes nourrissons, des crépitants inspiratoires fins peuvent être la seule anomalie auscultatoire ; les sibilants expiratoires aigus dominent chez l’enfant plus âgé.</p><div class="key"><b>Piège.</b> Des crépitants localisés et persistants, surtout avec une fièvre supérieure à 39 °C, évoquent une pneumonie plutôt qu’une bronchiolite.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24694087/" target="_blank" rel="noopener">Øymar et al., 2014</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.6</a>.</p></template>
<template data-pop="j21-sibilants" data-title="Sibilants : signification selon l’âge"><p>Les sibilants expiratoires aigus sont fréquents dans la bronchiolite, surtout chez le nourrisson plus âgé. Ils définissent à eux seuls la bronchiolite dans la définition américaine, mais non dans la définition européenne, qui exige le contexte du nourrisson et retient aussi les crépitants.</p><p class="lab">Quand penser à autre chose</p><p>Des sibilants persistants sans crépitants, des épisodes récidivants ou une atopie personnelle ou familiale orientent vers des sifflements viraux ou un asthme du jeune enfant, surtout après 1 an. Le premier épisode sifflant à rhinovirus s’observe chez un enfant plus âgé et prédisposé à l’atopie.</p><div class="key"><b>Conséquence.</b> Un bronchodilatateur se discute chez l’enfant plus âgé dont le tableau évoque une bronchite obstructive, jamais en routine chez le nourrisson atteint de bronchiolite.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.7</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020, tableau 5</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30276826/" target="_blank" rel="noopener">Jartti et al., 2019</a>.</p></template>
<template data-pop="j21-bio" data-title="Biologie sanguine dans la bronchiolite"><p class="lab">Position</p><p>Les examens sanguins ne sont pas recommandés de façon systématique, même chez le nourrisson fébrile. Ils se discutent dans les formes graves à l’hôpital.</p><p class="lab">Performances</p><p>Selon les recommandations suisses de 2003, une leucocytose supérieure à 15 000/µL a une sensibilité et une spécificité d’environ 50 % pour distinguer une pneumonie bactérienne ; une CRP supérieure à 80 mg/L a une spécificité de 90 % mais une sensibilité de 35 %. La grippe et l’adénovirus peuvent élever la CRP. La surinfection bactérienne se suspecte d’abord sur la clinique : fièvre élevée persistante, dégradation de l’état général, aspect septique.</p><p class="lab">Ionogramme et gazométrie</p><p>Ils évaluent les décompensations respiratoires ou métaboliques et la natrémie dans les formes graves hospitalisées.</p><p class="src">Références : <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, Paediatrica 2003</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.3.6</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a>.</p></template>
<template data-pop="j21-radio" data-title="Radiographie thoracique dans la bronchiolite"><p class="lab">Position</p><p>La radiographie n’est pas recommandée de façon systématique, même chez l’enfant fébrile, ni chez le nourrisson qui n’est pas hospitalisé. Elle se discute dans les formes les plus graves, lorsque les soins intensifs sont envisagés, ou pour un diagnostic différentiel.</p><p class="lab">Pourquoi elle égare</p><p>Les infiltrats et opacités sont fréquents dans l’infection à VRS et correspondent souvent à des atélectasies. Ils imitent une pneumonie et ne doivent pas servir à décider d’un antibiotique. La liste suisse « smarter medicine » de pédiatrie (2024) déconseille la radiographie de routine : elle n’améliore pas la prise en charge, expose aux rayons et multiplie les diagnostics erronés de pneumonie bactérienne.</p><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.3.7 et 1.3.8</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://www.smartermedicine.ch/de/top-5-listen/paediatrie-2024" target="_blank" rel="noopener">Pédiatrie Suisse, liste Top 5 2024, recommandation 5</a>.</p></template>
<template data-pop="j21-virologie" data-title="Recherche virale"><p class="lab">Examen de référence</p><p>L’amplification génique sur prélèvement respiratoire est l’examen de référence du VRS ; elle existe en panel multiplex avec la grippe et le SARS-CoV-2. Des tests antigéniques rapides existent ; la sérologie, qui exige des sérums appariés, et la culture, qui demande plusieurs jours, n’ont pas de place en routine.</p><p class="lab">Indications utiles</p><p>La recherche virale ne pose pas le diagnostic de bronchiolite et n’est pas systématique. Elle aide à regrouper les nourrissons infectés à l’hôpital pour limiter la transmission nosocomiale, ce à quoi une hygiène rigoureuse peut suppléer. Chez le nouveau-né fébrile, l’identification d’un virus peut limiter les examens. En période épidémique, la recherche de la grippe peut conduire à un antiviral. Dans un tableau atypique, la recherche d’autres virus renforce le diagnostic.</p><div class="key"><b>Remarque.</b> Le nirsévimab n’interfère pas avec les tests par amplification génique ni avec les tests antigéniques rapides.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/BPXrATSRdad7/Bulletin-2026-Recommandations-VRS.pdf" target="_blank" rel="noopener">OFSP et CFV, mise à jour 2026, chapitre 4.2</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Beyfortus®, 07.2026</a>.</p></template>
<template data-pop="j21-pneumonie-diff" data-title="Suspecter une pneumonie"><p class="lab">Chez l’enfant</p><p>Le NICE fait envisager une pneumonie devant une fièvre supérieure à 39 °C ou des crépitants localisés persistants. Numération, CRP et radiographie distinguent mal la pneumonie bactérienne de la bronchiolite : la décision repose d’abord sur la clinique.</p><p class="lab">Chez l’adulte</p><p>La recommandation ERS/ESCMID suspecte une pneumonie devant des signes auscultatoires focaux nouveaux, une dyspnée, une tachypnée, un pouls supérieur à 100 par minute ou une fièvre de plus de quatre jours. Une CRP inférieure à 20 mg/L après plus de 24 heures de symptômes rend le diagnostic très improbable ; supérieure à 100 mg/L, elle le rend probable.</p><div class="key"><b>Conséquence.</b> La pneumonie suspectée ou certaine justifie un antibiotique ; l’infection respiratoire basse sans pneumonie, non.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.6</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7128977/" target="_blank" rel="noopener">Woodhead et al., ERS/ESCMID 2011</a>.</p></template>
<template data-pop="j21-asthme-diff" data-title="Sifflements viraux et asthme du jeune enfant"><p>Le NICE fait penser à des sifflements viraux ou à un asthme précoce plutôt qu’à une bronchiolite chez le nourrisson plus âgé ou le jeune enfant qui présente des sibilants persistants sans crépitants, des épisodes sifflants récidivants ou une atopie personnelle ou familiale. Ces tableaux sont inhabituels avant 1 an.</p><p class="lab">Point de vue suisse</p><p>La bronchiolite est en principe la première manifestation d’une maladie obstructive du nourrisson et peut parfois récidiver. Lorsque les épisodes se répètent et que la bronchoconstriction domine, un asthme du petit enfant est à envisager, surtout en cas d’atopie ou d’antécédents familiaux. La Haute Autorité de santé demande, devant un deuxième épisode rapproché avant 12 mois, d’envisager d’autres diagnostics.</p><div class="key"><b>Conséquence.</b> L’enfant qui siffle à répétition relève de la démarche diagnostique et thérapeutique de l’asthme, où le bronchodilatateur a sa place.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandation 1.1.7</a> ; <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019, définitions</a>.</p></template>
<template data-pop="j21-mucoviscidose" data-title="Diagnostics à évoquer devant des épisodes répétés"><p>Devant une bronchiolite récidivante ou atypique, la mise à jour suisse énumère les diagnostics différentiels suivants : asthme du petit enfant, surtout en cas d’atopie ou d’antécédents familiaux ; mucoviscidose ; dyskinésie ciliaire primitive ; fausses routes récidivantes ; anomalies cardiaques ; anomalies trachéales ou bronchiques congénitales rares.</p><p class="lab">Mucoviscidose</p><p>Le dépistage néonatal ne détecte pas environ 5 % des cas. Un dépistage normal n’exclut donc pas la maladie chez un nourrisson aux épisodes répétés.</p><div class="key"><b>Conséquence.</b> La répétition des épisodes, plus que leur intensité, conduit au bilan spécialisé.</div><p class="src">Références : <a href="https://doi.org/10.4414/fms.2020.08460" target="_blank" rel="noopener">Barben et al., 2020</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003</a>.</p></template>
<template data-pop="j21-reanimation" data-title="Insuffisance respiratoire et soins intensifs"><p class="lab">Insuffisance imminente</p><p>Le NICE retient trois signes : épuisement (léthargie, effort respiratoire qui diminue), apnées récidivantes, saturation qui ne se maintient pas malgré l’oxygène. Il propose une gazométrie capillaire si la détresse s’aggrave sous plus de 50 % d’oxygène ou si l’insuffisance menace, et une pression positive continue.</p><p class="lab">Critères de soins intensifs</p><p>La Haute Autorité de santé retient les apnées, l’épuisement apprécié sur la clinique, une capnie supérieure à 46-50 mmHg et un pH inférieur à 7,34, ainsi qu’une augmentation rapide des besoins en oxygène. Le transport est médicalisé ; avant 2 mois, il est confié de préférence à une équipe néonatale ou pédiatrique, avec surveillance continue de la respiration.</p><div class="key"><b>Nuance.</b> Selon les recommandations suisses de 2003, la décision de ventiler dépend de la situation clinique d’ensemble et non d’une valeur isolée de gaz du sang.</div><p class="src">Références : <a href="https://www.nice.org.uk/guidance/ng9/chapter/Recommendations" target="_blank" rel="noopener">NICE NG9, recommandations 1.1.10, 1.4.5 et 1.4.10</a> ; <a href="https://www.has-sante.fr/upload/docs/application/pdf/2019-11/hascnpp_bronchiolite_texte_recommandations_2019.pdf" target="_blank" rel="noopener">Haute Autorité de santé, 2019</a> ; <a href="https://files.paediatrieschweiz.ch/production/uploads/2021/09/18-22-1.pdf" target="_blank" rel="noopener">SAPP, 2003</a>.</p></template>
