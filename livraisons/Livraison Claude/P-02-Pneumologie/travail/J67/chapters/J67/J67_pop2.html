<template data-pop="j67-igg" data-title="IgG spécifiques sériques"><p class="lab">Principe</p><p>Le laboratoire mesure les IgG dirigées contre des antigènes choisis selon la source suspecte (oiseaux, agriculture, moisissures) ou contre un panel d’antigènes fréquents (poussières aviaires dont le duvet d’oie, moisissures, actinomycètes thermophiles). Les méthodes immunoenzymatiques ont remplacé l’immunodiffusion ; des systèmes automatisés quantifient le résultat.</p><p class="lab">Valeur</p><p>Chez un patient suspect, des IgG positives sont un prédicteur fort (rapport de cotes 5,3). Face aux autres PID, sensibilité 83 % et spécificité 68 % ; face aux exposés sains, 90 et 91 % ; face aux non-exposés sains, 93 et 100 %. Après l’éviction, les titres baissent souvent en six à douze mois, mais ne se normalisent que chez la moitié des patients.</p><p class="lab">Pièges</p><p>Il n’existe pas de seuil universel : chaque méthode et chaque antigène exigent des valeurs de référence d’une population témoin non exposée. 10 % des agriculteurs et 40 % des éleveurs d’oiseaux sains ont des IgG, sans valeur pronostique. Les fumeurs ont des titres plus bas ; les formes chroniques aussi. Une PHS « séronégative » existe lorsque l’antigène réel n’a pas été testé. Des IgG élevées contre tous les antigènes évoquent une réactivité croisée ou une activité de fond.</p><div class="key"><b>Erreur fréquente.</b> Conclure à une PHS sur la seule présence d’IgG chez un sujet exposé asymptomatique.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, IgG spécifiques et recommandation 3</a>.</p></template>
<template data-pop="j67-tdm" data-title="TDM en haute résolution dans la PHS"><p class="lab">Technique</p><p>Acquisition volumique sans injection, en fin d’inspiration, coupes de 1,5 mm au plus, reconstructions sagittales et coronales ; coupes en expiration ou en décubitus ventral si nécessaire ; protocole à faible dose pour le suivi. La radiographie thoracique ne suffit pas : elle est normale dans 20 % des formes aiguës et méconnaît une fibrose débutante.</p><p class="lab">Forme non fibrosante</p><p>Verre dépoli diffus ; nodules centrolobulaires flous de moins de 5 mm, correspondant à la bronchiolite ; condensations rares ; piégeage en mosaïque ; signe des trois densités ; kystes à paroi fine dans jusqu’à 13 % des cas. La TDM est normale dans environ 8 % des formes inflammatoires.</p><p class="lab">Forme fibrosante</p><p>Réticulations, bronchiectasies de traction, distorsion, parfois rayon de miel, souvent non prédominant ; distribution irrégulière, péribronchovasculaire chez 20 %, supérieure chez 10 %, épargne relative des culs-de-sac postérieurs chez 20 à 40 %. Un aspect UIP existe dans près de la moitié des PHS fibrosantes ; il devient alors « indéterminé » selon la grille de 2020, sauf si des signes bronchiolaires l’accompagnent.</p><div class="key"><b>Erreur fréquente.</b> Omettre les coupes en expiration, qui révèlent le piégeage.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Radiologie, tableaux 4 à 6</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, tableaux 5 et 6</a>.</p></template>
<template data-pop="j67-trois-densites" data-title="Signe des trois densités"><p>Sur les coupes inspiratoires, trois densités coexistent, nettement délimitées : du verre dépoli, du poumon d’aspect normal et des lobules clairs aux vaisseaux grêles. Il traduit l’association d’un processus infiltrant et d’une obstruction bronchiolaire. Le comité international de 2020 a choisi ce terme pour remplacer l’ancienne comparaison culinaire.</p><p class="lab">Valeur</p><p>Spécificité supérieure à 90 % pour la PHS fibrosante, sensibilité un peu inférieure à 50 %. Il distingue le mieux la PHS fibrosante de la FPI, mais existe aussi dans la sarcoïdose et la pneumopathie interstitielle desquamative.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, tableau 4</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k</a>.</p></template>
<template data-pop="j67-lymphocytose" data-title="Lymphocytose du lavage broncho-alvéolaire"><p class="lab">Valeurs</p><p>Le LBA du non-fumeur sain contient 10 à 15 % de lymphocytes. La PHS présente les comptes cellulaires et les lymphocytoses les plus élevés des PID, souvent plus de 50 %. Dans une série, la forme aiguë non fibrosante comptait 46 % de lymphocytes (20 à 80 %) contre 19 % (11 à 41 %) dans la forme chronique fibrosante.</p><p class="lab">Seuils face à la FPI</p><table class="t"><tr><th>Seuil</th><th>Sensibilité</th><th>Spécificité</th></tr><tr><td>20 %</td><td>69 %</td><td>61 %</td></tr><tr><td>30 %</td><td>55 %</td><td>80 %</td></tr><tr><td>40 %</td><td>41 %</td><td>93 %</td></tr></table><p>Le tableau montre qu’élever le seuil gagne en spécificité ce qu’il perd en sensibilité. La recommandation allemande retient plus de 30 % comme signal qui doit faire poursuivre l’enquête.</p><div class="key"><b>Piège.</b> Le rapport CD4/CD8 ne doit plus servir au diagnostic ; une lymphocytose s’observe aussi chez des exposés sains et dans la sarcoïdose.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, question 3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandation 5</a>.</p></template>
<template data-pop="j67-efr" data-title="Épreuves fonctionnelles respiratoires"><p class="lab">Interprétation</p><p>Le profil habituel est restrictif, avec DLCO basse et hypoxémie de repos ou d’effort ; l’ergospirométrie avec gradient alvéolo-artériel en oxygène est la plus sensible. Un trouble obstructif ou mixte est possible, notamment en cas d’emphysème. Jusqu’à 50 % des formes aiguës ont une hyperréactivité bronchique non spécifique, qui ne doit pas faire conclure à un asthme.</p><p class="lab">Usage</p><p>La fonction ne distingue pas la PHS des autres PID. Elle mesure le retentissement, vérifie l’efficacité de l’éviction et du traitement, dépiste une progression et étaye l’expertise de la capacité de travail ; elle est répétée tous les trois à six mois dans la forme chronique.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, Fonction pulmonaire</a>.</p></template>
<template data-pop="j67-biopsie" data-title="Biopsie pulmonaire"><p class="lab">Techniques</p><p>La biopsie transbronchique à la pince donne de petits fragments, souvent écrasés, et accède mal aux zones sous-pleurales. Dans une méta-analyse de la PHS, son rendement était de 37 %, contre 82 % pour la cryobiopsie transbronchique, au prix d’un peu plus de saignements et de pneumothorax. La cryobiopsie permet d’éviter la biopsie chirurgicale chez 82 à 91 % des patients.</p><p class="lab">Choix selon la recommandation allemande</p><p>Forme aiguë ou non fibrosante : biopsie à la pince ou cryobiopsie. Forme chronique fibrosante : cryobiopsie ; biopsie chirurgicale si la cryobiopsie a échoué ou est impossible. Le rendement de la biopsie chirurgicale atteignait 96 % dans l’analyse internationale.</p><div class="key"><b>Piège.</b> Devant des granulomes, une infection mycobactérienne ou fongique est exclue par colorations, cultures et amplification génique.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandation 6 et Histopathologie</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7397797/" target="_blank" rel="noopener">Raghu et al., 2020, questions 4 à 6</a>.</p></template>
<template data-pop="j67-provocation" data-title="Tests de provocation et d’éviction"><p class="lab">Provocation</p><p>Réexposition réelle au poste, provocation en laboratoire avec le matériau du patient (foin de l’exploitation) ou avec un extrait. Dans la plus grande série rétrospective, sensibilité 73 %, spécificité 84 %, valeur prédictive positive 94 %, négative 47 %. Un résultat positif est donc très probant ; un résultat négatif n’exclut rien. Sont tenus pour positifs une baisse de la CVF de plus de 16 %, une baisse de la SpO₂ de 3 % ou de la PaO₂ de 3 mmHg, et une élévation de la température de plus de 0,5 °C.</p><p class="lab">Indications</p><p>Le test n’est ni standardisé ni validé. Il se pratique seulement en hospitalisation, dans un centre expérimenté, lorsque la forme aiguë n’a pas pu être confirmée autrement, qu’une éviction coûteuse est en jeu ou pour une expertise. Il est déconseillé dans la forme chronique fibrosante.</p><p class="lab">Éviction</p><p>Le test d’éviction documente l’amélioration loin de la source ; si la source est évidente, la normalisation suffit sans réexposition.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k, recommandations 8 et 9</a>.</p></template>
<template data-pop="j67-d-cortico" data-title="Glucocorticoïdes : prednisone et prednisolone"><p class="lab">Mécanisme</p><p>Glucocorticoïdes à action anti-inflammatoire et immunosuppressive ; la prednisone est transformée en prednisolone, sa forme active, et la prednisolone est préférée en cas d’affection hépatique.</p><p class="lab">Preuves</p><p>Dans l’essai finlandais de 36 patients au premier accès de poumon de fermier, la prednisolone pendant huit semaines améliorait la DLCO à un mois, sans différence à cinq ans ; les récidives étaient numériquement plus fréquentes (6 contre 1, non significatif). Dans une série de 93 patients, douze semaines n’apportaient pas plus que quatre. Dans la cohorte de Louvain, la fonction s’améliorait sous corticoïdes dans la forme non fibrosante, mais pas dans la forme fibrosante.</p><p class="lab">Posologie</p><p>Forme aiguë sévère : 0,5 mg/kg ou 40 mg d’équivalent prednisolone par jour, décroissance sur deux à trois mois. Forme chronique inflammatoire : au plus 0,5 mg/kg, évaluation à quatre à six semaines, puis moins de 10 mg par jour pendant au moins six mois chez le répondeur. Au-delà de huit à dix jours, l’arrêt se fait par paliers.</p><p class="lab">Précautions</p><p>En traitement prolongé, l’information suisse cite comme contre-indications l’ulcère gastro-intestinal, l’ostéoporose sévère, le diabète de type 2, l’insuffisance rénale, l’hypertension sévère, les antécédents psychiatriques, l’herpès et le zona. Pendant la grossesse, prednisone ou prednisolone sont préférées ; l’allaitement est déconseillé pendant un traitement systémique. La PHS n’est pas nommée dans les indications suisses, qui couvrent les états allergiques graves.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/1731594/" target="_blank" rel="noopener">Kokkarinen et al., 1992</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/6861923/" target="_blank" rel="noopener">Mönkäre, 1983</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12215178/" target="_blank" rel="noopener">Koschel et al., S2k</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Prednisone Streuli®, Swissmedic (AIPS, mise à jour 06.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j67-d-aza" data-title="Azathioprine"><p class="lab">Mécanisme</p><p>Dérivé imidazolé de la 6-mercaptopurine ; son effet immunosuppresseur n’est pas élucidé et pourrait tenir à l’inhibition de la synthèse des acides nucléiques. Il permet de réduire la dose des corticoïdes associés.</p><p class="lab">Place et posologie</p><p>Hors indication suisse dans la PHS ; épargne cortisonique chez le répondeur selon la recommandation allemande, sur données rétrospectives. Dans les maladies autorisées autres que la transplantation, la dose initiale est de 1 à 3 mg/kg par jour, réduite par paliers de 0,5 mg/kg dès le bénéfice obtenu.</p><p class="lab">Toxicité et surveillance</p><p>Un déficit en TPMT expose à une aplasie médullaire rapide ; un variant de NUDT15 impose une réduction de dose. La formule sanguine est contrôlée chaque semaine pendant huit semaines, puis au moins tous les trois mois. Avec l’allopurinol, la dose est réduite au quart ; des décès ont été rapportés. Une contraception efficace est requise pendant le traitement et trois mois (hommes) ou six mois (femmes) après.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Imurek®, Swissmedic (AIPS, mise à jour 04.2026), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j67-d-mmf" data-title="Mycophénolate mofétil"><p class="lab">Mécanisme</p><p>Promédicament de l’acide mycophénolique, inhibiteur sélectif et réversible de l’inosine monophosphate déshydrogénase. Les lymphocytes B et T dépendent de la synthèse de novo des purines ; l’effet cytostatique est donc plus marqué sur eux que sur les autres cellules.</p><p class="lab">Place et posologie</p><p>Autorisé en Suisse en transplantation seulement : hors indication dans la PHS. Les sources lues ne donnent pas de dose propre à la PHS ; en transplantation rénale, la dose est de 1 g deux fois par jour.</p><p class="lab">Toxicité et surveillance</p><p>Tératogène : 23 à 27 % des naissances vivantes exposées présentent des malformations, contre environ 2 % dans la population générale ; contre-indiqué pendant la grossesse et chez la femme en âge de procréer sans contraception hautement efficace. Une neutropénie (moins de 1300 neutrophiles par microlitre) impose l’arrêt ou la réduction. La formule sanguine est contrôlée chaque semaine le premier mois, deux fois par mois les deuxième et troisième mois, puis mensuellement la première année.</p><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse CellCept®, Swissmedic (AIPS, mise à jour 09.2025), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j67-d-nintedanib" data-title="Nintédanib dans la PHS fibrosante"><p class="lab">Mécanisme</p><p>Inhibiteur des tyrosine kinases des récepteurs du facteur de croissance de l’endothélium vasculaire (VEGFR), des fibroblastes (FGFR) et des plaquettes (PDGFR α et β) ; il freine la prolifération et la migration des fibroblastes.</p><p class="lab">Preuves</p><p>L’essai INBUILD a randomisé 663 patients atteints de PID fibrosante progressive autre que la FPI, dont 26 % de PHS. Le déclin annuel de la CVF était de 80,8 mL sous nintédanib contre 187,8 mL sous placebo. Dans le sous-groupe des PHS, la différence de 73,1 mL par an (intervalle de confiance à 95 % de −8,6 à 154,8) n’était pas significative isolément ; l’effet ne différait pas d’un sous-groupe à l’autre, et l’essai n’était pas conçu pour les comparer.</p><p class="lab">Indication et posologie suisses</p><p>Adulte atteint de PID fibrosante chronique à phénotype progressif. 150 mg deux fois par jour au repas ; 100 mg deux fois par jour en cas d’effet indésirable ou d’insuffisance hépatique Child-Pugh A ; non recommandé en Child-Pugh B ou C.</p><p class="lab">Effets indésirables et surveillance</p><p>Diarrhée chez 66,9 % des patients d’INBUILD contre 23,9 % sous placebo, nausées, vomissements ; transaminases au-delà de trois fois la limite supérieure chez jusqu’à 7,8 % ; saignements, thromboses artérielles, perforations digestives rares. Bilan hépatique au début, régulièrement pendant trois mois, puis périodiquement. Contre-indiqué pendant la grossesse et en cas d’allergie à l’arachide ou au soja ; test de grossesse et contraception très efficace jusqu’à trois mois après la dernière dose. Les inhibiteurs puissants de la glycoprotéine P augmentent son exposition.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32145830/" target="_blank" rel="noopener">Wells et al., sous-groupes d’INBUILD, Lancet Respir Med 2020</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Ofev®, Swissmedic (AIPS, mise à jour 03.2025), consultée le 09.10.2026</a>.</p></template>
<template data-pop="j67-d-pirfenidone" data-title="Pirfénidone dans la PHS fibrosante"><p class="lab">Mécanisme</p><p>Mécanisme incomplètement élucidé : propriétés antifibrosantes et anti-inflammatoires, réduction de la prolifération des fibroblastes et de la matrice extracellulaire induite par le TGF-β et le facteur de croissance dérivé des plaquettes.</p><p class="lab">Preuves</p><p>L’essai allemand RELIEF a randomisé 127 patients atteints de quatre PID fibrosantes progressives autres que la FPI, dont près de la moitié de PHS. Il a été arrêté prématurément pour futilité liée au recrutement lent. Le déclin de la CVF en pourcentage de la valeur prédite était moindre sous pirfénidone (p = 0,043), avec une différence médiane de 1,69 point (intervalle de confiance à 95 % de −0,65 à 4,03).</p><p class="lab">Statut et posologie</p><p>Autorisée en Suisse dans la FPI seule : hors indication dans la PHS. La recommandation allemande la propose si le nintédanib est inefficace ou mal toléré. Titration : 267 mg trois fois par jour les jours 1 à 7, 534 mg les jours 8 à 14, puis 801 mg trois fois par jour, au repas.</p><p class="lab">Précautions</p><p>Contre-indiquée avec la fluvoxamine et en insuffisance hépatique ou rénale sévère. Bilan hépatique avant le traitement, mensuel pendant six mois, puis tous les trois mois. Photosensibilité : protection solaire quotidienne. Le tabac réduit l’exposition de moitié.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/33798455/" target="_blank" rel="noopener">Behr et al., RELIEF, Lancet Respir Med 2021</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Esbriet®, Swissmedic (AIPS, mise à jour 08.2022), consultée le 09.10.2026</a>.</p></template>
<template data-pop="pareto-j67-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j67-0,j67-1,j67-2,j67-3,j67-4,j67-5,j67-6"></p><ul><li>La PHS est une réaction immunitaire non IgE du poumon et des petites voies aériennes à un antigène inhalé, chez un sujet prédisposé.</li><li>Elle est aiguë ou chronique, puis fibrosante ou non ; la fibrose commande le pronostic.</li><li>Rare, elle touche surtout le non-fumeur ; oiseaux, duvet, foin moisi, humidificateurs et fluides de coupe dominent.</li><li>Les particules de moins de 5 µm gagnent la bronchiole : bronchiolite, alvéolite lymphocytaire, granulomes lâches, puis fibrose si l’exposition persiste.</li><li>La forme aiguë donne fièvre, toux et dyspnée trois à douze heures après l’exposition, et guérit en 24 à 48 heures après l’éviction.</li><li>La forme chronique donne une dyspnée lente ; l’antigène reste introuvable chez 30 à 50 % des formes fibrosantes.</li><li>Crépitants fins, couinements et désaturation d’effort orientent ; l’hippocratisme annonce un mauvais pronostic.</li></ul></template>
<template data-pop="pareto-j67-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="j67-7,j67-8"></p><ul><li>Le diagnostic associe exposition, TDM en haute résolution et lymphocytose du LBA ou histologie, discutés en équipe multidisciplinaire.</li><li>Dans la forme aiguë, cinq critères non invasifs suffisent ; dans la forme fibrosante, trois critères sur quatre sont exigés.</li><li>L’infection est exclue d’abord, puis l’ODTS ; la FPI est le principal différentiel de la forme fibrosante.</li><li>L’exacerbation aiguë, l’HTP et une baisse de la CVF d’au moins 10 % en six à douze mois signent la gravité.</li></ul></template>
<template data-pop="pareto-j67-trt" data-title="Pareto — Traitement, byssinose et prévention"><p class="ratio" data-cover="j67-9,j67-10,j67-11,j67-12"></p><ul><li>L’éviction vient toujours en premier.</li><li>La forme aiguë ou non fibrosante modérée à sévère reçoit 0,5 mg/kg ou 40 mg de prednisolone par jour, réduits sur deux à trois mois.</li><li>Dans la forme fibrosante, l’anti-inflammatoire exige une inflammation démontrée, le nintédanib une progression ; la transplantation est évaluée tôt.</li><li>La byssinose est l’oppression du premier jour de travail de l’ouvrier du coton, du lin ou du chanvre ; elle s’améliore partiellement à l’arrêt de l’exposition.</li><li>Le suivi clinique et fonctionnel a lieu tous les trois à six mois ; la prévention suit le principe STOP ; le masque ne remplace jamais l’éviction.</li><li>En Suisse, l’annexe 1 de l’OLAA couvre les affections respiratoires des poussières organiques.</li></ul></template>
<template data-pop="pareto-j67-crit" data-title="Pareto — Critères et paramètres"><p class="ratio" data-cover="j67-13"></p><ul><li>La forme aiguë exige exposition, accès quatre à huit heures après l’exposition, IgG, crépitants et TDM compatible ; LBA supérieur à 30 %, histologie, provocation ou éviction peuvent remplacer un critère.</li><li>La forme fibrosante exige trois critères sur quatre : exposition, IgG ou LBA supérieur à 30 %, TDM, histologie.</li><li>La byssinose de grade 3 associe le symptôme à un VEMS inférieur à 80 % de la valeur prédite.</li></ul></template>
<template data-pop="pareto-j67-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j67-e-1,j67-e-2,j67-e-3"></p><ul><li>Aucun examen isolé ne prouve la PHS ; la discussion multidisciplinaire tranche.</li><li>Les IgG prouvent l’exposition, non la maladie ; leurs seuils sont propres à chaque méthode.</li><li>La TDM avec coupes en expiration cherche nodules centrolobulaires, mosaïque, piégeage et trois densités ; un aspect UIP n’exclut pas une PHS.</li><li>Au LBA, plus de 30 % de lymphocytes oriente ; le rapport CD4/CD8 est inutile.</li><li>La cryobiopsie est préférée dans la forme fibrosante, où la provocation est déconseillée.</li></ul></template>
<template data-pop="pareto-j67-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j67-p-1,j67-p-2,j67-p-3,j67-p-4"></p><ul><li>Aucun médicament ne remplace l’éviction.</li><li>Les glucocorticoïdes traitent l’inflammation ; azathioprine ou mycophénolate assurent l’épargne, hors indication.</li><li>Le nintédanib, 150 mg deux fois par jour, est autorisé dans la fibrose progressive ; la pirfénidone est une deuxième ligne hors indication.</li><li>Avec l’allopurinol, l’azathioprine passe au quart de sa dose ; le mycophénolate est tératogène ; pirfénidone et fluvoxamine ne s’associent pas.</li><li>La surveillance cible la formule sanguine, le bilan hépatique, l’os et la glycémie selon la classe.</li></ul></template>
