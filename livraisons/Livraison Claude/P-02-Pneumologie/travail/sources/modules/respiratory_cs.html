<div class="rcs-intro"><p>Le parcours suit l’examen complet d’un adulte. Vous évaluez d’abord la gravité, puis les constantes, les mains et le cou. Vous examinez ensuite le thorax dans l’ordre inspection, palpation, percussion et auscultation. Vous regroupez enfin les signes en syndromes et vous présentez une synthèse. Un patient en détresse reçoit d’abord oxygène, surveillance et aide ; l’examen complet attend.</p><p>Les schémas 3D projettent les lobes, les scissures et les culs-de-sac pleuraux sur la paroi. Vous pouvez les tourner, sélectionner un repère et lire la technique. La pratique supervisée au lit du patient reste indispensable pour apprendre le geste.</p></div>

<section class="rcs-atlas" aria-labelledby="rcs-atlas-title"><header><span class="rcs-eyebrow">Repères en fenêtres</span><h2 id="rcs-atlas-title">Explorer l’examen respiratoire en 3D</h2><p>Chaque fenêtre associe un modèle rotatif, des repères numérotés et une explication du geste. Les mêmes repères existent sous forme de boutons pour le clavier et les lecteurs d’écran.</p></header><div class="rcs-model-grid"><button type="button" data-rcs-model="lobes"><span aria-hidden="true">01</span><b>Lobes, scissures et culs-de-sac</b><small>Vous projetez chaque lobe sur la paroi, de face, de profil et de dos.</small></button><button type="button" data-rcs-model="auscultation"><span aria-hidden="true">02</span><b>Parcours d’auscultation</b><small>Vous comparez huit paires de sites symétriques, du sommet aux bases.</small></button><button type="button" data-rcs-model="airways"><span aria-hidden="true">03</span><b>Arbre respiratoire et bruits</b><small>Vous reliez stridor, sibilants, ronchi, crépitants et frottement à leur étage.</small></button><button type="button" data-rcs-model="muscles"><span aria-hidden="true">04</span><b>Travail respiratoire et ampliation</b><small>Vous reconnaissez tirage, Hoover, respiration paradoxale et ampliation.</small></button><button type="button" data-rcs-model="finger"><span aria-hidden="true">05</span><b>Hippocratisme digital</b><small>Vous mesurez l’angle de profil et le rapport de profondeur phalangienne.</small></button></div></section>

<section class="rcs-section" id="rcs-preparation" aria-labelledby="rcs-h-preparation"><h2 id="rcs-h-preparation"><span>1</span>Préparer un examen fiable</h2><p>Les signes respiratoires sont discrets et dépendent de l’installation. Un thorax habillé, un patient couché ou une pièce bruyante suffisent à masquer une matité ou des crépitants. Vous préparez donc le patient, la pièce et votre matériel avant de commencer.</p><h3>Installation, accord et matériel</h3><p>Vous confirmez l’identité, vous vous présentez et vous expliquez les gestes : regarder, palper, percuter et écouter. Vous recueillez l’accord et demandez si une position est douloureuse. Vous exposez le thorax entier en préservant l’intimité ; chez une femme, vous découvrez successivement l’avant et le dos. Vous réalisez l’hygiène des mains et réchauffez le pavillon du stéthoscope.</p><p>Le patient est assis au bord du lit, bras le long du corps pour l’avant. Pour le dos, il croise les bras devant lui : les omoplates s’écartent et libèrent la paroi. Un patient incapable de s’asseoir est tourné sur chaque côté. L’examen d’un patient couché sur le dos ne permet pas d’explorer les bases postérieures.</p><div class="rcs-key"><b>À retenir.</b> Un patient qui ne peut pas s’allonger ou qui doit rester penché en avant donne déjà une information : l’orthopnée et la position du trépied signalent une charge respiratoire élevée.</div></section>

<section class="rcs-section" id="rcs-general" aria-labelledby="rcs-h-general"><h2 id="rcs-h-general"><span>2</span>Reconnaître la détresse avant de toucher</h2><p>Les premières secondes répondent à une seule question : le patient tient-il seul ? Le travail respiratoire, la parole et la conscience y répondent plus vite que l’auscultation. Vous observez donc le patient entier depuis le pied du lit.</p><h3>Parole, posture et conscience</h3><p>Un patient qui parle en phrases complètes dispose d’une réserve ventilatoire. Un patient qui ne prononce que quelques mots entre deux inspirations est en difficulté. Un patient qui ne peut plus parler, boire ou s’allonger présente un critère de gravité dans la classification GINA de l’exacerbation d’asthme. La somnolence et la confusion traduisent une hypoxémie ou une hypercapnie cérébrale : elles annoncent l’épuisement.</p><button type="button" class="rcs-open" data-rcs-model="muscles">Ouvrir les signes de lutte en 3D</button><h3>Signes de lutte respiratoire</h3><p>Une inspiration forcée exige une pression pleurale très négative. Les muscles accessoires se recrutent et les parties molles sont aspirées. Les signes suivants traduisent ce mécanisme et se recherchent en quelques secondes.</p><div class="rcs-table-wrap"><table><thead><tr><th>Signe</th><th>Comment le voir</th><th>Mécanisme</th></tr></thead><tbody><tr><td>Recrutement des sterno-cléido-mastoïdiens et des scalènes</td><td>Contraction visible du cou à chaque inspiration.</td><td>Ces muscles soulèvent le thorax quand le diaphragme ne suffit pas.</td></tr><tr><td>Tirage sus-claviculaire, sus-sternal ou intercostal</td><td>Dépression inspiratoire des creux et des espaces.</td><td>La pression pleurale très négative aspire la paroi souple.</td></tr><tr><td>Battement des ailes du nez</td><td>Dilatation narinaire inspiratoire.</td><td>Le patient réduit la résistance des voies nasales.</td></tr><tr><td>Lèvres pincées</td><td>Expiration lente, lèvres serrées.</td><td>Le frein expiratoire maintient les petites bronches ouvertes.</td></tr><tr><td>Signe de Hoover</td><td>Les marges costales se rapprochent à l’inspiration.</td><td>Le diaphragme aplati tire les côtes basses vers l’intérieur.</td></tr><tr><td>Respiration paradoxale abdominale</td><td>L’abdomen se creuse à l’inspiration.</td><td>Le diaphragme faible ou épuisé est aspiré vers le thorax.</td></tr></tbody></table></div><p>Vous regardez d’abord la respiration abdominale, car son inversion est le signe le plus grave du tableau. Le piège est d’interpréter un tirage discret comme rassurant chez un patient somnolent : l’épuisement réduit les signes de lutte. Un patient asthmatique qui se tait, ne tire plus et somnole n’est pas amélioré ; il s’épuise.</p><div class="rcs-alert"><b>Priorité clinique.</b> Une fréquence respiratoire supérieure à 30 par minute, une SpO₂ inférieure à 92 % à l’air ambiant, une impossibilité de parler, une confusion, une cyanose, un thorax silencieux ou une respiration paradoxale imposent une prise en charge immédiate. Vous appelez de l’aide, donnez l’oxygène selon la cible et interrompez le parcours d’examen.</div><p>Le signe de Hoover a été étudié chez 268 patients hospitalisés pour dyspnée. Il était présent chez 76 % des patients atteints de BPCO et chez 3 % des patients en insuffisance cardiaque ; sa spécificité pour la BPCO atteignait 94 %. Il s’associe aussi à une dyspnée plus marquée et à davantage d’hospitalisations.</p><div class="rcs-key"><b>À retenir.</b> La gravité se lit sur la parole, la conscience et la mécanique respiratoire. L’auscultation précise ensuite la cause ; elle ne mesure pas la gravité.</div></section>

<section class="rcs-section" id="rcs-constantes" aria-labelledby="rcs-h-constantes"><h2 id="rcs-h-constantes"><span>3</span>Compter la fréquence respiratoire et lire la SpO₂</h2><p>La fréquence respiratoire est la constante la plus négligée et l’une des plus prédictives d’une dégradation. La saturation pulsée renseigne sur l’oxygénation, mais pas sur la ventilation. Vous mesurez les deux et vous les interprétez ensemble.</p><h3>Fréquence et rythme respiratoires</h3><p>Vous comptez les mouvements thoraciques pendant 30 secondes, ou 60 secondes si le rythme est irrégulier. Vous comptez discrètement, par exemple en gardant les doigts sur le pouls : un patient qui se sait observé modifie sa respiration. Chez l’adulte, le score NEWS2 du Royal College of Physicians n’attribue aucun point entre 12 et 20 par minute. Il attribue 2 points entre 21 et 24, et 3 points à partir de 25 ou à 8 et moins.</p><p>Le rythme renseigne aussi. Une respiration ample et rapide sans lutte, dite de Kussmaul, compense une acidose métabolique comme l’acidocétose. Une respiration de Cheyne-Stokes alterne crescendo, decrescendo et apnée ; elle accompagne l’insuffisance cardiaque grave et certaines lésions cérébrales. Une bradypnée chez un patient somnolent évoque une intoxication aux opioïdes ou un épuisement.</p><h3>Saturation pulsée en oxygène</h3><p>L’oxymètre compare l’absorption de deux longueurs d’onde par le sang pulsé. Vous attendez un signal stable et une courbe pulsatile correcte avant de lire la valeur. Vous notez si le patient respire l’air ambiant ou reçoit de l’oxygène, avec le débit. Une SpO₂ sans cette précision ne s’interprète pas.</p><p>La recommandation de la British Thoracic Society fixe une cible de 94 à 98 % pour la plupart des patients aigus. Elle fixe 88 à 92 % pour les patients à risque d’hypercapnie, comme une BPCO sévère, une obésité morbide ou une maladie neuromusculaire. Une SpO₂ normale sous oxygène peut masquer une hypoventilation : le CO₂ monte sans que la saturation baisse. Seule la gazométrie mesure la PaCO₂.</p><p>La mesure a des limites précises. Une mauvaise perfusion, des extrémités froides, un vernis foncé ou des mouvements faussent le signal. Le monoxyde de carbone donne une SpO₂ faussement normale, car l’oxymètre standard ne distingue pas la carboxyhémoglobine. Chez des patients noirs, une hypoxémie occulte (SaO₂ inférieure à 88 % malgré une SpO₂ de 92 à 96 %) a été trouvée dans 11,7 % des mesures, contre 3,6 % chez des patients blancs.</p><div class="rcs-key"><b>À retenir.</b> Vous notez toujours la fréquence respiratoire comptée, la SpO₂ et l’oxygène administré. Une saturation normale n’exclut ni l’hypercapnie ni une détresse respiratoire.</div></section>

<section class="rcs-section" id="rcs-mains" aria-labelledby="rcs-h-mains"><h2 id="rcs-h-mains"><span>4</span>Examiner les mains, le visage et le cou</h2><p>Les extrémités et le cou révèlent une hypoxémie chronique, une hypercapnie, un traitement ou une cause tumorale. Ces signes orientent l’anamnèse avant même l’examen du thorax. Vous les cherchez en une minute.</p><h3>Mains</h3><p>Vous regardez les doigts de profil pour rechercher un hippocratisme. La revue de Myers et Farquhar propose deux mesures : l’angle de profil et le rapport de profondeur phalangienne. Sans hippocratisme, ces valeurs ne dépassent pas 176° et 1,0. Un rapport supérieur à 1,0 s’associe à un cancer pulmonaire avec un rapport de vraisemblance de 3,9. L’accord entre examinateurs reste variable, avec un kappa de 0,39 à 0,90.</p><button type="button" class="rcs-open" data-rcs-model="finger">Ouvrir l’hippocratisme digital en 3D</button><p>Vous recherchez ensuite une cyanose. Une cyanose centrale, visible sur la langue et les lèvres, traduit une désaturation artérielle. Une cyanose périphérique isolée, avec des extrémités froides, traduit une extraction tissulaire accrue par bas débit ou vasoconstriction. La cyanose dépend de la quantité absolue d’hémoglobine désaturée : elle apparaît tard chez l’anémique et tôt chez le polyglobulique.</p><p>Vous demandez au patient de tendre les bras, poignets en extension. Un astérixis, chute brève et irrégulière des mains, accompagne une hypercapnie importante. Un tremblement fin et rapide évoque plutôt un effet des bêta-2-agonistes. Des mains chaudes avec un pouls bondissant peuvent accompagner la vasodilatation de l’hypercapnie. Des taches de nicotine orientent l’anamnèse tabagique.</p><h3>Visage et cou</h3><p>Vous observez les lèvres, la conjonctive et un éventuel syndrome de Claude Bernard-Horner, qui peut révéler une tumeur de l’apex. Vous palpez les ganglions sus-claviculaires et cervicaux. Une adénopathie sus-claviculaire dure oriente vers un cancer thoracique ou abdominal et se prête à une biopsie.</p><p>Vous palpez la trachée dans la fourchette sternale. Elle doit être médiane. Une trachée repoussée vers le côté opposé suggère un pneumothorax compressif ou un grand épanchement ; une trachée attirée vers le côté atteint suggère une atélectasie ou une fibrose. Vous mesurez aussi la hauteur laryngée, entre le sommet du cartilage thyroïde et la fourchette sternale. Une hauteur de 4 cm ou moins s’associait à une obstruction bronchique avec un rapport de vraisemblance de 2,8 dans l’étude CARE-COAD1.</p><p>Vous regardez la pression veineuse jugulaire. Elle s’élève dans le cœur pulmonaire chronique, l’embolie pulmonaire massive et le pneumothorax compressif. La technique est détaillée dans le module de sémiologie cardiovasculaire.</p><div class="rcs-key"><b>À retenir.</b> Un hippocratisme chez un fumeur atteint de BPCO n’est pas expliqué par la BPCO : vous recherchez un cancer, des bronchectasies ou une fibrose.</div></section>

<section class="rcs-section" id="rcs-reperes" aria-labelledby="rcs-h-reperes"><h2 id="rcs-h-reperes"><span>5</span>Projeter les poumons sur la paroi</h2><p>Un signe localisé ne vaut que si vous savez quel lobe se trouve sous votre main. Le dos explore surtout les lobes inférieurs, l’avant surtout les lobes supérieurs et le lobe moyen. Cette répartition explique pourquoi une pneumonie du lobe moyen peut passer inaperçue si vous n’écoutez que le dos.</p><p>Le tableau donne les repères en respiration calme. Il sert à localiser une matité ou un foyer auscultatoire avant l’imagerie.</p><div class="rcs-table-wrap"><table><thead><tr><th>Structure</th><th>Ligne médioclaviculaire</th><th>Ligne axillaire moyenne</th><th>En arrière</th></tr></thead><tbody><tr><td>Bord inférieur du poumon</td><td>6e côte</td><td>8e côte</td><td>Vers T10</td></tr><tr><td>Limite pleurale (cul-de-sac)</td><td>8e côte</td><td>10e côte</td><td>Vers T12</td></tr><tr><td>Grande scissure</td><td>6e jonction chondrocostale</td><td>Croise la 5e côte</td><td>Naît vers T3</td></tr><tr><td>Petite scissure (droite)</td><td>4e cartilage costal</td><td>Rejoint la grande scissure</td><td>Absente</td></tr></tbody></table></div><p>Vous lisez d’abord les deux premières lignes : l’écart de deux côtes entre poumon et plèvre forme le récessus où le liquide s’accumule. L’erreur fréquente est de chercher le lobe moyen dans le dos. Par exemple, une matité droite antérieure sous le quatrième espace, avec un dos normal, oriente vers le lobe moyen.</p><button type="button" class="rcs-open" data-rcs-model="lobes">Ouvrir les lobes et les culs-de-sac en 3D</button><div class="rcs-key"><b>À retenir.</b> Vous comptez les côtes depuis l’angle sternal en avant, et depuis la pointe de l’omoplate (vers la 7e côte) ou les apophyses épineuses en arrière. Les niveaux exacts varient avec la morphologie et l’inspiration.</div></section>

<section class="rcs-section" id="rcs-inspection" aria-labelledby="rcs-h-inspection"><h2 id="rcs-h-inspection"><span>6</span>Inspecter la forme et le mouvement du thorax</h2><p>La forme du thorax reflète des maladies anciennes ; son mouvement reflète la mécanique actuelle. Vous regardez de face, de profil et de dos, puis pendant plusieurs cycles respiratoires.</p><h3>Morphologie</h3><p>Le thorax en tonneau augmente le diamètre antéropostérieur : les côtes s’horizontalisent dans la distension de la BPCO. Il se voit aussi chez des personnes âgées sans obstruction et n’établit donc pas le diagnostic. Le pectus excavatum et le pectus carinatum sont des déformations sternales, souvent sans retentissement. Une cyphoscoliose importante réduit la compliance de la paroi et peut provoquer une insuffisance respiratoire restrictive avec hypoventilation nocturne.</p><p>Vous repérez les cicatrices de thoracotomie, de drain ou de sternotomie, les dispositifs implantés, les circulations veineuses collatérales et les lésions cutanées de radiothérapie. Une circulation collatérale thoracique haute avec œdème du visage évoque un syndrome cave supérieur.</p><h3>Mouvement</h3><p>Vous comparez les deux hémithorax pendant l’inspiration. Un côté qui se soulève moins est habituellement le côté malade. Vous regardez aussi le rapport entre inspiration et expiration : une expiration prolongée suggère une obstruction bronchique. Un segment de paroi qui rentre à l’inspiration après un traumatisme signe un volet costal.</p><div class="rcs-key"><b>À retenir.</b> Une asymétrie du mouvement localise la lésion du côté qui bouge le moins. La palpation confirme cette impression.</div></section>

<section class="rcs-section" id="rcs-palpation" aria-labelledby="rcs-h-palpation"><h2 id="rcs-h-palpation"><span>7</span>Palper l’ampliation et les vibrations vocales</h2><p>La palpation transforme une impression visuelle en mesure comparative. Elle évalue l’expansion de chaque hémithorax et la transmission de la voix à la paroi. Ces deux signes distinguent souvent liquide, air et parenchyme condensé.</p><h3>Ampliation thoracique</h3><p>Vous placez les mains à plat sur la partie basse du dos, pouces vers la colonne vers le dixième niveau costal, en soulevant un petit pli cutané. Vous demandez une inspiration profonde et vous regardez les pouces s’écarter. Vous répétez en avant, mains sur les marges costales. Un écart asymétrique désigne le côté atteint ; une ampliation réduite des deux côtés évoque une distension ou une restriction.</p><h3>Vibrations vocales</h3><p>Vous posez le bord cubital ou la paume de la main sur la paroi et demandez au patient de dire « trente-trois ». Vous comparez des niveaux symétriques, du sommet aux bases. La voix fait vibrer l’air des bronches, puis le parenchyme et la paroi. Le parenchyme condensé transmet mieux ces vibrations ; l’air ou le liquide pleural les amortissent.</p><p>Des vibrations augmentées orientent donc vers une condensation avec bronche perméable. Des vibrations diminuées orientent vers un épanchement, un pneumothorax, une atélectasie par obstruction bronchique ou une paroi épaisse. Dans la revue de Wong, la présence de vibrations normales rendait un épanchement pleural moins probable : rapport de vraisemblance négatif 0,21.</p><h3>Autres signes palpables</h3><p>Une crépitation neigeuse sous les doigts signe un emphysème sous-cutané : de l’air a fui dans les tissus, par exemple après un pneumothorax ou un drain. Une douleur reproduite par la pression d’un point costal oriente vers une cause pariétale, sans exclure une embolie pulmonaire. Des ronchi grossiers peuvent se palper sous forme de vibrations.</p><button type="button" class="rcs-open" data-rcs-model="muscles" data-rcs-point="hands">Ouvrir la position des mains pour l’ampliation</button><div class="rcs-key"><b>À retenir.</b> Vibrations augmentées : parenchyme solide relié à une bronche ouverte. Vibrations diminuées : quelque chose s’interpose (liquide, air) ou la bronche est bouchée.</div></section>

<section class="rcs-section" id="rcs-percussion" aria-labelledby="rcs-h-percussion"><h2 id="rcs-h-percussion"><span>8</span>Percuter pour distinguer air, tissu et liquide</h2><p>La percussion fait vibrer la paroi et la structure sous-jacente sur quelques centimètres de profondeur. Un poumon aéré résonne, un tissu dense ou du liquide amortit le son. Vous comparez toujours un côté à l’autre au même niveau.</p><h3>Technique</h3><p>Vous appliquez fermement la deuxième phalange du majeur non dominant dans un espace intercostal, les autres doigts soulevés. Vous frappez cette phalange avec l’extrémité du majeur dominant, par un mouvement souple du poignet. Vous percutez deux fois par site, puis le site symétrique. Vous percutez aussi les creux sus-claviculaires et l’aisselle.</p><p>Le son normal du poumon est sonore. La matité est le son sourd et bref du foie ou d’une cuisse. L’hypersonorité est plus grave et plus prolongée ; le tympanisme évoque un organe creux plein d’air. Vous repérez la matité cardiaque et la matité hépatique, qui servent de témoins normaux.</p><h3>Interprétation et valeur</h3><p>Une matité franche, déclive, qui remonte vers l’aisselle évoque un épanchement pleural. Dans la revue de Wong, la matité à la percussion était le signe le plus utile : rapport de vraisemblance positif 8,7 (intervalle de confiance 2,2 à 33,8). Une matité moins franche, avec vibrations augmentées, oriente vers une condensation ; dans la méta-analyse d’Ebell, la matité augmentait la probabilité de pneumonie avec un rapport de vraisemblance de 2,62.</p><p>Une hypersonorité unilatérale évoque un pneumothorax. Une hypersonorité bilatérale avec disparition de la matité cardiaque évoque une distension. Vous mesurez enfin l’excursion diaphragmatique : vous repérez la limite inférieure de sonorité en expiration puis en inspiration profonde. Une excursion réduite d’un côté évoque une paralysie phrénique ou un épanchement.</p><div class="rcs-key"><b>À retenir.</b> Une matité confirme une densité anormale mais ne dit pas si elle est liquide ou solide. Les vibrations vocales et l’auscultation tranchent ; l’échographie confirme.</div></section>

<section class="rcs-section" id="rcs-auscultation" aria-labelledby="rcs-h-auscultation"><h2 id="rcs-h-auscultation"><span>9</span>Ausculter : bruit normal, bruits ajoutés et voix</h2><p>L’auscultation décrit trois éléments : le bruit respiratoire de base, les bruits ajoutés et la transmission de la voix. Chaque élément répond à une question différente. Vous les décrivez séparément avant de conclure.</p><h3>Technique</h3><p>Vous utilisez le diaphragme du stéthoscope directement sur la peau. Le patient respire bouche ouverte, un peu plus profondément que d’habitude. Vous écoutez au moins un cycle complet par site et vous alternez gauche et droite au même niveau. Vous évitez l’hyperventilation prolongée, qui provoque des vertiges.</p><button type="button" class="rcs-open" data-rcs-model="auscultation">Ouvrir le parcours d’auscultation en 3D</button><h3>Bruit respiratoire de base</h3><p>Le murmure vésiculaire est doux et grave. Il s’entend pendant toute l’inspiration et seulement au début de l’expiration. Il naît du flux turbulent des voies aériennes centrales et lobaires ; le poumon aéré filtre les fréquences aiguës. Au-dessus de la trachée, le bruit est fort et creux, et l’expiration est aussi longue que l’inspiration.</p><p>Un murmure diminué signifie que moins de son atteint la paroi. La cause peut être un faible débit, une distension, un épanchement, un pneumothorax ou une paroi épaisse. Un souffle tubaire, bruit trachéal entendu en périphérie, signifie au contraire qu’un parenchyme dense transmet le son bronchique : c’est la condensation avec bronche perméable.</p><h3>Bruits ajoutés</h3><p>La task force de l’European Respiratory Society recommande une nomenclature simple : crépitants pour les bruits discontinus, sibilants et ronchi pour les bruits continus. L’accord entre observateurs reste modeste lorsque les catégories sont fines. Vous décrivez donc le type, le temps, le siège et l’effet de la toux.</p><div class="rcs-table-wrap"><table><thead><tr><th>Bruit</th><th>Caractère</th><th>Mécanisme</th><th>Contextes typiques</th></tr></thead><tbody><tr><td>Crépitants fins</td><td>Discontinus, brefs, fin d’inspiration, non modifiés par la toux</td><td>Réouverture brutale de petites voies aériennes fermées</td><td>Fibrose pulmonaire, œdème pulmonaire débutant, pneumonie</td></tr><tr><td>Crépitants grossiers</td><td>Discontinus, plus graves, début d’inspiration et expiration</td><td>Bulles de liquide ou de sécrétions dans des voies plus larges</td><td>Bronchectasies, œdème pulmonaire, bronchite</td></tr><tr><td>Sibilants</td><td>Continus, musicaux, aigus, surtout expiratoires</td><td>Vibration d’une bronche rétrécie au passage de l’air</td><td>Asthme, BPCO, œdème bronchique, corps étranger si localisé</td></tr><tr><td>Ronchi</td><td>Continus, graves, souvent modifiés par la toux</td><td>Sécrétions et vibrations des grosses bronches</td><td>Bronchite, encombrement</td></tr><tr><td>Frottement pleural</td><td>Superficiel, rugueux, aux deux temps, disparaît en apnée</td><td>Frottement de feuillets pleuraux inflammatoires</td><td>Pleurésie, infarctus pulmonaire, pneumonie</td></tr><tr><td>Stridor</td><td>Continu, aigu, surtout inspiratoire, audible sans stéthoscope</td><td>Rétrécissement des voies extrathoraciques collabées à l’inspiration</td><td>Œdème laryngé, épiglottite, corps étranger, sténose trachéale</td></tr><tr><td>Couinement inspiratoire bref (squawk)</td><td>Bref son musical inspiratoire</td><td>Oscillation d’une petite voie aérienne qui se rouvre</td><td>Pneumopathie d’hypersensibilité, bronchiolite</td></tr></tbody></table></div><p>Vous regardez d’abord la colonne « caractère » : continu ou discontinu, inspiratoire ou expiratoire. L’erreur fréquente est de nommer « ronchi » tout bruit anormal. Par exemple, des crépitants fins bibasaux, télé-inspiratoires, persistants après la toux, chez un patient de 70 ans avec hippocratisme, orientent vers une fibrose pulmonaire.</p><button type="button" class="rcs-open" data-rcs-model="airways">Ouvrir l’origine des bruits en 3D</button><p>Les sibilants ont une valeur diagnostique modeste. Dans l’étude CARE-COAD1, leur rapport de vraisemblance pour une obstruction bronchique était de 2,7 et ils n’apportaient rien de plus dans le modèle multivarié. Un thorax silencieux chez un asthmatique en crise est un signe de gravité extrême : le débit est trop faible pour produire un son.</p><h3>Transmission de la voix</h3><p>Vous demandez au patient de dire « trente-trois » à voix normale, puis de chuchoter. Sur un poumon normal, la voix est assourdie et le chuchotement presque inaudible. Au-dessus d’une condensation, la voix devient nette (bronchophonie) et le chuchotement intelligible (pectoriloquie aphone). Vous demandez enfin de dire « i » : s’il s’entend « é », c’est une égophonie.</p><p>L’égophonie était le signe d’examen le plus discriminant pour la pneumonie dans la méta-analyse d’Ebell : rapport de vraisemblance positif 6,17 (intervalle 1,34 à 18,0). La même étude montrait qu’une absence d’anomalie des signes vitaux rendait la pneumonie peu probable (rapport négatif 0,25). Une égophonie peut aussi s’entendre à la limite supérieure d’un épanchement, où le poumon est comprimé.</p><div class="rcs-key"><b>Science → examen.</b> L’air filtre les sons aigus ; le tissu dense les transmet ; le liquide et l’air pleural les réfléchissent. Cette règle physique explique le murmure, le souffle tubaire, les vibrations vocales et l’égophonie.</div><p class="rcs-course-links">Vous reliez ces signes à <a href="#/entry/J18">J18 · Pneumonie</a>, <a href="#/entry/J45">J45 · Asthme</a> et <a href="#/entry/J44">J44 · BPCO</a>.</p></section>

<section class="rcs-section" id="rcs-syndromes" aria-labelledby="rcs-h-syndromes"><h2 id="rcs-h-syndromes"><span>10</span>Regrouper les signes en syndromes</h2><p>Aucun signe isolé ne suffit. Le diagnostic clinique repose sur une combinaison concordante : mouvement, position de la trachée, vibrations, percussion et auscultation. Le tableau compare les six syndromes à reconnaître au lit du patient.</p><p>La question clinique est simple : le côté anormal contient-il du tissu dense, du liquide, de l’air, ou un poumon affaissé ? Les lignes se distinguent surtout par les vibrations vocales et la percussion.</p><div class="rcs-table-wrap"><table class="rcs-syndrome-table"><thead><tr><th>Syndrome</th><th>Ampliation</th><th>Trachée</th><th>Vibrations vocales</th><th>Percussion</th><th>Bruit de base</th><th>Bruits ajoutés et voix</th></tr></thead><tbody><tr><th scope="row">Condensation (pneumonie lobaire)</th><td>Diminuée du côté atteint</td><td>Médiane</td><td>Augmentées</td><td>Matité</td><td>Souffle tubaire</td><td>Crépitants, bronchophonie, égophonie</td></tr><tr><th scope="row">Épanchement pleural</th><td>Diminuée</td><td>Repoussée du côté opposé si abondant</td><td>Diminuées ou abolies</td><td>Matité franche, déclive</td><td>Diminué ou aboli</td><td>Égophonie possible à la limite supérieure ; frottement si l’épanchement est petit</td></tr><tr><th scope="row">Pneumothorax</th><td>Diminuée</td><td>Repoussée du côté opposé si compressif</td><td>Diminuées ou abolies</td><td>Hypersonorité ou tympanisme</td><td>Diminué ou aboli</td><td>Aucun</td></tr><tr><th scope="row">Distension (BPCO, emphysème)</th><td>Diminuée des deux côtés</td><td>Médiane, hauteur laryngée réduite</td><td>Diminuées des deux côtés</td><td>Hypersonorité, matité cardiaque réduite</td><td>Diminué, expiration prolongée</td><td>Sibilants possibles ; signe de Hoover</td></tr><tr><th scope="row">Atélectasie par obstruction</th><td>Diminuée</td><td>Attirée du côté atteint</td><td>Diminuées</td><td>Matité</td><td>Diminué ou aboli</td><td>Aucun si la bronche est bouchée</td></tr><tr><th scope="row">Fibrose pulmonaire</th><td>Diminuée des deux côtés</td><td>Médiane ou attirée si asymétrique</td><td>Normales ou augmentées</td><td>Normale ou légèrement mate</td><td>Conservé</td><td>Crépitants fins, télé-inspiratoires, basaux</td></tr></tbody></table></div><p>Vous lisez d’abord la colonne des vibrations vocales : augmentées dans la condensation, diminuées lorsqu’un liquide, de l’air ou une bronche bouchée s’interpose. Vous lisez ensuite la percussion, qui sépare l’air (pneumothorax, distension) de la densité (épanchement, condensation, atélectasie). La trachée sépare enfin la poussée (épanchement, pneumothorax) de la traction (atélectasie, fibrose).</p><p>L’erreur fréquente est de confondre épanchement et condensation, car les deux sont mats. Par exemple, une patiente fébrile présente une matité basale droite avec vibrations diminuées et murmure aboli : le tableau évoque un épanchement, peut-être parapneumonique. Si les vibrations étaient augmentées avec un souffle tubaire, il évoquerait une condensation.</p><div class="rcs-alert"><b>Pneumothorax compressif.</b> Une détresse respiratoire avec hypotension, tachycardie, distension jugulaire, hypersonorité et murmure aboli d’un côté impose une décompression immédiate. Le diagnostic est clinique ; vous n’attendez pas la radiographie. La déviation trachéale est tardive et souvent absente.</div><div class="rcs-key"><b>À retenir.</b> Vibrations, percussion et trachée distinguent les syndromes. L’examen oriente ; la radiographie, l’échographie pleurale et le scanner confirment, comme le rappelle la recommandation de la British Thoracic Society de 2023 sur les maladies pleurales.</div><p class="rcs-course-links">Vous approfondissez dans <a href="#/entry/J18">J18 · Pneumonie</a> et <a href="#/entry/I26">I26 · Embolie pulmonaire</a>.</p></section>

<section class="rcs-section" id="rcs-insuffisance" aria-labelledby="rcs-h-insuffisance"><h2 id="rcs-h-insuffisance"><span>11</span>Reconnaître l’insuffisance respiratoire</h2><p>L’insuffisance respiratoire est l’incapacité des poumons à maintenir des gaz du sang normaux. Elle peut être hypoxémique, hypercapnique ou mixte. L’examen la soupçonne ; la gazométrie artérielle la définit.</p><p>Le tableau associe les signes cliniques aux mécanismes. Il aide à prévoir ce que montrera la gazométrie et à reconnaître l’épuisement.</p><div class="rcs-table-wrap"><table><thead><tr><th>Composante</th><th>Signes</th><th>Mécanisme</th></tr></thead><tbody><tr><td>Hypoxémie</td><td>Tachypnée, tachycardie, cyanose centrale, agitation puis confusion</td><td>Le manque d’oxygène stimule les chémorécepteurs et altère le cerveau.</td></tr><tr><td>Hypercapnie</td><td>Céphalées matinales, somnolence, astérixis, sueurs, mains chaudes, pouls bondissant</td><td>Le CO₂ dilate les vaisseaux et déprime la vigilance ; il acidifie le sang.</td></tr><tr><td>Lutte</td><td>Muscles accessoires, tirage, battement des ailes du nez</td><td>Le travail respiratoire augmente pour maintenir la ventilation.</td></tr><tr><td>Épuisement</td><td>Respiration paradoxale, bradypnée, somnolence, thorax silencieux</td><td>Les muscles respiratoires ne soutiennent plus la charge ; l’arrêt menace.</td></tr></tbody></table></div><p>Vous regardez d’abord la dernière ligne, car elle impose une décision immédiate. L’erreur fréquente est d’augmenter l’oxygène chez un patient BPCO somnolent sans gazométrie : la SpO₂ s’améliore pendant que le CO₂ monte. Par exemple, un patient BPCO confus, à SpO₂ 95 % sous 6 L/min, peut avoir une acidose respiratoire grave ; sa cible est 88 à 92 %.</p><p>Le guide GINA 2026 utilise des critères cliniques pour classer une exacerbation d’asthme sévère. Le patient ne peut plus parler, boire ou s’allonger, sa fréquence respiratoire dépasse 30 par minute et sa SpO₂ à l’air est inférieure à 92 %. Le thorax devient silencieux et le débit de pointe tombe sous 50 % de la meilleure valeur. La somnolence, la confusion ou la cyanose rendent la situation immédiatement menaçante.</p><div class="rcs-key"><b>À retenir.</b> La clinique repère l’insuffisance respiratoire et l’épuisement ; la gazométrie en précise le type. Une SpO₂ correcte ne rassure pas chez un patient somnolent.</div></section>

<section class="rcs-section" id="rcs-debit" aria-labelledby="rcs-h-debit"><h2 id="rcs-h-debit"><span>12</span>Mesurer le débit de pointe et vérifier l’inhalation</h2><p>Le débit expiratoire de pointe mesure le débit maximal d’une expiration forcée. Il objective une obstruction et sa variabilité au cabinet ou à domicile. La technique d’inhalation détermine, elle, la quantité de médicament qui atteint les bronches.</p><h3>Débit de pointe</h3><p>Le patient se tient debout ou assis droit, l’indicateur remis à zéro. Il inspire au maximum, ferme les lèvres autour de l’embout et souffle le plus fort et le plus vite possible. Vous répétez trois fois et vous retenez la meilleure valeur, avec le même appareil. Le résultat dépend de l’effort : une valeur basse avec un souffle hésitant ne s’interprète pas.</p><p>Le guide GINA 2026 retient une variabilité diurne moyenne supérieure à 10 % chez l’adulte comme argument pour l’asthme. Le patient mesure matin et soir pendant une à deux semaines. Chaque jour, vous divisez l’écart entre matin et soir par la moyenne des deux, puis vous faites la moyenne des jours. Une hausse du débit de pointe d’au moins 20 % après bronchodilatateur soutient aussi le diagnostic lorsque la spirométrie manque. Le débit de pointe reste moins fiable que la spirométrie, qui confirme l’obstruction.</p><h3>Technique d’inhalation</h3><p>GINA recommande de vérifier la technique à chaque occasion. Vous demandez au patient de vous montrer son geste avec son propre dispositif. Vous suivez une liste spécifique au dispositif, puis vous corrigez en montrant le geste et vous faites répéter.</p><div class="rcs-table-wrap"><table><thead><tr><th>Dispositif</th><th>Inspiration attendue</th><th>Erreurs à rechercher</th></tr></thead><tbody><tr><td>Aérosol doseur, avec ou sans chambre d’inhalation</td><td>Lente et profonde, déclenchée au début de l’inspiration, puis apnée de quelques secondes</td><td>Absence d’agitation si requise, déclenchement après l’inspiration, inspiration trop rapide</td></tr><tr><td>Inhalateur de poudre sèche</td><td>Rapide et énergique dès le début, puis apnée</td><td>Expiration dans l’appareil, inspiration trop faible, dispositif mal chargé</td></tr><tr><td>Inhalateur à brume douce</td><td>Lente et profonde, comme l’aérosol doseur</td><td>Cartouche mal chargée, mauvaise coordination</td></tr></tbody></table></div><p>Vous regardez d’abord la colonne de l’inspiration, car l’erreur principale vient de la confusion entre dispositifs. Une poudre sèche exige un débit inspiratoire suffisant pour disperser la poudre ; un aérosol doseur exige une inspiration lente pour éviter le dépôt dans la gorge. Un patient en crise sévère qui ne peut pas inspirer fort tire peu de bénéfice d’une poudre ; un aérosol doseur avec chambre est alors préférable.</p><div class="rcs-key"><b>À retenir.</b> Avant d’augmenter un traitement inhalé, vous vérifiez la technique et l’adhésion. Le débit de pointe compare un patient à lui-même ; la spirométrie établit le diagnostic.</div><p class="rcs-course-links">Vous reliez ces mesures à <a href="#/entry/J45">J45 · Asthme</a> et <a href="#/entry/J44">J44 · BPCO</a>.</p></section>

<section class="rcs-section" id="rcs-synthese" aria-labelledby="rcs-h-synthese"><h2 id="rcs-h-synthese"><span>13</span>Présenter une synthèse claire</h2><p>Une bonne synthèse sépare la gravité, les constatations localisées, le syndrome retenu et la suite. Elle signale aussi les limites de l’examen. Vous transmettez ainsi une hypothèse utilisable sans transformer l’examen en certitude.</p><div class="rcs-case"><b>Exemple de présentation.</b><p>« Monsieur L., 68 ans, parle en phrases complètes. La fréquence respiratoire est de 24 par minute et la SpO₂ de 91 % à l’air ambiant. Il n’y a ni tirage ni respiration paradoxale. À droite, l’ampliation basale est diminuée. La percussion est mate sous la pointe de l’omoplate, avec des vibrations vocales augmentées. J’entends un souffle tubaire, des crépitants et une égophonie. Ce tableau correspond à une condensation du lobe inférieur droit. Je demande une radiographie thoracique et un bilan sanguin, et je débute l’oxygène avec une cible de 94 à 98 %. »</p></div><p>Lorsque l’examen est limité, vous le dites : patient alité, obésité, bruit ambiant. Vous mentionnez les signes de gravité présents ou absents, puis l’examen complémentaire qui répond à la question restante.</p><div class="rcs-key"><b>Science → décision.</b> L’examen estime la probabilité d’un syndrome. L’imagerie et la gazométrie la confirment ou la corrigent ; leur choix dépend de ce que l’examen a trouvé.</div></section>

<section class="rcs-section" id="rcs-entrainement" aria-labelledby="rcs-h-entrainement"><h2 id="rcs-h-entrainement"><span>14</span>S’entraîner au raisonnement et au déroulement</h2><p>Ces cas vérifient l’interprétation des signes. La liste de contrôle aide une répétition supervisée. Le compteur indique uniquement les étapes que vous avez cochées dans ce navigateur ; il ne mesure pas une compétence clinique.</p><div class="rcs-quiz" data-rcs-answer="b"><h3>Cas 1 · Une base droite mate</h3><p>Une patiente présente une matité basale droite, des vibrations vocales abolies et un murmure aboli. Quel syndrome est le plus probable ?</p><button type="button" data-rcs-choice="a">Une condensation pneumonique.</button><button type="button" data-rcs-choice="b">Un épanchement pleural.</button><button type="button" data-rcs-choice="c">Un pneumothorax.</button><p class="rcs-feedback" hidden>Le liquide pleural amortit les vibrations et le son. Une condensation augmenterait les vibrations ; un pneumothorax donnerait une hypersonorité.</p></div><div class="rcs-quiz" data-rcs-answer="a"><h3>Cas 2 · Un asthmatique plus calme</h3><p>Un patient en crise d’asthme ne siffle plus, ne parle plus et devient somnolent. Que signifie ce changement ?</p><button type="button" data-rcs-choice="a">Un épuisement avec débit trop faible pour produire des sibilants.</button><button type="button" data-rcs-choice="b">Une amélioration due au bronchodilatateur.</button><p class="rcs-feedback" hidden>Le thorax silencieux et la somnolence sont des signes de gravité extrême. Vous appelez de l’aide et préparez une prise en charge intensive.</p></div><div class="rcs-quiz" data-rcs-answer="b"><h3>Cas 3 · Une SpO₂ rassurante</h3><p>Un patient BPCO confus a une SpO₂ de 97 % sous 6 L/min d’oxygène. Quelle conclusion est correcte ?</p><button type="button" data-rcs-choice="a">L’oxygénation est bonne ; la confusion a une autre cause.</button><button type="button" data-rcs-choice="b">Une hypercapnie est possible ; une gazométrie est nécessaire et la cible est 88 à 92 %.</button><p class="rcs-feedback" hidden>La SpO₂ ne mesure pas le CO₂. Un excès d’oxygène peut aggraver l’hypercapnie chez un patient à risque.</p></div><div class="rcs-quiz" data-rcs-answer="c"><h3>Cas 4 · Une trachée déviée</h3><p>La trachée est attirée vers la gauche ; l’hémithorax gauche est mat, avec un murmure aboli. Quel syndrome évoquez-vous ?</p><button type="button" data-rcs-choice="a">Un épanchement pleural gauche abondant.</button><button type="button" data-rcs-choice="b">Un pneumothorax gauche compressif.</button><button type="button" data-rcs-choice="c">Une atélectasie gauche par obstruction bronchique.</button><p class="rcs-feedback" hidden>La traction de la trachée vers le côté mat indique une perte de volume. Un épanchement ou un pneumothorax repousseraient la trachée vers le côté opposé.</p></div><div class="rcs-checklist"><h3>Liste de contrôle d’une station clinique</h3><p>Vous cochez une étape après l’avoir expliquée et pratiquée.</p><label><input type="checkbox" data-rcs-check="preparation"> J’ai confirmé l’identité, obtenu l’accord, exposé le thorax et installé le patient assis.</label><label><input type="checkbox" data-rcs-check="gravite"> J’ai évalué la parole, la conscience et les signes de lutte.</label><label><input type="checkbox" data-rcs-check="constantes"> J’ai compté la fréquence respiratoire et noté la SpO₂ avec l’oxygène administré.</label><label><input type="checkbox" data-rcs-check="mains"> J’ai examiné les mains, recherché un hippocratisme, une cyanose et un astérixis.</label><label><input type="checkbox" data-rcs-check="cou"> J’ai palpé la trachée, les ganglions et regardé les jugulaires.</label><label><input type="checkbox" data-rcs-check="inspection"> J’ai inspecté la forme et le mouvement du thorax.</label><label><input type="checkbox" data-rcs-check="palpation"> J’ai mesuré l’ampliation et comparé les vibrations vocales.</label><label><input type="checkbox" data-rcs-check="percussion"> J’ai percuté de façon symétrique, sommets et aisselles compris.</label><label><input type="checkbox" data-rcs-check="auscultation"> J’ai ausculté les huit paires de sites et testé la voix si nécessaire.</label><label><input type="checkbox" data-rcs-check="synthese"> J’ai présenté la gravité, le syndrome, les limites et la suite.</label><output class="rcs-progress" aria-live="polite">0 / 10 étapes cochées</output><button type="button" class="rcs-reset-checklist">Réinitialiser mon entraînement</button></div></section>
