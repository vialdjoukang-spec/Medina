<template data-pop="j10-ph-cycle" data-title="Cycle du virus influenza et cibles des antiviraux"><p class="lab">Fonction et cible</p><p>Chaque antiviral agit sur une étape indispensable à la multiplication du virus : entrée, décapsidation, transcription ou libération.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’hémagglutinine se lie à l’acide sialique et déclenche l’endocytose. Dans l’endosome acide, la protéine M2 laisse entrer des protons, ce qui détache les segments d’ARN de leur matrice. Dans le noyau, la polymérase virale (sous-unités acide, basique 1 et basique 2) capture la coiffe d’un ARN messager cellulaire : la sous-unité acide porte l’endonucléase qui coupe cette coiffe, ciblée par le baloxavir. Les nouveaux virions bourgeonnent à la membrane ; ils y resteraient accrochés à l’acide sialique sans la neuraminidase, ciblée par l’oseltamivir, le zanamivir et le péramivir.</p><p class="lab">Conséquence clinique</p><p>Un inhibiteur de la neuraminidase n’empêche pas l’infection des cellules déjà atteintes ; il limite la propagation à de nouvelles cellules. Le baloxavir agit plus tôt et fait chuter la charge virale plus vite, sans raccourcir davantage les symptômes dans les essais.</p><div class="key"><b>Limite.</b> La réduction de la charge virale est un critère biologique. Le bénéfice clinique se mesure par la durée des symptômes, les complications et la mortalité.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-oseltamivir" data-title="Oseltamivir : monographie"><p class="lab">Mécanisme</p><p>L’oseltamivir est un promédicament absorbé par voie orale. Des estérases surtout hépatiques le transforment en carboxylate d’oseltamivir, analogue de l’acide sialique. Ce métabolite occupe le site actif de la neuraminidase des virus A et B et empêche la libération des virions.</p><p class="lab">Preuves</p><p>Une méta-analyse de 9 essais (4 328 adultes, Dobson, Lancet 2015) a raccourci le délai de soulagement de 21 % : 97,5 heures contre 122,7 heures. Les complications respiratoires basses nécessitant un antibiotique sont passées de 8,7 % à 4,9 %, et les hospitalisations de 1,7 % à 0,6 %. La revue Cochrane de 2014 (Jefferson) trouve un gain plus faible, 16,8 heures, sans effet significatif sur les hospitalisations ; elle critique les biais des essais du fabricant. Chez les patients hospitalisés de la pandémie de 2009, une méta-analyse observationnelle de 29 234 patients (Muthuri 2014) associe le traitement à une mortalité plus faible (odds ratio ajusté 0,81), et le traitement précoce à un bénéfice plus net (0,50 contre absence de traitement).</p><p class="lab">Posologie de l’adulte</p><p>Traitement : 75 mg deux fois par jour pendant 5 jours. Prophylaxie après contact : 75 mg une fois par jour pendant 10 jours. Adapter à la clairance de la créatinine dès qu’elle est égale ou inférieure à 60 ml/min.</p><p class="lab">Effets indésirables</p><p>Nausées (10 %), vomissements (8 %), céphalées ; rarement troubles neuropsychiatriques, élévation des enzymes hépatiques, éruptions cutanées.</p><p class="lab">Contre-indications et surveillance</p><p>Seule contre-indication : hypersensibilité au principe actif ou à un excipient. Surveiller la réponse clinique à 48–72 heures, l’hydratation et, chez l’adolescent, le comportement.</p><div class="key"><b>Limite.</b> L’information suisse indique l’absence de données contrôlées chez les patients assez graves pour être hospitalisés. La recommandation chez eux repose sur des données observationnelles et sur la plausibilité de la réplication persistante.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1016/S0140-6736(14)62449-1" target="_blank" rel="noopener">Dobson, Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a> ; <a href="https://doi.org/10.1016/S2213-2600(14)70041-4" target="_blank" rel="noopener">Muthuri, Lancet Respiratory Medicine 2014</a>.</p></template>

<template data-pop="j10-ph-baloxavir" data-title="Baloxavir marboxil : monographie"><p class="lab">Mécanisme</p><p>Le baloxavir marboxil est un promédicament hydrolysé en baloxavir. Celui-ci inhibe l’endonucléase cap-dépendante de la sous-unité acide de la polymérase virale. Le virus ne peut plus fabriquer ses ARN messagers. La longue demi-vie autorise une dose unique.</p><p class="lab">Preuves</p><p>CAPSTONE-1 (adultes et adolescents sans risque, 2016–2017) : soulagement médian en 53,7 heures contre 80,2 heures sous placebo, sans différence avec l’oseltamivir. CAPSTONE-2 (personnes à risque élevé) : amélioration en 73,2 heures contre 102,3 heures sous placebo, sans différence significative avec l’oseltamivir. BLOCKSTONE (prophylaxie dans les ménages, Japon) : grippe symptomatique chez 1,9 % contre 13,6 % sous placebo. CENTERSTONE (2025) : transmission aux contacts du ménage à 5 jours de 9,5 % contre 13,4 %, sans réduction significative de la transmission symptomatique. FLAGSTONE (hospitalisés graves) : l’ajout du baloxavir à un inhibiteur de la neuraminidase n’a pas amélioré l’évolution (97,5 heures contre 100,2 heures).</p><p class="lab">Posologie de l’adulte</p><p>Dose unique : 40 mg de 20 à moins de 80 kg, 80 mg dès 80 kg, dans les 48 heures après le début des symptômes ou après le contact. Aucune adaptation rénale ni pour une insuffisance hépatique légère à modérée.</p><p class="lab">Indications suisses</p><p>Grippe non compliquée de moins de 48 heures chez la personne par ailleurs en bonne santé dès 3 mois, ou chez la personne à risque élevé de complication dès 12 ans ; prophylaxie après exposition dès 3 mois.</p><p class="lab">Effets indésirables, contre-indications et surveillance</p><p>Pas d’excès d’effets indésirables contre placebo ; anaphylaxie, angiœdème, érythème polymorphe et diarrhée rapportés après commercialisation. Contre-indiqué en cas d’hypersensibilité. À éviter pendant la grossesse et l’allaitement selon l’information suisse ; la Société suisse d’infectiologie ne le recommande pas chez la femme enceinte, faute de données de sécurité. Non remboursé en règle ; prix départ usine de 120 à 150 francs selon la fiche suisse du 01.09.2026. Éviter les cations polyvalents au moment de la prise.</p><div class="key"><b>Limite.</b> L’émergence de virus I38T sous traitement et l’absence de bénéfice chez l’hospitalisé limitent son emploi à la grippe non grave.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1716197" target="_blank" rel="noopener">Hayden, New England Journal of Medicine 2018</a> ; <a href="https://doi.org/10.1016/S1473-3099(20)30004-9" target="_blank" rel="noopener">Ison, Lancet Infectious Diseases 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa1915341" target="_blank" rel="noopener">Ikematsu, New England Journal of Medicine 2020</a> ; <a href="https://doi.org/10.1056/NEJMoa2413156" target="_blank" rel="noopener">Monto, New England Journal of Medicine 2025</a> ; <a href="https://doi.org/10.1016/S1473-3099(21)00469-2" target="_blank" rel="noopener">Kumar, Lancet Infectious Diseases 2022</a>.</p></template>

<template data-pop="j10-ph-zanamivir" data-title="Zanamivir : monographie"><p class="lab">Mécanisme</p><p>Le zanamivir est un analogue de l’acide sialique qui inhibe la neuraminidase des virus A et B. Sa biodisponibilité orale est faible ; il est donc inhalé et agit surtout sur l’épithélium respiratoire.</p><p class="lab">Preuves</p><p>La revue Cochrane de 2014 rapporte chez l’adulte un raccourcissement des symptômes de 0,6 jour (de 6,6 à 6,0 jours) et une réduction de la grippe symptomatique en prophylaxie.</p><p class="lab">Posologie de l’adulte</p><p>Traitement : 2 inhalations de 5 mg deux fois par jour pendant 5 jours, dès 7 ans. Prophylaxie : 2 inhalations de 5 mg une fois par jour pendant 10 jours, dès 12 ans. Aucune adaptation rénale ou hépatique.</p><p class="lab">Effets indésirables et contre-indications</p><p>Bronchospasme et baisse de la fonction pulmonaire, parfois sévères, même sans maladie respiratoire connue. Contre-indiqué en cas d’hypersensibilité au zanamivir, au lactose ou d’allergie grave aux protéines du lait.</p><p class="lab">Surveillance</p><p>En cas d’asthme ou de BPCO, garder un bronchodilatateur rapide disponible et l’inhaler avant le zanamivir. Ne jamais nébuliser la poudre.</p><div class="key"><b>Limite.</b> Le zanamivir reste actif contre la plupart des virus H275Y résistants à l’oseltamivir ; l’OMS 2024 le déconseille néanmoins en traitement courant. L’information suisse date d’octobre 2020.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/78179-relenza-disk-5-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Relenza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a>.</p></template>

<template data-pop="j10-ph-peramivir" data-title="Péramivir : statut suisse et preuves"><p class="lab">Fonction et cible</p><p>Le péramivir est un inhibiteur de la neuraminidase administré par voie intraveineuse, en dose unique dans la grippe non compliquée aux États-Unis.</p><p class="lab">Mécanisme de l’affirmation</p><p>Il occupe le site actif de la neuraminidase comme l’oseltamivir. Sa voie intraveineuse paraît utile lorsque la voie orale est impossible, mais aucun essai n’a montré de supériorité chez l’hospitalisé.</p><p class="lab">Conséquence clinique</p><p>Aucune information professionnelle suisse n’a été trouvée sur compendium.ch le 08.10.2026. L’OMS 2024 formule une recommandation conditionnelle contre son emploi, dans la grippe non grave comme dans la grippe grave. L’oseltamivir par sonde gastrique reste l’option habituelle chez le patient intubé.</p><div class="key"><b>Limite.</b> La mutation H275Y réduit aussi la sensibilité des virus H1N1 au péramivir.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a>.</p></template>

<template data-pop="j10-ph-adamantanes" data-title="Adamantanes : pourquoi ils sont obsolètes"><p class="lab">Fonction et cible</p><p>L’amantadine et la rimantadine bloquent le canal à protons M2 et empêchent la décapsidation du virus A.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une seule substitution d’acide aminé, S31N, modifie le pore du canal et empêche la fixation du médicament sans gêner le virus. Les virus A H3N2 et H1N1 de la pandémie de 2009 portent presque tous cette mutation. Le virus B ne possède pas de canal M2, mais une protéine différente ; il est naturellement insensible.</p><p class="lab">Conséquence clinique</p><p>Un adamantane n’apporte donc aucun bénéfice antiviral attendu et expose à des effets neurologiques, comme la confusion et les vertiges chez la personne âgée. La rimantadine n’est pas autorisée en Suisse selon l’information professionnelle de Tamiflu.</p><div class="key"><b>Limite.</b> L’amantadine conserve d’autres usages en neurologie ; seule son indication antigrippale est abandonnée.</div><p class="src">Références : <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7305a1.htm" target="_blank" rel="noopener">CDC, recommandations de l’ACIP 2024–2025</a> ; <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-delai" data-title="Pourquoi le délai de 48 heures compte"><p class="lab">Fonction et cible</p><p>Un antiviral réduit la production de virus. Son effet dépend donc de la quantité de réplication encore à venir.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’adulte immunocompétent, l’excrétion virale culmine pendant les deux premiers jours des symptômes, puis décroît sous l’effet de la réponse immunitaire. Traité tard, le patient a déjà produit l’essentiel de ses virus ; les symptômes tardifs relèvent surtout de l’inflammation.</p><p class="lab">Conséquence clinique</p><p>L’information suisse de Tamiflu demande un début le jour des symptômes ou le lendemain, idéalement dans les 36 premières heures. Le baloxavir est autorisé dans les 48 heures. Chez l’hospitalisé ou l’immunodéprimé, la réplication peut persister plusieurs jours ; c’est pourquoi le traitement reste indiqué au-delà de ce délai.</p><div class="key"><b>Limite.</b> Le délai de 48 heures est un seuil des essais, pas une frontière biologique nette. Il sert la décision chez le patient ambulatoire, pas chez le patient grave.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template>

<template data-pop="j10-ph-contentieux" data-title="Société suisse d’infectiologie 2026, OMS 2024 et IDSA 2018 : arbitrage des sources"><p class="lab">Fonction et cible</p><p>Trois recommandations répondent à la même question, le traitement antiviral de la grippe ; elles divergent pour la grippe non grave.</p><p class="lab">Ce que dit chaque source</p><p><b>OMS, septembre 2024.</b> Elle repose sur des méta-analyses en réseau et sur la méthode d’évaluation du niveau de preuve. Dans la grippe non grave, elle recommande de ne pas donner d’oseltamivir, quel que soit le risque (recommandation forte, preuve modérée) : l’effet sur les hospitalisations et la mortalité est faible, alors que les vomissements augmentent. Elle propose le baloxavir chez le patient non grave à haut risque (conditionnelle) et l’oseltamivir dans la grippe grave (conditionnelle).</p><p><b>Société suisse d’infectiologie, fiche validée le 01.09.2026.</b> Elle s’appuie sur l’OMS 2024. Elle cite le baloxavir chez l’ambulatoire à haut risque dans les 48 heures, mais son groupe d’experts le réserve en routine aux patients de 85 ans et plus ou immunodéprimés, faute de preuve solide et de remboursement. Elle donne l’oseltamivir pendant 5 jours à l’hospitalisé.</p><p><b>IDSA 2018.</b> Plus ancienne, elle traite précocement toute personne à risque élevé, toute personne hospitalisée quel que soit le délai, et permet de traiter la personne en bonne santé vue dans les 48 heures.</p><p class="lab">Conséquence clinique</p><p>Le cours suit la fiche suisse, source primaire la plus récente et applicable au contexte suisse. Les trois sources convergent sur l’essentiel : oseltamivir chez l’hospitalisé, aucun antibiotique sans suspicion de surinfection.</p><div class="key"><b>Limite.</b> Chez la femme enceinte, le baloxavir n’est pas recommandé faute de données ; l’oseltamivir reste la molécule autorisée et appuyée par l’IDSA 2018 et les CDC. La recommandation forte de l’OMS contre l’oseltamivir concerne la grippe non grave ; elle ne s’applique ni à la grippe grave ni à la grossesse avec signes de gravité.</div><p class="src">Références : <a href="https://ssi.guidelines.ch/guideline/5082/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, infection respiratoire aiguë et syndrome grippal de l’adulte, fiche validée le 01.09.2026 (version 40976), lue en texte intégral le 08.10.2026</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/f572acf9-8767-406d-9eee-5ed010ebba08/content" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, septembre 2024, texte intégral lu le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018, Clinical Infectious Diseases 2019</a>.</p></template>

<template data-pop="j10-ph-grossesse" data-title="Grossesse : pourquoi l’oseltamivir"><p class="lab">Fonction et cible</p><p>La grossesse augmente le risque de grippe grave ; le traitement antiviral protège la mère et, indirectement, le fœtus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le volume courant augmente, la capacité résiduelle fonctionnelle diminue, le débit cardiaque s’élève et l’immunité cellulaire est modulée. Une pneumonie virale altère donc vite l’oxygénation. La fièvre maternelle et l’hypoxémie menacent aussi le fœtus.</p><p class="lab">Conséquence clinique</p><p>L’information suisse de Tamiflu rapporte plus de 1 000 grossesses exposées au premier trimestre sans effet délétère identifié, sans adaptation de dose malgré une exposition plus faible au métabolite. L’IDSA 2018 recommande le traitement de la femme enceinte et jusqu’à deux semaines après l’accouchement. L’information suisse du baloxavir demande au contraire d’éviter la grossesse et l’allaitement, et la Société suisse d’infectiologie (01.09.2026) ne le recommande pas chez la femme enceinte, faute de données de sécurité.</p><div class="key"><b>Limite.</b> L’information suisse de Tamiflu réserve son emploi aux situations de nécessité ; la grippe confirmée ou fortement suspectée chez la femme enceinte en est une. Les données de bénéfice restent observationnelles.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018</a>.</p></template>

<template data-pop="j10-ph-prophylaxie" data-title="Prophylaxie antivirale : qui, avec quoi, combien de temps"><p class="lab">Fonction et cible</p><p>La prophylaxie empêche l’infection après un contact, chez une personne dont la vaccination protège mal ou dont le risque de complication est très élevé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le médicament présent dans les voies respiratoires au moment de l’inoculation bloque la réplication avant l’amplification virale. L’effet cesse avec l’arrêt du traitement : il n’induit aucune immunité.</p><p class="lab">Conséquence clinique</p><p>La Société suisse d’infectiologie (01.09.2026) et l’OMS 2024 réservent la prophylaxie à la personne exposée dans les 48 heures dont le risque est très élevé : 85 ans et plus, ou plusieurs facteurs de risque, par exemple en établissement médico-social. Selon l’information suisse, l’oseltamivir se donne à 75 mg une fois par jour pendant 10 jours, début dans les deux jours ; le baloxavir en dose unique dans les 48 heures. BLOCKSTONE a réduit la grippe symptomatique des contacts du ménage de 13,6 % à 1,9 %. La revue Cochrane 2014 estime qu’il faut traiter environ 7 contacts de ménage par oseltamivir ou zanamivir pour éviter un cas symptomatique. Lors d’une flambée en établissement de soins, la prophylaxie de l’IDSA 2018 dure au moins deux semaines et jusqu’à une semaine après le dernier cas.</p><div class="key"><b>Limite.</b> La prophylaxie n’est pas recommandée chez la personne en bonne santé exposée. Une fièvre sous prophylaxie impose un test et une dose de traitement, non la poursuite de la dose prophylactique.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa1915341" target="_blank" rel="noopener">Ikematsu, New England Journal of Medicine 2020</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018</a>.</p></template>

<template data-pop="j10-ph-rein" data-title="Oseltamivir et rein : pourquoi adapter"><p class="lab">Fonction et cible</p><p>L’adaptation rénale maintient une exposition efficace sans accumulation.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le carboxylate d’oseltamivir n’est presque pas métabolisé. Il est éliminé dans l’urine par filtration glomérulaire et par sécrétion tubulaire des anions. Quand la clairance de la créatinine baisse, sa demi-vie s’allonge et ses concentrations augmentent. Une dose plus faible ou plus espacée donne alors une exposition comparable à celle d’un rein normal.</p><p class="lab">Conséquence clinique</p><p>Le seuil d’adaptation de l’information suisse actuelle est 60 ml/min. L’hémodialyse épure le métabolite ; c’est pourquoi une dose suit chaque séance en traitement. Le baloxavir, éliminé surtout dans les selles, ne demande aucune adaptation rénale.</p><div class="key"><b>Limite.</b> L’information suisse de 2010 fixait le seuil à 30 ml/min. Celle de janvier 2026 l’a remplacée et fixe le seuil à 60 ml/min. Aucune dose n’est validée sous 10 ml/min sans dialyse, ni chez l’enfant insuffisant rénal.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-h275y" data-title="Mutation H275Y et résistance à l’oseltamivir"><p class="lab">Fonction et cible</p><p>La mutation H275Y remplace une histidine par une tyrosine en position 275 de la neuraminidase des virus H1N1. Selon une autre numérotation, elle s’écrit H274Y.</p><p class="lab">Mécanisme de l’affirmation</p><p>Pour fixer l’oseltamivir, la neuraminidase doit faire pivoter un acide glutamique voisin et ouvrir une poche hydrophobe. La tyrosine plus volumineuse empêche ce mouvement. Le zanamivir, plus proche de l’acide sialique naturel, n’a pas besoin de cette poche et reste actif.</p><p class="lab">Conséquence clinique</p><p>Entre 2007 et 2009, les virus H1N1 saisonniers étaient devenus presque tous résistants. Le virus H1N1 de la pandémie de 2009, qui les a remplacés, est resté sensible dans son immense majorité. Une résistance apparaît surtout chez l’immunodéprimé traité longtemps. Le baloxavir reste actif sur ces virus selon son information suisse.</p><div class="key"><b>Limite.</b> La fréquence varie selon les saisons ; elle se lit dans les rapports de surveillance de l’OMS et des CDC.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018</a>.</p></template>

<template data-pop="j10-ph-i38t" data-title="Mutation I38T et baloxavir"><p class="lab">Fonction et cible</p><p>La substitution I38T remplace une isoleucine par une thréonine en position 38 de la sous-unité acide de la polymérase, dans le site de l’endonucléase.</p><p class="lab">Mécanisme de l’affirmation</p><p>La chaîne latérale plus petite de la thréonine réduit les contacts entre le baloxavir et la poche enzymatique. Le médicament se fixe moins bien, tandis que l’enzyme garde une activité suffisante pour le virus.</p><p class="lab">Conséquence clinique</p><p>Selon l’information suisse, des virus mutés sont apparus sous traitement chez 9,7 % des patients infectés de CAPSTONE-1, 5,2 % de CAPSTONE-2 et 19,3 % des enfants de 1 à 12 ans. Dans CENTERSTONE, 7,2 % des patients index ont développé une résistance, sans transmission détectée aux contacts. L’émergence peut s’accompagner d’un rebond de la charge virale.</p><div class="key"><b>Limite.</b> Les conséquences cliniques de cette sensibilité réduite restent incertaines selon l’information suisse. Le risque est plus grand chez l’enfant et l’immunodéprimé.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1056/NEJMoa2413156" target="_blank" rel="noopener">Monto, New England Journal of Medicine 2025</a>.</p></template>

<template data-pop="j10-ph-vvaa" data-title="Vaccin vivant atténué et antiviraux"><p class="lab">Fonction et cible</p><p>Le vaccin vivant atténué intranasal contient des virus capables de se répliquer dans le nez ; cette réplication produit l’immunité.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un antiviral bloque cette réplication comme celle d’un virus sauvage. Le vaccin perd donc son efficacité si l’antiviral est présent dans les muqueuses au moment de la réplication vaccinale. La durée d’interférence dépend de la demi-vie : environ 48 heures pour l’oseltamivir et le zanamivir, beaucoup plus pour le baloxavir.</p><p class="lab">Conséquence clinique</p><p>Selon l’ACIP 2024–2025, l’interférence existe de 48 heures avant à 14 jours après la vaccination pour l’oseltamivir et le zanamivir, de 5 jours avant pour le péramivir et de 17 jours avant pour le baloxavir, toujours jusqu’à 2 semaines après. Une personne traitée dans cet intervalle doit recevoir un vaccin inactivé. L’OFSP indique que le vaccin intranasal n’est pas disponible en Suisse en 2026.</p><div class="key"><b>Limite.</b> Les délais pour le péramivir et le baloxavir sont calculés à partir de cinq demi-vies ; ils ne proviennent pas d’essais cliniques.</div><p class="src">Références : <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7305a1.htm" target="_blank" rel="noopener">CDC, recommandations de l’ACIP 2024–2025</a> ; <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, grippe saisonnière, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-cations" data-title="Baloxavir et cations polyvalents"><p class="lab">Fonction et cible</p><p>Le baloxavir doit être absorbé dans l’intestin pour atteindre les voies respiratoires.</p><p class="lab">Mécanisme de l’affirmation</p><p>La molécule fixe des ions métalliques : c’est d’ailleurs ainsi qu’elle bloque les deux ions manganèse du site de l’endonucléase. Dans l’intestin, le calcium, le fer, le magnésium, le sélénium ou le zinc forment avec elle un complexe peu absorbable.</p><p class="lab">Conséquence clinique</p><p>Une dose unique mal absorbée peut rester sans effet antiviral. Il faut donc demander les laxatifs, antiacides, compléments minéraux, boissons enrichies en calcium et produits laitiers pris au même moment.</p><div class="key"><b>Limite.</b> L’information suisse demande d’éviter ces associations sans fixer d’intervalle chiffré ; la prise à distance est une précaution raisonnable.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1442084-xofluza-cpr-pell-40-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Xofluza, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-neuropsy" data-title="Troubles neuropsychiatriques sous oseltamivir"><p class="lab">Fonction et cible</p><p>La question est de savoir si le délire, les convulsions ou les comportements dangereux viennent du médicament ou de la grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>La grippe peut causer une encéphalopathie, surtout chez l’enfant, par la fièvre et la réaction inflammatoire. Ces troubles apparaissent donc aussi chez des patients non traités. L’information suisse indique que la contribution de l’oseltamivir reste inconnue.</p><p class="lab">Conséquence clinique</p><p>Surveiller étroitement le comportement de l’enfant et de l’adolescent, et informer l’entourage. La méta-analyse de Dobson (2015) n’a pas trouvé d’excès de troubles neurologiques ou psychiatriques chez l’adulte traité. La revue Cochrane de 2014 trouve un léger excès d’événements psychiatriques en prophylaxie.</p><div class="key"><b>Limite.</b> Le signal est rare et non démontré comme causal ; il ne justifie pas de priver d’oseltamivir une personne qui en a besoin.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://doi.org/10.1016/S0140-6736(14)62449-1" target="_blank" rel="noopener">Dobson, Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson, Cochrane 2014</a>.</p></template>

<template data-pop="j10-ph-reye" data-title="Syndrome de Reye et acide acétylsalicylique"><p class="lab">Fonction et cible</p><p>Le syndrome de Reye associe une encéphalopathie aiguë et une stéatose hépatique microvésiculaire, après une infection virale comme la grippe ou la varicelle.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le salicylate perturbe le fonctionnement des mitochondries, en particulier l’oxydation des acides gras. Associé à l’infection virale, il entraîne une insuffisance hépatique, une hyperammoniémie et un œdème cérébral. L’association a été établie par des études épidémiologiques ; la baisse des cas a suivi la réduction de l’usage pédiatrique de l’aspirine.</p><p class="lab">Conséquence clinique</p><p>L’information suisse d’Aspirine 500 demande que l’adolescent dès 12 ans fébrile ou atteint d’une infection virale ne la prenne que sur prescription et en deuxième intention. Elle cite les vomissements importants, les troubles de la conscience et l’atteinte hépatique. Chez l’enfant et l’adolescent grippé, préférer le paracétamol.</p><div class="key"><b>Limite.</b> Chez l’adulte, l’aspirine n’est pas contre-indiquée par la grippe ; elle n’a cependant aucun avantage sur le paracétamol pour la fièvre.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/110558-aspirine-cpr-eff-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Aspirine 500, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-antibio" data-title="Antibiotique : quand il devient indiqué"><p class="lab">Fonction et cible</p><p>L’antibiotique traite une surinfection bactérienne, pas la grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose des récepteurs auxquels adhèrent le pneumocoque et Staphylococcus aureus. La surinfection survient souvent après une amélioration initiale, avec une nouvelle fièvre, une toux productive, un foyer ou une aggravation respiratoire.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 recommande fortement de ne pas donner d’antibiotique dans la grippe non grave lorsque la probabilité de coinfection bactérienne est faible. Une pneumonie ou un sepsis justifient au contraire une antibiothérapie rapide, selon le cours sur les pneumonies.</p><div class="key"><b>Limite.</b> Une coinfection bactérienne précoce existe dans les formes graves ; l’absence d’antibiotique ne s’applique pas à une pneumonie grave hospitalisée.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018</a>.</p></template>

<template data-pop="j10-ph-cortico" data-title="Corticostéroïdes dans la grippe"><p class="lab">Fonction et cible</p><p>Les corticostéroïdes réduisent l’inflammation, mais diminuent aussi l’immunité antivirale.</p><p class="lab">Mécanisme de l’affirmation</p><p>En freinant les lymphocytes T et les interférons, ils prolongent l’excrétion virale. Les données observationnelles associent leur emploi dans la grippe grave à une mortalité et à des surinfections plus fréquentes.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 formule une recommandation conditionnelle contre les corticostéroïdes dans la grippe grave. Une autre indication garde sa place : exacerbation d’asthme ou de BPCO, choc septique réfractaire selon son protocole, insuffisance surrénalienne.</p><div class="key"><b>Limite.</b> Les données reposent surtout sur des études observationnelles, exposées aux biais d’indication.</div><p class="src">Références : <a href="https://cdn.who.int/media/docs/default-source/health-care-readiness/clinical-guidelines-for-influenza---translation-summary-french.pdf" target="_blank" rel="noopener">OMS, lignes directrices cliniques sur la grippe, 2024, résumé officiel</a> ; <a href="https://doi.org/10.1093/cid/ciy866" target="_blank" rel="noopener">Uyeki, IDSA 2018</a>.</p></template>

<template data-pop="j10-ph-paracetamol" data-title="Paracétamol dans la grippe"><p class="lab">Fonction et cible</p><p>Le paracétamol diminue la fièvre et les myalgies par une action surtout centrale. Il ne modifie pas la réplication virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une petite fraction est transformée en métabolite réactif, neutralisé par le glutathion hépatique. Le jeûne, l’alcool et la dénutrition réduisent ce glutathion ; un surdosage dépasse la capacité de neutralisation et lèse le foie.</p><p class="lab">Conséquence clinique</p><p>Adulte de plus de 40 kg : 500 à 1 000 mg par prise, avec 4 à 8 heures entre les prises, sans dépasser 4 000 mg par jour. Vérifier l’absence de paracétamol dans les spécialités combinées contre le rhume.</p><div class="key"><b>Limite.</b> Le plafond n’est pas un objectif. Le médecin réduit la dose en cas de dénutrition, d’alcoolisme ou d’hépatopathie, car ces états abaissent les réserves hépatiques de glutathion.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1547675-paracetamol-sandoz-eco-cpr-500-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Paracétamol Sandoz eco, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-ains" data-title="Anti-inflammatoires non stéroïdiens dans la grippe"><p class="lab">Fonction et cible</p><p>Les AINS inhibent les cyclo-oxygénases et la synthèse des prostaglandines : ils diminuent la fièvre et la douleur.</p><p class="lab">Mécanisme de l’affirmation</p><p>Quand la volémie baisse, les prostaglandines dilatent l’artériole afférente et maintiennent la filtration glomérulaire. La fièvre, les vomissements et la faible prise de boissons réduisent la volémie ; un AINS supprime alors cette compensation et peut provoquer une insuffisance rénale aiguë. L’association à un diurétique ou à un inhibiteur du système rénine-angiotensine renforce ce risque.</p><p class="lab">Conséquence clinique</p><p>L’information suisse de Brufen contre-indique l’ibuprofène en cas d’insuffisance rénale grave (clairance inférieure à 30 ml/min), d’insuffisance cardiaque NYHA III–IV, d’ulcère actif, de bronchospasme après un AINS et au troisième trimestre de la grossesse. Préférer le paracétamol chez la personne âgée, déshydratée ou insuffisante rénale.</p><div class="key"><b>Limite.</b> Chez l’adulte jeune bien hydraté, une prise brève à la dose minimale efficace reste possible.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/13700-brufen-cpr-pell-400-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Brufen, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-vaccin" data-title="Vaccin grippal inactivé : mécanisme et limites"><p class="lab">Fonction et cible</p><p>Le vaccin inactivé fragmenté apporte l’hémagglutinine et la neuraminidase des souches choisies, sans virus capable de se répliquer.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les anticorps dirigés contre la tête de l’hémagglutinine empêchent la fixation du virus sur l’acide sialique. Leur titre atteint un niveau protecteur environ deux semaines après l’injection, puis diminue en quelques mois. La dérive antigénique modifie chaque année l’hémagglutinine ; l’OMS adapte donc la composition, aujourd’hui trivalente : A(H1N1), A(H3N2) et B lignée Victoria.</p><p class="lab">Conséquence clinique</p><p>La vaccination est annuelle, de la mi-octobre au début de l’épidémie. Elle est possible le même jour qu’un vaccin contre la COVID-19. Jusqu’à 25 % des personnes ont une douleur ou une rougeur locale, environ 5 % de la fièvre ou des myalgies brèves selon l’OFSP.</p><div class="key"><b>Limite.</b> L’efficacité varie selon la concordance entre souches vaccinales et circulantes, et selon l’âge. Elle réduit le risque sans l’annuler ; c’est pourquoi les contacts sont aussi vaccinés.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-saisonniere-influenza" target="_blank" rel="noopener">OFSP, grippe saisonnière, consultée le 08.10.2026</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Efluelda TIV 2026/2027, consultée le 08.10.2026</a>.</p></template>

<template data-pop="j10-ph-hautedose" data-title="Vaccin à haute dose après 65 ans"><p class="lab">Fonction et cible</p><p>Le vaccin à haute dose compense la réponse immunitaire plus faible du sujet âgé.</p><p class="lab">Mécanisme de l’affirmation</p><p>Avec l’âge, les lymphocytes B et T naïfs diminuent et la coopération entre ces cellules devient moins efficace : c’est l’immunosénescence. Efluelda contient 60 µg d’hémagglutinine par souche, contre 15 µg pour un vaccin standard. Cette quantité plus grande produit des titres d’anticorps plus élevés.</p><p class="lab">Conséquence clinique</p><p>Dans l’essai de Diaz Granados (31 989 personnes de 65 ans et plus), la grippe confirmée est passée de 1,9 % à 1,4 %, soit une efficacité relative de 24,2 % (intervalle de confiance à 95 % : 9,7 à 36,5). L’OFSP préfère ce vaccin dès 75 ans et dès 65 ans avec un facteur de risque supplémentaire.</p><div class="key"><b>Limite.</b> La réactogénicité est plus élevée : douleur locale chez 41 % et myalgies chez 22,5 % selon l’information suisse. Le vaccin n’est indiqué ni avant 65 ans ni pendant la grossesse.</div><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1315727" target="_blank" rel="noopener">Diaz Granados, New England Journal of Medicine 2014</a> ; <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Efluelda TIV 2026/2027, consultée le 08.10.2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/uVW8vXtLz1-S/empfehlung-grippeimpfung-kurz.pdf" target="_blank" rel="noopener">OFSP, état février 2025</a>.</p></template>

<template data-pop="j10-ph-ci-vaccin" data-title="Contre-indications vaccinales et allergie à l’œuf"><p class="lab">Fonction et cible</p><p>Identifier les rares personnes qui ne doivent pas recevoir le vaccin ou qui doivent le recevoir sous précautions.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une anaphylaxie peut viser un antigène, un excipient ou une trace de fabrication. Les vaccins cultivés sur œufs peuvent contenir des traces d’ovalbumine et de formaldéhyde. Une infection aiguë modérée à sévère rend difficile l’interprétation d’un effet indésirable. Un syndrome de Guillain et Barré après un vaccin antérieur pourrait relever d’un mécanisme auto-immun.</p><p class="lab">Conséquence clinique</p><p>L’information suisse d’Efluelda (décembre 2024) contre-indique le vaccin en cas d’hypersensibilité aux composants ou aux traces d’œuf et de formaldéhyde. Elle demande de différer la vaccination pendant une infection modérée à sévère, de peser le risque après un syndrome de Guillain et Barré survenu dans les 6 semaines, et d’être prudent en cas de trouble de la coagulation. L’ACIP 2024–2025, plus ancienne, ne demande aucune précaution particulière liée à l’allergie à l’œuf, car la quantité d’ovalbumine est très faible.</p><div class="key"><b>Limite.</b> En Suisse, l’information professionnelle du produit fait foi. Une allergie grave à l’œuf demande un avis allergologique et une vaccination dans une structure capable de traiter une anaphylaxie, plutôt que l’absence de vaccination.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1656901-efluelda-tiv-susp-inj-2026-2027/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Efluelda TIV 2026/2027, consultée le 08.10.2026</a> ; <a href="https://www.cdc.gov/mmwr/volumes/73/rr/rr7305a1.htm" target="_blank" rel="noopener">CDC, recommandations de l’ACIP 2024–2025</a>.</p></template>

<template data-pop="pareto-j10-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j10-p-1,j10-p-2,j10-p-3,j10-p-4,j10-p-5,j10-p-6,j10-p-7,j10-p-8"></p><ul><li>Oseltamivir et baloxavir sont les antiviraux de référence en Suisse ; les adamantanes sont obsolètes.</li><li>Grippe grave ou hospitalisée : oseltamivir 5 jours. Non grave, 85 ans et plus ou immunodéprimé : baloxavir dans les 48 heures (Société suisse d’infectiologie 2026). Autre risque élevé : décision partagée. Risque faible : pas d’antiviral. Antiviraux en règle non remboursés.</li><li>Oseltamivir 75 mg deux fois par jour pendant 5 jours ; adapter dès une clairance de 60 ml/min. Baloxavir 40 mg ou 80 mg en dose unique dans les 48 heures.</li><li>Résistances : H275Y pour l’oseltamivir, I38T pour le baloxavir.</li><li>Baloxavir à distance des cations polyvalents ; zanamivir jamais nébulisé ; antiviral incompatible avec le vaccin vivant.</li><li>Pas d’aspirine chez l’enfant ou l’adolescent ; pas d’antibiotique ni de corticostéroïde sans indication propre ; paracétamol en premier choix.</li><li>Vaccin inactivé annuel dès la mi-octobre ; haute dose dès 75 ans ou dès 65 ans avec un facteur de risque.</li></ul></template>
