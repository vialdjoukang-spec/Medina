<section class="ilot" id="j90-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 71 ans consulte son médecin de famille pour une dyspnée d’effort apparue il y a six semaines. Il monte désormais un étage au lieu de trois. Il a perdu 4 kg sans régime. Il a travaillé trente ans comme électricien dans la construction, de 1968 à 1998, et a fumé 30 paquets-années jusqu’à 60 ans. À l’examen, la base droite est mate jusqu’à la pointe de l’omoplate, et le murmure vésiculaire y est aboli. La radiographie montre une opacité homogène des deux tiers inférieurs de l’hémithorax droit.</p>
<p>Trois questions organisent tout le cours. <b>Ce liquide est-il un transsudat, qui traduit un déséquilibre des pressions, ou un exsudat, qui traduit une maladie de la plèvre elle-même ? Quelle est sa cause ? Faut-il l’évacuer en urgence, le drainer, ou traiter seulement la maladie causale ?</b></p>
<p>À la fin du cours, le médecin assistant sait reconnaître un épanchement à l’anamnèse, à l’examen et à l’échographie. Il sait indiquer et réaliser une <button class="w" data-k="j90-ponction">ponction pleurale guidée par l’échographie (technique et sécurité)</button>. Il sait appliquer les <button class="w" data-k="j90-light">critères de Light (transsudat ou exsudat)</button>, interpréter le pH d’un épanchement parapneumonique, reconnaître un chylothorax, un hémothorax et des plaques pleurales liées à l’amiante, et proposer un traitement adapté à la cause. La référence principale est la <button class="w" data-k="j90-bts">guideline de la British Thoracic Society 2023 (recommandations et niveau de preuve)</button>, utilisée en Suisse faute de recommandation nationale propre.</p>
<div class="key"><b>Message fondateur.</b> Un épanchement pleural est un signe et non un diagnostic. Le liquide est un échantillon direct du processus qui le produit : sa ponction précoce répond le plus souvent à la question de la cause. Un épanchement unilatéral inexpliqué doit donc être ponctionné, sauf si le contexte clinique impose une explication évidente, comme une insuffisance cardiaque bilatérale typique qui répond aux diurétiques.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="starlingcap">équilibre de Starling capillaire (pressions hydrostatique et oncotique)</button>, l’<button class="w" data-k="j90-anat">anatomie de la plèvre (feuillets, innervation, drainage lymphatique)</button> et la <button class="w" data-k="j90-turnover">formation et la résorption normales du liquide pleural</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
<div class="key"><b>À retenir.</b> Le cours suit une démarche en trois temps : confirmer l’épanchement, en déterminer la nature par la ponction, puis traiter la cause et le liquide selon sa gravité. Le premier temps commence par des définitions précises.</div>
</section>

<section class="ilot" id="j90-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>La cavité pleurale normale contient environ 0,26 mL/kg de liquide, soit 18 mL chez un adulte de 70 kg (Noppen, 2000). Ce film sépare les plèvres pariétale et viscérale et permet leur glissement. Un <b>épanchement pleural</b> est une accumulation de liquide au-delà de ce volume physiologique. Il devient détectable à l’échographie dès quelques dizaines de millilitres et sur la radiographie de face vers 200 mL.</p>
<h3>1.1 Transsudat et exsudat</h3>
<p>La distinction fondamentale porte sur le mécanisme. Un <b>transsudat</b> se forme quand les pressions hydrostatique ou oncotique sont modifiées alors que la plèvre est saine : le liquide filtré est pauvre en protéines et en cellules. Un <b>exsudat</b> se forme quand la plèvre elle-même est malade, par inflammation, infection ou envahissement tumoral : la perméabilité capillaire augmente, ou le drainage lymphatique est bloqué, et le liquide s’enrichit en protéines et en lactate déshydrogénase.</p>
<p>Cette distinction oriente immédiatement la suite. Un transsudat se traite en corrigeant la cause générale (insuffisance cardiaque, cirrhose, syndrome néphrotique) sans explorer davantage la plèvre. Un exsudat impose de chercher une maladie pleurale ou de voisinage : cancer, infection, embolie pulmonaire, tuberculose ou maladie auto-immune.</p>
<h3>1.2 Classifications utiles en pratique</h3>
<p>Plusieurs classifications répondent à des questions différentes. Le tableau suivant les rassemble pour éviter de les confondre.</p>
<table class="t"><tr><th>Axe</th><th>Catégories</th><th>Décision qu’il oriente</th></tr>
<tr><td>Mécanisme</td><td>Transsudat ; exsudat</td><td>Explorer ou non la plèvre</td></tr>
<tr><td>Aspect macroscopique</td><td>Citrin ; hémorragique ; purulent ; laiteux</td><td>Hypothèse immédiate et analyses ciblées</td></tr>
<tr><td>Cellule dominante</td><td>Neutrophiles ; lymphocytes ; éosinophiles</td><td>Processus aigu, chronique ou particulier</td></tr>
<tr><td>Infection pleurale</td><td>Parapneumonique simple ; compliqué ; empyème</td><td>Ponction seule ou drainage</td></tr>
<tr><td>Latéralité</td><td>Unilatéral ; bilatéral</td><td>Cause locale ou générale</td></tr>
<tr><td>Évolution</td><td>Aigu ; récidivant ; chronique avec poumon non expansible</td><td>Évacuation, symphyse ou cathéter</td></tr></table>
<p>L’axe mécanistique se lit en premier, car il détermine si l’on explore la plèvre. Les autres axes affinent ensuite l’hypothèse. Exemple : un liquide citrin, exsudatif et lymphocytaire chez un homme de 71 ans exposé à l’amiante oriente d’abord vers un cancer pleural ou une tuberculose, et non vers une pneumonie. L’erreur fréquente consiste à conclure sur l’aspect seul : un liquide citrin peut être malin, et un liquide hémorragique peut provenir d’une embolie pulmonaire.</p>
<h3>1.3 Codage CIM-10-GM 2024</h3>
<p>Le bloc J90-J94 regroupe les autres affections de la plèvre. Le codage distingue les épanchements selon leur cause et selon qu’une autre maladie les explique. Le tableau ci-dessous suit la version 2024 publiée par le BfArM, consultée le 08.10.2026.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Inclusions et exclusions principales</th></tr>
<tr><td>J90</td><td>Épanchement pleural, non classé ailleurs</td><td>Inclut la pleurésie avec épanchement. Exclut le chylothorax (J94.0), la pleurésie sans précision (R09.1) et la tuberculose (A15-A16)</td></tr>
<tr><td>J91*</td><td>Épanchement pleural au cours de maladies classées ailleurs</td><td>Code astérisque, sans subdivision en 2024 ; il accompagne le code de la maladie causale</td></tr>
<tr><td>J92.0</td><td>Plaque pleurale avec mise en évidence d’amiante</td><td>Le titre allemand dit « mit Nachweis von Asbest »</td></tr>
<tr><td>J92.9</td><td>Plaque pleurale sans mise en évidence d’amiante</td><td>Inclut la plaque pleurale sans précision ; le bloc J92 inclut l’épaississement pleural</td></tr>
<tr><td>J94.0</td><td>Épanchement chyleux</td><td>Inclut l’épanchement chyliforme</td></tr>
<tr><td>J94.1</td><td>Fibrothorax</td><td>Gangue pleurale fibreuse qui enserre le poumon</td></tr>
<tr><td>J94.2</td><td>Hémothorax</td><td>Inclut l’hémopneumothorax non traumatique ; le traumatique relève de S27.1 et S27.2</td></tr>
<tr><td>J94.8</td><td>Autres affections pleurales précisées</td><td>Inclut l’hydrothorax sans précision</td></tr>
<tr><td>J94.9</td><td>Affection pleurale, sans précision</td><td>Code d’attente, à éviter quand la cause est connue</td></tr></table>
<p>Le premier réflexe de codage consiste à chercher si une autre maladie explique l’épanchement. Dans ce cas, la convention dague-astérisque associe le code de cette maladie au code J91*. Exemple : un épanchement par atteinte pleurale métastatique se code par C78.2 suivi de J91*. L’erreur fréquente consiste à coder J90 pour tout épanchement : ce code est réservé aux épanchements non classés ailleurs. Le pyothorax relève de J86, le pneumothorax de J93, et l’épanchement tuberculeux de A15-A16 ; ces entités ont leurs propres cours.</p>
<div class="trap"><span class="k">Piège</span>La traduction française de la CIM-10-GM rend J92.0 par « plaque pleurale avec asbestose ». Le texte allemand de référence parle de mise en évidence d’amiante et non d’asbestose, qui est une fibrose pulmonaire. Une plaque pleurale peut exister sans asbestose, et c’est même le cas le plus fréquent.</div>
<div class="key"><b>À retenir.</b> Le transsudat signe un déséquilibre des pressions avec plèvre saine ; l’exsudat signe une maladie pleurale ou de voisinage. Le codage suit la cause : J91* lorsqu’une maladie classée ailleurs explique l’épanchement, J90 seulement en l’absence d’une telle cause. La fréquence relative de ces causes conditionne la probabilité de chaque diagnostic.</div>
</section>

<section class="ilot" id="j90-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les épanchements pleuraux sont fréquents. Aux États-Unis, Light estimait en 2002 leur nombre à environ 1,5 million par an. Les causes les plus fréquentes y étaient, par ordre décroissant, l’insuffisance cardiaque (environ 500 000 cas), la pneumonie (environ 300 000), le cancer (environ 200 000) et l’embolie pulmonaire (environ 150 000) (Light, New England Journal of Medicine, 2002). <b>Aucune donnée d’incidence suisse publiée n’a été trouvée</b> ; la répartition des causes en Suisse est vraisemblablement proche de celle des pays européens à faible prévalence de tuberculose, mais cette transposition reste une hypothèse.</p>
<p>Le pronostic dépend de la cause et non du volume. L’épanchement de l’insuffisance cardiaque régresse avec le traitement diurétique. Un épanchement malin signe une maladie cancéreuse avancée : dans la cohorte de Clive (Thorax, 2014), la survie médiane globale était de 136 jours, de 74 jours pour le cancer bronchique et de 339 jours pour le mésothéliome. Le <button class="w" data-k="j90-lent">score LENT (pronostic de l’épanchement malin)</button> affine cette estimation.</p>
<p>L’infection pleurale reste grave. Dans l’introduction de l’essai MIST2, plus de 30 % des patients atteints d’infection pleurale décédaient ou nécessitaient une chirurgie (Rahman, New England Journal of Medicine, 2011). La déclaration ERS/ESTS de 2023 rapporte une incidence en hausse dans les données épidémiologiques récentes. Le <button class="w" data-k="j90-rapid">score RAPID (risque de décès de l’infection pleurale)</button> stratifie ce risque dès l’admission.</p>
<div class="key"><b>À retenir.</b> L’insuffisance cardiaque, la pneumonie, le cancer et l’embolie pulmonaire expliquent la majorité des épanchements. Le pronostic dépend de la cause : il est bon pour un transsudat traité, réservé pour une infection pleurale et sombre pour un épanchement malin. Comprendre pourquoi le liquide s’accumule permet de déduire ces causes.</div>
</section>

<section class="ilot" id="j90-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 État normal : un flux et non un stock</h3>
<p>Le liquide pleural est filtré en continu par les capillaires de la plèvre pariétale, qui dépendent de la circulation systémique et ont donc une pression hydrostatique élevée. Il est résorbé par les <button class="w" data-k="j90-stomates">stomates lymphatiques de la plèvre pariétale (voie de sortie unique)</button>. La capacité de drainage lymphatique dépasse largement la production normale : le liquide ne s’accumule que si la production dépasse cette capacité, ou si le drainage est bloqué. Cette réserve explique qu’une augmentation modérée de la filtration ne produise pas d’épanchement.</p>
<h3>3.2 Six mécanismes d’accumulation</h3>
<p>Chaque mécanisme correspond à un groupe de causes. Les connaître permet de raisonner devant un épanchement inhabituel.</p>
<table class="t"><tr><th>Mécanisme</th><th>Type de liquide</th><th>Exemple</th></tr>
<tr><td>Hausse de la pression hydrostatique capillaire</td><td>Transsudat</td><td>Insuffisance cardiaque gauche ou globale</td></tr>
<tr><td>Baisse de la pression oncotique</td><td>Transsudat</td><td>Syndrome néphrotique, hypoalbuminémie sévère</td></tr>
<tr><td>Baisse de la pression pleurale</td><td>Transsudat</td><td>Atélectasie, poumon non expansible</td></tr>
<tr><td>Passage de liquide péritonéal</td><td>Transsudat</td><td>Cirrhose avec ascite, dialyse péritonéale</td></tr>
<tr><td>Hausse de la perméabilité capillaire</td><td>Exsudat</td><td>Pneumonie, embolie pulmonaire, lupus, cancer</td></tr>
<tr><td>Blocage du drainage lymphatique</td><td>Exsudat</td><td>Envahissement tumoral des stomates ou des ganglions médiastinaux</td></tr></table>
<p>La lecture du tableau commence par la colonne du type de liquide : les quatre premiers mécanismes laissent la plèvre intacte et donnent un transsudat. Exemple : chez une patiente cirrhotique avec ascite, le liquide passe du péritoine vers la plèvre par des <button class="w" data-k="j90-hydrothorax">défauts du diaphragme (hydrothorax hépatique)</button>, surtout à droite. Le liquide pleural garde alors les caractéristiques d’un transsudat, sans maladie pleurale.</p>
<h3>3.3 Insuffisance cardiaque : pourquoi le poumon participe</h3>
<p>Dans l’insuffisance cardiaque, l’élévation de la pression veineuse pulmonaire provoque d’abord un œdème interstitiel. Une partie de ce liquide traverse la plèvre viscérale et rejoint la cavité pleurale. Ce mécanisme explique que l’épanchement cardiaque soit lié à la pression capillaire pulmonaire, qu’il soit souvent bilatéral, et qu’il prédomine à droite lorsqu’il est unilatéral.</p>
<h3>3.4 Inflammation et infection : du liquide libre aux logettes</h3>
<p>Une pneumonie au contact de la plèvre augmente la perméabilité capillaire : le liquide est d’abord libre et stérile. Si les bactéries envahissent la cavité, les neutrophiles et les bactéries consomment le glucose et produisent du lactate et du dioxyde de carbone. Le <button class="w" data-k="j90-ph">pH pleural baisse (marqueur métabolique de l’infection)</button>. La fibrine se dépose, forme des cloisons et crée des logettes que le drain ne vide plus. Cette chaîne justifie le drainage précoce lorsque le pH est bas.</p>
<h3>3.5 Cancer : deux mécanismes</h3>
<p>Les cellules tumorales qui tapissent la plèvre augmentent la perméabilité capillaire, notamment par le <button class="w" data-k="j90-vegf">facteur de croissance de l’endothélium vasculaire (perméabilité tumorale)</button>. Elles obstruent aussi les stomates lymphatiques et les ganglions médiastinaux. Ce double mécanisme explique le volume souvent important et la récidive rapide après ponction. Un épanchement peut aussi accompagner un cancer sans atteinte pleurale directe, par obstruction bronchique ou lymphatique : on parle d’épanchement paramalin.</p>

<div class="key"><b>À retenir.</b> Le liquide pleural est un flux. Les transsudats naissent de pressions anormales sur une plèvre saine ; les exsudats naissent d’une plèvre perméable ou d’un drainage lymphatique bloqué. Le pH bas de l’infection traduit le métabolisme des bactéries et des neutrophiles. Ces mécanismes se traduisent par une liste d’étiologies hiérarchisée.</div>

<section class="ilot" id="j90-4"><h2><span class="n">4</span>Étiologies</h2>
<p>La recherche de la cause suit le mécanisme. Le tableau ci-dessous reprend les causes fréquentes et moins fréquentes retenues par la BTS 2023 (tableau 2 du résumé de la guideline).</p>
<table class="t"><tr><th></th><th>Transsudats</th><th>Exsudats</th></tr>
<tr><td>Fréquents</td><td>Insuffisance cardiaque ; cirrhose ; hypoalbuminémie ; syndrome néphrotique</td><td>Cancer ; infection pleurale ; embolie pulmonaire ; pleurésie auto-immune</td></tr>
<tr><td>Moins fréquents</td><td>Sténose mitrale ; dialyse péritonéale ; hypothyroïdie chronique ; péricardite constrictive</td><td>Médicaments ; maladies lymphatiques ; syndrome de Meigs ; suites de pontage aortocoronarien ; épanchement bénin lié à l’amiante</td></tr></table>
<p>Le tableau se lit en commençant par la ligne des causes fréquentes. Exemple : chez une femme de 82 ans dyspnéique avec épanchement bilatéral, des œdèmes et un NT-proBNP élevé, l’insuffisance cardiaque est de loin la cause la plus probable. Le piège est l’<button class="w" data-k="j90-ep">embolie pulmonaire (cause d’exsudat souvent oubliée)</button> : elle peut donner un petit épanchement, souvent exsudatif, parfois hémorragique, et elle ne se diagnostique pas par la ponction mais par l’angiographie pulmonaire.</p>
<h3>4.1 Épanchements à lymphocytes</h3>
<p>Un exsudat à prédominance lymphocytaire, au-delà de 50 % des cellules, réduit la liste. Selon la BTS 2023, les causes principales sont le cancer, la <button class="w" data-k="j90-tb">pleurésie tuberculeuse (adénosine désaminase et biopsie)</button>, le lymphome, l’insuffisance cardiaque, les suites de pontage aortocoronarien, la polyarthrite rhumatoïde, le chylothorax et le syndrome des ongles jaunes.</p>
<h3>4.2 Épanchements bilatéraux</h3>
<p>Un épanchement bilatéral oriente d’abord vers une cause générale : insuffisance cardiaque, hypoalbuminémie, insuffisance rénale ou hépatique. Les autres causes sont le lupus et les maladies auto-immunes, un cancer diffus y compris abdominal ou pelvien, et une embolie pulmonaire bilatérale (BTS 2023, tableau 4). Un épanchement bilatéral de volumes très différents, ou associé à une douleur thoracique ou à de la fièvre, doit faire ponctionner le côté le plus abondant.</p>
<h3>4.3 Médicaments</h3>
<p>Plusieurs médicaments provoquent un exsudat, parfois à éosinophiles. Les plus cités sont l’amiodarone, le méthotrexate, la nitrofurantoïne, le dasatinib et les dérivés de l’ergot de seigle comme la bromocriptine et la cabergoline. Les molécules responsables d’un lupus induit, comme l’hydralazine, agissent par un mécanisme auto-immun. La liste complète et actualisée se consulte dans la <button class="w" data-k="j90-pneumotox">base Pneumotox (médicaments et plèvre)</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer un épanchement unilatéral à une insuffisance cardiaque connue sans ponction. L’épanchement cardiaque est habituellement bilatéral. Un épanchement unilatéral gauche, fébrile, douloureux ou qui ne régresse pas sous diurétique doit être ponctionné, car une autre cause peut coexister.</div>
<div class="key"><b>À retenir.</b> Quatre causes dominent : insuffisance cardiaque, pneumonie, cancer et embolie pulmonaire. Un exsudat lymphocytaire oriente vers le cancer et la tuberculose ; un épanchement bilatéral oriente vers une cause générale. L’anamnèse permet souvent de privilégier une hypothèse avant la ponction.</div>
</section>

<section class="ilot" id="j90-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche la cause et mesure le retentissement. Le médecin interroge d’abord les antécédents qui modifient la probabilité de chaque groupe de causes, puis les symptômes respiratoires et généraux.</p>
<h3>5.1 Antécédents à rechercher</h3>
<p>Le médecin recherche une <button class="w" data-k="j90-a-cardio">cardiopathie, une cirrhose ou une néphropathie (causes de transsudat)</button>. Il recherche un <button class="w" data-k="j90-a-cancer">cancer connu ou des signes de cancer (sein, poumon, lymphome, ovaire)</button>. Il établit l’<button class="w" data-k="j90-a-amiante">exposition à l’amiante (métiers, durée, latence)</button>, car elle oriente vers les plaques pleurales, l’épanchement bénin lié à l’amiante et le mésothéliome. Il recherche un <button class="w" data-k="j90-a-tb">contact tuberculeux ou un séjour en pays de forte endémie</button>. Il note les <button class="w" data-k="j90-a-med">médicaments et anticoagulants (cause et risque de ponction)</button>, une <button class="w" data-k="j90-a-auto">maladie auto-immune (lupus, polyarthrite rhumatoïde)</button> et une <button class="w" data-k="j90-a-chir">chirurgie ou un traumatisme thoracique récent (chylothorax, hémothorax)</button>.</p>
<h3>5.2 Symptômes</h3>
<p>La <button class="w" data-k="j90-s-dysp">dyspnée (mécanisme et lien avec le volume)</button> est le symptôme principal. Elle dépend moins du volume que de la vitesse de constitution et de la fonction respiratoire antérieure. La <button class="w" data-k="j90-s-doul">douleur pleurétique (inflammation de la plèvre pariétale)</button> est latérale, augmentée par l’inspiration profonde et la toux ; elle traduit une inflammation pariétale et s’atténue souvent quand le liquide sépare les deux feuillets. La <button class="w" data-k="j90-s-toux">toux sèche (irritation et compression)</button> est fréquente. La <button class="w" data-k="j90-s-gen">fièvre, la perte de poids et les sueurs (signes de cause infectieuse ou maligne)</button> orientent l’enquête.</p>
<div class="two">
<div class="card"><h4>Forme typique de l’exsudat malin</h4><p>Un patient âgé, souvent ancien fumeur ou exposé à l’amiante, décrit une dyspnée progressive sur quelques semaines, une perte de poids et parfois une douleur thoracique sourde et continue. L’épanchement est unilatéral, abondant et récidive vite après ponction.</p></div>
<div class="card"><h4>Forme typique de l’épanchement parapneumonique</h4><p>Un patient traité pour une pneumonie garde de la fièvre au-delà de 48 à 72 heures d’antibiotique, ou voit sa douleur pleurétique persister. Cette évolution évoque une infection de la cavité pleurale et impose une échographie puis une ponction.</p></div>
<div class="card"><h4>Forme atypique du sujet âgé</h4><p>Le seul signe est une baisse de l’état général, une chute ou une confusion. La dyspnée est absente parce que le patient est peu actif. L’épanchement est découvert sur une radiographie faite pour une autre raison.</p></div>
<div class="card"><h4>Forme atypique de découverte fortuite</h4><p>Un épanchement modéré ou des plaques calcifiées apparaissent sur une imagerie demandée pour un autre motif. L’absence de symptômes ne dispense pas d’en chercher la cause lorsque l’épanchement est unilatéral et inexpliqué.</p></div></div>
<div class="key"><b>À retenir.</b> Les antécédents décisifs sont la cardiopathie, le cancer, l’amiante, la tuberculose, les médicaments et la chirurgie récente. La dyspnée mesure le retentissement ; la fièvre et la perte de poids orientent vers l’infection et le cancer. L’examen clinique confirme ensuite la présence et l’abondance du liquide.</div>
</section>

<section class="ilot" id="j90-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen confirme l’épanchement, estime son abondance et cherche une cause générale. Il suit l’ordre habituel : état général, signes vitaux, puis examen thoracique et recherche des signes de la cause.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin note l’état général, l’amaigrissement et la position adoptée. Il mesure la <button class="w" data-k="j90-v-fr">fréquence respiratoire et la saturation (retentissement)</button>, la fréquence cardiaque, la pression artérielle et la température. Une fréquence respiratoire supérieure à 25 par minute avec une saturation basse indique un épanchement mal toléré qui peut justifier une évacuation rapide.</p></div>
<div class="card"><h4>Examen thoracique : le normal d’abord</h4><p>Chez le sujet sain, la percussion est sonore, les vibrations vocales sont transmises symétriquement et le murmure vésiculaire est entendu aux deux bases. Le côté sain sert de référence pour chaque comparaison.</p></div>
<div class="card"><h4>Signes de l’épanchement</h4><p>La <button class="w" data-k="j90-x-mat">matité déclive (percussion)</button> est le signe le plus utile. Les <button class="w" data-k="j90-x-vib">vibrations vocales sont abolies (palpation)</button> et le <button class="w" data-k="j90-x-mv">murmure vésiculaire est diminué ou aboli (auscultation)</button>. Un <button class="w" data-k="j90-x-frott">frottement pleural (plèvres inflammatoires)</button> s’entend parfois au début ou à la résorption.</p></div>
<div class="card"><h4>Signes d’abondance et de cause</h4><p>Une <button class="w" data-k="j90-x-trachee">déviation de la trachée vers le côté opposé (épanchement massif)</button> signe un épanchement compressif. Les œdèmes, la turgescence jugulaire et un troisième bruit orientent vers l’insuffisance cardiaque. L’ascite et les signes d’hépatopathie orientent vers l’hydrothorax hépatique. Les adénopathies, l’hippocratisme digital et l’examen des seins orientent vers un cancer.</p></div></div>
<div class="trap"><span class="k">Piège</span>Une opacité complète d’un hémithorax sans déviation de la trachée vers le côté opposé doit faire suspecter une atélectasie associée par obstruction bronchique, souvent tumorale. Les deux processus s’opposent : l’épanchement repousse, l’atélectasie attire. L’évacuation du liquide n’améliorera alors pas la dyspnée, car le poumon ne peut pas se réexpandre.</div>
<button class="pareto-btn ui" data-k="pareto-j90-clin">▲ Loi de Pareto — Définitions, mécanismes et clinique</button>
<div class="key"><b>À retenir.</b> La triade matité, abolition des vibrations vocales et diminution du murmure vésiculaire signe l’épanchement. La position de la trachée renseigne sur l’abondance et sur une atélectasie associée. L’examen confirme le liquide ; la ponction en établit la nature.</div>
</section>

<section class="ilot" id="j90-7"><h2><span class="n">7</span>Démarche diagnostique</h2>
<p>La démarche suit un ordre fixe. Elle confirme d’abord l’épanchement par l’imagerie, décide ensuite s’il faut ponctionner, puis classe le liquide et cherche la cause. La figure 2 reprend l’algorithme de la BTS 2023 pour l’épanchement unilatéral.</p>
<h3>7.1 Confirmer et caractériser par l’imagerie</h3>
<p>La radiographie thoracique de face détecte un épanchement à partir d’environ 200 mL par l’émoussement du cul-de-sac costodiaphragmatique. L’<button class="w" data-k="j90-echo">échographie thoracique (examen de chevet de premier choix)</button> détecte de plus petits volumes, repère les cloisons, guide la ponction et peut montrer des nodules pleuraux. La <button class="w" data-k="j90-tdm">tomodensitométrie thoracique injectée (plèvre, poumon, médiastin)</button> cherche une cause, de préférence avant l’évacuation complète, car le liquide restant permet de mieux voir la plèvre.</p>
<h3>7.2 Décider de ponctionner</h3>
<p>Selon la BTS 2023, un épanchement unilatéral inexpliqué doit être ponctionné, toujours sous guidage par l’imagerie (recommandation forte par consensus). La ponction n’est pas nécessaire lorsque le contexte explique clairement un transsudat, par exemple une insuffisance cardiaque avec épanchements bilatéraux symétriques qui régressent sous diurétique. Un NT-proBNP sérique élevé soutient alors le diagnostic d’insuffisance cardiaque (recommandation conditionnelle), sans être utilisé seul.</p>
<h3>7.3 Analyser le liquide</h3>
<p>La première ponction diagnostique demande un panel minimal : protéines et lactate déshydrogénase dans le liquide et dans le sang prélevés le même jour, pH en cas de suspicion d’infection, glucose, cytologie sur 25 à 50 mL, et examen bactériologique avec ensemencement de flacons d’hémoculture. Les <button class="w" data-k="j90-light">critères de Light</button> classent ensuite le liquide. Un exsudat est défini par au moins un des trois critères suivants.</p>
<table class="t"><tr><th>Critère de Light</th><th>Seuil d’exsudat</th></tr>
<tr><td>Protéines pleurales / protéines sériques</td><td>&gt; 0,5</td></tr>
<tr><td>Lactate déshydrogénase pleurale / lactate déshydrogénase sérique</td><td>&gt; 0,6</td></tr>
<tr><td>Lactate déshydrogénase pleurale</td><td>&gt; deux tiers de la limite supérieure de la normale sérique du laboratoire</td></tr></table>
<p>Le tableau s’applique dans l’ordre : un seul critère positif suffit pour classer en exsudat. Exemple chez le patient de l’îlot 0 : protéines 42 g/L dans le liquide et 68 g/L dans le sang, soit un rapport de 0,62 ; lactate déshydrogénase 410 UI/L dans le liquide et 220 UI/L dans le sang, soit un rapport de 1,86 ; la limite supérieure du laboratoire est 250 UI/L, dont les deux tiers valent 167 UI/L. Les trois critères sont positifs : il s’agit d’un exsudat. L’erreur fréquente est d’oublier le dosage sanguin simultané, sans lequel les deux premiers rapports sont impossibles.</p>
<div class="trap"><span class="k">Piège</span>Les critères de Light sont très sensibles pour l’exsudat, au prix d’une partie des transsudats classés à tort en exsudats. Le cas typique est l’insuffisance cardiaque traitée par diurétique, qui concentre les protéines du liquide. Un <button class="w" data-k="j90-gradient">gradient d’albumine sérum-liquide supérieur à 12 g/L (correction des faux exsudats)</button> ou un NT-proBNP sérique élevé rétablit alors le diagnostic de transsudat.</div>
<h3>7.4 Orienter selon l’aspect et la biologie</h3>
<p>L’aspect et quelques dosages ciblés orientent ensuite. Un liquide purulent signe un empyème. Un liquide laiteux fait doser triglycérides et cholestérol. Un liquide hémorragique fait mesurer l’hématocrite pleural. Un exsudat lymphocytaire fait doser l’adénosine désaminase et discuter une biopsie. Les fiches détaillées et le tableau des associations biologiques figurent dans l’onglet Examens complémentaires.</p>
<h3>7.5 Quand la cytologie ne conclut pas</h3>
<p>La cytologie du liquide est l’examen initial d’un épanchement malin suspecté, mais un résultat négatif ne l’exclut pas (BTS 2023). La <button class="w" data-k="j90-biopsie">biopsie pleurale sous thoracoscopie ou guidée par l’imagerie (examen de référence histologique)</button> devient alors nécessaire. La biopsie à l’aveugle n’est plus recommandée.</p>

<p>L’algorithme se lit de haut en bas. La première bifurcation sépare les transsudats évidents, traités sans ponction, des épanchements inexpliqués. La seconde sépare les exsudats dont la cause est établie dès la ponction de ceux qui exigent une imagerie en coupe et une biopsie. Chez le patient de l’îlot 0, la cytologie initiale est négative : il suit donc la branche de droite jusqu’à la biopsie.</p>
<div class="key"><b>À retenir.</b> L’échographie confirme et guide ; la ponction classe le liquide. Les critères de Light exigent les dosages sanguins simultanés et peuvent classer à tort un transsudat sous diurétique en exsudat. Une cytologie négative n’exclut pas un cancer. Certaines situations exigent une action immédiate, avant même la recherche de la cause.</div>

<section class="ilot" id="j90-8"><h2><span class="n">8</span>Urgences et complications</h2>
<div class="alert"><b>Situations qui imposent une action immédiate.</b><br>
<b>1. Épanchement massif mal toléré</b> : détresse respiratoire, hypoxémie, déviation de la trachée vers le côté opposé, hypotension. Le médecin réalise une ponction évacuatrice échoguidée sans attendre les résultats biologiques.<br>
<b>2. Infection pleurale avec liquide purulent ou pH ≤ 7,2</b> : le médecin pose un drain thoracique de petit calibre si le volume accessible le permet, et débute les antibiotiques ; voir le cours J85-J86.<br>
<b>3. Hémothorax</b> : hématocrite pleural au moins égal à la moitié de l’hématocrite sanguin. Le médecin mesure la tolérance hémodynamique, arrête si possible les anticoagulants, draine et demande un avis chirurgical si le saignement persiste.<br>
<b>4. Complications de la ponction</b> : pneumothorax, hémorragie, œdème de réexpansion, malaise vagal. Le médecin les recherche cliniquement après chaque geste.</div>
<p>L’ordre de l’encadré suit la gravité. La ponction évacuatrice d’un épanchement compressif soulage en quelques minutes, parce qu’elle diminue la pression pleurale et rend au diaphragme une position efficace. Le médecin retire au plus environ 1,5 L par séance, valeur conseillée par la déclaration BTS 2023 sur les procédures pleurales d’après des synthèses secondaires, et s’arrête si une toux, une oppression ou une douleur apparaît. Ces symptômes annoncent une chute excessive de la pression pleurale et un risque d’<button class="w" data-k="j90-reexp">œdème pulmonaire de réexpansion (mécanisme et prévention)</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Envoyer le prélèvement destiné au pH dans une seringue contenant de l’héparine ou de l’anesthésique local, ou le mesurer après un long délai. L’héparine et l’anesthésique abaissent le pH ; le délai l’élève. La BTS 2023 demande une mesure immédiate sur un analyseur de gaz du sang, prélèvement non contaminé.</div>
<button class="pareto-btn ui" data-k="pareto-j90-diag">▲ Loi de Pareto — Démarche diagnostique et urgences</button>
<div class="key"><b>À retenir.</b> Un épanchement compressif s’évacue avant toute enquête étiologique, sans dépasser environ 1,5 L par séance. Un pH ≤ 7,2 dans un contexte infectieux impose un drain. L’hématocrite pleural distingue un hémothorax d’un épanchement simplement teinté. Le traitement de fond dépend ensuite de la cause.</div>
</section>
