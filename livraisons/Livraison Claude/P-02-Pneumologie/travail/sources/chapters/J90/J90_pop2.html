<!-- ===== FENÊTRES : examens, scores et complications ===== -->
<template data-pop="j90-ponction" data-title="Ponction pleurale">
<div class="lab">Indications</div><p>Diagnostique : tout épanchement unilatéral inexpliqué, toute suspicion d’infection pleurale. Évacuatrice : épanchement symptomatique, en particulier compressif.</p>
<div class="lab">Technique</div><p>Le patient est assis, penché en avant, bras appuyés. L’échographie repère le point de ponction, la profondeur du liquide et l’absence de poumon ou d’organe abdominal sur le trajet ; la BTS 2023 exige ce guidage par l’imagerie (recommandation forte par consensus). Après asepsie et anesthésie locale, l’aiguille passe au ras du bord supérieur de la côte inférieure, sur la ligne axillaire moyenne ou postérieure.</p>
<div class="lab">Prélèvements</div><p>Seringue sans héparine pour le pH, analysée immédiatement sur l’analyseur de gaz du sang. Tubes secs pour biochimie et cellules. 25 à 50 mL pour la cytologie. 5 à 10 mL dans des flacons d’hémoculture aérobie et anaérobie si une infection est possible, et un tube stérile. Sang veineux le même jour pour protéines et lactate déshydrogénase.</p>
<div class="lab">Évacuation</div><p>Écoulement lent, sans aspiration murale ni bouteille sous vide ; arrêt vers 1,5 L ou plus tôt si toux, oppression ou douleur apparaissent.</p>
<div class="lab">Complications</div><p>Pneumothorax, hémorragie par blessure de l’artère intercostale, malaise vagal, œdème de réexpansion, ponction d’un organe abdominal. Le guidage échographique en réduit la fréquence.</p></template>

<template data-pop="j90-light" data-title="Critères de Light">
<div class="lab">Énoncé</div><p>Le liquide est un exsudat si au moins un critère est présent : rapport des protéines pleurales sur sériques &gt; 0,5 ; rapport de la lactate déshydrogénase pleurale sur sérique &gt; 0,6 ; lactate déshydrogénase pleurale &gt; deux tiers de la limite supérieure de la normale sérique du laboratoire (Light, 1972 ; repris par la BTS 2023).</p>
<div class="lab">Pourquoi ils fonctionnent</div><p>Les protéines traduisent la perméabilité de la membrane ; la lactate déshydrogénase traduit l’inflammation et la lyse cellulaire locales. Une plèvre saine laisse passer peu de protéines et ne libère pas d’enzyme.</p>
<div class="lab">Valeur</div><p>Les critères sont très sensibles pour l’exsudat : ils en manquent très peu. En contrepartie, ils classent à tort une partie des transsudats en exsudats, surtout chez l’insuffisant cardiaque traité par diurétique.</p>
<div class="lab">Exemple</div><p>Protéines 42/68 = 0,62 ; lactate déshydrogénase 410/220 = 1,86 ; 410 &gt; 167 UI/L. Trois critères positifs : exsudat.</p>
<div class="lab">Erreur fréquente</div><p>Oublier le dosage sanguin du même jour, ou utiliser une limite supérieure d’un autre laboratoire.</p></template>

<template data-pop="j90-gradient" data-title="Gradients sérum-liquide : corriger les faux exsudats">
<div class="lab">Principe</div><p>Sous diurétique, l’eau quitte la cavité plus vite que les protéines. Les protéines du liquide se concentrent et le premier critère de Light peut devenir positif alors que la membrane est saine.</p>
<div class="lab">Seuils</div><p>Un gradient d’albumine sérum moins liquide supérieur à 12 g/L, ou un gradient de protéines supérieur à 31 g/L, indique un transsudat malgré des critères de Light positifs (Porcel et Light, 2006).</p>
<div class="lab">Alternative</div><p>Un NT-proBNP sérique élevé soutient l’origine cardiaque ; la BTS 2023 ne fixe pas de seuil et recommande de ne pas l’utiliser seul. Le dosage dans le liquide n’apporte pas plus que le dosage sanguin.</p>
<div class="lab">Exemple</div><p>Albumine sérique 33 g/L, pleurale 18 g/L : gradient de 15 g/L, transsudat.</p></template>

<template data-pop="j90-ph" data-title="pH du liquide pleural">
<div class="lab">Normal</div><p>Le liquide normal est alcalin, avec un pH d’environ 7,6, supérieur à celui du sang en raison d’une concentration plus élevée de bicarbonate.</p>
<div class="lab">Seuils (BTS 2023)</div><p>≤ 7,2 : risque élevé d’infection compliquée, drain si le volume accessible le permet. Entre 7,2 et 7,4 : risque intermédiaire, doser la lactate déshydrogénase ; drain à discuter si elle dépasse 900 UI/L, surtout avec fièvre persistante, volume important, glucose ≤ 4,0 mmol/L, rehaussement pleural ou cloisons. ≥ 7,4 : risque faible. Si le pH est indisponible : glucose &lt; 3,3 mmol/L comme marqueur de risque élevé.</p>
<div class="lab">Technique</div><p>Mesure immédiate sur analyseur de gaz du sang, seringue purgée de toute héparine, sans anesthésique local. Le pH n’est pas mesuré sur un pus franc, qui suffit à décider du drainage et peut abîmer l’analyseur.</p>
<div class="lab">Autres causes de pH bas</div><p>Polyarthrite rhumatoïde, cancer avancé, mésothéliome, tuberculose, rupture de l’œsophage, lupus.</p>
<div class="lab">Piège</div><p>Les logettes peuvent avoir des pH différents : un pH normal dans une logette n’exclut pas une infection dans une autre.</p></template>

<template data-pop="j90-echo" data-title="Échographie thoracique">
<div class="lab">Technique</div><p>Sonde convexe, patient assis ; balayage intercostal de haut en bas jusqu’au diaphragme, de la ligne axillaire antérieure au rachis.</p>
<div class="lab">Signes de liquide</div><p>Espace anéchogène entre la paroi et le poumon, au-dessus du diaphragme ; poumon flottant dans le liquide ; variation de taille avec la respiration.</p>
<div class="lab">Signes d’orientation</div><p>Cloisons ou logettes : exsudat, souvent infectieux. Liquide échogène tourbillonnant : exsudat cellulaire ou hémorragique. Nodules pleuraux ou diaphragmatiques, épaississement pleural : cancer. Un liquide anéchogène peut être un transsudat ou un exsudat.</p>
<div class="lab">Valeur</div><p>Plus sensible que la radiographie pour les petits volumes ; repère le point de ponction et réduit les complications. La BTS 2023 la considère comme un outil utile au diagnostic de cancer pleural lorsque l’opérateur est compétent.</p>
<div class="lab">Limite</div><p>Elle dépend de l’opérateur et ne voit pas la plèvre médiastinale ni le parenchyme profond.</p></template>

<template data-pop="j90-tdm" data-title="Tomodensitométrie thoracique de la plèvre">
<div class="lab">Technique</div><p>Injection de produit de contraste avec acquisition au temps tardif, pour que la plèvre se rehausse. Idéalement réalisée avant l’évacuation complète du liquide.</p>
<div class="lab">Signes de malignité</div><p>Épaississement pleural circonférentiel, nodulaire, de plus de 1 cm, ou atteignant la plèvre médiastinale. Masse pulmonaire, adénopathies, métastases hépatiques ou osseuses.</p>
<div class="lab">Signes d’infection</div><p>Signe de la plèvre dédoublée : deux feuillets rehaussés séparés par du liquide, évocateur d’empyème. Gaz dans la cavité sans geste préalable : infection à germe producteur de gaz ou fistule.</p>
<div class="lab">Limite</div><p>Une tomodensitométrie normale n’exclut pas un cancer pleural (BTS 2023, forte par consensus).</p></template>

<template data-pop="j90-biopsie" data-title="Biopsie pleurale">
<div class="lab">Indications</div><p>Exsudat non résolu après une ou deux cytologies, suspicion de mésothéliome, suspicion de tuberculose nécessitant une culture.</p>
<div class="lab">Techniques</div><p>Thoracoscopie médicale sous anesthésie locale et sédation : vue directe, biopsies multiples, talcage possible dans le même temps. Biopsie guidée par tomodensitométrie ou échographie : épaississement accessible sans besoin d’évacuer. Thoracoscopie chirurgicale vidéo-assistée : patient opérable, besoin de décortication.</p>
<div class="lab">Recommandations</div><p>BTS 2023 : biopsie thoracoscopique ou guidée par l’imagerie selon l’indication et la disponibilité (forte) ; pas de biopsie à l’aveugle (forte par consensus).</p>
<div class="lab">Valeur</div><p>Examen de référence histologique : il montre l’invasion tumorale, les granulomes tuberculeux et permet l’immunohistochimie et la biologie moléculaire du cancer.</p></template>

<template data-pop="j90-reexp" data-title="Œdème pulmonaire de réexpansion">
<div class="lab">Mécanisme</div><p>Un poumon resté collabé longtemps a des capillaires lésés par l’hypoxie. La réexpansion brutale et la pression pleurale très négative augmentent la filtration et la perméabilité : un œdème se forme dans le poumon réexpandu.</p>
<div class="lab">Présentation</div><p>Toux, oppression, dyspnée et désaturation pendant ou dans les heures suivant l’évacuation ; opacités du côté ponctionné.</p>
<div class="lab">Prévention</div><p>Évacuation lente sans aspiration, limitée à environ 1,5 L par séance, arrêt dès l’apparition d’une toux ou d’une gêne thoracique.</p>
<div class="lab">Traitement</div><p>Oxygène et soutien ventilatoire si nécessaire ; l’évolution est le plus souvent favorable en quelques jours.</p></template>

<template data-pop="j90-hemo" data-title="Hémothorax">
<div class="lab">Définition</div><p>Hématocrite pleural au moins égal à 50 % de l’hématocrite sanguin. Une très petite quantité de sang suffit à colorer le liquide : l’aspect ne permet pas le diagnostic.</p>
<div class="lab">Causes non traumatiques (J94.2)</div><p>Anticoagulation, rupture d’adhérence lors d’un pneumothorax spontané, tumeur pleurale, malformation artérioveineuse, rupture aortique, endométriose thoracique.</p>
<div class="lab">Conduite</div><p>Évaluation hémodynamique, groupe sanguin, drainage pour évacuer et mesurer le débit, gestion de l’anticoagulation, avis chirurgical si le saignement persiste ou si un caillot reste. Un hémothorax traumatique massif relève d’une prise en charge chirurgicale urgente selon les protocoles de traumatologie (codé S27.1).</p>
<div class="lab">Complications</div><p>Caillot retenu, empyème, fibrothorax.</p></template>

<template data-pop="j90-canal" data-title="Canal thoracique">
<div class="lab">Trajet</div><p>Il naît de la citerne du chyle, devant la deuxième vertèbre lombaire, monte à droite de l’aorte dans le médiastin postérieur, croise vers la gauche vers la cinquième vertèbre thoracique, et se jette au confluent veineux jugulo-subclavier gauche.</p>
<div class="lab">Conséquence</div><p>Une lésion basse donne plutôt un chylothorax droit ; une lésion haute, au-dessus du croisement, plutôt un chylothorax gauche.</p>
<div class="lab">Débit</div><p>Le débit de chyle augmente fortement après un repas gras, ce qui explique l’efficacité du régime pauvre en graisses à chaîne longue. Les triglycérides à chaîne moyenne sont absorbés directement par la veine porte et contournent le canal.</p></template>

<template data-pop="j90-rapid" data-title="Score RAPID">
<div class="lab">Composantes</div><p>Le score additionne cinq éléments mesurés à l’admission (Rahman, Chest, 2014). Rein : urée &lt; 5 mmol/L, 0 point ; 5 à 8, 1 point ; &gt; 8, 2 points. Âge : &lt; 50 ans, 0 ; 50 à 70 ans, 1 ; &gt; 70 ans, 2. Purulence : liquide purulent, 0 ; non purulent, 1. Infection : communautaire, 0 ; nosocomiale, 1. Alimentation : albumine ≥ 27 g/L, 0 ; &lt; 27 g/L, 1.</p>
<div class="lab">Interprétation</div><p>0 à 2 : risque faible ; 3 à 4 : intermédiaire ; 5 à 7 : élevé. Dans la cohorte de validation de MIST2, le risque élevé était associé à un rapport de cotes de décès à trois mois de 14,1 par rapport au risque faible.</p>
<div class="lab">Pourquoi un liquide non purulent compte plus</div><p>Le liquide non purulent est associé à une mortalité plus élevée dans la cohorte de dérivation ; une hypothèse est un diagnostic plus tardif ou un terrain plus fragile.</p>
<div class="lab">Usage</div><p>La BTS 2023 propose de l’utiliser pour stratifier le risque et informer le patient (conditionnelle). La déclaration ERS/ESTS 2023 souligne qu’il n’est pas encore validé pour décider d’un traitement.</p></template>

<template data-pop="j90-lent" data-title="Score LENT">
<div class="lab">Composantes</div><p>Clive et al., Thorax 2014. L : lactate déshydrogénase pleurale &lt; 1500 UI/L, 0 ; &gt; 1500, 1. E : indice de performance de l’Eastern Cooperative Oncology Group 0, 0 ; 1, 1 ; 2, 2 ; 3 à 4, 3. N : rapport neutrophiles sur lymphocytes sanguins &lt; 9, 0 ; &gt; 9, 1. T : type tumoral — mésothéliome ou hémopathie, 0 ; sein, gynécologique ou rein, 1 ; poumon et autres, 2.</p>
<div class="lab">Interprétation</div><p>0 à 1 : risque faible, survie médiane 319 jours. 2 à 4 : risque modéré, 130 jours. 5 à 7 : risque élevé, 44 jours, et seulement 3 % de survivants à six mois.</p>
<div class="lab">Usage</div><p>Un patient à risque élevé passerait une part importante de sa survie restante à l’hôpital pour un talcage ; un cathéter ambulatoire ou des ponctions sont alors préférables. La BTS 2023 autorise l’usage d’un score validé pour informer et planifier.</p></template>

<template data-pop="j90-stades" data-title="Stades de l’épanchement parapneumonique">
<div class="lab">Stade exsudatif</div><p>Liquide clair, libre, stérile, pH normal, glucose normal. Il guérit avec l’antibiotique seul. C’est l’épanchement parapneumonique simple.</p>
<div class="lab">Stade fibrinopurulent</div><p>Les bactéries envahissent la cavité ; les neutrophiles affluent, le glucose et le pH baissent, la lactate déshydrogénase monte, la fibrine forme des cloisons. C’est l’épanchement parapneumonique compliqué : il doit être drainé.</p>
<div class="lab">Stade organisé</div><p>Les fibroblastes forment une couenne fibreuse qui enserre le poumon. Le drain et les enzymes deviennent insuffisants ; une décortication peut être nécessaire.</p>
<div class="lab">Empyème</div><p>Le terme désigne la présence de pus franc ou de germes à l’examen direct dans la cavité. Le pyothorax est codé J86 et traité dans le cours J85-J86.</p></template>
