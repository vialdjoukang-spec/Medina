<!-- ===== FENÊTRES : notions, anamnèse et examen clinique ===== -->
<template data-pop="j90-bts" data-title="Guideline de la British Thoracic Society 2023">
<div class="lab">Ce qu’elle est</div><p>La guideline de la BTS pour les maladies pleurales a été publiée dans Thorax le 8 août 2023 (Roberts et al., 78:1143–1156). Elle remplace la série de 2010. Elle couvre le pneumothorax spontané, l’épanchement unilatéral non diagnostiqué, l’infection pleurale et le cancer pleural, chez l’adulte. Le mésothéliome et les maladies pleurales rares en sont exclus.</p>
<div class="lab">Méthode</div><p>Elle suit une méthode systématique d’évaluation des preuves, avec revue de la littérature et cotation de la qualité des données. Une recommandation « forte » signifie que les bénéfices dépassent clairement les risques pour la majorité des patients ; « conditionnelle » signifie que la décision dépend des valeurs du patient. La mention « par consensus » indique un accord d’experts faute de preuves de qualité ; elle ne vaut pas preuve.</p>
<div class="lab">Pourquoi elle sert de référence en Suisse</div><p>Aucune recommandation suisse propre aux épanchements pleuraux n’a été trouvée. La déclaration ERS/ESTS de 2023 sur l’infection pleurale, européenne, converge avec la BTS sur le drain de petit calibre et le protocole MIST2.</p>
<div class="lab">Limite</div><p>Pour ce cours, le résumé publié a été lu en texte intégral ; le supplément complet et la déclaration sur les procédures ne l’ont pas été. Les seuils cités proviennent du résumé.</p></template>

<template data-pop="j90-anat" data-title="Anatomie de la plèvre">
<div class="lab">Feuillets</div><p>La plèvre viscérale recouvre le poumon et les scissures. La plèvre pariétale tapisse la paroi costale, le diaphragme et le médiastin, et forme le dôme pleural au-dessus de la première côte. Les deux feuillets se rejoignent au hile et forment en dessous le ligament pulmonaire.</p>
<div class="lab">Culs-de-sac</div><p>Le cul-de-sac costodiaphragmatique descend jusqu’à la dixième côte sur la ligne axillaire moyenne et jusqu’à la douzième en arrière. Le poumon ne l’occupe qu’en inspiration profonde : c’est là que le liquide se collecte et que l’aiguille le trouve.</p>
<div class="lab">Innervation</div><p>La plèvre pariétale reçoit des fibres somatiques intercostales et phréniques : sa douleur est vive et localisée, parfois projetée à l’épaule. La plèvre viscérale n’a pas d’innervation douloureuse.</p>
<div class="lab">Conséquence pratique</div><p>Une douleur pleurétique indique une atteinte pariétale. Un épanchement massif indolore n’exclut pas un cancer.</p></template>

<template data-pop="j90-turnover" data-title="Formation et résorption du liquide pleural">
<div class="lab">Normal</div><p>Les capillaires systémiques de la plèvre pariétale filtrent un liquide pauvre en protéines vers la cavité. Les lymphatiques pariétaux le résorbent par les stomates. Le volume présent est d’environ 0,26 mL/kg (Noppen, 2000), soit environ 18 mL chez un adulte de 70 kg.</p>
<div class="lab">Réserve lymphatique</div><p>La capacité de drainage lymphatique dépasse largement la production. Un épanchement suppose donc soit une filtration très augmentée, soit un drainage diminué, soit les deux.</p>
<div class="lab">Conséquence</div><p>Un épanchement abondant d’apparition rapide sans cause hémodynamique fait penser à un blocage lymphatique, typiquement tumoral.</p></template>

<template data-pop="j90-stomates" data-title="Stomates lymphatiques pariétaux">
<div class="lab">Structure</div><p>Ce sont des ouvertures de quelques micromètres entre les cellules mésothéliales de la plèvre pariétale, en continuité avec des lacunes lymphatiques. Elles prédominent sur le diaphragme et la partie basse du médiastin.</p>
<div class="lab">Fonction</div><p>Elles évacuent liquide, protéines, cellules et particules, sans filtration. Les mouvements respiratoires pompent la lymphe vers les ganglions médiastinaux.</p>
<div class="lab">Pathologie</div><p>Les cellules tumorales, la fibrine ou une fibrose pariétale obstruent ces orifices. L’épanchement s’accumule alors même si la filtration est normale.</p></template>

<template data-pop="j90-vegf" data-title="Facteur de croissance de l’endothélium vasculaire">
<div class="lab">Mécanisme</div><p>Le VEGF, sécrété par les cellules tumorales et mésothéliales activées, relâche les jonctions entre cellules endothéliales. Les protéines plasmatiques passent alors dans la cavité et entraînent l’eau par effet oncotique.</p>
<div class="lab">Conséquence clinique</div><p>Ce mécanisme contribue au caractère exsudatif et récidivant des épanchements malins.</p>
<div class="lab">Limite</div><p>Son dosage dans le liquide n’a pas de place diagnostique en pratique : la BTS 2023 déconseille les biomarqueurs pleuraux pour diagnostiquer un cancer pleural secondaire.</p></template>

<template data-pop="j90-hydrothorax" data-title="Hydrothorax hépatique">
<div class="lab">Définition</div><p>Épanchement pleural chez un cirrhotique, sans autre cause cardiaque, pulmonaire ou pleurale. Il est droit dans la majorité des cas.</p>
<div class="lab">Mécanisme</div><p>La pression abdominale élevée par l’ascite ouvre de petits défauts du diaphragme tendineux. La pression pleurale négative aspire l’ascite vers la plèvre, parfois sans ascite cliniquement visible.</p>
<div class="lab">Diagnostic</div><p>Le liquide est un transsudat. Une ponction exclut une infection spontanée de l’épanchement, analogue à l’infection spontanée de l’ascite.</p>
<div class="lab">Traitement</div><p>Restriction sodée, spironolactone et furosémide (EASL 2018) ; ponction si dyspnée ; TIPS ou transplantation en cas de réfractarité. Le drain thoracique est à éviter : il provoque des pertes de liquide, de protéines et d’électrolytes, une insuffisance rénale et des infections.</p></template>

<template data-pop="j90-ep" data-title="Épanchement de l’embolie pulmonaire">
<div class="lab">Mécanisme</div><p>L’ischémie du parenchyme et la libération de médiateurs inflammatoires par les plaquettes du thrombus augmentent la perméabilité capillaire. Un infarctus pulmonaire au contact de la plèvre peut rendre le liquide hémorragique.</p>
<div class="lab">Caractéristiques</div><p>L’épanchement est habituellement petit, unilatéral, exsudatif, parfois sanglant. Il s’accompagne souvent d’une douleur pleurétique et d’une dyspnée disproportionnée au volume.</p>
<div class="lab">Diagnostic</div><p>La ponction ne fait pas le diagnostic. Il repose sur la probabilité clinique, les D-dimères et l’angiographie pulmonaire par tomodensitométrie, détaillés dans le cours I26.</p>
<div class="lab">Piège</div><p>Un épanchement hémorragique n’est pas une contre-indication à l’anticoagulation de l’embolie.</p></template>

<template data-pop="j90-tb" data-title="Pleurésie tuberculeuse et adénosine désaminase">
<div class="lab">Tableau</div><p>Adulte jeune ou migrant venant d’un pays de forte endémie, fièvre, douleur pleurétique, épanchement unilatéral lymphocytaire. Elle peut survenir sans lésion pulmonaire visible.</p>
<div class="lab">Adénosine désaminase</div><p>Enzyme abondante dans les lymphocytes T activés. La BTS 2023 recommande de l’utiliser comme test d’exclusion dans les populations à faible prévalence, comme la Suisse : une valeur basse rend la tuberculose peu probable. Dans les populations à forte prévalence, une valeur élevée soutient le diagnostic.</p>
<div class="lab">Preuve</div><p>La biopsie pleurale avec culture est l’option préférée (BTS 2023, forte par consensus), car elle montre des granulomes et donne la sensibilité aux antituberculeux. Le liquide est souvent négatif à l’examen direct et en culture.</p>
<div class="lab">Piège</div><p>L’adénosine désaminase s’élève aussi dans l’empyème, le lymphome et la polyarthrite rhumatoïde. Le traitement et la déclaration relèvent du cours A15.</p></template>

<template data-pop="j90-pneumotox" data-title="Base Pneumotox">
<div class="lab">Ce qu’elle est</div><p>Base de données en accès libre, créée en France par Philippe Camus, qui recense les atteintes respiratoires médicamenteuses, dont les épanchements pleuraux, par molécule et par type d’atteinte.</p>
<div class="lab">Usage</div><p>Devant un exsudat inexpliqué, le médecin y vérifie chaque médicament du patient. L’imputabilité repose ensuite sur la chronologie, l’exclusion des autres causes et la régression à l’arrêt.</p>
<div class="lab">Exemples fréquents</div><p>Amiodarone, méthotrexate, nitrofurantoïne, dasatinib, bromocriptine et cabergoline, molécules responsables de lupus induit.</p></template>

<template data-pop="j90-a-cardio" data-title="Antécédents de cardiopathie, cirrhose ou néphropathie">
<div class="lab">Questions</div><p>Le médecin demande s’il existe une insuffisance cardiaque connue, une prise de poids récente, des œdèmes, une orthopnée ; une cirrhose ou une consommation d’alcool ; un syndrome néphrotique ou une dialyse.</p>
<div class="lab">Pourquoi</div><p>Ces maladies produisent des transsudats par hausse de pression hydrostatique, baisse de pression oncotique ou passage d’ascite. Leur présence rend un transsudat probable.</p>
<div class="lab">Piège</div><p>Une cause de transsudat connue n’exclut pas une seconde cause. Un épanchement unilatéral, fébrile ou réfractaire chez un insuffisant cardiaque doit être ponctionné.</p></template>

<template data-pop="j90-a-cancer" data-title="Cancer connu ou suspecté">
<div class="lab">Questions</div><p>Le médecin recherche un antécédent de cancer du poumon, du sein, de l’ovaire, d’un lymphome, et des signes généraux : perte de poids, sueurs nocturnes, fatigue.</p>
<div class="lab">Pourquoi</div><p>Le cancer bronchique, le cancer du sein et le lymphome sont les causes les plus fréquentes d’épanchement malin. Un cancer du sein peut récidiver dans la plèvre plusieurs années après le traitement initial.</p>
<div class="lab">Conséquence</div><p>Un antécédent de cancer impose une cytologie sur un volume suffisant et, si elle est négative, une biopsie.</p></template>

<template data-pop="j90-a-amiante" data-title="Exposition à l’amiante">
<div class="lab">Métiers</div><p>Isolation, construction et rénovation de bâtiments, électricité du bâtiment, chantiers navals, chauffage et ventilation, mécanique des freins et embrayages, industrie du fibrociment.</p>
<div class="lab">Questions utiles</div><p>Le médecin demande chaque poste de travail, ses dates, la manipulation directe de matériaux, la présence de poussière, et une exposition domestique, par exemple par le lavage de vêtements de travail.</p>
<div class="lab">Latence</div><p>Les plaques et le mésothéliome apparaissent des décennies après le début de l’exposition. La Suisse a interdit l’amiante en 1990 ; des maladies continuent donc d’apparaître aujourd’hui.</p>
<div class="lab">Conséquence</div><p>Une exposition documentée oriente vers les plaques, l’épanchement bénin lié à l’amiante et le mésothéliome, et ouvre la voie d’une annonce à la Suva.</p></template>

<template data-pop="j90-a-tb" data-title="Contact tuberculeux ou séjour en zone d’endémie">
<div class="lab">Questions</div><p>Le médecin recherche un contact avec un tuberculeux, une naissance ou un séjour prolongé dans un pays de forte incidence, une infection par le VIH, une immunosuppression, un traitement anti-facteur de nécrose tumorale.</p>
<div class="lab">Pourquoi</div><p>La Suisse a une faible incidence de tuberculose ; un épanchement lymphocytaire y relève plus souvent d’un cancer. Le contexte d’exposition modifie fortement cette probabilité.</p></template>

<template data-pop="j90-a-med" data-title="Médicaments et anticoagulants">
<div class="lab">Deux raisons de les noter</div><p>Certains médicaments provoquent un exsudat. Les anticoagulants et antiagrégants modifient le risque hémorragique de la ponction et peuvent expliquer un hémothorax.</p>
<div class="lab">Questions</div><p>Le médecin note chaque molécule, sa date de début et sa dose, ainsi que le dernier comprimé d’anticoagulant oral direct ou la dernière injection d’héparine.</p>
<div class="lab">Conséquence</div><p>Un exsudat apparu après le début de l’amiodarone ou du méthotrexate fait discuter l’arrêt. Un patient anticoagulé avec épanchement croissant fait mesurer l’hématocrite pleural.</p></template>

<template data-pop="j90-a-auto" data-title="Maladie auto-immune">
<div class="lab">Lupus</div><p>Une pleurésie, souvent bilatérale et douloureuse, fait partie des manifestations séreuses du lupus. Les anticorps antinucléaires dans le liquide soutiennent le diagnostic (BTS 2023).</p>
<div class="lab">Polyarthrite rhumatoïde</div><p>L’épanchement touche surtout l’homme avec nodules rhumatoïdes. Il a un glucose très bas et un pH bas, et peut évoluer vers un pseudochylothorax.</p>
<div class="lab">Piège</div><p>Sous immunosuppresseurs, une infection pleurale ou une tuberculose doit être exclue avant d’attribuer l’épanchement à la maladie.</p></template>

<template data-pop="j90-a-chir" data-title="Chirurgie ou traumatisme thoracique récent">
<div class="lab">Situations</div><p>Œsophagectomie, chirurgie du médiastin postérieur, pontage aortocoronarien, pose d’une voie veineuse centrale, traumatisme fermé du thorax.</p>
<div class="lab">Pourquoi</div><p>La chirurgie du médiastin peut léser le canal thoracique et donner un chylothorax. Un traumatisme ou une voie centrale mal placée peut donner un hémothorax. Le pontage donne souvent un petit épanchement gauche dans les semaines suivantes.</p>
<div class="lab">Conséquence</div><p>Un liquide laiteux après œsophagectomie fait doser les triglycérides ; un liquide sanglant après traumatisme fait mesurer l’hématocrite pleural.</p></template>

<template data-pop="j90-s-dysp" data-title="Dyspnée de l’épanchement pleural">
<div class="lab">Mécanisme</div><p>La dyspnée naît moins de la compression du poumon que de l’allongement des muscles inspiratoires. Le liquide abaisse et aplatit le diaphragme, parfois jusqu’à l’inverser ; le diaphragme travaille alors à une longueur défavorable, et l’effort inspiratoire augmente. La compression du poumon ajoute un effet shunt.</p>
<div class="lab">Caractérisation</div><p>Le médecin précise le mode d’apparition, la limitation à l’effort, la position de confort. Un patient se couche souvent sur le côté de l’épanchement, ce qui libère le poumon sain.</p>
<div class="lab">Valeur</div><p>L’amélioration de la dyspnée après ponction confirme que l’épanchement en est responsable. Une absence d’amélioration fait chercher un poumon non expansible ou une autre cause.</p></template>

<template data-pop="j90-s-doul" data-title="Douleur pleurétique">
<div class="lab">Caractérisation</div><p>Douleur latérale, en coup de poignard, augmentée par l’inspiration profonde, la toux et les mouvements du tronc, soulagée par une respiration superficielle.</p>
<div class="lab">Mécanisme</div><p>L’inflammation de la plèvre pariétale stimule ses terminaisons somatiques à chaque glissement des feuillets. Lorsque le liquide les sépare, la douleur s’atténue souvent.</p>
<div class="lab">Causes à évoquer</div><p>Pneumonie, embolie pulmonaire, pleurésie virale, lupus, pneumothorax. Une douleur sourde et continue oriente plutôt vers une infiltration tumorale de la paroi, typique du mésothéliome.</p></template>

<template data-pop="j90-s-toux" data-title="Toux de l’épanchement">
<div class="lab">Mécanisme</div><p>La compression bronchique et l’irritation pleurale déclenchent une toux sèche. Une toux productive oriente vers une pneumonie associée.</p>
<div class="lab">Pendant la ponction</div><p>Une toux qui apparaît pendant l’évacuation signale que le poumon se réexpand rapidement ou que la pression pleurale devient trop négative ; elle impose de ralentir ou d’arrêter.</p></template>

<template data-pop="j90-s-gen" data-title="Fièvre, perte de poids et sueurs">
<div class="lab">Fièvre</div><p>Une fièvre aiguë oriente vers l’infection pleurale ou la pneumonie ; une fièvre prolongée vers la tuberculose ou un lymphome. Une fièvre qui persiste plus de 48 à 72 heures sous antibiotique au cours d’une pneumonie fait rechercher un épanchement compliqué.</p>
<div class="lab">Perte de poids et sueurs</div><p>Elles orientent vers un cancer, une tuberculose ou une infection pleurale ancienne. L’empyème à anaérobes peut évoluer sur plusieurs semaines avec amaigrissement.</p></template>

<template data-pop="j90-v-fr" data-title="Fréquence respiratoire et saturation">
<div class="lab">Normal</div><p>Chez l’adulte au repos, la fréquence respiratoire est de 12 à 20 par minute et la saturation pulsée en oxygène est d’au moins 95 % à l’air ambiant.</p>
<div class="lab">Interprétation</div><p>Une tachypnée et une désaturation traduisent un épanchement mal toléré, une maladie pulmonaire associée ou une embolie. Elles justifient une évacuation rapide si l’épanchement est abondant.</p>
<div class="lab">Piège</div><p>Chez le patient atteint de BPCO, une saturation basse peut être chronique ; la comparaison avec l’état antérieur prime.</p></template>

<template data-pop="j90-x-mat" data-title="Matité à la percussion">
<div class="lab">Technique</div><p>Le médecin percute de haut en bas, en comparant chaque niveau au côté opposé, patient assis. Il repère la limite supérieure de la matité.</p>
<div class="lab">Valeur</div><p>La matité déclive est le signe d’examen le plus utile pour affirmer un épanchement ; son absence le rend peu probable lorsqu’il est de volume moyen ou abondant.</p>
<div class="lab">Piège</div><p>Une matité existe aussi dans une condensation pneumonique ou une atélectasie. Les vibrations vocales les distinguent : augmentées dans la condensation, abolies dans l’épanchement.</p></template>

<template data-pop="j90-x-vib" data-title="Vibrations vocales">
<div class="lab">Technique</div><p>Le médecin pose la paume sur le thorax et fait dire « trente-trois » ; il compare les deux côtés à la même hauteur.</p>
<div class="lab">Mécanisme</div><p>Le liquide interposé entre le poumon et la paroi amortit les vibrations transmises par l’arbre bronchique. Elles sont donc diminuées ou abolies.</p>
<div class="lab">Valeur</div><p>Leur abolition au niveau d’une matité oriente vers un épanchement plutôt que vers une condensation.</p></template>

<template data-pop="j90-x-mv" data-title="Murmure vésiculaire diminué">
<div class="lab">Mécanisme</div><p>Le liquide éloigne le poumon du stéthoscope et absorbe le son ; le murmure vésiculaire est diminué ou aboli sous la limite de l’épanchement.</p>
<div class="lab">Signes associés</div><p>À la limite supérieure, un souffle doux expiratoire et une égophonie peuvent s’entendre, parce que le poumon comprimé transmet mieux les sons aigus.</p></template>

<template data-pop="j90-x-frott" data-title="Frottement pleural">
<div class="lab">Description</div><p>Bruit superficiel, sec et rugueux, entendu aux deux temps respiratoires et non modifié par la toux.</p>
<div class="lab">Mécanisme</div><p>Les deux feuillets inflammatoires et dépolis frottent l’un contre l’autre. Il apparaît au début d’une pleurésie et réapparaît lors de la résorption, quand le liquide ne sépare plus les feuillets.</p>
<div class="lab">Piège</div><p>Le frottement péricardique persiste en apnée ; le frottement pleural disparaît lorsque le patient retient sa respiration.</p></template>

<template data-pop="j90-x-trachee" data-title="Position de la trachée">
<div class="lab">Technique</div><p>Le médecin place l’index dans la fourchette sternale et compare l’espace entre la trachée et chaque muscle sterno-cléido-mastoïdien.</p>
<div class="lab">Interprétation</div><p>Un épanchement massif repousse le médiastin et la trachée du côté opposé. Une atélectasie attire la trachée du côté atteint. Une trachée médiane devant un hémithorax opaque suggère une association des deux, souvent par une tumeur bronchique.</p>
<div class="lab">Conséquence</div><p>Un hémithorax opaque avec trachée médiane fait demander une bronchoscopie et prévient que l’évacuation ne réexpandra pas le poumon.</p></template>
