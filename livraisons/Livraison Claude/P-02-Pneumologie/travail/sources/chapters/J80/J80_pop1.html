
<!-- ===== FENÊTRES : définitions, physiopathologie, causes ===== -->
<template data-pop="j80-global" data-title="Définition globale du SDRA (2024)">
<div class="lab">Source</div><p>Matthay M. A. et al., American Journal of Respiratory and Critical Care Medicine 2024 ; 209 : 37–47. Consensus international présenté en 2023, publié en janvier 2024 ; texte intégral lu le 08.10.2026.</p>
<div class="lab">Ce qui change par rapport à Berlin 2012</div><p>Trois extensions. Le patient non intubé sous oxygène nasal à haut débit d’au moins 30 L/min peut recevoir le diagnostic. Le rapport SpO₂/FiO₂ remplace la gazométrie lorsque la SpO₂ est inférieure ou égale à 97 %. L’échographie pulmonaire, réalisée par un opérateur formé, remplace la radiographie lorsque celle-ci manque.</p>
<div class="lab">Pourquoi ces extensions</div><p>Pendant la pandémie de COVID-19, de nombreux patients ont été traités longtemps par haut débit sans intubation ; ils avaient la même lésion mais n’entraient pas dans la définition de Berlin. Dans les pays à ressources limitées, ni la gazométrie ni la radiographie ne sont toujours disponibles.</p>
<div class="lab">Limites</div><p>Le rapport SpO₂/FiO₂ est moins précis chez les patients à peau foncée, en hypoperfusion ou avec une hémoglobine anormale. La définition élargie inclut des patients moins graves : les mortalités publiées avec Berlin ne s’appliquent pas directement.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin peut poser le diagnostic dès que le patient sous haut débit remplit les critères, et commencer à surveiller l’évolution vers l’intubation.</p></template>

<template data-pop="j80-berlin" data-title="Définition de Berlin (2012)">
<div class="lab">Source</div><p>ARDS Definition Task Force, JAMA 2012 ; 307 : 2526–2533. Elle remplaçait la définition américano-européenne de 1994.</p>
<div class="lab">Critères</div><p>Début dans la semaine suivant une agression connue ou des symptômes nouveaux ; opacités bilatérales non expliquées par un épanchement, une atélectasie ou des nodules ; insuffisance respiratoire non expliquée entièrement par une insuffisance cardiaque ou une surcharge ; PaO₂/FiO₂ ≤ 300 mmHg sous PEP ou pression positive continue ≥ 5 cm H₂O, avec trois grades : léger (200 à 300), modéré (100 à 200), sévère (≤ 100).</p>
<div class="lab">Mortalités de validation</div><p>27 %, 32 % et 45 % respectivement, dans une méta-analyse de 4 188 patients.</p>
<div class="lab">Ce que Berlin a supprimé</div><p>Le terme « lésion pulmonaire aiguë » (rapport 200 à 300) et l’exigence d’une pression artérielle pulmonaire d’occlusion ≤ 18 mmHg.</p>
<div class="lab">Statut actuel</div><p>La CIM-10-GM 2024 code toujours la gravité selon Berlin ; la clinique utilise la définition globale 2024, qui conserve les mêmes seuils chez le patient intubé.</p></template>

<template data-pop="j80-pf" data-title="Rapport PaO₂/FiO₂">
<div class="lab">Calcul</div><p>PaO₂ en mmHg divisée par la FiO₂ exprimée en fraction. Exemple : PaO₂ 75 mmHg sous FiO₂ 0,50 donne 150. En kPa, multiplier d’abord la PaO₂ par 7,5.</p>
<div class="lab">Valeur normale</div><p>En air ambiant, un adulte jeune a une PaO₂ d’environ 95 mmHg, soit un rapport d’environ 450.</p>
<div class="lab">Limites</div><p>Le rapport varie avec la PEP, qui recrute des alvéoles, et avec la FiO₂ elle-même lorsque le shunt est important. Il doit donc toujours être noté avec ces deux valeurs. Il ne mesure pas l’espace mort ni la mécanique.</p>
<div class="lab">Correction d’altitude</div><p>La définition globale demande, au-dessus de 1 000 m, de multiplier le rapport par la pression barométrique divisée par 760. À 1 560 m (pression voisine de 630 mmHg), un rapport de 250 devient 207 : le patient passe du grade léger au grade léger proche du modéré. Sans correction, un patient d’altitude serait classé plus grave qu’il ne l’est.</p>
<div class="lab">Piège</div><p>Sous lunettes nasales ou masque simple, la FiO₂ n’est qu’estimée ; le rapport calculé est alors approximatif.</p></template>

<template data-pop="j80-palicc" data-title="SDRA pédiatrique (PALICC)">
<div class="lab">Source</div><p>Pediatric Acute Lung Injury Consensus Conference, deuxième édition (PALICC-2), Pediatric Critical Care Medicine 2023 ; première édition 2015.</p>
<div class="lab">Indices</div><p>Indice d’oxygénation = FiO₂ × pression moyenne des voies aériennes (cm H₂O) × 100 / PaO₂. Indice de saturation en oxygène : même formule avec la SpO₂ à la place de la PaO₂. Ils intègrent la pression de ventilation, ce que le rapport PaO₂/FiO₂ ne fait pas.</p>
<div class="lab">Seuils chez l’enfant intubé</div><p>La CIM-10-GM 2024 reprend les seuils de PALICC 2015 : indice d’oxygénation 4 à &lt; 8 (léger), 8 à &lt; 16 (modéré), ≥ 16 (sévère) ; indice de saturation 5 à &lt; 7,5, 7,5 à &lt; 12,3 et ≥ 12,3. La seconde édition de 2023 regroupe les grades léger et modéré sous un seuil commun et conserve le grade sévère ; le codage reste fondé sur les trois grades.</p>
<div class="lab">Particularités</div><p>PALICC n’exige pas d’opacités bilatérales : une atteinte unilatérale nouvelle suffit. Le nouveau-né et la maladie des membranes hyalines du prématuré sont exclus.</p></template>

<template data-pop="j80-cim" data-title="Codage J80 et J81">
<div class="lab">Règle</div><p>J80.0 exige un cinquième caractère. Chez l’adulte, 1, 2 et 3 codent les grades de Berlin ; chez l’enfant de 1 à 17 ans, 4, 5 et 6 codent les grades de PALICC ; 9 code un grade non précisé.</p>
<div class="lab">Patient non intubé</div><p>Berlin exige une PEP ou une pression positive continue d’au moins 5 cm H₂O. Un patient sous haut débit seul, diagnostiqué selon la définition globale, n’a pas de grade de Berlin documenté : J80.09 est alors le code le plus fidèle.</p>
<div class="lab">Exclusions de J81</div><p>Œdème avec cardiopathie ou insuffisance cardiaque (I50.1), œdème chimique aigu (J68.1), agents externes (J60–J70), pneumonie hypostatique (J18.2). Le syndrome de détresse du nouveau-né est P22.0.</p>
<div class="lab">Codes associés</div><p>La cause est codée séparément (pneumonie, sepsis, pancréatite). L’insuffisance respiratoire n’est pas codée en J96 lorsque J80 s’applique, car J96 exclut le SDRA.</p></template>

<template data-pop="j80-lungsafe" data-title="Étude LUNG SAFE">
<div class="lab">Plan</div><p>Étude observationnelle prospective de quatre semaines en 2014, 459 unités de soins intensifs dans 50 pays (Bellani, JAMA 2016).</p>
<div class="lab">Résultats principaux</div><p>SDRA chez 10,4 % des admissions et 23,4 % des patients ventilés. Reconnaissance par les cliniciens : 60 % au total, 34 % au moment où les critères étaient remplis. Moins des deux tiers des patients recevaient un volume courant ≤ 8 mL/kg de poids prédit ; le décubitus ventral n’était utilisé que chez 16 % des SDRA sévères.</p>
<div class="lab">Mortalité hospitalière</div><p>34,9 % (léger), 40,3 % (modéré), 46,1 % (sévère).</p>
<div class="lab">Portée</div><p>Ces chiffres montrent un écart entre preuves et pratique. Ils ne proviennent pas d’un registre suisse ; aucune donnée nationale équivalente n’est publiée.</p></template>

<template data-pop="j80-starling" data-title="Équation de Starling">
<div class="lab">Formule</div><p>Flux net = coefficient de filtration × [(pression hydrostatique capillaire − pression hydrostatique interstitielle) − σ × (pression oncotique plasmatique − pression oncotique interstitielle)]. σ est le coefficient de réflexion : 1 si la paroi est imperméable aux protéines, 0 si elle les laisse passer librement.</p>
<div class="lab">Poumon normal</div><p>La pression capillaire pulmonaire est basse, environ 8 à 10 mmHg, et la pression oncotique plasmatique d’environ 25 mmHg. Une faible filtration nette existe pourtant, car l’interstitium pulmonaire contient beaucoup de protéines ; les lymphatiques l’évacuent.</p>
<div class="lab">Œdème hydrostatique</div><p>La pression capillaire augmente (par exemple 25 mmHg dans une insuffisance mitrale aiguë). σ reste élevé : le liquide est pauvre en protéines, et la baisse de pression le fait régresser vite.</p>
<div class="lab">Œdème de perméabilité</div><p>σ diminue et le coefficient de filtration augmente. Le liquide est riche en protéines ; même une pression normale produit un œdème, et toute hausse de pression l’aggrave beaucoup.</p>
<div class="lab">Conséquence clinique</div><p>Dans le SDRA, la restriction liquidienne après le choc réduit l’œdème, alors que les diurétiques n’agissent pas sur la lésion elle-même.</p></template>

<template data-pop="j80-clairance" data-title="Clairance du liquide alvéolaire">
<div class="lab">Mécanisme</div><p>Le sodium entre dans les pneumocytes par les canaux ENaC au pôle apical et sort par la pompe Na⁺/K⁺-ATPase au pôle basal. Le gradient osmotique entraîne l’eau, en partie par les aquaporines.</p>
<div class="lab">Dans le SDRA</div><p>La destruction de l’épithélium, l’hypoxie et les cytokines réduisent cette clairance. Dans une étude de Ware et Matthay (2001), les patients dont la clairance était maximale avaient une mortalité plus basse que ceux dont la clairance était altérée.</p>
<div class="lab">Leçon thérapeutique</div><p>Les bêta-2 agonistes stimulent la clairance au laboratoire, mais le salbutamol intraveineux a augmenté la mortalité dans un essai britannique de 2012. Un mécanisme démontré in vitro ne garantit pas un bénéfice clinique.</p></template>

<template data-pop="j80-shunt" data-title="Shunt intrapulmonaire">
<div class="lab">Définition</div><p>Fraction du débit cardiaque qui traverse des alvéoles non ventilées et rejoint la circulation systémique sans s’oxygéner. Chez le sujet sain, le shunt physiologique est inférieur à 5 % (veines bronchiques et de Thebesius).</p>
<div class="lab">Signature</div><p>L’augmentation de la FiO₂ corrige peu l’hypoxémie, car l’oxygène n’atteint pas le sang shunté. C’est la différence avec l’inégalité ventilation-perfusion, qui répond bien à l’oxygène.</p>
<div class="lab">Exemple</div><p>Un patient avec 40 % de shunt garde une PaO₂ proche de 70 mmHg sous FiO₂ de 1,0, soit un rapport de 70.</p>
<div class="lab">Traitement</div><p>Rouvrir les alvéoles : PEP, décubitus ventral. La vasoconstriction pulmonaire hypoxique réduit naturellement le shunt ; les vasodilatateurs systémiques peuvent l’abolir et aggraver l’hypoxémie.</p></template>

<template data-pop="j80-babylung" data-title="Poumon de petite taille (« baby lung »)">
<div class="lab">Origine</div><p>Concept proposé par Gattinoni et Pesenti à partir de la TDM : dans le SDRA sévère, le volume de poumon normalement aéré peut ne représenter que 20 à 30 % du volume normal, soit celui d’un enfant de cinq à six ans.</p>
<div class="lab">Signification</div><p>Ce petit poumon a une élasticité presque normale ; la compliance totale est basse parce qu’il est petit, non parce qu’il est rigide.</p>
<div class="lab">Conséquence</div><p>Un volume courant de 500 mL, adapté à un poumon entier, distend ce petit poumon comme le ferait un volume de 1 500 mL chez le sujet sain. C’est la base du faible volume courant et de la mesure de la pression motrice.</p></template>

<template data-pop="j80-vili" data-title="Lésions induites par la ventilation">
<div class="lab">Mécanismes</div><p><b>Volotraumatisme</b> : distension excessive des alvéoles en fin d’inspiration. <b>Barotraumatisme</b> : rupture alvéolaire et fuite d’air. <b>Atélectraumatisme</b> : ouverture et fermeture cycliques d’alvéoles instables, qui cisaillent l’épithélium. <b>Biotraumatisme</b> : libération de cytokines par le poumon étiré, qui passent dans la circulation et favorisent la défaillance d’autres organes.</p>
<div class="lab">Preuve chez l’homme</div><p>L’essai ARMA (2000) a réduit la mortalité en limitant le volume courant ; il a aussi réduit l’IL-6 plasmatique, en faveur du biotraumatisme.</p>
<div class="lab">Prévention</div><p>Volume courant faible, plateau ≤ 30 cm H₂O, pression motrice basse, PEP suffisante, décubitus ventral.</p></template>

<template data-pop="j80-direct" data-title="Agression directe ou indirecte">
<div class="lab">Directe</div><p>La lésion commence côté épithélium : pneumonie, inhalation de contenu gastrique, inhalation toxique, contusion, noyade. La TDM montre plus souvent des condensations asymétriques.</p>
<div class="lab">Indirecte</div><p>La lésion commence côté endothélium par les médiateurs circulants : sepsis extrapulmonaire, pancréatite, polytraumatisme, transfusions, brûlures. Les opacités sont plus souvent diffuses et symétriques.</p>
<div class="lab">Intérêt</div><p>La distinction aide à chercher la cause. Les données qui suggèrent une réponse différente à la PEP selon le type d’agression ne sont pas assez solides pour guider le traitement.</p></template>

<template data-pop="j80-hape" data-title="Œdème pulmonaire de haute altitude">
<div class="lab">Mécanisme</div><p>L’hypoxie alvéolaire contracte les artérioles pulmonaires de façon inégale. Les territoires restés ouverts reçoivent un débit et une pression excessifs ; leurs capillaires se rompent (« rupture de contrainte »). Le liquide est initialement hémorragique et riche en protéines sans inflammation préalable. Les sujets prédisposés ont une vasoconstriction hypoxique exagérée et une clairance alvéolaire plus faible.</p>
<div class="lab">Clinique</div><p>Au-dessus de 2 500 m, le plus souvent deux à quatre jours après l’arrivée : baisse de performance, dyspnée d’effort puis de repos, toux sèche puis expectoration rosée, crépitants souvent dans le champ moyen droit, SpO₂ plus basse que celle attendue à cette altitude, fébricule possible.</p>
<div class="lab">Traitement (Wilderness Medical Society 2024)</div><p>Descente d’au moins 1 000 m si possible ou jusqu’à disparition des symptômes ; oxygène pour une SpO₂ d’au moins 90 % ; chambre hyperbare portable si la descente est impossible ; nifédipine à libération prolongée si ni descente ni oxygène ne sont possibles. Le repos, la chaleur et l’absence d’effort réduisent la pression artérielle pulmonaire.</p>
<div class="lab">Prévention</div><p>Ascension progressive (au-dessus de 3 000 m, élévation de l’altitude de nuit limitée à environ 500 m par jour) ; nifédipine chez le sujet ayant déjà fait un œdème ; le tadalafil est une alternative citée.</p>
<div class="lab">Piège</div><p>Le diurétique est contre-indiqué en pratique : le patient n’est pas surchargé. L’association à un œdème cérébral de haute altitude (ataxie, confusion) impose la dexaméthasone et la descente immédiate.</p></template>

<template data-pop="j80-neuro" data-title="Œdème pulmonaire neurogénique">
<div class="lab">Contexte</div><p>Hémorragie méningée, traumatisme crânien grave, état de mal épileptique, hypertension intracrânienne aiguë.</p>
<div class="lab">Mécanisme</div><p>Une décharge sympathique massive provoque une vasoconstriction systémique et pulmonaire, une hausse brutale des pressions et une lésion capillaire. L’œdème est mixte, hydrostatique et de perméabilité.</p>
<div class="lab">Évolution</div><p>Début en minutes à heures ; résolution souvent en 48 à 72 heures si la cause cérébrale est contrôlée.</p>
<div class="lab">Piège</div><p>Une cardiomyopathie de stress peut s’y associer après une hémorragie méningée ; l’échocardiographie distingue les deux composantes. La PEP doit être réglée sans élever la pression intracrânienne.</p></template>

<template data-pop="j80-negpress" data-title="Œdème à pression négative">
<div class="lab">Contexte</div><p>Inspiration forcée contre une glotte fermée : laryngospasme au réveil d’une anesthésie, morsure de la sonde, corps étranger, épiglottite, strangulation. Il touche surtout l’adulte jeune et musclé, capable de générer une forte dépression inspiratoire.</p>
<div class="lab">Mécanisme</div><p>Une pression intrathoracique très négative augmente le retour veineux et la pression transmurale capillaire ; la paroi capillaire peut se rompre.</p>
<div class="lab">Évolution et traitement</div><p>Hypoxémie et expectoration rosée dans les minutes à une heure suivant l’obstacle ; oxygène et pression positive ; résolution habituelle en 24 à 48 heures.</p></template>

<template data-pop="j80-reexp" data-title="Œdème de réexpansion">
<div class="lab">Contexte</div><p>Réexpansion rapide d’un poumon collabé depuis longtemps (souvent plus de 72 heures) par un pneumothorax ou un grand épanchement, après drainage ou ponction.</p>
<div class="lab">Mécanisme</div><p>Reperfusion et étirement brutal d’un poumon ischémique, avec lésion de perméabilité, parfois aggravée par une aspiration à forte dépression.</p>
<div class="lab">Prévention</div><p>Évacuer un épanchement de façon progressive et interrompre la ponction en cas de toux, d’oppression ou de malaise ; les recommandations pleurales limitent habituellement le volume retiré en une séance à environ 1,5 L. Voir les cours J90 (épanchements) et J93 (pneumothorax).</p></template>

<template data-pop="j80-immersion" data-title="Œdème pulmonaire d’immersion">
<div class="lab">Contexte</div><p>Nageurs en eau froide, triathlètes, plongeurs ; souvent sujets en bonne santé.</p>
<div class="lab">Mécanisme</div><p>L’immersion déplace le sang des membres vers le thorax ; le froid provoque une vasoconstriction et une hypertension ; l’effort augmente le débit cardiaque. La pression capillaire pulmonaire monte et l’œdème est surtout hydrostatique. Une hypertension artérielle et une dysfonction diastolique favorisent les récidives.</p>
<div class="lab">Conduite</div><p>Sortie de l’eau, oxygène, surveillance ; résolution en général en 24 à 48 heures. Une évaluation cardiologique est indiquée avant la reprise, car la récidive est fréquente.</p></template>

<template data-pop="j80-transfu" data-title="TRALI et TACO">
<div class="lab">TRALI</div><p>Lésion pulmonaire aiguë liée à la transfusion : hypoxémie et opacités bilatérales pendant la transfusion ou dans les six heures, sans surcharge. Mécanisme : anticorps anti-HLA ou anti-HNA du donneur (souvent plasma de femmes ayant eu plusieurs grossesses) qui activent les neutrophiles du receveur déjà amorcés par une maladie aiguë. Fièvre et hypotension fréquentes.</p>
<div class="lab">TACO</div><p>Surcharge circulatoire liée à la transfusion : œdème hydrostatique dans les 12 heures, avec hypertension, bilan positif, turgescence jugulaire et peptides natriurétiques élevés. Facteurs de risque : sujet âgé, insuffisance cardiaque ou rénale, transfusion rapide.</p>
<div class="lab">Distinction</div><p>TRALI : hypotension, BNP plutôt bas, absence de réponse au diurétique. TACO : hypertension, BNP élevé, amélioration sous diurétique.</p>
<div class="lab">Conduite</div><p>Arrêter la transfusion, oxygéner, ventiler si nécessaire ; diurétique pour le TACO seulement. Déclarer l’événement à l’hémovigilance de Swissmedic et au service de transfusion, qui recherche les anticorps du donneur et l’exclut des dons de plasma.</p>
<div class="lab">Prévention</div><p>Transfusion restrictive ; plasma de donneurs masculins ou sans antécédent de grossesse ; débit lent chez les patients à risque de surcharge.</p></template>
