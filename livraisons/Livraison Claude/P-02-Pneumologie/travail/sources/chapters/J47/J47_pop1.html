
<!-- ===== FENÊTRES : mécanismes et causes ===== -->
<template data-pop="j47-mucocil" data-title="Clairance mucociliaire">
<div class="lab">Définition</div><p>La clairance mucociliaire est le transport continu du mucus bronchique vers le larynx par le battement coordonné des cils de l’épithélium respiratoire.</p>
<div class="lab">Mécanisme</div><p>Les cils battent dans une couche aqueuse périciliaire et propulsent la couche de mucus située au-dessus d’eux. L’hydratation de cette couche dépend de la sécrétion de chlorure par le canal CFTR et de l’absorption de sodium par le canal ENaC.</p>
<div class="lab">Dans les bronchiectasies</div><p>Les cils sont détruits par l’infection, immobiles dans la DCP ou paralysés par un mucus déshydraté dans la mucoviscidose. Le mucus stagne, s’infecte et entretient l’inflammation.</p>
<div class="lab">Conséquence pratique</div><p>La toux et les techniques de drainage remplacent une clairance défaillante ; c’est pourquoi l’ERS 2025 recommande de les enseigner à tous les patients.</p></template>

<template data-pop="j47-neutro" data-title="Inflammation neutrophilique et élastase">
<div class="lab">Définition</div><p>L’inflammation des bronchiectasies est dominée par les polynucléaires neutrophiles, recrutés par CXCL8 et LTB₄ en réponse aux bactéries.</p>
<div class="lab">Mécanisme</div><p>Les neutrophiles libèrent des sérine-protéases : élastase neutrophile, protéinase 3 et cathepsine G. L’élastase en excès dégrade l’élastine de la paroi, ralentit le battement ciliaire, stimule la sécrétion de mucus et gêne la phagocytose. Elle détruit donc la paroi qu’elle devait protéger.</p>
<div class="lab">Valeur clinique</div><p>L’activité de l’élastase dans les crachats est associée aux exacerbations et au déclin fonctionnel dans les études de cohorte ; ce dosage reste un outil de recherche.</p>
<div class="lab">Conséquence pratique</div><p>Cette inflammation répond mal aux corticostéroïdes, qui ciblent surtout l’inflammation de type 2. Les macrolides et l’inhibiteur de la DPP-1 agissent sur elle par d’autres voies.</p></template>

<template data-pop="j47-cercle" data-title="Cercle vicieux de Cole et modèle du vortex">
<div class="lab">Définition</div><p>Cole a décrit en 1986 un cercle vicieux : défaut de clairance, infection, inflammation et destruction bronchique s’entretiennent mutuellement. Flume et al. ont proposé en 2018 le modèle du vortex, dans lequel chaque composante agit sur toutes les autres et pas seulement sur la suivante.</p>
<div class="lab">Pourquoi le modèle compte</div><p>Si chaque composante entretient toutes les autres, interrompre une seule d’entre elles ne suffit pas toujours. Le traitement combine donc drainage, contrôle de l’infection, réduction de l’inflammation et traitement de la cause.</p>
<div class="lab">Limite</div><p>Le modèle est explicatif ; il ne prédit pas, chez un patient donné, quelle composante domine. L’approche par traits traitables de l’ERS 2025 sert à les identifier.</p></template>

<template data-pop="j47-bar" data-title="Rapport broncho-artériel et signes radiologiques">
<div class="lab">Définition</div><p>Le rapport broncho-artériel compare le diamètre de la bronche à celui de l’artère pulmonaire qui l’accompagne. Chez le sujet sain, la bronche est la plus petite ; un rapport supérieur ou égal à 1 signe la dilatation (consensus Aliberti et al., 2022).</p>
<div class="lab">Autres signes</div><p>L’absence d’effilement vers la périphérie et la visibilité des bronches à moins de 1 cm de la plèvre costale sont des signes directs. L’épaississement pariétal, les bouchons muqueux et l’arbre en bourgeons sont des signes indirects.</p>
<div class="lab">Piège</div><p>Le rapport augmente avec l’âge chez le sujet sain, et l’artère se rétrécit dans une zone hypoperfusée, ce qui exagère le rapport. L’absence d’effilement est souvent le signe le plus robuste.</p>
<div class="lab">Conséquence pratique</div><p>Le compte rendu doit préciser les lobes atteints et la forme des dilatations, car ces éléments entrent dans les scores BSI et FACED.</p></template>

<template data-pop="j47-reid" data-title="Classification de Reid">
<div class="lab">Définition</div><p>Reid a classé en 1950 les bronchiectasies selon leur forme : cylindriques (bronches dilatées à bords réguliers), variqueuses (dilatations irrégulières avec rétrécissements, en chapelet) et kystiques (dilatations en sacs terminaux, parfois avec niveaux liquides).</p>
<div class="lab">Valeur</div><p>La forme reflète le degré de destruction : les formes kystiques traduisent une destruction avancée et comptent comme critère de gravité dans le BSI.</p>
<div class="lab">Limite</div><p>Les trois formes coexistent souvent chez un même patient ; la classification décrit l’image sans indiquer la cause.</p></template>

<template data-pop="j47-cf" data-title="Mucoviscidose : diagnostic à ne pas manquer (renvoi E84)">
<div class="lab">Définition</div><p>La mucoviscidose est une maladie autosomique récessive due à deux variants pathogènes du gène CFTR. Elle est codée E84 et traitée dans son cours propre.</p>
<div class="lab">Mécanisme</div><p>Le canal CFTR défaillant ne sécrète plus assez de chlorure et de bicarbonate : la couche périciliaire se déshydrate, le mucus devient épais et la clairance s’effondre.</p>
<div class="lab">Quand y penser chez l’adulte</div><p>Bronchiectasies des lobes supérieurs, début dans l’enfance, <i>S. aureus</i> ou <i>P. aeruginosa</i> chez un sujet jeune, infertilité masculine par absence des canaux déférents, pancréatite récidivante, polypose nasale.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic donne accès à un centre spécialisé et aux modulateurs du CFTR, qui corrigent la protéine et transforment le pronostic. Il ouvre aussi un conseil génétique familial.</p></template>

<template data-pop="j47-dcp" data-title="Dyskinésie ciliaire primitive">
<div class="lab">Définition</div><p>La DCP est une maladie génétique, le plus souvent autosomique récessive, des cils mobiles. Plus de cinquante gènes sont connus.</p>
<div class="lab">Clinique</div><p>Détresse respiratoire néonatale inexpliquée, toux productive depuis la petite enfance, rhinosinusite chronique, otites séreuses, infertilité masculine et parfois féminine, situs inversus chez environ la moitié des patients (syndrome de Kartagener).</p>
<div class="lab">Diagnostic</div><p>Monoxyde d’azote nasal bas en dépistage, puis vidéomicroscopie à haute vitesse du battement ciliaire, microscopie électronique et génétique dans un centre de référence (recommandation ERS et ATS 2025, citée par le résumé ERS 2026).</p>
<div class="lab">Conséquence pratique</div><p>La DCP est un facteur de risque d’exacerbation dans l’ERS 2025. Son traitement repose sur un drainage bronchique quotidien et un traitement précoce des infections ; aucun traitement ciblé n’existe à ce jour.</p></template>

<template data-pop="j47-abpa" data-title="Aspergillose bronchopulmonaire allergique">
<div class="lab">Définition</div><p>L’ABPA est une réaction d’hypersensibilité à <i>Aspergillus fumigatus</i> qui colonise les bronches d’un patient prédisposé (asthme, bronchiectasies, BPCO, mucoviscidose).</p>
<div class="lab">Critères ISHAM 2024</div><p>Sensibilisation fongique obligatoire (IgE spécifiques ou test cutané) et IgE totales ≥ 500 UI/mL, plus deux éléments parmi : IgG spécifiques d’<i>Aspergillus</i>, éosinophilie sanguine, imagerie évocatrice (bronchiectasies centrales, bouchons muqueux, mucus hyperdense).</p>
<div class="lab">Mécanisme</div><p>Les hyphes retenus dans le mucus déclenchent une inflammation de type 2 intense ; les bouchons muqueux et l’inflammation détruisent les bronches proximales.</p>
<div class="lab">Traitement</div><p>Prednisolone orale ou itraconazole en monothérapie pour l’ABPA aiguë ; association des deux pour les exacerbations récidivantes (ISHAM 2024). Les patients asymptomatiques ne sont pas traités systématiquement.</p>
<div class="lab">Piège</div><p>Un corticostéroïde oral récent abaisse les IgE et les éosinophiles et peut masquer le diagnostic.</p></template>

<template data-pop="j47-dici" data-title="Déficits immunitaires">
<div class="lab">Définition</div><p>Un déficit de production d’anticorps prive les bronches de l’opsonisation des bactéries encapsulées, comme <i>H. influenzae</i> et <i>Streptococcus pneumoniae</i>.</p>
<div class="lab">Formes</div><p>Primitives : DICV, agammaglobulinémie, déficit en anticorps spécifiques. Secondaires : anticorps anti-CD20, leucémie lymphoïde chronique, myélome, pertes protéiques.</p>
<div class="lab">Indices</div><p>Infections bactériennes respiratoires et sinusiennes répétées, pneumonies à pneumocoque, diarrhées chroniques, maladies auto-immunes associées.</p>
<div class="lab">Conséquence pratique</div><p>La substitution en immunoglobulines, par voie intraveineuse toutes les 3 à 4 semaines ou sous-cutanée hebdomadaire, réduit les infections. Elle s’ajuste au taux résiduel d’IgG et à la fréquence des infections, sous la responsabilité d’un immunologue.</p></template>

<template data-pop="j47-postinf" data-title="Bronchiectasies post-infectieuses">
<div class="lab">Mécanisme</div><p>Une infection sévère détruit l’épithélium cilié et la paroi bronchique : coqueluche, rougeole, adénovirus, pneumonie nécrosante, tuberculose. La dilatation apparaît dans le territoire atteint.</p>
<div class="lab">Valeur</div><p>L’antécédent est fréquent mais n’exclut pas une autre cause ; une infection grave de l’enfance peut elle-même révéler un déficit immunitaire ou une DCP.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic de cause post-infectieuse reste un diagnostic d’exclusion après le bilan minimal. La vaccination de l’enfant contre la coqueluche et la rougeole en est la prévention primaire.</p></template>

<template data-pop="j47-bpco" data-title="Bronchiectasies, BPCO et asthme">
<div class="lab">Relation</div><p>La BPCO et l’asthme peuvent coexister avec les bronchiectasies ou en être la cause lorsqu’ils sont mal contrôlés. L’association BPCO et bronchiectasies est de plus mauvais pronostic que chacune isolée.</p>
<div class="lab">Critères ROSE</div><p>Radiologie (bronchiectasies à la tomodensitométrie), obstruction (VEMS/CVF &lt; 0,70 après bronchodilatateur), symptômes, exposition (au moins 10 paquets-années ou biomasse). Les quatre éléments réunis définissent l’association.</p>
<div class="lab">Piège</div><p>Une obstruction chez un non-fumeur sans autre exposition ne suffit pas à poser une BPCO, car l’obstruction est fréquente dans les bronchiectasies isolées.</p>
<div class="lab">Conséquence pratique</div><p>Le corticostéroïde inhalé n’est justifié que si l’asthme ou la BPCO l’exigent, par exemple en présence d’une éosinophilie ; sinon, une double bronchodilatation est préférée (résumé clinique ERS 2026). Voir les cours J44 et J45.</p></template>

<template data-pop="j47-sys" data-title="Maladies systémiques associées">
<div class="lab">Fréquence</div><p>Selon les définitions, 5 à 10 % des patients atteints de polyarthrite rhumatoïde, de maladie inflammatoire de l’intestin ou d’autres connectivites ont des bronchiectasies (Mosgrove et al., 2026).</p>
<div class="lab">Mécanisme</div><p>L’inflammation systémique atteint les voies aériennes ; les traitements immunosuppresseurs augmentent en outre le risque infectieux. Dans la colite ulcéreuse, l’atteinte bronchique peut apparaître après la colectomie.</p>
<div class="lab">Conséquence pratique</div><p>La polyarthrite rhumatoïde est un facteur de risque d’exacerbation dans l’ERS 2025. Le pneumologue et le rhumatologue coordonnent les immunosuppresseurs et le traitement anti-infectieux.</p></template>

<template data-pop="j47-obstr" data-title="Obstruction bronchique localisée et bronchoscopie">
<div class="lab">Mécanisme</div><p>Un obstacle (corps étranger, tumeur carcinoïde, adénopathie, sténose cicatricielle) empêche le drainage d’un territoire : le mucus s’accumule et s’infecte, et les bronches d’aval se dilatent.</p>
<div class="lab">Indices</div><p>Atteinte d’un seul lobe ou segment, pneumonies répétées au même endroit, sibilant localisé fixe, hémoptysie.</p>
<div class="lab">Conséquence pratique</div><p>La bronchoscopie identifie et parfois retire l’obstacle ; elle permet aussi des prélèvements protégés lorsque le patient ne crache pas.</p></template>

<template data-pop="j47-rare" data-title="Causes rares">
<div class="lab">Syndrome de Mounier-Kuhn</div><p>Trachéobronchomégalie congénitale par atrophie des fibres élastiques et musculaires : toux inefficace et rétention des sécrétions.</p>
<div class="lab">Syndrome de Williams-Campbell</div><p>Déficit du cartilage des bronches de 4e à 6e génération : bronchiectasies proximales qui se collabent à l’expiration.</p>
<div class="lab">Syndrome de Young</div><p>Bronchiectasies, sinusites et azoospermie obstructive, sans anomalie ciliaire ni du CFTR démontrée.</p>
<div class="lab">Syndrome des ongles jaunes</div><p>Ongles jaunes épaissis, lymphœdème et épanchements pleuraux, associés à des bronchiectasies.</p>
<div class="lab">Conséquence pratique</div><p>Ces causes justifient un avis spécialisé lorsque le bilan usuel est négatif et que le tableau est atypique.</p></template>

<template data-pop="j47-mnt" data-title="Mycobactéries non tuberculeuses">
<div class="lab">Définition</div><p>Mycobactéries de l’environnement, présentes dans le sol et l’eau ; le complexe <i>Mycobacterium avium</i> est le plus fréquent chez les patients porteurs de bronchiectasies, devant <i>M. abscessus</i>.</p>
<div class="lab">Relation</div><p>Les MNT peuvent causer des bronchiectasies ou infecter des bronches déjà dilatées. Le profil classique est celui d’une femme mince avec une toux peu productive et une atteinte du lobe moyen et de la lingula.</p>
<div class="lab">Diagnostic</div><p>Culture pour BAAR demandée explicitement, à répéter ; l’infection pulmonaire à MNT exige des critères cliniques, radiologiques et microbiologiques (ATS/ERS/ESCMID/IDSA 2020). La coloration de Ziehl-Neelsen est moins sensible que la culture.</p>
<div class="lab">Traitement</div><p>Association de plusieurs antibiotiques pendant une longue durée, souvent 18 mois à 2 ans (Mosgrove et al., 2026), en centre spécialisé.</p>
<div class="lab">Piège</div><p>Un macrolide en monothérapie sélectionne des MNT résistantes : la recherche précède toujours un macrolide au long cours.</p></template>

<template data-pop="j47-pseudo" data-title="Pseudomonas aeruginosa">
<div class="lab">Définition</div><p>Bacille à Gram négatif non fermentant, naturellement résistant à l’amoxicilline. En Europe, il est isolé chez environ 22 % des patients dont les crachats sont cultivés (Mosgrove et al., 2026).</p>
<div class="lab">Infection chronique</div><p>Même germe isolé au moins deux fois à au moins trois mois d’intervalle sur un an (consensus Aliberti et al., 2022).</p>
<div class="lab">Pronostic</div><p>Associé à une mortalité environ trois fois plus élevée et à des hospitalisations environ sept fois plus fréquentes. Cette association reflète aussi la gravité préalable des bronches qu’il colonise.</p>
<div class="lab">Conséquence pratique</div><p>Premier isolement : nouvelle culture et éradication rapide. Infection chronique avec haut risque : antibiotique inhalé (recommandation forte) ou macrolide. Exacerbation : antibiotique actif sur <i>P. aeruginosa</i>.</p></template>

<template data-pop="j47-biofilm" data-title="Biofilm de Pseudomonas aeruginosa">
<div class="lab">Définition</div><p>Communauté bactérienne enrobée d’une matrice d’alginate et de polysaccharides, adhérente au mucus et à la paroi.</p>
<div class="lab">Mécanisme</div><p>La communication chimique entre bactéries, appelée détection du quorum, coordonne la formation du biofilm et la production de facteurs de virulence. Les bactéries du biofilm se divisent lentement, ce qui les rend moins sensibles aux antibiotiques qui ciblent la croissance.</p>
<div class="lab">Conséquence pratique</div><p>L’éradication réussit surtout au premier isolement, avant l’installation du biofilm et du phénotype mucoïde. Les macrolides réduisent la production de facteurs de virulence sans tuer <i>P. aeruginosa</i>.</p></template>
