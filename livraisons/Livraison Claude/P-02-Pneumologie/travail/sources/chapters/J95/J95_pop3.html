
<!-- ===== FENÊTRES : examens ===== -->
<template data-pop="j95-ppo" data-title="Valeurs postopératoires prédites">
<div class="lab">Méthode anatomique</div><p>Le poumon compte 19 segments fonctionnels : 10 à droite (3 supérieurs, 2 moyens, 5 inférieurs) et 9 à gauche (5 supérieurs dont la lingula, 4 inférieurs). Valeur prédite = valeur préopératoire × (1 − segments fonctionnels réséqués ÷ segments fonctionnels totaux). Les segments obstrués par une tumeur peuvent être retirés du dénominateur, car ils ne participent déjà plus.</p>
<div class="lab">Méthode scintigraphique</div><p>Avant une pneumonectomie, la scintigraphie de perfusion mesure la part de chaque poumon. Valeur prédite = valeur préopératoire × (1 − fraction de perfusion du poumon retiré).</p>
<div class="lab">Exemple</div><p>VEMS de 2,4 L (80 % de la valeur prédite), pneumonectomie droite, poumon droit à 55 % de la perfusion : 2,4 × 0,45 = 1,08 L, soit 36 % de la valeur prédite. Le risque est élevé et la décision requiert une épreuve d’effort et une discussion multidisciplinaire.</p>
<div class="lab">Limite</div><p>La valeur mesurée trois mois après une lobectomie est souvent supérieure à la valeur prédite, car le poumon restant se distend et la mécanique s’améliore. La prédiction est donc prudente.</p></template>

<template data-pop="j95-tcpe" data-title="Épreuve d’effort cardiorespiratoire">
<div class="lab">Principe</div><p>Le patient pédale sur un ergomètre avec une charge croissante pendant que l’on mesure l’oxygène consommé et le gaz carbonique rejeté. La consommation maximale d’oxygène, ou VO₂ maximal, intègre le cœur, le poumon, la circulation et les muscles.</p>
<div class="lab">Pourquoi elle prédit le risque</div><p>L’intervention augmente la consommation d’oxygène pendant plusieurs jours. Un patient dont la capacité maximale est faible n’a pas la réserve pour cette demande.</p>
<div class="lab">Seuils ERS/ESTS 2025</div><p>Un VO₂ maximal inférieur à 12 mL/kg/min ou une pente VE/VCO₂ supérieure à 40 suggèrent un risque élevé. Le texte de 2009 retenait moins de 10 mL/kg/min ou moins de 35 % de la valeur prédite comme seuil de risque élevé, et plus de 20 mL/kg/min comme risque faible.</p>
<div class="lab">Limite</div><p>Le test exige la coopération et une capacité à pédaler. Les recommandations de 2025 jugent le niveau de preuve très faible et ne fixent pas de seuil unique d’inopérabilité.</p></template>

<template data-pop="j95-rx" data-title="Radiographie de l’atélectasie">
<div class="lab">Signe direct</div><p>Déplacement d’une scissure vers la zone collabée.</p>
<div class="lab">Signes indirects</div><p>Ascension de l’hémicoupole, attraction du médiastin, de la trachée et du hile, pincement des espaces intercostaux, hyperinflation compensatrice du poumon voisin.</p>
<div class="lab">Aspects par lobe</div><p>Lobe inférieur gauche : opacité triangulaire rétrocardiaque qui efface la coupole gauche. Lobe moyen : effacement du bord droit du cœur. Lobe supérieur droit : opacité en éventail avec scissure ascensionnée ; si une masse hilaire bombe, la scissure dessine un « S » inversé, signe de Golden, très évocateur d’une tumeur.</p>
<div class="lab">Piège</div><p>Une radiographie au lit en décubitus est de qualité limitée. L’échographie au lit apporte souvent une réponse plus rapide.</p></template>

<template data-pop="j95-echo" data-title="Échographie pulmonaire et diaphragmatique">
<div class="lab">Aspects normaux</div><p>Glissement pleural animé par la respiration ; lignes A horizontales, répétitions de la ligne pleurale.</p>
<div class="lab">Aspects pathologiques</div><p>Pneumothorax : abolition du glissement, et point poumon qui le confirme. Œdème interstitiel : lignes B verticales multiples. Condensation ou atélectasie : aspect tissulaire ; un bronchogramme aérien dynamique plaide pour une pneumonie. Épanchement : zone anéchogène.</p>
<div class="lab">Diaphragme</div><p>En mode temps-mouvement, la course de la coupole se mesure en respiration calme et en reniflement. En mode bidimensionnel dans la zone d’apposition, l’épaississement inspiratoire se mesure ; une fraction d’épaississement inférieure à 20 % est retrouvée dans la paralysie.</p>
<div class="lab">Limite</div><p>L’examen dépend de l’opérateur, et un emphysème sous-cutané ou une obésité gênent la fenêtre.</p></template>

<template data-pop="j95-tdmdyn" data-title="Tomodensitométrie en inspiration et en expiration">
<div class="lab">Principe</div><p>Deux acquisitions, en fin d’inspiration et en fin d’expiration, comparent la densité du parenchyme et le calibre des voies aériennes.</p>
<div class="lab">Piégeage d’air</div><p>Les zones dont les bronchioles sont obstruées restent claires en expiration alors que le parenchyme normal devient plus dense : c’est l’aspect en mosaïque de la bronchiolite oblitérante.</p>
<div class="lab">Collapsus trachéal</div><p>La comparaison de la surface trachéale en inspiration et en expiration quantifie la trachéobronchomalacie et le collapsus de la membrane postérieure.</p>
<div class="lab">Limite</div><p>Une expiration insuffisante sous-estime le piégeage ; l’opérateur entraîne le patient avant l’acquisition.</p></template>

<template data-pop="j95-gds" data-title="Gradient alvéolo-artériel en oxygène">
<div class="lab">Calcul</div><p>PAO₂ = FiO₂ × (pression barométrique − 47 mmHg) − PaCO₂/0,8. Gradient = PAO₂ − PaO₂. Exemple à l’air au niveau de la mer : PaCO₂ 40 mmHg, PAO₂ = 0,21 × 713 − 50 ≈ 100 mmHg ; si la PaO₂ vaut 60 mmHg, le gradient est de 40 mmHg, nettement augmenté.</p>
<div class="lab">Valeurs normales</div><p>Le gradient augmente avec l’âge. Une estimation courante de la limite supérieure est d’environ âge/4 + 4 mmHg à l’air.</p>
<div class="lab">Altitude</div><p>À Neuchâtel, vers 430 m, la pression barométrique est d’environ 720 mmHg, ce qui abaisse la PAO₂ et la PaO₂ normales de quelques mmHg par rapport au niveau de la mer.</p>
<div class="lab">Limite</div><p>Sous fraction d’oxygène élevée, le gradient augmente même chez le sujet sain ; le rapport PaO₂/FiO₂ est alors préféré.</p></template>

<template data-pop="j95-cdv" data-title="Courbe débit-volume et obstruction des voies aériennes supérieures">
<div class="lab">Normal</div><p>La courbe expiratoire monte rapidement à un pic, puis décroît de façon presque linéaire. La courbe inspiratoire forme un demi-cercle sous l’axe.</p>
<div class="lab">Obstruction fixe</div><p>Sténose trachéale cicatricielle ou tumorale rigide : plateau inspiratoire et expiratoire, car le calibre ne varie pas avec la phase respiratoire.</p>
<div class="lab">Obstruction variable extrathoracique</div><p>Paralysie des cordes vocales, trachéomalacie cervicale : plateau inspiratoire seul, car la pression intratrachéale négative à l’inspiration rétrécit la lumière.</p>
<div class="lab">Obstruction variable intrathoracique</div><p>Trachéomalacie thoracique, tumeur intrathoracique mobile : plateau expiratoire seul, car la pression pleurale positive à l’expiration comprime la trachée.</p>
<div class="lab">Indice d’Empey</div><p>VEMS en mL divisé par le débit expiratoire de pointe en L/min. Une valeur supérieure à 10 suggère une obstruction des voies aériennes supérieures (Empey, British Medical Journal 1972).</p></template>

<template data-pop="j95-endo" data-title="Endoscopie des voies aériennes après acte médical">
<div class="lab">Indications</div><p>Sténose suspectée ; saignement par une canule ; fistule trachéo-œsophagienne ou bronchopleurale ; atélectasie lobaire persistante par bouchon muqueux ; suspicion de corps étranger ou de tumeur.</p>
<div class="lab">Apport</div><p>Visualisation directe, mesure de la longueur et de la distance aux cordes vocales, évaluation du cartilage, prélèvements, aspiration thérapeutique.</p>
<div class="lab">Précaution</div><p>Une sténose très serrée peut se décompenser pendant l’examen ; celui-ci se fait alors au bloc opératoire, avec une équipe capable de sécuriser les voies aériennes.</p></template>

<template data-pop="j95-sniff" data-title="Radioscopie au reniflement et tests des muscles respiratoires">
<div class="lab">Radioscopie au reniflement</div><p>Le patient renifle brièvement sous radioscopie. Une coupole paralysée monte au lieu de descendre, aspirée par la pression pleurale négative. Le test peut être faussement négatif dans une paralysie bilatérale, car la contraction des muscles abdominaux simule une descente.</p>
<div class="lab">Pressions</div><p>La pression inspiratoire maximale à la bouche et la pression au reniflement nasal évaluent la force inspiratoire globale. La pression transdiaphragmatique, mesurée par sondes œsophagienne et gastrique, est la référence pour le diaphragme.</p>
<div class="lab">Électroneuromyographie</div><p>La conduction du nerf phrénique distingue une neuropathie d’une atteinte musculaire.</p></template>

<template data-pop="j95-cvdec" data-title="Capacité vitale assis et couché">
<div class="lab">Principe</div><p>En décubitus, le contenu abdominal pousse le diaphragme vers le thorax. Un diaphragme sain le repousse ; un diaphragme paralysé ne le peut pas, et la capacité vitale chute.</p>
<div class="lab">Interprétation</div><p>Chez le sujet sain, la baisse en décubitus reste faible, de l’ordre de moins de 10 %. Une baisse supérieure à environ 25 % est classiquement associée à une faiblesse diaphragmatique bilatérale importante. Les seuils varient selon les auteurs, et une paralysie unilatérale donne une baisse plus modeste.</p>
<div class="lab">Intérêt</div><p>Le test est simple, réalisable au laboratoire de fonction respiratoire, et utile au suivi des maladies neuromusculaires.</p></template>

<!-- ===== FENÊTRES : médicaments ===== -->
<template data-pop="j95-d-varen" data-title="Varénicline">
<div class="lab">Mécanisme</div><p>Agoniste partiel des récepteurs nicotiniques α4β2. Elle stimule modérément la libération de dopamine, ce qui atténue le manque, et bloque l’effet de la nicotine fumée, ce qui réduit la récompense.</p>
<div class="lab">Posologie suisse</div><p>Vareniclin-DALITA, information professionnelle d’avril 2025 lue sur ch.oddb.org : 0,5 mg une fois par jour aux jours 1 à 3, 0,5 mg deux fois par jour aux jours 4 à 7, puis 1 mg deux fois par jour pendant 12 semaines, avec début une à deux semaines avant la date d’arrêt. Clairance inférieure à 30 mL/min : 0,5 mg par jour pendant trois jours, puis 1 mg une fois par jour.</p>
<div class="lab">Effets indésirables</div><p>Nausée chez environ 28 % des patients, rêves anormaux, insomnie, céphalées. L’essai EAGLES n’a pas montré d’augmentation significative des événements neuropsychiatriques par rapport au placebo, mais l’humeur reste à surveiller.</p>
<div class="lab">Pharmacocinétique</div><p>Élimination rénale à 92 % sous forme inchangée, demi-vie d’environ 24 heures, peu d’interactions métaboliques.</p></template>

<template data-pop="j95-d-tsn" data-title="Substituts nicotiniques">
<div class="lab">Mécanisme</div><p>Ils apportent de la nicotine sans les produits de combustion, ce qui supprime le monoxyde de carbone et les irritants tout en limitant le sevrage.</p>
<div class="lab">Posologie suisse</div><p>Nicorette Invisi Pflaster, information professionnelle d’août 2026 : plus de 15 cigarettes par jour, 25 mg/16 heures pendant 8 semaines, puis 15 mg/16 heures pendant 2 semaines, puis 10 mg/16 heures pendant 2 semaines. Une forme orale rapide s’ajoute pour les envies ponctuelles.</p>
<div class="lab">Période opératoire</div><p>La nicotine seule n’altère pas de façon démontrée la cicatrisation pulmonaire. Le timbre évite le sevrage aigu pendant l’hospitalisation, qui expose à l’agitation et au départ prématuré du patient pour fumer.</p></template>

<template data-pop="j95-d-sugam" data-title="Sugammadex">
<div class="lab">Mécanisme</div><p>Gamma-cyclodextrine modifiée qui encapsule le rocuronium ou le vécuronium dans le plasma. Le gradient de concentration attire le curare hors de la jonction neuromusculaire, et le bloc disparaît en quelques minutes, quelle que soit sa profondeur.</p>
<div class="lab">Posologie suisse</div><p>Bridion, information professionnelle de février 2026 lue sur ch.oddb.org : 2 mg/kg si la deuxième réponse du train de quatre est réapparue ; 4 mg/kg pour 1 à 2 réponses post-tétaniques ; 16 mg/kg pour une antagonisation immédiate après 1,2 mg/kg de rocuronium. Le rapport du train de quatre de 0,9 est atteint en environ 2 à 3 minutes aux doses usuelles.</p>
<div class="lab">Effets indésirables et précautions</div><p>Réactions d’hypersensibilité et anaphylaxie ; bradycardies marquées rares, avec des cas d’arrêt cardiaque ; allongement transitoire du temps de thromboplastine partielle activée et de l’INR sans excès de saignement clinique. Utilisation non recommandée si la clairance de la créatinine est inférieure à 30 mL/min. Une injection équivaut à l’oubli d’une dose de contraceptif oral.</p>
<div class="lab">Limite</div><p>Aucun effet sur les curares benzylisoquinoléines, comme l’atracurium et le cisatracurium.</p></template>

<template data-pop="j95-d-neostig" data-title="Néostigmine et glycopyrronium">
<div class="lab">Mécanisme</div><p>La néostigmine inhibe l’acétylcholinestérase et augmente l’acétylcholine dans la fente synaptique, qui entre en compétition avec le curare. Le glycopyrronium bloque les effets muscariniques de cette acétylcholine : bradycardie, bronchorrhée, hypersalivation.</p>
<div class="lab">Posologie suisse</div><p>Robinul-Neostigmine, ampoule de 1 mL contenant 2,5 mg de néostigmine et 0,5 mg de glycopyrronium : 1 mL ou 0,02 mL/kg en 10 à 30 secondes, à répéter si nécessaire, sans dépasser 2 mL au total.</p>
<div class="lab">Conditions d’emploi</div><p>Bloc superficiel avec rapport du train de quatre supérieur à 0,2 selon la recommandation européenne de 2023 ; surveillance quantitative jusqu’à un rapport supérieur à 0,9. Effet plafond : inefficace sur un bloc profond.</p>
<div class="lab">Précautions</div><p>Bronchospasme, bradycardie sévère, chirurgie intestinale ou vésicale récente ; contre-indication en cas d’obstruction mécanique digestive ou urinaire.</p></template>

<template data-pop="j95-d-antiacide" data-title="Prévention médicamenteuse de l’inhalation acide">
<div class="lab">Objectif</div><p>Élever le pH gastrique et réduire le volume du contenu gastrique chez un patient à risque, pour que l’éventuelle inhalation soit moins agressive.</p>
<div class="lab">Moyens</div><p>Antiacide non particulaire juste avant l’induction, antihistaminique H2 ou inhibiteur de la pompe à protons quelques heures avant, prokinétique dans certaines situations.</p>
<div class="lab">Preuves</div><p>Ces médicaments modifient le pH et le volume gastriques, mais aucun grand essai n’a démontré une réduction des pneumopathies d’inhalation cliniquement importantes. Leur usage relève des protocoles locaux d’anesthésie, surtout en obstétrique.</p>
<div class="lab">Piège</div><p>Un antiacide particulaire inhalé provoque lui-même une pneumopathie ; seuls les antiacides non particulaires conviennent.</p></template>

<template data-pop="j95-d-atb" data-title="Antibiothérapie des complications infectieuses">
<div class="lab">Pneumonie postopératoire</div><p>Elle se traite comme une pneumonie acquise à l’hôpital : choix selon le délai d’apparition, les facteurs de risque de germes résistants, l’écologie locale et la gravité, puis adaptation aux prélèvements. Le détail se trouve dans le cours J18.</p>
<div class="lab">Inhalation</div><p>Pas d’antibiotique pour une pneumopathie chimique non compliquée. Antibiotique si une pneumonie d’inhalation se constitue ou si l’estomac est probablement colonisé.</p>
<div class="lab">Médiastinite</div><p>Antibiothérapie large couvrant les staphylocoques, y compris résistants si le risque existe, et les bacilles à Gram négatif ; adaptation aux prélèvements profonds ; durée prolongée. Le drainage chirurgical reste indispensable.</p></template>

<template data-pop="j95-d-analg" data-title="Analgésie épargnant les opioïdes">
<div class="lab">Objectif respiratoire</div><p>Permettre une inspiration profonde et une toux efficace sans déprimer la commande respiratoire.</p>
<div class="lab">Moyens</div><p>Analgésie péridurale thoracique après laparotomie ou thoracotomie ; blocs pariétaux et paravertébraux ; paracétamol ; anti-inflammatoires non stéroïdiens si la fonction rénale et le risque hémorragique le permettent ; opioïdes à la plus faible dose utile.</p>
<div class="lab">Précaution</div><p>Une péridurale thoracique haute peut affaiblir les muscles intercostaux ; un bloc interscalénique paralyse le diaphragme homolatéral, ce qui le contre-indique en pratique chez un patient qui dépend de ce diaphragme, par exemple avec une paralysie controlatérale.</p></template>

<template data-pop="j95-d-fam" data-title="Fluticasone, azithromycine et montélukast">
<div class="lab">Rationnel</div><p>Le corticostéroïde inhalé agit localement sur l’inflammation bronchiolaire ; l’azithromycine réduit l’inflammation neutrophilique ; le montélukast bloque les leucotriènes impliqués dans la fibrose.</p>
<div class="lab">Preuves</div><p>Étude de phase II de Williams et collaborateurs (Biology of Blood and Marrow Transplantation 2016) : stabilisation fonctionnelle chez la majorité des patients et réduction de la corticothérapie systémique à trois mois. Pas d’essai randomisé de grande taille.</p>
<div class="lab">Schéma de l’étude</div><p>Fluticasone 440 µg deux fois par jour, azithromycine 250 mg trois fois par semaine, montélukast 10 mg par jour. Ce schéma est hors indication autorisée en Suisse pour cette maladie et se décide avec le centre de greffe.</p>
<div class="lab">Surveillance</div><p>Infections, candidose buccale, intervalle QT et audition sous azithromycine.</p></template>

<template data-pop="j95-d-rux" data-title="Ruxolitinib">
<div class="lab">Mécanisme</div><p>Inhibiteur des kinases JAK1 et JAK2, qui transmettent les signaux de nombreuses cytokines. Il diminue l’activation et la prolifération des lymphocytes T alloréactifs.</p>
<div class="lab">Indication suisse</div><p>Jakavi, information professionnelle de juin 2026 : maladie du greffon contre l’hôte <b>aiguë</b> de grade 2 ou plus réfractaire aux corticostéroïdes, dès 2 ans ; dose initiale de 5 mg deux fois par jour dès 6 ans, augmentable à 10 mg deux fois par jour dès 12 ans après trois jours si la tolérance le permet.</p>
<div class="lab">Forme chronique</div><p>L’essai REACH3 a montré un bénéfice dans la forme chronique réfractaire, mais cette indication ne figure pas dans l’information professionnelle suisse lue le 08.10.2026.</p>
<div class="lab">Surveillance</div><p>Cytopénies, infections, zona, réactivation de l’hépatite B, leucoencéphalopathie multifocale progressive ; dépistage de la tuberculose avant traitement ; interactions avec les inhibiteurs puissants du CYP3A4.</p></template>

<template data-pop="j95-cont-rux" data-title="Ruxolitinib dans la maladie du greffon chronique : sources divergentes">
<div class="lab">Source la plus récente sur l’efficacité</div><p>Essai REACH3 (Zeiser et collaborateurs, New England Journal of Medicine 2021) : chez des patients de 12 ans et plus atteints de maladie du greffon chronique réfractaire ou dépendante des corticostéroïdes, le ruxolitinib a donné un taux de réponse globale à 24 semaines supérieur à la meilleure thérapie disponible. L’Agence européenne des médicaments a ensuite étendu l’autorisation à la forme chronique.</p>
<div class="lab">Texte en vigueur en Suisse</div><p>Information professionnelle suisse de Jakavi, juin 2026, lue sur ch.oddb.org le 08.10.2026 : seule la forme aiguë réfractaire aux corticostéroïdes figure dans les indications. Les effets indésirables observés dans REACH3 y sont mentionnés, mais pas l’indication.</p>
<div class="lab">Arbitrage</div><p>Sur le plan scientifique, l’essai le plus récent montre l’efficacité. Sur le plan réglementaire suisse, l’emploi reste hors indication : il demande une information du patient, une décision du centre de greffe et, en pratique, une demande de prise en charge à l’assureur.</p>
<div class="lab">Limite</div><p>La bronchiolite oblitérante établie répond moins bien que les autres organes atteints par la maladie du greffon chronique ; le bénéfice pulmonaire spécifique reste modeste.</p></template>

<template data-pop="j95-d-nint" data-title="Nintédanib dans la sclérodermie pulmonaire">
<div class="lab">Mécanisme</div><p>Inhibiteur de plusieurs récepteurs à activité tyrosine kinase impliqués dans la prolifération et la migration des fibroblastes.</p>
<div class="lab">Indication suisse</div><p>Ofev, information professionnelle de mars 2025 : fibrose pulmonaire idiopathique, pneumopathies interstitielles fibrosantes progressives, pneumopathie interstitielle associée à la sclérodermie systémique. Dose : 150 mg deux fois par jour avec un repas, sans dépasser 300 mg par jour.</p>
<div class="lab">Renvoi</div><p>Effets indésirables, surveillance hépatique et adaptation de dose sont détaillés dans le cours J84.</p></template>
