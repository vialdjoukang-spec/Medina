
<!-- ===== FENÊTRES : risque, physiopathologie et complications postopératoires ===== -->
<template data-pop="j95-cpp" data-title="Complications pulmonaires postopératoires">
<div class="lab">Définition</div><p>Les complications pulmonaires postopératoires forment un ensemble défini en 2015 par le groupe European Perioperative Clinical Outcome (Jammer et collaborateurs, European Journal of Anaesthesiology). Il comprend l’insuffisance respiratoire, l’infection respiratoire, l’atélectasie, le bronchospasme, la pneumopathie d’inhalation, l’épanchement pleural et le pneumothorax. Une définition révisée, proposée par l’initiative StEP-COMPAC en 2018, privilégie les événements cliniquement graves.</p>
<div class="lab">Pourquoi une définition commune</div><p>Avant ces définitions, les taux publiés variaient de moins de 2 % à plus de 40 % selon ce que chaque étude comptait. Une définition partagée permet de comparer les populations et d’évaluer les mesures de prévention.</p>
<div class="lab">Limite</div><p>Le critère composite additionne des événements de gravité inégale. Une atélectasie radiologique sans symptôme compte autant qu’une réintubation. Un essai qui réduit seulement les atélectasies mineures peut donc paraître efficace sans bénéfice clinique réel.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin lit toujours la composition du critère principal d’un essai avant d’adopter une mesure préventive.</p></template>

<template data-pop="j95-ariscat" data-title="Score ARISCAT">
<div class="lab">Origine</div><p>Le score ARISCAT (Assess Respiratory Risk in Surgical Patients in Catalonia) a été construit sur 2464 patients opérés dans 59 hôpitaux catalans, choisis au hasard parmi toutes les interventions (Canet et collaborateurs, Anesthesiology 2010). Sept facteurs indépendants ont été retenus : âge, saturation préopératoire, infection respiratoire du mois précédent, anémie, incision abdominale haute ou intrathoracique, durée d’au moins deux heures et urgence.</p>
<div class="lab">Performance</div><p>L’aire sous la courbe ROC était de 0,90 dans l’échantillon de développement et de 0,88 dans l’échantillon de validation interne. La validation externe européenne a confirmé une bonne discrimination, avec une calibration moins bonne selon les pays.</p>
<div class="lab">Mode d’emploi</div><p>Le médecin additionne les points : moins de 26, risque faible ; 26 à 44, intermédiaire ; 45 ou plus, élevé. Exemple : un homme de 70 ans (3), saturation 95 % (8), laparotomie sus-ombilicale (15) de 2,5 heures (16), programmée : 42 points, risque intermédiaire.</p>
<div class="lab">Limites</div><p>Le score est peu discriminant en chirurgie cardiaque et en résection pulmonaire. Il ne contient ni la BPCO, ni le tabac, ni l’apnée du sommeil, qui restent à évaluer cliniquement. Il estime un risque ; il ne contre-indique pas une intervention.</p></template>

<template data-pop="j95-acp" data-title="Facteurs de risque selon l’American College of Physicians (2006)">
<div class="lab">Contenu</div><p>La recommandation de l’American College of Physicians publiée dans Annals of Internal Medicine en 2006 a synthétisé les facteurs de risque de complications pulmonaires après chirurgie non cardiothoracique. Les facteurs liés au patient avec le niveau de preuve le plus élevé sont l’âge, la classe de l’American Society of Anesthesiologists égale ou supérieure à II, l’insuffisance cardiaque, la dépendance fonctionnelle et la BPCO. Une albumine inférieure à 35 g/L est le marqueur biologique le plus fort.</p>
<div class="lab">Facteurs liés à l’intervention</div><p>Chirurgie aortique, thoracique, abdominale haute, neurochirurgie, chirurgie de la tête et du cou, chirurgie vasculaire, anesthésie générale, urgence et durée prolongée.</p>
<div class="lab">Recommandations pratiques</div><p>La recommandation déconseille la spirométrie et la radiographie thoracique systématiques. Elle recommande les manœuvres d’expansion pulmonaire après l’intervention chez les patients à risque et la pose sélective, et non systématique, d’une sonde nasogastrique.</p>
<div class="lab">Limite</div><p>Le texte date de 2006. Il reste cité, mais certaines données, comme le rôle du syndrome d’apnées du sommeil, se sont précisées depuis.</p></template>

<template data-pop="j95-crf" data-title="Capacité résiduelle fonctionnelle et volume de fermeture">
<div class="lab">Définitions</div><p>La capacité résiduelle fonctionnelle est le volume d’air restant dans les poumons à la fin d’une expiration calme : environ 3 L chez l’adulte debout. Le volume de fermeture est le volume pulmonaire en dessous duquel les petites voies aériennes des zones déclives commencent à se fermer.</p>
<div class="lab">Mécanisme</div><p>La pression pleurale est moins négative aux bases qu’aux sommets, à cause du poids du poumon. Les petites voies aériennes des bases, dépourvues de cartilage, se ferment donc les premières lorsque le volume pulmonaire diminue.</p>
<div class="lab">Facteurs qui rapprochent les deux volumes</div><p>Le décubitus, l’anesthésie, l’obésité, la grossesse et la distension abdominale abaissent la capacité résiduelle. L’âge et le tabac élèvent le volume de fermeture.</p>
<div class="lab">Conséquence pratique</div><p>Lorsque la capacité résiduelle passe sous le volume de fermeture, les bases se ferment à chaque expiration et créent un shunt. Le lever, la position assise et la pression positive continue relèvent la capacité résiduelle et rouvrent les bases.</p></template>

<template data-pop="j95-atel" data-title="Atélectasie : mécanismes">
<div class="lab">Définition</div><p>Une atélectasie est un affaissement d’alvéoles qui ne contiennent plus d’air, avec une perte de volume de la zone concernée.</p>
<div class="lab">Quatre mécanismes</div><p><b>Obstruction et résorption</b> : une bronche bouchée laisse le gaz d’aval diffuser dans le sang ; l’oxygène pur accélère ce processus. <b>Compression</b> : un épanchement, une masse ou un diaphragme refoulé écrasent le poumon. <b>Adhésion</b> : la perte de surfactant augmente la tension superficielle, comme dans le syndrome de détresse. <b>Cicatrisation</b> : une fibrose rétracte le parenchyme.</p>
<div class="lab">Signes</div><p>Matité, diminution du murmure, parfois souffle tubaire si la bronche reste ouverte. En radiographie : scissure déplacée, coupole ascensionnée, médiastin attiré.</p>
<div class="lab">Piège</div><p>L’association classique entre atélectasie et fièvre précoce est faible. Une fièvre élevée ou persistante fait chercher une infection, une fuite anastomotique ou une thrombose.</p>
<div class="lab">Conséquence pratique</div><p>Le mécanisme dicte le traitement : kinésithérapie et pression positive pour la compression et l’hypoventilation, aspiration bronchique pour un bouchon muqueux lobaire, fibroscopie pour exclure une tumeur chez un fumeur.</p></template>

<template data-pop="j95-diaph" data-title="Dysfonction diaphragmatique postopératoire">
<div class="lab">Définition</div><p>Diminution de la contribution du diaphragme à la ventilation après une chirurgie abdominale haute ou thoracique, sans lésion du nerf phrénique.</p>
<div class="lab">Mécanisme</div><p>Des afférences viscérales, péritonéales et pariétales inhibent par voie réflexe la commande du nerf phrénique. La douleur y contribue, mais une analgésie parfaite ne supprime pas l’inhibition, ce qui prouve que la douleur n’est pas le seul mécanisme.</p>
<div class="lab">Chiffres</div><p>Après une laparotomie sus-ombilicale, la capacité vitale baisse de 50 à 60 % au premier jour. La capacité résiduelle fonctionnelle baisse d’environ un tiers avec un minimum entre 24 et 48 heures. La normalisation prend une à deux semaines.</p>
<div class="lab">Conséquence pratique</div><p>Les incisions transversales et la laparoscopie réduisent l’atteinte. L’analgésie péridurale thoracique améliore la toux et la fonction, sans les normaliser.</p></template>

<template data-pop="j95-curare" data-title="Curarisation résiduelle">
<div class="lab">Définition</div><p>Persistance d’un bloc neuromusculaire après l’anesthésie, définie par un rapport du train de quatre inférieur à 0,9 au muscle adducteur du pouce.</p>
<div class="lab">Mesure</div><p>Le moniteur stimule quatre fois le nerf ulnaire à 2 Hz. Le rapport entre l’amplitude de la quatrième et de la première réponse mesure la profondeur du bloc. L’évaluation visuelle ou tactile ne détecte pas un rapport entre 0,4 et 0,9 : seul un moniteur quantitatif le mesure.</p>
<div class="lab">Conséquences</div><p>Les muscles du pharynx et de la déglutition récupèrent après le diaphragme. Un patient qui respire correctement peut donc encore inhaler et obstruer ses voies aériennes. La curarisation résiduelle augmente l’hypoxémie précoce et les complications pulmonaires.</p>
<div class="lab">Prévention</div><p>Moniteur quantitatif systématique et antagonisation adaptée à la profondeur mesurée, selon la recommandation de la Société européenne d’anesthésiologie et de soins intensifs de 2023.</p></template>

<template data-pop="j95-saos" data-title="Syndrome d’apnées obstructives du sommeil en période opératoire">
<div class="lab">Problème</div><p>Une grande partie des patients apnéiques opérés n’ont pas de diagnostic connu. Les opioïdes, les sédatifs et les anesthésiques diminuent le tonus du pharynx et l’éveil en réponse à l’hypoxémie.</p>
<div class="lab">Dépistage</div><p>Le questionnaire STOP-BANG compte huit items : ronflement, fatigue, apnées observées, hypertension, indice de masse corporelle supérieur à 35 kg/m², âge supérieur à 50 ans, tour de cou élevé et sexe masculin. Un score élevé augmente la probabilité d’un syndrome modéré à sévère.</p>
<div class="lab">Conduite</div><p>Le patient appareillé apporte sa machine. Le médecin privilégie une analgésie sans opioïde ou à faible dose, la position semi-assise et une oxymétrie continue la première nuit.</p>
<div class="lab">Limite</div><p>Le dépistage est sensible mais peu spécifique. Il ne doit pas retarder une chirurgie urgente pour une polygraphie.</p></template>

<template data-pop="j95-preop-tho" data-title="Évaluation avant résection pulmonaire (ERS/ESTS 2025)">
<div class="lab">Principe</div><p>La recommandation commune de l’European Respiratory Society et de l’European Society of Thoracic Surgeons, publiée en 2025, évalue l’aptitude au traitement à visée curative du cancer bronchique. Elle sépare l’évaluation cardiovasculaire de l’évaluation cardiorespiratoire.</p>
<div class="lab">Étapes</div><p>1. Spirométrie et DLCO chez tous les candidats (recommandation forte pour la DLCO). 2. Calcul du VEMS et de la DLCO postopératoires prédits. 3. Test de terrain (marche, navette, escaliers). 4. Épreuve d’effort cardiorespiratoire si la fonction est altérée ou si le test de terrain est médiocre.</p>
<div class="lab">Seuils indicatifs</div><p>Valeurs prédites : 60 % ou plus normal, 40 à 59 % modéré, moins de 40 % élevé. VO₂ maximal inférieur à 12 mL/kg/min ou pente VE/VCO₂ supérieure à 40 : risque élevé. Marche de plus de 400 m ou montée de plus de 10 m : risque plus faible.</p>
<div class="lab">Évolution par rapport à 2009</div><p>L’algorithme ERS/ESTS de 2009 retenait un VO₂ maximal inférieur à 10 mL/kg/min ou à 35 % de la valeur prédite comme seuil de risque élevé. La version de 2025 ne fixe plus de seuil unique d’inopérabilité ; elle confie la décision à la réunion multidisciplinaire. Les deux textes restent consultables ; la version de 2025, plus récente, est appliquée ici.</p></template>

<template data-pop="j95-pavm" data-title="Pneumonie acquise sous ventilation mécanique : codage CIM-10-GM">
<div class="lab">Constat</div><p>La CIM-10-GM 2024 ne contient aucun sous-code de J95 pour la pneumonie acquise sous ventilation mécanique. La version américaine ICD-10-CM possède un code spécifique, ce qui crée des confusions dans les documents traduits.</p>
<div class="lab">Codage en version allemande</div><p>La pneumonie se code selon le germe (J13 à J16) ou, sans germe identifié, en J18. La classification demande un code supplémentaire, U69.01 ou U69.04 avec point d’exclamation, pour indiquer chez l’adulte la relation temporelle entre la pneumonie et l’admission à l’hôpital.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement relève du cours J18. Le présent cours ne traite que la prévention des complications pulmonaires liées à l’intervention.</p></template>

<template data-pop="j95-hypox" data-title="Hypoxémie postopératoire : démarche détaillée">
<div class="lab">Étape 1 : sécurité</div><p>Le médecin vérifie la perméabilité des voies aériennes, la position d’une canule, recherche un pneumothorax sous tension et un choc. Il apporte de l’oxygène pour une saturation cible de 94 à 98 %, ou de 88 à 92 % chez un patient à risque d’hypercapnie.</p>
<div class="lab">Étape 2 : mécanisme</div><p>La gazométrie sépare l’hypoventilation (PaCO₂ élevée, gradient normal) du shunt et du trouble ventilation-perfusion (gradient augmenté).</p>
<div class="lab">Étape 3 : cause</div><p>La radiographie et l’échographie pulmonaire recherchent une atélectasie, une condensation, un œdème, un épanchement, un pneumothorax. Si l’image est peu modifiée et l’hypoxémie importante, le médecin recherche une embolie pulmonaire par angio-TDM.</p>
<div class="lab">Examens complémentaires selon l’orientation</div><p>Moniteur de curarisation, échocardiographie et peptides natriurétiques pour un œdème, prélèvements respiratoires et hémocultures pour une infection, ECG et troponine si une cause cardiaque est possible.</p>
<div class="lab">Piège</div><p>Chez l’opéré, la dyspnée d’un infarctus du myocarde périopératoire est souvent sans douleur ; une troponine fait partie du bilan d’une détresse inexpliquée.</p></template>

<template data-pop="j95-trali" data-title="Lésion pulmonaire aiguë post-transfusionnelle et surcharge circulatoire">
<div class="lab">Lésion pulmonaire aiguë post-transfusionnelle</div><p>Œdème pulmonaire lésionnel bilatéral avec hypoxémie, survenant pendant ou dans les six heures d’une transfusion, sans surcharge circulatoire. Le mécanisme principal implique des anticorps du donneur dirigés contre les antigènes leucocytaires du receveur, qui activent les neutrophiles dans les capillaires pulmonaires.</p>
<div class="lab">Surcharge circulatoire post-transfusionnelle</div><p>Œdème hydrostatique par excès de volume chez un patient dont le cœur ou les reins ne compensent pas. La pression artérielle est souvent élevée, les peptides natriurétiques augmentent, et les diurétiques améliorent la situation.</p>
<div class="lab">Distinction pratique</div><p>Une hypotension, une fièvre et une échocardiographie sans surcharge orientent vers la lésion pulmonaire ; une hypertension, un bilan entrant positif et une réponse aux diurétiques orientent vers la surcharge.</p>
<div class="lab">Conséquence</div><p>Toute suspicion se déclare au service d’hémovigilance de l’hôpital, qui transmet à Swissmedic. Le traitement est symptomatique, avec une ventilation protectrice si nécessaire. Aucun sous-code propre n’existe dans J95 en CIM-10-GM 2024.</p></template>

<template data-pop="j95-mendel" data-title="Syndrome de Mendelson">
<div class="lab">Histoire</div><p>Curtis Mendelson a décrit en 1946 des inhalations de contenu gastrique pendant l’anesthésie obstétricale et montré le rôle de l’acidité dans la gravité des lésions.</p>
<div class="lab">Mécanisme</div><p>L’acide gastrique provoque une brûlure chimique immédiate de l’épithélium bronchique et alvéolaire, puis une inflammation neutrophilique dans les quatre à six heures, avec un œdème lésionnel. Les particules alimentaires ajoutent une obstruction et une réaction granulomateuse.</p>
<div class="lab">Clinique</div><p>Toux, bronchospasme, hypoxémie et opacités déclives apparaissent en minutes à quelques heures. Une partie des inhalations reste silencieuse.</p>
<div class="lab">Traitement</div><p>Aspiration des voies aériennes, oxygène, ventilation protectrice si nécessaire. Pas de lavage bronchique au sérum, qui étend la lésion. Pas de corticostéroïde. Pas d’antibiotique d’emblée sauf colonisation gastrique probable (occlusion, traitement antiacide prolongé) ; réévaluation à 48 heures.</p>
<div class="lab">Prévention</div><p>Jeûne, induction à séquence rapide chez le patient à estomac plein, antiacides chez les patientes à risque, antagonisation complète des curares.</p></template>

<template data-pop="j95-trach" data-title="Trachéotomie : complications et algorithme d’urgence">
<div class="lab">Principe</div><p>Les algorithmes britanniques du National Tracheostomy Safety Project (McGrath et collaborateurs, Anaesthesia 2012) organisent la réponse à une canule obstruée ou déplacée. Ils sont repris par de nombreux hôpitaux suisses.</p>
<div class="lab">Séquence</div><p>1. Appeler de l’aide et appliquer de l’oxygène sur le visage et sur la stomie. 2. Retirer la canule interne. 3. Passer une sonde d’aspiration : si elle passe, la canule est perméable. 4. Dégonfler le ballonnet. 5. Si le patient ne respire pas mieux, retirer la canule. 6. Ventiler par la bouche, ou par la stomie avec un masque pédiatrique si la bouche ne communique pas.</p>
<div class="lab">Laryngectomie</div><p>Après une laryngectomie totale, la trachée s’abouche à la peau et ne communique plus avec la bouche. Seule la stomie permet l’oxygénation et l’intubation.</p>
<div class="lab">Hémorragie</div><p>Une fistule entre la trachée et le tronc artériel brachiocéphalique survient surtout de la première à la sixième semaine. Un saignement sentinelle impose une endoscopie. En cas d’hémorragie massive : surgonfler le ballonnet, comprimer l’artère contre le sternum par un doigt introduit dans la stomie, transférer au bloc.</p>
<div class="lab">Fistule trachéo-œsophagienne</div><p>Elle résulte d’une nécrose de la paroi postérieure par le ballonnet, parfois favorisée par une sonde nasogastrique rigide. Elle donne une toux à la déglutition et des aspirations alimentaires par la canule.</p></template>

<template data-pop="j95-ptx" data-title="Pneumothorax iatrogène">
<div class="lab">Causes</div><p>Ponction transthoracique guidée par tomodensitométrie (cause la plus fréquente), cathéter veineux sous-clavier ou jugulaire, thoracocentèse, biopsie transbronchique, acupuncture et ventilation mécanique en pression positive. Le pneumothorax d’une biopsie guidée par tomodensitométrie survient dans 15 à 30 % des procédures selon les séries.</p>
<div class="lab">Conduite chez le patient non ventilé</div><p>Un petit pneumothorax stable chez un patient peu symptomatique se surveille ou s’aspire à l’aiguille. Un pneumothorax volumineux ou symptomatique se draine. Les recommandations britanniques de 2023 (British Thoracic Society) sur la plèvre encadrent ces choix.</p>
<div class="lab">Conduite chez le patient ventilé</div><p>La pression positive entretient la fuite : le pneumothorax augmente et peut devenir compressif. Le drainage s’impose.</p>
<div class="lab">Prévention</div><p>L’échoguidage réduit les pneumothorax lors de la pose de cathéters jugulaires internes et des thoracocentèses.</p>
<div class="lab">Codage</div><p>J95.80. Le pneumothorax spontané relève de J93, le traumatique de S27.0.</p></template>

<template data-pop="j95-fistule" data-title="Fistule bronchopleurale après résection">
<div class="lab">Définition</div><p>Communication entre une bronche, souvent le moignon d’une lobectomie ou d’une pneumonectomie, et la cavité pleurale.</p>
<div class="lab">Facteurs de risque</div><p>Pneumonectomie, surtout droite, car la bronche souche droite est plus courte et moins couverte par le médiastin ; radiochimiothérapie préopératoire ; diabète ; dénutrition ; ventilation mécanique prolongée ; infection pleurale.</p>
<div class="lab">Signes</div><p>Toux productive abondante, fièvre, emphysème sous-cutané, fuite d’air persistante au drain, baisse du niveau liquidien dans la cavité de pneumonectomie en radiographie.</p>
<div class="lab">Conduite</div><p>Coucher le patient sur le côté opéré pour éviter l’inondation du poumon restant, drainer la cavité, antibiotiques, avis chirurgical pour fermeture ou couverture du moignon. La bronchoscopie confirme le diagnostic.</p></template>

<template data-pop="j95-medi" data-title="Médiastinite aiguë">
<div class="lab">Formes</div><p><b>Après sternotomie</b> : infection profonde de la plaie avec atteinte du médiastin antérieur, surtout due aux staphylocoques. <b>Descendante nécrosante</b> : diffusion d’une infection dentaire ou pharyngée le long des espaces cervicaux. <b>Après perforation œsophagienne</b> : spontanée (syndrome de Boerhaave) ou instrumentale.</p>
<div class="lab">Facteurs de risque après sternotomie</div><p>Obésité, diabète mal équilibré, BPCO, pontage avec les deux artères thoraciques internes, reprise chirurgicale, ventilation prolongée.</p>
<div class="lab">Diagnostic</div><p>Fièvre, douleur rétrosternale, instabilité sternale, écoulement ; tomodensitométrie avec collections et bulles d’air ; prélèvements profonds.</p>
<div class="lab">Traitement</div><p>Drainage chirurgical, débridement, parfois thérapie par pression négative, et antibiothérapie large adaptée aux prélèvements. Le pus collecté n’est pas atteint par l’antibiotique seul.</p></template>

<template data-pop="j95-sevrtab" data-title="Arrêt du tabac avant une chirurgie">
<div class="lab">Preuves</div><p>La méta-analyse de Mills et collaborateurs (American Journal of Medicine 2011) a regroupé six essais randomisés : réduction relative de 41 % des complications postopératoires. Chaque semaine d’arrêt supplémentaire augmentait l’effet d’environ 19 %. Les données observationnelles montraient une réduction relative de 19 % des complications pulmonaires chez les anciens fumeurs.</p>
<div class="lab">Mécanismes</div><p>Le monoxyde de carbone disparaît en un à deux jours, ce qui améliore le transport de l’oxygène. La clairance mucociliaire et la fonction des macrophages s’améliorent en quelques semaines. La cicatrisation bénéficie de la disparition de la vasoconstriction nicotinique.</p>
<div class="lab">Un faux problème</div><p>Une ancienne crainte voulait qu’un arrêt dans les semaines précédant l’opération augmente les complications par hypersécrétion. Les méta-analyses n’ont pas confirmé cette crainte : il n’y a pas de délai « trop court » pour arrêter.</p>
<div class="lab">Conséquence pratique</div><p>Toute consultation préopératoire chez un fumeur propose un arrêt aidé par un médicament et un accompagnement, idéalement quatre semaines ou plus avant l’intervention.</p></template>

<template data-pop="j95-jeune" data-title="Jeûne préopératoire">
<div class="lab">Règles habituelles chez l’adulte</div><p>Les recommandations européennes (Société européenne d’anesthésiologie, 2011) et américaines (American Society of Anesthesiologists, 2023) autorisent les liquides clairs jusqu’à deux heures avant l’induction et demandent environ six heures après un repas léger.</p>
<div class="lab">Pourquoi pas plus long</div><p>Un jeûne prolongé n’apporte pas de sécurité supplémentaire. Il provoque soif, inconfort, hypovolémie et résistance à l’insuline. Les liquides clairs quittent l’estomac en une à deux heures.</p>
<div class="lab">Situations particulières</div><p>Les agonistes du récepteur du GLP-1 ralentissent la vidange gastrique et justifient des précautions spécifiques selon les protocoles locaux. L’urgence, la grossesse à terme et l’occlusion imposent de considérer le patient comme ayant l’estomac plein.</p></template>

<template data-pop="j95-ventprot" data-title="Ventilation peropératoire protectrice">
<div class="lab">Principes</div><p>Volume courant de 6 à 8 mL/kg de poids idéal, calculé selon la taille et le sexe, et non selon le poids réel. PEP individualisée, habituellement modérée. Fraction d’oxygène la plus basse qui maintient une saturation adéquate, en dehors de l’induction et du réveil.</p>
<div class="lab">Preuves</div><p>Un volume courant faible réduit les complications par rapport aux volumes élevés de 10 à 12 mL/kg. L’essai PROVHILO (Lancet 2014) n’a pas montré de bénéfice d’une PEP de 12 cm H₂O avec recrutements par rapport à une PEP d’au plus 2 cm H₂O, avec plus d’hypotensions dans le groupe à PEP élevée.</p>
<div class="lab">Conséquence pratique</div><p>Le petit volume courant est la règle. La PEP et les recrutements s’ajustent au patient, par exemple chez l’obèse ou en laparoscopie, plutôt que d’appliquer une valeur élevée à tous.</p></template>

<template data-pop="j95-spiroinc" data-title="Spirométrie incitative et kinésithérapie : sources discordantes">
<div class="lab">Pratique</div><p>Le patient inspire lentement et profondément dans un dispositif qui visualise le volume ou le débit atteint, plusieurs fois par heure.</p>
<div class="lab">Divergence des sources</div><p>La recommandation de l’American College of Physicians (2006) recommandait les manœuvres d’expansion pulmonaire, dont la spirométrie incitative, chez les patients à risque. Les revues systématiques plus récentes, notamment Cochrane sur la chirurgie abdominale haute (2014), ne trouvent pas de preuve d’un bénéfice de la spirométrie incitative seule sur les complications pulmonaires.</p>
<div class="lab">Arbitrage</div><p>La source la plus récente, de niveau méthodologique supérieur, l’emporte : la spirométrie incitative seule n’est pas une mesure de prévention démontrée. Elle peut accompagner une kinésithérapie et un lever précoce, qui restent recommandés dans les programmes de récupération améliorée.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin ne remplace pas la mobilisation par un dispositif posé sur la table de nuit.</p></template>

<template data-pop="j95-cpap" data-title="Pression positive continue et ventilation non invasive postopératoires">
<div class="lab">Mécanisme</div><p>La pression positive augmente la capacité résiduelle fonctionnelle, rouvre les alvéoles atélectasiées et diminue le travail respiratoire. La ventilation non invasive ajoute une aide inspiratoire, utile en cas d’hypercapnie.</p>
<div class="lab">Traitement de l’hypoxémie</div><p>Chez l’opéré abdominal hypoxémique, la pression positive continue réduit le recours à l’intubation par rapport à l’oxygène seul (Squadrone et collaborateurs, JAMA 2005). Après chirurgie cardiothoracique, l’oxygénothérapie nasale à haut débit a été non inférieure à la ventilation non invasive dans l’essai BiPOP (JAMA 2015).</p>
<div class="lab">Prévention systématique</div><p>L’essai PRISM (Lancet Respiratory Medicine 2021) n’a montré aucun bénéfice d’une pression positive continue appliquée à tous après une chirurgie abdominale majeure ouverte.</p>
<div class="lab">Précautions</div><p>Après une anastomose œsophagienne ou gastrique haute, la pression positive se discute avec le chirurgien, par crainte d’une distension de l’anastomose ; les données disponibles ne montrent pas d’excès de fuites, mais elles sont limitées.</p></template>
