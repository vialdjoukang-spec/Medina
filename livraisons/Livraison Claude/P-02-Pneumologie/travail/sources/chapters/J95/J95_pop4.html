
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j95-clin" data-title="Pareto — Définitions, mécanismes, risque et clinique">
<p class="ratio" data-cover="j95-0,j95-1,j95-2,j95-3,j95-4,j95-5,j95-6"></p>
<ul>
<li>J95 : conséquence d’un acte médical ; J98 : trouble respiratoire non classé ailleurs ; J99 : manifestation astérisque d’une maladie générale codée en premier.</li>
<li>La pneumonie sous ventilation mécanique n’a pas de code J95 en CIM-10-GM : elle se code selon le germe, avec un code de relation à l’admission.</li>
<li>Complication pulmonaire postopératoire : insuffisance respiratoire (saturation inférieure à 90 % sous oxygène, PaO₂ inférieure à 8 kPa), infection, atélectasie, bronchospasme, inhalation, épanchement, pneumothorax.</li>
<li>Fréquence de 5 à 11 % ; mortalité à 30 jours de 19,5 % contre 0,5 % dans ARISCAT.</li>
<li>Chaîne : décubitus et induction abaissent la capacité résiduelle sous le volume de fermeture, atélectasie chez environ 90 % des anesthésiés, shunt peu sensible à l’oxygène, inhibition réflexe du diaphragme (capacité vitale −50 à 60 % au premier jour), opioïdes et curare résiduel.</li>
<li>ARISCAT : âge, saturation, infection récente, anémie, incision haute ou thoracique, durée, urgence ; moins de 26 faible, 26 à 44 intermédiaire, 45 ou plus élevé.</li>
<li>Pas de spirométrie ni de radiographie systématiques avant une chirurgie non thoracique.</li>
<li>Le délai entre l’acte et les symptômes oriente la cause ; l’oxymètre ne détecte pas l’hypercapnie.</li>
</ul></template>

<template data-pop="pareto-j95-diag" data-title="Pareto — Démarche, urgences et traitement">
<p class="ratio" data-cover="j95-7,j95-8,j95-9"></p>
<ul>
<li>Ordre : sécurité (voies aériennes, pneumothorax sous tension, choc), mécanisme par la gazométrie, cause par l’imagerie.</li>
<li>Poumons clairs avec hypoxémie : penser à l’embolie pulmonaire.</li>
<li>Canule bouchée : oxygène sur le visage et la stomie, retrait de la canule interne, sonde d’aspiration, ballonnet dégonflé, retrait de la canule ; laryngectomisé : stomie seule.</li>
<li>Saignement sentinelle de trachéotomie : endoscopie urgente ; hémorragie massive : surgonfler le ballonnet et comprimer par la stomie.</li>
<li>Pneumothorax chez un patient ventilé : drainage.</li>
<li>Fistule bronchopleurale : coucher sur le côté opéré, drainer, chirurgien.</li>
<li>Mendelson : aspiration, oxygène ; ni corticostéroïde ni antibiotique systématique ; réévaluation à 48 heures.</li>
<li>Prévention démontrée : arrêt du tabac idéalement quatre semaines ou plus (−41 % de complications), petit volume courant, antagonisation guidée par moniteur jusqu’à un rapport supérieur à 0,9, analgésie qui permet la toux, lever précoce.</li>
<li>PEP élevée systématique : pas de bénéfice (PROVHILO) ; pression positive continue préventive pour tous : pas de bénéfice (PRISM) ; en traitement de l’hypoxémie : utile.</li>
</ul></template>

<template data-pop="pareto-j95-j98" data-title="Pareto — Sténoses, J98 et J99">
<p class="ratio" data-cover="j95-10,j95-11,j95-12"></p>
<ul>
<li>Sténose post-intubation : ischémie par ballonnet supérieur à 30 cm H₂O ou sonde trop grosse ; symptômes deux à six semaines après l’extubation ; stridor pris pour un asthme ; courbe débit-volume en plateau, endoscopie ; dilatation ou résection-anastomose.</li>
<li>Sténose sous-glottique sans intubation : penser granulomatose avec polyangéite.</li>
<li>Atélectasie obstructive du fumeur : fibroscopie ; lobe moyen : bronche longue et étroite ; atélectasie ronde : amiante, simule un cancer.</li>
<li>Pneumomédiastin spontané : effet Macklin, bénin, exclure une perforation œsophagienne si vomissements ou fièvre.</li>
<li>Emphysème compensateur : distension sans destruction.</li>
<li>Kystes acquis : lymphangioléiomyomatose, syndrome de Birt, Hogg et Dubé, Sjögren.</li>
<li>Paralysie diaphragmatique bilatérale : orthopnée, respiration abdominale paradoxale ; causes iatrogènes : chirurgie cardiaque, bloc interscalénique.</li>
<li>J99 : polyarthrite rhumatoïde, souvent pneumopathie de type commun ; autres connectivites, souvent non spécifique ; maladie du greffon chronique : bronchiolite oblitérante, codée J99.21 à J99.23 selon le VEMS.</li>
</ul></template>

<template data-pop="pareto-j95-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j95-13,j95-14,j95-15"></p>
<ul>
<li>Radiographie de contrôle à six à huit semaines chez le fumeur de plus de 50 ans.</li>
<li>Dyspnée dans les trois mois suivant une intubation : chercher une sténose.</li>
<li>Obésité et apnées : appareil de pression positive dès le réveil, analgésie sans opioïde, oxymétrie continue.</li>
<li>Inhalation obstétricale : codes O, pas J95.4.</li>
<li>Sugammadex non recommandé si clairance inférieure à 30 mL/min.</li>
<li>Bronchiolite oblitérante NIH 2014 : VEMS/capacité vitale inférieur à 0,7, VEMS inférieur à 75 % avec déclin d’au moins 10 % en moins de deux ans, pas d’infection, piégeage d’air.</li>
</ul></template>

<template data-pop="pareto-j95-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j95-e-1,j95-e-2,j95-e-3,j95-e-4,j95-e-5,j95-e-6"></p>
<ul>
<li>Résection pulmonaire : spirométrie, DLCO, valeurs prédites (19 segments) ; 60 % ou plus normal, 40 à 59 % modéré, moins de 40 % élevé ; test de terrain ; épreuve d’effort si nécessaire (VO₂ maximal inférieur à 12 mL/kg/min : risque élevé).</li>
<li>Gazométrie : hypoventilation avec gradient normal ; shunt peu sensible à l’oxygène.</li>
<li>Atélectasie : scissure déplacée, coupole ascensionnée, médiastin attiré.</li>
<li>Échographie : glissement aboli (pneumothorax), lignes B (œdème), aspect tissulaire (condensation), fraction d’épaississement diaphragmatique inférieure à 20 % (paralysie).</li>
<li>Sténose fixe : double plateau ; indice d’Empey supérieur à 10.</li>
<li>Diaphragme : reniflement paradoxal, chute de la capacité vitale en décubitus.</li>
</ul></template>

<template data-pop="pareto-j95-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j95-p-1,j95-p-2,j95-p-3,j95-p-4,j95-p-5,j95-p-6"></p>
<ul>
<li>Varénicline : 0,5 mg puis 1 mg deux fois par jour, début une à deux semaines avant l’arrêt ; timbre de 25 mg/16 heures si plus de 15 cigarettes par jour.</li>
<li>Sugammadex : 2 mg/kg (deuxième réponse), 4 mg/kg (1 à 2 réponses post-tétaniques), 16 mg/kg (antagonisation immédiate) ; contraception orale compromise ; bradycardie et anaphylaxie rares.</li>
<li>Néostigmine et glycopyrronium : seulement si rapport du train de quatre supérieur à 0,2 ; surveillance jusqu’à plus de 0,9.</li>
<li>Mendelson : ni corticostéroïde ni antibiotique systématique ; médiastinite : drainage et antibiothérapie large.</li>
<li>Bronchiolite oblitérante : fluticasone, azithromycine, montélukast hors indication ; ruxolitinib autorisé en Suisse seulement pour la forme aiguë ; pas d’azithromycine prophylactique pour tous les allogreffés.</li>
</ul></template>
