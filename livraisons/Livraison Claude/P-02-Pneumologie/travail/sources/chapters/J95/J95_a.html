<section class="ilot" id="j95-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 72 ans doit subir une gastrectomie totale par laparotomie pour un adénocarcinome gastrique. Il fume encore 15 cigarettes par jour, soit 45 paquets-années, et porte une BPCO avec un VEMS à 62 % de la valeur prédite. Sa saturation pulsée en oxygène est de 94 % à l’air ambiant et son hémoglobine de 112 g/L. L’intervention prévue dure environ quatre heures. Le chirurgien demande au médecin assistant si le patient « peut être opéré » et ce qu’il faut faire pour ses poumons.</p>
<p>Deux jours après l’opération, le patient devient tachypnéique à 28 par minute. Sa saturation tombe à 88 % sous 2 L/min d’oxygène, et l’auscultation retrouve une diminution du murmure vésiculaire à la base gauche. La question qui structure le cours est la suivante : <b>comment prévoir, prévenir, reconnaître et traiter une complication respiratoire provoquée par un acte médical, et comment reconnaître les autres troubles respiratoires que la CIM range dans J98 et J99 ?</b></p>
<p>À la fin du cours, le médecin assistant sait estimer le risque pulmonaire avant une chirurgie avec le <button class="w" data-k="j95-ariscat">score ARISCAT (sept facteurs, trois classes de risque)</button>. Il connaît les mesures qui réduisent réellement les complications et distingue une atélectasie, une pneumonie, une inhalation, un œdème ou une embolie devant une hypoxémie postopératoire. Il traite les urgences d’une trachéotomie et reconnaît une sténose trachéale tardive. Il identifie enfin une paralysie diaphragmatique, un pneumomédiastin ou une bronchiolite oblitérante après allogreffe.</p>
<div class="key"><b>Message fondateur.</b> Une complication pulmonaire postopératoire n’est pas un accident imprévisible. Elle résulte de la rencontre d’un terrain (âge, hypoxémie, tabac, anémie, infection récente) et d’une agression (incision proche du diaphragme, anesthésie générale longue, urgence). Le risque se calcule avant l’intervention, et plusieurs mesures simples le réduisent : arrêt du tabac, ventilation peropératoire protectrice, antagonisation complète des curares, analgésie qui permet de tousser et lever précoce.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="j95-crf">capacité résiduelle fonctionnelle et le volume de fermeture (pourquoi les bases se ferment)</button>, la notion de shunt intrapulmonaire et l’insuffisance respiratoire aiguë (cours J96). Le syndrome de détresse respiratoire aiguë est traité dans le cours J80, et les pneumonies dans le cours J18.</div>
</section>

<section class="ilot" id="j95-1"><h2><span class="n">1</span>Définitions, périmètre CIM et classifications</h2>
<p>La CIM-10-GM 2024 rassemble sous le bloc J95–J99 des troubles hétérogènes. Ils ont un point commun : ils ne trouvent pas leur place dans une catégorie respiratoire spécifique. J95 code ce qu’un acte médical a provoqué. J98 code des atteintes des bronches, du poumon, du médiastin et du diaphragme qui ne relèvent pas d’une autre catégorie. J99 est une catégorie « astérisque » : elle code la manifestation respiratoire d’une maladie générale, dont le code principal porte une « dague ».</p>
<h3>1.1 J95 — Troubles respiratoires après des actes médicaux</h3>
<p>Le tableau suivant répond à une question pratique : sous quel code se range une complication respiratoire iatrogène, et où se trouve son traitement dans ce cours ? Les intitulés reprennent la version allemande officielle (BfArM, CIM-10-GM 2024).</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Traité dans</th></tr>
<tr><td>J95.0</td><td>Fonctionnement défectueux d’un trachéostome : hémorragie, obstruction, infection, fistule trachéo-œsophagienne</td><td>§8.2</td></tr>
<tr><td>J95.1</td><td>Insuffisance pulmonaire aiguë après chirurgie thoracique</td><td>§3, §7, §9</td></tr>
<tr><td>J95.2</td><td>Insuffisance pulmonaire aiguë après chirurgie non thoracique</td><td>§3, §7, §9</td></tr>
<tr><td>J95.3</td><td>Insuffisance pulmonaire chronique après chirurgie</td><td>§13</td></tr>
<tr><td>J95.4</td><td>Syndrome de Mendelson : pneumopathie chimique d’inhalation liée à l’anesthésie</td><td>§8.1</td></tr>
<tr><td>J95.5</td><td>Sténose sous-glottique après des actes médicaux</td><td>§10</td></tr>
<tr><td>J95.80</td><td>Pneumothorax iatrogène</td><td>§8.3</td></tr>
<tr><td>J95.81</td><td>Sténose trachéale après des actes médicaux</td><td>§10</td></tr>
<tr><td>J95.82</td><td>Insuffisance d’anastomose ou de suture après chirurgie de la trachée, des bronches ou du poumon</td><td>§8.4</td></tr>
<tr><td>J95.88</td><td>Autres troubles respiratoires après des actes médicaux</td><td>§7, §9</td></tr>
<tr><td>J95.9</td><td>Trouble respiratoire après un acte médical, sans précision</td><td>—</td></tr></table>
<p>Ce tableau se lit avec ses exclusions, car elles évitent les erreurs de codage les plus fréquentes. La pneumopathie radique relève de J70.0 et J70.1, et l’emphysème sous-cutané après un geste relève de T81.8. La sténose trachéale acquise sans lien avec un acte médical relève de J39.80. Le <button class="w" data-k="j95-pavm">pneumonie acquise sous ventilation mécanique (codage en CIM-10-GM)</button> ne possède <b>aucun</b> code propre dans J95 en version allemande, contrairement à la version américaine. Elle se code comme une pneumonie selon son germe (J13 à J18), avec un code supplémentaire de relation temporelle avec l’admission. L’inhalation obstétricale relève des codes O29.0, O74.0 ou O89.0, et non de J95.4.</p>
<h3>1.2 Complications pulmonaires postopératoires : une définition consensuelle</h3>
<p>Les <button class="w" data-k="j95-cpp">complications pulmonaires postopératoires (définitions européennes de 2015)</button> forment un ensemble défini par le groupe European Perioperative Clinical Outcome. L’étude ARISCAT a retenu sept événements : infection respiratoire, insuffisance respiratoire, bronchospasme, atélectasie, épanchement pleural, pneumothorax et pneumopathie d’inhalation. Cette définition composite permet de comparer les études. Elle rassemble cependant des événements de gravité très différente : une atélectasie radiologique sans symptôme n’a pas le poids d’une réintubation.</p>
<table class="t"><tr><th>Événement</th><th>Définition opérationnelle résumée</th></tr>
<tr><td>Insuffisance respiratoire</td><td>PaO₂ inférieure à 8 kPa (60 mmHg) à l’air ambiant, ou rapport PaO₂/FiO₂ inférieur à 300 mmHg, ou saturation inférieure à 90 % nécessitant de l’oxygène</td></tr>
<tr><td>Infection respiratoire</td><td>Antibiothérapie pour suspicion d’infection avec au moins un critère : expectoration nouvelle ou modifiée, opacité nouvelle, fièvre, leucocytes supérieurs à 12 G/L</td></tr>
<tr><td>Atélectasie</td><td>Opacité pulmonaire avec déplacement du médiastin, du hile ou de l’hémicoupole vers la zone atteinte et hyperinflation compensatrice adjacente</td></tr>
<tr><td>Bronchospasme</td><td>Sibilants expiratoires nouveaux traités par bronchodilatateur</td></tr>
<tr><td>Pneumopathie d’inhalation</td><td>Lésion pulmonaire aiguë après inhalation documentée de contenu gastrique régurgité</td></tr>
<tr><td>Épanchement pleural, pneumothorax</td><td>Visibles en imagerie</td></tr></table>
<p>La lecture clinique commence par la colonne de droite : une saturation inférieure à 90 % qui exige de l’oxygène suffit à définir l’insuffisance respiratoire. Le patient du cas, à 88 % sous 2 L/min, présente donc déjà une complication pulmonaire postopératoire. Il reste à en trouver la cause, ce que le §7 organise.</p>
<h3>1.3 J98 et J99 en une phrase chacun</h3>
<p>J98 regroupe les affections bronchiques non classées ailleurs (broncholithiase, sténose, dyskinésie trachéobronchique), le collapsus pulmonaire (J98.10 à J98.18), l’emphysème interstitiel et médiastinal (J98.2), l’emphysème compensateur (J98.3), les autres atteintes du poumon dont les maladies kystiques acquises (J98.4), les maladies du médiastin dont la médiastinite (J98.50, J98.58), les maladies du diaphragme (J98.6) et les codes résiduels J98.7 à J98.9. J99 code les atteintes respiratoires de la polyarthrite rhumatoïde séropositive (J99.0), des autres connectivites (J99.1), de la maladie du greffon contre l’hôte chronique (J99.21 à J99.23) et d’autres maladies (J99.8). Leur détail occupe les §11 et §12.</p>
<div class="key"><b>À retenir.</b> J95 code une conséquence d’acte médical, J98 un trouble respiratoire non classé ailleurs, J99 une manifestation respiratoire d’une maladie générale codée en premier. La pneumonie sous ventilation mécanique n’a pas de code J95 en version allemande. Le §2 donne la fréquence de ces complications et leur poids sur la survie.</div>
</section>

<section class="ilot" id="j95-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les complications pulmonaires postopératoires sont aussi fréquentes que les complications cardiaques après une chirurgie non cardiaque, et elles pèsent davantage sur la durée d’hospitalisation. Dans la cohorte catalane ARISCAT (Canet et collaborateurs, Anesthesiology 2010), 123 des 2464 patients opérés, soit 5 %, ont présenté au moins une complication pulmonaire. La mortalité à 30 jours atteignait 19,5 % chez ces patients, contre 0,5 % chez les autres. Dans l’étude internationale LAS VEGAS, menée dans 146 hôpitaux de 29 pays, 10,9 % des 6063 patients analysés ont présenté au moins une complication pulmonaire (European Journal of Anaesthesiology 2018).</p>
<p>Ces chiffres ne prouvent pas que la complication pulmonaire tue à elle seule. Un patient âgé, anémique, opéré en urgence d’une péritonite cumule des risques de décès indépendants du poumon. L’association reste toutefois forte et cohérente entre les études, et une insuffisance respiratoire postopératoire qui conduit à une réintubation augmente directement le risque de pneumonie sous ventilation, de défaillance d’organe et de décès. Aucune donnée nationale suisse spécifique de ces complications n’est publiée sous une forme exploitable ; les chiffres européens servent de référence.</p>
<h3>2.1 Fréquence des autres affections du bloc</h3>
<p>Le pneumothorax iatrogène suit surtout la ponction transthoracique guidée par tomodensitométrie : il complique 15 à 30 % de ces biopsies, et une minorité d’entre eux exige un drainage (§8.3). La sténose trachéale après intubation ou trachéotomie est rare mais grave ; sa fréquence varie beaucoup selon la durée d’intubation et le contrôle de la pression du ballonnet. Le syndrome de bronchiolite oblitérante touche environ 5 % des allogreffés de cellules souches hématopoïétiques et jusqu’à 14 % de ceux qui présentent une maladie du greffon contre l’hôte chronique, selon une large série américaine (Au et collaborateurs, Biology of Blood and Marrow Transplantation 2011). La médiastinite après sternotomie complique de 0,25 à 5 % des interventions selon les séries.</p>
<div class="key"><b>À retenir.</b> Environ un opéré sur dix à un sur vingt présente une complication pulmonaire, et sa mortalité à 30 jours est près de quarante fois plus élevée dans ARISCAT. Le §3 explique pourquoi le poumon opéré devient fragile.</div>
</section>

<section class="ilot" id="j95-3"><h2><span class="n">3</span>Physiopathologie du poumon opéré</h2>
<p>La physiopathologie suit une chaîne en cinq maillons. Chaque maillon explique un signe clinique et désigne une mesure de prévention.</p>
<h3>3.1 État normal</h3>
<p>Chez l’adulte debout, la <button class="w" data-k="j95-crf">capacité résiduelle fonctionnelle (volume restant en fin d’expiration calme)</button> mesure environ 3 L. Elle reste supérieure au volume de fermeture, volume en dessous duquel les petites voies aériennes des bases se ferment. Les alvéoles restent donc ouvertes pendant toute la respiration calme. Le diaphragme assure environ deux tiers de la ventilation de repos. Les soupirs spontanés, plusieurs fois par heure, rouvrent les zones peu ventilées, et la toux évacue le mucus.</p>
<h3>3.2 Premier maillon : la perte de volume pulmonaire</h3>
<p>Le décubitus réduit la capacité résiduelle fonctionnelle d’environ 0,5 à 1 L, car le contenu abdominal repousse le diaphragme vers le thorax. L’induction anesthésique la réduit encore d’environ 20 %, car le tonus du diaphragme et des muscles thoraciques disparaît. Chez le sujet âgé, le volume de fermeture augmente avec l’âge et dépasse alors la capacité résiduelle fonctionnelle. Les voies aériennes des bases se ferment pendant chaque expiration, et le sang qui traverse ces territoires ne s’oxygène plus.</p>
<h3>3.3 Deuxième maillon : l’atélectasie peropératoire</h3>
<p>Une <button class="w" data-k="j95-atel">atélectasie (mécanismes de compression, de résorption et d’adhésion)</button> apparaît dans les minutes qui suivent l’induction chez environ 90 % des patients sous anesthésie générale. Elle occupe typiquement 15 à 20 % du parenchyme des zones déclives (Hedenstierna et Edmark, 2010). Une fraction inspirée d’oxygène de 100 % l’aggrave par résorption : l’azote, peu soluble, ne maintient plus les alvéoles ouvertes, et l’oxygène qui les remplit passe en totalité dans le sang. Le résultat est un <b>shunt</b> : du sang veineux traverse des alvéoles non ventilées et rejoint la circulation artérielle sans s’oxygéner. L’oxygène supplémentaire corrige mal une hypoxémie par shunt, ce qui distingue l’atélectasie d’une simple hypoventilation.</p>
<h3>3.4 Troisième maillon : la dysfonction diaphragmatique postopératoire</h3>
<p>Après une chirurgie abdominale haute, la <button class="w" data-k="j95-diaph">dysfonction diaphragmatique postopératoire (inhibition réflexe du nerf phrénique)</button> réduit la capacité vitale de 50 à 60 % le premier jour. La capacité résiduelle fonctionnelle atteint son minimum entre 24 et 48 heures, puis se normalise en une à deux semaines. Le mécanisme principal n’est pas la douleur seule : des afférences viscérales et péritonéales inhibent par voie réflexe la commande phrénique. C’est pourquoi une analgésie parfaite ne normalise pas complètement la fonction. Les incisions sus-mésocoliques et thoraciques donnent les atteintes les plus fortes, les incisions sous-ombilicales et périphériques les plus faibles.</p>
<h3>3.5 Quatrième maillon : la perte des défenses</h3>
<p>Plusieurs facteurs s’additionnent. Les opioïdes diminuent la fréquence respiratoire, suppriment les soupirs et émoussent la toux. La <button class="w" data-k="j95-curare">curarisation résiduelle (rapport du train de quatre inférieur à 0,9)</button> affaiblit les muscles du pharynx : le patient protège mal ses voies aériennes et inhale. La sonde d’intubation, l’air sec et le tabac ralentissent l’escalator mucociliaire. Le mucus stagne dans des bronches fermées, se surinfecte, et l’atélectasie devient une pneumonie.</p>
<h3>3.6 Cinquième maillon : les manifestations</h3>
<p>Le shunt produit une hypoxémie. La baisse de compliance augmente le travail respiratoire et provoque une tachypnée à petit volume courant. Si la réserve musculaire s’épuise ou si les opioïdes dépriment la commande, la PaCO₂ monte. Le patient du cas illustre ce stade : laparotomie sus-mésocolique, tabac, BPCO et quatre heures d’anesthésie ont produit une atélectasie basale gauche au deuxième jour.</p>

<div class="key"><b>Corrélation physiopathologie → prévention.</b> Chaque maillon possède sa parade. L’arrêt du tabac restaure la clairance mucociliaire. La ventilation peropératoire protectrice limite l’atélectasie et la surdistension. L’antagonisation guidée par un moniteur quantitatif supprime la curarisation résiduelle. L’analgésie locorégionale permet la toux, et le lever précoce restaure la capacité résiduelle fonctionnelle. Le §9 détaille ces mesures et leurs preuves.</div>
</section>

<section class="ilot" id="j95-4"><h2><span class="n">4</span>Facteurs de risque et évaluation préopératoire</h2>
<p>Le risque pulmonaire dépend de deux familles de facteurs : ceux du patient et ceux de l’intervention. Les facteurs liés à l’intervention pèsent souvent plus lourd, ce qui surprend : un sujet de 40 ans opéré d’une œsophagectomie a un risque plus élevé qu’un patient de 75 ans opéré d’une hernie inguinale.</p>
<h3>4.1 Le score ARISCAT</h3>
<p>Le score ARISCAT est l’outil préopératoire le mieux validé en chirurgie générale. Il additionne les points de sept facteurs indépendants, tous disponibles avant l’intervention. Le tableau sert à calculer le score au lit du patient ; ses classes de risque se lisent sous le tableau.</p>
<table class="t"><tr><th>Facteur</th><th>Modalité</th><th>Points</th></tr>
<tr><td rowspan="3">Âge</td><td>50 ans ou moins</td><td>0</td></tr><tr><td>51 à 80 ans</td><td>3</td></tr><tr><td>Plus de 80 ans</td><td>16</td></tr>
<tr><td rowspan="3">Saturation pulsée préopératoire à l’air</td><td>96 % ou plus</td><td>0</td></tr><tr><td>91 à 95 %</td><td>8</td></tr><tr><td>90 % ou moins</td><td>24</td></tr>
<tr><td>Infection respiratoire dans le mois précédent</td><td>Oui</td><td>17</td></tr>
<tr><td>Anémie préopératoire</td><td>Hémoglobine ≤ 100 g/L</td><td>11</td></tr>
<tr><td rowspan="2">Incision</td><td>Abdominale haute</td><td>15</td></tr><tr><td>Intrathoracique</td><td>24</td></tr>
<tr><td rowspan="2">Durée de l’intervention</td><td>2 à 3 heures</td><td>16</td></tr><tr><td>Plus de 3 heures</td><td>23</td></tr>
<tr><td>Intervention en urgence</td><td>Oui</td><td>8</td></tr></table>
<p>Un total inférieur à 26 classe le risque comme faible, de 26 à 44 comme intermédiaire, et 45 ou plus comme élevé. Dans l’échantillon de développement, les taux de complications observés étaient d’environ 1,6 %, 13,3 % et 42,1 % pour ces trois classes. Le patient du cas totalise 3 (âge) + 8 (saturation 94 %) + 15 (incision haute) + 23 (durée de quatre heures) = 49 points : son risque est élevé. Son hémoglobine de 112 g/L ne donne aucun point. La BPCO et le tabac n’apparaissent pas dans le score, non parce qu’ils sont sans effet, mais parce qu’ils n’ajoutaient pas d’information indépendante dans cette cohorte. Le score est mal calibré en chirurgie cardiaque et en résection pulmonaire, où d’autres outils prennent le relais.</p>
<h3>4.2 Les autres facteurs à connaître</h3>
<p>La recommandation de l’<button class="w" data-k="j95-acp">American College of Physicians (facteurs de risque de 2006)</button> ajoute des facteurs liés au patient : BPCO, classe de l’American Society of Anesthesiologists égale ou supérieure à II, insuffisance cardiaque, dépendance fonctionnelle, albumine inférieure à 35 g/L et syndrome d’apnées obstructives du sommeil. Elle ajoute des facteurs liés à l’intervention : chirurgie aortique, thoracique, abdominale haute, neurochirurgie, chirurgie de la tête et du cou, chirurgie vasculaire, anesthésie générale et durée supérieure à trois heures. Un asthme bien contrôlé n’augmente pas le risque ; un asthme non contrôlé l’augmente par bronchospasme. L’obésité seule augmente surtout l’hypoxémie précoce, et moins les complications graves.</p>
<p>Le tabagisme actif augmente le risque de complications pulmonaires, et chaque semaine d’arrêt avant l’intervention renforce l’effet protecteur (§9.1). Le <button class="w" data-k="j95-saos">syndrome d’apnées obstructives du sommeil (dépistage périopératoire)</button> expose à l’obstruction des voies aériennes supérieures sous opioïdes et sédatifs, surtout la première nuit.</p>
<h3>4.3 Le cas particulier de la résection pulmonaire</h3>
<p>Avant une lobectomie ou une pneumonectomie, la question n’est plus seulement le risque de complication, mais la fonction qui restera après l’ablation. Les recommandations ERS/ESTS 2025 sur l’aptitude au traitement à visée curative du cancer bronchique demandent une spirométrie et une mesure de la diffusion du monoxyde de carbone chez tous les candidats. Elles font ensuite calculer le VEMS et la DLCO postopératoires prédits. La démarche est détaillée dans la <button class="w" data-k="j95-preop-tho">fiche de l’évaluation avant résection pulmonaire</button> et dans l’onglet Examens.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Demander une spirométrie et une radiographie thoracique « de routine » avant toute chirurgie non thoracique. L’American College of Physicians et la Société européenne d’anesthésiologie et de soins intensifs ne les recommandent pas en systématique. La spirométrie ne prédit pas mieux le risque que l’anamnèse et l’examen, et ne doit pas servir seule à refuser une opération. Elle garde sa place devant une dyspnée inexpliquée ou une BPCO dont le contrôle doit être optimisé.</div>
<div class="key"><b>À retenir.</b> Le score ARISCAT se calcule en une minute et classe le risque en trois niveaux. L’incision, la durée et l’urgence pèsent autant que le terrain. Avant une résection pulmonaire, la fonction résiduelle prédite remplace ce score. L’anamnèse du §5 fournit la plupart des données nécessaires.</div>
</section>

<section class="ilot" id="j95-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit deux buts selon le moment. Avant l’intervention, elle recherche les facteurs de risque modifiables. Après l’intervention ou un geste, elle reconstitue la chronologie entre l’acte et les symptômes, car cette chronologie oriente vers la cause.</p>
<h3>5.1 Avant une intervention</h3>
<div class="two">
<div class="card"><h4>Antécédents respiratoires</h4><p>Le médecin recherche une BPCO, un asthme et leur contrôle actuel, une infection respiratoire dans le mois précédent et les exacerbations récentes. Il note les antécédents d’intubation difficile, de trachéotomie ou de séjour prolongé en soins intensifs, qui exposent à une sténose trachéale méconnue. Il demande les ronflements, les apnées observées et la somnolence diurne, qui évoquent un <button class="w" data-k="j95-saos">syndrome d’apnées obstructives du sommeil</button>.</p></div>
<div class="card"><h4>Habitudes, autonomie et traitements</h4><p>Le médecin quantifie le tabac en paquets-années et la date de la dernière cigarette. Il évalue la tolérance à l’effort : un patient qui monte deux étages sans s’arrêter a une réserve cardiorespiratoire rassurante. Il recherche une dépendance fonctionnelle, une perte de poids et une dysphagie. Il relève les traitements inhalés, les corticostéroïdes oraux récents, les anticoagulants et les sédatifs.</p></div></div>
<h3>5.2 Après une intervention ou un geste</h3>
<p>La chronologie est le premier outil diagnostique. Le tableau associe le délai d’apparition des symptômes aux causes les plus probables.</p>
<table class="t"><tr><th>Délai après l’acte</th><th>Causes à évoquer d’abord</th></tr>
<tr><td>Minutes à quelques heures</td><td>Curarisation résiduelle, dépression par les opioïdes, obstruction des voies aériennes supérieures, bronchospasme, inhalation, pneumothorax après ponction ou cathéter central, œdème pulmonaire par surcharge</td></tr>
<tr><td>Jours 1 à 3</td><td>Atélectasie, inhalation tardive, œdème pulmonaire, décompensation d’une BPCO</td></tr>
<tr><td>Jours 3 à 7</td><td>Pneumonie nosocomiale, embolie pulmonaire, fuite anastomotique, épanchement pleural</td></tr>
<tr><td>Après la sortie, plusieurs semaines</td><td>Sténose trachéale ou sous-glottique après intubation, médiastinite tardive, embolie pulmonaire</td></tr></table>
<p>Ce tableau se lit en partant du délai, puis en vérifiant la cohérence avec l’acte. Une dyspnée au deuxième jour après une laparotomie évoque d’abord une atélectasie. Le même symptôme six semaines après une intubation de dix jours, avec un stridor, évoque une sténose trachéale et non un asthme tardif.</p>
<h3>5.3 Symptômes et leur signification</h3>
<p><b>Dyspnée et tachypnée</b> — Elles sont les signes les plus précoces d’une perte de volume ou d’un shunt. Une fréquence respiratoire supérieure à 25 par minute chez un opéré doit faire chercher une cause, même si la saturation reste correcte sous oxygène.</p>
<p><b>Toux et expectoration</b> — Une expectoration purulente nouvelle oriente vers une infection. Une toux inefficace signale une analgésie insuffisante ou une faiblesse musculaire, qui favorisent l’encombrement.</p>
<p><b>Douleur thoracique</b> — Une douleur pleurale brutale après une ponction ou la pose d’un cathéter central évoque un pneumothorax iatrogène. Une douleur rétrosternale avec fièvre après une sternotomie évoque une médiastinite.</p>
<p><b>Stridor et dyspnée inspiratoire</b> — Un bruit inspiratoire aigu signale une obstruction des voies aériennes supérieures : œdème laryngé après extubation, paralysie récurrentielle ou sténose tardive.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme âgé, fumeur, opéré par laparotomie sus-ombilicale. Au deuxième jour, il présente une tachypnée, une saturation à 88 % sous oxygène, une fébricule et une diminution du murmure à une base.</p></div>
<div class="card"><h4>Formes atypiques</h4><p>Le sujet âgé peut présenter une confusion postopératoire isolée, qui cache une hypoxémie ou une hypercapnie. Un patient sous analgésie péridurale peut avoir une pneumonie sans douleur ni toux marquée. Une sténose trachéale peut se présenter comme un « asthme » résistant aux bronchodilatateurs.</p></div></div>
<div class="key"><b>À retenir.</b> Avant l’intervention, l’anamnèse fournit presque tout le score ARISCAT et repère le tabac, l’apnée du sommeil et la sténose méconnue. Après l’intervention, le délai entre l’acte et les symptômes oriente la recherche de la cause. L’examen du §6 la précise.</div>
</section>

<section class="ilot" id="j95-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen d’un opéré suit le même ordre que tout examen respiratoire : état général, signes vitaux, puis examen ciblé. Il ajoute l’inspection des dispositifs (drains, sonde, canule, cathéters), souvent responsables du problème.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Une vigilance normale, une fréquence respiratoire de 12 à 20 par minute et une saturation d’au moins 94 % à l’air sont les valeurs de référence chez l’adulte sans maladie pulmonaire. Une somnolence avec une respiration lente évoque une hypercapnie par opioïdes ou par curarisation résiduelle. Une agitation avec tachypnée évoque une hypoxémie. Une fièvre au-delà de 38,5 °C après le troisième jour oriente vers une infection plutôt que vers une atélectasie.</p></div>
<div class="card"><h4>Examen thoracique</h4><p>À l’état normal, le murmure vésiculaire est symétrique et la percussion sonore. L’<button class="w" data-k="j95-atel">atélectasie</button> donne une matité, une diminution du murmure et parfois un souffle tubaire lorsque la bronche reste perméable. Des crépitants localisés avec fièvre évoquent une pneumonie. Des crépitants bilatéraux avec turgescence jugulaire évoquent un œdème cardiogénique. Un tympanisme avec abolition du murmure évoque un pneumothorax.</p></div>
<div class="card"><h4>Voies aériennes, cou et médiastin</h4><p>Le médecin écoute un stridor et recherche un tirage sus-sternal. Il palpe le cou et le thorax : une crépitation neigeuse sous les doigts signe un emphysème sous-cutané. Le <button class="w" data-k="j95-pneumomed">signe de Hamman (crépitation synchrone du cœur)</button> évoque un pneumomédiastin. Chez un trachéotomisé, il vérifie la position de la canule, la présence d’un flux d’air et l’aspect de la stomie.</p></div>
<div class="card"><h4>Diaphragme et paroi</h4><p>En décubitus dorsal, l’abdomen se soulève normalement à l’inspiration. Une <b>respiration abdominale paradoxale</b>, où l’abdomen se creuse à l’inspiration, signe une paralysie diaphragmatique bilatérale. Le médecin recherche aussi une douleur pariétale non contrôlée, qui empêche la toux, et une distension abdominale, qui refoule le diaphragme.</p></div></div>
<div class="trap"><span class="k">Piège</span>Une saturation normale sous oxygène n’exclut ni une hypoventilation ni une hypercapnie. L’oxygène corrige la saturation pendant que la PaCO₂ monte. Chez un patient somnolent sous opioïdes, le médecin compte la fréquence respiratoire et demande une gazométrie au lieu de se fier à l’oxymètre.</div>
<div class="key"><b>À retenir.</b> L’examen d’un opéré hypoxémique distingue en quelques minutes la perte de volume localisée, l’infection, la surcharge, le pneumothorax et l’hypoventilation. Il inspecte toujours les dispositifs. Le §7 transforme ces données en démarche diagnostique.</div>
<button class="pareto-btn ui" data-k="pareto-j95-clin">▲ Loi de Pareto — Définitions, mécanismes, risque et clinique</button>
</section>

<section class="ilot" id="j95-7"><h2><span class="n">7</span>Démarche devant une détresse respiratoire postopératoire</h2>
<p>Devant une hypoxémie postopératoire, le médecin pose trois questions dans cet ordre. La vie est-elle menacée ? Le mécanisme est-il une hypoventilation, un shunt ou un trouble ventilation-perfusion ? Quelle est la cause précise ? L’ordre compte, car une obstruction des voies aériennes ou un pneumothorax sous tension se traitent avant tout examen.</p>
<h3>7.1 Algorithme</h3>

<p>La figure se lit de haut en bas. La gazométrie artérielle sépare d’abord l’hypoventilation, où la PaCO₂ monte et le <button class="w" data-k="j95-gds">gradient alvéolo-artériel en oxygène (calcul et interprétation)</button> reste normal, des autres mécanismes. La radiographie thoracique et l’échographie pulmonaire séparent ensuite les causes avec image de celles sans image. La <button class="w" data-k="j95-hypox">fiche de l’hypoxémie postopératoire</button> détaille les examens de chaque branche.</p>
<h3>7.2 Diagnostics différentiels hiérarchisés par gravité</h3>
<p>Le tableau classe les causes principales en commençant par celles qui tuent le plus vite. Il indique pour chacune l’argument le plus discriminant.</p>
<table class="t"><tr><th>Cause</th><th>Argument discriminant</th><th>Examen décisif</th></tr>
<tr><td>Obstruction des voies aériennes, canule déplacée</td><td>Stridor, tirage, absence de flux à la canule</td><td>Clinique, capnographie</td></tr>
<tr><td>Pneumothorax sous tension</td><td>Hypotension, murmure aboli, tympanisme, ventilation difficile</td><td>Clinique, échographie</td></tr>
<tr><td>Embolie pulmonaire</td><td>Hypoxémie avec poumons clairs, tachycardie, facteur thromboembolique</td><td>Angio-TDM thoracique (cours I26)</td></tr>
<tr><td>Œdème pulmonaire cardiogénique ou surcharge transfusionnelle</td><td>Bilan entrant positif, crépitants bilatéraux, turgescence jugulaire</td><td>Échocardiographie, peptides natriurétiques</td></tr>
<tr><td><button class="w" data-k="j95-trali">Lésion pulmonaire aiguë post-transfusionnelle</button></td><td>Œdème bilatéral dans les six heures d’une transfusion, sans surcharge</td><td>Chronologie, exclusion de la surcharge</td></tr>
<tr><td>Inhalation</td><td>Régurgitation constatée, opacités déclives</td><td>Radiographie, contexte</td></tr>
<tr><td>Pneumonie nosocomiale</td><td>Fièvre, expectoration purulente, opacité nouvelle après 48 heures</td><td>Radiographie, prélèvements (cours J18)</td></tr>
<tr><td>Atélectasie</td><td>Perte de volume, fièvre modérée ou absente, du premier au troisième jour</td><td>Radiographie, échographie</td></tr>
<tr><td>Hypoventilation par opioïdes ou curare</td><td>Somnolence, bradypnée, PaCO₂ élevée</td><td>Gazométrie, moniteur de curarisation</td></tr></table>
<p>L’erreur la plus fréquente consiste à attribuer toute fièvre du premier jour à une atélectasie. L’association entre atélectasie et fièvre précoce est faible, et une fièvre élevée persistante doit faire chercher une infection, une fuite anastomotique ou une thrombose. Pour le patient du cas, la diminution du murmure à gauche, la fébricule et la survenue à au deuxième jour orientent vers une atélectasie basale, à confirmer par l’imagerie.</p>
<div class="key"><b>À retenir.</b> La démarche commence par les urgences mécaniques, sépare ensuite l’hypoventilation du shunt par la gazométrie, puis cherche la cause par l’imagerie. L’embolie pulmonaire est la cause grave à ne pas oublier lorsque la radiographie est peu modifiée. Le §8 traite les urgences propres aux actes médicaux.</div>
</section>
