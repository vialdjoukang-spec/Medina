<!-- ===== FENÊTRES : examens, prise en charge, contentieux ===== -->
<template data-pop="j21-pcrvir" data-title="PCR virale sur prélèvement nasopharyngé">
<div class="lab">Principe</div><p>La PCR amplifie le génome viral présent dans les cellules et sécrétions du nasopharynx. Les panels multiplex détectent une dizaine de virus en une analyse.</p>
<div class="lab">Indication</div><p>Elle sert à l’hôpital pour regrouper les enfants infectés par le même virus, pour la surveillance et pour le codage. Elle ne change pas le traitement de la bronchiolite.</p>
<div class="lab">Piège</div><p>La PCR détecte aussi des virus persistants après une infection ancienne, comme le rhinovirus ou le bocavirus. Un résultat positif ne prouve pas que ce virus cause l’épisode.</p></template>
<template data-pop="j21-gaz" data-title="Gazométrie capillaire">
<div class="lab">Indication</div><p>NICE ne la recommande pas de routine. Elle se discute si la fraction inspirée d’oxygène nécessaire dépasse 50 %, ou si une défaillance respiratoire est suspectée.</p>
<div class="lab">Technique</div><p>Le talon est réchauffé pour artérialiser le sang capillaire, puis piqué latéralement. Le prélèvement ne doit pas être pressé, ce qui diluerait l’échantillon.</p>
<div class="lab">Interprétation</div><p>Le pH et la PaCO₂ capillaires reflètent bien les valeurs artérielles ; la PaO₂ capillaire est peu fiable. Une PaCO₂ qui monte avec un pH qui baisse signe l’épuisement.</p></template>
<template data-pop="j21-defaillance" data-title="Défaillance respiratoire imminente">
<div class="lab">Critères de NICE</div><p>Signes d’épuisement (apathie, effort respiratoire qui diminue), apnées répétées, ou impossibilité de maintenir une saturation suffisante malgré l’oxygène.</p>
<div class="lab">Conduite</div><p>L’enfant peut nécessiter des soins intensifs. NICE propose une ventilation en pression positive continue, une gazométrie capillaire, une perfusion isotonique, et une radiographie thoracique si l’admission en soins intensifs est envisagée.</p>
<div class="lab">Piège</div><p>L’oxygène peut maintenir une saturation correcte alors que la PaCO₂ monte. Une saturation à 94 % sous oxygène ne prouve pas une ventilation suffisante.</p></template>
<template data-pop="j21-hypona" data-title="Hyponatrémie au cours de la bronchiolite">
<div class="lab">Mécanisme</div><p>L’infection pulmonaire, l’hypoxie, la douleur et le stress stimulent la sécrétion d’hormone antidiurétique. Le rein retient l’eau libre. Si l’enfant reçoit un soluté hypotonique, le sodium plasmatique baisse.</p>
<div class="lab">Conséquence</div><p>Une hyponatrémie aiguë entraîne un œdème cérébral, avec irritabilité, vomissements et convulsions.</p>
<div class="lab">Prévention</div><p>NICE impose des solutés isotoniques intraveineux. La natrémie se contrôle chez l’enfant perfusé.</p></template>
<template data-pop="j21-bopi" data-title="Bronchiolite oblitérante post-infectieuse">
<div class="lab">Définition</div><p>Fibrose concentrique des bronchioles après une infection grave, qui rétrécit ou obstrue définitivement leur lumière.</p>
<div class="lab">Causes</div><p>L’adénovirus est la cause la plus souvent décrite ; d’autres agents peuvent la provoquer.</p>
<div class="lab">Indices</div><p>Toux, sibilants, crépitants et besoins en oxygène persistant plus de six semaines après l’épisode aigu. La tomodensitométrie montre un aspect en mosaïque avec piégeage expiratoire.</p>
<div class="lab">Conduite</div><p>L’enfant est adressé au pneumologue pédiatre ; le traitement est spécialisé.</p></template>
<template data-pop="j21-bo" data-title="Bronchiolite oblitérante (constrictive) de l’adulte">
<div class="lab">Définition</div><p>Rétrécissement fibreux des bronchioles qui produit une obstruction fixe et progressive.</p>
<div class="lab">Contextes</div><p>Inhalation de gaz toxiques (oxydes d’azote, dioxyde de soufre, chlore) ou d’arômes alimentaires (diacétyle), greffe pulmonaire ou de cellules souches (syndrome de bronchiolite oblitérante), maladies rhumatismales, certains médicaments (Ryu, 2020).</p>
<div class="lab">Codage</div><p>La forme chronique ou subaiguë due à l’inhalation de produits chimiques, gaz, fumées ou vapeurs est codée J68.4. Les autres formes chroniques ne relèvent pas de J21.</p>
<div class="lab">Explorations</div><p>La spirométrie montre une obstruction peu réversible ; la tomodensitométrie en expiration montre un piégeage en mosaïque.</p></template>
<template data-pop="j21-seuilo2" data-title="Seuil de saturation : 90 % ou 94 % ? (essai BIDS)">
<div class="lab">Essai</div><p>L’essai BIDS (Cunningham et al., Lancet 2015) a randomisé 615 nourrissons de 6 semaines à 12 mois hospitalisés pour bronchiolite. Des oxymètres modifiés affichaient 94 % pour une valeur réelle de 90 %, ce qui permettait de tester un seuil de 90 % en aveugle.</p>
<div class="lab">Résultat</div><p>La durée médiane de la toux était identique (15 jours dans les deux groupes) ; les deux seuils étaient équivalents. Les événements indésirables ne différaient pas significativement.</p>
<div class="lab">Applicabilité</div><p>L’essai excluait les enfants de moins de 6 semaines et les enfants à haut risque. C’est pourquoi NICE 2021 garde 92 % dans ces groupes.</p>
<div class="lab">Recommandation retenue</div><p>NICE NG9, mise à jour le 9 août 2021 : seuil de 90 % dès 6 semaines, 92 % avant 6 semaines ou en cas de comorbidité. L’Académie américaine de pédiatrie (2014) recommandait déjà de ne pas donner d’oxygène au-dessus de 90 %.</p></template>
<template data-pop="j21-sng" data-title="Alimentation par sonde nasogastrique ou orogastrique">
<div class="lab">Indication</div><p>NICE recommande la sonde lorsque l’enfant ne peut pas boire assez par la bouche.</p>
<div class="lab">Avantages</div><p>Elle apporte de l’eau, de l’énergie et des électrolytes sans ponction veineuse, et permet de poursuivre le lait maternel.</p>
<div class="lab">Précautions</div><p>Une sonde nasale occupe une narine chez un enfant qui respire par le nez ; la voie orogastrique est préférée chez le très jeune nourrisson en détresse. Des repas fractionnés ou un débit continu limitent la distension gastrique qui gêne le diaphragme.</p>
<div class="lab">Relais</div><p>La perfusion isotonique est réservée à l’intolérance de la sonde ou à la défaillance imminente.</p></template>
<template data-pop="j21-hfnc" data-title="Oxygénothérapie nasale à haut débit">
<div class="lab">Principe</div><p>Un mélange d’air et d’oxygène réchauffé et humidifié est délivré par des lunettes nasales à un débit supérieur au débit inspiratoire de l’enfant.</p>
<div class="lab">Effets</div><p>Le haut débit lave l’espace mort du nasopharynx, crée une légère pression positive et réduit le travail respiratoire.</p>
<div class="lab">Preuve</div><p>Dans l’essai PARIS (Franklin et al., New England Journal of Medicine 2018 ; 1472 nourrissons de moins de 12 mois, hors soins intensifs), l’escalade thérapeutique a concerné 12 % des enfants sous haut débit contre 23 % sous oxygène standard. La durée de séjour et d’oxygénothérapie n’a pas différé. Parmi les échecs du groupe standard, 61 % ont répondu au haut débit de secours.</p>
<div class="lab">Limite</div><p>NICE 2021 ne formule pas de recommandation spécifique sur le haut débit. Son usage suit les protocoles hospitaliers.</p></template>
<template data-pop="j21-ppc" data-title="Ventilation en pression positive continue">
<div class="lab">Principe</div><p>Une pression positive constante est appliquée par masque ou canules nasales pendant tout le cycle respiratoire.</p>
<div class="lab">Effets</div><p>Elle maintient les petites voies aériennes et les alvéoles ouvertes, contrebalance la pression alvéolaire de fin d’expiration et réduit le travail inspiratoire.</p>
<div class="lab">Indication</div><p>NICE propose de l’envisager en cas de défaillance respiratoire imminente. Elle se pratique dans une unité de soins intermédiaires ou intensifs.</p></template>
<template data-pop="j21-cochrane-bd" data-title="Revue Cochrane 2014 : bronchodilatateurs">
<div class="lab">Référence</div><p>Gadomski A. M., Scribani M. B. Bronchodilators for bronchiolitis. Cochrane Database of Systematic Reviews 2014.</p>
<div class="lab">Population</div><p>30 essais, 1992 nourrissons de 0 à 12 mois ; bronchodilatateurs autres que l’adrénaline contre placebo.</p>
<div class="lab">Résultats</div><p>Pas d’amélioration de la saturation. Pas de réduction des hospitalisations après traitement ambulatoire (11,9 % contre 15,9 %, rapport des cotes 0,75, intervalle de confiance à 95 % de 0,46 à 1,21). Pas de réduction de la durée d’hospitalisation. Le score clinique ambulatoire diminue légèrement, d’intérêt clinique discutable. Effets indésirables : tachycardie, désaturation, tremblements.</p>
<div class="lab">Conclusion</div><p>Les bronchodilatateurs ne sont pas efficaces dans la prise en charge de routine de la bronchiolite.</p></template>
<template data-pop="j21-cochrane-cs" data-title="Revue Cochrane 2013 : glucocorticoïdes">
<div class="lab">Référence</div><p>Fernandes R. M. et al. Glucocorticoids for acute viral bronchiolitis in infants and young children. Cochrane Database of Systematic Reviews 2013.</p>
<div class="lab">Population</div><p>17 essais, 2596 enfants de moins de 24 mois.</p>
<div class="lab">Résultats</div><p>Pas de réduction des admissions aux jours 1 et 7 (rapports de risques 0,92 et 0,86, non significatifs). Pas de bénéfice sur la durée de séjour. Un grand essai factoriel a suggéré qu’une forte dose de dexaméthasone associée à l’adrénaline inhalée réduisait les admissions au jour 7, mais ce résultat est exploratoire.</p>
<div class="lab">Mécanisme</div><p>L’inflammation de la bronchiolite est surtout lymphocytaire et neutrophilique, non de type 2 éosinophilique comme dans l’asthme ; elle répond mal aux corticoïdes.</p>
<div class="lab">Recommandation</div><p>NICE déconseille les corticoïdes systémiques ou inhalés, et l’association corticoïde-adrénaline.</p></template>
<template data-pop="j21-contentieux-ssh" data-title="Contentieux : sérum salé hypertonique nébulisé">
<div class="lab">Recommandation en vigueur retenue</div><p>NICE NG9 (recommandation 1.4.3, formulée en 2015 et inchangée lors de la mise à jour du 9 août 2021) : ne pas utiliser le sérum salé hypertonique pour traiter la bronchiolite. C’est la recommandation de pratique applicable la plus récente identifiée sur ce point. L’Académie américaine de pédiatrie (2014) le déconseille aux urgences et ne le propose qu’avec réserve chez l’enfant hospitalisé.</p>
<div class="lab">Source plus récente divergente</div><p>Revue Cochrane de Zhang et al. (2023, 34 essais, 5205 nourrissons) : le sérum hypertonique pourrait réduire la durée de séjour de 0,4 jour et le risque d’hospitalisation après traitement ambulatoire (rapport de risques 0,87), avec une certitude faible à très faible. Les effets indésirables (toux, agitation, bronchospasme) étaient le plus souvent légers.</p>
<div class="lab">Relation entre les deux</div><p>La revue est plus récente mais n’est pas une recommandation ; sa certitude faible et l’hétérogénéité des essais ne renversent pas la recommandation. Le cours retient l’absence d’usage de routine. Un protocole hospitalier peut l’utiliser chez l’enfant hospitalisé ; cette décision relève de l’équipe.</p>
<div class="lab">Accès aux textes</div><p>NICE NG9 : nice.org.uk/guidance/ng9 (consulté le 08.10.2026). Revue Cochrane de Zhang et al., publiée le 4 avril 2023, accessible par la Cochrane Library.</p></template>
<template data-pop="j21-kine" data-title="Kinésithérapie respiratoire">
<div class="lab">Recommandation</div><p>NICE déconseille la kinésithérapie respiratoire chez l’enfant sans comorbidité particulière. Elle propose une évaluation par un kinésithérapeute en cas de comorbidité gênant l’évacuation des sécrétions, par exemple une amyotrophie spinale ou une trachéomalacie sévère.</p>
<div class="lab">Mécanisme</div><p>Les techniques de clapping et de vibration n’atteignent pas les bouchons des bronchioles distales et fatiguent un enfant déjà en détresse.</p>
<div class="lab">À distinguer</div><p>La désobstruction nasale douce, utile, n’est pas une kinésithérapie thoracique.</p></template>
<template data-pop="j21-hygiene" data-title="Hygiène et isolement">
<div class="lab">Pourquoi</div><p>Le virus se transmet par les gouttelettes, les aérosols et les mains contaminées par les surfaces. Les nourrissons hospitalisés et les soignants le propagent dans le service.</p>
<div class="lab">Mesures</div><p>Hygiène des mains avant et après chaque contact, précautions de contact et gouttelettes, regroupement des enfants infectés par le même virus identifié par PCR, éviction des soignants enrhumés auprès des nourrissons fragiles.</p>
<div class="lab">À domicile</div><p>Lavage des mains, limitation des contacts enrhumés avec le jeune nourrisson, absence de tabagisme au foyer.</p></template>
<template data-pop="j21-reco-evolution" data-title="Évolution des recommandations suisses de prévention (2024 à 2026)">
<div class="lab">Recommandation retenue</div><p>Plan de vaccination suisse 2026, état février 2026 (OFSP et CFV). Une dose unique d’un anticorps monoclonal à longue durée d’action pendant la première année de vie, ou la vaccination maternelle pour une naissance prévue d’octobre à mars ; les deux options sont équivalentes. Rattrapage en octobre pour un enfant né en hiver non immunisé au 31 mars. Seconde dose avant la deuxième saison chez l’enfant à risque. Statut : recommandation officielle en vigueur.</p>
<div class="lab">Textes antérieurs</div><p>Consensus suisse 2024 (OFSP-Bulletin 37 du 9 septembre 2024) : nirsévimab pour tous les nourrissons, la vaccination maternelle n’étant pas encore autorisée en Suisse. Recommandations de l’OFSP état 28.07.2025 (OFSP-Bulletin 36 du 1er septembre 2025) : introduction de la vaccination maternelle par Abrysvo comme deuxième option.</p>
<div class="lab">Relation entre les textes</div><p>Le texte de 2026 ne contredit pas les précédents : il les intègre et formule l’anticorps de façon générique, en prévision d’autres produits. Il précise aussi qu’un enfant à risque persistant de 24 mois ou moins qui n’a pas reçu de dose pendant sa deuxième saison, ou seulement celle de la saison précédente, peut la recevoir dès octobre, peu avant sa troisième saison.</p>
<div class="lab">Accès</div><p>bag.admin.ch, page « Plan de vaccination suisse » et page « Virus respiratoire syncytial » (consultées le 08.10.2026).</p></template>
<template data-pop="j21-tdm-adulte" data-title="Tomodensitométrie de la bronchiolite de l’adulte">
<div class="lab">Signes directs</div><p>Micronodules centrolobulaires flous, images en arbre en bourgeon : bronchioles remplies de sécrétions ou épaissies, visibles comme de petites branches nodulaires.</p>
<div class="lab">Signes indirects</div><p>Aspect en mosaïque, accentué en expiration, par piégeage de l’air derrière des bronchioles obstruées.</p>
<div class="lab">Interprétation</div><p>L’arbre en bourgeon oriente vers une cause infectieuse ou une aspiration ; une mosaïque isolée avec piégeage persistant oriente vers une bronchiolite constrictive.</p></template>
<template data-pop="j21-crp-contentieux" data-title="Contentieux : seuils de protéine C réactive pour l’antibiotique (adulte)">
<div class="lab">Recommandation retenue</div><p>Société suisse d’infectiologie, recommandation 5082 « Infection respiratoire aiguë et syndrome grippal de l’adulte », validée le 01.09.2026. Dosage seulement en présence de signes évocateurs ; antibiotique à envisager si la protéine C réactive est d’au moins 100 mg/L ou la procalcitonine d’au moins 0,25 µg/L ; traitement symptomatique si la protéine C réactive est inférieure à 50 mg/L ; décision partagée entre 50 et 100 mg/L.</p>
<div class="lab">Autre texte</div><p>La recommandation NICE sur la pneumonie de l’adulte (CG191) retient, en soins primaires et en cas de doute clinique, l’absence d’antibiotique de routine en dessous de 20 mg/L, une prescription différée entre 20 et 100 mg/L, et un antibiotique au-dessus de 100 mg/L.</p>
<div class="lab">Relation entre les textes</div><p>La SSI est la source suisse applicable la plus récente ; elle fixe un seuil inférieur différent (50 mg/L) et cite parmi ses sources la recommandation NICE de 2023 sur l’infection respiratoire aiguë de l’adulte. Les deux textes s’accordent sur le seuil de 100 mg/L. Le cours suit la SSI pour la pratique en Suisse.</p>
<div class="lab">Accès</div><p>ssi.guidelines.ch/guideline/5082 (consulté le 08.10.2026).</p></template>
