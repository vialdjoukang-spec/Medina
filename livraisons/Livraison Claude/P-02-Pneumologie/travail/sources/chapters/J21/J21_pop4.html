<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j21-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j21-0,j21-1,j21-2,j21-3,j21-4,j21-5,j21-6"></p>
<ul>
<li>La bronchiolite est un diagnostic clinique avant 2 ans : rhume de 1 à 3 jours, puis toux, polypnée ou tirage, et sibilants ou crépitants.</li>
<li>La gravité se juge sur trois axes : travail respiratoire, saturation, alimentation ; l’apnée s’y ajoute.</li>
<li>Les codes sont J21.0 (virus respiratoire syncytial), J21.1 (métapneumovirus), J21.8 (autre agent), J21.9 (sans précision) et J22 (infection basse de siège non établi).</li>
<li>Presque tous les enfants sont infectés avant 3 ans ; le risque d’hospitalisation culmine avant 3 mois et plus de 80 % des hospitalisés sont sains.</li>
<li>Le virus détruit l’épithélium cilié ; débris, mucus et œdème bouchent des bronchioles étroites : distension, atélectasies, hypoxémie.</li>
<li>Le muscle lisse joue un rôle mineur : le bronchodilatateur n’ouvre pas un bouchon.</li>
<li>Les facteurs de risque sont l’âge inférieur à 3 mois, la prématurité, les maladies cardiaques, pulmonaires et neuromusculaires, l’immunodéficience et la trisomie 21.</li>
<li>Avant 6 semaines, l’apnée peut être le seul signe.</li>
<li>Le médecin désobstrue le nez, compte la fréquence sur une minute, mesure la saturation et chiffre les apports.</li></ul></template>
<template data-pop="pareto-j21-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j21-7"></p>
<ul>
<li>L’oxymétrie est indiquée chez tous ; ni prise de sang ni radiographie de routine.</li>
<li>La PCR virale sert à l’hôpital pour regrouper les enfants, non au traitement.</li>
<li>La radiographie se discute si des soins intensifs sont envisagés ou si le diagnostic est douteux.</li>
<li>Les différentiels graves sont l’insuffisance cardiaque, le sepsis, la coqueluche, la pneumonie et le corps étranger.</li>
<li>Une polypnée sans bruit auscultatoire oriente vers une cause métabolique ou cardiaque.</li></ul></template>
<template data-pop="pareto-j21-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="j21-8"></p>
<ul>
<li>Apnée, aspect grave, geignement, tirage marqué, fréquence supérieure à 70/min ou cyanose imposent l’urgence.</li>
<li>Épuisement, apnées répétées et saturation réfractaire annoncent une défaillance.</li>
<li>La perfusion est isotonique, car l’hormone antidiurétique expose à l’hyponatrémie.</li>
<li>L’asthme ultérieur est associé à la bronchiolite grave, sans causalité démontrée.</li></ul></template>
<template data-pop="pareto-j21-ttt" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="j21-9"></p>
<ul>
<li>L’oxygène est donné sous 90 % dès 6 semaines, sous 92 % avant 6 semaines ou en cas de comorbidité.</li>
<li>L’admission repose sur l’apnée, la saturation, des apports de 50 à 75 % ou une détresse sévère persistante.</li>
<li>La sonde gastrique précède la perfusion isotonique.</li>
<li>Le haut débit réduit l’escalade ; la pression positive continue traite la défaillance imminente.</li>
<li>Bronchodilatateurs, corticoïdes, adrénaline, sérum hypertonique, antibiotiques et kinésithérapie ne sont pas indiqués en routine.</li>
<li>La sortie exige stabilité, apports suffisants et 4 heures au-dessus du seuil, sommeil compris.</li></ul></template>
<template data-pop="pareto-j21-prev" data-title="Pareto — Prévention">
<p class="ratio" data-cover="j21-10"></p>
<ul>
<li>Naissance d’octobre à mars : vaccin maternel entre 32 et 36 semaines ou nirsévimab dans la première semaine.</li>
<li>Naissance d’avril à septembre : nirsévimab en octobre.</li>
<li>Le nirsévimab est donné malgré le vaccin si l’accouchement suit de moins de 14 jours, si l’enfant naît avant 37 semaines ou si la mère est immunodéprimée.</li>
<li>L’enfant à risque reçoit 200 mg avant sa deuxième saison.</li>
<li>Ces produits préviennent et ne traitent pas.</li></ul></template>
<template data-pop="pareto-j21-crit" data-title="Pareto — Suivi, adulte, J22, situations particulières et critères">
<p class="ratio" data-cover="j21-11,j21-12,j21-13,j21-14,j21-15"></p>
<ul>
<li>La maladie culmine au troisième à cinquième jour ; la toux peut durer trois semaines.</li>
<li>Les parents reviennent en cas de détresse, d’apports inférieurs à 75 %, d’absence de couche mouillée depuis 12 heures, d’apnée ou d’épuisement.</li>
<li>Chez l’adulte, la bronchiolite aiguë touche le sujet âgé, l’immunodéprimé et l’exposé aux gaz ; la tomodensitométrie montre l’arbre en bourgeon.</li>
<li>Pour J22, la SSI trie cliniquement, puis dose la protéine C réactive : antibiotique dès 100 mg/L, abstention sous 50 mg/L.</li>
<li>Les seuils de 92 % valent avant 6 semaines et en cas de comorbidité.</li></ul></template>
<template data-pop="pareto-j21-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j21-e-1,j21-e-2,j21-e-3,j21-e-4,j21-e-5,j21-e-6"></p>
<ul>
<li>L’oxymétrie se fait au repos, courbe régulière, au moins une minute ; elle peut surestimer sur peau foncée.</li>
<li>La PCR identifie le virus sans changer le traitement.</li>
<li>Les atélectasies radiologiques imitent une pneumonie et ne décident pas de l’antibiotique.</li>
<li>Une PaCO₂ qui monte signe l’épuisement ; la natrémie se surveille sous perfusion.</li></ul></template>
<template data-pop="pareto-j21-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j21-p-1,j21-p-2,j21-p-3,j21-p-4"></p>
<ul>
<li>Le nirsévimab se dose à 50 mg sous 5 kg, 100 mg dès 5 kg, 200 mg en deuxième saison, par voie intramusculaire.</li>
<li>Abrysvo se donne en dose unique de 0,5 mL entre 32 0/7 et 36 0/7 semaines.</li>
<li>Le paracétamol se dose à 15 mg/kg, 3 à 4 fois par jour, sans dépasser 75 mg/kg par jour.</li>
<li>Solutés hypotoniques, sédatifs et antitussifs opiacés sont à éviter.</li></ul></template>
