<template data-pop="j21-d-nirsevimab" data-title="Nirsévimab (Beyfortus)">
<div class="lab">Mécanisme</div><p>Le nirsévimab est un anticorps monoclonal humain IgG1 kappa qui se lie à la protéine F du virus respiratoire syncytial en conformation de préfusion et bloque la fusion. Son fragment constant est modifié pour prolonger sa demi-vie : environ 71 jours chez un nourrisson de 5 kg selon l’information professionnelle suisse. Ce n’est pas un vaccin, mais une immunisation passive immédiate.</p>
<div class="lab">Autorisation et recommandation</div><p>Swissmedic l’a autorisé le 28 décembre 2023 chez l’enfant jusqu’à 24 mois. Le Plan de vaccination 2026 le recommande pour tout nourrisson pendant sa première année, selon le mois de naissance, et en deuxième saison chez l’enfant à risque persistant. Il est remboursé par l’assurance obligatoire des soins selon les recommandations (inscription sur la liste des spécialités en septembre 2024, selon l’OFSP).</p>
<div class="lab">Preuves</div><p>MELODY (enfants à terme et prématurés tardifs) : efficacité de 76,4 % contre les infections basses traitées médicalement et de 76,8 % contre les hospitalisations à 150 jours. HARMONIE (8057 nourrissons, comparaison aux soins habituels) : 83 % contre les hospitalisations à trois mois, 82,7 % à 180 jours. Analyse groupée : 86 % contre les admissions en soins intensifs. MEDLEY : sécurité comparable au palivizumab chez les enfants à haut risque. Aucun essai n’a eu la puissance de mesurer un effet sur la mortalité.</p>
<div class="lab">Posologie (information professionnelle, juillet 2026)</div><p>Première saison : 50 mg si le poids est inférieur à 5 kg, 100 mg à partir de 5 kg, en dose unique intramusculaire. Deuxième saison : 200 mg en deux injections de 100 mg. Dose supplémentaire après chirurgie cardiaque sous circulation extracorporelle, selon le délai depuis la dose initiale et le poids. Injection dans la face antérolatérale de la cuisse.</p>
<div class="lab">Effets indésirables</div><p>Douleur au point d’injection, éruption discrète et passagère. Aucune anaphylaxie n’a été observée dans les essais. Des anticorps anti-médicament sont apparus chez 5,4 à 6 % des enfants, sans effet clinique notable décrit.</p>
<div class="lab">Contre-indication et précautions</div><p>Hypersensibilité grave connue au produit ou à ses composants. Prudence en cas de thrombopénie, de trouble de la coagulation ou d’anticoagulation. Non indiqué pour traiter une infection déclarée.</p></template>
<template data-pop="j21-d-abrysvo" data-title="Abrysvo, vaccin maternel contre le virus respiratoire syncytial">
<div class="lab">Composition et mécanisme</div><p>Vaccin sans adjuvant contenant 60 µg de protéine F stabilisée en préfusion de chacun des sous-groupes A et B. La mère produit des IgG neutralisantes, qui traversent le placenta par le récepteur néonatal des fragments constants et protègent le nourrisson dès la naissance.</p>
<div class="lab">Indication suisse</div><p>Immunisation active de la femme enceinte entre 32 0/7 et 36 0/7 semaines pour protéger le nourrisson jusqu’à 6 mois contre les infections basses à virus respiratoire syncytial (information professionnelle, juillet 2026). Le Plan de vaccination 2026 la recommande pour une naissance prévue d’octobre à mars, une seule fois dans la vie de la femme, chez la femme de 18 ans ou plus, idéalement au moins 5 semaines avant le terme. Abrysvo est aussi autorisé chez l’adulte de 60 ans ou plus (cours J12).</p>
<div class="lab">Preuves</div><p>MATISSE (environ 7300 femmes vaccinées entre 24 et 36 semaines) : efficacité de 82 % contre les infections basses graves du nourrisson à 90 jours et de 69 % à 180 jours. Dans le sous-groupe vacciné entre 32 et 36 semaines, réduction de 91 % des infections basses graves à 90 jours (OFSP-Bulletin 36/2025). En Argentine, l’efficacité en vie réelle contre les hospitalisations était de 71 % de 0 à 6 mois.</p>
<div class="lab">Posologie</div><p>Une dose de 0,5 mL par voie intramusculaire.</p>
<div class="lab">Sécurité</div><p>Douleur au point d’injection (41 %), céphalées (31 %), myalgies (27 %) chez la femme enceinte. Les essais ont montré un déséquilibre numérique de naissances prématurées (5,7 % contre 4,7 % dans l’essai de phase 3), sans lien causal établi ni exclu ; pour cette raison, l’administration est limitée à 32 0/7 à 36 0/7 semaines. Une étude américaine de plus de 6300 femmes n’a pas montré d’augmentation du risque d’accouchement prématuré.</p>
<div class="lab">Situations où l’anticorps reste nécessaire</div><p>Accouchement moins de 14 jours après la vaccination, naissance avant 37 0/7 semaines, immunosuppression maternelle, perte de l’immunité humorale de l’enfant, ou maladie à risque de forme mortelle selon le spécialiste.</p></template>
<template data-pop="j21-d-palivizumab" data-title="Palivizumab (Synagis)">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humanisé dirigé contre la protéine F, de première génération, sans prolongation de demi-vie (environ 20 jours).</p>
<div class="lab">Usage historique</div><p>Recommandé en Suisse depuis 2000 pour les nourrissons à très haut risque (dysplasie bronchopulmonaire sévère, cardiopathie grave), par injections mensuelles pendant la saison. L’essai IMpact-RSV (1998) a réduit les hospitalisations des anciens prématurés de 10,6 % à 4,8 %, soit une efficacité de 55 %.</p>
<div class="lab">Limites</div><p>Efficacité incomplète, injections mensuelles, coût élevé, rapport coût-efficacité acceptable seulement dans un petit groupe (OFSP-Bulletin 37/2024).</p>
<div class="lab">Place actuelle</div><p>Les recommandations suisses en vigueur prévoient un anticorps monoclonal à longue durée d’action ; le palivizumab n’y figure plus comme option de première intention.</p></template>
<template data-pop="j21-d-o2" data-title="Oxygène dans la bronchiolite">
<div class="lab">Mécanisme</div><p>L’oxygène augmente la pression alvéolaire en oxygène dans les unités mal ventilées et corrige l’hypoxémie liée à l’inégalité ventilation-perfusion.</p>
<div class="lab">Indication</div><p>Saturation persistante inférieure à 90 % dès 6 semaines, ou à 92 % avant 6 semaines et en cas de comorbidité (NICE 2021).</p>
<div class="lab">Administration</div><p>Lunettes nasales à bas débit en première intention ; haut débit humidifié ou pression positive continue en cas d’aggravation, selon le protocole du service.</p>
<div class="lab">Surveillance et sevrage</div><p>Saturation en continu, signes de lutte, fréquence respiratoire. Le sevrage est tenté dès que l’enfant est stable ; la sortie suppose 4 heures à l’air au-dessus du seuil, sommeil compris.</p>
<div class="lab">Piège</div><p>L’oxygène masque l’hypoventilation : une saturation correcte sous oxygène n’exclut pas une PaCO₂ qui monte.</p></template>
<template data-pop="j21-d-paracetamol" data-title="Paracétamol chez l’enfant (Dafalgan sirop)">
<div class="lab">Mécanisme</div><p>Le paracétamol inhibe la synthèse centrale des prostaglandines ; il abaisse la fièvre et la douleur sans effet anti-inflammatoire périphérique notable.</p>
<div class="lab">Place</div><p>Il traite l’inconfort et une fièvre mal tolérée. Il ne modifie pas l’évolution de la bronchiolite.</p>
<div class="lab">Posologie (information professionnelle suisse, septembre 2025)</div><p>15 mg/kg par dose, 3 (à 4) doses par jour, avec 6 à 8 heures d’intervalle, soit au plus 60 mg/kg par jour avec 4 doses ; la monographie ne mentionne aucun plafond plus élevé. Le sirop contient 30 mg/mL : un nourrisson de 6 kg reçoit 90 mg, soit 3 mL par dose.</p>
<div class="lab">Précautions</div><p>Contre-indiqué en cas d’insuffisance hépatique sévère. La toxicité hépatique peut survenir à des doses plus faibles en cas de jeûne. Le médecin vérifie l’absence d’autre produit contenant du paracétamol. Chez le nourrisson de moins de 3 mois, la fièvre impose d’abord une évaluation médicale.</p></template>
