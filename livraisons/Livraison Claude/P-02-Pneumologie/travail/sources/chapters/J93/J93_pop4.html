
<!-- ===== FENÊTRES J93 : Pareto ===== -->
<template data-pop="pareto-j93-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="j93-0,j93-1,j93-2,j93-3,j93-4,j93-5,j93-6"></p>
<ul>
<li>Le pneumothorax est de l’air dans la plèvre ; il est primaire sans maladie pulmonaire, secondaire sur maladie pulmonaire ou après 50 ans avec tabagisme important.</li>
<li>J93.0 code le pneumothorax spontané sous tension, J93.1 les autres pneumothorax spontanés ; l’iatrogène (J95.80) et le traumatique (S27.0) sont exclus de J93.</li>
<li>Le primaire touche l’homme jeune, grand, mince et fumeur ; il récidive chez 32 % des patients. Le secondaire, surtout sur BPCO, est plus grave.</li>
<li>Une brèche annule la pression pleurale négative et le poumon se rétracte ; un effet de valve rend la pression positive, refoule le médiastin et réduit le retour veineux.</li>
<li>Le tabac est le facteur modifiable majeur ; un pneumothorax familial ou d’une femme jeune qui récidive fait rechercher une cause génétique, kystique ou cataméniale.</li>
<li>La douleur est pleurale, brutale, au repos ; la dyspnée dépend de la réserve et non de la taille.</li>
<li>Le côté atteint est silencieux et tympanique ; détresse, tachycardie, hypotension et turgescence jugulaire font suspecter une tension.</li>
<li>La résorption spontanée est lente, de l’ordre de 1,25 à 2,2 % du volume de l’hémithorax par jour ; l’oxygène à haut débit l’accélère.</li>
<li>Chez le patient emphysémateux, l’examen perd son asymétrie : l’imagerie est indispensable.</li>
</ul></template>

<template data-pop="pareto-j93-diag" data-title="Pareto — Démarche diagnostique et urgences">
<p class="ratio" data-cover="j93-7,j93-8"></p>
<ul>
<li>La radiographie debout montre la ligne pleurale viscérale ; l’échographie est plus sensible en décubitus ; la TDM sert au doute, à la bulle, à la cause et au geste.</li>
<li>La décision suit cinq questions : instabilité, symptômes, caractéristique à haut risque, taille suffisante (en général 2 cm) et priorité du patient.</li>
<li>Une ligne concave vers l’extérieur évoque une bulle : TDM avant tout drain.</li>
<li>La tension se traite sans imagerie : aiguille au quatrième ou cinquième espace intercostal en avant de la ligne axillaire moyenne chez l’adulte, thoracostomie au doigt si échec, puis drain.</li>
<li>Le pneumothorax non drainé devient compressif sous ventilation en pression positive.</li>
</ul></template>

<template data-pop="pareto-j93-ttt" data-title="Pareto — Traitement, suivi et prévention">
<p class="ratio" data-cover="j93-9,j93-10,j93-11"></p>
<ul>
<li>Le primaire peu symptomatique est surveillé quelle que soit sa taille, avec un contrôle tous les 2 à 4 jours.</li>
<li>Dans le primaire symptomatique, l’ERS 2024 préfère l’exsufflation au drain ; le dispositif ambulatoire est possible dans un centre équipé ; un second geste reste fréquent.</li>
<li>Le secondaire est hospitalisé et drainé par un drain de petit calibre si le geste est sûr ; l’oxygène vise 88 à 92 % en cas de risque d’hypercapnie.</li>
<li>Le médecin ne donne pas de protoxyde d’azote, n’aspire pas d’emblée et ne clampe jamais un drain qui bulle.</li>
<li>Une fuite persistante impose un avis chirurgical, au plus tard après 5 à 7 jours ; le patch sanguin sert dans le secondaire inopérable.</li>
<li>La chirurgie (résection et symphyse, surtout par thoracoscopie) est proposée après un deuxième épisode homolatéral, un premier controlatéral, une tension, dans une profession à risque ou au choix du patient.</li>
<li>Le patient arrête le tabac et le cannabis ; il peut voler 7 jours après la résolution radiographique complète ; la plongée avec bouteille reste déconseillée sans pleurectomie.</li>
</ul></template>

<template data-pop="pareto-j93-fin" data-title="Pareto — Situations particulières et critères">
<p class="ratio" data-cover="j93-12,j93-13"></p>
<ul>
<li>BPCO : drain, pas d’ambulatoire, symphyse chimique dès le premier épisode s’il a décompensé le patient.</li>
<li>Mucoviscidose : récidive de 50 % après drainage seul ; pleurectomie partielle pour les récidives.</li>
<li>VIH avec peu de CD4 : rechercher une pneumocystose. Femme qui récidive autour des règles : cataménial.</li>
<li>Grossesse : surveillance si petit et bien toléré ; accouchement assisté programmé sous péridurale.</li>
<li>Forme familiale : TDM et recherche d’un syndrome de Birt-Hogg-Dubé.</li>
<li>Diagnostic : ligne pleurale à la radiographie, point poumon à l’échographie, ou TDM ; la tension est un diagnostic clinique.</li>
</ul></template>

<template data-pop="pareto-j93-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j93-e-1,j93-e-2,j93-e-3,j93-e-4,j93-e-5,j93-e-6"></p>
<ul>
<li>Aucun examen ne précède la décompression d’une tension.</li>
<li>La taille sert à juger la sécurité d’un geste, pas à l’indiquer ; la méthode de Collins estime un pourcentage.</li>
<li>Échographie : la présence de glissement ou d’une ligne B exclut le pneumothorax sous la sonde ; le point poumon l’affirme (spécificité de 100 %).</li>
<li>Radiographie debout : ligne pleurale fine sans trame au-delà ; un pli cutané ou la paroi concave d’une bulle simulent un pneumothorax ; pas de cliché en expiration.</li>
<li>TDM : examen de référence, non systématique dans le premier épisode primaire.</li>
<li>Absence de glissement sans point poumon : penser aussi aux adhérences, à l’apnée et à l’intubation sélective.</li>
<li>Gazométrie si SpO₂ basse ou maladie pulmonaire ; coagulation seulement sous anticoagulant ou trouble connu.</li>
</ul></template>

<template data-pop="pareto-j93-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j93-p-1,j93-p-2,j93-p-3,j93-p-4,j93-p-5"></p>
<ul>
<li>Oxygène à haut débit pour accélérer la résorption chez le patient hospitalisé, cible de 88 à 92 % en cas de risque d’hypercapnie.</li>
<li>Paracétamol 1 g toutes les 4 à 8 heures, au maximum 4 g par jour (2 g en cas d’atteinte hépatique) ; ibuprofène au maximum 2 400 mg par jour, contre-indiqué si clairance inférieure à 30 mL/min.</li>
<li>Lidocaïne 1 % : plafond retenu de 3 mg/kg, sans dépasser 250 mg, dans le cadre suisse de 400 mg.</li>
<li>Talc calibré pour la symphyse chimique, avec analgésie anticipée ; patch sanguin dans le secondaire avec fuite persistante.</li>
<li>Protoxyde d’azote contre-indiqué.</li>
</ul></template>
