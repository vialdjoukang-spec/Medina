
<!-- ===== FENÊTRES J93 : notions cliniques ===== -->
<template data-pop="j93-ppl" data-title="Pression pleurale négative">
<div class="lab">Définition</div><p>La pression pleurale est la pression qui règne dans la fine lame liquide entre les deux plèvres. En fin d’expiration calme, elle vaut en moyenne environ −0,5 kPa (−5 cm d’eau), c’est-à-dire qu’elle est inférieure à la pression atmosphérique.</p>
<div class="lab">Mécanisme</div><p>Le poumon tend à se rétracter grâce à ses fibres élastiques et à la tension de surface alvéolaire. La cage thoracique tend à s’expandre. Ces deux forces opposées, transmises par les plèvres, créent la dépression pleurale qui maintient le poumon déplissé.</p>
<div class="lab">Conséquence pratique</div><p>Toute communication entre la plèvre et l’air, à travers le poumon ou la paroi, annule cette dépression : l’air entre et le poumon se rétracte. C’est aussi pourquoi un drain doit être relié à un système qui laisse sortir l’air sans le laisser rentrer.</p>
<div class="lab">Piège</div><p>La pression n’est pas uniforme : en position debout, elle est plus négative à l’apex qu’à la base. Ce gradient explique la localisation apicale de la plupart des lésions.</p></template>

<template data-pop="j93-bleb" data-title="Blebs et bulles sous-pleurales">
<div class="lab">Définitions</div><p>Un bleb est une petite collection d’air dans l’épaisseur de la plèvre viscérale, en général de moins de 1 à 2 cm. Une bulle est un espace aérien de plus de 1 à 2 cm formé dans le parenchyme par destruction des cloisons alvéolaires. La BTS 2023 précise que les deux termes sont souvent employés l’un pour l’autre.</p>
<div class="lab">Mécanisme de formation</div><p>L’inflammation des petites voies aériennes, favorisée par le tabac, et la distension des alvéoles apicales, plus forte en raison du gradient de pression pleurale, sont les mécanismes proposés. Leur poids respectif n’est pas établi.</p>
<div class="lab">Valeur et limites</div><p>Les blebs sont fréquents chez les patients opérés pour un pneumothorax primaire. Leur rupture n’explique pas tous les cas : l’ERS 2015 décrit aussi une porosité diffuse de la plèvre viscérale.</p>
<div class="lab">Conséquence pratique</div><p>La chirurgie de prévention associe la résection des bulles visibles à une symphyse pleurale, afin de traiter aussi les zones de fuite invisibles.</p></template>

<template data-pop="j93-psp-ssp" data-title="Pneumothorax spontané primaire et secondaire">
<div class="lab">Critères</div><p>Le pneumothorax est <b>secondaire</b> lorsqu’il survient sur une maladie pulmonaire établie (BPCO, mucoviscidose, pneumocystose, maladie kystique, fibrose, cancer) ou chez un patient de 50 ans et plus ayant un tabagisme important. Il est <b>primaire</b> dans les autres cas, en l’absence de traumatisme ou d’acte médical (BTS 2023).</p>
<div class="lab">Pourquoi la distinction compte</div><p>Le patient atteint de pneumothorax secondaire a peu de réserve respiratoire : il est hospitalisé, le drain reste le geste de première intention et le dispositif ambulatoire est déconseillé. Le pneumothorax primaire permet la surveillance ambulatoire, l’exsufflation ou le dispositif ambulatoire.</p>
<div class="lab">Piège</div><p>« Primaire » ne signifie pas « poumon normal » : la plupart de ces patients ont des modifications de type emphysémateux à la TDM. Le terme désigne un groupe pronostique et thérapeutique.</p>
<div class="lab">Exemple</div><p>Un fumeur de 58 ans à 45 paquets-années sans spirométrie connue est traité comme un pneumothorax secondaire, même s’il n’a jamais reçu le diagnostic de BPCO.</p></template>

<template data-pop="j93-tension" data-title="Pneumothorax sous tension">
<div class="lab">Définition</div><p>C’est un pneumothorax dans lequel la pression intrapleurale devient positive par un effet de valve : l’air entre à chaque inspiration et ne ressort pas. Il se code J93.0 lorsqu’il est spontané.</p>
<div class="lab">Mécanisme</div><p>Le médiastin est refoulé vers le côté opposé. Le poumon controlatéral est comprimé, ce qui aggrave l’hypoxémie. Les veines caves s’écrasent ou se coudent : le retour veineux et le débit cardiaque chutent.</p>
<div class="lab">Évolution</div><p>Chez le patient en respiration spontanée, la détresse respiratoire et l’hypoxémie dominent et l’hypotension peut être tardive. Chez le patient ventilé, la pression positive accélère l’effondrement hémodynamique.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic est clinique et le traitement précède l’imagerie (déclaration clinique BTS 2023) : décompression, puis drain. La BTS 2023 recommande un avis chirurgical dès le premier épisode de tension.</p></template>

<template data-pop="j93-signes-tension" data-title="Signes du pneumothorax sous tension">
<div class="lab">Signes à rechercher</div><p>Le médecin recherche la détresse respiratoire, l’agitation ou la confusion, la tachycardie, l’hypotension, la turgescence jugulaire, la désaturation qui ne répond pas à l’oxygène, l’hémithorax distendu et immobile, et chez le patient ventilé la hausse brutale des pressions d’insufflation.</p>
<div class="lab">Valeur</div><p>Aucun signe isolé n’est suffisant ni constant. L’association d’un pneumothorax suspecté et d’une instabilité respiratoire ou hémodynamique suffit à décider la décompression.</p>
<div class="lab">Piège</div><p>La déviation de la trachée est tardive et souvent absente. La turgescence jugulaire peut manquer chez le patient hypovolémique, par exemple après un traumatisme hémorragique.</p></template>

<template data-pop="j93-taille" data-title="Mesure de la taille d’un pneumothorax">
<div class="lab">Mesure actuelle</div><p>La BTS 2023 considère qu’un pneumothorax est de taille suffisante pour un geste sûr s’il mesure en général 2 cm ou plus latéralement ou à l’apex sur la radiographie, ou s’il est accessible sans danger sur une TDM.</p>
<div class="lab">Méthodes historiques</div><p>La BTS 2010 mesurait la distance latérale au hile : 2 cm correspondaient à environ 50 % du volume de l’hémithorax. L’American College of Chest Physicians (2001) mesurait la distance entre l’apex et la coupole : 3 cm définissaient un grand pneumothorax. Les formules de Collins et de Light estiment un pourcentage.</p>
<div class="lab">Valeur et limites</div><p>Les méthodes donnent des résultats différents pour un même cliché. La radiographie de face, image en deux dimensions, sous-estime un volume en trois dimensions.</p>
<div class="lab">Conséquence pratique</div><p>Depuis 2023, la taille n’indique plus un geste. Elle dit seulement si un geste choisi pour d’autres raisons peut être fait sans danger.</p></template>

<template data-pop="j93-conserv" data-title="Surveillance sans geste (traitement conservateur)">
<div class="lab">Principe</div><p>La plupart des brèches se ferment spontanément par un dépôt de fibrine. Une fois la fuite arrêtée, l’air se résorbe lentement. La surveillance évite les complications d’un geste.</p>
<div class="lab">Indications</div><p>Pneumothorax primaire peu ou pas symptomatique, sans caractéristique à haut risque, quelle que soit sa taille (BTS 2023, recommandation conditionnelle par consensus ; ERS/EACTS/ESTS 2024, recommandation conditionnelle). Dans le pneumothorax secondaire, la surveillance se fait à l’hôpital.</p>
<div class="lab">Preuves</div><p>Dans l’essai de Brown (New England Journal of Medicine 2020, 316 patients de 14 à 50 ans), la réexpansion à 8 semaines a été obtenue chez 94,4 % des patients surveillés contre 98,5 % des patients traités par un geste ; 84,6 % des patients surveillés n’ont eu aucun geste et les récidives ont été moins fréquentes. Le résultat principal n’était pas robuste lorsque les données manquantes étaient comptées comme des échecs.</p>
<div class="lab">Mode d’emploi</div><p>Le patient reçoit des consignes écrites de retour immédiat, un contrôle en consultation tous les 2 à 4 jours, puis un contrôle à 2 à 4 semaines. Un pneumothorax qui augmente ou des symptômes qui s’aggravent conduisent à un drain.</p>
<div class="lab">Limite</div><p>La résolution est lente : un patient qui doit prendre l’avion prochainement peut préférer un geste.</p></template>

<template data-pop="j93-familial" data-title="Pneumothorax familial">
<div class="lab">Définition</div><p>Le pneumothorax est dit familial lorsqu’un apparenté du patient a eu un pneumothorax. Environ 10 % des cas de certaines séries ont une histoire familiale (BTS 2023).</p>
<div class="lab">Causes</div><p>Les causes principales sont le syndrome de Birt-Hogg-Dubé (gène FLCN), sclérose tubéreuse avec lymphangioléiomyomatose (TSC1, TSC2), syndrome de Marfan (FBN1), syndrome d’Ehlers-Danlos vasculaire (COL3A1).</p>
<div class="lab">Conduite</div><p>La TDM fait toujours partie du bilan, et un avis spécialisé est recommandé (BTS 2023). Le diagnostic du syndrome de Birt-Hogg-Dubé déclenche une surveillance rénale du patient et le conseil génétique des apparentés.</p>
<div class="lab">Indices</div><p>Des kystes pulmonaires basaux, des papules blanchâtres du visage et du cou, et des antécédents familiaux de cancer du rein orientent vers le syndrome de Birt-Hogg-Dubé.</p></template>

<template data-pop="j93-lam" data-title="Lymphangioléiomyomatose">
<div class="lab">Définition</div><p>La lymphangioléiomyomatose est une maladie rare de la femme, caractérisée par la prolifération de cellules musculaires lisses anormales le long des voies lymphatiques et des bronchioles, qui produit des kystes pulmonaires diffus à paroi fine.</p>
<div class="lab">Contexte</div><p>Elle est sporadique ou associée à la sclérose tubéreuse (gènes TSC1 et TSC2), dont les mutations activent la voie mTOR.</p>
<div class="lab">Lien avec le pneumothorax</div><p>La rupture des kystes sous-pleuraux provoque des pneumothorax récidivants. Un pneumothorax chez une femme jeune non fumeuse avec des kystes diffus à la TDM doit faire évoquer ce diagnostic.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic conduit à un centre spécialisé, car il existe un traitement ciblé de la voie mTOR et un suivi de la fonction respiratoire.</p></template>

<template data-pop="j93-catam" data-title="Pneumothorax cataménial">
<div class="lab">Définition</div><p>Le pneumothorax cataménial survient dans les 72 heures qui précèdent ou suivent les règles, habituellement à droite, chez une femme ayant le plus souvent une endométriose pelvienne (BTS 2023).</p>
<div class="lab">Fréquence</div><p>Sa fréquence réelle est inconnue ; jusqu’à 25 % des femmes opérées pour un pneumothorax récidivant en sont atteintes, ce qui suggère un sous-diagnostic.</p>
<div class="lab">Mécanismes proposés</div><p>L’air pourrait passer de l’abdomen vers le thorax par des perforations du diaphragme, ou des implants d’endomètre pourraient éroder la plèvre viscérale. Aucune théorie n’explique tous les cas.</p>
<div class="lab">Conduite</div><p>La prise en charge est multidisciplinaire : thoracoscopie avec traitement du diaphragme et des implants, puis traitement hormonal mettant les ovaires au repos. L’endométriose thoracique se code en complément sous N80.8.</p>
<div class="lab">Piège</div><p>Interroger systématiquement une femme qui récidive sur la date des règles : le diagnostic est manqué si la question n’est pas posée.</p></template>

<template data-pop="j93-atcd-poumon" data-title="Maladie pulmonaire connue">
<div class="lab">Pourquoi la rechercher</div><p>Une maladie pulmonaire établie fait passer le pneumothorax dans la catégorie secondaire. Le lieu de soins, le geste et la prévention changent.</p>
<div class="lab">Questions utiles</div><p>Le patient a-t-il une BPCO, un asthme sévère, une mucoviscidose, une fibrose, une infection par le VIH, une tuberculose ancienne ou un cancer ? Combien de paquets-années a-t-il fumés ? A-t-il déjà eu une spirométrie ?</p>
<div class="lab">Conséquence pratique</div><p>Un patient atteint de BPCO est hospitalisé même s’il est peu symptomatique, et l’oxygène est titré sur une cible de 88 à 92 % s’il est exposé à l’hypercapnie.</p></template>

<template data-pop="j93-douleur" data-title="Douleur thoracique pleurale">
<div class="lab">Caractéristiques</div><p>La douleur est brutale, homolatérale, latérale ou sous-claviculaire, et augmentée par l’inspiration profonde et la toux. Elle survient le plus souvent au repos.</p>
<div class="lab">Mécanisme</div><p>La plèvre pariétale costale est innervée par les nerfs intercostaux. Son étirement brutal et son irritation par l’air produisent une douleur bien localisée. La plèvre viscérale est insensible.</p>
<div class="lab">Évolution</div><p>La douleur diminue souvent en quelques heures, même si le pneumothorax persiste. Un patient peut donc consulter plusieurs jours plus tard.</p>
<div class="lab">Piège</div><p>Une douleur rétrosternale constrictive ou irradiant au bras évoque d’abord un syndrome coronarien. Un ECG et une troponine sont alors nécessaires, car les deux affections peuvent coexister chez un fumeur.</p></template>

<template data-pop="j93-mv" data-title="Murmure vésiculaire diminué ou aboli">
<div class="lab">Technique</div><p>Le médecin ausculte de façon symétrique, de l’apex à la base, en avant, latéralement et en arrière, en comparant à chaque niveau les deux côtés pendant une respiration ample par la bouche.</p>
<div class="lab">Mécanisme</div><p>Le poumon rétracté ventile moins, et la couche d’air pleural transmet mal les sons respiratoires vers la paroi.</p>
<div class="lab">Valeur</div><p>C’est le signe d’examen le plus utile, mais il manque dans les petits pneumothorax. Il ne quantifie pas la taille.</p>
<div class="lab">Piège</div><p>Chez le patient emphysémateux, le murmure est diminué des deux côtés : l’asymétrie disparaît. Une intubation sélective abolit aussi le murmure d’un côté.</p></template>

<template data-pop="j93-percu" data-title="Percussion tympanique">
<div class="lab">Technique</div><p>Le médecin percute de façon comparative les espaces intercostaux, en appliquant le majeur d’une main à plat et en le frappant avec le majeur de l’autre main.</p>
<div class="lab">Mécanisme</div><p>Une couche d’air libre entre poumon et paroi augmente la sonorité : le son devient plus clair et plus prolongé que du côté sain.</p>
<div class="lab">Valeur et piège</div><p>Le signe confirme l’orientation donnée par l’auscultation. Il perd sa valeur dans l’emphysème, où l’hypersonorité est bilatérale, et dans le bruit des urgences.</p></template>

<template data-pop="j93-o2" data-title="Oxygène à haut débit">
<div class="lab">Mécanisme</div><p>L’oxygène à forte concentration élimine l’azote du sang. La somme des pressions partielles du sang veineux baisse, et l’air pleural, surtout composé d’azote, diffuse plus vite vers le sang.</p>
<div class="lab">Mode d’emploi</div><p>Chez le patient hospitalisé en observation, la pratique britannique résumée à partir de la BTS administre 15 L/min au masque à réservoir. Chez le patient exposé à l’hypercapnie, la cible de SpO₂ est de 88 à 92 % (recommandation de la BTS sur l’oxygénothérapie d’urgence, 2017).</p>
<div class="lab">Preuves et limites</div><p>Une étude de 1971 sur 10 patients a rapporté une résorption environ quatre fois plus rapide sous oxygène. Les preuves chez l’humain sont anciennes et faibles ; des données animales vont dans le même sens.</p>
<div class="lab">Piège</div><p>Chez le patient atteint de BPCO hypercapnique, l’oxygène à haut débit peut aggraver l’hypercapnie : la gazométrie contrôle la PaCO₂.</p></template>
