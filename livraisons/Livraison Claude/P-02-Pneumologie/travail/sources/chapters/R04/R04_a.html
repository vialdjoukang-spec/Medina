<section class="ilot" id="r04-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>M. L., 64 ans, retraité de l’horlogerie, arrive aux urgences de Neuchâtel à 22 heures. Depuis 18 heures, il a craché à quatre reprises du sang rouge vif et mousseux, mêlé de toux ; son épouse estime le total à un demi-gobelet, puis à un gobelet plein. Il a fumé 35 paquets-années et a arrêté il y a dix ans. Il a été traité en 1988 pour une tuberculose pulmonaire du lobe supérieur droit. Une fibrillation auriculaire est traitée par acénocoumarol depuis trois ans.</p>
<p>La fréquence cardiaque est de 112/min, la pression artérielle de 128/74 mmHg, la fréquence respiratoire de 26/min et la SpO₂ de 89 % à l’air ambiant. Des crépitants sont audibles au sommet droit. Pendant l’examen, il tousse et remplit un haricot de 80 mL de sang. L’INR revient à 3,4 et l’hémoglobine à 118 g/L.</p>
<p>Le cas pose six questions qui structurent le cours. <b>Le sang vient-il bien des voies respiratoires inférieures ? L’hémoptysie menace-t-elle la vie ? De quel côté saigne-t-il, et comment protéger l’autre poumon ? Faut-il corriger l’anticoagulation, et comment ? Quel examen localise la source ? Quelle cause faut-il rechercher et traiter ?</b></p>
<p>À la fin du cours, le médecin assistant distingue une hémoptysie d’une hématémèse et d’un saignement nasal ou pharyngé dégluti puis recraché. Il reconnaît une hémoptysie menaçante à ses conséquences respiratoires et hémodynamiques, et non au seul volume. Il place le patient sur le côté qui saigne, prépare l’intubation, corrige l’hémostase et organise une angio-TDM puis une embolisation des artères bronchiques. Il traite une épistaxis par compression et sait quand appeler l’ORL. Il code correctement chaque saignement dans la catégorie R04.</p>
<div class="key"><b>Message fondateur.</b> Une hémoptysie tue par <b>asphyxie</b> bien plus souvent que par choc hémorragique : le sang remplit les voies aériennes, dont le volume mort anatomique est d’environ 150 mL chez l’adulte. Dans <b>90 %</b> des cas, la source est une artère bronchique, à pression systémique (Ittrich 2017 ; CIRSE 2022). Ces deux faits expliquent la conduite : protéger le poumon sain, puis tarir l’artère bronchique par embolisation.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="r04-dualcirc">double circulation pulmonaire (artères pulmonaires et bronchiques)</button>, l’<button class="w" data-k="r04-asphyxie">asphyxie par inondation des voies aériennes</button> et la définition de l’<button class="w" data-k="r04-def-massive">hémoptysie menaçante</button>. L’onglet Sciences fondamentales développe ces notions.</div>
</section>

<section class="ilot" id="r04-1"><h2><span class="n">1</span>Définitions, gravité et codage</h2>
<p>L’<b>hémoptysie</b> est l’émission par la bouche, au cours d’un effort de toux, de sang provenant des voies respiratoires sous-glottiques : trachée, bronches ou parenchyme pulmonaire. L’<b>épistaxis</b> est un saignement des fosses nasales. Le saignement de la gorge provient du pharynx ou du larynx sus-glottique. Le sang d’origine nasale, pharyngée ou digestive peut être expectoré et simuler une hémoptysie : c’est la <button class="w" data-k="r04-pseudo">pseudo-hémoptysie (sang d’origine extrarespiratoire basse)</button>.</p>
<h3>1.1 Gravité de l’hémoptysie</h3>
<p>Aucun seuil de volume ne fait consensus. Les seuils publiés de l’hémoptysie « massive » vont de 100 à 1000 mL par 24 heures, et la plupart se situent entre 300 et 600 mL (Ittrich 2017). Le volume est en outre mal estimé par le patient, et il ne dit rien de la réserve respiratoire. Les sources récentes définissent donc la gravité par ses conséquences. Le tableau suivant présente la classification opérationnelle retenue dans ce cours.</p>
<table class="t"><tr><th>Catégorie</th><th>Critère</th><th>Conséquence pratique</th></tr>
<tr><td>Crachats striés de sang</td><td>Filets de sang mêlés à l’expectoration</td><td>Bilan étiologique ambulatoire si l’état est stable</td></tr>
<tr><td>Hémoptysie non menaçante</td><td>Sang pur, sans détresse respiratoire ni instabilité, volume inférieur à 100 mL par 24 heures</td><td>Hospitalisation selon la cause, le terrain et le traitement anticoagulant</td></tr>
<tr><td><b>Hémoptysie menaçante</b></td><td>Volume supérieur à 100 mL par 24 heures, <b>ou</b> insuffisance respiratoire, <b>ou</b> instabilité hémodynamique (CIRSE 2022)</td><td>Urgence vitale : protection des voies aériennes, angio-TDM, embolisation</td></tr></table>
<p>La lecture commence par la colonne « Critère » et s’arrête au premier « ou » rempli. M. L. a craché environ 300 mL en 4 heures et il est hypoxémique : son hémoptysie est menaçante sur deux critères. Un volume de 50 mL peut suffire chez un patient dont le VEMS vaut 0,8 L, car il n’a pas la réserve pour tolérer l’inondation d’un lobe (Kathuria 2020). Le choix de cette définition et les autres seuils publiés figurent dans la fenêtre <button class="w" data-k="r04-def-massive">définitions de l’hémoptysie menaçante</button>.</p>
<div class="trap"><span class="k">Piège</span>Rassurer un patient parce qu’il « n’a craché qu’un verre ». Le volume rapporté est souvent sous-estimé, une partie du sang reste dans les bronches ou est dégluti, et la gravité dépend de la fonction respiratoire de base. La SpO₂, la fréquence respiratoire et la fréquence cardiaque décident.</div>
<h3>1.2 Codage CIM-10-GM 2024</h3>
<p>La catégorie R04 appartient au chapitre des symptômes. Elle se code lorsque la cause n’est pas établie ou lorsque le saignement lui-même motive la prise en charge. Dès que la cause est connue, son code passe en premier, et R04 peut rester en code complémentaire pour décrire l’événement. Le tableau suivant reproduit la structure de la catégorie dans la version 2024 du BfArM.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Inclusions et exclusions</th></tr>
<tr><td>R04.0</td><td>Épistaxis</td><td>Saignement de nez, hémorragie nasale</td></tr>
<tr><td>R04.1</td><td>Hémorragie de la gorge</td><td>Exclut l’hémoptysie (R04.2)</td></tr>
<tr><td>R04.2</td><td>Hémoptysie</td><td>Expectoration sanglante, toux avec hémorragie</td></tr>
<tr><td>R04.8</td><td>Hémorragie d’autres parties des voies respiratoires</td><td>Hémorragie pulmonaire sans autre précision ; exclut l’hémorragie pulmonaire périnatale (P26)</td></tr>
<tr><td>R04.9</td><td>Hémorragie des voies respiratoires, sans précision</td><td>Site non précisé</td></tr></table>
<p>La colonne de droite évite deux erreurs fréquentes. Une hémoptysie ne se code pas R04.1 au motif que le patient « crache du sang par la gorge ». Une hémorragie alvéolaire diffuse dont la cause reste inconnue relève de R04.8 ; dès qu’une vascularite est prouvée, le code de la maladie s’impose. Chez M. L., le code initial est R04.2 ; il sera complété par le code de la cause, par exemple J47 pour des bronchectasies.</p>
<div class="key"><b>À retenir.</b> L’hémoptysie vient des voies sous-glottiques et sort par un effort de toux. Sa gravité se juge sur les conséquences respiratoires et hémodynamiques, ou sur un volume supérieur à 100 mL par 24 heures. R04 code un symptôme ; le code de la cause le complète dès qu’elle est établie. La partie suivante montre que la fréquence des causes et le pronostic dépendent beaucoup du terrain.</div>
</section>

<section class="ilot" id="r04-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Aucune donnée épidémiologique suisse publiée sur l’hémoptysie n’a été retrouvée lors de la recherche du 8 octobre 2026. La meilleure source européenne est la base nationale d’hospitalisation française de 2008 à 2012. Elle compte environ 15 000 adultes hospitalisés chaque année pour une hémoptysie ou avec une hémoptysie, soit 0,2 % des patients hospitalisés. L’âge moyen est de 62 ans et le rapport hommes-femmes de 2 pour 1 (Abdulmalak, Eur Respir J 2015).</p>
<p>Dans cette cohorte, la mortalité atteint 9,2 % pendant le premier séjour, 21,6 % à un an et 27 % à trois ans. Ces chiffres reflètent surtout la gravité des maladies causales, notamment le cancer, plus que le saignement lui-même. La récidive survient chez 16,3 % des patients en trois ans. Parmi les patients dont l’hémoptysie initiale restait <button class="w" data-k="r04-crypto">cryptogénique (sans cause retrouvée)</button>, 4 % reçoivent un diagnostic de cancer bronchique dans les trois ans.</p>
<h3>2.1 Facteurs de mortalité hospitalière</h3>
<p>Une cohorte de 1087 patients admis en réanimation pour hémoptysie a identifié six facteurs indépendants de mortalité hospitalière (Fartoukh, Respiration 2012). Ils forment le <button class="w" data-k="r04-fartoukh">score de Fartoukh</button>, présenté dans le tableau suivant.</p>
<table class="t"><tr><th>Facteur à l’admission</th><th>Points</th></tr>
<tr><td>Alcoolisme chronique</td><td>1</td></tr>
<tr><td>Atteinte d’une artère pulmonaire comme source</td><td>1</td></tr>
<tr><td>Opacités dans au moins deux quadrants à la radiographie</td><td>1</td></tr>
<tr><td>Cancer</td><td>2</td></tr>
<tr><td>Aspergillose</td><td>2</td></tr>
<tr><td>Ventilation mécanique à l’admission</td><td>2</td></tr></table>
<p>La mortalité prédite passe de 1 % pour un score de 0 à 16 % pour 3 points, 58 % pour 5 points et 91 % pour 7 points. Le score décrit une association statistique dans une population de réanimation française : il aide à situer le pronostic, mais il ne dicte pas un geste. Chez M. L., aucun facteur n’est encore établi à l’admission ; une opacité étendue à la radiographie ajouterait un point.</p>
<div class="key"><b>À retenir.</b> L’hémoptysie hospitalisée touche surtout l’homme de plus de 60 ans. Elle reste sans cause chez environ un patient sur deux, et elle annonce une mortalité élevée liée aux maladies sous-jacentes. Le cancer, l’aspergillose et la ventilation mécanique sont les facteurs pronostiques les plus lourds. La partie suivante explique pourquoi la source est artérielle systémique et pourquoi l’asphyxie domine.</div>
</section>

<section class="ilot" id="r04-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le poumon reçoit deux circulations. Leur différence de pression explique d’où vient le sang, pourquoi il coule fort et pourquoi l’embolisation porte sur les artères bronchiques.</p>
<h3>3.1 État normal : deux circulations</h3>
<p>La <b>circulation pulmonaire</b> reçoit tout le débit cardiaque du ventricule droit sous basse pression ; la pression artérielle pulmonaire moyenne normale est de l’ordre de 15 mmHg. Elle assure les échanges gazeux. La <b>circulation bronchique</b> naît de l’aorte et reçoit une faible part du débit cardiaque, environ 1 %, sous pression systémique. Elle nourrit la paroi des bronches, la plèvre viscérale, les ganglions et les vaisseaux eux-mêmes. Voir la fenêtre <button class="w" data-k="r04-dualcirc">double circulation pulmonaire</button>.</p>
<h3>3.2 Première charnière : la néovascularisation bronchique</h3>
<p>Une inflammation chronique de la paroi bronchique, comme dans les bronchectasies, les séquelles de tuberculose, l’aspergillome ou un cancer, libère des facteurs de croissance vasculaire. Les artères bronchiques s’élargissent, deviennent tortueuses et développent des anastomoses avec les artères pulmonaires. Une artère bronchique de plus de 2 mm de diamètre est considérée comme pathologique (Ittrich 2017). Ces vaisseaux fragiles, soumis à la pression aortique, saignent dans la lumière bronchique à la moindre érosion de la muqueuse. Les artères systémiques non bronchiques, intercostales ou phréniques par exemple, peuvent participer, surtout lorsque la plèvre est épaissie de plus de 3 mm (CIRSE 2022).</p>
<h3>3.3 Deuxième charnière : la source</h3>
<p>Environ 90 % des hémoptysies proviennent des artères bronchiques, 5 % des artères pulmonaires et 5 % d’artères systémiques non bronchiques (Ittrich 2017). L’origine pulmonaire se rencontre lorsqu’une lésion destructrice érode une branche de l’artère pulmonaire : <button class="w" data-k="r04-rasmussen">anévrisme de Rasmussen</button> dans une caverne tuberculeuse, nécrose tumorale, rupture par un cathéter de l’artère pulmonaire. Elle explique une partie des échecs de l’embolisation bronchique.</p>
<h3>3.4 Troisième charnière : l’inondation des voies aériennes</h3>
<p>Le sang qui pénètre dans une bronche descend par gravité vers les segments déclives et peut passer dans le poumon controlatéral. Il remplit les alvéoles, qui ne ventilent plus mais restent perfusées : c’est un shunt, qui produit une hypoxémie peu corrigée par l’oxygène. Le sang coagule dans les bronches et forme des caillots qui obstruent les voies proximales. Le volume des voies de conduction étant d’environ 150 mL, un saignement de quelques centaines de millilitres peut asphyxier le patient bien avant de provoquer un choc (Davidson 2020). Voir la fenêtre <button class="w" data-k="r04-asphyxie">asphyxie par inondation</button>.</p>
<h3>3.5 Quatrième charnière : l’arrêt spontané</h3>
<p>La plupart des hémoptysies de faible volume s’arrêtent spontanément : environ 90 % se tarissent sans geste (Ittrich 2017). La contraction du vaisseau, l’agrégation plaquettaire et la formation de fibrine ferment la brèche. La plasmine, issue de l’activation du plasminogène, dissout ensuite ce caillot. L’<button class="w" data-k="r04-txa">acide tranexamique</button> bloque cette fibrinolyse ; c’est son mécanisme dans l’hémoptysie et l’épistaxis.</p>

<section class="ilot" id="r04-4"><h2><span class="n">4</span>Étiologies</h2>
<p>La recherche de la cause répond à deux questions : quelle lésion saigne, et faut-il la traiter en plus de l’hémostase ? Le tableau suivant donne la fréquence des causes chez l’adulte hospitalisé en France (Abdulmalak 2015). La fréquence d’une cause dépend du pays et du recrutement : la tuberculose domine dans les pays de forte incidence, ce qui n’est pas le cas de la Suisse.</p>
<table class="t"><tr><th>Cause</th><th>Fréquence</th><th>Mécanisme du saignement</th><th>Cours de référence</th></tr>
<tr><td>Cryptogénique</td><td>50 %</td><td>Aucune lésion identifiée après bilan</td><td>§12 de ce cours</td></tr>
<tr><td>Infections respiratoires</td><td>22 %</td><td>Hyperhémie et érosion de la muqueuse bronchique</td><td>J18, J40</td></tr>
<tr><td>Cancer bronchique</td><td>17,4 %</td><td>Néovaisseaux tumoraux, nécrose, invasion vasculaire</td><td>C34</td></tr>
<tr><td>Bronchectasies</td><td>6,8 %</td><td>Artères bronchiques hypertrophiques</td><td>J47</td></tr>
<tr><td>Œdème pulmonaire</td><td>4,2 %</td><td>Rupture capillaire par pression veineuse élevée</td><td>I50</td></tr>
<tr><td>Anticoagulants</td><td>3,5 %</td><td>Défaut d’hémostase révélant souvent une lésion</td><td>§13 de ce cours</td></tr>
<tr><td>Tuberculose</td><td>2,7 %</td><td>Caverne, anévrisme de Rasmussen, séquelles</td><td>A15</td></tr>
<tr><td>Embolie pulmonaire</td><td>2,6 %</td><td>Infarctus pulmonaire hémorragique</td><td>I26</td></tr>
<tr><td>Aspergillose</td><td>1,1 %</td><td>Aspergillome dans une cavité, néovaisseaux pariétaux</td><td>B44</td></tr></table>
<p>La lecture commence par la première ligne : une hémoptysie sur deux reste sans cause après le bilan, ce qui impose un suivi. La deuxième question porte sur le cancer, car c’est la cause dont le retard diagnostique coûte le plus. Pour M. L., trois causes sont plausibles et se cumulent : des bronchectasies post-tuberculeuses, un aspergillome dans une ancienne caverne et un cancer chez un ancien fumeur. L’anticoagulant ne crée pas la lésion : il fait saigner une lésion existante, qu’il faut chercher.</p>
<h3>4.1 Causes moins fréquentes à ne pas manquer</h3>
<p>Plusieurs causes rares changent la conduite. L’<button class="w" data-k="r04-dah">hémorragie alvéolaire diffuse</button> se manifeste par une anémie, des opacités bilatérales et une hypoxémie ; l’hémoptysie manque chez un tiers des patients (Lara, Chest 2010). Les vascularites associées aux ANCA et le syndrome de Goodpasture en sont les causes principales. La sténose mitrale fait saigner par hypertension veineuse pulmonaire. Une <button class="w" data-k="r04-hht">malformation artérioveineuse pulmonaire</button>, souvent liée à la maladie de Rendu-Osler, saigne à basse pression mais expose à l’embolie paradoxale. Les causes iatrogènes comprennent la biopsie pulmonaire, la bronchoscopie et le cathéter de l’artère pulmonaire. Chez l’enfant, la mucoviscidose et le corps étranger bronchique sont les causes principales.</p>
<div class="trap"><span class="k">Piège</span>Attribuer une hémoptysie à l’anticoagulant et s’arrêter là. L’hémorragie sous anticoagulant révèle souvent une lésion sous-jacente, notamment un cancer ; le bilan étiologique complet reste nécessaire, même si l’INR est trop élevé.</div>
<div class="key"><b>À retenir.</b> Les infections, le cancer, les bronchectasies, la tuberculose, l’aspergillose et l’embolie pulmonaire sont les causes principales ; la moitié des hémoptysies reste cryptogénique. L’hémorragie alvéolaire diffuse, la sténose mitrale et les malformations artérioveineuses sont rares mais changent le traitement. La partie suivante montre comment l’interrogatoire confirme d’abord l’origine respiratoire.</div>
</section>

<section class="ilot" id="r04-5"><h2><span class="n">5</span>Anamnèse : d’où vient le sang ?</h2>
<p>La première question n’est pas la cause, mais l’origine anatomique. Une hématémèse traitée comme une hémoptysie expose à une angio-TDM inutile et retarde une endoscopie digestive. Le tableau suivant oppose les trois origines possibles d’un sang rejeté par la bouche.</p>
<table class="t"><tr><th>Élément</th><th>Hémoptysie</th><th>Hématémèse</th><th>Saignement nasal ou pharyngé</th></tr>
<tr><td>Mode d’émission</td><td>Effort de toux</td><td>Vomissement, nausées</td><td>Raclement, écoulement par le nez ou dans la gorge</td></tr>
<tr><td>Aspect</td><td>Rouge vif, mousseux, mêlé à l’expectoration</td><td>Rouge sombre ou marc de café, avec débris alimentaires</td><td>Rouge, souvent avec saignement narinaire associé</td></tr>
<tr><td>Contexte</td><td>Maladie respiratoire, tabac, toux</td><td>Ulcère, cirrhose, prise d’AINS, alcool</td><td>Trouble de la coagulation, geste ORL récent</td></tr>
<tr><td>Signes associés</td><td>Dyspnée, douleur thoracique, crachats sanglants les jours suivants</td><td>Méléna, douleur épigastrique</td><td>Sang visible dans le nez ou le pharynx à l’examen</td></tr></table>
<p>La première ligne suffit souvent : le sang de l’hémoptysie sort avec la toux. Un patient qui avale du sang d’une épistaxis postérieure peut ensuite le vomir, et un patient qui saigne des bronches peut avaler son sang puis présenter un méléna. Le mélange de signes impose donc d’examiner le nez et le pharynx et, au moindre doute, de discuter une endoscopie digestive haute. La fenêtre <button class="w" data-k="r04-pseudo">pseudo-hémoptysie</button> détaille ces situations.</p>
<h3>5.1 Questions qui orientent la cause et la gravité</h3>
<p>Le médecin quantifie le saignement à l’aide d’un récipient gradué ou d’un objet de référence, et note la durée et le nombre d’épisodes. Il recherche une maladie pulmonaire connue, un tabagisme, une perte de poids ou une toux modifiée, qui évoquent un cancer. Il demande les antécédents de tuberculose, de séjour en pays de forte incidence et de contact infectieux. Il recherche une douleur thoracique brutale et une asymétrie des mollets, qui évoquent une embolie pulmonaire. Il interroge sur les anticoagulants, les antiagrégants et la cocaïne inhalée. Il demande des épistaxis répétées dans la famille, qui évoquent la maladie de Rendu-Osler, et une hématurie, qui évoque un syndrome pneumo-rénal.</p>
<div class="key"><b>À retenir.</b> L’interrogatoire confirme d’abord que le sang sort avec la toux. Il quantifie le volume et précise le traitement antithrombotique. Il cherche ensuite les indices de cancer, de tuberculose, d’embolie, de vascularite et de malformation vasculaire. L’examen clinique complète cette orientation et mesure le retentissement.</div>
</section>

<section class="ilot" id="r04-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen répond à trois questions : le patient est-il menacé, d’où vient le sang, et quelle cause est visible ?</p>
<h3>6.1 Retentissement</h3>
<p>Chez l’adulte au repos, la fréquence respiratoire normale est de 12 à 20/min, la SpO₂ de 95 % ou plus à l’air et la fréquence cardiaque de 60 à 100/min. Une polypnée, une désaturation, un tirage ou une agitation traduisent l’inondation alvéolaire et imposent la conduite de l’hémoptysie menaçante. Une tachycardie et une hypotension traduisent une perte sanguine importante ou une hypoxémie sévère. La pâleur et l’hémoglobine renseignent sur les pertes cumulées, mais l’hémoglobine baisse en retard sur la perte réelle.</p>
<h3>6.2 Origine et latéralisation</h3>
<p>L’examen inspecte d’abord le nez et l’oropharynx à la lampe : un saignement visible du septum nasal ou de la paroi pharyngée oriente vers une pseudo-hémoptysie. L’auscultation pulmonaire normale est symétrique, avec un murmure vésiculaire régulier. Des crépitants localisés, des râles humides ou une diminution du murmure orientent vers le côté qui saigne. Cette latéralisation clinique reste peu fiable, car le sang aspiré se répartit dans les deux poumons ; elle oriente la position du patient en attendant l’imagerie.</p>
<h3>6.3 Indices étiologiques</h3>
<p>Un hippocratisme digital évoque un cancer bronchique, des bronchectasies ou une mucoviscidose. Un roulement diastolique au foyer mitral évoque une sténose mitrale. Des télangiectasies des lèvres, de la langue et des doigts évoquent la maladie de Rendu-Osler. Un purpura vasculaire, une rhinite croûteuse ou une hématurie évoquent une vascularite. Une grosse jambe unilatérale évoque une thrombose veineuse profonde et donc une embolie pulmonaire.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Conclure à une hémoptysie sans avoir regardé le nez et la gorge. Une épistaxis postérieure peut couler dans le pharynx sans saignement narinaire visible et être recrachée avec la toux.</div>
<div class="key"><b>À retenir.</b> Les signes vitaux mesurent la menace ; l’inspection du nez et de la gorge exclut une pseudo-hémoptysie ; l’auscultation oriente seulement le côté. L’hippocratisme, un souffle mitral, des télangiectasies ou un purpura orientent la cause. La démarche diagnostique choisit ensuite entre angio-TDM et bronchoscopie selon la stabilité du patient.</div>
