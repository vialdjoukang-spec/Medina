
<!-- ===== FENÊTRES : traitements de support ===== -->
<template data-pop="j96-cible" data-title="Cibles de saturation : recommandation retenue et arbitrage">
<div class="lab">Recommandation retenue</div><p>Guideline de la British Thoracic Society pour l’oxygène chez l’adulte en situation aiguë (O’Driscoll, Thorax, juin 2017, élaborée avec 22 sociétés et collèges). Cible de 94–98 % chez la plupart des patients ; 88–92 % chez les patients à risque d’insuffisance hypercapnique. Le texte intégral est publié en accès libre par Thorax (doi:10.1136/thoraxjnl-2016-209729).</p>
<div class="lab">Autre texte en vigueur</div><p>La Thoracic Society of Australia and New Zealand (2015) propose une cible de 92–96 % chez la plupart des patients et la même cible de 88–92 % en cas de risque d’hypercapnie. Les deux textes concordent sur le principe : éviter l’hypoxémie comme l’hyperoxie.</p>
<div class="lab">Arbitrage</div><p>La BTS 2017 est la source primaire applicable la plus récente pour l’adulte en situation aiguë ; aucune version ultérieure n’a été identifiée au 08.10.2026. Elle est retenue. La borne haute plus basse du texte australien est compatible avec la pratique suisse, qui vise rarement plus de 96 % hors situation particulière.</p>
<div class="lab">Niveau de preuve et limites</div><p>La cible de 88–92 % repose sur un essai randomisé préhospitalier (Austin, British Medical Journal 2010) et sur des études physiologiques. Les cibles générales reposent surtout sur des méta-analyses observationnelles et l’avis d’experts. Les patients de soins intensifs ventilés relèvent de protocoles propres.</p></template>
<template data-pop="j96-venturi" data-title="Dispositifs d’oxygénothérapie">
<div class="lab">Lunettes nasales</div><p>Confortables, elles permettent de parler et de manger. La FiO₂ délivrée dépend du débit et de la ventilation du patient ; au-delà de 4 à 6 L/min, elles sont mal tolérées.</p>
<div class="lab">Masque Venturi</div><p>Un jet d’oxygène traverse un orifice calibré et entraîne une quantité fixe d’air ambiant. La FiO₂ reste stable même si le patient respire vite, car le débit total dépasse sa demande. Chaque valve porte sa FiO₂ (24 %, 28 %, 35 %, 40 %, 60 %) et le débit d’oxygène minimal à régler.</p>
<div class="lab">Masque simple</div><p>Débit de 5 à 10 L/min. En dessous de 5 L/min, le CO₂ expiré stagne dans le masque et peut être réinhalé.</p>
<div class="lab">Masque à réservoir</div><p>Débit de 15 L/min, réservoir gonflé avant la pose. Il délivre la plus forte FiO₂ des dispositifs conventionnels et sert à la détresse vitale, avant une évaluation et un dispositif mieux adapté.</p></template>
<template data-pop="j96-hyperox" data-title="Méfaits de l’hyperoxie">
<div class="lab">Données</div><p>La méta-analyse IOTA (Chu, Lancet 2018), portant sur des essais chez l’adulte en situation aiguë, a associé une stratégie d’oxygène libérale à une mortalité hospitalière plus élevée qu’une stratégie conservatrice. Dans l’infarctus du myocarde avec SpO₂ ≥ 90 %, l’essai DETO2X-AMI (2017) n’a montré aucun bénéfice de l’oxygène.</p>
<div class="lab">Mécanismes discutés</div><p>Vasoconstriction coronaire et cérébrale, production d’espèces réactives de l’oxygène, atélectasies de résorption, hypercapnie chez les patients à risque, et retard de détection d’une aggravation masquée par une saturation élevée.</p>
<div class="lab">Conséquence pratique</div><p>Ne pas donner d’oxygène à un patient non hypoxémique ; réduire le débit dès que la SpO₂ dépasse la cible.</p></template>
<template data-pop="j96-hfn" data-title="Oxygénothérapie nasale à haut débit">
<div class="lab">Principe</div><p>Un mélangeur air-oxygène et un humidificateur chauffant délivrent jusqu’à 60 L/min par de larges canules nasales, avec une FiO₂ réglée de 0,21 à 1,0.</p>
<div class="lab">Effets physiologiques</div><p>FiO₂ fiable, car le débit dépasse la demande inspiratoire ; lavage de l’espace mort nasopharyngé, qui améliore l’élimination du CO₂ ; pression positive expiratoire modeste, qui augmente avec le débit et diminue si la bouche est ouverte ; humidification qui facilite l’expectoration.</p>
<div class="lab">Réglage habituel</div><p>Débit initial élevé (souvent 50 à 60 L/min), puis FiO₂ ajustée pour la cible de SpO₂. Le sevrage réduit d’abord la FiO₂, puis le débit.</p>
<div class="lab">Recommandations ERS 2022 (toutes conditionnelles)</div><p>Haut débit plutôt qu’oxygène conventionnel ou ventilation non invasive dans l’insuffisance hypoxémique aiguë ; pendant les pauses de la ventilation non invasive ; après extubation chez le patient à faible risque d’échec. Ventilation non invasive d’abord chez le patient BPCO hypercapnique.</p></template>
<template data-pop="j96-florali" data-title="Essai FLORALI (New England Journal of Medicine 2015)">
<div class="lab">Population</div><p>310 patients en insuffisance respiratoire hypoxémique aiguë non hypercapnique, avec un rapport PaO₂/FiO₂ ≤ 300 mmHg.</p>
<div class="lab">Comparaison</div><p>Haut débit nasal, oxygène standard au masque ou ventilation non invasive.</p>
<div class="lab">Résultat</div><p>Taux d’intubation à 28 jours : 38 %, 47 % et 50 %, sans différence significative. Mortalité à 90 jours plus élevée sous oxygène standard (rapport de risque 2,01) et sous ventilation non invasive (2,50) que sous haut débit.</p>
<div class="lab">Portée</div><p>Critère principal négatif ; le bénéfice sur la mortalité est un critère secondaire. L’essai a néanmoins orienté les recommandations ERS 2022 et ESICM 2023 vers le haut débit dans l’hypoxémie aiguë.</p></template>
<template data-pop="j96-rox" data-title="Index ROX">
<div class="lab">Calcul</div><p>(SpO₂ / FiO₂) / fréquence respiratoire. Exemple : SpO₂ 92 %, FiO₂ 0,6, fréquence 30 par minute : (92/0,6)/30 ≈ 5,1.</p>
<div class="lab">Interprétation</div><p>Dans l’étude de validation de Roca (American Journal of Respiratory and Critical Care Medicine 2019), une valeur ≥ 4,88 à 2, 6 ou 12 heures de haut débit était associée à un moindre risque d’intubation ; des valeurs basses (inférieures à 2,85 à 2 heures, 3,47 à 6 heures, 3,85 à 12 heures) prédisaient l’échec.</p>
<div class="lab">Limites</div><p>Validé surtout dans la pneumonie ; il aide la décision, sans remplacer l’examen clinique. Aide pédagogique, non critère officiel.</p></template>
<template data-pop="j96-vni" data-title="Ventilation non invasive : réglages et surveillance">
<div class="lab">Principe</div><p>Le ventilateur délivre une pression inspiratoire élevée et une pression expiratoire plus basse, par un masque bucco-nasal en première intention. La différence entre les deux, l’aide inspiratoire, augmente le volume courant et diminue le travail des muscles.</p>
<div class="lab">Réglages initiaux (British Thoracic Society et Intensive Care Society, 2016)</div><p>Pression inspiratoire de départ d’environ 15 cmH₂O, augmentée progressivement vers 20 à 30 cmH₂O en 10 à 30 minutes selon la tolérance et le volume courant ; pression expiratoire d’environ 3 à 5 cmH₂O, davantage en cas d’obésité ou d’apnées obstructives ; fréquence de sécurité. Oxygène ajouté pour la cible de 88–92 %.</p>
<div class="lab">Surveillance</div><p>Gazométrie une heure après le début et après chaque changement ; fréquence respiratoire, conscience, fuites, synchronisation, peau du nez. Ventiler le plus longtemps possible pendant les premières 24 heures, puis réduire selon l’amélioration.</p>
<div class="lab">Preuves</div><p>ERS/ATS 2017 : recommandation forte dans l’exacerbation de BPCO avec pH ≤ 7,35 ; elle diminue l’intubation et la mortalité.</p></template>
<template data-pop="j96-cpap" data-title="Pression positive dans l’œdème pulmonaire cardiogénique">
<div class="lab">Mécanisme</div><p>La pression positive rouvre les alvéoles inondées, réduit le shunt et le travail respiratoire. Elle diminue aussi le retour veineux et la postcharge du ventricule gauche, en réduisant la pression transmurale.</p>
<div class="lab">Preuves</div><p>ERS/ATS 2017 : recommandation forte pour la pression positive continue ou la ventilation à deux niveaux. L’essai britannique de Gray (New England Journal of Medicine 2008) a montré une amélioration plus rapide de la dyspnée et de l’acidose, sans différence de mortalité à sept jours.</p>
<div class="lab">Pratique</div><p>Pression positive continue de l’ordre de 5 à 10 cmH₂O, associée aux diurétiques et aux vasodilatateurs ; voir <a href="#/entry/I50">I50 — Insuffisance cardiaque (C-01-Cardiologie)</a>.</p></template>
<template data-pop="j96-vni-ci" data-title="Contre-indications de la ventilation non invasive">
<div class="lab">Absolues</div><p>Arrêt respiratoire ou cardiaque, impossibilité d’appliquer un masque (traumatisme ou chirurgie faciale), obstruction fixe des voies aériennes supérieures, vomissements incoercibles.</p>
<div class="lab">Relatives</div><p>Instabilité hémodynamique, troubles de conscience sans lien avec l’hypercapnie, sécrétions abondantes non évacuables, pneumothorax non drainé, chirurgie œsophagienne ou gastrique haute récente, hémorragie digestive haute, agitation non contrôlée.</p>
<div class="lab">Nuance</div><p>Une somnolence due à l’hypercapnie n’est pas une contre-indication absolue : en unité expérimentée, un essai court sous surveillance étroite peut réveiller le patient en une à deux heures. Sans amélioration rapide, l’intubation s’impose.</p></template>
<template data-pop="j96-oxld" data-title="Oxygénothérapie de longue durée : indications et preuves">
<div class="lab">Indications (BPCO stable, traitement optimal)</div><p>PaO₂ au repos en air ambiant ≤ 7,3 kPa (55 mmHg), ou ≤ 8,0 kPa (60 mmHg) avec signes d’hypertension pulmonaire ou hématocrite ≥ 55 % (Revue médicale suisse 2023, reprenant les critères internationaux). Deux mesures en état stable, au moins trois semaines après une exacerbation.</p>
<div class="lab">Preuves</div><p>NOTT (Annals of Internal Medicine 1980) : l’oxygène continu a réduit la mortalité par rapport à l’oxygène nocturne seul. Essai du Medical Research Council britannique (Lancet 1981) : l’oxygène au moins 15 heures par jour a amélioré la survie par rapport à l’absence d’oxygène. La guideline ATS 2020 recommande fortement l’oxygène de longue durée dans l’hypoxémie sévère de repos de la BPCO et des pneumopathies interstitielles.</p>
<div class="lab">Prescription</div><p>Au moins 15 heures par jour, sommeil inclus ; débit titré pour une saturation au repos ≥ 90 %, souvent augmenté pendant l’effort et le sommeil. Sources : concentrateur fixe, concentrateur portable, oxygène liquide, bouteilles. En Suisse, la LiMA encadre le remboursement, et la Ligue pulmonaire fournit et suit la plupart des installations.</p>
<div class="lab">Limites</div><p>Aucune preuve de survie hors BPCO ; les autres indications (pneumopathies interstitielles, insuffisance cardiaque, mucoviscidose) sont extrapolées.</p></template>
<template data-pop="j96-lott" data-title="Essai LOTT (New England Journal of Medicine 2016)">
<div class="lab">Population</div><p>738 patients BPCO stables avec désaturation modérée au repos (SpO₂ 89 à 93 %) ou à l’effort, suivis un à six ans dans 42 centres américains.</p>
<div class="lab">Résultat</div><p>Aucune différence pour le délai jusqu’au décès ou à la première hospitalisation (rapport de risque 0,94), ni pour les exacerbations, la qualité de vie ou la distance de marche.</p>
<div class="lab">Conséquence</div><p>L’oxygène de longue durée n’est pas indiqué dans l’hypoxémie modérée ; il reste réservé à l’hypoxémie sévère de repos.</p></template>
<template data-pop="j96-vnid" data-title="Ventilation non invasive à domicile">
<div class="lab">BPCO</div><p>La guideline ERS 2019 suggère la ventilation à domicile chez le patient BPCO hypercapnique stable et après une exacerbation ayant nécessité une ventilation aiguë, avec des réglages visant à abaisser la PaCO₂ et une aide inspiratoire fixe comme mode de première intention. Dans l’essai de Köhnlein (Lancet Respiratory Medicine 2014), chez des patients stables avec PaCO₂ ≥ 7 kPa, la mortalité à un an a été de 12 % sous ventilation contre 33 % sans ventilation.</p>
<div class="lab">Syndrome obésité-hypoventilation</div><p>Pression positive continue si des apnées sévères coexistent, sinon ventilation à deux niveaux (ATS 2019).</p>
<div class="lab">Maladies neuromusculaires et paroi</div><p>Ventilation proposée devant des symptômes d’hypoventilation avec hypercapnie diurne ou nocturne, ou une capacité vitale très abaissée. Dans la sclérose latérale amyotrophique, l’essai de Bourke (Lancet Neurology 2006) a montré un allongement de la survie et de la qualité de vie chez les patients sans atteinte bulbaire sévère.</p>
<div class="lab">Organisation en Suisse</div><p>L’indication est posée par un centre spécialisé ; la Ligue pulmonaire assure le plus souvent la fourniture, l’entretien et le suivi des appareils. L’observance se lit dans la mémoire du ventilateur.</p></template>
