
<!-- ===== FENÊTRES R06 : examens complémentaires ===== -->
<template data-pop="r06-np" data-title="Peptides natriurétiques (BNP et NT-proBNP) devant une dyspnée">
<div class="lab">Origine</div><p>Les cardiomyocytes ventriculaires sécrètent le pro-BNP lorsque leur paroi est étirée. Il est clivé en BNP, actif, et en NT-proBNP, inactif et plus stable.</p>
<div class="lab">Seuils d’exclusion (ESC 2021)</div><p>En situation aiguë, un NT-proBNP inférieur à 300 pg/mL ou un BNP inférieur à 100 pg/mL rend une insuffisance cardiaque improbable. En situation chronique, les seuils sont un NT-proBNP inférieur à 125 pg/mL ou un BNP inférieur à 35 pg/mL. Les recommandations ESC 2026 sur l’insuffisance cardiaque, publiées le 28 août 2026, n’ont pas été lues en texte intégral pour ce cours ; leurs seuils éventuels restent à confronter à ceux-ci.</p>
<div class="lab">Preuve</div><p>Dans l’essai bâlois de Mueller et ses collègues (2004), le dosage du BNP aux urgences chez 452 patients dyspnéiques a réduit les hospitalisations (75 % contre 85 %), les admissions en soins intensifs (15 % contre 24 %) et la durée de séjour (8 contre 11 jours), sans effet démontré sur la mortalité à 30 jours.</p>
<div class="lab">Pièges</div><p>Les peptides s’élèvent avec l’âge, l’insuffisance rénale, la fibrillation auriculaire, l’embolie pulmonaire et le sepsis ; ils sont plus bas chez l’obèse et dans l’œdème pulmonaire « flash » vu très tôt. Un résultat élevé ne prouve pas que le cœur explique toute la dyspnée.</p></template>

<template data-pop="r06-echo" data-title="Échographie pulmonaire au lit du patient">
<div class="lab">Ce qu’elle montre</div><p>Le glissement pleural (mouvement de la plèvre viscérale contre la plèvre pariétale), les lignes A (réverbérations horizontales d’un poumon aéré), les lignes B (artefacts verticaux issus de septa épaissis par l’œdème ou la fibrose), les condensations et les épanchements.</p>
<div class="lab">Interprétation</div><p>Au moins trois lignes B par espace intercostal dans au moins deux zones de chaque côté : syndrome interstitiel bilatéral, compatible avec un œdème pulmonaire cardiogénique. Abolition du glissement avec point poumon : pneumothorax. Image hypoéchogène avec bronchogramme aérien : condensation.</p>
<div class="lab">Valeur</div><p>Elle est rapide, sans irradiation, et souvent plus sensible que la radiographie pour l’œdème, l’épanchement et le pneumothorax.</p>
<div class="lab">Pièges</div><p>La fibrose et le syndrome de détresse respiratoire aiguë donnent aussi des lignes B. L’examen dépend de l’opérateur, et une échographie pulmonaire normale n’exclut pas une embolie.</p></template>

<template data-pop="r06-gaz" data-title="Gazométrie artérielle devant une dyspnée">
<div class="lab">Valeurs normales</div><p>Adulte jeune, air ambiant, niveau de la mer : pH 7,35 à 7,45 ; PaCO₂ 35 à 45 mmHg (4,7 à 6,0 kPa) ; PaO₂ 80 à 100 mmHg (10,7 à 13,3 kPa) ; bicarbonates 22 à 26 mmol/L.</p>
<div class="lab">Lecture en quatre temps</div><p>Le médecin lit d’abord le pH (acidose ou alcalose), puis la PaCO₂ (cause respiratoire ou compensation), puis les bicarbonates (cause métabolique ou compensation), et calcule enfin le gradient alvéolo-artériel.</p>
<div class="lab">Exemples</div><p>pH 7,52, PaCO₂ 27 mmHg : alcalose respiratoire aiguë. pH 7,28, PaCO₂ 62 mmHg, bicarbonates 28 mmol/L : acidose respiratoire aiguë sur hypercapnie chronique partiellement compensée. pH 7,18, PaCO₂ 22 mmHg, bicarbonates 8 mmol/L : acidose métabolique avec compensation respiratoire, qui explique une respiration de Kussmaul.</p>
<div class="lab">Pièges</div><p>Une PaCO₂ « normale » chez un patient très tachypnéique signale l’épuisement. Le prélèvement artériel est douloureux ; une gazométrie veineuse suffit souvent pour le pH et la PaCO₂ lorsque l’oxygénation est suivie par l’oxymètre.</p></template>

<template data-pop="r06-rx" data-title="Radiographie thoracique devant une dyspnée">
<div class="lab">Indication</div><p>Dyspnée aiguë inexpliquée, suspicion de pneumonie, de pneumothorax, d’épanchement ou d’œdème ; bilan initial d’une dyspnée chronique.</p>
<div class="lab">Lecture systématique</div><p>Le médecin vérifie la qualité (inspiration, rotation), puis examine les voies aériennes, les poumons, la plèvre, le cœur et le médiastin, le diaphragme et les os.</p>
<div class="lab">Images principales</div><p>Œdème : redistribution vasculaire, lignes de Kerley, opacités périhilaires, épanchements bilatéraux. Pneumonie : condensation avec bronchogramme. Pneumothorax : ligne pleurale sans trame au-delà. Distension : diaphragmes aplatis.</p>
<div class="lab">Limite</div><p>Elle est souvent normale dans l’embolie pulmonaire, l’asthme, l’anémie, l’acidose et l’hyperventilation. Ce résultat normal oriente la suite de la démarche.</p></template>

<template data-pop="r06-hb" data-title="Hémoglobine et ferritine">
<div class="lab">Seuils</div><p>Selon l’Organisation mondiale de la santé, une anémie se définit chez l’adulte par une hémoglobine inférieure à 130 g/L chez l’homme et à 120 g/L chez la femme non enceinte. Une ferritine inférieure à environ 30 µg/L signe habituellement une carence martiale.</p>
<div class="lab">Pourquoi l’anémie essouffle</div><p>Chaque gramme d’hémoglobine transporte environ 1,34 mL d’oxygène. Une baisse de moitié de l’hémoglobine réduit de moitié le contenu artériel en oxygène, alors que la saturation reste normale.</p>
<div class="lab">Pièges</div><p>La ferritine s’élève dans l’inflammation et peut masquer une carence. Une anémie modérée explique rarement à elle seule une dyspnée importante ; elle aggrave souvent une cardiopathie ou une maladie pulmonaire associée.</p></template>

<template data-pop="r06-dlco" data-title="Capacité de diffusion du monoxyde de carbone (DLCO)">
<div class="lab">Principe</div><p>Le patient inhale une faible concentration de monoxyde de carbone et retient sa respiration environ 10 secondes. La quantité absorbée par le sang mesure la capacité de transfert des alvéoles vers les capillaires.</p>
<div class="lab">Valeurs</div><p>Le résultat est comparé à la limite inférieure de la normale et corrigé selon l’hémoglobine.</p>
<div class="lab">Baisse</div><p>Emphysème, pneumopathies interstitielles, maladies vasculaires pulmonaires (embolie chronique, hypertension pulmonaire), anémie, perte de volume pulmonaire.</p>
<div class="lab">Hausse</div><p>Hémorragie alvéolaire, polyglobulie, parfois asthme et obésité.</p>
<div class="lab">Intérêt dans la dyspnée</div><p>Une DLCO basse isolée, avec spirométrie et radiographie normales, oriente vers une maladie vasculaire pulmonaire ou une maladie interstitielle débutante et justifie une échocardiographie et une TDM.</p></template>

<template data-pop="r06-pletys" data-title="Pléthysmographie : volumes pulmonaires">
<div class="lab">Principe</div><p>Le patient respire dans une cabine fermée. Les variations de pression dans la cabine pendant des efforts contre un obturateur permettent de calculer le volume de gaz thoracique, puis la capacité pulmonaire totale et le volume résiduel.</p>
<div class="lab">Interprétation</div><p>Une capacité pulmonaire totale inférieure à la limite inférieure de la normale définit la restriction. Un volume résiduel élevé définit la distension et le piégeage de l’air.</p>
<div class="lab">Intérêt</div><p>Une CVF basse à la spirométrie peut traduire une restriction ou un piégeage de l’air ; seule la mesure de la capacité pulmonaire totale tranche.</p>
<div class="lab">Exemple</div><p>Un patient obèse a une CVF à 70 % de la valeur prédite ; sa capacité pulmonaire totale normale exclut une restriction parenchymateuse.</p></template>

<template data-pop="r06-cpet" data-title="Épreuve d’effort cardiorespiratoire">
<div class="lab">Principe</div><p>Le patient pédale ou marche avec une charge croissante, pendant que l’appareil mesure la consommation d’oxygène (VO₂), la production de dioxyde de carbone, la ventilation, la fréquence cardiaque, l’électrocardiogramme et la saturation.</p>
<div class="lab">Paramètres utiles</div><p>VO₂ maximale (capacité aérobie), seuil anaérobie, réserve ventilatoire (part de la ventilation maximale non utilisée à l’effort maximal), pente VE/VCO₂ (efficacité ventilatoire), réserve de fréquence cardiaque, désaturation.</p>
<div class="lab">Profils</div><p>Limitation cardiaque : VO₂ basse, seuil anaérobie précoce, réserve ventilatoire conservée. Limitation ventilatoire : réserve ventilatoire épuisée. Maladie vasculaire pulmonaire : pente VE/VCO₂ élevée et désaturation. Déconditionnement : VO₂ basse avec seuil anaérobie précoce, sans anomalie cardiaque ni ventilatoire. Respiration dysfonctionnelle : ventilation irrégulière et hypocapnie d’effort.</p>
<div class="lab">Place</div><p>C’est l’examen de référence lorsque la dyspnée chronique reste inexpliquée après le bilan de première et de deuxième ligne, ou lorsque plusieurs causes coexistent.</p></template>

<template data-pop="r06-dv" data-title="Courbe débit-volume et obstacles des grosses voies aériennes">
<div class="lab">Courbe normale</div><p>La boucle expiratoire monte rapidement vers le débit de pointe puis descend en ligne presque droite. La boucle inspiratoire forme un arc arrondi.</p>
<div class="lab">Obstacle extrathoracique variable</div><p>Paralysie des cordes vocales, obstruction laryngée inductible, trachéomalacie cervicale : la boucle inspiratoire est aplatie en plateau, l’expiratoire reste normale.</p>
<div class="lab">Obstacle intrathoracique variable</div><p>Tumeur de la trachée basse, trachéomalacie intrathoracique : la boucle expiratoire est aplatie, l’inspiratoire reste normale.</p>
<div class="lab">Obstacle fixe</div><p>Sténose trachéale après intubation, goitre circonférentiel : les deux boucles sont aplaties.</p>
<div class="lab">Piège</div><p>Beaucoup d’appareils n’impriment que la boucle expiratoire ; il faut demander la boucle inspiratoire forcée lorsqu’un obstacle haut est suspecté. Le VEMS peut rester normal tant que l’obstacle est modéré.</p></template>

<template data-pop="r06-laryngo" data-title="Nasofibroscopie (laryngoscopie flexible)">
<div class="lab">Principe</div><p>Un endoscope souple passé par le nez visualise le pharynx, le larynx et la mobilité des cordes vocales chez un patient éveillé.</p>
<div class="lab">Indications</div><p>Stridor, voix modifiée persistante, suspicion de paralysie récurrentielle, d’œdème, de tumeur ou d’obstruction laryngée inductible ; dans ce dernier cas, l’examen se fait parfois pendant un effort.</p>
<div class="lab">Statut</div><p>C’est l’examen de référence du stridor, car il montre directement le siège et la nature de l’obstacle.</p>
<div class="lab">Précaution</div><p>Devant une suspicion d’épiglottite ou d’obstruction critique, l’examen se fait seulement dans un lieu où l’intubation difficile ou la trachéotomie sont immédiatement possibles.</p></template>

<template data-pop="r06-psg" data-title="Polygraphie ventilatoire et polysomnographie">
<div class="lab">Polygraphie</div><p>Elle enregistre le débit aérien nasal, les mouvements thoraciques et abdominaux, la saturation et la position ; elle peut se faire à domicile.</p>
<div class="lab">Polysomnographie</div><p>Elle ajoute l’électroencéphalogramme, l’électro-oculogramme et l’électromyogramme pour mesurer le sommeil et ses stades ; elle se fait en laboratoire.</p>
<div class="lab">Lecture</div><p>Une apnée est un arrêt du débit d’au moins 10 secondes. Elle est obstructive si l’effort respiratoire persiste, centrale s’il disparaît. L’index d’apnées-hypopnées compte les événements par heure de sommeil : 5 à 14 léger, 15 à 29 modéré, 30 ou plus sévère.</p>
<div class="lab">Respiration de Cheyne-Stokes</div><p>Elle se reconnaît à des apnées ou hypopnées centrales séparées par une ventilation en crescendo-decrescendo, avec un cycle d’au moins 40 secondes.</p></template>

<template data-pop="r06-capno" data-title="Capnographie">
<div class="lab">Principe</div><p>Un capteur mesure en continu le dioxyde de carbone dans l’air expiré. La valeur en fin d’expiration approche la PaCO₂ chez un sujet aux poumons sains ; elle se situe normalement entre 35 et 45 mmHg.</p>
<div class="lab">Usages</div><p>Documenter une hypocapnie pendant une crise d’hyperventilation, surveiller une hypoventilation sous sédation, confirmer la position d’une sonde d’intubation et suivre la qualité d’une réanimation.</p>
<div class="lab">Limite</div><p>Lorsque l’espace mort augmente (BPCO, embolie), la valeur expirée sous-estime la PaCO₂ ; la gazométrie reste la référence.</p></template>
