
<!-- ===== FENÊTRES R06 : pharmacologie, contentieux et Pareto ===== -->
<template data-pop="r06-contentieux" data-title="Opioïdes contre la dyspnée chronique : sources en conflit">
<div class="lab">Question</div><p>Faut-il prescrire un opioïde à faible dose à un patient dont la dyspnée chronique persiste malgré le traitement optimal de la cause ?</p>
<div class="lab">Source la plus récente retenue : ERS 2024</div><p>La recommandation de l’European Respiratory Society sur la prise en charge des symptômes des adultes atteints d’une maladie respiratoire grave (European Respiratory Journal 2024 ; 63 : 2400335) suggère de <b>ne pas utiliser d’opioïdes</b> pour traiter la dyspnée. Il s’agit d’une recommandation conditionnelle, fondée sur une certitude très faible. La même recommandation suggère l’entraînement physique progressif (certitude faible), les services multicomposants, le ventilateur à main et les techniques respiratoires (certitude très faible). Elle laisse l’oxygène supplémentaire au choix (certitude faible). Sa population comprend surtout la BPCO, les pneumopathies interstitielles et d’autres maladies respiratoires chroniques graves.</p>
<div class="lab">Essai qui a pesé : BEAMS 2022</div><p>Chez 156 patients atteints de BPCO au degré mMRC 3 ou 4, la morphine à libération prolongée à 8 ou 16 mg par jour n’a pas réduit l’intensité de la pire dyspnée après une semaine par rapport au placebo (différence moyenne de −0,3 point sur 10 pour chaque dose). Le nombre de pas quotidiens n’a pas augmenté.</p>
<div class="lab">Source plus ancienne, population différente : ESMO 2020</div><p>La recommandation de l’European Society for Medical Oncology pour la dyspnée du patient atteint de cancer retient la morphine orale régulière à faible dose comme premier traitement pharmacologique de la dyspnée chronique sévère (niveau II, grade B), à 10 à 30 mg par 24 heures chez le patient naïf d’opioïdes, et une augmentation de 25 à 50 % de la dose de fond chez le patient déjà traité par opioïdes (niveau V, grade C).</p>
<div class="lab">Texte suisse en vigueur : BIGORIO 2003</div><p>Les recommandations BIGORIO de la société suisse de soins palliatifs (palliative.ch) sur la dyspnée datent de 2003 ; aucune mise à jour spécifique n’a été trouvée sur le site le 08.10.2026. Le texte original, en allemand, est accessible sur palliative.ch. Il a été conçu pour la fin de vie et précède les essais récents.</p>
<div class="lab">Choix retenu pour ce cours</div><p>Dans une maladie respiratoire chronique non cancéreuse, le médecin ne débute pas d’opioïde de façon systématique ; il commence par les mesures non pharmacologiques. Chez un patient atteint de cancer avec une dyspnée chronique sévère, ou en fin de vie, une morphine orale à faible dose, titrée et réévaluée, reste une option fondée sur l’ESMO 2020. L’usage contre la dyspnée est hors indication en Suisse.</p>
<div class="lab">Limites</div><p>Les populations des deux recommandations ne se superposent pas ; l’ERS ne contredit donc pas l’ESMO pour le cancer avancé. La certitude des preuves reste faible dans les deux cas.</p></template>

<template data-pop="r06-d-o2" data-title="Oxygène">
<div class="lab">Mécanisme</div><p>L’oxygène augmente la fraction inspirée, donc la PAO₂ et la PaO₂. Il corrige l’hypoxémie due à l’hypoventilation, à l’inégalité ventilation-perfusion et au trouble de diffusion ; il corrige mal le shunt.</p>
<div class="lab">Prescription (BTS 2017)</div><p>Le médecin écrit une saturation cible : 94 à 98 % pour la plupart des patients, 88 à 92 % pour les patients à risque d’hypercapnie. Il choisit le dispositif selon le besoin : lunettes nasales à 1 à 6 L/min, masque de Venturi à fraction fixe, masque à haute concentration avec réservoir en cas d’hypoxémie sévère.</p>
<div class="lab">Effets indésirables</div><p>Chez un patient à risque, l’oxygène à haut débit peut élever la PaCO₂ par levée de la vasoconstriction hypoxique (aggravation de l’inégalité ventilation-perfusion) et par l’effet Haldane (moindre fixation du dioxyde de carbone par l’hémoglobine oxygénée). L’oxygène est aussi un comburant : il impose l’arrêt du tabac et l’éloignement des flammes.</p>
<div class="lab">À éviter</div><p>L’oxygène palliatif n’est pas recommandé chez le patient dont la saturation de repos est d’au moins 90 % (ESMO 2020) ; le ventilateur à main est une alternative.</p></template>

<template data-pop="r06-d-morph" data-title="Morphine orale à faible dose contre la dyspnée">
<div class="lab">Mécanisme</div><p>La morphine agit sur les récepteurs opioïdes mu du tronc cérébral et du système limbique. Elle diminue la commande ventilatoire, la réponse au dioxyde de carbone et la perception désagréable de la dyspnée.</p>
<div class="lab">Posologie (ESMO 2020, cancer)</div><p>Chez le patient naïf d’opioïdes, 10 à 30 mg par 24 heures de morphine orale, titrés selon le symptôme ; dose minimale chez le sujet âgé, fragile ou insuffisant rénal. Prophylaxie systématique de la constipation et antiémétique si besoin.</p>
<div class="lab">Preuves</div><p>Les données sont favorables dans le cancer avancé ; l’essai BEAMS (2022) n’a pas montré de bénéfice à 8 ou 16 mg par jour dans la BPCO.</p>
<div class="lab">Effets indésirables</div><p>Constipation, nausées, somnolence, confusion, chutes ; dépression respiratoire en cas de surdosage, d’insuffisance rénale ou d’association à une benzodiazépine.</p>
<div class="lab">Statut suisse</div><p>Les formes orales disponibles en Suisse sont enregistrées pour les douleurs fortes ; l’usage contre la dyspnée est hors indication.</p></template>

<template data-pop="r06-d-benzo" data-title="Benzodiazépines et dyspnée">
<div class="lab">Données</div><p>Les essais n’ont pas montré de bénéfice des benzodiazépines sur la dyspnée de la BPCO ou du cancer avancé. Elles réduisent l’anxiété, mais exposent à la sédation, à la confusion, aux chutes et à la dépression respiratoire.</p>
<div class="lab">Place (ESMO 2020)</div><p>Elles ne sont pas un traitement de première ligne. Elles peuvent être utilisées avec prudence chez le patient atteint de cancer dont la dyspnée s’accompagne d’anxiété et ne répond pas aux opioïdes, et pour la sédation palliative d’une dyspnée réfractaire dans les derniers jours de vie.</p>
<div class="lab">Piège</div><p>Une benzodiazépine prescrite pour une « crise d’angoisse » peut masquer une embolie ou un asthme grave et aggraver une hypercapnie.</p></template>

<template data-pop="r06-d-fan" data-title="Ventilateur à main dirigé vers le visage">
<div class="lab">Mécanisme</div><p>Le flux d’air frais stimule les récepteurs thermiques et mécaniques du territoire du nerf trijumeau sur le visage. Ces afférences modulent la perception centrale de la dyspnée.</p>
<div class="lab">Preuves</div><p>Un essai croisé randomisé publié en 2010 a montré une réduction de la dyspnée lorsque le ventilateur était dirigé vers le visage et non vers les jambes. L’ESMO 2020 recommande de le proposer (niveau II, grade B) et l’ERS 2024 le suggère.</p>
<div class="lab">Usage</div><p>Le patient le dirige vers le nez et la bouche pendant quelques minutes lors d’un épisode ou après un effort. Il est peu coûteux, sans effet indésirable, et donne au patient un moyen d’agir lui-même.</p></template>

<template data-pop="r06-d-rehab" data-title="Réhabilitation et entraînement physique">
<div class="lab">Principe</div><p>Un programme supervisé d’entraînement en endurance et en force, avec éducation et soutien, dure habituellement plusieurs semaines. En Suisse, des programmes de réhabilitation pulmonaire ambulatoires et hospitaliers sont reconnus par la Société suisse de pneumologie.</p>
<div class="lab">Mécanisme</div><p>L’entraînement améliore la capacité oxydative des muscles, retarde l’acidose lactique et diminue la ventilation nécessaire pour un effort donné ; la commande ventilatoire et la dyspnée baissent. L’éducation réduit la peur de la dyspnée.</p>
<div class="lab">Preuves</div><p>L’ERS 2024 suggère l’entraînement progressif dans les maladies respiratoires graves (certitude faible). La réhabilitation réduit la dyspnée et améliore la qualité de vie dans la BPCO (cours J44).</p>
<div class="lab">Piège</div><p>Le patient évite l’effort par peur de la dyspnée, ce qui entretient le déconditionnement. Le premier pas thérapeutique est souvent de l’encourager à s’essouffler de façon contrôlée.</p></template>

<template data-pop="r06-d-adre" data-title="Adrénaline dans l’anaphylaxie et l’œdème laryngé">
<div class="lab">Mécanisme</div><p>L’adrénaline stimule les récepteurs alpha-1 (vasoconstriction, réduction de l’œdème muqueux), bêta-1 (contractilité cardiaque) et bêta-2 (bronchodilatation, stabilisation des mastocytes).</p>
<div class="lab">Posologie</div><p>Par voie intramusculaire dans la face antérolatérale de la cuisse : 0,01 mg/kg de la solution à 1 mg/mL, au maximum 0,5 mg chez l’adulte, à répéter après 5 minutes en l’absence d’amélioration. Le protocole complet, y compris pédiatrique, figure dans le cours T78.</p>
<div class="lab">Voie nébulisée</div><p>Dans le croup modéré à sévère, l’adrénaline nébulisée réduit rapidement l’œdème sous-glottique ; son effet est transitoire et impose une surveillance après l’administration. La dose suit le protocole pédiatrique local.</p>
<div class="lab">Limite</div><p>L’angiœdème bradykinique répond mal à l’adrénaline. Le bolus intraveineux non dilué expose à des arythmies et à une ischémie.</p></template>

<template data-pop="r06-d-dexa" data-title="Dexaméthasone dans le croup">
<div class="lab">Mécanisme</div><p>Le glucocorticoïde réduit l’inflammation et la perméabilité capillaire de la muqueuse sous-glottique ; l’effet débute en quelques heures.</p>
<div class="lab">Preuves</div><p>La revue Cochrane de 2018 (43 essais, 4 565 enfants) montre que les glucocorticoïdes améliorent les symptômes à deux heures, réduisent de moitié environ les reconsultations ou réadmissions (risque relatif 0,52) et raccourcissent l’hospitalisation d’environ 15 heures.</p>
<div class="lab">Posologie</div><p>Une dose unique par voie orale ; les essais ont utilisé des doses de 0,15 à 0,6 mg/kg, et la revue Cochrane n’a pas établi la dose ni la voie optimales. Le protocole pédiatrique local fixe la dose.</p>
<div class="lab">Sécurité</div><p>Les effets indésirables graves sont rares avec une dose unique.</p></template>

<template data-pop="r06-d-baclo" data-title="Baclofène dans le hoquet persistant">
<div class="lab">Mécanisme</div><p>Agoniste des récepteurs GABA-B, le baclofène inhibe la transmission dans l’arc réflexe du hoquet, au niveau du tronc cérébral et de la moelle.</p>
<div class="lab">Preuves</div><p>Dans un essai randomisé en double aveugle chez 30 patients avec hoquet persistant après un accident vasculaire cérébral (Zhang 2014), 10 mg trois fois par jour pendant 5 jours ont fait cesser le hoquet plus souvent que le placebo (risque relatif 7,0). La revue de Steger et ses collègues (2015) le place en première ligne.</p>
<div class="lab">Statut suisse</div><p>Le baclofène est enregistré en Suisse pour la spasticité ; l’usage dans le hoquet est hors indication.</p>
<div class="lab">Précautions</div><p>Somnolence, vertiges, faiblesse musculaire ; accumulation et encéphalopathie en cas d’insuffisance rénale ; syndrome de sevrage à l’arrêt brutal après un usage prolongé.</p></template>

<template data-pop="r06-d-gaba" data-title="Gabapentine dans le hoquet persistant">
<div class="lab">Mécanisme</div><p>La gabapentine se lie à la sous-unité alpha-2-delta des canaux calciques et réduit la libération de neurotransmetteurs excitateurs, ce qui atténuerait l’activité de l’arc réflexe.</p>
<div class="lab">Preuves</div><p>Les données reposent sur des séries observationnelles et des études prospectives non contrôlées ; aucun essai randomisé n’a été trouvé.</p>
<div class="lab">Posologie</div><p>La dose utilisée dans le hoquet n’a pas été vérifiée dans une source primaire pour ce cours ; elle doit être adaptée à la fonction rénale, car la molécule est éliminée par le rein.</p>
<div class="lab">Précautions</div><p>Somnolence, vertiges ; dépression respiratoire en association avec les opioïdes ; usage hors indication en Suisse.</p></template>

<template data-pop="r06-d-meto" data-title="Métoclopramide dans le hoquet persistant">
<div class="lab">Mécanisme</div><p>Antagoniste des récepteurs dopaminergiques de type 2, il accélère la vidange gastrique et agit sur le centre du réflexe ; il est surtout logique lorsque la cause est digestive.</p>
<div class="lab">Preuves</div><p>Un petit essai randomisé contre placebo a montré un effet ; la revue de Steger et ses collègues (2015) le place en réserve.</p>
<div class="lab">Limites de l’information professionnelle suisse (Paspertin, gouttes)</div><p>Adulte : au plus 10 mg jusqu’à trois fois par jour, avec un intervalle d’au moins 6 heures, au maximum 30 mg ou 0,5 mg/kg par jour, pendant au plus 5 jours. Contre-indications : moins de 18 ans, hémorragie, occlusion ou perforation digestive, phéochromocytome, tumeur prolactinodépendante, dyskinésie tardive antérieure, épilepsie, troubles extrapyramidaux, méthémoglobinémie, association à la lévodopa ou aux agonistes dopaminergiques, grossesse et allaitement.</p>
<div class="lab">Statut</div><p>L’usage dans le hoquet est hors indication.</p></template>

<template data-pop="r06-d-chlorpro" data-title="Chlorpromazine dans le hoquet rebelle">
<div class="lab">Mécanisme</div><p>Neuroleptique phénothiazinique, antagoniste dopaminergique central.</p>
<div class="lab">Données</div><p>Seul médicament autorisé dans le hoquet aux États-Unis, il repose sur des données observationnelles. La revue de Steger et ses collègues (2015) le place en réserve en raison de ses effets indésirables.</p>
<div class="lab">Effets indésirables</div><p>Sédation, hypotension orthostatique, effets extrapyramidaux, allongement de l’intervalle QT, effets anticholinergiques ; risque accru chez le sujet âgé.</p>
<div class="lab">Statut suisse</div><p>Une spécialité de chlorpromazine figure dans les répertoires suisses, mais sa commercialisation actuelle n’a pas été confirmée pour ce cours.</p></template>

<template data-pop="r06-d-ticag" data-title="Ticagrélor et dyspnée">
<div class="lab">Fréquence</div><p>Dans l’essai PLATO (2009), une dyspnée a été rapportée chez environ 14 % des patients sous ticagrélor, contre environ 8 % sous clopidogrel.</p>
<div class="lab">Mécanisme</div><p>Le ticagrélor inhibe la recapture de l’adénosine ; l’adénosine stimule les fibres sensitives vagales pulmonaires. Le blocage des récepteurs P2Y12 de ces fibres pourrait aussi contribuer.</p>
<div class="lab">Caractéristiques</div><p>La dyspnée apparaît souvent dans les premières semaines, est souvent légère à modérée, sans hypoxémie, sans anomalie auscultatoire et sans altération de la fonction pulmonaire ; elle s’atténue fréquemment avec le temps.</p>
<div class="lab">Conduite</div><p>Le médecin exclut d’abord une insuffisance cardiaque, une ischémie, une anémie liée à un saignement et une embolie. Si la dyspnée est mal tolérée, un changement d’antiagrégant se discute avec le cardiologue, sans interruption de la double antiagrégation.</p></template>

<template data-pop="r06-d-iatro" data-title="Dyspnées médicamenteuses">
<div class="lab">Bronchospasme</div><p>Bêtabloquants non sélectifs et collyres bêtabloquants chez l’asthmatique ; aspirine et anti-inflammatoires non stéroïdiens chez le patient atteint de maladie respiratoire exacerbée par ces molécules.</p>
<div class="lab">Pneumopathie interstitielle</div><p>Amiodarone (dose cumulée et âge), méthotrexate (pneumopathie d’hypersensibilité aiguë), nitrofurantoïne (réaction aiguë ou fibrose chronique), bléomycine, inhibiteurs de points de contrôle immunitaire (pneumopathie immunologique).</p>
<div class="lab">Œdème pulmonaire</div><p>Rétention hydrosodée par anti-inflammatoires non stéroïdiens, glitazones, corticostéroïdes ; inotropes négatifs chez l’insuffisant cardiaque.</p>
<div class="lab">Hypoventilation</div><p>Opioïdes, benzodiazépines, gabapentinoïdes, alcool, surtout en association.</p>
<div class="lab">Conduite</div><p>Le médecin vérifie la chronologie, arrête le médicament suspect lorsque c’est possible et déclare l’effet indésirable grave ou inattendu à Swissmedic par le système de pharmacovigilance.</p></template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-r06-clin" data-title="Pareto — Définitions, mécanismes et clinique"><p class="ratio" data-cover="r06-0,r06-1,r06-2,r06-3,r06-4,r06-5,r06-6"></p><ul>
<li>La dyspnée est une sensation rapportée par le patient (ATS 2012) ; la tachypnée, l’hyperpnée et l’hyperventilation sont des signes ou des mesures.</li>
<li>Elle est aiguë en minutes à jours, chronique au-delà de quatre à huit semaines ; une dyspnée chronique aggravée se traite comme une dyspnée aiguë.</li>
<li>L’échelle mMRC mesure le handicap ; l’échelle de Borg mesure l’intensité instantanée.</li>
<li>Environ 12,5 % des adultes ont une dyspnée de degré mMRC au moins égal à 2 ; asthme, BPCO, pneumopathies interstitielles et cardiomyopathies expliquent deux tiers des dyspnées chroniques en consultation spécialisée.</li>
<li>La dyspnée naît d’une commande accrue ou d’un décalage entre commande et réponse : soif d’air, effort, oppression.</li>
<li>Le stridor localise un obstacle laryngé ou trachéal, le sifflement un obstacle bronchique ; tout ce qui siffle n’est pas de l’asthme.</li>
<li>Le mode de début, la position, la qualité et les symptômes associés orientent la cause ; on cherche toujours le facteur déclenchant.</li>
<li>Une saturation normale n’exclut ni l’embolie, ni l’acidose, ni l’anémie : la commande ventilatoire peut augmenter sans hypoxémie.</li>
<li>Une démarche fondée sur des examens objectifs trouve la cause d’une dyspnée chronique bien plus souvent que l’impression clinique (66 % dans l’étude de Pratter).</li>
<li>La fréquence respiratoire se compte ; la saturation se note avec la fraction d’oxygène ; aucun signe isolé ne suffit.</li></ul></template>

<template data-pop="pareto-r06-diag" data-title="Pareto — Urgences et démarches diagnostiques"><p class="ratio" data-cover="r06-7,r06-8,r06-9,r06-10,r06-11"></p><ul>
<li>Gravité d’abord, selon la séquence ABCDE : stridor de repos, parole impossible, somnolence, saturation inférieure à 92 % sans maladie chronique, hypotension, respiration paradoxale.</li>
<li>Devant un stridor, on ne couche pas le patient, on n’examine pas la gorge d’un enfant suspect d’épiglottite, on appelle l’équipe des voies aériennes.</li>
<li>Dyspnée aiguë : électrocardiogramme, échographie pulmonaire, peptides natriurétiques, gazométrie ; embolie par probabilité clinique puis D-dimères ou angioscanner.</li>
<li>Une auscultation normale chez un patient très dyspnéique fait rechercher embolie, acidose, anémie, intoxication au monoxyde de carbone avant l’angoisse.</li>
<li>Dyspnée chronique : formule sanguine, NT-proBNP, électrocardiogramme, radiographie, spirométrie ; puis échocardiographie, DLCO, pléthysmographie ; épreuve d’effort cardiorespiratoire si la cause reste inconnue.</li>
<li>Stridor inspiratoire : obstacle extrathoracique ; nasofibroscopie de référence. Cheyne-Stokes : insuffisance cardiaque ou accident vasculaire cérébral.</li>
<li>Hyperventilation : PaCO₂ inférieure à 35 mmHg ; diagnostic fonctionnel d’exclusion ; pas de sac en papier.</li>
<li>Hoquet persistant au-delà de 48 heures, rebelle au-delà d’un mois : recherche de cause le long de l’arc réflexe.</li></ul></template>

<template data-pop="pareto-r06-tt" data-title="Pareto — Prise en charge, situations particulières et critères"><p class="ratio" data-cover="r06-12,r06-13,r06-14,r06-15"></p><ul>
<li>Maintenir la vie, traiter la cause, puis soulager le symptôme résiduel.</li>
<li>Oxygène sur une cible écrite : 94 à 98 %, ou 88 à 92 % si risque d’hypercapnie ; pas d’oxygène chez le non hypoxémique.</li>
<li>Dyspnée chronique résiduelle : réhabilitation, ventilateur à main, techniques respiratoires ; opioïdes déconseillés par l’ERS 2024 dans les maladies respiratoires graves, option de l’ESMO 2020 dans le cancer.</li>
<li>Hoquet persistant : cause d’abord, puis baclofène, gabapentine, métoclopramide hors indication.</li>
<li>Grossesse : dyspnée physiologique fréquente, mais une dyspnée brutale fait rechercher une embolie ou une cardiomyopathie.</li>
<li>Nourrisson : événement bref résolu inexpliqué selon les critères de 2016 ; spasme du sanglot bénin, électrocardiogramme dans la forme pâle.</li>
<li>Obésité-hypoventilation : IMC d’au moins 30 et PaCO₂ d’au moins 45 mmHg ; altitude : descente et oxygène.</li>
<li>Paramètres clés : fréquence respiratoire, saturation, conscience, PaCO₂, NT-proBNP (seuils d’exclusion 300 et 125 pg/mL), échelles mMRC et Borg.</li></ul></template>

<template data-pop="pareto-r06-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="r06-e-1,r06-e-2,r06-e-3,r06-e-4,r06-e-5,r06-e-6,r06-e-7,r06-e-8"></p><ul>
<li>Chaque examen répond à une question ; la référence dépend de la question : épreuve d’effort cardiorespiratoire pour la dyspnée chronique inexpliquée, nasofibroscopie pour le stridor, polysomnographie pour les apnées.</li>
<li>Gazométrie : pH, PaCO₂, bicarbonates, puis gradient alvéolo-artériel ; PAO₂ = 150 − PaCO₂/0,8 au niveau de la mer en air ambiant.</li>
<li>Gradient normal : hypoventilation, acidose, hyperventilation fonctionnelle ; gradient élevé : cause pulmonaire ou vasculaire.</li>
<li>NT-proBNP inférieur à 300 pg/mL (aigu) ou à 125 pg/mL (chronique) : insuffisance cardiaque improbable.</li>
<li>Radiographie souvent normale dans l’embolie, l’asthme, l’anémie et l’acidose ; échographie pulmonaire rapide pour l’œdème, le pneumothorax et l’épanchement.</li>
<li>Courbe débit-volume : plateau inspiratoire pour un obstacle extrathoracique, expiratoire pour un obstacle intrathoracique, les deux pour un obstacle fixe.</li>
<li>DLCO basse isolée : maladie vasculaire pulmonaire ou interstitielle débutante.</li></ul></template>

<template data-pop="pareto-r06-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="r06-sa,r06-sh,r06-sp,r06-sn,r06-sb"></p><ul>
<li>Obstacle au-dessus de l’orifice supérieur du thorax : bruit inspiratoire ; au-dessous : bruit expiratoire ; sous-glottique ou fixe : biphasique.</li>
<li>La sous-glotte du nourrisson est le segment le plus étroit ; 1 mm d’œdème y multiplie la résistance par 16 (loi de Poiseuille).</li>
<li>Les régions laryngées à sous-muqueuse lâche gonflent vite : épiglottite, angiœdème, croup.</li>
<li>Quatre mécanismes d’hypoxémie ; le gradient alvéolo-artériel sépare l’hypoventilation des troubles des échanges.</li>
<li>Délai circulatoire long et chémosensibilité forte : respiration de Cheyne-Stokes.</li>
<li>La dyspnée est intégrée par l’insula, le cortex cingulaire et l’amygdale ; l’émotion module son intensité.</li>
<li>L’hypocapnie abaisse le calcium ionisé et provoque les paresthésies ; l’anémie réduit le contenu en oxygène sans abaisser la saturation.</li></ul></template>

<template data-pop="pareto-r06-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="r06-p-1,r06-p-2,r06-p-3,r06-p-4,r06-p-5,r06-p-6"></p><ul>
<li>Traiter la cause d’abord ; ne pas donner de sédatif à une dyspnée inexpliquée.</li>
<li>Oxygène : cibles de 94 à 98 % ou de 88 à 92 % (BTS 2017).</li>
<li>Morphine orale à faible dose : 10 à 30 mg par 24 heures dans la dyspnée chronique sévère du cancer (ESMO 2020) ; déconseillée par l’ERS 2024 dans les maladies respiratoires graves ; hors indication en Suisse.</li>
<li>Benzodiazépines : pas en première ligne ; jamais associées sans précaution à un opioïde.</li>
