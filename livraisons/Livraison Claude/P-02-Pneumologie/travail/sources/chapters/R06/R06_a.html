<section class="ilot" id="r06-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme D., 72 ans, consulte son médecin de famille un lundi matin. Depuis huit mois, elle s’essouffle en montant l’escalier de son immeuble et marche plus lentement que son mari sur le plat. Depuis trois nuits, elle dort assise dans son fauteuil et « siffle » en se réveillant vers deux heures du matin. Elle a fumé 30 paquets-années jusqu’à 60 ans et prend un traitement pour une hypertension artérielle. Sa fréquence respiratoire est de 26 par minute, sa saturation pulsée en oxygène de 91 % en air ambiant, son pouls irrégulier à 112 par minute et sa pression artérielle de 162/90 mmHg. L’auscultation révèle des sibilants diffus et des crépitants aux deux bases.</p>
<p>Ce tableau réunit les difficultés du symptôme. Une dyspnée chronique s’est aggravée brutalement, et un sifflement fait penser à tort à un asthme ou à une bronchopneumopathie chronique obstructive (BPCO). Quatre questions organisent le raisonnement : <b>la patiente est-elle en danger immédiat, quel organe produit la dyspnée, quel examen tranchera entre les hypothèses, et que faire du symptôme lorsque sa cause est traitée sans le faire disparaître ?</b></p>
<p>À la fin de ce cours, le médecin assistant sait reconnaître les signes d’alarme d’une dyspnée, d’un stridor ou d’une hyperventilation. Il sait caractériser le symptôme par l’anamnèse et l’examen, mesurer son intensité par une échelle validée, choisir les examens dans l’ordre utile et orienter vers les cours de cause : <a href="#/entry/J45">J45 — Asthme</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a>, <a href="#/entry/I50">I50 — Insuffisance cardiaque</a>, <a href="#/entry/I26">I26 — Embolie pulmonaire</a> et <a href="#/entry/J18">J18 — Pneumonies</a>. Il sait aussi conduire la démarche devant les autres anomalies de la respiration de la catégorie R06 : sifflement, respiration périodique, ronflement, éternuement, hoquet, soupirs et événements brefs inexpliqués du nourrisson.</p>
<div class="key"><b>Message fondateur.</b> La dyspnée est une sensation, et non une mesure. Le patient la décrit, le médecin l’objective par des signes et des examens. Une dyspnée intense avec une saturation normale reste une urgence possible, car une embolie pulmonaire, une acidose métabolique ou une anémie aiguë s’accompagnent souvent d’une saturation conservée. À l’inverse, un patient atteint de BPCO peut vivre avec une saturation de 89 % sans dyspnée de repos. La décision repose sur la combinaison de la plainte, des signes vitaux et du contexte.</div>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="r06-ats">définition de la dyspnée par l’American Thoracic Society (sensation subjective, qualités distinctes)</button>, la <button class="w" data-k="r06-chemo">régulation chimique de la ventilation (chémorécepteurs centraux et périphériques)</button> et l’<button class="w" data-k="r06-aa">équation des gaz alvéolaires (calcul du gradient alvéolo-artériel)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="r06-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>L’American Thoracic Society (ATS) définit la dyspnée, en 2012, comme une <b>expérience subjective d’inconfort respiratoire</b>, faite de sensations qualitativement distinctes dont l’intensité varie. Cette définition a deux conséquences pratiques. Seul le patient peut dire s’il est dyspnéique ; une fréquence respiratoire élevée n’est pas une dyspnée, mais un signe. Ensuite, les mots du patient orientent le mécanisme, car chaque <button class="w" data-k="r06-ats">qualité de la dyspnée (soif d’air, effort, oppression)</button> correspond à une voie nerveuse différente.</p>
<h3>1.1 Termes voisins à ne pas confondre</h3>
<p>Plusieurs termes désignent des signes observés et non la sensation. Le tableau suivant répond à une question fréquente au lit du patient : quel mot décrit exactement ce que je vois ou ce que le patient dit ? Les seuils de fréquence sont ceux de l’adulte au repos.</p>
<table class="t"><tr><th>Terme</th><th>Ce qu’il désigne</th><th>Exemple</th></tr>
<tr><td>Dyspnée</td><td>Sensation d’inconfort respiratoire rapportée par le patient</td><td>« Je manque d’air en montant un étage »</td></tr>
<tr><td>Tachypnée</td><td>Fréquence respiratoire supérieure à 20 par minute</td><td>Fréquence de 28 par minute dans une pneumonie</td></tr>
<tr><td>Bradypnée</td><td>Fréquence respiratoire inférieure à 12 par minute</td><td>Fréquence de 7 par minute après une surdose d’opioïde</td></tr>
<tr><td>Hyperpnée</td><td>Augmentation du volume courant, parfois sans tachypnée</td><td>Respiration ample de Kussmaul dans une acidocétose</td></tr>
<tr><td>Hyperventilation</td><td>Ventilation alvéolaire supérieure aux besoins, définie par une PaCO₂ inférieure à 35 mmHg (4,7 kPa)</td><td>Crise d’angoisse avec PaCO₂ à 26 mmHg</td></tr>
<tr><td>Orthopnée</td><td>Dyspnée apparaissant en décubitus et soulagée en position assise</td><td>Patiente qui dort assise depuis trois nuits</td></tr>
<tr><td>Apnée</td><td>Arrêt du débit aérien d’au moins 10 secondes chez l’adulte</td><td>Pauses observées par le conjoint pendant le sommeil</td></tr></table>
<p>Le premier réflexe de lecture consiste à séparer la plainte (dyspnée) du signe (tachypnée, hyperpnée). L’erreur fréquente consiste à écrire « patient dyspnéique » chez un patient confus qui respire vite, alors qu’il ne peut rien rapporter : il faut alors écrire « tachypnéique ». Chez Mme D., la dyspnée est rapportée, la tachypnée à 26 par minute est mesurée, et l’<button class="w" data-k="r06-ortho">orthopnée (décubitus, trépopnée, platypnée)</button> oriente vers une élévation de la pression capillaire pulmonaire.</p>
<h3>1.2 Dyspnée aiguë et dyspnée chronique</h3>
<p>Une dyspnée est dite aiguë lorsqu’elle s’installe en quelques minutes à quelques jours. Elle est dite chronique lorsqu’elle persiste plus de quatre à huit semaines ; la littérature n’a pas fixé de seuil unique. La distinction compte, parce que la dyspnée aiguë impose d’abord une évaluation de gravité, alors que la dyspnée chronique se prête à une démarche programmée. Une dyspnée chronique qui s’aggrave brutalement, comme chez Mme D., se traite comme une dyspnée aiguë jusqu’à preuve du contraire.</p>
<p>Un consensus international, publié dans l’European Respiratory Journal en 2017, a défini le <button class="w" data-k="r06-chronique">syndrome de dyspnée chronique (persistance malgré le traitement optimal de la cause)</button>. Il désigne une dyspnée qui persiste malgré le traitement optimal de la maladie sous-jacente et qui entraîne un handicap. Ce cadre n’est pas un diagnostic de cause ; il autorise à traiter le symptôme pour lui-même.</p>
<h3>1.3 Mesurer l’intensité</h3>
<p>Le médecin quantifie la dyspnée pour suivre son évolution et comparer les patients. Trois outils couvrent la plupart des situations. L’<button class="w" data-k="j44-mmrc">échelle mMRC (cinq degrés de 0 à 4 selon l’activité qui essouffle)</button> mesure l’impact sur les activités. L’<button class="w" data-k="r06-borg">échelle de Borg (intensité de 0 à 10 au moment présent)</button> mesure l’intensité instantanée, par exemple au repos puis à la fin d’un test de marche. La classification fonctionnelle de la New York Heart Association (NYHA) décrit la limitation de l’insuffisance cardiaque et est détaillée dans le cours I50.</p>
<p>Exemple : Mme D. était au degré 2 de l’échelle mMRC il y a un mois, puisqu’elle marchait plus lentement que les personnes de son âge. Ce matin, elle cote sa dyspnée de repos à 5 sur 10 sur l’échelle de Borg. Le premier chiffre décrit son handicap chronique ; le second décrit sa détresse actuelle et servira à juger l’effet du traitement dans deux heures.</p>
<h3>1.4 Classification CIM-10-GM 2024 de la catégorie R06</h3>
<p>La catégorie R06 code un symptôme lorsque le médecin n’a pas encore établi sa cause, ou lorsque le symptôme justifie une prise en charge propre. Elle exclut l’arrêt respiratoire (R09.2), l’insuffisance respiratoire (J96), le syndrome de détresse respiratoire aiguë (J80) et la détresse respiratoire du nouveau-né (P22). Le tableau suivant indique, pour chaque sous-code, l’îlot de ce cours qui le traite et le cours de cause vers lequel il oriente.</p>
<table class="t"><tr><th>Sous-code</th><th>Intitulé</th><th>Inclusions et exclusions utiles</th><th>Traitement dans ce cours</th></tr>
<tr><td>R06.0</td><td>Dyspnée</td><td>Inclut l’essoufflement et l’orthopnée ; exclut la tachypnée transitoire du nouveau-né (P22.1)</td><td>Îlots 7 à 9 et 12</td></tr>

<p>Le tableau se lit de gauche à droite : le code décrit ce que le médecin constate, la colonne d’exclusion rappelle les situations où un autre code s’impose d’emblée. L’erreur fréquente consiste à garder R06.0 lorsque la cause est trouvée. Chez Mme D., le code final sera celui de la maladie démontrée, par exemple une insuffisance cardiaque ; R06.0 ne sert qu’au moment où la dyspnée reste inexpliquée. La douleur thoracique respiratoire relève de R07.1 et la toux de R05 : ces symptômes sont abordés ici seulement comme symptômes associés.</p>
<div class="key"><b>À retenir.</b> La dyspnée est une sensation que seul le patient peut rapporter ; la tachypnée, l’hyperpnée et l’hyperventilation sont des signes ou des mesures. Le médecin distingue la dyspnée aiguë, qui impose d’abord une évaluation de gravité, de la dyspnée chronique, qui se prête à une démarche programmée. Il mesure le handicap par l’échelle mMRC et l’intensité instantanée par l’échelle de Borg. La partie suivante montre combien le symptôme est fréquent et pourquoi il a une valeur pronostique.</div>
</section>

<section class="ilot" id="r06-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La dyspnée est un des motifs de consultation les plus fréquents en médecine de premier recours et aux urgences. Une revue systématique avec méta-analyse publiée en 2025 dans l’European Respiratory Review a trouvé, avec le critère le plus utilisé (degré mMRC au moins égal à 2), une prévalence poolée de <b>12,5 %</b> dans la population générale adulte et de <b>37,5 %</b> dans les populations cliniques. Une méta-analyse de 56 études publiée en 2026 dans BMC Pulmonary Medicine a trouvé une prévalence de 22,2 % pour toute dyspnée mesurée par l’échelle mMRC, avec davantage de dyspnée chez la femme que chez l’homme. Voir les <button class="w" data-k="r06-epi">données épidémiologiques détaillées et leurs limites</button>.</p>
<p>Aucune donnée suisse récente spécifique à la prévalence de la dyspnée en population générale n’a été trouvée sous une forme directement exploitable. La cohorte suisse SAPALDIA a étudié les symptômes respiratoires de l’adulte, mais ses chiffres de dyspnée n’ont pas été lus en texte intégral pour ce cours ; cette lacune reste nommée.</p>
<h3>2.1 Causes en pratique</h3>
<p>Dans une consultation spécialisée de pneumologie, Pratter et ses collègues ont montré en 1989 que quatre groupes de maladies expliquaient deux tiers des dyspnées chroniques : l’asthme, la BPCO, les pneumopathies interstitielles et les cardiomyopathies. L’impression clinique seule ne trouvait la bonne cause que dans 66 % des cas, alors qu’une démarche fondée sur des examens objectifs l’établissait chez tous les patients. Cette étude justifie une règle : la dyspnée chronique se diagnostique par la preuve, non par l’intuition.</p>
<p>Aux urgences, les causes dominantes de la dyspnée aiguë de l’adulte sont l’insuffisance cardiaque décompensée, la pneumonie, l’exacerbation de BPCO ou d’asthme et l’embolie pulmonaire. Plusieurs causes coexistent souvent chez le sujet âgé. L’essai randomisé bâlois de Mueller et ses collègues, publié en 2004, a montré que le dosage rapide du <button class="w" data-k="r06-np">peptide natriurétique de type B (exclusion d’une cause cardiaque)</button> chez 452 patients dyspnéiques réduisait la proportion d’hospitalisations de 85 % à 75 % et la durée de séjour de 11 à 8 jours, sans différence de mortalité à 30 jours.</p>
<h3>2.2 Valeur pronostique</h3>
<p>Une dyspnée intense est associée à une mortalité plus élevée, indépendamment de la maladie. Dans la BPCO, le degré de dyspnée prédit la survie au moins aussi bien que le volume expiratoire maximal par seconde (VEMS). Cette relation est une <b>association</b> : la dyspnée reflète la gravité de la maladie, le déconditionnement et les comorbidités, et rien ne prouve que soulager la sensation seule allonge la vie. Voir la <button class="w" data-k="r06-pronostic">valeur pronostique de la dyspnée et ses limites</button>.</p>
<div class="key"><b>À retenir.</b> Environ un adulte sur huit déclare une dyspnée au moins modérée. Quatre groupes de maladies (asthme, BPCO, pneumopathies interstitielles, cardiomyopathies) expliquent deux tiers des dyspnées chroniques en consultation spécialisée, et une démarche objective trouve la cause bien plus souvent que l’impression clinique. La dyspnée intense est un marqueur de mauvais pronostic, sans que ce lien soit causal. La partie suivante explique comment le cerveau construit cette sensation.</div>
</section>

<section class="ilot" id="r06-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La dyspnée naît d’un décalage. Le tronc cérébral commande une ventilation ; des récepteurs renseignent le cerveau sur la ventilation obtenue et sur l’état chimique du sang. Lorsque la commande ne produit pas la réponse attendue, ou lorsque la commande elle-même devient excessive, le cortex perçoit un inconfort. Chaque cause de dyspnée agit sur un maillon de cette boucle.</p>
<h3>3.1 État normal</h3>
<p>Chez l’adulte sain au repos, les centres respiratoires du bulbe et de la protubérance génèrent environ 12 à 16 cycles par minute. Le diaphragme, innervé par le nerf phrénique (racines C3 à C5), assure l’essentiel de l’inspiration. La ventilation est ajustée pour maintenir une PaCO₂ proche de 40 mmHg (5,3 kPa) : les <button class="w" data-k="r06-chemo">chémorécepteurs centraux et périphériques (sensibles au dioxyde de carbone, au pH et à l’hypoxémie)</button> font varier la commande à chaque instant. Une copie de cette commande, la <button class="w" data-k="r06-corollaire">décharge corollaire (copie de la commande envoyée au cortex)</button>, parvient au cortex sensoriel. Le cerveau compare la commande et le retour des <button class="w" data-k="r06-jrec">mécanorécepteurs pulmonaires, des récepteurs J et des muscles</button>. Lorsque les deux concordent, la respiration reste inconsciente.</p>
<h3>3.2 Première charnière : la soif d’air</h3>
<p>Lorsque l’hypercapnie, l’hypoxémie ou l’acidose stimulent les chémorécepteurs, la commande augmente. Si la ventilation ne peut pas suivre, parce que les poumons sont distendus ou les muscles faibles, le patient ressent une <b>soif d’air</b>, décrite comme « une inspiration qui ne satisfait pas ». C’est la qualité la plus pénible et la plus spécifique d’une commande non satisfaite. Exemple : un patient atteint de BPCO sévère, dont la PaCO₂ monte à 60 mmHg pendant une exacerbation, dit qu’il « n’arrive pas à remplir ses poumons ».</p>
<h3>3.3 Deuxième charnière : le travail respiratoire</h3>
<p>Lorsque la charge mécanique augmente (résistance des voies aériennes, raideur du poumon ou de la paroi), les muscles doivent produire une force plus grande pour un même volume. La décharge corollaire augmente, et le patient perçoit un <b>effort</b>. La force musculaire diminuée produit la même sensation : un patient atteint de myasthénie ou de paralysie diaphragmatique ressent un effort excessif alors que ses poumons sont normaux. Le signe d’alarme correspondant est le recrutement des <button class="w" data-k="r06-x-tirage">muscles accessoires et la respiration abdominale paradoxale</button>.</p>
<h3>3.4 Troisième charnière : l’oppression thoracique</h3>
<p>La bronchoconstriction stimule directement des récepteurs vagaux de la paroi bronchique. Le patient décrit une <b>oppression</b> ou une « poitrine serrée », souvent avant toute baisse mesurable du débit. Cette qualité oriente vers l’asthme ; elle disparaît vite sous bronchodilatateur, alors que la sensation d’effort persiste tant que la distension persiste.</p>
<h3>3.5 Quatrième charnière : les signaux de l’œdème et du sang</h3>
<p>L’œdème interstitiel stimule les récepteurs juxtacapillaires (récepteurs J), ce qui provoque une respiration rapide et superficielle. Ce mécanisme explique en partie la tachypnée de l’insuffisance cardiaque et de l’embolie pulmonaire, même lorsque la saturation est normale. Une anémie ou une acidose métabolique augmentent la commande sans lésion pulmonaire : l’anémie réduit le contenu artériel en oxygène, et l’organisme compense par une augmentation du débit cardiaque et de la ventilation à l’effort.</p>

<p>La figure se lit de bas en haut. Une cause chimique (hypoxémie, acidose) agit par la boîte de gauche ; une cause mécanique (bronchospasme, fibrose, épanchement) agit par la boîte de droite ; une cause neuromusculaire agit sur la boîte centrale. Chez Mme D., les trois boîtes sont touchées : l’œdème pulmonaire rigidifie le poumon, stimule les récepteurs J et abaisse la PaO₂.</p>
<h3>3.6 Mécanismes propres aux autres anomalies de la catégorie</h3>
<p>Le <b>stridor</b> naît d’un rétrécissement des voies aériennes de gros calibre. L’air accéléré dans le segment étroit y abaisse la pression latérale, ce qui attire la paroi vers la lumière et la fait vibrer. Le moment du cycle dépend du siège : un obstacle extrathoracique se ferme à l’inspiration, un obstacle intrathoracique à l’expiration. Voir la <button class="w" data-k="r06-stridor-phys">physique du stridor (débit, pression latérale, siège)</button>.</p>
<p>L’<b>hyperventilation</b> abaisse la PaCO₂ et élève le pH. L’alcalose augmente la liaison du calcium à l’albumine, ce qui abaisse le calcium ionisé et provoque des paresthésies péribuccales et des extrémités. L’hypocapnie contracte aussi les artérioles cérébrales, d’où les vertiges et la sensation de tête vide. Voir les <button class="w" data-k="r06-hypocap">effets de l’hypocapnie (calcium ionisé, débit cérébral)</button>.</p>
<p>La <b>respiration périodique</b> de Cheyne-Stokes résulte d’une boucle de régulation instable. Dans l’insuffisance cardiaque, le temps de circulation allongé retarde l’information des chémorécepteurs, et leur sensibilité accrue au dioxyde de carbone amplifie chaque correction. La ventilation oscille alors entre hyperpnée et apnée centrale. Voir la <button class="w" data-k="r06-periodique">respiration périodique et la notion de gain de boucle</button>.</p>
<p>Le <b>hoquet</b> est un réflexe : une contraction brusque et involontaire du diaphragme est suivie, environ 35 millisecondes plus tard, d’une fermeture de la glotte qui produit le bruit. Toute irritation de l’arc réflexe, du nerf phrénique au tronc cérébral, peut l’entretenir. Voir l’<button class="w" data-k="r06-hoquet-arc">arc réflexe du hoquet et ses sites d’irritation</button>.</p>
<div class="key"><b>À retenir.</b> La dyspnée apparaît lorsque la commande ventilatoire augmente ou lorsque la réponse mécanique ne correspond plus à cette commande. La soif d’air traduit une commande chimique non satisfaite, l’effort traduit une charge ou une faiblesse musculaire, l’oppression traduit une bronchoconstriction. Le stridor reflète un obstacle des grosses voies aériennes, l’hyperventilation une alcalose hypocapnique, la respiration périodique une régulation instable et le hoquet un réflexe irrité. La partie suivante classe les causes selon ces mécanismes.</div>
</section>

<section class="ilot" id="r06-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Les causes de dyspnée se classent par le maillon atteint. Ce classement évite d’oublier une cause extrapulmonaire, car environ un tiers des dyspnées chroniques ne relève ni de l’asthme, ni de la BPCO, ni d’une pneumopathie interstitielle, ni d’une cardiomyopathie. Le tableau suivant répond à la question : quel organe peut produire la dyspnée de ce patient, et sur quel délai ?</p>
<table class="t"><tr><th>Mécanisme</th><th>Dyspnée aiguë (minutes à jours)</th><th>Dyspnée chronique (semaines à mois)</th></tr>
<tr><td>Voies aériennes supérieures</td><td>Anaphylaxie, angiœdème, épiglottite, corps étranger, abcès profond du cou</td><td>Sténose trachéale, tumeur laryngée, goitre compressif, obstruction laryngée inductible</td></tr>
<tr><td>Bronches</td><td>Crise d’asthme, exacerbation de BPCO</td><td>Asthme, BPCO, bronchectasies, bronchiolite oblitérante</td></tr>
<tr><td>Parenchyme</td><td>Pneumonie, œdème pulmonaire, syndrome de détresse respiratoire aiguë</td><td>Pneumopathies interstitielles, sarcoïdose, cancer</td></tr>
<tr><td>Plèvre et paroi</td><td>Pneumothorax, épanchement abondant, fractures de côtes</td><td>Épanchement chronique, cyphoscoliose, obésité</td></tr>
<tr><td>Circulation pulmonaire</td><td>Embolie pulmonaire</td><td>Hypertension pulmonaire, embolie chronique</td></tr>
<tr><td>Cœur</td><td>Insuffisance cardiaque décompensée, syndrome coronarien aigu, tamponnade, arythmie</td><td>Insuffisance cardiaque, valvulopathie, péricardite constrictive</td></tr>
<tr><td>Muscles et nerfs</td><td>Guillain-Barré, crise myasthénique</td><td>Sclérose latérale amyotrophique, paralysie diaphragmatique, myopathies</td></tr>
<tr><td>Sang et métabolisme</td><td>Anémie aiguë, acidose métabolique, intoxication au monoxyde de carbone, sepsis</td><td>Anémie chronique, hyperthyroïdie</td></tr>
<tr><td>Fonctionnelle et générale</td><td>Hyperventilation d’angoisse (diagnostic d’exclusion)</td><td>Déconditionnement, respiration dysfonctionnelle, grossesse</td></tr></table>
<p>La lecture commence par la colonne du délai, puis passe en revue chaque ligne. L’erreur fréquente consiste à s’arrêter à la première maladie connue du patient : un asthmatique peut faire une embolie, un insuffisant cardiaque une pneumonie. Mme D. a une dyspnée chronique (ligne « Cœur » ou « Bronches ») aggravée de façon aiguë ; son pouls irrégulier fait chercher une fibrillation auriculaire, qui est une <button class="w" data-k="r06-a-coeur">cause cardiaque de décompensation</button>.</p>
<h3>4.1 Causes du stridor et du sifflement</h3>
<p>Le stridor de l’adulte traduit un obstacle laryngé ou trachéal : angiœdème, épiglottite, corps étranger, paralysie bilatérale des cordes vocales après une thyroïdectomie, sténose après une intubation, tumeur ou goitre. Chez l’enfant de 6 mois à 3 ans, le croup viral (laryngotrachéite) est la cause la plus fréquente. Le sifflement traduit un obstacle des bronches ; la cause la plus fréquente est l’asthme, mais l’insuffisance cardiaque, la BPCO, une tumeur bronchique ou un corps étranger peuvent le produire.</p>
<div class="trap"><span class="k">Piège</span>« Tout ce qui siffle n’est pas de l’asthme. » Un sifflement apparu après 60 ans, nocturne, avec orthopnée, évoque d’abord une insuffisance cardiaque. Un sifflement fixe et localisé, toujours au même endroit, évoque une tumeur ou un corps étranger bronchique. Un bruit inspiratoire perçu au cou, et non au thorax, est un stridor.</div>
<h3>4.2 Facteurs déclenchants à rechercher</h3>
<p>Une dyspnée chronique se décompense presque toujours pour une raison. Les déclencheurs les plus fréquents sont une infection respiratoire, une arythmie (fibrillation auriculaire rapide), une ischémie, une poussée hypertensive, un écart de traitement ou de régime salé, un médicament (anti-inflammatoire non stéroïdien, bêtabloquant non cardiosélectif chez un asthmatique) et une embolie pulmonaire. Chez Mme D., la fibrillation auriculaire rapide raccourcit la diastole, supprime la contribution auriculaire au remplissage et élève la pression de l’oreillette gauche : elle peut à elle seule déclencher l’œdème pulmonaire.</p>
<div class="key"><b>À retenir.</b> Le médecin classe les causes de dyspnée par organe et par délai, sans oublier les causes sanguines, métaboliques, neuromusculaires et le déconditionnement. Il cherche toujours le facteur qui a décompensé une maladie chronique. Un stridor localise l’obstacle au larynx ou à la trachée, un sifflement aux bronches, et un sifflement tardif nocturne fait penser au cœur. La partie suivante montre comment l’anamnèse trie ces hypothèses.</div>
</section>

<section class="ilot" id="r06-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse établit la cause d’une dyspnée chronique dans une large proportion de cas, à condition d’être structurée. Elle répond à cinq questions : depuis quand, dans quelles circonstances, avec quelle qualité, avec quels symptômes associés, et sur quel terrain. Lorsque le patient est en détresse, le médecin pose d’abord les questions qui changent la conduite immédiate et reporte le reste.</p>
<h3>5.1 Antécédents et terrain</h3>
<p>Le terrain modifie la probabilité de chaque cause. Le médecin interroge sur les <button class="w" data-k="r06-a-coeur">antécédents cardiaques (cardiopathie, hypertension, arythmie)</button>, les <button class="w" data-k="r06-a-poumon">antécédents respiratoires et le tabagisme (paquets-années)</button>, les <button class="w" data-k="r06-a-expo">expositions professionnelles, domestiques et animales</button>, les <button class="w" data-k="r06-a-thrombo">facteurs de risque thromboembolique (chirurgie, immobilisation, cancer, œstrogènes)</button>, les <button class="w" data-k="r06-a-medic">médicaments responsables de dyspnée (bêtabloquants, ticagrélor, amiodarone)</button> et les <button class="w" data-k="r06-a-psy">troubles anxieux et attaques de panique</button>. Chaque antécédent est cliquable et sa fenêtre explique la question à poser et la conséquence de la réponse.</p>
<h3>5.2 Caractériser la dyspnée</h3>
<p>Le <button class="w" data-k="r06-s-debut">mode de début (brutal, rapide, progressif)</button> est la question la plus discriminante. Un début en quelques secondes ou minutes évoque une embolie, un pneumothorax, un corps étranger, une anaphylaxie ou un œdème pulmonaire « flash ». Un début en heures ou jours évoque une infection ou une décompensation cardiaque. Une installation sur des mois évoque une maladie chronique.</p>
<p>La <button class="w" data-k="r06-s-position">relation avec la position (orthopnée, dyspnée paroxystique nocturne, platypnée)</button> oriente vers le cœur, le diaphragme ou un shunt. La <button class="w" data-k="r06-s-dpn">dyspnée paroxystique nocturne</button> réveille le patient une à trois heures après le coucher. La qualité rapportée (soif d’air, effort, oppression) oriente le mécanisme, comme expliqué à l’îlot 3. L’intensité se mesure par l’échelle mMRC.</p>
<h3>5.3 Symptômes associés</h3>
<p>Le médecin recherche une <button class="w" data-k="r06-s-douleur">douleur thoracique respiratoire (R07.1, majorée par l’inspiration)</button>, une toux et une expectoration, une hémoptysie, une fièvre, des palpitations, une syncope, des œdèmes des membres inférieurs, une prise ou une perte de poids, et des paresthésies. Ces <button class="w" data-k="r06-s-assoc">symptômes associés et leur valeur d’orientation</button> sont décrits dans une fenêtre dédiée.</p>
<div class="two">
<div class="card"><h4>Présentation typique d’une dyspnée cardiaque</h4><p>Une femme de 74 ans hypertendue s’essouffle à l’effort depuis des mois, dort sur trois oreillers et se réveille la nuit en toussant. Ses chevilles gonflent le soir. Le tableau évoque une insuffisance cardiaque avant tout examen.</p></div>
<div class="card"><h4>Présentation typique d’une dyspnée bronchique</h4><p>Un homme de 30 ans siffle à l’effort par temps froid et au printemps, avec des périodes sans symptôme. La variabilité dans le temps évoque un asthme.</p></div>
<div class="card"><h4>Présentation atypique : équivalent de dyspnée</h4><p>Un homme diabétique de 68 ans ne se plaint pas de douleur, mais d’un essoufflement d’effort récent. Cette dyspnée peut être le seul symptôme d’une ischémie myocardique ; un électrocardiogramme s’impose.</p></div>
<div class="card"><h4>Présentation atypique : dyspnée sans plainte respiratoire</h4><p>Une personne âgée réduit ses sorties et dit seulement être « fatiguée ». Elle ne se dit pas dyspnéique, parce qu’elle a ajusté son activité. La question « Que ne pouvez-vous plus faire ? » révèle le handicap.</p></div>
</div>
<p>Chez Mme D., l’anamnèse apporte quatre arguments cardiaques : le terrain hypertensif, l’orthopnée, la dyspnée paroxystique nocturne et les palpitations récentes. Elle apporte aussi un argument bronchique : 30 paquets-années. Elle ne tranche pas seule, mais elle hiérarchise les examens.</p>
<div class="key"><b>À retenir.</b> Le mode de début, la relation avec la position, la qualité de la sensation et les symptômes associés orientent la cause. Le terrain cardiaque, le tabagisme, les expositions, les facteurs thromboemboliques et les médicaments modifient la probabilité de chaque hypothèse. Une dyspnée d’effort récente chez un diabétique ou un sujet âgé peut être le seul signe d’une ischémie. La partie suivante cherche à l’examen les signes qui confirment ou infirment ces hypothèses.</div>
</section>

<section class="ilot" id="r06-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen d’un patient dyspnéique commence avant de toucher le patient. Le médecin observe s’il parle par phrases complètes, s’il se tient assis penché en avant, s’il utilise ses muscles du cou, et quelle est sa couleur. Il mesure ensuite les signes vitaux, puis recherche les signes ciblés qui départagent les hypothèses.</p>
<h3>6.1 État général et signes vitaux</h3>
<p>La <button class="w" data-k="r06-x-fr">fréquence respiratoire (comptée sur 30 à 60 secondes)</button> est le signe vital le plus souvent omis et l’un des plus informatifs. Chez l’adulte au repos, elle se situe normalement entre 12 et 20 par minute. Une fréquence d’au moins 25 par minute donne 3 points au score <button class="w" data-k="r06-news2">NEWS2 (score d’alerte précoce)</button>, soit le niveau d’un paramètre isolé qui impose une évaluation médicale urgente.</p>
<p>La <button class="w" data-k="r06-x-spo">saturation pulsée en oxygène (lecture, cibles, pièges)</button> mesure l’oxygénation et non la ventilation. Chez l’adulte sain au niveau de la mer, elle se situe entre 95 et 100 %. Le médecin note toujours si la mesure est faite en air ambiant ou sous oxygène, avec le débit. La pression artérielle, la fréquence cardiaque, la régularité du pouls, la température et l’état de conscience complètent l’évaluation. L’indice de masse corporelle (IMC) est calculé, car l’obésité est une cause fréquente de dyspnée d’effort et un facteur d’hypoventilation.</p>
<h3>6.2 Signes ciblés</h3>
<p>Le tableau suivant regroupe les signes par organe et indique ce que chacun suggère. La colonne de droite rappelle la limite qui empêche de conclure sur un seul signe.</p>
<table class="t"><tr><th>Signe</th><th>Ce qu’il suggère</th><th>Limite</th></tr>
<tr><td><button class="w" data-k="r06-x-tirage">Tirage, muscles accessoires, respiration paradoxale</button></td><td>Charge respiratoire excessive, fatigue diaphragmatique</td><td>Signe tardif chez le sujet âgé ou affaibli</td></tr>
<tr><td><button class="w" data-k="r06-x-cyanose">Cyanose centrale</button></td><td>Hypoxémie marquée</td><td>Absente en cas d’anémie, présente sans hypoxémie en cas de méthémoglobinémie</td></tr>
<tr><td><button class="w" data-k="r06-x-auscult">Sibilants, stridor, crépitants, silence auscultatoire</button></td><td>Bronches, larynx, alvéoles, obstruction extrême</td><td>Sibilants possibles dans l’insuffisance cardiaque</td></tr>
<tr><td><button class="w" data-k="r06-x-jug">Turgescence jugulaire, reflux hépato-jugulaire, œdèmes</button></td><td>Pression veineuse élevée, insuffisance cardiaque</td><td>Jugulaires difficiles à voir chez l’obèse</td></tr>
<tr><td>Matité et abolition du murmure d’une base</td><td>Épanchement pleural</td><td>Une condensation donne aussi une matité, avec souffle tubaire</td></tr>
<tr><td>Tympanisme et abolition du murmure d’un côté</td><td>Pneumothorax</td><td>Difficile à percevoir dans le bruit des urgences</td></tr>
<tr><td>Mollet tendu, asymétrie des membres inférieurs</td><td>Thrombose veineuse et embolie pulmonaire</td><td>Absent chez une majorité des patients avec embolie</td></tr>
<tr><td><button class="w" data-k="r06-x-paleur">Pâleur conjonctivale</button></td><td>Anémie</td><td>Peu sensible pour une anémie modérée</td></tr>
<tr><td><button class="w" data-k="r06-x-patterns">Rythme respiratoire anormal (Kussmaul, Cheyne-Stokes, Biot)</button></td><td>Acidose, insuffisance cardiaque, lésion du tronc cérébral</td><td>Observation d’au moins une minute nécessaire</td></tr></table>
<p>La lecture commence par la première ligne : un tirage ou une respiration paradoxale imposent d’agir avant d’ausculter longuement. L’erreur fréquente consiste à rassurer devant l’absence de sibilants chez un asthmatique très essoufflé ; ce silence peut traduire un débit d’air trop faible pour produire un bruit. Chez Mme D., les crépitants bilatéraux, les sibilants et le pouls irrégulier rapide orientent vers un œdème pulmonaire déclenché par une arythmie ; les jugulaires, le reflux hépato-jugulaire et les œdèmes des chevilles seront recherchés pour le confirmer.</p>
<div class="quiz ui"><p>Un homme de 58 ans, fumeur, consulte pour une dyspnée apparue en 20 minutes. Il parle par phrases courtes. Fréquence respiratoire 30 par minute, saturation 86 %, murmure vésiculaire aboli et tympanisme à droite, trachée déviée vers la gauche, pression artérielle 82/50 mmHg. Quelle est la priorité ?</p><button data-ok="0">Radiographie thoracique pour confirmer le pneumothorax avant tout geste</button><button data-ok="1">Décompression thoracique immédiate d’un pneumothorax sous tension, sans attendre l’imagerie</button><button data-ok="0">Spirométrie pour exclure une BPCO</button><p class="fb" hidden>L’association d’une abolition unilatérale du murmure, d’un tympanisme, d’une déviation trachéale controlatérale et d’une hypotension définit cliniquement le pneumothorax sous tension. La pression intrathoracique comprime les veines caves et le cœur droit : le retour veineux chute, d’où le choc. Le diagnostic est clinique et la décompression ne doit pas attendre la radiographie.</p></div>
<div class="key"><b>À retenir.</b> Le médecin observe la parole, la posture, les muscles accessoires et la couleur avant d’ausculter. Il compte la fréquence respiratoire, note la saturation avec la fraction d’oxygène, et cherche les signes qui départagent les organes : auscultation, percussion, jugulaires, membres inférieurs, conjonctives et rythme respiratoire. Aucun signe isolé ne suffit ; leur combinaison hiérarchise les examens. La partie suivante place la gravité au premier plan.</div>
