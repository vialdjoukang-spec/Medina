
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j69-clin" data-title="Pareto — Définitions, mécanismes et causes">
<p class="ratio" data-cover="j69-0,j69-1,j69-2,j69-3,j69-4"></p>
<ul>
<li>J68 regroupe gaz, fumées et vapeurs ; J69 les liquides et solides aspirés ; J70 les rayonnements et les médicaments.</li>
<li>L’aspiration donne trois tableaux : lésion chimique en heures, infection en jours, obstruction immédiate.</li>
<li>La pneumonie d’aspiration exige une pneumonie prouvée et un argument d’aspiration (SPILF 2025).</li>
<li>Le syndrome de Mendelson se code J95.4, le nouveau-né P24, le vapotage U07.0, le monoxyde de carbone T58.</li>
<li>Un gaz soluble lèse les voies hautes et alerte vite ; un gaz peu soluble lèse les alvéoles avec retard.</li>
<li>L’huile minérale entretient une inflammation chronique ; l’amiodarone s’accumule ; la bléomycine produit des radicaux libres.</li>
<li>La radiothérapie donne des symptômes surtout entre trois et douze semaines, puis une fibrose.</li>
<li>Les facteurs d’aspiration se corrigent barrière par barrière : vigilance, déglutition, reflux, hygiène buccale.</li>
<li>Une dysphagie oropharyngée est présente chez 55 % des sujets âgés hospitalisés pour pneumonie dans une cohorte espagnole.</li>
<li>Les pneumopathies médicamenteuses représentent 3 à 5 % des pneumopathies interstitielles ; les anticancéreux en sont la première cause.</li>
<li>Les inhibiteurs de points de contrôle immunitaire causent une pneumopathie chez 4 % des patients en monothérapie et 7 % en association ; l’amiodarone chez 1,6 à 2,9 %.</li>
<li>L’épidémie de lésions liées au vapotage a été liée surtout au THC et à l’acétate de vitamine E.</li>
</ul></template>

<template data-pop="pareto-j69-diag" data-title="Pareto — Anamnèse, examen et diagnostic">
<p class="ratio" data-cover="j69-5,j69-6,j69-7"></p>
<ul>
<li>L’anamnèse date l’exposition, les premiers symptômes et l’aggravation.</li>
<li>Une fréquence respiratoire supérieure à 30 par minute signale la gravité.</li>
<li>La SpO₂ ne détecte pas le monoxyde de carbone ; la suie et la voix rauque annoncent un œdème laryngé.</li>
<li>Le diagnostic réunit exposition, délai compatible, imagerie compatible et exclusion des autres causes.</li>
<li>Le médecin écarte d’abord l’infection, l’œdème cardiogénique et l’embolie.</li>
</ul></template>

<template data-pop="pareto-j69-tt" data-title="Pareto — Urgences et prise en charge">
<p class="ratio" data-cover="j69-8,j69-9"></p>
<ul>
<li>Après un incendie, le médecin protège les voies aériennes, donne de l’oxygène à 100 % et l’hydroxocobalamine 5 g si les critères sont présents.</li>
<li>L’oxygénothérapie hyperbare s’impose en cas de trouble de conscience, de signe neurologique ou cardiaque, ou de grossesse.</li>
<li>La lésion chimique d’aspiration se traite par soutien ; l’antibiotique se discute à 48 heures.</li>
<li>La pneumonie d’aspiration reçoit de l’amoxicilline-acide clavulanique, 5 jours si l’évolution est favorable, sans anti-anaérobie supplémentaire hors abcès.</li>
<li>La toxicité médicamenteuse impose l’arrêt ; grade 2 : prednisone 1 à 2 mg/kg ; grade 3 ou 4 : méthylprednisolone 1 à 2 mg/kg.</li>
<li>La pneumopathie radique symptomatique reçoit jusqu’à 60 mg de prednisone par jour avec décroissance lente.</li>
</ul></template>

<template data-pop="pareto-j69-crit" data-title="Pareto — Prévention, situations particulières et critères">
<p class="ratio" data-cover="j69-10,j69-11,j69-12"></p>
<ul>
<li>Le dépistage de la dysphagie précède toute prise orale après un accident vasculaire cérébral.</li>
<li>Toute toxicité médicamenteuse se déclare à Swissmedic et s’inscrit au dossier.</li>
<li>Les contraintes radiques sont un V20 de 30 à 35 % et une dose moyenne de 20 à 23 Gy au plus.</li>
<li>La femme enceinte intoxiquée par le monoxyde de carbone relève de l’oxygénothérapie hyperbare.</li>
<li>Chez l’enfant qui a avalé un hydrocarbure, le médecin n’induit jamais de vomissement.</li>
<li>Les grades CTCAE vont de l’anomalie radiologique isolée (1) à la menace vitale (4).</li>
</ul></template>

<template data-pop="pareto-j69-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j69-e-1,j69-e-2,j69-e-3,j69-e-4,j69-e-5,j69-e-6"></p>
<ul>
<li>La co-oxymétrie mesure la carboxyhémoglobine ; la clinique décide de l’oxygénothérapie hyperbare.</li>
<li>Un lactate d’au moins 7,5 mmol/L après incendie fait donner l’hydroxocobalamine.</li>
<li>Le scanner est l’examen de référence de la pneumonie d’aspiration ; le segment atteint dépend de la position.</li>
<li>La densité graisseuse évoque l’huile, l’hyperdensité l’amiodarone, la ligne droite la radiothérapie.</li>
<li>Le lavage bronchoalvéolaire exclut surtout l’infection.</li>
<li>La DLCO baisse tôt dans les atteintes interstitielles ; la vidéofluoroscopie démontre l’aspiration silencieuse.</li>
<li>Un scanner normal dans les premières heures n’exclut pas une lésion par gaz peu soluble.</li>
<li>Des macrophages spumeux sous amiodarone prouvent l’exposition, pas la toxicité ; la CRP sert surtout à suivre l’évolution sur 48 heures.</li>
</ul></template>

<template data-pop="pareto-j69-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j69-sa,j69-sh,j69-sp,j69-st,j69-si,j69-sr"></p>
<ul>
<li>La bronche souche droite, verticale et large, reçoit plus souvent le matériel aspiré.</li>
<li>La destruction des pneumocytes de type I et de l’endothélium produit l’œdème lésionnel.</li>
<li>Le monoxyde de carbone réduit le transport et la libération de l’oxygène sans abaisser la PaO₂.</li>
<li>Le cyanure bloque la cytochrome c oxydase et élève le lactate.</li>
<li>Les toxicités immunitaires ne dépendent pas de la dose.</li>
<li>Le poumon tolère une forte dose sur un petit volume, pas une dose modérée sur un grand volume.</li>
<li>La chaleur lèse surtout les voies supérieures, sauf la vapeur d’eau.</li>
<li>L’amiodarone s’accumule dans les macrophages et les pneumocytes de type II ; la bléomycine agit par radicaux libres.</li>
</ul></template>

<template data-pop="pareto-j69-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j69-p-1,j69-p-2,j69-p-3,j69-p-4"></p>
<ul>
<li>Amoxicilline-acide clavulanique : 2,2 g toutes les 8 heures par voie intraveineuse, puis 1 g deux fois par jour.</li>
<li>Hydroxocobalamine : 5 g en 15 minutes, 10 g au maximum, par une voie séparée.</li>
<li>Prednisone 1 à 2 mg/kg au grade 2 ; méthylprednisolone 1 à 2 mg/kg au grade 3 ou 4 ; deuxième ligne après 72 heures d’échec.</li>
<li>Le méthotrexate interagit dangereusement avec le co-trimoxazole.</li>
<li>L’amiodarone se donne à 100 à 400 mg par jour en entretien ; sa toxicité survient même à 200 mg.</li>
</ul></template>
