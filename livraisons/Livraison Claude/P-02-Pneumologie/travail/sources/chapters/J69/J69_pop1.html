
<!-- ===== FENÊTRES : notions cliniques ===== -->
<template data-pop="j69-pnchim" data-title="Pneumopathie chimique d’aspiration">
<div class="lab">Définition</div><p>La pneumopathie chimique est une lésion inflammatoire aiguë du poumon causée par l’aspiration d’un liquide gastrique acide, sans infection initiale. Elle survient typiquement après un vomissement chez un patient dont la conscience est diminuée.</p>
<div class="lab">Mécanisme</div><p>L’acide détruit l’épithélium alvéolaire et l’endothélium en quelques minutes. Les polynucléaires neutrophiles affluent ensuite en quelques heures et entretiennent un œdème lésionnel, qui abaisse la PaO₂.</p>
<div class="lab">Conséquence clinique</div><p>Les symptômes apparaissent en quelques heures : dyspnée, hypoxémie, crépitants, parfois fièvre. Environ 16 % des patients évoluent vers un syndrome de détresse respiratoire aiguë selon Niederman et Cilloniz (2022).</p>
<div class="lab">Décision</div><p>Le traitement est un soutien : aspiration, oxygène, position demi-assise. Les antibiotiques ne sont pas recommandés d’emblée ; ils se discutent dans les formes sévères ou si l’évolution n’est pas favorable à 48 heures.</p>
<div class="lab">Limite</div><p>La fièvre et la CRP élevée ne distinguent pas la lésion chimique de l’infection au premier jour. Seule l’évolution tranche.</p></template>

<template data-pop="j69-pnasp" data-title="Pneumonie d’aspiration">
<div class="lab">Définition</div><p>La pneumonie d’aspiration est une infection pulmonaire liée à l’aspiration de sécrétions oropharyngées colonisées. La SPILF 2025 exige un diagnostic positif de pneumonie et un argument présomptif d’aspiration.</p>
<div class="lab">Mécanisme</div><p>Une dysphagie, un trouble de conscience ou une mauvaise hygiène buccale laissent entrer dans les segments déclives une salive chargée de bactéries. Chez le sujet âgé institutionnalisé, les bacilles à Gram négatif et <i>Staphylococcus aureus</i> y sont plus fréquents ; les anaérobies sont moins souvent retrouvés que dans les études anciennes.</p>
<div class="lab">Conséquence clinique</div><p>Fièvre, toux productive et condensation déclive apparaissent en un à plusieurs jours. Chez le sujet âgé, une confusion ou une chute peuvent être les seuls signes.</p>
<div class="lab">Décision</div><p>L’amoxicilline-acide clavulanique est le traitement de première ligne, pendant 5 jours si l’évolution est favorable. Un anti-anaérobie supplémentaire n’est ajouté qu’en cas d’abcès ou d’empyème. La recherche des troubles de la déglutition est systématique.</p>
<div class="lab">Source</div><p>SPILF 2025 ; ATS/IDSA 2019, question 10 ; Niederman et Cilloniz 2022.</p></template>

<template data-pop="j69-diild" data-title="Pneumopathie médicamenteuse : imputabilité">
<div class="lab">Définition</div><p>Une pneumopathie médicamenteuse est une atteinte pulmonaire causée par un médicament, le plus souvent interstitielle. La CIM-10-GM la code J70.2 si elle est aiguë, J70.3 si elle est chronique et J70.4 sans précision.</p>
<div class="lab">Comment l’établir</div><p>Aucun examen ne la prouve. Le médecin réunit quatre arguments : l’exposition au médicament, un délai compatible, l’exclusion des autres causes, en particulier infectieuses, et l’amélioration après l’arrêt. La réapparition lors d’une réexposition confirme l’imputabilité, mais une réexposition volontaire est rarement acceptable.</p>
<div class="lab">Épidémiologie</div><p>Elle représente 3 à 5 % des pneumopathies interstitielles ; les anticancéreux en causent 23 à 51 % (Conte et al., 2022).</p>
<div class="lab">Piège</div><p>Un médicament pris depuis des années peut devenir toxique ; l’ancienneté ne disculpe pas l’amiodarone ni la nitrofurantoïne.</p></template>

<template data-pop="j69-radique" data-title="Pneumopathie radique">
<div class="lab">Définition</div><p>La pneumopathie radique est une inflammation pulmonaire aiguë ou subaiguë due à une radiothérapie thoracique (J70.0). Sa séquelle est la fibrose radique (J70.1).</p>
<div class="lab">Chronologie</div><p>Les symptômes apparaissent surtout entre trois et douze semaines après la radiothérapie, parfois jusqu’à un an ; environ 80 % des cas symptomatiques surviennent dans les dix mois selon QUANTEC. La fibrose s’installe ensuite sur des mois.</p>
<div class="lab">Clinique</div><p>Le patient présente une toux sèche, une dyspnée, un fébricule ou une douleur thoracique. Les opacités restent limitées au volume irradié. Des opacités hors du champ évoquent une pneumonie organisée induite par la radiothérapie ou une autre cause.</p>
<div class="lab">Décision</div><p>Une forme peu symptomatique se surveille. Une forme qui limite les activités reçoit de la prednisone, jusqu’à 60 mg par jour pendant 2 à 4 semaines, puis une décroissance lente. L’infection, l’insuffisance cardiaque, l’embolie et la progression tumorale sont exclues d’abord.</p></template>

<template data-pop="j69-deglut" data-title="Déglutition et protection des voies aériennes">
<div class="lab">Fonctionnement normal</div><p>La déglutition comporte une phase orale volontaire, puis une phase pharyngée réflexe. Pendant cette phase, le larynx s’élève, l’épiglotte bascule, les cordes vocales se ferment et la respiration s’interrompt brièvement.</p>
<div class="lab">Défenses de seconde ligne</div><p>Si du matériel franchit les cordes vocales, la toux réflexe l’expulse. L’escalator mucociliaire et les macrophages éliminent le reste.</p>
<div class="lab">Perturbation</div><p>Un retard du réflexe de déglutition, une faiblesse de l’élévation laryngée ou une sensibilité laryngée diminuée laissent passer le bolus. Si la toux est aussi abolie, l’aspiration est silencieuse.</p>
<div class="lab">Conséquence pratique</div><p>Une aspiration silencieuse ne se voit pas au repas. Seuls la vidéofluoroscopie ou la fibroscopie de déglutition la démontrent.</p></template>

<template data-pop="j69-solub" data-title="Solubilité des gaz irritants">
<div class="lab">Principe</div><p>Un gaz irritant agit là où il se dissout dans l’eau de la muqueuse. Sa solubilité dans l’eau détermine donc la hauteur de la lésion dans les voies aériennes.</p>
<div class="lab">Gaz très solubles</div><p>L’ammoniac, l’acide chlorhydrique et le dioxyde de soufre se dissolvent dans les voies supérieures. Ils provoquent une douleur immédiate des yeux, du nez et de la gorge, qui pousse à fuir.</p>
<div class="lab">Gaz peu solubles</div><p>Le phosgène, le dioxyde d’azote et l’ozone irritent peu les voies supérieures. Ils atteignent les bronchioles et les alvéoles et provoquent un œdème lésionnel après plusieurs heures.</p>
<div class="lab">Conséquence pratique</div><p>L’absence de symptôme immédiat ne rassure pas après un gaz peu soluble. Le patient est surveillé, et la durée d’observation se fixe avec Tox Info Suisse.</p>
<div class="lab">Limite</div><p>Une exposition massive à un gaz très soluble peut aussi léser les alvéoles.</p></template>

<template data-pop="j69-co" data-title="Monoxyde de carbone et hémoglobine">
<div class="lab">Définition</div><p>Le monoxyde de carbone est un gaz incolore et inodore produit par une combustion incomplète : incendie, chauffage défectueux, moteur dans un local fermé.</p>
<div class="lab">Mécanisme</div><p>Il se lie à l’hémoglobine avec une affinité environ 200 fois supérieure à celle de l’oxygène et forme la carboxyhémoglobine. Il réduit ainsi le transport d’oxygène et déplace la courbe de dissociation vers la gauche, ce qui gêne la libération tissulaire. Il se fixe aussi sur la myoglobine et sur la cytochrome c oxydase.</p>
<div class="lab">Conséquence clinique</div><p>L’intoxication provoque des céphalées, des nausées, une confusion, parfois un coma ou une ischémie myocardique. Des troubles neurologiques retardés peuvent apparaître après des jours ou des semaines.</p>
<div class="lab">Piège</div><p>La PaO₂ et la SpO₂ classique restent normales. Le code CIM-10-GM de l’intoxication est T58, en plus du code de l’éventuelle atteinte respiratoire.</p></template>

<template data-pop="j69-spilf" data-title="Recommandation SPILF 2025 sur la pneumonie d’aspiration">
<div class="lab">Référence</div><p>Diamantis S. et al. Aspiration pneumonia guidelines, Société de pathologie infectieuse de langue française 2025. Infectious Diseases Now 2025;55:105081, publiée en juillet 2025, avec un coauteur genevois.</p>
<div class="lab">Contenu retenu</div><p>La pneumonie d’aspiration exige un diagnostic positif de pneumonie et un argument présomptif d’aspiration. La pneumopathie chimique aiguë n’en fait pas partie. Une imagerie complémentaire, de préférence un scanner, confirme le diagnostic. L’amoxicilline-acide clavulanique, orale ou intraveineuse, est le traitement de première ligne pendant 5 jours si l’évolution est favorable. Les troubles de la déglutition sont recherchés systématiquement.</p>
<div class="lab">Portée et limite</div><p>Il s’agit d’une recommandation francophone européenne, non suisse. Seuls ses points clés ont été lus ; les doses détaillées du texte intégral n’ont pas pu être consultées. La dose suisse retenue est celle de la SSI, reprise dans le cours J18.</p></template>

<template data-pop="j69-evali" data-title="Lésion pulmonaire liée au vapotage (EVALI)">
<div class="lab">Définition</div><p>EVALI désigne une lésion pulmonaire aiguë associée à l’usage de cigarettes électroniques ou de produits de vapotage. La CIM-10-GM 2024 la code U07.0, avec infiltrats pulmonaires et infection improbable ou exclue.</p>
<div class="lab">Cause</div><p>L’acétate de vitamine E, utilisé pour diluer des huiles de THC, a été retrouvé dans le liquide de lavage des 29 patients analysés par le CDC. Le CDC a précisé que d’autres causes restaient possibles.</p>
<div class="lab">Clinique</div><p>Parmi les patients documentés en 2019, 95 % avaient des symptômes respiratoires, 77 % des symptômes digestifs et 85 % des symptômes généraux, comme la fièvre ou la perte de poids.</p>
<div class="lab">Décision</div><p>Le patient arrête le vapotage. Il est hospitalisé si sa SpO₂ est inférieure à 95 % à l’air ambiant. Le médecin recherche la grippe en saison et discute les corticoïdes avec le pneumologue. Le diagnostic reste un diagnostic d’exclusion.</p>
<div class="lab">Source</div><p>Siegel D. A. et al., Morbidity and Mortality Weekly Report 2019 ; CDC, communiqué du 25.02.2020 ; BfArM, U07.0.</p></template>

<template data-pop="j69-ici" data-title="Inhibiteurs de points de contrôle immunitaire">
<div class="lab">Définition</div><p>Ce sont des anticorps qui bloquent PD-1, PD-L1 ou CTLA-4 pour lever le frein des lymphocytes T contre la tumeur, par exemple le pembrolizumab, le nivolumab ou l’ipilimumab.</p>
<div class="lab">Toxicité pulmonaire</div><p>La SITC rapporte une pneumopathie chez 4 % des patients sous anti-PD-1 ou anti-PD-L1, dont 1 % de grade 3 ou plus, et chez 7 % sous association. Une série hospitalière a trouvé 19 %. Le délai médian est de trois mois.</p>
<div class="lab">Facteurs de risque</div><p>Une anomalie interstitielle préalable, une radiothérapie thoracique antérieure, l’histologie épidermoïde et l’association de deux inhibiteurs augmentent le risque.</p>
<div class="lab">Conséquence pratique</div><p>Toute dyspnée ou toux nouvelle sous immunothérapie impose un scanner et l’exclusion d’une infection, puis une conduite selon le grade CTCAE.</p></template>

<template data-pop="j69-asphyx" data-title="Asphyxiants systémiques des fumées">
<div class="lab">Définition</div><p>Un asphyxiant systémique empêche l’apport ou l’utilisation de l’oxygène par les tissus sans léser directement le poumon. Les fumées d’incendie en contiennent deux : le monoxyde de carbone et le cyanure d’hydrogène, produit par la combustion des plastiques, de la laine ou de la soie.</p>
<div class="lab">Mécanismes</div><p>Le monoxyde de carbone occupe l’hémoglobine. Le cyanure bloque la cytochrome c oxydase des mitochondries et provoque une acidose lactique.</p>
<div class="lab">Conséquence pratique</div><p>Une victime d’incendie confuse ou instable reçoit de l’oxygène à 100 % et, si les critères sont présents, de l’hydroxocobalamine, sans attendre les dosages.</p></template>

<template data-pop="j69-dysph" data-title="Dysphagie oropharyngée : dépistage et bilan">
<div class="lab">Définition</div><p>La dysphagie oropharyngée est une difficulté à faire passer le bolus de la bouche vers l’œsophage. Elle se distingue de la dysphagie œsophagienne, ressentie plus bas.</p>
<div class="lab">Causes</div><p>Les causes principales sont l’accident vasculaire cérébral, la maladie de Parkinson, la démence, la sclérose latérale amyotrophique, les cancers de la tête et du cou et leurs traitements, et la sarcopénie du grand âge.</p>
<div class="lab">Dépistage</div><p>Un test à l’eau ou à plusieurs consistances, réalisé au lit, identifie les patients à risque. L’ESO/ESSD 2021 le recommande chez tout patient atteint d’un accident vasculaire cérébral aigu, avant toute prise orale.</p>
<div class="lab">Bilan</div><p>La vidéofluoroscopie ou la fibroscopie de déglutition, réalisées avec le logopédiste, documentent l’aspiration et choisissent les textures sûres.</p>
<div class="lab">Épidémiologie</div><p>Dans une cohorte espagnole de 134 patients âgés hospitalisés pour pneumonie, 55 % avaient une dysphagie oropharyngée.</p></template>

<template data-pop="j69-lipid" data-title="Pneumonie lipidique exogène">
<div class="lab">Définition</div><p>La pneumonie lipidique exogène est une inflammation pulmonaire due à l’aspiration ou à l’inhalation répétée d’huiles. Elle se code J69.1.</p>
<div class="lab">Expositions</div><p>Les expositions typiques sont l’huile de paraffine prise comme laxatif, les gouttes ou pommades nasales grasses, la vaseline appliquée sur une trachéotomie, l’aspiration d’hydrocarbures et la pratique des cracheurs de feu.</p>
<div class="lab">Mécanisme</div><p>Les macrophages phagocytent l’huile minérale sans pouvoir la dégrader. Ils meurent, libèrent les lipides et entretiennent une inflammation à corps étranger qui peut évoluer vers la fibrose.</p>
<div class="lab">Diagnostic</div><p>Le scanner montre une condensation de densité graisseuse, typiquement de −30 à −150 unités Hounsfield, dans 40 à 80 % des cas. Le lavage bronchoalvéolaire montre des macrophages chargés de lipides.</p>
<div class="lab">Piège</div><p>L’aspect de masse spiculée peut faire croire à un cancer. Le traitement repose sur l’arrêt de l’exposition.</p></template>

<template data-pop="j69-pneumotox" data-title="Pneumotox">
<div class="lab">Définition</div><p>Pneumotox est une base de données en ligne, créée par le pneumologue Philippe Camus à Dijon, qui recense les médicaments rapportés comme toxiques pour le poumon et leurs tableaux.</p>
<div class="lab">Mode d’emploi</div><p>Le médecin entre le nom du médicament et lit les tableaux décrits, leur fréquence relative et les références. Il compare ensuite le tableau de son patient.</p>
<div class="lab">Limite</div><p>Pneumotox recense des observations publiées ; il ne prouve pas l’imputabilité chez un patient. Conte et al. (2022) le citent comme outil de référence.</p></template>

<template data-pop="j69-v20" data-title="V20 et dose pulmonaire moyenne">
<div class="lab">Définition</div><p>Le V20 est le pourcentage du volume pulmonaire total qui reçoit au moins 20 Gy. La dose pulmonaire moyenne est la dose moyenne reçue par l’ensemble des deux poumons.</p>
<div class="lab">Seuils</div><p>Pour une radiothérapie conventionnelle d’un cancer bronchique non à petites cellules, QUANTEC juge prudent de limiter le V20 à 30 à 35 % et la dose moyenne à 20 à 23 Gy. Le risque de pneumopathie symptomatique reste alors d’environ 20 % au plus.</p>
<div class="lab">Limite</div><p>QUANTEC précise qu’il n’existe pas de seuil net : ces valeurs sont des repères approximatifs, et la chimiothérapie ou l’immunothérapie modifient le risque.</p></template>

<template data-pop="j69-ant-asp" data-title="Facteurs d’aspiration : questions ciblées">
<div class="lab">Questions</div><p>Le médecin demande si le patient tousse ou s’étouffe en mangeant, si sa voix devient mouillée après une gorgée, s’il a perdu du poids, s’il met longtemps à finir son repas. Il interroge sur les vomissements, le reflux, les crises d’épilepsie et l’alcool.</p>
<div class="lab">Pourquoi</div><p>Chaque réponse désigne une barrière défaillante et donc une mesure de prévention.</p>
<div class="lab">Piège</div><p>L’aspiration silencieuse ne provoque pas de toux ; une réponse négative ne l’exclut pas.</p></template>

<template data-pop="j69-ant-med" data-title="Anamnèse médicamenteuse complète">
<div class="lab">Contenu</div><p>Le médecin liste tous les médicaments, y compris les cures courtes, les traitements terminés, les gouttes nasales, les laxatifs huileux et les produits non prescrits. Il note la date de début, la dose et la dose cumulée.</p>
<div class="lab">Pourquoi</div><p>Une toxicité peut survenir des mois après l’arrêt, comme avec la bléomycine ou l’amiodarone, dont la demi-vie est très longue.</p>
<div class="lab">Outil</div><p>Le médecin vérifie chaque molécule dans Pneumotox et dans l’information professionnelle suisse.</p></template>

<template data-pop="j69-ant-vap" data-title="Anamnèse du vapotage">
<div class="lab">Questions</div><p>Le médecin demande le type d’appareil, la fréquence, le contenu des liquides, en particulier le THC, et leur provenance. Il demande la date de la dernière utilisation.</p>
<div class="lab">Pourquoi</div><p>La définition de surveillance du CDC exige un usage dans les 90 jours précédant les symptômes. Les liquides non contrôlés contenant du THC ont été les plus impliqués.</p>
<div class="lab">Piège</div><p>Le patient ne mentionne pas spontanément le vapotage ni le cannabis ; la question doit être posée sans jugement.</p></template>

<template data-pop="j69-sx-dysp" data-title="Dyspnée : délai et vitesse d’installation">
<div class="lab">Lecture</div><p>Une dyspnée immédiate évoque un irritant soluble ou une obstruction. Une dyspnée après quelques heures évoque une pneumopathie chimique ou un gaz peu soluble. Une dyspnée progressive sur des semaines évoque une toxicité médicamenteuse ou radique.</p>
<div class="lab">Mesure</div><p>Le médecin quantifie la dyspnée par l’activité qu’elle limite, ce qui permet aussi de fixer le grade CTCAE.</p></template>

<template data-pop="j69-sx-toux" data-title="Toux sèche ou productive">
<div class="lab">Lecture</div><p>Une toux sèche oriente vers une atteinte interstitielle, médicamenteuse ou radique. Une toux productive oriente vers une infection, donc vers une pneumonie d’aspiration.</p>
<div class="lab">Toux aux repas</div><p>Une toux pendant ou juste après les repas est un signe d’aspiration ; elle impose un dépistage de la dysphagie.</p></template>

<template data-pop="j69-diff" data-title="Diagnostic différentiel : critère qui tranche">
<div class="lab">Infection</div><p>Elle se recherche par prélèvements avant une corticothérapie. Chez l’immunodéprimé, le lavage bronchoalvéolaire cherche les agents opportunistes.</p>
<div class="lab">Œdème cardiogénique</div><p>Des peptides natriurétiques élevés et une échocardiographie anormale le soutiennent ; il répond aux diurétiques.</p>
<div class="lab">Embolie pulmonaire</div><p>Elle se recherche par angio-TDM lorsque la probabilité clinique le justifie.</p>
<div class="lab">Progression tumorale</div><p>Elle se discute avec l’oncologue selon l’évolution et parfois l’histologie.</p></template>

<template data-pop="j69-bo" data-title="Bronchiolite oblitérante">
<div class="lab">Définition</div><p>La bronchiolite oblitérante est une fibrose des petites voies aériennes qui rétrécit ou obstrue les bronchioles. Après inhalation, elle se code J68.4.</p>
<div class="lab">Causes dans ce chapitre</div><p>Le dioxyde d’azote des silos, les fumées et certains arômes industriels peuvent la provoquer.</p>
<div class="lab">Clinique et examens</div><p>Le patient décrit une dyspnée progressive, et la spirométrie montre une obstruction fixe. Le scanner en expiration montre un piégeage aérique en mosaïque.</p>
<div class="lab">Pronostic</div><p>La lésion est en grande partie irréversible ; la prévention de l’exposition est essentielle.</p></template>

<template data-pop="j69-rads" data-title="Syndrome de dysfonctionnement réactif des voies aériennes">
<div class="lab">Définition</div><p>Ce syndrome, décrit par Brooks en 1985, est un asthme d’irritation apparu après une exposition unique à une forte concentration d’irritant. Il se code J68.3.</p>
<div class="lab">Critères de Brooks</div><p>Le patient a subi une exposition unique et intense. Les symptômes sont apparus en quelques heures, sans maladie respiratoire antérieure. Le test à la méthacholine est positif et les symptômes persistent, souvent plus d’un an.</p>
<div class="lab">Mécanisme</div><p>La lésion épithéliale et l’inflammation non immunologique rendent les bronches hyperréactives.</p>
<div class="lab">Traitement</div><p>Le bronchospasme aigu se traite par bêta-2 agoniste inhalé. Si l’hyperréactivité persiste, le traitement de fond suit les règles de l’asthme (cours J45). La déclaration à l’assureur-accidents s’impose si l’exposition est professionnelle.</p></template>

<template data-pop="j69-ohb" data-title="Oxygénothérapie hyperbare : indications ECHM">
<div class="lab">Principe</div><p>Le patient respire de l’oxygène pur dans un caisson pressurisé. La forte pression partielle d’oxygène déplace plus vite le monoxyde de carbone de l’hémoglobine.</p>
<div class="lab">Recommandations de l’ECHM 2016</div><p>Tout intoxiqué reçoit immédiatement de l’oxygène à 100 % (type 1, niveau C). L’oxygénothérapie hyperbare est recommandée en cas d’altération de la conscience ou de signe neurologique, cardiaque, respiratoire ou psychologique, quel que soit le taux (type 1, niveau B). Elle l’est aussi chez toute femme enceinte intoxiquée (type 1, niveau B). Une intoxication mineure peut recevoir 12 heures d’oxygène normobare ou une oxygénothérapie hyperbare (type 3). Le patient asymptomatique vu plus de 24 heures après l’exposition n’en relève pas.</p>
<div class="lab">En pratique suisse</div><p>Le médecin discute l’indication et le transfert avec Tox Info Suisse (145) et le centre hyperbare.</p></template>

<template data-pop="j69-eso" data-title="Recommandation ESO/ESSD 2021 sur la dysphagie">
<div class="lab">Référence</div><p>Dziewas R. et al. European Stroke Organisation et European Society for Swallowing Disorders, European Stroke Journal 2021.</p>
<div class="lab">Recommandations clés</div><p>Tout patient atteint d’un accident vasculaire cérébral aigu reçoit un dépistage formel de la dysphagie, le plus tôt possible. Il ne reçoit aucun aliment, liquide ni médicament oral avant ce dépistage. Les soins d’hygiène buccale sont suggérés pour réduire le risque de pneumonie ; la recommandation est faible.</p>
<div class="lab">Preuves</div><p>Le dépistage s’associe à moins de pneumonies (rapport de cotes 0,55) ; le dépistage précoce à 9 % contre 15 %. Ces données sont observationnelles ; la force de la recommandation a été relevée parce que le dépistage est sans danger.</p></template>

<template data-pop="j69-lptab" data-title="Loi sur les produits du tabac">
<div class="lab">Contenu</div><p>La loi fédérale sur les produits du tabac et son ordonnance sont en vigueur depuis le 1er octobre 2024. Elles interdisent dans toute la Suisse la remise de produits du tabac aux moins de 18 ans et réglementent les cigarettes électroniques avec ou sans nicotine.</p>
<div class="lab">Portée clinique</div><p>La loi ne contrôle pas les liquides obtenus hors du commerce légal, qui ont été les plus impliqués dans les lésions liées au vapotage.</p>
<div class="lab">Source</div><p>Office fédéral de la santé publique, page « Loi sur les produits du tabac », consultée le 08.10.2026.</p></template>

<template data-pop="j69-pv" data-title="Déclaration de pharmacovigilance">
<div class="lab">Obligation</div><p>En Suisse, un effet indésirable grave ou inattendu se déclare à Swissmedic. Une pneumopathie médicamenteuse entre dans cette catégorie.</p>
<div class="lab">Mode d’emploi</div><p>Le médecin déclare par le portail électronique de Swissmedic, avec le médicament, les dates, le tableau et l’évolution.</p>
<div class="lab">Pourquoi</div><p>Les déclarations alimentent la détection des signaux de sécurité, surtout pour les nouveaux anticancéreux.</p></template>

<template data-pop="j69-src-asp" data-title="Arbitrage des recommandations sur l’aspiration">
<div class="lab">Question</div><p>Quel antibiotique, quelle durée, et faut-il couvrir les anaérobies dans la pneumonie d’aspiration ?</p>
<div class="lab">Sources comparées</div><p>La SSI suisse, reprise dans le cours J18, retient l’amoxicilline-acide clavulanique 2,2 g toutes les 8 heures par voie intraveineuse. La SPILF 2025, la plus récente, retient le même antibiotique pendant 5 jours si l’évolution est favorable. L’ATS et l’IDSA 2019 déconseillent l’ajout systématique d’un anti-anaérobie, sauf abcès ou empyème ; cette recommandation est conditionnelle et de très faible niveau de preuve.</p>
<div class="lab">Choix retenu</div><p>Le cours retient l’antibiotique et la dose de la SSI, applicables en Suisse, et la durée de 5 jours de la SPILF 2025, source la plus récente. Les trois sources concordent sur l’absence de couverture anaérobie supplémentaire sans abcès.</p>
<div class="lab">Limites</div><p>Le texte intégral de la SPILF 2025 n’a pas été accessible ; seuls ses points clés ont été lus. La fiche SSI a été lue par le cours J18, non directement par ce cours. Aucune étude randomisée de grande taille ne compare les durées dans cette population.</p>
<div class="lab">Textes</div><p><a data-reference-source="1" href="https://doi.org/10.1016/j.idnow.2025.105081" target="_blank" rel="noopener">SPILF 2025</a> · <a data-reference-source="1" href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6812437/" target="_blank" rel="noopener">ATS/IDSA 2019</a> · <a data-reference-source="1" href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">SSI, pneumonie</a></p></template>

<template data-pop="j69-ctcae" data-title="Grades CTCAE de la pneumopathie">
<div class="lab">Définition</div><p>Les Common Terminology Criteria for Adverse Events, version 5.0, publiés par l’Institut national du cancer américain, cotent la gravité des effets indésirables.</p>
<div class="lab">Grades de la pneumopathie</div><p>Le grade 1 correspond à une anomalie radiologique sans symptôme. Au grade 2, les symptômes nécessitent un traitement et limitent les activités instrumentales, comme faire ses courses. Au grade 3, les symptômes sévères limitent les soins personnels ou exigent de l’oxygène. Le grade 4 désigne une menace vitale qui impose une intervention urgente, comme l’intubation. Le grade 5 correspond au décès.</p>
<div class="lab">Conséquence pratique</div><p>Le grade décide de la suspension du médicament, de la voie et de la dose des corticoïdes.</p>
<div class="lab">Limite</div><p>Les systèmes de cotation diffèrent : la corticothérapie classe une pneumopathie radique en grade 3 selon le système du Radiation Therapy Oncology Group et en grade 2 selon d’autres, comme le rappelle QUANTEC.</p></template>
