
<!-- ===== FENÊTRES : examen clinique et examens complémentaires ===== -->
<template data-pop="j69-ex-fr" data-title="Fréquence respiratoire : seuil de gravité">
<div class="lab">Normal</div><p>Un adulte au repos respire 12 à 20 fois par minute.</p>
<div class="lab">Technique</div><p>Le médecin compte pendant une minute entière, sans prévenir le patient, car l’attention modifie le rythme.</p>
<div class="lab">Valeur</div><p>Au-delà de 30 par minute, le travail respiratoire est élevé et la fatigue musculaire menace ; c’est un critère de gravité de la pneumonie, repris dans le cours J18.</p>
<div class="lab">Piège</div><p>Une fréquence qui baisse chez un patient épuisé peut annoncer un arrêt respiratoire et non une amélioration.</p></template>

<template data-pop="j69-ex-spo2" data-title="SpO₂ et monoxyde de carbone">
<div class="lab">Principe</div><p>L’oxymètre de pouls compare l’absorption de deux longueurs d’onde par le sang pulsé pour estimer la part d’hémoglobine oxygénée.</p>
<div class="lab">Limite majeure</div><p>La carboxyhémoglobine absorbe la lumière rouge comme l’oxyhémoglobine. L’oxymètre classique la compte donc comme de l’oxyhémoglobine et affiche une saturation faussement normale.</p>
<div class="lab">Conséquence</div><p>Après un incendie, le médecin demande une co-oxymétrie ; il ne se fie pas à une SpO₂ normale.</p></template>

<template data-pop="j69-ex-suie" data-title="Signes d’inhalation de fumées">
<div class="lab">Signes</div><p>Le médecin cherche de la suie dans le nez, la bouche ou les crachats, des brûlures du visage et des poils du nez brûlés. Il écoute la voix, à la recherche d’une raucité, et un stridor.</p>
<div class="lab">Valeur</div><p>La suie prouve l’exposition aux fumées mais ne mesure pas la gravité de la lésion. La voix rauque et le stridor signalent un œdème laryngé.</p>
<div class="lab">Conséquence</div><p>L’œdème progresse pendant 24 heures. Le médecin réévalue le patient de façon répétée et intube précocement en cas de doute sur la progression, selon Galeiras (2021).</p></template>

<template data-pop="j69-ex-crep" data-title="Crépitants bilatéraux">
<div class="lab">Technique</div><p>Le médecin ausculte les bases en fin d’inspiration, en faisant tousser le patient pour distinguer les crépitants des sécrétions mobilisables.</p>
<div class="lab">Valeur</div><p>Des crépitants fins bilatéraux évoquent une atteinte interstitielle ou un œdème. Des crépitants localisés à une base évoquent une condensation.</p>
<div class="lab">Piège</div><p>L’insuffisance cardiaque donne les mêmes crépitants ; les peptides natriurétiques et l’échocardiographie la recherchent.</p></template>

<template data-pop="j69-ex-eau" data-title="Test de déglutition à l’eau">
<div class="lab">Technique</div><p>Le patient vigilant, assis droit, boit une petite quantité d’eau, puis davantage si la première gorgée est tolérée. L’observateur surveille la toux, la voix et la saturation.</p>
<div class="lab">Interprétation</div><p>Une toux, une voix mouillée, un essoufflement ou une chute de saturation rendent le test positif. Le patient reste alors à jeun par la bouche jusqu’à l’évaluation spécialisée.</p>
<div class="lab">Limite</div><p>Un test négatif n’exclut pas une aspiration silencieuse ; la vidéofluoroscopie ou la fibroscopie la recherchent si la suspicion persiste.</p></template>

<template data-pop="j69-cooxy" data-title="Co-oxymétrie : fiche d’interprétation">
<div class="lab">Principe</div><p>Le co-oxymètre mesure l’absorption du sang à plusieurs longueurs d’onde. Il sépare l’oxyhémoglobine, la désoxyhémoglobine, la carboxyhémoglobine et la méthémoglobine.</p>
<div class="lab">Prélèvement</div><p>Un sang artériel ou veineux convient pour la carboxyhémoglobine. Le médecin note l’heure de fin d’exposition et le début de l’oxygène.</p>
<div class="lab">Interprétation</div><p>Le taux est faible chez le non-fumeur et plus élevé chez le fumeur. Les manifestations cliniques apparaissent au-delà de 15 % selon Galeiras (2021), mais la corrélation avec la gravité est faible.</p>
<div class="lab">Erreur fréquente</div><p>Le médecin exclut à tort une intoxication sur un taux bas mesuré après plusieurs heures d’oxygène.</p></template>

<template data-pop="j69-lactate" data-title="Lactate et cyanure">
<div class="lab">Pourquoi le doser</div><p>Le cyanure bloque la chaîne respiratoire mitochondriale ; la cellule bascule vers la glycolyse anaérobie et produit du lactate. Le lactate est disponible en quelques minutes, contrairement au cyanure.</p>
<div class="lab">Interprétation</div><p>Chez une victime d’incendie en espace clos, un lactate ≥ 7,5 mmol/L fait partie des critères d’administration de l’hydroxocobalamine selon Galeiras (2021). L’information produit espagnole du Cyanokit mentionne un lactate ≥ 10 mmol/L comme élément évocateur.</p>
<div class="lab">Limite</div><p>Le choc, les convulsions et l’hypoxémie élèvent aussi le lactate. Le seuil est un argument, pas une preuve.</p>
<div class="lab">Décision</div><p>En présence de signes neurologiques ou d’instabilité, l’antidote se donne sans attendre le lactate.</p></template>

<template data-pop="j69-lba-lip" data-title="Macrophages chargés de lipides">
<div class="lab">Technique</div><p>Le liquide de lavage bronchoalvéolaire est coloré par l’Oil Red O, qui colore les lipides neutres en rouge.</p>
<div class="lab">Valeur</div><p>De nombreux macrophages chargés de lipides soutiennent une pneumonie lipidique exogène dans le contexte d’une exposition à une huile.</p>
<div class="lab">Limite</div><p>Des macrophages chargés de lipides existent aussi dans d’autres situations, dont l’aspiration chronique de lait chez l’enfant ; leur présence seule ne suffit pas.</p></template>

<template data-pop="j69-vfs" data-title="Vidéofluoroscopie et fibroscopie de déglutition">
<div class="lab">Vidéofluoroscopie</div><p>Le patient avale des bolus de différentes textures contenant un produit de contraste, sous radioscopie filmée. L’examen montre chaque phase de la déglutition et l’entrée du bolus dans le larynx.</p>
<div class="lab">Fibroscopie de déglutition</div><p>Un endoscope souple passé par le nez montre le pharynx et le larynx avant et après la déglutition. Elle se fait au lit et sans irradiation.</p>
<div class="lab">Valeur</div><p>Ces deux examens de référence démontrent l’aspiration silencieuse et testent l’effet des textures et des postures.</p>
<div class="lab">Conséquence</div><p>Le logopédiste prescrit les textures sûres, par exemple des liquides épaissis, et les manœuvres de protection.</p></template>
