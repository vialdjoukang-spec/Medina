<template data-pop="j69-d-amc" data-title="Amoxicilline-acide clavulanique">
<div class="lab">Mécanisme</div><p>L’amoxicilline inhibe la synthèse de la paroi bactérienne. L’acide clavulanique inhibe les bêtalactamases produites par certains bacilles à Gram négatif, staphylocoques et anaérobies, qui détruiraient sinon l’amoxicilline.</p>
<div class="lab">Place</div><p>C’est le traitement de première ligne de la pneumonie d’aspiration selon la SSI et la SPILF 2025. Son spectre couvre déjà une partie des anaérobies ; l’ATS et l’IDSA 2019 déconseillent d’y ajouter un anti-anaérobie sans abcès ni empyème.</p>
<div class="lab">Posologie suisse</div><p>Co-Amoxicillin Labatec 2,2 g : 2,2 g en perfusion d’au moins 30 minutes, 3 à 4 fois par jour, au maximum 6 fois, dans les infections sévères ; le schéma SSI retient 2,2 g toutes les 8 heures. L’information professionnelle d’Augmentin 1 g prévoit un comprimé 2 fois par jour, et 3 fois au maximum dans les infections sévères. Le relais oral retenu ici suit la SSI, comme dans J18 : un comprimé toutes les 8 heures, au début du repas. Durée totale de 5 jours si l’évolution est favorable.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Le traitement expose à la diarrhée, à l’infection à <i>Clostridioides difficile</i>, à l’éruption et à une atteinte hépatique cholestatique. Il est contre-indiqué en cas d’allergie aux bêtalactamines et après un ictère ou une atteinte hépatique survenus lors d’un traitement antérieur.</p>
<div class="lab">Adaptation</div><p>L’information professionnelle prévoit une adaptation en cas d’insuffisance rénale sévère ; le médecin consulte son schéma complet. Pour la grossesse et l’allaitement, le résumé compendium.ch renvoie au texte intégral.</p>
<div class="lab">Source</div><p>Information professionnelle suisse, compendium.ch, Co-Amoxicillin Labatec 2,2 g et Augmentin 1 g, consultées le 08.10.2026.</p></template>

<template data-pop="j69-d-o2" data-title="Oxygène normobare et hyperbare">
<div class="lab">Mécanisme</div><p>L’oxygène augmente la pression alvéolaire en oxygène et corrige l’hypoxémie. À forte pression partielle, il déplace le monoxyde de carbone de l’hémoglobine et accélère son élimination ; l’effet est plus marqué en caisson hyperbare.</p>
<div class="lab">Cibles</div><p>En dehors de l’intoxication, la cible est une SpO₂ de 94 à 98 % sans risque d’hypercapnie, et de 88 à 92 % chez le patient à risque. En cas de monoxyde de carbone, l’oxygène se donne à 100 % quelle que soit la SpO₂.</p>
<div class="lab">Précaution</div><p>Une fraction inspirée élevée aggrave le stress oxydatif chez le patient exposé à la bléomycine ; la cible se respecte alors strictement.</p>
<div class="lab">Source</div><p>ECHM 2016 ; British Thoracic Society, cible reprise dans le cours J18.</p></template>

<template data-pop="j69-d-hydroxo" data-title="Hydroxocobalamine (Cyanokit)">
<div class="lab">Mécanisme</div><p>Le cobalt de l’hydroxocobalamine lie le cyanure et forme la cyanocobalamine, éliminée par le rein.</p>
<div class="lab">Indications</div><p>L’antidote est indiqué en cas d’intoxication avérée ou suspectée par le cyanure, notamment chez une victime d’incendie en espace clos avec suie, trouble de conscience, convulsions, arrêt respiratoire, hypotension ou lactate élevé.</p>
<div class="lab">Posologie adulte</div><p>L’adulte reçoit 5 g, soit le flacon reconstitué de 200 mL, en perfusion intraveineuse de 15 minutes. Une deuxième dose de 5 g peut suivre selon la gravité, en 15 minutes à 2 heures. La dose totale maximale est de 10 g.</p>
<div class="lab">Effets indésirables</div><p>L’hydroxocobalamine colore la peau et les urines en rouge, élève transitoirement la pression artérielle et interfère avec les dosages colorimétriques et certaines mesures d’oxymétrie.</p>
<div class="lab">Précautions</div><p>Elle se perfuse par une voie séparée. Les prélèvements sanguins se font avant l’administration lorsque cela ne retarde pas le traitement.</p>
<div class="lab">Source</div><p>Agence européenne des médicaments, résumé public et information produit du Cyanokit ; compendium.ch, Cyanokit 5 g, fiche produit sans information professionnelle détaillée, consultée le 08.10.2026.</p></template>

<template data-pop="j69-d-cort" data-title="Glucocorticoïdes systémiques">
<div class="lab">Mécanisme</div><p>Les glucocorticoïdes inhibent la transcription des gènes inflammatoires, réduisent le recrutement des lymphocytes et des polynucléaires et stabilisent la perméabilité capillaire.</p>
<div class="lab">Indications dans ce chapitre</div><p>Ils sont indiqués dans la pneumopathie médicamenteuse de grade 2 ou plus, dans la pneumopathie radique symptomatique et, selon l’avis du pneumologue, dans la lésion liée au vapotage. Leur bénéfice n’est pas démontré dans la pneumopathie chimique d’aspiration ni après inhalation de fumées.</p>
<div class="lab">Posologie</div><p>Au grade 2 sous immunothérapie, le patient reçoit de la prednisone, 1 à 2 mg/kg par jour. Au grade 3 ou 4, il reçoit de la méthylprednisolone, 1 à 2 mg/kg par jour par voie intraveineuse. La SITC 2021 prévoit une décroissance sur 4 à 6 semaines. Dans la pneumopathie radique, la prednisone se donne jusqu’à 60 mg par jour pendant 2 à 4 semaines, puis décroît sur 3 à 12 semaines.</p>
<div class="lab">Formes suisses</div><p>La prednisone existe notamment en comprimés de 20 et 50 mg (Prednisone Streuli) ; la méthylprednisolone injectable existe sous forme de substance sèche (Solu-Medrol).</p>
<div class="lab">Effets indésirables et surveillance</div><p>Les glucocorticoïdes provoquent hyperglycémie, hypertension, troubles de l’humeur et du sommeil, gastrite, ostéoporose et infections opportunistes, dont la pneumocystose. La glycémie se surveille et une prophylaxie se discute au-delà d’un mois.</p>
<div class="lab">Source</div><p>SITC 2021 ; Rahi et al. 2021 ; compendium.ch, Prednisone Streuli et Solu-Medrol, consultés le 08.10.2026.</p></template>

<template data-pop="j69-d-2l" data-title="Immunosuppresseurs de deuxième ligne">
<div class="lab">Indication</div><p>Ils servent dans la pneumopathie liée aux inhibiteurs de points de contrôle immunitaire qui ne s’améliore pas en 72 heures sous corticoïdes à forte dose, ou qui menace la vie.</p>
<div class="lab">Options selon la SITC 2021, sans ordre de préférence</div><p>La SITC cite le mycophénolate mofétil, 1 à 1,5 g deux fois par jour, et les immunoglobulines intraveineuses, 2 g/kg réparties sur 2 à 5 jours. Elle cite aussi l’infliximab, 5 mg/kg en une dose répétable 14 jours plus tard, le cyclophosphamide et le tocilizumab.</p>
<div class="lab">Niveau de preuve</div><p>Ces options reposent sur des séries de cas et des avis d’experts, sans essai contrôlé. Leur usage est hors du cadre de l’autorisation suisse dans cette indication.</p>
<div class="lab">Précaution</div><p>Avant l’infliximab, le médecin recherche une tuberculose latente et une hépatite B lorsque le délai le permet.</p></template>

<template data-pop="j69-amio" data-title="Amiodarone : toxicité pulmonaire">
<div class="lab">Médicament</div><p>L’amiodarone est un antiarythmique de classe III riche en iode, à demi-vie très longue. L’information professionnelle suisse de la Cordarone prévoit une dose de charge de 600 à 1000 mg par jour pendant 8 à 10 jours, puis un entretien de 100 à 400 mg par jour.</p>
<div class="lab">Mécanisme</div><p>La lésion associe une accumulation phospholipidique dans les macrophages et les pneumocytes de type II, une toxicité oxydative et, chez certains patients, une composante immunitaire.</p>
<div class="lab">Fréquence et facteurs</div><p>Les séries récentes rapportent 1,6 à 2,9 %. La plupart des cas surviennent au-delà de 400 mg par jour et après deux mois, mais des cas existent à 200 mg par jour. Une maladie pulmonaire préexistante augmente le risque.</p>
<div class="lab">Diagnostic</div><p>Le patient présente une dyspnée, une toux sèche et parfois de la fièvre. Le scanner montre des opacités interstitielles ou des condensations, parfois hyperdenses, et la DLCO baisse. Les macrophages spumeux du lavage témoignent de l’exposition seulement.</p>
<div class="lab">Conduite</div><p>Le médecin arrête l’amiodarone en concertation avec le cardiologue. Une corticothérapie se prescrit dans les formes symptomatiques, en pratique sur plusieurs mois, sans essai contrôlé pour la guider. L’amélioration est lente, à cause de la demi-vie.</p></template>

<template data-pop="j69-mtx" data-title="Méthotrexate : pneumopathie d’hypersensibilité">
<div class="lab">Tableau</div><p>Une toux sèche, une dyspnée et une fièvre s’installent de façon subaiguë, souvent pendant la première année, avec des opacités en verre dépoli. Le mécanisme est une hypersensibilité, indépendante de la dose.</p>
<div class="lab">Données</div><p>Dans une méta-analyse de 22 essais chez 8584 patients atteints de polyarthrite rhumatoïde, le méthotrexate augmentait légèrement les événements respiratoires (risque relatif 1,10) et les infections respiratoires, sans augmenter la mortalité pulmonaire. Dans le sous-groupe d’essais qui décrivaient la pneumopathie, le risque relatif était de 7,81, avec un intervalle de confiance large.</p>
<div class="lab">Conduite</div><p>Le médecin arrête le méthotrexate et exclut une infection, en particulier une pneumocystose. Il prescrit ensuite une corticothérapie dans les formes symptomatiques et évite la réexposition.</p>
<div class="lab">Source</div><p>Conway R. et al., Arthritis &amp; Rheumatology 2014.</p></template>

<template data-pop="j69-nitro" data-title="Nitrofurantoïne : formes aiguë et chronique">
<div class="lab">Forme aiguë</div><p>Elle survient en quelques heures à semaines : fièvre, toux, dyspnée, opacités interstitielles, souvent éosinophilie ou éruption. Son incidence est d’environ 1 sur 5000 après une première exposition. Elle est attribuée surtout à une réaction de type III et régresse rapidement après l’arrêt.</p>
<div class="lab">Forme chronique</div><p>Elle survient après des mois ou des années de prophylaxie urinaire : dyspnée progressive et pneumopathie interstitielle, parfois fibrosante. Une atteinte respiratoire grave nécessitant une hospitalisation touche environ 1 utilisateur prolongé sur 750. Les femmes représentent 85 à 94 % des cas, parce qu’elles reçoivent plus souvent ce traitement.</p>
<div class="lab">Conduite</div><p>La nitrofurantoïne est arrêtée définitivement ; une corticothérapie se discute dans les formes chroniques sévères. Le médecin inscrit la toxicité au dossier pour éviter une nouvelle prescription.</p>
<div class="lab">Source</div><p>Kaye A. D. et al., Toxics 2025.</p></template>

<template data-pop="j69-d-bleo" data-title="Bléomycine">
<div class="lab">Mécanisme</div><p>La bléomycine forme avec le fer un complexe qui produit des espèces réactives de l’oxygène et coupe l’ADN. Le poumon contient peu de bléomycine hydrolase, l’enzyme qui l’inactive.</p>
<div class="lab">Facteurs de risque</div><p>L’âge avancé, l’insuffisance rénale, la bronchopneumopathie chronique obstructive et une réserve pulmonaire réduite augmentent le risque. Une fraction inspirée d’oxygène élevée aggrave la lésion.</p>
<div class="lab">Clinique</div><p>La toux, la dyspnée et les crépitants précèdent une pneumopathie interstitielle qui peut évoluer vers la fibrose.</p>
<div class="lab">Conduite</div><p>L’oncologue arrête la bléomycine et discute une corticothérapie ; l’oxygénothérapie reste mesurée. Les protocoles sans bléomycine sont préférés chez les patients à risque.</p>
<div class="lab">Source</div><p>Olah P. et al., Frontiers in Immunology 2026.</p></template>
