<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j67-bases" data-title="Pareto — Définition, épidémiologie, mécanismes et étiologies">
<p class="ratio" data-cover="j67-0,j67-1,j67-2,j67-3,j67-4"></p>
<ul>
<li>La pneumopathie d’hypersensibilité est une atteinte inflammatoire ou fibrosante du parenchyme et des petites voies aériennes, due à un antigène inhalé chez un sujet sensibilisé.</li>
<li>La classification actuelle oppose la forme non fibrosante, souvent réversible, à la forme fibrosante, de pronostic réduit ; seule l’imagerie ou l’histologie classe.</li>
<li>J67 code la source de l’antigène, avec un cinquième caractère pour l’exacerbation ; J66 code les atteintes bronchiques comme la byssinose.</li>
<li>Les particules de 1 à 5 µm atteignent la bronchiole : réaction de type III en 4 à 8 heures, puis granulomes de type IV, puis fibrose si l’exposition persiste.</li>
<li>Les sources principales sont les oiseaux et le duvet, le foin moisi, les humidificateurs et les fluides d’usinage ; aucun antigène n’est trouvé chez jusqu’à la moitié des formes fibrosantes.</li>
<li>Un antigène non identifié, la fibrose, une DLCO basse et le tabac sont associés à un pronostic défavorable.</li></ul></template>

<template data-pop="pareto-j67-diag" data-title="Pareto — Anamnèse, examen, diagnostic et urgences">
<p class="ratio" data-cover="j67-5,j67-6,j67-7,j67-8"></p>
<ul>
<li>L’exposition est le meilleur prédicteur : travail, domicile, loisirs, oiseaux, duvet, humidificateurs.</li>
<li>Fièvre et dyspnée 4 à 8 heures après l’exposition, améliorées loin de la source, signent la forme non fibrosante.</li>
<li>Crépitants fins, couinements inspiratoires et désaturation d’effort orientent l’examen.</li>
<li>Exposition identifiée, aspect typique et lymphocytes du lavage supérieurs à 30 % : confiance élevée ; sinon, discussion multidisciplinaire.</li>
<li>Les six prédicteurs de Lacasse (2003) sont l’exposition à un antigène connu, des précipitines positives, des épisodes récidivants, des crépitants inspiratoires, des symptômes 4 à 8 heures après l’exposition et une perte de poids.</li>
<li>Le diagnostic différentiel commence par l’infection, l’exacerbation de fibrose pulmonaire idiopathique et la pneumopathie médicamenteuse, puis la sarcoïdose, la connectivite et le syndrome toxique des poussières organiques.</li>
<li>Une infection doit être exclue avant tout immunosuppresseur.</li>
<li>Aggravation brutale : infection, réexposition ou exacerbation aiguë ; hypertension pulmonaire si la désaturation est disproportionnée.</li></ul></template>

<template data-pop="pareto-j67-pec" data-title="Pareto — Prise en charge, byssinose et aspects professionnels">
<p class="ratio" data-cover="j67-9,j67-10,j67-11"></p>
<ul>
<li>L’éviction est la première mesure dans tous les cas ; le masque ne la remplace pas.</li>
<li>Forme non fibrosante modérée à sévère : prednisone 0,5 mg/kg ou 40 mg par jour, décroissance sur 2 à 3 mois.</li>
<li>Forme fibrosante inflammatoire : prednisone au maximum 0,5 mg/kg, réévaluation à 4–6 semaines, puis mycophénolate ou azathioprine.</li>
<li>Forme fibrosante progressive : nintédanib, évaluation précoce de transplantation.</li>
<li>Byssinose : oppression du lundi, chute du VEMS sur le poste, endotoxine ; réduire l’exposition.</li>
<li>L’annexe 1 de l’OLAA couvre les poussières organiques ; l’indépendant n’est couvert que par l’assurance facultative.</li></ul></template>

<template data-pop="pareto-j67-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j67-12,j67-13,j67-14"></p>
<ul>
<li>Suivi : vérifier l’éviction, réévaluer la corticothérapie à 4–6 semaines, mesurer CVF et DLCO tous les 3 à 6 mois si fibrose.</li>
<li>Fibrose progressive : baisse absolue de la CVF d’au moins 5 % ou de la DLCO d’au moins 10 % en un an, parmi d’autres critères.</li>
<li>Nintédanib et mycophénolate sont incompatibles avec la grossesse.</li>
<li>Diagnostic ATS/JRS/ALAT 2020 : exposition, tomodensitométrie typique, lymphocytose ou histologie ; IgG positives ne prouvent que l’exposition.</li></ul></template>

<template data-pop="pareto-j67-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j67-e-1,j67-e-2,j67-e-3,j67-e-4,j67-e-5,j67-e-6,j67-e-7"></p>
<ul>
<li>Tomodensitométrie en inspiration et en expiration : infiltration ou fibrose et signe des petites voies aériennes ; motif à trois densités très spécifique.</li>
<li>Fonction : restriction et DLCO basse ; désaturation d’effort ; chute du VEMS sur le poste dans la byssinose.</li>
<li>IgG spécifiques : exposition et sensibilisation, pas la maladie.</li>
<li>Lavage : lymphocytes supérieurs à 30 % en faveur ; aucun seuil ne prouve ; il exclut l’infection ; rapport CD4/CD8 inutile.</li>
<li>Histologie typique : atteinte centrée sur la bronchiole et granulomes mal formés.</li>
<li>La tomodensitométrie se fait à dose réduite de 1 à 3 mSv, avec une série en expiration, et se lit avec un radiologue thoracique.</li>
<li>Chez le sujet sain non fumeur, le lavage contient environ 10 à 15 % de lymphocytes ; la forme fibrosante en a moins que la forme non fibrosante.</li>
<li>Deux semaines d’éviction : sensibilité 51 %, spécificité 81 % ; la provocation se fait en centre expert, jamais dans une forme fibrosante à source évidente.</li>
<li>Pièges : syndrome toxique des poussières organiques, fibrose pulmonaire idiopathique, byssinose.</li></ul></template>

<template data-pop="pareto-j67-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j67-p-1,j67-p-2,j67-p-3,j67-p-4"></p>
<ul>
<li>Seul le nintédanib a une autorisation suisse couvrant la forme fibrosante progressive ; prednisone, mycophénolate, azathioprine et pirfénidone s’emploient selon la S2k.</li>
<li>Nintédanib 150 mg deux fois par jour, 100 mg en cas d’intolérance ou de Child-Pugh A ; surveiller le foie et la diarrhée.</li>
<li>Azathioprine : dose au quart avec l’allopurinol ; penser à TPMT et NUDT15.</li>
<li>Pirfénidone contre-indiquée avec la fluvoxamine.</li>
<li>Arrêter une corticothérapie sans bénéfice dans une forme fibrosante.</li></ul></template>
