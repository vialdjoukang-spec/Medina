<section class="ilot" id="j67-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un agriculteur de 52 ans, éleveur laitier dans le Jura, consulte en février. Depuis trois semaines, il tousse et s’essouffle en montant à la grange. Chaque soir, environ six heures après avoir distribué le foin, il frissonne, mesure 38,4 °C et se sent courbaturé. Les week-ends où son fils assure l’affouragement, il va mieux. Il n’a jamais fumé. Un médecin de garde a prescrit de l’amoxicilline pour une « pneumonie », sans effet. À l’auscultation, le médecin entend des râles crépitants fins aux deux bases. La saturation pulsée vaut 93 % au repos.</p>
<p>La question qui structure tout le cours est la suivante : <b>ce patient a-t-il une pneumopathie d’hypersensibilité, quel antigène la provoque, la maladie est-elle déjà fibrosante, et que faut-il faire pour son poumon, son exploitation et ses droits d’assuré ?</b></p>
<p>Le même cours traite une seconde famille de maladies dues aux poussières organiques : la byssinose et les atteintes apparentées des voies aériennes, réunies dans la catégorie J66. Elles touchent les bronches et non les alvéoles, et elles ne reposent pas sur une sensibilisation lymphocytaire. Les confondre conduit à des examens et à des traitements inadaptés.</p>
<p>À la fin de ce cours, le médecin assistant sait reconnaître une pneumopathie d’hypersensibilité à l’anamnèse d’exposition, distinguer la forme non fibrosante de la forme fibrosante, interpréter la tomodensitométrie, les IgG spécifiques et le lavage bronchoalvéolaire, conduire l’éviction de l’antigène, décider d’une corticothérapie ou d’un antifibrosant, reconnaître une byssinose et déclarer une maladie professionnelle à l’assureur-accidents.</p>
<div class="key"><b>Message fondateur.</b> Dans la pneumopathie d’hypersensibilité, le traitement le plus efficace n’est pas un médicament : c’est la <button class="w" data-k="j67-evict">suppression de l’exposition à l’antigène (éviction et test d’éviction)</button>. Un antigène non identifié est associé à une survie plus courte dans la forme fibrosante. Chaque question d’anamnèse d’exposition omise peut donc coûter des années de fonction respiratoire.</div>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="j67-lobule">lobule pulmonaire secondaire et la bronchiole terminale (anatomie radiologique)</button>, les <button class="w" data-k="j67-hyper">réactions d’hypersensibilité de types III et IV (immunologie)</button> et la <button class="w" data-k="j67-efr">restriction et le trouble de la diffusion (épreuves fonctionnelles)</button>. L’onglet Sciences fondamentales les développe.</div>
</section>

<section class="ilot" id="j67-1"><h2><span class="n">1</span>Définition, classifications et codage</h2>
<p>La recommandation de l’American Thoracic Society, de la Japanese Respiratory Society et de l’Asociación Latinoamericana de Tórax (ATS/JRS/ALAT, 2020) définit la pneumopathie d’hypersensibilité comme une maladie inflammatoire, fibrosante ou mixte du parenchyme pulmonaire et des petites voies aériennes. Elle résulte habituellement d’une réaction immunitaire provoquée par un antigène inhalé, apparent ou caché, chez un sujet prédisposé. Le terme « sujet prédisposé » rappelle qu’une sensibilisation est indispensable : sur cent éleveurs de pigeons exposés, une minorité seulement tombe malade.</p>
<p>L’ancien nom d’alvéolite allergique extrinsèque reste celui de la CIM-10-GM. Le mot « allergique » ne désigne pas ici une allergie à IgE comme dans l’asthme : la réaction repose sur des IgG et des lymphocytes T, ce qui explique l’absence de prurit, d’urticaire et de réponse aux antihistaminiques.</p>
<h3>1.1 La classification actuelle : fibrosante ou non fibrosante</h3>
<p>Les formes aiguë, subaiguë et chronique ont été abandonnées par ATS/JRS/ALAT 2020, car leurs limites variaient d’une étude à l’autre et prédisaient mal l’évolution. La présence d’une fibrose à la tomodensitométrie ou à l’histologie est le principal déterminant du pronostic. Le comité a donc retenu deux phénotypes, décrits dans la <button class="w" data-k="j67-fib">classification fibrosante et non fibrosante (critères et portée)</button>.</p>
<p>Le tableau suivant répond à une question pratique : à quoi reconnaît-on chaque phénotype, et qu’est-ce que cela change pour le patient ?</p>
<table class="t"><tr><th>Phénotype</th><th>Ce qui le définit</th><th>Présentation habituelle</th><th>Conséquence</th></tr>
<tr><td><b>Non fibrosant</b></td><td>Inflammation pure, sans fibrose en imagerie ni en histologie</td><td>Exposition souvent identifiable, début rapide, signes généraux, nodules centrolobulaires, lymphocytose du lavage</td><td>Guérison ou stabilisation possible après éviction</td></tr>
<tr><td><b>Fibrosant</b></td><td>Fibrose prédominante, pure ou mêlée d’inflammation</td><td>Début insidieux sur des mois ou des années, antigène souvent introuvable, symptômes respiratoires isolés</td><td>Survie réduite, surtout avec un aspect de pneumopathie interstitielle commune</td></tr></table>
<p>La lecture commence par la colonne « ce qui le définit » : seule l’imagerie ou l’histologie classe le patient. L’erreur fréquente consiste à appeler « aiguë » une forme fibrosante qui se décompense brutalement. Le patient de l’îlot 0 a des symptômes récents, mais seule sa tomodensitométrie dira s’il a déjà de la fibrose.</p>
<div class="trap"><span class="k">Piège</span>La recommandation allemande S2k de 2024 conserve d’abord la distinction aiguë ou chronique, parce qu’elle sert à l’expertise de maladie professionnelle, puis subdivise la forme chronique en fibrosante ou non fibrosante. Les deux vocabulaires coexistent donc dans les rapports suisses. Le choix entre les recommandations est expliqué dans la <button class="w" data-k="j67-reco">comparaison des trois recommandations (ATS/JRS/ALAT 2020, CHEST 2021, S2k 2024)</button>.</div>
<h3>1.2 Codage CIM-10-GM 2024</h3>
<p>La catégorie J67 regroupe les alvéolites allergiques dues aux poussières organiques. Chaque sous-code reçoit un cinquième caractère : 0 sans mention d’exacerbation aiguë, 1 avec mention d’exacerbation aiguë. La catégorie J66 regroupe les atteintes des voies aériennes dues à des poussières organiques précisées ; elle exclut explicitement l’alvéolite allergique (J67) et le syndrome réactionnel de dysfonction des voies respiratoires (J68.3).</p>
<p>Le tableau suivant relie chaque sous-code à sa source d’antigène, car le code dit d’abord où chercher l’exposition.</p>
<table class="t"><tr><th>Code</th><th>Intitulé CIM-10-GM 2024</th><th>Source et agent principal</th></tr>
<tr><td>J67.0</td><td>Poumon de fermier</td><td>Foin, paille ou céréales moisis ; actinomycètes thermophiles et moisissures</td></tr>
<tr><td>J67.1</td><td>Bagassose</td><td>Bagasse moisie (résidu de canne à sucre) ; actinomycètes thermophiles</td></tr>
<tr><td>J67.2</td><td>Poumon des oiseleurs</td><td>Déjections, plumes, duvet et sérum d’oiseaux (pigeons, perruches)</td></tr>
<tr><td>J67.3</td><td>Subérose</td><td>Liège moisi ; <i>Penicillium glabrum</i></td></tr>
<tr><td>J67.4</td><td>Poumon des malteurs</td><td>Orge germée moisie ; <i>Aspergillus clavatus</i></td></tr>
<tr><td>J67.5</td><td>Poumon des champignonnistes</td><td>Compost et spores de champignons de culture</td></tr>
<tr><td>J67.6</td><td>Poumon des écorceurs d’érables</td><td>Écorce d’érable ; <i>Cryptostroma corticale</i></td></tr>
<tr><td>J67.7</td><td>Maladie due aux systèmes de conditionnement et d’humidification de l’air</td><td>Eau stagnante colonisée par des actinomycètes, moisissures ou bactéries</td></tr>
<tr><td>J67.8</td><td>Alvéolite allergique due à d’autres poussières organiques</td><td>Fromage, café, poisson, fourrures, séquoia ; par extension fluides d’usinage contaminés</td></tr>
<tr><td>J67.9</td><td>Alvéolite allergique sans précision</td><td>Pneumopathie d’hypersensibilité sans antigène précisé</td></tr>
<tr><td>J66.0</td><td>Byssinose</td><td>Poussière de coton</td></tr>
<tr><td>J66.1</td><td>Maladie des apprêteurs du lin</td><td>Poussière de lin</td></tr>
<tr><td>J66.2</td><td>Cannabinose</td><td>Poussière de chanvre</td></tr>
<tr><td>J66.8</td><td>Autres affections précisées</td><td>Autres poussières organiques précisées</td></tr></table>
<p>Le codeur lit d’abord la source, puis vérifie la présence d’une exacerbation pour le cinquième caractère. Exemple : le fermier de l’îlot 0, sans exacerbation d’une maladie connue, reçoit le code du poumon de fermier avec le cinquième caractère 0. Une pneumopathie d’hypersensibilité due aux isocyanates relève des agents chimiques (J68) et non de J67, car l’antigène n’est pas une poussière organique. Les poussières minérales (amiante, silice, charbon, métaux durs) provoquent des pneumoconioses, traitées dans le cours <a href="#/entry/J60">J60 — Pneumoconioses (P-02-Pneumologie)</a> ; la poussière y agit surtout par dépôt et réaction fibrosante, à l’exception de la bérylliose, qui repose sur une sensibilisation lymphocytaire au béryllium. La correspondance avec la CIM-11 n’est pas établie dans ce cours.</p>
<div class="key"><b>À retenir.</b> La pneumopathie d’hypersensibilité se classe aujourd’hui en non fibrosante ou fibrosante, d’après l’imagerie ou l’histologie et non d’après la durée des symptômes. Le sous-code J67 désigne la source de l’antigène. La catégorie J66 concerne les bronches et ne doit pas être utilisée pour une alvéolite. L’îlot suivant donne la fréquence de ces maladies et ce qu’elle implique.</div>
</section>

<section class="ilot" id="j67-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La pneumopathie d’hypersensibilité est rare dans la population générale, mais fréquente dans certains groupes exposés. Au Royaume-Uni, l’incidence est restée d’environ 1 nouveau cas pour 100 000 habitants par an entre 1991 et 2003 ; elle atteint 1,16 pour 100 000 au Danemark (1998–2010) et 1,28 à 1,94 pour 100 000 aux États-Unis (2004–2013), selon la recommandation S2k 2024. Sa part parmi les pneumopathies interstitielles varie de 1,5 à 47,3 % selon les registres, ce qui reflète surtout les différences d’exposition et de méthode diagnostique.</p>
<p>Les données suisses font défaut : aucune incidence nationale publiée n’a été retrouvée au 8 octobre 2026. L’Allemagne fournit l’ordre de grandeur le plus proche du contexte suisse : entre 2011 et 2022, l’assurance agricole allemande a reçu en moyenne 97 déclarations par an et en a reconnu 25 par an comme maladie professionnelle.</p>
<h3>2.1 Groupes exposés</h3>
<p>La prévalence du poumon de fermier est estimée entre 0,25 et 10,4 % chez les travailleurs agricoles. Elle a diminué depuis que l’ensilage a remplacé en partie le foin sec, car l’ensilage acide ne permet pas la croissance des actinomycètes thermophiles. Le poumon des éleveurs d’oiseaux est probablement la forme la plus fréquente dans le monde ; sa prévalence atteint 3,4 % chez les éleveurs de perruches et jusqu’à 21 % chez les colombophiles. La maladie touche surtout des adultes, avec un âge moyen de 52 ans dans une large cohorte allemande et un diagnostic souvent posé entre 40 et 60 ans.</p>
<div class="trap"><span class="k">Piège</span>La pneumopathie d’hypersensibilité est plus fréquente chez les non-fumeurs. Ce constat est une association, et non une protection à recommander : la nicotine réduit l’activation des macrophages alvéolaires, mais le fumeur qui développe la maladie a un pronostic plus mauvais. Le détail figure dans la <button class="w" data-k="j67-tabac">relation entre tabac et pneumopathie d’hypersensibilité (mécanisme et limites)</button>.</div>
<h3>2.2 Pronostic</h3>
<p>Le patient atteint d’une forme non fibrosante qui cesse l’exposition peut se stabiliser ou guérir complètement. La forme fibrosante a une survie réduite, surtout lorsque la tomodensitométrie montre un aspect de pneumopathie interstitielle commune. Dans une série citée par la S2k, un rayon de miel limité à un ou deux lobes s’accompagne d’une survie médiane de 8 ans, contre 5,2 ans dans la fibrose pulmonaire idiopathique ; un rayon de miel des cinq lobes ramène la survie médiane à 2,8 ans.</p>
<p>D’autres éléments sont associés à un pronostic défavorable : le tabagisme, une capacité vitale basse au diagnostic, une baisse de la CVF d’au moins 10 % en 6 à 12 mois, une DLCO inférieure à 50 % de la valeur prédite, l’absence de lymphocytose au lavage bronchoalvéolaire, une exposition persistante et un antigène non identifié. Ces facteurs sont des associations observées dans des cohortes ; ils ne prouvent pas que chacun cause l’aggravation.</p>
<div class="key"><b>À retenir.</b> La maladie est rare en population générale mais touche jusqu’à un exposé sur dix dans certains métiers ou loisirs. Le pronostic dépend d’abord de la fibrose, puis de la fonction respiratoire et de la possibilité de supprimer l’antigène. La physiopathologie explique ces trois déterminants.</div>
</section>

<section class="ilot" id="j67-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La maladie suit une chaîne en quatre maillons : inhalation d’une particule assez fine pour atteindre la bronchiole et l’alvéole, sensibilisation, inflammation granulomateuse centrée sur la bronchiole, puis, si l’exposition persiste, fibrose. Chaque maillon explique un signe et justifie une décision.</p>
<h3>3.1 État normal</h3>
<p>Chez le sujet sain, les grosses particules s’arrêtent dans le nez et les bronches, où le tapis mucociliaire les évacue. Les particules de 1 à 5 µm atteignent les bronchioles et les alvéoles. Là, le macrophage alvéolaire les phagocyte sans déclencher d’inflammation durable. Un agriculteur sain inhale chaque hiver des millions de spores d’actinomycètes sans aucun symptôme.</p>
<h3>3.2 Première charnière : la particule atteint l’alvéole</h3>
<p>Les spores d’<button class="w" data-k="j67-actino">actinomycètes thermophiles (croissance dans le foin chauffé)</button> mesurent environ 1 µm. Leur taille leur permet d’atteindre la région centrolobulaire, c’est-à-dire la bronchiole terminale et les alvéoles voisines. Cette localisation explique l’aspect centrolobulaire des lésions en tomodensitométrie.</p>
<h3>3.3 Deuxième charnière : sensibilisation</h3>
<p>Chez le sujet prédisposé, les cellules dendritiques présentent l’antigène aux lymphocytes T. Une réponse de type 1 se développe, avec production d’interféron gamma, et des lymphocytes B produisent des IgG spécifiques. La présence de ces IgG prouve seulement l’exposition et la sensibilisation : la majorité des exposés porteurs d’IgG ne sont pas malades.</p>
<h3>3.4 Troisième charnière : inflammation après réexposition</h3>
<p>Lors des expositions suivantes, deux réactions s’additionnent. Les complexes antigène-IgG activent le complément et attirent des polynucléaires en quelques heures : c’est la <button class="w" data-k="j67-hyper">réaction de type III</button>, qui explique la fièvre et les frissons 4 à 8 heures après l’exposition. Les lymphocytes T recrutent ensuite des macrophages qui forment des granulomes mal constitués autour des bronchioles : c’est la réaction de type IV, qui explique la lymphocytose du lavage et les nodules centrolobulaires.</p>
<h3>3.5 Quatrième charnière : obstruction bronchiolaire et troubles des échanges</h3>
<p>L’inflammation épaissit la paroi des bronchioles. Certains lobules se vident mal à l’expiration : la tomodensitométrie en expiration montre un <button class="w" data-k="j67-piege">piégeage aérique lobulaire (signe des petites voies aériennes)</button>. L’atteinte des parois alvéolaires réduit la surface d’échange et la compliance : la DLCO baisse, puis la saturation chute à l’effort, et les volumes pulmonaires diminuent.</p>
<h3>3.6 Cinquième charnière : fibrose</h3>
<p>Si l’exposition continue, les fibroblastes déposent du collagène autour des bronchioles et sous la plèvre. Une prédisposition génétique, comme des variants des gènes des télomères ou le variant de MUC5B, favorise cette évolution. La fibrose est irréversible : la corticothérapie ne la fait pas régresser, et l’éviction ne fait que freiner sa progression.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> L’éviction supprime l’antigène qui entretient les réactions de types III et IV. Le corticostéroïde réduit l’inflammation lymphocytaire et granulomateuse, ce qui accélère la récupération d’une forme inflammatoire. L’antifibrosant ralentit le fibroblaste lorsque la fibrose progresse. Aucun médicament ne compense une exposition qui continue.</div>
</section>

<section class="ilot" id="j67-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Des centaines de sources d’antigènes ont été décrites. Elles se rangent en six familles : bactéries, moisissures, protéines animales, protéines végétales, produits chimiques de bas poids moléculaire et métaux. Le médecin raisonne par lieu d’exposition : travail, domicile et loisirs. Dans les formes fibrosantes, aucun antigène n’est retrouvé chez jusqu’à 50 % des patients malgré une enquête complète.</p>
<p>Le tableau suivant présente les sources les plus utiles en Suisse et l’indice d’anamnèse qui les révèle.</p>

<p>La lecture commence par la troisième colonne, car elle donne la question à poser au patient. L’erreur fréquente consiste à ne demander que le métier : une couette en duvet ou une fontaine de salon passe inaperçue si le médecin ne pose pas la question du domicile. Exemple : une enseignante de 61 ans sans exposition professionnelle a reçu, un an plus tôt, une couette en duvet d’oie artisanale ; ses IgG anti-plumes d’oie sont positives.</p>
<h3>4.1 Facteurs liés à l’hôte</h3>
<p>Seule une minorité des sujets exposés devient malade, ce qui implique des facteurs de prédisposition. Des variants de gènes de l’immunité, dont certains allèles du système HLA de classe II, sont associés au risque de maladie. Environ 10 % des patients atteints de forme chronique portent des variants rares des gènes des télomères, associés à une survie sans transplantation réduite. Une infection virale respiratoire récente et l’exposition aux pesticides chez l’agriculteur sont des facteurs suspectés, non démontrés comme causaux.</p>
<h3>4.2 Déterminants de l’exposition</h3>
<p>La concentration, la fréquence et la durée de l’exposition, la taille et la solubilité des particules influencent l’évolution. Une exposition intermittente et massive, comme l’affouragement hivernal, favorise des épisodes fébriles récidivants. Une exposition faible et continue, comme une perruche dans le salon, favorise une forme insidieuse, souvent fibrosante au diagnostic.</p>
<div class="key"><b>À retenir.</b> Le médecin cherche l’antigène dans trois lieux : le travail, le domicile et les loisirs. Les oiseaux, le duvet, le foin moisi, les humidificateurs et les fluides d’usinage couvrent la majorité des cas en pratique. Une exposition faible et continue donne plus souvent une forme fibrosante. L’anamnèse transforme ces connaissances en questions précises.</div>

<section class="ilot" id="j67-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse est l’examen le plus rentable de la maladie. Dans l’étude multicentrique de Lacasse et collaborateurs (2003), l’exposition à un antigène connu était le plus puissant des six prédicteurs cliniques du diagnostic. Le médecin cherche une exposition, une chronologie et des symptômes.</p>
<h3>5.1 Exposition</h3>
<p>Le médecin demande le métier actuel et les métiers antérieurs, les loisirs, les animaux, les appareils d’humidification, la literie et l’humidité du logement. Un <button class="w" data-k="j67-quest">questionnaire d’exposition structuré (contenu et limites)</button> complète l’entretien sans le remplacer, selon la S2k 2024. La question « Avez-vous des oiseaux, ou en avez-vous eu ? » doit être posée à tout patient porteur d’une pneumopathie interstitielle, car les antigènes aviaires persistent jusqu’à 18 mois dans la poussière domestique après le départ des oiseaux.</p>
<h3>5.2 Chronologie</h3>
<p>Dans la forme non fibrosante, les symptômes apparaissent typiquement <button class="w" data-k="j67-48h">4 à 8 heures après l’exposition (mécanisme du délai)</button>, s’améliorent pendant les jours d’éloignement et récidivent au retour. D’origine professionnelle, ils débutent à la fin du poste et s’améliorent pendant les congés. Dans la forme fibrosante, cette chronologie manque souvent : la dyspnée progresse sans lien évident avec les jours de travail.</p>
<h3>5.3 Symptômes</h3>
<p>Les symptômes communs aux deux phénotypes sont la dyspnée d’effort et la toux sèche. Les signes généraux sont plus fréquents dans la forme non fibrosante : fièvre modérée, frissons, myalgies, malaise et parfois perte de poids. L’oppression thoracique et les sifflements sont moins fréquents.</p>
<div class="two">
<div class="card"><h4>Présentation non fibrosante typique</h4><p>Une colombophile de 38 ans présente, depuis deux mois, des accès fébriles le soir des entraînements de ses pigeons. Elle tousse, s’essouffle et perd 3 kg. Entre les accès, elle se sent mieux. L’anamnèse d’exposition et la chronologie rendent le diagnostic probable avant tout examen.</p></div>
<div class="card"><h4>Présentation fibrosante typique</h4><p>Un retraité de 71 ans, ancien boulanger, s’essouffle depuis deux ans. Il ne décrit aucun épisode fébrile. Il a une perruche dans le salon depuis quinze ans et une couette en plumes. Le tableau ressemble à une fibrose pulmonaire idiopathique jusqu’à ce que l’exposition soit cherchée.</p></div>
<div class="card"><h4>Forme récidivante prise pour des infections</h4><p>Un patient reçoit trois cures d’antibiotiques en un hiver pour des « pneumonies » fébriles à répétition, chaque fois améliorées en quelques jours, avec ou sans antibiotique. La récidive au même lieu et la guérison spontanée doivent faire évoquer une pneumopathie d’hypersensibilité.</p></div>
<div class="card"><h4>Forme à ne pas confondre</h4><p>Un ouvrier agricole présente de la fièvre et des myalgies quelques heures après avoir manipulé un silo très poussiéreux, une seule fois, avec une radiographie normale. Il s’agit plus probablement d’un <button class="w" data-k="j67-odts">syndrome toxique des poussières organiques (sans sensibilisation)</button>.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Le médecin conclut à une pneumonie communautaire chez un patient fébrile avec des opacités. L’absence de réponse à l’antibiotique, la récidive après réexposition et l’amélioration en vacances sont les trois indices qui doivent relancer l’anamnèse d’exposition. Les pneumonies sont traitées dans le cours <a href="#/entry/J18">J18 — Pneumonies de l’adulte (P-02-Pneumologie)</a>.</div>
<div class="key"><b>À retenir.</b> Toute pneumopathie interstitielle impose une anamnèse d’exposition au travail, au domicile et dans les loisirs. Des symptômes 4 à 8 heures après l’exposition, améliorés loin de la source, signent la forme non fibrosante. La forme fibrosante se présente comme une dyspnée progressive sans chronologie nette. L’examen clinique apporte ensuite des signes discrets mais utiles.</div>
