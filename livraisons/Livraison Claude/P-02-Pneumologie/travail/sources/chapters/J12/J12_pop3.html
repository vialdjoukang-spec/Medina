
<!-- ===== FENÊTRES : monographies ===== -->
<template data-pop="j12-d-nirma" data-title="Nirmatrelvir-ritonavir (Paxlovid)">
<div class="lab">Mécanisme</div><p>Le nirmatrelvir inhibe la protéase principale du SARS-CoV-2, qui découpe les polyprotéines virales ; sans elle, le virus ne produit pas ses protéines fonctionnelles. Le ritonavir, inhibiteur du CYP3A4, ralentit la dégradation du nirmatrelvir et maintient sa concentration.</p>
<div class="lab">Indication suisse</div><p>COVID-19 de l’adulte et de l’enfant dès 6 ans et 20 kg, sans besoin d’oxygène ni hospitalisation pour le COVID-19, avec un risque accru de forme sévère (information professionnelle suisse, état août 2026).</p>
<div class="lab">Preuves</div><p>Dans l’essai EPIC-HR (2022), chez des adultes non vaccinés à haut risque traités dans les 3 jours, l’hospitalisation ou le décès au 28<sup>e</sup> jour est passé d’environ 7,0 % sous placebo à 0,8 %. Chez des adultes à risque standard (EPIC-SR), le bénéfice n’a pas été démontré. L’OMS recommande fortement le traitement chez le malade à risque élevé et conditionnellement chez le malade à risque modéré.</p>
<div class="lab">Posologie</div><p>300 mg de nirmatrelvir (2 comprimés de 150 mg) et 100 mg de ritonavir toutes les 12 heures pendant 5 jours, à commencer dans les 5 jours suivant le début des symptômes. DFG 30 à 59 mL/min : 150/100 mg toutes les 12 heures. DFG inférieur à 30 mL/min ou dialyse : 300/100 mg le premier jour, puis 150/100 mg une fois par jour du deuxième au cinquième jour, après la dialyse les jours de séance.</p>
<div class="lab">Effets indésirables</div><p>Dysgueusie, diarrhée, céphalées ; rebond des symptômes après la fin du traitement chez une minorité de malades.</p>
<div class="lab">Contre-indications</div><p>Médicaments à clairance très dépendante du CYP3A4 (voir la fiche des interactions), inducteurs puissants, insuffisance hépatique Child-Pugh C. Grossesse : non recommandé sauf si la situation clinique l’exige selon l’information professionnelle suisse.</p></template>

<template data-pop="j12-d-remde" data-title="Remdésivir (Veklury)">
<div class="lab">Mécanisme</div><p>Promédicament d’un analogue de l’adénosine, incorporé par l’ARN polymérase virale ; il interrompt la synthèse de l’ARN viral.</p>
<div class="lab">Indications suisses</div><p>COVID-19 avec pneumonie nécessitant un apport d’oxygène (bas ou haut débit, ou autre ventilation non invasive au début) ; COVID-19 sans oxygène ni hospitalisation chez un malade à risque accru de forme sévère (information professionnelle suisse, état décembre 2025).</p>
<div class="lab">Preuves</div><p>ACTT-1 (2020) : délai de guérison de 10 jours contre 15 jours chez les malades hospitalisés. PINETREE (2022) : chez des malades ambulatoires non vaccinés à haut risque traités dans les 7 jours, hospitalisation ou décès au 28<sup>e</sup> jour de 0,7 % contre 5,3 %. L’OMS suggère le remdésivir dans la forme sévère et chez le malade non sévère à risque élevé, et le déconseille dans la forme critique.</p>
<div class="lab">Posologie</div><p>200 mg par voie intraveineuse le premier jour, puis 100 mg par jour, en 30 à 120 minutes. Durée : 3 jours sans oxygène ; au moins 5 et au plus 10 jours avec oxygène. Pas d’adaptation rénale ni hépatique selon l’information professionnelle suisse.</p>
<div class="lab">Surveillance</div><p>Réactions d’hypersensibilité pendant la perfusion ; transaminases. Arrêt à envisager si l’alanine aminotransférase dépasse 10 fois la limite supérieure.</p></template>

<template data-pop="j12-d-dexa" data-title="Dexaméthasone dans le COVID-19">
<div class="lab">Mécanisme</div><p>Glucocorticoïde puissant ; il freine la transcription des cytokines inflammatoires par le récepteur des glucocorticoïdes.</p>
<div class="lab">Preuve</div><p>Essai RECOVERY (New England Journal of Medicine 2021) : 6425 malades hospitalisés. Mortalité à 28 jours de 22,9 % sous dexaméthasone contre 25,7 % sous soins usuels. Le bénéfice était net sous ventilation invasive (29,3 % contre 41,4 %) et sous oxygène (23,3 % contre 26,2 %). Sans assistance respiratoire, la mortalité était de 17,8 % contre 14,0 %, différence non significative mais défavorable.</p>
<div class="lab">Posologie</div><p>6 mg une fois par jour par voie orale ou intraveineuse, jusqu’à 10 jours ou jusqu’à la sortie. Équivalences données par l’OMS : 50 mg d’hydrocortisone toutes les 8 heures, 40 mg de prednisone ou 32 mg de méthylprednisolone par jour.</p>
<div class="lab">Surveillance</div><p>Glycémie, surtout chez le diabétique ; humeur et sommeil ; infections.</p>
<div class="lab">Non indiquée</div><p>COVID-19 sans besoin d’oxygène (OMS, recommandation conditionnelle contre).</p></template>

<template data-pop="j12-d-bari" data-title="Baricitinib (Olumiant)">
<div class="lab">Mécanisme</div><p>Inhibiteur oral de JAK1 et JAK2 ; il bloque la signalisation de plusieurs cytokines, dont l’interleukine 6.</p>
<div class="lab">Indication suisse</div><p>En association au remdésivir, COVID-19 prouvé chez l’adulte hospitalisé sous oxygène à bas ou haut débit, ou sous ventilation non invasive (information professionnelle suisse, état novembre 2025).</p>
<div class="lab">Preuves</div><p>COV-BARRIER (2021) : mortalité à 28 jours d’environ 8 % contre 13 %. RECOVERY (2022) : mortalité d’environ 12 % contre 14 %. L’OMS le recommande fortement dans le COVID-19 sévère et critique, avec un corticostéroïde.</p>
<div class="lab">Posologie</div><p>4 mg une fois par jour pendant 14 jours ou jusqu’à la sortie. DFG 30 à 60 mL/min : 2 mg ; DFG inférieur à 30 mL/min : non recommandé.</p>
<div class="lab">Précautions</div><p>Ne pas commencer si les lymphocytes sont inférieurs à 0,5 G/L, les neutrophiles inférieurs à 1 G/L ou l’hémoglobine inférieure à 8 g/dL. Thromboses veineuses : une contre-indication à la thromboprophylaxie contre-indique le baricitinib.</p></template>

<template data-pop="j12-d-toci" data-title="Tocilizumab dans le COVID-19">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humanisé dirigé contre le récepteur soluble et membranaire de l’interleukine 6.</p>
<div class="lab">Statut suisse</div><p>L’information professionnelle suisse de l’Actemra (état septembre 2026) ne mentionne pas le COVID-19 : l’emploi est hors étiquette, sous la responsabilité du prescripteur et selon les protocoles hospitaliers.</p>
<div class="lab">Preuve</div><p>RECOVERY (Lancet 2021) : chez des malades hypoxémiques avec CRP d’au moins 75 mg/L, mortalité à 28 jours de 31 % contre 35 %. L’OMS le recommande fortement dans les formes sévères et critiques, avec un corticostéroïde.</p>
<div class="lab">Posologie de l’essai</div><p>Dose unique intraveineuse selon le poids : 8 mg/kg jusqu’à 40 kg, 400 mg de 41 à 65 kg, 600 mg de 66 à 90 kg, 800 mg au-delà ; une seconde dose était possible après 12 à 24 heures.</p>
<div class="lab">Précautions</div><p>Infections bactériennes ou fongiques non contrôlées, neutropénie, hausse des transaminases. La CRP s’effondre et ne sert plus à détecter une surinfection.</p></template>

<template data-pop="j12-d-nirse" data-title="Nirsévimab (Beyfortus)">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal IgG1 dirigé contre la protéine F du VRS en préfusion ; une modification de son fragment constant prolonge sa demi-vie (environ 71 jours chez un nourrisson de 5 kg selon l’information professionnelle suisse).</p>
<div class="lab">Recommandation suisse</div><p>Tout nourrisson de 12 mois ou moins reçoit une dose unique : dans la première semaine de vie s’il naît entre octobre et mars, en octobre s’il naît entre avril et septembre, sauf si la mère a été vaccinée selon les recommandations. Une deuxième dose est recommandée en octobre pour l’enfant de 24 mois ou moins atteint d’une maladie chronique à risque (OFSP-Bulletin 36/25).</p>
<div class="lab">Preuves</div><p>MELODY : efficacité de 76,4 % contre les infections basses à VRS traitées médicalement et de 76,8 % contre les hospitalisations. HARMONIE : 83 % contre les hospitalisations sur trois mois et 82,7 % sur 180 jours.</p>
<div class="lab">Posologie</div><p>50 mg par voie intramusculaire si le poids est inférieur à 5 kg, 100 mg à partir de 5 kg ; 200 mg (2 injections de 100 mg) en deuxième saison. Il peut être administré le même jour que les vaccins de routine, à 2,5 cm d’intervalle.</p>
<div class="lab">Contre-indication</div><p>Réaction allergique grave connue au produit. Après une infection à VRS, une dose n’est plus donnée la même saison, sauf perte de l’immunité humorale après une chirurgie cardiaque avec circulation extracorporelle.</p></template>

<template data-pop="j12-vacc-vrs" data-title="Vaccins contre le VRS">
<div class="lab">Produits</div><p>Arexvy (protéine F en préfusion avec adjuvant AS01E), Abrysvo (protéine F en préfusion bivalente, sans adjuvant), mRESVIA (ARN messager codant la protéine F en préfusion). Les trois sont autorisés en Suisse chez l’adulte de 60 ans ou plus ; Arexvy et Abrysvo aussi de 18 à 59 ans en cas de risque accru, et mRESVIA dès 18 ans (informations professionnelles suisses, 2026).</p>
<div class="lab">Recommandation de l’OFSP et de la CFV</div><p>Une dose pour toute personne de 75 ans ou plus, et de 60 à 74 ans en cas de maladie chronique (immunodépression, maladie pulmonaire, cardiovasculaire, neurologique, rénale, hépatique, hématologique, diabète), de fragilité ou de vie en établissement de soins. Administration idéale de mi-octobre à mi-novembre, éventuellement le même jour que les vaccins contre la grippe et le COVID-19. Pas de prise en charge par l’assurance obligatoire des soins. Chez l’adulte de 18 à 59 ans très à risque, la vaccination peut être envisagée.</p>
<div class="lab">Efficacité (essais cités par l’OFSP)</div><p>Arexvy, AReSVi-006 : 82,6 % contre l’infection basse à VRS et 94,1 % contre sa forme sévère pendant la première saison. Abrysvo, RENOIR : 67 % et 86 % contre l’infection basse avec au moins 2 ou 3 symptômes. mRESVIA : 83,7 % contre l’infection basse avec au moins 2 symptômes, sur un suivi plus court.</p>
<div class="lab">Grossesse</div><p>Abrysvo seul : une dose entre la 32<sup>e</sup> et la 36<sup>e</sup> semaine si l’accouchement est prévu entre début octobre et fin mars, au moins 14 jours avant l’accouchement. Dans MATISSE, l’efficacité contre l’infection basse sévère du nourrisson était de 82 % à 90 jours et de 69 % à 180 jours.</p>
<div class="lab">Sécurité</div><p>Un syndrome de Guillain-Barré très rare a été identifié chez l’adulte de plus de 60 ans, jusqu’à 4,6 cas par million de doses selon l’OFSP. La durée de protection et le besoin de rappel restent incertains.</p></template>

<template data-pop="j12-vacc-covid" data-title="Vaccination contre le COVID-19">
<div class="lab">Recommandation suisse 2025/2026</div><p>Une dose par an en automne-hiver, de préférence de mi-octobre à décembre, au plus tôt 6 mois après la dernière dose ou une infection confirmée, pour les personnes de 65 ans ou plus et dès 16 ans en cas de facteur de risque (immunodéficience, maladies pulmonaires, cardiovasculaires, rénales, hépatiques, drépanocytose, diabète, indice de masse corporelle d’au moins 35, trisomie 21). Pendant la grossesse : une dose, de préférence au deuxième ou au troisième trimestre (OFSP-Bulletin 36/25).</p>
<div class="lab">Produits</div><p>Comirnaty et Spikevax, vaccins à ARN messager adaptés au variant recommandé de la saison.</p>
<div class="lab">Mécanisme</div><p>L’ARN messager encapsulé dans des nanoparticules lipidiques fait produire la protéine Spike par les cellules du malade, ce qui induit anticorps neutralisants et immunité cellulaire.</p>
<div class="lab">Effets indésirables</div><p>Réactions locales et générales passagères ; myocardite rare, surtout chez l’homme jeune après la deuxième dose de la primovaccination.</p></template>

<template data-pop="j12-d-doxy" data-title="Doxycycline et macrolides">
<div class="lab">Mécanisme</div><p>La doxycycline bloque la sous-unité 30S du ribosome bactérien, les macrolides la sous-unité 50S. Les deux pénètrent dans les cellules et atteignent <i>Chlamydia</i>.</p>
<div class="lab">Posologie</div><p>Doxycycline (Doxyclin) : 200 mg le premier jour puis 100 mg par jour selon l’information professionnelle suisse ; la SSI emploie 100 mg toutes les 12 heures dans la pneumonie. Azithromycine (Zithromax) : 500 mg une fois par jour pendant 3 jours. Durée de la pneumonie communautaire : au moins 5 jours selon l’ATS et l’IDSA (2019) ; aucun essai ne fixe une durée propre à <i>C. pneumoniae</i>.</p>
<div class="lab">Effets indésirables</div><p>Doxycycline : photosensibilisation, œsophagite si le comprimé est pris couché et sans eau. Macrolides : troubles digestifs, allongement de l’intervalle QT ; la clarithromycine inhibe le CYP3A4.</p>
<div class="lab">Contre-indications</div><p>Doxycycline évitée pendant la grossesse et chez l’enfant de moins de 8 ans ; macrolide en remplacement.</p></template>

<template data-pop="j12-d-acic" data-title="Aciclovir intraveineux">
<div class="lab">Mécanisme</div><p>Analogue de la guanosine phosphorylé par la thymidine kinase virale, puis incorporé par l’ADN polymérase des virus herpès ; il interrompt la synthèse de l’ADN viral.</p>
<div class="lab">Posologie</div><p>L’information professionnelle suisse du Zovirax (état décembre 2025) indique 10 mg/kg toutes les 8 heures pour le zona de l’immunodéprimé à fonction rénale normale, pendant 5 jours et plus ; ce schéma est appliqué à la pneumonie varicelleuse. Réduction selon la clairance de la créatinine.</p>
<div class="lab">Surveillance</div><p>Néphrotoxicité par cristallisation tubulaire : hydratation et créatinine. Troubles neurologiques en cas d’accumulation chez l’insuffisant rénal.</p></template>

<template data-pop="j12-d-ganci" data-title="Ganciclovir intraveineux">
<div class="lab">Indication</div><p>Infections à cytomégalovirus menaçant la vie ou la vue chez l’immunodéprimé, dont la pneumonie (information professionnelle suisse du Cymevene, état janvier 2026).</p>
<div class="lab">Posologie</div><p>5 mg/kg en perfusion d’une heure toutes les 12 heures pendant 14 à 21 jours d’induction chez l’adulte à fonction rénale normale ; réduction selon la clairance.</p>
<div class="lab">Effets indésirables</div><p>Neutropénie, souvent dans les deux premières semaines, et thrombopénie : hémogramme fréquent.</p></template>

<template data-pop="j12-d-cido" data-title="Cidofovir">
<div class="lab">Mécanisme</div><p>Analogue nucléotidique de la cytidine, actif sans phosphorylation virale ; il inhibe l’ADN polymérase de l’adénovirus et des herpèsvirus.</p>
<div class="lab">Statut suisse</div><p>Le Sidovis est autorisé pour la rétinite à cytomégalovirus du malade atteint du syndrome d’immunodéficience acquise sans dysfonction rénale ; son emploi dans l’adénovirose est hors étiquette, selon les recommandations européennes de leucémie (ECIL-4, 2013).</p>
<div class="lab">Précautions</div><p>Néphrotoxicité tubulaire majeure : créatinine et protéinurie avant chaque dose, hydratation et probénécide selon le protocole de l’information professionnelle ; neutropénie.</p></template>

<template data-pop="j12-d-ribavirine" data-title="Ribavirine et VRS du greffé">
<div class="lab">Mécanisme</div><p>Analogue de la guanosine qui perturbe la synthèse de l’ARN viral et induit des mutations létales.</p>
<div class="lab">Place</div><p>Chez le greffé de cellules souches avec VRS, les recommandations européennes de leucémie (ECIL-4, 2013) discutent la ribavirine en aérosol ou par voie orale pour limiter la progression vers les voies basses ; le niveau de preuve est faible.</p>
<div class="lab">Statut suisse</div><p>La recherche « ribavirine » dans le Compendium le 08.10.2026 n’a fait apparaître aucune spécialité destinée au VRS ; l’emploi relève d’un centre spécialisé, hors étiquette.</p>
<div class="lab">Précautions</div><p>Tératogène : contre-indiquée pendant la grossesse, et précautions pour le personnel lors de l’aérosol. Anémie hémolytique.</p></template>
