<section class="ilot" id="j12-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme R., 78 ans, vit seule à domicile. Elle a une insuffisance cardiaque avec une FEVG de 35 % et un diabète de type 2. Mi-janvier, son petit-fils lui rend visite avec un rhume. Quatre jours plus tard, elle a une rhinorrhée et une toux sèche, puis une dyspnée croissante. Aux urgences, la température est de 38,4 °C, la fréquence respiratoire de 28 par minute, la SpO₂ de 89 % à l’air ambiant, la fréquence cardiaque de 104 par minute et la pression artérielle de 132/76 mmHg. Le médecin entend des sibilants diffus et des crépitants aux deux bases.</p>
<p>La radiographie montre des opacités réticulo-nodulaires bilatérales et une petite condensation sous-segmentaire à la base droite. La CRP vaut 64 mg/L et la procalcitonine 0,12 µg/L. Le NT-proBNP atteint 4200 ng/L, contre 1800 ng/L trois mois plus tôt. La PCR multiplex nasopharyngée détecte le VRS ; la grippe et le SARS-CoV-2 ne sont pas détectés.</p>
<p>La question qui structure le cours est la suivante : <b>cette pneumonie est-elle virale, une bactérie s’y ajoute-t-elle, quels malades bénéficient d’un antiviral ou d’un immunomodulateur, et comment éviter la transmission et la récidive ?</b></p>
<p>Au terme du cours, le médecin assistant sait coder une pneumonie virale selon la CIM-10-GM et la règle suisse du COVID-19. Il reconnaît les agents en cause selon la saison et le terrain, et il choisit la bonne prise de prélèvement. Il mesure la gravité avec les critères de l’OMS et de la pneumonie communautaire. Il traite le COVID-19 selon la gravité et le risque, et il soutient les autres viroses par l’oxygène et la prise en charge des comorbidités. Il propose enfin la vaccination contre le VRS et le COVID-19 selon les recommandations de l’OFSP.</p>
<div class="key"><b>Message fondateur.</b> Une pneumonie virale se reconnaît rarement à la clinique seule ; elle se prouve par une amplification génique. Le diagnostic viral ne suffit pas à écarter une bactérie, car la co-infection existe et les recommandations nord-américaines de 2019 traitent par antibiotique toute pneumonie radiologique, même si un virus est détecté. Le bénéfice d’un antiviral dépend surtout du <button class="w" data-k="j12-risque">risque de base du malade (catégories de l’OMS)</button> et du délai depuis le début des symptômes.</div>
<div class="key"><b>Prérequis.</b> Le cours de la <a href="#/entry/J18">J18 — Pneumonies de l’adulte (P-02-Pneumologie)</a> expose la pneumonie communautaire, les scores de gravité et l’antibiothérapie. La grippe est traitée dans le cours J10 — Grippe saisonnière (P-02-Pneumologie). Les notions utiles ici sont l’<button class="w" data-k="j12-interferon">immunité antivirale innée (interférons de type I et III)</button> et l’<button class="w" data-k="j12-shunt">effet shunt (perfusion de zones non ventilées)</button>.</div>
</section>

<section class="ilot" id="j12-1"><h2><span class="n">1</span>Définitions, classification et codage</h2>
<p>Une pneumonie est une infection aiguë du parenchyme pulmonaire distal : bronchioles respiratoires, canaux et sacs alvéolaires, alvéoles et interstitium. Elle se reconnaît par des signes respiratoires aigus et une opacité nouvelle à l’imagerie. Une <b>pneumonie virale</b> est une pneumonie dont l’agent démontré est un virus. Le mot « démontré » compte : une PCR positive dans le nez prouve la présence d’un virus dans les voies aériennes supérieures, pas toujours sa responsabilité dans l’atteinte alvéolaire.</p>
<p>Exemple : un rhinovirus détecté chez un homme de 60 ans avec une condensation lobaire et une procalcitonine à 8 µg/L ne fait pas conclure à une pneumonie virale. Le rhinovirus est fréquent chez les adultes asymptomatiques, et le tableau évoque d’abord un pneumocoque.</p>
<h3>1.1 Les trois catégories de la CIM-10-GM 2024</h3>
<p>Le bloc J09–J18 de la CIM-10-GM réunit la grippe et les pneumonies. Le code dépend de l’agent documenté. Le tableau suivant répond à la question pratique « quel code pour quel agent ? » et nomme les cours voisins.</p>

<tr><td>J12.0</td><td>Pneumonie adénovirale</td><td>Épidémie en collectivité, greffé de cellules souches</td></tr>

<p>Le lecteur regarde d’abord si l’agent a un code propre ailleurs. La grippe prouvée avec pneumonie se code J10.0, et non J12. La pneumonie à <i>Mycoplasma pneumoniae</i> se code J15.7 et relève du cours J18. La psittacose (A70) et la pneumocystose (B48.5) sont exclues de J16. Une pneumonie virale congénitale relève de P23.0. L’erreur fréquente consiste à coder J12.9 alors que la PCR a identifié le virus : le code devient alors J12.0 à J12.3 ou J12.8. Pour Mme R., le code est J12.1.</p>
<h3>1.2 Le COVID-19 dans la CIM-10-GM suisse</h3>
<p>La CIM-10-GM 2024 ne crée aucun sous-code J12 propre au SARS-CoV-2, contrairement à la version américaine qui utilise J12.82. En Suisse, la <button class="w" data-k="j12-codage-covid">règle de codage du COVID-19 (communications de l’Office fédéral de la statistique)</button> code d’abord la manifestation, ici J12.8, puis le code secondaire U07.1! si le virus est identifié par un test de laboratoire, ou U07.2! si le diagnostic repose sur la clinique et l’épidémiologie sans test. Le point d’exclamation signale un code qui ne peut jamais être principal. L’affection post-COVID-19 se code en plus par U09.9!.</p>
<h3>1.3 Le système dague et astérisque de J17</h3>
<p>Les codes J17 portent un astérisque. Ils décrivent la manifestation pulmonaire d’une maladie dont le code étiologique, marqué d’une dague, est principal. Exemple : une pneumonie rougeoleuse se code B05.2† puis J17.1*. Le J17 seul n’est jamais codé. La logique est clinique : la rougeole est une maladie générale, et la pneumonie n’en est qu’une localisation. Le détail figure à l’îlot 11.</p>
<h3>1.4 Classifications cliniques utiles</h3>
<p>Le lieu d’acquisition sépare la pneumonie communautaire de la pneumonie nosocomiale, car les virus nosocomiaux (VRS, grippe, SARS-CoV-2) imposent des mesures d’hygiène et des enquêtes d’entourage. Le terrain sépare l’hôte immunocompétent de l’hôte immunodéprimé, chez qui l’excrétion est prolongée et l’atteinte basse plus fréquente. La gravité suit, pour le COVID-19, les <button class="w" data-k="j12-oms-gravite">catégories de gravité de l’OMS (non sévère, sévère, critique)</button>, et pour les autres pneumonies, les scores de la pneumonie communautaire (CRB-65, CURB-65, critères de l’ATS et de l’IDSA).</p>
<div class="key"><b>À retenir.</b> Le code suit l’agent prouvé : J12.0 à J12.3 pour les quatre virus nommés, J12.8 pour les autres virus dont le SARS-CoV-2, J16.0 pour <i>Chlamydia</i>, J17.* derrière le code de la maladie générale. Le COVID-19 associe J12.8 et U07.1! en Suisse. La partie suivante montre que ces virus sont plus fréquents qu’on ne le croit chez l’adulte.</div>
</section>

<section class="ilot" id="j12-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La part virale des pneumonies de l’adulte a longtemps été sous-estimée, parce qu’aucun test de routine ne la cherchait. L’étude <button class="w" data-k="j12-epic">EPIC (pneumonies hospitalisées, États-Unis, 2010–2012)</button> a appliqué systématiquement l’amplification génique à 2259 adultes hospitalisés pour une pneumonie radiologique. Un agent a été trouvé chez 38 % d’entre eux : un ou plusieurs virus chez 23 %, une bactérie seule chez 11 %, une association virus-bactérie chez 3 %. Les agents les plus fréquents étaient le rhinovirus (9 %), le virus grippal (6 %) et le pneumocoque (5 %). L’incidence augmentait avec l’âge, jusqu’à 164,3 cas pour 10 000 adultes de 80 ans ou plus.</p>
<p>Ces chiffres ont deux limites. EPIC a exclu les immunodéprimés sévères et précède la pandémie de COVID-19. Un virus détecté n’est pas toujours la cause : la détection d’un virus et sa causalité sont deux affirmations distinctes.</p>
<h3>2.1 Données suisses</h3>
<p>Le VRS est le mieux documenté. Selon l’OFSP-Bulletin 36/25, la saison suisse du VRS s’étend habituellement de novembre à mars ou avril, avec un pic en janvier-février, et alterne saisons hautes et basses. Avant la pandémie (2014/2015 à 2019/2020), 2,4 % des nourrissons étaient hospitalisés chaque année pour un VRS ; la proportion a atteint 3,7 % en 2022/2023. Chez les 75 ans et plus, le taux moyen d’hospitalisation était de 45 pour 100 000 habitants avant la pandémie, puis de 143 pour 100 000 en 2022/2023. La létalité hospitalière moyenne atteignait 2,4 % entre 65 et 74 ans et 3,9 % à partir de 75 ans. La durée moyenne de séjour était de 7,9 jours entre 65 et 74 ans et de 9,9 jours après 75 ans.</p>
<p>Le bulletin souligne que le VRS de l’adulte est sous-diagnostiqué, car il était rarement testé et l’adulte réinfecté excrète moins de virus que le nourrisson. Les données suisses comparables pour le métapneumovirus, l’adénovirus et les virus paragrippaux ne sont pas publiées sous une forme exploitable ; la surveillance Sentinella de l’OFSP suit ces virus dans les consultations, sans incidence nationale des pneumonies.</p>
<h3>2.2 Le COVID-19 après la pandémie</h3>
<p>Selon l’OMS (août 2025), l’immunité acquise par la vaccination et l’infection a fortement réduit les hospitalisations et les décès. L’OMS estime désormais le risque d’hospitalisation d’un COVID-19 non sévère à environ 0,5 % chez le malade à faible risque, 3 % chez le malade à risque modéré et 6 % chez le malade à risque élevé. Ces valeurs sont des estimations de travail, faute de modèle pronostique validé, et non des mesures suisses.</p>
<h3>2.3 Pronostic</h3>
<p>Le pronostic dépend moins du virus que du terrain. Un VRS chez un adulte de 30 ans donne un rhume ; chez Mme R., il peut décompenser l’insuffisance cardiaque. Les déterminants sont l’âge, l’insuffisance cardiaque ou respiratoire chronique, l’immunodépression, la fragilité et le séjour en établissement médico-social. L’OFSP rapporte aussi des séquelles à distance : la bronchiolite sévère à VRS du petit enfant est associée à des sifflements récidivants et à l’asthme ultérieur, sans que le lien causal soit établi.</p>
<div class="key"><b>À retenir.</b> Un virus est détecté chez environ un quart des adultes hospitalisés pour pneumonie, mais un agent n’est trouvé que dans 38 % des cas. Le VRS hospitalise surtout les nourrissons et les sujets de plus de 75 ans, en hiver. Le terrain, plus que le virus, fixe le pronostic. Les mécanismes qui suivent expliquent pourquoi.</div>
</section>

<section class="ilot" id="j12-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La physiopathologie se lit comme une chaîne qui part de l’entrée du virus et aboutit à l’hypoxémie. Chaque maillon explique un signe, un examen ou un traitement.</p>
<h3>3.1 État normal</h3>
<p>Chez le sujet sain, les virus inhalés sont arrêtés par le mucus et évacués par la <button class="w" data-k="j12-mucocil">clairance mucociliaire (tapis de cils et mucus)</button>. Les cellules épithéliales infectées détectent l’ARN viral et produisent des interférons de type I et III. Ces interférons mettent les cellules voisines en état antiviral en quelques heures. L’infection reste alors limitée au nez et au pharynx : c’est le rhume.</p>
<h3>3.2 Première charnière : entrée et tropisme</h3>
<p>Chaque virus s’attache à un récepteur précis, ce qui fixe la cellule cible. Le SARS-CoV-2 lie l’<button class="w" data-k="j12-ace2">enzyme de conversion de l’angiotensine 2 (ECA2, récepteur du SARS-CoV-2)</button> grâce à sa protéine Spike, que la protéase TMPRSS2 active. Le VRS et le métapneumovirus fusionnent leur enveloppe avec la cellule ciliée grâce à leur <button class="w" data-k="j12-proteinef">protéine de fusion F (cible des vaccins et du nirsévimab)</button>. L’adénovirus, virus nu à ADN, se lie au récepteur CAR et aux intégrines. Plus le récepteur est présent dans les alvéoles, plus l’atteinte basse est fréquente.</p>
<h3>3.3 Deuxième charnière : lésion épithéliale</h3>
<p>Le virus détruit ou fusionne les cellules. Le VRS forme des syncytia, c’est-à-dire des cellules géantes nées de la fusion de cellules voisines. Les débris, le mucus et les cellules inflammatoires bouchent les bronchioles. Chez le nourrisson, dont la bronchiole est étroite, ce bouchon suffit à produire une <button class="w" data-k="j12-bronchiolite">bronchiolite (obstruction des petites voies aériennes)</button>. Chez l’adulte, le virus atteint surtout l’interstitium et les pneumocytes : il en résulte une pneumonie interstitielle bilatérale.</p>
<h3>3.4 Troisième charnière : réponse de l’hôte</h3>
<p>Une partie des lésions vient de la réponse de l’hôte et non du virus. Dans le COVID-19 sévère, une réponse interférons retardée laisse le virus se multiplier les premiers jours, puis une inflammation excessive domine la deuxième semaine. Cette phase inflammatoire explique deux choix thérapeutiques : l’antiviral est utile tôt, quand le virus se multiplie ; la dexaméthasone et les inhibiteurs de l’<button class="w" data-k="j12-il6">interleukine 6 et de la voie JAK-STAT (phase inflammatoire)</button> sont utiles tard, quand l’hypoxémie s’installe.</p>
<h3>3.5 Quatrième charnière : hypoxémie</h3>
<p>Les alvéoles remplies d’exsudat ou affaissées restent perfusées. Le sang les traverse sans s’oxygéner : c’est l’<button class="w" data-k="j12-shunt">effet shunt</button>. Dans le COVID-19, l’atteinte endothéliale et les microthromboses ajoutent une inégalité ventilation-perfusion. Le malade peut avoir une SpO₂ de 85 % avec peu de dyspnée : c’est l’<button class="w" data-k="j12-hypoxemie-silencieuse">hypoxémie peu symptomatique (dite « silencieuse »)</button>. La dyspnée dépend surtout de la mécanique et de la PaCO₂ ; une compliance encore normale explique ce décalage.</p>
<h3>3.6 Cinquième charnière : surinfection</h3>
<p>Le virus abîme l’épithélium, découvre des sites d’adhésion et freine la phagocytose. Une bactérie de l’oropharynx peut alors coloniser l’alvéole. Ce mécanisme est surtout démontré pour la grippe, avec le pneumocoque et <i>Staphylococcus aureus</i>. Pour le COVID-19, une méta-analyse de 2020 (Langford) trouvait une co-infection bactérienne chez 3,5 % des patients à l’admission et une surinfection secondaire chez 14,3 %. La co-infection initiale est donc rare dans le COVID-19, mais la surinfection de la deuxième semaine n’est pas exceptionnelle chez le malade ventilé.</p>

<div class="key"><b>Corrélation physiopathologie → traitement.</b> Un antiviral agit sur la multiplication du virus : son bénéfice est maximal dans les cinq premiers jours. Un corticostéroïde agit sur la réponse de l’hôte : il aide le malade hypoxémique, mais il a été associé à une mortalité plus élevée, non significative, chez le malade sans oxygène dans l’essai RECOVERY. L’oxygène et la ventilation corrigent l’effet shunt sans traiter sa cause. La partie suivante décrit les agents et les terrains.</div>
</section>

<section class="ilot" id="j12-4"><h2><span class="n">4</span>Agents et terrains à risque</h2>
<p>Chaque virus a une saison, une population cible et une signature clinique. Ces traits ne suffisent pas au diagnostic, mais ils orientent le prélèvement et la protection de l’entourage.</p>

<tr><td>SARS-CoV-2</td><td>Vagues sans saison stricte</td><td>Âgé, immunodéprimé</td><td>Anosmie possible, hypoxémie peu symptomatique</td><td><button class="w" data-k="j12-sarscov2">SARS-CoV-2</button></td></tr>
<tr><td>Rhinovirus, coronavirus saisonniers</td><td>Automne à printemps</td><td>Bronchopathie chronique, greffé</td><td>Exacerbation d’asthme ou de BPCO</td><td><button class="w" data-k="j12-rhino">Rhinovirus</button></td></tr>
<tr><td><i>Chlamydia pneumoniae</i></td><td>Toute l’année, épidémies</td><td>Adulte jeune, collectivités</td><td>Laryngite, début lent</td><td><button class="w" data-k="j12-cpn">Chlamydia pneumoniae</button></td></tr></table>
<p>Le lecteur cherche d’abord la saison et le terrain, puis le signe orientant. Exemple : un militaire de 20 ans avec fièvre à 39,5 °C, conjonctivite et pneumonie en avril évoque un adénovirus ; une femme de 82 ans vivant en établissement médico-social avec sibilants en janvier évoque le VRS. L’erreur est de traiter ces associations comme des preuves : seule la PCR identifie l’agent.</p>
<h3>4.1 Terrains à risque de forme grave</h3>
<div class="two">
<div class="card"><h4>Risque d’atteinte sévère</h4><p>L’âge avancé réduit la réponse interférons et l’immunité cellulaire : c’est l’<button class="w" data-k="j12-immunosenescence">immunosénescence (déclin immunitaire lié à l’âge)</button>. L’insuffisance cardiaque et la BPCO réduisent la réserve : une faible baisse de la PaO₂ suffit à décompenser. Le diabète, l’insuffisance rénale ou hépatique, l’obésité et la grossesse figurent dans les groupes à risque de l’OFSP.</p></div>
<div class="card"><h4>Risque d’excrétion prolongée et d’atteinte basse</h4><p>La greffe de cellules souches hématopoïétiques, la transplantation d’organe solide, la lymphopénie profonde, les traitements anti-CD20 et l’<button class="w" data-k="j12-immunodep">immunodépression sévère (définition opérationnelle)</button> exposent à une progression du nez vers le poumon. Chez le greffé de cellules souches, un VRS des voies hautes progresse vers une atteinte basse dans une proportion notable de cas.</p></div></div>
<div class="trap"><span class="k">Piège</span>Chez le malade sous anti-CD20 (rituximab, ocrélizumab), la sérologie et parfois l’antigène restent négatifs, et le SARS-CoV-2 peut persister des semaines. Une pneumonie traînante chez ce malade impose une PCR sur un prélèvement profond, même si un test antigénique nasal est négatif.</div>
<div class="key"><b>À retenir.</b> La saison et le terrain orientent ; la PCR identifie. L’âge, la cardiopathie, la bronchopathie chronique et l’immunodépression font passer un virus banal au rang de pneumonie grave. L’anamnèse qui suit cherche ces éléments.</div>
</section>

<section class="ilot" id="j12-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse doit répondre à quatre questions : y a-t-il une exposition à un virus, quel est le terrain, depuis quand dure la maladie, et existe-t-il un argument pour une bactérie ou pour un autre diagnostic ?</p>
<h3>5.1 Antécédents et expositions</h3>
<div class="two">
<div class="card"><h4>Terrain</h4><p>Âge, <button class="w" data-k="j12-a-cardio">insuffisance cardiaque et bronchopathie chronique (réserve fonctionnelle)</button>, diabète, maladie rénale, grossesse et terme, <button class="w" data-k="j12-immunodep">immunodépression et traitements immunosuppresseurs</button>. Statut vaccinal contre le COVID-19, le VRS, la grippe et le pneumocoque, avec les dates. Liste exhaustive des médicaments, car le nirmatrelvir-ritonavir interagit avec de nombreux traitements.</p></div>
<div class="card"><h4>Expositions</h4><p>Cas dans l’entourage, surtout un enfant enrhumé : le petit-fils de Mme R. en est l’exemple. Vie en collectivité : établissement médico-social, caserne, crèche. <button class="w" data-k="j12-a-expo">Expositions animales et voyages (psittacose, fièvre Q, rougeole)</button>. Hospitalisation récente, qui fait évoquer une transmission nosocomiale.</p></div></div>
<h3>5.2 Symptômes, par ordre de fréquence</h3>
<p><b>Toux</b> — Elle est sèche au début, puis parfois productive. L’OFSP note une toux sèche initiale chez environ 90 % des adultes infectés par le VRS. Une <button class="w" data-k="j12-s-toux">toux sèche et prolongée (caractérisation)</button> oriente vers un virus ou un agent intracellulaire, sans les prouver.</p>
<p><b>Rhinorrhée et symptômes des voies hautes</b> — Leur présence au début plaide pour un virus. Elle manque souvent chez le sujet âgé.</p>
<p><b>Fièvre</b> — Elle dépasse 38 °C chez près de la moitié des adultes infectés par le VRS selon l’OFSP, moins souvent chez le sujet âgé et l’immunodéprimé. Son absence n’exclut donc pas une pneumonie.</p>
<p><b>Dyspnée</b> — Elle traduit l’atteinte basse ou la décompensation d’une maladie chronique. Une <button class="w" data-k="j12-s-dysp">dyspnée qui s’aggrave après le cinquième jour (évolution biphasique)</button> évoque la phase inflammatoire du COVID-19 ou une surinfection.</p>
<p><b>Signes généraux et extrapulmonaires</b> — Myalgies, céphalées, fatigue, troubles digestifs. L’anosmie et l’agueusie évoquent le COVID-19 ; la conjonctivite, l’adénovirus ; l’enrouement, <i>Chlamydia pneumoniae</i>.</p>
<h3>5.3 Formes cliniques</h3>
<div class="two">
<div class="card"><h4>Forme typique de l’adulte âgé</h4><p>Femme de 80 ans, rhume puis toux et dyspnée, sibilants, SpO₂ basse, décompensation cardiaque. La fièvre peut manquer. C’est le tableau du VRS ou du métapneumovirus en hiver.</p></div>
<div class="card"><h4>COVID-19 à hypoxémie peu symptomatique</h4><p>Homme de 70 ans, fièvre depuis 7 jours, SpO₂ de 88 %, fréquence respiratoire de 24 par minute, peu gêné au repos. L’absence de dyspnée ne rassure pas.</p></div>
<div class="card"><h4>Forme de l’immunodéprimé</h4><p>Greffé de cellules souches, rhinite banale puis toux et opacités en verre dépoli. Fièvre parfois absente. Le virus peut être VRS, paragrippal, métapneumovirus ou adénovirus.</p></div>
<div class="card"><h4>Forme épidémique du sujet jeune</h4><p>Recrue militaire, fièvre élevée, pharyngite, conjonctivite, pneumonie : adénovirus. Étudiant, laryngite, toux traînante, pneumonie peu fébrile : <i>Chlamydia pneumoniae</i>.</p></div>
<div class="card"><h4>Pneumonie d’une maladie générale</h4><p>Adulte non vacciné, éruption puis toux : rougeole. Adulte jeune ou femme enceinte avec varicelle de 3 à 5 jours et dyspnée : pneumonie varicelleuse (îlot 11).</p></div>
<div class="card"><h4>Exacerbation d’une maladie chronique</h4><p>Asthmatique ou malade atteint de BPCO, rhinovirus ou VRS, sibilants sans opacité nouvelle. Il s’agit d’une exacerbation virale, et non d’une pneumonie : le cours J44 ou J45 s’applique.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Dater la maladie au jour de la consultation. Le délai depuis le premier symptôme décide de l’antiviral : le nirmatrelvir-ritonavir doit commencer dans les 5 jours selon l’information professionnelle suisse. Le médecin note la date du premier symptôme, même banal.</div>
<div class="key"><b>À retenir.</b> L’anamnèse cherche l’exposition, le terrain, le jour du premier symptôme et les signes qui orientent vers un agent ou vers un autre diagnostic. Le sujet âgé peut n’avoir ni fièvre ni toux productive. L’examen clinique mesure ensuite la gravité.</div>
</section>

<section class="ilot" id="j12-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen cherche d’abord la gravité, puis les signes d’atteinte pulmonaire, puis les signes qui orientent l’agent ou la complication. L’auscultation est souvent moins parlante dans la pneumonie virale interstitielle que dans la pneumonie bactérienne lobaire.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p><button class="w" data-k="j12-v-fr">Fréquence respiratoire (normale 12 à 20 par minute)</button>, le signe le plus précoce de l’atteinte basse. <button class="w" data-k="j12-v-spo">SpO₂ à l’air ambiant (normale 95 à 100 %)</button>, mesurée au repos puis à l’effort si elle est normale au repos. Fréquence cardiaque, pression artérielle, température, conscience. Capacité à parler en phrases complètes.</p></div>
<div class="card"><h4>Examen thoracique</h4><p>Le thorax est normal chez de nombreux malades atteints de COVID-19 malgré des opacités étendues. Les <button class="w" data-k="j12-x-crep">crépitants fins bilatéraux (atteinte interstitielle ou alvéolaire)</button> et les sibilants (VRS, métapneumovirus) sont les signes habituels. Un souffle tubaire localisé et une matité évoquent plutôt une condensation bactérienne.</p></div>
<div class="card"><h4>Signes de terrain et de décompensation</h4><p>Turgescence jugulaire, œdèmes, crépitants bilatéraux et troisième bruit : décompensation cardiaque, comme chez Mme R. Expiration prolongée et distension : exacerbation obstructive. Confusion chez le sujet âgé : gravité ou hypoxémie.</p></div>
<div class="card"><h4>Signes d’orientation</h4><p>Conjonctivite et pharyngite exsudative : adénovirus. Éruption maculopapuleuse et signe de Köplik : rougeole. Vésicules d’âges différents : varicelle. <button class="w" data-k="j12-x-mollet">Mollet douloureux ou asymétrique (thrombose veineuse au cours du COVID-19)</button>.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un oxymètre de pouls surestime la saturation chez le malade à peau foncée, selon des études publiées depuis 2020. Une SpO₂ limite chez ce malade justifie une gazométrie artérielle. La SpO₂ se mesure aussi sur une extrémité chaude, sans vernis, avec un signal de pouls régulier.</div>
<div class="key"><b>À retenir.</b> Une fréquence respiratoire supérieure à 20 par minute et une SpO₂ basse au repos ou à l’effort sont les meilleurs signes cliniques d’une atteinte basse. L’auscultation normale n’exclut pas une pneumonie virale. Le diagnostic se construit ensuite par l’imagerie et la microbiologie.</div>
