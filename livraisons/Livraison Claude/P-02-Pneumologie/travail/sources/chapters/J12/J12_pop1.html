
<!-- ===== FENÊTRES : mécanismes et agents ===== -->
<template data-pop="j12-risque" data-title="Risque d’hospitalisation selon l’OMS">
<div class="lab">Définition</div><p>Depuis sa quatorzième version, la recommandation de l’OMS sur les traitements du COVID-19 classe le malade non sévère en trois catégories de risque d’hospitalisation : faible (environ 0,5 %), modéré (environ 3 %) et élevé (environ 6 %). La mortalité estimée correspondante est de 0,05 %, 0,3 % et 0,6 %.</p>
<div class="lab">Qui appartient à quelle catégorie</div><p>Le risque élevé regroupe les syndromes d’immunodéficience diagnostiqués, les transplantés d’organe solide sous immunosuppresseurs et les maladies auto-immunes sous immunosuppresseurs. Le risque modéré regroupe les personnes de plus de 65 ans et celles atteintes d’obésité, de diabète, de maladie cardiopulmonaire, rénale ou hépatique chronique, de cancer actif, de handicap ou de comorbidités chroniques. Les autres sont à risque faible ; ils forment la majorité.</p>
<div class="lab">Pourquoi cela décide du traitement</div><p>Un traitement qui réduit le risque relatif de 80 % évite 4,8 hospitalisations sur 100 malades à risque élevé, mais seulement 0,4 sur 100 malades à risque faible. L’OMS a fixé à 1,5 % la réduction absolue jugée importante pour le malade ; le bénéfice attendu chez le malade à risque faible reste en dessous.</p>
<div class="lab">Limites</div><p>Ces chiffres sont des estimations de travail, faute de modèle pronostique validé, et ils ne sont pas spécifiques à la Suisse. Le médecin les adapte au statut vaccinal et à la situation clinique.</p></template>

<template data-pop="j12-interferon" data-title="Immunité antivirale innée">
<div class="lab">Définition</div><p>Les interférons de type I (alpha, bêta) et de type III (lambda) sont des cytokines produites par la cellule infectée dès qu’elle détecte l’ARN viral. Ils mettent les cellules voisines en état antiviral.</p>
<div class="lab">Mécanisme</div><p>Les capteurs cytoplasmiques (RIG-I) et endosomaux (TLR7) reconnaissent l’ARN viral. L’interféron sécrété active la voie JAK-STAT des cellules voisines, qui expriment des protéines bloquant la réplication, la traduction et l’assemblage viral.</p>
<div class="lab">Conséquence clinique</div><p>Une réponse interférons précoce limite l’infection au rhume. Une réponse retardée, par l’âge, un antagonisme viral ou des auto-anticorps anti-interférons, laisse le virus atteindre l’alvéole et précède les formes graves de COVID-19.</p></template>

<template data-pop="j12-shunt" data-title="Effet shunt">
<div class="lab">Définition</div><p>Le shunt est la fraction du débit cardiaque qui traverse des alvéoles perfusées mais non ventilées. Ce sang reste désaturé et se mélange au sang oxygéné.</p>
<div class="lab">Exemple chiffré</div><p>Avec un shunt de 30 % du débit cardiaque, la PaO₂ reste basse même sous FiO₂ élevée, car l’oxygène ajouté n’atteint pas les alvéoles inondées et le sang déjà saturé ne peut pas compenser.</p>
<div class="lab">Conséquence pratique</div><p>Une hypoxémie qui répond mal à l’oxygène évoque un shunt étendu (SDRA, condensation massive). La pression positive en fin d’expiration et le décubitus ventral rouvrent ou réventilent ces alvéoles. Une hypoxémie qui répond bien à 2 L/min relève plutôt d’une inégalité ventilation-perfusion.</p></template>

<template data-pop="j12-mucocil" data-title="Clairance mucociliaire">
<div class="lab">Fonctionnement normal</div><p>Les cellules ciliées des bronches battent environ 10 à 20 fois par seconde et déplacent vers le pharynx un mucus qui piège particules et virus. Le mucus est évacué en quelques heures.</p>
<div class="lab">Perturbation</div><p>Les virus respiratoires détruisent les cellules ciliées ; la clairance reste ralentie plusieurs semaines, le temps de la régénération épithéliale. Les bactéries de l’oropharynx colonisent alors plus facilement les voies basses.</p>
<div class="lab">Conséquence</div><p>Ce délai explique la toux prolongée après une virose et la fenêtre de surinfection bactérienne, surtout après la grippe.</p></template>

<template data-pop="j12-ace2" data-title="Enzyme de conversion de l’angiotensine 2">
<div class="lab">Fonction normale</div><p>L’ECA2 est une enzyme membranaire qui transforme l’angiotensine II en angiotensine 1-7, vasodilatatrice. Elle est exprimée dans l’épithélium nasal, les pneumocytes de type II, l’intestin, le rein, le cœur et l’endothélium.</p>
<div class="lab">Rôle dans l’infection</div><p>La protéine Spike du SARS-CoV-2 se lie à l’ECA2 ; la protéase TMPRSS2 de la cellule clive Spike et déclenche la fusion des membranes. La répartition de l’ECA2 explique l’anosmie, la pneumonie alvéolaire et certaines atteintes digestives et rénales.</p>
<div class="lab">Piège</div><p>Les inhibiteurs de l’enzyme de conversion et les antagonistes des récepteurs de l’angiotensine II ne sont pas arrêtés pendant un COVID-19 au motif d’une modification de l’ECA2 ; ils ne sont suspendus que pour une hypotension ou une insuffisance rénale aiguë.</p></template>

<template data-pop="j12-proteinef" data-title="Protéine de fusion F du VRS">
<div class="lab">Structure</div><p>La protéine F est une glycoprotéine de l’enveloppe du VRS, du métapneumovirus et des paramyxovirus. Sa forme de préfusion, instable, se replie en forme de postfusion pour fusionner l’enveloppe virale et la membrane cellulaire.</p>
<div class="lab">Pourquoi elle compte</div><p>La forme de préfusion porte les sites antigéniques les plus neutralisants. Les vaccins Arexvy, Abrysvo et mRESVIA présentent une protéine F stabilisée en préfusion, et le nirsévimab se lie à un site de cette forme (OFSP-Bulletin 36/25).</p>
<div class="lab">Conséquence</div><p>La protéine F est très conservée entre les sous-types A et B du VRS : une seule cible protège contre les deux sous-types. La fusion cellule-cellule qu’elle provoque produit les syncytia visibles en histologie.</p></template>

<template data-pop="j12-bronchiolite" data-title="Bronchiolite">
<div class="lab">Définition</div><p>La bronchiolite est une inflammation des bronchioles, voies aériennes de moins de 2 mm sans cartilage. Chez le nourrisson, elle est le plus souvent due au VRS et se code J21 ; elle n’est pas une pneumonie.</p>
<div class="lab">Mécanisme</div><p>Nécrose épithéliale, œdème et bouchons de mucus rétrécissent la lumière. Comme la résistance varie avec l’inverse de la puissance quatre du rayon, un œdème minime obstrue la bronchiole étroite du nourrisson.</p>
<div class="lab">Conséquence</div><p>Le nourrisson présente tachypnée, tirage, sibilants ou crépitants fins, et difficultés d’alimentation. L’OFSP estime que 5 à 10 % des nourrissons hospitalisés pour un VRS nécessitent les soins intensifs. Sa prise en charge relève d’un cours pédiatrique.</p></template>

<template data-pop="j12-il6" data-title="Interleukine 6 et voie JAK-STAT">
<div class="lab">Physiologie</div><p>L’interleukine 6 est produite par les macrophages, les monocytes et l’endothélium activés. Elle se lie à son récepteur, associé à la glycoprotéine gp130, qui active les kinases JAK1 et JAK2 puis le facteur de transcription STAT3.</p>
<div class="lab">Effets</div><p>Elle induit la synthèse hépatique de CRP et de fibrinogène, la fièvre et l’activation des lymphocytes. Dans le COVID-19 sévère, son excès entretient l’inflammation alvéolaire et la coagulopathie.</p>
<div class="lab">Cibles thérapeutiques</div><p>Le tocilizumab bloque le récepteur ; le baricitinib inhibe JAK1 et JAK2, en aval de plusieurs cytokines ; la dexaméthasone freine la transcription de nombreuses cytokines. Les trois réduisent la mortalité du COVID-19 sous oxygène dans les essais RECOVERY et COV-BARRIER.</p></template>

<template data-pop="j12-hypoxemie-silencieuse" data-title="Hypoxémie peu symptomatique">
<div class="lab">Description</div><p>Certains malades atteints de COVID-19 ont une SpO₂ inférieure à 90 % avec peu de dyspnée au repos. Le terme « hypoxémie silencieuse » est répandu, mais la fréquence respiratoire est souvent augmentée.</p>
<div class="lab">Mécanisme</div><p>La dyspnée dépend surtout de l’effort mécanique et de la PaCO₂. Au début, la compliance pulmonaire est conservée et l’hyperventilation abaisse la PaCO₂ ; les chémorécepteurs carotidiens réagissent peu tant que la PaO₂ reste au-dessus d’environ 8 kPa.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin mesure la SpO₂ chez tout malade atteint de COVID-19, au repos puis à l’effort, et compte la fréquence respiratoire. Un malade peu dyspnéique avec une SpO₂ de 88 % a une forme sévère selon l’OMS.</p></template>

<template data-pop="j12-vrs" data-title="Virus respiratoire syncytial">
<div class="lab">Agent</div><p>Virus à ARN de la famille des Pneumoviridae, sous-types A et B. Il se transmet par les gouttelettes, les aérosols et les mains. L’incubation dure 2 à 8 jours (médiane 4 jours) ; la contagiosité commence un jour avant les symptômes et dure 3 à 8 jours (OFSP-Bulletin 36/25).</p>
<div class="lab">Épidémiologie</div><p>En Suisse, la saison va de novembre à mars ou avril. Le taux d’attaque saisonnier est de 33 à 60 % avant 2 ans et de 4 à 7 % après 65 ans ; 4 à 17 % des adultes âgés infectés sont hospitalisés, dont 26 % en soins intensifs, avec une létalité hospitalière d’environ 8 % dans les données citées par l’OFSP.</p>
<div class="lab">Clinique de l’adulte</div><p>Rhinite, congestion nasale, toux sèche initiale chez environ 90 % des malades, fièvre chez près de la moitié. Les sibilants sont plus fréquents qu’avec la grippe, même sans maladie obstructive. L’atteinte basse touche surtout l’âgé, le cardiaque, le bronchopathe et l’immunodéprimé.</p>
<div class="lab">Traitement et prévention</div><p>Aucun antiviral autorisé chez l’adulte en Suisse : soins de soutien. Prévention par vaccin dès 75 ans ou dès 60 ans à risque, vaccination maternelle ou nirsévimab chez le nourrisson.</p>
<div class="lab">Codage</div><p>J12.1 pour la pneumonie ; B97.4 comme code d’agent pour d’autres atteintes.</p></template>

<template data-pop="j12-hmpv" data-title="Métapneumovirus humain">
<div class="lab">Agent</div><p>Virus à ARN de la famille des Pneumoviridae, proche du VRS, identifié en 2001. Presque tous les enfants sont infectés avant 5 ans, et les réinfections sont fréquentes toute la vie.</p>
<div class="lab">Clinique</div><p>Il donne les mêmes tableaux que le VRS : rhume, bronchiolite, exacerbation d’asthme ou de BPCO, pneumonie chez le sujet âgé et l’immunodéprimé. Sa saison suit souvent celle du VRS, en fin d’hiver et au printemps.</p>
<div class="lab">Traitement</div><p>Aucun antiviral ni vaccin n’est recommandé en Suisse ; le traitement est de soutien. Il se code J12.3.</p>
<div class="lab">Piège</div><p>Sans panel multiplex qui l’inclut, il reste méconnu et la pneumonie est codée J18. Le médecin vérifie la composition du panel de son laboratoire.</p></template>

<template data-pop="j12-piv" data-title="Virus paragrippaux">
<div class="lab">Agent</div><p>Virus à ARN de la famille des Paramyxoviridae, types 1 à 4. Malgré leur nom, ils n’ont aucun lien avec les virus grippaux.</p>
<div class="lab">Clinique</div><p>Les types 1 et 2 causent la laryngite sous-glottique de l’enfant (croup), en automne ; le type 3 cause bronchiolites et pneumonies, au printemps et en été. Chez le greffé de cellules souches, le type 3 progresse vers une pneumonie grave.</p>
<div class="lab">Traitement</div><p>Aucun antiviral autorisé ; soins de soutien. La pneumonie se code J12.2 ; la laryngite de l’enfant se code dans les infections des voies hautes.</p></template>

<template data-pop="j12-adeno" data-title="Adénovirus">
<div class="lab">Agent</div><p>Virus nu à ADN double brin, avec plus de cinquante types. Il survit longtemps sur les surfaces et résiste mieux que les virus enveloppés à certains désinfectants.</p>
<div class="lab">Clinique</div><p>Pharyngite fébrile, conjonctivite, fièvre pharyngo-conjonctivale, diarrhée, cystite hémorragique. Certains types (4, 7, 14 notamment) causent des pneumonies sévères chez l’adulte jeune en collectivité, par exemple chez les recrues militaires. Chez le greffé de cellules souches, l’adénovirose disséminée atteint le foie, le rein et le poumon.</p>
<div class="lab">Diagnostic et traitement</div><p>PCR respiratoire ; PCR sanguine quantitative chez le greffé. Le cidofovir est employé hors étiquette dans les formes disséminées. La pneumonie se code J12.0.</p>
<div class="lab">Piège</div><p>L’ADN adénoviral persiste dans les amygdales et les végétations : une PCR positive isolée n’explique pas forcément une pneumonie bactérienne typique.</p></template>

<template data-pop="j12-sarscov2" data-title="SARS-CoV-2">
<div class="lab">Agent</div><p>Coronavirus à ARN de la famille des Coronaviridae, apparu fin 2019. Ses variants successifs modifient la protéine Spike, ce qui réduit l’effet des anticorps monoclonaux anciens et impose l’adaptation annuelle des vaccins.</p>
<div class="lab">Clinique</div><p>Du rhume à la pneumonie bilatérale. L’anosmie était fréquente avec les premiers variants et l’est moins avec les variants récents. L’aggravation survient typiquement entre le cinquième et le dixième jour. Thromboses, myocardite, insuffisance rénale aiguë et affection post-COVID-19 en sont les complications.</p>
<div class="lab">Traitement</div><p>Selon la gravité et le risque OMS : antiviral précoce chez le malade à risque modéré ou élevé, dexaméthasone et immunomodulateur chez le malade sous oxygène.</p>
<div class="lab">Codage suisse</div><p>J12.8 puis U07.1! si le virus est identifié.</p></template>

<template data-pop="j12-rhino" data-title="Rhinovirus et coronavirus saisonniers">
<div class="lab">Agent</div><p>Les rhinovirus (Picornaviridae) et les quatre coronavirus humains saisonniers sont les principales causes du rhume.</p>
<div class="lab">Rôle dans les pneumonies</div><p>Le rhinovirus était l’agent le plus fréquent dans l’étude EPIC (9 % des adultes hospitalisés). Il déclenche surtout des exacerbations d’asthme et de BPCO. Il est aussi détecté chez des adultes sans symptôme, ce qui rend sa responsabilité incertaine dans une pneumonie donnée.</p>
<div class="lab">Conduite</div><p>Une pneumonie avec rhinovirus seul se traite comme une pneumonie communautaire tant qu’une bactérie n’est pas exclue. Le code est J12.8 si le virus est retenu comme cause.</p></template>

<template data-pop="j12-cpn" data-title="Chlamydia pneumoniae">
<div class="lab">Agent</div><p>Bactérie intracellulaire obligatoire, transmise de personne à personne par les gouttelettes. Son cycle alterne corps élémentaire infectieux et corps réticulé qui se divise dans la cellule.</p>
<div class="lab">Clinique</div><p>Début progressif, pharyngite et enrouement, puis toux prolongée de plusieurs semaines ; fièvre modérée. Des épidémies surviennent dans les écoles, les casernes et les établissements de soins. La forme est souvent peu sévère, mais elle peut être grave chez le sujet âgé.</p>
<div class="lab">Diagnostic</div><p>PCR respiratoire, souvent incluse dans les panels multiplex. La sérologie par microimmunofluorescence demande deux prélèvements à 3 ou 4 semaines d’intervalle ; elle sert surtout rétrospectivement.</p>
<div class="lab">Traitement</div><p>Doxycycline 100 mg toutes les 12 heures ou macrolide. Les bêtalactamines sont inefficaces, car elles ne pénètrent pas dans la cellule et la bactérie manque de peptidoglycane classique.</p>
<div class="lab">Association et causalité</div><p>Des anticorps contre <i>C. pneumoniae</i> ont été associés à l’asthme et à l’athérosclérose. Les essais d’antibiotiques n’ont pas montré de bénéfice cardiovasculaire : cette association ne prouve pas une causalité.</p></template>

<template data-pop="j12-immunosenescence" data-title="Immunosénescence">
<div class="lab">Définition</div><p>Ensemble des modifications du système immunitaire liées à l’âge : baisse de la production d’interférons, réduction du répertoire des lymphocytes T naïfs, réponse vaccinale plus faible et inflammation chronique de bas grade.</p>
<div class="lab">Conséquence clinique</div><p>Les infections virales atteignent plus souvent les voies basses, durent plus longtemps et décompensent les maladies chroniques. L’OFSP rapporte un taux d’hospitalisation pour VRS près de quatre fois plus élevé après 75 ans qu’entre 65 et 74 ans.</p>
<div class="lab">Conséquence pratique</div><p>Les vaccins destinés au sujet âgé utilisent un adjuvant (Arexvy contre le VRS) ou une dose plus élevée (grippe) pour renforcer la réponse.</p></template>

<template data-pop="j12-immunodep" data-title="Immunodépression sévère">
<div class="lab">Situations concernées</div><p>Greffe de cellules souches hématopoïétiques ou transplantation d’organe solide, chimiothérapie avec neutropénie ou lymphopénie, infection par le VIH avec CD4 bas, traitements anti-CD20, corticostéroïdes à forte dose prolongés, inhibiteurs de calcineurine et autres immunosuppresseurs.</p>
<div class="lab">Conséquences dans les viroses</div><p>Progression des voies hautes vers le poumon, excrétion virale prolongée, réponse vaccinale faible, co-infections opportunistes (pneumocystose, aspergillose, cytomégalovirus).</p>
<div class="lab">Conduite</div><p>Prélèvement profond, tomodensitométrie, avis infectiologique. Le COVID-19 de ces malades est classé « à risque élevé » par l’OMS. Les interactions des antiviraux avec les immunosuppresseurs se gèrent avec le centre de transplantation.</p></template>
