<!-- ===== FENÊTRES : notions cliniques ===== -->
<template data-pop="j84-interst" data-title="Interstitium pulmonaire">
<div class="lab">Définition</div><p>L’interstitium est le tissu conjonctif qui soutient le poumon. Il comprend la paroi des alvéoles, les septums interlobulaires, le tissu sous-pleural et la gaine qui entoure les bronches et les vaisseaux.</p>
<div class="lab">Rôle normal</div><p>Il porte les capillaires et les lymphatiques, transmet les forces élastiques et reste assez fin pour que l’oxygène diffuse en une fraction de seconde.</p>
<div class="lab">Conséquence pathologique</div><p>Tout épaississement de l’interstitium, par de l’inflammation, du collagène ou de l’œdème, rigidifie le poumon et allonge la distance de diffusion. Il en résulte une restriction et une baisse de la DLCO.</p>
<div class="lab">Piège</div><p>Le terme « interstitiel » ne signifie pas que l’alvéole est épargnée : la pneumopathie organisée et les pneumopathies à éosinophiles remplissent surtout l’espace alvéolaire, tout en étant classées parmi les pneumopathies interstitielles.</p></template>
<template data-pop="j84-pid" data-title="Pneumopathie interstitielle diffuse">
<div class="lab">Définition</div><p>Une pneumopathie interstitielle diffuse est une maladie du parenchyme qui atteint de façon diffuse l’interstitium, avec ou sans comblement alvéolaire. Plus de deux cents causes sont décrites.</p>
<div class="lab">Inventaire pratique</div><p>Le clinicien classe la maladie en causes d’exposition (pneumopathie d’hypersensibilité, pneumoconioses, irradiation), médicaments, maladies systémiques (connectivites, sarcoïdose, vascularites), formes idiopathiques et formes rares (protéinose, lymphangioléiomyomatose, histiocytose langerhansienne).</p>
<div class="lab">Valeur de la classification</div><p>Elle oriente l’enquête et le traitement : supprimer une exposition ou un médicament peut stabiliser la maladie, alors qu’une forme idiopathique fibrosante demande un antifibrosant.</p>
<div class="lab">Conséquence pratique</div><p>Toute pneumopathie interstitielle nouvellement découverte justifie un bilan étiologique complet avant l’étiquette « idiopathique ».</p></template>
<template data-pop="j84-fpi" data-title="Fibrose pulmonaire idiopathique">
<div class="lab">Définition</div><p>La fibrose pulmonaire idiopathique est une pneumopathie interstitielle fibrosante chronique et progressive, sans cause identifiée, limitée au poumon, qui survient surtout après 60 ans et qui associe un aspect de PIC.</p>
<div class="lab">Diagnostic (ATS/ERS/JRS/ALAT 2022)</div><p>Le diagnostic exige l’exclusion des causes connues et un aspect de PIC typique ou probable en tomodensitométrie, ou une combinaison concordante de l’imagerie et de l’histologie, retenue en discussion multidisciplinaire.</p>
<div class="lab">Évolution</div><p>Le déclin de la CVF atteint environ 200 à 250 mL par an sans traitement dans les essais (bras placebo d’INPULSIS : −223,5 mL par an), avec des exacerbations aiguës imprévisibles.</p>
<div class="lab">Piège</div><p>Un aspect de PIC chez un patient atteint de polyarthrite rhumatoïde, d’une exposition aviaire ou d’une asbestose ne correspond pas à une fibrose pulmonaire idiopathique.</p>
<div class="lab">Conséquence pratique</div><p>Le patient se voit proposer un antifibrosant, les mesures générales et une évaluation précoce pour la transplantation.</p></template>
<template data-pop="j84-fpp" data-title="Fibrose pulmonaire progressive (2022)">
<div class="lab">Définition</div><p>Chez un patient atteint d’une pneumopathie interstitielle fibrosante autre que la fibrose pulmonaire idiopathique, la fibrose pulmonaire progressive est retenue si au moins deux des trois critères suivants surviennent en un an sans autre explication.</p>
<div class="lab">Critères</div><p>Premier critère : les symptômes respiratoires s’aggravent. Deuxième critère : la CVF baisse d’au moins 5 % de la valeur prédite en valeur absolue, ou la DLCO corrigée pour l’hémoglobine baisse d’au moins 10 % de la valeur prédite. Troisième critère : la tomodensitométrie montre une progression de la fibrose (bronchectasies de traction plus étendues, nouvelles réticulations, rayon de miel nouveau ou accru, perte de volume lobaire).</p>
<div class="lab">Source et niveau de preuve</div><p>Raghu et al., American Journal of Respiratory and Critical Care Medicine 2022. Le nintédanib y reçoit une recommandation conditionnelle après échec de la prise en charge habituelle ; la pirfénidone y est jugée à étudier davantage.</p>
<div class="lab">Piège</div><p>Une baisse de la CVF peut provenir d’une autre cause : faiblesse musculaire d’une myosite, épanchement pleural, obésité. Le critère « sans autre explication » impose de les éliminer.</p></template>
<template data-pop="j84-pins" data-title="Pneumopathie interstitielle non spécifique">
<div class="lab">Définition</div><p>La PINS est un aspect histologique et radiologique d’atteinte homogène des parois alvéolaires, cellulaire (inflammatoire) ou fibreuse. Elle peut être idiopathique, mais elle accompagne surtout les connectivites et certains médicaments.</p>
<div class="lab">Imagerie</div><p>La tomodensitométrie montre un verre dépoli et des réticulations basales, symétriques, péribronchovasculaires, avec souvent un respect de la zone immédiatement sous-pleurale et peu ou pas de rayon de miel.</p>
<div class="lab">Pronostic</div><p>La forme cellulaire répond bien aux corticostéroïdes ; la forme fibreuse répond moins mais évolue en général plus lentement qu’une fibrose pulmonaire idiopathique.</p>
<div class="lab">Conséquence pratique</div><p>Une PINS dite idiopathique justifie une recherche répétée de connectivite, car celle-ci peut apparaître plusieurs années plus tard.</p></template>
<template data-pop="j84-pic" data-title="Pneumopathie interstitielle commune">
<div class="lab">Définition</div><p>La PIC est un aspect, et non une maladie. En imagerie, elle associe une fibrose sous-pleurale et basale, un rayon de miel et des bronchectasies de traction ; en histologie, une fibrose en plages, des foyers fibroblastiques et des lésions d’âges différents.</p>
<div class="lab">Entités qui la produisent</div><p>Fibrose pulmonaire idiopathique, polyarthrite rhumatoïde, pneumopathie d’hypersensibilité chronique, asbestose, toxicité médicamenteuse, maladies des télomères.</p>
<div class="lab">Valeur</div><p>Chez un patient sans cause, une PIC typique en tomodensitométrie permet le diagnostic de fibrose pulmonaire idiopathique sans biopsie. Elle signale aussi un pronostic plus sombre dans les autres maladies.</p>
<div class="lab">Piège</div><p>L’emphysème paraseptal et les bronchectasies de traction groupées peuvent imiter un rayon de miel.</p></template>
<template data-pop="j84-tabpid" data-title="Pneumopathies interstitielles liées au tabac">
<div class="lab">Entités</div><p>La bronchiolite respiratoire avec pneumopathie interstitielle et la pneumopathie interstitielle desquamative surviennent presque toujours chez des fumeurs. Des macrophages chargés de pigments du tabac s’accumulent dans les bronchioles respiratoires ou dans l’ensemble des alvéoles.</p>
<div class="lab">Imagerie</div><p>La première donne des nodules centrolobulaires flous et un verre dépoli discret ; la seconde un verre dépoli étendu à prédominance basale et périphérique, parfois avec de petits kystes.</p>
<div class="lab">Traitement</div><p>L’arrêt du tabac est la mesure principale et suffit souvent. Les corticostéroïdes se discutent dans les formes desquamatives sévères ou progressives.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin propose un accompagnement structuré du sevrage, avec substituts nicotiniques ou varénicline selon les indications.</p></template>
<template data-pop="j84-po" data-title="Pneumopathie organisée">
<div class="lab">Définition</div><p>La pneumopathie organisée est un aspect de réparation dans lequel des bourgeons de tissu conjonctif jeune (corps de Masson) occupent les alvéoles et les canaux alvéolaires. Elle est cryptogénique ou secondaire.</p>
<div class="lab">Causes secondaires</div><p>Infections, médicaments (amiodarone, méthotrexate, immunothérapies), connectivites, radiothérapie du sein, greffe de moelle, cancers.</p>
<div class="lab">Clinique et imagerie</div><p>Le tableau pseudo-grippal subaigu résiste aux antibiotiques. Les consolidations sont périphériques ou péribronchovasculaires, souvent migratrices ; le signe du halo inversé (verre dépoli entouré d’un anneau de consolidation) est évocateur sans être spécifique.</p>
<div class="lab">Traitement et pièges</div><p>La réponse aux corticostéroïdes est rapide, mais les rechutes à la décroissance sont fréquentes. Une consolidation qui ne répond pas doit faire rechercher un adénocarcinome mucineux ou un lymphome.</p></template>
<template data-pop="j84-pia" data-title="Pneumopathie interstitielle aiguë (Hamman-Rich)">
<div class="lab">Définition</div><p>La pneumopathie interstitielle aiguë est un dommage alvéolaire diffus idiopathique chez un sujet sans maladie pulmonaire connue. La CIM-10-GM la range en J84.1 sous le nom de syndrome de Hamman-Rich.</p>
<div class="lab">Présentation</div><p>Un prodrome viral est suivi en quelques jours d’une détresse respiratoire qui remplit les critères du syndrome de détresse respiratoire aiguë.</p>
<div class="lab">Pronostic et conduite</div><p>La mortalité dépasse 50 % dans la plupart des séries. La prise en charge est celle du syndrome de détresse respiratoire aiguë (cours J96) ; les corticostéroïdes sont souvent utilisés sans preuve solide.</p>
<div class="lab">Piège</div><p>Le diagnostic n’est retenu qu’après l’exclusion d’une infection, d’une exacerbation aiguë d’une fibrose méconnue, d’une connectivite et d’un médicament.</p></template>
<template data-pop="j84-tgfb" data-title="Facteur de croissance transformant bêta">
<div class="lab">Définition</div><p>Le TGF-β est une cytokine sécrétée sous forme latente, liée à un peptide qui masque son site actif.</p>
<div class="lab">Activation</div><p>Dans la fibrose, l’intégrine αvβ6 des cellules épithéliales lésées exerce une traction sur le complexe latent et libère la forme active.</p>
<div class="lab">Effets</div><p>Par la voie Smad, il transforme le fibroblaste en myofibroblaste, augmente la synthèse de collagène et inhibe sa dégradation. Il favorise aussi la transition de cellules épithéliales vers un phénotype mésenchymateux.</p>
<div class="lab">Conséquence thérapeutique</div><p>Le blocage direct du TGF-β n’a pas encore abouti à un traitement autorisé ; les antifibrosants agissent sur des voies qui lui sont liées.</p></template>
<template data-pop="j84-foyers" data-title="Foyers fibroblastiques">
<div class="lab">Définition</div><p>Les foyers fibroblastiques sont de petits amas de fibroblastes et de myofibroblastes disposés parallèlement à la surface, recouverts d’un épithélium régénératif, au contact du tissu sain.</p>
<div class="lab">Signification</div><p>Ils représentent la lésion active de la PIC : leur présence à côté de cicatrices anciennes signe des lésions d’âges différents.</p>
<div class="lab">Valeur pronostique</div><p>Une densité élevée de foyers fibroblastiques est associée à une survie plus courte dans des séries histologiques.</p></template>
<template data-pop="j84-rayon" data-title="Rayon de miel">
<div class="lab">Définition radiologique</div><p>Le rayon de miel est un ensemble de kystes aériques de 3 à 10 mm environ, parfois plus, à paroi épaisse de 1 à 3 mm, groupés en plusieurs couches sous la plèvre.</p>
<div class="lab">Mécanisme</div><p>La fibrose détruit l’architecture alvéolaire et dilate les bronchioles terminales, qui se tapissent d’épithélium bronchiolaire et se remplissent de mucus.</p>
<div class="lab">Valeur</div><p>Il signe une fibrose avancée et constitue le critère de la PIC typique.</p>
<div class="lab">Piège</div><p>L’emphysème paraseptal (kystes en une seule couche, à paroi fine) et les bronchectasies de traction en coupe transversale peuvent l’imiter. Les coupes contiguës et l’avis d’un radiologue thoracique tranchent.</p></template>
<template data-pop="j84-hp" data-title="Hypertension pulmonaire et pneumopathie interstitielle">
<div class="lab">Mécanisme</div><p>La destruction du lit capillaire et la vasoconstriction hypoxique augmentent la résistance vasculaire pulmonaire. Le ventricule droit s’hypertrophie puis se dilate.</p>
<div class="lab">Quand la suspecter</div><p>Le médecin la suspecte devant une DLCO très basse, disproportionnée par rapport aux volumes, une désaturation marquée à l’effort, un NT-proBNP élevé ou des signes droits.</p>
<div class="lab">Examens</div><p>L’échocardiographie l’évoque ; le cathétérisme cardiaque droit la confirme lorsque le résultat change la prise en charge (transplantation, essai thérapeutique).</p>
<div class="lab">Conséquence pratique</div><p>Elle aggrave le pronostic et justifie une discussion en centre ; le cours I27 traite les hypertensions pulmonaires du groupe 3.</p></template>
<template data-pop="j84-pap" data-title="Protéinose alvéolaire">
<div class="lab">Définition</div><p>La protéinose alvéolaire est l’accumulation de surfactant dans les alvéoles par défaut d’épuration par le macrophage. La CIM-10-GM la range en J84.0.</p>
<div class="lab">Formes</div><p>La forme auto-immune, due à des anticorps anti-GM-CSF, représente environ 90 % des cas. Les formes secondaires accompagnent les hémopathies (surtout myélodysplasies), l’inhalation massive de silice ou un déficit en GATA2. Les formes héréditaires touchent le récepteur du GM-CSF.</p>
<div class="lab">Diagnostic</div><p>La tomodensitométrie montre un « crazy paving » géographique ; le lavage est laiteux et positif à la coloration par l’acide périodique de Schiff ; les anticorps anti-GM-CSF confirment la forme auto-immune.</p>
<div class="lab">Traitement et pièges</div><p>Le lavage pulmonaire total est le traitement de référence des formes gênantes. Les patients sont exposés aux infections opportunistes, notamment à Nocardia et aux mycobactéries, parce que leurs macrophages fonctionnent mal.</p></template>
<template data-pop="j84-ml" data-title="Microlithiase alvéolaire pulmonaire">
<div class="lab">Définition</div><p>La microlithiase alvéolaire est une maladie héréditaire autosomique récessive due à des variants de SLC34A2. Des microcalculs de phosphate de calcium remplissent progressivement les alvéoles.</p>
<div class="lab">Imagerie</div><p>La radiographie montre des microcalcifications diffuses, très denses, prédominant aux bases ; la tomodensitométrie montre des calcifications le long des septums et sous la plèvre.</p>
<div class="lab">Évolution et traitement</div><p>La maladie évolue lentement vers l’insuffisance respiratoire. Aucun traitement médical n’a démontré d’efficacité ; la transplantation se discute au stade avancé.</p>
<div class="lab">Piège</div><p>La dissociation entre une imagerie spectaculaire et des symptômes longtemps modestes retarde souvent le diagnostic.</p></template>
<template data-pop="j84-eosbio" data-title="Biologie de l’éosinophile">
<div class="lab">Production</div><p>L’éosinophile naît dans la moelle osseuse sous l’effet de plusieurs cytokines dont le GM-CSF ; l’IL-5 est le facteur le plus spécifique et assure aussi sa survie.</p>
<div class="lab">Recrutement</div><p>Les éotaxines, dont CCL11, attirent l’éosinophile vers le tissu par le récepteur CCR3, avec l’aide de molécules d’adhésion endothéliales induites par l’IL-4 et l’IL-13.</p>
<div class="lab">Action</div><p>Ses granules contiennent la protéine basique majeure, la protéine cationique de l’éosinophile, la peroxydase et la neurotoxine. Elles lèsent l’épithélium et augmentent la perméabilité vasculaire.</p>
<div class="lab">Conséquence thérapeutique</div><p>Les corticostéroïdes réduisent la production d’IL-5 et induisent l’apoptose des éosinophiles en quelques heures. Les anti-IL-5 réduisent durablement leur nombre.</p></template>
<template data-pop="j84-eos" data-title="Éosinophilie sanguine">
<div class="lab">Seuils</div><p>Chez l’adulte, le nombre normal d’éosinophiles est inférieur à 500/µL. Une hyperéosinophilie se définit par au moins 1 500/µL, à deux reprises à au moins un mois d’intervalle selon les définitions usuelles.</p>
<div class="lab">Causes à chercher</div><p>Parasitoses, médicaments, allergies et asthme, aspergillose bronchopulmonaire allergique, vascularites, hémopathies, syndrome hyperéosinophilique.</p>
<div class="lab">Piège</div><p>Une corticothérapie récente abaisse fortement les éosinophiles et masque le diagnostic. Inversement, une pneumopathie à éosinophiles aiguë peut débuter avec une numération normale.</p>
<div class="lab">Conséquence pratique</div><p>Le prélèvement se fait avant toute corticothérapie lorsque la situation le permet.</p></template>
<template data-pop="j84-loffler" data-title="Syndrome de Löffler">
<div class="lab">Définition</div><p>Le syndrome de Löffler est une éosinophilie pulmonaire transitoire due au passage pulmonaire de larves d’helminthes, surtout d’Ascaris lumbricoides. La CIM-10-GM l’inclut dans J82.</p>
<div class="lab">Cycle et chronologie</div><p>Les œufs ingérés éclosent dans l’intestin ; les larves traversent la paroi, gagnent le poumon par le sang en une à deux semaines, remontent les voies aériennes et sont dégluties. Les vers adultes pondent des œufs plusieurs semaines plus tard.</p>
<div class="lab">Clinique</div><p>Le patient présente une toux sèche, parfois une fièvre et des sibilants, avec des opacités fugaces et migratrices et une éosinophilie sanguine. La guérison est spontanée en moins d’un mois.</p>
<div class="lab">Piège et conduite</div><p>L’examen des selles est négatif pendant la phase pulmonaire. Il se répète plus tard, et l’albendazole 400 mg en dose unique traite l’infection intestinale.</p></template>
<template data-pop="j84-tpe" data-title="Éosinophilie pulmonaire tropicale">
<div class="lab">Définition</div><p>L’éosinophilie pulmonaire tropicale est une réponse immunitaire excessive aux microfilaires de Wuchereria bancrofti ou de Brugia malayi piégées dans le poumon. La CIM-10-GM l’inclut dans J82.</p>
<div class="lab">Clinique</div><p>Elle touche surtout des personnes ayant vécu en Inde, en Asie du Sud-Est ou dans d’autres zones d’endémie. Le patient décrit une toux nocturne et des sibilants qui imitent un asthme.</p>
<div class="lab">Biologie</div><p>Les éosinophiles dépassent souvent 3 000/µL, les IgE totales sont très élevées et les anticorps antifilaires sont positifs ; les microfilaires sont habituellement absentes du sang.</p>
<div class="lab">Traitement et piège</div><p>La diéthylcarbamazine, 6 mg/kg par jour pendant 14 à 21 jours selon les Centers for Disease Control and Prevention, s’obtient par un centre de médecine tropicale. Sans traitement, une fibrose peut s’installer.</p></template>
<template data-pop="j84-strongy" data-title="Anguillulose et corticostéroïdes">
<div class="lab">Mécanisme du danger</div><p>Strongyloides stercoralis peut se multiplier dans l’hôte pendant des décennies (auto-infestation). Les corticostéroïdes favorisent la transformation des larves et leur dissémination massive : c’est l’hyperinfection, souvent associée à une septicémie à germes digestifs.</p>
<div class="lab">Qui est concerné</div><p>Toute personne ayant vécu ou voyagé en zone tropicale ou subtropicale, même plusieurs décennies auparavant.</p>
<div class="lab">Conduite</div><p>Le médecin demande la sérologie avant la corticothérapie ; si le délai est incompatible avec l’urgence, il donne de l’ivermectine 200 µg/kg en dose unique, selon l’information professionnelle suisse de Subvectin.</p>
<div class="lab">Piège</div><p>L’éosinophilie peut disparaître pendant l’hyperinfection ; son absence ne rassure pas.</p></template>
<template data-pop="j84-pea" data-title="Pneumopathie à éosinophiles aiguë">
<div class="lab">Définition</div><p>Il s’agit d’une pneumopathie fébrile aiguë de moins d’un mois, avec opacités bilatérales et plus de 25 % d’éosinophiles au lavage bronchoalvéolaire, sans autre cause d’éosinophilie (critères de Philit et al., 2002).</p>
<div class="lab">Déclencheurs</div><p>Début ou reprise récente du tabac, cigarette électronique, inhalation de poussières ou de fumées, certains médicaments.</p>
<div class="lab">Présentation</div><p>Un adulte jeune développe en quelques jours une fièvre, une toux, des douleurs thoraciques et une hypoxémie parfois sévère, avec verre dépoli, septums épaissis et petits épanchements pleuraux.</p>
<div class="lab">Évolution</div><p>La guérison est rapide et complète sous corticostéroïdes et après l’arrêt du tabac ; il n’y a pas de rechute sans nouvelle exposition.</p>
<div class="lab">Piège</div><p>L’éosinophilie sanguine est souvent normale à l’admission ; l’absence de lavage conduit au diagnostic erroné de pneumonie grave ou de syndrome de détresse respiratoire.</p></template>
<template data-pop="j84-pec" data-title="Pneumopathie à éosinophiles chronique">
<div class="lab">Définition</div><p>Il s’agit d’une pneumopathie de plusieurs semaines, avec consolidations à prédominance périphérique et éosinophilie alvéolaire (au moins 40 % au lavage) ou sanguine (au moins 1 000/µL), sans autre cause.</p>
<div class="lab">Terrain</div><p>Elle touche surtout des femmes d’âge moyen non fumeuses ; environ la moitié ont un asthme, parfois d’apparition récente.</p>
<div class="lab">Traitement</div><p>La prednisone, habituellement 0,5 mg/kg par jour pendant deux semaines puis en décroissance sur plusieurs mois, entraîne une amélioration en quelques jours. Les rechutes sont fréquentes à la décroissance.</p>
<div class="lab">Piège</div><p>L’apparition d’une neuropathie, d’une atteinte cardiaque ou rénale chez une patiente asthmatique doit faire rechercher une granulomatose éosinophilique avec polyangéite.</p></template>
<template data-pop="j84-hes" data-title="Syndrome hyperéosinophilique">
<div class="lab">Définition</div><p>Le syndrome hyperéosinophilique associe une hyperéosinophilie d’au moins 1 500/µL et une atteinte d’organe attribuable aux éosinophiles, sans autre cause.</p>
<div class="lab">Formes</div><p>Il existe des formes myéloïdes (par exemple avec le transcrit FIP1L1-PDGFRA, sensible à l’imatinib), lymphocytaires et idiopathiques.</p>
<div class="lab">Gravité</div><p>L’atteinte cardiaque (fibrose endomyocardique, thrombus) conditionne le pronostic ; troponine et échocardiographie sont nécessaires.</p>
<div class="lab">Conséquence pratique</div><p>Le patient relève de l’hématologie ; le code est D72.1 ou celui de l’hémopathie.</p></template>
<template data-pop="j84-ea" data-title="Exacerbation aiguë de fibrose pulmonaire idiopathique">
<div class="lab">Définition (Collard et al., 2016)</div><p>L’exacerbation aiguë associe une fibrose pulmonaire idiopathique connue ou découverte, une aggravation respiratoire aiguë habituellement de moins d’un mois, un verre dépoli ou des consolidations bilatérales nouveaux sur fond de PIC, et une aggravation que l’insuffisance cardiaque ou la surcharge hydrique n’expliquent pas entièrement.</p>
<div class="lab">Mécanisme</div><p>Un dommage alvéolaire diffus se superpose à la fibrose ; il peut être déclenché par une infection, une chirurgie, une bronchoscopie ou une inhalation, ou rester inexpliqué.</p>
<div class="lab">Conduite</div><p>Le médecin élimine une embolie pulmonaire, une infection et une insuffisance cardiaque. Il donne de l’oxygène, souvent à haut débit nasal. Les corticostéroïdes à forte dose sont d’usage courant, sans preuve randomisée. Le cyclophosphamide est à éviter (EXAFIP). Les antifibrosants sont poursuivis si possible.</p>
<div class="lab">Pronostic et codage</div><p>Environ la moitié des patients hospitalisés meurent pendant le séjour. Le code est J84.11.</p></template>
<template data-pop="j84-cancer" data-title="Cancer bronchique et fibrose">
<div class="lab">Lien</div><p>Le risque de cancer bronchique est plus élevé chez les patients atteints de fibrose pulmonaire idiopathique que dans la population générale ; le tabac partagé et la prolifération épithéliale dans les zones fibrosées l’expliquent en partie.</p>
<div class="lab">Particularités</div><p>Le cancer naît souvent dans les bases fibrosées, où il est difficile à distinguer de la fibrose ; il s’agit surtout de carcinomes épidermoïdes et d’adénocarcinomes.</p>
<div class="lab">Conséquence pratique</div><p>Toute nouvelle opacité nodulaire qui grossit se discute en colloque oncologique. La chirurgie, la radiothérapie et certaines chimiothérapies peuvent déclencher une exacerbation aiguë ; le cours C34 détaille la prise en charge.</p></template>
<template data-pop="j84-mnemo" data-title="Aide-mémoire : les causes à chercher">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Le mot « EMCS » rappelle l’ordre de l’enquête devant une pneumopathie interstitielle : Exposition (professionnelle, domestique, aviaire, moisissures, irradiation), Médicament (actuel et ancien), Connectivite (signes et anticorps), Sarcoïdose (répartition périlymphatique, adénopathies).</p>
<div class="lab">Devant une éosinophilie pulmonaire</div><p>L’ordre est « parasite, médicament, aspergillose, vascularite », puis seulement les formes idiopathiques.</p>
<div class="lab">Limite</div><p>Cette aide ne remplace pas l’anamnèse complète ni la discussion multidisciplinaire.</p></template>
<template data-pop="j84-tabac" data-title="Tabac, vapotage et parenchyme">
<div class="lab">Quantification</div><p>Le médecin note les paquets-années (nombre de paquets par jour multiplié par le nombre d’années) et la date d’arrêt, ainsi que le vapotage et le cannabis.</p>
<div class="lab">Effets</div><p>Le tabac est un facteur de risque de fibrose pulmonaire idiopathique, la cause des pneumopathies liées au tabac et un déclencheur de pneumopathie à éosinophiles aiguë lorsqu’il débute ou reprend. Il réduit l’exposition à la pirfénidone par induction du CYP1A2.</p>
<div class="lab">Conséquence pratique</div><p>L’arrêt est recommandé dans toutes les situations de ce cours ; il est indispensable pour l’accès à la transplantation.</p></template>
<template data-pop="j84-expo" data-title="Expositions à rechercher">
<div class="lab">Professionnelles</div><p>Poussières de bois, de métal ou de pierre, silice, amiante, agriculture et élevage, coiffure et produits chimiques. Le médecin note la durée et l’intensité de chaque exposition.</p>
<div class="lab">Domestiques</div><p>Oiseaux d’intérieur, pigeons, couettes et coussins en plumes, moisissures, humidificateurs, saunas et bains à remous.</p>
<div class="lab">Conséquence pratique</div><p>Une exposition antigénique oriente vers une pneumopathie d’hypersensibilité (J67) ; une exposition minérale vers une pneumoconiose (J60 à J65). En Suisse, une maladie professionnelle se déclare à la Suva ou à l’assureur-accidents.</p></template>
<template data-pop="j84-phs" data-title="Pneumopathie d’hypersensibilité">
<div class="lab">Définition</div><p>La pneumopathie d’hypersensibilité est une réponse immunitaire à un antigène inhalé (protéines aviaires, moisissures, actinomycètes) chez un sujet sensibilisé. Elle peut être non fibrosante ou fibrosante.</p>
<div class="lab">Indices</div><p>Exposition identifiée, nodules centrolobulaires, atténuation en mosaïque avec piégeage expiratoire, lymphocytose au lavage.</p>
<div class="lab">Renvoi</div><p>Les formes liées aux poussières organiques sont codées J67 et traitées dans le cours correspondant ; la forme fibrosante qui progresse remplit souvent les critères de fibrose pulmonaire progressive.</p></template>
<template data-pop="j84-medic" data-title="Médicaments pneumotoxiques">
<div class="lab">Médicaments fréquents</div><p>Amiodarone, nitrofurantoïne, méthotrexate, bléomycine, busulfan, inhibiteurs de points de contrôle immunitaire, certains inhibiteurs de kinases, sels d’or historiques.</p>
<div class="lab">Délais</div><p>La toxicité peut survenir en quelques jours (réaction d’hypersensibilité) ou après des années de traitement (nitrofurantoïne prolongée, amiodarone).</p>
<div class="lab">Ressource</div><p>La base de données Pneumotox (Dijon) recense les médicaments et leurs aspects pulmonaires.</p>
<div class="lab">Conséquence pratique</div><p>L’arrêt du médicament suspect est la première mesure ; le code est J70.2 à J70.4.</p></template>
<template data-pop="j84-ctd" data-title="Signes et anticorps de connectivite">
<div class="lab">Signes à chercher</div><p>Phénomène de Raynaud, sclérodactylie, télangiectasies, ulcérations pulpaires, synovites, papules de Gottron, mains de mécanicien (fissures des faces latérales des doigts), faiblesse musculaire proximale, syndrome sec.</p>
<div class="lab">Valeur</div><p>Ces signes peuvent précéder, accompagner ou suivre la pneumopathie ; leur absence n’exclut pas une connectivite.</p>
<div class="lab">Conséquence pratique</div><p>Le bilan auto-immun se demande chez tout patient. Un patient avec des signes et des anticorps qui ne remplissent pas les critères d’une connectivite est discuté avec un rhumatologue, car son traitement peut comprendre une immunosuppression.</p></template>
<template data-pop="j84-rgo" data-title="Reflux gastro-œsophagien et fibrose">
<div class="lab">Lien</div><p>Le reflux est fréquent dans la fibrose pulmonaire idiopathique. L’hypothèse est que des microinhalations répétées lèsent l’épithélium alvéolaire.</p>
<div class="lab">Preuves</div><p>Les essais et analyses n’ont pas montré que les antiacides ou la chirurgie antireflux ralentissent la fibrose. La recommandation de 2022 les déconseille dans ce but (recommandation conditionnelle, preuve de très faible qualité).</p>
<div class="lab">Conséquence pratique</div><p>Le médecin traite un reflux symptomatique pour soulager le patient, sans promettre d’effet sur la fibrose.</p></template>
<template data-pop="j84-dyspnee" data-title="Dyspnée d’effort des pneumopathies interstitielles">
<div class="lab">Caractérisation</div><p>La dyspnée s’installe lentement, survient d’abord à l’effort et progresse sur des mois. Le patient s’adapte en réduisant ses activités, ce qui retarde la consultation.</p>
<div class="lab">Mécanisme</div><p>La compliance basse augmente le travail respiratoire, la limitation de diffusion provoque une désaturation d’effort, et l’hypertension pulmonaire limite le débit cardiaque.</p>
<div class="lab">Mesure</div><p>Le médecin utilise l’échelle mMRC et un exemple concret (étages, distance), puis le test de marche de six minutes.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, la dyspnée est attribuée à l’âge, à l’obésité ou au cœur. Des crépitants « velcro » doivent faire demander une tomodensitométrie.</p></template>
<template data-pop="j84-toux" data-title="Toux des pneumopathies interstitielles">
<div class="lab">Caractérisation</div><p>La toux est sèche, quinteuse et souvent déclenchée par la parole ou l’inspiration profonde.</p>
<div class="lab">Mécanisme</div><p>La distorsion des voies aériennes par la fibrose, une sensibilité accrue du réflexe de toux et un reflux associé l’entretiennent.</p>
<div class="lab">Retentissement</div><p>Elle altère le sommeil et la qualité de vie et peut provoquer une incontinence urinaire d’effort.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin cherche une cause traitable (reflux, rhinite, inhibiteur de l’enzyme de conversion). En dernier recours, une morphine à faible dose a réduit la toux dans un petit essai randomisé.</p></template>
<template data-pop="j84-crep" data-title="Râles crépitants « velcro »">
<div class="lab">Définition</div><p>Ce sont des bruits discontinus, fins, secs, en fin d’inspiration, qui rappellent l’ouverture d’une bande auto-agrippante.</p>
<div class="lab">Mécanisme</div><p>Des petites voies aériennes fermées en expiration par la rigidité du tissu s’ouvrent brusquement en fin d’inspiration.</p>
<div class="lab">Technique</div><p>Le médecin ausculte les bases postérieures et les régions axillaires, patient assis, pendant des inspirations profondes, avant toute toux.</p>
<div class="lab">Valeur</div><p>Ils sont présents chez la grande majorité des patients atteints de fibrose pulmonaire idiopathique, souvent avant les anomalies radiographiques. Ils sont rares dans la sarcoïdose.</p>
<div class="lab">Piège</div><p>Les crépitants de l’œdème pulmonaire sont plus humides et varient avec le traitement diurétique.</p></template>
<template data-pop="j84-hippo" data-title="Hippocratisme digital">
<div class="lab">Recherche</div><p>Le signe de Schamroth consiste à accoler les faces dorsales des dernières phalanges de deux doigts opposés : la disparition de la fenêtre losangique normale signale un hippocratisme. L’angle de l’ongle avec la peau dépasse 180 degrés.</p>
<div class="lab">Signification</div><p>Il se voit dans une proportion importante des fibroses pulmonaires idiopathiques, mais il est rare dans la sarcoïdose et la pneumopathie d’hypersensibilité.</p>
<div class="lab">Diagnostic différentiel</div><p>Cancer bronchique, bronchectasies, mucoviscidose, cardiopathies cyanogènes, endocardite, maladies inflammatoires intestinales.</p>
<div class="lab">Piège</div><p>Un hippocratisme d’apparition récente chez un patient fibrosé doit faire rechercher un cancer bronchique.</p></template>
