<section class="ilot" id="j84-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 71 ans, ancien menuisier, consulte son médecin de famille à Neuchâtel pour un essoufflement qui progresse depuis dix-huit mois. Il montait deux étages sans s’arrêter il y a deux ans ; il doit maintenant s’arrêter au premier palier. Il tousse sec depuis un an. Il a fumé 30 paquets-années et a arrêté à 60 ans. Deux cures d’antibiotiques pour « bronchite » ne l’ont pas soulagé. L’auscultation trouve des râles crépitants fins aux deux bases, et ses doigts présentent un hippocratisme. La saturation pulsée est de 94 % au repos et tombe à 86 % après trois minutes de marche.</p>
<p>La question qui structure tout le cours est la suivante : <b>ce patient a-t-il une pneumopathie interstitielle diffuse, laquelle, a-t-elle une cause qu’on peut supprimer, et faut-il lui proposer un traitement antifibrosant, une oxygénothérapie ou une évaluation pour une transplantation ?</b></p>
<p>Le même cours traite une seconde famille de maladies du parenchyme, les éosinophilies pulmonaires, réunies dans la catégorie J82. Elles se présentent aussi par une dyspnée et des opacités diffuses, mais elles répondent en général de façon spectaculaire aux corticostéroïdes. Les confondre avec une fibrose prive le patient d’un traitement simple ; l’inverse expose à des corticostéroïdes inutiles.</p>
<p>À la fin de ce cours, le médecin assistant sait reconnaître une pneumopathie interstitielle à l’anamnèse et à l’examen, demander une tomodensitométrie à haute résolution au bon moment, chercher systématiquement une cause (connectivite, exposition, médicament), lire les catégories radiologiques de la recommandation ATS/ERS/JRS/ALAT 2022, reconnaître une exacerbation aiguë et une pneumopathie à éosinophiles aiguë, et expliquer la place du nintédanib et de la pirfénidone selon l’information professionnelle suisse.</p>
<div class="key"><b>Message fondateur.</b> Une dyspnée d’effort progressive avec des crépitants « velcro » aux bases chez un patient de plus de 60 ans n’est pas une bronchite ni une insuffisance cardiaque tant qu’une <button class="w" data-k="j84-tdm">tomodensitométrie à haute résolution (fiche technique et lecture)</button> ne l’a pas exclu. Le délai moyen entre les premiers symptômes et le diagnostic de fibrose pulmonaire idiopathique dépasse souvent un an ; pendant ce délai, la fonction pulmonaire perdue ne se récupère pas, car la fibrose est irréversible.</div>
<div class="key"><b>Prérequis.</b> L’<button class="w" data-k="j84-interst">interstitium pulmonaire (compartiments et rôle)</button>, le <button class="w" data-k="j84-efr">syndrome restrictif (définition fonctionnelle)</button> et la <button class="w" data-k="j84-dlco">capacité de diffusion du monoxyde de carbone (mesure et lecture)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="j84-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>Une <button class="w" data-k="j84-pid">pneumopathie interstitielle diffuse (définition et inventaire)</button> est une maladie du parenchyme pulmonaire qui atteint d’abord l’interstitium, c’est-à-dire la paroi des alvéoles, les septums qui séparent les lobules et le tissu conjonctif autour des bronches et des vaisseaux. Elle épaissit la barrière entre l’air et le sang et rigidifie le poumon. Le terme regroupe plus de deux cents maladies, de causes connues ou inconnues, inflammatoires ou fibrosantes.</p>
<p>Exemple : une femme de 52 ans atteinte de sclérodermie et un homme de 70 ans sans aucune cause identifiable peuvent présenter la même dyspnée, les mêmes crépitants et une capacité vitale forcée (CVF) diminuée de 30 %. La première a une pneumopathie interstitielle associée à une connectivite ; le second a probablement une <button class="w" data-k="j84-fpi">fibrose pulmonaire idiopathique (définition et diagnostic)</button>. Le pronostic et le traitement diffèrent.</p>
<h3>1.1 Classification par la cause</h3>
<p>Le premier réflexe du clinicien consiste à ranger la maladie dans l’une de quatre familles, car la conduite change selon la famille. Le tableau suivant répond à la question « quelle cause chercher, et quel cours traite la maladie ? ».</p>
<table class="t"><tr><th>Famille</th><th>Exemples</th><th>Code et cours</th></tr>
<tr><td>Cause connue : exposition</td><td>Pneumopathie d’hypersensibilité (oiseaux, foin moisi), pneumoconioses (amiante, silice), irradiation</td><td>J60–J70 ; pneumopathie d’hypersensibilité : J67</td></tr>
<tr><td>Cause connue : médicament</td><td>Amiodarone, méthotrexate, nitrofurantoïne, bléomycine, inhibiteurs de points de contrôle immunitaire</td><td>J70.2 à J70.4</td></tr>
<tr><td>Maladie systémique</td><td>Sclérodermie, polyarthrite rhumatoïde, myosites, syndrome de Gougerot-Sjögren ; sarcoïdose</td><td>M30–M36, M05–M06 ; sarcoïdose : D86</td></tr>
<tr><td>Idiopathique</td><td>Fibrose pulmonaire idiopathique, PINS idiopathique, pneumopathie organisée cryptogénique, pneumopathie interstitielle aiguë</td><td>J84.1 et J84.8 (ce cours)</td></tr>
<tr><td>Formes rares à part</td><td>Protéinose alvéolaire, microlithiase alvéolaire</td><td>J84.0 (ce cours)</td></tr></table>
<p>La lecture se fait de haut en bas. Le diagnostic d’une forme idiopathique est un diagnostic d’exclusion : il n’est posé qu’après la recherche active des trois premières familles. L’erreur fréquente consiste à conclure « idiopathique » sans avoir interrogé le patient sur ses oiseaux, sa couette en plumes ou ses traitements anciens. Chez le patient du cas fil rouge, la menuiserie oriente vers une exposition aux poussières de bois, qui est un facteur de risque de fibrose pulmonaire idiopathique et non une cause qui la remplace.</p>
<h3>1.2 Classification des pneumopathies interstitielles idiopathiques (ATS/ERS 2013)</h3>
<p>La classification internationale de 2013 distingue les formes idiopathiques selon leur évolution, car l’évolution guide le traitement. Chaque entité correspond à un aspect histologique et radiologique précis.</p>
<table class="t"><tr><th>Groupe</th><th>Entité clinique</th><th>Aspect radio-histologique</th><th>Évolution habituelle</th></tr>
<tr><td>Fibrosant chronique</td><td>Fibrose pulmonaire idiopathique</td><td><button class="w" data-k="j84-pic">Pneumopathie interstitielle commune (PIC)</button></td><td>Progressive, irréversible</td></tr>
<tr><td>Fibrosant chronique</td><td><button class="w" data-k="j84-pins">PINS idiopathique</button></td><td>Pneumopathie interstitielle non spécifique</td><td>Variable, souvent corticosensible</td></tr>
<tr><td>Liée au tabac</td><td><button class="w" data-k="j84-tabpid">Bronchiolite respiratoire avec pneumopathie interstitielle, pneumopathie interstitielle desquamative</button></td><td>Macrophages pigmentés dans les bronchioles ou les alvéoles</td><td>Amélioration après l’arrêt du tabac</td></tr>
<tr><td>Aiguë ou subaiguë</td><td><button class="w" data-k="j84-po">Pneumopathie organisée cryptogénique</button></td><td>Bourgeons conjonctifs intra-alvéolaires</td><td>Très corticosensible, rechutes fréquentes</td></tr>
<tr><td>Aiguë ou subaiguë</td><td><button class="w" data-k="j84-pia">Pneumopathie interstitielle aiguë (syndrome de Hamman-Rich)</button></td><td>Dommage alvéolaire diffus</td><td>Détresse respiratoire, mortalité élevée</td></tr>
<tr><td>Rares</td><td>Pneumopathie interstitielle lymphoïde ; fibroélastose pleuroparenchymateuse</td><td>Infiltrat lymphoïde ; fibrose apicale sous-pleurale</td><td>Variable</td></tr>
<tr><td>Inclassable</td><td>Pneumopathie interstitielle inclassable</td><td>Données discordantes ou incomplètes</td><td>Selon le comportement observé</td></tr></table>
<p>Le tableau se lit par la dernière colonne. Une maladie qui progresse malgré le traitement de sa cause adopte un comportement de fibrose ; une maladie qui régresse sous corticostéroïdes relève d’un mécanisme inflammatoire. Le piège est de croire qu’un aspect PINS en imagerie suffit à affirmer une PINS idiopathique : une part importante des aspects PINS appartient en réalité à une connectivite, parfois révélée des années plus tard, ce qui impose un bilan auto-immun et une surveillance prolongée.</p>
<h3>1.3 Fibrose pulmonaire progressive</h3>
<p>La recommandation ATS/ERS/JRS/ALAT 2022 a créé la notion de <button class="w" data-k="j84-fpp">fibrose pulmonaire progressive (critères 2022)</button>. Elle s’applique à toute pneumopathie interstitielle fibrosante autre que la fibrose pulmonaire idiopathique, par exemple une pneumopathie d’hypersensibilité fibrosante ou une pneumopathie de polyarthrite rhumatoïde. Elle décrit un comportement et non une maladie : la fibrose progresse comme une fibrose pulmonaire idiopathique malgré la prise en charge habituelle. Cette notion a une conséquence thérapeutique directe, car le nintédanib est autorisé en Suisse dans cette situation.</p>
<h3>1.4 Les deux catégories de la CIM-10-GM 2024 traitées ici</h3>
<p>Le codage de la CIM-10-GM 2024 (BfArM) sépare les éosinophilies (J82) des autres pneumopathies interstitielles (J84). Il exclut explicitement plusieurs causes, qui relèvent d’autres cours. Connaître ces exclusions évite de coder une pneumopathie médicamenteuse en fibrose pulmonaire idiopathique.</p>
<table class="t"><tr><th>Code</th><th>Contenu</th><th>Exclusions renvoyées ailleurs</th></tr>
<tr><td>J82</td><td>Éosinophilie pulmonaire non classée ailleurs : syndrome de Löffler, éosinophilie tropicale, infiltrat éosinophile avec asthme</td><td>Médicaments (J70.2 à J70.4), aspergillose (B44), parasitose précisée (B50–B83), connectivites (M30–M36)</td></tr>
<tr><td>J84.0</td><td>Protéinose alvéolaire, microlithiase alvéolaire</td><td>—</td></tr>
<tr><td>J84.1</td><td>Fibrose pulmonaire idiopathique, pneumopathie interstitielle commune, pneumopathie interstitielle aiguë (Hamman-Rich), alvéolite fibrosante cryptogénique</td><td>Fibrose après irradiation (J70.1), fibrose d’inhalation chimique (J68.4)</td></tr>
<tr><td>J84.8</td><td>Autres pneumopathies interstitielles précisées</td><td>—</td></tr>
<tr><td>J84.9</td><td>Pneumopathie interstitielle sans précision</td><td>—</td></tr>
<tr><td>Ensemble J84</td><td>Cinquième caractère : 0 sans exacerbation aiguë, 1 avec exacerbation aiguë (exemple : J84.11)</td><td>Médicaments (J70.2 à J70.4), emphysème interstitiel (J98.2), agents externes (J60–J70), pneumopathie lymphoïde du VIH (B22)</td></tr></table>
<p>La lecture utile porte sur la troisième colonne. Une éosinophilie pulmonaire sous nitrofurantoïne se code J70, et une aspergillose bronchopulmonaire allergique se code B44 avec renvoi au cours J45 ; elles sont néanmoins décrites ici dans le diagnostic différentiel, parce que le clinicien les rencontre devant le même tableau. Le texte de la CIM-10-GM ne nomme pas la pneumopathie organisée cryptogénique ni la PINS idiopathique ; elles se rangent dans J84.8 ou J84.1 selon l’existence d’une fibrose, ce qui relève d’un usage de codage et non d’une inclusion explicite.</p>
<div class="key"><b>À retenir.</b> Le médecin classe d’abord la pneumopathie interstitielle par sa cause, puis, si aucune cause n’est trouvée, par son aspect et son évolution. La fibrose pulmonaire idiopathique est la forme idiopathique fibrosante la plus fréquente et la plus grave. La fibrose pulmonaire progressive décrit le même comportement évolutif dans d’autres maladies. La partie suivante chiffre ces maladies et leur pronostic.</div>
</section>

<section class="ilot" id="j84-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Aucune prévalence nationale suisse de la fibrose pulmonaire idiopathique n’est publiée à la date de rédaction ; le registre suisse de la fibrose pulmonaire idiopathique décrit des cohortes de centres et non la population générale. Les données européennes servent donc de référence. Une revue systématique de 2015 (Hutchinson et al., European Respiratory Journal) estime l’incidence entre environ 3 et 9 cas pour 100 000 personnes-années en Europe et en Amérique du Nord. Appliquée aux 9 millions d’habitants de la Suisse, cette fourchette donnerait de l’ordre de 270 à 810 nouveaux cas par an ; ce calcul est une extrapolation pédagogique et non une donnée observée.</p>
<p>La maladie touche surtout les hommes, après 60 ans, et le plus souvent d’anciens fumeurs. Avant les antifibrosants, la déclaration ATS/ERS/JRS/ALAT de 2011 indiquait une survie médiane de 2 à 3 ans après le diagnostic ; des cohortes plus récentes rapportent des survies plus longues, en partie parce que le diagnostic est plus précoce. Ces chiffres moyens masquent une grande variabilité : certains patients restent stables plusieurs années, d’autres déclinent en quelques mois.</p>
<h3>2.1 Évaluer le pronostic individuel</h3>
<p>Le pronostic individuel se fonde d’abord sur la fonction respiratoire et sa pente. L’<button class="w" data-k="j84-gap">indice GAP (sexe, âge, CVF, DLCO)</button> classe le patient en trois stades. Le tableau suivant donne la mortalité à un an observée dans la cohorte de dérivation de Ley et al. (2012).</p>
<table class="t"><tr><th>Stade GAP</th><th>Points</th><th>Mortalité à 1 an</th><th>Mortalité à 3 ans</th></tr>
<tr><td>I</td><td>0 à 3</td><td>5,6 %</td><td>16,3 %</td></tr>
<tr><td>II</td><td>4 à 5</td><td>16,2 %</td><td>42,1 %</td></tr>
<tr><td>III</td><td>6 à 8</td><td>39,2 %</td><td>76,8 %</td></tr></table>
<p>Le patient du cas fil rouge est un homme (1 point), de plus de 65 ans (2 points), avec une CVF à 68 % (1 point) et une DLCO à 45 % (1 point) : il totalise 5 points, stade II. Le score n’intègre pas la vitesse de déclin, qui compte autant : une perte absolue de CVF d’au moins 10 % de la valeur prédite en 6 à 12 mois prédit une mortalité plus élevée, quel que soit le stade de départ. L’erreur fréquente est de rassurer un patient au stade I qui perd 300 mL par an.</p>
<h3>2.2 Les autres entités</h3>
<p>Les autres maladies de ce cours sont rares, et leurs chiffres proviennent de séries spécialisées. La protéinose alvéolaire auto-immune a une prévalence d’environ 6 à 7 cas par million d’habitants aux États-Unis et au Japon (McCarthy et al., 2018). La pneumopathie à éosinophiles aiguë touche surtout des adultes jeunes qui viennent de commencer à fumer, de reprendre le tabac ou d’utiliser une cigarette électronique. La pneumopathie à éosinophiles chronique touche davantage les femmes non fumeuses, et environ la moitié des patients ont un asthme. La pneumopathie organisée cryptogénique survient vers 50 à 60 ans sans prédominance de sexe nette ; son pronostic est bon sous corticostéroïdes.</p>
<div class="key"><b>À retenir.</b> La fibrose pulmonaire idiopathique est une maladie du sujet âgé, masculin et ancien fumeur, avec un pronostic sombre et hétérogène. Le médecin estime le pronostic par l’indice GAP et surtout par la pente de la CVF et de la DLCO. Les éosinophilies pulmonaires et la pneumopathie organisée ont au contraire un bon pronostic lorsqu’elles sont reconnues. Les mécanismes expliquent cette opposition.</div>
</section>

<section class="ilot" id="j84-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Dans le poumon normal, la barrière entre l’air alvéolaire et le sang capillaire mesure environ 0,5 µm. Elle comprend le pneumocyte de type I, une membrane basale commune et l’endothélium. Les pneumocytes de type II produisent le surfactant et servent de cellules souches : lorsqu’un pneumocyte de type I meurt, un pneumocyte de type II prolifère et se différencie pour le remplacer. Cette réparation se fait sans cicatrice, et l’architecture reste intacte.</p>
<h3>3.1 Fibrose pulmonaire idiopathique : une réparation qui échoue</h3>
<p>Le modèle actuel décrit une réparation anormale de microlésions répétées de l’épithélium alvéolaire chez un sujet prédisposé. Les lésions proviennent de facteurs répétés : fumée, poussières, microinhalations, virus. La prédisposition repose sur l’âge et sur des variants génétiques, en particulier le variant du promoteur de <button class="w" data-k="j84-gen">MUC5B et les gènes de la télomérase (génétique de la fibrose)</button>. Les pneumocytes de type II vieillis, aux télomères courts, ne parviennent plus à se renouveler ; ils sécrètent alors des signaux profibrosants.</p>
<p>Le signal central est le <button class="w" data-k="j84-tgfb">facteur de croissance transformant bêta (activation et effets)</button>. Il transforme les fibroblastes en myofibroblastes, cellules contractiles qui déposent du collagène et résistent à l’apoptose. Les myofibroblastes s’accumulent en <button class="w" data-k="j84-foyers">foyers fibroblastiques (lésion histologique active)</button> au contact de l’épithélium lésé. La matrice déposée rigidifie le tissu, et cette rigidité stimule à son tour les fibroblastes : la boucle s’entretient même sans nouvelle agression. Ce mécanisme explique pourquoi les corticostéroïdes, qui agissent sur l’inflammation, ne ralentissent pas la fibrose pulmonaire idiopathique, et pourquoi les antifibrosants ralentissent seulement le déclin sans le faire régresser.</p>
<h3>3.2 Des lésions aux symptômes</h3>
<p>La fibrose produit trois conséquences fonctionnelles. Premièrement, le poumon devient moins compliant : il faut une pression plus forte pour le gonfler, d’où un <button class="w" data-k="j84-efr">syndrome restrictif (baisse de la capacité pulmonaire totale)</button> et une respiration rapide et superficielle qui réduit le travail élastique. Deuxièmement, l’épaississement de la barrière et la destruction des capillaires réduisent la surface d’échange : la DLCO baisse souvent avant la CVF. Troisièmement, à l’effort, le débit cardiaque augmente et le temps de passage du globule rouge dans le capillaire raccourcit ; l’oxygène n’a plus le temps de diffuser, et la saturation chute. Le patient du cas fil rouge passe ainsi de 94 % au repos à 86 % à la marche.</p>
<p>La fibrose rétracte le tissu et dilate passivement les bronchioles qui la traversent : ce sont les bronchectasies de traction. Au stade ultime, des espaces kystiques à paroi épaisse se superposent en couches sous la plèvre : c’est le <button class="w" data-k="j84-rayon">rayon de miel (définition radiologique)</button>. La destruction capillaire et l’hypoxie alvéolaire augmentent la résistance vasculaire pulmonaire et peuvent conduire à une <button class="w" data-k="j84-hp">hypertension pulmonaire (pneumopathie interstitielle et cœur droit)</button>.</p>

<text x="330" y="268" text-anchor="middle">Alvéole fibrosée : paroi épaissie,</text><text x="330" y="283" text-anchor="middle">capillaires raréfiés (traits)</text>
<text x="548" y="142" text-anchor="middle">Rayon de miel sous-pleural</text><text x="548" y="268" text-anchor="middle">kystes à paroi épaisse</text><text x="548" y="283" text-anchor="middle">en plusieurs couches</text></g></svg>

<h3>3.3 Mécanismes différents dans les autres entités</h3>
<p>Dans la pneumopathie organisée, une lésion alvéolaire déclenche l’exsudation de fibrine, puis l’organisation de bourgeons de tissu conjonctif lâche dans les alvéoles et les canaux alvéolaires. Ces bourgeons sont jeunes et réversibles, ce qui explique la réponse rapide aux corticostéroïdes. Dans la PINS cellulaire, une inflammation lymphocytaire homogène occupe les parois ; elle répond aussi à l’immunosuppression, alors que la PINS fibrosante répond moins.</p>
<p>Dans la <button class="w" data-k="j84-pap">protéinose alvéolaire (mécanisme du GM-CSF)</button>, le défaut est métabolique et non fibrosant. Le macrophage alvéolaire a besoin du GM-CSF pour dégrader le surfactant ; des autoanticorps neutralisent ce facteur, le surfactant s’accumule et remplit les alvéoles. L’alvéole remplie n’est plus ventilée alors qu’elle reste perfusée : il en résulte un shunt et une hypoxémie, avec une architecture conservée et réversible après lavage.</p>
<p>Dans les éosinophilies pulmonaires, des cytokines de type 2 (<button class="w" data-k="j84-eosbio">IL-5 et éotaxines, biologie de l’éosinophile</button>) recrutent les éosinophiles dans les alvéoles. Leurs granules libèrent des protéines cationiques toxiques qui provoquent un œdème et un exsudat alvéolaire. Les corticostéroïdes induisent l’apoptose des éosinophiles en quelques heures : c’est pourquoi l’amélioration radiologique se voit souvent en quelques jours.</p>
<div class="key"><b>Corrélation physiopathologie → traitement.</b> La fibrose pulmonaire idiopathique est une maladie de la réparation et du fibroblaste : les antifibrosants (nintédanib, pirfénidone) ralentissent le dépôt de matrice, les corticostéroïdes n’apportent rien et l’association prednisone–azathioprine–N-acétylcystéine a augmenté la mortalité. La pneumopathie organisée et les éosinophilies sont des maladies inflammatoires réversibles : les corticostéroïdes sont leur traitement. La protéinose est une maladie de l’épuration : on retire le surfactant par lavage ou on restaure le GM-CSF.</div>
<div class="key"><b>À retenir.</b> Le médecin relie chaque entité à son mécanisme : réparation fibrosante (fibrose pulmonaire idiopathique), organisation réversible (pneumopathie organisée), surcharge métabolique (protéinose), infiltrat éosinophile (J82). La restriction, la baisse de la DLCO et la désaturation d’effort découlent de la rigidité et de la perte de surface d’échange. La partie suivante recense les causes à chercher.</div>
</section>

<section class="ilot" id="j84-4"><h2><span class="n">4</span>Étiologies, facteurs de risque et phénotypes</h2>
<p>Devant toute pneumopathie interstitielle, la recherche d’une cause précède le diagnostic d’une forme idiopathique, parce que la suppression de la cause peut arrêter la maladie. Le médecin interroge de façon systématique selon un ordre fixe ; une <button class="w" data-k="j84-mnemo">aide-mémoire des causes (aide pédagogique)</button> peut l’y aider.</p>
<h3>4.1 Facteurs de risque de la fibrose pulmonaire idiopathique</h3>
<p>Les facteurs de risque augmentent la probabilité de la maladie sans en être la cause unique. Le tableau suivant les classe par niveau de preuve et précise ce que le médecin en fait.</p>
<table class="t"><tr><th>Facteur</th><th>Nature du lien</th><th>Conséquence pratique</th></tr>
<tr><td>Âge supérieur à 60 ans</td><td>Fort ; sénescence épithéliale, télomères courts</td><td>Le diagnostic devient improbable avant 50 ans : chercher une cause</td></tr>
<tr><td>Sexe masculin</td><td>Constant dans les cohortes</td><td>Aucun dépistage spécifique</td></tr>
<tr><td><button class="w" data-k="j84-tabac">Tabagisme (actif ou ancien)</button></td><td>Association reproductible : rapport de cotes d’environ 1,6 pour le tabagisme ancien ou actuel (méta-analyse de Taskar et Coultas, 2006)</td><td>Arrêt obligatoire ; rechercher aussi un emphysème associé</td></tr>
<tr><td><button class="w" data-k="j84-expo">Poussières de bois, de métal, de pierre ; agriculture</button></td><td>Association dans des études cas-témoins</td><td>Anamnèse professionnelle complète ; éventuelle déclaration Suva si exposition professionnelle reconnue</td></tr>
<tr><td>Variant du promoteur de MUC5B</td><td>Facteur génétique commun le plus fort</td><td>Aucun test de routine recommandé</td></tr>
<tr><td>Variants des gènes des télomères (TERT, TERC)</td><td>Formes familiales</td><td>Conseil génétique si au moins deux cas familiaux ou signes de maladie des télomères</td></tr>
<tr><td><button class="w" data-k="j84-rgo">Reflux gastro-œsophagien</button></td><td>Association ; causalité non démontrée</td><td>Traiter un reflux symptomatique ; pas d’inhibiteur de la pompe à protons pour la fibrose seule (ATS 2022)</td></tr></table>
<p>La colonne « nature du lien » rappelle qu’une association n’est pas une causalité. Le reflux en est l’exemple : il est fréquent dans la fibrose pulmonaire idiopathique, mais les essais n’ont pas montré que le traiter ralentit la fibrose ; la recommandation de 2022 déconseille donc les antiacides dans ce seul but. Chez le menuisier du cas fil rouge, l’exposition au bois et le tabac renforcent la probabilité d’une fibrose pulmonaire idiopathique ; ils ne la remplacent pas par un autre diagnostic.</p>
<h3>4.2 Causes des pneumopathies interstitielles secondaires</h3>
<p>Quatre causes se cherchent à chaque fois, car elles sont fréquentes et changent la conduite. Les <button class="w" data-k="j84-ctd">connectivites (signes et anticorps)</button> représentent la première cause secondaire ; la pneumopathie peut les révéler. La <button class="w" data-k="j84-phs">pneumopathie d’hypersensibilité (exposition et renvoi J67)</button> se cache derrière une exposition domestique aux oiseaux, aux plumes ou aux moisissures. Les <button class="w" data-k="j84-medic">médicaments pneumotoxiques (liste et délais)</button> se recherchent sur toute la vie, car la bléomycine ou l’amiodarone peuvent agir des mois après la dernière dose. La sarcoïdose (D86) donne une atteinte périlymphatique à prédominance supérieure, avec des adénopathies hilaires.</p>
<h3>4.3 Causes des éosinophilies pulmonaires</h3>
<p>Une éosinophilie pulmonaire n’est presque jamais « essentielle » avant une enquête complète. Le tableau suivant range les causes par ordre de recherche, du plus urgent à éliminer au plus rare.</p>
<table class="t"><tr><th>Cause</th><th>Indice clé</th><th>Code et cours</th></tr>
<tr><td>Parasites : <button class="w" data-k="j84-loffler">migration larvaire d’Ascaris (syndrome de Löffler)</button>, <button class="w" data-k="j84-strongy">anguillule (Strongyloides)</button>, <button class="w" data-k="j84-tpe">filaires (éosinophilie tropicale)</button></td><td>Voyage, migration, éosinophilie sanguine élevée</td><td>J82 pour Löffler et éosinophilie tropicale ; B50–B83 si parasite précisé</td></tr>
<tr><td>Médicaments et toxiques</td><td>Introduction récente (antibiotiques, anti-inflammatoires, antiépileptiques) ; syndrome DRESS</td><td>J70.2 à J70.4</td></tr>
<tr><td>Aspergillose bronchopulmonaire allergique</td><td>Asthme, IgE totales très élevées, bronchectasies centrales</td><td>B44 ; voir J45</td></tr>
<tr><td>Granulomatose éosinophilique avec polyangéite</td><td>Asthme, polypose, neuropathie, ANCA</td><td>M30.1</td></tr>
<tr><td><button class="w" data-k="j84-hes">Syndrome hyperéosinophilique</button></td><td>Éosinophiles ≥ 1 500/µL persistants, atteinte cardiaque ou cutanée</td><td>D72.1</td></tr>
<tr><td><button class="w" data-k="j84-pea">Pneumopathie à éosinophiles aiguë</button></td><td>Adulte jeune, tabac ou vapotage récent, détresse en quelques jours</td><td>J82</td></tr>
<tr><td><button class="w" data-k="j84-pec">Pneumopathie à éosinophiles chronique</button></td><td>Femme, asthme, opacités périphériques depuis des semaines</td><td>J82</td></tr></table>
<p>La première ligne prime. Un patient qui a vécu en zone tropicale et qui reçoit des corticostéroïdes pour une « pneumopathie à éosinophiles » sans recherche d’anguillule peut développer une hyperinfection mortelle. L’erreur fréquente consiste à prescrire la prednisone le jour de la consultation, avant la sérologie de Strongyloides ou un traitement présomptif par ivermectine.</p>
<div class="key"><b>À retenir.</b> Le médecin cherche chaque fois quatre causes de pneumopathie interstitielle : connectivite, exposition (dont la pneumopathie d’hypersensibilité), médicament, sarcoïdose. Devant une éosinophilie pulmonaire, il élimine d’abord un parasite, puis un médicament, une aspergillose et une vascularite. La partie suivante montre comment l’anamnèse recueille ces informations.</div>
</section>

<section class="ilot" id="j84-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse a deux buts : caractériser la dyspnée et la toux, puis trouver une cause. Elle se mène comme une enquête, car la moitié des causes secondaires ne se trouvent que par l’interrogatoire.</p>
<h3>5.1 Antécédents et expositions</h3>
<p>Le médecin note le <button class="w" data-k="j84-tabac">tabagisme en paquets-années et le vapotage</button>, puis la carrière professionnelle complète, emploi par emploi, avec les <button class="w" data-k="j84-expo">poussières et expositions</button>. Il demande ensuite l’environnement domestique : oiseaux, couette ou coussins en plumes, humidificateur, moisissures visibles, jacuzzi. Il recense tous les <button class="w" data-k="j84-medic">médicaments, actuels et anciens</button>, y compris les chimiothérapies, la radiothérapie thoracique et les immunothérapies. Il recherche des <button class="w" data-k="j84-ctd">symptômes de connectivite</button> : phénomène de Raynaud, arthralgies inflammatoires, sécheresse oculaire et buccale, faiblesse musculaire proximale, éruptions, fissures des doigts. Il demande les antécédents familiaux de fibrose, de cheveux blancs précoces, de cirrhose ou d’aplasie médullaire, qui orientent vers une maladie des télomères. Devant une éosinophilie, il demande les voyages et séjours en zone tropicale, même anciens, et l’asthme.</p>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<p>Le symptôme cardinal est la <button class="w" data-k="j84-dyspnee">dyspnée d’effort progressive (caractérisation et mécanisme)</button>, présente chez presque tous les patients. Le médecin la quantifie par l’échelle mMRC et par un exemple concret, comme le nombre d’étages montés sans arrêt. La <button class="w" data-k="j84-toux">toux sèche (mécanisme et retentissement)</button> touche une majorité des patients atteints de fibrose pulmonaire idiopathique ; elle est souvent rebelle et altère la qualité de vie. La fatigue et l’amaigrissement sont fréquents aux stades avancés. La fièvre oriente vers une infection, une pneumopathie organisée, une pneumopathie à éosinophiles ou une pneumopathie médicamenteuse, et non vers une fibrose pulmonaire idiopathique.</p>
<h3>5.3 Formes typique et atypiques</h3>
<p>La vitesse d’installation constitue le premier discriminant. Les cartes suivantes opposent les présentations que le clinicien doit savoir reconnaître.</p>
<div class="two"><div class="card"><h4>Forme typique : fibrose pulmonaire idiopathique</h4><p>Un homme de plus de 60 ans, ancien fumeur, décrit une dyspnée d’effort qui s’aggrave sur des mois ou des années et une toux sèche. Il n’a ni fièvre ni signe extrarespiratoire. Il a souvent reçu des antibiotiques ou des bronchodilatateurs sans effet.</p></div>
<div class="card"><h4>Pneumopathie interstitielle d’une connectivite</h4><p>Une femme de 45 ans signale un phénomène de Raynaud, des doigts gonflés ou des douleurs articulaires matinales avant ou avec la dyspnée. Une myosite peut s’annoncer par une faiblesse à la montée des escaliers et des « mains de mécanicien ».</p></div></div>
<div class="two"><div class="card"><h4>Pneumopathie organisée</h4><p>Un tableau pseudo-grippal de quelques semaines associe fièvre, toux et dyspnée. Il ne répond pas à deux lignes d’antibiotiques, et les opacités migrent d’une radiographie à l’autre.</p></div>
<div class="card"><h4>Pneumopathie à éosinophiles aiguë</h4><p>Un homme de 22 ans qui a commencé à fumer trois semaines plus tôt développe en moins de sept jours fièvre, toux et hypoxémie sévère, avec des opacités bilatérales qui évoquent un syndrome de détresse respiratoire aiguë.</p></div></div>
<div class="two"><div class="card"><h4>Pneumopathie à éosinophiles chronique</h4><p>Une femme asthmatique de 48 ans maigrit, transpire la nuit et s’essouffle depuis deux mois. Ses opacités périphériques persistent malgré les antibiotiques.</p></div>
<div class="card"><h4>Protéinose alvéolaire</h4><p>Un adulte de 40 ans se plaint d’une dyspnée d’effort insidieuse, peu de toux et peu de signes d’auscultation, alors que l’imagerie montre des opacités étendues. Ce contraste entre une clinique pauvre et une imagerie riche doit faire évoquer le diagnostic.</p></div></div>
<p>Le piège commun à ces présentations est l’étiquette d’infection respiratoire basse. Deux échecs d’antibiothérapie, ou des opacités qui persistent plus de six à huit semaines, imposent de reconsidérer le diagnostic et de demander une tomodensitométrie.</p>
<div class="key"><b>À retenir.</b> L’anamnèse quantifie la dyspnée, caractérise la toux et cherche systématiquement une exposition, un médicament, une connectivite, une histoire familiale et un voyage. La vitesse d’installation (jours, semaines, mois) oriente d’emblée entre les entités. L’examen clinique apporte ensuite des signes très spécifiques.</div>
</section>

<section class="ilot" id="j84-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen clinique d’un poumon normal trouve un murmure vésiculaire symétrique sans bruit surajouté, une fréquence respiratoire de 12 à 20 par minute et une saturation pulsée supérieure ou égale à 95 % à l’air ambiant chez l’adulte jeune. Dans une pneumopathie interstitielle, l’examen recherche trois éléments : la gravité de l’hypoxémie, les signes du poumon fibrosé et les signes d’une cause.</p>
<h3>6.1 État général, signes vitaux et anthropométrie</h3>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p>Le médecin observe la parole et la polypnée superficielle au repos. Il mesure la fréquence respiratoire, la fréquence cardiaque et la <button class="w" data-k="j84-tm6">saturation au repos puis à l’effort (test de marche)</button>. Une saturation normale au repos n’exclut pas une désaturation importante à l’effort, qui oriente l’oxygénothérapie ambulatoire.</p></div>
<div class="card"><h4>Anthropométrie</h4><p>Le poids et l’IMC se notent à chaque visite. Une perte de poids traduit l’évolution de la maladie, le coût énergétique de la respiration ou un effet indésirable digestif des antifibrosants. Une dénutrition aggrave le pronostic et motive un suivi diététique.</p></div></div>
<h3>6.2 Signes ciblés</h3>
<div class="two"><div class="card"><h4>Signes du poumon fibrosé</h4><p>Les <button class="w" data-k="j84-crep">râles crépitants « velcro » (technique et valeur)</button> sont fins, secs, en fin d’inspiration, prédominants aux bases et postérieurs. L’<button class="w" data-k="j84-hippo">hippocratisme digital (recherche et signification)</button> se voit dans environ un quart à la moitié des fibroses pulmonaires idiopathiques selon les séries. L’ampliation thoracique diminue aux stades avancés.</p></div>
<div class="card"><h4>Signes d’une cause ou d’une complication</h4><p>Les <button class="w" data-k="j84-ctd">signes de connectivite</button> comprennent la sclérodactylie, les télangiectasies, les ulcérations pulpaires, les synovites, les papules de Gottron et les mains de mécanicien. Des sibilants orientent vers une éosinophilie avec asthme. Un éclat du deuxième bruit au foyer pulmonaire, des œdèmes et une turgescence jugulaire signalent une <button class="w" data-k="j84-hp">hypertension pulmonaire</button>.</p></div></div>
<div class="trap"><span class="k">Piège</span>Des crépitants bibasaux sont souvent attribués à une insuffisance cardiaque. Les crépitants de l’œdème pulmonaire sont plus humides, varient avec la position et le diurétique, et s’accompagnent d’un NT-proBNP élevé et d’une cardiomégalie. Les crépitants « velcro » persistent après le diurétique et restent identiques d’une visite à l’autre.</div>
<div class="key"><b>À retenir.</b> Chez le patient du cas fil rouge, les crépitants « velcro » bibasaux, l’hippocratisme et la désaturation d’effort composent le tableau typique d’une pneumopathie interstitielle fibrosante. L’absence de signe de connectivite ne l’exclut pas ; les anticorps restent nécessaires. La démarche diagnostique transforme cette suspicion en diagnostic.</div>
