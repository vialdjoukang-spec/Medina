<!-- ===== FENÊTRES : examens et décisions ===== -->
<template data-pop="j84-tdm" data-title="Tomodensitométrie à haute résolution">
<div class="lab">Technique</div><p>L’examen utilise des coupes fines d’environ 1 mm, un filtre de reconstruction dur et aucune injection. Il comprend une acquisition en inspiration complète, des coupes en expiration et des coupes en décubitus ventral.</p>
<div class="lab">Pourquoi chaque acquisition</div><p>L’expiration démasque le piégeage aérique lobulaire de la pneumopathie d’hypersensibilité. Le décubitus ventral distingue une fibrose sous-pleurale postérieure d’une simple hypoventilation déclive, qui disparaît en changeant de position.</p>
<div class="lab">Lecture</div><p>Le radiologue identifie les lésions élémentaires, leur répartition (sous-pleurale, centrolobulaire, périlymphatique, supérieure ou basale), puis classe l’aspect selon les quatre catégories de 2022.</p>
<div class="lab">Valeur et limites</div><p>Elle permet le diagnostic de fibrose pulmonaire idiopathique sans biopsie lorsqu’elle montre une PIC typique ou probable chez un patient sans cause. La concordance entre lecteurs reste imparfaite pour le rayon de miel, d’où l’intérêt d’un radiologue thoracique.</p>
<div class="lab">Erreur fréquente</div><p>Un angioscanner injecté réalisé pour une embolie ne remplace pas une tomodensitométrie à haute résolution : les coupes sont plus épaisses et l’injection modifie les densités.</p></template>
<template data-pop="j84-verre" data-title="Verre dépoli">
<div class="lab">Définition</div><p>Le verre dépoli est une augmentation de densité du parenchyme qui laisse voir les vaisseaux et les parois bronchiques.</p>
<div class="lab">Mécanismes</div><p>Il traduit un comblement alvéolaire partiel (liquide, cellules, surfactant), un épaississement interstitiel fin ou une augmentation du volume sanguin capillaire.</p>
<div class="lab">Valeur</div><p>Isolé, il évoque une maladie active et potentiellement réversible. Associé à des bronchectasies de traction, il correspond à une fibrose fine et ne répond pas aux corticostéroïdes.</p>
<div class="lab">Piège</div><p>Une acquisition en expiration incomplète crée un faux verre dépoli. Chez l’immunodéprimé, un verre dépoli diffus impose de rechercher une pneumocystose.</p></template>
<template data-pop="j84-crazy" data-title="Aspect en « crazy paving »">
<div class="lab">Définition</div><p>Le « crazy paving » associe un verre dépoli et un épaississement des septums interlobulaires et intralobulaires, ce qui dessine un réseau polygonal superposé.</p>
<div class="lab">Causes</div><p>La protéinose alvéolaire en est la cause classique, avec des limites géographiques nettes entre zones atteintes et zones saines. L’œdème pulmonaire, la pneumocystose, l’hémorragie alvéolaire, la pneumopathie à éosinophiles aiguë et l’adénocarcinome mucineux peuvent le produire.</p>
<div class="lab">Conséquence pratique</div><p>L’aspect n’est pas spécifique : le contexte clinique, le lavage et les anticorps anti-GM-CSF tranchent.</p></template>
<template data-pop="j84-efr" data-title="Syndrome restrictif">
<div class="lab">Définition</div><p>Le syndrome restrictif est une diminution de la capacité pulmonaire totale au-dessous de la limite inférieure de la normale, mesurée par pléthysmographie ou par dilution gazeuse.</p>
<div class="lab">Mécanisme dans les pneumopathies interstitielles</div><p>La fibrose diminue la compliance et réduit tous les volumes. Le rapport VEMS/CVF reste normal ou augmente, car la traction élastique accrue maintient les bronches ouvertes et le volume à expirer est plus petit.</p>
<div class="lab">Autres causes de restriction</div><p>Obésité, maladies neuromusculaires, déformations thoraciques, épanchements pleuraux, résection pulmonaire. Dans ces cas, la DLCO est souvent normale et le KCO augmenté.</p>
<div class="lab">Piège</div><p>Une CVF basse ne prouve pas une restriction : un piégeage aérique de l’obstruction l’abaisse aussi. Seule la CPT tranche.</p></template>
<template data-pop="j84-dlco" data-title="Capacité de diffusion du monoxyde de carbone">
<div class="lab">Technique</div><p>Le patient inspire un mélange contenant une faible concentration de monoxyde de carbone et un gaz traceur, retient sa respiration environ dix secondes, puis expire. L’appareil calcule la quantité de monoxyde de carbone captée par minute et par unité de pression. La norme technique est celle de l’ERS et de l’ATS (2017).</p>
<div class="lab">Lecture</div><p>La DLCO égale le KCO multiplié par le volume alvéolaire. Elle se corrige pour l’hémoglobine, car une anémie la diminue et une polyglobulie l’augmente. Les valeurs se comparent à la limite inférieure de la normale.</p>
<div class="lab">Valeur</div><p>Elle baisse précocement dans les pneumopathies interstitielles et dans l’atteinte vasculaire pulmonaire. Une baisse d’au moins 10 % de la valeur prédite en un an entre dans la définition de la fibrose pulmonaire progressive.</p>
<div class="lab">Piège</div><p>Le tabagisme récent augmente la carboxyhémoglobine et abaisse faussement la DLCO ; le patient ne fume pas le jour de l’examen.</p></template>
<template data-pop="j84-tm6" data-title="Test de marche de six minutes">
<div class="lab">Technique</div><p>Selon la norme de l’ATS (2002), le patient marche le plus loin possible pendant six minutes dans un couloir plat d’environ 30 m, avec encouragements standardisés. La saturation et la fréquence cardiaque sont enregistrées en continu.</p>
<div class="lab">Lecture</div><p>Le médecin note la distance, la saturation la plus basse et la dyspnée de fin de test. La distance se compare à des équations de référence selon l’âge, le sexe, la taille et le poids.</p>
<div class="lab">Valeur</div><p>Une saturation qui descend sous 88 % est associée à un pronostic plus sombre dans la fibrose pulmonaire idiopathique et guide l’oxygène ambulatoire. Une variation de 24 à 45 m représente la plus petite différence cliniquement importante estimée dans cette maladie.</p>
<div class="lab">Piège</div><p>Un oxymètre de doigt mal capté (doigts froids, vernis, phénomène de Raynaud) sous-estime la saturation ; un capteur frontal ou auriculaire est plus fiable.</p></template>
<template data-pop="j84-sero" data-title="Bilan auto-immun d’une pneumopathie interstitielle">
<div class="lab">Contenu</div><p>Anticorps antinucléaires avec aspect et titre, anticorps anti-antigènes nucléaires solubles (dont anti-SSA et anti-SSB), facteur rhumatoïde, anticorps anti-CCP, anticorps de la sclérodermie (anti-topoisomérase I, anti-centromère, anti-ARN polymérase III), panel des myosites (antisynthétases, anti-MDA5), ANCA, créatine kinase.</p>
<div class="lab">Pourquoi chez tous</div><p>Une pneumopathie peut être la première manifestation d’une connectivite, notamment d’un syndrome des antisynthétases. La découverte change le traitement vers l’immunosuppression.</p>
<div class="lab">Interprétation</div><p>Un titre bas d’anticorps antinucléaires est fréquent après 60 ans sans maladie. Un anticorps spécifique (anti-CCP, anti-Jo-1, anti-topoisomérase I) a une valeur bien supérieure.</p>
<div class="lab">Conséquence pratique</div><p>Un résultat positif conduit à un avis rhumatologique et à une discussion multidisciplinaire.</p></template>
<template data-pop="j84-lba" data-title="Lavage bronchoalvéolaire">
<div class="lab">Technique</div><p>Au cours d’une bronchoscopie, le médecin bloque l’endoscope dans une bronche segmentaire, instille du sérum physiologique tiède par fractions (habituellement 100 à 300 mL au total) et le réaspire doucement. Le segment est choisi selon la tomodensitométrie.</p>
<div class="lab">Analyses</div><p>Formule cellulaire, cultures et PCR (bactéries, mycobactéries, Pneumocystis jirovecii, virus), cytologie, coloration de Perls pour les sidérophages, coloration par l’acide périodique de Schiff en cas de suspicion de protéinose.</p>
<div class="lab">Valeurs normales</div><p>Chez l’adulte non fumeur : macrophages supérieurs à 85 %, lymphocytes de 10 à 15 %, neutrophiles au plus 3 %, éosinophiles au plus 1 %, mastocytes moins de 0,5 % (déclaration ATS 2012).</p>
<div class="lab">Valeur et limites</div><p>Il oriente sans prouver, sauf pour la protéinose, la pneumopathie à éosinophiles et certaines infections. Il est risqué chez un patient très hypoxémique et peut déclencher une exacerbation.</p></template>
<template data-pop="j84-cryo" data-title="Cryobiopsie transbronchique">
<div class="lab">Technique</div><p>Une sonde refroidie est introduite par bronchoscopie vers la périphérie ; le tissu gelé adhère à la sonde et est arraché, ce qui fournit des fragments plus grands qu’une pince classique.</p>
<div class="lab">Place</div><p>La recommandation ATS/ERS/JRS/ALAT 2022 la considère comme une alternative acceptable à la biopsie chirurgicale dans les centres expérimentés (recommandation conditionnelle). L’ERS a publié en 2022 une recommandation spécifique sur sa réalisation.</p>
<div class="lab">Risques</div><p>Le pneumothorax est la complication la plus fréquente, suivi du saignement ; un ballonnet de blocage bronchique est mis en place de façon préventive.</p>
<div class="lab">Limite</div><p>Un prélèvement non représentatif peut manquer l’hétérogénéité de la PIC ; le résultat s’interprète en discussion multidisciplinaire.</p></template>
<template data-pop="j84-bx" data-title="Biopsie pulmonaire chirurgicale">
<div class="lab">Technique</div><p>Le chirurgien prélève par vidéothoracoscopie plusieurs fragments dans au moins deux lobes, en évitant les zones terminales de rayon de miel.</p>
<div class="lab">Risque</div><p>Une analyse américaine de 2016 (Hutchinson et al.) rapporte une mortalité hospitalière d’environ 1,7 % pour les biopsies programmées et d’environ 16 % pour les biopsies non programmées.</p>
<div class="lab">Indication</div><p>Elle se discute lorsque l’imagerie et le lavage ne suffisent pas et que le diagnostic changera le traitement, chez un patient dont la fonction le permet.</p>
<div class="lab">Contre-indications relatives</div><p>Hypoxémie importante, hypertension pulmonaire, fragilité, exacerbation en cours.</p></template>
<template data-pop="j84-dmd" data-title="Discussion multidisciplinaire">
<div class="lab">Composition</div><p>Elle réunit au minimum un pneumologue et un radiologue thoracique expérimentés en pneumopathies interstitielles, avec un pathologiste si une histologie existe, et souvent un rhumatologue.</p>
<div class="lab">Rôle</div><p>Elle confronte l’anamnèse, l’examen, l’imagerie, la biologie, le lavage et l’histologie pour retenir un diagnostic, souvent avec un degré de confiance (certain, probable, de travail).</p>
<div class="lab">Valeur</div><p>La concordance diagnostique est meilleure en discussion multidisciplinaire qu’avec un seul spécialiste ; c’est la référence du diagnostic des pneumopathies interstitielles selon la recommandation de 2022.</p>
<div class="lab">Conséquence pratique</div><p>Un diagnostic de travail est réévalué selon l’évolution : une maladie qui progresse comme une fibrose pulmonaire idiopathique peut être reclassée.</p></template>
<template data-pop="j84-gap" data-title="Indice GAP">
<div class="lab">Calcul (Ley et al., 2012)</div><p>Sexe : femme 0, homme 1. Âge : 60 ans ou moins 0, 61 à 65 ans 1, plus de 65 ans 2. CVF en pourcentage de la valeur prédite : plus de 75 % 0, 50 à 75 % 1, moins de 50 % 2. DLCO en pourcentage de la valeur prédite : plus de 55 % 0, 36 à 55 % 1, 35 % ou moins 2, impossible à réaliser 3.</p>
<div class="lab">Stades</div><p>Stade I : 0 à 3 points ; stade II : 4 à 5 points ; stade III : 6 à 8 points. Mortalité à un an dans la cohorte de dérivation : 5,6 %, 16,2 % et 39,2 %.</p>
<div class="lab">Limites</div><p>L’indice ne tient compte ni de la pente du déclin, ni des comorbidités, ni du traitement antifibrosant ; il a été établi avant la généralisation des antifibrosants.</p></template>
<template data-pop="j84-gen" data-title="Génétique de la fibrose pulmonaire">
<div class="lab">Variants communs</div><p>Le variant rs35705950 du promoteur de MUC5B est le facteur de risque génétique commun le plus fort de fibrose pulmonaire idiopathique. Il est fréquent dans la population européenne et n’a pas de valeur diagnostique individuelle.</p>
<div class="lab">Variants rares</div><p>Les variants des gènes de la télomérase (TERT, TERC) et d’autres gènes des télomères expliquent une partie des fibroses familiales. Les variants des gènes du surfactant (SFTPC, SFTPA2) touchent l’adulte jeune ou l’enfant.</p>
<div class="lab">Quand y penser</div><p>Au moins deux cas familiaux de pneumopathie interstitielle, un début avant 50 ans, des cheveux blancs précoces, une cytopénie, une cirrhose cryptogénique.</p>
<div class="lab">Conséquence pratique</div><p>Le conseil génétique et les tests se discutent en centre ; une maladie des télomères modifie la préparation à la transplantation.</p></template>
