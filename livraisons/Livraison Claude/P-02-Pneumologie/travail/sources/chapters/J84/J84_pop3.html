<!-- ===== FENÊTRES : médicaments et prise en charge ===== -->
<template data-pop="j84-d-nint" data-title="Nintédanib (Ofev)">
<div class="lab">Mécanisme</div><p>Le nintédanib est un inhibiteur intracellulaire des récepteurs à activité tyrosine kinase PDGFR, FGFR et VEGFR. Il occupe la poche de l’ATP de ces récepteurs et réduit la prolifération, la migration et la différenciation des fibroblastes.</p>
<div class="lab">Indications suisses</div><p>Chez l’adulte : fibrose pulmonaire idiopathique, pneumopathies interstitielles fibrosantes chroniques avec phénotype progressif, pneumopathie de la sclérodermie systémique (information professionnelle Ofev, mise à jour mars 2025, ch.oddb.org consulté le 08.10.2026).</p>
<div class="lab">Preuves</div><p>INPULSIS-1 et 2 (2014) : déclin annuel de la CVF −113,6 contre −223,5 mL par an (données regroupées). INBUILD (2019) : −80,8 contre −187,8 mL par an dans les fibroses progressives autres que la fibrose pulmonaire idiopathique ; aucune différence significative de mortalité. SENSCIS (2019) : ralentissement du déclin dans la sclérodermie.</p>
<div class="lab">Posologie</div><p>150 mg deux fois par jour, à environ 12 heures d’intervalle, avec un repas, capsules avalées entières. Réduction à 100 mg deux fois par jour en cas d’intolérance ou d’insuffisance hépatique Child-Pugh A ; arrêt si 100 mg deux fois par jour sont mal tolérés. Maximum 300 mg par jour.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée (62,4 % contre 18,4 % sous placebo dans INPULSIS), nausées, vomissements, perte de poids, élévation des transaminases, saignements surtout mineurs, rares perforations digestives, protéinurie et microangiopathie thrombotique.</p>
<div class="lab">Contre-indications</div><p>Grossesse ; hypersensibilité au nintédanib, à l’arachide ou au soja. Non recommandé en Child-Pugh B ou C.</p>
<div class="lab">Surveillance</div><p>Transaminases et bilirubine au début, à intervalles réguliers pendant trois mois puis périodiquement. Arrêt si les transaminases dépassent 5 fois la limite supérieure de la normale, ou 3 fois avec signes d’atteinte hépatique sévère. Contraception très efficace jusqu’à trois mois après la dernière dose.</p></template>
<template data-pop="j84-d-pirf" data-title="Pirfénidone (Esbriet et génériques)">
<div class="lab">Mécanisme</div><p>Le mécanisme exact n’est pas établi. Dans les modèles expérimentaux, la pirfénidone réduit la prolifération des fibroblastes, la production de facteur de croissance transformant bêta et de collagène, et exerce un effet antioxydant.</p>
<div class="lab">Indication suisse</div><p>Fibrose pulmonaire idiopathique de l’adulte (information professionnelle Esbriet, mise à jour août 2022, ch.oddb.org consulté le 08.10.2026).</p>
<div class="lab">Preuves</div><p>CAPACITY (2011) : un des deux essais a atteint son critère principal. ASCEND (2014) : la proportion de patients avec un déclin de la CVF d’au moins 10 % ou un décès à 52 semaines passe de 31,8 % à 16,5 %.</p>
<div class="lab">Posologie</div><p>267 mg trois fois par jour les jours 1 à 7, 534 mg trois fois par jour les jours 8 à 14, puis 801 mg trois fois par jour, pendant les repas. Maximum 2 403 mg par jour. Nouvelle titration après 14 jours consécutifs d’interruption.</p>
<div class="lab">Effets indésirables</div><p>Nausées, dyspepsie, anorexie, perte de poids, photosensibilité et éruptions cutanées, élévation des transaminases, rares angio-œdèmes.</p>
<div class="lab">Contre-indications</div><p>Fluvoxamine ; insuffisance hépatique sévère ; clairance de la créatinine inférieure à 30 mL/min ou dialyse ; hypersensibilité. Grossesse : pas d’utilisation sauf nécessité absolue.</p>
<div class="lab">Surveillance</div><p>Tests hépatiques avant le début, chaque mois pendant six mois puis tous les trois mois ; protection solaire quotidienne ; arrêt du tabac, qui réduit l’exposition d’environ moitié.</p></template>
<template data-pop="j84-d-neran" data-title="Nérandomilast">
<div class="lab">Mécanisme</div><p>Le nérandomilast inhibe de façon préférentielle la phosphodiestérase 4B. L’élévation de l’AMPc qui en résulte réduit l’activation des fibroblastes et la production de médiateurs inflammatoires.</p>
<div class="lab">Preuves</div><p>FIBRONEER-IPF (New England Journal of Medicine 2025) : variation de la CVF à 52 semaines −114,7 mL avec 18 mg deux fois par jour, −138,6 mL avec 9 mg et −183,5 mL sous placebo, avec ou sans antifibrosant de fond. FIBRONEER-ILD (2025) : critère principal atteint dans la fibrose pulmonaire progressive. Ces valeurs proviennent de la publication citée par des synthèses secondaires ; le texte intégral n’a pas été consulté pour ce cours.</p>
<div class="lab">Statut réglementaire</div><p>Autorisé par la FDA en octobre 2025 et dans l’Union européenne le 15 juillet 2026 (Jascayd) pour la fibrose pulmonaire idiopathique et la fibrose pulmonaire progressive. Aucune autorisation de Swissmedic n’a été retrouvée au 8 octobre 2026.</p>
<div class="lab">Effets indésirables</div><p>La diarrhée est l’effet le plus fréquent (plus d’un patient sur dix), suivie de la perte de poids ; une réduction de dose permet souvent de poursuivre le traitement (Agence européenne des médicaments).</p>
<div class="lab">Conséquence pratique</div><p>En Suisse, son emploi relève d’une importation individuelle ou d’un essai clinique, décidé par un centre de pneumologie.</p></template>
<template data-pop="j84-d-cs" data-title="Corticostéroïdes dans les pneumopathies interstitielles">
<div class="lab">Mécanisme</div><p>Les glucocorticoïdes inhibent la transcription de cytokines inflammatoires, réduisent le recrutement des lymphocytes et induisent l’apoptose des éosinophiles.</p>
<div class="lab">Indications</div><p>Pneumopathie organisée, PINS cellulaire, pneumopathies à éosinophiles aiguë et chronique, pneumopathies de connectivite (avec un immunosuppresseur), formes médicamenteuses sévères, exacerbation aiguë de fibrose pulmonaire idiopathique (usage courant, preuve faible).</p>
<div class="lab">Non-indication</div><p>Fibrose pulmonaire idiopathique stable : l’essai PANTHER-IPF (2012) a montré une mortalité accrue sous prednisone, azathioprine et N-acétylcystéine.</p>
<div class="lab">Posologies usuelles</div><p>Pneumopathie organisée : prednisone 0,5 à 1 mg/kg par jour puis décroissance sur 6 à 12 mois. Pneumopathie à éosinophiles chronique : 0,5 mg/kg par jour pendant deux semaines puis décroissance. Pneumopathie à éosinophiles aiguë : deux semaines au total (Rhee et al., 2013). Ces schémas relèvent de l’expérience des centres.</p>
<div class="lab">Précautions</div><p>Exclure l’anguillulose chez le patient exposé ; ostéoprotection ; prophylaxie de la pneumocystose en cas de dose élevée prolongée ; surveillance de la glycémie, de la tension et de l’humeur.</p></template>
<template data-pop="j84-d-mmf" data-title="Mycophénolate mofétil (hors indication)">
<div class="lab">Mécanisme</div><p>L’acide mycophénolique inhibe l’inosine monophosphate déshydrogénase, enzyme de la synthèse de novo des purines dont dépendent les lymphocytes ; il réduit leur prolifération.</p>
<div class="lab">Preuves</div><p>L’essai SLS II (2016) a comparé le mycophénolate mofétil (jusqu’à 1 500 mg deux fois par jour pendant 24 mois) au cyclophosphamide oral dans la pneumopathie de la sclérodermie : l’amélioration de la CVF était comparable, avec une meilleure tolérance du mycophénolate.</p>
<div class="lab">Statut en Suisse</div><p>Il est autorisé en transplantation d’organe ; son emploi dans les pneumopathies de connectivite est hors indication et se décide en centre.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Troubles digestifs, leucopénie, infections, risque tératogène majeur : contraception efficace obligatoire et contre-indication pendant la grossesse.</p>
<div class="lab">Surveillance</div><p>Formule sanguine et tests hépatiques réguliers, surtout pendant les premiers mois.</p></template>
<template data-pop="j84-d-gmcsf" data-title="GM-CSF inhalé dans la protéinose">
<div class="lab">Principe</div><p>Le GM-CSF inhalé atteint directement les macrophages alvéolaires, dépasse la neutralisation par les autoanticorps et restaure le catabolisme du surfactant.</p>
<div class="lab">Preuves</div><p>Dans l’essai IMPALA-2 (New England Journal of Medicine 2025), le molgramostim inhalé 300 µg une fois par jour a amélioré la DLCO à 24 semaines par rapport au placebo dans la protéinose auto-immune.</p>
<div class="lab">Statut</div><p>Au 8 octobre 2026, le molgramostim inhalé n’est autorisé ni en Suisse ni dans l’Union européenne ; une décision de la FDA est attendue pour novembre 2026. Le sargramostim est utilisé hors autorisation dans certains pays.</p>
<div class="lab">Conséquence pratique</div><p>Le lavage pulmonaire total reste le traitement de référence en Suisse ; le GM-CSF inhalé relève d’un centre spécialisé.</p></template>
<template data-pop="j84-d-antipar" data-title="Antiparasitaires des éosinophilies pulmonaires">
<div class="lab">Ivermectine (Subvectin 3 mg)</div><p>Elle active les canaux chlorure glutamate-dépendants des nématodes et paralyse le parasite. Indication suisse : anguillulose gastro-intestinale, 200 µg/kg en prise unique, et microfilarémie à Wuchereria bancrofti. Elle est la mesure de sécurité avant une corticothérapie chez un patient exposé.</p>
<div class="lab">Albendazole (Zentel)</div><p>Il inhibe la polymérisation de la tubuline du parasite. Ascaris : 400 mg en dose unique chez l’adulte et l’enfant de plus de 2 ans (information professionnelle mise à jour en octobre 2025). Il agit sur les vers intestinaux plutôt que sur les larves en migration.</p>
<div class="lab">Diéthylcarbamazine</div><p>Elle traite l’éosinophilie pulmonaire tropicale à 6 mg/kg par jour pendant 14 à 21 jours selon les Centers for Disease Control and Prevention. Elle n’est pas commercialisée en Suisse et s’obtient par un centre de médecine tropicale.</p>
<div class="lab">Piège</div><p>Chez un patient venant d’une zone d’endémie de la loase, la diéthylcarbamazine et l’ivermectine peuvent provoquer une encéphalopathie si la microfilarémie de Loa loa est élevée ; un avis de médecine tropicale est nécessaire.</p></template>
<template data-pop="j84-o2" data-title="Oxygénothérapie">
<div class="lab">Au repos</div><p>Les critères classiques de l’oxygénothérapie de longue durée proviennent d’essais menés dans la BPCO : PaO₂ au repos de 7,3 kPa (55 mmHg) ou moins, ou de 7,3 à 8,0 kPa avec signes de cœur pulmonaire ou polyglobulie. Ils sont extrapolés aux pneumopathies interstitielles faute d’essai spécifique.</p>
<div class="lab">À l’effort</div><p>Chez les patients qui désaturent à l’effort sans hypoxémie de repos, l’essai AmbOx (2018) a montré une amélioration de la qualité de vie liée à la maladie avec l’oxygène ambulatoire.</p>
<div class="lab">Mécanisme</div><p>L’oxygène augmente la pression partielle alvéolaire, donc le gradient de diffusion ; il réduit aussi la vasoconstriction hypoxique.</p>
<div class="lab">Conséquence pratique</div><p>La prescription se fonde sur une gazométrie et un test de marche, et se réévalue. En Suisse, la Ligue pulmonaire organise souvent la fourniture et le suivi des appareils.</p></template>
<template data-pop="j84-rehab" data-title="Réadaptation pulmonaire">
<div class="lab">Contenu</div><p>Le programme associe un entraînement en endurance et en force, une éducation thérapeutique, un soutien nutritionnel et psychologique, et l’ajustement de l’oxygène pendant l’effort.</p>
<div class="lab">Bénéfice</div><p>Dans les pneumopathies interstitielles, la réadaptation améliore la distance de marche, la dyspnée et la qualité de vie ; l’effet s’atténue avec le temps si l’activité n’est pas maintenue.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin adresse le patient à un programme reconnu par la Société suisse de pneumologie, de préférence tôt, quand la capacité d’entraînement est encore bonne.</p></template>
<template data-pop="j84-vacc" data-title="Vaccinations">
<div class="lab">Principe</div><p>Une infection respiratoire peut déclencher une exacerbation aiguë et décompenser un patient sans réserve ventilatoire.</p>
<div class="lab">Recommandations</div><p>Le Plan de vaccination suisse de l’OFSP recommande aux patients atteints de maladie pulmonaire chronique la vaccination annuelle contre la grippe et la vaccination contre le pneumocoque ; les vaccinations contre la COVID-19 et contre le VRS suivent les critères d’âge et de risque du plan en vigueur.</p>
<div class="lab">Particularité</div><p>Un traitement immunosuppresseur (corticostéroïdes à forte dose, mycophénolate, rituximab) réduit la réponse vaccinale et contre-indique les vaccins vivants ; les vaccins se font si possible avant de le commencer.</p></template>
<template data-pop="j84-tx" data-title="Transplantation pulmonaire">
<div class="lab">Adressage</div><p>Le consensus de l’ISHLT 2021 recommande d’adresser tôt les patients atteints d’une pneumopathie fibrosante (PIC ou PINS fibrosante), dès le diagnostic, indépendamment de la fonction, afin que l’évaluation précède une éventuelle aggravation rapide.</p>
<div class="lab">Inscription</div><p>Le consensus cite comme motifs d’inscription un déclin rapide de la CVF ou de la DLCO, une désaturation importante à l’effort, une hypertension pulmonaire ou une hospitalisation pour aggravation respiratoire ; les seuils chiffrés figurent dans le document de l’ISHLT et s’appliquent au cas par cas par le centre.</p>
<div class="lab">Limites</div><p>L’âge avancé, l’obésité, la fragilité, une maladie des télomères et les comorbidités graves augmentent le risque et peuvent contre-indiquer la greffe.</p>
<div class="lab">En Suisse</div><p>Les transplantations pulmonaires se pratiquent à l’USZ (Zurich) et au CHUV (Lausanne).</p></template>
<template data-pop="j84-pallia" data-title="Soins palliatifs et traitements symptomatiques">
<div class="lab">Quand</div><p>Les soins palliatifs commencent lorsque les symptômes altèrent la vie quotidienne, en parallèle des antifibrosants, et non seulement en fin de vie.</p>
<div class="lab">Dyspnée</div><p>Les opioïdes à faible dose, titrés prudemment, réduisent la sensation de dyspnée réfractaire ; le ventilateur dirigé vers le visage, la position et la gestion de l’anxiété y contribuent.</p>
<div class="lab">Toux et diarrhée</div><p>Une morphine à faible dose peut réduire une toux réfractaire. Le lopéramide traite la diarrhée induite par le nintédanib dès les premières selles liquides.</p>
<div class="lab">Directives anticipées</div><p>Le patient formule ses souhaits sur la réanimation et l’intubation tant qu’il est stable, car l’exacerbation aiguë a un pronostic sombre et laisse peu de temps pour décider.</p></template>
