<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j84-clin" data-title="Pareto — Définitions, mécanismes et clinique">
<p class="ratio" data-cover="j84-0,j84-1,j84-2,j84-3,j84-4,j84-5,j84-6"></p>
<ul>
<li>Une pneumopathie interstitielle se classe d’abord par sa cause : exposition, médicament, connectivite ou sarcoïdose, sinon forme idiopathique.</li>
<li>La fibrose pulmonaire idiopathique (J84.1) touche surtout l’homme de plus de 60 ans, ancien fumeur ; elle associe une PIC et décline sans traitement d’environ 200 mL de CVF par an.</li>
<li>La fibrose pulmonaire progressive (2022) applique ce comportement évolutif aux autres fibroses : deux critères sur trois en un an.</li>
<li>Le mécanisme est une réparation épithéliale anormale qui active le TGF-β et les myofibroblastes ; les corticostéroïdes n’y agissent pas.</li>
<li>La restriction, la DLCO basse et la désaturation d’effort découlent de la rigidité et de la perte de surface d’échange.</li>
<li>Le pronostic se lit par l’indice GAP et surtout par la pente de la CVF et de la DLCO.</li>
<li>L’anamnèse cherche tabac, poussières, oiseaux et moisissures, médicaments, signes de connectivite, histoire familiale et voyages.</li>
<li>Les crépitants « velcro » bibasaux, l’hippocratisme et la désaturation à la marche imposent une tomodensitométrie à haute résolution.</li>
<li>J82 regroupe Löffler, éosinophilie tropicale et infiltrat éosinophile avec asthme ; les formes médicamenteuses (J70) et l’aspergillose (B44) sont codées ailleurs.</li>
</ul></template>
<template data-pop="pareto-j84-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j84-7"></p>
<ul>
<li>Tomodensitométrie à haute résolution (inspiration, expiration, décubitus ventral) et EFR complètes avec DLCO chez tout patient suspect.</li>
<li>Bilan auto-immun chez tous, même sans symptôme extrarespiratoire.</li>
<li>PIC typique ou probable sans cause : fibrose pulmonaire idiopathique retenue sans biopsie en discussion multidisciplinaire (2022).</li>
<li>Aspect indéterminé ou évocateur d’un autre diagnostic : lavage bronchoalvéolaire, puis cryobiopsie ou biopsie chirurgicale si le bénéfice dépasse le risque.</li>
<li>Éliminer d’abord infection, œdème cardiogénique, hémorragie alvéolaire et cancer.</li>
<li>Éosinophilie : plus de 500/µL ; lavage &gt; 25 % dans la forme aiguë, souvent avec une numération sanguine normale au début.</li>
</ul></template>
<template data-pop="pareto-j84-urg" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="j84-8"></p>
<ul>
<li>Exacerbation aiguë : aggravation de moins d’un mois, verre dépoli nouveau sur PIC, sans insuffisance cardiaque suffisante pour l’expliquer.</li>
<li>Éliminer embolie pulmonaire, infection et insuffisance cardiaque ; oxygène ; corticostéroïdes d’usage courant sans preuve ; pas de cyclophosphamide (EXAFIP).</li>
<li>Environ la moitié des patients hospitalisés meurent ; les directives anticipées se préparent avant la crise.</li>
<li>Autres urgences : pneumopathie à éosinophiles aiguë, pneumopathie anti-MDA5, hyperinfection à Strongyloides sous corticostéroïdes.</li>
<li>Complications chroniques : cancer bronchique, hypertension pulmonaire, pneumothorax.</li>
</ul></template>
<template data-pop="pareto-j84-tt" data-title="Pareto — Traitements">
<p class="ratio" data-cover="j84-9,j84-10"></p>
<ul>
<li>Pour tous : arrêt du tabac, vaccinations, réadaptation, oxygène si hypoxémie, reflux traité pour lui-même.</li>
<li>Fibrose pulmonaire idiopathique : nintédanib 150 mg deux fois par jour ou pirfénidone 801 mg trois fois par jour ; efficacité comparable, choix par les effets indésirables.</li>
<li>Jamais d’association prednisone, azathioprine et N-acétylcystéine ; pas de warfarine, d’ambrisentan ni d’imatinib.</li>
<li>Adresser tôt au centre de transplantation (USZ, CHUV) ; soins palliatifs précoces.</li>
<li>Fibrose pulmonaire progressive : traiter la cause, puis nintédanib (INBUILD).</li>
<li>Pneumopathie organisée et PINS : corticostéroïdes, épargne par mycophénolate ; sclérodermie : mycophénolate puis nintédanib.</li>
<li>Protéinose : lavage pulmonaire total ; GM-CSF inhalé non autorisé en Suisse.</li>
</ul></template>
<template data-pop="pareto-j84-eos" data-title="Pareto — Éosinophilies pulmonaires">
<p class="ratio" data-cover="j84-11"></p>
<ul>
<li>Löffler : larves d’Ascaris, opacités fugaces, guérison spontanée ; selles négatives au début ; albendazole ensuite.</li>
<li>Éosinophilie tropicale : filaires, toux nocturne, éosinophiles souvent &gt; 3 000/µL ; diéthylcarbamazine.</li>
<li>Forme aiguë : jeune, tabac récent, détresse, lavage &gt; 25 % ; corticostéroïdes deux semaines, arrêt du tabac, pas de rechute.</li>
<li>Forme chronique : femme asthmatique, consolidations périphériques, lavage ≥ 40 % ; prednisone 0,5 mg/kg puis décroissance ; rechutes fréquentes.</li>
<li>Anguillulose exclue ou traitée par ivermectine 200 µg/kg avant toute corticothérapie chez un patient exposé.</li>
</ul></template>
<template data-pop="pareto-j84-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j84-12,j84-13,j84-14"></p>
<ul>
<li>CVF et DLCO tous les 3 à 6 mois ; progression : CVF −5 % ou DLCO −10 % de la valeur prédite en un an.</li>
<li>Nintédanib contre-indiqué pendant la grossesse ; pirfénidone contre-indiquée si clairance &lt; 30 mL/min ; nintédanib 100 mg deux fois par jour en Child-Pugh A.</li>
<li>Fibrose et emphysème associés : CVF faussement préservée, DLCO effondrée.</li>
<li>Critères formels : fibrose pulmonaire idiopathique, fibrose progressive, exacerbation aiguë, pneumopathies à éosinophiles, protéinose.</li>
<li>Arrêt des antifibrosants au-delà de 5 fois la limite supérieure des transaminases.</li>
</ul></template>
<template data-pop="pareto-j84-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j84-e-1,j84-e-2,j84-e-3,j84-e-4,j84-e-5,j84-e-6"></p>
<ul>
<li>Socle : tomodensitométrie à haute résolution, EFR avec CPT et DLCO, test de marche, bilan auto-immun.</li>
<li>Lésions : rayon de miel et bronchectasies de traction = fibrose ; verre dépoli isolé = activité ; mosaïque avec piégeage = hypersensibilité ; « crazy paving » = protéinose.</li>
<li>Restriction prouvée par la CPT ; VEMS/CVF normal ou augmenté ; DLCO souvent première anomalie.</li>
<li>Désaturation sous 88 % à la marche : pronostic défavorable, oxygène d’effort.</li>
<li>Lavage : lymphocytes &gt; 25 % hypersensibilité ou forme inflammatoire ; éosinophiles &gt; 25 % pneumopathie à éosinophiles ; liquide laiteux protéinose.</li>
<li>Biopsie chirurgicale : mortalité d’environ 1,7 % programmée, 16 % en urgence.</li>
</ul></template>
<template data-pop="pareto-j84-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j84-p-1,j84-p-2,j84-p-3,j84-p-4"></p>
<ul>
<li>Nintédanib 150 mg deux fois par jour (100 mg si intolérance) : diarrhée, foie, saignement ; contre-indiqué pendant la grossesse.</li>
<li>Pirfénidone : titration en 14 jours jusqu’à 2 403 mg par jour ; photosensibilité, nausées, foie ; fluvoxamine contre-indiquée ; ciprofloxacine et tabac modifient l’exposition.</li>
<li>Nérandomilast et GM-CSF inhalé : non autorisés en Suisse au 8 octobre 2026.</li>
<li>Corticostéroïdes pour les formes inflammatoires et éosinophiles, jamais pour la fibrose pulmonaire idiopathique stable.</li>
<li>Arrêter les médicaments pneumotoxiques ; exclure l’anguillulose avant corticothérapie.</li>
</ul></template>
