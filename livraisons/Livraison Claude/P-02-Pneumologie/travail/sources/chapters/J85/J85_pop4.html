
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j85-clin" data-title="Pareto — Définitions, épidémiologie et mécanismes">
<p class="ratio" data-cover="j85-0,j85-1,j85-2,j85-3"></p>
<ul>
<li>Abcès : cavité de plus de 2 cm par nécrose liquéfiante ; pneumonie nécrosante : cavités multiples plus petites ; gangrène : nécrose ischémique avec séquestre ; pyothorax : pus ou germes dans la plèvre.</li>
<li>Abcès primaire (inhalation, environ 60 %) ou secondaire (obstruction, embolies, immunodépression) : un abcès secondaire impose de traiter sa cause.</li>
<li>Codage : J85.0 gangrène, J85.1 avec pneumonie, J85.2 sans pneumonie, J85.3 médiastin ; J86.0 avec fistule, J86.9 sans fistule ; empyème tuberculeux en A15-A16 ; médiastinite non collectée en J98.50.</li>
<li>Infection pleurale : mortalité 10 % à trois mois, 19 % à un an ; plus de 30 % de décès ou de chirurgie.</li>
<li>Chaîne : inhalation massive dans un segment déclive → pneumonie à anaérobies → nécrose en une à deux semaines → ouverture bronchique et niveau hydroaérique.</li>
<li>Plèvre infectée : pH et glucose bas, fibrine non dissoute (PAI-1), ADN visqueux, puis couenne.</li>
</ul></template>

<template data-pop="pareto-j85-sem" data-title="Pareto — Étiologies, anamnèse et examen">
<p class="ratio" data-cover="j85-4,j85-5,j85-6"></p>
<ul>
<li>Le terrain désigne le mécanisme : alcool, dents, dysphagie → anaérobies ; drogue intraveineuse, cathéter → <i>S. aureus</i> ; chirurgie, hôpital → SARM et bacilles à Gram négatif.</li>
<li>Fumeur de plus de 45 ans, édenté ou sans terrain d’inhalation : chercher une obstruction tumorale.</li>
<li>Plèvre : streptocoques en communautaire, <i>S. aureus</i> et entérocoques en nosocomial ; culture positive dans 58 % seulement.</li>
<li>Crachats fétides = anaérobies ; leur absence ne les exclut pas.</li>
<li>Deux phénotypes pleuraux : aigu chez le jeune, insidieux chez le sujet fragile ; une pneumonie qui ne guérit pas fait chercher une collection.</li>
<li>Gravité : qSOFA, choc ; albumine &lt; 27 g/L ajoute un point au score RAPID.</li>
</ul></template>

<template data-pop="pareto-j85-diag" data-title="Pareto — Démarche diagnostique et urgences">
<p class="ratio" data-cover="j85-7,j85-8"></p>
<ul>
<li>Radiographie, puis tomodensitométrie injectée : abcès rond à angle aigu ; empyème lenticulaire à angle obtus avec plèvre dédoublée.</li>
<li>Ponction échoguidée : pus = drain immédiat ; sinon pH, glucose, LDH, Gram et cultures ; liquide en flacons d’hémoculture.</li>
<li>Bronchoscopie si fumeur, édenté, absence de régression ou corps étranger.</li>
<li>Toute cavité : tuberculose possible jusqu’aux résultats ; cancer possible chez le fumeur.</li>
<li>Urgences : choc septique (antibiotique dans l’heure et contrôle de la source) ; hémoptysie et vomique (coucher sur le côté malade) ; fistule ; médiastinite et rupture de l’œsophage (chirurgie).</li>
</ul></template>

<template data-pop="pareto-j85-tt" data-title="Pareto — Traitements, fistules et médiastin">
<p class="ratio" data-cover="j85-9,j85-10,j85-11,j85-12"></p>
<ul>
<li>Abcès communautaire : co-amoxicilline intraveineuse puis orale ; métronidazole jamais seul ; durée de plusieurs semaines jusqu’à régression.</li>
<li>Drainage de l’abcès si échec après 7 à 14 jours, abcès de plus de 6 cm ; chirurgie si échec, hémorragie, fistule, cancer, gangrène.</li>
<li>Pyothorax : antibiotique couvrant les anaérobies ; drain ≤ 14 French si pus, pH ≤ 7,2 ou glucose &lt; 3,3 mmol/L ; rinçage 20 mL toutes les 6 heures.</li>
<li>Collection résiduelle : altéplase 10 mg et dornase alfa 5 mg deux fois par jour pendant 3 jours ; chaque agent seul est inefficace.</li>
<li>Échec (environ 20 %) : VATS, décortication ; patient inopérable : cathéter, antibiotique suppressif, fenêtre thoracique.</li>
<li>Fistules : fuite d’air → bronchopleurale ; empyème gauche après vomissements → œsophage ; masse pariétale → empyème de nécessité.</li>
<li>Médiastinite descendante : critères d’Estrera, tomodensitométrie du cou et du thorax, drainage chirurgical étendu sous la carène si nécessaire.</li>
</ul></template>

<template data-pop="pareto-j85-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j85-13,j85-14,j85-15"></p>
<ul>
<li>Absence de régression à huit semaines : bronchoscopie ou biopsie pour chercher un cancer.</li>
<li>Prévention : sevrage de l’alcool, soins dentaires, déglutition, vaccinations selon l’OFSP.</li>
<li>Enfant : urokinase 40 000 UI (10 000 UI avant un an) toutes les 12 heures, six doses ; VATS comparable.</li>
<li>Grossesse et allaitement : éviter métronidazole au premier trimestre, moxifloxacine ; clindamycine contre-indiquée pendant l’allaitement.</li>
<li>Infection pleurale : pus, ou pH &lt; 7,2 avec signes d’infection, ou germes démontrés (définition de MIST1).</li>
<li>Score RAPID : 0 à 2, 2,3 % de décès à trois mois ; 5 à 7, 29,3 %.</li>
</ul></template>

<template data-pop="pareto-j85-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j85-e-1,j85-e-2,j85-e-3,j85-e-4,j85-e-5"></p>
<ul>
<li>Référence de localisation : tomodensitométrie injectée ; référence du pyothorax : ponction pleurale.</li>
<li>Radiographie : niveau de même longueur sur face et profil = abcès ; longueurs différentes = collection pleurale.</li>
<li>Échographie : sensibilité 94,5 % pour l’épanchement ; ne prouve pas l’infection.</li>
<li>Liquide pleural : tube et flacons d’hémoculture (+20 % de rendement) ; pH sans héparine ni lidocaïne ; amylase élevée = œsophage.</li>
<li>Expectoration : ne cultive pas les anaérobies ; ne pas réduire le spectre sur elle seule.</li>
</ul></template>

<template data-pop="pareto-j85-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j85-sa,j85-sh,j85-sp,j85-sm"></p>
<ul>
<li>Bronche souche droite verticale ; couché sur le dos : segment postérieur du lobe supérieur et segment apical du lobe inférieur.</li>
<li>Espace rétropharyngé et espace « dangereux » : voie de descente du pus vers le médiastin.</li>
<li>Paroi d’abcès : nécrose, granulation, coque fibreuse ; les enzymes dissolvent la fibrine, pas le collagène.</li>
<li>pH bas par glycolyse des neutrophiles ; PAI-1 élevé → cloisons ; ADN → viscosité.</li>
<li>Anaérobies producteurs de bêtalactamases → inhibiteur de bêtalactamase ; métronidazole inactif sur les streptocoques.</li>
</ul></template>

<template data-pop="pareto-j85-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j85-p-1,j85-p-2,j85-p-3,j85-p-4,j85-p-5"></p>
<ul>
<li>Co-amoxicilline 2,2 g toutes les 8 heures par voie intraveineuse, puis 1 g deux à trois fois par jour par voie orale.</li>
<li>Nosocomial : pipéracilline-tazobactam 4,5 g toutes les 8 heures, plus vancomycine si SARM possible.</li>
<li>Allergie : clindamycine 1200 à 1800 mg par jour par voie intraveineuse ; moxifloxacine 400 mg hors indication suisse.</li>
<li>Enzymes intrapleuraux hors indication suisse ; risque hémorragique d’environ 4 %.</li>
<li>Dangers : métronidazole et alcool ou antivitamines K ; moxifloxacine et QT ; clindamycine et <i>C. difficile</i> ; pipéracilline-tazobactam et vancomycine et rein.</li>
</ul></template>
