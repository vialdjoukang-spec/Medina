<template data-pop="j85-d-coamox" data-title="Co-amoxicilline (amoxicilline et acide clavulanique)">
<div class="lab">Mécanisme</div><p>L’amoxicilline bloque la synthèse de la paroi bactérienne en se liant aux protéines liant la pénicilline. L’acide clavulanique inhibe les bêtalactamases produites par de nombreux anaérobies, par <i>S. aureus</i> sensible à la méticilline et par certains bacilles à Gram négatif ; il protège ainsi l’amoxicilline.</p>
<div class="lab">Spectre utile ici</div><p>Streptocoques, dont le groupe anginosus ; anaérobies de la bouche ; nombreux bacilles à Gram négatif communautaires. Pas d’activité sur le SARM ni sur <i>Pseudomonas</i>.</p>
<div class="lab">Posologie suisse (résumés compendium.ch, 08.10.2026)</div><p>Voie intraveineuse (Co-Amoxicillin Labatec 2,2 g) : infection grave, 2,2 g trois à quatre fois par jour, au maximum six fois, en perfusion d’au moins 30 minutes. Voie orale (comprimés de 1 g, soit 875 mg d’amoxicilline et 125 mg d’acide clavulanique) : 1 g deux à trois fois par jour au début des repas. L’indication « empyème » figure dans le résumé de la forme intraveineuse.</p>
<div class="lab">Contre-indications</div><p>Allergie aux bêtalactamines ; ictère ou atteinte hépatique lors d’un traitement antérieur ; mononucléose ; leucémie lymphatique. La grossesse et l’allaitement figurent dans la rubrique des contre-indications du résumé, avec renvoi à l’information complète.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Diarrhée, colite à <i>C. difficile</i>, éruption, hépatite cholestatique favorisée par les traitements prolongés : tests hépatiques pendant une cure de plusieurs semaines. Adapter la dose à la fonction rénale selon l’information professionnelle.</p></template>

<template data-pop="j85-d-piptaz" data-title="Pipéracilline-tazobactam">
<div class="lab">Mécanisme</div><p>Uréidopénicilline à large spectre associée au tazobactam, inhibiteur de bêtalactamases.</p>
<div class="lab">Spectre utile ici</div><p>Bacilles à Gram négatif nosocomiaux dont <i>Pseudomonas aeruginosa</i>, anaérobies, streptocoques. Pas d’activité sur le SARM ni sur les bactéries productrices de carbapénémases.</p>
<div class="lab">Posologie suisse (résumé compendium.ch, 08.10.2026)</div><p>Au-delà de 12 ans : 2 à 4 g de pipéracilline trois fois par jour, jusqu’à quatre fois, en perfusion de 30 minutes ; le flacon de 4,5 g contient 4 g de pipéracilline et 0,5 g de tazobactam.</p>
<div class="lab">Place</div><p>Infection nosocomiale, postopératoire, médiastinite, échec du traitement communautaire, sepsis grave. Son usage d’emblée dans un abcès communautaire n’apporte pas de bénéfice démontré et favorise les résistances.</p>
<div class="lab">Précautions</div><p>Grossesse selon l’information complète, allaitement contre-indiqué dans le résumé. Insuffisance rénale aiguë plus fréquente en association avec la vancomycine dans des études observationnelles.</p></template>

<template data-pop="j85-d-ceftri" data-title="Ceftriaxone">
<div class="lab">Mécanisme</div><p>Céphalosporine de troisième génération qui inhibe la synthèse de la paroi bactérienne.</p>
<div class="lab">Place</div><p>Elle couvre les streptocoques et de nombreux bacilles à Gram négatif, mais pas les anaérobies producteurs de bêtalactamases. Elle est donc toujours associée au métronidazole dans les suppurations d’origine buccale.</p>
<div class="lab">Posologie suisse (Rocephin, résumé compendium.ch, 08.10.2026)</div><p>Au-delà de 12 ans ou de 50 kg : 1 à 2 g une fois par jour, jusqu’à 4 g ; perfusion d’au moins 30 minutes.</p>
<div class="lab">Contre-indications</div><p>Allergie grave aux bêtalactamines ; chez le nouveau-né, hyperbilirubinémie et association à des solutions calciques intraveineuses.</p></template>

<template data-pop="j85-d-metro" data-title="Métronidazole">
<div class="lab">Mécanisme</div><p>Nitro-imidazolé réduit dans la bactérie anaérobie en dérivés qui cassent l’ADN. Cette activation n’a lieu qu’en milieu anaérobie, d’où son spectre limité aux anaérobies et à certains protozoaires.</p>
<div class="lab">Place</div><p>Toujours associé à un antibiotique actif sur les streptocoques (ceftriaxone, céfuroxime, pénicilline). Seul, il expose à l’échec.</p>
<div class="lab">Posologie suisse (résumés compendium.ch, 08.10.2026)</div><p>Perfusion (Metronidazole Sintetica) au-delà de 12 ans : 15 mg/kg, puis 7,5 mg/kg toutes les 6 heures pendant 3 jours, puis toutes les 12 heures, au maximum 4 g par jour. Comprimés (Flagyl 500 mg) dans les infections à anaérobies : 500 mg trois fois par jour pendant au moins 10 jours.</p>
<div class="lab">Contre-indications</div><p>Syndrome de Cockayne ; premier trimestre de la grossesse ; allaitement pendant le traitement et après (24 heures après la dernière prise orale, deux à trois jours après la perfusion selon les résumés).</p>
<div class="lab">Interactions et effets indésirables</div><p>Réaction de type antabuse avec l’alcool ; augmentation de l’INR sous antivitamines K ; goût métallique ; neuropathie périphérique lors des traitements prolongés.</p></template>

<template data-pop="j85-d-clinda" data-title="Clindamycine">
<div class="lab">Mécanisme</div><p>Lincosamide qui bloque la sous-unité 50S du ribosome bactérien et inhibe la synthèse protéique.</p>
<div class="lab">Spectre utile ici</div><p>Anaérobies, streptocoques, staphylocoques sensibles. Pas d’activité sur les bacilles à Gram négatif aérobies.</p>
<div class="lab">Preuves</div><p>Des essais anciens l’ont trouvée plus efficace que la pénicilline seule dans l’abcès ; la cohorte danoise de 2025 n’a pas montré de différence avec trois autres schémas.</p>
<div class="lab">Posologie suisse (Dalacin C, résumés compendium.ch, 08.10.2026)</div><p>Voie intraveineuse : infection grave, 1200 à 1800 mg par jour en 2 à 4 doses ; très grave, 2400 à 2700 mg par jour ; au maximum 1200 mg par perfusion d’une heure. Voie orale : 600 à 1200 mg par jour en 3 à 4 doses, jusqu’à 1800 mg dans les infections très graves ; rester debout 30 minutes après la capsule.</p>
<div class="lab">Contre-indications et effets</div><p>Allaitement ; nouveau-né pour la forme injectable. Colite à <i>Clostridioides difficile</i>, parfois grave : toute diarrhée impose une recherche de toxine.</p></template>

<template data-pop="j85-d-moxi" data-title="Moxifloxacine">
<div class="lab">Mécanisme</div><p>Fluoroquinolone qui inhibe l’ADN gyrase et la topo-isomérase IV ; elle a une activité sur les anaérobies supérieure à celle des autres quinolones.</p>
<div class="lab">Preuves</div><p>Essai randomisé d’Ott (Infection, 2008) : efficacité clinique identique à l’ampicilline-sulbactam dans la pneumonie d’inhalation et l’abcès primaire (66,7 % de réponse dans chaque bras), avec une prise unique quotidienne.</p>
<div class="lab">Statut suisse (Avalox, résumé compendium.ch, 08.10.2026)</div><p>400 mg une fois par jour. Indications de deuxième choix (sinusite, exacerbation de bronchite, pneumonie communautaire légère, infection pelvienne, infection cutanée compliquée) : l’abcès pulmonaire est hors indication.</p>
<div class="lab">Contre-indications du résumé</div><p>Insuffisance hépatique grave, tendinopathie après quinolone, intervalle QT allongé, association à d’autres médicaments allongeant le QT, troubles électrolytiques, bradycardie, insuffisance cardiaque à fraction d’éjection réduite, arythmies, immunosuppression, neutropénie, infection par le VIH, grossesse, allaitement, moins de 18 ans.</p>
<div class="lab">Effets indésirables</div><p>Tendinopathie et rupture tendineuse, troubles de la glycémie, effets neuropsychiques, anévrisme ou dissection aortique (alerte de l’Agence européenne des médicaments, 2018).</p></template>

<template data-pop="j85-d-vanco" data-title="Vancomycine et linézolide">
<div class="lab">Place</div><p>Couverture du <i>S. aureus</i> résistant à la méticilline lorsqu’il est probable : infection nosocomiale, colonisation connue, pneumonie nécrosante grave.</p>
<div class="lab">Vancomycine</div><p>Glycopeptide qui bloque l’assemblage de la paroi. Sa dose dépend du poids et de la fonction rénale ; elle est ajustée sur les dosages sanguins selon le protocole local. Le consensus américain de 2020 vise une aire sous la courbe de 400 à 600 mg·h/L. Toxicité rénale accrue en association avec la pipéracilline-tazobactam.</p>
<div class="lab">Linézolide</div><p>Oxazolidinone qui inhibe l’initiation de la synthèse protéique, bien diffusé dans le poumon. Au-delà de deux semaines, il expose à une myélosuppression et à une neuropathie ; il peut provoquer un syndrome sérotoninergique avec les inhibiteurs sélectifs de la recapture de la sérotonine (ISRS).</p>
<div class="lab">Remarque</div><p>Les doses de ces deux molécules n’ont pas été relues dans l’information professionnelle suisse pour ce cours ; elles suivent le protocole de l’établissement et l’avis infectiologique.</p></template>
