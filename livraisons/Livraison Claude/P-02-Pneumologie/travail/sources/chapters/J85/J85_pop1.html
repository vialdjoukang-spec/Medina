
<!-- ===== FENÊTRES : mécanismes, terrains, symptômes et signes ===== -->
<template data-pop="j85-inhal" data-title="Inhalation et flore oropharyngée">
<div class="lab">Définition</div><p>L’inhalation est le passage de liquide oropharyngé ou gastrique sous les cordes vocales. Elle devient pathologique lorsque le volume est important, que le liquide est très contaminé ou que les défenses sont diminuées.</p>
<div class="lab">Deux entités à ne pas confondre</div><p>La pneumopathie chimique suit l’inhalation de suc gastrique acide : elle apparaît en quelques heures et n’est pas d’abord infectieuse. La pneumonie d’inhalation suit l’inhalation de salive chargée de bactéries : elle évolue en quelques jours. Seule la seconde mène à l’abcès. Les deux relèvent de la catégorie J69 tant qu’il n’y a pas de cavité.</p>
<div class="lab">Mécanisme de l’abcès</div><p>Un inoculum dense en anaérobies, déposé dans un segment déclive et mal évacué par la toux, provoque une pneumonie qui se nécrose en une à deux semaines.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin cherche toujours l’épisode d’inhalation (ivresse, crise, anesthésie) et la cause durable (dents, déglutition), car la récidive dépend de leur correction.</p></template>

<template data-pop="j85-anaer" data-title="Bactéries anaérobies de la bouche">
<div class="lab">Définition</div><p>Bactéries qui se multiplient sans oxygène et qui sont souvent tuées par lui. Les genres principaux de la bouche sont <i>Prevotella</i>, <i>Porphyromonas</i>, <i>Fusobacterium</i>, <i>Bacteroides</i> et <i>Peptostreptococcus</i>.</p>
<div class="lab">Pourquoi elles causent des abcès</div><p>Elles agissent en synergie avec des bactéries facultatives qui consomment l’oxygène. Elles produisent des enzymes qui dégradent les tissus et favorisent la nécrose.</p>
<div class="lab">Indices cliniques</div><p>Odeur fétide des crachats ou du pus, terrain d’inhalation, mauvaise dentition, évolution subaiguë.</p>
<div class="lab">Piège</div><p>Elles poussent rarement dans les cultures standard. Une culture négative n’exclut pas leur rôle ; le traitement empirique les couvre.</p></template>

<template data-pop="j85-segments" data-title="Segments déclives">
<div class="lab">Définition</div><p>Segments pulmonaires situés le plus bas lorsque le patient inhale, et donc atteints par gravité.</p>
<div class="lab">Selon la position</div><p>Couché sur le dos : segment postérieur du lobe supérieur et segment apical du lobe inférieur. Debout ou assis : segments basaux des lobes inférieurs. Couché sur le côté : segments latéraux du côté déclive.</p>
<div class="lab">Côté</div><p>La bronche souche droite, plus verticale, reçoit plus souvent le liquide.</p>
<div class="lab">Conséquence pratique</div><p>Un abcès dans un segment antérieur ou dans le lobe moyen, sans terrain d’inhalation, fait chercher une autre cause : obstruction, embolie septique, cancer.</p></template>

<template data-pop="j85-vomique" data-title="Vomique">
<div class="lab">Définition</div><p>Expectoration brutale et abondante du contenu d’un abcès pulmonaire ou d’un empyème qui s’ouvre dans une bronche.</p>
<div class="lab">Signification</div><p>Elle prouve la communication entre la collection et l’arbre bronchique. Elle soulage souvent le patient, car la cavité se vide.</p>
<div class="lab">Danger</div><p>Une vomique massive peut remplir de pus les bronches du poumon sain. Le patient est couché sur le côté malade, aspiré et oxygéné ; une intubation peut être nécessaire.</p>
<div class="lab">Exemple</div><p>Une patiente expectore 300 mL de pus fétide en quelques minutes au sixième jour de traitement : la radiographie montre ensuite une cavité aérée là où se trouvait une opacité.</p></template>

<template data-pop="j85-necpn" data-title="Pneumonie nécrosante">
<div class="lab">Définition</div><p>Pneumonie dans laquelle la nécrose crée plusieurs petites cavités, plus petites que celles d’un abcès, au sein d’une condensation.</p>
<div class="lab">Germes</div><p><i>S. aureus</i> producteur de leucocidine de Panton et Valentine, <i>Klebsiella pneumoniae</i>, <i>Streptococcus pyogenes</i>, pneumocoque, <i>Pseudomonas aeruginosa</i> en milieu hospitalier.</p>
<div class="lab">Contexte typique</div><p>Sujet jeune, parfois après une grippe, avec une pneumonie rapidement grave, des hémoptysies et une leucopénie dans les formes staphylococciques.</p>
<div class="lab">Conséquence pratique</div><p>Le spectre antibiotique vise ces germes virulents, et non seulement les anaérobies. Une évolution vers la gangrène ou l’empyème est possible.</p></template>

<template data-pop="j85-gangrene" data-title="Gangrène pulmonaire">
<div class="lab">Définition</div><p>Nécrose étendue d’un lobe ou d’un poumon, due à une thrombose des vaisseaux pulmonaires et bronchiques au cours d’une infection grave. Un fragment de poumon mort, le séquestre, se détache.</p>
<div class="lab">Mécanisme</div><p>Les toxines bactériennes et l’inflammation thrombosent les vaisseaux. Le tissu meurt par ischémie, ce qui le prive de tout apport d’antibiotique.</p>
<div class="lab">Germes décrits</div><p><i>Klebsiella pneumoniae</i>, pneumocoque, <i>S. aureus</i> ; champignons filamenteux chez l’immunodéprimé.</p>
<div class="lab">Imagerie</div><p>Masse de poumon nécrosé flottant dans une cavité, parfois entourée d’un croissant d’air.</p>
<div class="lab">Traitement</div><p>Antibiotique à large spectre et, le plus souvent, résection chirurgicale du tissu mort, car il ne peut pas guérir.</p></template>

<template data-pop="j85-emboles" data-title="Embolies septiques">
<div class="lab">Définition</div><p>Fragments de caillot infecté qui partent d’un foyer veineux ou d’une valve droite et se bloquent dans les artères pulmonaires.</p>
<div class="lab">Sources</div><p>Endocardite de la valve tricuspide chez l’usager de drogues par voie intraveineuse, cathéter veineux infecté, thrombophlébite jugulaire du syndrome de Lemierre, thrombophlébite pelvienne.</p>
<div class="lab">Imagerie</div><p>Nodules multiples, périphériques, d’âges différents, qui s’excavent ; un vaisseau aboutit souvent au nodule.</p>
<div class="lab">Conséquence pratique</div><p>Les hémocultures et l’échocardiographie sont indispensables. Le germe est le plus souvent <i>S. aureus</i>, ce qui impose une couverture antistaphylococcique.</p></template>

<template data-pop="j85-lemierre" data-title="Syndrome de Lemierre">
<div class="lab">Définition</div><p>Thrombophlébite septique de la veine jugulaire interne qui suit une angine ou une infection pharyngée, avec embolies septiques, surtout pulmonaires.</p>
<div class="lab">Germe</div><p><i>Fusobacterium necrophorum</i>, anaérobie de la flore pharyngée, le plus souvent.</p>
<div class="lab">Tableau</div><p>Adolescent ou adulte jeune, angine quelques jours plus tôt, puis fièvre élevée, douleur ou tuméfaction cervicale latérale, nodules pulmonaires excavés.</p>
<div class="lab">Diagnostic</div><p>Hémocultures en flacon anaérobie ; imagerie de la veine jugulaire par échographie ou tomodensitométrie.</p>
<div class="lab">Traitement</div><p>Antibiotique actif sur les anaérobies, prolongé ; l’anticoagulation est discutée au cas par cas.</p></template>

<template data-pop="j85-anginosus" data-title="Streptocoques du groupe anginosus">
<div class="lab">Définition</div><p>Groupe de <i>Streptococcus anginosus</i>, <i>S. intermedius</i> et <i>S. constellatus</i>, anciennement appelé groupe <i>milleri</i>. Ce sont des commensaux de la bouche et du tube digestif.</p>
<div class="lab">Particularité</div><p>Ils forment volontiers des abcès : poumon, plèvre, cerveau, foie.</p>
<div class="lab">Conséquence pratique</div><p>Un empyème à streptocoque du groupe anginosus est souvent cloisonné et nécessite un drainage efficace. Un trouble neurologique nouveau fait chercher un abcès cérébral.</p>
<div class="lab">Antibiotique</div><p>Ils restent habituellement sensibles aux aminopénicillines, mais l’antibiogramme est vérifié.</p></template>

<template data-pop="j85-a-alcool" data-title="Alcool et abcès pulmonaire">
<div class="lab">Pourquoi l’alcool est le premier terrain</div><p>L’ivresse abolit les réflexes de toux et de déglutition, ce qui permet l’inhalation. L’alcoolisme chronique s’accompagne souvent de gingivite et de caries, qui enrichissent la salive en anaérobies. Il altère aussi la fonction des neutrophiles et la clairance mucociliaire.</p>
<div class="lab">Question utile</div><p>« Avez-vous été retrouvé inconscient, ou avez-vous vomi en étant ivre, au cours des dernières semaines ? »</p>
<div class="lab">Conséquence pratique</div><p>Le sevrage est une partie du traitement. Le métronidazole provoque une réaction de type antabuse avec l’alcool, ce qui oriente vers un autre anti-anaérobie si l’abstinence n’est pas assurée.</p></template>

<template data-pop="j85-a-dents" data-title="Infections dentaires et parodontales">
<div class="lab">Mécanisme</div><p>La gingivite et la parodontite multiplient les anaérobies dans le sillon gingival. Une salive très contaminée rend chaque inhalation plus dangereuse.</p>
<div class="lab">Valeur</div><p>Une mauvaise dentition est un argument fort pour un abcès d’inhalation. Un patient édenté a beaucoup moins d’anaérobies buccaux.</p>
<div class="lab">Piège</div><p>Un abcès chez un édenté, sans terrain d’inhalation, fait chercher une obstruction bronchique par un cancer.</p>
<div class="lab">Conséquence pratique</div><p>Les soins dentaires préviennent la récidive. Une extraction récente avec douleur cervicale fait aussi chercher une médiastinite.</p></template>

<template data-pop="j85-a-dysph" data-title="Troubles de la déglutition">
<div class="lab">Causes</div><p>Accident vasculaire cérébral, maladie de Parkinson, démence, maladies neuromusculaires, cancers et chirurgie de la tête et du cou, maladies de l’œsophage.</p>
<div class="lab">Signes d’appel</div><p>Toux ou voix mouillée pendant les repas, repas prolongés, pneumonies répétées, perte de poids.</p>
<div class="lab">Évaluation</div><p>Bilan par un logopédiste ; vidéofluoroscopie ou endoscopie de la déglutition selon le cas.</p>
<div class="lab">Conséquence pratique</div><p>Les textures adaptées, la position assise pendant et après les repas et les soins de bouche réduisent les inhalations.</p></template>

<template data-pop="j85-a-iv" data-title="Usage de drogues par voie intraveineuse">
<div class="lab">Mécanisme</div><p>Les bactéries de la peau ou du matériel d’injection entrent dans le sang et peuvent infecter la valve tricuspide. Des fragments de végétation partent dans les artères pulmonaires.</p>
<div class="lab">Germe principal</div><p><i>Staphylococcus aureus</i>.</p>
<div class="lab">Conséquence pratique</div><p>Des nodules pulmonaires multiples excavés chez un usager de drogues imposent hémocultures et échocardiographie. Le traitement vise d’abord le staphylocoque.</p></template>

<template data-pop="j85-a-chir" data-title="Chirurgie thoracique, œsophagienne et gestes récents">
<div class="lab">Situations</div><p>Résection pulmonaire, surtout pneumonectomie ; chirurgie ou dilatation de l’œsophage ; endoscopie digestive haute ; pose de drain pleural ; ponction pleurale répétée.</p>
<div class="lab">Risque</div><p>Empyème postopératoire, fistule bronchopleurale, fistule ou fuite œsophagienne.</p>
<div class="lab">Conséquence pratique</div><p>L’infection est alors nosocomiale : le spectre antibiotique couvre le SARM et les bacilles à Gram négatif, et le chirurgien est appelé tôt.</p></template>

<template data-pop="j85-a-immuno" data-title="Immunodépression">
<div class="lab">Situations</div><p>Diabète mal équilibré, corticoïdes au long cours, chimiothérapie et neutropénie, greffe d’organe, infection par le VIH avec peu de lymphocytes CD4, hémopathies.</p>
<div class="lab">Germes à évoquer</div><p><i>Nocardia</i>, <i>Rhodococcus</i>, mycobactéries, <i>Aspergillus</i> et autres champignons, bacilles à Gram négatif résistants.</p>
<div class="lab">Conséquence pratique</div><p>Les prélèvements invasifs (lavage, ponction, biopsie) sont proposés plus tôt, car le traitement empirique habituel ne couvre pas ces germes.</p></template>

<template data-pop="j85-s-crachats" data-title="Crachats purulents fétides">
<div class="lab">Mécanisme de l’odeur</div><p>Les anaérobies fermentent les protéines et produisent des acides gras volatils à chaîne courte et des composés soufrés.</p>
<div class="lab">Valeur</div><p>L’odeur fétide est très évocatrice d’une infection à anaérobies, mais elle manque souvent. Son absence ne les exclut pas.</p>
<div class="lab">Technique</div><p>Le médecin demande au patient de cracher dans un récipient et observe la couleur, l’abondance et l’odeur. Un crachat qui sédimente en couches évoque une grande quantité de pus.</p>
<div class="lab">Conséquence pratique</div><p>Une odeur fétide impose une couverture anaérobie, même si la culture ne trouve pas d’anaérobie.</p></template>

<template data-pop="j85-s-pleur" data-title="Douleur thoracique pleurale">
<div class="lab">Caractère</div><p>Douleur latérale, en coup de poignard, augmentée par l’inspiration profonde et la toux.</p>
<div class="lab">Mécanisme</div><p>Seule la plèvre pariétale est innervée. Son inflammation frotte à chaque mouvement respiratoire. Une atteinte de la plèvre diaphragmatique centrale est projetée à l’épaule par le nerf phrénique.</p>
<div class="lab">Valeur</div><p>Chez un patient atteint de pneumonie, elle évoque une atteinte pleurale et doit faire rechercher un épanchement par l’échographie.</p>
<div class="lab">Piège</div><p>La douleur peut diminuer quand l’épanchement grandit et sépare les feuillets ; cette diminution ne signifie pas une guérison.</p></template>

<template data-pop="j85-s-hemopt" data-title="Hémoptysie et hémoptysie massive">
<div class="lab">Mécanisme</div><p>La nécrose érode une artère bronchique, à haute pression systémique, ou plus rarement une branche de l’artère pulmonaire dans la paroi de la cavité.</p>
<div class="lab">Gravité</div><p>Aucune définition volumétrique n’est universelle. Le danger tient à l’asphyxie : quelques centaines de millilitres de sang suffisent à remplir l’espace mort et à empêcher les échanges gazeux.</p>
<div class="lab">Conduite</div><p>Le patient est couché sur le côté qui saigne. Le médecin assure l’oxygène et les voies aériennes, appelle les soins intensifs, le pneumologue interventionnel et le radiologue. L’embolisation des artères bronchiques est le traitement de première ligne d’une hémorragie persistante ; la résection est le dernier recours.</p>
<div class="lab">Piège</div><p>Coucher le patient sur le côté sain fait couler le sang dans le poumon sain.</p></template>

<template data-pop="j85-x-dents" data-title="Examen de la bouche">
<div class="lab">Technique</div><p>Le médecin inspecte les dents, les gencives et le pharynx à la lampe, et note l’haleine.</p>
<div class="lab">Normal</div><p>Gencives roses et fermes, sans saignement, dents sans caries profondes.</p>
<div class="lab">Pathologique</div><p>Caries, gencives rouges qui saignent, abcès dentaire, haleine fétide, édentation.</p>
<div class="lab">Valeur</div><p>Une mauvaise dentition rend l’abcès d’inhalation probable ; un trismus et une tuméfaction du plancher buccal font craindre une infection profonde du cou.</p></template>

<template data-pop="j85-x-cavite" data-title="Souffle caverneux ou amphorique">
<div class="lab">Technique</div><p>Auscultation au stéthoscope en regard de la lésion, patient respirant bouche ouverte.</p>
<div class="lab">Description</div><p>Souffle creux, résonnant et de tonalité élevée, entendu aux deux temps respiratoires. Il traduit une grande cavité aérée reliée à une bronche perméable.</p>
<div class="lab">Valeur</div><p>Rare et peu sensible : la plupart des abcès ne le produisent pas. Sa présence oriente vers une cavité de grande taille.</p>
<div class="lab">Conséquence pratique</div><p>L’imagerie reste indispensable ; l’auscultation ne permet pas de distinguer un abcès d’un cancer excavé.</p></template>

<template data-pop="j85-x-paroi" data-title="Tuméfaction de la paroi thoracique">
<div class="lab">Description</div><p>Masse molle, parfois fluctuante, rouge ou indolore, qui augmente de volume à la toux ; elle peut s’ouvrir à la peau.</p>
<div class="lab">Signification</div><p>Elle évoque un empyème de nécessité : le pus pleural a traversé les muscles intercostaux.</p>
<div class="lab">Causes classiques</div><p>Tuberculose et actinomycose ; plus rarement anaérobies et staphylocoque.</p>
<div class="lab">Conséquence pratique</div><p>Une tomodensitométrie montre la continuité entre la plèvre et la paroi. La recherche de mycobactéries est systématique.</p></template>

<template data-pop="j85-x-cou" data-title="Signes cervicaux d’infection profonde">
<div class="lab">Signes</div><p>Tuméfaction cervicale douloureuse, trismus, dysphagie ou douleur à la déglutition, voix étouffée, crépitation sous-cutanée, rougeur qui s’étend vers le thorax.</p>
<div class="lab">Signification</div><p>Ils signalent une infection des espaces profonds du cou, qui peut descendre dans le médiastin. Une induration du plancher buccal avec langue refoulée évoque une angine de Ludwig.</p>
<div class="lab">Conduite</div><p>Le médecin protège les voies aériennes, prescrit une tomodensitométrie du cou et du thorax et appelle les chirurgiens sans attendre.</p></template>

<template data-pop="j85-x-hippo" data-title="Hippocratisme digital">
<div class="lab">Technique</div><p>Le médecin regarde le doigt de profil : l’angle entre l’ongle et le repli cutané dépasse normalement à peine 160 degrés. Dans l’hippocratisme, il dépasse 180 degrés et l’extrémité du doigt est bombée.</p>
<div class="lab">Signification</div><p>Il apparaît dans les suppurations chroniques (abcès ancien, empyème chronique, bronchectasies), le cancer bronchique, certaines cardiopathies et les maladies interstitielles.</p>
<div class="lab">Conséquence pratique</div><p>Un hippocratisme récent chez un patient porteur d’une cavité fait évoquer un cancer autant qu’une suppuration chronique.</p></template>
