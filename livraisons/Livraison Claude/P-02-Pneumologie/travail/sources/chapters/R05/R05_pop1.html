
<!-- ===== FENÊTRES : notions cliniques ===== -->
<template data-pop="r05-alarme" data-title="Signes d’alarme de la toux">
<div class="lab">Définition</div><p>Un signe d’alarme est un élément de l’anamnèse ou de l’examen qui rend probable une maladie grave et impose une exploration immédiate ou rapide, quelle que soit la durée de la toux. La recommandation allemande de pneumologie S2k de 2025 en donne deux listes, l’une pour la toux aiguë et subaiguë, l’autre pour la toux chronique.</p>
<div class="lab">Liste</div><p>Dyspnée de repos, tachypnée, cyanose ; stridor ; fréquence cardiaque supérieure à 120 par minute ; SpO₂ inférieure à 90 % ou baisse nouvelle ; douleur thoracique aiguë ; hémoptysie ; expectoration mousseuse ; dysphonie persistante ; fièvre supérieure à 38,5 °C ; sueurs nocturnes et amaigrissement ; dysphagie, fausses routes, dénutrition ; immunodépression sévère ; modification de la toux chez un fumeur de 55 à 80 ans ; signes d’atteinte systémique (œdèmes, prise de poids d’une insuffisance cardiaque).</p>
<div class="lab">Pourquoi ces signes</div><p>Chacun traduit une atteinte qui ne guérit pas seule : une hypoxémie traduit un trouble des échanges gazeux, un stridor un rétrécissement des voies aériennes supérieures, une hémoptysie une lésion de la muqueuse ou d’un vaisseau, une dysphonie une atteinte du larynx ou du nerf récurrent.</p>
<div class="lab">Conséquence pratique</div><p>Un seul signe suffit à interrompre l’attente prudente d’une toux aiguë et la séquence des essais thérapeutiques d’une toux chronique. L’exploration se fait souvent à l’hôpital lorsque la vie est menacée.</p>
<div class="lab">Source</div><p>DGP, S2k-Leitlinie Husten, version 4.1, janvier 2025, tableaux 2 et 3 (texte intégral lu le 08.10.2026).</p></template>

<template data-pop="r05-traits" data-title="Traits traitables de la toux chronique">
<div class="lab">Définition</div><p>Un trait traitable est une caractéristique mesurable ou reconnaissable cliniquement qui entretient la toux et répond à un traitement spécifique. L’ERS 2020 demande de contrôler ces traits avant d’envisager un neuromodulateur.</p>
<div class="lab">Les principaux</div><p>Inflammation éosinophilique (asthme, asthme à toux prédominante, bronchite à éosinophiles) ; reflux et dysmotilité œsophagienne ; rhinite et rhinosinusite chronique ; médicament (inhibiteur de l’enzyme de conversion) ; tabac ; obstruction fixe ; bronchite chronique avec hypersécrétion.</p>
<div class="lab">Valeur et limites</div><p>Aucun test ne prédit de façon fiable la réponse : l’ERS 2020 conclut que la FeNO et les éosinophiles sanguins n’ont pas été validés pour prédire la réponse aux corticostéroïdes ou aux antileucotriènes. L’essai thérapeutique de 2 à 4 semaines reste l’outil de confirmation.</p>
<div class="lab">Piège</div><p>Traiter plusieurs traits en même temps empêche de savoir lequel était responsable. Un traitement à la fois, évalué par un score, permet de conserver ce qui agit et d’arrêter ce qui n’agit pas.</p></template>

<template data-pop="r05-hyper" data-title="Syndrome d’hypersensibilité à la toux">
<div class="lab">Définition</div><p>Trouble clinique dans lequel la toux est déclenchée par des stimulus thermiques, chimiques ou mécaniques de faible intensité. L’ERS 2020 l’adopte comme diagnostic englobant de la toux chronique de l’adulte ; les différents phénotypes dépendent du type et du siège de l’inflammation.</p>
<div class="lab">Signes</div><p>Chatouillement ou irritation laryngée, besoin de tousser, toux déclenchée par la parole, le rire, le téléphone, les parfums, l’air froid, les repas, la position couchée. La recommandation allemande de 2025 parle d’<b>hypertussie</b> (toux excessive pour un stimulus tussigène) et d’<b>allotussie</b> (toux pour un stimulus non tussigène), par analogie avec l’hyperalgésie et l’allodynie.</p>
<div class="lab">Mécanisme</div><p>Sensibilisation périphérique des fibres vagales (canaux TRPV1, TRPA1, P2X3) et sensibilisation centrale du tronc cérébral. L’hypothèse d’un processus neuropathique est soutenue par l’efficacité des neuromodulateurs et par la toux de certaines neuropathies sensitives héréditaires.</p>
<div class="lab">Épidémiologie</div><p>Deux tiers des patients sont des femmes, avec un pic entre 50 et 70 ans. Les patientes rapportent souvent un rhume ancien comme point de départ.</p>
<div class="lab">Conséquence pratique</div><p>L’explication du mécanisme au patient fait partie du traitement. La prise en charge associe la correction des traits traitables, la thérapie de contrôle de la toux et, si nécessaire, un neuromodulateur.</p></template>

<template data-pop="r05-arnold" data-title="Réflexe d’Arnold (toux d’origine auriculaire)">
<div class="lab">Définition</div><p>Toux déclenchée par la stimulation du conduit auditif externe, innervé en partie par le rameau auriculaire du nerf vague, issu du ganglion jugulaire.</p>
<div class="lab">Mécanisme</div><p>Les afférences auriculaires rejoignent les mêmes relais du tronc cérébral que les afférences laryngées et bronchiques ; leur stimulation active la même commande motrice.</p>
<div class="lab">Conséquence pratique</div><p>Un bouchon de cérumen, un poil ou un corps étranger dans le conduit peuvent entretenir une toux chronique. L’otoscopie fait partie de l’examen d’une toux inexpliquée, surtout chez l’enfant.</p>
<div class="lab">Source</div><p>ERS 2020, section « Aetiology and mechanisms ».</p></template>

<template data-pop="r05-cva" data-title="Asthme à toux prédominante">
<div class="lab">Définition</div><p>Forme d’asthme dont la toux est le symptôme unique ou principal, avec une hyperréactivité bronchique. Le terme anglais est « cough variant asthma ».</p>
<div class="lab">Diagnostic</div><p>La spirométrie est souvent normale. Le test à la méthacholine montre une hyperréactivité. La réponse au corticostéroïde inhalé confirme le diagnostic. Les centres ne s’accordent pas sur la place du test de provocation, selon l’ERS 2020.</p>
<div class="lab">Traitement</div><p>Celui de l’asthme : corticostéroïde inhalé, éventuellement associé au formotérol selon la stratégie de la Global Initiative for Asthma ; l’ERS 2020 déconseille un bronchodilatateur seul en entretien. Un antileucotriène peut être efficace. Le traitement est détaillé dans J45 — Asthme (P-02-Pneumologie).</p>
<div class="lab">Piège</div><p>Une spirométrie normale ne doit pas faire écarter cette forme ; il faut rechercher l’hyperréactivité ou tester la réponse au traitement.</p></template>

<template data-pop="r05-naeb" data-title="Bronchite à éosinophiles non asthmatique">
<div class="lab">Définition</div><p>Inflammation éosinophilique des voies aériennes (éosinophiles de l’expectoration supérieurs à 3 %) sans obstruction variable ni hyperréactivité bronchique.</p>
<div class="lab">Fréquence</div><p>Jusqu’à 13 % des patients vus en consultation spécialisée pour toux chronique, selon l’ERS 2020.</p>
<div class="lab">Mécanisme</div><p>Les mastocytes infiltrent surtout l’épithélium et non le muscle lisse : les médiateurs sensibilisent les terminaisons nerveuses sans contracter le muscle, d’où une toux sans obstruction.</p>
<div class="lab">Diagnostic</div><p>Expectoration induite en centre spécialisé ; à défaut, FeNO et éosinophiles sanguins comme marqueurs indirects, puis essai de corticostéroïde.</p>
<div class="lab">Traitement</div><p>Corticostéroïde inhalé ; l’ERS 2020 mentionne qu’une semaine de prednisolone orale peut réduire fortement la toux chez l’adulte lorsque l’inhalé échoue. L’éviction d’une exposition professionnelle est nécessaire lorsqu’elle est en cause.</p></template>

<template data-pop="r05-harq" data-title="Questionnaire HARQ">
<div class="lab">Définition</div><p>Hull Airway Reflux Questionnaire : questionnaire validé qui recense les symptômes de reflux des voies aériennes et d’hypersensibilité laryngée (voix, gorge, toux au repas, au lever, au parfum).</p>
<div class="lab">Usage</div><p>L’ERS 2020 le cite, avec le Reflux Symptom Index, pour documenter un reflux non acide qu’aucune technique ne détecte de façon fiable. Des versions dans plusieurs langues sont proposées par l’International Society for the Study of Cough.</p>
<div class="lab">Limite</div><p>Un score élevé décrit des symptômes ; il ne prouve ni un reflux ni la réponse à un inhibiteur de la pompe à protons.</p></template>

<template data-pop="r05-lcq" data-title="Questionnaire de Leicester sur la toux (LCQ)">
<div class="lab">Définition</div><p>Questionnaire de qualité de vie spécifique de la toux, qui explore les domaines physique, psychologique et social.</p>
<div class="lab">Interprétation</div><p>Un score plus élevé signifie une meilleure qualité de vie. L’ERS 2020 retient une différence minimale importante de 1,3 point, c’est-à-dire le plus petit changement que le patient perçoit comme utile.</p>
<div class="lab">Usage</div><p>Il sert de critère dans les essais (morphine, gabapentine, orthophonie) et peut être utilisé en consultation spécialisée. En pratique courante, le score sur 10 suffit pour juger un essai.</p></template>

<template data-pop="r05-trig" data-title="Déclencheurs de l’hypersensibilité à la toux">
<div class="lab">Liste</div><p>La recommandation allemande de 2025 cite les changements de température, la parole prolongée et le téléphone, le rire, les parfums, les repas, la position couchée, la poussière, la fumée et les vapeurs.</p>
<div class="lab">Signification</div><p>Ces stimulus sont faibles et ne font pas tousser un sujet sain. Une toux déclenchée par eux traduit un réflexe sensibilisé, quelle qu’en soit la cause initiale.</p>
<div class="lab">Conséquence pratique</div><p>Leur présence oriente vers une thérapie de contrôle de la toux et ne dispense pas de rechercher les traits traitables. Chez Madame L., le parfum, la parole et l’air froid sont des déclencheurs typiques.</p></template>

<template data-pop="r05-ilo" data-title="Obstruction laryngée inductible">
<div class="lab">Définition</div><p>Fermeture inappropriée du larynx, surtout des cordes vocales, pendant l’inspiration, déclenchée par un irritant, l’effort ou une émotion. L’ancien terme est « dysfonction des cordes vocales ».</p>
<div class="lab">Signes</div><p>Gorge serrée, stridor ou bruit inspiratoire, dyspnée brutale qui cède vite, toux, dysphonie. Les épisodes sont souvent pris pour un asthme résistant.</p>
<div class="lab">Diagnostic</div><p>Laryngoscopie pendant un épisode ou pendant une provocation (effort, irritant). L’ERS 2020 indique que son identification aide à planifier une thérapie de contrôle de la toux.</p>
<div class="lab">Traitement</div><p>Orthophonie et techniques respiratoires ; traitement d’un reflux associé. Les bronchodilatateurs sont inefficaces sur ce mécanisme laryngé.</p></template>

<template data-pop="r05-iec" data-title="Toux aux inhibiteurs de l’enzyme de conversion">
<div class="lab">Fréquence</div><p>Environ 15 % des patients traités selon l’ERS 2020 ; environ 10 % des femmes et 5 % des hommes selon la recommandation allemande de 2025. Il s’agit d’un effet de classe : changer d’inhibiteur ne résout rien.</p>
<div class="lab">Mécanisme</div><p>L’enzyme de conversion dégrade la bradykinine et la substance P. Son inhibition les accumule ; elles sensibilisent les fibres C par le récepteur B2 et les prostaglandines. Le réflexe devient plus sensible chez la plupart des sujets, et d’autres facteurs décident de l’apparition de la toux.</p>
<div class="lab">Chronologie</div><p>La toux peut apparaître des jours à des mois après le début du traitement. Comme le réflexe est « recalé », il n’existe pas toujours de lien temporel étroit avec la prise ou l’arrêt.</p>
<div class="lab">Conduite</div><p>Remplacement par une autre classe chez tout patient qui tousse (DGP 2025). Les antagonistes du récepteur de l’angiotensine II n’affectent pas le réflexe (ERS 2020). Si la toux persiste plus de 3 semaines après le changement, le bilan continue (DGP 2025). L’ERS 2020 ajoute qu’aucun patient qui tousse ne devrait recevoir d’inhibiteur de l’enzyme de conversion.</p>
<div class="lab">Piège</div><p>Attribuer à l’inhibiteur une toux qui a une autre cause, ou l’inverse. La persistance après l’arrêt impose de poursuivre le bilan sans réintroduire le médicament.</p></template>

<template data-pop="r05-coq" data-title="Coqueluche chez l’adolescent et l’adulte">
<div class="lab">Agent et transmission</div><p><i>Bordetella pertussis</i>, plus rarement <i>Bordetella parapertussis</i>, transmis par les gouttelettes. Incubation de 1 à 3 semaines selon l’OFSP.</p>
<div class="lab">Clinique</div><p>Phase catarrhale de type grippal avec toux banale ; phase paroxystique de 1 à 6 semaines avec quintes, reprise inspiratoire bruyante, expectoration épaisse et vomissements ; convalescence de plusieurs semaines à plusieurs mois. Chez l’adulte vacciné, la toux par quintes sans fièvre importante est souvent le seul signe.</p>
<div class="lab">Gravité</div><p>Le nourrisson risque une pneumonie, des convulsions et une atteinte cérébrale ; la plupart des décès surviennent à cet âge. Chez l’adulte atteint d’asthme ou de BPCO, la recommandation allemande de 2025 rapporte des complications chez environ un patient sur dix.</p>
<div class="lab">Traitement</div><p>Macrolide, efficace sur les symptômes pendant la phase catarrhale seulement, mais qui réduit la contagiosité. Les modalités de traitement et de prophylaxie des contacts n’ont pas été vérifiées dans une directive suisse pour ce cours ; voir la fiche de l’azithromycine.</p>
<div class="lab">Prévention en Suisse (OFSP)</div><p>Schéma à 2, 4 et 12 mois, puis 4 à 7 ans et 11 à 15 ans ; un rappel unique à 25 ans ; une dose à chaque grossesse, de préférence au deuxième trimestre, quel que soit l’intervalle depuis la dernière vaccination ou infection ; une dose pour les adolescents et adultes en contact régulier avec des nourrissons de moins de 6 mois s’ils n’ont pas été vaccinés dans les 10 dernières années.</p>
<div class="lab">Source</div><p><a href="https://www.bag.admin.ch/fr/coqueluche-pertussis" target="_blank" rel="noopener">OFSP, page Coqueluche</a>, consultée le 08.10.2026 ; DGP 2025.</p></template>

<template data-pop="r05-incont" data-title="Incontinence urinaire liée à la toux">
<div class="lab">Mécanisme</div><p>La phase compressive de la toux élève fortement la pression abdominale. Lorsque cette pression dépasse la résistance du sphincter urétral et du plancher pelvien, une fuite urinaire survient.</p>
<div class="lab">Fréquence et impact</div><p>Selon l’ERS 2020, c’est l’une des complications qui altèrent le plus la qualité de vie ; elle est sévère chez un quart des patientes, mais rarement évoquée spontanément.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin pose la question à chaque patiente qui tousse. La rééducation du plancher pelvien soulage en attendant le contrôle de la toux.</p></template>

<template data-pop="r05-syncope" data-title="Syncope de toux">
<div class="lab">Définition</div><p>Perte de connaissance brève qui survient pendant ou juste après une quinte de toux.</p>
<div class="lab">Mécanisme</div><p>La pression intrathoracique élevée réduit le retour veineux et le débit cardiaque ; une réponse vagale et, selon la recommandation allemande de 2025, un bloc auriculo-ventriculaire de haut degré déclenché par la toux peuvent y contribuer.</p>
<div class="lab">Conséquence pratique</div><p>Le médecin recherche une cause cardiaque (électrocardiogramme, surveillance du rythme selon le contexte), traite la toux et aborde l’aptitude à la conduite automobile.</p></template>

<template data-pop="r05-hippo" data-title="Hippocratisme digital chez un patient qui tousse">
<div class="lab">Définition</div><p>Bombement de la dernière phalange avec perte de l’angle normal entre l’ongle et le repli unguéal.</p>
<div class="lab">Valeur</div><p>Il n’est jamais dû à l’asthme, au reflux ni à l’hypersensibilité à la toux. Chez un patient qui tousse, il oriente vers un cancer bronchique, une fibrose pulmonaire, des bronchiectasies, une mucoviscidose ou une cardiopathie cyanogène.</p>
<div class="lab">Conséquence pratique</div><p>Sa découverte impose une imagerie thoracique et rend inutile toute attente prudente.</p></template>

<template data-pop="r05-ortho" data-title="Thérapie de contrôle de la toux (orthophonie et physiothérapie)">
<div class="lab">Contenu</div><p>Selon la recommandation allemande de 2025 : bilan orthophonique (symptômes, fonction laryngée, voix, déglutition) ; psychoéducation qui explique que la toux n’est pas imaginaire et fixe des objectifs réalistes ; techniques de suppression adaptées et comportement de toux avec moins de pression sous-glottique ; conseils d’hygiène vocale et de réduction des irritants laryngés (alcool, reflux, déshydratation) ; techniques respiratoires ; éléments de thérapie vocale.</p>
<div class="lab">Preuves</div><p>ERS 2020, recommandation conditionnelle avec preuves de qualité modérée : baisse du score subjectif de 2,8 points dans un essai, amélioration du LCQ de 1,53 point et réduction de la fréquence objective dans un autre ; effet maintenu jusqu’à 3 mois.</p>
<div class="lab">Limites</div><p>Il s’agit d’une intervention complexe dont les composantes efficaces restent à préciser ; elle demande des thérapeutes formés, peu nombreux. Aucun essai n’existe chez l’enfant.</p></template>

<template data-pop="r05-pbb" data-title="Bronchite bactérienne prolongée de l’enfant">
<div class="lab">Définition (ERS)</div><p>Trois critères réunis : toux humide ou productive continue depuis plus de 4 semaines ; absence de signe orientant vers une autre cause de toux humide ; disparition de la toux après 2 à 4 semaines d’un antibiotique oral approprié.</p>
<div class="lab">Mécanisme</div><p>Infection bactérienne de la muqueuse bronchique avec défaut de clairance du mucus. Elle peut précéder des bronchiectasies si elle récidive.</p>
<div class="lab">Preuve</div><p>Dans l’essai de référence cité par l’ERS 2020, l’amoxicilline-acide clavulanique pendant 2 semaines a fait disparaître la toux chez 48 % des enfants contre 16 % sous placebo.</p>
<div class="lab">Piège</div><p>Une récidive fréquente ou une absence de réponse impose de rechercher des bronchiectasies, une mucoviscidose, une dyskinésie ciliaire ou un déficit immunitaire.</p></template>
