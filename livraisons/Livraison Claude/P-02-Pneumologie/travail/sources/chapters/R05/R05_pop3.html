<template data-pop="r05-d-gefa" data-title="Géfapixant (Lyfnua)">
<div class="lab">Statut en Suisse</div><p>Autorisé par Swissmedic le 24.05.2022 (numéro d’autorisation 68065, titulaire Merck Sharp &amp; Dohme), sur ordonnance, comprimés pelliculés de 45 mg. Indication : toux chronique réfractaire ou toux chronique inexpliquée de l’adulte, c’est-à-dire une toux de plus de 8 semaines qui persiste malgré le traitement des causes ou dont la cause reste inconnue. Le traitement doit être instauré et supervisé par un médecin expérimenté dans la prise en charge de la toux chronique. Sa commercialisation effective et son remboursement (liste des spécialités) n’ont pas pu être vérifiés pour ce cours : compendium.ch et ch.oddb.org n’étaient pas accessibles.</p>
<div class="lab">Mécanisme</div><p>Antagoniste du récepteur P2X3 de l’ATP, porté par les fibres C vagales des voies aériennes. L’ATP libéré par l’épithélium inflammé active ce récepteur et déclenche le besoin de tousser ; le géfapixant bloque ce signal. Il bloque aussi les récepteurs P2X2/3 des fibres gustatives, d’où l’altération du goût.</p>
<div class="lab">Posologie</div><p>45 mg deux fois par jour, avec ou sans repas. Insuffisance rénale sévère (débit de filtration glomérulaire estimé inférieur à 30 mL/min/1,73 m²) sans dialyse : 45 mg une fois par jour. Données insuffisantes en dialyse et en insuffisance hépatique. Pas d’indication avant 18 ans.</p>
<div class="lab">Efficacité</div><p>COUGH-1 (730 patients, 12 semaines) et COUGH-2 (1314 patients, 24 semaines) : réduction de la fréquence de la toux sur 24 heures de 18,5 % et de 14,6 % de plus que sous placebo avec 45 mg deux fois par jour ; la dose de 15 mg était inefficace. Patients inclus : 75 % de femmes, âge moyen 58 ans, toux depuis 11 ans en moyenne. Swissmedic juge les différences numériquement faibles et leur pertinence clinique difficile à apprécier, et considère le rapport bénéfice-risque positif lorsque les options conventionnelles ne sont pas indiquées.</p>
<div class="lab">Effets indésirables</div><p>Dysgueusie (41 %), agueusie (15 %), hypogueusie (11 %), sécheresse buccale. Arrêt pour effet indésirable chez 22 % des patients sous 45 mg contre 5,8 % sous placebo ; l’altération du goût a régressé dans 96 % des cas à la fin de l’étude. Infections des voies respiratoires inférieures numériquement plus fréquentes (4,2 % contre 3,3 %).</p>
<div class="lab">Contre-indications et précautions</div><p>Hypersensibilité sévère à un composant ; prudence en cas d’hypersensibilité connue aux sulfonamides, car la molécule porte un groupe sulfonamide.</p>
<div class="lab">Sources</div><p><a href="https://www.swissmedic.ch/swissmedic/fr/home/notre-profil/publications/public-summary-swiss-par/public-summary-swiss-par-lyfnua.html" target="_blank" rel="noopener">Swissmedic, Public Summary SwissPAR Lyfnua, 07.10.2022</a> ; SwissPAR du 12.08.2022 avec information professionnelle de mai 2022 (lus le 08.10.2026) ; McGarvey L. P. et al., Lancet 2022;399:909-923.</p></template>

<template data-pop="r05-d-mor" data-title="Morphine à faible dose dans la toux réfractaire">
<div class="lab">Recommandation</div><p>ERS 2020 : essai de morphine à libération prolongée, 5 à 10 mg deux fois par jour, chez l’adulte atteint de toux chronique réfractaire (recommandation forte, preuves de qualité modérée).</p>
<div class="lab">Preuve</div><p>Un essai randomisé contre placebo : baisse du score de sévérité de 1,96 point (échelle de 0 à 9) et amélioration du LCQ de 2 points. La réponse apparaît en une semaine. La recommandation allemande de 2025 estime la réponse à environ 20 % des patients et précise que l’augmentation de dose n’améliore pas l’effet dans cette indication.</p>
<div class="lab">Mécanisme</div><p>Action sur les récepteurs opioïdes du tronc cérébral, qui élève le seuil du réflexe central.</p>
<div class="lab">Effets indésirables</div><p>Constipation et somnolence dans l’essai. Risque de dépendance et de dépression respiratoire, accru par l’association aux benzodiazépines, à l’alcool et aux gabapentinoïdes.</p>
<div class="lab">Conditions de prescription</div><p>Prescription hors indication autorisée dans la toux ; ordonnance de stupéfiants selon la réglementation suisse. Laxatif d’emblée ; arrêt si aucune réponse après une semaine.</p></template>

<template data-pop="r05-d-gaba" data-title="Gabapentine et prégabaline dans la toux réfractaire">
<div class="lab">Recommandation</div><p>ERS 2020 : essai de gabapentine ou de prégabaline chez l’adulte atteint de toux chronique réfractaire (recommandation conditionnelle, preuves de faible qualité).</p>
<div class="lab">Preuves</div><p>Gabapentine jusqu’à 1800 mg par jour : amélioration du LCQ de 1,8 point et baisse de la fréquence de la toux sur une heure d’observation. Prégabaline 300 mg par jour associée à l’orthophonie : amélioration du LCQ de 3,5 points et de la sévérité, sans baisse de la fréquence mesurée. La recommandation allemande de 2025 estime la réponse à environ 20 % et indique une dose usuelle de gabapentine jusqu’à 900 mg par jour.</p>
<div class="lab">Mécanisme</div><p>Liaison à la sous-unité α2δ des canaux calciques voltage-dépendants, qui réduit la libération de neurotransmetteurs excitateurs ; effet présumé sur la sensibilisation centrale, comme dans la douleur neuropathique.</p>
<div class="lab">Effets indésirables</div><p>Vertiges, fatigue, troubles cognitifs, nausées, vision floue ; risque d’arrêt pour effet indésirable 2,3 fois supérieur au placebo. Accumulation en insuffisance rénale. Potentiel d’usage détourné.</p>
<div class="lab">Conduite</div><p>Prescription hors indication autorisée ; titration progressive ; adaptation à la fonction rénale ; évitement de l’association aux opioïdes chez le patient fragile.</p></template>

<template data-pop="r05-d-cod" data-title="Codéine et dihydrocodéine antitussives">
<div class="lab">Mécanisme</div><p>Promédicaments transformés en partie en morphine par le CYP2D6 hépatique ; la morphine produite porte l’effet antitussif et les effets opioïdes.</p>
<div class="lab">Contre-indications en Suisse</div><p>Selon Swissmedic (juillet 2017), les préparations contre la toux et le rhume contenant de la codéine ou de la dihydrocodéine ne doivent pas être administrées aux enfants de moins de 12 ans, aux métaboliseurs ultrarapides connus du CYP2D6 et aux femmes qui allaitent. Elles sont déconseillées entre 12 et 18 ans en cas de trouble respiratoire.</p>
<div class="lab">Signes de surdosage</div><p>Respiration lente ou superficielle, confusion, somnolence, myosis, nausées, vomissements, constipation, perte d’appétit ; arrêt et avis médical immédiat.</p>
<div class="lab">Place</div><p>Toux aiguë très gênante de l’adulte, pour une durée brève. La recommandation allemande de 2025 ne recommande pas la dihydrocodéine, parce que sa transformation imprévisible en morphine rend la dose difficile à déterminer.</p>
<div class="lab">Posologie</div><p>Selon l’information professionnelle suisse du produit utilisé ; non vérifiée sur compendium.ch pour ce cours.</p>
<div class="lab">Source</div><p>Swissmedic, communication « Cough and cold preparations containing codeine or dihydrocodeine : update of the product information », juillet 2017 (lue le 08.10.2026).</p></template>

<template data-pop="r05-d-dxm" data-title="Dextrométhorphane">
<div class="lab">Mécanisme</div><p>Dérivé de la morphine sans effet analgésique opioïde notable aux doses antitussives ; il agit sur le centre de la toux, notamment comme antagoniste des récepteurs NMDA et agoniste des récepteurs sigma.</p>
<div class="lab">Place</div><p>Toux aiguë sèche de l’adulte, pour une durée brève. La recommandation allemande de 2025 lui reconnaît des preuves d’efficacité sur la durée et l’intensité des symptômes ; la revue Cochrane de 2014 conclut à l’absence de preuve solide pour ou contre les antitussifs sans ordonnance.</p>
<div class="lab">Contre-indications et interactions</div><p>Association aux inhibiteurs de la monoamine oxydase et aux autres sérotoninergiques (risque de syndrome sérotoninergique) ; insuffisance respiratoire ; maladies avec encombrement ; allaitement ; jeune enfant selon la forme. Substrat du CYP2D6 : les métaboliseurs lents et les inhibiteurs du CYP2D6 augmentent l’exposition.</p>
<div class="lab">Usage détourné</div><p>À partir d’environ 120 mg, effets psychotropes de type dissociatif recherchés par certains adolescents ; le surdosage peut provoquer dépression respiratoire, tachycardie, ataxie et convulsions.</p>
<div class="lab">Posologie</div><p>Selon l’information professionnelle suisse du produit utilisé ; non vérifiée sur compendium.ch pour ce cours.</p>
<div class="lab">Source</div><p>PharmaWiki, fiche Dextrométhorphane, modifiée le 28.01.2026 (source secondaire suisse) ; DGP 2025 ; Cochrane 2014.</p></template>

<template data-pop="r05-d-azi" data-title="Azithromycine dans la coqueluche et la bronchite chronique">
<div class="lab">Coqueluche</div><p>Les macrolides sont le traitement de choix selon la recommandation allemande de 2025 ; ils n’améliorent les symptômes que pendant la phase catarrhale mais réduisent la contagiosité. Le schéma de l’adulte publié par les Centers for Disease Control and Prevention (CDC, 2005) est de 500 mg le premier jour, puis 250 mg par jour du deuxième au cinquième jour ; le même schéma sert à la prophylaxie des contacts proches. Ce schéma américain n’a pas été confronté à une directive suisse pour ce cours.</p>
<div class="lab">Bronchite chronique avec BPCO</div><p>Dans un essai cité par l’ERS 2020, l’azithromycine 250 mg trois fois par semaine pendant 12 semaines a amélioré le LCQ de 1,3 point. L’ERS 2020 suggère un essai d’un mois de macrolide dans la toux de bronchite chronique réfractaire, en respectant le bon usage des antibiotiques. Deux essais dans la toux inexpliquée ont été négatifs.</p>
<div class="lab">Précautions</div><p>Allongement de l’intervalle QT ; interactions plus marquées avec la clarithromycine ; sélection de résistances bactériennes ; recherche de mycobactéries non tuberculeuses avant un traitement prolongé.</p></template>

<template data-pop="r05-ctx-duree" data-title="Contentieux : seuils de durée de la toux">
<div class="lab">Positions</div><p><b>DGP 2025</b> (texte intégral lu) : aiguë jusqu’à 3 semaines, subaiguë 3 à 8 semaines, chronique au-delà de 8 semaines, chez l’adulte. <b>CHEST 2018</b> (résumé lu) : mêmes seuils chez l’adulte. <b>ERS 2020</b> (texte intégral lu) : chronique au-delà de 8 semaines chez l’adulte et au-delà de 4 semaines chez l’enfant ; chez l’enfant, une toux de 3 à 8 semaines est parfois appelée « toux aiguë prolongée ». Les anciennes études retenaient 3 mois, d’après la définition de la bronchite chronique.</p>
<div class="lab">Source retenue</div><p>Chez l’adulte, la recommandation allemande de 2025, la plus récente, qui confirme les seuils de CHEST 2018. Chez l’enfant, l’ERS 2020, seule des trois à traiter l’enfant.</p>
<div class="lab">Limites</div><p>Toutes ces sources reconnaissent que les seuils sont arbitraires et que certains patients ont une toux intermittente. L’ERS 2020 demande un jugement clinique global plutôt qu’une simple durée.</p>
<div class="lab">Textes</div><p><a href="https://register.awmf.org/de/leitlinien/detail/020-003" target="_blank" rel="noopener">DGP, S2k-Leitlinie Husten (AWMF 020-003)</a> ; <a href="https://doi.org/10.1183/13993003.01136-2019" target="_blank" rel="noopener">ERS 2020</a> ; <a href="https://doi.org/10.1016/j.chest.2017.10.016" target="_blank" rel="noopener">CHEST 2018</a>.</p></template>

<template data-pop="r05-ctx-otc" data-title="Contentieux : antitussifs dans la toux aiguë">
<div class="lab">Positions</div><p><b>Cochrane 2014</b> (29 essais, 4835 participants) : aucune preuve solide pour ou contre les médicaments sans ordonnance dans la toux aiguë ; chez l’enfant, antitussifs et antihistaminiques ne font pas mieux que le placebo, et ces médicaments peuvent être dangereux. <b>DGP 2025</b> : le dextrométhorphane et plusieurs phytomédicaments ont des preuves d’efficacité sur la durée et l’intensité des symptômes ; ils peuvent être prescrits si le patient le souhaite, pour une durée d’environ 4 semaines au plus. <b>Cochrane 2018</b> : chez l’enfant de 12 mois à 18 ans, le miel soulage probablement mieux que l’absence de traitement ou le placebo pendant 3 jours.</p>
<div class="lab">Source retenue</div><p>Chez l’adulte, la recommandation allemande de 2025, la plus récente : un antitussif bref est acceptable, sans attendre de lui plus qu’un soulagement modeste. Chez l’enfant, la revue Cochrane de 2018 et les contre-indications de Swissmedic (pas de codéine avant 12 ans) : miel après 12 mois, pas d’antitussif central de routine.</p>
<div class="lab">Limites</div><p>Les essais sont petits, hétérogènes et souvent anciens. La recommandation allemande s’adresse aux pneumologues ; son application en premier recours suisse reste un choix raisonné, pas une obligation.</p>
<div class="lab">Textes</div><p><a href="https://doi.org/10.1002/14651858.CD001831.pub5" target="_blank" rel="noopener">Revue Cochrane 2014 sur les antitussifs sans ordonnance</a> ; <a href="https://doi.org/10.1002/14651858.CD007094.pub5" target="_blank" rel="noopener">Revue Cochrane 2018 sur le miel</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/020-003" target="_blank" rel="noopener">DGP 2025</a>.</p></template>

<template data-pop="r05-ctx-ipp" data-title="Contentieux : inhibiteur de la pompe à protons dans la toux chronique">
<div class="lab">Positions</div><p>Les anciennes démarches proposaient un essai empirique d’inhibiteur de la pompe à protons chez tout patient atteint de toux chronique. <b>ERS 2020</b> : ne pas prescrire systématiquement d’antiacide (recommandation conditionnelle, preuves de faible qualité) ; aucun bénéfice sans reflux acide, bénéfice modeste avec reflux acide. <b>DGP 2025</b> : inhibiteur de la pompe à protons seulement en présence de symptômes de reflux typiques (pyrosis, régurgitations acides), à forte dose (ésoméprazole 40 mg deux fois par jour avant les repas) et jusqu’à 12 semaines ; effet d’environ 15 à 20 % au-delà du placebo dans ce cas ; pas d’essai empirique sans symptôme.</p>
<div class="lab">Source retenue</div><p>La recommandation allemande de 2025, la plus récente, concordante avec l’ERS 2020.</p>
<div class="lab">Pourquoi</div><p>Le reflux qui fait tousser est souvent non acide, liquide ou gazeux ; un antisécrétoire ne le supprime pas. Les inhibiteurs de la pompe à protons prolongés exposent en outre à des risques rapportés en observation (carences, hypomagnésémie, infection à <i>Clostridioides difficile</i>, fractures).</p>
<div class="lab">Textes</div><p><a href="https://doi.org/10.1183/13993003.01136-2019" target="_blank" rel="noopener">ERS 2020, question 4</a> ; <a href="https://register.awmf.org/de/leitlinien/detail/020-003" target="_blank" rel="noopener">DGP 2025, question 8</a>.</p></template>

<template data-pop="r05-ctx-gefa" data-title="Contentieux : place du géfapixant">
<div class="lab">Positions</div><p><b>Swissmedic</b> (24.05.2022) : autorisation chez l’adulte atteint de toux chronique réfractaire ou inexpliquée ; bénéfice jugé numériquement faible, rapport bénéfice-risque positif lorsque les options conventionnelles ne sont pas indiquées. <b>Union européenne</b> : autorisation en septembre 2023. <b>FDA</b> : refus en décembre 2023, pour preuve d’efficacité insuffisante, sans motif de sécurité. <b>DGP 2025</b> : option pour la toux réfractaire ou inexpliquée à 45 mg deux fois par jour, mais non commercialisée en Allemagne au moment de la publication. <b>ERS 2020</b> : antérieure aux autorisations ; présente les antagonistes P2X3 comme le développement le plus prometteur.</p>
<div class="lab">Source retenue en Suisse</div><p>L’autorisation de Swissmedic et son information professionnelle, applicables en Suisse. La place pratique est celle d’un traitement de deuxième intention, instauré par un médecin expérimenté, après le bilan de base, le traitement des traits traitables et, idéalement, une thérapie de contrôle de la toux.</p>
<div class="lab">Limites</div><p>Effet moyen modeste, dysgueusie fréquente, données au-delà de 52 semaines limitées. La disponibilité et le remboursement en Suisse doivent être vérifiés avant la prescription. Le camlipixant, plus sélectif, a été abandonné dans la toux en juillet 2026 après des résultats discordants de phase III (communiqué du fabricant).</p>
<div class="lab">Textes</div><p><a href="https://www.swissmedic.ch/swissmedic/fr/home/notre-profil/publications/public-summary-swiss-par/public-summary-swiss-par-lyfnua.html" target="_blank" rel="noopener">Swissmedic, Public Summary SwissPAR Lyfnua</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)02348-5" target="_blank" rel="noopener">COUGH-1 et COUGH-2, Lancet 2022</a>.</p></template>
