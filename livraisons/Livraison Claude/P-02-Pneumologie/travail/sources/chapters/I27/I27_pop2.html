
<!-- ===== FENÊTRES : symptômes, signes, examens ===== -->
<template data-pop="i27-dyspnee" data-title="Dyspnée de l’hypertension pulmonaire">
<div class="lab">Mécanisme</div><p>Le débit cardiaque n’augmente pas assez à l’effort. Les muscles reçoivent moins d’oxygène, produisent plus tôt de l’acide lactique, et la ventilation s’emballe. Les zones pulmonaires ventilées mais mal perfusées augmentent l’espace mort : le patient doit ventiler davantage pour éliminer le même CO₂, d’où une pente VE/VCO₂ élevée et une PaCO₂ basse.</p>
<div class="lab">Caractères</div><p>Dyspnée d’effort lentement progressive, sans sibilants, sans orthopnée marquée, souvent avec fatigue. L’examen et la radiographie peuvent rester normaux longtemps.</p>
<div class="lab">Piège</div><p>Elle est souvent attribuée à un déconditionnement, à un asthme ou à une anxiété. Une dyspnée qui progresse malgré un traitement d’épreuve justifie une échocardiographie.</p></template>

<template data-pop="i27-angor" data-title="Angor de l’hypertension pulmonaire">
<div class="lab">Mécanisme ischémique droit</div><p>Le ventricule droit hypertrophié consomme plus d’oxygène. Sa pression intramurale élevée supprime la perfusion coronaire systolique, et la pression artérielle systémique basse réduit la perfusion diastolique. Une ischémie survient sans lésion coronaire.</p>
<div class="lab">Mécanisme compressif</div><p>Une artère pulmonaire très dilatée peut comprimer le tronc commun de la coronaire gauche entre elle et l’aorte. Un scanner coronaire ou une coronarographie le recherchent devant un angor typique.</p>
<div class="lab">Conséquence pratique</div><p>L’angor d’effort d’un patient atteint d’hypertension pulmonaire n’est pas banal : il reflète un ventricule droit en souffrance ou une compression traitable par stent.</p></template>

<template data-pop="i27-ortner" data-title="Syndrome d’Ortner (syndrome cardiovocal)">
<div class="lab">Définition</div><p>Dysphonie par paralysie du nerf laryngé récurrent gauche, comprimé par une structure cardiovasculaire dilatée. Norbert Ortner l’a décrit en 1897 dans le rétrécissement mitral.</p>
<div class="lab">Mécanisme</div><p>Le nerf récurrent gauche contourne la crosse de l’aorte sous le ligament artériel, entre l’aorte et l’artère pulmonaire gauche. Une artère pulmonaire très dilatée l’écrase dans cette fenêtre.</p>
<div class="lab">Conséquence pratique</div><p>Une dysphonie chez un patient atteint d’hypertension pulmonaire justifie une laryngoscopie et une imagerie, car un cancer bronchique ou une adénopathie médiastinale peuvent donner le même tableau.</p></template>

<template data-pop="i27-hemopt" data-title="Hémoptysie de l’hypertension pulmonaire">
<div class="lab">Origine</div><p>Le plus souvent, des artères bronchiques hypertrophiées, de régime systémique, saignent. Elles se développent pour suppléer un territoire mal perfusé, surtout dans l’HTP thromboembolique chronique et les cardiopathies congénitales cyanogènes. Plus rarement, l’origine est un infarctus pulmonaire, une rupture d’anévrisme ou une dissection de l’artère pulmonaire.</p>
<div class="lab">Gravité</div><p>Une hémoptysie abondante menace par asphyxie plus que par perte sanguine.</p>
<div class="lab">Conduite</div><p>Le patient est hospitalisé, l’anticoagulation est réévaluée, et un angioscanner localise la source. L’embolisation des artères bronchiques est le traitement de référence de l’hémoptysie abondante.</p></template>

<template data-pop="i27-b2" data-title="Éclat du deuxième bruit pulmonaire">
<div class="lab">Mécanisme</div><p>Le deuxième bruit correspond à la fermeture des valves aortique (A2) puis pulmonaire (P2). Une pression artérielle pulmonaire élevée ferme la valve pulmonaire plus tôt et plus fort : P2 devient intense et se rapproche de A2.</p>
<div class="lab">Technique</div><p>Auscultation au deuxième espace intercostal gauche, patient en décubitus. Un P2 audible à l’apex ou palpable au foyer pulmonaire est anormal.</p>
<div class="lab">Valeur et limite</div><p>Le signe est assez spécifique mais peu sensible, et dépend de l’examinateur. Son absence n’exclut rien.</p></template>

<template data-pop="i27-harzer" data-title="Soulèvement ventriculaire droit (signe de Harzer)">
<div class="lab">Technique</div><p>Le médecin place la paume sur le bord gauche du sternum, ou le pouce sous l’appendice xiphoïde en direction de l’épaule gauche, en fin d’expiration. Il recherche un soulèvement systolique soutenu.</p>
<div class="lab">Mécanisme</div><p>Le ventricule droit hypertrophié et dilaté vient au contact de la paroi antérieure et la soulève à chaque systole.</p>
<div class="lab">Piège</div><p>Chez le patient emphysémateux, le cœur est vertical et les battements épigastriques sont fréquents sans hypertrophie ; l’échocardiographie tranche.</p></template>

<template data-pop="i27-it" data-title="Souffle d’insuffisance tricuspide et signe de Carvallo">
<div class="lab">Description</div><p>Souffle holosystolique au bord gauche du sternum, en bas, de timbre doux.</p>
<div class="lab">Signe de Carvallo</div><p>Le souffle augmente en inspiration profonde. L’inspiration abaisse la pression intrathoracique et augmente le retour veineux vers le cœur droit ; le volume régurgité augmente. Ce signe distingue le souffle tricuspide d’un souffle mitral.</p>
<div class="lab">Signes associés</div><p>Onde v jugulaire ample, foie pulsatile en systole dans les formes importantes.</p>
<div class="lab">Valeur</div><p>L’insuffisance tricuspide fonctionnelle traduit la dilatation de l’anneau ; elle fournit aussi le signal Doppler qui estime la pression pulmonaire.</p></template>

<template data-pop="i27-jug" data-title="Turgescence jugulaire et reflux hépatojugulaire">
<div class="lab">Technique</div><p>Patient à 45°, tête tournée vers la gauche, le médecin observe la veine jugulaire interne droite. La hauteur de la colonne au-dessus de l’angle sternal, plus 5 cm, estime la pression de l’oreillette droite. Une pression ferme et soutenue sur l’hypochondre droit pendant 10 secondes fait monter durablement la colonne si le ventricule droit ne peut accepter le volume mobilisé : c’est le reflux hépatojugulaire.</p>
<div class="lab">Valeur</div><p>Une turgescence franche traduit une pression auriculaire droite élevée, critère de risque dans l’hypertension pulmonaire.</p>
<div class="lab">Piège</div><p>La veine jugulaire externe peut être distendue par une compression locale ; la jugulaire interne, transmise par ses pulsations, est la référence.</p></template>

<template data-pop="i27-hippo" data-title="Hippocratisme digital">
<div class="lab">Définition</div><p>Augmentation de volume des parties molles de la dernière phalange, avec perte de l’angle normal entre l’ongle et le repli unguéal. Le signe de Schamroth recherche la disparition de la fenêtre losangique entre deux ongles accolés.</p>
<div class="lab">Valeur dans l’hypertension pulmonaire</div><p>Il n’appartient pas à l’HTAP idiopathique. Il oriente vers une cardiopathie congénitale cyanogène avec syndrome d’Eisenmenger, une pneumopathie interstitielle, une maladie veino-occlusive, une hépatopathie avec syndrome hépatopulmonaire ou une fistule artérioveineuse pulmonaire.</p>
<div class="lab">Conséquence pratique</div><p>Sa présence chez un patient étiqueté « HTAP idiopathique » remet en cause le diagnostic.</p></template>

<template data-pop="i27-ecg" data-title="Électrocardiogramme de l’hypertension pulmonaire">
<div class="lab">Signes de surcharge droite</div><p>Déviation axiale droite ; onde R dominante en V1, rapport R/S &gt; 1 en V1, aspect qR en V1 ; ondes T négatives de V1 à V3 ; onde P ample en DII, dite P pulmonaire ; bloc de branche droit ; allongement de l’intervalle QTc.</p>
<div class="lab">Valeur</div><p>L’ECG est souvent anormal dans les formes avancées, mais un ECG normal n’exclut pas une hypertension pulmonaire débutante. Il détecte aussi un flutter ou une fibrillation atriale, mal tolérés.</p>
<div class="lab">Piège</div><p>Les signes de surcharge droite d’une embolie aiguë sont transitoires ; ceux de l’hypertension chronique sont stables et associés à une hypertrophie.</p></template>

<template data-pop="i27-echo" data-title="Échocardiographie et probabilité d’hypertension pulmonaire">
<div class="lab">Principe</div><p>La vitesse maximale de régurgitation tricuspide donne le gradient de pression entre ventricule et oreillette droits par l’équation de Bernoulli simplifiée (4 × vitesse²). Les signes indirects décrivent le retentissement sur les ventricules, l’artère pulmonaire, la veine cave et l’oreillette droite.</p>
<div class="lab">Seuils ESC/ERS 2022</div><p>Vitesse ≤ 2,8 m/s sans signe indirect : probabilité faible. Vitesse ≤ 2,8 m/s avec signes, ou 2,9 à 3,4 m/s sans signe : intermédiaire. Vitesse 2,9 à 3,4 m/s avec signes, ou &gt; 3,4 m/s : élevée. Les signes doivent appartenir à au moins deux catégories.</p>
<div class="lab">Pronostic</div><p>La surface de l’oreillette droite, le rapport TAPSE/PAPs et l’épanchement péricardique entrent dans le modèle de risque à trois niveaux.</p>
<div class="lab">Limites</div><p>Une régurgitation absente ou mal alignée sous-estime la pression ; une fenêtre acoustique médiocre réduit la fiabilité. L’échocardiographie ne mesure ni la PAPO ni les RVP de façon fiable.</p></template>

<template data-pop="i27-kt" data-title="Cathétérisme cardiaque droit">
<div class="lab">Technique</div><p>Un cathéter à ballonnet de type Swan-Ganz est introduit par une veine jugulaire interne, brachiale ou fémorale, puis poussé dans l’oreillette droite, le ventricule droit, l’artère pulmonaire et jusqu’à la position d’occlusion. Le zéro est placé au niveau mi-thoracique. Les mesures se lisent en fin d’expiration normale.</p>
<div class="lab">Mesures</div><p>Pressions de l’oreillette droite, du ventricule droit, de l’artère pulmonaire et PAPO ; débit cardiaque par thermodilution ou méthode de Fick ; saturation veineuse mêlée ; saturations étagées si un shunt est suspecté.</p>
<div class="lab">Risques</div><p>Dans les centres expérimentés, les complications graves sont rares : hématome, arythmie transitoire, pneumothorax si abord jugulaire, exceptionnellement rupture d’artère pulmonaire.</p>
<div class="lab">Indication</div><p>Il confirme le diagnostic, établit le profil, mesure le risque et guide le traitement. Il se fait en centre pour garantir sa qualité.</p></template>

<template data-pop="i27-vaso" data-title="Test de vasoréactivité pulmonaire">
<div class="lab">Indication</div><p>Seulement dans l’HTAP idiopathique, héréditaire ou induite par des médicaments, pour repérer les rares patients qui répondront à long terme aux inhibiteurs calciques (ESC/ERS 2022).</p>
<div class="lab">Agents (ESC/ERS 2022)</div><p>Monoxyde d’azote inhalé 10 à 20 ppm pendant 5 à 10 minutes ; iloprost inhalé 5 à 10 µg pendant 10 à 15 minutes ; époprosténol intraveineux 2 à 12 ng/kg/min par paliers de 2 ng/kg/min de 10 minutes. L’adénosine intraveineuse n’est plus recommandée.</p>
<div class="lab">Critères de réponse</div><p>Baisse de la PAPm d’au moins 10 mmHg jusqu’à une valeur ≤ 40 mmHg, avec un débit cardiaque stable ou augmenté.</p>
<div class="lab">Fréquence</div><p>Moins de 10 % des patients testés sont répondeurs.</p>
<div class="lab">Piège</div><p>Un test positif ne suffit pas : le patient doit être réévalué après 3 à 6 mois d’inhibiteur calcique. Une partie perd la réponse et passe au traitement spécifique.</p></template>

<template data-pop="i27-vq" data-title="Scintigraphie de ventilation et de perfusion">
<div class="lab">Principe</div><p>La perfusion est imagée par des microagrégats d’albumine marqués au technétium 99m, qui se bloquent dans les capillaires perfusés. La ventilation est imagée par un aérosol ou un gaz radioactif.</p>
<div class="lab">Interprétation</div><p>Dans l’HTP thromboembolique chronique, des défauts de perfusion segmentaires ou plus grands concernent des segments normalement ventilés : ils sont non concordants. Dans l’HTAP, la perfusion est normale ou finement hétérogène. Dans le groupe 3, les défauts sont concordants.</p>
<div class="lab">Valeur</div><p>Une perfusion normale exclut une HTP thromboembolique chronique avec une valeur prédictive négative de 98 % en l’absence de maladie parenchymateuse (ESC/ERS 2022). C’est l’examen de dépistage recommandé dans toute hypertension pulmonaire inexpliquée.</p>
<div class="lab">Piège</div><p>Une scintigraphie anormale n’affirme pas l’origine thromboembolique : sarcome, vascularite, médiastinite fibrosante et maladie veino-occlusive peuvent aussi donner des défauts. L’imagerie artérielle confirme.</p></template>

<template data-pop="i27-tm6" data-title="Test de marche de six minutes">
<div class="lab">Technique</div><p>Le patient marche le plus loin possible pendant six minutes dans un couloir plat de 30 m, avec des encouragements standardisés. On mesure la distance, la saturation, la fréquence cardiaque et la dyspnée au début et à la fin.</p>
<div class="lab">Seuils pronostiques (ESC/ERS 2022)</div><p>&gt; 440 m : faible risque ; 320 à 440 m : intermédiaire bas ; 165 à 319 m : intermédiaire haut ; &lt; 165 m : risque élevé.</p>
<div class="lab">Limites</div><p>La distance dépend de l’âge, de la taille, du poids, des comorbidités orthopédiques et de la motivation. Un effet d’apprentissage existe lors des premiers tests.</p>
<div class="lab">Conséquence pratique</div><p>On compare surtout le patient à lui-même et on combine la distance avec la classe fonctionnelle et le NT-proBNP.</p></template>

<template data-pop="i27-centre" data-title="Centre d’hypertension pulmonaire">
<div class="lab">Rôle</div><p>Le centre réunit spécialistes de l’hypertension pulmonaire, cardiologues, pneumologues, radiologues, chirurgiens, infirmiers spécialisés et accès à la transplantation. Il réalise le cathétérisme, classe le patient, décide du traitement spécifique et le surveille.</p>
<div class="lab">Pourquoi y adresser</div><p>Le diagnostic exige des examens dont la qualité dépend du volume d’activité. Les médicaments spécifiques sont coûteux, interagissent et exigent une surveillance. Le registre suisse a été construit par cinq hôpitaux universitaires et huit hôpitaux associés, ce qui illustre l’organisation en réseau.</p>
<div class="lab">Quand adresser</div><p>Probabilité échocardiographique intermédiaire ou élevée non expliquée par une cardiopathie gauche ou une maladie pulmonaire ; suspicion d’HTP thromboembolique chronique ; signe d’alarme ; population à risque avec dépistage positif.</p></template>
