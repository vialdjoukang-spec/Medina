
<!-- ===== FENÊTRES : monographies et Pareto ===== -->
<template data-pop="i27-d-icc" data-title="Inhibiteurs calciques à forte dose">
<div class="lab">Mécanisme</div><p>Ils bloquent les canaux calciques de type L des cellules musculaires lisses et relâchent les artérioles pulmonaires dont la contraction reste réversible.</p>
<div class="lab">Indication</div><p>Uniquement l’HTAP idiopathique, héréditaire ou médicamenteuse avec test de vasoréactivité positif, soit moins de 10 % de ces patients.</p>
<div class="lab">Posologie (ESC/ERS 2022)</div><p>Nifédipine 10 mg 3 fois par jour, jusqu’à 20 à 60 mg 2 ou 3 fois par jour ; diltiazem 60 mg 2 fois par jour, jusqu’à 120 à 360 mg 2 fois par jour ; amlodipine 5 mg, jusqu’à 15 à 30 mg 1 fois par jour. Le diltiazem est préféré si la fréquence cardiaque est élevée, la nifédipine ou l’amlodipine si elle est basse. Les informations professionnelles suisses de ces molécules ne mentionnent pas l’hypertension pulmonaire : leur emploi dans cette indication suit la recommandation européenne.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, œdèmes des membres inférieurs, bradycardie sous diltiazem.</p>
<div class="lab">Surveillance</div><p>Réévaluation clinique et hémodynamique après 3 à 6 mois ; réponse satisfaisante si classe I ou II avec, idéalement, PAPm &lt; 30 mmHg et RVP &lt; 4 unités Wood. Sinon, passage au traitement spécifique.</p>
<div class="lab">Piège</div><p>Chez un non-répondeur, l’effet inotrope négatif et l’hypotension peuvent précipiter une défaillance droite.</p></template>

<template data-pop="i27-d-era" data-title="Antagonistes des récepteurs de l’endothéline">
<div class="lab">Mécanisme</div><p>Ils bloquent l’action de l’endothéline 1 sur les récepteurs ETA, et pour le bosentan et le macitentan aussi ETB. Ils réduisent la vasoconstriction et la prolifération.</p>
<div class="lab">Molécules suisses</div><p>Bosentan (Tracleer) : 62,5 mg 2 fois par jour pendant 4 semaines, puis 125 mg 2 fois par jour ; classes II à IV. Ambrisentan (Volibris) : 5 mg puis 10 mg 1 fois par jour ; classes II à III. Macitentan (Opsumit) : 10 mg 1 fois par jour ; classes II à III, réduction de la morbidité et de la mortalité.</p>
<div class="lab">Essais</div><p>SERAPHIN (2013) : le macitentan 10 mg a réduit de 45 % un critère composite de morbidité et de mortalité chez 742 patients. AMBITION (2015) : l’association ambrisentan-tadalafil d’emblée a réduit de moitié le risque d’échec clinique par rapport aux monothérapies chez 500 patients.</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité, surtout sous bosentan ; baisse de l’hémoglobine ; œdèmes périphériques et congestion nasale, surtout sous ambrisentan ; tératogénicité de classe.</p>
<div class="lab">Contre-indications</div><p>Grossesse et absence de contraception fiable ; aminotransférases &gt; 3 fois la limite supérieure avant traitement ; bosentan en classe B ou C de Child-Pugh et avec la ciclosporine ou le glibenclamide ; ambrisentan dans la fibrose pulmonaire idiopathique.</p>
<div class="lab">Surveillance</div><p>Aminotransférases chaque mois sous bosentan et deux semaines après une augmentation ; hémoglobine avant et pendant le traitement ; test de grossesse mensuel conseillé sous bosentan.</p></template>

<template data-pop="i27-d-pde5" data-title="Inhibiteurs de la phosphodiestérase de type 5">
<div class="lab">Mécanisme</div><p>Ils bloquent la dégradation du GMPc dans les cellules musculaires lisses pulmonaires et prolongent l’effet relaxant du monoxyde d’azote.</p>
<div class="lab">Molécules suisses</div><p>Sildénafil (Revatio) : 20 mg 3 fois par jour, ou 10 mg 3 fois par jour en bolus intraveineux. Tadalafil (Adcirca) : 40 mg 1 fois par jour ; 20 mg en insuffisance rénale ou hépatique légère à modérée. Association fixe macitentan-tadalafil 10/40 mg (Yuvanci) chez le patient stable sous les deux molécules.</p>
<div class="lab">Essais</div><p>SUPER-1 (2005) pour le sildénafil et PHIRST (2009) pour le tadalafil ont amélioré la distance de marche ; AMBITION (2015) a validé l’association initiale avec l’ambrisentan.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, bouffées vasomotrices, dyspepsie, épistaxis, myalgies, troubles visuels ; rarement neuropathie optique ischémique antérieure non artéritique.</p>
<div class="lab">Contre-indications</div><p>Dérivés nitrés et molsidomine sous toutes leurs formes, « poppers », riociguat ; antécédent de neuropathie optique ischémique (tadalafil) ; inhibiteurs puissants du CYP3A4 (sildénafil).</p>
<div class="lab">Piège</div><p>Un patient qui reçoit un dérivé nitré pour un angor aux urgences doit signaler son traitement : l’association provoque une hypotension sévère.</p></template>

<template data-pop="i27-d-rio" data-title="Riociguat">
<div class="lab">Mécanisme</div><p>Stimulant de la guanylate cyclase soluble. Il augmente sa sensibilité au monoxyde d’azote et la stimule même en son absence ; le GMPc augmente et relâche les cellules musculaires lisses.</p>
<div class="lab">Indications suisses (Adempas, juillet 2025)</div><p>HTP thromboembolique chronique inopérable, ou persistante ou récidivante après chirurgie ; HTAP de classe fonctionnelle II à III.</p>
<div class="lab">Essais</div><p>CHEST-1 (2013) : gain de 46 m au test de marche dans l’HTP thromboembolique chronique inopérable ou persistante. PATENT-1 (2013) : gain de 36 m dans l’HTAP.</p>
<div class="lab">Posologie</div><p>0,5 ou 1 mg 3 fois par jour pendant 2 semaines, puis augmentation de 0,5 mg toutes les 2 semaines jusqu’à 2,5 mg 3 fois par jour, si la pression systolique reste ≥ 95 mmHg sans symptôme d’hypotension.</p>
<div class="lab">Contre-indications</div><p>Grossesse et allaitement ; dérivés nitrés et donneurs de monoxyde d’azote ; inhibiteurs de la phosphodiestérase de type 5 et inhibiteurs non spécifiques comme la théophylline et le dipyridamol ; autres stimulants de la guanylate cyclase ; HTP associée aux pneumopathies interstitielles idiopathiques.</p>
<div class="lab">Effets indésirables</div><p>Hypotension, vertiges, céphalées, dyspepsie, œdèmes, hémoptysie.</p></template>

<template data-pop="i27-d-sel" data-title="Sélexipag">
<div class="lab">Mécanisme</div><p>Agoniste sélectif oral du récepteur de la prostacycline ; il n’est pas un prostanoïde. Son métabolite actif augmente l’AMPc des cellules musculaires lisses.</p>
<div class="lab">Indication suisse (Uptravi, février 2023)</div><p>HTAP en classe fonctionnelle III ou IV de la NYHA, pour retarder la progression de la maladie.</p>
<div class="lab">Essai</div><p>GRIPHON (2015) : chez 1 156 patients, le sélexipag a réduit d’environ 40 % le critère composite de morbidité et de mortalité, sans effet démontré sur la mortalité seule.</p>
<div class="lab">Posologie</div><p>200 µg 2 fois par jour, augmentés chaque semaine de 200 µg 2 fois par jour jusqu’à la dose maximale tolérée, au plus 1 600 µg 2 fois par jour. Une seule prise par jour avec un inhibiteur modéré du CYP2C8 comme le clopidogrel.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, diarrhée, nausées, douleurs de la mâchoire, myalgies, bouffées vasomotrices. Ils sont habituellement transitoires pendant la titration.</p>
<div class="lab">Contre-indication</div><p>Inhibiteurs puissants du CYP2C8 comme le gemfibrozil.</p></template>

<template data-pop="i27-d-pgi" data-title="Prostanoïdes parentéraux et inhalés">
<div class="lab">Mécanisme</div><p>Analogues de la prostacycline : vasodilatation par l’AMPc, effet antiagrégant et antiprolifératif.</p>
<div class="lab">Époprosténol (Veletri)</div><p>Perfusion intraveineuse continue par cathéter central, dose initiale de 2 ng/kg/min puis titration. Seul médicament ayant réduit la mortalité dans un essai randomisé de l’HTAP (Barst, 1996 : 8 décès sur 40 sous traitement conventionnel contre aucun sur 41 sous époprosténol en 12 semaines). Demi-vie de quelques minutes : une interruption peut provoquer un rebond mortel.</p>
<div class="lab">Tréprostinil (Remodulin)</div><p>Perfusion continue sous-cutanée de préférence, ou intraveineuse ; 1,25 ng/kg/min puis titration hebdomadaire. Douleur au point d’injection fréquente en sous-cutané. Indication suisse : classes III et IV de la NYHA.</p>
<div class="lab">Iloprost inhalé (Ventavis)</div><p>2,5 puis 5 µg par inhalation, habituellement 5 à 6 inhalations par jour par nébuliseur.</p>
<div class="lab">Tréprostinil inhalé</div><p>L’essai INCREASE (2021) a amélioré de 31 m la distance de marche dans l’HTP des pneumopathies interstitielles. Aucune forme inhalée de tréprostinil n’a été trouvée sur ch.oddb.org le 08.10.2026.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, douleurs de la mâchoire, diarrhée, bouffées vasomotrices, hypotension ; infections et thromboses de cathéter pour les formes intraveineuses.</p></template>

<template data-pop="i27-d-sota" data-title="Sotatercept">
<div class="lab">Mécanisme</div><p>Protéine de fusion qui associe le domaine extracellulaire du récepteur de l’activine de type 2A à un fragment d’immunoglobuline. Elle piège l’activine et certains facteurs de croissance et de différenciation, rééquilibre la signalisation au profit de la voie antiproliférative et cible le remodelage vasculaire.</p>
<div class="lab">Autorisation suisse</div><p>Winrevair, autorisé le 13.09.2024 pour les classes fonctionnelles II à III, étendu le 05.02.2026 à la classe IV, toujours en association avec un traitement standard de l’HTAP (Swissmedic).</p>
<div class="lab">Essais</div><p>STELLAR (2023) : chez 323 patients sous traitement de fond, gain de 40,8 m au test de marche à 24 semaines par rapport au placebo. ZENITH (2025) : chez 172 patients à haut risque, réduction de 76 % du critère décès, transplantation ou hospitalisation. Un essai publié en 2025 chez 320 patients diagnostiqués depuis moins d’un an : aggravation clinique 10,6 % contre 36,9 %, mortalité comparable.</p>
<div class="lab">Posologie (Winrevair, février 2026)</div><p>0,3 mg/kg par voie sous-cutanée, puis 0,7 mg/kg toutes les 3 semaines. Hémoglobine et plaquettes avant chaque dose pendant au moins les 5 premières doses, puis régulièrement. Pas d’initiation si plaquettes &lt; 50 000/mm³. Report de dose si l’hémoglobine augmente de plus de 2,0 g/dL et dépasse la limite supérieure de la normale.</p>
<div class="lab">Effets indésirables</div><p>Élévation de l’hémoglobine, thrombopénie, télangiectasies, épistaxis, vertiges, hypertension artérielle ; saignements graves chez 4 % contre 1 % sous placebo dans les études.</p>
<div class="lab">Précautions</div><p>Possible toxicité fœtale : test de grossesse avant traitement et contraception efficace pendant le traitement et au moins quatre mois après la dernière dose.</p></template>

<template data-pop="i27-d-diur" data-title="Traitements de soutien : diurétiques">
<div class="lab">Mécanisme</div><p>La défaillance droite active le système rénine-angiotensine-aldostérone et provoque une rétention hydrosodée. Les diurétiques de l’anse réduisent la congestion veineuse, la distension du ventricule droit et la compression du ventricule gauche.</p>
<div class="lab">Usage</div><p>Diurétiques de l’anse, thiazidiques et antagonistes des minéralocorticoïdes selon l’état clinique et la fonction rénale (ESC/ERS 2022). Le patient se pèse régulièrement et adapte la dose selon un plan écrit.</p>
<div class="lab">Surveillance</div><p>Poids, fonction rénale, sodium et potassium. Une déplétion excessive est à éviter : le ventricule droit dépend d’une précharge suffisante, et une hypovolémie fait chuter le débit.</p>
<div class="lab">Piège</div><p>Dans le cœur pulmonaire hypercapnique, l’alcalose métabolique induite par les diurétiques peut réduire la commande ventilatoire et aggraver l’hypercapnie.</p></template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-i27-clin" data-title="Pareto — Définitions, mécanismes et clinique"><p class="ratio" data-cover="i27-0,i27-1,i27-2,i27-3,i27-4,i27-5,i27-6"></p><ul>
<li>HTP : PAPm &gt; 20 mmHg au cathétérisme droit. Précapillaire : PAPO ≤ 15 mmHg et RVP &gt; 2 unités Wood ; postcapillaire : PAPO &gt; 15 mmHg.</li>
<li>RVP = (PAPm − PAPO)/débit. Cinq groupes : 1 HTAP, 2 cœur gauche (le plus fréquent), 3 poumon et hypoxie, 4 obstruction artérielle (curable), 5 multifactoriel.</li>
<li>HTP environ 1 % de la population ; HTAP environ 50 cas par million ; pronostic lié au ventricule droit.</li>
<li>Chaîne : postcharge droite ↑ → hypertrophie → dilatation, interdépendance, débit fixe → syncope d’effort, congestion, angor.</li>
<li>Rechercher : embolie passée, connectivite, hépatopathie, VIH, cardiopathie congénitale, anorexigènes ou amphétamines, famille.</li>
<li>Signes : éclat de B2, soulèvement droit, souffle tricuspide majoré à l’inspiration ; défaillance droite : jugulaires, foie, œdèmes ; hippocratisme = autre cause.</li>
<li>Classe fonctionnelle de l’OMS : I à IV ; une syncope d’effort classe d’emblée en IV, car elle prouve un débit fixe.</li>
<li>Codage CIM-10-GM : I27.00 idiopathique et héréditaire, I27.01 associée, I27.02 toxique, I27.08 veino-occlusive, I27.1 cyphoscoliose, I27.20 thromboembolique, I27.21 cœur gauche, I27.22 poumon, I27.9 cœur pulmonaire chronique ; I28.0 fistule, I28.1 anévrisme.</li>
<li>Groupe 1 : idiopathique, BMPR2 (pénétrance 42 % chez la femme, 14 % chez l’homme), aminorex et méthamphétamines, dasatinib, sclérodermie (5 à 19 %), hypertension portale (1 à 2 %), VIH, cardiopathie congénitale ; maladie veino-occlusive : œdème sous vasodilatateur.</li>
<li>Groupe 2 : sujet âgé, obèse, hypertendu, fibrillation atriale. Une hypertension disproportionnée à une maladie pulmonaire ou cardiaque légère impose de chercher une seconde cause.</li></ul></template>

<template data-pop="pareto-i27-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="i27-7,i27-8"></p><ul>
<li>Trois temps : soupçon, échocardiographie (probabilité), centre (scintigraphie de perfusion et cathétérisme droit).</li>
<li>Vitesse de régurgitation tricuspide &gt; 2,8 m/s suspecte, &gt; 3,4 m/s probabilité élevée ; signes indirects de deux catégories.</li>
<li>Scintigraphie normale : HTP thromboembolique chronique exclue (valeur prédictive négative 98 %) ; l’angioscanner ne suffit pas.</li>
<li>Signes d’alarme : syncope, progression rapide, défaillance droite, bas débit → adressage immédiat.</li>
<li>Défaillance droite aiguë : noradrénaline, dobutamine, vasodilatateur pulmonaire, volémie prudente, intubation à haut risque ; ne jamais interrompre un prostanoïde.</li></ul></template>

<template data-pop="pareto-i27-ttt" data-title="Pareto — Traitement"><p class="ratio" data-cover="i27-9,i27-10,i27-11"></p><ul>
<li>Objectif : risque faible. Suivi à quatre niveaux : classe fonctionnelle, marche (440 / 320 / 165 m), NT-proBNP (300 / 650 / 1 100 ng/L).</li>
<li>Test de vasoréactivité positif (baisse ≥ 10 mmHg jusqu’à ≤ 40 mmHg, débit maintenu) : inhibiteur calcique à forte dose.</li>
<li>Non-répondeur : bithérapie orale endothéline + phosphodiestérase de type 5 ; risque élevé : trithérapie avec prostanoïde parentéral.</li>
<li>Escalade : sélexipag, riociguat à la place de l’inhibiteur de la phosphodiestérase de type 5, sotatercept, prostanoïde parentéral, transplantation.</li>
<li>Mesures : réadaptation, contraception, pas de grossesse, oxygène si PaO₂ &lt; 8 kPa, diurétiques, fer, vaccins.</li>
<li>Groupes 2, 3, 5 : traiter la cause ; pas de médicament de l’HTAP dans le groupe 2.</li>
<li>Groupe 4 : anticoagulation à vie, endartériectomie si opérable, sinon angioplastie et riociguat.</li></ul></template>

<template data-pop="pareto-i27-crit" data-title="Pareto — Vaisseaux pulmonaires, suivi et critères"><p class="ratio" data-cover="i27-12,i27-13,i27-14,i27-15"></p><ul>
<li>Fistule artérioveineuse : embolie paradoxale et abcès cérébral ; embolisation de toute lésion visible ; antibioprophylaxie dentaire ; chercher une télangiectasie hémorragique héréditaire.</li>
<li>Anévrisme de l’artère pulmonaire : chercher une HTP et une maladie de Behçet avant toute anticoagulation.</li>
<li>Réévaluer le risque 3 à 4 mois après chaque changement ; dépister sclérodermie et porteurs BMPR2.</li>
<li>Grossesse : mortalité maternelle 11 à 25 % ; médicaments tératogènes arrêtés.</li>
<li>Critères : PAPm &gt; 20 mmHg ; précapillaire si PAPO ≤ 15 mmHg et RVP &gt; 2 unités Wood ; HTAP après exclusion des groupes 2 à 5.</li></ul></template>

<template data-pop="pareto-i27-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="i27-e-1,i27-e-2,i27-e-3,i27-e-4,i27-e-5,i27-e-6,i27-e-7"></p><ul>
<li>Détection : échocardiographie ; diagnostic : cathétérisme droit ; dépistage du groupe 4 : scintigraphie.</li>
<li>Probabilité : vitesse ≤ 2,8 / 2,9–3,4 / &gt; 3,4 m/s, et signes de deux catégories (ventricules, artère pulmonaire, veine cave et oreillette droite).</li>
<li>Cathétérisme normal : PAPm 8–20 mmHg, PAPO ≤ 15 mmHg, RVP 0,3–2 unités Wood, index cardiaque 2,5–4 L/min/m².</li>
<li>Remplissage de 500 mL : PAPO ≥ 18 mmHg évoque une insuffisance cardiaque à fraction d’éjection préservée.</li>
<li>DLCO très basse et lignes septales : maladie veino-occlusive. Carence martiale : ferritine &lt; 100 µg/L ou 100–299 avec saturation &lt; 20 %.</li>
<li>Scanner : rapport artère pulmonaire/aorte &gt; 0,9 suggestif ; tronc ≥ 30 mm avec paroi droite ≥ 6 mm et septum dévié très prédictifs.</li>
<li>Configuration : la PAPO isole le groupe 2, la scintigraphie le groupe 4, la DLCO et le scanner séparent HTAP, maladie veino-occlusive et groupe 3.</li></ul></template>

<template data-pop="pareto-i27-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="i27-p-1,i27-p-2,i27-p-3,i27-p-4"></p><ul>
<li>Quatre voies : endothéline (bosentan, ambrisentan, macitentan), GMPc (sildénafil, tadalafil, riociguat), prostacycline (sélexipag, époprosténol, tréprostinil, iloprost), activine (sotatercept).</li>
<li>Jamais : inhibiteur de la phosphodiestérase de type 5 ou riociguat avec un dérivé nitré ; inhibiteur de la phosphodiestérase de type 5 avec riociguat ; bosentan avec ciclosporine ou glibenclamide.</li>
<li>Tératogènes : antagonistes de l’endothéline, riociguat, sotatercept ; le bosentan réduit l’efficacité des contraceptifs hormonaux.</li>
<li>Surveillance : aminotransférases mensuelles sous bosentan ; hémoglobine et plaquettes sous sotatercept ; pression systolique ≥ 95 mmHg pour titrer le riociguat.</li>
<li>Inhibiteurs calciques seulement chez le répondeur ; aucun médicament de l’HTAP dans le groupe 2.</li></ul></template>
