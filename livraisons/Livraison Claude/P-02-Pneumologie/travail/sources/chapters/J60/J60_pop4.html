
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j60-bases" data-title="Pareto — Définition, codage et épidémiologie">
<p class="ratio" data-cover="j60-0,j60-1,j60-2"></p>
<ul>
<li>Pneumoconiose = poussière minérale accumulée dans le poumon et réaction du tissu ; diagnostic = exposition suffisante + latence compatible + imagerie typique, après exclusion.</li>
<li>Codes : J60 charbon ; J61 amiante (J61.0 ou J61.1) ; J62 silice (J62.0 talc, J62.8 silicose) ; J63 autres (béryllium J63.2, fer J63.4…) ; J64 sans précision ; J65 dès qu’une tuberculose coexiste. Plaques pleurales : J92.0, pas J61.</li>
<li>Silicose chronique (plus de 10 ans), accélérée (5 à 10 ans), aiguë (semaines à 5 ans) ; compliquée = opacités de plus de 1 cm (fibrose massive).</li>
<li>Suisse : silicose de 300 cas par an (années 1970) à moins de 20 ; valeur limite du quartz 0,15 mg/m³ ; environ 150 décès par an liés à l’amiante malgré l’interdiction de 1990.</li>
<li>Pierre artificielle : plus de 90 % de silice, silicoses accélérées chez des travailleurs jeunes.</li>
<li>Silicose radiologique : risque de tuberculose × 4,01. Asbestose et tabac : mortalité par cancer bronchique × 36,8.</li></ul></template>

<template data-pop="pareto-j60-meca" data-title="Pareto — Mécanismes, agents et clinique">
<p class="ratio" data-cover="j60-3,j60-4,j60-5,j60-6"></p>
<ul>
<li>Particules de moins de 5 µm environ → alvéoles → macrophage. Silice : rupture du lysosome, inflammasome NLRP3, interleukine 1β ; amiante : phagocytose frustrée. Cycle mort et rephagocytose → progression après l’arrêt.</li>
<li>Fibroblastes → nodule silicotique (sommets, périlymphatique) ou fibrose diffuse (bases pour l’amiante).</li>
<li>Conséquences : restriction, DLCO basse, désaturation d’effort, cœur pulmonaire ; tuberculose ; auto-immunité associée ; cancer (silice et amiante groupe 1).</li>
<li>Bérylliose = granulomes d’hypersensibilité, imite la sarcoïdose. Fer, étain, baryum : images sans fibrose notable.</li>
<li>Anamnèse : tous les métiers depuis l’école, dates, matériaux, procédé, protection, étranger ; tabac en paquets-années.</li>
<li>Fièvre, amaigrissement, hémoptysie = tuberculose ou cancer jusqu’à preuve du contraire.</li>
<li>Examen souvent normal ; crépitants des bases et hippocratisme → asbestose ; désaturation d’effort = atteinte de la diffusion.</li></ul></template>

<template data-pop="pareto-j60-diag" data-title="Pareto — Diagnostic et complications">
<p class="ratio" data-cover="j60-7,j60-8"></p>
<ul>
<li>Étapes : exposition → radiographie lue selon l’ILO, tomodensitométrie, fonction complète → complications (IGRA, cancer, auto-immunité) → concordance = diagnostic clinique ; sinon lavage ou biopsie → annonce à la Suva.</li>
<li>Différentiels prioritaires : tuberculose, métastases, sarcoïdose (penser au béryllium), pneumopathie d’hypersensibilité, fibrose idiopathique (absence de plaques).</li>
<li>Urgences : tuberculose active, silicose aiguë, pneumothorax, exacerbation aiguë (J61.1), insuffisance respiratoire.</li>
<li>Complications chroniques : tuberculose et mycobactérioses, cancer bronchique, mésothéliome, cœur pulmonaire, obstruction, aspergillome, auto-immunité et rein.</li>
<li>Cavité dans un conglomérat = tuberculose jusqu’à preuve du contraire.</li></ul></template>

<template data-pop="pareto-j60-pec" data-title="Pareto — Prise en charge, droit suisse et critères">
<p class="ratio" data-cover="j60-9,j60-10,j60-11,j60-12,j60-13"></p>
<ul>
<li>Éviction d’abord (décision d’inaptitude, indemnité pour changement d’occupation) ; sevrage tabagique ; vaccinations.</li>
<li>Silicotique avec IGRA positif sans tuberculose active : traitement préventif (isoniazide 6 à 9 mois, rifampicine 4 mois, ou les deux 3 mois).</li>
<li>Nintédanib en centre si fibrose progressive (CVF −5 % ou DLCO −10 % de la valeur prédite en un an, avec aggravation) ; corticostéroïdes réservés à la bérylliose ; lavage pulmonaire total dans la silicose aiguë ; transplantation au stade terminal.</li>
<li>LAA art. 9 : cause professionnelle prépondérante ; pneumoconioses sur la liste de l’annexe 1 de l’OLAA ; assimilation à un accident professionnel.</li>
<li>Annonce par l’employeur ; retraité : directement à la Suva ; partage entre assureurs selon la durée d’exposition.</li>
<li>Prévention STOP ; suivi Suva des anciens exposés à l’amiante dès 3 fibres-années ; dépistage par tomodensitométrie (55 à 75 ans, début avant 1985, au moins 10 ans, plus 30 paquets-années ou asbestose).</li>
<li>Critères : asbestose ATS 2004 (lésion + causalité + exclusion) ; bérylliose ATS 2014 (BeLPT confirmé + granulomes) ; silicose : exposition + latence + opacités arrondies supérieures (ILO 1/0 ou plus) + exclusion.</li></ul></template>

<template data-pop="pareto-j60-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j60-e-1,j60-e-2,j60-e-3,j60-e-4,j60-e-5,j60-e-6,j60-e-7"></p>
<ul>
<li>Radiographie lue selon l’ILO pour la surveillance ; tomodensitométrie pour le diagnostic ; biopsie avec minéralogie seulement si atypique.</li>
<li>ILO : p, q, r arrondies et s, t, u irrégulières (1,5 ; 3 ; 10 mm) ; profusion en 12 sous-catégories, 1/0 ou plus compatible ; grandes opacités A (jusqu’à 50 mm), B, C (au-delà de la zone supérieure droite) ; symboles es, ax, tb, ca, cv.</li>
<li>Tomodensitométrie : micronodules périlymphatiques des sommets et adénopathies (silice) ; fibrose basale sous-pleurale et plaques (amiante).</li>
<li>Fonction : restriction et DLCO basse (amiante), profil mixte fréquent (silice, charbon) ; spirométrie normale possible, d’où la DLCO et le test de marche.</li>
<li>Biologie : IGRA (infection, pas maladie), BeLPT (béryllium), autoanticorps seulement guidés par la clinique.</li>
<li>Corps asbestosique = exposition, pas maladie ; petite biopsie négative n’exclut rien.</li></ul></template>

<template data-pop="pareto-j60-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j60-p-1,j60-p-2,j60-p-3,j60-p-4"></p>
<ul>
<li>Aucun médicament n’enlève la poussière ni ne fait régresser la fibrose constituée.</li>
<li>Isoniazide 5 mg/kg (maximum 300 mg) avec pyridoxine ; rifampicine 10 mg/kg (maximum 600 mg), contre-indiquée si clairance &lt; 25 mL/min.</li>
<li>Nintédanib 150 mg deux fois par jour (100 mg si intolérance ou Child-Pugh A), contre-indiqué pendant la grossesse ; pirfénidone autorisée seulement dans la fibrose idiopathique.</li>
<li>Rifampicine : nintédanib −50,3 %, anticoagulants oraux, contraceptifs hormonaux, corticostéroïdes diminués. Isoniazide : antiépileptiques augmentés, hépatotoxicité avec paracétamol et alcool.</li>
<li>Corticostéroïdes : bérylliose avec atteinte fonctionnelle seulement ; à éviter dans la silicose et l’asbestose.</li></ul></template>
