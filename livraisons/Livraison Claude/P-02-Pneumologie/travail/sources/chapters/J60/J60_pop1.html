
<!-- ===== FENÊTRES : pathologie ===== -->
<template data-pop="j60-def-pneumo" data-title="Pneumoconiose : définition">
<div class="lab">Définition</div><p>L’ILO définit la pneumoconiose comme l’accumulation de poussières dans les poumons et les réactions tissulaires à leur présence. Le terme s’applique aux poussières inorganiques dans la CIM-10-GM (J60 à J65).</p>
<div class="lab">Ce qui n’en fait pas partie</div><p>Les maladies des poussières organiques (byssinose J66, pneumopathies d’hypersensibilité J67) et les atteintes par gaz ou fumées chimiques (J68) relèvent d’autres catégories, car leur mécanisme est immunologique ou irritatif et non lié à l’accumulation d’une poussière minérale.</p>
<div class="lab">Conséquence pratique</div><p>Nommer la pneumoconiose par l’agent (silicose, asbestose, bérylliose) fixe le code, le pronostic, les complications à rechercher et la démarche d’annonce.</p></template>

<template data-pop="j60-formes-silicose" data-title="Formes de la silicose">
<div class="lab">Silicose chronique</div><p>Elle apparaît habituellement plus de dix ans après le début d’une exposition modérée. Les nodules débutent aux sommets. Elle peut rester simple pendant des années.</p>
<div class="lab">Silicose accélérée</div><p>Elle apparaît cinq à dix ans après le début d’une exposition intense. La fibrose massive, la tuberculose et l’auto-immunité y sont plus fréquentes. Les ouvriers de la pierre artificielle en sont l’exemple actuel.</p>
<div class="lab">Silicose aiguë</div><p>Elle survient de quelques semaines à cinq ans après une exposition massive (sablage, broyage de quartz). Le tableau est celui d’une silicoprotéinose alvéolaire rapidement progressive.</p>
<div class="lab">Mécanisme commun</div><p>La dose quotidienne de silice détermine la vitesse : plus le macrophage reçoit de silice, plus le cycle mort, libération et nouvelle phagocytose s’accélère.</p>
<div class="lab">Codage</div><p>Toutes ces formes se codent J62.8, ou J65 en présence d’une tuberculose (CIM-10-GM 2024). Délais d’après Leung C. C. et al., Silicosis, Lancet 2012.</p></template>

<template data-pop="j60-fmp" data-title="Fibrose massive progressive">
<div class="lab">Définition</div><p>Elle désigne la confluence des nodules en opacités de plus de 10 mm, appelées grandes opacités dans la classification ILO (catégories A, B, C).</p>
<div class="lab">Mécanisme</div><p>Les nodules voisins fusionnent et rétractent le parenchyme. Les masses migrent vers les hiles et laissent un emphysème périphérique.</p>
<div class="lab">Conséquence clinique</div><p>Elle réduit les volumes, altère la diffusion, provoque hypoxémie et cœur pulmonaire. Les masses peuvent s’excaver ; une cavité impose de rechercher une tuberculose.</p>
<div class="lab">Fréquence</div><p>Dans la silicose aux pierres artificielles, une revue systématique la retrouve chez 28,6 % des patients dès le diagnostic (Mason et al., 2026).</p>
<div class="lab">Piège</div><p>Une masse unilatérale, asymétrique ou à croissance rapide évoque d’abord un cancer bronchique ; la symétrie et la stabilité plaident pour la fibrose massive.</p></template>

<template data-pop="j60-sil-aigue" data-title="Silicose aiguë (silicoprotéinose)">
<div class="lab">Mécanisme</div><p>Une exposition massive à de la silice fraîchement fracturée submerge les macrophages et lèse les pneumocytes de type II. Les alvéoles se remplissent d’un matériel lipoprotéinacé proche de celui de la protéinose alvéolaire.</p>
<div class="lab">Tableau</div><p>Dyspnée rapidement croissante, toux, amaigrissement, hypoxémie. La tomodensitométrie montre du verre dépoli et des condensations diffuses.</p>
<div class="lab">Prise en charge</div><p>Arrêt immédiat et définitif de l’exposition, hospitalisation en centre, oxygène, recherche de tuberculose. Le lavage pulmonaire total peut retirer le matériel alvéolaire ; il repose sur des séries de cas.</p>
<div class="lab">Pronostic</div><p>Il est souvent mauvais ; la transplantation se discute tôt.</p></template>

<template data-pop="j60-pierre" data-title="Pierre artificielle et silicose">
<div class="lab">Matériau</div><p>La pierre artificielle (agglomérat de quartz, « quartz composite ») associe du quartz broyé et une résine. Elle contient plus de 90 % de silice cristalline, contre 40 à 50 % pour le granit et moins de 10 % pour le marbre (Fazio et al., 2025).</p>
<div class="lab">Exposition</div><p>La coupe, le meulage et le polissage des plans de travail produisent une poussière riche en quartz fraîchement fracturé. Le travail à sec et l’absence d’aspiration à la source multiplient l’exposition.</p>
<div class="lab">Maladie</div><p>Les séries décrivent une silicose accélérée, diagnostiquée après 7 à 19 ans d’exposition, chez des travailleurs jeunes, avec fibrose massive fréquente, maladies auto-immunes, transplantations et décès.</p>
<div class="lab">Conséquence pratique</div><p>Tout travailleur de ce secteur avec une dyspnée, une toux ou une image nodulaire doit être interrogé sur le procédé et adressé pour imagerie et fonction complète. Les données suisses propres à ce matériau ne sont pas publiées.</p></template>

<template data-pop="j60-silice" data-title="Silice cristalline">
<div class="lab">Formes</div><p>La silice (SiO₂) est cristalline (quartz, cristobalite, tridymite) ou amorphe. Seule la forme cristalline est fortement fibrogène.</p>
<div class="lab">Sources</div><p>Grès, granit, sable, béton, céramique, pierre artificielle. Les tunnels, les carrières, la taille de pierre, les fonderies, le sablage et la démolition exposent.</p>
<div class="lab">Toxicité</div><p>La surface fraîchement fracturée porte des groupements réactifs qui rompent le lysosome du macrophage. La silice cristalline est classée cancérogène certaine (groupe 1) par le Centre international de recherche sur le cancer.</p>
<div class="lab">Mesure</div><p>L’exposition se mesure sur la fraction alvéolaire, en mg/m³, et se compare à la valeur limite d’exposition.</p></template>

<template data-pop="j60-amiante" data-title="Amiante : minéraux et maladies">
<div class="lab">Minéraux</div><p>L’amiante regroupe des silicates fibreux : le chrysotile (serpentine, fibres courbes) et les amphiboles (crocidolite, amosite, fibres droites et biopersistantes).</p>
<div class="lab">Maladies</div><p>Plaques pleurales, épanchement pleural bénin, épaississement pleural diffus et atélectasie ronde (cours J90) ; asbestose (J61) ; mésothéliome (C45) ; cancer bronchique (C34).</p>
<div class="lab">Exposition actuelle</div><p>L’amiante est interdit en Suisse depuis 1990, mais il reste présent dans de nombreux bâtiments anciens. La rénovation et la démolition exposent encore. L’anamnèse détaillée est décrite dans la fiche <button class="w" data-k="j90-a-amiante">exposition à l’amiante</button>.</p>
<div class="lab">Dose</div><p>L’asbestose demande une exposition importante : selon la Suva, une asbestose visible sans technique invasive suppose au moins 5 fibres-années (Suva Medical, 2020).</p></template>

<template data-pop="j60-amphibole" data-title="Phagocytose frustrée et biopersistance">
<div class="lab">Principe</div><p>Un macrophage alvéolaire mesure environ 15 à 20 µm. Une fibre plus longue ne peut pas être englobée : le macrophage reste activé et libère en continu des espèces réactives de l’oxygène et des cytokines.</p>
<div class="lab">Biopersistance</div><p>Les amphiboles résistent à la dissolution et persistent des décennies ; le chrysotile se fragmente et s’élimine en partie. La durée de présence de la fibre prolonge l’inflammation.</p>
<div class="lab">Conséquence</div><p>Cette inflammation chronique entretient la fibrose de l’asbestose et participe à la cancérogenèse pleurale et bronchique. Les dimensions de fibre comptées en hygiène du travail (longueur de plus de 5 µm, diamètre de moins de 3 µm, rapport longueur sur diamètre d’au moins 3) suivent la convention de l’OMS.</p></template>

<template data-pop="j60-fibre-annee" data-title="Fibres-années">
<div class="lab">Définition</div><p>Une fibre-année correspond à une exposition moyenne d’une fibre par millilitre d’air pendant une année de travail. Elle mesure la dose cumulée.</p>
<div class="lab">Exemple</div><p>Un calorifugeur exposé en moyenne à 2 fibres/mL pendant 10 ans cumule 20 fibres-années.</p>
<div class="lab">Usage en Suisse</div><p>La Suva propose des consultations de suivi aux personnes ayant cumulé au moins 3 fibres-années, tous les cinq ans jusqu’à 80 ans ; une asbestose visible suppose au moins 5 fibres-années (Suva Medical, 30.06.2020).</p>
<div class="lab">Limite</div><p>La dose est une estimation rétrospective, fondée sur les métiers et les mesures disponibles ; elle comporte une incertitude importante.</p></template>

<template data-pop="j60-charbon" data-title="Pneumoconiose des houilleurs">
<div class="lab">Lésions</div><p>La macule charbonneuse est un amas de macrophages chargés de pigment autour des bronchioles respiratoires, avec un emphysème focal. Les nodules apparaissent quand le charbon contient du quartz.</p>
<div class="lab">Formes</div><p>Forme simple (petites opacités), forme compliquée (fibrose massive progressive), syndrome de Caplan en cas de polyarthrite rhumatoïde. Les mineurs développent aussi une bronchite chronique et une BPCO liées aux poussières.</p>
<div class="lab">Signe particulier</div><p>Une mélanoptysie, expectoration noire, survient quand une masse se nécrose et se vide dans une bronche.</p>
<div class="lab">En Suisse</div><p>Elle s’observe chez d’anciens mineurs ayant travaillé à l’étranger ; le code est J60, ou J65 avec une tuberculose.</p></template>

<template data-pop="j60-talc" data-title="Talcose">
<div class="lab">Exposition professionnelle</div><p>L’extraction et le broyage du talc exposent à un silicate de magnésium, parfois contaminé par de l’amiante ou du quartz. Le code est J62.0.</p>
<div class="lab">Talcose d’injection</div><p>L’injection intraveineuse de comprimés broyés dépose le talc des excipients dans les artérioles pulmonaires et produit des granulomes à corps étrangers, parfois une hypertension pulmonaire. Ce n’est pas une maladie professionnelle.</p>
<div class="lab">Histologie</div><p>Des cristaux fortement biréfringents en lumière polarisée se voient dans les granulomes.</p></template>

<template data-pop="j60-alu" data-title="Aluminose et fibrose de la bauxite">
<div class="lab">Aluminose (J63.0)</div><p>La poudre d’aluminium fine, notamment en paillettes, peut provoquer une fibrose interstitielle. Elle est rare.</p>
<div class="lab">Fibrose de la bauxite (J63.1)</div><p>Elle a été décrite chez des ouvriers de la fusion de la bauxite (maladie de Shaver), où l’exposition associait des fumées d’alumine et de la silice.</p>
<div class="lab">Liste suisse</div><p>L’annexe 1 de l’OLAA cite les poussières d’aluminium parmi les travaux qui provoquent des pneumoconioses.</p></template>

<template data-pop="j60-berylliose" data-title="Bérylliose">
<div class="lab">Exposition</div><p>Le béryllium entre dans les alliages cuivre-béryllium, l’électronique, l’aéronautique, le nucléaire et certains alliages dentaires. Une exposition faible peut suffire.</p>
<div class="lab">Mécanisme</div><p>Hypersensibilité retardée : le variant de HLA-DPB1 portant un glutamate en position 69 présente le béryllium aux lymphocytes T CD4, qui organisent des granulomes (ATS 2014).</p>
<div class="lab">Stades</div><p>La sensibilisation est un BeLPT anormal confirmé sans maladie pulmonaire. La bérylliose chronique associe sensibilisation et inflammation granulomateuse du poumon.</p>
<div class="lab">Diagnostic différentiel</div><p>Elle est indistinguable de la sarcoïdose en imagerie et en histologie. Le BeLPT et l’anamnèse professionnelle tranchent.</p>
<div class="lab">Traitement</div><p>Éviction ; corticostéroïdes lorsque la fonction est significativement altérée ou décline ; surveillance de la sensibilisation. Code J63.2.</p></template>

<template data-pop="j60-inertes" data-title="Pneumoconioses peu fibrogènes : graphite, fer, étain, baryum">
<div class="lab">Sidérose (J63.4)</div><p>Les soudeurs et les polisseurs inhalent des oxydes de fer. Les macrophages s’en chargent sans fibrose notable. Les images peuvent régresser après l’arrêt de l’exposition.</p>
<div class="lab">Stannose (J63.5)</div><p>L’oxyde d’étain produit de petites opacités très denses, sans retentissement fonctionnel.</p>
<div class="lab">Graphite (J63.3)</div><p>Le graphite se comporte comme le charbon ; une fibrose survient surtout s’il est contaminé par de la silice.</p>
<div class="lab">Barytose (J63.8)</div><p>Le sulfate de baryum produit des opacités très denses et bénignes.</p>
<div class="lab">Piège</div><p>Une fonction altérée chez un soudeur doit faire rechercher une autre cause : silice du meulage, fumées toxiques, BPCO tabagique.</p></template>

<template data-pop="j60-metaux-durs" data-title="Maladie des métaux durs">
<div class="lab">Exposition</div><p>Le métal dur est un carbure de tungstène lié par du cobalt. L’affûtage et la fabrication d’outils exposent à ces poussières.</p>
<div class="lab">Mécanisme et lésion</div><p>Le cobalt provoque une réaction en partie immunologique, avec une pneumopathie interstitielle à cellules géantes multinucléées. Un asthme professionnel peut s’y associer.</p>
<div class="lab">Codage et liste</div><p>Elle se code J63.8. L’annexe 1 de l’OLAA cite les poussières de métaux durs parmi les causes de pneumoconiose.</p>
<div class="lab">Évolution</div><p>Les formes précoces peuvent s’améliorer après l’éviction ; les formes fibrosées progressent.</p></template>

<template data-pop="j60-caplan" data-title="Syndrome de Caplan">
<div class="lab">Définition</div><p>Association d’une polyarthrite rhumatoïde et de nodules pulmonaires multiples de 0,5 à 5 cm chez un travailleur exposé au charbon ou à la silice, décrite en 1953 chez des mineurs gallois.</p>
<div class="lab">Mécanisme</div><p>Les nodules sont des nodules rhumatoïdes centrés par de la poussière ; ils peuvent s’excaver ou se calcifier.</p>
<div class="lab">Conséquence pratique</div><p>Des nodules de cette taille chez un exposé imposent une recherche de polyarthrite (facteur rhumatoïde, anticorps anti-peptides cycliques citrullinés) et l’exclusion d’une tuberculose ou d’un cancer.</p></template>

<template data-pop="j60-auto" data-title="Silice, auto-immunité et rein">
<div class="lab">Associations</div><p>L’exposition à la silice est associée à la polyarthrite rhumatoïde, à la sclérodermie systémique (syndrome d’Erasmus), au lupus, aux vasculites associées aux ANCA et à des néphropathies.</p>
<div class="lab">Mécanisme proposé</div><p>Dans les modèles expérimentaux, la silice agit comme adjuvant : la mort des macrophages libère des autoantigènes et active l’immunité innée. Ce mécanisme est plausible mais non démontré chez chaque patient.</p>
<div class="lab">Niveau de preuve</div><p>Les données proviennent d’études d’association. Une maladie auto-immune chez un exposé n’est donc pas automatiquement professionnelle ; la reconnaissance suit l’article 9, alinéa 2, de la LAA.</p>
<div class="lab">Conséquence pratique</div><p>Chez le silicotique, le médecin recherche à chaque visite des synovites, un phénomène de Raynaud, une sclérodactylie, une protéinurie et une hématurie, et dose la créatinine.</p></template>

<template data-pop="j60-latence" data-title="Latence">
<div class="lab">Définition</div><p>La latence est le délai entre le début de l’exposition et l’apparition de la maladie. Elle se compte depuis le début, pas depuis la fin.</p>
<div class="lab">Ordres de grandeur</div><p>Silicose chronique : habituellement plus de dix ans ; silicose accélérée : cinq à dix ans ; silicose aiguë : semaines à cinq ans. Asbestose : souvent vingt ans ou plus. Mésothéliome : plusieurs décennies.</p>
<div class="lab">Usage</div><p>Une latence trop courte pour l’agent suspecté doit faire chercher une autre cause ; une latence longue rend plausible une maladie chez un retraité.</p></template>

<template data-pop="j60-anam-pro" data-title="Anamnèse professionnelle chronologique">
<div class="lab">Méthode</div><p>Le médecin liste chaque emploi depuis la fin de l’école, avec les dates de début et de fin, l’employeur, le pays, le poste, les matériaux, le procédé (sec ou humide), la ventilation, la protection respiratoire et la durée quotidienne d’exposition.</p>
<div class="lab">Questions utiles</div><p>« Que faisiez-vous exactement de vos mains ? » ; « Y avait-il de la poussière visible ? » ; « Coupiez-vous à sec ? » ; « Avez-vous travaillé à l’étranger ? » ; « Des collègues sont-ils malades ? »</p>
<div class="lab">Sources complémentaires</div><p>Fiches de données de sécurité, mesures de l’entreprise, dossier de médecine du travail de la Suva, carnet d’ouvrier.</p>
<div class="lab">Erreur fréquente</div><p>Se limiter au métier actuel. Une exposition ancienne, oubliée ou jugée banale par le patient, est souvent la clé.</p></template>

<template data-pop="j60-spo2" data-title="Saturation au repos et à l’effort">
<div class="lab">Technique</div><p>L’oxymètre de pouls mesure la saturation au repos, puis pendant un effort standardisé (marche, escaliers) ; le signal se vérifie sur la courbe de pouls.</p>
<div class="lab">Valeur normale</div><p>Chez l’adulte sain au niveau de la mer, la saturation de repos est d’environ 95 à 99 % et baisse peu à l’effort.</p>
<div class="lab">Interprétation</div><p>Une baisse d’au moins 4 points, ou au-dessous de 90 %, est usuellement retenue comme significative ; elle traduit un défaut de diffusion et oriente vers une gazométrie et un test de marche.</p>
<div class="lab">Piège</div><p>Des doigts froids, un vernis ou une mauvaise perfusion faussent la mesure ; une carboxyhémoglobine élevée chez le fumeur la surestime.</p></template>

<template data-pop="j60-crepitants" data-title="Crépitants secs des bases">
<div class="lab">Technique</div><p>Le médecin ausculte les bases en arrière et sur les lignes axillaires pendant une inspiration lente et profonde, patient assis.</p>
<div class="lab">Mécanisme</div><p>Les petites voies aériennes fermées par la fibrose s’ouvrent brusquement en fin d’inspiration et produisent un bruit fin, sec, comparé à un velcro qu’on décolle.</p>
<div class="lab">Valeur</div><p>Ils orientent vers une fibrose basale : asbestose, fibrose pulmonaire idiopathique, connectivite. Ils sont rares dans la silicose simple.</p>
<div class="lab">Piège</div><p>Des crépitants qui disparaissent après quelques inspirations profondes ou une toux correspondent à une hypoventilation déclive, pas à une fibrose.</p></template>

<template data-pop="j60-hippo" data-title="Hippocratisme digital">
<div class="lab">Technique</div><p>Le médecin recherche la perte de l’angle entre l’ongle et le repli unguéal et le signe de Schamroth : quand les faces dorsales des deux index sont accolées, la fenêtre losangique normale disparaît.</p>
<div class="lab">Mécanisme proposé</div><p>Des mégacaryocytes et des amas plaquettaires non filtrés par le poumon libéreraient des facteurs de croissance dans les doigts ; le mécanisme reste incertain.</p>
<div class="lab">Valeur</div><p>Dans l’asbestose avancée, il traduit la fibrose. Chez un silicotique ou un ancien exposé à l’amiante sans fibrose étendue, il fait rechercher un cancer bronchique.</p></template>

<template data-pop="j60-cpulm" data-title="Cœur pulmonaire chronique">
<div class="lab">Mécanisme</div><p>L’hypoxémie alvéolaire provoque une vasoconstriction des artérioles pulmonaires, et la fibrose détruit le lit capillaire. La pression artérielle pulmonaire s’élève et le ventricule droit s’hypertrophie puis se dilate.</p>
<div class="lab">Signes</div><p>Éclat du deuxième bruit pulmonaire, turgescence jugulaire, reflux hépatojugulaire, œdèmes des membres inférieurs.</p>
<div class="lab">Examens</div><p>Échocardiographie, peptide natriurétique, gazométrie. La confirmation hémodynamique et la classification relèvent du cours I27.</p>
<div class="lab">Décision</div><p>Corriger l’hypoxémie par l’oxygène, car c’est le levier le plus direct sur la vasoconstriction.</p></template>

<template data-pop="j60-tb" data-title="Silicotuberculose (J65)">
<div class="lab">Risque</div><p>Une silicose radiologique multiplie le risque de tuberculose par 4,01 ; l’exposition à la silice sans silicose visible le multiplie par 1,92 (méta-analyse, Ehrlich et al., 2021). Le risque croît avec la sévérité de la silicose.</p>
<div class="lab">Mécanisme</div><p>Le macrophage chargé de silice a une capacité réduite à tuer les mycobactéries, et la silice persiste dans le tissu.</p>
<div class="lab">Reconnaissance</div><p>Les signes généraux, une nouvelle cavité, une asymétrie récente ou une croissance rapide d’un conglomérat doivent faire rechercher la tuberculose par l’examen direct, l’amplification génique et la culture des expectorations.</p>
<div class="lab">Prise en charge</div><p>Isolement s’il tousse, déclaration, traitement standard (cours A15) avec avis spécialisé. La rechute est plus fréquente que chez le non-silicotique.</p>
<div class="lab">Codage</div><p>Toute pneumoconiose J60 à J64 associée à une tuberculose classée en A15 ou A16 se code J65.</p></template>

<template data-pop="j60-cancer" data-title="Cancer bronchique et pneumoconioses">
<div class="lab">Agents</div><p>La silice cristalline et l’amiante sont classés cancérogènes certains pour le poumon (groupe 1) par le Centre international de recherche sur le cancer.</p>
<div class="lab">Interaction avec le tabac</div><p>Dans la cohorte des calorifugeurs nord-américains (Markowitz et al., 2013), par rapport aux non-fumeurs non exposés, la mortalité par cancer bronchique était multipliée par 3,6 pour l’amiante seul, 7,4 pour l’asbestose, 10,3 pour le tabac seul, 14,4 pour l’amiante et le tabac, et 36,8 pour l’asbestose et le tabac.</p>
<div class="lab">Bénéfice du sevrage</div><p>Dans la même cohorte, la mortalité par cancer a diminué de moitié dans les dix ans suivant l’arrêt du tabac et rejoint celle des non-fumeurs après trente ans.</p>
<div class="lab">Conséquence pratique</div><p>Sevrage tabagique prioritaire, dépistage par tomodensitométrie selon les critères de la Suva, exploration de tout nodule nouveau (cours C34).</p></template>

<template data-pop="j60-meso" data-title="Mésothéliome (renvoi)">
<div class="lab">Lien</div><p>Le mésothéliome pleural est le cancer le plus spécifique de l’amiante, surtout des amphiboles. Il survient plusieurs décennies après l’exposition, parfois après une exposition faible.</p>
<div class="lab">Signes d’appel</div><p>Douleur thoracique persistante, épanchement pleural, épaississement pleural nodulaire chez un ancien exposé.</p>
<div class="lab">Renvoi</div><p>Le diagnostic et le traitement relèvent du cours C45 ; l’épanchement relève du cours J90. Le mésothéliome lié à l’amiante est une maladie professionnelle annoncée à la Suva, ou indemnisée par la Fondation EFA en l’absence de couverture.</p></template>

<template data-pop="j60-ex-aigue" data-title="Exacerbation aiguë d’une fibrose">
<div class="lab">Définition</div><p>Aggravation respiratoire en moins d’un mois, avec nouvelles opacités en verre dépoli bilatérales sur une fibrose préexistante, sans explication complète par une insuffisance cardiaque ou une surcharge.</p>
<div class="lab">Démarche</div><p>Rechercher une infection, une embolie, une insuffisance cardiaque et un pneumothorax ; hospitaliser.</p>
<div class="lab">Codage</div><p>Dans l’asbestose, la CIM-10-GM 2024 distingue J61.0 (sans exacerbation aiguë) et J61.1 (avec exacerbation aiguë).</p>
<div class="lab">Pronostic</div><p>Il est réservé ; le traitement suit les principes décrits pour les fibroses dans le cours J84.</p></template>

<template data-pop="j60-annonce" data-title="Annonce d’une maladie professionnelle à la Suva">
<div class="lab">Salarié en activité</div><p>Le travailleur avise son employeur ou l’assureur, et l’employeur avise sans retard l’assureur (art. 45 LAA), comme pour un accident.</p>
<div class="lab">Retraité ou sans employeur</div><p>L’assuré, ou le médecin avec son accord, écrit directement à l’agence de la Suva de son canton.</p>
<div class="lab">Rôle du médecin</div><p>Il explique l’intérêt de l’annonce, documente l’exposition et le diagnostic, et répond aux rapports demandés. Il n’attend pas la certitude : l’assureur instruit la causalité.</p>
<div class="lab">Effets</div><p>Prise en charge du traitement, indemnités, rentes et indemnité pour atteinte à l’intégrité ; enquête possible dans l’entreprise, qui protège les collègues.</p></template>

<template data-pop="j60-laa" data-title="LAA et liste de l’annexe 1 de l’OLAA">
<div class="lab">Article 9, alinéa 1, LAA</div><p>Sont réputées maladies professionnelles les maladies dues exclusivement ou de manière prépondérante, dans l’exercice de l’activité professionnelle, à des substances nocives ou à certains travaux. Le Conseil fédéral en établit la liste.</p>
<div class="lab">Article 9, alinéa 2, LAA</div><p>Sont aussi réputées maladies professionnelles les autres maladies dont il est prouvé qu’elles ont été causées exclusivement ou de manière nettement prépondérante par l’activité professionnelle.</p>
<div class="lab">Annexe 1 de l’OLAA</div><p>La liste des substances nocives comprend les poussières d’amiante et le béryllium, ses composés et alliages. La liste des affections dues à certains travaux cite les pneumoconioses dues aux poussières d’aluminium, de silicates, de graphite, de silice (quartz) et de métaux durs. Dernière mise à jour de l’annexe : 1er avril 2018.</p>
<div class="lab">Article 9, alinéa 3, LAA</div><p>La maladie professionnelle est assimilée à un accident professionnel dès le jour où elle s’est déclarée.</p>
<div class="lab">Source</div><p>Recueil systématique du droit fédéral 832.20 et 832.202, états au 1er janvier 2026, fedlex.admin.ch, consultés le 08.10.2026.</p></template>

<template data-pop="j60-prep" data-title="Causalité prépondérante : seuils retenus">
<div class="lab">Question</div><p>Que signifient « de manière prépondérante » et « de manière nettement prépondérante » dans l’article 9 de la LAA ?</p>
<div class="lab">Réponse retenue</div><p>Selon la jurisprudence du Tribunal fédéral et la pratique des assureurs-accidents, « prépondérante » signifie que la cause professionnelle pèse plus de 50 % parmi l’ensemble des causes. « Nettement prépondérante » (maladie hors liste) signifie au moins 75 % ; la jurisprudence exige en outre un risque nettement plus élevé dans la profession que dans la population générale (notamment ATF 126 V 183).</p>
<div class="lab">Portée</div><p>Pour une pneumoconiose de la liste, la condition de plus de 50 % est presque toujours remplie, car la poussière minérale est la cause de la maladie. Le seuil de 75 % concerne surtout les maladies associées hors liste, par exemple une sclérodermie chez un exposé à la silice.</p>
<div class="lab">Limite</div><p>Ces seuils sont d’origine jurisprudentielle et ne figurent pas dans le texte de la loi ; l’appréciation finale appartient à l’assureur puis au juge. Texte en vigueur : LAA, art. 9, état au 1er janvier 2026.</p></template>

<template data-pop="j60-opa" data-title="Médecine du travail préventive (OPA)">
<div class="lab">Assujettissement</div><p>La Suva peut assujettir une entreprise, une partie d’entreprise ou un travailleur aux prescriptions de médecine du travail pour prévenir des maladies professionnelles (art. 70 OPA).</p>
<div class="lab">Examens</div><p>L’employeur annonce à la Suva tout nouveau travailleur assujetti au plus tard 30 jours après le début des travaux ; la Suva prescrit les examens d’embauche et de contrôle (art. 71 à 73).</p>
<div class="lab">Décision d’aptitude</div><p>La Suva peut exclure un travailleur d’un travail dangereux (inaptitude, temporaire ou permanente) ou l’autoriser à certaines conditions (aptitude conditionnelle). L’inaptitude suppose que le travailleur soit sérieusement menacé par la poursuite de l’activité (art. 78).</p>
<div class="lab">Rôle du médecin</div><p>Le médecin examinateur adresse à la Suva son avis sur l’aptitude et l’informe sans délai s’il faut cesser immédiatement l’activité (art. 71, al. 4).</p>
<div class="lab">Source</div><p>Recueil systématique du droit fédéral 832.30, version consultée sur fedlex.admin.ch le 08.10.2026.</p></template>

<template data-pop="j60-icho" data-title="Indemnité pour changement d’occupation">
<div class="lab">Bénéficiaire</div><p>Le travailleur exclu d’un travail, définitivement ou temporairement, ou déclaré apte à certaines conditions (art. 86 OPA).</p>
<div class="lab">Conditions principales</div><p>Ses possibilités de gain restent considérablement réduites malgré les conseils et une indemnité journalière de transition ; il a exercé l’activité dangereuse chez un employeur assujetti pendant au moins 300 jours au cours des deux années précédant la décision ou le changement d’occupation.</p>
<div class="lab">Intérêt clinique</div><p>Connaître ce droit aide le patient à accepter l’éviction, qui est la mesure thérapeutique principale.</p></template>

<template data-pop="j60-efa" data-title="Fondation EFA">
<div class="lab">But</div><p>La Fondation Fonds d’indemnisation des victimes de l’amiante, créée en 2017, indemnise surtout les personnes atteintes d’un mésothéliome dû à l’amiante en Suisse qui ne bénéficient pas des prestations de l’assurance-accidents.</p>
<div class="lab">Situations typiques</div><p>Exposition domestique (lavage des vêtements de travail d’un proche), environnementale, ou activité indépendante non assurée.</p>
<div class="lab">Conséquence pratique</div><p>Devant un mésothéliome sans exposition professionnelle assurée, le médecin informe le patient de cette possibilité. Source : Suva, page « Maladies et prestations d’assurance », consultée le 08.10.2026.</p></template>

<template data-pop="j60-vme" data-title="Valeur limite du quartz : Suisse et Union européenne">
<div class="lab">Valeur retenue en Suisse</div><p>0,15 mg/m³ de silice cristalline (quartz) dans la fraction alvéolaire, en moyenne sur la journée de travail. La Suva et la Commission suisse des valeurs limites ont décidé en 2018 de la maintenir (valeur citée par Koller et al., 2018 ; décision rapportée par la note « Quartz dust – Update 2019 » publiée sur news.save.ch).</p>
<div class="lab">Valeur de comparaison</div><p>La directive européenne 2017/2398 a fixé une valeur limite contraignante de 0,1 mg/m³ ; certains pays, comme l’Autriche, appliquent 0,05 mg/m³ depuis 2020.</p>
<div class="lab">Choix pour ce cours</div><p>Le texte principal cite la valeur suisse, car elle s’applique aux entreprises suisses. La liste des valeurs limites de la Suva n’a pas été relue dans sa version 2026 pour ce cours ; la valeur est donc attribuée à la dernière version vérifiée (décision de 2018).</p>
<div class="lab">Portée clinique</div><p>Une valeur limite n’est pas un seuil d’innocuité : dans l’étude suisse 2005–2014, 28 % des mesures la dépassaient, et des silicoses surviennent aussi après des expositions proches de la limite cumulées sur des années.</p></template>

<template data-pop="j60-stop" data-title="Principe STOP">
<div class="lab">Ordre des mesures</div><p>S : substitution, c’est-à-dire supprimer ou remplacer le matériau dangereux. T : mesures techniques, comme le travail à l’humide et l’aspiration à la source. O : mesures organisationnelles, comme la réduction du temps d’exposition et la séparation des postes. P : protection personnelle, comme le masque filtrant.</p>
<div class="lab">Pourquoi cet ordre</div><p>Chaque niveau dépend moins du comportement individuel que le suivant ; le masque n’agit que s’il est bien ajusté et porté en permanence.</p>
<div class="lab">Exemple</div><p>Dans un atelier de pierre artificielle, la coupe à l’eau avec aspiration réduit l’exposition de tous les ouvriers, alors que le masque seul ne protège que celui qui le porte correctement.</p></template>

<template data-pop="j60-ct-suva" data-title="Dépistage du cancer bronchique par la Suva">
<div class="lab">Principe</div><p>La Suva propose depuis 2012 un dépistage annuel par tomodensitométrie à faible dose aux anciens exposés à l’amiante à haut risque de cancer bronchique, sur la base de l’essai NLST.</p>
<div class="lab">Critères (Suva Medical, 30.06.2020)</div><p>Âge de 55 à 75 ans ; début du travail au contact de l’amiante avant 1985 et exposition d’au moins dix ans ; en plus, un tabagisme d’au moins 30 paquets-années ou une asbestose. L’admission est décidée par les médecins du travail de la Suva.</p>
<div class="lab">Limites</div><p>Le dépistage vise le cancer bronchique ; il ne détecte pas précocement le mésothéliome. L’arrêt du tabac reste le moyen le plus efficace de prévenir le cancer.</p></template>

<template data-pop="j60-sevrage" data-title="Sevrage tabagique chez l’exposé">
<div class="lab">Pourquoi</div><p>Le tabac et l’amiante interagissent de façon supra-additive sur le cancer bronchique ; le tabac aggrave aussi l’obstruction et la fonction.</p>
<div class="lab">Bénéfice chiffré</div><p>Chez les calorifugeurs, la mortalité par cancer bronchique a diminué de moitié dans les dix ans après l’arrêt (Markowitz et al., 2013).</p>
<div class="lab">Moyens</div><p>Entretien motivationnel, substituts nicotiniques et médicaments d’aide au sevrage selon les recommandations en vigueur ; en Suisse, la ligne stop-tabac et des programmes cantonaux soutiennent la démarche ; le détail relève du cours J44.</p></template>

<template data-pop="j60-vaccins" data-title="Vaccinations du patient pneumoconiotique">
<div class="lab">Pourquoi</div><p>Une infection respiratoire décompense un poumon dont la réserve est réduite par la fibrose et l’emphysème.</p>
<div class="lab">Lesquelles</div><p>Grippe saisonnière, pneumocoque et COVID-19, selon les indications du Plan de vaccination suisse en vigueur pour les maladies respiratoires chroniques. Le détail des vaccins et des schémas relève des cours J10 et J18.</p>
<div class="lab">Remarque</div><p>Le BCG ne protège pas l’adulte silicotique ; la prévention de la tuberculose repose sur le dépistage et le traitement de l’infection.</p></template>

<template data-pop="j60-rehab" data-title="Réadaptation respiratoire">
<div class="lab">Contenu</div><p>Programme supervisé d’entraînement à l’endurance et en force, éducation, techniques respiratoires, prise en charge nutritionnelle et psychologique, en général sur plusieurs semaines.</p>
<div class="lab">Mécanisme du bénéfice</div><p>L’entraînement améliore l’extraction de l’oxygène par les muscles périphériques et réduit la ventilation nécessaire pour un même effort ; la fibrose n’est pas modifiée.</p>
<div class="lab">Preuves</div><p>Les bénéfices sur la distance de marche et la qualité de vie sont démontrés dans la BPCO et les pneumopathies interstitielles ; les données propres aux pneumoconioses sont plus limitées.</p></template>

<template data-pop="j60-lavage" data-title="Lavage pulmonaire total">
<div class="lab">Technique</div><p>Sous anesthésie générale et intubation sélective, un poumon est rempli puis vidé de sérum physiologique à plusieurs reprises, pendant que l’autre assure la ventilation.</p>
<div class="lab">Indication</div><p>Silicoprotéinose (silicose aiguë), par analogie avec la protéinose alvéolaire ; il retire le matériel alvéolaire et une partie des particules.</p>
<div class="lab">Niveau de preuve</div><p>Séries de cas sans essai contrôlé ; il ne s’envisage qu’en centre spécialisé. Dans la silicose chronique, il n’a pas démontré de bénéfice clinique.</p></template>

<template data-pop="j60-tb-prev" data-title="Traitement préventif de la tuberculose chez le silicotique">
<div class="lab">Indication</div><p>Infection tuberculeuse démontrée (IGRA ou test cutané positif) sans tuberculose active. Le guide suisse version 1.2024 range la silicose parmi les situations à risque accru de progression, où la prévention médicamenteuse est prioritaire.</p>
<div class="lab">Schémas (guide suisse 2024)</div><p>Isoniazide quotidien pendant six ou neuf mois ; rifampicine quotidienne pendant quatre mois ; isoniazide et rifampicine quotidiens pendant trois mois. Pyridoxine avec l’isoniazide.</p>
<div class="lab">Avant de commencer</div><p>Exclure une tuberculose active par la clinique, l’imagerie et, si nécessaire, des prélèvements ; contrôler les tests hépatiques et les interactions.</p>
<div class="lab">Piège</div><p>Donner un traitement préventif à une tuberculose active méconnue crée une monothérapie et sélectionne des résistances.</p></template>
