<template data-pop="j80-bnp" data-title="Peptide natriurétique de type B"><p class="lab">Mécanisme</p><p>Les cardiomyocytes ventriculaires sécrètent ce peptide lorsque leur paroi est étirée par une surcharge de volume ou de pression.</p><p class="lab">Valeur</p><p>Une valeur basse rend une insuffisance cardiaque gauche peu probable et oriente vers un œdème lésionnel. Une valeur élevée n’est pas spécifique : le sepsis, l’insuffisance rénale, l’âge et le cœur pulmonaire aigu du SDRA l’augmentent aussi.</p><div class="key"><b>Piège.</b> Un peptide élevé chez un patient septique ne suffit pas à conclure à un œdème cardiogénique ; l’échocardiographie tranche.</div></template>
<template data-pop="j80-tdm" data-title="Tomodensitométrie thoracique"><p class="lab">Aspect du SDRA</p><p>Gradient ventro-dorsal : condensations des régions déclives, verre dépoli intermédiaire, zones antérieures normalement aérées. À la phase fibrotique apparaissent réticulations, bronchectasies de traction et kystes.</p><p class="lab">Indications</p><p>Rechercher une cause cachée (abcès, empyème, foyer abdominal), une maladie imitatrice (fibrose, pneumopathie organisée), un pneumothorax localisé ou une embolie associée.</p><div class="key"><b>Limite.</b> Le transport d’un patient ventilé sous FiO₂ élevée est risqué ; l’examen se demande quand son résultat peut changer la conduite.</div></template>
<template data-pop="j80-mecanique" data-title="Mécanique ventilatoire au lit"><p class="lab">Mesures</p><p>Pression de plateau : pause téléinspiratoire d’environ 0,5 seconde chez un patient passif. Pression motrice : plateau moins PEP. Compliance statique : volume courant divisé par la pression motrice.</p><p class="lab">Exemple</p><p>Volume 420 mL, plateau 28, PEP 10 cm H₂O : pression motrice 18, compliance 23 mL/cm H₂O. Réduire le volume à 360 mL ramène la pression motrice vers 15 si la compliance reste stable.</p><div class="key"><b>Piège.</b> Chez un patient qui respire activement, la mesure est faussée ; l’effort inspiratoire masque une pression transpulmonaire élevée.</div></template>
<template data-pop="j80-cisatracurium" data-title="Cisatracurium"><p class="lab">Mécanisme</p><p>Curare benzylisoquinoléine non dépolarisant : antagoniste compétitif des récepteurs nicotiniques de la plaque motrice. Il supprime la contraction des muscles squelettiques, sans effet sur la conscience ni sur la douleur.</p><p class="lab">Élimination</p><p>Dégradation de Hofmann, dépendante du pH et de la température, en laudanosine et en monoacrylate ; la durée d’action ne dépend donc ni du rein ni du foie, ce qui explique son choix en soins intensifs.</p><p class="lab">Posologie en soins intensifs</p><p>Perfusion initiale 3 µg/kg/min (0,18 mg/kg/h), besoins de 0,5 à 10,2 µg/kg/min selon l’information professionnelle ; schéma ACURASYS : 15 mg puis 37,5 mg/h pendant 48 heures.</p><p class="lab">Effets indésirables et contre-indication</p><p>Myopathie et faiblesse prolongée, surtout avec corticoïdes ; contre-indication en cas d’hypersensibilité au cisatracurium, à l’atracurium ou à l’acide benzènesulfonique.</p><div class="key"><b>Surveillance.</b> Sédation profonde préalable, train-de-quatre, réévaluation quotidienne de la nécessité. La monographie suisse n’a pas pu être consultée : l’information citée est l’information professionnelle allemande de juillet 2021.</div><p class="src">Référence : <a href="https://www.fachinfo.de/pdf/000763" target="_blank" rel="noopener">Information professionnelle Nimbex, juillet 2021</a>.</p></template>
<template data-pop="j80-dexamethasone" data-title="Dexaméthasone"><p class="lab">Mécanisme</p><p>Glucocorticoïde puissant, sans activité minéralocorticoïde notable. Le complexe avec le récepteur intracellulaire réprime la transcription des cytokines par inhibition de facteurs comme le facteur nucléaire kappa B, réduit le recrutement des neutrophiles et freine la fibroprolifération.</p><p class="lab">Preuves</p><p>DEXA-ARDS (2020, 277 patients, SDRA modéré à sévère) : 20 mg par jour du jour 1 au jour 5 puis 10 mg du jour 6 au jour 10 ; jours sans ventilation augmentés de 4,8 ; mortalité à 60 jours 21 % contre 36 %. RECOVERY (COVID-19) : 6 mg par jour jusqu’à 10 jours ; mortalité des patients ventilés 29,3 % contre 41,4 %.</p><p class="lab">Effets indésirables</p><p>Hyperglycémie, infections, délire, faiblesse musculaire, hémorragie digestive.</p><div class="key"><b>Limite.</b> DEXA-ARDS était ouvert et arrêté avant le recrutement prévu. La monographie suisse de la dexaméthasone injectable n’a pas pu être consultée ; la dose COVID-19 de 6 mg figure dans les informations professionnelles européennes consultées en résumé.</div><p class="src">Références : <a href="https://doi.org/10.1016/S2213-2600(19)30417-5" target="_blank" rel="noopener">Villar et al., Lancet Respir Med 2020;8:267-76</a> ; <a href="https://doi.org/10.1056/NEJMoa2021436" target="_blank" rel="noopener">RECOVERY, N Engl J Med 2021;384:693-704</a>.</p></template>
<template data-pop="j80-furosemide" data-title="Furosémide et conservation hydrique"><p class="lab">Mécanisme</p><p>Diurétique de l’anse qui bloque le cotransporteur sodium-potassium-chlorure de la branche ascendante de Henle ; la natriurèse réduit le volume circulant et la pression capillaire pulmonaire.</p><p class="lab">Place</p><p>Après la phase de choc, il aide à obtenir un bilan hydrique nul ou négatif, comme dans le protocole FACTT.</p><div class="key"><b>Surveillance.</b> Natrémie, kaliémie, créatinine, lactate et diurèse ; une hypoperfusion d’organe impose d’arrêter la déplétion. La dose s’individualise selon la fonction rénale et la réponse.</div></template>
<template data-pop="j80-train-quatre" data-title="Train-de-quatre"><p class="lab">Technique</p><p>Quatre stimulations électriques supramaximales sont appliquées au nerf ulnaire, à 0,5 seconde d’intervalle ; on compte les contractions de l’adducteur du pouce.</p><p class="lab">Lecture</p><p>Quatre réponses : blocage faible ; une à deux réponses : blocage profond suffisant dans la plupart des protocoles ; aucune réponse : surdosage possible.</p><div class="key"><b>Limite.</b> Œdème, hypothermie et neuropathie faussent la réponse ; la clinique, notamment l’absence d’asynchronie, complète la mesure.</div></template>
<template data-pop="pareto-j80-meca" data-title="Pareto — Définition, épidémiologie et mécanismes"><p class="ratio" data-cover="j80-0,j80-1,j80-2,j80-3"></p><ul><li>Le SDRA est un œdème lésionnel : la barrière rompue laisse fuir un liquide protéique malgré une pression capillaire normale.</li><li>Berlin : délai ≤ 1 semaine, opacités bilatérales, origine non exclusivement cardiaque, PaO₂/FiO₂ ≤ 300 sous PEP ≥ 5 ; léger, modéré, sévère aux seuils 300, 200 et 100.</li><li>La définition globale ajoute le haut débit ≥ 30 L/min, le rapport SpO₂/FiO₂ ≤ 315 et l’échographie.</li><li>Un ventilé sur quatre ; mortalité de 35 à 46 % ; un syndrome méconnu est sous-traité.</li><li>Phases exsudative, proliférative puis, parfois, fibrotique ; « baby lung » petit et peu compliant ; shunt réfractaire à l’oxygène ; lésions induites par la ventilation.</li></ul></template>
<template data-pop="pareto-j80-clin" data-title="Pareto — Causes, anamnèse et examen"><p class="ratio" data-cover="j80-4,j80-5,j80-6"></p><ul><li>Causes directes (pneumonie, inhalation) et indirectes (sepsis, pancréatite, transfusion, traumatisme) ; la cause se traite en priorité.</li><li>Dégradation dans la semaine suivant l’agression ; une histoire cardiaque ou un début lent font douter.</li><li>Fréquence &gt; 30 par minute, SpO₂ &lt; 90 % sous haut débit ou choc : soins intensifs.</li><li>Mesurer la taille pour calculer le poids prédit.</li></ul></template>
<template data-pop="pareto-j80-diag" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="j80-7"></p><ul><li>Critères réunis, origine cardiaque exclue par échocardiographie, cause identifiée.</li><li>Sans cause, rechercher une maladie imitatrice par tomodensitométrie et lavage : hémorragie alvéolaire, pneumopathie à éosinophiles, fibrose, toxicité médicamenteuse.</li><li>L’œdème cardiogénique est le différentiel le plus fréquent et le plus vite traitable.</li></ul></template>
<template data-pop="pareto-j80-tt" data-title="Pareto — Gravité et prise en charge"><p class="ratio" data-cover="j80-8,j80-9"></p><ul><li>Ne pas retarder l’intubation d’un patient qui s’épuise ; rechercher pneumothorax et cœur pulmonaire aigu devant une dégradation brutale.</li><li>6 mL/kg de poids prédit, plateau ≤ 30, pression motrice ≤ 15 cm H₂O, hypercapnie permissive.</li><li>Décubitus ventral précoce ≥ 16 heures si PaO₂/FiO₂ &lt; 150 (PROSEVA) ; pas de recrutement prolongé.</li><li>Bilan hydrique restrictif après le choc ; ECMO dans un centre selon les critères EOLIA.</li><li>Corticoïdes et curares : décision individuelle, sources divergentes ; traitement de la cause toujours.</li></ul></template>
<template data-pop="pareto-j80-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="j80-10,j80-11,j80-12"></p><ul><li>Séquelles dominées par la faiblesse musculaire et les troubles psychiques ; fonction respiratoire souvent proche de la normale.</li><li>Grossesse : hypercapnie à limiter ; obésité : poids prédit ; enfant : PALICC-2 ; nouveau-né : P22.0.</li><li>Critères formels et paramètres clés de l’îlot 12.</li></ul></template>
<template data-pop="pareto-j80-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j80-e-1,j80-e-2"></p><ul><li>Aucun examen de référence clinique ; gazométrie pour l’hypoxémie, imagerie pour la bilatéralité, échocardiographie pour exclure l’origine cardiaque.</li><li>Rapport PaO₂/FiO₂ avec FiO₂ connue et PEP notée ; SpO₂/FiO₂ seulement si SpO₂ ≤ 97 %.</li><li>Compliance = volume courant / pression motrice ; une compliance basse reflète le petit poumon aéré.</li><li>Lignes B hétérogènes et plèvre irrégulière orientent vers un œdème lésionnel.</li></ul></template>
<template data-pop="pareto-j80-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j80-p-1,j80-p-2,j80-p-3"></p><ul><li>Aucun médicament ne répare la barrière ; le traitement de la cause est toujours indiqué.</li><li>Cisatracurium 3 µg/kg/min ou schéma ACURASYS sur 48 heures, toujours sous sédation profonde et train-de-quatre.</li><li>Dexaméthasone 20 puis 10 mg sur 10 jours (DEXA-ARDS) ; 6 mg dans la COVID-19.</li><li>Monoxyde d’azote, bêta-2 agonistes, statines et surfactant : pas de bénéfice de survie.</li></ul></template>
