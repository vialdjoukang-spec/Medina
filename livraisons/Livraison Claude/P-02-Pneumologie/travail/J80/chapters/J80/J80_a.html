<h1>Syndrome de détresse respiratoire aiguë</h1><span class="status">Adulte · formes pédiatriques en renvoi · rédaction du 08.10.2026 · référentiels ESICM 2023, ATS 2024, SCCM 2024, définition globale 2023</span></div>

<section class="ilot" id="j80-0"><h2><span class="n">0</span>Question clinique et objectifs</h2><p>Un homme de 58 ans est hospitalisé pour une pneumonie à pneumocoque. Au troisième jour, sa fréquence respiratoire atteint 36 par minute ; sous oxygène nasal à haut débit à 50 L/min et une fraction inspirée d’oxygène de 0,6, sa saturation plafonne à 89 %. La radiographie montre des opacités dans les deux poumons, et l’échocardiographie trouve un ventricule gauche normal. <b>Ce patient ne souffre plus seulement d’une pneumonie : son poumon entier est devenu perméable, et chaque décision ventilatoire peut désormais l’aggraver ou le protéger.</b></p><p>Le syndrome de détresse respiratoire aiguë, ou SDRA, est un œdème pulmonaire lésionnel. La barrière qui sépare l’air du sang se rompt ; un liquide riche en protéines envahit les alvéoles ; l’oxygène ne passe plus. Il ne s’agit pas d’une maladie unique, mais d’une voie finale commune à des agressions très diverses, pulmonaires ou générales.</p><p>Quatre compétences en découlent. Le médecin doit reconnaître le syndrome tôt, selon une définition explicite. Il doit éliminer l’œdème d’origine cardiaque, qui se traite tout autrement. Il doit appliquer une ventilation qui épargne le poumon restant et mobiliser à temps les mesures qui réduisent la mortalité. Il doit enfin traiter la cause, sans laquelle aucune mesure de support ne suffit. <button class="w" data-k="j80-q-decisions">Les quatre décisions devant une hypoxémie bilatérale aiguë (ordre et raison)</button>.</p><div class="key"><b>À retenir.</b> Le SDRA est une réponse lésionnelle stéréotypée du poumon. Le reconnaître change immédiatement la manière de ventiler. La définition, qui fixe le moment de cette reconnaissance, ouvre l’îlot suivant.</div></section>
<section class="ilot" id="j80-1"><h2><span class="n">1</span>Définition, classifications et codage</h2><p>La <b>définition de Berlin</b>, publiée en 2012 sous l’égide de l’ESICM, de l’ATS et de la SCCM, a longtemps servi de référence. Elle exige quatre éléments : un début dans la semaine qui suit une agression connue ou une aggravation respiratoire ; des opacités bilatérales non expliquées par un épanchement, une atélectasie ou des nodules ; une insuffisance respiratoire non entièrement expliquée par une défaillance cardiaque ou une surcharge hydrique ; une hypoxémie mesurée sous une pression expiratoire positive (PEP) d’au moins 5 cm H₂O. Le rapport entre la pression artérielle en oxygène et la fraction inspirée, noté PaO₂/FiO₂, définit trois degrés de gravité.</p><table class="t"><tr><th>Degré de gravité</th><th>PaO₂/FiO₂ (mmHg), PEP ≥ 5 cm H₂O</th><th>SpO₂/FiO₂ si SpO₂ ≤ 97 % (définition globale)</th><th>Mortalité hospitalière (Berlin 2012)</th></tr><tr><td>Léger</td><td>&gt; 200 et ≤ 300</td><td>&gt; 235 et ≤ 315</td><td>27 %</td></tr><tr><td>Modéré</td><td>&gt; 100 et ≤ 200</td><td>&gt; 148 et ≤ 235</td><td>32 %</td></tr><tr><td>Sévère</td><td>≤ 100</td><td>≤ 148</td><td>45 %</td></tr></table><p>Le tableau se lit d’abord par la colonne de gauche : plus le rapport est bas, plus l’oxygène franchit mal la barrière et plus la mortalité s’élève. Un patient intubé dont la PaO₂ vaut 75 mmHg sous une FiO₂ de 0,5 présente un rapport de 150 : il relève du degré modéré. L’erreur fréquente consiste à calculer ce rapport sans noter la PEP ni la FiO₂ réellement délivrée ; le chiffre perd alors toute valeur de classement.</p><p>La <button class="w" data-k="j80-definition-globale">nouvelle définition globale de 2023 (ce qui change et pourquoi)</button>, publiée par Matthay et coll. en 2024, étend Berlin sans le renier. Elle admet le patient non intubé sous oxygène nasal à haut débit d’au moins 30 L/min ; elle accepte le rapport SpO₂/FiO₂ lorsque la saturation ne dépasse pas 97 % ; elle reconnaît l’échographie pulmonaire comme imagerie ; elle supprime l’exigence de PEP et de débit dans les contextes aux ressources limitées. <button class="w" data-k="j80-contentieux-definition">Berlin ou définition globale : laquelle appliquer (arbitrage des sources)</button>.</p><p>Le codage suit la CIM-10-GM 2024. La catégorie J80 regroupe le SDRA de toute personne âgée d’un an ou plus ; le cinquième caractère de J80.0- code la gravité selon Berlin chez l’adulte et selon les critères pédiatriques de la PALICC entre un et dix-huit ans. <button class="w" data-k="j80-codage">Les codes J80.01 à J80.09 et l’exclusion du nouveau-né (lecture)</button>.</p><div class="key"><b>À retenir.</b> Le diagnostic repose sur quatre critères : délai, imagerie bilatérale, origine non cardiaque, hypoxémie chiffrée sous un support défini. La gravité se classe par le rapport PaO₂/FiO₂, ou SpO₂/FiO₂ dans la définition globale. Il faut ensuite situer ce syndrome dans sa fréquence et son pronostic.</div><p class="src">Références : <a href="https://doi.org/10.1001/jama.2012.5669" target="_blank" rel="noopener">ARDS Definition Task Force, définition de Berlin, JAMA 2012</a> ; <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et al., définition globale, Am J Respir Crit Care Med 2024</a>.</p></section>
<section class="ilot" id="j80-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>L’étude internationale <button class="w" data-k="j80-lung-safe">LUNG SAFE (459 unités, 50 pays, 2014)</button> fournit les données européennes les plus solides. Le SDRA y concernait 10,4 % des admissions en soins intensifs et 23,4 % des patients ventilés mécaniquement. La mortalité hospitalière atteignait 34,9 % dans les formes légères, 40,3 % dans les formes modérées et 46,1 % dans les formes sévères.</p><p>La même étude révèle un défaut de reconnaissance : les cliniciens n’identifiaient le syndrome que dans 51,3 % des formes légères et 78,5 % des formes sévères. Or la reconnaissance conditionne le traitement : moins des deux tiers des patients recevaient un volume courant d’au plus 8 mL/kg de poids prédit, et seuls 16,3 % des formes sévères étaient placés en décubitus ventral. Un syndrome méconnu est donc un syndrome sous-traité.</p><p>Aucune donnée suisse d’incidence du SDRA n’a été retrouvée dans une source publiée et vérifiable. Les chiffres internationaux s’appliquent avec prudence aux unités suisses, dont l’organisation et l’accès à l’oxygénation extracorporelle diffèrent.</p><div class="key"><b>À retenir.</b> Un patient ventilé sur quatre remplit les critères du SDRA ; près d’un sur deux meurt dans les formes sévères. La sous-reconnaissance est la première cause évitable de sous-traitement. La compréhension du mécanisme justifie chacune des mesures qui suivent.</div><p class="src">Références : <a href="https://doi.org/10.1001/jama.2016.0291" target="_blank" rel="noopener">Bellani et al., LUNG SAFE, JAMA 2016</a>.</p></section>
<section class="ilot" id="j80-3"><h2><span class="n">3</span>Physiopathologie</h2><h3>La barrière normale</h3><p>L’alvéole sèche est une condition de l’échange gazeux. Sa paroi très mince associe l’épithélium alvéolaire, une membrane basale fusionnée et l’endothélium capillaire. Les <button class="w" data-k="j80-pneumocytes">pneumocytes de type I et de type II (rôles distincts)</button> forment un épithélium étanche ; le type II sécrète le <button class="w" data-k="j80-surfactant">surfactant (tension superficielle et stabilité alvéolaire)</button> et réabsorbe activement le sodium, que l’eau suit. Le peu de liquide qui filtre vers l’interstitium est drainé par les lymphatiques ; l’alvéole reste sèche.</p><h3>La lésion : deux barrières rompues</h3><p>Une agression directe (germe, acide gastrique) frappe d’abord l’épithélium ; une agression indirecte (sepsis, pancréatite) atteint d’abord l’endothélium par voie sanguine. Dans les deux cas, les <button class="w" data-k="j80-neutrophiles">polynucléaires neutrophiles activés (protéases, radicaux, pièges extracellulaires)</button> et les cytokines élargissent les jonctions cellulaires et tuent des pneumocytes. Un <button class="w" data-k="j80-oedeme-lesionnel">œdème riche en protéines (pourquoi il diffère de l’œdème cardiogénique)</button> inonde alors les alvéoles, malgré une pression capillaire normale. Les protéines plasmatiques inactivent le surfactant, et la perte des pneumocytes de type II empêche de le renouveler.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Alvéole normale et alvéole lésée du syndrome de détresse respiratoire aiguë" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><circle cx="170" cy="105" r="70"/><circle cx="510" cy="105" r="70"/><path d="M60 190h220M400 190h220"/><path d="M60 200h220M400 200h220" stroke-dasharray="4 3"/><path d="M455 75q55-25 110 0" stroke-width="5"/><path d="M445 120h130M450 140h120M460 158h100" stroke-dasharray="2 4"/></g><g fill="#222"><circle cx="470" cy="190" r="5"/><circle cx="520" cy="196" r="5"/><circle cx="565" cy="190" r="5"/><circle cx="505" cy="150" r="4"/><text x="105" y="22">Alvéole normale</text><text x="420" y="22">Alvéole lésée (phase exsudative)</text><text x="120" y="110">air, surfactant</text><text x="460" y="68">membrane hyaline</text><text x="455" y="112">œdème riche en protéines</text><text x="75" y="222">capillaire étanche</text><text x="400" y="222">capillaire perméable, neutrophiles</text></g></svg><figcaption>Figure 1 — L’alvéole normale est sèche et stabilisée par le surfactant. L’alvéole lésée est inondée d’un liquide protéique, bordée de membranes hyalines et envahie de neutrophiles. Schéma pédagogique original, non à l’échelle.</figcaption></figure><h3>Trois phases</h3><p>La <b>phase exsudative</b> occupe environ la première semaine : œdème, nécrose épithéliale et <button class="w" data-k="j80-membranes-hyalines">membranes hyalines (dommage alvéolaire diffus)</button>. La <b>phase proliférative</b>, de la deuxième à la troisième semaine, voit les pneumocytes de type II proliférer pour recouvrir la membrane basale et réabsorber l’œdème. Une <b>phase fibrotique</b> survient chez une minorité de patients : la réparation désordonnée dépose du collagène, rigidifie le poumon et prolonge la ventilation. Ces délais sont des repères moyens ; les phases se chevauchent d’un territoire à l’autre.</p><h3>Le « baby lung » et ses conséquences</h3><p>Le poumon n’est pas atteint de façon homogène. La tomodensitométrie montre des zones déclives densifiées, des zones intermédiaires recrutables et une partie aérée réduite. <button class="w" data-k="j80-baby-lung">Le poumon fonctionnel a la taille d’un poumon d’enfant (concept de Gattinoni)</button> : il reste petit, mais d’élasticité presque normale. La compliance, c’est-à-dire le volume obtenu par cm H₂O de pression, baisse parce que le volume aéré diminue. Ainsi, un volume courant « normal » de 500 mL distend un poumon fonctionnel de quelques centaines de grammes. Les alvéoles inondées mais perfusées créent un <button class="w" data-k="j80-shunt">effet shunt (pourquoi l’oxygène corrige mal l’hypoxémie)</button>.</p><p>La ventilation mécanique, indispensable, peut elle-même léser le poumon. La surdistension des zones aérées, l’ouverture et la fermeture cycliques des zones instables et la libération de médiateurs dans le sang constituent les <button class="w" data-k="j80-vili">lésions induites par la ventilation (volotraumatisme, atélectraumatisme, biotraumatisme)</button>. Toute la stratégie ventilatoire du SDRA découle de ce constat.</p><div class="key"><b>À retenir.</b> Le SDRA associe une barrière perméable, un œdème protéique, une perte de surfactant et un poumon fonctionnel réduit. L’hypoxémie vient du shunt ; la baisse de compliance vient de la petite taille du poumon aéré. La ventilation doit respecter ce petit poumon. Les causes qui déclenchent cette cascade sont présentées ensuite.</div><p class="src">Références : <a href="https://doi.org/10.1038/s41572-019-0069-0" target="_blank" rel="noopener">Matthay et al., Nat Rev Dis Primers 2019</a> ; <a href="https://doi.org/10.1007/s00134-005-2627-z" target="_blank" rel="noopener">Gattinoni et Pesenti, « baby lung », Intensive Care Med 2005</a>.</p><button class="pareto-btn ui" data-k="pareto-j80-meca">▲ Loi de Pareto — Définition, épidémiologie et mécanismes</button></section>
<section class="ilot" id="j80-4"><h2><span class="n">4</span>Causes directes et indirectes</h2><p>Le SDRA ne survient jamais seul : un facteur déclenchant le précède. La distinction entre causes directes et indirectes indique la porte d’entrée de la lésion. Elle oriente aussi la recherche de la cause, dont le traitement reste prioritaire.</p><table class="t"><tr><th>Mécanisme</th><th>Causes principales</th><th>Cible initiale</th></tr><tr><td>Direct (pulmonaire)</td><td><button class="w" data-k="j80-pneumonie-cause">Pneumonie bactérienne ou virale</button>, inhalation de contenu gastrique, inhalation de fumées ou de gaz toxiques, contusion pulmonaire, noyade, lésion de reperfusion après transplantation</td><td>Épithélium alvéolaire</td></tr><tr><td>Indirect (extrapulmonaire)</td><td><button class="w" data-k="j80-sepsis-cause">Sepsis d’origine extrapulmonaire</button>, traumatisme grave et choc, pancréatite aiguë, brûlures étendues, <button class="w" data-k="j80-trali">transfusion (lésion pulmonaire aiguë post-transfusionnelle)</button>, surdosage médicamenteux</td><td>Endothélium capillaire</td></tr></table><p>Le tableau se lit en partant du patient : une toux fébrile précédant la dégradation oriente vers une cause directe ; une hypoxémie survenue deux jours après une pancréatite oriente vers une cause indirecte. La pneumonie et le sepsis dominent largement dans LUNG SAFE. L’erreur fréquente consiste à oublier une transfusion des six heures précédentes ou une inhalation passée inaperçue chez un patient au niveau de conscience altéré.</p><p>Plusieurs facteurs augmentent le risque ou la gravité : consommation chronique d’alcool, choc, transfusions multiples, âge avancé. L’association de plusieurs agressions, par exemple pneumonie et choc septique, accroît encore le risque.</p><div class="key"><b>À retenir.</b> Chercher la cause est une partie du traitement : une pneumonie se traite par antibiotique, un foyer septique par drainage, une inhalation par la protection des voies aériennes. L’anamnèse doit retrouver cette cause et dater le début.</div><p class="src">Références : <a href="https://doi.org/10.1001/jama.2016.0291" target="_blank" rel="noopener">Bellani et al., LUNG SAFE, JAMA 2016</a> ; <a href="https://doi.org/10.1038/s41572-019-0069-0" target="_blank" rel="noopener">Matthay et al., 2019</a>.</p></section>
<section class="ilot" id="j80-5"><h2><span class="n">5</span>Anamnèse</h2><p>L’anamnèse poursuit deux buts : retrouver l’agression causale et la dater, puis rechercher une explication cardiaque ou une autre maladie qui imiterait le syndrome. Chez un patient trop dyspnéique pour parler, l’entourage, le dossier et les soignants fournissent l’essentiel.</p><p><b>Antécédents et contexte.</b> Le médecin recherche une <button class="w" data-k="j80-atcd-cardiaques">cardiopathie connue (risque d’œdème cardiogénique)</button>, une transfusion récente, une chimiothérapie ou un médicament pneumotoxique, une immunodépression, une exposition toxique et la consommation d’alcool. Il note aussi l’état fonctionnel antérieur et les volontés du patient, qui guideront l’intensité des soins.</p><p><b>Symptômes, par ordre de fréquence.</b> La <button class="w" data-k="j80-dyspnee">dyspnée d’aggravation rapide (mécanisme)</button> domine : elle s’installe en heures ou en quelques jours, toujours dans la semaine suivant l’agression. Les symptômes de la cause l’accompagnent : fièvre et toux dans une pneumonie, douleur abdominale dans une pancréatite. Une orthopnée ancienne, une prise de poids et des œdèmes des membres inférieurs orientent plutôt vers une origine cardiaque.</p><div class="two"><div class="card"><b>Forme typique.</b> Dyspnée croissante dans les 24 à 72 heures suivant une pneumonie ou un choc septique, hypoxémie réfractaire, infiltrats bilatéraux, sans argument cardiaque.</div><div class="card"><b>Formes trompeuses.</b> Hypoxémie apparaissant au cours d’une ventilation pour une autre cause ; dégradation après une transfusion ; début insidieux évoquant une pneumonie organisée ou une hémorragie alvéolaire ; patient sédaté sans plainte exprimée.</div></div><div class="key"><b>À retenir.</b> Le délai entre l’agression et la dégradation doit être inférieur à une semaine. Une histoire cardiaque ou un début lent doit faire douter. L’examen clinique mesure ensuite la gravité et cherche la cause.</div></section>
<section class="ilot" id="j80-6"><h2><span class="n">6</span>Examen clinique</h2><p>L’examen évalue d’abord la menace vitale, puis les arguments étiologiques. Il ne permet pas, seul, de distinguer un SDRA d’un œdème cardiogénique ; il oriente les examens qui trancheront.</p><div class="two"><div class="card"><b>État général et constantes.</b> <button class="w" data-k="j80-signes-lutte">Fréquence respiratoire et signes de lutte (épuisement prévisible)</button> ; <button class="w" data-k="j80-spo2-clinique">saturation pulsée sous oxygène (lecture et piège)</button> ; tachycardie, pression artérielle et signes d’hypoperfusion, car un sepsis ou un choc accompagne souvent le syndrome ; vigilance, car la confusion signale une hypoxémie sévère ou une hypercapnie.</div><div class="card"><b>Signes ciblés.</b> <button class="w" data-k="j80-auscultation">Crépitants diffus (valeur limitée)</button> ; absence de turgescence jugulaire, de reflux hépato-jugulaire et d’œdèmes déclives, qui rend une surcharge moins probable ; recherche du foyer causal : condensation, abdomen chirurgical, cathéter, peau ; poids et taille, indispensables pour calculer le <button class="w" data-k="j80-poids-predit">poids prédit (formule et piège de l’obésité)</button>.</div></div><p>La taille doit être mesurée, ou estimée par la longueur cubitale, dès l’admission. Elle détermine le réglage du volume courant ; le poids réel ne doit jamais servir à ce calcul.</p><div class="key"><b>À retenir.</b> Une fréquence respiratoire supérieure à 30 par minute, une SpO₂ inférieure à 90 % sous oxygène à haut débit ou des signes de choc imposent une prise en charge en soins intensifs. La taille mesurée prépare la ventilation protectrice. Le diagnostic s’établit alors par des critères explicites.</div><button class="pareto-btn ui" data-k="pareto-j80-clin">▲ Loi de Pareto — Causes, anamnèse et examen</button></section>
