<template data-pop="j80-q-decisions" data-title="Quatre décisions devant une hypoxémie bilatérale aiguë"><p class="lab">Ordre</p><p>Le médecin assure d’abord l’oxygénation et décide du lieu de soins. Il recherche ensuite une origine cardiaque, puis la cause du syndrome. Il choisit enfin la stratégie ventilatoire.</p><p class="lab">Raison de cet ordre</p><p>L’hypoxémie menace la vie en minutes ; l’œdème cardiogénique se traite tout autrement et vite ; la cause non traitée entretient la lésion ; la ventilation protectrice n’a de sens qu’une fois le diagnostic posé.</p><div class="key"><b>Limite.</b> Ces décisions sont simultanées chez le patient instable : l’échographie au lit répond souvent en quelques minutes aux deux premières.</div></template>
<template data-pop="j80-definition-globale" data-title="Définition globale du SDRA (2023)"><p class="lab">Origine</p><p>Une conférence de consensus de 32 experts (2021–2022) a étendu la définition de Berlin ; le texte a paru dans l’American Journal of Respiratory and Critical Care Medicine en janvier 2024.</p><p class="lab">Quatre changements</p><p>1) Le patient sous oxygène nasal à haut débit d’au moins 30 L/min peut être classé SDRA sans intubation. 2) Le rapport SpO₂/FiO₂ ≤ 315 remplace la gazométrie si la SpO₂ ne dépasse pas 97 %. 3) L’échographie pulmonaire devient une imagerie acceptée. 4) Dans les contextes aux ressources limitées, ni PEP ni débit minimal ne sont exigés.</p><p class="lab">Conséquence clinique</p><p>Le syndrome est reconnu plus tôt, avant l’intubation, ce qui permet d’anticiper la surveillance et l’orientation.</p><div class="key"><b>Limite.</b> Les auteurs demandent une validation prospective de sa fiabilité et de sa valeur pronostique. Les essais qui fondent les traitements ont inclus des patients définis par les critères antérieurs.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.202303-0558WS" target="_blank" rel="noopener">Matthay et al., Am J Respir Crit Care Med 2024;209:37-47</a>.</p></template>
<template data-pop="j80-contentieux-definition" data-title="Arbitrage : Berlin 2012 ou définition globale 2023"><p class="lab">Source retenue</p><p>La définition globale (Matthay, publiée en janvier 2024) est la source primaire la plus récente. Elle est retenue pour <b>reconnaître</b> le syndrome, notamment chez le patient non intubé sous haut débit.</p><p class="lab">Texte en vigueur plus ancien</p><p>La <a href="https://doi.org/10.1001/jama.2012.5669" target="_blank" rel="noopener">définition de Berlin (JAMA 2012)</a> reste celle du codage CIM-10-GM 2024 (cinquième caractère de J80.0-) et celle des grands essais thérapeutiques. Ses seuils de PaO₂/FiO₂ chez l’intubé sont identiques à ceux de la définition globale.</p><p class="lab">Relation entre les deux</p><p>La définition globale prolonge Berlin sans la contredire. L’ESICM 2023 a discuté la définition sans en faire une recommandation numérotée.</p><div class="key"><b>Conséquence pratique.</b> Le patient intubé se classe de la même façon par les deux textes. Le patient non intubé sous haut débit est un SDRA selon la définition globale ; il s’applique alors les traitements validés dans cette situation, comme le haut débit, et une surveillance de l’échec.</div></template>
<template data-pop="j80-codage" data-title="Codage CIM-10-GM 2024 du SDRA"><p class="lab">Codes</p><p>J80.0- est subdivisé par le cinquième caractère. Chez la personne de 18 ans ou plus : J80.01 léger, J80.02 modéré, J80.03 sévère selon Berlin. Entre 1 et moins de 18 ans : J80.04 léger, J80.05 modéré, J80.06 sévère selon la PALICC. J80.09 signifie gravité non précisée.</p><p class="lab">Exclusion</p><p>Le syndrome de détresse respiratoire du nouveau-né se code P22.0 : il relève d’un déficit de surfactant lié à la prématurité, et non d’une lésion inflammatoire.</p><div class="key"><b>Piège.</b> La gravité codée doit être celle mesurée sous PEP ≥ 5 cm H₂O ; un rapport calculé sous masque simple ne permet pas de coder la gravité.</div></template>
<template data-pop="j80-lung-safe" data-title="Étude LUNG SAFE (2014, publiée en 2016)"><p class="lab">Plan</p><p>Cohorte prospective de quatre semaines d’hiver 2014 dans 459 unités de soins intensifs de 50 pays ; 29 144 admissions analysées.</p><p class="lab">Résultats</p><p>Le SDRA touchait 10,4 % des admissions et 23,4 % des patients ventilés. Mortalité hospitalière : 34,9 % (léger), 40,3 % (modéré), 46,1 % (sévère). Reconnaissance clinique : 51,3 % à 78,5 % selon la gravité ; plateau mesuré chez 40,1 % ; décubitus ventral chez 16,3 % des formes sévères.</p><div class="key"><b>Limite.</b> Il s’agit d’un échantillon de convenance, sur une courte période, avec la définition de Berlin. Les pratiques ont pu évoluer depuis, notamment après la pandémie de COVID-19.</div><p class="src">Référence : <a href="https://doi.org/10.1001/jama.2016.0291" target="_blank" rel="noopener">Bellani et al., JAMA 2016;315:788-800</a>.</p></template>
<template data-pop="j80-pneumocytes" data-title="Pneumocytes de type I et de type II"><p class="lab">Type I</p><p>Cellules très aplaties qui couvrent environ 95 % de la surface alvéolaire ; elles assurent une distance de diffusion minimale et participent au transport de l’eau. Elles ne se divisent pas et meurent facilement lors d’une agression.</p><p class="lab">Type II</p><p>Cellules cuboïdes des angles alvéolaires : elles produisent le surfactant, pompent le sodium vers l’interstitium grâce aux canaux sodiques épithéliaux et à la pompe sodium-potassium, et régénèrent l’épithélium.</p><div class="key"><b>Conséquence clinique.</b> La clairance de l’œdème exige des pneumocytes de type II fonctionnels ; leur atteinte prolonge l’œdème et la durée de ventilation.</div></template>
<template data-pop="j80-surfactant" data-title="Surfactant : stabilité alvéolaire"><p class="lab">Définition</p><p>Film de phospholipides et de protéines qui tapisse l’alvéole et abaisse la tension superficielle à l’interface air-liquide.</p><p class="lab">Mécanisme</p><p>Selon la loi de Laplace, la pression de distension vaut deux fois la tension divisée par le rayon. Le surfactant réduit davantage la tension des petites alvéoles, ce qui égalise les pressions et empêche le collapsus en fin d’expiration.</p><p class="lab">Dans le SDRA</p><p>Les protéines de l’œdème l’inactivent, les enzymes des neutrophiles le dégradent, et la perte des pneumocytes de type II en tarit la production : les alvéoles se collabent.</p><div class="key"><b>Limite.</b> Le surfactant exogène, efficace chez le prématuré, n’a pas réduit la mortalité de l’adulte.</div></template>
<template data-pop="j80-neutrophiles" data-title="Polynucléaires neutrophiles et lésion alvéolaire"><p class="lab">Rôle normal</p><p>Les neutrophiles tuent les bactéries par phagocytose, protéases, radicaux oxygénés et pièges extracellulaires d’ADN.</p><p class="lab">Mécanisme lésionnel</p><p>Recrutés en masse par l’interleukine 8, ils libèrent ces armes dans l’espace alvéolaire. L’élastase dégrade les jonctions et la matrice ; les radicaux et les pièges extracellulaires lèsent l’endothélium et l’épithélium.</p><div class="key"><b>Conséquence.</b> Le lavage broncho-alvéolaire du SDRA est riche en neutrophiles. Leur nombre ne permet toutefois pas, seul, de distinguer une pneumonie d’un SDRA d’autre cause.</div></template>
<template data-pop="j80-oedeme-lesionnel" data-title="Œdème lésionnel et œdème hydrostatique"><p class="lab">Œdème hydrostatique</p><p>Dans l’insuffisance cardiaque, la pression capillaire pulmonaire s’élève ; une barrière intacte laisse filtrer un liquide pauvre en protéines.</p><p class="lab">Œdème lésionnel</p><p>Dans le SDRA, la barrière perméable laisse passer les protéines même à pression capillaire normale. Le liquide alvéolaire a alors une concentration protéique proche de celle du plasma.</p><p class="lab">Conséquence clinique</p><p>Le diurétique fait disparaître rapidement l’œdème hydrostatique ; il ne fait que limiter l’aggravation de l’œdème lésionnel, dont la résorption exige la réparation épithéliale.</p><div class="key"><b>Piège.</b> Les deux mécanismes coexistent souvent : un patient septique, cardiaque et abondamment rempli peut cumuler lésion et surcharge.</div></template>
<template data-pop="j80-membranes-hyalines" data-title="Membranes hyalines et dommage alvéolaire diffus"><p class="lab">Définition</p><p>Dépôts éosinophiles de fibrine et de protéines plasmatiques sur la membrane basale dénudée des alvéoles. Ils caractérisent le dommage alvéolaire diffus, lésion histologique de la phase exsudative.</p><p class="lab">Valeur</p><p>Dans une série de 356 autopsies de patients remplissant les critères de Berlin, ce dommage n’était présent que chez 45 % d’entre eux : 12 % des formes légères, 40 % des modérées, 58 % des sévères.</p><div class="key"><b>Conséquence.</b> Le SDRA clinique regroupe des lésions hétérogènes. Une maladie imitatrice traitable, comme une pneumonie à éosinophiles ou une hémorragie alvéolaire, doit être recherchée en l’absence de cause évidente.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.201211-1981OC" target="_blank" rel="noopener">Thille et al., Am J Respir Crit Care Med 2013;187:761-7</a>.</p></template>
<template data-pop="j80-baby-lung" data-title="Le « baby lung »"><p class="lab">Observation</p><p>La tomodensitométrie montre que le tissu normalement aéré d’un poumon de SDRA pèse souvent 300 à 500 g, soit la dimension du poumon d’un enfant de cinq à six ans.</p><p class="lab">Mécanisme</p><p>La compliance du système respiratoire est proportionnelle à ce volume aéré. Le poumon n’est donc pas surtout rigide : il est petit, et son élasticité intrinsèque reste presque normale. Le décubitus ventral déplace les densités, ce qui montre que ce petit poumon est fonctionnel et non anatomique.</p><div class="key"><b>Conséquence.</b> Le risque ne dépend pas du volume courant par kilogramme, mais du volume rapporté au poumon aéré. D’où l’intérêt de la pression motrice, qui intègre la compliance.</div><p class="src">Référence : <a href="https://doi.org/10.1007/s00134-005-2627-z" target="_blank" rel="noopener">Gattinoni et Pesenti, Intensive Care Med 2005;31:776-84</a>.</p></template>
<template data-pop="j80-shunt" data-title="Effet shunt dans le SDRA"><p class="lab">Mécanisme</p><p>Une alvéole inondée ou collabée reste perfusée sans être ventilée. Le sang qui la traverse garde la composition du sang veineux et dilue le sang oxygéné des alvéoles saines.</p><p class="lab">Conséquence</p><p>Augmenter la FiO₂ n’oxygène pas le sang qui ne rencontre jamais d’air : l’hypoxémie répond mal à l’oxygène. Ce qui la corrige, c’est le recrutement des alvéoles par la PEP ou leur redistribution par le décubitus ventral.</p><div class="key"><b>Renvoi.</b> Les cinq mécanismes de l’hypoxémie et leur réponse à l’oxygène sont développés dans le cours <a href="#/entry/J96">J96 — Insuffisance respiratoire aiguë et chronique</a>.</div></template>
<template data-pop="j80-vili" data-title="Lésions induites par la ventilation"><p class="lab">Volotraumatisme</p><p>Un volume excessif pour le petit poumon aéré étire les alvéoles au-delà de leur limite et rompt la barrière.</p><p class="lab">Atélectraumatisme</p><p>L’ouverture et la fermeture répétées d’alvéoles instables créent des forces de cisaillement aux zones de transition.</p><p class="lab">Biotraumatisme</p><p>L’étirement active la libération de cytokines, qui passent dans le sang et contribuent à la défaillance d’autres organes.</p><div class="key"><b>Conséquence.</b> Petit volume, plateau limité, pression motrice basse et PEP adaptée réduisent chacun l’une de ces lésions ; l’essai ARDSNet a montré l’effet sur la mortalité.</div></template>
<template data-pop="j80-pneumonie-cause" data-title="Pneumonie, première cause de SDRA"><p class="lab">Mécanisme</p><p>Le germe et la réponse inflammatoire lèsent directement l’épithélium alvéolaire ; la lésion peut s’étendre au-delà du foyer initial et gagner les deux poumons.</p><p class="lab">Conduite</p><p>Le prélèvement respiratoire et les hémocultures précèdent si possible l’antibiothérapie, sans la retarder. Les germes bactériens, la grippe et le SARS-CoV-2 sont les causes principales.</p><div class="key"><b>Renvoi.</b> Le choix de l’antibiotique relève du cours <a href="#/entry/J18">J18 — Pneumonie</a> ; la grippe, du cours <a href="#/entry/J09">J09 — Grippe</a>.</div></template>
<template data-pop="j80-sepsis-cause" data-title="Sepsis extrapulmonaire et SDRA"><p class="lab">Mécanisme</p><p>Les médiateurs inflammatoires circulants et les toxines microbiennes activent l’endothélium pulmonaire, premier lit capillaire traversé par le sang veineux. La perméabilité capillaire augmente avant que l’épithélium soit atteint.</p><p class="lab">Conduite</p><p>Le contrôle du foyer, par drainage ou chirurgie, et l’antibiothérapie précoce sont des traitements du SDRA. Le remplissage nécessaire au choc doit être réévalué dès la stabilisation.</p><div class="key"><b>Piège.</b> Un SDRA d’origine abdominale peut être pris pour une pneumonie : la radiographie bilatérale ne localise pas la cause.</div></template>
<template data-pop="j80-trali" data-title="Lésion pulmonaire aiguë post-transfusionnelle"><p class="lab">Définition</p><p>SDRA survenant dans les six heures suivant une transfusion, sans autre facteur de risque suffisant.</p><p class="lab">Mécanisme</p><p>Des anticorps anti-leucocytaires du donneur, ou des lipides bioactifs du produit stocké, activent les neutrophiles du receveur séquestrés dans les capillaires pulmonaires, souvent déjà amorcés par une maladie grave.</p><p class="lab">Conduite</p><p>Arrêt de la transfusion, support respiratoire, déclaration à l’hémovigilance pour exclure le donneur en cause.</p><div class="key"><b>Diagnostic différentiel.</b> La surcharge circulatoire post-transfusionnelle donne un œdème hydrostatique, avec hypertension et réponse au diurétique.</div></template>
<template data-pop="j80-atcd-cardiaques" data-title="Antécédents cardiaques et SDRA"><p class="lab">Pourquoi les rechercher</p><p>Une cardiopathie gauche, une valvulopathie ou une insuffisance rénale avec surcharge peuvent produire un œdème pulmonaire bilatéral qui imite le SDRA.</p><p class="lab">Piège</p><p>Une maladie cardiaque connue n’exclut pas le SDRA. La définition exige seulement que l’insuffisance cardiaque n’explique pas, à elle seule, l’œdème. Une pneumonie grave chez un cardiaque peut associer les deux mécanismes.</p><div class="key"><b>Conséquence.</b> L’échocardiographie, et non l’anamnèse seule, tranche la part cardiaque.</div></template>
<template data-pop="j80-dyspnee" data-title="Dyspnée du SDRA : mécanisme"><p class="lab">Mécanisme</p><p>L’œdème stimule les récepteurs interstitiels juxtacapillaires ; la baisse de compliance accroît le travail pour un même volume ; l’hypoxémie stimule les chémorécepteurs. Il en résulte une respiration rapide et superficielle.</p><p class="lab">Évolution</p><p>La dyspnée s’installe en heures ou en jours, dans la semaine suivant l’agression, et s’aggrave malgré l’oxygène.</p><div class="key"><b>Piège.</b> Le patient sédaté ou intubé pour une autre cause ne se plaint pas : seule la surveillance de la PaO₂/FiO₂ et de l’imagerie révèle alors le syndrome.</div></template>
<template data-pop="j80-signes-lutte" data-title="Fréquence respiratoire et signes de lutte"><p class="lab">Valeur normale</p><p>12 à 20 cycles par minute chez l’adulte au repos.</p><p class="lab">Mécanisme</p><p>Le poumon peu compliant impose de petits volumes ; le patient augmente la fréquence pour maintenir la ventilation minute. Tirage, respiration abdominale paradoxale et mise en jeu des muscles accessoires traduisent un travail excessif.</p><div class="key"><b>Conséquence.</b> Une fréquence supérieure à 30 par minute avec signes de lutte annonce l’épuisement musculaire : l’intubation doit être anticipée plutôt que subie.</div></template>
<template data-pop="j80-spo2-clinique" data-title="Saturation pulsée sous oxygène"><p class="lab">Technique</p><p>L’oxymètre de pouls estime la saturation artérielle à partir de l’absorption de deux longueurs d’onde par le sang pulsatile.</p><p class="lab">Lecture</p><p>Une SpO₂ de 92 % sous FiO₂ de 0,6 traduit une hypoxémie beaucoup plus grave que la même valeur à l’air ambiant. La saturation se note toujours avec la FiO₂ ou le débit délivré.</p><div class="key"><b>Piège.</b> Mauvaise perfusion, vasoconstricteurs, mouvement et pigmentation foncée de la peau peuvent fausser la mesure ; la gazométrie confirme lorsque la décision en dépend.</div></template>
<template data-pop="j80-auscultation" data-title="Auscultation dans le SDRA"><p class="lab">Signes</p><p>Des crépitants bilatéraux sont fréquents ; un souffle tubaire localise une condensation.</p><p class="lab">Valeur et limites</p><p>Les crépitants ne distinguent pas l’œdème lésionnel de l’œdème cardiogénique ni de la pneumonie. L’auscultation peut être pauvre malgré des opacités étendues, en particulier dans les zones dorsales du patient couché.</p><div class="key"><b>Conséquence.</b> L’auscultation oriente vers la cause ; l’échographie pulmonaire et l’imagerie documentent l’atteinte bilatérale.</div></template>
<template data-pop="j80-poids-predit" data-title="Poids prédit : formule et pièges"><p class="lab">Formule (ARDSNet)</p><p>Homme : 50 + 0,91 × (taille en cm − 152,4). Femme : 45,5 + 0,91 × (taille en cm − 152,4). Exemple : une femme de 165 cm a un poids prédit de 45,5 + 0,91 × 12,6 ≈ 57 kg ; 6 mL/kg donnent environ 340 mL.</p><p class="lab">Raison</p><p>La taille du poumon dépend de la taille du corps et du sexe, non du poids. Un patient obèse de 130 kg mesurant 170 cm a le poumon d’un individu d’environ 66 kg.</p><div class="key"><b>Piège.</b> Calculer le volume sur le poids réel entraîne une surdistension, surtout chez la femme petite et chez l’obèse. La taille doit être mesurée, non déclarée.</div></template>
<template data-pop="j80-gazometrie" data-title="Gazométrie artérielle dans le SDRA"><p class="lab">Rôle</p><p>Elle mesure la PaO₂, la PaCO₂ et le pH ; elle est la référence pour calculer le rapport PaO₂/FiO₂ et pour surveiller l’hypercapnie permissive.</p><p class="lab">Calcul</p><p>PaO₂ en mmHg divisée par la FiO₂ exprimée en fraction : 72 mmHg sous 0,8 donnent 90, soit un SDRA sévère. Si la PaO₂ est en kPa, il faut multiplier par 7,5 pour obtenir des mmHg.</p><div class="key"><b>Piège.</b> Le rapport n’a de valeur qu’avec une FiO₂ connue et une PEP notée ; il change avec la PEP et avec la position du patient.</div><p class="lab">Renvoi</p><p>La lecture complète de la gazométrie figure dans le cours <a href="#/entry/J96">J96 — Insuffisance respiratoire aiguë et chronique</a>.</p></template>
<template data-pop="j80-echo-pulmonaire" data-title="Échographie pulmonaire"><p class="lab">Signes</p><p>Les lignes B sont des artefacts verticaux nés d’une plèvre dont le poumon sous-jacent contient du liquide. Dans le SDRA, elles se répartissent de façon hétérogène, avec une ligne pleurale irrégulière, des consolidations sous-pleurales et des zones épargnées.</p><p class="lab">Valeur</p><p>La définition globale accepte des lignes B ou des consolidations bilatérales comme critère d’imagerie. L’examen se répète au lit et détecte aussi pneumothorax et épanchements.</p><div class="key"><b>Limite.</b> L’examen dépend de l’opérateur, et une formation est nécessaire. Des lignes B homogènes avec plèvre fine orientent plutôt vers un œdème cardiogénique.</div></template>
<template data-pop="j80-echocardiographie" data-title="Échocardiographie : exclure l’origine cardiaque"><p class="lab">Ce qu’elle cherche</p><p>Une dysfonction systolique ou diastolique gauche, une valvulopathie significative et des pressions de remplissage élevées orientent vers un œdème hydrostatique.</p><p class="lab">Ce qu’elle surveille</p><p>Une dilatation du ventricule droit avec septum paradoxal signe un cœur pulmonaire aigu, complication du SDRA.</p><div class="key"><b>Piège.</b> Un ventricule gauche altéré n’exclut pas le SDRA s’il ne suffit pas à expliquer l’œdème, par exemple chez un patient septique avec pneumonie.</div></template>
<template data-pop="j80-lba" data-title="Lavage broncho-alvéolaire"><p class="lab">Indications</p><p>Identifier le germe d’une pneumonie, rechercher une infection opportuniste, ou démasquer une maladie imitatrice lorsqu’aucune cause de SDRA n’est retrouvée.</p><p class="lab">Lecture</p><p>Neutrophiles prédominants dans le SDRA et la pneumonie ; éosinophiles &gt; 25 % dans la pneumonie aiguë à éosinophiles ; liquide de plus en plus hémorragique sur les aliquotes successives et sidérophages dans l’hémorragie alvéolaire.</p><div class="key"><b>Risque.</b> L’instillation aggrave transitoirement l’hypoxémie ; l’examen se réalise chez un patient intubé ou en conditions sécurisées, sous FiO₂ élevée.</div></template>
<template data-pop="j80-oedeme-cardiogenique" data-title="Œdème pulmonaire cardiogénique (J81)"><p class="lab">Mécanisme</p><p>L’élévation de la pression auriculaire gauche augmente la pression capillaire pulmonaire et force un liquide pauvre en protéines vers l’interstitium puis les alvéoles.</p><p class="lab">Arguments</p><p>Cardiopathie connue, orthopnée, hypertension, troisième bruit, cardiomégalie, épanchements bilatéraux, peptide natriurétique élevé, dysfonction gauche à l’échocardiographie, amélioration en heures sous diurétique et vasodilatateur.</p><div class="key"><b>Conséquence.</b> Ce diagnostic change le traitement : ventilation non invasive, dérivés nitrés et diurétiques. Le cours de l’insuffisance cardiaque appartient au fragment de cardiologie.</div></template>
<template data-pop="j80-hemorragie-alveolaire" data-title="Hémorragie intra-alvéolaire"><p class="lab">Mécanisme</p><p>Une capillarite, liée à une vascularite associée aux anticorps anti-cytoplasme des polynucléaires neutrophiles, à un anticorps anti-membrane basale ou à un lupus, ou un trouble de l’hémostase fait saigner les capillaires dans les alvéoles.</p><p class="lab">Indices</p><p>Hémoptysie inconstante, chute de l’hémoglobine, atteinte rénale associée, lavage de plus en plus rouge.</p><div class="key"><b>Conséquence.</b> Les immunosuppresseurs, voire les échanges plasmatiques, traitent la capillarite : ne pas la reconnaître prive le patient d’un traitement efficace.</div></template>
<template data-pop="j80-echec-non-invasif" data-title="Échec du support non invasif"><p class="lab">Signes</p><p>Fréquence respiratoire qui reste supérieure à 30 à 35 par minute, signes de lutte, SpO₂ qui ne se maintient pas malgré une FiO₂ élevée, troubles de conscience, instabilité hémodynamique, intolérance du dispositif.</p><p class="lab">Mécanisme du danger</p><p>Un effort inspiratoire violent crée de grandes variations de pression transpulmonaire et de volume, qui peuvent aggraver la lésion : c’est la lésion auto-infligée par le patient, hypothèse physiologique encore discutée.</p><div class="key"><b>Conduite.</b> La réévaluation se fait dans l’heure suivant l’instauration puis régulièrement. Les indices prédictifs d’échec sont détaillés dans le cours <a href="#/entry/J96">J96 — Insuffisance respiratoire aiguë et chronique</a>.</div></template>
<template data-pop="j80-coeur-pulmonaire" data-title="Cœur pulmonaire aigu"><p class="lab">Mécanisme</p><p>Vasoconstriction hypoxique et hypercapnique, microthromboses, compression capillaire par une pression intrathoracique élevée : la postcharge du ventricule droit augmente, et ce ventricule à paroi mince se dilate.</p><p class="lab">Diagnostic</p><p>Échocardiographie : ventricule droit dilaté, septum paradoxal, parfois chute de la pression artérielle.</p><div class="key"><b>Conduite.</b> Limiter la pression motrice, la PEP excessive et l’hypercapnie ; le décubitus ventral décharge le ventricule droit. Cette complication pèse sur le pronostic.</div></template>
<template data-pop="j80-ardsnet" data-title="Essai ARDSNet (2000)"><p class="lab">Question</p><p>Un volume courant réduit diminue-t-il la mortalité de la lésion pulmonaire aiguë et du SDRA ?</p><p class="lab">Plan et résultats</p><p>861 patients : 6 mL/kg de poids prédit et plateau ≤ 30 cm H₂O, contre 12 mL/kg et plateau ≤ 50 cm H₂O. Mortalité 31,0 % contre 39,8 % ; jours sans ventilation 12 contre 10. L’essai a été arrêté pour efficacité.</p><div class="key"><b>Limite.</b> Le groupe témoin recevait un volume supérieur à la pratique de certains centres de l’époque ; la recommandation actuelle tolère 4 à 8 mL/kg.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJM200005043421801" target="_blank" rel="noopener">ARDSNet, N Engl J Med 2000;342:1301-8</a>.</p></template>
<template data-pop="j80-driving-pressure" data-title="Pression motrice"><p class="lab">Définition</p><p>Pression de plateau moins PEP ; elle équivaut au volume courant divisé par la compliance du système respiratoire.</p><p class="lab">Preuve</p><p>Dans une analyse des données individuelles de 3 562 patients issus de neuf essais, la pression motrice était la variable ventilatoire la plus liée à la survie : une hausse d’environ 7 cm H₂O s’associait à un risque relatif de décès de 1,41.</p><div class="key"><b>Limite.</b> Il s’agit d’une association, non d’un essai randomisé de cible. La valeur ≤ 15 cm H₂O est un repère pratique ; elle n’est valable que chez le patient passif.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMsa1410639" target="_blank" rel="noopener">Amato et al., N Engl J Med 2015;372:747-55</a>.</p></template>
<template data-pop="j80-hypercapnie-permissive" data-title="Hypercapnie permissive"><p class="lab">Principe</p><p>Le petit volume courant réduit la ventilation alvéolaire ; on accepte une PaCO₂ élevée plutôt que d’augmenter le volume et de léser le poumon.</p><p class="lab">Limites</p><p>Un pH inférieur à environ 7,20 à 7,25 justifie d’augmenter la fréquence ou de réduire l’espace mort. L’hypercapnie est à éviter en cas d’hypertension intracrânienne, de cœur pulmonaire aigu et chez la femme enceinte.</p><div class="key"><b>Mécanisme du risque.</b> L’acidose hypercapnique dilate les vaisseaux cérébraux et contracte les vaisseaux pulmonaires, ce qui augmente la postcharge du ventricule droit.</div></template>
<template data-pop="j80-contentieux-pep" data-title="Arbitrage : PEP élevée ou basse"><p class="lab">Source la plus récente</p><p><a href="https://doi.org/10.1164/rccm.202311-2011ST" target="_blank" rel="noopener">ATS, janvier 2024</a> : suggère une PEP plus élevée, sans manœuvre de recrutement, dans le SDRA modéré à sévère (recommandation conditionnelle, certitude faible à modérée).</p><p class="lab">Source européenne en vigueur</p><p><a href="https://doi.org/10.1007/s00134-023-07050-7" target="_blank" rel="noopener">ESICM, juin 2023</a> : ne peut recommander ni pour ni contre une PEP élevée systématique (certitude élevée d’absence d’effet sur la mortalité), ni pour une titration guidée par la mécanique.</p><p class="lab">Relation</p><p>Les deux textes lisent les mêmes essais avec une pondération différente des sous-groupes modérés à sévères. La source la plus récente, ATS 2024, est retenue ; son niveau de preuve reste faible, ce qui autorise une PEP individualisée selon la réponse en oxygénation, la pression motrice et la tolérance hémodynamique.</p><div class="key"><b>Point d’accord.</b> Les deux sociétés recommandent fortement de ne pas réaliser de manœuvres de recrutement prolongées à haute pression.</div></template>
<template data-pop="j80-proseva" data-title="Essai PROSEVA (2013)"><p class="lab">Plan</p><p>466 patients avec PaO₂/FiO₂ &lt; 150 mmHg sous FiO₂ ≥ 0,6, PEP ≥ 5 cm H₂O et volume proche de 6 mL/kg ; décubitus ventral d’au moins 16 heures par séance, débuté précocement, contre décubitus dorsal.</p><p class="lab">Résultats</p><p>Mortalité à 28 jours 16,0 % contre 32,8 % ; à 90 jours 23,6 % contre 41,0 % ; complications non accrues, arrêts cardiaques plus fréquents en décubitus dorsal.</p><div class="key"><b>Limite.</b> Les centres étaient entraînés à la technique depuis plus de cinq ans ; les bénéfices supposent la même maîtrise. L’ESICM 2023 en tire une recommandation forte.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMoa1214103" target="_blank" rel="noopener">Guérin et al., N Engl J Med 2013;368:2159-68</a>.</p></template>
<template data-pop="j80-ventral-pratique" data-title="Décubitus ventral en pratique"><p class="lab">Mécanisme</p><p>En position ventrale, le poids du cœur et des viscères ne comprime plus les régions dorsales, qui contiennent la majorité des alvéoles. La ventilation devient plus homogène, la perfusion reste dorsale, le shunt diminue et les contraintes se répartissent.</p><p class="lab">Réalisation</p><p>Une équipe de quatre à cinq soignants retourne le patient en sécurisant la sonde, les cathéters et les drains ; les séances durent au moins 16 heures et se répètent tant que le rapport reste inférieur à 150 en décubitus dorsal.</p><div class="key"><b>Risques.</b> Escarres du visage et des genoux, extubation accidentelle, obstruction de la sonde, compression oculaire. Une instabilité majeure, une plaie thoracique ou abdominale ouverte et une fracture instable du rachis sont des contre-indications relatives.</div></template>
<template data-pop="j80-contentieux-curares" data-title="Arbitrage : curarisation continue"><p class="lab">Données</p><p><a href="https://doi.org/10.1056/NEJMoa1005372" target="_blank" rel="noopener">ACURASYS (2010)</a>, 340 patients, PaO₂/FiO₂ &lt; 150 : cisatracurium 48 heures, rapport de risque ajusté de décès à 90 jours 0,68. <a href="https://doi.org/10.1056/NEJMoa1901686" target="_blank" rel="noopener">ROSE (2019)</a>, 1 006 patients, PEP élevée et sédation légère dans le groupe témoin : mortalité 42,5 % contre 42,8 %, sans bénéfice.</p><p class="lab">Sources</p><p>ATS, janvier 2024 (la plus récente) : suggère les curares dans le SDRA sévère précoce (conditionnelle, certitude faible). ESICM, juin 2023 : recommande de ne pas utiliser de perfusion continue <b>systématique</b> (forte, certitude modérée).</p><p class="lab">Relation et choix</p><p>Les deux textes s’accordent pour refuser l’emploi systématique ; ils diffèrent sur l’usage ciblé. La position ATS 2024 est retenue pour une décision individuelle dans le SDRA sévère précoce avec asynchronie persistante malgré une sédation adaptée, pour une durée courte.</p><div class="key"><b>Limite.</b> ROSE a comparé la curarisation à une sédation légère, situation plus proche de la pratique actuelle qu’ACURASYS.</div></template>
<template data-pop="j80-factt" data-title="Essai FACTT (2006)"><p class="lab">Plan</p><p>1 000 patients avec lésion pulmonaire aiguë : stratégie hydrique conservatrice ou libérale pendant 7 jours, après la phase de choc.</p><p class="lab">Résultats</p><p>Bilan à 7 jours −136 mL contre +6 992 mL. Mortalité à 60 jours 25,5 % contre 28,4 %, différence non significative ; jours sans ventilation 14,6 contre 12,1 ; pas davantage de choc ni de dialyse.</p><div class="key"><b>Limite.</b> Les patients en choc étaient exclus du protocole hydrique tant que le choc persistait ; la restriction ne s’applique pas à la réanimation initiale.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMoa062200" target="_blank" rel="noopener">FACTT, N Engl J Med 2006;354:2564-75</a>.</p></template>
<template data-pop="j80-ecmo" data-title="ECMO veino-veineuse"><p class="lab">Principe</p><p>Une canule draine le sang veineux, une pompe le fait passer dans un oxygénateur à membrane qui fixe l’oxygène et extrait le CO₂, puis le sang retourne dans une veine centrale. Le poumon peut alors être ventilé au repos.</p><p class="lab">Critères EOLIA</p><p>PaO₂/FiO₂ &lt; 50 mmHg pendant plus de 3 heures, ou &lt; 80 mmHg pendant plus de 6 heures, ou pH &lt; 7,25 avec PaCO₂ ≥ 60 mmHg pendant plus de 6 heures, malgré une ventilation optimisée.</p><div class="key"><b>Organisation.</b> L’ESICM 2023 recommande cette technique dans un centre répondant à des standards définis (forte, certitude modérée). Le transfert se décide tôt. Hémorragie et thrombopénie sont les complications principales.</div></template>
<template data-pop="j80-eolia" data-title="Essai EOLIA (2018)"><p class="lab">Plan</p><p>249 patients avec SDRA très sévère, randomisés entre ECMO immédiate et traitement conventionnel, avec ECMO de sauvetage autorisée.</p><p class="lab">Résultats</p><p>Mortalité à 60 jours 35 % contre 46 % (risque relatif 0,76 ; intervalle de confiance 0,55 à 1,04 ; p = 0,09). 28 % du groupe témoin ont reçu une ECMO de sauvetage. Plus d’hémorragies transfusées, moins d’accidents vasculaires ischémiques sous ECMO.</p><div class="key"><b>Interprétation.</b> L’essai, arrêté pour futilité, ne démontre pas de bénéfice significatif ; le passage de nombreux témoins à l’ECMO a dilué l’effet. Une analyse bayésienne ultérieure et les méta-analyses suggèrent un bénéfice probable.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMoa1800385" target="_blank" rel="noopener">Combes et al., N Engl J Med 2018;378:1965-75</a>.</p></template>
<template data-pop="j80-contentieux-corticoides" data-title="Arbitrage : corticoïdes dans le SDRA"><p class="lab">Sources les plus récentes</p><p><a href="https://doi.org/10.1097/CCM.0000000000006172" target="_blank" rel="noopener">SCCM, janvier 2024</a> : recommandation conditionnelle d’administrer des corticoïdes aux patients critiques atteints de SDRA ; aucune recommandation sur la molécule, la dose ou la durée. <a href="https://doi.org/10.1164/rccm.202311-2011ST" target="_blank" rel="noopener">ATS, janvier 2024</a> : suggestion conditionnelle, certitude modérée.</p><p class="lab">Source européenne</p><p>L’ESICM 2023 limite son champ au support respiratoire non pharmacologique et ne se prononce pas.</p><p class="lab">Populations</p><p>COVID-19 sous oxygène : bénéfice établi de la dexaméthasone 6 mg (RECOVERY). Grippe : prudence, données observationnelles défavorables. Immunodépression et infection non contrôlée : balance à discuter.</p><div class="key"><b>Choix retenu.</b> SCCM et ATS 2024 sont les textes en vigueur ; la décision est individuelle, de préférence précoce, en surveillant glycémie et infections. Le schéma DEXA-ARDS est un exemple, pas une norme.</div></template>
<template data-pop="j80-sans-benefice" data-title="Traitements sans bénéfice de survie"><p class="lab">Monoxyde d’azote inhalé</p><p>Il dilate les vaisseaux des alvéoles ventilées et améliore l’oxygénation pendant environ 24 heures, sans réduire la mortalité ; un risque d’atteinte rénale a été signalé. Il garde une place de sauvetage transitoire.</p><p class="lab">Bêta-2 agonistes intraveineux</p><p>Proposés pour accélérer la clairance de l’œdème, ils ont augmenté la mortalité dans un essai britannique de 2012.</p><p class="lab">Statines et surfactant exogène</p><p>Les essais randomisés n’ont pas montré de bénéfice chez l’adulte.</p><div class="key"><b>Conséquence.</b> Une amélioration de l’oxygénation n’équivaut pas à un bénéfice de survie : seuls les critères cliniques des essais guident la pratique.</div></template>
<template data-pop="j80-pics" data-title="Syndrome post-soins intensifs"><p class="lab">Composantes</p><p>Faiblesse musculaire acquise, troubles cognitifs (mémoire, attention), anxiété, dépression et état de stress post-traumatique ; les proches peuvent aussi être atteints.</p><p class="lab">Mécanismes</p><p>Polyneuromyopathie de réanimation favorisée par l’inflammation, l’immobilité, les corticoïdes et les curares ; hypoxémie et délire pour la cognition ; expérience traumatique pour le psychisme.</p><div class="key"><b>Prévention.</b> Sédation légère, mobilisation précoce, prévention du délire, présence des proches, journal de réanimation et consultation de suivi.</div></template>
<template data-pop="j80-pression-oesophagienne" data-title="Pression œsophagienne et pression transpulmonaire"><p class="lab">Principe</p><p>Un ballonnet œsophagien estime la pression pleurale. La pression transpulmonaire, différence entre pression des voies aériennes et pression pleurale, est la contrainte réellement appliquée au poumon.</p><p class="lab">Intérêt</p><p>Chez l’obèse, une paroi lourde élève la pression pleurale : un plateau de 32 cm H₂O peut correspondre à une pression transpulmonaire acceptable, et une PEP plus élevée peut être nécessaire pour éviter le collapsus.</p><div class="key"><b>Limite.</b> Les essais de titration de la PEP guidée par cette mesure n’ont pas montré de bénéfice de survie ; la technique reste réservée aux équipes entraînées.</div></template>
