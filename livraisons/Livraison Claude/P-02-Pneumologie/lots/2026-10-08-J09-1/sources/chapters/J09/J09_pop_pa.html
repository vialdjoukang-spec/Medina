<template data-pop="j09-diag-clinique" data-title="Diagnostic clinique de la grippe et circulation virale"><p class="lab">Fonction et cible</p><p>Le diagnostic clinique estime la probabilité de grippe à partir des symptômes et du contexte épidémique, sans test.</p><p class="lab">Mécanisme de l’affirmation</p><p>La valeur prédictive positive d’un signe dépend de la fréquence de la maladie dans la population testée. Pendant une épidémie, la grippe représente une grande part des syndromes fébriles respiratoires ; la même association de signes devient donc plus probante. Dans les essais d’antiviraux menés en saison, l’association de fièvre et de toux apparues depuis moins de 48 heures avait une valeur prédictive positive de 79 % pour une grippe confirmée (Monto, 2000).</p><p class="lab">Conséquence clinique</p><p>En saison, un adulte à risque qui présente fièvre, toux et myalgies d’apparition brutale peut recevoir un antiviral sans confirmation. Hors saison, la même présentation impose un test avant d’attribuer les symptômes à la grippe.</p><div class="key"><b>Limite.</b> Chez le sujet âgé, la fièvre manque souvent et la valeur de ces critères baisse. La co-circulation du SARS-CoV-2 et du VRS diminue aussi la spécificité clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/11088084/" target="_blank" rel="noopener">Monto et al., Arch Intern Med 2000</a>.</p></template>
<template data-pop="j09-indication-test" data-title="Indications du test grippal"><p class="lab">Fonction et cible</p><p>Le test identifie le virus influenza dans un prélèvement respiratoire. Il n’est utile que s’il modifie une décision.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez le patient hospitalisé, un résultat positif oriente l’antiviral, l’isolement en chambre et le regroupement des patients. En établissement de soins, la confirmation des premiers cas déclenche les mesures de contrôle du foyer et la prophylaxie des résidents. Hors saison ou après une exposition animale, le test distingue une grippe d’une autre infection et peut révéler un virus zoonotique.</p><p class="lab">Conséquence clinique</p><p>L’IDSA 2018 recommande de tester les patients hospitalisés pour une maladie respiratoire aiguë pendant la saison grippale et les patients ambulatoires à risque lorsque le résultat change la conduite. Un adulte sain ambulatoire avec une grippe non compliquée n’a généralement pas besoin de test.</p><div class="key"><b>Limite.</b> Le traitement d’un patient grave n’attend jamais le résultat. L’OMS 2024 recommande de débuter l’antiviral immédiatement lorsque le résultat demande plus de 24 heures, puis de l’arrêter si le test est négatif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse des recommandations OMS 2024, 2025</a>.</p></template>
<template data-pop="j09-tests" data-title="Tests antigéniques et tests moléculaires"><p class="lab">Fonction et cible</p><p>Les tests antigéniques détectent la nucléoprotéine virale par immunochromatographie. Les tests moléculaires, dont la PCR, amplifient un segment de l’acide ribonucléique viral.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le test antigénique a besoin d’une grande quantité de protéine virale ; il manque les prélèvements pauvres en virus. L’amplification multiplie la cible et détecte de très faibles quantités. Dans la méta-analyse de Merckx (2017), la sensibilité groupée était d’environ 54 % pour les tests antigéniques rapides classiques, 80 % pour les tests antigéniques à lecture numérique et plus de 90 % pour les tests moléculaires rapides. La spécificité dépassait 98 % pour les trois familles.</p><p class="lab">Conséquence clinique</p><p>Un test positif est fiable. Un test antigénique négatif n’exclut pas la grippe chez un patient hospitalisé : la PCR est alors demandée. Le prélèvement nasopharyngé profond est le plus rentable ; chez le patient intubé, un prélèvement des voies respiratoires inférieures peut être positif alors que le nasopharynx est négatif.</p><div class="key"><b>Limite.</b> La positivité diminue après quatre à cinq jours de symptômes, car l’excrétion virale décroît. Une PCR peut rester positive après la guérison et ne prouve pas à elle seule la contagiosité.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28869986/" target="_blank" rel="noopener">Merckx et al., Ann Intern Med 2017</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-ddx-sepsis" data-title="Sepsis bactérien : le diagnostic à ne pas manquer"><p class="lab">Fonction et cible</p><p>Le sepsis est une dysfonction d’organe menaçant la vie, causée par une réponse dérégulée à une infection.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre, les frissons, les myalgies et le malaise sont produits par les cytokines de l’hôte ; ils ne distinguent pas un virus d’une bactérie. Une hypotension, des marbrures ou une confusion traduisent une hypoperfusion d’organe, rare dans une grippe non compliquée.</p><p class="lab">Conséquence clinique</p><p>Un patient fébrile avec un signe d’hypoperfusion reçoit des hémocultures puis un antibiotique sans attendre le test grippal. Une méningococcie, une pyélonéphrite ou une endocardite peuvent débuter comme un « syndrome grippal ». La prise en charge est détaillée dans <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>.</p><div class="key"><b>Limite.</b> La grippe elle-même peut provoquer un sepsis viral ; un test grippal positif n’exclut pas une infection bactérienne associée.</div></template>
<template data-pop="j09-ddx-pneumonie" data-title="Pneumonie bactérienne ou pneumonie grippale"><p class="lab">Fonction et cible</p><p>Une pneumonie est une infection du parenchyme pulmonaire qui altère l’échange gazeux.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un foyer de crépitants localisé, une matité ou un souffle tubaire traduisent un comblement alvéolaire. Une aggravation après quelques jours d’amélioration oriente vers une surinfection bactérienne ; une dyspnée progressive dès le début oriente vers une pneumonie virale.</p><p class="lab">Conséquence clinique</p><p>Le médecin recherche ces signes, mesure la saturation et demande une radiographie thoracique en cas de doute. L’évaluation de gravité et le choix de l’antibiotique suivent <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>.</p><div class="key"><b>Limite.</b> La procalcitonine et la CRP ne séparent pas de façon fiable une pneumonie virale d’une co-infection bactérienne ; une valeur basse ne suffit pas à suspendre un antibiotique chez un patient grave.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a>.</p></template>
<template data-pop="j09-ddx-covid" data-title="COVID-19 et grippe"><p class="lab">Fonction et cible</p><p>Le SARS-CoV-2 et le virus influenza infectent tous deux l’épithélium respiratoire et circulent souvent en même temps en hiver.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les deux infections déclenchent la même réponse interféron et cytokinique ; fièvre, toux et myalgies sont donc communes. La perte de l’odorat oriente vers la COVID-19, mais elle est devenue moins fréquente avec les variants récents.</p><p class="lab">Conséquence clinique</p><p>Chez un patient à risque ou hospitalisé, un test moléculaire multiplex distingue les deux virus, car les antiviraux et les règles d’isolement diffèrent. Une co-infection est possible et aggrave le pronostic.</p><div class="key"><b>Limite.</b> Aucun signe clinique isolé ne permet de trancher ; le test est nécessaire lorsque la décision en dépend.</div></template>
<template data-pop="j09-ddx-vrs" data-title="Virus respiratoire syncytial chez l’adulte"><p class="lab">Fonction et cible</p><p>Le VRS infecte l’épithélium bronchiolaire. Il est connu chez le nourrisson, mais il cause aussi des hospitalisations chez l’adulte âgé et chez l’insuffisant cardiaque ou respiratoire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte des petites voies aériennes provoque des sifflements et une obstruction ; la fièvre est souvent plus modérée que dans la grippe. Chez le sujet âgé, la décompensation cardiaque ou respiratoire peut dominer le tableau.</p><p class="lab">Conséquence clinique</p><p>Le diagnostic repose sur le test moléculaire. Il évite un antiviral grippal inutile et oriente la prévention : un vaccin contre le VRS est recommandé chez certains adultes âgés selon le Plan de vaccination suisse 2026.</p><div class="key"><b>Limite.</b> L’adulte ne dispose pas d’antiviral spécifique couramment recommandé contre le VRS ; le traitement est symptomatique et vise les décompensations.</div></template>
<template data-pop="j09-gravite" data-title="Signes de gravité de la grippe"><p class="lab">Fonction et cible</p><p>Les signes de gravité repèrent une défaillance respiratoire, circulatoire ou neurologique qui exige une surveillance hospitalière.</p><p class="lab">Mécanisme de l’affirmation</p><p>Selon la Société suisse d’infectiologie, une saturation inférieure à 92 % en air ambiant est un signal d’alarme. Elle indique que l’oxygénation artérielle se rapproche de la partie pentue de la courbe de dissociation de l’hémoglobine : une faible baisse supplémentaire de la pression partielle en oxygène fait alors chuter la saturation. Une fréquence respiratoire de 30 par minute ou plus traduit un travail respiratoire élevé, critère retenu dans le score CURB-65. Une hypotension et une confusion signalent une hypoperfusion d’organe.</p><p class="lab">Conséquence clinique</p><p>Ces patients sont évalués à l’hôpital. Ils reçoivent de l’oseltamivir immédiatement, une radiographie thoracique, une gazométrie si l’oxygénation est altérée et une recherche de surinfection.</p><div class="key"><b>Limite.</b> Chez le patient atteint de bronchopneumopathie chronique obstructive, la saturation habituelle peut être plus basse ; c’est la baisse par rapport à la valeur de base qui compte. Un sujet âgé peut être grave sans fièvre.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://ssi.guidelines.ch/guideline/3007/fr" target="_blank" rel="noopener">Société suisse d’infectiologie, infection respiratoire aiguë</a>.</p></template>
<template data-pop="j09-pneumonie-virale" data-title="Pneumonie virale primaire"><p class="lab">Fonction et cible</p><p>Les pneumocytes de type I assurent l’échange gazeux ; les pneumocytes de type II produisent le surfactant et régénèrent l’épithélium.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus atteint les alvéoles, infecte et détruit les pneumocytes, puis déclenche une inflammation intense. Les alvéoles se remplissent d’un exsudat riche en protéines. La perfusion de ces territoires non ventilés crée un effet shunt et une hypoxémie peu corrigée par l’oxygène.</p><p class="lab">Conséquence clinique</p><p>La dyspnée progresse dès les premiers jours, la radiographie montre des opacités bilatérales et l’auscultation peut être pauvre. Le patient nécessite oxygène, antiviral immédiat et surveillance intensive.</p><div class="key"><b>Limite.</b> La distinction avec une co-infection bactérienne précoce est difficile ; l’antibiothérapie est souvent débutée d’emblée chez le patient grave, puis réévaluée.</div></template>
<template data-pop="j09-sdra" data-title="Syndrome de détresse respiratoire aiguë grippal"><p class="lab">Fonction et cible</p><p>La barrière alvéolocapillaire sépare l’air alvéolaire du sang et empêche le passage du liquide plasmatique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’agression virale et la réponse inflammatoire lèsent l’épithélium et l’endothélium. Un œdème lésionnel, non cardiogénique, remplit les alvéoles ; le surfactant est inactivé, la compliance pulmonaire chute et l’hypoxémie devient sévère.</p><p class="lab">Conséquence clinique</p><p>Le patient relève des soins intensifs : ventilation protectrice, décubitus ventral si l’hypoxémie est sévère, et oxygénation par membrane extracorporelle (ECMO) dans les formes réfractaires, comme pendant la pandémie de 2009.</p><div class="key"><b>Limite.</b> Le SDRA grippal n’a pas de traitement spécifique autre que l’antiviral ; les corticostéroïdes ne sont pas recommandés par l’OMS 2024 pour la grippe grave.</div></template>
<template data-pop="j09-surinfection-pec" data-title="Surinfection bactérienne après grippe"><p class="lab">Fonction et cible</p><p>L’épithélium cilié et le mucus éliminent les bactéries inhalées ; les macrophages alvéolaires les phagocytent.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus détruit l’épithélium cilié et expose la membrane basale, sur laquelle les bactéries adhèrent. La neuraminidase virale clive les acides sialiques et démasque des récepteurs bactériens. La réponse interféron diminue temporairement l’efficacité des macrophages et des neutrophiles. Les études des poumons de 1918 montrent qu’une pneumonie bactérienne était présente dans la grande majorité des décès (Morens, 2008).</p><p class="lab">Conséquence clinique</p><p>Les germes principaux sont Streptococcus pneumoniae, Staphylococcus aureus et Streptococcus pyogenes. Le staphylocoque producteur de toxine nécrosante cause des pneumonies nécrosantes avec hémoptysie et choc chez des adultes jeunes. Une fièvre qui réapparaît après amélioration impose un examen et une radiographie.</p><div class="key"><b>Limite.</b> La chronologie typique n’est pas absolue : une co-infection peut être présente dès l’admission.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/18710327/" target="_blank" rel="noopener">Morens et al., J Infect Dis 2008</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-decompensation-pec" data-title="Décompensation des maladies chroniques"><p class="lab">Fonction et cible</p><p>Les réserves cardiaques, respiratoires et métaboliques permettent de faire face à une augmentation brutale de la demande.</p><p class="lab">Mécanisme de l’affirmation</p><p>La fièvre augmente la consommation d’oxygène et la fréquence cardiaque. L’inflammation systémique favorise la rétention hydrosodée, la vasoconstriction pulmonaire hypoxique et l’instabilité de la plaque coronaire. Chez le diabétique, les hormones de stress augmentent la glycémie et peuvent déclencher une acidocétose. L’inflammation bronchique aggrave l’obstruction d’un asthme ou d’une bronchopneumopathie chronique obstructive.</p><p class="lab">Conséquence clinique</p><p>Une grippe chez un insuffisant cardiaque se présente souvent comme une décompensation cardiaque. Le médecin traite la grippe et la décompensation : voir <a href="#/entry/I50">I50 — Insuffisance cardiaque</a>, <a href="#/entry/J44">J44 — Bronchopneumopathie chronique obstructive</a> et <a href="#/entry/J45">J45 — Asthme</a>.</p><div class="key"><b>Limite.</b> L’attribution à la grippe exige un test lorsque la présentation n’est pas typique ; une autre cause de décompensation reste possible.</div></template>
<template data-pop="j09-infarctus" data-title="Grippe et infarctus du myocarde"><p class="lab">Fonction et cible</p><p>La plaque coronaire stable possède une chape fibreuse qui l’isole du sang circulant.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’inflammation systémique active les macrophages de la plaque, fragilise la chape et augmente la coagulabilité. La tachycardie et l’hypoxémie accroissent la demande en oxygène du myocarde. Dans une étude canadienne en série de cas autocontrôlée, l’incidence de l’infarctus était environ six fois plus élevée dans les sept jours suivant une grippe confirmée (rapport d’incidence 6,05) que pendant les périodes de référence.</p><p class="lab">Conséquence clinique</p><p>Une douleur thoracique pendant une grippe justifie un électrocardiogramme et un dosage de troponine. Ce lien soutient aussi la vaccination des patients coronariens.</p><div class="key"><b>Limite.</b> Il s’agit d’une association temporelle observée ; elle est cohérente avec un mécanisme plausible mais ne quantifie pas le bénéfice individuel du vaccin.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29365305/" target="_blank" rel="noopener">Kwong et al., N Engl J Med 2018</a>.</p></template>
<template data-pop="j09-myocardite" data-title="Myocardite grippale"><p class="lab">Fonction et cible</p><p>Les cardiomyocytes assurent la contraction ; leur atteinte réduit la fonction ventriculaire et perturbe la conduction électrique.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus peut atteindre le myocarde, mais la lésion résulte surtout de l’infiltration inflammatoire et des cytokines. La nécrose myocytaire libère la troponine ; l’œdème et l’inflammation provoquent arythmies et baisse de la fraction d’éjection.</p><p class="lab">Conséquence clinique</p><p>Douleur thoracique, dyspnée disproportionnée, tachycardie inexpliquée ou choc font demander un électrocardiogramme, une troponine et une échocardiographie. La prise en charge suit <a href="#/entry/I40">I40 — Myocardite</a>.</p><div class="key"><b>Limite.</b> Une troponine élevée pendant une grippe grave peut aussi traduire une souffrance myocardique par hypoxémie ou un infarctus ; l’imagerie précise le mécanisme.</div></template>
<template data-pop="j09-encephalite" data-title="Encéphalopathie et encéphalite grippales"><p class="lab">Fonction et cible</p><p>La barrière hématoencéphalique protège le cerveau de l’inflammation systémique.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’atteinte neurologique résulte surtout d’une tempête cytokinique qui rompt la barrière hématoencéphalique et provoque un œdème cérébral. Le virus est rarement retrouvé dans le liquide cérébrospinal. La forme nécrosante aiguë touche surtout l’enfant.</p><p class="lab">Conséquence clinique</p><p>Une confusion, des convulsions ou un coma pendant une grippe imposent une imagerie cérébrale, une ponction lombaire si elle n’est pas contre-indiquée, et la recherche d’une autre cause, notamment d’une méningite bactérienne.</p><div class="key"><b>Limite.</b> Chez le sujet âgé, une confusion est plus souvent due à la fièvre, à la déshydratation ou à l’hypoxémie qu’à une encéphalite.</div></template>
<template data-pop="j09-rhabdo" data-title="Myosite et rhabdomyolyse"><p class="lab">Fonction et cible</p><p>Les fibres musculaires contiennent la myoglobine et la créatine kinase, qui restent intracellulaires lorsque la membrane est intacte.</p><p class="lab">Mécanisme de l’affirmation</p><p>La myosite grippale, plus fréquente avec l’influenza B chez l’enfant, associe une douleur des mollets et une créatine kinase élevée. Dans la rhabdomyolyse, la destruction musculaire libère la myoglobine, qui précipite dans les tubules rénaux et peut provoquer une insuffisance rénale aiguë.</p><p class="lab">Conséquence clinique</p><p>Des douleurs musculaires intenses, une faiblesse ou des urines foncées font doser la créatine kinase, la créatinine et le potassium. L’hydratation intraveineuse protège le rein.</p><div class="key"><b>Limite.</b> Les myalgies banales de la grippe ne justifient pas de dosage systématique ; c’est l’intensité, la faiblesse ou la couleur des urines qui orientent.</div></template>
<template data-pop="j09-reye" data-title="Syndrome de Reye"><p class="lab">Fonction et cible</p><p>Les mitochondries hépatiques assurent la bêta-oxydation des acides gras et l’élimination de l’ammoniac par le cycle de l’urée.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’association d’une infection virale, notamment grippale ou varicelleuse, et de l’acide acétylsalicylique chez l’enfant provoque une atteinte mitochondriale diffuse. Il en résulte une stéatose microvésiculaire, une hyperammoniémie et un œdème cérébral.</p><p class="lab">Conséquence clinique</p><p>L’aspirine est contre-indiquée chez l’enfant et l’adolescent fébriles. Le syndrome est devenu exceptionnel après la diffusion de cette contre-indication.</p><div class="key"><b>Limite.</b> Un enfant traité au long cours par aspirine pour une autre indication doit être vacciné contre la grippe, car l’arrêt n’est pas toujours possible.</div></template>
<template data-pop="j09-hospitalisation" data-title="Critères d’orientation hospitalière"><p class="lab">Fonction et cible</p><p>L’hospitalisation permet l’oxygénothérapie, la surveillance continue et le traitement des complications.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une hypoxémie, une pneumonie, une instabilité hémodynamique ou une confusion indiquent une défaillance qui peut s’aggraver en quelques heures. L’incapacité à boire expose à la déshydratation et à l’insuffisance rénale. Une décompensation cardiaque ou respiratoire exige un traitement que le domicile ne permet pas toujours.</p><p class="lab">Conséquence clinique</p><p>Le médecin hospitalise devant un signe de gravité, une pneumonie avec score CURB-65 ou CRB-65 élevé, une décompensation non contrôlable ou un isolement social empêchant la surveillance. Les autres patients restent à domicile avec des critères écrits de reconsultation.</p><div class="key"><b>Limite.</b> Les scores de pneumonie n’ont pas été construits pour la grippe ; ils sous-estiment la gravité chez l’adulte jeune hypoxémique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a>.</p></template>
<template data-pop="j09-delai-pec" data-title="Délai de 48 heures et patient hospitalisé"><p class="lab">Fonction et cible</p><p>Les antiviraux bloquent la libération des virions ou la transcription virale ; ils n’agissent que sur un virus qui se réplique encore.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez l’adulte immunocompétent, la réplication culmine dans les 24 à 72 premières heures, puis décroît. Les essais ambulatoires, qui ont inclus des patients dans les 48 heures, ont montré un raccourcissement des symptômes d’environ un jour. Chez le patient hospitalisé ou immunodéprimé, la réplication dure plus longtemps ; des études observationnelles associent un traitement tardif à une mortalité plus basse que l’absence de traitement.</p><p class="lab">Conséquence clinique</p><p>Le patient ambulatoire à risque reçoit l’antiviral le plus tôt possible, idéalement dans les 48 heures. Le patient hospitalisé, grave ou immunodéprimé le reçoit quel que soit le délai, comme le recommandent l’IDSA et les CDC.</p><div class="key"><b>Limite.</b> Le bénéfice d’un traitement tardif chez l’hospitalisé repose sur des données observationnelles, avec un risque de biais ; l’information professionnelle suisse de Tamiflu demande un début le jour des symptômes ou le lendemain. L’usage au-delà relève de la recommandation clinique.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, mis à jour le 10.03.2026</a>.</p></template>
<template data-pop="j09-contentieux" data-title="Contentieux : quel antiviral chez le patient ambulatoire à risque ?"><p class="lab">Fonction et cible</p><p>La question porte sur la grippe non grave du patient ambulatoire à risque de complication.</p><p class="lab">Mécanisme de l’affirmation</p><p><b>OMS, septembre 2024.</b> L’OMS recommande, sous réserve (recommandation conditionnelle), le baloxavir dans les 48 heures pour la grippe non grave à haut risque. Elle ne retient plus l’oseltamivir dans cette indication, car les méta-analyses montrent un effet faible sur les hospitalisations. Elle recommande conditionnellement l’oseltamivir pour la grippe grave.</p><p><b>CDC, page mise à jour le 10.03.2026.</b> Les CDC recommandent un traitement antiviral pour tout patient ambulatoire à risque, avec oseltamivir, zanamivir ou baloxavir selon l’âge et le terrain. Ils préfèrent l’oseltamivir chez l’hospitalisé et pendant la grossesse ; ils ne recommandent pas le baloxavir en monothérapie chez l’immunodéprimé sévère.</p><p class="lab">Conséquence clinique</p><p>Le cours retient la source la plus récente, celle des CDC : baloxavir ou oseltamivir chez le patient ambulatoire à risque, oseltamivir chez le patient grave, hospitalisé, enceinte ou immunodéprimé sévère. Le baloxavir a l’avantage d’une dose unique et d’une réduction de la transmission domestique (essai CENTERSTONE) ; l’oseltamivir a l’avantage d’une longue expérience chez la femme enceinte.</p><div class="key"><b>Limite.</b> Aucune recommandation clinique nationale suisse récente ne tranche ce choix. Les deux molécules sont autorisées par Swissmedic. L’OFSP a publié le 11.04.2025 une évaluation comparative pour sa réserve pandémique, sans recommandation clinique individuelle.</div><p class="src">Références : <a href="https://www.ncbi.nlm.nih.gov/books/NBK607909/" target="_blank" rel="noopener">OMS, Clinical practice guidelines for influenza, 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse 2025</a> ; <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://www.bag.admin.ch/fr/loseltamivir-et-le-baloxavir-marboxil-pour-le-traitement-et-la-prevention-de-la-grippe-virus-influenza-a-et-b" target="_blank" rel="noopener">OFSP, évaluation 2025</a>.</p></template>
<template data-pop="j09-oseltamivir" data-title="Oseltamivir"><p class="lab">Fonction et cible</p><p>L’oseltamivir est une prodrogue orale transformée par le foie en carboxylate d’oseltamivir, qui inhibe la neuraminidase des virus influenza A et B.</p><p class="lab">Mécanisme de l’affirmation</p><p>La neuraminidase clive l’acide sialique et libère les nouveaux virions de la cellule infectée. Son inhibition retient les virions à la surface cellulaire et limite la propagation d’une cellule à l’autre. Dans la méta-analyse de Dobson (2015) sur les patients confirmés, l’oseltamivir raccourcissait les symptômes d’environ 25 heures et réduisait les complications respiratoires basses traitées par antibiotique. La revue Cochrane de 2014 retrouvait un gain de 16,8 heures chez l’adulte, sans effet démontré sur les hospitalisations.</p><p class="lab">Conséquence clinique</p><p>Le schéma adulte est de 75 mg deux fois par jour pendant cinq jours, selon l’information professionnelle suisse. Les nausées et vomissements sont les effets indésirables principaux ; une prise avec un repas les réduit. La dose est réduite en insuffisance rénale. Le détail se trouve dans l’onglet Pharmacologie.</p><div class="key"><b>Limite.</b> Une mutation de la neuraminidase en position 275 confère une résistance aux virus A(H1N1) ; elle reste rare dans les virus saisonniers actuels mais apparaît chez l’immunodéprimé traité longtemps.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25640810/" target="_blank" rel="noopener">Dobson et al., Lancet 2015</a> ; <a href="https://doi.org/10.1002/14651858.CD008965.pub4" target="_blank" rel="noopener">Jefferson et al., Cochrane 2014</a>.</p></template>
<template data-pop="j09-baloxavir" data-title="Baloxavir marboxil"><p class="lab">Fonction et cible</p><p>Le baloxavir marboxil est une prodrogue orale transformée en acide de baloxavir, qui inhibe l’endonucléase dépendante de la coiffe de la polymérase virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus « vole » la coiffe des acides ribonucléiques messagers cellulaires pour amorcer la transcription de ses propres gènes. L’inhibition de cette endonucléase bloque la synthèse des protéines virales dès le début du cycle. La charge virale chute plus vite qu’avec l’oseltamivir. Dans CAPSTONE-1, le délai d’amélioration était semblable à celui de l’oseltamivir et plus court que sous placebo ; CAPSTONE-2 a confirmé le bénéfice chez les patients à haut risque. CENTERSTONE (2025) a réduit la transmission confirmée aux contacts domestiques de 13,4 % à 9,5 %.</p><p class="lab">Conséquence clinique</p><p>Une seule dose orale, adaptée au poids, se prend dans les 48 heures. Swissmedic a autorisé l’indication de prophylaxie post-exposition dès l’âge d’un an. Les produits contenant des cations polyvalents (calcium, fer, magnésium, laxatifs, antiacides) réduisent son absorption et ne doivent pas être pris en même temps.</p><div class="key"><b>Limite.</b> Des virus porteurs d’une substitution de l’endonucléase réduisant la sensibilité apparaissent chez environ 10 % des patients traités dans CAPSTONE-1 et 7 % dans CENTERSTONE, davantage chez l’enfant et l’immunodéprimé. Le baloxavir n’est pas recommandé par les CDC chez la femme enceinte ni chez le patient hospitalisé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30184455/" target="_blank" rel="noopener">Hayden et al., CAPSTONE-1, N Engl J Med 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32526195/" target="_blank" rel="noopener">Ison et al., CAPSTONE-2, Lancet Infect Dis 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40267424/" target="_blank" rel="noopener">Monto et al., CENTERSTONE, N Engl J Med 2025</a> ; <a href="https://www.swissmedic.ch/swissmedic/fr/home/notre-profil/publications/public-summary-swiss-par/public-summary-swiss-par-xofluza-02.html" target="_blank" rel="noopener">Swissmedic, rapport public Xofluza, extension d’indication</a>.</p></template>
<template data-pop="j09-symptomatique" data-title="Traitement symptomatique de la grippe"><p class="lab">Fonction et cible</p><p>Le traitement symptomatique soulage la fièvre, la douleur et la déshydratation sans agir sur le virus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le paracétamol et les anti-inflammatoires non stéroïdiens réduisent la synthèse centrale des prostaglandines qui élève la consigne thermique hypothalamique et sensibilise les nocicepteurs. La fièvre et la tachypnée augmentent les pertes hydriques insensibles ; la boisson compense ces pertes.</p><p class="lab">Conséquence clinique</p><p>Le paracétamol est le premier choix chez l’adulte, en respectant la dose maximale de l’information professionnelle et en la réduisant en cas d’hépatopathie ou de dénutrition. Les anti-inflammatoires non stéroïdiens sont évités en cas d’insuffisance rénale, de déshydratation, d’ulcère ou d’insuffisance cardiaque. L’OMS 2024 les admet pour le soulagement des symptômes, mais pas comme traitement de la grippe grave.</p><div class="key"><b>Limite.</b> L’acide acétylsalicylique est contre-indiqué chez l’enfant et l’adolescent fébriles en raison du syndrome de Reye. Les antitussifs et décongestionnants n’ont pas d’effet démontré sur l’évolution.</div></template>
<template data-pop="j09-corticoides" data-title="Corticostéroïdes dans la grippe"><p class="lab">Fonction et cible</p><p>Les corticostéroïdes inhibent la transcription des gènes inflammatoires et la réponse immunitaire adaptative.</p><p class="lab">Mécanisme de l’affirmation</p><p>En diminuant la réponse immunitaire antivirale, ils prolongent l’excrétion du virus. Une revue Cochrane de 2019, fondée surtout sur des études observationnelles, associait leur emploi à une mortalité et à des surinfections plus fréquentes, avec un risque élevé de biais d’indication.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 ne recommande pas les corticostéroïdes pour traiter la grippe grave. Un patient qui en reçoit pour une autre indication validée, par exemple une exacerbation d’asthme ou de bronchopneumopathie chronique obstructive ou un choc septique réfractaire, les poursuit selon cette indication.</p><div class="key"><b>Limite.</b> Leur place dans le SDRA grippal n’est pas établie par des essais randomisés spécifiques ; l’extrapolation depuis la COVID-19 n’est pas validée pour l’influenza.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30798570/" target="_blank" rel="noopener">Lansbury et al., Cochrane 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-antibiotique" data-title="Antibiotique et grippe"><p class="lab">Fonction et cible</p><p>L’antibiotique cible une bactérie ; il n’a aucune action sur le virus influenza.</p><p class="lab">Mécanisme de l’affirmation</p><p>Une antibiothérapie sans infection bactérienne expose aux effets indésirables, aux infections à Clostridioides difficile et à la sélection de résistances, sans bénéfice. En revanche, une pneumonie confirmée chez un patient grippé peut être une co-infection bactérienne qu’aucun examen n’exclut rapidement.</p><p class="lab">Conséquence clinique</p><p>L’ATS et l’IDSA 2019 recommandent un antibiotique d’emblée chez l’adulte atteint de pneumonie communautaire avec un test grippal positif. Le spectre couvre le pneumocoque et Staphylococcus aureus ; le choix suit <a href="#/entry/J18">J18 — Pneumonies de l’adulte</a>. L’antibiotique peut être arrêté précocement si l’évolution et les cultures n’indiquent pas d’infection bactérienne.</p><div class="key"><b>Limite.</b> L’OMS 2024 déconseille l’antibiotique en l’absence d’argument de co-infection bactérienne ; une grippe sans pneumonie ne justifie pas d’antibiotique préventif.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31573350/" target="_blank" rel="noopener">Metlay et al., ATS et IDSA 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-isolement" data-title="Isolement du patient grippé"><p class="lab">Fonction et cible</p><p>L’isolement réduit le nombre de contacts exposés pendant la période d’excrétion virale.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le virus se transmet surtout par gouttelettes et aérosols à courte distance, et par contact avec des mains ou surfaces contaminées. L’excrétion est maximale pendant les trois premiers jours et décroît ensuite ; la fièvre suit approximativement cette excrétion.</p><p class="lab">Conséquence clinique</p><p>À domicile, les recommandations des CDC de mars 2024 sur les virus respiratoires conseillent de reprendre les activités lorsque les symptômes s’améliorent et que la fièvre a disparu depuis 24 heures sans antipyrétique, puis de redoubler de précautions pendant cinq jours. À l’hôpital, le patient est placé en précautions gouttelettes selon le protocole de l’établissement.</p><div class="key"><b>Limite.</b> L’enfant et l’immunodéprimé excrètent le virus plus longtemps ; un soignant malade ne doit pas travailler auprès de patients vulnérables tant qu’il est fébrile.</div><p class="src">Références : <a href="https://www.cdc.gov/respiratory-viruses/guidance/index.html" target="_blank" rel="noopener">CDC, Respiratory Virus Guidance, mars 2024</a>.</p></template>
<template data-pop="j09-vaccin-groupes" data-title="Groupes à risque de complications : Plan de vaccination suisse 2026"><p class="lab">Fonction et cible</p><p>Le plan désigne les personnes chez qui la grippe cause plus souvent hospitalisation ou décès.</p><p class="lab">Mécanisme de l’affirmation</p><p>Le plan 2026 cite : les femmes enceintes ou ayant accouché dans les quatre semaines précédentes ; les prématurés nés avant 32 semaines ou pesant moins de 1500 g, dès 6 mois pendant les deux premiers hivers ; les personnes dès 6 mois atteintes de façon chronique d’une affection cardiaque, pulmonaire (en particulier asthme), métabolique avec répercussion cardiaque, pulmonaire ou rénale (par exemple diabète ou obésité avec un IMC d’au moins 40), neurologique ou musculosquelettique avec répercussion sur ces fonctions, d’une hépatopathie, d’une insuffisance rénale, d’une asplénie ou d’un déficit immunitaire ; les résidents des établissements de soins. Les personnes de 65 ans et plus sont visées par une recommandation complémentaire.</p><p class="lab">Conséquence clinique</p><p>Chaque groupe partage une réserve cardiorespiratoire, métabolique ou immunitaire réduite. La vaccination de l’entourage protège aussi ceux qui répondent mal au vaccin, comme le grand immunodéprimé et le nourrisson de moins de 6 mois.</p><div class="key"><b>Limite.</b> Le plan permet aussi la vaccination de toute personne qui souhaite réduire son risque pour des raisons privées ou professionnelles.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026, chapitres 2 et 3.2</a>.</p></template>
<template data-pop="j09-soignants" data-title="Vaccination du personnel de santé"><p class="lab">Fonction et cible</p><p>La vaccination du soignant protège d’abord ses patients, puis lui-même et la continuité des soins.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’excrétion virale commence environ un jour avant les symptômes, et une partie des infections reste peu symptomatique. Un soignant infecté peut donc transmettre le virus en travaillant normalement. Ses patients âgés ou immunodéprimés répondent moins bien au vaccin et dépendent de la protection de leur entourage.</p><p class="lab">Conséquence clinique</p><p>Le plan 2026 recommande la vaccination à tout le personnel médical, soignant et paramédical, au personnel des crèches et des établissements pour personnes âgées, y compris aux étudiants et stagiaires.</p><div class="key"><b>Limite.</b> Le bénéfice mesuré sur la mortalité des résidents varie selon les études ; la recommandation se fonde sur l’ensemble des données de transmission et de protection.</div><p class="src">Références : <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-vaccin-efficacite" data-title="Vaccin grippal inactivé : mécanisme, efficacité, sécurité"><p class="lab">Fonction et cible</p><p>Le vaccin inactivé contient l’hémagglutinine des souches attendues, fragmentée ou purifiée. Il induit des anticorps neutralisants dirigés contre la tête de l’hémagglutinine.</p><p class="lab">Mécanisme de l’affirmation</p><p>Ces anticorps empêchent la fixation du virus à l’acide sialique cellulaire. Ils apparaissent en deux semaines environ et diminuent au cours des mois suivants. La protection dépend de la concordance entre les souches vaccinales et les virus circulants ; les CDC estiment qu’elle réduit le risque de grippe nécessitant une consultation de 40 à 60 % les saisons de bonne concordance.</p><p class="lab">Conséquence clinique</p><p>Le vaccin réduit les formes graves même lorsqu’il n’empêche pas toute infection. Les effets indésirables habituels sont une douleur au point d’injection et une fébricule pendant un à deux jours. L’allergie à l’œuf n’est plus une contre-indication selon les CDC ; une anaphylaxie après une dose antérieure en est une.</p><div class="key"><b>Limite.</b> Un excès de syndromes de Guillain-Barré d’environ un à deux cas par million de doses a été observé certaines saisons ; la grippe elle-même expose davantage à ce syndrome.</div></template>
<template data-pop="j09-haute-dose" data-title="Vaccin à dose élevée"><p class="lab">Fonction et cible</p><p>Le vaccin à dose élevée contient quatre fois plus d’hémagglutinine par souche que le vaccin standard.</p><p class="lab">Mécanisme de l’affirmation</p><p>Avec l’âge, l’immunosénescence réduit la réponse des lymphocytes B et T ; la même dose d’antigène produit moins d’anticorps. L’augmentation de la quantité d’antigène compense en partie ce déficit. Dans l’essai de Diaz Granados (2014) chez des personnes de 65 ans et plus, la dose élevée réduisait la grippe confirmée de 24,2 % par rapport à la dose standard.</p><p class="lab">Conséquence clinique</p><p>Le plan de vaccination suisse 2026 préfère la dose élevée dès 75 ans et dès 65 ans avec un facteur de risque supplémentaire. Le vaccin standard reste acceptable si la dose élevée n’est pas disponible, car vacciner reste préférable à attendre.</p><div class="key"><b>Limite.</b> Les réactions locales sont un peu plus fréquentes. Les données de comparaison avec les vaccins adjuvantés sont moins solides.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/25119609/" target="_blank" rel="noopener">Diaz Granados et al., N Engl J Med 2014</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-pep" data-title="Prophylaxie antivirale post-exposition"><p class="lab">Fonction et cible</p><p>La prophylaxie empêche une infection de s’établir chez une personne exposée à un cas de grippe.</p><p class="lab">Mécanisme de l’affirmation</p><p>Un antiviral présent au moment de l’inoculation limite la réplication initiale et la propagation cellulaire. La revue Cochrane 2014 retrouvait une réduction de la grippe symptomatique avec l’oseltamivir en prophylaxie.</p><p class="lab">Conséquence clinique</p><p>L’OMS 2024 réserve la prophylaxie de la grippe saisonnière aux personnes à risque très élevé d’hospitalisation après une exposition, et la recommande après une exposition à un virus zoonotique. Selon l’information professionnelle suisse, l’oseltamivir se donne à 75 mg une fois par jour pendant dix jours, débuté dans les 48 heures suivant le contact. Le baloxavir se donne en dose unique dans les 48 heures.</p><div class="key"><b>Limite.</b> La prophylaxie ne protège que pendant sa durée ; elle ne remplace pas la vaccination. Un traitement à dose curative est préférable si la personne exposée a déjà des symptômes.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-hygiene" data-title="Mesures d’hygiène"><p class="lab">Fonction et cible</p><p>Les mesures d’hygiène interrompent les voies de transmission du virus.</p><p class="lab">Mécanisme de l’affirmation</p><p>Les gouttelettes émises par la toux retombent en général à moins de deux mètres ; un masque porté par le malade en retient une grande partie. Le virus persiste quelques heures sur les mains et les surfaces ; la friction hydroalcoolique inactive son enveloppe lipidique.</p><p class="lab">Conséquence clinique</p><p>Le patient tousse dans le coude, se lave les mains et porte un masque en présence d’autres personnes, en particulier dans les salles d’attente. Les soignants appliquent l’hygiène des mains avant et après chaque contact.</p><div class="key"><b>Limite.</b> L’effet individuel de chaque mesure est difficile à mesurer dans les essais ; leur association reste recommandée.</div></template>
<template data-pop="j09-grossesse" data-title="Grippe et grossesse"><p class="lab">Fonction et cible</p><p>La grossesse modifie la mécanique respiratoire, le débit cardiaque et la régulation immunitaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’utérus élève le diaphragme et réduit la capacité résiduelle fonctionnelle ; la consommation d’oxygène et le débit cardiaque augmentent. Ces changements réduisent la réserve face à une pneumonie. L’hypoxémie maternelle diminue l’apport d’oxygène au fœtus, et la fièvre élevée au premier trimestre est associée à des malformations.</p><p class="lab">Conséquence clinique</p><p>La femme enceinte ou ayant accouché depuis moins de quatre semaines reçoit l’oseltamivir dès la suspicion, sans attendre le test et même après 48 heures. La fièvre est traitée par paracétamol. La vaccination est recommandée à chaque grossesse, quel que soit le trimestre ; les anticorps transmis par le placenta protègent aussi le nourrisson pendant ses premiers mois.</p><div class="key"><b>Limite.</b> L’information professionnelle suisse demande de réserver l’oseltamivir aux situations de nécessité pendant la grossesse ; les données d’usage accumulées depuis 2009 sont rassurantes et soutiennent cette nécessité en cas de grippe. Le baloxavir n’est pas recommandé pendant la grossesse et l’allaitement par les CDC.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC 2026</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/Oj0BSN-w-Ggs/Plan%20de%20vaccination%20suisse_2026_FR_Web_final.pdf" target="_blank" rel="noopener">Plan de vaccination suisse 2026</a>.</p></template>
<template data-pop="j09-ems" data-title="Foyer de grippe en établissement de soins"><p class="lab">Fonction et cible</p><p>Les résidents âgés, souvent polymorbides, vivent en contact étroit et répondent moins bien au vaccin.</p><p class="lab">Mécanisme de l’affirmation</p><p>L’immunosénescence atténue la fièvre, si bien que la grippe se présente par une confusion, une chute, une anorexie ou une décompensation. Un cas non reconnu transmet le virus aux autres résidents et au personnel.</p><p class="lab">Conséquence clinique</p><p>Devant deux cas respiratoires ou plus en quelques jours, l’équipe teste les malades. L’IDSA 2018 recommande, dès qu’un foyer est confirmé, une prophylaxie antivirale de tous les résidents non malades, vaccinés ou non, pendant au moins deux semaines et jusqu’à une semaine après le dernier cas. Les malades sont isolés et traités.</p><div class="key"><b>Limite.</b> La prophylaxie collective demande une adaptation à la fonction rénale de chaque résident.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30566567/" target="_blank" rel="noopener">Uyeki et al., IDSA 2018</a>.</p></template>
<template data-pop="j09-immunodeprime" data-title="Grippe chez le patient immunodéprimé"><p class="lab">Fonction et cible</p><p>Les lymphocytes T cytotoxiques et les anticorps éliminent normalement le virus en une à deux semaines.</p><p class="lab">Mécanisme de l’affirmation</p><p>Chez le greffé, le patient sous chimiothérapie ou sous immunosuppresseur, cette élimination est retardée ; l’excrétion peut durer plusieurs semaines. Une réplication prolongée sous antiviral favorise la sélection de mutants résistants. La progression vers les voies respiratoires inférieures est aussi plus fréquente.</p><p class="lab">Conséquence clinique</p><p>Le patient reçoit l’oseltamivir quel que soit le délai. Les CDC indiquent qu’un traitement plus long que cinq jours peut être nécessaire et que le baloxavir n’est pas recommandé en monothérapie chez l’immunodéprimé sévère. Une absence d’amélioration fait rechercher une résistance par le laboratoire de référence.</p><div class="key"><b>Limite.</b> Les doses doublées d’oseltamivir n’ont pas montré de bénéfice clinique clair selon les CDC. La vaccination de l’entourage reste essentielle, car la réponse vaccinale du patient est réduite.</div><p class="src">Références : <a href="https://www.cdc.gov/flu/hcp/antivirals/summary-clinicians.html" target="_blank" rel="noopener">CDC, mis à jour le 10.03.2026</a>.</p></template>
<template data-pop="j09-rein" data-title="Oseltamivir et insuffisance rénale"><p class="lab">Fonction et cible</p><p>Le carboxylate d’oseltamivir, métabolite actif, est éliminé à plus de 99 % par le rein, par filtration glomérulaire et sécrétion tubulaire.</p><p class="lab">Mécanisme de l’affirmation</p><p>Lorsque la clairance de la créatinine diminue, l’élimination ralentit et la concentration plasmatique augmente. Une dose standard expose alors à une accumulation et à davantage d’effets indésirables digestifs et neuropsychiatriques.</p><p class="lab">Conséquence clinique</p><p>Le médecin estime la clairance de la créatinine avant la prescription. La dose est réduite lorsque la clairance diminue ; les paliers et le schéma en dialyse figurent dans l’onglet Pharmacologie, d’après l’information professionnelle en vigueur.</p><div class="key"><b>Limite.</b> Chez le patient grave, la fonction rénale change rapidement ; la dose est réévaluée en cours de traitement. Le baloxavir n’est pas éliminé principalement par le rein.</div><p class="src">Références : <a href="https://compendium.ch/fr/product/1106960-tamiflu-caps-45-mg/mpro" target="_blank" rel="noopener">Information professionnelle suisse, compendium.ch, Tamiflu, consultée le 08.10.2026</a>.</p></template>
<template data-pop="j09-zoonotique" data-title="Grippe zoonotique : A(H5N1) et autres sous-types aviaires"><p class="lab">Fonction et cible</p><p>Les virus aviaires se fixent préférentiellement aux acides sialiques liés en alpha-2,3, abondants dans les voies respiratoires basses humaines et rares dans le nez.</p><p class="lab">Mécanisme de l’affirmation</p><p>Cette préférence explique une transmission interhumaine faible mais des pneumonies graves lorsque l’infection survient. Une co-infection par un virus saisonnier dans la même cellule permet un réassortiment des segments géniques et l’émergence d’un virus pandémique. L’incubation est de deux à quatorze jours après le contact selon l’OFSP.</p><p class="lab">Conséquence clinique</p><p>Selon l’OFSP, une suspicion d’infection humaine par un nouveau sous-type comme A(H5N1) doit être déclarée par téléphone dans les deux heures, et le patient isolé. L’oseltamivir est débuté sans attendre la confirmation, quel que soit le délai. Les contacts reçoivent une prophylaxie selon l’OMS 2024. Aucun vaccin humain contre la souche actuelle de A(H5N1) n’est autorisé en Suisse.</p><div class="key"><b>Limite.</b> La Suisse n’avait enregistré aucun cas humain confirmé au moment de la consultation de la page de l’OFSP. Le code J09 s’applique seulement lorsque le virus zoonotique ou pandémique est identifié.</div><p class="src">Références : <a href="https://www.bag.admin.ch/fr/grippe-aviaire-h5n1-situation-en-suisse" target="_blank" rel="noopener">OFSP, grippe aviaire H5N1, consultée le 08.10.2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13277511/" target="_blank" rel="noopener">Shen, synthèse OMS 2024</a>.</p></template>
<template data-pop="j09-criteres" data-title="Origine et limites des critères diagnostiques"><p class="lab">Fonction et cible</p><p>Les critères distinguent une grippe probable, confirmée et grave, puis relient la confirmation virologique au code CIM-10-GM 2024.</p><p class="lab">Mécanisme de l’affirmation</p><p>La définition clinique s’inspire des définitions de surveillance du syndrome grippal (début brutal, fièvre, toux, signe général), utilisées par le réseau Sentinella. Elle privilégie la sensibilité pour la surveillance, non la certitude individuelle. La confirmation repose sur la détection du virus, car aucun signe clinique n’est spécifique.</p><p class="lab">Conséquence clinique</p><p>Le dossier mentionne la méthode de confirmation, la gravité et le code avec son intitulé : J09 — Grippe à virus d’influenza zoonotique ou pandémique identifié ; J10 — Grippe, à virus d’influenza saisonnière identifié ; J11 — Grippe, virus non identifié.</p><div class="key"><b>Limite.</b> Il n’existe pas de critères officiels de diagnostic individuel de la grippe ; ceux-ci sont un outil pédagogique construit à partir des définitions de surveillance et des recommandations de l’OMS et de l’IDSA.</div></template>
<template data-pop="pareto-j09-pec" data-title="Pareto — Diagnostic, urgences et prise en charge"><p class="ratio" data-cover="j09-7,j09-8,j09-9,j09-10,j09-11,j09-12"></p><ul><li>En période épidémique, la grippe est un diagnostic clinique ; le test sert lorsqu’il change traitement, isolement ou orientation, et un test antigénique négatif n’exclut pas.</li><li>Hypoxémie, polypnée, hypotension, confusion ou rechute fébrile après amélioration signalent une grippe grave ou une surinfection à pneumocoque ou staphylocoque.</li><li>Antiviral immédiat chez le patient grave, hospitalisé, enceinte ou immunodéprimé, quel que soit le délai ; dans les 48 heures chez l’ambulatoire à risque.</li><li>Oseltamivir adulte 75 mg deux fois par jour pendant cinq jours, réduit en insuffisance rénale ; baloxavir en dose unique, évité pendant la grossesse.</li><li>Pas d’antibiotique sans argument bactérien, sauf pneumonie confirmée ; pas de corticostéroïde pour la grippe elle-même ; pas d’aspirine chez l’enfant.</li><li>Vaccination annuelle des groupes à risque, de l’entourage et des soignants, de mi-octobre au début de la vague ; dose élevée dès 75 ans.</li><li>Suspicion de A(H5N1) après exposition animale : isolement, oseltamivir et déclaration téléphonique dans les deux heures.</li></ul></template>
