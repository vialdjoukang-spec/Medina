<template data-pop="j96-echangeur-pompe" data-title="L’échangeur et la pompe : deux défaillances"><p class="lab">Définition</p><p>L’échangeur réunit les alvéoles et les capillaires pulmonaires : il oxygène le sang. La pompe ventilatoire réunit la commande bulbaire, la moelle, les nerfs phréniques, la jonction neuromusculaire, les muscles respiratoires, la paroi et les voies aériennes : elle renouvelle l’air alvéolaire et élimine le dioxyde de carbone.</p><p class="lab">Mécanisme</p><p>Une atteinte de l’échangeur abaisse la PaO₂ ; la pompe intacte hyperventile et abaisse la PaCO₂ : c’est le type 1. Une défaillance de la pompe diminue la ventilation alvéolaire ; la PaCO₂ monte et la PAO₂ baisse : c’est le type 2.</p><p class="lab">Conséquence clinique</p><p>Le type 1 répond à l’oxygène et au haut débit nasal ; le type 2 exige une aide ventilatoire, car l’oxygène ne fait pas baisser la PaCO₂.</p><div class="key"><b>Limite.</b> Les deux défaillances se combinent souvent : une pneumonie grave épuise la pompe, et le type 1 devient alors hypercapnique, signe d’épuisement imminent.</div></template>
<template data-pop="j96-equation-alveolaire" data-title="L’équation des gaz alvéolaires"><p class="lab">Formule</p><p>PAO₂ = FiO₂ × (pression barométrique − 47) − PaCO₂/0,8. Le nombre 47 est la pression de vapeur d’eau à 37 °C en mmHg ; 0,8 est le quotient respiratoire habituel.</p><p class="lab">Exemple chiffré</p><p>Au niveau de la mer, à l’air ambiant, avec une PaCO₂ de 40 mmHg : 0,21 × 713 − 50 ≈ 100 mmHg. Si la PaCO₂ monte à 80 mmHg par hypoventilation, la PAO₂ tombe à environ 50 mmHg, sans aucune lésion pulmonaire.</p><p class="lab">Usage clinique</p><p>L’équation fournit la PAO₂ dont on soustrait la PaO₂ pour obtenir le gradient alvéolo-artériel. Elle explique aussi l’hypoxémie de rebond à l’arrêt brutal de l’oxygène.</p><div class="key"><b>Limite.</b> Le calcul exige une FiO₂ connue : il est fiable à l’air ambiant, sous masque Venturi ou sous haut débit, non sous lunettes ou masque simple.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 5</a>.</p></template>
<template data-pop="j96-compensation" data-title="Compensation rénale de l’hypercapnie"><p class="lab">Mécanisme</p><p>L’hypercapnie acidifie le sang. Le tamponnement cellulaire immédiat élève peu les bicarbonates ; le rein augmente ensuite leur réabsorption et l’excrétion d’ions H⁺ en trois à cinq jours.</p><p class="lab">Règles approximatives</p><p>En aigu, les bicarbonates montent d’environ 1 mmol/L et le pH baisse d’environ 0,08 par 10 mmHg de PaCO₂. En chronique, les bicarbonates montent de 3 à 4 mmol/L par 10 mmHg et le pH reste proche de la normale.</p><p class="lab">Conséquence clinique</p><p>Des bicarbonates situés entre les deux valeurs attendues signent une acutisation. Des bicarbonates hors de l’intervalle signalent un trouble métabolique associé.</p><div class="key"><b>Limite.</b> Une alcalose métabolique due aux diurétiques, aux corticostéroïdes ou aux vomissements élève aussi les bicarbonates et peut simuler une chronicité. La temporalité clinique tranche.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMra1003327" target="_blank" rel="noopener">Berend et al., approche physiologique des troubles acido-basiques, New England Journal of Medicine 2014</a>.</p></template>
<template data-pop="j96-codage" data-title="Coder une insuffisance respiratoire"><p class="lab">Règle</p><p>La catégorie J96 fixe la temporalité, le cinquième caractère fixe le type. La cause se code séparément.</p><p class="lab">Exemples</p><p>Une pneumonie avec hypoxémie aiguë : code de la pneumonie, puis J96.00. Une exacerbation de BPCO avec acutisation hypercapnique : J44.1, J96.01 et J96.11. Une hypoventilation chronique ventilée à domicile : J96.11 et Z99.1.</p><p class="lab">Pièges</p><p>Le syndrome de détresse respiratoire aiguë est exclu de J96 et se code en J80. L’arrêt respiratoire se code en R09.2. Une SpO₂ isolée ne permet pas de choisir le type.</p><div class="key"><b>Limite.</b> L’ordre des codes suit les règles de codage de l’Office fédéral de la statistique ; ce cours n’en remplace pas le manuel.</div><p class="src">Référence : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-j95-j99.htm" target="_blank" rel="noopener">CIM-10-GM 2024, J96</a>.</p></template>
<template data-pop="j96-gradient" data-title="Gradient alvéolo-artériel"><p class="lab">Définition</p><p>Le gradient est la différence entre la PAO₂ calculée et la PaO₂ mesurée. Il mesure l’oxygène perdu entre l’alvéole et l’artère.</p><p class="lab">Valeur normale</p><p>À l’air ambiant, environ 5 à 15 mmHg chez l’adulte jeune ; elle augmente avec l’âge. Une approximation pratique de la limite supérieure est âge/4 + 4 mmHg, soit environ 12 mmHg à 34 ans et 22 mmHg à 72 ans.</p><p class="lab">Usage</p><p>Un gradient normal avec une PaO₂ basse oriente vers une hypoventilation ; un gradient élevé oriente vers l’échangeur.</p><div class="key"><b>Piège.</b> Le gradient normal augmente avec la FiO₂ ; sous fort débit d’oxygène, un gradient de 100 mmHg peut être physiologique. Il s’interprète surtout à l’air ambiant. Cette règle d’âge est une aide pédagogique, non un critère officiel.</div></template>
<template data-pop="j96-altitude" data-title="Baisse de la pression inspirée d’oxygène"><p class="lab">Mécanisme</p><p>La fraction d’oxygène reste de 21 % en altitude, mais la pression barométrique baisse. À 3 500 m, elle avoisine 490 mmHg : la pression inspirée d’oxygène tombe d’environ 150 à environ 93 mmHg.</p><p class="lab">Lecture gazométrique</p><p>La PaO₂ baisse, le gradient reste normal, et l’hyperventilation réflexe abaisse la PaCO₂. L’oxygène corrige complètement l’hypoxémie.</p><p class="lab">Conséquence clinique</p><p>Un patient atteint d’insuffisance respiratoire chronique peut décompenser en montagne ou en avion : les cabines sont pressurisées à une altitude équivalente qui peut atteindre environ 2 400 m.</p><div class="key"><b>Limite.</b> L’altitude révèle une maladie plus qu’elle ne la crée ; une évaluation avant un vol se discute chez le patient hypoxémique.</div></template>
<template data-pop="j96-hypoventilation" data-title="Hypoventilation alvéolaire"><p class="lab">Mécanisme</p><p>La ventilation alvéolaire diminue : la PaCO₂ monte et, selon l’équation des gaz alvéolaires, la PAO₂ baisse d’autant. Le poumon étant sain, le gradient reste normal.</p><p class="lab">Exemple</p><p>Après un opioïde, une PaCO₂ de 70 mmHg à l’air ambiant donne une PAO₂ d’environ 62 mmHg ; une PaO₂ de 58 mmHg correspond à un gradient de 4 mmHg.</p><p class="lab">Conséquence clinique</p><p>L’oxygène remonte la PaO₂ mais laisse la PaCO₂ élevée : il peut masquer l’aggravation. Le traitement rétablit la ventilation et supprime la cause.</p><div class="key"><b>Piège.</b> Une SpO₂ normale sous oxygène chez un patient somnolent n’exclut pas une hypoventilation grave ; seule la PaCO₂ la révèle.</div></template>
<template data-pop="j96-va-q" data-title="Inadéquation ventilation/perfusion"><p class="lab">Mécanisme</p><p>Des unités alvéolaires reçoivent moins d’air que de sang. Leur sang ressort partiellement désaturé et ne peut être compensé par les unités bien ventilées, déjà saturées.</p><p class="lab">Exemples</p><p>L’obstruction bronchique de la BPCO ou de l’asthme, l’embolie pulmonaire et les pneumopathies interstitielles en sont les exemples types. C’est le mécanisme d’hypoxémie le plus fréquent.</p><p class="lab">Réponse à l’oxygène</p><p>La réponse est bonne : même une unité mal ventilée finit par recevoir un air enrichi, qui élève sa PAO₂. Un faible débit suffit souvent.</p><div class="key"><b>Limite.</b> La vasoconstriction hypoxique limite naturellement cette inadéquation ; un oxygène excessif la lève et peut faire monter la PaCO₂ chez le patient à risque.</div></template>
<template data-pop="j96-shunt" data-title="Shunt vrai"><p class="lab">Définition</p><p>Le shunt est la fraction du débit cardiaque qui traverse le poumon sans contact avec un air ventilé. Il naît d’alvéoles condensées, œdémateuses ou collabées, ou d’une communication droite-gauche intracardiaque ou vasculaire.</p><p class="lab">Mécanisme</p><p>Le sang shunté garde la composition du sang veineux et dilue le sang oxygéné. L’oxygène n’atteint pas ces alvéoles ; augmenter la FiO₂ n’améliore que les unités déjà saturées.</p><p class="lab">Conséquence clinique</p><p>Un large shunt résiste à l’oxygène pur. Le traitement ré-aère les alvéoles par pression positive, traite la cause et, dans une atteinte unilatérale, place le poumon sain en position déclive.</p><div class="key"><b>Limite.</b> Une hypoxémie réfractaire avec poumon clair évoque un shunt intracardiaque ou des malformations artérioveineuses pulmonaires ; l’échocardiographie de contraste les recherche.</div></template>
<template data-pop="j96-diffusion" data-title="Trouble de la diffusion"><p class="lab">Mécanisme</p><p>Au repos, le globule rouge reste environ 0,75 seconde dans le capillaire et l’équilibre gazeux est atteint en un tiers de ce temps. Une membrane épaissie ou une surface réduite ralentit cet équilibre.</p><p class="lab">Conséquence clinique</p><p>Au repos, la réserve de temps masque le trouble ; à l’effort, le temps de transit raccourcit et la saturation chute. C’est la désaturation d’effort de la fibrose pulmonaire.</p><p class="lab">Examen</p><p>La capacité de diffusion du monoxyde de carbone (DLCO) quantifie le trouble ; un test de marche de six minutes révèle la désaturation.</p><div class="key"><b>Limite.</b> Un trouble de diffusion pur explique rarement à lui seul une hypoxémie de repos importante ; il s’y associe une inadéquation ventilation/perfusion.</div></template>
<template data-pop="j96-charge-capacite" data-title="Commande, capacité et charge"><p class="lab">Principe</p><p>La ventilation est maintenue tant que la commande et la capacité musculaire suffisent à vaincre la charge mécanique. Quand la charge dépasse la capacité, le muscle se fatigue ; la commande réduit alors le volume courant et la PaCO₂ monte.</p><p class="lab">Exemples</p><p>Le bronchospasme, la distension, l’obésité et l’épanchement accroissent la charge. Une maladie neuromusculaire, une hypokaliémie, une hypophosphatémie ou une dénutrition réduisent la capacité. Les opioïdes, les sédatifs et une lésion du tronc cérébral diminuent la commande.</p><p class="lab">Conséquence thérapeutique</p><p>Le traitement réduit la charge (bronchodilatateurs, pression expiratoire, drainage) ou supplée la capacité (aide inspiratoire de la ventilation non invasive).</p><div class="key"><b>Limite.</b> La respiration rapide et superficielle protège le muscle mais augmente la part de l’espace mort ; elle annonce l’épuisement plus qu’elle ne le prévient.</div></template>
<template data-pop="j96-pepi" data-title="Pression expiratoire positive intrinsèque"><p class="lab">Mécanisme</p><p>Dans la BPCO, l’expiration est lente ; l’inspiration suivante commence avant la fin de la vidange. Il reste en fin d’expiration une pression alvéolaire positive, par exemple de 6 cm H₂O.</p><p class="lab">Conséquence clinique</p><p>Avant que l’air n’entre, les muscles doivent abaisser la pression alvéolaire de ces 6 cm H₂O : c’est une charge à seuil, épuisante, qui s’ajoute à la résistance des bronches.</p><p class="lab">Conséquence thérapeutique</p><p>Une EPAP appliquée par la ventilation non invasive compense une partie de cette pression et réduit l’effort de déclenchement. Les valeurs rapportées dans la BPCO sévère stable sont de 4 à 6 cm H₂O, davantage en cas de distension marquée.</p><div class="key"><b>Limite.</b> Une EPAP excessive aggrave la distension ; elle se règle au-dessous de la pression intrinsèque estimée.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-sommeil" data-title="Hypoventilation du sommeil"><p class="lab">Mécanisme</p><p>Le sommeil diminue la commande ventilatoire. Pendant le sommeil paradoxal, l’atonie des muscles intercostaux et accessoires laisse le diaphragme seul ; un diaphragme faible ou désavantagé ne suffit plus.</p><p class="lab">Conséquence clinique</p><p>Le patient décrit des céphalées matinales, un sommeil non réparateur, une somnolence diurne ou une orthopnée. L’hypoventilation nocturne précède l’hypercapnie diurne et prédit le besoin de ventilation dans l’année dans les déformations thoraciques.</p><p class="lab">Examen</p><p>La capnographie transcutanée nocturne objective l’hypoventilation : PtcCO₂ ≥ 55 mmHg pendant plus de 10 minutes, ou hausse d’au moins 10 mmHg jusqu’à plus de 50 mmHg pendant plus de 10 minutes.</p><div class="key"><b>Indice.</b> Une alcalose métabolique inexpliquée chez un patient neuromusculaire évoque une hypoventilation nocturne compensée.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-soh" data-title="Syndrome obésité-hypoventilation"><p class="lab">Définition</p><p>Le syndrome associe une obésité, avec un indice de masse corporelle ≥ 30 kg/m², et d’une hypercapnie diurne, PaCO₂ ≥ 45 mmHg, sans autre maladie respiratoire qui l’explique. Un syndrome d’apnées obstructives du sommeil coexiste dans 80 à 90 % des cas.</p><p class="lab">Mécanisme</p><p>La masse thoracique et abdominale augmente la charge élastique, les apnées fragmentent la ventilation nocturne, et la commande au dioxyde de carbone s’émousse.</p><p class="lab">Prise en charge</p><p>En décompensation, la ventilation non invasive est le traitement recommandé, souvent avec des pressions élevées (IPAP &gt; 30, EPAP &gt; 8 cm H₂O). Une étude du sommeil est réalisée dans les trois mois ; en cas d’apnées sévères, un essai de pression positive continue est approprié. La perte de poids et la chirurgie bariatrique complètent le traitement.</p><div class="key"><b>Piège.</b> Une hypercapnie chez un obèse sans obstruction ne doit pas être étiquetée BPCO ; l’hypercapnie aggrave le pronostic de l’obésité.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-neuromusculaire" data-title="Maladies neuromusculaires : une insuffisance masquée"><p class="lab">Particularité</p><p>La faiblesse musculaire empêche les signes habituels de lutte : pas de tachypnée franche, pas de tirage marqué. La dyspnée et l’hypercapnie diurne sont des événements tardifs.</p><p class="lab">Signes à rechercher</p><p>Le médecin recherche une orthopnée, une respiration paradoxale en décubitus, une toux inefficace, des troubles de la déglutition, des céphalées matinales et une perte de poids inexpliquée.</p><p class="lab">Surveillance</p><p>La surveillance associe la capacité vitale assis et couché, la PImax et la SNIP, la gazométrie et la capnographie nocturne. La ventilation non invasive commence si possible avant l’hypercapnie diurne, pour prévenir une décompensation aiguë.</p><div class="key"><b>Limite.</b> La dégradation peut être rapide ou brutale ; la BTS conseille alors une prise en charge en unité de soins intermédiaires ou intensifs, où l’intubation reste possible.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-cyanose" data-title="Cyanose : seuil et pièges"><p class="lab">Mécanisme</p><p>La coloration bleutée apparaît lorsque l’hémoglobine désoxygénée capillaire dépasse environ 50 g/L. Elle dépend donc de la quantité absolue d’hémoglobine désaturée, non de la saturation.</p><p class="lab">Pièges</p><p>Un anémique à 80 g/L d’hémoglobine peut être profondément hypoxémique sans cyanose. Un patient polyglobulique devient cyanosé plus tôt. Une méthémoglobinémie donne une teinte gris ardoise avec une PaO₂ normale.</p><p class="lab">Conséquence clinique</p><p>La cyanose centrale, visible sur les lèvres et la langue, traduit une hypoxémie ; la cyanose périphérique des extrémités traduit plutôt un bas débit ou un froid.</p><div class="key"><b>Limite.</b> Ce signe subjectif dépend de l’éclairage et de la pigmentation cutanée ; son absence ne rassure jamais.</div></template>
<template data-pop="j96-signes-hypercapnie" data-title="Lire l’hypercapnie au lit du patient"><p class="lab">Mécanisme</p><p>Le dioxyde de carbone dilate les artérioles cérébrales et cutanées et acidifie le liquide céphalorachidien.</p><p class="lab">Signes</p><p>Les céphalées, les sueurs, la peau chaude et le pouls bondissant précèdent la somnolence, la confusion et le coma. L’astérixis, perte brève et répétée du tonus postural des mains tendues, traduit l’encéphalopathie.</p><p class="lab">Conséquence clinique</p><p>La vitesse d’installation compte davantage que la valeur absolue : un patient chronique peut rester éveillé à 65 mmHg, alors qu’une hausse aiguë jusqu’à 70 mmHg peut provoquer un coma.</p><div class="key"><b>Limite.</b> L’astérixis existe aussi dans l’encéphalopathie hépatique ou urémique ; la gazométrie tranche.</div></template>
<template data-pop="j96-tirage" data-title="Tirage et muscles accessoires"><p class="lab">Mécanisme</p><p>Pour mobiliser l’air contre une charge élevée, le patient recrute les scalènes et les sternocléidomastoïdiens. La dépression intrathoracique accrue creuse les espaces intercostaux et les creux sus-claviculaires à l’inspiration.</p><p class="lab">Valeur</p><p>Ces signes mesurent cliniquement le travail respiratoire. Associés à une fréquence supérieure à 30 par minute et à une parole hachée, ils indiquent une charge proche de la capacité.</p><p class="lab">Conséquence clinique</p><p>Leur présence impose une gazométrie, une surveillance rapprochée et l’anticipation d’un support ventilatoire.</p><div class="key"><b>Piège.</b> Ils manquent chez le patient neuromusculaire ou épuisé, dont les muscles ne peuvent plus produire cet effort.</div></template>
<template data-pop="j96-respiration-paradoxale" data-title="Respiration abdominale paradoxale"><p class="lab">Normal</p><p>À l’inspiration, le diaphragme descend et l’abdomen se soulève en même temps que le thorax.</p><p class="lab">Mécanisme du signe</p><p>Lorsque le diaphragme est fatigué ou paralysé, les muscles accessoires créent une dépression thoracique qui aspire le diaphragme vers le haut : l’abdomen se creuse pendant que le thorax s’élève.</p><p class="lab">Conséquence clinique</p><p>C’est un signe d’épuisement ou de paralysie diaphragmatique ; dans une détresse aiguë, il annonce l’arrêt respiratoire et impose une décision de support immédiate.</p><div class="key"><b>Limite.</b> En décubitus, il révèle aussi une paralysie diaphragmatique bilatérale chronique, avec orthopnée.</div></template>
<template data-pop="j96-coeur-pulmonaire" data-title="Cœur pulmonaire chronique"><p class="lab">Mécanisme</p><p>L’hypoxémie alvéolaire chronique contracte les artérioles pulmonaires, puis remodèle leur paroi. La pression artérielle pulmonaire monte et le ventricule droit s’hypertrophie, se dilate puis défaille.</p><p class="lab">Signes</p><p>L’examen trouve des œdèmes des membres inférieurs, une turgescence jugulaire, un reflux hépatojugulaire et un éclat du deuxième bruit au foyer pulmonaire. L’échocardiographie estime la pression artérielle pulmonaire et la fonction ventriculaire droite.</p><p class="lab">Conséquence thérapeutique</p><p>La correction prolongée de l’hypoxémie limite la vasoconstriction ; c’est pourquoi un cœur pulmonaire abaisse le seuil d’oxygénothérapie de longue durée à une PaO₂ inférieure à 60 mmHg.</p><div class="key"><b>Limite.</b> D’autres causes d’hypertension pulmonaire coexistent, notamment thromboemboliques ou cardiaques gauches ; elles relèvent d’un bilan spécialisé.</div></template>
<template data-pop="j96-gaz-lecture" data-title="Lire une gazométrie en six étapes"><p class="lab">Étapes</p><p>Le médecin vérifie d’abord les conditions : air ambiant ou FiO₂, et délai depuis le dernier changement d’oxygène. Il lit ensuite le pH, qui dit acidémie ou alcalémie, puis la PaCO₂, qui dit si l’origine est respiratoire. Les bicarbonates distinguent forme aiguë, chronique et acutisation. La PaO₂ et le gradient disent si l’échangeur est atteint. Le lactate et le trou anionique révèlent un trouble associé.</p><p class="lab">Exemple</p><p>pH 7,24, PaCO₂ 82 mmHg, bicarbonates 34 mmol/L : acidose respiratoire ; bicarbonates entre la valeur aiguë attendue (environ 28) et la valeur chronique attendue (environ 38 à 41) : acutisation d’une hypercapnie chronique.</p><div class="key"><b>Limite.</b> Une gazométrie décrit un instant ; sa répétition à 30–60 minutes ou à une heure de ventilation montre la trajectoire, qui décide.</div></template>
<template data-pop="j96-lactate" data-title="Lactate et hypoxie tissulaire"><p class="lab">Mécanisme</p><p>Lorsque l’apport d’oxygène ne couvre plus les besoins, la cellule produit son énergie par glycolyse anaérobie et libère du lactate. La valeur normale est inférieure à 2 mmol/L.</p><p class="lab">Interprétation</p><p>Un lactate élevé chez un patient hypoxémique signale une hypoxie tissulaire, aggravée par une anémie ou un bas débit, ou un choc associé.</p><p class="lab">Conséquence clinique</p><p>Il oriente vers une prise en charge en réanimation et la recherche d’un sepsis ou d’une défaillance circulatoire.</p><div class="key"><b>Piège.</b> Les nébulisations répétées de salbutamol élèvent le lactate sans hypoxie tissulaire ; la metformine et l’insuffisance hépatique aussi.</div></template>
<template data-pop="j96-echographie" data-title="Échographie pulmonaire au lit"><p class="lab">Principe</p><p>Le poumon aéré ne transmet pas les ultrasons ; ses artefacts changent quand l’eau, l’air ou le tissu modifient la surface pleurale.</p><p class="lab">Profils</p><p>Des lignes B nombreuses et bilatérales évoquent un syndrome interstitiel, notamment un œdème cardiogénique. Une consolidation évoque une pneumonie. L’absence de glissement pleural avec un point poumon affirme un pneumothorax. Un profil normal chez un patient hypoxémique, associé à une thrombose veineuse profonde, oriente vers une embolie pulmonaire.</p><div class="key"><b>Limite.</b> L’examen dépend de l’opérateur et ne remplace ni l’angio-TDM pour l’embolie ni la gazométrie pour la gravité.</div><p class="src">Référence : <a href="https://doi.org/10.1378/chest.07-2800" target="_blank" rel="noopener">Lichtenstein et Mezière, Chest 2008</a>.</p></template>
<template data-pop="j96-cibles" data-title="Cibles de saturation : texte retenu et contentieux"><p class="lab">Texte retenu</p><p>BTS 2017 : 94 à 98 % pour la plupart des patients aigus, 88 à 92 % pour les patients à risque d’insuffisance hypercapnique. En 2019, la BTS a réexaminé ces cibles après la méta-analyse IOTA et n’a pas jugé nécessaire de les modifier. GOLD 2026 retient aussi 88 à 92 % dans l’exacerbation de BPCO.</p><p class="lab">Justification</p><p>La saturation normale de l’adulte jeune est de 96 à 98 % ; la limite de 94 % laisse une marge pour l’erreur de l’oxymètre. IOTA a montré qu’une stratégie libérale augmente la mortalité hospitalière (risque relatif 1,21, certitude élevée), avec un effet défavorable possible au-delà de 94 à 96 %. L’essai d’Austin a montré le bénéfice de 88 à 92 % dans la BPCO.</p><p class="lab">Contentieux</p><p>Certains auteurs proposent des plafonds plus bas, autour de 96 %, chez les patients non hypercapniques. Aucune recommandation suisse propre n’a été identifiée ; la BTS 2017 reste le texte primaire en vigueur, compatible avec IOTA.</p><div class="key"><b>Limite.</b> Les soins palliatifs, l’intoxication au monoxyde de carbone et l’arrêt cardiaque suivent leurs propres règles.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a> ; <a href="https://doi.org/10.1016/S0140-6736(18)30479-3" target="_blank" rel="noopener">IOTA, Lancet 2018</a>.</p></template>
<template data-pop="j96-dispositifs" data-title="Dispositifs d’oxygène et pièges"><p class="lab">Masque Venturi</p><p>Un jet d’oxygène à travers un orifice calibré entraîne une quantité fixe d’air : la FiO₂ délivrée est fixe (24, 28, 35, 40 ou 60 %, selon la valve). Augmenter le débit au-dessus du minimum indiqué n’augmente pas la FiO₂ mais suit mieux un patient tachypnéique.</p><p class="lab">Lunettes et masque simple</p><p>Leur FiO₂ dépend de la ventilation du patient et de la respiration buccale. Un masque simple réglé au-dessous de 5 L/min fait réinhaler le dioxyde de carbone.</p><p class="lab">Masque à réservoir</p><p>À 15 L/min, avec un réservoir gonflé, il délivre une concentration élevée ; il est réservé au patient critique ou très hypoxémique.</p><div class="key"><b>Conduite.</b> Une fois le patient stabilisé, la BTS conseille de passer du Venturi aux lunettes nasales, plus confortables pour manger et parler.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 10</a>.</p></template>
<template data-pop="j96-rebond" data-title="Hypoxémie de rebond"><p class="lab">Mécanisme</p><p>Un patient devenu hypercapnique sous oxygène garde une PaCO₂ élevée pendant plusieurs minutes après l’arrêt. Selon l’équation des gaz alvéolaires, avec une PaCO₂ de 80 mmHg à l’air ambiant, la PAO₂ tombe vers 50 mmHg : la saturation chute au-dessous de sa valeur initiale.</p><p class="lab">Conduite</p><p>La BTS demande de réduire l’oxygène au plus faible niveau qui maintient 88 à 92 %, par masque Venturi à 24 ou 28 % ou lunettes à 1 à 2 L/min, puis de contrôler la gazométrie.</p><div class="key"><b>Erreur fréquente.</b> Retirer le masque d’un patient somnolent et hypercapnique « parce que l’oxygène est dangereux » : le danger est l’excès, non l’oxygène lui-même.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, bonnes pratiques sur l’hypercapnie induite</a>.</p></template>
<template data-pop="j96-austin" data-title="Essai d’Austin (2010)"><p class="lab">Plan</p><p>Cet essai randomisé en grappes, mené par le service ambulancier de Hobart en Tasmanie, a comparé chez 405 patients en exacerbation présumée de BPCO un oxygène à haut débit à un oxygène titré vers 88–92 %.</p><p class="lab">Résultats</p><p>La mortalité était de 9 % sous haut débit contre 4 % sous oxygène titré (risque relatif 0,42) ; chez les 214 patients dont la BPCO était confirmée, 9 % contre 2 % (risque relatif 0,22). L’acidose respiratoire et l’hypercapnie étaient moins fréquentes sous oxygène titré.</p><div class="key"><b>Limite.</b> L’essai était monocentrique et préhospitalier, avec des effectifs modestes et une adhésion imparfaite au protocole ; ses résultats fondent pourtant la cible de 88–92 % reprise par la BTS et GOLD.</div><p class="src">Référence : <a href="https://doi.org/10.1136/bmj.c5462" target="_blank" rel="noopener">Austin et al., British Medical Journal 2010</a>.</p></template>
<template data-pop="j96-haut-debit" data-title="Oxygène nasal à haut débit : mécanismes"><p class="lab">FiO₂ stable</p><p>Un débit jusqu’à 60 L/min dépasse le débit inspiratoire du patient : l’air ambiant n’est plus entraîné et la FiO₂ réglée est celle qui est inhalée.</p><p class="lab">Lavage de l’espace mort</p><p>Le débit chasse le gaz expiré du nasopharynx ; chaque inspiration contient moins de dioxyde de carbone, ce qui améliore la ventilation alvéolaire pour une même ventilation totale.</p><p class="lab">Pression positive modeste et humidification</p><p>Bouche fermée, une petite pression expiratoire se crée et augmente avec le débit. Le gaz chauffé et humidifié préserve la clairance mucociliaire et améliore le confort.</p><div class="key"><b>Limite.</b> La pression n’est ni réglée ni garantie ; le haut débit ne remplace pas la ventilation non invasive dans l’acidose hypercapnique de la BPCO.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01574-2021" target="_blank" rel="noopener">ERS 2022</a> ; <a href="https://doi.org/10.1056/NEJMoa1503326" target="_blank" rel="noopener">FLORALI 2015</a>.</p></template>
<template data-pop="j96-contentieux-hypoxemique" data-title="Hypoxémie aiguë : haut débit, ventilation non invasive ou pression positive continue"><p class="lab">Textes en présence</p><p>ERS/ATS 2017 : aucune recommandation sur la ventilation non invasive dans l’insuffisance hypoxémique de novo, faute de preuves suffisantes ; recommandation forte de la pression positive dans l’œdème pulmonaire cardiogénique. ERS 2022, texte primaire plus récent : haut débit suggéré plutôt que l’oxygène standard et plutôt que la ventilation non invasive dans l’insuffisance hypoxémique aiguë (recommandations conditionnelles, certitude faible).</p><p class="lab">Choix retenu</p><p>Dans l’insuffisance hypoxémique non cardiogénique, le haut débit est le support de première intention ; dans l’œdème pulmonaire cardiogénique, la pression positive reste la règle, car aucun texte plus récent n’a contredit cette recommandation forte.</p><p class="lab">Niveau de preuve et limites</p><p>Les recommandations de 2022 sont conditionnelles ; l’essai FLORALI n’a pas montré de différence significative sur l’intubation. Pendant la pandémie de COVID-19, un essai britannique de 2022 a montré un bénéfice de la pression positive continue sur un critère combinant intubation et décès, sans bénéfice du haut débit : ce résultat concerne une population particulière.</p><div class="key"><b>Conséquence.</b> Quel que soit le support, l’intubation ne doit pas être retardée : fréquence respiratoire, signes de lutte et indice ROX guident la réévaluation.</div><p class="src">Références : <a href="https://doi.org/10.1183/13993003.01574-2021" target="_blank" rel="noopener">ERS 2022</a> ; <a href="https://doi.org/10.1183/13993003.02426-2016" target="_blank" rel="noopener">ERS/ATS 2017</a>.</p></template>
<template data-pop="j96-rox" data-title="Indice ROX"><p class="lab">Calcul</p><p>ROX = (SpO₂/FiO₂) / fréquence respiratoire. Exemple : SpO₂ 92 %, FiO₂ 0,5, fréquence 28 : (92/0,5)/28 ≈ 6,6.</p><p class="lab">Seuils validés</p><p>Chez des patients atteints de pneumonie sous haut débit, un indice ≥ 4,88 à 2, 6 ou 12 heures s’associait à un moindre risque d’intubation ; des valeurs inférieures à 2,85, 3,47 et 3,85 à 2, 6 et 12 heures prédisaient l’échec.</p><p class="lab">Conséquence clinique</p><p>Un indice bas ou qui ne s’améliore pas impose une réévaluation en réanimation et la discussion de l’intubation.</p><div class="key"><b>Limite.</b> L’indice a été validé dans la pneumonie ; ce n’est pas un critère d’intubation isolé. La clinique reste prioritaire.</div><p class="src">Référence : <a href="https://doi.org/10.1164/rccm.201803-0589OC" target="_blank" rel="noopener">Roca et al., American Journal of Respiratory and Critical Care Medicine 2019</a>.</p></template>
<template data-pop="j96-vni-principe" data-title="Ventilation non invasive : principe"><p class="lab">Deux niveaux de pression</p><p>Le ventilateur alterne l’IPAP, pendant l’inspiration, et l’EPAP, pendant l’expiration. Leur différence constitue l’aide inspiratoire : elle augmente le volume courant, donc la ventilation alvéolaire, et réduit le travail des muscles.</p><p class="lab">Rôle de l’EPAP</p><p>L’EPAP évacue le dioxyde de carbone expiré par la fuite intentionnelle du masque, compense la pression expiratoire positive intrinsèque, maintient ouvertes les voies aériennes supérieures et recrute des alvéoles.</p><p class="lab">Pression positive continue</p><p>Elle applique un seul niveau de pression, sans aide inspiratoire : elle traite l’œdème pulmonaire cardiogénique et les apnées obstructives, non l’hypoventilation.</p><div class="key"><b>Pratique.</b> En aigu, le masque bucco-nasal est le plus utilisé ; un mode avec fréquence de sécurité protège le patient qui fait des pauses.</div></template>
<template data-pop="j96-vni-indications" data-title="Indications de la ventilation non invasive (ERS/ATS 2017)"><p class="lab">Recommandations fortes</p><p>La ventilation non invasive est fortement recommandée dans la BPCO avec acidose respiratoire aiguë ou acutisée, pH ≤ 7,35, avec une certitude élevée ; elle réduit la mortalité et l’intubation. Un essai est fortement recommandé chez le patient jugé candidat à l’intubation, sauf dégradation immédiate. Dans l’œdème pulmonaire cardiogénique, les deux niveaux de pression ou la pression positive continue sont fortement recommandés.</p><p class="lab">Recommandations conditionnelles en faveur</p><p>Elle est suggérée dans l’immunodépression (ventilation précoce), l’insuffisance postopératoire, le traumatisme thoracique lorsque la douleur est contrôlée, la palliation de la dyspnée en fin de vie et la prévention de l’échec d’extubation chez le patient à haut risque.</p><p class="lab">En pratique dans la BPCO</p><p>L’ERS/ATS conseille de l’envisager lorsque pH ≤ 7,35, PaCO₂ &gt; 45 mmHg et fréquence respiratoire &gt; 20–24 par minute persistent malgré le traitement standard. Aucun pH plancher n’interdit l’essai, mais plus le pH est bas, plus le risque d’échec est grand et plus la surveillance doit être étroite.</p><div class="key"><b>Contre.</b> L’ERS/ATS la déconseille dans l’hypercapnie sans acidose et dans l’insuffisance après extubation déjà installée ; elle ne formule aucune recommandation dans l’asthme et l’hypoxémie de novo.</div><p class="src">Référence : <a href="https://doi.org/10.1183/13993003.02426-2016" target="_blank" rel="noopener">Rochwerg et al., ERS/ATS 2017</a>.</p></template>
<template data-pop="j96-vni-reglages" data-title="Régler une ventilation non invasive"><p class="lab">Pressions</p><p>L’IPAP initiale de 15 cm H₂O est augmentée en 10 à 30 minutes vers 20 à 30 cm H₂O, d’autant plus vite que l’acidose est sévère et le patient corpulent. L’EPAP, d’au moins 3 cm H₂O, est augmentée en cas d’obésité, d’apnées obstructives ou d’hypoxémie persistante.</p><p class="lab">Oxygène</p><p>La cible est de 88–92 % ; l’oxygène est ajouté près du masque. Les réglages ventilatoires sont optimisés avant d’augmenter la FiO₂.</p><p class="lab">Échecs techniques</p><p>Les causes les plus fréquentes sont une fuite excessive, une aide insuffisante et une asynchronie. Un thorax qui se soulève peu signale une IPAP insuffisante.</p><p class="lab">Durée</p><p>Le temps sous ventilation est maximal pendant les 24 premières heures, puis diminué le jour sur 2 à 3 jours ; l’arrêt intervient lorsque le pH et la PaCO₂ se sont normalisés et que l’état général s’améliore.</p><div class="key"><b>Limite.</b> Une hypoxémie sévère sous ventilation non invasive impose un ventilateur capable de délivrer une FiO₂ précise et élevée.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-vni-echec" data-title="Échec de la ventilation non invasive"><p class="lab">Prédicteurs de succès</p><p>Une amélioration du pH et de la fréquence respiratoire en une à deux heures, avec une baisse de l’agitation et de la fréquence cardiaque, prédit le succès.</p><p class="lab">Signes d’échec</p><p>Dans la BPCO, un pH qui reste inférieur à 7,25 avec une fréquence supérieure à 35 par minute rend l’échec probable. Une acidose qui s’aggrave après une amélioration initiale assombrit le pronostic. Dans l’insuffisance hypoxémique, un score HACOR élevé après une heure prédit l’échec.</p><p class="lab">Conduite</p><p>Le médecin vérifie le masque, les fuites et la synchronisation, optimise les réglages, puis décide de l’intubation sans attendre.</p><div class="key"><b>Danger.</b> Prolonger une ventilation non invasive inefficace retarde l’intubation et augmente la mortalité, comme l’ont montré les essais dans l’insuffisance après extubation.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-vni-contre-indications" data-title="Contre-indications de la ventilation non invasive"><p class="lab">Peu de contre-indications absolues</p><p>La BTS et l’Intensive Care Society soulignent qu’il existe peu de contre-indications absolues à un essai. Un masque impossible à appliquer ou à rendre étanche (traumatisme ou brûlure faciale), une obstruction fixe des voies aériennes supérieures, des vomissements incoercibles ou un pneumothorax non drainé empêchent en pratique la ventilation.</p><p class="lab">Facteurs défavorables</p><p>Un pH très bas, un score de Glasgow inférieur à 8, une confusion, une agitation ou des sécrétions abondantes augmentent le risque d’échec. Ils imposent une surveillance renforcée en unité de soins intermédiaires ou intensifs, sans interdire l’essai.</p><div class="key"><b>Nuance.</b> L’arrêt respiratoire relève de l’intubation ; un bref essai par un opérateur expérimenté ne se conçoit que comme préparation.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016, recommandation 3</a>.</p></template>
<template data-pop="j96-intubation" data-title="Intuber un patient hypoxémique"><p class="lab">Risque</p><p>Le patient hypoxémique désature en quelques secondes pendant l’apnée de l’intubation. L’induction supprime le tonus sympathique et la ventilation en pression positive réduit le retour veineux : un collapsus survient fréquemment.</p><p class="lab">Préparation</p><p>L’équipe préoxygène le patient par haut débit nasal ou ventilation non invasive. Un opérateur expérimenté intube, le matériel de voie aérienne difficile est disponible, et un remplissage et un vasopresseur sont prêts.</p><p class="lab">Après l’intubation</p><p>Chez l’obstructif, le ventilateur impose une fréquence basse et une expiration longue, et l’hypercapnie est tolérée ; dans le SDRA, la ventilation protectrice utilise de petits volumes.</p><div class="key"><b>Limite.</b> Le détail des agents et des réglages relève des protocoles d’anesthésie et de réanimation.</div></template>
<template data-pop="j96-hypercapnie-permissive" data-title="Hypercapnie permissive"><p class="lab">Principe</p><p>Chez le patient très obstructif ventilé, chercher une PaCO₂ normale imposerait des volumes et des fréquences élevés, donc une distension dynamique, un barotraumatisme et un collapsus.</p><p class="lab">Recommandation</p><p>La BTS accepte un pH de 7,20 à 7,25 pour éviter des pressions élevées, avec une fréquence de 10 à 15 par minute et un rapport inspiration/expiration d’au moins 1/3.</p><div class="key"><b>Limite.</b> L’hypercapnie dilate les vaisseaux cérébraux : elle est à éviter en cas d’hypertension intracrânienne.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016, recommandations 14 et 15</a>.</p></template>
<template data-pop="j96-palliatif" data-title="Insuffisance respiratoire en soins palliatifs"><p class="lab">Objectif</p><p>Les soins visent à soulager la dyspnée et à préserver la communication, selon les volontés exprimées ou les directives anticipées.</p><p class="lab">Moyens</p><p>L’oxygène soulage la dyspnée du patient hypoxémique, non celle du patient normoxémique ; un ventilateur à main dirigé vers le visage peut aider. Les opioïdes à faible dose diminuent la perception de la dyspnée. L’ERS/ATS suggère d’offrir la ventilation non invasive pour soulager la dyspnée en fin de vie.</p><div class="key"><b>Limite.</b> Les cibles de saturation et la surveillance perdent leur pertinence lorsque le confort devient l’unique objectif ; la BTS le prévoit explicitement.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a> ; <a href="https://doi.org/10.1183/13993003.02426-2016" target="_blank" rel="noopener">ERS/ATS 2017</a>.</p></template>
<template data-pop="j96-old" data-title="Oxygénothérapie de longue durée : critères et preuves"><p class="lab">Critères</p><p>L’indication suppose une maladie respiratoire chronique stable, un traitement optimisé et une PaO₂ de repos ≤ 55 mmHg (7,3 kPa), ou inférieure à 60 mmHg avec cœur pulmonaire, hypertension pulmonaire ou polyglobulie. La mesure est répétée sur plusieurs semaines : deux fois en trois semaines selon GOLD, trois fois en quatre semaines selon la recommandation germanophone de 2020, lue en résumé.</p><p class="lab">Preuves</p><p>L’essai du Medical Research Council (1981) a inclus 87 patients, oxygène au moins 15 heures par jour ; 19 décès sur 42 sous oxygène contre 30 sur 45 sans oxygène en cinq ans. Essai NOTT (1980) : 203 patients ; mortalité à 24 mois de 22,4 % sous oxygène continu contre 40,8 % sous oxygène nocturne seul. Essai LOTT (2016) : aucun bénéfice dans la désaturation modérée.</p><p class="lab">Effort et sommeil</p><p>Un oxygène de déambulation se discute s’il améliore réellement la tolérance à l’effort ; une désaturation isolée pendant le sommeil relève d’abord d’une recherche d’apnées ou d’hypoventilation.</p><div class="key"><b>Limite.</b> L’oxymètre ne suffit pas à poser l’indication ; la gazométrie artérielle est nécessaire. La poursuite du tabagisme expose à des brûlures graves.</div><p class="src">Références : <a href="https://goldcopd.org/wp-content/uploads/2026/01/GOLD-Pocket-Guide-2026-v1.1-20Nov2025_WMV2.pdf" target="_blank" rel="noopener">GOLD 2026</a> ; <a href="https://doi.org/10.1055/s-0034-1377329" target="_blank" rel="noopener">Société allemande de pneumologie, prise de position 2014 (essais du Medical Research Council et NOTT)</a>.</p></template>
<template data-pop="j96-old-duree" data-title="15 ou 16 heures par jour"><p class="lab">Origine des chiffres</p><p>L’essai du Medical Research Council prescrivait au moins 15 heures par jour ; l’essai NOTT comparait un oxygène continu, en moyenne 17,7 heures par jour, à 12 heures nocturnes. GOLD retient au moins 15 heures. Le formulaire suisse de prescription de l’oxygénothérapie de longue durée de la Ligue pulmonaire demande au moins 16 heures.</p><p class="lab">Choix retenu</p><p>En Suisse, la prescription suit le formulaire de la Ligue pulmonaire, soit au moins 16 heures par jour ; cette durée respecte aussi le seuil des essais. Plus la durée quotidienne est longue, plus elle se rapproche de l’oxygène continu de NOTT.</p><div class="key"><b>Limite.</b> Le formulaire de la Ligue pulmonaire a été lu en résumé, l’accès direct au document ayant été refusé le 08.10.2026.</div><p class="src">Références : <a href="https://www.liguepulmonaire.ch/cours-et-prestations/conseil-et-therapies/oxygenotherapie" target="_blank" rel="noopener">Ligue pulmonaire suisse, oxygénothérapie</a> ; <a href="https://doi.org/10.1055/s-0034-1377329" target="_blank" rel="noopener">prise de position 2014 (essais du Medical Research Council et NOTT)</a>.</p></template>
<template data-pop="j96-suisse-prescription" data-title="Prescrire l’oxygène à domicile en Suisse"><p class="lab">Qui prescrit</p><p>Une oxygénothérapie de courte durée, jusqu’à trois mois, peut être prescrite par tout médecin. L’oxygénothérapie de longue durée suppose une évaluation préalable et une indication posée par un spécialiste.</p><p class="lab">Qui délivre</p><p>La Ligue pulmonaire cantonale livre le matériel sur prescription, instruit le patient et assure le suivi technique. Le concentrateur est le système de référence ; l’oxygène liquide se justifie notamment par un besoin à l’effort supérieur à 6 L/min.</p><p class="lab">Remboursement</p><p>L’assurance obligatoire des soins rembourse selon la liste des moyens et appareils (MiGeL, annexe 2 de l’OPAS) ; au-delà de trois mois, une garantie préalable de l’assureur est exigée.</p><div class="key"><b>Limite.</b> Ces informations ont été lues en résumé sur les pages de la Ligue pulmonaire et de l’OFSP le 08.10.2026 ; les montants et conditions de la MiGeL changent régulièrement.</div><p class="src">Références : <a href="https://www.liguepulmonaire.ch/cours-et-prestations/conseil-et-therapies/oxygenotherapie" target="_blank" rel="noopener">Ligue pulmonaire suisse</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/1ZHQBJ4DQCrL/Modifications%20annexe%202%20LiMA%20du%204%20juin%202025%20pour%20le%2001.07.2025.pdf" target="_blank" rel="noopener">OFSP, modifications de la MiGeL au 01.07.2025</a>.</p></template>
<template data-pop="j96-vni-domicile-bpco" data-title="Ventilation à domicile après une exacerbation de BPCO"><p class="lab">Pourquoi attendre</p><p>Beaucoup de patients hypercapniques à la sortie normalisent leur PaCO₂ en quelques semaines. L’essai RESCUE (2014), qui débutait la ventilation 48 heures après l’épisode chez 201 patients, n’a montré aucun bénéfice à un an : la PaCO₂ baissait aussi dans le groupe témoin.</p><p class="lab">Ce qui marche</p><p>L’essai HOT-HMV (116 patients, PaCO₂ &gt; 53 mmHg persistante 2 à 4 semaines après une exacerbation acidosique) a réduit d’environ moitié le risque de réadmission ou de décès à 12 mois (rapport de risques 0,49 ; six patients à traiter). Un essai germano-autrichien de 2014 chez 195 patients stables avec PaCO₂ ≥ 7 kPa a réduit la mortalité à un an de 33 % à 12 %.</p><p class="lab">Seuils discordants</p><p>Société suisse de pneumologie 2020 : PaCO₂ &gt; 7 kPa (52,5 mmHg). Groupe de travail de l’ERS, cité par la Société suisse : 6,7 kPa (50 mmHg). HOT-HMV : 53 mmHg. GOLD 2026 parle d’une hypercapnie diurne marquée après une hospitalisation récente. En Suisse, le texte applicable retenu est celui de la Société suisse de pneumologie, le plus spécifique au système de santé suisse.</p><div class="key"><b>Limite.</b> Toutes ces recommandations sont conditionnelles ; une obésité ou des apnées associées modifient la stratégie.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Janssens et al., Société suisse de pneumologie, Respiration 2020</a>.</p></template>
<template data-pop="j96-grossesse" data-title="Insuffisance respiratoire et grossesse"><p class="lab">Physiologie</p><p>La progestérone stimule la commande ventilatoire : la PaCO₂ normale de la femme enceinte avoisine 30 mmHg, avec des bicarbonates abaissés et un pH légèrement alcalin.</p><p class="lab">Piège</p><p>Une PaCO₂ de 40 mmHg, normale hors grossesse, traduit une hypoventilation relative et peut annoncer l’épuisement.</p><p class="lab">Conduite</p><p>La cible reste de 94 à 98 % ; l’oxygène n’est pas donné à une mère non hypoxémique, car il pourrait nuire au fœtus. Le décubitus latéral gauche améliore le retour veineux en fin de grossesse ; l’équipe obstétricale est associée d’emblée.</p><div class="key"><b>Limite.</b> Les valeurs gazométriques de la grossesse varient selon le terme ; elles s’interprètent avec l’équipe obstétricale.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandations sur la grossesse</a>.</p></template>
<template data-pop="j96-cooxymetrie" data-title="Co-oxymétrie"><p class="lab">Principe</p><p>L’analyseur de gaz du sang mesure l’absorption de nombreuses longueurs d’onde et distingue l’oxyhémoglobine, la désoxyhémoglobine, la COHb et la MetHb.</p><p class="lab">Indications</p><p>La co-oxymétrie est indiquée devant une suspicion d’intoxication au monoxyde de carbone (incendie, chauffage défectueux), une méthémoglobinémie médicamenteuse ou toxique, ou une discordance entre la SpO₂ et la clinique.</p><p class="lab">Conséquence thérapeutique</p><p>Dans l’intoxication au monoxyde de carbone, l’oxygène à la concentration la plus élevée possible accélère nettement l’élimination de la COHb ; la SpO₂ ne sert pas à le titrer.</p><div class="key"><b>Piège.</b> La PaO₂ est normale dans l’intoxication au monoxyde de carbone, malgré l’hypoxie tissulaire.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandation sur le monoxyde de carbone</a>.</p></template>
<template data-pop="j96-naloxone" data-title="Naloxone"><p class="lab">Mécanisme</p><p>La naloxone est un antagoniste compétitif des récepteurs opioïdes μ : elle déplace l’opioïde et restaure la commande ventilatoire.</p><p class="lab">Emploi</p><p>Elle s’administre par voie intraveineuse, en petites doses répétées et titrées sur la ventilation, après avoir assuré la ventilation au ballon si nécessaire. La posologie suit l’information professionnelle suisse.</p><p class="lab">Surveillance</p><p>Sa durée d’action, d’environ une heure, est plus courte que celle de nombreux opioïdes : la dépression respiratoire peut réapparaître. Une surveillance prolongée, voire une perfusion, est nécessaire.</p><div class="key"><b>Risque.</b> Une antagonisation brutale provoque douleur, agitation et syndrome de sevrage chez le patient dépendant ; l’objectif est une ventilation suffisante, non un réveil complet.</div></template>
<template data-pop="pareto-j96-meca" data-title="Pareto — Définitions, physiologie et mécanismes"><p class="ratio" data-cover="j96-0,j96-1,j96-2,j96-3,j96-4,j96-5"></p><ul><li>Insuffisance respiratoire : PaO₂ &lt; 60 mmHg (8 kPa) ou PaCO₂ &gt; 45 mmHg (6 kPa) sur gazométrie artérielle au repos ; 60 mmHg correspond au coude de la courbe de dissociation, où la saturation vaut 90 %.</li><li>Type 1 hypoxémique, PaCO₂ normale ou basse : l’échangeur a cédé. Type 2 hypercapnique : la pompe ne ventile plus assez.</li><li>Temporalité : pH bas et bicarbonates peu élevés en aigu ; bicarbonates élevés et pH presque normal en chronique ; bicarbonates élevés et pH &lt; 7,35 dans l’acutisation.</li><li>Codage CIM-10-GM 2024 : J96.0 aiguë, J96.1 chronique, J96.9 sans précision ; cinquième caractère 0 (type I), 1 (type II), 9 ; deux codes pour une acutisation ; SDRA exclu (J80).</li><li>Normal : PaO₂ 90 à 110 mmHg chez l’adulte jeune, PaCO₂ 34 à 46 mmHg, PAO₂ ≈ 100 mmHg à l’air. La PaCO₂ double si la ventilation alvéolaire diminue de moitié ; la respiration rapide et superficielle augmente la part de l’espace mort.</li><li>Gradient normal : hypoventilation (PaCO₂ haute) ou altitude (PaCO₂ basse). Gradient élevé : inadéquation ventilation/perfusion ou diffusion, qui répondent à l’oxygène, ou shunt, qui y résiste.</li><li>L’hypercapnie naît d’un déséquilibre entre commande, capacité et charge (résistive, élastique, pression expiratoire positive intrinsèque). Elle commence la nuit et s’aggrave sur un facteur déclenchant : infection, insuffisance cardiaque, embolie, sédatif ou oxygène sans cible.</li><li>Plus l’atteinte est proximale sur le trajet de la commande, plus l’insuffisance est hypercapnique ; une hypoxémie avec radiographie claire évoque embolie, obstruction, hypoventilation ou shunt intracardiaque.</li></ul></template>
<template data-pop="pareto-j96-clin" data-title="Pareto — Clinique et démarche diagnostique"><p class="ratio" data-cover="j96-6,j96-7"></p><ul><li>La gravité se lit sur la pompe : fréquence &gt; 30 par minute, tirage, parole hachée, respiration paradoxale, bradypnée secondaire et baisse de vigilance annoncent l’arrêt.</li><li>Hypoxémie : tachypnée, tachycardie, confusion ; cyanose tardive, absente chez l’anémique. Hypercapnie : céphalées, sueurs, vasodilatation, somnolence, astérixis.</li><li>Chronicité : cœur pulmonaire, polyglobulie, céphalées matinales et sommeil non réparateur.</li><li>Stabiliser, mesurer, classer, expliquer : gazométrie chez tout patient grave, désaturant ou à risque d’hypercapnie, avec FiO₂ notée ; type, temporalité, gradient, rapport PaO₂/FiO₂ (&lt; 300 mmHg) et lactate.</li><li>Radiographie, échographie pulmonaire, électrocardiogramme et examens ciblés désignent la cause ; une hypercapnie sans maladie bronchique fait chercher un toxique, une atteinte neuromusculaire ou une obésité avec hypoventilation.</li></ul></template>
<template data-pop="pareto-j96-tt" data-title="Pareto — Urgence, oxygène et supports ventilatoires"><p class="ratio" data-cover="j96-8,j96-9,j96-10,j96-11"></p><ul><li>Escalade immédiate : fréquence &gt; 30 avec lutte, respiration paradoxale, vigilance altérée, SpO₂ &lt; 85 % sous oxygène, pH &lt; 7,25 ou instabilité.</li><li>L’oxygène se prescrit avec une cible : 94–98 %, ou 88–92 % en cas de BPCO, mucoviscidose, maladie neuromusculaire, déformation thoracique ou obésité morbide. Réservoir à 15 L/min si état critique ; lunettes 2–6 L/min ou masque 5–10 L/min ; Venturi 24 % à 2–3 L/min ou 28 % à 4 L/min si risque d’hypercapnie.</li><li>Gazométrie à 30–60 minutes chez le patient à risque ; jamais d’arrêt brutal (hypoxémie de rebond). La titration a réduit la mortalité de la BPCO (Austin, 9 % contre 2 %).</li><li>Hypoxémie aiguë non hypercapnique : haut débit nasal (jusqu’à 60 L/min, FiO₂ 0,21 à 1,0) selon l’ERS 2022 ; indice ROX ≥ 4,88 rassurant, &lt; 3,47 à 6 heures prédictif d’échec.</li><li>Ventilation non invasive : forte dans la BPCO avec pH ≤ 7,35 (mortalité RR 0,63) et dans l’œdème cardiogénique ; IPAP 15 puis 20–30 cm H₂O, EPAP ≥ 3 ; jugée à une ou deux heures ; pH &lt; 7,25 et fréquence &gt; 35 persistants annoncent l’échec.</li><li>Intubation : arrêt imminent, détresse sévère, échec ou contre-indication du support, pH &lt; 7,15 persistant, score de Glasgow &lt; 8 ; chez l’obstructif, fréquence 10–15, rapport inspiration/expiration ≥ 1/3, pH toléré à 7,20–7,25.</li></ul></template>
<template data-pop="pareto-j96-crit" data-title="Pareto — Chronicité, suivi et critères"><p class="ratio" data-cover="j96-12,j96-13,j96-14"></p><ul><li>L’hypoxémie chronique entraîne hypertension pulmonaire, cœur pulmonaire et polyglobulie : la corriger prolonge la vie (essais du Medical Research Council et NOTT), sans bénéfice dans la désaturation modérée (LOTT).</li><li>Oxygène de longue durée : PaO₂ de repos ≤ 55 mmHg, ou &lt; 60 mmHg avec cœur pulmonaire ou polyglobulie, en état stable, mesures répétées ; au moins 15 heures par jour (16 heures selon le formulaire de la Ligue pulmonaire) ; tabagisme incompatible.</li><li>Ventilation à domicile (Société suisse de pneumologie 2020) : BPCO avec PaCO₂ &gt; 7 kPa stable ou persistante 2 à 4 semaines après l’épisode ; syndrome obésité-hypoventilation après étude du sommeil ; maladies neuromusculaires dès les symptômes avec capacité vitale &lt; 50 % ou PImax/SNIP &lt; 40 cm H₂O.</li><li>Suivi : gazométrie 2 à 4 semaines après une exacerbation hypercapnique, carte d’alerte, sevrage tabagique, réadaptation. Grossesse : PaCO₂ normale ≈ 30 mmHg. Monoxyde de carbone : SpO₂ faussement normale.</li><li>Codage : J96.0, J96.1 ou J96.9 avec le cinquième caractère du type ; deux codes en cas d’acutisation.</li></ul></template>
