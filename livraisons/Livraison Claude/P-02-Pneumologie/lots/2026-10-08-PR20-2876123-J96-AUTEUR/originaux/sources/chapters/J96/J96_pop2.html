<template data-pop="j96-oxymetrie-limites" data-title="Oxymétrie de pouls : principe et limites"><p class="lab">Principe</p><p>Le capteur émet une lumière rouge et une lumière infrarouge ; l’oxyhémoglobine et la désoxyhémoglobine les absorbent différemment. Le rapport des absorptions de la composante pulsatile donne la SpO₂.</p><p class="lab">Fiabilité</p><p>L’écart avec la SaO₂ mesurée atteint couramment plusieurs points ; la cible de 94 à 98 % intègre cette marge. La valeur affichée suit la saturation réelle avec un retard de quelques secondes à quelques dizaines de secondes.</p><p class="lab">Causes d’erreur</p><p>Une mauvaise perfusion, le froid, le mouvement, un vernis foncé, la COHb, la MetHb et une peau fortement pigmentée faussent la mesure.</p><div class="key"><b>Limite essentielle.</b> L’oxymètre ne mesure ni la PaCO₂, ni le contenu en oxygène, ni l’apport tissulaire : une anémie ou une hypoventilation sous oxygène lui échappent.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 7</a>.</p></template>
<template data-pop="j96-gaz-prelevement" data-title="Prélever une gazométrie artérielle"><p class="lab">Technique</p><p>Le médecin ponctionne l’artère radiale, après vérification de la circulation collatérale de la main, avec une seringue héparinée ; une anesthésie locale réduit la douleur. L’artère fémorale ou humérale sert en second recours.</p><p class="lab">Erreurs pré-analytiques</p><p>Une bulle d’air élève la PaO₂ et abaisse la PaCO₂ ; un délai d’analyse prolongé laisse les leucocytes consommer l’oxygène ; un excès d’héparine dilue l’échantillon. La FiO₂, le dispositif et l’heure du dernier changement d’oxygène sont notés.</p><p class="lab">Alternative</p><p>La BTS admet la gazométrie capillaire artérialisée au lobe de l’oreille pour suivre le pH et la PaCO₂, moins douloureuse ; elle sous-estime la PaO₂.</p><div class="key"><b>Limite.</b> La valeur prédictive du test d’Allen pour prévenir une ischémie de la main reste discutée ; les complications graves sont rares.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, section 7.1.3</a>.</p></template>
<template data-pop="j96-gaz-veineux" data-title="Gazométrie veineuse"><p class="lab">Ce qu’elle apporte</p><p>Le pH veineux est proche du pH artériel, un peu plus bas. La PvCO₂ est en moyenne de quelques mmHg plus élevée que la PaCO₂, avec une variation individuelle large.</p><p class="lab">Usage</p><p>Une PvCO₂ normale rend une hypercapnie artérielle peu probable et sert de dépistage. Une PvCO₂ élevée doit être confirmée sur sang artériel avant toute décision de ventilation.</p><div class="key"><b>Limite.</b> La pression veineuse en oxygène ne renseigne pas sur l’oxygénation artérielle ; la gazométrie veineuse ne permet ni le gradient ni le rapport PaO₂/FiO₂.</div></template>
<template data-pop="j96-radiographie" data-title="Radiographie thoracique dans l’insuffisance respiratoire"><p class="lab">Poumon blanc</p><p>Des opacités alvéolaires localisées évoquent une pneumonie ou une atélectasie ; bilatérales, un œdème cardiogénique, un SDRA ou une hémorragie alvéolaire.</p><p class="lab">Poumon clair</p><p>Une hypoxémie avec radiographie normale oriente vers une embolie pulmonaire, une obstruction bronchique, une hypoventilation ou un shunt intracardiaque.</p><p class="lab">Autres signes</p><p>Le cliché montre aussi un pneumothorax, un épanchement pleural, une distension thoracique, les coupoles surélevées d’une paralysie diaphragmatique ou une cardiomégalie.</p><div class="key"><b>Limite.</b> Le cliché au lit, de face et en décubitus, manque de sensibilité pour le pneumothorax et l’épanchement ; l’échographie et la tomodensitométrie le complètent.</div></template>
<template data-pop="j96-pression-muscles" data-title="Mesurer la force de la pompe"><p class="lab">PImax et SNIP</p><p>La PImax mesure la pression négative maximale produite à la bouche contre une valve fermée ; la SNIP la mesure dans une narine pendant un reniflement maximal. Une PImax supérieure à 80 cm H₂O exclut en règle une faiblesse inspiratoire cliniquement importante.</p><p class="lab">Capacité vitale assis et couché</p><p>En décubitus, le contenu abdominal repousse un diaphragme faible : une chute nette de la capacité vitale couchée oriente vers une faiblesse diaphragmatique.</p><p class="lab">Seuils décisionnels</p><p>La Société suisse de pneumologie retient, dans les maladies neuromusculaires, une capacité vitale inférieure à 50 % de la valeur prédite ou une PImax ou SNIP inférieure à 40 cm H₂O comme indication physiologique de ventilation à domicile.</p><div class="key"><b>Limite.</b> Ces tests dépendent de l’effort et de la technique : une valeur basse isolée peut refléter une mauvaise coopération, d’où l’intérêt de combiner plusieurs mesures.</div><p class="src">Références : <a href="https://doi.org/10.1164/rccm.166.4.518" target="_blank" rel="noopener">ATS/ERS 2002</a> ; <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-polygraphie" data-title="Explorer la respiration nocturne"><p class="lab">Examens</p><p>L’oxymétrie nocturne dépiste les désaturations ; la polygraphie ventilatoire enregistre aussi les débits et les efforts ; la polysomnographie ajoute le sommeil. La capnographie transcutanée suit le dioxyde de carbone toute la nuit.</p><p class="lab">Critères d’hypoventilation</p><p>Selon l’American Academy of Sleep Medicine, repris par la Société suisse de pneumologie : PtcCO₂ ≥ 55 mmHg pendant plus de 10 minutes, ou hausse d’au moins 10 mmHg par rapport à l’éveil jusqu’à plus de 50 mmHg pendant plus de 10 minutes.</p><p class="lab">Indications</p><p>Ces examens sont indiqués dans les maladies neuromusculaires et de la paroi, l’obésité avec suspicion d’hypoventilation, la BPCO avec apnées associées, les céphalées matinales et l’hypercapnie inexpliquée.</p><div class="key"><b>Limite.</b> L’oxymétrie seule ne distingue pas une apnée obstructive d’une hypoventilation ; le dioxyde de carbone doit être mesuré.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-peau-pigmentee" data-title="Oxymétrie et peau fortement pigmentée"><p class="lab">Constat</p><p>Dans l’étude de Sjoding, chez des adultes hospitalisés avec une SpO₂ de 92 à 96 %, une SaO₂ inférieure à 88 % était retrouvée dans 11,7 % des mesures chez les patients noirs contre 3,6 % chez les patients blancs ; dans la cohorte multicentrique, 17,0 % contre 6,2 %.</p><p class="lab">Mécanisme</p><p>La mélanine absorbe une partie de la lumière émise, et les algorithmes ont été étalonnés surtout chez des volontaires à peau claire : la saturation est surestimée.</p><p class="lab">Conséquence clinique</p><p>Chez un patient à peau fortement pigmentée, une SpO₂ limite ne rassure pas ; une gazométrie artérielle s’impose avant de réduire l’oxygène ou d’écarter une insuffisance respiratoire.</p><div class="key"><b>Limite.</b> Tous les patients concernés n’ont pas d’hypoxémie occulte ; l’oxymétrie reste utile pour suivre une tendance.</div><p class="src">Référence : <a href="https://doi.org/10.1056/NEJMc2029240" target="_blank" rel="noopener">Sjoding et al., New England Journal of Medicine 2020</a>.</p></template>
<template data-pop="j96-capnographie" data-title="Capnographie et EtCO₂"><p class="lab">Principe</p><p>Un capteur infrarouge mesure le dioxyde de carbone expiré ; la valeur de fin d’expiration, EtCO₂, reflète le gaz alvéolaire.</p><p class="lab">Écart avec la PaCO₂</p><p>Chez le sujet sain, l’EtCO₂ est un peu inférieure à la PaCO₂. L’écart augmente avec l’espace mort : BPCO, embolie pulmonaire, bas débit cardiaque. La Société suisse de pneumologie la juge peu fiable pour suivre l’hypoventilation de l’adulte.</p><p class="lab">Usages</p><p>Elle confirme l’intubation, surveille la sédation et détecte précocement une apnée.</p><div class="key"><b>Limite.</b> Une EtCO₂ normale n’exclut pas une hypercapnie chez le patient obstructif ; la gazométrie tranche.</div><p class="src">Référence : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a>.</p></template>
<template data-pop="j96-transcutane" data-title="Capnographie transcutanée"><p class="lab">Principe</p><p>Une électrode chauffée dilate les capillaires cutanés ; le dioxyde de carbone diffuse à travers la peau et donne la PtcCO₂.</p><p class="lab">Usages</p><p>Elle permet un suivi continu et non invasif, surtout nocturne : diagnostic de l’hypoventilation du sommeil, réglage et contrôle de la ventilation à domicile, sevrage d’une ventilation non invasive.</p><div class="key"><b>Limite.</b> La mesure suit la PaCO₂ avec quelques minutes de retard et peut dériver ; elle sert à suivre une tendance et se confronte à une gazométrie.</div><p class="src">Références : <a href="https://doi.org/10.1159/000510086" target="_blank" rel="noopener">Société suisse de pneumologie 2020</a> ; <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-o2-medicament" data-title="L’oxygène comme médicament"><p class="lab">Statut</p><p>En Suisse, l’oxygène médicinal est un médicament enregistré, présenté comme oxygène à 100 % pour inhalation. La monographie suisse n’a pas pu être consultée le 08.10.2026 ; les règles d’emploi ci-dessous proviennent de la BTS.</p><p class="lab">Indication</p><p>L’oxygène est indiqué dans l’hypoxémie, non dans la dyspnée. Il n’a pas montré de bénéfice sur la dyspnée du patient non hypoxémique.</p><p class="lab">Dose et surveillance</p><p>La dose est la FiO₂, ou le débit associé au dispositif, qui atteint la cible prescrite. La surveillance associe la SpO₂, la fréquence respiratoire, la vigilance et la gazométrie chez le patient à risque. Toute modification est signée et tracée.</p><div class="key"><b>Limite.</b> L’oxygène traite l’hypoxémie, jamais sa cause ; une hausse des besoins impose de rechercher une aggravation.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017</a>.</p></template>
<template data-pop="j96-toxicite-o2" data-title="Toxicité de l’oxygène"><p class="lab">Atélectasies de résorption</p><p>Une FiO₂ élevée remplace l’azote alvéolaire ; l’oxygène, absorbé rapidement, laisse se collaber les alvéoles mal ventilées.</p><p class="lab">Radicaux libres</p><p>Une hyperoxie prolongée accroît la production d’espèces réactives de l’oxygène, qui lèsent l’épithélium alvéolaire.</p><p class="lab">Effets circulatoires</p><p>L’hyperoxie contracte les artères coronaires et cérébrales et peut diminuer le débit cardiaque : elle n’apporte rien au patient non hypoxémique atteint d’infarctus ou d’accident vasculaire cérébral.</p><div class="key"><b>Limite.</b> L’importance clinique de chacun de ces effets reste incertaine en dehors des situations extrêmes ; la surmortalité globale de l’hyperoxie est, elle, démontrée.</div><p class="src">Références : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, sections 4.3 et 6.3</a> ; <a href="https://doi.org/10.1016/S0140-6736(18)30479-3" target="_blank" rel="noopener">IOTA 2018</a>.</p></template>
<template data-pop="j96-bleomycine" data-title="Bléomycine et paraquat"><p class="lab">Mécanisme</p><p>La bléomycine et le paraquat produisent des radicaux libres dans le poumon ; l’oxygène fournit le substrat de cette production et aggrave les lésions alvéolaires.</p><p class="lab">Conduite</p><p>La BTS ne donne l’oxygène que si la SpO₂ descend au-dessous de 85 % et le réduit ou l’arrête si elle dépasse 88 %.</p><div class="key"><b>Piège.</b> L’antécédent de bléomycine doit être recherché avant une anesthésie ou une oxygénothérapie, car le risque persiste après le traitement.</div><p class="src">Référence : <a href="https://www.brit-thoracic.org.uk/quality-improvement/guidelines/emergency-oxygen/" target="_blank" rel="noopener">BTS 2017, recommandation F16</a>.</p></template>
<template data-pop="j96-morphine-vni" data-title="Morphine sous ventilation non invasive"><p class="lab">Indication</p><p>La morphine se discute chez le patient agité, en détresse ou tachypnéique sous ventilation non invasive, chez qui l’angoisse et la dyspnée compromettent la tolérance du masque.</p><p class="lab">Posologie de référence</p><p>La BTS et l’Intensive Care Society proposent, en bonne pratique, une morphine intraveineuse de 2,5 à 5 mg, avec ou sans benzodiazépine.</p><p class="lab">Mécanisme</p><p>La morphine diminue la perception de la dyspnée et la fréquence respiratoire ; l’expiration s’allonge, ce qui peut réduire la distension.</p><div class="key"><b>Risque.</b> Elle déprime la commande ventilatoire : elle n’est administrée que sous surveillance étroite, dans un lieu où l’intubation est possible, sauf si l’objectif est palliatif.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016</a>.</p></template>
<template data-pop="j96-sedation-intubation" data-title="Induction et sédation autour de l’intubation"><p class="lab">Préoxygénation</p><p>Le haut débit nasal ou la ventilation non invasive sont appliqués avant l’induction, pour retarder la désaturation pendant l’apnée.</p><p class="lab">Induction</p><p>L’hypnotique est choisi pour sa tolérance hémodynamique ; un curare facilite l’intubation. Remplissage et vasopresseur sont prêts, car l’induction et la pression positive font chuter la pression artérielle.</p><p class="lab">Sédation ensuite</p><p>La BTS recommande de titrer la sédation vers un niveau de vigilance défini et de passer dès que possible à un mode assisté pour en réduire les besoins.</p><div class="key"><b>Limite.</b> Les molécules et les doses relèvent des protocoles d’anesthésie et de réanimation et de l’information professionnelle suisse.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016, recommandation 18</a>.</p></template>
<template data-pop="j96-acetazolamide" data-title="Acétazolamide et alcalose métabolique"><p class="lab">Mécanisme</p><p>L’acétazolamide inhibe l’anhydrase carbonique : il augmente l’excrétion rénale de bicarbonates, abaisse le pH et stimule la ventilation.</p><p class="lab">Tentation</p><p>Chez un patient hypercapnique dont les diurétiques ou les corticostéroïdes ont créé une alcalose métabolique, abaisser les bicarbonates paraît logique.</p><p class="lab">Preuves</p><p>Un essai français de 2016 publié dans JAMA, chez des patients ventilés atteints de BPCO, n’a pas réduit significativement la durée de ventilation invasive. La BTS et l’Intensive Care Society déconseillent son usage de routine.</p><div class="key"><b>Risque.</b> Chez un patient incapable d’augmenter sa ventilation, l’acidose induite s’ajoute à l’acidose respiratoire.</div><p class="src">Référence : <a href="https://doi.org/10.1136/thoraxjnl-2015-208209" target="_blank" rel="noopener">BTS et Intensive Care Society 2016, recommandation 16</a>.</p></template>
<template data-pop="pareto-j96-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j96-e-1,j96-e-2,j96-e-3,j96-e-4"></p><ul><li>La gazométrie artérielle, avec sa FiO₂, est l’examen de référence ; la SpO₂ dépiste mais ne mesure ni le dioxyde de carbone ni le contenu en oxygène ; une PvCO₂ normale rend une hypercapnie peu probable.</li><li>Erreurs de prélèvement : bulle d’air, délai d’analyse, FiO₂ non notée. Le capillaire artérialisé suit le pH et la PaCO₂ mais sous-estime la PaO₂.</li><li>Lecture : conditions, pH, PaCO₂, bicarbonates (aigu + 1, chronique + 3 à 4 par 10 mmHg ; valeur intermédiaire = acutisation), gradient (PAO₂ = FiO₂ × 713 − PaCO₂/0,8), lactate et trou anionique.</li><li>La SpO₂ trompe en cas de mauvaise perfusion, de COHb, de MetHb ou de peau pigmentée (hypoxémie occulte près de trois fois plus fréquente) ; l’EtCO₂ sous-estime la PaCO₂ si l’espace mort augmente ; la PtcCO₂ suit une tendance.</li><li>Imagerie et échographie pour la cause ; capacité vitale assis et couché, PImax (&gt; 80 cm H₂O rassurante) et capnographie nocturne (PtcCO₂ ≥ 55 mmHg plus de 10 minutes) pour la pompe.</li><li>Une PaCO₂ « normale » dans une acidose métabolique profonde annonce l’épuisement.</li></ul></template>
<template data-pop="pareto-j96-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j96-p-1,j96-p-2,j96-p-3,j96-p-4"></p><ul><li>L’oxygène est un médicament : indication hypoxémie, dose titrée vers une cible, surveillance tracée ; seuls le Venturi (24 à 60 %) et le haut débit délivrent une FiO₂ connue ; masque simple jamais au-dessous de 5 L/min.</li><li>L’excès d’oxygène provoque hypercapnie chez le patient à risque et surmortalité chez les autres patients aigus (IOTA, RR 1,21) ; atélectasies de résorption ; après bléomycine ou paraquat, oxygène seulement si SpO₂ &lt; 85 %.</li><li>Sédatifs et opioïdes exigent une surveillance continue ; morphine 2,5 à 5 mg par voie intraveineuse pour la tolérance de la ventilation non invasive ; perfusions sédatives en soins intermédiaires ou intensifs ; pas d’acétazolamide de routine.</li><li>Le support gagne du temps ; le traitement de la cause (J44, J45, J18, I26, insuffisance cardiaque, naloxone, électrolytes) guérit.</li></ul></template>
