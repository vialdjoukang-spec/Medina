<template data-pop="j86-echographie" data-title="Échographie thoracique"><p class="lab">Technique</p><p>Sonde convexe, patient assis, exploration des récessus postérieurs et latéraux de chaque hémithorax.</p><p class="lab">Ce qu’elle montre</p><p>Le volume du liquide, son échogénicité, les cloisons, l’épaississement pleural, la position du diaphragme et des organes sous-jacents. Un liquide échogène ou cloisonné est presque toujours un exsudat ; un liquide anéchogène peut être simple ou infecté.</p><p class="lab">Usage</p><p>La BTS 2023 exige, par une recommandation forte, que toute ponction pleurale soit guidée par l’imagerie, car ce guidage réduit les complications.</p><div class="key"><b>Piège.</b> L’absence de cloisons n’exclut pas une infection ; seule la ponction mesure le pH.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-tdm" data-title="Scanner thoracique injecté"><p class="lab">Signes de l’empyème</p><p>Collection lenticulaire, rehaussement des feuillets pariétal et viscéral qui se séparent autour du liquide (signe de la plèvre dédoublée), épaississement de la graisse extrapleurale.</p><p class="lab">Apports</p><p>Il dénombre les logettes, guide un drain, montre la pneumonie, un abcès, une tumeur, une perforation œsophagienne ou une collection médiastinale.</p><p class="lab">Limite</p><p>Le rehaussement pleural n’est pas spécifique de l’infection ; il s’observe aussi dans les épanchements tumoraux.</p></template>
<template data-pop="j86-ponction" data-title="Ponction pleurale diagnostique"><p class="lab">Technique</p><p>Ponction guidée par échographie, au bord supérieur de la côte pour éviter le paquet vasculonerveux intercostal.</p><p class="lab">Prélèvements</p><p>Une seringue pour le pH, sans héparine résiduelle ni anesthésique local, analysée immédiatement sur un analyseur de gaz du sang. Des tubes pour glucose, lactate déshydrogénase, protéines, cytologie, Gram et culture. Des flacons d’hémoculture inoculés au lit du patient, ce que la BTS recommande fortement, car ils préservent les germes exigeants.</p><p class="lab">Lecture</p><p>Le premier résultat est l’aspect : un pus franc dispense du pH et indique le drain.</p><div class="key"><b>Erreur fréquente.</b> Envoyer le pH au laboratoire central après une heure : le dioxyde de carbone s’échappe et le pH monte faussement.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-seuils-ph" data-title="Mesure et seuils du pH pleural"><p class="lab">Seuils BTS 2023</p><p>pH ≤ 7,2 : risque élevé d’épanchement compliqué, drain indiqué. pH entre 7,2 et 7,4 : risque intermédiaire, lactate déshydrogénase et contexte décident. pH ≥ 7,4 : risque faible, pas de drain immédiat.</p><p class="lab">Fiabilité</p><p>L’héparine et la lidocaïne, acides, abaissent faussement le pH ; un délai d’analyse l’augmente par perte de dioxyde de carbone. Les bandelettes urinaires et les pH-mètres de laboratoire sont imprécis.</p><p class="lab">Conséquence pratique</p><p>La mesure se fait immédiatement sur un analyseur de gaz du sang. Si elle n’est pas disponible, un glucose &lt; 3,3 mmol/L sert de substitut.</p><div class="key"><b>Note de source.</b> La BTS 2023 écrit « ≤ 7,2 » ; d’autres textes écrivent « &lt; 7,2 ». La recommandation la plus récente est retenue.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-ldh" data-title="Lactate déshydrogénase pleurale"><p class="lab">Origine</p><p>Enzyme intracellulaire libérée par les cellules détruites ; sa concentration reflète l’intensité de la lyse cellulaire, donc de l’inflammation.</p><p class="lab">Usage</p><p>Elle classe le liquide en exsudat (critères de Light) et, pour un pH entre 7,2 et 7,4, une valeur supérieure à 900 UI/L fait envisager un drain selon la BTS 2023.</p><p class="lab">Limite</p><p>Elle est élevée dans d’autres exsudats, en particulier tumoraux ; elle ne s’interprète qu’avec le pH, le glucose et la clinique.</p></template>
<template data-pop="j86-glucose" data-title="Glucose pleural"><p class="lab">Normal</p><p>Le glucose pleural égale le glucose plasmatique, car il diffuse librement à travers la plèvre.</p><p class="lab">Mécanisme de la baisse</p><p>Les leucocytes et les bactéries le consomment ; la plèvre épaissie freine son entrée.</p><p class="lab">Seuils</p><p>Un glucose &lt; 3,3 mmol/L indique une forte probabilité d’infection pleurale lorsque le pH n’est pas disponible ; un glucose ≤ 4,0 mmol/L soutient l’indication de drain en zone intermédiaire (BTS 2023).</p><div class="key"><b>Piège.</b> La polyarthrite rhumatoïde abaisse fortement le glucose pleural sans infection.</div></template>
<template data-pop="j86-light" data-title="Critères de Light"><p class="lab">Règle</p><p>Un épanchement est un exsudat si au moins un critère est présent : protéines pleurales sur protéines sériques &gt; 0,5 ; lactate déshydrogénase pleurale sur sérique &gt; 0,6 ; lactate déshydrogénase pleurale supérieure aux deux tiers de la limite supérieure de la normale sérique.</p><p class="lab">Mécanisme</p><p>Un exsudat traduit une plèvre ou des capillaires lésés ; un transsudat traduit un déséquilibre de pression hydrostatique ou oncotique.</p><p class="lab">Limite</p><p>La règle est sensible mais classe à tort certains transsudats traités par diurétiques comme exsudats. Tout épanchement parapneumonique est un exsudat ; la question utile devient alors son caractère infecté.</p><p class="src">Références : <a href="https://doi.org/10.7326/0003-4819-77-4-507" target="_blank" rel="noopener">Light et al., 1972</a>.</p></template>
<template data-pop="j86-cancer-excave" data-title="Cancer bronchique excavé"><p class="lab">Arguments</p><p>Fumeur, âge supérieur à 40 ans, absence de terrain d’inhalation, peu de fièvre, amaigrissement, hippocratisme, paroi épaisse et irrégulière, absence de régression sous antibiotique. Le carcinome épidermoïde est le type histologique qui s’excave le plus souvent.</p><p class="lab">Mécanisme</p><p>La tumeur se nécrose en son centre, ou obstrue une bronche en amont de laquelle se forme un abcès.</p><p class="lab">Conduite</p><p>Bronchoscopie avec biopsie, ou biopsie transthoracique ; scanner de contrôle de toute cavité attribuée à un abcès.</p><div class="key"><b>Erreur fréquente.</b> Attribuer à un abcès une cavité qui ne régresse pas, chez un fumeur, sans contrôle endoscopique.</div></template>
<template data-pop="j86-tuberculose" data-title="Tuberculose cavitaire"><p class="lab">Arguments</p><p>Cavité des segments apicaux ou postérieurs des lobes supérieurs, évolution sur des semaines, sueurs nocturnes, amaigrissement, hémoptysies, origine d’une région de forte endémie, contact connu, immunodépression.</p><p class="lab">Conduite</p><p>Trois expectorations pour recherche de bacilles acido-alcoolo-résistants, culture et amplification génique ; isolement respiratoire jusqu’à exclusion.</p><p class="lab">Conséquence</p><p>Un empyème tuberculeux sort du code J86 (A15–A16). Un traitement antituberculeux ne s’improvise pas sur une simple cavité ; il suit la preuve microbiologique ou une décision spécialisée.</p></template>
<template data-pop="j86-empyeme-vs-abces" data-title="Empyème ou abcès : critères du scanner"><p class="lab">Empyème</p><p>Forme lenticulaire, angle obtus avec la paroi, paroi fine et régulière, plèvre dédoublée, poumon refoulé, vaisseaux déviés.</p><p class="lab">Abcès</p><p>Forme arrondie, angle aigu avec la paroi, paroi épaisse et irrégulière, au sein du parenchyme, vaisseaux interrompus au contact.</p><p class="lab">Conséquence pratique</p><p>L’empyème se draine par un drain thoracique ; l’abcès se traite d’abord par antibiotique, et un drain transpleural mal placé risque de créer une fistule bronchopleurale.</p></template>
<template data-pop="j86-mimes" data-title="Épanchements acides non infectieux"><p class="lab">Polyarthrite rhumatoïde</p><p>Épanchement chronique à pH et glucose très bas, parfois pseudochyleux, chez un patient connu pour une polyarthrite.</p><p class="lab">Cancer pleural avancé</p><p>Charge tumorale élevée qui consomme le glucose ; cytologie souvent positive ; pronostic défavorable.</p><p class="lab">Rupture œsophagienne</p><p>Douleur après vomissements, épanchement gauche, amylase salivaire élevée dans le liquide : urgence chirurgicale.</p><div class="key"><b>Conséquence.</b> La BTS rappelle de penser à ces diagnostics devant un liquide acide et cloisonné qui ne s’intègre pas dans une pneumonie.</div></template>
<template data-pop="j86-16s" data-title="Amplification de l’ADN ribosomique 16S"><p class="lab">Principe</p><p>Le gène de l’acide ribonucléique ribosomique 16S existe chez toutes les bactéries ; ses régions variables identifient l’espèce après amplification et séquençage.</p><p class="lab">Valeur</p><p>Elle identifie des bactéries tuées par un antibiotique préalable ou incultivables, notamment des anaérobies.</p><p class="lab">Limite</p><p>Elle ne donne pas d’antibiogramme et peut détecter des contaminants ; son résultat se confronte à la clinique.</p><p class="src">Références : <a href="https://doi.org/10.1164/rccm.200601-074OC" target="_blank" rel="noopener">Maskell et al., 2006</a>.</p></template>
<template data-pop="j86-drain" data-title="Drain thoracique de petit calibre"><p class="lab">Recommandation</p><p>La BTS 2023 recommande un drain de 14 F ou moins pour le drainage initial de l’infection pleurale, posé sous imagerie.</p><p class="lab">Justification</p><p>Les petits drains sont mieux tolérés et posés plus facilement ; avec des rinçages réguliers, ils évacuent le pus de manière comparable dans les données disponibles. Les drains plus gros provoquent davantage de douleur.</p><p class="lab">Surveillance</p><p>Débit, aspect, bullage, douleur, position à l’imagerie. Un drain qui ne débite plus avec une collection persistante est soit obstrué, soit mal placé, soit en face d’une collection cloisonnée.</p><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-iet" data-title="Alteplase et dornase intrapleurales"><p class="lab">Mécanisme</p><p>L’alteplase convertit le plasminogène en plasmine, qui dissout les cloisons de fibrine. La dornase coupe l’ADN extracellulaire et réduit la viscosité du pus.</p><p class="lab">Protocole BTS 2023</p><p>Alteplase 10 mg et dornase alfa 5 mg, deux fois par jour pendant trois jours. Une dose d’alteplase de 5 mg peut être aussi efficace selon des séries rétrospectives et convient aux patients à risque hémorragique, notamment sous anticoagulation qui ne peut être interrompue. Les détails pratiques suivent la déclaration BTS sur les procédures pleurales et le protocole local.</p><p class="lab">Indication</p><p>Collection résiduelle après arrêt du débit du drain initial. Recommandation conditionnelle, par consensus.</p><div class="key"><b>Contre-indications pratiques.</b> Fistule bronchopleurale, saignement actif, trouble majeur de l’hémostase. Le consentement est recueilli.</div><p class="src">Références : <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-mist2" data-title="Essai MIST2 (2011)"><p class="lab">Plan</p><p>Essai randomisé en double aveugle, plan factoriel 2 × 2, 210 patients dans 11 centres britanniques : placebo double, alteplase et dornase, alteplase seule, dornase seule, pendant trois jours.</p><p class="lab">Résultats</p><p>Baisse de l’opacité pleurale au septième jour : 29,5 % avec l’association contre 17,2 % sous placebo, différence de 7,9 points. Recours chirurgical à trois mois : 4 % contre 16 %. Durée d’hospitalisation réduite de 6,7 jours. Chaque molécule seule n’a pas fait mieux que le placebo ; la dornase seule a augmenté le recours chirurgical (39 %).</p><p class="lab">Limites</p><p>Critère principal radiologique ; essai non dimensionné pour la mortalité.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa1012740" target="_blank" rel="noopener">Rahman et al., New England Journal of Medicine 2011;365:518-26</a>.</p></template>
<template data-pop="j86-mist1" data-title="Essai MIST1 (2005)"><p class="lab">Plan</p><p>454 patients atteints d’infection pleurale, streptokinase intrapleurale 250 000 UI deux fois par jour pendant trois jours contre placebo.</p><p class="lab">Résultat</p><p>Décès ou chirurgie à trois mois : 31 % sous streptokinase contre 27 % sous placebo. Aucun bénéfice sur la mortalité, la chirurgie, l’image ou la durée d’hospitalisation ; plus d’effets indésirables graves.</p><p class="lab">Leçon</p><p>Dissoudre la fibrine ne suffit pas : la viscosité due à l’ADN persiste. Cette hypothèse a conduit à MIST2.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa042473" target="_blank" rel="noopener">Maskell et al., New England Journal of Medicine 2005</a>.</p></template>
<template data-pop="j86-vats" data-title="Chirurgie thoracique vidéo-assistée"><p class="lab">Gestes</p><p>Débridement des logettes, lavage de la cavité et, si le poumon est trappé, décortication.</p><p class="lab">Place</p><p>La BTS 2023 ne recommande pas la chirurgie d’emblée à la place du drain. Elle préfère la voie vidéo-assistée à la thoracotomie lorsque la chirurgie est nécessaire et qu’elle permet un nettoyage complet.</p><p class="lab">Indications habituelles</p><p>Sepsis persistant malgré drainage et enzymes, collection organisée, poumon trappé symptomatique, fistule.</p><div class="key"><b>Limite.</b> L’ERS/ESTS insiste sur un avis chirurgical précoce ; le moment optimal reste mal défini par les essais.</div></template>
<template data-pop="j86-antibio-pleural" data-title="Antibiothérapie de l’infection pleurale"><p class="lab">Principe</p><p>Couvrir les streptocoques et les anaérobies dans l’infection communautaire ; élargir au staphylocoque résistant et aux bacilles à Gram négatif dans l’infection nosocomiale.</p><p class="lab">Justification</p><p>La série de Maskell montre environ 50 % de streptocoques et 20 % d’anaérobies dans les infections communautaires, et 60 % de bactéries souvent résistantes dans les infections nosocomiales.</p><p class="lab">Choix pratiques</p><p>Amoxicilline-acide clavulanique ; ou céphalosporine associée au métronidazole ; clindamycine en cas d’allergie sévère. Un macrolide n’est ajouté que si un germe atypique est suspecté. Les aminosides sont évités.</p><div class="key"><b>Note suisse.</b> Les recommandations de la Société suisse d’infectiologie n’ont pas pu être consultées en texte intégral pour cette indication ; le protocole hospitalier local prime.</div></template>
<template data-pop="j86-duree" data-title="Durée de l’antibiothérapie pleurale"><p class="lab">Données</p><p>Aucun grand essai n’a fixé la durée. L’essai pilote SLIM (50 patients médicalement stables, score RAPID ≤ 4) a comparé 14 à 21 jours à 28 à 42 jours : échec chez 16,7 % contre 12,5 %, différence non significative.</p><p class="lab">Pratique</p><p>La durée se décide sur le contrôle de la source, la clinique et l’imagerie ; elle se compte en semaines, avec un relais oral précoce.</p><p class="lab">Limite</p><p>SLIM était trop petit pour démontrer l’équivalence ; il ne s’applique pas aux patients opérés ou instables.</p><p class="src">Références : <a href="https://doi.org/10.1183/23120541.00635-2022" target="_blank" rel="noopener">Hassan et al., essai SLIM, European Respiratory Journal Open Research 2023</a>.</p></template>
<template data-pop="j86-antibio-abces" data-title="Antibiothérapie de l’abcès pulmonaire"><p class="lab">Choix</p><p>Couverture anaérobie et streptococcique : amoxicilline-acide clavulanique en première intention, clindamycine en cas d’allergie. Les aminosides diffusent mal dans la paroi chronique et sont évités.</p><p class="lab">Durée</p><p>Voie intraveineuse pendant 5 à 21 jours selon l’évolution, puis relais oral, pour un total de 28 à 48 jours dans les séries citées ; poursuite jusqu’à disparition de la fièvre et de l’expectoration purulente.</p><p class="lab">Réponse attendue</p><p>Amélioration en 3 à 4 jours, défervescence en 4 à 7 jours ; normalisation radiologique en environ deux mois.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-drainage-abces" data-title="Drainage percutané et chirurgie de l’abcès"><p class="lab">Indications</p><p>Échec de l’antibiothérapie, abcès volumineux ou sous tension, sepsis persistant. Le drainage percutané est nécessaire chez environ 11 à 21 % des patients après échec antibiotique.</p><p class="lab">Résultats</p><p>Il est définitif chez environ 84 % des patients drainés, au prix d’environ 16 % de complications : pneumothorax, hémorragie, fistule bronchopleurale.</p><p class="lab">Chirurgie</p><p>Résection chez environ 10 % des patients : hémoptysie grave, échec au-delà de six semaines, suspicion de cancer, cavité de plus de 6 cm, rupture dans la plèvre.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-mediastinite" data-title="Médiastinite nécrosante descendante"><p class="lab">Anatomie</p><p>Les espaces cervicaux profonds communiquent avec le médiastin, notamment l’espace rétropharyngé. Une infection dentaire ou amygdalienne y descend par gravité et par la pression négative intrathoracique.</p><p class="lab">Clinique</p><p>Douleur et tuméfaction cervicales, trismus, dysphagie, puis douleur thoracique, dyspnée et sepsis.</p><p class="lab">Conduite</p><p>Scanner cervicothoracique injecté, antibiotiques à large spectre couvrant aérobies et anaérobies, drainage chirurgical précoce cervical et thoracique ; prise en charge pluridisciplinaire.</p><div class="key"><b>Autres causes de J85.3.</b> Perforation de l’œsophage, infection après sternotomie.</div><p class="src">Références : <a href="https://doi.org/10.21037/med-24-29" target="_blank" rel="noopener">Chaulk et al., 2025</a>.</p></template>
<template data-pop="j86-co-amoxi" data-title="Amoxicilline-acide clavulanique"><p class="lab">Mécanisme</p><p>L’amoxicilline inhibe la synthèse de la paroi bactérienne ; l’acide clavulanique inhibe les bêta-lactamases de nombreux anaérobies et staphylocoques sensibles à la méticilline.</p><p class="lab">Posologie suisse</p><p>Voie intraveineuse : 2,2 g trois à quatre fois par jour dans les infections sévères (Co-Amoxicillin Labatec). Voie orale : 1 g deux à trois fois par jour (Augmentin 1 g). Les indications suisses incluent les infections respiratoires basses et l’empyème pour la forme parentérale.</p><p class="lab">Effets indésirables et contre-indications</p><p>Diarrhée, éruption, hépatite cholestatique ; contre-indiquée après un ictère ou une atteinte hépatique sous un traitement antérieur par cette association, et en cas de mononucléose.</p><p class="lab">Surveillance</p><p>Fonction rénale pour l’adaptation des doses ; tests hépatiques lors d’un traitement de plusieurs semaines.</p><p class="src">Références : <a href="https://compendium.ch/de/product/1505973-co-amoxicillin-labatec-trockensub-2-2-g" target="_blank" rel="noopener">Compendium, Co-Amoxicillin Labatec 2,2 g, consulté le 08.10.2026</a> ; <a href="https://compendium.ch/de/product/2624-augmentin-filmtabl-1-g-erw" target="_blank" rel="noopener">Compendium, Augmentin 1 g, consulté le 08.10.2026</a>.</p></template>
<template data-pop="j86-metronidazole" data-title="Métronidazole"><p class="lab">Mécanisme</p><p>Réduit dans les bactéries anaérobies, il forme des dérivés qui fragmentent leur ADN ; il est inactif sur les aérobies.</p><p class="lab">Place</p><p>Associé à une céphalosporine pour couvrir les anaérobies quand l’aminopénicilline ne convient pas.</p><p class="lab">Risques</p><p>Goût métallique, troubles digestifs, neuropathie lors de traitements prolongés ; réaction possible avec l’alcool ; potentialisation des antivitamines K. La posologie suit l’information professionnelle du produit choisi.</p></template>
<template data-pop="j86-clindamycine" data-title="Clindamycine"><p class="lab">Mécanisme</p><p>Lincosamide qui inhibe la sous-unité ribosomique 50S ; active sur les anaérobies et les cocci à Gram positif.</p><p class="lab">Place</p><p>Alternative en cas d’allergie sévère aux bêta-lactamines, surtout dans l’abcès pulmonaire. Schéma cité : 600 mg par voie intraveineuse toutes les 8 heures, puis 300 mg par voie orale toutes les 8 heures.</p><p class="lab">Risque majeur</p><p>Colite à <i>Clostridioides difficile</i> ; une diarrhée sous traitement impose une recherche de toxines.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="j86-alteplase" data-title="Alteplase"><p class="lab">Mécanisme</p><p>Activateur tissulaire du plasminogène recombinant ; il convertit le plasminogène lié à la fibrine en plasmine.</p><p class="lab">Indications autorisées</p><p>Thrombolyse de l’infarctus du myocarde, de l’embolie pulmonaire massive instable et de l’accident vasculaire cérébral ischémique. L’usage intrapleural est hors indication.</p><p class="lab">Usage intrapleural</p><p>10 mg deux fois par jour pendant trois jours avec la dornase ; 5 mg en cas de risque hémorragique (BTS 2023).</p><p class="lab">Risque</p><p>Hémothorax ; passage systémique faible, mais anticoagulants et antiagrégants augmentent le risque.</p><div class="key"><b>Accès à la monographie.</b> L’information professionnelle suisse n’a pas pu être consultée le 08.10.2026 (recherche Compendium soumise à connexion) ; le résumé britannique mis à jour le 08.05.2026 a été lu.</div><p class="src">Références : <a href="https://www.medicines.org.uk/emc/product/898/smpc" target="_blank" rel="noopener">Actilyse, résumé britannique des caractéristiques du produit</a> ; <a href="https://doi.org/10.1136/thorax-2023-220304" target="_blank" rel="noopener">BTS 2023</a>.</p></template>
<template data-pop="j86-dornase" data-title="Dornase alfa"><p class="lab">Mécanisme</p><p>Désoxyribonucléase I humaine recombinante ; elle coupe l’ADN extracellulaire libéré par les polynucléaires et réduit la viscosité des sécrétions purulentes.</p><p class="lab">Indication autorisée</p><p>Inhalation de 2,5 mg une fois par jour dans la mucoviscidose. L’usage intrapleural est hors indication.</p><p class="lab">Usage intrapleural</p><p>5 mg deux fois par jour pendant trois jours, toujours avec l’alteplase ; seule, elle augmentait le recours chirurgical dans MIST2.</p><div class="key"><b>Accès à la monographie.</b> L’information professionnelle suisse de Pulmozyme n’a pas pu être consultée le 08.10.2026 ; l’indication provient des résumés européens du produit.</div><p class="src">Références : <a href="https://www.medicines.org.uk/emc/product/1112/smpc" target="_blank" rel="noopener">Pulmozyme, résumé britannique des caractéristiques du produit</a> ; <a href="https://doi.org/10.1056/NEJMoa1012740" target="_blank" rel="noopener">MIST2</a>.</p></template>
<template data-pop="j86-saignement" data-title="Saignement pleural sous fibrinolyse"><p class="lab">Signes</p><p>Liquide de drainage devenu sanglant, baisse de l’hémoglobine, tachycardie, hypotension, augmentation de l’opacité.</p><p class="lab">Conduite</p><p>Arrêt des instillations, hématocrite du liquide pleural (un hémothorax est retenu si l’hématocrite pleural dépasse la moitié de celui du sang), bilan d’hémostase, avis chirurgical.</p><p class="lab">Prévention</p><p>Identifier anticoagulants et antiagrégants, corriger les troubles de l’hémostase, envisager la dose réduite de 5 mg d’alteplase.</p></template>
<template data-pop="j86-aminosides" data-title="Pourquoi éviter les aminosides dans le pus"><p class="lab">Mécanisme</p><p>Leur entrée dans la bactérie dépend d’un transport actif lié à l’oxygène et au potentiel membranaire ; il est faible en milieu acide et anaérobie. Ils diffusent mal dans la paroi d’un abcès chronique.</p><p class="lab">Conséquence</p><p>Leur activité est réduite précisément dans le pus pleural ou cavitaire ; ils ajoutent une toxicité rénale et auditive sans bénéfice démontré.</p><p class="src">Références : <a href="https://doi.org/10.3978/j.issn.2305-5839.2015.07.08" target="_blank" rel="noopener">Kuhajda et al., 2015</a>.</p></template>
<template data-pop="pareto-j86-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="j86-0,j86-1,j86-2,j86-3,j86-4,j86-5,j86-6"></p><ul><li>Simple, compliqué, empyème : le pH, l’aspect et le Gram séparent ces stades.</li><li>Un patient sur dix meurt à trois mois ; le score RAPID mesure ce risque.</li><li>Glycolyse leucocytaire et bactérienne : pH et glucose bas ; fibrinolyse bloquée : cloisons ; organisation : poumon trappé.</li><li>Streptocoques du groupe anginosus et anaérobies dominent en ville ; bactéries résistantes à l’hôpital.</li><li>Inhalation, mauvaise dentition et alcool sont les terrains majeurs.</li><li>Une fièvre persistante sous antibiotique fait chercher une collection.</li></ul></template>
<template data-pop="pareto-j86-diag" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="j86-7"></p><ul><li>Échographie avant toute ponction.</li><li>Pus franc ou pH ≤ 7,2 : drain ; pH 7,2–7,4 : lactate déshydrogénase &gt; 900 UI/L et contexte ; pH ≥ 7,4 : surveillance.</li><li>pH mesuré immédiatement sur analyseur de gaz du sang, sans héparine ni lidocaïne.</li><li>Devant une cavité : écarter cancer excavé et tuberculose.</li></ul></template>
<template data-pop="pareto-j86-tt" data-title="Pareto — Gravité et traitement"><p class="ratio" data-cover="j86-8,j86-9"></p><ul><li>Le sepsis impose un drainage sans délai ; une fistule impose le décubitus côté malade.</li><li>Antibiotique couvrant anaérobies ; drain de 14 F ou moins.</li><li>Collection résiduelle : alteplase 10 mg et dornase 5 mg, deux fois par jour, trois jours ; jamais une seule enzyme.</li><li>Échec ou gangue : chirurgie vidéo-assistée.</li><li>Abcès : antibiotique prolongé ; drainage ou chirurgie pour une minorité.</li></ul></template>
<template data-pop="pareto-j86-crit" data-title="Pareto — Suivi, situations et critères"><p class="ratio" data-cover="j86-10,j86-11,j86-12"></p><ul><li>Le suivi juge la trajectoire : fièvre, protéine C réactive, drain, imagerie.</li><li>Une cavité persistante chez un fumeur impose une bronchoscopie.</li><li>Une infection cervicale suivie de douleur thoracique évoque une médiastinite descendante.</li><li>Empyème : pus ou germes ; compliqué : pH ≤ 7,2 ; abcès : cavité de plus de 2 cm.</li></ul></template>
<template data-pop="pareto-j86-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="j86-e-1,j86-e-2,j86-e-3,j86-e-4"></p><ul><li>Référence pleurale : ponction ; référence de l’abcès : scanner.</li><li>Lecture : aspect, puis pH, puis lactate déshydrogénase et glucose.</li><li>Scanner : plèvre dédoublée pour l’empyème, angle aigu et paroi épaisse pour l’abcès.</li><li>Liquide inoculé en flacons d’hémoculture ; une culture négative n’exclut rien.</li></ul></template>
<template data-pop="pareto-j86-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="j86-p-1,j86-p-2,j86-p-3,j86-p-4"></p><ul><li>Amoxicilline-acide clavulanique : 2,2 g par voie intraveineuse trois à quatre fois par jour, puis 1 g par voie orale deux à trois fois par jour.</li><li>Alteplase et dornase intrapleurales : hors indication, consentement, risque hémorragique.</li><li>Fistule bronchopleurale : contre-indication à l’instillation.</li><li>Aminosides évités ; tests hépatiques et fonction rénale surveillés lors des traitements longs.</li></ul></template>
