
<!-- ===== FENÊTRES : Pareto ===== -->
<template data-pop="pareto-j45-clin" data-title="Pareto — Définition, mécanismes et clinique">
<p class="ratio" data-cover="j45-0,j45-1,j45-2,j45-3,j45-4,j45-5,j45-6"></p>
<ul>
<li>Asthme = inflammation chronique habituelle + symptômes <b>variables</b> + limitation <b>variable</b> du débit expiratoire, prouvée objectivement.</li>
<li>Contrôle (4 dernières semaines, 4 questions ; la question du secours ne vaut que pour le bronchodilatateur de courte durée) ≠ sévérité (traitement nécessaire, jugée rétrospectivement) ≠ risque futur.</li>
<li>Un asthme d’apparence légère peut faire une crise mortelle : jusqu’à 30 % des exacerbations et des décès surviennent chez des patients peu symptomatiques. Le salbutamol seul s’associe à plus d’exacerbations et de décès. Cartouches de 200 doses délivrées : ≥ 3/an, risque d’exacerbation accru ; ≥ 12/an, risque de décès accru (associations).</li>
<li>Signaux de risque vital : intubation antérieure, hospitalisation ou urgences répétées dans l’année, corticostéroïde oral récent, absence de corticostéroïde inhalé, plus d’une cartouche de salbutamol par mois, allergie alimentaire, difficultés psychosociales.</li>
<li>Chaîne : déclencheur → inflammation de type 2 (IL-4 IgE, IL-5 éosinophiles, IL-13 mucus et FeNO) → hyperréactivité → obstruction (spasme, œdème, mucus) → sibilants, distension, hypoxémie → remodelage possible (lien établi par des associations).</li>
<li>Déclencheurs : virus, allergènes, effort, air froid, météo extrême, tabac, bêtabloquants (collyres compris), aspirine dans la N-ERD.</li>
<li>Endotype de type 2 (éosinophiles, FeNO, IgE) : surtout utile dans l’asthme sévère pour choisir une biothérapie ; mesurer avant le corticostéroïde oral et répéter.</li>
<li>Symptômes évocateurs : plusieurs, variables, nocturnes, déclenchés ; examen souvent normal hors crise.</li>
<li>Toujours faire démontrer la technique d’inhalation ; stridor inspiratoire → larynx.</li>
<li>Gravité : parole, conscience, fréquence respiratoire, saturation ; thorax silencieux = menace vitale ; intensité des sibilants ≠ gravité.</li></ul></template>
<template data-pop="pareto-j45-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="j45-7"></p>
<ul>
<li>Diagnostic = symptômes variables <b>et</b> preuve objective de variabilité, idéalement avant le corticostéroïde inhalé ; 25 à 35 % des « asthmes » de soins primaires ne se confirment pas.</li>
<li>Spirométrie : obstruction si VEMS/CVF &lt; limite inférieure de la normale ; réversibilité ≥ 12 % et ≥ 200 mL du VEMS ou de la CVF (enfant ≥ 12 % de la valeur prédite).</li>
<li>Autres preuves : débit de pointe variable &gt; 10 % (adulte), &gt; 13 % (enfant) ; ≥ 12 % et ≥ 200 mL après 4 semaines de corticostéroïde inhalé ; effort &gt; 10 % et &gt; 200 mL ; provocation positive.</li>
<li>Spirométrie normale ou réversibilité absente n’excluent pas ; méthacholine négative chez un patient non traité exclut presque ; pas de test de provocation pendant la grossesse.</li>
<li>FeNO (&gt; 50 ppb adulte, &gt; 35 ppb enfant) et éosinophiles soutiennent, ne suffisent pas ; éosinophiles plus élevés et FeNO plus basse tôt le matin.</li>
<li>Différentiels graves d’abord : embolie, insuffisance cardiaque, corps étranger ou tumeur, anaphylaxie ; puis BPCO, larynx, bronchectasies, ABPA et vascularite.</li></ul></template>
<template data-pop="pareto-j45-urg" data-title="Pareto — Exacerbation et état de mal">
<p class="ratio" data-cover="j45-8"></p>
<ul>
<li>Sévère (GINA 2026, un critère suffit) : ne peut ni parler, ni boire, ni s’allonger, fréquence respiratoire &gt; 30, saturation &lt; 92 % à l’air, débit de pointe &lt; 50 % ; la fréquence cardiaque ne classe plus la gravité.</li>
<li>Menace vitale : somnolence, confusion, cyanose, thorax silencieux, épuisement → soins intensifs.</li>
<li>Salbutamol à la chambre, une bouffée à la fois : 4 (légère), 4–6 (modérée), 6–10 bouffées (sévère) ; surveiller tachycardie, hypokaliémie, acidose lactique.</li>
<li>Oxygène seulement si saturation &lt; 92 % ; cible 92–95 % ; prednisone 40–50 mg 5–7 jours dans l’heure ; ipratropium si modérée à sévère ; magnésium 2 g intraveineux (enfant de 2 à 5 ans : 40–50 mg/kg) si réponse insuffisante.</li>
<li>Pas de sédatif, pas d’antibiotique sans infection probable, pas d’aminophylline ; radiographie et gazométrie non systématiques.</li>
<li>PaCO₂ normale (35–45 mmHg) en crise sévère = menace vitale ; PaO₂ &lt; 60 mmHg avec PaCO₂ normale ou élevée, surtout &gt; 45 mmHg = insuffisance respiratoire.</li>
<li>Ventilé : fréquence basse, expiration longue, hypercapnie permissive ; hypotension → déconnecter, exclure un pneumothorax.</li>
<li>Sortie : critères de crise légère, saturation ≥ 92 % à l’air, débit de pointe &gt; 70 %, traitement de fond intensifié, plan écrit, contrôle en 2–7 jours (enfant 2–5).</li></ul></template>
<template data-pop="pareto-j45-tt" data-title="Pareto — Traitement de fond">
<p class="ratio" data-cover="j45-9,j45-10"></p>
<ul>
<li>Objectifs : contrôle des symptômes et réduction du risque ; rémission clinique sous traitement possible, sans définition unique, et distincte d’une guérison.</li>
<li>Voie 1 préférée : budésonide-formotérol (ou béclométasone-formotérol) en secours à tous les paliers ; paliers 1–2 à la demande ; 3 MART faible dose ; 4 MART dose moyenne ; 5 ajout de tiotropium, phénotypage, biothérapie.</li>
<li>MART : consulter au-delà de 12 inhalations en 24 heures, entretien compris (8 chez l’enfant de 6 à 11 ans) ; seul le formotérol convient au secours.</li>
<li>Jamais de BALA seul ; jamais de salbutamol seul chez l’adolescent et l’adulte.</li>
<li>Monter si non contrôlé après vérification de la technique et de l’adhésion ; envisager une réduction après 2 à 3 mois de bon contrôle ; ne jamais arrêter complètement le corticostéroïde inhalé.</li>
<li>Enfant ≤ 5 ans : diagnostic possible ; corticostéroïde inhalé quotidien avec chambre et masque.</li>
<li>Asthme sévère (3–10 %) : corriger d’abord (technique, adhésion, comorbidités, expositions), puis phénotyper ; éosinophiles ≥ 300/µL → exclure une strongyloïdose ; anti-IgE, anti-IL-5, anti-IL-4Rα, anti-TSLP ; évaluer à 4 mois.</li>
<li>Éosinophiles &gt; 1 500/µL : chercher une granulomatose éosinophilique avec polyangéite avant biothérapie.</li></ul></template>
<template data-pop="pareto-j45-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="j45-11,j45-12,j45-13"></p>
<ul>
<li>Revoir 1–3 mois après une modification, puis tous les 3–12 mois ; après une exacerbation, dans les 2–7 jours (enfant 2–5) ; une exacerbation avec corticostéroïde oral = revoir le traitement.</li>
<li>Réduction : après 2–3 mois de bon contrôle, −25 à 50 % de la dose d’entretien par étape, puis 2–3 mois de stabilité ; jamais d’arrêt complet du corticostéroïde inhalé.</li>
<li>Risque (associations) : exacerbation dans l’année, intubation antérieure, VEMS &lt; 60 %, secours fréquent, tabac, éosinophiles ou FeNO élevés, grossesse, facteurs psychosociaux.</li>
<li>Grossesse : ne jamais arrêter le corticostéroïde inhalé, revoir toutes les 4–6 semaines, ne pas réduire avant l’accouchement ; traiter la crise sans retard, pas de test de provocation, éviter le carboprost.</li>
<li>Sujet âgé : dispositif adapté aux mains, à la vue et au débit inspiratoire ; relever tous les médicaments, collyres compris ; bêtabloquant cardiosélectif possible après syndrome coronarien aigu, sous surveillance.</li>
<li>Chirurgie : poursuivre le corticostéroïde inhalé ; hydrocortisone si forte dose prolongée ou corticostéroïde oral &gt; 2 semaines au cours des 6 derniers mois.</li>
<li>Asthme professionnel : débit de pointe travail/congé, adressage sans délai, annonce à l’assureur-accidents (Suva), éviction précoce et complète.</li>
<li>Critères formels : symptômes variables + variabilité objective par au moins un test (adulte : VEMS ou CVF ≥ 12 % et ≥ 200 mL ; enfant : ≥ 12 % de la valeur prédite) ; un rapport &lt; limite inférieure de la normale renforce sans suffire.</li></ul></template>
<template data-pop="pareto-j45-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="j45-e-1,j45-e-2,j45-e-3,j45-e-4,j45-e-5"></p>
<ul>
<li>Référence : spirométrie avec réversibilité (VEMS ou CVF ≥ 12 % et ≥ 200 mL ; enfant ≥ 12 % de la valeur prédite) ; qualité : 3 manœuvres, écart ≤ 150 mL.</li>
<li>Suspendre avant le test : bêta-2 de courte durée ≥ 4 h, formotérol ou salmétérol 24 h, indacatérol ou vilantérol 36 h, AMLA 36–48 h ; poursuivre le corticostéroïde inhalé.</li>
<li>Obstruction : rapport &lt; limite inférieure de la normale (z −1,645), pas 0,70 fixe ; courbe concave ; plateau = voies aériennes supérieures.</li>
<li>Débit de pointe : variabilité = (max − min) / moyenne ; &gt; 10 % adulte, &gt; 13 % enfant.</li>
<li>Méthacholine : sensible, sert à exclure (positive si le VEMS chute d’au moins 20 % aux doses standard) ; mannitol et effort : spécifiques, servent à confirmer ; pas de provocation pendant la grossesse.</li>
<li>Éosinophiles ≥ 150 et ≥ 300/µL, plus élevés tôt le matin ; ≥ 300 : exclure une strongyloïdose ; &gt; 1 500 : autre cause. FeNO &gt; 50 ppb adulte (&gt; 35 enfant) : type 2 ; plus basse tôt le matin ; tabac l’abaisse.</li>
<li>Sensibilisation ≠ allergie. IgE totales : dose d’omalizumab, ABPA (≥ 500 UI/mL).</li>
<li>Radiographie non systématique ; DLCO normale dans l’asthme, basse dans l’emphysème ; gazométrie si débit de pointe &lt; 50 % ou non-réponse ; PaO₂ &lt; 60 mmHg avec PaCO₂ normale ou &gt; 45 mmHg = insuffisance respiratoire.</li></ul></template>
<template data-pop="pareto-j45-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="j45-p-1,j45-p-2,j45-p-3,j45-p-4,j45-p-5,j45-p-6,j45-p-7,j45-p-8"></p>
<ul>
<li>Tout asthmatique reçoit un corticostéroïde inhalé ; un bêta-2 agoniste de longue durée ne se prescrit jamais seul ; seul le formotérol associé sert de secours et de MART.</li>
<li>En Suisse, la voie 2 utilise un traitement de fond et du salbutamol séparés.</li>
<li>Doses faibles chez l’adulte : budésonide 200-400 µg, béclométasone extrafine 100-200 µg, fluticasone propionate 100-250 µg ; environ deux fois moins chez l’enfant de 6 à 11 ans.</li>
<li>Budésonide-formotérol 200/6 µg = 160/4,5 µg délivrés ; consulter au-delà de 12 inhalations en 24 heures (8 chez l’enfant).</li>
<li>Crise : salbutamol 4, 4-6 ou 6-10 bouffées ; oxygène si &lt; 92 %, cible 92-95 % ; prednisone 40-50 mg pendant 5 à 7 jours ; magnésium 2 g si échec.</li>
<li>Biothérapie choisie selon les éosinophiles, la FeNO, l’allergie et les comorbidités, jugée à 4 mois ; prednisone d’entretien en dernier recours.</li>
<li>Interactions : bêta-2 agonistes avec hypokaliémiants ; CYP3A4 avec fluticasone ou budésonide ; théophylline avec CYP1A2 ; bêtabloquants non sélectifs.</li>
<li>Montélukast : risque neuropsychiatrique ; corticostéroïde oral toxique dès 0,5-1 g cumulés.</li></ul></template>
<template data-pop="pareto-j45-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="j45-sa,j45-sh,j45-sp,j45-si,j45-sx,j45-sb,j45-sg"></p>
<ul>
<li>Résistance ∝ 1/r⁴ : −20 % de rayon = résistance × 2,4. Petites voies (&lt; 2 mm) = « zone silencieuse » : spirométrie normale possible.</li>
<li>Tonus de repos vagal (M3) ; pas d’innervation sympathique du muscle lisse humain ; bêtabloquant (collyre compris) : bronchoconstriction en partie cholinergique.</li>
<li>Hyperréactivité : mastocytes dans le muscle, perte de la protection par l’inspiration profonde, paroi épaissie ; un anti-IL-5 supprime les éosinophiles sans corriger l’hyperréactivité.</li>
<li>Remodelage dès 1–3 ans ; la bronchoconstriction répétée suffit à l’induire (essai humain) ; lien avec l’obstruction fixe = association ; aucun traitement ne le fait régresser.</li>
<li>Type 2 : alarmines → Th2 et ILC2 → IL-5 (éosinophiles), IL-13 (FeNO, mucus), IL-4 et IL-13 (IgE). Non type 2 : moins corticosensible ; anti-IL-17 inefficace.</li>
<li>Crise : virus (80–85 % chez l’enfant) ± allergène → distension dynamique → hypoxémie par rapport ventilation/perfusion bas (shunt ≈ 0, corrigée par l’oxygène) → hypercapnie par épuisement.</li>
<li>Oxygène pur : PaCO₂ ↑ (essai randomisé) → cible 92–95 %. Salbutamol en excès : acidose lactique qui mime l’aggravation. Ventilé : air piégé → hypotension.</li>
<li>Bêta-2 seul : tolérance et surmortalité → toujours avec corticostéroïde inhalé. Tabac : corticorésistance.</li>
<li>17q21 : asthme précoce avec tabac ou rhinovirus ; héritabilité 82 % ≠ risque individuel ; hypothèse hygiéniste = associations, aucune prévention prouvée ; aucun test génétique.</li></ul></template>
