<!-- ===== FENÊTRES I83 : complications, traitement, ulcère, atteintes profondes (rédacteur B) ===== -->
<template data-pop="i83-tvs" data-title="Thrombose veineuse superficielle sur varice">
<p>Une thrombose superficielle sur varice impose un écho-Doppler de tout le membre et ne relève pas d’un antibiotique, car l’inflammation est stérile. Une intervention superficielle en phase aiguë n’est pas recommandée ; l’ablation du reflux qui l’a produite se discute au moins trois mois plus tard.</p>
<div class="lab">Mécanisme</div><p>Dans une varice, le calibre élargi et le reflux ralentissent le sang : la stase favorise un thrombus, souvent spontané. La paroi s’enflamme au contact du caillot, sans infection. Le thrombus peut progresser jusqu’à une jonction ou passer dans le réseau profond par une perforante.</p>
<div class="lab">Conséquence clinique</div><p>Dans l’étude prospective POST, 24,9 % des 844 patients porteurs d’une thrombose superficielle d’au moins 5 cm avaient déjà une thrombose profonde ou une embolie pulmonaire symptomatique. Une échographie limitée à deux ou trois points de compression ne suffit pas, car la thrombose profonde associée siégeait au mollet dans 50 % des cas et à distance du segment superficiel dans 42 %. L’ESVS 2021 recommande donc un écho-Doppler de tout le membre, bilatéral si nécessaire (recommandation 43, I B). Un thrombus court, de moins de 5 cm, dans une collatérale peut être évacué par ponction ou mini-incision : la douleur cède rapidement (ESVS 2022, § 8.1.1).</p>
<div class="lab">Décision</div><p>L’anticoagulation dépend de la longueur du thrombus et de sa distance à la jonction ; molécules, doses et durées figurent dans le cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie). L’ESVS 2021 ne recommande pas d’intervention superficielle en phase aiguë (recommandation 50, III C) : l’anticoagulation a largement remplacé la ligature précoce de la crosse, et un geste précoce expose à une thrombose postopératoire pendant la phase prothrombotique. L’ablation des veines incompétentes est envisagée au moins trois mois après l’épisode, quand cette phase est éteinte (ESVS 2021, recommandation 51, IIa C).</p>
<div class="lab">Limites</div><p>La recommandation 50 est de niveau C : elle repose sur un consensus et des essais anciens, et n’interdit pas tout geste local, comme l’évacuation d’un thrombus court de collatérale. Le délai de trois mois est, selon l’ESVS 2021 elle-même, rationnel et largement pratiqué, mais non fondé sur des preuves.</p>
<div class="lab">Piège</div><p>L’aspect inflammatoire fait souvent conclure à une infection et prescrire un antibiotique injustifié. Le code CIM-10-GM d’une thrombophlébite sur varice est I80.0, et non I83.1, qui désigne la dermite de stase.</p>
<div class="lab">Source</div><p>Kakkos et al., ESVS 2021, § 2.11, recommandations 43, 50 et 51 ; De Maeseneer et al., ESVS 2022, § 8.1.1 ; Decousus et al., Ann Intern Med 2010;152:218-224 (étude POST).</p></template>

<template data-pop="i83-hemorragie" data-title="Hémorragie d’une varice : geste immédiat et prévention">
<p>Une varice qui saigne s’arrête presque toujours quand la personne est allongée, la jambe surélevée, et qu’une pression ferme est appliquée sur le point de saignement. Le patient est ensuite orienté en urgence pour traiter la veine responsable.</p>
<div class="lab">Mécanisme</div><p>Des varices non traitées, une obstruction iliaque ou une insuffisance cardiaque droite transmettent leur pression aux veines réticulaires et aux télangiectasies. La peau qui les recouvre s’amincit et forme de petites bulles bleutées, qu’un traumatisme minime ouvre ; l’eau chaude de la douche, qui dilate les veines, et le sommeil sont des circonstances fréquentes.</p>
<div class="lab">Conséquence clinique</div><p>Le saignement est indolore et peut être très abondant ; il est exceptionnellement mortel, surtout chez une personne âgée qui vit seule. Un anticoagulant prolonge le saignement sans en être la cause. Des varices pulsatiles, signe d’un reflux à haute pression dans une insuffisance tricuspide ou une insuffisance cardiaque droite, exposent particulièrement à ce risque.</p>
<div class="lab">Décision</div><p>Après le geste immédiat, l’ESVS 2022 recommande une orientation urgente pour évaluation et traitement (recommandation 89, I C). La sclérothérapie locale à la mousse des petites veines et des bulles qui ont saigné est proposée pour prévenir la récidive (recommandation 90, IIa C). La recherche et le traitement du reflux sous-jacent réduisent encore le risque. La personne âgée et son entourage apprennent le geste de surélévation et de pression.</p>
<div class="lab">Limites</div><p>Les recommandations 89 et 90 sont de niveau C : elles reposent sur des avis d’experts et des séries, sans essai comparatif.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, § 8.1.2, recommandations 89 et 90 ; § 8.2.4 pour les varices pulsatiles.</p></template>

<template data-pop="i83-compression" data-title="Compression médicale : pressions, dispositifs et prescription">
<p>La compression réduit le calibre des veines, diminue le reflux, améliore la pompe du mollet et freine la filtration capillaire. Sa prescription précise l’objectif, la pression à la cheville, la longueur et le type de dispositif, après mesure de la pression de cheville.</p>
<div class="lab">Mécanisme</div><p>Une pression externe rapproche les parois veineuses et peut restaurer partiellement la coaptation des valvules ; le reflux diminue. Le volume éjecté à chaque contraction du mollet augmente. La pression tissulaire plus élevée s’oppose au passage du liquide hors des capillaires : l’œdème se forme moins, selon l’équilibre de Starling. Un bas médical est dégressif : la pression est maximale à la cheville et diminue vers le mollet.</p>
<div class="lab">Élastique ou inélastique</div><p>Un matériau élastique exerce une pression presque constante, au repos comme à la marche ; il convient au port quotidien des formes chroniques. Un matériau inélastique exerce une pression faible au repos et élevée à chaque contraction du mollet, car le muscle se gonfle contre une enveloppe qui ne cède pas. Cette différence entre la pression debout et la pression couchée, appelée indice de rigidité statique, dépasse 10 mmHg pour un matériau inélastique. Un bandage inélastique perd vite sa pression sur une jambe qui désenfle ; un dispositif ajustable à bandes autoagrippantes se resserre au fil de la journée et maintient la pression.</p>
<div class="lab">Prescription</div><p>Le médecin indique l’objectif, la pression à la cheville (au moins 15 mmHg pour les symptômes, 20 à 40 mmHg pour l’œdème et la peau, au moins 40 mmHg pour l’ulcère), la longueur, en général jusqu’au genou, et le type de dispositif. Le fournisseur mesure la jambe, de préférence le matin quand l’œdème est minimal, puis contrôle l’ajustement.</p>
<div class="lab">Limites</div><p>La compression ne prévient pas de façon démontrée la progression ni la récidive des varices. L’observance diminue avec la pression et la chaleur ; un bas moins serré mais porté chaque jour abaisse davantage la pression veineuse qu’un bas plus fort que le patient ne porte pas.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 3.2, 3.4 et 6.3.1, recommandations 9 à 13 ; remboursement : <button class="w" data-k="i83-suisse">prise en charge en Suisse</button>.</p></template>

<template data-pop="i83-ci-compression" data-title="Contre-indications à la compression">
<p>Une compression soutenue est contre-indiquée quand la pression de cheville est inférieure à 60 mmHg, la pression d’orteil inférieure à 30 mmHg ou l’index de pression systolique inférieur à 0,6. Elle l’est aussi en cas d’insuffisance cardiaque sévère, de pontage artériel superficiel sous la compression, d’allergie au matériau ou de neuropathie diabétique sévère.</p>
<div class="lab">Mécanisme</div><p>La peau n’est perfusée que si la pression dans ses artérioles dépasse la pression qui s’exerce sur elle. Dans une artériopathie sévère, la pression de perfusion est déjà basse ; une compression de 40 mmHg peut la dépasser et provoquer une nécrose, surtout sur les reliefs osseux comme le tibia ou les malléoles. Chez le diabétique, l’artère calcifiée résiste à la manchette : l’index paraît normal ou élevé alors que la perfusion est mauvaise, d’où la mesure de la pression d’orteil. La neuropathie supprime la douleur qui alerterait le patient.</p>
<div class="lab">Liste de l’ESVS 2022</div><p>Artériopathie sévère avec index inférieur à 0,6 ou pression de cheville inférieure à 60 mmHg ; pontage extra-anatomique ou superficiel à l’endroit comprimé ; insuffisance cardiaque de classe NYHA IV ; classe NYHA III sans surveillance clinique et hémodynamique ; allergie confirmée au matériau ; neuropathie diabétique sévère avec perte sensitive ou microangiopathie à risque de nécrose. Cette dernière contre-indication peut ne pas s’appliquer à une compression inélastique modifiée. L’artériopathie non sévère, l’infection cutanée, la vascularite et la dermohypodermite ne sont plus des contre-indications si des précautions sont prises.</p>
<div class="lab">Compression modifiée</div><p>Dans l’ulcère mixte, une compression inférieure à 40 mmHg, en matériau à allongement court, est envisagée si la pression de cheville dépasse 60 mmHg, sous surveillance étroite (recommandation 74, IIb C). Elle est retirée aussitôt si l’ulcère s’aggrave ou si la jambe devient très douloureuse. Les ulcères mixtes guérissent ainsi, avec retard.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, tableau 7, §§ 3.2 et 6.3.3, recommandations 72 et 74 ; mesures : <button class="w" data-k="i83-ips">index de pression et pression d’orteil</button>.</p></template>

<template data-pop="i83-indication" data-title="Qui traiter : indications de l’intervention sur le reflux">
<p>L’intervention sur le reflux superficiel est recommandée pour des varices symptomatiques et pour des altérations cutanées. Elle n’est pas indiquée pour un reflux isolé sans symptôme ni signe, et elle reste une décision partagée quand le motif est esthétique.</p>
<div class="lab">Raisonnement</div><p>Le reflux augmente la pression veineuse ambulatoire ; sa suppression la fait baisser durablement. Le bénéfice sur la qualité de vie est démontré dès les varices non compliquées (Michaels et al., 246 patients) ; pour l’ulcère, il est prouvé par des essais (EVRA, ESCHAR) ; pour les autres altérations cutanées, il repose sur des données empiriques, d’où le niveau C de la recommandation 17.</p>
<div class="lab">Œdème isolé</div><p>Un œdème sans varice visible (C&#8288;3) est souvent multifactoriel, surtout s’il est bilatéral : médicament, insuffisance cardiaque, rénale ou veineuse. L’ESVS demande de rechercher d’abord une autre cause (recommandation 16, IIa C). Chez Mme R., l’amlodipine explique probablement une part de l’œdème des deux chevilles.</p>
<div class="lab">Décision partagée</div><p>Le patient reçoit une information sur le faible risque de complication grave des varices non compliquées, sur les risques de chaque technique et sur leur coût. L’âge, l’obésité, les comorbidités ou un anticoagulant modifient le choix sans l’interdire.</p>
<div class="lab">Limites</div><p>L’histoire naturelle est mal connue au niveau individuel : la progression observée dans l’étude d’Édimbourg ne permet pas de prédire qui évoluera.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, § 4.1.1, recommandations 15 à 17 ; Michaels et al., Br J Surg 2006;93:175-181.</p></template>

<template data-pop="i83-thermique" data-title="Ablation thermique endoveineuse : laser et radiofréquence">
<p>L’ablation thermique ferme la saphène incompétente de l’intérieur par la chaleur. C’est le traitement de premier choix de la grande et de la petite saphène selon l’ESVS 2022 (recommandations 28 et 43, I A).</p>
<div class="lab">Technique</div><p>Sous échoguidage, l’opérateur ponctionne la saphène, souvent près du genou, et pousse une fibre laser ou un cathéter de radiofréquence jusqu’à quelques centimètres de la jonction. Il injecte la solution de tumescence autour de la veine : elle anesthésie, vide la veine en la plaquant sur la sonde et absorbe la chaleur qui menacerait la peau et les nerfs. L’énergie délivrée pendant le retrait dénature le collagène de la paroi ; la veine se rétracte puis se fibrose. Les lasers de grande longueur d’onde, absorbés par l’eau de la paroi plutôt que par l’hémoglobine, donnent moins de douleur et d’ecchymoses. Le choix entre laser et radiofréquence est laissé au médecin (recommandation 29, I B).</p>
<div class="lab">Résultats</div><p>Le laser obtient un succès anatomique de 92 % dans une méta-analyse de 28 essais aux suivis variables, et de 88 % à cinq ans dans une méta-analyse d’essais à long terme ; la radiofréquence segmentaire ferme la grande saphène dans 92 % des membres à cinq ans. La récidive vient surtout d’une recanalisation ou d’un reflux nouveau d’une veine voisine, comme la saphène accessoire antérieure. Dans l’essai CLASS, la qualité de vie propre à la maladie était meilleure à cinq ans après laser ou chirurgie qu’après mousse.</p>
<div class="lab">Complications</div><p>Depuis 2023, l’extension du thrombus liée à l’ablation (ARTE) remplace le terme EHIT et couvre toutes les techniques : chaleur, mousse, ablation mécanochimique et colle de cyanoacrylate. Elle garde les classes de l’American Venous Forum : classe I, thrombus qui atteint la jonction sans extension profonde ; classe II, moins de 50 % de la lumière profonde ; III, plus de 50 % ; IV, thrombus occlusif de la veine profonde. Les ARTE de classes II à IV surviennent dans 1,4 % des ablations de la grande saphène, et l’ensemble ARTE II à IV ou thrombose profonde dans 1,7 % (Gloviczki et al., 2023). Les lasers à eau de 1 470 nm ou plus ont rendu plus rares paresthésies, pigmentation, hématome et brûlure cutanée.</p>
<div class="lab">Conduite devant une ARTE</div><p>Une ARTE symptomatique reçoit un anticoagulant oral direct plutôt qu’un antagoniste de la vitamine K (recommandation 11.3.4, grade 1C). Une ARTE de classe III ou IV asymptomatique reçoit le même traitement (11.4.1, consensus), poursuivi jusqu’à la rétraction du thrombus ; aucune dose ni durée fixe n’est donnée, la durée reste laissée au jugement du clinicien (11.4.2, consensus). Les conduites de 2021 pour les classes I et II, abstention en classe I et échographie hebdomadaire en classe II (Kabnick et al., 2021), s’appliquent rarement, car un écho-Doppler précoce systématique n’est plus recommandé chez le patient asymptomatique à risque moyen (11.1.1, grade 1B). Chez le patient à haut risque, une thromboprophylaxie médicamenteuse est suggérée (11.2.1, grade 2C). La règle suit la part de lumière profonde occupée : au-delà de la moitié, le thrombus non occlusif peut encore s’étendre et emboliser, alors que les petites extensions régressent souvent. L’ESVS 2022 recommande aussi l’anticoagulation curative quand le thrombus occlut la veine fémorale commune.</p>
<div class="lab">Limites</div><p>Ces recommandations reposent surtout sur des séries et sur un consensus. Elles sont américaines ; l’ESVS 2022 reprend leur classification sans détailler la conduite des classes II et III. Les doses et la durée de l’anticoagulation suivent le cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie).</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 4.1.3 et 4.2.1.5, tableau 9 ; Kabnick et al., American Venous Forum et Society for Vascular Surgery, Phlebology 2021;36:8-25 (DOI 10.1177/0268355520953759), recommandations 3.2 à 3.5 ; Brittenden et al., N Engl J Med 2019;381:912-922.</p></template>

<template data-pop="i83-nonthermique" data-title="Colle cyanoacrylate et ablation mécanochimique">
<p>Ces techniques ferment la saphène sans chaleur ni tumescence. L’ESVS 2022 propose la colle quand une technique non thermique sans tumescence est préférée (recommandation 30, IIa A) et accepte l’ablation mécanochimique avec une recommandation plus faible (recommandation 34, IIb A).</p>
<div class="lab">Colle cyanoacrylate</div><p>Injectée par cathéter, la colle polymérise au contact du sang et provoque une réaction inflammatoire de la paroi qui ferme la veine. L’absence de tumescence rend l’intervention moins douloureuse et plus rapide. Dans l’essai randomisé multicentrique de Morrison et al. (222 patients), la grande saphène restait fermée à 36 mois chez 94,4 % des patients traités par colle et 91,9 % après radiofréquence. La colle reste dans la veine comme un implant permanent. L’effet indésirable le plus fréquent est une inflammation de la peau sur le trajet traité, parfois liée à une hypersensibilité ; des réactions granulomateuses tardives, rares mais parfois sévères, ont été décrites jusqu’à un an après. Une allergie connue aux acrylates contre-indique la technique.</p>
<div class="lab">Ablation mécanochimique</div><p>Un fil rotatif abrase l’intima pendant l’injection d’un sclérosant liquide ; les deux lésions s’additionnent. La quantité de sclérosant autorisée limite la longueur de veine traitable. Dans l’essai randomisé de Vähäaho et al., l’occlusion à trois ans était de 80 % après ablation mécanochimique contre 100 % après laser ou radiofréquence ; elle tombait de 100 % à 75 % quand le diamètre initial passait de 6 à 8 mm. L’absence de tumescence et de chaleur la rend intéressante pour la petite saphène et la partie basse de la grande saphène, près des nerfs.</p>
<div class="lab">Statut en Suisse</div><p>L’annexe 1 de l’OPAS exclut du remboursement l’ablation mécanochimique de type Clarivein depuis le 1.7.2013. La colle n’y est pas mentionnée : sa prise en charge se clarifie avec l’assureur avant l’intervention.</p>
<div class="lab">Limites</div><p>Le recul publié ne dépasse guère trois ans pour l’ablation mécanochimique et cinq ans, sur un petit effectif, pour la colle, contre plus de cinq ans pour l’ablation thermique.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 4.2.2.1 et 4.2.2.3 ; Morrison et al., Phlebology 2019;34:380-390 ; Vähäaho et al., J Vasc Surg Venous Lymphat Disord 2021;9:652-659 ; OPAS, annexe 1, édition du 1.7.2026.</p></template>

<template data-pop="i83-chirurgie" data-title="Crossectomie-stripping, phlébectomies, CHIVA et ASVAL">
<p>La crossectomie-stripping reste une option valable quand l’ablation thermique n’est pas disponible (recommandation 35, IIa A). Les phlébectomies traitent les collatérales ; CHIVA et ASVAL conservent le tronc saphène et ne reçoivent qu’une recommandation faible.</p>
<div class="lab">Crossectomie-stripping</div><p>Le chirurgien lie la saphène et ses branches au ras de la jonction, puis retire le tronc avec un stripper. Elle se fait aujourd’hui sous anesthésie locale ou par tumescence. Après chirurgie, la récidive vient surtout d’une néovascularisation : de petites veines nouvelles reconnectent les extrémités de la veine sectionnée. Hématomes (4,8 % contre 1,3 %), infections de plaie (1,9 % contre 0,3 %) et paresthésies (11,3 % contre 6,7 %) sont plus fréquents qu’après laser.</p>
<div class="lab">Phlébectomies ambulatoires</div><p>Par des incisions de 2 à 3 mm sous anesthésie locale, l’opérateur extrait les varices collatérales avec un crochet. Elles se font avec l’ablation du tronc ou à distance, selon une décision partagée (recommandation 48, IIa B). Les complications sont rares : bulles, pigmentation, petites thromboses superficielles.</p>
<div class="lab">CHIVA</div><p>Après une cartographie précise, l’opérateur interrompt seulement les points de fuite du reflux et dirige le sang de la saphène vers le réseau profond par des perforantes de réentrée. Une revue Cochrane de six essais ne montre guère de différence de récidive avec les autres techniques, avec un risque de biais élevé ; les résultats se dégradent nettement entre des mains inexpérimentées (recommandation 51, IIb B).</p>
<div class="lab">ASVAL</div><p>L’opérateur retire seulement les collatérales variqueuses et laisse le tronc, en supposant que le reflux du tronc régresse quand ses branches disparaissent. Cette méthode repose sur des séries rétrospectives (recommandation 52, IIb C).</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 4.2.3, 4.3.1, 4.6.7 et 4.7.1.</p></template>

<template data-pop="i83-mousse" data-title="Sclérothérapie à la mousse échoguidée : technique et place">
<p>La mousse convient aux collatérales, aux récidives tortueuses, aux veines proches d’un ulcère et, de préférence, aux troncs de moins de 6 mm. Pour une grande saphène plus large, elle ferme moins durablement que l’ablation thermique.</p>
<div class="lab">Technique</div><p>Le sclérosant détergent est mélangé à de l’air ou à un gaz physiologique pour former une mousse. Celle-ci chasse le sang et reste au contact de la paroi : elle est au moins deux fois plus efficace que le liquide, avec quatre à cinq fois moins de produit. L’injection se fait sous échoguidage pour toute veine invisible à l’œil (recommandation 32, I C), en commençant par les plus grosses veines. Le consensus européen limite le volume à environ 10 à 20 mL de mousse par séance. Plusieurs séances, contrôlées par écho-Doppler, sont souvent nécessaires.</p>
<div class="lab">Efficacité</div><p>À cinq ans, le succès anatomique sur la grande saphène n’atteint que 34 % après mousse, contre 88 % après laser, dans une méta-analyse d’essais ; les protocoles de mousse de ces essais n’étaient toutefois pas toujours optimaux. La mousse ferme moins bien une grande saphène de plus de 6 mm à mi-cuisse : le reflux revenait à deux ans chez 62,6 % des patients au-delà de ce diamètre, contre 42 % en dessous. D’où la recommandation 31 (IIb B), qui propose la mousse pour les troncs plus fins sans l’interdire au-delà. Elle reste la technique de choix quand le cathéter ne passe pas, et pour fermer le plexus veineux sous un ulcère (recommandation 78, IIa C).</p>
<div class="lab">Effets indésirables</div><p>Une pigmentation transitoire, de fines télangiectasies et des thromboses superficielles sont fréquentes. Les événements neurologiques, troubles visuels, céphalées et migraines, restent inférieurs à 1 % ; le passage de bulles vers la circulation artérielle à travers un shunt droite-gauche est le mécanisme proposé. Un shunt droite-gauche symptomatique connu est une contre-indication absolue ; un foramen ovale, présent chez 25 à 30 % des personnes, n’est pas recherché systématiquement. L’injection intra-artérielle accidentelle est la complication à éviter avant tout.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 4.2.2.2 et 4.3.2 ; Brittenden et al., N Engl J Med 2019 ; produit et doses : <button class="w" data-k="i83-d-polidocanol">polidocanol</button>.</p></template>

<template data-pop="i83-evra" data-title="Essais EVRA et ESCHAR : ce qu’ils prouvent">
<p>EVRA prouve que l’ablation endoveineuse précoce du reflux superficiel, ajoutée à la compression, accélère la cicatrisation d’un ulcère veineux récent. ESCHAR prouve que la suppression du reflux réduit la récidive de l’ulcère, sans changer la cicatrisation obtenue par une compression bien portée.</p>
<div class="lab">EVRA (2018)</div><p>Dans 20 centres britanniques, 450 patients porteurs d’un ulcère veineux de six semaines à six mois et d’un reflux superficiel ont reçu une compression et ont été tirés au sort entre une ablation endoveineuse dans les deux semaines et une ablation différée après cicatrisation. Le délai médian de cicatrisation a été de 56 jours contre 82 jours (rapport de risques 1,38 ; intervalle de confiance à 95 % de 1,13 à 1,68). À 24 semaines, 85,6 % des ulcères étaient cicatrisés contre 76,3 %. La première année, les patients ont passé 306 jours sans ulcère contre 278. Les complications les plus fréquentes étaient la douleur et la thrombose profonde. Le texte de l’ESVS 2022 cite 75,4 % pour le groupe différé ; la publication originale donne 76,3 %, valeur retenue ici.</p>
<div class="lab">ESCHAR (2007)</div><p>500 patients porteurs d’un ulcère ouvert ou récemment cicatrisé et d’un reflux superficiel ont été tirés au sort entre la compression seule et la compression associée à une chirurgie superficielle. La cicatrisation à trois ans ne différait pas (89 % contre 93 %). La récidive à quatre ans était de 56 % sous compression seule contre 31 % après chirurgie. Le bénéfice persistait en cas de reflux profond segmentaire (récidive à trois ans 52 % contre 24 %), mais n’était pas significatif quand tout le réseau profond refluait (46 % contre 32 %).</p>
<div class="lab">Limites</div><p>EVRA ne concernait que des ulcères de moins de six mois chez des patients très observants de la compression, ce qui diffère de la pratique courante. ESCHAR utilisait une chirurgie ouverte aujourd’hui remplacée par les techniques endoveineuses. Ces résultats fondent les recommandations 76 (I B) et 77 (I A) de l’ESVS 2022.</p>
<div class="lab">Source</div><p>Gohel et al., N Engl J Med 2018;378:2105-2114 ; Gohel et al., British Medical Journal 2007;335:83 ; De Maeseneer et al., ESVS 2022, § 6.4.</p></template>

<template data-pop="i83-ulcere-local" data-title="Soins locaux de l’ulcère veineux">
<p>Les soins locaux nettoient la plaie, retirent les tissus morts, gèrent l’exsudat, protègent la peau voisine et soulagent la douleur. Aucun pansement particulier n’a montré de bénéfice fiable sur la cicatrisation complète ; deux produits l’augmentent peut-être, avec une certitude faible (rubrique Infection). Ce sont la compression et la suppression du reflux qui font progresser la cicatrisation.</p>
<div class="lab">Évaluation</div><p>L’équipe note le siège, la surface et la profondeur, la quantité d’exsudat, l’aspect du fond, l’état des bords, les signes d’infection et l’état de la peau autour. Mesurer la surface à chaque contrôle permet de reconnaître un ulcère qui ne progresse pas et doit faire reconsidérer le diagnostic.</p>
<div class="lab">Nettoyage et détersion</div><p>Le nettoyage retire les débris et les restes de pansement. La détersion enlève les tissus nécrotiques par voie mécanique, chirurgicale, enzymatique ou autolytique, sous un pansement qui favorise l’action des enzymes de la plaie. Les preuves d’un effet de la détersion sur la cicatrisation restent de faible qualité.</p>
<div class="lab">Pansements</div><p>Une revue Cochrane en réseau de 59 essais ne permet de désigner aucun pansement supérieur pour la cicatrisation complète, car les essais sont petits et la certitude des preuves est faible ou très faible. Seuls les pansements à l’argent montrent, face à un pansement non adhérent, une probabilité de cicatrisation plus élevée, avec une certitude modérée au sein d’un réseau de faible certitude. Le choix suit donc l’exsudat : un pansement absorbant pour une plaie qui coule, un pansement qui maintient l’humidité pour une plaie sèche. La peau périlésionnelle, souvent eczémateuse, est protégée de la macération ; les topiques multiples exposent à des eczémas de contact.</p>
<div class="lab">Infection</div><p>La colonisation bactérienne de surface est constante et sans signification. Un prélèvement systématique n’est pas utile. En l’absence d’infection clinique, ni antibiotique local ni antibiotique systémique ne sont recommandés (recommandation 67, III B). Dans une revue Cochrane, l’iode cadexomère a augmenté la proportion d’ulcères complètement cicatrisés entre 4 et 12 semaines par rapport aux soins habituels, dans quatre essais anciens et de petite taille parmi les onze qui l’étudiaient (rapport de risques 2,17, intervalle de confiance à 95 % de 1,30 à 3,60 ; O’Meara et al., 2014). Le pansement à l’argent n’a montré un avantage que face à un pansement non adhérent, dans une méta-analyse en réseau de faible certitude (Norman et al., 2018). Aucun des deux ne remplace la compression.</p>
<div class="lab">Douleur</div><p>Une douleur de fond liée à la plaie touche environ 80 % des patients. Une crème anesthésiante locale réduit la douleur de la détersion ; la douleur persistante suit les paliers antalgiques de l’Organisation mondiale de la santé.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 6.1.2, 6.1.3 et 6.2, recommandation 67 ; Norman et al., revue Cochrane des pansements et agents topiques de l’ulcère veineux, 2018.</p></template>

<template data-pop="i83-stent" data-title="Obstruction iliaque et stent veineux">
<p>Un stent veineux iliaque se discute seulement chez un patient sévèrement symptomatique, par une équipe multidisciplinaire. L’image d’une compression ou d’une obstruction sans symptôme sévère ne justifie aucune intervention (recommandation 61, III C).</p>
<div class="lab">Mécanisme</div><p>Une veine iliaque rétrécie freine la vidange du membre à l’effort, quand le débit veineux augmente : la pression monte dans la jambe, d’où l’œdème, la claudication veineuse et parfois l’ulcère. L’obstruction peut être non thrombotique, comme dans le syndrome de May-Thurner, ou post-thrombotique : un thrombus mal recanalisé laisse une veine fibreuse et cloisonnée.</p>
<div class="lab">Traitement</div><p>La recanalisation endovasculaire avec stent est le premier choix chez le patient sévèrement symptomatique (recommandation 58, IIa B). L’échographie endovasculaire guide la taille et la position du stent (recommandation 59, IIa C). L’angioplastie seule ne suffit pas, car la veine se rétracte aussitôt. Après au moins six mois, la perméabilité atteint 95 à 100 % après une compression non thrombotique, mais 70 à 80 % après une obstruction post-thrombotique, surtout parce que les veines d’amont, elles aussi altérées, apportent moins de sang au stent. Une chirurgie ou un geste hybride se discute si la voie endovasculaire échoue (recommandation 60, IIb C).</p>
<div class="lab">Traitement antithrombotique</div><p>Le type et la durée de l’anticoagulation après stent n’ont pas été étudiés. Un consensus d’experts (Delphi) propose de la poursuivre au moins six mois après l’intervention chez un patient aux antécédents de thrombose profonde ; aucun consensus n’existe pour les antiplaquettaires.</p>
<div class="lab">Limites</div><p>Les études sont hétérogènes et sujettes à des biais de sélection ; le bénéfice clinique est plausible chez des patients bien choisis, mais mal quantifié.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 5.3.1 à 5.3.6, recommandations 58 à 63.</p></template>

<template data-pop="i83-pelvien" data-title="Varices d’origine pelvienne">
<p>Des varices de la vulve, du périnée ou de la face postérieure et interne de la cuisse, ou des varices qui récidivent avec une jonction saphéno-fémorale continente, font rechercher un reflux pelvien. Sans symptômes pelviens, elles se traitent localement ; l’embolisation pelvienne est réservée aux douleurs pelviennes chroniques d’origine veineuse.</p>
<div class="lab">Mécanisme</div><p>Une veine ovarienne ou testiculaire, ou une veine iliaque interne incompétente, transmet la pression du bassin aux veines superficielles par des points de fuite : périnéal, inguinal, obturateur, clitoridien, fessiers inférieur et supérieur. Une compression de la veine iliaque commune gauche ou de la veine rénale gauche peut inverser le flux et produire le même tableau. Les grossesses successives aggravent les varices vulvaires.</p>
<div class="lab">Diagnostic</div><p>L’écho-Doppler debout de tout le membre est complété par l’étude des points de fuite pelviens (recommandation 84, I C), puis, chez la femme, par une échographie abdominale ou transvaginale (recommandation 85, IIa B). Des varices vulvaires peuvent aussi venir de la jonction saphéno-fémorale par une veine honteuse externe : leur origine se démontre, elle ne se suppose pas.</p>
<div class="lab">Décision</div><p>Sans symptôme pelvien, le traitement local, par mousse, phlébectomies ou ligature des points de fuite, vient d’abord (recommandation 86, IIa C). L’embolisation n’est pas proposée en première intention (recommandation 87, III C), car elle n’a amélioré les varices des jambes que chez 51 % des patientes dans une série et 14 % de 43 patientes dans une autre. En cas de douleur pelvienne chronique, après exclusion d’une endométriose, d’une infection pelvienne, d’adhérences ou d’une cause digestive ou urinaire (recommandation 83, I C), l’embolisation des veines gonadiques et iliaques internes est envisagée (recommandation 88, IIa B).</p>
<div class="lab">Homme</div><p>Chez l’homme, des varices de cuisse ou du scrotum peuvent naître d’un reflux iliaque interne ou testiculaire ; la varicocèle relève de l’urologie.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, chapitre 7, recommandations 83 à 88.</p></template>

<template data-pop="i83-grossesse" data-title="Varices et grossesse">
<p>Pendant la grossesse, les varices se traitent par des bas de compression, et aucun traitement interventionnel n’est fait. Les varices régressent souvent après l’accouchement ; le traitement éventuel attend trois à six mois.</p>
<div class="lab">Mécanisme</div><p>Le volume sanguin augmente, la paroi veineuse se laisse distendre sous l’effet hormonal et l’utérus gravide gêne le retour veineux iliaque et cave. Ces mécanismes, avancés pour expliquer l’aggravation, s’additionnent surtout au troisième trimestre : l’œdème des jambes touche alors jusqu’à 80 % des femmes. Des varices vulvaires apparaissent souvent et s’aggravent à chaque grossesse.</p>
<div class="lab">Conduite</div><p>Les bas de compression sont recommandés chez la femme enceinte symptomatique (recommandation 93, I B) ; ils réduisent le diamètre et le reflux des saphènes et soulagent les symptômes. En Suisse, la LiMA rembourse un bas de classe 2 pour des symptômes veineux, mais pas une compression purement préventive pendant la grossesse. Selon les recommandations britanniques citées par l’ESVS, aucun traitement interventionnel n’est proposé pendant la grossesse. Les informations professionnelles suisses du polidocanol demandent en outre qu’aucune sclérose ne soit faite au premier trimestre ni après la 36e semaine.</p>
<div class="lab">Après l’accouchement</div><p>Les télangiectasies, les veines réticulaires et les varices régressent au moins en partie dans les premiers mois. Une évaluation par écho-Doppler trois à six mois après l’accouchement distingue ce qui persiste et mérite un traitement. </p>
<div class="lab">Limites</div><p>Le risque thromboembolique de la grossesse et du post-partum relève du cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie) ; une thrombose superficielle chez la femme enceinte suit la même démarche d’écho-Doppler.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, § 8.2.2, recommandation 93 ; informations professionnelles Aethoxysklerol et Sclerovein (Swissmedic) ; LiMA, chapitre 17, édition du 1.1.2026.</p></template>

<template data-pop="i83-suisse" data-title="Prise en charge en Suisse : remboursement et filière">
<p>L’assurance obligatoire des soins rembourse les bas médicaux de classe 2 ou plus, mesurés par un fournisseur, et l’ablation thermique endoveineuse réalisée par un médecin titulaire de l’attestation de formation complémentaire. Elle ne rembourse pas l’ablation mécanochimique de type Clarivein ; la colle n’est pas réglée par l’OPAS.</p>
<div class="lab">Bas et dispositifs (LiMA, chapitre 17, 1.1.2026)</div><p>Les bas de classe 2 (23 à 32 mmHg) sont remboursés pour les symptômes veineux C&#8288;1 à C&#8288;3, l’insuffisance veineuse chronique C&#8288;3 à C&#8288;6, le lymphœdème de grade 1, la thrombose veineuse profonde aiguë et plusieurs œdèmes d’autre origine. Les classes 3 et 4 (34 mmHg ou plus) le sont pour l’insuffisance veineuse chronique C&#8288;3 à C&#8288;6 et la thrombose aiguë. Le remboursement porte sur deux paires par an au plus et exige qu’un fournisseur mesure, essaie, conseille et contrôle ; un bas mesuré par le patient lui-même n’est pas remboursé. Le sur-mesure n’est pris en charge que si un bas de série ne convient pas. Les bas « anti-thrombose » et de soutien de classe inférieure, la compression sportive, la prévention de la thrombose du voyage et la compression purement préventive de la grossesse ne sont pas remboursés. Les systèmes adaptatifs à bandes autoagrippantes le sont pour C&#8288;3 à C&#8288;5, un jeu par membre et par semestre, sans cumul avec des bas sur le même membre ; un système de bas pour ulcère l’est pour C&#8288;6, deux jeux par jambe et par an.</p>
<div class="lab">Interventions (OPAS, annexe 1, 1.7.2026)</div><p>L’ablation thermique endoveineuse des troncs saphènes par radiofréquence ou laser est une prestation obligatoire si le médecin a suivi le programme de formation complémentaire correspondant. L’ablation mécanochimique de type Clarivein n’est pas remboursée depuis 2013. La colle cyanoacrylate n’étant pas mentionnée, sa prise en charge se vérifie auprès de l’assureur. L’assurance obligatoire prend en charge le diagnostic et le traitement d’une maladie, définie comme une atteinte à la santé qui exige un examen ou un traitement médical (LAMal, art. 3 et 25) ; un traitement purement esthétique de télangiectasies sans plainte ni signe d’atteinte à la santé n’y répond pas, et le patient en est informé avant le geste.</p>
<div class="lab">Filière</div><p>Le médecin de famille reconnaît la maladie, mesure la pression de cheville, prescrit la compression et repère les signes de gravité. Il adresse à un angiologue ou à un chirurgien vasculaire pour l’écho-Doppler et l’indication interventionnelle, en urgence après une hémorragie et rapidement devant un ulcère.</p>
<div class="lab">Source</div><p>Liste des moyens et appareils, chapitre 17, positions 17.02, 17.03, 17.05 et 17.06, édition du 1.1.2026 ; OPAS, annexe 1, édition du 1.7.2026 ; loi fédérale sur l’assurance-maladie (LAMal), art. 3 et 25.</p></template>

<template data-pop="pareto-i83-tt" data-title="Pareto — Complications et traitement">
<p class="ratio" data-cover="i83-8,i83-9,i83-10"></p>
<ul><li>Une varice qui saigne se traite par jambe surélevée et pression, puis par orientation urgente et mousse locale.</li><li>Une thrombose superficielle impose un écho-Doppler de tout le membre ; elle ne reçoit pas d’antibiotique, et une intervention superficielle aiguë n’est pas recommandée (classe III, niveau C), hormis l’évacuation d’un thrombus court de collatérale ; l’anticoagulation suit le cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie) ; l’ablation du reflux se discute après trois mois.</li><li>Un ulcère ne reçoit un antibiotique qu’en cas d’infection clinique.</li><li>Le traitement conservateur abaisse la pression veineuse : marche, surélévation, perte de poids, compression.</li><li>La compression vise au moins 15 mmHg pour les symptômes, 20 à 40 mmHg pour l’œdème et la peau, 40 mmHg ou plus pour l’ulcère ; elle ne prévient pas la progression.</li><li>La pression de cheville et l’index se mesurent avant toute compression.</li><li>Les veinotropes soulagent sans remplacer compression ni intervention.</li><li>On traite les varices symptomatiques et les classes C&#8288;4 à C&#8288;6, jamais un reflux isolé ; un œdème isolé fait chercher une autre cause.</li><li>L’ablation thermique est le premier choix des troncs saphènes ; la mousse est proposée de préférence pour les troncs de moins de 6 mm et pour les collatérales.</li><li>L’intervention est ambulatoire, sous tumescence, sans interruption de l’anticoagulant ; la prophylaxie est individuelle ; l’écho-Doppler précoce s’impose devant un symptôme ou un haut risque, et sa place chez les autres patients diverge entre l’ESVS 2022, qui le suggère, et les recommandations nord-américaines de 2023, qui le déconseillent après ablation thermique.</li><li>L’extension du thrombus liée à l’ablation (ARTE, ancienne EHIT) de classe II à IV survient dans 1,4 % des ablations de la grande saphène. Pas d’écho-Doppler précoce systématique chez le patient asymptomatique à risque moyen ; une ARTE symptomatique, ou de classe III ou IV, reçoit un anticoagulant oral direct jusqu’à la rétraction du thrombus (Gloviczki et al., 2023).</li><li>En Suisse, l’ablation thermique est remboursée sous condition de formation ; l’ablation mécanochimique ne l’est pas.</li></ul></template>

<template data-pop="pareto-i83-crit" data-title="Pareto — Ulcère, atteintes profondes et critères">
<p class="ratio" data-cover="i83-11,i83-12,i83-13,i83-14"></p>
<ul><li>Tout ulcère de jambe exige la mesure de la pression de cheville et de l’index ; au-dessus de 0,8, la compression complète est possible.</li><li>L’ulcère veineux guérit par une compression d’au moins 40 mmHg et une ablation endoveineuse dans les deux semaines (EVRA).</li><li>La suppression du reflux superficiel réduit la récidive (ESCHAR) ; elle se fait même en présence d’un reflux profond associé.</li><li>Il n’y a pas de compression soutenue sous 60 mmHg à la cheville, 30 mmHg à l’orteil ou un index de 0,6 ; l’ulcère mixte reçoit moins de 40 mmHg sous surveillance.</li><li>Le syndrome post-thrombotique se diagnostique trois mois au moins après la thrombose ; Villalta 5 à 9 léger, 10 à 14 modéré, plus de 14 ou ulcère sévère.</li><li>Un stent iliaque se pose seulement si les symptômes sont sévères, en équipe multidisciplinaire.</li><li>Les varices pelviennes sans douleur pelvienne se traitent localement, sans embolisation première.</li><li>La récidive vient de la néovascularisation, de la recanalisation ou de la progression ; elle se traite par voie endoveineuse ou mousse.</li><li>Pendant la grossesse, la compression suffit ; l’intervention attend trois à six mois après l’accouchement.</li><li>Le reflux est pathologique au-delà de 0,5 seconde dans une veine superficielle ou une perforante, et au-delà de 1 seconde dans les veines fémorale commune, fémorale et poplitée.</li></ul></template>
