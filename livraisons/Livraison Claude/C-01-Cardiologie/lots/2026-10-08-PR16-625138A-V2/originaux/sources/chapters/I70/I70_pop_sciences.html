<template data-pop="i70-collateral" data-title="Collatérales : débit de repos et réserve d’effort"><p>Une collatérale est une connexion artérielle qui permet au sang de contourner un obstacle. Une obstruction progressive favorise le développement de ces voies. Leur capacité dépend de leur calibre, de la pression d’entrée et du réseau distal.</p><p>Un patient peut conserver un pied chaud malgré une occlusion ancienne. La suppléance maintient alors le débit basal. Pendant l’effort, les besoins augmentent et dépassent parfois la capacité des collatérales.</p><div class="key"><b>À retenir.</b> La présence d’une suppléance n’équivaut pas à une perfusion normale. L’examen mesure son retentissement, puis l’imagerie décrit le réseau.</div></template>
<template data-pop="i70-calcification" data-title="Médiacalcose et index cheville-bras élevé"><p>La médiacalcose calcifie la couche musculaire de l’artère. Elle peut rendre le vaisseau difficile à comprimer avec un brassard. La pression nécessaire pour faire disparaître le signal Doppler devient artificiellement élevée.</p><p>Un index supérieur à 1,40 ne permet donc pas d’exclure une artériopathie. Le médecin confronte les symptômes, les plaies et les ondes Doppler. Il complète selon la question par l’index orteil-bras, la pression d’orteil ou une mesure de perfusion tissulaire.</p><div class="trap"><b>Piège.</b> Une artère rigide peut aussi être sténosée. Une valeur haute ne constitue pas un certificat de bonne circulation.</div></template>
<template data-pop="i70-reserve" data-title="Réserve vasodilatatrice et claudication"><p>La réserve vasodilatatrice correspond à la capacité d’augmenter le débit lorsque les besoins augmentent. En aval d’une sténose, les artérioles peuvent être déjà dilatées au repos. Il reste moins de capacité d’adaptation pendant la marche.</p><p>La douleur d’effort apparaît lorsque l’apport ne couvre plus les besoins musculaires. L’arrêt diminue la consommation et soulage la douleur. Un index de repos peu altéré peut conduire à une exploration après effort si l’histoire évoque une limitation artérielle.</p><div class="key"><b>À retenir.</b> Le mécanisme explique la reproductibilité à l’effort. Il ne dispense pas d’examiner les autres causes de douleur.</div></template>
<template data-pop="pareto-i70-sciences" data-title="Pareto — Sciences fondamentales de l’artériopathie"><p class="ratio" data-cover="i70-sa,i70-sb,i70-sp"></p><p>Le trajet aorto-iliaque, fémoro-poplité et jambier organise la recherche des pouls. La topographie de la douleur oriente un étage sans le démontrer. Les collatérales peuvent préserver le repos alors que la marche dépasse leur capacité.</p><p>La plaque se développe dans l’intima. Sa complication peut déclencher une thrombose. La médiacalcose rigidifie la média et peut rendre l’index cheville-bras ininterprétable. Ces mécanismes coexistent parfois.</p><p>Le débit dépend du gradient de pression et des résistances. La loi du rayon à la puissance quatre fournit un modèle simplifié. La perfusion réelle dépend aussi des collatérales, de la microcirculation et du contenu en oxygène. La reperfusion peut provoquer un syndrome des loges malgré le retour du pouls.</p></template>
