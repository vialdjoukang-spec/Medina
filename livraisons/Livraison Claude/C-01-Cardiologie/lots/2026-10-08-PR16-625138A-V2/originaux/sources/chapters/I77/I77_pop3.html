
<!-- ===== FENÊTRES I77 : décisions thérapeutiques, sources et monographies ===== -->
<template data-pop="i77-iec-stenose" data-title="IEC et ARA en cas de sténose de l’artère rénale">
<div class="lab">Bénéfice</div><p>La sténose active le système rénine-angiotensine ; les IEC et les ARA bloquent ce système et abaissent efficacement la pression.</p>
<div class="lab">Risque</div><p>En aval d’une sténose, la filtration glomérulaire dépend de la contraction de l’artériole efférente par l’angiotensine II. Le bloqueur la supprime : la filtration du rein sténosé baisse. Si l’autre rein est sain, la créatinine change peu ; si la sténose est bilatérale ou sur rein unique, elle peut monter brutalement.</p>
<div class="lab">Surveillance</div><p>Créatinine et kaliémie une à deux semaines après l’introduction et après chaque augmentation de dose. L’ESVS 2025 demande prudence et suivi rapproché en cas de sténose bilatérale ou sur rein unique.</p>
<div class="lab">Critère de modification</div><p>Une hausse de la créatinine de plus de 30 % fait réduire ou arrêter le bloqueur et rechercher une sténose bilatérale serrée, qui peut justifier une revascularisation.</p>
<div class="lab">Grossesse</div><p>IEC et ARA sont contre-indiqués pendant la grossesse ; une patiente en âge de procréer est informée avant la prescription.</p></template>

<template data-pop="i77-angioplastie" data-title="Angioplastie rénale au ballonnet dans la dysplasie">
<div class="lab">Technique</div><p>Un ballonnet gonflé dans la zone sténosée rompt les voiles fibreux internes du collier de perles. Le gradient de pression est mesuré avant et après, car l’aspect angiographique juge mal le résultat.</p>
<div class="lab">Pourquoi pas de stent d’emblée</div><p>L’artère rénale bouge avec la respiration et la lésion est longue : un stent s’y fracture et s’y resténose. Le stent est réservé au sauvetage, en cas de dissection ou d’échec du ballonnet (ESVS 2025).</p>
<div class="lab">Indications</div><p>ESVS 2025 : hypertension résistante sous au moins trois antihypertenseurs avec sténose dysplasique de plus de 70 % (classe IIa, niveau C). Consensus 2019 : aussi hypertension récente chez un sujet jeune, intolérance aux médicaments, perte de taille rénale attribuée à l’ischémie.</p>
<div class="lab">Résultats (méta-analyse 2022 citée par l’ESVS)</div><p>Guérison de 37 % avec des définitions larges, 18 % avec une définition stricte ; complications majeures 4,6 % ; complications rénales 7,0 % ; liberté de resténose 87 % à un an, 71 % à cinq ans. Une revue de 2010 rapportait une guérison de 36 % après angioplastie et de 54 % après chirurgie, avec 6 % et 15 % de complications majeures.</p>
<div class="lab">Après le geste</div><p>Antiagrégation à vie ; contrôle de la perméabilité par écho-Doppler ; poursuite des antihypertenseurs si nécessaire.</p></template>

<template data-pop="i77-antiplaq-dissection" data-title="Antiagrégation après dissection viscérale : source retenue et désaccord">
<div class="lab">Recommandation retenue</div><p>ESVS 2025, recommandation 96 (modifiée) : une antiagrégation doit être considérée chez les patients traités médicalement pour une dissection isolée de l’artère mésentérique supérieure ou du tronc cœliaque (classe IIa, niveau C, consensus). L’ESVS suit la recommandation de ses lignes directrices de 2023 sur les antithrombotiques.</p>
<div class="lab">Données contraires</div><p>Une revue systématique d’études observationnelles, citée par l’ESVS, trouvait une évolution simple chez 89,1 % des patients avec antithrombotique et 90,1 % sans (risque relatif 0,96 ; intervalle de confiance à 95 % : 0,87 à 1,05).</p>
<div class="lab">Lecture</div><p>Les données ne montrent pas de bénéfice, mais elles sont observationnelles et peu puissantes pour des événements rares. La recommandation repose sur le consensus et sur le risque théorique de thrombose dans un faux chenal.</p>
<div class="lab">Choix retenu</div><p>Le cours suit l’ESVS 2025, source primaire la plus récente applicable, en signalant la faiblesse de la preuve. Le texte en vigueur précédent, l’ESVS 2017, est remplacé par cette mise à jour.</p></template>

<template data-pop="i77-aod-thh" data-title="Anticoagulant dans la télangiectasie : sources et limites">
<div class="lab">Texte en vigueur</div><p>Deuxièmes recommandations internationales (Faughnan et al., <i>Annals of Internal Medicine</i> 2020), recommandation sur l’anticoagulation : anticoaguler ou antiagréger lorsqu’il existe une indication, en tenant compte du risque hémorragique individuel ; la maladie n’est pas une contre-indication absolue (qualité faible, recommandation forte). Commentaire clinique : héparine non fractionnée, héparines de bas poids moléculaire et antivitamines K sont préférées aux AOD, décrits comme moins bien tolérés.</p>
<div class="lab">Fondement</div><p>Cette préférence repose sur des séries observationnelles, sans essai comparatif. Aucune recommandation internationale plus récente n’a été identifiée lors de la rédaction.</p>
<div class="lab">Recommandation sur les associations</div><p>Éviter, lorsque c’est possible, la double antiagrégation et l’association antiagrégant plus anticoagulant (consensus, recommandation faible). Si elle est indispensable, la durée est minimisée et la surveillance rapprochée.</p>
<div class="lab">Fibrillation auriculaire</div><p>Si l’anticoagulation n’est pas tolérée, une fermeture de l’auricule gauche peut être discutée (cours I48 — Fibrillation et flutter auriculaires, C-01-Cardiologie).</p></template>

<template data-pop="i77-aortite" data-title="Bilan étiologique d’une aortite">
<div class="lab">Situation</div><p>Une aortite est découverte à l’examen histologique d’un anévrisme opéré, ou suspectée sur un épaississement de la paroi aortique à l’imagerie.</p>
<div class="lab">Causes à chercher</div><p>Vascularites des gros vaisseaux : artérite à cellules géantes, artérite de Takayasu (M31). Maladie liée aux IgG4. Spondylarthrites, maladie de Behçet, polychondrite. Infections : syphilis, tuberculose, salmonelles, staphylocoques.</p>
<div class="lab">Examens</div><p>CRP et vitesse de sédimentation, sérologies de la syphilis, hémocultures en cas de fièvre, test de libération d’interféron gamma pour la tuberculose, IgG4 sériques, examen histologique et microbiologique de la pièce, imagerie de tout l’arbre artériel, éventuellement par TEP-TDM au FDG.</p>
<div class="lab">Codage</div><p>Le code I77.6 n’est conservé que si aucune cause n’est trouvée. Une aortite syphilitique se code A52.0† et I79.1* ; une artérite à cellules géantes, M31.5 ou M31.6.</p>
<div class="lab">Conséquence pratique</div><p>Une aortite isolée apparemment guérie après chirurgie peut évoluer vers de nouveaux anévrismes : une imagerie de surveillance de l’aorte restante est organisée.</p></template>

<template data-pop="i77-criteres-ligament" data-title="Critères diagnostiques du syndrome du ligament arqué médian">
<div class="lab">Source</div><p>ESVS 2025, recommandation 26 (classe IIa, niveau C), reprenant les critères d’inclusion de l’essai randomisé CARoSO.</p>
<div class="lab">Critères</div><p>1. Douleur après le repas associée à au moins un des éléments suivants : modification alimentaire, perte de poids inexpliquée, diarrhée inexpliquée. 2. Compression extrinsèque du tronc cœliaque avec sténose d’au moins 70 %, démontrée par deux techniques parmi l’écho-Doppler, l’angio-IRM, l’angioscanner et l’angiographie, dont au moins un angioscanner en inspiration et en expiration en coupes de 1 mm. 3. Échographie abdominale et œsogastroduodénoscopie normales.</p>
<div class="lab">Exigence supplémentaire</div><p>Le diagnostic est validé par une équipe pluridisciplinaire d’un centre spécialisé (recommandation 28, classe I).</p>
<div class="lab">Lecture</div><p>Ces critères sont un consensus destiné à homogénéiser les patients opérés ; ils ne prouvent pas que la compression cause la douleur.</p></template>

<template data-pop="i77-d-aspirine" data-title="Aspirine à faible dose">
<div class="lab">Mécanisme</div><p>L’acide acétylsalicylique acétyle de façon irréversible la cyclo-oxygénase 1 des plaquettes. La plaquette, sans noyau, ne resynthétise pas l’enzyme : la production de thromboxane reste bloquée pendant sa durée de vie, sept à dix jours.</p>
<div class="lab">Place dans le cours</div><p>Dysplasie fibromusculaire : 75 à 100 mg par jour, jugée raisonnable en l’absence de contre-indication pour prévenir les complications thromboemboliques (consensus international 2019, avis d’experts). Ce n’est pas un traitement systématique : la décision tient compte du risque hémorragique, et l’argument est le plus fort dans l’atteinte cervicale ou intracrânienne et après une dissection ; à vie après une angioplastie (ESVS 2025) ; dissection viscérale traitée médicalement (ESVS 2025, classe IIa). Aucun essai randomisé n’a évalué l’aspirine dans la dysplasie.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Saignement digestif, ulcère, asthme induit par l’aspirine. Contre-indications usuelles : ulcère évolutif, diathèse hémorragique, allergie aux salicylés.</p>
<div class="lab">Télangiectasie</div><p>L’aspirine n’est prescrite que s’il existe une indication propre, car elle aggrave les saignements.</p></template>

<template data-pop="i77-d-txa" data-title="Acide tranexamique">
<div class="lab">Mécanisme</div><p>Analogue de la lysine qui occupe les sites de liaison du plasminogène. Le plasminogène ne se fixe plus sur la fibrine et ne se transforme plus en plasmine : le caillot formé n’est pas dissous.</p>
<div class="lab">Preuves dans la télangiectasie</div><p>Deux essais randomisés contre placebo ont montré une réduction de la sévérité des épistaxis, avec peu d’effets indésirables ; les recommandations de 2020 en font une recommandation forte après échec de l’humidification. Les essais ont utilisé des doses de l’ordre de 3 g par jour.</p>
<div class="lab">Forme et posologie en Suisse</div><p>Cyklokapron, comprimés pelliculés de 500 mg, sur ordonnance. Dose usuelle de l’adulte selon l’information suisse destinée aux patients : 2 à 3 comprimés deux à trois fois par jour. Les épistaxis récidivantes figurent parmi les usages. La dose est réduite en insuffisance rénale.</p>
<div class="lab">Contre-indications</div><p>Selon l’information suisse : trouble aigu ou connu de la coagulation avec tendance thrombotique, hypersensibilité, certaines hémorragies sous-arachnoïdiennes, insuffisance rénale sévère, antécédent de convulsions.</p>
<div class="lab">Effets indésirables</div><p>Troubles digestifs, rarement troubles visuels et convulsions. Le risque thrombotique est une préoccupation théorique ; il n’a pas été mis en évidence dans les essais de la télangiectasie, qui excluaient les patients à haut risque.</p>
<div class="lab">Source</div><p>Information destinée aux patients suisses, mise à jour du 11.09.2026 ; l’information professionnelle du Compendium n’a pas pu être consultée, son accès exigeant une connexion.</p></template>

<template data-pop="i77-d-bevacizumab" data-title="Bévacizumab">
<div class="lab">Mécanisme</div><p>Anticorps monoclonal humanisé qui neutralise le VEGF circulant. Il réduit l’angiogenèse anormale entretenue par le déséquilibre de la voie BMP9-ALK1-endogline.</p>
<div class="lab">Preuves</div><p>Séries non contrôlées. Dans la cohorte internationale rétrospective InHIBIT-Bleed (238 patients, <i>Haematologica</i> 2021), l’hémoglobine passait en moyenne de 86 à 118 g/L, le score de sévérité des épistaxis de 6,8 à 3,4, et les transfusions baissaient de 82 % pendant les six premiers mois.</p>
<div class="lab">Posologie</div><p>5 mg/kg par voie intraveineuse par perfusion. Le rythme d’induction et d’entretien varie selon les centres et les publications ; il est fixé par le centre expert.</p>
<div class="lab">Statut en Suisse</div><p>Autorisé en oncologie ; son emploi dans la télangiectasie est hors indication et demande une garantie de prise en charge préalable.</p>
<div class="lab">Effets indésirables et précautions</div><p>Hypertension, protéinurie, fatigue, thromboses veineuses et artérielles, retard de cicatrisation, perforation digestive rare. Le traitement est suspendu plusieurs semaines avant une chirurgie programmée. Une contraception efficace est nécessaire, car l’inhibition du VEGF est néfaste pour le fœtus.</p>
<div class="lab">Surveillance</div><p>Pression artérielle et protéinurie avant chaque perfusion.</p></template>

<template data-pop="i77-d-pomalidomide" data-title="Pomalidomide : place après l’essai PATH-HHT">
<div class="lab">Mécanisme</div><p>Analogue du thalidomide qui se fixe au céréblon, une protéine du système de dégradation des protéines par l’ubiquitine. Dans la télangiectasie, il réduirait l’angiogenèse anormale et favoriserait la couverture des vaisseaux par les cellules murales ; ce mécanisme reste incomplètement établi.</p>
<div class="lab">Preuve</div><p>Essai randomisé PATH-HHT, <i>New England Journal of Medicine</i> 2024 : 144 patients avec épistaxis modérées à sévères, pomalidomide 4 mg par jour ou placebo pendant 24 semaines (répartition 2:1). Différence du score de sévérité des épistaxis : −0,94 point (intervalle de confiance à 95 % : −1,57 à −0,31), au-delà du seuil cliniquement utile de 0,71 ; qualité de vie améliorée. L’essai a été arrêté pour efficacité lors d’une analyse intermédiaire.</p>
<div class="lab">Relation avec les recommandations</div><p>Les recommandations en vigueur datent de 2020 et ne citent pas le pomalidomide ; elles recommandent les « antiangiogéniques systémiques » sans le nommer. L’essai de 2024 est la source primaire la plus récente : ce cours le présente comme une option fondée sur un essai randomisé, réservée aux centres experts, sans recommandation formelle actualisée.</p>
<div class="lab">Effets indésirables et précautions</div><p>Neutropénie, constipation, éruption cutanée, risque thromboembolique, tératogénicité majeure : programme de prévention de la grossesse obligatoire. Les inhibiteurs puissants du CYP1A2, comme la fluvoxamine, augmentent son exposition.</p>
<div class="lab">Statut en Suisse</div><p>Autorisé dans le myélome multiple ; hors indication dans la télangiectasie.</p></template>

<template data-pop="i77-d-fer" data-title="Fer oral et intraveineux">
<div class="lab">Fer oral</div><p>35 à 65 mg de fer élément une fois par jour, deux heures avant ou une heure après un repas (recommandations 2020). Une prise un jour sur deux est une alternative : chaque prise élève l’hepcidine, qui réduit l’absorption intestinale pendant environ un jour.</p>
<div class="lab">Critère d’échec</div><p>Une hausse de l’hémoglobine de moins de 10 g/L chez un patient anémique est insuffisante ; le médecin change de préparation, de rythme ou passe à la voie intraveineuse.</p>
<div class="lab">Fer intraveineux</div><p>Indiqué si le fer oral est inefficace, mal absorbé ou mal toléré, ou si l’anémie est sévère. Une dose initiale totale de 1 g peut être donnée en une ou plusieurs perfusions ; des perfusions régulières sont nécessaires dans les saignements chroniques sévères. Pour le carboxymaltose ferrique, la dose unique maximale et la dose par kilo sont celles de l’information professionnelle du produit.</p>
<div class="lab">Effets indésirables</div><p>Fer oral : troubles digestifs. Fer intraveineux : réactions d’hypersensibilité rares, qui imposent une surveillance pendant et après la perfusion ; hypophosphatémie après carboxymaltose ferrique, parfois symptomatique en cas de doses répétées.</p>
<div class="lab">Interactions</div><p>Le fer oral est pris à distance du calcium, des antiacides, de la lévothyroxine, des quinolones et des tétracyclines.</p></template>

<template data-pop="i77-d-amoxicilline" data-title="Prophylaxie antibiotique des porteurs de malformation pulmonaire">
<div class="lab">Indication</div><p>Recommandation de 2011, toujours en vigueur : prophylaxie antibiotique avant les gestes exposant à une bactériémie, chez tout patient porteur d’une malformation pulmonaire, traitée ou non. La molécule n’est pas précisée par les recommandations de la télangiectasie.</p>
<div class="lab">Schéma de référence transposé</div><p>Les schémas de la prophylaxie de l’endocardite (ESC 2023) sont appliqués : amoxicilline 2 g par voie orale, 30 à 60 minutes avant le geste. En cas d’allergie à la pénicilline, l’ESC 2023 propose la céfalexine 2 g en l’absence d’antécédent d’anaphylaxie, l’azithromycine ou la clarithromycine 500 mg, ou la doxycycline 100 mg ; la clindamycine n’y est plus recommandée.</p>
<div class="lab">Justification</div><p>Une bactériémie dentaire franchit la malformation sans filtration capillaire et peut provoquer un abcès cérébral, comme chez la mère du patient B.</p>
<div class="lab">Limite</div><p>Aucun essai n’a démontré l’efficacité de cette prophylaxie dans les malformations pulmonaires ; elle repose sur le mécanisme et sur le consensus.</p></template>
