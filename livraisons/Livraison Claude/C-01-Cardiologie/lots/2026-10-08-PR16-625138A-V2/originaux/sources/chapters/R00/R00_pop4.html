
<!-- ===== FENÊTRES R00 : examens, sciences, pharmacologie, Pareto ===== -->
<template data-pop="r00-preexc" data-title="Pré-excitation ventriculaire">
<div class="lab">Mécanisme</div><p>Une voie accessoire, faite de myocarde ordinaire, relie l’oreillette au ventricule en court-circuitant le nœud auriculoventriculaire. Elle conduit sans le ralentissement décrémentiel du nœud : une partie du ventricule est activée plus tôt.</p>
<div class="lab">ECG</div><p>PR inférieur à 120 ms ; empâtement initial du QRS, l’onde delta ; QRS élargi ; troubles secondaires de la repolarisation.</p>
<div class="lab">Risques</div><p>La voie peut former le bras d’une tachycardie réciproque. Surtout, en cas de fibrillation auriculaire, elle peut transmettre aux ventricules des fréquences très élevées et provoquer une fibrillation ventriculaire.</p>
<div class="lab">Stratification</div><p>La disparition brutale de la pré-excitation à l’effort indique une voie à période réfractaire longue, donc à faible risque. Les autres cas relèvent d’une évaluation spécialisée, souvent d’une ablation (<a href="#/entry/I47">I47</a>).</p></template>

<template data-pop="r00-qtlong" data-title="QT long : diagnostic et causes">
<div class="lab">Mesure</div><p>Le QT se mesure du début du QRS à la fin de l’onde T, dans la dérivation où il est le plus long, puis se corrige pour la fréquence. La correction de Bazett surcorrige aux fréquences élevées.</p>
<div class="lab">Diagnostic (ESC 2022)</div><p>Un syndrome du QT long est diagnostiqué devant un QTc d’au moins 480 ms sur des ECG à 12 dérivations répétés, avec ou sans symptômes, ou devant un score de Schwartz supérieur à 3, en l’absence de cause secondaire.</p>
<div class="lab">Causes acquises</div><p>Médicaments bloquant le courant potassique IKr, hypokaliémie, hypomagnésémie, hypocalcémie, bradycardie, hypothermie, hypothyroïdie. L’association de plusieurs facteurs multiplie le risque de torsades de pointes.</p>
<div class="lab">Lien avec les palpitations</div><p>Des palpitations suivies de syncope chez un patient au QT long évoquent des torsades de pointes : c’est une urgence (<a href="#/entry/I47">I47</a>).</p></template>

<template data-pop="r00-chrono" data-title="Insuffisance chronotrope">
<div class="lab">Définition usuelle</div><p>Incapacité à atteindre au moins 80 % de la réserve chronotrope attendue à l’effort. La réserve se calcule comme la fréquence maximale théorique (220 − âge) moins la fréquence de repos.</p>
<div class="lab">Exemple chiffré</div><p>Un homme de 70 ans, fréquence de repos 60/min : fréquence maximale théorique 150/min, réserve 90/min. Atteindre moins de 60 + 0,8 × 90 = 132/min à un effort maximal définit une insuffisance chronotrope.</p>
<div class="lab">Signification</div><p>Elle oriente vers une dysfonction sinusale et peut expliquer une fatigue d’effort. Les bêtabloquants la miment : l’interprétation se fait hors traitement freinateur ou en tenant compte de celui-ci.</p>
<div class="lab">Limite</div><p>La formule de la fréquence maximale théorique a une grande variabilité individuelle ; le seuil de 80 % est une convention.</p></template>

<template data-pop="r00-bernoulli" data-title="Équation de Bernoulli simplifiée">
<div class="lab">Principe</div><p>Quand le sang accélère à travers un orifice rétréci, une partie de son énergie de pression se transforme en énergie cinétique. La chute de pression à travers l’orifice est donc liée à la vitesse du jet.</p>
<div class="lab">Formule</div><p>Gradient (mmHg) = 4 × v², avec v la vitesse maximale du jet en m/s mesurée par Doppler continu. La forme simplifiée néglige la vitesse en amont et les pertes visqueuses.</p>
<div class="lab">Exemples</div><p>v = 2 m/s : gradient 16 mmHg. v = 4 m/s : 64 mmHg. v = 5 m/s : 100 mmHg.</p>
<div class="lab">Limites</div><p>Si le faisceau Doppler n’est pas aligné avec le jet, la vitesse est sous-estimée. Si la vitesse en amont est élevée, la formule simplifiée surestime le gradient. Un bas débit abaisse le gradient malgré un orifice serré.</p></template>

<template data-pop="r00-if" data-title="Courant If et canaux HCN4">
<div class="lab">Particularité</div><p>Le courant If s’active quand la cellule s’hyperpolarise, à la fin du potentiel d’action, alors que la plupart des courants s’activent à la dépolarisation. C’est pourquoi il a été qualifié de « funny ».</p>
<div class="lab">Canal</div><p>Il passe par les canaux HCN4, perméables au sodium et au potassium. L’AMPc se lie directement au canal et augmente son ouverture.</p>
<div class="lab">Rôle</div><p>Il contribue à la pente de dépolarisation diastolique du nœud sinusal. La stimulation sympathique l’augmente via l’AMPc ; la stimulation vagale le diminue.</p>
<div class="lab">Pharmacologie</div><p>L’ivabradine bloque le canal ouvert, côté intracellulaire. Elle ralentit la fréquence sinusale sans modifier la contractilité, la conduction auriculoventriculaire ni la pression artérielle.</p></template>

<template data-pop="r00-d-bb" data-title="Bêtabloquants β1-sélectifs dans les palpitations bénignes">
<div class="lab">Mécanisme</div><p>Le blocage des récepteurs β1 réduit l’AMPc dans les cellules sinusales et myocardiques : la pente de phase 4 diminue, la fréquence baisse, l’automatisme anormal et l’activité déclenchée adrénergique diminuent. La contraction est un peu moins vigoureuse, ce qui atténue la perception du battement.</p>
<div class="lab">Indications dans ce cours</div><p>Extrasystoles symptomatiques sur cœur normal après explication ; tachycardie sinusale inappropriée (classe IIa, ESC 2019) ; symptômes adrénergiques de l’hyperthyroïdie en attendant l’euthyroïdie.</p>
<div class="lab">Posologie</div><p>Bisoprolol 1,25 à 2,5 mg par jour au début, jusqu’à 10 mg par jour. Métoprolol succinate 23,75 à 47,5 mg par jour au début, jusqu’à 190 mg par jour. Ces doses reprennent celles des cours I25 et I49 ; l’information professionnelle suisse n’a pas été relue le 08.10.2026.</p>
<div class="lab">Effets indésirables</div><p>Fatigue, bradycardie, froideur des extrémités, troubles du sommeil, troubles de l’érection ; aggravation possible des extrasystoles qui dépendent de la bradycardie.</p>
<div class="lab">Contre-indications</div><p>Bloc auriculoventriculaire de haut degré non appareillé, bradycardie symptomatique, asthme sévère non contrôlé ; prudence chez le patient hypotendu.</p>
<div class="lab">Surveillance</div><p>Fréquence de repos, pression artérielle, effet réel sur les symptômes ; ne pas arrêter brutalement après un traitement prolongé, en raison du rebond adrénergique.</p></template>

<template data-pop="r00-d-propra" data-title="Propranolol">
<div class="lab">Mécanisme</div><p>Bêtabloquant non sélectif et lipophile. Il bloque les récepteurs β1 cardiaques et β2 vasculaires et bronchiques, et réduit les symptômes adrénergiques périphériques comme le tremblement.</p>
<div class="lab">Indications dans ce cours</div><p>Symptômes adrénergiques, syndrome de tachycardie orthostatique posturale à faible dose (classe IIb, HRS 2015 ; <a href="#/entry/I49">I49</a>), hyperthyroïdie symptomatique.</p>
<div class="lab">Posologie</div><p>10 à 20 mg une à deux fois par jour au début ; jusqu’à 40 mg deux à trois fois par jour selon la tolérance. Dans le syndrome de tachycardie orthostatique, une dose faible de 20 mg soulageait mieux qu’une dose de 80 mg dans un essai croisé.</p>
<div class="lab">Contre-indications</div><p>Asthme, car le blocage β2 provoque un bronchospasme ; bradycardie, bloc auriculoventriculaire de haut degré.</p>
<div class="lab">Effets indésirables</div><p>Fatigue, hypotension, cauchemars, masquage des signes adrénergiques d’une hypoglycémie chez le diabétique traité.</p></template>

<template data-pop="r00-d-iva" data-title="Ivabradine dans la tachycardie sinusale inappropriée">
<div class="lab">Mécanisme</div><p>Blocage sélectif du courant If du nœud sinusal : la fréquence sinusale baisse sans effet sur la pression artérielle, la contractilité ni la conduction auriculoventriculaire.</p>
<div class="lab">Place (ESC 2019)</div><p>Dans la tachycardie sinusale inappropriée symptomatique, l’ivabradine seule ou associée à un bêtabloquant est de classe IIa. L’association limiterait l’activation sympathique réflexe que la baisse de fréquence peut entraîner.</p>
<div class="lab">Statut en Suisse</div><p>L’ivabradine est autorisée pour l’angor stable et l’insuffisance cardiaque ; son emploi dans la tachycardie sinusale inappropriée est hors indication, ce qui impose une information de la patiente.</p>
<div class="lab">Posologie</div><p>2,5 à 5 mg deux fois par jour au début, jusqu’à 7,5 mg deux fois par jour, au cours des repas. Ces doses reprennent celles des cours I25 et I49.</p>
<div class="lab">Effets indésirables</div><p>Phosphènes, perceptions lumineuses transitoires lors de changements brusques de luminosité, dues au blocage d’un courant rétinien voisin ; bradycardie ; fibrillation auriculaire.</p>
<div class="lab">Contre-indications</div><p>Grossesse et allaitement, d’où une contraception efficace chez la femme en âge de procréer ; inhibiteurs puissants du CYP3A4 ; vérapamil et diltiazem ; insuffisance hépatique sévère ; dysfonction sinusale.</p></template>

<!-- ===== PARETO ===== -->
<template data-pop="pareto-r00-def" data-title="Pareto — Définitions, classifications, épidémiologie">
<p class="ratio" data-cover="r00-1,r00-2"></p>
<ul><li>R00 et R01 codent des symptômes provisoires ; un diagnostic précis remplace le code R.</li><li>Quatre types de palpitations : extrasystoliques, tachycardiques, anxieuses, pulsatiles ; le début brutal oriente vers une réentrée.</li><li>Tachycardie au-delà de 100/min ; bradycardie sous 50/min selon l’ESC 2021.</li><li>Souffle innocent, fonctionnel (débit, cause à traiter) ou organique (lésion) ; tout souffle diastolique est organique.</li><li>Palpitations : cause cardiaque 43 %, psychiatrique 31 %, mortalité à un an 1,6 %, récidive 75 % (Weber et Kapoor).</li><li>Les tachycardies supraventriculaires sont souvent prises pour un trouble panique.</li><li>Souffle du nouveau-né : cardiopathie dans un tiers des cas ; sujet âgé : sclérose aortique chez 29 % après 65 ans.</li></ul></template>

<template data-pop="pareto-r00-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="r00-3"></p>
<ul><li>Le patient perçoit un changement de battement, surtout le battement renforcé après une pause extrasystolique.</li><li>La réentrée commence et cesse en un battement ; la tachycardie sinusale varie progressivement.</li><li>La tolérance d’une fréquence dépend de la réserve ventriculaire, et non du chiffre.</li><li>Un souffle naît d’une vitesse accrue, d’un orifice rétréci ou d’un flux anormal ; aucun flux diastolique normal n’est turbulent.</li></ul></template>

<template data-pop="pareto-r00-etio" data-title="Pareto — Étiologies">
<p class="ratio" data-cover="r00-4"></p>
<ul><li>Palpitations : arythmie, tachycardie sinusale secondaire, substance ou médicament, perception amplifiée.</li><li>Bradycardie de découverte : physiologique ou médicamenteuse d’abord, y compris les collyres bêtabloquants ; cause réversible corrigée avant tout stimulateur.</li><li>Holosystolique : fuite mitrale ou communication interventriculaire ; diastolique : fuite aortique ou rétrécissement mitral ; continu : canal artériel ou bourdonnement veineux.</li><li>Sclérose aortique : B2 conservé ; rétrécissement serré : B2 aboli, pouls carotidien lent.</li></ul></template>

<template data-pop="pareto-r00-clin" data-title="Pareto — Anamnèse et examen clinique">
<p class="ratio" data-cover="r00-5,r00-6"></p>
<ul><li>L’anamnèse décrit un accès précis : début, fin, régularité, durée, fréquence des accès, circonstances, manœuvre vagale, polyurie, symptômes associés.</li><li>Elle recherche une cardiopathie, une mort subite familiale, des médicaments et des substances.</li><li>Devant un souffle : symptômes d’effort chez l’adulte, signes d’insuffisance cardiaque chez l’enfant.</li><li>Le pouls se compte une minute ; l’orthostatisme se teste au besoin ; les pouls fémoraux se palpent chez l’enfant et l’hypertendu jeune.</li><li>Le souffle se décrit en sept caractères, et B2 s’apprécie toujours.</li><li>Souffle qui augmente debout ou pendant le Valsalva : cardiomyopathie hypertrophique obstructive.</li></ul></template>

<template data-pop="pareto-r00-diag" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="r00-7,r00-8"></p>
<ul><li>Une arythmie se diagnostique sur un tracé pendant le symptôme ; l’ECG de repos cherche un substrat.</li><li>Signes d’alarme : syncope, effort, cardiopathie, ECG anormal, mort subite familiale.</li><li>Enregistreur selon la fréquence : Holter pour des accès quotidiens, enregistrement prolongé pour des accès hebdomadaires, moniteur implantable pour des accès rares.</li><li>Régulier à 150/min : flutter 2:1 ; QRS larges : tachycardie ventriculaire jusqu’à preuve du contraire.</li><li>Échocardiographie pour tout souffle diastolique, holosystolique, continu, de grade 3 ou plus, irradiant ou symptomatique.</li><li>Souffle néonatal, nouveau et persistant, ou modifié chez l’enfant : avis spécialisé.</li></ul></template>

<template data-pop="pareto-r00-tt" data-title="Pareto — Urgences et prise en charge">
<p class="ratio" data-cover="r00-9,r00-10"></p>
<ul><li>Instabilité : cardioversion synchronisée pour une tachycardie, atropine 500 µg jusqu’à 3 mg puis isoprénaline ou adrénaline et stimulation pour une bradycardie.</li><li>Tachycardie régulière à QRS fins stable : manœuvre vagale puis adénosine sous ECG.</li><li>Souffles urgents : fièvre, infarctus récent, douleur aortique, syncope d’effort, nouveau-né cyanosé.</li><li>La réassurance s’appuie sur un enregistrement ; la tachycardie sinusale se traite par sa cause, sans être masquée.</li><li>Valsalva modifiée : 43 % de succès contre 17 % (REVERT).</li><li>Antibioprophylaxie réservée aux patients à haut risque.</li></ul></template>

<template data-pop="pareto-r00-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="r00-11,r00-12"></p>
<ul><li>Le pronostic suit le diagnostic final ; les palpitations bénignes récidivent sans menacer la vie.</li><li>Bradycardie sinusale et bloc du premier degré : normaux chez le sportif asymptomatique.</li><li>Grossesse : souffle d’éjection doux fréquent ; souffle diastolique ou symptômes imposent l’échocardiographie.</li><li>Nouveau-né : souffle présumé pathologique ; oxymétrie au premier jour.</li><li>Sujet âgé : distinguer sclérose et rétrécissement ; palpitations irrégulières, fibrillation auriculaire.</li></ul></template>

<template data-pop="pareto-r00-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="r00-e-1,r00-e-2,r00-e-3,r00-e-4,r00-e-5,r00-e-6,r00-e-7"></p>
<ul><li>Examen de référence : ECG pendant l’accès pour l’arythmie ; échocardiographie transthoracique pour le souffle.</li><li>ECG de repos : PR &lt; 120 ms avec onde delta, QTc ≥ 480 ms répété, Brugada de type 1.</li><li>Un Holter sans symptôme pendant l’enregistrement ne répond pas à la question.</li><li>Biologie : hémogramme, ferritine, TSH, potassium, magnésium, glycémie ; métanéphrines seulement si le tableau l’évoque.</li><li>Gradient = 4 × v² ; rétrécissement aortique serré : Vmax ≥ 4 m/s, gradient moyen ≥ 40 mmHg, SVA &lt; 1 cm².</li><li>L’intensité du souffle ne mesure pas la sévérité.</li></ul></template>

<template data-pop="pareto-r00-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="r00-sa,r00-sp,r00-sh,r00-sn"></p>
<ul><li>Les foyers sont les zones de meilleure transmission du son, dans le sens du flux.</li><li>La pente de phase 4 du nœud sinusal, réglée par le courant If et l’horloge calcique, fixe la fréquence ; le sympathique l’accentue, le vague la diminue.</li><li>La forme du souffle suit le gradient : losange pour l’éjection, plateau pour la fuite.</li><li>La perception dépend de l’écart à la prédiction et de l’attention : seule la corrélation symptôme-rythme établit la cause.</li></ul></template>

<template data-pop="pareto-r00-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="r00-p-1,r00-p-2,r00-p-3,r00-p-4,r00-p-5"></p>
<ul><li>Le rythme est documenté avant tout traitement.</li><li>Adénosine 6, 12 puis 18 mg en bolus rapide ; contre-indiquée dans la fibrillation auriculaire pré-excitée.</li><li>Atropine 500 µg, jusqu’à 3 mg ; inefficace chez le transplanté.</li><li>Bêtabloquant β1-sélectif à faible dose pour des extrasystoles symptomatiques ; ivabradine ou bêtabloquant pour une tachycardie sinusale inappropriée.</li><li>Inventaire des médicaments qui accélèrent, ralentissent ou allongent le QT.</li><li>Pas de vérapamil intraveineux dans une tachycardie à QRS larges ; pas d’ivabradine avec vérapamil, diltiazem ou inhibiteur puissant du CYP3A4.</li></ul></template>
