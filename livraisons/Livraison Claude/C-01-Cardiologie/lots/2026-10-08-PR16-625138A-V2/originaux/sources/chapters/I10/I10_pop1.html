
<!-- ===== FENÊTRES I10 : notions fondamentales ===== -->
<template data-pop="i10-natripress" data-title="Natriurèse de pression">
<div class="lab">Définition</div><p>Relation par laquelle une hausse de la pression de perfusion rénale augmente l’excrétion urinaire de sodium et d’eau (Guyton). Elle ramène la pression à l’équilibre en réduisant le volume circulant.</p>
<div class="lab">Mécanisme</div><p>La hausse de pression se transmet aux capillaires péritubulaires et aux vasa recta ; la réabsorption proximale diminue, la rénine est freinée, le sodium est excrété.</p>
<div class="lab">Pourquoi elle explique l’hypertension durable</div><p>Tant que la relation est normale, toute hausse de pression est corrigée par une perte de sel. Une hypertension ne persiste que si le rein a besoin d’une pression plus élevée pour excréter l’apport sodé : courbe déplacée vers la droite (aldostérone, angiotensine II, réduction néphronique, sténose de l’artère rénale) ou aplatie (sensibilité au sel).</p>
<div class="lab">Exemple</div><p>En aval d’une sténose serrée de l’artère rénale, la pression est basse. La pression de perfusion rénale n’est normale que lorsque la pression aortique est élevée ; le rein retient le sel jusqu’à ce niveau.</p></template>

<template data-pop="i10-sraa" data-title="Système rénine-angiotensine-aldostérone dans l’hypertension">
<div class="lab">Déclenchement</div><p>Rénine sécrétée par les cellules juxtaglomérulaires quand la pression de perfusion baisse, quand le chlorure de sodium délivré à la macula densa diminue, ou sous stimulation β1.</p>
<div class="lab">Cascade</div><p>Angiotensinogène → angiotensine I (rénine) → angiotensine II (enzyme de conversion) → récepteur AT1 : vasoconstriction, aldostérone, réabsorption proximale de sodium, soif, hypertrophie, fibrose. L’aldostérone réabsorbe le sodium et sécrète le potassium dans le tube collecteur.</p>
<div class="lab">Dans l’hypertension</div><p>La rénine devrait être freinée par la pression élevée ; elle est souvent « inappropriée ». Les hypertensions à rénine basse (sujet âgé, ascendance africaine, hyperaldostéronisme) répondent mieux aux diurétiques et aux antagonistes minéralocorticoïdes ; celles à rénine haute, aux bloqueurs du système rénine-angiotensine.</p>
<div class="lab">Cibles</div><p>Aliskirène (rénine), IEC, ARA II (AT1), antagonistes minéralocorticoïdes, inhibiteurs de l’aldostérone synthase (en développement).</p></template>

<template data-pop="i10-baro" data-title="Baroréflexe">
<div class="lab">Circuit</div><p>Sinus carotidien (nerf glossopharyngien) et crosse aortique (nerf vague) → noyau du tractus solitaire → hausse du tonus vagal et baisse du tonus sympathique quand la pression monte, et inversement (figure de l’onglet Sciences).</p>
<div class="lab">Rôle</div><p>Amortir les variations rapides, par exemple au lever. Il se recale en quelques jours sur le niveau moyen et ne s’oppose pas à une hypertension chronique.</p>
<div class="lab">Corrélations cliniques</div><p>Âge, diabète et maladies neurodégénératives l’altèrent : hypotension orthostatique, hypertension de décubitus, grande variabilité. Après endartériectomie ou radiothérapie cervicale, une instabilité tensionnelle sévère est possible.</p></template>

<template data-pop="i10-sel" data-title="Sensibilité au sel">
<div class="lab">Définition</div><p>Hausse de la pression lors d’une augmentation de l’apport sodé, et baisse lors de sa réduction, au-delà de la variation moyenne ; c’est un continuum sans seuil consensuel.</p>
<div class="lab">Terrains et mécanismes</div><p>Âge, ascendance africaine, obésité, diabète, maladie rénale chronique, hyperaldostéronisme, faible poids de naissance (moins de néphrons) ; incapacité à freiner le système rénine-angiotensine et le système sympathique lors d’une charge sodée.</p>
<div class="lab">Conséquence pratique</div><p>Chez ces patients, réduire le sel est particulièrement efficace et potentialise les IEC et ARA II. Un apport élevé est une cause classique de résistance ; la natriurèse des 24 heures le mesure (1 g de sel ≈ 17 mmol de sodium).</p></template>

<template data-pop="i10-sympa" data-title="Hyperactivité sympathique">
<div class="lab">Effets</div><p>Fréquence et contractilité ↑ (β1), vasoconstriction (α1), rénine ↑ (β1), réabsorption tubulaire de sodium ↑.</p>
<div class="lab">Causes</div><p>Obésité, apnées du sommeil (hypoxie intermittente), stress, privation de sommeil, maladie rénale chronique, cocaïne, amphétamines, sevrage alcoolique ou de clonidine.</p>
<div class="lab">Clinique et traitement</div><p>Hypertension diastolique du sujet jeune, fréquence de repos élevée, profil nocturne non abaissé. Perte de poids, traitement des apnées, bêtabloquant sur indication, antihypertenseurs centraux en recours, dénervation rénale chez des patients sélectionnés.</p></template>

<template data-pop="i10-remod-vasc" data-title="Remodelage artériolaire">
<div class="lab">Formes</div><p><b>Eutrophique</b> : réarrangement des cellules musculaires lisses autour d’une lumière plus étroite, sans augmentation de la masse pariétale (hypertension primaire). <b>Hypertrophique</b> : masse pariétale accrue (hypertension secondaire sévère, diabète). S’y ajoute une <b>raréfaction capillaire</b>.</p>
<div class="lab">Conséquence</div><p>Les résistances deviennent structurelles. Après la cure tardive d’une cause secondaire (adénome de Conn opéré après des années), la pression baisse mais ne se normalise pas toujours.</p></template>

<template data-pop="i10-rigid" data-title="Rigidité artérielle et hypertension systolique isolée">
<div class="lab">Mécanisme</div><p>Fragmentation de l’élastine, dépôt de collagène et calcifications de la média avec l’âge, accélérés par l’hypertension, le diabète et la maladie rénale chronique.</p>
<div class="lab">Conséquences</div><p>Onde de pouls rapide, onde réfléchie en systole : systolique centrale ↑, diastolique ↓, pression différentielle ↑ (au-delà de 60 mmHg chez le sujet âgé, marqueur de risque). Hypertrophie ventriculaire, perfusion coronaire diastolique réduite, pulsatilité transmise au cerveau et au rein.</p>
<div class="lab">Piège</div><p>On traite selon la systolique ; une diastolique &lt; 60 mmHg sous traitement impose la prudence, surtout chez le coronarien.</p></template>

<template data-pop="i10-hvg" data-title="Hypertrophie ventriculaire gauche et géométrie">
<div class="lab">Adaptation</div><p>Selon la loi de Laplace, épaissir la paroi normalise la contrainte malgré une pression élevée.</p>
<div class="lab">Quatre géométries</div><p><b>Normale</b>. <b>Remodelage concentrique</b> : masse normale, épaisseur relative &gt; 0,42. <b>Hypertrophie concentrique</b> : masse et épaisseur relative augmentées ; surcharge de pression, pronostic le plus sombre. <b>Hypertrophie excentrique</b> : masse augmentée, épaisseur relative normale ; surcharge de volume, obésité.</p>
<div class="lab">De l’adaptation à la maladie</div><p>Fibrose, ischémie sous-endocardique, dysfonction diastolique, dilatation de l’oreillette gauche, fibrillation auriculaire, insuffisance cardiaque à fraction préservée, arythmies ventriculaires.</p>
<div class="lab">Diagnostic différentiel</div><p>Cœur d’athlète, cardiomyopathie hypertrophique (asymétrique, familiale), amylose (bas voltage), maladie de Fabry, rétrécissement aortique. Sous traitement, la masse régresse en six à douze mois.</p></template>

<template data-pop="i10-nephroangio" data-title="Néphroangiosclérose (néphropathie hypertensive)">
<div class="lab">Définition</div><p>Artériolosclérose hyaline, fibrose intimale des artères interlobulaires, ischémie glomérulaire puis glomérulosclérose globale.</p>
<div class="lab">Présentation</div><p>Insuffisance rénale lente, albuminurie modérée, sédiment pauvre, reins symétriques de taille normale ou diminuée.</p>
<div class="lab">Piège</div><p>Diagnostic d’exclusion souvent posé à tort : protéinurie abondante, hématurie, dégradation rapide ou asymétrie rénale font chercher une glomérulopathie ou une sténose de l’artère rénale. Chez les personnes d’ascendance ouest-africaine, des variants d’<i>APOL1</i> expliquent une partie des néphropathies attribuées à l’hypertension.</p></template>

<template data-pop="i10-autoreg" data-title="Autorégulation cérébrale">
<div class="lab">Principe</div><p>Les artérioles cérébrales se contractent quand la pression monte et se dilatent quand elle baisse : débit constant sur une pression moyenne d’environ 60 à 150 mmHg chez le normotendu.</p>
<div class="lab">Chez l’hypertendu chronique</div><p>Le remodelage artériolaire décale la plage vers le haut. Au-dessus de la limite supérieure : rupture de la barrière hématoencéphalique, œdème vasogénique postérieur (encéphalopathie). Au-dessous de la limite inférieure : ischémie, d’où les infarctus cérébraux et cécités corticales après une baisse brutale.</p>
<div class="lab">Règle pratique</div><p>Hors dissection, baisser la pression moyenne d’environ 20 à 25 % en quelques heures, puis progressivement.</p></template>

<!-- ===== FENÊTRES I10 : mesure ===== -->
<template data-pop="i10-mes-cab" data-title="Mesure standardisée au cabinet">
<div class="lab">Conditions</div><p>Pas de café, de tabac ni d’effort dans les 30 minutes ; vessie vide ; cinq minutes assis au calme ; silence.</p>
<div class="lab">Position</div><p>Dos appuyé, pieds au sol, jambes décroisées, bras nu soutenu, milieu du brassard à hauteur du cœur.</p>
<div class="lab">Brassard</div><p>La vessie gonflable couvre 75 à 100 % de la circonférence du bras mesurée à mi-hauteur ; brassard large dès environ 32 cm.</p>
<div class="lab">Mesures</div><p>Appareil oscillométrique choisi dans les listes publiques d’appareils validés. Trois mesures à une ou deux minutes d’intervalle, moyenne des deux dernières ; deux bras à la première visite, puis le bras le plus élevé ; orthostatisme à une et trois minutes.</p>
<div class="lab">Mesure automatisée sans surveillance</div><p>Plusieurs mesures, patient seul : valeurs plus basses, effet blouse blanche en partie supprimé. C’est la méthode de SPRINT.</p></template>

<template data-pop="i10-mapa" data-title="Mesure ambulatoire sur 24 heures (MAPA)">
<div class="lab">Protocole</div><p>Appareil validé au bras non dominant ; mesures toutes les 15 à 30 minutes le jour, 30 à 60 minutes la nuit ; journée habituelle ; journal d’activités et de sommeil. Seuils et validité : îlot 2 de l’onglet Examens.</p>
<div class="lab">Indications préférentielles</div><p>Confirmer le diagnostic ; suspicion de blouse blanche ou d’hypertension masquée ; résistance ; hypotension sous traitement ; suspicion d’hypertension nocturne (apnées, maladie rénale, diabète).</p>
<div class="lab">Limites</div><p>Gêne du sommeil, disponibilité ; précision réduite en fibrillation auriculaire.</p></template>

<template data-pop="i10-auto" data-title="Automesure tensionnelle">
<div class="lab">Protocole</div><p>Appareil validé au bras ; trois à sept jours ; matin avant les médicaments et soir ; deux mesures à une minute d’intervalle après cinq minutes assis ; premier jour exclu ; moyenne.</p>
<div class="lab">Seuil et cible</div><p>≥ 135/85 mmHg : hypertension. En suivi, la moyenne doit au moins passer sous ce seuil ; chez la plupart des patients, on vise une systolique proche de 120–129 mmHg.</p>
<div class="lab">Limites et éducation</div><p>Pas de mesure nocturne ; anxiété, automédication, appareils non validés. Montrer la technique et comparer l’appareil du patient à celui du cabinet.</p></template>

<template data-pop="i10-blouse" data-title="Hypertension de la blouse blanche">
<div class="lab">Définition</div><p>Cabinet ≥ 140/90 mmHg avec pression normale hors cabinet (automesure et diurne &lt; 135/85, 24 heures &lt; 130/80 mmHg), chez un patient non traité. L’<b>effet</b> blouse blanche désigne la différence cabinet − domicile, quel que soit le niveau, y compris sous traitement.</p>
<div class="lab">Terrain et pronostic</div><p>Femme, sujet âgé, non-fumeur, grade 1. Risque intermédiaire ; évolution fréquente vers une hypertension soutenue ; association au syndrome métabolique.</p>
<div class="lab">Conduite</div><p>Mode de vie, surveillance annuelle hors cabinet ; médicament seulement si le risque global est élevé ou en cas d’atteinte d’organe.</p></template>

<template data-pop="i10-masquee" data-title="Hypertension masquée">
<div class="lab">Définition</div><p>Cabinet &lt; 140/90 mmHg avec pression élevée hors cabinet ; environ 10 à 15 % des normotendus au cabinet.</p>
<div class="lab">Terrain</div><p>Homme jeune, fumeur, stress professionnel, alcool, diabète, maladie rénale chronique, apnées, cabinet dans la zone élevée.</p>
<div class="lab">Pronostic et conduite</div><p>Risque proche de l’hypertension soutenue, aggravé par le retard diagnostique. Confirmer par mesure ambulatoire et traiter en suivant l’efficacité hors du cabinet.</p></template>

<template data-pop="i10-ortho" data-title="Hypotension orthostatique">
<div class="lab">Définition (ESC 2024)</div><p>Baisse ≥ 20 mmHg de la systolique et/ou ≥ 10 mmHg de la diastolique à une et/ou trois minutes debout, après cinq minutes assis ou couché.</p>
<div class="lab">Causes</div><p>Âge, diabète, synucléinopathies, déshydratation, médicaments (alpha-bloquants, diurétiques, nitrés, tricycliques, antipsychotiques).</p>
<div class="lab">Conduite</div><p>Supprimer les médicaments en cause, préférer bloqueurs du système rénine-angiotensine et inhibiteurs calciques, cible &lt; 140 mmHg si symptomatique, lever progressif, contention. Une hypertension de décubitus coexiste souvent.</p></template>

<template data-pop="i10-dipper" data-title="Profil tensionnel nocturne">
<div class="lab">Physiologie</div><p>Pendant le sommeil, le tonus sympathique baisse : la pression diminue de 10 à 20 %.</p>
<div class="lab">Profils</div><p>Dipper (10–20 %) ; non-dipper (&lt; 10 %) ; reverse dipper (nuit &gt; jour, risque le plus élevé) ; extreme dipper (&gt; 20 %, ischémie nocturne possible chez le sujet âgé).</p>
<div class="lab">Absence de baisse</div><p>Apnées du sommeil, maladie rénale chronique, neuropathie autonome, hypertension secondaire, insuffisance cardiaque, insomnie. La pression nocturne est le meilleur prédicteur des événements.</p></template>

<template data-pop="i10-e-bras" data-title="Différence de pression entre les bras">
<div class="lab">Technique</div><p>Mesure simultanée aux deux bras, ou séquentielle répétée ; une différence sur une seule mesure séquentielle reflète souvent la variabilité.</p>
<div class="lab">Interprétation</div><p>Différence systolique reproductible ≥ 10 mmHg : risque cardiovasculaire accru, sténose de la sous-clavière du côté bas (athérome ; artérite de Takayasu chez la femme jeune). Au-delà de 20 mmHg, imagerie à discuter. On retient toujours le bras le plus élevé.</p></template>
