
<!-- ===== FENÊTRES I46 : anamnèse, examen, réanimation ===== -->
<template data-pop="i46-s-temoin" data-title="Questions aux témoins">
<div class="lab">Chronologie</div><p>« À quelle heure s’est-il effondré ? L’avez-vous vu tomber ? Quand avez-vous commencé à comprimer ? Un défibrillateur a-t-il été utilisé, combien de chocs ? » Noter les heures exactes, pas des estimations vagues.</p>
<div class="lab">Circonstances</div><p>Effort, émotion, bruit soudain (canalopathie, coronaire) ; repas (corps étranger) ; eau ; chute ou traumatisme ; prise de médicaments ou de drogues ; plainte préalable (douleur, dyspnée, malaise).</p>
<div class="lab">Pourquoi</div><p>Estimer le no-flow et le low-flow, orienter la cause, décider d’une RCP extracorporelle ou d’un arrêt de la réanimation.</p>
<div class="lab">Pourquoi les circonstances orientent</div><p>L’effort et l’émotion libèrent des catécholamines, qui accroissent la demande en oxygène du myocarde et son excitabilité : ils démasquent une ischémie coronaire ou déclenchent une arythmie adrénergique. Dans le QT long congénital, l’effort, en particulier la natation, déclenche surtout le type 1, l’émotion ou un bruit soudain le type 2, le sommeil le type 3 ; une noyade inexpliquée chez un bon nageur fait donc évoquer un QT long. La tachycardie ventriculaire polymorphe catécholergique survient à l’effort ou à l’émotion. Le syndrome de Brugada se démasque pendant une fièvre, après une forte prise d’alcool ou de cocaïne, ou sous certains psychotropes.</p>
<div class="lab">Ce qui change la décision</div><p>Une circonstance évocatrice d’arythmie héréditaire fait répéter l’ECG après le RACS, conserver un prélèvement sanguin pour une analyse génétique ultérieure et prévoir l’examen des apparentés au premier degré.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESC 2022 sur les arythmies ventriculaires et la prévention de la mort subite (Zeppenfeld et al., Eur Heart J 2022;43:3997-4126), sections 5.2.3, 7.2.2, 7.2.4 et 7.2.6, figure 31.</p>
</template>

<template data-pop="i46-atcd-card" data-title="Cardiopathie connue">
<div class="lab">À rechercher</div><p>Infarctus ancien et FEVG, cardiomyopathie, valvulopathie (rétrécissement aortique), insuffisance cardiaque, défibrillateur implantable ou stimulateur, syncopes antérieures.</p>
<div class="lab">Pourquoi</div><p>Une cicatrice d’infarctus oriente vers une TV monomorphe ; un défibrillateur porté qui n’a pas choqué suggère une cause non arythmique ou un dysfonctionnement ; la cardiopathie connue modifie l’indication de coronarographie et de défibrillateur.</p></template>

<template data-pop="i46-atcd-medic" data-title="Médicaments et toxiques">
<div class="lab">Allongement du QT</div><p>Antiarythmiques (sotalol, amiodarone), macrolides, antipsychotiques, méthadone, ondansétron : torsades de pointes.</p>
<div class="lab">Bradycardisants et bloqueurs sodiques</div><p>Bêtabloquants, inhibiteurs calciques, digoxine ; antidépresseurs tricycliques, flécaïnide : QRS larges.</p>
<div class="lab">Dépresseurs respiratoires</div><p>Opioïdes (y compris patchs de fentanyl), benzodiazépines, alcool : arrêt hypoxique.</p>
<div class="lab">Autres</div><p>Diurétiques (hypokaliémie), suppléments potassiques et antagonistes minéralocorticoïdes (hyperkaliémie), cocaïne et amphétamines (ischémie, arythmies).</p>
<div class="lab">Mécanismes</div><p>La plupart des médicaments qui allongent le QT bloquent le courant potassique rectifiant retardé rapide IKr, porté par le canal codé par KCNH2. La phase 3 de la repolarisation s’allonge, et une torsade de pointes peut naître, surtout en cas d’hypokaliémie, d’hypomagnésémie ou de bradycardie. Les bloqueurs des canaux sodiques ralentissent la conduction : les QRS s’élargissent, puis apparaissent bradycardie et arythmies ventriculaires. Les opioïdes et les sédatifs dépriment la commande respiratoire ; l’arrêt survient alors par hypoxie, après une bradycardie. Les diurétiques thiazidiques et de l’anse entraînent une hypokaliémie, alors que les suppléments potassiques et les antagonistes des minéralocorticoïdes, surtout en insuffisance rénale, provoquent une hyperkaliémie.</p>
<div class="lab">Ce qui change la décision</div><p>Le médicament suspect est arrêté, et tout autre médicament allongeant le QT est évité ; une torsade de pointes reçoit du magnésium par voie intraveineuse. Une intoxication par un bloqueur sodique, comme un antidépresseur tricyclique, fait administrer du bicarbonate de sodium.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESC 2022 sur les arythmies ventriculaires (Zeppenfeld et al., Eur Heart J 2022;43:3997-4126), section 6.1.1 ; Ponte et al., Curr Drug Saf 2010;5:44-53 ; recommandations ERC 2025 sur les circonstances particulières (Lott et al., Resuscitation 2025;215:110753), sections hyperkaliémie et toxiques, tableau 8.</p>
</template>

<template data-pop="i46-s-prodr" data-title="Douleur thoracique précurseur">
<div class="lab">Fréquence</div><p>C’est le prodrome le plus souvent rapporté dans les heures ou jours précédant un arrêt extrahospitalier, surtout chez l’homme ; la dyspnée prédomine chez la femme. Dans une étude cas-témoins menée en Californie et en Oregon, la douleur thoracique, la dyspnée et les sueurs étaient associées à un arrêt imminent chez l’homme, alors que seule la dyspnée l’était chez la femme.</p>
<div class="lab">Physiopathologie</div><p>Ischémie myocardique aiguë : la zone ischémique devient électriquement instable (courants de lésion, dispersion de la repolarisation) et déclenche la FV.</p>
<div class="lab">Conséquence</div><p>Une douleur thoracique persistante justifie un appel au 144, non un trajet par ses propres moyens, car une FV peut survenir en route, loin d’un défibrillateur. Après RACS, elle rend une occlusion coronaire probable même sans sus-décalage.</p></template>

<template data-pop="i46-s-syncope" data-title="Syncope d’effort, palpitations et syncope">
<div class="lab">Signification</div><p>Une syncope à l’effort ou précédée de palpitations évoque une arythmie ventriculaire auto-limitée : c’est une arythmie potentiellement mortelle qui s’est interrompue spontanément. Elle précède souvent la mort subite dans les canalopathies et les cardiomyopathies. L’ERC 2025 classe la syncope d’effort ou en décubitus, et les palpitations suivies de syncope, parmi les critères majeurs de gravité : ces circonstances rendent improbable un mécanisme réflexe ou orthostatique, qui survient plutôt debout et après un prodrome.</p>
<div class="lab">Conduite</div><p>ECG, échocardiographie, épreuve d’effort ; avis rythmologique rapide. Voir aussi <b>syncope arythmique</b> dans le chapitre des bradycardies (I44).</p></template>

<template data-pop="i46-e-pouls" data-title="Palpation du pouls : une fiabilité médiocre">
<div class="lab">Constat</div><p>Même des professionnels entraînés se trompent fréquemment : ils perçoivent leur propre pouls, ou ne perçoivent pas un pouls faible, et dépassent souvent dix secondes.</p>
<div class="lab">Règle ERC</div><p>Le témoin non professionnel ne cherche pas le pouls. Le professionnel peut le chercher en même temps qu’il évalue la respiration, pendant dix secondes au plus ; en cas de doute, il comprime.</p>
<div class="lab">Pendant la réanimation</div><p>On ne cherche un pouls que si un rythme organisé apparaît à l’analyse ou si des signes de vie reviennent (mouvements, EtCO₂ qui s’élève).</p></template>

<template data-pop="i46-e-thorax" data-title="Examen du thorax pendant la réanimation">
<div class="lab">Pneumothorax sous tension</div><p>Ventilation asymétrique, hémithorax distendu, emphysème sous-cutané, résistance croissante à l’insufflation, turgescence jugulaire. La déviation trachéale est tardive et difficile à voir.</p>
<div class="lab">Intubation sélective</div><p>Murmure absent à gauche, sonde enfoncée au-delà de 23 cm environ à l’arcade chez l’homme : retirer de quelques centimètres.</p>
<div class="lab">Complications des compressions</div><p>Crépitations osseuses (fractures costales fréquentes, qui ne justifient pas l’interruption de la RCP mais dont les complications sont recherchées après le RACS), volet costal.</p></template>

<template data-pop="i46-e-pupilles" data-title="Pupilles pendant et après la réanimation">
<div class="lab">Pendant l’arrêt</div><p>La mydriase aréactive est habituelle (hypoxie, adrénaline, atropine) : elle n’a aucune valeur pronostique. L’adrénaline contracte le muscle dilatateur de l’iris, et l’atropine paralyse le sphincter en bloquant ses récepteurs muscariniques : la pupille reflète alors les médicaments plutôt que l’état du tronc cérébral.</p>
<div class="lab">Myosis serré</div><p>Oriente vers une intoxication aux opioïdes ou un traitement par agoniste cholinergique ; aussi dans les lésions pontiques.</p>
<div class="lab">Anisocorie</div><p>Évoque une lésion intracrânienne (hémorragie, engagement) ou une cause locale.</p>
<div class="lab">Pronostic</div><p>Le réflexe pupillaire n’entre dans l’algorithme pronostique qu’à 72 heures ou plus, idéalement mesuré par pupillométrie quantitative.</p></template>

<template data-pop="i46-da" data-title="Directives anticipées et représentant thérapeutique">
<div class="lab">Cadre légal</div><p>Code civil suisse, droit de la protection de l’adulte (en vigueur depuis 2013) : toute personne capable de discernement peut rédiger des directives anticipées indiquant les traitements qu’elle accepte ou refuse, et désigner un représentant thérapeutique (articles 370 et suivants).</p>
<div class="lab">Hiérarchie des représentants</div><p>En l’absence de désignation, la loi fixe l’ordre : curateur habilité, conjoint ou partenaire enregistré faisant ménage commun, puis la personne qui fait ménage commun et fournit une assistance, puis les descendants, les parents, les frères et sœurs (article 378).</p>
<div class="lab">Usage en urgence</div><p>Le médecin respecte des directives valables, sauf doute fondé sur leur caractère libre ou sur la volonté actuelle du patient. Si elles ne sont pas disponibles immédiatement, on réanime et on arrête dès qu’elles sont connues.</p>
<div class="lab">Formats</div><p>Formulaires de la FMH et de nombreuses organisations ; certains cantons et services de secours utilisent des documents spécifiques de non-réanimation, portés par le patient.</p></template>

<template data-pop="i46-chaine" data-title="Chaîne de survie">
<div class="lab">Quatre maillons (ERC)</div><p>1. Reconnaissance précoce et appel à l’aide, idéalement avant l’arrêt (prodromes). 2. RCP précoce par un témoin : gagne du temps en limitant le no-flow. 3. Défibrillation précoce : la seule mesure qui interrompt une FV. 4. Réanimation avancée et soins post-réanimation standardisés.</p>
<div class="lab">Élargissements</div><p>Les représentations récentes ajoutent la rééducation et le soutien des survivants et des proches, ainsi que le rôle de la communauté (formation de la population, réseaux de premiers répondants, cartographie des DAE).</p>
<div class="lab">Principe</div><p>La survie est limitée par le maillon le plus faible : une excellente réanimation avancée ne compense pas l’absence de RCP par un témoin.</p></template>

<template data-pop="i46-144" data-title="Centrale d’appels sanitaires urgents 144">
<div class="lab">Reconnaissance téléphonique</div><p>Deux questions : la personne est-elle consciente ? respire-t-elle normalement ? Une réponse négative aux deux déclenche la procédure d’arrêt.</p>
<div class="lab">RCP guidée par téléphone</div><p>Le régulateur guide les compressions en comptant le rythme, fait mettre le téléphone en haut-parleur, fait chercher un DAE ; il ne fait pas pratiquer de ventilation par un témoin non formé. Il part du principe que l’appelant ne sait pas réanimer, car des compressions seules sont plus simples à guider et ne s’interrompent pas ; il passe au rythme 30:2 si le témoin dit savoir ventiler.</p>
<div class="lab">Engagement simultané</div><p>Ambulance, médecin d’urgence ou hélicoptère (Rega), premiers répondants par application, pompiers ou police selon les cantons.</p>
<div class="lab">Qualité</div><p>Le délai de reconnaissance et le délai jusqu’à la première compression sont des indicateurs de qualité des centrales ; ils sont suivis dans Swissreca.</p></template>

<template data-pop="i46-fr" data-title="Réseaux de premiers répondants">
<div class="lab">Principe</div><p>Des personnes formées à la réanimation de base et au DAE (bénévoles, professionnels de santé, pompiers, policiers) s’inscrivent auprès d’un réseau cantonal. Lors d’un arrêt, la centrale 144 alerte par application ceux qui sont proches ; certains vont chercher un DAE, d’autres commencent la RCP.</p>
<div class="lab">Exemples suisses</div><p>Fondation Ticino Cuore (Tessin) ; réseaux utilisant l’application Momentum (notamment Fribourg et Vaud) ; d’autres systèmes cantonaux. Les modalités (rayon d’alerte, formation exigée) varient selon le canton.</p>
<div class="lab">Effet</div><p>Ces réseaux augmentent la fréquence de la RCP avant l’arrivée des secours. Dans l’étude fribourgeoise 2018–2022, la RCP avant l’ambulance passait de 63 % à 95 % lorsque des premiers répondants intervenaient, avec un délai moyen d’arrivée de 5,7 minutes ; l’effet sur la survie n’y était pas démontré, les arrêts concernés étant plus souvent non vus.</p>
<div class="lab">Registre des DAE</div><p>Les DAE publics sont recensés pour être indiqués par la centrale ; leur accessibilité à toute heure est un enjeu.</p></template>

<template data-pop="i46-rcpqual" data-title="Qualité des compressions thoraciques">
<div class="lab">Cinq paramètres</div><p>Fréquence de 100 à 120/min ; profondeur de 5 à 6 cm ; relâchement complet ; interruptions minimales (fraction du temps sous compressions idéalement supérieure à 80 %) ; ventilation sans excès.</p>
<div class="lab">Mesure</div><p>Dispositifs de rétroaction intégrés aux défibrillateurs (accéléromètre), EtCO₂, pression diastolique invasive si disponible.</p>
<div class="lab">Erreurs fréquentes</div><p>Fréquence trop rapide (&gt; 120/min) avec profondeur insuffisante ; appui résiduel ; pauses longues pour la ventilation, l’intubation, la pose d’une voie ou l’analyse ; compresseur fatigué non remplacé.</p>
<div class="lab">Complications</div><p>Fractures costales et sternales fréquentes, rarement graves ; lésions hépatiques ou spléniques rares. Elles ne justifient jamais de comprimer moins fort.</p></template>

<template data-pop="i46-dae" data-title="Défibrillateur automatisé externe">
<div class="lab">Fonctionnement</div><p>Algorithme d’analyse du rythme à haute spécificité : il ne recommande un choc que pour une FV ou une TV rapide. Instructions vocales et visuelles, énergie préréglée.</p>
<div class="lab">Électrodes</div><p>Sur thorax nu et sec, selon le schéma de l’appareil ; électrode latérale bien sur la ligne axillaire moyenne, sous l’aisselle. Retirer le soutien-gorge seulement s’il gêne la position correcte.</p>
<div class="lab">Sécurité</div><p>Personne ne touche le patient pendant l’analyse et le choc. Le risque pour le témoin est minime, y compris sur sol mouillé si le thorax est sec.</p>
<div class="lab">Accès public</div><p>Les programmes d’accès public à la défibrillation, avec DAE dans les lieux fréquentés et formation de la population, sont recommandés par l’ERC. La plupart des arrêts survenant au domicile, les réseaux de premiers répondants apportant un DAE les complètent.</p></template>

<template data-pop="i46-refract" data-title="FV réfractaire">
<div class="lab">Définition</div><p>FV qui persiste après trois chocs ou plus (définitions variables selon les études).</p>
<div class="lab">Conduite ERC 2025</div><p>Vérifier la position et l’adhésion des électrodes (électrode latérale souvent trop antérieure) ; envisager la position antéropostérieure (changement de vecteur) ; poursuivre adrénaline et amiodarone ; traiter la cause, souvent une occlusion coronaire ; envisager la RCP extracorporelle. Une électrode latérale trop antérieure raccourcit le trajet du courant, qui peut alors épargner une partie du ventricule gauche ; le changement de vecteur fait passer le courant selon un autre axe. Après le troisième choc, l’ERC 2025 fait préparer des électrodes neuves et raser la peau si nécessaire, pour abaisser l’impédance transthoracique.</p>
<div class="lab">Défibrillation séquentielle double</div><p>Deux défibrillateurs délivrant des chocs quasi simultanés. L’essai DOSE-VF (2022) a montré une survie supérieure avec la défibrillation séquentielle double (30,4 %) et le changement de vecteur (21,7 %) par rapport à la défibrillation standard (13,3 %). L’ERC 2025 réserve la défibrillation séquentielle double au cadre de la recherche. Le changement de vecteur peut être envisagé après trois chocs consécutifs inefficaces et vérification du placement des électrodes.</p></template>

<template data-pop="i46-ventil" data-title="Voies aériennes et ventilation pendant la réanimation">
<div class="lab">Approche progressive</div><p>Bascule de la tête et élévation du menton, canule oropharyngée, ventilation au masque et au ballon avec oxygène à la plus haute concentration possible ; puis dispositif supraglottique ou intubation selon la compétence. L’ERC 2025 préfère l’i-gel au tube laryngé, dont la mise en place réussit moins souvent dans les études observationnelles, et la vidéolaryngoscopie à la laryngoscopie directe lorsqu’elle est disponible.</p>
<div class="lab">Preuves</div><p>AIRWAYS-2 (2018, essai britannique) : pas de différence d’issue fonctionnelle entre dispositif supraglottique et intubation par des ambulanciers. PART (2018, essai américain) : survie à 72 heures meilleure avec le tube laryngé qu’avec l’intubation par des ambulanciers. Conclusion : le meilleur dispositif est celui que l’équipe maîtrise.</p>
<div class="lab">Intubation</div><p>Seulement par un opérateur au taux de succès supérieur à 95 % en deux tentatives ; interruption des compressions inférieure à 5 secondes ; confirmation par capnographie.</p>
<div class="lab">Ventilation</div><p>Insufflation d’une seconde, soulèvement visible du thorax. Après sécurisation, 10 ventilations par minute sans interrompre les compressions ; ventilateur possible avec volume courant de 6 à 8 mL/kg.</p>
<div class="lab">Piège</div><p>L’hyperventilation, fréquente sous stress, réduit le retour veineux et la perfusion coronaire.</p></template>

<template data-pop="i46-acces" data-title="Accès vasculaire : veineux ou intraosseux">
<div class="lab">Recommandation ERC 2025</div><p>Tenter d’abord la voie intraveineuse ; si deux tentatives échouent ou ne sont pas rapidement possibles, poser une voie intraosseuse.</p>
<div class="lab">Preuves</div><p>Les essais PARAMEDIC-3 (britannique) et IVIO (Danemark), publiés en 2024–2025, n’ont pas montré de bénéfice de la voie intraosseuse en première intention sur la survie ou le RACS.</p>
<div class="lab">Voie intraosseuse</div><p>Sites : tête humérale ou tibia proximal. Tous les médicaments de la réanimation passent par cette voie, aux mêmes doses. Contre-indications : fracture, prothèse ou infection au site, tentative récente sur le même os.</p>
<div class="lab">Voie trachéale</div><p>N’est plus recommandée : absorption imprévisible.</p></template>
