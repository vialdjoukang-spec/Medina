
<!-- ===== FENÊTRES Q21 : monographies ===== -->
<template data-pop="q21-d-pge" data-title="Alprostadil (prostaglandine de type E)">
<div class="lab">Mécanisme</div><p>Agoniste des récepteurs des prostaglandines de type E du muscle lisse du canal artériel : relâchement et réouverture, même après une fermeture fonctionnelle récente. Effet vasodilatateur systémique associé.</p>
<div class="lab">Preuves</div><p>Utilisé depuis la fin des années 1970 ; il a transformé le pronostic des cardiopathies ducto-dépendantes en permettant un transfert et une chirurgie dans des conditions stables. Pas d’essai contrôlé, l’efficacité étant évidente sur la physiologie.</p>
<div class="lab">Posologie</div><p>Perfusion intraveineuse continue sur voie dédiée, sans bolus. Canal ouvert : 0,01–0,025 µg/kg/min. Canal fermé ou choc : 0,05–0,1 µg/kg/min, puis réduction à la plus petite dose efficace (souvent 0,01–0,05 µg/kg/min). Les apnées sont dose-dépendantes.</p>
<div class="lab">Effets indésirables</div><p>Apnées (surtout dans les premières heures et aux doses élevées), fièvre, flush, hypotension, bradycardie ; en traitement de plusieurs semaines : hyperostose corticale, hypertrophie de la muqueuse antrale.</p>
<div class="lab">Situations sans bénéfice</div><p>Hypertension pulmonaire persistante du nouveau-né sans lésion ducto-dépendante ; retour veineux pulmonaire total obstrué, où l’alprostadil n’aide pas et la chirurgie est immédiate, car l’obstacle siège sur les veines pulmonaires et non sur le canal.</p>
<div class="lab">Surveillance</div><p>Respiration, saturation pré- et postductale, pression artérielle, température, pouls fémoraux.</p></template>

<template data-pop="q21-d-ferm" data-title="Ibuprofène et paracétamol pour fermer le canal du prématuré">
<div class="lab">Mécanisme</div><p>Ibuprofène : inhibition de la cyclo-oxygénase, baisse de la synthèse des prostaglandines qui maintiennent le canal ouvert. Paracétamol : inhibition du site peroxydase de la prostaglandine H synthase.</p>
<div class="lab">Preuves</div><p>Essais et méta-analyses : taux de fermeture comparables entre ibuprofène, indométacine et paracétamol ; bénéfice sur les critères cliniques durs incertain, d’où une tendance à traiter de façon plus sélective. Chez 273 prématurés de moins de 28 semaines, l’abstention initiale n’a pas été inférieure à l’ibuprofène précoce pour le critère entérocolite, dysplasie bronchopulmonaire ou décès (46 % contre 64 %).</p>
<div class="lab">Posologie</div><p>Ibuprofène intraveineux : 10 mg/kg puis 5 mg/kg à 24 et 48 heures. Paracétamol : 15 mg/kg toutes les 6 heures pendant 3 à 7 jours (hors indication autorisée).</p>
<div class="lab">Effets indésirables</div><p>Ibuprofène : oligurie, insuffisance rénale, saignements, entérocolite, perforation digestive. Paracétamol : hépatotoxicité. Chez le prématuré, les prostaglandines maintiennent la perfusion rénale et mésentérique ; les inhiber explique l’oligurie et les complications digestives, et l’inhibition de la cyclo-oxygénase plaquettaire favorise le saignement.</p>
<div class="lab">Contre-indications</div><p>Cardiopathie ducto-dépendante (absolue) ; insuffisance rénale ; hémorragie active ; thrombopénie ; entérocolite.</p>
<div class="lab">Surveillance</div><p>Diurèse, créatinine, plaquettes, échocardiographie de contrôle.</p></template>

<template data-pop="q21-d-era" data-title="Antagonistes des récepteurs de l’endothéline (bosentan, ambrisentan, macitentan)">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs de l’endothéline 1, peptide vasoconstricteur et mitogène en excès dans l’hypertension artérielle pulmonaire : vasodilatation pulmonaire, effet antiprolifératif.</p>
<div class="lab">Preuves</div><p>BREATHE-5 (2006) : bosentan dans le syndrome d’Eisenmenger, baisse des résistances pulmonaires et amélioration de la distance de marche de 6 minutes, sans baisse de la saturation. Classe I chez le patient symptomatique (ESC/ERS 2022) ; IIa pour la stratégie initiale si la distance de marche est inférieure à 450 m (ESC 2020).</p>
<div class="lab">Posologie</div><p>Bosentan 62,5 mg × 2/jour pendant 4 semaines, puis 125 mg × 2/jour. Ambrisentan 5–10 mg/jour. Macitentan 10 mg/jour.</p>
<div class="lab">Effets indésirables</div><p>Hépatotoxicité (bosentan surtout), œdèmes, anémie, congestion nasale ; tératogénicité de classe. Le bosentan élève les transaminases chez environ 10 % des patients, de façon dose-dépendante et réversible, en partie parce qu’il freine l’excrétion des sels biliaires. La baisse de l’hémoglobine, dose-dépendante, se stabilise après 4 à 12 semaines.</p>
<div class="lab">Contre-indications</div><p>Grossesse ; insuffisance hépatique ; bosentan avec ciclosporine ou glibenclamide.</p>
<div class="lab">Surveillance</div><p>Transaminases (mensuelles sous bosentan), hémoglobine, test de grossesse mensuel ; contraception fiable, non exclusivement hormonale sous bosentan.</p></template>

<template data-pop="q21-d-pde5" data-title="Inhibiteurs de la phosphodiestérase de type 5 (sildénafil, tadalafil)">
<div class="lab">Mécanisme</div><p>Inhibition de la dégradation du GMP cyclique dans le muscle lisse vasculaire pulmonaire : potentialisation du monoxyde d’azote endogène, vasodilatation pulmonaire.</p>
<div class="lab">Preuves</div><p>Essais dans l’hypertension artérielle pulmonaire incluant des patients porteurs de cardiopathies congénitales ; données observationnelles et petites études dans le syndrome d’Eisenmenger. Utilisés seuls ou associés à un antagoniste de l’endothéline. L’ESC/ERS 2022 les place en classe IIa dans le syndrome d’Eisenmenger, car les preuves y sont moins solides que pour le bosentan.</p>
<div class="lab">Posologie</div><p>Sildénafil 20 mg × 3/jour. Tadalafil 40 mg/jour (20 mg/jour si insuffisance rénale ou hépatique légère à modérée).</p>
<div class="lab">Effets indésirables</div><p>Céphalées, flush, épistaxis, dyspepsie, troubles visuels ; hypotension.</p>
<div class="lab">Contre-indications</div><p>Dérivés nitrés et donneurs de monoxyde d’azote ; riociguat ; neuropathie optique ischémique antérieure.</p>
<div class="lab">Surveillance</div><p>Pression artérielle, saturation, tolérance ; interactions avec les inhibiteurs puissants du CYP3A4.</p></template>

<template data-pop="q21-d-prosta" data-title="Voie de la prostacycline (époprosténol, tréprostinil, iloprost, sélexipag)">
<div class="lab">Mécanisme</div><p>La prostacycline, déficitaire dans l’hypertension artérielle pulmonaire, est vasodilatatrice, antiagrégante et antiproliférative. Époprosténol et tréprostinil sont des analogues ; le sélexipag est un agoniste oral du récepteur de la prostacycline.</p>
<div class="lab">Place</div><p>Formes avancées, en association, dans un centre d’hypertension pulmonaire.</p>
<div class="lab">Posologie</div><p>Sélexipag : 200 µg × 2/jour, titration hebdomadaire jusqu’à la dose maximale tolérée (au plus 1 600 µg × 2/jour). Formes parentérales : protocole du centre.</p>
<div class="lab">Particularité chez le patient cyanosé</div><p>Les perfusions intraveineuses continues exposent aux embolies paradoxales (air, thrombus) et aux infections de cathéter : voie sous-cutanée ou orale préférée, filtres obligatoires.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, douleurs mandibulaires, diarrhée, flush, douleurs au site de perfusion sous-cutanée.</p></template>

<template data-pop="q21-d-spell" data-title="Médicaments de la crise hypoxique">
<div class="lab">Morphine</div><p>0,1 mg/kg par voie intraveineuse, intramusculaire ou sous-cutanée : sédation, baisse de la stimulation respiratoire et des catécholamines. Surveiller la respiration.</p>
<div class="lab">Remplissage</div><p>10–20 mL/kg de cristalloïde : augmente la précharge et le remplissage du ventricule droit.</p>
<div class="lab">Bêtabloquant (propranolol, esmolol)</div><p>Relâche l’infundibulum hypercontractile et ralentit la fréquence, ce qui améliore le remplissage. Propranolol 0,05–0,1 mg/kg par voie intraveineuse lente sur 5 à 10 minutes. Esmolol 0,5 mg/kg en 1 minute, puis 50–300 µg/kg/min. Le propranolol oral (1–4 mg/kg/jour en 3 à 4 prises) est utilisé en attente de chirurgie.</p>
<div class="lab">Phényléphrine</div><p>Agoniste alpha-1 : élève les résistances systémiques et réduit le shunt droite-gauche. Bolus de 5–20 µg/kg par voie intraveineuse, puis 0,1–0,5 µg/kg/min.</p>
<div class="lab">Kétamine</div><p>1–2 mg/kg par voie intraveineuse : sédation et élévation des résistances systémiques, sans dépression respiratoire marquée.</p>
<div class="lab">Bicarbonate de sodium</div><p>1 mmol/kg par voie intraveineuse si l’acidose métabolique persiste.</p>
<div class="lab">À éviter</div><p>Inotropes positifs (ils aggravent l’obstruction infundibulaire), vasodilatateurs, déshydratation.</p></template>

<template data-pop="q21-d-anticoag" data-title="Anticoagulants et antiagrégants chez l’adulte congénital">
<div class="lab">Indications reconnues (ESC 2020)</div><p>Arythmie auriculaire soutenue dans une cardiopathie modérée ou sévère ; circulation de Fontan avec thrombus, arythmie auriculaire ou antécédent thromboembolique ; prothèse valvulaire mécanique ; thrombose veineuse ou embolie.</p>
<div class="lab">Choix</div><p>Antivitamine K obligatoire avec une valve mécanique, car un anticoagulant oral direct y a augmenté les thromboses et les hémorragies dans un essai randomisé. Anticoagulants oraux directs : de plus en plus utilisés dans les autres situations, y compris le Fontan, sur des données observationnelles favorables. Fontan sans facteur de haut risque ni contre-indication hémorragique : prévention par aspirine ou anticoagulant recommandée par l’ACC/AHA 2025 (classe I), avec choix spécialisé.</p>
<div class="lab">Patient cyanosé</div><p>Balance délicate : risque thrombotique élevé mais risque d’hémoptysie ; pas d’anticoagulation systématique. L’anticoagulation ou l’aspirine de routine n’ont pas montré de bénéfice et augmentent les saignements ; l’ESC/ERS 2022 envisage une anticoagulation (IIb) dans l’Eisenmenger avec thrombose d’une artère pulmonaire, en l’absence d’hémoptysie importante. Dans le Fontan, même cyanosé, la prévention suit les recommandations spécifiques présentées ci-dessus et l’évaluation du risque hémorragique.</p>
<div class="lab">Surveillance</div><p>INR sur tube ajusté à l’hématocrite ; fonction rénale pour les anticoagulants directs ; interactions avec l’amiodarone.</p>
<div class="lab">Pourquoi ces choix</div><p>Dans le Fontan, le sang circule lentement dans l’oreillette droite et les conduits ; des embolies pulmonaires répétées pourraient élever les résistances dont dépend cette circulation. Cela justifie la thromboprophylaxie recommandée par l’ACC/AHA 2025. L’anticoagulation est privilégiée à haut risque thromboembolique ; chez les autres patients sans contre-indication hémorragique, l’aspirine ou un anticoagulant sont retenus. La stase justifie la prévention, sans imposer la même molécule à tous.</p>
<div class="lab">Anticoagulants oraux directs</div><p>Selon l’ESC 2020, ils semblent aussi sûrs et efficaces que les antivitamines K chez l’adulte congénital, hors valve mécanique et sténose mitrale sévère. Dans le syndrome d’Eisenmenger, un grand registre allemand les a pourtant associés à plus d’hémorragies, d’événements cardiovasculaires et de décès que les antivitamines K ; l’ESC/ERS 2022 réserve leur instauration aux centres experts.</p>
<div class="lab">Source complémentaire</div><p>ESC 2020 sur les cardiopathies congénitales de l’adulte, European Heart Journal 2021;42:563-645, sections 3.4.7 et 4.16.4 ; ESC/ERS 2022 sur l’hypertension pulmonaire, European Heart Journal 2022;43:3618-3731, section 7.5.2.</p>
</template>

<template data-pop="q21-d-amio" data-title="Amiodarone chez l’adulte congénital">
<div class="lab">Mécanisme</div><p>Antiarythmique de classe III à effets multiples (blocage potassique, sodique, calcique, bêta), riche en iode.</p>
<div class="lab">Place</div><p>Tachycardies auriculaires et ventriculaires lorsque l’ablation a échoué ou n’est pas possible ; utilisable en cas de dysfonction ventriculaire.</p>
<div class="lab">Particularité</div><p>Les thyrotoxicoses induites par l’amiodarone sont plus fréquentes dans cette population, notamment chez les femmes jeunes, les patients cyanosés, porteurs d’un Fontan ou de faible poids ; elles peuvent déstabiliser brutalement l’hémodynamique.</p>
<div class="lab">Effets indésirables</div><p>Dysthyroïdies, toxicité pulmonaire et hépatique, photosensibilité, dépôts cornéens, bradycardie, allongement du QT.</p>
<div class="lab">Surveillance</div><p>TSH et T4 libre avant puis tous les 6 mois ; tests hépatiques ; interactions (antivitamine K, digoxine).</p>
<div class="lab">Pourquoi la thyroïde</div><p>La surcharge iodée et l’action de la molécule sur la glande peuvent conduire à une hypothyroïdie ou à une thyrotoxicose. Chez 92 adultes congénitaux traités au moins six mois, 36 % ont développé une dysthyroïdie ; le sexe féminin et une cardiopathie cyanogène complexe en étaient les principaux facteurs de risque. Une thyrotoxicose accélère la fréquence et favorise les arythmies : elle peut déstabiliser un Fontan ou un ventricule systémique fragile.</p>
<div class="lab">Ce qui change la décision</div><p>La demi-vie de l’amiodarone, de plusieurs semaines, prolonge ses effets indésirables après l’arrêt : une dysthyroïdie se recherche donc aussi des mois après la dernière prise.</p>
<div class="lab">Source complémentaire</div><p>Thorne et al., Circulation 1999;100:149-154 ; information professionnelle américaine de l’amiodarone (Cordarone, 2018), rubriques 5.6 et 12.3.</p>
</template>

<template data-pop="q21-d-amox" data-title="Antibioprophylaxie de l’endocardite : molécules">
<div class="lab">Première intention</div><p>Amoxicilline 2 g par voie orale chez l’adulte, 50 mg/kg chez l’enfant, 30 à 60 minutes avant le geste (ou ampicilline par voie intraveineuse). La prophylaxie vise les streptocoques oraux, qui passent dans le sang lors des soins dentaires à risque ; le délai assure une concentration efficace au moment du geste.</p>
<div class="lab">Allergie à la pénicilline</div><p>ESC 2023 : céfalexine 2 g (50 mg/kg), azithromycine ou clarithromycine 500 mg (15 mg/kg), ou doxycycline 100 mg ; la clindamycine n’est plus recommandée par l’ESC, en raison d’effets indésirables graves, surtout les infections à <i>Clostridioides difficile</i>. La carte suisse de 2021 la conserve pour l’allergie immédiate (600 mg, 20 mg/kg). Les céphalosporines sont évitées après une anaphylaxie, un angio-œdème ou une urticaire sous pénicilline (ESC 2023).</p>
<div class="lab">Indication</div><p>Patients à haut risque, soins dentaires manipulant la gencive ou la région périapicale ou perforant la muqueuse.</p>
<div class="lab">Remarque</div><p>Dose unique ; pas de prolongation après le geste.</p></template>

<template data-pop="q21-d-fer" data-title="Fer chez le patient cyanosé">
<div class="lab">Pourquoi</div><p>La carence martiale réduit la capacité d’effort, rend les globules rouges microcytaires et rigides, augmente la viscosité et le risque d’accident vasculaire cérébral. Ce dernier lien est une association : chez 162 adultes cyanosés, la microcytose était le facteur le plus fortement associé aux accidents cérébrovasculaires, avec les saignées antérieures.</p>
<div class="lab">Comment</div><p>Fer oral à faible dose, ou fer intraveineux (carboxymaltose ferrique), avec contrôle de l’hémoglobine et de l’hématocrite après 1 à 3 semaines. La perfusion impose un filtre à air, car une bulle injectée gagnerait la circulation systémique par le shunt.</p>
<div class="lab">Piège</div><p>Une recharge trop rapide fait monter brusquement l’hématocrite ; l’objectif est de rétablir les réserves, pas de viser une hémoglobine cible.</p>
<div class="lab">Surveillance</div><p>Ferritine, saturation de la transferrine, volume globulaire moyen, hématocrite.</p></template>
