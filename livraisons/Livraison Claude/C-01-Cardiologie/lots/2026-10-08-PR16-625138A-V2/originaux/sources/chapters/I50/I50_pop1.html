
<!-- ===== FENÊTRES : notions fondamentales ===== -->
<template data-pop="frank" data-title="Loi de Frank-Starling">
<div class="lab">Définition</div><p>Dans les limites physiologiques, plus les fibres myocardiques sont étirées en fin de diastole (précharge), plus leur force de contraction et le volume d’éjection augmentent.</p>
<div class="lab">Mécanisme</div><p>L’étirement optimise le chevauchement entre actine et myosine. Il augmente aussi la sensibilité des myofilaments au calcium, en partie par l’intermédiaire de la titine.</p>
<div class="lab">Dans l’insuffisance cardiaque</div><p>La courbe s’aplatit. Le ventricule a besoin d’une précharge beaucoup plus élevée pour un gain de volume d’éjection faible, ce qui élève les pressions de remplissage et produit la congestion.</p>
<div class="lab">Conséquence pratique</div><p>Sur la partie plate de la courbe, un diurétique réduit fortement la congestion au prix d’une baisse minime du débit. C’est pourquoi la décongestion soulage sans effondrer la pression artérielle chez la plupart des patients.</p></template>

<template data-pop="pvloop" data-title="Boucle pression-volume">
<div class="lab">Lecture</div><p>Un cycle cardiaque se représente comme une boucle : remplissage (bas), contraction isovolumique (côté droit), éjection (haut), relaxation isovolumique (côté gauche). La largeur de la boucle correspond au volume d’éjection ; sa surface au travail cardiaque.</p>
<div class="lab">Deux relations limites</div><p><b>Relation pression-volume télésystolique</b> : sa pente (élastance) reflète la contractilité. <b>Relation pression-volume télédiastolique</b> : sa forme reflète la compliance.</p>
<div class="lab">ICFEr</div><p>Pente télésystolique aplatie ; boucle déplacée vers la droite (dilatation) ; volume d’éjection réduit.</p>
<div class="lab">ICFEp</div><p>Pente télésystolique conservée ; relation télédiastolique raide : un petit volume supplémentaire fait monter fortement la pression. D’où l’œdème pulmonaire « flash » lors d’une poussée hypertensive ou d’une fibrillation auriculaire.</p></template>

<template data-pop="raas" data-title="Système rénine-angiotensine-aldostérone (SRAA)">
<div class="lab">Déclenchement</div><p>Baisse de la pression de perfusion rénale, baisse du sodium délivré à la macula densa, stimulation sympathique β1.</p>
<div class="lab">Cascade</div><p>Rénine → angiotensine I → enzyme de conversion → angiotensine II → récepteur AT1 : vasoconstriction, sécrétion d’aldostérone, soif, hormone antidiurétique, hypertrophie et fibrose.</p>
<div class="lab">Aldostérone</div><p>Réabsorption de sodium et sécrétion de potassium dans le tube collecteur ; effet fibrosant direct sur le myocarde.</p>
<div class="lab">Cibles thérapeutiques</div><p>IEC (enzyme de conversion) ; ARA II et valsartan de l’ARNI (récepteur AT1) ; ARM (récepteur minéralocorticoïde). Échappement : sous IEC, l’aldostérone peut remonter par des voies alternatives, ce qui justifie l’ajout d’un ARM.</p></template>

<template data-pop="np" data-title="Peptides natriurétiques (BNP, NT-proBNP)">
<div class="lab">Origine</div><p>Sécrétés surtout par les cardiomyocytes ventriculaires en réponse à l’étirement pariétal. Le pro-BNP est clivé en BNP, actif, et en NT-proBNP, inactif.</p>
<div class="lab">Usage diagnostique</div><p>Excellente valeur prédictive négative. Seuils d’exclusion : ambulatoire, NT-proBNP &lt; 125 pg/mL, BNP &lt; 35 pg/mL ; décompensation, NT-proBNP &lt; 300 pg/mL, BNP &lt; 100 pg/mL (ESC 2021).</p>
<div class="lab">Confirmation en décompensation</div><p>Seuils de NT-proBNP ajustés à l’âge : &gt; 450 pg/mL avant 50 ans, &gt; 900 pg/mL de 50 à 75 ans, &gt; 1 800 pg/mL après 75 ans.</p>
<div class="lab">Élèvent</div><p>Âge, insuffisance rénale, fibrillation auriculaire, embolie pulmonaire, sepsis, syndrome coronarien, anémie.</p>
<div class="lab">Abaissent</div><p>Obésité ; péricardite constrictive et tamponnade (le ventricule ne s’étire pas).</p>
<div class="lab">Unités</div><p>pg/mL ; 1 pmol/L de NT-proBNP ≈ 8,46 pg/mL ; 1 pmol/L de BNP ≈ 3,47 pg/mL. Vérifier l’unité du laboratoire avant d’appliquer un seuil.</p>
<div class="lab">Pronostic</div><p>Plus le taux est élevé, plus le risque est grand ; une baisse sous traitement est de bon pronostic.</p></template>

<template data-pop="diastole" data-title="Dysfonction diastolique">
<div class="lab">Deux composantes</div><p><b>Relaxation active</b> : elle consomme de l’ATP pour recapturer le calcium dans le réticulum sarcoplasmique (pompe SERCA2a). Elle est ralentie par l’ischémie, l’hypertrophie et l’âge. <b>Compliance passive</b> : elle dépend de la titine, de la fibrose et des infiltrations.</p>
<div class="lab">Traduction échographique</div><p>Onde e′ tissulaire basse (relaxation lente) ; rapport E/e′ élevé (pression de remplissage) ; oreillette gauche dilatée (chronicité).</p>
<div class="lab">Corrélation clinique</div><p>La tachycardie raccourcit surtout la diastole ; la fibrillation auriculaire supprime la contraction auriculaire. Les deux décompensent brutalement un ventricule rigide.</p></template>

<template data-pop="remodel" data-title="Remodelage ventriculaire">
<div class="lab">Définition</div><p>Modifications de taille, de forme et de structure du ventricule après une agression : dilatation, amincissement ou hypertrophie, forme plus sphérique, fibrose interstitielle.</p>
<div class="lab">Moteurs</div><p>Contrainte pariétale, angiotensine II, aldostérone, noradrénaline, mort cellulaire.</p>
<div class="lab">Conséquences</div><p>Insuffisance mitrale secondaire, arythmies ventriculaires, aggravation de la contractilité.</p>
<div class="lab">Réversibilité</div><p>La TMF et la resynchronisation peuvent induire un remodelage inverse, avec remontée de la FEVG. Ce gain est souvent perdu si le traitement est arrêté.</p></template>

<template data-pop="starlingcap" data-title="Équilibre de Starling capillaire">
<div class="lab">Principe</div><p>Le flux de liquide à travers la paroi capillaire dépend de la différence entre la pression hydrostatique, qui pousse vers l’interstitium, et la pression oncotique des protéines, qui retient dans le vaisseau.</p>
<div class="lab">Application pulmonaire</div><p>Quand la pression capillaire pulmonaire dépasse environ 18 mmHg, le liquide filtre dans l’interstitium (lignes B de Kerley). Au-delà d’environ 25 mmHg, il envahit les alvéoles (œdème alvéolaire). Ces seuils sont indicatifs et varient avec la chronicité.</p>
<div class="lab">Corrélation clinique</div><p>Chez le patient chronique, le drainage lymphatique augmente. Des pressions élevées sont alors tolérées sans crépitants, ce qui explique les poumons « secs » malgré la congestion.</p></template>

<template data-pop="stevenson" data-title="Profils hémodynamiques de Stevenson">
<div class="lab">Deux questions</div><p>Congestion (humide/sec) : orthopnée, turgescence jugulaire, œdèmes, crépitants. Perfusion (chaud/froid) : extrémités froides, pression différentielle pincée, confusion, oligurie.</p>
<div class="lab">Quatre profils</div><p><b>Chaud et humide</b> (le plus fréquent) : diurétiques, vasodilatateurs si la PAS le permet. <b>Froid et humide</b> : bas débit et congestion, la situation la plus grave ; soins intensifs, inotropes. <b>Froid et sec</b> : hypovolémie ou bas débit sans congestion ; prudence avec les diurétiques. <b>Chaud et sec</b> : compensé, optimiser le traitement de fond.</p>
<div class="lab">Piège</div><p>« Froid » ne signifie pas hypotension : un patient peut être hypoperfusé avec une pression conservée par vasoconstriction.</p></template>

<template data-pop="chronotrop" data-title="Incompétence chronotrope">
<div class="lab">Définition</div><p>Incapacité à augmenter la fréquence cardiaque de façon adaptée à l’effort. Le débit cardiaque étant le produit de la fréquence par le volume d’éjection, un ventricule rigide, qui augmente peu son volume d’éjection, dépend de la fréquence.</p>
<div class="lab">Mesure</div><p>Épreuve d’effort : réserve chronotrope utilisée inférieure à 80 % (seuil abaissé sous bêtabloquant).</p>
<div class="lab">Conséquence</div><p>Dans l’ICFEp, un bêtabloquant sans indication spécifique (fibrillation auriculaire, coronaropathie) peut aggraver l’intolérance à l’effort.</p></template>

<template data-pop="vulnerable" data-title="Phase vulnérable post-hospitalisation">
<p>Les trois à six mois qui suivent une hospitalisation pour décompensation concentrent le risque de réhospitalisation et de décès. Causes : congestion résiduelle, TMF non titrée, instabilité rénale et électrolytique, compréhension incomplète du traitement.</p>
<div class="lab">Réponse</div><p>Sortie sans congestion résiduelle, TMF débutée avant la sortie, contrôle clinique et biologique à une ou deux semaines, titration rapide (stratégie évaluée dans l’essai STRONG-HF).</p></template>

<template data-pop="nyha" data-title="Classification NYHA">
<p><b>I</b> — Aucune limitation : l’activité ordinaire ne provoque pas de symptôme.<br><b>II</b> — Limitation légère : à l’aise au repos, symptômes lors de l’activité ordinaire.<br><b>III</b> — Limitation marquée : à l’aise au repos, symptômes lors d’une activité inférieure à l’ordinaire.<br><b>IV</b> — Symptômes au repos ou lors de toute activité.</p>
<div class="lab">Limites</div><p>Évaluation subjective, variable d’un examinateur à l’autre. Elle ne remplace ni le stade ni la FEVG.</p></template>

<template data-pop="laplace" data-title="Loi de Laplace appliquée au ventricule">
<p>Contrainte pariétale σ = P × r / (2 × h), où P est la pression intraventriculaire, r le rayon et h l’épaisseur de paroi.</p>
<div class="lab">Déductions</div><p>Dilatation (r ↑) : contrainte ↑, consommation d’oxygène ↑, sécrétion de BNP ↑. Hypertrophie (h ↑) : mécanisme de compensation qui normalise la contrainte dans la surcharge de pression, au prix de la rigidité. Les vasodilatateurs et la baisse de la précharge diminuent P et r, donc la contrainte.</p></template>

<template data-pop="sarcomere" data-title="Sarcomère et titine">
<p>Le sarcomère, compris entre deux stries Z, contient les filaments fins (actine, tropomyosine, troponine) et épais (myosine). Le calcium se fixe sur la troponine C et libère les sites d’interaction actine-myosine.</p>
<div class="lab">Titine</div><p>Protéine géante jouant le rôle de ressort. Elle détermine une grande part de la rigidité passive du cardiomyocyte. Sa phosphorylation réduite contribue à la rigidité dans l’ICFEp ; ses variants tronquants causent des cardiomyopathies dilatées.</p>
<div class="lab">Corrélation</div><p>Troponines cardiaques : protéines du sarcomère libérées lors d’une souffrance myocytaire ; souvent modérément élevées de façon chronique dans l’insuffisance cardiaque.</p></template>
