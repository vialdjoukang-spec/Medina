
<!-- ===== FENÊTRES I10 : monographies ===== -->
<template data-pop="i10-d-iec" data-title="Inhibiteurs de l’enzyme de conversion (IEC)">
<div class="lab">Mécanisme</div><p>Baisse de l’angiotensine II (vasodilatation, aldostérone ↓, natriurèse) et accumulation de bradykinine (toux, angiœdème). Au rein, dilatation de l’artériole efférente : pression intraglomérulaire et albuminurie ↓.</p>
<div class="lab">Preuves</div><p>Réduction des événements dans l’hypertension, la coronaropathie (essais Heart Outcomes Prevention Evaluation et EUROPA) et après un accident vasculaire cérébral (PROGRESS) ; néphroprotection dans la néphropathie protéinurique.</p>
<div class="lab">Effets indésirables</div><p>Toux sèche (fréquente), angiœdème (rare, grave, plus fréquent chez le patient d’ascendance africaine), hyperkaliémie, hausse de créatinine, hypotension de première dose.</p>
<div class="lab">Contre-indications</div><p>Grossesse, antécédent d’angiœdème, sténose bilatérale des artères rénales ou sur rein unique ; association à un ARA II, à l’aliskirène (diabète, insuffisance rénale) ou au sacubitril.</p>
<div class="lab">Surveillance</div><p>Créatinine et kaliémie à deux à quatre semaines de chaque changement, puis au moins une fois par an. Doses : onglet Pharmacologie.</p></template>

<template data-pop="i10-d-ara" data-title="Antagonistes des récepteurs de l’angiotensine II (ARA II)">
<div class="lab">Mécanisme</div><p>Blocage du récepteur AT1 ; l’angiotensine II en excès stimule le récepteur AT2. Pas d’accumulation de bradykinine : pas de toux, angiœdème bien plus rare, d’où une meilleure persistance.</p>
<div class="lab">Preuves</div><p>LIFE (losartan supérieur à l’aténolol chez l’hypertendu avec hypertrophie) ; IDNT et RENAAL (néphropathie diabétique) ; ONTARGET (telmisartan non inférieur au ramipril ; association délétère).</p>
<div class="lab">Particularités</div><p>Losartan uricosurique ; olmésartan : entéropathie de type sprue, rare. Contre-indications et surveillance : comme les IEC.</p></template>

<template data-pop="i10-d-icc" data-title="Inhibiteurs calciques">
<div class="lab">Deux familles</div><p><b>Dihydropyridines</b> (amlodipine, lercanidipine, nifédipine à libération prolongée) : vasodilatation artériolaire sélective. <b>Non dihydropyridiniques</b> (vérapamil, diltiazem) : bradycardisants et inotropes négatifs, pas de première ligne.</p>
<div class="lab">Preuves</div><p>Syst-Eur (hypertension systolique isolée du sujet âgé), ASCOT-BPLA (amlodipine ± périndopril supérieurs à aténolol ± thiazidique), ACCOMPLISH.</p>
<div class="lab">Effets indésirables et interactions</div><p>Œdèmes malléolaires dose-dépendants, non volémiques (réduits par un IEC ou un ARA II), céphalées, bouffées, hyperplasie gingivale. Inhibiteurs puissants du CYP3A4 (clarithromycine) : hypotension et insuffisance rénale aiguë chez le sujet âgé. Vérapamil et diltiazem : bêtabloquants (bloc), digoxine et statines métabolisées par le CYP3A4 (surdosage).</p>
<div class="lab">Place</div><p>Première ligne ; efficaces quel que soit le niveau de rénine, chez le sujet âgé et le patient d’ascendance africaine ; sûrs en cas de maladie rénale ; nifédipine à libération prolongée utilisable pendant la grossesse.</p></template>

<template data-pop="i10-d-thz" data-title="Diurétiques thiazidiques et apparentés">
<div class="lab">Molécules et mécanisme</div><p>Hydrochlorothiazide ; apparentés : chlortalidone, indapamide, privilégiés par l’ESC 2024 (action plus longue, preuves plus solides). Blocage du NCC du tube distal : natriurèse les premières semaines, puis baisse durable des résistances.</p>
<div class="lab">Preuves</div><p>ALLHAT (chlortalidone non inférieure à l’amlodipine et au lisinopril, supérieure sur l’insuffisance cardiaque) ; HYVET (indapamide après 80 ans) ; CLICK (chlortalidone au stade 4 de maladie rénale).</p>
<div class="lab">Effets indésirables</div><p>Hypokaliémie, hyponatrémie (femme âgée), hypomagnésémie, hyperuricémie et goutte, hyperglycémie, photosensibilité, hypercalcémie ; carcinome cutané non mélanocytaire sous hydrochlorothiazide au long cours (Swissmedic, 2018).</p>
<div class="lab">Particularités</div><p>Effet de seuil : au-delà de 25 mg, surtout des effets indésirables. Baisse de la calciurie utile chez le lithiasique ou l’ostéoporotique. Natrémie, kaliémie et créatinine à deux à quatre semaines.</p></template>

<template data-pop="i10-d-spiro" data-title="Spironolactone et éplérénone dans l’hypertension">
<div class="lab">Mécanisme</div><p>Blocage du récepteur minéralocorticoïde du tube collecteur : natriurèse, rétention de potassium ; effet antifibrosant.</p>
<div class="lab">Preuves et place</div><p>PATHWAY-2 (2015) : 25 à 50 mg/jour baissent la systolique à domicile d’environ 8,7 mmHg de plus que le placebo, davantage que le bisoprolol et la doxazosine, d’autant plus que la rénine est basse. Quatrième médicament de la résistance (ESC 2024, IIa) ; traitement de l’hyperaldostéronisme bilatéral, à dose titrée sur la rénine.</p>
<div class="lab">Conditions et effets indésirables</div><p>Filtration ≥ 30 mL/min/1,73 m², kaliémie de départ ≤ 4,5 mmol/L de préférence ; arrêt en cas de déshydratation ou de maladie aiguë. Hyperkaliémie, hausse de créatinine ; gynécomastie, mastodynie, troubles des règles (spironolactone). L’éplérénone, plus sélective, en est dépourvue, mais elle est moins puissante et hors indication autorisée en Suisse dans l’hypertension.</p>
<div class="lab">Surveillance</div><p>Kaliémie et créatinine à une et quatre semaines, puis tous les trois à six mois.</p></template>

<template data-pop="i10-d-bb" data-title="Bêtabloquants dans l’hypertension">
<div class="lab">Molécules</div><p>β1-sélectifs : bisoprolol, métoprolol succinate, nébivolol ; mixtes : carvédilol, labétalol.</p>
<div class="lab">Place</div><p>Moins efficaces que les autres classes pour prévenir les accidents vasculaires cérébraux, surtout l’aténolol (LIFE, ASCOT-BPLA), en partie parce qu’ils baissent moins la pression centrale. ESC 2024 : sur indication propre (angor, post-infarctus, insuffisance cardiaque à fraction réduite, fréquence, grossesse) ; ESH 2023 : l’une des cinq classes majeures.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Fatigue, bradycardie, extrémités froides, dysfonction érectile, hyperglycémie modérée, masquage de l’hypoglycémie. Bloc auriculoventriculaire de haut degré, asthme sévère (non sélectifs), phéochromocytome non alpha-bloqué, association au vérapamil ou au diltiazem. Arrêt progressif chez le coronarien.</p></template>

<template data-pop="i10-d-alpha" data-title="Alpha-bloquants et antihypertenseurs centraux">
<div class="lab">Alpha-bloquants</div><p>Doxazosine, urapidil : vasodilatation par blocage α1. Hypertension résistante, hypertrophie prostatique, préparation du phéochromocytome. Hypotension orthostatique de première dose (prise au coucher). Bras doxazosine d’ALLHAT interrompu (insuffisance cardiaque) : pas de première ligne.</p>
<div class="lab">Centraux</div><p>Clonidine (α2), moxonidine (imidazolinique), méthyldopa (grossesse) : baisse du tonus sympathique. Sédation, bouche sèche ; <b>rebond</b> sévère à l’arrêt brutal de la clonidine ; moxonidine contre-indiquée dans l’insuffisance cardiaque (surmortalité, MOXCON).</p></template>

<template data-pop="i10-d-amil" data-title="Amiloride">
<div class="lab">Mécanisme et place</div><p>Blocage direct d’ENaC du tube collecteur, indépendant de l’aldostérone. Alternative à la spironolactone dans l’hypertension résistante : 10 à 20 mg/jour, efficacité comparable dans une étude secondaire de PATHWAY-2 ; traitement du syndrome de Liddle ; correction d’une hypokaliémie sous thiazidique.</p>
<div class="lab">Précautions</div><p>Hyperkaliémie, surtout avec un IEC ou un ARA II et une filtration basse ; pas d’association à un antagoniste minéralocorticoïde ni à un sel potassique.</p></template>

<template data-pop="i10-d-apro" data-title="Aprocitentan">
<div class="lab">Mécanisme</div><p>Antagoniste double des récepteurs A et B de l’endothéline 1 : vasodilatation et baisse de la pression par une voie indépendante du système rénine-angiotensine et du volume.</p>
<div class="lab">Preuve</div><p>Essai de phase 3 dans l’hypertension résistante sous trois antihypertenseurs : baisse de la systolique supérieure au placebo à quatre semaines, maintenue ensuite.</p>
<div class="lab">Statut en Suisse</div><p>Autorisé par Swissmedic le 18.09.2025 (Jeraygo), pour l’hypertension résistante de l’adulte en association avec au moins trois antihypertenseurs, sur la base des évaluations européenne et américaine ; 12,5 mg une fois par jour. Absent de l’ESC 2024, qui lui est antérieure.</p>
<div class="lab">Effets indésirables et précautions</div><p>Rétention hydrique et œdèmes (prudence en cas d’insuffisance cardiaque), baisse de l’hémoglobine ; tératogène : contre-indiqué pendant la grossesse, contraception efficace obligatoire. Remboursement : liste des spécialités.</p></template>

<template data-pop="i10-d-spc" data-title="Combinaisons fixes (un seul comprimé)">
<div class="lab">Pourquoi</div><p>L’adhésion diminue avec le nombre de comprimés. Les combinaisons fixes améliorent la persistance et le contrôle ; leurs molécules à faible dose ont moins d’effets indésirables. ESC 2024 : bithérapie fixe à faible dose en première intention (classe I).</p>
<div class="lab">Associations et limites</div><p>IEC ou ARA II + inhibiteur calcique ; IEC ou ARA II + thiazidique ; trithérapie. Moins de souplesse de titration ; remboursement à vérifier dans la liste des spécialités. Piège : ne pas associer deux comprimés contenant chacun un bloqueur du système rénine-angiotensine.</p></template>

<template data-pop="i10-d-urg" data-title="Antihypertenseurs intraveineux de l’urgence">
<div class="lab">Labétalol</div><p>Alpha- et bêtabloquant : bolus de 10 à 20 mg répétables, ou 0,5 à 2 mg/min. Contre-indiqué dans l’asthme, le bloc auriculoventriculaire, l’insuffisance cardiaque décompensée.</p>
<div class="lab">Urapidil</div><p>Alpha-bloquant à action centrale : bolus de 12,5 à 25 mg, puis 5 à 40 mg/heure ; très utilisé en Suisse.</p>
<div class="lab">Nicardipine, clévidipine</div><p>Dihydropyridines titrables : nicardipine 5 à 15 mg/heure ; clévidipine 2 à 32 mg/heure. Disponibilité variable.</p>
<div class="lab">Nitroglycérine, nitroprussiate</div><p>Nitroglycérine 5 à 200 µg/min (œdème pulmonaire, syndrome coronarien). Nitroprussiate 0,3 à 10 µg/kg/min en soins intensifs ; toxicité du cyanure si prolongé ou insuffisance rénale.</p>
<div class="lab">Esmolol, phentolamine</div><p>Esmolol : bolus de 0,5 à 1 mg/kg puis 50 à 300 µg/kg/min, premier choix de la dissection. Phentolamine : 2,5 à 5 mg répétables, crise du phéochromocytome.</p>
<div class="lab">Source</div><p>Posologies des tableaux d’urgence ESC/ESH ; suivre le protocole et l’information professionnelle de l’établissement.</p></template>

<template data-pop="i10-d-preg" data-title="Antihypertenseurs de la grossesse">
<div class="lab">Nifédipine à libération prolongée</div><p>20 à 60 mg, une à deux fois par jour selon la forme ; efficace, bien tolérée, souvent choisie en premier en pratique suisse pour sa prise unique ; utilisable par voie orale dans l’hypertension sévère.</p>
<div class="lab">Labétalol</div><p>Voie orale 100 mg × 2/jour, jusqu’à 400 mg × 3/jour ; voie intraveineuse si hypertension sévère. Contre-indiqué dans l’asthme.</p>
<div class="lab">Méthyldopa</div><p>250 mg × 2–3/jour, jusqu’à 2 g/jour ; recul le plus long ; sédation, hépatite, favorise la dépression du post-partum, d’où son remplacement après l’accouchement.</p>
<div class="lab">À proscrire</div><p>IEC, ARA II, aliskirène (atteinte rénale fœtale, oligoamnios) ; aténolol (retard de croissance) ; antagonistes minéralocorticoïdes ; aprocitentan. Diurétiques évités (volume plasmatique ↓).</p>
<div class="lab">Allaitement et source</div><p>Énalapril, captopril, nifédipine, labétalol, métoprolol compatibles. ESC 2025 sur la maladie cardiovasculaire et la grossesse, ESC 2024 ; information professionnelle suisse.</p></template>
