
<!-- ===== FENÊTRES I46 : causes, post-réanimation, situations, éthique ===== -->
<template data-pop="i46-hyperk" data-title="Hyperkaliémie en arrêt cardiaque">
<div class="lab">Reconnaître</div><p>Contexte (dialyse, insuffisance rénale, médicaments hyperkaliémiants, rhabdomyolyse) ; ECG avant l’arrêt (ondes T pointues, QRS larges, bradycardie ; détail dans le chapitre I44) ; potassium sur la gazométrie au point de soins.</p>
<div class="lab">Traitement pendant l’arrêt (ERC 2025)</div><p>1. Protéger le myocarde : chlorure de calcium 10 %, 10 mL par voie intraveineuse rapide, ou gluconate de calcium 10 %, 30 mL. 2. Faire entrer le potassium dans les cellules : insuline rapide 10 unités avec glucose 25 g ; bicarbonate de sodium 50 mmol. 3. Éliminer : épuration extrarénale, envisageable pendant la réanimation dans les centres qui en disposent ; RCP extracorporelle si l’arrêt se prolonge.</p>
<div class="lab">Après le RACS</div><p>Surveiller glycémie et kaliémie (rebond) ; dialyse.</p>
<div class="lab">Hypokaliémie</div><p>Favorise FV et torsades. En arrêt avec hypokaliémie démontrée : chlorure de potassium 20 mmol par voie intraveineuse ou intraosseuse en 2 à 3 minutes, puis 10 mmol en 2 minutes (ERC 2025), avec du magnésium. Contrôler la kaliémie après chaque étape.</p>
<div class="lab">Pourquoi le potassium arrête le cœur</div><p>Le potentiel de repos des cardiomyocytes dépend du rapport entre potassium intracellulaire et extracellulaire. Une hyperkaliémie rend ce potentiel moins négatif : une partie des canaux sodiques reste inactivée, la dépolarisation ralentit et la conduction se dégrade, d’où les ondes T pointues, les QRS larges, la bradycardie, puis l’onde sinusoïdale, la FV ou l’asystolie. Une hypokaliémie réduit le courant potassique de repolarisation, allonge le QT et favorise torsades et FV. L’ECG peut rester normal malgré une hyperkaliémie sévère : il ne suffit pas à l’exclure.</p>
<div class="lab">Pourquoi ces trois étapes</div><p>Le calcium ne baisse pas la kaliémie : il restaure l’excitabilité et la conduction, parfois avant même que les traitements hypokaliémiants agissent, sans bénéfice clinique démontré par un essai. L’insuline active la pompe sodium-potassium et fait entrer le potassium dans les cellules : 10 unités abaissent la kaliémie de 0,7 à 1,4 mmol/L, au prix d’hypoglycémies chez jusqu’à 28 % des patients, surtout si la glycémie initiale est inférieure à 7 mmol/L. Hors arrêt, le bicarbonate n’abaisse la kaliémie que d’environ 0,1 mmol/L en une heure ; l’ERC 2025 le garde dans l’arrêt hyperkaliémique. Ces transferts ont un effet temporaire, souvent de 4 à 6 heures : un rebond est possible si le potassium n’est pas éliminé. La dialyse retire directement le potassium du sang et se discute en urgence dans l’hyperkaliémie sévère réfractaire, notamment en cas d’anurie. Hors arrêt, l’élimination rénale lorsqu’elle reste possible et les chélateurs digestifs contribuent aussi à retirer du potassium. Dans les cas publiés de dialyse pendant la réanimation, la kaliémie a baissé de 3,2 mmol/L en moyenne, et le RACS a été obtenu après 45 minutes de dialyse en moyenne.</p>
<div class="lab">Pourquoi le magnésium avec le potassium</div><p>Le déficit en magnésium lève l’inhibition des canaux potassiques du tubule distal et entretient la fuite urinaire de potassium : la kaliémie se corrige mal tant que le magnésium manque.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), figure 2 et section sur l’hyperkaliémie ; Huang et Kuo, J Am Soc Nephrol 2007;18:2649-52.</p>
</template>

<template data-pop="i46-ep" data-title="Embolie pulmonaire en arrêt cardiaque">
<div class="lab">Indices</div><p>Dyspnée brutale ou syncope avant l’arrêt, contexte thromboembolique (chirurgie, immobilisation, cancer, grossesse, contraception œstroprogestative), AESP à QRS fins, turgescence jugulaire, ventricule droit dilaté à l’échographie.</p>
<div class="lab">Traitement</div><p>Fibrinolyse dès que l’embolie est la cause suspectée ; poursuivre la réanimation 60 à 90 minutes après l’administration. Alternatives : embolectomie chirurgicale ou percutanée, RCP extracorporelle, selon les ressources.</p>
<div class="lab">Contre-indications</div><p>Dans l’arrêt, les contre-indications habituelles de la fibrinolyse deviennent relatives : le risque hémorragique est mis en balance avec une mort certaine.</p>
<div class="lab">Pourquoi l’embolie arrête le cœur</div><p>Le caillot obstrue l’artère pulmonaire : la postcharge du ventricule droit augmente brutalement, il se dilate et refoule le septum vers la gauche. Le ventricule gauche, mal rempli, ne peut plus éjecter : le cœur bat encore, souvent en tachycardie sinusale à QRS fins, sans débit suffisant pour un pouls. Le diagnostic repose donc sur le contexte et sur l’association d’indices, non sur la seule dilatation droite.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, réanimation avancée de l’adulte (Soar et al., Resuscitation 2025;215:110769), sections sur les thrombolytiques et l’échographie ; Littmann et al., Med Princ Pract 2014;23:1-6.</p>
</template>

<template data-pop="i46-pnothx" data-title="Pneumothorax sous tension">
<div class="lab">Mécanisme</div><p>Une valve unidirectionnelle fait entrer l’air dans la plèvre sans le laisser sortir ; la pression intrathoracique comprime les veines caves et le cœur : AESP obstructive. La ventilation en pression positive l’aggrave.</p>
<div class="lab">Décompression</div><p>Chez le patient ventilé : thoracostomie au doigt (incision au 4e ou 5e espace intercostal, ligne axillaire moyenne, dissection mousse jusqu’à la plèvre). Décompression à l’aiguille (aiguille longue, même site ou 2e espace intercostal sur la ligne médioclaviculaire) en attente, avec un taux d’échec notable chez les sujets à paroi épaisse. Drain thoracique ensuite.</p>
<div class="lab">Pourquoi la thoracostomie d’abord</div><p>L’aiguille échoue souvent parce que la paroi thoracique est plus épaisse que la longueur du cathéter ; la thoracostomie ouvre largement la plèvre et permet de vérifier au doigt l’affaissement du poumon. L’ERC 2025 la recommande d’emblée en cas d’arrêt ou d’hypotension sévère et réserve l’aiguille à l’opérateur qui ne maîtrise pas la thoracostomie. Dans l’arrêt traumatique, elle est bilatérale, au 4e espace intercostal sur la ligne axillaire moyenne.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur le pneumothorax sous tension ; Clemency et al., Prehosp Disaster Med 2015;30:249-53.</p>
</template>

<template data-pop="i46-intox" data-title="Intoxications et arrêt cardiaque">
<div class="lab">Principes (ERC 2025)</div><p>Sécurité de l’équipe ; réanimation standard ; recherche active du toxique ; réanimation prolongée, car la guérison sans séquelle est possible après élimination du toxique ; RCP extracorporelle dans les centres qui la pratiquent.</p>
<div class="lab">Antidotes et traitements spécifiques</div><p>Opioïdes : ventilation, naloxone avant l’arrêt. Tricycliques et bloqueurs sodiques : bicarbonate de sodium. Anesthésiques locaux : émulsion lipidique. Digoxine : fragments d’anticorps. Bêtabloquants, inhibiteurs calciques : calcium, glucagon, insuline à haute dose. Monoxyde de carbone : oxygène à 100 %, discussion de l’oxygénothérapie hyperbare. Cyanure : hydroxocobalamine.</p>
<div class="lab">Recours</div><p>Tox Info Suisse, numéro 145, conseil gratuit à toute heure.</p>
<div class="lab">Comment agissent deux antidotes</div><p>Le monoxyde de carbone se fixe sur l’hémoglobine et bloque le transport et la libération de l’oxygène ; l’oxygène à haute concentration le déplace et raccourcit sa demi-vie, davantage encore en caisson hyperbare. Le cyanure bloque la respiration mitochondriale, d’où une acidose lactique majeure malgré une oxygénation normale ; l’hydroxocobalamine le fixe en cyanocobalamine, éliminée par le rein.</p>
<div class="lab">Source complémentaire</div><p>Hampson et al., Am J Respir Crit Care Med 2012;186:1095-101 ; Borron et al., Ann Emerg Med 2007;49:794-801.</p>
</template>

<template data-pop="i46-mecha" data-title="Compressions mécaniques">
<div class="lab">Preuves</div><p>Trois grands essais (LINC, PARAMEDIC, CIRC) n’ont pas montré de supériorité des dispositifs mécaniques sur des compressions manuelles de qualité.</p>
<div class="lab">Indications (ERC 2025)</div><p>Lorsque des compressions manuelles de qualité ne sont pas réalisables ou mettent l’équipe en danger : transport en ambulance ou en hélicoptère, coronarographie sous réanimation, réanimation prolongée (hypothermie, embolie après fibrinolyse), pont vers la RCP extracorporelle.</p>
<div class="lab">Piège</div><p>La pose du dispositif interrompt les compressions : elle doit être entraînée pour durer moins de 10 à 15 secondes par interruption.</p></template>

<template data-pop="i46-ecpr" data-title="RCP extracorporelle">
<div class="lab">Principe</div><p>Canulation fémorale veineuse et artérielle sous compressions et mise en place d’une ECMO veino-artérielle : elle assure la perfusion et l’oxygénation, puis permet de traiter la cause (coronarographie, réchauffement, épuration du toxique).</p>
<div class="lab">Preuves</div><p>ARREST (2020, un centre, FV réfractaire) : survie à la sortie de 43 % contre 7 %, essai arrêté précocement. Prague OHCA (2022) : survie avec bonne fonction à 180 jours de 31,5 % contre 22,0 %, différence non significative. INCEPTION (2023, multicentrique) : pas de différence significative à 30 jours. Le bénéfice dépend de la sélection et de la rapidité du système.</p>
<div class="lab">Critères de sélection usuels</div><p>Arrêt devant témoin, RCP par un témoin (no-flow très court), rythme initial choquable ou cause réversible (embolie, hypothermie, intoxication), âge et comorbidités compatibles, délai jusqu’à la mise en place de l’ECMO habituellement inférieur à 60 minutes. Ces critères varient selon les centres ; ils ne sont pas fixés par l’ERC.</p></template>

<template data-pop="i46-tor" data-title="Règles d’arrêt de la réanimation">
<div class="lab">Règle de base (BLS)</div><p>Chez un adulte en arrêt extrahospitalier, proposer l’arrêt sur place si les trois critères sont réunis : arrêt non vu par l’équipe de secours, aucun choc délivré, pas de RACS avant le transport. Validée par Morrison et collaborateurs (2006).</p>
<div class="lab">Règle avancée (ALS)</div><p>Ajoute : arrêt non vu par un témoin et absence de RCP par un témoin.</p>
<div class="lab">Critères ERC de non-initiation ou d’arrêt</div><p>Sécurité impossible à garantir ; lésion incompatible avec la vie ou signes certains de la mort ; directive anticipée valable ; futilité médicale ; asystolie de plus de 20 minutes sous réanimation avancée sans cause réversible (critère de l’ERC 2021, que l’ERC 2025 maintient pour tous les âges, à la différence des règles d’arrêt préhospitalières, réservées à l’adulte). ERC 2025 : à l’hôpital, les règles d’arrêt ne sont jamais la seule base de la décision ; une EtCO₂ basse ou l’échographie ne suffisent jamais seules.</p>
<div class="lab">Limites</div><p>Les règles sont une aide, non une obligation ; elles ne s’appliquent pas à l’hypothermie, à la noyade en eau froide, aux intoxications ni à l’enfant.</p></template>

<template data-pop="i46-temp" data-title="Contrôle de la température après le RACS">
<div class="lab">Recommandation ERC-ESICM 2025</div><p>Chez le patient comateux, prévention active de la fièvre (température ≤ 37,5 °C) pendant 36 à 72 heures. Ne pas réchauffer activement une hypothermie légère spontanée (32 à 36 °C). Le terme « contrôle de la température » remplace « gestion ciblée de la température ».</p>
<div class="lab">Histoire des preuves</div><p>2002 : deux essais (HACA, Bernard) en faveur de l’hypothermie à 32–34 °C après FV. TTM (2013) : pas de différence significative de mortalité entre 33 °C et 36 °C. HYPERION (2019, rythmes non choquables) : meilleur devenir neurologique à 33 °C (10,2 % contre 5,7 %), non confirmé par la méta-analyse sur données individuelles qui l’a réuni aux patients non choquables de TTM2. TTM2 (2021) : pas de bénéfice démontré de 33 °C sur la mortalité à 6 mois par rapport à la normothermie avec traitement de la fièvre (50 % contre 48 % ; risque relatif 1,04, IC à 95 % 0,94–1,14).</p>
<div class="lab">Moyens</div><p>Dispositifs de surface ou endovasculaires à rétrocontrôle ; antipyrétiques ; sédation. Surveillance des frissons, de la kaliémie et de la glycémie.</p>
<div class="lab">Piège</div><p>La fièvre est fréquente après 48 heures ; relâcher la surveillance à ce moment expose à une fièvre délétère.</p>
<div class="lab">Pourquoi prévenir la fièvre</div><p>La fièvre accélère le métabolisme cérébral et les réactions de la cascade ischémique, au moment où les neurones lésés ont le moins de réserve. Elle est fréquente après un arrêt et associée à un moins bon devenir, sans que cette association prouve sa responsabilité. La recommandation de l’ERC-ESICM 2025 est faible, de faible certitude ; la durée de 36 à 72 heures est un énoncé de bonne pratique, car trois essais sur la durée n’ont trouvé aucune différence.</p>
<div class="lab">Pourquoi ne pas refroidir davantage</div><p>Chez l’animal, l’hypothermie protège quand la cible est atteinte en moins d’une heure ; en clinique, il faut 5 à 6 heures, ce qui peut expliquer l’absence de bénéfice dans les essais. L’ERC-ESICM 2025 déconseille aussi la perfusion rapide de grands volumes de liquides froids avant l’hôpital, nocive dans un essai.</p>
<div class="lab">Source complémentaire</div><p>ERC-ESICM 2025, soins post-réanimation (Nolan et al., Resuscitation 2025;215:110809), section sur le contrôle de la température.</p>
</template>

<template data-pop="i46-coro" data-title="Coronarographie après un arrêt cardiaque">
<div class="lab">Sus-décalage du ST</div><p>Coronarographie immédiate, y compris chez le patient comateux (ERC-ESICM 2025 ; ESC 2023 sur les syndromes coronariens aigus).</p>
<div class="lab">Sans sus-décalage</div><p>Coronarographie différée, sauf forte probabilité d’occlusion coronaire (instabilité hémodynamique ou électrique, douleur prémonitoire, anomalie segmentaire nouvelle). COACT (2019) : pas de bénéfice de la coronarographie immédiate sur la survie à 90 jours (64,5 % contre 67,2 %). TOMAHAWK (2021) : pas de bénéfice, tendance défavorable (mortalité à 30 jours 54,0 % contre 46,0 %).</p>
<div class="lab">Occlusion sans sus-décalage</div><p>Une occlusion de la circonflexe ou une occlusion précoce peut ne pas produire de sus-décalage : raisonner en termes d’<b>infarctus occlusif</b>, répéter l’ECG et faire une échocardiographie.</p>
<div class="lab">Pourquoi le sus-décalage change la décision</div><p>Après un RACS, plus de 80 % des patients qui ont un sus-décalage du ST ou un bloc de branche gauche ont une lésion coronaire aiguë, et la reperfusion précoce a démontré son bénéfice dans l’infarctus avec sus-décalage hors arrêt. Un sus-décalage enregistré juste après le RACS est souvent transitoire : l’ECG est répété à l’arrivée avant de conclure.</p>
<div class="lab">Pourquoi différer sans sus-décalage</div><p>Sans sus-décalage, la proportion d’occlusions récentes est faible : une coronarographie immédiate expose des patients sans lésion à l’examen et retarde les soins intensifs, l’imagerie d’une cause non coronaire et l’évaluation neurologique. Une méta-analyse de cinq essais n’a trouvé de bénéfice dans aucun sous-groupe. Une lésion cérébrale anoxique irréversible annule aussi le bénéfice d’une reperfusion réussie.</p>
<div class="lab">Source complémentaire</div><p>ERC-ESICM 2025, soins post-réanimation (Nolan et al., Resuscitation 2025;215:110809), section sur la reperfusion coronaire.</p>
</template>

<template data-pop="i46-neuro" data-title="Algorithme de pronostic neurologique ERC-ESICM 2025">
<div class="lab">Conditions</div><p>Patient au score moteur de Glasgow inférieur à 6, à 72 heures ou plus après le RACS ; facteurs de confusion exclus (sédation, curares, hypothermie, hypotension sévère, hypoglycémie, troubles métaboliques).</p>
<div class="lab">Critères défavorables</div><p>Abolition bilatérale des réflexes pupillaires et cornéens (≥ 72 h) ; onde N20 absente des deux côtés (≥ 24 h) ; EEG hautement malin (&gt; 24 h) ; NSE &gt; 60 µg/L (48 et/ou 72 h) ; état de mal myoclonique (≤ 72 h) ; lésion anoxique diffuse en imagerie.</p>
<div class="lab">Règle</div><p>Au moins deux critères : évolution défavorable très probable. Un seul ou aucun : pronostic indéterminé, observation prolongée.</p>
<div class="lab">Signes favorables</div><p>EEG continu, de voltage normal et réactif ; NSE basse ; absence de lésion diffuse en IRM ; réveil progressif.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>« Attendre 72 heures, combiner les examens, exiger deux signes. »</p>
<div class="lab">Pourquoi 72 heures et deux signes</div><p>Une prédiction faussement pessimiste peut faire limiter les soins d’un patient qui se serait réveillé : la prophétie devient autoréalisatrice. Les signes défavorables doivent donc être très spécifiques au moment où ils sont lus. Or les sédatifs, les curares et l’hypothermie dépriment l’examen pendant les premiers jours. Aucun examen n’étant exact à 100 %, la concordance d’au moins deux signes réduit le risque d’erreur.</p>
<div class="lab">Pronostic et décision</div><p>L’ERC-ESICM 2025 sépare la discussion du pronostic neurologique de celle d’une limitation thérapeutique, qui tient compte aussi de l’âge, des comorbidités, de la fonction des autres organes et des préférences du patient.</p>
<div class="lab">Source complémentaire</div><p>ERC-ESICM 2025, soins post-réanimation (Nolan et al., Resuscitation 2025;215:110809), sections sur la prédiction neurologique et la limitation des traitements.</p>
</template>

<template data-pop="i46-inexpl" data-title="Arrêt cardiaque inexpliqué">
<div class="lab">Définition</div><p>Arrêt cardiaque auquel le patient a survécu et dont la cause reste inconnue après un bilan initial (ECG, coronarographie, échocardiographie, biologie, toxicologie).</p>
<div class="lab">Bilan étendu</div><p>IRM cardiaque (myocardite, cardiomyopathie, cicatrice) ; ECG répétés, dérivations hautes (Brugada) ; épreuve d’effort (TV catécholergique, QT long) ; test aux bloqueurs sodiques ; Holter ; analyse génétique ciblée ; examen des apparentés au premier degré.</p>
<div class="lab">Traitement</div><p>Défibrillateur implantable en prévention secondaire dans la majorité des cas, et traitement spécifique du diagnostic retenu.</p>
<div class="lab">Nouveauté</div><p>L’ERC-ESICM 2025 consacre une section à ce bilan et au suivi à long terme.</p>
<div class="lab">Pourquoi un défibrillateur et un suivi prolongé</div><p>Sans cause identifiée, le substrat qui a déclenché la FV persiste : 16 à 26 % des patients récidivent, souvent dans les premières années, et davantage si le bilan initial a été incomplet. Le défibrillateur traite la récidive sans en connaître la cause (ESC 2022, classe I, niveau A en prévention secondaire). La répétition des examens au fil du suivi révèle souvent une maladie électrique.</p>
<div class="lab">Compléments du bilan (ERC-ESICM 2025)</div><p>Prélèvements initiaux pour la toxicologie et la génétique ; lecture des données des dispositifs implantés et des montres connectées. Le rendement génétique atteint jusqu’à 17 % dans l’arrêt inexpliqué et 10 % après un bilan clinique détaillé ; un résultat négatif n’exclut pas une cause héréditaire.</p>
<div class="lab">Source complémentaire</div><p>ERC-ESICM 2025, soins post-réanimation (Nolan et al., Resuscitation 2025;215:110809), section sur l’arrêt inexpliqué ; ESC 2022 sur les arythmies ventriculaires (Eur Heart J 2022;43:3997-4126), tableau de recommandations 12.</p>
</template>

<template data-pop="i46-reeduc" data-title="Survivants : réadaptation et suivi">
<div class="lab">Séquelles fréquentes</div><p>Troubles cognitifs (mémoire, attention, fonctions exécutives), fatigue, anxiété, dépression, état de stress post-traumatique ; chez les proches, anxiété et stress post-traumatique.</p>
<div class="lab">Recommandations ERC-ESICM 2025</div><p>Mobilisation précoce aux soins intensifs, prévention du délire ; évaluation fonctionnelle physique et non physique avant la sortie ; dépistage des troubles cognitifs, physiques et émotionnels dans les trois mois ; réadaptation cardiaque ou neurologique selon les besoins ; implication des proches.</p>
<div class="lab">Conduite automobile</div><p>Selon les directives de la Société suisse de cardiologie et de la Société suisse de médecine légale, fonction de la cause, du traitement (défibrillateur) et de l’état neurologique.</p></template>

<template data-pop="i46-grossesse" data-title="Arrêt cardiaque pendant la grossesse">
<div class="lab">Causes</div><p>Hémorragie, embolie pulmonaire, embolie amniotique, cardiopathie (dissection coronaire, cardiomyopathie du péripartum), prééclampsie et éclampsie, sepsis, toxicité des anesthésiques locaux, surdosage en magnésium.</p>
<div class="lab">Adaptations (ERC 2025)</div><p>Au-delà de 20 semaines (fond utérin à l’ombilic ou au-dessus), déplacement manuel de l’utérus vers la gauche, préféré à l’inclinaison latérale ; compressions à la position habituelle ; intubation précoce par un opérateur expérimenté (risque d’inhalation, voies aériennes difficiles) ; voie veineuse au-dessus du diaphragme ; défibrillation aux énergies standard ; doses standard.</p>
<div class="lab">Hystérotomie de réanimation</div><p>Si le RACS n’est pas rapidement obtenu, l’extraction fœtale se fait sur le lieu de l’arrêt, sans transfert. Le repère classique (ERC 2021) est une décision à 4 minutes pour une extraction vers 5 minutes ; l’ERC 2025 insiste sur la précocité sans fixer de délai. Son but premier est maternel : la décompression aortocave améliore la réanimation.</p>
<div class="lab">Équipe</div><p>Appel simultané de l’obstétricien, de l’anesthésiste et du néonatologue.</p>
<div class="lab">Pourquoi ces adaptations</div><p>Le déplacement manuel de l’utérus vers la gauche lève la compression aortocave sans incliner le thorax. Une inclinaison latérale devrait atteindre environ 30° pour soulager en partie la veine cave, et les compressions perdent en efficacité sur un thorax incliné. Une voie au-dessus du diaphragme évite que les médicaments stagnent sous la veine cave comprimée. L’intubation revient à un opérateur expérimenté, car l’inhalation et l’échec sont plus fréquents.</p>
<div class="lab">Pourquoi l’hystérotomie précoce</div><p>Seule l’évacuation de l’utérus lève définitivement la compression aortocave. L’ILCOR n’a pas trouvé de preuve pour un délai précis ; l’ERC 2025 ne la juge pas futile au-delà de 5 minutes, mais son bénéfice décroît avec le retard, d’où sa préparation dès le début de l’arrêt.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur l’arrêt cardiaque de la femme enceinte.</p>
</template>

<template data-pop="i46-noyade" data-title="Noyade">
<div class="lab">Physiopathologie</div><p>Arrêt respiratoire par inhalation ou laryngospasme, puis hypoxie, bradycardie et arrêt. La différence entre eau douce et eau salée n’a pas de conséquence pratique, car la salinité n’a pas de valeur pronostique démontrée ; l’atteinte pulmonaire dépend surtout de la quantité et de la pollution de l’eau inhalée.</p>
<div class="lab">Réanimation (ERC 2025)</div><p>Commencer par cinq insufflations en oxygène à 100 % si disponible, puis RCP standard 30:2. La ventilation est prioritaire. L’immobilisation cervicale n’est indiquée que si un traumatisme est probable (plongeon, sports nautiques).</p>
<div class="lab">Hypothermie associée</div><p>En eau froide, l’hypothermie protège le cerveau : réanimation prolongée, réchauffement par ECMO.</p>
<div class="lab">Pronostic</div><p>La durée de submersion est le principal facteur pronostique : moins de 5 à 10 minutes s’associe à un meilleur pronostic. Au-delà d’environ 30 minutes dans une eau à plus de 6 °C, la survie devient extrêmement improbable ; à 6 °C ou moins, ce seuil peut atteindre environ 90 minutes, surtout chez le petit enfant, qui se refroidit vite.</p></template>

<template data-pop="i46-hypoth" data-title="Hypothermie accidentelle">
<div class="lab">Classification suisse révisée</div><p>Fondée sur la clinique, utilisable sans thermomètre : stade 1, conscient ; stade 2, conscience altérée ; stade 3, inconscient avec signes vitaux ; stade 4, absence de signes vitaux. Les températures correspondantes (environ 35–32 °C, moins de 32 à 28 °C, moins de 28 °C, variable au stade 4) sont indicatives, car une autre cause peut altérer la conscience et certains patients gardent des signes vitaux sous 24 °C. Le frisson n’est plus un critère du système révisé.</p>
<div class="lab">Réanimation (ERC 2025)</div><p>Rechercher les signes de vie pendant une minute. Sous 30 °C : une seule dose d’adrénaline de 1 mg, sauf RCP extracorporelle imminente, car le froid ralentit son métabolisme et les doses répétées s’accumulent ; reprise à 30 °C avec un intervalle de 6 à 10 minutes jusqu’à 35 °C ; après trois chocs inefficaces, différer les chocs jusqu’à plus de 30 °C. Compressions mécaniques pour le transport ; RCP intermittente admise si la continuité est impossible (sauvetage en montagne).</p>
<div class="lab">Réchauffement</div><p>ECMO veino-artérielle dans un centre qui la pratique, orienté par le score HOPE (probabilité de survie après réchauffement extracorporel).</p>
<div class="lab">Avalanche</div><p>Un arrêt avec une durée d’ensevelissement courte évoque l’asphyxie ou le traumatisme plus que l’hypothermie : pronostic très différent. La décision de réchauffement extracorporel tient compte de la durée d’ensevelissement, de la perméabilité des voies aériennes et de la kaliémie, selon les recommandations de la Commission internationale de médecine de montagne.</p>
<div class="lab">Pourquoi le froid change les règles</div><p>Le froid réduit la <button class="w" data-k="i46-ischcereb">demande en oxygène des organes</button> et protège le cerveau et le cœur si l’hypothermie précède l’hypoxie. Dans une revue de 221 arrêts hypothermiques non vus, 27 % des patients ont survécu, dont 83 % avec un bon devenir neurologique, et 48 % de ces survivants étaient d’abord en asystolie : une asystolie n’exclut pas le réchauffement extracorporel. Le cœur froid répond mal aux chocs, à la stimulation et aux médicaments, dont le métabolisme ralentit jusqu’à des concentrations toxiques. L’adrénaline y élève la pression de perfusion coronaire sans améliorer la survie, et l’amiodarone y perd de son efficacité.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur l’hypothermie accidentelle et tableau 5.</p>
</template>

<template data-pop="i46-anaph" data-title="Anaphylaxie et arrêt cardiaque">
<div class="lab">Avant l’arrêt (ERC 2025)</div><p>Adrénaline intramusculaire 0,5 mg (0,5 mL de la solution à 1 mg/mL) dans la face antérolatérale de la cuisse dès la suspicion ; répéter après 5 minutes sans amélioration ; remplissage précoce par cristalloïdes ; oxygène ; position couchée, jambes surélevées, ou assise en cas de dyspnée. Si les symptômes persistent malgré l’adrénaline intramusculaire, ou en milieu monitoré, l’ERC 2025 admet une perfusion intraveineuse titrée d’adrénaline, conduite par une équipe entraînée sous monitorage complet.</p>
<div class="lab">En arrêt</div><p>Algorithme standard, adrénaline intraveineuse 1 mg ; remplissage rapide et abondant, car la vasoplégie et la fuite capillaire créent une hypovolémie relative ; intubation précoce si œdème des voies aériennes.</p>
<div class="lab">Piège</div><p>Donner 1 mg d’adrénaline par voie intraveineuse à un patient anaphylactique qui a encore un pouls expose à une arythmie grave et à une ischémie.</p>
<div class="lab">Pourquoi l’adrénaline intramusculaire</div><p>Les médiateurs libérés par les mastocytes dilatent les vaisseaux et augmentent leur perméabilité : le volume circulant chute, réalisant un choc distributif avec hypovolémie relative. L’adrénaline contracte les vaisseaux par son effet α1, soutient le cœur par son effet β1, dilate les bronches par son effet β2 et freine la dégranulation des mastocytes. La voie intramusculaire dans la cuisse est sûre et rapide à mettre en œuvre, sans le pic de concentration d’un bolus intraveineux.</p>
<div class="lab">Position et traitements associés</div><p>Le décès brutal d’un patient anaphylactique mis assis ou debout est décrit : le sang reste dans les membres inférieurs et le retour veineux s’effondre. On le garde couché, jambes surélevées, sauf gêne respiratoire. Les antihistaminiques n’agissent que lentement et surtout sur la peau ; l’ERC 2025 ne recommande pas les corticoïdes en routine, associés dans des études observationnelles à davantage de secondes doses d’adrénaline et d’hospitalisations.</p>
<div class="lab">Source complémentaire</div><p>ERC 2025, circonstances particulières (Lott et al., Resuscitation 2025;215:110753), section sur l’anaphylaxie.</p>
</template>

<template data-pop="i46-trauma" data-title="Arrêt cardiaque traumatique">
<div class="lab">Priorités</div><p>Traiter simultanément les causes réversibles : contrôle de l’hémorragie (compression, garrot, ceinture pelvienne), oxygénation, décompression thoracique bilatérale, recherche d’une tamponnade, remplissage par produits sanguins.</p>
<div class="lab">Compressions</div><p>Elles ne doivent pas retarder ces gestes : comprimer un cœur vide ne produit pas de débit.</p>
<div class="lab">Thoracotomie de réanimation</div><p>Traumatisme thoracique pénétrant avec perte récente des signes de vie : ouverture du péricarde, contrôle d’une plaie cardiaque, clampage aortique, par une équipe entraînée.</p>
<div class="lab">Pronostic</div><p>Globalement sombre, mais meilleur après traumatisme pénétrant et en cas de cause rapidement corrigeable.</p></template>

<template data-pop="i46-assm" data-title="Directives ASSM « Décisions de réanimation » (2021)">
<div class="lab">Principe</div><p>La réanimation est une mesure médicale comme une autre : elle requiert une indication et le consentement, exprimé ou présumé, du patient capable de discernement ou de son représentant.</p>
<div class="lab">Futilité</div><p>Lorsque la réanimation n’a pratiquement aucune chance de succès, le médecin n’est pas tenu de la proposer ; il en informe le patient ou ses proches et documente sa décision.</p>
<div class="lab">Discussion anticipée</div><p>Le statut de réanimation est discuté avec les patients à risque, à l’hôpital, en établissement médico-social et en ambulatoire, dans le cadre d’un projet de soins anticipé ; il est documenté de manière visible et réévalué.</p>
<div class="lab">Sans information</div><p>En urgence, sans information sur la volonté du patient, la réanimation est entreprise, sauf signes certains de la mort ou absence manifeste de toute chance de succès.</p>
<div class="lab">Statut de la source</div><p>Directives médico-éthiques de l’ASSM, 2021. La FMH intègre en règle générale les directives de l’ASSM à son code de déontologie, ce qui les rend contraignantes pour ses membres.</p></template>

<template data-pop="i46-proches" data-title="Présence des proches pendant la réanimation">
<p>L’ERC recommande de proposer aux proches d’assister à la réanimation lorsque cela est possible et sûr, accompagnés par un soignant qui explique les gestes.</p>
<div class="lab">Effets</div><p>Moins de symptômes d’anxiété, de dépression et de deuil compliqué chez les proches qui ont assisté, sans perturbation démontrée des performances de l’équipe.</p>
<div class="lab">Annonce</div><p>En cas de décès : lieu calme, annonce claire (« est décédé »), temps et soutien, informations sur les suites (autopsie, don d’organes le cas échéant).</p></template>

<template data-pop="i46-dcd" data-title="Don d’organes après arrêt circulatoire en Suisse">
<div class="lab">Catégories de Maastricht</div><p>I : décès constaté à l’arrivée ; II : réanimation infructueuse ; III : arrêt circulatoire attendu après une décision d’arrêt des traitements de maintien en vie ; IV : arrêt circulatoire chez un patient en mort cérébrale. En Suisse, les programmes concernent surtout la catégorie III.</p>
<div class="lab">Constat de décès</div><p>Selon les directives ASSM 2017 (en révision) : après l’arrêt circulatoire, un délai d’attente de 5 minutes sans aucune intervention, puis constat clinique de la perte définitive des fonctions cérébrales par deux médecins qualifiés, indépendants de l’équipe de transplantation.</p>
<div class="lab">Règles éthiques</div><p>Décision d’arrêt des traitements prise indépendamment et avant toute question de don ; consentement du patient (carte, registre, directives) ou de ses proches selon la volonté présumée ; mesures préparatoires encadrées par la loi fédérale sur la transplantation. Coordination nationale par Swisstransplant.</p></template>
