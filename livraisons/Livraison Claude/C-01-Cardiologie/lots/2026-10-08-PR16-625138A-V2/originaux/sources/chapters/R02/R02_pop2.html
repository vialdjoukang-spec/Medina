<!-- ===== FENÊTRES R02 : causes, anamnèse, examen clinique, urgences ===== -->
<template data-pop="r02-ischemie-aigue" data-title="Ischémie aiguë de membre">
<div class="lab">Définition</div><p>L’ischémie aiguë est une baisse brutale de la perfusion d’un membre, installée depuis moins de 2 semaines, qui menace sa viabilité. Les causes principales sont l’embolie d’origine cardiaque, souvent sur fibrillation auriculaire, et la thrombose d’une artère déjà malade ou d’un pontage.</p>
<div class="lab">Lien avec la gangrène</div><p>Sans reperfusion, le muscle et les nerfs meurent en quelques heures ; la gangrène qui suit est étendue et souvent humide. Après reperfusion tardive, l’œdème musculaire peut provoquer un syndrome des loges et la lyse musculaire une hyperkaliémie.</p>
<div class="lab">Conduite</div><p>Le médecin administre de l’héparine non fractionnée intraveineuse et demande un avis vasculaire immédiat ; la classification de Rutherford, les gestes et la surveillance après reperfusion sont enseignés dans le cours I70.</p>
</template>

<template data-pop="r02-buerger" data-title="Thromboangéite oblitérante (maladie de Buerger)">
<div class="lab">Définition</div><p>La maladie de Buerger est une vascularite segmentaire inflammatoire et thrombosante des artères et veines de petit et moyen calibre des mains et des pieds, presque exclusivement chez des fumeurs jeunes. Elle est codée I73.1.</p>
<div class="lab">Mécanisme</div><p>Le tabac déclenche une inflammation de la paroi avec thrombus inflammatoire occlusif, qui épargne relativement la structure de la paroi. L’atteinte est distale, ce qui donne des ischémies digitales, des ulcères et des gangrènes des orteils et des doigts, parfois une thrombophlébite superficielle migratrice et un phénomène de Raynaud.</p>
<div class="lab">Conduite</div><p>L’arrêt complet et définitif du tabac est le seul traitement qui modifie l’évolution ; la poursuite expose à des amputations répétées. L’iloprost intraveineux est autorisé en Suisse pour la forme évoluée non revascularisable (information professionnelle Ilomedin).</p>
<div class="lab">Piège</div><p>Le diagnostic exige d’exclure l’athérosclérose, le diabète, une embolie, une thrombophilie et une connectivite ; l’âge jeune ne suffit pas.</p>
</template>

<template data-pop="r02-vasopresseurs" data-title="Gangrène périphérique symétrique">
<div class="lab">Définition</div><p>Il s’agit d’une ischémie puis d’une nécrose symétrique des extrémités, doigts, orteils, parfois nez et oreilles, sans occlusion des gros troncs artériels.</p>
<div class="lab">Mécanisme</div><p>Elle associe un bas débit de choc, une coagulation intravasculaire disséminée qui obstrue la microcirculation, et une vasoconstriction intense par les catécholamines endogènes et exogènes. Les extrémités, à la périphérie du réseau, sont les premières sacrifiées.</p>
<div class="lab">Conduite</div><p>L’équipe traite la cause du choc, utilise la dose minimale efficace de vasopresseur, corrige la coagulopathie et protège les extrémités. La nécrose est en général laissée se délimiter avant toute amputation, parce que le tissu en apparence perdu récupère parfois en partie.</p>
</template>

<template data-pop="r02-ergot" data-title="Ergotisme et dérivés de l’ergot">
<div class="lab">Mécanisme</div><p>L’ergotamine et la dihydroergotamine stimulent les récepteurs alpha-adrénergiques et sérotoninergiques des artères et provoquent une vasoconstriction prolongée. Elles sont métabolisées par le CYP3A4.</p>
<div class="lab">Interaction responsable</div><p>Un inhibiteur puissant du CYP3A4, comme le ritonavir, le cobicistat, la clarithromycine ou un antifongique azolé, élève fortement leur concentration et peut provoquer un vasospasme diffus des membres, avec froideur, douleur, disparition des pouls et gangrène.</p>
<div class="lab">Conduite</div><p>Le médecin arrête immédiatement le dérivé de l’ergot et l’inhibiteur, hospitalise le patient et organise un traitement vasodilatateur spécialisé. La prévention repose sur la vérification systématique des interactions avant toute prescription chez un patient sous dérivé de l’ergot.</p>
</template>

<template data-pop="r02-purpura" data-title="Purpura fulminans">
<div class="lab">Définition</div><p>Le purpura fulminans est un purpura nécrotique extensif, d’installation rapide, associé à une coagulation intravasculaire disséminée, qui évolue vers la gangrène des extrémités.</p>
<div class="lab">Causes</div><p>Il complique une infection fulminante, surtout méningococcique, plus rarement pneumococcique chez l’asplénique. Le sepsis consomme la protéine C, ce qui crée un déficit acquis. Un déficit congénital en protéine C en est une cause rare chez le nouveau-né.</p>
<div class="lab">Conduite</div><p>Un purpura fébrile qui s’étend est une urgence absolue : l’antibiotique est administré immédiatement, avant toute ponction ou imagerie, puis le patient est pris en charge en réanimation selon le cours A41. Les nécroses sont laissées se délimiter avant toute amputation.</p>
</template>

<template data-pop="r02-tih" data-title="Thrombopénie induite par l’héparine et gangrène veineuse">
<div class="lab">Mécanisme</div><p>Des anticorps de type immunoglobuline G reconnaissent le complexe formé par le facteur plaquettaire 4 et l’héparine. Ils activent les plaquettes, qui génèrent de la thrombine : la thrombopénie s’accompagne paradoxalement de thromboses veineuses et artérielles.</p>
<div class="lab">Calendrier</div><p>La chute des plaquettes, de plus de 50 %, survient typiquement entre le 5e et le 10e jour d’héparine, plus tôt en cas d’exposition récente. Le score de probabilité clinique précède le dosage des anticorps anti-PF4.</p>
<div class="lab">Gangrène veineuse</div><p>Si un antivitamine K est débuté pendant la phase thrombopénique, il abaisse rapidement la protéine C, anticoagulant naturel à demi-vie courte, alors que la génération de thrombine reste intense. Une thrombose veineuse profonde étendue évolue alors vers une gangrène d’un membre dont les pouls sont perçus.</p>
<div class="lab">Conduite</div><p>Le médecin arrête toute héparine et la remplace par un anticoagulant non héparinique selon le protocole du centre. Il administre de la vitamine K si un antivitamine K a été débuté, et reporte l’antivitamine K jusqu’à la correction des plaquettes.</p>
</template>

<template data-pop="r02-calciphylaxie" data-title="Calciphylaxie">
<div class="lab">Définition</div><p>La calciphylaxie est une artériolopathie calcifiante, survenant surtout chez le patient dialysé, caractérisée par une calcification de la média des artérioles cutanées, une prolifération intimale et des thromboses, qui provoquent des nécroses cutanées très douloureuses.</p>
<div class="lab">Présentation</div><p>Un livedo fait place à des plaques violacées indurées, puis à des ulcères nécrotiques, souvent sur les zones riches en graisse : cuisses, abdomen, fesses. Les pouls distaux peuvent être présents.</p>
<div class="lab">Conduite</div><p>La prise en charge est néphrologique et dermatologique : elle associe antalgie, soins de plaie, prévention de l’infection, optimisation de la dialyse et du métabolisme phosphocalcique. La revascularisation n’a pas de place, puisque l’atteinte siège dans les artérioles.</p>
<div class="lab">Piège</div><p>Confondre une calciphylaxie avec une gangrène athéroscléreuse conduit à des gestes vasculaires inutiles ou à des excisions qui étendent la plaie.</p>
</template>

<template data-pop="r02-nsti" data-title="Infection nécrosante des tissus mous">
<div class="lab">Définition</div><p>C’est une infection qui détruit rapidement le tissu sous-cutané, le fascia et parfois le muscle, avec thromboses des vaisseaux qui traversent ces plans. La fasciite nécrosante en est la forme la plus connue ; la gangrène de Fournier en est la localisation périnéale.</p>
<div class="lab">Formes microbiologiques</div><p>La forme polymicrobienne associe aérobies et anaérobies, souvent chez le diabétique ou après une chirurgie abdominale. La forme monomicrobienne est due le plus souvent au streptocoque du groupe A, parfois associé à <i>Staphylococcus aureus</i>, et peut toucher un sujet jeune sans terrain.</p>
<div class="lab">Signes</div><p>Les signes évocateurs sont une douleur disproportionnée, une induration qui dépasse l’érythème, des bulles, une nécrose cutanée, une hypoesthésie, une crépitation et des signes systémiques. Dans la méta-analyse de Fernando et al. 2019, la fièvre n’avait qu’une sensibilité de 46 %, les bulles hémorragiques de 25,2 % et l’hypotension de 21 %.</p>
<div class="lab">Conduite</div><p>Le médecin demande un avis chirurgical immédiat pour exploration et débridement, débute un antibiotique large et réanime le patient. Aucun signe isolé ni aucun score n’exclut le diagnostic.</p>
</template>

<template data-pop="r02-atcd-vasc" data-title="Antécédents vasculaires à rechercher">
<div class="lab">Quoi demander</div><p>Le médecin demande la claudication et la distance de marche, puis douleurs de décubitus, revascularisations ou amputations antérieures, infarctus, angioplastie coronaire, accident vasculaire cérébral, anévrisme, fibrillation auriculaire, traitements antithrombotiques et statine.</p>
<div class="lab">Pourquoi</div><p>Une gangrène athéroscléreuse est la manifestation la plus sévère d’une maladie qui touche toutes les artères. Les antécédents orientent vers une ischémie chronique, une embolie ou une thrombose de pontage, et révèlent le risque opératoire cardiaque.</p>
<div class="lab">Conséquence pratique</div><p>Une fibrillation auriculaire non anticoagulée oriente vers une embolie ; un pontage ancien vers sa thrombose ; une coronaropathie sévère pèse dans l’estimation du risque selon le cadre PLAN.</p>
</template>

<template data-pop="r02-atcd-diab" data-title="Antécédents diabétiques à rechercher">
<div class="lab">Quoi demander</div><p>Le médecin précise le type et la durée du diabète, dernière hémoglobine glyquée, insulinothérapie, rétinopathie et néphropathie, neuropathie connue, plaies et amputations antérieures, chaussures, soins de pédicurie, inspection quotidienne des pieds, traitement par inhibiteur du SGLT2.</p>
<div class="lab">Pourquoi</div><p>La durée et les autres complications microvasculaires reflètent l’ancienneté de la neuropathie et de la calcification artérielle. Une plaie antérieure est le principal facteur de récidive.</p>
<div class="lab">Conséquence pratique</div><p>Un diabète ancien avec néphropathie annonce un index de cheville peu fiable et impose une pression d’orteil. Un inhibiteur du SGLT2 est suspendu tant que la plaie n’est pas cicatrisée (IWGDF 2023).</p>
</template>

<template data-pop="r02-changement-couleur" data-title="Changements de couleur d’un orteil">
<div class="lab">Séquence</div><p>La pâleur traduit une baisse du débit artériel. La cyanose traduit une désaturation du sang stagnant dans les capillaires. La couleur violacée puis noire traduit la mort tissulaire et la dégradation de l’hémoglobine.</p>
<div class="lab">Valeur</div><p>Un orteil bleu réversible à la pression peut encore être vivant ; un orteil noir, froid et insensible est nécrosé. Des orteils bleus avec des pouls perçus, après un geste endovasculaire, évoquent des emboles de cholestérol.</p>
<div class="lab">Conduite</div><p>Le médecin photographie la lésion et note sa limite : l’évolution sur 24 à 48 heures distingue une nécrose stable d’une ischémie qui progresse.</p>
</template>

<template data-pop="r02-douleur-decubitus" data-title="Douleur ischémique de décubitus">
<div class="lab">Caractéristiques</div><p>La douleur siège aux orteils et à l’avant-pied ; elle est nocturne, brûlante et réveille le patient. Elle est soulagée lorsque la jambe pend hors du lit ou que le patient se lève et marche quelques pas.</p>
<div class="lab">Mécanisme</div><p>En position couchée, la pesanteur ne contribue plus à la pression de perfusion du pied. Un pied pendant à 50 cm sous le cœur gagne environ 39 mmHg. Lorsque la réserve vasodilatatrice est épuisée, ce gain suffit à soulager l’ischémie.</p>
<div class="lab">Valeur et piège</div><p>Elle signe une ischémie sévère et entre dans la définition de la CLTI si elle dure plus de 2 semaines avec une preuve hémodynamique. Chez le diabétique neuropathe, elle peut manquer. Le sommeil jambe pendante entraîne un œdème de déclivité, parfois pris à tort pour une insuffisance veineuse.</p>
</template>

<template data-pop="r02-douleur-disprop" data-title="Douleur disproportionnée à l’aspect cutané">
<div class="lab">Définition</div><p>Il s’agit d’une douleur intense et croissante que la lésion visible n’explique pas, souvent résistante aux opioïdes.</p>
<div class="lab">Mécanisme</div><p>Dans une infection nécrosante ou une myonécrose, la nécrose progresse d’abord dans le fascia et le muscle, sous une peau encore peu modifiée ; l’ischémie et l’inflammation profondes sont très douloureuses. Plus tard, la destruction des nerfs cutanés peut rendre la peau insensible.</p>
<div class="lab">Conséquence pratique</div><p>Ce symptôme impose un avis chirurgical immédiat. Le piège est de prescrire des antalgiques et une imagerie différée chez un patient dont la peau paraît encore peu atteinte.</p>
</template>

<template data-pop="r02-sirs" data-title="Critères du syndrome de réponse inflammatoire systémique (IWGDF/IDSA)">
<div class="lab">Critères</div><p>Les critères sont une température supérieure à 38 °C ou inférieure à 36 °C ; fréquence cardiaque supérieure à 90/min ; fréquence respiratoire supérieure à 20/min ou pression partielle artérielle en dioxyde de carbone inférieure à 4,3 kPa (32 mmHg) ; leucocytes supérieurs à 12 G/L ou inférieurs à 4 G/L, ou plus de 10 % de formes immatures.</p>
<div class="lab">Usage</div><p>Deux critères ou plus classent une infection du pied diabétique au grade 4, sévère. L’IWGDF/IDSA 2023 a conservé ces critères, faute de données justifiant leur remplacement par d’autres scores dans cette indication.</p>
<div class="lab">Limite</div><p>Ces critères ne définissent pas le sepsis selon la définition actuelle, qui repose sur une défaillance d’organe. Un patient au grade 4 doit donc aussi être évalué selon le cours A41.</p>
</template>

<template data-pop="r02-bulles" data-title="Bulles hémorragiques et ecchymoses">
<div class="lab">Mécanisme</div><p>La thrombose des vaisseaux qui traversent le fascia prive la peau de sang ; l’épiderme se décolle et des bulles remplies de sérosité sanglante apparaissent. Les ecchymoses traduisent l’extravasation de sang à travers des vaisseaux nécrosés.</p>
<div class="lab">Valeur</div><p>Dans la méta-analyse de Fernando et al. 2019, les bulles hémorragiques avaient une spécificité de 95,8 % pour l’infection nécrosante, mais une sensibilité de 25,2 %. Leur présence est très évocatrice ; leur absence n’exclut rien.</p>
</template>

<template data-pop="r02-crepitation" data-title="Crépitation sous-cutanée">
<div class="lab">Technique</div><p>La palpation douce de la peau autour de la lésion donne une sensation de petites bulles qui éclatent sous les doigts.</p>
<div class="lab">Signification</div><p>Elle traduit du gaz dans les tissus, produit par des clostridies, des anaérobies non clostridiens ou des entérobactéries. Elle peut aussi provenir d’air introduit par une plaie ouverte ou un geste chirurgical.</p>
<div class="lab">Conséquence pratique</div><p>Une crépitation dans un contexte infectieux impose une exploration chirurgicale urgente, quel que soit le germe. La radiographie peut montrer du gaz avant que la crépitation soit palpable.</p>
</template>

<template data-pop="r02-pouls" data-title="Pouls du pied">
<div class="lab">Technique</div><p>Le pouls pédieux se palpe sur le dos du pied, en dehors du tendon du long extenseur de l’hallux ; le pouls tibial postérieur en arrière de la malléole médiale. La palpation se fait des deux côtés, avec les fémoraux et les poplités.</p>
<div class="lab">Valeur</div><p>L’absence des deux pouls du pied rend une artériopathie probable. Leur présence ne l’exclut pas chez le diabétique, chez qui les lésions touchent les artères de jambe et du pied. L’IWGDF 2023 recommande de compléter la palpation par les ondes Doppler et les index de pression.</p>
<div class="lab">Piège</div><p>L’artère dorsale du pied peut manquer de façon congénitale chez certains sujets. L’examinateur peut aussi percevoir son propre pouls digital ; il le contrôle en palpant simultanément le pouls radial du patient.</p>
</template>

<template data-pop="r02-probe" data-title="Test de contact osseux (probe-to-bone)">
<div class="lab">Technique</div><p>Après nettoyage, le médecin introduit doucement un stylet métallique stérile à bout mousse au fond de la plaie. Le test est positif lorsqu’il perçoit une surface dure et rugueuse, l’os.</p>
<div class="lab">Valeur</div><p>L’IWGDF/IDSA 2023 suggère de combiner le test de contact osseux, la radiographie standard et un marqueur inflammatoire comme premiers examens de l’ostéite. Le test seul ne suffit pas, car sa valeur dépend de la fréquence de l’ostéite dans la population examinée.</p>
<div class="lab">Piège</div><p>Un test négatif n’exclut pas une ostéite si la plaie est étroite ou tortueuse ; un test positif dans une population à faible prévalence peut être faussement positif. Le doute se lève par l’IRM ou la biopsie osseuse.</p>
</template>

<template data-pop="r02-monofil" data-title="Monofilament de 10 g">
<div class="lab">Technique</div><p>Le médecin applique perpendiculairement un filament de nylon calibré jusqu’à ce qu’il se courbe, ce qui exerce une force d’environ 10 g, sur plusieurs points de la plante, yeux du patient fermés, en évitant les callosités.</p>
<div class="lab">Interprétation</div><p>L’absence de perception signe la perte de la sensibilité protectrice : le patient ne sentira pas une blessure par une chaussure ou un corps étranger.</p>
<div class="lab">Conséquence pratique</div><p>La perte de sensibilité protectrice place le pied à risque d’ulcère et de gangrène ; elle justifie l’éducation, les chaussures adaptées et le suivi podologique.</p>
</template>

<template data-pop="r02-buerger-test" data-title="Test d’élévation et de déclivité">
<div class="lab">Technique</div><p>Patient couché, le médecin élève le membre inférieur d’environ 45° pendant une à deux minutes et observe la plante, puis fait asseoir le patient jambe pendante.</p>
<div class="lab">Interprétation</div><p>Une pâleur rapide de la plante à l’élévation traduit une pression de perfusion trop basse pour vaincre la pesanteur. Une rougeur lente et intense en déclivité traduit un lit capillaire maximalement dilaté par l’ischémie.</p>
<div class="lab">Limite</div><p>Ce test est qualitatif. Il oriente vers une ischémie sévère, mais ne remplace pas les mesures de pression qui classent l’ischémie.</p>
</template>

<template data-pop="r02-pyoderma" data-title="Pyoderma gangrenosum">
<div class="lab">Définition</div><p>Le pyoderma gangrenosum est une dermatose neutrophilique non infectieuse qui produit des ulcères douloureux, à bord violacé, surélevé et décollé. Elle est codée L88 et n’est pas une gangrène.</p>
<div class="lab">Contexte</div><p>Elle s’associe souvent à une maladie inflammatoire chronique de l’intestin, à une polyarthrite rhumatoïde ou à une hémopathie.</p>
<div class="lab">Piège majeur</div><p>Le traumatisme, y compris le débridement chirurgical, étend l’ulcère : c’est la pathergie. Un ulcère qui s’agrandit après chaque excision doit faire évoquer ce diagnostic.</p>
<div class="lab">Conduite</div><p>Le diagnostic est d’exclusion, après biopsie de bordure et recherche d’une infection et d’une vascularite. Le traitement est immunosuppresseur, guidé par un dermatologue ; le chirurgien n’excise pas.</p>
</template>

<template data-pop="r02-lrinec" data-title="Score LRINEC">
<div class="lab">Définition</div><p>Le LRINEC est un score biologique publié par Wong et al. en 2004 pour dépister une infection nécrosante des tissus mous. Il combine la protéine C-réactive, les leucocytes, l’hémoglobine, la natrémie, la créatinine et la glycémie.</p>
<div class="lab">Performance</div><p>Dans la méta-analyse de Fernando et al. (<i>Annals of Surgery</i> 2019 ; 23 études, 5 982 patients), un score d’au moins 6 avait une sensibilité de 68,2 % et une spécificité de 84,8 % ; un score d’au moins 8, une sensibilité de 40,8 % et une spécificité de 94,9 %.</p>
<div class="lab">Conséquence pratique</div><p>Un score élevé renforce une suspicion ; un score bas ne l’écarte pas. Les auteurs concluent que le score ne doit pas servir à exclure le diagnostic et qu’une forte suspicion clinique justifie un avis chirurgical précoce.</p>
</template>

<template data-pop="r02-osteite" data-title="Ostéomyélite du pied diabétique">
<div class="lab">Mécanisme</div><p>Les germes atteignent l’os par contiguïté, à partir d’une plaie profonde, et non par voie sanguine. L’os infecté sous une plaie ancienne, large, profonde, située sur une saillie osseuse ou associée à un orteil rouge et gonflé « en saucisse » est fréquent.</p>
<div class="lab">Diagnostic</div><p>Le test de contact osseux, la radiographie et un marqueur inflammatoire forment la première ligne. Les radiographies sont répétées à quelques semaines d’intervalle, car les signes osseux sont tardifs. L’IRM tranche un doute persistant, et la biopsie osseuse identifie le germe.</p>
<div class="lab">Traitement</div><p>Le traitement associe la résection de l’os infecté et des antibiotiques, ou des antibiotiques seuls dans des conditions précises : ostéite de l’avant-pied sans besoin de drainage, sans artériopathie et sans os exposé. La durée est de 6 semaines sans chirurgie, 3 semaines si la marge osseuse est positive après amputation mineure, quelques jours si l’os infecté est entièrement retiré. La rémission se juge après au moins 6 mois de recul (IWGDF/IDSA 2023).</p>
</template>
