<template data-pop="i83-d-mpff" data-title="Fraction flavonoïque purifiée micronisée (diosmine et hespéridine)">
<p>La fraction flavonoïque purifiée micronisée réduit la lourdeur, la douleur, les crampes, la sensation de gonflement, les paresthésies et l’œdème de la maladie veineuse chronique. Elle accélère aussi la cicatrisation de l’ulcère lorsqu’elle s’ajoute à la compression. Elle ne corrige ni le reflux ni l’obstruction.</p>
<div class="lab">Mécanisme</div><p>Chaque comprimé de 500 mg contient 450 mg de diosmine et 50 mg de flavonoïdes exprimés en hespéridine. L’information suisse décrit une veinoconstriction, une augmentation de la résistance capillaire et une diminution de la perméabilité capillaire. La fuite de liquide vers l’interstitium diminue, d’où la baisse de l’œdème. L’effet sur la microcirculation pourrait passer par une moindre adhésion et une moindre migration des leucocytes à travers l’endothélium ; ce mécanisme reste une hypothèse.</p>
<div class="lab">Preuves</div><p>Une méta-analyse de sept essais en double aveugle contre placebo (1 692 patients) montre une amélioration de plusieurs symptômes, de l’inconfort fonctionnel, de la qualité de vie et de la circonférence de cheville. L’ESVS 2022 recommande les veinotropes avec une classe IIa et un niveau A (recommandation 14). Dans l’ulcère veineux, une méta-analyse trouve une cicatrisation à six mois 32 % plus fréquente avec ce traitement ajouté ; une revue Cochrane de 2013 rapporte un rapport de risques de 1,37, avec des faiblesses méthodologiques (recommandation 82, classe IIa, niveau A).</p>
<div class="lab">Posologie suisse</div><p>Daflon 500 et ses génériques : un comprimé à midi et un le soir, au moment des repas. Daflon Uno 1000 mg : un comprimé à croquer le matin, au repas. L’information suisse ne fixe pas de durée limite ; l’effet se juge sur les symptômes après quelques semaines.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Les effets fréquents sont digestifs : nausées, vomissements, diarrhée, dyspepsie. Une colite est occasionnelle ; migraine, vertiges, éruption, prurit et urticaire sont rares ; un œdème de Quincke est exceptionnel. La seule contre-indication est l’hypersensibilité. Daflon Uno contient 1 227 mg de sorbitol et de l’alcool benzylique, qui peut provoquer des réactions allergiques. Aucune interaction cliniquement significative n’a été rapportée. La grossesse est évitée par précaution, faute de données.</p>
<div class="lab">Limites</div><p>Les essais sont courts et leurs critères surtout subjectifs. La revue Cochrane de 2020 sur les veinotropes, qui n’inclut pas cette fraction selon l’ESVS, conclut pour la classe à un effet possible sur l’œdème et certains symptômes, à davantage d’effets indésirables et à un effet incertain sur la qualité de vie. Aucun essai ne montre un frein à la progression vers l’ulcère.</p>
<div class="lab">Source</div><p>Information professionnelle suisse de Daflon 500 et de Daflon Uno (avril 2023) ; Kakkos et Nicolaides, Int Angiol 2018;37:143-54 ; Coleridge Smith et al., Eur J Vasc Endovasc Surg 2005;30:198-208 ; Scallon et al., Cochrane 2013 ; Martinez Zapata et al., Cochrane 2020 ; De Maeseneer et al., ESVS 2022, §§ 3.3 et 6.6, recommandations 14 et 82.</p></template>

<template data-pop="i83-d-dobesilate" data-title="Dobésilate de calcium">
<p>Le dobésilate de calcium est le seul veinotrope suisse soumis à ordonnance. Parmi les veinotropes autorisés en Suisse, il a l’éventail d’effets démontrés le plus large du tableau 8 de l’ESVS, œdème et prurit compris. Il expose à une agranulocytose très rare et fausse le dosage de la créatinine.</p>
<div class="lab">Mécanisme</div><p>L’information suisse indique qu’aucune donnée ne décrit son mécanisme d’action. Elle rapporte des effets observés : régulation de la perméabilité et de la résistance capillaires, augmentation de la souplesse des érythrocytes et inhibition de l’hyperagrégation plaquettaire. Ces effets expliqueraient la baisse de l’œdème, sans preuve directe du lien.</p>
<div class="lab">Preuves</div><p>Une méta-analyse de 10 essais (778 patients) montre une baisse de la douleur, de la lourdeur, des crampes, des paresthésies et de l’œdème. Le bénéfice est plus net chez les patients aux symptômes sévères. Quatre essais plus récents contre placebo (1 165 patients) confirment l’effet sur les symptômes et l’œdème, avec une hétérogénéité.</p>
<div class="lab">Posologie suisse</div><p>Doxium 500 (capsules) et Doxium 1000 (comprimés) : 500 à 2000 mg par jour, pendant ou juste après le repas, pour limiter la gêne gastrique. La durée va de quelques semaines à plusieurs mois. La molécule est éliminée surtout par l’urine, sous forme inchangée : en insuffisance rénale grave, notamment en dialyse, la dose peut être réduite.</p>
<div class="lab">Effets indésirables</div><p>Céphalées, douleurs abdominales, nausées, diarrhée, arthralgies, myalgies et élévation de l’alanine aminotransférase sont fréquentes. Les réactions d’hypersensibilité sont peu fréquentes ; l’anaphylaxie et l’agranulocytose sont très rares. Une éruption, une fièvre, des douleurs articulaires ou une anomalie de la formule sanguine imposent l’arrêt, car elles peuvent traduire une hypersensibilité.</p>
<div class="lab">Surveillance</div><p>Le patient est informé qu’une fièvre élevée, une angine, un mal de gorge ou une inflammation génitale ou anale l’oblige à consulter sans délai. Le médecin arrête alors le médicament et demande un hémogramme avec formule leucocytaire. Le dobésilate abaisse la créatinine mesurée par méthode enzymatique : la fonction rénale paraît meilleure qu’elle n’est. Le sang est donc prélevé avant la première prise du jour, comme le demande l’information suisse.</p>
<div class="lab">Grossesse et allaitement</div><p>Pendant la grossesse, il n’est donné qu’en cas de nécessité absolue. Il passe dans le lait en très faible quantité et n’est pas indiqué pendant l’allaitement.</p>
<div class="lab">Source</div><p>Information professionnelle suisse de Doxium 500 et 1000 (février 2025) ; Ciapponi et al., Angiology 2004;55:147-54 ; De Maeseneer et al., ESVS 2022, § 3.3.3, tableau 8.</p></template>

<template data-pop="i83-d-polidocanol" data-title="Polidocanol (lauromacrogol 400)">
<p>Le polidocanol est un sclérosant détergent : il détruit l’endothélium et transforme la veine en cordon fibreux. C’est le seul sclérosant des varices autorisé en Suisse (Aethoxysklerol, Sclerovein). La dose maximale est de 2 mg/kg par jour.</p>
<div class="lab">Mécanisme</div><p>Le produit lèse l’intima et provoque un thrombus adhérent. Son effet anticoagulant, démontré in vitro, freine d’abord ce thrombus, qui se développe ensuite pendant environ sept jours. La compression maintient les parois au contact et empêche la reperméabilisation ; le thrombus devient une cicatrice. Selon l’information de Sclerovein, le produit agit mieux sur une intima déjà lésée, ce qui explique son efficacité sur les veines variqueuses. Il est aussi anesthésique local, d’où une injection presque indolore.</p>
<div class="lab">Preuves</div><p>La sclérothérapie est le traitement de référence des télangiectasies et des veines réticulaires, avec un succès rapporté de 95 % après polidocanol. Sur les troncs saphènes, la mousse obtient une occlusion durable moins fréquente que l’ablation thermique (<button class="w" data-k="i83-mousse">place de la mousse</button>).</p>
<div class="lab">Mode d’emploi</div><p>La concentration va de 0,25 % pour les télangiectasies à 3 % pour les varices moyennes, jusqu’à 5 % avec Sclerovein pour les plus grosses. L’injection est strictement intraveineuse, jambe horizontale ou surélevée de 30 à 45°. Le patient marche au moins 30 minutes juste après. Selon l’information professionnelle suisse d’Aethoxysklerol (version française, autorisation Swissmedic 33273, mise à jour de novembre 2022, rubrique « Posologie/Mode d’emploi »), le bandage reste au moins 2 à 3 jours pour les varicosités, 5 à 7 jours ou plus pour les veines réticulaires et les petites varices, et 4 à 6 semaines ou plus pour les varices de moyen et grand calibre ; Sclerovein indique 6 à 8 semaines pour les varices. Les séances sont espacées d’une à deux semaines.</p>
<div class="lab">Effets indésirables</div><p>Une pigmentation, une néovascularisation dans la zone traitée et un caillot intravariqueux sont fréquents. Une thrombose superficielle est occasionnelle, une nécrose survient après injection hors de la veine. Une thrombose profonde est rare. Anaphylaxie, troubles visuels, embolie pulmonaire, accident vasculaire cérébral et cardiomyopathie de stress sont très rares ; troubles visuels et migraines deviennent occasionnels avec la mousse.</p>
<div class="lab">Contre-indications selon les informations suisses</div><p>Les deux informations citent l’alitement et la mobilité réduite, la thrombose profonde, l’artériopathie oblitérante, l’infection fébrile, la cardiopathie aiguë sévère, toute contre-indication à la compression et le diabète sucré. Pour la plupart de ces situations, le lien avec le mécanisme est direct : le thrombus créé pourrait s’étendre, ou la compression nécessaire à la cicatrisation serait impossible. Sclerovein ajoute le premier trimestre de la grossesse et le risque thrombotique élevé, par exemple une thrombophilie connue ou une contraception hormonale associée à d’autres facteurs. La mousse est refusée en cas de foramen ovale perméable symptomatique connu. Aucune sclérose n’est faite au premier trimestre ni après 36 semaines ; après une séance, l’allaitement est suspendu 2 à 3 jours selon Aethoxysklerol.</p>
<div class="lab">Diabète sucré : libellé suisse et écart européen</div><p>Le diabète sucré figure dans la rubrique des contre-indications des deux informations suisses. Aethoxysklerol écrit que la sclérose des varices est « généralement contre-indiquée » en cas de diabète sucré ; Sclerovein le cite parmi ses autres contre-indications. Ni l’une ni l’autre n’en donne la raison. En Suisse, la prescription suit ce libellé. Le texte de l’ESVS 2022 ne mentionne pas le diabète à propos de la sclérothérapie ; ce constat décrit un écart entre deux documents et ne lève pas la contre-indication. Une hypothèse plausible associe la microangiopathie et la neuropathie diabétiques à une cicatrisation cutanée plus difficile et à une détection tardive d’une nécrose après injection hors de la veine. Cette hypothèse n’est ni démontrée ni donnée comme motif par les informations suisses.</p>
<div class="lab">Source</div><p>Informations professionnelles suisses d’Aethoxysklerol (novembre 2022) et de Sclerovein (mai 2022), rubriques Contre-indications et Grossesse ; De Maeseneer et al., ESVS 2022, §§ 4.2.2.2 et 4.5.1.</p></template>

<template data-pop="i83-d-oxerutines" data-title="Oxérutines (hydroxyéthylrutosides)">
<p>Les oxérutines réduisent la douleur, la lourdeur et les crampes veineuses, et elles accélèrent la cicatrisation de l’ulcère ajoutées à la compression. Ce sont les seuls veinotropes dont l’information suisse prévoit l’emploi pendant la grossesse, à partir du quatrième mois.</p>
<div class="lab">Mécanisme</div><p>L’information suisse indique que le mécanisme d’action n’est pas connu. Les études expérimentales et cliniques montrent une augmentation de la résistance capillaire, une normalisation de la perméabilité, une inhibition de l’agrégation des érythrocytes et un effet protecteur sur l’endothélium. La moindre fuite capillaire expliquerait la baisse des symptômes de stase.</p>
<div class="lab">Preuves</div><p>Une revue systématique de 15 essais (1 643 participants) montre une réduction significative des symptômes veineux. Le tableau 8 de l’ESVS retient la douleur, la lourdeur et les crampes, mais pas l’œdème. Dans l’ulcère veineux, trois essais contre placebo donnent un rapport de risques de cicatrisation de 1,7 (recommandation 82, classe IIa, niveau A).</p>
<div class="lab">Posologie suisse</div><p>Venoruton forte : un comprimé de 500 mg deux fois par jour, pendant les repas. Venoruton 1000 : un comprimé effervescent par jour, dissous dans l’eau, pendant un repas. Les symptômes diminuent en général en deux semaines. Le traitement peut alors être interrompu ; l’amélioration persiste habituellement au moins quatre semaines, et il est repris à la même dose si les symptômes reviennent.</p>
<div class="lab">Effets indésirables et précautions</div><p>Les troubles digestifs et les éruptions sont rares ; les réactions anaphylactoïdes, vertiges, céphalées, bouffées de chaleur et fatigue sont très rares. Les contre-indications sont l’hypersensibilité et le premier trimestre de la grossesse. L’information suisse déconseille les oxérutines dans les œdèmes d’origine cardiaque, rénale ou hépatique, faute d’étude. Chaque comprimé effervescent apporte 82 mg de sodium et 6,8 mmol de potassium : chez un patient en insuffisance rénale ou à risque d’hyperkaliémie, le comprimé simple évite cet apport.</p>
<div class="lab">Grossesse</div><p>Des essais ont inclus des femmes enceintes, mais pas au premier trimestre. Le médicament n’est prescrit qu’à partir du quatrième mois et seulement en cas d’indication impérative (<button class="w" data-k="i83-grossesse">varices et grossesse</button>).</p>
<div class="lab">Source</div><p>Information professionnelle suisse de Venoruton forte et Venoruton 1000 (décembre 2023) ; Aziz et al., J Clin Pharm Ther 2015;40:177-85 ; Scallon et al., Cochrane 2013 ; De Maeseneer et al., ESVS 2022, §§ 3.3.5 et 6.6.</p></template>

<template data-pop="i83-d-vigne" data-title="Extraits de feuilles de vigne rouge et de marronnier d’Inde">
<p>Ces deux phytothérapies autorisées en Suisse réduisent la douleur et l’œdème veineux ; le marronnier d’Inde réduit aussi le prurit. Elles se vendent sans ordonnance et se prennent sur une durée limitée, avec une réévaluation.</p>
<div class="lab">Feuilles de vigne rouge : mécanisme</div><p>L’extrait aqueux contient surtout des flavonoïdes, dont le glucuronide de quercétine et l’isoquercitrine. Dans les études précliniques, il stabilise les membranes endothéliales, normalise la perméabilité vasculaire et réduit la fuite de liquide vers le tissu conjonctif. Cette moindre extravasation explique la baisse de l’œdème ; le passage de l’animal à l’homme reste une extrapolation.</p>
<div class="lab">Feuilles de vigne rouge : preuves et posologie</div><p>Deux essais contre placebo (260 et 248 patients) montrent une réduction des symptômes et de l’œdème ; seule la douleur diminue dans les deux essais. Selon l’information suisse, deux études de 12 semaines montrent une baisse significative du volume de jambe à 360 et à 720 mg par jour. Antistax forte se prend à raison d’un comprimé de 360 mg le matin avant le petit-déjeuner, ou de deux en cas de troubles marqués. La durée est de plusieurs semaines, sans dépasser trois mois. Sans amélioration après six semaines, le patient arrête et consulte.</p>
<div class="lab">Marronnier d’Inde</div><p>Une revue Cochrane de 17 essais (1 593 patients) conclut à une efficacité sur la douleur, le prurit et l’œdème. Venostasin, Aesculaforce forte Venen et Aesculamed forte Venen sont autorisés ; leur posologie suit l’information de chaque produit, non reprise ici.</p>
<div class="lab">Sécurité</div><p>Pour Antistax forte, les réactions d’hypersensibilité, les nausées, les troubles gastriques et l’urticaire sont occasionnels. La grossesse et l’allaitement ne sont pas recommandés, faute d’étude. L’information suisse demande une consultation immédiate en cas de douleur, de gonflement ou de chaleur soudains d’une seule jambe, qui peuvent traduire une thrombose. Un œdème persistant des deux jambes doit faire chercher une autre cause.</p>
<div class="lab">Limites</div><p>Chaque extrait végétal a sa propre composition : un résultat obtenu avec un extrait standardisé ne s’étend pas à un autre produit de la même plante.</p>
<div class="lab">Source</div><p>Information professionnelle suisse d’Antistax forte (janvier 2022) ; Pittler et Ernst, revue Cochrane 2012 ; De Maeseneer et al., ESVS 2022, §§ 3.3.4 et 3.3.6, tableau 8 ; liste Swissmedic des médicaments autorisés, état au 30 septembre 2026.</p></template>

<template data-pop="i83-d-tumescence" data-title="Anesthésie par tumescence">
<p>L’anesthésie par tumescence consiste à injecter autour de la veine, sous échographie, un grand volume de lidocaïne et d’adrénaline très diluées. Elle anesthésie, vide et comprime la veine, et protège les tissus voisins de la chaleur. L’ESVS 2022 la recommande pour toute ablation thermique (recommandation 19, classe I, niveau C).</p>
<div class="lab">Composition et calcul</div><p>La solution standard décrite par l’ESVS associe 445 mL de cristalloïde, 50 mL de lidocaïne à 1 % avec adrénaline à 1:100 000, et 5 mL de bicarbonate de sodium à 8,4 %. Les 50 mL de lidocaïne à 1 % apportent 500 mg dans 500 mL : la solution contient 1 mg/mL, soit 0,1 %. Les 0,5 mg d’adrénaline sont dilués dans le même volume, soit 1 µg/mL. En Suisse, la lidocaïne à 1 % avec adrénaline à 1:100 000 existe sous forme de Rapidocain 10 mg/ml avec épinéphrine 10 µg/ml, en flacon multidose de 20 mL. Ce flacon contient des conservateurs, le parahydroxybenzoate de propyle et le parahydroxybenzoate de méthyle. Or l’information professionnelle suisse interdit les solutions d’anesthésique local avec conservateurs pour les blocages nécessitant plus de 15 mL, et elle contre-indique ces flacons en cas d’allergie aux anesthésiques de type ester ou aux parahydroxybenzoates. La recette de l’ESVS en demande 50 mL : le flacon multidose ne peut donc pas lui servir d’équivalent direct. La tumescence n’est pas une indication décrite par cette information. Sans conservateur, Rapidocain 10 mg/ml existe en ampoules de 5 et de 10 mL et en flacon de 20 mL, présentations non classées parmi les préparations à usage multiple, mais sans adrénaline. La solution de tumescence est donc une préparation diluée réalisée sur place ; l’ajout d’adrénaline et de bicarbonate suit les règles de préparation de l’établissement, que l’information professionnelle ne décrit pas.</p>
<div class="lab">Rôle de chaque composant</div><p>La lidocaïne bloque la conduction des fibres nerveuses autour de la veine. L’adrénaline contracte les petits vaisseaux : elle prolonge l’anesthésie et ralentit le passage de la lidocaïne dans le sang. Le bicarbonate neutralise l’acidité de la lidocaïne et diminue la brûlure de l’injection ; les solutions tamponnées sont recommandées avec une classe IIa et un niveau B (recommandation 20). Le volume liquide comprime la veine contre la fibre ou le cathéter, ce qui améliore l’ablation, et il absorbe la chaleur qui diffuse vers la peau et les nerfs voisins.</p>
<div class="lab">Toxicité</div><p>Selon les données citées par l’ESVS, des doses allant jusqu’à 15 mg/kg dans ces solutions diluées ont eu peu d’effets indésirables ; une toxicité est survenue chez 36 % des sujets exposés à 35 mg/kg. Chez un patient de 70 kg, 15 mg/kg représentent 1 050 mg, soit environ 1 050 mL de solution à 0,1 %. Selon l’information suisse de Rapidocain, la toxicité commence par des paresthésies autour de la bouche, une insensibilité de la langue, des vertiges, une hyperacousie et des acouphènes ; viennent ensuite les convulsions, puis la dépression cardiovasculaire, qui peut survenir sans prodrome chez un patient sédaté. Après un surdosage, la concentration plasmatique maximale n’est atteinte qu’après 20 à 30 minutes ; en tumescence, l’adrénaline et la dilution ralentissent encore ce passage. La surveillance se poursuit donc après le geste, sans durée fixée par l’ESVS ni par l’information suisse. Aux premiers signes, l’injection est arrêtée.</p>
<div class="lab">Contre-indications</div><p>L’information suisse contre-indique la lidocaïne en cas d’hypersensibilité aux anesthésiques locaux de type amide, d’hypovolémie, d’insuffisance cardiaque aiguë décompensée, de bloc cardiaque ou d’autre trouble de la conduction, de choc sévère et de myasthénie grave. Le trouble de conduction compte parce que la lidocaïne ralentit elle-même la conduction myocardique et diminue l’inotropisme. La forme avec épinéphrine contient des sulfites et se refuse en cas d’intolérance. Un anticoagulant augmente le saignement en cas de lésion vasculaire, et l’amiodarone ajoute ses effets cardiaques.</p>
<div class="lab">Limites</div><p>Ces chiffres ne constituent pas une posologie suisse autorisée. L’information de Rapidocain ne mentionne pas la tumescence ; pour une infiltration chez l’adulte de 70 kg, elle indique jusqu’à 400 mg, avec ou sans épinéphrine. Les 1 050 mg calculés plus haut relèvent donc d’un usage hors information professionnelle. Elle demande des doses plus faibles en cas d’insuffisance hépatique ou rénale ou d’état général diminué ; l’association à un autre anesthésique local, dont le polidocanol, impose aussi la prudence. L’ESVS rappelle que certaines formulations ne respectent pas la réglementation de tous les pays.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, § 4.1.3, recommandations 19 et 20 ; Wright et al., Phlebology 2019;34:683-9 ; Nandhra et al., Eur J Vasc Endovasc Surg 2018;56:699-708 ; information professionnelle suisse de Rapidocain et Rapidocain avec épinéphrine (autorisations Swissmedic 20272 et 32381, mise à jour de juillet 2024, lue le 8.10.2026 sur swissmedicinfo.ch).</p></template>

<template data-pop="i83-d-pentox" data-title="Pentoxifylline et sulodexide : recommandés par l’ESVS, absents en Suisse">
<p>L’ESVS 2022 cite la pentoxifylline et le sulodexide comme adjuvants de l’ulcère veineux, au même rang que la fraction flavonoïque purifiée micronisée et les oxérutines (recommandation 82, classe IIa, niveau A). Aucun des deux ne figure dans la liste Swissmedic des médicaments autorisés au 30 septembre 2026. En Suisse, l’adjuvant médicamenteux de l’ulcère se choisit donc entre la fraction flavonoïque purifiée micronisée et les oxérutines.</p>
<div class="lab">Pentoxifylline</div><p>La pentoxifylline est un médicament qui améliore l’écoulement du sang ; son mécanisme précis dans l’ulcère n’est pas établi. Une revue Cochrane de 12 essais (864 participants) montre une cicatrisation complète ou une nette amélioration plus fréquentes que sous placebo (rapport de risques 1,70). Le bénéfice persiste lorsque la compression est appliquée (rapport de risques 1,56). Les effets indésirables sont plus fréquents (rapport de risques 1,56), digestifs pour 72 % d’entre eux.</p>
<div class="lab">Sulodexide</div><p>Le sulodexide a réduit les médiateurs inflammatoires chez les patients atteints de maladie veineuse chronique, selon l’ESVS. Une méta-analyse de 13 études (1 901 participants) montre une baisse de la douleur, des crampes, de la lourdeur et de la sensation de gonflement. Dans l’ulcère, trois essais montrent une cicatrisation complète de 49 % contre 30 % avec les soins locaux seuls (rapport de risques 1,66).</p>
<div class="lab">Conséquence pratique en Suisse</div><p>Une recommandation européenne ne rend pas un médicament disponible. Le médecin suisse applique la recommandation 82 avec les deux molécules autorisées. Les extraits de Ruscus, qui couvrent dans le tableau 8 de l’ESVS presque tous les symptômes étudiés, ne sont pas autorisés non plus. L’adjuvant ne remplace jamais la compression d’au moins 40 mmHg ni le traitement précoce du reflux, qui portent l’essentiel du bénéfice (<button class="w" data-k="i83-evra">essais EVRA et ESCHAR</button>).</p>
<div class="lab">Limites</div><p>Les essais de la pentoxifylline sont de qualité variable. Les résultats du sulodexide proviennent de trois essais seulement. Une absence de la liste Swissmedic ne signifie pas une inefficacité : elle signifie seulement qu’aucune autorisation n’est en vigueur en Suisse.</p>
<div class="lab">Source</div><p>Jull et al., revue Cochrane 2012 ; Wu et al., revue Cochrane 2016 ; Bignamini et Matuska, Adv Ther 2020;37:1013-33 ; De Maeseneer et al., ESVS 2022, §§ 3.3.7 et 6.6, recommandation 82 ; liste Swissmedic des médicaments autorisés, état au 30 septembre 2026.</p></template>

<template data-pop="pareto-i83-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i83-p-1,i83-p-2,i83-p-3,i83-p-4,i83-p-5"></p>
<ul><li>Les veinotropes réduisent symptômes et œdème (ESVS 2022, recommandation 14, classe IIa) ; ils ne traitent ni le reflux ni la progression et ne remplacent ni la compression ni l’intervention.</li><li>En Suisse : fraction flavonoïque purifiée micronisée 500 mg deux fois par jour ou 1000 mg une fois ; oxérutines 500 mg deux fois ou 1000 mg une fois ; dobésilate 500 à 2000 mg par jour, sur ordonnance ; vigne rouge 360 à 720 mg, au plus 3 mois ; marronnier d’Inde. Réévaluation après quelques semaines.</li><li>Ulcère : fraction flavonoïque purifiée micronisée ou oxérutines en adjuvant ; pentoxifylline et sulodexide ne sont pas autorisés en Suisse.</li><li>Dobésilate : fièvre ou angine imposent l’arrêt et un hémogramme ; la créatinine se prélève avant la prise du jour.</li><li>Polidocanol : 2 mg/kg par jour au plus ; une seule injection à la première séance si terrain allergique ; compression et marche ; pas de sclérose au premier trimestre ni après 36 semaines ; mousse contre-indiquée si foramen ovale perméable symptomatique connu. Le diabète sucré est une contre-indication selon les informations suisses d’Aethoxysklerol et de Sclerovein ; l’ESVS 2022 ne le mentionne pas, ce qui ne lève pas le libellé suisse.</li><li>Injection intra-artérielle : lidocaïne ou mépivacaïne et 500 UI d’héparine par la même aiguille, jambe basse, hospitalisation en chirurgie vasculaire.</li><li>Tumescence : lidocaïne à 0,1 % avec adrénaline et bicarbonate ; la dose totale en milligrammes est la limite.</li><li>Prophylaxie individualisée ; anticoagulant au long cours poursuivi pendant l’ablation thermique ; pas d’AINS chez l’anticoagulé.</li><li>Devant un œdème bilatéral, il faut rechercher l’amlodipine (11,1 %), la prégabaline, la pioglitazone et les AINS. L’œdème de l’amlodipine est capillaire : le diurétique ne le corrige pas, l’ajout d’un IEC ou d’un ARA le réduit.</li></ul></template>
