<section class="ilot" id="q21-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Trois patients arrivent la même semaine. Un nouveau-né de 36 heures, rose et tranquille, a une saturation de 91 % au pied lors du dépistage systématique. Un garçon de 4 ans est adressé pour un souffle entendu lors d’une fièvre. Une femme de 34 ans, opérée « d’un trou au cœur » dans l’enfance, consulte pour des palpitations et un désir de grossesse. La question qui structure le chapitre est la suivante : <b>quelle malformation, quelle conséquence hémodynamique, quelle urgence éventuelle, et quel suivi pour toute la vie ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait raisonner chaque cardiopathie congénitale à partir de trois mécanismes (shunt, obstacle, mélange ou inversion des circulations). Il sait reconnaître les urgences néonatales et interpréter le dépistage par oxymétrie en usage en Suisse. Il connaît, lésion par lésion, les signes, les examens et les seuils d’intervention de la Société européenne de cardiologie (ESC 2020). Il sait enfin organiser la transition vers l’âge adulte et conseiller une grossesse selon l’ESC 2025.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="q21-fetal">circulation fœtale (foramen ovale, canal artériel, canal veineux)</button>, son <button class="w" data-k="q21-transition">adaptation à la naissance (chute des résistances pulmonaires)</button> et la notion de <button class="w" data-k="q21-rvp">résistances vasculaires pulmonaires (unités Wood)</button>. Ces trois notions sont développées dans l’onglet Sciences fondamentales ; elles expliquent presque tous les calendriers cliniques de ce chapitre.</div>
</section>

<section class="ilot" id="q21-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>Une <b>cardiopathie congénitale</b> est une anomalie de structure du cœur ou des gros vaisseaux intrathoraciques présente dès la naissance et dotée d’une conséquence fonctionnelle réelle ou potentielle. La définition exclut les variantes sans conséquence (par exemple une veine cave supérieure gauche isolée drainée dans le sinus coronaire) et les maladies acquises. Les cardiomyopathies et les canalopathies héréditaires, bien que présentes dès la naissance, relèvent d’autres chapitres.</p>
<h3>1.1 Trois familles physiopathologiques</h3>
<p>La classification la plus utile au lit du patient ne part pas de l’anatomie mais de la conséquence hémodynamique. Elle permet de prévoir les symptômes, l’âge de révélation et le risque évolutif.</p>
<table class="t"><tr><th>Famille</th><th>Mécanisme</th><th>Exemples</th><th>Conséquence dominante</th></tr>
<tr><td><b>Shunts gauche-droite</b> (non cyanogènes)</td><td>Passage de sang oxygéné vers la circulation pulmonaire</td><td>CIA, CIV, canal artériel, CAV</td><td>Surcharge de volume ; à long terme, maladie vasculaire pulmonaire</td></tr>
<tr><td><b>Obstacles</b> (non cyanogènes)</td><td>Rétrécissement sur une voie d’éjection</td><td>Sténose pulmonaire, coarctation, bicuspidie aortique</td><td>Surcharge de pression, hypertrophie</td></tr>
<tr><td><b>Cardiopathies cyanogènes</b></td><td>Sang désaturé dans l’aorte : shunt droite-gauche, mélange, ou circulations en parallèle</td><td>Tétralogie de Fallot, transposition, ventricule unique, Eisenmenger</td><td>Hypoxémie, érythrocytose, embolies paradoxales</td></tr></table>
<p>Le moyen mnémotechnique des <button class="w" data-k="q21-mnemo-5t">« 5 T » (cardiopathies cyanogènes du nouveau-né)</button> aide à mémoriser les principales causes de cyanose néonatale d’origine cardiaque.</p>
<h3>1.2 Complexité selon l’ESC 2020</h3>
<p>L’ESC 2020 classe chaque patient adulte en trois niveaux de <button class="w" data-k="q21-complex">complexité (légère, modérée, sévère)</button>. Ce niveau décide du lieu et du rythme du suivi : les formes sévères sont suivies exclusivement en centre spécialisé ; les formes légères peuvent l’être en cardiologie générale après un premier bilan en centre. La complexité anatomique ne suffit pourtant pas : une lésion simple, comme une CIA compliquée d’hypertension artérielle pulmonaire, relève aussi d’un centre. L’ESC 2020 reconnaît que ce classement est arbitraire et que sa valeur pour la prise en charge et le pronostic reste à établir dans de grands registres. L’ACC/AHA a ajouté une <button class="w" data-k="q21-ap">classification anatomique et physiologique (stades A à D)</button>, qui décrit l’état fonctionnel en plus de l’anatomie.</p>
<h3>1.3 Codage CIM-10</h3>
<p>Les codes <button class="w" data-k="q21-cim">Q20 à Q28 (correspondance code → lésion)</button> couvrent les malformations des cavités (Q20), des cloisons (Q21), des valves pulmonaire et tricuspide (Q22), aortique et mitrale (Q23), les autres malformations cardiaques dont les anomalies coronaires (Q24), celles des gros vaisseaux (Q25, Q26) et des autres vaisseaux (Q27, Q28). Le foramen ovale perméable, persistance de la communication fœtale présente chez environ un adulte sur quatre, se code sous Q21.1 (avec la CIA) bien qu’il ne s’agisse pas d’un défaut septal au sens strict.</p>
<div class="trap"><span class="k">Piège</span>« Opéré, donc guéri » est faux pour la plupart des cardiopathies congénitales. Une réparation corrige l’anatomie mais laisse des séquelles (cicatrices, prothèses, valves incontinentes) qui produisent des complications vingt à quarante ans plus tard. L’ESC parle de patients <b>réparés</b>, jamais de patients guéris, à l’exception de quelques shunts simples fermés tôt sans lésion résiduelle.</div>
</section>

<section class="ilot" id="q21-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Les cardiopathies congénitales sont les malformations les plus fréquentes : elles touchent environ 8 à 10 naissances vivantes sur 1 000, soit près de 1 %. La communication interventriculaire est la plus fréquente (environ un tiers des cas), suivie de la communication interauriculaire, de la sténose pulmonaire et du canal artériel. Les formes sévères, qui exigent une intervention dans la première année, représentent environ un quart des cas.</p>
<p>La survie a changé l’épidémiologie. Dans les pays à haut revenu, plus de 90 % des enfants atteints atteignent l’âge adulte. Il y a désormais plus d’adultes que d’enfants porteurs d’une cardiopathie congénitale, et la population adulte vieillit : elle développe de l’hypertension, une coronaropathie, une fibrillation auriculaire et une insuffisance cardiaque, qui s’ajoutent à la malformation.</p>
<p>En Suisse, environ 80 000 naissances par an laissent attendre, par le calcul, 650 à 800 nouveau-nés porteurs d’une cardiopathie congénitale chaque année. Le suivi des adultes est documenté par le registre national <button class="w" data-k="q21-centres">SACHER (registre suisse des cardiopathies congénitales de l’adulte)</button>, rattaché aux centres universitaires.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune prévalence suisse consolidée des adultes porteurs d’une cardiopathie congénitale n’est publiée par l’Office fédéral de la statistique. Le nombre de naissances concernées ci-dessus est une estimation par calcul à partir de l’incidence européenne ; il ne s’agit pas d’une donnée mesurée.</div>

</section>

<section class="ilot" id="q21-3"><h2><span class="n">3</span>Physiopathologie générale</h2>
<p>Toutes les cardiopathies congénitales se comprennent à partir d’un seul événement : la <b>transition de la naissance</b>. In utero, le poumon ne respire pas, ses résistances sont très élevées, et le sang contourne le poumon par le foramen ovale et le canal artériel. À la première respiration, <button class="w" data-k="q21-transition">les résistances pulmonaires chutent</button>, la pression de l’oreillette gauche monte et ferme le foramen ovale, puis le canal artériel se ferme en quelques jours. Une malformation qui était silencieuse in utero se révèle à l’instant où ce montage fœtal disparaît. La chaîne logique du chapitre est donc : <b>malformation → changement des résistances à la naissance → direction et volume du flux → surcharge de volume, de pression, ou hypoxémie → remodelage.</b></p>
<h3>3.1 Les shunts gauche-droite</h3>
<p>Le sang passe du côté à haute pression (gauche) vers le côté à basse pression (droit). Le volume du shunt dépend de la taille du défaut et, surtout, des <button class="w" data-k="q21-shuntdet">déterminants du shunt (compliance ventriculaire, résistances d’aval)</button>. Il s’exprime par le rapport <button class="w" data-k="q21-qpqs">Qp/Qs (débit pulmonaire / débit systémique)</button> : un shunt est significatif au-delà de 1,5. Exemple : une communication interventriculaire large est presque silencieuse le premier jour, car les résistances pulmonaires sont encore hautes ; entre la deuxième et la sixième semaine, elles baissent, le shunt augmente, et le nourrisson développe une insuffisance cardiaque.</p>
<p>La cavité qui reçoit le volume supplémentaire se dilate. Dans la CIA, le shunt se fait en diastole vers l’oreillette et le ventricule droits : ce sont eux qui se dilatent. Dans la CIV et le canal artériel, le sang traverse la circulation pulmonaire puis revient à l’oreillette et au ventricule gauches : ce sont les cavités gauches qui se dilatent. Le ventricule droit échappe à cette surcharge de volume. Le shunt d’une CIV a lieu en systole, pendant que le ventricule droit éjecte, et celui du canal naît de l’aorte : le volume ajouté passe directement dans l’artère pulmonaire sans remplir le ventricule droit en diastole.</p>
<div class="key"><b>Corrélation physiopathologie → clinique.</b> Le territoire dilaté indique la lésion. Cavités droites dilatées avec ventricule gauche normal : CIA ou retour veineux pulmonaire anormal. Oreillette et ventricule gauches dilatés : CIV ou canal artériel. Cette règle permet de lire une échocardiographie ou une radiographie avant même de voir le défaut.</div>
<h3>3.2 De l’hyperdébit à la maladie vasculaire pulmonaire</h3>
<p>Un hyperdébit pulmonaire prolongé, surtout sous haute pression (CIV, canal artériel, CAV), lèse l’endothélium des artérioles. Celles-ci se remodèlent : hypertrophie de la média, prolifération intimale, puis <button class="w" data-k="q21-heath">lésions plexiformes irréversibles (classification de Heath et Edwards)</button>. Les résistances pulmonaires montent jusqu’à dépasser les résistances systémiques : le shunt s’inverse et devient droite-gauche. C’est le <b>syndrome d’Eisenmenger</b>. Le délai dépend de la pression transmise : quelques années pour un canal atrioventriculaire complet (plus vite encore dans la trisomie 21), plusieurs décennies ou jamais pour une CIA.</p>

<h3>3.3 Les obstacles</h3>
<p>Un rétrécissement impose au ventricule d’amont une surcharge de pression. Le ventricule s’adapte par une hypertrophie concentrique, qui normalise la contrainte pariétale au prix d’une rigidité. Le gradient mesuré à travers l’obstacle dépend du débit : il peut sous-estimer la sévérité si le ventricule défaille. Une coarctation provoque en outre une hypertension en amont (membres supérieurs, cerveau) et une hypoperfusion en aval, compensée par des collatérales intercostales.</p>
<h3>3.4 La cyanose</h3>
<p>La <button class="w" data-k="q21-cyanose">cyanose (seuil de désoxyhémoglobine, piège de l’anémie)</button> apparaît quand du sang désaturé atteint l’aorte. Trois mécanismes existent. Le <b>shunt droite-gauche</b> par obstacle à l’éjection droite et communication (tétralogie de Fallot) ou par résistances pulmonaires élevées (Eisenmenger). Le <b>mélange complet</b> dans une cavité unique (ventricule unique). Les <button class="w" data-k="q21-parallele">circulations en parallèle (transposition des gros vaisseaux)</button>, où le sang oxygéné retourne au poumon et le sang désaturé à l’aorte ; la survie dépend alors d’un mélange par le foramen ovale ou le canal. Plusieurs de ces lésions sont <button class="w" data-k="q21-ductdep">ducto-dépendantes (la survie exige un canal artériel ouvert)</button>.</p>
<p>L’hypoxémie chronique déclenche des <button class="w" data-k="q21-cyan-sys">adaptations qui deviennent elles-mêmes des maladies</button> : érythrocytose secondaire par sécrétion d’érythropoïétine, hyperviscosité, hippocratisme digital, thrombopénie modérée, hyperuricémie, lithiase biliaire pigmentaire, protéinurie par atteinte glomérulaire.</p>
<div class="key"><b>Corrélation physiologie → thérapeutique.</b> Dans une cardiopathie ducto-dépendante, la vie du nouveau-né dépend d’un vaisseau fœtal qui se ferme sous l’effet de l’oxygène et de la chute des prostaglandines. D’où deux conséquences pratiques : perfuser une prostaglandine de type E dès la suspicion, sans attendre l’échocardiographie, et ne pas administrer d’oxygène à forte concentration par réflexe, car il accélère la fermeture du canal.</div>

</section>

<section class="ilot" id="q21-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La cause d’une cardiopathie congénitale reste inconnue dans la majorité des cas ; on parle d’origine multifactorielle, où une prédisposition génétique rencontre un facteur d’environnement pendant l’organogenèse cardiaque, entre la troisième et la huitième semaine de grossesse. Une cause identifiable existe pourtant dans une minorité de cas : l’ESC 2020 estime qu’une base génétique explique 10 à 30 % des cardiopathies structurelles, davantage lorsque d’autres organes sont atteints ou que la famille compte d’autres cas. La reconnaître change le conseil génétique, le bilan des autres organes et parfois le suivi du patient lui-même.</p>
<div class="two">
<div class="card"><h4>Causes génétiques</h4><p>Aneuploïdies (trisomies 21, 18, 13 ; monosomie X) ; microdélétions (22q11.2, 7q11.23) ; maladies monogéniques (Noonan, Holt-Oram, Marfan, Alagille). Environ un enfant sur cinq atteint a un syndrome génétique identifiable.</p></div>
<div class="card"><h4>Facteurs maternels et tératogènes</h4><p><button class="w" data-k="q21-terato">Diabète prégestationnel mal équilibré, phénylcétonurie, rubéole, alcool, rétinoïdes, valproate (liste et mécanismes)</button> ; obésité maternelle ; <button class="w" data-k="q21-lithium">lithium (risque d’anomalie d’Ebstein, réévalué)</button>.</p></div>
<div class="card"><h4>Histoire familiale</h4><p>Le <button class="w" data-k="q21-recurr">risque de récurrence (fratrie, enfant d’un parent atteint)</button> est d’environ 2 à 5 % dans la fratrie d’un enfant atteint, plus élevé si la mère est elle-même atteinte.</p></div>
<div class="card"><h4>Procréation et grossesse</h4><p>Grossesse gémellaire monochoriale, procréation médicalement assistée et âge maternel élevé (aneuploïdies) augmentent le risque ; ils justifient une échocardiographie fœtale ciblée.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Ne pas proposer de conseil génétique à un adulte porteur d’une cardiopathie congénitale qui souhaite un enfant. Le risque de transmission d’une cardiopathie isolée non syndromique varie de 1 à 21 % selon la lésion. Il est plus élevé quand la mère est atteinte que lorsque c’est le père : pour une CIV, il est de 6 à 10 % contre 2 à 3,5 %. Il atteint 50 % dans une maladie autosomique dominante (microdélétion 22q11.2, Holt-Oram, Marfan, Noonan), car chaque enfant reçoit l’allèle anormal avec une probabilité d’une sur deux. La consultation préconceptionnelle est aussi le moment de discuter d’une échocardiographie fœtale.</div>
</section>

<section class="ilot" id="q21-5"><h2><span class="n">5</span>Syndromes associés</h2>
<p>Devant toute cardiopathie congénitale, l’examen recherche une dysmorphie, un retard de croissance ou des malformations extracardiaques. L’inverse est aussi vrai : un syndrome connu impose une échocardiographie, car la cardiopathie associée est souvent prévisible.</p>
<table class="t"><tr><th>Syndrome</th><th>Anomalie génétique</th><th>Cardiopathies typiques</th><th>Signes à ne pas manquer</th></tr>
<tr><td><button class="w" data-k="q21-down">Trisomie 21 (syndrome de Down)</button></td><td>Chromosome 21 surnuméraire</td><td>Canal atrioventriculaire, CIV, canal artériel ; environ 40 à 50 % des enfants</td><td>Maladie vasculaire pulmonaire précoce ; hypothyroïdie, apnées du sommeil</td></tr>
<tr><td><button class="w" data-k="q21-turner">Syndrome de Turner (atteinte cardiaque et grossesse)</button></td><td>Monosomie X (45,X) ou mosaïque</td><td>Bicuspidie aortique, coarctation, dilatation aortique</td><td>Dissection aortique, notamment pendant la grossesse ; hypertension</td></tr>
<tr><td><button class="w" data-k="q21-digeorge">Microdélétion 22q11.2 (syndrome de DiGeorge)</button></td><td>Délétion 22q11.2 (gène <i>TBX1</i>)</td><td>Cardiopathies conotroncales : tétralogie de Fallot, tronc artériel commun, interruption de l’arche aortique</td><td>Hypocalcémie, déficit lymphocytaire T, fente palatine, troubles psychiatriques</td></tr>
<tr><td><button class="w" data-k="q21-williams">Syndrome de Williams (artériopathie élastique)</button></td><td>Délétion 7q11.23 (gène <i>ELN</i>)</td><td>Sténose aortique supravalvulaire, sténoses pulmonaires périphériques</td><td>Hypercalcémie, hypertension, profil cognitif et relationnel particulier</td></tr>
<tr><td><button class="w" data-k="i35-marfan">Syndrome de Marfan (critères et aorte)</button></td><td>Gène <i>FBN1</i> (autosomique dominant)</td><td>Dilatation de la racine aortique, prolapsus mitral</td><td>Dissection aortique ; grossesse contre-indiquée au-delà de 45 mm de racine aortique (mWHO IV)</td></tr>
<tr><td><button class="w" data-k="i34-noonan">Syndrome de Noonan (cœur et génétique)</button></td><td>Voie Ras (<i>PTPN11</i> le plus souvent)</td><td>Sténose pulmonaire à valve dysplasique, cardiomyopathie hypertrophique</td><td>Petite taille, troubles de la coagulation</td></tr>
<tr><td>Syndrome de Holt-Oram</td><td>Gène <i>TBX5</i></td><td>CIA, troubles de conduction. <i>TBX5</i> code un facteur de transcription nécessaire au développement du cœur et du membre supérieur : la perte d’une copie fonctionnelle atteint les deux.</td><td>Anomalies du membre supérieur (pouce)</td></tr></table>
<div class="trap"><span class="k">Piège</span>Chez un patient porteur d’une microdélétion 22q11.2, une transfusion doit utiliser des produits sanguins irradiés tant que l’immunité lymphocytaire T n’a pas été évaluée, et les vaccins vivants sont différés. L’hypoplasie du thymus réduit la production de lymphocytes T chez jusqu’à 75 % des enfants atteints. Sans irradiation, les lymphocytes T du donneur pourraient se greffer chez ce receveur et provoquer une réaction du greffon contre l’hôte ; un virus vaccinal vivant pourrait de même se disséminer. Un seul seuil de lymphocytes T ne suffit donc pas à autoriser un vaccin vivant. Le consensus immunologique 2023 et le rapport pédiatrique 2025 demandent une évaluation spécialisée : pour rougeole-oreillons-rubéole et varicelle, les critères proposés associent notamment CD4 ≥ 400/µL, CD8 ≥ 200/µL, lymphocytes T naïfs adéquats et réponse protectrice au vaccin antitétanique. Les critères dépendent du vaccin et du contexte immunitaire. Une hypocalcémie peut provoquer des convulsions néonatales ou des arythmies en période postopératoire. Elle résulte de l’hypoplasie des parathyroïdes, issues comme le thymus de l’endoderme des poches pharyngées, et un stress biologique comme une chirurgie peut la démasquer : la calcémie est surveillée autour de chaque intervention.</div>
</section>

<section class="ilot" id="q21-6"><h2><span class="n">6</span>Anamnèse selon l’âge</h2>
<p>La même malformation se présente différemment selon l’âge, parce que les résistances pulmonaires, le canal artériel et les adaptations évoluent. L’anamnèse commence par le terrain, puis recherche les symptômes propres à chaque période.</p>
<h3>6.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="q21-atcd-grossesse">Histoire prénatale (échographies, diabète, médicaments, infections)</button></li><li><button class="w" data-k="q21-atcd-fam">Histoire familiale (cardiopathie, mort subite, syndrome)</button></li><li>Prématurité, poids de naissance, adaptation néonatale</li></ul>
<ul><li><button class="w" data-k="q21-atcd-chir">Interventions antérieures (nom de l’opération et ce qu’elle a laissé)</button></li><li>Endocardite antérieure, qui place le patient dans le groupe à haut risque et impose une antibioprophylaxie avant les soins dentaires à risque ; arythmies ; accident vasculaire cérébral</li><li>Grossesses antérieures et leur déroulement, car un événement cardiaque ou une arythmie antérieurs prédisent une complication lors de la grossesse suivante</li></ul></div>
<h3>6.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="q21-s-nourr">Nourrisson : difficultés alimentaires, sueurs, stagnation pondérale (mécanisme)</button></li><li><button class="w" data-k="q21-s-dysp">Enfant et adulte : dyspnée, baisse de la tolérance à l’effort (mécanismes)</button></li><li><button class="w" data-k="q21-s-palp">Palpitations (arythmies auriculaires de l’adulte opéré)</button></li><li>Infections respiratoires répétées (hyperdébit pulmonaire)</li></ul>
<ul><li><button class="w" data-k="q21-s-squat">Accroupissement après l’effort (tétralogie de Fallot)</button></li><li><button class="w" data-k="q21-s-embol">Accident embolique chez un sujet jeune (embolie paradoxale)</button></li><li><button class="w" data-k="q21-s-hyperv">Céphalées, troubles visuels, paresthésies (hyperviscosité)</button></li><li>Hémoptysie et syncope d’effort, signes de gravité : la première peut révéler une rupture de collatérale ou une thrombose artérielle pulmonaire, la seconde un débit cardiaque qui ne peut plus augmenter ou une arythmie</li></ul></div>
<p>La perception du patient est trompeuse. Un adulte qui a grandi avec une cardiopathie a toujours limité ses efforts ; il se dit « en forme » alors que sa consommation maximale d’oxygène est abaissée. Dans une série de plus de 4 000 adultes, 80 % avaient une valeur inférieure à 90 % de la valeur prédite, même avec une lésion simple ; les valeurs les plus basses concernaient le syndrome d’Eisenmenger et les cardiopathies complexes. D’où l’intérêt de l’épreuve d’effort cardiorespiratoire, qui objective la limitation.</p>
<h3>6.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Nouveau-né : choc au 4e jour</h4><p>Nouveau-né sorti de maternité au 3e jour, ramené le 4e jour gris, polypnéique, fémoraux absents, lactate élevé. La fermeture du canal artériel a démasqué une coarctation critique : cardiopathie ducto-dépendante de la circulation systémique.</p></div>
<div class="card"><h4>Nourrisson : insuffisance cardiaque à six semaines</h4><p>Nourrisson de 6 semaines qui met 40 minutes à boire son biberon, transpire et ne prend plus de poids. Souffle holosystolique, foie débordant. La chute des résistances pulmonaires a démasqué une CIV large.</p></div>
<div class="card"><h4>Adulte : CIA de découverte tardive</h4><p>Femme de 52 ans, première fibrillation auriculaire, ECG avec bloc de branche droit incomplet, cavités droites dilatées. La CIA était asymptomatique depuis toujours ; la dilatation auriculaire droite se révèle par l’arythmie.</p></div>
<div class="card"><h4>Adulte jeune : accident vasculaire cérébral</h4><p>Homme de 38 ans, accident ischémique sans facteur de risque ni fibrillation auriculaire. Le test aux microbulles révèle un foramen ovale perméable à large shunt avec anévrisme du septum : cause probable selon la classification PASCAL.</p></div></div>
</section>

<section class="ilot" id="q21-7"><h2><span class="n">7</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux complets → anthropométrie → signes ciblés. Il répond à quatre questions : le patient est-il cyanosé, en insuffisance cardiaque, porteur d’un obstacle, et quelle est la signature auscultatoire de la lésion ?</p>
<h3>7.1 État général, signes vitaux, anthropométrie</h3>
<p>Coloration, dysmorphie, polypnée, tirage. Fréquence cardiaque et respiratoire, <button class="w" data-k="q21-e-4membres">pression artérielle aux quatre membres et saturation pré- et postductale (technique et interprétation)</button>, température. <button class="w" data-k="q21-e-croiss">Poids, taille et périmètre crânien sur les courbes de croissance (interprétation)</button> chez l’enfant ; indice de masse corporelle chez l’adulte.</p>
<h3>7.2 Signes ciblés</h3>
<div class="two">
<div><b>Cyanose et ses conséquences</b><ul><li><button class="w" data-k="q21-e-cyanose">Cyanose centrale, périphérique ou différentielle (distinction)</button></li><li><button class="w" data-k="q21-e-hippo">Hippocratisme digital (technique et signification)</button></li><li>Conjonctives injectées, gingivite (érythrocytose)</li></ul></div>
<div><b>Auscultation des shunts</b><ul><li><button class="w" data-k="q21-e-b2">Dédoublement fixe de B2 (CIA)</button></li><li><button class="w" data-k="q21-e-civ">Souffle holosystolique de CIV (intensité et taille)</button></li><li><button class="w" data-k="q21-e-continu">Souffle continu « tunnel » (canal artériel)</button></li></ul></div>
<div><b>Obstacles</b><ul><li><button class="w" data-k="i10-e-pouls-fem">Pouls fémoraux et retard radio-fémoral (coarctation)</button></li><li>Souffle éjectionnel au foyer pulmonaire avec clic (sténose pulmonaire valvulaire)</li><li>Souffle interscapulaire, collatérales palpables</li></ul></div>
<div><b>Insuffisance cardiaque et séquelles</b><ul><li>Hépatomégalie (signe cardinal du nourrisson), polypnée</li><li><button class="w" data-k="q21-e-cicatrices">Cicatrices opératoires et pouls radial absent (anastomose palliative)</button></li><li>Composante pulmonaire de B2 éclatante (hypertension pulmonaire)</li></ul></div></div>
<p>Tout souffle d’enfant n’est pas une cardiopathie. La majorité des souffles entendus entre 3 et 7 ans sont des <button class="w" data-k="q21-e-innocent">souffles innocents (critères et exemples)</button>. Le médecin doit reconnaître les caractères qui imposent un avis spécialisé : souffle diastolique, holosystolique, intensité ≥ 3/6 avec frémissement, B2 anormal, clic, symptômes ou signes associés.</p>
<div class="trap"><span class="k">Piège</span>Une grande CIV avec hypertension pulmonaire ou une CIA large peuvent être peu ou pas soufflantes. Le souffle mesure le gradient de pression, pas la gravité : une CIV très restrictive (« maladie de Roger ») souffle fort et n’a presque pas de conséquence ; une CIV non restrictive souffle peu et évolue vers l’Eisenmenger si elle n’est pas fermée.</div>
<button class="pareto-btn ui" data-k="pareto-q21-clin">▲ Loi de Pareto — Étiologies, syndromes, anamnèse et examen</button>
</section>

<section class="ilot" id="q21-8"><h2><span class="n">8</span>Démarche diagnostique et dépistage</h2>
<p>La démarche diffère selon le moment où la cardiopathie est suspectée. Elle repose, dans tous les cas, sur un examen de référence : l’<b>échocardiographie</b>, qui établit l’anatomie par une <button class="w" data-k="q21-segment">analyse segmentaire (situs, connexions, anomalies associées)</button>.</p>
<h3>8.1 Avant la naissance</h3>
<p>L’échographie morphologique du deuxième trimestre, vers 20 à 23 semaines, examine la coupe des quatre cavités et les voies d’éjection. Une anomalie, un facteur de risque ou une clarté nucale augmentée conduisent à une <button class="w" data-k="q21-echofoet">échocardiographie fœtale (indications et bénéfice)</button>. Le diagnostic prénatal permet d’organiser l’accouchement dans un centre disposant d’une cardiologie pédiatrique et d’une chirurgie cardiaque.</p>
<h3>8.2 À la maternité : l’oxymétrie de pouls</h3>
<p>En Suisse, un <button class="w" data-k="q21-oxy">dépistage par oxymétrie de pouls (protocole recommandé depuis 2005)</button> est recommandé chez tous les nouveau-nés par les sociétés suisses de néonatologie et de cardiologie pédiatrique. La saturation est mesurée au pied, site postductal, dans les 24 premières heures. Le pied est choisi parce que, dans une cardiopathie dont la circulation systémique dépend du canal, le sang désaturé de l’artère pulmonaire rejoint l’aorte descendante par le canal : la désaturation n’apparaît qu’en aval. Une mesure précoce repère la cardiopathie avant la fermeture du canal et la sortie de maternité, au prix de davantage de faux positifs : 0,50 % avant 24 heures contre 0,05 % après. Une saturation inférieure à 95 % impose une évaluation clinique et une échocardiographie. Ce dépistage détecte les cardiopathies critiques sans cyanose visible, car l’œil ne perçoit pas une saturation de 90 à 94 %.</p>

<h3>8.3 Nouveau-né cyanosé : cœur ou poumon ?</h3>
<p>Le <button class="w" data-k="q21-hyperox">test d’hyperoxie (interprétation)</button> aide à distinguer une cyanose cardiaque d’une cause pulmonaire : sous oxygène pur, la pression partielle artérielle en oxygène s’élève nettement dans une maladie pulmonaire, et peu dans un shunt droite-gauche fixe. L’échocardiographie tranche. La différence de saturation entre la main droite et le pied oriente vers un shunt droite-gauche par le canal artériel (hypertension pulmonaire persistante du nouveau-né, obstacle aortique).</p>
<h3>8.4 Enfant ou adulte avec un souffle, une dilatation droite ou un accident embolique</h3>
<p>L’ECG et la radiographie orientent ; l’échocardiographie transthoracique confirme. L’<button class="w" data-k="i48-eto">échocardiographie transœsophagienne (indications)</button> précise les défauts postérieurs (CIA de type sinus venosus, retours veineux pulmonaires anormaux) et l’anatomie avant une fermeture percutanée. L’<button class="w" data-k="irm">IRM cardiaque (principes)</button> est la référence pour les volumes du ventricule droit et le Qp/Qs ; le scanner l’est pour les coronaires et l’aorte. Le <button class="w" data-k="q21-bulles">test aux microbulles (recherche d’un shunt droite-gauche)</button> recherche un foramen ovale perméable. Le détail figure dans l’onglet Examens.</p>

</section>

<section class="ilot" id="q21-9"><h2><span class="n">9</span>Urgences et complications</h2>
<div class="alert"><b>Gravité d’abord.</b> Nouveau-né en choc (marbrures, pouls fémoraux faibles, lactate élevé) ou cyanose profonde qui ne cède pas à l’oxygène : suspecter une cardiopathie ducto-dépendante et débuter une prostaglandine de type E en perfusion continue sans attendre l’échocardiographie ; prévoir l’apnée, car la prostaglandine déprime la respiration chez 12 % des nouveau-nés traités et chez 42 % de ceux de moins de 2 kg. Enfant porteur d’une tétralogie de Fallot devenu brutalement plus cyané, agité, avec un souffle qui s’atténue : crise hypoxique. Adulte cyanosé avec hémoptysie, syncope ou tachycardie mal tolérée : avis immédiat du centre de cardiopathies congénitales.</div>
<p>Les soins suivent l’ordre de gravité ; les urgences propres à chaque période ont un traitement spécifique.</p>
<div class="two">
<div class="card"><h4>Choc du nouveau-né ducto-dépendant</h4><p><button class="w" data-k="q21-chocneo">Reconnaissance et conduite (alprostadil, ventilation, transfert)</button>. Obstacles gauches critiques (coarctation, interruption de l’arche, hypoplasie du cœur gauche) : choc entre le 2e et le 7e jour, à la fermeture du canal.</p></div>
<div class="card"><h4>Crise hypoxique de la tétralogie de Fallot</h4><p><button class="w" data-k="q21-spell">Mécanisme et conduite (position genoux-poitrine, morphine, bêtabloquant, phényléphrine)</button>. Toute crise impose de programmer la réparation.</p></div>
<div class="card"><h4>Arythmies de l’adulte</h4><p><button class="w" data-k="q21-arythmie">Tachycardies par réentrée intra-auriculaire, arythmies ventriculaires, bradycardies (conduite)</button>. Les arythmies sont une cause majeure d’hospitalisation et le mécanisme habituel de la mort subite chez l’adulte opéré. L’insuffisance cardiaque, présente chez 20 à 50 % des patients, est pourtant devenue la première cause de décès : 42 % des décès dans une cohorte de près de 7 000 adultes (<button class="w" data-k="q21-esc-2026-comparaison">ESC 2026 : 26 à 46 % des décès</button> selon les séries). Une tachycardie « banale » peut être mal tolérée dans un Fontan ou un ventricule droit systémique, car le remplissage de ces ventricules, déjà limité, s’effondre quand la diastole raccourcit.</p></div>
<div class="card"><h4>Complications du patient cyanosé</h4><p><button class="w" data-k="q21-hemopt">Hémoptysie (causes et conduite)</button>, <button class="w" data-k="q21-abces">abcès cérébral (céphalées fébriles)</button>, accident vasculaire cérébral par embolie paradoxale, thromboses, <button class="w" data-k="q21-cyan-sys">goutte, insuffisance rénale</button>.</p></div>
<div class="card"><h4>Endocardite infectieuse</h4><p>Risque élevé après une réparation avec matériel prothétique, dans les cardiopathies cyanogènes et en présence d’un shunt résiduel. <button class="w" data-k="q21-endoc">Patients à haut risque et prophylaxie (ESC 2023)</button>.</p></div>
<div class="card"><h4>Dissection aortique et insuffisance cardiaque</h4><p>Dissection : Turner, Marfan, bicuspidie, coarctation. Ces situations partagent une paroi aortique anormale, que l’hypertension ou la grossesse soumettent à une contrainte accrue ; dans le syndrome de Turner, la dissection survient chez 40 patientes pour 100 000 par an, contre 6 dans la population générale. Insuffisance cardiaque : ventricule droit systémique, Fontan défaillant, tétralogie de Fallot avec fuite pulmonaire sévère.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Poser une voie veineuse chez un patient porteur d’un shunt droite-gauche sans filtre à air. Une bulle d’air injectée dans une veine passe directement dans la circulation systémique et peut provoquer une embolie gazeuse cérébrale. Chez tout patient cyanosé, les lignes veineuses sont purgées avec soin et munies d’un filtre.</div>
<button class="pareto-btn ui" data-k="pareto-q21-urg">▲ Loi de Pareto — Urgences et complications</button>
</section>
