<section class="ilot" id="i42-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un footballeur amateur de 19 ans fait une syncope en plein effort, pendant un sprint. Il reprend connaissance en quelques secondes. Son ECG montre des ondes T négatives profondes dans les dérivations latérales. Son oncle est mort subitement à 34 ans. La question qui structure tout le chapitre est la suivante : <b>ce cœur est-il malade dans son muscle même, de quel phénotype s’agit-il, quelle en est la cause, ce jeune homme risque-t-il la mort subite, et que doit-on proposer à sa famille ?</b></p>
<p>Les cardiomyopathies sont des maladies du myocarde lui-même. Elles ne s’expliquent ni par une maladie coronaire, ni par une hypertension, ni par une valvulopathie, ni par une cardiopathie congénitale. Elles se révèlent de trois manières : par une insuffisance cardiaque, par une arythmie (dont la mort subite), ou par la découverte fortuite d’une anomalie à l’ECG ou à l’échocardiographie. Beaucoup sont génétiques ; le diagnostic d’un patient engage donc toute sa famille.</p>
<p>À la fin de ce chapitre, le médecin assistant sait nommer le phénotype selon la classification de la Société européenne de cardiologie (ESC) 2023, rechercher l’étiologie par des drapeaux rouges, prescrire et interpréter l’IRM cardiaque et l’analyse génétique, reconnaître et quantifier une obstruction dynamique de la chambre de chasse, estimer le risque de mort subite et poser l’indication d’un défibrillateur. Il sait aussi traiter l’obstruction (y compris par les inhibiteurs de la myosine cardiaque), traiter spécifiquement une amylose, reconnaître un Tako-tsubo, une cardiomyopathie du péripartum ou une cardiotoxicité, et organiser le dépistage familial. Le traitement général de l’insuffisance cardiaque est exposé dans le chapitre I50 ; il n’est pas repris ici.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i42-sarcomere">sarcomère et le cycle de la myosine (cible des inhibiteurs)</button>, la <button class="w" data-k="diastole">dysfonction diastolique (relaxation et compliance)</button> et la <button class="w" data-k="laplace">loi de Laplace (contrainte pariétale)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i42-1"><h2><span class="n">1</span>Définition et classification phénotypique</h2>
<p>L’ESC 2023 définit une cardiomyopathie comme une <b>anomalie structurelle et fonctionnelle du muscle cardiaque, qui n’est pas expliquée suffisamment par une maladie coronaire, une hypertension, une valvulopathie ou une cardiopathie congénitale</b>. Le mot « suffisamment » est essentiel. Un hypertendu peut avoir une cardiomyopathie hypertrophique ; ce qui compte est la disproportion entre l’anomalie observée et la cause « banale » disponible. Par exemple, une paroi de 22 mm chez un patient dont l’hypertension est légère et bien traitée ne s’explique pas par l’hypertension.</p>
<h3>1.1 Le principe de la classification ESC 2023 : le phénotype d’abord</h3>
<p>Les recommandations de 2023 ont réuni pour la première fois toutes les cardiomyopathies dans un seul document. Elles classent le patient selon ce que l’imagerie montre (le phénotype), puis cherchent la cause (l’étiologie, génétique ou acquise). Cette démarche évite une erreur ancienne : appeler « idiopathique » une cardiomyopathie parce qu’on n’a pas cherché sa cause.</p>
<table class="t"><tr><th>Phénotype (ESC 2023)</th><th>Définition opérationnelle</th><th>Exemples d’étiologies</th></tr>
<tr><td><b>Cardiomyopathie hypertrophique (CMH)</b></td><td>Épaisseur pariétale du ventricule gauche ≥ 15 mm dans au moins un segment (≥ 13 mm chez un apparenté du premier degré), non expliquée par les conditions de charge</td><td>Variants sarcomériques ; amylose ; maladie de Fabry ; maladies de surcharge ; syndromes génétiques</td></tr>
<tr><td><b>Cardiomyopathie dilatée (CMD)</b></td><td>Dilatation du ventricule gauche et dysfonction systolique globale (FEVG &lt; 50 %), non expliquées par les conditions de charge ou une maladie coronaire</td><td>Variants de <i>TTN</i>, <i>LMNA</i> ; alcool ; anthracyclines ; tachycardie ; myocardite ; péripartum</td></tr>
<tr><td><b>Cardiomyopathie non dilatée du ventricule gauche (CMNDVG)</b></td><td>Cicatrice non ischémique ou remplacement graisseux du ventricule gauche, quelle que soit la cinétique ; ou hypokinésie globale isolée sans cicatrice ; sans dilatation</td><td><i>DSP</i>, <i>FLNC</i>, <i>LMNA</i> ; séquelle de myocardite ; sarcoïdose</td></tr>
<tr><td><b>Cardiomyopathie arythmogène du ventricule droit (CMAVD)</b></td><td>Dilatation ou dysfonction du ventricule droit, avec remplacement fibro-adipeux et arythmies ventriculaires, selon des critères diagnostiques dédiés</td><td>Variants desmosomaux (<i>PKP2</i> surtout)</td></tr>
<tr><td><b>Cardiomyopathie restrictive (CMR)</b></td><td>Physiologie restrictive d’un ou des deux ventricules, avec volumes diastolique et systolique normaux ou réduits et épaisseur pariétale normale</td><td>Variants sarcomériques ; <i>DES</i> ; fibrose endomyocardique ; radiothérapie</td></tr></table>
<p>La <button class="w" data-k="i42-restriction">physiologie restrictive (remplissage rapide puis arrêt brutal)</button> est une manière de se remplir, pas seulement un phénotype. L’amylose donne souvent des parois épaisses avec une physiologie restrictive : elle est alors classée comme un phénotype hypertrophique avec une physiologie restrictive, et c’est l’étiologie qui la nomme. Dans ce chapitre, les maladies infiltratives sont regroupées dans l’îlot 11 pour des raisons pédagogiques.</p>
<div class="trap"><span class="k">Piège</span>La « non-compaction du ventricule gauche » n’est plus une cardiomyopathie pour l’ESC 2023. Une <button class="w" data-k="i42-noncompaction">hypertrabéculation ventriculaire gauche (trait phénotypique, non maladie)</button> s’observe chez l’athlète, la femme enceinte et le sujet sain. Elle n’a de valeur que si elle accompagne un autre phénotype (dilatation, dysfonction) ou une histoire familiale.</div>
<h3>1.2 Situations qui ne sont pas des cardiomyopathies primitives</h3>
<p>La <b>cardiomyopathie de stress (Tako-tsubo)</b> et la <b>cardiomyopathie du péripartum</b> sont des syndromes transitoires ou acquis, traités à part par l’ESC 2023. Les dysfonctions d’origine ischémique, hypertensive ou valvulaire ne sont pas des cardiomyopathies au sens de cette définition, même si l’usage courant parle de « cardiomyopathie ischémique ».</p>

<section class="ilot" id="i42-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>La <b>CMH</b> est la cardiopathie génétique la plus fréquente. Sa prévalence phénotypique chez l’adulte est d’environ 1 sur 500 ; en comptant les porteurs d’un variant sans hypertrophie, elle atteint environ 1 sur 200. Elle est sous-diagnostiquée : la plupart des porteurs ne sont pas identifiés. L’hypertrophie reste souvent asymptomatique et la pénétrance des variants est incomplète : seuls un ECG ou une échocardiographie révèlent la maladie. Les dossiers médicaux électroniques n’en recensent ainsi que 3 à 4 cas pour 10 000 personnes (ESC 2023).</p>
<p>La <b>CMD</b> a une prévalence estimée entre 1 sur 250 et 1 sur 2 500 selon les définitions utilisées. Les estimations hautes reposent sur des hypothèses indirectes de fréquence des variants génétiques en population et sur des critères diagnostiques moins stricts ; les estimations basses ne comptent que les cas diagnostiqués. Elle est la première cause de transplantation cardiaque chez l’adulte jeune. Des variants rares pathogènes expliquent environ 30 à 40 % des cas (ESC 2023), et davantage lorsqu’il existe une histoire familiale.</p>
<p>La <b>CMAVD</b> touche environ 1 personne sur 1 000 à 1 sur 5 000. Elle est une cause majeure de mort subite du sujet jeune et de l’athlète, en particulier dans les séries italiennes. Dans la cohorte de Vénétie suivie de 1979 à 1999, le risque de mort subite liée à une CMAVD était 5,4 fois plus élevé chez l’athlète de compétition que chez le non-athlète. Selon les auteurs, le sport ne cause pas la mort subite par lui-même : il la déclenche sur un substrat déjà présent.</p>
<p>L’<b>amylose cardiaque à transthyrétine de type sauvage</b> est beaucoup plus fréquente qu’on ne le pensait. Les études de dépistage par scintigraphie osseuse la retrouvent chez environ 12 % des patients atteints d’ICFEp avec hypertrophie ventriculaire gauche, 8 % des patients porteurs d’un rétrécissement aortique serré et 7 % des patients opérés d’un canal carpien. Ces populations partagent l’âge avancé, principal déterminant de la forme sauvage. L’âge moyen au diagnostic dépasse 75 ans ; les hommes prédominent.</p>
<p>Le <b>Tako-tsubo</b> représente environ 1 à 2 % des patients admis pour une suspicion de syndrome coronarien aigu ; environ 90 % sont des femmes ménopausées. La <b>cardiomyopathie du péripartum</b> a une incidence très variable selon les régions, d’environ 1 grossesse sur 1 000 à 1 sur 4 000 en Europe.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucun registre national suisse des cardiomyopathies n’est publié de façon consolidée. Les prévalences ci-dessus sont celles rapportées par l’ESC 2023 et par les grandes séries européennes et nord-américaines.</div>

<section class="ilot" id="i42-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Chaque phénotype correspond à un compartiment de la cellule myocardique qui dysfonctionne. Relier le compartiment au phénotype permet de prévoir la clinique, les examens et le traitement. La chaîne générale est : <b>défaut moléculaire ou agression → atteinte d’un compartiment cellulaire → phénotype macroscopique → fibrose → insuffisance cardiaque et arythmies.</b></p>
<h3>3.1 Le sarcomère trop actif : la cardiomyopathie hypertrophique</h3>
<p>La plupart des variants de la CMH touchent des protéines du <button class="w" data-k="i42-sarcomere">sarcomère (cycle actine-myosine)</button>, surtout la chaîne lourde β de la myosine (<i>MYH7</i>) et la protéine C de liaison à la myosine (<i>MYBPC3</i>). Le mécanisme dominant est une <b>hypercontractilité</b> : trop de têtes de myosine quittent leur état de repos et interagissent avec l’actine. La consommation d’ATP augmente, la relaxation est incomplète et le cardiomyocyte s’hypertrophie.</p>
<p>À l’échelle du tissu, les cardiomyocytes sont désorganisés (<button class="w" data-k="i42-disarray">désarroi myocytaire, en anglais « disarray » (substrat arythmique)</button>) et la fibrose s’installe. Les petites artères intramurales s’épaississent ; il en résulte une ischémie microvasculaire, même avec des coronaires épicardiques normales. L’hypertrophie, souvent asymétrique et prédominant sur le septum basal, rétrécit la chambre de chasse. Elle crée alors une <button class="w" data-k="i42-obstruction">obstruction dynamique de la chambre de chasse (mécanisme et variabilité)</button>.</p>
<div class="key"><b>Corrélation physiologie → thérapeutique.</b> Puisque le mécanisme est une contraction excessive, le traitement réduit la contractilité : bêtabloquant, inhibiteur calcique bradycardisant, disopyramide, puis <button class="w" data-k="i42-d-mava">inhibiteurs de la myosine cardiaque (mavacamten, aficamten)</button>, qui ramènent les têtes de myosine vers leur état de repos. À l’inverse, tout ce qui augmente la contractilité (inotropes) ou réduit le volume du ventricule (déshydratation, vasodilatateurs) aggrave l’obstruction.</div>
<h3>3.2 Le cytosquelette et le noyau défaillants : la cardiomyopathie dilatée</h3>
<p>Dans la CMD, le défaut touche la transmission de la force ou la survie de la cellule. La <b>titine</b> (<i>TTN</i>), la plus grande protéine du sarcomère, qui en détermine la rigidité passive, est la plus souvent en cause ; ses variants tronquants réduisent la quantité de protéine fonctionnelle. Les <b>lamines A et C</b> (<i>LMNA</i>) forment l’enveloppe du noyau ; leur atteinte favorise une fibrose de la couche moyenne du septum, que traversent le faisceau de His et ses branches, d’où les blocs auriculoventriculaires ; la même cicatrice sert de substrat aux arythmies ventriculaires. Le lien moléculaire entre la fragilité de l’enveloppe nucléaire et cette fibrose reste débattu. Les agressions acquises réduisent la contractilité par des voies propres. L’alcool altère les mitochondries et le couplage excitation-contraction ; les anthracyclines provoquent, par la topo-isomérase IIβ, des cassures de l’ADN et un défaut de biogenèse mitochondriale ; une tachycardie prolongée épuise les réserves énergétiques et perturbe le cycle du calcium ; l’inflammation détruit des cardiomyocytes. La dysfonction due à l’alcool ou à la tachycardie régresse souvent quand la cause cesse ; celle des anthracyclines beaucoup moins, car les cardiomyocytes perdus ne se renouvellent pas. Le ventricule se dilate, puis le <button class="w" data-k="remodel">remodelage ventriculaire (dilatation, fibrose, sphéricisation)</button> entretient la dysfonction.</p>
<h3>3.3 La jonction cellulaire rompue : la cardiomyopathie arythmogène</h3>
<p>Les <button class="w" data-k="i42-desmosome">desmosomes (jonctions mécaniques entre cardiomyocytes)</button> attachent les cellules entre elles. Quand ils sont défectueux (<i>PKP2</i>, <i>DSP</i>, <i>DSG2</i>), l’étirement mécanique détache les cardiomyocytes, qui meurent et sont remplacés par du tissu fibreux et graisseux. Ce remplacement débute dans la paroi fine du ventricule droit. À l’effort intense, la contrainte pariétale télésystolique du ventricule droit augmente d’environ 125 %, contre 14 % pour le ventricule gauche : la paroi droite subit l’étirement le plus fort, et des jonctions fragiles y cèdent en premier. Il crée des îlots de cellules survivantes séparés par de la fibrose, substrat de circuits de réentrée. L’effort intense augmente l’étirement et accélère la maladie.</p>
<div class="key"><b>Corrélation physiologie → clinique.</b> Le lien entre effort, étirement et mort cellulaire explique deux faits cliniques. La CMAVD est surreprésentée chez les athlètes d’endurance. La restriction de l’activité sportive intense fait partie du traitement.</div>
<h3>3.4 Le myocarde envahi : les formes infiltratives</h3>
<p>Dans l’amylose, des fibrilles protéiques se déposent dans l’espace extracellulaire. La paroi s’épaissit sans hypertrophie des cellules ; le voltage ECG est donc bas malgré l’épaisseur. Dans la maladie de Fabry, des sphingolipides s’accumulent dans les cardiomyocytes (vraie hypertrophie cellulaire). Dans la sarcoïdose, des granulomes remplacent le myocarde et le tissu de conduction. Dans l’hémochromatose, le fer s’accumule dans les cardiomyocytes. Ces atteintes rigidifient le ventricule et produisent une <button class="w" data-k="i42-restriction">physiologie restrictive (définition et traduction échocardiographique)</button>.</p>
<h3>3.5 L’agression catécholaminergique et hormonale</h3>
<p>Le Tako-tsubo résulte d’<button class="w" data-k="i42-takotsubo">une décharge de catécholamines</button> : l’apex, riche en récepteurs β-adrénergiques, est « sidéré » de façon transitoire. La cardiomyopathie du péripartum associe une prédisposition génétique (variants de <i>TTN</i> notamment) et un stress oxydatif de fin de grossesse, qui produit un fragment toxique de la prolactine. Ce mécanisme a été démontré chez la souris et soutenu par des dosages chez les patientes ; il n’explique pas à lui seul toutes les formes humaines.</p>

<section class="ilot" id="i42-4"><h2><span class="n">4</span>Démarche phénotype, étiologie, génétique</h2>
<p>L’ESC 2023 propose une démarche en quatre temps, applicable à tout patient. Elle transforme une image (« le ventricule est épais ») en un diagnostic précis (« amylose à transthyrétine de type sauvage ») qui a un traitement propre.</p>
<ol><li><b>Suspecter</b> : symptôme, arythmie, souffle, ECG anormal, histoire familiale, découverte fortuite.</li>
<li><b>Décrire le phénotype</b> par l’échocardiographie et l’IRM : épaisseur, taille, fonction des deux ventricules, physiologie de remplissage, et surtout <b>caractérisation tissulaire</b> par l’<button class="w" data-k="i42-irm">IRM cardiaque (patterns lésionnels des cardiomyopathies)</button>.</li>
<li><b>Chercher l’étiologie</b> par une approche multiparamétrique : anamnèse familiale sur trois générations, signes extracardiaques, ECG, biologie et imagerie. Les <button class="w" data-k="i42-redflags">drapeaux rouges étiologiques (indices qui orientent vers une cause précise)</button> guident les examens ciblés.</li>
<li><b>Intégrer la génétique</b> : l’<button class="w" data-k="i42-variant">analyse génétique (lecture d’un résultat, classes de variants)</button> est recommandée lorsqu’elle éclaire le diagnostic, le pronostic, le choix du traitement, le projet reproductif ou le dépistage génétique des apparentés (classe I, niveau B, ESC 2023), avec un <button class="w" data-k="i42-conseil">conseil génétique (avant et après le test)</button>. Le résultat permet ensuite le dépistage des apparentés.</li></ol>
<h3>4.1 Un exemple de raisonnement</h3>
<p>Un homme de 78 ans a un septum de 17 mm. Le réflexe « hypertrophie hypertensive » est insuffisant. Les drapeaux rouges orientent : il a été opéré d’un canal carpien des deux côtés, son ECG est de bas voltage malgré les parois épaisses, sa troponine est élevée en permanence, et <button class="w" data-k="i42-redflags">son hypertension a disparu</button>. On demande une <button class="w" data-k="i42-scinti">scintigraphie osseuse au DPD (grade de Perugini)</button> et une recherche de protéine monoclonale. La fixation est de grade 3 et aucune protéine monoclonale n’est détectée : le diagnostic d’amylose à transthyrétine est posé sans biopsie. L’analyse du gène <i>TTR</i> distingue ensuite la forme sauvage de la forme héréditaire ; cette dernière impose un dépistage familial.</p>
<h3>4.2 Les phénocopies</h3>
<p>Une <button class="w" data-k="i42-phenocopies">phénocopie (maladie qui imite le phénotype d’une autre)</button> est le piège principal de la CMH. Environ 5 à 10 % des hypertrophies inexpliquées de l’adulte relèvent d’une maladie de surcharge ou infiltrative : amylose, maladie de Fabry, maladie de Danon, variants de <i>PRKAG2</i>, maladies mitochondriales. Leur traitement, leur pronostic et leur transmission sont différents. Chez l’athlète, l’<button class="w" data-k="i42-athlete">adaptation physiologique du cœur d’athlète (critères de distinction)</button> doit être distinguée d’une CMH débutante.</p>

<section class="ilot" id="i42-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse d’une cardiomyopathie a une particularité : elle porte autant sur la famille que sur le patient. Elle suit l’ordre : histoire familiale, antécédents personnels, symptômes, puis histoire de la maladie.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i42-atcd-fam">Histoire familiale sur trois générations (arbre généalogique ciblé)</button></li><li><button class="w" data-k="i42-atcd-sport">Pratique sportive (type, intensité, compétition)</button></li><li><button class="w" data-k="i42-atcd-tox">Toxiques et traitements cardiotoxiques (alcool, chimiothérapie, drogues)</button></li><li>Grossesse récente ou en cours ; hypertension gravidique, car la cardiomyopathie du péripartum survient surtout dans le mois qui suit l’accouchement et partage avec la prééclampsie des facteurs antiangiogéniques</li></ul>
<ul><li><button class="w" data-k="i42-atcd-extra">Atteintes extracardiaques évocatrices (canal carpien, neuropathie, rein, peau)</button></li><li><button class="w" data-k="i42-neuromusc">Maladie neuromusculaire (dystrophies, myotonie)</button></li><li>Myocardite ou syndrome grippal récent : une myocardite peut laisser une cicatrice ou révéler une cardiomyopathie génétique, puisqu’un variant causal est retrouvé chez 8 à 22 % des patients présentant une myocardite aiguë</li><li>Sarcoïdose pulmonaire ou cutanée, car les mêmes granulomes peuvent atteindre le myocarde ; diabète et hypogonadisme (hémochromatose), car le fer se dépose aussi dans le pancréas et l’hypophyse</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="s-dyspnee">Dyspnée d’effort (critères de caractérisation)</button></li><li><button class="w" data-k="i42-s-palp">Palpitations (fibrillation auriculaire, arythmie ventriculaire)</button></li><li><button class="w" data-k="i42-s-angor">Douleur thoracique d’effort à coronaires normales (ischémie microvasculaire)</button></li></ul>
<ul><li><button class="w" data-k="i42-s-syncope">Syncope ou présyncope (effort, post-prandiale, arythmique)</button></li><li>Fatigue, intolérance à l’effort, car le débit cardiaque augmente mal à l’effort lorsque la contraction est affaiblie, le remplissage limité ou la chambre de chasse obstruée</li><li>Œdèmes, prise de poids (forme évoluée ou restrictive) : les pressions de remplissage élevées se transmettent aux veines, et le rein mal perfusé retient le sodium et l’eau</li></ul></div>
<p>Beaucoup de patients sont asymptomatiques. La découverte se fait alors par un ECG d’embauche ou d’aptitude sportive, un souffle, ou le dépistage familial après le diagnostic d’un proche. L’absence de symptôme ne signifie pas l’absence de risque : la mort subite peut être la première manifestation. Le substrat arythmique (désarroi myocytaire et fibrose dans la CMH, remplacement fibro-adipeux dans la CMAVD) peut exister avant toute limitation fonctionnelle.</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>CMH obstructive typique</h4><p>Femme de 52 ans, dyspnée et présyncopes à la montée d’escaliers, aggravées après un repas copieux ou un verre de vin. Souffle systolique qui augmente en se levant. Septum de 21 mm, gradient de 85 mmHg après manœuvre de Valsalva.</p></div>
<div class="card"><h4>CMD d’allure banale, génétique en réalité</h4><p>Homme de 41 ans, dyspnée progressive, FEVG 30 %. Bloc auriculoventriculaire du premier degré ; son père portait un stimulateur cardiaque depuis ses 45 ans. Variant pathogène de <i>LMNA</i> : <button class="w" data-k="i42-cicatrice">le risque rythmique dépasse</button> ce que la FEVG laisse prévoir.</p></div>
<div class="card"><h4>CMAVD révélée par l’effort</h4><p>Coureur de trail de 28 ans, palpitations à l’effort, tachycardie ventriculaire à retard gauche (origine droite). ECG de repos : ondes T négatives de V1 à V3.</p></div>
<div class="card"><h4>Amylose masquée</h4><p>Homme de 82 ans, « ICFEp », hypotension orthostatique, <button class="w" data-k="i42-redflags">intolérance aux antihypertenseurs</button>, canal carpien bilatéral, rupture du tendon du long biceps. L’ECG de bas voltage contraste avec des parois de 16 mm.</p></div></div>
</section>

<section class="ilot" id="i42-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux → anthropométrie → signes ciblés. Il répond à quatre questions : existe-t-il une obstruction, une insuffisance cardiaque, une arythmie, et un signe extracardiaque qui oriente vers une cause ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Pression artérielle couchée puis debout : une <b>hypotension orthostatique</b> évoque une neuropathie autonome (amylose) ou une obstruction aggravée en orthostatisme. Fréquence et régularité du pouls. Poids, taille et surface corporelle, indispensables pour indexer les diamètres et volumes ventriculaires. Traits du visage et petite taille (syndrome de Noonan chez l’enfant et l’adulte jeune).</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Obstruction dynamique (CMH)</b><ul><li><button class="w" data-k="i42-e-souffle">Souffle systolique éjectionnel variable avec les manœuvres (technique)</button></li><li><button class="w" data-k="i42-e-pouls">Pouls carotidien bifide (montée rapide, puis creux)</button></li><li>Choc de pointe étalé, parfois double : l’hypertrophie prolonge la contraction palpable, et une contraction auriculaire vigoureuse dans un ventricule rigide peut se percevoir juste avant</li><li>Souffle d’insuffisance mitrale associé (dirigé vers l’aisselle)</li></ul></div>
<div><b>Insuffisance cardiaque</b><ul><li><button class="w" data-k="e-jugulaire">Turgescence jugulaire et reflux hépato-jugulaire (mesure)</button></li><li><button class="w" data-k="e-b3">Troisième bruit B3 (galop protodiastolique)</button></li><li>Quatrième bruit (ventricule rigide, CMH et amylose) : il naît de la contraction auriculaire qui projette le sang dans un ventricule peu compliant, et disparaît donc en fibrillation auriculaire</li><li>Œdèmes, hépatomégalie, ascite (formes restrictives)</li></ul></div>
<div><b>Arythmie</b><ul><li>Pouls irrégulier (fibrillation auriculaire)</li><li>Bradycardie (bloc auriculoventriculaire : <i>LMNA</i>, sarcoïdose, amylose), car la fibrose, les granulomes ou les dépôts envahissent le tissu de conduction</li></ul></div>
<div><b>Indices étiologiques</b><ul><li><button class="w" data-k="i42-e-extra">Signes extracardiaques (macroglossie, angiokératomes, peau bronzée, faiblesse musculaire)</button></li><li>Neuropathie des membres inférieurs, cicatrices de canal carpien</li><li>Signes d’alcoolisme chronique</li><li>Adénopathies, lésions cutanées de sarcoïdose</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Un examen normal au repos n’exclut pas une CMH obstructive. Environ un tiers des patients n’ont pas d’obstruction au repos mais en développent une debout ou à l’effort. Il faut ausculter en position accroupie, puis debout, et pendant la manœuvre de Valsalva.</div>
<button class="pareto-btn ui" data-k="pareto-i42-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i42-7"><h2><span class="n">7</span>Cardiomyopathie hypertrophique</h2>
<h3>7.1 Diagnostic</h3>
<p>Chez l’adulte, la CMH est définie par une épaisseur de paroi ventriculaire gauche <b>≥ 15 mm</b> dans au moins un segment, mesurée par échocardiographie, IRM ou scanner, non expliquée par les conditions de charge. Le seuil descend à <b>≥ 13 mm</b> chez un apparenté adulte du premier degré d’un patient au diagnostic certain : la probabilité de maladie avant l’examen étant élevée, une épaisseur modérée suffit alors au diagnostic. Chez les autres adultes, une épaisseur de 13 à 14 mm ne suffit pas seule ; elle impose d’intégrer l’histoire familiale, le résultat génétique et l’ECG. Chez l’enfant, l’épaisseur normale varie avec la taille du corps : l’ESC 2023 retient donc un score z (nombre d’écarts types au-dessus de la moyenne prédite pour la surface corporelle) supérieur à 2. Un apparenté dont le score z est inférieur à 2 mais qui présente d’autres anomalies morphologiques ou ECG est suspect, sans que ces anomalies suffisent au diagnostic.</p>
<p>L’hypertrophie est le plus souvent <b>asymétrique</b> et septale. D’autres formes existent : concentrique, médioventriculaire, apicale (ondes T négatives géantes à l’ECG), et la forme avec anévrisme apical, à haut risque rythmique et thromboembolique. L’<button class="w" data-k="i42-irm">IRM (patterns lésionnels)</button> détecte les hypertrophies segmentaires mal vues en échocardiographie (apex, paroi antérolatérale) et quantifie la fibrose.</p>
<h3>7.2 L’obstruction dynamique de la chambre de chasse</h3>
<p>L’<button class="w" data-k="i42-obstruction">obstruction dynamique (mécanisme et variabilité)</button> est définie par un gradient maximal instantané de la chambre de chasse <b>≥ 30 mmHg</b> au repos ou lors d’une provocation. Un gradient <b>≥ 50 mmHg</b> est considéré comme hémodynamiquement significatif : c’est le seuil des traitements invasifs. Le seuil de 30 mmHg repose sur une association pronostique : dans la cohorte de Maron et al. (2003), une obstruction de repos ≥ 30 mmHg doublait le risque de décès lié à la maladie, sans aggravation supplémentaire au-delà. Le seuil de 50 mmHg est celui à partir duquel des modèles reliant gradient et volume d’éjection prédisent un retentissement hémodynamique. Ces seuils ne démontrent pas qu’abaisser le gradient prolonge la vie. Elle concerne environ deux tiers des patients si l’on inclut les formes provoquées.</p>
<p>Le gradient est <b>dynamique</b> : il varie d’un instant à l’autre selon la précharge, la postcharge et la contractilité. Tout ce qui diminue la taille du ventricule ou augmente sa force de contraction le majore. Cette variabilité explique les symptômes post-prandiaux, en orthostatisme, après l’alcool ou lors d’une déshydratation.</p>
<table class="t"><tr><th>Manœuvre ou situation</th><th>Effet sur le ventricule</th><th>Gradient et souffle</th></tr>
<tr><td>Manœuvre de Valsalva (phase de pression)</td><td>Retour veineux ↓, précharge ↓</td><td>↑</td></tr>
<tr><td>Passage accroupi → debout</td><td>Précharge ↓ brutale</td><td>↑</td></tr>
<tr><td>Effort, dobutamine, isoprénaline</td><td>Contractilité ↑, volume ↓</td><td>↑</td></tr>
<tr><td>Dérivés nitrés, vasodilatateurs, repas, alcool, déshydratation</td><td>Précharge et postcharge ↓</td><td>↑</td></tr>
<tr><td>Position accroupie, élévation passive des jambes</td><td>Précharge et postcharge ↑</td><td>↓</td></tr>
<tr><td>Poignée de main soutenue (« handgrip »), phényléphrine</td><td>Postcharge ↑</td><td>↓</td></tr>
<tr><td>Bêtabloquant, inhibiteur de la myosine</td><td>Contractilité ↓, fréquence ↓</td><td>↓</td></tr></table>
<p>Le détail pratique des <button class="w" data-k="i42-manoeuvres">manœuvres de provocation (réalisation et interprétation)</button> est donné en fenêtre. L’ESC 2023 recommande, chez un patient symptomatique dont le gradient de repos est &lt; 50 mmHg, de mesurer le gradient pendant la manœuvre de Valsalva, en position debout, puis lors d’une <b>échocardiographie d’effort</b> si le doute persiste.</p>
<div class="key"><b>Corrélation physiologie → clinique → thérapeutique.</b> La règle se déduit de la physiologie : ce qui remplit le ventricule ou le ralentit améliore l’obstruction, ce qui le vide ou le stimule l’aggrave. Un patient obstructif en hypotension ne reçoit donc ni dobutamine ni dérivé nitré. On lui donne du volume, un vasoconstricteur pur (phényléphrine) et un bêtabloquant. Le <button class="w" data-k="i42-mnemo-obst">moyen mnémotechnique des « trois D » (aide pédagogique)</button> résume les facteurs aggravants.</div>
<h3>7.3 Traitement de l’obstruction symptomatique</h3>
<p>L’objectif est de réduire les symptômes. Aucun traitement de l’obstruction n’a démontré de réduction de la mortalité. La stratégie de l’ESC 2023 est progressive.</p>
<ol><li><b>Mesures générales</b> : hydratation suffisante, repas fractionnés, alcool limité, arrêt des vasodilatateurs et des diurétiques à forte dose si possible.</li>
<li><b>Première ligne</b> : <button class="w" data-k="i42-d-bb">bêtabloquant non vasodilatateur (bisoprolol, métoprolol, propranolol)</button> titré jusqu’à la dose maximale tolérée (classe I). En cas d’intolérance ou de contre-indication : <button class="w" data-k="i42-d-cci">vérapamil ou diltiazem (monographie)</button> (classe I), sauf gradient très élevé ou hypotension, où ils peuvent aggraver l’état hémodynamique par leur effet vasodilatateur.</li>
<li><b>Deuxième ligne</b> si les symptômes persistent : ajout d’un <button class="w" data-k="i42-d-mava">inhibiteur de la myosine cardiaque (mavacamten, aficamten)</button> (mavacamten : classe IIa, ESC 2023 ; en monothérapie si le bêtabloquant, le vérapamil, le diltiazem et le disopyramide sont contre-indiqués ou mal tolérés), ou de <button class="w" data-k="i42-d-diso">disopyramide (antiarythmique inotrope négatif)</button> (classe I en association à un bêtabloquant ou, à défaut, au vérapamil ou au diltiazem ; classe IIb en monothérapie, ESC 2023). Le disopyramide est en règle associé à un bêtabloquant ou à un inhibiteur calcique, car son effet anticholinergique accélère la conduction auriculoventriculaire et transmettrait plus vite une fibrillation auriculaire aux ventricules. Antiarythmique de classe Ia, il impose une surveillance du QTc pendant la titration, avec réduction de dose au-delà de 500 ms ; l’ESC 2023 déconseille de l’associer à un inhibiteur de la myosine, association non étudiée.</li>
<li><b>Réduction septale</b> par <button class="w" data-k="i42-srt">myectomie chirurgicale ou alcoolisation septale (choix et complications)</button>, dans un centre expérimenté, si le gradient reste ≥ 50 mmHg malgré le traitement médical maximal toléré : recommandée en classe NYHA III–IV (classe I) ; à envisager en cas de syncopes d’effort récidivantes (classe IIa) ; peut être envisagée en classe NYHA II, dans un centre expert à faible taux de complications, en cas d’insuffisance mitrale modérée à sévère liée au mouvement systolique antérieur, de fibrillation auriculaire ou de dilatation modérée à sévère de l’oreillette gauche (classe IIb, ESC 2023) : ces complications traduisent le retentissement de l’obstruction sur l’oreillette, mais le bénéfice attendu doit l’emporter sur le risque du geste chez un patient peu limité.</li></ol>
<p>Les inhibiteurs de la myosine ont changé la prise en charge. Dans l’essai <b>EXPLORER-HCM</b> (mavacamten contre placebo), la capacité d’effort et la classe NYHA se sont améliorées, et le gradient a baissé nettement. Dans <b>VALOR-HCM</b>, le mavacamten a évité à la majorité des patients candidats à une réduction septale de devoir y recourir. L’<button class="w" data-k="i42-d-afi">aficamten (monographie)</button> a amélioré la consommation maximale d’oxygène dans <b>SEQUOIA-HCM</b> et s’est montré supérieur au métoprolol en monothérapie dans <b>MAPLE-HCM</b>. Ces molécules exigent une surveillance échocardiographique de la FEVG, car elles peuvent la réduire sous 50 %.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Prescrire un diurétique à forte dose, un dérivé nitré ou un inhibiteur calcique dihydropyridinique (amlodipine) à un patient qui a une CMH obstructive « parce qu’il est dyspnéique ou hypertendu ». Ces médicaments réduisent la précharge ou la postcharge et majorent le gradient ; ils peuvent provoquer une syncope. Chez l’hypertendu obstructif, on privilégie le bêtabloquant et on évite les vasodilatateurs puissants.</div>
<h3>7.4 CMH non obstructive, fibrillation auriculaire et évolution</h3>
<p>Dans la <b>CMH non obstructive</b> symptomatique, le traitement repose sur les bêtabloquants ou les inhibiteurs calciques pour améliorer le remplissage, et sur des diurétiques prudents en cas de congestion, car une petite cavité rigide a besoin d’une précharge suffisante pour maintenir son volume d’éjection. Le mavacamten n’a pas amélioré les critères principaux dans l’essai <b>ODYSSEY-HCM</b> (2025). L’aficamten a amélioré la qualité de vie et la capacité d’effort dans l’essai <b>ACACIA-HCM</b>, présenté en août 2026 ; cette indication n’est pas autorisée à ce jour.</p>
<p>La <b>fibrillation auriculaire</b> est fréquente (environ 20 à 25 % des patients) et mal tolérée, car le ventricule rigide <button class="w" data-k="i42-fa">dépend de la contraction auriculaire</button>. Dans la CMH, une <b>anticoagulation est recommandée dès qu’une fibrillation ou un flutter auriculaire est documenté, quel que soit le score CHA₂DS₂-VASc</b> (classe I, ESC 2023), car ce score sous-estime le risque embolique dans cette maladie. Le maintien du rythme sinusal est souvent recherché.</p>
<p>Environ 5 % des patients évoluent vers une <b>CMH en phase dilatée et hypokinétique</b> (FEVG &lt; 50 %). Le traitement devient celui de l’insuffisance cardiaque à fraction d’éjection réduite (chapitre I50) ; les inhibiteurs de la myosine sont alors arrêtés, car ils réduiraient encore la contractilité d’un ventricule devenu hypokinétique ; une FEVG &lt; 50 % est d’ailleurs leur critère d’interruption. Cette évolution est un marqueur de risque rythmique et une indication d’avis en centre de transplantation.</p>
<p>L’<b>anévrisme apical</b> du ventricule gauche concerne une minorité de patients, surtout dans les formes médioventriculaires obstructives. L’apex, situé en amont de l’obstruction médioventriculaire, subit une pression systolique élevée ; il s’amincit et devient akinétique ou dyskinétique. Il échappe souvent à l’échocardiographie standard : l’IRM ou l’échocardiographie de contraste le détectent. Il expose à deux complications. La première est le thrombus apical, qui justifie une anticoagulation lorsqu’il est présent. La seconde est la tachycardie ventriculaire monomorphe, dont le circuit de réentrée passe par la cicatrice du collet de l’anévrisme. Sa découverte impose une surveillance rythmique rapprochée (Holter, lecture des enregistrements du défibrillateur s’il existe) et une discussion en centre spécialisé ; il n’est pas un modificateur du score de risque dans l’ESC 2023.</p>

</section>

<section class="ilot" id="i42-8"><h2><span class="n">8</span>Urgences, mort subite, défibrillateur et sport</h2>
<div class="alert"><b>Gravité d’abord.</b> Syncope d’effort ou inexpliquée chez un patient porteur d’une cardiomyopathie ; tachycardie ventriculaire soutenue ; arrêt cardiaque réanimé ; bloc auriculoventriculaire de haut degré ; hypotension d’une CMH obstructive ou d’un Tako-tsubo obstructif (ne pas donner d’inotrope ni de dérivé nitré) ; choc cardiogénique d’un Tako-tsubo ou d’une cardiomyopathie du péripartum ; insuffisance cardiaque rapidement progressive avec protéine monoclonale (amylose AL : urgence hématologique). Ces situations imposent un monitorage continu et un avis cardiologique immédiat.</div>
<h3>8.1 Conduite devant une urgence propre aux cardiomyopathies</h3>
<ul><li><b>Arrêt cardiaque ou tachycardie ventriculaire mal tolérée</b> : réanimation et choc électrique externe selon les algorithmes habituels ; puis bilan étiologique complet, dont IRM et génétique ; défibrillateur en prévention secondaire (classe I dans toutes les cardiomyopathies), sauf cause réversible, car le substrat qui a produit l’arythmie (fibrose, désarroi, cicatrice) persiste et expose à la récidive.</li>
<li><b>Hypotension dans une CMH obstructive</b> : remplissage prudent, phényléphrine, bêtabloquant intraveineux ; arrêt des vasodilatateurs et des inotropes.</li>
<li><b>Fibrillation auriculaire rapide dans une CMH ou une amylose</b> : cardioversion rapide si mauvaise tolérance ; contrôle de fréquence par bêtabloquant, à faible dose dans l’amylose, où le débit dépend de la fréquence ; anticoagulation sans calcul de score.</li>
<li><b>Bloc auriculoventriculaire complet chez un adulte de moins de 60 ans</b> : chercher une sarcoïdose cardiaque ou un variant de <i>LMNA</i> avant de conclure à une dégénérescence du tissu de conduction ; ces causes orientent vers <button class="w" data-k="i42-cicatrice">un défibrillateur plutôt qu’un simple stimulateur</button>.</li></ul>
<h3>8.2 Mort subite dans la cardiomyopathie hypertrophique</h3>
<p>Le risque annuel moyen de mort subite dans la CMH est faible (inférieur à 1 % par an chez l’adulte), mais il est concentré chez certains patients, souvent jeunes. L’ESC 2023 recommande d’évaluer ce risque au diagnostic, puis tous les un à deux ans ou lors de tout changement clinique. L’outil principal est le <button class="w" data-k="i42-hcmrisk">score HCM Risk-SCD (formule, variables, seuils)</button>, validé à partir de 16 ans. Il estime le risque de mort subite à cinq ans à partir de sept variables : âge, épaisseur maximale de paroi, diamètre de l’oreillette gauche, gradient maximal de la chambre de chasse, histoire familiale de mort subite, tachycardie ventriculaire non soutenue au Holter, syncope inexpliquée.</p>
<table class="t"><tr><th>Risque à 5 ans (HCM Risk-SCD)</th><th>Défibrillateur en prévention primaire (ESC 2023)</th></tr>
<tr><td>≥ 6 %</td><td>À envisager (classe IIa)</td></tr>
<tr><td>4 à &lt; 6 %</td><td>Peut être envisagé (classe IIb)</td></tr>
<tr><td>&lt; 4 %</td><td>En règle non indiqué</td></tr></table>
<p>Chez le patient à risque faible (&lt; 4 %), deux marqueurs peuvent faire envisager le défibrillateur selon l’ESC 2023 (classe IIb) : une fibrose étendue à l’IRM (rehaussement tardif ≥ 15 % de la masse ventriculaire gauche) et une FEVG &lt; 50 %. La fibrose forme le substrat des circuits de réentrée, et une FEVG abaissée traduit une perte étendue de myocarde. L’ESC 2023 reconnaît toutefois que leur valeur ajoutée au score n’est pas établie par des données robustes : ils servent à une décision partagée, y compris dans le groupe intermédiaire, où le défibrillateur peut déjà être envisagé. L’anévrisme apical, retenu par les recommandations américaines, n’est pas un modificateur dans le texte européen ; il justifie cependant une surveillance rythmique et une discussion de l’anticoagulation.</p>
<p>Chez l’enfant de moins de 16 ans, on utilise le score HCM Risk-Kids. Dans tous les cas, la décision est partagée : le patient doit comprendre les bénéfices, les chocs inappropriés, les complications des sondes et les conséquences sur la conduite automobile.</p>
<h3>8.3 Mort subite dans les autres cardiomyopathies</h3>
<p>Dans la <b>CMD et la CMNDVG</b>, <button class="w" data-k="i42-cicatrice">la FEVG seule stratifie mal le risque</button>. L’ESC 2023 intègre la génétique et l’IRM. Un <button class="w" data-k="i42-dai">défibrillateur automatique implantable (indications propres aux cardiomyopathies)</button> est à envisager dans les situations suivantes :</p>
<ul><li>FEVG ≤ 35 % malgré au moins trois mois de traitement optimal (classe IIa). Dans l’essai DANISH, le défibrillateur a réduit de moitié la mort subite (4,3 % contre 8,2 %) sans réduire la mortalité totale (21,6 % contre 23,4 %, différence non significative), car une grande part des décès relevait de l’insuffisance cardiaque ou d’autres causes, qu’il ne prévient pas ; le bénéfice paraissait limité aux patients les plus jeunes dans une analyse de sous-groupe ;</li>
<li>variant de <i>LMNA</i> avec un risque estimé ≥ 10 % à cinq ans par le <button class="w" data-k="i42-lmna">calculateur de risque des laminopathies (variables et seuil)</button> et une tachycardie ventriculaire non soutenue, une FEVG &lt; 50 % ou un trouble de conduction auriculoventriculaire (classe IIa, recommandations ESC 2022 sur les arythmies ventriculaires) ; l’ESC 2023 utilise le même calculateur sans fixer de seuil, car il surestime le risque, et privilégie la décision partagée ;</li>
<li>autre génotype à haut risque du tableau 21 de l’ESC 2023 (variants tronquants de <i>FLNC</i>, variants de <i>TMEM43</i>, <i>PLN</i>, <i>DSP</i> ou <i>RBM20</i>) avec une FEVG &gt; 35 % et des facteurs de risque propres au gène, le plus souvent un rehaussement tardif à l’IRM ou une FEVG &lt; 45 % (classe IIa) ; sans facteur additionnel, le défibrillateur peut être envisagé (classe IIb).</li></ul>
<p>Dans la <b>CMAVD</b>, le défibrillateur est discuté en fonction d’une tachycardie ventriculaire soutenue, d’une syncope arythmique, d’une dysfonction ventriculaire sévère et du calculateur de risque propre à cette maladie (îlot 10).</p>
<h3>8.4 Défibrillateur : quel dispositif ?</h3>
<p>Le défibrillateur <b>sous-cutané</b>, sans sonde endovasculaire, convient au sujet jeune sans besoin de stimulation antibradycardique ni de stimulation antitachycardique. Le défibrillateur <b>transveineux</b> est préféré si une stimulation est nécessaire (bloc auriculoventriculaire, <i>LMNA</i>, sarcoïdose) ou si des tachycardies ventriculaires monomorphes peuvent être interrompues par stimulation. Le <b>défibrillateur portable</b> (gilet) sert de protection temporaire lorsque la fonction peut récupérer : cardiomyopathie du péripartum, myocardite, CMD récente.</p>
<h3>8.5 Sport</h3>
<p>Le sport est bénéfique pour la santé globale, et une interdiction générale n’est plus justifiée. Dans un essai randomisé de 136 patients atteints de CMH, 16 semaines d’entraînement d’intensité modérée ont augmenté la consommation maximale d’oxygène de 1,27 mL/kg/min de plus que l’activité habituelle, sans arythmie soutenue, choc ni décès. À l’inverse, la sédentarité accumule les facteurs de risque d’athérosclérose, qui aggravent le pronostic. L’ESC 2023, en continuité avec les recommandations ESC 2020 de cardiologie du sport, individualise la décision (<button class="w" data-k="i42-esc-2026-comparaison">ESC 2026 : réadaptation et entraînement</button>).</p>
<table class="t"><tr><th>Situation</th><th>Position (ESC 2023 et ESC 2020)</th></tr>
<tr><td>CMH, toute forme</td><td>Activité d’intensité faible à modérée recommandée pour tous</td></tr>
<tr><td>CMH à faible risque, sans obstruction au repos ni à l’effort, sans arythmie à l’effort</td><td>Activité intense et compétition peuvent être envisagées après évaluation experte (classe IIb)</td></tr>
<tr><td>CMH à risque élevé, syncope, obstruction importante</td><td>Pas de sport de compétition intense</td></tr>
<tr><td>CMAVD, y compris porteur sain d’un variant desmosomal</td><td>Exercice d’intensité modérée ou élevée, y compris de compétition, non recommandé chez le patient atteint (classe III) ; chez le porteur sans phénotype, éviter l’intensité élevée peut être envisagé (classe IIb), car l’effort accélère la maladie</td></tr>
<tr><td>CMD ou CMNDVG</td><td>Selon la FEVG, la fibrose, les arythmies à l’effort et le génotype ; déconseillé en cas de variant de <i>LMNA</i> ou de <i>FLNC</i> à haut risque</td></tr>
<tr><td>Porteur d’un défibrillateur</td><td>Sport possible selon la maladie sous-jacente, après évaluation ; éviter les sports de contact sur la loge</td></tr></table>
<p>Le détail de l’évaluation est présenté dans la fenêtre <button class="w" data-k="i42-sport">sport et cardiomyopathies (évaluation, dépistage, interprétation de l’ECG de l’athlète)</button>.</p>
<div class="trap"><span class="k">Piège</span>Autoriser la reprise d’une compétition chez un athlète dont la CMAVD n’est pas encore exprimée mais qui porte un variant pathogène de <i>PKP2</i>. Chez ces porteurs, l’endurance intense accélère l’apparition de la maladie : les athlètes d’endurance porteurs de variants desmosomaux avaient leurs premiers symptômes plus tôt et plus de tachycardies ventriculaires (James et al., 2013). L’ESC 2023 propose donc d’envisager la restriction avant même le phénotype (classe IIb), dans une décision partagée.</div>
