<section class="ilot" id="r02-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 72 ans, diabétique de type 2 depuis 18 ans, ancien fumeur, consulte aux urgences. Son deuxième orteil droit est devenu noir, sec et indolore il y a trois semaines. Depuis deux jours, le dos du pied est rouge, gonflé et chaud sur 6 cm, et un liquide malodorant s’écoule à la base de l’orteil. Sa température atteint 38,6 °C, sa fréquence cardiaque 104/min, sa fréquence respiratoire 22/min ; les leucocytes sont à 15,8 G/L et la protéine C-réactive à 186 mg/L. Les pouls du pied ne sont pas perçus. L’index de pression systolique cheville-bras vaut 1,35, alors que la pression transcutanée en oxygène du dos du pied est de 18 mmHg.</p>
<p>Quatre questions organisent tout le chapitre. <b>La gangrène est-elle sèche, humide ou gazeuse ? La vie du patient est-elle menacée avant même le membre ? Quel est le mécanisme, ischémique, infectieux ou mixte ? Dans quel ordre faut-il drainer, traiter l’infection, revasculariser et éventuellement amputer ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait distinguer les trois formes de gangrène et reconnaître une urgence chirurgicale. Il sait aussi stadifier un membre menacé par la classification <button class="w" data-k="r02-wifi">WIfI (plaie, ischémie, infection)</button>, classer une infection du pied diabétique selon l’<button class="w" data-k="r02-iwgdf-class">IWGDF/IDSA 2023 (quatre grades)</button> et choisir une antibiothérapie probabiliste justifiée. Enfin, il sait expliquer pourquoi la revascularisation précède le plus souvent l’amputation définitive. Le terme de code R02 est un code de symptôme. Le cours explique donc aussi comment le codage oriente vers la maladie causale.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="r02-necrose">nécrose de coagulation et la nécrose de liquéfaction (deux morts cellulaires différentes)</button>, l’<button class="w" data-k="r02-do2">apport tissulaire en oxygène (débit sanguin × contenu artériel en oxygène)</button> et la <button class="w" data-k="r02-medialcalc">calcification de la média (artère incompressible au brassard)</button>. L’artériopathie elle-même est enseignée dans le cours <a href="#/entry/I70">I70 — Athérosclérose périphérique, artériopathie des membres inférieurs et ischémie aiguë</a> ; les autres maladies vasculaires périphériques relèvent de <a href="#/entry/I73">I73 — Autres maladies vasculaires périphériques</a>. Ce chapitre ne les répète pas : il traite la gangrène, c’est-à-dire la mort tissulaire constituée, et sa prise en charge.</div>
</section>

<section class="ilot" id="r02-1"><h2><span class="n">1</span>Définitions, codage et classifications</h2>
<p>La <b>gangrène</b> est une nécrose tissulaire étendue, visible à l’œil nu, d’un segment de membre ou d’un organe. Normalement, chaque cellule reçoit par la microcirculation l’oxygène et le glucose qui maintiennent son gradient ionique membranaire. Lorsque cet apport s’interrompt assez longtemps, la cellule ne produit plus assez d’adénosine triphosphate : ses pompes s’arrêtent, elle gonfle et ses membranes se rompent. La gangrène correspond à la mort de tout un territoire, et non de quelques cellules isolées. Elle n’est donc pas une maladie en soi : c’est l’aboutissement visible d’une ischémie, d’une infection, d’une agression thermique ou toxique, ou de leur combinaison.</p>
<h3>1.1 Trois formes cliniques</h3>
<p>La distinction clinique utile oppose trois formes, parce qu’elles n’ont ni le même risque vital ni la même urgence. La question à se poser devant un tissu noir est simple : la nécrose reste-t-elle sèche et limitée, ou est-elle envahie par des bactéries qui la liquéfient et diffusent ?</p>
<table class="t"><tr><th>Forme</th><th>Mécanisme dominant</th><th>Aspect</th><th>Évolution spontanée</th><th>Urgence</th></tr>
<tr><td><button class="w" data-k="r02-seche">Gangrène sèche (momification)</button></td><td>Ischémie artérielle lente, sans infection</td><td>Noire, dure, froide, ratatinée, inodore ; sillon de délimitation net</td><td>Délimitation puis autoamputation possible en semaines</td><td>Relative : bilan vasculaire en jours</td></tr>
<tr><td><button class="w" data-k="r02-humide">Gangrène humide (surinfection)</button></td><td>Ischémie surinfectée par une flore polymicrobienne</td><td>Tuméfiée, suintante, malodorante, bords inflammatoires, extension</td><td>Diffusion aux gaines tendineuses, sepsis</td><td>Haute : drainage et antibiotiques en heures</td></tr>
<tr><td><button class="w" data-k="r02-gazeuse">Gangrène gazeuse (myonécrose clostridienne)</button></td><td>Toxines de <i>Clostridium</i> détruisant le muscle sain</td><td>Douleur intense, peau bronzée ou violacée, bulles hémorragiques, crépitation</td><td>Choc et décès en quelques heures sans chirurgie</td><td>Extrême : chirurgie immédiate</td></tr></table>
<p>Ce tableau se lit de gauche à droite : le mécanisme explique l’aspect, qui annonce l’évolution et donc l’urgence. L’erreur fréquente consiste à confondre noirceur et gravité. Un orteil complètement noir et sec peut attendre quelques jours le bilan vasculaire ; une rougeur qui progresse de quelques centimètres en une nuit autour d’une petite plaie ne le peut pas. Chez le patient du cas fil rouge, l’orteil était sec trois semaines auparavant ; l’œdème, la rougeur, l’écoulement malodorant et la fièvre signent la transformation en gangrène humide.</p>
<div class="trap"><span class="k">Piège</span>La crépitation sous-cutanée et le gaz radiologique ne signent pas à eux seuls une gangrène gazeuse clostridienne. Chez le diabétique, des entérobactéries et des anaérobies non clostridiens produisent aussi du gaz dans une infection du pied. La myonécrose clostridienne se distingue par une douleur disproportionnée, une atteinte du muscle et une évolution vers le choc en quelques heures. Les deux situations imposent toutefois une exploration chirurgicale urgente.</div>
<h3>1.2 Ce que recouvre le code R02</h3>
<p>Dans la <button class="w" data-k="r02-codage">CIM-10-GM 2024 (règles d’inclusion et d’exclusion de R02)</button>, R02 appartient au bloc des symptômes et signes de l’appareil circulatoire. Il n’est utilisé que lorsque la gangrène n’est pas attribuée à une cause classée ailleurs. La classification exclut explicitement la gangrène au cours de l’athérosclérose (I70.25), des autres maladies vasculaires périphériques (I73.-), du diabète sucré (E10–E14 avec le quatrième caractère .5) et la gangrène gazeuse (A48.0). Elle exclut aussi la pyodermite gangréneuse (L88) et l’ulcère de décubitus (L89.-). R02 inclut en revanche la nécrose post-traumatique de la peau et du tissu sous-cutané.</p>

<p>Le tableau montre que R02 est un code d’attente ou de mécanisme local. Dans la pratique hospitalière, le médecin code d’abord la cause dès qu’elle est démontrée. L’erreur fréquente consiste à garder R02.8 après un bilan qui a prouvé une artériopathie ; le séjour est alors mal décrit et la maladie causale disparaît des statistiques. Le patient du cas fil rouge relève, après bilan, du diabète avec complication vasculaire périphérique et de l’athérosclérose avec gangrène, et non de R02.</p>
<h3>1.3 Classifications de gravité</h3>
<p>Trois classifications sont utiles, chacune pour une question différente. La <button class="w" data-k="r02-wifi">classification WIfI</button> de la Society for Vascular Surgery, reprise par les Global Vascular Guidelines 2019 (<button class="w" data-k="r02-gvg">GVG</button>), estime le risque d’amputation majeure à un an en combinant la plaie, l’ischémie et l’infection. La <button class="w" data-k="r02-iwgdf-class">classification IWGDF/IDSA</button> gradue l’infection du pied diabétique de 1 à 4 et décide de l’hospitalisation et de l’antibiothérapie. La classification de <button class="w" data-k="r02-fontaine">Leriche et Fontaine</button> place la gangrène au stade IV de l’artériopathie ; elle reste utilisée par la CIM-10-GM, mais ne mesure ni l’ischémie ni l’infection. Le terme d’<button class="w" data-k="r02-clti">ischémie chronique menaçant le membre (CLTI)</button> remplace celui d’« ischémie critique » depuis les GVG 2019, parce que la menace dépend d’un continuum et non d’un seuil unique.</p>
<div class="key"><b>À retenir.</b> La gangrène est une nécrose constituée : sèche quand l’ischémie agit seule, humide quand une infection la liquéfie, gazeuse quand des toxines clostridiennes détruisent le muscle. R02 ne s’emploie qu’en l’absence de cause classée ailleurs. WIfI stadifie le membre, l’IWGDF/IDSA l’infection du pied diabétique. La partie suivante quantifie le pronostic qui justifie cette rigueur.</div>
</section>

<section class="ilot" id="r02-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La gangrène des membres inférieurs est, dans les pays à haut revenu, surtout la conséquence d’une artériopathie athéroscléreuse, souvent associée au diabète. Ses deux issues redoutées sont l’amputation majeure, c’est-à-dire au-dessus de la cheville, et le décès. Le décès est fréquent, parce que les mêmes artères athéroscléreuses irriguent le cœur et le cerveau.</p>
<p>Les données suisses disponibles sont régionales. À Genève, où toutes les amputations sont réalisées dans un seul centre, <button class="w" data-k="r02-geneve">l’incidence des amputations majeures des membres inférieurs</button> était de 10,02 pour 100 000 habitants et par an entre 1990 et 2010. Le diabète multipliait le risque relatif d’amputation par 20, et un âge de 65 ans ou plus par 9 (Carmona et al., <i>Revue médicale suisse</i> 2014). L’incidence a diminué au cours de la période et l’âge à l’amputation a augmenté ; les auteurs l’attribuent aux programmes de prévention lancés dès les années 1980. Chez les patients amputés de plus de 65 ans de la même cohorte, 48 % étaient diabétiques, plus de 94 % avaient une artériopathie sévère, la mortalité à deux ans atteignait 47 % et seuls 53 % ont pu être appareillés (Carmona et al., <i>Diabetes &amp; Metabolism</i> 2005).</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre national suisse de la gangrène ni des amputations publié avec une incidence consolidée. Les chiffres cités proviennent d’une cohorte genevoise. Ils ne sont pas extrapolables tels quels à toute la Suisse, car la prévalence du diabète, l’âge et l’accès aux centres vasculaires varient entre régions.</div>
<p>À l’échelle internationale, les GVG 2019 rapportent une méta-analyse de 13 études et 1 527 patients atteints d’ischémie chronique menaçant le membre non revascularisée. Sur un suivi médian de 12 mois, la mortalité et le taux d’amputation par patient atteignaient chacun 22 %. Les GVG signalent aussi qu’environ la moitié des patients qui se présentent avec une CLTI n’avaient aucun antécédent connu d’artériopathie. La gangrène est donc souvent la porte d’entrée dans la maladie vasculaire, ce qui impose de chercher l’atteinte coronaire et carotidienne associée.</p>
<p>La gangrène gazeuse clostridienne et les infections nécrosantes des tissus mous sont rares, mais leur mortalité reste élevée même traitées, parce que le choc et les défaillances d’organes s’installent en quelques heures. Aucune incidence suisse consolidée n’a été trouvée pour ces infections.</p>
<div class="key"><b>À retenir.</b> En Suisse, les données genevoises montrent un risque d’amputation majeure multiplié par 20 chez le diabétique et une mortalité de 47 % à deux ans après amputation chez le sujet âgé. Une CLTI non revascularisée expose à 22 % de décès et 22 % d’amputations en un an environ. La partie suivante explique comment un tissu passe de l’ischémie à la nécrose sèche, humide ou gazeuse.</div>
</section>

<section class="ilot" id="r02-3"><h2><span class="n">3</span>Physiopathologie : sèche, humide, gazeuse</h2>
<p>Le fonctionnement normal sert de point de départ. Au repos, la peau et le muscle du pied reçoivent un débit faible mais suffisant, parce que leur consommation d’oxygène est basse. L’<button class="w" data-k="r02-do2">apport en oxygène</button> dépend du débit local et du contenu artériel en oxygène. Le débit local dépend lui-même de la pression de perfusion en aval des sténoses et de la résistance des artérioles. Quand une sténose réduit la pression de perfusion, les artérioles se dilatent pour maintenir le débit : c’est l’<button class="w" data-k="r02-autoreg">autorégulation (réserve vasodilatatrice)</button>. La gangrène survient lorsque cette réserve est épuisée et que la pression de perfusion ne suffit plus aux besoins du tissu.</p>
<h3>3.1 De l’ischémie à la nécrose sèche</h3>
<p>Dans l’ischémie chronique, la réserve s’épuise d’abord à l’effort, ce qui donne la claudication, puis au repos. La douleur de décubitus apparaît la nuit, parce que la position couchée supprime la contribution de la pesanteur à la pression de perfusion du pied. Le patient soulage sa douleur en laissant pendre la jambe. Lorsque la pression d’orteil descend sous environ 30 mmHg, la cicatrisation devient improbable et la moindre plaie s’étend. Le tissu le plus distal meurt en premier, parce qu’il est le plus éloigné de la source de pression. Sans bactéries, les cellules mortes subissent une <button class="w" data-k="r02-necrose">nécrose de coagulation</button> : leurs protéines dénaturées conservent la forme du tissu, qui se dessèche et noircit par dégradation de l’hémoglobine. Une réaction inflammatoire se forme à la limite du tissu vivant : c’est le <button class="w" data-k="r02-sillon">sillon de délimitation</button>.</p>
<h3>3.2 De la nécrose sèche à la gangrène humide</h3>
<p>Un tissu mort ne reçoit ni anticorps, ni leucocytes, ni antibiotiques, puisqu’il n’est plus perfusé. Des bactéries de la peau ou de l’environnement y prolifèrent sans résistance, puis leurs enzymes et celles des polynucléaires liquéfient la nécrose. L’infection augmente la consommation d’oxygène des tissus encore vivants autour de la nécrose. Elle provoque aussi un œdème qui élève la pression tissulaire et éloigne les cellules des capillaires. Elle entraîne enfin des thromboses des petits vaisseaux enflammés. Ces trois effets aggravent une ischémie déjà limite : <b>l’infection étend la nécrose, et la nécrose nourrit l’infection</b>. Ce cercle explique pourquoi une gangrène humide progresse en heures et pourquoi le drainage chirurgical précède la revascularisation.</p>
<h3>3.3 La gangrène gazeuse : une destruction par toxines</h3>
<p>La myonécrose clostridienne suit une autre logique. Les spores de <button class="w" data-k="r02-clostridium"><i>Clostridium perfringens</i> et espèces voisines (bactéries anaérobies sporulées)</button> germent dans un tissu dévitalisé, pauvre en oxygène, par exemple une plaie profonde contuse ou un muscle ischémique. La bactérie sécrète une <button class="w" data-k="r02-toxine-alpha">toxine alpha (phospholipase C)</button> qui détruit les membranes cellulaires. Cette toxine agrège aussi plaquettes et leucocytes dans les vaisseaux, ce qui occlut la microcirculation. La nécrose progresse donc dans un muscle qui était sain, sans attendre l’ischémie préalable. Les leucocytes restent bloqués dans les vaisseaux et sont rares dans le tissu nécrosé, ce qui explique l’absence de pus. Les toxines diffusées dans la circulation provoquent une hémolyse, une dépression myocardique et une vasodilatation : le choc s’installe en quelques heures.</p>
<p>La figure présente les trois chaînes à partir du même tissu normal. Elle se lit de haut en bas : le mécanisme initial détermine la forme de la nécrose, puis sa conséquence clinique.</p>

<p>La lecture de la figure enseigne deux points pratiques. La colonne de gauche dépend du débit : seule une revascularisation la corrige. Les colonnes du milieu et de droite dépendent des bactéries et de leurs toxines : elles exigent l’excision chirurgicale du tissu mort, car l’antibiotique n’atteint pas un tissu non perfusé. L’erreur fréquente consiste à traiter une gangrène humide par antibiotiques seuls, en espérant éviter l’intervention.</p>
<h3>3.4 Particularités du pied diabétique</h3>
<p>Le diabète ajoute trois mécanismes. La <button class="w" data-k="r02-neuropathie">neuropathie sensitive, motrice et autonome</button> supprime la douleur d’alerte, déforme le pied et assèche la peau, si bien qu’une plaie évolue sans être sentie. L’athérosclérose du diabétique touche surtout les artères de jambe et du pied, ce qui laisse peu de cibles pour un pontage. La <button class="w" data-k="r02-medialcalc">calcification de la média</button> rend les artères incompressibles et fausse l’index de pression cheville-bras vers le haut, comme chez le patient du cas fil rouge. L’hyperglycémie altère enfin la fonction des polynucléaires, ce qui facilite l’infection.</p>
<div class="key"><b>À retenir.</b> La gangrène sèche résulte d’une pression de perfusion insuffisante ; la gangrène humide d’une infection qui liquéfie la nécrose et aggrave l’ischémie ; la gangrène gazeuse de toxines qui tuent un muscle sain. Le tissu mort n’est atteint ni par les défenses ni par les antibiotiques : il s’excise. La partie suivante recense les causes qui mènent à ces trois voies.</div>
</section>

<section class="ilot" id="r02-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Devant une gangrène, l’étiologie détermine le traitement et le code. Les causes se regroupent selon le niveau vasculaire atteint, parce que ce niveau prédit la topographie de la nécrose. Une occlusion d’une grosse artère produit une nécrose distale étendue en territoire. Une atteinte des petites artères ou des capillaires produit des nécroses digitales multiples, souvent symétriques, avec des pouls parfois conservés.</p>
<table class="t"><tr><th>Niveau atteint</th><th>Causes</th><th>Indice clinique</th><th>Code habituel</th></tr>
<tr><td>Grosses et moyennes artères, chronique</td><td>Athérosclérose, souvent associée au diabète</td><td>Fumeur, claudication ou douleur de décubitus, pouls absents</td><td>I70.25 ; diabète E10–E14 .5</td></tr>
<tr><td>Grosses artères, aigu</td><td><button class="w" data-k="r02-ischemie-aigue">Embolie, thrombose aiguë (ischémie aiguë de membre)</button></td><td>Début brutal, membre froid et pâle, fibrillation auriculaire</td><td>I74 (cours I70)</td></tr>
<tr><td>Petites artères inflammatoires</td><td><button class="w" data-k="r02-buerger">Thromboangéite oblitérante (Buerger)</button>, vascularites</td><td>Fumeur de moins de 45 ans, atteinte des mains et des pieds</td><td>I73.1 ; vascularites M30–M31</td></tr>
<tr><td>Vasospasme et microcirculation</td><td>Phénomène de Raynaud secondaire, <button class="w" data-k="r02-vasopresseurs">gangrène périphérique symétrique sous vasopresseurs</button>, <button class="w" data-k="r02-ergot">ergotisme</button>, cocaïne</td><td>Atteinte digitale bilatérale, contexte de choc ou de médicament</td><td>I73.0 ; R02.8 si non classée</td></tr>
<tr><td>Thrombose microvasculaire</td><td><button class="w" data-k="r02-purpura">Purpura fulminans, coagulation intravasculaire disséminée</button>, <button class="w" data-k="r02-tih">gangrène veineuse de la thrombopénie induite par l’héparine</button>, emboles de cholestérol</td><td>Purpura nécrotique, thrombopénie, geste endovasculaire récent</td><td>Selon la cause</td></tr>
<tr><td>Artérioles calcifiées</td><td><button class="w" data-k="r02-calciphylaxie">Calciphylaxie</button></td><td>Dialysé, livedo douloureux puis nécrose des cuisses ou de l’abdomen</td><td>Selon la cause</td></tr>
<tr><td>Agression physique</td><td>Gelure, brûlure, compression prolongée, traumatisme</td><td>Contexte évident, délai d’apparition</td><td>T33–T35 ; R02.0- pour la nécrose post-traumatique</td></tr>
<tr><td>Infection primitive</td><td>Myonécrose clostridienne, <button class="w" data-k="r02-nsti">infection nécrosante des tissus mous</button></td><td>Douleur disproportionnée, progression en heures</td><td>A48.0 ; selon la forme</td></tr></table>
<p>Ce tableau se lit par l’indice clinique, qui oriente avant tout examen. L’erreur fréquente est d’attribuer d’emblée une nécrose digitale à l’athérosclérose chez un patient âgé. Des nécroses des deux mains chez un patient de réanimation sous noradrénaline relèvent pourtant d’un vasospasme et d’une coagulopathie, et non d’une sténose. De même, des orteils bleus chez un patient aux pouls conservés, quelques jours après une coronarographie, évoquent des emboles de cholestérol.</p>
<h3>4.1 Facteurs de risque de gangrène ischémique</h3>
<p>Les facteurs de risque de l’artériopathie sont détaillés dans le cours I70. Ceux qui font passer une artériopathie à la gangrène sont plus spécifiques. Le <b>diabète</b> multiplie le risque d’amputation par 20 dans la cohorte genevoise, par la neuropathie, l’atteinte distale et l’infection. Le <b>tabagisme actif</b> entretient la thrombose et le vasospasme ; il est la cause directe de la maladie de Buerger. L’<b>insuffisance rénale chronique</b>, surtout dialysée, ajoute la calcification de la média et la calciphylaxie. Une <b>plaie négligée</b>, une chaussure inadaptée ou une pédicure traumatique sont les déclencheurs habituels, parce qu’une plaie double les besoins locaux en oxygène que l’artère ne peut plus fournir.</p>
<div class="key"><b>À retenir.</b> La topographie oriente : nécrose distale d’un seul membre aux pouls absents pour l’athérosclérose ; nécroses digitales multiples et symétriques pour une atteinte de la microcirculation ou un vasospasme. Le diabète, le tabac et la dialyse sont les grands accélérateurs. La partie suivante explique comment l’anamnèse distingue ces causes.</div>

<section class="ilot" id="r02-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse répond à trois questions : depuis quand la nécrose existe-t-elle, comment a-t-elle évolué dans les dernières heures, et quel terrain l’explique ? La rapidité d’évolution est l’information la plus discriminante, car elle sépare la gangrène sèche stable des formes infectieuses qui menacent la vie.</p>
<h3>5.1 Antécédents et contexte</h3>
<p>Le médecin recherche d’abord le <button class="w" data-k="r02-atcd-vasc">passé vasculaire (claudication, revascularisations, infarctus, accident vasculaire cérébral)</button>, parce qu’une gangrène est souvent la première manifestation d’une artériopathie diffuse. Il précise le <button class="w" data-k="r02-atcd-diab">diabète (durée, équilibre, neuropathie connue, plaies antérieures)</button> et le statut tabagique. Il interroge sur la dialyse, une anticoagulation récente par héparine ou antivitamine K, un séjour en réanimation sous vasopresseurs, et les médicaments vasoconstricteurs, dont les dérivés de l’ergot et les triptans. Il demande enfin la consommation de cocaïne, l’exposition au froid, un traumatisme récent et le statut vaccinal antitétanique.</p>
<h3>5.2 Symptômes par fréquence</h3>
<p>Le premier symptôme est souvent un <button class="w" data-k="r02-changement-couleur">changement de couleur d’un orteil (pâleur, cyanose, puis noirceur)</button>, remarqué par le patient ou un proche. La <button class="w" data-k="r02-douleur-decubitus">douleur ischémique de décubitus</button> précède la nécrose chez le non-diabétique ; elle manque souvent chez le diabétique neuropathe. L’<b>odeur</b> et l’<b>écoulement</b> signalent une surinfection. La <b>fièvre</b> et les frissons indiquent une diffusion systémique. Une <button class="w" data-k="r02-douleur-disprop">douleur disproportionnée à l’aspect cutané</button> est le symptôme d’alarme des infections nécrosantes et de la gangrène gazeuse, car la nécrose profonde précède les signes de surface.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Un patient diabétique et artéritique signale un orteil devenu noir en quelques semaines après une petite blessure non sentie. La nécrose est sèche et bien limitée. Il se plaint de douleurs nocturnes modérées, ou d’aucune douleur en raison de la neuropathie. Il n’a ni fièvre ni rougeur extensive.</p></div>
<div class="card"><h4>Forme humide</h4><p>Le même patient rapporte depuis 24 à 48 heures un gonflement du pied, une rougeur qui s’étend, un écoulement malodorant et parfois de la fièvre. Une glycémie qui se déséquilibre sans autre cause est souvent le premier signe d’infection chez le diabétique.</p></div>
<div class="card"><h4>Forme gazeuse</h4><p>Quelques heures à quelques jours après une plaie profonde contuse, une chirurgie digestive ou une injection, le patient décrit une douleur intense, croissante, sans commune mesure avec l’aspect de la peau. Il paraît anxieux, puis confus. Une forme spontanée survient sans plaie chez un patient porteur d’un cancer colique ou neutropénique.</p></div>
<div class="card"><h4>Forme microvasculaire</h4><p>Le patient, souvent hospitalisé, présente des extrémités violacées puis noires aux deux mains et aux deux pieds, avec des pouls parfois perçus. Le contexte est un choc sous noradrénaline, un purpura fébrile, une héparinothérapie avec chute des plaquettes, ou une prise de dérivé de l’ergot associée à un inhibiteur enzymatique.</p></div></div>
<p>Ces quatre cartes se lisent par la vitesse et la symétrie. Une forme unilatérale lente oriente vers l’artère, une forme rapide et douloureuse vers l’infection, une forme symétrique vers la microcirculation. Le piège classique est la forme humide du diabétique neuropathe : la douleur manque, la fièvre manque souvent, et seule l’hyperglycémie inexpliquée ou l’odeur alerte.</p>
<div class="key"><b>À retenir.</b> L’anamnèse date la nécrose, mesure la vitesse d’évolution des dernières heures et identifie le terrain. Une douleur disproportionnée impose d’évoquer une infection nécrosante ; un déséquilibre glycémique inexpliqué évoque une infection chez le diabétique. L’examen clinique confirme ensuite la forme et la gravité.</div>
</section>

<section class="ilot" id="r02-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel, mais l’état général et les signes vitaux passent avant le pied. Le risque immédiat est en effet le sepsis, et non la perte de l’orteil. Le pied s’examine ensuite chaussures et bas retirés, des deux côtés, avec une lampe et un stylet stérile.</p>
<div class="two">
<div class="card"><h4>État général et signes vitaux</h4><p>Le médecin note la conscience, la température, la fréquence cardiaque, la fréquence respiratoire, la pression artérielle et la saturation. Il compte les <button class="w" data-k="r02-sirs">critères du syndrome de réponse inflammatoire systémique (définition IWGDF/IDSA)</button>, parce que deux critères ou plus classent l’infection du pied comme sévère (grade 4). Il recherche une hypotension, des marbrures et une confusion, qui signent un sepsis avec défaillance d’organe selon le cours <a href="#/entry/A41">A41 — Sepsis et choc septique de l’adulte</a>.</p></div>
<div class="card"><h4>Inspection du pied</h4><p>La couleur, la limite de la nécrose, la présence d’un <button class="w" data-k="r02-sillon">sillon de délimitation</button>, l’étendue de l’érythème mesurée en centimètres depuis le bord de la plaie, l’œdème, l’écoulement, les <button class="w" data-k="r02-bulles">bulles hémorragiques et ecchymoses</button>, et les déformations neuropathiques sont décrits. Le médecin photographie la lésion avec une règle, ce qui permet de juger l’évolution heure par heure.</p></div>
<div class="card"><h4>Palpation</h4><p>La chaleur, la douleur, la fluctuation d’un abcès et la <button class="w" data-k="r02-crepitation">crépitation sous-cutanée (gaz)</button> sont recherchées. Le médecin palpe les pouls fémoraux, poplités, tibiaux postérieurs et pédieux. Il note que des <button class="w" data-k="r02-pouls">pouls perçus n’excluent pas une artériopathie distale</button> chez le diabétique.</p></div>
<div class="card"><h4>Sonde osseuse et sensibilité</h4><p>Le <button class="w" data-k="r02-probe">test de contact osseux par stylet stérile (« probe-to-bone »)</button> recherche une ostéite sous une plaie. Le <button class="w" data-k="r02-monofil">monofilament de 10 g</button> teste la sensibilité protectrice. Une plaie indolore sur une zone insensible confirme la part neuropathique.</p></div>
<div class="card"><h4>Signes d’ischémie</h4><p>Le <button class="w" data-k="r02-buerger-test">test d’élévation et de déclivité (pâleur à l’élévation, rougeur de déclivité)</button>, le temps de recoloration et la température relative du pied orientent vers une ischémie sévère. Ces signes sont imprécis : ils ne remplacent pas les mesures de pression.</p></div>
<div class="card"><h4>Signes d’alarme d’infection nécrosante</h4><p>Une douleur disproportionnée, une induration ligneuse qui dépasse l’érythème, une hypoesthésie cutanée nouvelle, des bulles hémorragiques, une peau grise ou bronzée et une crépitation imposent un avis chirurgical immédiat. Leur absence n’exclut pas le diagnostic : la fièvre manque chez plus de la moitié des patients atteints d’infection nécrosante.</p></div></div>
<p>Ces six blocs s’enchaînent dans l’ordre de la gravité. Chez le patient du cas fil rouge, quatre critères du syndrome inflammatoire sont présents : température supérieure à 38 °C, fréquence cardiaque supérieure à 90/min, fréquence respiratoire supérieure à 20/min et leucocytes au-dessus de 12 G/L. L’infection est donc sévère, de grade 4 IWGDF/IDSA, avant même tout examen complémentaire. L’erreur fréquente est de mesurer d’abord l’index de pression ou de demander une imagerie, alors que le drainage chirurgical et l’antibiothérapie ne doivent pas attendre.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Rassurer un patient parce que ses pouls pédieux sont perçus ou parce qu’il n’a pas de fièvre. Chez le diabétique, une artériopathie des artères du pied peut coexister avec un pouls pédieux, et une infection profonde évolue souvent sans fièvre. La décision repose sur l’ensemble des signes locaux et généraux, puis sur des mesures objectives.</div>
<div class="key"><b>À retenir.</b> Les signes vitaux et les critères du syndrome inflammatoire passent avant le pied. L’inspection mesure l’érythème en centimètres et cherche bulles, gaz et sillon ; la palpation cherche pouls, fluctuation et crépitation ; le stylet cherche l’os. La démarche diagnostique transforme ensuite ces signes en stades.</div>
