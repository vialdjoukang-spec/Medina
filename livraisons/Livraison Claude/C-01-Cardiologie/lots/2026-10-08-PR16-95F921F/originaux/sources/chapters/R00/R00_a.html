<section class="ilot" id="r00-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme L., 46 ans, consulte son médecin de famille pour deux plaintes. Depuis trois ans, elle ressent quelques fois par an un « cœur qui s’emballe » d’un seul coup, très vite et régulièrement, pendant 10 à 30 minutes ; l’accès cesse aussi brutalement qu’il a commencé. Depuis deux mois, elle perçoit en plus ses battements cardiaques à la montée des escaliers et se sent fatiguée. Son pouls est régulier à 104/min et sa pression artérielle à 118/72 mmHg. À l’auscultation, le médecin entend un souffle systolique doux, de grade 2 sur 6, au bord gauche du sternum. L’électrocardiogramme de repos montre un rythme sinusal normal.</p>
<p>Ce tableau réunit les trois situations du cours. Des <b>palpitations</b> exigent de savoir si un trouble du rythme les explique. Une <b>fréquence cardiaque anormale</b>, ici une tachycardie sinusale modérée, impose de chercher sa cause. Un <b>souffle</b> doit être classé comme innocent, fonctionnel ou organique. Quatre questions organisent le raisonnement : <b>le patient est-il stable, le symptôme correspond-il à une arythmie documentée, existe-t-il une cardiopathie sous-jacente, et quel examen modifiera réellement la décision ?</b></p>
<p>À la fin de ce cours, le médecin assistant sait caractériser des palpitations par l’anamnèse, reconnaître les signes d’alarme, choisir l’enregistrement électrocardiographique adapté à la fréquence des symptômes et interpréter une tachycardie ou une bradycardie de découverte. Il sait aussi décrire un souffle selon une grille complète, utiliser les manœuvres dynamiques, distinguer un souffle innocent d’un souffle organique chez l’enfant et chez l’adulte, et poser l’indication d’une échocardiographie. Les maladies elles-mêmes sont traitées dans leurs cours propres : <a href="#/entry/I47">I47 — Tachycardies paroxystiques supraventriculaires et ventriculaires</a>, <a href="#/entry/I48">I48 — Fibrillation et flutter auriculaires</a>, <a href="#/entry/I49">I49 — Extrasystoles et autres arythmies</a>, <a href="#/entry/I44">I44 — Troubles de la conduction et bradycardies</a>, <a href="#/entry/I34">I34 — Valvulopathies mitrales, tricuspides et pulmonaires</a> et <a href="#/entry/I35">I35 — Valvulopathies aortiques</a>.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="r00-interoception">perception consciente des battements cardiaques (intéroception)</button>, la <button class="w" data-k="r00-turbulence">genèse d’un souffle par l’écoulement turbulent (vitesse, gradient, diamètre)</button> et la <button class="w" data-k="r00-cycle">chronologie du cycle cardiaque (bruits, phases, pressions)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="r00-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Les catégories R00 et R01 de la CIM-10-GM 2024 décrivent des <b>symptômes et des signes</b>, et non des maladies. Le codage par R00 ou R01 n’est correct que tant qu’aucun diagnostic précis n’explique le symptôme. La classification exclut explicitement de R00 les troubles précisés du rythme, codés en I47 à I49. Dès qu’un enregistrement documente une tachycardie par réentrée intranodale, le code devient I47 ; dès qu’une échocardiographie montre un rétrécissement aortique, le souffle est codé en I35. Cette règle traduit une logique clinique : le symptôme ouvre une démarche, et la démarche doit aboutir à un diagnostic ou à une absence documentée de maladie.</p>
<p>Le tableau suivant répond à une question simple : que recouvre chaque sous-code, et vers quel cours le diagnostic final renvoie-t-il ?</p>

<tr><td>R00.1</td><td>Bradycardie, sans précision</td><td>Bradycardie physiologique, médicamenteuse ou maladie conductive (I44, I49)</td></tr>

<tr><td>R01.0</td><td>Souffle bénin et anodin (fonctionnel)</td><td>Souffle innocent de l’enfant, souffle de débit</td></tr>

<p>La lecture utile du tableau porte sur la dernière colonne. Un code R reste provisoire : le médecin ne s’arrête pas à « palpitations » s’il peut obtenir un ECG pendant l’accès. L’erreur fréquente consiste à coder R01.0 sans avoir vérifié les critères du souffle innocent. Chez Mme L., les accès brutaux et réguliers évoquent une tachycardie paroxystique ; le souffle doux et la tachycardie sinusale d’effort évoquent un état hyperkinétique, dont la cause reste à trouver.</p>
<h3>1.1 Palpitations</h3>
<p>Les palpitations sont la <b>perception consciente et désagréable des battements du cœur</b>. Le position paper de l’EHRA de 2011 souligne que ce symptôme n’a pas de corrélat physiologique rigoureux : une même arythmie est perçue par un patient et ignorée par un autre. La perception dépend de trois éléments : la force et le rythme de la contraction, l’attention portée au corps, et l’état émotionnel. L’EHRA distingue <button class="w" data-k="r00-types-palp">quatre types cliniques de palpitations (description, mécanisme, orientation)</button> : extrasystoliques, tachycardiques, liées à l’anxiété et de type pulsatile.</p>
<table class="t"><tr><th>Type (EHRA 2011)</th><th>Description du patient</th><th>Rythme et début</th><th>Orientation</th></tr>
<tr><td>Extrasystolique</td><td>« Un raté », « le cœur s’arrête puis repart »</td><td>Irrégulier, battements isolés, au repos</td><td>Extrasystoles (I49)</td></tr>
<tr><td>Tachycardique</td><td>« Le cœur s’emballe », « bat comme des ailes »</td><td>Rapide, régulier ou irrégulier ; début et fin brutaux</td><td>Tachycardie paroxystique (I47, I48)</td></tr>
<tr><td>Liée à l’anxiété</td><td>Battements rapides, oppression, fourmillements</td><td>Régulier, peu rapide ; début et fin progressifs</td><td>Tachycardie sinusale, trouble anxieux</td></tr>
<tr><td>Pulsatile</td><td>« Le cœur cogne »</td><td>Régulier, fréquence normale, à l’effort</td><td>Insuffisance aortique, fièvre, anémie</td></tr></table>
<p>Ce tableau se lit par la colonne « rythme et début ». Un début brutal signe un mécanisme de réentrée, qui s’enclenche en un battement ; un début progressif signe une accélération sinusale, qui suit le tonus sympathique. Une patiente qui décrit un accès à 180/min commencé d’un coup et arrêté par une inspiration bloquée n’a pas une « crise d’angoisse » tant qu’un ECG n’a pas été obtenu.</p>
<h3>1.2 Tachycardie et bradycardie</h3>
<p>Chez l’adulte au repos, une fréquence supérieure à 100/min définit une <b>tachycardie</b>. L’ESC 2021 définit la <b>bradycardie</b> par une fréquence inférieure à 50/min ; la limite classique de 60/min, plus ancienne, classe à tort comme anormales de nombreuses personnes saines. Ces <button class="w" data-k="r00-seuils-fc">seuils de fréquence (population, contexte, pièges)</button> ne s’appliquent ni à l’enfant, dont la fréquence normale est plus élevée, ni au sportif entraîné, dont la fréquence de repos peut être très basse. Une fréquence n’est anormale qu’au regard de la situation : 110/min est normal pendant un effort, et 45/min est normal pendant le sommeil d’un adulte jeune.</p>
<h3>1.3 Souffles et bruits surajoutés</h3>
<p>Un <b>souffle</b> est un son prolongé, produit par un <button class="w" data-k="r00-turbulence">écoulement sanguin turbulent</button>. Il se décrit par son temps dans le cycle (systolique, diastolique, continu), son intensité, son foyer, son irradiation, son timbre et sa forme. L’intensité se cote sur six degrés selon l’<button class="w" data-k="r00-levine">échelle de Levine (grades 1 à 6 et frémissement)</button>. Aucune recommandation suisse propre au souffle n’a été identifiée ; la recommandation de la société allemande de cardiologie pédiatrique (DGPK 2017) distingue trois catégories :</p>
<div class="two">
<div class="card"><h4>Souffle innocent (accidentel)</h4><p>Il survient chez un enfant ou un adulte dont le cœur et les vaisseaux sont normaux. Il ne dépasse pratiquement jamais 3/6 et ne s’accompagne d’aucun autre signe. Le diagnostic n’est retenu qu’après exclusion raisonnable d’une maladie organique, car l’auscultation est typique mais pas probante.</p></div>
<div class="card"><h4>Souffle fonctionnel</h4><p>Il traduit un débit augmenté à travers des valves normales. La fièvre, l’anémie, l’hyperthyroïdie et la grossesse accélèrent le flux et le rendent turbulent. Le souffle disparaît quand la cause est corrigée.</p></div>
<div class="card"><h4>Souffle organique</h4><p>Il traduit une lésion : sténose ou fuite valvulaire, sténose vasculaire, ou shunt anormal entre deux cavités. Sa présence impose une échocardiographie et un suivi propre à la lésion.</p></div>
<div class="card"><h4>Bruits surajoutés</h4><p>Ce sont des sons brefs : <button class="w" data-k="r00-b3">troisième bruit (remplissage rapide)</button>, <button class="w" data-k="r00-b4">quatrième bruit (contraction auriculaire contre un ventricule rigide)</button>, <button class="w" data-k="r00-clic">clics d’éjection et clic mésosystolique</button>, <button class="w" data-k="r00-claquement">claquement d’ouverture mitrale</button> et <button class="w" data-k="r00-frottement">frottement péricardique</button>.</p></div></div>
<div class="trap"><span class="k">Piège</span>« Innocent » et « fonctionnel » ne sont pas synonymes. Un souffle fonctionnel est sans lésion valvulaire, mais sa cause peut être grave : une anémie à 75 g/L par saignement digestif ou une thyrotoxicose. Le médecin qui conclut « souffle fonctionnel » doit nommer et traiter la cause du débit augmenté.</div>
<div class="key"><b>À retenir.</b> Les codes R00 et R01 désignent des symptômes provisoires, que la démarche transforme en diagnostic. Le type de palpitations oriente vers un mécanisme ; la tachycardie se définit au-delà de 100/min et la bradycardie, selon l’ESC 2021, en dessous de 50/min. Un souffle se décrit selon sept caractères et se classe en innocent, fonctionnel ou organique. La partie suivante quantifie la fréquence de ces situations et leur pronostic.</div>
</section>

<section class="ilot" id="r00-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Les palpitations comptent parmi les plaintes les plus fréquentes en médecine de premier recours. Selon le position paper de l’EHRA de 2011, elles représentent environ 16 % des symptômes motivant une consultation de médecine générale et sont, après la douleur thoracique, le deuxième motif d’adressage à un cardiologue. Leur fréquence crée un problème d’allocation : la grande majorité des patients n’a pas d’arythmie dangereuse, mais une minorité a une maladie qui expose à la mort subite.</p>
<p>La cohorte prospective de <button class="w" data-k="r00-weber">Weber et Kapoor (190 patients consécutifs, centre universitaire américain, 1996)</button> donne la répartition de référence. La cause était cardiaque chez 43 % des patients, psychiatrique chez 31 %, diverse (médicaments, substances, maladies systémiques) chez 10 % ; elle restait inconnue chez 16 %. L’anamnèse, l’examen clinique, l’ECG et une biologie simple suffisaient pour 40 % des diagnostics posés. À un an, la mortalité était de 1,6 % et le taux d’AVC de 1,1 %, mais 75 % des patients avaient récidivé et 19 % signalaient une gêne dans leur travail. Le pronostic vital global est donc bon ; le fardeau fonctionnel est important.</p>
<div class="trap"><span class="k">Lecture critique</span>Une étude universitaire de 1996 surestime peut-être les arythmies par rapport au cabinet de premier recours, et ses enregistrements prolongés étaient moins performants qu’aujourd’hui. Le chiffre de 31 % de causes psychiatriques ne signifie pas que l’anxiété explique un tiers des palpitations d’un patient donné. Il rappelle seulement que le trouble panique est une cause fréquente, que l’on retient après avoir cherché une arythmie, et non avant.</div>
<p>Le diagnostic erroné de trouble anxieux est documenté. Dans l’étude de <button class="w" data-k="r00-lessmeier">Lessmeier et al. (1997, tachycardies supraventriculaires méconnues)</button>, la tachycardie restait méconnue après le premier bilan chez 55 % des patients. Les médecins non psychiatres avaient attribué les symptômes à la panique, à l’anxiété ou au stress chez plus de la moitié d’entre eux. Ce délai diagnostique s’explique par l’ECG de repos normal entre les accès, et par la ressemblance entre les symptômes adrénergiques d’une tachycardie et ceux d’une attaque de panique.</p>
<p>Les souffles sont plus fréquents encore. Chez l’enfant, la plupart des souffles entendus lors d’un examen systématique sont innocents. La recommandation allemande de cardiologie pédiatrique (DGPK 2017) indique toutefois qu’un souffle entendu chez un <b>nouveau-né</b> révèle une cardiopathie dans environ un tiers des cas, dont moins de 10 % exigent une intervention. Chez l’enfant plus âgé ou l’adolescent, un souffle nouvellement découvert correspond à une anomalie dans moins de 10 % des cas. Chez l’adulte âgé, la cause dominante d’un souffle systolique est la <button class="w" data-k="r00-sclerose">sclérose valvulaire aortique (épaississement sans obstruction)</button>. Dans la <i>Cardiovascular Health Study</i>, l’échocardiographie de 5 621 personnes de 65 ans ou plus montrait une valve aortique sclérosée sans obstruction chez 29 % et un rétrécissement chez 2 % (Otto et al., 1999).</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée suisse publiée ne quantifie la fréquence des palpitations ou des souffles en médecine de premier recours. Les chiffres cités proviennent d’études américaines (Weber et Kapoor, Otto) et d’une recommandation allemande.</div>
<div class="key"><b>À retenir.</b> Les palpitations sont fréquentes ; leur cause est cardiaque chez un peu moins de la moitié des patients et leur pronostic vital global est bon, au prix de récidives fréquentes. Le trouble anxieux est un diagnostic d’exclusion, car les tachycardies supraventriculaires sont souvent méconnues. Un souffle du nouveau-né est pathologique dans un tiers des cas ; chez l’enfant plus âgé, il est surtout innocent ; chez le sujet âgé, il traduit souvent une sclérose aortique. La physiopathologie explique ces différences.</div>

<section class="ilot" id="r00-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Trois questions physiologiques fondent la démarche. Pourquoi un battement devient-il perceptible ? Pourquoi une fréquence trop rapide ou trop lente fait-elle baisser le débit ? Pourquoi un écoulement sanguin devient-il audible ? Chaque réponse se traduit par un signe clinique et par un choix d’examen.</p>
<h3>3.1 Pourquoi un battement est perçu</h3>
<p>Au repos, une personne en bonne santé ne perçoit pas ses battements cardiaques. Les mécanorécepteurs du cœur, des gros vaisseaux et de la paroi thoracique envoient pourtant en permanence leurs signaux, par le nerf vague et les afférences sympathiques, vers le tronc cérébral puis l’insula. Le cerveau filtre ces signaux lorsqu’ils sont réguliers et attendus. Un battement devient perceptible lorsqu’il <b>change brusquement</b> : par sa force, par son rythme ou par sa fréquence. Il le devient aussi lorsque l’<button class="w" data-k="r00-interoception">attention intéroceptive</button> est accrue, comme dans le trouble panique, où le patient surveille son corps et interprète chaque sensation comme une menace.</p>
<p>L’extrasystole illustre ce mécanisme. Le patient sent rarement l’extrasystole elle-même, précoce et peu efficace, car le ventricule a eu peu de temps pour se remplir. Il sent surtout la <b>pause</b> qui suit, puis le <button class="w" data-k="r00-potentiation">battement post-extrasystolique renforcé (remplissage prolongé et potentiation)</button>. La pause allonge le remplissage, ce qui augmente le volume télédiastolique selon la loi de Frank-Starling ; le calcium accumulé dans le réticulum sarcoplasmique renforce en plus la contraction suivante. D’où la description typique : « le cœur s’arrête, puis donne un grand coup ».</p>
<h3>3.2 Pourquoi le début brutal oriente vers une réentrée</h3>
<p>Une tachycardie sinusale s’installe et cède progressivement, en une à plusieurs minutes, car le nœud sinusal suit les variations du tonus sympathique et des catécholamines circulantes. Une <button class="w" data-k="r00-reentree-debut">réentrée (circuit enclenché par une extrasystole)</button> démarre au contraire en un seul battement, dès qu’une extrasystole trouve le circuit prêt à conduire ; elle s’arrête aussi en un battement, lorsqu’un bloc interrompt le circuit. Ce contraste est la donnée anamnestique la plus discriminante. Dans les réentrées intranodales, l’oreillette et le ventricule se contractent presque simultanément : l’oreillette se vide contre une valve tricuspide fermée, ce qui produit des pulsations jugulaires rapides et régulières, le <button class="w" data-k="r00-grenouille">signe de la grenouille (ondes jugulaires en canon)</button>.</p>
<h3>3.3 Conséquences hémodynamiques d’une fréquence anormale</h3>
<p>Le débit cardiaque est le produit de la fréquence par le volume d’éjection systolique. Une tachycardie modérée augmente le débit, car le volume d’éjection se maintient. Au-delà d’un certain seuil, propre à chaque patient, la diastole se raccourcit davantage que la systole : le remplissage devient insuffisant et le volume d’éjection chute. La perfusion coronaire, qui se fait surtout en diastole, diminue au moment où la consommation d’oxygène du myocarde augmente. Chez un patient porteur d’un rétrécissement aortique ou d’une coronaropathie, une tachycardie à 150/min peut donc provoquer une douleur thoracique, une hypotension ou une syncope.</p>
<p>Une bradycardie est compensée tant que le ventricule peut augmenter son volume d’éjection. Un sportif à 40/min éjecte 120 mL par battement et maintient un débit normal ; un patient âgé au ventricule rigide ne peut pas augmenter son volume d’éjection, et une fréquence de 40/min fait baisser son débit. La même fréquence est donc bénigne chez l’un et symptomatique chez l’autre : c’est la tolérance, et non le chiffre, qui décide de l’urgence.</p>
<h3>3.4 Pourquoi un écoulement devient audible</h3>
<p>Dans un vaisseau normal, le sang s’écoule en couches parallèles : l’écoulement est laminaire et silencieux. Il devient turbulent lorsque le <button class="w" data-k="r00-turbulence">nombre de Reynolds</button> dépasse une valeur critique. Ce nombre augmente avec la vitesse du sang et le diamètre du conduit, et diminue avec la viscosité. Trois situations produisent donc un souffle : une <b>vitesse accrue</b> à travers un orifice normal (débit élevé de l’anémie ou de la fièvre), un <b>orifice rétréci</b> qui accélère le jet (rétrécissement aortique), ou un <b>écoulement anormal</b> d’une cavité à haute pression vers une cavité à basse pression (fuite mitrale, communication interventriculaire). L’anémie agit doublement : elle augmente le débit et abaisse la viscosité du sang.</p>
<p>Le temps du souffle dans le cycle découle directement des pressions. En systole, le ventricule éjecte vers l’aorte et l’artère pulmonaire : un souffle d’éjection naît d’un flux accéléré à travers ces orifices, et il prend une forme losangique parce que le flux croît puis décroît. Une fuite mitrale commence dès la fermeture de la valve et dure toute la systole, car la pression ventriculaire dépasse la pression auriculaire pendant toute cette phase : le souffle est holosystolique. En diastole, aucun flux physiologique n’est assez rapide pour devenir turbulent. C’est pourquoi un <b>souffle diastolique est toujours organique</b> : il traduit une fuite aortique ou pulmonaire, ou un obstacle au remplissage mitral ou tricuspide.</p>

<div class="key"><b>Corrélation physiopathologie → clinique.</b> Le patient perçoit surtout le battement renforcé après une pause : un « raté » oriente vers des extrasystoles. Un début et une fin brutaux traduisent une réentrée ; un début progressif traduit une accélération sinusale. La tolérance d’une fréquence dépend de la réserve du ventricule, d’où la priorité donnée aux signes d’instabilité. Un souffle naît d’une vitesse élevée, d’un orifice rétréci ou d’un flux anormal ; tout souffle diastolique est organique. La partie suivante applique ces mécanismes aux causes.</div>

<section class="ilot" id="r00-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Les causes se classent selon le mécanisme, car ce classement guide l’examen utile. Une palpitation peut venir d’une arythmie, d’une accélération sinusale appropriée, d’une perception amplifiée ou d’une contraction plus vigoureuse. Une fréquence anormale peut être physiologique, secondaire ou primitive. Un souffle peut traduire un débit, une lésion ou un shunt.</p>
<h3>4.1 Causes des palpitations</h3>
<div class="two">
<div class="card"><h4>Arythmies</h4><p>Extrasystoles auriculaires et ventriculaires ; tachycardies supraventriculaires par réentrée intranodale ou par voie accessoire ; fibrillation et flutter auriculaires ; tachycardie ventriculaire, rare mais grave ; bradycardies avec échappements perçus. Dans la cohorte de Weber et Kapoor, les arythmies représentaient 41 % des causes, dont 16 % de fibrillation ou flutter, 10 % de tachycardie supraventriculaire et 2 % de tachycardie ventriculaire.</p></div>
<div class="card"><h4>Tachycardie sinusale secondaire</h4><p>Effort, fièvre, <button class="w" data-k="r00-tachy-sinus">anémie, hypovolémie, hyperthyroïdie, hypoglycémie, phéochromocytome, embolie pulmonaire (mécanismes)</button>, grossesse, douleur. Le nœud sinusal est normal ; il répond à un besoin de débit ou à un excès de catécholamines.</p></div>
<div class="card"><h4>Médicaments et substances</h4><p><button class="w" data-k="r00-substances">Caféine, boissons énergisantes, alcool, nicotine, cocaïne, amphétamines (mécanismes)</button> ; sympathomimétiques, salbutamol, hormones thyroïdiennes en excès, méthylphénidate ; sevrage d’un bêtabloquant ; médicaments qui allongent le QT.</p></div>
<div class="card"><h4>Troubles psychiques et perception</h4><p><button class="w" data-k="r00-panique">Trouble panique, anxiété généralisée, troubles somatoformes (diagnostic d’exclusion)</button>. Les palpitations y sont réelles : la fréquence sinusale s’accélère sous l’effet de l’adrénaline, et l’attention portée au cœur amplifie la perception.</p></div>
<div class="card"><h4>Contraction vigoureuse sans arythmie</h4><p>Insuffisance aortique volumineuse : le ventricule dilaté éjecte un grand volume et le patient sent « cogner » son cœur, surtout en décubitus latéral gauche. États hyperkinétiques : fièvre, anémie, fistule artérioveineuse.</p></div>
<div class="card"><h4>Tachycardies sinusales sans cause secondaire</h4><p><button class="w" data-k="r00-tsi">Tachycardie sinusale inappropriée (définition, traitement)</button> et <button class="w" data-k="i49-pots-crit">syndrome de tachycardie orthostatique posturale (critères)</button>, traités dans <a href="#/entry/I49">I49 — Extrasystoles et autres arythmies</a>.</p></div></div>
<h3>4.2 Causes d’une bradycardie de découverte</h3>
<p>Une bradycardie découverte fortuitement est le plus souvent physiologique ou médicamenteuse. La recherche d’une cause réversible précède toute discussion de stimulateur, car l’ESC 2021 ne recommande pas de stimulation (classe III) pour une bradycardie due à une cause transitoire, corrigeable et évitable.</p>
<table class="t"><tr><th>Groupe</th><th>Causes</th><th>Mécanisme principal</th></tr>
<tr><td>Physiologique</td><td>Sommeil, sportif d’endurance, sujet jeune vagotonique</td><td>Tonus vagal élevé, volume d’éjection augmenté</td></tr>
<tr><td>Médicamenteuse</td><td><button class="w" data-k="r00-brady-medic">Bêtabloquants (y compris en collyre), vérapamil, diltiazem, digoxine, amiodarone, ivabradine, anticholinestérasiques, clonidine, lithium (mécanismes)</button></td><td>Freinage du nœud sinusal ou du nœud auriculoventriculaire</td></tr>
<tr><td>Métabolique et systémique</td><td>Hypothyroïdie, hyperkaliémie, hypothermie, anorexie mentale, hypertension intracrânienne</td><td>Baisse de l’automatisme ou réflexe vagal</td></tr>
<tr><td>Cardiaque aiguë</td><td>Infarctus inférieur, myocardite, maladie de Lyme, endocardite avec abcès</td><td>Ischémie ou inflammation du tissu de conduction</td></tr>
<tr><td>Cardiaque chronique</td><td>Dysfonction sinusale, blocs auriculoventriculaires dégénératifs</td><td>Fibrose du tissu nodal et du système His-Purkinje</td></tr>
<tr><td>Respiratoire</td><td>Apnées obstructives du sommeil</td><td>Réflexe vagal déclenché par l’hypoxémie</td></tr></table>
<p>Le tableau se lit de haut en bas, dans l’ordre où le médecin cherche les causes. L’erreur fréquente consiste à oublier les collyres bêtabloquants du glaucome, dont l’absorption par la muqueuse nasale échappe au premier passage hépatique. Un homme de 78 ans à 42/min sous timolol oculaire et vérapamil n’a pas, à ce stade, de dysfonction sinusale démontrée : l’arrêt des médicaments précède toute conclusion.</p>
<h3>4.3 Causes des souffles et des bruits surajoutés</h3>
<p>Le temps du souffle oriente immédiatement vers un groupe de causes. Le tableau suivant les classe par fréquence chez l’adulte et chez l’enfant.</p>
<table class="t"><tr><th>Temps</th><th>Adulte</th><th>Enfant</th></tr>
<tr><td>Systolique d’éjection</td><td>Sclérose ou rétrécissement aortique, cardiomyopathie hypertrophique obstructive, souffle de débit</td><td>Souffle de Still, souffle d’éjection pulmonaire, sténose pulmonaire, rétrécissement aortique, communication interauriculaire (débit pulmonaire)</td></tr>
<tr><td>Holosystolique</td><td>Insuffisance mitrale, insuffisance tricuspide, communication interventriculaire après infarctus</td><td>Communication interventriculaire, insuffisance mitrale</td></tr>
<tr><td>Mésotélésystolique</td><td>Prolapsus mitral (clic puis souffle)</td><td>Prolapsus mitral, rare</td></tr>
<tr><td>Diastolique</td><td>Insuffisance aortique, rétrécissement mitral</td><td>Insuffisance aortique sur bicuspidie, roulement de débit d’un shunt important</td></tr>
<tr><td>Continu</td><td>Fistule artérioveineuse, rupture d’un anévrisme du sinus de Valsalva</td><td>Canal artériel persistant ; bourdonnement veineux innocent</td></tr></table>
<p>La lecture commence par la colonne « temps ». Un souffle holosystolique ou diastolique est organique jusqu’à preuve du contraire ; un souffle d’éjection doux peut être innocent ou fonctionnel. Chez un enfant de 4 ans au souffle vibrant, doux, maximal au bord gauche du sternum et plus fort en décubitus, le souffle de Still est l’hypothèse principale. Chez un homme de 79 ans au souffle d’éjection rude irradiant aux carotides avec un B2 aboli, le rétrécissement aortique serré l’est.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer un souffle de l’adulte âgé à une « sclérose aortique » sans échocardiographie. La sclérose n’abolit pas B2 et ne retarde pas le pouls carotidien ; le rétrécissement serré le fait. La confusion retarde un remplacement valvulaire chez un patient dont la survie dépend de cette intervention dès l’apparition des symptômes (<a href="#/entry/I35">I35 — Valvulopathies aortiques</a>).</div>
<div class="key"><b>À retenir.</b> Les palpitations relèvent de quatre mécanismes : arythmie, accélération sinusale secondaire, substance, perception amplifiée. Une bradycardie de découverte est d’abord physiologique ou médicamenteuse, et toute cause réversible se corrige avant d’envisager un stimulateur. Le temps du souffle oriente vers sa cause. L’anamnèse permet ensuite de choisir entre ces hypothèses.</div>
<button class="pareto-btn ui" data-k="pareto-r00-etio">▲ Loi de Pareto — Étiologies</button>
</section>

<section class="ilot" id="r00-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Devant des palpitations, l’anamnèse est l’examen le plus rentable : selon l’EHRA 2011, l’évaluation initiale par l’anamnèse, l’examen clinique et l’ECG à 12 dérivations fournit une cause certaine ou probable chez environ la moitié des patients. Elle poursuit quatre buts : reconnaître un signe d’alarme, déterminer le type de palpitations, identifier un déclencheur ou une substance, et estimer la fréquence des accès, qui détermine l’enregistrement à prescrire.</p>
<h3>5.1 Caractériser les palpitations</h3>
<p>Le médecin demande au patient de décrire un accès précis, le dernier ou le plus typique, plutôt qu’une impression générale. Il interroge sur huit éléments.</p>
<div class="two">
<ul><li><button class="w" data-k="r00-s-debut">Mode de début et de fin (brutal ou progressif)</button></li><li><button class="w" data-k="r00-s-regul">Régularité et fréquence (faire tapoter le rythme)</button></li><li>Durée de l’accès et fréquence des accès : elles fixent le choix de l’enregistreur, car un Holter de 24 heures ne capte pas un accès mensuel.</li><li><button class="w" data-k="r00-s-circonst">Circonstances de survenue (effort, repos, position, après l’effort)</button></li></ul>
<ul><li><button class="w" data-k="r00-s-vagal">Arrêt par une manœuvre vagale (valeur diagnostique)</button></li><li><button class="w" data-k="r00-s-polyurie">Polyurie après l’accès (peptide natriurétique auriculaire)</button></li><li><button class="w" data-k="r00-s-assoc">Symptômes associés (syncope, douleur, dyspnée, signes adrénergiques)</button></li><li>Âge au premier accès : une tachycardie par réentrée intranodale débute souvent chez l’adolescent ou l’adulte jeune, alors que la fibrillation auriculaire augmente avec l’âge.</li></ul></div>
<h3>5.2 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="r00-atcd-card">Cardiopathie connue : infarctus, cardiomyopathie, valvulopathie, cardiopathie congénitale opérée (pourquoi elle change tout)</button></li><li><button class="w" data-k="r00-atcd-fam">Mort subite inexpliquée, cardiomyopathie ou canalopathie dans la famille</button></li><li>Dysthyroïdie, anémie, saignements, perte de poids : ces éléments orientent vers une tachycardie sinusale secondaire.</li></ul>
<ul><li><button class="w" data-k="r00-atcd-medic">Médicaments, compléments, substances, boissons énergisantes (inventaire actif)</button></li><li>Troubles anxieux ou dépressifs : ils ne dispensent pas d’un ECG pendant l’accès, mais ils orientent l’accompagnement.</li><li>Grossesse en cours ou possible : elle accélère physiologiquement le cœur et limite le choix des médicaments.</li></ul></div>
<h3>5.3 Devant un souffle</h3>
<p>Un souffle découvert fortuitement oblige à rechercher des symptômes que le patient n’associe pas au cœur. Chez l’adulte, le médecin cherche une <button class="w" data-k="r00-s-souffle-adulte">dyspnée d’effort, une douleur thoracique d’effort ou une syncope d’effort (triade du rétrécissement aortique)</button>, une fièvre prolongée qui ferait craindre une endocardite, un antécédent de rhumatisme articulaire aigu ou de souffle connu. Chez l’enfant, il cherche une <button class="w" data-k="r00-s-souffle-enfant">difficulté alimentaire, une sudation au biberon, une stagnation pondérale, une cyanose, des infections respiratoires répétées (signes de cardiopathie)</button>, ainsi qu’un syndrome génétique connu.</p>
<h3>5.4 Présentations typiques et trompeuses</h3>
<div class="two">
<div class="card"><h4>Extrasystoles bénignes</h4><p>Homme de 38 ans, « ratés » le soir au coucher depuis six mois, après trois cafés et deux boissons énergisantes par jour. Aucun malaise, aucun antécédent familial, ECG normal. Le Holter retrouve 1 200 extrasystoles ventriculaires monomorphes par 24 heures, soit environ 1 % des battements : le patient est rassuré et réduit les stimulants.</p></div>
<div class="card"><h4>Tachycardie supraventriculaire étiquetée « anxieuse »</h4><p>Femme de 27 ans, accès brutaux à 190/min depuis l’adolescence, arrêtés en se penchant en avant et en bloquant sa respiration ; trois consultations aux urgences ont conclu à des crises d’angoisse, car l’ECG était normal à l’arrivée. Un enregistrement par montre montre une tachycardie régulière à QRS fins : réentrée intranodale, guérie par ablation.</p></div>
<div class="card"><h4>Signal d’alarme</h4><p>Homme de 22 ans, footballeur, palpitations brèves puis perte de connaissance en plein effort. Son oncle est mort subitement à 35 ans. La syncope d’effort et l’antécédent familial imposent un avis cardiologique rapide, à la recherche d’une cardiomyopathie hypertrophique ou d’une canalopathie.</p></div>
<div class="card"><h4>Tachycardie sinusale secondaire</h4><p>Mme L., la patiente du fil rouge, perçoit ses battements à l’effort depuis deux mois et signale des règles abondantes. Son hémoglobine est à 92 g/L et sa ferritine à 6 µg/L : l’anémie ferriprive explique la tachycardie d’effort et le souffle de débit. Elle n’explique pas ses accès brutaux, qui restent à documenter.</p></div></div>
<div class="trap"><span class="k">Piège</span>Un même patient peut avoir deux causes. Trouver une anémie, une anxiété ou des extrasystoles ne clôt pas l’anamnèse : le médecin vérifie que la cause trouvée explique <i>tous</i> les types d’accès décrits.</div>
<div class="key"><b>À retenir.</b> L’anamnèse d’un accès précis identifie le type de palpitations, les signes d’alarme et les déclencheurs ; la fréquence des accès détermine l’enregistrement. Devant un souffle, le médecin cherche les symptômes d’effort chez l’adulte et les signes d’insuffisance cardiaque chez l’enfant. L’examen clinique confirme ou réfute ensuite ces hypothèses.</div>
</section>

<section class="ilot" id="r00-6"><h2><span class="n">6</span>Examen clinique et auscultation</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, anthropométrie, puis signes ciblés. Il répond à trois questions : le patient est-il stable, existe-t-il une cardiopathie, et une cause extracardiaque est-elle visible ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Le médecin apprécie la conscience, la coloration, la perfusion cutanée et la dyspnée. Il compte le <button class="w" data-k="r00-e-pouls">pouls pendant une minute entière, en notant sa régularité et un éventuel déficit (technique)</button>, puis mesure la pression artérielle aux deux bras. Il réalise une <button class="w" data-k="r00-e-ortho">épreuve d’orthostatisme (fréquence et pression couché puis debout)</button> lorsque les palpitations surviennent au lever. Chez l’enfant et chez l’adulte jeune hypertendu, il palpe les pouls fémoraux et compare la pression au bras et à la jambe, à la recherche d’une <button class="w" data-k="r00-e-coarct">coarctation de l’aorte (pouls fémoraux faibles et retardés)</button>. Il note la température, la saturation et le poids ; une perte de poids oriente vers une hyperthyroïdie, une stagnation pondérale de l’enfant vers une cardiopathie.</p>
<h3>6.2 Signes ciblés extracardiaques</h3>
<div class="two">
<ul><li><button class="w" data-k="r00-e-thyr">Signes d’hyperthyroïdie : goitre, tremblement, peau chaude, exophtalmie</button></li><li><button class="w" data-k="r00-e-anemie">Pâleur cutanéo-muqueuse, koïlonychie (anémie)</button></li><li>Signes d’insuffisance cardiaque : turgescence jugulaire, crépitants, œdèmes</li></ul>
<ul><li><button class="w" data-k="r00-grenouille">Pulsations jugulaires rapides et régulières pendant l’accès</button></li><li>Dysmorphie ou syndrome génétique chez l’enfant (trisomie 21, syndrome de Turner, de Williams-Beuren, de Marfan), car ces syndromes s’associent à des cardiopathies précises</li><li>Signes d’endocardite : fièvre, splénomégalie, hémorragies sous-unguéales, lésions de Janeway</li></ul></div>
<h3>6.3 Auscultation</h3>
<p>L’auscultation se fait dans un environnement calme, patient torse nu, aux quatre foyers puis dans les zones d’irradiation. Le médecin utilise la <button class="w" data-k="r00-e-auscult">membrane et la cloche du stéthoscope, et les positions qui démasquent les souffles (décubitus latéral gauche, penché en avant)</button>. Il identifie d’abord B1 et B2 en palpant simultanément le pouls carotidien : B1 précède le pouls, B2 le suit. Il décrit ensuite chaque souffle selon la <button class="w" data-k="r00-e-grille">grille en sept caractères (temps, intensité, foyer, irradiation, timbre, forme, variations)</button>.</p>
<p>La <b>normalité de B2</b> est un repère majeur. Un B2 normalement dédoublé à l’inspiration, puis unique à l’expiration, plaide contre une valvulopathie significative. Un B2 aboli au foyer aortique évoque un rétrécissement aortique serré ; un dédoublement large et fixe de B2 évoque une communication interauriculaire, car le shunt égalise le remplissage des deux ventricules quelle que soit la respiration.</p>
<p>Les <button class="w" data-k="r00-manoeuvres">manœuvres dynamiques (respiration, Valsalva, accroupissement, lever, handgrip)</button> modifient la précharge ou la postcharge et font varier l’intensité du souffle de façon caractéristique. Lembo et al. (1988) les ont évaluées chez 50 patients au souffle documenté. Le tableau suivant en résume la valeur diagnostique.</p>
<table class="t"><tr><th>Manœuvre</th><th>Effet hémodynamique</th><th>Réponse caractéristique</th><th>Sensibilité / spécificité</th></tr>
<tr><td>Inspiration</td><td>Retour veineux droit accru</td><td>Souffle d’origine droite renforcé</td><td>100 % / 88 %</td></tr>
<tr><td>Valsalva (phase de poussée)</td><td>Précharge diminuée</td><td>Souffle de cardiomyopathie hypertrophique obstructive renforcé</td><td>65 % / 96 %</td></tr>
<tr><td>Passage de l’accroupissement à la station debout</td><td>Précharge diminuée</td><td>Souffle de cardiomyopathie hypertrophique obstructive renforcé</td><td>95 % / 84 %</td></tr>
<tr><td>Passage de la station debout à l’accroupissement</td><td>Précharge et postcharge augmentées</td><td>Souffle de cardiomyopathie hypertrophique obstructive diminué</td><td>95 % / 85 %</td></tr>
<tr><td>Handgrip (serrement de poing soutenu)</td><td>Postcharge augmentée</td><td>Insuffisance mitrale et communication interventriculaire renforcées</td><td>68 % / 92 %</td></tr></table>
<p>La lecture du tableau commence par le souffle qu’il ne faut pas manquer : un souffle d’éjection qui augmente debout ou pendant la poussée de Valsalva évoque une obstruction dynamique de la chambre de chasse, car un ventricule moins rempli rapproche le septum hypertrophié du feuillet mitral. Le souffle du rétrécissement aortique fait l’inverse, car un débit plus faible traverse l’orifice fixe. Aucune manœuvre isolée n’est parfaite ; Lembo et al. montrent qu’une combinaison de manœuvres identifie correctement la plupart des souffles. Un patient de 30 ans au souffle systolique qui double d’intensité en se levant doit avoir une échocardiographie, même si le souffle est de grade 2.</p>
<h3>6.4 Particularités de l’enfant</h3>
<p>Chez l’enfant, l’examen d’un souffle comprend toujours la palpation des pouls fémoraux, la mesure de la saturation et l’examen de la courbe de croissance. Le médecin vérifie les <button class="w" data-k="r00-innocent">critères du souffle innocent (tous requis)</button> et reconnaît les <button class="w" data-k="r00-innocents-types">cinq souffles innocents de l’enfant (Still, éjection pulmonaire, sténose pulmonaire périphérique du nouveau-né, souffle supraclaviculaire, bourdonnement veineux)</button>. Un souffle qui diminue en position assise et augmente couché, chez un enfant de 2 à 6 ans en bonne santé, est typique du souffle de Still.</p>
<div class="trap"><span class="k">Piège</span>Un souffle innocent peut coexister avec une cardiopathie. La recommandation DGPK le rappelle : la présence d’un souffle innocent n’exclut pas une cardiopathie congénitale ou acquise. La coarctation de l’aorte, par exemple, peut ne produire qu’un souffle discret ; seuls les pouls fémoraux et la pression aux jambes la révèlent.</div>
<div class="key"><b>À retenir.</b> L’examen commence par la stabilité, la fréquence comptée sur une minute et la recherche d’une cause extracardiaque. L’auscultation décrit chaque souffle selon sept caractères et apprécie B2. Les manœuvres dynamiques distinguent la cardiomyopathie hypertrophique obstructive, qui augmente quand la précharge baisse, du rétrécissement aortique. Chez l’enfant, les pouls fémoraux, la saturation et la croissance complètent toujours l’auscultation. La démarche diagnostique organise ensuite les examens.</div>
<button class="pareto-btn ui" data-k="pareto-r00-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>
