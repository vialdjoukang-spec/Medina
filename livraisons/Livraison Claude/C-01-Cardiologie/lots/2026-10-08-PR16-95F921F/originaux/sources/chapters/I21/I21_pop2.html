
<!-- ===== FENÊTRES I21 : clinique et ECG ===== -->
<template data-pop="i21-atcd-coro" data-title="Antécédent de coronaropathie">
<div class="lab">Question</div><p>« Avez-vous déjà eu un infarctus, un stent, un pontage ? Quand, sur quelle artère ? Prenez-vous vos antiagrégants ? » Demander les comptes rendus de coronarographie.</p>
<div class="lab">Pourquoi</div><p>Une douleur semblable à celle de l’infarctus précédent a une forte valeur. Un arrêt récent des antiagrégants après un stent évoque une thrombose de stent. Un pontage modifie la lecture de l’ECG et l’abord de la coronarographie.</p></template>

<template data-pop="i21-atcd-hemo" data-title="Antécédents hémorragiques et neurologiques">
<div class="lab">À rechercher</div><p>AVC hémorragique ou ischémique, accident ischémique transitoire, tumeur ou malformation cérébrale, hémorragie digestive récente, ulcère actif, trouble connu de la coagulation, chirurgie ou traumatisme crânien dans le mois, ponction non compressible récente.</p>
<div class="lab">Conséquence</div><p>Ces éléments sont des contre-indications de la fibrinolyse, contre-indiquent le prasugrel (AVC ou accident ischémique transitoire) et entrent dans les critères ARC-HBR.</p></template>

<template data-pop="i21-atcd-medic" data-title="Traitements en cours à connaître">
<div class="lab">Anticoagulant oral</div><p>Molécule, dose, heure de la dernière prise : modifie l’anticoagulation péri-procédurale et impose une triple thérapie courte.</p>
<div class="lab">Inhibiteurs de la phosphodiestérase de type 5</div><p>Sildénafil ou vardénafil dans les 24 heures, tadalafil dans les 48 heures : contre-indication des dérivés nitrés.</p>
<div class="lab">Autres</div><p>Statine antérieure (valeur de départ du LDL), AINS, corticoïdes, antidépresseurs sérotoninergiques (risque hémorragique), anticancéreux vasospastiques.</p></template>

<template data-pop="i21-s-douleur" data-title="Douleur thoracique ischémique">
<div class="lab">Caractériser</div><p><b>Siège</b> : rétrosternal, diffus, désigné du plat de la main plutôt que d’un doigt. <b>Type</b> : constriction, oppression, brûlure, poids. <b>Durée</b> : plus de 20 minutes dans l’infarctus ; quelques minutes dans l’angor. <b>Déclenchement</b> : repos dans le SCA, ou seuil d’effort qui s’abaisse. <b>Évolution</b> : continue ou par vagues.</p>
<div class="lab">Physiopathologie</div><p>L’ischémie libère adénosine, bradykinine, potassium et ions hydrogène, qui stimulent les terminaisons sympathiques afférentes. Ces fibres entrent dans la moelle entre le 7e segment cervical et le 4e segment thoracique, qu’elles partagent avec la peau du thorax, du bras et du cou : la douleur est diffuse et projetée.</p>
<div class="lab">Diminuent la probabilité</div><p>Douleur en coup de poignard, punctiforme, reproduite par la palpation, modifiée par la position ou la respiration, de quelques secondes. Aucun de ces éléments n’exclut le diagnostic.</p></template>

<template data-pop="i21-s-irrad" data-title="Irradiations de la douleur ischémique">
<p>Bras gauche ou les deux bras (l’irradiation aux deux bras augmente la probabilité d’infarctus), face interne du bras jusqu’aux doigts, cou, mâchoire, dents, région interscapulaire, épigastre.</p>
<div class="lab">Mécanisme</div><p>Convergence viscérosomatique dans les segments médullaires compris entre le 7e cervical et le 4e thoracique.</p>
<div class="lab">Piège</div><p>Une douleur épigastrique isolée, surtout dans l’infarctus inférieur, peut faire évoquer à tort une cause digestive. Une douleur dorsale intense, maximale d’emblée, doit faire évoquer une dissection aortique.</p></template>

<template data-pop="i21-s-vago" data-title="Signes neurovégétatifs">
<div class="lab">Sympathiques</div><p>Sueurs profuses, pâleur, tachycardie, anxiété : fréquents dans l’infarctus antérieur.</p>
<div class="lab">Vagaux</div><p>Nausées, vomissements, bradycardie, hypotension : fréquents dans l’infarctus inférieur, car la paroi inférieure est riche en terminaisons vagales (réflexe de Bezold et Jarisch).</p>
<div class="lab">Valeur</div><p>Les sueurs associées à une douleur thoracique augmentent la probabilité d’infarctus.</p></template>

<template data-pop="i21-s-equiv" data-title="Équivalents ischémiques atypiques">
<p>Dyspnée isolée, fatigue brutale, malaise, épigastralgie, confusion, chute chez le sujet âgé, décompensation cardiaque inexpliquée.</p>
<div class="lab">Terrains</div><p>Femme, sujet âgé, diabétique (neuropathie autonome), insuffisant rénal, patient dément ou postopératoire.</p>
<div class="lab">Conséquence</div><p>Ces patients arrivent plus tard, sont moins souvent coronarographiés et ont une mortalité plus élevée. Le seuil de réalisation d’un ECG et d’une troponine doit être bas.</p></template>

<template data-pop="i21-s-syncope" data-title="Syncope dans le SCA">
<div class="lab">Mécanismes</div><p>Arythmie ventriculaire (fibrillation, tachycardie) ; bloc auriculoventriculaire complet (infarctus inférieur ou antérieur étendu) ; réflexe vagal ; bas débit.</p>
<div class="lab">Conséquence</div><p>Surveillance continue du rythme ; toute syncope au cours d’un SCA est un critère de gravité.</p></template>

<template data-pop="i21-v-ta" data-title="Pression artérielle dans le SCA">
<div class="lab">Technique</div><p>Mesure aux deux bras dès l’arrivée.</p>
<div class="lab">Interprétation</div><p>Asymétrie &gt; 20 mmHg : évoquer une dissection aortique. PAS &lt; 90 mmHg avec hypoperfusion : choc. PAS &gt; 180 mmHg ou pression diastolique &gt; 110 mmHg : contre-indication relative de la fibrinolyse. PAS &lt; 90 mmHg : pas de nitré ni de bêtabloquant.</p>
<div class="lab">Pronostic</div><p>La PAS et la fréquence cardiaque sont des variables du score GRACE.</p></template>

<template data-pop="i21-killip" data-title="Classification de Killip">
<p><b>I</b> — Pas de signe d’insuffisance cardiaque.<br><b>II</b> — Crépitants aux bases (moins de la moitié des champs), troisième bruit, turgescence jugulaire.<br><b>III</b> — Œdème pulmonaire aigu (crépitants au-delà de la moitié des champs).<br><b>IV</b> — Choc cardiogénique.</p>
<div class="lab">Valeur</div><p>Décrite en 1967 sur 250 patients ; la mortalité hospitalière croissait nettement de la classe I à la classe IV. Elle reste un facteur pronostique indépendant et une variable du score GRACE, malgré des mortalités absolues très inférieures aujourd’hui.</p>
<div class="lab">Conséquence thérapeutique</div><p>Killip ≥ II : pas de bêtabloquant intraveineux ; diurétique et vasodilatateur selon la pression. Killip IV : coronarographie immédiate, soins intensifs.</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>« Rien, bases, œdème, choc » : quatre mots pour les quatre classes.</p></template>

<template data-pop="i21-e-souffle" data-title="Souffle systolique nouveau après un infarctus">
<div class="lab">Technique</div><p>Auscultation quotidienne pendant la première semaine, à la pointe et au bord gauche du sternum, en recherchant un frémissement.</p>
<div class="lab">Orientation</div><p><b>Communication interventriculaire</b> : souffle holosystolique rude, parasternal gauche, avec frémissement. <b>Rupture de pilier</b> : souffle apical irradiant vers l’aisselle, parfois bref ou absent. <b>Insuffisance mitrale ischémique</b> sans rupture : souffle plus modeste.</p>
<div class="lab">Conduite</div><p>Échocardiographie immédiate avec Doppler couleur.</p></template>

<template data-pop="i21-e-frott" data-title="Frottement péricardique">
<div class="lab">Technique</div><p>Patient assis, penché en avant, stéthoscope à membrane au bord gauche du sternum, en apnée.</p>
<div class="lab">Sémiologie</div><p>Bruit superficiel, râpeux, à deux ou trois composantes, qui persiste en apnée (contrairement au frottement pleural).</p>
<div class="lab">Signification</div><p>Péricardite des premiers jours d’un infarctus transmural, ou syndrome de Dressler plus tardif. Un épanchement croissant sous anticoagulant doit faire craindre une rupture subaiguë.</p></template>

<template data-pop="i21-e-vd" data-title="Infarctus du ventricule droit">
<div class="lab">Contexte</div><p>Infarctus inférieur par occlusion proximale de la coronaire droite, avant les branches ventriculaires droites.</p>
<div class="lab">Triade</div><p>Hypotension, champs pulmonaires clairs, turgescence jugulaire ; signe de Kussmaul. Bradycardie et bloc auriculoventriculaire fréquents.</p>
<div class="lab">Diagnostic</div><p>Sus-décalage ≥ 0,5 mm en V3R–V4R (≥ 1 mm chez l’homme de moins de 30 ans), présent surtout dans les premières heures ; échocardiographie (ventricule droit dilaté, TAPSE bas).</p>
<div class="lab">Traitement</div><p>Reperfusion rapide ; remplissage prudent si pression veineuse basse ou normale ; pas de nitrés ni de diurétiques ; maintien du synchronisme auriculoventriculaire (stimulation séquentielle, cardioversion d’une fibrillation auriculaire) ; inotrope si nécessaire.</p></template>

<template data-pop="i21-ecg-terr" data-title="Territoires électriques et artères responsables">
<div class="lab">Correspondances</div><p>V1–V4 : antérieur et septal (interventriculaire antérieure). DI, aVL : latéral haut (diagonale, circonflexe). V5–V6 : latéral bas (circonflexe). DII, DIII, aVF : inférieur (coronaire droite ou circonflexe). V7–V9 : postérieur. V3R–V4R : ventricule droit.</p>
<div class="lab">Dérivations contiguës</div><p>Deux dérivations qui explorent le même territoire : par exemple DII et aVF, ou deux précordiales voisines (V2–V3).</p>
<div class="lab">Aide pédagogique, non critère officiel</div><p>« Les chiffres regardent devant, les lettres regardent à gauche ou en bas » : les précordiales (chiffres) explorent la face antérieure ; DI et aVL (L comme latéral gauche) la face latérale ; DII, DIII et aVF (F comme pied) la face inférieure.</p></template>

<template data-pop="i21-ecg-evol" data-title="Évolution de l’ECG de l’infarctus">
<div class="lab">Séquence</div><p>1. Onde T hyperaiguë, ample, large, symétrique (minutes). 2. Sus-décalage du ST, convexe vers le haut, englobant l’onde T (onde de Pardee). 3. Onde Q de nécrose (heures). 4. Retour du ST vers la ligne de base (jours). 5. Onde T négative, symétrique (jours à semaines). 6. Persistance habituelle de l’onde Q.</p>
<div class="lab">Après reperfusion</div><p>Résolution rapide du sus-décalage (&gt; 50 % à 60–90 minutes après fibrinolyse : critère de succès) et inversion précoce de l’onde T, qui signe la reperfusion.</p>
<div class="lab">Piège</div><p>Un sus-décalage persistant plusieurs semaines évoque un anévrisme ventriculaire et non un nouvel infarctus : comparer aux tracés antérieurs.</p></template>

<template data-pop="i21-ecg-post" data-title="Dérivations postérieures V7–V9 et droites">
<div class="lab">Technique</div><p>V7 : ligne axillaire postérieure ; V8 : pointe de l’omoplate ; V9 : bord gauche du rachis ; toutes au niveau du 5e espace intercostal (hauteur de V6). V3R et V4R : symétriques de V3 et V4 à droite.</p>
<div class="lab">Seuils</div><p>Postérieur : sus-décalage ≥ 0,5 mm en V7–V9 (≥ 1 mm chez l’homme de moins de 40 ans). Ventricule droit : ≥ 0,5 mm en V3R–V4R (≥ 1 mm chez l’homme de moins de 30 ans).</p>
<div class="lab">Indication</div><p>Sous-décalage maximal en V1–V3 ; infarctus inférieur (recherche d’une extension postérieure ou droite) ; douleur persistante avec ECG standard non diagnostique.</p></template>

<template data-pop="i21-ecg-sgarb" data-title="Bloc de branche, stimulation et critères de Sgarbossa">
<div class="lab">Problème</div><p>Le bloc de branche gauche et le rythme électro-entraîné modifient la repolarisation : un sus-décalage discordant (opposé au QRS) est normal, ce qui masque l’infarctus.</p>
<div class="lab">Critères de Sgarbossa</div><p>Sus-décalage concordant ≥ 1 mm (5 points) ; sous-décalage concordant ≥ 1 mm en V1–V3 (3 points) ; sus-décalage discordant ≥ 5 mm (2 points). Un score ≥ 3 est très spécifique d’infarctus, mais peu sensible. La modification de Smith remplace le troisième critère par un rapport ST/S discordant ≤ −0,25, plus sensible.</p>
<div class="lab">Règle ESC 2023</div><p>Bloc de branche gauche ou droit, ou stimulation, avec symptômes évoquant une ischémie persistante : stratégie comme un STEMI, que le bloc soit connu ou non.</p></template>

<template data-pop="i21-ecg-dewinter" data-title="Aspect de de Winter">
<div class="lab">Aspect</div><p>Sous-décalage ascendant de 1 à 3 mm au point J dans les précordiales (V1–V6), suivi d’ondes T hautes, pointues et symétriques ; souvent léger sus-décalage en aVR. Absence de sus-décalage classique.</p>
<div class="lab">Signification</div><p>Occlusion aiguë proximale de l’interventriculaire antérieure, dans environ 2 % des infarctus antérieurs selon la série princeps. L’aspect est statique et ne se transforme pas toujours en sus-décalage.</p>
<div class="lab">Conduite</div><p>Équivalent de STEMI : coronarographie immédiate.</p></template>

<template data-pop="i21-ecg-avr" data-title="Sous-décalage diffus et sus-décalage en aVR">
<div class="lab">Aspect</div><p>Sous-décalage ≥ 1 mm dans au moins six dérivations (souvent inférolatérales) et sus-décalage en aVR et/ou V1.</p>
<div class="lab">Signification</div><p>Ischémie sous-endocardique circonférentielle : sténose ou occlusion subtotale du tronc commun, atteinte pluritronculaire, ou ischémie de déséquilibre (anémie, tachycardie).</p>
<div class="lab">Conduite ESC 2023</div><p>Si le patient est instable, coronarographie immédiate ; sinon, stratégie invasive très précoce. Ce n’est pas un équivalent strict de STEMI : une fibrinolyse n’a pas démontré de bénéfice dans cette situation.</p></template>

<template data-pop="i21-ecg-wellens" data-title="Syndrome de Wellens">
<div class="lab">Aspect</div><p>Chez un patient redevenu indolore : ondes T biphasiques (type A) ou profondément et symétriquement négatives (type B) en V2–V3, parfois jusqu’à V6 ; ST peu ou pas décalé ; pas d’onde Q ; troponine normale ou peu élevée.</p>
<div class="lab">Signification</div><p>Sténose critique de l’interventriculaire antérieure proximale, reperfusée spontanément : risque élevé d’infarctus antérieur étendu dans les jours qui suivent.</p>
<div class="lab">Conduite</div><p>Coronarographie ; épreuve d’effort contre-indiquée.</p></template>

<template data-pop="i21-ecg-mimic" data-title="Sus-décalages sans occlusion coronaire">
<div class="lab">Repolarisation précoce</div><p>Sujet jeune ; sus-décalage concave, point J crocheté ; ondes T amples ; stable sur les tracés successifs.</p>
<div class="lab">Péricardite</div><p>Sus-décalage concave diffus, sans territoire ni miroir (sauf aVR et V1) ; sous-décalage du PR ; pas d’onde Q.</p>
<div class="lab">Hypertrophie ventriculaire gauche</div><p>Sus-décalage discordant en V1–V3 avec ondes S profondes.</p>
<div class="lab">Autres</div><p>Anévrisme ventriculaire ancien (onde Q, sus-décalage persistant) ; syndrome de Brugada (V1–V2, aspect en dôme) ; hyperkaliémie ; cardiomyopathie de stress ; hypothermie (onde d’Osborn).</p>
<div class="lab">Règle</div><p>Dans le doute, comparer aux tracés anciens, répéter l’ECG, faire une échocardiographie au lit ; en cas de doute persistant avec des symptômes, la coronarographie tranche.</p></template>

<template data-pop="i21-ecg-q" data-title="Critères de l’onde Q de nécrose (4e définition)">
<p>En l’absence de bloc de conduction ou d’hypertrophie : toute onde Q &gt; 20 ms en V2–V3, ou complexe QS en V2–V3 ; onde Q ≥ 30 ms et ≥ 1 mm de profondeur, ou complexe QS, en DI, DII, aVL, aVF ou V4–V6, dans deux dérivations contiguës ; onde R &gt; 40 ms en V1–V2 avec R/S ≥ 1 et onde T positive concordante (équivalent postérieur).</p>
<div class="lab">Signification</div><p>Séquelle d’infarctus, en général transmural, mais pas toujours : l’IRM montre que la corrélation avec la transmuralité est imparfaite. Un infarctus sans onde Q reste un infarctus.</p></template>
