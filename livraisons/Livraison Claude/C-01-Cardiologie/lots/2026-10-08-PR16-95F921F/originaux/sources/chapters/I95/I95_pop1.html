
<!-- ===== FENÊTRES I95 : notions fondamentales, définitions et causes ===== -->
<template data-pop="i95-baro" data-title="Baroréflexe artériel">
<div class="lab">Définition</div><p>Le baroréflexe est une boucle de régulation rapide de la pression artérielle. Des terminaisons sensibles à l’étirement, dans le sinus carotidien et la crosse aortique, informent le bulbe à chaque battement. Le bulbe ajuste en retour le tonus sympathique des vaisseaux et la fréquence cardiaque.</p>
<div class="lab">Fonctionnement au lever</div><p>La baisse du retour veineux réduit l’étirement des parois artérielles. Les barorécepteurs déchargent moins ; le bulbe lève son inhibition du centre vasomoteur. L’activité sympathique augmente et le tonus vagal diminue en quelques secondes : les artérioles se contractent et le cœur accélère.</p>
<div class="lab">Limites</div><p>La sensibilité du baroréflexe diminue avec l’âge, l’hypertension ancienne et le diabète, parce que les parois artérielles se rigidifient et transmettent moins l’étirement. C’est l’une des raisons pour lesquelles l’hypotension orthostatique augmente avec l’âge.</p>
<div class="lab">Conséquence pratique</div><p>Le gain de fréquence au lever mesure indirectement la branche cardiaque du réflexe. Un gain faible avec une forte chute tensionnelle signale que l’arc efférent sympathique ne répond pas.</p></template>

<template data-pop="i95-autoreg" data-title="Autorégulation du débit sanguin cérébral">
<div class="lab">Principe</div><p>Les artérioles cérébrales modifient leur calibre pour garder un débit cérébral à peu près constant malgré les variations de pression. Elles se dilatent quand la pression baisse et se contractent quand elle monte.</p>
<div class="lab">Plage</div><p>Les travaux classiques situaient cette plage entre environ 60 et 150 mmHg de pression artérielle moyenne chez l’adulte. Les études récentes montrent une grande variabilité individuelle ; ces bornes sont des repères, non des seuils exacts.</p>
<div class="lab">Sous la limite inférieure</div><p>Le débit cérébral devient proportionnel à la pression. Les premiers signes sont un vertige, une vision floue et un ralentissement de la pensée ; une systolique de 50 à 60 mmHg au niveau du cœur fait perdre connaissance (ESC 2018).</p>
<div class="lab">Adaptation</div><p>Chez l’hypertendu chronique, la plage se déplace vers des pressions plus hautes : il devient symptomatique à des pressions que tolère un sujet normotendu. À l’inverse, certains patients dysautonomiques anciens tolèrent des pressions debout très basses sans symptôme, ce qui explique les chutes tensionnelles asymptomatiques.</p></template>

<template data-pop="i95-pooling" data-title="Redistribution du sang au lever">
<div class="lab">Mécanisme</div><p>Au passage debout, la pression hydrostatique augmente dans les veines situées sous le cœur. Les veines, très compliantes, se distendent et retiennent plusieurs centaines de millilitres de sang dans les jambes, le bassin et le territoire splanchnique. Une partie du plasma filtre aussi vers les tissus des jambes.</p>
<div class="lab">Conséquence</div><p>Le volume sanguin central diminue, le remplissage du ventricule baisse et le volume d’éjection chute selon la loi de Frank-Starling. Sans vasoconstriction compensatrice, la pression artérielle baisse.</p>
<div class="lab">Corrélation thérapeutique</div><p>Les manœuvres de contre-pression, la ceinture abdominale et les bas de contention réduisent la capacité de ce réservoir veineux. Le territoire splanchnique étant le plus volumineux, la compression abdominale est plus efficace que la compression des mollets seuls.</p></template>

<template data-pop="i95-initiale" data-title="Hypotension orthostatique initiale">
<div class="lab">Définition</div><p>Baisse transitoire de la pression systolique de plus de 40 mmHg et/ou de la diastolique de plus de 20 mmHg dans les 15 premières secondes du lever actif, avec symptômes d’hypoperfusion cérébrale (consensus de 2011). La pression se normalise rapidement.</p>
<div class="lab">Mécanisme</div><p>Le lever actif contracte les muscles des jambes, puis ceux-ci se relâchent et se dilatent ; la résistance périphérique chute brutalement. Le baroréflexe met quelques secondes à produire la vasoconstriction : pendant ce délai, la pression baisse.</p>
<div class="lab">Terrain</div><p>Adolescents et jeunes adultes grands et minces, mais aussi sujets âgés sous antihypertenseurs. Le lever brusque après une position accroupie ou couchée prolongée la favorise.</p>
<div class="lab">Diagnostic et conduite</div><p>Le tensiomètre manuel ou automatique ne la voit pas ; seule une mesure continue battement par battement la documente. Le diagnostic repose souvent sur l’anamnèse typique. L’explication, le lever en deux temps et la contraction des jambes au lever suffisent habituellement.</p></template>

<template data-pop="i95-retardee" data-title="Hypotension orthostatique retardée">
<div class="lab">Définition</div><p>Chute de pression qui atteint les seuils de l’hypotension orthostatique seulement après trois minutes de station debout ou d’inclinaison.</p>
<div class="lab">Signification</div><p>Elle peut traduire une défaillance sympathique débutante, une hypovolémie modérée ou un effet médicamenteux. Une partie des patients évolue vers une hypotension orthostatique classique au fil des années.</p>
<div class="lab">Diagnostic</div><p>Le test d’orthostatisme se prolonge jusqu’à dix minutes, ou un test d’inclinaison est réalisé. Le profil de la chute aide à la séparer d’une syncope réflexe, où la pression s’effondre brutalement après une phase stable.</p></template>

<template data-pop="i95-neurogene" data-title="Hypotension orthostatique neurogène">
<div class="lab">Définition</div><p>Hypotension orthostatique due à une libération insuffisante de noradrénaline par le système sympathique, parce que la commande centrale, les neurones préganglionnaires ou les neurones postganglionnaires sont atteints.</p>
<div class="lab">Signature clinique</div><p>Chute tensionnelle souvent importante avec un gain de fréquence faible, habituellement inférieur à 10 à 15 /min ; rapport ΔFC/ΔPAS inférieur à 0,5 /min par mmHg. Une hypertension de décubitus et d’autres signes de dysautonomie s’y associent souvent.</p>
<div class="lab">Causes</div><p>Primaires : synucléinopathies (maladie de Parkinson, démence à corps de Lewy, atrophie multisystématisée, dysautonomie pure). Secondaires : diabète, amylose, ganglionopathie auto-immune, neuropathies toxiques ou paranéoplasiques, lésions médullaires hautes.</p>
<div class="lab">Codage</div><p>La CIM-10-GM 2024 exclut de I95.1 l’hypotension orthostatique neurogène de type Shy et Drager, codée G23.8 ; le codage suit la maladie neurologique causale.</p></template>

<template data-pop="i95-ratio" data-title="Rapport ΔFC/ΔPAS">
<div class="lab">Calcul</div><p>Le gain de fréquence cardiaque à trois minutes (en /min) est divisé par la baisse de pression systolique au même moment (en mmHg). Exemple : un gain de 6 /min pour une baisse de 40 mmHg donne 0,15 /min par mmHg.</p>
<div class="lab">Validation</div><p>Norcliffe-Kaufmann et al. (Annals of Neurology, 2018) ont étudié 402 patients en rythme sinusal ayant une hypotension orthostatique. Les 378 patients neurogènes perdaient en moyenne 44 mmHg pour un gain de 8 /min ; les 24 non neurogènes perdaient 21 mmHg pour un gain de 25 /min. Un seuil de 0,492 /min par mmHg séparait les deux groupes avec une sensibilité de 91,3 % et une spécificité de 88,4 %.</p>
<div class="lab">Limites</div><p>Le groupe non neurogène était petit, et les patients neurogènes avaient tous une synucléinopathie. Le rapport n’est pas interprétable en fibrillation auriculaire, sous bêtabloquant, ivabradine ou vérapamil, ni avec un stimulateur cardiaque.</p>
<div class="lab">Conséquence pratique</div><p>Un rapport inférieur à 0,5 oriente vers des tests autonomiques et un avis neurologique ; un rapport supérieur oriente d’abord vers le volume et les médicaments.</p></template>

<template data-pop="i95-hdecub" data-title="Hypertension de décubitus">
<div class="lab">Définition</div><p>Le consensus de 2017 retient une pression couchée ≥ 150 mmHg systolique ou ≥ 90 mmHg diastolique chez un patient ayant une hypotension orthostatique neurogène. Il la décrit comme fréquente, sans en donner une proportion.</p>
<div class="lab">Mécanismes</div><p>Couché, le volume central se rétablit. Un tonus sympathique résiduel non modulé par le baroréflexe, notamment dans les atteintes centrales, l’hypersensibilité des récepteurs dénervés, l’activation du système rénine-angiotensine et les médicaments presseurs élèvent alors la pression.</p>
<div class="lab">Conséquences</div><p>La pression nocturne élevée provoque une natriurèse de pression, donc une polyurie nocturne et une hypovolémie au réveil. À long terme, elle expose aux atteintes d’organes de l’hypertension, comme l’hypertrophie ventriculaire gauche et la maladie rénale.</p>
<div class="lab">Piège</div><p>Elle passe inaperçue si la pression n’est mesurée qu’assis. La mesure couchée fait partie de chaque consultation.</p></template>

<template data-pop="i95-nocturie" data-title="Natriurèse de pression nocturne">
<div class="lab">Mécanisme</div><p>Le rein augmente son excrétion de sodium et d’eau lorsque la pression de perfusion rénale s’élève. Chez le patient dysautonomique couché, la pression nocturne élevée produit une diurèse abondante.</p>
<div class="lab">Conséquence</div><p>Le patient perd du volume pendant la nuit et se lève hypovolémique : l’hypotension orthostatique est maximale le matin, souvent avant le petit-déjeuner.</p>
<div class="lab">Corrélation thérapeutique</div><p>La surélévation de la tête du lit de plus de 10° réduit la pression rénale nocturne et la polyurie (ESC 2018, classe IIa, niveau C). La desmopressine au coucher réduit la diurèse, au prix d’un risque d’hyponatrémie.</p></template>

<template data-pop="i95-postprandial" data-title="Hypotension post-prandiale">
<div class="lab">Définition</div><p>Baisse de la pression systolique d’au moins 20 mmHg après un repas (Jansen et Lipsitz, 1995), habituellement dans les deux heures qui suivent. Elle survient assis comme debout.</p>
<div class="lab">Mécanismes</div><p>Le débit sanguin splanchnique augmente pour la digestion ; l’insuline et des peptides digestifs dilatent les vaisseaux. La compensation sympathique, le baroréflexe et l’augmentation du débit cardiaque sont insuffisants chez le sujet âgé et dysautonomique.</p>
<div class="lab">Importance</div><p>Jansen et Lipsitz la jugeaient distincte de l’hypotension orthostatique et probablement plus fréquente chez le sujet âgé hypertendu. Elle cause des chutes, des syncopes et des malaises après le repas.</p>
<div class="lab">Diagnostic</div><p>Mesure avant puis 30 à 60 minutes après un repas, ou mesure ambulatoire sur 24 heures avec journal des repas. Le consensus de 2017 propose une mesure avant et 30 minutes après un repas riche en glucides.</p>
<div class="lab">Codage</div><p>La CIM-10-GM 2024 ne la nomme pas ; elle est habituellement codée parmi les autres hypotensions (I95.8).</p></template>

<template data-pop="i95-chronique" data-title="Hypotension chronique constitutionnelle">
<div class="lab">Définition</div><p>Pression habituellement basse, stable, sans chute provoquée ni cause identifiée, souvent chez un sujet jeune, mince et sportif. Aucune valeur seuil consensuelle ne la définit.</p>
<div class="lab">Pronostic</div><p>Une pression basse asymptomatique n’est associée à aucun risque cardiovasculaire démontré. Dans la méta-analyse de la Prospective Studies Collaboration (Lancet, 2002), la mortalité cardiovasculaire diminuait continûment jusqu’à 115/75 mmHg, plus basse valeur étudiée.</p>
<div class="lab">Conduite</div><p>Le médecin vérifie la technique de mesure, recherche des symptômes orthostatiques ou post-prandiaux et une cause évidente. Si tout est rassurant, il n’y a rien à traiter. La fatigue ne doit pas être attribuée à une pression basse sans avoir cherché une anémie, une dysthyroïdie, une dépression ou un trouble du sommeil.</p>
<div class="lab">Codage</div><p>Une constatation isolée se code R03.1 ; une hypotension chronique symptomatique et documentée se code I95.8.</p></template>

<template data-pop="i95-cim" data-title="Codage CIM-10-GM 2024 : notes d’exclusion">
<div class="lab">Exclusions de I95</div><p>Le BfArM exclut de I95 le collapsus cardiovasculaire (R57.9), la constatation d’une baisse non spécifique de la pression (R03.1) et le syndrome d’hypotension maternelle (O26.5).</p>
<div class="lab">Exclusions de I95.1</div><p>L’hypotension orthostatique neurogène de type Shy et Drager est codée G23.8 ; le syndrome de tachycardie orthostatique posturale est codé G90.80.</p>
<div class="lab">I95.2</div><p>La classification invite à ajouter un code de cause externe du chapitre 20 (causes externes) pour identifier le médicament responsable.</p>
<div class="lab">Exclusions de R03.1</div><p>Hypotension (I95.-), hypotension orthostatique neurogène (G23.8) et syndrome hypotensif de la mère (O26.5).</p>
<div class="lab">Source</div><p>Extraits du BfArM, CIM-10-GM 2024, blocs I95–I99 et R00–R09. La cartographie vers la CIM-11 n’est pas établie dans ce cours.</p></template>

<template data-pop="i95-r03-0" data-title="R03.0 : élévation tensionnelle sans diagnostic d’hypertension">
<div class="lab">Usage</div><p>La CIM-10-GM 2024 réserve ce code à un épisode hypertensif chez un patient sans diagnostic formel d’hypertension, ou à une découverte fortuite isolée.</p>
<div class="lab">Démarche</div><p>Le médecin répète la mesure dans des conditions standardisées, puis la confirme hors cabinet par automesure ou mesure ambulatoire sur 24 heures. Il recherche un facteur transitoire : douleur, anxiété, sevrage, anti-inflammatoire, décongestionnant, rétention urinaire.</p>
<div class="lab">Issues possibles</div><p>Hypertension confirmée (cours I10), hypertension de la blouse blanche si la pression hors cabinet est normale, ou élévation transitoire expliquée. Dans chaque cas, la constatation initiale cesse d’être un diagnostic.</p>
<div class="lab">Piège</div><p>Une valeur élevée aux urgences n’est ni à traiter immédiatement en l’absence d’atteinte d’organe aiguë, ni à ignorer : elle justifie un contrôle programmé.</p></template>

<template data-pop="i95-r03-1" data-title="R03.1 : baisse non spécifique de la tension">
<div class="lab">Usage</div><p>Pression basse constatée sans symptôme orthostatique et sans diagnostic d’hypotension.</p>
<div class="lab">Trois vérifications</div><p>La technique : brassard adapté, bras au niveau du cœur, appareil validé. Les symptômes : vertige debout, chute, malaise post-prandial. Le contexte : saignement, déshydratation, fièvre, médicament nouveau.</p>
<div class="lab">Issues possibles</div><p>Hypotension chronique constitutionnelle sans traitement ; hypotension orthostatique, iatrogène ou post-prandiale à recoder en I95 ; ou maladie aiguë sous-jacente, comme un sepsis débutant.</p></template>

<template data-pop="i95-epid" data-title="Épidémiologie de l’hypotension orthostatique">
<div class="lab">Sujets âgés</div><p>Saedon et al. (2020) : 22,2 % chez 24 967 personnes de plus de 60 ans vivant à domicile (20 études), 23,9 % en long séjour (6 études). L’hétérogénéité dépassait 90 %.</p>
<div class="lab">Maladie de Parkinson</div><p>Velseboer et al. (2011) : 30,1 % dans 25 études, avec une hétérogénéité importante.</p>
<div class="lab">Suisse</div><p>Aucune donnée suisse publiée n’a été trouvée lors de la recherche du 08.10.2026.</p></template>

<template data-pop="i95-chutes" data-title="Hypotension orthostatique, chutes et mortalité">
<div class="lab">Associations</div><p>Les études d’observation associent l’hypotension orthostatique aux chutes, aux syncopes, au déclin cognitif et à une mortalité accrue. La méta-analyse de Saedon et al. (2020) rappelle ces associations en introduction.</p>
<div class="lab">Causalité</div><p>Le lien est causal pour la chute et la syncope survenant au moment de l’hypotension, car la baisse du débit cérébral explique directement la perte d’équilibre ou de conscience. Pour la mortalité, l’hypotension est en partie un marqueur : elle accompagne l’âge, le diabète, les maladies neurodégénératives et la polymédication, qui expliquent eux-mêmes une partie du risque.</p>
<div class="lab">Conséquence pratique</div><p>Le traitement vise les chutes et les symptômes. Il n’est pas démontré que relever la pression debout réduise la mortalité.</p></template>

<template data-pop="i95-cognition" data-title="Hypotension orthostatique et cognition">
<div class="lab">Hypothèse causale</div><p>Des épisodes répétés de baisse du débit cérébral pourraient léser la substance blanche, surtout dans les territoires de jonction artérielle.</p>
<div class="lab">Hypothèse du marqueur</div><p>Les synucléinopathies et les atteintes vasculaires touchent à la fois le système autonome et le cerveau : l’hypotension serait un témoin de la maladie plutôt que la cause du déclin.</p>
<div class="lab">État des connaissances</div><p>Les deux mécanismes sont plausibles et non exclusifs ; les études d’observation ne permettent pas de trancher. Aucun essai n’a montré qu’un traitement presseur protège la cognition.</p></template>

<template data-pop="i95-synucl" data-title="Synucléinopathies et topographie des lésions">
<div class="lab">Définition</div><p>Maladies neurodégénératives caractérisées par l’agrégation de l’alpha-synucléine : maladie de Parkinson, démence à corps de Lewy, atrophie multisystématisée, dysautonomie pure.</p>
<div class="lab">Atteinte postganglionnaire</div><p>Dans la maladie de Parkinson, la démence à corps de Lewy et la dysautonomie pure, les neurones sympathiques périphériques dégénèrent : la noradrénaline couchée est basse et la scintigraphie cardiaque montre une dénervation.</p>
<div class="lab">Atteinte centrale et préganglionnaire</div><p>Dans l’atrophie multisystématisée, les lésions siègent dans le tronc cérébral et la moelle ; les neurones postganglionnaires restent intacts. La noradrénaline couchée et la scintigraphie cardiaque sont habituellement normales.</p>
<div class="lab">Importance clinique</div><p>L’hypotension orthostatique peut précéder les signes moteurs. Le pronostic et le suivi neurologique diffèrent selon la maladie.</p></template>

<template data-pop="i95-ams" data-title="Atrophie multisystématisée">
<div class="lab">Définition</div><p>Synucléinopathie rare de l’adulte, caractérisée par des inclusions gliales d’alpha-synucléine et une défaillance autonome associée à un syndrome parkinsonien peu sensible à la lévodopa ou à un syndrome cérébelleux.</p>
<div class="lab">Signes autonomes</div><p>Hypotension orthostatique souvent sévère, troubles urinaires précoces, dysfonction érectile, stridor nocturne. Les critères diagnostiques actuels incluent la défaillance autonome.</p>
<div class="lab">Examens</div><p>Noradrénaline couchée et scintigraphie cardiaque habituellement normales ; l’IRM cérébrale peut montrer une atrophie du pont et du cervelet.</p>
<div class="lab">Pronostic</div><p>Évolution plus rapide que la maladie de Parkinson ; prise en charge en centre spécialisé.</p></template>

<template data-pop="i95-paf" data-title="Dysautonomie pure">
<div class="lab">Définition</div><p>Défaillance autonome isolée, sans signe moteur ni cognitif, liée à des dépôts d’alpha-synucléine dans les neurones autonomes périphériques.</p>
<div class="lab">Clinique</div><p>Hypotension orthostatique, souvent avec hypertension de décubitus, troubles urinaires, intestinaux et sexuels, anhidrose.</p>
<div class="lab">Examens</div><p>Noradrénaline couchée très basse, dénervation sympathique cardiaque à la scintigraphie.</p>
<div class="lab">Évolution</div><p>Une partie des patients développe ensuite une maladie de Parkinson, une démence à corps de Lewy ou une atrophie multisystématisée ; le suivi neurologique recherche ces signes. La proportion exacte n’a pas été vérifiée pour ce cours.</p></template>

<template data-pop="i95-diab" data-title="Neuropathie autonome diabétique">
<div class="lab">Mécanisme</div><p>L’hyperglycémie chronique lèse les petites fibres nerveuses, dont les fibres vagales puis sympathiques. L’atteinte est longueur-dépendante et suit souvent la neuropathie périphérique.</p>
<div class="lab">Signes</div><p>Tachycardie de repos par atteinte vagale précoce, perte de variabilité respiratoire de la fréquence, puis hypotension orthostatique, gastroparésie, troubles urinaires et sexuels, anhidrose.</p>
<div class="lab">Importance</div><p>Elle s’associe à un risque cardiovasculaire et à une mortalité accrus. Elle émousse aussi les signaux adrénergiques d’alerte de l’hypoglycémie.</p>
<div class="lab">Piège</div><p>Les inhibiteurs du cotransporteur sodium-glucose de type 2 et les diurétiques peuvent révéler ou aggraver l’hypotension par la perte de volume.</p></template>

<template data-pop="i95-amylose" data-title="Amylose et hypotension orthostatique">
<div class="lab">Types</div><p>Amylose AL, par chaînes légères d’immunoglobuline, et amylose à transthyrétine, héréditaire ou liée à l’âge.</p>
<div class="lab">Mécanismes</div><p>Les dépôts lèsent les fibres autonomes, infiltrent le cœur, ce qui fixe le débit, et peuvent toucher les surrénales et le rein. La combinaison explique des hypotensions sévères.</p>
<div class="lab">Indices</div><p>Syndrome du canal carpien bilatéral, neuropathie douloureuse, cardiopathie hypertrophique avec microvoltage, protéinurie, macroglossie dans l’amylose AL.</p>
<div class="lab">Conséquence pratique</div><p>Le diagnostic change le traitement : chimiothérapie dans l’amylose AL, traitements ciblant la transthyrétine dans l’amylose ATTR. Les antihypertenseurs et les bradycardisants y sont souvent mal tolérés.</p></template>

<template data-pop="i95-iatro" data-title="Hypotension médicamenteuse (I95.2)">
<div class="lab">Fréquence</div><p>L’ESC 2018 désigne les médicaments comme la cause la plus fréquente d’hypotension orthostatique. Elle cite les vasodilatateurs, les diurétiques, les phénothiazines et les antidépresseurs.</p>
<div class="lab">Mécanismes</div><p>Déplétion volémique (diurétiques, inhibiteurs du cotransporteur sodium-glucose de type 2) ; blocage α1 (alphabloquants urologiques, tricycliques, antipsychotiques, trazodone) ; vasodilatation (nitrés, inhibiteurs de la phosphodiestérase de type 5, inhibiteurs calciques dihydropyridiniques) ; action centrale ou dopaminergique (lévodopa, agonistes dopaminergiques, clonidine, opioïdes) ; blocage de l’accélération compensatrice (bêtabloquants).</p>
<div class="lab">Traitement intensif de l’hypertension</div><p>L’ESC 2018 associe l’hypotension orthostatique au nombre de médicaments antihypertenseurs, surtout à partir de trois. La méta-analyse de Juraschek et al. (2020) n’a pas trouvé plus d’hypotension orthostatique sous traitement intensif : la classe du médicament compte autant que l’intensité.</p>
<div class="lab">Conduite</div><p>Revoir chaque molécule, ses horaires et ses associations, puis remplacer plutôt que supprimer lorsque l’indication persiste.</p></template>

<template data-pop="i95-hypovol" data-title="Hypovolémie">
<div class="lab">Causes</div><p>Hémorragie aiguë ou chronique, diarrhée, vomissements, apports insuffisants, fièvre, chaleur, diurèse osmotique d’un diabète déséquilibré, diurétiques, insuffisance surrénalienne.</p>
<div class="lab">Signature</div><p>Le baroréflexe est intact : la fréquence cardiaque monte nettement au lever, souvent de plus de 15 à 20 /min. Le rapport ΔFC/ΔPAS dépasse 0,5.</p>
<div class="lab">Piège</div><p>Une hémorragie digestive peut se révéler par un malaise orthostatique avant que l’hémoglobine ne baisse, car l’hémodilution demande plusieurs heures. Le toucher rectal et la recherche d’un méléna ne doivent pas être oubliés.</p></template>

<template data-pop="i95-surrenale" data-title="Insuffisance surrénalienne et hypotension">
<div class="lab">Mécanismes</div><p>Le déficit en aldostérone, dans la forme primaire, fait perdre du sodium et du volume. Le déficit en cortisol réduit la réponse des vaisseaux aux catécholamines.</p>
<div class="lab">Indices</div><p>Asthénie, amaigrissement, nausées, mélanodermie dans la forme primaire, hyponatrémie, hyperkaliémie, hypoglycémie.</p>
<div class="lab">Urgence</div><p>La crise surrénalienne associe hypotension, douleurs abdominales, vomissements et confusion. L’hydrocortisone par voie intraveineuse est administrée immédiatement, après un prélèvement de cortisol et d’ACTH si cela ne retarde pas le traitement.</p></template>

<template data-pop="i95-decond" data-title="Déconditionnement après alitement">
<div class="lab">Mécanisme</div><p>L’alitement réduit le volume plasmatique en quelques jours, diminue la masse et le tonus des muscles des jambes et la compliance veineuse se modifie. Le baroréflexe s’adapte moins bien au lever.</p>
<div class="lab">Clinique</div><p>Intolérance orthostatique avec tachycardie lors de la reprise de la marche, après une hospitalisation ou une maladie aiguë.</p>
<div class="lab">Conduite</div><p>Lever progressif, hydratation, reprise d’une activité physique graduée, en commençant par des exercices en position couchée ou assise.</p></template>
