<section class="ilot" id="i95-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 76 ans consulte après deux chutes survenues le matin, peu après le lever. Il a aussi perdu connaissance quelques secondes à la fin d’un petit-déjeuner, assis à table, puis s’est réveillé sans confusion. Il a une maladie de Parkinson depuis six ans et un diabète de type 2 depuis quinze ans. Il prend de la lévodopa avec du bensérazide, une association de lisinopril et d’hydrochlorothiazide pour une hypertension, et de la tamsulosine pour une hypertrophie prostatique.</p>
<p>Couché depuis cinq minutes, il a une pression de 164/90 mmHg et une fréquence de 70/min. Debout, la pression vaut 128/76 mmHg à une minute et 120/72 mmHg à trois minutes, avec une fréquence de 74/min. Il dit que « la tête tourne » et que sa vue se brouille. Cinq questions organisent le chapitre : <b>s’agit-il d’une hypotension orthostatique, est-elle neurogène, quelle part revient aux médicaments, la perte de connaissance est-elle à haut risque, et comment relever la pression debout sans aggraver l’hypertension couchée ?</b></p>
<p>À la fin du chapitre, le médecin assistant sait mesurer et interpréter un test d’orthostatisme, distinguer une forme neurogène d’une forme non neurogène, reconnaître une hypotension post-prandiale ou iatrogène, et coder correctement une constatation tensionnelle isolée. Il sait conduire la révision médicamenteuse, les mesures non médicamenteuses et la prescription de midodrine ou de fludrocortisone, en surveillant l’hypertension de décubitus. Il sait enfin orienter une pression élevée isolée vers la démarche de l’hypertension et une syncope réflexe vers son cours propre.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i95-baro">baroréflexe artériel (boucle de régulation de la pression debout)</button>, l’<button class="w" data-k="i95-autoreg">autorégulation du débit sanguin cérébral (pourquoi les symptômes apparaissent sous un seuil)</button> et la <button class="w" data-k="i95-pooling">redistribution du sang au lever (stockage veineux sous le diaphragme)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i95-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La pression artérielle n’a pas de seuil bas universel qui définirait une maladie. Une pression de 95/60 mmHg est fréquente chez une jeune femme mince en bonne santé ; elle n’entraîne ni symptôme ni lésion d’organe. La pression ne devient pathologique que lorsqu’elle ne suffit plus à perfuser le cerveau ou les autres organes dans une situation donnée, le plus souvent la station debout ou la période qui suit un repas. C’est pourquoi les définitions reposent sur une <b>chute</b> provoquée par une situation, et non sur une valeur absolue isolée.</p>
<h3>1.1 Hypotension orthostatique</h3>
<p>Le consensus international de 2011 définit l’<b>hypotension orthostatique classique</b> comme une baisse soutenue de la pression systolique d’au moins 20 mmHg ou de la diastolique d’au moins 10 mmHg, dans les trois minutes qui suivent le passage debout ou une inclinaison d’au moins 60°. La recommandation ESC 2018 sur la syncope reprend ces seuils et ajoute un critère absolu : une pression systolique debout inférieure à 90 mmHg. Ce seuil absolu sert surtout chez les patients dont la systolique couchée est inférieure à 110 mmHg, car une chute de 20 mmHg à partir de 100 mmHg compromet déjà la perfusion cérébrale. Une baisse isolée de la diastolique est très rare et pèse peu dans le diagnostic.</p>
<p>Le même consensus décrit deux formes temporelles supplémentaires. Leur reconnaissance évite deux erreurs : conclure à l’absence d’hypotension parce que la mesure à trois minutes est normale, ou attribuer à une dysautonomie un malaise banal des premières secondes du lever.</p>
<table class="t"><tr><th>Forme</th><th>Moment de la chute</th><th>Seuil (consensus 2011)</th><th>Mécanisme dominant</th></tr>
<tr><td><button class="w" data-k="i95-initiale">Initiale</button></td><td>Dans les 15 premières secondes debout, avec retour à la normale</td><td>Baisse transitoire &gt; 40 mmHg de la systolique et/ou &gt; 20 mmHg de la diastolique, avec symptômes</td><td>Décalage entre la vasodilatation musculaire du lever et le délai du baroréflexe</td></tr>
<tr><td>Classique</td><td>Dans les 3 minutes</td><td>Baisse soutenue ≥ 20 mmHg systolique ou ≥ 10 mmHg diastolique ; systolique &lt; 90 mmHg (ESC 2018)</td><td>Défaut de vasoconstriction ou volume insuffisant</td></tr>
<tr><td><button class="w" data-k="i95-retardee">Retardée</button></td><td>Au-delà de 3 minutes</td><td>Mêmes seuils, atteints tardivement</td><td>Défaillance autonome débutante, hypovolémie, médicaments</td></tr></table>
<p>La lecture de ce tableau commence par le moment de la chute. Une femme de 25 ans qui voit flou deux secondes en se levant brusquement, puis va bien, a une forme initiale, presque toujours bénigne. Un homme de 70 ans diabétique, normal à trois minutes mais symptomatique après dix minutes de station debout, a peut-être une forme retardée : seule une mesure prolongée ou un test d’inclinaison la montre. Chez un patient hypertendu couché, le consensus propose de retenir une chute systolique de 30 mmHg, car une chute de 20 mmHg à partir de 180 mmHg laisse une pression de perfusion suffisante.</p>
<h3>1.2 Neurogène ou non neurogène</h3>
<p>Le lever déplace du sang vers les jambes et l’abdomen. Normalement, le système sympathique resserre les artérioles et accélère le cœur en quelques secondes. Dans l’<button class="w" data-k="i95-neurogene">hypotension orthostatique neurogène (défaillance du sympathique)</button>, la libération de noradrénaline échoue : la pression chute fortement et la fréquence cardiaque monte peu. Dans la forme non neurogène, le réflexe fonctionne, mais il manque du volume ou un médicament s’oppose à la vasoconstriction : la fréquence monte alors nettement. Le <button class="w" data-k="i95-ratio">rapport ΔFC/ΔPAS (fréquence gagnée par mmHg perdu)</button> exploite cette différence ; un rapport inférieur à 0,5 /min par mmHg oriente vers une cause neurogène.</p>
<h3>1.3 Les codes I95 et R03 de la CIM-10-GM 2024</h3>
<p>La classification sépare une maladie hypotensive établie (I95) d’une simple constatation tensionnelle sans diagnostic (R03). Ce codage a une conséquence clinique : il oblige à se demander si une valeur isolée a été confirmée et expliquée. Les <button class="w" data-k="i95-cim">notes d’exclusion du BfArM (où coder l’hypotension neurogène, le choc et la grossesse)</button> renvoient plusieurs situations vers d’autres chapitres.</p>
<table class="t"><tr><th>Code</th><th>Intitulé</th><th>Contenu clinique</th></tr>
<tr><td>I95.0</td><td>Hypotension idiopathique</td><td>Hypotension symptomatique sans cause retrouvée après bilan complet</td></tr>
<tr><td>I95.1</td><td>Hypotension orthostatique</td><td>Hypotension posturale ; la forme neurogène de type Shy et Drager est codée G23.8 et le syndrome de tachycardie orthostatique posturale G90.80</td></tr>
<tr><td>I95.2</td><td>Hypotension médicamenteuse</td><td>Code complémentaire de cause externe pour identifier le médicament</td></tr>
<tr><td>I95.8</td><td>Autres hypotensions</td><td>Comprend l’<button class="w" data-k="i95-chronique">hypotension chronique</button> ; l’<button class="w" data-k="i95-postprandial">hypotension post-prandiale</button> y est habituellement rattachée</td></tr>
<tr><td>I95.9</td><td>Hypotension, sans précision</td><td>Code d’attente, à remplacer dès que le mécanisme est connu</td></tr>
<tr><td>R03.0</td><td>Élévation de la tension sans diagnostic d’hypertension</td><td><button class="w" data-k="i95-r03-0">Épisode hypertensif ou découverte isolée (démarche vers I10)</button></td></tr>
<tr><td>R03.1</td><td>Baisse non spécifique de la tension</td><td><button class="w" data-k="i95-r03-1">Pression basse constatée sans diagnostic d’hypotension</button></td></tr></table>
<p>Ce tableau se lit de bas en haut lorsque le patient arrive avec un chiffre : une constatation commence en R03, puis migre vers I95 ou I10 quand l’enquête aboutit. Le rattachement de l’hypotension post-prandiale à I95.8 est une convention de codage usuelle ; la CIM-10-GM ne la nomme pas expressément. Le collapsus avec hypoperfusion (R57.9) et le syndrome hypotensif de la mère (O26.5) sont exclus de I95.</p>
<div class="trap"><span class="k">Piège</span>Le code I95.1 ne doit pas masquer une cause neurologique. Si le patient du cas présente une hypotension orthostatique due à une atrophie multisystématisée, la classification oriente vers la maladie neurologique causale. Le codage suit le diagnostic, et le diagnostic suit l’enquête étiologique.</div>
<div class="key"><b>À retenir.</b> L’hypotension se définit par une chute provoquée, surtout orthostatique : ≥ 20/10 mmHg dans les trois minutes, ou systolique debout &lt; 90 mmHg. Les formes initiale et retardée échappent à la mesure à trois minutes. Une faible accélération cardiaque oriente vers une cause neurogène. Une valeur isolée sans diagnostic se code en R03 jusqu’à la conclusion de l’enquête. L’îlot suivant mesure la fréquence de ces situations.</div>
</section>

<section class="ilot" id="i95-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>L’hypotension orthostatique augmente avec l’âge, parce que la sensibilité du baroréflexe diminue, que les artères se rigidifient et que les médicaments s’accumulent. Une méta-analyse de 2020 (Saedon et al.) a regroupé 20 études de personnes vivant à domicile après 60 ans, soit 24 967 participants. Elle estime la prévalence à <b>22,2 %</b> (intervalle de confiance à 95 % : 17 à 28 %), et à <b>23,9 %</b> en institution de long séjour. L’hétérogénéité dépassait 90 %, car les études mesuraient différemment la position, le moment et l’appareil : ces chiffres donnent un ordre de grandeur, non une valeur exacte (<button class="w" data-k="i95-epid">synthèse des données de prévalence</button>).</p>
<p>Dans la maladie de Parkinson, une méta-analyse de 25 études (Velseboer et al., 2011) estime la prévalence ponctuelle à <b>30,1 %</b> (intervalle de confiance à 95 % : 22,9 à 38,4 %), avec une forte hétérogénéité. La recommandation ESC 2018 désigne les <button class="w" data-k="i95-iatro">médicaments (première cause d’hypotension orthostatique)</button> comme la cause la plus fréquente. L’<button class="w" data-k="i95-postprandial">hypotension post-prandiale</button> serait, chez le sujet âgé hypertendu, plus fréquente encore que l’hypotension orthostatique selon la revue de Jansen et Lipsitz (1995).</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée suisse publiée de prévalence de l’hypotension orthostatique ni de l’hypotension post-prandiale n’a été trouvée lors de la recherche du 08.10.2026. Les chiffres cités proviennent de méta-analyses internationales.</div>
<p>Le pronostic se discute en deux temps. L’hypotension orthostatique est <button class="w" data-k="i95-chutes">associée aux chutes, aux syncopes, au déclin cognitif et à une mortalité accrue</button>. Ces associations proviennent d’études d’observation : elles ne prouvent pas que la chute tensionnelle cause directement ces événements, car l’âge, le diabète, la maladie de Parkinson et la polymédication les expliquent aussi en partie. Le lien causal est en revanche direct pour la chute et la syncope : quand la pression debout passe sous le seuil d’autorégulation cérébrale, le cerveau reçoit moins d’oxygène et le patient vacille ou perd connaissance. Le lien avec la <button class="w" data-k="i95-cognition">cognition (hypoperfusion répétée ou marqueur de maladie)</button> reste discuté.</p>
<p>La pression basse constitutionnelle, sans symptôme ni chute provoquée, a un pronostic différent. Dans la méta-analyse de la <i>Prospective Studies Collaboration</i> (Lancet, 2002), la mortalité cardiovasculaire décroissait de façon continue jusqu’à des pressions de 115/75 mmHg, plus basse valeur étudiée. Une pression basse asymptomatique n’est donc pas une maladie à traiter.</p>
<button class="pareto-btn ui" data-k="pareto-i95-def">▲ Loi de Pareto — Définitions, codage et épidémiologie</button>
</section>

<section class="ilot" id="i95-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La chaîne causale se résume ainsi : <b>passage debout → stockage veineux sous le diaphragme → baisse du retour veineux et du débit → détection par les barorécepteurs → vasoconstriction et accélération sympathiques → pression maintenue</b>. L’hypotension survient lorsqu’un maillon cède : le volume, le capteur, l’arc nerveux, le neurotransmetteur ou l’effecteur vasculaire.</p>
<h3>3.1 Le stress orthostatique</h3>
<p>Au lever, la gravité <button class="w" data-k="i95-pooling">déplace plusieurs centaines de millilitres de sang vers les veines des jambes et du territoire splanchnique</button>. Le retour veineux diminue, le remplissage du ventricule baisse, et le volume d’éjection chute selon la loi de Frank-Starling. Sans compensation, la pression artérielle tomberait en quelques secondes. La recommandation ESC 2018 rappelle qu’une pression systolique de 50 à 60 mmHg au niveau du cœur, soit 30 à 45 mmHg au niveau du cerveau en position debout, provoque une perte de connaissance, et qu’un arrêt du débit cérébral de 6 à 8 secondes suffit à la déclencher.</p>
<h3>3.2 La compensation normale par le baroréflexe</h3>
<p>Les <button class="w" data-k="i95-baro">barorécepteurs du sinus carotidien et de la crosse aortique</button> détectent la baisse d’étirement de la paroi. Le tronc cérébral réduit alors le tonus vagal et augmente l’activité sympathique. Les terminaisons sympathiques libèrent de la noradrénaline sur les récepteurs α1 des artérioles, surtout splanchniques et musculaires : la résistance périphérique augmente. La fréquence cardiaque gagne habituellement 10 à 20 /min. Chez le sujet sain, la systolique baisse peu ou pas, et la diastolique monte légèrement.</p>
<h3>3.3 L’échec neurogène</h3>
<p>Dans une défaillance autonome, la commande nerveuse ou les terminaisons sympathiques ne libèrent plus assez de noradrénaline. La lésion peut être <button class="w" data-k="i95-synucl">centrale et préganglionnaire (atrophie multisystématisée) ou périphérique et postganglionnaire (maladie de Parkinson, dysautonomie pure, neuropathies)</button>. Les artérioles ne se contractent pas, la pression chute davantage, et le cœur, privé lui aussi de stimulation sympathique, accélère à peine. Le patient du cas perd 44 mmHg de systolique pour un gain de 4 /min : c’est la signature d’un échec neurogène.</p>
<h3>3.4 L’hypertension de décubitus et la diurèse nocturne</h3>
<p>Le consensus de 2017 décrit l’<button class="w" data-k="i95-hdecub">hypertension de décubitus (pression élevée couchée)</button> comme fréquente chez les patients ayant une hypotension orthostatique neurogène ; il n’en donne pas de proportion chiffrée. Couché, le sang revient vers le thorax ; un tonus sympathique résiduel non modulé, une hypersensibilité des récepteurs dénervés ou des médicaments presseurs élèvent alors la pression. La nuit, cette pression élevée augmente la filtration et l’excrétion de sodium par le rein : c’est la <button class="w" data-k="i95-nocturie">natriurèse de pression nocturne (polyurie et hypovolémie du matin)</button>. Le patient se lève avec un volume plasmatique réduit, ce qui explique que l’hypotension soit maximale le matin.</p>
<h3>3.5 L’hypotension post-prandiale</h3>
<p>Après un repas, le débit sanguin splanchnique augmente nettement pour la digestion. L’insuline et des peptides digestifs vasodilatateurs dilatent ce territoire. Normalement, le sympathique resserre les autres territoires et accélère le cœur. Chez le sujet âgé ou dysautonomique, cette compensation manque : la pression baisse d’autant plus que le repas est riche en glucides et abondant. Le malaise du patient à la fin de son petit-déjeuner relève de ce mécanisme.</p>
<h3>3.6 Pourquoi les symptômes surviennent</h3>
<p>Le cerveau maintient son débit constant dans une plage de pression grâce à son <button class="w" data-k="i95-autoreg">autorégulation (dilatation des artérioles cérébrales)</button>. Sous la limite inférieure de cette plage, le débit cérébral suit la pression : le patient ressent un vertige, une vision floue, puis perd connaissance. Les muscles du cou et des épaules, situés au-dessus du cœur, reçoivent moins de sang : leur ischémie explique la <button class="w" data-k="i95-s-cintre">douleur « en cintre » (nuque et épaules)</button>.</p>

<section class="ilot" id="i95-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Les causes se rangent selon le maillon atteint. Ce classement n’est pas théorique : il détermine le traitement. Une hypovolémie se corrige par des liquides, un médicament s’arrête ou se remplace, et une défaillance autonome demande un traitement symptomatique au long cours.</p>
<div class="two">
<div class="card"><h4>Médicaments et substances (cause la plus fréquente)</h4><p><button class="w" data-k="i95-iatro">Alphabloquants, diurétiques, nitrés, inhibiteurs de la phosphodiestérase de type 5, antidépresseurs tricycliques, antipsychotiques, agonistes dopaminergiques et lévodopa, opioïdes, alcool</button>. Le mécanisme diffère : déplétion volémique pour les diurétiques, blocage des récepteurs α1 pour les alphabloquants et plusieurs psychotropes, vasodilatation veineuse pour les nitrés.</p></div>
<div class="card"><h4>Hypovolémie et déconditionnement</h4><p><button class="w" data-k="i95-hypovol">Hémorragie, diarrhée, vomissements, apports insuffisants, diurèse osmotique du diabète déséquilibré</button>. Le <button class="w" data-k="i95-decond">déconditionnement après alitement</button> réduit le volume plasmatique et le tonus veineux en quelques jours. L’<button class="w" data-k="i95-surrenale">insuffisance surrénalienne</button> associe perte de sodium et défaut de réponse vasculaire.</p></div>
<div class="card"><h4>Défaillance autonome primaire</h4><p><button class="w" data-k="i95-synucl">Synucléinopathies</button> : maladie de Parkinson, démence à corps de Lewy, <button class="w" data-k="i95-ams">atrophie multisystématisée</button> et <button class="w" data-k="i95-paf">dysautonomie pure</button>. L’hypotension peut y précéder de plusieurs années les signes moteurs ou cognitifs.</p></div>
<div class="card"><h4>Défaillance autonome secondaire</h4><p><button class="w" data-k="i95-diab">Neuropathie autonome diabétique</button>, <button class="w" data-k="i95-amylose">amylose AL ou à transthyrétine</button>, ganglionopathie auto-immune, neuropathie paranéoplasique, carence en cobalamine, insuffisance rénale chronique, lésion médullaire haute. Ces causes se recherchent parce que plusieurs se traitent.</p></div>
<div class="card"><h4>Causes cardiaques</h4><p>Un débit fixe empêche la compensation : rétrécissement aortique serré, cardiomyopathie hypertrophique obstructive, insuffisance cardiaque sévère, bradycardie ou incompétence chronotrope. Une hypotension orthostatique chez un patient porteur d’une cardiopathie impose de chercher une cause cardiaque de syncope avant de conclure.</p></div>
<div class="card"><h4>Hypotension chronique et idiopathique</h4><p>Une pression basse constante, sans chute provoquée ni cause, chez un sujet jeune et mince, relève de l’<button class="w" data-k="i95-chronique">hypotension chronique constitutionnelle</button>. Le diagnostic d’hypotension idiopathique (I95.0) n’est porté qu’après exclusion des causes ci-dessus.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer une hypotension orthostatique à l’âge seul chez un patient polymédiqué. Chez le patient du cas, l’hydrochlorothiazide réduit le volume, la tamsulosine bloque les récepteurs α1 et la lévodopa dilate les vaisseaux : ces trois médicaments s’ajoutent à la maladie de Parkinson et au diabète. Chaque médicament se discute avant tout traitement presseur.</div>
<div class="key"><b>À retenir.</b> Les médicaments sont la première cause. Les synucléinopathies et le diabète dominent les causes neurogènes. Une cardiopathie à débit fixe doit être exclue. L’hypotension idiopathique est un diagnostic d’exclusion. L’anamnèse, décrite ensuite, oriente d’emblée vers l’un de ces groupes.</div>
<button class="pareto-btn ui" data-k="pareto-i95-physio">▲ Loi de Pareto — Physiopathologie et étiologies</button>
</section>

<section class="ilot" id="i95-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit quatre buts : établir le lien entre les symptômes et la position ou les repas, rechercher les signes d’une dysautonomie étendue, dresser la liste exacte des médicaments, et repérer les éléments d’une syncope cardiaque à haut risque. Le consensus de 2017 recommande de poser au moins une question simple à tout patient à risque : « Avez-vous des symptômes en vous levant ou dans les trois à cinq minutes qui suivent, qui s’améliorent quand vous vous asseyez ou vous couchez ? » Il cible cinq groupes : maladies neurodégénératives avec atteinte autonome, chutes ou syncopes inexpliquées, neuropathies périphériques, personnes de 70 ans ou plus fragiles ou polymédiquées, et symptômes survenant seulement debout.</p>
<h3>5.1 Terrains et antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i95-iatro">Liste complète des médicaments, avec les heures de prise</button>, y compris les gouttes ophtalmiques bêtabloquantes et les traitements urologiques</li><li>Maladie de Parkinson, troubles de la marche, tremblement, troubles cognitifs fluctuants ou hallucinations visuelles, qui orientent vers une synucléinopathie</li><li>Diabète ancien, neuropathie périphérique, rétinopathie : la neuropathie autonome accompagne habituellement les autres complications microvasculaires</li></ul>
<ul><li>Cardiopathie connue, souffle, dyspnée d’effort : une cause cardiaque change le pronostic</li><li>Pertes digestives, saignement, apports réduits, alitement récent</li><li>Amaigrissement, syndrome du canal carpien bilatéral, neuropathie douloureuse : ces éléments évoquent une <button class="w" data-k="i95-amylose">amylose</button></li><li>Consommation d’alcool et cancer connu</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i95-s-vertige">Vertige non rotatoire, sensation de tête vide en position debout</button></li><li><button class="w" data-k="i95-s-visuel">Vision floue ou grisée, « voile noir »</button></li><li><button class="w" data-k="i95-s-fatigue">Fatigue, faiblesse des jambes, difficulté à rester debout</button></li><li><button class="w" data-k="i95-s-cintre">Douleur de la nuque et des épaules « en cintre »</button></li></ul>
<ul><li><button class="w" data-k="i95-s-cogn">Ralentissement de la pensée en position debout</button></li><li><button class="w" data-k="i95-s-chute">Chutes inexpliquées, surtout le matin</button></li><li><button class="w" data-k="i95-s-syncope">Syncope : circonstances, prodromes, durée</button></li><li>Absence de symptôme : une chute tensionnelle mesurée peut rester asymptomatique, surtout quand elle est lente et que l’autorégulation cérébrale s’est adaptée</li></ul></div>
<p>Les circonstances aggravantes ont une valeur diagnostique, car elles découlent du mécanisme. Les symptômes prédominent le matin, à cause de la diurèse nocturne. Ils augmentent après un repas, à la chaleur, après un effort, après l’alcool et lors d’une station debout immobile. Le patient décrit souvent qu’il s’assoit ou s’accroupit pour les faire céder.</p>
<p>Le médecin recherche ensuite les <button class="w" data-k="i95-s-dysauto">autres signes de dysautonomie (vessie, intestin, sexualité, sudation)</button> et un <button class="w" data-k="i95-s-rbd">trouble du comportement en sommeil paradoxal</button>. Ce trouble, signalé par un conjoint qui décrit des rêves agis la nuit, précède souvent de plusieurs années une synucléinopathie.</p>
<h3>5.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme iatrogène typique</h4><p>Femme de 81 ans, hypertendue. Depuis l’ajout d’un diurétique il y a trois semaines, elle a des vertiges en se levant. Debout, sa pression passe de 138/78 à 112/70 mmHg, avec une fréquence de 72 à 92 /min. La forte accélération oriente vers une cause non neurogène ; le diurétique est remplacé.</p></div>
<div class="card"><h4>Forme neurogène</h4><p>Homme de 62 ans, dysfonction érectile, constipation, rêves agis depuis cinq ans. Il chute en sortant de la douche. Couché 158/92 mmHg, debout 96/64 mmHg à trois minutes, fréquence de 68 à 73 /min. Ce tableau évoque une synucléinopathie débutante.</p></div>
<div class="card"><h4>Forme post-prandiale</h4><p>Femme de 84 ans en institution, somnolente et chancelante 30 à 60 minutes après le repas de midi, assise comme debout. La mesure avant et après le repas montre une baisse systolique de 28 mmHg. Le test d’orthostatisme à jeun est normal.</p></div>
<div class="card"><h4>Forme initiale bénigne</h4><p>Adolescente de 16 ans, grande et mince, qui voit noir quelques secondes en se levant vite. La mesure à une et trois minutes est normale. Le mécanisme est un retard physiologique du baroréflexe ; l’explication et les manœuvres de contre-pression suffisent.</p></div></div>
<div class="key"><b>À retenir.</b> Les symptômes liés à la position, au matin et aux repas orientent vers une hypotension. La recherche d’une dysautonomie étendue oriente vers une cause neurogène. La liste des médicaments est la question la plus rentable. L’examen clinique transforme ensuite cette suspicion en mesure.</div>
</section>

<section class="ilot" id="i95-6"><h2><span class="n">6</span>Examen clinique et test d’orthostatisme</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux couché puis debout, anthropométrie, puis signes ciblés. Le temps central est le <b>test d’orthostatisme actif</b>, que l’ESC 2018 indique lors de toute première évaluation d’une syncope (classe I, niveau C).</p>
<h3>6.1 État général, signes vitaux et anthropométrie</h3>
<p>Le médecin apprécie l’hydratation, la pâleur et la perfusion cutanée, car une <button class="w" data-k="i95-e-volemie">hypovolémie (signes et limites)</button> change la conduite. Il mesure la pression et la fréquence après cinq minutes de repos couché, puis réalise le <button class="w" data-k="i95-e-test">test d’orthostatisme actif (technique et pièges)</button> avec des mesures à une et trois minutes debout, prolongées jusqu’à dix minutes si l’anamnèse est évocatrice. Il calcule le <button class="w" data-k="i95-e-fc">gain de fréquence cardiaque et le rapport ΔFC/ΔPAS</button>. Une pression couchée élevée signale une <button class="w" data-k="i95-e-decub">hypertension de décubitus (seuils, conséquences)</button>. Le poids et l’indice de masse corporelle complètent l’examen : un amaigrissement récent oriente vers une amylose, un cancer ou une insuffisance surrénalienne.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Signes de cause neurologique</b><ul><li><button class="w" data-k="i95-e-neuro">Syndrome parkinsonien, syndrome cérébelleux, signes pyramidaux</button></li><li>Neuropathie périphérique : abolition des réflexes achilléens, hypoesthésie en chaussettes, perte de la sensibilité vibratoire</li><li>Peau sèche des pieds par anhidrose, qui traduit l’atteinte des fibres sympathiques sudorales</li></ul></div>
<div><b>Signes de cause cardiaque ou générale</b><ul><li>Souffle éjectionnel irradiant aux carotides : rétrécissement aortique, qui limite le débit</li><li>Bradycardie de repos, irrégularité du pouls</li><li>Mélanodermie et hypotension : insuffisance surrénalienne primaire</li><li>Macroglossie, ecchymoses périorbitaires : amylose AL</li></ul></div></div>
<p>Le patient du cas illustre la lecture du test. Sa systolique passe de 164 à 120 mmHg à trois minutes : la chute de 44 mmHg dépasse le seuil de 20 mmHg, et même celui de 30 mmHg retenu en cas d’hypertension couchée. Sa fréquence gagne 4 /min ; le rapport vaut 4/44, soit environ 0,09 /min par mmHg, bien sous 0,5. Les symptômes reproduits pendant le test confirment le lien avec la chute.</p>
<div class="trap"><span class="k">Piège</span>Un test normal n’exclut pas le diagnostic. La chute est maximale le matin, après un repas ou après la prise des médicaments, et elle peut être retardée au-delà de trois minutes. Le test se répète au bon moment, ou se complète par une mesure ambulatoire ou un test d’inclinaison. Inversement, une fibrillation auriculaire ou un bêtabloquant rendent le gain de fréquence ininterprétable.</div>
<div class="key"><b>À retenir.</b> Le test d’orthostatisme se fait couché cinq minutes puis debout à une et trois minutes, voire dix. Une chute ≥ 20/10 mmHg ou une systolique &lt; 90 mmHg avec reproduction des symptômes établit le diagnostic. Le gain de fréquence oriente le mécanisme. L’îlot suivant organise ces résultats en démarche diagnostique.</div>
