<template data-pop="i80-pompe" data-title="Pompe du mollet et hypertension veineuse"><p>La contraction du mollet comprime les veines profondes. Les valvules orientent le sang vers le cœur. Pendant le relâchement, le réseau se remplit. La répétition de ce cycle aide le retour contre la gravité.</p><p>Une obstruction empêche la sortie ; une insuffisance valvulaire permet le reflux. Après une thrombose, les deux peuvent persister. L’œdème et la gêne peuvent donc durer même lorsque l’épisode aigu est traité.</p><div class="key"><b>À retenir.</b> La mobilisation et la compression, lorsqu’elles sont indiquées, répondent à la physiologie veineuse. Elles ne remplacent pas l’évaluation d’une thrombose aiguë.</div>
<div class="lab">Syndrome post-thrombotique</div><p>Le thrombus entretient une réaction inflammatoire qui remanie la paroi et détruit les valvules. Après recanalisation, le sang reflue ; si la recanalisation reste incomplète, notamment au niveau iliaque, l’obstruction persiste. Ces mécanismes maintiennent une pression veineuse élevée pendant la marche, qui fait filtrer le liquide vers les tissus : œdème, hyperpigmentation, induration, puis ulcère. Les premiers signes apparaissent dans les 3 mois et peuvent s’aggraver pendant des années.</p>
<div class="lab">Score de Villalta</div><p>Il additionne cinq symptômes et six signes, cotés de 0 à 3 dans la jambe atteinte. Un total de 5 à 9 définit un syndrome léger, de 10 à 14 un syndrome modéré, au-delà, ou devant tout ulcère, un syndrome sévère.</p>
<div class="lab">Facteurs de risque</div><p>L’âge, l’obésité, une récidive homolatérale, une thrombose proximale, une insuffisance veineuse préexistante et une anticoagulation insuffisante pendant les 3 premiers mois augmentent le risque.</p>
<div class="lab">Ce qui change la décision</div><p>Une anticoagulation bien conduite dès le début limite l’extension du thrombus. Une compression de 30 à 40 mmHg posée dans les 24 heures réduit la douleur, l’œdème et l’obstruction résiduelle (ESVS 2021, classe I, niveau A). Les bas peuvent s’arrêter à 6 ou 12 mois quand le score de Villalta reste bas.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESVS 2021 sur les thromboses veineuses, sections 2.1.3, 2.7.2 à 2.7.5 et 2.8, tableau 17, recommandations 31 et 33.</p>
</template>
<template data-pop="i80-fibrinolyse" data-title="Anticoagulation, fibrinolyse et D-dimères"><p>La thrombine transforme le fibrinogène en fibrine. Le réseau stabilisé peut ensuite être dégradé par la plasmine. Cette dégradation libère notamment des D-dimères.</p><p>L’anticoagulant freine surtout la génération de thrombine et l’extension. Il ne dissout pas immédiatement tout le caillot. Les mécanismes physiologiques assurent une partie du remodelage. Une thrombolyse stimule la dissolution et expose à un risque hémorragique important.</p><div class="trap"><b>Piège.</b> Des D-dimères élevés peuvent accompagner de nombreuses situations. Ils n’identifient ni la veine atteinte ni l’indication d’une thrombolyse.</div>
<div class="lab">Vitesse de résolution</div><p>Sous anticoagulant, la disparition du thrombus dépend de la fibrinolyse propre à la veine et de l’organisation du caillot. Elle est plus lente et plus incomplète dans les troncs iliaques que dans les veines du mollet, et une obstruction résiduelle reste fréquente après 3 mois de traitement.</p>
<div class="lab">Thrombolyse</div><p>Un activateur du plasminogène administré produit de la plasmine partout où se trouve de la fibrine, y compris dans les caillots qui ferment des lésions vasculaires : c’est la source de ses hémorragies. La thrombolyse agit mieux sur un thrombus de moins de 2 semaines, avant son organisation.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESVS 2021 sur les thromboses veineuses, sections 2.1.3, 2.5.1, 2.8.2 et 3.1.2.2.</p>
</template>
<template data-pop="i80-test-thrombophilie" data-title="Thrombophilie : utilité et limites du bilan"><p>Le médecin définit d’abord la décision que le test pourrait modifier. La phase aiguë et les anticoagulants peuvent perturber des dosages fonctionnels. Un résultat bas nécessite parfois un contrôle à distance dans des conditions adaptées.</p><p>Une hétérozygotie du facteur V Leiden ou de la prothrombine n’impose pas seule une anticoagulation indéfinie. L’épisode clinique, les facteurs persistants et le risque de saignement restent déterminants. Un variant somatique JAK2 répond à une autre question que la transmission d’une thrombophilie familiale.</p><div class="key"><b>À retenir.</b> Le bilan doit apporter une information utile. Un panel large sans conséquence définie peut produire une interprétation trompeuse.</div>
<div class="lab">Pourquoi le moment compte</div><p>Une thrombose étendue consomme l’antithrombine et les protéines C et S. L’antivitamine K bloque la synthèse fonctionnelle des protéines C et S, et les anticoagulants faussent la recherche d’anticoagulant lupique. La grossesse abaisse normalement la protéine S et donne une résistance acquise à la protéine C activée chez environ 40 % des femmes. Les dosages fonctionnels se font donc au moins 2 semaines après l’arrêt d’un antivitamine K ou 3 jours après celui d’un anticoagulant oral direct, et une anomalie se confirme sur un second prélèvement.</p>
<div class="lab">Quand le résultat change la conduite</div><p>Un syndrome des antiphospholipides à haut risque, triple positif ou avec antécédent de thrombose artérielle, fait préférer un antivitamine K à un anticoagulant oral direct. Une thrombophilie sévère, comme un déficit en antithrombine, certaines homozygoties ou une association d’anomalies, peut renforcer l’indication d’un traitement prolongé. La durée, la molécule et la dose restent décidées selon l’épisode clinique, le risque de récidive et le risque hémorragique ; le résultat génétique ne les fixe pas seul. L’ESVS 2021 propose donc le bilan héréditaire après une thrombose non provoquée chez un patient dont un parent du premier degré est atteint, et la recherche d’antiphospholipides si l’arrêt du traitement est envisagé ; elle le déconseille après une thrombose provoquée.</p>
<div class="lab">Limites</div><p>Seule la moitié environ des familles très atteintes ont une anomalie identifiée : un bilan normal n’exclut pas une prédisposition héréditaire.</p>
<div class="lab">Source complémentaire</div><p>Recommandations ESVS 2021 sur les thromboses veineuses, sections 2.2.5 et 4.2.3, recommandations 9 à 12, 66 et 67.</p>
</template>
<template data-pop="pareto-i80-sciences" data-title="Pareto — Sciences fondamentales veineuses"><p class="ratio" data-cover="i80-sa,i80-sp,i80-sc,i80-sg"></p><p>La veine fémorale appartient au réseau profond. Les jonctions saphènes relient les réseaux et doivent être décrites. Une veine normale se comprime ; l’incompressibilité constitue un signe majeur de thrombose.</p><p>La pompe du mollet et les valvules favorisent le retour. L’immobilité augmente la stase. La triade de Virchow relie stase, activation pariétale et hypercoagulabilité.</p><p>Xa et Va produisent la thrombine, qui produit la fibrine. Les anticoagulants freinent cette génération et l’extension du thrombus. La plasmine dégrade la fibrine ; les D-dimères ne sont pas spécifiques.</p><p>Une thrombophilie modifie une probabilité. Le contexte clinique et le moment du dosage déterminent l’interprétation. Une hétérozygotie isolée ne décide pas automatiquement la durée de traitement.</p></template>
