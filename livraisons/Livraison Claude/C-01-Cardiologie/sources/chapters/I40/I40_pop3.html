
<!-- ===== FENÊTRES I40 : examens ===== -->
<template data-pop="i40-crit" data-title="Critères diagnostiques de la myocardite (ESC 2025)">
<div class="lab">Présentation clinique compatible</div><p>Douleur thoracique, dyspnée ou insuffisance cardiaque, palpitations, syncope ou arythmie, choc cardiogénique, sans autre explication.</p>
<div class="lab">Critères supplémentaires</div><p>Anomalies ECG (repolarisation, conduction, arythmies) ; troponine élevée ; anomalies de fonction ou de structure à l’imagerie (échocardiographie, IRM).</p>
<div class="lab">Trois niveaux</div><p><b>Certain</b> : présentation compatible et preuve par l’IRM ou la biopsie. <b>Possible</b> : présentation compatible et au moins un critère supplémentaire, IRM ou biopsie non concluante ou non disponible. <b>Peu probable ou rejeté</b> : présentation seule, sans critère supplémentaire.</p>
<div class="lab">Ce qui change</div><p>La prise de position ESC 2013 exigeait la biopsie pour un diagnostic certain ; l’ESC 2025 admet l’IRM démonstrative. La biopsie reste nécessaire pour le type histologique. L’IRM est dite démonstrative lorsque les deux critères de Lake Louise mis à jour sont présents, et incertaine lorsqu’un seul l’est ; une IRM incertaine ne permet qu’un diagnostic possible, même si le tableau est typique.</p>
<div class="lab">Piège</div><p>Le diagnostic de myocardite n’est posé qu’après exclusion d’une maladie coronaire, lorsque la présentation l’impose.</p></template>

<template data-pop="i40-hstn" data-title="Troponine dans la myocardite">
<div class="lab">Seuil</div><p>99e percentile de la méthode hypersensible, propre au laboratoire (environ 14 ng/L pour la troponine T hypersensible ; de l’ordre de 16 à 34 ng/L pour les troponines I selon la méthode et le sexe).</p>
<div class="lab">Cinétique</div><p>Élévation dès les premiers jours ; plateau souvent prolongé ; baisse en quelques jours dans la forme non compliquée. La persistance ou la remontée signe une inflammation active.</p>
<div class="lab">Pièges</div><p>Troponine T hypersensible élevée dans les maladies du muscle squelettique (myosite, rhabdomyolyse) et l’insuffisance rénale ; la troponine I est plus spécifique du cœur. Troponine normale à deux reprises : myocardite aiguë peu probable.</p>
<div class="lab">Unité</div><p>ng/L (équivalent à pg/mL). Vérifier l’unité du laboratoire avant d’appliquer un seuil.</p>
<div class="lab">Valeur pronostique</div><p>Une troponine élevée avec une fonction biventriculaire conservée n’est pas un marqueur de mauvais pronostic : elle témoigne d’une nécrose limitée. Une libération persistante ou une remontée classe en revanche le patient à risque intermédiaire (tableau 7 de l’ESC 2025). Dans la myocardite chronique, la troponine est le plus souvent normale ; une élévation modérée et persistante fait suspecter une inflammation chronique.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 4.2.4 et 4.3.1, tableau 7.</p>
</template>

<template data-pop="i40-ecg" data-title="ECG de la myocardite : lecture pas à pas">
<div class="lab">1. Rythme et fréquence</div><p>Tachycardie sinusale ; extrasystoles ventriculaires ; tachycardie ventriculaire ; fibrillation auriculaire plus rare.</p>
<div class="lab">2. Conduction</div><p>PR allongé, bloc auriculoventriculaire de deuxième ou troisième degré ; blocs de branche ; QRS ≥ 120 ms, de mauvais pronostic.</p>
<div class="lab">3. Repolarisation</div><p>Sus-décalage du ST, souvent inférolatéral (DII, DIII, aVF, V4–V6) ; ondes T négatives ; sous-décalage du PR si composante péricardique.</p>
<div class="lab">4. Voltage et ondes Q</div><p>Bas voltage (œdème, épanchement) ; ondes Q de pseudo-nécrose, parfois transitoires.</p>
<div class="lab">Valeur</div><p>Anormal dans la majorité des cas ; aucune anomalie spécifique. Un ECG normal ne l’exclut pas.</p>
<div class="lab">Différentiel</div><p>Un sus-décalage convexe, en miroir, limité à un territoire coronaire, oriente vers un infarctus ; voir la fiche comparée de la péricardite dans le chapitre I30.</p>
<div class="lab">Fréquences (ESC 2025)</div><p>L’ECG est normal chez environ 15 % des patients. Il montre un sus-décalage du ST dans 57,5 % des cas, d’autres anomalies du ST ou de l’onde T dans 23,5 % et un trouble de conduction dans 10 %. Le QT peut s’allonger pendant la phase aiguë, et les anomalies évoluent en quelques heures ou quelques jours.</p>
<div class="lab">Mécanismes</div><p>Le sus-décalage du ST traduit un courant de lésion des couches sous-épicardiques enflammées ; il ne suit pas un territoire coronaire. Le bas voltage résulte de l’œdème, d’une perte étendue de myocarde ou d’un épanchement. Un QRS supérieur à 120 ms reflète une atteinte étendue du tissu de conduction ou du myocarde, ce qui explique son association au décès et à la transplantation.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 4.2.1, 5.1 et 7.1.</p>
</template>

<template data-pop="i40-echo" data-title="Échocardiographie dans la myocardite">
<div class="lab">Question</div><p>Quelle est la fonction des deux ventricules ? Y a-t-il un épanchement, un thrombus, une autre explication ?</p>
<div class="lab">Aspects</div><p>Normale dans la forme pseudo-infarctoïde ; hypokinésie segmentaire non systématisée ; ventricule non dilaté à parois épaissies et FEVG effondrée dans la forme fulminante ; dilatation dans la forme chronique ; strain longitudinal altéré de façon régionale. Le strain diminue même lorsque la FEVG est conservée, car une atteinte en foyers réduit le raccourcissement régional avant la fraction d’éjection globale ; un strain régional altéré s’associe à la cicatrice et prédit les arythmies ventriculaires.</p>
<div class="lab">Pronostic</div><p>Dysfonction du ventricule droit : facteur de mauvais pronostic.</p>
<div class="lab">Limites</div><p>Elle ne caractérise pas le tissu. Elle ne distingue pas une myocardite d’un infarctus sans l’analyse des territoires et des coronaires.</p></template>

<template data-pop="i40-coro" data-title="Coronarographie ou coroscanner : exclure une cause coronaire">
<div class="lab">Coronarographie en urgence</div><p>Sus-décalage persistant du ST, instabilité, forte probabilité coronaire (âge, facteurs de risque, douleur typique) : stratégie de l’infarctus avec sus-décalage du ST.</p>
<div class="lab">Coroscanner</div><p>Patient stable, jeune, à faible probabilité coronaire : alternative non invasive. Un scanner normal exclut une sténose significative.</p>
<div class="lab">Pièges</div><p>Des coronaires normales n’excluent pas une dissection coronaire spontanée fine ou un spasme ; l’IRM aide à trancher. L’ordre peut s’inverser : IRM précoce si la probabilité coronaire est faible et le patient stable. À l’inverse, des lésions coronaires n’écartent pas une myocardite lorsqu’elles n’expliquent pas le tableau : les deux coexistent surtout sous immunothérapie chez le sujet âgé et dans la myocardite à éosinophiles.</p></template>

<template data-pop="i40-lake" data-title="Critères de Lake Louise 2018">
<div class="lab">Critère T2 (œdème)</div><p>Hypersignal régional en séquence pondérée T2, ou rapport de signal global myocarde/muscle squelettique ≥ 2,0 ; ou allongement régional ou global du temps de relaxation T2 en cartographie.</p>
<div class="lab">Critère T1 (lésion)</div><p>Allongement régional ou global du T1 natif ou augmentation du volume extracellulaire ; ou rehaussement tardif au gadolinium de distribution non ischémique (sous-épicardique, intramyocardique).</p>
<div class="lab">Lecture</div><p>Deux critères sur deux : inflammation myocardique aiguë hautement probable. Un seul : peut soutenir le diagnostic en contexte clinique compatible, mais avec moins de spécificité. Le critère T2 ne repère que l’eau en excès, donc une inflammation active ; le critère T1 repère aussi la nécrose et la fibrose. Un critère T1 isolé, sans œdème, peut donc traduire une lésion cicatrisée dont l’âge reste incertain.</p>
<div class="lab">Critères de soutien</div><p>Épanchement ou rehaussement péricardique ; dysfonction systolique régionale ou globale du ventricule gauche.</p>
<div class="lab">Valeurs</div><p>Les valeurs normales de T1, de T2 et du volume extracellulaire dépendent de l’appareil et de la séquence ; chaque centre utilise ses propres références. Le volume extracellulaire normal est proche de 25 %.</p>
<div class="lab">Changement par rapport à 2009</div><p>La version 2009 exigeait deux critères sur trois (T2, rehaussement précoce, rehaussement tardif). La cartographie T1 et T2 a augmenté la sensibilité ; le rehaussement précoce a été abandonné.</p>
<div class="lab">Moment</div><p>Précision maximale dans les deux premières semaines ; contrôle dans les 6 mois (classe I, ESC 2025).</p></template>

<template data-pop="i40-dallas" data-title="Critères de Dallas et critères immunohistochimiques">
<div class="lab">Dallas (1986)</div><p><b>Myocardite active</b> : infiltrat inflammatoire et nécrose ou dégénérescence de cardiomyocytes adjacents, non ischémique. <b>Myocardite limite</b> : infiltrat sans nécrose. <b>Pas de myocardite</b>.</p>
<div class="lab">Limites de Dallas</div><p>Erreur d’échantillonnage des lésions en foyers ; variabilité entre observateurs ; pas d’information sur la cause ; faible sensibilité.</p>
<div class="lab">Immunohistochimie (prise de position ESC 2013)</div><p>Inflammation retenue à partir de 14 leucocytes par mm², dont au plus 4 monocytes par mm², en présence de lymphocytes T CD3 positifs. Les macrophages sont marqués par CD68. L’ESC 2025 signale que ces seuils sont contestés par les cardiopathologistes et que de nouveaux critères quantitatifs sont nécessaires ; son tableau 5 exige plus de 7 lymphocytes T CD3 positifs par mm², avec des macrophages CD68 positifs, pour la myocardite lymphocytaire active.</p>
<div class="lab">Compléments</div><p>Recherche de génome viral par PCR ; colorations des éosinophiles, recherche de cellules géantes et de granulomes ; rouge Congo si une amylose est possible.</p>
<div class="lab">Échantillonnage</div><p>Au moins trois fragments ; prélèvement biventriculaire ou guidé par l’IRM pour augmenter la sensibilité.</p>
<div class="lab">Phase aiguë et présentation antigénique</div><p>Dans la myocardite lymphocytaire aiguë, les lymphocytes T dépassent en général 25 par mm². L’expression des molécules HLA-DR par les macrophages et les cellules endothéliales témoigne d’une présentation active des antigènes et soutient le diagnostic.</p>
<div class="lab">Rendement</div><p>L’immunohistochimie porte le taux de détection de l’inflammation à environ 51 % des biopsies. Dans une série de 755 patients, le prélèvement des deux ventricules a augmenté la précision diagnostique par rapport à un prélèvement d’un seul ventricule.</p>
<div class="lab">Source complémentaire</div><p>2025 ESC Guidelines for the management of myocarditis and pericarditis, section 5.9.1 et tableau 11.</p>
</template>

<template data-pop="i40-pcr" data-title="Recherche de génome viral dans la biopsie">
<div class="lab">Pourquoi</div><p>Elle distingue une myocardite avec virus présent d’une inflammation virus négative. C’est une condition préalable à toute immunosuppression d’une myocardite lymphocytaire (ESC 2025).</p>
<div class="lab">Technique</div><p>Amplification génique (PCR) quantitative sur les fragments ; recherche du parvovirus B19, de l’herpèsvirus de type 6, des entérovirus, des adénovirus, du virus d’Epstein-Barr, du cytomégalovirus. La détection d’ARN messager viral traduit une réplication active.</p>
<div class="lab">Interprétation</div><p>Parvovirus B19 à faible charge, sous le seuil de 500 copies par microgramme d’ADN cardiaque retenu par l’ESC 2025 : souvent un virus latent sans rôle causal, retrouvé aussi chez des témoins. Herpèsvirus de type 6 présent dans toutes les cellules : intégration chromosomique héréditaire possible. Entérovirus ou adénovirus : présence plus probablement pathogène.</p>
<div class="lab">Contrôle</div><p>Un prélèvement sanguin parallèle aide à distinguer une virémie d’une infection du tissu. Une infection virale aiguë à la fois cardiaque et systémique contre-indique l’immunosuppression.</p></template>

<template data-pop="i40-sport" data-title="Reprise du sport après une myocardite">
<div class="lab">ESC 2025</div><p>Restriction initiale d’au moins un mois après le diagnostic. Ensuite, reprise individualisée lorsque le patient est asymptomatique, que les marqueurs d’inflammation (troponine, protéine C réactive) sont normalisés, que la fonction ventriculaire est normale et qu’aucune arythmie n’est retrouvée.</p>
<div class="lab">Examens avant l’autorisation</div><p>ECG, échocardiographie, Holter de 24 heures (idéalement un jour d’entraînement), épreuve d’effort, IRM de contrôle.</p>
<div class="lab">Changement par rapport à l’ESC 2020</div><p>L’ESC 2020 sur la cardiologie du sport imposait 3 à 6 mois d’arrêt du sport de compétition. L’ESC 2025 remplace cette durée fixe : la restriction dure au moins un mois, puis la reprise dépend des critères ci-dessus, chez l’athlète comme chez le non-athlète. Le sportif de compétition est évalué en cardiologie du sport, avec les mêmes examens.</p>
<div class="lab">Cicatrice</div><p>Un rehaussement tardif résiduel, surtout étendu ou septal, impose une décision individualisée et une surveillance, parfois une restriction durable.</p>
<div class="lab">Pourquoi</div><p>L’effort intense pendant l’inflammation augmente la réplication virale et les arythmies dans les modèles expérimentaux ; la myocardite est une cause de mort subite du sportif jeune.</p>
<div class="lab">Myopéricardite</div><p>Règle voisine de la péricardite : <button class="w" data-k="i30-effort">activité physique après une péricardite (chapitre I30)</button>.</p>
<div class="lab">Données expérimentales</div><p>Chez la souris infectée par le virus Coxsackie B3, la nage forcée a multiplié par 530 la réplication virale dans le cœur au pic de l’infection, et la moitié des animaux sont morts d’insuffisance cardiaque. L’effort accélère aussi la fréquence et libère des catécholamines, ce qui augmente l’excitabilité d’un myocarde enflammé. Aucune étude équivalente n’existe chez l’homme.</p>
<div class="lab">Force de la recommandation</div><p>La restriction jusqu’à la rémission, pendant au moins un mois, est recommandée chez l’athlète comme chez le non-athlète (classe I, niveau C). L’ESC 2025 rappelle qu’elle pèse sur la santé mentale du sujet jeune : la décision se partage avec lui.</p>
<div class="lab">Source complémentaire</div><p>Gatmaitan et al., Journal of Experimental Medicine 1970 ; 2025 ESC Guidelines for the management of myocarditis and pericarditis, sections 12.5 et 12.5.1, tableau de recommandations 26.</p>
</template>
<template data-pop="i40-irm-signal" data-title="Comment l’IRM détecte l’inflammation du myocarde">
<div class="lab">Physiologie normale</div><p>L’IRM mesure le retour à l’équilibre des protons de l’eau après une impulsion de radiofréquence. Les temps de relaxation T1 et T2 dépendent de l’environnement de ces protons. Dans le myocarde sain, les membranes des cardiomyocytes sont intactes, et l’espace extracellulaire n’occupe qu’environ un quart du volume.</p>
<div class="lab">Mécanisme</div><p>L’inflammation augmente la perméabilité capillaire : l’eau libre s’accumule et allonge le T2 et le T1 natif. La nécrose rompt les membranes, et la fibrose élargit l’interstitium. Le gadolinium ne pénètre pas dans les cellules intactes : il se distribue dans ces espaces agrandis et en ressort lentement. Dix à vingt minutes après l’injection, ces zones restent claires : c’est le rehaussement tardif. Le volume extracellulaire, calculé à partir du T1 avant et après injection et de l’hématocrite, chiffre cet élargissement.</p>
<div class="lab">Conséquence clinique</div><p>L’œdème régresse en quelques semaines, alors que la fibrose persiste. La précision diagnostique est donc maximale dans les deux premières semaines (ESC 2025). Plus tard, un rehaussement sans œdème ne permet plus de dater la lésion. Le rehaussement se lit aussi par contraste avec un myocarde sain : une atteinte diffuse le rend moins visible. Chez 129 patients comparés à la biopsie, les critères de Lake Louise de 2009 discriminaient mal la myocardite ; quand les symptômes duraient depuis plus de 14 jours, seule la cartographie T2 gardait une performance acceptable (Lurz et al., 2016). L’ESC 2025 note que le diagnostic par IRM est plus difficile dans les présentations par insuffisance cardiaque ou par arythmie que dans la forme pseudo-infarctoïde.</p>
<div class="lab">Ce qui change la décision</div><p>Une IRM précoce et normale rend une myocardite peu probable et s’associe à un bon pronostic. Une IRM tardive ou négative chez un patient à haut risque ne dispense pas de la biopsie.</p>
<div class="lab">Source</div><p>ESC 2025 sur les myocardites et péricardites, section 5.6 ; Ferreira et al., J Am Coll Cardiol 2018;72:3158-76 ; Lurz et al., J Am Coll Cardiol 2016;67:1800-11.</p></template>
