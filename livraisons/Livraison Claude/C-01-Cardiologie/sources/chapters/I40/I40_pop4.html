
<!-- ===== FENÊTRES I40 : formes spécifiques ===== -->
<template data-pop="i40-b19" data-title="Parvovirus B19 et myocardite">
<div class="lab">Le virus</div><p>Petit virus à ADN, responsable du mégalérythème épidémique de l’enfant et des crises aplasiques. Son nom vient du numéro de l’échantillon de sérum (panel B, puits 19) dans lequel il a été découvert en 1975.</p>
<div class="lab">Cible</div><p>Cellules endothéliales des petits vaisseaux cardiaques (récepteur : antigène P), d’où une dysfonction microvasculaire.</p>
<div class="lab">Interprétation</div><p>Génome fréquent dans les biopsies européennes, y compris chez des sujets sans myocardite ; il persiste à vie dans les tissus. Une faible charge virale sans ARN messager viral est rarement causale. Il ne doit pas, à lui seul, faire renoncer à une immunosuppression indiquée ; la décision revient au centre expert.</p>
<div class="lab">Charge virale et décision</div><p>L’ESC 2025 retient plus de 500 copies par µg d’ADN cardiaque comme seuil d’une inflammation liée au virus ; ce seuil guide le choix d’une immunosuppression. Une PCR sanguine faite en parallèle distingue une virémie, qui contamine le prélèvement, d’une infection du tissu. Une infection aiguë à charge élevée peut causer une myocardite grave, surtout chez le jeune enfant.</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les myocardites et péricardites, sections 9.1 et 9.5.1.</p>
</template>

<template data-pop="i40-covid" data-title="SARS-CoV-2 et myocardite">
<div class="lab">Infection</div><p>La myocardite de l’infection est en général plus fréquente que la myocardite vaccinale. Exception : chez l’homme de moins de 40 ans, l’excès de myocardites après la deuxième dose de Spikevax dépassait celui de l’infection (Patone et al., 2022). Les lésions sont surtout inflammatoires et endothéliales ; l’infection directe des cardiomyocytes est rare.</p>
<div class="lab">Syndrome inflammatoire multisystémique</div><p>Chez l’enfant (MIS-C) et plus rarement l’adulte (MIS-A), 2 à 6 semaines après l’infection : fièvre, atteinte de plusieurs organes, myocardite souvent avec choc, marqueurs inflammatoires très élevés. Traitement par immunoglobulines et corticoïdes.</p>
<div class="lab">Piège</div><p>Les anomalies isolées à l’IRM après un COVID-19 bénin, sans symptôme, ne suffisent pas pour poser un diagnostic de myocardite.</p>
<div class="lab">Pourquoi immunoglobulines et corticoïdes</div><p>Le syndrome inflammatoire multisystémique survient quand le virus est le plus souvent éliminé : la lésion vient d’une réponse immunitaire retardée et excessive, avec libération massive de cytokines. Le traitement vise donc cette réponse et non le virus. Les immunoglobulines intraveineuses et les corticoïdes réduisent l’activation immunitaire ; un antiviral n’a plus de cible à ce stade.</p>
<div class="lab">Source complémentaire</div><p>Henderson et al., American College of Rheumatology clinical guidance for MIS-C, version 3, Arthritis Rheumatol 2022;74:e1-20 ; Patone et al., Circulation 2022;146:743-54.</p>
</template>

<template data-pop="i40-lyme" data-title="Cardite de Lyme">
<div class="lab">Épidémiologie</div><p>Complication de la phase disséminée précoce de la borréliose, quelques semaines à quelques mois après la piqûre ; plus fréquente chez l’homme jeune. La Suisse est une zone d’endémie.</p>
<div class="lab">Présentation</div><p>Bloc auriculoventriculaire de degré variable, fluctuant, parfois complet ; syncope ; plus rarement myopéricardite ou dysfonction. Érythème migrant, paralysie faciale ou arthrite associés dans une partie des cas.</p>
<div class="lab">Diagnostic</div><p>Sérologie : dépistage puis confirmation par immunoempreinte ; en phase précoce, une sérologie négative se répète après 2 à 4 semaines.</p>
<div class="lab">Traitement (IDSA 2020)</div><p>Bloc de haut degré (PR &gt; 300 ms, deuxième ou troisième degré) : hospitalisation, monitorage, ceftriaxone 2 g/jour par voie intraveineuse, stimulation temporaire si nécessaire ; relais oral (doxycycline 100 mg × 2/jour) dès l’amélioration ; durée totale 14 à 21 jours. Formes légères : traitement oral d’emblée.</p>
<div class="lab">Piège</div><p>Implanter un stimulateur définitif chez un jeune avec un bloc récent sans sérologie de Lyme. Le bloc régresse habituellement sous antibiotiques.</p>
<div class="lab">Mécanisme du bloc</div><p>Les borrélies disséminées par le sang gagnent le cœur et y déclenchent un infiltrat de lymphocytes et de plasmocytes. L’atteinte est inflammatoire plus que destructrice : le degré du bloc varie avec l’intensité de l’infiltrat, parfois en quelques heures, et le bloc régresse quand l’antibiotique élimine la bactérie.</p>
<div class="lab">Ce qui change la décision</div><p>Une syncope ou un PR supérieur à 300 ms imposent un monitorage continu, car ils annoncent la progression vers le bloc complet (ESC 2025). Le bloc disparaît en général en une à deux semaines d’antibiotiques. L’antibiotique raccourcit l’évolution et prévient les autres complications de la phase disséminée.</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les myocardites et péricardites, section 9.5.2 ; Lantos et al., Clin Infect Dis 2021;72:e1-48.</p>
</template>

<template data-pop="i40-gcm" data-title="Myocardite à cellules géantes">
<div class="lab">Terrain</div><p>Adulte d’âge moyen ; maladie auto-immune associée dans environ un cas sur cinq (thymome, myasthénie, maladie inflammatoire de l’intestin, thyroïdite).</p>
<div class="lab">Présentation</div><p>Insuffisance cardiaque rapidement progressive, arythmies ventriculaires réfractaires, bloc auriculoventriculaire ; souvent choc.</p>
<div class="lab">Histologie</div><p>Nécrose étendue ; infiltrat de lymphocytes T, de macrophages et d’éosinophiles ; cellules géantes multinucléées d’origine macrophagique ; absence de granulome bien formé.</p>
<div class="lab">Traitement</div><p>Immunosuppression combinée (classe I, niveau C, ESC 2025), au moins un an : corticoïdes à forte dose, ciclosporine ou tacrolimus, souvent azathioprine, mycophénolate ou globulines antithymocytaires. Assistance circulatoire, transplantation ; défibrillateur à envisager.</p>
<div class="lab">Pronostic</div><p>Sans traitement : survie médiane sans transplantation de 5,5 mois (registre de Cooper, 1997). L’immunosuppression améliore nettement la survie sans transplantation. Récidive sur le greffon chez environ un quart des transplantés dans les séries anciennes.</p>
<div class="lab">Mécanisme</div><p>C’est une auto-immunité non infectieuse dirigée contre le myocarde ; les modèles expérimentaux la reproduisent par immunisation contre la myosine. Les lymphocytes T et les macrophages, dont la fusion forme les cellules géantes, détruisent les cardiomyocytes en nappes. Cette destruction continue explique la défaillance rapide ; l’atteinte du septum basal explique le bloc auriculoventriculaire.</p>
<div class="lab">Pourquoi une immunosuppression combinée</div><p>La corticothérapie seule ne prolonge pas la survie sans transplantation, car elle ne suffit pas à freiner une réponse des lymphocytes T aussi intense. L’ajout d’un inhibiteur de la calcineurine bloque leur activation, et celui d’un antiprolifératif leur multiplication : l’association agit sur deux étapes de la réponse.</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les myocardites et péricardites, section 9.3 et recommandation 16 ; Cooper et al., N Engl J Med 1997;336:1860-6.</p>
</template>

<template data-pop="i40-eos" data-title="Causes des myocardites à éosinophiles">
<div class="lab">Hypersensibilité médicamenteuse</div><p>Clozapine, bêtalactamines, sulfamides, anticonvulsivants, minocycline ; parfois dans un syndrome DRESS (éruption, fièvre, éosinophilie, atteinte d’organes). Cause identifiée la plus fréquente, environ un tiers des cas publiés. L’arrêt du médicament est la première mesure, mais l’évolution n’est pas toujours bénigne : la mortalité hospitalière y atteignait 36 %, la plus élevée des formes, dans une revue de cas publiés exposée au biais de publication (Brambatti et al., 2017).</p>
<div class="lab">Granulomatose éosinophilique avec polyangéite</div><p>Asthme tardif, rhinosinusite, neuropathie, infiltrats pulmonaires ; ANCA positifs dans moins de la moitié des cas, plus rarement quand le cœur est atteint. L’atteinte cardiaque est la première cause de décès de cette vascularite.</p>
<div class="lab">Syndrome hyperéosinophilique</div><p>Éosinophiles ≥ 1,5 × 10⁹/L de façon persistante avec atteinte d’organe. Forme myéloproliférative avec fusion <i>FIP1L1-PDGFRA</i> : très sensible à l’imatinib.</p>
<div class="lab">Parasitoses</div><p>Toxocarose, trichinellose (myalgies, œdème palpébral après viande mal cuite), strongyloïdose.</p>
<div class="lab">Myocardite éosinophilique nécrosante aiguë</div><p>Forme fulminante rare, à très haut risque, qui justifie des corticoïdes à forte dose sans délai après la biopsie.</p>
<div class="lab">Mécanisme de la lésion</div><p>L’interleukine 5 stimule la production des éosinophiles et prolonge leur survie. Dans le myocarde, ils libèrent le contenu de leurs granules : protéine basique majeure, protéine cationique, peroxydase et neurotoxine. Ces protéines sont toxiques pour les cardiomyocytes et l’endothélium, et elles activent la coagulation. D’où la nécrose, puis les thrombus pariétaux et, à terme, la fibrose endomyocardique.</p>
<div class="lab">Pourquoi chaque examen du bilan</div><p>Les IgE et les sérologies parasitaires cherchent une parasitose ou une allergie. Les ANCA soutiennent une granulomatose éosinophilique avec polyangéite, mais leur absence ne l’exclut pas. Une tryptase sérique élevée et le gène de fusion <i>FIP1L1-PDGFRA</i> désignent la forme myéloproliférative, qui répond à l’imatinib. Chaque cause a son traitement : arrêt du médicament, immunosuppresseur, imatinib ou antiparasitaire.</p>
<div class="lab">Ce qui change la décision</div><p>L’éosinophilie sanguine manque chez jusqu’à 25 % des patients : le diagnostic repose sur la biopsie, ou sur une IRM caractéristique associée à une éosinophilie. Les corticoïdes intraveineux sont le traitement de première ligne, mais une cause infectieuse, notamment une strongyloïdose, doit être traitée avant ou en même temps. Comme 12 % des patients ont un thrombus intracavitaire, une anticoagulation de phase aiguë peut être envisagée (ESC 2025).</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les myocardites et péricardites, section 9.2 ; Brambatti et al., J Am Coll Cardiol 2017;70:2363-75.</p>
</template>

<template data-pop="i40-loeffler" data-title="Endocardite de Löffler">
<div class="lab">Stade nécrotique</div><p>Premières semaines : infiltration et nécrose myocardiques par les éosinophiles ; troponine élevée ; souvent peu d’anomalies échographiques.</p>
<div class="lab">Stade thrombotique</div><p>Thrombus sur l’endocarde lésé, surtout à l’apex des deux ventricules et sous les valves auriculoventriculaires ; risque embolique.</p>
<div class="lab">Stade fibrotique</div><p>Fibrose endomyocardique qui oblitère l’apex et rigidifie le ventricule : physiologie restrictive, insuffisances mitrale et tricuspide.</p>
<div class="lab">Corrélation</div><p>L’IRM montre un rehaussement sous-endocardique diffus et le thrombus apical, que l’échocardiographie peut confondre avec une hypertrophie apicale.</p></template>

<template data-pop="i40-strongy" data-title="Strongyloïdose et corticoïdes">
<div class="lab">Le parasite</div><p><i>Strongyloides stercoralis</i>, nématode des régions tropicales et subtropicales. Il peut persister des décennies dans l’intestin grâce à un cycle d’auto-infestation, souvent sans symptôme ; l’éosinophilie est inconstante.</p>
<div class="lab">Risque</div><p>Sous corticoïdes, l’auto-infestation s’accélère : hyperinfection et dissémination, avec septicémies à germes digestifs ; mortalité élevée.</p>
<div class="lab">Conduite</div><p>Chez tout patient ayant vécu ou séjourné longtemps en zone d’endémie : sérologie et ivermectine (200 µg/kg/jour, 1 à 2 jours) avant ou au début de la corticothérapie. En urgence, on ne retarde pas les corticoïdes : on donne l’ivermectine en même temps.</p>
<div class="lab">Pourquoi les corticoïdes sont dangereux</div><p>Le contrôle de l’auto-infestation repose sur une immunité de type 2 : lymphocytes T auxiliaires, éosinophiles et IgE. Les corticoïdes suppriment cette réponse et provoquent une éosinopénie ; ils pourraient aussi accélérer directement la transformation des larves en formes infestantes. Les larves traversent alors en grand nombre la paroi intestinale et entraînent des bactéries digestives, d’où les septicémies et les méningites à bacilles à Gram négatif. L’éosinophilie, déjà inconstante, disparaît sous corticoïdes et ne peut plus servir d’alerte : le risque se juge sur l’exposition, et l’ivermectine se donne avant ou avec la première dose.</p>
<div class="lab">Source complémentaire</div><p>Keiser et Nutman, Clin Microbiol Rev 2004;17:208-17.</p>
</template>

<template data-pop="i40-clozapine" data-title="Myocardite à la clozapine">
<div class="lab">Fréquence et délai</div><p>Complication connue de la clozapine, antipsychotique de la schizophrénie résistante ; survient surtout dans les 4 premières semaines, avec un pic vers la troisième semaine.</p>
<div class="lab">Mécanisme</div><p>Hypersensibilité avec infiltrat souvent éosinophilique ; titration rapide et valproate associé sont des facteurs de risque rapportés.</p>
<div class="lab">Surveillance proposée</div><p>Troponine et protéine C réactive avant le début puis chaque semaine pendant 4 semaines (protocole de Ronaldson, 2011). Troponine supérieure à deux fois la limite ou protéine C réactive &gt; 100 mg/L : arrêt de la clozapine et bilan cardiaque. Élévations moindres : surveillance quotidienne.</p>
<div class="lab">Signes d’appel</div><p>Fièvre, tachycardie, douleur thoracique, dyspnée, symptômes grippaux pendant la titration ; à ne pas attribuer d’emblée à la fièvre bénigne de la clozapine.</p>
<div class="lab">Réintroduction</div><p>Exceptionnelle, en milieu spécialisé, avec surveillance renforcée, lorsque aucun autre antipsychotique n’est efficace.</p>
<div class="lab">Statut</div><p>Protocole de surveillance australien largement repris ; en Suisse, la surveillance suit l’information professionnelle et les protocoles des services de psychiatrie.</p>
<div class="lab">Pourquoi ce calendrier</div><p>Dans la série de Ronaldson et al., la myocardite est apparue entre le 10e et le 33e jour, dans 83 % des cas entre le 14e et le 21e jour. Ce délai est celui d’une réaction d’hypersensibilité, qui suppose une sensibilisation préalable. Le protocole associe troponine et protéine C réactive, car 5 des 75 cas avaient une protéine C réactive supérieure à 100 mg/L et une dysfonction ventriculaire sans élévation significative de la troponine. Ensemble, les deux dosages avaient une sensibilité estimée à 100 % pour les formes symptomatiques ; elle reste inconnue pour les formes asymptomatiques. L’incidence rapportée va de 0,1 à 5 % selon les séries (ESC 2025).</p>
<div class="lab">Source complémentaire</div><p>Ronaldson et al., Aust N Z J Psychiatry 2011;45:458-65 ; ESC 2025 sur les myocardites et péricardites, section 9.6.1.2.</p>
</template>

<template data-pop="i40-triplem" data-title="Chevauchement myocardite, myosite, myasthénie (« triple M »)">
<div class="lab">Définition</div><p>Association, sous immunothérapie, d’une myocardite, d’une myosite et d’un syndrome de type myasthénique.</p>
<div class="lab">Signes</div><p>Ptosis, diplopie, faiblesse des muscles du cou et proximale, dysphagie, insuffisance respiratoire ; troponine et créatine kinase élevées ; troubles de conduction.</p>
<div class="lab">Gravité</div><p>Mortalité très élevée, par insuffisance respiratoire et par arythmie ou bloc. Soins intensifs, avis neurologique, surveillance de la capacité vitale.</p>
<div class="lab">Traitement</div><p>Corticoïdes à forte dose ; échanges plasmatiques ou immunoglobulines pour la composante myasthénique ; abatacept dans les formes graves, selon les centres experts.</p>
<div class="lab">Aide pédagogique</div><p>« Triple M » est une expression d’usage, non un critère officiel.</p>
<div class="lab">Pourquoi surveiller la fonction respiratoire</div><p>La myosite peut toucher le diaphragme et les muscles intercostaux, et la composante myasthénique bloque la transmission neuromusculaire. La capacité vitale forcée et la force inspiratoire maximale mesurent la réserve de ces muscles ; leur baisse annonce l’hypercapnie et fait discuter la ventilation avant la détresse.</p>
<div class="lab">Pourquoi les anticorps</div><p>Les anticorps anti-récepteur de l’acétylcholine soutiennent la composante myasthénique, qui justifie les échanges plasmatiques ou les immunoglobulines. Les anticorps anti-muscle strié, dirigés notamment contre la titine, accompagnent souvent une myosite ou un thymome.</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les myocardites et péricardites, section 9.6.1.1.</p>
</template>

<template data-pop="i40-icos" data-title="Critères diagnostiques de la myocardite sous immunothérapie (ESC 2022)">
<div class="lab">Diagnostic histologique</div><p>Infiltrat inflammatoire multifocal avec perte franche de cardiomyocytes à la biopsie ou à l’autopsie.</p>
<div class="lab">Diagnostic clinique</div><p>Troponine nouvellement élevée ou nettement modifiée, avec <b>un critère majeur</b> ou <b>deux critères mineurs</b>, après exclusion d’un syndrome coronarien aigu et d’une myocardite infectieuse.</p>
<div class="lab">Critère majeur</div><p>IRM diagnostique d’une myocardite aiguë selon les critères de Lake Louise modifiés.</p>
<div class="lab">Critères mineurs</div><p>Syndrome clinique évocateur (fatigue, myalgies, douleur thoracique, diplopie, ptosis, dyspnée, orthopnée, œdèmes) ; arythmie ventriculaire ou trouble de conduction nouveau ; baisse de la fonction systolique non compatible avec un Tako-tsubo ; autre effet indésirable immunitaire, en particulier myosite, myopathie ou myasthénie ; IRM évocatrice mais incomplète.</p>
<div class="lab">Gravité</div><p><b>Fulminante</b> : instabilité hémodynamique, insuffisance cardiaque nécessitant une ventilation, bloc complet ou de haut degré, arythmie ventriculaire significative. <b>Non fulminante</b> : les autres formes. <b>Corticorésistante</b> : absence d’amélioration ou aggravation malgré les corticoïdes à forte dose.</p>
<div class="lab">Source</div><p>Définition consensuelle de la Société internationale de cardio-oncologie (IC-OS, 2021), reprise par l’ESC 2022 sur la cardio-oncologie.</p></template>

<template data-pop="i40-vacc" data-title="Myocardite après un vaccin à ARN messager">
<div class="lab">Fréquence</div><p>Rare ; maximale chez l’homme de 16 à 24 ans après la deuxième dose. Dans le système de surveillance américain (Oster et coll., <i>JAMA</i> 2022), environ 106 cas par million de doses chez le garçon de 16–17 ans après la deuxième dose de Comirnaty, et environ 50 à 60 par million chez l’homme de 18–24 ans ; beaucoup moins chez la femme et après 30 ans.</p>
<div class="lab">Délai</div><p>Médiane de 2 à 3 jours après la dose ; la plupart dans la première semaine.</p>
<div class="lab">Présentation</div><p>Douleur thoracique, troponine élevée, sus-décalage du ST, IRM avec œdème et rehaussement sous-épicardique ; FEVG le plus souvent conservée.</p>
<div class="lab">Évolution</div><p>Favorable dans la grande majorité des cas ; rehaussement tardif résiduel chez une partie des patients, de signification à long terme incertaine.</p>
<div class="lab">Conduite</div><p>Prise en charge d’une myocardite non compliquée ; déclaration à Swissmedic ; nouvelle dose d’ARN messager déconseillée ; reprise du sport selon les critères habituels.</p></template>

<template data-pop="i40-chagas-cycle" data-title="Cycle de Trypanosoma cruzi">
<div class="lab">Vecteur</div><p>Punaises hématophages de la famille des triatomes, qui vivent dans les fissures des habitations rurales en torchis d’Amérique latine et piquent la nuit.</p>
<div class="lab">Formes du parasite</div><p><b>Trypomastigote</b> : forme sanguine, flagellée, infectante, ne se divise pas. <b>Amastigote</b> : forme intracellulaire, qui se multiplie dans les cardiomyocytes, les cellules musculaires lisses et les neurones autonomes. <b>Épimastigote</b> : forme de multiplication dans l’intestin de la punaise.</p>
<div class="lab">Transmission</div><p>Vectorielle (déjections sur la peau ou la conjonctive) ; congénitale (1 à 5 % des grossesses de mères infectées selon les séries) ; transfusion ; transplantation d’organe ; orale (aliments contaminés).</p>
<div class="lab">En Suisse</div><p>Pas de vecteur : seules les transmissions congénitale, transfusionnelle et par greffe sont possibles.</p></template>

<template data-pop="i40-chagas-stades" data-title="Histoire naturelle de la maladie de Chagas">
<div class="lab">Phase aiguë</div><p>6 à 8 semaines ; parasitémie élevée ; souvent inaperçue ; fièvre, adénopathies, hépatosplénomégalie, chagome, signe de Romaña ; myocardite aiguë ou méningo-encéphalite rares, surtout chez l’enfant.</p>
<div class="lab">Phase chronique indéterminée</div><p>Sérologie positive, ECG et imagerie normaux, pas de symptôme. La majorité des personnes infectées restent à ce stade.</p>
<div class="lab">Phase chronique déterminée</div><p>Environ 20 à 30 % évoluent après 10 à 30 ans vers la cardiomyopathie ; une minorité vers les formes digestives (méga-œsophage, mégacôlon).</p>
<div class="lab">Réactivation</div><p>Chez l’immunodéprimé (VIH, transplantation, chimiothérapie) : myocardite ou méningo-encéphalite aiguë, parasitémie à nouveau détectable ; traitement antiparasitaire urgent.</p>
<div class="lab">Pronostic et décision</div><p>La cardiomyopathie chagasique associe fibrose en foyers, atteinte du tissu de conduction, anévrisme apical et dénervation autonome : elle cumule insuffisance cardiaque, arythmies ventriculaires et embolies. La mortalité cardiovasculaire atteint 6 % par an. Dans les études d’observation, le défibrillateur n’a pas démontré de bénéfice sur la mortalité par rapport à l’amiodarone. Après une tachycardie ventriculaire, les porteurs d’un défibrillateur reçoivent pourtant des thérapies appropriées à un taux de 25 % par an : la décision est individuelle (ESC 2025).</p>
<div class="lab">Source complémentaire</div><p>ESC 2025 sur les myocardites et péricardites, section 9.5.3.3.</p>
</template>

<template data-pop="i40-chagas-ecg" data-title="ECG de la cardiomyopathie chagasique">
<div class="lab">Association typique</div><p>Bloc de branche droit complet (QRS ≥ 120 ms, aspect en M avec deux ondes R en V1–V3, onde S large en DI et V5–V6) et hémibloc antérieur gauche (axe au-delà de −45°, petite onde q suivie d’une grande onde R en aVL, petite onde r suivie d’une onde S profonde en DII, DIII et aVF).</p>
<div class="lab">Autres anomalies</div><p>Extrasystoles ventriculaires polymorphes, tachycardie ventriculaire, dysfonction sinusale, bloc auriculoventriculaire, ondes Q en inférolatéral ou apical (fibrose), bas voltage.</p>
<div class="lab">Pourquoi</div><p>La branche droite et la division antérieure de la branche gauche sont fines et superficielles ; l’inflammation et la fibrose les lèsent tôt.</p>
<div class="lab">Aide pédagogique</div><p>« Droit plus antérieur gauche chez un patient d’Amérique latine : sérologie de Chagas ». Moyen mnémotechnique, non critère officiel.</p></template>

<template data-pop="i40-rassi" data-title="Score de Rassi (cardiomyopathie chagasique)">
<div class="lab">Variables (Rassi, <i>New England Journal of Medicine</i> 2006)</div><p>Classe NYHA III ou IV : 5 points ; cardiomégalie à la radiographie : 5 ; anomalie de cinétique segmentaire ou globale à l’échocardiographie : 3 ; tachycardie ventriculaire non soutenue au Holter : 3 ; bas voltage à l’ECG : 2 ; sexe masculin : 2.</p>
<div class="lab">Lecture</div><p>0–6 points : risque faible (mortalité à 10 ans d’environ 10 %) ; 7–11 : intermédiaire (environ 44 %) ; 12–20 : élevé (environ 84 %).</p>
<div class="lab">Usage</div><p>Stratification pronostique ; il guide l’intensité du suivi et la discussion d’un défibrillateur. Score de cohorte brésilienne, non critère officiel européen.</p></template>
