<section class="ilot" id="i48-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 71 ans, hypertendue et diabétique, consulte pour des palpitations irrégulières et un essoufflement apparus il y a deux jours. Son pouls est irrégulier à 128/min, sa pression artérielle à 138/84 mmHg. L’électrocardiogramme montre une tachycardie irrégulière à complexes fins, sans onde P. Quatre questions organisent tout le chapitre : <b>la patiente est-elle stable, quel est son risque d’accident vasculaire cérébral, faut-il ralentir le cœur ou rétablir le rythme sinusal, et quelles maladies associées entretiennent l’arythmie ?</b></p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître une fibrillation et un flutter auriculaires sur l’électrocardiogramme, en classer la forme, en identifier l’urgence, décider d’une anticoagulation et en choisir la molécule et la dose. Il sait aussi conduire un contrôle de la fréquence ou du rythme, poser les indications de cardioversion et d’ablation, et traiter les facteurs de risque qui font progresser la maladie. Le référentiel est la recommandation de la Société européenne de cardiologie (ESC) de 2024, reprise par la Société suisse de cardiologie.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i48-reentree">réentrée et la longueur d’onde (mécanisme des arythmies entretenues)</button>, la <button class="w" data-k="i48-noeudav">conduction décrémentielle du nœud auriculoventriculaire (filtre de la fréquence ventriculaire)</button> et la <button class="w" data-k="i48-virchow">triade de Virchow appliquée à l’auricule gauche (origine du thrombus)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i48-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <b>fibrillation auriculaire</b> est une tachyarythmie supraventriculaire caractérisée par une activation électrique désorganisée des oreillettes. Les oreillettes ne se contractent plus de façon efficace. Normalement, un front d’activation unique, parti du nœud sinusal, active les deux oreillettes en moins de 120 ms, si bien que leurs fibres se contractent ensemble en fin de diastole. En FA, de multiples fronts activent chaque région à un moment différent : les contractions locales se désynchronisent et la pression auriculaire ne s’élève plus. L’onde A du flux mitral, l’onde a du pouls jugulaire et le B4 disparaissent, et le sang stagne dans l’auricule. Le nœud auriculoventriculaire reçoit plusieurs centaines d’impulsions par minute et <button class="w" data-k="i48-noeudav">n’en transmet qu’une partie</button>, de façon aléatoire : la réponse ventriculaire est donc <b>irrégulièrement irrégulière</b>.</p>
<p>Le diagnostic exige une documentation électrocardiographique relue par un médecin, car les algorithmes automatiques confondent la FA avec des extrasystoles fréquentes, une arythmie sinusale, un flutter à conduction variable ou des artefacts. Un faux diagnostic expose à une anticoagulation prolongée sans bénéfice ; l’ESC 2024 exige donc un tracé ECG avant toute stratification du risque et tout traitement. Un ECG standard à 12 dérivations dure habituellement 10 secondes ; il documente la FA lorsque l’arythmie occupe tout le tracé. Un appareil à une ou plusieurs dérivations peut aussi confirmer le diagnostic, car il enregistre un véritable tracé ECG. Pour ces enregistrements ambulatoires, l’ESC 2024 précise que la durée minimale n’est pas établie et dépend du contexte clinique. Le repère de 30 secondes ou plus repose sur un consensus et sur des données limitées. Selon l’ESC, un épisode de cette durée peut signaler un problème clinique ; il conduit à prolonger la surveillance ou à stratifier le risque thromboembolique. Il ne décide pas seul une anticoagulation, car le risque d’embolie dépend surtout du terrain, estimé par le score CHA₂DS₂-VA, et non de la durée d’un épisode isolé. La plupart des scores réservent l’anticoagulation à un risque d’environ 0,6 à 1,0 % d’événements thromboemboliques par an. Un pouls irrégulier ou <button class="w" data-k="i48-depist">une alerte optique de montre</button> ne documente pas le rythme : il impose une confirmation ECG.</p>
<p>Le <b>flutter auriculaire</b> est une autre arythmie. C’est une <button class="w" data-k="i48-reentree">macroréentrée (circuit unique et stable)</button> qui active les oreillettes de façon organisée, à environ 250 à 350/min. Le flutter typique tourne autour de l’anneau tricuspide et passe par l’<b>isthme cavotricuspide</b>. Les deux arythmies coexistent souvent chez le même patient, car elles partagent les mêmes facteurs de risque et le même substrat auriculaire : plus de la moitié des patients ayant un flutter développent une FA. Le flutter expose lui aussi à un thrombus de l’auricule ; selon les études, le risque d’AVC y est comparable ou un peu plus faible qu’en FA. Les deux arythmies partagent donc la même règle d’anticoagulation.</p>
<h3>1.1 Classification temporelle</h3>
<p>La classification repose sur la durée des épisodes et sur la stratégie choisie. Elle guide le traitement, car les chances de rétablir puis de maintenir le rythme sinusal diminuent à mesure que l’arythmie dure et que l’oreillette se remodèle. Elle ne prédit qu’imparfaitement le risque thromboembolique, qui dépend du terrain.</p>
<table class="t"><tr><th>Forme</th><th>Définition (ESC 2024)</th><th>Exemple</th></tr>
<tr><td>Diagnostiquée pour la première fois</td><td>Fibrillation auriculaire documentée pour la première fois, quelle que soit sa durée ou ses symptômes</td><td>Découverte d’une FA sur l’ECG préopératoire</td></tr>
<tr><td>Paroxystique</td><td>S’arrête spontanément ou après une intervention en 7 jours au maximum. Le seuil de 7 jours est une convention des essais thérapeutiques ; la plupart des accès autolimités durent moins de 48 heures.</td><td>Épisodes de quelques heures survenant la nuit après une consommation aiguë d’alcool</td></tr>
<tr><td>Persistante</td><td>Dure plus de 7 jours, y compris lorsqu’elle est interrompue par cardioversion après ce délai</td><td>FA installée depuis trois semaines avant la consultation</td></tr>
<tr><td>Persistante de longue durée</td><td>Dure au moins 12 mois lorsqu’une stratégie de contrôle du rythme est décidée. Le seuil de 12 mois est arbitraire : c’est le maintien d’un projet de rythme sinusal qui distingue cette forme de la FA permanente.</td><td>FA depuis 18 mois, patient candidat à une ablation</td></tr>
<tr><td>Permanente</td><td>Patient et médecin renoncent à tout nouvel essai de restauration du rythme sinusal</td><td>Homme de 88 ans, peu symptomatique, sous contrôle de fréquence</td></tr></table>
<div class="trap"><span class="k">Piège</span>« Permanente » n’est pas une propriété de l’arythmie, mais une décision thérapeutique partagée. Un patient en FA permanente qui devient très symptomatique peut être reclassé et bénéficier d’un contrôle du rythme. À l’inverse, le mot « paroxystique » ne signifie pas un risque d’AVC plus faible justifiant l’absence d’anticoagulation. Chaque accès crée une stase dans l’auricule, et l’oreillette remodelée reste thrombogène entre les accès. Le risque relève donc du terrain : la décision dépend du score <button class="w" data-k="i48-cha">CHA₂DS₂-VA (calcul et justification)</button>, et non du type temporel.</div>
<p>L’ESC 2024 insiste sur la notion de <button class="w" data-k="i48-types">trajectoire de la fibrillation auriculaire (progression d’une forme à l’autre)</button> : chez beaucoup de patients, la maladie progresse de la forme paroxystique vers la forme persistante, parce que l’oreillette se remodèle. <button class="w" data-k="i48-remod-inverse">Traiter tôt les facteurs de risque</button> vise à freiner cette progression.</p>
<h3>1.2 Fibrillation clinique et fibrillation infraclinique détectée par un dispositif</h3>
<p>La <b>fibrillation auriculaire clinique</b> est documentée sur un ECG de surface, qu’elle soit symptomatique ou non. La <button class="w" data-k="i48-infraclin">fibrillation auriculaire infraclinique détectée par un dispositif (épisodes auriculaires rapides)</button> correspond à des épisodes asymptomatiques enregistrés par un dispositif de surveillance continue, chez un patient sans FA clinique connue. Ce dispositif est le plus souvent un stimulateur, un défibrillateur ou un moniteur implantable ; l’ESC 2024 y inclut aussi les appareils portés grand public. Un professionnel compétent doit vérifier l’épisode sur l’électrogramme intracardiaque ou sur un tracé ECG, car le dispositif peut compter à tort du bruit ou des ondes lointaines. Cette distinction est importante : le bénéfice de l’anticoagulation est <button class="w" data-k="i48-infraclin">bien moindre dans la forme infraclinique</button>.</p>
<h3>1.3 Sévérité des symptômes</h3>
<p>Le <button class="w" data-k="i48-ehra">score EHRA modifié (cinq degrés de retentissement des symptômes)</button> mesure l’impact de l’arythmie sur la vie quotidienne. Il sert à décider d’un contrôle du rythme et à évaluer son efficacité, car l’indication principale de ce contrôle au long cours est de réduire les symptômes et d’améliorer la qualité de vie. Un score bas n’exclut pas pour autant un contrôle précoce du rythme : dans l’essai EAST-AFNET 4, qui comptait 30 % de patients asymptomatiques à l’inclusion, il a réduit le critère combinant décès cardiovasculaire, AVC et hospitalisation pour insuffisance cardiaque ou syndrome coronarien aigu.</p>
</section>

<section class="ilot" id="i48-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La fibrillation auriculaire est l’arythmie soutenue la plus fréquente de l’adulte. L’étude <i>Global Burden of Disease</i> estimait à près de 60 millions le nombre de personnes atteintes dans le monde en 2019. L’ESC 2024 estime le risque de développer une FA au cours de la vie à environ une personne sur trois à cinq après 55 ans, et prévoit une forte augmentation de la prévalence au cours des prochaines décennies, portée par le <button class="w" data-k="i48-substrat">vieillissement de la population</button>.</p>
<p>En Suisse, l’étude lausannoise <button class="w" data-k="i48-colaus">CoLaus (cohorte populationnelle, ECG unique)</button> a trouvé une prévalence de 0,9 % chez 4 616 adultes de 45 à 86 ans examinés entre 2014 et 2017, et de 3,1 % après 80 ans (4,7 % en ajoutant le flutter). Ces chiffres sous-estiment la réalité : un ECG unique ne capte pas les formes paroxystiques. La cohorte nationale Swiss-AF, qui suit 2 415 patients en FA recrutés dans 14 centres, étudie surtout les conséquences cérébrales de l’arythmie.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Il n’existe pas de registre national suisse de la fibrillation auriculaire, et l’Office fédéral de la statistique ne publie pas de prévalence consolidée. Les données suisses citées proviennent de cohortes régionales ; les projections sont européennes (ESC 2024).</div>
<p>Le pronostic est dominé par quatre complications. Le <b>risque d’AVC ischémique</b> est multiplié par environ cinq ; les AVC liés à la FA sont plus graves et plus souvent mortels que les autres, car l’embole formé dans l’auricule est souvent volumineux : il occlut brutalement une grosse artère cérébrale proximale, avant qu’une circulation collatérale ait pu se développer, et l’infarctus est étendu. L’<b>insuffisance cardiaque</b> est à la fois cause et conséquence de l’arythmie. Elle élève la pression de remplissage du ventricule gauche, donc celle de l’oreillette gauche, qui se dilate et se fibrose sous l’effet de l’étirement et de l’activation neurohormonale. En retour, la FA supprime la contraction auriculaire et impose une fréquence rapide et irrégulière, qui réduit le débit et peut altérer la fonction ventriculaire. Dans la cohorte de Framingham, 37 % des patients ayant une FA nouvelle avaient une insuffisance cardiaque, et 57 % de ceux ayant une insuffisance cardiaque nouvelle avaient une FA. La FA s’associe aussi à un <b>déclin cognitif</b>, en partie par des <button class="w" data-k="i48-cognition">infarctus cérébraux silencieux</button>, et à une <b>mortalité</b> accrue, environ doublée par rapport au rythme sinusal. L’insuffisance cardiaque est la première cause de décès. L’anticoagulation réduit fortement le risque d’AVC ; elle n’efface pas les autres complications, car elle empêche seulement la formation du thrombus dans l’auricule, sans agir sur le substrat auriculaire, la fréquence ventriculaire ni la fonction du ventricule. Sous anticoagulant, le risque résiduel de décès reste élevé, d’où l’intérêt d’une prise en charge globale des maladies associées.</p>

<section class="ilot" id="i48-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La fibrillation auriculaire naît de la rencontre de deux éléments : un <b>déclencheur</b>, qui initie l’arythmie, et un <b>substrat</b>, qui lui permet de se maintenir. Le raisonnement suit la chaîne : <b>facteurs de risque → remodelage de l’oreillette → déclencheurs et réentrées → perte de la systole auriculaire et réponse ventriculaire rapide → symptômes, insuffisance cardiaque et thrombose.</b></p>
<h3>3.1 Les déclencheurs : les veines pulmonaires</h3>
<p>En 1998, l’équipe de Michel Haïssaguerre, à Bordeaux, a montré que la plupart des accès de FA paroxystique sont déclenchés par des extrasystoles nées dans les <button class="w" data-k="i48-vp">manchons myocardiques des veines pulmonaires (foyers déclencheurs)</button>. Ces prolongements de muscle auriculaire, orientés de façon hétérogène, ont <button class="w" data-k="i48-vp">une période réfractaire courte</button> et une activité automatique propre. Cette découverte fonde l’<b>isolation électrique des veines pulmonaires</b>, geste central de l’ablation.</p>
<h3>3.2 Le substrat : le remodelage auriculaire</h3>
<p>Un foyer ectopique ne suffit pas : il faut une oreillette capable d’entretenir une activité désorganisée. Hypertension, âge, obésité, valvulopathie, insuffisance cardiaque et alcool dilatent l’oreillette et <button class="w" data-k="i48-substrat">y induisent une fibrose</button>. La fibrose <button class="w" data-k="i48-remod">ralentit et fragmente la conduction</button>. Selon la notion de <button class="w" data-k="i48-reentree">longueur d’onde (vitesse de conduction × période réfractaire)</button>, une conduction lente et une période réfractaire courte permettent à de multiples fronts d’onde de coexister dans l’oreillette : c’est l’état fibrillatoire.</p>
<p>La FA modifie elle-même l’oreillette. Dès les premières 24 heures d’arythmie, la période réfractaire se raccourcit par surcharge calcique des myocytes ; après des semaines, la fibrose s’installe. Ce <button class="w" data-k="i48-remod">remodelage électrique et structural (« la FA engendre la FA »)</button> explique la progression de la forme paroxystique vers la forme persistante, et la moindre efficacité des traitements tardifs : une fois la fibrose installée, l’arythmie s’entretient aussi hors des veines pulmonaires, dans un substrat que leur isolation ne supprime pas, et cette fibrose régresse peu. C’est l’un des arguments d’un contrôle du rythme précoce.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Chaque niveau de la chaîne a sa cible. Les facteurs de risque se traitent <button class="w" data-k="i48-remod-inverse">par la perte de poids</button>, la réduction de l’alcool à trois verres standard par semaine au plus, le contrôle tensionnel et le traitement des apnées du sommeil : c’est le « C » du parcours AF-CARE. Les déclencheurs relèvent de l’isolation des veines pulmonaires. Le substrat répond aux antiarythmiques, qui allongent la période réfractaire <button class="w" data-k="i48-reentree">ou ralentissent la conduction</button>. La réponse ventriculaire est ralentie par les <button class="w" data-k="i48-d-frein">freinateurs du nœud auriculoventriculaire</button>. Le risque de thrombose est prévenu par les anticoagulants.</div>
<h3>3.3 Conséquences hémodynamiques</h3>
<p>Deux mécanismes réduisent le débit. D’abord, l’oreillette ne se contracte plus : c’est la <button class="w" data-k="i48-kick">perte de la contraction auriculaire (contribution au remplissage ventriculaire)</button>. Cette contraction assure normalement une part du remplissage du ventricule gauche. Cette part est plus importante quand le ventricule est rigide (hypertrophie, sujet âgé, rétrécissement aortique). Ensuite, <button class="w" data-k="i48-kick">la tachycardie raccourcit la diastole</button> et l’irrégularité fait varier le volume d’éjection d’un battement à l’autre. Un ventricule qui bat vite pendant des semaines peut se dilater et perdre sa fonction : c’est la <button class="w" data-k="i48-tachycm">cardiomyopathie rythmique (réversible après contrôle de fréquence)</button>.</p>
<h3>3.4 La réponse ventriculaire : rôle du nœud auriculoventriculaire</h3>
<p>Les oreillettes fibrillent à 350–600/min. Le nœud auriculoventriculaire ne transmet pas tout, grâce à sa <button class="w" data-k="i48-noeudav">conduction décrémentielle et à la conduction cachée (irrégularité des RR)</button>. La fréquence ventriculaire dépend donc du tonus sympathique et vagal. <button class="w" data-k="i48-noeudav">Elle augmente à l’effort</button>, avec la fièvre, l’anémie ou l’hyperthyroïdie. En présence d’une <b>voie accessoire</b> (syndrome de Wolff-Parkinson-White), ce filtre est court-circuité : la fréquence ventriculaire peut dépasser 250/min, et le rythme peut <button class="w" data-k="i48-preexc">dégénérer en fibrillation ventriculaire</button>.</p>
<h3>3.5 La thrombose dans l’auricule gauche</h3>
<p>Dans la FA non valvulaire, la grande majorité des thrombi se forment dans l’<b>auricule gauche</b>, un diverticule en cul-de-sac de l’oreillette gauche. Les trois éléments de la <button class="w" data-k="i48-virchow">triade de Virchow (stase, lésion endothéliale, hypercoagulabilité)</button> y sont réunis. Le risque persiste après le retour en rythme sinusal, car l’oreillette « sidérée » reste peu contractile pendant plusieurs semaines. C’est pourquoi l’anticoagulation est poursuivie au moins quatre semaines après une cardioversion.</p>
<h3>3.6 Le flutter typique</h3>
<p>Dans le flutter typique, l’influx tourne autour de l’anneau tricuspide, le plus souvent dans le sens antihoraire vu de l’apex. Il est guidé par des obstacles anatomiques : la crête terminale, la veine cave inférieure et l’anneau tricuspide. Il passe obligatoirement par l’isthme cavotricuspide, zone étroite entre la veine cave inférieure et l’anneau tricuspide. Une ligne d’ablation à travers cet isthme interrompt le circuit : le taux de succès est très élevé, car le circuit ne peut pas contourner ce passage obligé, et le bloc de conduction bidirectionnel se vérifie par stimulation pendant le geste. Lorsque ce bloc est confirmé, la récidive du flutter est rare ; une FA apparaît toutefois chez 50 à 70 % des patients au cours du suivi, car le substrat auriculaire persiste. Le nœud auriculoventriculaire conduit souvent un battement sur deux : une oreillette à 300/min donne une fréquence ventriculaire régulière de 150/min. L’intervalle entre deux ondes de flutter, 200 ms, est plus court que la période réfractaire du nœud : une onde sur deux y arrive avant qu’il ait récupéré et s’y bloque. Une tachycardie régulière à environ 150/min fait donc rechercher un flutter 2:1, et la fréquence ventriculaire y est plus difficile à ralentir qu’en FA.</p>

<section class="ilot" id="i48-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La FA est rarement « isolée ». Elle est l’expression électrique de maladies cardiaques ou extracardiaques qu’il faut chercher systématiquement, car <button class="w" data-k="i48-remod-inverse">leur traitement réduit les récidives</button>. L’aide-mémoire <button class="w" data-k="i48-pirates">PIRATES (causes à passer en revue)</button> aide à ne rien oublier.</p>
<div class="two">
<div class="card"><h4>Terrain et facteurs de risque chroniques</h4><p>Âge (premier déterminant) ; <button class="w" data-k="i48-substrat">hypertension artérielle</button> (le facteur modifiable le plus fréquent) ; obésité ; diabète ; <button class="w" data-k="i48-saos">apnées obstructives du sommeil (dépistage et effet sur la FA)</button> ; <button class="w" data-k="i48-substrat">consommation d’alcool, même modérée</button> ; sédentarité, mais aussi <button class="w" data-k="i48-substrat">sport d’endurance intensif</button> pratiqué pendant des années ; tabac ; maladie rénale chronique.</p></div>
<div class="card"><h4>Cardiopathies</h4><p>Insuffisance cardiaque, quelle que soit la FEVG ; valvulopathies, surtout mitrales (le rétrécissement mitral rhumatismal dilate l’oreillette gauche) ; cardiopathie ischémique ; <button class="w" data-k="i48-cardiopathies">cardiomyopathie hypertrophique ; amylose cardiaque</button> ; cardiopathies congénitales (communication interauriculaire) ; péricardite.</p></div>
<div class="card"><h4>Causes aiguës ou réversibles</h4><p>Chirurgie, cardiaque surtout ; sepsis, pneumonie ; embolie pulmonaire ; hyperthyroïdie ; <button class="w" data-k="i48-causes-aigues">intoxication alcoolique aiguë ; hypokaliémie</button> ; myocardite.</p></div>
<div class="card"><h4>Médicaments et substances</h4><p>Hormones thyroïdiennes en excès ; sympathomimétiques et théophylline ; cocaïne et amphétamines ; <button class="w" data-k="i48-causes-aigues">ibrutinib, un inhibiteur de tyrosine kinase</button> utilisé en hématologie, qui augmente aussi le risque hémorragique ; corticoïdes à forte dose.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span>Qualifier la FA d’un patient jeune d’« idiopathique » sans avoir cherché une hyperthyroïdie, une consommation d’alcool, des apnées du sommeil, une voie accessoire ou une cardiopathie à l’échocardiographie. Chez le sujet de moins de 60 ans, le médecin pense aussi au sport d’endurance intensif et à une origine génétique : une cardiomyopathie héréditaire ou un trouble primaire du rythme peut se révéler par une FA, et ce diagnostic modifie le choix des antiarythmiques.</div>
<button class="pareto-btn ui" data-k="pareto-i48-physio">▲ Loi de Pareto — Physiopathologie et étiologies</button>
</section>

<section class="ilot" id="i48-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse a quatre buts : caractériser les symptômes et leur retentissement, dater le début de l’épisode, calculer le risque thromboembolique et hémorragique, et identifier les facteurs de risque et les causes. <button class="w" data-k="i48-24h">Dater le début est décisif</button>, car il conditionne la possibilité d’une cardioversion précoce.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li>Hypertension, diabète, insuffisance cardiaque, maladie vasculaire (<button class="w" data-k="i48-cha">éléments du score CHA₂DS₂-VA</button>)</li><li><button class="w" data-k="i48-s-avc">AVC, accident ischémique transitoire, embolie artérielle (antécédent le plus lourd)</button></li><li><button class="w" data-k="i48-hasbled">Saignement antérieur, anémie</button>, insuffisance rénale ou hépatique</li><li>Valvulopathie, <button class="w" data-k="i48-mitral">prothèse valvulaire mécanique</button></li></ul>
<ul><li><button class="w" data-k="i48-atcd-thyr">Dysthyroïdie, traitement par amiodarone ou hormones thyroïdiennes</button></li><li>Consommation d’alcool en grammes par semaine : la récidive croît avec la dose, l’excès d’alcool aggrave le risque hémorragique sous anticoagulant, et la cible est de 30 g au plus par semaine. Ronflement et somnolence diurne orientent vers des apnées du sommeil, dont les efforts inspiratoires contre une voie aérienne fermée étirent l’oreillette.</li><li>Sport d’endurance, stimulants, drogues : l’entraînement d’endurance prolongé dilate l’oreillette et renforce le tonus vagal, qui raccourcit la période réfractaire auriculaire ; les stimulants, la cocaïne et les amphétamines déclenchent des accès par décharge adrénergique. Les identifier conduit à adapter l’entraînement ou à arrêter la substance.</li><li>Histoire familiale de FA précoce ou de mort subite : elle oriente vers une cardiomyopathie héréditaire ou un trouble primaire du rythme, qui imposent un traitement adapté et l’examen des apparentés.</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i48-s-palp">Palpitations irrégulières (caractérisation)</button></li><li><button class="w" data-k="i48-s-fatig">Fatigue, baisse de la tolérance à l’effort (mécanismes, pièges)</button></li><li><button class="w" data-k="i48-s-dysp">Dyspnée d’effort (mécanismes en FA)</button></li><li><button class="w" data-k="i48-s-thorax">Gêne thoracique (ischémie fonctionnelle ou syndrome coronarien)</button>, anxiété</li></ul>
<ul><li><button class="w" data-k="i48-s-vertige">Vertiges, lipothymie (débit, pauses)</button></li><li><button class="w" data-k="i48-s-synco">Syncope (signal d’alarme : pause ou pré-excitation)</button></li><li><button class="w" data-k="i48-s-polyurie">Polyurie pendant l’accès (peptide natriurétique auriculaire)</button></li><li>Absence de symptôme : environ un patient sur dix ne décrit aucun symptôme, et des épisodes silencieux surviennent aussi chez les patients symptomatiques.</li></ul></div>
<p>L’absence de symptôme ne réduit pas le risque d’AVC ; elle retarde seulement le diagnostic. Les symptômes dépendent surtout de la fréquence ventriculaire et manquent quand la conduction nodale est lente, alors que l’embolie dépend de la stase dans l’auricule et du terrain. La découverte d’une FA lors d’un AVC est une situation fréquente.</p>
<h3>5.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 58 ans, en surpoids, consommant 20 verres d’alcool par semaine. Accès de palpitations irrégulières de quelques heures, <button class="w" data-k="i48-s-palp">souvent nocturnes</button>, résolutifs spontanément. ECG entre les accès normal ; Holter : FA paroxystique.</p></div>
<div class="card"><h4>Forme silencieuse révélée par un AVC</h4><p>Femme de 79 ans admise pour une aphasie brutale. ECG : FA à 88/min, méconnue. Elle ne s’était jamais plainte de palpitations. Son score CHA₂DS₂-VA vaut au moins 4 : 2 points pour l’âge et 2 pour l’AVC.</p></div>
<div class="card"><h4>Forme révélée par une insuffisance cardiaque</h4><p>Homme de 64 ans, dyspnée et œdèmes depuis deux mois. FA à 135/min, FEVG 30 %. Après contrôle du rythme, la FEVG remonte à 55 % en trois mois : cardiomyopathie rythmique.</p></div>
<div class="card"><h4>Forme trompeuse</h4><p>Femme de 35 ans, amaigrie, anxieuse, tremblante, FA à 140/min. TSH effondrée et anticorps anti-récepteurs de la TSH positifs : maladie de Basedow. La FA est ici un signe de l’hyperthyroïdie, <button class="w" data-k="i48-thyr">qu’il faut traiter en premier</button>.</p></div></div>
</section>

<section class="ilot" id="i48-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général → signes vitaux → anthropométrie → signes ciblés. Il répond à trois questions : le patient est-il stable, a-t-il une cardiopathie ou une insuffisance cardiaque, et existe-t-il une cause décelable ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>L’examen apprécie d’abord la conscience, <button class="w" data-k="i48-e-bas-debit">la perfusion cutanée</button> et la dyspnée de repos. Il recherche un <button class="w" data-k="i48-e-pouls">pouls irrégulier et déficit de pouls (compter à l’apex)</button>, puis mesure la <button class="w" data-k="i48-e-ta">pression artérielle en FA (mesures répétées)</button>. Il relève la fréquence respiratoire, la saturation et la température, qui peut révéler un sepsis. La polypnée et la désaturation orientent vers un œdème pulmonaire, une embolie pulmonaire ou une pneumonie. Dans un sepsis, l’inflammation et la stimulation adrénergique déclenchent la FA : le traitement de la cause prime, car le rythme sinusal revient spontanément chez jusqu’à 83 % des patients dans les 48 heures qui suivent ce traitement. Il mesure enfin le poids, la taille, l’indice de masse corporelle et le tour de cou, dont l’augmentation oriente vers des apnées du sommeil. Le poids sert deux décisions : un poids de 60 kg ou moins suffit à réduire la dose d’édoxaban et compte parmi les trois critères de l’apixaban, dont deux sont requis. Le surpoids fixe une cible de perte d’au moins 10 % du poids corporel.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Signes de l’arythmie</b><ul><li><button class="w" data-k="i48-e-b1">Intensité variable du premier bruit (B1)</button></li><li>Absence de quatrième bruit</li><li><button class="w" data-k="i48-e-jug">Pouls jugulaire sans onde a ; ondes de flutter</button></li><li>Irrégularité persistante à l’effort, car l’accélération sinusale fait souvent disparaître des extrasystoles, alors que l’irrégularité de la FA persiste à toute fréquence</li></ul></div>
<div><b>Retentissement</b><ul><li><button class="w" data-k="e-crepitants">Crépitants (technique et valeur)</button>, turgescence jugulaire, œdèmes (insuffisance cardiaque)</li><li><button class="w" data-k="i48-e-bas-debit">Marbrures, extrémités froides, confusion (signes de bas débit)</button></li><li>Déficit neurologique focal (AVC embolique) : un fragment de thrombus de l’auricule occlut une artère cérébrale. Le patient entre aussitôt dans la filière AVC, où l’équipe neurologique décide de la reperfusion selon l’anticoagulant pris et l’heure de la dernière dose.</li><li>Ischémie aiguë d’un membre (embolie périphérique) : l’embole occlut une artère de membre, dont la revascularisation est urgente.</li></ul></div>
<div><b>Indices de cause</b><ul><li><button class="w" data-k="i48-e-rm">Roulement diastolique à la pointe (rétrécissement mitral)</button></li><li><button class="w" data-k="i48-e-souffle">Souffle systolique (insuffisance mitrale, rétrécissement aortique)</button></li><li><button class="w" data-k="i48-e-thyr">Signes d’hyperthyroïdie (goitre, tremblement, exophtalmie)</button></li><li><button class="w" data-k="i48-e-frott">Frottement péricardique (péricardite)</button></li></ul></div>
<div><b>Terrain hémorragique</b><ul><li><button class="w" data-k="i48-hasbled">Pâleur, ecchymoses</button></li><li><button class="w" data-k="i48-hasbled">Stigmates d’hépatopathie alcoolique</button></li><li><button class="w" data-k="i48-hasbled">Hypertension non contrôlée</button></li><li><button class="w" data-k="i48-hasbled">Toucher rectal si anémie inexpliquée</button></li></ul></div></div>
<div class="trap"><span class="k">Piège</span>Le pouls radial sous-estime la fréquence ventriculaire en FA rapide : les battements survenant après une diastole courte éjectent trop peu de sang pour être palpés. La fréquence se compte à l’auscultation cardiaque ou sur l’ECG. De même, <button class="w" data-k="i48-e-ta">les tensiomètres automatiques peuvent se tromper</button> en FA : répéter la mesure et confirmer au besoin manuellement.</div>
