
<!-- ===== FENÊTRES I48 : notions fondamentales ===== -->
<template data-pop="i48-reentree" data-title="Réentrée et longueur d’onde">
<div class="lab">Définition</div><p>Une réentrée est un influx qui, au lieu de s’éteindre après avoir activé le myocarde, revient réactiver un tissu redevenu excitable. Elle entretient une tachycardie tant que le circuit existe.</p>
<div class="lab">Trois conditions</div><p>Un obstacle, anatomique (anneau valvulaire, cicatrice) ou fonctionnel (zone réfractaire) ; un bloc unidirectionnel ; une conduction assez lente pour que le tissu en amont ait récupéré son excitabilité au retour de l’influx.</p>
<div class="lab">Longueur d’onde</div><p>Longueur d’onde = vitesse de conduction × période réfractaire. Exemple : une conduction de 0,5 m/s et une période réfractaire de 0,15 s donnent 7,5 cm. Si le circuit disponible est plus long, la réentrée peut tourner. Une période réfractaire courte (alcool, tonus vagal, remodelage) ou une conduction lente (fibrose) raccourcissent la longueur d’onde et favorisent la FA.</p>
<div class="lab">Macroréentrée et FA</div><p><b>Flutter</b> : un seul grand circuit stable autour d’un obstacle anatomique. <b>FA</b> : de multiples ondelettes et des rotors instables, qui changent sans cesse de trajet.</p>
<div class="lab">Corrélation thérapeutique</div><p>Les antiarythmiques de classe III allongent la période réfractaire, donc la longueur d’onde. L’ablation coupe un passage obligé (isthme cavotricuspide) ou isole les foyers déclencheurs.</p></template>

<template data-pop="i48-noeudav" data-title="Conduction décrémentielle et conduction cachée">
<div class="lab">Conduction décrémentielle</div><p>Plus les influx arrivent tôt au nœud auriculoventriculaire, plus leur conduction est lente. Les cellules nodales dépendent de courants calciques, qui récupèrent lentement. Cette propriété protège les ventricules des fréquences auriculaires élevées.</p>
<div class="lab">Conduction cachée</div><p>Un influx auriculaire peut pénétrer partiellement le nœud, s’y éteindre et le laisser réfractaire. Il n’apparaît pas sur l’ECG, mais il retarde ou bloque l’influx suivant. Ce phénomène, répété au hasard, crée l’irrégularité des intervalles RR.</p>
<div class="lab">Modulation</div><p>Le sympathique accélère la conduction nodale, le tonus vagal la ralentit. D’où une fréquence plus rapide à l’effort, dans la fièvre, l’hyperthyroïdie ou l’anémie, et la faible efficacité de la digoxine à l’effort.</p>
<div class="lab">Voie accessoire</div><p>Faite de myocarde ordinaire, elle ne décrémente pas : elle peut conduire plus de 250 influx par minute. C’est le mécanisme de la FA pré-excitée.</p></template>

<template data-pop="i48-virchow" data-title="Triade de Virchow dans l’auricule gauche">
<div class="lab">Stase</div><p>L’oreillette fibrillante ne se vide plus ; dans l’auricule, cul-de-sac trabéculé, la vitesse du sang chute. À l’ETO, cela se traduit par une vitesse de vidange basse et un contraste spontané en « fumée ».</p>
<div class="lab">Lésion endothéliale</div><p>L’endocarde auriculaire dilaté et fibrosé perd ses propriétés antithrombotiques, avec une expression accrue de facteurs procoagulants.</p>
<div class="lab">Hypercoagulabilité</div><p>Élévation du facteur de von Willebrand, du fibrinogène et des marqueurs d’activation plaquettaire et inflammatoire en FA.</p>
<div class="lab">Conséquences</div><p>Thrombus de l’auricule, embolie cérébrale ou systémique. Le risque dépend surtout du terrain (âge, hypertension, diabète, insuffisance cardiaque, antécédent embolique), ce qui explique la logique du score CHA₂DS₂-VA.</p></template>

<template data-pop="i48-vp" data-title="Manchons myocardiques des veines pulmonaires">
<p>Extensions du myocarde de l’oreillette gauche dans la paroi des veines pulmonaires, sur 1 à 3 cm.</p>
<div class="lab">Propriétés</div><p>Orientation des fibres hétérogène, période réfractaire courte, activité automatique et déclenchée. Elles produisent des salves d’extrasystoles qui déclenchent la FA.</p>
<div class="lab">Découverte</div><p>Haïssaguerre et coll., <i>New England Journal of Medicine</i>, 1998 : la majorité des foyers de FA paroxystique siègent dans les veines pulmonaires.</p>
<div class="lab">Application</div><p>L’isolation électrique circonférentielle de chaque veine pulmonaire empêche ces foyers d’atteindre l’oreillette : c’est le geste de base de toute ablation de FA.</p></template>

<template data-pop="i48-remod" data-title="Remodelage auriculaire : « la FA engendre la FA »">
<div class="lab">Remodelage électrique (heures à jours)</div><p>La fréquence auriculaire très élevée surcharge les myocytes en calcium. En réponse, le courant calcique de type L diminue et certains courants potassiques augmentent : la période réfractaire se raccourcit. Démontré chez la chèvre par Wijffels et Allessie en 1995 : plus la FA dure, plus elle se maintient facilement.</p>
<div class="lab">Remodelage structural (semaines à mois)</div><p>Dilatation de l’oreillette, fibrose interstitielle, perte des jonctions communicantes. En grande partie irréversible.</p>
<div class="lab">Conséquences cliniques</div><p>Progression de la forme paroxystique vers la forme persistante ; efficacité moindre de la cardioversion, des antiarythmiques et de l’ablation dans les formes anciennes ; argument pour un contrôle du rythme précoce (essai EAST-AFNET 4).</p></template>

<template data-pop="i48-kick" data-title="Contribution auriculaire au remplissage">
<div class="lab">Physiologie</div><p>Le remplissage ventriculaire gauche se fait surtout en protodiastole, passivement. En fin de diastole, la contraction auriculaire ajoute un volume supplémentaire (onde A du flux mitral), qui représente classiquement de l’ordre de 15 à 30 % du remplissage selon l’âge et la compliance ventriculaire.</p>
<div class="lab">Quand elle compte le plus</div><p>Ventricule rigide : hypertrophie, sujet âgé, rétrécissement aortique, cardiomyopathie hypertrophique, amylose. La relaxation lente réduit le remplissage passif, et la systole auriculaire devient indispensable.</p>
<div class="lab">Corrélation clinique</div><p>Un patient avec une cardiomyopathie hypertrophique ou un rétrécissement aortique serré peut décompenser brutalement à l’installation d’une FA. Chez lui, le retour rapide en rythme sinusal est souvent prioritaire.</p></template>

<template data-pop="i48-types" data-title="Types temporels et trajectoire de la FA">
<div class="lab">Classification ESC 2024</div><p>Première détection ; paroxystique (≤ 7 jours) ; persistante (&gt; 7 jours) ; persistante de longue durée (≥ 12 mois, si contrôle du rythme envisagé) ; permanente (décision de ne plus tenter le rythme sinusal).</p>
<div class="lab">Trajectoire</div><p>La FA est une maladie évolutive. Une part des patients progresse chaque année d’une forme paroxystique à une forme persistante, d’autant plus que les facteurs de risque sont nombreux et non traités. À l’inverse, la perte de poids et l’abstinence alcoolique peuvent faire régresser la charge arythmique.</p>
<div class="lab">Charge arythmique</div><p>Pourcentage du temps passé en FA, mesuré par un enregistrement prolongé ou un dispositif. Elle précise ce que le type temporel résume grossièrement.</p>
<div class="lab">Piège</div><p>Le type temporel guide le contrôle du rythme ; il ne guide pas l’anticoagulation. Une FA paroxystique chez un patient à score élevé justifie l’anticoagulation au même titre qu’une FA permanente.</p></template>

<template data-pop="i48-infraclin" data-title="FA infraclinique détectée par un dispositif">
<div class="lab">Définitions</div><p><b>Épisodes auriculaires rapides</b> : tachyarythmies auriculaires enregistrées par un dispositif implanté (selon l’ESC 2024 : fréquence auriculaire d’au moins 170/min, durant généralement plus de 5 minutes ; chaque épisode est inspecté visuellement, car certains sont des artéfacts). <b>FA infraclinique détectée par un dispositif</b> (terme ESC 2024) : ces épisodes, vérifiés sur l’électrogramme, sans FA documentée sur un ECG de surface.</p>
<div class="lab">Risque</div><p>Le risque d’AVC est réel mais plus faible que dans la FA clinique. Les épisodes longs s’en rapprochent, et une partie des patients développe ensuite une FA clinique.</p>
<div class="lab">Essais</div><p><b>NOAH-AFNET 6</b> (édoxaban contre placebo) : interrompu pour futilité, davantage de saignements. <b>ARTESiA</b> (apixaban contre acide acétylsalicylique) : moins d’AVC et d’embolies, davantage d’hémorragies majeures ; bénéfice absolu faible.</p>
<div class="lab">Conduite (ESC 2024)</div><p>Un AOD peut être envisagé chez les patients à risque thromboembolique élevé, en excluant ceux à haut risque hémorragique (classe IIb, niveau B). Surveiller l’apparition d’une FA clinique, qui fait basculer vers les règles habituelles. Traiter les facteurs de risque dans tous les cas.</p></template>

<template data-pop="i48-ehra" data-title="Score EHRA modifié des symptômes">
<p><b>1</b> — Aucun symptôme.<br><b>2a</b> — Symptômes légers : activité quotidienne normale, patient non gêné.<br><b>2b</b> — Symptômes modérés : activité quotidienne normale, patient gêné.<br><b>3</b> — Symptômes sévères : activité quotidienne altérée.<br><b>4</b> — Symptômes invalidants : activité quotidienne impossible.</p>
<div class="lab">Usage</div><p>Documenter le retentissement avant et après un contrôle du rythme. Un score 2b ou plus plaide pour une stratégie de rythme. L’ESC 2024 encourage aussi les questionnaires de qualité de vie.</p>
<div class="lab">Limite</div><p>Évaluation subjective ; la fatigue attribuée à la FA peut avoir une autre cause (anémie, dépression, bêtabloquant).</p></template>

<template data-pop="i48-colaus" data-title="Étude CoLaus et données suisses">
<div class="lab">Plan</div><p>Cohorte populationnelle lausannoise. Analyse de la FA : 4 616 participants de 45 à 86 ans, examinés de 2014 à 2017 avec un ECG à 12 dérivations.</p>
<div class="lab">Résultats</div><p>Prévalence de la FA 0,9 % ; 1,1 % en incluant le flutter ; 3,1 % après 80 ans (4,7 % avec le flutter). Nette prédominance masculine parmi les cas.</p>
<div class="lab">Limite</div><p>Un ECG unique ne détecte pas la FA paroxystique en dehors des accès : la prévalence réelle est plus élevée.</p>
<div class="lab">Swiss-AF</div><p>Cohorte nationale prospective de 2 415 patients en FA recrutés dans 14 centres suisses (recrutement de 2014 à 2017), centrée sur les lésions cérébrales, la cognition et la qualité de vie.</p></template>

<template data-pop="i48-pirates" data-title="PIRATES : causes de FA à passer en revue">
<p><b>P</b> — Pulmonaire : embolie pulmonaire, BPCO, pneumonie, hypertension pulmonaire.<br><b>I</b> — Ischémie myocardique.<br><b>R</b> — Rhumatismale : valvulopathie mitrale, et plus largement toute valvulopathie.<br><b>A</b> — Anémie, âge avancé, dilatation auriculaire de toute cause.<br><b>T</b> — Thyroïde : hyperthyroïdie.<br><b>E</b> — Éthanol : alcool aigu ou chronique.<br><b>S</b> — Sepsis, apnées du sommeil (<i>Sleep apnoea</i>), chirurgie (<i>Surgery</i>).</p>
<div class="lab">Aide pédagogique</div><p>Moyen mnémotechnique anglo-saxon, non critère officiel. Il ne remplace pas la recherche structurée des facteurs de risque du pilier « C » : hypertension, obésité, diabète et sédentarité, qui sont les plus fréquents.</p></template>

<template data-pop="i48-saos" data-title="Apnées obstructives du sommeil et FA">
<div class="lab">Mécanismes</div><p>Efforts inspiratoires contre des voies aériennes fermées : chute de la pression intrathoracique, étirement de l’oreillette ; hypoxémie et hypercapnie ; décharges sympathiques et vagales alternées.</p>
<div class="lab">Dépistage</div><p>Ronflement, pauses respiratoires constatées, somnolence diurne, obésité, tour de cou élevé, hypertension résistante. Les questionnaires sont peu fiables chez les patients en FA ; l’ESC 2024 préfère une évaluation objective (polygraphie ventilatoire ou polysomnographie) lorsque l’on recherche des apnées.</p>
<div class="lab">Traitement</div><p>Ventilation en pression positive continue, réduction pondérale. L’effet sur les récidives de FA est suggéré par des études observationnelles, mais les essais randomisés sont peu nombreux : d’où une classe IIb dans l’ESC 2024.</p></template>

<template data-pop="i48-poids" data-title="Perte de poids et FA">
<div class="lab">Données</div><p>Des études australiennes (programmes structurés de réduction pondérale et de gestion des facteurs de risque) ont montré qu’une perte de poids d’au moins 10 % s’accompagnait d’une forte réduction de la charge de FA et des récidives, y compris après ablation. Une perte de poids fluctuante atténuait le bénéfice.</p>
<div class="lab">Recommandation (ESC 2024)</div><p>Perte de poids recommandée chez le patient en surpoids ou obèse, avec une cible d’au moins 10 % du poids corporel (classe I, niveau B).</p>
<div class="lab">Moyens</div><p>Programme diététique et d’activité physique encadré ; traitements médicamenteux de l’obésité ou chirurgie bariatrique selon les indications propres à l’obésité.</p>
<div class="lab">Exemple</div><p>Patient de 110 kg : l’objectif est au moins 99 kg. Le suivi du poids fait partie de chaque consultation de FA.</p></template>

<template data-pop="i48-tachycm" data-title="Cardiomyopathie rythmique induite par la FA">
<div class="lab">Définition</div><p>Dysfonction ventriculaire gauche causée, entièrement ou en partie, par une fréquence ventriculaire rapide et prolongée, ou par l’irrégularité du rythme.</p>
<div class="lab">Mécanismes</div><p>Épuisement énergétique du myocarde, anomalies du cycle du calcium, ischémie sous-endocardique relative, perte de la systole auriculaire et asynchronisme lié à l’irrégularité.</p>
<div class="lab">Diagnostic</div><p>Rétrospectif : la FEVG remonte nettement, souvent en quelques semaines à quelques mois, après contrôle de la fréquence ou restauration du rythme sinusal. Une IRM sans cicatrice ni fibrose ventriculaire rend l’hypothèse plus probable.</p>
<div class="lab">Conséquences</div><p>L’ablation de la FA est recommandée lorsque cette cardiomyopathie est très probable (classe I, ESC 2024). Ne pas poser d’indication de défibrillateur avant d’avoir contrôlé l’arythmie et réévalué la FEVG. Une récidive de la FA peut faire rechuter rapidement la FEVG.</p></template>
