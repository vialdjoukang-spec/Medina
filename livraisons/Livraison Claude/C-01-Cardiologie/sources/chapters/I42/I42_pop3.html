
<!-- ===== FENÊTRES : maladies ===== -->
<template data-pop="i42-arvc-tfc" data-title="Critères diagnostiques de la CMAVD">
<div class="lab">Critères de la Task Force 2010 : critères majeurs</div><p><b>Structure</b> : akinésie, dyskinésie ou anévrisme régional du ventricule droit, avec dilatation (à l’IRM : volume télédiastolique indexé ≥ 110 mL/m² chez l’homme ou ≥ 100 mL/m² chez la femme, ou FEVD ≤ 40 %). <b>Histologie</b> : moins de 60 % de cardiomyocytes résiduels avec remplacement fibreux. <b>Repolarisation</b> : ondes T négatives de V1 à V3 ou au-delà après 14 ans, sans bloc de branche droit complet. <b>Dépolarisation</b> : onde epsilon de V1 à V3. <b>Arythmies</b> : tachycardie ventriculaire à retard gauche et axe supérieur. <b>Famille</b> : CMAVD confirmée chez un apparenté du premier degré, ou variant pathogène identifié.</p>
<div class="lab">Critères mineurs (exemples)</div><p>Ondes T négatives limitées à V1–V2 ; durée d’activation terminale du QRS ≥ 55 ms ; plus de 500 extrasystoles ventriculaires par 24 heures ; tachycardie ventriculaire à retard gauche et axe inférieur ; anomalies structurelles moins marquées ; apparenté suspect.</p>
<div class="lab">Lecture</div><p>Diagnostic certain : 2 critères majeurs, ou 1 majeur et 2 mineurs, ou 4 mineurs de catégories différentes. Limite : 1 majeur et 1 mineur, ou 3 mineurs. Possible : 1 majeur, ou 2 mineurs.</p>
<div class="lab">Critères de Padoue (2020)</div><p>Ils ajoutent la caractérisation tissulaire par l’IRM (rehaussement tardif du ventricule droit ou gauche) et définissent les formes droite, biventriculaire et gauche. L’ESC 2023 s’y réfère pour l’atteinte gauche, classée désormais en CMNDVG si elle est isolée.</p>
<div class="lab">Aide pédagogique</div><p>Présentation simplifiée ; le texte original détaille les seuils d’échocardiographie.</p></template>

<template data-pop="i42-attr" data-title="Amylose cardiaque à transthyrétine (ATTR)">
<div class="lab">Formes</div><p><b>Sauvage</b> : liée à l’âge, homme de plus de 70 ans le plus souvent ; atteinte surtout cardiaque, canal carpien. <b>Héréditaire</b> : variant de <i>TTR</i> ; p.Val142Ile (V122I) chez environ 3 à 4 % des personnes d’ascendance ouest-africaine, cardiopathie tardive ; p.Val50Met (V30M), foyers portugais et suédois, neuropathie dominante.</p>
<div class="lab">Diagnostic non invasif</div><p>Scintigraphie osseuse de grade 2 ou 3 avec imagerie tomographique, et absence de protéine monoclonale (immunofixation sérique et urinaire, chaînes légères libres). Puis analyse du gène <i>TTR</i> chez tous les patients, quel que soit l’âge.</p>
<div class="lab">Gold standard</div><p>Biopsie (endomyocardique ou d’un autre organe atteint) : rouge Congo, biréfringence en lumière polarisée, typage par spectrométrie de masse.</p>
<div class="lab">Pronostic</div><p>Stades du National Amyloidosis Centre (NT-proBNP et DFG). Sans traitement, survie médiane de quelques années après le diagnostic.</p>
<div class="lab">Traitement</div><p>Stabilisateurs (tafamidis, acoramidis) ou silenceur (vutrisiran) ; traitement de la congestion ; anticoagulation en cas de fibrillation auriculaire ; stimulateur en cas de trouble de conduction. Pour l’ensemble des causes d’insuffisance cardiaque et le repérage de l’amylose chez l’insuffisant cardiaque, voir la fenêtre <b>Amylose cardiaque</b> du chapitre I50.</p>
<div class="lab">Mécanisme de l’amylose</div><p>La transthyrétine, synthétisée surtout par le foie, circule sous forme de tétramère et transporte la thyroxine et la protéine de liaison du rétinol. La dissociation du tétramère en monomères est l’étape limitante : les monomères se replient mal et s’assemblent en fibrilles. Un variant de <i>TTR</i> déstabilise le tétramère et avance l’âge de la maladie ; la protéine sauvage devient instable avec le vieillissement, par un mécanisme encore mal compris.</p>
<div class="lab">Ce qui change la décision</div><p>Les traitements stabilisent le tétramère ou réduisent sa synthèse hépatique : ils freinent la formation de nouveaux dépôts sans retirer ceux qui existent, et le bénéfice est donc plus grand lorsque le diagnostic est précoce. L’analyse de <i>TTR</i> sert parce qu’une forme héréditaire impose le dépistage des apparentés et la recherche d’une polyneuropathie.</p>
<div class="lab">Source complémentaire</div><p>Maurer et al., Tafamidis treatment for patients with transthyretin amyloid cardiomyopathy, N Engl Med 2018;379:1007-1016. ESC 2023 sur les cardiomyopathies (Arbelo et al.), section 7.7.</p>
</template>

<template data-pop="i42-al" data-title="Amylose AL cardiaque">
<div class="lab">Mécanisme</div><p>Un clone plasmocytaire, souvent de petite taille, produit une chaîne légère (lambda plus souvent que kappa) qui forme des fibrilles. Les chaînes légères circulantes sont aussi directement toxiques pour les cardiomyocytes, ce qui explique la dégradation rapide.</p>
<div class="lab">Signes</div><p>Insuffisance cardiaque rapidement progressive, NT-proBNP très élevé, syndrome néphrotique, macroglossie, purpura périorbitaire, neuropathie, hépatomégalie.</p>
<div class="lab">Diagnostic</div><p>Protéine monoclonale, rapport des chaînes légères libres anormal, preuve histologique avec typage (graisse abdominale, moelle osseuse, organe atteint, myocarde).</p>
<div class="lab">Pronostic</div><p>Stades de la Mayo Clinic (troponine et NT-proBNP) ; les patients au stade IIIb ont une survie médiane de quelques mois.</p>
<div class="lab">Urgence</div><p>Adresser le jour même en hématologie. Traitement de référence : daratumumab associé au cyclophosphamide, au bortézomib et à la dexaméthasone (essai ANDROMEDA). La survie dépend de la rapidité de la réponse hématologique.</p></template>

<template data-pop="i42-sarcoid" data-title="Sarcoïdose cardiaque">
<div class="lab">Présentation</div><p>Bloc auriculoventriculaire chez un adulte de moins de 60 ans ; tachycardie ventriculaire ; insuffisance cardiaque ; mort subite. Atteinte cardiaque isolée chez une part des patients, sans atteinte pulmonaire connue.</p>
<div class="lab">Diagnostic</div><p>IRM : rehaussement en plages, sous-épicardique ou intramyocardique, septum basal (souvent sur son versant droit), paroi latérale ; œdème en T2 en phase active. TEP au FDG : fixation focale ou en plages, parfois avec défaut de perfusion ; recherche d’une atteinte extracardiaque accessible à la biopsie (ganglion, peau, poumon). Biopsie endomyocardique de faible sensibilité.</p>
<div class="lab">Traitement</div><p>Corticoïdes (prednisone environ 0,5 mg/kg/jour, décroissance sur plusieurs mois), méthotrexate en épargne cortisonique, inhibiteurs du facteur de nécrose tumorale alpha dans les formes réfractaires en l’absence d’insuffisance cardiaque sévère. Réponse suivie par la TEP.</p>
<div class="lab">Risque rythmique</div><p>Défibrillateur plutôt que stimulateur lorsqu’une stimulation est indiquée ; défibrillateur à envisager si la FEVG est ≤ 35 % ou s’il existe une fibrose importante (repères ESC 2022).</p>
<div class="lab">Piège</div><p>La sarcoïdose imite la CMAVD, la myocardite et la CMD. Un bloc auriculoventriculaire inexpliqué chez un adulte jeune doit la faire rechercher avant l’implantation d’un simple stimulateur.</p></template>

<template data-pop="i42-hemochrom" data-title="Cardiomyopathie de surcharge en fer">
<div class="lab">Causes</div><p>Hémochromatose génétique (homozygotie C282Y du gène <i>HFE</i>, avec une pénétrance clinique incomplète) ; surcharge transfusionnelle (thalassémie majeure, drépanocytose, myélodysplasie).</p>
<div class="lab">Mécanisme</div><p>Le fer non lié à la transferrine entre dans les cardiomyocytes par les canaux calciques et produit des radicaux libres. Le phénotype est d’abord restrictif, puis dilaté ; les arythmies sont fréquentes.</p>
<div class="lab">Diagnostic</div><p>Saturation de la transferrine &gt; 45 %, ferritine élevée ; ces marqueurs ne prédisent pas le fer myocardique, qui ne se corrèle ni à la ferritine ni au fer hépatique : seule l’IRM le mesure sans biopsie ; T2* myocardique à l’IRM : normal &gt; 20 ms ; 10–20 ms, surcharge modérée ; &lt; 10 ms, surcharge sévère avec risque élevé d’insuffisance cardiaque.</p>
<div class="lab">Traitement</div><p>Saignées dans l’hémochromatose génétique ; chélation (déféroxamine, défériprone, déférasirox) dans les surcharges transfusionnelles, en association si l’atteinte cardiaque est sévère. La dysfonction est réversible si le traitement est précoce.</p></template>

<template data-pop="i42-fabry" data-title="Maladie de Fabry">
<div class="lab">Mécanisme</div><p>Variant du gène <i>GLA</i> (chromosome X) : déficit en alpha-galactosidase A, accumulation lysosomale de globotriaosylcéramide (Gb3) dans les cardiomyocytes, l’endothélium, le rein et les nerfs.</p>
<div class="lab">Transmission</div><p>Liée à l’X. Un homme atteint transmet le variant à toutes ses filles et à aucun de ses fils. Les femmes sont souvent atteintes, plus tardivement et de façon variable, en raison de l’inactivation aléatoire d’un chromosome X.</p>
<div class="lab">Cœur</div><p>Hypertrophie concentrique ; PR court au début, puis troubles de conduction et arythmies ; à l’IRM, T1 natif bas (lipides) et rehaussement tardif inférolatéral basal (fibrose).</p>
<div class="lab">Diagnostic</div><p>Homme : activité enzymatique effondrée, puis confirmation génétique. Femme : activité souvent normale, analyse de <i>GLA</i> indispensable. Le lyso-Gb3 plasmatique aide au diagnostic et au suivi.</p>
<div class="lab">Traitement</div><p>Enzymothérapie substitutive (agalsidase alfa, agalsidase bêta, pégunigalsidase alfa) ; migalastat pour les variants dits répondeurs. Le bénéfice cardiaque est plus grand avant l’apparition de la fibrose.</p></template>

<template data-pop="i42-takotsubo" data-title="Cardiomyopathie de stress (Tako-tsubo)">
<div class="lab">Critères diagnostiques internationaux InterTAK (2018)</div><p>1. Dysfonction ventriculaire gauche transitoire (hypokinésie, akinésie, dyskinésie) apicale, médioventriculaire, basale ou focale, dépassant habituellement le territoire d’une seule artère coronaire. 2. Déclencheur émotionnel, physique ou mixte, fréquent mais non obligatoire. 3. Les atteintes neurologiques (hémorragie sous-arachnoïdienne, accident vasculaire cérébral, crise épileptique) et le phéochromocytome peuvent être des déclencheurs. 4. Anomalies ECG nouvelles (sus- ou sous-décalage, ondes T négatives, QTc long), rarement absentes. 5. Troponine modérément élevée ; peptides natriurétiques souvent très élevés. 6. Une maladie coronaire significative n’exclut pas le diagnostic. 7. Pas d’argument pour une myocardite infectieuse. 8. Femmes ménopausées surtout.</p>
<div class="lab">Mécanisme</div><p>Décharge catécholaminergique ; densité plus élevée des récepteurs β-adrénergiques à l’apex ; dysfonction microvasculaire ; rôle des œstrogènes, dont la baisse à la ménopause lève une protection.</p>
<div class="lab">Complications</div><p>Choc cardiogénique (environ 10 %), obstruction de la chambre de chasse, insuffisance mitrale, thrombus apical, torsades de pointes, bloc, rupture. Mortalité hospitalière comparable à celle d’un syndrome coronarien aigu dans le registre international.</p>
<div class="lab">Suivi</div><p>Échocardiographie jusqu’à récupération complète ; récidive d’environ 1 à 2 % par an ; symptômes persistants fréquents. Chapitre I21 : la même entité est présentée parmi les diagnostics différentiels de l’infarctus.</p>
<div class="lab">Mécanisme proposé</div><p>Le récepteur β2-adrénergique stimule normalement la contraction par la protéine G stimulatrice. Chez le rat, un bolus élevé d’adrénaline, mais non de noradrénaline, déprime l’apex et rend la base hypercontractile ; l’effet disparaît après inactivation de la protéine G inhibitrice. Les cardiomyocytes apicaux portent davantage de récepteurs β2 : à très forte concentration, l’adrénaline y bascule vers la voie inhibitrice, qui réduit la contraction et protège la cellule (Paur et al., 2012). Ce modèle explique la topographie et la réversibilité de l’atteinte ; il n’est pas démontré chez l’être humain.</p>
<div class="lab">Conséquence clinique</div><p>Dans le registre international de 1 750 patients, un déclencheur physique (36,0 %) était plus fréquent qu’un déclencheur émotionnel (27,7 %), et 28,5 % des patients n’en avaient aucun. La mortalité au long cours atteignait 5,6 % par patient-année (Templin et al., 2015).</p>
<div class="lab">Ce qui change la décision</div><p>L’absence de déclencheur n’écarte pas le diagnostic. Un déclencheur physique, une maladie neurologique ou psychiatrique aiguë, une troponine élevée et une FEVG basse à l’admission prédisaient indépendamment les complications hospitalières : leur présence justifie une surveillance rapprochée et le traitement de la maladie déclenchante.</p>
<div class="lab">Source complémentaire</div><p>Paur et al., High levels of circulating epinephrine trigger apical cardiodepression in a β2-adrenergic receptor/Gi-dependent manner, Circulation 2012;126:697-706. Templin et al., Clinical features and outcomes of takotsubo (stress) cardiomyopathy, N Engl Med 2015;373:929-938.</p>
</template>

<template data-pop="i42-intertak" data-title="Score diagnostique InterTAK">
<div class="lab">Points</div><p>Sexe féminin : 25 ; déclencheur émotionnel : 24 ; déclencheur physique : 13 ; absence de sous-décalage du segment ST (sauf en aVR) : 12 ; antécédent psychiatrique : 11 ; antécédent neurologique : 9 ; allongement du QTc : 6.</p>
<div class="lab">Lecture</div><p>Au-delà de 70 points, la probabilité de Tako-tsubo est élevée (environ 90 % dans la cohorte de dérivation) ; à 70 points ou moins, elle est faible à intermédiaire.</p>
<div class="lab">Usage</div><p>Orienter la suspicion, notamment en l’absence de sus-décalage. Le score ne dispense jamais de la coronarographie en phase aiguë.</p>
<div class="lab">Aide pédagogique</div><p>Outil de probabilité, non critère diagnostique officiel.</p></template>

<template data-pop="i42-ppcm" data-title="Cardiomyopathie du péripartum">
<div class="lab">Définition (Association de l’insuffisance cardiaque de l’ESC)</div><p>Insuffisance cardiaque secondaire à une dysfonction systolique du ventricule gauche (FEVG &lt; 45 %), vers la fin de la grossesse ou dans les mois qui suivent l’accouchement, surtout le premier mois, sans autre cause. Le ventricule peut ne pas être dilaté.</p>
<div class="lab">Mécanisme</div><p>Stress oxydatif de fin de grossesse ; la cathepsine D clive la prolactine en un fragment de 16 kDa antiangiogénique et cardiotoxique ; facteurs antiangiogéniques placentaires (lien avec la prééclampsie) ; prédisposition génétique (<i>TTN</i>).</p>
<div class="lab">Aide-mémoire BOARD</div><p><b>B</b>romocriptine (discutée) ; <b>O</b>ral : traitements de l’insuffisance cardiaque par voie orale, adaptés à la grossesse ou à l’allaitement ; <b>A</b>nticoagulation ; vaso<b>R</b>elaxateurs (hydralazine, dérivés nitrés pendant la grossesse) ; <b>D</b>iurétiques. Aide pédagogique, non critère officiel (proposée par des experts de l’Association de l’insuffisance cardiaque de l’ESC).</p>
<div class="lab">Pronostic</div><p>Récupération complète chez environ la moitié des patientes ; moins probable si la FEVG initiale est &lt; 30 % ou le ventricule très dilaté.</p>
<div class="lab">Grossesse ultérieure</div><p>Déconseillée si la FEVG ne s’est pas normalisée ; même après récupération, risque de récidive à discuter en consultation préconceptionnelle, avec une surveillance étroite pendant la grossesse.</p></template>

<template data-pop="i42-alcool" data-title="Cardiomyopathie alcoolique">
<div class="lab">Mécanismes</div><p>Toxicité directe de l’éthanol et de l’acétaldéhyde sur les mitochondries et le couplage excitation-contraction, stress oxydatif, apoptose ; carences associées (thiamine) ; susceptibilité génétique (<i>TTN</i>).</p>
<div class="lab">Diagnostic</div><p>CMD chez un buveur excessif prolongé, après exclusion des autres causes. Signes associés : macrocytose, gamma-glutamyltransférase élevée, fibrillation auriculaire (« holiday heart » après excès aigu).</p>
<div class="lab">Évolution</div><p>Amélioration fréquente, parfois normalisation de la FEVG, après abstinence ; la persistance de la consommation est associée à un mauvais pronostic. Aide au sevrage, supplémentation en thiamine et traitement habituel de l’insuffisance cardiaque.</p></template>

<template data-pop="i42-anthra" data-title="Dysfonction cardiaque liée aux traitements du cancer">
<div class="lab">Définitions (ESC 2022, forme asymptomatique)</div><p><b>Sévère</b> : nouvelle FEVG &lt; 40 %. <b>Modérée</b> : nouvelle baisse d’au moins 10 points vers une FEVG de 40–49 %, ou baisse de moins de 10 points vers 40–49 % associée à une baisse relative du strain longitudinal global &gt; 15 % ou à une nouvelle élévation des biomarqueurs. <b>Légère</b> : FEVG ≥ 50 % avec baisse relative du strain &gt; 15 % et/ou nouvelle élévation de la troponine ou du NT-proBNP. La forme symptomatique correspond à une insuffisance cardiaque.</p>
<div class="lab">Surveillance</div><p>Évaluation du risque et échocardiographie avant le traitement ; anthracyclines : contrôle en fin de traitement et à 12 mois, plus souvent chez le patient à haut risque ; trastuzumab : échocardiographie tous les trois mois pendant le traitement.</p>
<div class="lab">Conduite</div><p>Forme légère : poursuite du traitement du cancer avec cardioprotection (IEC ou ARA II, bêtabloquant). Forme modérée ou sévère : discussion interdisciplinaire de l’interruption et traitement de l’insuffisance cardiaque.</p>
<div class="lab">Protection primaire</div><p>Dexrazoxane, formes liposomales ou perfusion prolongée des anthracyclines, limitation de la dose cumulée, contrôle des facteurs de risque cardiovasculaire.</p></template>

<template data-pop="i42-ici" data-title="Myocardite des inhibiteurs de points de contrôle immunitaire">
<div class="lab">Tableau</div><p>Rare, précoce (surtout dans les trois premiers mois), plus fréquente avec les associations d’inhibiteurs. Troponine élevée, ECG anormal (troubles de conduction, arythmies), FEVG parfois normale. Association fréquente à une myosite (créatine kinase élevée) et à une atteinte de type myasthénique (ptosis, diplopie, dyspnée) : « triade » grave.</p>
<div class="lab">Diagnostic</div><p>Troponine, ECG, IRM (critères de Lake Louise) ; biopsie endomyocardique si le doute persiste.</p>
<div class="lab">Traitement (ESC 2022)</div><p>Arrêt de l’immunothérapie ; méthylprednisolone 500–1000 mg/jour par voie intraveineuse pendant au moins 3 jours (classe I), puis relais oral dégressif ; immunosuppression de seconde ligne dans les formes réfractaires, en centre expert ; monitorage rythmique.</p></template>

<template data-pop="i42-cascade" data-title="Dépistage familial en cascade">
<div class="lab">Principe</div><p>Examiner d’abord les apparentés du premier degré (parents, fratrie, enfants), puis étendre aux branches de la famille où le variant ou la maladie est retrouvé.</p>
<div class="lab">Variant pathogène connu</div><p>Test génétique ciblé, après conseil. Non-porteur : fin de la surveillance cardiologique liée à la maladie familiale. Porteur sans phénotype : ECG et échocardiographie réguliers, IRM selon le contexte, conseils sportifs.</p>
<div class="lab">Sans variant identifié</div><p>Examen clinique, ECG, échocardiographie (et IRM selon le phénotype) chez tous les apparentés du premier degré, répétés dans le temps.</p>
<div class="lab">Rythme (ESC 2023, CMH et CMD)</div><p>Première évaluation dès le diagnostic du cas index si mort subite précoce, forme pédiatrique familiale ou sport de compétition ; sinon vers 10 ans (repère de l’ESC 2014 sur la CMH ; l’ESC 2023 individualise l’âge) ; puis tous les 1 à 3 ans chez l’enfant et l’adolescent ; tous les 3 à 5 ans à l’âge adulte ; plus souvent si les résultats sont limites, si la maladie a débuté tôt dans la famille ou en cas de sport de compétition.</p>
<div class="lab">Autopsie</div><p>Après une mort subite inexpliquée d’un sujet jeune, une autopsie avec examen cardiaque spécialisé et le prélèvement d’un échantillon pour l’analyse génétique post mortem permettent le dépistage de la famille.</p></template>

<template data-pop="i42-grossesse" data-title="Grossesse et cardiomyopathies">
<div class="lab">Évaluation préconceptionnelle</div><p>Classe de risque maternel selon la classification modifiée de l’OMS, reprise par l’ESC 2025 ; échocardiographie, épreuve d’effort, NT-proBNP ; conseil génétique ; révision des traitements.</p>
<div class="lab">CMH</div><p>Généralement bien tolérée si le patient est peu symptomatique. Poursuite du bêtabloquant (métoprolol, propranolol ; éviter l’aténolol, associé à un retard de croissance) avec surveillance de la croissance fœtale. Mavacamten et aficamten contre-indiqués ; arrêt avant la conception selon l’information professionnelle. Accouchement par voie basse privilégié ; plan individualisé en cas d’obstruction sévère ; éviter l’hypovolémie et la vasodilatation lors de l’analgésie.</p>
<div class="lab">CMD</div><p>FEVG &lt; 30 % ou classe NYHA III–IV : grossesse déconseillée (risque maximal). IEC, ARA II, ARNI, ARM, iSGLT2 et ivabradine sont contre-indiqués pendant la grossesse ; ils sont remplacés avant la conception.</p>
<div class="lab">CMAVD</div><p>Grossesse habituellement bien tolérée ; poursuite du bêtabloquant ; défibrillateur compatible avec la grossesse.</p>
<div class="lab">Antécédent de cardiomyopathie du péripartum</div><p>Grossesse déconseillée si la FEVG n’est pas normalisée.</p></template>
