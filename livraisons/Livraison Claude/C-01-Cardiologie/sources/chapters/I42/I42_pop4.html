<template data-pop="i42-ecg" data-title="ECG des cardiomyopathies">
<div class="lab">Question clinique</div><p>L’ECG est-il compatible avec une cardiomyopathie, et contient-il un indice étiologique ?</p>
<div class="lab">CMH</div><p>Critères de voltage d’hypertrophie, ondes T négatives, ondes Q profondes et fines en inférieur et latéral (pseudo-nécrose septale), ondes T négatives géantes dans la forme apicale. Un ECG normal est rare (moins de 10 %) et associé à des formes peu sévères.</p>
<div class="lab">Phénocopies</div><p>Bas voltage et aspect de pseudo-infarctus (amylose) ; PR court (Fabry, <i>PRKAG2</i>, Danon, avec préexcitation possible) ; voltages géants avec préexcitation chez un adolescent (Danon).</p>
<div class="lab">CMD et CMNDVG</div><p>Bloc de branche gauche ; troubles de conduction auriculoventriculaire et fibrillation auriculaire (<i>LMNA</i>) ; bas voltage dans les dérivations périphériques (<i>DSP</i>, <i>PLN</i>) ; onde R ample en V1 et ondes Q latérales (dystrophinopathies) ; allongement progressif du PR et du QRS (dystrophie myotonique).</p>
<div class="lab">CMAVD</div><p>Ondes T négatives de V1 à V3 ; onde epsilon (petite déflexion après le QRS dans V1–V3) ; durée d’activation terminale ≥ 55 ms (du nadir de l’onde S à la fin du QRS en V1–V3) ; extrasystoles à retard gauche.</p>
<div class="lab">Définitions utiles</div><p>Bas voltage : amplitude du QRS &lt; 5 mm dans toutes les dérivations périphériques (ou &lt; 10 mm dans les précordiales). PR court : &lt; 120 ms.</p>
<div class="lab">Piège</div><p>L’amylose n’a un bas voltage franc que chez environ la moitié des patients ; le rapport entre voltage et masse ventriculaire est plus sensible que le voltage seul.</p></template>

<template data-pop="i42-holter" data-title="Holter dans les cardiomyopathies">
<div class="lab">Durée</div><p>24 à 48 heures au diagnostic et lors du suivi (ESC 2023) ; enregistreur de plus longue durée ou moniteur implantable si les symptômes sont rares.</p>
<div class="lab">Ce qu’on compte</div><p><b>Tachycardie ventriculaire non soutenue</b> : au moins 3 complexes ventriculaires consécutifs à ≥ 120/min, durant moins de 30 secondes ; variable du score HCM Risk-SCD. Elle témoigne d’un substrat capable d’entretenir une réentrée et touche 20 à 30 % des patients atteints de CMH ; sa fréquence, sa durée et sa cadence ne modifient pas le risque, alors qu’une salve pendant ou juste après l’effort, rare, peut signaler un risque élevé. <b>Extrasystoles ventriculaires</b> : plus de 500 par 24 heures, critère mineur de CMAVD ; très nombreuses (au-delà d’environ 10 % des battements), cause possible de cardiomyopathie rythmique. <b>Fibrillation ou flutter auriculaire</b> documentés : anticoagulation dans la CMH et l’amylose, quel que soit le score CHA₂DS₂-VASc (classe I, ESC 2023). <b>Troubles de conduction</b> : pauses, blocs.</p>
<div class="lab">Piège</div><p>Un Holter normal ne protège pas : il échantillonne une période courte. Il se répète tous les un à deux ans dans la CMH.</p></template>

<template data-pop="i42-echo-cmh" data-title="Échocardiographie de la cardiomyopathie hypertrophique">
<div class="lab">Épaisseur maximale</div><p>Mesurée en télédiastole, en coupe petit axe, à la base, au milieu et à l’apex, sur tous les segments. Exclure les trabéculations du ventricule droit et la bande modératrice. Une forme apicale ou antérolatérale peut échapper à l’échocardiographie : l’IRM ou un produit de contraste la révèlent.</p>
<div class="lab">Gradient</div><p>Doppler continu en coupe apicale à cinq cavités, aligné sur le flux de la chambre de chasse ; localiser le niveau d’accélération au Doppler pulsé ou couleur (chambre de chasse ou médioventriculaire). Mesure au repos, pendant la manœuvre de Valsalva, debout, puis à l’effort si nécessaire.</p>
<div class="lab">Appareil mitral</div><p>Mouvement systolique antérieur du feuillet antérieur ; insuffisance mitrale dirigée vers l’arrière (fonctionnelle). Une fuite dirigée vers l’avant ou centrale évoque une anomalie mitrale propre, à prendre en compte dans le choix entre myectomie et alcoolisation.</p>
<div class="lab">Autres éléments</div><p>Diamètre et volume de l’oreillette gauche, fonction diastolique, FEVG (&lt; 50 % : phase dilatée), anévrisme apical, pression pulmonaire, fonction du ventricule droit.</p>
<div class="lab">Piège</div><p>Le flux d’insuffisance mitrale contamine facilement le tracé : un pic précoce, très rapide (&gt; 5–6 m/s), est mitral et non obstructif. Sa vitesse reflète toute la différence de pression systolique entre ventricule et oreillette gauches, souvent supérieure à 100 mmHg (4 × 5² = 100), alors que le flux obstructif traduit seulement la chute de pression dans la chambre de chasse.</p></template>

<template data-pop="i42-strain" data-title="Strain longitudinal et épargne apicale">
<div class="lab">Principe</div><p>Le strain longitudinal mesure le raccourcissement de chaque segment en systole (valeurs négatives). La représentation en carte polaire, vue de l’apex, montre les segments basaux à la périphérie et les segments apicaux au centre.</p>
<div class="lab">Amylose</div><p>Les segments basaux et médians sont très altérés, les segments apicaux relativement préservés : la carte polaire montre un centre conservé entouré d’une couronne altérée. Un rapport entre le strain apical moyen et la somme des strains basal et médian moyens supérieur à 1 est fortement évocateur (sensibilité d’environ 90 % et spécificité d’environ 80 % dans l’étude de Phelan, 2012).</p>
<div class="lab">Autres profils</div><p>CMH : altération maximale dans les segments les plus hypertrophiés. Fabry : altération inférolatérale basale. Cardiotoxicité : baisse relative du strain global &gt; 15 %.</p>
<div class="lab">Limite</div><p>Valeurs dépendantes du logiciel et du fabricant ; suivre un patient avec le même équipement.</p></template>

<template data-pop="i42-irm" data-title="IRM cardiaque dans les cardiomyopathies">
<div class="lab">Question clinique</div><p>Quelle est l’épaisseur exacte, la fonction des deux ventricules, et surtout quelle est la nature du tissu ?</p>
<div class="lab">Séquences</div><p><b>Ciné</b> : volumes, FEVG, épaisseurs, anévrisme, obstruction visible. <b>T2</b> : œdème (inflammation, Tako-tsubo, sarcoïdose active). <b>T1 natif</b> : élevé dans la fibrose, l’œdème et l’amylose ; abaissé dans la maladie de Fabry et la surcharge en fer. Le T1 s’allonge quand l’eau libre et l’espace extracellulaire augmentent ; il se raccourcit en présence de lipides intracellulaires, dont le T1 propre est court, ou de fer, dont l’effet paramagnétique accélère la relaxation. <b>Volume extracellulaire</b> (à partir du T1 avant et après gadolinium et de l’hématocrite) : normal autour de 25 % ; très élevé (&gt; 40 %) dans l’amylose. <b>Rehaussement tardif</b> : fibrose focale, infiltration. <b>T2*</b> : fer.</p>
<div class="lab">Patterns</div><p>Ischémique : sous-endocardique ou transmural systématisé. CMH : plages intramyocardiques dans les segments hypertrophiés et aux points d’insertion du ventricule droit ; quantification en pourcentage de la masse (≥ 15 % : marqueur de risque rythmique). CMD : bande intramyocardique septale. CMNDVG : sous-épicardique en anneau. Amylose : sous-endocardique global. Fabry : inférolatéral basal. Sarcoïdose : en plages, septum basal. Myocardite : sous-épicardique inférolatéral, avec œdème.</p>
<div class="lab">Limites</div><p>Valeurs de T1 propres à chaque appareil et à chaque séquence ; arythmie et apnée difficile dégradent l’image ; dispositifs implantés (vérifier la compatibilité ; défibrillateurs récents souvent compatibles sous conditions) ; si DFG &lt; 30 mL/min/1,73 m², agent macrocyclique à dose minimale, car la fibrose néphrogénique systémique a surtout été décrite avec les anciens chélates linéaires instables ; les cartographies sans contraste restent alors informatives pour l’amylose et la maladie de Fabry.</p>
<div class="lab">Statut</div><p>Recommandée au bilan initial de toute cardiomyopathie (ESC 2023, classe I) et au suivi selon l’évolution. Généralités : fenêtre <b>IRM cardiaque</b> du chapitre I50.</p></template>

<template data-pop="i42-flc" data-title="Recherche d’une protéine monoclonale">
<div class="lab">Trois examens associés</div><p>Immunofixation sérique ; immunofixation urinaire ; dosage sérique des chaînes légères libres kappa et lambda avec leur rapport. L’électrophorèse seule est insuffisante : elle manque les petits clones.</p>
<div class="lab">Valeurs de référence (méthode néphélométrique la plus utilisée)</div><p>Kappa environ 3,3–19,4 mg/L ; lambda environ 5,7–26,3 mg/L ; rapport kappa/lambda 0,26–1,65. En insuffisance rénale, les deux chaînes s’accumulent et l’intervalle du rapport s’élargit (environ 0,37–3,1) : la chaîne kappa, monomère d’environ 25 kDa, est normalement filtrée plus vite que la chaîne lambda, dimère d’environ 50 kDa ; la baisse de la filtration élève donc surtout kappa.</p>
<div class="lab">Interprétation</div><p>Tout résultat anormal chez un patient suspect d’amylose impose une preuve histologique avec typage et un avis hématologique rapide. Un rapport normal avec immunofixations négatives rend une AL très improbable.</p>
<div class="lab">Piège</div><p>Environ 5 % des sujets de plus de 70 ans ont une gammapathie monoclonale de signification indéterminée : sa présence n’établit pas une amylose AL, et elle peut coexister avec une ATTR.</p></template>

<template data-pop="i42-stades" data-title="Stades pronostiques de l’amylose">
<div class="lab">AL : stades de la Mayo Clinic (2004) et modification européenne</div><p>Deux marqueurs : troponine T ≥ 0,035 µg/L (ou troponine I ≥ 0,1 µg/L) et NT-proBNP ≥ 332 ng/L. Stade I : aucun marqueur élevé ; stade II : un marqueur ; stade III : les deux. Stade IIIb : stade III avec NT-proBNP &gt; 8 500 ng/L, pronostic de quelques mois sans réponse hématologique rapide.</p>
<div class="lab">ATTR : stades du National Amyloidosis Centre (2018)</div><p>Deux marqueurs : NT-proBNP &gt; 3 000 ng/L et DFG &lt; 45 mL/min/1,73 m². Stade I : aucun ; stade III : les deux ; stade II : les autres situations. Survie médiane décroissante d’un stade à l’autre, d’environ six ans à environ deux ans dans la cohorte de dérivation.</p>
<div class="lab">Usage</div><p>Pronostic, information du patient, sélection pour les essais. Les stades ne remplacent pas l’évaluation clinique.</p>
<div class="lab">Pourquoi ces marqueurs</div><p>Le NT-proBNP reflète la pression de remplissage et la contrainte pariétale ; la troponine, la lésion des cardiomyocytes ; le DFG, l’atteinte rénale, qui aggrave la congestion et réduit l’élimination du NT-proBNP. Chacun apporte une information pronostique propre, ce qui justifie leur combinaison. Dans l’amylose AL, une réponse hématologique fait baisser le NT-proBNP avant toute régression visible des dépôts ; sa variation sert donc aussi à juger la réponse cardiaque au traitement.</p>
<div class="lab">Source complémentaire</div><p>Dispenzieri et al., Serum cardiac troponins and N-terminal pro-brain natriuretic peptide: a staging system for primary systemic amyloidosis, J Clin Oncol 2004;22:3751–3757. Gillmore et al., A new staging system for cardiac transthyretin amyloidosis, Eur Heart 2018;39:2799–2806. Palladini et al., New criteria for response to treatment in immunoglobulin light chain amyloidosis based on free light chain measurement and cardiac biomarkers, J Clin Oncol 2012;30:4541–4549.</p>
</template>

<template data-pop="i42-scinti" data-title="Scintigraphie osseuse dans l’amylose">
<div class="lab">Traceurs</div><p>Diphosphonates marqués au technétium 99m : DPD, HMDP ou PYP. Le méthylène diphosphonate classique n’est pas adapté, car il se fixe peu sur les dépôts de transthyrétine.</p>
<div class="lab">Grades de Perugini</div><p>0 : pas de fixation cardiaque. 1 : fixation cardiaque inférieure à celle de l’os. 2 : fixation cardiaque égale à celle de l’os. 3 : fixation cardiaque supérieure à celle de l’os, avec fixation osseuse diminuée ou absente.</p>
<div class="lab">Imagerie tomographique</div><p>Indispensable : elle confirme que la fixation siège dans le myocarde et non dans le sang des cavités.</p>
<div class="lab">Interprétation</div><p>Grade 2–3 sans protéine monoclonale : ATTR (spécificité proche de 100 %). Grade 1 : non diagnostique (AL, ATTR débutante) ; poursuivre par une biopsie si la suspicion reste forte. Grade 0 : ATTR peu probable, mais une AL reste possible.</p>
<div class="lab">Faux positifs</div><p>Infarctus récent ou contusion, car les cardiomyocytes nécrosés accumulent du calcium qui fixe le traceur ; traitement prolongé par chloroquine ou hydroxychloroquine, dont la cardiotoxicité fixe aussi le traceur par un mécanisme mal établi ; certaines AL, d’où l’obligation d’exclure une protéine monoclonale.</p></template>

<template data-pop="i42-tep" data-title="TEP au FDG dans la sarcoïdose cardiaque">
<div class="lab">Préparation</div><p>Le myocarde normal capte le glucose. Pour supprimer cette captation : régime riche en graisses et très pauvre en glucides la veille, puis jeûne d’au moins 12 à 18 heures ; certains centres ajoutent de l’héparine intraveineuse, qui active la lipoprotéine lipase, élève les acides gras libres plasmatiques et pousse le myocarde à les utiliser à la place du glucose. Une préparation insuffisante produit une fixation diffuse ininterprétable.</p>
<div class="lab">Lecture</div><p>Fixation focale ou focale sur fond diffus, associée à un défaut de perfusion au repos : sarcoïdose active. Défaut de perfusion sans fixation : cicatrice. Recherche simultanée des sites extracardiaques accessibles à la biopsie.</p>
<div class="lab">Suivi</div><p>La diminution de la fixation sous corticoïdes guide la durée et la décroissance du traitement.</p>
<div class="lab">Recommandation</div><p>L’ESC 2023 sur les cardiomyopathies recommande d’envisager la TEP au FDG dans le bilan d’une cardiomyopathie avec suspicion de sarcoïdose cardiaque (classe IIa, niveau C) ; l’ESC 2026 sur l’insuffisance cardiaque reprend cette position (classe IIa). Une TEP négative n’exclut pas une sarcoïdose inactive, car l’examen détecte l’inflammation et non la cicatrice.</p></template>

<template data-pop="i42-bem" data-title="Biopsie endomyocardique">
<div class="lab">Technique</div><p>Par voie veineuse fémorale ou jugulaire, prélèvement de 4 à 6 fragments au septum du ventricule droit (ou du ventricule gauche selon la localisation en imagerie).</p>
<div class="lab">Analyses</div><p>Histologie standard ; rouge Congo et typage de l’amylose ; coloration de Perls (fer) ; immunohistochimie des infiltrats inflammatoires ; microscopie électronique (maladies de surcharge) ; recherche de génome viral par amplification génique.</p>
<div class="lab">Indications</div><p>Lorsque le résultat modifie le traitement : insuffisance cardiaque rapide avec arythmies ou bloc (myocardite à cellules géantes, sarcoïdose), amylose avec protéine monoclonale, maladie de surcharge incertaine, suspicion de myocardite des inhibiteurs de points de contrôle.</p>
<div class="lab">Risques</div><p>Moins de 1 % de complications graves dans les centres expérimentés : perforation et tamponnade, lésion tricuspide, arythmie, pneumothorax.</p>
<div class="lab">Limite</div><p>Erreur d’échantillonnage dans les maladies en plages (sarcoïdose, myocardite focale) : une biopsie négative ne les exclut pas.</p></template>

<template data-pop="i42-effort" data-title="Épreuve d’effort dans la cardiomyopathie hypertrophique">
<div class="lab">Objectifs</div><p>Mesurer la capacité fonctionnelle, provoquer une obstruction (échocardiographie d’effort), rechercher des arythmies d’effort et évaluer la réponse tensionnelle.</p>
<div class="lab">Réponse tensionnelle anormale</div><p>Absence d’augmentation de la pression systolique d’au moins 20 mmHg, ou chute de plus de 20 mmHg par rapport au pic. Elle concerne environ un tiers des adultes atteints de CMH et traduit une chute inappropriée des résistances vasculaires systémiques avec une réserve de débit insuffisante, à laquelle une obstruction peut contribuer. C’est un marqueur de risque ancien, qui ne fait pas partie du score HCM Risk-SCD : sa valeur prédictive positive pour la mort subite est faible, et l’ESC 2023 ne la retient pas comme indication de défibrillateur. Elle reste examinée dans l’évaluation avant un sport intense.</p>
<div class="lab">Épreuve cardiorespiratoire</div><p>VO₂ pic, seuil ventilatoire et pente VE/VCO₂. La VO₂ pic est le critère principal de SEQUOIA-HCM et de MAPLE-HCM, et une composante du critère combiné principal d’EXPLORER-HCM (VO₂ pic et classe NYHA) ; l’épreuve aide à distinguer le cœur d’athlète ; évalue les candidats à la transplantation.</p>
<div class="lab">Sécurité</div><p>Examen sûr lorsqu’il est encadré ; défibrillateur disponible.</p></template>
<template data-pop="i42-biomarq" data-title="NT-proBNP et troponine dans les cardiomyopathies">
<div class="lab">Physiologie normale</div><p>L’étirement des cardiomyocytes ventriculaires, provoqué par une hausse de pression ou de volume, stimule la synthèse d’un précurseur. Celui-ci est clivé en peptide natriurétique actif, qui favorise la natriurèse et la vasodilatation, et en NT-proBNP inactif, dont l’élimination dépend en grande partie du rein. La troponine appartient à l’appareil contractile : elle ne passe dans le sang qu’en cas de lésion du cardiomyocyte.</p>
<div class="lab">Mécanisme dans les cardiomyopathies</div><p>Le NT-proBNP s’élève avec les pressions de remplissage, donc avec la rigidité ventriculaire, l’obstruction et la congestion. Dans l’amylose, il est souvent très élevé : la pression de remplissage est haute, l’insuffisance rénale fréquente réduit son élimination, et l’amylose AL ajoute une toxicité directe des chaînes légères. La troponine reste élevée de façon chronique quand l’infiltration ou la fibrose entretiennent une lésion continue des cardiomyocytes ; elle s’élève brutalement lors d’une inflammation aiguë, comme une myocardite ou une « phase chaude » liée à <i>DSP</i>.</p>
<div class="lab">Interprétation</div><p>Chez un patient ambulatoire, un NT-proBNP &lt; 125 ng/L rend une insuffisance cardiaque peu probable. Une valeur élevée n’est pas spécifique : l’âge, la fibrillation auriculaire, l’insuffisance rénale, l’embolie pulmonaire et le sepsis l’augmentent, alors que l’obésité l’abaisse. Une troponine élevée mais stable sur plusieurs dosages oriente vers une atteinte chronique ; une cinétique ascendante oriente vers une lésion aiguë.</p>
<div class="lab">Ce qui change la décision</div><p>Une troponine élevée de façon chronique figure parmi les signes qui doivent faire rechercher une amylose chez un patient à parois épaisses (ESC 2023). Ces marqueurs fondent aussi les <button class="w" data-k="i42-stades">stades pronostiques de l’amylose</button>. Dans toutes les cardiomyopathies, des valeurs élevées sont associées aux événements cardiovasculaires, à l’insuffisance cardiaque et au décès ; leur évolution aide au suivi.</p>
<div class="lab">Limites</div><p>Une association pronostique ne prouve pas qu’abaisser le marqueur améliore le pronostic. Les seuils de troponine dépendent de la méthode et du laboratoire.</p>
<div class="lab">Source</div><p>Arbelo et al., 2023 ESC Guidelines for the management of cardiomyopathies, Eur Heart 2023;44:3503–3626, section 6.6 et figure 21. 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure, Eur Heart 2021;42:3599–3726, section 4.2 et tableau 7.</p></template>
