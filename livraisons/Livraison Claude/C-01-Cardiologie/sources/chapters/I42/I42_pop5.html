<template data-pop="i42-d-bb" data-title="Bêtabloquants dans la cardiomyopathie hypertrophique">
<div class="lab">Mécanisme</div><p>Blocage des récepteurs β1 : baisse de la contractilité et de la fréquence ; la diastole s’allonge, le remplissage et la perfusion coronaire s’améliorent ; le gradient provoqué par l’effort diminue.</p>
<div class="lab">Molécules</div><p>Non vasodilatatrices : bisoprolol, métoprolol, propranolol. Les bêtabloquants vasodilatateurs (carvédilol, nébivolol) sont moins adaptés à l’obstruction, car la baisse de postcharge qu’ils provoquent peut majorer le gradient ; l’ESC 2023 recommande des bêtabloquants non vasodilatateurs.</p>
<div class="lab">Preuves</div><p>Amélioration des symptômes et du gradient d’effort, établie surtout par des études anciennes et de petite taille ; un petit essai randomisé récent contre placebo a confirmé, sous métoprolol, la baisse du gradient au repos et à l’effort et l’amélioration des symptômes (Dybro et al., 2021). Aucun effet démontré sur la mortalité. Classe I en première ligne (ESC 2023).</p>
<div class="lab">Titration</div><p>Jusqu’à la dose maximale tolérée ou une fréquence de repos d’environ 50 à 60/min.</p>
<div class="lab">Effets indésirables</div><p>Bradycardie, fatigue, troubles de l’érection, bronchospasme (prudence dans l’asthme).</p>
<div class="lab">Autres usages</div><p>CMAVD (arythmies), CMD (thérapie médicamenteuse fondamentale, molécules du chapitre I50). Monographie générale : fenêtre <b>Bêtabloquants de l’insuffisance cardiaque</b> du chapitre I50.</p></template>

<template data-pop="i42-d-cci" data-title="Vérapamil et diltiazem">
<div class="lab">Mécanisme</div><p>Blocage des canaux calciques de type L du myocarde et du nœud auriculoventriculaire : contractilité et fréquence diminuées, relaxation améliorée. Effet vasodilatateur artériel associé.</p>
<div class="lab">Place</div><p>CMH obstructive ou non obstructive en cas d’intolérance ou de contre-indication aux bêtabloquants (classe I, ESC 2023).</p>
<div class="lab">Posologie</div><p>Vérapamil de 40 mg × 3/jour jusqu’à 480 mg/jour ; diltiazem de 60 mg × 3/jour jusqu’à 360 mg/jour.</p>
<div class="lab">Contre-indications et précautions</div><p>Gradient très élevé avec hypotension ou dyspnée de repos (risque d’œdème pulmonaire) ; FEVG réduite ; amylose ; association intraveineuse à un bêtabloquant (bloc) ; bloc auriculoventriculaire non appareillé. Interactions par le CYP3A4 (statines, anticoagulants oraux directs, ciclosporine) ; hausse de la digoxinémie.</p></template>

<template data-pop="i42-d-diso" data-title="Disopyramide">
<div class="lab">Mécanisme</div><p>Antiarythmique de classe Ia, bloqueur des canaux sodiques, doté d’un effet inotrope négatif puissant, ce qui explique son usage dans l’obstruction.</p>
<div class="lab">Place</div><p>Ajout à un bêtabloquant ou à un inhibiteur calcique chez un patient obstructif resté symptomatique (classe I, niveau B, ESC 2023). En monothérapie, il peut être envisagé en cas d’intolérance ou de contre-indication aux bêtabloquants et au vérapamil ou au diltiazem (classe IIb). Il est en règle associé à un freinateur du nœud auriculoventriculaire, car son effet anticholinergique accélère la conduction auriculoventriculaire et peut rendre une fibrillation auriculaire très rapide.</p>
<div class="lab">Posologie</div><p>100 mg × 3/jour initialement, jusqu’à 400–600 mg/jour selon la tolérance et le QTc.</p>
<div class="lab">Effets indésirables</div><p>Anticholinergiques : sécheresse buccale, rétention urinaire (prudence chez l’homme âgé), glaucome, constipation. Allongement du QT : ECG avant et après chaque augmentation ; réduire la dose si le QTc dépasse 500 ms (ESC 2023), car ce bloqueur sodique de classe Ia freine aussi les courants potassiques de repolarisation et expose aux torsades de pointes.</p>
<div class="lab">Interactions</div><p>Autres médicaments allongeant le QT ; inhibiteurs du CYP3A4.</p>
<div class="lab">Disponibilité</div><p>La disponibilité commerciale en Suisse est indiquée par compendium.ch.</p></template>

<template data-pop="i42-d-mava" data-title="Mavacamten">
<div class="lab">Mécanisme</div><p>Inhibiteur allostérique, sélectif et réversible de l’ATPase de la myosine cardiaque. Il augmente la proportion de têtes de myosine en état super-relâché et réduit l’hypercontractilité, le gradient et les pressions de remplissage.</p>
<div class="lab">Preuves</div><p><b>EXPLORER-HCM</b> (2020, 251 patients, CMH obstructive, NYHA II–III) : le critère combiné d’amélioration de la VO₂ pic et de la classe NYHA a été atteint par 37 % des patients sous mavacamten contre 17 % sous placebo ; gradient après effort fortement réduit ; qualité de vie améliorée. <b>VALOR-HCM</b> (2022) : chez des candidats à la réduction septale, 18 % sous mavacamten contre 77 % sous placebo restaient candidats ou avaient choisi l’intervention à 16 semaines. <b>ODYSSEY-HCM</b> (2025, CMH non obstructive) : critères principaux non atteints.</p>
<div class="lab">Place</div><p>CMH obstructive symptomatique malgré un bêtabloquant ou un inhibiteur calcique (classe IIa, niveau A, ESC 2023), ou en monothérapie en cas d’intolérance ou de contre-indication aux bêtabloquants, au vérapamil ou au diltiazem, ou au disopyramide (classe IIa, niveau B). L’ESC 2023 déconseille l’association au disopyramide, qui n’a pas été étudiée.</p>
<div class="lab">Posologie</div><p>5 mg/jour ; paliers 2,5 – 5 – 10 – 15 mg ; échocardiographie aux semaines 4, 8 et 12, puis toutes les 12 semaines. Réduction d’un palier si le gradient lors de la manœuvre de Valsalva est &lt; 20 mmHg (FEVG ≥ 50 %) ; augmentation pas avant la semaine 12, si le gradient reste ≥ 30 mmHg avec FEVG ≥ 55 % ; interruption si FEVG &lt; 50 %. Métaboliseur lent du CYP2C19 : 2,5 mg/jour, maximum 5 mg/jour.</p>
<div class="lab">Effets indésirables</div><p>Dysfonction systolique (FEVG &lt; 50 %) réversible ; insuffisance cardiaque ; vertiges ; syncope.</p>
<div class="lab">Contre-indications</div><p>Grossesse ; FEVG &lt; 55 % au début ; inhibiteur puissant du CYP3A4 chez un métaboliseur lent du CYP2C19 ou de phénotype inconnu ; association d’un inhibiteur puissant du CYP2C19 et d’un inhibiteur puissant du CYP3A4 (information professionnelle de Camzyos).</p>
<div class="lab">Statut en Suisse</div><p>Camzyos, autorisé par Swissmedic le 25.04.2023 pour la CMH obstructive symptomatique de classe NYHA II–III de l’adulte. Remboursement selon la liste des spécialités.</p></template>

<template data-pop="i42-d-afi" data-title="Aficamten">
<div class="lab">Mécanisme</div><p>Inhibiteur de la myosine cardiaque de seconde génération, qui se fixe sur un site allostérique différent de celui du mavacamten. Sa demi-vie plus courte (environ 3 à 4 jours) permet une titration plus rapide et une réversibilité plus rapide après une baisse de la FEVG.</p>
<div class="lab">Preuves</div><p><b>SEQUOIA-HCM</b> (2024, 282 patients, CMH obstructive) : VO₂ pic augmentée de 1,7 mL/kg/min par rapport au placebo à 24 semaines ; gradient, classe NYHA, qualité de vie et NT-proBNP améliorés ; FEVG &lt; 50 % chez environ 3,5 % des patients. <b>MAPLE-HCM</b> (2025, 175 patients) : en monothérapie, supérieur au métoprolol, avec une différence de VO₂ pic de 2,3 mL/kg/min. <b>ACACIA-HCM</b> (août 2026, CMH non obstructive) : amélioration de la qualité de vie et de la VO₂ pic ; FEVG &lt; 50 % chez environ 10 % des patients.</p>
<div class="lab">Posologie</div><p>5 mg/jour dans SEQUOIA-HCM et MAPLE-HCM ; l’autorisation européenne permet de débuter à 5 ou 10 mg/jour selon la sévérité de l’obstruction initiale (communiqué d’autorisation du 17.02.2026) ; paliers de 5 mg jusqu’à 20 mg/jour, guidés par l’échocardiographie.</p>
<div class="lab">Contre-indications</div><p>Grossesse ; FEVG &lt; 55 % au début.</p>
<div class="lab">Statut</div><p>Autorisé par la Food and Drug Administration américaine (décembre 2025) et dans l’Union européenne (17.02.2026) pour la CMH obstructive symptomatique de classe NYHA II–III. Aucune autorisation Swissmedic retrouvée au 25.09.2026. Non classé par l’ESC 2023, antérieure à son autorisation.</p></template>

<template data-pop="i42-d-tafa" data-title="Tafamidis">
<div class="lab">Mécanisme</div><p>Se fixe sur les sites de liaison de la thyroxine du tétramère de transthyrétine et le stabilise, ce qui freine sa dissociation en monomères amyloïdogènes.</p>
<div class="lab">Preuves</div><p><b>ATTR-ACT</b> (2018, 441 patients, ATTR sauvage ou héréditaire) : mortalité totale 29,5 % contre 42,9 % à 30 mois (rapport de risque 0,70) ; hospitalisations cardiovasculaires réduites ; déclin de la capacité d’effort et de la qualité de vie ralenti. Le bénéfice était plus net chez les patients en classe NYHA I–II.</p>
<div class="lab">Place</div><p>ATTR avec cardiomyopathie, symptomatique, classe NYHA I–II (classe I, niveau B, recommandations ESC 2021 sur l’insuffisance cardiaque ; l’ESC 2023 rappelle que l’effet est le plus marqué en classe I–II) ; en classe III, bénéfice moins net, car un stabilisateur freine les nouveaux dépôts sans éliminer ceux qui ont déjà altéré le myocarde.</p>
<div class="lab">Posologie</div><p>61 mg de tafamidis une fois par jour (équivalent à 80 mg de méglumine de tafamidis).</p>
<div class="lab">Effets indésirables</div><p>Rares : troubles digestifs. Contraception pendant le traitement et un mois après.</p>
<div class="lab">Statut en Suisse</div><p>Autorisé (Vyndaqel 61 mg) ; remboursement avec limitation, prescription spécialisée.</p></template>

<template data-pop="i42-d-acora" data-title="Acoramidis">
<div class="lab">Mécanisme</div><p>Stabilisateur de haute affinité du tétramère de transthyrétine, conçu pour reproduire l’effet d’un variant protecteur naturel de la transthyrétine (remplacement de la thréonine 119 par une méthionine).</p>
<div class="lab">Preuves</div><p><b>ATTRibute-CM</b> (2024, 632 patients) : critère hiérarchique (mortalité totale, hospitalisations cardiovasculaires, NT-proBNP, distance de marche de six minutes) favorable à l’acoramidis ; réduction des hospitalisations cardiovasculaires. Du tafamidis a été ajouté en cours d’essai chez environ 15 % des patients sous acoramidis et 23 % sous placebo, ce qui complique la lecture de la mortalité, dont la réduction n’était pas significative isolément.</p>
<div class="lab">Posologie</div><p>712 mg (deux comprimés de 356 mg) deux fois par jour.</p>
<div class="lab">Effets indésirables</div><p>Troubles digestifs ; élévation modeste et précoce de la créatinine, sans atteinte rénale démontrée.</p>
<div class="lab">Statut en Suisse</div><p>Beyonttra, autorisé par Swissmedic le 18.12.2025 pour l’ATTR avec cardiomyopathie. Non classé par l’ESC 2023, antérieure à l’autorisation.</p></template>

<template data-pop="i42-d-vutri" data-title="Vutrisiran">
<div class="lab">Mécanisme</div><p>Petit ARN interférent couplé à un ligand qui le dirige vers les hépatocytes. Il dégrade l’ARN messager de la transthyrétine, sauvage et variante, et réduit sa concentration sérique d’environ 80 %.</p>
<div class="lab">Preuves</div><p><b>HELIOS-B</b> (2024, 655 patients) : réduction du critère combiné décès et événements cardiovasculaires récidivants (rapport de risque 0,72) et de la mortalité totale sur 42 mois ; bénéfice aussi chez les patients déjà sous tafamidis.</p>
<div class="lab">Posologie</div><p>25 mg par voie sous-cutanée tous les 3 mois, administré par un professionnel.</p>
<div class="lab">Effets indésirables</div><p>Réactions au site d’injection ; baisse de la vitamine A (transportée par la transthyrétine) : supplémentation quotidienne recommandée et avis ophtalmologique si troubles de la vision nocturne. Grossesse à éviter (carence en vitamine A).</p>
<div class="lab">Statut en Suisse</div><p>Amvuttra : extension à l’ATTR avec cardiomyopathie autorisée par Swissmedic le 16.10.2025 ; limitation de remboursement modifiée au 01.04.2026, à durée déterminée. Également autorisé dans la neuropathie amyloïde héréditaire.</p></template>

<template data-pop="i42-d-bromo" data-title="Bromocriptine dans la cardiomyopathie du péripartum">
<div class="lab">Mécanisme</div><p>Agoniste des récepteurs dopaminergiques de type 2 qui supprime la sécrétion de prolactine, et donc la production du fragment cardiotoxique de 16 kDa.</p>
<div class="lab">Preuves</div><p>Étude pilote sud-africaine et essai allemand comparant deux durées de traitement (2017) ; méta-analyses favorables mais fondées sur peu de patientes. Classe IIb dans l’ESC 2018 ; l’ESC 2025 sur la grossesse souligne l’insuffisance des preuves.</p>
<div class="lab">Posologie</div><p>2,5 mg × 2/jour pendant 2 semaines, puis 2,5 mg/jour pendant 6 semaines dans les formes sévères ; 2,5 mg/jour pendant une semaine dans les formes non compliquées.</p>
<div class="lab">Précautions</div><p>Risque thrombotique : des infarctus et des accidents vasculaires cérébraux ont été rapportés sous bromocriptine en post-partum, période déjà hypercoagulable ; une anticoagulation au moins prophylactique est donc associée pendant toute la durée. Arrêt de la lactation : discuter l’impact sur l’allaitement avec la patiente. Hypertension, céphalées, troubles psychiatriques.</p></template>
<template data-pop="i42-pk-myosine" data-title="Inhibiteurs de la myosine : pourquoi la titration est lente">
<div class="lab">Principe pharmacocinétique</div><p>Lors d’une prise quotidienne, la concentration plasmatique s’accumule jusqu’à un état d’équilibre, atteint après environ cinq demi-vies. Après l’arrêt, l’élimination demande le même délai. L’effet complet d’un changement de dose n’apparaît donc qu’après plusieurs demi-vies.</p>
<div class="lab">Mécanisme</div><p>Le mavacamten est éliminé surtout par le CYP2C19, puis par le CYP3A4. Sa demi-vie terminale est de 6 à 9 jours chez le métaboliseur normal et de 23 jours chez le métaboliseur lent, dont l’exposition peut être triplée. L’équilibre demande ainsi environ 4 à 6 semaines chez le premier et près de 4 mois chez le second. Un inhibiteur de l’une de ces deux voies ralentit encore l’élimination et accroît l’exposition.</p>
<div class="lab">Conséquence clinique</div><p>La concentration continue de monter pendant les premières semaines alors que la dose ne change pas. L’effet inotrope négatif peut donc dépasser le but après coup : le gradient disparaît d’abord, puis la FEVG baisse. Un gradient inférieur à 20 mmHg pendant la manœuvre de Valsalva signale cet excès avant la dysfonction systolique.</p>
<div class="lab">Ce qui change la décision</div><p>Le CYP2C19 est génotypé avant le début ; en attendant le résultat, le schéma du métaboliseur lent s’applique (2,5 mg, au maximum 5 mg). L’échocardiographie des semaines 4 et 8 sert à réduire la dose ou à suspendre le traitement si le gradient est trop bas ; l’augmentation n’est envisagée qu’à partir de la semaine 12, quand l’exposition approche de l’équilibre. Après chaque augmentation, un contrôle à 4 semaines précède au moins 3 mois au même palier. Une FEVG &lt; 50 % impose une interruption d’au moins 4 semaines, jusqu’au retour à 50 % ou plus. Le même délai d’élimination explique que la contraception soit poursuivie 6 mois après l’arrêt. L’aficamten, de demi-vie plus courte, atteint plus vite l’équilibre, ce qui autorise des paliers plus rapprochés.</p>
<div class="lab">Limites</div><p>Les intervalles d’entretien diffèrent selon les autorités : l’information européenne prévoit un contrôle tous les 6 mois si la FEVG est d’au moins 55 % et tous les 3 mois si elle est comprise entre 50 et 55 %. L’information professionnelle suisse en vigueur fait foi pour la prescription.</p>
<div class="lab">Source</div><p>Agence européenne des médicaments, Camzyos (mavacamten), résumé des caractéristiques du produit, sections 4.2, 4.4, 4.6 et 5.2. Arbelo et al., 2023 ESC Guidelines for the management of cardiomyopathies, Eur Heart 2023;44:3503–3626, section 7.1.4.1.2.</p></template>
