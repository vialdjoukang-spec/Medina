
<template data-pop="i30-esc-2026-comparaison" data-title="Péricarde : ce que changent les textes ESC 2026">
<p>Aucune recommandation ESC de 2026 ne porte sur le péricarde : l’ESC 2025 sur les myocardites et péricardites reste le référentiel du diagnostic et du traitement. Un seul point modifie l’interprétation d’un examen : la cinquième définition universelle de l’infarctus impose un seuil de troponine propre au sexe pour affirmer une lésion myocardique. Les autres textes de 2026 confirment le cours.</p>
<table class="t"><tr><th>Point</th><th>Avant 2026</th><th>Textes 2026</th></tr>
<tr><td>Troponine</td><td>Quatrième définition (2018) : seuils propres au sexe recommandés avec les dosages ultrasensibles.</td><td>Cinquième définition : lésion myocardique aiguë si la troponine monte ou baisse avec au moins une valeur au-dessus du 99e percentile propre au sexe. Le seuil féminin est inférieur au seuil unique ; pour la troponine T ultrasensible, il vaut environ la moitié du seuil masculin.</td></tr>
<tr><td>Cathétérisme dans la constriction</td><td>ESC 2025 : à envisager si l’imagerie multimodale ne tranche pas (IIa, C).</td><td>Insuffisance cardiaque : cathétérisme droit à envisager si l’insuffisance cardiaque paraît due à une constriction (IIa, C) ; le cathétérisme droit et gauche reste nécessaire pour la distinguer d’une cardiomyopathie restrictive.</td></tr>
<tr><td>Peptides natriurétiques</td><td>Concentration basse dans la constriction établie par des séries cliniques.</td><td>Insuffisance cardiaque : la constriction figure parmi les causes de concentration abaissée.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Le seuil unique du fabricant, 14 ng/L pour la troponine T ultrasensible, dépasse le seuil féminin. Chez une femme, une troponine qui monte ou baisse sous cette valeur peut donc signer une atteinte myocardique et faire classer la péricardite en myopéricardite, avec IRM et restriction prolongée de l’effort. Le cathétérisme garde sa place de recours quand l’imagerie ne tranche pas. Un peptide natriurétique bas ne rassure pas devant des signes de congestion. La réadaptation cardiaque 2026 range aussi la péricardite aiguë parmi les contre-indications à l’épreuve d’effort et à l’entraînement, comme l’ESC 2025, qui restreint l’effort jusqu’à la rémission, au moins un mois (I, C).</p>
