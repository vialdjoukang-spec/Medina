<template data-pop="i35-d-asa" data-title="Aspirine et clopidogrel après intervention valvulaire">
<div class="lab">Mécanisme</div><p><b>Aspirine</b> : inhibition irréversible de la cyclo-oxygénase 1 plaquettaire, baisse de la synthèse du thromboxane pour la durée de vie de la plaquette (7 à 10 jours). <b>Clopidogrel</b> : promédicament activé par le foie (CYP2C19), qui bloque irréversiblement le récepteur plaquettaire P2Y12.</p>
<div class="lab">Preuves</div><p>POPular TAVI, cohorte A (2020) : après TAVI, l’aspirine seule a réduit les hémorragies par rapport à l’association aspirine-clopidogrel, sans augmenter les événements thrombotiques. Cohorte B : chez le patient anticoagulé, l’ajout de clopidogrel augmente les hémorragies sans bénéfice.</p>
<div class="lab">Posologie</div><p>Aspirine 75–100 mg/jour, pendant 12 mois après TAVI en l’absence d’indication d’anticoagulation (classe I, niveau A, ESC/EACTS 2025), puis au long cours à envisager (classe IIa, niveau C) ; clopidogrel 75 mg/jour en cas d’intolérance à l’aspirine ou pour la durée imposée par une angioplastie récente.</p>
<div class="lab">Effets indésirables</div><p>Hémorragies, surtout digestives ; dyspepsie ; bronchospasme chez certains asthmatiques (aspirine) ; éruption, rarement neutropénie (clopidogrel).</p>
<div class="lab">Contre-indications</div><p>Hémorragie active, ulcère évolutif, allergie vraie ; aspirine en fin de grossesse à dose antalgique.</p>
<div class="lab">Surveillance</div><p>Hémoglobine, signes de saignement ; inhibiteur de la pompe à protons si risque digestif élevé.</p>
<div class="lab">Pourquoi un antiplaquettaire</div><p>Un endothélium intact empêche les plaquettes d’adhérer. Après un TAVI, l’armature métallique, la jupe de tissu et les cuspides natives écrasées sont d’abord à nu. On admet que les plaquettes y adhèrent tant qu’un tissu cicatriciel ne les a pas recouvertes ; ce rationnel repose sur la physiopathologie plus que sur des essais.</p>
<div class="lab">Pourquoi pas davantage</div><p>Les patients traités par TAVI sont âgés et saignent facilement. La double antiagrégation n’est donc pas recommandée après TAVI sans autre indication (classe III, niveau B). Une anticoagulation systématique ne l’est pas non plus : dans l’essai GALILEO, le rivaroxaban 10 mg associé à l’aspirine a augmenté les décès, les complications thromboemboliques et les hémorragies par rapport à l’association aspirine-clopidogrel.</p>
<div class="lab">Durée</div><p>Au-delà de 12 mois, la poursuite de l’aspirine à faible dose (classe IIa) repose sur l’avis d’experts et de petites études, non sur des essais randomisés (niveau C). Le texte de l’ESC/EACTS 2025 décrit néanmoins l’aspirine à faible dose à vie comme le traitement de référence après TAVI sans indication d’anticoagulation, car les essais l’ont montrée plus sûre que la double antiagrégation. Après bioprothèse chirurgicale aortique, l’aspirine ou l’antivitamine K pendant les trois premiers mois sont deux options (classe IIa, niveau B). Une petite étude randomisée et une méta-analyse ont trouvé plus d’hémorragies majeures sous antivitamine K, sans moins d’embolies, mais avec une faible puissance statistique.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025 sur les valvulopathies (Praz et al.), sections 14.3.2.1 et 14.3.2.2, tableau de recommandations 16.</p>
</template>

<template data-pop="i35-d-hep" data-title="Héparines : relais et grossesse">
<div class="lab">Mécanisme</div><p>Potentialisation de l’antithrombine. L’héparine non fractionnée inhibe la thrombine et le facteur Xa ; l’héparine de bas poids moléculaire (énoxaparine) agit surtout sur le facteur Xa.</p>
<div class="lab">Indications</div><p>Relais d’une antivitamine K autour d’une chirurgie majeure chez le porteur de prothèse mécanique ; grossesse (premier trimestre ou fin de grossesse) ; anticoagulation postopératoire précoce.</p>
<div class="lab">Posologie</div><p>Énoxaparine curative 1 mg/kg deux fois par jour par voie sous-cutanée ; grossesse sur prothèse mécanique : dose ajustée pour une activité anti-Xa de 0,8 à 1,2 U/mL (prothèse aortique) 4 à 6 heures après l’injection, contrôlée chaque semaine (ESC 2018 ; l’ESC 2025 précise que la zone anti-Xa optimale n’est pas établie). Héparine non fractionnée intraveineuse ajustée au temps de céphaline activée ou à l’activité anti-Xa.</p>
<div class="lab">Effets indésirables</div><p>Hémorragie ; thrombopénie induite par l’héparine (plus rare avec l’héparine de bas poids moléculaire) ; ostéoporose en usage prolongé.</p>
<div class="lab">Contre-indications et précautions</div><p>Antécédent de thrombopénie induite par l’héparine ; hémorragie active. Héparine de bas poids moléculaire : accumulation si clairance &lt; 30 mL/min (préférer l’héparine non fractionnée).</p>
<div class="lab">Surveillance</div><p>Plaquettes ; activité anti-Xa pendant la grossesse sur prothèse mécanique, car les besoins augmentent avec le poids et le volume de distribution.</p>
<div class="lab">Pourquoi un relais, et quand s’en passer</div><p>L’effet de l’antivitamine K disparaît en plusieurs jours, le temps que le foie reconstitue les facteurs de coagulation. L’héparine, d’action brève, protège la prothèse pendant cette période et s’arrête juste avant le geste. Ce relais est envisagé lorsqu’un facteur thromboembolique s’ajoute à la prothèse (classe IIa, niveau B). Chez le porteur d’une valve mécanique aortique de nouvelle génération sans autre facteur de risque, l’arrêt 3 à 4 jours avant le geste et la reprise dans les 24 heures sans relais peuvent être envisagés (classe IIb, niveau B). Chez ces patients, renoncer au relais réduit les saignements postopératoires sans augmenter les thromboses.</p>
<div class="lab">Pourquoi les héparines pendant la grossesse</div><p>Les héparines, non fractionnée ou de bas poids moléculaire, ne traversent pas le placenta, contrairement à l’antivitamine K. Leur substitution au plus tard à six semaines semble supprimer le risque d’embryopathie (Bates et al., 2012). Elles protègent cependant moins bien la valve mécanique : la fiche <button class="w" data-k="i35-grossesse">grossesse et valvulopathies aortiques</button> en donne les chiffres.</p>
<div class="lab">Ce qui change la décision</div><p>Les complications fœtales de la warfarine augmentent avec la dose (Vitale et al., 1999). Si la dose nécessaire est inférieure à 5 mg/jour, l’ESC/EACTS 2025 admet de la poursuivre pendant toute la grossesse, puis de passer à l’héparine non fractionnée avant l’accouchement. Au-delà, une héparine de bas poids moléculaire à dose ajustée, au moins deux fois par jour, remplace l’antivitamine K pendant le premier trimestre, sous contrôle strict de l’activité anti-Xa.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025 sur les valvulopathies (Praz et al.), sections 14.3.1.3 et 16.2.2, tableau de recommandations 15 ; Bates et al., Chest 2012;141 (supplément 2) ; Vitale et al., J Am Coll Cardiol 1999;33:1637-41.</p>
</template>

<template data-pop="i35-d-vasodil" data-title="Vasodilatateurs artériels dans l’insuffisance aortique">
<div class="lab">Molécules</div><p>Inhibiteurs calciques dihydropyridiniques (nifédipine à libération prolongée, amlodipine) ; IEC ; ARA II.</p>
<div class="lab">Mécanisme</div><p>La baisse de la pression aortique diastolique réduit le gradient de fuite et le volume régurgité ; la baisse de la postcharge facilite l’éjection.</p>
<div class="lab">Preuves</div><p>Un essai de 1994 (nifédipine) suggérait un retard de la chirurgie ; l’essai d’Evangelista (2005, nifédipine ou énalapril contre absence de traitement) n’a montré aucun retard de l’indication opératoire ni de la dilatation ventriculaire.</p>
<div class="lab">Place</div><p>Traitement de l’hypertension chez le patient porteur d’une IA ; traitement symptomatique si la chirurgie est impossible ; dysfonction ventriculaire persistante après chirurgie. Pas d’usage pour retarder une chirurgie indiquée.</p>
<div class="lab">Effets indésirables</div><p>Dihydropyridines : œdèmes des chevilles, céphalées, bouffées de chaleur. IEC et ARA II : hyperkaliémie, hausse de la créatinine, toux (IEC), angiœdème.</p>
<div class="lab">Contre-indications</div><p>Grossesse (IEC, ARA II) ; hypotension ; prudence si un RA sévère est associé.</p></template>

<template data-pop="i35-d-nitroprus" data-title="Nitroprussiate de sodium">
<div class="lab">Mécanisme</div><p>Donneur de monoxyde d’azote : vasodilatation artérielle et veineuse immédiate, d’action très brève (minutes).</p>
<div class="lab">Indications dans ce chapitre</div><p>IA aiguë en attente de chirurgie : réduit la postcharge et le volume régurgité. RA sévère avec dysfonction ventriculaire et bas débit, sous surveillance hémodynamique invasive : peut améliorer le débit en attendant l’intervention (étude de Khot, 2003).</p>
<div class="lab">Posologie</div><p>Perfusion intraveineuse continue, 0,3 µg/kg/min au départ, titrée jusqu’à 5 µg/kg/min (ESC 2021 insuffisance cardiaque) ; la dose de 10 µg/kg/min de l’information professionnelle ne se maintient pas plus de 10 minutes ; protéger de la lumière.</p>
<div class="lab">Effets indésirables</div><p>Hypotension ; toxicité par le cyanure (acidose lactique, confusion) et le thiocyanate (insuffisance rénale, perfusion prolongée).</p>
<div class="lab">Surveillance</div><p>Pression artérielle invasive, lactate, durée la plus brève possible, fonction rénale.</p>
<div class="lab">Pourquoi il peut aider dans le rétrécissement aortique à bas débit</div><p>Le ventricule gauche éjecte contre deux résistances placées en série : la valve rétrécie et les artérioles. Dans l’insuffisance cardiaque, l’activation neurohormonale resserre les artérioles et ajoute de la postcharge. Le nitroprussiate les relâche ; un ventricule défaillant peut alors éjecter davantage, même à travers un orifice fixe. Si le débit n’augmente pas, la pression chute aussitôt : d’où la surveillance invasive.</p>
<div class="lab">Mécanisme de la toxicité</div><p>Chaque molécule de nitroprussiate porte cinq ions cyanure, libérés au contact de l’hémoglobine. Le foie les transforme en thiocyanate grâce au thiosulfate et à l’enzyme rhodanèse, puis le rein élimine le thiocyanate. Au-delà d’environ 2 µg/kg/min, la libération de cyanure peut dépasser cette capacité. Le cyanure libre bloque alors la cytochrome oxydase mitochondriale : les cellules passent au métabolisme anaérobie et le lactate s’élève, ce qui en fait un marqueur utile. En insuffisance rénale, c’est le thiocyanate qui s’accumule. La lumière dégrade la solution et libère du cyanure, d’où la protection de la perfusion.</p>
<div class="lab">Source complémentaire</div><p>Hottinger et al., Sodium nitroprusside in 2014: a clinical concepts review, J Anaesthesiol Clin Pharmacol 2014;30:462-71.</p>
</template>

<template data-pop="i35-d-inotrope" data-title="Dobutamine et noradrénaline">
<div class="lab">Dobutamine</div><p>Agoniste β1 prédominant : contractilité et fréquence augmentées, légère vasodilatation. <b>Diagnostic</b> : échocardiographie de stress à faible dose dans le RA à bas débit (jusqu’à 20 µg/kg/min). <b>Thérapeutique</b> : IA aiguë en attente de chirurgie, bas débit ; la tachycardie raccourcit la diastole et limite la fuite. Dose 2 à 20 µg/kg/min.</p>
<div class="lab">Noradrénaline</div><p>Agoniste α1 prédominant, avec un effet β1 : vasoconstriction, hausse de la pression artérielle et de la pression de perfusion coronaire. Place : hypotension du RA sévère décompensé ou à l’induction anesthésique, pour éviter la chute de la perfusion coronaire d’un ventricule hypertrophié. Dose 0,2 à 1,0 µg/kg/min.</p>
<div class="lab">Effets indésirables</div><p>Arythmies, ischémie myocardique (dobutamine) ; ischémie périphérique, extravasation (noradrénaline, voie centrale préférée).</p>
<div class="lab">Surveillance</div><p>Monitorage continu du rythme et de la pression artérielle, lactate, diurèse.</p>
<div class="lab">Pourquoi accélérer le cœur dans l’insuffisance aortique aiguë</div><p>Le ventricule non dilaté ne peut pas accueillir brutalement le volume régurgité. Une fréquence plus rapide raccourcit la diastole, donc le temps pendant lequel le sang reflue, et maintient le débit. Pour la même raison, une stimulation rapide par une sonde temporaire peut améliorer transitoirement l’hémodynamique en attendant la chirurgie (ESC/EACTS 2025). Un vasoconstricteur seul aurait l’effet inverse : il élève la pression aortique diastolique, donc le gradient qui entraîne la fuite.</p>
<div class="lab">Pourquoi restaurer la pression dans le rétrécissement aortique</div><p>Le ventricule gauche est perfusé surtout en diastole. La pression qui pousse le sang dans les coronaires est la pression aortique diastolique diminuée de la pression télédiastolique du ventricule. Dans le RA, la pression télédiastolique élevée réduit déjà cette marge. Une hypotension la supprime : l’ischémie sous-endocardique altère la contraction, le débit baisse, puis la pression chute encore. La noradrénaline rompt ce cercle en restaurant la pression diastolique.</p>
<div class="lab">Source complémentaire</div><p>ESC/EACTS 2025 sur les valvulopathies (Praz et al.), section 6.5 (stimulation rapide dans l’insuffisance aortique aiguë).</p>
</template>

<template data-pop="i35-d-aorte" data-title="Bêtabloquants et ARA II dans les aortopathies">
<div class="lab">Mécanisme</div><p><b>Bêtabloquants</b> : baisse de la pression artérielle et de la vitesse de montée de la pression (contrainte sur la paroi aortique). <b>ARA II</b> (losartan) : baisse tensionnelle et atténuation de la signalisation du TGF-β, excessive dans le syndrome de Marfan.</p>
<div class="lab">Preuves</div><p>Syndrome de Marfan : essai du Pediatric Heart Network (2014), aténolol et losartan comparables ; essai COMPARE (2013), ralentissement de la dilatation par le losartan ajouté ; méta-analyse des essais (Lancet, 2022) : réduction de la progression de la racine par les ARA II, y compris en association avec un bêtabloquant.</p>
<div class="lab">Posologie</div><p>Dose maximale tolérée : bisoprolol jusqu’à 10 mg/jour ; losartan titré jusqu’à 100 mg/jour.</p>
<div class="lab">Bicuspidie et aortopathie dégénérative</div><p>Pas de molécule spécifique démontrée ; contrôle strict de la pression artérielle.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Bêtabloquants : bradycardie, fatigue ; à éviter dans l’IA sévère sans aortopathie à traiter. ARA II : contre-indiqués pendant la grossesse (relais par bêtabloquant avant la conception).</p></template>

<template data-pop="i35-d-statine" data-title="Statines et rétrécissement aortique">
<div class="lab">Hypothèse</div><p>La phase d’initiation de la calcification valvulaire ressemble à l’athérosclérose.</p>
<div class="lab">Preuves</div><p>SALTIRE (2005, atorvastatine 80 mg), SEAS (2008, simvastatine et ézétimibe), ASTRONOMER (2010, rosuvastatine 40 mg) : aucune réduction de la progression du RA établi. Dans SEAS, les événements ischémiques ont diminué.</p>
<div class="lab">Place</div><p>Indication selon le risque cardiovasculaire global (SCORE2, maladie coronaire associée), pas pour la valve.</p>
<div class="lab">Perspectives</div><p>Traitements abaissant la Lp(a) et ciblant la voie ostéogénique : aucun n’est validé à ce jour pour freiner le RA.</p></template>

<template data-pop="i35-d-benza" data-title="Pénicilline G benzathine">
<div class="lab">Mécanisme</div><p>Sel de pénicilline G à libération lente depuis le site d’injection intramusculaire : concentrations faibles mais prolongées, suffisantes contre le streptocoque du groupe A pendant 3 à 4 semaines.</p>
<div class="lab">Indication</div><p>Prévention secondaire du rhumatisme articulaire aigu, pour éviter les récidives qui aggravent les lésions valvulaires.</p>
<div class="lab">Posologie</div><p>1,2 million d’unités par voie intramusculaire toutes les 3 à 4 semaines chez l’adulte et l’enfant de plus de 30 kg (OMS, AHA). Alternative orale : pénicilline V 250 mg deux fois par jour ; érythromycine en cas d’allergie.</p>
<div class="lab">Durée</div><p>Au moins 10 ans après la dernière poussée, jusqu’à 40 ans ou plus en cas d’atteinte valvulaire modérée à sévère.</p>
<div class="lab">Effets indésirables</div><p>Douleur au point d’injection ; réaction allergique, rare anaphylaxie.</p>
<div class="lab">Disponibilité</div><p>Vérifier la disponibilité et le statut d’autorisation sur compendium.ch ; le produit peut nécessiter une importation.</p>
<div class="lab">Pourquoi une prévention secondaire</div><p>Le rhumatisme articulaire aigu est une réaction auto-immune qui suit une infection à streptocoque du groupe A. Les lésions valvulaires peuvent résulter d’une poussée sévère unique ou de poussées répétées (Carapetis et al., 2016). Chaque nouvelle infection peut donc aggraver une valve déjà atteinte. L’injection retard maintient pendant 3 à 4 semaines une concentration qui prévient ces infections, sans dépendre d’une prise orale quotidienne.</p>
<div class="lab">Position européenne</div><p>L’ESC/EACTS 2025 recommande cette prophylaxie pendant 10 ans chez le patient atteint de cardiopathie rhumatismale, surtout chez l’enfant et l’adolescent. Elle propose de la prolonger à l’âge adulte selon la sévérité de la valvulopathie et l’exposition au streptocoque.</p>
<div class="lab">Source complémentaire</div><p>Carapetis et al., Acute rheumatic fever and rheumatic heart disease, Nat Rev Dis Primers 2016;2:15084 ; ESC/EACTS 2025 sur les valvulopathies (Praz et al.), section 6.4.</p>
</template>
<template data-pop="i35-d-aod-meca" data-title="Anticoagulants oraux directs et prothèse mécanique">
<div class="lab">Physiologie normale</div><p>Dans un vaisseau lésé, la coagulation démarre surtout par le facteur tissulaire exposé dans la brèche : c’est la voie extrinsèque. La voie de contact, qui commence par le facteur XII puis le facteur XI, joue un rôle mineur dans l’hémostase normale. Elle s’active en revanche au contact des surfaces artificielles.</p>
<div class="lab">Mécanisme</div><p>Les ailettes et l’anneau de suture d’une prothèse mécanique activent en permanence la voie de contact : au laboratoire, la production de thrombine qu’ils déclenchent disparaît sans facteur XII ou XI. Cette thrombine submerge le dabigatran aux concentrations atteintes en clinique, alors que le plasma de patients sous antivitamine K la supprime dès un INR supérieur à 1,5 (Jaffer et al., 2015). Cette explication de laboratoire concorde avec l’échec des deux essais cliniques.</p>
<div class="lab">Conséquence clinique</div><p>Deux essais l’ont confirmé. RE-ALIGN comparait le dabigatran à la warfarine après remplacement valvulaire mécanique aortique ou mitral. Il a été arrêté après 252 patients : un AVC est survenu chez 5 % des patients sous dabigatran et chez aucun sous warfarine ; une hémorragie majeure chez 4 % contre 2 % (Eikelboom et al., 2013). PROACT Xa comparait l’apixaban 5 mg deux fois par jour à la warfarine (INR 2,0 à 3,0) chez des porteurs d’une valve aortique On-X, réputée peu thrombogène. Il a été arrêté après 863 patients. La thrombose de valve ou l’embolie liée à la valve atteignait 4,2 % par patient-année sous apixaban, contre 1,3 % sous warfarine (Wang et al., 2023).</p>
<div class="lab">Ce qui change la décision</div><p>Tout porteur de prothèse mécanique reçoit une antivitamine K à vie (classe I, niveau A), avec une <button class="w" data-k="i35-inr">cible d’INR adaptée à la prothèse</button>. Les AOD restent proscrits, même lorsque l’INR est instable (classe III, niveau A). L’instabilité se corrige par l’éducation du patient et, chez le patient formé, par l’automesure de l’INR, qui améliore l’efficacité du traitement (classe I, niveau A). Après une bioprothèse chirurgicale, les données d’essais soutiennent au contraire les AOD pour traiter une fibrillation auriculaire associée : ils sont préférés à l’antivitamine K après trois mois (classe IIa, niveau B).</p>
<div class="lab">Source</div><p>Jaffer et al., Dabigatran is less effective than warfarin at attenuating mechanical heart valve-induced thrombin generation, J Am Heart Assoc 2015;4:e002322 ; Eikelboom et al., Dabigatran versus warfarin in patients with mechanical heart valves, N Engl Med 2013;369:1206-14 ; Wang et al., Apixaban or warfarin in patients with an On-X mechanical aortic valve, New England Journal of Medicine Evidence 2023;2(7) ; ESC/EACTS 2025 sur les valvulopathies (Praz et al.), sections 14.3.1 et 14.3.2.3, tableau de recommandations 14.</p></template>
