
<template data-pop="i44-esc-2026-comparaison" data-title="ESC 2026 : resynchronisation dans le BAV et dispositifs chez le dialysé">
<p>L’ESC n’a publié en 2026 aucune recommandation propre à la stimulation : les indications de stimulation restent celles de 2021. Deux textes de 2026 modifient pourtant des décisions du chapitre. L’ESC 2026 sur l’insuffisance cardiaque élargit le champ de la resynchronisation dans le BAV à toute fraction d’éjection &lt; 50 %, mais ne la place plus qu’en classe IIa. L’ESC 2026 sur la maladie rénale chronique ajoute une mesure contre l’infection des dispositifs.</p>
<table class="t"><tr><th>Point</th><th>ESC 2021</th><th>ESC 2026</th></tr>
<tr><td>Resynchronisation plutôt que stimulation ventriculaire droite, si BAV de haut degré et insuffisance cardiaque à fraction réduite</td><td>Recommandée (I, A) si la fraction est &lt; 40 % (stimulation) ou ≤ 40 % (insuffisance cardiaque).</td><td>À envisager (IIa, B1) dans l’insuffisance cardiaque à fraction &lt; 50 %, quelle que soit la classe NYHA ou la largeur du QRS, pour réduire les hospitalisations pour insuffisance cardiaque et les décès.</td></tr>
<tr><td>Insuffisance cardiaque nouvelle ou aggravée chez un patient appareillé</td><td>Mise à niveau vers une resynchronisation à envisager si fraction ≤ 35 % et part importante de stimulation ventriculaire droite (IIa, B).</td><td>Même mise à niveau (IIa, B1). Nouvelle recommandation : vérifier la part de stimulation ventriculaire droite (IIa, C).</td></tr>
<tr><td>Stimulation du système de conduction, fraction réduite</td><td>Consensus clinique ESC 2025 : alternative possible à la resynchronisation biventriculaire.</td><td>Aucune recommandation : aucun essai randomisé n’a évalué ses effets cliniques ni sa sécurité à long terme dans cette population.</td></tr>
<tr><td>Enveloppe antibiotique</td><td>Réintervention sur un dispositif (IIb, B).</td><td>Implantation chez l’hémodialysé ou le greffé rénal, en plus de l’antibioprophylaxie (IIb, C).</td></tr></table>
<div class="lab">Ce qui change pour la décision</div><p>Devant un BAV de haut degré qui imposera une stimulation ventriculaire fréquente, la fraction d’éjection est mesurée avant l’implantation, car la stimulation à la pointe du ventricule droit active le ventricule gauche avec retard et peut altérer sa fonction. Chez un patient en insuffisance cardiaque dont la fraction est de 40 à 49 %, la resynchronisation entre désormais dans le champ de la recommandation, comme option à discuter et non comme obligation. La recommandation s’appuie sur l’essai BLOCK HF, qui incluait des fractions ≤ 50 % ; le niveau B1 de la nouvelle échelle désigne au moins un essai randomisé de puissance suffisante et ne se compare pas terme à terme à l’ancien niveau A. Une fraction &lt; 50 % sans symptôme ni signe relève du stade B et sort, à la lettre, de cette recommandation. Chez un patient appareillé dont la fonction se dégrade, l’interrogation du dispositif mesure la part de stimulation ventriculaire droite. Chez le dialysé, l’enveloppe se discute en plus de la préservation des veines de la fistule. La réadaptation 2026 est recommandée après un défibrillateur ou une resynchronisation (I, B1), sans recommandation propre au stimulateur anti-bradycardique seul.</p>
