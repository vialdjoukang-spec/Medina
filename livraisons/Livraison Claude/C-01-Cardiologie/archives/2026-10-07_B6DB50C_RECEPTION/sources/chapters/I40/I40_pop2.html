
<!-- ===== FENÊTRES I40 : clinique ===== -->
<template data-pop="i40-atcd-inf" data-title="Infection récente">
<div class="lab">Question</div><p>« Avez-vous eu de la fièvre, un rhume, une grippe, une diarrhée ou une angine dans les trois dernières semaines ? Quelqu’un de votre entourage était-il malade ? »</p>
<div class="lab">Délai typique</div><p>Le plus souvent deux à quatre semaines entre l’infection et les symptômes cardiaques (ESC 2025) : temps de la phase immunitaire. Un intervalle plus court (quelques jours) évoque une atteinte virale directe ou un vaccin.</p>
<div class="lab">Valeur</div><p>Un prodrome est rapporté par environ 80 % des patients (fièvre dans 60 % des cas, troubles digestifs dans 30 %, symptômes respiratoires dans 25 %), mais il est banal dans la population. Il oriente sans prouver ; son absence n’exclut rien.</p></template>

<template data-pop="i40-atcd-med" data-title="Médicaments, immunothérapie, vaccin récent">
<div class="lab">Immunothérapie</div><p>« Recevez-vous un traitement contre le cancer par perfusion ? Depuis quand ? » Nivolumab, pembrolizumab, atézolizumab, durvalumab, ipilimumab : risque maximal dans les trois premiers mois, surtout en association.</p>
<div class="lab">Vaccin</div><p>Date et numéro de la dose d’un vaccin à ARN messager : délai typique 2 à 4 jours après la deuxième dose.</p>
<div class="lab">Hypersensibilité</div><p>Clozapine (quatre premières semaines), bêtalactamines, sulfamides, anticonvulsivants, minocycline ; nouveau médicament dans les semaines précédentes, avec éruption ou éosinophilie.</p>
<div class="lab">Toxiques</div><p>Anthracyclines, cyclophosphamide à forte dose, fluoropyrimidines (spasme), cocaïne, amphétamines.</p></template>

<template data-pop="i40-atcd-auto" data-title="Maladie auto-immune, asthme, éosinophilie">
<div class="lab">À rechercher</div><p>Lupus, polymyosite, sclérodermie, polyarthrite rhumatoïde ; sarcoïdose connue ; thymome, myasthénie, maladie inflammatoire de l’intestin, thyroïdite (associées à la myocardite à cellules géantes) ; asthme tardif, polypose nasosinusienne, neuropathie (EGPA) ; éosinophilie ancienne sur des bilans antérieurs.</p>
<div class="lab">Pourquoi</div><p>Ces terrains orientent vers les formes qui relèvent d’une immunosuppression et justifient une biopsie plus précoce.</p></template>

<template data-pop="i40-atcd-voyage" data-title="Origine, voyage, piqûre de tique">
<div class="lab">Amérique latine</div><p>« Où êtes-vous né ? Avez-vous vécu à la campagne, dans une maison en torchis ? Votre mère est-elle originaire d’Amérique latine ? Avez-vous reçu une transfusion là-bas ? » Maladie de Chagas, parfois 10 à 30 ans après l’infection.</p>
<div class="lab">Tiques</div><p>Randonnée, forêt, jardin ; piqûre, rougeur qui s’étend (érythème migrant) dans les semaines précédentes : cardite de Lyme.</p>
<div class="lab">Tropiques</div><p>Séjour prolongé en zone tropicale : strongyloïdose latente à traiter avant les corticoïdes ; autres parasitoses à éosinophiles.</p></template>

<template data-pop="i40-atcd-fam" data-title="Histoire familiale">
<div class="lab">Questions</div><p>Mort subite avant 50 ans, cardiomyopathie, défibrillateur, transplantation cardiaque, « myocardite » chez un apparenté.</p>
<div class="lab">Pourquoi</div><p>Une cardiomyopathie génétique (desmoplakine, filamine C, titine) peut se présenter comme une myocardite. L’ESC 2025 recommande un arbre généalogique dans les formes récidivantes (classe I, niveau C) ; une histoire familiale de cardiomyopathie ou de mort subite fait partie des indications d’analyse génétique (classe IIa, niveau B).</p></template>

<template data-pop="i40-s-douleur" data-title="Douleur thoracique de la myocardite">
<div class="lab">Deux types</div><p><b>Pseudo-infarctoïde</b> : constrictive, rétrosternale, continue, parfois irradiée ; mécanisme : ischémie microvasculaire, inflammation myocardique. <b>Péricarditique</b> : aiguë, pleurale, augmentée par l’inspiration et le décubitus, soulagée par l’antéflexion ; mécanisme : atteinte péricardique associée.</p>
<div class="lab">Caractériser</div><p>Début, durée, position, respiration, effort, irradiation, symptômes associés (fièvre, dyspnée, palpitations).</p>
<div class="lab">Piège</div><p>Chez un jeune, une douleur constrictive avec sus-décalage du ST reste un syndrome coronarien jusqu’à preuve du contraire : dissection coronaire spontanée, embolie coronaire, cocaïne.</p></template>

<template data-pop="i40-s-prodrome" data-title="Prodromes infectieux">
<p>Fièvre, frissons, myalgies, céphalées, rhinopharyngite, diarrhée ou vomissements dans les une à trois semaines précédentes.</p>
<div class="lab">Physiopathologie</div><p>Phase de réplication virale systémique, avant l’atteinte cardiaque immunitaire.</p>
<div class="lab">Valeur</div><p>Argument de chronologie ; peu spécifique. Une fièvre qui persiste pendant l’épisode cardiaque oriente vers une infection active, une maladie systémique ou une atteinte péricardique.</p></template>

<template data-pop="i40-s-dyspnee" data-title="Dyspnée et fatigue dans la myocardite">
<div class="lab">Mécanisme</div><p>Dysfonction systolique et diastolique (œdème, rigidité), congestion pulmonaire ; parfois épanchement péricardique.</p>
<div class="lab">Caractériser</div><p>Seuil d’effort, orthopnée, dyspnée paroxystique nocturne, prise de poids, œdèmes ; rapidité d’aggravation.</p>
<div class="lab">Signal d’alarme</div><p>Aggravation d’un jour à l’autre, intolérance au décubitus, fatigue extrême ou confusion : bas débit débutant, forme fulminante possible.</p></template>

<template data-pop="i40-s-palp" data-title="Palpitations, lipothymie, syncope">
<div class="lab">Mécanismes</div><p>Extrasystoles et tachycardie ventriculaires (inflammation, cicatrice) ; bloc auriculoventriculaire (tissu de conduction) ; plus rarement arythmie auriculaire.</p>
<div class="lab">Valeur</div><p>Une syncope, surtout à l’effort ou sans prodrome, est un marqueur de haut risque : monitorage immédiat.</p>
<div class="lab">Orientation</div><p>Syncope par bloc : Lyme, sarcoïdose, cellules géantes, immunothérapie. Syncope par tachycardie ventriculaire : cellules géantes, sarcoïdose, Chagas, cardiomyopathie arythmogène.</p></template>

<template data-pop="i40-s-muscle" data-title="Myalgies, faiblesse, ptosis, diplopie">
<div class="lab">Contexte</div><p>Sous immunothérapie, une myosite et un syndrome de type myasthénique accompagnent souvent la myocardite.</p>
<div class="lab">Signes</div><p>Faiblesse proximale et des muscles du cou, ptosis, diplopie, dysphagie, dysphonie, dyspnée par faiblesse diaphragmatique.</p>
<div class="lab">Pourquoi c’est grave</div><p>La défaillance respiratoire s’ajoute au risque rythmique. Mesurer la capacité vitale ou la force inspiratoire ; créatine kinase ; avis neurologique.</p>
<div class="lab">Pourquoi dépister l’atteinte respiratoire</div><p>La myosite peut atteindre le diaphragme et les muscles respiratoires, et la défaillance respiratoire réduit la survie des patients atteints de myocardite sous immunothérapie. Dans un registre prospectif, la mortalité liée à la toxicité musculaire est passée de 60 % chez les 10 premiers patients à 3,4 % chez les 30 suivants, après l’introduction d’un dépistage systématique de l’atteinte respiratoire avec ventilation précoce et d’un traitement par abatacept et ruxolitinib. Cette étude non randomisée génère une hypothèse ; elle ne prouve pas l’effet propre de chaque mesure.</p>
<div class="lab">Source complémentaire</div><p>Salem et al., Cancer Discovery 2023 ; 2025 ESC Guidelines for the management of myocarditis and pericarditis, section 9.6.1.1.</p>
</template>

<template data-pop="i40-e-tachy" data-title="Tachycardie disproportionnée à la fièvre">
<div class="lab">Principe</div><p>La fièvre accélère la fréquence d’environ 8 à 10 battements par minute par degré au-dessus de 37 °C : 8,5 en moyenne chez de jeunes hommes atteints d’une infection aiguë simple, dont la fréquence restait élevée même pendant le sommeil. La chaleur accélère la dépolarisation spontanée du nœud sinusal, et la fièvre active le système sympathique. Une tachycardie supérieure à cette attente, ou qui persiste après la défervescence, n’est pas expliquée par la fièvre.</p>
<div class="lab">Signification</div><p>Compensation d’un volume d’éjection réduit par la dysfonction myocardique ; parfois arythmie. Dans la phase initiale d’une forme fulminante, c’est souvent le premier signe.</p>
<div class="lab">Conduite</div><p>ECG, troponine répétée, échocardiographie.</p></template>

<template data-pop="i40-e-extra" data-title="Signes extracardiaques orientant la cause">
<div class="lab">Peau et muqueuses</div><p>Érythème migrant (Lyme) ; éruption maculopapuleuse, œdème du visage (hypersensibilité, syndrome DRESS) ; purpura vasculaire (vascularite) ; lésions de lupus ; nodules et érythème noueux (sarcoïdose) ; chagome ou signe de Romaña (Chagas aigu).</p>
<div class="lab">Ganglions et organes</div><p>Adénopathies (sarcoïdose, virus d’Epstein-Barr) ; hépatosplénomégalie.</p>
<div class="lab">Muscles et nerfs</div><p>Faiblesse proximale, ptosis (immunothérapie, polymyosite) ; neuropathie (EGPA) ; paralysie faciale (Lyme).</p>
<div class="lab">Respiratoire</div><p>Sibilants (asthme de l’EGPA), crépitants de fibrose (sarcoïdose, sclérodermie).</p></template>
