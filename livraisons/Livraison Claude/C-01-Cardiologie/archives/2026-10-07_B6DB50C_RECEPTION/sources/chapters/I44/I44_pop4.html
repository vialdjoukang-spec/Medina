
<!-- ===== FENÊTRES I44 : stimulation et suivi ===== -->
<template data-pop="i44-transcut" data-title="Stimulation transcutanée">
<div class="lab">Indication</div><p>Bradycardie instable réfractaire aux médicaments, en attendant la stimulation endocavitaire (ESC 2021, classe IIa si celle-ci n’est pas possible ou pas disponible) ; électrodes posées préventivement chez un patient à risque d’asystolie.</p>
<div class="lab">Technique</div><p>Électrodes adhésives en position antéropostérieure (précordiale gauche et interscapulaire gauche) ou antérolatérale. Mode à la demande, fréquence de 60 à 70/min. Augmenter l’intensité jusqu’à la capture électrique, habituellement entre 50 et 100 milliampères, puis ajouter une marge.</p>
<div class="lab">Vérifier la capture</div><p>Électrique : chaque artéfact est suivi d’un QRS large et d’une onde T. Mécanique : pouls fémoral palpé à la fréquence de stimulation ; le pouls carotidien est trompeur, car les contractions musculaires le simulent.</p>
<div class="lab">Confort</div><p>Contractions musculaires douloureuses : analgésie par opioïde et sédation légère dès que possible.</p>
<div class="lab">Limites</div><p>Capture incertaine chez l’obèse, l’emphysémateux, en hyperkaliémie ; solution de quelques heures au plus, car la capture est moins stable que par voie endocavitaire et la douleur impose une sédation continue (ESC 2021).</p></template>

<template data-pop="i44-transvein" data-title="Stimulation temporaire endocavitaire">
<div class="lab">Indications (ESC 2021)</div><p>Bradyarythmie avec retentissement hémodynamique réfractaire aux chronotropes intraveineux (classe I). À envisager si l’indication est immédiate et probablement réversible (ischémie, myocardite, trouble électrolytique, intoxication, chirurgie cardiaque), ou comme pont vers un stimulateur définitif qui ne peut pas être implanté immédiatement, par exemple en cas d’infection concomitante (classe IIa).</p>
<div class="lab">Technique</div><p>Voie jugulaire interne droite ou fémorale ; sonde positionnée à la pointe ou au septum du ventricule droit sous fluoroscopie ou échographie ; seuil de capture idéalement &lt; 1 volt ; sortie réglée à au moins trois fois le seuil, car une sonde temporaire sans fixation active se déplace facilement et son seuil varie ; la voie fémorale est la moins stable, d’où l’alitement et une durée aussi brève que possible (ESC 2021).</p>
<div class="lab">Surveillance</div><p>Contrôle quotidien du seuil et de la détection, radiographie, point de ponction ; le patient reste alité en cas de voie fémorale.</p>
<div class="lab">Complications</div><p>Déplacement et perte de capture, perforation et tamponnade, infection, thrombose, arythmies ventriculaires, pneumothorax. La stimulation temporaire endocavitaire est évitée si possible et retirée au plus tôt, car elle s’associe aussi à un risque accru d’infection du stimulateur définitif. Pour une durée prolongée, une sonde définitive à fixation active reliée à un boîtier externe est plus stable et mieux tolérée (ESC 2021, classe IIa).</p></template>

<template data-pop="i44-nbg" data-title="Code NBG des modes de stimulation">
<div class="lab">Positions</div><p><b>1re position — cavité stimulée</b> : O (aucune), A (oreillette), V (ventricule), D (les deux). <b>2e — cavité détectée</b> : O, A, V, D. <b>3e — réponse à la détection</b> : O (aucune), I (inhibition), T (déclenchement), D (inhibition et déclenchement). <b>4e — asservissement</b> : O ou R (fréquence asservie par un capteur d’activité). <b>5e — stimulation multisite</b> : O, A, V, D.</p>
<div class="lab">Exemples</div><p><b>AAI</b> : stimule et détecte l’oreillette, s’inhibe sur une onde P spontanée. <b>VVI</b> : idem pour le ventricule. <b>DDD</b> : double chambre ; une P détectée déclenche une stimulation ventriculaire après le délai auriculoventriculaire, une activité spontanée inhibe. <b>VDD</b> : stimule le ventricule, détecte les deux cavités (sonde unique à dipôle auriculaire flottant). <b>DOO</b>, <b>VOO</b> : modes asynchrones, sans détection (aimant, IRM, bistouri électrique).</p>
<div class="lab">Aide pédagogique</div><p>Lire les lettres dans l’ordre « je stimule, je détecte, je réagis, je m’adapte ». Aide pédagogique, non critère officiel.</p></template>

<template data-pop="i44-modes" data-title="Choix et réglage du mode de stimulation">
<div class="lab">Choix</div><p>Le tableau de l’îlot 12.2 donne le mode par situation. Deux compléments : l’AAIR seul expose à l’apparition ultérieure d’un BAV, chez 0,6 à 1,9 % des patients par an, d’où deux fois plus de réinterventions dans l’essai DANPACE ; chez un patient en BAV peu actif ou très âgé, un VVIR reste acceptable après décision partagée, car le mode double chambre n’améliore pas la survie : son bénéfice porte sur les symptômes et la qualité de vie, au prix d’une seconde sonde et de ses complications (ESC 2021).</p>
<div class="lab">Fibrillation paroxystique</div><p>Mode DDD avec commutation automatique de mode : pendant la fibrillation, le stimulateur cesse de suivre l’oreillette pour ne pas stimuler le ventricule à fréquence rapide.</p>
<div class="lab">Réglages clés</div><p>Fréquence de base (souvent 50 à 60/min) ; délai auriculoventriculaire allongé ou algorithme favorisant la conduction spontanée, pour éviter une stimulation ventriculaire droite inutile, qui favorise la fibrillation auriculaire et l’insuffisance cardiaque (ESC 2021, classe I dans la dysfonction sinusale) ; un délai excessif est évité, car il provoque une régurgitation mitrale diastolique ; asservissement en cas d’incompétence chronotrope ; fréquence maximale de suivi adaptée à l’âge et à l’activité.</p>
<div class="lab">Syncope réflexe</div><p>Double chambre avec algorithme de réponse à la chute de fréquence ou algorithme à boucle fermée.</p></template>

<template data-pop="i44-csp" data-title="Stimulation du système de conduction">
<div class="lab">Stimulation hisienne</div><p>Électrode fixée sur le faisceau de His : activation ventriculaire physiologique, QRS fin. Limites : seuils élevés et instables, détection faible de l’onde R, consommation de la pile ; une sonde ventriculaire de sécurité est souvent associée chez le patient dépendant.</p>
<div class="lab">Stimulation de la zone de la branche gauche</div><p>Électrode vissée profondément dans le septum, depuis le ventricule droit, jusqu’à la branche gauche. Signes de capture : aspect de retard droit en V1 (qR ou rSR′), temps court entre l’artéfact et l’activation du ventricule gauche en V5–V6. Seuils bas et stables, taux de succès élevé : technique préférée par le consensus ESC de 2025.</p>
<div class="lab">Place (consensus clinique ESC 2025)</div><p>BAV à fraction d’éjection conservée : option appropriée, aux côtés de la stimulation ventriculaire droite. Fraction d’éjection de 41 à 50 % avec stimulation attendue ≥ 20 % : appropriée, comme la resynchronisation biventriculaire. Fraction d’éjection ≤ 40 % (seuil du consensus ; l’ESC 2026 sur l’insuffisance cardiaque appelle « réduite » toute fraction &lt; 50 %) : alternative à la resynchronisation biventriculaire, notamment en cas d’échec de la sonde du sinus coronaire. Après ablation du nœud auriculoventriculaire : appropriée selon la fraction d’éjection.</p>
<div class="lab">Complications propres</div><p>Perforation septale vers le ventricule gauche, lésion d’une artère septale, perte de capture de la branche avec retour à une stimulation septale simple.</p>
<div class="lab">Niveau de preuve</div><p>Surtout observationnel et petits essais randomisés ; de grands essais sur des critères cliniques sont en cours. Le consensus de 2025 n’a pas la valeur d’une recommandation ESC ; celle de 2021 classait la stimulation hisienne en IIb pour le BAV avec fraction d’éjection &gt; 40 % et stimulation attendue &gt; 20 %.</p></template>

<template data-pop="i44-leadless" data-title="Stimulateur sans sonde">
<div class="lab">Principe</div><p>Capsule de quelques centimètres contenant pile et électronique, fixée à l’endocarde du ventricule droit par voie fémorale.</p>
<div class="lab">Avantages</div><p>Ni loge, ni sonde : pas d’hématome de loge, pas d’infection de loge, pas de fracture de sonde, pas d’occlusion veineuse.</p>
<div class="lab">Indications (ESC 2021)</div><p>Absence d’accès veineux au membre supérieur, risque élevé d’infection de loge (antécédent d’infection, hémodialyse) : à envisager (IIa). Alternative à un stimulateur ventriculaire simple chambre, après décision partagée tenant compte de l’espérance de vie (IIb).</p>
<div class="lab">Limites</div><p>Stimulation ventriculaire seule dans les premiers modèles ; les modèles plus récents assurent une synchronie auriculoventriculaire (détection mécanique de la contraction auriculaire, ou deux capsules communicantes). Perforation et tamponnade rares mais graves, plus difficiles à traiter qu’avec un stimulateur classique, d’où l’exigence d’une chirurgie cardiaque sur place ; complications du point de ponction fémoral ; retrait difficile à distance de l’implantation. Faute de données à long terme sur le retrait et la fin de vie de la pile, l’espérance de vie pèse dans la décision, surtout si elle dépasse 20 ans (ESC 2021).</p></template>

<template data-pop="i44-compl" data-title="Complications de l’implantation">
<div class="lab">Hématome de loge</div><p>Favorisé par les anticoagulants, la double antiagrégation et le relais par héparine ; compression, pas de ponction, car l’évacuation s’associe à un risque d’infection environ 15 fois plus élevé ; reprise chirurgicale seulement si l’hématome est très douloureux, saigne encore, tend la cicatrice ou menace la peau (ESC 2021).</p>
<div class="lab">Pneumothorax</div><p>Lors d’une ponction sous-clavière ; radiographie de contrôle ; réduit par l’abord céphalique ou axillaire.</p>
<div class="lab">Déplacement de sonde</div><p>Surtout dans les premières semaines et pour la sonde auriculaire ; perte de capture ou de détection ; repositionnement.</p>
<div class="lab">Perforation, tamponnade</div><p>Douleur thoracique, hypotension, frottement péricardique, stimulation diaphragmatique ou pectorale ; échocardiographie urgente.</p>
<div class="lab">Infection</div><p>De l’ordre de 1 % après une première implantation, plus fréquente après un remplacement ou une révision, car chaque réouverture de la loge expose le matériel à une contamination ; l’absence d’antibioprophylaxie s’associe à un risque environ 2,5 fois plus élevé (ESC 2021). Toute infection de loge ou endocardite sur sonde impose l’extraction complète du système, avec antibiothérapie, puis réimplantation différée à distance, car les bactéries forment sur le matériel un biofilm que les antibiotiques ne stérilisent pas ; un retrait partiel expose à la rechute.</p>
<div class="lab">Tardives</div><p>Fracture de sonde, insuffisance tricuspide, occlusion veineuse, érosion cutanée, manipulation du boîtier par le patient.</p></template>

<template data-pop="i44-dysf" data-title="Dysfonctionnements électriques">
<div class="lab">Perte de capture</div><p>Artéfact sans complexe consécutif. Causes : déplacement, élévation du seuil (fibrose, hyperkaliémie, antiarythmique de classe I), fracture, sortie programmée trop basse, pile usée.</p>
<div class="lab">Défaut de détection</div><p>Le stimulateur ne voit pas l’activité spontanée et stimule au mauvais moment, par exemple sur une onde T. Causes : signal trop petit, déplacement, extrasystole de morphologie différente.</p>
<div class="lab">Surdétection</div><p>Le stimulateur prend un signal parasite pour une activité cardiaque et s’inhibe : pauses sans artéfact. Causes : myopotentiels, surtout avec une sonde unipolaire, dont le circuit de détection entre l’électrode et le boîtier englobe le muscle pectoral ; interférences électromagnétiques, elles aussi plus souvent détectées en unipolaire ; onde T ; fracture de sonde.</p>
<div class="lab">Tachycardie par réentrée électronique</div><p>En mode DDD, une onde P rétrograde, issue d’une stimulation ventriculaire, est détectée et déclenche une nouvelle stimulation ventriculaire, et ainsi de suite, à la fréquence maximale de suivi. Un aimant l’interrompt ; un réglage de la période réfractaire auriculaire la prévient.</p>
<div class="lab">Aimant</div><p>Posé sur un stimulateur, il déclenche habituellement une stimulation asynchrone à une fréquence qui renseigne sur l’état de la pile ; son effet cesse au retrait.</p></template>

<template data-pop="i44-suivi-pm" data-title="Contrôle du stimulateur">
<div class="lab">Calendrier habituel</div><p>Contrôle avant la sortie (cicatrice, radiographie, seuils) ; contrôle après quelques semaines à trois mois, lorsque les seuils sont stabilisés, pour abaisser les sorties et économiser la pile ; puis tous les 6 à 12 mois en consultation, ou par télésurveillance avec une consultation espacée.</p>
<div class="lab">Télésurveillance</div><p>Transmission automatique des alertes : anomalies de sonde, fibrillation auriculaire, usure de la pile. Elle réduit les consultations et détecte plus tôt les anomalies : si le stimulateur mesure lui-même ses seuils de façon fiable, les contrôles en consultation peuvent être espacés jusqu’à 24 mois (ESC 2021, classe IIa). Elle est recommandée lorsqu’un composant fait l’objet d’une alerte de sécurité, surtout chez le patient dépendant (classe I).</p>
<div class="lab">Consignes au patient</div><p>Soins de la plaie ; limiter les mouvements amples du bras homolatéral pendant les premières semaines ; carte de porteur ; consulter en cas de fièvre, de gonflement de la loge, de malaise ou de hoquet persistant (stimulation diaphragmatique).</p>
<div class="lab">Fin de vie de la pile</div><p>Indicateur de remplacement électif, puis changement de boîtier programmé, en conservant les sondes si elles fonctionnent.</p></template>

<template data-pop="i44-interf" data-title="Interférences électromagnétiques">
<div class="lab">Vie courante</div><p>Téléphone portable : ne pas le porter contre le boîtier (distance d’environ 15 cm conseillée par les fabricants). Plaque à induction : ne pas se pencher au-dessus. Portiques de sécurité : les traverser normalement, sans s’y arrêter ; le détecteur manuel ne doit pas rester au-dessus du boîtier.</p>
<div class="lab">Soins</div><p>Bistouri électrique : préférer le mode bipolaire, dont le courant reste confiné entre les deux branches de la pince ; en mode monopolaire, électrode neutre loin du boîtier et impulsions de moins de 5 secondes (ESC 2021) ; programmation asynchrone ou aimant chez le patient dépendant. Radiothérapie : dose au boîtier à calculer. Lithotripsie, neurostimulation transcutanée, ablation par radiofréquence : avis du rythmologue.</p>
<div class="lab">Défibrillation externe</div><p>Électrodes placées à distance du boîtier (au moins 8 cm) ; contrôle du stimulateur ensuite.</p>
<div class="lab">Travail</div><p>Soudure à l’arc, champs industriels intenses : évaluation au poste de travail.</p></template>

<template data-pop="i44-conduite" data-title="Aptitude à la conduite (SSC/SSML 2024)">
<div class="lab">Référence</div><p>Société suisse de cardiologie et Société suisse de médecine légale, « Aptitude à la conduite et maladies cardiovasculaires », 2e édition, octobre 2024. Les règles principales figurent dans le tableau de l’îlot 13.</p>
<div class="lab">Groupes</div><p>Groupe 1 : catégories A et B avec leurs sous-catégories, ainsi que F, G et M. Groupe 2 : catégories C et D avec leurs sous-catégories, transport professionnel de personnes, experts de la circulation.</p>
<div class="lab">Principe</div><p>Le délai après une implantation couvre le risque de déplacement de sonde et la cicatrisation ; le délai après une syncope couvre le risque de récidive au volant, plus lourd de conséquences pour le groupe 2.</p>
<div class="lab">Devoir du médecin</div><p>Informer le patient et le documenter. La loi fédérale sur la circulation routière (article 15d) délie le médecin du secret professionnel pour signaler à l’autorité cantonale une personne inapte à la conduite.</p></template>
<template data-pop="i44-fa-infra" data-title="Fibrillation auriculaire détectée par le stimulateur">
<div class="lab">Définition</div><p>La sonde auriculaire enregistre en continu ; l’appareil mémorise des épisodes de fréquence auriculaire rapide, de quelques minutes à quelques heures, que le patient ne ressent pas. L’ESC 2024 parle de fibrillation infraclinique détectée par l’appareil. Un professionnel relit les électrogrammes mémorisés, car un artéfact ou une surdétection peuvent simuler l’arythmie.</p>
<div class="lab">Risque</div><p>Ces épisodes s’associent à un risque d’accident vasculaire cérébral multiplié par environ 2,5, mais ils sont courts et le risque absolu reste faible : environ 1 % par an dans les deux groupes d’un essai randomisé. L’association n’établit pas que chaque épisode cause l’accident ; elle signale un terrain à risque.</p>
<div class="lab">Ce que montrent les essais</div><p>L’apixaban a réduit les accidents vasculaires cérébraux et les embolies systémiques par rapport à l’aspirine (0,78 % contre 1,24 % par an), au prix de plus d’hémorragies majeures. L’edoxaban n’a pas réduit significativement le critère associant décès cardiovasculaire, accident vasculaire cérébral et embolie, et a augmenté le critère associant décès et hémorragie majeure.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2024 indique qu’un anticoagulant oral direct peut être envisagé si le risque thromboembolique est élevé, en excluant les patients à haut risque hémorragique (classe IIb). La décision est partagée et réévaluée. Dans l’essai de l’apixaban, un épisode de plus de 24 heures ou une fibrillation clinique faisait passer à l’anticoagulation habituelle de la fibrillation auriculaire.</p>
<div class="lab">Source</div><p>Van Gelder et al., 2024 ESC Guidelines for the management of atrial fibrillation, Eur Heart J 2024;45:3314–3414 (section 6.2.3) ; Healey et al., Apixaban for stroke prevention in subclinical atrial fibrillation, N Engl J Med 2024;390:107–117 ; Kirchhof et al., Anticoagulation with edoxaban in patients with atrial high-rate episodes, N Engl J Med 2023;389:1167–1179.</p>
</template>
