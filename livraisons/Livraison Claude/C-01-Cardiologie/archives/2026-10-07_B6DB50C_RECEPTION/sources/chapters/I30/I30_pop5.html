<template data-pop="i30-d-asa" data-title="Aspirine à dose anti-inflammatoire">
<div class="lab">Mécanisme</div><p>Acétylation irréversible des cyclo-oxygénases 1 et 2. À forte dose, inhibition de la synthèse des prostaglandines de l’inflammation et de la fièvre ; à faible dose, effet antiplaquettaire seul, car la plaquette, sans noyau, ne resynthétise pas la cyclo-oxygénase acétylée, alors que les cellules inflammatoires la renouvellent et exigent des doses fortes et répétées.</p>
<div class="lab">Place</div><p>Première ligne avec la colchicine ; choix préférentiel après un infarctus, chez le patient sous antiagrégant et au début de la grossesse.</p>
<div class="lab">Posologie</div><p>750–1 000 mg toutes les 8 heures pendant 1 à 2 semaines, puis baisse de 250 mg toutes les 1 à 2 semaines (ESC 2025, tableau 13 ; l’ESC 2015 admettait 250 à 500 mg). L’aspirine est le premier choix chez le patient déjà sous aspirine antiplaquettaire.</p>
<div class="lab">Effets indésirables</div><p>Ulcère et hémorragie digestive (protection par inhibiteur de la pompe à protons), acouphènes et surdité réversibles à forte dose, bronchospasme chez l’asthmatique sensible, car le blocage de la cyclo-oxygénase détourne l’acide arachidonique vers les leucotriènes bronchoconstricteurs, insuffisance rénale.</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, hémorragie active, allergie à l’aspirine, enfant (syndrome de Reye), grossesse au-delà de 20 semaines à dose anti-inflammatoire.</p>
<div class="lab">Surveillance</div><p>Tolérance digestive, créatinine, audition à forte dose.</p></template>

<template data-pop="i30-d-ains" data-title="AINS : ibuprofène et indométacine">
<div class="lab">Mécanisme</div><p>Inhibition réversible des cyclo-oxygénases : baisse des prostaglandines de l’inflammation, de la douleur et de la fièvre.</p>
<div class="lab">Preuves</div><p>Traitement historique de la péricardite, efficace sur la douleur ; l’ESC 2025 recommande l’aspirine ou un AINS à forte dose, avec protection gastrique, en première ligne (classe I, niveau B) ; les essais de colchicine (COPE, ICAP) ont été conduits avec l’aspirine ou l’ibuprofène comme traitement de base.</p>
<div class="lab">Posologie</div><p>Ibuprofène 600 à 800 mg toutes les 8 heures (ESC 2025) ; indométacine 25–50 mg toutes les 8 heures, en débutant à la dose basse. Durée et décroissance guidées par les symptômes et la protéine C réactive.</p>
<div class="lab">Effets indésirables</div><p>Digestifs (ulcère, hémorragie) ; rénaux (insuffisance rénale aiguë, hyperkaliémie) ; rétention hydrosodée et hausse tensionnelle ; céphalées et vertiges (indométacine).</p>
<div class="lab">Contre-indications</div><p>Ulcère évolutif, insuffisance rénale sévère, insuffisance cardiaque décompensée, grossesse au-delà de 20 semaines, période post-infarctus (préférer l’aspirine).</p>
<div class="lab">Surveillance</div><p>Créatinine et kaliémie chez le sujet âgé ou sous IEC, ARA II ou diurétique ; pression artérielle ; protection gastrique systématique.</p>
<div class="lab">Mécanisme des effets indésirables</div><p>Dans l’estomac, la cyclo-oxygénase 1 produit des prostaglandines qui entretiennent le mucus, le bicarbonate et le débit sanguin de la muqueuse ; leur suppression explique l’ulcère, d’où la protection gastrique systématique. Dans le rein, les prostaglandines dilatent l’artériole afférente quand la perfusion baisse : sujet âgé, insuffisance cardiaque, diurétique, IEC ou ARA II. L’AINS fait alors chuter la filtration. Il réduit aussi la sécrétion de rénine, donc d’aldostérone, d’où l’hyperkaliémie, et il retient le sodium, d’où la hausse tensionnelle et la décompensation cardiaque. Chez les patients traités à la fois par diurétique et IEC ou ARA II, l’ajout d’un AINS augmente le risque d’insuffisance rénale aiguë (rapport de taux 1,31), surtout le premier mois (1,82).</p>
<div class="lab">Source complémentaire</div><p>Lapi et al., British Medical Journal 2013;346:e8525 ; Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, tableau 13 (note b).</p>
</template>

<template data-pop="i30-d-colch" data-title="Colchicine dans la péricardite">
<div class="lab">Mécanisme</div><p>Liaison à la tubuline et blocage de la polymérisation des microtubules : réduction de la migration et de l’activation des polynucléaires, inhibition de l’assemblage de l’inflammasome NLRP3.</p>
<div class="lab">Preuves</div><p>Premier épisode : COPE (2005) et ICAP (2013, <i>New England Journal of Medicine</i>) ; dans ICAP, la péricardite incessante ou récidivante est passée de 37,5 % à 16,7 %. Récidive : CORE (2005), CORP (2011) et CORP-2 (2014) ; dans CORP-2, récidives multiples, de 42,5 % à 21,6 %. Prévention du syndrome post-péricardiotomie : COPPS (2010).</p>
<div class="lab">Posologie</div><p>0,5 mg/jour si &lt; 70 kg ; 0,5 mg × 2/jour si ≥ 70 kg. Durée : au moins 3 mois pour un premier épisode (3 à 6 mois selon l’ESC 2025), au moins 6 mois pour une récidive ; la décroissance n’est habituellement pas nécessaire, car la prise a déjà duré plusieurs mois. Demi-dose chez le sujet âgé. Dernier médicament arrêté.</p>
<div class="lab">Effets indésirables</div><p>Diarrhée et nausées (les plus fréquents, souvent passagers) ; plus rarement myopathie, neuropathie, cytopénies, hépatotoxicité, en particulier en cas d’interaction ou d’insuffisance rénale.</p>
<div class="lab">Contre-indications</div><p>DFG &lt; 30 mL/min et insuffisance hépatique sévère (information professionnelle suisse de Colctab) ; association aux inhibiteurs de la glycoprotéine P ou aux inhibiteurs puissants du CYP3A4, et à la ciclosporine ; troubles hématologiques, mauvais état général ; grossesse et allaitement, alors que l’ESC 2025 juge la colchicine compatible avec les deux ; hypersensibilité. Dose réduite ou intervalle allongé en cas d’insuffisance rénale légère à modérée.</p>
<div class="lab">Statut en Suisse</div><p>Colctab, comprimés de 0,5 mg et comprimés sécables de 1 mg ; indication officielle dans la péricardite aiguë et récidivante de l’adulte (0,5 mg × 2/jour au-delà de 70 kg, 0,5 mg/jour jusqu’à 70 kg) ; liste des spécialités, quote-part de 10 %.</p>
<div class="lab">Surveillance</div><p>Hémogramme, créatinine, transaminases, créatine kinase en cas de myalgies ; revue des interactions à chaque nouvelle prescription.</p>
<div class="lab">Pourquoi les interactions sont dangereuses</div><p>La colchicine a une marge thérapeutique étroite : les plus faibles doses mortelles rapportées sont de 7 à 26 mg. Elle est métabolisée par le CYP3A4 et expulsée des cellules intestinales, hépatiques et rénales par la glycoprotéine P. Un inhibiteur de ces voies, comme la clarithromycine ou la ciclosporine, élève donc sa concentration. Sa toxicité prolonge son mécanisme : le blocage des microtubules atteint toutes les cellules qui se divisent ou sécrètent, d’où la diarrhée, les cytopénies, la myopathie et, à l’extrême, une défaillance multiviscérale. L’insuffisance rénale ou hépatique aggrave ce risque.</p>
<div class="lab">Insuffisance rénale sévère</div><p>L’ESC 2025 y garde 0,5 mg une fois par jour, alors que l’information professionnelle suisse contre-indique la colchicine sous 30 mL/min : la colchicine, éliminée en partie par le rein, s’accumule et expose alors davantage à la toxicité musculaire et médullaire.</p>
<div class="lab">Source complémentaire</div><p>Finkelstein et al., Clin Toxicol 2010;48:407-14 ; Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, tableau 13.</p>
</template>

<template data-pop="i30-d-cortico" data-title="Corticoïdes dans la péricardite">
<div class="lab">Mécanisme</div><p>Liaison au récepteur des glucocorticoïdes : répression de la transcription des cytokines inflammatoires, dont l’interleukine 1, et de nombreuses voies de l’inflammation.</p>
<div class="lab">Place</div><p>Deuxième ligne : échec ou contre-indication de l’aspirine et des AINS ; causes qui les exigent (maladie auto-immune, péricardite immunitaire médicamenteuse). Toujours associés à la colchicine. Évités en première intention sans indication spécifique (ESC 2025, classe III), après un infarctus et chez l’enfant, dont ils freinent la croissance.</p>
<div class="lab">Posologie</div><p>Prednisone 0,2–0,5 mg/kg/jour jusqu’à la rémission, puis décroissance lente par paliers, d’autant plus lente sous 15 mg/jour (fiche de décroissance dans l’onglet Pharmacologie).</p>
<div class="lab">Effets indésirables</div><p>Récidives et corticodépendance ; hyperglycémie, hypertension, ostéoporose, infections, troubles de l’humeur, cataracte, insuffisance surrénalienne à l’arrêt.</p>
<div class="lab">Précautions</div><p>Exclure la tuberculose et une infection bactérienne avant de débuter ; calcium, vitamine D et protection osseuse selon le risque.</p>
<div class="lab">Pourquoi éviter l’usage initial et les fortes doses</div><p>Dans l’essai COPE, un corticoïde lors du premier épisode était un facteur indépendant de récidive (rapport des cotes 4,3). Dans une série de 100 péricardites récidivantes, la prednisone à 1 mg/kg/jour, comparée à 0,2–0,5 mg/kg/jour, était associée à davantage d’effets indésirables graves, de récidives et d’hospitalisations (rapport de risque 3,61). Ces études ne sont pas randomisées pour cette comparaison : elles montrent une association. L’explication avancée est que le corticoïde éteint les symptômes sans arrêter la boucle de l’interleukine 1, qui reprend à la baisse des doses.</p>
<div class="lab">Source complémentaire</div><p>Imazio et al., Circulation 2005;112:2012-6 ; Imazio et al., Circulation 2008;118:667-71 ; Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, tableau de recommandations 10.</p>
</template>

<template data-pop="i30-d-antiil1" data-title="Anti-interleukine 1 : anakinra, rilonacept, goflikicept">
<div class="lab">Mécanisme</div><p><b>Anakinra</b> : forme recombinante de l’antagoniste naturel du récepteur de l’interleukine 1 ; bloque l’effet de l’interleukine 1α et 1β. Demi-vie courte, injection quotidienne. <b>Rilonacept</b> : protéine de fusion qui piège l’interleukine 1α et 1β ; injection hebdomadaire. <b>Goflikicept</b> : autre piège à interleukine 1, évalué en Russie.</p>
<div class="lab">Preuves</div><p><b>AIRTRIP</b> (2016, <i>JAMA</i>) : 21 patients corticodépendants et résistants à la colchicine ; après retrait randomisé, récidive chez 18 % sous anakinra contre 90 % sous placebo. <b>RHAPSODY</b> (2021, <i>New England Journal of Medicine</i>) : péricardite récidivante active à protéine C réactive élevée ; après retrait randomisé, risque de récidive fortement réduit sous rilonacept (rapport de risque 0,04).</p>
<div class="lab">Place (ESC 2025)</div><p>Classe I, niveau A, dans la récidive après échec de la première ligne et des corticoïdes, si la protéine C réactive est élevée ; classe IIa, niveau C, quelle que soit la protéine C réactive, si l’IRM montre une inflammation du péricarde après échec, contre-indication ou intolérance des traitements précédents (ESC 2025). L’ACC 2025 les place plus tôt, avant les corticoïdes.</p>
<div class="lab">Posologie</div><p>Anakinra 100 mg/jour par voie sous-cutanée (1–2 mg/kg/jour chez l’enfant). Rilonacept 320 mg en dose de charge puis 160 mg par semaine. Durée prolongée, souvent plus d’un an, avec décroissance progressive pour limiter les récidives à l’arrêt.</p>
<div class="lab">Effets indésirables</div><p>Réactions au point d’injection (très fréquentes avec l’anakinra) ; infections, dont réactivation tuberculeuse ; neutropénie ; hausse des transaminases.</p>
<div class="lab">Contre-indications et précautions</div><p>Infection active ; dépister la tuberculose latente avant de débuter ; éviter les vaccins vivants ; hémogramme et transaminases régulièrement.</p>
<div class="lab">Statut en Suisse</div><p>Anakinra autorisé dans d’autres indications (maladies rhumatismales et auto-inflammatoires) : usage hors indication dans la péricardite, avec demande préalable à l’assureur. Rilonacept : autorisation américaine (2021), pas d’autorisation européenne.</p>
<div class="lab">Pourquoi la protéine C réactive guide le choix</div><p>Les essais ont inclus des récidives inflammatoires : AIRTRIP exigeait une protéine C réactive élevée, RHAPSODY une douleur avec protéine C réactive élevée. Dans RHAPSODY, chez 86 patients, la douleur a disparu en 5 jours et la protéine C réactive s’est normalisée en 7 jours (médianes). Après retrait randomisé de 61 répondeurs, la récidive survenait en médiane après 8,6 semaines sous placebo. Le bénéfice est donc démontré dans ce phénotype, d’où la classe I ; sans protéine C réactive élevée, l’IRM peut documenter l’inflammation (classe IIa).</p>
<div class="lab">Ce qui change la décision</div><p>La colchicine est poursuivie, car elle bloque la même voie en amont et prolonge la survie sans récidive. L’anakinra, de demi-vie courte, est préférable quand le risque infectieux est élevé, car son effet cesse vite à l’arrêt. La décroissance de l’anakinra dure au moins 3 à 6 mois, par exemple une injection de moins par semaine chaque mois ; celle du rilonacept n’est pas établie. Le sevrage est difficile : chez l’enfant, 15 % seulement l’avaient obtenu après 2,6 ans en moyenne. Les données sur le risque de cancer sont rassurantes, mais l’usage en cas de cancer actif est mal étudié.</p>
<div class="lab">Source complémentaire</div><p>Klein et al., <i>New England Journal of Medicine</i> 2021;384:31-41 ; Brucato et al., JAMA 2016;316:1906-12 ; Recommandations de l’ESC 2025 sur les myocardites et les péricardites, <i>European Heart Journal</i> 2025;46:3952-4041, section 6.2.2.2, tableau 13 et section 12.2.2.</p>
</template>
