<section class="ilot" id="i30-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 34 ans consulte aux urgences pour une douleur thoracique apparue la nuit précédente. Elle est aiguë, rétrosternale, aggravée par l’inspiration profonde et le décubitus, soulagée lorsqu’il s’assied penché en avant. Il a eu un rhume dix jours plus tôt. Sa température est de 37,8 °C. L’électrocardiogramme montre un sus-décalage du segment ST dans presque toutes les dérivations. La question qui organise tout le chapitre est la suivante : <b>s’agit-il d’une péricardite, est-elle à faible ou à haut risque, existe-t-il un épanchement qui menace l’hémodynamique, et quel traitement préviendra la récidive ?</b></p>
<p>Le péricarde pose trois problèmes cliniques distincts, qui correspondent aux trois codes du chapitre. L’<b>inflammation</b> (péricardite, I30) produit la douleur et expose à la récidive. L’<b>accumulation de liquide</b> (épanchement, I31.3) peut comprimer le cœur jusqu’à la tamponnade (I31.4), qui est une urgence vitale. La <b>cicatrice</b> rigide (constriction, I31.1) empêche le remplissage et produit une insuffisance cardiaque droite chronique.</p>
<p>À la fin du chapitre, le médecin assistant sait poser le diagnostic de péricardite selon les critères de la Société européenne de cardiologie (ESC) 2025. Il sait lire l’ECG évolutif, repérer les critères de haut risque et prescrire le traitement de première ligne à la bonne dose et pour la bonne durée. Il sait aussi reconnaître une tamponnade au lit du malade et distinguer une constriction d’une cardiomyopathie restrictive.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="i30-pv">courbe pression-volume du péricarde (pourquoi la vitesse d’accumulation compte plus que le volume)</button>, l’<button class="w" data-k="i30-interdep">interdépendance ventriculaire (le septum partagé)</button> et la <button class="w" data-k="i30-inflamm">voie de l’inflammasome et de l’interleukine 1 (cible de la colchicine et des biothérapies)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i30-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <b>péricardite</b> est une inflammation du péricarde, avec ou sans épanchement. L’<b>épanchement péricardique</b> est une quantité de liquide supérieure à la quantité physiologique, qui est de 10 à 50 mL environ. Ce liquide normal est un ultrafiltrat du plasma qui lubrifie le glissement des feuillets. Il augmente quand l’inflammation accroît sa production (exsudat), ou quand une pression veineuse systémique élevée ou un drainage lymphatique réduit freinent sa réabsorption (transsudat). La <b>tamponnade</b> est une compression du cœur par le contenu péricardique, qui réduit le remplissage et le débit. La <b>constriction</b> est une perte de l’élasticité du péricarde, devenu épais, fibreux ou calcifié, qui limite le remplissage diastolique.</p>
<h3>1.1 Le cadre de l’ESC 2025</h3>
<p>L’ESC a publié le 29 août 2025 ses premières recommandations communes aux myocardites et aux péricardites. Elles introduisent le <button class="w" data-k="i30-imps">syndrome inflammatoire myopéricardique (IMPS, spectre de l’atteinte)</button>. Ce terme général reconnaît que l’inflammation touche souvent le péricarde et le myocarde à la fois. La péricardite pure et la myocardite pure sont les deux extrémités d’un même spectre. Entre elles se situe la <button class="w" data-k="i30-myoperi">myopéricardite (péricardite avec troponine élevée)</button>.</p>
<h3>1.2 Classification temporelle</h3>
<table class="t"><tr><th>Forme</th><th>Définition</th><th>Exemple clinique</th></tr>
<tr><td><b>Aiguë</b></td><td>Premier épisode, de quelques jours à quelques semaines</td><td>Douleur positionnelle après une infection des voies respiratoires</td></tr>
<tr><td><b>Incessante</b></td><td>Symptômes persistants sans rémission au-delà de 4 à 6 semaines</td><td>Douleur qui revient dès la décroissance de l’anti-inflammatoire</td></tr>
<tr><td><b>Récidivante</b></td><td>Nouvel épisode après un intervalle libre de symptômes d’au moins 4 à 6 semaines et l’arrêt complet du traitement anti-inflammatoire ; sans cet arrêt, l’inflammation n’a jamais été éteinte, et la reprise définit une forme incessante.</td><td>Nouvelle douleur typique, trois mois après une péricardite guérie</td></tr>
<tr><td><b>Chronique</b></td><td>Évolution de plus de 3 mois</td><td>Épanchement persistant, inflammation de bas grade</td></tr></table>
<p class="src">Seuils temporels de l’ESC 2015. L’ESC 2025 (tableau 3) fixe la phase aiguë à 4 semaines au plus, la forme subaiguë de 4 semaines à 3 mois et la forme chronique au-delà de 3 mois. La distinction a une portée pronostique : environ 10 % des patients gardent des symptômes sans rémission, et cette forme incessante peut évoluer vers la constriction en quelques mois, alors que la constriction est exceptionnelle après des récidives idiopathiques.</p>
<h3>1.3 Formes cliniques</h3>
<p>L’ESC 2025 décrit plusieurs formes selon le retentissement : sèche (sans épanchement), avec épanchement, avec tamponnade, effusivo-constrictive, constrictive transitoire, constrictive chronique et péricardite d’une polysérite. Cette lecture a une conséquence pratique : le même patient peut passer d’une forme à l’autre, et le suivi doit chercher chacune.</p>
<h3>1.4 Correspondance avec la CIM-10-GM</h3>
<div class="two">
<div class="card"><h4>I30 — Péricardite aiguë</h4><p>I30.0 idiopathique non spécifique ; I30.1 infectieuse ; I30.8 autres formes ; I30.9 sans précision.</p></div>
<div class="card"><h4>I31 — Autres maladies du péricarde</h4><p>I31.0 péricardite adhésive chronique ; I31.1 péricardite constrictive chronique ; I31.2 hémopéricarde ; I31.3 épanchement non inflammatoire ; I31.4 tamponnade cardiaque ; I31.8 et I31.9 autres formes et formes sans précision.</p></div>
<div class="card"><h4>I32 — Péricardite au cours de maladies classées ailleurs</h4><p>Code complémentaire : péricardite tuberculeuse, urémique, lupique ou néoplasique, codée avec la maladie causale.</p></div>
<div class="card"><h4>Codes voisins</h4><p>Syndrome post-infarctus de Dressler (I24.1) et syndrome post-péricardiotomie (I97.0) : ce sont des péricardites, traitées dans ce chapitre.</p></div></div>
</section>

<section class="ilot" id="i30-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>La péricardite est la maladie péricardique la plus fréquente. Une étude urbaine italienne a estimé son incidence à 27,7 cas pour 100 000 habitants par an (Imazio, 2008). Les formes hospitalisées sont bien plus rares : 3,3 pour 100 000 personnes-années dans le registre finlandais de Kytö (2014). La péricardite explique environ 5 % des douleurs thoraciques non ischémiques vues aux urgences. Elle touche surtout l’homme de 16 à 65 ans, dont le risque est environ double de celui de la femme (risque relatif 2,02). La femme récidive en revanche davantage (rapport de risque 1,67), probablement parce que les causes auto-immunes y sont plus fréquentes ; ce sont des associations, dont le mécanisme n’est pas établi.</p>
<p>L’étiologie dépend du pays. En Europe occidentale, les formes idiopathiques, présumées virales, dominent. Dans les pays de forte endémie tuberculeuse, notamment en Afrique subsaharienne avec co-infection par le VIH, la tuberculose est la première cause : elle explique environ 70 % des péricardites. Dans les pays à haut revenu, elle représente jusqu’à 4 % des maladies péricardiques, et cette part augmente avec la migration. Cette donnée concerne la Suisse : un patient migrant ou ayant séjourné en zone d’endémie doit être considéré comme exposé.</p>
<p>Le pronostic de la péricardite idiopathique est bon. Le problème principal est la <b>récidive</b>, qui touche 15 à 30 % des patients après un premier épisode non traité par colchicine. La constriction est une complication rare mais dont le risque dépend nettement de la cause. Un exsudat purulent ou tuberculeux, riche en fibrine, s’organise en tissu cicatriciel s’il persiste : le drainage chirurgical complet de la forme purulente et le traitement antituberculeux visent à l’empêcher.</p>

<tr><td>Idiopathique ou virale</td><td>&lt; 1 %</td></tr>
<tr><td>Immunologique ou néoplasique</td><td>2 à 5 %</td></tr>
<tr><td>Bactérienne, surtout purulente ou tuberculeuse</td><td>20 à 30 %</td></tr></table>
<p class="src">Imazio et coll., <i>Circulation</i> 2011 ; ordres de grandeur repris par l’ESC 2025.</p>

<section class="ilot" id="i30-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le péricarde normal est un sac à deux feuillets. Le feuillet fibreux, externe, est peu extensible. Le feuillet séreux tapisse sa face interne (feuillet pariétal) puis se réfléchit sur le cœur (feuillet viscéral, ou épicarde). Entre les deux, une fine lame de liquide permet le glissement. La physiopathologie suit trois chaînes, une par grand tableau clinique.</p>
<h3>3.1 Inflammation : de l’agression à la douleur</h3>
<p>Un virus, une lésion tissulaire (infarctus, chirurgie) ou une maladie systémique libère des signaux de danger dans le mésothélium. Ces signaux activent l’immunité innée par l’<button class="w" data-k="i30-inflamm">inflammasome NLRP3 et l’interleukine 1 (amplification de l’inflammation)</button>. Les polynucléaires affluent, les capillaires deviennent perméables et de la fibrine se dépose sur les feuillets. Le feuillet pariétal, innervé par les nerfs phréniques, devient douloureux. La douleur augmente quand les feuillets frottent ou s’étirent : inspiration profonde, décubitus. Le frottement entendu au stéthoscope est le bruit de ces surfaces fibrineuses.</p>
<div class="key"><b>Corrélation physiopathologie → thérapeutique.</b> Les récidives ne sont pas dues à une persistance virale dans la majorité des cas. Elles traduisent une boucle auto-inflammatoire entretenue par l’interleukine 1. C’est pourquoi la colchicine, qui freine l’inflammasome, réduit de moitié les récidives, et pourquoi les <button class="w" data-k="i30-d-antiil1">anti-interleukine 1 (anakinra, rilonacept)</button> sont efficaces dans les formes réfractaires à protéine C réactive élevée.</div>
<h3>3.2 Épanchement et tamponnade : le rôle de la vitesse</h3>
<p>L’inflammation augmente la production de liquide et réduit sa réabsorption lymphatique. Le liquide s’accumule. Sa tolérance dépend de la <button class="w" data-k="i30-pv">courbe pression-volume du péricarde (forme en J)</button>. Au début, la courbe est plate : le sac absorbe du volume sans élever sa pression. Puis la courbe se redresse brutalement : quelques millilitres supplémentaires font monter la pression intrapéricardique.</p>
<p>Deux situations en découlent. Un hémopéricarde de 200 à 300 mL, constitué en quelques minutes, peut tuer, parce que le feuillet fibreux n’a pas le temps de se distendre. Un épanchement néoplasique ou hypothyroïdien de plus d’un litre, constitué en plusieurs semaines, peut rester bien toléré, car le péricarde s’est distendu progressivement.</p>
<p>Quand la pression intrapéricardique dépasse la pression de remplissage des cavités droites, celles-ci se collabent en diastole. Elles cèdent les premières, parce que leur paroi est mince et leur pression de remplissage plus basse que celle des cavités gauches. Le remplissage chute, le volume d’éjection chute, et la tachycardie compense jusqu’au collapsus : le débit cardiaque est le produit du volume d’éjection par la fréquence, et la stimulation adrénergique accélère le cœur pour le maintenir. L’<button class="w" data-k="i30-interdep">interdépendance ventriculaire (septum partagé)</button> explique le <button class="w" data-k="i30-pp">pouls paradoxal (baisse inspiratoire de la pression systolique &gt; 10 mmHg)</button>. En inspiration, le ventricule droit se remplit davantage ; dans un sac rigide et plein, il repousse le septum vers la gauche ; le ventricule gauche se remplit moins et éjecte moins.</p>
<h3>3.3 Constriction : le péricarde rigide</h3>
<p>La constriction est l’aboutissement d’une inflammation qui a cicatrisé en fibrose, parfois calcifiée. Le remplissage protodiastolique est rapide, car les pressions auriculaires sont élevées. Il s’arrête ensuite brutalement quand les ventricules atteignent le volume imposé par le péricarde rigide. Ce profil donne le <button class="w" data-k="i30-cath">tracé en « racine carrée » (dip-plateau)</button> au cathétérisme et la <button class="w" data-k="i30-e-knock">vibrance péricardique (bruit protodiastolique)</button> à l’auscultation.</p>
<p>Le cœur est isolé des variations de pression intrathoracique. En inspiration, la pression chute dans les veines pulmonaires mais pas dans l’oreillette gauche, isolée par le péricarde rigide. Le gradient qui remplit le ventricule gauche diminue. C’est la <button class="w" data-k="i30-dissoc">dissociation des pressions intrathoraciques et intracardiaques (signe cardinal de la constriction)</button>. Elle distingue la constriction de la cardiomyopathie restrictive, où le péricarde est normal et où cette dissociation n’existe pas.</p>

<section class="ilot" id="i30-4"><h2><span class="n">4</span>Étiologies</h2>
<p>Deux règles orientent la recherche étiologique. En Europe, la majorité des péricardites aiguës sont idiopathiques ou virales : 50 % des cas hospitalisés et plus de 80 % des cas ambulatoires. Elles n’exigent pas de bilan exhaustif, car l’identification du virus ne change pas le traitement ; l’ESC 2025 déconseille les sérologies virales systématiques et ne garde que le VIH, l’hépatite C et la borréliose, qui ont un traitement propre. Une enquête ciblée est justifiée chez le patient à haut risque, devant un épanchement important, ou devant tout indice d’une cause spécifique.</p>
<div class="two">
<div class="card"><h4>Infectieuses</h4><p><b>Virales</b> (les plus fréquentes) : entérovirus (coxsackie, échovirus), adénovirus, virus d’Epstein-Barr, cytomégalovirus, parvovirus B19, herpèsvirus humain de type 6, SARS-CoV-2, VIH. <b>Bactériennes</b> : <button class="w" data-k="i30-tb">tuberculose (première cause mondiale)</button> ; <button class="w" data-k="i30-purul">péricardite purulente (staphylocoque, streptocoque, pneumocoque)</button>. Plus rares : <i>Coxiella burnetii</i>, <i>Borrelia</i>, champignons chez l’immunodéprimé.</p></div>
<div class="card"><h4>Non infectieuses : causes systémiques</h4><p>Lupus érythémateux disséminé, polyarthrite rhumatoïde, syndrome de Sjögren, sclérodermie, vascularites, sarcoïdose ; maladies auto-inflammatoires (fièvre méditerranéenne familiale, syndrome périodique lié au récepteur 1 du facteur de nécrose tumorale) ; maladie de Still ; maladie inflammatoire de l’intestin.</p></div>
<div class="card"><h4>Non infectieuses : néoplasiques et métaboliques</h4><p><button class="w" data-k="i30-neo">Atteinte néoplasique (métastases de poumon, sein, lymphome, mélanome)</button> ; mésothéliome primitif (rare). <button class="w" data-k="i30-uremie">Urémie et dialyse (péricardite urémique, péricardite de dialyse)</button>. Hypothyroïdie (épanchement souvent abondant, rarement compressif, car il s’accumule lentement et laisse au péricarde le temps de se distendre).</p></div>
<div class="card"><h4>Lésionnelles et iatrogènes</h4><p><button class="w" data-k="i30-pcis">Syndromes post-lésionnels (après infarctus, chirurgie cardiaque, traumatisme, geste percutané)</button> ; irradiation thoracique ; dissection aortique de type A (hémopéricarde) ; <button class="w" data-k="i30-drug">médicaments et vaccins (hydralazine, isoniazide, inhibiteurs de points de contrôle immunitaire, vaccins à ARN messager)</button>.</p></div></div>
<h3>4.1 Ce que change l’étiologie</h3>
<p>L’étiologie modifie la décision à trois niveaux. Elle modifie le traitement : antituberculeux, antibiotiques et drainage chirurgical, dialyse intensifiée, traitement de la maladie systémique. Elle modifie le risque évolutif : la tuberculose et les infections bactériennes exposent à la constriction. Elle modifie le choix de l’anti-inflammatoire : après un infarctus, l’aspirine est préférée aux autres AINS, et les corticoïdes sont évités. L’aspirine traite alors à la fois la péricardite et la maladie coronaire, alors que l’ibuprofène pris avant elle bloque son effet antiagrégant plaquettaire.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Étiqueter « virale » une péricardite avec épanchement abondant, fièvre élevée et installation sur plusieurs semaines, sans avoir cherché la tuberculose ni une néoplasie. L’installation subaiguë et l’épanchement de plus de 20 mm sont des <button class="w" data-k="i30-mnemo-faste">critères de haut risque</button> précisément parce qu’ils s’associent à des causes spécifiques.</div>

<section class="ilot" id="i30-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse poursuit trois buts : confirmer le caractère péricardique de la douleur, repérer un signe de gravité et trouver une cause spécifique. Elle commence par le terrain, se poursuit par les symptômes par ordre de fréquence, et se termine par l’histoire de l’épisode actuel.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i30-atcd-viral">Infection récente des voies respiratoires ou digestives (délai, symptômes)</button></li><li><button class="w" data-k="i30-atcd-tb">Tuberculose, exposition, séjour en zone d’endémie, VIH (questions, risque de constriction)</button></li><li><button class="w" data-k="i30-atcd-cancer">Cancer connu, radiothérapie thoracique (épanchement néoplasique, constriction radique)</button></li></ul>
<ul><li><button class="w" data-k="i30-atcd-chir">Infarctus, chirurgie cardiaque, ablation, stimulateur récents (syndromes post-lésionnels)</button></li><li><button class="w" data-k="i30-atcd-rein">Insuffisance rénale avancée, dialyse (cause urémique)</button></li><li><button class="w" data-k="i30-atcd-auto">Maladie systémique, fièvres récurrentes familiales, médicaments inducteurs (causes des récidives)</button></li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<p>Chaque symptôme renseigne sur un mécanisme différent : l’inflammation du feuillet pariétal, le volume de l’épanchement, la compression des organes voisins ou la congestion veineuse de la constriction.</p>
<div class="two">
<ul><li><button class="w" data-k="i30-s-douleur">Douleur thoracique péricarditique (présente dans plus de 85 % des péricardites aiguës)</button></li><li><button class="w" data-k="i30-s-fievre">Fièvre (valeur d’orientation et seuil de gravité)</button></li><li><button class="w" data-k="i30-s-dyspnee">Dyspnée (vitesse d’installation, position antalgique)</button></li></ul>
<ul><li><button class="w" data-k="i30-s-compress">Signes de compression : dysphagie, hoquet, dysphonie, toux (organe comprimé, valeur)</button></li><li><button class="w" data-k="i30-s-oedeme">Œdèmes, ascite, augmentation du volume abdominal (constriction)</button></li><li><button class="w" data-k="i30-s-asthenie">Asthénie, amaigrissement, sueurs nocturnes (causes spécifiques)</button></li></ul></div>
<p>Le profil des symptômes diffère selon la forme. Dans la péricardite aiguë, la douleur domine. Dans l’épanchement abondant d’installation lente, la dyspnée et les signes de compression dominent, souvent sans douleur. Dans la constriction, la douleur est absente et le tableau est celui d’une insuffisance cardiaque droite progressive.</p>
<h3>5.3 Présentations typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Homme de 28 ans, syndrome grippal deux semaines plus tôt. Douleur rétrosternale aiguë, majorée à l’inspiration et en décubitus, soulagée assis penché en avant, irradiant vers le bord du trapèze gauche. Température à 37,9 °C. Frottement, sus-décalage ST diffus, protéine C réactive à 45 mg/L. Péricardite aiguë idiopathique à faible risque.</p></div>
<div class="card"><h4>Forme atypique : sans douleur</h4><p>Femme de 67 ans, cancer du sein traité il y a quatre ans. Dyspnée d’effort progressive depuis un mois, toux sèche, sensation de plénitude thoracique. Aucune douleur. Tachycardie à 112/min, bruits du cœur assourdis, microvoltage. Épanchement circonférentiel de 25 mm : atteinte néoplasique à éliminer.</p></div>
<div class="card"><h4>Forme trompeuse : l’insuffisance cardiaque droite</h4><p>Homme de 58 ans, pontages coronariens il y a six ans. Ascite, œdèmes, hépatomégalie depuis un an, sans dyspnée marquée. Il a été exploré en hépatologie pour « cirrhose ». Turgescence jugulaire majeure avec descente y rapide, vibrance protodiastolique. Constriction post-chirurgicale.</p></div>
<div class="card"><h4>Forme trompeuse : l’infarctus</h4><p>Homme de 52 ans, douleur thoracique et sus-décalage ST inférieur et latéral. Le sus-décalage est concave, sans image en miroir, avec sous-décalage du segment PR ; troponine modérément élevée ; cinétique ventriculaire normale. Myopéricardite, mais la coronarographie reste nécessaire si le doute ischémique persiste.</p></div></div>
</section>

<section class="ilot" id="i30-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre : état général → signes vitaux complets → anthropométrie → signes ciblés. Il répond à trois questions : existe-t-il un signe d’inflammation péricardique, existe-t-il une compression, et existe-t-il un indice de la cause ?</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Position spontanée du patient (assis penché en avant dans la péricardite ; assis, anxieux et polypnéique dans la tamponnade). Teint, sueurs, marbrures. Les <button class="w" data-k="i30-v-vitaux">signes vitaux (fréquence cardiaque, pression artérielle, pression différentielle, fréquence respiratoire, saturation, température)</button> sont interprétés ensemble : une tachycardie avec une pression différentielle pincée fait rechercher une tamponnade. La pression différentielle dépend surtout du volume d’éjection : elle se pince quand le remplissage chute, et la tachycardie tente alors de maintenir le débit. Le poids et le périmètre abdominal servent de référence dans la constriction : ils mesurent la rétention hydrosodée et l’ascite, et guident la dose de diurétique.</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Inflammation péricardique</b><ul><li><button class="w" data-k="i30-e-frott">Frottement péricardique (technique, trois composantes)</button></li><li>Douleur reproduite par l’inspiration profonde, non par la palpation : l’inspiration étire et fait frotter le feuillet pariétal enflammé, alors que la palpation n’atteint que la paroi thoracique</li><li>Fièvre, adénopathies, arthrites (maladie systémique)</li></ul></div>
<div><b>Tamponnade</b><ul><li><button class="w" data-k="i30-e-beck">Triade de Beck (hypotension, turgescence jugulaire, bruits assourdis)</button></li><li><button class="w" data-k="i30-pp">Pouls paradoxal (mesure au brassard)</button></li><li><button class="w" data-k="i30-e-jug">Turgescence jugulaire (lecture des descentes x et y)</button></li><li>Tachycardie, polypnée, extrémités froides : la baisse du débit déclenche une vasoconstriction adrénergique qui préserve la pression artérielle aux dépens de la peau</li></ul></div>
<div><b>Épanchement abondant</b><ul><li>Bruits du cœur assourdis, choc de pointe non palpable : la lame liquide éloigne le cœur de la paroi et amortit la transmission des vibrations</li><li><button class="w" data-k="i30-e-ewart">Signe d’Ewart (matité sous la pointe de l’omoplate gauche)</button></li><li>Frottement souvent absent, parce que le liquide sépare les feuillets ; il peut toutefois persister</li></ul></div>
<div><b>Constriction</b><ul><li><button class="w" data-k="i30-e-kuss">Signe de Kussmaul (ascension inspiratoire de la pression jugulaire)</button></li><li><button class="w" data-k="i30-e-knock">Vibrance péricardique (bruit protodiastolique précoce)</button></li><li>Descente y rapide et profonde (signe de Friedreich) : la pression auriculaire élevée remplit très vite le ventricule à l’ouverture de la tricuspide, jusqu’à l’arrêt brutal imposé par le péricarde</li><li>Hépatomégalie, ascite précédant les œdèmes</li></ul></div></div>
<div class="trap"><span class="k">Piège</span>L’absence de frottement n’exclut pas une péricardite : il est entendu dans un tiers des cas au plus, et il est fugace. Il faut le rechercher à chaque examen. À l’inverse, un épanchement abondant peut le faire disparaître : sa disparition n’est pas toujours un signe de guérison.</div>
<div class="trap"><span class="k">Piège</span>Un pouls paradoxal absent n’exclut pas la tamponnade : plusieurs situations le masquent (fiche <button class="w" data-k="i30-pp">pouls paradoxal (faux négatifs)</button>). L’échocardiographie tranche.</div>
