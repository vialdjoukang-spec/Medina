<div class="lab">Deux questions cliniques</div><p>Le référentiel ESC 2023 sur les cardiomyopathies précise le diagnostic étiologique, l’analyse génétique, le dépistage familial et la stratification du risque. Le référentiel ESC 2026 sur l’insuffisance cardiaque porte sur le syndrome d’insuffisance cardiaque. La définition d’un syndrome et l’étiologie du muscle cardiaque ne sont pas interchangeables.</p>
<div class="lab">Classification de la fraction d’éjection</div><p>La classification antérieure distinguait une fraction d’éjection ≤ 40 %, de 41 à 49 %, et ≥ 50 %. L’ESC 2026 regroupe les fractions d’éjection &lt; 50 % dans l’insuffisance cardiaque à fraction d’éjection réduite, et conserve le groupe ≥ 50 % pour la fraction d’éjection préservée. Le changement de nomenclature ne modifie pas automatiquement les seuils propres au défibrillateur, à un examen d’imagerie ou à un médicament.</p>
<div class="lab">Classes de recommandation</div><p>Une classe de recommandation doit être vérifiée dans le tableau du référentiel et pour la situation clinique exacte. L’utilité de l’analyse génétique ou de la tomographie par émission de positons ne suffit pas à attribuer une nouvelle classe ESC 2026. Le conseil génétique et l’interprétation du résultat restent liés au contexte familial et au phénotype.</p>
<div class="lab">Sources</div><p><a href="https://doi.org/10.1093/eurheartj/ehad194" target="_blank" rel="noopener">ESC 2023 — Cardiomyopathies</a> ; <a href="https://www.escardio.org/news/press/press-releases/major-changes-made-to-the-esc-guidelines-on-heart-failure/" target="_blank" rel="noopener">ESC 2026 — Modifications officielles de l’insuffisance cardiaque</a>.</p>
<div class="lab">Amylose à transthyrétine : une indication élargie</div><p>Le changement thérapeutique le plus net de l’ESC 2026 concerne l’amylose ATTR. L’ESC 2021 sur l’insuffisance cardiaque recommandait le tafamidis seul, en classe NYHA I ou II (I, B). Le tableau de recommandations 28 de l’ESC 2026 recommande un silenceur (vutrisiran) ou un stabilisateur (tafamidis, acoramidis), en classe NYHA I à III, dans la forme sauvage comme héréditaire (I, A). La classe NYHA III n’exclut donc plus le traitement spécifique. Il s’agit d’une indication médicamenteuse élargie, non d’une nouvelle définition de la maladie.</p>
<div class="lab">Bilan : classes lues dans le tableau de recommandations 4</div><p>Si une amylose est suspectée, l’immunofixation sérique et urinaire, le dosage des chaînes légères libres et la scintigraphie osseuse sont demandés d’emblée, ensemble (I, B). Ce bilan conjoint écarte une amylose AL, dont le traitement est hématologique et urgent ; une scintigraphie positive ne suffit pas sans cette recherche. L’IRM avec contraste est recommandée si une cardiomyopathie est suspectée ou si la cause reste incertaine (I, C). L’analyse génétique est recommandée chez le patient qui remplit les critères d’une cardiomyopathie, quand elle sert le diagnostic, le pronostic, le traitement ou le dépistage familial (I, C ; ESC 2023 : I, B, échelle différente). La TEP au FDG est à envisager si une sarcoïdose est suspectée (IIa, C). Avec une maladie rénale chronique, une insuffisance cardiaque inexpliquée fait rechercher une amylose ou une maladie de Fabry (IIa, C, recommandations sur la maladie rénale chronique).</p>
<div class="lab">Fraction d’éjection de 41 à 49 %</div><p>Une CMD symptomatique à FEVG 45 % relève désormais de la fraction réduite, où bêtabloquant et IEC ou ARNI sont recommandés. L’ESC 2026 précise toutefois qu’aucun grand essai randomisé n’a porté sur le seul intervalle 41–49 %.</p>
<div class="lab">Activité physique</div><p>Les recommandations 2026 sur la réadaptation proposent l’entraînement dans la CMH stable (IIa, B1) et la réadaptation dans les cardiomyopathies primitives sans arythmie significative ni insuffisance cardiaque symptomatique (IIb, C). Une CMH avec obstruction sévère contre-indique l’épreuve d’effort et l’entraînement.</p>
