
<!-- ===== FENÊTRES I83 (rédacteur A) : définitions, mécanismes, clinique ===== -->
<template data-pop="i83-ceap" data-title="Classification CEAP 2020 : décrire un membre">
<p>La classification CEAP décrit un membre à un moment donné selon quatre domaines : clinique, étiologique, anatomique et physiopathologique. Le domaine clinique énumère les signes veineux présents ; les trois autres domaines disent pourquoi, où et comment la veine est malade.</p>
<div class="lab">Notation</div><p>Le domaine C cote le signe veineux de C&#8288;0 à C&#8288;6. La notation détaillée énumère toutes les classes présentes, séparées par des virgules, puis ajoute S si le membre est symptomatique ou A s’il ne l’est pas. La classe C&#8288;4 réunit les altérations cutanées secondaires à la maladie veineuse : pigmentation ou eczéma (C&#8288;4a), lipodermatosclérose ou atrophie blanche (C&#8288;4b), corona phlebectatica (C&#8288;4c). Ces sous-classes décrivent des lésions différentes et ne forment pas une échelle : l’ESVS 2022 constate qu’aucune donnée solide n’indique quels membres de classe C&#8288;4 progressent le plus vers l’ulcère. La révision de 2004 a introduit, à côté de la notation complète, une notation élémentaire plus simple ; ses règles exactes ne sont pas reprises ici, car seul le résumé des textes a été lu. Le domaine E distingue Ep primitive, Esi secondaire intraveineuse (séquelle de thrombose), Ese secondaire extraveineuse (compression, insuffisance cardiaque droite, pompe musculaire déficiente, obésité), Ec congénitale et En sans cause identifiée. Le domaine A précise As superficiel, Ad profond, Ap perforantes ou An aucun site. Le domaine P précise Pr reflux, Po obstruction, Pr,o les deux ou Pn aucune physiopathologie identifiée ; il doit être accompagné de la localisation des segments atteints.</p>
<div class="lab">Nouveautés de 2020</div><p>La révision a créé la classe C&#8288;4c pour la corona phlebectatica, le suffixe r pour les varices récidivées (C&#8288;2r) et l’ulcère récidivé (C&#8288;6r), et la subdivision de la cause secondaire en Esi et Ese. Des abréviations anatomiques anglaises ont remplacé les anciens numéros de segments : la grande saphène est notée séparément au-dessus et au-dessous du genou.</p>
<div class="lab">Exemple</div><p>Le membre gauche de Mme R. s’écrit C&#8288;2,3,4a,4c S, Ep, As,p, Pr, avec un reflux de la grande saphène au-dessus et au-dessous du genou, d’une collatérale de jambe et d’une perforante jambière. La notation dit en une ligne qu’il s’agit d’une maladie primitive, superficielle et perforante, par reflux, déjà au stade cutané.</p>
<div class="lab">Limites</div><p>La CEAP est descriptive et catégorielle : elle ne suit pas l’évolution, car une pigmentation persiste après un traitement réussi. La classe C&#8288;3 suppose un œdème d’origine veineuse ; un œdème cardiaque ou médicamenteux ne la justifie pas. L’indice S repose sur des symptômes peu spécifiques. L’ESVS recommande la CEAP pour l’audit clinique et la recherche (recommandation 1, classe I, niveau C), et non comme score de gravité.</p>
<div class="lab">Source</div><p>Lurie et al. J Vasc Surg Venous Lymphat Disord 2020;8:342-352 et Eklöf et al. J Vasc Surg 2004;40:1248-1252 (versions élémentaire et complète de la CEAP), lus sur leurs résumés PubMed ; texte intégral non consulté. De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, tableaux 3 et 4, recommandation 1 et § 9.1.</p></template>

<template data-pop="i83-vcss" data-title="VCSS révisé et échelle de Villalta : mesurer la gravité">
<p>Le VCSS révisé donne un score continu de gravité de la maladie veineuse chronique et suit son évolution après traitement. L’échelle de Villalta diagnostique et gradue le syndrome post-thrombotique.</p>
<div class="lab">VCSS révisé</div><p>Dix items sont cotés de 0 (absent) à 3 (sévère) : douleur, varices, œdème veineux, pigmentation, inflammation, induration, nombre d’ulcères actifs, durée de l’ulcère, taille de l’ulcère et port de la compression, soit 0 à 30 points. La douleur vaut 1 si elle est occasionnelle, 2 si elle est quotidienne et gêne sans empêcher les activités, 3 si elle limite la plupart des activités. Les varices valent 1 si elles sont rares ou réduites à une corona phlebectatica, 2 si elles sont confinées à la jambe ou à la cuisse, 3 si elles occupent la jambe et la cuisse. L’œdème vaut 1 s’il est limité au pied ou à la cheville, 2 s’il dépasse la cheville sans atteindre le genou, 3 s’il atteint le genou.</p>
<div class="lab">Exemple</div><p>Les 8 points de Mme R. comptent 0 pour l’induration, les ulcères et la compression, qu’elle ne porte pas encore. Après l’ablation de la grande saphène, le score baisse avec la disparition des varices, de la douleur et de l’eczéma, alors que les classes CEAP C&#8288;4a et C&#8288;4c restent cotées.</p>
<div class="lab">Échelle de Villalta</div><p>Cinq symptômes (douleur, crampes, lourdeur, prurit, paresthésies) et six signes (œdème, induration, hyperpigmentation, ectasie veineuse, rougeur, douleur à la pression du mollet) sont cotés de 0 à 3, soit 33 points au plus. Un score inférieur à 5 exclut le syndrome post-thrombotique ; de 5 à 9, il est léger ; de 10 à 14, modéré ; au-delà de 14 ou en présence d’un ulcère, sévère.</p>
<div class="lab">Limites</div><p>L’item compression du VCSS révisé augmente quand le patient porte ses bas : un score élevé peut traduire une bonne observance plutôt qu’une aggravation. La spécificité de l’échelle de Villalta est discutée, car ses symptômes et ses signes existent aussi chez des patients sans thrombose antérieure. L’ESVS propose ces deux outils pour l’audit clinique et la recherche (recommandation 2, classe IIa, niveau C).</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.5, tableaux 5 et 6.</p></template>

<template data-pop="i83-codage" data-title="Codage CIM-10-GM des varices et de l’insuffisance veineuse">
<p>Le code se choisit d’après la lésion présente. Des varices sans complication relèvent de I83.9, des varices avec dermite de stase (eczéma veineux) de I83.1, des varices ulcérées de I83.0, ou de I83.2 si une dermite s’y ajoute. L’insuffisance veineuse sans varices codées, le syndrome post-thrombotique et la compression veineuse relèvent de I87.</p>
<div class="lab">Catégorie I87</div><p>I87.0 regroupe le syndrome post-thrombotique, sans ulcération (I87.00) ou avec ulcération (I87.01). I87.1 désigne une compression veineuse, comme une compression iliaque non thrombotique. I87.2 désigne l’insuffisance veineuse chronique périphérique, sans ulcération (I87.20) ou avec ulcération (I87.21) ; un ulcère sur varices en est exclu et reste en I83.0 ou I83.2. I87.8 et I87.9 couvrent les autres atteintes précisées et les atteintes sans précision ; elles ne sont pas développées dans ce cours, qui ne revendique pas la complétude de la catégorie I87.</p>
<div class="lab">Pièges</div><p>Une thrombophlébite sur varice ne se code pas I83.1 mais I80.0, avec le cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie). Les varices de la grossesse relèvent du chapitre obstétrical (catégorie O22), et non de I83. Les varices pelviennes (I86.2) et vulvaires (I86.3) se codent à part, même lorsqu’elles alimentent des varices des membres.</p>
<div class="lab">Limites</div><p>La correspondance entre code et classe CEAP est approchée : la CIM-10-GM ne distingue ni l’œdème ni la pigmentation. Aucune correspondance avec la CIM-11 n’est établie dans l’atlas ; aucun code CIM-11 n’est donc proposé.</p>
<div class="lab">Source</div><p>CIM-10-GM 2024, catégories I80, I83, I86 et I87 (libellés du catalogue de l’atlas).</p></template>

<template data-pop="i83-pav" data-title="Pression veineuse ambulatoire : pourquoi la marche abaisse la pression du pied">
<p>Chez une personne debout et immobile, une veine du dos du pied supporte 80 à 90 mmHg ; pendant la marche, cette pression tombe à 20 à 30 mmHg. Cette pression mesurée pendant la marche est la pression veineuse ambulatoire. Lorsqu’elle ne baisse pas, le patient a une hypertension veineuse ambulatoire.</p>
<div class="lab">Mécanisme</div><p>Immobile, la veine du pied supporte le poids de toute la colonne de sang qui la sépare de l’oreillette droite. À chaque pas, le mollet se contracte, comprime les veines profondes et chasse le sang vers le haut ; les valvules se ferment ensuite et empêchent le sang de redescendre. La veine ne se remplit alors que lentement, par l’apport artériel et capillaire, et la pression du pied reste basse tant que la marche continue. En cas de reflux, le sang redescend par les valvules incompétentes dès que le mollet se relâche : la veine se remplit vite par le haut et la pression remonte. En cas d’obstruction, le sang chassé ne peut pas sortir du membre, et la pression reste élevée ou augmente pendant l’effort.</p>
<div class="lab">Conséquence clinique</div><p>Les symptômes augmentent après une station debout ou assise prolongée et s’atténuent à la marche ou jambes surélevées. Les lésions cutanées prédominent à la cheville, où la pression est la plus forte. Les traitements visent cette pression : la marche active la pompe, la compression réduit le calibre veineux et le reflux, et l’ablation supprime la voie de reflux.</p>
<div class="lab">Limites</div><p>La mesure exige de ponctionner une veine du pied ; elle sert à la recherche et n’est pas pratiquée en routine. Dans une étude rétrospective de 4 132 membres, une pression ambulatoire élevée s’associait à une classe clinique plus grave, surtout en cas de reflux. Cette association ne prouve pas qu’un seuil de pression prédise l’ulcère chez un patient donné. La pléthysmographie mesure des variations de volume du mollet et donne une estimation non invasive.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.3 et § 2.6.</p></template>

<template data-pop="i83-microcirc" data-title="Microcirculation et inflammation : de l’hypertension veineuse à la dermite">
<p>L’hypertension veineuse se transmet aux capillaires et aux veinules de la peau. Leur endothélium devient dysfonctionnel, laisse fuir du liquide et des hématies, et attire des leucocytes. Il en résulte un œdème, une inflammation chronique, puis une fibrose, une pigmentation et un ulcère.</p>
<div class="lab">Petites veines et valvules</div><p>Des valvules existent jusque dans des veines de 100 µm à 2 mm de diamètre, et elles peuvent devenir incompétentes. Dans les collatérales de troisième génération de la grande saphène, des valvules dites frontières empêchent normalement le reflux d’atteindre la peau. Lorsque la grande saphène reflue, l’incompétence de ces microvalves pourrait jouer un rôle décisif dans l’apparition des lésions cutanées.</p>
<div class="lab">Mécanisme</div><p>Les capillaires s’allongent, se dilatent et deviennent tortueux ; la gravité de ces anomalies en capillaroscopie est corrélée à celle des lésions cutanées. L’endothélium exprime des molécules d’adhésion, retient des leucocytes et libère des médiateurs inflammatoires. Les hématies extravasées libèrent leur fer, stocké sous forme d’hémosidérine : la peau brunit et le fer entretient un stress oxydatif. Du fibrinogène fuit et forme des manchons de fibrine autour des capillaires. L’inflammation chronique aboutit à une fibrose du derme et de l’hypoderme, parfois à une calcification, puis à une perte d’intégrité de la peau.</p>
<div class="lab">Hypothèses discutées</div><p>Browse et Burnand ont proposé en 1982 que les manchons de fibrine gênent la diffusion de l’oxygène. Coleridge Smith et al. ont proposé en 1988 que les leucocytes piégés dans les capillaires des jambes déclives les obstruent et rendent la peau ischémique. Aucune de ces deux hypothèses n’explique seule l’ulcère ; l’ESVS parle d’une hypoxie paradoxale dans une peau pourtant hyperhémique.</p>
<div class="lab">Conséquence clinique</div><p>La fibrose et la pigmentation régressent peu : il vaut mieux traiter l’hypertension veineuse avant ce stade. La compression de 20 à 40 mmHg réduit la filtration capillaire et l’induration de la lipodermatosclérose (recommandation 11, classe I, niveau B).</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.2.3 et § 1.3. Browse et al. Lancet 1982;2:243-245. Coleridge Smith et al. British Medical Journal 1988;296:1726-1727.</p></template>

<template data-pop="i83-fdr-hered" data-title="Hérédité, âge, sexe et grossesses : association ou cause ?">
<p>Le sexe féminin, l’âge, les grossesses et les antécédents familiaux sont associés à la maladie veineuse chronique. Pour la plupart, ces liens reposent sur des études transversales et ne prouvent pas une causalité.</p>
<div class="lab">Données</div><p>Dans la revue de Salim et al., le sexe féminin s’associe à la maladie avec un rapport de cotes de 2,26 ; l’âge, la parité et les antécédents familiaux sont aussi associés. Dans l’Edinburgh Vein Study, la progression sur 13 ans ne dépendait ni du sexe ni de l’âge, mais du surpoids et d’un antécédent de thrombose. Le sexe féminin semble donc lié à la fréquence de la maladie davantage qu’à sa progression.</p>
<div class="lab">Grossesse</div><p>L’ESVS considère la grossesse comme un facteur contributif : elle augmente la fréquence des télangiectasies, des veines réticulaires, des varices et des récidives à la jonction saphéno-fémorale après chirurgie. Les varices vulvaires tendent à s’aggraver à chaque grossesse. Trois mécanismes sont plausibles, sans démonstration directe : les hormones de la grossesse relâchent le muscle lisse de la paroi veineuse, le volume sanguin augmente, et l’utérus gravide comprime les veines iliaques et la veine cave.</p>
<div class="lab">Hérédité et taille</div><p>Une étude de 493 519 participants de la biobanque britannique a identifié 30 nouveaux loci associés aux varices, impliqués dans le développement vasculaire et squelettique. La grande taille restait associée aux varices après ajustement, et une analyse de randomisation mendélienne suggère que ce lien est causal. Chaque variant n’explique qu’une faible part du risque : aucun test génétique n’est utile dans les varices communes (fenêtre <button class="w" data-k="i83-gen">hérédité des varices</button>).</p>
<div class="lab">Conséquence clinique</div><p>Ces facteurs ne se corrigent pas, mais ils renseignent sur le terrain. Chez Mme R., trois grossesses, une mère opérée et son sexe expliquent une maladie primitive précoce ; ils ne changent pas l’indication, qui dépend de la peau et du reflux.</p>
<div class="lab">Source</div><p>Salim et al. Ann Surg 2021;274:971-976. De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.1 et § 8.2.2. Fukaya et al. Circulation 2018;138:2869-2880.</p></template>

<template data-pop="i83-fdr-obesite" data-title="Obésité et station debout prolongée">
<p>L’obésité aggrave la maladie veineuse chronique surtout en augmentant la pression intra-abdominale, qui gêne la sortie du sang des membres inférieurs. La station debout prolongée maintient la pression hydrostatique maximale sans activer la pompe du mollet.</p>
<div class="lab">Mécanisme</div><p>La pression intra-abdominale se transmet aux veines iliaques et fémorales : le sang sort moins bien du membre, le reflux augmente et la pression veineuse s’élève. Le mollet d’un patient obèse éjecte davantage de sang à chaque contraction, mais il se contracte moins souvent, car le nombre de pas quotidiens diminue. </p>
<div class="lab">Conséquence clinique</div><p>Dans une analyse rétrospective de 65 329 patients traités par ablation endoveineuse, phlébectomies ou mousse, les résultats étaient moins bons lorsque l’IMC atteignait 35 kg/m² ou plus. Le VCSS révisé et la qualité de vie s’amélioraient pourtant dans toutes les catégories d’IMC à six mois. Chez l’obèse, l’ablation endoveineuse est préférée à la chirurgie ouverte, car les infections de plaie y sont rares (recommandation 92, classe IIa, niveau C). Après chirurgie bariatrique, la proportion de patients avec atteinte cutanée est passée de 75 à 80 % à 36,4 % dans une série ; l’ESVS propose la perte de poids pour améliorer l’évolution veineuse (recommandation 91, classe IIa, niveau C).</p>
<div class="lab">Limites</div><p>Les données sur la perte de poids sont observationnelles. Aucune étude ne montre qu’un changement de poste de travail prévient les varices ; des pauses de marche et la contraction du mollet suivent toutefois la physiologie de la pompe.</p>
<div class="lab">Décision</div><p>Chez Mme R., avec un IMC à 31 kg/m² et huit heures debout par jour, le médecin propose une activité physique régulière et une perte de poids. Ces mesures accompagnent le traitement du reflux ; elles ne le remplacent pas.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.3 et § 8.2.1, recommandations 91 et 92.</p></template>

<template data-pop="i83-s-lourdeur" data-title="Lourdeur, douleur, crampes, prurit : valeur des symptômes veineux">
<p>La lourdeur, la sensation de gonflement, la brûlure, le prurit et la douleur sont les symptômes les plus évocateurs d’une origine veineuse. Ils restent peu spécifiques et ne mesurent pas la gravité de l’hypertension veineuse.</p>
<div class="lab">Caractérisation</div><p>Un symptôme veineux augmente au fil de la journée, après une station debout ou assise prolongée et à la chaleur. Il diminue à la marche, jambes surélevées ou sous compression. Cette chronologie suit la pression veineuse : elle monte lorsque la pompe du mollet est inactive et baisse lorsqu’elle fonctionne. Le prurit localisé au-dessus de la cheville précède souvent l’eczéma de stase.</p>
<div class="lab">Valeur</div><p>L’intensité et le nombre des symptômes évocateurs augmentent avec la classe clinique CEAP. La fatigue des jambes, les crampes nocturnes et les jambes sans repos sont moins spécifiques. Les symptômes sont plus souvent rapportés par les femmes et augmentent avec l’âge. Ils peuvent exister sans signe (C&#8288;0s) et manquer malgré des varices étendues, voire au stade C&#8288;4 ou C&#8288;5.</p>
<div class="lab">Mécanisme</div><p>Le mécanisme de la douleur veineuse n’est pas établi. La distension de la paroi veineuse et l’inflammation de la paroi et des tissus voisins sont les hypothèses les plus souvent avancées.</p>
<div class="lab">Piège</div><p>Les mêmes plaintes accompagnent une arthrose, une neuropathie, une radiculopathie ou un syndrome des jambes sans repos. Un patient opéré pour des symptômes non veineux reste symptomatique. Le médecin cherche donc la chronologie veineuse et les signes compatibles avant d’attribuer la plainte aux veines.</p>
<div class="lab">Conséquence pratique</div><p>Chez Mme R., la lourdeur vespérale soulagée par la marche et le prurit sus-malléolaire sont cohérents avec son reflux. La douleur est cotée dans le VCSS révisé, ce qui permet de suivre son évolution après traitement.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.4.1.</p></template>

<template data-pop="i83-s-claud" data-title="Claudication veineuse : penser à l’obstruction proximale">
<p>La claudication veineuse est une douleur en éclatement de tout le membre, qui croît pendant la marche et limite le périmètre. Elle traduit une obstruction de la sortie veineuse, au niveau ilio-fémoral ou cave, ou plus rarement un piégeage de la veine poplitée.</p>
<div class="lab">Mécanisme</div><p>Pendant l’effort, le débit artériel des muscles augmente fortement. Si la veine de sortie est rétrécie, le sang entre plus vite qu’il ne sort : le volume du membre et la pression veineuse montent, et les muscles se tendent dans leurs loges. La douleur cède lentement au repos, surtout jambe surélevée, car il faut le temps que le membre se vide.</p>
<div class="lab">Différence avec la claudication artérielle</div><p>La claudication artérielle est une crampe d’un groupe musculaire, souvent le mollet, qui cède en quelques minutes à l’arrêt, même debout ; les pouls sont diminués et l’index de pression est bas. La claudication veineuse s’accompagne souvent d’un œdème, d’un antécédent de thrombose et de veines dilatées au-dessus du pubis, avec des pouls normaux.</p>
<div class="lab">Données</div><p>Chez 39 patients examinés cinq ans après une thrombose ilio-fémorale, un test de marche standardisé sur tapis (3,5 km/h, pente de 10 %) a provoqué une claudication veineuse imposant l’arrêt chez 15 % d’entre eux. L’effectif est petit ; la fréquence réelle reste incertaine.</p>
<div class="lab">Décision</div><p>Une claudication veineuse fait compléter l’écho-Doppler du membre par une échographie des veines abdominales et pelviennes (recommandation 4, classe IIa, niveau C), puis par une IRM ou une TDM veineuse si une intervention est envisagée (recommandation 5, classe I, niveau C). Le traitement de l’obstruction iliaque est discuté à l’îlot 12.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.4.1 et § 2.3.2.</p></template>

<template data-pop="i83-x-debout" data-title="Examen veineux debout : technique et signes">
<p>Les veines incompétentes ne se remplissent qu’en position debout. L’examen se fait donc chez un patient debout, membres entièrement découverts, sous un bon éclairage, après quelques minutes d’orthostatisme.</p>
<div class="lab">Technique</div><p>Le patient se tient debout, le poids porté sur le membre opposé, et le membre examiné reste détendu, genou légèrement fléchi. Le médecin inspecte la face antérieure, interne, externe et postérieure, du pli de l’aine au pied, puis l’abdomen et le pubis. Il palpe les trajets : une varice molle et compressible se remplit de nouveau dès qu’il relâche la pression. Il note les cicatrices d’intervention antérieure, mesure les circonférences de cheville et de mollet et photographie les lésions cutanées.</p>
<div class="lab">Lecture topographique</div><p>Le territoire des varices oriente vers la source du reflux ; la face postérieure de cuisse, le périnée et la vulve évoquent une origine pelvienne. Des veines dilatées au-dessus du pubis signalent une obstruction iliaque unilatérale, des veines abdominales une obstruction de la veine cave, car le sang contourne l’obstacle par ces collatérales.</p>
<div class="lab">Tests historiques</div><p>Les tests de Trendelenburg et de Perthes utilisaient un garrot pour distinguer un reflux superficiel d’un reflux profond ou perforant. Le Doppler continu de poche les a suivis. Tous deux ont été remplacés par l’écho-Doppler, qui voit la veine et mesure le reflux : un plan de traitement fondé sur le seul Doppler continu conduit à des traitements inadaptés.</p>
<div class="lab">Piège</div><p>Un examen pratiqué couché sous-estime les varices. Un examen limité au membre symptomatique méconnaît l’atteinte controlatérale, et un examen qui omet l’abdomen méconnaît une obstruction proximale.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 1.4.2, § 2.1 et § 2.2.</p></template>

<template data-pop="i83-x-peau" data-title="Signes cutanés de l’insuffisance veineuse chronique">
<p>Les signes cutanés montrent que l’hypertension veineuse a atteint la microcirculation. Ils définissent la classe C&#8288;4 ; en présence d’un reflux superficiel, cette classe suffit à poser l’indication d’un traitement interventionnel (recommandation 17, classe I, niveau C).</p>
<div class="lab">Pigmentation (C&#8288;4a)</div><p>Une coloration brune apparaît au-dessus de la malléole interne. Elle provient de l’hémosidérine des hématies sorties des capillaires ; elle persiste longtemps après le traitement.</p>
<div class="lab">Eczéma (C&#8288;4a)</div><p>Une peau rouge, prurigineuse, squameuse ou suintante traduit la dermite de stase. Les topiques appliqués sur une jambe veineuse, surtout sur un ulcère, peuvent provoquer une sensibilisation de contact qui imite ou aggrave cet eczéma.</p>
<div class="lab">Lipodermatosclérose et atrophie blanche (C&#8288;4b)</div><p>La lipodermatosclérose est une inflammation chronique avec fibrose de la peau et de l’hypoderme : la peau est indurée, adhérente et parfois rétractée au-dessus de la cheville. Sa phase aiguë est rouge et douloureuse et peut être confondue avec une dermohypodermite bactérienne. L’atrophie blanche se présente comme des zones blanches, atrophiques et cicatricielles, entourées de capillaires dilatés, où la peau est mal vascularisée.</p>
<div class="lab">Corona phlebectatica (C&#8288;4c)</div><p>De nombreuses veinules intradermiques dilatées dessinent un éventail sur le bord interne ou externe du pied et de la cheville. La révision de 2020 en a fait une classe distincte.</p>
<div class="lab">Ulcère (C&#8288;5 et C&#8288;6)</div><p>Une cicatrice d’ulcère définit C&#8288;5 ; un ulcère ouvert, C&#8288;6. L’ulcère veineux siège en général dans la région de la guêtre, autour des malléoles.</p>
<div class="lab">Piège</div><p>Une dermite de stase ou une lipodermatosclérose aiguë traitées comme un érysipèle conduisent à des antibiotiques inutiles ; leur caractère chronique, souvent bilatéral et sans fièvre les distingue. Chez Mme R., pigmentation et eczéma définissent C&#8288;4a, et la corona phlebectatica ajoute C&#8288;4c.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, tableau 3, § 1.3, § 6.2 et recommandation 17.</p></template>

<template data-pop="i83-x-oedeme" data-title="Œdème veineux et autres œdèmes des jambes">
<p>L’œdème veineux est mou, prend le godet, prédomine à la cheville le soir et diminue après la nuit. Il est souvent unilatéral ou asymétrique et s’accompagne d’autres signes veineux. Un œdème bilatéral et symétrique doit d’abord faire chercher une autre cause.</p>
<div class="lab">Mécanisme</div><p>Selon l’équilibre de Starling, la filtration capillaire dépend surtout de la pression hydrostatique dans le capillaire. L’hypertension veineuse élève cette pression ; la filtration dépasse alors ce que les lymphatiques drainent, et le liquide s’accumule dans l’interstitium déclive.</p>
<div class="lab">Œdème des antagonistes calciques</div><p>Les dihydropyridines, comme l’amlodipine, dilatent les artérioles sans dilater autant les veinules : la pression capillaire augmente et le liquide filtre. Dans une méta-analyse de 106 essais, l’œdème touchait 10,7 % des patients sous antagoniste calcique contre 3,2 % sous témoin ; il atteignait 24 % après six mois et était près de trois fois plus fréquent à forte dose. Sa prise en charge médicamenteuse est traitée dans l’onglet Pharmacologie.</p>
<div class="lab">Autres causes</div><p>L’insuffisance cardiaque donne un œdème bilatéral avec dyspnée et turgescence jugulaire (cours I50 — Insuffisance cardiaque, C-01-Cardiologie). Une maladie rénale ou hépatique l’accompagne d’une protéinurie, d’une hypoalbuminémie ou d’une ascite. Le lymphœdème atteint le dos du pied et les orteils ; le signe de Stemmer, impossibilité de pincer la peau à la base du deuxième orteil, l’oriente. Le lipœdème est un dépôt graisseux symétrique et douloureux qui épargne le pied.</p>
<div class="lab">Décision</div><p>Avant de traiter un reflux chez un patient dont l’œdème est la seule plainte, l’ESVS demande de considérer les causes non veineuses (recommandation 16, classe IIa, niveau C). Chez Mme R., l’œdème des deux chevilles sous amlodipine 10 mg par jour fait discuter avec son médecin un autre antihypertenseur ou une association ; son indication de traitement repose de toute façon sur les lésions cutanées.</p>
<div class="lab">Source</div><p>De Maeseneer et al. Eur J Vasc Endovasc Surg 2022;63:184-267, § 2.1 et recommandation 16. Makani et al. J Hypertens 2011;29:1270-1280.</p></template>

<template data-pop="pareto-i83-bases" data-title="Pareto — Définitions, mécanismes et diagnostic">
<p class="ratio" data-cover="i83-1,i83-2,i83-3,i83-4,i83-5,i83-6,i83-7"></p>
<ul><li>La maladie veineuse chronique va du symptôme sans signe à l’ulcère ; l’insuffisance veineuse chronique commence à l’œdème (C&#8288;3 à C&#8288;6).</li><li>La CEAP décrit un membre : classes cliniques présentes, cause (Ep, Esi, Ese, Ec), site (As, Ad, Ap) et mécanisme (Pr, Po) ; les sous-classes C&#8288;4a, C&#8288;4b et C&#8288;4c ne se hiérarchisent pas. Le VCSS révisé suit l’évolution ; l’échelle de Villalta gradue le syndrome post-thrombotique.</li><li>Le code I83.1 désigne la dermite de stase ; une thrombophlébite se code I80.0.</li><li>Environ un adulte sur cinq a des varices ; l’ulcère actif touche moins de 1 % des adultes. Aucune donnée nationale suisse n’est disponible. La maladie progresse lentement : un tiers des varices non compliquées s’accompagnent de lésions cutanées après 13 ans.</li><li>Le reflux ou l’obstruction empêche la marche d’abaisser la pression du pied (80 à 90 mmHg immobile, 20 à 30 mmHg à la marche). Cette hypertension veineuse ambulatoire atteint les capillaires et explique l’œdème, la pigmentation, la fibrose et l’ulcère.</li><li>Les varices primitives dominent. Une thrombose antérieure est une cause démontrée ; l’obésité et la station debout sont des facteurs associés, dont le mécanisme hémodynamique est clair.</li><li>L’anamnèse recherche une thrombose, un médicament œdématogène, une artériopathie et une insuffisance cardiaque. Les symptômes veineux s’aggravent le soir et cèdent à la marche ; la claudication veineuse évoque une obstruction proximale.</li><li>L’examen se fait debout. La peau donne la classe ; des veines sus-pubiennes évoquent une obstruction iliaque.</li><li>L’écho-Doppler complet debout est l’examen de référence : il retient un reflux superficiel au-delà de 0,5 s et profond au-delà de 1 s, puis aboutit à une cartographie. L’évaluation artérielle précède la compression.</li><li>Le diagnostic différentiel élimine d’abord la thrombose profonde et l’artériopathie, puis les œdèmes cardiaque, rénal, hépatique et médicamenteux.</li></ul></template>
