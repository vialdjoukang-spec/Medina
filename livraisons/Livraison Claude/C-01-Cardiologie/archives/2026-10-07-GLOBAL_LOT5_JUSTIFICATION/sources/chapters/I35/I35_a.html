<section class="ilot" id="i35-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Un homme de 78 ans consulte parce qu’il s’essouffle en montant l’escalier qui mène à son appartement, alors qu’il le montait sans peine l’an dernier. Il a fait un malaise en portant ses courses. Son médecin entend un souffle systolique rude au bord droit du sternum. La question qui structure tout le chapitre est la suivante : <b>ce souffle traduit-il un rétrécissement aortique sévère, les symptômes en découlent-ils, et faut-il remplacer la valve, par quelle technique et avec quelle prothèse ?</b></p>
<p>Le même raisonnement s’applique à une femme de 45 ans chez qui l’on découvre une insuffisance aortique sur valve bicuspide avec une aorte ascendante de 48 mm : quand la valve fuit sans symptôme, il faut savoir <b>à quel moment le ventricule gauche commence à souffrir</b>, avant que l’atteinte devienne irréversible, et à quel diamètre l’aorte expose à la dissection.</p>
<p>À la fin de ce chapitre, le médecin assistant sait reconnaître les souffles aortiques et leurs signes de gravité, lire une échocardiographie de rétrécissement ou d’insuffisance aortique, résoudre une discordance entre surface et gradient, poser une indication d’intervention selon les recommandations ESC/EACTS 2025, préparer la discussion en Heart Team entre chirurgie et TAVI, choisir la prothèse et le traitement antithrombotique, et organiser le suivi des patients asymptomatiques.</p>
<div class="key"><b>Prérequis.</b> La <button class="w" data-k="laplace">loi de Laplace (contrainte pariétale et hypertrophie)</button>, l’<button class="w" data-k="i35-bernoulli">équation de Bernoulli simplifiée (vitesse et gradient)</button> et l’<button class="w" data-k="i35-continuite">équation de continuité (calcul de la surface valvulaire)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
</section>

<section class="ilot" id="i35-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>La valve aortique sépare la chambre de chasse du ventricule gauche de l’aorte. Elle doit s’ouvrir largement en systole, sans opposer de résistance, et se fermer de façon étanche en diastole. Chaque défaillance produit une valvulopathie distincte.</p>
<div class="two">
<div class="card"><h4>Rétrécissement aortique (RA)</h4><p>Obstruction à l’éjection ventriculaire gauche au niveau de la valve, par réduction de la mobilité des cuspides. La surface valvulaire normale de l’adulte est de 3 à 4 cm² ; un gradient notable n’apparaît que lorsqu’elle a diminué de moitié environ. À débit égal, la vitesse du jet varie à l’inverse de la surface, et le gradient comme le carré de cette vitesse : diviser la surface par deux multiplie le gradient par quatre. Le gradient reste donc faible tant que l’orifice est large, puis s’élève rapidement quand la surface approche 1 cm². Le terme « sténose aortique » est synonyme.</p></div>
<div class="card"><h4>Insuffisance aortique (IA)</h4><p>Défaut de fermeture de la valve en diastole : une partie du volume éjecté revient dans le ventricule gauche. Elle résulte d’une atteinte des cuspides, de la racine aortique, ou des deux. On distingue l’<button class="w" data-k="i35-ia-aigue">insuffisance aortique aiguë (urgence chirurgicale)</button> et la forme chronique, longtemps bien tolérée.</p></div></div>
<h3>1.1 Grades de sévérité</h3>
<p>La sévérité ne se résume jamais à un seul chiffre, car chaque mesure a sa propre source d’erreur. La vitesse et le gradient varient avec le débit, tandis que la surface hérite de l’erreur sur le diamètre de la chambre de chasse, élevé au carré dans le calcul ; l’ESC/EACTS 2025 tient le gradient moyen pour le paramètre le plus robuste. Pour le RA, on combine la vitesse maximale transvalvulaire (Vmax), le gradient moyen et la surface valvulaire aortique (SVA). Le seuil de sévérité repose sur trois valeurs : <b>Vmax ≥ 4,0 m/s, gradient moyen ≥ 40 mmHg, SVA &lt; 1,0 cm²</b>. Le détail des <button class="w" data-k="i35-grades">grades de sévérité du rétrécissement aortique (léger, modéré, sévère)</button> et de la <button class="w" data-k="i35-iaquant">quantification de l’insuffisance aortique (critères intégrés)</button> figure dans l’onglet Examens.</p>
<div class="trap"><span class="k">Piège</span>Une sclérose aortique n’est pas un rétrécissement aortique. Dans la sclérose, les cuspides sont épaissies ou calcifiées mais s’ouvrent normalement, avec une Vmax ≤ 2,5 m/s. Elle ne justifie aucune intervention ; elle marque cependant un risque cardiovasculaire accru et peut évoluer vers un RA. Dans la Cardiovascular Health Study, la mortalité cardiovasculaire restait environ 1,5 fois plus élevée en cas de sclérose après ajustement sur les facteurs de risque connus. Cette association reflète un terrain et une inflammation communs avec l’athérosclérose, sans preuve que la valve cause ces événements : elle conduit à traiter les facteurs de risque, non la valve.</div>
<h3>1.2 Stades de la maladie</h3>
<p>Les recommandations américaines ACC/AHA 2020 décrivent des <button class="w" data-k="i35-stades">stades A à D (à risque, progressif, sévère asymptomatique, sévère symptomatique)</button>. L’ESC n’utilise pas ces lettres, mais raisonne selon les mêmes étapes. Cette grille est utile, car elle rappelle que la décision dépend de trois éléments : la sévérité anatomique, la présence de symptômes et le retentissement ventriculaire gauche.</p>
<h3>1.3 Codage CIM-10-GM</h3>

</section>

<section class="ilot" id="i35-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Le RA calcifié est la valvulopathie qui conduit le plus souvent à une intervention en Europe. Dans l’Euro Heart Survey (2001), il représentait environ 43 % des valvulopathies natives prises en charge, contre environ 13 % pour l’IA. Sa fréquence dépend avant tout de l’âge, car la calcification s’accumule avec les années de contrainte mécanique et d’exposition aux facteurs de risque : une méta-analyse de 2013 estime la prévalence du RA sévère à environ 3,4 % après 75 ans. Une sclérose aortique est présente chez environ un quart des personnes de plus de 65 ans (Cardiovascular Health Study, 1997).</p>
<p>La valve bicuspide est l’anomalie cardiaque congénitale la plus fréquente : elle concerne environ 0,5 à 2 % de la population, avec une prédominance masculine d’environ trois pour un. Elle explique une part importante des RA opérés avant 70 ans, car la valve bicuspide se calcifie une à deux décennies plus tôt qu’une valve tricuspide.</p>
<p>La cardiopathie rhumatismale reste la première cause de valvulopathie dans les pays à revenu faible ou intermédiaire. En Suisse, elle se rencontre surtout chez des personnes ayant grandi dans ces régions ; l’atteinte aortique rhumatismale s’accompagne presque toujours d’une atteinte mitrale.</p>
<p>L’IA est plus rare comme valvulopathie isolée sévère. Dans la cohorte de Framingham, une IA de tout degré était détectée chez environ 5 % des adultes, mais une IA au moins modérée chez moins de 1 %. Ses causes dominantes en Europe sont la dilatation de la racine aortique et la bicuspidie.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune prévalence suisse consolidée des valvulopathies aortiques n’est publiée. Le registre national SwissTAVI suit depuis 2011 les patients traités par TAVI, mais ne mesure pas la prévalence dans la population. Les chiffres ci-dessus sont européens et nord-américains.</div>

</section>

<section class="ilot" id="i35-3"><h2><span class="n">3</span>Physiopathologie du rétrécissement aortique</h2>
<p>La chaîne causale suit cinq étapes : <b>atteinte des cuspides → obstacle à l’éjection → surcharge de pression du ventricule gauche → hypertrophie compensatrice → ischémie, dysfonction diastolique puis systolique.</b> Chaque étape explique un symptôme ou un signe.</p>
<h3>3.1 La calcification valvulaire est un processus actif</h3>
<p>Le RA calcifié n’est pas une simple « usure ». Il ressemble, dans ses premières étapes, à l’athérosclérose. Une lésion de l’endothélium valvulaire, du côté aortique où la contrainte mécanique est maximale, laisse pénétrer les lipoprotéines. La lipoprotéine(a), ou Lp(a), transporte des phospholipides oxydés qui déclenchent une inflammation. Les cellules interstitielles valvulaires se transforment ensuite en cellules de type ostéoblastique et produisent de véritables nodules calcifiés. C’est la <button class="w" data-k="i35-calcif">calcification valvulaire active (phase d’initiation, phase de propagation)</button>.</p>
<div class="key"><b>Corrélation biologie → thérapeutique.</b> Les statines réduisent le cholestérol LDL mais n’ont pas ralenti la progression du RA dans trois essais randomisés (SALTIRE, SEAS, ASTRONOMER). Une fois la calcification installée, elle entretient sa propre progression, indépendamment des lipides. Les statines restent indiquées pour le risque cardiovasculaire global, pas pour la valve. La <button class="w" data-k="i35-lpa">Lp(a) (facteur de risque génétique du RA)</button> est une cible en cours d’évaluation.</div>
<h3>3.2 La progression est prévisible en moyenne, variable individuellement</h3>
<p>Une fois le RA modéré constitué, la Vmax augmente en moyenne d’environ 0,3 m/s par an, le gradient moyen d’environ 7 mmHg par an, et la surface diminue d’environ 0,1 cm² par an. La progression est plus rapide si la valve est très calcifiée, chez le sujet âgé, en insuffisance rénale chronique et chez le dialysé. Elle s’accélère aussi avec la sévérité, car une valve rigide subit des contraintes mécaniques plus fortes, qui entretiennent la calcification ; dans l’insuffisance rénale, les troubles phosphocalciques favorisent en outre la minéralisation. C’est la raison d’un suivi échocardiographique régulier.</p>
<h3>3.3 L’adaptation ventriculaire gauche</h3>
<p>Pour éjecter à travers un orifice rétréci, le ventricule gauche doit produire une pression systolique supérieure à celle de l’aorte : la différence est le gradient. Selon la <button class="w" data-k="laplace">loi de Laplace (contrainte pariétale)</button>, la contrainte sur la paroi augmente avec la pression. Le ventricule la normalise en épaississant sa paroi : c’est l’<button class="w" data-k="i35-hvg">hypertrophie concentrique (compensation puis fibrose)</button>. Cette hypertrophie préserve longtemps la FEVG, mais elle rigidifie le ventricule et augmente ses besoins en oxygène.</p>
<h3>3.4 Les trois symptômes cardinaux et leur mécanisme</h3>
<ul><li><b>Dyspnée d’effort</b> : le ventricule hypertrophié est rigide ; à l’effort, la pression télédiastolique s’élève et se transmet aux capillaires pulmonaires. Plus tard, la FEVG baisse.</li>
<li><b>Angor</b> : les besoins en oxygène du myocarde hypertrophié augmentent, tandis que la réserve coronaire diminue. Le sous-endocarde est comprimé par des pressions intraventriculaires élevées. L’<button class="w" data-k="i35-ischemie">angor du RA (ischémie sans sténose coronaire)</button> survient donc même avec des coronaires normales.</li>
<li><b>Syncope d’effort</b> : à l’effort, les muscles dilatent leurs artérioles ; le débit cardiaque devrait augmenter, mais l’orifice rétréci le limite. La pression artérielle chute. Un réflexe ventriculaire inapproprié et des arythmies peuvent s’y ajouter : c’est la <button class="w" data-k="i35-syncope">syncope d’effort du RA (débit fixe et réflexe ventriculaire)</button>.</li></ul>

<h3>3.5 La phase de décompensation</h3>
<p>Lorsque l’hypertrophie ne suffit plus, la fibrose myocardique s’étend et la FEVG baisse. Le débit chute, le gradient diminue alors qu’il reste un rétrécissement serré : c’est le <button class="w" data-k="i35-lflg-class">RA à bas débit et bas gradient à FEVG réduite (forme classique)</button>. Il existe aussi une forme à FEVG préservée, chez un sujet âgé dont le petit ventricule hypertrophié éjecte peu : le <button class="w" data-k="i35-lflg-parad">RA à bas débit et bas gradient paradoxal (FEVG préservée)</button>. Ces deux formes sont des pièges diagnostiques majeurs.</p>
<div class="key"><b>Corrélation physiologie → pronostic.</b> Dans l’étude classique de Ross et Braunwald (1968), la survie médiane après l’apparition des symptômes était d’environ cinq ans après un angor, trois ans après une syncope et deux ans après une insuffisance cardiaque. Le <button class="w" data-k="i35-mnemo-532">repère 5-3-2 (survie selon le symptôme)</button> rappelle que l’apparition d’un symptôme change le pronostic.</div>
<p>Une conséquence extracardiaque mérite d’être connue : le flux turbulent à travers la valve étire et détruit les grands multimères du facteur von Willebrand. Il en résulte des saignements digestifs sur angiodysplasies, qui disparaissent souvent après le remplacement valvulaire : c’est le <button class="w" data-k="i35-heyde">syndrome de Heyde (RA, angiodysplasies, déficit acquis en facteur von Willebrand)</button>.</p>

<section class="ilot" id="i35-4"><h2><span class="n">4</span>Physiopathologie de l’insuffisance aortique</h2>
<p>La chaîne causale diffère selon la vitesse d’installation. Dans l’IA chronique : <b>fuite diastolique → surcharge de volume et de pression → dilatation et hypertrophie excentrique → longue phase asymptomatique → dysfonction ventriculaire, parfois irréversible.</b> Dans l’IA aiguë : <b>fuite brutale dans un ventricule non préparé → élévation brutale de la pression télédiastolique → œdème pulmonaire et bas débit.</b></p>
<h3>4.1 L’insuffisance aortique chronique : une double surcharge</h3>
<p>À chaque diastole, le volume régurgité revient dans le ventricule gauche. Celui-ci doit éjecter à la systole suivante le débit utile plus le volume régurgité : son volume d’éjection total augmente. Le ventricule se dilate progressivement, ce qui lui permet de loger ce volume sans que la pression de remplissage s’élève. C’est l’<button class="w" data-k="i35-ia-chron">hypertrophie excentrique de l’IA chronique (dilatation compensée)</button>.</p>
<p>L’IA impose aussi une surcharge de pression, ce qui la distingue de l’insuffisance mitrale. Le grand volume éjecté dans l’aorte élève la pression systolique, et le ventricule dilaté subit, selon la loi de Laplace, une contrainte pariétale accrue. La paroi s’épaissit donc aussi. Le ventricule d’une IA sévère ancienne est à la fois très dilaté et hypertrophié.</p>
<h3>4.2 Les conséquences sur la pression artérielle</h3>
<p>La pression systolique s’élève par le volume éjecté ; la pression diastolique s’abaisse, car le sang reflue vers le ventricule pendant la diastole. La <button class="w" data-k="i35-e-pp">pression pulsée élargie (pression systolique moins diastolique)</button> est le signe physiologique central de l’IA chronique sévère. Elle produit tous les <button class="w" data-k="i35-e-periph">signes périphériques de l’IA (Corrigan, de Musset, Quincke, Duroziez, Traube)</button>.</p>
<div class="key"><b>Corrélation physiologie → clinique → thérapeutique.</b> La perfusion coronaire se fait en diastole et dépend de la pression diastolique aortique. Dans l’IA sévère, cette pression est basse : un angor peut survenir, notamment la nuit, lorsque la fréquence ralentit et que la diastole s’allonge. Pour la même raison, un traitement bradycardisant prolonge la diastole et augmente le volume régurgité par battement : les bêtabloquants sont à éviter dans l’IA sévère non opérée, sauf indication propre, et contre-indiqués dans l’IA aiguë.</div>
<h3>4.3 La phase asymptomatique et le risque d’irréversibilité</h3>
<p>Le patient reste longtemps asymptomatique, parfois pendant des décennies. Pendant ce temps, la fibrose interstitielle progresse. Lorsque les symptômes apparaissent, la dysfonction ventriculaire peut déjà être en partie irréversible. C’est pourquoi l’indication opératoire de l’IA asymptomatique repose sur des <b>seuils de diamètre, de volume et de FEVG</b>, et non sur l’attente des symptômes.</p>
<h3>4.4 L’insuffisance aortique aiguë</h3>
<p>Le ventricule gauche, de taille normale, n’a pas eu le temps de se dilater. Le volume régurgité fait monter sa pression télédiastolique de façon brutale, jusqu’à égaler la pression diastolique aortique. La valve mitrale se ferme prématurément, la pression capillaire pulmonaire s’élève, et un œdème pulmonaire apparaît. Le débit utile chute ; la tachycardie compensatrice raccourcit la diastole et limite la fuite. La pression pulsée n’est <b>pas</b> élargie, car le ventricule non dilaté ne peut pas augmenter son volume d’éjection et la vasoconstriction réflexe soutient la pression diastolique. Le souffle est bref et doux, car la pression ventriculaire rejoint vite la pression aortique et annule le gradient diastolique : l’examen clinique sous-estime la gravité.</p>

<section class="ilot" id="i35-5"><h2><span class="n">5</span>Étiologies</h2>
<p>La cause oriente le pronostic, le choix technique (réparation ou remplacement, TAVI possible ou non) et le dépistage familial. Pour l’IA, la première question est anatomique : <b>la fuite vient-elle des cuspides ou de la racine aortique ?</b></p>
<div class="two">
<div class="card"><h4>Rétrécissement aortique</h4><p><b>Calcifié dégénératif</b> sur valve tricuspide : sujet de plus de 65 à 70 ans, facteurs de risque cardiovasculaire, insuffisance rénale. <b>Sur bicuspidie</b> : calcification plus précoce, souvent entre 50 et 70 ans. <b>Rhumatismal</b> : fusion des commissures, atteinte mitrale associée, sujet plus jeune originaire d’une région d’endémie. Rares : RA post-radique (radiothérapie médiastinale), maladies métaboliques.</p></div>
<div class="card"><h4>Obstacles non valvulaires à distinguer</h4><p>Rétrécissement <b>sous-valvulaire</b> (membrane fibreuse, bourrelet septal) ; rétrécissement <b>supravalvulaire</b> (syndrome de Williams-Beuren) ; obstruction dynamique de la cardiomyopathie hypertrophique. Ils donnent un souffle éjectionnel comparable, mais une valve mobile à l’échocardiographie.</p></div>
<div class="card"><h4>Insuffisance aortique par atteinte des cuspides</h4><p>Bicuspidie (prolapsus de la cuspide fusionnée) ; séquelle d’<b>endocardite</b> (perforation) ; atteinte rhumatismale (rétraction) ; atteinte dégénérative calcifiée ; post-radique ; maladies inflammatoires (polyarthrite rhumatoïde, lupus) ; anciens anorexigènes (fenfluramine, benfluorex) et agonistes dopaminergiques ergotés (pergolide, cabergoline). Ces molécules ou leurs métabolites stimulent les récepteurs de la sérotonine de type 2B des cellules interstitielles valvulaires, qui prolifèrent et forment des plaques fibreuses rétractant les cuspides.</p></div>
<div class="card"><h4>Insuffisance aortique par atteinte de la racine</h4><p>Dilatation liée à l’âge et à l’hypertension ; <button class="w" data-k="i35-aortopathie">aortopathie de la bicuspidie (phénotypes racine et tubulaire)</button> ; maladies héréditaires du tissu conjonctif (<button class="w" data-k="i35-marfan">syndrome de Marfan et apparentés (gènes, seuils)</button>) ; aortites (Takayasu, artérite à cellules géantes, syphilis tertiaire) ; spondylarthrite ankylosante ; dissection aortique. Quand la racine se dilate, l’élargissement de la jonction sinotubulaire écarte les commissures : les cuspides, de taille inchangée, ne se rejoignent plus au centre et laissent une fuite centrale.</p></div></div>
<h3>5.1 Causes de l’insuffisance aortique aiguë</h3>
<p>Trois causes dominent : l’<b>endocardite infectieuse</b> (perforation ou déchirure d’une cuspide), la <b>dissection aortique de type A</b> (désinsertion commissurale) et le <b>traumatisme thoracique</b> fermé. S’y ajoutent les complications iatrogènes : fuite après valvuloplastie par ballonnet ou TAVI, dysfonction de prothèse.</p>
<h3>5.2 Le rétrécissement aortique rhumatismal</h3>
<p>Le <button class="w" data-k="i35-rhumat">rhumatisme articulaire aigu (réaction croisée après angine streptococcique)</button> atteint la valve aortique après la valve mitrale. Les commissures fusionnent, les bords libres se rétractent : la lésion associe souvent rétrécissement et fuite. Le diagnostic est évoqué devant l’origine géographique, un antécédent de rhumatisme articulaire aigu et une atteinte mitrale associée. La prévention secondaire par pénicilline concerne surtout l’enfant et l’adulte jeune, car les angines streptococciques, donc les récidives de rhumatisme qui aggravent les lésions, y sont les plus fréquentes. Elle dure au moins dix ans et se prolonge à l’âge adulte selon la sévérité de l’atteinte et l’exposition au streptocoque.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Opérer une IA sur racine dilatée sans rechercher une maladie héréditaire du tissu conjonctif. Chez un patient jeune, grand, avec une ectopie du cristallin, une histoire familiale de dissection ou de mort subite, il faut chercher un syndrome de Marfan ou de Loeys-Dietz : les seuils opératoires aortiques sont plus bas, car une paroi génétiquement fragile expose davantage à la dissection à diamètre égal. Le traitement médical diffère, et les apparentés doivent être dépistés, car ces maladies se transmettent le plus souvent sur le mode autosomique dominant.</div>
</section>

<section class="ilot" id="i35-6"><h2><span class="n">6</span>Bicuspidie et aortopathie</h2>
<p>La valve aortique bicuspide n’est pas seulement une valve anormale : c’est une <b>maladie de la valve et de l’aorte</b>. Le médecin assistant doit donc, devant toute bicuspidie, évaluer trois éléments : la fonction valvulaire, le diamètre de l’aorte à plusieurs niveaux et l’existence d’une coarctation.</p>
<h3>6.1 Anatomie et classification</h3>
<p>Dans la forme la plus fréquente, deux cuspides sont fusionnées le long d’un <b>raphé</b>. La fusion concerne le plus souvent les cuspides coronaires droite et gauche, moins souvent la droite et la non coronaire. La <button class="w" data-k="i35-sievers">classification de Sievers (nombre de raphés, orientation)</button> décrit ces variantes. L’orifice prend en systole une forme ovalaire « en boutonnière » au lieu d’un triangle.</p>
<h3>6.2 Évolution valvulaire</h3>
<p>Le flux turbulent et l’asymétrie des contraintes accélèrent la calcification. L’évolution habituelle est un RA vers 50 à 70 ans. Une IA peut survenir plus tôt, par prolapsus de la cuspide fusionnée ou par dilatation de la racine. La bicuspidie expose aussi à l’endocardite infectieuse, car le flux turbulent lèse l’endothélium des cuspides et y favorise l’adhésion des bactéries. Elle ne justifie pas pour autant d’antibioprophylaxie, réservée aux patients à haut risque, chez qui l’endocardite est la plus fréquente et la plus grave : porteurs d’une prothèse valvulaire, chirurgicale ou percutanée, ou d’un antécédent d’endocardite.</p>
<h3>6.3 L’aortopathie</h3>
<p>Environ la moitié des porteurs d’une bicuspidie ont une dilatation de l’aorte ascendante. Deux mécanismes s’associent : une fragilité intrinsèque de la média, d’origine génétique, et un flux excentrique qui frappe la paroi. On distingue deux phénotypes.</p>
<div class="two">
<div class="card"><h4>Phénotype tubulaire (le plus fréquent)</h4><p>Dilatation de l’aorte ascendante au-dessus de la jonction sinotubulaire, souvent associée à un RA. Le flux excentrique joue un rôle important.</p></div>
<div class="card"><h4>Phénotype racine</h4><p>Dilatation des sinus de Valsalva, souvent chez l’homme jeune avec une IA. Il traduit une fragilité génétique plus marquée, expose davantage à la dissection et justifie un seuil opératoire plus bas.</p></div></div>
<h3>6.4 Associations et dépistage</h3>
<p>La bicuspidie s’associe à la <b>coarctation de l’aorte</b>, au <b>syndrome de Turner</b> (environ 30 % des patientes) et à des anomalies des artères coronaires. Le risque de dissection est plus élevé que dans la population générale, mais reste faible en valeur absolue en l’absence de grande dilatation. Dans une cohorte de population, l’incidence était de 3,1 dissections pour 10 000 années-patients, huit fois celle de la population du même âge, et de 44,9 pour 10 000 en présence d’un anévrisme initial. La transmission est familiale dans une partie des cas ; un dépistage échocardiographique des apparentés au premier degré est proposé, surtout en cas d’aortopathie ou de phénotype racine, car environ 10 % d’entre eux ont une aorte dilatée.</p>
<p>Les <button class="w" data-k="i35-seuils-aorte">seuils d’intervention sur l’aorte (ESC 2024)</button> sont traités à l’îlot 11. Retenir ici un principe : si le patient est opéré de sa valve, l’aorte ascendante est remplacée à un seuil plus bas (≥ 45 mm), afin d’éviter une seconde sternotomie.</p>
<div class="trap"><span class="k">Piège</span>Mesurer l’aorte seulement à la racine. L’échocardiographie transthoracique voit mal l’aorte tubulaire au-delà de 4 à 5 cm de la valve. Une aorte « normale » à la racine peut coexister avec une aorte ascendante de 52 mm. Au diagnostic de bicuspidie, l’aorte thoracique doit être évaluée dans toute sa longueur, par tomodensitométrie ou IRM si l’échocardiographie est incomplète.</div>
