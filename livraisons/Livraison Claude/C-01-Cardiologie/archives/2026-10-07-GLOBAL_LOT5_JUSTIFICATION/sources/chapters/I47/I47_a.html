<section class="ilot" id="i47-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Une femme de 34 ans arrive aux urgences avec des palpitations régulières et rapides, apparues brutalement en montant un escalier il y a quarante minutes. Sa fréquence est de 190/min, sa pression artérielle de 112/70 mmHg. Trois lits plus loin, un homme de 67 ans, porteur d’un ancien infarctus antérieur, présente une tachycardie à 170/min dont les complexes QRS mesurent 160 ms ; il se dit « juste un peu fatigué ».</p>
<p>Ces deux situations résument le chapitre. La première pose la question : <b>quel circuit entretient cette tachycardie, et comment l’interrompre sans danger ?</b> La seconde pose une question plus grave : <b>s’agit-il d’une tachycardie ventriculaire, et que faire pour prévenir la mort subite ?</b> La tolérance apparente de l’homme ne rassure en rien : une tachycardie ventriculaire <button class="w" data-k="i47-tolerance">peut rester bien tolérée</button> pendant des heures puis dégénérer.</p>
<p>À la fin de ce chapitre, le médecin assistant sait lire pas à pas l’ECG d’une tachycardie, distinguer les mécanismes supraventriculaires entre eux, appliquer une démarche structurée devant un QRS large, conduire la prise en charge aiguë (manœuvres vagales, adénosine, cardioversion), poser les indications d’ablation et de défibrillateur, reconnaître une canalopathie et conseiller le patient sur le sport, la conduite et les médicaments à éviter, selon les recommandations de la Société européenne de cardiologie (ESC 2019 et 2022) et les directives suisses.</p>
<div class="key"><b>Prérequis.</b> Le <button class="w" data-k="i47-pa">potentiel d’action cardiaque (phases 0 à 4 et courants ioniques)</button>, la <button class="w" data-k="i48-noeudav">conduction décrémentielle du nœud auriculoventriculaire (fiche de physiologie nodale)</button> et le <button class="w" data-k="i47-reentree">principe de la réentrée (conditions d’un circuit)</button>. Ces notions sont développées dans l’onglet Sciences fondamentales.</div>
<div class="trap"><span class="k">Renvoi</span>La fibrillation et le flutter auriculaires relèvent du chapitre I48. Ils n’apparaissent ici que dans le diagnostic différentiel, notamment la <button class="w" data-k="i48-preexc">fibrillation auriculaire pré-excitée (fiche du chapitre I48)</button>.</div>
</section>

<section class="ilot" id="i47-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>Une <b>tachycardie</b> est un rythme cardiaque de plus de 100/min. Elle est <b>paroxystique</b> lorsqu’elle commence et s’arrête brutalement, en un seul battement, ce qui la distingue de la tachycardie sinusale, qui accélère et ralentit progressivement. Ce caractère brutal est la marque clinique d’un circuit de réentrée ou d’un foyer qui s’allume et s’éteint. Une seule extrasystole suffit à amorcer un circuit, et un seul influx bloqué suffit à l’interrompre : la fréquence passe en un battement de la valeur sinusale à celle du circuit. La fréquence sinusale suit au contraire le tonus sympathique, qui varie progressivement.</p>
<h3>1.1 Deux étages, deux pronostics</h3>
<p>La <b>tachycardie supraventriculaire (TSV)</b>, au sens de l’ESC 2019, désigne toute tachycardie dont le mécanisme requiert le tissu situé au-dessus de la bifurcation du faisceau de His : oreillettes, nœud auriculoventriculaire, voie accessoire. Par convention, la fibrillation auriculaire est traitée à part (chapitre I48), bien qu’elle soit supraventriculaire. La <b>tachycardie ventriculaire (TV)</b> naît sous la bifurcation du faisceau de His, dans le myocarde ventriculaire ou le réseau de Purkinje. La TSV menace rarement la vie ; la TV, surtout sur cardiopathie, expose à la <b>fibrillation ventriculaire (FV)</b> et à la mort subite. La TSV naît le plus souvent sur un cœur sain, et le nœud auriculoventriculaire, qui conduit d’autant plus lentement que les influx se rapprochent, protège les ventricules d’une fréquence excessive ; la fibrillation auriculaire conduite par une voie accessoire, qui échappe à ce filtre, fait exception. La TV naît au contraire dans un myocarde souvent malade : elle réduit le débit et la perfusion coronaire, et le même substrat peut entretenir une FV.</p>
<h3>1.2 Classification des tachycardies supraventriculaires (ESC 2019)</h3>
<table class="t"><tr><th>Famille</th><th>Entités</th><th>Structure indispensable au circuit</th></tr>
<tr><td>Tachycardies atriales</td><td>Tachycardie sinusale inappropriée ; réentrée sinusale ; tachycardie atriale focale ; tachycardie atriale multifocale ; macroréentrées atriales (dont le flutter, chapitre I48)</td><td>L’oreillette seule : le nœud auriculoventriculaire ne participe pas au circuit</td></tr>
<tr><td>Tachycardies jonctionnelles</td><td><button class="w" data-k="i47-trin">Tachycardie par réentrée intranodale, TRIN (formes typique et atypique)</button> ; tachycardie jonctionnelle ectopique (focale)</td><td>Le nœud auriculoventriculaire et ses voies d’entrée</td></tr>
<tr><td>Tachycardies auriculoventriculaires</td><td><button class="w" data-k="i47-trav">Tachycardie réciproque auriculoventriculaire, TRAV (orthodromique et antidromique)</button> ; tachycardie jonctionnelle réciproque permanente</td><td>Une voie accessoire, en plus du nœud</td></tr></table>
<h3>1.3 Classification des tachycardies ventriculaires (ESC 2022)</h3>
<ul><li><b>Durée</b> : une TV est <b>soutenue</b> si elle dure plus de 30 secondes ou impose une intervention pour instabilité ; elle est <button class="w" data-k="i47-tvns">non soutenue, TVNS (définition et signification pronostique)</button> si elle comporte au moins trois complexes à plus de 100/min et s’arrête spontanément avant 30 secondes.</li>
<li><b>Morphologie</b> : <b>monomorphe</b> si tous les QRS se ressemblent, ce qui signe un circuit fixe, souvent autour d’une cicatrice ; <b>polymorphe</b> si la morphologie change d’un battement à l’autre, ce qui traduit une instabilité électrique (ischémie aiguë, canalopathie). Les <button class="w" data-k="i47-tdp">torsades de pointes (TV polymorphe sur QT long)</button> sont une forme polymorphe particulière, où l’axe des QRS tourne autour de la ligne de base. La TV <b>bidirectionnelle</b>, où l’axe alterne d’un battement à l’autre, s’expliquerait, d’après un modèle expérimental, par deux foyers de post-dépolarisations tardives du réseau de Purkinje qui se déclenchent en alternance. Elle se voit aussi dans le syndrome d’Andersen et Tawil et la myocardite aiguë (ESC 2022), mais évoque d’abord une intoxication digitalique ou une <button class="w" data-k="i47-tvpc">tachycardie ventriculaire polymorphe catécholergique, TVPC (fiche de la maladie)</button>.</li>
<li><b>Substrat</b> : TV sur cardiopathie structurelle (cicatrice d’infarctus, cardiomyopathie) ou TV <b>idiopathique</b>, sur cœur sain.</li></ul>
<h3>1.4 Codage</h3>
<p>La CIM-10 (OMS) distingue I47.0 (arythmie ventriculaire par réentrée), I47.1 (tachycardie supraventriculaire), I47.2 (tachycardie ventriculaire) et I47.9 (tachycardie paroxystique sans précision). Le syndrome de Wolff-Parkinson-White est codé I45.6 (syndrome de pré-excitation), le QT long congénital I45.8 et le syndrome de Brugada I49.8. Ils sont traités ici, car leur expression clinique est une tachycardie.</p>
<div class="trap"><span class="k">Piège</span>Un tracé montrant un PR court et une onde delta chez un sujet asymptomatique correspond à une <b>pré-excitation</b> (aspect de Wolff-Parkinson-White). Le terme de <b>syndrome</b> de Wolff-Parkinson-White est réservé à l’association de cette pré-excitation et d’arythmies. La distinction n’est pas académique : elle conditionne la stratification du risque (îlot 10).</div>
</section>

<section class="ilot" id="i47-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2>
<p>Dans la cohorte américaine de Marshfield, la prévalence des TSV paroxystiques était de 2,25 pour 1 000 habitants et leur incidence de 35 pour 100 000 personnes-années (données reprises par l’ESC 2019). Chez l’adulte, la TRIN est la plus fréquente ; elle touche environ deux femmes pour un homme et débute souvent entre 20 et 50 ans. Les crises varient avec le cycle menstruel et deviennent plus fréquentes pendant la grossesse, ce qui suggère une influence hormonale sur la conduction nodale ; le mécanisme n’est pas établi (ESC 2019). La TRAV prédomine chez l’enfant et l’adolescent, puis sa part diminue. La voie accessoire est congénitale et peut donner des crises dès l’enfance ; avec le temps, la pré-excitation disparaît chez jusqu’à 35 % des porteurs, ce qui contribue probablement à cette baisse, alors que la part de la TRIN et de la tachycardie atriale augmente avec l’âge (ESC 2019). La tachycardie atriale focale représente environ un dixième des TSV adressées pour ablation et devient plus fréquente avec l’âge.</p>
<p>La pré-excitation ventriculaire est visible sur l’ECG de 0,1 à 0,3 % de la population générale. Le risque de mort subite d’un sujet porteur d’une pré-excitation est faible, de l’ordre de quelques cas pour 1 000 patients-années dans les séries publiées, mais la mort subite peut en être la première manifestation, par <button class="w" data-k="i48-preexc">fibrillation auriculaire pré-excitée dégénérant en fibrillation ventriculaire (fiche I48)</button>.</p>
<p>La mort subite cardiaque, définie comme un décès inattendu d’origine cardiaque survenant dans l’heure qui suit les symptômes, ou dans les 24 heures chez un sujet vu en bonne santé, touche environ 50 à 100 personnes pour 100 000 habitants et par an dans les pays industrialisés (estimations reprises par l’ESC 2022). Chez l’adulte de plus de 40 ans, elle résulte surtout d’une TV ou d’une FV sur cardiopathie ischémique. Son incidence croît avec l’âge, d’environ 1 pour 100 000 par an chez l’enfant à 50 entre 40 et 60 ans et à au moins 200 entre 70 et 80 ans, en parallèle de la maladie coronaire, en cause dans jusqu’à 75 à 80 % des morts subites en Occident (ESC 2022). Avant 35 ans, les cardiomyopathies et les canalopathies dominent ; le <button class="w" data-k="i47-qtl">QT long congénital (fréquence, types, déclencheurs)</button> touche environ 1 naissance sur 2 000, le syndrome de Brugada environ 1 personne sur 2 000 à 5 000 selon les régions, avec une prévalence plus élevée en Asie du sud-est qu’en Europe, et la TVPC environ 1 personne sur 10 000.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune statistique consolidée suisse de l’incidence des TSV ou de la répartition des causes de mort subite n’est publiée par l’Office fédéral de la statistique. Le registre suisse des arrêts cardiaques extrahospitaliers documente les arrêts, sans en préciser le mécanisme rythmique. Les chiffres ci-dessus sont américains et européens.</div>

</section>

<section class="ilot" id="i47-3"><h2><span class="n">3</span>Physiopathologie : trois mécanismes, cinq circuits</h2>
<p>Toute tachycardie résulte d’un des trois mécanismes suivants. Les reconnaître permet de prévoir la réponse à l’adénosine, aux manœuvres vagales, à la stimulation et à l’ablation.</p>
<div class="two">
<div class="card"><h4>Réentrée</h4><p>Un influx tourne dans un circuit et réactive sans cesse un tissu redevenu excitable. Début et fin brutaux, déclenchement par une extrasystole, arrêt par une extrasystole ou un bloc transitoire. Mécanisme des TRIN, des TRAV, des flutters et de la plupart des TV sur cicatrice. Voir la <button class="w" data-k="i47-reentree">fiche de la réentrée (trois conditions et exemple)</button>.</p></div>
<div class="card"><h4>Automatisme anormal</h4><p>Des cellules qui ne devraient pas être automatiques dépolarisent spontanément pendant la phase 4. Démarrage progressif (« échauffement ») et fin progressive. Mécanisme de certaines tachycardies atriales focales et jonctionnelles ectopiques. Voir l’<button class="w" data-k="i47-automat">automatisme anormal (mécanisme et indices ECG)</button>.</p></div>
<div class="card"><h4>Activité déclenchée</h4><p>Des oscillations du potentiel membranaire, survenant pendant ou après la repolarisation, atteignent le seuil et déclenchent un nouveau potentiel d’action. Elles naissent d’une surcharge calcique ou d’un allongement de la repolarisation. Mécanisme des TV de la chambre de chasse, des torsades de pointes et de la TVPC. Voir les <button class="w" data-k="i47-declench">post-dépolarisations précoces et tardives (mécanisme ionique)</button>.</p></div>
<div class="card"><h4>Conséquence pratique</h4><p>Une tachycardie qui utilise le nœud auriculoventriculaire dans son circuit s’arrête avec l’adénosine. Une tachycardie qui n’en a pas besoin continue, mais le bloc transitoire démasque parfois l’activité atriale qui la produit.</p></div></div>
<h3>3.1 La tachycardie par réentrée intranodale (TRIN)</h3>
<p>Une dualité nodale fonctionnelle est mise en évidence chez 10 à 35 % des sujets : ils possèdent deux voies d’entrée dans le nœud auriculoventriculaire : une <b>voie rapide</b>, antérieure et supérieure, à période réfractaire longue, et une <b>voie lente</b>, postérieure et inférieure, près de l’ostium du sinus coronaire, à période réfractaire courte. Cette <button class="w" data-k="i47-dualite">dualité nodale (physiologie et mise en évidence)</button> est le plus souvent silencieuse. En rythme sinusal, l’influx descend par la voie rapide. Une extrasystole auriculaire précoce trouve la voie rapide encore réfractaire : elle descend par la voie lente, avec un PR allongé, puis remonte par la voie rapide, qui a eu le temps de récupérer. Le circuit est constitué.</p>
<p>Dans la forme typique, lente-rapide, oreillettes et ventricules sont activés presque simultanément : l’onde P rétrograde est cachée dans le QRS ou déforme sa fin (pseudo-r′ en V1, pseudo-S en inférieur). La <button class="w" data-k="i47-koch">région du triangle de Koch (anatomie de la voie lente)</button> est la cible de l’ablation de la voie lente, qui guérit la TRIN. L’ablation supprime l’un des deux bras indispensables au circuit, tandis que la conduction auriculoventriculaire continue de passer par la voie rapide : le PR reste normal.</p>
<h3>3.2 La tachycardie réciproque auriculoventriculaire (TRAV)</h3>
<p>Une voie accessoire est un faisceau de myocarde ordinaire qui franchit l’anneau fibreux auriculoventriculaire, normalement isolant. Contrairement au nœud, elle ne décrémente pas : sa conduction est rapide et « tout ou rien ». Ses cellules dépolarisent par un courant sodique, comme le myocarde ordinaire : elles conduisent vite tant qu’elles sont excitables, puis plus du tout. Le nœud, dont la dépolarisation est calcique, récupère lentement et conduit d’autant plus lentement que les influx se rapprochent ; quelques voies cachées, comme celle de la tachycardie jonctionnelle réciproque permanente, décrémentent aussi (ESC 2019). Si elle conduit des oreillettes vers les ventricules en rythme sinusal, elle active une partie du ventricule en avance : c’est la <button class="w" data-k="i47-ecg-preexc">pré-excitation (PR court, onde delta, localisation)</button>. Si elle ne conduit que dans le sens rétrograde, elle est dite <b>cachée</b> : l’ECG de base est normal, mais la tachycardie est possible. Environ la moitié des voies accessoires sont cachées, contre 10 % qui ne conduisent que vers les ventricules (ESC 2019). Une voie cachée n’expose pas à la mort subite, car elle ne peut pas transmettre aux ventricules une fibrillation auriculaire.</p>
<ul><li><b>TRAV orthodromique</b> (environ 90 % des TRAV) : descente par le nœud et le faisceau de His, remontée par la voie accessoire. Le QRS est fin (sauf bloc de branche). L’oreillette est activée après le ventricule, via la voie accessoire : la P rétrograde tombe dans le segment ST, à distance du QRS.</li>
<li><b>TRAV antidromique</b> : descente par la voie accessoire, remontée par le nœud. Le QRS est large, entièrement pré-excité, et ressemble à une TV.</li></ul>
<div class="key"><b>Corrélation physiologie → thérapeutique.</b> Le nœud auriculoventriculaire est un maillon obligatoire de la TRIN et des deux formes de TRAV. Le bloquer, même quelques secondes, rompt le circuit : c’est le principe des manœuvres vagales, de l’adénosine, du vérapamil et des bêtabloquants. À l’inverse, dans une <b>fibrillation auriculaire pré-excitée</b>, le nœud n’est pas dans un circuit ; il protège les ventricules. Le bloquer oriente toutes les impulsions vers la voie accessoire, qui ne décrémente pas, et peut provoquer une fibrillation ventriculaire.</div>

<h3>3.3 La tachycardie atriale focale</h3>
<p>Un petit foyer atrial, souvent situé sur la crista terminalis, les anneaux valvulaires, les ostiums des veines pulmonaires ou l’auricule, décharge plus vite que le nœud sinusal par automatisme, activité déclenchée ou microréentrée. L’oreillette est activée depuis ce point : l’onde P a une morphologie différente de la P sinusale, précède le QRS et est séparée du QRS précédent par un intervalle long (RP long). Le nœud n’est pas indispensable : un bloc auriculoventriculaire peut survenir sans arrêter la tachycardie.</p>
<h3>3.4 La tachycardie ventriculaire sur cicatrice</h3>
<p>Après un infarctus, la cicatrice n’est pas homogène. Des faisceaux de myocytes survivants, entourés de fibrose, forment des couloirs de conduction lente. Ces <button class="w" data-k="i47-cicatrice">isthmes de la cicatrice (substrat de la TV monomorphe)</button> fournissent les trois conditions de la réentrée : obstacle, bloc unidirectionnel, conduction lente. Le circuit étant fixe, chaque QRS a la même morphologie : TV monomorphe. Le risque persiste toute la vie, même des décennies après l’infarctus.</p>
<h3>3.5 Les TV idiopathiques et les TV polymorphes</h3>
<p>Sur cœur sain, deux formes dominent. La <b>TV de la chambre de chasse</b> (surtout du ventricule droit) relève d’une activité déclenchée dépendante de l’AMPc : elle survient à l’effort ou au stress, et s’arrête parfois avec l’adénosine ou un bêtabloquant. Les catécholamines élèvent l’AMPc des myocytes, qui surchargent alors leur réticulum en calcium et produisent des post-dépolarisations tardives. L’adénosine et les manœuvres vagales abaissent l’AMPc ; le vérapamil et les bêtabloquants réduisent le courant calcique ou son activation : tous peuvent arrêter cette TV, alors que l’adénosine reste sans effet sur une TV par réentrée sur cicatrice (Lerman et al., 1986). La <b>TV fasciculaire</b> est une réentrée impliquant le fascicule postérieur gauche ; elle est sensible au vérapamil. Son circuit emprunte un tissu de Purkinje anormal, à conduction lente et décrémentielle, que le vérapamil bloque ; ce tissu est aussi la cible de l’ablation (ESC 2022). La <b>TV polymorphe</b> sur QT normal est typiquement ischémique : l’ischémie aiguë dépolarise les myocytes, ralentit leur conduction et raccourcit inégalement leur repolarisation, ce qui crée des réentrées instables dont le trajet change, d’où un QRS qui varie à chaque battement ; sur QT long, elle prend la forme de torsades de pointes, favorisées par la <button class="w" data-k="i47-repol">réserve de repolarisation diminuée (mécanisme des torsades)</button>.</p>
<div class="key"><b>Corrélation biophysique → clinique.</b> Les torsades de pointes suivent typiquement une séquence « court-long-court » : une extrasystole, puis une pause compensatrice, puis un battement dont le QT, allongé par la pause, porte la post-dépolarisation précoce qui déclenche la torsade. Cette dépendance à la pause explique pourquoi accélérer la fréquence (isoprénaline, stimulation) les prévient.</div>
<button class="pareto-btn ui" data-k="pareto-i47-physio">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="i47-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La première question étiologique n’est pas « quelle maladie ? », mais « <b>le cœur est-il structurellement sain ?</b> ». Une TSV sur cœur sain relève d’un traitement curatif et d’un pronostic excellent. Une TV sur cardiopathie relève d’une stratification du risque de mort subite.</p>
<div class="two">
<div class="card"><h4>Terrains des TSV</h4><p>Cœur le plus souvent sain. Voie accessoire congénitale, parfois associée à la maladie d’Ebstein (voies multiples) ou à une cardiomyopathie liée à <i>PRKAG2</i> (pré-excitation et hypertrophie). Dans la maladie d’Ebstein, l’anneau tricuspide est malformé, et les voies accessoires, droites, sont multiples chez jusqu’à 50 % des patients (ESC 2019). Dans la maladie liée à <i>PRKAG2</i>, des myocytes gorgés de glycogène traversent l’anneau fibreux qui isole normalement oreillettes et ventricules, et la même surcharge épaissit la paroi (Arad et al., 2003). Tachycardie atriale : cardiopathie congénitale opérée (cicatrices d’atriotomie, macroréentrées), valvulopathie, bronchopneumopathie, intoxication digitalique (tachycardie atriale avec bloc). Les cicatrices et la fibrose créent des obstacles et des zones de conduction lente propices aux macroréentrées ; l’hypoxémie, la théophylline et l’hypomagnésémie de la bronchopneumopathie favorisent les foyers ectopiques ; la digoxine provoque des post-dépolarisations tardives dans l’oreillette tout en ralentissant le nœud, d’où la tachycardie avec bloc.</p></div>
<div class="card"><h4>Substrats des TV monomorphes</h4><p>Cicatrice d’infarctus (première cause) ; <button class="w" data-k="i42-dai">cardiomyopathies (dilatée, arythmogène, sarcoïdose ; indications du DAI, fiche du chapitre I42)</button> ; myocardite ; cardiopathies congénitales opérées (tétralogie de Fallot) ; maladie de Chagas chez les patients venant d’Amérique latine. Toutes laissent une fibrose ou une cicatrice chirurgicale qui crée, comme l’infarctus, des couloirs de conduction lente. Dans la maladie de Chagas, la cardiomyopathie apparaît chez 20 à 30 % des personnes infectées, des années ou des décennies après l’infection, et la mort subite y est la première cause de décès (ESC 2022). Idiopathiques sur cœur sain : chambre de chasse, fasciculaire.</p></div>
<div class="card"><h4>Causes des TV polymorphes et de la FV</h4><p>Ischémie aiguë (première cause) ; canalopathies (QT long, Brugada, TVPC, QT court, repolarisation précoce maligne, FV idiopathique) ; cardiomyopathie hypertrophique ; commotio cordis (choc thoracique sur l’onde T). Dans un modèle animal, un choc précordial de faible énergie ne déclenchait une FV que s’il survenait 15 à 30 ms avant le sommet de l’onde T, pendant la période vulnérable où la repolarisation est hétérogène (Link et al., 1998).</p></div>
<div class="card"><h4>Causes acquises des torsades de pointes</h4><p><button class="w" data-k="i47-credible">Médicaments allongeant le QT (classement CredibleMeds)</button> ; hypokaliémie, hypomagnésémie, hypocalcémie ; bradycardie, bloc auriculoventriculaire complet ; <button class="w" data-k="i47-repol">sexe féminin, âge, insuffisance rénale ou hépatique</button> ; anorexie mentale.</p></div></div>
<h3>4.1 Facteurs déclenchants à rechercher</h3>
<p>Les TSV sont déclenchées par une extrasystole : effort, changement de position, stress, déglutition. L’hyperthyroïdie, l’alcool, la cocaïne et les amphétamines abaissent le seuil de toutes les arythmies. L’hyperthyroïdie, les amphétamines et la cocaïne renforcent l’effet des catécholamines, qui multiplient les extrasystoles déclenchantes ; la cocaïne bloque aussi le canal sodique et ralentit la conduction (Bruccoleri et Burns, 2016). Pour la TV, il faut penser d’abord à une <b>ischémie aiguë</b>, à une dyskaliémie, à un médicament proarythmique (antiarythmique de classe Ic sur cicatrice, digoxine) et à une aggravation de l’insuffisance cardiaque. Sur une cicatrice, un bloqueur sodique ralentit encore une conduction déjà lente et peut faciliter la réentrée : après infarctus, la flécaïnide et l’encaïnide ont causé 43 décès rythmiques contre 16 sous placebo, sans que le mécanisme ait été démontré (Echt et al., 1991).</p>
<div class="trap"><span class="k">Erreur fréquente</span>Attribuer une TV monomorphe soutenue à une « ischémie » et se contenter d’une coronarographie. Une TV monomorphe est le plus souvent une réentrée sur cicatrice ancienne ; la revascularisation ne supprime pas le circuit. L’ischémie aiguë produit plutôt des TV polymorphes et des FV. Une TV monomorphe soutenue impose donc <button class="w" data-k="i47-bilan-tv">une évaluation du substrat</button> (échocardiographie, IRM) et, en règle, un défibrillateur ou une ablation.</div>
<button class="pareto-btn ui" data-k="pareto-i47-etio">▲ Loi de Pareto — Étiologies et facteurs de risque</button>
</section>

<section class="ilot" id="i47-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>La plupart des patients consultent hors crise, avec un ECG normal. L’anamnèse devient alors l’outil diagnostique principal. Elle suit l’ordre : terrain et antécédents, puis symptômes, puis description précise des crises.</p>
<h3>5.1 Antécédents à rechercher</h3>
<div class="two">
<ul><li><button class="w" data-k="i47-atcd-card">Cardiopathie connue (infarctus, cardiomyopathie, chirurgie cardiaque)</button></li><li>Crises similaires depuis l’enfance ou l’adolescence : une histoire aussi longue indique une réentrée (TRIN, TRAV) plutôt qu’une tachycardie atriale (ESC 2019)</li><li>ECG antérieurs (pré-excitation, QT, aspect de Brugada), car ces aspects peuvent être intermittents et absents le jour de la consultation</li><li>Hyperthyroïdie, troubles électrolytiques, anorexie</li></ul>
<ul><li><button class="w" data-k="i47-atcd-fam">Mort subite ou noyade inexpliquée dans la famille (questions ciblées)</button></li><li><button class="w" data-k="i47-atcd-medic">Médicaments et substances (allongement du QT, stimulants)</button></li><li><button class="w" data-k="i47-qtl">Surdité congénitale</button> (syndrome de Jervell et Lange-Nielsen)</li><li>Sport de compétition, profession à risque (pilote, chauffeur), qui imposent de stratifier par EEP une pré-excitation même asymptomatique (ESC 2019)</li></ul></div>
<h3>5.2 Symptômes par ordre de fréquence</h3>
<div class="two">
<ul><li><button class="w" data-k="i47-s-palp">Palpitations régulières à début et fin brusques (caractérisation)</button></li><li><button class="w" data-k="i47-s-cou">Battements dans le cou (signe de la grenouille)</button></li><li>Dyspnée, oppression thoracique, anxiété</li></ul>
<ul><li><button class="w" data-k="i47-s-polyurie">Polyurie après la crise (mécanisme)</button></li><li><button class="w" data-k="i47-s-syncope">Syncope et lipothymie (signaux d’alarme)</button></li><li><button class="w" data-k="i47-s-trig">Déclencheurs et manœuvres d’arrêt spontanées (valeur diagnostique)</button></li></ul></div>
<p>Le patient reconnaît souvent sa tachycardie au premier battement et sait qu’elle s’arrête d’un coup. Il a parfois découvert seul qu’une inspiration bloquée, la toux ou un verre d’eau froide l’interrompt : ces manœuvres agissent par le tonus vagal, donc sur le nœud, et orientent vers une TRIN ou une TRAV. À l’inverse, une accélération et un ralentissement progressifs évoquent une tachycardie sinusale ou une tachycardie atriale automatique. La fréquence suit alors le tonus sympathique ou la pente de dépolarisation spontanée du foyer, qui varient graduellement (ESC 2019).</p>
<h3>5.3 Formes typiques et atypiques</h3>
<div class="two">
<div class="card"><h4>Forme typique de TSV</h4><p>Femme de 38 ans. Depuis l’âge de 20 ans, crises de palpitations rapides et régulières de quelques minutes à une heure, commençant en se penchant, avec battements dans le cou et envie d’uriner après la crise. ECG intercritique normal. Tableau typique de TRIN.</p></div>
<div class="card"><h4>Forme atypique de TSV</h4><p>Homme de 72 ans, « crises d’angoisse » avec oppression thoracique, adressé en psychiatrie. La montre connectée enregistre une tachycardie régulière à 160/min. Chez le sujet âgé, la TSV se présente souvent par <button class="w" data-k="i47-tolerance">une dyspnée, une douleur thoracique</button> ou un malaise plutôt que par des palpitations.</p></div>
<div class="card"><h4>Forme trompeuse de TV</h4><p>Homme de 67 ans, infarctus antérieur ancien, fatigue et dyspnée depuis deux jours, pression artérielle conservée. Tachycardie régulière à 150/min, QRS 160 ms. La bonne tolérance fait évoquer à tort une TSV avec bloc de branche.</p></div>
<div class="card"><h4>Forme de canalopathie</h4><p>Adolescente de 15 ans, syncope en plongeant dans une piscine, puis perte de connaissance brève lors de la sonnerie du réveil quelques mois plus tard. Deux syncopes sur un déclencheur adrénergique : QT long congénital à évoquer, non une « syncope vagale ». Une syncope réflexe survient surtout debout, après des prodromes ; le plongeon et la sonnerie brusque provoquent au contraire une décharge adrénergique soudaine, qui déclenche des torsades quand la repolarisation est déjà fragile (Schwartz et al., 2001).</p></div></div>
<div class="trap"><span class="k">Piège</span>Un tableau de « crise de panique » récidivante peut cacher une TSV. Les critères qui orientent vers l’arythmie : début et fin brutaux en un battement, fréquence régulière supérieure à 150/min mesurée, polyurie après la crise, arrêt par une manœuvre vagale. L’anxiété produit une tachycardie sinusale, qui accélère et ralentit progressivement et ne s’arrête pas d’un coup sous manœuvre vagale. Un enregistrement pendant la crise tranche.</div>
</section>

<section class="ilot" id="i47-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen répond à trois questions : le patient est-il <b>instable</b>, existe-t-il une <b>cardiopathie</b>, et l’examen apporte-t-il un indice du <b>mécanisme</b> ? En crise, il ne doit jamais retarder l’ECG à 12 dérivations ni un choc électrique si le patient est instable. Le tracé de la crise est irremplaçable, car la tachycardie peut s’arrêter à tout moment, et chaque minute de bas débit prolonge l’hypoperfusion des organes.</p>
<h3>6.1 État général, signes vitaux, anthropométrie</h3>
<p>Conscience, sueurs, marbrures, dyspnée. <button class="w" data-k="i47-v-vitaux">Signes vitaux en tachycardie (fréquence, pression artérielle, saturation, critères d’instabilité)</button>. Poids et taille pour les doses d’antiarythmiques (flécaïnide, amiodarone) et l’évaluation d’une anorexie mentale chez une patiente sous médicament allongeant le QT. La dénutrition expose à l’hypokaliémie, à l’hypomagnésémie et à la bradycardie, qui réduisent toutes la réserve de repolarisation (Drew et al., 2010).</p>
<h3>6.2 Signes ciblés</h3>
<div class="two">
<div><b>Pendant la crise : indices du mécanisme</b><ul><li><button class="w" data-k="i47-e-canon">Ondes a en canon jugulaires (régulières ou irrégulières)</button></li><li><button class="w" data-k="i47-e-b1">Intensité variable de B1 et de la pression systolique (dissociation)</button></li><li><button class="w" data-k="i47-vagal">Réponse aux manœuvres vagales (arrêt, ralentissement, absence d’effet)</button></li></ul></div>
<div><b>Retentissement</b><ul><li>Hypotension, <button class="w" data-k="i47-tolerance">pression différentielle pincée</button>, extrémités froides</li><li>Crépitants, turgescence jugulaire (insuffisance cardiaque)</li><li>Confusion, oligurie (bas débit)</li><li>Douleur thoracique (ischémie fonctionnelle ou syndrome coronarien)</li></ul></div>
<div><b>Hors crise : recherche de cardiopathie</b><ul><li><button class="w" data-k="i47-e-card">Signes de cardiopathie structurelle (souffle, B3, cicatrice)</button></li><li>Souffle de cardiomyopathie hypertrophique, maladie dont la fibrose et la désorganisation des myocytes exposent à la TV et à la FV</li><li>Signes d’hyperthyroïdie</li><li>Cicatrice de sternotomie ou de thoracotomie, témoin d’une chirurgie qui a pu laisser des cicatrices auriculaires ou ventriculaires propices à la réentrée</li></ul></div>
<div><b>Indices de canalopathie ou de syndrome</b><ul><li>Surdité (Jervell et Lange-Nielsen)</li><li>Paralysies périodiques, dysmorphie (syndrome d’Andersen et Tawil) : le canal Kir2.1 en cause agit aussi dans le muscle squelettique et le développement</li><li>Fièvre récente (<button class="w" data-k="i47-ecg-brug">démasque un Brugada</button>)</li><li>Palpitations et hypertrophie (<i>PRKAG2</i>, maladie de Fabry), maladies de surcharge qui associent épaississement du myocarde et pré-excitation (ESC 2019)</li></ul></div></div>
<div class="key"><b>Corrélation physiologie → clinique.</b> Dans la TV, oreillettes et ventricules battent indépendamment : c’est la dissociation auriculoventriculaire. De temps à autre, l’oreillette se contracte contre une valve tricuspide fermée ; l’onde a jugulaire devient géante, de façon irrégulière. De même, le remplissage ventriculaire varie d’un battement à l’autre : B1 et la pression systolique varient. Dans la TRIN, oreillettes et ventricules se contractent en même temps à chaque battement : les ondes a en canon sont <b>régulières</b>, visibles comme des battements cervicaux rapides.</div>
<div class="trap"><span class="k">Piège</span>Une bonne tolérance hémodynamique n’est pas un argument en faveur d’une TSV. Les TV lentes (120 à 160/min), les TV idiopathiques et les TV sous amiodarone sont <button class="w" data-k="i47-tolerance">souvent bien tolérées</button>. Le diagnostic repose sur l’ECG, jamais sur la pression artérielle.</div>
<button class="pareto-btn ui" data-k="pareto-i47-clin">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>

<section class="ilot" id="i47-7"><h2><span class="n">7</span>Lecture de l’ECG d’une tachycardie à QRS fins</h2>
<p>L’ECG à 12 dérivations enregistré pendant la crise est l’examen décisif. Un tracé de monitorage à une seule dérivation ne suffit pas : il faut les 12 dérivations, avant et pendant toute manœuvre thérapeutique, puis après le retour en rythme sinusal. Une partie du QRS peut être isoélectrique dans une dérivation et le faire paraître fin, et les ondes P ne sont souvent visibles que dans quelques dérivations. Le tracé en rythme sinusal permet ensuite de reconnaître, par comparaison, une P rétrograde cachée dans le QRS ou une pré-excitation (ESC 2019). La lecture suit toujours le même ordre, détaillé dans la <button class="w" data-k="i47-ecg-lecture">fiche de lecture en six étapes (méthode et exemples)</button>.</p>
<h3>7.1 Les six questions</h3>
<ol><li><b>Le QRS est-il fin (&lt; 120 ms) ou large (≥ 120 ms) ?</b> Un QRS fin signe une activation ventriculaire par le faisceau de His : la tachycardie est supraventriculaire (à de rares exceptions près, comme certaines TV fasciculaires hautes). Un QRS large ouvre la démarche de l’îlot 8.</li>
<li><b>Le rythme est-il régulier ?</b> Une tachycardie à QRS fins irrégulière est presque toujours une fibrillation auriculaire, un flutter à conduction variable ou une tachycardie atriale multifocale (chapitre I48).</li>
<li><b>Voit-on l’activité atriale ?</b> Chercher les ondes P dans DII, DIII, aVF et V1, au besoin en comparant le ST avec un tracé en rythme sinusal.</li>
<li><b>Combien d’ondes P par QRS ?</b> Plus d’ondes P que de QRS signe une tachycardie atriale ou un flutter : le nœud n’est pas indispensable au circuit. Une TRIN conduite en 2:1 reste possible mais rare : le ventricule ne fait pas partie de sa boucle, et un bloc situé sous le circuit, le plus souvent infrahisien, n’interrompt pas la tachycardie (ESC 2019).</li>
<li><b>Où se situe la P ?</b> C’est la mesure de l’<button class="w" data-k="i47-ecg-rp">intervalle RP (RP court, RP long, tableau)</button>.</li>
<li><b>Quelle est la morphologie de la P ?</b> Négative en inférieur : activation de bas en haut (rétrograde, jonctionnelle ou atriale basse). Identique à la P sinusale : tachycardie sinusale ou réentrée sinusale.</li></ol>

<h3>7.2 La pré-excitation en rythme sinusal</h3>
<p>Elle associe un PR court (&lt; 120 ms), une onde delta (empâtement initial du QRS), un QRS élargi et des troubles secondaires de la repolarisation. Le degré de pré-excitation varie selon la position de la voie : une voie latérale gauche, loin du nœud sinusal, donne une pré-excitation discrète. L’influx sinusal atteint vite le nœud auriculoventriculaire, proche, mais doit traverser les deux oreillettes pour atteindre la voie : le ventricule est déjà largement activé par le système de conduction quand la voie conduit (ESC 2019). La polarité de l’onde delta dans les différentes dérivations permet de localiser approximativement la voie, ce qui informe le patient du risque de l’ablation (voie proche du nœud : risque de bloc). La <button class="w" data-k="i47-ecg-preexc">fiche de la pré-excitation (localisation, pseudo-infarctus, pièges)</button> détaille cette lecture.</p>
<h3>7.3 La tachycardie atriale focale</h3>
<p>La morphologie de l’onde P renseigne sur l’origine du foyer : une P positive en V1 et négative en DI ou aVL oriente vers l’oreillette gauche (veines pulmonaires) ; une P négative en inférieur oriente vers une origine basse. L’oreillette gauche est postérieure et à gauche : un foyer qui y naît active les oreillettes vers l’avant, donc vers V1, et vers la droite, à l’opposé de DI et aVL. La <button class="w" data-k="i47-ecg-ta">fiche de la tachycardie atriale (localisation, démarrage progressif, bloc)</button> précise ces critères, repris dans le consensus EHRA 2025.</p>
<div class="trap"><span class="k">Piège</span>Une tachycardie régulière à QRS fins à exactement 150/min est un flutter 2:1 jusqu’à preuve du contraire. La seconde onde F est cachée dans le QRS ou l’onde T. L’adénosine, en bloquant le nœud, démasque les ondes F sans arrêter le flutter.</div>
