<div class="lab">Physiologie normale</div><p>Le sang artériel transporte l’oxygène presque entièrement lié à l’hémoglobine : chaque gramme saturé en fixe environ 1,34 mL. Avec 150 g/L d’hémoglobine et une saturation de 98 %, le contenu artériel atteint environ 200 mL d’oxygène par litre. Le transport vers les tissus est le produit de ce contenu par le débit cardiaque : 5 L/min × 200 mL/L donnent environ 1 000 mL/min, pour une consommation de repos proche de 250 mL/min.</p>
<div class="lab">Mécanisme</div><p>Une hémoglobine à 90 g/L abaisse le contenu artériel d’environ 40 %. Les tissus extraient d’abord davantage d’oxygène du sang capillaire. La baisse de la viscosité sanguine et la vasodilatation des tissus moins oxygénés réduisent ensuite les résistances artérielles et la pression. Les barorécepteurs activent alors le système sympathique et le système rénine-angiotensine-aldostérone : la fréquence et le volume d’éjection augmentent, et le rein retient le sel et l’eau. Le débit cardiaque compense ainsi la baisse du contenu en oxygène.</p>
<div class="lab">Conséquence clinique</div><p>Le patient perçoit des battements forts et rapides, surtout à l’effort, et un souffle éjectionnel fonctionnel peut apparaître. Debout, le volume d’éjection baisse : la fréquence, déjà élevée, doit encore augmenter, d’où l’intolérance orthostatique. Chez un cardiaque, la réserve est limitée : le myocarde reçoit moins d’oxygène alors que la tachycardie augmente son travail, ce qui peut provoquer un angor ou décompenser une insuffisance cardiaque. Une réserve en fer basse s’associe aussi au POTS de l’adolescent : elle était trouvée chez 50 % des patients d’une série, contre 14 % dans la population de référence. Il s’agit d’une association ; le lien causal n’est pas établi.</p>
<div class="lab">Ce qui change la décision</div><p>Une tachycardie ou une intolérance orthostatique n’est attribuée au POTS ou à une arythmie qu’après exclusion d’une anémie. Une anémie découverte impose d’en chercher la cause, par exemple un saignement digestif ou des règles abondantes ; la corriger traite la tachycardie. Une ferritine basse se corrige aussi, mais aucun essai n’a montré que cette correction fasse disparaître un POTS.</p>
<div class="lab">Source</div><p>Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., Elsevier 2021 (transport de l’oxygène, débit cardiaque) ; Anand et Gupta, Anemia and iron deficiency in heart failure: current concepts and emerging therapies, Circulation 2018;138:80-98 ; Jarjour et Jarjour, Low iron storage and mild anemia in postural tachycardia syndrome in adolescents, Clin Auton Res 2013;23:175-179 ; Sheldon et al., Heart Rhythm 2015;12:e41-e63.</p>
