<div class="lab">Principe</div><p>La biologie ne pose pas le diagnostic d’une extrasystole. Elle cherche une cause générale qui augmente l’excitabilité du myocarde ou le tonus adrénergique, et que l’on peut corriger. Chaque dosage se justifie par un mécanisme et par une décision qu’il peut changer.</p>
<div class="lab">Potassium et magnésium</div><p>Le gradient de potassium entre l’intérieur et l’extérieur de la cellule fixe le potentiel de repos et règle la repolarisation. Une hypokaliémie réduit les courants potassiques de repolarisation : le potentiel d’action s’allonge, et des post-dépolarisations apparaissent, sources d’ESV et de torsades de pointes. Le magnésium est nécessaire à la pompe sodium-potassium ; sa carence entretient la perte rénale de potassium. Sous diurétique, les deux sont dosés et corrigés ensemble avant tout antiarythmique.</p>
<div class="lab">TSH</div><p>L’hormone thyroïdienne accélère le nœud sinusal et augmente la contractilité ; son excès favorise la tachycardie sinusale, les ESA et la fibrillation auriculaire (Klein et Ojamaa, 2001). Une TSH basse fait doser la thyroxine libre et traiter l’hyperthyroïdie, dont la correction peut faire disparaître les palpitations. Elle interdit aussi de conclure à un POTS ou à une tachycardie sinusale inappropriée, deux diagnostics qui exigent d’avoir exclu cette cause.</p>
<div class="lab">Hémogramme</div><p>Le contenu artériel en oxygène est proportionnel à l’hémoglobine. Quand elle baisse, le système sympathique augmente la fréquence et le volume d’éjection pour maintenir l’apport d’oxygène aux tissus : le patient perçoit des battements forts et rapides, surtout debout ou à l’effort. Une anémie fait rechercher sa cause, souvent une carence en fer ou un saignement, et la tachycardie se juge après correction.</p>
<div class="lab">Métanéphrines</div><p>Un phéochromocytome libère par poussées adrénaline et noradrénaline : palpitations, céphalées, sueurs et poussées hypertensives. Les métanéphrines plasmatiques libres ou urinaires fractionnées sont le test initial recommandé (Lenders et al., 2014). On ne les demande que devant ce tableau, car la maladie est rare : en son absence, un résultat positif est plus souvent faux que vrai.</p>
<div class="lab">Digoxinémie</div><p>La digoxine inhibe la pompe sodium-potassium : le calcium s’accumule dans la cellule et provoque des post-dépolarisations tardives. Chez un patient traité, un bigéminisme récent, une tachycardie atriale avec bloc ou une fibrillation auriculaire qui se régularise font doser la digoxinémie, au moins 6 heures après la prise, avec la kaliémie et la créatinine, car l’hypokaliémie et l’insuffisance rénale favorisent la toxicité.</p>
<div class="lab">Source</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, Eur Heart J 2022;43:3997-4126, section 6.1.1 ; Klein et Ojamaa, Thyroid hormone and the cardiovascular system, N Engl J Med 2001;344:501-509 ; Lenders et al., Pheochromocytoma and paraganglioma: an Endocrine Society clinical practice guideline, J Clin Endocrinol Metab 2014;99:1915-1942 ; Ma et al., Electrocardiographic manifestations: digitalis toxicity, J Emerg Med 2001;20:145-152 ; Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., Elsevier 2021.</p>
