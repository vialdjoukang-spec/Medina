<div class="lab">Physiologie normale</div><p>Le ventricule gauche est perfusé surtout pendant la diastole, quand sa contraction ne comprime plus les artères intramyocardiques. Pendant les compressions thoraciques, cette perfusion dépend de la différence entre la pression aortique et la pression de l’oreillette droite pendant la phase de relâchement : c’est la pression de perfusion coronaire. Chez 100 patients en arrêt cardiaque, seuls ceux qui avaient atteint au moins 15 mmHg ont retrouvé une circulation spontanée.</p>
<div class="lab">Mécanisme</div><p>L’adrénaline stimule les récepteurs α1 des artérioles : la vasoconstriction élève la pression aortique diastolique, donc la perfusion coronaire et cérébrale. Ses effets β augmentent en revanche la consommation d’oxygène du myocarde et son excitabilité. L’amiodarone allonge la période réfractaire et bloque plusieurs canaux ; la lidocaïne bloque les canaux sodiques inactivés, nombreux dans le tissu ischémique. Ces antiarythmiques ne remplacent pas le choc : ils visent à faciliter le succès du choc suivant et à prévenir la récidive de la FV.</p>
<div class="lab">Preuves</div><p>Dans PARAMEDIC2, qui portait sur 8 014 arrêts extrahospitaliers, l’adrénaline augmentait la survie à 30 jours (3,2 % contre 2,4 % sous placebo). La survie avec un bon état neurologique ne différait pas significativement (2,2 % contre 1,9 %), car davantage de survivants gardaient des séquelles graves. Dans ALPS, 3 026 patients en FV ou en TV sans pouls résistant au choc, la survie à la sortie de l’hôpital était de 24,4 % sous amiodarone, 23,7 % sous lidocaïne et 21,0 % sous placebo, sans différence significative. Une analyse de sous-groupe suggérait un bénéfice dans les arrêts survenus devant témoin.</p>
<div class="lab">Ce qui change la décision</div><p>Le choc reste le seul traitement qui arrête une FV : aucun médicament ne doit le retarder. Les médicaments viennent après le troisième choc, quand la FV persiste. L’amiodarone est le premier choix ; la lidocaïne la remplace si l’amiodarone manque ou par choix local, puisque ALPS ne montre pas de différence entre les deux.</p>
<div class="lab">Source</div><p>Paradis et al., Coronary perfusion pressure and the return of spontaneous circulation in human cardiopulmonary resuscitation, JAMA 1990;263:1106-1113 ; Perkins et al., A randomized trial of epinephrine in out-of-hospital cardiac arrest, N Engl J Med 2018;379:711-721 ; Kudenchuk et al., Amiodarone, lidocaine, or placebo in out-of-hospital cardiac arrest, N Engl J Med 2016;374:1711-1722 ; Brunton et al., Goodman and Gilman’s The Pharmacological Basis of Therapeutics, 13e éd., 2018.</p>
