<div class="lab">Physiologie normale</div><p>L’oreillette gauche normale a un volume indexé ≤ 34 mL/m². Elle reçoit le sang des veines pulmonaires à basse pression, se contracte en fin de diastole et protège ainsi la circulation pulmonaire. La valve tricuspide reste continente tant que l’anneau et le ventricule droit gardent leur taille.</p>
<div class="lab">Mécanisme</div><p>Une fuite mitrale sévère renvoie à chaque systole un volume dans l’oreillette gauche. L’oreillette se dilate pour absorber ce volume sans hausse majeure de pression ; l’étirement et la fibrose qui en découlent favorisent la fibrillation auriculaire. Lorsque la pression auriculaire s’élève, elle se transmet aux capillaires pulmonaires et crée une hypertension pulmonaire post-capillaire. Le ventricule droit, exposé à cette postcharge, se dilate et étire l’anneau tricuspide, d’où une fuite tricuspide secondaire. Ces quatre marqueurs signalent que la fuite a déjà remodelé les cavités d’amont, même lorsque le ventricule gauche paraît préservé.</p>
<div class="lab">Conséquence clinique</div><p>Dans de grandes cohortes de fuite dégénérative, une oreillette ≥ 60 mL/m², une fibrillation auriculaire, une pression artérielle pulmonaire systolique au repos &gt; 50 mmHg et une fuite tricuspide secondaire au moins modérée sont associées à une mortalité plus élevée à long terme après chirurgie, indépendamment de la fonction ventriculaire gauche. Il s’agit d’associations observationnelles : elles suggèrent qu’opérer avant leur apparition améliore le pronostic, sans essai randomisé qui le démontre.</p>
<div class="lab">Ce qui change la décision</div><p>Chez le patient asymptomatique à faible risque, sans dysfonction ventriculaire gauche, l’ESC/EACTS 2025 recommande la réparation lorsqu’au moins trois de ces critères sont réunis et qu’un résultat durable est probable (classe I). Une hypertension pulmonaire ou une fibrillation auriculaire due à la fuite rend la chirurgie envisageable (classe IIa). Une dilatation significative de l’oreillette seule justifie une réparation à envisager dans un centre valvulaire de référence (classe IIa). La condition d’une réparation durable est essentielle : un patient sans symptôme ne doit pas être exposé à un remplacement ou à une réparation qui échoue.</p>
<div class="lab">Limites</div><p>Les seuils proviennent de cohortes observationnelles. Chez la femme, la mortalité après réparation est plus élevée pour un degré moindre de dilatation, ce qui suggère l’intérêt de seuils propres au sexe.</p>
<div class="lab">Source</div><p>Praz et al. 2025 ESC/EACTS Guidelines for the management of valvular heart disease. Eur Heart J 2025;46:4635-4736. Butcher et al. Factors influencing post-surgical survival in degenerative mitral regurgitation. Eur Heart J 2023;44:871-881. Grigioni et al. Score de risque de mortalité précoce et tardive dans la fuite mitrale dégénérative. Eur Heart J 2018;39:1281-1291. Essayagh et al. Prognostic implications of left atrial enlargement in degenerative mitral regurgitation. J Am Coll Cardiol 2019;74:858-870.</p></template>
