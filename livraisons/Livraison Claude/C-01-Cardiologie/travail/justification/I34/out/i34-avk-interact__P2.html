<div class="lab">Physiologie normale</div><p>Les facteurs II, VII, IX et X ne deviennent actifs qu’après une carboxylation qui consomme de la vitamine K réduite. La vitamine K époxyde réductase régénère cette forme réduite, et les antivitamines K bloquent cette enzyme. L’INR reflète donc l’équilibre entre la dose d’antivitamine K, son élimination et l’apport de vitamine K.</p>
<div class="lab">Mécanisme</div><p>La plupart des interactions modifient l’élimination hépatique. L’acénocoumarol est éliminé presque entièrement par le cytochrome P450 2C9. La phenprocoumone dépend aussi du CYP3A4 et d’une excrétion biliaire et urinaire, ce qui la rend moins sensible aux variations du CYP2C9. Un inhibiteur enzymatique, comme l’amiodarone, un antifongique azolé, le cotrimoxazole ou le métronidazole, ralentit l’élimination : la concentration et l’INR montent. Un inducteur, comme la rifampicine, la carbamazépine ou le millepertuis, accélère l’élimination : l’INR baisse. Le paracétamol pris régulièrement agit autrement : son métabolite toxique inhibe les enzymes du cycle de la vitamine K. Une infection fébrile ou un changement alimentaire modifie en outre l’apport de vitamine K.</p>
<div class="lab">Conséquence clinique</div><p>Une induction s’installe et disparaît en plusieurs jours, le temps que la quantité d’enzyme change. L’amiodarone, de demi-vie de plusieurs semaines, potentialise l’antivitamine K longtemps après son arrêt. Une hausse de l’INR expose à l’hémorragie ; une baisse expose le porteur de prothèse mécanique à la thrombose de valve. La plupart des interactions publiées reposent sur des cas isolés, mais celles des azolés, des macrolides, des quinolones, des anti-inflammatoires non stéroïdiens et de l’amiodarone sont constantes.</p>
<div class="lab">Ce qui change la décision</div><p>Au début ou à l’arrêt d’un médicament qui interagit, l’INR se contrôle dans les jours qui suivent, puis jusqu’à stabilisation. On choisit si possible un antibiotique sans interaction connue. Avec l’amiodarone, on réduit d’emblée la dose d’antivitamine K et l’on rapproche les contrôles. Une instabilité de l’INR ne justifie pas un passage aux AOD chez un porteur de prothèse mécanique ou de rétrécissement mitral rhumatismal.</p>
<div class="lab">Source</div><p>Ufer, Comparative pharmacokinetics of vitamin K antagonists, Clin Pharmacokinet 2005;44:1227–46. Thijssen et al., Thromb Haemost 2004;92:797–802. Holbrook et al., Systematic overview of warfarin and its drug and food interactions, Arch Intern Med 2005;165:1095–106. Ansell et al., Chest 2008;133(6 Suppl):160S–198S.</p></template>
