<div class="lab">Physiologie normale</div><p>La coagulation démarre par deux voies. Le facteur tissulaire, exposé par une lésion, active le facteur VII. Une surface artificielle active le facteur XII, puis le facteur XI : c’est la voie de contact. Les deux voies convergent vers le facteur X activé, qui produit la thrombine. Un antivitamine K abaisse la synthèse fonctionnelle des facteurs II, VII, IX et X ; il freine donc les deux voies en amont. Un AOD inhibe une seule enzyme, le facteur Xa ou la thrombine, à une concentration qui varie entre le pic et la vallée.</p>
<div class="lab">Mécanisme : prothèse mécanique</div><p>Les ailettes et surtout la collerette de suture activent la voie de contact. In vitro, elles augmentent la production de thrombine de 1,2 à 1,8 fois, et cette production disparaît sans facteur XII. Le dabigatran la freine à peine en dessous de 400 ng/mL, alors que le plasma de patients sous warfarine la supprime dès un INR &gt; 1,5. La thrombine formée au contact de la prothèse dépasse donc la capacité d’un AOD aux doses usuelles.</p>
<div class="lab">Mécanisme : rétrécissement mitral</div><p>L’obstacle ralentit le flux dans toute l’oreillette gauche dilatée. La stase y produit un contraste spontané et des thrombus, dans l’auricule mais aussi dans le corps de l’oreillette. Le risque embolique dépend donc de l’obstacle, et non des facteurs que le score CHA₂DS₂-VA additionne. La raison précise de l’échec du rivaroxaban dans cette situation reste inconnue.</p>
<div class="lab">Conséquence clinique</div><p>L’essai RE-ALIGN, chez 252 porteurs de prothèse mécanique, a été arrêté prématurément. Un accident vasculaire cérébral est survenu chez 5 % des patients sous dabigatran et chez aucun sous warfarine ; une hémorragie majeure, toujours péricardique, chez 4 % contre 2 %. L’essai INVICTUS a inclus 4 531 patients avec cardiopathie rhumatismale et fibrillation. Il a compté 560 événements du critère principal (accident vasculaire cérébral, embolie, infarctus, décès vasculaire ou de cause inconnue) sous rivaroxaban, contre 446 sous antivitamine K. Les décès étaient plus fréquents sous rivaroxaban, sans différence d’hémorragies majeures.</p>
<div class="lab">Ce qui change la décision</div><p>Les AOD sont contre-indiqués avec une prothèse mécanique (ESC/EACTS 2025, classe III, niveau A) et dans la fibrillation avec rétrécissement mitral rhumatismal de surface ≤ 2,0 cm² (classe III). Ils sont au contraire préférés aux antivitamines K dans la fibrillation avec sténose ou fuite aortique, ou avec fuite mitrale (classe I), car les sous-groupes valvulaires des grands essais les soutiennent. Remplacer l’antivitamine K par un AOD « pour simplifier » est donc dangereux dans les deux premières situations.</p>
<div class="lab">Source</div><p>Praz et al., 2025 ESC/EACTS Guidelines for the management of valvular heart disease, Eur Heart J 2025;46:4635–4736. Eikelboom et al., Dabigatran versus warfarin in patients with mechanical heart valves, N Engl J Med 2013;369:1206–14. Connolly et al., Rivaroxaban in rheumatic heart disease-associated atrial fibrillation, N Engl J Med 2022;387:978–88. Jaffer et al., J Am Heart Assoc 2015;4:e002322.</p></template>
