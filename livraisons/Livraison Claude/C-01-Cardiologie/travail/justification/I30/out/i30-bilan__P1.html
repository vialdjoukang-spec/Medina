<div class="lab">Radiographie thoracique</div><p>Elle cherche un diagnostic concurrent ou une cause : pneumonie, épanchement pleural, masse médiastinale, séquelle tuberculeuse. Une silhouette cardiaque élargie avec des champs pulmonaires clairs fait évoquer un épanchement péricardique plutôt qu’une insuffisance cardiaque gauche.</p>
<div class="lab">Protéine C réactive</div><p>Élevée dans environ 80 % des cas, elle soutient le diagnostic, mesure l’activité de la maladie et fixe la durée de la dose d’attaque ; ses usages sont détaillés dans la fiche <button class="w" data-k="i30-crp">protéine C réactive</button>.</p>
<div class="lab">Hémogramme</div><p>Une hyperleucocytose à polynucléaires accompagne la forme inflammatoire. Une leucocytose marquée avec fièvre élevée fait craindre une péricardite purulente. Une lymphopénie oriente vers une maladie auto-immune, une infection par le VIH ou une hémopathie. L’hémogramme sert aussi de référence avant la colchicine, dont la toxicité peut être médullaire.</p>
<div class="lab">Troponine</div><p>Elle reflète la nécrose de cardiomyocytes. Normale, elle est compatible avec une péricardite pure. Élevée, dans 20 à 30 % des cas, elle signale une atteinte myocardique associée : elle impose de chercher une dysfonction ventriculaire, conduit à l’hospitalisation et rend la restriction sportive plus prudente. Associée à un trouble de la cinétique segmentaire, elle fait discuter une coronarographie.</p>
<div class="lab">Créatinine</div><p>La fonction rénale fixe la dose des AINS et de la colchicine, réduite dans l’insuffisance rénale sévère. Une urémie avancée est elle-même une cause de péricardite, traitée par la dialyse.</p>
<div class="lab">Autres dosages de base</div><p>L’ESC 2025 ajoute la TSH, qui cherche une hypothyroïdie, cause d’épanchement abondant ; les tests hépatiques, référence pour surveiller la tolérance de la colchicine ; le NT-proBNP, élevé quand le myocarde est atteint avec insuffisance cardiaque, normal ou peu élevé dans la constriction isolée.</p>
<div class="lab">Source</div><p>Recommandations de l’ESC 2025 sur les myocardites et les péricardites, sections 3.3.2, 4.4.1, 4.5.5 et 7.2, tableaux 9 et 13.</p></template>
