<div class="lab">Électrocardiogramme</div><p>Il cherche le sus-décalage diffus du ST et le sous-décalage du PR, qui sont des critères diagnostiques. Il écarte surtout un infarctus : un sus-décalage localisé avec image en miroir impose la filière coronaire. Un microvoltage ou une alternance électrique font suspecter un épanchement abondant.</p>
<div class="lab">Radiographie thoracique</div><p>Elle cherche un diagnostic concurrent ou une cause : pneumonie, épanchement pleural, masse médiastinale, séquelle tuberculeuse. Une silhouette cardiaque élargie avec des champs pulmonaires clairs fait évoquer un épanchement péricardique plutôt qu’une insuffisance cardiaque gauche.</p>
<div class="lab">Protéine C réactive</div><p>Elle est élevée dans environ 80 % des cas et mesure l’activité de la maladie. Ses usages sont détaillés dans la fiche <button class="w" data-k="i30-crp">protéine C réactive</button>.</p>
<div class="lab">Hémogramme</div><p>Une hyperleucocytose à polynucléaires accompagne la forme inflammatoire. Une leucocytose marquée avec fièvre élevée fait craindre une péricardite purulente. Une lymphopénie oriente vers une maladie auto-immune, une infection par le VIH ou une hémopathie. L’hémogramme sert aussi de référence avant la colchicine, dont la surveillance comprend la numération sanguine.</p>
<div class="lab">Troponine</div><p>Elle reflète la nécrose de cardiomyocytes. Normale, elle confirme une péricardite pure. Élevée, dans 20 à 30 % des cas, elle définit une myopéricardite : elle impose de chercher une dysfonction ventriculaire, conduit à l’hospitalisation et rend la restriction sportive plus prudente. Associée à un trouble de la cinétique segmentaire, elle fait discuter une coronarographie.</p>
<div class="lab">Créatinine</div><p>La fonction rénale fixe la dose des AINS et de la colchicine, réduite dans l’insuffisance rénale sévère. Une urémie avancée est elle-même une cause de péricardite, traitée par la dialyse.</p>
<div class="lab">Autres dosages de base</div><p>L’ESC 2025 ajoute la TSH, qui cherche une hypothyroïdie, cause d’épanchement abondant ; les tests hépatiques et la créatine kinase, qui servent de référence pour surveiller la tolérance de la colchicine ; le peptide natriurétique, qui aide à reconnaître une atteinte myocardique ou une constriction.</p>
<div class="lab">Échocardiographie transthoracique</div><p>Elle cherche un épanchement nouveau ou croissant, qui est un critère diagnostique, en mesure la taille et le retentissement, et évalue la fonction ventriculaire. Elle est normale dans 40 à 50 % des premiers épisodes : une échocardiographie normale n’exclut donc pas la péricardite.</p>
<div class="lab">Source</div><p>Recommandations ESC 2025 sur les myocardites et les péricardites, sections 3.3.2, 4.4.1, 5.2.1, 5.5.2 et 8.1, tableaux 4, 9 et 13.</p></template>
