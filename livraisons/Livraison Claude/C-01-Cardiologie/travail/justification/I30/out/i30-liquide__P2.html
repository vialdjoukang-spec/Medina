<div class="lab">Physiologie normale</div><p>Le sac contient 10 à 50 mL d’un ultrafiltrat plasmatique qui lubrifie les feuillets. Ce liquide est riche en cellules mésothéliales, en protéines et en lactate déshydrogénase. Les critères de Light, conçus pour la plèvre, le classent donc presque toujours en exsudat : 118 liquides sur 120 dans une série de ponctions. Ces dosages ne servent pas à classer un épanchement péricardique.</p>
<div class="lab">Mécanisme des anomalies</div><p><b>Glucose et cellules.</b> Les bactéries et les polynucléaires consomment le glucose. Le rapport liquide/sang moyen est de 0,3 dans la péricardite purulente, contre 0,7 dans la tuberculose et 0,8 dans les néoplasies. Le pus contient en moyenne 92 % de polynucléaires, contre environ 50 % dans les deux autres causes. Un glucose normal n’exclut donc pas une tuberculose.</p><p><b>Adénosine désaminase.</b> Cette enzyme du métabolisme des purines abonde dans les lymphocytes T activés. La réponse lymphocytaire à la tuberculose l’élève, mais d’autres épanchements riches en cellules activées l’élèvent aussi. Dans une méta-analyse, sa sensibilité est de 90 % et sa spécificité de 86 %.</p><p><b>Interféron gamma non stimulé.</b> Les lymphocytes T auxiliaires le sécrètent sur place au contact des antigènes mycobactériens. Il est plus spécifique : sensibilité 97 % et spécificité 99 % dans une méta-analyse, avec des seuils de 14 à 200 pg/mL selon les études.</p><p><b>Amplification génique et culture.</b> Le liquide contient peu de bacilles. L’amplification automatisée est spécifique à 100 %, mais sensible à 64 % seulement, et à 78 % sur une biopsie. La culture, sensible dans 53 à 75 % des cas, demande plus de 3 semaines.</p><p><b>Cytologie et marqueurs.</b> Les cellules tumorales ne passent pas toujours dans le liquide : une cytologie négative n’exclut pas un cancer. Aucun marqueur tumoral du liquide n’est assez exact pour trancher seul.</p>
<div class="lab">Conséquence clinique</div><p>Près de deux tiers des atteintes péricardiques des patients cancéreux ne sont pas malignes : radiothérapie, chimiothérapie ou infection. Un épanchement sans protéine C réactive élevée a un rapport de vraisemblance de 2,9 pour une cause néoplasique. Hors zone d’endémie, la tuberculose est rare : une adénosine désaminase élevée y a une valeur prédictive positive plus faible.</p>
<div class="lab">Ce qui change la décision</div><p>La protéine C réactive se dose avant la ponction, car le geste l’élève. Les analyses suivent la question : cultures bactériennes, fongiques et mycobactériennes si l’on suspecte une infection, cytologie si l’on suspecte un cancer. Hors zone d’endémie, une suspicion de tuberculose sans preuve après plus de 3 semaines de maladie fait discuter une biopsie péricardique (classe IIb, niveau C), plutôt qu’un traitement antituberculeux empirique, déconseillé (classe III, niveau C).</p>
<div class="lab">Source</div><p>ESC 2025 sur les myocardites et péricardites, Eur Heart J 2025;46:3952-4041, sections 11.1.2, 11.2.2, 11.5.2 et 11.7.3, tableau de recommandations 20 ; Ben Horin et al., Am J Cardiol 2007;99:1294-7 ; Pandie et al., BMC Med 2014;12:101.</p></template>
