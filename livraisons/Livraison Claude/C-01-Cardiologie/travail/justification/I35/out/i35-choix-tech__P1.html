<div class="lab">Principe</div><p>Le TAVI écrase la valve native contre la paroi sans l’exciser. La chirurgie l’excise, traite les lésions voisines et coud la prothèse sous contrôle visuel. Chaque critère de choix découle de cette différence.</p>
<div class="lab">Ce qui oriente vers la chirurgie</div><p>Des coronaires basses, des sinus de Valsalva peu profonds ou une cuspide très calcifiée exposent à l’occlusion d’un ostium par la cuspide native repoussée. La bicuspidie associe un anneau elliptique, des calcifications asymétriques et souvent un raphé calcifié : fuite paravalvulaire, rupture de racine et mortalité sont plus fréquentes après TAVI. Une calcification massive de l’anneau ou de la chambre de chasse expose aux mêmes risques. Une aorte dilatée, des pontages complexes ou une autre valve à opérer se traitent dans le même temps opératoire. L’endocardite active, contre-indication relative au TAVI, exige l’excision des tissus infectés.</p>
<div class="lab">Ce qui oriente vers le TAVI</div><p>Une aorte « porcelaine » interdit le clampage et la canulation sans risque d’embolie calcaire. Après radiothérapie ou sternotomie, la fibrose médiastinale et des pontages perméables proches du sternum rendent la réouverture dangereuse. La fragilité et une déformation thoracique alourdissent la récupération après sternotomie et circulation extracorporelle. Les avantages du TAVI démontrés par les essais concernent la voie fémorale.</p>
<div class="lab">Ce qui change la décision</div><p>Les essais ont surtout inclus des patients âgés à valve tricuspide ; les bicuspidies et les anatomies défavorables en étaient exclues. Hors de ces situations, la Heart Team pèse l’espérance de vie, la durabilité attendue et la faisabilité d’une seconde intervention.</p>
<div class="lab">Source</div><p>ESC/EACTS 2025, sections 8.5.1.2 et 8.5.1.3, figure 9.</p></template>
