<div class="lab">Physiologie normale</div><p>La FEVG dépend de la contractilité et de la postcharge. Un ventricule normal éjecte plus de la moitié de son volume télédiastolique et augmente son débit à l’effort, ce qui élève la pression systolique.</p>
<div class="lab">Mécanisme</div><p>Dans le RA sévère, la postcharge comprend la pression aortique et le gradient. Lorsque l’hypertrophie ne normalise plus la contrainte pariétale, la FEVG baisse par excès de postcharge ; cette dysfonction régresse en général après le remplacement. Plus tard, la fibrose de remplacement la rend irréversible. Une FEVG inférieure à 50 % sans autre cause signale que l’adaptation est dépassée : l’intervention est alors recommandée même sans symptôme, avant que la fibrose fige la dysfonction.</p>
<div class="lab">Conséquence clinique</div><p>Les marqueurs retenus repèrent les patients chez qui un événement est proche : RA très sévère, calcification sévère, progression rapide de la Vmax, peptides natriurétiques élevés, FEVG inférieure à 55 %. Ce sont des associations pronostiques issues de cohortes (<button class="w" data-k="i35-suivi">données de progression</button>) : elles prédisent symptômes, hospitalisations et décès, sans prouver qu’une intervention précoce les prévient chez chaque patient.</p>
<div class="lab">Ce qui change la décision</div><p>L’intervention précoce se justifie quand le risque d’attendre dépasse le risque procédural. Une épreuve d’effort anormale fait reclasser le patient comme symptomatique. Sans marqueur, l’ESC/EACTS 2025 admet l’intervention précoce chez le patient à faible risque, en alternative à une surveillance rapprochée, car les <button class="w" data-k="i35-early">essais randomisés</button> ont réduit les hospitalisations sans réduire la mortalité. Des ressources locales limitées ou de longues listes d’attente plaident aussi pour intervenir tôt.</p>
<div class="lab">Source</div><p>ESC/EACTS 2025, sections 8.4.1 et 8.4.2.</p></template>
