<div class="lab">Ce que mesurent ces facteurs</div><p>Le cerveau ne stocke pas d’oxygène, et le myocarde fibrillant épuise ses réserves en quelques minutes. Un facteur améliore donc le pronostic lorsqu’il raccourcit l’absence de débit ou avance le premier choc. D’autres facteurs ne sont que des marqueurs : ils accompagnent une situation favorable sans agir par eux-mêmes.</p>
<div class="lab">Arrêt devant témoin</div><p>Le témoin voit l’effondrement et peut appeler aussitôt : le no-flow est court, et son début est connu. Un arrêt découvert a souvent duré plusieurs minutes, qui ont déjà lésé le cerveau et laissé la FV dégénérer en asystolie.</p>
<div class="lab">Réanimation par un témoin</div><p>Les compressions entretiennent une perfusion cérébrale et coronaire partielle et ralentissent la dégradation de la FV. Dans le registre suédois, une RCP débutée avant l’arrivée des secours était associée à une survie à 30 jours plus que doublée après ajustement (rapport de cotes 2,15). L’étude est observationnelle ; le mécanisme connu et la relation entre le délai de début de la RCP et la survie rendent toutefois un effet causal plausible.</p>
<div class="lab">Rythme initial choquable</div><p>Une FV signale en général un arrêt récent, d’origine cardiaque, dans un myocarde encore capable de répondre au choc. En Europe, les arrêts devant témoin en rythme choquable, groupe de référence d’Utstein, survivaient à 30 % en 2022, contre 7,5 % pour l’ensemble des arrêts extrahospitaliers.</p>
<div class="lab">Lieu et âge</div><p>Le lieu public et l’âge jeune sont surtout des marqueurs. Au domicile, où surviennent 70 % des arrêts, la RCP par un témoin et la défibrillation avant les secours sont moins fréquentes ; les sujets âgés reçoivent aussi moins souvent une RCP par un témoin. L’âge pèse en outre par la fragilité et les comorbidités, mais il ne suffit jamais seul à renoncer à réanimer.</p>
<div class="lab">Ce qui change la décision</div><p>Ces facteurs justifient d’investir dans les premiers maillons : formation de la population, RCP guidée par le 144, défibrillateurs accessibles et premiers répondants. Au lit du patient, ils guident la sélection pour une RCP extracorporelle et l’interprétation du pronostic ; aucun d’eux ne permet à lui seul d’arrêter une réanimation.</p>
<div class="lab">Source</div><p>Recommandations ERC 2025, épidémiologie de la réanimation (Baldi et al., Resuscitation 2025;215:110733), réanimation de base de l’adulte (Smyth et al., Resuscitation 2025;215:110771) et éthique de la réanimation (Raffay et al., Resuscitation 2025;215:110734) ; Hasselqvist-Ax et al., N Engl J Med 2015;372:2307-15.</p></template>
