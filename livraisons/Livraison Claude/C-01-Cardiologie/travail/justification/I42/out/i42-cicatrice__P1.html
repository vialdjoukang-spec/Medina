<div class="lab">Physiologie normale</div><p>Dans un myocarde sain, les cardiomyocytes sont couplés par les jonctions communicantes du disque intercalaire. Le front d’activation progresse vite et de façon homogène, puis tout le myocarde devient réfractaire presque en même temps. L’influx ne trouve donc aucun tissu excitable sur lequel revenir : la réentrée est impossible.</p>
<div class="lab">Mécanisme</div><p>Une fibrose de remplacement laisse des faisceaux de cardiomyocytes survivants séparés par du collagène. L’influx y chemine lentement, en zigzag, et peut être bloqué dans un seul sens. Lorsque son temps de parcours dépasse la période réfractaire du tissu d’origine, il revient l’exciter : c’est la réentrée, mécanisme habituel de la tachycardie ventriculaire monomorphe, qui peut dégénérer en fibrillation ventriculaire. Le gadolinium diffuse dans l’espace extracellulaire élargi par la fibrose et y persiste : le rehaussement tardif à l’IRM en montre l’étendue. Quand la cicatrice siège dans le septum, comme dans les laminopathies et la sarcoïdose, elle interrompt aussi le tissu de conduction : bloc auriculoventriculaire et tachycardie ventriculaire ont alors le même substrat.</p>
<div class="lab">Conséquence clinique</div><p>La FEVG mesure la fonction de pompe, non l’étendue ni la localisation du substrat. Une cicatrice septale ou sous-épicardique peut porter des circuits de réentrée dans un ventricule qui se contracte encore bien. L’ESC 2023 constate ainsi que les porteurs de variants de <i>PLN</i>, <i>TMEM43</i>, <i>DES</i>, <i>DSP</i>, <i>LMNA</i>, <i>RBM20</i> ou de variants tronquants de <i>FLNC</i> ont nettement plus d’événements arythmiques majeurs que les autres patients, quelle que soit la FEVG. Le taux annuel de mort subite y est estimé de 5 à 10 % pour <i>LMNA</i>, <i>TMEM43</i> et les variants tronquants de <i>FLNC</i>.</p>
<div class="lab">Ce qui change la décision</div><p>Dans la CMD et la CMNDVG, le génotype entre dans l’estimation du risque (classe IIa). Avec un génotype à haut risque et une FEVG &gt; 35 %, un défibrillateur est à envisager en présence de facteurs propres au gène, comme un rehaussement tardif ou une FEVG &lt; 45 % (classe IIa) ; sans eux, il peut être envisagé (classe IIb). Pour <i>LMNA</i> et <i>PLN</i>, des calculateurs dédiés estiment le risque à cinq ans. Lorsqu’une stimulation est nécessaire au cours d’une laminopathie ou d’une sarcoïdose cardiaque, un défibrillateur est préféré à un stimulateur simple, car la cicatrice qui bloque la conduction expose aussi à la tachycardie ventriculaire.</p>
<div class="lab">Source</div><p>ESC 2023 sur les cardiomyopathies (Arbelo et al., Eur Heart J 2023;44:3503-3626) : sections 7.2.5 et 7.3.5, tableau 21, tableaux de recommandations 24 et 26, figure 7. Wahbi et al., Development and validation of a new risk prediction score for life-threatening ventricular tachyarrhythmias in laminopathies, Circulation 2019;140:293-302. Zeppenfeld et al., ESC 2022 sur les arythmies ventriculaires, Eur Heart J 2022;43:3997-4126.</p>
