<div class="lab">Physiologie normale</div><p>Le ventricule gauche se remplit en deux temps : d’abord passivement, quand sa relaxation fait chuter sa pression au début de la diastole, puis par la contraction auriculaire en fin de diastole. Quand la relaxation est lente et la paroi rigide, le remplissage précoce diminue et la part apportée par l’oreillette augmente. Lorsque la fréquence s’accélère, la diastole raccourcit davantage que la systole. La contraction auriculaire empêche aussi la stase du sang dans l’auricule gauche, où naissent la plupart des thrombus.</p>
<div class="lab">Mécanisme</div><p>Dans la CMH, les pressions de remplissage élevées et l’insuffisance mitrale liée au mouvement systolique antérieur étirent l’oreillette gauche ; elle se dilate et se fibrose, ce qui favorise la fibrillation auriculaire. Une méta-analyse de 33 études la retrouve chez environ 22 % des patients, avec 3,75 thromboembolies pour 100 patients-années chez ceux qui en souffrent (Guttmann et al., 2014). Dans l’amylose, les dépôts infiltrent aussi la paroi auriculaire : l’oreillette se contracte mal, parfois même en rythme sinusal, et le sang y stagne. Sur 116 cœurs amyloïdes examinés après autopsie ou transplantation, un thrombus intracardiaque était présent dans 33 % des cas, dans 51 % des amyloses AL contre 16 % des autres types ; la dysfonction diastolique était associée de façon indépendante à la thromboembolie (Feng et al., 2007).</p>
<div class="lab">Conséquence clinique</div><p>La fibrillation supprime la contraction auriculaire et, si elle est rapide, raccourcit la diastole : le volume d’éjection chute et la pression auriculaire monte, d’où hypotension, présyncope ou œdème pulmonaire. Dans le registre européen des cardiomyopathies, l’incidence annuelle des accidents vasculaires cérébraux et des accidents ischémiques transitoires était environ trois fois plus élevée chez les patients qui avaient une fibrillation auriculaire.</p>
<div class="lab">Pourquoi ne pas utiliser le score CHA₂DS₂-VASc</div><p>Ce score n’a pas été testé dans les cardiomyopathies, et des données rétrospectives suggèrent qu’il prédit mal les accidents vasculaires cérébraux dans la CMH et l’amylose à transthyrétine. Un patient jeune atteint de CMH, sans autre facteur, aurait un score nul alors que son risque embolique est élevé.</p>
<div class="lab">Ce qui change la décision</div><p>L’anticoagulation orale est recommandée chez tout patient atteint de CMH ou d’amylose cardiaque qui présente une fibrillation ou un flutter auriculaire documenté, sauf contre-indication et sans calcul de score (classe I, niveau B). Dans la CMD, la CMNDVG et la CMAVD, la décision suit au contraire le score CHA₂DS₂-VASc. Un anticoagulant oral direct est habituellement choisi en l’absence de rétrécissement mitral serré ou de prothèse mécanique : hors cardiomyopathie, il protège autant qu’un antivitamine K avec moins d’hémorragies intracrâniennes. Le bêtabloquant est le premier choix pour ralentir la fréquence, à faible dose dans l’amylose. Dans la CMH, le contrôle du rythme est préféré, et le rythme sinusal ou une fréquence contrôlée doivent être obtenus avant de décider d’une réduction septale (classe IIa).</p>
<div class="lab">Limites</div><p>Aucun essai randomisé n’a testé l’anticoagulation dans la CMH ni comparé les anticoagulants oraux directs aux antivitamines K dans les cardiomyopathies ; les données observationnelles vont dans le même sens que dans la population générale. La recommandation repose sur l’incidence élevée des embolies et sur des cohortes où l’anticoagulation était associée à moins d’accidents vasculaires cérébraux.</p>
<div class="lab">Source</div><p>ESC 2023 sur les cardiomyopathies (Arbelo et al., Eur Heart J 2023;44:3503-3626) : section 6.10.3, tableau 15, tableaux de recommandations 11 et 18. Guttmann et al., Atrial fibrillation and thromboembolism in patients with hypertrophic cardiomyopathy: systematic review, Heart 2014;100:465-472. Feng et al., Intracardiac thrombosis and embolism in patients with cardiac amyloidosis, Circulation 2007;116:2420-2426.</p>
