<div class="lab">Physiologie normale</div><p>L’oreillette gauche se vide passivement au début de la diastole, puis se contracte en fin de diastole. Ce flux continu et cette contraction empêchent la stase du sang dans l’auricule gauche, où naissent la plupart des thrombus.</p>
<div class="lab">Mécanisme dans la CMH</div><p>Le ventricule hypertrophié et fibreux se remplit mal ; la pression de l’oreillette gauche s’élève, puis l’oreillette se dilate et se fibrose. La fibrillation auriculaire supprime alors la contraction auriculaire dans une cavité déjà dilatée, ce qui favorise la stase. Dans une méta-analyse de 33 études, elle touchait environ 22 % des patients, et l’incidence des thromboembolies atteignait 3,75 pour 100 patients-années chez ceux qui en souffraient (Guttmann et al., 2014).</p>
<div class="lab">Mécanisme dans l’amylose</div><p>Les dépôts infiltrent aussi la paroi auriculaire et réduisent sa contraction, parfois même en rythme sinusal. Dans une série autopsique de la Mayo Clinic, un thrombus intracardiaque était présent dans 33 % des cœurs amyloïdes, plus souvent dans l’amylose AL ; la dysfonction diastolique était associée de façon indépendante aux thromboembolies (Feng et al., 2007).</p>
<div class="lab">Pourquoi ne pas utiliser le score CHA₂DS₂-VASc</div><p>Ce score n’a pas été testé dans les cardiomyopathies. Des données rétrospectives montrent qu’il prédit mal les accidents vasculaires cérébraux dans la CMH et dans l’amylose ATTR : un patient jeune sans autre facteur aurait un score nul alors que son risque embolique est élevé.</p>
<div class="lab">Ce qui change la décision</div><p>Dans la CMH et l’amylose cardiaque, toute fibrillation ou tout flutter auriculaire documenté fait indiquer une anticoagulation orale, sauf contre-indication (classe I, niveau B, ESC 2023). Dans la CMD, la CMNDVG et la CMAVD, la décision suit au contraire le score CHA₂DS₂-VASc, comme dans la population générale. Un anticoagulant oral direct est habituellement choisi : hors cardiomyopathie, il protège autant qu’un antivitamine K avec moins d’hémorragies intracrâniennes, et les données observationnelles disponibles dans les cardiomyopathies vont dans le même sens.</p>
<div class="lab">Limites</div><p>Aucun essai randomisé n’a testé l’anticoagulation dans la CMH ni comparé les anticoagulants oraux directs aux antivitamines K dans les cardiomyopathies. La recommandation repose sur l’incidence élevée des embolies et sur des cohortes où l’anticoagulation était associée à moins d’accidents vasculaires cérébraux.</p>
<div class="lab">Source</div><p>Arbelo et al., 2023 ESC Guidelines for the management of cardiomyopathies, Eur Heart J 2023;44:3503–3626, section 6.10.3.1. Guttmann et al., Atrial fibrillation and thromboembolism in patients with hypertrophic cardiomyopathy: systematic review, Heart 2014;100:465–472. Feng et al., Intracardiac thrombosis and embolism in patients with cardiac amyloidosis, Circulation 2007;116:2420–2426.</p></template>
