<div class="lab">Physiologie normale</div><p>L’étirement des cardiomyocytes ventriculaires, provoqué par une hausse de pression ou de volume, stimule la synthèse d’un précurseur. Celui-ci est clivé en peptide natriurétique actif, qui favorise la natriurèse et la vasodilatation, et en NT-proBNP inactif, dont l’élimination dépend en grande partie du rein. La troponine appartient à l’appareil contractile : elle ne passe dans le sang qu’en cas de lésion du cardiomyocyte.</p>
<div class="lab">Mécanisme dans les cardiomyopathies</div><p>Le NT-proBNP s’élève avec les pressions de remplissage, donc avec la rigidité ventriculaire, l’obstruction et la congestion. Dans l’amylose, il est souvent très élevé : la pression de remplissage est haute, l’insuffisance rénale fréquente réduit son élimination, et l’amylose AL ajoute une toxicité directe des chaînes légères. La troponine reste élevée de façon chronique quand l’infiltration ou la fibrose entretiennent une lésion continue des cardiomyocytes ; elle s’élève brutalement lors d’une inflammation aiguë, comme une myocardite ou une « phase chaude » liée à <i>DSP</i>.</p>
<div class="lab">Interprétation</div><p>Chez un patient ambulatoire, un NT-proBNP &lt; 125 ng/L rend une insuffisance cardiaque peu probable. Une valeur élevée n’est pas spécifique : l’âge, la fibrillation auriculaire, l’insuffisance rénale, l’embolie pulmonaire et le sepsis l’augmentent, alors que l’obésité l’abaisse. Une troponine élevée mais stable sur plusieurs dosages oriente vers une atteinte chronique ; une cinétique ascendante oriente vers une lésion aiguë.</p>
<div class="lab">Ce qui change la décision</div><p>Une troponine élevée de façon chronique figure parmi les signes qui doivent faire rechercher une amylose chez un patient à parois épaisses (ESC 2023). Ces marqueurs fondent aussi les <button class="w" data-k="i42-stades">stades pronostiques de l’amylose</button>. Dans toutes les cardiomyopathies, des valeurs élevées sont associées aux événements cardiovasculaires, à l’insuffisance cardiaque et au décès ; leur évolution aide au suivi.</p>
<div class="lab">Limites</div><p>Une association pronostique ne prouve pas qu’abaisser le marqueur améliore le pronostic. Les seuils de troponine dépendent de la méthode et du laboratoire.</p>
<div class="lab">Source</div><p>Arbelo et al., 2023 ESC Guidelines for the management of cardiomyopathies, Eur Heart J 2023;44:3503–3626, section 6.6 et figure 21. 2021 ESC Guidelines for the diagnosis and treatment of acute and chronic heart failure, Eur Heart J 2021;42:3599–3726, section 4.2 et tableau 7.</p></template>
