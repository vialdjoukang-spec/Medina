<template data-pop="i47-bilan-tv" data-title="Bilan après une tachycardie ventriculaire">
<div class="lab">Question posée</div><p>La plupart des TV monomorphes soutenues naissent d’une réentrée autour d’une cicatrice, plus rarement d’un foyer ou d’un système de conduction malade (ESC 2022). Le bilan cherche le substrat, une cause aiguë corrigeable et les éléments qui fixent le risque de récidive mortelle ; chaque examen répond à l’une de ces questions.</p>
<div class="lab">Électrocardiogrammes</div><p>L’ECG de la TV localise sa sortie : un aspect de chambre de chasse droite ou fasciculaire, sur cœur sain et sans histoire familiale, oriente vers une forme idiopathique, alors qu’une morphologie atypique fait chercher une cardiopathie même si l’échocardiographie est normale. En rythme sinusal, une onde Q signe une cicatrice d’infarctus ; une onde epsilon, activation tardive de la paroi du ventricule droit, oriente vers une cardiomyopathie arythmogène ; un QT long ou un aspect de Brugada, vers une canalopathie.</p>
<div class="lab">Échocardiographie</div><p>Elle mesure la FEVG, qui conditionne l’indication du DAI et interdit les bloqueurs sodiques quand elle est altérée, et cherche une hypertrophie, une dilatation ou un trouble segmentaire de la contraction.</p>
<div class="lab">Recherche coronaire</div><p>La coronarographie est faite lorsque l’évaluation initiale suggère une maladie coronaire. Une sténose découverte ne dispense pas d’évaluer le substrat, car la revascularisation seule ne prévient pas la récidive d’une TV monomorphe (ESC 2022).</p>
<div class="lab">IRM et biologie</div><p>L’<button class="w" data-k="i47-irm">IRM avec rehaussement tardif</button> est proposée en classe IIa lorsque l’échocardiographie suggère une cardiomyopathie ou reste normale malgré une TV atypique. La biologie dose le potassium et le magnésium, dont le déficit favorise la récidive et se corrige aussitôt, le peptide natriurétique et les hormones thyroïdiennes (ESC 2022).</p>
<div class="lab">Explorations invasives</div><p>Si l’évaluation non invasive ne conclut pas, l’EEP, la cartographie électroanatomique et une biopsie guidée par la cartographie peuvent être envisagées (classe IIb) ; une tomographie par émission de positons recherche une inflammation active.</p>
<div class="lab">Source</div><p>Zeppenfeld et al., 2022 ESC Guidelines for the management of patients with ventricular arrhythmias and the prevention of sudden cardiac death, European Heart Journal 2022;43:3997-4126, section 5.2.2, figure 4 et tableau de recommandations 4.</p>
