<div class="lab">Physiologie normale</div><p>La pompe sodium-potassium expulse le sodium du myocyte et y fait entrer le potassium. Le gradient de sodium qu’elle entretient permet à l’échangeur sodium-calcium de chasser le calcium après chaque contraction.</p>
<div class="lab">Mécanisme</div><p>La digoxine inhibe cette pompe. Le sodium s’accumule dans la cellule, l’échangeur expulse moins de calcium et le réticulum se charge : la contraction se renforce, c’est l’effet recherché. À dose toxique, la surcharge calcique provoque des libérations spontanées de calcium et des post-dépolarisations tardives : l’automatisme augmente dans les oreillettes, la jonction et les ventricules. La digoxine renforce aussi le tonus vagal sur les nœuds et ralentit la conduction.</p>
<div class="lab">Conséquence clinique</div><p>L’association d’un automatisme accru et d’un trouble de conduction signe l’intoxication : tachycardie atriale avec bloc, tachycardie jonctionnelle, extrasystoles ventriculaires fréquentes, bradycardies. La TV bidirectionnelle, plus rare, relève du même mécanisme de post-dépolarisations tardives que la TVPC. L’insuffisance rénale, qui réduit l’élimination de la digoxine, et l’hypokaliémie favorisent l’intoxication.</p>
<div class="lab">Ce qui change la décision</div><p>La conduite dépend de l’état clinique et du tracé plus que du dosage isolé. Les fragments d’anticorps antidigoxine fixent la molécule et sont réservés aux atteintes cardiovasculaires menaçantes. Le dosage sert aussi à ajuster le traitement : dans une analyse post hoc d’un grand essai d’insuffisance cardiaque, une concentration de 0,5 à 0,8 ng/mL s’associait, chez des hommes, à une mortalité plus basse que les concentrations plus élevées. Cette association ne prouve pas qu’un taux bas protège par lui-même.</p>
<div class="lab">Source</div><p>Smith, Digitalis: mechanisms of action and clinical use, N Engl J Med 1988;318:358-65 ; Ma et al., Electrocardiographic manifestations: digitalis toxicity, J Emerg Med 2001;20:145-52 ; Rathore et al., Association of serum digoxin concentration and outcomes in patients with heart failure, JAMA 2003;289:871-8.</p>
