<div class="lab">Physiologie normale</div><p><i>Candida</i> colonise le tube digestif, la peau et les muqueuses ; <i>Aspergillus</i> est un champignon de l’environnement, inhalé. L’intégrité des barrières et l’immunité cellulaire les empêchent d’envahir le sang.</p>
<div class="lab">Mécanisme</div><p>Le champignon entre dans le sang par un cathéter veineux central, une nutrition parentérale, l’injection de drogues ou à la faveur d’une immunosuppression. Il se fixe de préférence sur une prothèse ou un matériel, où il forme un biofilm. Les végétations fongiques sont souvent volumineuses et friables. <i>Aspergillus</i> pousse rarement dans les hémocultures : il cause une EI à hémocultures négatives (ESC 2023).</p>
<div class="lab">Conséquence clinique</div><p>Les champignons s’observent surtout dans l’EI sur prothèse, chez l’UDIV et chez l’immunodéprimé. <i>Candida</i> fait partie des germes associés au risque embolique. La mortalité dépasse 50 % (ESC 2023).</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2023 classe les champignons parmi les germes peu susceptibles d’être contrôlés par le traitement anti-infectieux seul : la chirurgie est recommandée, urgente ou non urgente selon l’état hémodynamique (classe I). Contre <i>Candida</i>, le traitement associe une échinocandine à forte dose ou une amphotéricine B liposomale, avec ou sans flucytosine ; contre <i>Aspergillus</i>, le voriconazole est le premier choix. Un azolé oral suppressif est ensuite poursuivi longtemps, parfois à vie, car la rechute est fréquente. L’infectiologue de l’équipe endocardite participe à chaque décision.</p>
<div class="lab">Source</div><p>Delgado et al., 2023 ESC Guidelines for the management of endocarditis, European Heart Journal 2023;44:3948–4042 (sections 7.11, 8.3.3.3 et 8.4.2, tableau de recommandations 12).</p></template>
