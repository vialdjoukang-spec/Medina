<div class="lab">Physiologie normale</div><p><i>S. aureus</i> est un commensal de la peau et des narines. Il reste à l’extérieur tant que la barrière cutanée est intacte. Il gagne le sang par une plaie, un cathéter, une aiguille d’injection ou une voie d’hémodialyse : ces portes d’entrée expliquent sa place dans l’EI associée aux soins et chez l’UDIV.</p>
<div class="lab">Mécanisme</div><p>Ses adhésines se lient au fibrinogène et à la fibronectine. Elles lui permettent d’adhérer à un endothélium intact et d’y pénétrer, donc d’infecter une valve saine. Une fois fixé, il sécrète des toxines qui lysent les cellules et des enzymes qui dégradent les tissus. La destruction est rapide : perforation des feuillets, abcès de l’anneau, fistule.</p>
<div class="lab">Conséquence clinique</div><p>L’EI à <i>S. aureus</i> évolue en quelques jours. Elle se complique plus souvent d’atteintes neurologiques que les EI dues à d’autres germes, et elle figure parmi les facteurs indépendants du risque embolique. Sur prothèse, sa mortalité dépasse 45 % (ESC 2023).</p>
<div class="lab">Ce qui change la décision</div><p>Une échocardiographie est à envisager dans toute bactériémie à <i>S. aureus</i> (ESC 2023, classe IIa), car une EI peut évoluer sans souffle ni signe périphérique. Contre une souche sensible à la méticilline, la (flu)cloxacilline ou la céfazoline sont préférées, car la vancomycine est moins efficace que les bêtalactamines. La gentamicine n’est plus recommandée sur valve native : elle augmente la toxicité rénale sans bénéfice démontré. Sur prothèse, la rifampicine s’ajoute après 3 à 5 jours de traitement efficace, une fois la bactériémie négativée : elle agit sur les bactéries dormantes du biofilm, mais antagonise les autres antibiotiques contre les bactéries en division. Une EI sur prothèse à <i>S. aureus</i> fait discuter une chirurgie urgente (classe IIa).</p>
<div class="lab">Source</div><p>Delgado et al., 2023 ESC Guidelines for the management of endocarditis, European Heart Journal 2023;44:3948–4042 (sections 5.4.1, 7.1, 7.6, 8.3.3.3, 8.4.2 et 9.1) ; Tong et al., Clinical Microbiology Reviews 2015;28:603–661 ; Holland et al., Nature Reviews Disease Primers 2016;2:16059.</p></template>
