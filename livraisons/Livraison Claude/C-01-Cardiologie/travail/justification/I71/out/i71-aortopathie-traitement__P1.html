<div class="lab">Mécanisme dans le Marfan</div><p>Le déficit en fibrilline-1 fragilise la média de la racine. Dans un modèle murin, la dilatation s’accompagnait d’une signalisation excessive du facteur de croissance transformant bêta, et le losartan, antagoniste du récepteur de type 1 de l’angiotensine II, la prévenait. Le bêtabloquant agit autrement : il réduit la fréquence et la pente de montée de la pression, donc la contrainte répétée sur la racine.</p>
<div class="lab">Bénéfice démontré</div><p>Chez l’enfant et l’adulte jeune, l’aténolol et le losartan n’ont pas différé dans leur effet sur la dilatation de la racine. Une méta-analyse sur données individuelles de sept essais (1 442 patients) montre que le sartan réduit d’environ moitié la progression annuelle du score z de la racine, y compris sous bêtabloquant ; l’effet du bêtabloquant est voisin. Le critère principal était la vitesse de dilatation : l’effet sur les dissections n’est pas établi.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2024 recommande un bêtabloquant ou un sartan à la dose maximale tolérée (classe I) et propose l’association (classe IIa). Les inhibiteurs calciques sont à éviter si possible, car ils ont été associés à un risque aortique accru chez la souris et dans des études cas-témoins. Pendant la grossesse, le bêtabloquant est recommandé et les sartans sont contre-indiqués (classe III) en raison de leur fœtotoxicité.</p>
<div class="lab">Ehlers-Danlos vasculaire</div><p>Le collagène de type III anormal ôte leur résistance aux artères de moyen calibre. Le céliprolol bloque les récepteurs β1 et stimule partiellement les récepteurs β2. Dans l’essai ouvert BBEST, chez 53 patients, les ruptures ou dissections artérielles sont passées de 50 % à 20 % (rapport de risque 0,36), et l’essai a été arrêté tôt pour bénéfice. Le mécanisme de cet effet n’est pas établi et l’essai reste petit : l’ESC 2024 le recommande en classe IIa.</p>
<div class="lab">Source</div><p>ESC 2024 (Mazzolai et al.), sections 10.1.2 et 10.1.3, tableaux de recommandations 59, 61 et 63 ; Habashi et al., Science 2006 ; Lacro et al., New England Journal of Medicine 2014 ; Pitcher et al., Lancet 2022 ; Ong et al., Lancet 2010.</p></template>
