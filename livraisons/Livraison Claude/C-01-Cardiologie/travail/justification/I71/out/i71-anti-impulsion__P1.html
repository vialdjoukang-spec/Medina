<div class="lab">Physiologie normale</div><p>À chaque systole, l’éjection du ventricule gauche met l’aorte en charge. La sollicitation de la paroi dépend du niveau de pression, du rayon de l’aorte, de la vitesse de montée de la pression (dP/dt), qui suit la contractilité, et du nombre de cycles par minute.</p>
<div class="lab">Mécanisme</div><p>Dans une dissection, chaque onde systolique pousse du sang dans le faux chenal et peut prolonger le décollement de la média. Le bêtabloquant diminue la fréquence et la contractilité, donc le nombre de mises en charge et leur brutalité ; la baisse de la pression systolique réduit ensuite la contrainte pariétale. Un vasodilatateur seul fait baisser la pression, ce que perçoivent les barorécepteurs : la réponse sympathique accélère le cœur et renforce sa contraction, ce qui annule une partie du bénéfice.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2024 recommande un traitement immédiat visant une pression systolique inférieure à 120 mmHg et une fréquence d’au plus 60/min (classe I, niveau B). Le bêtabloquant intraveineux vient d’abord ; un vasodilatateur ne s’ajoute que si la cible tensionnelle n’est pas atteinte. Une ligne artérielle et une surveillance en soins intensifs sont recommandées, car ces médicaments se titrent minute par minute. Le relais oral se fait après 24 heures si le transit digestif est conservé.</p>
<div class="lab">Limites</div><p>Ces cibles reposent sur des études observationnelles, où un contrôle strict de la fréquence s’associait à moins de complications, et non sur un essai randomisé. Le but reste la pression la plus basse qui maintient la perfusion des organes. Ce traitement stabilise le patient, mais il ne remplace ni la chirurgie d’un type A ni l’endoprothèse d’un type B compliqué.</p>
<div class="lab">Source</div><p>ESC 2024 (Mazzolai et al.), section 9.3.1.4.1, tableau de recommandations 45 et figure 31 ; Kodama et al., Circulation 2008.</p></template>
