<div class="lab">Principe</div><p>Un dépistage réduit la mortalité si la maladie est fréquente dans la population visée, longtemps silencieuse, facile à mesurer, et si un traitement précoce change son évolution. L’anévrisme de l’aorte abdominale remplit ces conditions : il reste asymptomatique dans deux cas sur trois, grossit d’environ 3 mm par an, et sa rupture tue plus de 80 % des patients, alors qu’une réparation programmée a une mortalité de quelques pourcents.</p>
<div class="lab">Pourquoi l’échographie, et pourquoi une fois</div><p>L’échographie mesure l’aorte sans irradiation ni produit de contraste, avec une sensibilité et une spécificité supérieures à 97 %. Une aorte de moins de 25 mm a un faible risque de devenir un grand anévrisme dans les dix ans : à 65 ans, un examen normal suffit donc le plus souvent. Chez un apparenté examiné jeune, l’examen se répète, car la maladie apparaît plus tard.</p>
<div class="lab">Bénéfice démontré</div><p>Dans l’essai MASS, l’invitation des hommes de 65 à 74 ans a réduit de 42 % la mortalité liée à l’anévrisme, et de 53 % chez ceux qui se sont présentés. Le bénéfice passe par la réparation programmée : la mortalité à 30 jours y était de 6 %, contre 37 % après chirurgie d’urgence. Il faut aujourd’hui dépister environ 667 hommes pour éviter un décès prématuré lié à l’anévrisme.</p>
<div class="lab">Pourquoi ces populations</div><p>Le bénéfice dépend de la prévalence. Il est démontré chez l’homme fumeur ou ancien fumeur de 65 ans ou plus (classe I). Il n’a pas été retrouvé chez les femmes de 65 à 74 ans fumeuses ou coronariennes, où la prévalence reste basse ; après 75 ans, presque toutes les femmes victimes de rupture étaient fumeuses ou hypertendues, d’où un dépistage seulement envisageable chez elles (classe IIb). Les apparentés au premier degré, surtout les frères et sœurs, ont un risque environ doublé selon une étude de population, à partir de 50 ans (classe I). Chez l’artériopathe symptomatique, l’incidence cumulée atteint 12 % (classe IIa).</p>
<div class="lab">Limites</div><p>Le dépistage double environ le nombre de réparations programmées, avec leur morbidité, et peut altérer la qualité de vie. Avec la baisse de la prévalence, son bénéfice absolu diminue, et l’ESVS 2024 recommande d’adapter les programmes aux conditions locales.</p>
<div class="lab">Source</div><p>ESC 2024 (Mazzolai et al.), section 6.2.1 et tableau de recommandations 6 ; Ashton et al., Lancet 2002 (essai MASS) ; ESVS 2024 (Wanhainen et al.), sections 3.2 et 3.3.</p></template>
