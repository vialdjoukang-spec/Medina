<div class="lab">Principe</div><p>Une chirurgie préventive se justifie quand le risque annuel de dissection ou de rupture dépasse le risque de l’opération. Le diamètre reste le premier déterminant de ces complications, car la contrainte pariétale croît avec le rayon d’une paroi dont la média est déjà dégénérée.</p>
<div class="lab">Aorte ascendante</div><p>À 57,5 mm, les taux annuels rapportés de rupture, de dissection et de décès atteignent 3,6 %, 3,7 % et 10,8 %. Le risque de complication dépasse 1 % par an entre 50 et 54 mm, avec un point critique vers 52 à 53 mm, alors que les centres expérimentés rapportent moins de 1 % de mortalité pour la chirurgie programmée. C’est pourquoi l’ESC 2024 garde 55 mm (classe I) et propose 52 mm pour l’aorte tubulaire quand le risque opératoire est inférieur à 3 % (classe IIa).</p>
<div class="lab">Ce qui abaisse le seuil</div><p>Une croissance d’au moins 3 mm par an signale une paroi qui cède. Le phénotype de racine progresse plus vite et dissèque plus souvent. Une aorte ascendante de 13 cm ou plus multiplie par près de cinq le risque annuel par rapport à moins de 9 cm. Chez un patient de moins de 1,69 m, un même diamètre représente une dilatation relative plus forte. Avec ces facteurs, ou un âge inférieur à 50 ans, une hypertension résistante, une coarctation ou un désir de grossesse, une chirurgie peut être envisagée dès 50 mm (classe IIb).</p>
<div class="lab">Limites</div><p>La plupart des dissections de type A surviennent sous 55 mm : plus de 60 % des patients sans Marfan ni bicuspidie avaient une aorte non dilatée, et l’aorte mesurée après la dissection est 25 à 30 % plus large qu’avant. Un seuil de diamètre ne protège donc qu’une partie des patients, et l’indexation ne prédit pas mieux le risque dans la population générale.</p>
<div class="lab">Aorte descendante</div><p>À 60 mm, un anévrisme de l’aorte descendante rompt dans environ 10 % des cas par an, d’où une réparation dès 55 mm (classe I). L’endoprothèse est préférée si l’anatomie le permet, avec une mortalité d’environ 6 % et une ischémie médullaire d’environ 3 %, contre environ 10 % et 11 à 15 % en chirurgie ouverte hors centres expérimentés ; dans les maladies héréditaires, la chirurgie ouverte est préférée.</p>
<div class="lab">Source</div><p>ESC 2024 (Mazzolai et al.), sections 9.2.2 et 9.2.5, tableaux de recommandations 38 et 40, figure 23.</p></template>
