<div class="lab">Principe</div><p>L’endoprothèse ne retire pas l’anévrisme. Ancrée dans l’aorte saine au-dessus et dans les iliaques en dessous, elle exclut le sac de la circulation : privé de pression, le sac thrombose et se rétracte habituellement.</p>
<div class="lab">Mécanisme</div><p>Une endofuite est un flux persistant entre la prothèse et la paroi du sac. Le type I naît d’un défaut d’étanchéité à l’ancrage proximal (Ia) ou distal (Ib) ; le type II, d’un reflux par des branches de l’aorte ; le type III, d’un défaut ou d’une séparation des modules ; le type IV, de la porosité du tissu prothétique. Le type V, ou endotension, fait grossir le sac sans fuite visible.</p>
<div class="lab">Conséquence clinique</div><p>Les types I et III remettent le sac sous pression systémique : il regrossit et peut rompre. Le type II, présent chez environ un quart des patients, se tarit spontanément dans environ la moitié des cas et expose peu à la rupture tant que le sac ne grossit pas. Les endofuites sont la complication la plus fréquente, jusqu’à un tiers des procédures ; l’anticoagulation au long cours favorise celles de type II et s’associe à davantage de réinterventions.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2024 recommande de réintervenir en cas d’endofuite de type I ou III (classe I). Pour un type II ou V, une embolisation ou une réintervention se discute si le sac a grossi d’au moins 10 mm (classe IIa) ; le type IV, rare avec les prothèses modernes, ne demande pas de geste. La surveillance associe angioscanner et échographie Doppler à 1 et 12 mois, puis une échographie annuelle et un angioscanner ou une IRM tous les 5 ans si tout reste normal (classe I).</p>
<div class="lab">Pourquoi à vie</div><p>Dans les essais, l’avantage de survie de l’endoprothèse s’efface après environ 8 ans, avec davantage de ruptures tardives. La plupart des échecs apparaissent toutefois tôt : chez un patient à faible risque, sans endofuite et dont le sac s’est rétracté d’au moins 10 mm, l’ESVS 2024 admet de ne refaire l’imagerie que cinq ans après l’intervention, puis tous les cinq ans.</p>
<div class="lab">Source</div><p>ESC 2024 (Mazzolai et al.), sections 9.2.6 et 9.2.7, tableaux de recommandations 42 et 43, figure 27 ; ESVS 2024 (Wanhainen et al.), sections 7.2.6 et 7.4.</p></template>
