<div class="lab">Physiologie normale</div><p>En position assise ou debout, la pression artérielle dépend du tonus des vaisseaux et du retour veineux. Le baroréflexe corrige en quelques secondes toute baisse de pression en accélérant le cœur et en contractant les vaisseaux. Un cœur sain peut aussi augmenter son volume d’éjection.</p>
<div class="lab">Mécanisme</div><p>La douleur, la peur et une injection longue et visqueuse déclenchent un réflexe vasovagal : le tonus vagal augmente, le tonus sympathique s’effondre, d’où une bradycardie et une vasodilatation. Chez le sujet sain, la position couchée rétablit la perfusion en quelques minutes. Dans un rétrécissement mitral serré, une sténose aortique, une fuite aortique sévère, une hypertension pulmonaire ou une dysfonction ventriculaire, le débit cardiaque ne peut pas augmenter. La chute de pression réduit alors la perfusion coronaire et cérébrale et peut aboutir à un collapsus irréversible. Ce mécanisme est supposé, non démontré : sur dix accidents graves après l’injection, dont huit décès, trois seulement remplissaient les critères d’une anaphylaxie.</p>
<div class="lab">Conséquence clinique</div><p>L’anaphylaxie existe aussi : environ 3,2 % de réactions allergiques et 0,2 % d’anaphylaxies dans les séries mondiales, surtout dans les 15 minutes qui suivent l’injection. Elle associe urticaire, bronchospasme et hypotension avec tachycardie. Le malaise vagal associe pâleur, bradycardie et récupération rapide en décubitus, sauf chez le patient valvulaire sévère.</p>
<div class="lab">Ce qui change la décision</div><p>Avant chaque injection, demander s’il existe un vertige, une douleur thoracique ou une dyspnée croissante ; si oui, ne pas injecter et demander un avis médical. Injecter le patient couché, le laisser au repos quelques minutes, lui proposer à boire et à manger, et traiter la douleur. Garder de l’adrénaline intramusculaire à portée, traitement de première ligne de l’anaphylaxie. En cas de valvulopathie sévère ou de dysfonction ventriculaire, l’AHA 2022 recommande d’envisager fortement la prophylaxie orale. Pour la grande majorité des patients, le risque de l’injection reste bien inférieur à celui d’une cardiopathie rhumatismale sans prophylaxie.</p>
<div class="lab">Source</div><p>Sanyahumbi et al., J Am Heart Assoc 2022;11:e024517 ; Marantelli et al., Heart Asia 2019;11:e011191 ; recommandations australiennes 2025, chapitre 10, encadrés 10.2 et 10.3.</p></template>
