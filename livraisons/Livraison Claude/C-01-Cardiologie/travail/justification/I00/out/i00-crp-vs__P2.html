<div class="lab">Physiologie normale</div><p>La CRP est une protéine de la phase aiguë. Les hépatocytes la synthétisent sous l’effet de l’interleukine 6, quelques heures après le début d’une inflammation. Sa demi-vie plasmatique, d’environ 19 heures, ne varie pas avec la maladie : sa concentration reflète donc le débit de synthèse du moment. La vitesse de sédimentation mesure la hauteur dont les hématies tombent en une heure dans un tube. Normalement, les charges négatives de leur membrane les tiennent écartées les unes des autres, et elles sédimentent lentement.</p>
<div class="lab">Mécanisme</div><p>Le fibrinogène et les immunoglobulines neutralisent ces charges. Les hématies s’empilent alors en rouleaux, plus lourds, qui tombent plus vite. Le fibrinogène s’élève en quelques jours et décroît lentement : la vitesse de sédimentation suit l’inflammation avec un retard de plusieurs jours à semaines. Elle dépend aussi des hématies elles-mêmes : l’anémie l’accélère, la polyglobulie la ralentit. La grossesse et l’insuffisance rénale l’augmentent par la hausse du fibrinogène et l’anémie. Dans le lupus, l’excès d’immunoglobulines accélère la sédimentation alors que la CRP reste souvent peu élevée. L’explication probable est que l’interféron alpha, abondant pendant les poussées lupiques, freine la synthèse hépatique de la CRP ; ce frein a été démontré sur des hépatocytes en culture.</p>
<div class="lab">Conséquence clinique</div><p>Au début d’une arthrite ou d’une cardite, la CRP monte la première ; sous traitement, elle baisse en quelques jours, alors que la vitesse de sédimentation reste élevée plus longtemps. La CRP est donc le meilleur marqueur de suivi. Dans la chorée, qui survient quand l’inflammation systémique est éteinte, les deux sont souvent normales.</p>
<div class="lab">Ce qui change la décision</div><p>Avant de compter une vitesse de sédimentation comme critère mineur, vérifier l’hémoglobine, la grossesse et la fonction rénale, qui peuvent l’élever sans inflammation. Pendant le traitement, la baisse de la CRP accompagne la décroissance de l’anti-inflammatoire, mais aucun seuil n’est validé pour décider de l’arrêt.</p>
<div class="lab">Source</div><p>Pepys et Hirschfield, J Clin Invest 2003;111:1805-12 ; Bray et al., Wisconsin Medical Journal 2016;115:317-21 ; Enocsson et al., Arthritis Rheum 2009;60:3755-60 ; recommandations australiennes 2025, tableau 6.8 et chapitre 7.</p></template>
