<template data-pop="i80-doses" data-title="Doses des anticoagulants : raison de chaque palier"><div class="lab">Phase initiale renforcée</div><p>La phase initiale vise à stopper l’extension du thrombus et à prévenir l’embolie, au moment où ces risques sont les plus élevés. L’apixaban (10 mg deux fois par jour pendant 7 jours) et le rivaroxaban (15 mg deux fois par jour pendant 21 jours) commencent donc à dose plus forte, ce qui remplace l’héparine initiale. Le dabigatran et l’édoxaban ont été étudiés après au moins 5 jours d’héparine : sans cette phase parentérale, leur efficacité initiale n’est pas démontrée.</p>
<div class="lab">Rivaroxaban et repas</div><p>À jeun, le comprimé de 20 mg n’est absorbé qu’à 66 % ; un repas augmente l’exposition d’environ 39 %. Les doses de 15 et 20 mg se prennent donc pendant un repas, alors que la dose de 10 mg s’absorbe bien dans les deux cas.</p>
<div class="lab">Ajustements</div><p>L’édoxaban passe à 30 mg si la clairance est de 15 à 50 mL/min, si le poids est de 60 kg ou moins, ou avec la ciclosporine, la dronédarone, l’érythromycine ou le kétoconazole, car chacune de ces situations augmente son exposition. Le dabigatran, éliminé à 80 % par le rein, passe à 110 mg deux fois par jour dès 80 ans ou avec le vérapamil ; la dose réduite se discute aussi entre 75 et 80 ans, avec une clairance de 30 à 50 mL/min ou un risque hémorragique élevé. Dans la thrombose, l’apixaban ne se réduit pas selon la fonction rénale, contrairement à la fibrillation auriculaire ; il s’utilise avec prudence entre 15 et 29 mL/min. L’énoxaparine et le fondaparinux s’accumulent dans l’insuffisance rénale ; le fondaparinux est contre-indiqué sous 30 mL/min et se dose selon trois paliers de poids.</p>
<div class="lab">Cancer</div><p>La daltéparine se donne à 200 UI/kg par jour le premier mois, puis environ 150 UI/kg. Ce schéma est celui de l’essai de Lee et al. (2003), où il a réduit la récidive à 6 mois de 17 % à 9 % par rapport à un antivitamine K, sans plus d’hémorragies majeures.</p>
<div class="lab">Antivitamine K</div><p>L’antivitamine K abaisse d’abord le facteur VII et la protéine C, de demi-vie courte, puis seulement la prothrombine, qui persiste 60 à 72 heures. L’héparine est donc maintenue au moins 5 jours et jusqu’à un INR supérieur à 2 sur deux jours consécutifs.</p>
<div class="lab">Prolongation</div><p>Après 6 mois, la <button class="w" data-k="i80-duree">dose réduite</button> d’apixaban ou de rivaroxaban garde l’efficacité de la pleine dose chez les patients sans très haut risque.</p>
<div class="lab">Source</div><p>Recommandations ESVS 2021 sur les thromboses veineuses, sections 2.3.1 à 2.3.3 et 2.3.7.3.2, tableau 8 ; résumés des caractéristiques de Xarelto, Lixiana et Pradaxa, Agence européenne des médicaments ; Lee et al., <i>New England Journal of Medicine</i> 2003 ; Ageno et al., <i>Chest</i> 2012.</p></template>
