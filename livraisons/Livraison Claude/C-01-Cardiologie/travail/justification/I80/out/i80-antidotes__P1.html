<template data-pop="i80-antidotes" data-title="Antidotes des anticoagulants : comment chacun agit"><div class="lab">Principe</div><p>Les anticoagulants oraux directs ont une demi-vie courte : devant un saignement qui ne menace pas la vie, l’arrêt, les mesures locales et la correction de la volémie suffisent souvent. L’antidote se réserve à l’hémorragie menaçant la vie ou à la chirurgie urgente.</p>
<div class="lab">Idarucizumab</div><p>Ce fragment d’anticorps monoclonal humanisé fixe le dabigatran avec une très forte affinité et l’empêche d’atteindre la thrombine. Deux injections de 2,5 g neutralisent rapidement l’effet : chez plus de 500 patients, la réversion médiane a été complète et le saignement s’est arrêté en 2,5 heures en médiane.</p>
<div class="lab">Andexanet alfa</div><p>Ce facteur Xa recombinant modifié, privé d’activité procoagulante, sert de leurre : il capte l’apixaban et le rivaroxaban à la place du vrai facteur Xa. Après le bolus, l’activité anti-Xa a baissé de 92 % ; elle remonte en partie après la perfusion de 2 heures. Dans l’étude de référence, l’hémostase a été bonne ou excellente chez 82 % des patients, mais 10 % ont fait une thrombose dans les 30 jours.</p>
<div class="lab">Concentré de complexe prothrombinique et vitamine K</div><p>Le concentré à quatre facteurs apporte les facteurs II, VII, IX et X que l’antivitamine K a rendus inactifs, et corrige l’INR sans attendre. La vitamine K relance leur synthèse fonctionnelle, mais l’INR met jusqu’à 24 heures ou davantage à se normaliser : dans une hémorragie majeure, les deux s’associent (25 à 50 UI/kg de concentré et 5 mg de vitamine K intraveineuse). Face à un anti-Xa oral, le concentré, à 50 UI/kg, sert d’alternative quand l’andexanet manque.</p>
<div class="lab">Protamine</div><p>Fortement chargée positivement, la protamine se lie aux chaînes négatives de l’héparine. Elle neutralise complètement l’héparine non fractionnée, à raison d’environ 1 mg pour 100 UI. Elle ne neutralise que l’activité anti-IIa des héparines de bas poids moléculaire, donc partiellement leur effet, car leurs petites chaînes anti-Xa lui échappent ; elle n’agit pas sur le fondaparinux.</p>
<div class="lab">Source</div><p>Recommandations ESVS 2021 sur les thromboses veineuses, section 2.3.4.2, tableaux 9 et 10.</p></template>
