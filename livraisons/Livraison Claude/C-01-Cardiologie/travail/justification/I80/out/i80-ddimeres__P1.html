<template data-pop="i80-ddimeres" data-title="D-dimères : ce que le dosage exclut et ce qu’il n’exclut pas"><div class="lab">Physiologie normale</div><p>La thrombine transforme le fibrinogène en fibrine, puis le facteur treize activé relie les molécules de fibrine entre elles. Quand la plasmine dégrade ce réseau stabilisé, elle libère des fragments qui portent deux domaines D encore liés : les D-dimères. Leur présence prouve qu’un caillot s’est formé puis a commencé à être dégradé, quel qu’en soit le siège.</p>
<div class="lab">Pourquoi un résultat négatif exclut</div><p>Une thrombose récente s’accompagne d’une fibrinolyse active : le dosage quantitatif est positif dans environ 95 % des cas. Sa valeur dépend pourtant de la probabilité avant le test. Avec une spécificité de 45 %, un résultat négatif laisse un risque résiduel d’environ 0,6 % quand 5 % des patients ont une thrombose, mais d’environ 4,5 % quand 30 % en ont une. Le premier risque est acceptable, le second ne l’est pas : le dosage n’exclut la thrombose que chez le patient peu probable au <button class="w" data-k="i80-wells">score de Wells</button>. Dans l’étude Palladio, cette combinaison n’a laissé que moins de 0,3 % d’événements à 3 mois.</p>
<div class="lab">Pourquoi le seuil s’ajuste à l’âge</div><p>Les D-dimères s’élèvent avec l’âge sans thrombose ; au-delà de 80 ans, la spécificité du seuil de 500 µg/L tombe à 10 %. Le seuil « âge × 10 » après 50 ans corrige cette dérive. Dans l’étude ADJUST-PE, menée dans la suspicion d’embolie pulmonaire, il a porté de 6,4 % à 29,7 % la part des patients de 75 ans ou plus exclus sans imagerie ; parmi les patients dont le résultat se situait entre 500 µg/L et leur seuil ajusté, un seul sur 331 a fait un événement à 3 mois.</p>
<div class="lab">Situations où le dosage sert peu</div><p>Le cancer, l’hospitalisation, une infection, l’inflammation et la grossesse produisent de la fibrine sans thrombose. Pour l’embolie pulmonaire, il faut alors doser les D-dimères chez 10 patients ou plus pour en exclure un seul, contre 3 aux urgences en général. Pendant la grossesse, un résultat négatif n’a pas exclu la maladie dans une grande étude, et l’ESVS 2021 y déconseille le dosage.</p>
<div class="lab">Ce qui change la décision</div><p>Un résultat négatif, chez un patient à faible probabilité, dispense d’échographie et d’anticoagulation. Un résultat positif ne prouve rien : il conduit à l’échographie. Chez le patient à probabilité élevée, le dosage est omis et l’échographie est demandée d’emblée.</p>
<div class="lab">Source</div><p>Recommandations ESVS 2021 sur les thromboses veineuses, sections 2.2.1.2, 2.2.1.3 et 4.2.2, recommandation 60 ; recommandations ESC 2019 sur l’embolie pulmonaire, sections 4.4 et 4.4.1 ; Righini et al., <i>JAMA</i> 2014.</p></template>
