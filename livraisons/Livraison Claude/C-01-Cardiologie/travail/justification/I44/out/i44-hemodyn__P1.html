<div class="lab">Physiologie normale</div><p>Le débit cardiaque est le produit de la fréquence par le volume d’éjection : 70/min × 70 mL donnent environ 5 L/min chez l’adulte au repos. Le ventricule se remplit surtout de façon passive, au début de la diastole. La contraction auriculaire ajoute ensuite jusqu’à 20 % environ du remplissage. Plus le ventricule est rempli en fin de diastole, plus il éjecte un grand volume : c’est la loi de Frank et Starling.</p>
<div class="lab">Mécanisme</div><p>Une fréquence basse allonge la diastole. Le ventricule se remplit davantage et éjecte un plus grand volume, ce qui maintient le débit au repos. Cette compensation plafonne vite : le remplissage tardif ajoute peu de sang, et la distensibilité du ventricule limite son volume. Un ventricule hypertrophié ou rigide, fréquent chez le sujet âgé, atteint cette limite plus tôt. À l’effort, une fréquence fixée par un bloc complet, un bloc 2:1 ou une incompétence chronotrope empêche le débit de suivre les besoins. En cas de dissociation auriculoventriculaire, la systole auriculaire tombe au hasard dans le cycle. Juste avant le QRS, elle complète le remplissage ; pendant la systole ventriculaire, elle est perdue et reflue dans les veines jugulaires.</p>
<div class="lab">Conséquence clinique</div><p>Le grand volume d’éjection élargit la pression différentielle et peut produire un souffle éjectionnel fonctionnel. La pression systolique varie d’un battement à l’autre, au gré de la contribution auriculaire. Pendant les longues diastoles, la pression diastolique aortique, qui perfuse les coronaires, s’abaisse, alors que le grand volume éjecté augmente le travail du ventricule : un angor peut apparaître, surtout en présence de sténoses coronaires. À l’effort, le débit insuffisant se traduit par une fatigue et une dyspnée. Un bas débit prolongé active les systèmes rénine-angiotensine-aldostérone et sympathique, qui retiennent le sel et l’eau : l’insuffisance cardiaque s’installe, surtout dans le BAV chronique.</p>
<div class="lab">Ce qui change la décision</div><p>Ces symptômes sont peu spécifiques chez le sujet âgé. Ils ne sont attribués à la bradycardie que si le rythme est enregistré pendant le symptôme, ou si l’épreuve d’effort montre une fréquence insuffisante. La stimulation rétablit la fréquence, donc le débit d’effort. En rythme sinusal, le mode double chambre restaure aussi la contribution auriculaire : c’est l’une des raisons de le préférer lorsque la stimulation ventriculaire sera fréquente.</p>
<div class="lab">Source</div><p>Hall, Guyton and Hall Textbook of Medical Physiology, 14e éd., chapitres sur le cœur comme pompe et sur le débit cardiaque ; Glikson et al., 2021 ESC Guidelines on cardiac pacing and cardiac resynchronization therapy, Eur Heart J 2021;42:3427-3520, section 5.2.</p>
