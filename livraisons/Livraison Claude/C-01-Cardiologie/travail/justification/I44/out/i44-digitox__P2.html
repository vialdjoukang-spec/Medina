<div class="lab">Physiologie normale</div><p>La pompe sodium-potassium expulse le sodium du myocyte et y fait entrer le potassium. Le gradient de sodium qu’elle entretient permet à l’échangeur sodium-calcium d’expulser le calcium à chaque battement.</p>
<div class="lab">Mécanisme</div><p>La digoxine se fixe sur la pompe et l’inhibe. Le sodium intracellulaire s’élève, l’échangeur expulse moins de calcium et le calcium cellulaire augmente : c’est l’effet inotrope. La digoxine renforce aussi le tonus vagal sur le sinus et le nœud. En excès, la surcharge calcique déclenche des post-dépolarisations retardées, alors que l’effet vagal et l’effet direct ralentissent la conduction nodale. La toxicité associe donc un automatisme accru et une conduction retardée.</p>
<div class="lab">Conséquence clinique</div><p>Ce double effet explique les tracés évocateurs : tachycardie atriale avec bloc, tachycardie jonctionnelle, extrasystoles ventriculaires fréquentes, tachycardie ventriculaire bidirectionnelle, bradycardie et BAV.</p>
<div class="lab">Rôle du potassium</div><p>Le potassium et la digoxine se disputent le même site de la pompe : une hypokaliémie favorise la fixation de la digoxine et rend toxique une digoxinémie habituelle. À l’inverse, une intoxication aiguë massive bloque assez de pompes pour que le potassium ne rentre plus dans les cellules : l’hyperkaliémie mesure alors la gravité. Elle était liée à la mortalité avant l’ère des fragments d’anticorps, et une kaliémie supérieure à 5,5 mmol/L avec une toxicité évolutive en est une indication.</p>
<div class="lab">Ce qui change la décision</div><p>Les fragments d’anticorps sont le traitement de première intention d’une toxicité menaçante. La stimulation endocavitaire est évitée : dans une série de 92 intoxications, elle a provoqué des accidents chez 36 % des patients stimulés, mortels chez 13 %, alors que les fragments n’ont causé aucun accident grave. On corrige l’hypokaliémie et l’hypomagnésémie, puis l’on cherche le facteur déclenchant : insuffisance rénale, déshydratation, interaction avec l’amiodarone ou un macrolide.</p>
<div class="lab">Source</div><p>Smith, Digitalis: mechanisms of action and clinical use, N Engl J Med 1988;318:358–365 ; Ma et al., Electrocardiographic manifestations: digitalis toxicity, J Emerg Med 2001;20:145–152 ; Bismuth et al., Hyperkalemia in acute digitalis poisoning: prognostic significance and therapeutic implications, Clin Toxicol 1973;6:153–162 ; Taboulet et al., Acute digitalis intoxication: is pacing still appropriate?, J Toxicol Clin Toxicol 1993;31:261–273 ; information professionnelle américaine des fragments d’anticorps antidigoxine ovins (2026).</p>
