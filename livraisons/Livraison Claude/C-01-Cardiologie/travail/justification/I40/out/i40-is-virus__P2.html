<div class="lab">Physiologie normale</div><p>L’élimination d’un virus du myocarde repose sur les interférons de type I, les cellules tueuses naturelles et les lymphocytes T cytotoxiques, qui détruisent les cellules infectées. Une fois le virus éliminé, la réponse s’éteint.</p>
<div class="lab">Mécanisme</div><p>Les corticoïdes et les immunosuppresseurs réduisent la production d’interférons et la prolifération des lymphocytes T. Si le virus se réplique encore, il infecte davantage de cardiomyocytes, et les virus cytolytiques comme les entérovirus les détruisent directement. Chez la souris infectée par le virus Coxsackie B3, une immunosuppression par ciclosporine débutée avec l’infection a augmenté les titres viraux et la mortalité, 40 % contre 4 % à trois semaines (Cabinian et al., 1990) ; donnée après la phase virémique, la ciclosporine ne modifiait plus la survie (Kishimoto et Abelmann, 1989). Quand le virus a disparu, l’inflammation qui persiste est entretenue par une auto-immunité, cible même de l’immunosuppression.</p>
<div class="lab">Conséquence clinique</div><p>Une même image d’inflammation peut donc relever de deux mécanismes opposés. Seule la biopsie les distingue, avec l’immunohistochimie et une PCR virale faite sur le myocarde et sur le sang, pour écarter une simple virémie.</p>
<div class="lab">Ce qui change la décision</div><p>L’ESC 2025 exige d’écarter le virus par la biopsie avant toute immunosuppression d’une myocardite lymphocytaire. Dans la cardiomyopathie inflammatoire virus négative, l’immunosuppression guidée par la biopsie est à envisager (classe IIa, niveau B). L’essai TIMIC a inclus 85 patients en insuffisance cardiaque depuis plus de 6 mois, sans génome viral : prednisone et azathioprine pendant 6 mois ont amélioré la FEVG, qui s’est dégradée sous placebo. Dans une myocardite aiguë à fonction ventriculaire conservée, l’immunosuppression systématique n’est pas recommandée (classe III), faute de bénéfice démontré.</p>
<div class="lab">Source</div><p>ESC 2025 sur les myocardites et péricardites, sections 6.2.1, 9.5.1 et 10.3, recommandations 9 et 19 ; Frustaci et al., Eur Heart J 2009;30:1995-2002 ; Cabinian et al., J Lab Clin Med 1990;115:454-62 ; Kishimoto et Abelmann, Circ Res 1989;65:934-45.</p></template>
