<section class="ilot" id="i89-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme L., 52 ans, enseignante et droitière, consulte parce que son bras gauche est lourd et tendu depuis 4 mois. Le soir, sa bague serre et la manche de ses vêtements devient étroite. Après une nuit, la gêne diminue nettement. Elle n’a pas eu de fièvre.</p>
<p>Vingt mois plus tôt, elle a été traitée pour un cancer du sein gauche. Elle a eu une tumorectomie et un curage axillaire des niveaux I et II : 16 ganglions ont été retirés, dont 3 étaient envahis. Une chimiothérapie adjuvante comprenant du docétaxel a suivi, puis une radiothérapie du sein et de la région sus-claviculaire gauche. Elle prend du létrozole. Avant l’opération, le volume de ses bras avait été mesuré : 2 480 mL à gauche et 2 500 mL à droite.</p>
<p>Elle pèse 82 kg pour 1,63 m, soit un IMC de 30,9 kg/m² ; elle pesait 81 kg avant l’opération. La pression artérielle est de 132/80 mmHg, la fréquence cardiaque de 72/min et la température de 36,8 °C. L’avant-bras gauche garde l’empreinte du doigt, mais un pli cutané se soulève normalement à la base des doigts. La peau est normale. Aucune adénopathie sus-claviculaire ni axillaire n’est palpable, aucune veine collatérale ne se dessine sur le thorax, et l’examen neurologique du membre est normal.</p>
<p>La question qui structure le cours est la suivante : <b>s’agit-il d’un lymphœdème, à quel stade, quelle cause grave faut-il d’abord éliminer, quel traitement proposer, comment prévenir l’aggravation et les infections, et que rembourse l’assurance obligatoire des soins ?</b></p>
<p>Après ce cours, le médecin assistant sait distinguer un œdème lymphatique d’un œdème par excès de filtration. Il sait classer un lymphœdème par son stade et quantifier sa sévérité par l’excès de volume. Il sait reconnaître les signes qui imposent de rechercher une récidive tumorale ou une thrombose. Il sait ensuite choisir entre compression seule, thérapie décongestive complexe et chirurgie, prévenir les érysipèles et identifier les prestations remboursées en Suisse. Il sait aussi reconnaître les atteintes lymphatiques centrales, dont le chylothorax.</p>
<div class="key"><b>Prérequis.</b> Le cours suppose connues la <button class="w" data-k="i89-s-lymphangion">propulsion de la lymphe par les lymphangions (fenêtre de sciences)</button> et la distinction entre les <button class="w" data-k="i89-debit">œdèmes à bas débit, à haut débit et mixtes (définitions et conséquences)</button>.</div>
</section>

<section class="ilot" id="i89-1"><h2><span class="n">1</span>Définitions, classification et codage</h2>
<p>Le <b>lymphœdème</b> est la manifestation d’une insuffisance du système lymphatique : le transport de la lymphe est réduit (ISL 2023). La charge de liquide filtré par les capillaires reste normale, mais les lymphatiques ne l’évacuent plus entièrement. L’ISL nomme cette situation une défaillance « à bas débit », ou insuffisance mécanique. Le liquide qui s’accumule est relativement riche en protéines, parce que les protéines filtrées ne peuvent quitter l’interstitium que par la lymphe.</p>
<p>L’œdème « à haut débit » obéit au mécanisme inverse. Des lymphatiques sains sont débordés par une filtration excessive, comme dans la cirrhose, le syndrome néphrotique, l’insuffisance cardiaque droite ou l’insuffisance veineuse de jambe. Quand cette surcharge dure, les lymphatiques s’épuisent à leur tour et une <b>forme mixte</b> apparaît. La distinction n’est pas théorique : un diurétique réduit la filtration excessive d’un œdème à haut débit, mais il ne restaure pas le transport lymphatique. Les <button class="w" data-k="i89-debit">trois mécanismes et leurs exemples (fenêtre)</button> sont détaillés à part.</p>
<div class="two">
<div class="card"><h4>Lymphœdème primaire</h4><p>Il résulte d’une dysplasie du système lymphatique : aplasie, hypoplasie ou hyperplasie des vaisseaux, fibrose ou absence de ganglions (AWMF 2017). Il peut être congénital, apparaître autour de la puberté ou plus tard. Certaines formes s’inscrivent dans un syndrome génétique. Les <button class="w" data-k="i89-primaire">formes primaires selon l’âge de début (fenêtre)</button> orientent vers un test génétique.</p></div>
<div class="card"><h4>Lymphœdème secondaire</h4><p>Il résulte d’une lésion acquise d’un système lymphatique initialement normal. Les causes principales sont l’exérèse ganglionnaire, la radiothérapie, une tumeur qui obstrue les lymphatiques, des infections répétées, un traumatisme, la filariose et l’obésité massive. Selon l’ISL, il représente peut-être 85 % des lymphœdèmes dans le monde.</p></div></div>
<h3>Stade et sévérité</h3>
<p>Devant un membre gonflé, deux questions guident le traitement. Jusqu’où les tissus sont-ils déjà transformés ? Quelle quantité de liquide et de tissu est en excès ? Le stade répond à la première question, la sévérité à la seconde. Le stade décrit la nature du gonflement ; il prédit donc ce que l’élévation et la compression peuvent encore réduire.</p>
<table class="t"><tr><th>Stade ISL</th><th>Ce que l’on observe</th><th>Ce que contient le tissu</th><th>Effet de l’élévation du membre</th></tr>
<tr><td><b>0 (latent)</b></td><td>Aucun gonflement visible ; des symptômes subjectifs sont possibles. Ce stade peut précéder de mois ou d’années le gonflement.</td><td>Le transport lymphatique est déjà altéré ; la composition du liquide tissulaire change discrètement.</td><td>Sans objet.</td></tr>
<tr><td><b>I</b></td><td>Le gonflement est mou ; le godet est possible.</td><td>Un liquide relativement riche en protéines s’accumule, avec une prolifération cellulaire débutante.</td><td>Le gonflement diminue.</td></tr>
<tr><td><b>II</b></td><td>Le godet est net, puis devient moins marqué quand la graisse et la fibrose progressent.</td><td>Des éléments solides s’accumulent durablement : graisse et protéines.</td><td>L’élévation seule le réduit rarement.</td></tr>
<tr><td><b>III</b></td><td>L’éléphantiasis lymphostatique s’installe. Le godet est souvent absent. La peau s’épaissit et se couvre d’acanthose et de verrucosités.</td><td>La graisse et la fibrose dominent.</td><td>L’élévation n’agit pas sur les tissus solides.</td></tr></table>
<p>Le tableau se lit d’abord par la dernière colonne. Un gonflement qui disparaît après une nuit est surtout liquidien : il relève du stade I. Un gonflement qui persiste au réveil contient déjà de la graisse et de la fibrose : il relève au moins du stade II. Mme L. voit sa gêne diminuer après la nuit et garde l’empreinte du doigt ; elle est au stade I. L’erreur fréquente consiste à interpréter la disparition du godet comme une amélioration, alors qu’elle signale souvent le passage d’un œdème liquidien à un tissu fibreux et graisseux. Un même membre peut aussi présenter plusieurs stades, parce que ses territoires lymphatiques ne sont pas atteints au même degré (ISL 2023).</p>
<p>La sévérité se mesure à l’intérieur de chaque stade par l’excès de volume du membre atteint par rapport au membre sain. Selon l’ISL 2023, un excès supérieur à 5 % et inférieur à 20 % est minimal, un excès de 20 à 40 % est modéré, et un excès supérieur à 40 % est sévère. Mme L. a un bras gauche de 2 950 mL et un bras droit de 2 500 mL : l’excès vaut 450 mL, soit 450 / 2 500 = 18 %. Son lymphœdème est donc de stade I et de sévérité minimale. Le <button class="w" data-k="i89-e-volume">calcul du volume et ses pièges (fenêtre d’examens)</button> est traité dans l’onglet des examens.</p>
<h3>Codage en CIM-10-GM 2024</h3>
<p>Le code dépend d’abord de la cause, puis du stade et du territoire. Le code <b>I89.0-</b> désigne le lymphœdème non classé ailleurs ; son cinquième caractère précise le stade et la localisation, et I89.08 correspond au stade de latence. Un lymphœdème après mastectomie partielle ou totale avec lymphadénectomie se code <b>I97.2-</b>, et non I89.0-. Un lymphœdème après un autre acte se code <b>I97.8-</b> selon le territoire : cervical, axillaire, inguinal, urogénital ou autre. Le lymphœdème héréditaire relève de <b>Q82.0-</b>, et un lipœdème associé se code en plus, sous E88.2-. La lymphangite chronique ou subaiguë se code I89.1 ; la lymphangite aiguë, infectieuse, en est exclue et relève de L03. Le code I89.9 n’est qu’un code par défaut. Mme L. reçoit le code I97.20. Les <button class="w" data-k="i89-codage">règles et pièges du codage (fenêtre)</button> sont détaillés à part. La correspondance avec la CIM-11 n’est pas établie dans ce cours.</p>
<div class="key"><b>À retenir.</b> Le lymphœdème est un œdème par défaut de transport lymphatique, riche en protéines, distinct de l’œdème par excès de filtration. Le stade ISL décrit la transformation des tissus, et l’excès de volume en mesure la sévérité. Mme L. a un lymphœdème secondaire de stade I, de sévérité minimale, codé I97.20. Les chiffres qui suivent expliquent pourquoi ce lymphœdème est fréquent après un cancer du sein.</div>
</section>

<section class="ilot" id="i89-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Deux mesures ne doivent pas être confondues. L’<b>incidence</b> compte les nouveaux cas apparus pendant une période dans une population exposée, par exemple après un curage axillaire. La <b>prévalence</b> compte les personnes atteintes à un moment donné. Une incidence de 20 % après curage signifie qu’une patiente opérée sur cinq développe un lymphœdème dans le délai étudié ; elle ne dit pas combien de personnes vivent avec la maladie en Suisse.</p>
<h3>Dans le monde</h3>
<p>La majorité des lymphœdèmes est secondaire, peut-être 85 % selon l’ISL 2023. Dans les régions tropicales, la cause principale reste la filariose lymphatique. L’Organisation mondiale de la santé (OMS) estimait à 51 millions le nombre de personnes infectées en 2018. Sa base de données mondiale compte plus de 15 millions de personnes avec un lymphœdème et 25 millions d’hommes avec une hydrocèle ; au moins 36 millions de personnes gardent ces manifestations chroniques. Wuchereria bancrofti cause environ 90 % des cas (OMS, 2024).</p>
<h3>Dans les pays industrialisés</h3>
<p>La cause principale est le cancer et son traitement (AWMF 2017). Le lymphœdème primaire est rare : son incidence à la naissance est estimée à environ 1 sur 6 000, et sa prévalence avant 20 ans à environ 1 sur 87 000. Ces deux estimations proviennent d’études différentes. Les femmes sont nettement plus touchées, avec un rapport homme/femme de 1/4,5 à 1/6,1 ; la cause de cette prédominance n’est pas établie.</p>
<p>Après un cancer du sein, une méta-analyse retrouve une incidence globale du lymphœdème du bras de 16,6 %, et de 21,4 % dans les cohortes prospectives (DiSipio et al., 2013). Les cohortes prospectives mesurent les deux bras de façon systématique ; elles détectent donc des lymphœdèmes que le seul interrogatoire manquerait. L’incidence atteint 19,9 % après curage axillaire, contre 5,6 % après biopsie du seul ganglion sentinelle. Le ganglion sentinelle protège parce qu’il retire un à quelques ganglions au lieu d’un bassin entier : moins de collecteurs sont interrompus.</p>
<p>L’incidence augmente jusqu’à environ 2 ans après la chirurgie. Une explication plausible tient à la compensation initiale : les collecteurs restants et les voies de suppléance absorbent d’abord la charge, puis s’épuisent ; la fibrose radique progresse aussi pendant des mois. Mme L., symptomatique 16 mois après son opération, se situe dans cette fenêtre de risque.</p>
<p>L’essai randomisé AMAROS a comparé deux traitements de l’aisselle chez des patientes avec ganglion sentinelle positif. À 5 ans, des signes cliniques de lymphœdème étaient présents chez 23 % des patientes après curage, contre 11 % après radiothérapie axillaire, pour un contrôle axillaire comparable (Donker et al., 2014). Le tirage au sort rend ici le lien causal : c’est la stratégie de traitement qui modifie le risque. Après une lymphadénectomie pour cancer gynécologique, l’incidence avoisine 20 %, et certaines séries rapportent 47 à 60 % (AWMF 2017). L’exérèse des ganglions inguinaux donne plus souvent un lymphœdème que l’exérèse axillaire.</p>
<p>Aucune donnée épidémiologique suisse sur le lymphœdème n’a été retrouvée. Les chiffres européens et internationaux ne peuvent pas être transposés sans réserve à la population suisse. Les <button class="w" data-k="i89-risque-cancer">facteurs de risque après un cancer, causaux ou seulement associés (fenêtre)</button> sont détaillés à part.</p>
<div class="key"><b>À retenir.</b> La plupart des lymphœdèmes sont secondaires : filariose dans les régions tropicales, cancer et son traitement en Europe. Après un cancer du sein, le risque est d’environ un sur cinq après curage et nettement plus faible après ganglion sentinelle ou radiothérapie axillaire. Il augmente pendant environ deux ans. Aucune donnée suisse n’existe. Le mécanisme qui suit explique ce délai et cette progression.</div>
</section>

<section class="ilot" id="i89-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>Le système normal</h3>
<p>Le liquide quitte en permanence les capillaires sanguins pour entrer dans l’interstitium. Selon le principe de Starling révisé, la filtration nette persiste même dans les veinules en régime stable ; la réabsorption capillaire n’est que transitoire (Levick et Michel, 2010). Ce modèle tient compte du glycocalyx endothélial, qui fixe la pression oncotique efficace juste sous sa surface. La conséquence est importante : presque tout le liquide interstitiel retourne au sang par la lymphe (ISL 2023).</p>
<p>Le liquide entre dans les lymphatiques initiaux par des jonctions discontinues, dites « en boutons », entre des cellules endothéliales en forme de feuille de chêne (Baluk et al., 2007). Il progresse ensuite dans des collecteurs aux jonctions continues, segmentés en <button class="w" data-k="i89-s-lymphangion">lymphangions contractiles séparés par des valvules (fenêtre de sciences)</button>. La lymphe traverse les ganglions, rejoint les troncs, puis le canal thoracique, qui transporte environ 2,4 L de lymphe et de chyle par jour jusqu’au confluent veineux jugulo-sous-clavier gauche (revue de Breathe, 2022).</p>
<p>À l’état normal, la <b>capacité de transport</b> des lymphatiques dépasse la <b>charge lymphatique</b>, c’est-à-dire la quantité de liquide, de protéines et de cellules à évacuer. Cette marge permet d’absorber une hausse transitoire de la filtration, par exemple pendant un effort ou une station debout prolongée.</p>
<h3>La rupture de l’équilibre</h3>
<p>Le lymphœdème apparaît quand la capacité de transport tombe sous la charge lymphatique. Chez Mme L., le curage a interrompu les collecteurs du bras, et la radiothérapie a pu fibroser une partie des voies restantes. Tant que la capacité résiduelle suffit, le membre reste compensé : c’est le stade latent. Quand elle devient insuffisante, l’eau, les protéines et les cellules s’accumulent.</p>
<p>Les protéines retenues entretiennent la maladie. Dans les modèles murins, confirmés par des biopsies humaines, la stase déclenche une inflammation par lymphocytes CD4 de type Th2 ; cette inflammation est nécessaire à la fibrose, au dépôt de graisse et à la dysfonction des lymphatiques restants (Avraham et al., 2013). La graisse se dépose tôt, selon l’ISL 2023. Le tissu passe ainsi d’un œdème liquidien à un tissu solide, ce qui explique le passage du stade I au stade II. La <button class="w" data-k="i89-s-fibrose">biologie de la fibrose lymphostatique (fenêtre de sciences)</button> est développée dans l’onglet des sciences.</p>
<p>La stase altère aussi la défense locale. La lymphe transporte normalement les cellules présentatrices d’antigène de la peau vers les ganglions ; quand ce trafic ralentit, une infection cutanée est reconnue plus tard. Le lymphœdème est fortement associé à l’érysipèle, avec un rapport de cotes de 71,2 dans une étude cas-témoins (Dupuy et al., 1999). Chaque érysipèle endommage à son tour les lymphatiques et favorise une lymphangiosclérose. Ce <button class="w" data-k="i89-cercle">cercle d’aggravation (fenêtre)</button> justifie de traiter tôt et de prévenir les infections.</p>
<h3>Trois mécanismes d’œdème</h3>
<p>La figure 1 compare les trois situations dans lesquelles la lymphe ne suffit plus. Dans chaque panneau, le capillaire sanguin est en haut, l’interstitium au milieu et le vaisseau lymphatique en bas.</p>

<p>Le panneau 1 montre pourquoi un diurétique soulage un œdème cardiaque ou néphrotique. Le diurétique réduit le volume plasmatique et la pression capillaire, donc la filtration : la charge redescend sous la capacité d’un lymphatique resté sain. Le panneau 2 montre pourquoi le même médicament agit à peine sur un lymphœdème. La filtration y est déjà normale, et le défaut porte sur le transport ; les protéines, la graisse et la fibrose restent dans le tissu. L’ISL 2023 déconseille donc le diurétique au long cours dans le lymphœdème périphérique, pour un bénéfice marginal et un risque de troubles hydroélectrolytiques. Le panneau 3 explique la difficulté des formes mixtes : il faut réduire la filtration et soutenir le transport, d’où l’association d’un traitement de la cause et d’une compression.</p>
<div class="key"><b>À retenir.</b> Presque tout le liquide interstitiel devient de la lymphe. Le lymphœdème apparaît quand la capacité de transport tombe sous la charge lymphatique. Les protéines retenues entretiennent une inflammation, une fibrose et un dépôt de graisse, puis favorisent les érysipèles, qui aggravent à leur tour la maladie. Un diurétique ne corrige pas ce défaut de transport. Les causes qui réduisent la capacité de transport sont présentées ensuite.</div>
</section>

<section class="ilot" id="i89-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>Chercher la cause d’un lymphœdème sert à deux choses. La cause indique le pronostic et le traitement : un lymphœdème après curage se traite par compression, alors qu’un lymphœdème par récidive tumorale exige d’abord un traitement oncologique. La cause permet aussi d’éviter une erreur grave : selon l’ISL 2023, un lymphœdème unilatéral de l’adulte impose d’envisager une tumeur, un lymphome ou un sarcome qui obstrue les lymphatiques proximaux.</p>
<h3>Lymphœdèmes primaires</h3>
<p>Le lymphœdème primaire résulte d’une anomalie du développement lymphatique, transmise ou apparue de novo. La maladie de Milroy, liée au gène FLT4 qui code le récepteur VEGFR-3, donne un lymphœdème congénital des pieds et des jambes. Le syndrome lymphœdème-distichiasis, lié à FOXC2, se révèle plutôt autour de la puberté ou plus tard ; la double rangée de cils oriente le diagnostic. Le lymphœdème fait aussi partie de syndromes comme ceux de Turner, de Noonan, de Hennekam et d’Emberger. Le <button class="w" data-k="i89-primaire">tableau clinique selon l’âge de début (fenêtre)</button> précise quand demander un test, et la <button class="w" data-k="i89-s-vegfc">voie de signalisation en cause (fenêtre de sciences)</button> explique l’effet de ces variants.</p>
<h3>Lymphœdèmes secondaires après traitement d’un cancer</h3>
<p>L’ISL 2023 retient cinq facteurs de risque solides : un IMC élevé, surtout au-delà de 25 à 30 kg/m², un curage étendu, une chirurgie étendue, un traitement adjuvant par radiothérapie ou chimiothérapie, et une activité physique insuffisante. Chacun agit sur la charge lymphatique ou sur la capacité de transport.</p>
<p>Le <b>nombre de ganglions retirés</b> mesure le nombre de collecteurs interrompus : plus le curage est étendu, plus la capacité résiduelle est faible. La <b>radiothérapie</b> fibrose les tissus et oblitère des lymphatiques restants ; une irradiation sus-claviculaire, comme chez Mme L., atteint aussi des voies de suppléance. Les <b>taxanes</b> comme le docétaxel provoquent une rétention liquidienne ; leur lien avec le lymphœdème est une association observée, et le mécanisme le plus simple est une hausse transitoire de la charge sur un réseau déjà réduit. Un <b>IMC élevé</b> augmente le volume tissulaire à drainer et pourrait comprimer les collecteurs ; il s’agit aussi d’une association, et l’effet thérapeutique d’une perte de poids n’est que faiblement démontré. L’<b>inactivité</b> prive la lymphe de la pompe musculaire ; des essais randomisés suggèrent que l’exercice réduit le risque, surtout chez les patients à haut risque.</p>
<p>Ces facteurs s’additionnent sans rendre le lymphœdème inévitable. Même après curage, irradiation et taxane, la plupart des études rapportent un risque inférieur à 50 % (ISL 2023). Mme L. cumule un curage de 16 ganglions, une irradiation sus-claviculaire, un taxane et un IMC de 30,9 kg/m² : son risque était élevé, ce qui justifiait une mesure de référence avant l’opération. Le <button class="w" data-k="i89-risque-cancer">niveau de preuve de chaque facteur (fenêtre)</button> est détaillé à part.</p>
<h3>Autres causes secondaires</h3>
<p>Une <b>tumeur obstructive</b>, une récidive ganglionnaire ou un lymphome bloquent les lymphatiques proximaux ; ce lymphœdème progresse vite et est souvent douloureux. Les <b>érysipèles répétés</b> détruisent les lymphatiques par lymphangiosclérose. Un <b>traumatisme</b>, des cicatrices étendues ou une chirurgie veineuse ou orthopédique peuvent interrompre des collecteurs. La <b>filariose</b> (B74) résulte de vers adultes transmis par des moustiques, qui vivent dans les vaisseaux lymphatiques, les dilatent et altèrent leur fonction ; elle concerne en Suisse surtout les personnes ayant vécu en zone d’endémie, et son traitement relève de l’infectiologie.</p>
<p>D’autres causes réalisent des formes mixtes. L’<b>obésité massive</b> peut provoquer un lymphœdème par elle-même. Une <b>insuffisance veineuse chronique</b> évoluée surcharge longtemps les lymphatiques, qui finissent par céder : on parle de phlébolymphœdème. L’<b>immobilité</b> et la position déclive prolongée, par exemple chez un patient en fauteuil, associent une pression veineuse élevée dans le membre et l’absence de pompe musculaire. Enfin, certains <button class="w" data-k="i89-d-oedeme-medic">médicaments qui provoquent un œdème (fenêtre de pharmacologie)</button> imitent ou aggravent un lymphœdème.</p>
<div class="key"><b>À retenir.</b> Un lymphœdème primaire résulte d’une dysplasie lymphatique, souvent génétique. Un lymphœdème secondaire résulte d’une lésion acquise ; en Europe, il suit surtout un curage, une irradiation ou un traitement adjuvant, et l’IMC élevé et l’inactivité s’y associent. Un lymphœdème unilatéral de l’adulte sans cause évidente fait rechercher une tumeur. L’anamnèse qui suit sert à identifier ces causes.</div>
</section>

<section class="ilot" id="i89-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse répond à trois questions : le gonflement est-il lymphatique, quelle en est la cause, et une cause grave doit-elle être éliminée d’abord ? Selon l’ISL 2023, le diagnostic de lymphœdème repose dans la plupart des cas sur l’histoire et l’examen clinique. La qualité de l’interrogatoire évite donc des examens inutiles.</p>
<h3>Antécédents</h3>
<p>Le médecin demande d’abord le <button class="w" data-k="i89-risque-cancer">détail du traitement d’un cancer (fenêtre des facteurs de risque)</button> : type de chirurgie, nombre de ganglions retirés, champs d’irradiation, chimiothérapie par taxane. Il fait apporter les comptes rendus, car le nombre de ganglions et les champs irradiés estiment la capacité résiduelle. Il recherche des <button class="w" data-k="i89-erysipele">érysipèles antérieurs (fenêtre)</button> : chaque épisode aggrave le lymphœdème et en annonce d’autres. Il précise l’<button class="w" data-k="i89-primaire">âge de début et l’histoire familiale (fenêtre des formes primaires)</button>, qui orientent vers une forme primaire.</p>
<p>Il demande ensuite un séjour prolongé en zone d’endémie filarienne. Il recherche une <button class="w" data-k="i89-oed-systemique">maladie cardiaque, rénale, hépatique ou thyroïdienne (fenêtre des œdèmes systémiques)</button>, car ces maladies augmentent la filtration et créent un œdème à haut débit ou une forme mixte. Il relève tous les <button class="w" data-k="i89-d-oedeme-medic">médicaments, dont ceux qui provoquent un œdème (fenêtre)</button>. Il note enfin l’évolution du poids, car une prise de poids augmente la charge lymphatique et fausse la comparaison des volumes.</p>
<h3>Symptômes</h3>
<p>Les patients décrivent un gonflement, une <button class="w" data-k="i89-s-lourdeur">lourdeur, une tension, des vêtements et des bijoux qui serrent (fenêtre)</button>, une limitation de la mobilité et parfois des douleurs (AWMF 2017). Aucune source vérifiée ne classe ces plaintes par fréquence. La variation dans la journée renseigne sur le stade : un gonflement qui augmente le soir et diminue après la nuit est surtout liquidien. La <button class="w" data-k="i89-s-douleur">douleur et ses signaux d’alarme (fenêtre)</button> mérite une attention particulière : une douleur modérée est compatible avec un lymphœdème, mais une douleur intense, rapide, nocturne ou neurologique fait rechercher une thrombose, un érysipèle ou une récidive tumorale.</p>
<p>Le médecin recherche aussi des épisodes de fièvre avec rougeur du membre, qui signent des érysipèles passés. Il demande un écoulement de liquide clair par la peau, qui traduit une lymphorrhée. Il évalue enfin le retentissement psychologique et social : l’ISL 2023 souligne que ce retentissement influence l’adhésion au traitement, positivement ou négativement. Un traitement à vie n’est porté que si la patiente en comprend le but.</p>
<div class="two">
<div class="card"><h4>Forme typique</h4><p>Une femme traitée pour un cancer du sein, avec curage axillaire et radiothérapie, développe dans les deux ans un gonflement du bras homolatéral. Le gonflement est mou, il augmente le soir et diminue après la nuit. Les douleurs sont modérées et la fièvre absente. C’est la situation de Mme L.</p></div>
<div class="card"><h4>Formes atypiques</h4><p>Une adolescente développe un œdème du dos du pied sans antécédent : la forme primaire est probable. Un patient traité pour un cancer de la tête et du cou par radiothérapie développe un œdème du cou ou du visage. Un lymphœdème génital, du tronc ou du sein suit une chirurgie pelvienne ou mammaire. Un lymphœdème bilatéral asymétrique impose d’exclure une cause systémique associée. Enfin, un lymphœdème rapide et douloureux évoque une forme maligne, par obstruction tumorale.</p></div></div>
<div class="key"><b>À retenir.</b> L’anamnèse précise le traitement du cancer, les érysipèles antérieurs, l’âge de début, l’histoire familiale, le séjour en zone d’endémie, les maladies qui augmentent la filtration, les médicaments et le poids. Un gonflement qui diminue après la nuit est surtout liquidien. Une douleur intense ou une progression rapide fait rechercher une cause grave. L’examen clinique qui suit confirme ou corrige ces hypothèses.</div>
</section>

<section class="ilot" id="i89-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen se pratique sur un patient dévêtu, debout puis couché, en comparant toujours les deux côtés (AWMF 2017). Il confirme le caractère lymphatique du gonflement, en mesure l’importance et recherche les signes d’une cause grave ou d’une contre-indication à la compression.</p>
<div class="two">
<div class="card"><h4>État général, constantes et mesures</h4><p>Le médecin apprécie l’état général et l’amaigrissement, qui peuvent révéler une récidive tumorale. Il mesure la pression artérielle, la fréquence cardiaque et la température : une fièvre associée à une rougeur évoque un érysipèle. Il note le poids, la taille et l’IMC ; chez Mme L., l’IMC de 30,9 kg/m² constitue à la fois un facteur de risque et une cible du traitement.</p><p>Il mesure ensuite les circonférences des deux membres à des points fixes, par exemple tous les 4 cm, et en calcule les volumes. La même méthode doit être reprise à chaque visite, sinon l’écart mesuré reflète la technique plutôt que la maladie. Les <button class="w" data-k="i89-e-volume">calculs de volume et leurs pièges (fenêtre d’examens)</button> sont détaillés dans l’onglet des examens.</p></div>
<div class="card"><h4>Signes ciblés</h4><p>Le médecin apprécie le <button class="w" data-k="i89-godet-peau">godet et la consistance du tissu (fenêtre)</button>, puis recherche le <button class="w" data-k="i89-stemmer">signe de Stemmer (fenêtre)</button>. Il inspecte la peau : plis cutanés approfondis, orteils carrés, papillomatose, kystes lymphatiques, lymphorrhée et hyperkératose signent un lymphœdème avancé. Il recherche un intertrigo ou une mycose entre les orteils, car cette porte d’entrée explique une grande part des érysipèles de jambe (Dupuy et al., 1999).</p><p>Il palpe les aires ganglionnaires, car une adénopathie dans le territoire de drainage évoque une récidive. Il recherche une circulation veineuse collatérale, qui signale une obstruction veineuse proximale. Il palpe les pouls et, au membre inférieur, mesure l’index de pression systolique avant toute compression : une artériopathie sévère contre-indique la compression. Il recherche des <button class="w" data-k="i89-oed-systemique">signes de congestion cardiaque (fenêtre des œdèmes systémiques)</button>. Il termine par l’examen neurologique du membre : un déficit oriente vers une plexopathie, radique ou par <button class="w" data-k="i89-malin">envahissement tumoral (fenêtre du lymphœdème malin)</button>.</p></div></div>
<p>Chez Mme L., le godet est net à l’avant-bras et le signe de Stemmer est négatif à la main. La peau est normale, les aires ganglionnaires sont libres, aucune veine collatérale n’est visible et l’examen neurologique est normal. Cet examen est compatible avec un lymphœdème débutant et ne montre aucun signe d’alarme. Le pli cutané reste soulevable parce que le derme n’est pas encore épaissi par la fibrose.</p>
<div class="trap"><span class="k">Piège</span>Un signe de Stemmer négatif n’exclut pas un lymphœdème : au stade I, le derme n’est pas encore induré (AWMF 2017). À l’inverse, l’absence de godet n’exclut pas un lymphœdème avancé, dont le tissu est devenu fibreux et graisseux. Ni l’un ni l’autre de ces signes ne suffit à écarter le diagnostic.</div>
<div class="key"><b>À retenir.</b> L’examen compare toujours les deux membres. Il mesure les volumes par une méthode constante, apprécie le godet, le signe de Stemmer et la peau, et recherche une porte d’entrée infectieuse. Il palpe les ganglions, recherche une obstruction veineuse, contrôle les pouls avant toute compression et examine les nerfs. Un signe de Stemmer négatif et un godet absent n’excluent pas le diagnostic. La démarche diagnostique qui suit hiérarchise les examens complémentaires.</div>
