<template data-pop="i83-duplex-reflux" data-title="Seuils de reflux et manœuvres de provocation">
<p>Un reflux est pathologique lorsqu’il dure plus de 0,5 seconde dans une veine superficielle ou une perforante, et plus de 1 seconde dans les veines fémorale commune, fémorale et poplitée. Il se mesure debout, après une manœuvre de provocation (ESVS 2022, § 2.3.1).</p>
<div class="lab">Mécanisme</div><p>Une valvule ne se ferme pas instantanément. Quand le flux s’inverse, un bref courant rétrograde plaque les feuillets l’un contre l’autre. Ce reflux de fermeture existe chez toute personne saine. Les seuils séparent ce phénomène normal d’une valvule incompétente qui laisse le sang redescendre longtemps. Pour les perforantes, certains auteurs retiennent 0,35 seconde ; la définition reste discutée.</p>
<div class="lab">Technique</div><p>Le patient est debout, genou du membre examiné légèrement fléchi, poids sur l’autre jambe. La provocation vient d’en haut, par une manœuvre de Valsalva qui teste surtout la jonction saphéno-fémorale. Elle peut aussi venir d’en bas : une compression manuelle ou par brassard automatique du mollet, de la cuisse ou du pied, suivie d’un relâchement brusque. Le brassard automatique standardise la manœuvre et rend deux examens plus comparables.</p>
<div class="lab">Conséquence clinique</div><p>Chez Mme R., le reflux de 2,8 secondes de la grande saphène dépasse le seuil : il est pathologique. Le chiffre ne mesure pas la gravité. Ce qui guide le traitement est la source du reflux, son trajet, sa limite inférieure et le diamètre du tronc.</p>
<div class="lab">Pièges</div><p>En position couchée, les veines se vident et un reflux réel peut disparaître. Une manœuvre de Valsalva trop faible ou une compression insuffisante donnent un faux négatif. Un reflux découvert chez une personne sans symptôme ni signe n’est pas une indication de traitement.</p>
<div class="lab">Limites</div><p>La durée du reflux dépend de la manœuvre et se quantifie mal ; au-delà du seuil, sa valeur clinique est discutée. Aucune méthode d’imagerie n’a été validée contre une issue clinique pertinente de la maladie veineuse (§ 2.5). Les seuils sont des conventions issues de mesures chez des sujets sains, non des critères de décision isolés.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, Eur J Vasc Endovasc Surg 2022;63:184-267, § 2.3.1 et recommandation 3 (classe I, niveau B).</p>
</template>

<template data-pop="i83-cartographie" data-title="Cartographie veineuse avant traitement">
<p>La cartographie veineuse est un schéma des veines superficielles et profondes du membre examiné, qui accompagne le compte rendu écrit de l’écho-Doppler. L’ESVS la juge indispensable pour planifier et réaliser une intervention veineuse (§ 2.3.1).</p>
<div class="lab">Pourquoi un schéma</div><p>Les veines superficielles varient beaucoup d’une personne à l’autre. L’ESVS impose donc de planifier le geste sur l’anatomie échographique du patient (§ 1.2.1). Un compte rendu en phrases décrit mal un trajet ; un schéma montre d’un coup d’œil où le reflux entre, où il passe et où il sort.</p>
<div class="lab">Contenu utile au geste</div><p>Le schéma précise la position et les manœuvres utilisées. Il décrit le réseau profond : perméabilité, reflux, séquelles et modulation respiratoire du flux fémoral commun. Pour chaque jonction, il indique sa compétence et les affluents qui refluent. Pour chaque tronc, il donne les segments refluants, le diamètre mesuré debout au point standard et les segments sortis du compartiment ou tortueux. Il ajoute la distance du tronc à la peau, car un tronc très superficiel, à environ 5 mm de la peau, expose à une pigmentation et à une induration après traitement (§ 4.6.8.2). Il place enfin les veines accessoires, les collatérales variqueuses, les perforantes incompétentes avec leur diamètre et leur hauteur, les points de fuite pelviens et les séquelles de thrombose.</p>
<div class="lab">Conséquence clinique</div><p>La longueur à traiter se détermine par la collatérale refluante la plus basse ; une ablation trop courte s’associe à davantage de réinterventions (§ 4.7.2). Une séquelle de thrombose dans le tronc peut empêcher de faire progresser un cathéter et faire choisir une autre technique (§ 4.6.8.3).</p>
<div class="lab">Exemple</div><p>Pour Mme R., le schéma du membre gauche montre un réseau profond normal, une jonction saphéno-fémorale incompétente et un reflux de la grande saphène jusqu’à mi-jambe, de diamètre 7,5 mm à 15 cm de la jonction. Il situe la collatérale variqueuse de jambe, la perforante de 4 mm sous la zone pigmentée, la petite saphène continente et l’ancienne thrombose d’une collatérale.</p>
<div class="lab">Limites</div><p>La cartographie dépend de l’opérateur et décrit un état à une date donnée. Le médecin qui traite contrôle les repères à l’échographie au début du geste.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 1.2.1, 2.3.1, 4.6.8 et 4.7.2.</p>
</template>

<template data-pop="i83-ips" data-title="Index de pression systolique cheville-bras et pression d’orteil avant compression">
<p>Avant toute compression soutenue, le médecin mesure l’index de pression systolique cheville-bras et la pression de cheville, et la pression d’orteil chez le diabétique ou l’insuffisant rénal. Une compression soutenue n’est pas recommandée si l’index est inférieur à 0,6, la pression de cheville inférieure à 60 mmHg ou la pression d’orteil inférieure à 30 mmHg (ESVS 2022, recommandation 72, classe III).</p>
<div class="lab">Technique</div><p>Le patient est couché et au repos. Un brassard placé au-dessus des malléoles est gonflé jusqu’à disparition du signal Doppler de l’artère tibiale postérieure, puis de l’artère pédieuse ; la pression systolique est celle où le signal réapparaît au dégonflage. L’index rapporte la plus élevée des deux pressions de cheville à la pression brachiale la plus élevée des deux bras. La pression d’orteil se mesure avec un petit brassard à la base du gros orteil et un capteur de photopléthysmographie.</p>
<div class="lab">Mécanisme</div><p>Une compression comprime aussi les petits vaisseaux de la peau. Si la pression de perfusion est basse, la pression externe peut les fermer ; la peau s’ischémie, d’abord en regard des reliefs osseux où la pression est la plus forte. Les seuils de l’ESVS repèrent le niveau de perfusion en dessous duquel ce risque l’emporte sur le bénéfice.</p>
<div class="lab">Valeurs et décision</div><p>Un index supérieur à 0,8 permet une compression complète. Entre 0,6 et 0,8, avec une pression de cheville supérieure à 60 mmHg, une compression modifiée inférieure à 40 mmHg se discute sous surveillance étroite (recommandation 74, classe IIb). Un index de 0,90 ou moins définit déjà une artériopathie selon le cours I70 — Athérosclérose périphérique, artériopathie des membres inférieurs et ischémie aiguë (C-01-Cardiologie). Au-delà de 1,40, les artères sont incompressibles et l’index n’est pas interprétable.</p>
<div class="lab">Pièges</div><p>La médiacalcose du diabète et de l’insuffisance rénale rend l’artère de cheville incompressible et la pression faussement élevée ; les artères des orteils sont moins souvent calcifiées. Un pouls palpable ne remplace pas la mesure. Un œdème important rend le signal difficile à capter.</p>
<div class="lab">Exemple</div><p>Mme R. a des index de 1,08 et 1,10 : une compression de classe 2 est possible sans restriction.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, § 3.2, § 6.1.5, § 6.3.3, tableau 7 et recommandations 68, 72 et 74.</p>
</template>

<template data-pop="i83-imagerie-prox" data-title="Imagerie de l’obstruction proximale">
<p>Devant une suspicion d’obstruction iliaque ou cave, l’écho-Doppler abdominal vient en premier. L’imagerie en coupe ne se demande que si une intervention est envisagée, et l’échographie endovasculaire sert surtout pendant la procédure (ESVS 2022, recommandations 4 à 6).</p>
<div class="lab">Quand y penser</div><p>Un œdème unilatéral étendu, un ulcère actif ou cicatrisé, des collatérales abdominales ou sus-pubiennes, une claudication veineuse, un flux fémoral commun sans modulation respiratoire ou une fibrose post-thrombotique font suspecter un obstacle au-dessus de l’aine.</p>
<div class="lab">Choisir l’examen</div><p>L’écho-Doppler abdominal se fait à jeun ; un rapport des vitesses d’au moins 2,5 à travers la sténose est le meilleur critère d’obstruction iliaque significative. La phlébo-IRM n’irradie pas et montre la fibrose et les collatérales. La phlébo-TDM est plus disponible, mais elle expose aux rayonnements ionisants et au produit de contraste iodé, et le temps de passage du contraste est difficile à prévoir. La phlébographie par voie poplitée ou fémorale montre indirectement une compression iliaque gauche par l’aplatissement de la veine et les collatérales ; la phlébographie ascendante par le pied est obsolète. L’échographie endovasculaire mesure la surface de la lumière et détecte mieux les lésions que la phlébographie, mais elle exige de franchir la lésion avec un guide.</p>
<div class="lab">Conséquence clinique</div><p>Une compression iliaque d’au moins 50 % de la surface existe chez 25 à 33 % de la population générale, le plus souvent sans symptôme (§ 7.2.1). L’image ne justifie donc une intervention que si la clinique est sévère et concordante.</p>
<div class="lab">Limites</div><p>Aucune de ces méthodes n’a été validée contre une issue clinique pertinente (§ 2.5). Le choix entre IRM et TDM dépend surtout de l’expertise locale.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 2.3.2 à 2.5 et 7.2 ; recommandations 4 (classe IIa, niveau C), 5 (classe I, niveau C) et 6 (classe IIb, niveau B).</p>
</template>

<template data-pop="i83-laplace" data-title="Loi de Laplace et pression sous un bandage">
<p>La pression qu’un bandage exerce sur la jambe est proportionnelle à sa tension et au nombre de couches, et inversement proportionnelle au rayon de courbure du membre. Un même bandage serre donc davantage une zone fine ou très courbée.</p>
<div class="lab">Formule</div><p>Pour une couche enroulée autour d’un cylindre, la loi de Laplace s’écrit P = T / r : P est la pression sur la peau, T la tension du bandage par unité de largeur et r le rayon du membre. Avec n couches superposées, la pression devient environ n × T / r. Un bandage posé avec un chevauchement de moitié forme deux couches.</p>
<div class="lab">Conséquence clinique</div><p>À tension égale, une cheville de 24 cm de circonférence reçoit une pression 1,5 fois plus forte qu’un mollet de 36 cm. Cette dégressivité naturelle favorise la vidange vers le haut. À l’inverse, la crête tibiale et le tendon d’Achille ont un rayon très petit : la pression y devient localement très forte et peut blesser la peau. Les creux situés derrière les malléoles ne reçoivent presque aucune pression. Le rembourrage remplit les creux et arrondit les reliefs ; il rend la pression plus uniforme.</p>
<div class="lab">Exemple chiffré</div><p>Deux bas superposés pour un petit ulcère combinent un bas intérieur de 20 mmHg et un bas extérieur de 20 à 25 mmHg. L’ensemble exerce environ 40 mmHg couché et près de 50 mmHg debout (ESVS 2022, § 6.3.1).</p>
<div class="lab">Limites</div><p>La jambe n’est pas un cylindre parfait, et les tissus mous déforment la surface. La pression réelle dépend de l’étirement appliqué et de la technique de pose ; seul un capteur la mesure. Une compression sans tension, par un liquide sous pression, échappe à cette loi (§ 3.2.2.3).</p>
<div class="lab">Source</div><p>Loi de Laplace (mécanique des parois minces). De Maeseneer et al., ESVS 2022, §§ 3.2.2.3 et 6.3.1.</p>
</template>

<template data-pop="i83-saphene" data-title="Compartiment saphène et jonctions : repères pour l’échographie et l’ablation">
<p>À l’échographie, la grande saphène se reconnaît à sa position dans le compartiment saphène, entre le fascia saphène et le fascia musculaire. Ce repère distingue le tronc des collatérales et prépare chaque étape de l’ablation.</p>
<div class="lab">Repères</div><p>En coupe transversale, le tronc saphène se trouve dans l’espace compris entre les deux fascias. La saphène accessoire antérieure chemine presque parallèlement à la grande saphène, un peu en dehors, dans son propre compartiment. Les collatérales se trouvent au-dessus du fascia saphène. À la jonction, la valvule terminale et la valvule préterminale encadrent l’abouchement des affluents de la crosse. La petite saphène rejoint la veine poplitée à un niveau variable ; une veine de Giacomini peut la relier à la grande saphène.</p>
<div class="lab">Conséquence pour le geste</div><p>Le point de ponction se choisit sur le tronc, en tenant compte de la collatérale refluante la plus basse. L’extrémité de la fibre ou du cathéter se place en aval de la jonction. La tumescence s’injecte dans le compartiment : elle vide la veine, l’applique contre la source de chaleur et protège les tissus voisins. Sous la mi-mollet, la ponction de la petite saphène expose le nerf sural (recommandation 45, classe I) ; au mollet, l’ablation de la grande saphène expose le nerf saphène.</p>
<div class="lab">Pièges</div><p>Une collatérale épaisse et superficielle peut être prise pour le tronc. Un tronc très superficiel, à environ 5 mm de la peau, expose à une pigmentation et à une induration prolongée après traitement. Une séquelle de thrombose dans la lumière peut empêcher la progression du cathéter.</p>
<div class="lab">Source</div><p>De Maeseneer et al., ESVS 2022, §§ 1.2.1, 4.1.3, 4.2.1.1, 4.6.2, 4.6.8 et 4.7.2.</p>
</template>

<template data-pop="i83-gen" data-title="Hérédité des varices : ce que l’on sait">
<p>Les varices communes sont une maladie polygénique : de nombreux variants, chacun de faible effet, s’ajoutent aux facteurs acquis. Aucun test génétique n’est utile en pratique courante.</p>
<div class="lab">Données</div><p>L’héritabilité est estimée à environ 17 % (Ahmed et al., 2022). Dans la biobanque britannique, une étude de près de 500 000 personnes a identifié 30 nouvelles régions associées (Fukaya et al., 2018). Une analyse de 810 625 personnes a trouvé 49 signaux sur 46 régions ; les voies impliquées concernent la matrice extracellulaire, l’inflammation, la formation des vaisseaux sanguins et lymphatiques, la migration des cellules musculaires lisses et l’apoptose (Ahmed et al., 2022). Un score qui additionne ces variants prédit les varices dans une cohorte indépendante, mais il n’a pas d’usage clinique établi.</p>
<div class="lab">Formes rares</div><p>Chez 18 porteurs d’un variant de FOXC2, tous avaient un reflux de la grande saphène, contre 1 témoin sur 12 (Mellor et al., 2007). Dans le syndrome de Klippel-Trénaunay, 19 patients sur 21 portaient un variant somatique de PIK3CA ; dans beaucoup d’échantillons, moins de 10 % des cellules portaient le variant (Luks et al., 2015). La recherche se fait donc sur le tissu atteint, avec une méthode sensible.</p>
<div class="lab">Association ou cause</div><p>La grande taille s’associe aux varices, avec un risque 1,74 fois plus élevé dans le quartile le plus grand que dans le plus petit. La randomisation mendélienne, qui utilise les variants de la taille comme une répartition au hasard, soutient un rôle causal (Fukaya et al., 2018). Le mécanisme reste une hypothèse.</p>
<div class="lab">Limites</div><p>Ces cohortes sont surtout d’ascendance européenne, et le diagnostic de varices y repose souvent sur des déclarations ou des codes. Chaque région découverte explique une faible part du risque.</p>
<div class="lab">Source</div><p>Fukaya et al., Circulation 2018;138:2869-2880. Ahmed et al., Nat Commun 2022;13:3065. Mellor et al., Circulation 2007;115:1912-1920. Luks et al., J Pediatr 2015;166:1048-1054.</p>
</template>

<template data-pop="pareto-i83-exam" data-title="Pareto — Examens">
<p class="ratio" data-cover="i83-e-1,i83-e-2,i83-e-3,i83-e-4,i83-e-5"></p>
<ul><li>L’écho-Doppler complet debout est l’examen de référence ; le Doppler de poche ne sert qu’à la pression de cheville.</li><li>Le reflux est pathologique au-delà de 0,5 seconde dans les veines superficielles et de 1 seconde dans les veines profondes ; sa durée ne mesure pas la gravité.</li><li>Le réseau profond se lit en premier ; la source, le trajet, la limite inférieure et le diamètre guident le geste, et la mousse ne vise que les troncs de moins de 6 mm.</li><li>Toute compression soutenue exige un index de pression : pas de compression soutenue si l’index est inférieur à 0,6, la pression de cheville inférieure à 60 mmHg ou la pression d’orteil inférieure à 30 mmHg ; compression modifiée inférieure à 40 mmHg pour l’ulcère mixte.</li><li>Le diabète impose la pression d’orteil, car la médiacalcose fausse l’index.</li><li>Les indices d’obstruction proximale mènent à l’écho-Doppler abdominal, puis à l’IRM ou à la TDM si une intervention est envisagée.</li><li>La biologie cherche une autre cause d’œdème, un frein à la cicatrisation ou une infection clinique ; pas de prélèvement bactériologique de routine.</li><li>Un ulcère atypique ou qui ne cicatrise pas malgré un traitement bien conduit justifie une biopsie.</li></ul>
</template>

<template data-pop="pareto-i83-sci" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="i83-sa,i83-sh,i83-sp,i83-sb,i83-sg"></p>
<ul><li>Le tronc saphène, rectiligne et invisible, chemine dans son compartiment entre deux fascias ; les collatérales, tortueuses et visibles, sont au-dessus.</li><li>La tumescence injectée dans le compartiment protège les tissus ; les nerfs saphène et sural longent les troncs à la jambe.</li><li>La paroi variqueuse est remaniée par l’inflammation et les MMP ; elle ne redevient pas normale.</li><li>Debout, la pression au pied vaut 80 à 90 mmHg ; la marche l’abaisse à 20 à 30 mmHg ; le reflux et l’obstruction empêchent cette baisse.</li><li>L’excès de pression capillaire dépasse le drainage lymphatique : l’œdème apparaît le soir.</li><li>Selon la loi de Laplace, la pression d’un bandage augmente quand le rayon diminue ; le rembourrage protège les reliefs osseux.</li><li>Les matériaux inélastiques donnent une pression faible au repos et forte à la contraction.</li><li>Endothélium activé, leucocytes, fer et TGF-β conduisent à la fibrose et à l’ulcère ; les manchons de fibrine sont une hypothèse discutée.</li><li>Les varices communes sont polygéniques ; FOXC2 et PIK3CA illustrent les formes rares ; aucun test génétique n’est utile en pratique courante.</li></ul>
</template>
