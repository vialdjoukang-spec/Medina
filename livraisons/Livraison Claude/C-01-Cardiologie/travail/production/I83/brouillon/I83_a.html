<section class="ilot" id="i83-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Mme R., 61 ans, est aide-soignante dans un établissement médico-social, où elle travaille debout huit heures par jour. Elle a eu trois grossesses, sa mère a été opérée de varices et son IMC atteint 31 kg/m². Son hypertension artérielle est traitée depuis un an par amlodipine 10 mg par jour. Elle ne fume pas et n’a jamais eu de thrombose veineuse profonde.</p>
<p>Depuis dix ans, ses jambes sont lourdes le soir et ses chevilles gonflent en fin de journée, davantage à gauche. Depuis six mois, une tache brune qui démange est apparue au-dessus de la malléole interne gauche. Il y a deux ans, un cordon rouge et douloureux est apparu sur une varice de la jambe gauche ; un médecin l’a traité par une pommade, sans échographie.</p>
<p>Cinq questions organisent le cours. <b>Mme R. a-t-elle une maladie veineuse chronique, et à quel stade ? Son œdème est-il seulement veineux ? Quel examen faut-il demander ? Faut-il traiter son reflux, et par quelle technique ? Que rembourse l’assurance obligatoire des soins ?</b> La tache brune a une valeur particulière : elle montre que l’hypertension veineuse atteint déjà la peau, ce qui fait passer la maladie d’un problème de confort à une indication de traitement.</p>
<p>Le médecin assistant doit savoir décrire un membre selon la classification CEAP et distinguer varices, insuffisance veineuse chronique et syndrome post-thrombotique. Il prescrit l’écho-Doppler au bon moment et le lit. Il reconnaît un œdème d’une autre cause et les complications qui exigent une orientation urgente. Il pose enfin l’indication de la compression et du traitement du reflux, en connaissant les règles suisses de remboursement.</p>
<div class="key"><b>Prérequis.</b> Une valvule veineuse continente laisse monter le sang vers le cœur et se ferme lorsqu’il redescend. La contraction du mollet fournit l’énergie du retour veineux. Ces deux éléments expliquent la <button class="w" data-k="i83-pav">pression veineuse ambulatoire (pourquoi la marche abaisse la pression du pied)</button>, notion dont dérivent presque tous les signes du cours.</div>
</section>

<section class="ilot" id="i83-1"><h2><span class="n">1</span>Définitions, classifications et codage</h2>
<p>La <b>maladie veineuse chronique</b> désigne toute anomalie morphologique ou fonctionnelle durable du système veineux qui se manifeste par des symptômes ou des signes justifiant une évaluation ou des soins. Cette définition provient d’un consensus transatlantique de terminologie ; la Société européenne de chirurgie vasculaire (ESVS) l’a reprise en 2022. Le terme d’<b>insuffisance veineuse chronique</b> est réservé aux formes avancées, avec œdème, altérations cutanées ou ulcère, soit les classes C&#8288;3 à C&#8288;6. La distinction a une portée pratique : une varice isolée gêne, alors qu’une peau qui s’altère annonce l’ulcère.</p>
<p>Trois calibres de veines dilatées doivent être distingués. Les <b>télangiectasies</b> sont des veinules intradermiques dilatées de 1 mm au plus. Les <b>veines réticulaires</b> sont des veines sous-dermiques bleutées de 1 à 3 mm. Les <b>varices</b> sont des veines sous-cutanées dilatées, souvent tortueuses, d’un calibre supérieur à celui des veines réticulaires. Elles s’examinent debout, car la colonne de sang distend alors la veine incompétente ; chez le patient couché, la même varice peut disparaître.</p>
<p>Selon sa cause, la maladie est <b>primitive</b> lorsque la paroi et les valvules s’altèrent sans maladie sous-jacente identifiée. Elle est <b>secondaire</b> lorsqu’une maladie connue l’explique, et <b>congénitale</b> lorsqu’une malformation existe dès la naissance. Dans le réseau profond, la cause secondaire la plus fréquente est la thrombose veineuse profonde. Le <b>syndrome post-thrombotique</b> réunit alors les symptômes et les signes d’hypertension veineuse qui suivent la thrombose : les valvules ont été détruites pendant la recanalisation, ou la veine reste en partie obstruée.</p>

<h3>1.1 Classification CEAP 2020</h3>
<p>La classification CEAP décrit un membre à un moment donné selon quatre domaines : clinique (C), étiologique (E), anatomique (A) et physiopathologique (P). Sa révision de 2020 a ajouté la corona phlebectatica (C&#8288;4c), les récidives (C&#8288;2r et C&#8288;6r) et la distinction entre causes secondaires intraveineuses (Esi) et extraveineuses (Ese). L’ESVS la recommande pour l’audit et la recherche (recommandation 1, classe I, niveau C). La question posée au membre est la suivante : quel est le signe veineux le plus grave présent ? Le tableau range les classes cliniques du signe le plus discret au plus grave.</p>
<table class="t"><tr><th>Classe</th><th>Signe clinique</th><th>Ce que le signe traduit</th></tr>
<tr><td>C&#8288;0</td><td>Aucun signe visible ni palpable</td><td>Des symptômes peuvent exister seuls (C&#8288;0s) ; leur origine veineuse reste alors à prouver.</td></tr>
<tr><td>C&#8288;1</td><td>Télangiectasies ou veines réticulaires</td><td>De petites veines sont dilatées, en général sans retentissement sur la peau.</td></tr>
<tr><td>C&#8288;2 (C&#8288;2r si récidive)</td><td>Varices</td><td>Un tronc saphène ou une collatérale reflue le plus souvent.</td></tr>
<tr><td>C&#8288;3</td><td>Œdème d’origine veineuse</td><td>La filtration capillaire dépasse les capacités du drainage lymphatique.</td></tr>
<tr><td>C&#8288;4a</td><td>Pigmentation ou eczéma</td><td>Le fer des hématies extravasées et l’inflammation atteignent le derme.</td></tr>
<tr><td>C&#8288;4b</td><td>Lipodermatosclérose ou atrophie blanche</td><td>Le derme et l’hypoderme deviennent fibreux, ou la peau perd ses capillaires.</td></tr>
<tr><td>C&#8288;4c</td><td>Corona phlebectatica</td><td>Un éventail de petites veines intradermiques dilatées entoure la cheville.</td></tr>
<tr><td>C&#8288;5</td><td>Ulcère cicatrisé</td><td>La peau a déjà cédé une fois et peut céder de nouveau.</td></tr>
<tr><td>C&#8288;6 (C&#8288;6r si récidive)</td><td>Ulcère veineux actif</td><td>La perte de substance est le stade le plus grave.</td></tr></table>
<p>La lecture commence par la classe la plus élevée, qui résume la gravité. La notation détaillée énumère ensuite toutes les classes présentes et ajoute l’indice S si le membre est symptomatique, A s’il ne l’est pas. Le domaine E précise la cause : Ep primitive, Esi intraveineuse comme une séquelle de thrombose, Ese extraveineuse comme une compression, Ec congénitale, En non identifiée. Le domaine A localise l’atteinte (As superficielle, Ad profonde, Ap perforantes) et le domaine P en donne le mécanisme (Pr reflux, Po obstruction, Pr,o les deux). L’erreur fréquente consiste à coter C&#8288;3 un œdème qui n’est pas veineux : un œdème cardiaque ou médicamenteux ne justifie pas cette classe. Le membre gauche de Mme R. porte des varices, un œdème, une pigmentation avec eczéma et une corona phlebectatica. Sa classe la plus élevée est donc C&#8288;4a, accompagnée de C&#8288;4c ; la notation complète exige l’écho-Doppler (îlot 7). Les règles de notation figurent dans la fenêtre <button class="w" data-k="i83-ceap">classification CEAP 2020 (notation d’un membre)</button>.</p>

<h3>1.2 Mesurer la gravité et l’évolution</h3>
<p>La CEAP est catégorielle et ne mesure pas l’évolution. Un membre classé C&#8288;4a le reste après un traitement réussi, car la pigmentation persiste. Pour suivre un patient, l’ESVS propose le <b>VCSS révisé</b>, score de dix items cotés de 0 à 3, et, après une thrombose, l’<b>échelle de Villalta</b> (recommandation 2, classe IIa, niveau C). Le VCSS révisé du membre gauche de Mme R. vaut 8 points : douleur quotidienne qui gêne sans empêcher ses activités 2, varices de jambe et de cuisse 3, œdème limité à la cheville 1, pigmentation et inflammation périmalléolaires 1 chacune. Les items et les seuils sont expliqués dans la fenêtre <button class="w" data-k="i83-vcss">VCSS révisé et échelle de Villalta (mesurer la gravité)</button>.</p>

<h3>1.3 Codage CIM-10-GM</h3>
<p>Le code CIM-10-GM traduit le tableau clinique en catégorie statistique et administrative. Il ne suit pas la CEAP ; le médecin doit donc savoir quel code correspond à quel stade. Le tableau donne une correspondance approchée, qui n’est pas une règle officielle.</p>
<table class="t"><tr><th>Code</th><th>Libellé abrégé</th><th>Situation clinique correspondante</th></tr>
<tr><td>I83.9</td><td>Varices sans ulcère ni inflammation</td><td>Varices, avec ou sans œdème ni pigmentation, sans dermite ni ulcère</td></tr>
<tr><td>I83.1</td><td>Varices avec inflammation</td><td>Varices avec dermite de stase (eczéma veineux)</td></tr>
<tr><td>I83.0</td><td>Varices ulcérées</td><td>Ulcère veineux sur varices</td></tr>
<tr><td>I83.2</td><td>Varices avec ulcère et inflammation</td><td>Ulcère et dermite de stase sur varices</td></tr>
<tr><td>I87.00 et I87.01</td><td>Syndrome post-thrombotique sans ou avec ulcération</td><td>Cause intraveineuse secondaire (Esi)</td></tr>
<tr><td>I87.1</td><td>Compression veineuse</td><td>Compression extrinsèque non thrombotique (Ese), par exemple iliaque</td></tr>
<tr><td>I87.20 et I87.21</td><td>Insuffisance veineuse chronique sans ou avec ulcération</td><td>Classes C&#8288;3 à C&#8288;6 sans varices codées en I83</td></tr>
<tr><td>I86.2 et I86.3</td><td>Varices pelviennes et vulvaires</td><td>Reflux pelvien qui peut alimenter des varices des membres</td></tr></table>
<p>Le piège principal concerne I83.1. La mention « avec inflammation » désigne la <b>dermite de stase</b>, et non la thrombose veineuse superficielle ; une thrombophlébite sur varice se code I80.0 et relève du cours I80 — Thrombose veineuse profonde et thromboses veineuses (C-01-Cardiologie). De même, un ulcère sur varices se code I83.0 ou I83.2 ; I87.21 en est exclu. Mme R. relève de I83.1, car son eczéma sus-malléolaire est une dermite de stase. Les exclusions sont détaillées dans la fenêtre <button class="w" data-k="i83-codage">codage CIM-10-GM des varices (correspondances et pièges)</button>.</p>
<div class="key"><b>À retenir.</b> La maladie veineuse chronique couvre tout le spectre, de la jambe lourde sans signe à l’ulcère ; l’insuffisance veineuse chronique commence à l’œdème (C&#8288;3). La CEAP décrit un membre par sa classe la plus élevée et par sa cause, sa localisation et son mécanisme ; le VCSS révisé mesure l’évolution. Le code I83.1 désigne la dermite de stase et non la thrombophlébite. La fréquence de chaque classe et son évolution spontanée font l’objet de l’îlot suivant.</div>
</section>

<section class="ilot" id="i83-2"><h2><span class="n">2</span>Épidémiologie et histoire naturelle</h2>
<p>La maladie veineuse chronique est l’une des affections les plus fréquentes de l’adulte, mais ses chiffres varient selon la définition et la méthode. Une revue systématique de 2021 a regroupé 19 études pour estimer la prévalence de chaque classe clinique (Salim et al.). Ses valeurs ne sont pas ajustées et l’hétérogénéité entre études est forte : elles donnent un ordre de grandeur. Le tableau répond à une question simple : quelle proportion d’adultes se trouve à chaque stade ?</p>
<table class="t"><tr><th>Classe clinique</th><th>C&#8288;0s</th><th>C&#8288;1</th><th>C&#8288;2</th><th>C&#8288;3</th><th>C&#8288;4</th><th>C&#8288;5</th><th>C&#8288;6</th></tr>
<tr><td>Prévalence groupée</td><td>9 %</td><td>26 %</td><td>19 %</td><td>8 %</td><td>4 %</td><td>1 %</td><td>0,42 %</td></tr></table>
<p>La prévalence diminue à mesure que la classe s’aggrave : la plupart des personnes atteintes ont des signes mineurs, et l’ulcère actif reste rare. En Europe, la prévalence groupée des varices (C&#8288;2) atteint 21 % selon l’ESVS. Le chiffre de C&#8288;0s doit être lu avec prudence, car il provient surtout d’une enquête menée en consultation de médecine de famille, sans écho-Doppler. Une femme de 50 ans qui se plaint de jambes lourdes sans aucun signe n’a donc pas forcément une maladie veineuse : d’autres causes doivent être cherchées.</p>
<div class="trap"><span class="k">Lacune documentaire</span>Aucune donnée épidémiologique nationale suisse vérifiée n’a été trouvée, et aucune recommandation suisse propre à la maladie veineuse chronique n’a été identifiée. Les chiffres du cours sont européens ou mondiaux ; ils s’appliquent à la Suisse par analogie, sans mesure directe.</div>
<h3>2.1 Histoire naturelle</h3>
<p>L’Edinburgh Vein Study a suivi 880 adultes pendant 13 ans, avec examen clinique et écho-Doppler des réseaux profond et superficiel. Chaque année, 0,9 % des sujets développaient un reflux. La maladie a progressé chez 57,8 % des participants, soit 4,3 % par an, et un tiers des porteurs de varices non compliquées ont développé des altérations cutanées. La progression était plus fréquente en cas de surpoids ou d’antécédent de thrombose veineuse profonde ; elle n’était associée ni au sexe ni à l’âge. Ainsi, Mme R., en surpoids et porteuse de varices depuis des années, appartient au groupe dont la peau s’altère avec le temps.</p>
<p>Le reflux précède souvent la varice visible. Dans l’étude de Bochum, un reflux sans varice découvert chez de jeunes sujets exposait à un risque de 30 % de varices tronculaires dans les quatre ans. Le reflux est donc la lésion initiale, et la varice sa conséquence. Ce constat justifie que l’examen de référence porte sur le reflux et non sur l’aspect des veines.</p>
<h3>2.2 Association ou causalité</h3>
<p>Le sexe féminin (rapport de cotes 2,26), l’âge, l’obésité, la station debout prolongée, les antécédents familiaux et les grossesses sont associés à la maladie veineuse chronique. Ces données sont transversales : elles montrent une association, sans démontrer que chaque facteur cause la maladie. Les mécanismes plausibles et le niveau de preuve de chaque facteur sont discutés à l’îlot 4 et dans la fenêtre <button class="w" data-k="i83-fdr-hered">hérédité, âge, sexe et grossesses (association ou cause)</button>.</p>
<div class="trap"><span class="k">Erreur fréquente</span>Affirmer que les varices causent la thrombose veineuse profonde. Selon l’ESVS, les varices sont un facteur de risque mineur de thrombose profonde. Une étude de population n’a pas pu établir si ce lien est causal ou s’il traduit des facteurs de risque communs, comme l’âge et l’obésité. La thrombose veineuse superficielle sur varice est différente : elle peut s’étendre au réseau profond, ce que traite l’îlot 8.</div>
<div class="key"><b>À retenir.</b> Environ un adulte sur cinq a des varices, mais moins de 1 % a un ulcère actif. La maladie progresse lentement et souvent : un tiers des varices non compliquées s’accompagnent d’altérations cutanées après 13 ans. Le reflux précède la varice. Les facteurs de risque connus sont surtout des associations. Le mécanisme qui relie le reflux à la peau fait l’objet de l’îlot suivant.</div>
</section>

<section class="ilot" id="i83-3"><h2><span class="n">3</span>Physiopathologie : de la valvule à l’ulcère</h2>
<p>Chez une personne debout et immobile, la pression dans une veine du dos du pied égale le poids de la colonne de sang qui la sépare de l’oreillette droite, soit 80 à 90 mmHg. Lorsque la personne marche, chaque contraction du mollet chasse le sang des veines profondes vers le haut. Les valvules empêchent ensuite le sang de redescendre, et la pression du pied tombe à 20 à 30 mmHg : c’est la <button class="w" data-k="i83-pav">pression veineuse ambulatoire (mesure et signification)</button>. Le retour veineux normal repose donc sur deux conditions : une pompe musculaire active et des valvules continentes.</p>
<h3>3.1 Paroi, valvules et reflux</h3>
<p>Dans la maladie primitive, la paroi et les valvules des veines superficielles s’altèrent en premier. L’ESVS attribue l’origine de ces changements à une inflammation dans laquelle l’endothélium joue un rôle central. La paroi perd de l’élastine et du collagène organisé, se fibrose et se dilate ; les feuillets valvulaires ne se rejoignent plus et la valvule devient incompétente. L’atteinte peut progresser de façon ascendante, des collatérales vers le tronc puis la jonction, ou descendante, de la jonction vers le tronc puis les collatérales. Le sang reflue alors vers le bas à chaque relâchement du mollet.</p>
<p>Le reflux a une conséquence hémodynamique précise. La veine se remplit plus vite par le haut, se vide moins bien, et la pression du pied ne baisse plus suffisamment pendant la marche : la pression veineuse ambulatoire reste élevée. Le flux des veines perforantes, qui va normalement du réseau superficiel vers le profond, augmente aussi ; la perforante se dilate et peut devenir incompétente à son tour. Une vaste étude rétrospective de 4 132 membres a confirmé qu’une pression veineuse ambulatoire plus élevée s’associe à une classe clinique plus grave, surtout en cas de reflux, moins souvent en cas d’obstruction proximale.</p>
<h3>3.2 Réseau profond et causes extraveineuses</h3>
<p>Dans le réseau profond, la vidange est compromise par une obstruction, un reflux ou les deux, le plus souvent après une thrombose. Si le thrombus se recanalise, les valvules prises dans le caillot sont détruites et un reflux profond apparaît. Si la recanalisation est insuffisante, la lumière reste rétrécie et le sang ne sort plus du membre. Lorsque reflux et obstruction coexistent, l’évolution clinique peut être plus sévère. D’autres causes élèvent la pression veineuse sans lésion intraveineuse : une compression iliaque, une insuffisance cardiaque droite, une pompe musculaire déficiente par ankylose de cheville ou par immobilité, et l’obésité.</p>
<h3>3.3 Microcirculation et peau</h3>
<p>La peau souffre par un mécanisme distinct : l’hypertension veineuse se transmet aux capillaires et aux veinules. Les petites veines cutanées possèdent elles aussi des valvules, qui deviennent incompétentes ; les capillaires s’allongent, se dilatent et deviennent tortueux. L’endothélium devient dysfonctionnel : du liquide fuit, des médiateurs inflammatoires sont libérés et des leucocytes migrent dans le derme. Il en résulte un œdème, des manchons de fibrine autour des capillaires, puis une inflammation chronique avec fibrose, pigmentation et calcification. La peau perd enfin son intégrité, et l’ulcère apparaît. Les étapes de cette cascade et les hypothèses encore discutées figurent dans la fenêtre <button class="w" data-k="i83-microcirc">microcirculation et inflammation (de l’hypertension veineuse à la dermite)</button>.</p>

<figcaption>Figure 1 — Chaîne causale de la maladie veineuse chronique : du défaut valvulaire ou de l’obstruction à l’hypertension veineuse ambulatoire, puis à l’atteinte de la microcirculation et de la peau. Pressions mesurées dans une veine du dos du pied (ESVS 2022, § 1.3). Schéma pédagogique.</figcaption></figure>
<p>La figure se lit de haut en bas, puis de gauche à droite. La différence décisive se situe à la deuxième case : chez le sujet normal, la marche fait chuter la pression du pied ; chez le malade, elle la laisse élevée. Tout ce qui suit, de l’œdème à l’ulcère, découle de cette pression maintenue. Chez Mme R., la grande saphène reflue, la pression de sa cheville gauche reste élevée chaque fois qu’elle marche ou se tient debout, et sa peau sus-malléolaire en porte déjà les marques. Les traitements agissent sur deux cases de la figure : la compression et la marche rétablissent la baisse de pression, et la suppression du reflux corrige le défaut valvulaire.</p>
<div class="key"><b>À retenir.</b> La maladie veineuse chronique est une maladie de la pression veineuse ambulatoire : le reflux ou l’obstruction empêche la marche d’abaisser la pression du pied. Cette pression maintenue atteint les capillaires, déclenche une inflammation chronique et explique l’œdème, la pigmentation, la fibrose et l’ulcère. Les causes qui produisent ce défaut sont classées dans l’îlot suivant.</div>
