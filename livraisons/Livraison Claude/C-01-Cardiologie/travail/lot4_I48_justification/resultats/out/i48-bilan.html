<div class="lab">Hémogramme</div><p>Le contenu artériel en oxygène est proportionnel à l’hémoglobine. Quand elle baisse, une activation sympathique élève le débit cardiaque pour maintenir l’apport d’oxygène. En FA, ce tonus accélère la conduction du nœud auriculoventriculaire : la fréquence ventriculaire monte et résiste aux freinateurs ; la diastole raccourcit, ce qui réduit le remplissage et la perfusion coronaire. Sous anticoagulant, l’anémie est aussi un facteur hémorragique modifiable : elle peut révéler un saignement digestif occulte. Une thrombopénie ajoute un défaut d’hémostase primaire. Leur cause est recherchée avant l’anticoagulation ; elles justifient rarement d’y renoncer.</p>
<div class="lab">Créatinine et clairance</div><p>Le dabigatran est éliminé à environ 80 % par le rein, l’apixaban à environ 27 % ; le sotalol et la digoxine le sont surtout par le rein. Quand la filtration baisse, ils s’accumulent : hémorragie sous AOD, torsades de pointes sous sotalol, toxicité digitalique sous digoxine. La clairance de <button class="w" data-k="i48-cg">Cockcroft-Gault</button> fixe donc le choix et la dose : le dabigatran est contre-indiqué sous 30 mL/min, aucun AOD n’est recommandé sous 15 mL/min, et chaque molécule a ses critères de réduction.</p>
<div class="lab">Potassium et magnésium</div><p>Une hypokaliémie allonge la repolarisation ventriculaire et augmente la fixation de la digoxine sur la pompe sodium-potassium ; une hypomagnésémie entretient la fuite rénale de potassium. Ces troubles, souvent dus à un diurétique, sont donc corrigés avant un antiarythmique de classe III, la digoxine ou une cardioversion, car la toxicité digitalique expose à des arythmies ventriculaires après le choc (<button class="w" data-k="i48-k-torsades">mécanisme des torsades</button>). Le ionogramme repère aussi une hyponatrémie due à un diurétique.</p>
<div class="lab">TSH</div><p>Dans les modèles expérimentaux, l’excès d’hormone thyroïdienne raccourcit la période réfractaire auriculaire et augmente l’automatisme : il déclenche et entretient la FA. Une TSH basse fait traiter la thyrotoxicose et différer la cardioversion jusqu’à l’euthyroïdie, car la FA tend à récidiver tant que l’excès persiste. La TSH initiale sert de référence avant l’amiodarone, qui dérègle la thyroïde chez 15 à 20 % des patients traités.</p>
<div class="lab">Tests hépatiques</div><p>Le foie synthétise les facteurs de la coagulation et métabolise en partie les inhibiteurs du facteur Xa. Une cirrhose abaisse ces facteurs et souvent les plaquettes, et l’AOD peut s’accumuler. En classe C de Child-Pugh, aucun AOD n’est recommandé ; le rivaroxaban est contre-indiqué dès la classe B. Les tests servent aussi de référence avant l’amiodarone et la dronédarone, hépatotoxiques.</p>
<div class="lab">Glycémie ou HbA1c</div><p>Le diabète augmente le risque thromboembolique et ajoute le point « D » du score CHA₂DS₂-VA. Un homme de 70 ans diabétique passe ainsi de 1 à 2 points : l’anticoagulation devient recommandée. Un équilibre glycémique efficace est aussi recommandé pour réduire les récidives et la progression de la FA (pilier « C » d’AF-CARE).</p>
<div class="lab">Coagulation de base</div><p>Un INR spontanément allongé évoque une hépatopathie ou un déficit en vitamine K, qui majorent le risque hémorragique. Un temps de céphaline activée allongé sans explication fait rechercher un anticoagulant lupique. Dans un syndrome des antiphospholipides triple positif, l’antivitamine K est préféré, car le rivaroxaban y a entraîné davantage de thromboses artérielles.</p>
<div class="lab">Échocardiographie transthoracique</div><p>Un rétrécissement mitral modéré à sévère ou une prothèse mécanique impose un antivitamine K. Une FEVG ≤ 40 % compte pour le point « C » du score. Elle exclut le vérapamil et le diltiazem, inotropes négatifs qui aggravent la défaillance. Elle exclut aussi la flécaïnide et la propafénone, qui ralentissent la conduction dans un myocarde malade et favorisent des tachycardies ventriculaires par réentrée ; l’amiodarone reste alors le seul antiarythmique recommandé. Une hypertrophie ventriculaire gauche sévère exclut aussi ces deux molécules. Une oreillette gauche dilatée traduit un substrat étiré et fibreux : le rythme sinusal se maintient moins souvent.</p>
