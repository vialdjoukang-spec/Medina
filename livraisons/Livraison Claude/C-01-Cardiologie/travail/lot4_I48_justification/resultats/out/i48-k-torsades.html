<div class="lab">Physiologie normale</div><p>La kaliémie normale se situe entre 3,5 et 5,0 mmol/L. Le gradient de potassium fixe le potentiel de repos des cellules myocardiques. La repolarisation ventriculaire dépend surtout du courant potassique rectifiant retardé rapide, dont la conductance augmente avec le potassium extracellulaire. Sur l’ECG, le QRS mesure la durée de la dépolarisation ventriculaire, et le QT la durée totale jusqu’à la fin de la repolarisation.</p>
<div class="lab">Ce que mesure l’ECG sous antiarythmique</div><p>Le blocage sodique de la classe Ic ralentit la dépolarisation : il élargit le QRS. Le blocage potassique du sotalol, de l’amiodarone et de la dronédarone ralentit la repolarisation : il allonge le QT. Une repolarisation prolongée laisse apparaître des post-dépolarisations précoces, qui déclenchent les torsades de pointes ; l’hétérogénéité de la repolarisation entre les couches de la paroi ventriculaire leur sert de substrat. Au-delà d’un QTc de 500 ms, le risque de torsades est multiplié par deux à trois, d’après les données du syndrome du QT long congénital (Drew et al., 2010).</p>
<div class="lab">Mécanisme des troubles ioniques</div><p><b>Hypokaliémie.</b> Paradoxalement, un potassium extracellulaire bas réduit le courant potassique rectifiant retardé rapide. La repolarisation s’allonge, le QT s’allonge et des ondes U apparaissent. Les antiarythmiques de classe III bloquent ce même courant : les deux effets s’additionnent, et une bradycardie ou une pause les accentue. Avec la digoxine, un potassium bas augmente la fixation du médicament sur la pompe et sa <button class="w" data-k="i48-d-dig">toxicité</button>.</p><p><b>Hypomagnésémie.</b> Le magnésium intracellulaire freine normalement les canaux potassiques sécréteurs du néphron distal. Son déficit lève ce frein et entretient une fuite rénale de potassium : l’hypokaliémie résiste alors à la supplémentation tant que le magnésium n’est pas corrigé (Huang et Kuo, 2007).</p><p><b>Hyperkaliémie.</b> Elle dépolarise partiellement les cellules, inactive une partie des canaux sodiques et ralentit la conduction. Associée à un freinateur, elle favorise une bradycardie et un bloc.</p>
<div class="lab">Conséquence clinique</div><p>Les torsades surviennent surtout quand plusieurs facteurs se cumulent : antiarythmique bloquant le courant potassique, hypokaliémie ou hypomagnésémie souvent dues à un diurétique, bradycardie, sexe féminin, insuffisance rénale ou second médicament allongeant le QT. Elles débutent typiquement après une séquence cycle court, cycle long, cycle court. Le plus souvent, elles cessent seules, mais elles peuvent dégénérer en fibrillation ventriculaire.</p>
<div class="lab">Ce qui change la décision</div><p>Avant un antiarythmique, une cardioversion ou la digoxine, le médecin vérifie que le potassium et le magnésium sont normaux, puis les recontrôle sous diurétique. Sous traitement, il compare le QRS et le QTc à l’ECG de référence. Un QTc supérieur à 500 ms, ou allongé d’au moins 60 ms, impose de réduire ou d’arrêter le médicament et de corriger les électrolytes. En cas de torsades, il administre 2 g de sulfate de magnésium par voie intraveineuse, quelle que soit la magnésémie ; le mécanisme de cet effet reste inconnu. Il peut amener le potassium entre 4,5 et 5,0 mmol/L, une pratique peu documentée. Une torsade qui ne cesse pas ou dégénère impose un choc électrique immédiat. Les pauses qui déclenchent les torsades se préviennent si besoin par une stimulation temporaire à plus de 70/min.</p>
<div class="lab">Source</div><p>Drew et al., Prevention of torsade de pointes in hospital settings, Circulation 2010;121:1047-60 ; Roden, N Engl J Med 2004;350:1013-22 ; Huang, Kuo, J Am Soc Nephrol 2007;18:2649-52 ; ESC 2024 sur la FA (Van Gelder et al.), tableau 13 ; Guyton &amp; Hall, Textbook of Medical Physiology, 14e éd., chapitres sur le potentiel de membrane et l’ECG.</p></template>
