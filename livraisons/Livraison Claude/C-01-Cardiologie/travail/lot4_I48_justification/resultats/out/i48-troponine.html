<template data-pop="i48-troponine" data-title="Troponine et segment ST en FA rapide : ischémie de demande ou syndrome coronarien">
<div class="lab">Physiologie normale</div><p>Le sous-endocarde du ventricule gauche est comprimé pendant la systole : il est perfusé surtout en diastole. Quand la fréquence augmente, la diastole raccourcit davantage que la systole. À 72/min, la systole occupe environ 40 % du cycle ; à une fréquence triple, elle en occupe environ 65 %. Dans le même temps, la consommation d’oxygène du myocarde augmente avec la fréquence.</p>
<div class="lab">Mécanisme</div><p>En FA rapide, l’apport sous-endocardique baisse alors que la demande augmente, et les cycles les plus courts écourtent encore la diastole. Il en résulte une ischémie sous-endocardique fonctionnelle, sans occlusion coronaire. Elle se traduit par un sous-décalage diffus du segment ST et peut libérer de la troponine. La quatrième définition universelle classe cette situation en lésion myocardique ou, si les critères d’infarctus sont réunis, en infarctus de type 2, par déséquilibre entre apport et demande. L’ESC 2024 note que la FA déclenche fréquemment des infarctus de type 2 (section 9.2). Une coronaropathie ou une hypertrophie ventriculaire abaissent le seuil de cette ischémie.</p>
<div class="lab">Conséquence clinique</div><p>Une ischémie de demande régresse quand la fréquence baisse : le sous-décalage disparaît et la troponine reste modeste. Une valeur élevée mais stable sur des dosages répétés traduit plutôt une lésion myocardique chronique, liée à une cardiopathie sous-jacente. Une hausse ou une baisse significative signe une lésion aiguë, mais ne sépare pas à elle seule l’infarctus de type 2 de l’infarctus de type 1, dû à la rupture ou à l’érosion d’une plaque athéroscléreuse compliquée d’un thrombus. Plusieurs signes orientent vers un type 1 : des anomalies du segment ST limitées à un territoire, un sus-décalage, une douleur qui persiste après ralentissement, une hausse importante de la troponine ou un trouble segmentaire de la contraction.</p>
<div class="lab">Ce qui change la décision</div><p>Le médecin ralentit d’abord la fréquence, puis répète l’ECG et la troponine selon l’algorithme de son laboratoire. Si les signes persistent après ralentissement, si la cinétique est franche ou si un trouble segmentaire apparaît, il recherche une coronaropathie par scanner coronaire, imagerie d’ischémie ou coronarographie (ESC 2024, tableau 8). Un syndrome coronarien aigu suit alors les recommandations ESC 2023. Une coronaropathie avérée exclut la flécaïnide et la propafénone (ESC 2024, tableau de recommandations 18). Après une angioplastie coronaire, l’anticoagulant s’associe temporairement à un antiplaquettaire (ESC 2024, section 9.2).</p>
