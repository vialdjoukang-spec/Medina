<p>Aucune recommandation ESC de 2026 ne remplace l’ESC 2025 sur les myocardites et péricardites. Trois textes de 2026 la complètent : l’insuffisance cardiaque, la réadaptation cardiaque et la cinquième définition universelle de l’infarctus. Le changement utile au lit du patient porte sur la conduite après la récupération de la fonction ventriculaire.</p>
<table class="t"><tr><th>Point</th><th>Référentiel antérieur</th><th>ESC 2026</th></tr>
<tr><td>Traitement après normalisation de la FEVG</td><td>ESC 2025 : poursuivre au moins 6 mois après la récupération complète (IIa, C), sans règle de sevrage.</td><td>Insuffisance cardiaque : poursuivre la thérapie médicamenteuse fondamentale aux doses maximales tolérées, même après amélioration de la FEVG (I, C). Arrêt progressif envisageable (IIb, C) chez un patient très sélectionné, asymptomatique, après traitement d’une cause réversible, si la fonction, les volumes ventriculaires et les peptides natriurétiques sont normalisés.</td></tr>
<tr><td>Classement de la FEVG</td><td>ESC 2025, stratification du risque : &lt; 40 % élevé ; 41–49 % intermédiaire ; ≥ 50 % faible si le rehaussement tardif est absent ou limité.</td><td>Insuffisance cardiaque : fraction réduite &lt; 50 % et préservée ≥ 50 %. Le terme « décompensée » remplace « aiguë ».</td></tr>
<tr><td>Biopsie endomyocardique</td><td>ESC 2025 : recommandée (I, C) dans la myocardite à haut risque, en cas d’instabilité hémodynamique, ou à risque intermédiaire sans réponse au traitement.</td><td>Insuffisance cardiaque : à envisager (IIa, C) en cas d’aggravation rapide malgré le traitement, ou si les examens suggèrent une inflammation, une infiltration ou une surcharge non identifiable autrement.</td></tr>
<tr><td>Effort</td><td>ESC 2025 : restriction jusqu’à la rémission, au moins un mois (I, C).</td><td>Réadaptation : la myocardite aiguë contre-indique l’épreuve d’effort et l’entraînement.</td></tr>
<tr><td>Troponine</td><td>Quatrième définition : infarctus numérotés de type 1 à 5.</td><td>Cinquième définition : infarctus primaire, secondaire ou lié à une procédure ; la myocardite reste une lésion myocardique aiguë d’origine inflammatoire, définie par le 99e percentile propre au sexe.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>La nouvelle classification renomme le groupe 41–49 % ; elle ne modifie pas les strates de risque de la myocardite, qui restent celles de l’ESC 2025. Elle modifie en revanche le libellé du traitement : chez le patient symptomatique, une FEVG à 45 % relève désormais de la fraction réduite, où le bêtabloquant et l’IEC ou l’ARNI sont recommandés. L’antagoniste minéralocorticoïde et l’inhibiteur du SGLT2 le sont quelle que soit la FEVG. Les seuils propres à un traitement restent ceux des essais : défibrillateur et ivabradine à FEVG ≤ 35 %, glycoside cardiaque à FEVG ≤ 40 % en traitement chronique. Les deux biopsies ne se contredisent pas : l’ESC 2025 vise la myocardite à haut risque, l’ESC 2026 toute insuffisance cardiaque d’origine incertaine. Après guérison, le traitement est poursuivi par défaut ; un arrêt se fait par étapes, sous contrôle échographique et biologique, car la rechute reste possible.</p>
