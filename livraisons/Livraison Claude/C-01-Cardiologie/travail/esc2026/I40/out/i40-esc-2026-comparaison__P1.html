<template data-pop="i40-esc-2026-comparaison" data-title="Myocardite : ce que changent les textes ESC 2026">
<p>Aucune recommandation ESC de 2026 ne remplace l’ESC 2025 sur les myocardites et péricardites. Le changement utile porte sur le traitement après récupération de la fonction ventriculaire : l’ESC 2026 sur l’insuffisance cardiaque le poursuit par défaut et fixe des conditions strictes à son arrêt.</p>
<table class="t"><tr><th>Point</th><th>ESC 2025 (myocardites)</th><th>ESC 2026</th></tr>
<tr><td>Traitement après normalisation de la FEVG</td><td>Poursuivre au moins 6 mois après la récupération complète (IIa, C), sans règle de sevrage.</td><td>Insuffisance cardiaque : poursuivre la thérapie médicamenteuse fondamentale aux doses maximales tolérées, même si le patient devient asymptomatique ou si la FEVG s’améliore (I, C). Arrêt progressif envisageable (IIb, C) chez un patient très sélectionné, asymptomatique, après traitement d’une cause réversible, si la fonction, les volumes ventriculaires et les peptides natriurétiques sont normalisés, pour respecter sa préférence.</td></tr>
<tr><td>Biopsie endomyocardique</td><td>Recommandée (I, C) dans la myocardite à haut risque, en cas d’instabilité hémodynamique, ou à risque intermédiaire sans réponse au traitement.</td><td>Insuffisance cardiaque : à envisager (IIa, C) si l’insuffisance cardiaque s’aggrave vite malgré le traitement, ou si les examens évoquent une inflammation, une infiltration ou une surcharge non identifiable autrement.</td></tr>
<tr><td>Classement de la FEVG</td><td>Strates de risque : &lt; 40 % élevé ; 41–49 % intermédiaire ; ≥ 50 % faible si le rehaussement tardif est absent ou limité.</td><td>Insuffisance cardiaque : fraction réduite &lt; 50 %, préservée ≥ 50 %. « Décompensée » remplace « aiguë ».</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Après guérison, le traitement est maintenu sans limite de durée. Dans l’essai TRED-HF, la plupart des patients dont la fonction s’était améliorée ont rechuté après le sevrage. Un arrêt se discute seulement à la demande du patient, par étapes, sous surveillance clinique, biologique et échographique rapprochée. Les deux recommandations de biopsie se complètent : l’ESC 2025 vise la myocardite à haut risque, l’ESC 2026 l’insuffisance cardiaque qui s’aggrave ou dont la cause infiltrative ou inflammatoire reste à prouver. La nouvelle classification renomme le groupe 41–49 % sans modifier les strates de risque de la myocardite, qui restent celles de l’ESC 2025. L’épreuve d’effort et l’entraînement attendent la rémission : la réadaptation 2026 range la myocardite aiguë parmi leurs contre-indications, et l’ESC 2025 restreint l’effort au moins un mois (I, C).</p>
