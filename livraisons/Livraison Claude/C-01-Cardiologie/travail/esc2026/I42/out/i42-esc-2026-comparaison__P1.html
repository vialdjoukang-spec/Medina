<template data-pop="i42-esc-2026-comparaison" data-title="Cardiomyopathies : ce que changent les textes ESC 2026">
<p>L’ESC 2023 sur les cardiomyopathies reste le référentiel propre au chapitre. Le changement thérapeutique le plus net vient de l’ESC 2026 sur l’insuffisance cardiaque : dans l’amylose à transthyrétine, trois molécules sont recommandées au plus haut niveau jusqu’à la classe NYHA III. Les autres changements touchent la classification et le bilan.</p>
<table class="t"><tr><th>Point</th><th>Avant 2026</th><th>ESC 2026</th></tr>
<tr><td>Amylose ATTR : traitement</td><td>ESC 2021 sur l’insuffisance cardiaque : tafamidis seul, classe I, niveau B, en classe NYHA I ou II.</td><td>Silenceur (vutrisiran) ou stabilisateur (tafamidis, acoramidis), classe I, niveau A, en classe NYHA I à III, forme sauvage ou héréditaire.</td></tr>
<tr><td>Amylose : diagnostic</td><td>ESC 2023 : scintigraphie osseuse si une ATTR est suspectée (I, B).</td><td>Immunofixation sérique et urinaire, chaînes légères libres et scintigraphie osseuse d’emblée, ensemble, si une amylose est suspectée (I, B). Maladie rénale chronique : une insuffisance cardiaque inexpliquée fait rechercher une amylose ou une maladie de Fabry (IIa, C).</td></tr>
<tr><td>Phénotype</td><td>ESC 2021 : fraction réduite ≤ 40 %, légèrement réduite 41–49 %, préservée ≥ 50 %.</td><td>Fraction réduite &lt; 50 %, préservée ≥ 50 %. Le stade B désigne l’anomalie cardiaque sans symptôme ni signe.</td></tr>
<tr><td>Bilan étiologique</td><td>ESC 2023 : IRM avec contraste (I, B) et génétique (I, B) au bilan initial.</td><td>IRM avec contraste si cardiomyopathie suspectée ou cause incertaine (I, C) ; génétique (I, C) ; TEP au FDG si sarcoïdose suspectée (IIa, C).</td></tr>
<tr><td>Activité physique</td><td>ESC 2023 : exercice d’intensité faible à modérée, décision individualisée.</td><td>Réadaptation : entraînement à envisager dans la CMH stable (IIa, B1) ; réadaptation envisageable dans les cardiomyopathies primitives sans arythmie significative ni insuffisance cardiaque symptomatique (IIb, C). Une CMH avec obstruction sévère contre-indique l’épreuve d’effort et l’entraînement.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Dans l’ATTR, la classe NYHA III n’exclut plus le traitement spécifique. Il s’agit d’une indication médicamenteuse élargie, non d’une nouvelle définition de la maladie. Le bilan conjoint écarte d’emblée une amylose AL, dont le traitement est hématologique et urgent ; une scintigraphie positive ne suffit pas sans cette recherche. La classification 2026 range une CMD symptomatique à FEVG 45 % dans la fraction réduite, où bêtabloquant et IEC ou ARNI sont recommandés ; aucun grand essai n’a toutefois porté sur le seul intervalle 41–49 %. Elle ne déplace pas les seuils des dispositifs : défibrillateur et resynchronisation restent fondés sur une FEVG ≤ 35 %, et les critères de mort subite propres au génotype restent ceux de l’ESC 2023.</p>
