<p>L’ESC 2023 sur les cardiomyopathies reste le référentiel propre au chapitre. Trois recommandations de 2026 la complètent : l’insuffisance cardiaque, la réadaptation cardiaque et la maladie cardiovasculaire associée à une maladie rénale chronique. Le changement thérapeutique le plus net concerne l’amylose à transthyrétine ; les autres touchent la classification et le bilan.</p>
<table class="t"><tr><th>Point</th><th>Avant 2026</th><th>ESC 2026</th></tr>
<tr><td>Amylose ATTR : traitement</td><td>ESC 2021 sur l’insuffisance cardiaque : tafamidis, classe I, niveau B, en classe NYHA I ou II.</td><td>Silenceur (vutrisiran) ou stabilisateur (tafamidis, acoramidis), classe I, niveau A, en classe NYHA I à III, forme sauvage ou héréditaire.</td></tr>
<tr><td>Amylose : diagnostic</td><td>ESC 2023 : scintigraphie osseuse recommandée si une ATTR est suspectée (I, B).</td><td>Immunofixation sérique et urinaire, chaînes légères libres et scintigraphie osseuse d’emblée, ensemble, chez un patient en insuffisance cardiaque suspect d’amylose (I, B). Avec une maladie rénale chronique, une insuffisance cardiaque inexpliquée fait rechercher une amylose ou une maladie de Fabry (IIa, C).</td></tr>
<tr><td>Phénotype de l’insuffisance cardiaque</td><td>ESC 2021 : fraction réduite ≤ 40 %, légèrement réduite 41–49 %, préservée ≥ 50 %.</td><td>Fraction réduite &lt; 50 %, préservée ≥ 50 % ; stades A à D, le stade B incluant l’anomalie structurelle sans symptôme.</td></tr>
<tr><td>Bilan étiologique</td><td>ESC 2021 : rehaussement tardif de la CMD à envisager (IIa, C). ESC 2023 : IRM avec contraste (I, B) et génétique (I, B) au bilan initial.</td><td>IRM avec contraste si cardiomyopathie suspectée ou cause incertaine (I, C) ; génétique (I, C) ; TEP au FDG si sarcoïdose suspectée (IIa, C) ; biopsie si l’insuffisance cardiaque s’aggrave vite malgré le traitement, ou si les examens évoquent une inflammation, une infiltration ou une surcharge non identifiable autrement (IIa, C).</td></tr>
<tr><td>Activité physique</td><td>ESC 2023 et ESC 2020 : décision individualisée.</td><td>Réadaptation : entraînement à envisager dans la CMH stable (IIa) ; réadaptation envisageable dans les cardiomyopathies primitives sans arythmie significative ni insuffisance cardiaque symptomatique (IIb, C). Une CMH avec obstruction sévère contre-indique l’épreuve d’effort et l’entraînement.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Dans l’ATTR, la classe NYHA III n’exclut plus le traitement spécifique, et trois molécules partagent la même recommandation ; il s’agit d’une indication médicamenteuse élargie, non d’une nouvelle définition de la maladie. La classification 2026 range une CMD à FEVG 45 % dans la fraction réduite, où bêtabloquant et IEC ou ARNI sont recommandés chez le patient symptomatique. Elle ne déplace pas les seuils propres aux dispositifs : défibrillateur et resynchronisation restent fondés sur une FEVG ≤ 35 %, et les critères de mort subite propres au génotype restent ceux de l’ESC 2023. Après normalisation de la FEVG, la thérapie fondamentale est poursuivie (I, C). Dans la CMH avec obstruction sévère, l’entraînement attend la réduction du gradient. L’échocardiographie d’effort de l’ESC 2023 vise au contraire le patient symptomatique dont le gradient reste inférieur à 50 mmHg au repos et lors des manœuvres, pour démasquer une obstruction provoquée (I, B).</p>
