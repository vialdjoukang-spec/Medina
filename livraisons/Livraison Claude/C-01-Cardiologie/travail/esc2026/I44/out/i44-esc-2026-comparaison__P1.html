<template data-pop="i44-esc-2026-comparaison" data-title="ESC 2026 : resynchronisation dans le BAV et dispositifs chez le dialysé">
<p>L’ESC n’a publié en 2026 aucune recommandation propre à la stimulation : les indications de stimulation restent celles de 2021. Deux textes de 2026 modifient pourtant des décisions de ce chapitre. La recommandation sur l’insuffisance cardiaque change la classification de la fraction d’éjection et affaiblit la recommandation de resynchronisation dans le BAV. La recommandation sur la maladie rénale chronique ajoute une mesure contre l’infection des dispositifs.</p>
<table class="t"><tr><th>Point</th><th>Référentiel antérieur</th><th>ESC 2026</th></tr>
<tr><td>Fraction d’éjection réduite</td><td>≤ 40 % (insuffisance cardiaque 2021) ; &lt; 40 % dans la recommandation de stimulation 2021.</td><td>&lt; 50 % ; la catégorie 41–49 % disparaît. C’est une classification, non une indication.</td></tr>
<tr><td>Resynchronisation plutôt que stimulation ventriculaire droite, si BAV de haut degré et fraction réduite</td><td>Recommandée : classe I, niveau A (stimulation 2021 et insuffisance cardiaque 2021).</td><td>À envisager : classe IIa, niveau B1, pour réduire les hospitalisations pour insuffisance cardiaque et les décès ; elle vise toute insuffisance cardiaque à fraction &lt; 50 %.</td></tr>
<tr><td>Stimulation du système de conduction si la fraction est réduite</td><td>Consensus clinique ESC 2025 : alternative à la resynchronisation biventriculaire.</td><td>Aucune recommandation : aucun essai randomisé n’a évalué ses effets cliniques ni sa sécurité à long terme dans cette population.</td></tr>
<tr><td>Insuffisance cardiaque nouvelle ou aggravée chez un patient appareillé</td><td>Mise à niveau vers une resynchronisation à envisager si fraction ≤ 35 % et part importante de stimulation ventriculaire droite (IIa, B).</td><td>Même mise à niveau (IIa, B1). Nouvelle recommandation : vérifier la part de stimulation ventriculaire droite (IIa, C).</td></tr>
<tr><td>Enveloppe antibiotique</td><td>Réintervention sur un dispositif : IIb, B (stimulation 2021).</td><td>Patient hémodialysé ou greffé rénal : IIb, C, en plus de l’antibioprophylaxie.</td></tr></table>
<div class="lab">Pourquoi ces changements ?</div><p>La stimulation à la pointe du ventricule droit active le ventricule gauche avec retard ; quand elle est fréquente, cet asynchronisme peut altérer sa fonction. La resynchronisation stimule aussi la paroi latérale et rétablit une contraction coordonnée. La recommandation de 2026 s’appuie sur l’essai BLOCK HF : chez 691 patients en BAV dont la fraction était ≤ 50 %, le critère composite (décès, soins urgents pour insuffisance cardiaque, dilatation du ventricule gauche) est passé de 55,6 % à 45,8 %. Le niveau B1 de la nouvelle échelle de l’ESC désigne au moins un essai randomisé de puissance suffisante, sans biais majeur ; il ne se compare pas terme à terme à l’ancien niveau B. Chez le patient hémodialysé, le risque d’infection du dispositif est plus élevé ; dans l’essai WRAP-IT, l’enveloppe a réduit les infections, sans effet différent selon la fonction rénale.</p>
<div class="lab">Ce qui change pour la décision</div><p>Devant un BAV de haut degré qui imposera une stimulation ventriculaire fréquente, la fraction d’éjection est mesurée avant l’implantation. Chez un patient en insuffisance cardiaque dont la fraction est de 40 à 49 %, la resynchronisation entre désormais dans le champ de la recommandation, comme option à discuter et non comme obligation. Chez un patient appareillé dont la fonction se dégrade, l’interrogation du dispositif mesure la part de stimulation ventriculaire droite. Chez le dialysé, l’enveloppe se discute en plus de la préservation des veines de la fistule.</p>
<div class="lab">Limites</div><p>Les indications de stimulation ne diffèrent pas selon qu’il existe ou non une insuffisance cardiaque (ESC 2026, section 9.1.3). La réadaptation 2026 est recommandée après un défibrillateur ou une resynchronisation (I, B1), sans recommandation propre au stimulateur anti-bradycardique seul.</p>
