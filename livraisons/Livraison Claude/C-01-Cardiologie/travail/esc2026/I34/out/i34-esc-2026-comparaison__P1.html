<template data-pop="i34-esc-2026-comparaison" data-title="Fuite mitrale secondaire : l’ESC 2026 face à l’ESC/EACTS 2025">
<p>Pour la fuite mitrale secondaire ventriculaire, l’ESC 2026 sur l’insuffisance cardiaque rejoint l’ESC/EACTS 2025 : la TEER est recommandée (classe I) chez le patient qui remplit les critères issus des essais. Le progrès concerne le référentiel de l’insuffisance cardiaque, qui ne proposait qu’une classe IIa en 2021. Les critères de sélection et la séquence de décision ne changent pas.</p>
<table class="t"><tr><th>Point</th><th>Avant 2026</th><th>ESC 2026</th></tr>
<tr><td>TEER avec critères</td><td>ESC/EACTS 2025 : recommandée (I, A) si FEVG &lt; 50 % et fuite sévère persistante malgré un traitement optimisé et une resynchronisation indiquée. ESC 2021 sur l’insuffisance cardiaque : à envisager (IIa, B).</td><td>Recommandée (I, B1) dans l’ICFEr, aux mêmes conditions, pour réduire les hospitalisations pour insuffisance cardiaque et améliorer la qualité de vie.</td></tr>
<tr><td>TEER hors critères</td><td>ESC/EACTS 2025 : peut être envisagée pour les symptômes (IIb, B).</td><td>Peut être envisagée pour les symptômes (IIb, C), après avoir écarté l’assistance ventriculaire gauche ou la greffe.</td></tr>
<tr><td>Critères de sélection</td><td>NYHA ≥ II ; FEVG 20–50 % ; diamètre télésystolique ≤ 70 mm ; hospitalisation dans l’année ou BNP ≥ 300 pg/mL ou NT-proBNP ≥ 1000 pg/mL ; PAPs ≤ 70 mmHg.</td><td>Liste identique. Maladie rénale chronique : indications inchangées quel que soit son stade.</td></tr>
<tr><td>Fuite tricuspide</td><td>ESC/EACTS 2025 : traitement percutané à envisager chez le patient à haut risque chirurgical (IIa, A).</td><td>Aucune recommandation propre ; renvoi à l’ESC/EACTS 2025.</td></tr>
<tr><td>Après un geste valvulaire</td><td>ESC/EACTS 2025 : réadaptation décrite sans recommandation classée.</td><td>Réadaptation : entraînement à envisager après traitement chirurgical ou percutané (IIa, B2) ; réadaptation après chirurgie valvulaire pour réduire les réhospitalisations (IIb, B2).</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Les niveaux A (2025) et B1 (2026) ne se contredisent pas : l’ESC a adopté en 2026 une nouvelle échelle, où B1 désigne au moins un essai randomisé de puissance suffisante. Dans les essais COAPT et RESHAPE-HF2, le bénéfice sur le critère principal ne variait pas avec le DFG initial ; une insuffisance rénale ne suffit donc pas à récuser le geste. La nouvelle ICFEr, inférieure à 50 %, ne déplace pas l’indication, car les essais incluaient déjà des FEVG de 20 à 50 %. La séquence reste : thérapie médicamenteuse fondamentale titrée, resynchronisation si elle est indiquée, réévaluation en euvolémie, puis TEER en équipe cardiaque si la fuite reste sévère. En insuffisance cardiaque avancée, l’assistance ventriculaire ou la greffe passent avant la TEER. Pour la valve tricuspide, les essais ouverts ont amélioré la qualité de vie sans réduire, à un an, les décès ni les hospitalisations.</p>
