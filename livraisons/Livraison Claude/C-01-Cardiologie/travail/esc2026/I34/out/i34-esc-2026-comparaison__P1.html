<template data-pop="i34-esc-2026-comparaison" data-title="Fuite mitrale secondaire : l’ESC 2026 face à l’ESC/EACTS 2025">
<p>Pour la fuite mitrale secondaire ventriculaire, l’ESC 2026 sur l’insuffisance cardiaque rejoint l’ESC/EACTS 2025 : la TEER est recommandée (classe I) chez le patient qui remplit les critères issus des essais. La progression concerne le référentiel de l’insuffisance cardiaque, qui ne proposait qu’une classe IIa en 2021. Les critères de sélection et la séquence de décision restent les mêmes.</p>
<table class="t"><tr><th>Point</th><th>ESC/EACTS 2025</th><th>ESC 2026</th></tr>
<tr><td>TEER avec critères</td><td>Recommandée (I, A) : FEVG &lt; 50 %, fuite sévère persistante malgré un traitement optimisé et une resynchronisation si elle est indiquée.</td><td>Insuffisance cardiaque : recommandée (I, B1) dans l’ICFEr, aux mêmes conditions, pour réduire les hospitalisations et améliorer la qualité de vie. ESC 2021 : à envisager (IIa, B).</td></tr>
<tr><td>TEER hors critères, pour les symptômes</td><td>Peut être envisagée (IIb, B), après évaluation de l’assistance ventriculaire ou de la greffe.</td><td>Peut être envisagée (IIb, C), après avoir écarté l’assistance ventriculaire gauche ou la greffe.</td></tr>
<tr><td>Critères de sélection</td><td>NYHA ≥ II ; FEVG 20–50 % ; diamètre télésystolique ≤ 70 mm ; hospitalisation dans l’année ou BNP ≥ 300 pg/mL ou NT-proBNP ≥ 1000 pg/mL ; PAPs ≤ 70 mmHg ; mêmes exclusions.</td><td>Liste identique. Maladie rénale chronique : indications inchangées quel que soit son stade.</td></tr>
<tr><td>Fuite tricuspide</td><td>Traitement percutané à envisager chez le patient à haut risque chirurgical (IIa, A).</td><td>Insuffisance cardiaque : aucune recommandation propre ; renvoi à l’ESC/EACTS 2025.</td></tr>
<tr><td>Après un geste valvulaire</td><td>Pas de recommandation de réadaptation.</td><td>Réadaptation : entraînement à envisager après traitement chirurgical ou percutané (IIa, B2) ; réadaptation après chirurgie valvulaire pour réduire les réhospitalisations (IIb, B2).</td></tr></table>
<div class="lab">Pourquoi ces différences</div><p>Les niveaux A et B1 ne se contredisent pas. En 2026, l’ESC a regradé toutes ses recommandations sur une nouvelle échelle : B1 désigne au moins un essai randomisé de puissance suffisante, sans biais majeur. La TEER réduit le volume régurgité, donc la surcharge de volume et la pression auriculaire gauche ; le bénéfice des essais COAPT et RESHAPE-HF2 sur leur critère principal ne variait pas avec le DFG initial. Une insuffisance rénale ne suffit donc pas à récuser le geste. Pour la valve tricuspide, les essais randomisés ont amélioré la qualité de vie sans réduire, à un an, les décès ni les hospitalisations pour insuffisance cardiaque ; un bénéfice ultérieur sur les hospitalisations reste incertain. Ces essais étaient ouverts et ne ciblaient pas un phénotype d’insuffisance cardiaque.</p>
<div class="lab">Classification et indication</div><p>L’ICFEr inclut désormais les FEVG de 41 à 49 %. Pour la TEER, ce changement de nom ne déplace rien : les essais incluaient déjà des FEVG de 20 à 50 %. D’autres indications gardent leur propre seuil : l’IEC au stade B et le glycoside cardiaque restent réservés à une FEVG ≤ 40 %. Le cas d’un patient à 45 % se règle donc indication par indication, et non par le seul nom du phénotype.</p>
<div class="lab">Ce qui change la décision</div><p>Rien dans la séquence : thérapie médicamenteuse fondamentale titrée, resynchronisation si elle est indiquée, réévaluation en euvolémie, puis TEER en équipe cardiaque si la fuite reste sévère et si les critères sont remplis. En insuffisance cardiaque avancée, l’assistance ventriculaire ou la greffe passent avant la TEER.</p>
