<p>Depuis 2026, la réadaptation cardiaque est une recommandation de classe I chez l’adulte porteur d’une cardiopathie congénitale dont la capacité cardiorespiratoire est réduite ou qui vient d’être opéré. L’ESC 2020 encourageait l’activité physique, sans recommandation classée sur la réadaptation. La recommandation 2026 sur l’insuffisance cardiaque ne contient pour eux qu’une recommandation diagnostique et renvoie à l’ESC 2020 pour le traitement.</p>
<table class="t"><tr><th>Point</th><th>ESC 2020 (cardiopathies congénitales de l’adulte)</th><th>ESC 2026</th></tr>
<tr><td>Réadaptation et entraînement</td><td>Activité encouragée, adaptée à la lésion, à l’hémodynamique, aux arythmies et à la condition ; intensité fixée après mesure de la capacité d’effort.</td><td>Réadaptation recommandée si la capacité est réduite ou après une chirurgie cardiaque (I, B1). Entraînement recommandé dans ce cadre pour la consommation maximale d’oxygène et la force musculaire (I, B1).</td></tr>
<tr><td>Facteurs de risque acquis</td><td>Activité physique jugée favorable au risque de cardiopathie acquise, sans recommandation classée.</td><td>Réadaptation recommandée pour améliorer le profil de risque cardiovasculaire (I, C).</td></tr>
<tr><td>Insuffisance cardiaque</td><td>Prise en charge selon la lésion ; pas de prescription systématique des médicaments du ventricule gauche pour un ventricule droit systémique.</td><td>Cathétérisme droit à envisager si l’insuffisance cardiaque paraît due à la cardiopathie (IIa, C) ; aucune recommandation thérapeutique propre. Les phénotypes &lt; 50 % et ≥ 50 % reposent sur la fraction d’éjection du ventricule gauche.</td></tr></table>
<div class="lab">Pourquoi ces changements ?</div><p>Un adulte qui a grandi avec une cardiopathie a souvent limité ses efforts, et sa condition baisse encore avec l’âge sur les épreuves cardiorespiratoires répétées. Une capacité réduite s’associe, indépendamment de la complexité de la lésion, à une mortalité plus élevée ; cette association ne prouve pas que l’entraînement réduise la mortalité. Les essais montrent en revanche que l’entraînement améliore la consommation d’oxygène et abaisse les peptides natriurétiques. La survie s’allonge, et l’hypertension, le diabète et l’obésité s’ajoutent à la malformation : le risque d’insuffisance cardiaque est environ huit fois plus élevé que chez des témoins de même âge et de même sexe, avec un début 20 à 25 ans plus tôt. L’insuffisance cardiaque explique 26 à 46 % des décès selon les séries.</p>
<div class="lab">Ce qui change pour la décision</div><p>Après une chirurgie cardiaque, ou si l’épreuve d’effort cardiorespiratoire montre une capacité réduite, le patient est adressé à un programme de réadaptation. L’intensité reste fixée individuellement : la dysfonction du ventricule systémique, l’obstacle à son éjection, l’hypertension pulmonaire, les arythmies significatives et la dilatation aortique imposent plus de prudence (ESC 2020).</p>
<div class="lab">Limites</div><p>Le texte 2026 ne détaille ni le Fontan, ni le ventricule droit systémique, ni les cardiopathies cyanogènes. Dans l’hypertension artérielle pulmonaire avec dysfonction ventriculaire droite, la réadaptation est seulement « à envisager » (IIa, B1), alors que l’ESC/ERS 2022 recommande l’entraînement supervisé sous traitement (I, A) ; les patients étudiés relevaient surtout du groupe 1. Le niveau B1 de la nouvelle échelle ne se compare pas terme à terme à l’ancien niveau B.</p>
