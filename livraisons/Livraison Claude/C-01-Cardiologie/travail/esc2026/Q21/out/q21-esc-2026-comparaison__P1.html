<template data-pop="q21-esc-2026-comparaison" data-title="ESC 2026 : réadaptation et insuffisance cardiaque de l’adulte congénital">
<p>Depuis 2026, la réadaptation cardiaque est recommandée (classe I) chez l’adulte porteur d’une cardiopathie congénitale dont la capacité cardiorespiratoire est réduite ou qui vient d’être opéré. L’ESC 2020 encourageait l’activité physique, sans recommandation classée sur la réadaptation. L’ESC 2026 sur l’insuffisance cardiaque ne contient pour ces patients qu’une recommandation diagnostique et renvoie à l’ESC 2020 pour le traitement.</p>
<table class="t"><tr><th>Point</th><th>ESC 2020 (cardiopathies congénitales de l’adulte)</th><th>ESC 2026</th></tr>
<tr><td>Réadaptation et entraînement</td><td>Activité encouragée ; conseils fondés sur la lésion, l’état hémodynamique et rythmique et la condition physique préalable, sans recommandation classée sur la réadaptation.</td><td>Réadaptation recommandée si la capacité est réduite ou après une chirurgie cardiaque (I, B1) ; entraînement recommandé dans ce cadre pour la consommation maximale d’oxygène et la force musculaire (I, B1) ; réadaptation recommandée pour améliorer le profil de risque cardiovasculaire (I, C).</td></tr>
<tr><td>Insuffisance cardiaque</td><td>Traitement selon les recommandations générales de l’insuffisance cardiaque ; applicable au ventricule droit systémique, sans certitude que le bénéfice démontré pour le ventricule gauche s’y retrouve.</td><td>Cathétérisme droit à envisager si l’insuffisance cardiaque paraît due à la cardiopathie congénitale (IIa, C) ; aucune recommandation thérapeutique propre. Les phénotypes &lt; 50 % et ≥ 50 % reposent sur la fraction d’éjection du ventricule gauche.</td></tr></table>
<div class="lab">Ce qui change pour la décision</div><p>Après une chirurgie cardiaque, ou si l’épreuve d’effort cardiorespiratoire montre une capacité réduite, le patient est adressé à un programme de réadaptation. Un adulte qui a grandi avec une cardiopathie a souvent limité ses efforts, et sa condition baisse encore avec l’âge. Une capacité réduite s’associe, comme la complexité de la lésion et de façon indépendante, à une mortalité plus élevée ; cette association ne prouve pas que l’entraînement réduise la mortalité, mais les essais montrent qu’il améliore la consommation d’oxygène et abaisse les peptides natriurétiques. L’intensité reste fixée individuellement : la dysfonction du ventricule systémique, l’obstacle à son éjection, l’hypertension pulmonaire, les arythmies significatives et la dilatation aortique imposent plus de prudence (ESC 2020). L’insuffisance cardiaque pèse lourd : risque environ huit fois plus élevé que chez des témoins de même âge et de même sexe, début 20 à 25 ans plus tôt, 26 à 46 % des décès selon les séries.</p>
<div class="lab">Limites</div><p>Le texte 2026 ne détaille ni le Fontan, ni le ventricule droit systémique, ni les cardiopathies cyanogènes. Dans l’hypertension artérielle pulmonaire avec dysfonction ventriculaire droite, la réadaptation est seulement « à envisager » (IIa, B1), alors que l’ESC/ERS 2022 recommande l’entraînement supervisé sous traitement (I, A) : les populations et les échelles de preuve diffèrent.</p>
