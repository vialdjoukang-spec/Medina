<template data-pop="i33-esc-2026-comparaison" data-title="Endocardite infectieuse : ce que touchent les textes ESC 2026">
<p>Aucune recommandation ESC de 2026 ne remplace l’ESC 2023 sur l’endocardite : diagnostic, antibiothérapie et indications opératoires restent inchangés. Trois textes de 2026 touchent des situations du cours : l’infarctus par embolie coronaire change de nom, le patient hémodialysé reçoit des mesures propres contre l’infection des dispositifs, et la réadaptation reste conditionnée au contrôle de l’infection.</p>
<table class="t"><tr><th>Point</th><th>Référentiel antérieur</th><th>2026</th></tr>
<tr><td>Infarctus par embolie coronaire</td><td>Quatrième définition universelle : infarctus de type 2, car l’embolie est une pathologie coronaire aiguë autre que l’athérothrombose.</td><td>Cinquième définition : infarctus primaire, comme toute pathologie coronaire aiguë. L’infarctus secondaire est réservé au déséquilibre entre apport et besoin en oxygène causé par une autre maladie aiguë.</td></tr>
<tr><td>Hémodialysé porteur d’un dispositif</td><td>ESC 2023 : enveloppe antibiotique à envisager lors d’une réimplantation chez un patient sélectionné à haut risque (IIb, B).</td><td>Maladie rénale chronique : enveloppe antibiotique à envisager lors de toute implantation chez l’hémodialysé ou le transplanté rénal, en plus de l’antibioprophylaxie (IIb, C). Défibrillateur sous-cutané à envisager si aucune stimulation n’est nécessaire (IIb, C). Information de l’hémodialysé sur le risque accru d’endocardite après une prothèse valvulaire (texte, sans classe).</td></tr>
<tr><td>Réadaptation</td><td>ESC 2023 : réadaptation avec entraînement à envisager chez le patient stable, après évaluation individuelle (IIa, C).</td><td>Réadaptation : aucune recommandation propre à l’endocardite ; la maladie systémique aiguë contre-indique l’épreuve d’effort et l’entraînement, l’embolie récente contre-indique l’entraînement.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>La nouvelle définition est une classification, non une indication : un embole septique obstrue l’artère comme un thrombus, la cause est coronaire et aiguë, d’où le classement en infarctus primaire. Elle encourage l’imagerie coronaire pour identifier le mécanisme ; le traitement reste celui du cours. Chez l’hémodialysé, l’accès vasculaire expose à des bactériémies répétées, et une sonde endoveineuse offre au germe une surface où se fixer ; le défibrillateur sous-cutané n’a pas de sonde dans le sang. Aucun essai n’a testé ces deux mesures chez le seul hémodialysé : l’enveloppe a réduit les infections dans un essai de population générale sans effet différent selon la fonction rénale, d’où une classe IIb de niveau C. La réadaptation attend le contrôle de l’infection ; une fois le patient stable, elle suit l’ESC 2023.</p>
