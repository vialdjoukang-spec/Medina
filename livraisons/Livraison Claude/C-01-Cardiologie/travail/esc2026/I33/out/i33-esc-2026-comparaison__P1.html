<p>Aucune recommandation ESC de 2026 ne remplace l’ESC 2023 sur l’endocardite : diagnostic, antibiothérapie et indications opératoires restent inchangés. Trois textes publiés le 28 août 2026 touchent cependant des situations du cours : la cinquième définition universelle de l’infarctus, les recommandations sur la maladie rénale chronique et celles sur la réadaptation cardiaque.</p>
<table class="t"><tr><th>Point</th><th>Référentiel antérieur</th><th>2026</th></tr>
<tr><td>Infarctus par embolie coronaire</td><td>Quatrième définition universelle : infarctus de type 2, car l’embolie est une pathologie coronaire aiguë autre que l’athérothrombose.</td><td>Cinquième définition : infarctus primaire, comme toute pathologie coronaire aiguë. La CIM-11 attribue à l’embolie coronaire une extension de code propre, à la suite du code de l’infarctus.</td></tr>
<tr><td>Patient hémodialysé porteur d’un dispositif</td><td>ESC 2023 : enveloppe antibiotique à envisager lors d’une réimplantation chez un patient sélectionné à haut risque (IIb, B).</td><td>Maladie rénale chronique : enveloppe antibiotique à envisager lors de toute implantation chez l’hémodialysé ou le transplanté rénal (IIb, C). Défibrillateur sous-cutané à envisager si aucune stimulation n’est nécessaire (IIb, C).</td></tr>
<tr><td>Prothèse valvulaire chez l’hémodialysé</td><td>ESC 2023 : hémodialyse citée parmi les facteurs de risque non cardiaques d’EI.</td><td>Le patient hémodialysé doit être informé du risque accru d’EI après une prothèse valvulaire (texte, sans classe).</td></tr>
<tr><td>Réadaptation</td><td>ESC 2023 : réadaptation avec entraînement à envisager chez le patient stable, après évaluation individuelle (IIa, C).</td><td>Réadaptation : aucune recommandation propre à l’EI. Après chirurgie valvulaire, réadaptation à envisager pour réduire les réhospitalisations (IIb, B2) ; entraînement à envisager pour la capacité physique (IIa, B2).</td></tr></table>
<div class="lab">Pourquoi ces changements</div><p>La cinquième définition classe l’infarctus selon son mécanisme. Un embole septique obstrue l’artère comme un thrombus : la cause est coronaire et aiguë, d’où le classement en infarctus primaire. L’infarctus secondaire, ancien type 2, est désormais réservé au déséquilibre entre apport et besoin en oxygène causé par une autre maladie aiguë. Chez l’hémodialysé, l’accès vasculaire répète les bactériémies. Une sonde endoveineuse offre alors au germe une surface où se fixer ; le défibrillateur sous-cutané n’a pas de sonde dans le sang. L’enveloppe libère dans la loge de la minocycline et de la rifampicine pendant au moins sept jours après l’implantation.</p>
<div class="lab">Ce qui change la décision</div><p>La nouvelle définition est une classification, non une indication thérapeutique. Elle incite à identifier l’embole par l’imagerie coronaire, mais le traitement reste celui exposé dans le cours. La réadaptation est reportée tant que l’infection n’est pas contrôlée : la maladie systémique aiguë et l’embolie récente contre-indiquent l’entraînement. Une fois le patient stable, la réadaptation suit l’ESC 2023 ; les recommandations 2026 la soutiennent aussi chez l’opéré valvulaire.</p>
