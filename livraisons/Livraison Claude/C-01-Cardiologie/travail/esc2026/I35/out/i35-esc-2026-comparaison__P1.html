<p>L’ESC/EACTS 2025 reste la référence pour poser l’indication et choisir l’intervention aortique. Trois recommandations ESC publiées le 28 août 2026 la complètent sans la contredire : insuffisance cardiaque, maladie rénale chronique et réadaptation cardiaque. Elles modifient le nom des phénotypes de FEVG, le suivi du patient rénal et la prise en charge après l’intervention.</p>
<table class="t"><tr><th>Point</th><th>Référentiel antérieur</th><th>ESC 2026</th></tr>
<tr><td>RA sévère et insuffisance cardiaque</td><td>ESC 2021 sur l’insuffisance cardiaque : intervention recommandée dans le RA sévère à haut gradient (I, B).</td><td>Intervention recommandée dans le RA sévère avec insuffisance cardiaque (I, B1) : haut gradient quelle que soit la FEVG, ou bas débit et bas gradient avec ICFEr. Bas débit et bas gradient avec FEVG ≥ 50 % : intervention à envisager, selon les critères de l’ESC/EACTS 2025.</td></tr>
<tr><td>TAVI ou chirurgie en cas de maladie rénale chronique</td><td>ESC/EACTS 2025, pour tous les patients : TAVI recommandé dès 70 ans sur valve tricuspide si l’anatomie convient (I, A).</td><td>Maladie rénale chronique : TAVI à envisager plutôt que la chirurgie dès 70 ans, sur valve tricuspide d’anatomie favorable (IIa, C).</td></tr>
<tr><td>Suivi du patient rénal</td><td>ESC/EACTS 2025 : RA sévère asymptomatique revu au moins tous les six mois.</td><td>ETT devant toute suspicion de valvulopathie (I, C). RA modéré à sévère avec DFG &lt; 45 mL/min/1,73 m² : examen clinique et ETT tous les 6 à 9 mois (IIa, C). Réévaluation après le début de la dialyse (IIa, C).</td></tr>
<tr><td>Après chirurgie ou TAVI</td><td>ESC/EACTS 2025 : réadaptation fréquente et associée à une meilleure autonomie, sans recommandation propre.</td><td>Réadaptation cardiaque recommandée (I, B1) pour la capacité physique, la dépression et la qualité de vie.</td></tr></table>
<div class="lab">Pourquoi ces différences</div><p>La classification 2026 nomme ICFEr toute FEVG inférieure à 50 %. Ce seuil coïncide avec celui du RA classique à bas débit, où le ventricule ne développe plus assez de force pour ouvrir largement la valve. Il s’agit d’un changement de nom : la sévérité doit toujours être confirmée par la dobutamine ou le score calcique. Chez le patient rénal, les troubles phosphocalciques accélèrent la calcification : la surface diminue de 0,1 à 0,2 cm² par an quand le DFG est inférieur à 15 mL/min/1,73 m², contre 0,05 à 0,1 cm² dans la population générale. La fatigue et la dyspnée de l’insuffisance rénale masquent en outre les symptômes, ce qui justifie un suivi plus serré. La classe IIa, plus faible que la classe I générale, traduit l’absence d’essai dédié : avec un DFG de 15 à 60, le TAVI et la chirurgie donnaient des résultats semblables à trois à cinq ans, avec un geste moins invasif pour le TAVI. Après l’intervention, l’obstacle a disparu, mais le déconditionnement accumulé avant le geste limite souvent encore l’effort ; l’entraînement encadré améliore la distance de marche et l’autonomie.</p>
<div class="lab">Ce qui change la décision</div><p>Une nouvelle classification ne crée pas d’indication : les seuils d’intervention restent ceux de l’ESC/EACTS 2025. Chez le patient rénal de 70 ans ou plus, le TAVI est désormais soutenu par une recommandation propre. Plus jeune, il expose à une dégénérescence plus rapide des bioprothèses ; le choix se discute avec le néphrologue, sans essai randomisé pour trancher. Après tout remplacement aortique, une réadaptation est prescrite. Le RA sévère symptomatique non opéré reste une contre-indication à l’épreuve d’effort et à l’entraînement.</p>
<div class="lab">Niveaux de preuve</div><p>L’ESC utilise en 2026 une nouvelle échelle. B1 désigne au moins un essai randomisé de puissance suffisante et sans biais majeur ; B2, des études non randomisées bien contrôlées. Un « B » antérieur et un « B1 » ne se comparent donc pas terme à terme.</p>
