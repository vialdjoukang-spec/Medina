<template data-pop="i35-esc-2026-comparaison" data-title="Valvulopathies aortiques : ce qu’ajoutent les textes ESC 2026">
<p>L’ESC/EACTS 2025 reste la référence pour poser l’indication et choisir l’intervention aortique. Trois recommandations ESC de 2026 la complètent sans la contredire : l’insuffisance cardiaque reformule l’indication, la maladie rénale chronique ajoute un suivi et un choix propres, la réadaptation devient recommandée après l’intervention.</p>
<table class="t"><tr><th>Point</th><th>Référentiel antérieur</th><th>ESC 2026</th></tr>
<tr><td>RA sévère et insuffisance cardiaque</td><td>ESC 2021 sur l’insuffisance cardiaque : intervention recommandée dans le RA sévère à haut gradient (I, B).</td><td>Intervention recommandée (I, B1) : haut gradient quelle que soit la FEVG, ou bas débit et bas gradient avec ICFEr. Bas débit et bas gradient avec FEVG ≥ 50 % : à envisager, selon l’ESC/EACTS 2025.</td></tr>
<tr><td>TAVI ou chirurgie si maladie rénale chronique</td><td>ESC/EACTS 2025, tous patients : TAVI recommandé dès 70 ans sur valve tricuspide d’anatomie favorable (I, A).</td><td>TAVI à envisager plutôt que la chirurgie dès 70 ans, sur valve tricuspide d’anatomie favorable (IIa, C).</td></tr>
<tr><td>Suivi du patient rénal</td><td>ESC/EACTS 2025 : RA sévère asymptomatique revu au moins tous les six mois.</td><td>ETT devant toute suspicion de valvulopathie (I, C). RA modéré à sévère avec DFG &lt; 45 mL/min/1,73 m² : examen clinique et ETT tous les 6 à 9 mois (IIa, C). Réévaluation après le début de la dialyse (IIa, C).</td></tr>
<tr><td>Après chirurgie ou TAVI</td><td>ESC/EACTS 2025 : réadaptation décrite, sans recommandation classée.</td><td>Réadaptation recommandée (I, B1) pour la capacité physique, la dépression et la qualité de vie.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>La classification 2026 nomme ICFEr toute FEVG inférieure à 50 %, seuil qui coïncide avec celui du RA classique à bas débit : c’est un changement de nom, non une nouvelle indication, et la sévérité doit toujours être confirmée par la dobutamine ou le score calcique. Chez le patient rénal, la surface valvulaire diminue de 0,1 à 0,2 cm² par an quand le DFG est inférieur à 15 mL/min/1,73 m², contre 0,05 à 0,1 cm² dans la population générale ; la fatigue et la dyspnée de l’insuffisance rénale masquent en outre les symptômes, d’où un suivi plus serré. Avec un DFG de 15 à 60, TAVI et chirurgie donnaient des résultats semblables à trois à cinq ans ; le TAVI, moins invasif, est donc préféré dès 70 ans, mais sans essai dédié, d’où la classe IIa. Chez le patient plus jeune atteint d’une maladie rénale sévère, la bioprothèse dégénère plus vite ; aucun essai ne guide le choix, qui se discute avec le néphrologue. Après l’intervention, le déconditionnement accumulé limite encore l’effort : l’entraînement encadré améliore la distance de marche et l’autonomie. Le RA sévère symptomatique non opéré reste une contre-indication à l’épreuve d’effort et à l’entraînement.</p>
