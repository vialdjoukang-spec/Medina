<p>L’ESC n’a publié en 2026 aucune recommandation propre au péricarde : l’ESC 2025 sur les myocardites et péricardites reste le référentiel. Trois textes de 2026 la croisent sans la contredire : l’insuffisance cardiaque pour la constriction, la réadaptation cardiaque pour l’effort et la cinquième définition universelle de l’infarctus pour la troponine.</p>
<table class="t"><tr><th>Point</th><th>Avant 2026</th><th>Textes 2026</th></tr>
<tr><td>Cathétérisme dans la constriction</td><td>ESC 2025 : évaluation hémodynamique à envisager (IIa, C) quand l’imagerie multimodale ne tranche pas. ESC 2021 sur l’insuffisance cardiaque : cathétérisme droit à envisager (IIa, C) si l’insuffisance cardiaque paraît due à une constriction, une cardiomyopathie restrictive, une cardiopathie congénitale ou un haut débit.</td><td>Insuffisance cardiaque : cathétérisme droit à envisager (IIa, C) si l’insuffisance cardiaque paraît due à une constriction ou à une cardiopathie congénitale.</td></tr>
<tr><td>Peptides natriurétiques</td><td>ESC 2021 sur l’insuffisance cardiaque : tableau des seules causes d’élévation ; la concentration basse de la constriction reposait sur des séries cliniques (Leya et al.).</td><td>Insuffisance cardiaque : la constriction figure parmi les causes de concentration abaissée, avec l’obésité, l’ascendance africaine et les traitements neurohormonaux.</td></tr>
<tr><td>Effort</td><td>ESC 2025 : restriction jusqu’à la rémission, au moins un mois (I, C).</td><td>Réadaptation : la péricardite et la myocardite aiguës contre-indiquent l’épreuve d’effort et l’entraînement.</td></tr>
<tr><td>Troponine</td><td>Valeur au-dessus du 99e percentile de la méthode.</td><td>Cinquième définition : lésion myocardique aiguë si la troponine monte ou baisse avec au moins une valeur au-dessus du 99e percentile propre au sexe ; la myocardite y figure comme mécanisme inflammatoire, distinct de l’infarctus.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Le diagnostic et le traitement des péricardites ne changent pas. Le cathétérisme reste réservé à la constriction que l’imagerie ne tranche pas ; dans l’insuffisance cardiaque, il mesure les pressions de remplissage et la pression pulmonaire, que l’échocardiographie n’estime qu’indirectement. Un peptide natriurétique bas ne rassure donc pas devant des signes de congestion : le péricarde rigide limite probablement l’étirement de la paroi ventriculaire, qui commande la sécrétion. L’épreuve d’effort et l’entraînement attendent la rémission, car l’effort accélère le cœur et favorise les arythmies quand le myocarde est atteint. Pour la troponine, des seuils propres au sexe limitent le sous-diagnostic de l’atteinte myocardique chez la femme ; un seuil commun aux deux sexes peut la méconnaître.</p>
