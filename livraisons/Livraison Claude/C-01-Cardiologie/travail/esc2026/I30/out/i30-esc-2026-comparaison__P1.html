<template data-pop="i30-esc-2026-comparaison" data-title="Péricarde : ce que changent les textes ESC 2026">
<p>Aucune recommandation ESC de 2026 ne porte sur le péricarde : l’ESC 2025 sur les myocardites et péricardites reste le référentiel du diagnostic et du traitement. Un seul point modifie l’interprétation d’un examen : la cinquième définition universelle de l’infarctus exige un seuil de troponine propre au sexe pour affirmer une lésion myocardique. Les autres textes de 2026 confirment le cours.</p>
<table class="t"><tr><th>Point</th><th>Avant 2026</th><th>Textes 2026</th></tr>
<tr><td>Troponine</td><td>Définitions universelles antérieures : lésion myocardique si une valeur dépasse le 99e percentile ; critères propres au sexe déjà encouragés.</td><td>Cinquième définition : lésion myocardique aiguë si la troponine I ou T monte ou baisse avec au moins une valeur au-dessus du 99e percentile propre au sexe. Pour les dosages ultrasensibles, le 99e percentile féminin est inférieur au seuil unique, le masculin supérieur. Le texte ne chiffre pas le seuil de chaque méthode.</td></tr>
<tr><td>Cathétérisme dans la constriction</td><td>ESC 2025 : à envisager si l’imagerie multimodale ne tranche pas (IIa, C).</td><td>Insuffisance cardiaque : cathétérisme droit à envisager si l’insuffisance cardiaque paraît due à une constriction (IIa, C) ; le cathétérisme droit et gauche reste nécessaire pour la distinguer d’une cardiomyopathie restrictive.</td></tr>
<tr><td>Peptides natriurétiques</td><td>ESC 2025 : la constriction se présente typiquement comme une insuffisance cardiaque droite isolée avec des peptides natriurétiques normaux ou presque normaux.</td><td>Insuffisance cardiaque : la constriction figure parmi les causes de concentration abaissée.</td></tr></table>
<div class="lab">Ce qui change la décision</div><p>Le résultat de la troponine se lit sur le 99e percentile validé pour la méthode employée et pour le sexe du patient. Chez une femme, une valeur inférieure à un seuil global commun aux deux sexes peut dépasser ce seuil féminin. Une atteinte myocardique n’est documentée que si la troponine monte ou baisse avec au moins une valeur au-delà du seuil propre à la méthode et au sexe ; une simple variation ne suffit pas. La péricardite devient alors une myopéricardite si la fonction ventriculaire gauche, évaluée par échocardiographie ou IRM, ne montre pas d’altération nouvelle ; une altération nouvelle oriente vers une périmyocardite, prise en charge comme une myocardite (ESC 2025). L’IRM et une restriction prolongée de l’effort suivent. Le cathétérisme garde sa place de recours quand l’imagerie ne tranche pas. Un peptide natriurétique bas ne rassure pas devant des signes de congestion. La réadaptation cardiaque 2026 range aussi la péricardite aiguë parmi les contre-indications à l’épreuve d’effort et à l’entraînement, comme l’ESC 2025, qui restreint l’effort jusqu’à la rémission, au moins un mois (I, C).</p>
