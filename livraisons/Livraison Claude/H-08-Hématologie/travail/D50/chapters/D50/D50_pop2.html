<template data-pop="d50-d-sels" data-title="Sels ferreux oraux (Tardyferon®, ferro sanol®, Ferrum Hausmann®)"><p class="lab">Mécanisme</p><p>Le fer ferreux hydrosoluble est absorbé par l’entérocyte de l’intestin grêle, puis exporté vers la transferrine. Les trois préparations suisses sont à libération prolongée ou modifiée.</p><p class="lab">Preuve</p><p>Comparé au placebo, le fer oral améliore l’Hb et réduit probablement les transfusions ; aux doses usuelles, aucun sel n’est supérieur à un autre. Environ 73 % des patients obtiennent une hausse de plus de 10 g/L en deux semaines.</p><p class="lab">Posologie autorisée</p><p>Tardyferon® : 80 mg, un comprimé par jour, deux en cas d’anémie grave ; prise avant ou pendant le repas selon la tolérance. ferro sanol® : 100 mg, une gélule par jour, deux en début de traitement d’une carence importante, à jeun ou entre les repas ; au plus 5 mg/kg par jour. Ferrum Hausmann® : 100 mg, une capsule par jour, 10 à 15 minutes avant le repas ; traitement poursuivi un à trois mois après correction de l’anémie, au plus six mois sans pertes chroniques.</p><p class="lab">Contre-indications</p><p>Anémie non ferriprive, surcharge en fer, troubles d’utilisation du fer (thalassémie, anémie sidéroblastique, saturnisme, porphyrie cutanée tardive) ; sténose œsophagienne pour ferro sanol® ; insuffisance hépatique ou rénale grave pour Ferrum Hausmann®.</p><p class="lab">Effets indésirables</p><p>Douleurs épigastriques, nausées, constipation, diarrhée, selles noires, coloration des dents ou de la langue.</p><div class="key"><b>Place.</b> Premier choix de la carence martiale de l’adulte ; une prise quotidienne unique de 50 à 100 mg, ou un jour sur deux, est le meilleur compromis entre efficacité et tolérance.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">Tardyferon®, juillet 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">ferro sanol®, avril 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680351020433" target="_blank" rel="noopener">Ferrum Hausmann®, mai 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-d-polymaltose" data-title="Fer ferrique polymaltose (Maltofer®)"><p class="lab">Mécanisme</p><p>Le noyau d’hydroxyde ferrique, de structure proche de la ferritine, est entouré de polymaltose ; le complexe d’environ 50 kDa diffuse 40 fois moins que les sels ferreux et le fer est absorbé par un mécanisme actif. Les études in vitro n’ont pas montré d’interaction avec les phytates, les tanins ou l’acide oxalique.</p><p class="lab">Posologie autorisée</p><p>Adulte et adolescent dès 12 ans : 100 à 300 mg par jour en cas d’anémie, 50 à 100 mg en cas de carence sans anémie, pendant ou juste après le repas. L’anémie se corrige en trois à cinq mois en moyenne ; le traitement se poursuit ensuite à la dose de la carence sans anémie.</p><p class="lab">Contre-indications et effets indésirables</p><p>Surcharge ou troubles d’utilisation du fer. Nausées, ballonnements, douleurs abdominales, diarrhée, constipation et coloration des selles sont fréquents. Le test de sang occulte sélectif de l’hémoglobine n’est pas faussé.</p><p class="lab">Grossesse</p><p>Les données disponibles n’ont pas montré d’effet indésirable sur la grossesse ou le fœtus ; l’emploi se fait sur avis médical.</p><div class="key"><b>Place.</b> Alternative orale chez le patient qui ne peut prendre son fer à jeun ; gynécologie suisse l’accepte au même titre que les sels ferreux pendant la grossesse.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680301240218" target="_blank" rel="noopener">Maltofer®, août 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-d-maltol" data-title="Maltol ferrique (Feraccru®)"><p class="lab">Mécanisme</p><p>Le fer ferrique stable, complexé au maltol, se dissocie dans le tube digestif ; le complexe lui-même ne passe pas dans la circulation.</p><p class="lab">Preuve</p><p>Chez des patients atteints de MICI inactive, intolérants ou réfractaires aux sels ferreux et dont l’Hb dépassait 95 g/L, douze semaines de traitement ont normalisé l’Hb chez 63 à 66 % d’entre eux, avec une tolérance digestive proche du placebo. Dans l’insuffisance rénale chronique, l’Hb a augmenté de 0,50 g/dL contre −0,02 g/dL sous placebo en seize semaines.</p><p class="lab">Posologie autorisée</p><p>30 mg deux fois par jour, à jeun, pendant au moins douze semaines ; aucune adaptation jusqu’à un débit de filtration de 15 mL/min/1,73 m².</p><p class="lab">Précautions</p><p>Contre-indiqué dans l’hémochromatose ; à éviter pendant la grossesse et l’allaitement par précaution, faute de données. Espacer de deux heures les médicaments chélatables.</p><div class="key"><b>Place.</b> Option orale en cas d’intolérance aux sels ferreux et d’anémie légère à modérée ; la recharge en fer est lente.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">Feraccru®, août 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-d-carboxymaltose" data-title="Carboxymaltose ferrique (Ferinject®)"><p class="lab">Mécanisme</p><p>Complexe d’hydroxyde ferrique et de glucide, capté par les macrophages du foie, de la moelle et de la rate ; le fer rejoint la ferritine puis la transferrine. De 91 à 99 % du fer marqué est utilisé par les hématies en 24 jours chez les patients carencés.</p><p class="lab">Indication suisse</p><p>Carence martiale de l’adulte lorsque le fer oral est insuffisamment efficace, inefficace ou impossible : intolérance, MICI, mauvaise adhésion présumée ; diagnostic biologique obligatoire.</p><p class="lab">Preuve</p><p>Hémorragie utérine grave : hausse de l’Hb de plus de 20 g/L chez 82 % des patientes contre 61,8 % sous fer oral. MICI : non inférieur au sulfate ferreux à douze semaines, plus rapide à quatre semaines. Grossesse aux deuxième et troisième trimestres : Hb plus élevée de 4,3 g/L à six semaines qu’avec le fer oral.</p><p class="lab">Posologie</p><p>Au plus 20 mg/kg et 1000 mg par perfusion, 15 mg/kg en injection, 1000 mg par semaine ; 15 minutes pour 500 à 1000 mg. Hémodialyse : au plus 200 mg par jour.</p><p class="lab">Contre-indications et risques</p><p>Premier trimestre, surcharge, anémie non ferriprive, hypersensibilité grave à un fer parentéral. Hypophosphatémie fréquente, avec nadir vers deux semaines et retour à la normale vers douze semaines dans la plupart des cas ; ostéomalacie possible.</p><div class="key"><b>Place.</b> Fer intraveineux le mieux étudié pendant la grossesse et le post-partum ; à éviter en perfusions répétées chez le patient à risque d’hypophosphatémie sans contrôle du phosphate.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-d-derisomaltose" data-title="Dérisomaltose ferrique (MonoFer®)"><p class="lab">Mécanisme</p><p>Fer ferrique lié à un glucide linéaire, non ramifié ; la dose totale peut être perfusée en une fois.</p><p class="lab">Indication suisse</p><p>Carence martiale lorsque le fer oral est inefficace ou inutilisable, ou lorsqu’une recharge rapide est cliniquement nécessaire.</p><p class="lab">Preuve</p><p>Dans deux essais randomisés chez des patients intolérants ou réfractaires au fer oral, l’hypophosphatémie est survenue chez 7,9 et 8,1 % des patients après 1000 mg de dérisomaltose, contre 75,0 et 73,7 % après deux perfusions de 750 mg de carboxymaltose.</p><p class="lab">Posologie</p><p>Au plus 20 mg/kg par perfusion ; jusqu’à 1000 mg en plus de 15 minutes, au-delà en 30 minutes ou plus ; bolus de 500 mg au plus, jusqu’à trois fois par semaine. Après une hémorragie aiguë, 200 mg remplacent le fer d’une unité de sang.</p><p class="lab">Contre-indications</p><p>Premier trimestre, surcharge en fer, anémie non ferriprive, maladie hépatique décompensée, hypersensibilité grave à un fer parentéral.</p><div class="key"><b>Place.</b> Choix logique lorsque l’hypophosphatémie est à craindre ; certaines études rapportent plus de réactions d’hypersensibilité légères qu’avec le carboxymaltose, d’autres non.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">MonoFer®, juin 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7042864/" target="_blank" rel="noopener">Wolf et al., JAMA 2020</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-d-saccharose" data-title="Saccharose ferrique (Venofer®)"><p class="lab">Indication suisse</p><p>Carence martiale lorsque le fer oral est insuffisamment efficace ou impossible : intolérance, MICI, mauvaise adhésion présumée.</p><p class="lab">Posologie</p><p>Dose totale selon Ganzoni ; 100 à 200 mg une à trois fois par semaine. Injection lente de 200 mg au plus en au moins 10 minutes ; perfusion de 500 mg au plus en au moins 3 heures et demie, une fois par semaine, au-delà de 70 kg.</p><p class="lab">Réponse attendue</p><p>Environ 1 g/L par jour et 10 à 20 g/L après une à deux semaines ; sinon, le diagnostic et un saignement persistant sont revus.</p><p class="lab">Risques</p><p>Hypersensibilité ; extravasation douloureuse, pouvant causer une nécrose et une coloration brune prolongée ; hypophosphatémie rare, environ 1 %. Contre-indications : premier trimestre, surcharge, anémie non ferriprive.</p><div class="key"><b>Place.</b> Utilisable en dialyse et lorsque de petites doses suffisent ; les perfusions multiples le rendent moins pratique que les molécules à dose totale.</div><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680153980782" target="_blank" rel="noopener">Venofer®, mai 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-interactions" data-title="Interactions du fer oral"><table class="t"><tr><th>Médicament</th><th>Effet</th><th>Conduite</th></tr><tr><td>Lévothyroxine</td><td>Complexes insolubles ; risque d’hypothyroïdie</td><td>Au moins 2 heures d’écart</td></tr><tr><td>Tétracyclines</td><td>Absorption réciproque réduite</td><td>2 à 3 heures d’écart ; éviter la doxycycline avec ferro sanol®</td></tr><tr><td>Quinolones</td><td>Absorption de l’antibiotique réduite</td><td>4 heures avant ou 4 à 6 heures après le fer</td></tr><tr><td>Bisphosphonates, pénicillamine, mycophénolate, entacapone</td><td>Absorption réduite</td><td>Au moins 2 heures d’écart</td></tr><tr><td>Antiacides, calcium, zinc, colestyramine</td><td>Absorption du fer réduite</td><td>Au moins 2 heures ; 4 à 6 heures après la colestyramine</td></tr><tr><td>Lévodopa, carbidopa, méthyldopa</td><td>Biodisponibilité réduite</td><td>Au moins 3 heures d’écart</td></tr><tr><td>Bictégravir et inhibiteurs de l’intégrase</td><td>Absorption réduite des deux tiers</td><td>Antirétroviral 2 heures avant, ou avec un repas</td></tr><tr><td>Fer intraveineux</td><td>Hypotension, collapsus ; absorption orale réduite</td><td>Ne pas associer</td></tr></table><p>Le polymaltose fait exception : ses études n’ont montré aucune interaction significative avec la tétracycline ou l’hydroxyde d’aluminium. Les inhibiteurs de la pompe à protons réduisent l’absorption par hypochlorhydrie.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680374480016" target="_blank" rel="noopener">Tardyferon®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680365270213" target="_blank" rel="noopener">ferro sanol®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680665560021" target="_blank" rel="noopener">Feraccru®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680301240218" target="_blank" rel="noopener">Maltofer®</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-mr" data-title="Contentieux : les formes à libération modifiée"><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>BSG 2021</td><td>Les formes à libération modifiée libèrent le fer au-delà des zones d’absorption maximale ; elles n’augmentent pas l’absorption, ne réduisent pas les effets indésirables et ne sont pas recommandées</td></tr><tr><td>Informations professionnelles suisses</td><td>Tardyferon®, ferro sanol® et Ferrum Hausmann®, tous à libération prolongée ou modifiée, sont autorisés dans l’anémie ferriprive et la carence latente</td></tr></table><p class="lab">Arbitrage</p><p>La BSG s’appuie sur des données d’absorption et de tolérance comparatives ; les informations suisses attestent l’autorisation, non une supériorité. En pratique suisse, ces préparations restent utilisables à raison d’une prise par jour ; la réponse se contrôle à deux à quatre semaines, et un échec fait vérifier l’adhésion avant de changer de voie.</p></template>
<template data-pop="pareto-d50-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="d50-0,d50-1,d50-2,d50-3,d50-4,d50-5,d50-6"></p><ul><li>Anémie selon l’OMS 2024 : Hb inférieure à 130 g/L chez l’homme, 120 g/L chez la femme, 110 g/L pendant la grossesse (105 au deuxième trimestre).</li><li>Carence martiale : ferritine inférieure à 30 µg/L, ou 30 à 50 µg/L avec TSAT inférieure à 20 %, sans inflammation.</li><li>La carence précède l’anémie : réserves, puis érythropoïèse, puis Hb.</li><li>L’organisme n’élimine pas le fer : toute carence traduit une perte, une malabsorption ou des besoins accrus.</li><li>L’hepcidine ferme la ferroportine ; elle baisse dans la carence et monte dans l’inflammation.</li><li>Chez l’homme et la femme ménopausée, un tiers des explorations trouvent une lésion, dont 8 à 10 % de cancers.</li><li>Fatigue, jambes sans repos, chute de cheveux et signes des phanères peuvent précéder l’anémie.</li></ul></template>
<template data-pop="pareto-d50-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="d50-7,d50-8"></p><ul><li>Ferritine et CRP ensemble ; sous inflammation, ferritine inférieure à 70 µg/L ou TSAT inférieure à 20 % ; au-delà de 150 µg/L, carence absolue improbable.</li><li>Hausse de l’Hb d’au moins 10 g/L en deux semaines de fer : carence absolue.</li><li>Microcytose avec bilan martial normal : électrophorèse de l’hémoglobine.</li><li>Chez tous : analyse d’urine et sérologie cœliaque ; homme et femme ménopausée : gastroscopie et coloscopie.</li><li>Grêle par capsule si endoscopies négatives et anémie persistante ou récidivante.</li><li>Gravité : instabilité, dyspnée de repos, saignement actif, grossesse avec Hb inférieure à 90 g/L.</li></ul></template>
<template data-pop="pareto-d50-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="d50-9,d50-10,d50-11"></p><ul><li>Traiter dès la preuve de la carence, en parallèle de l’exploration.</li><li>Sel ferreux, 50 à 100 mg de fer une fois par jour ou un jour sur deux, à jeun ; pas de fractionnement.</li><li>Contrôle à deux à quatre semaines ; poursuite trois mois après normalisation de l’Hb.</li><li>Fer intraveineux sur indication : intolérance, échec, malabsorption, pertes persistantes, urgence, maladie chronique.</li><li>Surveillance de 30 minutes ; Hb à quatre semaines, ferritine à 8 à 12 semaines après perfusion.</li><li>Transfusion pour l’instabilité seulement, toujours suivie de fer.</li><li>Carence sans anémie symptomatique : fer oral d’abord ; pas de fer au-delà de 30 µg/L chez le sujet sain.</li></ul></template>
<template data-pop="pareto-d50-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="d50-12,d50-13,d50-14"></p><ul><li>Hémogramme tous les trois mois pendant un an, puis tous les six mois pendant deux à trois ans.</li><li>Récidive : nouvelles endoscopies si anciennes, capsule, imagerie urinaire ; fer au long cours si cause irréductible.</li><li>Grossesse : ferritine au début et à 24–28 semaines ; traitement dès 30 µg/L ; fer intraveineux possible dès le deuxième trimestre.</li><li>MICI, insuffisance cardiaque et rénale : seuils de ferritine plus élevés, voie intraveineuse privilégiée.</li><li>Enfant : seuils de 15 et 20 µg/L ; 3 mg/kg par jour, au plus 50 mg.</li></ul></template>
<template data-pop="pareto-d50-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="d50-e-1,d50-e-2,d50-e-3,d50-e-4"></p><ul><li>Hémogramme, ferritine et CRP suffisent le plus souvent ; le fer sérique isolé est inutile.</li><li>TCMH plus fiable que le VGM ; seuils normaux 28 pg et 80 fl.</li><li>TSAT basse et ferritine basse : carence absolue ; TSAT basse et ferritine normale : inflammation ou cause génétique.</li><li>Contenu en hémoglobine des réticulocytes : marqueur précoce, réactif en deux à trois jours.</li><li>Endoscopies haute et basse dans la même séance ; capsule en première ligne pour le grêle.</li></ul></template>
<template data-pop="pareto-d50-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d50-p-1,d50-p-2,d50-p-3,d50-p-4,d50-p-5"></p><ul><li>Oral d’abord : sels ferreux à jeun, polymaltose possible au repas, maltol ferrique en cas d’intolérance.</li><li>Intraveineux : carboxymaltose et dérisomaltose jusqu’à 1000 mg par perfusion, saccharose 200 mg par injection.</li><li>Fer oral à distance de la lévothyroxine, des tétracyclines, des quinolones, des bisphosphonates et du calcium.</li><li>Fer intraveineux : surveillance de 30 minutes, pas au premier trimestre ni en cas de bactériémie.</li><li>Hypophosphatémie : 47 % après carboxymaltose, 4 % après dérisomaltose.</li><li>Jamais de fer sans carence prouvée.</li></ul></template>
