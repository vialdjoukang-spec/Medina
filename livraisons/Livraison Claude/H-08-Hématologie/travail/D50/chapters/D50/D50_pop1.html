<template data-pop="d50-anemie-def" data-title="Seuils d’anémie de l’OMS 2024"><p class="lab">Définition</p><p>L’OMS définit l’anémie par une Hb inférieure au 5<sup>e</sup> percentile de populations saines : 95 % des sujets sains ont une valeur plus élevée. Seuils : homme de 15 à 65 ans, 130 g/L ; femme non enceinte, 120 g/L ; grossesse, 110 g/L au premier et au troisième trimestre, 105 g/L au deuxième, où l’Hb baisse transitoirement d’environ 5 g/L.</p><table class="t"><tr><th>Population</th><th>Légère</th><th>Modérée</th><th>Sévère</th></tr><tr><td>Homme</td><td>110–129</td><td>80–109</td><td>&lt; 80</td></tr><tr><td>Femme non enceinte</td><td>110–119</td><td>80–109</td><td>&lt; 80</td></tr><tr><td>Grossesse, 2<sup>e</sup> trimestre</td><td>95–104</td><td>70–94</td><td>&lt; 70</td></tr></table><p class="lab">Corrections</p><p>L’altitude de résidence élève l’Hb : le seuil augmente de 4 g/L entre 500 et 999 m, de 8 g/L entre 1000 et 1499 m, de 11 g/L entre 1500 et 1999 m. Une correction pour le tabagisme existe aussi.</p><div class="key"><b>Limite.</b> Le seuil masculin de 130 g/L a été conservé malgré des données suggérant 135 g/L ; la gravité se juge sur la clinique autant que sur le chiffre.</div><p class="src">Référence : <a href="https://iris.who.int/handle/10665/376196" target="_blank" rel="noopener">OMS 2024, tableaux 2 à 4</a>.</p></template>
<template data-pop="d50-ferritine" data-title="Ferritine sérique"><p class="lab">Ce qu’elle mesure</p><p>La ferritine circulante est proportionnelle aux réserves de fer chez le sujet sain : c’est le meilleur marqueur isolé de la carence.</p><p class="lab">Seuils</p><p>Moins de 15 µg/L : réserves vides, spécificité de 99 % (BSG) et seuil de l’OMS chez l’adulte sain. Moins de 30 µg/L : réserves basses, seuil diagnostique suisse ; la probabilité de réserves vides atteint alors 90 % chez la femme en âge de procréer. En cas d’inflammation : moins de 70 µg/L (OMS), moins de 100 µg/L dans les MICI. Au-delà de 150 µg/L, une carence absolue est improbable.</p><p class="lab">Pièges</p><p>Protéine de la phase aiguë, la ferritine s’élève dans l’inflammation, l’infection, les maladies hépatiques, le cancer, après un effort intense et dans les premières semaines du post-partum. Elle reste faussement haute dans les trois à quatre semaines qui suivent une perfusion de fer.</p><div class="key"><b>Conséquence.</b> Une ferritine se lit toujours avec la CRP ; une valeur « normale » sous inflammation n’exclut pas une carence.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS 2020</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-tsat" data-title="Saturation de la transferrine (TSAT)"><p class="lab">Définition</p><p>Rapport du fer sérique à la capacité totale de fixation de la transferrine. Chaque transferrine porte au plus deux atomes de fer ; une TSAT de 50 % signifie un atome par molécule en moyenne. Chez l’adulte sain, elle dépasse 20 %.</p><p class="lab">Valeur</p><p>Une TSAT inférieure à 20 % signe un fer insuffisant pour l’érythropoïèse, que les réserves soient vides ou séquestrées. Elle est utile lorsque la ferritine est faussée par l’inflammation, et dans la zone grise de 30 à 50 µg/L.</p><p class="lab">Limites</p><p>Elle hérite des variations du fer sérique, deux fois plus élevé le matin que douze heures plus tard. L’inflammation abaisse le fer sérique, mais elle abaisse aussi la transferrine, protéine négative de la phase aiguë, ce qui peut remonter le rapport : le consensus suisse signale ce biais.</p><div class="key"><b>Piège.</b> La TSAT s’élève dans les heures qui suivent une prise orale de fer, avec un pic 1,5 à 3 heures après le maltol ferrique : une valeur mesurée juste après la prise ne reflète pas les réserves.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et al. 2025</a>.</p></template>
<template data-pop="d50-seuil" data-title="Contentieux : quel seuil de ferritine ?"><p class="lab">Les positions</p><table class="t"><tr><th>Source</th><th>Seuil proposé</th><th>Usage</th></tr><tr><td>OMS 2020</td><td>&lt; 15 µg/L</td><td>Adulte en bonne santé, individus et populations</td></tr><tr><td>Delphi suisse 2019</td><td>&lt; 30 µg/L, ou 30–50 µg/L avec TSAT &lt; 20 %</td><td>Carence sans anémie, population générale</td></tr><tr><td>BSG 2021</td><td>&lt; 15 vides, &lt; 30 basses ; 45 µg/L pour décider d’explorer</td><td>Anémie ferriprive de l’adulte</td></tr><tr><td>Gynécologie suisse 2022</td><td>&lt; 30 µg/L</td><td>Grossesse, traitement même sans anémie</td></tr></table><p class="lab">Arbitrage</p><p>Le seuil de 15 µg/L est très spécifique. Les essais sur la fatigue ont toutefois inclus des ferritines jusqu’à 50 µg/L et montré un bénéfice modeste ; dans l’essai de Krayenbuehl, l’humeur ne s’améliorait que sous 15 µg/L. Clénin juge 30 µg/L le seuil le plus plausible chez l’adulte. La source suisse applicable la plus récente, gynécologie suisse 2022, retient 30 µg/L, comme le consensus de 2019 et la BSG 2021 pour des réserves basses. Ce cours applique donc 30 µg/L au diagnostic et réserve le seuil de 45 µg/L de la BSG à la décision d’exploration digestive sous inflammation.</p><p class="src">Références : <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS 2020</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-stades" data-title="Les stades de la carence martiale"><p>La carence progresse en trois stades, décrits par la Société suisse de médecine du sport et repris par Clénin.</p><p class="lab">1. Carence sans retentissement</p><p>Les réserves s’épuisent : la ferritine baisse. Hb, VGM et TCMH restent normaux. La protoporphyrine de zinc et le récepteur soluble de la transferrine commencent à augmenter quand le fer stocké ne suffit plus aux tissus.</p><p class="lab">2. Érythropoïèse carencée</p><p>Les hématies les plus jeunes sont insuffisamment chargées : le pourcentage d’hématies hypochromes dépasse 10 %, puis la TCMH passe sous 28 pg et le VGM sous 80 fl. L’Hb reste encore normale.</p><p class="lab">3. Anémie ferriprive</p><p>L’Hb passe sous le seuil ; la ferritine est basse, les indices globulaires le plus souvent abaissés.</p><div class="key"><b>Conséquence.</b> Chaque stade peut être symptomatique ; le premier se traite si la fatigue ou une situation à risque le justifient.</div><p class="src">Référence : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017, figure 3</a>.</p></template>
<template data-pop="d50-fonctionnelle" data-title="Carence absolue et carence fonctionnelle"><p class="lab">Définitions</p><p>Dans la carence absolue, les réserves sont insuffisantes pour les besoins. Dans la carence fonctionnelle, les réserves des macrophages paraissent normales, mais le fer n’est pas livré à la moelle, car l’hepcidine, élevée par l’inflammation et l’interleukine 6, bloque la ferroportine.</p><p class="lab">Où la rencontrer</p><p>Insuffisance rénale chronique, notamment sous agents stimulant l’érythropoïèse ; maladies inflammatoires comme la polyarthrite rhumatoïde et les MICI ; cancer ; insuffisance cardiaque.</p><p class="lab">Comment la reconnaître</p><p>Ferritine normale ou élevée, TSAT inférieure à 20 %, contenu en hémoglobine des réticulocytes inférieur à 28 pg. Une très bonne réponse au fer oral oriente au contraire vers une carence absolue.</p><div class="key"><b>Piège.</b> Les deux formes coexistent souvent : une inflammation n’exclut pas un saignement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, carence fonctionnelle</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-bilan" data-title="Le bilan quotidien du fer"><p class="lab">Chiffres normaux</p><p>Fer total : environ 4 g chez l’homme, 2,5 g chez la femme. Pertes : environ 1 mg par jour chez l’homme, par desquamation intestinale, et 2 mg chez la femme réglée. Apport alimentaire : 10 à 14 mg par jour, dont 0,5 à 2 mg absorbés, soit 5 à 15 %. Apport recommandé : 14 mg par jour.</p><p class="lab">Capacité d’adaptation</p><p>En cas de pertes ou de besoins accrus, l’absorption peut quadrupler, et la biodisponibilité monter jusqu’à 35 % en cas de carence, à condition que l’alimentation apporte assez de fer. Une anémie ferriprive ne peut toutefois pas être corrigée par l’alimentation seule.</p><div class="key"><b>Exemple.</b> Une perte de 10 mL de sang par jour, invisible dans les selles, représente environ 5 mg de fer, soit plusieurs fois l’absorption quotidienne habituelle de 0,5 à 2 mg.</div><p class="src">Référence : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a>.</p></template>
<template data-pop="d50-hepcidine" data-title="L’hepcidine"><p class="lab">Rôle</p><p>Peptide produit par l’hépatocyte, l’hepcidine provoque l’internalisation de la ferroportine, seul exportateur cellulaire du fer. Elle bloque ainsi l’absorption intestinale et la libération du fer par les macrophages.</p><p class="lab">Régulation</p><p>Elle augmente quand le fer abonde, en cas d’inflammation et après un effort intense ; elle baisse quand les réserves s’épuisent et quand l’érythropoïèse s’accélère, par l’intermédiaire de l’érythroferrone.</p><p class="lab">Application au traitement</p><p>À Zurich, une dose de 60 mg de fer élève l’hepcidine pendant 24 heures et réduit de 35 à 45 % l’absorption de la dose du lendemain. L’hepcidine passe de 2,1 à 4,1 ng/mL sept heures après 60 mg ; son élévation est d’autant plus faible que la dose est basse.</p><div class="key"><b>Conséquence.</b> Les prises rapprochées se neutralisent en partie ; une prise unique ou un jour sur deux exploite mieux la capacité d’absorption.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26289639/" target="_blank" rel="noopener">Moretti et al., Blood 2015</a> ; <a href="https://doi.org/10.57187/s.3635" target="_blank" rel="noopener">Karczewski et al., Swiss Med Wkly 2024</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-tissus" data-title="Conséquences tissulaires de la carence"><p class="lab">Mécanisme</p><p>Le fer est indispensable à la myoglobine, aux cytochromes de la chaîne respiratoire, à la phosphorylation oxydative, à la synthèse de neurotransmetteurs et à la myélinisation. Chez l’animal, la carence sans anémie diminue déjà le nombre de mitochondries et l’activité des enzymes respiratoires ; l’anémie, elle, atteint surtout le transport de l’oxygène.</p><p class="lab">Manifestations</p><p>Fatigue, baisse de la capacité d’effort, troubles de l’attention et de la mémoire, syndrome des jambes sans repos, chute de cheveux, céphalées, ongles cassants, koilonychie, chéilite et glossite atrophique.</p><div class="key"><b>Limite.</b> Ces symptômes sont peu spécifiques ; leur lien avec la carence se prouve par l’amélioration sous traitement, non par leur seule présence.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-digestif" data-title="Saignement digestif occulte"><p class="lab">Fréquence</p><p>Chez l’homme et la femme ménopausée, environ un tiers des explorations découvrent une lésion significative ; un cancer est trouvé dans 8 à 10 % des cas, une double lésion haute et basse dans 1 à 10 %.</p><p class="lab">Lésions</p><p>Adénocarcinome colique ou œso-gastrique ; ulcère peptique ; MICI ; angioectasies, fréquentes chez le sujet âgé ; entéropathie aux AINS ; plus rarement tumeur du grêle ou parasitose.</p><div class="key"><b>Piège.</b> L’anémie ferriprive peut être la première manifestation d’un cancer digestif, sans aucun symptôme abdominal ; un test de sang occulte négatif ne l’exclut pas.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, tableau 1 et section imagerie</a>.</p></template>
<template data-pop="d50-menorragies" data-title="Ménorragies"><p class="lab">Poids épidémiologique</p><p>Les pertes menstruelles sont la cause la plus fréquente de carence chez la femme non ménopausée. Dans une étude de femmes jeunes souffrant de ménorragies, plus de la moitié avaient des réserves basses, mais seulement 25 % étaient anémiques.</p><p class="lab">Conduite</p><p>Le médecin quantifie les règles et recherche une cause gynécologique lorsque le saignement est anormal. Le fer intraveineux est supérieur au fer oral si les ménorragies persistent ; le carboxymaltose a obtenu une hausse de l’Hb de plus de 20 g/L chez 82 % des patientes après une hémorragie utérine grave, contre 61,8 % sous fer oral.</p><div class="key"><b>Piège.</b> Une carence disproportionnée aux pertes, récidivante ou associée à un signe d’alerte justifie une exploration digestive même chez la femme jeune.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Information professionnelle suisse Ferinject®</a>.</p></template>
<template data-pop="d50-osler" data-title="Télangiectasie hémorragique héréditaire (maladie de Rendu et Osler)"><p>Maladie héréditaire vasculaire qui expose à des épistaxis répétées et à des pertes sanguines chroniques. L’examen des lèvres, de la langue, de la muqueuse buccale et des doigts peut en donner le diagnostic.</p><p class="lab">Conséquences pour le traitement</p><p>Les pertes chroniques épuisent les réserves et peuvent nécessiter un fer intraveineux répété. L’information professionnelle suisse du carboxymaltose cite cette maladie parmi les facteurs de risque d’ostéomalacie hypophosphatémique en cas de doses élevées répétées : le phosphate sérique doit alors être surveillé.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025</a>.</p></template>
<template data-pop="d50-coeliaque" data-title="Maladie cœliaque et carence martiale"><p class="lab">Fréquence</p><p>La maladie cœliaque est trouvée chez 3 à 5 % des patients explorés pour une anémie ferriprive inexpliquée ; elle réduit l’absorption intestinale du fer.</p><p class="lab">Dépistage</p><p>Le test initial est l’anticorps IgA anti-transglutaminase tissulaire, avec un dosage simultané des IgA totales pour écarter un déficit en IgA ; le patient doit consommer du gluten. Le groupe européen de 2025 range la carence martiale chronique et l’anémie inexpliquée parmi les indications de dépistage.</p><p class="lab">Limites</p><p>La sensibilité de la sérologie baisse avec l’âge, jusqu’à 74 % chez les patients cœliaques révélés par une anémie ferriprive. Chez le sujet âgé, des biopsies duodénales au cours de la gastroscopie sont donc préférables.</p><div class="key"><b>Conséquence.</b> Une anémie qui ne répond pas au fer oral chez un adulte jeune fait rechercher une maladie cœliaque.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12704582/" target="_blank" rel="noopener">Société européenne d’étude de la maladie cœliaque, recommandations 2025, partie 1</a>.</p></template>
<template data-pop="d50-gastrite" data-title="Gastrite atrophique, Helicobacter pylori et inhibiteurs de la pompe à protons"><p class="lab">Mécanisme commun</p><p>L’acidité gastrique favorise l’absorption du fer alimentaire. Toute achlorhydrie, qu’elle provienne d’une gastrite atrophique, d’une gastrectomie ou d’un traitement prolongé par inhibiteur de la pompe à protons, la réduit.</p><p class="lab">Données</p><p>La gastrite atrophique est plus fréquente chez les patients sans autre cause d’anémie ferriprive. L’association avec Helicobacter pylori est faible et pourrait passer par l’ulcère ou l’atrophie ; dans une méta-analyse, l’éradication n’améliore pas la réponse au fer.</p><div class="key"><b>Conséquence.</b> Les biopsies gastriques systématiques restent discutées ; une gastrite atrophique, cause irréversible, peut justifier un traitement martial au long cours.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-bariatrique" data-title="Chirurgie gastrique et bariatrique"><p class="lab">Mécanisme</p><p>Après une dérivation gastrique de Roux en Y, la sécrétion acide diminue et l’intestin grêle proximal est court-circuité. La carence touche 16 à 42 % de ces patients ; le fer intraveineux est souvent préféré.</p><p class="lab">Donnée suisse</p><p>À Lausanne, chez 77 patients opérés, 63,6 % ont développé une hypophosphatémie inférieure à 0,8 mmol/L après une perfusion de carboxymaltose ; 500 mg abaissaient le phosphate de 0,26 mmol/L de plus que 250 mg.</p><div class="key"><b>Piège.</b> Une carence nouvelle chez un opéré ne dispense pas de chercher une autre cause, notamment digestive.</div><p class="src">Références : <a href="https://doi.org/10.57187/s.3771" target="_blank" rel="noopener">Pereira Portela et al., Swiss Med Wkly 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-sport" data-title="Carence martiale du sportif d’endurance"><p class="lab">Mécanismes</p><p>Les besoins augmentent avec l’entraînement intensif ; l’effort intense provoque en outre des pics d’hepcidine qui bloquent l’absorption. Un apport énergétique insuffisant et une alimentation végétarienne s’y ajoutent souvent.</p><p class="lab">Preuves</p><p>Dans les essais contrôlés chez des sportifs sans anémie, le fer intraveineux n’améliore pas la performance lorsque la ferritine est normale ; un bénéfice n’apparaît que chez les athlètes réellement carencés.</p><div class="key"><b>Conduite.</b> Seuil de 30 µg/L ; conseil diététique et fer oral ; apport intermittent si les réserves baissent de façon répétée ; jamais de fer intraveineux « de performance ».</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017, tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-irida" data-title="Anémie ferriprive réfractaire au fer"><p>Maladie héréditaire rare, due à des variants pathogènes de TMPRSS6, qui code la matriptase-2 : l’hepcidine reste élevée malgré la carence.</p><p class="lab">Reconnaître</p><p>Anémie hypochrome microcytaire, TSAT très basse (souvent inférieure à 10 %), ferritine relativement conservée, absence d’inflammation, réponse nulle ou partielle au fer oral, réponse incomplète au fer intraveineux. Un rapport TSAT sur hepcidine bas en est la signature.</p><p class="lab">Traiter</p><p>Le fer intraveineux est plus constant que le fer oral ; aucune recommandation internationale fondée sur des essais n’existe, et la conduite repose sur des avis d’experts.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11985374/" target="_blank" rel="noopener">Hoving et al., Br J Haematol 2025</a>.</p></template>
<template data-pop="d50-fatigue" data-title="Fatigue et carence martiale"><p class="lab">Valeur du symptôme</p><p>La fatigue est le motif de consultation le plus fréquent de la carence, avec ou sans anémie. Elle est banale et a de nombreuses causes : la ferritine en éclaire une seule.</p><p class="lab">Ce que montrent les essais</p><p>Chez des femmes réglées fatiguées, sans anémie et avec une ferritine inférieure à 50 µg/L, 80 mg de fer oral par jour pendant douze semaines ont réduit le score de fatigue de 47,7 %, contre 28,8 % sous placebo. L’effet placebo est donc important et le bénéfice propre du fer modeste.</p><div class="key"><b>Conséquence.</b> Les symptômes de la carence se retrouvent dans de nombreuses affections : le médecin recherche les autres causes de fatigue et juge l’effet du fer sur l’évolution des symptômes et de la ferritine.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3414597/" target="_blank" rel="noopener">Vaucher et al., Can Med Assoc J 2012</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-jambes" data-title="Syndrome des jambes sans repos"><p>La BSG et le consensus suisse citent le syndrome des jambes sans repos parmi les manifestations de la carence martiale.</p><p class="lab">Seuils particuliers</p><p>Le consensus suisse retient, chez le sujet âgé atteint de ce syndrome, une carence définie par une ferritine inférieure à 50 µg/L ou une TSAT inférieure à 16 % ; le carboxymaltose y améliore significativement les symptômes. Ce syndrome fait partie des situations où une ferritine plus élevée est visée.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a> ; <a href="https://doi.org/10.4414/smw.2019.20127" target="_blank" rel="noopener">Meier et al., Swiss Med Wkly 2019</a>.</p></template>
<template data-pop="d50-pica" data-title="Pica et pagophagie"><p>Le pica est l’envie de consommer des substances non alimentaires ; la pagophagie, le besoin de croquer de la glace. La BSG les cite parmi les manifestations relativement propres à la carence martiale, avec la chéilite angulaire et la glossite.</p><div class="key"><b>Conséquence.</b> Ces symptômes, rarement signalés spontanément, se recherchent à l’interrogatoire.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, anamnèse et examen</a>.</p></template>
<template data-pop="d50-phaneres" data-title="Signes des phanères et des muqueuses"><p class="lab">Signes</p><p>Koilonychie, ongles concaves en cuillère ; ongles cassants ; chéilite angulaire, fissure des commissures labiales ; glossite atrophique, langue lisse et dépapillée ; sclérotiques bleues ; chute de cheveux. Le syndrome de Plummer et Vinson associe une dysphagie à la carence.</p><div class="key"><b>Valeur.</b> Ces signes sont tardifs et inconstants : leur absence n’exclut rien, leur présence oriente fortement.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-inflammation" data-title="Anémie inflammatoire"><p class="lab">Mécanisme</p><p>L’inflammation, par l’interleukine 6, élève l’hepcidine : le fer reste séquestré dans les macrophages, l’absorption baisse, la moelle manque de fer malgré des réserves. La production d’érythropoïétine et la réponse de la moelle sont aussi diminuées, notamment dans le cancer.</p><p class="lab">Biologie</p><p>Ferritine normale ou élevée, TSAT basse, CRP élevée, VGM normal ou modérément bas, contenu en hémoglobine des réticulocytes inférieur à 28 pg.</p><p class="lab">Conduite</p><p>Traiter la maladie causale. Le fer oral peut être insuffisant lorsque la ferritine est inférieure à 100 µg/L et la TSAT inférieure à 20 % ; la voie intraveineuse se discute alors. Une ferritine inférieure à 70 µg/L sous inflammation indique une carence absolue associée.</p><div class="key"><b>Piège.</b> Une anémie inflammatoire n’exclut pas une perte sanguine : l’exploration digestive reste nécessaire si une carence absolue est probable.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a> ; <a href="https://iris.who.int/handle/10665/331505" target="_blank" rel="noopener">OMS 2020</a>.</p></template>
<template data-pop="d50-thalassemie" data-title="Thalassémie mineure"><p class="lab">Reconnaître</p><p>La microcytose est disproportionnée au degré d’anémie, souvent légère ; ferritine et TSAT sont normales. L’origine et les antécédents familiaux orientent.</p><p class="lab">Confirmer</p><p>Électrophorèse ou chromatographie de l’hémoglobine, demandée par gynécologie suisse si VGM inférieur à 80 fl ou TCMH inférieure à 27 pg sans carence, en cas d’antécédent familial ou selon l’origine. Une alpha-thalassémie peut donner une électrophorèse normale. Le pourcentage d’hématies hypochromes s’élève même avec des réserves normales.</p><div class="key"><b>Piège.</b> Thalassémie et carence coexistent : la ferritine se dose aussi chez le porteur connu. Une microcytose avec bilan martial normal ne justifie ni fer ni endoscopie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-epreuve" data-title="Épreuve thérapeutique par le fer oral"><p class="lab">Principe</p><p>Lorsque le bilan martial est ambigu, un traitement oral de deux à quatre semaines sert de test : une hausse de l’Hb d’au moins 10 g/L en deux semaines est très sensible pour une carence absolue.</p><p class="lab">Limites</p><p>Le test dépend de l’adhésion ; il ne renseigne pas sur la cause. Une absence de réponse n’exclut pas une carence en cas de malabsorption, d’inflammation ou de saignement persistant.</p><div class="key"><b>Conséquence.</b> L’épreuve ne retarde jamais l’exploration d’un patient à risque de cancer digestif.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 5</a>.</p></template>
<template data-pop="d50-qui-explorer" data-title="Qui explorer, et comment"><p class="lab">Chez tous</p><p>Anamnèse détaillée, analyse d’urine, sérologie cœliaque.</p><p class="lab">Homme et femme ménopausée</p><p>Gastroscopie et coloscopie en première intention ; coloscopie virtuelle par tomodensitométrie si la coloscopie est inadaptée.</p><p class="lab">Femme non ménopausée</p><p>Endoscopie seulement si : âge supérieur à 50 ans, absence de règles, signe d’alerte, cancer colorectal chez deux apparentés du premier degré ou chez un apparenté de moins de 50 ans, carence récidivante ou disproportionnée aux pertes.</p><p class="lab">Homme jeune</p><p>Même algorithme que chez le sujet âgé.</p><p class="lab">Sujet âgé fragile</p><p>Bénéfice et risque discutés avec le patient et sa famille.</p><p class="lab">Carence sans anémie</p><p>Pas d’exploration invasive systématique ; seuil plus bas chez l’homme, la femme ménopausée ou en cas de symptôme digestif.</p><div class="key"><b>Aide à la décision.</b> L’âge, le sexe, l’Hb et le VGM prédisent le risque de cancer ; plus l’anémie est profonde et microcytaire, plus l’exploration est urgente.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandations 6 à 11, 22, 24 à 29</a>.</p></template>
<template data-pop="d50-endoscopie" data-title="Gastroscopie et coloscopie"><p class="lab">Technique</p><p>Les deux examens se font si possible au cours de la même séance, ce qui simplifie la décision lorsque la gastroscopie montre une lésion de signification incertaine. La gastroscopie comporte des biopsies duodénales chez le sujet âgé, chez qui la sérologie cœliaque est moins sensible.</p><p class="lab">Règle</p><p>La coloscopie n’est différée que si la gastroscopie découvre un cancer, car une double lésion est possible. Le fer oral est suspendu avant la préparation colique ; il n’a pas à l’être avant une gastroscopie ou une coloscopie virtuelle.</p><p class="lab">Alternatives</p><p>Coloscopie virtuelle par tomodensitométrie chez le patient fragile, au prix d’une moindre sensibilité pour les lésions vasculaires ; tomodensitométrie sans préparation seulement chez le patient très fragile, car elle manque des cancers.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, imagerie du tube digestif</a>.</p></template>
<template data-pop="d50-capsule" data-title="Capsule endoscopique de l’intestin grêle"><p class="lab">Indication</p><p>Anémie ferriprive avec gastroscopie et coloscopie de bonne qualité négatives, et réponse insuffisante au fer ou récidive. L’ESGE en fait l’examen de première ligne du grêle dans cette situation.</p><p class="lab">Rendement</p><p>Environ deux tiers dans les séries d’anémie ferriprive ; les lésions vues sont surtout des angioectasies, une maladie de Crohn et une entéropathie aux AINS. Jusqu’à 28 % des lésions trouvées étaient en fait accessibles à la gastroscopie, sans justifier une seconde gastroscopie systématique.</p><p class="lab">Après la capsule</p><p>L’entéroscopie assistée confirme et traite ; après une capsule négative de bonne qualité, l’exploration ne reprend que si l’anémie persiste.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36423618/" target="_blank" rel="noopener">Pennazio et al., ESGE 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-fit" data-title="Test immunochimique fécal"><p class="lab">Principe</p><p>Le test détecte des traces d’hémoglobine humaine dans les selles et sert au tri des patients suspects de cancer colorectal.</p><p class="lab">Limite dans l’anémie ferriprive</p><p>Au seuil de 10 µg/g, sa sensibilité pour le cancer colorectal varie de 83 à 91 % dans six études ; parmi 81 cancers à test négatif, 32 concernaient des patients atteints d’anémie ferriprive. Le cancer colorectal ne représente en outre qu’une minorité des lésions responsables.</p><div class="key"><b>Conséquence.</b> La BSG ne recommande pas ce test pour exclure une lésion ou trier les patients atteints d’anémie ferriprive ; il ne remplace pas les endoscopies.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 10 et tableau 2</a>.</p></template>
<template data-pop="d50-second" data-title="Marqueurs de seconde ligne"><table class="t"><tr><th>Marqueur</th><th>Normal</th><th>Valeur et limite</th></tr><tr><td>Contenu en Hb des réticulocytes</td><td>28–35 pg</td><td>Inférieur à 28 pg : moelle carencée en 48 à 72 h ; faux positif en cas de thalassémie</td></tr><tr><td>Hématies hypochromes</td><td>&lt; 10 %</td><td>Hausse en 1 à 2 semaines ; élevé aussi dans la thalassémie</td></tr><tr><td>Récepteur soluble de la transferrine</td><td>Selon le laboratoire</td><td>Peu modifié par l’inflammation ; élevé dans toute érythropoïèse accélérée</td></tr><tr><td>Rapport récepteur soluble sur logarithme de la ferritine</td><td>Selon le laboratoire</td><td>Meilleure discrimination dans les maladies chroniques</td></tr><tr><td>Protoporphyrine de zinc</td><td>&lt; 50 µmol/mol d’hème</td><td>Plus de 100 : érythropoïèse carencée</td></tr><tr><td>Hepcidine</td><td>Non standardisée</td><td>Très basse dans la carence absolue ; prédit la réponse au fer oral ; peu disponible</td></tr></table><p>Ces examens servent les cas difficiles, surtout l’insuffisance rénale et les maladies inflammatoires ; ils ne remplacent pas la ferritine.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017, tableau 3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-reponse" data-title="Réponse attendue au fer"><p class="lab">Chiffres</p><p>Fer oral : hausse de l’Hb d’au moins 10 g/L en deux semaines, ou de 20 g/L en quatre semaines ; environ 1 g/L par jour et 20 à 30 g/L en trois semaines selon le consensus suisse. Environ 73 % des patients répondent ainsi. Une hausse inférieure à 10 g/L à deux semaines prédit l’échec avec une sensibilité de 90 % et une spécificité de 79 %.</p><p class="lab">Causes d’échec</p><p>Mauvaise adhésion ou prise au repas ; malabsorption (maladie cœliaque, gastrite atrophique, chirurgie) ; saignement persistant ; inflammation ; carence associée en vitamine B12 ou en folates ; hémolyse ; maladie de la moelle ; diagnostic erroné, comme une thalassémie.</p><div class="key"><b>Conduite.</b> Vérifier l’adhésion, rechercher la cause d’échec, puis passer à la voie intraveineuse si l’anémie le justifie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></template>
<template data-pop="d50-alterne" data-title="Prise un jour sur deux"><p class="lab">Preuve</p><p>Deux essais randomisés zurichois, conduits chez des femmes de 18 à 40 ans à ferritine inférieure ou égale à 25 µg/L, ont mesuré l’absorption par isotopes stables. Avec 60 mg un jour sur deux pendant 28 jours, l’absorption fractionnelle cumulée atteignait 21,8 %, contre 16,3 % avec 60 mg chaque jour pendant 14 jours, et le fer total absorbé 175 mg contre 131 mg pour le même nombre de doses. Une étude antérieure avait montré que trois doses de 60 mg en 24 heures n’étaient pas mieux absorbées que deux doses matinales.</p><p class="lab">Limites</p><p>Ce sont des études d’absorption, non des essais d’efficacité clinique. Dans l’anémie ferriprive, 60 mg deux fois par jour relève l’Hb plus vite que 120 mg un jour sur deux, avec plus de nausées ; à dose totale égale, l’Hb rejoint le même niveau.</p><div class="key"><b>Usage.</b> Option de choix en cas d’intolérance digestive ou de carence sans urgence ; contrôle plutôt à quatre semaines qu’à deux.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29032957/" target="_blank" rel="noopener">Stoffel et al., Lancet Haematol 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-faible-dose" data-title="Fer oral à faible dose"><p class="lab">Données</p><p>Chez des sujets âgés anémiques, 15 mg de fer par jour ont été aussi efficaces que 50 ou 150 mg, avec moins d’effets indésirables. Clénin propose 28 à 50 mg par jour chez la personne jeune en bonne santé. Une étude zurichoise ouverte, à un seul bras, chez 36 femmes sans anémie, a fait passer la ferritine de 18 à 33 µg/L avec 6 mg deux fois par jour pendant huit semaines ; une seule a rapporté des effets digestifs.</p><div class="key"><b>Limite.</b> Ces données sont peu nombreuses et l’étude zurichoise n’a pas de groupe témoin ; les doses faibles se réservent à l’intolérance, au sujet âgé et à la carence sans anémie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://doi.org/10.57187/smw.2023.40079" target="_blank" rel="noopener">Simic et al., Swiss Med Wkly 2023</a>.</p></template>
<template data-pop="d50-vitc" data-title="Contentieux : faut-il ajouter de la vitamine C ?"><table class="t"><tr><th>Source</th><th>Position</th></tr><tr><td>Clénin 2017</td><td>La vitamine C des aliments favorise l’absorption du fer non héminique ; un jus d’agrumes au repas est conseillé</td></tr><tr><td>BSG 2021</td><td>Un grand essai randomisé montre que la vitamine C ajoutée au fer oral n’améliore ni la réponse de l’Hb, ni la reconstitution des réserves, ni la tolérance : non recommandée</td></tr><tr><td>Gynécologie suisse 2022</td><td>Pas d’influence significative sur la hausse de l’Hb</td></tr></table><p class="lab">Arbitrage</p><p>Les deux sources les plus récentes, dont la recommandation suisse de 2022, s’accordent : le complément de vitamine C n’est pas utile au traitement. Le conseil diététique sur les aliments riches en vitamine C reste pertinent pour la prévention.</p></template>
<template data-pop="d50-ganzoni" data-title="Formule de Ganzoni et schéma simplifié"><p class="lab">Formule</p><p>Déficit total (mg) = poids (kg) × (Hb cible − Hb mesurée) (g/dL) × 2,4 + réserves (mg). Le facteur 2,4 combine la teneur en fer de l’Hb (0,34 %), le volume sanguin (70 mL/kg) et la conversion d’unités. Hb cible : 15 g/dL ; réserves : 500 mg au-delà de 35 kg. Le poids idéal s’emploie chez l’obèse, le poids d’avant la grossesse chez la femme enceinte.</p><p class="lab">Exemple</p><p>Femme de 60 kg, Hb 9 g/dL : 60 × 6 × 2,4 + 500 = 1364 mg, arrondis à 1300 mg.</p><p class="lab">Schéma simplifié du carboxymaltose</p><table class="t"><tr><th>Hb</th><th>35 à 70 kg</th><th>70 kg et plus</th></tr><tr><td>&lt; 10 g/dL</td><td>1500 mg</td><td>2000 mg</td></tr><tr><td>10 à 14 g/dL</td><td>1000 mg</td><td>1500 mg</td></tr><tr><td>≥ 14 g/dL</td><td>500 mg</td><td>500 mg</td></tr></table><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025, tableaux 1 et 2</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">Monofer®, juin 2026</a>.</p></template>
<template data-pop="d50-hypersensibilite" data-title="Réactions d’hypersensibilité au fer intraveineux"><p class="lab">Nature</p><p>Réactions immédiates de type anaphylactique, potentiellement mortelles, possibles même après des perfusions antérieures bien tolérées ; hypotension, tachycardie, bronchospasme, œdème laryngé, urticaire. Elles peuvent évoluer vers un syndrome de Kounis, spasme coronaire allergique pouvant causer un infarctus. Pendant la grossesse, une bradycardie fœtale peut accompagner une réaction maternelle.</p><p class="lab">Facteurs de risque</p><p>Allergies connues, asthme sévère, eczéma ou atopie, lupus, polyarthrite rhumatoïde.</p><p class="lab">Conduite</p><p>Arrêt immédiat ; adrénaline en premier, puis antihistaminiques et corticoïdes. Surveillance de 30 minutes après chaque perfusion.</p><p class="lab">Contentieux entre molécules</p><p>Certaines études trouvent plus de réactions légères ou modérées avec le dérisomaltose qu’avec le carboxymaltose (environ 10 % contre 2,5 %), d’autres aucune différence ; les réactions graves restent rares avec les deux.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680670010016" target="_blank" rel="noopener">Monofer®</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-hypophos" data-title="Hypophosphatémie après fer intraveineux"><p class="lab">Mécanisme</p><p>Certaines préparations, surtout le carboxymaltose, élèvent fortement le FGF23 intact, hormone phosphaturique. Le rein perd du phosphate ; le FGF23 freine aussi l’activation de la vitamine D, d’où une baisse du calcium et une élévation de la parathormone, qui prolonge la fuite.</p><p class="lab">Fréquence</p><p>Dans deux essais randomisés, 7,9 et 8,1 % après dérisomaltose contre 75,0 et 73,7 % après carboxymaltose. Dans une méta-analyse de 42 essais, 47 % contre 4 % ; jusqu’à 45 % des patients restaient hypophosphatémiques à trois mois.</p><p class="lab">Facteurs de risque</p><p>Carence sévère, fonction rénale normale, doses élevées répétées, carence en vitamine D, malabsorption, MICI, hyperparathyroïdie, télangiectasie hémorragique héréditaire, ostéoporose.</p><p class="lab">Conséquences et conduite</p><p>Souvent asymptomatique, elle peut causer une ostéomalacie et des fractures. Le phosphate se contrôle chez les patients à risque ; des douleurs osseuses doivent faire consulter ; une hypophosphatémie persistante fait reconsidérer la molécule. Gynécologie suisse la juge en général sans portée clinique chez la femme enceinte ; l’information professionnelle de 2025, plus récente, impose néanmoins la surveillance des patients à risque.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7042864/" target="_blank" rel="noopener">Wolf et al., JAMA 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8247006/" target="_blank" rel="noopener">Schaefer et al., 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®, juin 2025</a>.</p></template>
<template data-pop="d50-transfusion" data-title="Transfusion dans l’anémie ferriprive"><p class="lab">Indication</p><p>La transfusion est rarement nécessaire, car l’anémie lente est bien tolérée et le fer intraveineux relève l’Hb en une semaine. Elle se réserve à l’anémie sévère symptomatique ou à l’instabilité circulatoire.</p><p class="lab">Cible</p><p>La BSG juge raisonnable une Hb de 70 à 90 g/L, ou de 80 à 100 g/L en cas de maladie coronarienne instable. Après un accouchement, gynécologie suisse situe le seuil critique vers 60 à 65 g/L, en décision individuelle.</p><div class="key"><b>Piège.</b> Un concentré érythrocytaire apporte environ 200 mg de fer : le traitement martial doit suivre.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandation 19</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a>.</p></template>
<template data-pop="d50-essais" data-title="Essais dans la carence sans anémie"><table class="t"><tr><th>Étude</th><th>Population</th><th>Résultat</th></tr><tr><td>Vaucher, 2012</td><td>198 femmes fatiguées, ferritine &lt; 50 µg/L, Hb &gt; 120 g/L ; 80 mg de fer oral, 12 semaines</td><td>Fatigue −47,7 % contre −28,8 % sous placebo ; pas d’effet sur la qualité de vie</td></tr><tr><td>Prefer, 2014</td><td>290 femmes fatiguées, ferritine &lt; 50 µg/L avec TSAT &lt; 20 % ou &lt; 15 µg/L ; 1000 mg de carboxymaltose</td><td>Fatigue réduite chez 65,3 % contre 52,7 % ; réduction de moitié chez 33,3 % contre 16,4 % ; plus d’effets indésirables</td></tr><tr><td>Krayenbuehl, 2011</td><td>Femmes fatiguées, fer intraveineux</td><td>Amélioration de l’humeur seulement si ferritine &lt; 15 µg/L</td></tr></table><p>Ces essais, menés en partie en Suisse et en partie financés par l’industrie, montrent un effet réel mais modeste et un effet placebo important. Une méta-analyse ne trouve aucun gain de consommation maximale d’oxygène.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3414597/" target="_blank" rel="noopener">Vaucher et al., Can Med Assoc J 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3994001/" target="_blank" rel="noopener">Favrat et al., PLoS One 2014</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-surtraitement" data-title="Le risque de surtraitement en Suisse"><p class="lab">Données</p><p>Entre 2012 et 2014, 9,4 % des assurés suisses ont reçu du fer en trois ans, contre 4,4 % des patients britanniques ; le fer intraveineux concernait 1,9 % des assurés en 2014. Dans 279 cabinets de médecine de famille, la carence sans anémie motivait 59,4 % des perfusions, et la ferritine au moment de la perfusion augmentait au fil des années. Avant une première perfusion, l’Hb n’était mesurée que chez 11,7 % des patients.</p><p class="lab">Position des experts</p><p>Le consensus suisse reconnaît un risque de surtraitement de la carence sans anémie. Une supplémentation quotidienne au long cours, orale ou intraveineuse, avec une ferritine normale ou élevée n’est pas recommandée et pourrait être nuisible.</p><div class="key"><b>Règle.</b> Pas de fer sans carence prouvée ; pas de perfusion sans indication documentée.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14444" target="_blank" rel="noopener">Biétry et al., 2017</a> ; <a href="https://doi.org/10.4414/smw.2019.20127" target="_blank" rel="noopener">Meier et al., 2019</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi 2019</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin 2017</a>.</p></template>
<template data-pop="d50-recidive" data-title="Anémie persistante ou récidivante"><p class="lab">Définitions</p><p>Persistante : la carence demeure malgré un traitement adapté. Récidivante : elle disparaît, puis revient. Elle récidive chez 12 à 25 % des patients après des endoscopies négatives et une bonne réponse.</p><p class="lab">Démarche</p><p>Revoir l’adhésion et la malabsorption ; refaire les endoscopies si elles sont anciennes, un délai de deux ans étant proposé ; explorer le grêle par capsule ; imager les voies urinaires même si l’analyse d’urine est normale. Une perte de poids, une diarrhée chronique ou une CRP élevée persistante signalent une maladie active.</p><p class="lab">Si aucune cause n’est trouvée</p><p>Un traitement martial au long cours est légitime, notamment pour des angioectasies, dont le traitement endoscopique n’a pas prouvé sa supériorité.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, recommandations 12 à 16</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/36423618/" target="_blank" rel="noopener">ESGE 2022</a>.</p></template>
<template data-pop="d50-grossesse" data-title="Carence martiale pendant la grossesse"><p class="lab">Dépistage</p><p>Hb et ferritine au début de la grossesse et entre 24 et 28 semaines ; Hb au moins une fois par trimestre. Une ferritine inférieure à 30 µg/L signe des réserves vides avec 90 % de probabilité et se traite même sans anémie.</p><p class="lab">Traitement oral</p><p>80 à 200 mg de fer par jour, en une prise, à jeun si possible ; contrôle après deux à quatre semaines. Les polyvitamines contenant du fer sont insuffisantes.</p><p class="lab">Fer intraveineux dès le deuxième trimestre</p><p>Hausse de l’Hb inférieure à 10 g/L en 14 jours ; intolérance ou mauvaise adhésion ; malabsorption ; Hb inférieure à 90 g/L ; besoin d’une correction rapide (troisième trimestre, placenta prævia, refus de transfusion). Le carboxymaltose est la molécule la mieux étudiée ; la dose se calcule sur le poids d’avant la grossesse. Le fer intraveineux est contre-indiqué au premier trimestre.</p><div class="key"><b>Piège.</b> Une microcytose sans carence fait rechercher une hémoglobinopathie et tester le partenaire.</div><p class="src">Références : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a>.</p></template>
<template data-pop="d50-postpartum" data-title="Anémie du post-partum"><p class="lab">Diagnostic</p><p>Une Hb inférieure à 100 g/L est une anémie significative. Le nadir survient environ 48 heures après l’accouchement. La ferritine n’est pas interprétable dans les premières semaines ; elle se mesure avant l’accouchement ou à partir de six semaines.</p><p class="lab">Traitement</p><table class="t"><tr><th>Hb</th><th>Conduite</th></tr><tr><td>95 à 120 g/L</td><td>Fer oral, 80 à 100 mg par jour</td></tr><tr><td>85 à 95 g/L</td><td>Fer intraveineux en premier choix</td></tr><tr><td>&lt; 85 g/L</td><td>Fer intraveineux ; érythropoïétine, hors indication, seulement sous 80 g/L avec facteurs aggravants</td></tr></table><p>Le fer intraveineux relève l’Hb plus vite et améliore davantage la fatigue que le fer oral.</p><p class="src">Référence : <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 2022</a>.</p></template>
<template data-pop="d50-mici" data-title="Carence martiale et MICI"><p class="lab">Mécanismes</p><p>L’anémie est la complication systémique la plus fréquente des MICI ; elle associe pertes sanguines, malabsorption et inflammation.</p><p class="lab">Seuils</p><p>Ferritine inférieure à 30 µg/L sans inflammation clinique, endoscopique ou biologique ; inférieure à 100 µg/L en cas d’inflammation.</p><p class="lab">Traitement</p><p>Le fer intraveineux est préféré en cas de maladie active, d’intolérance antérieure au fer oral ou d’Hb inférieure à 100 g/L ; la dose ne dépasse pas 1000 mg ou 20 mg/kg par semaine. Le fer oral peut aggraver une maladie active ; le maltol ferrique a été étudié dans les MICI inactives ou peu actives. Surveillance de la récidive tous les trois mois pendant un an, puis tous les six à douze mois.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gastroentérologique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></template>
<template data-pop="d50-ic" data-title="Carence martiale et insuffisance cardiaque"><p class="lab">Définition propre</p><p>Ferritine inférieure à 100 µg/L, ou de 100 à 300 µg/L avec TSAT inférieure à 20 %, avec ou sans anémie. Ce seuil élevé tient compte de l’inflammation chronique.</p><p class="lab">Données</p><p>La carence touche jusqu’à la moitié des patients et s’associe à une moins bonne qualité de vie, une capacité d’effort réduite et une mortalité accrue. Chez les patients à fraction d’éjection réduite, le carboxymaltose intraveineux améliore les symptômes, la capacité d’effort et la qualité de vie ; le fer oral n’a pas montré de bénéfice.</p><p class="lab">Suivi</p><p>Contrôle de la ferritine 8 à 12 semaines après le traitement, puis ferritine, TSAT et CRP chaque année. Les recommandations européennes de cardiologie et leurs classes sont traitées dans le cours I50.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section cardiologique</a> ; <a href="https://doi.org/10.4414/smw.2017.14453" target="_blank" rel="noopener">Gstrein et al., Swiss Med Wkly 2017</a>.</p></template>
<template data-pop="d50-irc" data-title="Carence martiale et insuffisance rénale chronique"><p class="lab">Seuils</p><p>Le consensus suisse définit l’anémie de l’insuffisance rénale par une Hb inférieure à 135 g/L chez l’homme et à 120 g/L chez la femme. La BSG retient la carence absolue pour une TSAT d’au plus 20 % avec une ferritine d’au plus 100 µg/L avant la dialyse, ou d’au plus 200 µg/L en hémodialyse.</p><p class="lab">Traitement</p><p>La carence est la principale cause réversible d’anémie et de résistance aux agents stimulant l’érythropoïèse ; le fer est donné avant ces agents si la ferritine est inférieure à 200 µg/L ou la TSAT inférieure à 25 %, sans dépasser une TSAT de 45 %. Le fer intraveineux est plus efficace que le fer oral : le carboxymaltose relève l’Hb d’au moins 10 g/L chez 60,4 % des patients non dialysés contre 34,7 % sous sulfate ferreux.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section néphrologique</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680578510014" target="_blank" rel="noopener">Ferinject®</a>.</p></template>
<template data-pop="d50-age" data-title="Le sujet âgé"><p class="lab">Épidémiologie</p><p>L’anémie touche plus de 20 % des personnes de plus de 85 ans et plus de la moitié des résidents d’établissements médico-sociaux ; la carence y contribue dans environ la moitié des cas.</p><p class="lab">Causes</p><p>Souvent multiples : alimentation pauvre, absorption réduite, saignement occulte aggravé par les antithrombotiques, maladie chronique ; double lésion digestive plus fréquente.</p><p class="lab">Conduite</p><p>L’exploration se discute selon la fragilité, les comorbidités et l’espérance de vie, avec le patient et sa famille. Le fer oral reste le premier choix ; 15 mg par jour peuvent suffire, et la réponse est souvent lente. Le carboxymaltose est bien toléré lorsqu’il est nécessaire.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, sujet âgé</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section gériatrique</a>.</p></template>
<template data-pop="d50-cancer" data-title="Carence martiale et cancer"><p>La carence, absolue ou fonctionnelle, est très fréquente chez le patient atteint de cancer ; elle aggrave la fatigue et la qualité de vie.</p><p class="lab">Diagnostic</p><p>La ferritine peut être élevée par la tumeur indépendamment des réserves ; la TSAT, le contenu en hémoglobine des réticulocytes et le rapport récepteur soluble sur logarithme de la ferritine aident.</p><p class="lab">Traitement selon le consensus suisse</p><p>Fer intraveineux chez le patient symptomatique, pour une correction plus rapide, et chez le patient sous agent stimulant l’érythropoïèse avec TSAT inférieure à 50 % ; fer oral possible en rémission sans inflammation. Arrêt si la ferritine dépasse 800 µg/L ; décision individuelle entre 500 et 800 µg/L.</p><p class="src">Référence : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019, section oncologique</a>.</p></template>
<template data-pop="d50-preop" data-title="Avant une chirurgie programmée"><p class="lab">Principe</p><p>Éviter une transfusion périopératoire améliore la morbidité. La gestion du sang du patient corrige donc l’anémie et remplit les réserves avant une intervention à risque hémorragique.</p><p class="lab">Conduite</p><p>Le consensus suisse indique le fer intraveineux chez le patient anémique qui doit subir une chirurgie à risque de saignement ; gynécologie suisse l’applique aux césariennes programmées à haut risque, comme le placenta prævia. Un consensus international de 2017, auquel ont participé des anesthésistes zurichois, a formalisé le diagnostic et la correction de l’anémie préopératoire.</p><div class="key"><b>Conséquence.</b> Le fer intraveineux relève l’Hb de façon significative en une semaine environ : l’anémie doit donc être dépistée assez tôt avant l’intervention.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27996086/" target="_blank" rel="noopener">Muñoz et al., Anaesthesia 2017</a>.</p></template>
