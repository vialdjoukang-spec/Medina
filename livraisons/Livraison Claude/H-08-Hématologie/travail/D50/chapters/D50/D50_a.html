<h1>Anémie par carence en fer</h1><span class="status">Adulte et adolescent · carence martiale avec et sans anémie · référentiels : consensus suisse Delphi 2019, gynécologie suisse 2022, OMS 2020 et 2024, BSG 2021, ESGE 2022 ; informations professionnelles suisses 2021 à 2026 · état au 09.10.2026 · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>

<section class="ilot" id="d50-0"><h2><span class="n">0</span>Question clinique</h2><p>Une femme de 58 ans, ménopausée depuis six ans, consulte pour une fatigue et un essoufflement à la montée des escaliers, apparus en quelques mois. L’hémoglobine (Hb) mesure 96 g/L, le volume globulaire moyen (VGM) 72 fl et la ferritine 6 µg/L. Trois chiffres suffisent au diagnostic d’anémie par carence en fer. <b>La question décisive commence ensuite : d’où vient la perte de fer chez une femme qui ne saigne plus chaque mois ?</b></p><p>L’organisme recycle et conserve presque tout son fer. Une carence signifie donc que le fer est perdu, mal absorbé ou consommé plus vite qu’il n’est apporté. Chez l’homme et chez la femme ménopausée, l’exploration digestive révèle une lésion potentiellement significative chez environ un tiers des patients, et un cancer dans 8 à 10 % des cas. Le traitement martial corrige l’anémie ; il ne dispense jamais de chercher la cause.</p><div class="key"><b>Point de départ.</b> <button class="w" data-k="d50-anemie-def">Seuils d’anémie de l’OMS 2024 (âge, sexe, grossesse, altitude)</button> ; <button class="w" data-k="d50-ferritine">la ferritine sérique (valeur, seuils et pièges)</button>.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">Snook et al., recommandations de la BSG sur l’anémie par carence en fer de l’adulte, Gut 2021</a>.</p></section>
<section class="ilot" id="d50-1"><h2><span class="n">1</span>Définitions et stades</h2><p>L’<b>anémie</b> se définit par une concentration d’hémoglobine inférieure au 5<sup>e</sup> percentile d’une population saine. L’OMS a révisé ses seuils en 2024 : moins de 130 g/L chez l’homme de 15 à 65 ans, moins de 120 g/L chez la femme non enceinte du même âge, moins de 110 g/L au premier et au troisième trimestre de la grossesse et moins de 105 g/L au deuxième. La même révision ajoute une correction pour l’altitude de résidence, utile en Suisse : 4 g/L entre 500 et 999 m, 8 g/L entre 1000 et 1499 m.</p><p>La <b>carence martiale</b> désigne des réserves de fer insuffisantes pour les besoins de l’organisme. Le consensus suisse Delphi de 2019 la retient, en l’absence d’inflammation, lorsque la ferritine est inférieure à 30 µg/L ; une ferritine de 30 à 50 µg/L avec une <button class="w" data-k="d50-tsat">saturation de la transferrine (TSAT) inférieure à 20 %</button> peut aussi l’indiquer. Le choix de ce seuil fait l’objet d’un <button class="w" data-k="d50-seuil">contentieux entre l’OMS, la Suisse et la BSG (fenêtre comparative)</button>.</p><p>La carence évolue en trois <button class="w" data-k="d50-stades">stades successifs (marqueurs de chaque étape)</button>, que le tableau relie à leurs anomalies biologiques.</p><table class="t"><tr><th>Stade</th><th>Ce qui manque</th><th>Anomalies</th></tr><tr><td>Carence sans retentissement</td><td>Réserves</td><td>Ferritine basse ; Hb, VGM et TCMH normaux</td></tr><tr><td>Érythropoïèse carencée</td><td>Fer livré à la moelle</td><td>Hématies hypochromes en hausse, TCMH et VGM qui baissent ; Hb encore normale</td></tr><tr><td>Anémie ferriprive</td><td>Fer de l’hémoglobine</td><td>Hb sous le seuil ; microcytose et hypochromie le plus souvent</td></tr></table><p>Le tableau se lit de haut en bas, comme l’histoire du patient : la ferritine baisse des mois avant l’hémoglobine. Une Hb normale n’exclut donc pas une carence. Il faut distinguer enfin la <b>carence absolue</b>, où les réserves sont vides, de la <button class="w" data-k="d50-fonctionnelle">carence fonctionnelle (fer présent mais séquestré)</button>, propre aux états inflammatoires.</p><div class="key"><b>À retenir.</b> Anémie et carence martiale sont deux diagnostics distincts : le premier se lit sur l’hémoglobine, le second sur la ferritine et la TSAT. La carence précède l’anémie et peut exister seule.</div><p class="src">Références : <a href="https://iris.who.int/handle/10665/376196" target="_blank" rel="noopener">OMS, seuils d’hémoglobine pour définir l’anémie, 2024, tableaux 2 à 4</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Nowak et al., étude Delphi suisse sur la carence martiale, Swiss Med Wkly 2019</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, carence martiale sans anémie, Swiss Med Wkly 2017</a>.</p></section>
<section class="ilot" id="d50-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>La carence martiale est la carence nutritionnelle la plus répandue dans les pays industrialisés. Sa fréquence dépend surtout de l’âge et des pertes menstruelles : 9 à 22 % des femmes en âge de procréer contre 1 à 2 % des hommes du même âge, puis 2,3 à 7 % des femmes ménopausées, selon la revue suisse de Clénin. Chez l’homme adulte et la femme ménopausée, l’anémie ferriprive atteint 2 à 5 % de la population ; chez la femme non ménopausée en bonne santé, 5 à 12 %.</p><p>Les données suisses sont fragmentaires mais concordantes. Une ferritine inférieure à 30 µg/L a été trouvée chez 16,8 % de jeunes recrues de l’armée ; chez des employées hospitalières en bonne santé, une ferritine inférieure à 15 µg/L concernait 33 % d’entre elles. Pendant la grossesse, jusqu’à 32 % des Suissesses ont une carence martiale et jusqu’à 10 % une anémie ferriprive ; environ un tiers des accouchées sont anémiques. Aucun registre national n’existe.</p><p>Le recours au fer est en revanche très élevé en Suisse. Entre 2012 et 2014, 9,4 % des assurés d’une grande caisse-maladie ont reçu du fer en trois ans, contre 4,4 % des patients britanniques, et le fer intraveineux y était environ mille fois plus fréquent. Ce contraste fonde le <button class="w" data-k="d50-surtraitement">risque de surtraitement signalé par les experts suisses</button>.</p><p>Le pronostic dépend de la cause, non du fer : une anémie qui persiste ou récidive malgré le traitement peut signaler une lésion méconnue. Après une exploration endoscopique négative et une bonne réponse au fer, l’anémie récidive pourtant chez 12 à 25 % des patients à moyen terme.</p><div class="key"><b>À retenir.</b> La carence est fréquente chez la femme jeune, plus rare mais plus inquiétante chez l’homme et la femme ménopausée. En Suisse, la prescription de fer, surtout intraveineux, dépasse largement celle des pays voisins.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14444" target="_blank" rel="noopener">Biétry et al., supplémentation en fer en Suisse, Swiss Med Wkly 2017</a> ; <a href="https://www.sggg.ch/fileadmin/user_upload/Dokumente/3_Fachinformationen/1_Expertenbriefe/DE/77_v2_Diagnostik_und_Therapie_der_Eisenmangelanaemie.pdf" target="_blank" rel="noopener">gynécologie suisse, avis d’experts n° 77, 24.08.2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a>.</p></section>
<section class="ilot" id="d50-3"><h2><span class="n">3</span>Du bilan martial négatif à l’anémie microcytaire</h2><p>L’adulte contient environ 4 g de fer s’il est un homme et 2,5 g s’il est une femme. Les deux tiers se trouvent dans l’hémoglobine, un cinquième en réserve sous forme de ferritine et d’hémosidérine, le reste dans la myoglobine et des enzymes. Le <button class="w" data-k="d50-bilan">bilan quotidien (pertes, apports, absorption)</button> est minuscule : l’homme perd environ 1 mg par jour, la femme réglée 2 mg, et l’intestin n’absorbe que 0,5 à 2 mg des 10 à 14 mg ingérés. Aucune voie n’élimine activement le fer en excès ; l’équilibre repose entièrement sur l’absorption.</p><p>Cette absorption est commandée par l’<button class="w" data-k="d50-hepcidine">hepcidine (hormone hépatique qui ferme la sortie du fer)</button>. Lorsque les réserves baissent, le foie en produit moins : la ferroportine des entérocytes et des macrophages reste active, l’absorption peut quadrupler et le fer recyclé est livré à la moelle. Tant que les apports suivent, l’équilibre tient.</p><p>Si les pertes dépassent durablement cette capacité, la carence s’installe pas à pas. Les réserves se vident d’abord, et la ferritine baisse. La moelle reçoit ensuite trop peu de fer : la protoporphyrine de zinc et le récepteur soluble de la transferrine augmentent, puis les érythroblastes produisent des hématies pauvres en hémoglobine, hypochromes et microcytaires. L’hémoglobine ne chute qu’en dernier.</p><p>Le fer ne sert pas qu’au transport de l’oxygène. Il entre dans la myoglobine et dans les enzymes de la chaîne respiratoire mitochondriale. Chez l’animal, la carence sans anémie réduit déjà le nombre de mitochondries et l’activité de ces enzymes : c’est la base des <button class="w" data-k="d50-tissus">symptômes tissulaires (fatigue, jambes sans repos, phanères)</button> qui précèdent l’anémie.</p><div class="key"><b>Conséquence pratique.</b> Une carence ferriprive est d’abord un problème de bilan : le fer donné compense les pertes, mais seule la suppression de la perte empêche la récidive.</div><p class="src">Références : <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017, figure 1 et métabolisme du fer</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26289639/" target="_blank" rel="noopener">Moretti et al., Blood 2015</a>.</p></section>
<section class="ilot" id="d50-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>L’hémoglobine contient 0,34 % de fer : un millilitre de sang à 150 g/L d’hémoglobine en renferme donc environ 0,5 mg. Une perte sanguine chronique minime suffit ainsi à épuiser les réserves. Le médecin classe les causes selon le mécanisme, car chacun appelle une exploration différente. La carence est souvent multifactorielle, surtout chez le sujet âgé.</p><table class="t"><tr><th>Mécanisme</th><th>Causes principales</th><th>Ce qu’elles commandent</th></tr><tr><td>Pertes sanguines digestives</td><td><button class="w" data-k="d50-digestif">Cancer colorectal ou œso-gastrique, ulcère, angiodysplasies, maladie inflammatoire chronique de l’intestin (MICI)</button></td><td>Endoscopies haute et basse chez l’homme et la femme ménopausée</td></tr><tr><td>Pertes gynécologiques</td><td><button class="w" data-k="d50-menorragies">Ménorragies</button>, grossesses rapprochées</td><td>Quantifier les règles ; avis gynécologique si saignement anormal</td></tr><tr><td>Autres pertes</td><td>Hématurie (cancer du rein), épistaxis répétées, dons de sang, <button class="w" data-k="d50-osler">télangiectasie hémorragique héréditaire</button></td><td>Analyse d’urine chez tous ; anamnèse ciblée</td></tr><tr><td>Malabsorption</td><td><button class="w" data-k="d50-coeliaque">Maladie cœliaque</button>, <button class="w" data-k="d50-gastrite">gastrite atrophique, infection à Helicobacter pylori, inhibiteurs de la pompe à protons</button>, <button class="w" data-k="d50-bariatrique">chirurgie gastrique ou bariatrique</button></td><td>Sérologie cœliaque chez tous</td></tr><tr><td>Apports ou besoins</td><td>Alimentation végétarienne ou végétalienne, troubles alimentaires, grossesse, croissance, <button class="w" data-k="d50-sport">sport d’endurance</button></td><td>Conseil diététique ; ne pas conclure trop vite</td></tr><tr><td>Médicaments</td><td>Anti-inflammatoires non stéroïdiens (AINS), antiagrégants, anticoagulants</td><td>Ne dispensent pas d’explorer</td></tr><tr><td>Génétique (rare)</td><td><button class="w" data-k="d50-irida">Anémie ferriprive réfractaire au fer par variants de TMPRSS6</button></td><td>Évoquée devant un échec du fer oral sans cause</td></tr></table><p>La dernière colonne protège contre l’erreur la plus fréquente : s’arrêter à une cause plausible. Un homme de 72 ans sous anticoagulant, qui saigne parfois des gencives, garde l’indication d’une coloscopie ; l’anticoagulant révèle une lésion plus qu’il ne l’explique. Chez la jeune femme aux règles abondantes, en revanche, la cause menstruelle suffit le plus souvent, après dépistage de la maladie cœliaque.</p><div class="key"><b>À retenir.</b> Toute carence martiale impose une recherche de la perte ou de la malabsorption. Une cause évidente n’exclut pas une seconde cause, surtout après 50 ans.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, tableau 1</a> ; <a href="https://doi.org/10.4414/smw.2017.14434" target="_blank" rel="noopener">Clénin, Swiss Med Wkly 2017</a>.</p></section>
<section class="ilot" id="d50-5"><h2><span class="n">5</span>Interroger pour trouver la perte</h2><p>Les symptômes relèvent de deux mécanismes. L’anémie réduit le transport de l’oxygène : dyspnée d’effort, tachycardie, céphalées, vertiges orthostatiques et, chez l’insuffisant cardiaque, décompensation. Comme elle s’installe lentement, la plupart des patients s’y adaptent et consultent tard. La carence tissulaire, elle, donne une <button class="w" data-k="d50-fatigue">fatigue (valeur et limites du symptôme)</button>, un <button class="w" data-k="d50-jambes">syndrome des jambes sans repos</button>, une chute de cheveux, des troubles de la concentration et parfois un <button class="w" data-k="d50-pica">pica ou une pagophagie</button>.</p><p>L’anamnèse étiologique est la partie la plus rentable de la consultation. Le médecin quantifie les règles (durée, protections, caillots), recherche un méléna, des rectorragies, une modification du transit, un amaigrissement, une hématurie, des épistaxis et des dons de sang. Il fait l’inventaire des médicaments (AINS, acide acétylsalicylique, anticoagulants, inhibiteurs de la pompe à protons), du régime alimentaire, d’une chirurgie digestive et des antécédents familiaux de cancer colorectal ou de maladie cœliaque.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Femme de 32 ans, règles abondantes, fatigue et essoufflement d’effort ; Hb 104 g/L, VGM 76 fl, ferritine 5 µg/L. La cause menstruelle est probable ; la sérologie cœliaque reste indiquée.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Homme de 66 ans sans aucun symptôme digestif, découverte fortuite d’une Hb à 118 g/L ; sportive d’endurance fatiguée à Hb normale ; patient de 45 ans dont l’anémie ne répond pas au fer oral, révélant une maladie cœliaque.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> L’absence de symptôme digestif ne rassure pas : les symptômes abdominaux ne prédisent ni la présence ni le siège d’une lésion chez le patient atteint d’anémie ferriprive.</div><div class="key"><b>À retenir.</b> L’interrogatoire date les symptômes, quantifie les pertes visibles et dresse l’inventaire des causes invisibles ; il prépare la décision d’explorer.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021, anamnèse et examen</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p></section>
<section class="ilot" id="d50-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen évalue d’abord la tolérance : fréquence cardiaque, pression artérielle, fréquence respiratoire et signes d’insuffisance cardiaque. Une dyspnée de repos, une tachycardie ou une hypotension changent la priorité, car elles signalent une anémie sévère mal compensée ou un saignement actif. Le poids et son évolution complètent l’évaluation ; un amaigrissement oriente vers une cause organique.</p><div class="two"><div class="card"><h4>Signes de l’anémie</h4><p>Tachycardie, hypotension, dyspnée ; dans les formes sévères, instabilité hémodynamique. Une anémie modérée et ancienne peut n’en donner aucun.</p></div><div class="card"><h4>Signes de la carence</h4><p><button class="w" data-k="d50-phaneres">Koilonychie, chéilite angulaire, glossite atrophique, sclérotiques bleues (mécanisme et valeur)</button>. Ils sont tardifs et inconstants.</p></div></div><p>L’examen cherche ensuite la cause. Le médecin inspecte les lèvres, la langue, la muqueuse buccale et les doigts à la recherche de télangiectasies, qui peuvent à elles seules donner le diagnostic de télangiectasie hémorragique héréditaire. L’examen est le plus souvent normal ; il n’exclut jamais une lésion digestive.</p><div class="key"><b>À retenir.</b> L’examen mesure la tolérance et décide de l’urgence ; il découvre rarement la cause, mais une télangiectasie ou un amaigrissement orientent l’exploration.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8515119/" target="_blank" rel="noopener">BSG 2021</a> ; <a href="https://doi.org/10.4414/smw.2019.20097" target="_blank" rel="noopener">Delphi suisse 2019</a>.</p><button class="pareto-btn ui" data-k="pareto-d50-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
