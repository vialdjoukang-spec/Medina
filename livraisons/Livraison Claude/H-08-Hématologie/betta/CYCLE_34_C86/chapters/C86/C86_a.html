<section class="ilot" id="c86-0"><h2><span class="n">0</span>Question clinique et objectifs</h2>
<p>Le code C86 ne désigne pas une maladie, mais une famille de sept lymphomes à cellules <button class="w" data-k="c86-famille">T matures ou NK (définition, évolution naturelle et logique du regroupement)</button>. Ces sept maladies ont des sièges, des mécanismes, des traitements et des pronostics très différents : la survie spécifique à cinq ans va de 99 % pour la papulose lymphomatoïde à moins de 20 % pour les lymphomes T gamma-delta et NK/T. Pour le médecin, la difficulté n’est donc pas d’apprendre un traitement, mais de reconnaître laquelle des sept maladies se présente, et de ne pas appliquer à l’une la conduite de l’autre.</p>
<p>Trois situations cliniques servent de fil conducteur. Elles sont des vignettes pédagogiques, construites à partir des recommandations lues, et non des observations de patients.</p>
<div class="two"><div class="card"><h4>Vignette 1 — le nez</h4><p>Un homme de 45 ans présente une obstruction nasale unilatérale, des épistaxis et une ulcération nécrotique du palais. Il faut évoquer un <b>lymphome extranodal NK/T (C86.0)</b>, obtenir une biopsie profonde avec recherche d’<button class="w" data-k="c86-ebv">EBV par EBER (virus d’Epstein-Barr : latence, marqueur plasmatique)</button>, doser l’ADN d’EBV dans le plasma, faire une <button class="w" data-k="c86-tep">TEP-TDM (bilan d’extension et réponse)</button> et une IRM du massif facial. Le traitement associe une radiothérapie d’au moins 50 Gy et une chimiothérapie <b>sans anthracycline</b>, <b>contenant de l’asparaginase</b>.</p></div><div class="card"><h4>Vignette 2 — la rate</h4><p>Un homme de 25 ans, traité pour une maladie de Crohn par thiopurine et anti-TNF, présente fièvre, splénomégalie, hépatomégalie et thrombopénie, <b>sans adénopathie</b>. Il faut évoquer un <b>lymphome T hépatosplénique (C86.1)</b> et faire une biopsie ostéomédullaire, car l’atteinte médullaire y est presque constante (<button class="w" data-k="c86-hstl">fiche du lymphome T hépatosplénique</button>).</p></div></div>
<div class="card"><h4>Vignette 3 — la peau</h4><p>Un patient présente des papules récidivantes qui <b>régressent spontanément</b> en quelques semaines. Il faut évoquer une <b>papulose lymphomatoïde (C86.6)</b> : la maladie a un pronostic excellent et ne doit pas être traitée par polychimiothérapie (<button class="w" data-k="c86-cd30">fiche des proliférations cutanées CD30 positives</button>).</p></div>
<p>À la fin du cours, l’étudiant sait : (1) associer chaque sous-code à sa maladie et à son siège ; (2) choisir la biopsie et le bilan d’extension adaptés ; (3) reconnaître les trois urgences de la famille, qui sont le syndrome d’activation lymphohistiocytaire, la perforation intestinale et la toxicité des traitements ciblés ; (4) expliquer pourquoi l’ENKTL ne se traite pas comme les autres lymphomes T, et pourquoi la papulose lymphomatoïde ne se traite pas du tout par chimiothérapie lourde ; (5) citer le statut suisse des médicaments cités et les lacunes de la documentation.</p>
<div class="key"><b>À retenir.</b> Un seul code, sept maladies. La première question n’est jamais « quel schéma ? », mais « laquelle des sept ? ». Le siège de la lésion, la présence d’EBV, le contexte d’immunosuppression et le caractère spontanément résolutif d’une lésion cutanée orientent presque toujours la réponse avant l’histologie.</div>
</section>

<section class="ilot" id="c86-1"><h2><span class="n">1</span>Définition, famille et classifications</h2>
<p>Les lymphomes T périphériques, ou <button class="w" data-k="c86-famille">PTCL (tronc commun de la famille)</button>, sont des lymphomes agressifs dont les cellules ont le phénotype de lymphocytes T post-thymiques matures ou de cellules NK. Ils peuvent être nodaux ou extranodaux. Pour la plupart des entités, le traitement systémique de première ligne a une intention curative, et la maladie progresse rapidement sans traitement. Les exceptions sont la papulose lymphomatoïde, le mycosis fongoïde, la leucémie à grands lymphocytes granuleux T et les formes indolentes (Onkopedia 2025).</p>
<p>Les classifications actuellement en vigueur sont la <b>5e édition de la classification de l’OMS</b> (2022) et la <b>classification consensuelle internationale ICC 2022</b>, largement superposables. Pour les lymphomes cutanés, la référence est la mise à jour 2018 de la classification OMS-EORTC. Le tableau suivant relie chaque sous-code de la CIM-10-GM 2024 à la maladie que la nomenclature actuelle désigne. Il est utile parce que les intitulés du code et ceux des classifications ne coïncident pas toujours : la lecture d’un compte rendu d’anatomopathologie moderne suppose de faire la correspondance.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Intitulé CIM-10-GM 2024 (OFS)</th><th>Entité dans la nomenclature actuelle</th><th>Remarque</th></tr></thead><tbody>
<tr><td>C86.0</td><td>Lymphome extranodal à cellules T/NK, type nasal</td><td><button class="w" data-k="c86-enktl">Lymphome extranodal NK/T (ENKTL)</button></td><td>L’OMS 5e édition abandonne le qualificatif « type nasal » : la maladie touche aussi d’autres sites extranodaux.</td></tr>
<tr><td>C86.1</td><td>Lymphome hépatosplénique à cellules T</td><td><button class="w" data-k="c86-hstl">Lymphome T hépatosplénique (HSTL)</button></td><td>Le code inclut les types alpha/bêta et gamma/delta.</td></tr>
<tr><td>C86.2</td><td>Lymphome à cellules T de type entéropathique</td><td><button class="w" data-k="c86-eatl">Lymphome T associé à une entéropathie (EATL)</button></td><td>Le lymphome T intestinal épithéliotrope monomorphe (MEITL) est une entité séparée, sans lien avec la maladie cœliaque.</td></tr>
<tr><td>C86.3</td><td>Lymphome sous-cutané à cellules T de type panniculite</td><td><button class="w" data-k="c86-sptcl">Lymphome T sous-cutané de type panniculite (SPTCL)</button></td><td>Réservé au phénotype alpha/bêta ; la forme gamma/delta est un autre lymphome, de pronostic très différent.</td></tr>
<tr><td>C86.4</td><td>Lymphome blastique à cellules NK</td><td><button class="w" data-k="c86-bpdcn">Néoplasme blastique à cellules dendritiques plasmacytoïdes (BPDCN)</button></td><td>Héritage nosologique : l’entité dérive des cellules dendritiques plasmacytoïdes et non des cellules NK.</td></tr>
<tr><td>C86.5</td><td>Lymphome angio-immunoblastique à cellules T</td><td><button class="w" data-k="c86-ntfh">Lymphome T folliculaire helper nodal, type angio-immunoblastique (nTFHL-AI)</button></td><td>Nouveau nom de l’ancien lymphome angio-immunoblastique (AITL) dans l’OMS 5e édition.</td></tr>
<tr><td>C86.6</td><td>Syndrome lymphoprolifératif cutané primitif à cellules T, CD30 positif</td><td><button class="w" data-k="c86-cd30">Papulose lymphomatoïde (LyP) et lymphome anaplasique à grandes cellules cutané primitif (pcALCL)</button></td><td>Entités inchangées dans l’OMS 5e édition.</td></tr></tbody></table>
<p>Ce tableau appelle trois commentaires. Premièrement, le code C86.4 est un héritage : depuis l’OMS 2016, le néoplasme blastique à cellules dendritiques plasmacytoïdes est une entité propre, classée avec les néoplasmes myéloïdes et les leucémies aiguës, et non parmi les lymphomes NK (<button class="w" data-k="c86-classif">classification et correspondances détaillées</button>). Deuxièmement, la CIM-10-GM exclut du code C86 le lymphome anaplasique à grandes cellules systémique, qu’il soit ALK positif (C84.6) ou ALK négatif (C84.7) ; le code C84.5 (autres lymphomes T/NK matures) exclut à son tour toutes les entités C86.0 à C86.6. Troisièmement, le lymphome anaplasique à grandes cellules cutané primitif, lui, appartient à C86.6 : c’est la présence ou l’absence d’une atteinte systémique qui décide du code.</p>
<div class="trap"><span class="k">Piège</span> Un lymphome anaplasique à grandes cellules n’a pas un code unique. Cutané primitif, il relève de C86.6 ; systémique, il relève de C84.6 ou C84.7. Une expression d’ALK sur une lésion cutanée doit faire rechercher un lymphome systémique ALK positif avec atteinte cutanée secondaire.</div>
<div class="trap"><span class="k">Erreur fréquente</span> Parler de « lymphome NK » pour le code C86.4. Les cellules de cette maladie ne sont pas des cellules NK ; l’intitulé du code est historique.</div>
</section>

<section class="ilot" id="c86-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>En Suisse, les lymphomes T représentent environ 10 à 15 % des nouveaux lymphomes diagnostiqués chaque année (données du registre NICER citées par la revue suisse d’oncologie SZO 2021). L’âge médian se situe entre la sixième et la septième décennie, avec une légère prédominance masculine, et la fréquence augmente en cas de maladie auto-immune ou d’immunosuppression prolongée. En Europe, les lymphomes T périphériques forment 10 à 15 % des lymphomes non hodgkiniens, avec une incidence globale inférieure à 1 pour 100 000 habitants et un rapport hommes/femmes de 1,7 pour 1 ; les sous-types les plus fréquents sont le lymphome T folliculaire helper nodal, le lymphome T périphérique sans autre spécification (PTCL-NOS) et le lymphome anaplasique à grandes cellules (Onkopedia 2025).</p>
<p>Le tableau suivant donne, pour chaque maladie, les chiffres que les sources lues permettent de citer. Il ne remplace pas des données suisses par sous-code : <b>aucun chiffre suisse par sous-code C86.x n’a été trouvé</b>, ce qui est une lacune de la documentation et non une preuve de rareté.</p>
<table class="t"><thead><tr><th>Entité</th><th>Données épidémiologiques</th><th>Source</th></tr></thead><tbody>
<tr><td>ENKTL (C86.0)</td><td>Prédominance asiatique et sud-américaine ; cas occidentaux de plus en plus rapportés. Forme nasale environ 80 %, forme non nasale 15 à 20 % (peau, tube digestif, testicule, glandes salivaires), forme leucémique agressive moins de 5 %.</td><td>Tse 2022</td></tr>
<tr><td>HSTL (C86.1)</td><td>Moins de 1 % des lymphomes. Environ 30 % surviennent sur une immunosuppression chronique ; âge médian de 40 à 60 ans ; 49 % des patients ont moins de 60 ans dans une série récente. Risque maximal chez l’homme de moins de 35 ans atteint de maladie de Crohn.</td><td>Carvão 2019 ; Onkopedia 2025 ; OMS 2022</td></tr>
<tr><td>EATL (C86.2)</td><td>80 à 90 % naissent d’une maladie cœliaque réfractaire ; risque relatif accru de 10 à 20 fois.</td><td>Onkopedia 2025</td></tr>
<tr><td>Lymphomes cutanés (C86.3, C86.6)</td><td>Registres néerlandais et autrichien 2002–2017 : papulose lymphomatoïde 12 % des lymphomes cutanés, lymphome anaplasique cutané primitif 8 %, SPTCL 1 %, NK/T extranodal moins de 1 %. Les proliférations CD30 positives forment le deuxième groupe de lymphomes T cutanés (environ 25 %).</td><td>OMS-EORTC 2018</td></tr>
<tr><td>BPDCN (C86.4)</td><td>Environ 0,44 % des hémopathies malignes ; rapport hommes/femmes d’environ 3 pour 1 ; surtout septième décennie, pics bimodaux au-delà de 60 ans et avant 20 ans.</td><td>Nguyen 2023</td></tr></tbody></table>
<p><b>Un exemple chiffré.</b> Dans la maladie de Crohn, le risque absolu de lymphome hépatosplénique est estimé à 1 pour 7404 sous thiopurine seule et à 1 pour 3534 sous l’association d’une thiopurine et d’un anti-TNF (Carvão 2019). Le rapport 7404 ÷ 3534 vaut environ 2,1 : l’association double à peu près le risque. En valeur absolue, 1 pour 3534 correspond à 0,028 %, soit environ trois patients sur dix mille. Le risque est donc faible pour un patient donné, mais il est suffisamment concentré chez le jeune homme exposé au long cours pour modifier la stratégie thérapeutique (<button class="w" data-k="c86-thiopurine">risque et prévention dans la maladie inflammatoire de l’intestin</button>).</p>
<div class="key"><b>À retenir.</b> Les lymphomes T sont rares (10 à 15 % des lymphomes en Suisse) et chaque sous-code l’est davantage. Quatre contextes concentrent le risque : l’origine asiatique ou sud-américaine pour l’ENKTL, l’immunosuppression pour le HSTL, la maladie cœliaque réfractaire pour l’EATL, l’âge de 60 à 70 ans pour l’ensemble de la famille.</div>
<button class="pareto-btn ui" data-k="pareto-c86-definition">▲ Loi de Pareto — Définition, classifications et épidémiologie</button>
</section>

<section class="ilot" id="c86-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Comprendre ces lymphomes suppose de partir de la cellule normale. Un lymphocyte T mature quitte le thymus et circule ; son récepteur, le <button class="w" data-k="c86-tcr">TCR (récepteur T : réarrangement et clonalité)</button>, est réarrangé et propre à chaque clone. Une cellule NK n’a pas ce réarrangement ; elle porte CD56 et des granules cytotoxiques contenant de la perforine, du granzyme B et la protéine TIA1. Les lymphocytes T folliculaires helper, ou TFH, expriment CD10, BCL6, PD1, ICOS et CXCL13 (Tse 2022 ; Onkopedia 2025). Chaque lymphome conserve les marqueurs de sa cellule d’origine, et c’est ce qui permet de le reconnaître. Le tableau suivant résume la chaîne « cellule normale → anomalie → conséquence clinique » pour chacune des sept maladies.</p>
<table class="t"><thead><tr><th>Entité</th><th>Anomalie centrale</th><th>Conséquence clinique ou thérapeutique</th></tr></thead><tbody>
<tr><td>ENKTL</td><td>Virus d’Epstein-Barr présent dans pratiquement toutes les cellules tumorales (latence II, oncoprotéine LMP1) ; forte expression de la glycoprotéine P ; faible activité de l’asparagine synthétase.</td><td>ADN d’EBV plasmatique = marqueur de masse tumorale ; inefficacité des anthracyclines ; sensibilité à l’asparaginase (<button class="w" data-k="c86-pgp">glycoprotéine P et asparagine synthétase</button>).</td></tr>
<tr><td>HSTL</td><td>Stimulation antigénique chronique et immunosuppression ; isochromosome 7q, anomalies des chromosomes 8 et 13.</td><td>Atteinte de la rate, du foie et de la moelle, sans adénopathie.</td></tr>
<tr><td>EATL</td><td>Maladie cœliaque, puis maladie cœliaque réfractaire de type II (lymphocytes intraépithéliaux aberrants), puis lymphome ; mutations JAK1 et STAT3, gains 9q34.</td><td>Atteinte de l’intestin grêle, risque de perforation (<button class="w" data-k="c86-rcd">de la maladie cœliaque au lymphome</button>).</td></tr>
<tr><td>SPTCL</td><td>Perte de fonction germinale de HAVCR2 (TIM-3) dans environ 60 % des cas.</td><td>Activation immunitaire persistante, cytokines accrues, risque de syndrome d’activation lymphohistiocytaire (<button class="w" data-k="c86-havcr2">HAVCR2 et TIM-3</button>).</td></tr>
<tr><td>BPDCN</td><td>Prolifération de précurseurs de cellules dendritiques plasmacytoïdes.</td><td>Atteinte cutanée fréquente, cytopénies en cas d’atteinte médullaire.</td></tr>
<tr><td>nTFHL-AI</td><td>Mutations par étapes : TET2 et DNMT3A précoces dans la cellule souche, puis RHOA G17V et IDH2 R172 dans la cellule TFH tumorale.</td><td>Hypergammaglobulinémie polyclonale, anémie hémolytique à Coombs positif, proliférations B EBV positives (<button class="w" data-k="c86-tfh">mutations par étapes et phénotype TFH</button>).</td></tr>
<tr><td>Proliférations CD30 positives cutanées</td><td>Réarrangement DUSP22-IRF4 dans environ 25 % des pcALCL ; pas de translocation ALK dans la majorité des cas.</td><td>Lésions autorésolutives (LyP) ou nodules solitaires (pcALCL), pronostic favorable.</td></tr></tbody></table>
<p>Le tableau montre que le même mot, « lymphome T », recouvre trois logiques distinctes. La première est virale et chimiorésistante (ENKTL) : l’EBV transforme une cellule NK qui exprime la glycoprotéine P, ce qui explique à la fois le marqueur plasmatique et l’échec de la chimiothérapie classique. La deuxième est une stimulation immunitaire chronique ou une immunosuppression (HSTL, EATL, SPTCL) : la stimulation antigénique, la maladie cœliaque réfractaire ou l’activation persistante liée à TIM-3 accompagnent l’émergence du clone. La troisième est l’accumulation de mutations épigénétiques et de signalisation (nTFHL-AI), dont les premières surviennent dans la cellule souche hématopoïétique elle-même. Cette logique commande ensuite le bilan (à la recherche d’EBV, d’une entéropathie ou d’un contexte d’immunosuppression) et le traitement.</p>
<div class="key"><b>Science → clinique.</b> L’ADN d’EBV mesure la charge tumorale de l’ENKTL parce que les cellules en apoptose libèrent du virus dans le plasma ; la glycoprotéine P explique l’échec du CHOP ; la perte de TIM-3 explique le risque de syndrome d’activation lymphohistiocytaire du SPTCL. Chaque mécanisme se retrouve dans une décision clinique : bilan, choix du schéma, surveillance.</div>
</section>

<section class="ilot" id="c86-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les sources lues décrivent des contextes qui augmentent le risque, que le médecin recherche à l’anamnèse parce qu’ils orientent vers une entité et, pour certains, permettent une prévention.</p>
<table class="t"><thead><tr><th>Entité</th><th>Facteur ou contexte</th><th>Lien décrit dans les sources</th></tr></thead><tbody>
<tr><td>Famille entière</td><td>Maladie auto-immune, immunosuppression prolongée</td><td>Fréquence accrue des lymphomes T (revue SZO 2021).</td></tr>
<tr><td>ENKTL</td><td>EBV ; origine asiatique ou sud-américaine</td><td>Virus présent dans les cellules tumorales ; incidence la plus élevée en Asie.</td></tr>
<tr><td>HSTL</td><td>Thiopurine seule ou associée à un anti-TNF, surtout chez l’homme de moins de 35 ans atteint de maladie de Crohn et traité par thiopurine et anti-TNF depuis au moins deux ans ; immunosuppression préexistante, souvent iatrogène, dans environ 20 % des cas (Onkopedia)</td><td>Risque absolu estimé 1/7404 sous thiopurine seule, 1/3534 sous association.</td></tr>
<tr><td>EATL</td><td>Maladie cœliaque réfractaire de type II ; homozygotie HLA-DQ2 (44 à 60 % des patients)</td><td>80 à 90 % des EATL naissent d’une maladie cœliaque réfractaire.</td></tr>
<tr><td>SPTCL</td><td>Variants germinaux de perte de fonction de HAVCR2</td><td>Environ 60 % des cas ; p.Ile97Met chez les patients d’ascendance européenne, p.Tyr82Cys en Asie de l’Est.</td></tr>
<tr><td>nTFHL-AI</td><td>Hématopoïèse clonale (TET2, DNMT3A)</td><td>Mutations précoces dans la cellule souche hématopoïétique.</td></tr>
<tr><td>Hors C86 (rappel)</td><td>Implant mammaire</td><td>Lymphome anaplasique à grandes cellules associé à l’implant (BIA-ALCL), autre entité.</td></tr></tbody></table>
<p>Ces associations sont des liens de risque et non des preuves de causalité individuelle : la majorité des patients sous thiopurine ne développent pas de lymphome, comme le montre le risque absolu de 0,028 % calculé plus haut. Le contexte oriente le diagnostic ; il ne le remplace pas. Ainsi, une maladie de Crohn traitée par thiopurine fait évoquer un lymphome hépatosplénique devant une fièvre avec splénomégalie sans adénopathie, mais la même fièvre peut avoir d’autres causes que l’histologie et le bilan permettent de départager.</p>
<div class="key"><b>À retenir.</b> Un seul facteur est modifiable par le médecin : l’exposition prolongée à l’association thiopurine plus anti-TNF chez le jeune homme atteint de maladie de Crohn. Les recommandations citées proposent de la limiter à deux ans.</div>
<button class="pareto-btn ui" data-k="pareto-c86-mecanismes">▲ Loi de Pareto — Physiopathologie et facteurs de risque</button>
</section>

<section class="ilot" id="c86-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche trois informations : le contexte de risque (voir section 4), le siège des symptômes et le mode évolutif. Pour tous les lymphomes T périphériques, le tableau commun associe des adénopathies indolores progressives ou des atteintes extranodales (tube digestif, sphère ORL, peau), des <b>symptômes B</b> typiques et des infections, parfois opportunistes. (Onkopedia 2025). Le tableau commun est peu spécifique ; ce sont les signes de siège qui distinguent les entités.</p>
<div class="two"><div class="card"><h4>Signes d’orientation par siège</h4><p><b>Nez et voies aérodigestives supérieures</b> : obstruction nasale, épistaxis, destruction médiane du palais dur (ancien « granulome malin centrofacial ») → ENKTL.</p><p><b>Fièvre, asthénie sans adénopathie</b> : symptômes généraux chez 73 % des patients dans la série de Carvão, avec anémie, thrombopénie, leucopénie → HSTL.</p><p><b>Maladie cœliaque réfractaire connue</b> et douleur abdominale ou signes de perforation → EATL.</p></div><div class="card"><h4>Signes cutanés</h4><p><b>Nodules sous-cutanés</b>, généralement confinés à l’hypoderme → SPTCL ; un syndrome d’activation lymphohistiocytaire complique 17 % des SPTCL alpha/bêta.</p><p><b>Papules ou nodules récidivants qui disparaissent seuls</b> en semaines à mois → papulose lymphomatoïde.</p><p><b>Nodule ou tumeur solitaire</b>, parfois ulcérée → pcALCL.</p><p><b>Plaques ou nodules érythémateux à violacés</b> du tronc, des membres ou du visage → BPDCN.</p></div></div>
<p>Les symptômes de la forme hématologique correspondent à la physiopathologie : la fatigue et la pâleur traduisent l’anémie, les saignements la thrombopénie, les infections la leucopénie. Dans le lymphome T folliculaire helper, l’hypergammaglobulinémie polyclonale et l’anémie hémolytique auto-immune sont des éléments cliniques ou biologiques d’appel. L’anamnèse recherche enfin la chronologie des lésions cutanées : la récidive avec résolution spontanée de chaque lésion distingue la papulose lymphomatoïde d’un lymphome qui progresse. Le médecin note donc la date d’apparition et celle de régression de chaque lésion.</p>
<div class="trap"><span class="k">Piège</span> Un tableau de fièvre prolongée avec splénomégalie chez un patient sous immunosuppresseur n’est pas forcément infectieux. L’absence d’adénopathie ne rend pas le lymphome improbable : elle est au contraire typique du lymphome hépatosplénique.</div>
</section>

<section class="ilot" id="c86-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel de l’état général aux signes ciblés. Il vise à rechercher les <b>sites biopsiables</b> et la <b>gravité</b>. Chaque signe est relié au diagnostic qu’il évoque.</p>
<div class="two"><div class="card"><h4>État général et signes systémiques</h4><p>Fièvre, amaigrissement, sueurs nocturnes : symptômes B. Le score ECOG de 2 à 4 est un critère de l’index pronostique international.</p><p>Hépatomégalie et splénomégalie (splénomégalie chez 11 patients sur 11 et hépatomégalie chez 7 sur 11 dans la revue de cas de Carvão 2019) : HSTL. Absence d’adénopathie palpable : fréquente dans cette entité.</p><p>Pâleur, pétéchies, ecchymoses : anémie et thrombopénie.</p></div><div class="card"><h4>Examen de siège</h4><p><b>Cavité buccale et nasale</b> : ulcération nécrotique, perforation du palais dur → ENKTL.</p><p><b>Peau</b> : papules papulonécrotiques à des stades différents (LyP) ; nodule ulcéré solitaire ou groupé (pcALCL) ; nodules sous-cutanés profonds (SPTCL) ; plaque violacée jusqu’à 10 cm (BPDCN).</p><p><b>Aires ganglionnaires</b> : adénopathie indolore (nTFHL-AI) ; toute adénopathie de plus de 1,5 cm chez un patient atteint de pcALCL est biopsiée.</p></div></div>
<p>La valeur de chaque signe dépend de sa spécificité. Une ulcération du palais n’est pas propre à l’ENKTL : elle impose la biopsie parce que le diagnostic repose sur la recherche d’EBV dans le tissu. De même, une lésion cutanée suspecte n’est pas jugée à l’aspect seul : la LyP simule le pcALCL, le mycosis fongoïde tumoral ou le lymphome de Hodgkin classique, et la biopsie cutanée est interprétée avec l’évolution clinique (<button class="w" data-k="c86-diffdx">diagnostics différentiels cutanés, types A à E de la LyP</button>).</p>
<div class="key"><b>À retenir.</b> L’examen clinique de ces lymphomes cherche d’abord un site biopsiable, ensuite la gravité (cytopénies, hépatosplénomégalie, perforation). Une lésion cutanée qui disparaît seule est un renseignement diagnostique majeur.</div>
