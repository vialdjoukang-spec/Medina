<section class="ilot" id="c94-0"><h2><span class="n">0</span>Question clinique</h2>
<p>La catégorie <b>C94</b> de la classification des maladies ne décrit pas une seule maladie. Elle réunit des hémopathies rares et hétérogènes que le code regroupe parce qu’elles ne trouvent pas leur place ailleurs dans les leucémies. Le cours apprend à reconnaître chaque entité par son profil clinique, à choisir l’examen qui la confirme et à éviter un piège de codage. Toutes relèvent d’un centre d’hématologie.</p>
<p>Cinq tableaux cliniques guident la leçon. Un adulte âgé avec une pancytopénie et un excès de blastes érythroïdes, souvent porteur d’une mutation de <button class="w" data-k="c94-tp53">TP53 (gène suppresseur de tumeur)</button>, évoque une <button class="w" data-k="c94-lae">leucémie aiguë érythroïde (définition et pronostic)</button>. Un enfant atteint de trisomie 21 dont les blastes expriment les glycoprotéines plaquettaires CD41 et CD61 évoque une <button class="w" data-k="c94-lamk">leucémie aiguë mégacaryoblastique (définition et groupes)</button>, liée à une mutation de <button class="w" data-k="c94-gata1">GATA1 (facteur de transcription)</button>. Une tryptase très élevée, au moins 20 % de mastocytes sur l’aspiration de moelle et des atteintes d’organe évoquent une <button class="w" data-k="c94-mcl">leucémie à mastocytes (critères)</button>. Une moelle « sèche » à la ponction, fibrotique, avec au moins 20 % de blastes, évoque une <button class="w" data-k="c94-apmf">panmyélose aiguë avec myélofibrose (ponction blanche)</button>. Enfin, un patient suivi pour une leucémie myéloïde chronique qui perd sa réponse et présente au moins 20 % de blastes est en <button class="w" data-k="c94-lmc">crise blastique de leucémie myéloïde chronique (définitions OMS, ICC, ELN)</button>.</p>
<div class="key"><b>À retenir.</b> Ces entités se reconnaissent par un détail clinique ou cytologique précis, non par un syndrome commun. La conduite associe presque toujours un traitement de leucémie aiguë, une orientation vers une greffe allogénique et la prise en charge des complications propres à chaque entité.</div>
</section>
<section class="ilot" id="c94-1"><h2><span class="n">1</span>Définition, classifications et codage</h2>
<p>Une leucémie aiguë myéloïde, ou <button class="w" data-k="c94-seuil">LAM (seuil de 20 % de blastes et classifications)</button>, est une prolifération clonale de cellules myéloïdes immatures, les blastes. L’<b>Organisation mondiale de la santé</b> (OMS, 5e édition 2022) et l’<b>International Consensus Classification</b> (ICC 2022) en fixent les seuils. Le seuil de 20 % de blastes sépare toujours le syndrome myélodysplasique de la LAM. La plupart des LAM définies par une anomalie génétique n’exigent plus de seuil, sauf celles porteuses de BCR::ABL1 ou de CEBPA, qui demandent au moins 20 %. Les LAM définies par la différenciation exigent en général au moins 20 % de blastes, <b>à l’exception de la leucémie aiguë érythroïde</b>. L’ICC 2022 retient au moins 10 % de blastes pour les anomalies génétiques récurrentes, au moins 20 % dans les autres cas, et une catégorie intermédiaire de 10 à 19 %.</p>
<p>Dans l’OMS 2022, l’érythroleucémie aiguë et la leucémie aiguë mégacaryoblastique figurent parmi les LAM définies par la différenciation. La leucémie aiguë érythroïde (LAE) associe une prédominance érythroïde, habituellement d’au moins 80 % des éléments médullaires, à au moins 30 % de proérythroblastes ; des cas au-dessous de 80 % sont admis lorsqu’ils partagent les mêmes caractères clinico-pathologiques. La leucémie aiguë mégacaryoblastique (LAMK) correspond à des blastes exprimant au moins une glycoprotéine plaquettaire, CD41, CD61 ou CD42b.</p>
<p>La mastocytose comprend trois types : systémique, cutanée et sarcome mastocytaire. Ses sous-types systémiques sont médullaire, indolent, « smoldering », agressif, associé à une néoplasie hématologique (SM-AHN) et <b>leucémie à mastocytes</b> (MCL). La MCL exige les critères de mastocytose systémique et au moins 20 % de mastocytes sur l’aspiration médullaire. La panmyélose aiguë avec myélofibrose (APMF) est une prolifération panmyéloïde aiguë avec au moins 20 % de blastes et une fibrose médullaire. La catégorie « maladie myélodysplasique et myéloproliférative non classifiable » est rebaptisée <b>MDS/MPN, NOS</b> dans l’OMS 2022. La leucémie agressive à cellules NK est une hémopathie lymphoproliférative très maligne liée à l’<button class="w" data-k="c94-ebv">EBV (virus d’Epstein-Barr)</button>. Enfin, la phase blastique de la LMC est définie par les critères de l’OMS 2022, reprise par Onkopedia, qui supprime la phase accélérée.</p>
<p><b>Piège de codage.</b> Le sous-code <b>C94.8!</b> (crise blastique au cours d’une LMC) porte un point d’exclamation : c’est un code secondaire, qui s’ajoute au code de la LMC et ne le remplace pas. Les sous-codes à cinq caractères distinguent l’absence de mention de rémission complète (cinquième caractère 0) de la rémission complète (cinquième caractère 1). Un code additionnel C95.8! signale une leucémie réfractaire au traitement d’induction standard. La leucémie à tricholeucocytes et la leucémie à plasmocytes sont exclues de C94. Le détail des correspondances figure dans la <button class="w" data-k="c94-codage">fenêtre sur le codage (règles de la classification)</button>.</p>
<div class="trap"><span class="k">Piège</span> Un code de leucémie n’indique pas la maladie biologique. La crise blastique d’une LMC se code en ajoutant C94.8! à la LMC, non en remplaçant le diagnostic initial.</div>

<section class="ilot" id="c94-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>La LAM, toutes formes confondues, touche environ 3,7 personnes pour 100 000 par an, plus de 100 pour 100 000 après 70 ans, avec un âge médian de 72 ans (registre suédois cité par Onkopedia). La part exacte de la LAE et de la LAMK parmi les LAM n’a pas été retrouvée dans les sources lues, de même que les chiffres suisses du registre : ces données restent une lacune.</p>
<p>La mastocytose systémique indolente atteint environ 1 personne pour 100 000 ; les formes avancées touchent 1 à 2 personnes par million. La crise blastique de LMC est devenue rare sous inhibiteur de tyrosine kinase dans les pays occidentaux, mais elle reste plus fréquente là où le diagnostic est tardif. La leucémie agressive à cellules NK prédomine en Asie et en Amérique latine.</p>

<p>Le tableau compare des entités dont les sources diffèrent par leur niveau de preuve. Le pronostic de la LAE provient d’une série rétrospective américaine, utilisée comme fait pronostique et non comme guide de conduite : elle montre que les patients reclassés en syndrome myélodysplasique par l’OMS 2022 survivent nettement mieux que ceux qui restent classés en LAE.</p>
<div class="key"><b>À retenir.</b> Le chiffre de survie dépend de l’entité, mais aussi de la définition utilisée. Le déplacement de cas de l’OMS 2001 vers les syndromes myélodysplasiques par l’OMS 2022 améliore mécaniquement le pronostic apparent de ces derniers.</div>

<section class="ilot" id="c94-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Une cellule souche de la moelle produit, à l’état normal, des lignées érythroïde, mégacaryocytaire, granuleuse et mastocytaire qui se différencient puis quittent la moelle. Dans les entités de ce cours, une étape de cette différenciation est bloquée par une anomalie génétique acquise. Les blastes s’accumulent, l’hématopoïèse normale est refoulée et la moelle ne fournit plus assez de globules rouges, de plaquettes et de neutrophiles.</p>
<p><b>LAE.</b> La perte des deux copies fonctionnelles de <button class="w" data-k="c94-tp53">TP53 (gène suppresseur de tumeur)</button> entraîne une instabilité génomique ; un caryotype complexe est fréquent et la réponse aux traitements est mauvaise. <b>LAMK du syndrome de Down.</b> Une mutation acquise de <button class="w" data-k="c94-gata1">GATA1 (facteur de transcription)</button>, gène codant un facteur de transcription de la lignée mégacaryocytaire et érythroïde, s’ajoute à la trisomie 21. Chez le nouveau-né, elle peut produire une myélopoïèse anormale transitoire limitée aux six premiers mois de vie ; elle peut aussi conduire à la leucémie myéloïde du syndrome de Down.</p>
<p><b>Mastocytose.</b> La mutation <button class="w" data-k="c94-kit">KIT D816V (récepteur à activité tyrosine kinase)</button>, présente dans plus de 90 % des mastocytoses systémiques, active le récepteur KIT sans ligand et fait proliférer les mastocytes. Ceux-ci libèrent des médiateurs, responsables des symptômes et du risque d’anaphylaxie, puis infiltrent les organes : cette infiltration produit les signes C (dysfonction d’organe). <b>Crise blastique de LMC.</b> Le clone BCR::ABL1 acquiert des anomalies chromosomiques additionnelles à haut risque, comme les réarrangements 3q26.2, la monosomie 7, l’isochromosome 17q ou un caryotype complexe, et des mutations du domaine kinase de BCR::ABL1 dont <button class="w" data-k="c94-t315i">T315I (résistance aux inhibiteurs)</button>. <b>Leucémie agressive à cellules NK.</b> Elle résulte de la transformation de cellules NK infectées par l’<button class="w" data-k="c94-ebv">EBV (virus d’Epstein-Barr)</button>.</p>

</section>
<section class="ilot" id="c94-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les sources lues ne donnent pas de liste exhaustive de facteurs de risque pour ces entités rares ; seuls les terrains suivants sont documentés. La trisomie 21 est le terrain de la LAMK de l’enfant, par l’association à une mutation de <button class="w" data-k="c94-gata1">GATA1 (facteur de transcription)</button>. L’infection par l’<button class="w" data-k="c94-ebv">EBV (virus d’Epstein-Barr)</button> est liée à la leucémie agressive à cellules NK. Une LMC préexistante est le terrain de la crise blastique, et le retard diagnostique ou un traitement inadapté de la LMC en augmente la fréquence. Une leucémie myéloïde peut aussi être secondaire à une prise en charge antérieure ou à une dysplasie : la classification propose alors des catégories distinctes, comme la LAM liée aux myélodysplasies ou post-thérapeutique, pour laquelle le CPX-351 est prévu.</p>
<p>Pour l’érythroleucémie, l’OMS 2022 donne la priorité à la LAE sur la LAM liée aux myélodysplasies (LAM-MR) lorsque les critères de la LAE sont remplis. Cette hiérarchie évite de classer deux fois le même cas et oriente vers la bonne analyse pronostique, car la LAE s’accompagne fréquemment d’altérations bialléliques de TP53.</p>
<div class="trap"><span class="k">Piège</span> Ne pas chercher un facteur de risque établi quand il n’existe pas : l’absence de cause identifiée est la règle dans ces entités rares, et l’absence d’antécédent n’exclut aucune d’entre elles.</div>

<section class="ilot" id="c94-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord le syndrome d’insuffisance médullaire. L’anémie explique la fatigue, la neutropénie les infections répétées et la thrombopénie les saignements. Les leucémies aiguës s’accompagnent aussi de douleurs osseuses et d’une perte de poids. La date d’apparition, la vitesse d’aggravation et les antécédents de maladie du sang orientent vers une forme secondaire.</p>
<div class="two"><div class="card"><h4>Leucémie aiguë érythroïde ou mégacaryoblastique</h4><p>Adulte âgé ou enfant, fatigue, infections, saignements.</p>
<p>Chez l’enfant, rechercher une trisomie 21 et un antécédent de myélopoïèse anormale transitoire dans les six premiers mois de vie.</p>
</div><div class="card"><h4>Mastocytose avancée</h4><p>Symptômes dus aux médiateurs mastocytaires, organomégalie, malabsorption avec amaigrissement, fractures.</p>
<p>Demander si le patient possède déjà un kit d’urgence avec adrénaline auto-injectable : sa présence signale un risque d’anaphylaxie reconnu.</p>
</div><div class="card"><h4>Leucémie myéloïde chronique connue</h4><p>Revoir le traitement par inhibiteur de tyrosine kinase, l’observance et les réponses antérieures.</p>
<p>Les signes d’alerte sont l’absence de rémission hématologique complète, la résistance à deux inhibiteurs, des anomalies additionnelles et des mutations complexes.</p>
</div><div class="card"><h4>Leucémie agressive à cellules NK</h4><p>Origine géographique, car la maladie prédomine en Asie et en Amérique latine, et contexte d’infection par l’EBV.</p>
<p>Les sources lues ne détaillent pas le tableau clinique initial : cette partie reste une lacune.</p>
</div></div>
<div class="key"><b>À retenir.</b> L’anamnèse ne pose jamais seule le diagnostic. Elle sert à classer le patient dans l’un des cinq profils du cours, qui décident de la suite du bilan.</div>
</section>
