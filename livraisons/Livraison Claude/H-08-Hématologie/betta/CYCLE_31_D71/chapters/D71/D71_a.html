<h1>Anomalies fonctionnelles des granulocytes neutrophiles</h1><span class="status">Enfant, adolescent et adulte · granulomatose septique chronique (axe principal), déficit d’adhésion leucocytaire (second axe), déficit en myéloperoxydase (diagnostic différentiel de laboratoire) · sources : <button class="w" data-k="d71-sources">CIM-10-GM 2024</button> ; école zurichoise (Seger, Güngör, Reichenbach) ; cohorte européenne 2009 ; revue de la Charité 2024 ; informations professionnelles suisses Bactrim®, Itraconazole Sandoz® et Posaconazol Zentiva® · état au 14.10.2026, audit différé du Cycle 31 · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>

<section class="ilot" id="d71-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les données des sources citées.</p><p>Un garçon de trois ans est hospitalisé pour la deuxième fois en six mois. Il présente une pneumonie, après un abcès cervical à <i>Staphylococcus aureus</i> et un abcès hépatique qui avait nécessité un drainage. La numération des neutrophiles est normale, et celle des lymphocytes aussi. Les immunoglobulines sont normales. Pourtant, chaque infection a été sévère, longue à guérir et provoquée par des germes de faible virulence pour un enfant sain.</p><p><b>La question clinique est la suivante : lorsque les neutrophiles sont présents en nombre normal, leur fonction microbicide est-elle défaillante ?</b> Cette question se pose devant des abcès et des pneumonies récidivants à <i>S. aureus</i>, <i>Aspergillus</i>, <i>Serratia</i>, <i>Nocardia</i> ou <i>Burkholderia</i>, ou devant une colite de type Crohn chez un enfant ou un adulte jeune (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). La réponse relève de la catégorie D71 de la CIM-10-GM, dont le cœur est la <button class="w" data-k="d71-cgd-def">granulomatose septique chronique</button>.</p><p>Le chapitre suit l’ordre de la consultation. Il définit d’abord le groupe de maladies et son classement (îlots 1 et 2). Il explique ensuite comment le neutrophile détruit un microbe, et pourquoi il échoue (îlots 3 et 4). Il décrit enfin les signes qui font évoquer le diagnostic (îlots 5 et 6), la manière de le prouver (îlots 7 et 8) et la conduite à tenir : prévenir, traiter, guérir par greffe et suivre (îlots 9 à 13).</p><div class="key"><b>Point de départ.</b> Un neutrophile en nombre normal n’est pas un neutrophile fonctionnel. Le test de référence de première ligne est la mesure de la <button class="w" data-k="d71-dhr">flambée respiratoire par la dihydrorhodamine</button>, et le piège principal est le <button class="w" data-k="d71-mpo-diff">déficit complet en myéloperoxydase</button>, qui imite la maladie.</div><p class="src">Références : <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc D70-D77</a>.</p></section>
<section class="ilot" id="d71-1"><h2><span class="n">1</span>Définition, nosologie et classification</h2><h3>Ce que recouvre D71</h3><p>La catégorie D71 de la <button class="w" data-k="d71-nosologie">CIM-10-GM 2024</button> s’intitule « Anomalies fonctionnelles des granulocytes neutrophiles ». Elle ne comporte aucun sous-code. Ses inclusions sont la dysphagocytose congénitale, la granulomatose chronique de l’enfance, le défaut du complexe récepteur membranaire CR3 et la granulomatose septique progressive (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc D70-D77</a>). Elle ne comporte aucune exclusion propre.</p><p>Deux conséquences pratiques en découlent. D’une part, le syndrome de Chédiak-Higashi n’appartient pas à D71 : il est exclu de D72.0 et codé E70.3 (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc D70-D77</a>). D’autre part, la seule ligne de D71 qui décrit un mécanisme précis est le défaut du complexe CR3, c’est-à-dire de l’<button class="w" data-k="d71-lad">intégrine β2</button>, qui correspond au déficit d’adhésion leucocytaire de type I. Le reste du groupe est représenté par la granulomatose septique chronique, sa maladie la mieux documentée. Le cours en tient compte : l’axe principal est la granulomatose septique chronique, le second axe est le déficit d’adhésion leucocytaire, et le déficit en myéloperoxydase sert de diagnostic différentiel de laboratoire.</p><h3>Définition de la granulomatose septique chronique</h3><p>La granulomatose septique chronique (<button class="w" data-k="d71-cgd-def">CGD</button>, de l’anglais <i>chronic granulomatous disease</i>) est un groupe de déficits immunitaires héréditaires qui touchent le complexe enzymatique <button class="w" data-k="d71-nadph-ox">NADPH oxydase</button> des phagocytes : neutrophiles, monocytes, macrophages et éosinophiles. Ces cellules ne fabriquent plus d’<button class="w" data-k="d71-ros">espèces réactives de l’oxygène</button>. Il en résulte deux conséquences : l’échec de la destruction d’un spectre défini de bactéries et de champignons, et une hyperinflammation avec formation de granulomes tissulaires (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). On parle aussi de défaut de la « flambée respiratoire » de tous les phagocytes, due à une erreur innée de l’immunité, liée à l’X ou autosomique récessive (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Classification génétique de la granulomatose septique chronique</h3><p>La maladie se classe selon le gène atteint. Le tableau résume les sept gènes retenus par les sources, avec la protéine concernée, le mode de transmission et la remarque clinique utile (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>). Il se lit de haut en bas par fréquence décroissante : la première ligne regroupe à elle seule les deux tiers des patients.</p><table class="t"><tr><th>Gène</th><th>Protéine</th><th>Transmission</th><th>Remarque</th></tr><tr><td><button class="w" data-k="d71-genes">CYBB</button></td><td>gp91phox (<button class="w" data-k="d71-genes">NOX2</button>), sous-unité catalytique</td><td>Liée à l’X</td><td>Environ 67 à 70 % des cas ; forme la plus sévère</td></tr><tr><td><button class="w" data-k="d71-genes">NCF1</button></td><td>p47phox</td><td>Autosomique récessive</td><td>Environ 20 % ; activité résiduelle plus élevée</td></tr><tr><td>CYBA</td><td>p22phox</td><td>Autosomique récessive</td><td>Rare</td></tr><tr><td>NCF2</td><td>p67phox</td><td>Autosomique récessive</td><td>Rare</td></tr><tr><td><button class="w" data-k="d71-genes">CYBC1</button></td><td>EROS, chaperon de gp91phox et de p22phox</td><td>Autosomique récessive</td><td>Rare, décrit récemment</td></tr><tr><td><button class="w" data-k="d71-genes">NCF4</button></td><td>p40phox</td><td>Autosomique récessive</td><td>Phénotype atténué, sans infection invasive décrite</td></tr><tr><td><button class="w" data-k="d71-genes">RAC2</button> (dominant négatif)</td><td>RAC2</td><td>Variant dominant négatif</td><td>Tableau proche du déficit d’adhésion leucocytaire avec flambée altérée</td></tr></table><p>Dans la cohorte européenne de 429 patients, la forme liée à l’X concerne 290 patients (67 %) et la forme autosomique récessive 139 patients (33 %). Au sein de cette dernière, la protéine p47phox représente 49 % des cas, p22phox 16 %, p67phox 8 %, et 27 % restent d’origine non identifiée (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>).</p><div class="trap"><span class="k">Piège</span> Le gène atteint détermine l’activité enzymatique résiduelle, et celle-ci détermine la survie (<a href="https://doi.org/10.1056/NEJMoa1007097" target="_blank" rel="noopener">Kuhns et al., N Engl J Med 2010</a>). Classer une granulomatose septique chronique sans nommer le gène prive donc le clinicien de son principal élément pronostique (<button class="w" data-k="d71-residuel">fenêtre</button>).</div><h3>Classification du déficit d’adhésion leucocytaire</h3><p>Le déficit d’adhésion leucocytaire (<button class="w" data-k="d71-lad">LAD</button>, de l’anglais <i>leukocyte adhesion deficiency</i>) rassemble trois maladies héréditaires dans lesquelles le neutrophile, normal par son équipement microbicide, ne parvient pas à quitter le sang pour gagner le tissu infecté (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a>).</p><table class="t"><tr><th>Type</th><th>Gène et protéine</th><th>Mécanisme</th><th>Signes propres</th></tr><tr><td>LAD-I</td><td>ITGB2 ; CD18</td><td>Absence ou dysfonction des intégrines β2</td><td>Chute tardive du cordon ombilical, hyperleucocytose neutrophile, infections sans pus, cicatrisation lente</td></tr><tr><td>LAD-II</td><td>SLC35C1 ; transporteur du GDP-fucose</td><td>Défaut de fucosylation des ligands des sélectines, donc du roulement</td><td>Retard mental et de croissance sévère, absence d’antigènes H (groupe Bombay) ; infections moins sévères</td></tr><tr><td>LAD-III</td><td>FERMT3 ; kindline-3</td><td>Défaut d’activation « <i>inside-out</i> » des intégrines β1, β2 et β3</td><td>Infections et syndrome hémorragique de type Glanzmann ; parfois ostéopétrose infantile maligne</td></tr></table><p>Pour le LAD-I, trois classes d’expression du CD18 se distinguent : la classe I° (moins de 5 % de la normale), la classe I⁻ (5 à 20 %) et la classe I⁺ (expression normale mais non fonctionnelle) (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a>). La forme sévère présente souvent moins de 2 % d’expression sur les neutrophiles (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a>).</p><div class="trap"><span class="k">Piège</span> Seul le LAD-I, c’est-à-dire le défaut de CR3, est explicitement inclus sous D71. Les types II et III sont présentés ici pour leur mécanisme et pour le diagnostic différentiel ; le dossier de recherche n’a pas vérifié leur codage dans la CIM-10-GM.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc D70-D77</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a> ; <a href="https://doi.org/10.1056/NEJMoa1007097" target="_blank" rel="noopener">Kuhns et al., N Engl J Med 2010</a>.</p></section>
<section class="ilot" id="d71-2"><h2><span class="n">2</span>Épidémiologie</h2><p>La granulomatose septique chronique est rare. Sa prévalence globale est estimée à 1 pour 250 000 (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>) et l’incidence vraie ne peut pas être déterminée (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>). Une estimation plus tardive situe la prévalence à la naissance à 1 pour 120 000 et conclut que la maladie est plus fréquente qu’on ne le supposait (<a href="https://doi.org/10.1097/MOH.0b013e32834115e7" target="_blank" rel="noopener">Seger, Curr Opin Hematol 2011</a>).</p><p>La cohorte européenne de référence recense 429 patients, dont 24 patients suisses, avec 82 % de garçons, ce qui reflète le poids de la transmission liée à l’X (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>). Aucune donnée suisse de prévalence propre n’a été trouvée : le versant suisse du cours repose sur cette cohorte et sur les travaux de l’école zurichoise.</p><p>L’âge au diagnostic dépend de la transmission. Il est de 4,9 ans en moyenne dans la forme liée à l’X, contre 8,8 ans dans la forme autosomique récessive (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>). La médiane se situe entre 2,5 et 3 ans, mais le diagnostic peut survenir à l’adolescence ou à l’âge adulte (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). Les formes révélées chez l’adulte, y compris chez la personne âgée, sont de plus en plus observées (<a href="https://doi.org/10.1097/MOH.0b013e32834115e7" target="_blank" rel="noopener">Seger, Curr Opin Hematol 2011</a>).</p><table class="t"><tr><th>Maladie</th><th>Donnée disponible</th><th>Source</th></tr><tr><td>Granulomatose septique chronique</td><td>Prévalence 1/250 000 ; 429 patients européens, dont 24 Suisses ; 82 % de garçons</td><td><a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a></td></tr><tr><td>LAD-I</td><td>Incidence inconnue ; 123 patients dans 109 familles répertoriés ; foyer fondateur du LAD-III en Anatolie</td><td><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a></td></tr><tr><td>Déficit en myéloperoxydase</td><td>282 activités réduites parmi 11 608 patients dépistés sur un automate ; 12 déficits persistants et 44 transitoires sur 56 étudiés</td><td><a href="https://doi.org/10.1016/j.redox.2026.104386" target="_blank" rel="noopener">Ahdab et al., Redox Biol 2026</a></td></tr></table><p>Le déficit en myéloperoxydase est décrit comme l’un des déficits phagocytaires héréditaires les plus fréquents (<a href="https://doi.org/10.1093/labmed/lmz060" target="_blank" rel="noopener">Roh et al., Lab Med 2020</a>). Ce déficit entre dans le cours parce que son résultat de laboratoire peut imiter celui de la granulomatose septique chronique (îlot 7).</p><div class="key"><b>À retenir.</b> Garçon, forme liée à l’X, diagnostic dans la petite enfance : le profil est le plus fréquent, mais une forme autosomique récessive ou un diagnostic à l’âge adulte n’écartent pas la maladie.</div><p class="src">Références : <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://doi.org/10.1097/MOH.0b013e32834115e7" target="_blank" rel="noopener">Seger, Curr Opin Hematol 2011</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://doi.org/10.1016/j.redox.2026.104386" target="_blank" rel="noopener">Ahdab et al., Redox Biol 2026</a> ; <a href="https://doi.org/10.1093/labmed/lmz060" target="_blank" rel="noopener">Roh et al., Lab Med 2020</a>.</p></section>
<section class="ilot" id="d71-3"><h2><span class="n">3</span>Du neutrophile normal au neutrophile défaillant</h2><p>Pourquoi un neutrophile présent en nombre normal laisse-t-il survivre un <i>Staphylococcus aureus</i> ? La réponse tient à un seul complexe enzymatique, dont l’absence supprime l’arme principale du phagocyte.</p><h3>Le neutrophile normal : la <button class="w" data-k="d71-flambee">flambée respiratoire</button></h3><p>Lorsqu’un neutrophile englobe un microbe, il l’enferme dans une vésicule intracellulaire, le phagosome. La membrane de cette vésicule porte la <button class="w" data-k="d71-nadph-ox">NADPH oxydase</button>. L’enzyme catalytique, gp91phox (aussi appelée NOX2), prend des électrons au NADPH cytosolique, les fait passer par le FAD et par deux hèmes, puis les transfère à l’oxygène. L’oxygène devient ainsi un anion superoxyde. La superoxyde dismutase le transforme en peroxyde d’hydrogène, et la myéloperoxydase, en présence de chlore, transforme celui-ci en acide hypochloreux (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). Ce sont les <button class="w" data-k="d71-ros">espèces réactives de l’oxygène</button> (ROS).</p><p>La production d’électrons doit être compensée par un flux de charges positives, notamment du potassium, vers le phagosome. La hausse de force ionique qui en résulte dissout la matrice protéoglycane qui retient des protéases granulaires, comme l’élastase et la cathepsine G, et les libère sous forme active (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). Les ROS agissent donc de deux façons : directement sur le microbe, et indirectement en activant des protéases (<button class="w" data-k="d71-phagosome-proteases">fenêtre</button>). Elles sont aussi nécessaires aux pièges extracellulaires, les <button class="w" data-k="d71-net">NET</button>.</p><h3>Le neutrophile de la granulomatose septique chronique</h3><p>Quand un gène de la NADPH oxydase est atteint (îlot 1), la chaîne s’interrompt à sa première étape et trois défauts en découlent.</p><ol><li><b>Défaut microbicide.</b> Sans superoxyde, il n’y a ni peroxyde d’hydrogène ni acide hypochloreux. Sans flux ionique, la matrice des granules n’est pas dissoute et les protéases restent inactives (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). Les germes qui persistent dans les neutrophiles sont <i>S. aureus</i>, le complexe <i>Burkholderia</i>, <i>Serratia marcescens</i>, <i>Nocardia</i> et <i>Aspergillus</i> (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</li><li><b>Défaut de pièges extracellulaires.</b> Les neutrophiles de la maladie sont déficitaires en NET. La restauration des NET par thérapie génique a été associée à la guérison d’une aspergillose réfractaire à Zurich (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</li><li><b>Défaut de résolution de l’inflammation.</b> Il explique les granulomes et la colite en l’absence d’infection (<button class="w" data-k="d71-inflammation">fenêtre</button>).</li></ol><div class="trap"><span class="k">Piège</span> Les sources résument le spectre infectieux par des germes « producteurs de catalase », mais <i>Actinomyces</i>, qui ne produit pas de catalase, est un pathogène inattendu de la maladie (dix patients, fièvre et inflammation sans foyer, diagnostic retardé) (<a href="https://doi.org/10.1086/647945" target="_blank" rel="noopener">Reichenbach et al., Clin Infect Dis 2009</a>). La règle « germes catalase positifs » reste une approximation, et les sources lues ne développent pas l’explication causale de la catalase (<button class="w" data-k="d71-catalase">fenêtre</button>).</div><h3>Le défaut de résolution de l’inflammation</h3><p>Trois mécanismes sont décrits (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). Premièrement, les ROS sont nécessaires à l’activation du facteur anti-inflammatoire Nrf2, dont l’activité est réduite dans les cellules de la maladie stimulées par le zymosan. Deuxièmement, les monocytes de la maladie activent davantage l’inflammasome, donc la caspase 1 et l’<button class="w" data-k="d71-il1">interleukine 1β</button>, surtout chez les patients qui ont une inflammation non infectieuse ; l’antagoniste du récepteur de l’interleukine 1 réduit cette production. Troisièmement, les neutrophiles de la maladie n’externalisent pas la phosphatidylsérine, signal qui invite les macrophages à les éliminer, et leurs macrophages captent mal les cellules apoptotiques. La résolution de l’inflammation est donc altérée.</p><p>Cette chaîne justifie deux conduites. Les corticoïdes sont utiles dans certaines formes parce qu’ils empêchent la formation de cellules géantes multinucléées dépendante du <button class="w" data-k="d71-tnf">TNF-α</button> et favorisent une phagocytose non inflammatoire des neutrophiles (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). À l’inverse, ils exposent à l’infection : le choix est détaillé dans les îlots 8 et 10.</p><h3>Le mécanisme du LAD-I</h3><p>Dans le LAD-I, l’équipement microbicide est intact, mais la sortie du vaisseau est impossible. Sans intégrine β2, les neutrophiles n’adhèrent pas à l’endothélium et ne migrent pas vers les tissus. Les cellules s’accumulent donc dans le sang, d’où l’hyperleucocytose, et les tissus infectés n’en reçoivent pas, d’où l’absence de pus (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a>).</p><p>La comparaison fixe l’essentiel : <b>dans la granulomatose septique chronique, le neutrophile arrive sur place mais ne tue pas ; dans le LAD-I, il tuerait mais n’arrive pas</b>. La première maladie donne des abcès et des granulomes, la seconde des infections sans pus avec un taux élevé de neutrophiles circulants.</p><div class="key"><b>Science → clinique.</b> Une activité de la NADPH oxydase absente ou réduite explique les abcès profonds, les granulomes et l’hyperinflammation. Une adhésion absente explique la granulocytose sanguine et l’absence de pus. Les deux tableaux se distinguent en première intention par la numération et par la présence de pus, puis par la cytométrie en flux (îlot 7).</div><p class="src">Références : <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://doi.org/10.1086/647945" target="_blank" rel="noopener">Reichenbach et al., Clin Infect Dis 2009</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a>.</p></section>
<section class="ilot" id="d71-4"><h2><span class="n">4</span>Causes, transmission et conductrices</h2><p>La granulomatose septique chronique est une erreur innée de l’immunité. Elle n’a pas de cause acquise dans les sources lues : elle résulte d’une variation pathogène d’un des gènes énumérés à l’îlot 1.</p><h3>Transmission</h3><p>Le gène <button class="w" data-k="d71-genes">CYBB</button> est porté par le chromosome X. Un garçon qui reçoit le variant est atteint ; une fille porteuse est conductrice (<button class="w" data-k="d71-conductrices">fenêtre</button>). Les autres gènes se transmettent sur le mode autosomique récessif : les deux parents sont porteurs sans symptôme, et chaque enfant a une chance sur quatre d’être atteint, quel que soit son sexe. Cette règle explique les 18 % de filles de la cohorte européenne, puisque la forme liée à l’X est la plus fréquente mais pas la seule (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>).</p><p>Jusqu’à un tiers des formes liées à l’X sont des néomutations germinales maternelles, absentes des cellules somatiques de la mère (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). L’absence d’antécédent familial n’exclut donc pas la forme liée à l’X.</p><h3>Cas particuliers de la forme liée à l’X</h3><p>Les grandes délétions de l’X peuvent s’étendre au gène voisin <i>XK</i> et produire le phénotype McLeod, parfois associé à une myopathie de Duchenne ou à une rétinite pigmentaire. Chez ces patients, il faut éviter les transfusions répétées d’érythrocytes exprimant les antigènes K20 et XK1 ; l’acanthocytose oriente vers ce syndrome sans l’exclure (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><h3>Facteurs d’exposition</h3><p>Le gène explique la vulnérabilité, mais l’exposition déclenche l’infection. Les spores d’<i>Aspergillus</i> se rencontrent dans les fermes, le paillis, les chantiers, le compost et la démolition de murs humides ; le tabagisme et la présence d’animaux domestiques sont déconseillés (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). La <button class="w" data-k="d71-paillis">pneumonie au paillis</button> en est l’illustration : deux à trois jours après un épandage de paillis ou de feuilles moisies apparaissent fièvre, dyspnée, infiltrats interstitiels diffus et hypoxie.</p><div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence de maladie génétique parce que l’anamnèse familiale est négative. Les néomutations, la transmission autosomique récessive et la lyonisation favorable chez une mère conductrice produisent des histoires familiales silencieuses (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</div><p class="src">Références : <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>.</p></section>
<section class="ilot" id="d71-5"><h2><span class="n">5</span>Interroger : infections, germes et inflammation</h2><p>L’interrogatoire cherche trois choses : des infections qui se répètent ou qui guérissent mal, des germes inhabituels, et une inflammation qui n’est pas infectieuse.</p><h3>Les sites d’infection</h3><p>La cohorte européenne (429 patients) donne la fréquence de chaque site (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>). Les poumons dominent, ce qui correspond à la porte d’entrée par inhalation des spores.</p><table class="t"><tr><th>Site</th><th>Part des patients</th></tr><tr><td>Poumons</td><td>66 %</td></tr><tr><td>Peau et tissu sous-cutané</td><td>53 %</td></tr><tr><td>Ganglions</td><td>50 %</td></tr><tr><td>Tube digestif</td><td>48 %</td></tr><tr><td>Foie</td><td>32 %</td></tr><tr><td>Rein et voies urinaires</td><td>22 %</td></tr><tr><td>Septicémie</td><td>20 %</td></tr><tr><td>Os</td><td>13 %</td></tr><tr><td>Cerveau</td><td>7 %</td></tr></table><h3>Les germes</h3><p>Les isolats se répartissent comme suit (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>) : <i>S. aureus</i> 30 %, <i>Aspergillus</i> 26 %, <i>Salmonella</i> 16 %, <i>Candida</i> 6 %, <i>Serratia</i> 4 %, <i>Pseudomonas</i> 2 %, <i>Burkholderia cepacia</i> moins de 1 % et <i>Nocardia</i> moins de 1 %. Chaque germe a une topographie préférentielle (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>) : <i>S. aureus</i> la peau, les ganglions, le rectum et le cerveau ; <i>Aspergillus</i> les poumons, le cerveau, les os et les cavités nasales ; <i>Serratia</i> et <i>Proteus</i> l’abcès hépatique ; <i>Burkholderia</i> le poumon, avec le syndrome cepacia. Les abcès hépatiques sont denses et caséeux (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><p>Le taux d’infection se situe entre 0,26 et 0,64 par patient-année. Le risque cumulé d’aspergillose est de 20 à 40 % ; c’est la première cause de décès (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>).</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Un garçon de deux ans présente une adénite suppurée à <i>S. aureus</i>, puis une pneumonie qui traîne malgré l’antibiotique, puis un abcès hépatique dense. La numération des neutrophiles est normale. La forme liée à l’X, la plus fréquente, est évoquée d’emblée.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Un adolescent suivi pour une maladie de Crohn réfractaire présente une colite granulomateuse sans infection documentée. Un adulte de quarante ans a une aspergillose pulmonaire inaugurale, l’autre une fièvre sans foyer due à <i>Actinomyces</i>. Chez ces patients, la maladie est révélée tard, souvent dans la forme autosomique récessive (<button class="w" data-k="d71-actinomyces">fenêtre</button>).</p></div></div><h3>Mycobactéries et germes rares</h3><p>La vaccination par le BCG a provoqué une BCGite chez 34 patients sur 429 (8 %), dont 65 % en France (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>). Le BCG local sévère et la tuberculose pulmonaire non miliaire sont décrits surtout hors d’Europe (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>). La leishmaniose viscérale avec syndrome hémophagocytaire a été décrite en région méditerranéenne, et <i>Granulibacter bethesdensis</i> cause une lymphadénite nécrosante (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>) (<button class="w" data-k="d71-bcgite">fenêtre</button>).</p><h3>Les complications inflammatoires</h3><p>Environ la moitié des patients développe une autoinflammation ; la maladie inflammatoire intestinale de type Crohn est la plus fréquente, avec histiocytes pigmentés, microgranulomes et abcès éosinophiles (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>). Les autres manifestations sont l’obstruction du défilé gastrique, la cystite inflammatoire avec obstruction des méats urétéraux et hydronéphrose, la cicatrisation lente des plaies et les fistules (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>), l’auto-immunité (6 % dans la cohorte européenne, surtout lupus discoïde) (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>), des tableaux de type lupus érythémateux disséminé, vasculite, sarcoïdose ou thrombopénie (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>), et l’hypertension portale non cirrhotique (<a href="https://doi.org/10.1097/MOH.0b013e32834115e7" target="_blank" rel="noopener">Seger, Curr Opin Hematol 2011</a>).</p><p>Les fréquences de la colite divergent selon la source : 9 % dans la cohorte européenne de 2009, environ un tiers des patients pour Seger 2010 et « environ la moitié » d’autoinflammation pour Staudacher 2024. Cette divergence reflète la définition de la colite et l’époque des données, non une contradiction ; elle est signalée comme telle (<button class="w" data-k="d71-colite">fenêtre</button>).</p><div class="quiz ui"><p><b>Cas pédagogique fictif.</b> Une femme de 34 ans, suivie depuis l’adolescence pour une maladie de Crohn réfractaire aux corticoïdes, présente une fièvre sans foyer depuis trois semaines. Les neutrophiles sont en nombre normal et aucun germe n’est isolé. Quelle hypothèse faut-il ajouter à la discussion ?</p><button data-ok="0">Une agranulocytose médicamenteuse, car la fièvre suggère une neutropénie.</button><button data-ok="1">Une granulomatose septique chronique révélée à l’âge adulte, avec une colite granulomateuse et une possible infection à <i>Actinomyces</i>.</button><button data-ok="0">Un déficit en immunoglobulines, car les infections sont récidivantes.</button><p class="fb" hidden>Staudacher 2024 recommande d’exclure une granulomatose septique chronique chez tout patient atteint de maladie de Crohn, et Reichenbach 2009 décrit des patients avec fièvre et inflammation sans foyer dues à <i>Actinomyces</i>, au diagnostic retardé. Les neutrophiles sont en nombre normal : une neutropénie n’explique pas le tableau. Le test de première ligne est la dihydrorhodamine.</p></div><div class="key"><b>À retenir.</b> L’interrogatoire date chaque infection, nomme le site et le germe quand il est connu, relève les vaccinations (BCG) et cherche une colite, une cystite ou une obstruction. Un tableau digestif de type Crohn n’exclut pas la maladie ; il peut en être la révélation.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://doi.org/10.1097/MOH.0b013e32834115e7" target="_blank" rel="noopener">Seger, Curr Opin Hematol 2011</a> ; <a href="https://doi.org/10.1086/647945" target="_blank" rel="noopener">Reichenbach et al., Clin Infect Dis 2009</a>.</p></section>
<section class="ilot" id="d71-6"><h2><span class="n">6</span>Examiner</h2><p>Les sources lues ne décrivent pas de sémiologie physique propre à la granulomatose septique chronique : aucun signe pathognomonique n’y figure. L’examen cherche donc les sites d’atteinte de l’îlot 5, et la gravité d’un foyer actif.</p><div class="two"><div class="card"><h4>Granulomatose septique chronique</h4><p><b>État général et vitaux.</b> Fièvre, tachycardie, polypnée, désaturation : une fièvre sans foyer, avec inflammation, peut être le seul signe d’une infection profonde (<button class="w" data-k="d71-actinomyces">fenêtre</button>).</p><p><b>Peau et ganglions.</b> Abcès cutanés, adénites suppurées ou nécrosantes, cicatrisation lente des plaies (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p><p><b>Thorax.</b> Signes pulmonaires : <i>Aspergillus</i> et <i>Burkholderia</i> atteignent le poumon (<button class="w" data-k="d71-aspergillose">fenêtre</button>).</p><p><b>Abdomen et région périanale.</b> Le foie (abcès, 32 % des patients) et le tube digestif (48 %) sont atteints ; l’obstruction du défilé gastrique et les fistules périanales d’une colite granulomateuse se recherchent (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a>).</p><p><b>Voies urinaires.</b> Signes d’obstruction : une cystite inflammatoire peut obstruer les méats urétéraux et causer une hydronéphrose (<a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a>).</p></div><div class="card"><h4>Déficit d’adhésion leucocytaire de type I</h4><p><b>Nourrisson.</b> Chute retardée du cordon ombilical, infections cutanéo-muqueuses récidivantes sans pus, cicatrisation altérée (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a>).</p><p><b>Bouche.</b> Dans les formes modérées, parodontite et perte osseuse.</p><p><b>Digestif.</b> Colite de type Crohn.</p><p><b>Lecture.</b> L’absence de pus, avec une forte hyperleucocytose neutrophile pendant les infections, oriente vers le défaut d’adhésion plutôt que vers le défaut microbicide.</p></div></div><div class="trap"><span class="k">Piège</span> La normalité de l’examen entre deux épisodes n’écarte pas la maladie. L’examen pulmonaire et abdominal peut rester pauvre malgré un foyer profond, c’est pourquoi les sources recommandent une imagerie corps entier pour localiser les foyers occultes (îlot 7).</div><div class="key"><b>À retenir.</b> L’examen s’adresse au site, pas au diagnostic : il oriente le prélèvement (biopsie, culture, imagerie) et mesure la gravité. Le diagnostic repose sur le test fonctionnel.</div><button class="pareto-btn ui" data-k="pareto-d71-clin">▲ Loi de Pareto — Définition, mécanismes, causes, sémiologie</button><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC2668749/" target="_blank" rel="noopener">van den Berg et al., PLoS One 2009</a> ; <a href="https://njmonline.nl/getpdf.php?id=979" target="_blank" rel="noopener">Seger, Neth J Med 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4539347/" target="_blank" rel="noopener">van de Vijver et al., Blood Cells Mol Dis 2012</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8998723/" target="_blank" rel="noopener">Fekadu et al., Int J Mol Sci 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11239527/" target="_blank" rel="noopener">Staudacher et von Bernuth, Front Pediatr 2024</a>.</p></section>
