<template data-pop="c93-d-soutien" data-title="Traitement de soutien de la leucémie myélomonocytaire chronique"><h3>Éléments</h3><ul><li>Transfusions érythrocytaires selon la clinique (hémoglobine au-dessus de 9 g/dl en coronaropathie sévère) ; plaquettes surtout en cas de saignement.</li><li>Antibiothérapie libérale ; vaccins contre le pneumocoque, la COVID-19 et la grippe.</li><li>Chélation du fer si l’espérance de vie dépasse 2 ans et si le patient a reçu au moins 20 concentrés érythrocytaires ou a une ferritine supérieure à 1000 ng/ml.</li><li>Agents stimulant l’érythropoïèse si l’érythropoïétine est inférieure à 200 U/l, le besoin transfusionnel faible (2 concentrés ou moins en 8 semaines), les blastes à 10 % ou moins, la forme dysplasique ; réévaluation à 6 mois.</li></ul><p>Ces critères sont ceux d’Onkopedia 2023 ; ils ne s’appliquent pas à la leucémie aiguë.</p></template>
<template data-pop="c93-d-hydroxyuree" data-title="Hydroxyurée (Litalir®)"><h3>Place et preuve</h3><p>Premier choix de la leucémie myélomonocytaire chronique proliférative ; un essai randomisé a montré un bénéfice de survie par rapport à l’étoposide (Onkopedia 2023). En urgence, elle sert à la cytoréduction de la leucostase (jusqu’à 4 à 5 g par jour).</p><h3>Situation suisse</h3><p>L’information professionnelle de Litalir® (avril 2024) indique la leucémie myéloïde chronique et d’autres syndromes myéloprolifératifs ; la leucémie myélomonocytaire chronique n’y est pas nommée. La prescription dans cette indication suit donc les recommandations plutôt que l’étiquette.</p><h3>Surveillance</h3><p>Hémogramme, moelle, fonctions rénale et hépatique. Les contre-indications et effets indésirables détaillés figurent dans l’information professionnelle, non reproduits ici. Le mécanisme n’est pas décrit dans les sources lues.</p></template>
<template data-pop="c93-d-azacitidine" data-title="Azacitidine (Azacitidin Accord®)"><h3>Classe et indication</h3><p>Agent hypométhylant. L’information professionnelle suisse (août 2024) nomme la leucémie myélomonocytaire chronique chez les patients non éligibles à l’allogreffe. Onkopedia l’associe à la forme dysplasique avec excès de blastes ou leucocytes sous 13 G/l. Dans la leucémie aiguë non apte, elle s’associe au vénétoclax ; dans la forme juvénile, elle précède la greffe.</p><h3>Posologie</h3><p>75 mg/m² par jour par voie sous-cutanée, 7 jours tous les 28 jours, au moins 6 cycles avant d’évaluer la réponse. Chez l’enfant : 100 mg/m² pendant 5 jours ou 75 mg/m² pendant 7 jours, 6 à 9 cycles (revue 2021 ; statut suisse non vérifié).</p><h3>Précaution</h3><p>Contre-indiquée pendant la grossesse (tératogène, mutagène).</p></template>
<template data-pop="c93-d-decitabine" data-title="Décitabine (Dacogen®)"><p>Autre agent hypométhylant. En Suisse, Dacogen® (novembre 2024) n’est autorisé que pour la leucémie aiguë myéloïde non éligible à la chimiothérapie intensive. Dans la leucémie myélomonocytaire chronique proliférative avancée, un essai de phase III contre l’hydroxyurée n’a pas montré de bénéfice de survie. Dans la leucémie aiguë, Onkopedia la juge d’efficacité semblable à l’azacitidine, et son association au vénétoclax est de 20 mg/m² par jour pendant 5 jours.</p></template>
<template data-pop="c93-d-7plus3" data-title="Induction « 7+3 » et consolidation"><h3>Schéma</h3><p>Une anthracycline pendant 3 jours (daunorubicine 60 mg/m², idarubicine 10–12 mg/m² ou mitoxantrone 10–12 mg/m²) et la cytarabine en perfusion continue pendant 7 jours (100–200 mg/m²). Des ajouts sont possibles selon la génétique : gemtuzumab ozogamicine si CD33 positif et profil favorable ; quizartinib ou midostaurine si FLT3 muté.</p><h3>Après l’induction</h3><p>Consolidation par cytarabine à haute dose (profil favorable) ; allogreffe en première rémission pour les risques intermédiaire et défavorable. Réservé aux patients aptes : à plus de 75 ans biologiques ou comorbides, le traitement curatif intensif n’est pas recommandé (environ 10 % de rémission prolongée).</p></template>
<template data-pop="c93-d-vyxeos" data-title="CPX-351 (Vyxeos® liposomal)"><p>Formulation liposomale combinant daunorubicine et cytarabine, destinée à la leucémie liée au traitement ou avec anomalies de type myélodysplasique. Posologie (information professionnelle de juin 2023) : première induction, daunorubicine 44 mg/m² et cytarabine 100 mg/m² aux jours 1, 3 et 5 ; deuxième induction, jours 1 et 3 ; consolidation, 29 et 65 mg/m² aux jours 1 et 3. Les contre-indications et effets indésirables sont à lire dans l’information professionnelle.</p></template>
<template data-pop="c93-d-venetoclax" data-title="Vénétoclax (Venclyxto®) avec azacitidine"><h3>Place et preuve</h3><p>Standard de première priorité chez le patient non apte à l’induction intensive. Dans l’essai VIALE-A, la rémission complète ou avec récupération incomplète atteint 66,4 % contre 28,3 %, et la survie médiane 14,7 contre 9,6 mois.</p><h3>Posologie</h3><p>Paliers de 100, 200 puis 400 mg aux jours 1 à 3, puis 400 mg par jour avec azacitidine (75 mg/m², jours 1 à 7) ou décitabine (20 mg/m², jours 1 à 5) ; 600 mg par jour avec cytarabine à faible dose. Premier cycle hospitalier ; moelle aux jours 21 à 28.</p><h3>Précautions</h3><p>Leucocytes sous 25 G/l avant le début ; prévention de la lyse tumorale (îlot 8) ; adaptation de dose avec les inhibiteurs du CYP3A.</p><h3>Limite monocytaire</h3><p>Avec au moins 10 % de monoblastes parmi les cellules CD45 positives, la rémission est moins fréquente (rapport de cotes 0,24), la survie médiane de 4,0 contre 14,9 mois (rapport de risque 1,95). Le mécanisme n’est pas décrit dans les sources lues.</p></template>
<template data-pop="c93-d-cyp3a" data-title="CYP3A et inhibiteurs : adaptation du vénétoclax"><p>Le CYP3A est une famille d’enzymes du foie qui métabolisent le vénétoclax. Les inhibiteurs puissants (posaconazole, voriconazole) augmentent son exposition : l’information professionnelle impose une adaptation, et Onkopedia propose 50 à 100 mg par jour avec le posaconazole. La conduite pratique est de revoir tous les antifongiques et les autres médicaments avant chaque palier.</p></template>
<template data-pop="c93-d-allogreffe" data-title="Allogreffe de cellules souches">
<p>Seule option curative des trois entités. Leucémie myélomonocytaire chronique : réservée au sujet jeune, en bon état et à haut risque ; survie d’environ 30 % à 3–4 ans. Leucémie aiguë : en première rémission si le risque est intermédiaire ou défavorable et si le patient est apte avec un donneur. Forme juvénile : conditionnement busulfan, cyclophosphamide, melphalan ; survie globale 55 à 73 %, mortalité liée à la greffe 10 à 15 %, rechute 25 à 35 %. Avant la greffe, le typage HLA et le statut cytomégalovirus sont déterminés.</p></template>
<template data-pop="pareto-c93-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="c93-0,c93-1,c93-2,c93-3,c93-4,c93-5,c93-6"></p><ul><li>C93 réunit trois maladies : forme aiguë (C93.0), chronique de l’adulte âgé (C93.1), juvénile (C93.3) ; M4 est codée C92.5.</li><li>Leucémie myélomonocytaire chronique : monocytes ≥ 0,5 G/l et ≥ 10 %, blastes &lt; 20 %, dysplasie ou clonalité ; ≥ 1 G/l : un critère de soutien ; 0,5–1 G/l : deux.</li><li>Forme dysplasique si leucocytes &lt; 13 G/l, proliférative sinon ; LMMC-1 (&lt; 5 % sang, &lt; 10 % moelle), LMMC-2 (5–19 % sang, 10–19 % moelle).</li><li>Incidence 0,5–1 pour 100 000, âge médian 76 ans ; forme juvénile 1,2 pour un million.</li><li>Plus de 90 % de mutations ; TET2 60 %, SRSF2 50 %, ASXL1 40 % ; cytométrie CD14 positif/CD16 négatif &gt; 94 %.</li><li>Clinique : rate, cytopénies, auto-immunité (20 %) ; infiltrats cutanés et gingivaux en leucémie aiguë.</li></ul></template>
<template data-pop="pareto-c93-diag" data-title="Pareto — Diagnostic et urgences"><p class="ratio" data-cover="c93-7,c93-8"></p><ul><li>Écarter d’abord la monocytose réactive, puis chercher dysplasie, clonalité, blastes.</li><li>BCR::ABL1 et KIT D816V se recherchent ; leucémie myéloïde chronique exclue de C93.1.</li><li>Urgences de la leucémie aiguë : leucostase (≈ &gt; 100 G/l, hydroxyurée, anthracycline si &lt; 30 G/l), lyse tumorale, coagulation intravasculaire disséminée.</li><li>Sous vénétoclax : leucocytes &lt; 25 G/l avant le début ; dosages biologiques autour de chaque palier.</li></ul></template>
<template data-pop="pareto-c93-ttt" data-title="Pareto — Traitements"><p class="ratio" data-cover="c93-9,c93-10,c93-11"></p><ul><li>Leucémie myélomonocytaire chronique : risque faible, surveillance et soutien ; risque élevé, hydroxyurée (proliférative) ou azacitidine 75 mg/m² × 7 jours / 28 jours, ≥ 6 cycles ; allogreffe seule curative.</li><li>Leucémie aiguë : 7+3 si apte ; CPX-351 si liée au traitement ; vénétoclax-azacitidine si non apte, avec moindre efficacité en différenciation monocytaire marquée ; allogreffe en première rémission.</li><li>Forme juvénile : allogreffe ; azacitidine avant la greffe ; surveillance possible en Noonan ou CBL germinal.</li></ul></template>
<template data-pop="pareto-c93-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="c93-12,c93-13,c93-14"></p><ul><li>Rémission complète : &lt; 5 % de blastes médullaires, neutrophiles ≥ 1 G/l, plaquettes ≥ 100 G/l, aucun blaste circulant.</li><li>Suivi de la leucémie myélomonocytaire chronique : hémogramme tous les 3 mois, moelle si progression suspectée.</li><li>Azacitidine contre-indiquée pendant la grossesse ; traitement intensif non recommandé après 75 ans biologiques.</li><li>Lacunes : seuils M5a/M5b, données suisses, ponction lombaire de l’adulte, révuménib en Suisse.</li></ul></template>
<template data-pop="pareto-c93-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="c93-e-1,c93-e-2,c93-e-3,c93-e-4,c93-e-5"></p><ul><li>Morphologie sanguine et médullaire, caryotype, imagerie de la rate : obligatoires ; histologie médullaire et cytométrie : recommandées.</li><li>Seuils : 0,5 G/l et 10 % ; blastes 5/10/20 % ; CD14 positif/CD16 négatif &gt; 94 % ; caryotype normal dans 80 %.</li><li>Leucémie aiguë : immunophénotype, panel NPM1, FLT3, CEBPA, KMT2A, coagulation, bilan d’aptitude, HLA.</li><li>Forme juvénile : hémoglobine fœtale, génétique de la voie RAS.</li></ul></template>
<template data-pop="pareto-c93-s-histo" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="c93-s-histo-body"></p><ul><li>Monoblaste, promonocyte (équivalent de blaste), monocyte.</li><li>Dysplasie &gt; 10 % d’une lignée ; sidéroblastes en couronne ; estérase non spécifique.</li><li>Seuils médullaires de blastes : 10 % et 20 %.</li></ul></template>
<template data-pop="pareto-c93-s-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="c93-s-gen-body"></p><ul><li>Plus de 90 % de mutations somatiques ; TET2 60 %, SRSF2 50 %, ASXL1 40 %, voie RAS 10–30 %.</li><li>Pronostic : ASXL1, NRAS, RUNX1, SETBP1 (CPSS-mol).</li><li>KMT2A : 5–15 % des leucémies aiguës myéloïdes, pronostic défavorable.</li></ul></template>
<template data-pop="pareto-c93-s-cyto" data-title="Pareto — Immunophénotype"><p class="ratio" data-cover="c93-s-cyto-body"></p><ul><li>CD14 positif/CD16 négatif &gt; 94 % : leucémie myélomonocytaire chronique.</li><li>Leucémie aiguë monocytaire : ≥ 2 marqueurs parmi CD11c, CD14, CD36, CD64, ou estérase non spécifique.</li><li>Phénotype monocytaire : moindre réponse au vénétoclax-azacitidine.</li></ul></template>
<template data-pop="pareto-c93-s-bioc" data-title="Pareto — Biochimie de la signalisation"><p class="ratio" data-cover="c93-s-bioc-body"></p><ul><li>PTPN11, NRAS, KRAS, NF1, CBL : plus de 90 % des formes juvéniles.</li><li>Tous activent la voie RAS.</li><li>Noonan et CBL germinal : régression spontanée possible.</li></ul></template>
<template data-pop="pareto-c93-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c93-p-1,c93-p-2,c93-p-3,c93-p-4,c93-p-5"></p><ul><li>Hydroxyurée : forme proliférative et leucostase ; azacitidine : trois entités ; décitabine : indication suisse limitée à la leucémie aiguë non éligible.</li><li>7+3 si apte ; CPX-351 si liée au traitement ; vénétoclax si non apte, CYP3A à adapter.</li><li>Grossesse : pas d’azacitidine ; lyse tumorale : leucocytes &lt; 25 G/l.</li></ul></template>
