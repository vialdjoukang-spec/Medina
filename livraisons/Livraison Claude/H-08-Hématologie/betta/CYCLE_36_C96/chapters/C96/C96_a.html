<section class="ilot" id="c96-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Trois patients consultent dans la même semaine. Une femme de 32 ans, fumeuse, souffre d’une toux sèche depuis des mois et d’un <b>pneumothorax spontané</b> ; le scanner thoracique montre des kystes à paroi mince et des nodules aux étages supérieurs. Un homme de 47 ans a perdu connaissance après une piqûre de guêpe ; il se plaint depuis des années de bouffées de chaleur et de démangeaisons, et sa tryptase de base dépasse 20 ng/ml. Un homme de 63 ans consulte pour une masse indolore de la cuisse, de 7 cm, qui a doublé de volume en quelques semaines, avec une perte de poids. Les trois tableaux n’ont aucun point commun clinique, et pourtant la CIM-10-GM 2024 les range sous la même catégorie, <b>C96</b>.</p><p>La raison tient à l’origine de la maladie : ces trois patients portent une prolifération maligne de cellules issues de la lignée myéloïde de la moelle, qu’il s’agisse d’une <button class="w" data-k="c96-clonal">cellule dendritique clonale</button> (histiocytose à cellules de Langerhans, abrégée HCL), d’un mastocyte muté (tumeur à mastocytes) ou d’un histiocyte malin (sarcome). C96 n’est donc pas une maladie, mais une <button class="w" data-k="c96-categorie">catégorie de codage</button> qui réunit trois familles aux conduites très différentes. Le tableau de la fumeuse de 32 ans se règle souvent par l’arrêt du tabac seul ; celui du patient de 47 ans se règle par l’adrénaline en urgence, puis par un bilan médullaire ; celui du patient de 63 ans exige une exérèse chirurgicale complète ou une chimiothérapie, avec un pronostic réservé.</p><div class="key"><b>Point de départ.</b> Devant une prolifération histiocytaire ou mastocytaire, la décision se prend en trois temps : prouver la lignée par l’immunohistochimie (CD1a et langerine pour la HCL, tryptase et KIT pour le mastocyte, CD163 pour l’histiocyte malin), définir l’extension (une lésion, un organe, plusieurs organes), puis chercher l’atteinte d’organe qui change le traitement.</div><p>Le chapitre suit une consultation réelle : codes et classification (îlots 1 et 2), mécanismes et causes (îlots 3 et 4), interrogatoire et examen (îlots 5 et 6), démarche diagnostique et urgences (îlots 7 et 8), traitement de chaque famille (îlots 9 à 12), suivi et situations particulières (îlots 13 et 14), critères formels (îlot 15). Les trois autres onglets développent les examens, les sciences fondamentales et la pharmacologie. Les <button class="w" data-k="c96-sources-guides">sources et leurs limites</button> sont rappelées dans la première fenêtre verte.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.3390/ijms26178554" target="_blank" rel="noopener">Sarcome histiocytaire, revue 2025</a>.</p></section>

<section class="ilot" id="c96-1"><h2><span class="n">1</span>Nosologie et sous-codes de la catégorie C96</h2><h3>Ce que contient C96</h3><p>La catégorie C96 de la CIM-10-GM 2024 porte l’intitulé « Sonstige und nicht näher bezeichnete bösartige Neubildungen des lymphatischen, blutbildenden und verwandten Gewebes » ; en français : tumeurs malignes des tissus lymphoïde, hématopoïétique et apparentés, autres et non précisées. Elle fonctionne comme un tiroir de codage. Les sous-codes se répartissent entre les trois familles du chapitre, et deux codes (C96.1 et C96.3) n’existent pas dans cette version.</p><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Famille et inclusions</th></tr><tr><td>C96.0</td><td>Histiocytose à cellules de Langerhans multifocale et multisystémique (disséminée)</td><td>HCL ; inclut la maladie d’Abt-Letterer-Siwe et l’histiocytose X multisystémique</td></tr><tr><td>C96.2</td><td>Tumeur maligne à mastocytes</td><td>Mastocytose ; inclut la mastocytose systémique agressive et le sarcome mastocytaire</td></tr><tr><td>C96.4</td><td>Sarcome à cellules dendritiques (cellules accessoires)</td><td>Sarcomes ; inclut les sarcomes à cellules de Langerhans, dendritiques folliculaires et dendritiques interdigitées</td></tr><tr><td>C96.5</td><td>Histiocytose à cellules de Langerhans multifocale et unisystémique</td><td>HCL ; inclut la maladie de Hand-Schüller-Christian</td></tr><tr><td>C96.6</td><td>Histiocytose à cellules de Langerhans unifocale</td><td>HCL ; inclut le granulome éosinophile</td></tr><tr><td>C96.7</td><td>Autres tumeurs malignes précisées des tissus lymphoïde, hématopoïétique et apparentés</td><td>Aucune note dans la source</td></tr><tr><td>C96.8</td><td>Sarcome histiocytaire</td><td>Sarcomes ; inclut l’histiocytose maligne</td></tr><tr><td>C96.9</td><td>Tumeur maligne des tissus lymphoïde, hématopoïétique et apparentés, sans précision</td><td>Aucune note dans la source</td></tr></table><p>Le tableau montre que le code d’une histiocytose à cellules de Langerhans dépend de son <b>extension</b> : une seule lésion donne C96.6, plusieurs lésions dans un seul système donnent C96.5, l’atteinte de plusieurs systèmes donne C96.0. Le médecin qui code doit donc connaître le bilan d’extension, ce qui rend l’étape diagnostique de l’îlot 7 décisive même pour un acte administratif.</p><h3>Ce qui n’est pas codé en C96</h3><p>Trois exclusions doivent être connues, car elles évitent une erreur de classement fréquente dans la mastocytose. La <b>mastocytose cutanée congénitale</b> relève de Q82.2, la <b>mastocytose systémique indolente</b> de D47.0 et la <b>leucémie à mastocytes</b> de C94.3-. Seuls la mastocytose systémique agressive et le sarcome mastocytaire reviennent donc à C96.2. Le tableau clinique d’une mastocytose indolente peut pourtant être bruyant (anaphylaxie, flush) : le code d’un diagnostic suit la nature de la maladie, non la gravité des symptômes.</p><div class="trap"><span class="k">Piège</span> Coder « C96.2 » toute mastocytose parce que le patient est symptomatique. La forme indolente est codée D47.0 et la leucémie à mastocytes C94.3-.</div><p>La version française des intitulés vient du fragment H-08 du dépôt MEDINA, établi d’après la CIM-10-GM 2024. La correspondance avec la CIM-11 n’est pas établie dans ce chapitre.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024 (BfArM)</a> ; Intitulés français de la CIM-10-GM 2024, fragment H-08 du dépôt MEDINA.</p></section>

<section class="ilot" id="c96-2"><h2><span class="n">2</span>Épidémiologie</h2><h3>Histiocytose à cellules de Langerhans</h3><p>Le registre national anglais de 2013 à 2019 (658 patients, dont 49 % de moins de 15 ans) donne une <b>incidence standardisée de 4,46 par million d’enfants</b> et de <b>1,06 par million d’adultes</b> de 15 ans et plus, pour une prévalence de 9,95 par million. La survie à un an est de 99 % chez l’enfant et de 90 % chez l’adulte ; elle est plus faible après 60 ans (rapport de risque de 22,1 par rapport aux moins de 15 ans). Le consensus de l’adulte de 2022 évalue l’incidence adulte à 1 à 1,5 par million et par an. La forme pulmonaire isolée touche l’adulte jeune, fumeur dans plus de 90 % des cas, avec un pic entre 20 et 40 ans et une légère prédominance féminine.</p><h3>Tumeur à mastocytes</h3><p>Le guide Onkopedia indique, pour la mastocytose systémique, une fréquence d’environ 1 pour 100 000 pour la forme indolente et de 1 à 2 par million pour la forme avancée. La forme non avancée s’observe surtout entre 20 et 40 ans, la forme avancée entre 60 et 70 ans, avec une prédominance masculine ; la forme indolente représente environ 65 % des cas.</p><h3>Sarcome histiocytaire</h3><p>Le sarcome histiocytaire est une néoplasie extrêmement rare : moins de 0,17 par million. Il apparaît surtout entre la sixième et la septième décennie, avec une légère prédominance masculine.</p><div class="key"><b>À retenir.</b> Aucune donnée d’incidence suisse n’a été lue pour ces entités. Les chiffres du chapitre viennent d’Angleterre pour l’HCL, d’un guide germano-austro-suisse pour la mastocytose et d’une revue internationale pour le sarcome histiocytaire.</div><p class="src">Références : <a href="https://doi.org/10.1111/bjh.18459" target="_blank" rel="noopener">Registre anglais, 2022</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.3390/ijms26178554" target="_blank" rel="noopener">Sarcome histiocytaire, revue 2025</a>.</p></section>

<section class="ilot" id="c96-3"><h2><span class="n">3</span>Mécanismes : de la cellule normale à la cellule tumorale</h2><h3>Histiocytose à cellules de Langerhans : une néoplasie clonale</h3><p>Pendant des décennies, l’HCL a été considérée comme une réaction inflammatoire, car les lésions contiennent beaucoup de cellules non tumorales (éosinophiles, lymphocytes). La biologie moléculaire a modifié ce jugement : l’HCL est une <button class="w" data-k="c96-clonal">néoplasie de cellules dendritiques clonales</button>. Une mutation associée au cancer, <b>BRAF V600E</b>, est présente dans plus de la moitié des échantillons (environ 50 % selon le consensus de 2022). Dans les cas sauvages pour BRAF, d’autres altérations de la <button class="w" data-k="c96-mapk">voie MAPK</button> (RAS-RAF-MEK-ERK) sont retrouvées, ainsi que des fusions de kinases et, plus rarement, des altérations de la voie PI3K-AKT-mTOR. La classification internationale place l’HCL dans le « groupe L » des histiocytoses, avec la maladie d’Erdheim-Chester.</p><p>La forme pulmonaire isolée illustre le lien entre tabac et clonalité : les lésions portent des altérations de MAPK dans 85 % des cas (BRAF V600E dans 36 à 50 %), ce qui plaide pour un processus clonal malgré l’association quasi constante au tabac. Le sarcome à cellules de Langerhans, lui, s’en distingue par des atypies franchement malignes et des gains ou pertes chromosomiques fréquents ; l’HCL a en général un caryotype normal et moins de cinq mutations somatiques.</p><h3>Mastocytose : un récepteur toujours allumé</h3><p>Le mastocyte normal prolifère quand son récepteur <button class="w" data-k="c96-kit">KIT</button> se lie au facteur de cellules souches (SCF). Dans la mastocytose, une mutation de KIT est présente dans plus de 90 % des cas de mastocytose systémique, et la variante <b>D816V</b> dans plus de 95 % de ces cas : le récepteur s’active sans SCF, ce qui provoque une expansion clonale de mastocytes qui s’accumulent dans la peau, la moelle, la rate, le foie et le tube digestif. Les mastocytes libèrent histamine, héparine, tryptase, chymase, TNF-α, chimiokines et prostanoïdes ; la tryptase est en partie sécrétée de façon constitutive, ce qui explique sa mesure en dehors de toute crise.</p><p>Deux mécanismes de symptômes coexistent et il faut les distinguer. Dans les formes non avancées, les symptômes viennent surtout de la <b>libération de médiateurs</b> (flush, prurit, anaphylaxie). Dans la forme avancée, ils viennent surtout de l’<b>infiltration et de la dysfonction d’organe</b>, définie par les « C-findings » de l’îlot 7 ; des mutations somatiques additionnelles existent alors dans 60 à 80 % des cas.</p><h3>Sarcome histiocytaire : une lignée mature, une voie MAPK altérée</h3><p>Le sarcome histiocytaire a le phénotype d’un histiocyte mature. La voie MAPK est altérée dans 57 à 90 % des cas (gènes MAP2K1, BRAF, KRAS), avec des altérations de CDKN2A (39 à 46 %) et de TP53 (24 %). Il peut être secondaire, par transdifférenciation d’un lymphome folliculaire, d’une leucémie lymphoïde chronique ou d’une leucémie ou d’un lymphome lymphoblastique ; le pronostic est alors plus mauvais.</p><div class="key"><b>Corrélation clinique.</b> La mutation BRAF V600E explique à la fois le diagnostic moléculaire (recherche chez tous les patients) et une option thérapeutique (inhibiteurs de BRAF et de MEK). La mutation KIT D816V explique le critère diagnostique mineur de la mastocytose ; en Suisse, la midostaurine (mastocytose systémique avancée) et l’avapritinib (mastocytose avancée après un premier traitement systémique) sont les inhibiteurs de kinase dont l’information professionnelle a été lue.</div><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.3390/ijms26178554" target="_blank" rel="noopener">Sarcome histiocytaire, revue 2025</a>.</p></section>

<section class="ilot" id="c96-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Les sources lues ne décrivent aucune cause environnementale établie des trois familles. Les facteurs associés sont les suivants.</p><ul><li><b>Tabac</b> : la forme pulmonaire isolée de l’HCL touche des fumeurs dans plus de 90 % des cas ; l’arrêt du tabac, y compris du cannabis et du vapotage, est la mesure de base et souvent la seule nécessaire.</li><li><b>Mutation BRAF V600E</b> : associée à davantage de seconds cancers, souvent hématologiques, chez l’adulte atteint d’HCL ; plus généralement, l’HCL est associée à d’autres cancers (néoplasies myéloïdes, lymphomes, cancers du poumon et de la thyroïde).</li><li><b>Alpha-tryptasémie héréditaire</b> (<button class="w" data-k="c96-hat">HαT</button>) : trait génétique présent chez environ 5 % de la population, transmis sur le mode autosomique dominant, 2 à 3 fois plus fréquent dans la mastocytose systémique ; il élève la tryptase de base sans que ce soit une mastocytose.</li><li><b>Hyménoptères</b> : la piqûre n’est pas la cause de la mastocytose, mais le déclencheur le plus cité de l’anaphylaxie des patients mastocytaires.</li><li><b>Néoplasie lymphoïde préalable</b> : lymphome folliculaire, leucémie lymphoïde chronique et leucémies lymphoblastiques peuvent se transdifférencier en sarcome histiocytaire.</li><li><b>Virus d’Epstein-Barr</b> : la variante du sarcome dendritique folliculaire de type pseudotumeur inflammatoire est positive pour ce virus et touche surtout le foie et la rate.</li></ul><div class="trap"><span class="k">Piège</span> Interpréter une tryptase de base élevée comme une mastocytose sans considérer l’<button class="w" data-k="c96-hat">HαT</button>. Le dosage s’interprète après division par (1 + nombre de copies alpha supplémentaires) ; l’HαT doit être exclue avant la biopsie médullaire si la tryptase est dans la zone grise (inférieure à 20 µg/l).</div><p class="src">Références : <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2023021212" target="_blank" rel="noopener">BRAF V600E et seconds cancers, 2023</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.1097/HS9.0000000000000646" target="_blank" rel="noopener">Critères ECNM, Valent et coll., 2021</a> ; <a href="https://doi.org/10.3390/ijms26178554" target="_blank" rel="noopener">Sarcome histiocytaire, revue 2025</a> ; <a href="https://doi.org/10.3389/fimmu.2026.1685017" target="_blank" rel="noopener">Sarcome dendritique folliculaire et maladie liée aux IgG4, 2026</a>.</p></section>

<section class="ilot" id="c96-5"><h2><span class="n">5</span>Interroger</h2><h3>Antécédents à rechercher</h3><p>L’interrogatoire cherche les marqueurs d’un syndrome d’HCL passé inaperçu : un <b>« eczéma idiopathique »</b> ancien, une maladie thyroïdienne, un <button class="w" data-k="c96-di">diabète insipide</button>, des kystes pulmonaires ou un pneumothorax, des lésions osseuses. Le tabagisme est quantifié. Pour la mastocytose, on recherche l’anaphylaxie après piqûre d’hyménoptère, les épisodes de flush et de syncope, les intolérances alimentaires (aliments riches en histamine) et les fractures.</p><h3>Symptômes de l’histiocytose à cellules de Langerhans de l’adulte</h3><p>Les symptômes les plus fréquents sont la dyspnée, la toux, la douleur osseuse, la tuméfaction des tissus mous en regard d’un os, l’éruption, le prurit, l’augmentation de la soif et les adénopathies. Des signes généraux sont possibles : fatigue, perte de poids, sueurs nocturnes, fièvre. La soif accrue avec polyurie évoque l’atteinte hypothalamo-hypophysaire. Une <button class="w" data-k="c96-plch">forme pulmonaire</button> est asymptomatique dans environ 20 % des cas et révélée par un pneumothorax dans environ 20 % des cas.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Une femme de 32 ans fumeuse décrit une toux sèche, une dyspnée d’effort et une douleur thoracique brusque : le pneumothorax révèle des kystes pulmonaires. Le scanner montre des nodules, des nodules excavés puis des kystes, prédominant aux étages moyen et supérieur. L’arrêt du tabac est la première mesure.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Une éruption du cuir chevelu prise pour une dermite séborrhéique ; une atteinte intertrigineuse prise pour un eczéma, un psoriasis ou une candidose ; des dents mobiles par atteinte de l’os alvéolaire ; un diabète insipide isolé. Dans ces situations, la biopsie cutanée ou osseuse est la seule voie vers le diagnostic.</p></div></div><h3>Symptômes de la mastocytose</h3><p>Le guide Onkopedia classe les manifestations par système. La peau : prurit, flush, urticaire. Le tube digestif : nausées, vomissements, ulcères, diarrhée, crampes, intolérances alimentaires. Le système cardiovasculaire : syncope, vertiges, palpitations et <button class="w" data-k="c96-anaphylaxie">anaphylaxie</button>, surtout après piqûre d’hyménoptère, jusqu’au choc. Les autres manifestations sont des douleurs osseuses diffuses, une ostéopénie ou une ostéoporose, de la fatigue et des symptômes neurologiques. Les fréquences de ces symptômes ne sont pas chiffrées dans la source lue.</p><h3>Symptômes du sarcome</h3><p>Le sarcome histiocytaire se présente par une <b>masse indolore</b> (taille médiane de 6,8 cm) accompagnée de signes généraux. Le siège est extraganglionnaire dans la plupart des cas : tissus mous, peau, poumon, tube digestif, système nerveux central, rate ; les ganglions sont atteints dans 14 % des cas.</p><div class="trap"><span class="k">Piège</span> Se rassurer devant le caractère indolore d’une masse. L’absence de douleur ne diminue pas la probabilité d’un sarcome histiocytaire ; la croissance rapide et les signes généraux orientent vers la biopsie.</div><div class="key"><b>À retenir.</b> Trois histoires, trois portes d’entrée : l’éruption, la dyspnée ou la douleur osseuse chez le sujet fumeur (HCL) ; le flush, la syncope et l’anaphylaxie après piqûre (mastocytose) ; la masse indolore à croissance rapide (sarcome). Un diabète insipide nouveau chez l’adulte signe une maladie active.</div><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.3390/ijms26178554" target="_blank" rel="noopener">Sarcome histiocytaire, revue 2025</a>.</p></section>

<section class="ilot" id="c96-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen suit l’ordre habituel : état général, signes vitaux, peau et muqueuses, cavité buccale, aires ganglionnaires, abdomen, os, puis examen ciblé de l’organe suspecté. Il vise deux objectifs : repérer la lésion qui se biopsie le plus facilement, et mesurer la tolérance (hémorragie, atteinte hépatique ou splénique, signe neurologique).</p><h3>La peau et la bouche</h3><p>La peau est la « grande imitatrice » de l’HCL. Les lésions du cuir chevelu sont des papules translucides rose-jaune de 1 à 2 mm, squameuses ou croûteuses ; les plis donnent un tableau intertrigineux. La <b>biopsie est indispensable</b> et suivie d’une recherche d’atteinte systémique. En bouche, l’atteinte gingivale s’accompagne d’une atteinte de l’os alvéolaire et de dents mobiles ; l’extraction dentaire doit être évitée. Dans la mastocytose, le <button class="w" data-k="c96-darier">signe de Darier</button> est positif.</p><h3>Les organes</h3><ul><li><b>Foie et rate</b> : l’hépatomégalie et la splénomégalie sont mesurées en centimètres sous le rebord costal, car les seuils de l’atteinte d’<button class="w" data-k="c96-organes-risque">organe à risque</button> chez l’enfant sont de 3 cm sous le rebord.</li><li><b>Thyroïde et hypophyse</b> : la thyroïde figure parmi les sites « autres » de l’HCL unisystémique ; la polyurie et la soif orientent vers un diabète insipide.</li><li><b>Os</b> : tuméfaction douloureuse des tissus mous en regard d’un os ; une lésion osseuse reste douloureuse chez la moitié des patients adultes, même après normalisation de l’imagerie fonctionnelle.</li><li><b>Poumon</b> : la forme pulmonaire donne toux sèche, dyspnée et douleur thoracique, mais environ 20 % des patients n’ont aucun symptôme ; un pneumothorax révèle environ 20 % des cas.</li><li><b>Système nerveux</b> : tremblement, dysarthrie, ataxie et troubles du comportement évoquent une <button class="w" data-k="c96-hcl-neuro">forme neurodégénérative</button>.</li></ul><table class="t"><tr><th>Signe</th><th>Mécanisme</th><th>Ce qu’il oriente</th></tr><tr><td>Papules du cuir chevelu, éruption intertrigineuse</td><td>Infiltration cutanée par des cellules de Langerhans</td><td>HCL ; biopsie</td></tr><tr><td>Signe de Darier</td><td>Libération locale de médiateurs par les mastocytes cutanés</td><td>Mastocytose</td></tr><tr><td>Dents mobiles, gingivite atypique</td><td>Atteinte de l’os alvéolaire</td><td>HCL osseuse</td></tr><tr><td>Hépatosplénomégalie</td><td>Infiltration d’organe</td><td>Organe à risque (enfant) ; atteinte d’organe de la mastocytose avancée</td></tr><tr><td>Soif et polyurie</td><td>Déficit en hormone antidiurétique</td><td>Atteinte hypothalamo-hypophysaire</td></tr><tr><td>Masse indolore volumineuse</td><td>Prolifération tumorale à croissance rapide</td><td>Sarcome histiocytaire</td></tr></table><p>Le tableau associe chaque signe à son mécanisme ; il ne remplace jamais la biopsie. Un examen normal n’écarte aucune des trois familles : la forme pulmonaire est asymptomatique dans 20 % des cas et la mastocytose indolente peut n’avoir aucun signe physique.</p><div class="trap"><span class="k">Piège</span> Considérer que la mastocytose indolente est sans risque vital : l’anaphylaxie peut aller jusqu’au choc, d’où l’importance de la trousse d’urgence avec auto-injecteur d’adrénaline décrite à l’îlot 11.</div><div class="key"><b>À retenir.</b> L’examen repère le site à biopsier et mesure la tolérance ; il ne pose pas le diagnostic. La polyurie, une hépatosplénomégalie ou une masse à croissance rapide changent l’urgence du bilan.</div><p class="src">Références : <a href="https://doi.org/10.1186/1750-1172-8-72" target="_blank" rel="noopener">Euro-Histio-Net, adulte, 2013</a> ; <a href="https://doi.org/10.1182/blood.2021014343" target="_blank" rel="noopener">Histiocyte Society, adulte, 2022</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/mastozytose-systemische/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, mastocytose systémique, 2024</a> ; <a href="https://doi.org/10.1002/pbc.24367" target="_blank" rel="noopener">Euro-Histio-Net, enfant, 2013</a>.</p><button class="pareto-btn ui" data-k="pareto-c96-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
