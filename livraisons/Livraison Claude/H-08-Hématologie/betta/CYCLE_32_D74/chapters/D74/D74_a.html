<section class="ilot" id="d74-0"><h2><span class="n">0</span>Question clinique</h2><p>Le cas qui ouvre ce chapitre est un cas réel, publié par l’hôpital fribourgeois (HFR) en 2025. Un homme de 37 ans a avalé par erreur 13 ml de nitrite d’alkyle, produit vendu comme « poppers ». À l’arrivée, il est cyanosé, la <button class="w" data-k="d74-pulsoxymetrie">saturation pulsée en oxygène</button> (SpO2) ne dépasse pas 75 % malgré 15 litres d’oxygène par minute, la fréquence cardiaque atteint 110 par minute et la conscience reste normale (score de Glasgow à 15). La gazométrie sur sang artériel donne une pression partielle d’oxygène (PaO2) de 30,5 kPa, une saturation calculée de 99 %, une oxyhémoglobine mesurée de 69 % et une <button class="w" data-k="d74-methb-def">méthémoglobine</button> (MetHb) de 30,3 %.</p><p>Ces chiffres se contredisent en apparence : le poumon oxygène très bien le sang (PaO2 élevée), pourtant le patient manque d’oxygène. La contradiction s’appelle <button class="w" data-k="d74-saturation-gap">saturation gap</button> : la saturation mesurée sur le doigt, ou la saturation réellement portée par l’oxyhémoglobine, est basse alors que la PaO2 et la saturation calculée sont normales ou élevées. <b>La question décisive est donc la suivante : le sang transporte-t-il encore l’oxygène que le poumon lui a donné ?</b> Ici, près d’un tiers de l’hémoglobine est devenue incapable de le faire.</p><p>Le traitement a suivi la logique du mécanisme. Le patient a reçu 1 mg/kg de <button class="w" data-k="d74-bleu-methylene">bleu de méthylène</button> ; la méthémoglobine est tombée de 30,3 % à 12,3 % en 30 minutes, puis à 0,9 % au premier jour. Le Centre suisse d’information toxicologique (Tox Info Suisse) avait été appelé et avait conseillé un contrôle de la gazométrie toutes les 30 minutes.</p><div class="key"><b>Point de départ.</b> Une cyanose qui ne cède pas à l’oxygène, une saturation au doigt basse et une PaO2 normale imposent de doser la méthémoglobine par <button class="w" data-k="d74-co-oxymetrie">CO-oxymétrie</button>, d’interroger sur l’exposition à un oxydant et de chercher un déficit en <button class="w" data-k="d74-g6pd">G6PD</button> avant le bleu de méthylène.</div><p>Le chapitre suit l’ordre d’une prise en charge : comprendre ce que devient le fer de l’hémoglobine (îlots 1 à 4), reconnaître les causes, interroger et examiner (îlots 5 à 7), poser le diagnostic et juger la gravité (îlots 8 et 9), traiter (îlots 10 à 12), puis distinguer les formes héréditaires et les situations particulières (îlots 13 à 15).</p><p class="src">Références : <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>, présentation du cas et tableaux 1 et 2 ; <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>.</p></section>
<section class="ilot" id="d74-1"><h2><span class="n">1</span>Définition et codes</h2><p>La méthémoglobinémie est l’oxydation du fer de l’hème : le fer ferreux (Fe2+) devient fer ferrique (Fe3+), et l’hémoglobine ainsi modifiée s’appelle méthémoglobine. Ce fer oxydé ne peut plus lier l’oxygène. Il en résulte ce que l’<button class="w" data-k="d74-sources">EHA</button> nomme une « anémie fonctionnelle » : la concentration d’hémoglobine est normale, mais une partie de l’hémoglobine ne transporte rien.</p><p>La quantité de méthémoglobine s’exprime en pourcentage de l’hémoglobine totale. C’est ce pourcentage, et non la valeur absolue, qui sert à classer la gravité ; la valeur absolue en g/dl intervient en revanche pour comprendre quand la cyanose devient visible (îlot 2).</p><table class="t"><tr><th>Code CIM-10-GM 2024</th><th>Intitulé</th><th>Ce que le code recouvre</th></tr><tr><td><button class="w" data-k="d74-codes">D74.0</button></td><td>Méthémoglobinémie congénitale</td><td>Déficit congénital en NADH-méthémoglobine-réductase, maladie à hémoglobine M, méthémoglobinémie héréditaire</td></tr><tr><td>D74.8</td><td>Autres méthémoglobinémies</td><td>Méthémoglobinémie acquise (avec sulfhémoglobinémie), méthémoglobinémie toxique ; un code supplémentaire du chapitre des causes externes précise l’agent</td></tr><tr><td>D74.9</td><td>Méthémoglobinémie, sans précision</td><td>Situation où ni l’origine ni la forme ne sont établies</td></tr></table><p>La catégorie D74 elle-même ne comporte aucune inclusion ni exclusion. Le tableau montre que le classement CIM répartit les cas selon l’origine : héréditaire pour D74.0, acquise ou toxique pour D74.8. Cette distinction commande tout le reste du chapitre, parce que le traitement d’une forme acquise (retirer l’agent, donner le bleu de méthylène) n’est pas celui d’une forme héréditaire.</p><div class="key"><b>À retenir.</b> Méthémoglobinémie = fer ferrique incapable de lier l’oxygène. Hémoglobine totale normale, transport d’oxygène réduit. La CIM sépare la forme congénitale (D74.0) des formes acquises et toxiques (D74.8).</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a>, catégorie D74 ; <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>, introduction.</p></section>
<section class="ilot" id="d74-2"><h2><span class="n">2</span>Du fer normal au fer oxydé</h2><h3>Une oxydation physiologique, corrigée en permanence</h3><p>Dans le sang d’un sujet sain, moins de 1 % de l’hémoglobine est sous forme de méthémoglobine selon l’<button class="w" data-k="d74-sources">EHA</button> ; l’article fribourgeois retient environ 1 %, Swissmedic environ 2 %, et le laboratoire du cas cité donne une limite supérieure de 1,2 %. Ces valeurs diffèrent d’une source à l’autre, ce qui rappelle que la valeur de référence est celle du laboratoire qui mesure.</p><p>Cette fraction n’est pas nulle parce que la méthémoglobine se forme normalement. Quand l’hémoglobine libère son oxygène, celui-ci quitte la poche de l’hème sous forme d’anion superoxyde et emporte un électron du fer, qui passe à l’état ferrique. La machinerie enzymatique du globule rouge réduit ensuite ce fer. Deux voies existent :</p><ul><li>la voie principale repose sur la <button class="w" data-k="d74-cyb5r">NADH-cytochrome b5 réductase</button>, appelée CYB5R ou « diaphorase NADH » ;</li><li>une voie accessoire repose sur la <button class="w" data-k="d74-voie-nadph">NADPH-méthémoglobine réductase</button>. Elle dépend du NADPH que produit la voie des pentoses phosphates, dont la première enzyme est la <button class="w" data-k="d74-g6pd">G6PD</button> ; c’est la seule source de NADPH dans le globule rouge. Cette voie est peu active en temps normal et devient efficace en présence de bleu de méthylène.</li></ul><p>Tant que ces systèmes fonctionnent, la fraction oxydée reste faible. La méthémoglobinémie apparaît quand un oxydant en forme plus vite que la réductase n’en élimine, ou quand la réductase est déficiente, ou quand l’hémoglobine elle-même est anormale.</p><h3>Pourquoi le sang transporte moins d’oxygène</h3><p>Le fer ferrique ne transporte pas l’oxygène. Il y a de plus un effet indirect : dans un même tétramère d’hémoglobine, les sous-unités restées ferreuses ont une affinité accrue pour l’oxygène. La <button class="w" data-k="d74-courbe">courbe de dissociation de l’oxyhémoglobine</button> se déplace donc vers la gauche et les sous-unités encore fonctionnelles cèdent moins facilement leur oxygène aux tissus. Le déficit de transport s’ajoute à un déficit de libération : l’hypoxie tissulaire dépasse ce que la seule fraction oxydée laisserait prévoir.</p><h3>Ce qui fait varier la gravité</h3><p>Quatre éléments se combinent : le pourcentage de méthémoglobine, la vitesse à laquelle il s’élève, la capacité propre du patient à l’éliminer, et son état fonctionnel. Un patient anémique, insuffisant cardiaque ou atteint de bronchopneumopathie chronique obstructive (BPCO), ou toute pathologie qui réduit déjà la délivrance d’oxygène, supporte donc moins bien un même taux. Une intoxication associée au monoxyde de carbone aggrave encore la situation.</p><p>La cyanose, elle, dépend de la quantité absolue de méthémoglobine, au-delà de 1,5 g/dl, et non du pourcentage. Calcul de l’auteur de ce cours à partir de ce seuil : à 15 g/dl d’hémoglobine totale, 1,5 g/dl représentent 10 % ; à 8 g/dl, ils représentent environ 19 %. Un patient anémique doit donc dépasser un pourcentage plus élevé avant de paraître cyanosé, alors que sa tolérance est plus faible : l’absence de cyanose franche ne rassure pas chez lui.</p><div class="trap"><span class="k">Piège</span> Chez le nourrisson, la machinerie de réduction est moins efficace : l’activité de la CYB5R atteint seulement 50 à 60 % des valeurs adultes, l’hémoglobine fœtale s’oxyde plus facilement, et la NADPH-méthémoglobine-réductase est plus faible avant l’âge de 3 mois. Une dose d’oxydant tolérée par un adulte peut donc produire un taux dangereux chez un nourrisson.</div><div class="key"><b>À retenir.</b> Le fer s’oxyde et se réduit en permanence ; la maladie apparaît quand l’oxydation dépasse la réduction. La gravité tient au taux, à sa vitesse d’élévation, à la capacité d’élimination et au terrain. La déviation à gauche de la courbe de dissociation ajoute un défaut de libération au défaut de transport.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>, questions 1 à 3 ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a>, p. 2 à 3 ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>, pharmacodynamique et nourrissons ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>, discussion.</p></section>
<section class="ilot" id="d74-3"><h2><span class="n">3</span>Formes acquises et héréditaires</h2><p>Les formes acquises sont de loin les plus fréquentes : une substance oxyde l’hémoglobine directement ou indirectement. Les formes héréditaires relèvent soit de variants autosomiques récessifs du gène <i>CYB5R3</i>, soit de variants autosomiques dominants des gènes de globine, qui produisent une hémoglobine M. Le tableau reprend la classification du consensus européen.</p><table class="t"><tr><th>Forme</th><th>Transmission et gène</th><th>Méthémoglobine</th><th>Activité de la CYB5R</th><th>Électrophorèse ou HPLC</th><th>Particularité clinique</th></tr><tr><td>Acquise</td><td>Aucune ; exposition</td><td>Variable</td><td>Normale</td><td>Normale</td><td>Début récent, exposition retrouvée</td></tr><tr><td><button class="w" data-k="d74-types">Type I</button></td><td>Récessive, <i>CYB5R3</i></td><td>20 à 30 %</td><td>Diminuée</td><td>Normale</td><td>Cyanose isolée dès la naissance</td></tr><tr><td><button class="w" data-k="d74-types">Type II</button></td><td>Récessive, <i>CYB5R3</i></td><td>8 à 40 %</td><td>Diminuée</td><td>Normale</td><td>Atteinte neurologique sévère</td></tr><tr><td><button class="w" data-k="d74-types">Type IV</button></td><td>Récessive, <i>CYB5A</i></td><td>12 à 19 %</td><td>Normale</td><td>Normale</td><td>Anomalie du développement sexuel 46,XY, organes génitaux ambigus</td></tr><tr><td><button class="w" data-k="d74-hbm">Hémoglobine M</button></td><td>Dominante, <i>HBA1/2</i>, <i>HBB</i>, <i>HBG1/2</i></td><td>12 à 25 %</td><td>Normale</td><td>Anormale</td><td>Cyanose dès la naissance (chaîne α) ou après 6 à 9 mois (chaîne β)</td></tr><tr><td>Hémoglobine instable</td><td>Dominante, mêmes gènes</td><td>Variable, selon le facteur de stress</td><td>Normale</td><td>Normale ou anormale</td><td>Anémie hémolytique</td></tr></table><p>La colonne de l’activité de la réductase et celle de l’électrophorèse sont les deux colonnes qui orientent le diagnostic : une activité diminuée désigne le déficit enzymatique (types I et II), une électrophorèse anormale désigne une hémoglobine mutante, et deux colonnes normales avec une méthémoglobine élevée font penser à une cause acquise ou à un type IV, dont l’ambiguïté génitale est le signe distinctif. La sulfhémoglobinémie est rattachée à D74.8 par la CIM ; elle ne répond pas au bleu de méthylène (<button class="w" data-k="d74-sulfhb">fenêtre</button>).</p><div class="key"><b>À retenir.</b> Acquise : fréquente, début récent, réductase normale. Héréditaire : cyanose ancienne ; déficit de réductase (types I, II et IV) ou hémoglobine M, qui seule modifie l’électrophorèse et ne répond ni au bleu de méthylène ni à l’acide ascorbique.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a>, tableau 2 ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a>.</p></section>
<section class="ilot" id="d74-4"><h2><span class="n">4</span>Épidémiologie</h2><p>La méthémoglobinémie est une maladie rare. Les formes acquises dominent ; les médicaments le plus souvent en cause sont la benzocaïne et la lidocaïne. Pour les formes héréditaires, le type I de déficit en CYB5R3 atteint jusqu’à 1 sur 1000 dans certaines populations isolées porteuses d’une mutation fondatrice, et il est décrit comme endémique dans certaines populations des États-Unis et de Russie ; plus de 80 variants de <i>CYB5R3</i> sont rapportés.</p><p>En Suisse, aucune incidence de la méthémoglobinémie acquise n’a été trouvée dans les sources lues. L’article fribourgeois rapporte, de seconde main, que la prévalence d’usage des <button class="w" data-k="d74-poppers">poppers</button> était de 0,2 % en 2016 et que les inhalants occupaient le quatrième rang des substances chez les jeunes de 15 ans en 2010. Les nitrites d’alkyle sont interdits à la vente pour inhalation, mais leur détention personnelle n’est pas sanctionnée.</p><div class="key"><b>À retenir.</b> Maladie rare, surtout acquise. Agents classiques : benzocaïne et lidocaïne. La fréquence suisse n’est pas établie par les sources consultées ; elle ne doit pas être chiffrée.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>, introduction ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-d70-d77.htm" target="_blank" rel="noopener">CIM-10-GM 2024, BfArM</a>.</p></section>
<section class="ilot" id="d74-5"><h2><span class="n">5</span>Causes des formes acquises</h2><p>Une cause se cherche toujours : une méthémoglobinémie acquise est presque toujours l’effet d’un agent identifiable. Le tableau regroupe les agents par catégorie ; les médicaments inducteurs causent souvent aussi une hémolyse, ce qui justifie de chercher un déficit en <button class="w" data-k="d74-g6pd">G6PD</button>.</p><table class="t"><tr><th>Catégorie</th><th>Agents cités par les sources</th><th>Remarque utile</th></tr><tr><td><button class="w" data-k="d74-anesthesiques">Anesthésiques locaux</button></td><td>Benzocaïne, prilocaïne, lidocaïne, tétracaïne, articaïne ; cocaïne coupée</td><td>Crème Emla® : voir la fenêtre sur le cas suisse d’institut esthétique</td></tr><tr><td>Nitrites et nitrates</td><td>Nitroglycérine, nitroprussiate, nitrite d’amyle et d’isobutyle (<button class="w" data-k="d74-poppers">poppers</button>), nitrite de sodium, monoxyde d’azote inhalé, eau de puits contaminée, aliments</td><td>Le nitrite de sodium utilisé contre le cyanure est lui-même méthémoglobinisant</td></tr><tr><td>Anti-infectieux et autres médicaments</td><td><button class="w" data-k="d74-dapsone">Dapsone</button>, sulfamides, sulfaméthoxazole, triméthoprime, chloroquine, primaquine, phénazopyridine, phénacétine, <button class="w" data-k="d74-rasburicase">rasburicase</button>, cyclophosphamide, flutamide, métoclopramide</td><td>La rasburicase est contre-indiquée en cas de déficit en G6PD</td></tr><tr><td>Toxiques industriels</td><td>Aniline et colorants, naphtalène, aminophénols, chlorates, bromates, herbicides, pesticides (paraquat, monolinuron), chloramines</td><td>Décontamination et protection du personnel si pesticide</td></tr><tr><td>Récréatifs</td><td>Poppers, protoxyde d’azote</td><td>Taux supérieurs à 90 % et décès décrits</td></tr><tr><td>Bleu de méthylène</td><td>À forte dose, l’antidote devient lui-même oxydant</td><td>Voir îlot 11</td></tr><tr><td>Nouveau-né en soins intensifs</td><td>Monoxyde d’azote inhalé</td><td>Méthémoglobine supérieure à 5 % chez 1 nouveau-né sur 163 et de 2,5 à 5 % chez 16 sur 163</td></tr></table><p>Le tableau se lit en deux temps. Le premier est la recherche de l’exposition récente, parce qu’elle commande le geste immédiat (retirer l’agent). Le second est la recherche d’un facteur de terrain : l’âge (nourrisson), la <button class="w" data-k="d74-g6pd">G6PD</button>, une pathologie qui réduit déjà le transport d’oxygène.</p><p>Deux observations récentes de la littérature suisse élargissent le champ, avec la réserve qu’elles proviennent de résumés et de cas isolés. Un cas zurichois décrit une obstruction de la pompe Impella avec hémolyse massive repérée par une méthémoglobine à 10,2 % ; la notion demande à être validée. Une revue zurichoise des cas de COVID-19 grave décrit des élévations de méthémoglobine, en discutant le rôle des médicaments et du statut en G6PD.</p><div class="key"><b>À retenir.</b> Chercher l’agent avant le laboratoire : anesthésique local, nitrite, dapsone, rasburicase, toxique industriel, drogue récréative. Chez le nourrisson et en cas de déficit en G6PD, la sensibilité est accrue.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a> ; <a href="https://www.swissmedic.ch/dam/swissmedic/de/dokumente/marktueberwachung/vigilance/vigilance-news_juni2011.pdf.download.pdf/vigilance-news_juni2011.pdf" target="_blank" rel="noopener">Swissmedic, Vigilance-News, juin 2011</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680529800119" target="_blank" rel="noopener">Emla®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680557890014" target="_blank" rel="noopener">Fasturtec®, information professionnelle suisse</a> ; <a href="https://doi.org/10.1097/MAT.0000000000002856" target="_blank" rel="noopener">Schmidt et coll., Triemli, 2026 (résumé)</a> ; <a href="https://doi.org/10.3390/jcm10010050" target="_blank" rel="noopener">Scholkmann et coll., Zurich, 2020 (résumé)</a>.</p></section>
<section class="ilot" id="d74-6"><h2><span class="n">6</span>Interroger</h2><p>L’interrogatoire décide souvent du diagnostic avant tout examen. Il vise l’exposition, le terrain et le caractère récent ou ancien de la cyanose.</p><ul><li><b>Exposition.</b> Médicaments (anesthésique local, dapsone, sulfamide, rasburicase, nitrate), toxiques professionnels ou ménagers, aliments et eau de puits, drogues récréatives. La durée et la quantité d’exposition sont notées.</li><li><b>Chronologie.</b> Une cyanose récente oriente vers une forme acquise. Une cyanose présente depuis toujours, une peau sombre ou des sclérotiques bleues dans la famille orientent vers une forme congénitale ; une consanguinité fait penser à un déficit en <i>CYB5R3</i>.</li><li><b>Terrain avant le bleu de méthylène.</b> Antécédent personnel ou familial de déficit en <button class="w" data-k="d74-g6pd">G6PD</button> ; médicaments sérotoninergiques (inhibiteurs sélectifs de la recapture de la sérotonine, inhibiteurs de la recapture de la sérotonine et de la noradrénaline, inhibiteurs de la monoamine-oxydase, opioïdes), puisque le bleu de méthylène peut les compliquer (<button class="w" data-k="d74-serotonine">fenêtre</button>).</li></ul><p>Chaque question répond à une décision : la première conduit à retirer l’agent, la deuxième à séparer forme acquise et forme héréditaire, la troisième à autoriser ou à éviter l’antidote.</p><div class="key"><b>À retenir.</b> Trois questions : à quoi le patient a-t-il été exposé, depuis quand est-il cyanosé, quel terrain (G6PD, traitement sérotoninergique) contre-indique ou complique l’antidote.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674400011" target="_blank" rel="noopener">Proveblue®, information professionnelle suisse</a>, mises en garde.</p></section>
<section class="ilot" id="d74-7"><h2><span class="n">7</span>Examiner</h2><p>L’examen mesure la tolérance et reconnaît la cyanose particulière de la maladie.</p><div class="two"><div class="card"><h4>Signes évocateurs</h4><p>La cyanose est gris ardoise ou lavande, diffuse, marquée aux lèvres, au nez, aux joues et à la muqueuse buccale ; elle <b>ne s’améliore pas sous oxygène</b>. Le sang prélevé est brun foncé, dit « chocolat ».</p></div><div class="card"><h4>Signes selon le taux</h4><p>Ils vont de l’absence de symptôme à la confusion, à la dyspnée, aux vertiges, à la syncope, puis aux arythmies, aux convulsions et au coma. Le tableau de l’îlot 9 détaille chaque palier.</p></div></div><p>Le premier signe est l’inadéquation : le patient paraît plus cyanosé que sa respiration ne le laisse attendre, et l’oxygène n’y change rien. Le cas fribourgeois en donne le chiffre : 75 % de saturation au doigt malgré 15 litres d’oxygène par minute, avec une conscience conservée. À l’examen, le médecin note aussi la fréquence cardiaque, la pression artérielle et le rythme, puisque les taux élevés donnent des arythmies et un collapsus.</p><div class="trap"><span class="k">Piège</span> Une cyanose attribuée à un shunt droit-gauche, à une hypoventilation ou à une insuffisance cardiaque conduit à augmenter l’oxygène et à retarder le dosage de la méthémoglobine. Si l’oxygène ne corrige ni la couleur ni la saturation, le dosage s’impose.</div><div class="key"><b>À retenir.</b> Cyanose gris ardoise, sang chocolat, aucune réponse à l’oxygène, symptômes proportionnels au taux. L’examen oriente ; seule la CO-oxymétrie prouve.</div><p class="src">Références : <a href="https://doi.org/10.1002/ajh.26340" target="_blank" rel="noopener">EHA et EuroBloodNet 2021</a> ; <a href="https://doi.org/10.1002/ccr3.70416" target="_blank" rel="noopener">De Pauw et coll., HFR Fribourg, Clin Case Rep 2025</a>, présentation du cas.</p><button class="pareto-btn ui" data-k="pareto-d74-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
