<template data-pop="c85-moelle" data-title="Biopsie ostéomédullaire">
<div class="lab">Indication</div><p>Elle est inutile si la TEP montre une atteinte osseuse ou médullaire. Si la TEP est négative, elle n’est indiquée que si une histologie discordante changerait la conduite (Lugano). Onkopedia la demande si aucune TEP n’est faite.</p>
<div class="lab">Fréquence de l’atteinte</div><p>L’atteinte médullaire du lymphome médiastinal est rare : 1 à 5 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-rebond" data-title="Rebond thymique">
<div class="lab">Description</div><p>Après la chimiothérapie, le thymus peut reprendre du volume et fixer le FDG, ce qui donne une TEP faussement positive dans le médiastin.</p>
<div class="lab">Conséquence</div><p>Avec la fibrose et l’inflammation liée au rituximab, il explique la faible valeur prédictive positive de la TEP de fin de traitement. Une TEP positive doit être vérifiée, par biopsie ou par TEP répétée, avant de changer de traitement.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-lugano" data-title="Classification de Lugano">
<div class="lab">Contenu</div><p>Recommandations pour l’évaluation initiale, la stadification et l’évaluation de la réponse des lymphomes de Hodgkin et non hodgkiniens. Elle reprend les stades d’Ann Arbor modifiés (I à IV), impose la TEP-TDM pour les lymphomes avides de FDG et définit l’échelle en cinq points de Deauville.</p>
<div class="lab">Points pratiques</div><p>La cytoponction est insuffisante ; la biopsie au trocart n’est admise que si l’exérèse est impossible. Le suivi ne comporte pas d’imagerie systématique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>.</p></template>
<template data-pop="c85-deauville" data-title="Échelle de Deauville">
<div class="lab">Score en 5 points</div><p>1 : aucune fixation. 2 : fixation inférieure ou égale au médiastin. 3 : fixation supérieure au médiastin mais inférieure ou égale au foie. 4 : fixation modérément supérieure au foie. 5 : fixation nettement supérieure au foie et/ou nouvelles lésions.</p>
<div class="lab">Lecture</div><p>Les scores 1 à 3 correspondent à une réponse métabolique complète. Dans IELSG37, les patients Deauville 4 ont une survie sans progression à 5 ans de 95,8 % ; les patients Deauville 5, de 60,3 %, avec une survie globale de 74,6 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, tableau 2</a> ; <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>.</p></template>
<template data-pop="c85-daepoch" data-title="DA-EPOCH-R : schéma à doses ajustées">
<div class="lab">Composition</div><p>Étoposide, prednisone, vincristine, cyclophosphamide et doxorubicine à doses ajustées, avec rituximab.</p>
<div class="lab">Preuves</div><p>Survie globale à 5 ans de 97 % (intervalle de confiance à 95 % de 81 à 99) dans une étude à un bras ; il ne s’agit pas d’une comparaison randomisée. ESMO 2016 le range parmi les standards, avec le R-CHOP, au choix selon l’expérience du centre.</p>
<div class="lab">Exemple publié</div><p>Une femme de 27 ans avec une masse de 18 cm a reçu 6 cycles de DA-EPOCH-R et obtenu une réponse métabolique complète.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.2.1.2</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a>.</p></template>
<template data-pop="c85-ielsg37" data-title="Essai IELSG37 : omission de la radiothérapie">
<div class="lab">Plan</div><p>Essai randomisé de non-infériorité : 545 patients inclus, 268 randomisés en réponse métabolique complète, avec ou sans 30 Gy.</p>
<div class="lab">Résultats</div><p>Survie sans progression à 30 mois : 96,2 % sans radiothérapie, 98,5 % avec. Rapport de risques instantanés 1,47 (intervalle de confiance à 95 % de 0,34 à 6,28). Survie globale à 5 ans : 99 % dans les deux bras. Deauville 4 : survie sans progression à 5 ans de 95,8 %. Deauville 5 : 60,3 % et survie globale de 74,6 %.</p>
<div class="lab">Contexte suisse</div><p>Essai coordonné par l’IOR de Bellinzona et l’IOSI, avec des auteurs suisses (Zucca, Ceriani, Cavalli, Ionescu).</p>
<p class="src">Références : <a href="https://doi.org/10.1200/JCO-24-01373" target="_blank" rel="noopener">IELSG37, Martelli et al.</a>.</p></template>
<template data-pop="c85-onkopedia" data-title="Onkopedia : lymphome diffus à grandes cellules B (12/2025)">
<div class="lab">Statut</div><p>Recommandation de la DGHO, de l’OeGHO, de la SGMO et de la SSH. Elle constitue la référence suisse de ce chapitre.</p>
<div class="lab">Limite</div><p>La partie finale de la page (grossesse détaillée, bibliographie, statut d’autorisation) n’a pas été lue : au-delà de 100 000 caractères.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>.</p></template>
<template data-pop="c85-rchop" data-title="R-CHOP-21 : standard du DLBCL">
<div class="lab">Schéma</div><p>6 cycles de R-CHOP-21 avec 8 doses de rituximab. Jusqu’à 60 ans, sans facteur de l’indice pronostique international et sans masse volumineuse : 4 R-CHOP puis 2 rituximab.</p>
<div class="lab">Variantes</div><p>R-miniCHOP après 80 ans ou chez un patient fragile ; Pola-R-CHP pour un indice de 2 à 5. La prophylaxie du système nerveux central n’est pas systématique (CNS-IPI).</p>
<div class="lab">Méta-analyse</div><p>Dans le lymphome médiastinal, une chimio-immunothérapie intensifiée donne une survie globale de 88 % contre 80 % avec R-CHOP-21 ou CHOP-21, données observationnelles.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.1</a> ; <a href="https://doi.org/10.3324/haematol.2023.283446" target="_blank" rel="noopener">Cook et al., méta-analyse de 4068 patients</a>.</p></template>
<template data-pop="c85-polapchp" data-title="Pola-R-CHP et Polivy® en Suisse">
<div class="lab">Schéma</div><p>Polatuzumab védotine, rituximab, cyclophosphamide, doxorubicine, prednisone. Onkopedia indique une amélioration de la survie sans progression, sans différence de survie globale, pour un indice pronostique de 2 à 5.</p>
<div class="lab">Divergence</div><p>L’information professionnelle suisse de Polivy® (novembre 2025) ne mentionne que le DLBCL en rechute ou réfractaire, associé à la bendamustine et au rituximab, chez un patient non éligible à la greffe. L’EMA l’autorise en première ligne.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Polivy®, information professionnelle suisse, novembre 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>.</p></template>
<template data-pop="c85-breyanzi" data-title="Lisocabtagène maraleucel (Breyanzi®)">
<div class="lab">Indication suisse</div><p>Lymphome médiastinal primitif réfractaire à la première ligne ou en rechute dans les 12 mois.</p>
<div class="lab">Posologie</div><p>Dose cible de 100 × 10⁶ cellules T CAR+ viables, après lymphodéplétion par fludarabine 30 mg/m² et cyclophosphamide 300 mg/m² pendant 3 jours (essai TRANSFORM).</p>
<div class="lab">Précautions</div><p>Rechercher le VHB, le VHC et le VIH avant tout traitement anti-B.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 5.2.1.3</a>.</p></template>
<template data-pop="c85-keytruda" data-title="Pembrolizumab (Keytruda®)">
<div class="lab">Mécanisme</div><p>Anticorps qui bloque PD-1 ; il lève le frein exercé sur les lymphocytes T par PD-L1 et PD-L2 surexprimés.</p>
<div class="lab">Indication suisse (août 2026)</div><p>Lymphome médiastinal primitif réfractaire ou récidivant chez l’adulte, après au moins deux traitements dont un avec rituximab, et non éligible à l’autogreffe ou en rechute après autogreffe. Posologie : 200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines.</p>
<div class="lab">Preuves</div><p>KEYNOTE-170 (53 patients, âge médian de 33 ans) : réponse objective de 45 %, dont 19 % de rémissions complètes ; survie globale à 12 mois de 58 %. Onkopedia précise que l’autorisation n’existe qu’aux États-Unis et en Suisse.</p>
<div class="lab">Contre-indication relative</div><p>Non indiqué lorsqu’une cytoréduction urgente est nécessaire.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>.</p></template>
<template data-pop="c85-yescarta" data-title="Axicabtagène ciloleucel (Yescarta®)">
<div class="lab">Indication</div><p>Lymphome médiastinal récidivant ou réfractaire après au moins deux lignes systémiques.</p>
<div class="lab">Risques</div><p>Syndrome de libération de cytokines chez presque tous les patients, du jour 1 au jour 12 ; au moins 4 doses de tocilizumab disponibles avant la perfusion. Œdème cérébral : 1,6 % dans le lymphome médiastinal, dont 0,8 % mortel, contre 0,7 % dans le DLBCL ; facteur de risque potentiel : grosse masse médiastinale avec syndrome cave supérieur. La réactivation du VHB peut être fulminante.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>.</p></template>
<template data-pop="c85-mabthera" data-title="Rituximab (MabThera®)">
<div class="lab">Mécanisme</div><p>Anticorps dirigé contre CD20, marqueur de la lignée B exprimé par les grandes cellules du lymphome médiastinal.</p>
<div class="lab">Posologie dans le DLBCL</div><p>375 mg/m² au jour 1 de chaque cycle de CHOP, toutes les 3 semaines, pendant 8 cycles.</p>
<div class="lab">Contre-indications et précautions</div><p>Rechercher au minimum l’AgHBs et l’anti-HBc avant traitement. Hydratation suffisante et uricostatique dès 48 heures avant la première perfusion (syndrome de lyse tumorale). Interrompre la perfusion en cas de dyspnée sévère, de bronchospasme ou d’hypoxie. Risque de leucoencéphalopathie multifocale progressive.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>.</p></template>
<template data-pop="pareto-c85-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="c85-0,c85-1,c85-2,c85-3,c85-4,c85-5,c85-6"></p><ul><li>Dans C85, une seule maladie est individualisée : le lymphome médiastinal primitif à grandes cellules B (C85.2) ; C85.1, C85.7 et C85.9 signalent une précision insuffisante.</li><li>Femme d’environ 35 ans, environ 10 % des DLBCL, masse du médiastin antérieur ; aucun chiffre suisse propre à C85.</li><li>Origine : lymphocyte B thymique médullaire ; voies NF-κB, JAK-STAT et échappement immunitaire (PD-L1, PD-L2, perte de HLA de classe II) ; sclérose compartimentante.</li><li>Phénotype : marqueurs pan-B positifs, immunoglobuline de surface négative, CD23 souvent positif, CD30 faible, MAL positif, CD15 négatif.</li><li>Clinique : compression (dyspnée, toux, dysphagie), syndrome cave dans environ 50 % des cas, symptômes B chez environ un tiers, stades I–II dans environ 80 %.</li></ul></template>
<template data-pop="pareto-c85-diag" data-title="Pareto — Diagnostic, différentiel et urgences"><p class="ratio" data-cover="c85-7,c85-8,c85-9"></p><ul><li>Biopsie tissulaire suffisante relue par un hématopathologiste ; la cytoponction ne suffit pas ; la TEP stadifie, elle ne nomme pas.</li><li>Différentiel du médiastin antérieur : Hodgkin classique (50 à 70 % des lymphomes médiastinaux), thymome (myasthénie), tumeur germinale (AFP, β-hCG), goitre plongeant, lymphome lymphoblastique T (enfant).</li><li>Urgence : la compression ; immunochimiothérapie urgente en cas de syndrome cave ou de compression trachéale.</li><li>Prévention : uricostatique 48 heures avant le rituximab, dépistage de l’hépatite B, tocilizumab disponible avant CAR-T ; pembrolizumab non indiqué en cytoréduction urgente.</li><li>Lacunes : corticothérapie avant biopsie et risque anesthésique non documentés dans les sources lues.</li></ul></template>
<template data-pop="pareto-c85-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="c85-10,c85-11,c85-12"></p><ul><li>Première ligne du lymphome médiastinal : R-CHOP ou DA-EPOCH-R, au choix du centre ; radiothérapie de consolidation décidée par la TEP de fin de traitement.</li><li>IELSG37 : survie sans progression à 30 mois de 96,2 % sans radiothérapie contre 98,5 % avec 30 Gy ; survie globale à 5 ans de 99 % dans les deux bras ; Deauville 5 : pronostic nettement plus réservé.</li><li>Type non précisé : compléter l’histologie avant de traiter ; DLBCL confirmé : 6 R-CHOP-21 avec 8 doses de rituximab (375 mg/m² par cycle).</li><li>Polivy® n’est autorisé en Suisse qu’en rechute ou réfractarité du DLBCL.</li><li>Rechute en 12 mois ou moins ou réfractaire primaire : lisocabtagène maraleucel ; rechute tardive : platine, BEAM et autogreffe ; pembrolizumab après au moins deux traitements.</li></ul></template>
<template data-pop="pareto-c85-suivi" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="c85-13,c85-14,c85-15"></p><ul><li>Deauville 1 à 3 : réponse métabolique complète ; TEP positive à vérifier (fibrose, inflammation, rebond thymique) ; délai d’au moins 5 à 6 semaines après la dernière perfusion.</li><li>Suivi tous les 3 mois pendant 2 ans, tous les 6 mois pendant 3 ans, puis annuel, sans imagerie systématique.</li><li>Effets tardifs : second cancer, insuffisance cardiaque après anthracyclines, cancer du sein et coronaropathie après irradiation médiastinale.</li><li>Grossesse, fertilité, pédiatrie : données limitées (rapport de cas, essais en cours) ; ne pas transformer un cas en recommandation.</li><li>Critères formels : biopsie tissulaire, masse médiastinale antérieure, phénotype compatible, exclusion du Hodgkin et de la zone grise, codage C85.2 ou diagnostic à compléter.</li></ul></template>
<template data-pop="pareto-c85-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="c85-e-1,c85-e-2,c85-e-3,c85-e-4,c85-e-5,c85-e-6,c85-e-7"></p><ul><li>Gold standard du diagnostic : histologie sur biopsie suffisante relue par un hématopathologiste ; de l’extension et de la réponse : TEP-TDM au FDG selon Lugano et Deauville.</li><li>Phénotype : CD19, CD20, CD22, CD79a, CD45 positifs ; immunoglobuline de surface absente ; CD23 souvent positif ; CD30 faible ; MAL positif ; CD15 négatif.</li><li>TEP obligatoire dans le lymphome médiastinal ; révision de stade dans environ 20 % des cas ; valeur prédictive négative excellente, positive faible.</li><li>Biologie : LDH et acide urique ; AgHBs et anti-HBc avant le rituximab ; ECG et échocardiographie avant l’anthracycline.</li><li>Indice pronostique international peu discriminant dans cette maladie.</li></ul></template>
<template data-pop="pareto-c85-sciences" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="c85-s-anat-cours,c85-s-histo-cours,c85-s-immuno-cours,c85-s-gen-cours"></p><ul><li>Anatomie : la masse du médiastin antérieur comprime voies aériennes, tube digestif haut et veine cave supérieure, et infiltre poumon, plèvre et péricarde.</li><li>Histologie : grandes cellules claires et sclérose compartimentante ; les petites biopsies sont trompeuses.</li><li>Immunologie : PD-L1 et PD-L2 élevés, HLA de classe II bas ; fondement du pembrolizumab.</li><li>Génétique : trois familles d’altérations (REL et TNFAIP3 ; JAK2, SOCS1, IL-13, STAT6 ; 9p24.1, CIITA, B2M, CD58) ; CIITA réarrangé associé à une survie spécifique plus courte.</li></ul></template>
<template data-pop="pareto-c85-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="c85-p-1,c85-p-2,c85-p-3,c85-p-4,c85-p-5"></p><ul><li>Première ligne : anticorps anti-CD20 plus chimiothérapie ; rituximab 375 mg/m² par cycle, 8 doses dans le DLBCL.</li><li>Rechute : lisocabtagène maraleucel (100 × 10⁶ cellules après fludarabine 30 mg/m² et cyclophosphamide 300 mg/m² pendant 3 jours), pembrolizumab (200 mg toutes les 3 semaines ou 400 mg toutes les 6 semaines), axicabtagène ciloleucel.</li><li>Précautions : AgHBs et anti-HBc avant rituximab, uricostatique dès 48 heures, tocilizumab disponible avant CAR-T, pembrolizumab non indiqué en cytoréduction urgente.</li><li>À éviter : traitement sans type précis, radiothérapie systématique après réponse complète, autogreffe en rémission complète.</li></ul></template>
