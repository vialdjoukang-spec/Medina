<template data-pop="c85-sources-guides" data-title="Sociétés et référentiels cités">
<div class="lab">Qui sont-ils</div><p>La Société suisse d’hématologie (SSH) et la Société suisse d’oncologie médicale (SGMO) ont coécrit la recommandation Onkopedia sur le lymphome diffus à grandes cellules B, version de décembre 2025 ; elle sert de référence suisse de ce chapitre. L’Organisation mondiale de la santé (OMS) publie la classification des tumeurs hématolymphoïdes, 5e édition. La Société européenne d’oncologie médicale (ESMO) a publié en 2016 la recommandation sur le DLBCL extranodal et le lymphome médiastinal primitif.</p>
<div class="lab">Limites</div><p>Aucun article du Swiss Medical Forum ni recommandation propre de la SSH sur le lymphome médiastinal n’a été trouvé. La recommandation ESMO date de 2016 : l’essai IELSG37 (2024) l’a modifiée sur la radiothérapie. Les recommandations pragmatiques LYSA 2025 et le rapport ICC 2022 n’ont été lus qu’en résumé.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://doi.org/10.1182/blood.2022015851" target="_blank" rel="noopener">Classification de consensus international, Campo et al., 2022</a> ; <a href="https://doi.org/10.1016/j.ejca.2025.115369" target="_blank" rel="noopener">Renaud et al., recommandations pragmatiques LYSA, 2025 (résumé)</a>.</p></template>
<template data-pop="c85-cim" data-title="CIM-10-GM 2024 : lecture des sous-codes de C85">
<div class="lab">Lecture</div><p>C85 est une catégorie résiduelle du bloc C81–C96. Le code C85.2 nomme une maladie, le lymphome médiastinal (thymique) à grandes cellules B, et exclut C83.3 et C83.8. Les codes C85.1 (lymphome à cellules B sans précision), C85.7 (autres types précisés) et C85.9 (non précisé) décrivent un état d’information. Pour C85.9, les inclusions officielles sont « lymphome malin SAI », « lymphome SAI » et « lymphome non hodgkinien SAI ».</p>
<div class="lab">Limite</div><p>La page officielle de C85.7 n’indique ni inclusion ni exclusion, et aucune source lue ne lui rattache une entité précise. Le catalogue du dépôt reste en CIM-10-GM 2024 ; la cartographie vers la CIM-11 n’est pas établie.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c81-c96.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc C81–C96 (BfArM)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">CIM-10-GM 2024, version française (OFS)</a>.</p></template>
<template data-pop="c85-lmpgb" data-title="Lymphome médiastinal primitif à grandes cellules B">
<div class="lab">Définition</div><p>Lymphome B agressif né dans le médiastin, à partir d’un lymphocyte B thymique médullaire. Les grandes cellules expriment les marqueurs pan-B mais pas d’immunoglobuline de surface. La classification de l’OMS, 5e édition, le conserve sous le même nom que la 4e édition révisée.</p>
<div class="lab">Pourquoi c’est une entité à part</div><p>Son profil moléculaire (NF-κB, JAK-STAT, échappement par PD-1) le rapproche du Hodgkin classique scléronodulaire plus que du DLBCL, NOS. Cette parenté explique la difficulté du diagnostic différentiel.</p>
<div class="lab">Décision</div><p>Le diagnostic se fait par biopsie tissulaire suffisante relue par un hématopathologiste ; le traitement de première ligne est une immunochimiothérapie (R-CHOP ou DA-EPOCH-R), avec radiothérapie décidée d’après la TEP.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-dlbcl-nos" data-title="DLBCL, NOS : lymphome diffus à grandes cellules B sans autre précision">
<div class="lab">Définition</div><p>Lymphome à grandes cellules, de phénotype B mature, qui ne remplit pas les critères d’une entité spécifique. C’est l’entité la plus fréquente des lymphomes à grandes cellules B. Son incidence est d’environ 7 pour 100 000 habitants par an, croissante avec l’âge et plus élevée chez l’homme.</p>
<div class="lab">Conséquence</div><p>Une définition par exclusion impose de vérifier d’abord qu’aucune entité plus spécifique (lymphome médiastinal primitif, zone grise) n’explique le tableau. Les cas médiastinaux d’aspect semblable à la zone grise, mais situés hors du médiastin, sont classés DLBCL, NOS.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 2</a>.</p></template>
<template data-pop="c85-mgzl" data-title="Lymphome de la zone grise médiastinale">
<div class="lab">Définition</div><p>Entité de l’OMS 5e édition qui remplace l’ancienne catégorie « lymphome B inclassable, intermédiaire entre DLBCL et lymphome de Hodgkin classique ». Elle est propre au médiastin.</p>
<div class="lab">Difficulté</div><p>Le diagnostic différentiel avec le lymphome médiastinal primitif et le Hodgkin classique scléronodulaire repose sur la morphologie, l’histologie et le nombre de marqueurs B exprimés. La reproductibilité est difficile, même entre experts : la relecture par un hématopathologiste est indispensable.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://doi.org/10.1111/bjh.70432" target="_blank" rel="noopener">Sabattini et al., zone grise médiastinale (résumé)</a> (résumé).</p></template>
<template data-pop="c85-hgbl" data-title="HGBL, NOS : lymphome B de haut grade sans autre précision">
<div class="lab">Définition</div><p>Regroupe des lymphomes B agressifs à cellules moyennes ou blastoïdes qui n’entrent dans aucune entité définie de la classification de l’OMS, 5e édition.</p>
<div class="lab">Place dans ce chapitre</div><p>Cette entité n’est pas détaillée davantage : le dossier ne contient ni épidémiologie ni conduite spécifique la concernant. Elle illustre que « lymphome agressif B » n’est pas un diagnostic final.</p>
<p class="src">Références : <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>.</p></template>
<template data-pop="c85-origine-thymique" data-title="Lymphocytes B médullaires du thymus">
<div class="lab">État normal</div><p>Le thymus renferme une petite population de lymphocytes B dits médullaires. Le lymphome médiastinal primitif en dériverait ; l’origine est qualifiée de putative.</p>
<div class="lab">Conséquence</div><p>Cette origine rend compte de la localisation médiastinale antérieure et de l’absence habituelle d’atteinte ganglionnaire à distance : la tumeur naît sur place et envahit par contiguïté (poumon, paroi, plèvre, péricarde).</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-nfkb" data-title="Voie NF-κB">
<div class="lab">Altérations décrites</div><p>Amplification de REL (région 2p16) et mutations inactivatrices de TNFAIP3. Dans les deux cas, la voie de survie cellulaire NF-κB reste activée en permanence.</p>
<div class="lab">Portée</div><p>L’activation constitutive de NF-κB est aussi décrite dans le Hodgkin classique scléronodulaire, ce qui explique en partie la parenté des deux maladies. Aucune de ces altérations n’est un critère diagnostique formel.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, p. v91–v92</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>.</p></template>
<template data-pop="c85-jakstat" data-title="Voie JAK-STAT">
<div class="lab">Altérations décrites</div><p>Amplification de JAK2 (région 9p24), mutations inactivatrices de SOCS1, surexpression d’IL-13 et signalisation STAT6. Ces altérations entretiennent un signal de prolifération.</p>
<div class="lab">Portée</div><p>La même voie est activée dans le Hodgkin classique scléronodulaire. Le dossier ne rapporte pas d’inhibiteur de cette voie dans la pratique suisse.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a>.</p></template>
<template data-pop="c85-echappement" data-title="Échappement immunitaire">
<div class="lab">Mécanisme</div><p>Amplification ou translocation de 9p24.1 (gènes de PD-L1 et PD-L2), baisse des molécules HLA de classe II par réarrangement de CIITA, mutations de B2M et de CD58. La tumeur est moins reconnue et freine activement les lymphocytes T.</p>
<div class="lab">Conséquence thérapeutique</div><p>Ce profil fonde l’efficacité du blocage de PD-1 en rechute (pembrolizumab, indication suisse). Dans l’essai KEYNOTE-170, la réponse objective est de 45 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680662310025" target="_blank" rel="noopener">Keytruda®, information professionnelle suisse</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a>.</p></template>
<template data-pop="c85-ciita" data-title="CIITA : gène du transactivateur des molécules HLA de classe II">
<div class="lab">Rôle</div><p>Le réarrangement de CIITA fait baisser l’expression des molécules HLA de classe II à la surface de la tumeur, ce qui réduit la présentation d’antigène aux lymphocytes T.</p>
<div class="lab">Pronostic</div><p>Un CIITA réarrangé est associé à une survie spécifique plus courte dans la revue de Chen et al. Il s’agit d’une association, non d’un critère de décision thérapeutique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8044947/" target="_blank" rel="noopener">Chen et al., thérapies de précision</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-phenotype" data-title="Phénotype du lymphome médiastinal primitif">
<div class="lab">Marqueurs</div><p>CD19, CD20, CD22, CD79a et CD45 positifs ; immunoglobuline de surface absente ; CD30 faible dans environ 80 % des cas ; MAL positif dans environ 70 % ; CD23 souvent positif ; CD15 négatif ; CD10 et CD21 typiquement négatifs ; BCL6 et IRF4 variables.</p>
<div class="lab">Lecture</div><p>Les pourcentages sont des fréquences dans les séries, non des seuils de positivité d’un cas. Le diagnostic repose sur l’ensemble morphologique et immunohistochimique, relu par un hématopathologiste.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-sclerose" data-title="Sclérose compartimentante">
<div class="lab">Description</div><p>Prolifération diffuse de grandes cellules à cytoplasme clair, accompagnée d’une sclérose qui cloisonne la tumeur. La sclérose peut dominer le prélèvement.</p>
<div class="lab">Conséquence</div><p>Les petites biopsies sont trompeuses : la tumeur est hétérogène. D’où le recours à des techniques de prélèvement larges (médiastinoscopie, médiastinotomie antérieure, mini-thoracotomie) lorsque l’aiguille percutanée ne suffit pas.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-vcs" data-title="Syndrome cave supérieur">
<div class="lab">Description</div><p>Distension des veines du cou et du thorax, œdème du visage et des bras, chémosis ; présent dans environ 50 % des lymphomes médiastinaux primitifs.</p>
<div class="lab">Mécanisme</div><p>La masse comprime la veine cave supérieure, qui draine la tête, le cou et les bras ; la pression veineuse monte en amont (lecture anatomique des signes rapportés par les sources).</p>
<div class="lab">Décision</div><p>Une compression thoracique menaçante impose une immunochimiothérapie urgente, potentiellement curative. Un syndrome cave sévère est aussi un facteur de risque potentiel d’œdème cérébral après CAR-T.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a>.</p></template>
<template data-pop="c85-compression" data-title="Dyspnée, toux et dysphagie : compression locale">
<div class="lab">Description</div><p>La masse du médiastin antérieur est présente dans plus des deux tiers des cas et comprime localement. Elle donne dyspnée, toux et dysphagie.</p>
<div class="lab">Lecture</div><p>Dyspnée et toux : compression des voies aériennes ; dysphagie : compression digestive haute (lecture anatomique). Ces signes sont des critères d’urgence.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-epanchement" data-title="Épanchement pleural ou péricardique">
<div class="lab">Description</div><p>Épanchement fréquent dans le lymphome médiastinal. Le cas publié par Villa et Sehn décrit une atélectasie gauche et un épanchement pleural chez une femme de 27 ans avec une masse de 18 cm.</p>
<div class="lab">Portée</div><p>L’infiltration de la plèvre ou du péricarde est présente dans 70 à 80 % des cas. L’épanchement ne remplace pas la biopsie et ne modifie pas le principe d’une immunochimiothérapie.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1002/jha2.151" target="_blank" rel="noopener">Villa et Sehn</a>.</p></template>
<template data-pop="c85-symptomes-b" data-title="Symptômes B : définition">
<div class="lab">Définition</div><p>Fièvre supérieure à 38 °C inexpliquée, sueurs nocturnes imposant de changer la literie, perte de poids de plus de 10 % en 6 mois.</p>
<div class="lab">Fréquence et portée</div><p>Environ un tiers des patients atteints de lymphome médiastinal. Les mentions A/B ne sont exigées dans la stadification de Lugano que pour le lymphome de Hodgkin.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a>.</p></template>
<template data-pop="c85-biopsie" data-title="Biopsie : échantillon suffisant et techniques">
<div class="lab">Règle</div><p>Un échantillon tissulaire suffisant, de préférence le ganglion entier, relu par un hématopathologiste. La cytoponction à l’aiguille fine est insuffisante ; la biopsie au trocart est admise si l’exérèse est impossible.</p>
<div class="lab">Techniques dans le médiastin</div><p>Aiguille percutanée, médiastinoscopie, médiastinotomie antérieure ou mini-thoracotomie.</p>
<div class="lab">Lacune</div><p>Aucune source lue ne documente l’effet d’une corticothérapie préalable sur la lisibilité de l’histologie, ni le risque anesthésique d’une masse médiastinale : avis spécialisé avant tout geste.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-tep" data-title="TEP-TDM au 18F-FDG">
<div class="lab">Principe</div><p>La tomographie par émission de positons au fluorodésoxyglucose repère les tissus qui captent le glucose ; couplée au scanner, elle situe les lésions. Le lymphome médiastinal primitif fixe le FDG dans tous les cas.</p>
<div class="lab">Rôle</div><p>Stadification, évaluation de la réponse (Lugano, Deauville), décision de radiothérapie. Elle révise le stade à la hausse dans environ 20 % des cas.</p>
<div class="lab">Limite</div><p>Elle ne nomme pas la tumeur. En fin de traitement, la valeur prédictive positive est faible (fibrose, inflammation post-rituximab, rebond thymique).</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4979083/" target="_blank" rel="noopener">Classification de Lugano, Cheson et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a>.</p></template>
<template data-pop="c85-ipi" data-title="Indice pronostique international et échelle ECOG">
<div class="lab">Facteurs</div><p>Âge supérieur à 60 ans, LDH élevée, stade III–IV, ECOG ≥ 2, plus d’un site extranodal.</p>
<div class="lab">Survie globale à 3 ans</div><p>91 % pour 0–1 point, 81 % pour 2, 65 % pour 3, 59 % pour 4–5.</p>
<div class="lab">Limite</div><p>Dans le lymphome médiastinal, le pouvoir discriminant est limité par l’âge jeune et la maladie confinée au médiastin. L’échelle ECOG est l’échelle de performance de l’Eastern Cooperative Oncology Group.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia 2025, § 4.4.1</a> ; <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, tableau 4</a>.</p></template>
<template data-pop="c85-diff-lymphome" data-title="Lymphome médiastinal primitif dans le différentiel">
<div class="lab">Indices</div><p>Femme jeune, masse volumineuse, syndrome cave, fixation constante du FDG.</p>
<div class="lab">Examen décisif</div><p>Biopsie tissulaire suffisante. Le diagnostic différentiel avec la zone grise et le Hodgkin classique scléronodulaire est difficile, même entre experts.</p>
<p class="src">Références : <a href="https://iris.unito.it/bitstream/2318/1612150/1/Ann%20Oncol-2016-Vitolo-v91-v102.pdf" target="_blank" rel="noopener">ESMO 2016, Vitolo et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12101282/" target="_blank" rel="noopener">Nappi et al., 2025</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>.</p></template>
<template data-pop="c85-diff-hodgkin" data-title="Lymphome de Hodgkin classique">
<div class="lab">Fréquence</div><p>Il représente 50 à 70 % des lymphomes médiastinaux, contre 15 à 25 % pour les lymphomes non hodgkiniens.</p>
<div class="lab">Lien avec C85</div><p>Les lymphomes non hodgkiniens du médiastin sont surtout des DLBCL ou des lymphomes lymphoblastiques T. Le Hodgkin classique scléronodulaire partage avec le lymphome médiastinal CD30, NF-κB, JAK-STAT et l’échappement par PD-1.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/diffuses-grosszelliges-b-zell-lymphom/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, lymphome diffus à grandes cellules B, 12/2025</a> ; <a href="https://doi.org/10.1038/s41375-022-01620-2" target="_blank" rel="noopener">Classification OMS, 5e édition, Alaggio et al.</a>.</p></template>
<template data-pop="c85-diff-lymphoblastique" data-title="Lymphome lymphoblastique T">
<div class="lab">Description</div><p>Autre lymphome non hodgkinien du médiastin, qui touche l’enfant et l’adolescent.</p>
<div class="lab">Conséquence</div><p>L’âge tranche le soupçon : chez l’adulte jeune, le lymphome médiastinal primitif est plus probable.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>.</p></template>
<template data-pop="c85-diff-thymome" data-title="Thymome">
<div class="lab">Description</div><p>Tumeur primitive la plus fréquente du médiastin antérieur ; survient surtout après 40 ans. 30 à 50 % des patients ont une myasthénie, et 10 à 15 % des myasthéniques ont un thymome. Il donne rarement un épanchement ou des adénopathies.</p>
<div class="lab">Limite</div><p>Le scanner distingue mal un lymphome solitaire d’un thymome ; l’histologie tranche. La recommandation ESMO sur les tumeurs épithéliales thymiques n’était pas accessible lors de la recherche.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>.</p></template>
<template data-pop="c85-diff-germinale" data-title="Tumeur germinale du médiastin">
<div class="lab">Description</div><p>Le tératome mature est la plus fréquente et peut contenir graisse, liquide et calcifications. Le séminome survient presque exclusivement chez l’homme de 20 à 40 ans. Les tumeurs non séminomateuses s’accompagnent d’une élévation de l’AFP ou de la β-hCG.</p>
<div class="lab">Décision</div><p>Les marqueurs orientent ; l’histologie décide.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>.</p></template>
<template data-pop="c85-diff-goitre" data-title="Goitre plongeant">
<div class="lab">Description</div><p>Masse en continuité avec la thyroïde cervicale ; le tissu thyroïdien ectopique isolé est rare.</p>
<div class="lab">Décision</div><p>La continuité avec la thyroïde cervicale oriente ; l’imagerie la documente.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3579993/" target="_blank" rel="noopener">Juanpere et al., masses médiastinales, 2013</a>.</p></template>
<template data-pop="c85-lemp" data-title="Leucoencéphalopathie multifocale progressive">
<div class="lab">Risque</div><p>Le rituximab expose au risque de leucoencéphalopathie multifocale progressive (LEMP), mentionné par l’information professionnelle suisse.</p>
<div class="lab">Portée</div><p>Le dossier ne rapporte ni fréquence ni conduite chiffrée ; cette lacune est à nommer.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680543780176" target="_blank" rel="noopener">MabThera® i.v., information professionnelle suisse</a>.</p></template>
<template data-pop="c85-cart" data-title="Thérapie par cellules CAR-T">
<div class="lab">Principe</div><p>Les lymphocytes T du patient sont modifiés pour reconnaître la tumeur (cellules T à récepteur antigénique chimérique), puis réinjectés après lymphodéplétion.</p>
<div class="lab">Risques documentés</div><p>Syndrome de libération de cytokines (presque tous les patients sous axicabtagène ciloleucel, entre J1 et J12) ; œdème cérébral, plus fréquent dans le lymphome médiastinal (1,6 %, dont 0,8 % mortel) que dans le DLBCL (0,7 %). Au moins 4 doses de tocilizumab doivent être disponibles.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680669860011" target="_blank" rel="noopener">Yescarta®, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680674690016" target="_blank" rel="noopener">Breyanzi®, information professionnelle suisse</a>.</p></template>
<template data-pop="c85-mnemo" data-title="Aide-mémoire des cinq étapes du lymphome médiastinal">
<div class="lab">Séquence</div><p><b>B</b>iopsie suffisante, <b>S</b>tadification par TEP, <b>T</b>raitement par immunochimiothérapie, <b>E</b>valuation par la TEP de fin de traitement, <b>D</b>écision de radiothérapie : « BSTED ». Aide pédagogique, non critère officiel.</p>
<p class="src">Références : synthèse des sources du chapitre.</p></template>
