<template data-pop="d77-parasito" data-title="Recherche des œufs"><h3>Technique</h3><p>Dans l’urine, l’échantillon est recueilli entre 10 h et 15 h puis centrifugé ou filtré. Dans les selles, au moins trois échantillons à des jours alternés sont examinés avec une technique de concentration. Une biopsie (rectale, hépatique) peut aussi montrer des œufs.</p><h3>Pourquoi plusieurs échantillons</h3><p>Le consensus demande plusieurs échantillons à jours alternés ; la source ne détaille pas la raison, qui tient vraisemblablement à une excrétion irrégulière, si bien qu’un seul échantillon négatif ne suffit pas à exclure la maladie. La morphologie de l’œuf identifie l’espèce, donc la dose de praziquantel. Après traitement, des œufs non viables peuvent encore être excrétés.</p></template>
<template data-pop="d77-serologie" data-title="Sérologie de la schistosomose"><h3>Intérêt et limite</h3><p>La sérologie est sensible et recommandée par les autorités sanitaires européennes pour dépister les personnes asymptomatiques. Elle ne distingue pas une infection active d’une infection ancienne et reste positive après traitement ; elle ne sert donc pas au suivi.</p><h3>Performances dans la série HSS</h3><p>L’immunofluorescence indirecte (Euroimmun) avait une sensibilité de 92 à 100 % et une spécificité de 79 à 100 %. L’intervalle large reflète le petit effectif.</p><h3>Quand l’utiliser</h3><p>Devant un tableau typique sans œufs retrouvés, une sérologie positive avec anamnèse compatible suffit à la preuve diagnostique selon les critères du cours, la dose de 40 mg/kg étant alors retenue pour une espèce indéterminée.</p></template>
<template data-pop="d77-cca" data-title="Antigène cathodique circulant (CCA)"><h3>Principe</h3><p>Le CCA est un antigène du parasite détecté dans l’urine. Il a été utilisé en Suisse par le Swiss TPH pour dépister <i>S. mansoni</i>.</p><h3>Résultats suisses</h3><p>Chez 107 réfugiés érythréens asymptomatiques arrivés depuis moins de 24 mois, le CCA était positif chez 40,2 % et des œufs étaient trouvés dans les selles chez 21,5 %. L’écart entre les deux chiffres montre que l’antigène détecte plus de cas que la recherche d’œufs, sans qu’on puisse le qualifier de faux positif sur ces seules données.</p><h3>Disponibilité</h3><p>PCR, LAMP et CCA sont surtout réalisés dans des centres de référence selon le consensus espagnol.</p></template>
<template data-pop="d77-endoscopie" data-title="Gastroscopie et classification de Paquet"><h3>Rôle</h3><p>La gastroscopie dépiste et gradue les varices œsophagiennes avant tout saignement. Dans la série européenne de HSS, la classification de Paquet a servi à mesurer la régression des varices après TIPS (médiane de deux degrés).</p><h3>Pourquoi systématique</h3><p>Les critères non invasifs établis pour la cirrhose ne s’appliquent pas à ce cadre ; le dépistage endoscopique des varices est recommandé au diagnostic d’un trouble vasculaire porto-sinusoïdal, et la même prudence s’applique à la HSS. Une gastroscopie de contrôle est proposée vers trois mois après un TIPS.</p></template>
<template data-pop="d77-baveno" data-title="Baveno VII : hémorragie variqueuse"><h3>Ce que dit la recommandation</h3><p>En cas de suspicion d’hémorragie variqueuse, débuter au plus tôt un médicament vasoactif (terlipressine, somatostatine ou octréotide) pendant deux à cinq jours. Intuber avant l’endoscopie si la conscience est troublée ou si l’hématémèse est active.</p><h3>Limite</h3><p>Baveno VII est écrite pour l’hypertension portale en général, avec une attention centrale à la cirrhose. Elle ne contient pas de recommandation spécifique à la schistosomose : l’application à la HSS est une extrapolation raisonnable, non une démonstration.</p><h3>Conflit de sources</h3><p>Baveno VII préfère le carvédilol dans la cirrhose compensée, alors que l’information professionnelle suisse consultée du carvédilol ne mentionne pas l’hypertension portale. Pour une conduite en Suisse, l’information professionnelle suisse sert de référence d’indication, et la préférence de Baveno VII reste un argument à discuter.</p></template>
<template data-pop="d77-pzq" data-title="Praziquantel : mécanisme et place"><h3>Mécanisme</h3><p>Le praziquantel altère la perméabilité membranaire du ver, le paralyse et lèse son tégument. Il réduit les œufs de 85 à 95 %. En phase aiguë symptomatique, il peut aggraver le tableau ; le consensus ne détaille pas le mécanisme de cette aggravation.</p><h3>Place</h3><p>L’OMS (2022) le recommande contre toutes les formes de schistosomose. Il est sûr chez l’enfant dès deux ans, l’adulte, la femme enceinte après le premier trimestre et la femme allaitante. Aucune résistance n’a été démontrée en clinique.</p><h3>Limite d’un traitement antiparasitaire</h3><p>Il arrête la ponte, mais la fibrose installée ne régresse que partiellement : le patient de notre cas reste exposé au saignement malgré un traitement parfait.</p></template>
<template data-pop="d77-pzq-doses" data-title="Doses de praziquantel selon l’espèce"><table class="t"><tr><th>Espèces</th><th>Dose</th><th>Prises</th></tr><tr><td><i>S. haematobium</i>, <i>mansoni</i>, <i>intercalatum</i>, <i>guineensis</i> ou espèce indéterminée</td><td>40 mg/kg</td><td>Une ou deux prises, en un jour</td></tr><tr><td><i>S. japonicum</i>, <i>mekongi</i>, <i>malayensis</i></td><td>60 mg/kg</td><td>Deux prises espacées d’au moins 3 h, en un jour</td></tr></table><p>Exemple chiffré : pour un adulte de 70 kg infecté par <i>S. mansoni</i>, 40 mg/kg représentent 2800 mg. Le calcul ne remplace pas l’information professionnelle du produit disponible. Un schéma de trois jours est proposé par certains, sans consensus. En cas de persistance de l’infection à trois mois, un retraitement est possible.</p></template>
<template data-pop="d77-pzq-suisse" data-title="Praziquantel en Suisse : lacune"><h3>Ce qui a été fait</h3><p>Le 15.10.2026, la recherche de praziquantel, de Biltricide et de Cesol dans l’AIPS, via AmiKo, n’a retourné aucune information professionnelle.</p><h3>Ce que cela ne prouve pas</h3><p>Une absence de résultat n’est pas la preuve d’une absence d’autorisation. Le statut d’autorisation et la voie d’importation en Suisse restent à vérifier sur Swissmedic et Compendium. Les doses du cours viennent donc du consensus espagnol et de l’OMS, non d’une information professionnelle suisse.</p></template>
<template data-pop="d77-bbns" data-title="Bêtabloquants non sélectifs dans l’hypertension portale"><h3>Pourquoi ils agissent</h3><p>Les bêtabloquants non sélectifs abaissent la pression dans le système porte. Dans la HSS, ils améliorent l’hémodynamique et réduisent la mortalité, et sont associés à la ligature élastique et à la sclérothérapie des varices.</p><h3>Tolérance chez l’adulte jeune</h3><p>Dans la série européenne (âge médian 27 ans), 4 patients sur 11 (36 %) ont réduit ou arrêté le traitement pour hypotension ou bradycardie. Une revue narrative brésilienne confirme la réduction de la pression portale et la prévention de l’hémorragie, avec des données de sécurité à long terme limitées ; seul son résumé a été lu.</p><h3>Choix de la molécule en Suisse</h3><p>Voir les fenêtres du propranolol et du carvédilol.</p></template>
<template data-pop="d77-propranolol" data-title="Propranolol : information professionnelle suisse"><h3>Indication</h3><p>L’information professionnelle de Propranolol Zentiva (Helvepharm, mise à jour de janvier 2023) mentionne la prévention des hémorragies gastro-intestinales hautes en cas d’hypertension portale et de varices œsophagiennes, sauf cirrhose décompensée.</p><h3>Posologie</h3><p>Début à 20 mg deux fois par jour, titration jusqu’à une réduction d’environ 25 % de la fréquence cardiaque au repos, jusqu’à 80 mg deux fois par jour, maximum 160 mg deux fois par jour. Ne plus augmenter à une fréquence de 50–55/min.</p><h3>Précautions</h3><p>Le médicament peut masquer la tachycardie d’une hémorragie, signe d’alarme essentiel, et expose à une encéphalopathie hépatique en cas d’hypertension portale.</p></template>
<template data-pop="d77-carvedilol" data-title="Carvédilol : indication suisse et préférence de Baveno VII"><h3>Ce que dit l’information suisse</h3><p>L’information professionnelle de Carvédilol Spirig HC (mise à jour d’octobre 2023) ne mentionne que l’hypertension artérielle, l’angor et l’insuffisance cardiaque. Elle contre-indique le médicament en cas d’insuffisance hépatique cliniquement manifeste. Une seule spécialité a été consultée.</p><h3>Ce que dit Baveno VII</h3><p>Le consensus préfère le carvédilol dans la cirrhose compensée. Son usage en hypertension portale est donc hors indication suisse, même s’il est étayé par le consensus international.</p><h3>Règle appliquée</h3><p>Pour une prescription en Suisse, l’information professionnelle suisse prime pour l’indication ; une prescription hors indication exige une information du patient et une justification. Le cours ne tranche pas à la place du clinicien.</p></template>
<template data-pop="d77-tips" data-title="TIPS : résultats de la série européenne"><h3>Principe</h3><p>Le TIPS est une dérivation portosystémique intrahépatique transjugulaire : un shunt qui décomprime le système porte. Il est discuté après échec du traitement conservateur.</p><table class="t"><tr><th>Paramètre</th><th>Résultat</th></tr><tr><td>Effectif</td><td>11 TIPS et 2 shunts spléno-rénaux proximaux avec splénectomie</td></tr><tr><td>Succès technique initial</td><td>83 %, malgré la rigidité du tissu fibreux périportal</td></tr><tr><td>Saignement variqueux</td><td>Aucun sur 30,9 années-patient</td></tr><tr><td>Régression des varices</td><td>Médiane de 2 degrés (Paquet)</td></tr><tr><td>Complications</td><td>Encéphalopathie transitoire (5), insuffisance hépatique avec VHB (1), thrombose portale (1), septicémie sur cathéter (1)</td></tr></table><p>La série est rétrospective, sans témoin et de petite taille. La thrombopénie persiste après TIPS.</p></template>
<template data-pop="d77-chirurgie" data-title="Chirurgie de l’hypertension portale schistosomienne"><h3>Techniques</h3><p>Dévascularisation œso-gastrique avec splénectomie, déconnexion azygo-portale, shunts spléno-rénaux distal (Warren) ou proximal. Ce sont les techniques les mieux étudiées.</p><h3>Coût</h3><p>Elles sont invasives, avec mortalité périopératoire et syndrome post-splénectomie. La splénectomie corrige la numération mais expose à l’infection fulminante et à une thrombocytose pouvant occlure un shunt (jusqu’à 967 G/L). Dans un contexte européen, la décision se prend avec une équipe spécialisée.</p></template>
<template data-pop="d77-vaccins" data-title="Vaccination après splénectomie (CHUV 2024)"><table class="t"><tr><th>Vaccin</th><th>Schéma</th></tr><tr><td>Prevenar 20 (PCV20)</td><td>1 dose, sans rappel</td></tr><tr><td>Menveo (MCV-ACWY)</td><td>2 doses à 1 mois, rappel tous les 5 ans</td></tr><tr><td>Bexsero (méningocoque B)</td><td>2 doses à 2 mois, rappel tous les 5 ans</td></tr><tr><td>Grippe</td><td>Chaque année</td></tr></table><p>La vaccination se fait si possible au moins deux semaines avant la splénectomie, sinon après la phase postopératoire et avant la sortie. Voie intramusculaire si les plaquettes dépassent 20 G/L (évaluation entre 20 et 50 G/L), sous-cutanée au-dessous de 20 G/L au prix d’une moindre immunogénicité. Hib n’est pas officiellement recommandé en Suisse. Le protocole se réfère à des bulletins OFSP (2015, 2014, 2024) qui n’ont pas été relus directement, et le plan de vaccination 2026 n’a pas été vérifié.</p></template>
<template data-pop="pareto-d77-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="d77-0,d77-1,d77-2,d77-3,d77-4,d77-5,d77-6"></p><ul><li>D77* est la manifestation splénique d’une schistosomiase : toujours codé après B65.-†, jamais seul.</li><li>La HSS touche 4 à 8 % des infectés ; elle associe fibrose périportale, hypertension portale, varices et splénomégalie avec hypersplénisme.</li><li>L’œuf fait la lésion ; la fibrose est présinusoïdale, donc la fonction hépatique reste conservée, contrairement à la cirrhose.</li><li>Splénomégalie (structure) et hypersplénisme (fonction : cytopénies avec hyperplasie médullaire compensatrice) ne sont pas synonymes.</li><li>Suisse : 40,2 % de tests CCA positifs chez des réfugiés érythréens récents.</li><li>Questions : origine et contact avec l’eau douce ; saignement digestif.</li><li>Clinique : grosse rate (130 à 297 mm), foie ferme, ascite inconstante.</li></ul></template>
<template data-pop="pareto-d77-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="d77-7,d77-8"></p><ul><li>Fonction hépatique conservée + hypertension portale + origine endémique : penser HSS avant la cirrhose.</li><li>Preuve du parasite : œufs (urine, selles, tissu) ou sérologie positive avec tableau typique.</li><li>Hémorragie variqueuse : vasoactif pendant 2 à 5 jours dès la suspicion, intubation avant endoscopie si conscience troublée ou hématémèse active.</li><li>Phase aiguë symptomatique : pas de praziquantel seul ; corticoïdes en cas d’atteinte neurologique après exclusion de <i>Strongyloides</i>.</li><li>Post-splénectomie : infection fulminante, risque maximal pendant les deux premières années, persistant à vie.</li></ul></template>
<template data-pop="pareto-d77-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="d77-9,d77-10,d77-11"></p><ul><li>Praziquantel 40 mg/kg en un jour (60 mg/kg pour <i>S. japonicum</i>, <i>mekongi</i>, <i>malayensis</i>) ; il traite le ver, pas la fibrose installée.</li><li>Pas d’information professionnelle Swissmedic trouvée pour le praziquantel : à vérifier.</li><li>BBNS + ligature ; propranolol seul mentionné en Suisse pour l’hypertension portale ; carvédilol hors indication suisse.</li><li>TIPS : succès technique 83 %, aucun saignement sur 30,9 années-patient, encéphalopathie transitoire chez 5 patients sur 13.</li><li>Le TIPS laisse la thrombopénie ; la splénectomie la corrige mais expose à l’infection et à la thrombocytose.</li><li>Vaccins : PCV20, MCV-ACWY ×2, MenB ×2 avec rappels tous les 5 ans, grippe annuelle ; pas d’antibioprophylaxie continue.</li></ul></template>
<template data-pop="pareto-d77-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="d77-12,d77-13,d77-14"></p><ul><li>Contrôle à trois mois ; la sérologie reste positive et ne sert pas au suivi ; retraitement possible si l’infection persiste.</li><li>Dépistage : ECDC (moins de cinq ans), consensus espagnol (toute personne à risque), Swiss TPH (réfugiés).</li><li>Enfant : fibrose dès 6 ans ; praziquantel sûr dès 2 ans selon l’OMS.</li><li>VHB ou VHC : facteur de dégradation hépatique après TIPS.</li><li>HVPG ≥ 10 mmHg : hypertension portale cliniquement significative.</li></ul></template>
<template data-pop="pareto-d77-exam" data-title="Pareto — Examens"><p class="ratio" data-cover="d77-e-1,d77-e-2,d77-e-3,d77-e-4,d77-e-5"></p><ul><li>Thrombopénie des formes avancées (20 à 144 G/L avant TIPS) ; hémogramme non utilisable comme marqueur diagnostique de substitution.</li><li>Œufs : référence et identification de l’espèce ; au moins trois selles à jours alternés, urine entre 10 h et 15 h.</li><li>Sérologie : dépiste, ne suit pas.</li><li>Échographie-Doppler : fibrose périportale, rate, flux portal ; gastroscopie : varices (Paquet).</li><li>HVPG peut sous-estimer l’hypertension portale présinusoïdale.</li></ul></template>
<template data-pop="pareto-d77-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="d77-p-1,d77-p-2,d77-p-3,d77-p-4,d77-p-5"></p><ul><li>Quatre cibles : ver, pression portale, saignement, infection post-splénectomie.</li><li>Propranolol : départ 20 mg ×2/j, cible −25 % de fréquence cardiaque, maximum 160 mg ×2/j ; masque la tachycardie hémorragique.</li><li>Praziquantel pendant ou après le repas ; rifampicine et corticoïdes en diminuent les taux.</li><li>Vaccin par voie intramusculaire si plaquettes &gt; 20 G/L.</li><li>Éviter : praziquantel seul en phase aiguë, antibioprophylaxie continue, suivi par la sérologie.</li></ul></template>
<template data-pop="pareto-d77-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="d77-s-physio-body"></p><ul><li>Obstacle avant les sinusoïdes : la pression monte, le parenchyme fonctionne.</li><li>HSS : fonction conservée ; cirrhose : fonction altérée.</li><li>HVPG sous-estime la pression en cas d’obstacle présinusoïdal.</li><li>Rate congestive : pulpe rouge augmentée, rétention de cellules.</li></ul></template>
<template data-pop="pareto-d77-s-immun" data-title="Pareto — Parasitologie et immunité"><p class="ratio" data-cover="d77-s-immun-body"></p><ul><li><i>S. mansoni</i> et <i>S. japonicum</i> produisent l’atteinte hépatosplénique ; <i>S. haematobium</i> l’atteinte urogénitale.</li><li>Vers adultes : 5 à 7 ans, jusqu’à 30 ans.</li><li>Les antigènes de l’œuf induisent des granulomes qui l’isolent ; la répétition fibrose.</li><li>Facteurs de progression : charge parasitaire, génétique, infection dans l’enfance, immunomodulation T.</li></ul></template>
<template data-pop="pareto-d77-s-hemato" data-title="Pareto — Hématologie cellulaire"><p class="ratio" data-cover="d77-s-hemato-body"></p><ul><li>Rate : pulpe rouge augmentée, fibrose, macrophages à hémosidérine, corps de Gamna-Gandy.</li><li>Cytopénies : rétention, phagocytose, médiation cytokinique (hypothèses générales).</li><li>Hémolyse intravasculaire chronique : activation plaquettaire, thrombose.</li><li>Thrombocytose post-splénectomie jusqu’à 967 G/L.</li></ul></template>
