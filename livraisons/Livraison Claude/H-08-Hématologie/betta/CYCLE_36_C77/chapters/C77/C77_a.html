<template id="ch-C77"><div class="chap"><div class="chap-head"><div class="code">C 77 · Hématologie · Ganglions lymphatiques, atteinte secondaire</div><h1>Tumeur maligne des ganglions lymphatiques, secondaire et non précisée</h1><span class="status">Cycle Betta 36 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la métastase ganglionnaire</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#c77-0">Question clinique</a></li><li><a href="#c77-1">Définition et périmètre</a></li><li><a href="#c77-2">Fréquence et pronostic</a></li><li><a href="#c77-3">Physiopathologie</a></li><li><a href="#c77-4">Causes, topographie et facteurs de risque</a></li><li><a href="#c77-5">Anamnèse</a></li><li><a href="#c77-6">Examen clinique</a></li><li><a href="#c77-7">Démarche diagnostique</a></li><li><a href="#c77-8">Urgences, pièges et complications</a></li><li><a href="#c77-9">Prise en charge</a></li><li><a href="#c77-10">Suivi et pronostic</a></li><li><a href="#c77-11">Situations particulières</a></li><li><a href="#c77-12">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="c77-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans ce <b>cas fictif</b>, un homme de 64 ans, fumeur, consulte pour un ganglion cervical dur, non douloureux, apparu il y a trois semaines. Il ne présente aucune fièvre ni aucun signe infectieux. L’examen ne trouve pas de lésion évidente de la bouche. Ce tableau pose trois questions successives : le ganglion est-il réactif, lymphomateux ou métastatique ; quel prélèvement obtient un tissu exploitable sans compromettre la suite ; et, si la nature métastatique est prouvée sans tumeur primitive visible, que reste-t-il à chercher avant de parler de <button class="w" data-k="c77-cup">tumeur de primitif inconnu (définition et limites)</button> ?</p>
<p>La rubrique <b>C77</b> désigne la <button class="w" data-k="c77-codage">métastase ganglionnaire ou la tumeur ganglionnaire non précisée (périmètre du code et exclusions)</button>. Les lymphomes, qui naissent dans le ganglion, en sont exclus. Le sujet est donc transversal : il relie l’examen d’une <button class="w" data-k="c77-adenopathie">adénopathie (définition et seuil de persistance)</button> au bilan d’un cancer encore sans origine connue, et il confronte l’hématologue à des diagnostics curables qu’il ne faut pas manquer.</p>
<div class="key"><b>À retenir.</b> Une adénopathie persistante se traite d’abord comme un problème de diagnostic tissulaire. Le but est d’obtenir un prélèvement adéquat, de distinguer lymphome et carcinome, puis de reconnaître les sous-groupes de métastases ganglionnaires pour lesquels un traitement à visée curative existe.</div>
</section>

<section class="ilot" id="c77-1"><h2><span class="n">1</span>Définition et périmètre</h2>
<p>Une <button class="w" data-k="c77-adenopathie">adénopathie</button> est une anomalie de taille, de consistance ou de morphologie d’un ou de plusieurs ganglions. Elle est dite généralisée lorsqu’elle touche au moins deux groupes ganglionnaires non contigus, ce qui concerne environ un quart des adénopathies (Swiss Medical Weekly 2024). Cette définition est purement descriptive : elle ne préjuge ni de la cause ni du caractère malin.</p>
<p>La <b>métastase ganglionnaire</b> est l’atteinte secondaire d’un ganglion par un cancer solide. Le code C77 couvre cette atteinte secondaire ainsi que la tumeur maligne ganglionnaire non précisée. La classification allemande de référence exclut de C77 les tumeurs ganglionnaires <b>désignées comme primitives</b>, c’est-à-dire les lymphomes (C81 à C86 et C96). La conséquence pratique est directe : la pathologie ganglionnaire primitive relève des chapitres des lymphomes, et la rubrique C77 suppose une atteinte maligne secondaire ou non précisée. Le <button class="w" data-k="c77-codage">détail du périmètre et des huit sous-codes</button> est donné dans la fenêtre associée.</p>
<p>Le <b>syndrome de primitif inconnu</b>, ou <button class="w" data-k="c77-cup">CUP</button> (<i>cancer of unknown primary</i>), est une tumeur maligne confirmée par l’histologie ou la cytologie dont l’origine reste inconnue ou incertaine après un bilan de base standardisé puis un bilan clinique et anatomopathologique étendu (Onkopedia 2025). Cette définition est volontairement exigeante : tant que le bilan n’a pas été conduit à son terme, le patient n’a pas un CUP mais une métastase dont on cherche l’origine. Lorsque le primitif est connu, la métastase ganglionnaire s’inscrit dans le stade N du <button class="w" data-k="c77-tnm">TNM (stade N)</button> du cancer primitif.</p>
<div class="trap"><span class="k">Piège</span> Ne pas coder en lymphome une adénopathie tumorale sans avoir obtenu de tissu adéquat, et ne pas parler de CUP après un bilan incomplet. Dans les deux cas, une catégorie thérapeutique est fermée par une étiquette posée trop tôt.</div>

</section>

<section class="ilot" id="c77-2"><h2><span class="n">2</span>Fréquence et pronostic</h2>
<p>Aucune donnée épidémiologique suisse propre au syndrome de primitif inconnu ni à la rubrique C77 n’a été trouvée dans les sources lues. Les chiffres ci-dessous sont donc européens ou issus de séries étrangères, et chacun est daté. Cette lacune est nommée pour que le lecteur ne lise pas une prévalence suisse là où elle n’existe pas.</p>
<table class="t"><thead><tr><th>Population</th><th>Donnée rapportée</th><th>Source</th></tr></thead><tbody>
<tr><td>Adénopathies en médecine de famille</td><td>Incidence annuelle de 0,5 à 0,6 % (données de 1981 et 1984)</td><td>Swiss Medical Weekly 2024</td></tr>
<tr><td>Siège de ces adénopathies</td><td>Tête et cou 55 %, aine 14 %, région sus-claviculaire 5 %, aisselle 5 %</td><td>Swiss Medical Weekly 2024</td></tr>
<tr><td>Malignité chez tous les patients avec adénopathie</td><td>1,1 à 8,1 % ; suspicion initiale confirmée chez 14 à 17,3 % des adultes</td><td>Swiss Medical Weekly 2024</td></tr>
<tr><td>Adénopathie sus-claviculaire</td><td>Risque de malignité de 34 à 86 %, surtout après 40 ans</td><td>Swiss Medical Weekly 2024</td></tr>
<tr><td>Primitif inconnu (CUP)</td><td>4 à 15 pour 100 000 par an, 1 à 3 % des tumeurs (chiffre ancien) ; environ 1 % des nouveaux cancers dans le registre allemand 2021–2023</td><td>Onkopedia 2025</td></tr>
<tr><td>CUP, registre allemand</td><td>Âge médian 71 ans (hommes) et 73 ans (femmes) ; adénocarcinome environ 46 %, épidermoïde environ 17 %, neuroendocrine environ 14 %</td><td>Onkopedia 2025</td></tr>
</tbody></table>
<p>La fourchette de 1,1 à 8,1 % est large parce que les séries diffèrent par le recrutement : une population de médecine de famille contient surtout des causes réactives, alors qu’une population adressée en consultation spécialisée est enrichie en cancers. Le chiffre ne se transpose donc pas d’un contexte à l’autre. La <button class="w" data-k="c77-facteurs">probabilité de malignité augmente avec des facteurs identifiables</button> : sexe masculin, ethnie caucasienne, siège sus-claviculaire, atteinte simultanée de plusieurs régions, et âge croissant.</p>
<p>Le pronostic dépend du sous-groupe. Pour l’ensemble des CUP, la survie médiane est de 6 à 10 mois dans les études et d’environ 3 mois dans les registres, avec une survie à 5 ans de 5 à 15 % ; les <button class="w" data-k="c77-favorable">sous-groupes favorables</button> (15 à 25 % des cas localisés) font exception. Le <button class="w" data-k="c77-pronostic">pronostic détaillé par sous-groupe</button> figure plus bas.</p>

<section class="ilot" id="c77-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>La métastase ganglionnaire s’explique par l’anatomie du système lymphatique. Les <b>lymphatiques initiaux</b> sont des tubes borgnes, sans valves, à membrane basale discontinue et sans péricytes. Des jonctions discontinues entre leurs cellules endothéliales laissent entrer le liquide interstitiel. Les collecteurs possèdent en revanche une membrane basale, des valves et des cellules musculaires lisses. La lymphe traverse ensuite le ganglion par les sinus sous-capsulaire, cortical et médullaire, puis rejoint le sang par le canal thoracique (<button class="w" data-k="c77-lymphangio">source mécanistique et sa limite</button>).</p>
<p>Une cellule tumorale peut donc pénétrer dans un lymphatique initial sans traverser de membrane épaisse. Le passage est facilité par la grande surface de contact des lymphatiques et par la sécrétion de <button class="w" data-k="c77-lymphangio">VEGF-C et VEGF-D (facteurs de croissance lymphatiques)</button> par les cellules tumorales, immunitaires et fibroblastes : ces facteurs activent le récepteur VEGFR-3 des cellules endothéliales lymphatiques et provoquent la formation de nouveaux vaisseaux (lymphangiogenèse). La chimiokine <button class="w" data-k="c77-ccl21">CCL21 (guidage des cellules CCR7)</button>, produite par l’endothélium lymphatique, attire les cellules tumorales qui portent le récepteur CCR7.</p>
<p>Le premier ganglion atteint, ou <button class="w" data-k="c77-sentinelle">ganglion sentinelle (niche prémétastatique et tolérance)</button>, change avant même d’être envahi : dans un modèle animal, VEGF-C étend d’abord le réseau lymphatique du ganglion sentinelle. La colonisation du ganglion induit ensuite une tolérance immunitaire qui peut favoriser la dissémination à distance. Cette observation explique pourquoi l’atteinte ganglionnaire a une valeur pronostique péjorative, et non seulement un rôle de relais.</p>
<p>La conséquence clinique est topographique. Chaque groupe ganglionnaire draine un territoire défini, de sorte que <button class="w" data-k="c77-drainage">le siège de l’adénopathie oriente vers le primitif</button>. Cette règle sert de guide et non de preuve : certains sièges, comme la région sus-claviculaire, drainent plusieurs organes.</p>
<p>Les mécanismes du CUP lui-même restent mal compris. Onkopedia 2025 mentionne un groupe hétérogène ou une entité propre, avec l’hypothèse d’un avantage de croissance de la métastase (signature prométastatique, microenvironnement, pression immunitaire) et la notion de « cancer métastatique primitif ». Le mécanisme ci-dessus repose sur une revue consacrée au cancer gastrique : sa généralisation aux autres tumeurs est une extrapolation, signalée comme telle.</p>
<div class="key"><b>À retenir.</b> Les lymphatiques initiaux sont perméables, les cellules tumorales sont guidées vers le ganglion, et le ganglion sentinelle se prépare avant l’envahissement. Le siège de l’adénopathie renseigne donc sur l’origine probable, mais il ne l’établit pas.</div>
<button class="pareto-btn ui" data-k="pareto-c77-physio">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="c77-4"><h2><span class="n">4</span>Causes, topographie et facteurs de risque</h2>
<p>Devant une adénopathie, les causes se répartissent en trois familles : réactives ou infectieuses, hématologiques (lymphomes et leucémies) et métastatiques. Seule la troisième relève de C77. Dans une série britannique de centre tertiaire, le primitif le plus fréquent des métastases ganglionnaires était le carcinome épidermoïde de la sphère oto-rhino-laryngologique (35 %) ; parmi les hémopathies de cette série, le lymphome de Hodgkin représentait 31 %, le lymphome diffus à grandes cellules B 29 % et le lymphome folliculaire 16 %.</p>
<div class="two"><div class="card"><h4>Causes non malignes</h4><p>Adénite réactive, tuberculose, maladie des griffes du chat, infections sexuellement transmissibles, lupus, VIH, mononucléose, CMV, médicaments et vaccins. En Suisse, la tuberculose est une cause rare d’adénopathie, d’incidence en baisse (5 pour 100 000) ; 357 cas ont été déclarés à l’<button class="w" data-k="c77-sources">OFSP (déclarations 2021)</button> en 2021, dont 27 % extrapulmonaires.</p></div><div class="card"><h4>Causes malignes</h4><p>Métastase d’un carcinome, lymphome, leucémie. La biologie ne distingue pas ces causes : seul le tissu les départage. Chez le sujet âgé, un lymphome ou une métastase explique plus de la moitié des adénopathies cervicales inexpliquées.</p></div></div>
<p>La <b>topographie</b> oriente la recherche du primitif. Le tableau suivant associe chaque région à ses sous-codes et à ses primitifs probables. Chaque ligne reprend Swiss Medical Weekly 2024 et Onkopedia 2025.</p>
<table class="t"><thead><tr><th>Région (sous-code)</th><th>Primitifs et diagnostics à envisager</th></tr></thead><tbody>
<tr><td>Cervicale, niveaux I, II, III, V, VI (<button class="w" data-k="c77-codage">C77.0</button>)</td><td>Carcinome épidermoïde de la cavité buccale, de l’oropharynx, de l’hypopharynx, du nasopharynx, du larynx ; thyroïde ; glandes salivaires ; lymphome</td></tr>
<tr><td>Sus-claviculaire, niveau IV (C77.0)</td><td>Médiastin et poumon (environ 50 %), œsophage ; à gauche (<button class="w" data-k="c77-troisier">ganglion de Virchow et signe de Troisier</button>) : testicule, ovaire, rein, pancréas, prostate, estomac, vésicule ; seulement 15 % d’origine ORL</td></tr>
<tr><td>Intrathoracique (C77.1)</td><td>Ganglions médiastinaux : accès par ponction échoguidée transbronchique pour les ganglions groupés de plus de 10 à 15 mm</td></tr>
<tr><td>Intra-abdominale (C77.2) et intrapelvienne (C77.5)</td><td>Orientation à partir du siège ; sources lues limitées à l’énoncé des sous-codes</td></tr>
<tr><td>Axillaire (C77.3)</td><td>Sein (cancer occulte : moins de 1 % des nouveaux cancers du sein), lymphome, poumon, thyroïde, estomac, côlon, pancréas, ovaire, rein, mélanome</td></tr>
<tr><td>Inguinale (C77.4)</td><td>Voies génitales masculines et féminines, canal anal, tumeurs cutanées ; ovaire (1,6 % des adénopathies inguinales palpables) ; pénis et vulve</td></tr>
<tr><td>Sièges multiples (C77.8), sans précision (C77.9)</td><td>Régions précisées par codes secondaires ; ganglion non localisé dans le dossier</td></tr>
</tbody></table>
<p>Les <b>facteurs de risque de malignité</b> sont cliniques plutôt que causaux : un siège sus-claviculaire, un âge élevé, le sexe masculin et l’atteinte de plusieurs régions augmentent la probabilité de cancer, sans en être la cause. Cette distinction évite de lire une association pronostique comme une relation de cause à effet.</p>
<div class="trap"><span class="k">Piège</span> Plusieurs lésions palpables ne sont pas des adénopathies : la hernie est la masse inguinale la plus fréquente, un tissu mammaire accessoire peut siéger à l’aisselle, une réaction aux implants en silicone ou une adénopathie après vaccin à ARN messager contre la <button class="w" data-k="c77-vaccin">COVID-19 (adénopathie post-vaccinale)</button> (environ 1 %, axillaire) simule une atteinte tumorale.</div>

<section class="ilot" id="c77-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Toute adénopathie qui persiste plus de <b>deux semaines</b> est suspecte et justifie un bilan (Swiss Medical Weekly 2024). Ce seuil de durée est le critère retenu par la revue pour déclencher le bilan. L’interrogatoire cherche un antécédent de cancer, des morsures ou griffures, des infections récentes, des voyages, des expositions et les <button class="w" data-k="c77-medicaments">médicaments pouvant provoquer une adénopathie</button>.</p>
<div class="two"><div class="card"><h4>Éléments en faveur d’une cause bénigne</h4><p>Ganglion mou, mobile, bien limité. Contexte infectieux récent, griffure de chat (la maladie des griffes du chat provoque une adénopathie chez 90 % des patients atteints), prise d’un médicament en cause.</p></div><div class="card"><h4><button class="w" data-k="c77-alarme">Signes d’alarme (liste complète)</button></h4><p>Dureté, fixité, ulcération cutanée, persistance, âge supérieur à 40 ans avec consommation d’alcool ou de tabac, odynophagie, dysphagie, baisse d’audition récente, dysphonie, lésion cutanée suspecte.</p></div></div>
<p>L’odynophagie, la dysphagie, la baisse d’audition récente et la dysphonie sont des signes d’alarme de la sphère ORL. La revue ne les associe pas un à un à un siège précis : l’endoscopie de la sphère ORL explore l’ensemble. L’âge supérieur à 40 ans avec consommation d’alcool ou de tabac figure aussi parmi les signes d’alarme, ce qui donne du poids à ces antécédents dans l’interrogatoire.</p>
<div class="trap"><span class="k">Piège</span> Les médicaments sont une cause d’adénopathie souvent oubliée. La liste de la revue suisse comprend l’allopurinol, l’aténolol, le captopril, la carbamazépine, certaines céphalosporines, l’hydralazine, la pénicilline, la phénytoïne, la primidone, la quinidine, les sulfamides et le sulindac. Une cause médicamenteuse plausible ne dispense pas du prélèvement si le ganglion persiste.</div>
</section>

<section class="ilot" id="c77-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, constantes, puis palpation systématique de tous les groupes ganglionnaires accessibles. Le but est de caractériser chaque ganglion (taille, consistance, mobilité, fixité, ulcération cutanée), de compter les régions atteintes et de chercher le primitif dans le territoire de drainage. La distinction entre adénopathie localisée et généralisée change la liste des causes.</p>
<div class="two"><div class="card"><h4>Examen oto-rhino-laryngologique complet</h4><p>Obligatoire devant toute adénopathie cervicale. Il comprend le cuir chevelu, la peau, l’<button class="w" data-k="c77-orl">oropharynx, le nasopharynx, les fosses nasales, le larynx</button>, l’otoscopie, les glandes salivaires, la thyroïde et les nerfs crâniens. Un carcinome épidermoïde de la tête et du cou est la cause la plus fréquente de métastase ganglionnaire dans la série britannique citée.</p></div><div class="card"><h4>Examens ciblés selon la région</h4><p>Dans le bilan de base du CUP, l’examen complet inclut la palpation testiculaire chez l’homme et l’examen mammaire chez la femme. Chez la femme, un ganglion axillaire isolé fait chercher un cancer du sein occulte ; chez l’homme de moins de 50 ans, une tumeur germinale extragonadique est à exclure.</p></div></div>
<p>Un ganglion mou, mobile et bien limité oriente vers une cause bénigne. Un ganglion dur, fixé ou ulcéré oriente vers la malignité. La <button class="w" data-k="c77-troisier">palpation de la fosse sus-claviculaire gauche</button> doit être systématique : un ganglion à ce niveau comporte un risque de malignité de 34 à 86 %. À gauche, il fait aussi évoquer un primitif abdominal ou pelvien, et pas seulement thoracique. L’absence d’un signe ne l’exclut pas : seul le tissu tranche.</p>
<div class="trap"><span class="k">Piège</span> Un examen ORL « normal » à l’inspection n’exclut pas un primitif du nasopharynx, de la base de langue ou de l’hypopharynx. Ces sièges sont invisibles sans endoscopie, ce qui justifie la <button class="w" data-k="c77-hpv">panendoscopie</button> lorsque l’imagerie ne montre pas le primitif.</div>
