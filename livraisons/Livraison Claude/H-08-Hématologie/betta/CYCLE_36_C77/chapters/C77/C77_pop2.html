<template data-pop="c77-echo" data-title="Échographie : critères de malignité">
<div class="lab">Critères</div><p>Grand axe augmenté, rapport longueur/largeur abaissé (ganglion arrondi, index de Solbiati), structure hétérogène, hile non visible, adhérence, hypervascularisation. Précision de 97 % dans une série.</p>
<div class="lab">Application</div><p>L’échographie est le premier examen ; elle guide le prélèvement et se complète par scanner injecté ou IRM.</p>
<div class="lab">Limite</div><p>Série unique ; les valeurs de sensibilité et de spécificité séparées ne figurent pas dans le dossier.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-tep" data-title="TEP-CT : rendement et limites">
<div class="lab">Indications</div><p>Recommandé pour le CUP cervical (avant la panendoscopie), la lésion unique ou oligométastatique.</p>
<div class="lab">Rendement</div><p>Détection du primitif : 36 % dans une série de CUP cervicaux avec modification du traitement chez 45,8 % ; 37 à 38 % dans une méta-analyse de CUP ganglionnaires et péritonéaux.</p>
<div class="lab">Limite</div><p>Captation possible environ 3 semaines après un vaccin à ARN messager contre la COVID-19.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-fna" data-title="Cytoponction (FNA)">
<div class="lab">Atouts</div><p>Simple et peu coûteuse. L’immunocytologie et la cytométrie en flux améliorent le rendement. Le typage retrouve le site primitif dans 75 % des métastases.</p>
<div class="lab">Limites</div><p>Sensibilité 56 %, valeur prédictive négative 72 %, rendement faible dans les lymphomes T et de Hodgkin.</p>
<div class="lab">Application</div><p>Dans le cou, la cytoponction précède toute exérèse. Un résultat négatif n’exclut pas la malignité.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-cnb" data-title="Biopsie au trocart (CNB)">
<div class="lab">Atouts</div><p>Calibre 16 à 18 G. Architecture conservée, biologie moléculaire possible. Précision 95 % (7093 biopsies) ; sensibilité 92 % contre 74 % pour la cytoponction dans le lymphome cervical.</p>
<div class="lab">Limite</div><p>17 % de diagnostics erronés par rapport à la biopsie ouverte dans les lymphoproliférations.</p>
<div class="lab">Application</div><p>Méthode de choix dans le cou pour typer la tumeur sans l’essaimage de l’exérèse.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-exerese" data-title="Biopsie-exérèse">
<div class="lab">Indication</div><p>Référence en cas de lymphome suspecté ou d’échec des autres méthodes, hors tête et cou.</p>
<div class="lab">Limites</div><p>Geste en bloc opératoire sous anesthésie ; essaimage de 7 % dans le cou.</p>
<div class="lab">Application</div><p>Adénopathies multiples : biopsier le plus gros ganglion hors aine ; rendement décroissant du sus-claviculaire au cervical, à l’épitrochléen puis à l’inguinal.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-ihc" data-title="Immunohistochimie : algorithme de typage">
<div class="lab">Étape 1</div><p>Pan-cytokératine AE1/AE3 : carcinome. CD45 : hémopathie (CD3, CD20, CD79a, CD30). SOX10, S100, Melan-A, HMB45 : mélanome. SALL4, OCT3/4 : tumeur germinale. Synaptophysine, INSM1 : neuroendocrine.</p>
<div class="lab">Étape 2</div><p>CK7 positive et CK20 négative : poumon (TTF1), sein (GATA3, ER, PR, HER2), voies müllériennes (PAX8, WT1), thyroïde (TTF1, thyroglobuline). CK7 négative et CK20 positive : côlon-rectum (CDX2, SATB2), Merkel. CK7 et CK20 positives : vessie (GATA3, p63). CK7 et CK20 négatives : foie (arginase-1), rein (PAX8, PAX2, CD10), prostate (NKX3.1, PSMA, PSA).</p>
<div class="lab">Compléments</div><p>PD-L1 et protéines MMR font partie du bilan.</p>
<div class="lab">Limite</div><p>L’orientation est probabiliste ; elle se confirme par la clinique et l’imagerie.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-ngs" data-title="Séquençage de nouvelle génération (NGS)">
<div class="lab">Définition</div><p>Technique qui recherche en une seule analyse plusieurs altérations génétiques de la tumeur.</p>
<div class="lab">Place</div><p>L’ESMO propose le NGS en routine. Le résultat alimente le comité moléculaire pour une thérapie ciblée. Le bénéfice du profil d’expression génique n’est pas démontré.</p>
<div class="lab">Limite</div><p>Le texte intégral ESMO 2023 n’a pas été lu ; le contenu est repris d’Onkopedia 2025 et de Swiss Medical Weekly 2024.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-immuno" data-title="Immunothérapie et inhibiteurs de point de contrôle">
<div class="lab">Indications citées</div><p>Après radiochimiothérapie d’un CUP thoracique, inhibiteur de point de contrôle si PD-L1 ≥ 1 %. Dans les formes défavorables, immunothérapie si MSI/dMMR ou charge mutationnelle (TMB) élevée.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse de l’atézolizumab n’a pas été lue : aucune dose ni contre-indication n’est donnée ici.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-favorable" data-title="Sous-groupes favorables et défavorables">
<div class="lab">Répartition</div><p>Environ 15 à 25 % des CUP localisés sont favorables ; 70 à 85 % sont défavorables.</p>
<div class="lab">Sous-groupes favorables</div><p>Cervical tête-et-cou-like, sus-claviculaire niveau IV, axillaire féminin sein-like, inguinal isolé, médiastinal ou thoracique, oligométastatique, côlon-like, rein-like.</p>
<div class="lab">Application</div><p>Le sous-groupe détermine l’intention curative ou palliative.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://doi.org/10.1007/s00117-023-01126-7" target="_blank" rel="noopener">Bochtler 2023, nouvelles lignes directrices ESMO (résumé)</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-cervical-trt" data-title="CUP cervical tête-et-cou-like : schéma par stade N">
<div class="lab">N1</div><p>Évidement fonctionnel avec ou sans radiothérapie, ou radiothérapie définitive.</p>
<div class="lab">N2</div><p>Évidement associé à la radiothérapie.</p>
<div class="lab">N3 ou facteurs de risque</div><p>N3 : plus de 6 cm. Évidement puis radiochimiothérapie bilatérale ; option de carboplatine AUC 2 avec paclitaxel 50 mg/m² hebdomadaires.</p>
<div class="lab">Limite</div><p>Les doses de radiothérapie ne sont pas dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-axillaire-trt" data-title="CUP axillaire et inguinal">
<div class="lab">Axillaire chez la femme</div><p>Exérèse avec ou sans curage des niveaux I–II ; mastectomie non nécessaire. Adénocarcinome traité comme un cancer du sein N+ (traitement (néo)adjuvant, radiothérapie mammaire homolatérale). Épidermoïde : curage et radiothérapie.</p>
<div class="lab">Inguinal isolé</div><p>Exérèse puis radiothérapie incluant le drainage iliaque, avec ou sans fluoropyrimidine. Après lymphadénectomie radicale d’un épidermoïde inguinal ou axillaire, la survie à 5 ans est de 65 % (CUP) contre 49 % (primitif connu), différence non significative.</p>
<div class="lab">Limite</div><p>Les doses ne sont pas données dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-defavorable" data-title="Formes défavorables : doublets de platine">
<div class="lab">Traitement</div><p>Doublet à base de platine : carboplatine-paclitaxel ou cisplatine-gemcitabine. NGS et thérapie ciblée selon le comité moléculaire ; immunothérapie si MSI/dMMR ou TMB élevé. Soins palliatifs seuls si l’espérance de vie est inférieure à 4 mois.</p>
<div class="lab">Limite</div><p>Les informations professionnelles suisses du cisplatine et de la gemcitabine n’ont pas été lues : leurs doses ne sont pas données.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-pronostic" data-title="Pronostic par sous-groupe">
<div class="lab">CUP global</div><p>Survie médiane de 6 à 10 mois dans les études, d’environ 3 mois dans les registres ; survie à 5 ans de 5 à 15 %. Carcinome épidermoïde : plus de 30 % à 5 ans.</p>
<div class="lab">CUP cervical</div><p>Survie à 5 ans : N1 61 %, N2 51 %, N3 26 %. Un écart de 57 % contre 82 % est rapporté selon la rupture capsulaire (sens exact non précisé dans le dossier). Médiane de 45 mois dans une série de 365 patients.</p>
<div class="lab">CUP axillaire sein-like</div><p>Survie à 5 ans de 50 à 88 %.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-suivi" data-title="Suivi du CUP">
<div class="lab">Principe</div><p>Il n’existe aucune recommandation de suivi fondée sur des preuves. Le suivi est structuré si l’intention est curative et orienté sur les symptômes si elle est palliative (Onkopedia 2025).</p>
<div class="lab">Limite</div><p>Aucun calendrier chiffré n’est donné dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-carboplatine" data-title="Carboplatine (information professionnelle suisse)">
<div class="lab">Indications suisses</div><p>Cancers de la tête et du cou en association avec la radiothérapie, de l’ovaire, bronchique à petites cellules, du col. Le CUP n’est pas une indication enregistrée.</p>
<div class="lab">Posologie</div><p>400 mg/m² ou formule de Calvert (AUC × [DFG + 25]), non applicable si la clairance est inférieure à 60 mL/min.</p>
<div class="lab">Effets indésirables</div><p>Myélosuppression dose-limitante (nadir à 21 jours en monothérapie) ; anémie 71 %, thrombopénie 25 %.</p>
<div class="lab">Contre-indications</div><p>Insuffisance rénale grave, myélosuppression grave, saignement tumoral, grossesse.</p>
<div class="lab">Limite</div><p>Le mécanisme d’action n’est pas détaillé dans l’extrait lu.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse du carboplatine (Sandoz), AIPS/AmiKo, GTIN 7680548290014</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-paclitaxel" data-title="Paclitaxel (information professionnelle suisse)">
<div class="lab">Indications suisses</div><p>Cancers de l’ovaire, bronchique non à petites cellules, du sein. Le CUP n’est pas une indication enregistrée.</p>
<div class="lab">Prémédication</div><p>Corticoïde, anti-H1 et anti-H2, car l’hypersensibilité peut être grave.</p>
<div class="lab">Adaptation</div><p>Réduction de 20 % si les neutrophiles sont inférieurs à 500/mm³ ou en cas de neuropathie sévère. Contre-indiqué si les neutrophiles sont inférieurs à 1500/mm³.</p>
<div class="lab">Limite</div><p>La dose de départ n’a pas été extraite.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse du paclitaxel (Accord), AIPS/AmiKo, GTIN 7680668530014</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-calvert" data-title="Formule de Calvert">
<div class="lab">Formule</div><p>Dose (mg) = AUC × (DFG + 25). L’AUC est l’aire sous la courbe cible ; le DFG est le débit de filtration glomérulaire.</p>
<div class="lab">Exemple chiffré</div><p>AUC de 2 et DFG de 80 mL/min : 2 × (80 + 25) = 210 mg. Exemple pédagogique fictif.</p>
<div class="lab">Limite</div><p>Non applicable si la clairance est inférieure à 60 mL/min (information professionnelle suisse).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse du carboplatine (Sandoz), AIPS/AmiKo, GTIN 7680548290014</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="pareto-c77-definition" data-title="Pareto — Définition et périmètre">
<p class="ratio" data-cover="c77-0,c77-1"></p><ul><li>C77 est l’atteinte ganglionnaire secondaire ou non précisée ; les lymphomes primitifs (C81–C86, C96) en sont exclus.</li><li>Un CUP exige une malignité prouvée et un bilan de base puis étendu complet.</li><li>Primitif connu : la métastase relève du stade N de ce cancer.</li></ul></template>
<template data-pop="pareto-c77-epidemio" data-title="Pareto — Fréquence et pronostic">
<p class="ratio" data-cover="c77-2"></p><ul><li>Aucune donnée suisse du CUP ou de C77 dans les sources lues.</li><li>Sus-claviculaire : 34–86 % de malignité. CUP : 1–3 % des cancers.</li><li>Les sous-groupes favorables (15–25 %) changent le pronostic.</li></ul></template>
<template data-pop="pareto-c77-physio" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="c77-3"></p><ul><li>Lymphatiques initiaux perméables ; VEGF-C/D, VEGFR-3, CCL21/CCR7.</li><li>Le ganglion sentinelle se prépare puis induit une tolérance immunitaire.</li><li>Le siège oriente vers le primitif sans l’établir.</li></ul></template>
<template data-pop="pareto-c77-causes" data-title="Pareto — Causes et topographie">
<p class="ratio" data-cover="c77-4"></p><ul><li>Trois familles : réactive, hématologique, métastatique.</li><li>Le siège (cervical, sus-claviculaire, axillaire, inguinal) oriente le primitif.</li><li>Hernie, tissu mammaire accessoire, vaccin : faux amis.</li></ul></template>
<template data-pop="pareto-c77-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="c77-5,c77-6"></p><ul><li>Persistance de plus de 2 semaines ou signe d’alarme : bilan.</li><li>Examen ORL complet ; testicule chez l’homme, sein chez la femme.</li><li>Fosse sus-claviculaire gauche à palper.</li></ul></template>
<template data-pop="pareto-c77-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="c77-7,c77-8"></p><ul><li>Séquence : suspicion, imagerie, tissu, immunohistochimie, primitif.</li><li>Dans le cou, cytoponction ou trocart avant exérèse.</li><li>Ne pas manquer les entités traitables.</li></ul></template>
<template data-pop="pareto-c77-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="c77-9"></p><ul><li>Le traitement suit le sous-groupe favorable ou défavorable.</li><li>Cervical : stade N1, N2, N3 ; axillaire féminin : comme un sein N+.</li><li>Défavorable : doublet de platine, NGS, palliatif si moins de 4 mois.</li></ul></template>
<template data-pop="pareto-c77-suivi" data-title="Pareto — Suivi et pronostic">
<p class="ratio" data-cover="c77-10"></p><ul><li>Survie à 5 ans du CUP cervical : 61 %, 51 %, 26 % selon N.</li><li>Aucun suivi fondé sur des preuves.</li><li>Suivi curatif structuré, palliatif symptomatique.</li></ul></template>
<template data-pop="pareto-c77-particulieres" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="c77-11"></p><ul><li>Sujet âgé : plus de 50 % de malignité en cervical inexpliqué.</li><li>Carboplatine : contre-indiqué en grossesse ; Calvert non applicable si clairance inférieure à 60 mL/min.</li><li>Adénopathie post-vaccinale bénigne dans les 12 semaines.</li></ul></template>
<template data-pop="pareto-c77-imagerie" data-title="Pareto — Imagerie">
<p class="ratio" data-cover="c77-e-2"></p><ul><li>Échographie en premier ; IRM pour nasopharynx.</li><li>TEP-CT : 36 à 38 % de détection du primitif.</li><li>TEP-CT avant panendoscopie dans le CUP cervical.</li></ul></template>
<template data-pop="pareto-c77-prelevement" data-title="Pareto — Prélèvement">
<p class="ratio" data-cover="c77-e-3"></p><ul><li>Cytoponction : sensibilité 56 %, VPN 72 %.</li><li>Trocart : précision 95 %.</li><li>Exérèse : référence hors cou, essaimage 7 % dans le cou.</li></ul></template>
<template data-pop="pareto-c77-ihc" data-title="Pareto — Immunohistochimie et moléculaire">
<p class="ratio" data-cover="c77-e-4"></p><ul><li>Lignée d’abord, organe ensuite par CK7/CK20.</li><li>HPV, EBV pour le cervical.</li><li>NGS en routine, PD-L1 et MMR au bilan.</li></ul></template>
<template data-pop="pareto-c77-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="c77-s-anat-cours"></p><ul><li>Le territoire de drainage oriente le primitif.</li><li>Sus-claviculaire : poumon, œsophage ; à gauche, abdomen et pelvis.</li></ul></template>
<template data-pop="pareto-c77-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="c77-s-histo-cours"></p><ul><li>Lymphatiques initiaux sans valves et à membrane basale discontinue.</li><li>Trocart préserve l’architecture.</li></ul></template>
<template data-pop="pareto-c77-physio-sci" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="c77-s-physio-cours"></p><ul><li>VEGF-C/D vers VEGFR-3 ; CCL21 vers CCR7.</li><li>Tolérance immunitaire du ganglion colonisé.</li></ul></template>
<template data-pop="pareto-c77-bioch" data-title="Pareto — Biochimie et biologie moléculaire">
<p class="ratio" data-cover="c77-s-bioch-cours"></p><ul><li>CK7/CK20 en quatre quadrants.</li><li>Profil probabiliste, confirmé par facteur de transcription et clinique.</li></ul></template>
<template data-pop="pareto-c77-strategie" data-title="Pareto — Stratégie pharmacologique">
