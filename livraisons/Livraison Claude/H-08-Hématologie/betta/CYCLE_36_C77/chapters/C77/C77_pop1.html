<template data-pop="c77-cup" data-title="Syndrome de primitif inconnu (CUP)">
<div class="lab">Définition</div><p>Le CUP (<i>cancer of unknown primary</i>) est une tumeur maligne confirmée par l’histologie ou la cytologie dont l’origine reste inconnue ou incertaine après un bilan de base standardisé et un bilan clinique et anatomopathologique étendu (Onkopedia 2025).</p>
<div class="lab">Application</div><p>La définition suppose deux conditions cumulées : une preuve tissulaire de malignité et un bilan complet. Un patient dont le bilan est inachevé n’a pas un CUP : il a une métastase dont l’origine est en cours de recherche. Lorsque le bilan reste négatif, le codage de la classification allemande est C80.0 (tumeur maligne, localisation primitive inconnue, ainsi désignée) ; C80.9 désigne la tumeur maligne sans précision.</p>
<div class="lab">Biologie</div><p>L’étiologie reste mal comprise : groupe hétérogène ou entité propre. Les hypothèses retenues sont un avantage de croissance de la métastase (signature prométastatique, microenvironnement, pression immunitaire) et la notion de « cancer métastatique primitif ».</p>
<div class="lab">Limite</div><p>Aucune donnée suisse d’incidence n’a été trouvée. Le chiffre de 4 à 15 pour 100 000 par an et de 1 à 3 % des tumeurs est ancien ; le registre allemand 2021–2023 rapporte environ 1 % des nouveaux cancers.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c76-c80.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C76–C80</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-codage" data-title="Périmètre du code C77 et sous-codes">
<div class="lab">Définition</div><p>C77 désigne la tumeur maligne secondaire et non précisée des ganglions lymphatiques. Les tumeurs ganglionnaires désignées comme primitives (lymphomes, C81 à C86 et C96) en sont exclues (BfArM, ICD-10-GM 2024).</p>
<div class="lab">Sous-codes</div><p>C77.0 : ganglions de la tête, de la face et du cou (y compris sus-claviculaires). C77.1 : ganglions intrathoraciques. C77.2 : ganglions intra-abdominaux. C77.3 : ganglions de l’aisselle et du membre supérieur (y compris pectoraux). C77.4 : ganglions inguinaux et du membre inférieur. C77.5 : ganglions intrapelviens. C77.8 : ganglions de sièges multiples. C77.9 : ganglion lymphatique sans précision.</p>
<div class="lab">Application</div><p>Le sous-code suit le siège de la métastase, non l’organe d’origine. Le primitif connu relève du chapitre de son organe ; la métastase ganglionnaire en est le stade N. Si le primitif reste inconnu après bilan, le CUP se code C80.0.</p>
<div class="lab">Limite</div><p>Les intitulés français proviennent de la version de l’Office fédéral de la statistique, la note d’exclusion de la version allemande du BfArM. Les codes secondaires de précision des sièges multiples ne sont pas détaillés ici.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c76-c80.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C76–C80</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">Office fédéral de la statistique, CIM-10-GM 2024, version française</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-adenopathie" data-title="Adénopathie : définition et seuil de persistance">
<div class="lab">Définition</div><p>Une adénopathie est une anomalie de taille, de consistance ou de morphologie d’un ou de plusieurs ganglions. Elle est généralisée lorsqu’elle touche au moins deux groupes non contigus, ce qui représente environ 25 % des adénopathies.</p>
<div class="lab">Seuil</div><p>Toute adénopathie persistant plus de deux semaines est suspecte et justifie un bilan (Swiss Medical Weekly 2024).</p>
<div class="lab">Application</div><p>La durée est le premier critère opérationnel. Elle se combine aux signes d’alarme : dureté, fixité, ulcération cutanée, âge supérieur à 40 ans avec alcool ou tabac, odynophagie, dysphagie, baisse d’audition, dysphonie, lésion cutanée suspecte.</p>
<div class="lab">Limite</div><p>Le seuil provient d’une revue narrative ; il n’est pas validé par une étude suisse dédiée.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-tnm" data-title="Stade N du TNM">
<div class="lab">Définition</div><p>Lorsque le cancer primitif est connu, la métastase ganglionnaire s’inscrit dans le stade N de la classification TNM de ce cancer. Le N décrit l’atteinte ganglionnaire régionale.</p>
<div class="lab">Application</div><p>Le traitement de la métastase ganglionnaire suit alors celui du cancer primitif. Dans le CUP cervical, la sous-classification N1, N2, N3 (N3 : plus de 6 cm) guide l’évidement et la radiochimiothérapie (Onkopedia 2025).</p>
<div class="lab">Limite</div><p>Les critères détaillés du TNM par organe ne sont pas dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c76-c80.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C76–C80</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-facteurs" data-title="Facteurs de malignité d’une adénopathie">
<div class="lab">Définition</div><p>Les facteurs associés à la malignité sont le sexe masculin, l’ethnie caucasienne, la localisation sus-claviculaire et l’atteinte simultanée de plusieurs régions. La probabilité augmente avec l’âge : plus de la moitié des sujets âgés avec adénopathie cervicale inexpliquée ont un lymphome ou une métastase.</p>
<div class="lab">Interprétation</div><p>Ces facteurs sont des associations pronostiques et non des causes. Ils servent à décider d’un prélèvement, pas à poser un diagnostic.</p>
<div class="lab">Limite</div><p>Les séries comportent des biais de recrutement ; les chiffres de 1,1 à 8,1 % de malignité ne se transposent pas d’une population à l’autre.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-lymphangio" data-title="Lymphangiogenèse tumorale : VEGF-C, VEGF-D et VEGFR-3">
<div class="lab">Mécanisme</div><p>Les cellules tumorales, immunitaires et les fibroblastes sécrètent VEGF-C et VEGF-D. Ces facteurs activent VEGFR-3 sur les cellules endothéliales lymphatiques et induisent la formation de nouveaux lymphatiques. La grande surface de contact des lymphatiques facilite l’entrée des cellules tumorales.</p>
<div class="lab">Structure normale</div><p>Lymphatiques initiaux : tubes borgnes sans valves, membrane basale discontinue, sans péricytes, jonctions discontinues. Collecteurs : membrane basale, valves, cellules musculaires lisses. Sinus ganglionnaires : sous-capsulaire, cortical, médullaire ; puis canal thoracique et sang.</p>
<div class="lab">Limite</div><p>La source est une revue consacrée au cancer gastrique. La généralisation à d’autres tumeurs est une extrapolation prudente.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10559534/" target="_blank" rel="noopener">Liu et coll., Eur J Med Res 2023 (cancer gastrique)</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-ccl21" data-title="CCL21 et CCR7 : guidage des cellules tumorales">
<div class="lab">Mécanisme</div><p>La chimiokine CCL21, produite par les cellules endothéliales lymphatiques, attire les cellules tumorales qui expriment le récepteur CCR7. Ce couple dirige les cellules vers le lymphatique puis le ganglion.</p>
<div class="lab">Application</div><p>Cette notion explique le trajet préférentiel de dissémination vers le ganglion régional. Elle ne constitue pas, dans les sources lues, une cible thérapeutique enregistrée.</p>
<div class="lab">Limite</div><p>Modèle gastrique ; aucun traitement dirigé contre ce couple n’est décrit dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10559534/" target="_blank" rel="noopener">Liu et coll., Eur J Med Res 2023 (cancer gastrique)</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sentinelle" data-title="Ganglion sentinelle, niche prémétastatique et tolérance">
<div class="lab">Mécanisme</div><p>Dans un modèle animal, VEGF-C étend d’abord le réseau lymphatique du ganglion sentinelle avant la métastase : le ganglion se prépare. La colonisation induit ensuite une tolérance immunitaire qui peut favoriser la dissémination à distance.</p>
<div class="lab">Application</div><p>La valeur pronostique péjorative de l’atteinte ganglionnaire s’explique en partie par cette tolérance : le ganglion n’est pas seulement un relais anatomique.</p>
<div class="lab">Limite</div><p>Résultat de modèle animal et de revue gastrique ; à ne pas transposer à une prédiction individuelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10559534/" target="_blank" rel="noopener">Liu et coll., Eur J Med Res 2023 (cancer gastrique)</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-drainage" data-title="Drainage lymphatique et orientation vers le primitif">
<div class="lab">Principe</div><p>Le drainage lymphatique régional oriente vers le primitif : la région de l’adénopathie suggère l’organe d’origine (Swiss Medical Weekly 2024).</p>
<div class="lab">Exemples</div><p>Cervical : carcinome épidermoïde ORL, thyroïde, glandes salivaires. Sus-claviculaire : médiastin, poumon, œsophage ; à gauche, organes abdominaux et pelviens. Axillaire : sein, lymphome, poumon, mélanome. Inguinal : voies génitales, canal anal, peau.</p>
<div class="lab">Limite</div><p>La règle est probabiliste. Le sus-claviculaire drainant plusieurs organes, il est le siège le moins spécifique.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-troisier" data-title="Ganglion de Virchow et signe de Troisier">
<div class="lab">Définition</div><p>Le ganglion de Virchow est le ganglion sus-claviculaire gauche ; le signe de Troisier désigne cette adénopathie sus-claviculaire gauche suspecte. Elle fait évoquer testicule, ovaire, rein, pancréas, prostate, estomac ou vésicule biliaire.</p>
<div class="lab">Application</div><p>Seuls 15 % des ganglions sus-claviculaires sont d’origine ORL ; environ la moitié viennent du médiastin ou du poumon. Le risque de malignité d’un ganglion sus-claviculaire est de 34 à 86 %, surtout après 40 ans.</p>
<div class="lab">Limite</div><p>Le signe n’est pas spécifique d’un organe ; il justifie le bilan d’imagerie du CUP.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-vaccin" data-title="Adénopathie après vaccin à ARN messager contre la COVID-19">
<div class="lab">Fait</div><p>Une adénopathie axillaire post-vaccinale est rapportée dans environ 1 % des cas. Une adénopathie axillaire non suspecte dans les 12 semaines est considérée comme bénigne par la Société européenne d’imagerie mammaire ; la captation au TEP peut persister jusqu’à environ 3 semaines.</p>
<div class="lab">Application</div><p>Avant de conclure à une métastase axillaire, on tient compte de la date de la vaccination.</p>
<div class="lab">Limite</div><p>Si la lésion persiste au-delà de ce délai ou porte un signe d’alarme, le bilan standard s’applique.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-medicaments" data-title="Médicaments pouvant provoquer une adénopathie">
<div class="lab">Liste</div><p>Allopurinol, aténolol, captopril, carbamazépine, certaines céphalosporines, hydralazine, pénicilline, phénytoïne, primidone, quinidine, sulfamides, sulindac (Swiss Medical Weekly 2024).</p>
<div class="lab">Application</div><p>Une cause médicamenteuse plausible est notée à l’anamnèse. Elle n’autorise pas à différer le prélèvement si l’adénopathie persiste plus de deux semaines ou porte un signe d’alarme.</p>
<div class="lab">Limite</div><p>La liste de la revue n’est pas exhaustive.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-alarme" data-title="Signes d’alarme d’une adénopathie">
<div class="lab">Liste</div><p>Dureté, fixité, ulcération cutanée, persistance, âge supérieur à 40 ans avec alcool ou tabac, odynophagie, dysphagie, baisse d’audition récente, dysphonie, lésion cutanée suspecte.</p>
<div class="lab">Signes de bénignité</div><p>Ganglion mou, mobile, bien limité.</p>
<div class="lab">Application</div><p>Un signe d’alarme déclenche le bilan même avant deux semaines de persistance.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-orl" data-title="Examen oto-rhino-laryngologique complet">
<div class="lab">Contenu</div><p>Cuir chevelu, peau, oropharynx, nasopharynx, fosses nasales, larynx, otoscopie, glandes salivaires, thyroïde, nerfs crâniens (Swiss Medical Weekly 2024).</p>
<div class="lab">Application</div><p>L’examen est réalisé devant toute adénopathie cervicale avant le prélèvement. Si le primitif n’est pas trouvé, la panendoscopie complète la recherche.</p>
<div class="lab">Limite</div><p>Les sites profonds (nasopharynx, base de langue) ne se voient pas sans endoscopie ou imagerie adaptée.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-hpv" data-title="CUP cervical : HPV, EBV et panendoscopie">
<div class="lab">Définition</div><p>Pour le CUP cervical, une positivité de p16 ou de l’ADN du virus du papillome humain oriente vers l’oropharynx (amygdales, base de langue) avec un meilleur pronostic ; un carcinome lié au virus d’Epstein-Barr oriente vers le nasopharynx.</p>
<div class="lab">Application</div><p>La panendoscopie est associée à une amygdalectomie, avec ou sans mucosectomie de la base de langue ; elle intervient après le TEP-CT lorsque le primitif n’est pas trouvé.</p>
<div class="lab">Limite</div><p>Les seuils de positivité de p16 ne sont pas détaillés dans les sources lues.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-diffdx" data-title="Entités traitables à exclure">
<div class="lab">Liste</div><p>Tumeur germinale extragonadique (homme de moins de 50 ans), lymphome et leucémie, mélanome (y compris achromique), sarcome, carcinome de Merkel, tumeurs neuroendocrines, cancer de la prostate (dosage du PSA, PSMA), cancer du sein connu ou à récepteurs hormonaux positifs (Onkopedia 2025).</p>
<div class="lab">Application</div><p>Ces entités ont chacune un traitement spécifique. L’immunohistochimie les identifie : CD45 pour l’hémopathie, SOX10 et S100 pour le mélanome, SALL4 et OCT3/4 pour la tumeur germinale.</p>
<div class="lab">Limite</div><p>L’ordre d’exclusion n’est pas hiérarchisé dans la source.</p>
<p class="src">Références : <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-sources" data-title="Sources, limites et lacunes du cours">
<div class="lab">Sources lues</div><p>CIM-10-GM 2024 (BfArM, Office fédéral de la statistique) ; Swiss Medical Weekly 2024 ; Onkopedia 2025 ; résumé de Bochtler 2023 ; Eur J Med Res 2023 ; informations professionnelles suisses du carboplatine et du paclitaxel.</p>
<div class="lab">Lacunes</div><p>Le texte intégral de la ligne directrice ESMO 2023 n’a pas pu être lu (accès refusé), ni celui de la ligne directrice EHNS-ESMO-ESTRO 2020. Aucune donnée suisse d’incidence du CUP ni de C77, aucune recommandation d’une société suisse propre au CUP. Les informations professionnelles du cisplatine, de la gemcitabine et de l’atézolizumab n’ont pas été lues. La source mécanistique porte sur le cancer gastrique.</p>
<div class="lab">Déclarations</div><p>Le nombre de déclarations de tuberculose à l’Office fédéral de la santé publique en 2021 est de 357 cas, dont 27 % extrapulmonaires.</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a> ; <a href="https://www.onkopedia.com/de/onkopedia/guidelines/cup-syndrom-krebserkrankungen-mit-unbekanntem-primaertumor/@@guideline/html/index.html" target="_blank" rel="noopener">Onkopedia, Syndrome CUP, 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10559534/" target="_blank" rel="noopener">Liu et coll., Eur J Med Res 2023 (cancer gastrique)</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
<template data-pop="c77-mnemo" data-title="Aide mnémotechnique : tissu avant bistouri">
<div class="lab">Principe</div><p>Dans le cou, on prélève d’abord par cytoponction ou trocart, et l’exérèse vient seulement ensuite. La formule « tissu avant bistouri » résume cette séquence.</p>
<div class="lab">Statut</div><p>Aide pédagogique, non critère officiel.</p>
<div class="lab">Justification</div><p>La règle traduit l’essaimage de 7 % décrit après biopsie-exérèse cervicale (Swiss Medical Weekly 2024).</p>
<p class="src">Références : <a href="https://smw.ch/index.php/smw/article/download/3549/6007/22936" target="_blank" rel="noopener">Hanzalová et Matter, Swiss Medical Weekly 2024;154:3549</a>. Consultation du 15.10.2026. Audit différé : revue IA, distincte d’une validation médicale humaine.</p></template>
