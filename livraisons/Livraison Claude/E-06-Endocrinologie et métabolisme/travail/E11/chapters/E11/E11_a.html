<h1>Diabète sucré de type 2</h1><span class="status">Adulte non enceinte · référentiels SSED 2023 à 2026, mediX 05/2026, consensus ADA/EASD 2026, ESC 2023, information professionnelle suisse · état au 09.10.2026 · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>

<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e11-0">Question clinique</a></li><li><a href="#e11-1">Définition et classification</a></li><li><a href="#e11-2">Épidémiologie et pronostic</a></li><li><a href="#e11-3">De l’insulinorésistance à l’hyperglycémie</a></li><li><a href="#e11-4">Facteurs de risque et dépistage</a></li><li><a href="#e11-5">Interroger pour orienter</a></li><li><a href="#e11-6">Examiner pour mesurer le retentissement</a></li><li><a href="#e11-7">Établir le diagnostic et le type</a></li><li><a href="#e11-8">Urgences métaboliques</a></li><li><a href="#e11-9">Complications chroniques</a></li><li><a href="#e11-10">Objectifs et traitement</a></li><li><a href="#e11-11">Suivi et prévention</a></li><li><a href="#e11-12">Situations particulières</a></li><li><a href="#e11-13">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="e11-0"><h2><span class="n">0</span>Question clinique</h2><p>Un homme de 58 ans, chauffeur-livreur, consulte pour un bilan de santé. Il ne se plaint de rien. Son indice de masse corporelle (IMC) atteint 32 kg/m² et sa pression artérielle 146/88 mmHg. La glycémie veineuse à jeun mesure 8,4 mmol/L ; deux semaines plus tard, l’HbA1c vaut 8,1 %. Le rapport albumine/créatinine urinaire est de 6 mg/mmol et le débit de filtration glomérulaire (DFG) estimé de 68 mL/min/1,73 m².</p><p>Quatre questions structurent la consultation. Le diagnostic est-il établi, et s’agit-il bien d’un diabète de type 2 ? Quels organes sont déjà menacés, et quel est le risque cardiovasculaire et rénal ? Quels médicaments réduisent ce risque au-delà de la glycémie ? Ce traitement est-il compatible avec la conduite professionnelle ?</p><div class="key"><b>Point de départ.</b> Un diabète de type 2 se découvre souvent sans symptôme, par une mesure de routine. <b>Le traitement moderne ne vise plus seulement la glycémie : il protège le cœur, le rein et le poids.</b> Voir <button class="w" data-justification="1" data-k="e11-score2d">les catégories de risque cardiovasculaire du diabétique (ESC 2023)</button>.</div></section>
<section class="ilot" id="e11-1"><h2><span class="n">1</span>Définition et classification</h2><p>Le diabète sucré est une hyperglycémie chronique. Le diabète de type 2 associe une <button class="w" data-justification="1" data-k="e11-insulinoresistance">insulinorésistance (mécanisme et tissus cibles)</button> à un déficit <b>relatif</b> de la sécrétion d’insuline : le pancréas produit de l’insuline, mais pas assez pour vaincre la résistance des tissus. Il représente environ 90 % des diabètes de l’adulte (ESC 2023 ; mediX 2026). Le déficit s’aggrave avec les années, si bien qu’environ 5 % des patients par an deviennent dépendants de l’insuline (mediX 2026).</p><p>Le clinicien distingue le type 2 des autres formes, car chacune appelle un traitement propre. Le tableau résume les catégories à évoquer devant toute hyperglycémie de l’adulte.</p><table class="t"><tr><th>Catégorie</th><th>Mécanisme dominant</th><th>Indice d’orientation</th></tr><tr><td>Diabète de type 2</td><td>Insulinorésistance et déficit relatif</td><td>Surpoids, sédentarité, antécédents familiaux, début progressif</td></tr><tr><td><button class="w" data-justification="1" data-k="e11-type1-lada">Diabète de type 1 et LADA (auto-anticorps)</button></td><td>Destruction auto-immune des cellules β, déficit absolu</td><td>Amaigrissement, cétose, auto-anticorps</td></tr><tr><td><button class="w" data-justification="1" data-k="e11-mody">Diabète monogénique (MODY)</button></td><td>Défaut génétique de la sécrétion</td><td>Sujet jeune et mince, transmission sur plusieurs générations</td></tr><tr><td>Diabète secondaire</td><td>Médicaments, endocrinopathies, pancréatopathies</td><td>Glucocorticoïdes, neuroleptiques, Cushing, pancréatite chronique</td></tr><tr><td>Diabète gestationnel</td><td>Insulinorésistance de la grossesse</td><td>Découverte au deuxième ou au troisième trimestre</td></tr></table><p>La lecture commence par la colonne des indices : un patient mince qui maigrit et devient cétosique n’a pas un type 2 « classique », même après 40 ans. Le type 2 lui-même est hétérogène : des <button class="w" data-justification="1" data-k="e11-sousgroupes">sous-groupes définis par l’âge, l’IMC, l’HbA1c, la fonction β et l’insulinorésistance (étude suédoise de 2018)</button> n’ont ni le même pronostic ni le même risque de complication. La SSED rappelle qu’un quart des patients étiquetés type 2 ont en réalité un déficit insulinique prédominant.</p><div class="key"><b>À retenir.</b> Le diabète de type 2 associe insulinorésistance et déficit relatif progressif. Le premier geste diagnostique est de vérifier que le patient n’a pas un autre type de diabète, car un déficit insulinique méconnu se traite par insuline et non par une escalade de comprimés.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">Gastaldi et al., recommandations de la SSED pour le traitement du diabète de type 2, Swiss Medical Weekly 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX, guideline Diabetes mellitus, révisée 03/2024, mise à jour 05/2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">Marx et al., recommandations ESC 2023 sur les maladies cardiovasculaires du diabétique</a>.</p></section>
<section class="ilot" id="e11-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>En 2022, 6,2 % des personnes de 15 ans et plus vivant en Suisse déclaraient un diabète diagnostiqué ou un traitement antidiabétique, contre 4,8 % en 2017. La proportion atteint 6,9 % chez les hommes et 5,6 % chez les femmes. Elle augmente avec l’âge et décroît avec le niveau de formation : 12,7 % sans formation postobligatoire, 4,8 % avec un diplôme tertiaire. Environ un cinquième des diabétiques s’injecte de l’insuline et près d’un tiers ne prend aucun médicament. Cette enquête par déclaration ne distingue pas les types de diabète et ne mesure pas les diabètes ignorés : c’est une lacune des données suisses.</p><p>Le pronostic dépend surtout des organes atteints. Environ 40 % des patients développent une maladie rénale chronique (SSED et Société suisse de néphrologie). Chez les diabétiques de plus de 60 ans, la prévalence de l’insuffisance cardiaque peut atteindre 30 %, contre 1,5 à 2 % dans la population générale (SSED 2024). Plus de 70 % des patients ont une <button class="w" data-justification="1" data-k="e11-masld">stéatose hépatique associée à une dysfonction métabolique (MASLD)</button> (ADA/EASD 2026). Un diagnostic avant 40 ans expose à une détérioration glycémique plus rapide, à des complications plus précoces et à une surmortalité.</p><div class="key"><b>À retenir.</b> En Suisse, au moins un adulte sur seize vit avec un diabète, et la proportion progresse. Le pronostic se joue sur le rein, le cœur et le foie, d’où un suivi qui dépasse la glycémie.</div><p class="src">Références : <a href="https://ind.obsan.admin.ch/fr/indicator/monam/diabete-age-15" target="_blank" rel="noopener">OFSP et Obsan, indicateur Diabète (âge : 15+), Enquête suisse sur la santé 2022, mise à jour 17.03.2025</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED et Société suisse de néphrologie, maladie rénale diabétique, version courte, mai 2024</a> ; <a href="https://doi.org/10.57187/s.4000" target="_blank" rel="noopener">Paul et al., dépistage de l’insuffisance cardiaque chez le diabétique, SSED et Société suisse de cardiologie, 2024</a>.</p></section>
<section class="ilot" id="e11-3"><h2><span class="n">3</span>De l’insulinorésistance à l’hyperglycémie</h2><p>Chez le sujet sain, la glycémie reste stable parce que deux boucles s’équilibrent. Après un repas, la cellule β sécrète de l’insuline ; l’insuline fait entrer le glucose dans le muscle et le tissu adipeux et freine la production hépatique de glucose. Si les tissus répondent moins, la cellule β compense en sécrétant davantage.</p><p>Le diabète de type 2 naît quand cette compensation échoue. L’excès de tissu adipeux, surtout viscéral, et la sédentarité installent une insulinorésistance dans le muscle, le foie et le tissu adipeux. Le tissu adipeux résistant libère des acides gras libres que le foie stocke : le foie produit alors trop de glucose, même à jeun. Parallèlement, la <button class="w" data-justification="1" data-k="e11-glucolipotox">glucolipotoxicité (agression de la cellule β)</button> altère la sécrétion d’insuline ; la dysfonction β est habituellement plus sévère que l’insulinorésistance. L’<button class="w" data-justification="1" data-k="e11-incretine">effet incrétine (amplification intestinale de la sécrétion)</button> s’effondre, et le glucagon n’est plus correctement freiné.</p><figure><svg viewBox="0 0 680 230" role="img" aria-label="Chaîne physiopathologique du diabète de type 2 : excès adipeux, insulinorésistance, défaillance de la cellule bêta, hyperglycémie" font-family="sans-serif" font-size="13"><g fill="none" stroke="#222" stroke-width="2"><rect x="20" y="20" width="170" height="50" rx="6"/><rect x="255" y="20" width="170" height="50" rx="6"/><rect x="490" y="20" width="170" height="50" rx="6"/><rect x="255" y="150" width="170" height="50" rx="6"/><rect x="20" y="150" width="170" height="50" rx="6"/><rect x="490" y="150" width="170" height="50" rx="6"/><path d="M190 45h65M425 45h65M575 70v80M490 175h-65M255 175h-65"/><path d="M250 40l5 5-5 5M485 40l5 5-5 5M570 145l5 5 5-5M430 170l-5 5 5 5M195 170l-5 5 5 5"/></g><g fill="#222"><text x="30" y="42">Excès adipeux viscéral</text><text x="30" y="60">sédentarité</text><text x="265" y="42">Insulinorésistance</text><text x="265" y="60">muscle, foie, tissu adipeux</text><text x="500" y="42">Hyperinsulinisme</text><text x="500" y="60">de compensation</text><text x="500" y="172">Défaillance β</text><text x="500" y="190">glucolipotoxicité</text><text x="265" y="172">Hyperglycémie</text><text x="265" y="190">à jeun et postprandiale</text><text x="30" y="172">Complications</text><text x="30" y="190">micro- et macrovasculaires</text></g></svg><figcaption>Figure 1 — Du surpoids à l’hyperglycémie : l’insulinorésistance impose un hyperinsulinisme que la cellule β finit par ne plus soutenir ; l’hyperglycémie aggrave à son tour la cellule β. Schéma pédagogique d’après Galicia-Garcia 2020.</figcaption></figure><p>Cette défaillance n’est pas toujours définitive. Après une perte de poids importante, la graisse du foie et du pancréas diminue et la première phase de sécrétion d’insuline peut se rétablir : c’est le fondement de la <button class="w" data-justification="1" data-k="e11-remission">rémission du diabète de type 2 (définition et essai DiRECT)</button>. L’hyperglycémie prolongée, en revanche, lèse les vaisseaux par plusieurs <button class="w" data-justification="1" data-k="e11-mecanismes-complications">voies biochimiques (stress oxydant, produits de glycation avancée)</button>, et cette exposition laisse une <button class="w" data-justification="1" data-k="e11-memoire">mémoire métabolique (effet « héritage » de l’essai UKPDS)</button>.</p><div class="key"><b>Conséquence thérapeutique.</b> Chaque classe agit sur un maillon : la metformine freine le foie, les agonistes du récepteur du GLP-1 restaurent l’effet incrétine et réduisent l’appétit, les inhibiteurs du SGLT2 éliminent le glucose par le rein, la perte de poids allège l’insulinorésistance et soulage la cellule β.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., Pathophysiology of type 2 diabetes mellitus, 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29364588/" target="_blank" rel="noopener">Nauck et Meier, Incretin hormones, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30078554/" target="_blank" rel="noopener">Taylor et al., Cell Metabolism 2018</a>.</p></section>
<section class="ilot" id="e11-4"><h2><span class="n">4</span>Facteurs de risque et dépistage</h2><p>L’obésité associée à la sédentarité est le principal facteur de risque : 60 à 90 % des diabétiques de type 2 sont obèses (SSED 2023). S’y ajoutent les antécédents familiaux, l’origine ethnique, une alimentation déséquilibrée, un antécédent de diabète gestationnel et certains médicaments, dont les glucocorticoïdes et les neuroleptiques. Un <button class="w" data-justification="1" data-k="e11-hypercortisolisme">hypercortisolisme (cause méconnue d’hyperglycémie résistante)</button> est à évoquer quand le diabète résiste à plusieurs médicaments.</p><p>Comme la maladie reste longtemps silencieuse, le <button class="w" data-justification="1" data-k="e11-depistage">dépistage (populations, intervalle et test)</button> est actif. mediX le propose à toute personne dès 40 ans tous les trois ans, plus tôt et plus souvent en présence d’un facteur de risque ; l’ESC demande de rechercher un diabète chez tout patient atteint d’une maladie cardiovasculaire, car le diabète s’y révèle souvent par la complication.</p><table class="t"><tr><th>Facteur de risque</th><th>Conséquence pour le dépistage (mediX 2026)</th></tr><tr><td>Antécédent familial de diabète</td><td>Dépistage avancé, tous les 1 à 3 ans</td></tr><tr><td>Diabète gestationnel ou enfant de plus de 4100 g</td><td>Dépistage avancé, tous les 1 à 3 ans</td></tr><tr><td>Glycémie à jeun anormale ou HbA1c de 6,0 à 6,4 % antérieure</td><td>Dépistage avancé, tous les 1 à 3 ans</td></tr><tr><td>Surpoids ou obésité entre 35 et 70 ans</td><td>Dépistage tous les 3 ans</td></tr><tr><td>Hypertension, dyslipidémie, syndrome ovarien polyendocrinien et métabolique (ancien syndrome des ovaires polykystiques)</td><td>Dépistage avancé, tous les 1 à 3 ans</td></tr></table><p>Le tableau se lit ligne par ligne : un seul facteur suffit à avancer le dépistage. Une femme de 36 ans, qui a accouché d’un enfant de 4300 g, relève d’un contrôle immédiat puis répété, car 30 à 60 % des femmes ayant eu un diabète gestationnel développeront un diabète de type 2 (mediX).</p><div class="key"><b>À retenir.</b> Le dépistage cible l’âge, le poids, les antécédents et les maladies cardiovasculaires. Une hyperglycémie résistante à un traitement bien conduit fait chercher une cause secondaire, en particulier un hypercortisolisme.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026, chapitres 1 et 2</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">Davies et al., consensus ADA/EASD 2026</a>.</p></section>
<section class="ilot" id="e11-5"><h2><span class="n">5</span>Interroger pour orienter</h2><p>La plupart des patients n’ont aucun symptôme. Quand ils existent, les <button class="w" data-justification="1" data-k="e11-symptomes-osmotiques">symptômes osmotiques : polyurie, polydipsie, amaigrissement (mécanisme)</button> traduisent une glycémie qui dépasse la capacité de réabsorption rénale. Un amaigrissement ou une cétose signalent un déficit insulinique et font discuter l’insuline d’emblée (SSED 2023). Une <button class="w" data-justification="1" data-k="e11-vision">vision floue fluctuante</button> lors de grands écarts glycémiques relève d’un trouble transitoire de l’accommodation.</p><p>L’anamnèse recherche ensuite le retentissement. Le médecin demande à chaque visite les <button class="w" data-justification="1" data-k="e11-ic-depistage">symptômes d’insuffisance cardiaque (liste SSED 2024 et dépistage)</button>, les douleurs ou paresthésies des pieds, les signes de <button class="w" data-justification="1" data-k="e11-neuropathie">neuropathie autonome</button>, les hypoglycémies et la profession, car la conduite professionnelle modifie le choix des médicaments.</p><div class="two"><div class="card"><b>Forme typique</b><p>Adulte de plus de 40 ans, en surpoids, hypertendu, sans symptôme, découvert par une glycémie ou une HbA1c de routine, avec des antécédents familiaux de diabète.</p></div><div class="card"><b>Formes trompeuses</b><p>Révélation par un infarctus, une insuffisance cardiaque ou un ulcère du pied ; coma hyperosmolaire du sujet âgé ; amaigrissement rapide d’un adulte mince, qui évoque un diabète de type 1 lent ; diabète apparu sous glucocorticoïdes.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Le médecin conclut à un type 2 parce que le patient a plus de 40 ans. Un adulte mince qui maigrit malgré une glycémie élevée a peut-être un diabète auto-immun ; l’escalade de comprimés retarde alors l’insuline et expose à l’acidocétose.</div><div class="key"><b>À retenir.</b> L’interrogatoire cherche les signes de carence insulinique, les complications et les contraintes professionnelles, car ces trois éléments orientent le premier traitement.</div></section>
<section class="ilot" id="e11-6"><h2><span class="n">6</span>Examiner pour mesurer le retentissement</h2><p>L’examen mesure le poids, la taille et l’IMC, puis la pression artérielle, qui conditionne une grande part du risque. L’examen cardiovasculaire cherche des œdèmes, une turgescence jugulaire et un troisième bruit, signes d’insuffisance cardiaque (SSED 2024), et palpe les pouls périphériques.</p><p>L’examen des pieds est systématique au moins une fois par an. Il comprend l’inspection de la peau, des ongles et des déformations, la palpation des pouls pédieux et tibiaux postérieurs, le <button class="w" data-justification="1" data-k="e11-monofilament">test au monofilament (technique et seuil)</button> et la <button class="w" data-justification="1" data-k="e11-vibration">sensibilité vibratoire au diapason gradué</button>. Si les pouls sont faibles, l’<button class="w" data-justification="1" data-k="e11-pied">index de pression systolique cheville-bras</button> mesure l’ischémie. Le fond d’œil relève de l’ophtalmologue.</p><div class="key"><b>À retenir.</b> Un examen bref mais complet — poids, pression artérielle, signes d’insuffisance cardiaque, pouls et sensibilité des pieds — classe d’emblée le patient selon son risque d’ulcère, de cardiopathie et d’amputation.</div><p class="src">Références : <a href="https://doi.org/10.57187/s.4000" target="_blank" rel="noopener">Paul et al., SSED 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare, guide pratique du pied diabétique, 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED, critères d’une bonne prise en charge du diabète en premier recours, 2017</a>.</p><button class="pareto-btn ui" data-k="pareto-e11-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
