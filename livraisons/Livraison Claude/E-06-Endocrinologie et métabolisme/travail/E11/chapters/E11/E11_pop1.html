<template data-pop="e11-score2d" data-title="Catégories de risque cardiovasculaire du diabétique (ESC 2023)"><p>Le risque est <b>très élevé</b> en cas de maladie athéroscléreuse avérée, d’atteinte sévère d’organe cible ou de SCORE2-Diabetes ≥ 20 % à dix ans ; <b>élevé</b> de 10 à moins de 20 % ; <b>modéré</b> de 5 à moins de 10 % ; <b>faible</b> sous 5 %. L’atteinte sévère d’organe comprend un DFG &lt; 45 mL/min/1,73 m², un DFG de 45 à 59 avec albuminurie A2, une albuminurie A3 ou une atteinte microvasculaire de trois territoires. SCORE2-Diabetes s’applique dès 40 ans et intègre l’âge au diagnostic, l’HbA1c et le DFG.</p><div class="key"><b>Conséquence.</b> La catégorie fixe la cible de cholestérol LDL et l’intensité de la prévention ; la SSED note que presque tous les diabétiques de type 2 sont à risque élevé ou très élevé.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023, tableau 7</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-insulinoresistance" data-title="Insulinorésistance"><p>L’insulinorésistance est une réponse diminuée des cellules à l’insuline. Le muscle squelettique en est le principal site extrapancréatique : il capte moins de glucose parce que le transporteur GLUT4 migre mal vers la membrane. Le tissu adipeux résistant libère des acides gras libres, et le foie, qui ne freine plus sa production de glucose, entretient l’hyperglycémie à jeun. L’obésité viscérale et l’inactivité physique en sont les causes principales.</p><div class="key"><b>Limite.</b> Une insulinémie normale ne prouve pas une sécrétion suffisante : face à une résistance extrême, même une insuline « normale » ne maintient plus la glycémie (SSED 2023).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-type1-lada" data-title="Diabète de type 1 et LADA chez l’adulte"><p>Le diabète de type 1 résulte d’une destruction auto-immune des cellules β, avec un déficit absolu en insuline ; il représente 5 à 10 % des diabètes (ESC 2023). Il peut débuter à tout âge. Chez l’adulte, sa forme lente, dite LADA, correspond à un type 1 d’apparition tardive (mediX). Une évolution brève, des symptômes osmotiques et un amaigrissement le suggèrent ; les anticorps anti-GAD, anti-IA2 ou anti-ZnT8 le confirment, mais ils manquent chez 5 à 10 % des patients.</p><div class="key"><b>Conséquence.</b> Le traitement est l’insuline. Une « lune de miel » de plus de cinq ans doit faire reconsidérer le type de diabète.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023, section 3.2</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-mody" data-title="Diabète monogénique (MODY)"><p>Le MODY regroupe des défauts génétiques de la sécrétion d’insuline. Il s’évoque chez un patient de moins de 30 ans, mince, avec des diabétiques sur plusieurs générations, quand les anticorps sont négatifs et que le peptide C dépasse 500 pmol/L (mediX). La distinction compte pour le traitement : les formes MODY 1 et 3 répondent aux sulfonylurées, et la forme liée à la glucokinase (MODY 2) ne relève pas d’un déficit insulinique (SSED 2023).</p><div class="key"><b>Limite.</b> mediX juge que le test génétique, coûteux et rarement remboursé, change peu la conduite ; l’avis du diabétologue précède la demande.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-sousgroupes" data-title="Sous-groupes du diabète de l’adulte"><p>Une analyse de 8980 diabétiques suédois nouvellement diagnostiqués a défini cinq groupes à partir de six variables : anticorps anti-GAD, âge au diagnostic, IMC, HbA1c, fonction β et insulinorésistance. Le groupe le plus insulinorésistant avait davantage de néphropathie, le groupe insulinodéficient davantage de rétinopathie. La SSED en résume les proportions : environ 6 % de types 1 méconnus, 18 % de déficits insuliniques sans anticorps, 15 % d’insulinorésistances sévères, 20 % de diabètes liés à l’obésité et 40 % liés à l’âge.</p><div class="key"><b>Limite.</b> Cette classification guide la réflexion ; elle n’est pas un critère diagnostique officiel.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29503172/" target="_blank" rel="noopener">Ahlqvist et al., 2018</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-masld" data-title="Stéatose hépatique associée à une dysfonction métabolique"><p>La MASLD associe une stéatose hépatique à au moins un facteur de risque cardiométabolique, après exclusion d’une consommation importante d’alcool et des autres causes. Elle touche plus de 70 % des diabétiques de type 2 ; plus de la moitié d’entre eux évoluent vers une stéatohépatite. Le stade de fibrose, surtout à partir du stade 2, détermine la mortalité hépatique, cardiovasculaire et globale.</p><div class="key"><b>Conséquence.</b> La perte de poids est le traitement de base ; les agonistes du GLP-1 et la pioglitazone ont des preuves histologiques, alors que les inhibiteurs du SGLT2 ne se choisissent pas pour le foie (ADA/EASD 2026).</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-glucolipotox" data-title="Glucolipotoxicité"><p>Dans l’obésité, l’excès d’acides gras saturés et l’hyperglycémie lèsent la cellule β. Ils provoquent un stress du réticulum endoplasmique, activent une réponse aux protéines mal repliées qui peut conduire à l’apoptose et génèrent un stress oxydant. La synthèse accrue de proinsuline et de polypeptide amyloïde des îlots aggrave le mauvais repliement ; l’interleukine 1β attire des macrophages dans l’îlot.</p><div class="key"><b>Conséquence.</b> L’hyperglycémie aggrave la cellule β qui la provoque. C’est pourquoi, après la correction d’une hyperglycémie majeure par l’insuline, celle-ci peut parfois être arrêtée chez un diabétique de type 2 (SSED 2023).</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a>.</p></template>
<template data-pop="e11-incretine" data-title="Effet incrétine"><p>Le glucose pris par la bouche déclenche une sécrétion d’insuline deux à trois fois plus forte que le même glucose perfusé. Le GIP, des cellules K de l’intestin proximal, et le GLP-1, des cellules L de l’intestin distal, en sont responsables. Dans le diabète de type 2, cet effet est diminué ou absent, surtout parce que la cellule β répond mal au GIP ; le GLP-1 donné à dose pharmacologique garde ses effets insulinotrope et glucagonostatique.</p><div class="key"><b>Conséquence.</b> Ce constat fonde les agonistes du GLP-1 et les inhibiteurs de la DPP-4.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/29364588/" target="_blank" rel="noopener">Nauck et Meier, 2018</a>.</p></template>
<template data-pop="e11-remission" data-title="Rémission du diabète de type 2 (essai DiRECT)"><p>La rémission se définit par une HbA1c inférieure à 6,5 % au moins deux mois après l’arrêt de tout antidiabétique. Dans DiRECT, mené en médecine de premier recours en Écosse et dans le nord-est de l’Angleterre chez des patients diagnostiqués depuis moins de six ans, un régime de substitution à 825 à 853 kcal par jour pendant 3 à 5 mois a obtenu 46 % de rémissions à un an, contre 4 %. La rémission suivait la perte de poids : 7 % entre 0 et 5 kg, 34 % entre 5 et 10 kg, 57 % entre 10 et 15 kg et 86 % au-delà de 15 kg.</p><div class="key"><b>Limite.</b> À cinq ans, seuls 13 % des participants encore suivis restaient en rémission ; le maintien du poids est l’enjeu (ADA/EASD 2026).</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29221645/" target="_blank" rel="noopener">Lean et al., DiRECT, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-mecanismes-complications" data-title="Voies biochimiques des complications"><p>L’hyperglycémie chronique accroît la production mitochondriale d’espèces réactives de l’oxygène. Ce stress oxydant active cinq voies : la voie des polyols, la formation de produits de glycation avancée, l’expression de leur récepteur, l’activation de la protéine kinase C et la voie des hexosamines. Il en résulte une angiogenèse défectueuse, une inflammation et des modifications épigénétiques durables.</p><div class="key"><b>Conséquence.</b> Ces modifications durables expliquent qu’une hyperglycémie ancienne continue de nuire après sa correction, d’où l’intérêt d’un contrôle précoce.</div><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7503727/" target="_blank" rel="noopener">Galicia-Garcia et al., 2020</a>.</p></template>
<template data-pop="e11-memoire" data-title="Mémoire métabolique : l’effet héritage de l’UKPDS"><p>Dans l’UKPDS, 3867 patients nouvellement diagnostiqués ont reçu un traitement intensif ou conventionnel ; l’HbA1c a été de 7,0 contre 7,9 % pendant dix ans, avec 25 % de complications microvasculaires en moins. Après l’essai, l’écart d’HbA1c a disparu en un an, mais le bénéfice a persisté et s’est étendu : vingt-quatre ans plus tard, la mortalité restait réduite de 10 % avec sulfonylurée ou insuline et de 20 % avec metformine, et l’infarctus de 17 et 31 %.</p><div class="key"><b>Conséquence.</b> Le contrôle glycémique précoce rapporte des décennies plus tard. La SSED exprime la même idée par les « HbA1c-années » : vers 50 à 70 années cumulées au-dessus de 6,0 %, presque toutes les complications microvasculaires sont présentes.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9742976/" target="_blank" rel="noopener">UKPDS 33, 1998</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38772405/" target="_blank" rel="noopener">Adler et al., UKPDS 91, 2024</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED 2025</a>.</p></template>
<template data-pop="e11-hypercortisolisme" data-title="Hypercortisolisme et diabète résistant"><p>Un hypercortisolisme accompagnerait environ un quart des hyperglycémies insuffisamment contrôlées malgré plusieurs médicaments. L’âge avancé, un IMC plus bas, de nombreux antihypertenseurs, les analgésiques ou les fibrates, et l’usage d’inhibiteurs du SGLT2, de tirzépatide ou de fortes doses d’agonistes du GLP-1 augmentent la probabilité de le trouver.</p><div class="key"><b>Conséquence.</b> Devant un diabète qui résiste à un traitement bien conduit, le médecin recherche un hypercortisolisme. Le traitement antagoniste étudié dans cette indication n’est autorisé qu’aux États-Unis.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-depistage" data-title="Dépistage du diabète de type 2"><p>mediX recommande une glycémie plasmatique à jeun ou une HbA1c standardisée chez toute personne dès 40 ans, tous les trois ans, et chez l’adulte en surpoids entre 35 et 70 ans ; un facteur de risque avance le dépistage et raccourcit l’intervalle à un à trois ans. Le consensus ADA/EASD 2026 propose le dépistage dès 35 ans. L’ESC demande de rechercher un diabète chez tout patient cardiovasculaire. Un résultat anormal se confirme par une deuxième mesure un autre jour.</p><div class="key"><b>Limite.</b> L’HbA1c n’est pas utilisable en cas d’hémoglobinopathie, d’hémolyse, d’insuffisance rénale ou hépatique sévère ; la glycémie la remplace alors.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a>.</p></template>
<template data-pop="e11-symptomes-osmotiques" data-title="Polyurie, polydipsie et amaigrissement"><p>Quand la glycémie dépasse la capacité de réabsorption du tubule, le glucose filtré passe dans l’urine et entraîne l’eau et le sodium : c’est la diurèse osmotique. La polyurie provoque la soif ; la perte urinaire de glucose et le catabolisme dû au manque d’insuline font maigrir. Ces symptômes classiques permettent le diagnostic sur une seule glycémie aléatoire ≥ 11,1 mmol/L.</p><div class="key"><b>Conséquence.</b> Un amaigrissement ou une cétose signalent une carence insulinique : l’insuline se discute d’emblée (SSED 2023).</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">consensus 2024 sur les crises hyperglycémiques</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-vision" data-title="Vision floue et variations glycémiques"><p>Lors de fortes variations glycémiques, la vision peut se brouiller transitoirement par un effet osmotique sur l’accommodation. mediX recommande de ne pas changer de lunettes dans cette période. Une baisse durable de la vue impose en revanche un contrôle ophtalmologique immédiat, car elle peut traduire une rétinopathie ou un œdème maculaire.</p><p class="src">Référence : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026, chapitre 3.4</a>.</p></template>
<template data-pop="e11-ic-depistage" data-title="Insuffisance cardiaque : dépistage chez le diabétique"><p>La SSED et la Société suisse de cardiologie demandent à chaque visite la dyspnée d’effort ou l’orthopnée, la dyspnée nocturne, la fatigue, la toux sèche, la perte d’appétit, une prise de poids rapide et des œdèmes des chevilles, et recherchent œdèmes, turgescence jugulaire et troisième bruit. En cas de symptôme ou de signe, un NT-proBNP ≥ 125 ng/L ou un BNP ≥ 35 ng/L conduit au cardiologue. Sans symptôme, elles proposent un dosage annuel dès 60 ans.</p><div class="key"><b>Contentieux.</b> mediX juge que le dosage systématique chez le patient asymptomatique n’apporte pas de bénéfice démontré et n’est pas remboursé. Les deux textes concordent pour doser en cas de suspicion, comme l’ESC (classe I). Pour le dépistage annuel sans symptôme, le texte en vigueur est le consensus SSED de 2024 ; le médecin l’applique en informant le patient de la limite de preuve.</div><p class="src">Références : <a href="https://doi.org/10.57187/s.4000" target="_blank" rel="noopener">Paul et al., SSED 2024 (texte en vigueur)</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a>.</p></template>
<template data-pop="e11-neuropathie" data-title="Neuropathie diabétique"><p>La forme la plus fréquente est la polyneuropathie distale symétrique, qui débute aux pieds. La neuropathie autonome se manifeste par une tachycardie de repos, une intolérance à l’effort, une hypotension orthostatique, une constipation, une gastroparésie ou une dysfonction érectile. Le diagnostic est d’exclusion : le médecin écarte une carence en vitamine B12, une infection par le VIH, une hypothyroïdie, l’alcool et l’insuffisance rénale. Il adresse au neurologue si le déficit est surtout moteur, rapide ou débute aux membres supérieurs.</p><div class="key"><b>Traitement de la douleur.</b> Gabapentine, prégabaline ou duloxétine, d’efficacité voisine, choisies selon les comorbidités ; les antidépresseurs tricycliques sont une réserve (mediX).</div><p class="src">Référence : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026, chapitre 3.4</a>.</p></template>
<template data-pop="e11-monofilament" data-title="Test au monofilament"><p>Le monofilament explore la sensibilité de protection. mediX l’applique sous la face plantaire des premier et deuxième métatarsiens et à la pulpe du gros orteil, jamais sur une callosité. Il reste fiable chez le sujet âgé. Quatre réponses justes sur quatre sont normales dans le guide suisse du pied diabétique.</p><div class="key"><b>Conséquence.</b> Une sensibilité de protection perdue classe le pied à risque : chaussage adapté, podologie et contrôles plus fréquents.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023</a>.</p></template>
<template data-pop="e11-vibration" data-title="Sensibilité vibratoire au diapason gradué"><p>Le diapason gradué se pose sur la face médiale de l’articulation métatarso-phalangienne du gros orteil ; il explore la sensibilité profonde. Une valeur supérieure à 4/8 est normale dans le guide suisse ; une valeur de 4/8 ou moins est pathologique selon mediX.</p><div class="key"><b>Piège.</b> Après 70 ans, le réflexe achilléen et la sensibilité vibratoire aux malléoles peuvent manquer chez un sujet sain : le résultat s’interprète avec le monofilament.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023</a>.</p></template>
<template data-pop="e11-pied" data-title="Pied diabétique : stratification suisse"><p>Le guide suisse classe le pied en trois niveaux. <b>Risque faible</b> : plaie superficielle, sans infection, sans artériopathie (deux pouls pédieux perçus, IPS ≥ 0,9), sans neuropathie ni déformation ; soins standard et contrôle à une semaine. <b>Risque moyen</b> : plaie profonde, infection, artériopathie, neuropathie ou ulcère antérieur ; réseau spécialisé. <b>Urgence</b> : cellulite, gangrène, infection systémique, ischémie aiguë ou pied de Charcot aigu ; équipe interprofessionnelle du pied.</p><div class="key"><b>Signaux d’alarme.</b> Une ischémie critique (IPS &lt; 0,5, pression d’orteil &lt; 30 mmHg) ou une plaie réduite de moins de 50 % en quatre semaines imposent le niveau le plus élevé. La podologie est remboursée en cas d’ulcère ou de polyneuropathie (mediX).</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/230802_QCARE_Praxisleitfaden_A5_DE.pdf" target="_blank" rel="noopener">QualiCCare 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-hba1c" data-title="HbA1c : principe, avantages et pièges"><p>L’HbA1c est l’hémoglobine glyquée ; elle reflète la glycémie moyenne des semaines précédentes. La SSED l’a adoptée pour le diagnostic en 2011 si la méthode est standardisée selon le DCCT et l’UKPDS. Elle varie peu (environ 2 % contre 12 à 15 % pour la glycémie à jeun), ne dépend ni de l’heure ni du stress et prédit mieux les complications.</p><div class="key"><b>Pièges.</b> Elle n’est pas valable en cas d’hémoglobinopathie, d’hémolyse, de transfusion, d’insuffisance rénale ou hépatique sévère, de diabète gestationnel ou de diabète de type 1. La carence en fer l’élève faussement ; les fortes doses de vitamines C et E la perturbent ; après 70 ans, elle s’élève d’environ 0,4 %.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011, tableaux 1 et 2</a>.</p></template>
<template data-pop="e11-hgpo" data-title="Hyperglycémie provoquée par voie orale"><p>Après un jeûne de 8 heures, le patient boit 75 g de glucose ; la glycémie plasmatique est mesurée à deux heures. Une valeur ≥ 11,1 mmol/L signe un diabète, une valeur de 7,8 à 11,0 mmol/L une intolérance au glucose. Pendant le test, le patient reste au repos et ne mange pas.</p><div class="key"><b>Contentieux.</b> L’ESC 2023 en fait l’étalon des cas douteux et la propose quelques semaines après une hyperglycémie de stress ; mediX la réserve en pratique à la grossesse. Les deux positions se rejoignent : l’HGPO n’est demandée que si glycémie et HbA1c ne suffisent pas.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-prediabete" data-title="Prédiabète : des seuils discutés"><p>Le prédiabète désigne une glycémie au-dessus de la normale mais sous le seuil du diabète. Pour l’HbA1c, l’OMS retient 6,0 à 6,4 % (42 à 47 mmol/mol) et l’American Diabetes Association 5,7 à 6,4 % (39 à 47 mmol/mol) ; la glycémie à jeun anormale commence à 6,1 mmol/L pour l’OMS et à 5,6 mmol/L pour l’American Diabetes Association.</p><div class="key"><b>Arbitrage.</b> La SSED a adopté en 2011 les seuils larges (HbA1c 5,7 à 6,4 %, glycémie 5,6 à 6,9 mmol/L) ; c’est le texte suisse en vigueur. mediX souligne que la zone 6,0 à 6,4 % évolue souvent vers le diabète. La conduite est la même : modification du mode de vie, metformine dans des cas choisis.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/Position-SGED_Diagnose-mit-HbA1c_2011_DE.pdf" target="_blank" rel="noopener">SSED 2011 (texte en vigueur)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023, tableau 6</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-cpeptide" data-title="Auto-anticorps et peptide C"><p>Les anticorps anti-GAD, anti-IA2 et anti-ZnT8 signent un diabète auto-immun. Le peptide C, clivé de la proinsuline avec l’insuline, mesure la sécrétion endogène. Selon la SSED, des anticorps négatifs, un peptide C entre 200 et 600 pmol/L et l’absence d’antécédents familiaux marqués indiquent un déficit insulinique ; le peptide C se recontrôle trois ans plus tard, car un type 1 débutant reste possible. Un peptide C supérieur à 500 pmol/L avec anticorps négatifs chez un sujet jeune et mince oriente vers un MODY (mediX).</p><div class="key"><b>Conséquence.</b> Un déficit insulinique se traite d’abord par insuline, puis par les classes protectrices.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-stress" data-title="Hyperglycémie de stress"><p>Une hyperglycémie apparaît souvent à l’hôpital, au cours d’un syndrome coronarien aigu ou d’une insuffisance cardiaque, sans diabète préexistant. Une glycémie élevée avec une HbA1c normale la suggère. Elle s’associe à un pronostic hospitalier défavorable.</p><div class="key"><b>Conduite.</b> L’ESC propose une HGPO quelques semaines après la sortie pour écarter un diabète ou une intolérance au glucose.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023, section 3.2.4</a>.</p></template>
<template data-pop="e11-hypo" data-title="Hypoglycémie : niveaux et conséquences"><p>Dans une prise de position conjointe de l’American Diabetes Association et de l’EASD, l’International Hypoglycaemia Study Group distingue trois niveaux : une valeur d’alerte ≤ 3,9 mmol/L, une hypoglycémie cliniquement significative &lt; 3,0 mmol/L et une hypoglycémie sévère, définie par la nécessité de l’aide d’un tiers. Les seuils des symptômes s’abaissent chez le patient qui fait des hypoglycémies répétées : il perd ses signes d’alerte.</p><div class="key"><b>Conséquences.</b> Les hypoglycémies sévères s’associent à un risque accru de démence, d’événements cardiovasculaires dont la mort subite, de thrombose et d’inflammation (SSED 2025). Dans ACCORD, viser une HbA1c inférieure à 6,0 % a augmenté la mortalité (257 contre 203 décès) avec davantage d’hypoglycémies sévères.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6518070/" target="_blank" rel="noopener">International Hypoglycaemia Study Group, 2017</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18539917/" target="_blank" rel="noopener">ACCORD, 2008</a>.</p></template>
<template data-pop="e11-glucagon" data-title="Glucagon par voie nasale"><p>Le glucagon nasal (Baqsimi®) traite l’hypoglycémie sévère dès l’âge d’un an, en une dose unique de 3 mg dans une narine ; un proche peut l’administrer. Dès que le patient répond, il prend des glucides par la bouche pour reconstituer le glycogène hépatique et éviter la récidive.</p><div class="key"><b>Indication de prescription.</b> La SSED recommande de le prescrire aux patients sous schéma basal-bolus, les plus exposés aux hypoglycémies sévères.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Baqsimi® (AIPS, mise à jour 03.2026), consultée le 09.10.2026</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-shh" data-title="État hyperglycémique hyperosmolaire"><p>Le patient garde juste assez d’insuline pour empêcher la cétogenèse, mais pas l’hyperglycémie : la diurèse osmotique, installée en jours ou en semaines, fait perdre 100 à 220 mL d’eau par kilogramme. L’hypertonie maintient le volume intravasculaire, si bien que le patient paraît moins déshydraté qu’il ne l’est. Infections, arrêt du traitement, événements cardiovasculaires, glucocorticoïdes, thiazidiques et antipsychotiques le déclenchent.</p><div class="key"><b>Traitement.</b> Chlorure de sodium à 0,9 % d’abord ; baisse de la glycémie d’au plus 5 mmol/L par heure ; insuline à 0,05 unité/kg/h seulement quand la glycémie cesse de baisser, sauf cétonémie &gt; 3,0 mmol/L ; héparine de bas poids moléculaire préventive pendant tout le séjour. La résolution exige une osmolalité &lt; 300 milliosmoles par kilogramme, une diurèse ≥ 0,5 mL/kg/h, une glycémie &lt; 15 mmol/L et le retour de l’état cognitif. Les séries britanniques rapportent une mortalité de 15 à 20 %.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">Joint British Diabetes Societies 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">consensus 2024</a>.</p></template>
<template data-pop="e11-acd-isglt2" data-title="Acidocétose sous inhibiteur du SGLT2"><p>Environ 10 % des acidocétoses se présentent avec une glycémie inférieure à 11,1 mmol/L ; les inhibiteurs du SGLT2 en sont devenus la cause principale. Dans le diabète de type 2, l’incidence reste faible, de 0,6 à 4,9 événements pour 1000 années-patients. Le jeûne, un régime très pauvre en glucides, une maladie aiguë, une chirurgie, une réduction de l’insuline, l’alcool et la déshydratation l’exposent.</p><div class="key"><b>Conduite.</b> Devant des nausées, des vomissements, des douleurs abdominales ou une dyspnée, le médecin dose les corps cétoniques quelle que soit la glycémie et arrête le médicament. L’acidocétose peut durer plus longtemps que ne le laisse prévoir la demi-vie.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">consensus 2024</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (07.2025)</a>.</p></template>
<template data-pop="e11-acidose-lactique" data-title="Acidose lactique sous metformine"><p>L’acidose lactique est très rare, de 3 à 5 cas pour 100 000 années-patients. Elle survient presque toujours lors d’une insuffisance rénale aiguë ou d’une hypoxie : déshydratation, sepsis, choc, insuffisance cardiaque décompensée, infarctus récent, intoxication alcoolique. Elle associe dyspnée acidosique, douleurs abdominales, crampes, hypothermie puis coma ; le pH est inférieur à 7,35 et les lactates dépassent 5 mmol/L.</p><div class="key"><b>Conduite.</b> Hospitalisation immédiate ; l’hémodialyse élimine le lactate et la metformine.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a>.</p></template>
<template data-pop="e11-fournier" data-title="Gangrène de Fournier"><p>La fasciite nécrosante du périnée est une infection rare et grave rapportée chez des hommes et des femmes sous inhibiteur du SGLT2. Douleur, sensibilité, érythème ou tuméfaction génitale ou périnéale, avec fièvre ou malaise, imposent un examen immédiat.</p><div class="key"><b>Conduite.</b> Arrêt du médicament, antibiotiques à large spectre et débridement chirurgical si nécessaire.</div><p class="src">Référence : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Jardiance® (07.2025)</a>.</p></template>
<template data-pop="e11-mrc" data-title="Maladie rénale diabétique"><p>Le dépistage est au moins annuel : créatinine et rapport albumine/créatinine sur un échantillon d’urine. La maladie est confirmée si le DFG reste inférieur à 60 mL/min/1,73 m² ou l’albuminurie supérieure à 3 mg/mmol pendant au moins trois mois. Le traitement associe un inhibiteur de l’enzyme de conversion ou un antagoniste des récepteurs de l’angiotensine II, un inhibiteur du SGLT2 poursuivi jusqu’à la dialyse, puis la finérénone si l’albuminurie persiste, le DFG dépasse 25 et la kaliémie est ≤ 5 mmol/L.</p><div class="key"><b>Preuves.</b> Le sémaglutide a réduit de 24 % les événements rénaux majeurs (FLOW) et la finérénone de 18 % (FIDELIO-DKD). Hématurie, DFG chutant de plus de 5 mL/min par an ou syndrome néphrotique conduisent au néphrologue.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/62_Empfehlungen_Hausarzt/2023_Broschuere_Diabetic_Kidney_Disease_D.pdf" target="_blank" rel="noopener">SSED et Société suisse de néphrologie 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38785209/" target="_blank" rel="noopener">Perkovic et al., FLOW, 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33264825/" target="_blank" rel="noopener">Bakris et al., 2020</a>.</p></template>
<template data-pop="e11-retino" data-title="Rétinopathie diabétique"><p>Le diabétique de type 2 voit l’ophtalmologue dès le diagnostic, puis tous les deux ans en l’absence de rétinopathie, au moins chaque année si elle existe, et immédiatement en cas de baisse de la vue (mediX). Un bon contrôle glycémique et tensionnel ralentit son évolution.</p><div class="key"><b>Piège.</b> Une amélioration glycémique rapide peut aggraver transitoirement une rétinopathie. Dans SUSTAIN-6, les complications rétiniennes ont touché 3,0 % des patients sous sémaglutide contre 1,8 % sous placebo, dont plus de 80 % avaient une rétinopathie initiale. Un fond d’œil précède donc un agoniste du GLP-1 chez le patient atteint.</div><p class="src">Références : <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Ozempic® (07.2026)</a>.</p></template>
<template data-pop="e11-b12" data-title="Vitamine B12 sous metformine"><p>La metformine au long cours diminue l’absorption de la vitamine B12 ; le risque de carence augmente avec la dose et la durée. L’information professionnelle suisse recommande un dosage régulier, par exemple annuel, surtout en cas d’anémie ou de neuropathie.</p><div class="key"><b>Piège.</b> Une carence en vitamine B12 peut imiter ou aggraver une neuropathie diabétique (mediX).</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-cetones" data-title="Corps cétoniques, gaz veineux et osmolalité"><p>Le β-hydroxybutyrate est le principal corps cétonique de l’acidocétose ; son dosage sanguin, capillaire ou au laboratoire, est préféré à la bandelette urinaire, qui mesure l’acétoacétate et sous-estime la cétose au début. Une valeur ≥ 3,0 mmol/L a une sensibilité et une spécificité supérieures à 90 %. L’acidocétose est légère si le pH est entre 7,25 et 7,30, modérée entre 7,0 et 7,25, sévère sous 7,0.</p><div class="key"><b>Osmolalité.</b> (2 × Na⁺) + glucose + urée, en mmol/L ; ≥ 320 milliosmoles par kilogramme dans l’état hyperosmolaire. Le captopril et le valproate peuvent fausser la bandelette urinaire.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11343900/" target="_blank" rel="noopener">consensus 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10107355/" target="_blank" rel="noopener">Joint British Diabetes Societies 2023</a>.</p></template>
