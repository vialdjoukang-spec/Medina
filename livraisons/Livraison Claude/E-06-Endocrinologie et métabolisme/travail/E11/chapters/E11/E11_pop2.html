<template data-pop="e11-cibles" data-title="Cibles glycémiques : quatre textes comparés"><p>Les textes convergent autour de 7 %, avec des nuances.</p><table class="t"><tr><th>Source</th><th>Cible générale</th><th>Cible stricte</th><th>Cible souple</th></tr><tr><td>SSED 2023</td><td>7,0 %</td><td>6,5 % : sujet jeune, diabète récent, sans hypoglycémie</td><td>7 à 8 % ; jamais &gt; 8,0 %</td></tr><tr><td>ESC 2023</td><td>&lt; 7 % (classe I)</td><td>Personnalisée</td><td>Personnalisée</td></tr><tr><td>ADA/EASD 2026</td><td>6,5 à 7 % (48 à 53 mmol/mol)</td><td>≤ 6,5 % sans médicament hypoglycémiant ou si début avant 40 ans</td><td>Fragilité, espérance de vie limitée</td></tr><tr><td>mediX 2026</td><td>Environ 7 %</td><td>6,5 à 7 % jusqu’à 60 ans</td><td>8 à 9 % après 80 ans, polymorbidité</td></tr></table><p>Le temps passé entre 3,9 et 10 mmol/L doit dépasser 70 % chez le patient équipé d’un capteur. La cible stricte n’est sûre que sans insuline ni sulfonylurée : dans ACCORD, viser moins de 6,0 % avec ces moyens a augmenté la mortalité.</p><div class="key"><b>Arbitrage.</b> Le texte suisse en vigueur est la SSED 2023 ; la source primaire la plus récente, le consensus ADA/EASD 2026, la confirme et autorise 6,5 % ou moins sans médicament hypoglycémiant.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023 (texte en vigueur)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/18539917/" target="_blank" rel="noopener">ACCORD 2008</a>.</p></template>
<template data-pop="e11-mode-de-vie" data-title="Mode de vie : alimentation, activité, tabac"><p>Aucune répartition unique des glucides, protéines et lipides n’est optimale ; l’alimentation se personnalise et doit rester durable. Le régime méditerranéen améliore la glycémie et le risque cardiovasculaire, même sans perte de poids importante, et se privilégie en cas de maladie athéroscléreuse. Une perte de 5 % du poids apporte déjà un bénéfice métabolique ; une intervention intensive vise 10 % ou plus et peut conduire à la rémission. Les compléments alimentaires ne sont pas recommandés (ADA/EASD 2026).</p><div class="key"><b>Activité et tabac.</b> mediX conseille 150 minutes d’activité par semaine et deux séances de renforcement musculaire. L’ESC recommande un programme d’exercice structuré adapté aux comorbidités et propose la substitution nicotinique, la varénicline ou le bupropion pour l’arrêt du tabac.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a>.</p></template>
<template data-pop="e11-steno2" data-title="Essai Steno-2 : le traitement multifactoriel"><p>Cent soixante diabétiques de type 2 avec microalbuminurie ont reçu pendant 7,8 ans un traitement intensif de la glycémie, de la pression artérielle et des lipides, avec bloqueur du système rénine-angiotensine et aspirine, ou un traitement conventionnel. Après 13,3 ans, 24 patients du groupe intensif étaient décédés contre 40 (rapport de risque 0,54) ; les événements cardiovasculaires étaient réduits de 59 %.</p><div class="key"><b>Conséquence.</b> Traiter ensemble tous les facteurs de risque sauve des vies ; la glycémie n’en est qu’un.</div><p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/18256393/" target="_blank" rel="noopener">Gaede et al., Steno-2, 2008</a>.</p></template>
<template data-pop="e11-ta" data-title="Pression artérielle du diabétique"><p>L’ESC 2023 traite toute pression ≥ 140/90 mmHg et vise une systolique de 130 mmHg, ou moins si elle est tolérée, sans descendre sous 120 ; après 65 ans, de 130 à 139 mmHg. La SSED 2023 retient 130/70 à 79 mmHg et la même cible après 65 ans. mediX vise ≤ 140/80 après 65 ans, et le consensus ADA/EASD 2026 &lt; 130/80, voire &lt; 120 mmHg de systolique à haut risque.</p><div class="key"><b>Médicaments.</b> La SSED associe tôt un inhibiteur de l’enzyme de conversion et un antagoniste calcique ; un antagoniste des récepteurs de l’angiotensine II remplace l’inhibiteur s’il est mal toléré. Une albuminurie justifie l’inhibiteur même sans hypertension (mediX). L’association des deux bloqueurs est déconseillée (ESC). Arbitrage : la cible suisse en vigueur est celle de la SSED, alignée sur l’ESC.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023 (texte en vigueur)</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-ldl" data-title="Cholestérol LDL : cibles selon le risque"><p>L’ESC 2023 fixe le cholestérol LDL sous 1,4 mmol/L à risque très élevé, sous 1,8 mmol/L à risque élevé et sous 2,6 mmol/L à risque modéré (classe I). La SSED commence par une statine puissante, rosuvastatine ou atorvastatine, ajoute l’ézétimibe puis, si nécessaire, un inhibiteur de la PCSK9.</p><div class="key"><b>Nuances.</b> mediX préfère souvent une dose fixe de statine et ne débute pas de prévention primaire chez un patient de plus de 75 ans au diagnostic. En dialyse, la statine n’est pas instaurée (SSED et Société suisse de néphrologie).</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023, figure 10</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-contentieux-algo" data-title="Contentieux : la place de la metformine"><p><b>SSED 2023</b> : traitement initial toujours combiné, metformine titrée puis inhibiteur du SGLT2 ou agoniste du GLP-1, puis trithérapie ; la metformine est maintenue parce que les essais de morbi-mortalité ont été menés sur ce socle et qu’elle seule freine explicitement la production hépatique de glucose. <b>mediX 05/2026</b> : metformine seule ou bithérapie si l’HbA1c initiale est inférieure à 8,5 % ; trithérapie préférée ensuite, sans demande de garantie de prise en charge pour l’association inhibiteur du SGLT2 et agoniste du GLP-1 depuis janvier 2026. <b>ADA/EASD 2026</b> : les deux classes protectrices sont des choix de première ligne, avec ou sans metformine, car leur bénéfice cardio-rénal est indépendant de celle-ci ; ces données viennent toutefois d’analyses de sous-groupes.</p><div class="key"><b>Arbitrage.</b> La source primaire applicable la plus récente, le consensus ADA/EASD 2026, place la protection d’organe avant la metformine ; le texte suisse en vigueur, la SSED 2023, y parvient en combinant d’emblée. En pratique, un patient à risque cardio-rénal reçoit sa classe protectrice dès le diagnostic ; la metformine s’y ajoute si elle est tolérée.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023 (texte suisse en vigueur)</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026 (source la plus récente)</a>.</p></template>
<template data-pop="e11-insuline-debut" data-title="Débuter l’insuline"><p>L’insuline s’impose en cas de carence : HbA1c supérieure à 10 %, amaigrissement, cétose, maladie aiguë, suspicion de type 1 (SSED 2023) ; mediX la discute dès 8,5 % et la recommande au-delà de 9 %. Elle s’ajoute aussi après échec de la trithérapie. Le schéma de départ est une insuline basale unique : 10 unités par jour (dégludec) ou 0,2 unité/kg (glargine 300), puis +2 unités tous les deux jours jusqu’à une glycémie à jeun inférieure à 8 mmol/L, idéalement 6 à 7 (mediX).</p><div class="key"><b>Choix et limites.</b> La SSED privilégie les insulines ultralentes, dégludec et glargine 300, moins hypoglycémiantes ; l’insuline NPH n’est plus recommandée et Levemir® quitte le marché fin 2026. Au-delà d’environ un tiers du poids en unités, augmenter la basale ne sert plus : un bolus s’impose. Metformine, inhibiteur du SGLT2 et agoniste du GLP-1 sont poursuivis ; la sulfonylurée est arrêtée.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED 2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles Tresiba® et Toujeo®</a>.</p></template>
<template data-pop="e11-insuline-escalade" data-title="Intensifier l’insuline"><p>Quand la basale ne suffit plus, l’étape la plus simple est l’insuline coformulée Ryzodeg® (70 % de dégludec, 30 % d’asparte) avant les deux repas principaux : elle obtient la même HbA1c qu’un schéma basal-bolus avec beaucoup moins d’hypoglycémies (SSED 2023). Elle exige des repas réguliers et convient bien au sujet âgé. Le schéma basal-bolus, avec insuline rapide à chaque repas, offre la plus grande souplesse au prix du risque d’hypoglycémie le plus élevé ; il s’accompagne d’un capteur de glucose et d’une prescription de glucagon.</p><div class="key"><b>Remarque.</b> Les associations fixes d’insuline basale et d’agoniste du GLP-1 existent mais sont devenues rares en Suisse, le sémaglutide étant plus puissant (mediX).</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-su" data-title="Contentieux : les sulfonylurées"><p>La SSED ne recommande plus les sulfonylurées en raison des hypoglycémies, de la prise de poids et d’une mortalité observationnelle plus élevée que les traitements modernes ; seul le gliclazide, de demi-vie courte et sans métabolite actif, reste admis dans des cas choisis, comme les MODY 1 et 3. Le consensus ADA/EASD 2026 souligne au contraire leur efficacité, leur faible coût et l’absence de surmortalité dans les revues systématiques, tout en rappelant leur effet peu durable.</p><div class="key"><b>Arbitrage.</b> Le consensus le plus récent ne contredit pas la SSED sur le risque d’hypoglycémie ; en Suisse, où les classes protectrices sont remboursées, le texte en vigueur de la SSED s’applique : gliclazide seulement, à titre exceptionnel, jamais avec l’insuline.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023 (texte en vigueur)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-bariatrique" data-title="Chirurgie métabolique"><p>La SSED la juge efficace dans le diabète difficile à équilibrer avec une HbA1c supérieure à 8 % et un IMC supérieur à 30 kg/m². L’ESC la propose aux patients à risque élevé ou très élevé dont l’IMC atteint 35 kg/m² quand le mode de vie et les médicaments ont échoué. Le consensus ADA/EASD 2026 la discute dès 30 kg/m² et la recommande à partir de 35.</p><div class="key"><b>Données.</b> Dans l’étude ARMSS-T2D, 37,5 % de rémissions à trois ans après chirurgie contre 2,6 % sous traitement médical, et 18 % contre 6 % à sept ans ; anémie, fractures et troubles digestifs sont plus fréquents après chirurgie.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37622663/" target="_blank" rel="noopener">ESC 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-qualite" data-title="Critères de qualité de la SSED"><p>La SSED évalue la prise en charge d’une patientèle diabétique sur 100 points : au moins trois visites par an chez 80 % des patients ; conseils sur le poids et le tabac ; HbA1c mesurée au moins deux fois par an, inférieure à 9 % chez 85 %, à 8 % chez 60 % et à 7 % chez 40 % des patients ; pression inférieure à 140/90 mmHg chez 65 % ; LDL inférieur à 2,6 mmol/L chez 63 % des moins de 75 ans ; créatinine et albuminurie, fond d’œil tous les deux ans et examen des pieds chez 80 %.</p><div class="key"><b>Objectif.</b> Atteindre au moins 70 points ; un mauvais respect de ces standards s’associe à davantage d’hospitalisations.</div><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/64_Ressourcen_Hausarzt/Diabetes_Kriterien_2017_SGED_def.pdf" target="_blank" rel="noopener">SSED 2017</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023, tableau 2</a>.</p></template>
<template data-pop="e11-sick-days" data-title="Règles des jours de maladie"><p>Fièvre, diarrhée, vomissements ou impossibilité de manger rendent certains médicaments dangereux. La SSED les résume ainsi : la <b>metformine</b> s’interrompt en cas de déshydratation, d’insuffisance rénale aiguë ou d’hypoxémie ; l’<b>inhibiteur du SGLT2</b> en cas de déshydratation ou de jeûne prolongé ; le <b>gliclazide</b> en cas de jeûne ou d’insuffisance rénale aiguë ; l’<b>insuline</b> se réduit si le patient ne mange pas, mais ne s’arrête jamais complètement.</p><div class="key"><b>Mise en pratique.</b> La SSED fournit une carte de poche des règles des jours de maladie, à remettre au patient avec explication.</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023, tableau 3</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-age" data-title="Le diabétique âgé"><p>Le sujet âgé cumule fragilité, troubles cognitifs, chutes, polymédication et dénutrition, même s’il est obèse. Les classes protectrices gardent leur intérêt : les inhibiteurs du SGLT2 préviennent l’insuffisance cardiaque, fréquente après 65 ans, mais augmentent la nycturie de l’homme porteur d’une hypertrophie prostatique. Chez le patient dénutri, l’agoniste du GLP-1 aggrave l’inappétence ; la linagliptine, sans adaptation rénale, convient mieux. La metformine se garde si le DFG dépasse 30, réduite à 1000 mg par jour en cas de nausées.</p><div class="key"><b>Cibles.</b> Sans insuline ni sulfonylurée : HbA1c 6,5 à 7,0 % de 65 à 80 ans, inférieure à 7,5 à 8,0 % au-delà ; avec ces médicaments : toujours inférieure à 8,0 % (SSED 2023). Le choix des classes protectrices ne diffère pas selon l’âge ; seules la tolérance et la sécurité imposent des ajustements (ADA/EASD 2026).</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-grossesse" data-title="Grossesse, allaitement et contraception"><p>Le sémaglutide ne doit pas être utilisé pendant la grossesse ni l’allaitement, et une contraception est recommandée pendant le traitement. Le tirzépatide réduit l’exposition aux contraceptifs oraux : la patiente passe à une méthode non orale ou ajoute une méthode barrière pendant quatre semaines après le début et après chaque palier. La metformine peut être envisagée pendant la grossesse si elle est cliniquement indiquée, avec une surveillance de la croissance fœtale.</p><div class="key"><b>Conduite.</b> La grossesse se traite par insuline (mediX) ; la SSED liste les insulines testées chez la femme enceinte et fixe, dès la vingtième semaine, une glycémie à jeun inférieure à 5,3 mmol/L et inférieure à 8,0 mmol/L une heure après le repas. Le consensus ADA/EASD 2026 exige un conseil contraceptif explicite avant toute classe non autorisée pendant la grossesse.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Ozempic®, Mounjaro® et Glucophage®</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-conduite" data-title="Diabète et conduite automobile en Suisse"><p>L’hypoglycémie est le principal facteur d’inaptitude ; elle ne survient que sous insuline, sulfonylurée ou glinide. La SSED classe le risque : <b>nul</b> sous metformine, agonistes du GLP-1, tirzépatide, inhibiteurs de la DPP-4 et du SGLT2 ; <b>faible</b> sous insuline ultralente ou gliclazide ; <b>moyen</b> sous glargine 100, Ryzodeg® ou basal-bolus avec capteur ; <b>élevé</b> sous basal-bolus sans capteur ; <b>très élevé</b> après une hypoglycémie sévère dans l’année ou en cas de perte des signes d’alerte.</p><div class="key"><b>Règles.</b> Pas de permis si l’HbA1c dépasse 10 %. Sous traitement à risque, pas de conduite sous 4 mmol/L : glucides rapides et 45 minutes d’attente ; 10 à 20 g de glucides entre 4 et 5 mmol/L. Le médecin doit informer le patient ; il a le droit, non l’obligation, de signaler un doute à l’autorité cantonale.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/Handout_Richtlinien_Diabetes_DE_Version_1_August_2025.pdf" target="_blank" rel="noopener">SSED et Société suisse de médecine légale, édition 1, août 2025</a>.</p></template>
<template data-pop="e11-perop" data-title="Chirurgie, endoscopie et produits de contraste"><p>La metformine s’arrête 48 heures avant une intervention sous anesthésie générale ou locorégionale et reprend au plus tôt 48 heures après, si le patient mange et que la fonction rénale est stable ; elle s’arrête aussi 48 heures avant un produit de contraste iodé si le DFG est inférieur à 60. Les agonistes du GLP-1 retardent la vidange gastrique : des inhalations sous anesthésie ont été rapportées malgré un jeûne correct. L’insuline basale ne s’arrête pas ; la glargine se réduit à 75 à 80 % la veille, et les insulines ultralentes s’adaptent 2 à 4 jours avant (SSED 2026).</p><div class="key"><b>Contentieux.</b> La SSED suspend l’inhibiteur du SGLT2 deux jours avant une chirurgie ou une endoscopie ; l’information professionnelle de l’empagliflozine demande au moins trois jours avant une chirurgie majeure. Pour un médicament donné, l’information professionnelle suisse fait foi.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles Glucophage®, Jardiance® et Ozempic® (texte en vigueur)</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED 2026</a>.</p></template>
<template data-pop="e11-cortico" data-title="Glucocorticoïdes et hôpital"><p>Les glucocorticoïdes élèvent surtout la glycémie de l’après-midi : le contrôle se fait après le repas de midi ou deux heures après. Au-delà de 10 mmol/L deux fois en 24 heures, le traitement s’adapte ou l’insuline débute. La SSED propose une insuline basale proportionnée à la dose d’équivalent prednisone : 0,1 unité/kg pour 10 mg, 0,2 pour 20 mg, 0,3 pour 30 mg, 0,4 pour 40 mg ou plus.</p><div class="key"><b>Hôpital.</b> Cible de 5,6 à 10,0 mmol/L hors soins intensifs, de 7,8 à 10 mmol/L sous insuline intraveineuse en soins intensifs ; l’insuline de correction seule n’est pas recommandée.</div><p class="src">Référence : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED, retrait de plusieurs insulines et alternatives, état août 2025</a>.</p></template>
<template data-pop="e11-d-metformine" data-title="Metformine (Glucophage® et génériques)"><p><b>Mécanisme.</b> Biguanide qui réduit la production hépatique de glucose, facilite l’utilisation périphérique du glucose et augmente la libération de GLP-1, en partie par l’AMPK ; elle ne stimule pas la sécrétion d’insuline. <b>Preuves.</b> Dans l’UKPDS 34, chez 753 patients en surpoids, elle a réduit de 32 % les complications liées au diabète et de 36 % la mortalité totale. <b>Effets indésirables.</b> Troubles digestifs (5 à 15 %), goût métallique, carence en vitamine B12, acidose lactique très rare.</p><div class="key"><b>Contre-indications.</b> DFG &lt; 30 mL/min/1,73 m², acidose, déshydratation, infection grave, hypoxie, insuffisance cardiaque décompensée, insuffisance hépatique, alcoolisme ; déconseillée dans les maladies mitochondriales comme le diabète avec surdité de transmission maternelle.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Glucophage® (10.2025)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9742977/" target="_blank" rel="noopener">UKPDS 34, 1998</a>.</p></template>
<template data-pop="e11-d-isglt2" data-title="Inhibiteurs du SGLT2 (empagliflozine, dapagliflozine)"><p><b>Mécanisme.</b> Glycosurie et natriurèse par inhibition du cotransporteur du tubule proximal, indépendantes de l’insuline. <b>Preuves.</b> Dans EMPA-REG OUTCOME, chez 7020 patients avec maladie cardiovasculaire, l’empagliflozine a réduit les événements cardiovasculaires majeurs (10,5 contre 12,1 %) et les décès cardiovasculaires (3,7 contre 5,9 %). La dapagliflozine a réduit de 39 % l’aggravation rénale ou le décès dans la maladie rénale chronique. <b>Indications suisses.</b> Diabète de type 2, insuffisance cardiaque, maladie rénale chronique.</p><div class="key"><b>Effets indésirables.</b> Mycoses génitales, acidocétose parfois euglycémique, gangrène de Fournier, déshydratation ; amputations d’orteil observées avec une autre molécule de la classe. Arrêt avant chirurgie, jeûne ou déshydratation.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles suisses Jardiance® (07.2025) et Forxiga® (08.2026)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26378978/" target="_blank" rel="noopener">Zinman et al., EMPA-REG OUTCOME, 2015</a>.</p></template>
<template data-pop="e11-d-aglp1" data-title="Agonistes du récepteur du GLP-1 (sémaglutide, dulaglutide)"><p><b>Mécanisme.</b> Sécrétion d’insuline et freinage du glucagon dépendants du glucose, vidange gastrique ralentie, appétit réduit ; le sémaglutide résiste à la DPP-4 et se lie à l’albumine, d’où une injection hebdomadaire. <b>Preuves.</b> Liraglutide dans LEADER (événements majeurs 13,0 contre 14,9 %), sémaglutide sous-cutané dans SUSTAIN-6 (6,6 contre 8,9 %) et FLOW (−24 % d’événements rénaux), sémaglutide oral dans SOUL (12,0 contre 13,8 %) ; la classe réduit les événements majeurs de 14 %. En Suisse, Rybelsus® N et Trulicity® ont une indication cardiovasculaire et Ozempic® une indication rénale.</p><div class="key"><b>Effets indésirables.</b> Nausées et vomissements à l’instauration, lithiases biliaires, pancréatite, aggravation transitoire d’une rétinopathie, neuropathie optique ischémique antérieure non artéritique très rare, inhalation sous anesthésie. Remboursés si IMC &gt; 28 kg/m². Pas d’association avec un inhibiteur de la DPP-4.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles Ozempic®, Rybelsus® N et Trulicity®</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27295427/" target="_blank" rel="noopener">LEADER 2016</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40162642/" target="_blank" rel="noopener">SOUL 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="e11-d-tirzepatide" data-title="Tirzépatide (Mounjaro®)"><p><b>Mécanisme.</b> Agoniste des récepteurs du GIP et du GLP-1 ; améliore les deux phases de sécrétion d’insuline, abaisse le glucagon et l’appétit. <b>Preuves.</b> Dans le programme SURPASS, baisse de l’HbA1c d’environ 2 % par rapport au placebo et perte de 7 à 9,5 kg ; jusqu’à 68 % des patients perdent plus de 10 % de leur poids. Dans SURPASS-CVOT, il est non inférieur au dulaglutide pour les événements cardiovasculaires majeurs. <b>Suisse.</b> Remboursé depuis février 2026 pour le diabète si IMC &gt; 28 kg/m², prescriptible par le médecin de famille ; l’information professionnelle suisse ne mentionne pas d’indication cardiovasculaire au 09.10.2026.</p><div class="key"><b>Prudence.</b> Troubles digestifs plus fréquents que sous dulaglutide ; contraception orale moins efficace. mediX le considère d’abord comme un médicament de réserve, faute de recul et en raison de son coût.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Mounjaro® (07.2026)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a>.</p></template>
<template data-pop="e11-d-idpp4" data-title="Inhibiteurs de la DPP-4 (sitagliptine, linagliptine)"><p><b>Mécanisme.</b> Ils bloquent l’enzyme qui dégrade le GLP-1 et le GIP endogènes, ce qui augmente l’insuline et diminue le glucagon selon la glycémie. <b>Efficacité.</b> Modérée, neutre sur le poids, sans hypoglycémie seuls. Les essais de sécurité cardiovasculaire de la saxagliptine, de l’alogliptine, de la sitagliptine et de la linagliptine ont montré une sécurité sans bénéfice.</p><div class="key"><b>Prudence.</b> Hospitalisations pour insuffisance cardiaque plus fréquentes sous saxagliptine ; risque biliaire légèrement accru pour la classe. La linagliptine ne demande aucune adaptation rénale ; la sitagliptine se réduit selon le DFG. Jamais avec un agoniste du GLP-1.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a> ; <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Informations professionnelles Trajenta® et Januvia®</a>.</p></template>
<template data-pop="e11-d-insulines" data-title="Insulines du diabète de type 2"><p><b>Basales.</b> Glargine 100 U/mL (Lantus®, Abasaglar®), action d’environ 24 heures ; dégludec (Tresiba®) et glargine 300 U/mL (Toujeo®), ultralentes, plus stables et moins hypoglycémiantes. La glargine (ORIGIN) et la dégludec (DEVOTE) ont démontré leur sécurité cardiovasculaire. <b>Prandiales.</b> Asparte, lispro et glulisine, d’action de 2 à 5 heures. <b>Coformulée.</b> Ryzodeg® : 70 % de dégludec et 30 % d’asparte.</p><div class="key"><b>Effets indésirables.</b> Hypoglycémie, prise de poids, rétention hydrosodée ; les besoins diminuent quand la fonction rénale baisse. Plusieurs présentations de NovoRapid®, Insulatard® et Levemir® sont retirées en 2025 et 2026 (SSED).</div><p class="src">Références : <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a> ; <a href="https://www.medix.ch/wissen/guidelines/diabetes-mellitus/" target="_blank" rel="noopener">mediX 2026</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/61_Empfehlungen_Facharzt/2026_Withdrawal_of_several_insulins_and_alternative_options.pdf" target="_blank" rel="noopener">SSED 2026</a>.</p></template>
<template data-pop="e11-d-gliclazide" data-title="Gliclazide (Diamicron® MR)"><p><b>Mécanisme.</b> Sulfonylurée qui stimule la sécrétion d’insuline par les cellules β. <b>Posologie.</b> 30 mg au petit déjeuner, augmentés par paliers d’au moins deux semaines jusqu’à 120 mg. <b>Place.</b> Seule sulfonylurée encore admise par la SSED, car sa demi-vie est courte et elle n’a pas de métabolite actif ; risque d’hypoglycémie faible au volant selon la SSED.</p><div class="key"><b>Contre-indications.</b> Diabète de type 1, acidocétose, insuffisance hépatique ou rénale sévère, traitement par miconazole. Effets indésirables : hypoglycémie, prise de poids.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Diamicron® MR (02.2025)</a> ; <a href="https://doi.org/10.57187/smw.2023.40060" target="_blank" rel="noopener">SSED 2023</a>.</p></template>
<template data-pop="e11-d-finerenone" data-title="Finérénone (Kerendia®)"><p><b>Mécanisme.</b> Antagoniste non stéroïdien et sélectif du récepteur des minéralocorticoïdes. <b>Preuves.</b> Dans FIDELIO-DKD, chez 5734 patients, la progression rénale est passée de 21,1 à 17,8 % ; l’analyse combinée de 13 026 patients a réduit les événements cardiovasculaires (rapport de risque 0,86) et rénaux (0,77). <b>Indications suisses.</b> Néphropathie chronique du diabète de type 2 ; insuffisance cardiaque à fraction d’éjection ≥ 40 %.</p><div class="key"><b>Surveillance.</b> Potassium ≤ 4,8 mmol/L avant l’instauration, non recommandée au-delà de 5,0 ; potassium et DFG à 4 semaines. Arrêts pour hyperkaliémie : 1,7 contre 0,6 % sous placebo.</div><p class="src">Références : <a href="https://www.swissmedicinfo.ch/" target="_blank" rel="noopener">Information professionnelle suisse Kerendia® (11.2025)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/33264825/" target="_blank" rel="noopener">Bakris et al., 2020</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42825923/" target="_blank" rel="noopener">ADA/EASD 2026</a>.</p></template>
<template data-pop="pareto-e11-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="e11-0,e11-1,e11-2,e11-3,e11-4,e11-5,e11-6"></p><ul><li>Le diabète de type 2 associe insulinorésistance et déficit relatif progressif de l’insuline ; il représente environ 90 % des diabètes de l’adulte.</li><li>Un quart des « types 2 » ont un déficit insulinique prédominant : amaigrissement, cétose ou minceur font chercher un autre type.</li><li>En Suisse, 6,2 % des adultes déclarent un diabète (2022) ; le pronostic se joue sur le rein, le cœur et le foie.</li><li>Excès adipeux, foie producteur de glucose, cellule β défaillante et effet incrétine perdu produisent l’hyperglycémie.</li><li>Une perte de poids importante et précoce peut rétablir la sécrétion et conduire à la rémission.</li><li>Dépistage dès 40 ans, plus tôt avec un facteur de risque ; tout patient cardiovasculaire est dépisté.</li><li>L’examen mesure poids, pression artérielle, signes d’insuffisance cardiaque, pouls et sensibilité des pieds.</li></ul></template>
<template data-pop="pareto-e11-diag" data-title="Pareto — Diagnostic et urgences"><p class="ratio" data-cover="e11-7,e11-8"></p><ul><li>Diabète : HbA1c ≥ 6,5 %, glycémie à jeun ≥ 7,0 mmol/L, glycémie 2 heures ≥ 11,1 mmol/L ou aléatoire ≥ 11,1 mmol/L avec symptômes.</li><li>Sans symptôme, deux valeurs concordantes au laboratoire sont nécessaires.</li><li>L’HbA1c est faussée par l’hémolyse, la transfusion, les hémoglobinopathies et la carence en fer.</li><li>Auto-anticorps et peptide C chez le sujet mince, jeune, amaigri ou cétosique.</li><li>Hypoglycémie : seulement sous insuline, sulfonylurée ou glinide ; &lt; 3,0 mmol/L significative, sévère si aide d’un tiers.</li><li>État hyperosmolaire : sujet âgé, glycémie ≥ 30 mmol/L, osmolalité ≥ 320 ; remplissage d’abord, insuline ensuite.</li><li>Sous inhibiteur du SGLT2, l’acidocétose peut être euglycémique : doser les cétones.</li></ul></template>
<template data-pop="pareto-e11-ttt" data-title="Pareto — Complications et traitement"><p class="ratio" data-cover="e11-9,e11-10"></p><ul><li>Dépistage annuel : créatinine et albuminurie, pieds, facteurs de risque ; ophtalmologie tous les 2 ans.</li><li>Une albuminurie persistante suffit à définir la maladie rénale et indique un inhibiteur du SGLT2.</li><li>Cible d’HbA1c autour de 7 %, 6,5 % chez le jeune sans risque d’hypoglycémie, jamais au-dessus de 8 %.</li><li>Traitement multifactoriel : tabac, pression artérielle, cholestérol LDL, poids.</li><li>Inhibiteurs du SGLT2 et agonistes du GLP-1 protègent cœur et rein indépendamment de l’HbA1c.</li><li>SSED : metformine combinée d’emblée à une classe protectrice, puis trithérapie, puis insuline basale.</li><li>Insuline d’emblée en cas de carence : HbA1c &gt; 10 %, amaigrissement, cétose.</li><li>Sulfonylurées non recommandées par la SSED ; gliclazide seulement, à titre exceptionnel.</li></ul></template>
<template data-pop="pareto-e11-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="e11-11,e11-12,e11-13"></p><ul><li>Au moins trois visites et deux HbA1c par an ; règles des jours de maladie enseignées dès la première ordonnance.</li><li>Sujet âgé : cible selon le risque d’hypoglycémie ; linagliptine si dénutrition.</li><li>Metformine arrêtée sous 30 mL/min/1,73 m² ; inhibiteur du SGLT2 poursuivi jusqu’à la dialyse.</li><li>Sémaglutide exclu pendant la grossesse ; tirzépatide réduit l’efficacité des contraceptifs oraux.</li><li>Au volant, seuls insuline et sécrétagogues imposent des mesures ; pas de permis si HbA1c &gt; 10 %.</li><li>Metformine suspendue 48 heures avant chirurgie ou contraste si DFG &lt; 60 ; inhibiteur du SGLT2 suspendu avant chirurgie.</li></ul></template>
<template data-pop="pareto-e11-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e11-e-1,e11-e-2,e11-e-3"></p><ul><li>Référence : glycémie plasmatique veineuse au laboratoire ; HGPO dans les cas douteux.</li><li>Socle : glycémie, HbA1c, créatinine, albuminurie, lipides.</li><li>Albuminurie : A1 &lt; 3, A2 de 3 à 29, A3 ≥ 30 mg/mmol, persistante plus de 3 mois, deux tests positifs sur trois.</li><li>NT-proBNP : &lt; 125 ng/L improbable, ≥ 300 ng/L probable chez le diabétique asymptomatique.</li><li>β-hydroxybutyrate ≥ 3,0 mmol/L : acidocétose ; osmolalité = 2 × Na⁺ + glucose + urée.</li><li>Glycémie élevée avec HbA1c normale : hyperglycémie de stress.</li></ul></template>
<template data-pop="pareto-e11-pharm" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e11-p-1,e11-p-2,e11-p-3,e11-p-4"></p><ul><li>Metformine : 500 à 2000 mg par jour ; au plus 1000 mg sous 60 mL/min/1,73 m², arrêt sous 30.</li><li>Empagliflozine 10 mg, dapagliflozine 10 mg pour le cœur et le rein, quel que soit le DFG au-dessus de 20 à 25.</li><li>Sémaglutide 0,25 puis 0,5 à 2 mg par semaine ; tirzépatide 2,5 à 15 mg par semaine ; aucune adaptation rénale.</li><li>Insuline basale : 10 unités ou 0,2 unité/kg, +2 unités tous les 2 jours.</li><li>Réduire insuline ou sulfonylurée quand une classe protectrice s’ajoute.</li><li>Jamais deux molécules de la même classe, ni agoniste du GLP-1 avec inhibiteur de la DPP-4, ni insuline avec sulfonylurée.</li><li>Finérénone : potassium ≤ 4,8 mmol/L au départ, contrôle à 4 semaines.</li></ul></template>
