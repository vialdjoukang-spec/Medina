<template data-pop="e45-lien-causal" data-title="Le lien causal entre dénutrition et retard"><h3>Pourquoi il est central</h3><p>E45 suppose que le retard de croissance ou de développement est dû à la malnutrition protéino-énergétique. Le diagnostic ne se fonde donc pas sur la petite taille seule : il associe un contexte nutritionnel documenté, un retard statural (HAZ bas, vitesse basse, décrochage) et l’exclusion raisonnable des causes primaires. Le rattrapage sous réhabilitation nutritionnelle conforte le lien a posteriori.</p><div class="trap"><span class="k">Limite</span> La malnutrition associée à un retard n’en prouve pas la causalité : les sources rappellent que le retard peut être génétique, hormonal, médicamenteux, psychosocial ou nutritionnel.</div></template>
<template data-pop="e45-lacunes" data-title="Lacunes de sources de ce cours"><h3>Ce qui n’a pas pu être lu</h3><ul><li>Aucune recommandation suisse spécifique (pädiatrie schweiz, société suisse d’endocrinologie, Swiss Medical Forum) sur le stunting nutritionnel n’a été lue ; le statement de 2020 sur les courbes l’a été.</li><li>Aucune directive européenne pédiatrique (ESPGHAN, ESPE) sur le traitement nutritionnel du retard statural ; la démarche diagnostique repose sur Wit 2019 (résumé) et le consensus italien 2026 (texte intégral).</li><li>Syndrome de renutrition pédiatrique : seule la revue suisse adulte (Reber 2019) a été lue ; elle exclut pédiatrie et troubles alimentaires.</li><li>Indication de l’hormone de croissance dans E45 : aucune source.</li><li>Frontière entre E45 et E64.0 : non précisée.</li><li>Posologies pédiatriques de zinc et de thiamine : non établies dans les informations professionnelles suisses lues.</li><li>Nom exact des courbes suisses de 2011 : non lisible.</li><li>Plusieurs références n’ont été lues qu’en résumé.</li><li>Aucune donnée suisse de prévalence du stunting nutritionnel.</li></ul><p>Audit différé : revue par intelligence artificielle, distincte d’une validation médicale humaine.</p></template>
<template data-pop="e45-turner" data-title="Syndrome de Turner et analyse par puce"><h3>Pourquoi chez la fille</h3><p>Le syndrome de Turner peut se présenter par une petite taille isolée. Wit 2019 recommande, chez la fille de petite taille, une analyse chromosomique par puce plutôt qu’un caryotype conventionnel, car elle détecte le syndrome de Turner ainsi que les variations du nombre de copies et les isodisomies uniparentales. Le consensus italien n’a pas atteint de consensus sur la prescription du caryotype par tout pédiatre. L’étude de Grote recommande d’inclure le syndrome de Turner chez les filles.</p></template>
<template data-pop="e45-igf1-interp" data-title="Interpréter un IGF-I bas"><h3>Règle</h3><p>L’IGF-I est bas en malnutrition par résistance à l’hormone de croissance, et il suit l’indice de masse corporelle dans l’anorexie mentale. Un IGF-I bas chez un enfant dénutri ne prouve donc pas un déficit en GH. L’interprétation d’un axe endocrinien se fait après correction de l’état nutritionnel. Les sources lues ne donnent pas de valeurs numériques de référence : on se réfère à celles du laboratoire pour l’âge et le sexe.</p></template>
<template data-pop="e45-age-osseux" data-title="Radiographie de la main et du poignet gauches"><h3>Rôle dans le dépistage</h3><p>C’est le premier examen d’imagerie de la démarche par étapes : il fournit l’âge osseux et révèle des signes de dysplasie. Il accompagne l’évaluation de la puberté. L’interprétation de l’âge osseux en nutrition (valeurs de référence, avance ou retard) n’est pas documentée dans les sources lues.</p></template>
<template data-pop="e45-biologie" data-title="Biologie de dépistage"><h3>Liste</h3><p>Selon les consensus néerlandais et italien, le dépistage vise les maladies à présentation staturale isolée : hémogramme (anémie), inflammation et infection, fonctions rénale et hépatique, TSH et T4, métabolisme phosphocalcique, glycémie, dépistage de la maladie cœliaque, axe GH – IGF. Dans l’étude de Grote, plus de 30 % des enfants n’avaient aucune biologie dans les services généraux et des causes pathologiques n’étaient trouvées que dans 5 % des cas. Les valeurs de référence sont celles du laboratoire.</p></template>
<template data-pop="e45-refeeding" data-title="Syndrome de renutrition (données adultes)"><h3>Définition et seuils</h3><p>La revue suisse de Berne et Aarau (Reber 2019) le définit comme une réponse métabolique au passage du jeûne à l’état nourri. Il est probable si le phosphate chute de plus de 30 % sous la limite inférieure ou descend sous 0,6 mmol/L, ou si deux des trois ions phosphate, magnésium et potassium sont bas dans les 72 heures après le début de la renutrition, avec des symptômes. Le jeûne est le meilleur prédicteur. L’énergie commence à 5 à 15 kcal/kg par jour selon le risque (5 si risque élevé), avec des besoins atteints en 5 à 10 jours ; les électrolytes se corrigent avant ; le poids se pèse chaque jour.</p><div class="trap"><span class="k">Limite</span> Cette revue exclut la pédiatrie et les troubles alimentaires. Ses chiffres ne se transposent pas à l’enfant.</div></template>
<template data-pop="e45-thiamine" data-title="Thiamine : Benerva® et usage en renutrition"><h3>Information professionnelle suisse</h3><p>Benerva® est une préparation de thiamine. En cas de carence sévère ou d’encéphalopathie de Wernicke, l’information professionnelle indique jusqu’à 200 mg par jour par voie parentérale (intramusculaire ou intraveineuse lente), puis la voie orale. L’utilisation et la sécurité n’ont pas été étudiées systématiquement chez l’enfant et l’adolescent.</p><h3>Dans la renutrition</h3><p>Dans la revue sur l’adulte, la thiamine à 200 à 300 mg s’administre au moins 30 minutes avant la renutrition, puis pendant 3 jours. Aucune dose pédiatrique n’est donnée ici.</p></template>
<template data-pop="e45-zinc" data-title="Zinc : Burgerstein® et essais"><h3>Information professionnelle suisse</h3><p>Burgerstein Zinc 15 mg (gluconate de zinc) est indiqué dans la carence alimentaire en zinc, à 15 mg par jour. L’usage chez l’enfant et l’adolescent n’est pas établi. Un usage prolongé expose à un déficit en cuivre et à une anémie.</p><h3>Preuve sur la croissance</h3><p>Une revue de plus de 27 000 enfants conclut à un effet faible ou nul de la supplémentation en zinc sur la croissance ; un essai à 10 mg par jour pendant 24 semaines rapporte un gain moyen d’environ 0,38 cm. Les associations de micronutriments sont plus efficaces que les apports isolés.</p></template>
<template data-pop="e45-micronutriments" data-title="Micronutriments et croissance"><h3>Synthèse</h3><p>Le zinc agit sur des enzymes de croissance, la vitamine D et le calcium corrigent le rachitisme nutritionnel, le fer ne sert qu’en cas d’anémie ferriprive, et l’iode, le sélénium, le zinc, le fer et la vitamine A conditionnent les hormones thyroïdiennes. Les associations de micronutriments sont plus efficaces que les apports isolés (Inzaghi 2022).</p></template>
<template data-pop="e45-gh-therapie" data-title="Hormone de croissance : place dans E45"><h3>Ce que disent les sources</h3><p>La résistance à la GH et la baisse du récepteur dans la plaque expliquent la faible réponse à la GH chez l’enfant malnutri. Aucune source lue ne recommande la GH dans E45 : l’indication n’est donc pas affirmée. Un déficit en GH reste un diagnostic différentiel à discuter après correction de l’état nutritionnel.</p></template>
<template data-pop="e45-glucocorticoides" data-title="Glucocorticoïdes et croissance"><h3>Effet sur la plaque</h3><p>Les glucocorticoïdes inhibent la plaque de croissance (Lui et Baron). Ils figurent parmi les médicaments à rechercher à l’anamnèse devant un retard statural. Après arrêt, la plaque moins sénescente peut croître plus vite : modèle de rattrapage. Les sources sont des études de recherche fondamentale.</p></template>
<template data-pop="e45-mnemo" data-title="Mnémotechnique : familles de causes (aide pédagogique)"><h3>Aide pédagogique, non critère officiel</h3><p>Pour ne pas oublier les familles de causes d’un retard statural, on peut retenir l’acronyme fictif « PAMIR » : Prénatal (prématurité, petit poids pour l’âge gestationnel), Apport (alimentation insuffisante), Maladie chronique (cœliaque, rénale, inflammatoire), Infection répétée (diarrhée, paludisme), Rare (génétique, dysplasie, Turner). Cette règle est une aide pédagogique, non un critère officiel.</p></template>
<template data-pop="pareto-e45-notions" data-title="Pareto — Notions et croissance normale"><p class="ratio" data-cover="e45-0,e45-1,e45-2,e45-3"></p><ul><li>E45 code le retentissement statural et développemental d’une malnutrition ; le degré de dénutrition se code E43, E44.0, E44.1, E46.</li><li>Stunting = HAZ inférieur à −2 ; grave inférieur à −3 ; seuil de population, non frontière biologique.</li><li>Stunting (chronique), wasting (récent) et underweight sont trois indices distincts.</li><li>Critères de repérage : taille inférieure à −2 écarts-types, taille inadéquate pour la taille cible, ou vitesse inférieure à −1 écart-type sur 6 mois.</li><li>Vitesse normale : 22 à 24 cm la première année ; environ 10 cm la deuxième ; 5 à 6 cm par an avant la puberté.</li><li>Pas de donnée suisse de prévalence dans les sources lues.</li></ul></template>
<template data-pop="pareto-e45-diag" data-title="Pareto — Mécanismes, clinique et diagnostic"><p class="ratio" data-cover="e45-4,e45-5,e45-6,e45-7,e45-8"></p><ul><li>Jeûne prolongé : GH élevée, IGF-I bas par résistance ; protéines et énergie sont toutes deux nécessaires.</li><li>L’inflammation intestinale et les infections répétées s’ajoutent au manque d’apport.</li><li>En Suisse, penser d’abord à une maladie chronique (cœliaque, inflammatoire, rénale), à un trouble alimentaire ou à une privation passée.</li><li>Sans carnet de santé et courbe, pas de diagnostic ; stadiomètre de Harpenden, puberté, proportions.</li><li>Dépister cœliaque chez tous, Turner chez la fille.</li><li>IGF-I bas ne prouve pas un déficit en GH en dénutrition.</li></ul></template>
<template data-pop="pareto-e45-trait" data-title="Pareto — Prise en charge, suivi et critères"><p class="ratio" data-cover="e45-9,e45-10,e45-11,e45-12,e45-13,e45-14"></p><ul><li>Dénutrition grave active : leçons E40 à E43 ; renutrition : syndrome de renutrition, référence pédiatrique requise.</li><li>Traitement = nutrition suffisante + cause + micronutriments en association ; zinc ou fer isolés inefficaces sur la taille.</li><li>GH non établie dans E45 ; réponse faible par résistance.</li><li>Prévention dans les 1000 premiers jours (70 % du déficit).</li><li>Le HAZ s’améliore avec l’âge sans que le déficit en cm diminue.</li><li>Environ 3,2 cm de taille adulte perdus par unité de HAZ à 2 ans.</li><li>Suivi tous les 6 mois si vitesse basse ou période péripubertaire.</li></ul></template>
<template data-pop="pareto-e45-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e45-e-1,e45-e-2,e45-e-3,e45-e-4,e45-e-5"></p><ul><li>Référence : mesure standardisée répétée sur courbe.</li><li>Dépistage : radiographie de la main, biologie, array chez la fille.</li><li>IGF-I : interprétation prudente en dénutrition.</li><li>Génétique ciblée ou exome si indices d’un trouble primaire.</li><li>Le rattrapage sous nutrition tranche a posteriori.</li></ul></template>
<template data-pop="pareto-e45-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e45-s-physio-body"></p><ul><li>GH haute, IGF-I bas : résistance par adaptation.</li><li>IGFBP-1 et IGFBP-2 augmentent la clairance de l’IGF-I.</li><li>FGF21 réduit le récepteur de la GH hépatique.</li><li>Réponse faible à la GH exogène tant que la nutrition n’est pas corrigée.</li></ul></template>
<template data-pop="pareto-e45-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e45-s-bioc-body"></p><ul><li>IGF-I exige protéines et énergie.</li><li>Zinc isolé : effet faible ou nul sur la taille.</li><li>Fer seulement si anémie ferriprive.</li><li>Associations de micronutriments plus efficaces.</li></ul></template>
<template data-pop="pareto-e45-s-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="e45-s-histo-body"></p><ul><li>Chondrocytes à capacité proliférative finie.</li><li>Sénescence puis fusion épiphysaire.</li><li>Inhibition transitoire : sénescence ralentie, rattrapage possible.</li></ul></template>
<template data-pop="pareto-e45-s-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="e45-s-gen-body"></p><ul><li>Plus de 200 gènes pour environ 10 % de la variance de la taille.</li><li>Array chez la fille de petite taille.</li><li>Gènes de dysplasie : ACAN, FGFR3, NPR2, SHOX, IHH.</li><li>Exome si indices : rendement supérieur à 30 %.</li></ul></template>
<template data-pop="pareto-e45-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e45-p-1,e45-p-2,e45-p-3,e45-p-4,e45-p-5"></p><ul><li>Aucun médicament curatif du stunting nutritionnel dans les sources lues.</li><li>Pas de posologie pédiatrique suisse établie pour zinc et thiamine.</li><li>Doses de renutrition et de thiamine : adultes.</li><li>Éviter zinc ou fer isolés, GH sans indication, glucocorticoïdes prolongés.</li></ul></template>
