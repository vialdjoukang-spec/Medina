<template data-pop="e54-crit-op" data-title="Définition opérationnelle du scorbut">
<div class="lab">Définition</div><p data-evidence="E54-C0423">Aucun critère diagnostique formel validé n’a été trouvé. L’étude gériatrique parisienne a défini le scorbut clinique par au moins un signe parmi l’hyperkératose périfolliculaire, les pétéchies ou ecchymoses, l’hémorragie au point de ponction veineuse et la gingivite sévère. Le diagnostic a été confirmé biologiquement dans 94 % des cas.</p>
<div class="lab">Seuils associés</div><p data-evidence="E54-C0424">Taux sérique &lt; 2 mg/L pour la carence et &lt; 5 mg/L pour la déplétion (étude parisienne) ; &lt; 11 µmol/L pour la carence et &lt; 23 µmol/L pour l’hypovitaminose (ESPEN) ; &lt; 2 mg/L (10 µmol/L) pour le scorbut clinique (information suisse).</p>
<div class="lab">Limite</div><p data-evidence="E54-C0425">Ce n’est pas un consensus : c’est un repère d’étude. La confirmation par la réponse à la vitamine C reste l’argument le plus pertinent.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20617280/" target="_blank" rel="noopener">Raynaud-Simon et al., scorbut du sujet âgé hospitalisé, Journal of Nutrition, Health and Aging 2010</a>.</p></template>
<template data-pop="e54-test-ther" data-title="Test thérapeutique">
<div class="lab">Définition</div><p data-evidence="E54-C0426">En présence de symptômes cliniques, ESPEN recommande de ne pas retarder un essai d’environ 1 g de vitamine C par jour pendant au moins une semaine (recommandation 23.1).</p>
<div class="lab">Application</div><p data-evidence="E54-C0427">Prélever le dosage plasmatique avant la première dose, puis traiter. Juger la réponse sur les saignements, les signes buccaux, les douleurs et les lésions cutanées.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0428">La réponse clinique survient entre une semaine et trois mois selon les signes ; la guérison complète de l’enfant peut demander 1 à 11 mois.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-diff-enfant" data-title="Diagnostic différentiel chez l’enfant">
<div class="lab">Par gravité</div><ul><li data-evidence="E54-C0429">Hémopathies malignes : leucémie, lymphome.</li><li data-evidence="E54-C0430">Tumeurs osseuses : ostéosarcome, neuroblastome métastatique.</li><li data-evidence="E54-C0431">Infections : ostéomyélite, arthrite septique, pyomyosite.</li><li data-evidence="E54-C0432">Maladies inflammatoires : ostéomyélite chronique non bactérienne, arthrite juvénile idiopathique, vasculite à IgA.</li></ul>
<div class="lab">Décision</div><p data-evidence="E54-C0433">32 % des enfants ont reçu un faux diagnostic initial et 18 % un examen invasif : l’anamnèse alimentaire précède les gestes invasifs.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-diff-adulte" data-title="Diagnostic différentiel chez l’adulte">
<div class="lab">Leurres principaux</div><p data-evidence="E54-C0434">Maladies auto-immunes, troubles de l’hémostase et maladies rhumatologiques. Dans 280 cas publiés, le retard diagnostique a conduit à des bilans auto-immuns ou hémostatiques étendus et inutiles.</p>
<div class="lab">Hémorragie digestive</div><p data-evidence="E54-C0435">Penser aussi à la gingivite ulcéreuse, aux dyscrasies sanguines, aux vasculites et à la gastropathie d’hypertension portale.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0436">La coagulation normale et le contexte alimentaire orientent vers le scorbut avant les bilans lourds.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41759242/" target="_blank" rel="noopener">Rivière et al., revue de 280 cas adultes de scorbut, Clinical Nutrition 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15797491/" target="_blank" rel="noopener">Fain, manifestations musculo-squelettiques du scorbut, Joint Bone Spine 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-deces" data-title="Complications graves et décès">
<div class="lab">Mortalité</div><p data-evidence="E54-C0437">Le scorbut non traité peut être mortel : infections, hémorragie cérébrale, hémopéricarde. Une évolution « toujours létale » sans traitement est décrite. Une mort subite est également décrite.</p>
<div class="lab">Complications</div><p data-evidence="E54-C0438">Hypertension pulmonaire avec insuffisance cardiaque droite et bas débit, anémie sévère avec insuffisance cardiaque à haut débit, hémorragie digestive, hématome sous-dural, saignements périopératoires.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0439">Traiter sans retard : les saignements, les signes buccaux et l’hémorragie digestive régressent en quelques jours ou en 24 heures.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/8091164/" target="_blank" rel="noopener">Hürlimann et Salomon, Skorbut (Zurich), Schweizerische Medizinische Wochenschrift 1994</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41360493/" target="_blank" rel="noopener">Berra et al., hypertension pulmonaire réversible et scorbut (Genève), BMJ Case Reports 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15949874/" target="_blank" rel="noopener">Khonsari et al., Le scorbut, une maladie émergente, Revue de médecine interne 2005</a>.</p></template>
<template data-pop="e54-doses" data-title="Doses de traitement : comparaison">
<div class="lab">Sources</div><p data-evidence="E54-C0440">ESPEN : environ 1 g par jour pendant au moins une semaine (essai) ; 200 à 500 mg par jour en malabsorption chronique ou chirurgie bariatrique. Étude parisienne : 1 g par jour par voie orale fractionnée pendant 15 jours. Information suisse Streuli : 250 à 500 mg par jour en injection intraveineuse lente ; 5 à 7 mg/kg par jour chez l’enfant et le nouveau-né. Burgerstein : 1 à 2 gélules de 500 mg par jour dès 12 ans. Revue pédiatrique : 100 à 300 mg par jour jusqu’à 1000 mg.</p>
<div class="lab">Lecture</div><p data-evidence="E54-C0441">Ces schémas répondent à des situations différentes et ne sont pas standardisés. La voie orale est habituelle ; la voie parentérale est réservée aux troubles de l’absorption et à l’alimentation artificielle.</p>
<div class="lab">Fractionnement</div><p data-evidence="E54-C0442">Jusqu’à 180 mg, 70 à 90 % sont absorbés ; entre 1 et 12 g, l’absorption tombe d’environ 50 % à 15 %. Il faut donc fractionner les doses.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20617280/" target="_blank" rel="noopener">Raynaud-Simon et al., scorbut du sujet âgé hospitalisé, Journal of Nutrition, Health and Aging 2010</a>.</p></template>
<template data-pop="e54-streuli" data-title="Vitamine C Streuli 10 % / 20 %">
<div class="lab">Posologie</div><p data-evidence="E54-C0443">Carence ou troubles de l’absorption : 250 à 500 mg par jour en i.v. lente chez l’adulte et l’adolescent ; chez l’enfant et le nouveau-né, 5 à 7 mg/kg par jour pour un besoin accru. La durée dépend de la clinique et de la biologie.</p>
<div class="lab">Contre-indications et précautions</div><p data-evidence="E54-C0444">Hémochromatose, troubles du stockage du fer et β-thalassémie contre-indiquent la forme intraveineuse. Hyperoxalurie ou lithiase oxalique récidivante : 100 à 200 mg par jour au plus. Insuffisance rénale sévère ou dialyse : 50 à 100 mg par jour au plus. Déficit en G6PD : hémolyses sévères décrites sous 4 g par jour. La forme contient 250 mg/mL de propylène glycol et du sodium (74 ou 148 mg par ampoule).</p>
<div class="lab">Grossesse</div><p data-evidence="E54-C0445">Ne pas dépasser les doses journalières recommandées.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023.</p></template>
<template data-pop="e54-burgerstein" data-title="Burgerstein Vitamin C retard 500 mg">
<div class="lab">Posologie</div><p data-evidence="E54-C0446">1 à 2 gélules par jour dans les états carentiels dès 12 ans.</p>
<div class="lab">Contre-indications</div><p data-evidence="E54-C0447">Néphrolithiase avec oxalurie, urémie, hémochromatose (contre-indication) ; prudence en cas de troubles du fer.</p>
<div class="lab">Cinétique</div><p data-evidence="E54-C0448">Absorption active par cotransport sodium-ascorbate, saturable : 70 à 90 % jusqu’à 180 mg ; pool d’environ 1500 mg ; au-delà de 3 g par jour, élimination surtout fécale.</p>
<p class="src">Références : Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025.</p></template>
<template data-pop="e54-nutrition-art" data-title="Nutrition artificielle">
<div class="lab">Recommandations ESPEN</div><p data-evidence="E54-C0449">Nutrition entérale : au moins 100 mg par jour pour 1500 kcal (recommandation 23.4, grade A). Nutrition parentérale : 100 à 200 mg par jour (recommandation 23.5, point de bonne pratique). En phase aiguë critique : 2 à 3 g par jour par voie intraveineuse (recommandation 23.7, grade B).</p>
<div class="lab">Limite</div><p data-evidence="E54-C0450">La vitamine C est instable en nutrition parentérale : poches multicouches et protection contre la lumière. Le bénéfice clinique de la correction du taux n’est pas démontré.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a>.</p></template>
<template data-pop="e54-oxalate" data-title="Oxalate et plafond de dose">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0451">Le métabolisme de la vitamine C produit de l’oxalate, qui peut représenter jusqu’à 50 % des métabolites urinaires. L’acidification urinaire favorise les calculs d’oxalate et la précipitation d’urates ou de cystine.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0452">Lithiase oxalique récidivante : 100 à 200 mg par jour au plus. Insuffisance rénale sévère ou dialyse : 50 à 100 mg par jour, pour éviter l’hyperoxalémie.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025.</p></template>
<template data-pop="e54-fer-g6pd" data-title="Fer et déficit en G6PD">
<div class="lab">Fer</div><p data-evidence="E54-C0453">La vitamine C réduit le fer ferrique en fer ferreux et favorise son absorption ; une surcharge en fer accélère la dégradation de l’ascorbate. Hémochromatose, troubles du stockage du fer et β-thalassémie contre-indiquent la forme intraveineuse suisse. ESPEN contre-indique la supplémentation en cas de thalassémie, de déficit en G6PD, de drépanocytose et d’hémochromatose.</p>
<div class="lab">G6PD</div><p data-evidence="E54-C0454">L’information suisse décrit des hémolyses sévères sous 4 g par jour ; ESPEN situe le risque au-delà de 60 g. Les seuils diffèrent ; le cours retient le texte suisse.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025.</p></template>
<template data-pop="e54-prevention" data-title="Prévention : valeurs D-A-CH et ESPEN">
<div class="lab">Principe</div><p data-evidence="E54-C0455">Couvrir les valeurs D-A-CH, avec majoration chez le fumeur, la femme enceinte et la femme qui allaite. Cibler les sans-abri.</p>
<div class="lab">ESPEN</div><p data-evidence="E54-C0456">500 mg par jour chez les patients en stress oxydatif chronique (diabète, insuffisance cardiaque, tabac, alcoolisme, BPCO sévère, hémodialyse intermittente). Le tableau 14 indique 500 mg alors que la recommandation 23.6 indique 200 à 500 mg.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26227083/" target="_blank" rel="noopener">Valeurs de référence D-A-CH pour la vitamine C (DGE, ÖGE, SGE), Annals of Nutrition and Metabolism 2015</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15949874/" target="_blank" rel="noopener">Khonsari et al., Le scorbut, une maladie émergente, Revue de médecine interne 2005</a>.</p></template>
<template data-pop="e54-guerison" data-title="Évolution sous traitement">
<div class="lab">Délais</div><p data-evidence="E54-C0457">Saignements, signes buccaux et signes généraux : quelques jours. Hémorragie digestive : arrêt et stabilisation des capillaires en 24 heures. Ecchymoses et signes osseux : quelques semaines. Anomalies hématologiques : vers 3 mois. Réponse clinique : 1 semaine à 3 mois.</p>
<div class="lab">Enfant et cas genevois</div><p data-evidence="E54-C0458">Guérison complète dans 76 % des cas en 1 à 11 mois chez l’enfant ; hypertension pulmonaire normalisée en une semaine dans le cas genevois.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41360493/" target="_blank" rel="noopener">Berra et al., hypertension pulmonaire réversible et scorbut (Genève), BMJ Case Reports 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-dosage" data-title="Dosage de la vitamine C plasmatique">
<div class="lab">Recommandation</div><p data-evidence="E54-C0459">Acide ascorbique total ou acide ascorbique, plasma préféré, sérum à éviter (recommandation 23.3, grade B). Proposé à tout patient suspect de scorbut ou d’apport chroniquement bas (23.1).</p>
<div class="lab">Application</div><p data-evidence="E54-C0460">Prélèvement à jeun, avant le traitement ; lecture avec la CRP.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0461">Le taux reflète surtout l’apport récent et peut être normalisé par une prise récente. Chez l’enfant, la revue pédiatrique le considère comme l’examen de référence (seuil &lt; 0,2 mg/dL).</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20617280/" target="_blank" rel="noopener">Raynaud-Simon et al., scorbut du sujet âgé hospitalisé, Journal of Nutrition, Health and Aging 2010</a>.</p></template>
<template data-pop="e54-preanalytique" data-title="Conditions de prélèvement">
<div class="lab">Procédure</div><p data-evidence="E54-C0462">Centrifugation immédiate à 4 °C, protection contre la lumière, acidification et congélation à −70 ou −80 °C. Analyse par HPLC.</p>
<div class="lab">Raison</div><p data-evidence="E54-C0463">La vitamine C s’oxyde ; chaque étape limite sa destruction avant le dosage.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a>.</p></template>
<template data-pop="e54-crp" data-title="Inflammation et dosage">
<div class="lab">Valeurs</div><p data-evidence="E54-C0464">Le taux baisse dès que la CRP dépasse 10 mg/L ; aucune valeur normale n’est observée si la CRP dépasse 40 mg/L.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0465">ESPEN ne recommande pas le dosage en phase critique ou d’inflammation sévère (23.2). L’étude gériatrique parisienne reste significative après exclusion des CRP > 50 mg/L.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20617280/" target="_blank" rel="noopener">Raynaud-Simon et al., scorbut du sujet âgé hospitalisé, Journal of Nutrition, Health and Aging 2010</a>.</p></template>
<template data-pop="e54-leucocytes" data-title="Dosage leucocytaire">
<div class="lab">Intérêt</div><p data-evidence="E54-C0466">Les leucocytes concentrent l’ascorbate 50 à 100 fois plus que le plasma ; le dosage reflète mieux les réserves tissulaires.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0467">Plus difficile à réaliser ; ESPEN le mentionne sans valeur seuil exploitable.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-coag" data-title="Coagulation normale">
<div class="lab">Fait</div><p data-evidence="E54-C0468">Chez des patients chirurgicaux qui saignaient diffusément, la coagulation était normale et la vitamine C &lt; 0,6 mg/dL.</p>
<div class="lab">Mécanisme</div><p data-evidence="E54-C0469">Le saignement vient de la fragilité de la paroi capillaire, non d’un défaut de facteurs de coagulation.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0470">Une coagulation normale devant un saignement diffus évoque le scorbut.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-carences-assoc" data-title="Carences associées">
<div class="lab">À rechercher</div><p data-evidence="E54-C0471">Vitamine D (60 % des carences associées chez l’enfant), B1, B6, A, B12, folates, zinc et fer. Zurich : folates et B12 chez deux patients sur quatre. Genève : B1, zinc et sélénium.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0472">Les corriger en même temps que la vitamine C, car elles prolongent l’anémie et d’autres symptômes.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/8091164/" target="_blank" rel="noopener">Hürlimann et Salomon, Skorbut (Zurich), Schweizerische Medizinische Wochenschrift 1994</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41360493/" target="_blank" rel="noopener">Berra et al., hypertension pulmonaire réversible et scorbut (Genève), BMJ Case Reports 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-radio-enfant" data-title="Radiographie de l’enfant">
<div class="lab">Signes</div><p data-evidence="E54-C0473">Ligne de Fränkel (73 %), anneau de Wimberger (41 %), ostéopénie (31 %), éperon de Pelkan (18 %), zone de Trümmerfeld (14 %). Normale dans 7 % des cas.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0474">Les signes sont souvent reconnus seulement après coup et apparaissent après 3 à 6 mois : une radiographie normale n’exclut pas la maladie.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-irm" data-title="IRM">
<div class="lab">Résultats</div><p data-evidence="E54-C0475">Anomalies dans 97 % des cas : hypersignal T2 métaphysaire multifocal et symétrique, réaction périostée, hémorragies sous-périostées, œdème des parties molles.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0476">Examen sensible pour l’enfant ; le scanner apporte peu.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-imagerie-adulte" data-title="Imagerie de l’adulte">
<div class="lab">Signes</div><p data-evidence="E54-C0477">Ostéolyse, pincement articulaire, ostéonécrose, ostéopénie, apposition périostée.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0478">Source en résumé seulement.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15797491/" target="_blank" rel="noopener">Fain, manifestations musculo-squelettiques du scorbut, Joint Bone Spine 2005</a>.</p></template>
<template data-pop="e54-endoscopie" data-title="Endoscopie">
<div class="lab">Signes</div><p data-evidence="E54-C0479">Hémorragies intramuqueuses gastroduodénales ou coliques.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0480">L’hémorragie digestive s’arrête sous vitamine C en 24 heures.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-interferences" data-title="Interférences analytiques">
<div class="lab">Effets</div><p data-evidence="E54-C0481">Des doses de l’ordre du gramme faussent les dosages urinaires du glucose, de l’urate, de la créatinine, du phosphate et de l’oxalate, peuvent donner un faux négatif à la recherche de sang occulte fécal et fausser la glycémie capillaire (hyperglycémie factice).</p>
<div class="lab">Décision</div><p data-evidence="E54-C0482">Prélever le bilan avant la première dose, et signaler le traitement au laboratoire.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-tissus" data-title="Répartition tissulaire">
<div class="lab">Valeurs</div><p data-evidence="E54-C0483">Concentrations les plus élevées dans la corticosurrénale, l’hypophyse, le thymus, le corps jaune et la rétine. Plasma : 8 à 14 mg/L. Leucocytes : 50 à 100 fois le plasma. Environ 2 mg pour 100 g de poids.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0484">Le plasma est un reflet pauvre du stock ; le leucocyte reflète mieux les réserves.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-entero" data-title="Absorption entérale">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0485">Cotransport sodium-ascorbate actif et saturable dans le jéjunum et l’iléon.</p>
<div class="lab">Conséquence</div><p data-evidence="E54-C0486">Absorption de 70 à 90 % jusqu’à 180 mg, d’environ 50 % à 15 % entre 1 et 12 g : il faut fractionner les doses.</p>
<p class="src">Références : Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a>.</p></template>
<template data-pop="e54-triple" data-title="Triple hélice et liaisons croisées">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0487">L’hydroxylation de la proline et de la lysine par la prolyl- et la lysyl-hydroxylase permet la triple hélice stable et les liaisons croisées.</p>
<div class="lab">Conséquence</div><p data-evidence="E54-C0488">Sans ascorbate, le collagène est instable et les parois vasculaires, la matrice osseuse et la gencive sont fragiles.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-seuil-renal" data-title="Seuil rénal">
<div class="lab">Valeur</div><p data-evidence="E54-C0489">Environ 14 mg/L (85 µmol/L). Au-delà, l’excès est excrété inchangé dans l’urine.</p>
<div class="lab">Conséquence</div><p data-evidence="E54-C0490">Augmenter la dose augmente surtout l’élimination urinaire et l’oxalate ; au-delà de 3 g par jour, l’élimination se fait surtout par les selles.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; Information professionnelle suisse Burgerstein Vitamin C retard 500 mg, Swissmedic (AIPS), mise à jour janvier 2025.</p></template>
<template data-pop="e54-cofacteurs" data-title="Cofacteurs enzymatiques">
<div class="lab">Liste</div><p data-evidence="E54-C0491">Prolyl- et lysyl-hydroxylase du procollagène ; dopamine-β-hydroxylase (noradrénaline) ; synthèse de la carnitine, du cortisol et de la vasopressine ; hydroxylation des corticostéroïdes et du tryptophane ; formation de l’acide tétrahydrofolique ; dégradation de la tyrosine.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0492">Un déficit isolé en cofacteur explique un tableau polymorphe, mais seul le collagène a un lien clinique établi avec les saignements.</p>
<p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, recommandations sur les micronutriments (Berger et al.), Clinical Nutrition 2022, chapitre vitamine C</a> ; Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-fer-redox" data-title="Vitamine C et fer">
<div class="lab">Mécanisme</div><p data-evidence="E54-C0493">Réduction du fer ferrique en fer ferreux, qui favorise son absorption, et mobilisation du fer de la ferritine.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0494">Une surcharge en fer transfusionnelle accélère la dégradation de l’ascorbate : le patient polytransfusé est à risque de carence.</p>
<p class="src">Références : Information professionnelle suisse Vitamine C Streuli 10 % / 20 % solution injectable, Swissmedic (AIPS), mise à jour juin 2023 ; <a href="https://pubmed.ncbi.nlm.nih.gov/35277043/" target="_blank" rel="noopener">Trapani et al., scorbut pédiatrique des vingt dernières années, Nutrients 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37366866/" target="_blank" rel="noopener">Gandhi et al., Scurvy: Rediscovering a Forgotten Disease, Diseases 2023</a>.</p></template>
<template data-pop="e54-adultes280" data-title="Revue de 280 cas adultes (2000–2025)">
<div class="lab">Résultat</div><p data-evidence="E54-C0495">Rivière et al. ont revu 280 cas adultes de scorbut publiés entre 2000 et 2025. Le scorbut y est décrit comme un imitateur persistant : le retard diagnostique a conduit à des bilans auto-immuns ou hémostatiques étendus et inutiles.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0496">La source n’a été lue qu’en résumé : la fréquence de chaque signe dans ces 280 cas n’est pas disponible. Le cours n’en donne donc aucune.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41759242/" target="_blank" rel="noopener">Rivière et al., revue de 280 cas adultes de scorbut, Clinical Nutrition 2026</a>.</p></template>
<template data-pop="e54-allemagne" data-title="Concentrations plasmatiques en Allemagne">
<div class="lab">Résultat</div><p data-evidence="E54-C0497">Sur 178 participants volontaires d’un séminaire, 17,4 % avaient un taux &lt; 5 mg/L et 3,3 % un taux &lt; 1,5 mg/L.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0498">Échantillon non représentatif ; source en résumé seulement. Ces chiffres montrent qu’un taux très bas existe hors hôpital, sans donner de prévalence.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/28760081/" target="_blank" rel="noopener">Concentrations plasmatiques d’acide ascorbique dans la population allemande, Journal of International Medical Research 2018</a>.</p></template>
<template data-pop="e54-precaires" data-title="Populations précaires">
<div class="lab">Constat</div><p data-evidence="E54-C0499">En France, le scorbut touche surtout les sans-abri des grandes villes ; à Paris, un repas enrichi en vitamine C leur est distribué. Les auteurs décrivent une évolution « toujours létale » sans traitement.</p>
<div class="lab">Décision</div><p data-evidence="E54-C0500">Dépister devant tout saignement gingival ou cutané chez une personne sans abri ; cibler la prévention.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15949874/" target="_blank" rel="noopener">Khonsari et al., Le scorbut, une maladie émergente, Revue de médecine interne 2005</a>.</p></template>
<template data-pop="e54-tca" data-title="Scorbut et anorexie mentale">
<div class="lab">Constat</div><p data-evidence="E54-C0501">Une revue de 9 cas publiés décrit l’association du scorbut et de l’anorexie mentale. Le cas genevois (IMC de 14,7 kg/m²) en est un exemple.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0502">Petite série, résumé seul. Le trouble alimentaire doit être traité en même temps que la carence.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41360493/" target="_blank" rel="noopener">Berra et al., hypertension pulmonaire réversible et scorbut (Genève), BMJ Case Reports 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39296506/" target="_blank" rel="noopener">Cui, scorbut et anorexie mentale, Frontiers in Nutrition 2024</a>.</p></template>
<template data-pop="e54-polyhandicap" data-title="Enfant polyhandicapé">
<div class="lab">Constat</div><p data-evidence="E54-C0503">Schwetje et al. décrivent deux enfants polyhandicapés. Le scorbut infantile reste un diagnostic différentiel en médecine occidentale ; on observe un retard de consolidation osseuse, une épiphysiolyse et une hypertrophie gingivale. La substitution peut se faire par gastrostomie.</p>
<div class="lab">Série italienne</div><p data-evidence="E54-C0504">Toscano et al. rapportent 5 enfants atteints d’autisme ou de retard de développement.</p>
<div class="lab">Limite</div><p data-evidence="E54-C0505">Résumés seuls ; très petites séries.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40437614/" target="_blank" rel="noopener">Toscano et al., série pédiatrique de scorbut, Italian Journal of Pediatrics 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32247222/" target="_blank" rel="noopener">Schwetje et al., scorbut infantile, Nutrition 2020</a>.</p></template>
<template data-pop="pareto-e54-definition" data-title="Pareto — Définition et seuils">
<p class="ratio" data-cover="e54-0,e54-1"></p><ul><li data-evidence="E54-C0506">Le scorbut est l’expression clinique d’une carence en vitamine C ; les seuils ESPEN (&lt; 23 et &lt; 11 µmol/L) et suisses (&lt; 2 mg/L pour le scorbut clinique) ne sont pas interchangeables.</li><li data-evidence="E54-C0507">Aucune classification officielle de gravité n’existe ; on classe par taux, par tableau clinique et par mécanisme.</li><li data-evidence="E54-C0508">Un taux est un indice ; il ne remplace ni le contexte ni la réponse au traitement.</li></ul>
</template>
<template data-pop="pareto-e54-epidemio" data-title="Pareto — Fréquence">
<p class="ratio" data-cover="e54-2"></p><ul><li data-evidence="E54-C0509">Aucune prévalence suisse ou européenne représentative n’existe.</li><li data-evidence="E54-C0510">12 % de scorbut clinique en gériatrie aiguë parisienne ; mortalité 44 % contre 9 %.</li><li data-evidence="E54-C0511">Terrain : alcoolisme, isolement, démence, trouble alimentaire, autisme, précarité.</li></ul>
</template>
<template data-pop="pareto-e54-meca" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="e54-3"></p><ul><li data-evidence="E54-C0512">Sans ascorbate, le collagène est instable : fragilité capillaire, saignements avec coagulation normale.</li><li data-evidence="E54-C0513">Les signes apparaissent après 4 à 12 semaines, quand le pool passe sous 300 mg.</li><li data-evidence="E54-C0514">Carnitine, catécholamines et hypertension pulmonaire sont des hypothèses plausibles, non démontrées.</li></ul>
</template>
<template data-pop="pareto-e54-causes" data-title="Pareto — Causes et facteurs de risque">
<p class="ratio" data-cover="e54-4"></p><ul><li data-evidence="E54-C0515">Apport insuffisant, malabsorption et pertes accrues : trois voies de déficit.</li><li data-evidence="E54-C0516">Tabac (+40 % de renouvellement), dialyse et surcharge en fer augmentent les besoins.</li><li data-evidence="E54-C0517">Les médicaments (acide acétylsalicylique, barbituriques, tétracyclines, corticostéroïdes, contraceptifs) modifient le statut.</li></ul>
</template>
<template data-pop="pareto-e54-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="e54-5,e54-6"></p><ul><li data-evidence="E54-C0518">L’anamnèse alimentaire est obligatoire ; un IMC normal n’exclut rien chez l’enfant.</li><li data-evidence="E54-C0519">Gencives saignantes, hémorragies périfolliculaires, poils en tire-bouchon, arthralgies.</li><li data-evidence="E54-C0520">L’enfant refuse de marcher ; la douleur des membres inférieurs domine.</li></ul>
</template>
<template data-pop="pareto-e54-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="e54-7"></p><ul><li data-evidence="E54-C0521">Dosage à jeun avant la première dose ; ne pas retarder l’essai d’environ 1 g par jour pendant une semaine.</li><li data-evidence="E54-C0522">La guérison sous traitement est l’argument diagnostique le plus pertinent.</li><li data-evidence="E54-C0523">Le bilan auto-immun étendu et l’examen invasif inutiles sont les erreurs classiques.</li></ul>
</template>
<template data-pop="pareto-e54-urgences" data-title="Pareto — Urgences et complications">
<p class="ratio" data-cover="e54-8"></p><ul><li data-evidence="E54-C0524">Le scorbut non traité peut être mortel : infection, hémorragie cérébrale, hémopéricarde.</li><li data-evidence="E54-C0525">Hypertension pulmonaire, anémie sévère et hémorragie digestive sont réversibles.</li><li data-evidence="E54-C0526">Traiter sans retard le patient dénutri qui saigne.</li></ul>
</template>
<template data-pop="pareto-e54-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="e54-9"></p><ul><li data-evidence="E54-C0527">Corriger la cause et reconstituer les réserves ; la voie orale est habituelle.</li><li data-evidence="E54-C0528">Doses non standardisées : 1 g par jour (ESPEN, Paris), 250 à 500 mg par jour i.v. (Streuli), 1 à 2 gélules (Burgerstein).</li><li data-evidence="E54-C0529">Plafonds : 100 à 200 mg par jour en lithiase, 50 à 100 mg en dialyse ; prudence avec le fer et la G6PD.</li></ul>
</template>
<template data-pop="pareto-e54-suivi" data-title="Pareto — Suivi, pronostic et prévention">
<p class="ratio" data-cover="e54-10"></p><ul><li data-evidence="E54-C0530">Réponse en jours pour les saignements, en semaines pour les ecchymoses et les os, en 3 mois pour l’hématologie.</li><li data-evidence="E54-C0531">Suivi social, nutritionnel et psychiatrique ; éviter l’arrêt brutal après doses élevées.</li><li data-evidence="E54-C0532">Prévention : valeurs D-A-CH majorées chez le fumeur, la femme enceinte et la femme qui allaite.</li></ul>
</template>
<template data-pop="pareto-e54-situations" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="e54-11"></p><ul><li data-evidence="E54-C0533">Enfant : pseudo-paralysie ; grossesse : ne pas dépasser les doses recommandées.</li><li data-evidence="E54-C0534">Bariatrique : 200 à 500 mg par jour ; dialyse : 50 à 100 mg par jour.</li><li data-evidence="E54-C0535">Soins intensifs : dosage non fiable en phase inflammatoire.</li></ul>
</template>
<template data-pop="pareto-e54-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e54-e-1,e54-e-2,e54-e-3,e54-e-4,e54-e-5"></p><ul><li data-evidence="E54-C0536">Dosage plasmatique à jeun, avant traitement, lu avec la CRP.</li><li data-evidence="E54-C0537">Coagulation normale ; carences associées ; radiographie et IRM chez l’enfant.</li><li data-evidence="E54-C0538">Les doses de gramme faussent plusieurs dosages et la glycémie capillaire.</li></ul>
</template>
<template data-pop="pareto-e54-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e54-s-anat-cours"></p><ul><li data-evidence="E54-C0539">Absorption dans le jéjunum et l’iléon ; stocks surtout surrénaux, hypophysaires, thymiques et rétiniens.</li><li data-evidence="E54-C0540">Les lésions touchent capillaires, gencive, follicule, périoste, articulation et muqueuse digestive.</li><li data-evidence="E54-C0541">Plasma pauvre, leucocyte plus fidèle.</li></ul>
</template>
<template data-pop="pareto-e54-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="e54-s-histo-cours"></p><ul><li data-evidence="E54-C0542">Collagène non hydroxylé, triple hélice instable, membrane basale fragile.</li><li data-evidence="E54-C0543">Hyperkératose folliculaire, matrice ostéoïde défectueuse, hémorragie sous-périostée.</li><li data-evidence="E54-C0544">Le saignement est un défaut de paroi.</li></ul>
</template>
<template data-pop="pareto-e54-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e54-s-physio-cours"></p><ul><li data-evidence="E54-C0545">Absorption saturable, pool de 1500 mg, renouvellement de 45 à 60 mg par jour.</li><li data-evidence="E54-C0546">Seuil rénal de 14 mg/L, oxalate jusqu’à 50 % des métabolites urinaires.</li><li data-evidence="E54-C0547">Besoins D-A-CH : 110 mg (homme), 95 mg (femme).</li></ul>
</template>
<template data-pop="pareto-e54-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e54-s-bioch-cours"></p><ul><li data-evidence="E54-C0548">Donneur d’électrons et cofacteur d’hydroxylases.</li><li data-evidence="E54-C0549">Collagène, noradrénaline, carnitine, fer, monoxyde d’azote : voies concernées.</li><li data-evidence="E54-C0550">Les lignes hypothétiques ne doivent pas être enseignées comme établies.</li></ul>
</template>
<template data-pop="pareto-e54-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e54-p-1,e54-p-2,e54-p-3,e54-p-4"></p><ul><li data-evidence="E54-C0551">Vitamine C orale fractionnée en première intention ; voie i.v. réservée aux troubles de l’absorption.</li><li data-evidence="E54-C0552">Streuli 250 à 500 mg par jour i.v. lente ; Burgerstein 1 à 2 gélules par jour dès 12 ans.</li><li data-evidence="E54-C0553">Oxalate, fer, G6PD et grossesse limitent la dose.</li></ul>
</template>
