<section class="ilot" id="e56-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p>
<p>Une femme de 38 ans, suivie pour une maladie cœliaque, consulte pour des ecchymoses apparues sans traumatisme et pour des selles grasses depuis plusieurs semaines. Le <button class="w" data-k="e56-tp-test">temps de prothrombine</button> est allongé. Après une injection de vitamine K, il se normalise. Ce cheminement illustre la règle centrale du chapitre : <b>la carence en vitamine K se démontre par la correction d’un trouble de la coagulation, et la carence en vitamine E par un dosage corrigé des lipides, alors que la clinique reste longtemps muette.</b></p>
<p>Les deux vitamines ont en commun d’être liposolubles. Leur absorption dépend donc de la digestion et de l’absorption des graisses, ce qui explique que la majorité des carences de l’adulte soient des carences secondaires à une malabsorption ou à une maladie du foie, de la bile ou du pancréas, plutôt que des carences d’apport pur. Elles diffèrent en revanche par leur cible. La vitamine E protège les membranes des cellules nerveuses et musculaires, de sorte que sa carence se manifeste lentement par une atteinte neurologique. La vitamine K active des protéines de la coagulation, de sorte que sa carence se manifeste par un saignement.</p>
<div class="key"><b>Point de départ.</b> Devant une malabsorption des graisses, deux questions s’imposent : <button class="w" data-k="e56-vite-formes">le statut en vitamine E (formes, équivalences et rôle antioxydant)</button> et <button class="w" data-k="e56-vitk-formes">le statut en vitamine K (phylloquinone, ménaquinones, ménadione)</button>. Aucune ne se devine sur l’état général ; chacune se mesure.</div>
<p>Le chapitre suit l’ordre d’une consultation : définir et comprendre les mécanismes (îlots 1 à 4), chercher la cause et reconnaître les manifestations (îlots 5 à 8), décider en urgence et traiter (îlots 9 à 12), puis surveiller et conclure (îlots 13 et 14).</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">Berger et al., ESPEN, directive sur les micronutriments, 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10923111/" target="_blank" rel="noopener">Traber, carence humaine en vitamine E, 2024</a>.</p></section>
<section class="ilot" id="e56-1"><h2><span class="n">1</span>Définitions et nomenclature</h2><p>La catégorie E56 de la classification CIM-10-GM 2024 regroupe quatre sous-codes. Le tableau les présente avec la lecture que fait ce chapitre de chacun.</p><table class="t"><tr><th>Code</th><th>Intitulé</th><th>Traitement dans ce chapitre</th></tr><tr><td>E56.0</td><td>Carence en vitamine E</td><td>Traité en entier : mécanismes, neurologie, dosage, supplémentation</td></tr><tr><td>E56.1</td><td>Carence en vitamine K</td><td>Traité en entier : coagulation, biomarqueurs, traitement. L’exclusion D68.4 et P53 est expliquée ci-dessous</td></tr><tr><td>E56.8</td><td>Carence en autres vitamines</td><td>Aucune source lue ne précise quelles vitamines ce code regroupe : le chapitre n’en dresse pas la liste</td></tr><tr><td>E56.9</td><td>Avitaminose, sans précision</td><td>Code de repli quand la vitamine en cause n’est pas identifiée</td></tr></table><p>Deux exclusions encadrent l’usage. Selon la page de l’Office allemand des médicaments, <button class="w" data-k="e56-codes">la carence acquise en facteurs de la coagulation (D68.4) et la maladie hémorragique du nouveau-né (P53) sont exclues de E56.1</button>. En pratique, le trouble de la coagulation attribué à la vitamine K chez l’adulte se discute donc avec D68.4, et l’hémorragie néonatale se code P53. Le contenu néonatal reste cependant utile pour comprendre la physiopathologie et la prophylaxie suisse, et il est traité à l’îlot 12. Le bloc E50–E64 exclut en outre les anémies nutritionnelles (D50–D53), et la catégorie E56 exclut les séquelles d’autres avitaminoses (E64.8).</p>
<p><b>Vitamine E.</b> C’est une vitamine liposoluble et antioxydante. L’α-tocophérol est la forme naturelle de plus haute activité biologique et le principal antioxydant liposoluble des membranes. Sa définition précise est débattue : seule la forme 2R-α-tocophérol correspond à la vitamine E selon l’autorité européenne de sécurité des aliments ; les autres tocophérols et les tocotriénols sont éliminés plus vite et ne devraient pas porter ce nom. Les <button class="w" data-k="e56-vite-formes">équivalences entre unités internationales et milligrammes</button> dépendent de la forme naturelle ou synthétique.</p>
<p><b>Vitamine K.</b> C’est un groupe de molécules liposolubles, cofacteurs de l’enzyme qui active des protéines dites vitamine K-dépendantes. La vitamine K1 (phylloquinone) provient des plantes. La vitamine K2 (ménaquinones) est synthétisée par le microbiote intestinal et présente dans les aliments fermentés et les produits animaux. La vitamine K3 (ménadione) est une provitamine de synthèse, <button class="w" data-k="e56-d-menadione">toxique et retirée du marché</button>.</p><div class="trap"><span class="k">Limite de la source</span> La page de classification ne dit pas quelles vitamines relèvent de E56.8. Ne pas déduire cette liste de la seule logique du libellé : une carence en une autre vitamine liposoluble ou hydrosoluble se code selon le diagnostic précis et la règle de codage locale, non d’après ce chapitre.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e50-e64.htm" target="_blank" rel="noopener">Office allemand des médicaments, CIM-10-GM 2024, bloc E50–E64</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">Office fédéral de la statistique, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10923111/" target="_blank" rel="noopener">Traber 2024</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, chapitres 24 et 25</a>.</p></section>
<section class="ilot" id="e56-2"><h2><span class="n">2</span>Épidémiologie</h2><p>Les deux carences sont rares en population générale et fréquentes dans quelques populations bien définies. Le tableau sépare ces populations, car la prévalence moyenne n’aide pas un clinicien qui décide d’un dosage.</p><table class="t"><tr><th>Population</th><th>Donnée sourcée</th><th>Source</th></tr><tr><td>Population générale, vitamine E</td><td>Carence « très rare » selon la société allemande de nutrition ; liée à la malnutrition sévère ou à la malabsorption</td><td>DGE ; ESPEN 2022</td></tr><tr><td>Mucoviscidose, vitamine E</td><td>Carences biochimiques chez 23 % des nourrissons nouvellement diagnostiqués et 14 % des enfants plus âgés</td><td>ESPEN-ESPGHAN-ECFS 2016</td></tr><tr><td>Ataxie avec carence en vitamine E</td><td>Maladie autosomique récessive rare ; plus fréquente en Afrique du Nord, cas décrits en Europe du Nord ; plus de 25 mutations du gène de la protéine de transfert de l’α-tocophérol</td><td>Di Donato 2010 ; Müller 2011 ; Traber 2024</td></tr><tr><td>Adulte sain, vitamine K</td><td>8 à 31 % de carence selon les protéines sous-carboxylées ; coagulopathie clinique rare hors situations à risque</td><td>ESPEN 2022</td></tr><tr><td>Patients hospitalisés évalués pour coagulopathie</td><td>25 à 38 % avec un profil évocateur de carence en vitamine K (292 patients, dont 48,3 % en soins intensifs)</td><td>Bourguignon 2024</td></tr><tr><td>Mucoviscidose, vitamine K</td><td>Statut souvent insuffisant ; déficitaire chez tous les patients avec hépatopathie liée à la mucoviscidose</td><td>ESPEN-ESPGHAN-ECFS 2016</td></tr><tr><td>Nouveau-né en Suisse (P53)</td><td>Neuf cas pour 505 708 naissances vivantes de 2018 à 2024, soit 1,78 pour 100 000 ; 1,09 pour 100 000 de 2005 à 2011</td><td>Laubscher 2026 ; Laubscher 2013</td></tr></table><p>Deux commentaires aident à lire ce tableau. D’abord, les 8 à 31 % de l’adulte sain reposent sur un marqueur biochimique de protéines sous-carboxylées ; ils ne signifient pas que 8 à 31 % des adultes saignent, puisque la coagulopathie clinique n’apparaît que si la carence est sévère. Ensuite, la cohorte hospitalière sélectionne des patients déjà suspects de coagulopathie : son chiffre ne s’applique pas à la population générale. Aucune prévalence suisse de la carence en vitamine E ou de l’ataxie avec carence en vitamine E n’a été trouvée.</p><div class="trap"><span class="k">Erreur fréquente</span> Un biomarqueur anormal n’est pas une maladie : une protéine sous-carboxylée circulante signale un statut vitaminique bas, sans prédire un saignement.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/2__ESPEN-ESPGHAN-ECFS_guidelines_on_nutrition_care_for_infants_children_and_adults_with_cystic_fibrosis.pdf" target="_blank" rel="noopener">ESPEN-ESPGHAN-ECFS 2016</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/vitamin-e/" target="_blank" rel="noopener">DGE, vitamine E</a> ; <a href="https://doi.org/10.1007/s00431-025-06730-4" target="_blank" rel="noopener">Laubscher 2026</a> ; <a href="https://doi.org/10.1007/s00431-012-1895-1" target="_blank" rel="noopener">Laubscher 2013</a> ; <a href="https://doi.org/10.1016/j.jtha.2024.08.002" target="_blank" rel="noopener">Bourguignon 2024</a>.</p></section>
<section class="ilot" id="e56-3"><h2><span class="n">3</span>Vitamine E : du normal à la carence</h2><p>Le raisonnement part de la fonction, puis suit le trajet de la vitamine jusqu’au tissu, car chaque étape explique une cause de carence.</p>
<h3>Le rôle normal</h3><p>L’α-tocophérol protège de la peroxydation les lipides des membranes, des lipoprotéines et des graisses de réserve. Il agit comme antioxydant « briseur de chaîne » : il interrompt la réaction en chaîne par laquelle un radical libre oxyde successivement les acides gras voisins. Il régule aussi les espèces réactives de l’oxygène et de l’azote et module la transduction du signal. L’information professionnelle suisse d’Ephynal décrit la même fonction, la protection des membranes et des lipoprotéines contre les radicaux libres.</p>
<h3>Le trajet, étape par étape</h3><table class="t"><tr><th>Étape</th><th>Ce qui se passe</th><th>Conséquence si l’étape échoue</th></tr><tr><td>Digestion et micellisation</td><td>La bile et les sécrétions pancréatiques solubilisent la vitamine dans des micelles</td><td>Cholestase ou insuffisance pancréatique : carence</td></tr><tr><td>Absorption et chylomicrons</td><td>La vitamine entre dans l’entérocyte et gagne le sang par les chylomicrons</td><td>Malabsorption des graisses, maladies des chylomicrons : carence</td></tr><tr><td>Captage hépatique</td><td>La protéine de transfert de l’α-tocophérol (α-TTP) récupère l’α-tocophérol dans l’hépatocyte et le transfère aux VLDL et aux HDL naissantes</td><td>Mutation de l’α-TTP : ataxie avec carence en vitamine E</td></tr><tr><td>Distribution</td><td>Les lipoprotéines livrent la vitamine aux tissus, dont le tissu adipeux et les surrénales concentrent les plus hautes teneurs</td><td>Défaut de lipoprotéines (abêtalipoprotéinémie) : carence</td></tr></table><p>L’<button class="w" data-k="e56-attp">α-TTP</button> est le principal déterminant de la concentration plasmatique. Le foie renouvelle chaque jour la totalité du pool plasmatique d’α-tocophérol, ce qui montre que l’α-TTP n’échoue pas par défaut de stock mais par défaut de tri : sans elle, la vitamine absorbée est éliminée au lieu d’être redistribuée. Cette logique explique pourquoi une carence sévère peut survenir malgré un apport alimentaire normal.</p>
<div class="key"><b>À retenir.</b> Il existe trois niveaux de défaut : l’<b>apport</b> (rarement seul en cause), l’<b>absorption</b> (graisses, bile, pancréas, intestin) et le <b>transport</b> (lipoprotéines, α-TTP). Le mécanisme dicte le traitement : une dose orale suffit parfois, un dérivé hydrosoluble est nécessaire en cholestase, des doses très élevées sont requises dans les maladies du transport.</div>
<h3>De la carence à la clinique</h3><p>En l’absence de vitamine E, la peroxydation lipidique accumule de la lipofuscine dans les tissus et raccourcit la durée de vie des cellules. Les globules rouges deviennent plus sensibles à l’hémolyse, mais le test d’hémolyse in vitro n’est pas un biomarqueur fiable. Le système nerveux est la cible principale, avec une neuropathie sensitive progressive et une ataxie spinocérébelleuse ; ce point est détaillé dans l’onglet Sciences. Chez l’adulte, plus de cinq ans s’écoulent avant l’apparition des symptômes ; chez l’enfant, ils apparaissent dès les premiers mois ou les premières années.</p>
<p>Le très grand prématuré (moins de 1 500 g) est considéré comme carencé : l’α-tocophérol fœtal est nettement plus bas que celui de la mère, les lipoprotéines fœtales sont basses et le passage placentaire est faible. Il est exposé à l’anémie hémolytique, à des atteintes pulmonaires et à la rétinopathie du prématuré.</p><div class="trap"><span class="k">Piège</span> Une vitamine E plasmatique normale peut coexister avec des réserves tissulaires basses, car la concentration plasmatique est régulée par la protéine de liaison du tocophérol. Le dosage plasmatique est le meilleur outil disponible, non une photographie des tissus.</div><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10923111/" target="_blank" rel="noopener">Traber 2024</a> ; <a href="https://doi.org/10.1016/j.freeradbiomed.2021.09.021" target="_blank" rel="noopener">Arai et Kono 2021</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, §24</a> ; information professionnelle suisse d’Ephynal, octobre 2022.</p></section>
<section class="ilot" id="e56-4"><h2><span class="n">4</span>Vitamine K : du normal à la carence</h2><p>La vitamine K se comprend par une seule réaction, la carboxylation, dont dépend toute la coagulation que la vitamine commande.</p>
<h3>Le rôle normal</h3><p>La vitamine K est le cofacteur de la <button class="w" data-k="e56-gla">γ-glutamyl-carboxylase</button>. Cette enzyme transforme des résidus glutamate de protéines précurseurs en résidus γ-carboxyglutamate (Gla), capables de fixer le calcium. Sans cette fixation, la protéine reste biologiquement inactive. Les protéines vitamine K-dépendantes comprennent les facteurs II (prothrombine), VII, IX et X, les protéines C, S et Z et la protéine M ; s’y ajoutent des protéines osseuses et vasculaires (ostéocalcine, protéine Gla de la matrice, Gas6, périostine). L’information professionnelle de Konakion décrit le même mécanisme : la phytoménadione participe à la formation de la prothrombine, des facteurs VII, IX et X et des protéines C et S.</p>
<h3>De la carence au saignement</h3><p>Sans vitamine K, le foie sécrète des formes incomplètement carboxylées, appelées <button class="w" data-k="e56-pivka">protéines induites par l’absence ou l’antagonisme de la vitamine K (PIVKA)</button>. La plus utilisée est la prothrombine sous-carboxylée, ou PIVKA-II. Ces formes circulent mais ne coagulent pas : le temps de prothrombine s’allonge et l’hémostase est altérée. La conséquence est l’hémorragie, dont la gravité dépend de la profondeur du déficit.</p>
<h3>Des réserves courtes</h3><p>La phytoménadione s’accumule surtout dans le foie et n’y est stockée que brièvement ; sa demi-vie plasmatique est d’environ 70 heures. Cette faible capacité de stockage explique deux faits cliniques. D’une part, une carence peut s’installer en quelques semaines quand l’apport ou l’absorption s’effondre. D’autre part, une supplémentation doit être quotidienne pour rester efficace. Les bactéries intestinales, dont <i>Escherichia coli</i>, synthétisent la vitamine K2 mais pas la K1 et contribuent aux besoins : les antibiotiques à large spectre fragilisent donc cet apport.</p>
<p>Le nouveau-né cumule trois facteurs : la vitamine K franchit mal le placenta, l’intestin est stérile à la naissance et le lait maternel en contient peu. Le nourrisson allaité est donc à risque, d’où la <button class="w" data-k="e56-neonat">prophylaxie systématique suisse</button> exposée à l’îlot 12.</p>
<div class="key"><b>À retenir.</b> La vitamine K n’agit pas sur les protéines de la coagulation en les fabriquant, mais en les <b>rendant actives</b>. Une carence produit donc des facteurs présents et inefficaces. Cette distinction fonde le dosage des protéines sous-carboxylées, plus sensible que les tests de coagulation.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, §25</a> ; <a href="https://doi.org/10.7754/Clin.Lab.2017.171020" target="_blank" rel="noopener">Dong et al. 2018</a> ; information professionnelle suisse de Konakion MM paediatric, janvier 2022.</p></section>
<section class="ilot" id="e56-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2><p>Les causes se rangent selon le niveau de défaut décrit plus haut. Le tableau les relie au mécanisme afin de montrer pourquoi chacune est à rechercher.</p><table class="t"><tr><th>Vitamine</th><th>Cause documentée</th><th>Mécanisme</th><th>Source</th></tr><tr><td>E</td><td>Malnutrition sévère ; malabsorption des graisses (maladies inflammatoires, mucoviscidose)</td><td>Apport ou absorption insuffisants</td><td>ESPEN 2022</td></tr><tr><td>E</td><td>Abêtalipoprotéinémie (gène de la protéine microsomale de transfert des triglycérides), hypobêtalipoprotéinémie (apolipoprotéine B), maladie de rétention des chylomicrons (gène SAR1B)</td><td>Défaut de formation ou de sécrétion des lipoprotéines qui transportent la vitamine</td><td>ESPEN 2022 ; Traber 2024</td></tr><tr><td>E</td><td>Ataxie avec carence en vitamine E : mutation du gène codant l’α-TTP, autosomique récessive</td><td>Défaut de recyclage hépatique de l’α-tocophérol</td><td>Traber 2024 ; Di Donato 2010 ; Arai 2021</td></tr><tr><td>E</td><td>Cholestase (atrésie des voies biliaires), insuffisance pancréatique exocrine, intestin court</td><td>Défaut de micellisation ou de surface d’absorption</td><td>Information professionnelle d’Ephynal ; Traber 2024</td></tr><tr><td>E</td><td>Régime pauvre en graisses (apport en vitamine E réduit de 50 %), chirurgie bariatrique, médicaments limitant l’absorption des graisses</td><td>Moins de graisse alimentaire, moins de vitamine E absorbée</td><td>ESPEN 2022 ; Traber 2024</td></tr><tr><td>E</td><td>Grande prématurité</td><td>Faible passage placentaire, lipoprotéines basses</td><td>Traber 2024</td></tr><tr><td>K</td><td>Malabsorption des graisses (maladie cœliaque, mucoviscidose, intestin court), malnutrition</td><td>Apport ou absorption insuffisants</td><td>ESPEN 2022</td></tr><tr><td>K</td><td>Antibiotiques, notamment à large spectre et prolongés</td><td>Réduction de la synthèse de vitamine K2 par le microbiote</td><td>ESPEN 2022 ; ECFS 2016</td></tr><tr><td>K</td><td>Antivitamines K (warfarine)</td><td>Blocage pharmacologique du cycle de la vitamine</td><td>ESPEN 2022</td></tr><tr><td>K</td><td>Hépatopathie, stéatorrhée, maladie rénale chronique</td><td>Groupes où le dosage est recommandé</td><td>ESPEN 2022, recommandation 26.1</td></tr><tr><td>K</td><td>Cachexie cancéreuse (cas rapporté : temps de prothrombine 105,8 s, temps de céphaline activée 58,2 s, corrigés par la vitamine K intraveineuse)</td><td>Apport insuffisant et état catabolique</td><td>Balusu 2026</td></tr><tr><td>K</td><td>Pseudo-obstruction intestinale avec ciprofloxacine (cas d’hémopéricarde spontané, déficit en facteurs II, VII et X)</td><td>Malabsorption et antibiotique</td><td>Tasos 2022</td></tr></table><p>Les deux dernières lignes viennent de cas isolés : elles illustrent des mécanismes plausibles, sans donner de fréquence. À l’inverse, la majorité des carences de l’adulte réunit plusieurs facteurs, comme une malabsorption associée à des antibiotiques répétés. Le clinicien cherche donc la cause principale sans s’y arrêter.</p><div class="trap"><span class="k">Erreur fréquente</span> Un patient sous warfarine qui prend de fortes doses de vitamine E, ou dont l’apport en vitamine K varie fortement, déséquilibre son INR. Ce n’est pas une carence au sens de E56 ; c’est une interaction à gérer à l’îlot 13 et dans l’onglet Pharmacologie.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/2__ESPEN-ESPGHAN-ECFS_guidelines_on_nutrition_care_for_infants_children_and_adults_with_cystic_fibrosis.pdf" target="_blank" rel="noopener">ESPEN-ESPGHAN-ECFS 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10923111/" target="_blank" rel="noopener">Traber 2024</a> ; <a href="https://doi.org/10.1097/MBC.0000000000001444" target="_blank" rel="noopener">Balusu 2026</a> ; <a href="https://doi.org/10.1136/bcr-2022-252047" target="_blank" rel="noopener">Tasos 2022</a>.</p></section>
<section class="ilot" id="e56-6"><h2><span class="n">6</span>Interroger</h2><p>L’interrogatoire cherche le terrain avant les symptômes, parce que la carence débutante est le plus souvent asymptomatique.</p>
<h3>Antécédents à rechercher</h3><p>Les antécédents utiles sont une maladie digestive ou biliaire connue, une chirurgie digestive ou <button class="w" data-k="e56-bariatrique">bariatrique</button>, une mucoviscidose, une insuffisance pancréatique, une cholestase, un régime très pauvre en graisses, un traitement antibiotique prolongé, un traitement anticoagulant et, chez l’enfant, des antécédents familiaux d’ataxie.</p>
<h3>Symptômes de la carence en vitamine E</h3><p>Les signes neurologiques sont troubles de l’équilibre et de la coordination, neuropathie périphérique et faiblesse musculaire. Ils s’installent lentement et progressivement. La carence de l’adulte malabsorbant est asymptomatique en début d’évolution. D’autres atteintes existent : rétinite pigmentaire et dégénérescence maculaire dans l’ataxie avec carence en vitamine E et dans l’abêtalipoprotéinémie, anémie hémolytique, et, selon le guide de la mucoviscidose, atteinte rétinienne et déficits cognitifs.</p>
<h3>Symptômes de la carence en vitamine K</h3><p>Le symptôme cardinal est une tendance hémorragique avec temps de prothrombine allongé. Chez le nourrisson atteint de mucoviscidose, une hémorragie intracrânienne a été décrite. Chez l’adulte, des hémorragies graves ont été rapportées : un hémopéricarde avec tamponnade et une coagulopathie sévère de la cachexie. Des effets extra-hémostatiques (mauvais développement osseux, ostéoporose, risque cardiovasculaire accru) sont associés à un bas statut en vitamine K, mais l’association n’établit pas la causalité.</p>
<h3>Deux présentations, deux cas</h3><div class="two"><div class="card"><h4>Forme neurologique (vitamine E)</h4><p>Un adolescent de 16 ans présente depuis des mois une démarche instable, une dysarthrie et une baisse de la sensibilité vibratoire. Les réflexes sont diminués. La présentation évoque une ataxie de Friedreich, et un dosage de l’α-tocophérol, qui montre une valeur effondrée, redirige le diagnostic vers l’ataxie avec carence en vitamine E.</p></div><div class="card"><h4>Forme hémorragique (vitamine K)</h4><p>Une femme de 38 ans, atteinte d’une maladie cœliaque, présente des ecchymoses sans traumatisme et des selles grasses. Le temps de prothrombine est allongé. L’injection de vitamine K le corrige et confirme la carence.</p></div></div><div class="trap"><span class="k">Cas rapporté</span> Un cas norvégien d’ataxie avec carence en vitamine E s’est installé dès 5 ans, avec un steppage bilatéral, un signe de Babinski, une dysarthrie et une épilepsie précoce. Le traitement, débuté 25 ans après le début, a stabilisé l’état sans récupération : un retard de diagnostic laisse des séquelles.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, §24.3 et §25.3</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10923111/" target="_blank" rel="noopener">Traber 2024</a> ; <a href="https://doi.org/10.1007/s10072-010-0261-1" target="_blank" rel="noopener">Di Donato 2010</a> ; <a href="https://doi.org/10.1136/bcr.01.2011.3728" target="_blank" rel="noopener">Müller et Bekkelund 2011</a> ; <a href="https://doi.org/10.1136/bcr-2022-252047" target="_blank" rel="noopener">Tasos 2022</a>.</p><button class="pareto-btn ui" data-k="pareto-e56-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
