<template data-pop="e56-sources-guides" data-title="Sources et niveau de preuve"><h3>Ce que chaque source apporte</h3><p>La directive ESPEN sur les micronutriments (2022) donne les seuils, les dosages et les apports en nutrition artificielle, avec des grades de recommandation. Le guide ESPEN-ESPGHAN-ECFS (2016) fixe les cibles et les doses dans la mucoviscidose. La prise de position de l’ESPGHAN (2016) porte sur la prophylaxie néonatale. La société allemande de nutrition (DGE) publie des apports de référence pour la population générale.</p><h3>Limites</h3><p>Aucune recommandation suisse spécifique sur la carence en vitamine E ou K de l’adulte n’a été trouvée. Les chiffres suisses viennent de la surveillance de la prophylaxie néonatale et des informations professionnelles Swissmedic. Une revue par intelligence artificielle ne remplace pas une validation médicale humaine.</p><p class="src">Sigles : ESPEN pour la société européenne de nutrition clinique et de métabolisme ; ECFS pour la société européenne de mucoviscidose.</p></template>
<template data-pop="e56-vite-formes" data-title="Vitamine E : formes, équivalences et rôle"><h3>Mécanisme et définition</h3><p>La vitamine E est le 2R-α-tocophérol selon l’autorité européenne de sécurité des aliments. L’α-tocophérol est le principal antioxydant liposoluble des membranes ; les autres tocophérols et les tocotriénols sont catabolisés et excrétés plus vite.</p><h3>Équivalences</h3><table class="t"><tr><th>Forme</th><th>Équivalence</th></tr><tr><td>d-α-tocophérol naturel</td><td>1 unité internationale = 0,67 mg</td></tr><tr><td>dl-α-tocophérol synthétique</td><td>1 unité internationale = 0,9 mg</td></tr><tr><td>RRR contre all-rac</td><td>1 mg de RRR = 2 mg d’all-rac, en activité</td></tr><tr><td>Mucoviscidose (ECFS)</td><td>1 mg = 1,49 unité internationale</td></tr></table><p>Cette différence entre formes explique que les doses en unités internationales et en milligrammes ne se comparent pas sans connaître la forme. Les posologies de ce chapitre sont données dans l’unité de leur source.</p></template>
<template data-pop="e56-vitk-formes" data-title="Vitamine K : K1, K2, K3"><p>La vitamine K1, ou phylloquinone, provient des plantes. La vitamine K2 regroupe les ménaquinones (de MK-2 à MK-14), synthétisées par le microbiote et présentes dans les aliments fermentés et les produits animaux. La vitamine K3, ou ménadione, est une provitamine de synthèse, toxique.</p><p>La demi-vie plasmatique de la phylloquinone est d’environ 70 heures, et les réserves sont courtes. Les apports de référence de la société allemande de nutrition se situent à 60–80 µg par jour selon le sexe et l’âge.</p></template>
<template data-pop="e56-codes" data-title="Sous-codes E56 et exclusions"><p>La page de classification précise que E56.1 exclut D68.4 (carence acquise en facteurs de la coagulation) et P53 (maladie hémorragique du fœtus et du nouveau-né). E56.8 et E56.9 ne portent ni inclusion ni exclusion. Aucune source lue ne précise quelles vitamines E56.8 regroupe.</p><p>Conséquence pratique : un trouble de la coagulation de l’adulte par déficit en facteurs se discute avec D68.4, et l’hémorragie du nouveau-né se code P53 ; le code retenu dépend donc du tableau clinique et de la règle de codage locale.</p></template>
<template data-pop="e56-unites" data-title="Convention d’unités"><p>Les deux vitamines se mesurent en unités différentes. Le µ de microgramme ou de micromole peut être mal restitué par l’extraction d’un document : le contexte fixe la lecture.</p><ul><li>α-tocophérol : 1 mg/dL = 23,22 µmol/L ; normal d’environ 20 à 30 µmol/L.</li><li>Vitamine K : les apports se lisent en µg (60–80 µg par jour selon la société allemande de nutrition).</li><li>Mucoviscidose : le seuil de vitamine E du guide ECFS 2016 est lu comme 300 µg/dL ; la lecture reste à confirmer sur l’original.</li></ul></template>
<template data-pop="e56-tp-test" data-title="Temps de prothrombine et test thérapeutique"><h3>Mécanisme</h3><p>Le temps de prothrombine explore la voie dépendante des facteurs II, VII et X. Un déficit en vitamine K produit des facteurs inactifs et allonge ce temps.</p><h3>Test thérapeutique</h3><p>La carence se confirme par la correction du temps de prothrombine sous vitamine K. Dans une cohorte de 292 patients, la carence était définie par une baisse de l’INR d’au moins 0,5 après vitamine K.</p><h3>Limites</h3><p>Le temps de prothrombine est peu sensible et peu spécifique : il ne s’allonge qu’en carence sévère. Un traitement par antivitamine K donne le même résultat.</p></template>
<template data-pop="e56-pivka" data-title="PIVKA-II"><p>La PIVKA-II est la prothrombine sous-carboxylée. Elle est produite par le foie lorsque la vitamine K manque. C’est un marqueur homéostatique sensible de la carence hépatique infraclinique ; un immunodosage automatisé existe. Elle est plus sensible et plus spécifique que les tests de coagulation.</p><p>Elle est élevée aux soins intensifs. La supplémentation améliore le statut sans le normaliser complètement. Chez le dialysé, la ménaquinone-7 a abaissé la PIVKA-II sans activer la coagulation.</p></template>
<template data-pop="e56-fii" data-title="Rapport FII/FIIE"><p>Le facteur II est mesuré une première fois par un réactif de temps de prothrombine (FII), puis par l’écarine (FIIE), qui ne détecte que la forme active. Un rapport inférieur à 0,86 évoque une carence en vitamine K (sensibilité 47,7 %, spécificité 90,2 %) et prédit la réponse à la vitamine K.</p><p>Limite : ce rapport s’observe aussi chez 16 % des patients avec un déficit en facteurs non vitamine K-dépendants. Le facteur FIIE bas est souvent associé à une hépatopathie active.</p></template>
<template data-pop="e56-gla" data-title="Carboxylation des protéines"><p>La γ-glutamyl-carboxylase convertit des résidus glutamate en résidus γ-carboxyglutamate (Gla). Ces résidus fixent le calcium, condition de l’activité biologique de la protéine. Les facteurs II, VII, IX et X, les protéines C, S, Z et M en dépendent, de même que des protéines osseuses et vasculaires (ostéocalcine, protéine Gla de la matrice, Gas6, périostine).</p><p>Les effets extra-hémostatiques associés à un bas statut (os, système cardiovasculaire) restent des associations, sans causalité démontrée.</p></template>
<template data-pop="e56-attp" data-title="Protéine de transfert de l’α-tocophérol"><p>Dans l’hépatocyte, l’α-TTP récupère l’α-tocophérol nouvellement absorbé et le transfère aux VLDL et aux HDL naissantes. Elle est le principal déterminant de la concentration plasmatique. Son absence entraîne une élimination de la vitamine et l’ataxie avec carence en vitamine E.</p></template>
<template data-pop="e56-tpgs" data-title="Succinate de tocophérol-polyéthylène glycol (TPGS)"><p>Le TPGS est une forme hydrosoluble de vitamine E qui forme elle-même des micelles. Il est utile en cholestase, où l’absence de bile empêche la micellisation de la forme liposoluble. Le guide de la mucoviscidose le cite pour l’absorption chez les patients cholestatiques.</p></template>
<template data-pop="e56-neonat" data-title="Pourquoi le nouveau-né est à risque"><p>La vitamine K franchit mal le placenta, l’intestin est stérile à la naissance et le lait maternel en contient peu. Le nourrisson allaité est donc à risque. La prophylaxie suisse repose sur trois doses de 2 mg de Konakion MM par voie orale (4e heure, 4e jour, 4e semaine). Neuf cas pour 505 708 naissances vivantes ont été recensés de 2018 à 2024.</p></template>
<template data-pop="e56-bariatrique" data-title="Chirurgie bariatrique"><p>Les directives suisses (SMOB, 2023) demandent des multivitamines à long terme, à vie après une chirurgie malabsorptive, et un bilan annuel comprenant la coagulation (INR) et le statut vitaminique. Toute carence avérée est traitée et le succès du traitement est vérifié.</p></template>
<template data-pop="e56-signe-neuro" data-title="Signes neurologiques de la carence en vitamine E"><h3>Ce qu’on cherche</h3><p>Ataxie de la marche et des membres, dysarthrie, hyporéflexie, baisse de la sensibilité vibratoire, faiblesse musculaire. Dans les formes avancées, steppage et signe de Babinski.</p><h3>Pourquoi</h3><p>La peroxydation des membranes atteint les neurones sensitifs et cérébelleux. L’atteinte est progressive et s’installe sur plusieurs années.</p><h3>Pièges</h3><p>L’ataxie de Friedreich présente une ressemblance souvent frappante. Un examen normal n’exclut pas une carence débutante.</p></template>
<template data-pop="e56-signe-hemo" data-title="Signes hémorragiques de la carence en vitamine K"><p>Tendance hémorragique avec temps de prothrombine allongé. Chez l’adulte, des hémorragies profondes ont été rapportées : hémopéricarde avec tamponnade, coagulopathie sévère de la cachexie. Chez le nourrisson avec mucoviscidose, une hémorragie intracrânienne a été décrite.</p><p>Un saignement qui n’est pas extériorisé n’est pas un saignement mineur : l’examen doit en tenir compte.</p></template>
<template data-pop="e56-mnemo" data-title="Aide mnémotechnique"><p><b>Aide pédagogique, non critère officiel.</b> E pour le système nerveux, K pour la coagulation : la carence en vitamine E s’installe lentement et se manifeste par une atteinte neurologique, la carence en vitamine K se manifeste par un saignement.</p></template>
