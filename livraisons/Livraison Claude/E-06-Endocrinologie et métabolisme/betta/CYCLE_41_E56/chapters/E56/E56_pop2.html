<template data-pop="e56-d-ephynal" data-title="Ephynal®"><h3>Mécanisme et indications</h3><p>Acétate d’int-rac-α-tocophéryle, capsules à 300 mg (300 unités internationales ; code ATC A11HA03). Prévention de la carence par malabsorption (insuffisance pancréatique exocrine, cholestase, atrésie des voies biliaires, intestin court), abêtalipoprotéinémie, neuropathie par carence.</p><h3>Posologie</h3><p>Malabsorption : 1 capsule par jour. Abêtalipoprotéinémie et neuropathie : 1 à 2 capsules par jour. À prendre avec un repas gras.</p><h3>Précautions</h3><p>Sécurité non étudiée chez l’enfant. Renforce l’effet des anticoagulants à fortes doses. Le fer oral réduit son absorption. Information professionnelle mise à jour en octobre 2022.</p></template>
<template data-pop="e56-d-burgerstein" data-title="Burgerstein Vitamine E®"><p>RRR-α-tocophérol, 100 unités internationales (67,1 mg) ou 400 unités internationales (268,4 mg). Indiqué dans la prévention de la carence par trouble de l’absorption. Contre-indiqué en cas d’allergie au soja ou à l’arachide. Même précaution avec les anticoagulants et le fer oral. Information professionnelle mise à jour en mai 2023.</p></template>
<template data-pop="e56-d-konakion" data-title="Konakion® MM et Konakion® MM paediatric"><h3>Mécanisme</h3><p>Phytoménadione en micelles mixtes (code ATC B02BA01 ; autorisation 48112). Cocarboxylase : participe à la formation de la prothrombine, des facteurs VII, IX et X et des protéines C et S.</p><h3>Indications et posologie</h3><p>Hypoprothrombinémie, antidote des anticoagulants de type dicoumarol, maladie hémorragique du nouveau-né. Konakion MM paediatric : 2 mg pour 0,2 ml, voie orale, intraveineuse ou intramusculaire. Traitement du nouveau-né : 1 mg par voie intraveineuse, puis selon la clinique et la coagulation. Prophylaxie : voir l’îlot 12.</p><h3>Précautions</h3><p>Biodisponibilité orale d’environ 50 %, inadaptée en cholestase ou malabsorption. Les dicoumariniques s’opposent à l’effet ; les anticonvulsivants peuvent l’entraver. Risque d’ictère nucléaire chez le prématuré de moins de 2,5 kg en injection intraveineuse rapide. Les erreurs de dose d’un facteur 10 sont fréquentes. Aucune hypervitaminose K1 n’est connue. Posologie adulte non sourcée dans ce dossier. Information professionnelle de janvier 2022.</p></template>
<template data-pop="e56-d-pcc" data-title="Concentré de complexe prothrombinique"><p>Les concentrés à quatre facteurs (II, VII, IX, X) sont autorisés dans le déficit acquis en facteurs vitamine K-dépendants. Ils apportent immédiatement les facteurs, alors que la vitamine K met 6 à 12 heures par voie intraveineuse. Une revue narrative de vingt ans d’utilisation d’Octaplex et de Balfaxar rapporte cet usage.</p></template>
<template data-pop="e56-d-menadione" data-title="Ménadione (vitamine K3)"><p>Provitamine de synthèse, très toxique : ictère, hémolyse, ictère nucléaire du nourrisson. Elle n’est plus disponible. Le guide de la mucoviscidose préfère la vitamine K1 aux sels de ménadione.</p></template>
<template data-pop="pareto-e56-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="e56-0,e56-1,e56-2,e56-3,e56-4,e56-5,e56-6"></p><ul><li>Les deux vitamines sont liposolubles : toute malabsorption des graisses, de la bile ou du pancréas menace les deux.</li><li>La vitamine E protège les membranes : la carence se traduit par une neuropathie sensitive progressive et une ataxie, sur des années.</li><li>La vitamine K active les protéines de la coagulation : la carence se traduit par un saignement avec temps de prothrombine allongé.</li><li>Les réserves de vitamine K sont courtes (demi-vie plasmatique d’environ 70 heures) ; celles de vitamine E sont longues (plus de cinq ans avant les symptômes chez l’adulte).</li><li>E56.8 reste non précisé dans les sources lues.</li></ul></template>
<template data-pop="pareto-e56-diag" data-title="Pareto — Examen et diagnostic"><p class="ratio" data-cover="e56-7,e56-8"></p><ul><li>L’examen est souvent normal en début de carence.</li><li>Aucun critère formel : critères opérationnels sourcés.</li><li>Vitamine E : α-tocophérol rapporté aux lipides. Vitamine K : correction du temps de prothrombine, PIVKA-II, FII/FIIE.</li><li>Différentiel : ataxie de Friedreich, hépatopathie, antivitamine K.</li></ul></template>
<template data-pop="pareto-e56-ttt" data-title="Pareto — Urgences, traitement et prophylaxie"><p class="ratio" data-cover="e56-9,e56-10,e56-11,e56-12"></p><ul><li>Hémorragie : vitamine K plus concentré de facteurs ou transfusion.</li><li>Vitamine E : 100 mg par jour au départ, jusqu’à environ 1 000 mg par jour dans l’ataxie génétique, limite supérieure de sécurité 1 000 mg par jour.</li><li>Vitamine K : 1 à 10 mg par jour dans la mucoviscidose de l’adulte ; 150 µg par jour en nutrition parentérale.</li><li>Prophylaxie suisse néonatale : 3 × 2 mg par voie orale.</li></ul></template>
<template data-pop="pareto-e56-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="e56-13,e56-14"></p><ul><li>Mucoviscidose : vitamine E au moins une fois par an.</li><li>Après chirurgie bariatrique : INR annuel et statut vitaminique.</li><li>Sous antivitamine K : surveiller toute modification d’apport en vitamine K.</li><li>Critères : α-tocophérol inférieur à 12 µmol/L ; phylloquinone inférieure à 0,15 µg/L ; temps de prothrombine corrigé par la vitamine K.</li></ul></template>
<template data-pop="pareto-e56-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e56-e-1,e56-e-2,e56-e-3,e56-e-4"></p><ul><li>Gold standard de la vitamine E : α-tocophérol plasmatique par chromatographie, rapporté aux lipides.</li><li>Pas de standard pour la vitamine K : combiner plusieurs biomarqueurs.</li><li>Piège : lipides et α-tocophérol bas donnent un rapport normal.</li><li>Un temps de prothrombine normal n’exclut pas la carence.</li></ul></template>
<template data-pop="pareto-e56-sci-phys" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e56-s-phys-body"></p><ul><li>Voie de la graisse : bile, pancréas, entérocyte, chylomicrons.</li><li>Chaque étape correspond à une cause de carence.</li></ul></template>
<template data-pop="pareto-e56-sci-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e56-s-bioc-body"></p><ul><li>Vitamine E : antioxydant. Vitamine K : cofacteur de la carboxylase.</li><li>PIVKA : formes inactives.</li></ul></template>
<template data-pop="pareto-e56-sci-neuro" data-title="Pareto — Neurologie cellulaire"><p class="ratio" data-cover="e56-s-neuro-body"></p><ul><li>Peroxydation, lipofuscine, neuropathie sensitive, ataxie.</li><li>L’atteinte installée régresse mal.</li></ul></template>
<template data-pop="pareto-e56-sci-gen" data-title="Pareto — Génétique"><p class="ratio" data-cover="e56-s-gen-body"></p><ul><li>Gènes TTPA, MTTP, SAR1B, apolipoprotéine B ; transmission autosomique récessive.</li></ul></template>
<template data-pop="pareto-e56-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e56-p-1,e56-p-2,e56-p-3,e56-p-4,e56-p-5"></p><ul><li>Choisir la forme selon le mécanisme du défaut.</li><li>Interactions : vitamine E et anticoagulants, vitamine K et antivitamines K, fer oral.</li><li>À éviter : ménadione, voie orale en cholestase, injection intraveineuse rapide chez le prématuré.</li></ul></template>
