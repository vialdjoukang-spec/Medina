<template data-pop="e58-d-aliments" data-title="Aliments riches ou enrichis en calcium"><h3>Place</h3><p>L’alimentation est le premier moyen : deux à trois portions de produits laitiers par jour. Les personnes sans produits laitiers doivent couvrir leurs besoins par d’autres aliments, dont les boissons de soja enrichies en calcium.</p><h3>Preuves</h3><p>Dans un essai en EMS, des produits laitiers portant l’apport de 700 à 1142 mg/jour ont réduit les fractures de 33 % et les fractures de hanche de 46 %. Pour le rachitisme, le calcaire et le poisson moulu ont donné des guérisons semblables au carbonate de calcium.</p><h3>Limites</h3><p>La teneur d’une boisson enrichie dépend du produit ; elle se lit sur l’étiquette. Les substituts non enrichis n’ont pas la valeur nutritive des produits laitiers.</p><p class="src">Références : <a href="https://www.sge-ssn.ch/media/4sintpm3/recommandations-nutritionnelles_version-longue_f.pdf" target="_blank" rel="noopener">SSN et OSAV 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11499541/" target="_blank" rel="noopener">Rizzoli et Chevalley 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a>.</p></template>
<template data-pop="e58-d-vitd" data-title="Vitamine D (cholécalciférol) : mécanisme, preuves, posologie, tolérance"><h3>Mécanisme</h3><p>La vitamine D3 est hydroxylée dans le foie (25-hydroxyvitamine D) puis dans le rein (calcitriol). Elle augmente l’absorption intestinale du calcium, mobilise le calcium osseux et diminue son élimination rénale.</p><h3>Preuves</h3><p>Dans le rachitisme, le consensus 2016 recommande au moins 2000 UI/jour pendant au moins 3 mois, avec calcium à 500 mg/jour. Seule, elle a guéri 19 % (Nigeria) et 15,7 % (Inde) des enfants carencés en calcium.</p><h3>Posologie</h3><p>Moins de 3 mois : 2000 UI/jour pendant 90 jours, puis 400 UI/jour. De 3 à 12 mois : 2000 UI/jour, ou dose unique de 50 000 UI, puis 400 UI/jour. De 12 mois à 12 ans : 3000 à 6000 UI/jour, ou 150 000 UI en dose unique, puis 600 UI/jour. Au-delà de 12 ans : 6000 UI/jour ou 300 000 UI, puis 600 UI/jour. Un microgramme équivaut à 40 UI.</p><h3>Tolérance et limites</h3><p>La monographie suisse du Calcimagon-D3 contre-indique l’hypervitaminose D. Les effets indésirables de la vitamine D seule à ces doses ne sont pas détaillés dans les sources lues ; la réévaluation à 3 mois et la surveillance de la calcémie et de la calciurie s’imposent.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; information professionnelle Calcimagon-D3.</p></template>
<template data-pop="e58-d-carbonate" data-title="Carbonate de calcium : mécanisme, preuves, posologie, tolérance"><h3>Mécanisme</h3><p>Le carbonate de calcium contient 40 % de calcium élément (500 mg de carbonate = 200 mg de calcium élément). Le calcium absorbé corrige l’apport et réduit l’élévation de la PTH.</p><h3>Preuves</h3><p>Chez l’enfant dont l’apport habituel est inférieur à 300 mg/jour, 1000 mg/jour est la dose optimale ; 2000 mg n’améliore pas significativement l’absorption totale ; certains enfants ont eu besoin de plus de 24 semaines pour guérir. Le consensus recommande le calcium à 500 mg/jour avec la vitamine D et note que le carbonate de calcium est très bon marché.</p><h3>Indication suisse</h3><p>Le carbonate de calcium Salmon Pharma 500 mg (Swissmedic) a pour indication l’hyperphosphatémie de l’insuffisance rénale chronique ; il n’est pas le traitement de E58 en Suisse. Aucune information professionnelle suisse pédiatrique de calcium seul pour le rachitisme n’a été lue.</p><h3>Tolérance</h3><p>Les effets du calcium oral (hypercalcémie, hypercalciurie, troubles digestifs) sont décrits à la monographie du Calcimagon-D3.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6019962/" target="_blank" rel="noopener">Thandrayen et Pettifor 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC4880117/" target="_blank" rel="noopener">Munns et al. 2016</a> ; information professionnelle Carbonate de calcium Salmon Pharma 500 mg (Swissmedic, 15.10.2026).</p></template>
<template data-pop="e58-d-calcimagon" data-title="Calcimagon-D3 : mécanisme, preuves, posologie, effets indésirables, contre-indications, surveillance"><h3>Composition</h3><p>Calcimagon-D3 : 500 mg de calcium élément et 400 UI de vitamine D3 par comprimé. Calcimagon-D3 Forte : 1000 mg et 800 UI. Calcimagon-D3 500/800 : 500 mg et 800 UI. Titulaire : Cheplapharm Schweiz ; Swissmedic n° 53929 ; information consultée le 15.10.2026.</p><h3>Indication et mécanisme</h3><p>Traitement et prévention des carences en vitamine D et en calcium chez le patient âgé ; soutien de la prévention et du traitement de l’ostéoporose. En cas de carence en calcium, l’apport de calcium et de vitamine D réduit la hausse de la PTH, secondaire au déficit et responsable de l’augmentation de la résorption osseuse.</p><h3>Preuves</h3><p>3270 sujets hospitalisés de 84 ± 6 ans, vitamine D 800 UI et calcium 1200 mg par jour pendant 18 mois : 80 fractures de hanche contre 110 dans l’autre groupe (p = 0,004).</p><h3>Posologie</h3><p>Adulte : 1 à 2 comprimés de 500/400, ou 1 comprimé de Forte ou de 500/800, par jour. Non destiné aux moins de 18 ans. Grossesse en cas de carence : sans dépasser 1500 mg de calcium et 600 UI de vitamine D3 par jour. L’apport alimentaire existant est évalué avant de choisir la dose.</p><h3>Effets indésirables</h3><p>Occasionnels : hypercalcémie, hypercalciurie. Rares : constipation, dyspepsie, flatulence, nausées. Très rare : syndrome des buveurs de lait et d’alcalins (syndrome de Burnett) en cas de surdosage associé à une alcalose.</p><h3>Contre-indications</h3><p>Hypercalcémie, hypercalciurie, lithiase, hypervitaminose D, insuffisance rénale, hyperphosphatémie, hyperparathyroïdie primaire, traitement par calcitriol, plasmocytome, métastases osseuses, immobilisation prolongée avec hypercalciurie ou hypercalcémie.</p><h3>Surveillance</h3><p>En traitement prolongé à forte dose ou en insuffisance rénale légère : calcium sérique et urinaire. Si la calciurie dépasse 7,5 mmol/24 heures (300 mg/24 heures), réduire ou suspendre.</p><h3>Interactions</h3><p>Voir la fenêtre des délais de prise : tétracyclines, quinolones, lévothyroxine, bisphosphonates, fer, zinc, fluorure, ranélate de strontium, digitaliques, thiazidiques.</p><p class="src">Référence : information professionnelle suisse Calcimagon-D3 / Forte / 500/800 (Swissmedic n° 53929, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e58-d-sandoz" data-title="Calcium D3 Sandoz : indication, posologie, contre-indication"><h3>Composition et indication</h3><p>Calcium D3 Sandoz existe en dosages 500/440 et 1000/880 (calcium en mg / cholécalciférol en UI). Titulaire : Sandoz Pharmaceuticals ; Swissmedic n° 60088 ; information mise à jour en décembre 2022. Indication : complément calcique et vitaminique D chez la personne âgée carencée ou à risque élevé de carence, par exemple en cas de consommation insuffisante de produits laitiers.</p><h3>Posologie</h3><p>Adulte : 500 à 1000 mg de calcium et 440 à 880 UI de cholécalciférol par jour, en tenant compte de l’alimentation et de l’exposition solaire.</p><h3>Limites</h3><p>La préparation est contre-indiquée avant 18 ans. Seule la section de l’information professionnelle consacrée à l’indication et à la posologie a été lue ; les contre-indications, interactions et effets indésirables détaillés sont décrits ici à la monographie du Calcimagon-D3, dont la logique pharmacologique est la même, sans que l’identité des textes soit affirmée. Statut de remboursement non vérifié.</p><p class="src">Référence : information professionnelle Calcium D3 Sandoz, Swissmedic n° 60088, décembre 2022.</p></template>
<template data-pop="e58-svgo" data-title="SVGO 2020 : place du calcium dans la prévention de l’ostéoporose"><h3>Source</h3><p>Recommandations 2020 pour le traitement de l’ostéoporose selon le risque de fracture, publiées par l’association suisse contre l’ostéoporose (SVGO) dans Swiss Medical Weekly 150:w20352 ; texte intégral lu.</p><h3>Contenu utile ici</h3><p>Risque fracturaire faible : hygiène de vie, vitamine D 800–1000 UI/jour, calcium 500–1000 mg/jour si nécessaire, DXA après 5 à 10 ans ou si le risque clinique augmente.</p><h3>Interprétation et limites</h3><p>Le texte vise l’ostéoporose, non la carence alimentaire en calcium (E58). Il établit que, en Suisse, le calcium d’appoint est conditionnel et non systématique ; la quantité à ajouter se déduit de l’apport alimentaire mesuré.</p><p class="src">Référence : Swiss Med Wkly 2020;150:w20352.</p></template>
<template data-pop="e58-profiles" data-title="PROFILES : situations de départ rattachées à E58"><h3>Cadre</h3><p>PROFILES (Principal Objectives and Framework for Integrated Learning and Education in Switzerland) est le catalogue d’objectifs de la commission des facultés de médecine suisses, repris pour l’examen fédéral. Une « SSP » est une situation de départ.</p><h3>Situations rattachées</h3><p>Directement : 16 (perte de poids, malnutrition, perte d’appétit), 138 (cachexie et malnutrition), 170 (carences nutritionnelles). Par la clinique : 83, 85, 105, 169, 184.</p><h3>Limite</h3><p>Le rattachement de chaque situation à E58 est celui du dossier de recherche ; la section PROFILES a été lue, non le texte complet.</p><p class="src">Référence : PROFILES, commission mixte des facultés de médecine suisses.</p></template>
<template data-pop="e58-d-gluconate" data-title="Gluconate de calcium intraveineux : mécanisme, posologie, risques"><h3>Mécanisme et indication</h3><p>Il élève rapidement la calcémie. Il est indiqué dans l’hypocalcémie sévère (calcium corrigé inférieur à 1,9 mmol/l) ou symptomatique de l’adulte.</p><h3>Posologie</h3><p>Bolus : 10 à 20 ml de gluconate de calcium à 10 % dans 50 à 100 ml de glucose à 5 %, en 10 minutes, sous ECG, à répéter jusqu’à disparition des symptômes. Relais : 100 ml (10 ampoules) dans 1 l de NaCl 0,9 % ou de glucose à 5 %, à 50 à 100 ml/heure, titré jusqu’à la normocalcémie.</p><h3>Effets indésirables et précautions</h3><p>Thrombophlébite, cardiotoxicité, hypotension, goût métallique, bouffées de chaleur, nausées. ECG continu en cas d’arythmie ou de digoxine. Éviter les grands volumes en insuffisance rénale terminale ou sous dialyse.</p><h3>Limite</h3><p>Posologie issue d’une recommandation britannique pour l’adulte ; aucune information professionnelle suisse trouvée (AIPS).</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a>.</p></template>
<template data-pop="e58-d-chlorure" data-title="Chlorure de calcium"><p>Le chlorure de calcium est une alternative au gluconate, plus irritante pour les veines ; il ne s’administre que par voie centrale. Les sources lues ne donnent ni dose ni information professionnelle suisse pour ce produit.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5314808/" target="_blank" rel="noopener">Society for Endocrinology 2016</a>.</p></template>
<template data-pop="pareto-e58-clin" data-title="Pareto — Notions, physiopathologie et clinique"><p class="ratio" data-cover="e58-0,e58-1,e58-2,e58-3,e58-4,e58-5,e58-6"></p><ul><li>E58 désigne un apport alimentaire insuffisant en calcium ; chez l’enfant de plus de 12 mois, moins de 300 mg/jour est une carence et 300 à 500 mg/jour une insuffisance. Aucun seuil adulte n’est documenté.</li><li>Référence suisse : <button class="w" data-k="e58-valeurs-suisses">950 mg/jour chez l’adulte, 1150 mg/jour de 11 à 17 ans, 1000 à 1200 mg/jour après 65 ans</button>, sans majoration en grossesse. Deux à trois portions laitières par jour ; 2 dl de lait apportent environ 240 mg.</li><li>La carence élève la PTH, donc le calcitriol ; la calcémie est défendue en puisant dans l’os, ce qui freine la minéralisation. Le rachitisme est calcique, vitaminique ou mixte.</li><li>Causes : éviction des produits laitiers, boissons végétales non adaptées, diversification tardive, phytates et oxalates, corticoïdes et diurétiques de l’anse, grand âge.</li><li>L’anamnèse de l’apport est le standard de référence de la carence ; elle cherche aussi les symptômes d’hypocalcémie.</li></ul></template>
<template data-pop="pareto-e58-diag" data-title="Pareto — Examen, diagnostic et urgences"><p class="ratio" data-cover="e58-7,e58-8,e58-9"></p><ul><li>Signes de l’enfant : poignets et chevilles élargis, chapelet costal, genu varum, craniotabès. Hypocalcémie de l’adulte : paresthésies, Chvostek, Trousseau, tétanie, QT allongé.</li><li>Diagnostic : anamnèse, examen, biologie, <button class="w" data-k="e58-radio">radiographie de confirmation</button>. La biologie seule ne désigne pas la cause ; la carence combinée est fréquente.</li><li>Éliminer les autres causes d’hypocalcémie (thyroïdectomie, hypomagnésémie) et la carence en vitamine D (E55).</li><li>Calcium corrigé inférieur à 1,9 mmol/l ou symptômes : <button class="w" data-k="e58-urgence-bolus">gluconate de calcium à 10 %, 10 à 20 ml en 10 minutes sous ECG</button>.</li></ul></template>
<template data-pop="pareto-e58-trait" data-title="Pareto — Traitement, suivi et critères"><p class="ratio" data-cover="e58-10,e58-11,e58-12,e58-13,e58-14"></p><ul><li>Enfant : calcium 500 mg/jour avec vitamine D à au moins 2000 UI/jour pendant au moins 3 mois ; réévaluation à 3 mois. La vitamine D seule échoue quand la carence calcique domine.</li><li>Adulte : alimentation d’abord ; <button class="w" data-k="e58-d-calcimagon">Calcimagon-D3</button> si nécessaire (500 mg et 400 UI par comprimé) ; calcium d’appoint conditionnel selon la <button class="w" data-k="e58-svgo">SVGO</button> ; contre-indications et délais de prise à respecter.</li><li>Surveiller calcémie et calciurie ; réduire ou suspendre si la calciurie dépasse 7,5 mmol/24 heures.</li><li>Terrains : végane sans supplément, nourrisson, grossesse sans majoration, sujet âgé en EMS.</li><li>Critères : apport inférieur à 300 mg/jour (enfant), radiographie pour le rachitisme, 25-hydroxyvitamine D inférieure à 30 nmol/l pour la carence vitaminique.</li></ul></template>
<template data-pop="pareto-e58-ex" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e58-e-1,e58-e-2,e58-e-3,e58-e-4"></p><ul><li>Anamnèse calcique, radiographie des poignets et des genoux, calcium corrigé, 25-hydroxyvitamine D : l’essentiel.</li><li>Carence calcique : calcium très bas, PTH et phosphatases alcalines élevées, calciurie basse, calcitriol élevé, 25-hydroxyvitamine D normale ou limite basse.</li><li>Carence en vitamine D : 25-hydroxyvitamine D souvent inférieure à 10–15 nmol/l. Rachitisme hypophosphatémique : phosphate bas, PTH normale.</li><li>Pas de dépistage de population.</li><li>Objectifs <button class="w" data-k="e58-profiles">PROFILES</button> : situations 16, 138 et 170.</li></ul></template>
<template data-pop="pareto-e58-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e58-s-physio-body"></p><ul><li>Intestin (absorption active saturable, dépendante du calcitriol), rein (réabsorption sous PTH) et os (réservoir) règlent le calcium.</li><li>Une entrée insuffisante fait payer l’os ; la calciurie baisse, le calcitriol monte.</li><li>La PTH élevée abaisse le phosphate ; le FGF23 freine la 1α-hydroxylase.</li></ul></template>
<template data-pop="pareto-e58-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e58-s-bioc-body"></p><ul><li>Vitamine D3 : 25-hydroxylation hépatique, puis 1α-hydroxylation rénale stimulée par la PTH.</li><li>Oxalates et phytates piègent le calcium ; délai de 2 heures pour le supplément.</li><li>Calcium et phosphate doivent tous deux être disponibles pour minéraliser.</li></ul></template>
<template data-pop="pareto-e58-s-histo" data-title="Pareto — Histologie osseuse"><p class="ratio" data-cover="e58-s-histo-body"></p><ul><li>Rachitisme : plaque de croissance et ostéoïde. Ostéomalacie : os constitué.</li><li>Radiographie : plaque élargie, métaphyses en cupule, ostéopénie.</li><li>Les signes cliniques de l’enfant sont la traduction de la même lésion.</li></ul></template>
<template data-pop="pareto-e58-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e58-p-1,e58-p-2,e58-p-3,e58-p-4,e58-p-5"></p><ul><li>Alimentation d’abord ; calcium et vitamine D associés ; gluconate de calcium intraveineux pour l’hypocalcémie sévère.</li><li>Doses : enfant 500 mg/jour de calcium ; adulte Calcimagon-D3 selon le comprimé ; grossesse au plus 1500 mg de calcium par jour.</li><li>Espacer le calcium des tétracyclines, quinolones, lévothyroxine, bisphosphonates, fer, zinc ; prudence avec digitaliques et thiazidiques.</li><li>Contre-indications : hypercalcémie, hypercalciurie, lithiase, insuffisance rénale, hyperparathyroïdie primaire ; surveiller la calciurie.</li></ul></template>
<template data-pop="e58-sources" data-title="Sources lues et limites"><h3>Sources suisses</h3><p>Valeurs de référence de l’OSAV (juin 2022), recommandations nutritionnelles de la Société suisse de nutrition et de l’OSAV (2024), informations professionnelles Swissmedic du Calcimagon-D3, du carbonate de calcium Salmon Pharma (consultées le 15.10.2026) et de Calcium D3 Sandoz (décembre 2022), recommandations SVGO 2020 sur l’ostéoporose, objectifs PROFILES.</p><h3>Sources européennes et internationales</h3><p>Consensus mondial sur le rachitisme nutritionnel (2016, initié par l’ESPE), revue de Thandrayen et Pettifor (2018), recommandation de la Society for Endocrinology (2016), Rizzoli et Chevalley des HUG (2024), prise de position EAPC (2025), études sur les véganes (2023-2024), avis de l’EFSA sur le phosphore (2015).</p><h3>Lacunes</h3><p>Aucune recommandation de la Société suisse d’endocrinologie et de diabétologie ni article du Swiss Medical Forum sur ce sujet n’a pu être lu. L’avis EFSA 2015 sur le calcium n’était pas accessible. Il n’existe pas, dans les sources lues, de prévalence suisse, de critère diagnostique adulte ni d’information professionnelle suisse d’un calcium intraveineux ou pédiatrique. Les notes d’inclusion et d’exclusion de la CIM-10-GM pour E58 n’ont pas été lues.</p></template>
