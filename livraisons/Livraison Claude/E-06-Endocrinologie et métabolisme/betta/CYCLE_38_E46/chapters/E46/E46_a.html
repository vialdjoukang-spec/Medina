<template id="ch-E46"><div class="chap"><div class="chap-head"><div class="code">E 46 · Endocrinologie et métabolisme · Nutrition</div><h1>Malnutrition protéino-énergétique, sans précision</h1><span class="status">Cycle Betta 38 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la dénutrition</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e46-0">Question clinique</a></li><li><a href="#e46-1">Définition et place dans la CIM</a></li><li><a href="#e46-2">Diagnostic GLIM et gravité</a></li><li><a href="#e46-3">Fréquence en Suisse et conséquences</a></li><li><a href="#e46-4">Physiopathologie : du jeûne à l’inflammation</a></li><li><a href="#e46-5">Causes et facteurs de risque</a></li><li><a href="#e46-6">Anamnèse</a></li><li><a href="#e46-7">Examen clinique</a></li><li><a href="#e46-8">Démarche diagnostique et différentiel</a></li><li><a href="#e46-9">Urgence : le syndrome de renutrition</a></li><li><a href="#e46-10">Prise en charge nutritionnelle</a></li><li><a href="#e46-11">Prévenir et traiter le syndrome de renutrition</a></li><li><a href="#e46-12">Suivi, sortie et pronostic</a></li><li><a href="#e46-13">Situations particulières</a></li><li><a href="#e46-14">Critères officiels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="e46-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 78 ans, mesurant 1,58 m, est hospitalisée pour une pneumonie. Elle pèse 54 kg à l’admission ; elle en pesait 59 cinq mois plus tôt. Elle mange moins de la moitié de ses repas depuis dix jours. Ces valeurs sont pédagogiques ; elles servent à poser la question centrale du cours : comment reconnaître une dénutrition liée à la maladie, en mesurer la gravité, et la traiter sans provoquer une complication de la renutrition ?</p>
<p>Le calcul est simple. L’indice de masse corporelle est de <button class="w" data-k="e46-calcul">21,6 kg/m² (calcul détaillé)</button> et la perte de poids atteint 8,5 % en cinq mois. La perte de poids dépasse 5 % en six mois ; l’indice est inférieur à 22, seuil applicable après 70 ans ; la pneumonie est une maladie aiguë inflammatoire. Un critère phénotypique et un critère étiologique sont réunis : la dénutrition est établie, au stade modéré selon le <button class="w" data-k="e46-glim">consensus GLIM</button>.</p>
<p>Deux décisions s’imposent ensuite. La première est de planifier un soutien nutritionnel individualisé dans les 48 heures, car l’essai suisse <button class="w" data-k="e46-effort">EFFORT</button> a montré moins d’événements défavorables et une mortalité plus faible à 30 jours avec ce soutien. La seconde est de rechercher le risque de <button class="w" data-k="e46-sri">syndrome de renutrition</button> avant d’augmenter les apports, car un jeûne de dix jours expose à des chutes de phosphate, de potassium et de magnésium dès la reprise.</p>
<div class="key"><b>À retenir.</b> Une dénutrition se diagnostique par la rencontre d’un critère phénotypique (poids, indice, muscle) et d’un critère étiologique (apports, inflammation). Le traitement associe un soutien précoce et une prudence ciblée sur les premiers jours de renutrition.</div>
</section>

<section class="ilot" id="e46-1"><h2><span class="n">1</span>Définition et place dans la CIM</h2>
<p>La catégorie E46 de la CIM-10-GM 2024 désigne la <button class="w" data-k="e46-codage">malnutrition protéino-énergétique, sans précision</button>. Le libellé allemand de la classification est « Nicht näher bezeichnete Energie- und Eiweißmangelernährung ». Elle regroupe deux inclusions : la malnutrition sans autre précision et le trouble de l’équilibre protéino-énergétique sans autre précision. Elle n’a ni subdivision, ni exclusion propre.</p>
<p>E46 est donc une catégorie d’attente. Elle sert lorsque la dénutrition est documentée sans que sa sévérité soit précisée. Les catégories voisines du même bloc E40–E46 décrivent des formes pédiatriques tropicales ou des degrés de gravité. Cette leçon traite le cas le plus fréquent en médecine adulte suisse : la dénutrition liée à la maladie chez le patient hospitalisé ou ambulatoire.</p>
<p>La <button class="w" data-k="e46-bloc">note du bloc E40–E46</button> explique comment la classification gradue la dénutrition : par le poids, exprimé en écarts-types (ET) sous la moyenne d’une population de référence. Le tableau reprend les trois catégories de gravité et rappelle ce qui reste à E46.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé</th><th>Seuil de poids</th></tr></thead><tbody><tr><td>E43</td><td>Malnutrition protéino-énergétique grave, sans précision ; inclut l’œdème de famine</td><td>3 ET ou plus sous la moyenne</td></tr><tr><td>E44.0</td><td>Malnutrition protéino-énergétique modérée</td><td>2 à moins de 3 ET sous la moyenne</td></tr><tr><td>E44.1</td><td>Malnutrition protéino-énergétique légère</td><td>1 à moins de 2 ET sous la moyenne</td></tr><tr><td>E46</td><td>Malnutrition protéino-énergétique, sans précision</td><td>Sévérité non précisée</td></tr></tbody></table>
<p>Ce tableau classe, il ne diagnostique pas. La note du bloc précise qu’une perte de poids chez l’enfant ou chez l’adulte indique en général une malnutrition lorsque des mesures antérieures existent. Avec une seule mesure, le diagnostic repose sur des hypothèses et n’est pas définitif sans autres constatations cliniques ou biologiques. Lorsque le poids manque, la classification renvoie aux constatations cliniques.</p>
<p>Plusieurs situations sont exclues du bloc et codées ailleurs : les anémies nutritionnelles (D50–D53), les séquelles de malnutrition protéino-énergétique (E64.0), la malabsorption intestinale (K90.-), la cachexie due au VIH et le « slim disease » (B22). Le libellé français officiel de l’Office fédéral de la statistique est « Malnutrition protéino-énergétique, sans précision ».</p>
<p>Les définitions cliniques complètent la classification. La société européenne <button class="w" data-k="e46-cachexie">ESPEN</button> distingue la dénutrition liée à la maladie, avec ou sans inflammation, et la dénutrition sans maladie, par exemple liée à la faim. La sarcopénie et la fragilité sont des entités distinctes, souvent associées. La revue suisse de 2020 retient la définition suivante : un état résultant d’un défaut d’apport ou d’absorption de nutriments, qui modifie la composition corporelle et la masse cellulaire, diminue les fonctions physiques et mentales et aggrave l’évolution clinique.</p>
<div class="trap"><span class="k">Piège de codage</span> Le code ne remplace pas le diagnostic. Une patiente peut être cliniquement dénutrie au stade modéré par les critères GLIM sans que le dossier précise un écart-type ; le codage reste alors E46 tant que la sévérité n’est pas documentée de façon exploitable. Les règles nationales d’attribution entre E43, E44 et E46 n’ont pas été lues pour cette leçon : le manuel de codage suisse reste la référence à consulter.</div>
<div class="key"><b>À retenir.</b> E46 signifie dénutrition protéino-énergétique de sévérité non précisée. Une fois la gravité établie, le codage se déplace vers E43, E44.0 ou E44.1.</div>

<section class="ilot" id="e46-2"><h2><span class="n">2</span>Diagnostic GLIM et gravité</h2>
<p>Le consensus mondial <button class="w" data-k="e46-glim">GLIM</button> structure le diagnostic en deux temps. Un outil de dépistage validé repère d’abord le risque : la <button class="w" data-k="e46-nrs">NRS 2002</button>, le MNA-SF ou le MUST. Le diagnostic est ensuite posé chez les patients à risque, par la rencontre d’<b>au moins un critère phénotypique</b> et d’<b>au moins un critère étiologique</b>.</p>
<table class="t"><thead><tr><th>Famille</th><th>Critère</th><th>Seuil</th></tr></thead><tbody><tr><td>Phénotype</td><td>Perte de poids involontaire</td><td>Plus de 5 % en 6 mois, ou plus de 10 % au-delà de 6 mois</td></tr><tr><td>Phénotype</td><td>Indice de masse corporelle bas</td><td>Moins de 20 kg/m² avant 70 ans, moins de 22 à partir de 70 ans</td></tr><tr><td>Phénotype</td><td>Masse musculaire réduite</td><td>Mesure validée de la masse maigre ; à défaut, examen physique</td></tr><tr><td>Étiologie</td><td>Apport alimentaire réduit</td><td>50 % ou moins des besoins plus d’une semaine, ou toute réduction plus de 2 semaines, ou affection digestive chronique altérant l’assimilation</td></tr><tr><td>Étiologie</td><td>Inflammation ou charge de maladie</td><td>Maladie ou lésion aiguë, ou maladie chronique</td></tr></tbody></table>
<p>Le consensus fournit des valeurs de référence pour la masse musculaire : un indice de masse maigre sans graisse inférieur à 17 kg/m² chez l’homme et à 15 kg/m² chez la femme, ou d’autres seuils validés selon la technique. Ces exemples ne remplacent pas la <button class="w" data-k="e46-musc">mesure de la masse musculaire</button> avec les méthodes disponibles localement. Les seuils asiatiques de l’indice de masse corporelle sont plus bas (18,5 avant 70 ans, 20 ensuite), car le consensus tient compte de la population.</p>
<p>La gravité est <b>phénotypique</b> : l’étiologie guide l’intervention et le pronostic, mais seul le phénotype gradue. Le <button class="w" data-k="e46-grading">tableau des deux stades</button> est donc le plus utile au chevet.</p>
<table class="t"><thead><tr><th>Stade</th><th>Perte de poids</th><th>Indice de masse corporelle</th><th>Masse musculaire</th></tr></thead><tbody><tr><td>1 (modérée)</td><td>5 à 10 % en 6 mois, ou 10 à 20 % au-delà</td><td>Moins de 20 avant 70 ans ; moins de 22 à partir de 70 ans</td><td>Déficit léger à modéré</td></tr><tr><td>2 (sévère)</td><td>Plus de 10 % en 6 mois, ou plus de 20 % au-delà</td><td>Moins de 18,5 avant 70 ans ; moins de 20 à partir de 70 ans</td><td>Déficit sévère</td></tr></tbody></table>
<p>La patiente de la vignette a perdu 8,5 % en cinq mois et son indice est à 21,6 à 78 ans : tous deux correspondent au stade 1. Son poids à 54 kg ne la place pas au stade 2 par l’indice, qui exigerait moins de 20.</p>
<p>Le consensus propose aussi une <button class="w" data-k="e46-etiologie-glim">classification étiologique</button> qui complète le grading : malnutrition liée à une maladie chronique avec inflammation, à une maladie chronique avec inflammation minime ou absente, à une maladie ou une lésion aiguë avec inflammation sévère, ou à l’inanition (y compris la faim d’origine socio-économique ou environnementale). Une inflammation sévère est observée dans les infections majeures, les brûlures, les traumatismes et le traumatisme crânien fermé. Une inflammation chronique légère à modérée accompagne le cancer, la BPCO, l’insuffisance cardiaque, la maladie rénale chronique, la polyarthrite rhumatoïde ou une hépatopathie chronique. Une inflammation transitoire légère ne remplit pas le critère.</p>
<p>Plusieurs <button class="w" data-k="e46-glim-maj">publications de mise à jour</button> ont précisé l’application des critères. La révision à cinq ans (2025) conclut à une forte validité prédictive et de construit, n’apporte aucune modification des seuils de perte de poids, d’indice de masse corporelle ni d’apport réduit, et accepte une évaluation de la masse musculaire selon les ressources. Une guidance de 2023–2024 admet que la maladie ou la lésion inflammatoire suffit comme critère, sans confirmation biologique ; la CRP aide lorsque la contribution inflammatoire est incertaine. La guidance de 2026 reformule le critère d’apport, en ajoutant les symptômes digestifs sévères (dysphagie, nausées, vomissements, diarrhée) et en comparant à l’apport habituel plutôt qu’aux besoins.</p>
<div class="key"><b>À retenir.</b> Dépistage positif, puis un critère phénotypique et un critère étiologique. La gravité se lit sur le poids, l’indice ou le muscle, jamais sur l’étiologie.</div>
<button class="pareto-btn ui" data-k="pareto-e46-glim">▲ Loi de Pareto — Diagnostic GLIM</button>
</section>

<section class="ilot" id="e46-3"><h2><span class="n">3</span>Fréquence en Suisse et conséquences</h2>
<p>La dénutrition est fréquente à l’hôpital suisse, et sa reconnaissance progresse. L’<button class="w" data-k="e46-epid-ch">étude d’Imoberdorf</button> (7 hôpitaux, médecine interne, 2003 à 2006) a dépisté 32 837 patients ; 18,2 % avaient un score de risque nutritionnel d’au moins 3. Le risque augmente avec l’âge : 8 % avant 45 ans, 11 % de 45 à 64 ans, 22 % de 65 à 84 ans, 28 % après 85 ans. Une intervention nutritionnelle avait été mise en œuvre chez 70 % des patients qui en avaient l’indication.</p>
<p>La base suisse des sorties hospitalières de 2012 à 2022 (<button class="w" data-k="e46-tanweer">Tanweer et Marques-Vidal</button>, 12,2 millions d’hospitalisations d’adultes) montre que la dénutrition <b>documentée</b> est passée de 1,40 % à 8,14 %. Cette hausse reflète en partie une meilleure documentation : la base est administrative, et le codage dépend du soin porté à la dénutrition. La dénutrition codée est associée à l’âge supérieur à 90 ans (odds ratio 9,62), au sexe féminin (1,26), à un index de Charlson supérieur à 8 (6,73) et à l’admission en urgence (1,47).</p>
<p>Les conséquences sont mesurables dans la même base. La dénutrition est associée à l’admission en soins intensifs (odds ratio 1,70), à la mortalité hospitalière (1,37) et à un séjour de plus de cinq jours (8,07). Seuls 61,9 % des patients dénutris avaient reçu une consultation diététique. Ces associations ne sont pas des preuves de causalité : les patients les plus malades sont à la fois plus souvent dénutris et plus exposés à ces issues.</p>
<p>Dans l’essai <button class="w" data-k="e46-effort">EFFORT</button>, 1917 patients à risque (score d’au moins 3) ont été évalués avec des critères <button class="w" data-k="e46-effort-glim">GLIM modifiés</button> : 61,6 % les remplissaient. La dénutrition est associée à une morbidité, à une mortalité, à une invalidité et à des coûts accrus.</p>
<div class="key"><b>À retenir.</b> Environ un patient sur cinq entre à l’hôpital suisse avec un risque nutritionnel, et un sur quatre après 85 ans. La documentation de la dénutrition a été multipliée par près de six en dix ans ; la consultation diététique reste incomplète.</div>
<button class="pareto-btn ui" data-k="pareto-e46-epidemio">▲ Loi de Pareto — Fréquence et conséquences</button>
</section>

<section class="ilot" id="e46-4"><h2><span class="n">4</span>Physiopathologie : du jeûne à l’inflammation</h2>
<p>Deux mécanismes, souvent associés, expliquent la dénutrition de l’adulte malade. Le premier est la réduction des apports, avec une adaptation métabolique au <button class="w" data-k="e46-jeune">jeûne</button>. Le second est l’inflammation de la maladie, qui augmente la dépense et accélère le catabolisme. Le consensus GLIM les traduit en deux critères étiologiques.</p>
<p><b>Le jeûne.</b> Lorsque les apports baissent, l’insuline diminue, tandis que le glucagon et les catécholamines augmentent légèrement. L’oxydation du glucose se limite aux tissus qui en dépendent : le cerveau, la médullaire rénale et les globules rouges. Le glycogène s’épuise, puis la néoglucogenèse utilise les acides aminés libérés par la protéolyse. Cette étape explique la perte de masse musculaire, la faiblesse et la perte de poids : le muscle est le réservoir d’acides aminés que l’organisme consomme pour maintenir une glycémie suffisante.</p>
<p>Après quelques jours, la lipolyse s’accroît. Les acides gras libres alimentent la cétogenèse hépatique, qui produit l’acétoacétate et le β-hydroxybutyrate. Ces corps cétoniques deviennent la principale source d’énergie. Le métabolisme de repos s’abaisse à 30 à 50 % de la normale : c’est la phase d’adaptation. Les réserves de vitamines et d’électrolytes diminuent pendant ce temps, ce qui prépare la complication de la renutrition.</p>
<p><b>L’inflammation.</b> Dans la dénutrition liée à la maladie avec inflammation, trois effets se cumulent : une anorexie qui réduit les apports, une élévation de la dépense énergétique de repos et un catabolisme musculaire accru. Les marqueurs de masse maigre baissent et la fonction se détériore. Le consensus GLIM en tire une conséquence pratique : l’étiologie, et notamment l’inflammation, guide l’intervention et le pronostic.</p>
<figure><svg viewBox="0 0 520 250" role="img" aria-label="Figure 1 — Deux voies vers la dénutrition" font-size="13"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="230" height="52" rx="5"/><rect x="278" y="12" width="230" height="52" rx="5"/><path d="M127 64v22m-4-5l4 5 4-5"/><path d="M393 64v22m-4-5l4 5 4-5"/><rect x="12" y="86" width="230" height="52" rx="5"/><rect x="278" y="86" width="230" height="52" rx="5"/><path d="M127 138v22m-4-5l4 5 4-5"/><path d="M393 138v22m-4-5l4 5 4-5"/><rect x="12" y="160" width="230" height="52" rx="5"/><rect x="278" y="160" width="230" height="52" rx="5"/><path d="M242 186h36m-5-4l5 4-5 4"/></g><g fill="currentColor" text-anchor="middle"><text x="127" y="42">Apports réduits</text><text x="393" y="42">Inflammation de la maladie</text><text x="127" y="116">Insuline basse, protéolyse</text><text x="393" y="116">Dépense élevée, catabolisme</text><text x="127" y="190">Perte de masse maigre</text><text x="393" y="190">Marqueurs et fonction altérés</text></g></svg><figcaption>Figure 1 — Deux voies vers la dénutrition. Schéma didactique : la voie du jeûne et la voie inflammatoire convergent vers la perte de masse maigre.</figcaption></figure>
<p><b>Du mécanisme à la clinique.</b> La perte de masse musculaire se traduit par la faiblesse, la baisse de la force de préhension et la fonte visible. La perte de poids n’est pas toujours apparente : une rétention hydrique peut la masquer. La baisse des réserves de vitamines et d’électrolytes ne se voit pas à l’examen ; elle se révèle lors de la reprise glucidique, quand la demande de phosphate, de potassium, de magnésium et de thiamine dépasse les stocks. Ce paradoxe, une complication qui survient en nourrissant, fait de la physiopathologie du jeûne un savoir de sécurité autant qu’un savoir de compréhension.</p>
<div class="key"><b>À retenir.</b> Jeûne : insuline basse, protéolyse puis cétogenèse, métabolisme réduit à 30–50 %. Inflammation : anorexie, dépense élevée, catabolisme. Dans les deux cas le muscle paie le prix, et la renutrition expose à un déséquilibre électrolytique.</div>

<section class="ilot" id="e46-5"><h2><span class="n">5</span>Causes et facteurs de risque</h2>
<p>Les causes de dénutrition se rangent selon l’axe du consensus GLIM : apports réduits, assimilation réduite, inflammation, inanition. Ces mécanismes se cumulent chez la même personne.</p>
<div class="two"><div class="card"><h4>Apports réduits</h4><p>Mauvaise santé bucco-dentaire, effets indésirables de médicaments, dépression, dysphagie, troubles digestifs, anorexie et soutien nutritionnel inadéquat. La plupart sont accessibles à une correction : un traitement dentaire, une révision de médicament, une adaptation de la texture.</p></div><div class="card"><h4>Assimilation réduite</h4><p>Grêle court, insuffisance pancréatique, chirurgie bariatrique, sténoses œsophagiennes, gastroparésie et pseudo-obstruction intestinale. Ces causes altèrent l’absorption même quand les apports sont suffisants ; elles justifient parfois un code différent (K90.-).</p></div></div>
<div class="two"><div class="card"><h4>Inflammation</h4><p>Maladies aiguës sévères (infection majeure, brûlure, traumatisme) et maladies chroniques : cancer, BPCO, insuffisance cardiaque, maladie rénale chronique, polyarthrite rhumatoïde, hépatopathie chronique. La <button class="w" data-k="e46-inflammation">contribution inflammatoire</button> augmente le risque et modifie la réponse au traitement.</p></div><div class="card"><h4>Inanition</h4><p>Faim liée à des facteurs socio-économiques ou environnementaux. Dans le consensus GLIM, c’est une catégorie étiologique à part entière, distincte de la dénutrition liée à une maladie.</p></div></div>
<p>En Suisse, la dénutrition codée à l’hôpital est associée à l’âge très avancé, au sexe féminin, aux comorbidités et à l’admission en urgence. Le risque de syndrome de renutrition, lui, dépend de facteurs spécifiques exposés à l’îlot 9.</p>
<div class="key"><b>À retenir.</b> La plupart des causes se cumulent : un patient âgé, polymédiqué, déprimé, avec une maladie inflammatoire, combine plusieurs voies. Chercher une seule cause fait manquer les autres.</div>
</section>

<section class="ilot" id="e46-6"><h2><span class="n">6</span>Anamnèse</h2>
<p>L’anamnèse établit la trajectoire du poids, la réduction des apports et les causes. Elle précède et complète tout dépistage chiffré, car beaucoup de patients ont déjà perdu du poids avant de consulter.</p>
<div class="two"><div class="card"><h4>Poids et apports</h4><p>Le médecin demande le poids actuel et les poids antérieurs, avec leurs dates, pour reconstruire la trajectoire (<button class="w" data-k="e46-poids">poids, mesures répétées et pièges</button>). Il estime les apports des une à deux dernières semaines, en proportion de l’apport habituel, car cette comparaison prime sur le calcul d’un besoin théorique.</p></div><div class="card"><h4>Symptômes digestifs et médicaments</h4><p>Dysphagie, nausées, vomissements, diarrhée, constipation, douleurs. Ces symptômes sont des critères étiologiques depuis la guidance 2026 lorsqu’ils sont sévères. Le médecin passe aussi en revue les médicaments susceptibles de réduire l’appétit ou de provoquer une perte de poids.</p></div></div>
<div class="two"><div class="card"><h4>Maladies sous-jacentes</h4><p>Maladie inflammatoire aiguë ou chronique, affection digestive chronique, dépression, mauvaise santé bucco-dentaire. Ces antécédents orientent à la fois l’étiologie GLIM et le risque de renutrition.</p></div><div class="card"><h4>Facteurs de risque de renutrition</h4><p>Jeûne récent ou prolongé, antécédent d’alcool ou de drogues, vomissements ou diarrhée chroniques, chirurgie bariatrique, chimiothérapie, hémodialyse. La recherche est systématique avant d’augmenter les apports.</p></div></div>
<p>Le diagnostic repose sur les critères et non sur un symptôme isolé. La faiblesse accompagne la perte de masse musculaire, mais elle n’établit ni la cause ni la gravité de la dénutrition ; la fonction musculaire s’évalue une fois le diagnostic posé.</p>
<div class="key"><b>À retenir.</b> L’anamnèse nutritionnelle fixe trois choses : la perte de poids chiffrée avec ses dates, la réduction des apports en durée, et les facteurs de risque de renutrition.</div>
<button class="pareto-btn ui" data-k="pareto-e46-clinique">▲ Loi de Pareto — Causes et anamnèse</button>
</section>
