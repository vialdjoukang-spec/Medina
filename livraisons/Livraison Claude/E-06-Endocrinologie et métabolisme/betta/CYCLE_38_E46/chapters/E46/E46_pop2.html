<template data-pop="e46-calcul" data-title="Calcul de l’indice et de la perte de poids de la vignette"><h3>Indice de masse corporelle</h3><p>L’indice se calcule en divisant le poids par le carré de la taille : 54 ÷ (1,58 × 1,58) = 54 ÷ 2,4964 = 21,6 kg/m². À 78 ans, le seuil est de 22 (stade 1) et de 20 (stade 2) : 21,6 est inférieur à 22 et supérieur à 20, donc stade 1.</p><h3>Perte de poids</h3><p>(59 − 54) ÷ 59 = 5 ÷ 59 = 0,085, soit 8,5 % en cinq mois. Le seuil du critère est de plus de 5 % en six mois ; le stade 1 couvre 5 à 10 %. Les deux critères phénotypiques conduisent au même stade.</p><h3>Limite</h3><p>Valeurs fictives, choisies pour illustrer le raisonnement. Un poids isolé aurait masqué la perte sans l’historique, et une éventuelle rétention hydrique aurait pu fausser le calcul.</p></template>
<template data-pop="e46-cachexie" data-title="ESPEN : dénutrition, cachexie, sarcopénie, fragilité"><h3>Définitions</h3><p>La terminologie de l’ESPEN distingue la dénutrition liée à la maladie, avec inflammation (équivalent de la cachexie) ou sans inflammation, et la dénutrition sans maladie, par exemple liée à la faim. La sarcopénie et la fragilité sont des entités distinctes, souvent associées. Le dépistage du risque précède une évaluation nutritionnelle complète.</p><h3>Articulation avec GLIM</h3><p>Un patient cachectique remplit les critères GLIM de malnutrition liée à une maladie chronique avec inflammation. GLIM s’applique en parallèle des concepts de cachexie, de sarcopénie et de fragilité.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.clnu.2016.09.004" target="_blank" rel="noopener">Cederholm et collaborateurs, ESPEN, définitions</a> ; <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">GLIM</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-poids" data-title="Poids : trajectoire, mesures répétées et rétention hydrique"><h3>Pourquoi répéter</h3><p>Les mesures répétées du poids établissent une trajectoire. Beaucoup de patients ont déjà perdu du poids avant de consulter ; une pesée unique ne le montre pas.</p><h3>Le piège hydrique</h3><p>Le poids est confondu par la rétention hydrique : œdèmes ou ascite peuvent masquer une perte de masse maigre. Pendant la renutrition, un gain de 0,3 à 0,5 kg par jour correspond à une rétention hydrique.</p><p class="src">Références : <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">GLIM</a> ; <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-musc" data-title="Masse musculaire : techniques et seuils"><h3>Techniques</h3><p>DXA, BIA, tomodensitométrie et IRM mesurent la masse maigre ; à défaut, examen physique, circonférence brachiale ou circonférence du mollet. La guidance de 2022 place les techniques d’imagerie et d’impédancemétrie en premier lorsqu’elles sont disponibles.</p><h3>Seuils d’exemple</h3><p>Indice de masse maigre sans graisse : moins de 17 kg/m² chez l’homme, moins de 15 chez la femme. Indice de masse musculaire appendiculaire (EWGSOP) : moins de 7,26 et 5,25 kg/m². Masse maigre appendiculaire : moins de 21,4 et 14,1 kg.</p><h3>Limite</h3><p>Les seuils dépendent de la technique et de la population. La force de préhension est une mesure de soutien, qui ne remplace pas la mesure de la masse.</p><p class="src">Références : <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">GLIM, tableaux 2 et 3</a> ; <a href="https://doi.org/10.1016/j.clnu.2022.02.001" target="_blank" rel="noopener">guidance sur la masse musculaire</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-bilan" data-title="Bilan de base de la revue suisse"><h3>Contenu</h3><p>NRS 2002 ; fer, holotranscobalamine et folates érythrocytaires pour l’anémie ; sodium, potassium, calcium, magnésium et phosphate ; créatinine ; tests hépatiques ; INR ; vitamine D. Dans les formes sévères ou chroniques : vitamines B1, B6, A, E et C, zinc, sélénium.</p><h3>Lecture</h3><p>Une créatinine basse peut refléter une faible masse musculaire. L’INR attire l’attention sur une carence en vitamine K, notamment sous coumarines ou anticoagulants oraux directs. La vitamine D est fréquemment carencée et associée à l’ostéoporose.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, Swiss Medical Weekly 2020, tableau 1</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-albumine" data-title="Albumine et préalbumine : pourquoi elles ne mesurent pas la nutrition"><h3>Faits</h3><p>L’albumine a une demi-vie d’environ 21 jours et c’est une protéine négative de la phase aiguë : sa concentration baisse en cas d’inflammation. La préalbumine, de demi-vie d’environ 3 jours, reflète mieux l’apport récent mais ne s’interprète pas en cas d’inflammation.</p><h3>Conduite</h3><p>La revue suisse ne recommande pas l’albumine comme marqueur nutritionnel ni dans le bilan de base.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-besoins" data-title="Besoins énergétiques : repères et incertitude"><h3>Repères</h3><p>Environ 27 kcal/kg de poids actuel par jour chez le polymorbide de plus de 65 ans (ESPEN, recommandation 4.2). Chez le patient sévèrement maigre (moins de 50 kg selon la revue suisse), environ 30 kcal/kg, à atteindre prudemment et lentement en raison du risque de syndrome de renutrition (4.3).</p><h3>Méthodes de calcul</h3><p>La calorimétrie indirecte est l’étalon de référence mais lourde. Les équations de Harris et Benedict, de la FAO/OMS/UNU ou de Mifflin et St Jeor, ou la règle de 25 à 30 kcal/kg/j, sont imprécises à l’échelle individuelle : on réévalue.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guidelines_on_nutritional_support_for_polymorbid_internal_medicine_patients.pdf" target="_blank" rel="noopener">ESPEN 2018</a> ; <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-proteines" data-title="Besoins protéiques"><h3>Repères</h3><p>Minimum de 1,0 g/kg/j (ESPEN, recommandation 5.1, grade A). Chez le patient âgé ou polymorbide, 1,2 à 1,5 g/kg/j, voire 1,5 à 2 g/kg/j selon la revue suisse. En insuffisance rénale aiguë, environ 0,8 g/kg/j. Chez l’obèse, les experts préfèrent le poids idéal, sans preuve formelle.</p><h3>Seuil d’adéquation</h3><p>Au moins 75 % des besoins énergétiques et protéiques (ESPEN, recommandation 11.1) ; un apport oral de 75 % ou moins est insuffisant.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guidelines_on_nutritional_support_for_polymorbid_internal_medicine_patients.pdf" target="_blank" rel="noopener">ESPEN 2018</a> ; <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-voie" data-title="Voies d’administration : compléments, entérale, parentérale"><h3>Escalade</h3><p>1. Enrichissement de l’alimentation et compléments nutritionnels oraux riches en énergie et en protéines (ESPEN, recommandation 2.1, grade A), pris entre les repas ou le soir. 2. Nutrition entérale par sonde nasogastrique si l’apport oral est de 75 % ou moins ; commencer petit, formules à fibres mixtes, oligopeptides si diarrhée persistante. 3. Nutrition parentérale en cas d’intolérance orale et entérale par dysfonction intestinale.</p><h3>Pourquoi l’entérale avant la parentérale</h3><p>Elle expose à moins de complications infectieuses et non infectieuses (ESPEN, recommandation 3.1).</p><h3>Délais</h3><p>Escalade si l’évolution n’est pas favorable pendant cinq jours consécutifs ; arrêt quand l’alimentation orale couvre au moins 75 % des besoins.</p><h3>Lacunes</h3><p>Les produits commerciaux et le remboursement des compléments oraux en Suisse n’ont pas été lus.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guidelines_on_nutritional_support_for_polymorbid_internal_medicine_patients.pdf" target="_blank" rel="noopener">ESPEN 2018</a> ; <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-thiamine-bioch" data-title="Thiamine et métabolisme glucidique"><h3>Rôle</h3><p>La thiamine est un cofacteur du métabolisme glucidique, consommée dès la reprise des glucides. L’information professionnelle suisse de Benerva indique qu’il faut en moyenne 0,4 mg pour environ 4200 kJ de métabolisme glucidique et que le besoin dépend de l’apport glucidique.</p><h3>Prévention</h3><p>Le consensus de prévention du syndrome de renutrition demande 200 à 300 mg au moins 30 minutes avant la renutrition. Cette dose dépasse très largement le repère moyen ci-dessus ; elle repose sur le consensus, non sur ce calcul.</p><p class="src">Références : information professionnelle suisse Benerva® (AIPS via AmiKo, avril 2019) ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-phosphate" data-title="Phosphate : de la glycolyse à l’hypophosphatémie"><h3>Mécanisme</h3><p>En phase lipidique, le phosphate est peu utilisé. Dès la reprise glucidique, la glycolyse en consomme beaucoup et l’insuline le fait entrer dans les cellules ; l’hypophosphatémie survient malgré une phosphatémie initiale normale, car les stocks corporels sont épuisés.</p><h3>Repères</h3><p>Phosphatémie normale de l’adulte : 0,7 à 1,4 mmol/L (information professionnelle de Glycophos). Syndrome imminent si inférieur à 0,6 mmol/L ou en chute de plus de 30 % sous la limite inférieure. Électrocardiogramme si inférieur à 0,32 mmol/L avant la renutrition.</p><h3>Limite</h3><p>La correction orale du phosphate n’est pas documentée dans les sources lues.</p><p class="src">Références : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a> ; information professionnelle suisse Glycophos® (AIPS via AmiKo, avril 2024), lus le 15 octobre 2026.</p></template>
<template data-pop="e46-potassium-mg" data-title="Potassium et magnésium en renutrition"><h3>Principe</h3><p>Le magnésium doit être corrigé pour corriger le potassium, car la pompe sodium-potassium dépend du magnésium. Un magnésium inférieur à 0,7 mmol/L est un facteur de risque de syndrome de renutrition.</p><h3>Seuils de prudence</h3><p>Un électrocardiogramme est indiqué les trois premiers jours si le potassium est inférieur à 2,5 mmol/L, le phosphate inférieur à 0,32 mmol/L ou le magnésium inférieur à 0,5 mmol/L avant la renutrition, en raison du risque d’arythmies, d’allongement de l’intervalle QT et de torsades de pointes.</p><h3>Lacune</h3><p>Les doses et les produits suisses de potassium et de magnésium n’ont pas été lus : ils ne sont pas donnés ici.</p><p class="src">Références : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-surveillance" data-title="Calendrier de surveillance de la revue suisse"><h3>Calendrier</h3><p>Poids quotidien ; apports trois fois par jour ; sodium, potassium, magnésium et phosphate quotidiens en phase de risque, puis deux fois par semaine ; glycémie trois à six fois par jour chez le diabétique, quotidienne au départ sous nutrition entérale ou parentérale ; créatinine et tests hépatiques chaque semaine (deux fois par semaine sous nutrition parentérale) ; triglycérides deux fois par semaine sous nutrition parentérale. Les objectifs et la tolérance sont réévalués toutes les 24 à 48 heures.</p><p class="src">Références : <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020, tableau 2</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-postsortie" data-title="Soutien nutritionnel après la sortie"><h3>Recommandations</h3><p>ESPEN, recommandation 9.1 (grade A) : poursuivre le soutien pour maintenir ou améliorer le poids et l’état nutritionnel. Recommandation 9.3 (grade A) : chez les patients de 65 ans ou plus, compléments oraux ou intervention individualisée pour réduire la mortalité.</p><h3>Méta-analyse suisse</h3><p>Quatorze essais randomisés, 2438 patients : mortalité réduite (odds ratio 0,63 ; IC 95 % 0,48–0,84), avec 568 kcal et 24 g de protéines de plus par jour et 1,1 kg de gain de poids. Pas d’effet sur les réadmissions ni sur la force de préhension.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.clnu.2022.09.011" target="_blank" rel="noopener">Kaegi-Braun et collaborateurs, méta-analyse</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_guidelines_on_nutritional_support_for_polymorbid_internal_medicine_patients.pdf" target="_blank" rel="noopener">ESPEN 2018</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-d-benerva" data-title="Benerva® : information professionnelle suisse"><h3>Présentations</h3><p>Comprimés à 100 mg et 300 mg ; ampoules de 100 mg dans 1 mL.</p><h3>Indications</h3><p>Carences par apport insuffisant, besoins accrus, troubles d’absorption (par exemple alcool), béribéri, encéphalopathie de Wernicke, cardiomyopathie alcoolique.</p><h3>Posologie</h3><p>100 mg un jour sur deux (symptômes légers), 100 mg par jour (modérés), 200 à 300 mg par jour par voie orale (graves) ; dans les carences sévères, voie parentérale (intramusculaire ou intraveineuse lente) jusqu’à 200 mg par jour puis relais oral.</p><h3>Précautions</h3><p>Injection intraveineuse réservée aux patients hospitalisés en raison du risque de réactions anaphylactoïdes. Demi-vie d’élimination de 10 à 20 jours aux doses physiologiques (1,5 à 2,5 mg).</p><p class="src">Références : information professionnelle suisse Benerva®, Swissmedic, mise à jour d’avril 2019 (AIPS via AmiKo, outil tools/swissmedic_fi.py), consultée le 15 octobre 2026.</p></template>
<template data-pop="e46-d-glycophos" data-title="Glycophos® : information professionnelle suisse"><h3>Composition</h3><p>1 mL contient 216 mg de glycérophosphate disodique ; 20 mL apportent 20 mmol de glycérophosphate et 40 mmol de sodium.</p><h3>Indication et dose</h3><p>Additif des solutions de nutrition parentérale ; chez l’adulte, en général 10 à 20 mmol par jour.</p><h3>Contre-indications</h3><p>Insuffisance rénale sévère, choc, hypernatrémie, hyperphosphatémie, déshydratation.</p><h3>Repère</h3><p>Phosphatémie normale de l’adulte : 0,7 à 1,4 mmol/L. L’hypophosphatémie est fréquente sous nutrition parentérale sans substitution (paresthésies, faiblesse musculaire, hyperventilation).</p><p class="src">Références : information professionnelle suisse Glycophos®, Swissmedic, mise à jour d’avril 2024 (AIPS via AmiKo), consultée le 15 octobre 2026.</p></template>
<template data-pop="pareto-e46-definition" data-title="Pareto — Définition et codage">
<p class="ratio" data-cover="e46-0,e46-1"></p><ul><li>E46 code la dénutrition protéino-énergétique de sévérité non précisée ; E43, E44.0 et E44.1 la précisent en écarts-types.</li><li>Le diagnostic clinique de l’adulte s’appuie sur GLIM, non sur le code.</li><li>Les règles suisses d’attribution du code n’ont pas été lues.</li></ul></template>
<template data-pop="pareto-e46-glim" data-title="Pareto — Diagnostic GLIM">
<p class="ratio" data-cover="e46-2"></p><ul><li>Dépistage positif, puis un critère phénotypique et un critère étiologique.</li><li>Gravité sur le phénotype : stade 1 (perte de 5 à 10 %, indice inférieur à 20 ou 22) et stade 2 (perte supérieure à 10 %, indice inférieur à 18,5 ou 20).</li><li>L’indice se lit avec l’âge : le seuil monte à 70 ans.</li></ul></template>
<template data-pop="pareto-e46-epidemio" data-title="Pareto — Fréquence et conséquences">
<p class="ratio" data-cover="e46-3"></p><ul><li>En Suisse, 18,2 % des patients de médecine interne ont un risque nutritionnel à l’admission ; 28 % après 85 ans.</li><li>La dénutrition codée est passée de 1,40 % à 8,14 % entre 2012 et 2022, en partie par meilleure documentation.</li><li>Elle est associée à la mortalité hospitalière et aux soins intensifs ; l’association n’est pas une preuve de causalité.</li></ul></template>
<template data-pop="pareto-e46-mecanismes" data-title="Pareto — Physiopathologie">
<p class="ratio" data-cover="e46-4"></p><ul><li>Jeûne : insuline basse, protéolyse, cétogenèse, métabolisme à 30–50 %.</li><li>Inflammation : anorexie, dépense élevée, catabolisme.</li><li>Les stocks d’électrolytes et de vitamines se vident en silence.</li></ul></template>
<template data-pop="pareto-e46-clinique" data-title="Pareto — Causes et anamnèse">
<p class="ratio" data-cover="e46-5,e46-6"></p><ul><li>Les causes se rangent en apports réduits, assimilation réduite, inflammation et inanition ; elles se cumulent.</li><li>L’anamnèse chiffre la perte de poids et sa date, les apports et les facteurs de risque de renutrition.</li></ul></template>
<template data-pop="pareto-e46-diagnostic" data-title="Pareto — Examen et démarche diagnostique">
<p class="ratio" data-cover="e46-7,e46-8"></p><ul><li>Peser, mesurer, calculer l’indice, apprécier la masse musculaire, chercher la rétention hydrique.</li><li>Séquence : dépistage, deux critères, gravité, étiologie et risque de renutrition.</li><li>Cachexie, sarcopénie et fragilité chevauchent la dénutrition ; la cause de la perte de poids reste à chercher à part.</li></ul></template>
<template data-pop="pareto-e46-sri" data-title="Pareto — Syndrome de renutrition">
<p class="ratio" data-cover="e46-9"></p><ul><li>Réponse exagérée au glucose après un jeûne : chute de phosphate, potassium, magnésium, déficit en thiamine, rétention hydrique.</li><li>Surtout dans les 72 premières heures ; phase vulnérable jusqu’à 10 jours.</li><li>Imminent si phosphate inférieur à 0,6 mmol/L ou en chute de plus de 30 % ; manifeste avec symptômes.</li></ul></template>
<template data-pop="pareto-e46-prise-en-charge" data-title="Pareto — Prise en charge nutritionnelle">
<p class="ratio" data-cover="e46-10"></p><ul><li>Plan individualisé en 48 heures ; EFFORT : mortalité à 30 jours de 7 % contre 10 %.</li><li>27 kcal/kg chez le polymorbide de plus de 65 ans ; 30 kcal/kg atteint lentement si sévèrement maigre ; protéines d’au moins 1,0 g/kg/j.</li><li>Voie orale d’abord, entérale ensuite, parentérale en dernier ; cible de 75 % des besoins.</li></ul></template>
<template data-pop="pareto-e46-prevention" data-title="Pareto — Prévention de la renutrition">
<p class="ratio" data-cover="e46-11"></p><ul><li>Énergie initiale de 5 à 15 kcal/kg/j ; thiamine de 200 à 300 mg avant la renutrition.</li><li>Phosphate, potassium et magnésium surveillés ; magnésium corrigé pour le potassium ; pas de fer la première semaine.</li><li>Électrolytes quotidiens les 2 à 4 premiers jours.</li></ul></template>
<template data-pop="pareto-e46-situations" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="e46-12,e46-13"></p><ul><li>Poids et apports quotidiens, réévaluation toutes les 24 à 48 heures.</li><li>Après la sortie : soutien poursuivi, mortalité réduite (odds ratio 0,63).</li><li>Sujet âgé, obésité, insuffisance rénale aiguë : cibles à adapter ; soins intensifs et anorexie mentale relèvent d’autres sources.</li></ul></template>
<template data-pop="pareto-e46-criteres" data-title="Pareto — Critères et paramètres">
<p class="ratio" data-cover="e46-14"></p><ul><li>Codage E46, critères GLIM et critères de renutrition forment les critères formels.</li><li>Paramètres : NRS d’au moins 3, 27 et 30 kcal/kg, protéines d’au moins 1,0 g/kg/j, adéquation de 75 %, thiamine de 200 à 300 mg.</li></ul></template>
<template data-pop="pareto-e46-examens-1" data-title="Pareto — Hiérarchie, dépistage et composition">
<p class="ratio" data-cover="e46-e-1,e46-e-2,e46-e-3"></p><ul><li>Chaque question a son outil : risque (NRS 2002), critères (mesures), muscle (DXA, BIA, CT, IRM), inflammation (CRP).</li><li>Un score de risque n’est pas un diagnostic.</li><li>Les seuils de masse musculaire dépendent de la technique.</li></ul></template>
<template data-pop="pareto-e46-examens-2" data-title="Pareto — Bilan et surveillance">
<p class="ratio" data-cover="e46-e-4,e46-e-5"></p><ul><li>Bilan de base : anémie, électrolytes, créatinine, foie, INR, vitamine D.</li><li>L’albumine n’est pas un marqueur nutritionnel : demi-vie de 21 jours, protéine négative de la phase aiguë.</li><li>Électrolytes quotidiens les premiers jours de renutrition.</li></ul></template>
<template data-pop="pareto-e46-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e46-s-physio-cours"></p><ul><li>Glucose réservé aux tissus dépendants, puis néoglucogenèse aux dépens du muscle, puis cétogenèse.</li><li>Métabolisme réduit à 30–50 % ; l’inflammation soutient la dépense.</li></ul></template>
<template data-pop="pareto-e46-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e46-s-bioch-cours"></p><ul><li>L’insuline déplace glucose, eau, phosphate, potassium et magnésium vers les cellules.</li><li>La glycolyse consomme phosphate et thiamine ; le magnésium conditionne le potassium.</li><li>La dose préventive de thiamine repose sur le consensus, non sur le calcul du besoin moyen.</li></ul></template>
<template data-pop="pareto-e46-tissus" data-title="Pareto — Tissus et composition">
<p class="ratio" data-cover="e46-s-tissus-cours"></p><ul><li>La cible est la masse maigre, que le poids peut masquer.</li><li>Moelle et foie peuvent être touchés et régressent à la renutrition.</li></ul></template>
<template data-pop="pareto-e46-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e46-p-1,e46-p-2,e46-p-3,e46-p-4"></p><ul><li>Benerva® : jusqu’à 300 mg par jour par voie orale ; intraveineux réservé à l’hôpital.</li><li>Glycophos® : 10 à 20 mmol de phosphate par jour en nutrition parentérale ; 2 mmol de sodium par mmol ; contre-indiqué en insuffisance rénale sévère.</li><li>Fer différé ; INR contrôlé ; produits oraux de phosphate, potassium et magnésium non documentés.</li></ul></template>
