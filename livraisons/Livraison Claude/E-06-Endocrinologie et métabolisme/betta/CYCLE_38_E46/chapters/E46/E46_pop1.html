<template data-pop="e46-codage" data-title="Codage CIM-10-GM : E46 contre E43 et E44"><h3>Ce que code E46</h3><p>E46 est une catégorie terminale de la CIM-10-GM 2024. Son libellé allemand est « Nicht näher bezeichnete Energie- und Eiweißmangelernährung » ; l’Office fédéral de la statistique la traduit par « Malnutrition protéino-énergétique, sans précision ». Elle comprend deux inclusions : la malnutrition sans autre précision et le trouble de l’équilibre protéino-énergétique sans autre précision. Elle n’a ni subdivision ni exclusion propre.</p><h3>Les codes voisins</h3><table class="t"><tr><th>Code</th><th>Sens</th><th>Repère</th></tr><tr><td>E43</td><td>Grave, sans précision ; inclut l’œdème de famine</td><td>3 écarts-types ou plus sous la moyenne</td></tr><tr><td>E44.0</td><td>Modérée</td><td>2 à moins de 3 écarts-types</td></tr><tr><td>E44.1</td><td>Légère</td><td>1 à moins de 2 écarts-types</td></tr></table><h3>Application et limite</h3><p>Lorsque la sévérité est établie et documentée, le code se déplace vers E43 ou E44. Les règles nationales suisses d’attribution entre ces codes (manuel de codage) n’ont pas été lues pour cette leçon : aucune règle suisse de codage n’est affirmée ici.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc E40–E46</a>, lu le 15 octobre 2026 ; libellé français : Office fédéral de la statistique.</p></template>
<template data-pop="e46-bloc" data-title="Note du bloc E40–E46 : degré de dénutrition"><h3>Le principe de la classification</h3><p>La note du bloc indique que le degré de dénutrition est en général déterminé par le poids, exprimé en écarts-types par rapport à la moyenne d’une population de référence. Un écart-type exprime la distance à la moyenne ; plus le poids est loin sous la moyenne, plus la malnutrition est grave.</p><h3>Quand le poids ne suffit pas</h3><p>L’absence de prise de poids chez l’enfant, ou une perte de poids chez l’enfant ou l’adulte, indique habituellement une malnutrition lorsqu’il existe des mesures antérieures. Avec une seule mesure, le diagnostic repose sur des hypothèses et n’est pas définitif sans autres constatations cliniques ou biologiques. En l’absence de poids, la classification se fonde sur les constatations cliniques.</p><h3>Exclusions du bloc</h3><p>Anémies nutritionnelles (D50–D53), séquelles de malnutrition protéino-énergétique (E64.0), mort par inanition, malabsorption intestinale (K90.-), cachexie due au VIH et « slim disease » (B22).</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc E40–E46</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-glim" data-title="Critères GLIM : diagnostic en deux temps"><h3>Ce que sont les critères</h3><p>Le consensus Global Leadership Initiative on Malnutrition, publié en 2019 par des sociétés de nutrition clinique du monde entier, propose une démarche en deux temps : un dépistage du risque par un outil validé, puis un diagnostic chez les patients à risque.</p><h3>Règle de décision</h3><p>Le diagnostic exige <b>au moins un critère phénotypique</b> (perte de poids, indice de masse corporelle bas, masse musculaire réduite) et <b>au moins un critère étiologique</b> (apport réduit ou assimilation altérée, inflammation ou charge de maladie). La gravité se lit sur le phénotype.</p><h3>Pourquoi cette règle</h3><p>Le phénotype décrit ce que le patient a perdu ; l’étiologie décrit pourquoi. Exiger les deux évite de poser le diagnostic sur un seul signe, par exemple un indice bas chez une personne constitutionnellement maigre, ou une maladie sans conséquence nutritionnelle.</p><h3>Limite</h3><p>Le consensus a été élaboré par des sociétés mondiales dont l’ESPEN ; il ne remplace pas la recommandation d’une société suisse. Les seuils asiatiques de l’indice diffèrent des seuils européens.</p><p class="src">Références : <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">Cederholm, Jensen et collaborateurs, critères GLIM</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-grading" data-title="Deux stades de gravité GLIM"><h3>Stade 1, modéré</h3><p>Perte de poids de 5 à 10 % en six mois, ou de 10 à 20 % au-delà ; indice inférieur à 20 kg/m² avant 70 ans ou inférieur à 22 à partir de 70 ans ; déficit musculaire léger à modéré.</p><h3>Stade 2, sévère</h3><p>Perte de poids supérieure à 10 % en six mois, ou à 20 % au-delà ; indice inférieur à 18,5 avant 70 ans ou inférieur à 20 à partir de 70 ans ; déficit musculaire sévère.</p><h3>Application</h3><p>On retient le stade le plus sévère atteint par un des trois critères phénotypiques. L’étiologie n’intervient pas dans le grading.</p><h3>Limite</h3><p>Les seuils ne s’appliquent qu’après un dépistage positif et un diagnostic posé. Le grading GLIM ne correspond pas terme à terme aux codes E43, E44.0 et E44.1, qui reposent sur les écarts-types du poids.</p><p class="src">Références : <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">GLIM, tableau 4</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-etiologie-glim" data-title="Classification étiologique GLIM"><h3>Quatre catégories</h3><p>Le consensus rattache la dénutrition à une maladie chronique avec inflammation, à une maladie chronique avec inflammation minime ou absente, à une maladie ou une lésion aiguë avec inflammation sévère, ou à l’inanition, y compris la faim d’origine socio-économique ou environnementale.</p><h3>Exemples d’inflammation</h3><p>Inflammation sévère : infection majeure, brûlures, traumatisme, traumatisme crânien fermé. Inflammation chronique légère à modérée : cancer, BPCO, insuffisance cardiaque, maladie rénale chronique, polyarthrite rhumatoïde, hépatopathie chronique.</p><h3>Utilité</h3><p>La catégorie guide l’intervention et le pronostic. Une inflammation transitoire légère ne remplit pas le critère.</p><p class="src">Références : <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">GLIM, tableau 5</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-glim-maj" data-title="Mises à jour GLIM 2022 à 2026"><h3>Révision à cinq ans (2025)</h3><p>Plus de 400 publications et 10 revues systématiques indiquent une forte validité prédictive et de construit. La masse musculaire s’évalue selon les ressources ; le jugement clinique peut suffire pour l’inflammation. Aucune révision des critères de perte de poids, d’indice de masse corporelle et d’apport réduit.</p><h3>Guidances thématiques</h3><p>Inflammation (2023–2024) : une maladie aiguë ou chronique, une infection ou une lésion habituellement inflammatoire suffit ; la CRP aide si la contribution est incertaine. Masse musculaire (2022) : DXA, CT ou BIA si disponibles, sinon anthropométrie et examen physique. Apport (2026, méthode Delphi modifiée) : apport de 50 % ou moins la semaine écoulée, ou toute réduction de plus de deux semaines, ou symptômes digestifs sévères, avec comparaison à l’apport habituel.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.clnu.2025.03.018" target="_blank" rel="noopener">mise à jour à cinq ans</a> ; <a href="https://doi.org/10.1016/j.clnu.2023.11.026" target="_blank" rel="noopener">inflammation</a> ; <a href="https://doi.org/10.1016/j.clnu.2022.02.001" target="_blank" rel="noopener">masse musculaire</a> ; <a href="https://doi.org/10.1016/j.clnu.2026.106643" target="_blank" rel="noopener">apport et symptômes digestifs</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-nrs" data-title="NRS 2002 : dépistage du risque nutritionnel"><h3>Principe</h3><p>La Nutritional Risk Screening 2002 repose sur l’idée que le soutien nutritionnel est indiqué chez le patient sévèrement malade avec besoins accrus, chez le patient sévèrement dénutri, ou chez celui qui combine certains degrés de maladie et de dénutrition. Elle a été validée par l’analyse de 128 essais randomisés.</p><h3>Structure et seuil</h3><p>L’état nutritionnel et la sévérité de la maladie sont cotés chacun de 0 à 3 ; un point s’ajoute à partir de 70 ans. Un score d’au moins 3 indique un risque. Il est utilisé comme seuil d’inclusion dans EFFORT et dans l’étude d’Imoberdorf.</p><h3>Application</h3><p>Dépistage à l’admission ou au plus tard dans les 24 à 48 heures.</p><h3>Limite</h3><p>Les items détaillés de la grille ne sont pas reproduits ici : seule la structure est sourcée.</p><p class="src">Références : <a href="https://doi.org/10.1016/s0261-5614(02)00214-5" target="_blank" rel="noopener">Kondrup, Rasmussen, Hamberg, Stanga, NRS 2002</a> ; <a href="https://doi.org/10.4414/smw.2020.20204" target="_blank" rel="noopener">Baumgartner et collaborateurs, 2020</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-epid-ch" data-title="Prévalence à l’admission dans sept hôpitaux suisses"><h3>Population et méthode</h3><p>Sept hôpitaux suisses, services de médecine interne, 2003 à 2006 : 32 837 patients dépistés par la NRS 2002.</p><h3>Résultats</h3><p>Un score d’au moins 3 chez 18,2 % des patients, avec un gradient d’âge : 8 % avant 45 ans, 11 % de 45 à 64 ans, 22 % de 65 à 84 ans, 28 % après 85 ans. Une intervention nutritionnelle a été mise en œuvre chez 70 % des patients ayant l’indication.</p><h3>Limites</h3><p>Données anciennes (2003 à 2006), obtenues par un outil de dépistage et non par les critères GLIM, publiées avant les évolutions récentes de la documentation hospitalière.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf et collaborateurs, Clinical Nutrition</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-tanweer" data-title="Base suisse des sorties hospitalières 2012–2022"><h3>Population et méthode</h3><p>12,2 millions d’hospitalisations d’adultes en Suisse, de 2012 à 2022, dans la base de données des sorties hospitalières.</p><h3>Résultats</h3><p>La dénutrition documentée passe de 1,40 % à 8,14 %. Elle est associée à l’âge supérieur à 90 ans (odds ratio 9,62), au sexe féminin (1,26), à un index de Charlson supérieur à 8 (6,73) et à l’admission en urgence (1,47). Elle est associée aussi à l’admission en soins intensifs (1,70), à la mortalité hospitalière (1,37) et à un séjour de plus de cinq jours (8,07). Seuls 61,9 % des patients dénutris ont reçu une consultation diététique.</p><h3>Limites</h3><p>Le codage est administratif ; la hausse reflète probablement en partie une meilleure documentation. Les odds ratios décrivent des associations, non des effets causaux.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.nut.2026.113269" target="_blank" rel="noopener">Tanweer et Marques-Vidal, Nutrition 2026</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-effort" data-title="Essai suisse EFFORT : soutien individualisé"><h3>Plan</h3><p>Essai randomisé dans 8 hôpitaux suisses, 2088 patients de médecine interne à risque (NRS d’au moins 3, séjour attendu de plus de quatre jours). Un groupe recevait un soutien individualisé par un diététicien, débuté en 48 heures ; l’autre la nourriture hospitalière standard.</p><h3>Résultats</h3><table class="t"><tr><th>Critère</th><th>Soutien</th><th>Standard</th></tr><tr><td>Événement défavorable à 30 jours</td><td>23 %</td><td>27 %</td></tr><tr><td>Mortalité à 30 jours</td><td>7 %</td><td>10 %</td></tr><tr><td>Effets indésirables</td><td>16 %</td><td>14 %</td></tr></table><p>Odds ratio ajusté des événements défavorables : 0,79 (IC 95 % 0,64–0,97) ; de la mortalité : 0,65 (0,47–0,91) ; différence des effets indésirables non significative. Les objectifs caloriques ont été atteints chez 79 % des patients, protéiques chez 76 %.</p><h3>Limites</h3><p>Population de médecine interne en hôpital suisse ; ce résultat ne s’applique pas tel quel aux soins intensifs.</p><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(18)32776-4" target="_blank" rel="noopener">Schuetz et collaborateurs, Lancet</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-effort-glim" data-title="Critères GLIM dans EFFORT"><h3>Résultats</h3><p>Parmi 1917 patients à risque, 61,6 % remplissaient les critères GLIM modifiés. Les événements défavorables étaient plus fréquents chez les patients GLIM positifs (27,9 % contre 19,0 % ; odds ratio 1,53). Le bénéfice du traitement était plus net chez les GLIM positifs (odds ratio 0,69) que chez les GLIM négatifs (0,95), sans interaction statistiquement significative.</p><h3>Lecture</h3><p>Le diagnostic GLIM prédit l’évolution défavorable. L’absence d’interaction significative empêche d’affirmer que le traitement ne profite qu’aux patients GLIM positifs.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.clnu.2022.02.009" target="_blank" rel="noopener">Kaegi-Braun et collaborateurs, Clinical Nutrition 2022</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-jeune" data-title="Adaptation métabolique au jeûne"><h3>Chaîne</h3><p>Insuline basse, glucagon et catécholamines légèrement élevés ; glucose réservé au cerveau, à la médullaire rénale et aux globules rouges ; glycogène épuisé ; néoglucogenèse à partir des acides aminés issus de la protéolyse ; puis lipolyse et cétogenèse hépatique. Le métabolisme est réduit à 30 à 50 % de la normale.</p><h3>Conséquence clinique</h3><p>Perte de masse musculaire, faiblesse, perte de poids, épuisement des stocks de vitamines et d’électrolytes.</p><p class="src">Références : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, J Clin Med 2019</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-inflammation" data-title="Inflammation et dénutrition"><h3>Rôle</h3><p>Dans la dénutrition liée à la maladie avec inflammation, l’anorexie réduit les apports, la dépense énergétique de repos augmente et le catabolisme musculaire s’accroît. Les marqueurs de masse maigre baissent et la fonction s’altère.</p><h3>Critère GLIM</h3><p>Une maladie aiguë ou chronique, une infection ou une lésion habituellement associée à une activité inflammatoire suffit ; la CRP est recommandée si la contribution est incertaine, en tenant compte de la méthode et des unités (mg/dL ou mg/L).</p><p class="src">Références : <a href="https://doi.org/10.1002/jcsm.12383" target="_blank" rel="noopener">GLIM</a> ; <a href="https://doi.org/10.1016/j.clnu.2023.11.026" target="_blank" rel="noopener">guidance sur l’inflammation</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-sri" data-title="Syndrome de renutrition : définition et mécanisme"><h3>Définition</h3><p>Réponse exagérée à la réintroduction du glucose après un jeûne prolongé : déséquilibres du phosphate, du potassium et du magnésium, déficit en thiamine, troubles hydriques, défaillances d’organe parfois mortelles.</p><h3>Mécanisme</h3><p>Le glucose fait remonter l’insuline, qui déplace glucose, eau, phosphate, potassium et magnésium dans les cellules ; leurs concentrations sanguines chutent. La thiamine, cofacteur du métabolisme glucidique, est consommée. Le rein retient sodium et eau.</p><h3>Chronologie et fréquence</h3><p>Surtout dans les 72 premières heures, avec une phase vulnérable jusqu’à 10 jours. Dans EFFORT, 14,6 % de 967 patients dénutris ont présenté un syndrome confirmé.</p><p class="src">Références : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a>, lu le 15 octobre 2026.</p></template>
<template data-pop="e46-sri-diag" data-title="Diagnostic du syndrome de renutrition"><h3>Critères</h3><p>Syndrome <b>imminent</b> : phosphate qui chute de plus de 30 % sous la limite inférieure ou inférieur à 0,6 mmol/L, ou deux électrolytes sur trois (phosphate, magnésium, potassium) sous la norme dans les 72 heures suivant la renutrition, sans autre cause. Syndrome <b>manifeste</b> : ces critères avec des symptômes cliniques.</p><h3>Signes fréquents</h3><p>Tachycardie, tachypnée et œdèmes périphériques.</p><h3>Dépistage préalable</h3><p>Indice de masse corporelle bas, perte de poids involontaire importante, apport faible ou nul, antécédent d’abus d’alcool ou de drogues.</p><p class="src">Références : <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a> ; <a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et collaborateurs, 2018</a>, lus le 15 octobre 2026.</p></template>
<template data-pop="e46-sri-prev" data-title="Algorithme de prévention de la renutrition"><h3>Éléments</h3><p>Énergie initiale de 5 à 15 kcal/kg/j selon le risque, en augmentation progressive (besoins complets en 5 à 10 jours) ; liquides de 25 à 35 mL/kg/j ; sodium inférieur à 1 mmol/kg/j chez les patients à très haut risque ; thiamine de 200 à 300 mg au moins 30 minutes avant la renutrition ; vitamines à 200 % et oligo-éléments à 100 % des apports recommandés ; surveillance et supplémentation de phosphate, potassium et magnésium ; pas de fer la première semaine.</p><h3>Surveillance</h3><p>Poids et hydratation quotidiens ; électrolytes quotidiens les deux à quatre premiers jours ; électrocardiogramme les trois premiers jours si les valeurs de départ sont très basses.</p><h3>Limite</h3><p>L’algorithme est fondé sur une revue et un consensus d’experts ; il concerne la médecine interne et exclut l’anorexie mentale.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et collaborateurs, 2018</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et collaborateurs, 2019</a>, lus le 15 octobre 2026.</p></template>
