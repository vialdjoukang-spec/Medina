<template data-pop="e50-mnemo" data-title="Moyen mnémotechnique"><h3>Aide pédagogique, non critère officiel</h3><p>Pour retenir l’ordre des stades du plus doux au plus grave, on peut les énoncer ainsi : nuit (XN), conjonctive sèche (X1A), Bitot (X1B), cornée sèche (X2), cornée ulcérée (X3), cicatrice (XS). Cet enchaînement ne sert qu’à mémoriser la séquence ; il ne remplace pas la classification de l’OMS.</p></template>
<template data-pop="e50-d-oms-schema" data-title="Vitamine A orale : schéma OMS"><h3>Mécanisme</h3><p>Le rétinol apporté est utilisé pour la rhodopsine et la différenciation épithéliale. La voie est orale, de préférence en préparation huileuse.</p><h3>Posologie</h3><p>Moins de 6 mois : 50 000 UI ; 6 à 12 mois : 100 000 UI ; plus de 12 mois : 200 000 UI. La même dose est donnée le lendemain, puis au moins deux semaines plus tard. Femme en âge de procréer sans lésion cornéenne : 5 000 à 10 000 UI par jour pendant au moins 4 semaines, jamais plus de 10 000 UI par jour, ou au plus 25 000 UI par semaine ; lésions cornéennes aiguës : haute dose possible après mise en balance du risque.</p><h3>Preuves et limites</h3><p>Texte de l’OMS de 1997, conçu pour des pays à faible revenu. En prévention chez l’enfant de 6 à 59 mois, la supplémentation réduit la mortalité toutes causes de 12 % (RR 0,88) et le risque de cécité nocturne (RR 0,32) ou de taches de Bitot (RR 0,42) selon la revue Cochrane 2022.</p><h3>Effets indésirables, contre-indications et surveillance</h3><p>Vomissements plus fréquents dans les 48 heures chez l’enfant (RR 1,97). Toxicité aiguë au-delà de 300 000 UI chez l’adulte ou 60 000 UI chez l’enfant. Contre-indication relative : grossesse, hors urgence cornéenne. Surveillance : rétinol, symptômes d’hypertension intracrânienne, tests hépatiques si traitement prolongé.</p><p class="src">Source : <a href="https://iris.who.int/server/api/core/bitstreams/a6075249-0131-4052-84a4-c33b5961ab43/content" target="_blank" rel="noopener">OMS 1997</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35294044/" target="_blank" rel="noopener">Cochrane 2022</a> ; ESPEN 2022.</p></template>
<template data-pop="e50-d-blache" data-title="Pommade ophtalmique Vitamin A « Blache »"><h3>Information professionnelle suisse (février 2023)</h3><p>Pommade ophtalmique contenant 15 000 UI de palmitate de rétinol par gramme. Indication : appoint du traitement systémique des carences en vitamine A (xérophtalmie, kératomalacie). Posologie : 3 à 5 mm, deux à quatre fois par jour. Contre-indication : hypervitaminose A. Déconseillée pendant la grossesse et l’allaitement ; non recommandée chez l’enfant. L’indication d’appoint couvre aussi la sécheresse oculaire. Aucune dose orale ne figure dans ce texte.</p><p class="src">Source : information professionnelle suisse (Swissmedic), consultée via l’outil du projet.</p></template>
<template data-pop="e50-d-vitalipid" data-title="Vitalipid N Adult"><h3>Information professionnelle suisse (juillet 2009)</h3><p>Émulsion pour nutrition parentérale : 990 µg (3 300 UI) de rétinol par 10 mL et par jour, qui couvrent les besoins lors d’une nutrition parentérale exclusive. Le rétinol est dégradé par la lumière et par les oligo-éléments. Le texte mentionne des risques fœtaux liés au rétinol. La date de l’information est ancienne ; le texte en vigueur la remplace éventuellement.</p><p class="src">Source : information professionnelle suisse (Swissmedic).</p></template>
<template data-pop="e50-d-supradyn" data-title="Supradyn Vital 50+"><h3>Information professionnelle suisse (mai 2024)</h3><p>Polyvitamine orale contenant 1 333 UI de vitamine A. Contre-indications : hypervitaminose A, prise d’autres vitamines A, prise de rétinoïdes systémiques. Ce produit sert d’entretien et non de traitement de la xérophtalmie.</p><p class="src">Source : information professionnelle suisse (Swissmedic).</p></template>
<template data-pop="e50-d-bcarotene" data-title="β-carotène dans la mucoviscidose"><h3>Principe</h3><p>Provitamine convertie en rétinol selon les besoins, ce qui est possiblement plus sûr (rétrocontrôle). Dose rapportée de 6 à 18 ans : 1 mg/kg par jour pendant 12 semaines, puis au plus 10 mg par jour. Contrôle annuel une fois la valeur normalisée ; réduire la dose en cas d’hépatopathie sévère avec RBP basse. Les formes hydrosolubles sont plus toxiques que les huileuses.</p><p class="src">Source : ESPEN-ESPGHAN-ECFS 2016.</p></template>
<template data-pop="pareto-e50-phys" data-title="Pareto — Définition, épidémiologie et physiopathologie"><p class="ratio" data-cover="e50-0,e50-1,e50-2,e50-3"></p><ul><li>L’avitaminose A est le plus souvent une malabsorption des graisses en Suisse ; la carence d’apport domine dans les pays pauvres.</li><li>Les réserves hépatiques (&gt; 90 % du stock) couvrent environ six mois.</li><li>Rétinal + opsine = rhodopsine : cécité nocturne. Acide rétinoïque : kératinisation et immunité.</li><li>Stades OMS : XN, X1A, X1B, X2, X3A, X3B, XS, XF ; E50.0 à E50.9.</li><li>Rétinol ≤ 0,70 µmol/L carence ; &lt; 0,35 sévère ; l’inflammation fausse le dosage.</li><li>Prévalence après chirurgie bariatrique : 18 % (bypass), 59 % (dérivation biliopancréatique).</li></ul></template>
<template data-pop="pareto-e50-clin" data-title="Pareto — Causes, anamnèse et examen"><p class="ratio" data-cover="e50-4,e50-5,e50-6"></p><ul><li>Quatre maillons : apport, absorption, stockage-transport, besoins.</li><li>Question clé : vision de nuit ? œil sec ? chirurgie bariatrique, résection, mucoviscidose, hépatopathie ?</li><li>Lampe à fente : xérose, taches de Bitot, cornée trouble, ulcération, cicatrice ; OCT pour la rétine.</li></ul></template>
<template data-pop="pareto-e50-prise" data-title="Pareto — Diagnostic, traitement et suivi"><p class="ratio" data-cover="e50-7,e50-8,e50-9,e50-10,e50-11,e50-12,e50-13"></p><ul><li>Diagnostic : terrain + signe oculaire + rétinol bas (avec CRP et RBP) + réponse au traitement.</li><li>Cornée atteinte : urgence ; vitamine A, antibiotique local, pas de corticoïde, transfert.</li><li>Schéma OMS : 200 000 UI au jour 1, au jour 2 et au moins 14 jours plus tard au-delà de 12 mois ; femme en âge de procréer sans lésion cornéenne ≤ 10 000 UI par jour.</li><li>Toxicité aiguë &gt; 300 000 UI (adulte) ; aucun antidote.</li><li>Contrôles bariatriques : 1, 3, 6, 9, 12, 18, 24 mois puis annuels ou semestriels.</li></ul></template>
<template data-pop="pareto-e50-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e50-e-1,e50-e-2,e50-e-3,e50-e-4,e50-e-5"></p><ul><li>Examen indiqué : rétinol sérique avec CRP ; référence peu disponible : mesure hépatique directe.</li><li>Le rétinol ne reflète pas le stock entre les extrêmes ; protéger de la lumière.</li><li>Alcoolisme : rétinol parfois normal malgré des réserves épuisées ; insuffisance rénale : souvent élevé.</li><li>Esters de rétinyle &gt; 250 nmol/L : excès.</li></ul></template>
<template data-pop="pareto-e50-sci" data-title="Pareto — Sciences fondamentales"><p class="ratio" data-cover="e50-s-anat-body,e50-s-physio-body,e50-s-bioc-body,e50-s-histo-body,e50-s-gen-body"></p><ul><li>Rétine (XN, XF), conjonctive (X1A, X1B), cornée (X2 à XS).</li><li>Foie : stockage ≥ 90 % ; RBP et transthyrétine : transport.</li><li>Rétinal : rhodopsine ; acide rétinoïque : RAR et RXR, plus de 500 gènes.</li><li>Kératinisation : xérose, taches de Bitot, kératomalacie.</li></ul></template>
<template data-pop="pareto-e50-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e50-p-1,e50-p-2,e50-p-3,e50-p-4,e50-p-5"></p><ul><li>Un principe actif, quatre stratégies : urgence, correction, prévention, nutrition artificielle.</li><li>Doses : OMS (50 000, 100 000, 200 000 UI), femme (≤ 10 000 UI par jour), entérale 900 à 1 500 µg, parentérale 800 à 1 100 µg.</li><li>Interdits : corticoïde local, cumul de sources, haute dose chez la femme sans urgence.</li><li>Pommade « Blache » : appoint seulement.</li></ul></template>
