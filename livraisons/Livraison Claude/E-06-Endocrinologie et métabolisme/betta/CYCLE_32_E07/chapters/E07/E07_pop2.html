<template data-pop="e07-pendred" data-title="Syndrome de Pendred">
<div class="lab">Définition</div><p>Maladie autosomique récessive associant surdité neurosensorielle, goitre et défaut d’organification de l’iodure, avec ou sans hypothyroïdie. La surdité, liée à des malformations de l’oreille interne (aqueduc vestibulaire élargi, dysplasie de Mondini), est le signe cardinal ; le phénotype thyroïdien est variable et modulé par l’apport iodé.</p>
<div class="lab">Mécanisme</div><p>Mutations biallèliques de SLC26A4, qui code la pendrine, échangeur d’anions (chlorure, iodure, bicarbonate). Dans l’oreille interne, la pendrine maintient la composition et le potentiel de l’endolymphe ; dans la thyroïde, elle est apicale et participe à l’efflux d’iodure vers la lumière folliculaire ; au rein, elle sécrète le bicarbonate, d’où une alcalose métabolique sévère décrite lors d’une charge alcaline.</p>
<div class="lab">Épidémiologie</div><p>Cause de 4 à 7,5 % des surdités héréditaires ; prévalence estimée de 7,5 à 10 pour 100 000 hors populations africaines.</p>
<div class="lab">Diagnostic</div><p>Évoquer le syndrome devant une surdité neurosensorielle congénitale avec ou sans goitre ; répéter les tests auditifs avant l’âge scolaire chez tout enfant atteint d’hypothyroïdie congénitale. Dans une cohorte européenne (Slovaquie et Autriche), une cause génétique n’était identifiée que chez 13 probands sur 37 (35 %).</p>
<div class="lab">Évolution</div><p>La morphologie de l’oreille interne peut varier au sein d’une même famille. L’implant cochléaire donne en général un bénéfice utile (revue systématique, preuves de faible niveau). De rares cancers thyroïdiens sont rapportés (environ 1 % selon une revue de cas), avec un faible niveau de preuve.</p>
<p class="src">Source : Wémeau et Kopp 2017 ; Manuelli et al. 2026 ; Sklenar et al. 2025 ; Islam et al. 2025 ; Chen et al. 2024 ; Biggs et al. 2020 ; Wu et al. 2026 ; van Trotsenburg et al. 2021.</p></template>

<template data-pop="e07-goitre-neonatal" data-title="Goitre congénital compressif et goitre fœtal">
<div class="lab">Cas rapportés</div><p>Un variant homozygote du gène de la thyroglobuline a donné un goitre congénital massif avec compression trachéale néonatale nécessitant une intubation, régressif sous lévothyroxine. Une série de quatre cas consécutifs décrit le goitre fœtal comme une menace vitale in utero, avec une prise en charge interdisciplinaire et parfois une stratégie de traitement intra-partum ex utero.</p>
<div class="lab">Application</div><p>Un goitre fœtal ou néonatal volumineux est une urgence respiratoire avant d’être un problème hormonal.</p>
<div class="lab">Limite</div><p>Un cas clinique et une série de cas ; aucune recommandation.</p>
<p class="src">Source : Anık et al., Hormones 2026 ; Scharf et al., Arch Gynecol Obstet 2026;313(1).</p></template>

<template data-pop="e07-levo-hc" data-title="Lévothyroxine dans l’hypothyroïdie congénitale">
<div class="lab">Traitement</div><p>Début au plus tard à 2 semaines de vie ou dès la confirmation ; dose initiale pouvant atteindre 15 µg/kg/jour ; forme sévère (thyroxine libre inférieure à 5 pmol/l) 10 à 15 µg/kg/jour ; forme légère 10 µg/kg/jour ; une prise orale par jour. Des études en fratrie montrent un quotient intellectuel normal si la lévothyroxine débute avant 10 jours à au moins 10 µg/kg/jour.</p>
<div class="lab">Suivi</div><p>Contrôle 1 à 2 semaines après le début, puis toutes les 2 semaines jusqu’à normalisation de la thyréostimuline, puis tous les 1 à 3 mois jusqu’à 12 mois, tous les 2 à 4 mois de 1 à 3 ans, tous les 3 à 6 mois ensuite ; 4 à 6 semaines après tout changement de dose. Prélèvement avant la dose ou au moins 4 heures après.</p>
<div class="lab">Pronostic</div><p>Croissance, puberté, fertilité, santé osseuse, métabolique et cardiovasculaire normales dans l’hypothyroïdie congénitale non syndromique bien traitée.</p>
<p class="src">Source : van Trotsenburg et al., Thyroid 2021;31:387-419.</p></template>

<template data-pop="e07-euthyrox" data-title="Euthyrox® : information professionnelle suisse">
<div class="lab">Indications</div><p>Substitution de toute hypothyroïdie, hypothyroïdie congénitale, goitre bénin euthyroïdien, prévention de récidive après résection de goitre.</p>
<div class="lab">Posologie pédiatrique</div><p>0 à 6 mois : 25 à 75 µg/jour (10 µg/kg) ; 6 à 12 mois : 50 à 75 µg/jour (8 µg/kg) ; 1 à 5 ans : 75 à 100 µg/jour (5 à 6 µg/kg) ; 6 à 12 ans : 100 à 150 µg/jour (4 à 5 µg/kg) ; à partir de 12 ans, comme l’adulte. Dans l’hypothyroïdie congénitale, « la dose tolérée la plus élevée possible » en prophylaxie du crétinisme, en cherchant à normaliser la thyréostimuline.</p>
<div class="lab">Administration</div><p>À jeun, au moins 30 minutes avant le petit-déjeuner ; chez le nourrisson, comprimé désagrégé dans un peu d’eau, suspension préparée extemporanément.</p>
<div class="lab">Pharmacocinétique</div><p>Absorption jusqu’à environ 80 % à jeun ; liaison protéique de 99,97 % (environ deux tiers à la globuline liant la thyroxine, un tiers à la préalbumine) ; demi-vie d’environ 7 jours (9 à 10 jours en hypothyroïdie) ; plein effet en 1 à 3 semaines.</p>
<div class="lab">Prématurés</div><p>Immaturité de l’axe et possible insuffisance corticosurrénalienne ; collapsus cardiovasculaire rapporté sous lévothyroxine.</p>
<p class="src">Source : Merck Schweiz, information professionnelle Euthyrox®, Swissmedic, mise à jour février 2023.</p></template>

<template data-pop="e07-interactions-levo" data-title="Interactions de la lévothyroxine">
<div class="lab">Absorption</div><p>Sels de fer, calcium et aluminium : prendre la lévothyroxine au moins 2 heures avant. Résines : 4 à 5 heures. Inhibiteurs de la pompe à protons, soja, orlistat et inducteurs enzymatiques sont aussi cités.</p>
<div class="lab">Besoins et dosage</div><p>Les œstrogènes augmentent les besoins. La biotine fausse les immunodosages. Le furosémide, les salicylates et les anticoagulants oraux déplacent la thyroxine de ses protéines.</p>
<div class="lab">Application</div><p>Avant d’augmenter la dose d’un enfant dont la thyréostimuline reste élevée, on vérifie l’observance, l’heure de prise et les produits pris simultanément.</p>
<p class="src">Source : information professionnelle suisse Euthyrox®, février 2023.</p></template>

<template data-pop="e07-gluconate-test" data-title="Gluconate de calcium comme test diagnostique">
<div class="lab">Mécanisme et usage</div><p>Le calcium par voie intraveineuse stimule la sécrétion de calcitonine par les cellules C ; la réponse sépare le cancer médullaire de l’hyperplasie. Il remplace la pentagastrine devenue indisponible.</p>
<div class="lab">Posologie de l’étude</div><p>25 mg/kg de poids ajusté, soit 2,3 mg/kg de calcium élément, à 5 ml/min pendant au moins 3 minutes.</p>
<div class="lab">Effets indésirables</div><p>Sensation de chaleur (57 %) ; bradycardie sinusale réversible.</p>
<div class="lab">Limite</div><p>Usage diagnostique hors information professionnelle suisse lue.</p>
<p class="src">Source : Fugazzola et al. 2020 ; Giovanella et al. 2026.</p></template>

<template data-pop="e07-tsh-medicaments" data-title="Dopamine et glucocorticoïdes à haute dose sur la thyréostimuline">
<div class="lab">Contenu</div><p>La dopamine et les glucocorticoïdes à haute dose abaissent la thyréostimuline, y compris chez le patient hypothyroïdien. Le cortisol supprime la thyréolibérine et la thyréostimuline et modifie les désiodases (désiodases de types 1 et 2 diminuées, type 3 augmentée).</p>
<div class="lab">Application</div><p>Chez un patient de soins intensifs, une thyréostimuline basse ne prouve pas un axe normal : le médicament peut la masquer.</p>
<p class="src">Source : Fliers et al., Lancet Diabetes Endocrinol 2015;3:816-25 ; Gierach et Junik, Endokrynol Pol 2026.</p></template>

<template data-pop="e07-tsh-cible" data-title="Dyshormonogenèse : cible de thyréostimuline et surveillance du goitre">
<div class="lab">Consigne</div><p>Viser une thyréostimuline dans la partie basse de la norme et surveiller le volume thyroïdien par échographie tous les 2 à 3 ans. Cytoponction des nodules suspects.</p>
<div class="lab">Justification</div><p>La thyréostimuline stimule la croissance de la glande : la maintenir basse-normale limite le goitre. De rares cancers papillaires ou folliculaires sont rapportés, souvent lors d’une thyréostimuline durablement élevée par mauvaise observance à l’adolescence.</p>
<div class="lab">Réévaluation</div><p>Après 2 à 3 ans, si le diagnostic permanent n’est pas établi chez un enfant à glande en place ; une thyréostimuline de 10 mU/l ou plus après 4 semaines d’arrêt signe une hypothyroïdie primaire permanente.</p>
<p class="src">Source : van Trotsenburg et al. 2021.</p></template>

<template data-pop="e07-tbg" data-title="Globuline liant la thyroxine : physiologie et génétique">
<div class="lab">Physiologie</div><p>Principale protéine de transport, elle lie environ 70 % de la triiodothyronine et 75 % de la thyroxine sériques ; glycoprotéine hépatique de 54 kDa codée par SERPINA7 (chromosome X, Xq22.2).</p>
<div class="lab">Génétique</div><p>Transmission liée à l’X : expression complète chez l’homme hémizygote et la femme homozygote ; femmes hétérozygotes moins atteintes, chevauchant la norme. Trois phénotypes : déficit complet (environ 1/15 000), partiel (environ 1/4000, le plus fréquent) et excès.</p>
<div class="lab">Biologie et conduite</div><p>Hormones totales basses avec thyroxine libre et thyréostimuline normales. Les sujets sont euthyroïdiens, sans traitement ; un faux diagnostic d’hypothyroïdie conduit à une lévothyroxine inutile et à une thyrotoxicose iatrogène.</p>
<div class="lab">Dépistage néonatal</div><p>Dans un dépistage néerlandais, un déficit fonctionnel (variant de faible affinité, globuline normale) a simulé une hypothyroïdie centrale ; la thyroxine libre normale a redressé le diagnostic.</p>
<div class="lab">Limite</div><p>Série coréenne, cas unique néerlandais ; l’excès de globuline n’est pas documenté ici.</p>
<p class="src">Source : Heo et al., Endocrinol Metab 2022;37:870-878 ; Hengeveld et al., Horm Res Paediatr 2021;94:76-80 ; information professionnelle Euthyrox®.</p></template>

<template data-pop="e07-facteurs-liaison" data-title="Facteurs acquis modifiant la liaison des hormones">
<div class="lab">Contenu</div><p>La grossesse et les œstrogènes augmentent la capacité de liaison, d’où des besoins accrus en lévothyroxine pendant la grossesse. Une maladie grave et l’hypoprotéinémie de la cirrhose la diminuent. Le furosémide, les salicylates et les anticoagulants oraux déplacent la thyroxine de ses protéines.</p>
<div class="lab">Application</div><p>Une thyroxine totale doit être lue avec la situation : grossesse, œstrogènes, cirrhose, maladie grave. La thyroxine libre et la thyréostimuline tranchent.</p>
<div class="lab">Limite</div><p>Source suisse unique pour ces facteurs ; hépatite, androgènes et syndrome néphrotique ne sont pas documentés.</p>
<p class="src">Source : information professionnelle suisse Euthyrox®, février 2023.</p></template>

<template data-pop="e07-smnt-meca" data-title="Syndrome de maladie non thyroïdienne : mécanismes">
<div class="lab">Chronologie</div><p>La triiodothyronine chute très vite après un stress (environ 2 heures après une chirurgie abdominale). À l’admission en soins intensifs, la triiodothyronine est basse et la reverse-triiodothyronine élevée chez presque tous les patients ; la triiodothyronine baisse avec la gravité. En maladie critique prolongée, la thyréostimuline est basse ou inappropriément normale par suppression de la thyréolibérine et perte de la pulsatilité.</p>
<div class="lab">Mécanismes</div><p>Central : l’inflammation active NF-κB dans les tanycytes hypothalamiques, augmente la désiodase de type 2, et la triiodothyronine locale supprime la thyréolibérine. Périphérique : désiodase de type 1 hépatique diminuée, type 3 augmentée dans les tissus lésés (hypoxie, ischémie), modifications des protéines de liaison, des transporteurs et des récepteurs. Les cytokines TNF-α, IL-1 et IL-6 participent à la réponse de phase aiguë ; la restriction calorique baisse la leptine et la désiodase de type 1. Le cortisol supprime la thyréolibérine et la thyréostimuline.</p>
<div class="lab">Limite</div><p>Revue et non recommandation ; mécanismes en partie hypothétiques.</p>
<p class="src">Source : Fliers, Bianco, Langouche et Boelen, Lancet Diabetes Endocrinol 2015;3:816-25 ; Gierach et Junik 2026.</p></template>

<template data-pop="e07-smnt-dd" data-title="Maladie non thyroïdienne : diagnostic différentiel">
<div class="lab">Règles</div><p>Une thyréostimuline normale exclut l’hypothyroïdie primaire. Une thyréostimuline élevée avec thyroxine basse évoque l’hypothyroïdie mais s’observe aussi en phase de récupération. La dopamine et les glucocorticoïdes à haute dose abaissent la thyréostimuline. Le rapport triiodothyronine/thyroxine et la reverse-triiodothyronine ont une faible valeur diagnostique.</p>
<div class="lab">Coma myxœdémateux</div><p>Hypothermie, troubles de conscience, thyréostimuline élevée, thyroxine et triiodothyronine basses. Une insuffisance surrénalienne peut coexister : glucocorticoïdes à dose de stress.</p>
<div class="lab">Pronostic</div><p>L’importance du syndrome est associée à la gravité et à la mortalité sans preuve de causalité ; une thyroxine inférieure à 40 nmol/l prédisait la mortalité (sensibilité 75 %, spécificité 80 %) dans une étude.</p>
<p class="src">Source : Fliers et al. 2015.</p></template>

<template data-pop="e07-smnt-traitement" data-title="Maladie non thyroïdienne : traitement">
<div class="lab">Contenu</div><p>Les essais de triiodothyronine ou de thyroxine en maladie critique n’ont pas montré de bénéfice ; aucune recommandation de substitution n’existe. La lévothyroxine se poursuit chez l’hypothyroïdien connu.</p>
<div class="lab">Application</div><p>La conduite consiste à traiter la maladie causale, sans substitution, et à poursuivre la lévothyroxine d’un hypothyroïdien connu.</p>
<p class="src">Source : Fliers et al. 2015.</p></template>

<template data-pop="e07-hemorragie" data-title="Hémorragie de la thyroïde : cas rapportés">
<div class="lab">Cas</div><p>Hémorragie bilatérale post-traumatique sur goitre préexistant, avec déviation trachéale, gérée de façon conservatrice sous surveillance intensive. Hémorragie sous anticoagulation devenue supra-thérapeutique lors d’une maladie aiguë. Hémorragie mortelle exceptionnelle après cytoponction, par compression des voies aériennes et des vaisseaux du cou ; la cytoponction reste un geste très sûr, aux complications le plus souvent mineures.</p>
<div class="lab">Message clinique</div><p>Une tuméfaction cervicale brutale et douloureuse sur goitre, après traumatisme, anticoagulation ou ponction, menace d’abord les voies aériennes.</p>
<div class="lab">Limite</div><p>Cas cliniques seuls, sans recommandation. Aucune source n’a été lue sur l’infarctus thyroïdien, pourtant inclus dans E07.8.</p>
<p class="src">Source : Huang et Lien 2022 ; Dalal et al. 2025 ; Bonsignore et al. 2022.</p></template>

<template data-pop="e07-prematures" data-title="Prématurés de très faible poids et lévothyroxine">
<div class="lab">Contenu</div><p>L’information professionnelle suisse signale l’immaturité de l’axe et une possible insuffisance corticosurrénalienne chez le prématuré de très faible poids, avec un collapsus cardiovasculaire rapporté sous lévothyroxine.</p>
<div class="lab">Application</div><p>Le traitement du prématuré demande une surveillance étroite ; un deuxième prélèvement de dépistage à 10 à 14 jours est conseillé chez les nouveau-nés à risque.</p>
<p class="src">Source : information professionnelle Euthyrox®, février 2023 ; van Trotsenburg et al. 2021.</p></template>

<template data-pop="e07-mnemo" data-title="Aide mnémotechnique : bilan thyroïdien discordant">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Ordre de lecture en trois questions : <b>Libre ?</b> la thyroxine libre est-elle normale ? <b>Stimuline ?</b> la thyréostimuline est-elle normale ? <b>Contexte ?</b> le patient est-il en réanimation, enceinte, sous médicament ? Si la fraction libre et la thyréostimuline sont normales, la thyroxine totale basse n’est pas une maladie thyroïdienne.</p>
<div class="lab">Limite</div><p>Cette aide ne remplace aucun critère diagnostique et ne s’applique ni à la calcitonine ni à la dyshormonogenèse.</p></template>

<template data-pop="e07-sources-guides" data-title="Sources et limites de la leçon">
<div class="lab">Sources</div><p>Classification : OFS 2024, OMS 2019. Hypothyroïdie congénitale : consensus ENDO-ERN, ESPE et ESE 2020-2021 (Thyroid 2021). Cancer médullaire et RET : ETA 2012. Nodules : ETA 2023. Calcitonine : Giovanella 2026, Cochrane 2020, Fugazzola 2020. Médicament : information professionnelle suisse Euthyrox®, février 2023.</p>
<div class="lab">Limites</div><p>Aucune recommandation suisse propre à E07. Texte de l’ESMO 2019 inaccessible. Seuil de thyréostimuline du dépistage suisse non lu. Infarctus thyroïdien sans source ; hémorragie thyroïdienne étayée par des cas. Excès de globuline et causes acquises détaillées non documentés. Plusieurs sources lues en résumé seul. Deux sources d’auteurs américains utilisées seulement pour des faits anatomopathologiques ou épidémiologiques. Information professionnelle du gluconate de calcium (usage diagnostique) non lue.</p>
<div class="lab">Statut</div><p>Audit différé : revue par intelligence artificielle, distincte d’une validation médicale humaine.</p></template>

<template data-pop="pareto-e07-definition" data-title="Pareto — Définitions et épidémiologie">
<p class="ratio" data-cover="e07-1,e07-2"></p><ul><li>E07.0 calcitonine et cellules C ; E07.1 dyshormonogenèse et Pendred ; E07.8 globuline liante, hémorragie, maladie non thyroïdienne ; E07.9 sans précision. Cancer médullaire en C73, dysgénésie en E03.1.</li><li>Hypothyroïdie congénitale primaire 1/3000 à 1/2000 ; dysgénésie 65 % ; récurrence de la dyshormonogenèse 25 %.</li><li>Cancer médullaire parmi les nodules : moins de 0,5 % ; déficit partiel en globuline liante 1/4000.</li></ul></template>
<template data-pop="pareto-e07-mecanismes" data-title="Pareto — Mécanismes et causes">
<p class="ratio" data-cover="e07-3,e07-4"></p><ul><li>Cellules C : calcitonine de 32 acides aminés ; marqueur plus que régulateur ; élevée aussi par causes bénignes (tabac, inhibiteur de la pompe à protons, rein).</li><li>Dyshormonogenèse : défaut de synthèse, hormones basses, thyréostimuline haute, goitre ; un gène par étape.</li><li>Globuline liante : hormones totales basses, libres normales. Maladie non thyroïdienne : triiodothyronine basse par désiodases et thyréolibérine.</li></ul></template>
<template data-pop="pareto-e07-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="e07-5,e07-6"></p><ul><li>Rechercher cancer médullaire ou néoplasie endocrinienne multiple, surdité, goitre familial, maladie aiguë, médicaments.</li><li>Examiner le cou et les voies aériennes ; répéter les tests auditifs chez l’enfant.</li><li>Un examen normal n’exclut ni hyperplasie ni anomalie de transport.</li></ul></template>
<template data-pop="pareto-e07-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="e07-7,e07-8"></p><ul><li>Calcitonine : moins de 10 normale ; 10 à 100 zone grise ; plus de 100 évoque un cancer ; seuils 30 et 34 pg/ml.</li><li>Hypothyroïdie congénitale : traiter avant l’imagerie ; perchlorate au-delà de 10 %.</li><li>Urgences : compression trachéale, hémorragie, coma myxœdémateux, néoplasie endocrinienne multiple 2B.</li></ul></template>
<template data-pop="pareto-e07-prise" data-title="Pareto — Prise en charge et suivi">
<p class="ratio" data-cover="e07-9,e07-10"></p><ul><li>Calcitonine : répéter, stimuler, rechercher RET ; globuline liante et maladie non thyroïdienne : ne pas substituer.</li><li>Lévothyroxine jusqu’à 15 µg/kg/jour avant 2 semaines ; cible basse-normale en dyshormonogenèse.</li><li>Contrôle 4 à 6 semaines après chaque changement de dose ; association pronostique n’est pas causalité.</li></ul></template>
<template data-pop="pareto-e07-situations" data-title="Pareto — Situations particulières">
<p class="ratio" data-cover="e07-11"></p><ul><li>Grossesse et œstrogènes augmentent la liaison et les besoins.</li><li>Prématuré : risque de collapsus sous lévothyroxine.</li><li>Insuffisance rénale : calcitonine 10 à 50 pg/ml, rarement plus de 100.</li></ul></template>
<template data-pop="pareto-e07-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e07-e-1,e07-e-2,e07-e-3,e07-e-4,e07-e-5"></p><ul><li>Calcitonine répétée avec la même méthode ; test au calcium 79 et 466 pg/ml ; procalcitonine hors infection ; cytologie insuffisante seule.</li><li>Hypothyroïdie congénitale : thyréostimuline et thyroxine libre, perchlorate, thyroglobuline, génétique.</li><li>Globuline liante et maladie non thyroïdienne : la thyréostimuline et la thyroxine libre tranchent.</li></ul></template>
<template data-pop="pareto-e07-sciences" data-title="Pareto — Sciences fondamentales">
<p class="ratio" data-cover="e07-s-anat-cours,e07-s-histo-cours,e07-s-physio-cours,e07-s-bioch-cours,e07-s-gene-cours"></p><ul><li>Cellules C produisent la calcitonine ; hyperplasie réactive ou néoplasique.</li><li>Chaîne de synthèse : captation, efflux, peroxyde, organification, recyclage ; un gène par étape.</li><li>Récessif : 25 % ; globuline liante liée à l’X ; RET dominant.</li></ul></template>
<template data-pop="pareto-e07-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e07-p-1,e07-p-2,e07-p-3,e07-p-4"></p><ul><li>Seule la dyshormonogenèse reçoit un traitement de fond : lévothyroxine.</li><li>Séparer de 2 heures des sels et de 4 à 5 heures des résines ; œstrogènes augmentent les besoins.</li><li>Ne pas substituer pour globuline liante ou maladie non thyroïdienne.</li></ul></template>
