<template data-pop="e40-position-suisse" data-title="Régimes sans produits animaux : ce que disent les textes suisses et européens"><h3>Position suisse</h3><p>L’Office fédéral de la sécurité alimentaire et des affaires vétérinaires, sur la base d’instructions rédigées par la Société suisse de pédiatrie (communiqué du 20.02.2020), déconseille l’alimentation végane chez le nourrisson et le jeune enfant. Si les parents la maintiennent, il demande un suivi continu par un spécialiste qualifié en nutrition et des contrôles médicaux réguliers (<a href="https://www.fr.ch/diaf/saav/actualites/nouveaux-outils-de-conseil-sur-lalimentation-vegetarienne-et-vegetalienne-des-enfants-en-bas-age" target="_blank" rel="noopener">communiqué OSAV et SSP, 2020</a>).</p><h3>Position européenne</h3><p>La société européenne de gastroentérologie, hépatologie et nutrition pédiatriques déconseille le régime végan pendant la diversification sans supervision médicale et diététique : position de 2017, reprise en 2025 (<a href="https://doi.org/10.1002/jpn3.70182" target="_blank" rel="noopener">ESPGHAN 2025</a>).</p><h3>Limites</h3><ul><li>Les instructions de la Société suisse de pédiatrie elles-mêmes n’ont pas été lues ; seul le communiqué officiel l’a été.</li><li>Le communiqué ne traite pas les boissons végétales.</li><li>Le texte européen ne traite pas spécifiquement le kwashiorkor.</li></ul><p>Les deux textes sont donc des cadres de prévention, non des recommandations de traitement du kwashiorkor.</p></template>
<template data-pop="e40-histoire-alimentaire" data-title="Faire l’histoire alimentaire"><h3>Méthode</h3><p>Un journal alimentaire, idéalement avec un diététicien, objective l’apport réel (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). Le médecin demande le type de lait (boisson végétale ?), les régimes d’éviction et les conseils non médicaux reçus (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a> ; <a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>).</p><table class="t"><tr><th>Élément à demander</th><th>Pourquoi</th></tr><tr><td>Lait exclusif de nature végétale</td><td>Le riz est associé au kwashiorkor (<a href="https://doi.org/10.20960/nh.931" target="_blank" rel="noopener">Vitoria, Nutr Hosp 2017</a>)</td></tr><tr><td>Raison de l’éviction : intolérance supposée, mode, conseil</td><td>Les raisons retrouvées sont la méconnaissance, l’intolérance supposée, la mode et parfois un conseil « alternatif » (<a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>)</td></tr><tr><td>Éviction pour dermatite atopique</td><td>Régime injustifié à l’origine du cas italien (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a>)</td></tr><tr><td>Durée de l’éviction</td><td>Le cas français est survenu après deux mois de boisson de riz (<a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>)</td></tr></table><p>Le but est de comprendre la cause sans accuser les parents.</p></template>
<template data-pop="e40-signes-danger" data-title="Signes de danger de la prise en charge intégrée de l’enfant"><h3>Liste des signes</h3><p>Les signes de danger de la prise en charge intégrée des maladies de l’enfant sont : l’incapacité à boire ou à téter, des vomissements incoercibles, des convulsions récentes, la léthargie ou l’inconscience, des convulsions actuelles (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, recommandation d’orientation).</p><p>Un seul de ces signes impose l’hospitalisation de l’enfant atteint de malnutrition aiguë sévère. L’OMS 2023 qualifie cette recommandation de conditionnelle, avec une certitude faible.</p></template>
<template data-pop="e40-dermatose" data-title="Dermatose du kwashiorkor"><h3>Aspect</h3><p>La peau est atrophique et sèche, avec des plages confluentes d’hyperkératose et d’hyperpigmentation. Ces plages se fissurent à l’étirement et laissent des érosions sur un fond érythémateux (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><table class="t"><tr><th>Aspect</th><th>Fréquence</th></tr><tr><td>Aspect vernissé</td><td>64 %</td></tr><tr><td>Macules pigmentées érythémateuses</td><td>48 %</td></tr><tr><td>Peau sèche « en dallage »</td><td>28 %</td></tr><tr><td>Hypopigmentation résiduelle</td><td>18 %</td></tr></table><p>Les aspects peuvent coexister. Le mécanisme de la dermatose n’est pas expliqué et il n’existe pas de score standardisé (<a href="https://doi.org/10.1111/jdv.12452" target="_blank" rel="noopener">Heilskov et al., J Eur Acad Dermatol Venereol 2014</a>, résumé).</p><p>Chez l’adulte, la dermatose est eczématiforme ; l’histologie cutanée est évocatrice (<a href="https://doi.org/10.1016/j.annder.2014.11.006" target="_blank" rel="noopener">Boutin et al., Ann Dermatol Vénéréol 2015</a>).</p></template>
<template data-pop="e40-cheveux" data-title="Altérations des cheveux"><h3>Signe clinique</h3><p>Les cheveux sont secs, clairsemés, cassants et dépigmentés, de teinte roux-jaune (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). La classification statistique cite les troubles de la pigmentation de la peau et des cheveux parmi les caractéristiques de la forme grave (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024 (version allemande), bloc E40–E46</a>).</p><p>Ce signe est évocateur mais non spécifique : il ne remplace pas la recherche de l’œdème.</p></template>
<template data-pop="e40-ascite" data-title="Ascite du kwashiorkor et gradient d’albumine"><h3>Pourquoi cette confusion</h3><p>Le gradient d’albumine sérum-ascite est la différence entre l’albumine du sang et celle du liquide d’ascite. Un gradient élevé oriente habituellement vers une hypertension portale. Cette définition relève du rappel de physiologie générale.</p><p>Un cas publié d’adulte après bypass de Roux-en-Y montre qu’une ascite de kwashiorkor a imité une ascite d’hypertension portale avec un gradient élevé (<a href="https://doi.org/10.14309/crj.0000000000002260" target="_blank" rel="noopener">cas d’ascite après chirurgie bariatrique, 2026</a>). Le gradient ne suffit donc pas à exclure une cause nutritionnelle chez un patient aux antécédents bariatriques. Il s’agit d’une observation unique, non d’une règle.</p></template>
<template data-pop="e40-diff-hypoprotidique" data-title="Autres œdèmes avec protéines basses"><h3>Ce qui est établi</h3><p>Les œdèmes avec protéines basses ont plusieurs causes : pertes de protéines par le rein (syndrome néphrotique) ou par l’intestin (entéropathie exsudative), et insuffisance hépatique. Cette liste est un raisonnement du cours : aucune source dédiée à ce diagnostic différentiel n’a été lue.</p><h3>Ce que les sources lues apportent</h3><ul><li>Dans le cas italien, la protéinurie était absente (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a>).</li><li>Une ascite de kwashiorkor a imité une hypertension portale (<a href="https://doi.org/10.14309/crj.0000000000002260" target="_blank" rel="noopener">cas d’ascite après chirurgie bariatrique, 2026</a>).</li><li>L’histoire alimentaire, le contexte et la clinique orientent vers la cause nutritionnelle (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a> ; <a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>).</li></ul><p>Une source dédiée reste à lire pour fonder les critères de distinction. En l’absence de cette source, le cours ne fixe pas de seuil.</p></template>
<template data-pop="e40-electrolytes-phosphate" data-title="Électrolytes, phosphate et magnésium"><h3>Pourquoi les mesurer</h3><p>Ces ions sont mesurés avant et pendant la renutrition, car ils chutent après la reprise de l’alimentation (<a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a>). Le potassium cellulaire est déjà déplété dans le kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><table class="t"><tr><th>Paramètre</th><th>Seuil du consensus pour l’adulte</th><th>Conduite</th></tr><tr><td>Phosphate</td><td>Chute de plus de 30 % sous la normale, ou valeur sous 0,6 mmol/L</td><td>Syndrome probable</td></tr><tr><td>Potassium, phosphate, magnésium</td><td>Deux des trois bas dans les 72 heures</td><td>Syndrome probable</td></tr><tr><td>Potassium sous 2,5 ; phosphate sous 0,32 ; magnésium sous 0,5 mmol/L</td><td>Un des trois</td><td>Électrocardiogramme les 3 premiers jours</td></tr></table><p>Ces seuils concernent l’adulte (<a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>). Aucun seuil pédiatrique n’a été lu.</p></template>
<template data-pop="e40-renutrition-syndrome" data-title="Syndrome de renutrition"><h3>Mécanisme</h3><p>La reprise de l’apport en glucides provoque une décharge d’insuline. Celle-ci fait entrer dans les cellules le potassium, le magnésium et le phosphate, ce qui entraîne hypokaliémie, hypomagnésémie, hypophosphatémie et parfois une défaillance cardiaque (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>).</p><h3>Quand et comment le prévenir</h3><p>Le syndrome survient surtout dans les 72 premières heures ; la phase vulnérable dure jusqu’à 10 jours (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>). La prévention associe une introduction lente des glucides, un apport de phosphate et de thiamine, et une surveillance (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>).</p><p>Chez l’adulte, le consensus suisse et européen fixe l’énergie de départ à 5 à 15 kcal/kg/jour selon le risque, avec un objectif atteint en 5 à 10 jours, une thiamine de 200 à 300 mg au moins 30 minutes avant, des vitamines à 200 % et des oligoéléments à 100 % des apports recommandés. Un sodium inférieur à 1 mmol/kg/jour les premiers jours et une pesée quotidienne complètent la surveillance (<a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>).</p></template>
<template data-pop="e40-choc-liquides" data-title="Choc et liquides chez l’enfant dénutri"><h3>Conduite décrite</h3><p>En cas de choc, la revue de la filiation des recommandations de l’OMS décrit du Ringer lactate ou une solution de Darrow à demi-concentration avec du glucose à 5 %. La surcharge est surveillée toutes les 5 à 10 minutes. Une transfusion de 10 mL/kg est proposée si l’état ne s’améliore pas après une heure ou en cas d’anémie sévère ; il n’y a pas de transfusion après 24 heures (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><h3>Prudence</h3><p>Les liquides par voie intraveineuse sont évités autant que possible. L’expansion volémique agressive est délétère chez l’enfant non dénutri en choc et probablement aussi chez l’enfant dénutri (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p><p>Ces conduites reposent en partie sur l’avis d’experts : 48,5 % des 33 recommandations hospitalières de l’OMS n’ont pas d’autre fondement (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p></template>
<template data-pop="e40-orientation-oms" data-title="Orientation selon l’OMS 2023 : niveaux de preuve"><h3>Les recommandations</h3><table class="t"><tr><th>Recommandation</th><th>Contenu</th><th>Force et certitude</th></tr><tr><td>Admission</td><td>Hospitaliser si signe de danger, problème médical aigu, œdème nutritionnel sévère (+++) ou mauvais appétit (échec du test d’appétit)</td><td>Conditionnelle ; certitude faible</td></tr><tr><td>Recommandation d’orientation</td><td>Évaluation approfondie si problème médical à investiguer, maladie chronique, non-prise de poids en ambulatoire ou épisode antérieur</td><td>Selon la recommandation</td></tr><tr><td>Recommandation d’orientation</td><td>Ambulatoire si bon appétit, aucun signe de danger ni problème aigu</td><td>Selon la recommandation</td></tr><tr><td>Transfert</td><td>Transfert vers l’ambulatoire sans signe de danger depuis 24 à 48 heures, problème résolu, œdème inférieur à +++ et en régression, bon appétit ; décision non anthropométrique</td><td>Forte ; certitude modérée</td></tr><tr><td>Recommandation de sortie</td><td>Sortie : poids pour la taille ≥ −2 écarts-types et périmètre brachial ≥ 125 mm à deux visites, sans œdème à deux visites</td><td>Selon la recommandation</td></tr></table><p>Le test d’appétit n’est pas décrit dans les sources lues. Source : <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>.</p></template>
<template data-pop="e40-sortie-critere" data-title="Critères de sortie du traitement nutritionnel"><h3>Ce que demande l’OMS</h3><p>La sortie du traitement nutritionnel exige un poids pour la taille à −2 écarts-types ou plus et un périmètre brachial à 125 mm ou plus à deux visites consécutives, ainsi que l’absence d’œdème à deux visites consécutives. Le gain pondéral en pourcentage ne sert pas de critère (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, sortie).</p><p>Le choix de deux visites consécutives évite de conclure sur une mesure isolée, qui peut être faussée par l’œdème résiduel ou une variation de pesée. Cette interprétation est un raisonnement du cours.</p></template>
<template data-pop="e40-nutrivigilance" data-title="Déclaration des cas : dispositif français et équivalent suisse"><h3>Recommandation des auteurs français</h3><p>Les auteurs d’une série française de quatre nourrissons recommandent de déclarer ces cas à un dispositif de vigilance nutritionnelle, appelé nutrivigilance en France (<a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>).</p><p>L’équivalent suisse n’a pas été vérifié : c’est une lacune du dossier. Le cours ne prétend donc pas qu’un dispositif suisse existe ni qu’il est obligatoire.</p></template>
<template data-pop="e40-mnemo" data-title="Trois temps : godet, peau, cheveux (aide pédagogique, non critère officiel)"><h3>Aide pédagogique</h3><p>Pour examiner un enfant suspect de kwashiorkor, on peut suivre trois gestes dans l’ordre : le godet au pied, la peau, les cheveux. Le premier pose le diagnostic de malnutrition aiguë sévère, les deux autres le renforcent.</p><p>Cette séquence est une aide pédagogique, non un critère officiel. Les critères formels sont ceux de l’îlot 18.</p></template>
<template data-pop="e40-d-f75" data-title="F-75 : lait thérapeutique de stabilisation"><h3>Composition et posologie</h3><p>Le F-75 apporte 75 kcal et 0,9 g de protéines pour 100 mL (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). À 130 mL/kg/jour, l’enfant reçoit 97,5 kcal/kg/jour ; le produit est pauvre en protéines et en sodium et riche en potassium (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Les repas sont donnés toutes les 2 à 3 heures (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><h3>Preuves et indications</h3><p>L’amélioration attendue est le retour de l’appétit puis la régression de l’œdème (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Il sert aussi à poursuivre l’alimentation après le traitement de l’hypoglycémie (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><h3>Effets indésirables, contre-indications, surveillance</h3><p>Aucune information professionnelle suisse n’a été trouvée pour ce produit. Les sources lues ne détaillent pas ses effets indésirables ni ses contre-indications. La surveillance porte sur l’appétit, l’œdème, la glycémie et les troubles ioniques. En cas d’intolérance, l’OMS ne recommande pas de passer à des formules hydrolysées, faute de preuves (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, formules hydrolysées).</p></template>
<template data-pop="e40-d-f100" data-title="F-100 : lait thérapeutique de réhabilitation"><h3>Composition et posologie</h3><p>Le F-100 apporte 100 kcal et 2,9 g de protéines pour 100 mL. La posologie est de 130 à 200 mL/kg/jour (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). Le rattrapage de croissance commence au-delà de 150 kcal/kg/jour et le gain visé dépasse 10 g/kg/jour (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><h3>Précautions</h3><p>Chez le nourrisson de moins de six mois, le F-100 non dilué est déconseillé : il expose à une surcharge osmotique rénale et à une hypernatrémie (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><p>Aucune information professionnelle suisse n’a été trouvée pour ce produit.</p></template>
<template data-pop="e40-d-atpe" data-title="Aliment thérapeutique prêt à l’emploi"><h3>Rôle et posologie</h3><p>L’aliment thérapeutique prêt à l’emploi (ATPE ; en anglais ready-to-use therapeutic food) remplace progressivement le F-75 en deux à trois jours, avec 100 à 135 kcal/kg/jour pendant la transition (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, recommandation de 2013 reprise). En ambulatoire, l’apport est de 150 à 185 kcal/kg/jour jusqu’à la récupération anthropométrique et la résolution de l’œdème, puis de 100 à 130 kcal/kg/jour quand l’enfant n’est plus sévèrement émacié et n’a plus d’œdème (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, ambulatoire).</p><p>L’allaitement est maintenu et donné avant l’aliment thérapeutique (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Aucune information professionnelle suisse n’a été trouvée pour ce produit.</p></template>
<template data-pop="e40-d-resomal" data-title="ReSoMal et solution de réhydratation orale"><h3>Indication</h3><p>Le ReSoMal (solution de réhydratation pour la malnutrition) est préféré en cas de déshydratation sans choc chez l’enfant atteint de malnutrition aiguë sévère ; à défaut, on utilise une solution de réhydratation orale à basse osmolarité (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, réhydratation).</p><h3>Contre-indication</h3><p>Le ReSoMal n’est pas employé si un choléra est suspecté ou en cas de diarrhée aqueuse profuse : on utilise alors la solution de réhydratation orale standard (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, recommandation de 2013 reprise).</p><p>La composition du ReSoMal n’est pas détaillée dans les sources lues et aucune information professionnelle suisse n’a été trouvée.</p></template>
<template data-pop="e40-d-glucose" data-title="Glucose à 10 %"><h3>Posologie</h3><p>Hypoglycémie chez l’enfant conscient : 50 mL par la bouche ou par sonde, puis du F-75 toutes les 30 minutes pendant 2 heures. Chez l’enfant inconscient, léthargique ou convulsant : 5 mL/kg par voie intraveineuse, puis 50 mL par la bouche (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><h3>Preuves et limites</h3><p>Ces recommandations ne citent pas de preuve (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>). Les effets indésirables et la surveillance glycémique ne sont pas détaillés dans les sources lues.</p></template>
<template data-pop="e40-d-amox" data-title="Amoxicilline : dose de l’OMS et information professionnelle suisse"><h3>Les trois sources</h3><table class="t"><tr><th>Source</th><th>Dose pour l’enfant</th><th>Date</th></tr><tr><td>Dipasquale 2020 (schéma décrit)</td><td>15 mg/kg toutes les 8 heures pendant 5 jours, soit 45 mg/kg/jour</td><td>2020</td></tr><tr><td>Information professionnelle Amoxicilline Spirig HC® (voie orale)</td><td>Enfant de 40 kg ou moins : 50 à 100 mg/kg/jour en 3 à 4 prises, maximum 2 000 mg/jour, dose unitaire maximale 50 mg/kg</td><td>Août 2024</td></tr><tr><td>Information professionnelle Amoxicillin Delbert (voie intraveineuse)</td><td>20 à 200 mg/kg/jour en 3 à 4 doses</td><td>Septembre 2026</td></tr></table><h3>Choix retenu</h3><p>Les textes suisses sont les plus récents et s’appliquent à la prescription en Suisse. La dose de 45 mg/kg/jour du schéma décrit se situe sous la fourchette de 50 à 100 mg/kg/jour de l’information suisse orale : elle ne doit pas être prescrite sans vérifier le texte suisse en vigueur. L’information suisse ne comporte pas d’indication spécifique à la malnutrition. Chez l’enfant de 40 kg ou moins avec insuffisance rénale, la forme parentérale est indiquée (<a href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">information professionnelle Amoxicilline Spirig HC®, août 2024</a>). Avec la forme intraveineuse, une cristallurie est possible si la diurèse est diminuée : on assure une hydratation et une diurèse adéquates (<a href="https://amiko.oddb.org/fr/fi?gtin=7680407120056" target="_blank" rel="noopener">information professionnelle Amoxicillin Delbert, septembre 2026</a>).</p><p>Textes : <a href="https://amiko.oddb.org/fr/fi?gtin=7680667000013" target="_blank" rel="noopener">information professionnelle Amoxicilline Spirig HC®, août 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680407120056" target="_blank" rel="noopener">information professionnelle Amoxicillin Delbert, septembre 2026</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>. Données de mortalité : réduction de 36 % avec l’amoxicilline au Malawi, pas d’effet au Niger (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</p></template>
<template data-pop="e40-d-amp-gent" data-title="Ampicilline, gentamicine et ceftriaxone"><h3>Place</h3><p>Chez l’enfant hospitalisé, l’antibiothérapie parentérale est de règle, historiquement l’ampicilline avec la gentamicine (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, recommandations de 2013 reprises ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><h3>Posologie décrite</h3><p>Ampicilline 50 mg/kg par voie intramusculaire ou intraveineuse toutes les 6 heures pendant 2 jours, puis amoxicilline pendant 5 jours, avec gentamicine 7,5 mg/kg/jour pendant 7 jours. En cas d’échec à 48 heures, la ceftriaxone est donnée à 50 à 75 mg/kg/jour (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>).</p><h3>Limites</h3><p>Les informations professionnelles suisses de la gentamicine et de la ceftriaxone n’ont pas été lues ; leurs doses, contre-indications et interactions ne sont donc pas confrontées ici. Il s’agit d’une lacune du dossier.</p></template>
<template data-pop="e40-d-vita" data-title="Vitamine A"><h3>Posologie</h3><p>La vitamine A est apportée par les aliments thérapeutiques conformes, à environ 5 000 unités internationales par jour. Une dose élevée (50 000 à 200 000 unités internationales selon l’âge) n’est ajoutée que si les aliments ne sont pas enrichis (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, recommandations de 2013 reprises).</p><h3>Preuves</h3><p>Selon les essais cités par la revue de l’OMS, la dose élevée est réservée aux signes oculaires ou à la rougeole (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>). Les effets indésirables ne sont pas détaillés dans les sources lues.</p></template>
<template data-pop="e40-d-micronut" data-title="Micronutriments : cuivre, folates, fer, magnésium, potassium, zinc"><h3>Recommandations décrites</h3><p>Le cuivre, l’acide folique, le fer, le magnésium et le potassium sont donnés quotidiennement pendant au moins deux semaines, sur avis d’experts. Le zinc est ajouté en cas de diarrhée, sauf si les aliments sont enrichis (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a>).</p><h3>Le fer : un moment d’introduction à préciser</h3><p>Chez l’adulte en renutrition, le fer n’est pas donné la première semaine (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>). Pour l’enfant, les sources lues listent le fer parmi les micronutriments quotidiens sans préciser le jour de départ. Cette différence entre populations est une lacune : le cours ne tranche pas pour l’enfant.</p></template>
<template data-pop="e40-d-thiamine" data-title="Thiamine : consensus de renutrition et information professionnelle"><h3>Les deux sources</h3><table class="t"><tr><th>Source</th><th>Contenu</th><th>Date</th></tr><tr><td>Consensus suisse et européen (Reber 2019 ; Friedli 2018)</td><td>Thiamine de 200 à 300 mg au moins 30 minutes avant la renutrition de l’adulte hospitalisé</td><td>2018 et 2019</td></tr><tr><td>Information professionnelle Benerva® (voie orale)</td><td>Carences en thiamine par apport insuffisant, besoins accrus ou malabsorption ; adulte et adolescent de 12 ans ou plus : 100 mg/jour par la bouche en cas de symptômes modérés</td><td>Avril 2019</td></tr></table><h3>Choix retenu</h3><p>Les deux textes répondent à des questions différentes. L’information professionnelle décrit les indications de la spécialité, sans mention de la renutrition ni de posologie pédiatrique (<a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">information professionnelle Benerva®, avril 2019</a>). Le consensus est la seule source lue qui traite spécifiquement la thiamine avant la renutrition. Pour la renutrition de l’adulte, le cours suit donc la dose du consensus (<a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>) et rappelle qu’elle ne provient pas de l’information professionnelle. Le niveau de preuve du consensus est faible. Textes : <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">information professionnelle Benerva®, avril 2019</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a> ; <a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a>.</p></template>
<template data-pop="pareto-e40-notions" data-title="Pareto — Définition, classification et épidémiologie"><p class="ratio" data-cover="e40-0,e40-1,e40-2,e40-3"></p><ul><li>Le kwashiorkor est la forme œdémateuse de la <button class="w" data-k="e40-mas-def">malnutrition aiguë sévère</button> : un œdème bilatéral prenant le godet, débutant aux pieds, suffit au diagnostic, quel que soit le poids.</li><li>Sans œdème, la malnutrition aiguë sévère (6 à 59 mois) est un poids pour la taille sous −3 écarts-types ou un périmètre brachial sous 115 mm.</li><li>Trois formes : marasme, kwashiorkor, kwashiorkor-marasme (émaciation avec œdème). Deux types : primaire (carence d’apport) et secondaire (maladie sous-jacente).</li><li>La <button class="w" data-k="e40-gradation-oedeme">gradation de l’œdème</button> diffère selon les revues : citer la source.</li><li>Létalité hospitalière des formes compliquées : 12 à plus de 20 % ; mortalité élevée après la sortie ; aucune donnée suisse.</li><li>En Suisse : éviction alimentaire, boisson végétale exclusive, mucoviscidose, chirurgie bariatrique.</li></ul></template>
<template data-pop="pareto-e40-meca" data-title="Pareto — Mécanismes du kwashiorkor"><p class="ratio" data-cover="e40-4,e40-5,e40-6"></p><ul><li>Le mécanisme de l’œdème est inconnu ; plusieurs facteurs sont combinés : <button class="w" data-k="e40-hypoalbuminemie">albumine basse</button>, hormones, <button class="w" data-k="e40-pompe">pompe sodium-potassium</button>.</li><li>L’albumine accompagne l’œdème sans le prédire.</li><li>Réponse métabolique mal adaptée : <button class="w" data-k="e40-glycolyse">glycolyse entretenue, protéolyse insuffisante</button>, acides aminés essentiels bas.</li><li>Hypoglycémie fréquente ; stéatose hépatique ; stress oxydatif et microbiote : associations sans causalité démontrée.</li><li>Immunité, intestin, cœur et cerveau sont atteints : infections invasives, malabsorption, prudence avec les liquides.</li></ul></template>
<template data-pop="pareto-e40-clin" data-title="Pareto — Causes, interrogatoire, examen et diagnostic"><p class="ratio" data-cover="e40-7,e40-8,e40-9,e40-10"></p><ul><li>Causes en Suisse : <button class="w" data-k="e40-boissons-vegetales">boisson végétale</button>, <button class="w" data-k="e40-mucoviscidose">mucoviscidose</button>, <button class="w" data-k="e40-bariatrique">chirurgie bariatrique</button> sans suivi.</li><li>Interrogatoire : alimentation, contexte, signes digestifs, chirurgie, <button class="w" data-k="e40-signes-danger">signes de danger</button>.</li><li>Examen : godet au pied (pression de 3 à 5 secondes), périmètre brachial, peau fissurée, cheveux décolorés, abdomen distendu, foie gros.</li><li>Le diagnostic est clinique ; les examens mesurent la gravité et cherchent la cause.</li><li>Écarter les autres œdèmes avec protéines basses : source dédiée non lue.</li></ul></template>
<template data-pop="pareto-e40-pec" data-title="Pareto — Urgences, orientation et prise en charge"><p class="ratio" data-cover="e40-11,e40-12,e40-13,e40-14,e40-15"></p><ul><li>Dangers immédiats : hypoglycémie, hypothermie, déshydratation avec choc, sepsis, troubles électrolytiques, <button class="w" data-k="e40-renutrition-syndrome">syndrome de renutrition</button>.</li><li>Hospitaliser si signe de danger, problème aigu, œdème +++ ou mauvais appétit ; sortir sans œdème à deux visites.</li><li>Stabilisation : <button class="w" data-k="e40-d-f75">F-75</button> à 130 mL/kg/jour, glucose à 10 % en cas d’hypoglycémie, réhydratation par la bouche, liquides intraveineux évités.</li><li>Antibiotiques ; <button class="w" data-k="e40-d-amox">dose suisse de l’amoxicilline</button> à vérifier dans le texte en vigueur.</li><li>Réhabilitation : <button class="w" data-k="e40-d-atpe">aliment thérapeutique prêt à l’emploi</button> à 150 à 185 kcal/kg/jour en ambulatoire.</li><li>Adulte : renutrition selon le consensus suisse et européen, <button class="w" data-k="e40-d-thiamine">thiamine</button> avant.</li></ul></template>
<template data-pop="pareto-e40-crit" data-title="Pareto — Suivi, situations particulières, critères et paramètres"><p class="ratio" data-cover="e40-16,e40-17,e40-18"></p><ul><li>Rechutes et décès après la sortie fréquents ; séquelles neurodéveloppementales ; planifier la sortie dès l’admission.</li><li>Situations particulières : nourrisson de moins de six mois, <button class="w" data-k="e40-vih">VIH</button>, grossesse après bypass, adulte.</li><li>Critères : œdème bilatéral prenant le godet ; périmètre brachial sous 115 mm ou poids pour la taille sous −3 écarts-types ; exclure un autre œdème.</li><li>Sortie : poids pour la taille ≥ −2 écarts-types et périmètre brachial ≥ 125 mm à deux visites, sans œdème.</li></ul></template>
<template data-pop="pareto-e40-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e40-e-1,e40-e-2,e40-e-3,e40-e-4,e40-e-5"></p><ul><li>Standard de référence : l’<button class="w" data-k="e40-oedeme-nutritionnel">œdème nutritionnel</button> clinique, pas un test biologique.</li><li>Mesurer le <button class="w" data-k="e40-anthropometrie">périmètre brachial</button> ; il remplace le poids pour la taille en présence d’œdème.</li><li><button class="w" data-k="e40-albumine-prealbumine">Albumine</button> : sensible à l’hydratation, mesures sériées, pas un seuil diagnostique.</li><li><button class="w" data-k="e40-electrolytes-phosphate">Électrolytes, phosphate, magnésium</button> avant et pendant la renutrition.</li><li>Cause : VIH, test de la sueur, antécédent bariatrique.</li></ul></template>
<template data-pop="pareto-e40-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e40-s-physio-body"></p><ul><li>Le marasme est une adaptation au jeûne ; le kwashiorkor est une adaptation incomplète.</li><li>Glucose produit en moins grande quantité, insuline émoussée : hypoglycémie.</li><li>Œdème : plusieurs facteurs, mécanisme inconnu.</li></ul></template>
<template data-pop="pareto-e40-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e40-s-bioc-body"></p><ul><li>Reprise des glucides : insuline, entrée de potassium, magnésium, phosphate dans les cellules, chute dans le sang.</li><li>Prévention : introduction lente, thiamine avant, ions surveillés.</li><li>Du F-75 au F-100, l’apport protéique est multiplié par plus de trois.</li></ul></template>
<template data-pop="pareto-e40-s-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="e40-s-histo-body"></p><ul><li>Stéatose hépatique, atrophie des villosités et du pancréas, des organes lymphoïdes, du myocarde.</li><li>Peau atrophique, hyperkératosique, hyperpigmentée et fissurée.</li></ul></template>
<template data-pop="pareto-e40-s-immuno" data-title="Pareto — Immunologie et microbiote"><p class="ratio" data-cover="e40-s-immuno-body"></p><ul><li>Thymus atrophié, lymphocytes CD4 bas : infections invasives.</li><li>Microbiote immature : association observée, non traitement.</li><li>Antibiotiques efficaces au Malawi, sans effet au Niger.</li></ul></template>
<template data-pop="pareto-e40-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e40-p-1,e40-p-2,e40-p-3,e40-p-4,e40-p-5"></p><ul><li>Le médicament principal est l’aliment thérapeutique : <button class="w" data-k="e40-d-f75">F-75</button>, <button class="w" data-k="e40-d-f100">F-100</button>, aliment prêt à l’emploi.</li><li>Seules l’amoxicilline et la thiamine ont une information professionnelle suisse lue.</li><li>Précautions : pas de ReSoMal en cas de choléra, pas de remplissage agressif, pas de fer au début chez l’adulte.</li><li>Thiamine de 200 à 300 mg avant la renutrition de l’adulte ; surveillance du phosphate, du potassium et du magnésium.</li></ul></template>
