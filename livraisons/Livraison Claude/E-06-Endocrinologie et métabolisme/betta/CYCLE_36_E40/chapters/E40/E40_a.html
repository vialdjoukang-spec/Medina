<div class="chap-head"><div class="code">E40 — Kwashiorkor · malnutrition aiguë sévère avec œdème nutritionnel · renvois : E41 (marasme), E42 (kwashiorkor-marasme), E45 et E46 · CIM-10-GM 2024 · fragment E-06-Endocrinologie et métabolisme</div>
<h1>Kwashiorkor</h1><span class="status">Enfant surtout, adulte rarement · malnutrition aiguë sévère avec œdème nutritionnel · référentiels : <button class="w" data-k="e40-sources-guides">OMS</button> 2023 ; revues de 2017 et 2020 ; consensus suisse et européen sur le syndrome de renutrition 2018–2019 ; informations professionnelles suisses 2019 à 2026 · état au 15.10.2026, audit différé · revue par intelligence artificielle, validation médicale indépendante en attente</span></div>
<div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la renutrition</button></div>
<div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e40-0">Question clinique</a></li><li><a href="#e40-1">Définition et terminologie</a></li><li><a href="#e40-2">Classifications</a></li><li><a href="#e40-3">Épidémiologie et pronostic</a></li><li><a href="#e40-4">Du jeûne adapté au kwashiorkor : l’œdème</a></li><li><a href="#e40-5">Glucose, foie, stress oxydatif et microbiote</a></li><li><a href="#e40-6">Hormones, immunité, intestin, cœur et cerveau</a></li><li><a href="#e40-7">Causes et facteurs de risque</a></li><li><a href="#e40-8">Interroger</a></li><li><a href="#e40-9">Examiner</a></li><li><a href="#e40-10">Établir le diagnostic et écarter les autres œdèmes</a></li><li><a href="#e40-11">Urgences et complications</a></li><li><a href="#e40-12">Orienter : hôpital ou ambulatoire</a></li><li><a href="#e40-13">Phase de stabilisation</a></li><li><a href="#e40-14">Réhabilitation et sortie</a></li><li><a href="#e40-15">Renutrition en Suisse : l’adulte et les causes secondaires</a></li><li><a href="#e40-16">Suivi, pronostic et prévention</a></li><li><a href="#e40-17">Situations particulières</a></li><li><a href="#e40-18">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="e40-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs. Leurs valeurs biologiques sont reprises de cas publiés, signalés à chaque fois.</p><p>Un nourrisson eczémateux est nourri depuis plusieurs semaines exclusivement d’une boisson de riz, sur le conseil d’une personne extérieure au corps médical. Il présente des œdèmes des deux pieds et des jambes qui gardent l’empreinte du doigt, une peau sèche aux plaques fissurées, des cheveux clairsemés et décolorés, un abdomen distendu. Sa courbe de poids paraît peu abaissée. Dans un cas italien publié, l’<button class="w" data-k="e40-albumine-prealbumine">albumine</button> sérique mesurait 13,65 g/L, les protéines totales 30 g/L et l’hémoglobine 57 g/L (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a>). Ces chiffres suffisent à reconnaître une dénutrition sévère. <b>La question décisive vient ensuite : pourquoi un enfant qui ne paraît pas maigre est-il en danger de mort, et que faut-il faire en premier ?</b></p><p>La réponse tient en deux idées. L’<button class="w" data-k="e40-oedeme-nutritionnel">œdème nutritionnel</button> est le signe pathognomonique de la malnutrition aiguë sévère : il suffit à poser le diagnostic, quelles que soient les mesures de poids et de taille (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a> ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Et la prise en charge ne consiste pas à nourrir vite : elle consiste à corriger d’abord les dangers immédiats (glycémie, température, hydratation, infection), puis à rendre les apports progressivement, car une renutrition brutale provoque des complications propres (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://doi.org/10.1016/j.nut.2017.09.007" target="_blank" rel="noopener">Friedli et al., Nutrition 2018</a>).</p><div class="key"><b>Point de départ.</b> Le cours relie un signe clinique simple, l’œdème bilatéral prenant le godet, à un tableau métabolique et endocrinien complexe. Il s’appuie sur <button class="w" data-k="e40-sources-guides">les sources retenues et leurs limites (recommandation OMS, revues, cas publiés, consensus suisse)</button>. Il ne contient aucune recommandation suisse propre au kwashiorkor, car <button class="w" data-k="e40-lacunes">aucune n’a été trouvée</button>.</div><p>Le chapitre suit l’ordre d’une consultation : définir et classer la maladie (îlots 1 à 3), comprendre ses mécanismes (îlots 4 à 6), chercher la cause et reconnaître le tableau (îlots 7 à 10), décider du traitement (îlots 11 à 15), puis suivre et adapter aux situations particulières (îlots 16 à 18).</p><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023, définitions et recommandations de prise en charge</a> ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien de kwashiorkor sous boisson de riz exclusive</a>.</p></section>
<section class="ilot" id="e40-1"><h2><span class="n">1</span>Définition et terminologie</h2><p>Le kwashiorkor est la forme œdémateuse de la malnutrition aiguë sévère. L’<button class="w" data-k="e40-oedeme-nutritionnel">œdème nutritionnel</button> est un œdème bilatéral qui prend le godet : une pression du doigt laisse une empreinte qui s’efface lentement. Il débute aux pieds, peut remonter vers les jambes puis vers le reste du corps, visage compris. L’<button class="w" data-k="e40-sources-guides">OMS</button> le déclare pathognomonique de la malnutrition aiguë sévère, c’est-à-dire propre à cette maladie dans le contexte d’un enfant dénutri (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>, définitions).</p><p>Le tableau réunit les définitions utilisées dans ce cours. Un <b>écart-type</b> (ET) mesure la distance entre la valeur de l’enfant et la moyenne d’une population de référence ; le <b>z-score</b> est cet écart exprimé en nombre d’écarts-types.</p><table class="t"><tr><th>Terme</th><th>Définition</th><th>Source</th></tr><tr><td>Malnutrition aiguë sévère, 6 à 59 mois</td><td>Œdème nutritionnel, <b>ou</b> poids pour la taille sous −3 ET, <b>ou</b> <button class="w" data-k="e40-anthropometrie">périmètre brachial</button> inférieur à 115 mm</td><td><button class="w" data-k="e40-mas-def">OMS 2023</button></td></tr><tr><td>Malnutrition aiguë modérée</td><td>Poids pour la taille de −3 à moins de −2 ET, ou périmètre brachial de 115 à moins de 125 mm, <b>sans œdème</b></td><td>OMS 2023</td></tr><tr><td>Kwashiorkor</td><td>Synonyme d’œdème nutritionnel ; la forme sans émaciation prédominante</td><td><a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a></td></tr><tr><td>Malnutrition grave de la CIM-10-GM 2024</td><td>Malnutrition grave avec œdème alimentaire et troubles de la pigmentation de la peau et des cheveux</td><td><a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a></td></tr></table><p>L’expression « malnutrition aiguë sévère » a remplacé l’ancienne « malnutrition protéino-énergétique » (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Chez un enfant vulnérable d’une population à risque, la seule présence de l’œdème suffit généralement au diagnostic, quelles que soient les mesures anthropométriques : le poids est en effet augmenté par l’eau retenue et peut sembler peu abaissé.</p><p>La classification statistique nomme la maladie E40 et la distingue du kwashiorkor-marasme, qui relève de E42 : forme intermédiaire, ou signes simultanés de kwashiorkor et de marasme. Elle juge le degré de dénutrition d’ordinaire sur le poids exprimé en écarts-types : grave à 3 écarts-types ou plus sous la moyenne, modérée de 2 à moins de 3, légère de 1 à moins de 2. Une mesure unique ne suffit pas sans autres constatations cliniques ou biologiques ; sans poids disponible, on se fonde sur la clinique (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024 (version allemande), bloc E40–E46</a>). Ce bloc exclut les anémies nutritionnelles (D50 à D53), les séquelles de malnutrition (E64.0), la mort par inanition (T73.0), la malabsorption intestinale (K90) et la cachexie liée au <button class="w" data-k="e40-vih">VIH</button> (B22). Le terme vient d’une langue du Ghana, <button class="w" data-k="e40-etymologie">où il désigne la maladie du sevrage (histoire du mot)</button>.</p><div class="key"><b>À retenir.</b> Œdème nutritionnel = malnutrition aiguë sévère, quel que soit le poids. Sans œdème, il faut des mesures : poids pour la taille sous −3 ET ou périmètre brachial sous 115 mm. L’œdème exclut la forme « modérée ».</div><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023, glossaire et §1.4</a> ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024 (version allemande), bloc E40–E46</a>.</p></section>
<section class="ilot" id="e40-2"><h2><span class="n">2</span>Classifications</h2><h3>Le spectre de la malnutrition aiguë</h3><p>La malnutrition aiguë sévère se présente sous trois formes cliniques. Le marasme est une émaciation sans œdème. Le kwashiorkor est un œdème, avec un poids souvent conservé. Le kwashiorkor-marasme associe l’émaciation et l’œdème (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024 (version allemande), bloc E40–E46</a>). Le tableau situe chaque forme et renvoie à la leçon voisine du fragment, qui n’est pas traitée ici.</p><table class="t"><tr><th>Forme</th><th>Œdème bilatéral</th><th>Émaciation</th><th>Leçon</th></tr><tr><td>Marasme</td><td>Absent</td><td>Prédominante</td><td>E41, leçon voisine</td></tr><tr><td>Kwashiorkor</td><td>Présent</td><td>Non prédominante ; poids masqué par l’eau</td><td>E40, cette leçon</td></tr><tr><td>Kwashiorkor-marasme</td><td>Présent</td><td>Majeure</td><td>E42, leçon voisine</td></tr></table><p>Le marasme est une réponse du corps adaptée au jeûne : le tissu adipeux et le muscle sont consommés pour fournir de l’énergie. Le kwashiorkor correspond à une adaptation incomplète, décrite à l’<button class="w" data-k="e40-glycolyse">îlot 5 (réponse métabolique)</button>.</p><h3>Les grades de l’œdème</h3><p>Les sources ne s’accordent pas sur la gradation de l’œdème. La revue de 2017 décrit trois niveaux : 1+ aux pieds et au bas des jambes, 2+ avec atteinte des bras, 3+ avec atteinte du visage (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). La revue de 2020 décrit quatre grades : I pédieux, II facial, III paravertébral et thoracique, IV avec ascite (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>). L’<button class="w" data-k="e40-sources-guides">OMS</button> 2023 emploie la notation « œdème nutritionnel sévère (+++) » comme critère d’hospitalisation, sans que sa définition littérale des signes +, ++ et +++ ait été lue pour ce cours. Ce cours retient les trois niveaux de 2017, compatibles avec la notation OMS, et présente <button class="w" data-k="e40-gradation-oedeme">la comparaison des deux gradations et le choix retenu</button>.</p><h3>Kwashiorkor primaire et secondaire</h3><table class="t"><tr><th>Type</th><th>Mécanisme de départ</th><th>Contexte typique</th></tr><tr><td>Primaire</td><td>Apport insuffisant en énergie et en protéines, souvent avec infections répétées</td><td>Pays à faibles ressources : pauvreté, insécurité alimentaire, eau et assainissement insuffisants</td></tr><tr><td>Secondaire</td><td>Maladie sous-jacente : malabsorption, besoins accrus, régime restrictif</td><td><button class="w" data-k="e40-mucoviscidose">Mucoviscidose</button>, <button class="w" data-k="e40-bariatrique">chirurgie bariatrique</button>, <button class="w" data-k="e40-boissons-vegetales">boisson végétale utilisée comme lait</button></td></tr></table><p>La distinction commande l’enquête étiologique. Un kwashiorkor primaire demande de corriger l’environnement et de rechercher les infections, dont le <button class="w" data-k="e40-vih">VIH</button>. Un kwashiorkor secondaire en Europe exige de trouver la maladie ou la pratique alimentaire qui l’a produit, faute de quoi la rechute est probable après la renutrition.</p><div class="key"><b>À retenir.</b> Trois formes (marasme, kwashiorkor, kwashiorkor-marasme) ; deux grands types (primaire, secondaire). La gradation de l’œdème diffère selon les revues : citer la source utilisée.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024 (version allemande), bloc E40–E46</a> ; <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>.</p></section>
<section class="ilot" id="e40-3"><h2><span class="n">3</span>Épidémiologie et pronostic</h2><p>En 2016, 52 millions d’enfants de moins de cinq ans étaient émaciés, dont 17 millions sévèrement (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). La charge du kwashiorkor lui-même reste incertaine, car l’œdème est rarement relevé dans les enquêtes. En Afrique australe et orientale, 50 à 70 % des malnutritions aiguës sévères seraient des kwashiorkors. La plupart des enfants atteints sont aussi en retard de croissance, c’est-à-dire de taille trop petite pour l’âge.</p><table class="t"><tr><th>Donnée</th><th>Valeur</th><th>Source et limite</th></tr><tr><td>Létalité hospitalière des formes compliquées</td><td>12 % à plus de 20 %</td><td><a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; revue narrative</td></tr><tr><td>Mortalité hospitalière en Afrique subsaharienne malgré les recommandations</td><td>10 à 40 %</td><td><a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a> ; revue de la filiation des recommandations</td></tr><tr><td>VIH chez les enfants hospitalisés pour malnutrition aiguë sévère, Afrique subsaharienne</td><td>15 à 29 % ; mortalité hospitalière triplée</td><td>Bhutta 2017</td></tr><tr><td>Décès dans les 12 mois après la sortie, au Malawi</td><td>25 % des enfants sortis</td><td>Bhutta 2017 ; Tickell 2016</td></tr></table><p>Ces chiffres expliquent la structure du traitement : une mortalité élevée à l’hôpital justifie une phase de stabilisation rigoureuse, et une mortalité élevée après la sortie justifie le suivi et la prévention des rechutes. Les causes de décès après la sortie citées par la revue sont la pneumonie et la diarrhée (<button class="w" data-k="e40-letalite">détail de la létalité et de ses déterminants</button>).</p><p>Dans les pays à revenu élevé, la maladie est rare. Elle apparaît après des régimes d’éviction, notamment à base de boisson de riz exclusive (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a> ; <a href="https://doi.org/10.20960/nh.931" target="_blank" rel="noopener">Vitoria, Nutr Hosp 2017</a> ; <a href="https://doi.org/10.1016/j.lpm.2012.05.029" target="_blank" rel="noopener">Fourreau et al., Presse Méd 2013</a>), chez des nourrissons atteints de mucoviscidose (<a href="https://doi.org/10.3389/fped.2022.1083155" target="_blank" rel="noopener">cas de mucoviscidose, Front Pediatr 2023</a> ; <a href="https://doi.org/10.1093/tropej/fmz008" target="_blank" rel="noopener">cas de mucoviscidose, J Trop Pediatr 2019</a>), et chez des adultes après chirurgie bariatrique, y compris pendant la grossesse (<a href="https://doi.org/10.1016/j.ejogrb.2025.02.003" target="_blank" rel="noopener">cas belge, Eur J Obstet Gynecol 2025</a> ; <a href="https://doi.org/10.1038/ejcn.2016.15" target="_blank" rel="noopener">cas après bypass, Eur J Clin Nutr 2016</a> ; <a href="https://doi.org/10.1016/j.annder.2014.11.006" target="_blank" rel="noopener">Boutin et al., Ann Dermatol Vénéréol 2015</a>). Au moins trente cas pédiatriques de maladie nutritionnelle liée à la consommation quasi exclusive de boissons végétales ont été publiés : la boisson de riz s’associe au kwashiorkor, la boisson de soja au rachitisme, la boisson d’amande à l’alcalose métabolique (<a href="https://doi.org/10.20960/nh.931" target="_blank" rel="noopener">Vitoria, Nutr Hosp 2017</a>, résumé). <b>Aucune donnée épidémiologique suisse n’a été trouvée</b> ; la fréquence en Suisse ne peut donc pas être chiffrée.</p><div class="key"><b>À retenir.</b> Le kwashiorkor tue surtout par ses complications aiguës et par les rechutes après la sortie. En Suisse, il se rencontre dans un contexte d’éviction alimentaire, de malabsorption ou de chirurgie bariatrique, non de pénurie alimentaire.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">Tickell et Denno, Bull World Health Organ 2016</a> ; <a href="https://doi.org/10.20960/nh.931" target="_blank" rel="noopener">Vitoria 2017, résumé</a> ; <a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien</a> ; <a href="https://doi.org/10.3389/fped.2022.1083155" target="_blank" rel="noopener">cas de mucoviscidose</a>.</p><button class="pareto-btn ui" data-k="pareto-e40-notions">▲ Loi de Pareto — Définition, classification et épidémiologie</button></section>
<section class="ilot" id="e40-4"><h2><span class="n">4</span>Du jeûne adapté au kwashiorkor : l’œdème</h2><p>Le mécanisme exact du kwashiorkor n’est pas connu : l’origine de l’œdème reste indéterminée (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Ce constat n’est pas une lacune de ce cours ; il décrit l’état des connaissances. Il oblige à présenter des hypothèses et leurs limites plutôt qu’une chaîne causale unique.</p><h3>Ce qui devrait retenir l’eau dans les vaisseaux</h3><p>Rappel pédagogique de physiologie générale, non issu des sources du dossier : l’albumine, protéine produite par le foie, reste dans le plasma et y retient l’eau. Si sa concentration baisse beaucoup, l’eau quitte les vaisseaux et s’accumule dans les tissus, d’abord aux endroits déclives comme les pieds. L’explication historique de l’œdème du kwashiorkor suit ce raisonnement, mais les observations la modifient.</p><h3>Les hypothèses, une à une</h3><table class="t"><tr><th>Hypothèse</th><th>Argument en sa faveur</th><th>Limite</th></tr><tr><td>Carence en protéines ou en acides aminés</td><td>Premières descriptions chez des enfants nourris de maïs, régime pauvre en lysine et en tryptophane et riche en glucides (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>)</td><td>Peu d’études identifient une carence spécifique ; les apports ne diffèrent pas nettement entre enfants avec kwashiorkor et enfants émaciés</td></tr><tr><td>Baisse de l’<button class="w" data-k="e40-hypoalbuminemie">albumine sérique</button></td><td>Elle est présente ; la synthèse hépatique d’albumine est réduite</td><td>Son degré et sa correction corrèlent mal avec l’importance de l’œdème et la vitesse de sa résolution</td></tr><tr><td>Facteurs hormonaux</td><td>Hypoalbuminémie, cortisol élevé et incapacité à activer l’hormone antidiurétique (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a>)</td><td>Hypothèse de revue ; mécanisme non démontré</td></tr><tr><td>Rétention de sodium et perte de potassium dans les cellules</td><td>Baisse d’activité de la <button class="w" data-k="e40-pompe">pompe sodium-potassium</button> et perméabilité membranaire accrue (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale et al., Nutrients 2020</a> ; <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>)</td><td>Données anciennes et de petite taille</td></tr></table><p>La lecture du tableau est la suivante. Aucune hypothèse ne suffit seule. L’hypoalbuminémie accompagne l’œdème mais ne l’explique pas entièrement, puisque la remonter ne le fait pas disparaître au même rythme. L’œdème paraît donc résulter de plusieurs facteurs combinés : une albumine basse, une rétention d’eau et de sodium commandée par des hormones, et des cellules incapables de maintenir leurs gradients ioniques.</p><div class="trap"><span class="k">Erreur fréquente</span> Prendre l’albumine sérique pour le critère de guérison de l’œdème. Son degré et sa correction corrèlent mal avec l’importance de l’œdème et la vitesse de sa résolution (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Le cas italien associait une perfusion d’albumine à la renutrition (<a href="https://doi.org/10.1186/s12937-015-0071-7" target="_blank" rel="noopener">cas italien, Nutr J 2015</a>) : cette association ne permet pas d’isoler l’effet de l’albumine seule.</div><div class="key"><b>À retenir.</b> L’œdème est le signe le plus visible et le moins bien compris. L’albumine basse l’accompagne sans le prédire. La conduite repose sur la stabilisation puis sur la renutrition progressive.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017, mécanismes du kwashiorkor</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020, §2 et §3.2</a>.</p></section>
<section class="ilot" id="e40-5"><h2><span class="n">5</span>Glucose, foie, stress oxydatif et microbiote</h2><h3>Une réponse métabolique mal adaptée</h3><p>Chez l’enfant émacié sans œdème, le corps répond au jeûne en dégradant ses graisses (lipolyse) et ses muscles pour produire de l’énergie. Chez l’enfant avec kwashiorkor, un régime riche en glucides et pauvre en protéines entretiendrait la dégradation du glucose, alors que la dégradation des protéines serait trop faible pour fournir les acides aminés essentiels. La protéolyse mesurée est plus basse que dans l’émaciation sévère et les acides aminés essentiels sont plus abaissés (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). <button class="w" data-k="e40-glycolyse">La fenêtre compare les deux réponses</button> et rappelle ce qu’est la glycolyse.</p><h3>Le glucose</h3><p>La production endogène de glucose est réduite dans le kwashiorkor, ce qui explique la fréquence de l’<button class="w" data-k="e40-glucose-hypo">hypoglycémie</button>. La réponse insulinique du pancréas est émoussée, tandis que la sensibilité à l’insuline est probablement conservée (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>). Conséquence clinique : l’enfant ne peut pas attendre longtemps entre deux apports. C’est la raison d’être des repas fréquents de la phase de stabilisation (îlot 13).</p><h3>Le foie, le stress oxydatif et le microbiote</h3><p>La stéatose hépatique est caractéristique du kwashiorkor. Elle n’est pas expliquée par un défaut de sécrétion des lipoprotéines de très basse densité ; une dysfonction mitochondriale et une oxydation des lipides altérée dans le foie sont suspectées (<button class="w" data-k="e40-foie-steatose">stéatose, hépatomégalie et abdomen distendu</button>). Les concentrations de vitamine E et de glutathion sont plus basses, surtout dans le kwashiorkor ; or un grand essai d’antioxydants au Malawi n’a pas réduit l’incidence du kwashiorkor (<button class="w" data-k="e40-stress-oxydatif">ce que prouve et ne prouve pas cette association</button>). Le microbiote intestinal est immature et peu diversifié chez les jumeaux atteints au Malawi, et le transfert de selles à la souris aggrave la perte de poids (<button class="w" data-k="e40-microbiote">observation chez l’humain, démonstration chez la souris</button>).</p><table class="t"><tr><th>Domaine</th><th>Anomalie observée</th><th>Conséquence pour le clinicien</th><th>Limite</th></tr><tr><td>Glucose</td><td>Production endogène réduite ; réponse insulinique émoussée</td><td>Hypoglycémie fréquente ; apports rapprochés</td><td>Mécanisme pancréatique détaillé non établi</td></tr><tr><td>Protéines</td><td>Protéolyse basse ; acides aminés essentiels très abaissés</td><td>Apport protéique contrôlé et progressif</td><td>Données anciennes</td></tr><tr><td>Foie</td><td>Stéatose ; oxydation lipidique altérée suspectée</td><td>Foie gros, palpable</td><td>Cause du dépôt de graisse inexpliquée</td></tr><tr><td>Défenses antioxydantes</td><td>Vitamine E et glutathion bas</td><td>Marqueur, non cible thérapeutique démontrée</td><td>Essai d’antioxydants négatif sur l’incidence</td></tr><tr><td>Microbiote</td><td>Immature, peu divers</td><td>Pas de test ni de traitement validé</td><td>Causalité montrée chez la souris seulement</td></tr></table><div class="trap"><span class="k">Piège</span> Une association n’est pas une cause. Le glutathion bas et le microbiote immature accompagnent le kwashiorkor ; aucun traitement antioxydant ni microbien n’a démontré qu’il le prévient ou le guérit chez l’enfant (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</div><div class="key"><b>À retenir.</b> Le kwashiorkor associe un apport en glucides qui entretient la glycolyse à un catabolisme protéique insuffisant. Les deux conséquences utiles en pratique sont l’hypoglycémie et la stéatose hépatique.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017, métabolisme, foie, stress oxydatif, microbiote</a>.</p></section>
<section class="ilot" id="e40-6"><h2><span class="n">6</span>Hormones, immunité, intestin, cœur et cerveau</h2><p>La malnutrition aiguë sévère n’est pas limitée à l’œdème. Elle modifie la plupart des organes, ce qui explique la diversité des complications.</p><table class="t"><tr><th>Système</th><th>Anomalie décrite</th><th>Conséquence clinique</th><th>Source</th></tr><tr><td><button class="w" data-k="e40-axes-endocriniens">Axes endocriniens</button></td><td>Cortisol normal ou élevé (axe hypothalamo-hypophyso-surrénalien préservé) ; fonction thyroïdienne abaissée ; leptine basse ; triiodothyronine, insuline et facteur de croissance analogue à l’insuline de type 1 bas ; hormone de croissance et cortisol élevés</td><td>Portée clinique de la baisse thyroïdienne incertaine ; leptine basse associée à la mortalité</td><td><a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a></td></tr><tr><td><button class="w" data-k="e40-immunite">Immunité</button></td><td>Atrophie du thymus, des ganglions et des amygdales ; lymphocytes CD4 diminués ; perte de l’hypersensibilité retardée ; phagocytose et IgA sécrétoires réduites</td><td>Infections invasives</td><td>Dipasquale 2020</td></tr><tr><td><button class="w" data-k="e40-intestin">Intestin et pancréas</button></td><td>Atrophie des villosités, perte des disaccharidases, pullulation bactérienne, atrophie pancréatique ; entéropathie environnementale</td><td>Malabsorption ; diarrhée</td><td>Dipasquale 2020 ; Bhutta 2017</td></tr><tr><td><button class="w" data-k="e40-coeur">Cœur</button></td><td>Atrophie myocardique et débit cardiaque réduit décrits ; bradycardie, hypotension, risque d’arythmie avec les troubles électrolytiques</td><td>Prudence avec les liquides ; surveillance des électrolytes</td><td>Bhutta 2017 ; Dipasquale 2020</td></tr><tr><td><button class="w" data-k="e40-cerveau">Cerveau</button></td><td>Atrophie cérébrale et irritabilité dans le kwashiorkor (apathie dans l’émaciation)</td><td>Retard neurodéveloppemental possible</td><td>Bhutta 2017</td></tr></table><p>La lecture du tableau relie chaque anomalie à une décision. L’atteinte immunitaire explique que l’infection grave soit fréquente et soit traitée par antibiotiques d’emblée chez l’enfant hospitalisé (îlot 13). L’atteinte intestinale explique la diarrhée et la malabsorption, qui retardent la récupération. L’atteinte cardiaque et le risque d’arythmie expliquent la surveillance des électrolytes et la crainte de la surcharge liquidienne. Les dosages hormonaux décrits sont des constats ; les sources lues n’en tirent pas de conduite thérapeutique.</p><div class="alert"><b>Danger lié à ces mécanismes.</b> Un enfant atteint de kwashiorkor peut avoir un cœur affaibli et une diarrhée profuse. Le choc doit donc être traité avec des volumes mesurés et une surveillance rapprochée (îlot 11), car l’expansion volémique agressive est délétère chez l’enfant non dénutri en choc et probablement aussi chez l’enfant dénutri (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a>).</div><div class="key"><b>À retenir.</b> Immunité, intestin, cœur, cerveau et axes endocriniens sont tous touchés. Retenez surtout la fragilité immunitaire et la fragilité cardiaque : elles commandent les antibiotiques et la prudence avec les liquides.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020, §2 et §3.3</a>.</p><button class="pareto-btn ui" data-k="pareto-e40-meca">▲ Loi de Pareto — Mécanismes du kwashiorkor</button></section>
