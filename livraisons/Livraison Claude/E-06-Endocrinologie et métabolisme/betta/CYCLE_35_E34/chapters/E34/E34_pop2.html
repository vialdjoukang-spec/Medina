<template data-pop="e34-tachyphylaxie" data-title="Tachyphylaxie et syndrome carcinoïde réfractaire">
<div class="lab">Définition du réfractaire</div><p>Symptômes persistants et 5-HIAA élevé malgré un analogue de la somatostatine à la dose maximale de l’autorisation de mise sur le marché. On exclut d’abord un problème d’administration, une tachyphylaxie, une insuffisance pancréatique induite, une infection, une fibrose mésentérique, une diarrhée post-résection ; le cœur est réévalué (ENETS 2022).</p>
<div class="lab">Tachyphylaxie</div><p>Aggravation 2 à 3 semaines après l’injection. Réponses : intervalles raccourcis, octréotide LAR 60 mg toutes les 4 semaines ou changement d’analogue. L’escalade améliore les symptômes dans environ 80 % des cas, le 5-HIAA dans 29 % seulement.</p>
</template>
<template data-pop="e34-telotristat" data-title="Télotristat éthyle — Xermelo">
<div class="lab">Mécanisme</div><p>Inhibiteur de la tryptophane hydroxylase, enzyme limitante de la synthèse de sérotonine ; il diminue la production de sérotonine et les symptômes (information professionnelle suisse de Xermelo).</p>
<div class="lab">Indication et dose</div><p>Diarrhée du syndrome carcinoïde insuffisamment contrôlée par un analogue de la somatostatine, en association. 250 mg trois fois par jour ; réponse généralement dans les 12 premières semaines, à réévaluer sinon ; pas de dose plus élevée en raison de l’accumulation.</p>
<div class="lab">Insuffisance hépatique</div><p>250 mg deux fois par jour en classe A de Child-Pugh, une fois par jour en classe B, non recommandé en classe C.</p>
<div class="lab">Surveillance</div><p>Enzymes hépatiques, constipation, dépression.</p>
</template>
<template data-pop="e34-hepatique" data-title="Traitements hépatiques du syndrome carcinoïde">
<div class="lab">Moyens</div><p>Embolisation, chimio-embolisation, radio-embolisation, résection hépatique : contrôle jusqu’à 75 % des symptômes.</p>
<div class="lab">Contre-indications</div><p>Réserve hépatique limitée, ascite, insuffisance cardiaque droite sévère (ENETS 2022).</p>
<div class="lab">Risque</div><p>L’embolisation hépatique est un déclencheur de crise carcinoïde : une couverture par octréotide est nécessaire.</p>
</template>
<template data-pop="e34-prrt" data-title="Radiothérapie interne vectorisée au 177Lu-DOTATATE">
<div class="lab">Indication</div><p>Syndrome carcinoïde avec tumeur positive aux récepteurs de la somatostatine (ENETS 2022).</p>
<div class="lab">Efficacité</div><p>Baisse du 5-HIAA de plus de 30 % chez 56 % des patients.</p>
<div class="lab">Précaution</div><p>La procédure est un déclencheur de crise carcinoïde : l’analogue est interrompu 8 à 24 heures avant et repris 8 à 24 heures après.</p>
</template>
<template data-pop="e34-valve" data-title="Remplacement valvulaire dans la cardiopathie carcinoïde">
<div class="lab">Indication</div><p>Atteinte sévère symptomatique avec survie attendue d’au moins 12 mois. Une dilatation ventriculaire droite isolée asymptomatique ne suffit pas (ENETS 2022).</p>
<div class="lab">Choix</div><p>Bioprothèses préférées ; valve-in-valve percutanée en cas de bioprothèse dégénérée ; anticoagulation 3 à 6 mois après bioprothèse.</p>
<div class="lab">Pronostic</div><p>Survie après chirurgie (cohorte de 240 patients) : 69 % à 1 an, 48 % à 3 ans, 34 % à 5 ans. Perfusion d’octréotide 12 heures avant l’intervention ; viser un 5-HIAA inférieur à 300 µmol/24 h.</p>
</template>
<template data-pop="e34-genotropin" data-title="Somatropine — Genotropin">
<div class="lab">Indications suisses</div><p>Déficit démontré en hormone de croissance, syndrome de Turner, insuffisance rénale chronique, syndrome de Prader-Willi avec diagnostic génétique, enfants nés petits pour l’âge gestationnel sans rattrapage à 2 ans ; chez l’adulte, déficit en hormone de croissance (information professionnelle suisse de Genotropin).</p>
<div class="lab">Autres usages en Suisse</div><p>Noonan et SHOX ; prise en charge par l’assurance-invalidité pour le Noonan après confirmation génétique ; hormone non remboursée pour une mutation du gène ACAN (Noordam 2023).</p>
<div class="lab">Limite</div><p>Les doses de Genotropin n’ont pas été lues dans le dossier (lacune).</p>
</template>
<template data-pop="e34-sga-age" data-title="Contentieux : âge de début de la somatropine chez l’enfant petit pour l’âge gestationnel">
<div class="lab">Le désaccord</div><p>L’information professionnelle suisse de Genotropin indique les enfants nés petits pour l’âge gestationnel <b>sans rattrapage à 2 ans</b>. L’article suisse de Noordam (Pädiatrie 2023) parle d’un début <b>à partir de 4 ans</b>.</p>
<div class="lab">Choix retenu</div><p>Selon la règle du projet, la source primaire applicable la plus récente l’emporte pour une prescription ; l’information professionnelle est le texte réglementaire. Elle fait foi pour l’indication, tandis que l’article est un commentaire de pratique qui explique pourquoi un début plus tardif peut être choisi.</p>
<div class="lab">Limite</div><p>Le texte de l’information professionnelle a été consulté le 15 octobre 2026 sur AmiKo ; sa date de révision n’est pas relevée dans le dossier. Le prescripteur confirme le texte en vigueur.</p>
</template>
<template data-pop="e34-mecasermine" data-title="Mécasermine : IGF-1 recombinant">
<div class="lab">Indication</div><p>Approuvée par l’agence européenne pour le déficit primaire sévère en IGF-1. L’hypoglycémie est l’effet indésirable le plus fréquent, avec un risque accru dans le Laron ou en cas d’hypoglycémie préalable (Saavedra et Bang 2026).</p>
<div class="lab">Contre-indication</div><p>Néoplasie active ou suspectée (AWMF 2023).</p>
<div class="lab">Limite</div><p>Le statut suisse du produit n’a pas été établi (lacune).</p>
</template>
<template data-pop="e34-hormones-sexuelles" data-title="Haute taille : stéroïdes sexuels">
<div class="lab">Garçons</div><p>Taille prédite supérieure à 202 cm : enanthate de testostérone 500 mg par voie intramusculaire tous les 14 jours jusqu’à une vitesse inférieure à 1 cm/an. Gain moyen d’environ 5 cm si l’âge osseux est inférieur à 14,5 ans ; pas de trouble de fertilité connu.</p>
<div class="lab">Filles</div><p>Taille prédite supérieure à 185 cm : éthinylestradiol 0,1 mg/j avec un progestatif 10 à 14 jours par mois. Gain d’environ 5 cm si l’âge osseux est inférieur à 13,0 ans ; fertilité diminuée dans trois études.</p>
<div class="lab">Décision</div><p>Indication psychosociale, sans consensus ; la décision vient du patient et des parents, avec consentement écrit (AWMF 2022).</p>
</template>
<template data-pop="e34-epiphysiodese" data-title="Épiphysiodèse des cartilages péri-genou">
<div class="lab">Principe</div><p>Intervention orthopédique qui arrête la croissance au niveau des cartilages de croissance autour du genou. Elle est aussi efficace que le traitement hormonal (AWMF 2022).</p>
<div class="lab">Limites</div><p>Douleurs du genou fréquentes ; pas de disproportion. L’intervention est réalisée en centre orthopédique.</p>
</template>
<template data-pop="e34-cne" data-title="Commission nationale d’éthique, avis 20/2012">
<div class="lab">Principe</div><p>Les décisions sont prises en équipe multidisciplinaire avec les parents et, si possible, l’enfant. Les décisions irréversibles et différables, chirurgie génitale ou ablation des gonades, sont reportées jusqu’à ce que la personne décide, sauf indication médicale urgente, par exemple un risque cancéreux accru (CNE 2012).</p>
<div class="lab">Soutien</div><p>Soutien psychosocial gratuit dès la suspicion jusqu’à l’âge adulte ; concentration dans quelques centres spécialisés.</p>
<div class="lab">Limite</div><p>Une indication psychosociale seule ne justifie pas une chirurgie irréversible.</p>
</template>
<template data-pop="e34-gonadectomie" data-title="Contentieux : moment de la gonadectomie dans l’insensibilité complète aux androgènes">
<div class="lab">Le désaccord</div><p>La revue de Batista (Brésil, 2018) décrit une gonadectomie habituellement précoce, avec un risque tumoral de 0,8 à 22 % dans la forme complète. L’AWMF 2025 (plus récente, européenne) recommande de <b>conserver les gonades jusqu’à la majorité</b> : le risque tumoral n’est pas accru jusqu’à la puberté, et la discussion de la surveillance suit ensuite.</p>
<div class="lab">Choix retenu</div><p>La source primaire applicable la plus récente l’emporte : l’AWMF 2025. Elle est concordante avec l’avis suisse 20/2012 de la Commission nationale d’éthique, qui reporte l’ablation des gonades jusqu’à ce que la personne décide, sauf risque cancéreux accru.</p>
<div class="lab">Texte plus ancien</div><p>Le texte de Batista reste accessible : il fait comprendre pourquoi la gonadectomie précoce a longtemps été la pratique. La fourchette 0,8–22 % montre l’incertitude de l’estimation du risque.</p>
<div class="lab">Limite</div><p>L’IRM et l’échographie ne détectent pas la néoplasie germinale in situ : la conservation exige une surveillance clinique régulière à vie, et le choix final revient à la personne informée (AWMF 2025).</p>
</template>
<template data-pop="e34-lonafarnib" data-title="Lonafarnib : inhibiteur de la farnésyltransférase">
<div class="lab">Principe</div><p>La progérine reste farnésylée de façon permanente. Le lonafarnib inhibe la farnésyltransférase et améliore l’atteinte vasculaire et la survie (Ali 2026).</p>
<div class="lab">Limite</div><p>Le statut suisse et la dose n’ont pas été établis dans le dossier (lacune).</p>
</template>
<template data-pop="e34-dose-initiale" data-title="Contentieux : dose initiale des analogues de la somatostatine (ENETS 2022 contre information suisse)">
<div class="lab">Le désaccord</div><p>La recommandation ENETS 2022 propose d’emblée l’octréotide LAR à 30 mg ou le lanréotide Autogel à 120 mg toutes les 4 semaines. Les informations professionnelles suisses (Sandostatine LAR et Somatuline Autogel) commencent à 20 mg et à 60 mg.</p>
<div class="lab">Choix retenu</div><p>Pour la prescription en Suisse, la source primaire applicable la plus récente est l’information professionnelle : on débute à 20 mg d’octréotide LAR ou 60 mg de lanréotide, puis on ajuste. Le texte ENETS 2022 documente la pratique de centres experts ; il ne remplace pas l’information approuvée.</p>
<div class="lab">Ce que l’information suisse permet</div><p>Octréotide LAR : réduction à 10 mg si le contrôle est atteint à 3 mois, augmentation à 30 mg si contrôle partiel. Lanréotide : maximum 120 mg tous les 28 jours, entretien possible à 120 mg tous les 42 ou 56 jours. Les doses de la recommandation sont donc atteignables dans le cadre suisse par l’escalade.</p>
<div class="lab">Limite</div><p>Le texte de l’information professionnelle a été consulté le 15 octobre 2026 sur AmiKo ; sa date de révision n’est pas relevée dans le dossier. Le prescripteur confirme le texte en vigueur.</p>
</template>
<template data-pop="e34-octreotide-lar" data-title="Octréotide LAR — Sandostatine LAR">
<div class="lab">Indication</div><p>Tumeurs gastro-entéro-pancréatiques fonctionnelles : carcinoïdes, VIPomes (information professionnelle suisse).</p>
<div class="lab">Dose</div><p>20 mg toutes les 4 semaines par voie intramusculaire profonde fessière ; octréotide sous-cutané poursuivi jusqu’à 2 semaines après la première injection ; réduction à 10 mg si contrôle à 3 mois, augmentation à 30 mg si contrôle partiel ; supplément sous-cutané lors des jours d’aggravation.</p>
<div class="lab">Mises en garde</div><p>Voir la fenêtre sur les effets des analogues de la somatostatine.</p>
</template>
<template data-pop="e34-lanreotide" data-title="Lanréotide — Somatuline Autogel">
<div class="lab">Indication</div><p>Symptômes des tumeurs neuroendocrines (information professionnelle suisse).</p>
<div class="lab">Dose</div><p>60 mg tous les 28 jours, maximum 120 mg tous les 28 jours ; entretien possible à 120 mg tous les 42 ou 56 jours. Voie sous-cutanée profonde.</p>
</template>
<template data-pop="e34-octreotide-sc" data-title="Octréotide sous-cutané — Sandostatine">
<div class="lab">Indication</div><p>Tumeurs gastro-entéro-pancréatiques. Efficacité suffisamment documentée pour les carcinoïdes, les VIPomes et les glucagonomes (information professionnelle suisse).</p>
<div class="lab">Dose</div><p>0,05 mg 1 à 2 fois par jour, jusqu’à 0,2 mg 3 fois par jour ; arrêt après une semaine en cas d’échec ; traitement symptomatique et non curatif.</p>
</template>
<template data-pop="e34-ass-effets" data-title="Effets des analogues de la somatostatine : voies biliaires et glucose">
<div class="lab">Voies biliaires</div><p>Lithiase biliaire dans 15 à 30 % sous octréotide sous-cutané, contre 5 à 20 % dans la population générale. Insuffisance pancréatique exocrine dans 5 à 15 % au long cours (Sandostatine ; ENETS 2022).</p>
<div class="lab">Glucose</div><p>Hyperglycémie postprandiale possible ; baisse des besoins en insuline et hypoglycémies dans le diabète de type 1 ; aggravation des hypoglycémies dans l’insulinome, car l’inhibition de l’hormone de croissance et du glucagon est plus forte que celle de l’insuline.</p>
</template>
<template data-pop="pareto-e34-bases" data-title="Pareto — Définitions, épidémiologie, physiopathologie">
<p class="ratio" data-cover="e34-0,e34-1,e34-2,e34-3"></p><ul><li>E34 réunit des maladies distinctes : syndrome carcinoïde, hypersécrétions, petite et haute taille, résistance aux androgènes, progéria.</li><li>Syndrome carcinoïde : diarrhée et/ou flush avec 5-HIAA élevé ; il apparaît quand les médiateurs échappent au foie.</li><li>Prévalence parmi les tumeurs neuroendocrines : 19 à 35 % ; survie 4,7 ans contre 7,1 ans.</li><li>Petite taille : sous le 3e percentile ; pathologique si la vitesse est sous le 25e percentile.</li></ul></template>
<template data-pop="pareto-e34-clinique" data-title="Pareto — Causes, anamnèse, examen, diagnostic">
<p class="ratio" data-cover="e34-4,e34-5,e34-6,e34-7"></p><ul><li>Faux positifs du 5-HIAA : aliments sérotoninergiques, inhibiteurs de la recapture de la sérotonine, paracétamol.</li><li>NT-proBNP supérieur à 260 pg/ml : échocardiographie ; en dessous, valeur prédictive négative de 97 %.</li><li>Fille de petite taille : caryotype obligatoire.</li><li>Aménorrhée primaire avec hernie inguinale : penser à l’insensibilité aux androgènes.</li></ul></template>
<template data-pop="pareto-e34-prise" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="e34-8,e34-9"></p><ul><li>Première ligne du syndrome carcinoïde : analogue de la somatostatine ; la dose initiale suisse est de 20 mg (octréotide LAR) ou 60 mg (lanréotide).</li><li>Crise carcinoïde : octréotide préventif 12 heures avant tout geste ; aucun geste avant le bilan cardiaque.</li><li>Gonades conservées jusqu’à la majorité dans l’insensibilité complète aux androgènes.</li><li>Haute taille constitutionnelle : indication psychosociale, consentement écrit.</li></ul></template>
<template data-pop="pareto-e34-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="e34-10,e34-11"></p><ul><li>Cardiopathie carcinoïde : NT-proBNP et échocardiographie tous les 6 à 12 mois à vie.</li><li>5-HIAA inférieur à 300 µmol/24 h pour limiter le risque cardiaque.</li><li>Télotristat : dose réduite selon Child-Pugh ; non recommandé en classe C.</li><li>Analogues de la somatostatine : surveiller la glycémie chez le diabétique et dans l’insulinome.</li></ul></template>
<template data-pop="pareto-e34-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e34-e-1,e34-e-2,e34-e-3,e34-e-4,e34-e-5"></p><ul><li>5-HIAA urinaire des 24 heures : test pivot du syndrome carcinoïde ; deux recueils préférés.</li><li>La chromogranine A ne distingue pas les tumeurs avec et sans syndrome.</li><li>TEP aux récepteurs de la somatostatine pour le bilan corps entier.</li><li>Âge osseux, taille cible et caryotype triant la petite taille.</li></ul></template>
<template data-pop="pareto-e34-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e34-s-anat-cours"></p><ul><li>Veine porte, foie, veines hépatiques, cœur droit : le circuit explique le syndrome.</li><li>Les valves droites sont les plus touchées ; le cœur gauche exige un foramen ovale perméable ou une tumeur pulmonaire.</li><li>Forme complète d’insensibilité aux androgènes : testicules abdominaux ou inguinaux, pas d’utérus, vagin borgne.</li></ul></template>
<template data-pop="pareto-e34-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="e34-s-histo-cours"></p><ul><li>Tumeur neuroendocrine bien différenciée à l’origine du syndrome.</li><li>Plaques fibreuses sur les valves droites.</li><li>La néoplasie germinale in situ n’est pas détectée par l’imagerie.</li></ul></template>
<template data-pop="pareto-e34-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e34-s-physio-cours"></p><ul><li>Le foie inactive les hormones portales ; le contournement crée le syndrome.</li><li>Laron : récepteur de l’hormone de croissance défaillant, IGF-1 bas.</li><li>Insensibilité aux androgènes : testostérone élevée sans effet.</li></ul></template>
<template data-pop="pareto-e34-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e34-s-bioch-cours"></p><ul><li>Tryptophane, sérotonine, 5-HIAA : enzyme limitante TPH.</li><li>Télotristat : inhibiteur de la TPH périphérique.</li><li>Progérine : lamine A farnésylée en permanence ; lonafarnib.</li></ul></template>
<template data-pop="pareto-e34-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="e34-s-gen-cours"></p><ul><li>Récepteur des androgènes : lié à l’X, 30 % de mutations de novo.</li><li>LMNA c.1824C&gt;T de novo dans la progéria.</li><li>Cause génétique dans environ 15 % des petites tailles idiopathiques.</li></ul></template>
<template data-pop="pareto-e34-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e34-p-1,e34-p-2,e34-p-3,e34-p-4"></p><ul><li>Analogues de la somatostatine : lithiase biliaire, glycémie ; dose initiale suisse 20 mg ou 60 mg.</li><li>Télotristat : 250 mg trois fois par jour avec un analogue.</li><li>Mécasermine : hypoglycémie ; statut suisse non établi.</li><li>Stéroïdes sexuels de la haute taille : indication psychosociale ; fertilité de la fille diminuée.</li></ul></template>
