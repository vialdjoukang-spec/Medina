<section class="ilot" id="e34-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Cette rubrique rassemble des maladies que l’endocrinologie ne sait pas ranger ailleurs. Trois consultations, toutes fictives, en montrent l’étendue. Dans la première <b>vignette fictive</b>, une femme de 58 ans consulte pour des diarrhées depuis huit mois et des accès de rougeur du visage et du cou, secs, sans sueurs. Une masse hépatique a été vue à l’échographie. Elle pose la question d’un <button class="w" data-k="e34-carcinoide">syndrome carcinoïde (définition, médiateurs et diagnostic)</button> : la tumeur est-elle la cause, et le cœur est-il déjà touché (ENETS 2022) ?</p>
<p>Dans la deuxième vignette, un garçon de 9 ans mesure 118 cm. Sa taille est inférieure au troisième percentile, ses parents sont petits et sa croissance suit une courbe parallèle à la norme. Le médecin doit décider entre <button class="w" data-k="e34-petite-taille">petite taille (variante normale ou maladie)</button> familiale et maladie à rechercher (AWMF 2023). Dans la troisième, une jeune fille de 16 ans n’a jamais eu de règles. Elle a une poitrine développée, peu de poils pubiens et un vagin court. Une <button class="w" data-k="e34-hernie">hernie inguinale opérée dans l’enfance (indice d’un caryotype 46,XY)</button> a été notée. L’hypothèse est une <button class="w" data-k="e34-ais">insensibilité aux androgènes (récepteur, formes complète et partielle)</button> (AWMF 2025).</p>
<p>Le cours répond à quatre décisions : reconnaître l’entité parmi des tableaux qui n’ont en commun que leur caractère endocrinien ; confirmer le diagnostic par le test dont la valeur est établie ; traiter ce qui menace le pronostic, notamment le cœur droit dans le syndrome carcinoïde ; enfin décider en temps utile, ou différer, les gestes irréversibles chez l’enfant, notamment l’ablation des gonades.</p>
<div class="key"><b>À retenir.</b> Le code E34 n’est pas une maladie. C’est un ensemble de maladies à traiter une par une : chacune a sa définition, son test et sa conduite propres. Reconnaître l’entité est la première décision, et la plus utile à l’examen.</div>
</section>

<section class="ilot" id="e34-1"><h2><span class="n">1</span>Définitions et périmètre</h2>
<p>La classification suisse des diagnostics, c’est-à-dire la <button class="w" data-k="e34-cim">CIM-10-GM 2024 (version publiée par l’Office fédéral de la statistique)</button>, réunit sous le code E34 neuf sous-rubriques que le texte officiel désigne comme « autres troubles endocriniens ». Ce sont, dans l’ordre : le syndrome carcinoïde ; les autres hypersécrétions d’hormones intestinales ; la sécrétion hormonale ectopique ; l’insuffisance staturale ; la haute stature constitutionnelle ; le syndrome de résistance aux androgènes, avec ses formes partielle, totale et sans précision ; les autres troubles endocriniens précisés, qui incluent la progéria et la dysfonction de la glande pinéale ; enfin l’anomalie endocrinienne sans précision. Ce cours suit un plan monographique par entité, et non l’ordre des sous-codes (OFS, CIM-10-GM 2024 ; BfArM, CIM-10-GM 2024).</p>
<table class="t"><thead><tr><th>Entité</th><th>Définition de travail</th><th>Ce qui la distingue</th></tr></thead><tbody>
<tr><td>Syndrome carcinoïde</td><td>Diarrhée chronique et/ou <button class="w" data-k="e34-flush">flush (rougeur paroxystique)</button> avec élévation de la sérotonine systémique ou de son métabolite, l’acide 5-hydroxyindolacétique (<button class="w" data-k="e34-5hiaa">5-HIAA (dosage urinaire, normes, faux positifs)</button>), après exclusion d’autres causes (ENETS 2022).</td><td>Un seul syndrome clinique avec un marqueur biologique ; il naît d’une <button class="w" data-k="e34-tne">tumeur neuroendocrine (TNE) (bien différenciée, sites et fonction)</button>.</td></tr>
<tr><td>Hypersécrétions d’hormones intestinales et sécrétion ectopique</td><td>Syndrome clinique <b>et</b> preuve biochimique d’une élévation hormonale inappropriée (ENETS 2023) ; ou sécrétion de substances bioactives par des cellules tumorales qui ne reflète pas la physiologie du tissu (Reisch et Reincke 2018).</td><td>L’hormone est produite hors de sa glande habituelle ou en excès par une tumeur.</td></tr>
<tr><td>Petite taille (insuffisance staturale)</td><td>Taille inférieure au 3e percentile ; la croissance est pathologique si la vitesse est inférieure au 25e percentile avec une progression (AWMF 2023).</td><td>La petite taille non progressive, familiale, est bien plus fréquente et constitue une variante normale.</td></tr>
<tr><td>Haute taille constitutionnelle</td><td>Taille supérieure au 97e percentile ; croissance pathologique si la vitesse reste durablement supérieure au 75e percentile (AWMF 2022).</td><td>Une haute taille non progressive est une variante normale ; une maladie dominante comme le syndrome de Marfan peut se cacher derrière une haute taille « familiale ».</td></tr>
<tr><td>Résistance aux androgènes</td><td>Variante du développement sexuel 46,XY par défaut d’action des androgènes sur leur récepteur, de forme complète, partielle ou légère (AWMF 2025 ; Batista 2018).</td><td>Le testicule produit les hormones, mais les tissus cibles n’y répondent pas.</td></tr>
<tr><td>Progéria de Hutchinson-Gilford</td><td>Mutation de novo du gène LMNA produisant une lamine A tronquée appelée progérine, avec retard de croissance, lipodystrophie et maladie vasculaire précoce (Ali 2026).</td><td>Vieillissement accéléré ; la mort est surtout cardiovasculaire.</td></tr>
</tbody></table>
<p>Ces six entités ont des pronostics très différents. Il faut donc nommer l’entité dont on parle avant de parler de traitement ou de pronostic.</p>
<div class="trap"><span class="k">Piège</span> La classification exclut explicitement de E34 des diagnostics proches : le pseudohypoparathyroïdisme (rubrique E20.1) ; pour la petite taille, le nanisme hypophysaire (E23.0), la petite taille achondroplasique ou hypochondroplasique (Q77.4), alimentaire (E45), rénale (N25.0), avec déficit immunitaire (D82.2), les syndromes dysmorphiques spécifiques et le syndrome de Silver-Russell (Q87.1). Le syndrome carcinoïde peut aussi être codé en supplément pour signaler l’activité fonctionnelle d’une tumeur carcinoïde. Retenir le périmètre évite de classer en E34 une petite taille dont la cause est déjà nommée (BfArM, CIM-10-GM 2024).</div>
<div class="key"><b>À retenir.</b> Le terme « carcinoïde », introduit en 1907 pour des tumeurs digestives de meilleur pronostic que les adénocarcinomes, est abandonné dans la nomenclature des tumeurs mais reste usuel en clinique pour désigner le syndrome (brochure SwissNET, 2019).</div>
</section>

<section class="ilot" id="e34-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Les données suisses sont rares et se limitent aux tumeurs neuroendocrines. La brochure SwissNET destinée aux patients, issue des centres de Berne et de Bâle, indique environ <b>4 à 5 nouveaux cas pour 100 000 habitants par an</b>, soit <b>300 à 400 nouveaux diagnostics par an</b> en Suisse. Ils surviennent surtout entre 50 et 60 ans et au-delà. Les tumeurs du tube digestif et du pancréas en représentent 60 à 70 %, le poumon 20 à 30 % et les autres sites 10 %. Environ 70 % des tumeurs ne sécrètent aucune hormone cliniquement active et environ 30 % sont fonctionnelles (brochure SwissNET, 2019). Cette brochure est financée par l’industrie, ce qui limite sa valeur de référence.</p>
<p>Parmi les patients atteints de tumeur neuroendocrine, la prévalence du syndrome carcinoïde est aujourd’hui estimée à <b>19–35 %</b> (historiquement 3–74 %). Environ 30 % des patients porteurs d’une tumeur de l’intestin grêle le présentent (ENETS 2022 ; ENETS 2024). Seules environ 5 % des tumeurs neuroendocrines pulmonaires produisent assez d’hormones (sérotonine, ACTH, GHRH) pour déclencher des symptômes (brochure SwissNET, 2019). Le pronostic est altéré : la survie médiane globale est de <b>4,7 ans avec syndrome carcinoïde contre 7,1 ans sans</b>, et la qualité de vie est inférieure (ENETS 2022).</p>
<p>Pour la taille, les définitions sont statistiques : par construction, 3 % des enfants se trouvent sous le 3e percentile et 3 % au-dessus du 97e (AWMF 2023 ; AWMF 2022). La cause est souvent bénigne : 85 à 90 % des enfants nés petits pour l’âge gestationnel rattrapent leur retard dans les premières années, et une cause génétique est identifiable dans environ 15 % des petites tailles dites idiopathiques (Noordam 2023). Aucune incidence suisse n’est disponible pour la haute taille ni pour la progéria dans les sources lues (lacune).</p>
<p>La résistance complète aux androgènes touche entre 1 sur 20 400 et 1 sur 99 100 individus 46,XY (Batista 2018). Une autre estimation donne 1 sur 41 000 à 120 000 naissances vivantes ; elle représente la deuxième cause d’aplasie vaginale après le syndrome de Mayer-Rokitansky-Küster-Hauser (AWMF 2025).</p>
<div class="trap"><span class="k">Piège</span> Les chiffres de prévalence du syndrome carcinoïde varient de 3 à 74 % selon les séries ; la source ne détaille pas les raisons de cet écart. Les 19–35 % actuels sont des estimations parmi les tumeurs neuroendocrines, non parmi la population générale (ENETS 2022).</div>
</section>

<section class="ilot" id="e34-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Le syndrome carcinoïde : du foie qui protège au foie qui ne protège plus</h3>
<p>À l’état normal, les hormones libérées par l’intestin gagnent la circulation portale, et le <b>foie les inactive</b> avant qu’elles n’atteignent la circulation générale. Une tumeur neuroendocrine intestinale qui sécrète de la sérotonine ne provoque donc aucun syndrome tant que sa sécrétion reste drainée par la <button class="w" data-k="e34-portal">veine porte (drainage hépatique et contournement)</button> (ENETS 2022).</p>
<p>Le syndrome apparaît quand les médiateurs échappent à ce filtre. Les <b>métastases hépatiques</b> déversent directement leurs produits dans les veines hépatiques : elles existent chez 87 à 100 % des patients symptomatiques. Dans 5 à 13 % des cas, il n’y a pas de métastase hépatique ; la tumeur primitive siège alors hors du drainage portal (ovaire, testicule, parfois poumon) ou une grosse masse rétropéritonéale draine directement dans la circulation systémique (ENETS 2022). La sérotonine est le principal médiateur sécrété ; s’y ajoutent l’histamine, les tachykinines, la kallicréine et les prostaglandines (ENETS 2022). La <button class="w" data-k="e34-voie-serotonine">voie tryptophane, sérotonine, 5-HIAA (synthèse et dosage)</button> explique à la fois les symptômes et le test : le 5-HIAA est le métabolite que l’on retrouve dans l’urine.</p>
<h3>3.2 La cardiopathie carcinoïde</h3>
<p>Les dépôts fibreux en plaques sur les valves du cœur droit et l’endocarde épaississent et rétractent les feuillets. Il en résulte une <b>insuffisance, parfois une sténose, tricuspide et pulmonaire</b>, puis une insuffisance cardiaque droite. La sérotonine est tenue pour causale. Le cœur gauche est atteint si un foramen ovale perméable laisse passer les médiateurs, en cas de tumeur pulmonaire fonctionnelle ou de taux hormonaux très élevés (ENETS 2022). La fenêtre sur la <button class="w" data-k="e34-cardiopathie">cardiopathie carcinoïde (épidémiologie, dépistage et traitement)</button> détaille la suite.</p>
<h3>3.3 La sécrétion ectopique et les syndromes fonctionnels</h3>
<p>Une cellule tumorale endocrine ou neuroendocrine peut sécréter des substances bioactives sans rapport avec la physiologie du tissu d’origine. Les sites décrits sont le poumon, le tube digestif, le pancréas, la thyroïde, la médullosurrénale, la peau, la prostate et le sein. Les exemples cités sont l’ADH, à l’origine d’un syndrome d’antidiurèse inappropriée avec hyponatrémie, l’ACTH, à l’origine d’un syndrome de Cushing, la CRH (très rare) et la GHRH, à l’origine d’une acromégalie. Les tumeurs sont souvent très malignes et la sécrétion ne suit pas de façon fiable le stade ou le pronostic (Reisch et Reincke 2018). La <button class="w" data-k="e34-ectopique">sécrétion hormonale ectopique (mécanisme et conduite)</button> est donc d’abord un problème de tumeur.</p>
<h3>3.4 Les troubles de croissance</h3>
<p>Chez l’enfant, la taille adulte résulte de la taille cible génétique, de la vitesse de croissance et de l’axe hormonal de croissance. Dans le syndrome de Laron, le <b>récepteur de l’hormone de croissance</b> est défaillant : l’hormone est présente, souvent en excès, mais le foie ne produit pas assez d’IGF-1. Le résultat est un déficit primaire sévère en IGF-1 avec une taille de −6 à −12 écarts-types dans l’enfance et une taille adulte de 120 à 130 cm (Saavedra et Bang 2026). La <button class="w" data-k="e34-laron">définition internationale et allemande du Laron (seuils)</button> permet de le distinguer d’un simple déficit en hormone de croissance.</p>
<h3>3.5 L’insensibilité aux androgènes</h3>
<p>À l’état normal, la testostérone est convertie en dihydrotestostérone (<button class="w" data-k="e34-ar-dht">DHT et récepteur des androgènes (mécanisme)</button>) par la 5α-réductase de type 2. La DHT se fixe sur le récepteur des androgènes, un facteur de transcription activé par son ligand, et masculinise les organes génitaux externes entre la 8e et la 14e semaine. Le gène du récepteur est situé sur le chromosome X en Xq11-12, avec 8 exons ; la transmission est liée à l’X et environ 30 % des cas sont des mutations de novo (Batista 2018). Dans la forme complète, le testicule fœtal sécrète normalement l’hormone anti-müllérienne : l’utérus et les trompes régressent, d’où un vagin borgne sans utérus, et les testicules restent abdominaux ou inguinaux (AWMF 2025).</p>
<h3>3.6 La progéria</h3>
<p>La mutation LMNA c.1824C&gt;T crée une lamine A tronquée et farnésylée en permanence, la <button class="w" data-k="e34-progerine">progérine (toxicité et cible thérapeutique)</button>. Elle entraîne retard de croissance, lipodystrophie, atteintes musculosquelettiques et maladie vasculaire rapidement progressive (Ali 2026).</p>
<div class="key"><b>Mécanisme → clinique.</b> Tous les tableaux de ce cours ont la même logique : une hormone ou son récepteur échappe à son contrôle normal. Le syndrome carcinoïde est un excès de médiateurs hors filtre hépatique ; la résistance aux androgènes est une hormone intacte qui ne trouve pas son récepteur ; le Laron est un récepteur qui ne répond pas à l’hormone de croissance.</div>
<button class="pareto-btn ui" data-k="pareto-e34-bases">▲ Loi de Pareto — Définitions, épidémiologie, physiopathologie</button>
</section>

<section class="ilot" id="e34-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se lisent entité par entité. Le tableau rassemble ce que les sources documentent ; la colonne de droite indique ce qui doit déclencher une recherche.</p>
<table class="t"><thead><tr><th>Entité</th><th>Causes ou terrains documentés</th><th>Ce qui oriente</th></tr></thead><tbody>
<tr><td>Syndrome carcinoïde</td><td>Tumeurs neuroendocrines intestinales bien différenciées, puis pulmonaires ; rarement pancréatiques, ovariennes, thymiques ou de primitif inconnu (ENETS 2022).</td><td>Métastases hépatiques dans 87 à 100 % des cas ; primitif hors drainage portal dans les 5 à 13 % restants.</td></tr>
<tr><td>Hypersécrétions fonctionnelles</td><td>Insulinome, gastrinome, glucagonome, VIPome, ACTHome, PTHrPome, calcitoninome, GHRHome, somatostatinome, syndrome carcinoïde (ENETS 2023).</td><td>Association à la <button class="w" data-k="e34-men1">néoplasie endocrinienne multiple de type 1 (TNE, parathyroïde, hypophyse)</button> à chercher selon le contexte (brochure SwissNET, 2019).</td></tr>
<tr><td>Petite taille</td><td>Variante familiale ou idiopathique ; retard constitutionnel ; petite taille intra-utérine sans rattrapage ; aneuploïdies (Turner, Down) ; syndromes (Noonan, Silver-Russell, Prader-Willi, DiGeorge) ; dysplasies squelettiques ; malnutrition ; maladies d’organe ; endocrinopathies ; causes psychosociales ; causes iatrogènes (AWMF 2023).</td><td>Taille cible, proportions, âge osseux, dysmorphie, maladie chronique.</td></tr>
<tr><td>Haute taille</td><td>Forme constitutionnelle ; avance constitutionnelle de croissance et de puberté ; Klinefelter, 47,XYY, 47,XXX ; Marfan, Loeys-Dietz, Sotos, Beckwith-Wiedemann ; excès d’hormone de croissance ; puberté précoce ; hyperplasie congénitale des surrénales ; hyperthyroïdie ; homocystinurie (AWMF 2022).</td><td>Croissance accélérée, signes dysmorphiques, antécédents familiaux d’une maladie dominante.</td></tr>
<tr><td>Résistance aux androgènes</td><td>Variants du gène du récepteur des androgènes sur le chromosome X ; transmission liée à l’X, mutation de novo dans environ 30 % des cas (Batista 2018).</td><td>Caryotype 46,XY avec phénotype féminin ou génitaux ambigus.</td></tr>
<tr><td>Progéria</td><td>Mutation de novo du gène LMNA (Ali 2026).</td><td>Retard de croissance et lipodystrophie précoces.</td></tr>
</tbody></table>
<p>Pour la petite taille, une cause iatrogène est à ne pas oublier : glucocorticoïdes systémiques, y compris locaux à forte dose, irradiation, chimiothérapie. Pour la forme psychosociale, la privation affective, l’anorexie et la dépression sont citées (AWMF 2023).</p>
<div class="trap"><span class="k">Piège</span> L’alimentation peut fausser un diagnostic de syndrome carcinoïde : bananes, ananas, tomates, prunes, aubergines, avocats, kiwis et noix augmentent le 5-HIAA urinaire, comme les inhibiteurs de la recapture de la sérotonine et le paracétamol (ENETS 2022). Un 5-HIAA modérément élevé ne suffit donc pas, sans symptômes évocateurs.</div>
<div class="key"><b>À retenir.</b> Le terrain qui élève le risque de syndrome carcinoïde est la présence de métastases hépatiques d’une tumeur neuroendocrine. Le terrain qui élève le risque de cardiopathie est un 5-HIAA urinaire supérieur à 300 µmol/24 h, qui multiplie par 2 à 3 le risque d’apparition ou de progression (ENETS 2022).</div>
</section>

<section class="ilot" id="e34-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire s’adapte à l’entité suspectée. Les symptômes sont classés par fréquence quand les sources la donnent ; chaque mot vert détaille la caractérisation.</p>
<div class="two"><div class="card"><b>Syndrome carcinoïde : forme typique</b><p>La <button class="w" data-k="e34-diarrhee">diarrhée chronique (≥ 3 selles molles par jour pendant plus de 4 semaines)</button> est souvent le symptôme d’appel : elle est présente chez 60 à 80 % des patients ayant un 5-HIAA urinaire élevé. Le <button class="w" data-k="e34-flush">flush (rougeur paroxystique habituellement sèche)</button> est présent chez plus de 90 % des patients. Le <button class="w" data-k="e34-bronchospasme">bronchospasme (environ 15 %)</button> est plus rare (ENETS 2022).</p></div><div class="card"><b>Syndrome carcinoïde : formes atypiques</b><p>Dénutrition et carences en vitamines A, D, E, K, B12 et en niacine. Fatigue, dyspnée, turgescence jugulaire, œdèmes et ascite évoquent la cardiopathie droite. L’examen clinique est peu sensible : 11 à 27 % des atteintes tricuspides modérées à sévères sont pauci- ou asymptomatiques (ENETS 2022).</p></div></div>
<div class="two"><div class="card"><b>Enfant de petite ou de haute taille</b><p>Tailles des parents et de la fratrie ; antécédents familiaux de puberté tardive ; poids et taille de naissance (moins de −2 écarts-types : petit pour l’âge gestationnel) ; maladies chroniques ; prise de corticoïdes ; contexte psychosocial (AWMF 2023). Pour la haute taille, une taille déjà élevée dans la petite enfance et un parent grand orientent vers une forme familiale ; un antécédent familial de maladie dominante comme le Marfan est à chercher (AWMF 2022).</p></div><div class="card"><b>Résistance aux androgènes</b><p>Aménorrhée primaire à la puberté, parfois <button class="w" data-k="e34-hernie">hernie inguinale chez une fille (indice du diagnostic)</button> dans l’enfance, ou découverte prénatale d’un caryotype 46,XY avec organes génitaux féminins. Chez le garçon, une gynécomastie pubertaire est évocatrice de forme partielle. L’histoire familiale cherche d’autres cas du côté maternel, la transmission étant liée à l’X (Batista 2018).</p></div></div>
<div class="trap"><span class="k">Piège</span> Les aliments et médicaments cités faussent le dosage du 5-HIAA. L’interrogatoire alimentaire et médicamenteux doit précéder le recueil des urines et non le suivre (ENETS 2022).</div>
</section>

<section class="ilot" id="e34-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, mesures, puis signes ciblés. Il est orienté par l’entité suspectée.</p>
<div class="two"><div class="card"><b>État général et signes vitaux</b><p>Chez le patient suspect de syndrome carcinoïde : état nutritionnel, tension artérielle (la crise carcinoïde s’accompagne d’instabilité hémodynamique), <button class="w" data-k="e34-bronchospasme">sibilants à l’auscultation</button>. Une hépatomégalie traduit les métastases ou la congestion droite (ENETS 2022).</p></div><div class="card"><b>Cœur droit</b><p>Souffles tricuspidien et pulmonaire, turgescence jugulaire, œdèmes, ascite (ENETS 2022). L’absence de signes n’exclut pas une atteinte valvulaire significative, d’où le <button class="w" data-k="e34-ntprobnp">dosage du NT-proBNP (seuil et valeur prédictive)</button>.</p></div></div>
<div class="two"><div class="card"><b>Mesure de la croissance</b><p>Avant 2 ans, la mesure se fait couché par deux opérateurs ; après 2 ans, debout au <button class="w" data-k="e34-mesure">stadiomètre mural (technique, courbes de référence)</button>. La taille est reportée sur des courbes actuelles, spécifiques de la population et du sexe (AWMF 2023). Les proportions sont précisées : envergure, taille assise, périmètre crânien (AWMF 2023), l’indice de taille assise supérieur à 0,55 étant anormal chez l’adulte (Noordam 2023).</p></div><div class="card"><b>Examen génital et puberté</b><p>Chez la fille avec aménorrhée primaire : développement mammaire, pilosité pubienne et axillaire, longueur du vagin (2,5 à 8 cm dans la forme complète d’insensibilité aux androgènes). Chez le garçon avec forme partielle : hypospadias, micropénis, gynécomastie (Batista 2018 ; AWMF 2025).</p></div></div>
<div class="two"><div class="card"><b>Signes dysmorphiques</b><p>Un aspect syndromique ou une disproportion pour la petite taille impose un avis spécialisé (AWMF 2023). Pour la haute taille, ils orientent vers Marfan, Sotos ou Beckwith-Wiedemann (AWMF 2022).</p></div><div class="card"><b>Peau et progéria</b><p>Les sources lues ne décrivent pas l’examen clinique détaillé de la progéria (lacune). Le retard de croissance, la lipodystrophie et l’atteinte vasculaire sont les trois éléments documentés (Ali 2026).</p></div></div>
<div class="trap"><span class="k">Piège</span> Chez une fille de petite taille, le caryotype est obligatoire pour rechercher un syndrome de Turner, même sans signe clinique évocateur, si l’écart à la taille cible dépasse 2 écarts-types (AWMF 2023 ; Noordam 2023).</div>
<div class="key"><b>À retenir.</b> L’examen du patient carcinoïde cherche le cœur droit, même sans symptôme. L’examen de l’enfant mesure, compare à la cible et cherche la disproportion. L’examen de la jeune fille en aménorrhée primaire cherche un vagin court et une pilosité rare.</div>
