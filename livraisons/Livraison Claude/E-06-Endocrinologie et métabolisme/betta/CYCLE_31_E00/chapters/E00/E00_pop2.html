<template data-pop="e00-ft4" data-title="fT4 et TSH sériques : lecture et seuils">
<div class="lab">Définition</div><p>La fT4 est la thyroxine libre, la fraction de l’hormone qui n’est pas liée aux protéines de transport. Elle s’exprime en pmol/l. La TSH est l’hormone hypophysaire qui stimule la thyroïde ; elle s’exprime en mU/l.</p>
<div class="lab">Seuils du consensus européen</div><p>Sévérité selon la fT4 : inférieure à 5 pmol/l sévère, 5 à 10 modérée, 10 à 15 légère. La combinaison fT4 basse et TSH nettement élevée impose le traitement immédiat ; une TSH supérieure à 20 mU/l impose le traitement même avec une fT4 normale.</p>
<div class="lab">Pièges</div><p>Dans l’hypothyroïdie centrale, la TSH est basse, normale ou peu élevée alors que la fT4 est basse : la TSH seule trompe. Les intervalles de référence par âge ne figurent pas dans les sections lues et ne sont pas cités ; le laboratoire de l’hôpital fournit les siens.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 1.3 et 2.1.</p></template>

<template data-pop="e00-seuils-traitement" data-title="Seuils de traitement de l’hypothyroïdie congénitale">
<div class="lab">Seuils</div><table class="t"><thead><tr><th>Situation</th><th>Décision</th></tr></thead><tbody><tr><td>fT4 basse, TSH nettement élevée</td><td>Traitement immédiat</td></tr><tr><td>TSH supérieure à 20 mU/l, fT4 normale</td><td>Traitement</td></tr><tr><td>TSH de 6 à 20 mU/l après le 21e jour, fT4 normale</td><td>Traitement et réévaluation, ou contrôle à 1-2 semaines</td></tr><tr><td>Sans laboratoire : TSH sur buvard supérieure à 40 mU/l</td><td>Traitement</td></tr></tbody></table>
<div class="lab">Lecture</div><p>Le tableau reprend les seuils du consensus ENDO-ERN. Il concerne l’hypothyroïdie congénitale du nouveau-né ; il ne détermine pas le traitement du crétinisme constitué.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 2.1.</p></template>

<template data-pop="e00-dysgenesie" data-title="Dysgénésie thyroïdienne">
<div class="lab">Fréquence</div><p>Elle représente environ 65 % des hypothyroïdies congénitales primaires permanentes, dans des populations suffisantes en iode.</p>
<div class="lab">Distinction avec E00</div><p>La dysgénésie est un défaut de la glande elle-même ; le crétinisme endémique résulte du manque d’iode chez la mère. Le contexte géographique et nutritionnel sépare les deux.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 5.2.</p></template>

<template data-pop="e00-dyshormonogenese" data-title="Dyshormonogenèse">
<div class="lab">Caractéristiques</div><p>La glande est en place. La dyshormonogenèse représente moins de la moitié des quelque 35 % d’hypothyroïdies primaires permanentes non dues à une dysgénésie. Un goitre est possible et la récurrence familiale est d’environ 25 %.</p>
<div class="lab">Conséquence</div><p>Une histoire familiale oriente vers ce diagnostic et peut justifier un diagnostic prénatal.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 4.4, 5.2 et 5.3.</p></template>

<template data-pop="e00-centrale" data-title="Hypothyroïdie congénitale centrale">
<div class="lab">Biologie</div><p>La fT4 est basse alors que la TSH est basse, normale ou peu élevée.</p>
<div class="lab">Clinique</div><p>Le consensus cite le micropénis, la cryptorchidie, l’hypoglycémie et l’ictère prolongé.</p>
<div class="lab">Précaution</div><p>La fonction surrénalienne doit être vérifiée avant la lévothyroxine ; à défaut, les glucocorticoïdes sont donnés d’abord.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 1.3 et 2.1.</p></template>

<template data-pop="e00-iode-exces" data-title="Hypothyroïdie transitoire par excès d’iode">
<div class="lab">Causes</div><p>Les antiseptiques iodés et les apports maternels riches en iode peuvent provoquer une hypothyroïdie transitoire. Le prématuré est particulièrement exposé, car il ne parvient pas à échapper à l’effet Wolff-Chaikoff.</p>
<div class="lab">Conduite</div><p>Éviter les antiseptiques iodés en période périnatale et rechercher l’exposition à l’anamnèse.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 3.4.</p></template>

<template data-pop="e00-anticorps" data-title="Anticorps maternels bloquant le récepteur de la TSH">
<div class="lab">Effet sur l’examen</div><p>Ces anticorps rendent la scintigraphie faussement « blanche » : l’absence de captation ne prouve pas l’absence de glande.</p>
<div class="lab">Conséquence</div><p>L’interprétation de l’imagerie tient compte de ce piège ; elle se fait après le début du traitement.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 2.3.</p></template>

<template data-pop="e00-pendred" data-title="Syndrome de Pendred">
<div class="lab">Définition</div><p>Le syndrome de Pendred associe une surdité à une dyshormonogenèse.</p>
<div class="lab">Différentiel</div><p>Il peut simuler le tableau d’un enfant sourd et hypothyroïdien. Le contexte de carence de la mère et de la communauté oriente vers E00 ; l’histoire familiale oriente vers la dyshormonogenèse.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 4.1.</p></template>

<template data-pop="e00-surveillance" data-title="Calendrier de surveillance de la lévothyroxine">
<div class="lab">Calendrier</div><table class="t"><thead><tr><th>Période</th><th>Fréquence des contrôles</th></tr></thead><tbody><tr><td>Début du traitement</td><td>1 à 2 semaines, puis toutes les 2 semaines jusqu’à normalisation</td></tr><tr><td>Jusqu’à 12 mois</td><td>Tous les 1 à 3 mois</td></tr><tr><td>1 à 3 ans</td><td>Tous les 2 à 4 mois</td></tr><tr><td>Au-delà de 3 ans</td><td>Tous les 3 à 6 mois</td></tr><tr><td>Après tout changement de dose</td><td>4 à 6 semaines</td></tr></tbody></table>
<div class="lab">Modalités</div><p>La fT4 et la TSH sont dosées avant la prise ou au moins quatre heures après. La TSH devrait se normaliser en 4 semaines. Si la glande est en place, l’axe est réévalué à 2-3 ans.</p>
<p class="src">Références : consensus ENDO-ERN 2021, sections 3.2 et 3.4.</p></template>

<template data-pop="e00-pronostic" data-title="Pronostic de l’hypothyroïdie congénitale traitée">
<div class="lab">Données</div><p>Sous traitement précoce, la plupart des enfants ont un développement et une scolarité normaux, et la déficience intellectuelle (quotient intellectuel inférieur à 70) est quasiment disparue. Des doses initiales d’au moins 10 µg/kg/jour sont associées à des résultats comparables à ceux de la fratrie. Un surdosage précoce est associé à des troubles de l’attention. Une atteinte auditive légère touche 20 à 25 % des adolescents.</p>
<div class="lab">Limite</div><p>Ces données concernent l’hypothyroïdie congénitale sporadique traitée dès le dépistage. Elles ne s’appliquent pas au crétinisme endémique constitué, dont le dommage cérébral précède la naissance.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 4.1.</p></template>

<template data-pop="e00-grossesse" data-title="Grossesse d’une femme hypothyroïdienne congénitale">
<div class="lab">Conduite</div><p>Optimiser la lévothyroxine avant la conception, contrôler la TSH et la fT4 toutes les 4 à 6 semaines, viser une TSH inférieure à 2,5 mU/l, et revenir à la dose préconceptionnelle après l’accouchement.</p>
<div class="lab">Limite</div><p>La justification détaillée de la cible n’a pas été lue dans les sections consultées ; elle est rapportée telle que le consensus la fixe.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 3.5.</p></template>

<template data-pop="e00-antenatal" data-title="Diagnostic prénatal de l’hypothyroïdie fœtale">
<div class="lab">Indications</div><p>Un goitre fœtal ou une dyshormonogenèse familiale justifient un diagnostic prénatal. L’échographie thyroïdienne fœtale se pratique à 20-22 semaines.</p>
<div class="lab">Traitement</div><p>La lévothyroxine intra-amniotique est discutée dans l’hypothyroïdie fœtale goitreuse avec hydramnios.</p>
<p class="src">Références : consensus ENDO-ERN 2021, section 5.3.</p></template>

<template data-pop="e00-allaitement" data-title="Allaitement et iode du lait">
<div class="lab">Mécanisme</div><p>Le nourrisson allaité dépend de l’iode du lait, dont la concentration est déterminée par l’apport maternel. Son besoin est élevé en raison d’un renouvellement hormonal rapide.</p>
<div class="lab">Conséquences</div><p>Une mère carencée prolonge le risque après la naissance. L’OMS recommande 250 µg/jour pendant l’allaitement ; chez le nourrisson de 0 à 6 mois, l’apport passe par le lait d’une mère supplémentée.</p>
<p class="src">Références : <a href="https://doi.org/10.1210/endrev/bnab029" target="_blank" rel="noopener">Andersson et Braegger, 2022 (résumé)</a> ; OMS 2007.</p></template>

<template data-pop="e00-d-levothyroxine" data-title="Lévothyroxine (Euthyrox®) : monographie">
<div class="lab">Mécanisme</div><p>La lévothyroxine remplace la thyroxine absente ou insuffisante. Elle est administrée seule, par voie orale, une fois par jour.</p>
<div class="lab">Indication et preuves</div><p>L’information professionnelle suisse d’Euthyrox® (Merck, février 2023) indique l’hypothyroïdie congénitale et précise que la dose tolérée la plus élevée possible doit être donnée en prophylaxie du crétinisme, en cherchant à normaliser la TSH. Le consensus ENDO-ERN rapporte un développement normal chez la plupart des enfants traités tôt.</p>
<div class="lab">Posologie</div><p>Dose initiale de 10 à 15 µg/kg/jour (Swisspeddose : 0 à 28 jours, une prise par jour, ajustée sur la TSH et la fT4 pour l’âge). Doses par âge : 0 à 6 mois 25 à 75 µg ; 6 à 12 mois 50 à 75 µg ; 1 à 5 ans 75 à 100 µg ; 6 à 12 ans 100 à 150 µg. Augmentations par paliers de 2 à 4 semaines. Comprimé désagrégé dans un peu d’eau, au moins une demi-heure avant le premier repas.</p>
<div class="lab">Pharmacocinétique</div><p>Résorption jusqu’à environ 80 % à jeun, diminuée jusqu’à 20 % avec la nourriture ; pic vers 5 heures ; demi-vie d’environ 7 jours, de 9 à 10 jours en hypothyroïdie.</p>
<div class="lab">Effets indésirables et contre-indications</div><p>Surdosage chez l’enfant : craniosténose et soudure épiphysaire prématurée. Contre-indiquée en cas de troubles hypophysaires ou surrénaliens non traités. Chez le prématuré très immature, collapsus cardiovasculaires rapportés. En cas d’insuffisance cardiaque, début à environ la moitié de la dose.</p>
<div class="lab">Surveillance</div><p>fT4 et TSH selon le calendrier du consensus européen.</p>
<p class="src">Références : information professionnelle suisse Euthyrox®, Merck (Schweiz) AG, Swissmedic, février 2023 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8001676/" target="_blank" rel="noopener">consensus ENDO-ERN 2021, sections 2.1, 3.1 et 4.1</a>.</p></template>

<template data-pop="e00-d-iode-oms" data-title="Supplémentation en iode : posologies de l’OMS">
<div class="lab">Indication</div><p>Lorsque le sel iodé ne couvre pas les besoins, l’OMS propose une supplémentation quotidienne ou une dose annuelle d’huile iodée.</p>
<div class="lab">Posologie</div><table class="t"><thead><tr><th>Population</th><th>Quotidien</th><th>Huile iodée annuelle</th></tr></thead><tbody><tr><td>Grossesse et allaitement</td><td>250 µg</td><td>400 mg (femmes)</td></tr><tr><td>Femme en âge de procréer</td><td>150 µg</td><td>400 mg</td></tr><tr><td>Enfant de moins de 2 ans</td><td>90 µg</td><td>200 mg</td></tr></tbody></table>
<div class="lab">Preuves et limites</div><p>Chez des femmes enceintes légèrement carencées (médiane d’iodurie de 131 µg/l, Inde et Thaïlande), 200 µg/jour n’ont pas modifié le quotient intellectuel ni les fonctions exécutives à 5-6 ans (essai randomisé, environ 313 enfants). Ce résultat ne s’étend pas à la carence sévère. Aucune information professionnelle suisse d’un produit iodé n’a été consultée.</p>
<p class="src">Références : OMS, UNICEF et ICCIDD 2007, tableau 2 ; <a href="https://doi.org/10.1016/S2213-8587(17)30332-7" target="_blank" rel="noopener">Gowachirapant et al., 2017 (résumé)</a> ; consensus ENDO-ERN 2021, section 3.5.</p></template>

<template data-pop="e00-mnemo" data-title="Moyen mnémotechnique : les trois S du crétinisme neurologique">
<div class="lab">Aide</div><p>Les trois S regroupent la surdi-mutité, le strabisme et la spasticité, les trois signes qui reviennent dans la définition neurologique du syndrome.</p>
<div class="lab">Mention</div><p>Aide pédagogique, non critère officiel.</p></template>

<template data-pop="pareto-e00-definition" data-title="Pareto — Définition et classification"><p class="ratio" data-cover="e00-0,e00-1"></p><ul><li>E00 désigne le crétinisme endémique par carence iodée, non l’hypothyroïdie congénitale sporadique.</li><li>Deux syndromes classiques : neurologique (plus fréquent) et hypothyroïdie sévère avec retard de croissance.</li><li>Les sous-codes E00.0, E00.1, E00.2 et E00.9 correspondent aux types neurologique, myxœdémateux, mixte et sans précision.</li><li>L’atteinte neurologique est présente dans tous les types.</li></ul></template>
<template data-pop="pareto-e00-mecanismes" data-title="Pareto — Épidémiologie et physiopathologie"><p class="ratio" data-cover="e00-2,e00-3"></p><ul><li>La carence iodée est la première cause évitable de lésions cérébrales ; le sel iodé suisse est ininterrompu depuis 1922.</li><li>Médiane d’iodurie de la femme enceinte suisse : 97 µg/l, insuffisante selon l’OMS.</li><li>Avant 18 à 20 semaines, le fœtus dépend de la thyroxine maternelle ; période critique du deuxième trimestre à 3 ans.</li><li>Type neurologique : hypothyroxinémie prénatale. Type myxœdémateux : hypothyroïdie postnatale persistante.</li></ul></template>
<template data-pop="pareto-e00-causes" data-title="Pareto — Causes et facteurs de risque"><p class="ratio" data-cover="e00-4"></p><ul><li>Cause : carence iodée maternelle sévère pendant la grossesse.</li><li>Régions à risque : montagnes, plaines alluviales, éloignement de la mer.</li><li>Sélénium et thiocyanate : hypothèses seulement.</li></ul></template>
<template data-pop="pareto-e00-clinique" data-title="Pareto — Anamnèse et examen"><p class="ratio" data-cover="e00-5,e00-6"></p><ul><li>Rechercher le contexte de carence (origine, goitres, autres cas).</li><li>Signes neurologiques : signes pyramidaux proximaux, extrapyramidaux, strabisme, surdité de perception, réflexes primitifs.</li><li>Signes myxœdémateux : petite taille, immaturité sexuelle, retard d’ossification.</li><li>Nouveau-né : hypotonie, ictère, hernie ombilicale, macroglossie, signes inconstants.</li></ul></template>
<template data-pop="pareto-e00-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="e00-7"></p><ul><li>Diagnostic clinique en contexte de carence ; indicateurs populationnels : iodurie, TSH néonatale supérieure à 5 mU/l.</li><li>Confirmation néonatale : TSH et fT4 sériques ; imagerie après le début du traitement.</li><li>Différentiel : dysgénésie, dyshormonogenèse, forme centrale, excès d’iode, anticorps maternels, syndrome de Pendred.</li></ul></template>
<template data-pop="pareto-e00-urgences" data-title="Pareto — Urgences"><p class="ratio" data-cover="e00-8"></p><ul><li>fT4 basse et TSH nettement élevée : lévothyroxine immédiate, au plus tard 2 semaines après la naissance.</li><li>Forme centrale : vérifier la fonction surrénalienne avant la lévothyroxine.</li><li>Prématuré très immature : surveiller la circulation.</li></ul></template>
<template data-pop="pareto-e00-traitement" data-title="Pareto — Prise en charge"><p class="ratio" data-cover="e00-9,e00-10,e00-11"></p><ul><li>Le crétinisme se prévient : iode avant la grossesse, 250 µg/jour pendant la grossesse selon le consensus européen.</li><li>Nouveau-né hypothyroïdien : lévothyroxine 10 à 15 µg/kg/jour, TSH normalisée en 4 semaines.</li><li>Contrôles : 1 à 2 semaines, puis toutes les 2 semaines, puis espacés selon l’âge.</li><li>Aucune source lue ne montre le bénéfice d’un traitement tardif du crétinisme constitué.</li></ul></template>
<template data-pop="pareto-e00-suivi" data-title="Pareto — Suivi et pronostic"><p class="ratio" data-cover="e00-10"></p><ul><li>Pronostic favorable de l’hypothyroïdie congénitale traitée tôt ; surveiller l’audition.</li><li>Éducation des parents et transition planifiée.</li></ul></template>
<template data-pop="pareto-e00-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e00-e-1,e00-e-2,e00-e-3,e00-e-4,e00-e-5"></p><ul><li>Dépistage suisse au 4e jour ; confirmation par TSH et fT4 sériques.</li><li>Seuils : TSH supérieure à 20 mU/l, ou fT4 basse avec TSH élevée, traiter.</li><li>Iodurie : inférieure à 20 µg/l carence sévère ; femme enceinte inférieure à 150 µg/l insuffisant.</li><li>Antiseptiques iodés : faussent la TSH néonatale.</li></ul></template>
<template data-pop="pareto-e00-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="e00-s-anat-cours"></p><ul><li>Cerveau, noyaux gris centraux, audition, thyroïde et squelette sont atteints.</li><li>Calcifications des noyaux gris : hypothyroïdiens sévères seulement.</li></ul></template>
<template data-pop="pareto-e00-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e00-s-physio-cours"></p><ul><li>Besoins en iode : 90, 120, 150, 250 µg/jour.</li><li>Thyroïde fœtale fonctionnelle vers 18 à 20 semaines.</li><li>Adaptation à la carence : captation accrue, goitre, sécrétion de T3.</li></ul></template>
<template data-pop="pareto-e00-bioch" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e00-s-bioch-cours"></p><ul><li>Le symporteur sodium-iodure assure le transport actif de l’iodure.</li><li>Thiocyanate et sélénium : hypothèses.</li><li>Excès d’iode : hypothyroïdie transitoire du prématuré.</li></ul></template>
<template data-pop="pareto-e00-sante" data-title="Pareto — Santé publique"><p class="ratio" data-cover="e00-s-sante-cours"></p><ul><li>Programme suisse volontaire : un tiers des aliments transformés seulement.</li><li>Choisir une multivitamine prénatale contenant de l’iode.</li><li>Résultat de supplémentation en carence légère non extrapolable à la carence sévère.</li></ul></template>
<template data-pop="pareto-e00-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e00-p-1,e00-p-2,e00-p-3,e00-p-4"></p><ul><li>Prévention par l’iode ; substitution par la lévothyroxine.</li><li>Lévothyroxine : 10 à 15 µg/kg/jour au début, ajustée sur TSH et fT4.</li><li>Résorption réduite par la nourriture ; surdosage : craniosténose.</li><li>Éviter les antiseptiques iodés.</li></ul></template>
