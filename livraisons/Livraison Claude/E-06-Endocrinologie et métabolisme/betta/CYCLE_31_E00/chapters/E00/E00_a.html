<section class="ilot" id="e00-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Un enfant naît dans une région où le sel iodé n’est pas disponible et où les goitres sont fréquents dans la population. Plus tard, ses parents s’inquiètent de son développement : il n’entend pas, parle peu ou pas, marche avec une démarche raide et présente un strabisme. Certains enfants de la même communauté sont, en plus, petits pour leur âge et ont des traits épaissis. Cette présentation est le <button class="w" data-k="e00-definition">crétinisme endémique (définition et place dans la classification E00)</button>, que la classification suisse range sous le code E00.</p>
<p>Cette <b>vignette est pédagogique</b> : elle rassemble des signes décrits dans les enquêtes de terrain, elle ne représente pas un patient réel. Elle pose trois questions que le cours traite dans l’ordre. Pourquoi une carence en un oligo-élément alimentaire détruit-elle de façon définitive le cerveau d’un enfant ? Pourquoi le même syndrome existe-t-il avec et sans hypothyroïdie persistante ? Comment, en Suisse, reconnaître et traiter un nouveau-né hypothyroïdien, qui est le seul cas que le médecin voit réellement en pratique ?</p>
<div class="trap"><span class="k">Piège</span> Le libellé français « syndrome d’insuffisance thyroïdienne congénitale » suggère une hypothyroïdie congénitale quelconque. L’intitulé anglais de la même catégorie est « congenital iodine-deficiency syndrome » : E00 désigne la <b>carence iodée</b>. L’hypothyroïdie congénitale sporadique, due à une glande absente, ectopique ou à une synthèse hormonale altérée, relève d’autres catégories ; elle est traitée ici comme diagnostic différentiel et comme cadre de prise en charge du nouveau-né.</div>
<div class="key"><b>À retenir.</b> E00 est le crétinisme endémique, c’est-à-dire une atteinte neurodéveloppementale irréversible causée par la carence en iode de la mère et du fœtus. Il se prévient, il ne se traite pas après coup.</div>
</section>

<section class="ilot" id="e00-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>Le <button class="w" data-k="e00-definition">crétinisme endémique (définition, deux syndromes classiques)</button> est la forme extrême des troubles dus à la carence en iode (<button class="w" data-k="e00-tdci">TDCI (spectre complet des troubles)</button>). La revue de Chen et Hetzel (2010) en distingue deux syndromes classiques. Le premier est un <b>trouble neurologique</b>, le plus fréquent, associant des lésions cérébrales, une surdi-mutité, un strabisme et une parésie spastique des membres inférieurs. Le second, moins fréquent, est un <b>syndrome d’hypothyroïdie sévère</b> avec retard de croissance et déficit mental moins marqué. Les deux sont causés par la carence iodée alimentaire et sont évitables par sa correction <b>avant la grossesse</b>.</p>
<p>Le guide de l’<button class="w" data-k="e00-sources-guides">OMS</button> de 2007 en donne la définition chez le nouveau-né et l’enfant : une déficience mentale associée, en proportions variables, à du mutisme, une diplégie spastique, un strabisme, une hypothyroïdie et une petite taille. Cette définition est descriptive : aucune source consultée ne propose de critères diagnostiques individuels formalisés et validés.</p>
<p>La <button class="w" data-k="e00-sous-types">classification CIM-10-GM 2024 (sous-codes E00.0, E00.1, E00.2, E00.9)</button> subdivise la catégorie selon le tableau clinique dominant.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Type</th><th>Traits dominants</th></tr></thead><tbody><tr><td>E00.0</td><td>Neurologique</td><td>Déficience mentale profonde, surdi-mutité, diplégie spastique</td></tr><tr><td>E00.1</td><td>Myxœdémateux</td><td>Retard statural sévère, traits myxœdémateux, déficit mental moindre, maturation sexuelle retardée</td></tr><tr><td>E00.2</td><td>Mixte</td><td>Association des deux tableaux</td></tr><tr><td>E00.9</td><td>Sans précision</td><td>Aucune précision disponible</td></tr></tbody></table>
<p>Ce tableau classe les sous-codes selon le tableau clinique. Il suppose deux entités distinctes, mais cette séparation est discutée : dans une enquête thaïlandaise, les trois types ne se distinguaient pas par le quotient intellectuel, la surdité de perception ni le déficit psychomoteur. La <button class="w" data-k="e00-sous-types">remise en cause de la dichotomie (Thaïlande, Chine, Java)</button> est détaillée dans la fenêtre associée et reprise dans la physiopathologie.</p>
<div class="trap"><span class="k">Piège</span> Le code E00 ne s’applique pas à une hypothyroïdie congénitale par dysgénésie ou dyshormonogenèse. Ces entités relèvent d’autres catégories du chapitre des maladies endocriniennes, par exemple E03.0 et E03.1 dans le fichier nosologique du dépôt.</div>
<button class="pareto-btn ui" data-k="pareto-e00-definition">▲ Loi de Pareto — Définition et classification</button>
</section>

<section class="ilot" id="e00-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p><b>Dans le monde.</b> L’<button class="w" data-k="e00-sources-guides">OMS</button> reconnaît la carence iodée comme la première cause évitable de lésions cérébrales : plus de 2 milliards de personnes sont à risque dans 130 pays. L’usage domestique du sel iodé est passé de moins de 20 % avant 1990 à 68 % en 2000. Environ la moitié de l’Europe restait légèrement carencée selon une revue de 2009.</p>
<p><b>En Suisse, un siècle de prévention.</b> Coindet, à Genève, traite le goitre par l’iode en 1813. Au début du vingtième siècle, des médecins suisses démontrent l’efficacité de la prophylaxie iodée contre le goitre et le crétinisme. Le programme de <button class="w" data-k="e00-sel">sel iodé (histoire et ajustements successifs en Suisse)</button> est ininterrompu depuis 1922, et la Suisse et les États-Unis ont été les premiers pays à iodurer le sel. Aucune source consultée ne chiffre la prévalence historique du crétinisme en Suisse.</p>
<p>La teneur en iode du sel a été relevée de 15 à 20 mg/kg en 1999, puis à 25 mg/kg en janvier 2014 (marge autorisée de 20 à 40 mg/kg). Après le premier relèvement, la proportion de nouveau-nés avec une <button class="w" data-k="e00-tsh-neonatale">TSH néonatale supérieure à 5 mU/l (indicateur populationnel)</button> est passée de 2,9 % (1992-1998, 259 035 nouveau-nés) à 1,7 % (1999-2004, 218 665 nouveau-nés).</p>
<p><b>Situation actuelle.</b> Une étude nationale de 2020-2022 (<button class="w" data-k="e00-suisse-2020">apport en iode de la population suisse (résultats détaillés)</button>) montre que le programme est <b>volontaire</b> : plus de 80 % des ménages utilisent du sel iodé, mais seulement un tiers des aliments transformés en contiennent. La médiane d’iodurie est de 127 µg/l chez l’enfant (adéquate) et de <b>97 µg/l chez la femme enceinte</b>, ce qui est insuffisant selon le seuil de l’<button class="w" data-k="e00-sources-guides">OMS</button>. Les femmes qui prennent un supplément d’iode (47 % de l’échantillon) ont une médiane de 129 µg/l contre 81 µg/l pour les autres.</p>
<p><b>Hypothyroïdie congénitale sporadique (diagnostic différentiel).</b> Elle touche environ 1 naissance sur 2000 à 3000 selon les programmes de dépistage, et un nouveau-né sur 3500 en Suisse selon le dépistage national. Dans les pays suffisants en iode, l’<button class="w" data-k="e00-sources-guides">OMS</button> donne environ 1 sur 4000 et indique que la carence iodée est, hors goitrogènes, le seul facteur important qui augmente cette incidence.</p>
<div class="key"><b>À retenir.</b> En Suisse, le crétinisme endémique a disparu avec le sel iodé, mais la médiane d’iodurie de la femme enceinte reste inférieure au seuil de suffisance de l’<button class="w" data-k="e00-sources-guides">OMS</button>. Aucune source lue ne rapporte un cas contemporain de crétinisme endémique en Suisse.</div>
</section>

<section class="ilot" id="e00-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Le normal d’abord.</b> L’iode est un constituant des hormones thyroïdiennes. Le <button class="w" data-k="e00-nis">symporteur sodium-iodure (transport actif de l’iodure)</button> l’amène dans la thyroïde, ce qui constitue la première étape de la synthèse hormonale. Ces hormones sont indispensables au développement du système nerveux central et des poumons du fœtus et du nouveau-né. La thyroïde fœtale n’est pas fonctionnellement mûre avant 18 à 20 semaines de grossesse : au début du développement cérébral, le fœtus dépend donc de la <button class="w" data-k="e00-t4-maternelle">thyroxine d’origine maternelle (apport et dépendance fœtale)</button>, et cet apport exige un statut iodé maternel optimal.</p>
<p>La <button class="w" data-k="e00-fenetre">période la plus critique (deuxième trimestre à la troisième année)</button> couvre donc la fin de la grossesse et le début de la vie. Les besoins quotidiens en iode recommandés par l’<button class="w" data-k="e00-besoins">OMS, l’UNICEF et l’ICCIDD (90, 120, 150, 250 µg)</button> augmentent de 150 µg chez l’adulte à 250 µg pendant la grossesse et l’allaitement.</p>
<p><b>La carence.</b> Quand l’apport est très insuffisant, la thyroïde augmente la captation et le recyclage de l’iode, sécrète préférentiellement la T3 et, sous l’effet d’une TSH élevée, accroît sa masse : c’est le goitre. Si la carence est sévère, ces adaptations ne suffisent plus et la production hormonale baisse (hypothyroïdie).</p>
<p><b>Du mécanisme au tableau clinique.</b> Chez la femme enceinte carencée, la thyroxine disponible pour le cerveau fœtal est insuffisante pendant la neurogenèse. Cette <button class="w" data-k="e00-hypoxinemie">hypothyroxinémie maternelle et fœtale (conséquences neurologiques)</button> produit l’atteinte cérébrale diffuse et irréversible du type neurologique. Le type myxœdémateux s’y ajoute lorsque l’hypothyroïdie <b>persiste après la naissance</b> : elle retarde la croissance, l’ossification et la maturation sexuelle. L’atteinte neurologique se retrouve ainsi dans tous les types ; c’est la persistance de l’hypothyroïdie postnatale qui distingue le type myxœdémateux.</p>
<p>Deux cofacteurs ont été proposés pour expliquer pourquoi certains enfants développent le tableau myxœdémateux : la carence en <button class="w" data-k="e00-cofacteurs">sélénium et les goitrogènes (hypothèses)</button> et l’effet du thiocyanate sur l’iode du lait. Ces hypothèses sont présentées comme telles, car les revues de fond n’ont été lues qu’au niveau du résumé.</p>
<table class="t"><thead><tr><th>Étape</th><th>Normal</th><th>Dans la carence sévère</th></tr></thead><tbody><tr><td>Apport en iode</td><td>150 µg/jour chez l’adulte, 250 µg pendant la grossesse</td><td>Très insuffisant pendant la grossesse</td></tr><tr><td>Thyroïde maternelle</td><td>Hormones suffisantes ; relais fœtal par la thyroxine maternelle</td><td>Hypothyroxinémie maternelle puis fœtale</td></tr><tr><td>Cerveau fœtal</td><td>Neurogenèse avec apport hormonal adéquat</td><td>Atteinte diffuse irréversible</td></tr><tr><td>Après la naissance</td><td>Production thyroïdienne adéquate</td><td>Hypothyroïdie persistante possible : retard statural, osseux et pubertaire</td></tr></tbody></table>
<p>Le tableau suit la chaîne causale de l’apport vers la manifestation. Il montre que le dommage cérébral se joue avant la naissance, à un moment où aucun traitement du nouveau-né ne peut intervenir.</p>
<div class="trap"><span class="k">Piège</span> Un enfant né d’une mère carencée peut avoir une hypothyroïdie biologique modeste après la naissance et pourtant une atteinte neurologique profonde. L’intensité de l’hypothyroïdie postnatale n’indique pas l’étendue du dommage cérébral, qui s’est constitué avant.</div>
<button class="pareto-btn ui" data-k="pareto-e00-mecanismes">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="e00-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>La cause est la <b>carence iodée maternelle sévère pendant la grossesse</b>. L’<button class="w" data-k="e00-sources-guides">OMS</button> décrit les régions typiques : chaînes de montagnes, plaines alluviales, hautes altitudes et zones éloignées de la mer. L’absence de sel iodé et les conflits qui empêchent sa distribution sont des facteurs de risque. Les goitrogènes alimentaires, notamment le thiocyanate, sont proposés comme facteurs aggravants.</p>
<p>En Suisse actuelle, le facteur de risque est un apport marginal chez la femme enceinte sans supplément : la médiane d’iodurie de 97 µg/l est inférieure au seuil de 150 µg/l, et 31 % des femmes sans supplément ont un apport inférieur à 160 µg/jour contre 0,2 % de celles qui en prennent. Toutes les femmes de l’étude étaient euthyroïdiennes.</p>
<table class="t"><thead><tr><th>Facteur</th><th>Mécanisme</th><th>Niveau de preuve dans le dossier</th></tr></thead><tbody><tr><td>Région carencée (montagne, plaine alluviale, éloignement de la mer)</td><td>Apport alimentaire en iode insuffisant en l’absence de sel iodé</td><td>Guide de l’<button class="w" data-k="e00-sources-guides">OMS</button> 2007</td></tr><tr><td>Absence de sel iodé</td><td>Aucune source alimentaire d’appoint</td><td>Guide de l’<button class="w" data-k="e00-sources-guides">OMS</button> 2007</td></tr><tr><td>Goitrogènes (thiocyanate)</td><td>Inhibition compétitive du symporteur dans la glande mammaire</td><td>Hypothèse spéculative selon les auteurs</td></tr><tr><td>Carence en sélénium</td><td>Cofacteur proposé du type myxœdémateux</td><td>Hypothèse, résumé seul</td></tr><tr><td>Apport marginal de la femme enceinte en Suisse</td><td>Un tiers seulement des aliments transformés est préparé avec du sel iodé ; 47 % des femmes seulement prennent un supplément</td><td>Étude nationale suisse 2024</td></tr></tbody></table>
<p>Le tableau hiérarchise les facteurs selon le niveau de preuve réellement disponible. Le premier est établi ; les deux suivants sont des hypothèses.</p>
<div class="key"><b>À retenir.</b> Le facteur causal est unique et nutritionnel. La prévention se joue donc avant la conception, à l’échelle de la population (sel iodé) et de la femme (supplément en cas d’apport insuffisant).</div>
<button class="pareto-btn ui" data-k="pareto-e00-causes">▲ Loi de Pareto — Causes et facteurs de risque</button>
</section>

<section class="ilot" id="e00-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord le contexte de carence. Le médecin demande l’origine de la mère et le lieu de la grossesse : région carencée, absence de sel iodé, conflits ayant limité l’approvisionnement. Il demande si la communauté connaît des goitres fréquents ou d’autres cas semblables. Il documente ensuite le développement psychomoteur, l’audition et le langage.</p>
<p>Deux formes cliniques se rencontrent, et leur interrogatoire diffère.</p>
<div class="two"><div class="card"><h4>Forme neurologique (E00.0)</h4><p>L’interrogatoire du développement psychomoteur, de l’audition et du langage retrouve une déficience intellectuelle, une surdité de perception et un mutisme, associés à une démarche anormale. Le <button class="w" data-k="e00-surdimutite">strabisme et la surdi-mutité (caractérisation)</button> sont souvent signalés en premier.</p></div><div class="card"><h4>Forme myxœdémateuse (E00.1)</h4><p>Le motif de consultation est un retard de croissance avec des traits myxœdémateux et une maturation sexuelle retardée. Le déficit mental peut être moins marqué, mais l’atteinte neurologique est généralement présente.</p></div></div>
<p>Chez un nouveau-né, l’anamnèse recherche les signes d’une hypothyroïdie néonatale : hypotonie, ictère prolongé, hernie ombilicale, macroglossie. Elle recherche aussi les <button class="w" data-k="e00-iode-exces">expositions à l’iode (antiseptiques iodés, apports maternels riches en iode)</button>, qui peuvent causer une hypothyroïdie transitoire.</p>
<div class="trap"><span class="k">Piège</span> L’absence de goitre dans la famille n’exclut pas une carence maternelle ; le goitre est une adaptation, pas un signe constant d’une carence ayant touché la grossesse.</div>
</section>

<section class="ilot" id="e00-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, vitaux, croissance, puis signes ciblés. Dans le crétinisme constitué, trois groupes de signes sont recherchés.</p>
<div class="two"><div class="card"><h4>Signes neurologiques</h4><ul><li>Déficience intellectuelle.</li><li><button class="w" data-k="e00-pyramidal">Signes pyramidaux à distribution proximale (technique et lecture)</button>, hyperréflexie, signes extrapyramidaux et démarche caractéristique.</li><li>Strabisme, <button class="w" data-k="e00-surdimutite">surdité de perception et mutisme</button>, persistance des réflexes primitifs.</li></ul></div><div class="card"><h4>Signes myxœdémateux</h4><ul><li>Petite taille.</li><li>Traits myxœdémateux et immaturité sexuelle.</li><li>Retard d’ossification et épiphyses anormales à la radiographie.</li></ul></div></div>
<p>Chez le nouveau-né hypothyroïdien, le tableau est différent : <button class="w" data-k="e00-signes-neonataux">hypotonie, ictère, hernie ombilicale, macroglossie (valeur et limites)</button>. Ces signes sont inconstants et leur absence ne dispense pas du dépistage biologique.</p>
<p>Le médecin examine enfin la glande : le volume thyroïdien est plus faible chez les sujets hypothyroïdiens dans l’enquête thaïlandaise ; un goitre est possible, notamment dans une dyshormonogenèse.</p>
<div class="key"><b>À retenir.</b> L’examen neurologique est anormal dans tous les types. Ce sont la taille, les traits, la maturation sexuelle et la radiographie qui indiquent la persistance d’une hypothyroïdie postnatale. Un <button class="w" data-k="e00-mnemo">moyen mnémotechnique (aide pédagogique, non critère officiel)</button> aide à retenir la triade neurologique.</div>
<button class="pareto-btn ui" data-k="pareto-e00-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
