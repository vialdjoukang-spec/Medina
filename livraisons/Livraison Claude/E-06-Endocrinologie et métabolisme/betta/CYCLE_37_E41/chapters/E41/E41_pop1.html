<template data-pop="e41-whz" data-title="Poids pour la taille en écarts-types : calcul et lecture"><h3>Ce que mesure le chiffre</h3><p>Le poids pour la taille compare un enfant à la population de référence de l’OMS pour une même taille. Le résultat s’exprime en écarts-types : c’est la différence entre le poids mesuré et le poids moyen de référence, divisée par l’écart-type de cette référence. La valeur 0 correspond à la moyenne ; −3 correspond à trois écarts-types au-dessous. Le calcul exige les tables de référence de l’OMS, qui ne figurent pas dans les sources lues : ce cours n’en reproduit aucune valeur.</p><h3>Seuils</h3><p>Une valeur inférieure à −3 définit l’émaciation sévère ; de −3 à moins de −2, la malnutrition aiguë modérée ; une valeur inférieure à −2 entre dans la malnutrition aiguë globale (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). La note de la CIM-10-GM exprime la même idée en poids situé à 3 écarts-types ou plus sous la moyenne (grave), 2 à moins de 3 (modérée), 1 à moins de 2 (légère) (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</p><h3>Limite</h3><p>Le poids pour la taille ne s’applique qu’à un enfant sans œdème : l’eau retenue augmente le poids et masque la maigreur. Chez le nourrisson de moins de 6 mois, on utilise le poids pour la longueur (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><div class="key"><b>À retenir.</b> Le chiffre est un rapport à une population de référence et non une valeur absolue ; il se lit avec le périmètre brachial et l’examen de l’œdème.</div></template>
<template data-pop="e41-muac" data-title="Périmètre brachial : mesure et seuils"><h3>Définition</h3><p>Le périmètre brachial est la circonférence du bras. Il se mesure en millimètres avec un ruban gradué. Son intérêt est de ne pas dépendre d’une balance ni d’une toise ; l’OMS l’utilise comme critère à part entière depuis 2013 (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>). Le site précis de mesure n’est pas décrit dans les sources lues.</p><h3>Seuils pour l’enfant de 6 à 59 mois</h3><table class="t"><tr><th>Périmètre brachial</th><th>Catégorie</th></tr><tr><td>&lt; 115 mm</td><td>Émaciation sévère</td></tr><tr><td>115 à &lt; 125 mm</td><td>Malnutrition aiguë modérée</td></tr><tr><td>≥ 125 mm</td><td>Hors de ces catégories ; seuil de fin de traitement ambulatoire</td></tr></table><p>Le nourrisson de plus de 60 jours et de moins de 6 mois se classe à moins de 110 mm selon une proposition rapportée par Bhutta. Le seuil de sortie et la catégorie sont indépendants du poids pour la taille : un seul critère atteint suffit à classer l’enfant dans la catégorie la plus grave.</p><div class="trap"><span class="k">Piège</span> Appliquer les seuils de 115 et 125 mm à l’adulte. Ils concernent l’enfant de 6 à 59 mois.</div></template>
<template data-pop="e41-nrs" data-title="NRS 2002 : dépistage du risque nutritionnel"><h3>Principe</h3><p>Le Nutritional Risk Screening 2002 est un outil de dépistage validé, publié par Kondrup et ses collègues. Il identifie les patients hospitalisés dont l’état nutritionnel risque de se détériorer. Un score d’au moins 3 points indique un risque nutritionnel (<a href="https://doi.org/10.1016/s0261-5614(02)00214-5" target="_blank" rel="noopener">Kondrup 2003</a> ; <a href="https://doi.org/10.1016/S0140-6736(18)32776-4" target="_blank" rel="noopener">EFFORT 2019</a>).</p><h3>Usage en Suisse</h3><p>Dans l’essai EFFORT, le dépistage par ce score a servi à inclure les patients, qui ont ensuite reçu un soutien individualisé (<a href="https://doi.org/10.1016/S0140-6736(18)32776-4" target="_blank" rel="noopener">EFFORT 2019</a>). Dans l’étude de prévalence d’Imoberdorf, 18,2 % des admissions de médecine interne avaient un score d’au moins 3 (<a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf 2010</a>).</p><h3>Limites</h3><p>Le détail du calcul du score (composantes de l’état nutritionnel et de la gravité de la maladie) n’a pas été lu : il n’est pas reproduit ici. Le score dépiste le risque, il ne pose pas le diagnostic de malnutrition, qui relève du consensus GLIM.</p></template>
<template data-pop="e41-glim" data-title="GLIM : deux critères, deux temps"><h3>Démarche</h3><p>Le consensus GLIM (Global Leadership Initiative on Malnutrition) propose une démarche en deux temps : un dépistage du risque par un outil validé, puis une évaluation (<a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a>).</p><h3>Critères</h3><p>Le diagnostic exige au moins un critère de phénotype et au moins un critère d’étiologie.</p><table class="t"><tr><th>Type</th><th>Critères</th></tr><tr><td>Phénotype</td><td>Perte de poids involontaire ; indice de masse corporelle bas ; masse musculaire réduite</td></tr><tr><td>Étiologie</td><td>Apport ou assimilation réduits ; inflammation ou charge de maladie</td></tr></table><p>La gravité se répartit en stade 1 (modérée) et stade 2 (sévère) selon les critères de phénotype ; quatre catégories diagnostiques sont fondées sur l’étiologie (<a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a>).</p><h3>Pourquoi deux critères</h3><p>Le phénotype décrit le résultat (la perte), l’étiologie décrit sa raison. Le couple évite de poser le diagnostic sur un seul chiffre et oriente la prise en charge vers la cause (raisonnement du cours). Une mise à jour à cinq ans (Clin Nutr 2025) existe ; elle n’a pas été lue.</p></template>
<template data-pop="e41-glim-seuils" data-title="Seuils de gravité GLIM : ce qui n’a pas pu être lu"><h3>Lacune assumée</h3><p>Le texte intégral du consensus GLIM a été inaccessible lors de la recherche. Les seuils de stade 1 et de stade 2, ainsi que les seuils de masse musculaire, n’ont donc pas été lus et ne sont pas écrits dans ce cours.</p><h3>Ce qui a été lu</h3><p>Une étude espagnole de 2024, chez 1036 patients hospitalisés (63,3 % de malnutrition liée à la maladie selon GLIM), rapporte les seuils suivants : perte de poids supérieure à 5 % en six mois ou à 10 % au-delà ; indice de masse corporelle inférieur à 20 kg/m² avant 70 ans, inférieur à 22 kg/m² à partir de 70 ans (<a href="https://doi.org/10.3390/nu16234099" target="_blank" rel="noopener">Nutrients 2024</a>).</p><h3>Conduite pour le lecteur</h3><p>Ces seuils sont des repères rapportés par une étude, et non le texte du consensus. Avant un usage de codage ou d’examen, le lecteur doit les vérifier dans la publication GLIM 2019 ou sa mise à jour de 2025.</p></template>
<template data-pop="e41-espen-def" data-title="ESPEN : définitions de la malnutrition de l’adulte"><h3>Qui est l’ESPEN</h3><p>L’ESPEN est la Société européenne de nutrition clinique et de métabolisme. Ses définitions de 2017 distinguent trois situations (<a href="https://doi.org/10.1016/j.clnu.2016.09.004" target="_blank" rel="noopener">ESPEN 2017</a>).</p><table class="t"><tr><th>Situation</th><th>Remarque</th></tr><tr><td>Malnutrition liée à la maladie avec inflammation</td><td>Équivalent de la cachexie</td></tr><tr><td>Malnutrition liée à la maladie sans inflammation</td><td>Perte d’origine d’apport ou d’assimilation</td></tr><tr><td>Malnutrition sans maladie</td><td>Par exemple liée à la faim</td></tr></table><p>La sarcopénie et la fragilité sont des entités distinctes, souvent associées (<a href="https://doi.org/10.1016/j.clnu.2016.09.004" target="_blank" rel="noopener">ESPEN 2017</a>).</p><h3>Rapprochement avec le marasme</h3><p>Le tableau de malnutrition grave sans œdème et d’origine alimentaire correspond didactiquement aux deux dernières lignes. C’est une correspondance de ce cours, non une équivalence officielle. Les résumés lus ne mentionnent pas le marasme comme entité de l’adulte.</p></template>
<template data-pop="e41-mas" data-title="Malnutrition aiguë sévère : un regroupement"><h3>Définition</h3><p>La malnutrition aiguë sévère regroupe l’émaciation sévère (marasme) et le kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Le mot décrit un niveau de gravité, non un tableau clinique unique.</p><h3>Pourquoi ce regroupement</h3><p>Le regroupement est un choix de définition de la revue ; ses motifs ne sont pas détaillés dans les sources lues. Les statistiques mondiales (52 millions d’enfants émaciés, dont 17 millions de façon sévère) portent sur l’émaciation, non sur le kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Piège</h3><p>Utiliser « malnutrition aiguë sévère » comme synonyme de marasme. Le terme englobe aussi le kwashiorkor, qui se code E40.</p></template>
<template data-pop="e41-nourrisson" data-title="Nourrisson de moins de six mois"><h3>Critères</h3><p>L’OMS retient le poids pour la longueur inférieur à −3 écarts-types. Un périmètre brachial inférieur à 110 mm est proposé au-delà de 60 jours de vie (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Particularités de prise en charge</h3><p>Le soutien à l’allaitement ou la relactation est la base ; le F-100 n’est jamais donné non dilué ; les antibiotiques sont les mêmes que chez l’enfant plus âgé (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Limite</h3><p>Les sources lues ne donnent pas de seuil d’hypoglycémie ni de volume de lait propres à cet âge.</p></template>
<template data-pop="e41-fonte" data-title="Gradation de la fonte musculaire"><h3>Les quatre niveaux</h3><table class="t"><tr><th>Niveau</th><th>Région atteinte</th></tr><tr><td>I</td><td>Aisselles et aines</td></tr><tr><td>II</td><td>Cuisses et fesses</td></tr><tr><td>III</td><td>Thorax et abdomen</td></tr><tr><td>IV</td><td>Muscles de la face</td></tr></table><p>Cette gradation vient de la revue de Dipasquale (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Elle sert à décrire l’étendue de la fonte lors de l’inspection.</p><h3>Lecture</h3><p>Plus le niveau est élevé, plus la fonte est étendue ; le niveau IV signe une atteinte des muscles du visage, associée au faciès « vieilli ». Les sources lues ne précisent pas si cette gradation prédit la mortalité : elle ne remplace pas la mesure du poids pour la taille ni du périmètre brachial.</p></template>
<template data-pop="e41-mesure-unique" data-title="Pourquoi une mesure unique reste présomptive"><h3>Ce que dit la classification</h3><p>La note du bloc de la CIM-10-GM précise qu’une mesure unique ne fonde qu’un diagnostic présomptif, à étayer par la clinique ou la biologie ; en l’absence de poids, la clinique décide (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>). Une perte de poids documentée, ou chez l’enfant l’absence de prise de poids, indique habituellement la malnutrition.</p><h3>Raisonnement</h3><p>Une mesure peut être erronée (balance, toise, posture) ou refléter un état transitoire (rétention d’eau). Une évolution entre deux mesures, ou une concordance avec la clinique, réduit ces risques (raisonnement du cours).</p><h3>Conduite</h3><p>Doubler la mesure, la reporter sur la courbe et chercher les signes cliniques (fonte, absence d’œdème) avant d’inscrire le diagnostic définitif.</p></template>
<template data-pop="e41-e40-e42" data-title="Catégories voisines du marasme : E40, E42, E43, E44, E46"><h3>Ce que précise la classification</h3><p>La catégorie E41 est sans sous-code. Elle inclut la « malnutrition grave avec marasme » et exclut le kwashiorkor-marasme, qui se classe E42 (forme intermédiaire ou signes simultanés de kwashiorkor et de marasme) (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</p><h3>Les voisins</h3><p>Le kwashiorkor (œdème nutritionnel) est la catégorie E40. La malnutrition protéino-énergétique grave sans précision est la catégorie E43 et inclut l’« œdème de famine » ; son poids se situe à 3 écarts-types ou plus sous la moyenne. La malnutrition modérée (2 à moins de 3 écarts-types) et légère (1 à moins de 2) se codent respectivement aux premier et second sous-codes de la catégorie E44. La malnutrition sans précision est E46 (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</p><h3>Conduite de codage</h3><p>Le tri se fait par l’œdème : sans œdème avec fonte, E41 ; avec œdème seul, E40 ; signes simultanés, E42. Le plan du cours renvoie aux cours E40 et E42 pour ces formes.</p></template>
<template data-pop="e41-deces" data-title="Mortalité de la malnutrition : des estimations différentes"><h3>Les chiffres lus</h3><p>La revue de Bhutta rapporte 174 000 décès d’enfants de moins de 5 ans directement dus à la malnutrition protéino-énergétique en 2015. Une analyse du Lancet de 2013 attribue 875 000 décès à l’émaciation (12,6 % des décès), dont 516 000 à l’émaciation sévère (7,4 %) (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). La revue de l’OMS de 2016 cite environ 540 000 décès annuels directement dus à la malnutrition aiguë sévère (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Pourquoi ces écarts</h3><p>Les trois nombres répondent à des questions distinctes. Le premier compte les décès où la malnutrition est la cause directe. Le deuxième compte les décès attribuables à l’émaciation, c’est-à-dire ceux qui n’auraient pas eu lieu sans elle, y compris par infection. Le troisième est un ordre de grandeur annuel de la malnutrition aiguë sévère. Les périodes diffèrent aussi (2013, 2015, 2016).</p><h3>Règle de lecture</h3><p>Citer le chiffre avec sa définition et son année. Les sources lues ne permettent pas de les additionner ni de choisir un seul « vrai » nombre.</p></template>
<template data-pop="e41-rr" data-title="Risque relatif : ce que compare le chiffre"><h3>Définition</h3><p>Un risque relatif est le rapport entre la fréquence d’un événement (ici le décès) dans un groupe exposé et dans un groupe de référence. Un risque relatif de 11,6 signifie que le risque est 11,6 fois plus élevé chez les enfants exposés que dans le groupe de référence (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Ce que le chiffre ne dit pas</h3><p>Il ne donne pas la proportion d’enfants qui meurent : celle-ci dépend du risque de base dans le groupe de référence. Il ne démontre pas à lui seul une causalité : la malnutrition est associée aux infections graves et aux décès, et les études de ce type reposent sur des observations.</p><h3>Autres rapports</h3><p>Le rapport de risques instantanés (hazard ratio) compare la vitesse de survenue de l’événement dans le temps ; le rapport de cotes (odds ratio) compare des cotes et approche le risque relatif quand l’événement est rare (rappel de statistique générale). Les valeurs de 2,3 et 12,3 rapportées pour l’émaciation et l’association émaciation-retard de croissance sont des rapports de risques instantanés (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p></template>
<template data-pop="e41-suisse-prevalence" data-title="Prévalence suisse : deux études, deux questions"><h3>Imoberdorf 2010</h3><p>L’étude porte sur 32 837 admissions de médecine interne dans sept hôpitaux suisses, de 2003 à 2006. Elle mesure le risque nutritionnel par le score NRS 2002 : 18,2 % des admissions avaient un score d’au moins 3 (<a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf 2010</a>). Elle mesure un risque, non un diagnostic.</p><h3>Tanweer et collègues 2026</h3><p>L’étude analyse la statistique hospitalière suisse de 2012 à 2022. La malnutrition documentée passe de 1,40 % à 8,14 % des séjours. Elle est associée à l’âge supérieur à 90 ans (rapport de cotes 9,62), au sexe féminin (1,26), à un score de Charlson supérieur à 8 (6,73) et à l’admission urgente (1,47). Elle est associée aux soins intensifs (1,70), au décès hospitalier (1,37) et au séjour supérieur à 5 jours (8,07). 61,9 % des patients ont reçu une consultation diététique (<a href="https://doi.org/10.1016/j.nut.2026.113269" target="_blank" rel="noopener">Tanweer et collègues 2026</a>).</p><h3>Interprétation</h3><p>La seconde étude compte ce qui est codé. L’augmentation peut donc refléter le codage autant que la maladie, et elle ne se limite pas au code E41. Les deux études ne s’additionnent pas : l’une mesure un risque à l’admission, l’autre un diagnostic enregistré.</p></template>
<template data-pop="e41-adaptation" data-title="Adaptation hormonale du marasme"><h3>Les variations rapportées</h3><table class="t"><tr><th>Hormone</th><th>Variation</th><th>Conséquence attendue</th></tr><tr><td>Triiodothyronine (T3)</td><td>Baisse</td><td>Métabolisme de base abaissé</td></tr><tr><td>Insuline</td><td>Baisse</td><td>Moindre stockage ; moindre captation du glucose</td></tr><tr><td>IGF-1</td><td>Baisse</td><td>Croissance arrêtée</td></tr><tr><td>Hormone de croissance</td><td>Hausse</td><td>Mobilisation des réserves</td></tr><tr><td>Cortisol</td><td>Hausse</td><td>Catabolisme protéique</td></tr></table><p>Les directions des variations viennent de Dipasquale (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Les conséquences attendues sont les effets habituels de chaque hormone, rappelés comme raisonnement du cours : les sources lues ne les détaillent pas pour le marasme.</p><h3>Interprétation</h3><p>L’ensemble décrit une économie : la baisse de la T3, de l’insuline et de l’IGF-1 réduit la dépense et la croissance, tandis que la hausse de l’hormone de croissance et du cortisol mobilise les réserves. La hausse du cortisol n’est pas associée à un défaut de l’axe corticotrope : cet axe est préservé (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p></template>
<template data-pop="e41-leptine" data-title="Leptine : un marqueur de la masse grasse"><h3>Ce que dit la source</h3><p>La leptine est basse dans la malnutrition aiguë sévère, et elle est inversement associée à la mortalité : plus elle est basse, plus la mortalité est élevée (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Lecture</h3><p>La leptine est produite par le tissu adipeux (rappel de physiologie générale, non détaillé par les sources lues) ; sa baisse accompagne la fonte graisseuse. L’association avec la mortalité est observationnelle : elle ne prouve pas que la leptine soit un facteur causal, et elle n’est pas un examen de routine.</p><h3>Limite</h3><p>Aucun seuil de leptine ni dosage clinique n’est décrit dans les sources lues. Elle est citée ici comme élément de compréhension de l’adaptation.</p></template>
<template data-pop="e41-ubiquitine" data-title="Voie ubiquitine-protéasome : la protéolyse musculaire"><h3>Mécanisme</h3><p>La voie ubiquitine-protéasome est le principal système de dégradation des protéines musculaires dans la malnutrition aiguë sévère : les protéines marquées par l’ubiquitine sont dégradées par le protéasome (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Les cytokines (TNF, interleukines 1 et 6) réduisent l’appétit et sont cataboliques : elles stimulent cette dégradation.</p><h3>Conséquence clinique</h3><p>La dégradation fournit les acides aminés de la néoglucogenèse et explique la fonte musculaire, la faiblesse, la réduction de la ventilation et de la contractilité cardiaque.</p><h3>Limite</h3><p>Le détail moléculaire de l’activation n’est pas décrit dans les sources lues ; le cours se limite au rôle principal de la voie.</p></template>
<template data-pop="e41-hypoglycemie" data-title="Hypoglycémie du marasme : pourquoi elle survient"><h3>Les faits</h3><p>La clairance du glucose est altérée et la réponse endocrine pancréatique est émoussée ; l’axe corticotrope est préservé et ne cause donc pas l’hypoglycémie (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Chaîne causale</h3><p>L’apport de glucose alimentaire manque, le glycogène hépatique est épuisé, la néoglucogenèse dépend du muscle déjà réduit, et la réponse pancréatique est émoussée. La conséquence est une glycémie qui chute dès que l’apport s’interrompt (raisonnement du cours, d’après les faits cités).</p><h3>Décision</h3><p>La correction est le glucose et l’alimentation rapprochée, non une hormone de remplacement. La voie dépend de l’état de conscience (îlot 12).</p><div class="trap"><span class="k">Piège</span> Mettre une hypoglycémie du marasme sur le compte d’une insuffisance surrénale : l’axe corticotrope est préservé selon les sources lues.</div></template>
<template data-pop="e41-coeur" data-title="Cœur du marasme : des données discordantes"><h3>Ce que disent les deux sources</h3><p>Dipasquale décrit des myofibrilles amincies, une contractilité altérée, un débit cardiaque réduit en proportion de la perte de poids et un risque accru d’arythmie (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Bhutta rapporte, selon certaines études, un débit cardiaque normal quand il est rapporté à la surface corporelle (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Arbitrage</h3><p>Les deux énoncés peuvent coexister : un débit absolu plus faible chez un enfant plus petit se normalise lorsqu’on le rapporte à la surface corporelle (raisonnement du cours). Le choix pratique ne change pas : la prudence du remplissage et la surveillance de la surcharge toutes les 5 à 10 minutes (<a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Limite</h3><p>Les sources lues ne permettent pas d’affirmer que le cœur est normal, ni qu’il est défaillant au repos ; elles justifient la prudence.</p></template>
<template data-pop="e41-intestin" data-title="Atrophie villositaire et malabsorption"><h3>Les lésions</h3><p>Dipasquale décrit une atrophie villositaire, une hypoplasie des cryptes, une perméabilité altérée, une pullulation bactérienne et une atrophie du pancréas (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Les conséquences</h3><p>La surface d’absorption diminue et les enzymes pancréatiques manquent : l’absorption des graisses et des sucres baisse. Les mono- et disaccharides mal absorbés restent dans la lumière intestinale et attirent l’eau : c’est une diarrhée osmotique (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Elle aggrave la déshydratation et la perte de potassium (raisonnement du cours).</p><h3>Décision</h3><p>L’alimentation commence par des petits volumes fréquents (îlot 12). Les sources lues ne précisent pas la durée de récupération de la muqueuse.</p></template>
<template data-pop="e41-infection-pauci" data-title="Infections pauci-symptomatiques"><h3>Définition</h3><p>« Pauci-symptomatique » signifie qui s’exprime par peu de symptômes. Chez l’enfant marasmique, des infections graves peuvent se présenter avec peu de signes (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Pourquoi</h3><p>Les déficits de l’immunité (thymus, lymphocytes CD4, phagocytose, IgA sécrétoires, complément) réduisent la réaction inflammatoire locale et systémique. L’explication est un raisonnement du cours à partir de ces déficits.</p><h3>Décision</h3><p>L’antibiothérapie empirique pour tous et la recherche d’infection à l’arrivée sont justifiées par cette discrétion (îlot 12).</p><div class="trap"><span class="k">Erreur fréquente</span> Attendre la fièvre ou une hyperleucocytose pour traiter. Leur absence ne prouve pas l’absence d’infection chez un enfant marasmique.</div></template>
<template data-pop="e41-cerveau" data-title="Cerveau et malnutrition : atteinte possiblement irréversible"><h3>Les faits</h3><p>Le cerveau compte moins de neurones, de synapses et de fibres myélinisées ; une atteinte possiblement irréversible est rapportée après 3 à 4 ans (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). L’enfant est apathique, avec lenteur motrice et troubles de la parole (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Conséquences</h3><p>Les séquelles incluent retard de développement, troubles du comportement et moins bonne scolarité (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). La stimulation psychosociale améliore le développement et la scolarité jusqu’à l’adolescence.</p><h3>Limite</h3><p>La formulation « possiblement irréversible » est prudente : la source ne tranche pas le seuil temporel exact. Le cours ne le précise pas davantage.</p></template>
<template data-pop="e41-marasme-kwashiorkor" data-title="Marasme et kwashiorkor : ce que les sources comparent"><h3>Deux descriptions</h3><table class="t"><tr><th>Caractère</th><th>Marasme</th><th>Kwashiorkor</th></tr><tr><td>Œdème</td><td>Absent</td><td>Présent, bilatéral</td></tr><tr><td>Poids pour l’âge</td><td>Très bas</td><td>Presque normal</td></tr><tr><td>Graisse et muscle</td><td>Fonte marquée</td><td>Moins marquée à l’inspection</td></tr><tr><td>Foie</td><td>Stéatose fréquente</td><td>Stéatose, hépatomégalie</td></tr><tr><td>Albumine</td><td>Non précisée par les sources lues</td><td>Hypoalbuminémie</td></tr><tr><td>Nature de la réponse</td><td>Adaptative</td><td>Maladaptative</td></tr></table><p>Le tableau reprend <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> et <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>. La mention « moins marquée à l’inspection » est une lecture du cours du poids presque normal ; la ligne « foie » associe la stéatose fréquente citée pour la malnutrition en général et l’hépatomégalie citée pour le kwashiorkor.</p><h3>Ce qui reste discuté</h3><p>Les sources lues décrivent les deux formes, mais ne tranchent pas pourquoi un enfant évolue vers l’une ou l’autre. Le cours ne propose pas d’explication non lue.</p></template>
<template data-pop="e41-vih" data-title="VIH et malnutrition aiguë sévère"><h3>Les chiffres</h3><p>L’infection par le virus de l’immunodéficience humaine concerne 15 à 29 % des enfants hospitalisés pour malnutrition en Afrique subsaharienne, et la mortalité y est multipliée par 3 (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><h3>Conséquences pratiques</h3><p>La recherche du VIH fait partie du bilan d’une malnutrition aiguë sévère. Ces chiffres sont africains : ils ne donnent pas la prévalence suisse, qui n’est pas documentée dans les sources lues.</p><h3>Piège</h3><p>Transposer ces pourcentages à un enfant en Suisse sans tenir compte de la prévalence locale.</p></template>
<template data-pop="e41-hypothermie" data-title="Bradycardie, hypotension, hypothermie : mécanismes et limites"><h3>Les signes</h3><p>L’enfant marasmique présente une bradycardie, une hypotension et une hypothermie (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Mécanismes</h3><p>Le métabolisme de base et la dépense énergétique totale sont abaissés ; le cœur a un débit réduit ; la graisse sous-cutanée, qui isole, a disparu. La chaleur produite diminue et la perte augmente (raisonnement du cours, à partir de ces faits).</p><h3>Limites</h3><p>Les seuils chiffrés d’hypothermie, de bradycardie et d’hypotension de l’OMS n’ont pas été lus : ils ne sont pas reproduits. Aucune conduite spécifique devant l’hypothermie n’est documentée dans les sources lues ; le réchauffement relève du traitement général.</p></template>
<template data-pop="e41-peau-face" data-title="Peau et visage de l’enfant marasmique"><h3>Les signes</h3><p>La peau est sèche, ridée et lâche par perte de la graisse sous-cutanée. Le visage prend un aspect « vieilli » par fonte des boules de Bichat (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Interprétation</h3><p>Ces signes traduisent la perte du tissu adipeux : la peau n’est plus tendue par la graisse. Leur absence n’exclut pas un marasme débutant. Leur présence ne remplace pas la mesure du poids pour la taille.</p><h3>Distinction</h3><p>Dans le kwashiorkor, des lésions cutanées et des cheveux décolorés sont décrits : ils ne font pas partie du tableau typique du marasme (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p></template>
<template data-pop="e41-courbe" data-title="Reporter le poids et la taille sur une courbe"><h3>Pourquoi reporter</h3><p>Un examen sans report sur courbe est « très imprécis » selon Dipasquale (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Le report situe l’enfant par rapport à la population de référence et révèle la trajectoire : une absence de prise de poids indique habituellement la malnutrition (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</p><h3>Quoi mesurer</h3><p>Poids, taille, périmètre brachial, et périmètre crânien avant 2 ans (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Piège</h3><p>Utiliser une courbe qui ne correspond pas à l’âge ou au sexe. Les courbes de l’OMS ne sont pas reproduites dans les sources lues.</p></template>
<template data-pop="e41-albumine" data-title="Albumine, préalbumine, protéine liant le rétinol"><h3>Rôle</h3><p>Ces trois protéines sont utiles en série, surtout pour guider le traitement d’une malnutrition secondaire ; elles ne posent pas le diagnostic de malnutrition aiguë de l’enfant, qui est anthropométrique (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Lecture d’une valeur</h3><p>Une valeur basse isolée peut refléter l’inflammation, la dilution ou un apport insuffisant ; les sources lues ne précisent pas leurs intervalles de référence ni leur cinétique (raisonnement du cours).</p><h3>Piège</h3><p>Utiliser l’albumine comme seul critère de dénutrition. Elle accompagne l’œdème du kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>) mais ne distingue pas à elle seule les formes.</p></template>
