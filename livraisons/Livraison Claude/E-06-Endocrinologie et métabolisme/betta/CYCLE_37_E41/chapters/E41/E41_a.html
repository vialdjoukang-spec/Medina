<section class="ilot" id="e41-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Un enfant de 18 mois est amené aux urgences par ses parents. Il est apathique, très maigre, sans œdème des pieds. Son <button class="w" data-k="e41-whz">poids pour la taille</button> se situe à −3,4 écarts-types de la population de référence et son <button class="w" data-k="e41-muac">périmètre brachial</button> mesure 108 mm. Sa température est basse et sa glycémie capillaire aussi. Ces chiffres suffisent à reconnaître une émaciation sévère, nommée marasme. <b>La question décisive vient ensuite : ce qui menace l’enfant dans les premières heures n’est pas la maigreur, mais l’hypoglycémie, le froid, l’infection et une renutrition mal conduite.</b></p><p>Une seconde situation se rencontre dans les hôpitaux suisses. Un homme de 84 ans, hospitalisé pour une pneumonie, a perdu 12 % de son poids en cinq mois et son indice de masse corporelle atteint 18 kg/m². Son score <button class="w" data-k="e41-nrs">NRS 2002</button> vaut 4. Il mange peu depuis des semaines. Le piège est ici inverse : vouloir le « remettre à niveau » vite. Après un jeûne prolongé, l’apport brutal de glucose peut déclencher un <button class="w" data-k="e41-renutrition">syndrome de renutrition</button>, avec chute du phosphate, du potassium et du magnésium.</p><p>Le marasme est donc un cours à deux visages. L’enfant relève du cadre de l’Organisation mondiale de la santé (OMS), fondé sur l’anthropométrie. L’adulte relève du cadre <button class="w" data-k="e41-glim">GLIM</button>, combinant un critère de phénotype et un critère d’étiologie. Les deux partagent la même physiopathologie : un apport énergétique insuffisant, une adaptation qui épargne l’organisme à court terme, puis un épuisement.</p><div class="key"><b>Point de départ.</b> Pour l’enfant de 6 à 59 mois, le marasme se reconnaît à un poids pour la taille inférieur à −3 écarts-types ou à un périmètre brachial inférieur à 115 mm, <b>en l’absence d’œdème nutritionnel</b> (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Pour l’adulte, il faut au moins un critère de phénotype et un critère d’étiologie (<a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a>).</div><p>Le chapitre suit l’ordre d’une consultation : définir, classer et comprendre (îlots 1 à 6), chercher la cause, interroger, examiner et décider du diagnostic (îlots 7 à 11), traiter l’enfant puis l’adulte et prévenir la renutrition (îlots 12 à 15), enfin surveiller et conclure (îlots 16 à 18).</p><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta et al., Nat Rev Dis Primers 2017</a> ; <a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">Cederholm et al., critères GLIM, Clin Nutr 2019</a> ; <a href="https://doi.org/10.3390/jcm8122202" target="_blank" rel="noopener">Reber et al., J Clin Med 2019</a>.</p></section>
<section class="ilot" id="e41-1"><h2><span class="n">1</span>Définition et terminologie</h2><p>Le marasme est la forme la plus fréquente de malnutrition aiguë. Il résulte d’un <b>apport énergétique insuffisant pendant des mois ou des années</b> (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Le terme dérive d’un mot grec qui signifie dépérissement. Cette origine décrit l’aspect clinique : l’organisme consomme ses propres réserves de graisse et de muscle faute d’énergie venue de l’alimentation, et rien ne s’accumule en excès dans les tissus.</p><p>Plusieurs vocabulaires se côtoient, et le lecteur doit savoir les traduire de l’un à l’autre.</p><ul><li><b>Émaciation sévère</b> (<i>severe wasting</i>) : terme employé par Bhutta et ses collègues, « aussi appelée marasme », caractérisé par une faible masse tissulaire et d’autres anomalies physiologiques (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</li><li><b>Malnutrition aiguë sévère</b> : regroupement qui comprend l’émaciation sévère et le kwashiorkor (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>) ; le <button class="w" data-k="e41-mas">détail de ce regroupement</button> figure en fenêtre.</li><li><b>Émaciation et œdème nutritionnel (malnutrition aiguë)</b> : intitulé de la ligne directrice de l’OMS du 29 décembre 2023, qui remplace celle de 2013 (<a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023</a>).</li><li><b>Marasme nutritionnel</b> : libellé de la classification CIM-10-GM 2024 pour la catégorie E41, qui inclut la « malnutrition grave avec marasme » (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</li></ul><p>Chez l’adulte, l’<button class="w" data-k="e41-espen-def">ESPEN</button> sépare trois situations : la malnutrition liée à la maladie avec inflammation (équivalent de la cachexie), la malnutrition liée à la maladie sans inflammation, et la malnutrition sans maladie, par exemple liée à la faim (<a href="https://doi.org/10.1016/j.clnu.2016.09.004" target="_blank" rel="noopener">ESPEN 2017</a>). La sarcopénie et la fragilité sont des entités distinctes, souvent associées. Le marasme de l’adulte se rapproche du tableau de malnutrition grave sans œdème, d’origine alimentaire : ce rapprochement est une correspondance didactique de ce cours, non une équivalence officielle.</p><div class="key"><b>À retenir.</b> Trois mots, une même idée : marasme, émaciation sévère et malnutrition grave sans œdème décrivent la fonte des réserves par manque d’énergie. Le mot « marasme » reste le libellé du code E41.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a> ; <a href="https://www.who.int/publications/i/item/9789240082830" target="_blank" rel="noopener">OMS 2023, notice</a> ; <a href="https://doi.org/10.1016/j.clnu.2016.09.004" target="_blank" rel="noopener">ESPEN 2017</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>.</p></section>
<section class="ilot" id="e41-2"><h2><span class="n">2</span>Classifications et mesure de la gravité</h2><p>Une classification répond à une question pratique : à partir de quelle mesure décide-t-on de traiter, et avec quelle urgence ? Trois systèmes coexistent. Aucun ne remplace les deux autres, car ils s’adressent à des populations différentes.</p><h3>L’enfant de 6 à 59 mois (OMS)</h3><p>L’OMS classe la gravité par deux mesures indépendantes : le <button class="w" data-k="e41-whz">rapport poids pour la taille exprimé en écarts-types</button> et le <button class="w" data-k="e41-muac">périmètre brachial</button>. La seconde est un critère à part entière depuis 2013 (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a>).</p><table class="t"><tr><th>Catégorie</th><th>Poids pour la taille</th><th>Périmètre brachial</th><th>Œdème nutritionnel</th></tr><tr><td>Émaciation sévère (marasme)</td><td>&lt; −3 écarts-types</td><td>&lt; 115 mm</td><td>Absent</td></tr><tr><td>Malnutrition aiguë modérée</td><td>−3 à &lt; −2 écarts-types</td><td>115 à &lt; 125 mm</td><td>Absent</td></tr><tr><td>Malnutrition aiguë globale</td><td>&lt; −2 écarts-types</td><td>&lt; 125 mm</td><td>Ou œdème présent</td></tr></table><p>Ce tableau se lit ainsi : un seul des deux critères anthropométriques suffit à classer l’enfant dans la catégorie la plus grave. Le périmètre brachial est utile parce qu’il se mesure sans balance ni toise, avec un ruban gradué, ce qui permet un dépistage rapide. La présence d’un œdème bilatéral oriente vers une autre forme, le kwashiorkor, traité dans le cours E40.</p><h3>Le nourrisson de moins de 6 mois</h3><p>Pour le <button class="w" data-k="e41-nourrisson">nourrisson de moins de six mois</button>, l’OMS retient le poids pour la longueur inférieur à −3 écarts-types ; un périmètre brachial inférieur à 110 mm au-delà de 60 jours de vie est proposé (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><h3>Gradation clinique de la fonte</h3><p>La fonte musculaire se grade chez l’enfant en quatre niveaux selon la région atteinte : aisselles et aines (niveau I), cuisses et fesses (II), thorax et abdomen (III), muscles de la face (IV) (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). La <button class="w" data-k="e41-fonte">lecture de cette gradation</button> se précise en fenêtre.</p><h3>L’adulte (GLIM)</h3><p>Le diagnostic de malnutrition de l’adulte suit une démarche en deux temps : un dépistage du risque par un outil validé, puis une évaluation. Il exige <b>au moins un critère de phénotype</b> (perte de poids involontaire, indice de masse corporelle bas, masse musculaire réduite) <b>et au moins un critère d’étiologie</b> (apport ou assimilation réduits ; inflammation ou charge de maladie). La gravité se répartit en stade 1 (modérée) et stade 2 (sévère) selon les critères de phénotype (<a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a>). Les seuils rapportés par une étude espagnole sont une perte de poids supérieure à 5 % en six mois ou à 10 % au-delà, et un indice de masse corporelle inférieur à 20 kg/m² avant 70 ans, inférieur à 22 kg/m² à partir de 70 ans (<a href="https://doi.org/10.3390/nu16234099" target="_blank" rel="noopener">Nutrients 2024</a>). Les <button class="w" data-k="e41-glim-seuils">seuils de stade et de masse musculaire</button> n’ont pas pu être lus : ils ne sont pas écrits dans ce cours.</p><h3>Limites avec les catégories voisines de la CIM-10-GM</h3><p>La note du bloc de la CIM-10-GM 2024 précise que la gravité se juge d’ordinaire sur le poids exprimé en écarts-types par rapport à la population de référence : grave à 3 écarts-types ou plus sous la moyenne, modérée de 2 à moins de 3, légère de 1 à moins de 2. Une <button class="w" data-k="e41-mesure-unique">mesure unique</button> ne fonde qu’un diagnostic présomptif ; en l’absence de poids, la clinique décide (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>). Le <button class="w" data-k="e41-e40-e42">kwashiorkor-marasme (E42), l’œdème de famine et les autres catégories voisines</button> ne se confondent pas avec E41.</p><div class="key"><b>À retenir.</b> Chez l’enfant, un poids pour la taille inférieur à −3 écarts-types ou un périmètre brachial inférieur à 115 mm, sans œdème, définit l’émaciation sévère. Chez l’adulte, il faut un critère de phénotype et un critère d’étiologie. La mesure unique reste présomptive.</div><div class="trap"><span class="k">Erreur fréquente</span> Appliquer à l’adulte les seuils de l’enfant, ou l’inverse. Le périmètre brachial de 115 mm et le poids pour la taille en écarts-types valent pour l’enfant de 6 à 59 mois ; l’adulte se classe par GLIM.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.2471/BLT.15.162867" target="_blank" rel="noopener">OMS 2013, revue 2016</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a> ; <a href="https://doi.org/10.1016/j.clnu.2018.08.002" target="_blank" rel="noopener">GLIM 2019</a> ; <a href="https://doi.org/10.3390/nu16234099" target="_blank" rel="noopener">Nutrients 2024</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>.</p></section>
<section class="ilot" id="e41-3"><h2><span class="n">3</span>Épidémiologie et pronostic</h2><p>L’épidémiologie répond à deux questions : combien de personnes sont concernées, et quel risque de décès le marasme ajoute-t-il ? Les chiffres mondiaux portent sur l’enfant ; les chiffres suisses portent sur l’adulte hospitalisé et ne concernent pas le seul code E41.</p><h3>Dans le monde : l’enfant de moins de 5 ans</h3><p>En 2016, 52 millions d’enfants de moins de 5 ans étaient émaciés, dont 17 millions de façon sévère. L’émaciation est fortement saisonnière, avec un pic avant les récoltes (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Le nombre de décès annuel dépend de la source et de la définition retenue, ce qui explique des chiffres différents ; la <button class="w" data-k="e41-deces">comparaison de ces estimations</button> est donnée en fenêtre.</p><table class="t"><tr><th>Situation</th><th>Risque relatif de décès toutes causes</th><th>Lecture</th></tr><tr><td>Poids pour la taille inférieur à −3 écarts-types</td><td>11,6 (intervalle de confiance à 95 % : 9,8 à 13,8)</td><td>Le risque est multiplié par plus de onze par rapport au groupe de référence de l’analyse.</td></tr><tr><td>Poids pour la taille de −3 à moins de −2 écarts-types</td><td>3,4</td><td>Le risque reste multiplié par plus de trois, même sans émaciation sévère.</td></tr><tr><td>Émaciation seule (rapport de risques instantanés)</td><td>2,3</td><td>Mesure d’une autre étude ; non superposable aux précédentes.</td></tr><tr><td>Émaciation associée à un retard de croissance (rapport de risques instantanés)</td><td>12,3</td><td>L’association des deux atteintes cumule les risques.</td></tr></table><p>Ce tableau se lit en comparant chaque ligne à son groupe de référence ; les deux premières lignes viennent d’une même analyse, les deux suivantes d’une autre, d’où l’absence de comparaison directe. Pour un poids pour la taille inférieur à −3 écarts-types, le risque relatif de décès est de 9,7 pour la pneumonie, 12,3 pour la diarrhée et 9,6 pour la rougeole (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Un <button class="w" data-k="e41-rr">risque relatif</button> compare la fréquence d’un événement dans deux groupes, il ne dit pas combien d’enfants en meurent. Le fait que les infections courantes deviennent aussi mortelles s’explique par l’immunodéficience secondaire décrite à l’îlot 6.</p><h3>En Suisse : l’adulte hospitalisé</h3><p>Dans sept hôpitaux suisses, entre 2003 et 2006, 18,2 % des 32 837 admissions de médecine interne avaient un score NRS 2002 d’au moins 3. Cette proportion augmentait avec l’âge : 8 % avant 45 ans, 11 % de 45 à 64 ans, 22 % de 65 à 84 ans, 28 % après 85 ans (<a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf 2010</a>). La malnutrition documentée dans la statistique hospitalière suisse est passée de 1,40 % des séjours en 2012 à 8,14 % en 2022. Elle est associée à l’âge supérieur à 90 ans, au sexe féminin, à un score de Charlson élevé et à l’admission urgente ; elle est associée à un séjour en soins intensifs, au décès hospitalier et à un séjour supérieur à 5 jours. Seuls 61,9 % de ces patients ont reçu une consultation diététique (<a href="https://doi.org/10.1016/j.nut.2026.113269" target="_blank" rel="noopener">Tanweer et collègues 2026</a>). Les <button class="w" data-k="e41-suisse-prevalence">valeurs précises et leur interprétation</button> figurent en fenêtre.</p><div class="key"><b>À retenir.</b> Le marasme sévère multiplie par plus de dix le risque de décès de l’enfant ; la cause immédiate est souvent une infection banale devenue grave. En Suisse, le risque nutritionnel concerne plus d’un adulte hospitalisé sur six en médecine interne et près d’un sur trois après 85 ans. L’augmentation de la malnutrition documentée, de 1,40 % à 8,14 %, mesure ce qui est inscrit dans les dossiers : elle ne se lit pas directement comme une augmentation de la maladie.</div><div class="trap"><span class="k">Piège</span> Attribuer au seul code E41 les chiffres suisses. Ils portent sur la malnutrition en général et sur un score de dépistage, non sur le marasme codé.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.1016/j.clnu.2009.06.005" target="_blank" rel="noopener">Imoberdorf 2010</a> ; <a href="https://doi.org/10.1016/j.nut.2026.113269" target="_blank" rel="noopener">Tanweer et collègues 2026</a>.</p></section>
<section class="ilot" id="e41-4"><h2><span class="n">4</span>Du jeûne court au marasme : l’énergie</h2><p>Pourquoi un organisme privé d’énergie ne s’effondre-t-il pas tout de suite ? Parce qu’il possède une séquence d’économies, que le marasme a épuisée. La comprendre explique les signes cliniques, les risques à la renutrition et l’ordre du traitement.</p><h3>Le jeûne court, état normal</h3><p>Pendant un jeûne court, l’organisme oxyde les acides gras libres et les cétones issus du tissu adipeux. Le muscle fournit les acides aminés nécessaires à la néoglucogenèse, c’est-à-dire à la fabrication de glucose à partir de substrats autres que les sucres. L’insuline et le glucagon règlent ce passage (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Cette séquence est physiologique : elle ne signe aucune maladie.</p><h3>Le jeûne prolongé</h3><p>Après plusieurs jours, la graisse s’épuise et les protéines myofibrillaires, celles qui forment la contraction musculaire, sont dégradées en masse (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Chez l’enfant, la séquence est la suivante : le glycogène est épuisé, la néoglucogenèse rapide consomme le muscle, puis survient une phase d’épargne protéique où la lipolyse et la cétogenèse fournissent l’énergie (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). La régulation à long terme fait intervenir l’hormone de croissance, les hormones thyroïdiennes, les catécholamines et les corticoïdes (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><figure><svg viewBox="0 0 420 400" role="img" aria-label="Séquence de l’adaptation au jeûne prolongé" font-family="Atkinson Hyperlegible, sans-serif" font-size="16"><g fill="none" stroke="#222" stroke-width="2"><rect x="20" y="15" width="380" height="70" rx="6"/><path d="M210 85v25m-6-8l6 8 6-8"/><rect x="20" y="110" width="380" height="70" rx="6"/><path d="M210 180v25m-6-8l6 8 6-8"/><rect x="20" y="205" width="380" height="70" rx="6"/><path d="M210 275v25m-6-8l6 8 6-8"/><rect x="20" y="300" width="380" height="85" rx="6"/></g><g fill="#222"><text x="35" y="42">1. Apport insuffisant : glycogène épuisé</text><text x="35" y="68">Glucose assuré par la néoglucogenèse</text><text x="35" y="137">2. Néoglucogenèse rapide : le muscle fond</text><text x="35" y="163">Acides aminés consommés, force réduite</text><text x="35" y="232">3. Épargne protéique : lipolyse, cétogenèse</text><text x="35" y="258">Les graisses fournissent l’énergie</text><text x="35" y="327">4. Adaptation réductrice : marasme</text><text x="35" y="353">Croissance arrêtée, métabolisme de base ↓</text><text x="35" y="375">Graisse, muscle et viscères réduits</text></g></svg><figcaption>Figure 1 — Séquence de l’adaptation au jeûne prolongé chez l’enfant, d’après la revue de Dipasquale. Les étapes se succèdent dans le temps ; les durées ne sont pas précisées par les sources. Schéma didactique original, non à l’échelle ; ce n’est pas une image clinique.</figcaption></figure><h3>L’adaptation réductrice</h3><p>Le marasme est l’aboutissement d’une adaptation. L’organisme arrête la croissance, perd de la graisse, du muscle et de la masse viscérale, et abaisse son métabolisme de base ainsi que sa dépense énergétique totale (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Les <button class="w" data-k="e41-adaptation">modifications hormonales</button> accompagnent cette économie : la triiodothyronine (T3), l’insuline et le facteur de croissance IGF-1 baissent, tandis que l’hormone de croissance et le cortisol montent (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). La <button class="w" data-k="e41-leptine">leptine</button>, hormone de la masse grasse, est basse et inversement associée à la mortalité (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). L’activité de la pompe sodium-potassium est réduite, ce qui est interprété comme une économie d’énergie (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Les cytokines (TNF, interleukines 1 et 6) diminuent l’appétit et sont cataboliques ; la voie <button class="w" data-k="e41-ubiquitine">ubiquitine-protéasome</button> est la voie principale de la protéolyse musculaire (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>).</p><div class="key"><b>Science → clinique.</b> Le métabolisme de base abaissé explique la bradycardie, l’hypotension et l’hypothermie de l’enfant marasmique (îlot 9) : l’organisme produit moins de chaleur et fait battre le cœur moins vite parce qu’il dépense moins. Le raisonnement est celui du cours, appuyé sur la baisse documentée de la dépense énergétique (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</div><div class="key"><b>Science → traitement.</b> Un organisme adapté à l’économie ne tolère pas un apport brutal : ses cellules, ses organes et ses réserves de vitamines et de minéraux sont réduits. Cette observation fonde le principe d’une alimentation lente au départ (îlots 12 et 15).</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>.</p></section>
<section class="ilot" id="e41-5"><h2><span class="n">5</span>Glucose, cœur, respiration, intestin et rein</h2><p>Chaque organe subit la réduction de masse et d’énergie à sa manière. Ces atteintes expliquent pourquoi le marasme est une maladie multisystémique et non une simple perte de poids.</p><h3>Le glucose</h3><p>L’hypoglycémie est fréquente. La clairance du glucose est altérée et la réponse endocrine du pancréas est émoussée. L’axe du cortisol reste préservé : il n’est donc pas responsable de l’hypoglycémie (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Cette dernière précision a une conséquence pratique : l’hypoglycémie du marasme se corrige par un apport de glucose et d’aliments, non par une hormone de remplacement. La <button class="w" data-k="e41-hypoglycemie">physiopathologie de l’hypoglycémie</button> est détaillée en fenêtre.</p><h3>Le cœur</h3><p>Les myofibrilles cardiaques sont amincies, la contractilité est altérée et le débit cardiaque diminue en proportion de la perte de poids ; le risque d’arythmie augmente (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). D’autres études rapportent un débit normal quand il est ramené à la surface corporelle (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>) : les <button class="w" data-k="e41-coeur">données discordantes</button> sont discutées en fenêtre. Sur le plan pratique, un cœur réduit supporte mal un remplissage rapide, ce qui motive la prudence du traitement du choc (îlot 11).</p><h3>La respiration</h3><p>La perte de masse musculaire thoracique et les troubles électrolytiques réduisent la ventilation par minute et la réponse à l’hypoxie (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Une pneumonie y trouve un terrain favorable.</p><h3>Le tube digestif</h3><p>La muqueuse subit une atrophie villositaire, une hypoplasie des cryptes et une altération de la perméabilité. Une pullulation bactérienne et une atrophie du pancréas s’y ajoutent ; elles produisent une malabsorption. Une stéatose est fréquente (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). La malabsorption des mono- et disaccharides provoque une diarrhée osmotique (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Le mécanisme de cette <button class="w" data-k="e41-intestin">atrophie et ses conséquences</button> est exposé en fenêtre et dans l’onglet Sciences.</p><h3>Le rein</h3><p>Une baisse prérénale de la filtration survient avec la diarrhée et la déshydratation (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). « Prérénale » signifie que le défaut vient de l’apport sanguin au rein et non du rein lui-même : la correction de l’hydratation la corrige donc.</p><div class="key"><b>À retenir.</b> Hypoglycémie, cœur réduit, ventilation limitée, diarrhée osmotique et filtration abaissée forment le terrain sur lequel s’installent les urgences de l’îlot 11. Chacune de ces atteintes se corrige par la renutrition progressive, sauf si l’on renourrit trop vite.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>.</p></section>
<section class="ilot" id="e41-6"><h2><span class="n">6</span>Immunité, cerveau et distinction d’avec le kwashiorkor</h2><h3>L’immunité</h3><p>Le marasme crée une immunodéficience secondaire : atrophie du thymus, lymphocytes CD4 réduits, phagocytose altérée, immunoglobulines A sécrétoires basses, complément abaissé (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Le thymus est l’organe où mûrissent les lymphocytes T ; la muqueuse digestive est protégée par les immunoglobulines A. Leur diminution explique que les infections soient graves et souvent <button class="w" data-k="e41-infection-pauci">pauci-symptomatiques</button>, c’est-à-dire peu bruyantes cliniquement : l’absence de fièvre ne rassure donc pas. Le lien est un raisonnement du cours, fondé sur ces déficits.</p><h3>Le cerveau</h3><p>L’enfant est apathique, lent, parfois avec des troubles de la parole (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a>). Le cerveau compte moins de neurones, de synapses et de fibres myélinisées (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Une <button class="w" data-k="e41-cerveau">atteinte cérébrale possiblement irréversible</button> après 3 à 4 ans est rapportée (<a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>).</p><h3>Marasme et kwashiorkor : deux adaptations</h3><p>Le marasme est décrit comme une adaptation : fonte de la graisse et du muscle, sans œdème. Le kwashiorkor est décrit comme maladaptatif, avec œdème, stéatose et hypoalbuminémie (<a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a>). Le texte source ne tranche pas pourquoi un enfant évolue vers l’une ou l’autre forme ; la <button class="w" data-k="e41-marasme-kwashiorkor">comparaison</button> se limite aux faits lus. Les formes mixtes se codent E42 (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>).</p><div class="key"><b>À retenir.</b> Le marasme est la forme adaptée de la malnutrition grave : il économise l’énergie, au prix d’une immunité, d’un cerveau et d’organes réduits. Cette fragilité explique la mortalité par infection.</div><p class="src">Références : <a href="https://doi.org/10.1038/nrdp.2017.67" target="_blank" rel="noopener">Bhutta 2017</a> ; <a href="https://doi.org/10.3390/nu12082413" target="_blank" rel="noopener">Dipasquale 2020</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e40-e46.htm" target="_blank" rel="noopener">BfArM 2024</a>.</p><button class="pareto-btn ui" data-k="pareto-e41-bases">▲ Loi de Pareto — Définition, mesure et mécanismes</button></section>
