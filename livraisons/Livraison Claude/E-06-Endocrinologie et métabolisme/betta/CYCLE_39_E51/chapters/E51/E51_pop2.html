<template data-pop="e51-glucose" data-title="Glucose et thiamine : l’ordre des gestes"><div class="lab">Mécanisme</div><p>La dégradation du glucose passe par la pyruvate déshydrogénase, l’α-cétoglutarate déshydrogénase et la voie des pentoses, trois étapes dépendantes du ThDP. Le besoin est d’environ 0,4 mg de thiamine pour 4200 kilojoules de métabolisme glucidique. Chez un patient dont les réserves sont basses, une charge glucidique consomme le ThDP restant et peut déclencher l’encéphalopathie.</p><div class="lab">Preuves</div><p>Dans l’hyperemesis gravidarum, un glucose intraveineux a aggravé l’encéphalopathie dans 14,1 % des cas publiés. L’EFNS recommande la thiamine avant tout glucide.</p><div class="lab">Arbitrage</div><p>Des études récentes citées par une revue de 2021 n’ont pas montré de différence entre thiamine avant ou après un glucose de courte durée. Aucune recommandation lue ne dit quoi faire devant une hypoglycémie chez un patient suspect. Le texte en vigueur, l’EFNS, reste « thiamine avant tout glucide » ; le raisonnement clinique tient compte de la gravité d’une éventuelle hypoglycémie, sans que les sources lues le tranchent.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30889425/" target="_blank" rel="noopener">Oudman et coll., hyperemesis gravidarum, 2019</a>.</p></template>
<template data-pop="e51-renutrition" data-title="Syndrome de renutrition"><div class="lab">Définition</div><p>Complication de la réalimentation d’un patient dénutri, associée à une mortalité accrue. La reprise du métabolisme glucidique consomme la thiamine disponible.</p><div class="lab">Dépistage suisse</div><p>IMC bas, perte de poids involontaire importante, apport faible ou nul, abus d’alcool ou de drogues.</p><div class="lab">Conduite</div><p>Algorithme suisse (Friedli, Stanga, Schuetz, 2018) : dépistage, démarrage prudent avec augmentation progressive des apports énergétiques et hydriques, supplémentation en électrolytes et vitamines, surveillance clinique étroite. Doses de thiamine d’ESPEN : 300 mg par voie intraveineuse avant la nutrition, puis 200 à 300 mg par jour pendant au moins trois jours.</p><div class="lab">Limite</div><p>Les doses détaillées de l’algorithme suisse n’ont été lues qu’en résumé.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29429529/" target="_blank" rel="noopener">Friedli et coll., syndrome de renutrition, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35611483/" target="_blank" rel="noopener">Schönenberger et coll., Refeeding-Syndrom 2022</a>.</p></template>
<template data-pop="e51-caine" data-title="Critères opérationnels de Caine"><div class="lab">Contenu</div><p>Chez le patient alcoolique, le diagnostic d’encéphalopathie de Wernicke est retenu avec deux signes sur quatre : carence alimentaire ; signes oculaires ; dysfonction cérébelleuse ; état mental altéré ou trouble mnésique léger.</p><div class="lab">Performances</div><p>Fiabilité de 100 % entre évaluateurs dans la publication de 1997. Une revue de 2021 cite une sensibilité de 94 % et une spécificité de 99 %. La sous-reconnaissance concerne le patient atteint aussi d’encéphalopathie hépatique (sensibilité de 50 %).</p><div class="lab">Limite</div><p>Ces critères valent pour l’alcool ; l’EFNS demande de tenir compte des différences de présentation hors alcool.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/9010400/" target="_blank" rel="noopener">Caine et coll., critères opérationnels, 1997</a>.</p></template>
<template data-pop="e51-irm" data-title="IRM cérébrale dans la Wernicke"><div class="lab">Signes</div><p>Hypersignal T2 thalamique paraventriculaire, hypothalamique et périaqueducal ; atrophie mamillaire et cérébelleuse. Les anomalies sont rapidement réversibles sous thiamine.</p><div class="lab">Performances</div><p>Revue de 2021 : lésions typiques chez 58 % des patients, sensibilité de 53 %, spécificité de 93 %. Méta-analyse de 2026 : lésions typiques chez 82 % des patients imagés, atypiques chez 44,8 %. Pédiatrie : sensibilité de 85 %.</p><div class="lab">Arbitrage</div><p>Les écarts reflètent des populations et des définitions différentes. On retient que l’IRM soutient le diagnostic (EFNS niveau B), qu’elle est spécifique mais pas assez sensible pour exclure, et qu’elle ne retarde pas le traitement.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40911513/" target="_blank" rel="noopener">Puertas et coll., méta-analyse sur la Wernicke, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39997622/" target="_blank" rel="noopener">Oudman et coll., Wernicke pédiatrique, 2025</a>.</p></template>
<template data-pop="e51-diff" data-title="Diagnostic différentiel : ce que les sources établissent"><div class="lab">Pièges documentés</div><p>Encéphalopathie hépatique : coexistence fréquente, qui masque l’encéphalopathie de Wernicke. Ivresse : masque les signes aux urgences. Sepsis : mimé par le Shoshin. Méningite : mimée par le béribéri infantile.</p><div class="lab">Lacune</div><p>Les sources lues ne développent pas un différentiel complet (accident vasculaire du tronc, sevrage, intoxications, autres encéphalopathies métaboliques). Ces diagnostics ne sont pas détaillés ici, faute de source lue ; ils restent évidemment à considérer en clinique.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/9010400/" target="_blank" rel="noopener">Caine et coll., critères opérationnels, 1997</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/12414541/" target="_blank" rel="noopener">Royal College of Physicians, alcool et Wernicke, 2002</a>.</p></template>
<template data-pop="e51-efns" data-title="EFNS : lignes directrices 2010"><div class="lab">Contenu</div><p>La Fédération européenne des sociétés de neurologie recommande, pour la suspicion d’encéphalopathie de Wernicke, 200 mg de thiamine trois fois par jour, de préférence par voie intraveineuse, avant tout glucide (niveau C), avec une très bonne sécurité (niveau B). Elle soutient l’IRM (niveau B) et reprend les critères de Caine (niveau B). Elle recommande la thiamine parentérale à tout sujet à risque aux urgences (bonne pratique) et le suivi du statut en thiamine pendant au moins six mois après chirurgie bariatrique (niveau B).</p><div class="lab">Limite</div><p>Le texte intégral était inaccessible ; seul le résumé a été lu. Les doses de durée et de relais ne sont pas lues dans l’original.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a>.</p></template>
<template data-pop="e51-fi-benerva" data-title="Benerva® et écart de doses : arbitrage"><div class="lab">Constat</div><p>La fiche suisse plafonne la voie parentérale à 200 mg par jour dans les carences sévères. Les recommandations ESPEN 2022 et EFNS 2010 proposent 600 à 1500 mg par jour dans l’encéphalopathie de Wernicke.</p><div class="lab">Règle de choix</div><p>Pour un contentieux clinique, la source primaire applicable la plus récente l’emporte pour la conduite : ESPEN 2022. La fiche reste la référence d’autorisation de mise sur le marché ; une prescription au-dessus de ses doses est hors information professionnelle et doit être documentée. Le texte actuellement en vigueur de la fiche reste accessible dans l’AIPS, même s’il date de 2019.</p><div class="lab">Argument</div><p>Les doses élevées s’appuient sur l’urgence, l’absorption variable et la sécurité très bonne de la thiamine ; elles sont consensuelles, car la revue <button class="w" data-k="e51-cochrane">Cochrane de 2013</button> ne trouve pas d’essai suffisant pour fixer la dose.</p><div class="lab">Limite</div><p>La Revue Médicale Suisse 2022 (HUG) n’a pu être lue qu’en résumé ; aucune recommandation suisse dédiée à l’encéphalopathie de Wernicke n’a été trouvée en accès libre.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2022/revue-medicale-suisse-801/thiamine-une-simple-vitamine" target="_blank" rel="noopener">Silhadi et coll., Revue Médicale Suisse 2022 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23818100/" target="_blank" rel="noopener">Cochrane 2013, thiamine et syndrome de Wernicke-Korsakoff</a>.</p></template>
<template data-pop="e51-pronostic" data-title="Pronostic : deux séries"><div class="lab">Séries anciennes</div><p>D’après une revue de 2021 qui cite des sources secondaires : environ 50 % de séquelles durables ; dans le Wernicke alcoolique, environ 80 % évoluent vers un Korsakoff et environ 40 % pourraient mourir de complications ; hors alcool, environ 20 % guérissent complètement et 20 % décèdent.</p><div class="lab">Série récente</div><p>Méta-analyse de 2026 : mortalité globale de 5,1 %, de 8,8 % hors alcool.</p><div class="lab">Arbitrage</div><p>Les écarts viennent de l’époque, du diagnostic précoce et de la population. On retient que le pronostic dépend du délai de traitement et que la mortalité hors alcool est plus élevée.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/32551830/" target="_blank" rel="noopener">Kohnke et Meek, Wernicke, 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40911513/" target="_blank" rel="noopener">Puertas et coll., méta-analyse sur la Wernicke, 2026</a>.</p></template>
<template data-pop="e51-prelevement" data-title="Prélèvement du ThDP"><div class="lab">Règles</div><p>Prélever avant la première dose. Protéger de la lumière et maintenir la température prescrite par le laboratoire. Utiliser du sang total ou des érythrocytes, jamais du plasma.</p><div class="lab">Limite</div><p>Les seuils des laboratoires universitaires suisses n’ont pas été consultés : suivre le rapport du laboratoire.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a>.</p></template>
<template data-pop="e51-thdp-dosage" data-title="ThDP : valeurs et méthodes"><div class="lab">Méthode</div><p>HPLC, avec ou sans spectrométrie de masse, sur sang total ou érythrocytes (recommandation ESPEN 14.2, grade A).</p><div class="lab">Valeurs</div><p>Valeurs attendues du ThDP du sang total : environ 70 à 180 nmol/L ; pas de seuil universel de carence.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a>.</p></template>
<template data-pop="e51-etkac" data-title="Coefficient d’activation de la transcétolase"><div class="lab">Interprétation</div><p>Inférieur ou égal à 1,15 : adéquat. Entre 1,15 et 1,25 : risque modéré. Supérieur à 1,25 : risque élevé. Béribéri : généralement supérieur à 1,4.</p><div class="lab">Limite</div><p>Interprétation difficile si la synthèse de l’enzyme est altérée. Le test est une alternative, non une référence.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a>.</p></template>
<template data-pop="e51-test-therapeutique" data-title="Test thérapeutique"><div class="lab">Principe</div><p>La réponse clinique à la thiamine confirme rétrospectivement la carence. ESPEN mentionne l’essai de supplémentation ; pour le béribéri, le diagnostic n’est parfois posé qu’après amélioration.</p><div class="lab">Limite</div><p>Une absence de réponse n’exclut pas une atteinte déjà chronique. Le test ne doit jamais retarder le traitement : il est le résultat du traitement et non sa condition.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/30151974/" target="_blank" rel="noopener">Whitfield et coll., thiamine deficiency disorders, 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/40753975/" target="_blank" rel="noopener">Pereira et coll., An Overview of Beriberi, 2026</a>.</p></template>
<template data-pop="e51-cochrane" data-title="Revue Cochrane 2013"><div class="lab">Conclusion</div><p>Les preuves randomisées sont insuffisantes pour fixer la dose, la fréquence, la voie ou la durée de la thiamine chez l’alcoolique. Un seul essai exploitable montre qu’une dose de 200 mg par jour est meilleure que 5 mg par jour sur un test cognitif.</p><div class="lab">Conséquence</div><p>Les schémas de ce cours sont consensuels, non démontrés par des essais comparatifs ; leur justification repose sur le mécanisme, la sécurité et la gravité du risque.</p><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23818100/" target="_blank" rel="noopener">Cochrane 2013, thiamine et syndrome de Wernicke-Korsakoff</a>.</p></template>
<template data-pop="e51-bariatrique" data-title="Chirurgie bariatrique et thiamine"><div class="lab">Risque</div><p>La thiamine fait partie des micronutriments à plus haut risque avant et après la chirurgie. Dans 118 cas d’encéphalopathie de Wernicke après chirurgie, le bypass représente 52 %, l’âge médian est de 33 ans, les vomissements 87,3 %, l’ataxie 84,7 %, les troubles mentaux 76,3 %, les troubles oculomoteurs 73,7 %. Le traitement est insuffisant dans 77,2 % des cas.</p><div class="lab">Prévention suisse</div><p>Directives SMOB (en vigueur dès le 1er juillet 2023) : multivitamines à long terme après anneau, sleeve et bypass proximal, à vie après chirurgie malabsorptive ; bilan annuel du statut vitaminique ; vérification du succès du traitement d’une carence avérée. EFNS : suivi de la thiamine pendant au moins six mois.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29693218/" target="_blank" rel="noopener">Oudman et coll., chirurgie bariatrique, 2018</a> ; <a href="https://www.smob.ch/wp-content/uploads/2026/04/SMOB-Directives-2023-07-01-Fr.pdf" target="_blank" rel="noopener">SMOB, directives de chirurgie de l’obésité, 2023</a>.</p></template>
<template data-pop="e51-soins-intensifs" data-title="Soins intensifs et thiamine"><div class="lab">Fréquence</div><p>Carence ou déplétion chez plus de 90 % des patients critiques (ESPEN) ; 20 à 70 % des chocs septiques selon le seuil.</p><div class="lab">Conduite</div><p>ESPEN : 100 à 300 mg par jour par voie intraveineuse dès l’admission pendant 3 à 4 jours (grade B). Pour l’épuration extra-rénale continue : 100 mg par jour, car les pertes sont d’environ 4 à 5 mg par jour.</p><div class="lab">Limite</div><p>Un essai de 2 × 200 mg par jour pendant 7 jours a montré un lactate plus bas et une mortalité moindre dans le sous-groupe carencé, mais il est de petite taille.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29520660/" target="_blank" rel="noopener">Amrein et coll., soins intensifs et thiamine, 2018</a>.</p></template>
<template data-pop="e51-sources" data-title="Hiérarchie des sources de cette leçon"><div class="lab">Suisse d’abord</div><p>Information professionnelle Benerva® (Swissmedic, avril 2019), Revue Médicale Suisse 2022 (résumé), directives SMOB 2023, algorithme suisse de renutrition 2018.</p><div class="lab">Puis européennes</div><p>ESPEN 2022 (micronutriments) et ESPEN 2019 (foie), EFNS 2010 (résumé), Royal College of Physicians 2002, valeur de référence de la DGE.</p><div class="lab">Revues et séries</div><p>Méta-analyse 2026, revues sur l’hyperemesis gravidarum, la chirurgie bariatrique, la pédiatrie, les agonistes du GLP-1, les soins intensifs, le béribéri et les carences en thiamine à l’échelle mondiale.</p><div class="lab">Limites</div><p>Aucune recommandation suisse dédiée à l’encéphalopathie de Wernicke n’a été trouvée ; seuils de laboratoire suisses, magnésium, différentiel détaillé non sourcés. Cette leçon est une revue par intelligence artificielle ; l’audit est différé et ne remplace pas une validation médicale humaine.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN, lignes directrices sur les micronutriments, 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20642790/" target="_blank" rel="noopener">Galvin et coll., EFNS, encéphalopathie de Wernicke, 2010 (résumé)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680256360580" target="_blank" rel="noopener">Information professionnelle suisse Benerva®, avril 2019</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2022/revue-medicale-suisse-801/thiamine-une-simple-vitamine" target="_blank" rel="noopener">Silhadi et coll., Revue Médicale Suisse 2022 (résumé)</a> ; <a href="https://www.smob.ch/wp-content/uploads/2026/04/SMOB-Directives-2023-07-01-Fr.pdf" target="_blank" rel="noopener">SMOB, directives de chirurgie de l’obésité, 2023</a>.</p></template>
<template data-pop="pareto-e51-definition" data-title="Pareto — Définitions et codage"><p class="ratio" data-cover="e51-0,e51-1"></p><ul><li>La carence en thiamine s’exprime par trois tableaux : encéphalopathie de <button class="w" data-k="e51-wernicke">Wernicke</button>, béribéri humide, béribéri sec.</li><li>Le <button class="w" data-k="e51-shoshin">Shoshin</button> est un béribéri humide fulminant : choc et lactate élevé, sans œdème.</li><li>Le codage CIM-10-GM 2024 utilise E51.1 (béribéri), E51.2 (Wernicke), E51.8 et E51.9.</li></ul></template>
<template data-pop="pareto-e51-frequence" data-title="Pareto — Fréquence et pronostic"><p class="ratio" data-cover="e51-2"></p><ul><li>La Wernicke est retrouvée chez environ 1 % de la population à l’autopsie, et 80 % des cas ne sont pas diagnostiqués du vivant.</li><li>La triade complète n’est présente que dans environ un tiers des cas.</li><li>Environ la moitié des survivants développent un <button class="w" data-k="e51-korsakoff">Korsakoff</button> ; la mortalité récente est de 5,1 %.</li></ul></template>
<template data-pop="pareto-e51-mecanismes" data-title="Pareto — Physiopathologie"><p class="ratio" data-cover="e51-3"></p><ul><li>Le ThDP est le cofacteur de la pyruvate déshydrogénase, de l’α-cétoglutarate déshydrogénase et de la transcétolase.</li><li>Son manque bloque l’entrée du glucose dans le cycle de Krebs : lactate élevé, ATP bas.</li><li>Le glucose consomme du ThDP : il aggrave la carence et précipite la Wernicke.</li></ul></template>
<template data-pop="pareto-e51-causes" data-title="Pareto — Causes et facteurs de risque"><p class="ratio" data-cover="e51-4"></p><ul><li>Apport diminué, absorption diminuée, stockage diminué, besoins accrus : les quatre mécanismes principaux.</li><li>L’alcool agit sur les trois premiers à la fois.</li><li>Vomissements prolongés, chirurgie bariatrique, nutrition parentérale sans thiamine et renutrition sont d’autres portes d’entrée.</li></ul></template>
<template data-pop="pareto-e51-anamnese" data-title="Pareto — Anamnèse"><p class="ratio" data-cover="e51-5"></p><ul><li>Chercher alcool, jeûne, vomissements, chirurgie, nutrition artificielle, grossesse.</li><li>Les prodromes sont les vomissements et la vision double.</li><li>L’ivresse masque les signes : traiter d’emblée.</li></ul></template>
<template data-pop="pareto-e51-clinique" data-title="Pareto — Examen clinique"><p class="ratio" data-cover="e51-6"></p><ul><li>Wernicke : confusion, troubles oculomoteurs, ataxie ; deux signes suffisent chez l’alcoolique.</li><li>Béribéri humide : cœur à haut débit ; Shoshin : choc sans œdème ; sec : neuropathie.</li><li>Korsakoff : amnésie, confabulation, apathie.</li></ul></template>
<template data-pop="pareto-e51-diagnostic" data-title="Pareto — Diagnostic"><p class="ratio" data-cover="e51-7"></p><ul><li>Critères de <button class="w" data-k="e51-caine">Caine</button> : deux signes sur quatre.</li><li>IRM : spécificité de 93 %, sensibilité de 53 % ; une IRM normale n’exclut pas.</li><li>Le diagnostic est clinique ; le dosage et l’IRM confirment après coup.</li></ul></template>
<template data-pop="pareto-e51-urgences" data-title="Pareto — Urgences"><p class="ratio" data-cover="e51-8"></p><ul><li>Prélever, puis donner la thiamine intraveineuse sans attendre.</li><li>Thiamine avant tout glucide.</li><li>Un choc avec lactate élevé, sans œdème, à risque nutritionnel : penser Shoshin.</li></ul></template>
<template data-pop="pareto-e51-traitement" data-title="Pareto — Traitement"><p class="ratio" data-cover="e51-9"></p><ul><li>EFNS : 200 mg trois fois par jour par voie intraveineuse ; ESPEN : 500 mg trois fois par jour si étiologie incertaine.</li><li>La fiche suisse plafonne à 200 mg par jour : écart à signaler, ESPEN 2022 prime pour la conduite.</li><li>Béribéri : 100 à 300 mg par jour, au moins six semaines, dilution sans glucose.</li></ul></template>
<template data-pop="pareto-e51-prevention" data-title="Pareto — Prévention"><p class="ratio" data-cover="e51-10"></p><ul><li>Patient hospitalisé à risque : 100 à 300 mg par jour.</li><li>Renutrition : 300 mg intraveineux avant la nutrition.</li><li>Chirurgie bariatrique : multivitamines à long terme et bilan annuel.</li></ul></template>
<template data-pop="pareto-e51-suivi" data-title="Pareto — Suivi et pronostic"><p class="ratio" data-cover="e51-11"></p><ul><li>Environ 50 % de séquelles durables après une Wernicke.</li><li>Mortalité de 5,1 % dans la méta-analyse de 2026, 8,8 % hors alcool.</li><li>Corriger la cause de la carence et suivre le statut vitaminique.</li></ul></template>
<template data-pop="pareto-e51-particulier" data-title="Pareto — Situations particulières"><p class="ratio" data-cover="e51-12"></p><ul><li>Hyperemesis gravidarum : Wernicke possible entre 10 et 15 semaines de gestation.</li><li>Béribéri infantile chez le nourrisson allaité par une mère carencée.</li><li>Signal GLP-1 : vigilance en cas de vomissements ou de perte de poids rapide.</li></ul></template>
<template data-pop="pareto-e51-criteres" data-title="Pareto — Critères et paramètres"><p class="ratio" data-cover="e51-13"></p><ul><li>Pas de critères consensuels du béribéri adulte : diagnostic clinique et test thérapeutique.</li><li>Wernicke : critères de Caine, ThDP, IRM et réponse.</li><li>Besoin de 1,0 à 1,3 mg par jour ; réserves épuisées en 18 à 20 jours.</li></ul></template>
<template data-pop="pareto-e51-examens" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e51-e-1,e51-e-2,e51-e-3,e51-e-4,e51-e-5"></p><ul><li>Dosage du ThDP dans le sang total : examen de référence, prélevé avant la première dose.</li><li>ETKAC : alternative indirecte ; lactate élevé : indice.</li><li>IRM : soutien, jamais condition du traitement.</li></ul></template>
<template data-pop="pareto-e51-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e51-s-bioc-body"></p><ul><li>Trois enzymes à ThDP : pyruvate déshydrogénase, α-cétoglutarate déshydrogénase, transcétolase.</li><li>Blocage de la première : lactate et baisse d’ATP.</li><li>Voie des pentoses ralentie : moins de NADPH et de myéline.</li></ul></template>
<template data-pop="pareto-e51-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e51-s-physio-body"></p><ul><li>Absorption jéjunale et iléale, saturable, inhibée par l’alcool.</li><li>Réserves de 25 à 30 mg, épuisées en 18 à 20 jours.</li><li>Cerveau et cœur, grands consommateurs d’ATP, sont atteints en premier.</li></ul></template>
<template data-pop="pareto-e51-s-neuro" data-title="Pareto — Neuroanatomie"><p class="ratio" data-cover="e51-s-neuro-body"></p><ul><li>Lésions périventriculaires : thalamus, hypothalamus, région périaqueducale, corps mamillaires, cervelet.</li><li>Ces régions correspondent à la triade clinique.</li><li>Les nerfs périphériques sont atteints dans le béribéri sec.</li></ul></template>
<template data-pop="pareto-e51-s-nutr" data-title="Pareto — Nutrition humaine"><p class="ratio" data-cover="e51-s-nutr-body"></p><ul><li>Apport de référence DGE : 1,0 à 1,3 mg par jour chez l’adulte.</li><li>Le besoin croît avec les glucides : 0,4 mg pour 4200 kilojoules.</li><li>Chaleur, oxygène et eau détruisent la thiamine ; certaines régions cumulent aliments à thiaminases et riz poli.</li></ul></template>
<template data-pop="pareto-e51-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e51-p-1,e51-p-2,e51-p-3,e51-p-4,e51-p-5"></p><ul><li>Une seule molécule, la thiamine : le choix porte sur la voie, la dose et le moment.</li><li>Benerva® : comprimés de 100 et 300 mg, ampoule de 100 mg ; parentéral jusqu’à 200 mg par jour selon la fiche.</li><li>Sécurité excellente ; anaphylaxie rare ; erreur majeure : glucose avant thiamine.</li></ul></template>
