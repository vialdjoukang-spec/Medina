<h1>Carence alimentaire en sélénium</h1><span class="status">Adulte et enfant · référentiels : lignes directrices ESPEN 2022 sur les micronutriments, valeurs de référence OSAV 2022, statut suisse OSAV 2023, avis EFSA 2023, informations professionnelles suisses Swissmedic consultées le 15.10.2026 · revue par intelligence artificielle, audit différé, validation médicale indépendante en attente</span></div>

<section class="ilot" id="e59-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs valeurs illustrent les seuils des sources citées.</p><p>Une femme de 52 ans a subi plusieurs résections intestinales pour une maladie de Crohn. Elle reçoit depuis huit mois une nutrition parentérale à domicile, dont les poches ne contiennent aucun oligo-élément. Elle consulte pour une dyspnée d’effort croissante et une faiblesse musculaire. L’examen montre des ongles d’un blanc uniforme, signe nommé <button class="w" data-k="e59-leuconychie">leuconychie (description et limites)</button>. L’échocardiographie mesure une fraction d’éjection du ventricule gauche (FEVG) à 30 %, sans cause coronarienne. Le sélénium plasmatique est à 0,30 µmol/L, soit 24 µg/L (<button class="w" data-k="e59-conversion">conversion des unités</button>), pour une protéine C réactive (CRP) à 6 mg/L.</p><p>Cette combinaison pose trois questions. Faut-il penser au sélénium devant une insuffisance cardiaque inexpliquée chez un patient exposé ? Comment doser cet oligo-élément sans être trompé par l’inflammation (<button class="w" data-k="e59-inflammation">pourquoi la CRP conditionne le résultat</button>) ? Comment corriger le déficit avec les produits disponibles en Suisse ? L’enjeu est réel : la cardiomyopathie par carence en sélénium est rare, mais elle est <b>traitable et potentiellement réversible</b>, y compris lorsque la biopsie montre des lésions marquées (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>). Les auteurs d’un cas publié dans le journal de la Société européenne de cardiologie relèvent que cette carence ne figure pas dans les recommandations ESC 2021 sur l’insuffisance cardiaque ; le diagnostic dépend donc de la vigilance du clinicien (<button class="w" data-k="e59-cas-publie">le cas publié, de la présentation à la récupération</button>).</p><div class="key"><b>Point de départ.</b> Un sélénium bas ne se lit jamais seul : il se lit avec la CRP, avec le contexte de risque (nutrition artificielle, malabsorption, pertes) et avec les signes cliniques. Les seuils décisifs sont 0,75 µmol/L en l’absence d’inflammation et 0,4 µmol/L en toute circonstance (<button class="w" data-k="e59-gradation">gradation du statut</button>).</div><p>Le plan suit la consultation : définir et situer la carence (îlots 1 à 3), connaître sa fréquence et son mécanisme (îlots 4 et 5), reconnaître ses causes et ses signes (îlots 6 à 8), poser le diagnostic et traiter l’urgence (îlots 9 et 10), corriger et prévenir (îlots 11 et 12), puis adapter aux situations particulières, au contexte suisse et à l’examen fédéral (îlots 13 à 15). Les critères formels et les paramètres chiffrés ferment la partie (îlot 16). Les <button class="w" data-k="e59-sources">sources lues et leurs limites</button> sont résumées dans une fenêtre.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>.</p></section>
<section class="ilot" id="e59-1"><h2><span class="n">1</span>Définition, terminologie et périmètre</h2><p>La catégorie E59 de la CIM-10-GM 2024 s’intitule « Carence alimentaire en sélénium ». Elle appartient au bloc E50–E64 des autres carences nutritionnelles et ne comporte <b>aucun sous-code</b> : c’est une catégorie terminale. Elle inclut la <button class="w" data-k="e59-keshan">maladie de Keshan</button>. Elle exclut les séquelles de carence en sélénium, qui se codent E64.8 (séquelles d’autres carences nutritionnelles). Selon les métadonnées de l’Office fédéral de la statistique (OFS), E59 peut être employée comme diagnostic principal, sans restriction d’âge ni de sexe, et la catégorie est classée non infectieuse (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>). <button class="w" data-k="e59-nosologie">La fenêtre de nosologie</button> situe E59 parmi les catégories voisines.</p><p>Le mot « alimentaire » du libellé désigne un apport insuffisant. La littérature clinique décrit pourtant d’autres mécanismes : malabsorption, pertes digestives ou rénales, brûlures, inflammation (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>). Les sources lues ne précisent pas comment coder une carence due à une perte plutôt qu’à un apport ; la classification renvoie seulement la carence alimentaire en minéraux vers les catégories E58 à E61 (<a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a>). Le codeur applique donc les règles de codage de l’établissement. Cette limite est une lacune du dossier, non une règle de la classification.</p><h3>Déplétion et carence : deux mots, deux niveaux</h3><p>Les lignes directrices de la Société européenne de nutrition clinique et de métabolisme (ESPEN) de 2022 distinguent deux termes, repris dans l’exposé suisse de Lausanne (<a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a>). La <b>déplétion</b> est la perte objectivable d’un micronutriment dans les liquides de l’organisme, ou un apport inférieur aux recommandations, avec une concentration sanguine sous la valeur de référence. La <b>carence</b> ajoute à cette perte ou à cet apport insuffisant des signes ou des symptômes explicables par le déficit, ou une concentration sous la référence accompagnée d’effets métaboliques défavorables (<button class="w" data-k="e59-def-deplet">définitions comparées et conséquences pratiques</button>). La cardiomyopathie, la myopathie squelettique et les atteintes cutanées et unguéales sont les points d’aboutissement d’une carence sévère (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><div class="trap"><span class="k">Piège</span> La notice suisse de la préparation injectable précise qu’il n’est pas prouvé que les symptômes d’une carence extrême apparaissent lors d’un apport seulement sous-optimal (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)). Un sélénium légèrement bas chez une personne asymptomatique est une déplétion biologique ; il ne justifie pas à lui seul le diagnostic clinique de carence.</div><div class="key"><b>À retenir.</b> E59 est une catégorie terminale qui inclut la maladie de Keshan et exclut les séquelles (E64.8). La déplétion est un fait biologique ; la carence suppose des signes explicables ou des effets métaboliques défavorables. La gradation biochimique est l’objet de l’îlot suivant.</div><p class="src">Références : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024</a> ; <a href="https://www.rosenfluh.ch/media/ernaehrungsmedizin/2022/05/Neue-ESPEN-Guidelines-fuer-Mikronaehrstoffe.pdf" target="_blank" rel="noopener">Berger, exposé sur les lignes directrices ESPEN, Schweizer Zeitschrift für Ernährungsmedizin 2022</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></section>
<section class="ilot" id="e59-2"><h2><span class="n">2</span>Gradation du statut en sélénium</h2><p>Aucune classification officielle en stades n’a été trouvée dans les sources lues. Les lignes directrices ESPEN 2022 fournissent toutefois des seuils de concentration plasmatique qui permettent une gradation biochimique opérationnelle. Elle répond à une question pratique : à partir de quelle valeur faut-il supplémenter ? Le tableau ci-dessous la résume ; il est présenté comme un outil de lecture, non comme une classification publiée.</p><table class="t"><tr><th>Niveau</th><th>Critère</th></tr><tr><td>Statut adéquat</td><td>Sélénium plasmatique d’au moins 0,75 µmol/L (60 µg/L), sans inflammation : plateau de l’activité de la glutathion peroxydase plasmatique</td></tr><tr><td>Fonction enzymatique optimisée</td><td>Environ 90 µg/L ; saturation de la glutathion peroxydase de type 3 vers 1,20 µmol/L</td></tr><tr><td>Déplétion à corriger</td><td>Moins de 0,75 µmol/L si la CRP est inférieure à 20 mg/L</td></tr><tr><td>Carence sévère</td><td>Moins de 0,4 µmol/L (moins de 32 µg/L) : supplémenter dans tous les cas</td></tr><tr><td>Carence clinique</td><td>Cardiomyopathie, myopathie, atteinte cutanée ou unguéale</td></tr></table><p>On lit ce tableau de haut en bas selon une règle simple. Le médecin dose d’abord le sélénium et la CRP ensemble. Si la valeur est inférieure à 0,4 µmol/L, la décision est prise, quelle que soit la CRP. Entre 0,4 et 0,75 µmol/L, la décision dépend de la CRP : sous 20 mg/L, la déplétion se corrige (recommandation 12.6) ; au-dessus, la valeur peut refléter une redistribution et se discute (<button class="w" data-k="e59-gradation">les recommandations 12.5 et 12.6 et leur niveau de preuve</button>). Pour la patiente de la vignette, 0,30 µmol/L avec une CRP à 6 mg/L correspond à une carence sévère, avec une expression clinique cardiaque et unguéale.</p><p>La classification utile en pratique est surtout <b>étiologique</b> : carence géographique endémique, dans les régions aux sols pauvres (maladies de Keshan et de Kashin-Beck), ou carence conditionnée par la nutrition artificielle, la malabsorption, les pertes, l’inflammation et les régimes restrictifs (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>). Cette distinction oriente la prévention : population entière dans le premier cas, patient à risque identifié dans le second. Les affections liées à une carence combinée en iode et en sélénium sont décrites dans les fenêtres <button class="w" data-k="e59-kashin">Kashin-Beck</button> et <button class="w" data-k="e59-cretinisme">crétinisme myxœdémateux endémique</button>.</p><div class="trap"><span class="k">Erreur fréquente</span> Appliquer le seuil de 0,75 µmol/L à un patient inflammatoire. Ce seuil ne vaut que sans inflammation (CRP inférieure à 20 mg/L). Chez un patient en réanimation ou en poussée de maladie inflammatoire, il surestime la carence vraie.</div><div class="key"><b>À retenir.</b> Trois chiffres : 0,75 µmol/L (60 µg/L) sans inflammation, 0,4 µmol/L (32 µg/L) en toute circonstance, CRP de 20 mg/L comme frontière de l’absence d’inflammation. <button class="w" data-k="e59-mnemo">Aide-mémoire</button>.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>, recommandations 12.5 et 12.6 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></section>
<section class="ilot" id="e59-3"><h2><span class="n">3</span>La norme avant la carence : références suisses</h2><p>Reconnaître un apport insuffisant exige de connaître l’apport normal. L’Office fédéral de la sécurité alimentaire et des affaires vétérinaires (OSAV) a publié en juin 2022 des valeurs de référence nutritionnelles pour la Suisse. Pour le sélénium, la valeur de l’adulte est de <b>70 µg/jour</b> (<a href="https://www.blv.admin.ch/dam/de/sd-web/FLClcT03o4I6/nutrient-requirements-ch-2022.xlsx" target="_blank" rel="noopener">OSAV, valeurs de référence nutritionnelles pour la Suisse, juin 2022</a> ; <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). Le tableau donne les valeurs par groupe, telles que le fichier de l’OSAV les rapporte.</p><table class="t"><tr><th>Groupe</th><th>Sélénium (µg/jour)</th></tr><tr><td>7 mois à 3 ans</td><td>15</td></tr><tr><td>4 à 6 ans</td><td>20</td></tr><tr><td>7 à 10 ans</td><td>35</td></tr><tr><td>11 à 14 ans</td><td>55</td></tr><tr><td>15 à 17 ans</td><td>70</td></tr><tr><td>Adulte</td><td>70</td></tr><tr><td>Grossesse</td><td>70</td></tr><tr><td>Allaitement</td><td>85</td></tr><tr><td>Plus de 65 ans</td><td>55 à 60 (femme) ; 55 à 70 (homme)</td></tr></table><p>Deux remarques guident la lecture. La valeur augmente avec l’âge de l’enfant jusqu’à l’adolescence tardive, où elle rejoint celle de l’adulte. Elle est majorée seulement pendant l’allaitement (85 µg/jour), alors que la grossesse n’appelle pas de majoration. Le fichier ne cite pas la source primaire de chaque valeur ; la valeur est un repère de planification, non un seuil de carence (<button class="w" data-k="e59-valeurs-suisses">origine et limites des valeurs de référence</button>).</p><h3>D’où vient le sélénium alimentaire</h3><p>Les viandes, les œufs et les produits laitiers sont des sources alimentaires, car du sélénium est ajouté aux fourrages. Les noix du Brésil sont exceptionnellement riches : une seule noix couvre de 11 % à 288 % de l’apport recommandé, selon sa teneur. Les bolets, les asperges et le chou en contiennent dans une certaine mesure (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). En Suisse, les pâtes faites de blé dur nord-américain sont le premier contributeur à l’apport, devant la viande (<a href="https://doi.org/10.1080/19440049.2010.506603" target="_blank" rel="noopener">Jenny-Burri et al., Food Addit Contam 2010</a>). Les sols suisses sont pauvres en sélénium par rapport à d’autres pays ; l’importation d’aliments détermine donc l’apport (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>).</p><div class="key"><b>À retenir.</b> Valeur de référence suisse de l’adulte : 70 µg/jour ; allaitement : 85 µg/jour ; adolescent de 15 à 17 ans : 70 µg/jour. L’apport vient de la viande, des œufs, des produits laitiers et d’aliments importés ; les noix du Brésil sont une source très variable. <button class="w" data-k="e59-statut-suisse">Le statut réel de la population suisse</button> est présenté à l’îlot suivant.</div><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/FLClcT03o4I6/nutrient-requirements-ch-2022.xlsx" target="_blank" rel="noopener">OSAV, valeurs de référence nutritionnelles pour la Suisse, juin 2022</a> ; <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a> ; <a href="https://doi.org/10.1080/19440049.2010.506603" target="_blank" rel="noopener">Jenny-Burri et al., Food Addit Contam 2010</a> ; <a href="https://doi.org/10.1016/j.jtemb.2015.07.005" target="_blank" rel="noopener">Kipp et al., J Trace Elem Med Biol 2015</a>.</p></section>
<section class="ilot" id="e59-4"><h2><span class="n">4</span>Épidémiologie</h2><p>La question épidémiologique est double : la Suisse est-elle une zone de carence, et quels patients y sont exposés ? Les sources lues répondent par le statut biologique de la population et par des études de groupes à risque. Aucune donnée d’incidence de E59 codée en Suisse n’a été trouvée ; cette lacune est déclarée plutôt que comblée par une extrapolation.</p><h3>En Suisse</h3><p>L’OSAV a mesuré en 2019 le sélénium sérique de 700 donneurs de sang adultes. La moyenne est de <b>98 ± 12 µg/L</b>, les valeurs s’étendent de 64 à 136 µg/L et leur distribution est normale (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). Le tableau compare ce résultat aux deux mesures nationales précédentes.</p><table class="t"><tr><th>Année</th><th>Sélénium sérique moyen (µg/L)</th><th>Remarque</th></tr><tr><td>1993</td><td>93 ± 15</td><td>Mesure nationale de comparaison citée par l’OSAV</td></tr><tr><td>2006</td><td>98 ± 13</td><td>1847 donneurs ; minimum 62 µg/L</td></tr><tr><td>2019</td><td>98 ± 12</td><td>700 donneurs ; valeurs de 64 à 136 µg/L</td></tr></table><p>La lecture est rassurante : le statut moyen est stable depuis 1993, et le minimum observé en 2006 (62 µg/L) reste proche du seuil de 60 µg/L des lignes directrices ESPEN (<a href="https://doi.org/10.1016/j.jtemb.2007.11.002" target="_blank" rel="noopener">Burri et al., J Trace Elem Med Biol 2008</a>). Les femmes ont une moyenne de 97 ± 13 µg/L (334 femmes) et les hommes de 99 ± 12 µg/L (366 hommes). La différence est significative et attribuée à un apport total plus élevé chez l’homme ; l’âge et la région linguistique ne modifient pas le résultat (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>).</p><p>L’apport estimé est de 67 ± 13 µg/jour chez la femme et de 70 ± 12 µg/jour chez l’homme. Avec un besoin moyen estimé de 45 µg/jour, la prévalence d’un apport insuffisant est inférieure à 2 % chez l’homme et inférieure à 5 % chez la femme (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). Une étude de 2010 estimait l’apport à environ 66 µg/jour, presque constant sur vingt-cinq ans (<a href="https://doi.org/10.1080/19440049.2010.506603" target="_blank" rel="noopener">Jenny-Burri et al., Food Addit Contam 2010</a>). Environ 2 % de la population prenait des suppléments en 2006 (<a href="https://doi.org/10.1016/j.jtemb.2007.11.002" target="_blank" rel="noopener">Burri et al., J Trace Elem Med Biol 2008</a>). <button class="w" data-k="e59-statut-suisse">Les chiffres suisses et leurs limites</button> sont détaillés dans une fenêtre.</p><p>Les groupes à risque sont mieux documentés que la population générale. Chez les femmes véganes non supplémentées, la médiane est de 80 µg/L et le minimum de 62 µg/L (<a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a>). Dans le canton de Vaud, une étude de 206 hommes détenus et de 189 hommes de la population générale trouve des médianes proches (106 et 105 ng/mL). Des valeurs inférieures à 60 ng/mL concernent 2,55 % des détenus et aucun homme de la population générale (<button class="w" data-k="e59-vaud">la population vaudoise et ses facteurs associés</button>).</p><div class="trap"><span class="k">Piège</span> Les donneurs de sang sont des adultes en bonne santé : leurs valeurs décrivent la population saine, non les patients dénutris, dialysés ou sous nutrition artificielle. La rareté de la carence en population générale ne dispense pas de la chercher chez le patient exposé.</div><h3>En Europe et dans le monde</h3><table class="t"><tr><th>Contexte</th><th>Résultat</th></tr><tr><td>Pays nordiques et baltes</td><td>Apports de 39 à 88 µg/jour chez l’homme, de 22 à 68 µg/jour chez la femme ; sols pauvres, sauf en Finlande où du sélénate est ajouté aux engrais depuis 1984</td></tr><tr><td>Insuffisance cardiaque aggravée (cohorte européenne, 2382 patients)</td><td>Sélénium inférieur à 70 µg/L chez 20,4 % des patients</td></tr><tr><td>Anorexie mentale de l’enfant et de l’adolescent (Lyon, 349 patients)</td><td>Carence en sélénium chez 23,5 %</td></tr><tr><td>Maladie de Keshan</td><td>Enfant et jeune femme en âge de procréer ; apport habituel inférieur à 20 µg/jour</td></tr><tr><td>Maladie de Kashin-Beck</td><td>379 comtés d’endémie en Chine à la fin de 2021</td></tr></table><p>Le tableau montre que la fréquence dépend moins du pays que de la population examinée. Dans l’insuffisance cardiaque aggravée, un patient sur cinq environ a un sélénium inférieur au seuil de 70 µg/L utilisé par l’étude ; ces patients étaient plus âgés, plus souvent des femmes et en classe fonctionnelle plus élevée de la New York Heart Association (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a> ; <button class="w" data-k="e59-biostat">l’étude et la limite du lien de cause</button>). Le seuil de 70 µg/L est celui de l’étude, non celui de l’ESPEN, et les deux ne sont pas interchangeables.</p><div class="key"><b>À retenir.</b> La Suisse n’est pas une zone de carence de masse : le sélénium sérique moyen est de 98 µg/L, stable depuis 1993, et moins de 2 % des hommes et moins de 5 % des femmes ont un apport insuffisant. La carence concerne les patients exposés : nutrition artificielle, anorexie, régime végane non supplémenté, pertes. Aucune incidence suisse de E59 n’est disponible.</div><p class="src">Références : <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a> ; <a href="https://doi.org/10.1016/j.jtemb.2007.11.002" target="_blank" rel="noopener">Burri et al., J Trace Elem Med Biol 2008</a> ; <a href="https://doi.org/10.1080/19440049.2010.506603" target="_blank" rel="noopener">Jenny-Burri et al., Food Addit Contam 2010</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13482155/" target="_blank" rel="noopener">Bettex et al., Int J Public Health 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13536237/" target="_blank" rel="noopener">Iordan et al., Int J Eat Disord 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11096467/" target="_blank" rel="noopener">Liu et al., Front Nutr 2024</a>.</p></section>
<section class="ilot" id="e59-5"><h2><span class="n">5</span>Physiopathologie : du manque à la lésion</h2><p>Pourquoi un oligo-élément présent en quantités de l’ordre du milligramme dans l’organisme peut-il provoquer une insuffisance cardiaque ? Parce que le sélénium est le constituant d’enzymes qui protègent les cellules contre leurs propres déchets oxydants, et que le muscle cardiaque, qui travaille sans interruption, dépend de cette protection.</p><h3>Le sélénium normal</h3><p>Le sélénium est indispensable à la synthèse de la <button class="w" data-k="e59-selenoproteines">sélénocystéine</button>, acide aminé constitutif d’au moins 25 sélénoprotéines humaines. Elles interviennent dans la défense antioxydante et dans le métabolisme des hormones thyroïdiennes (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>). Trois familles suffisent à comprendre la clinique.</p><table class="t"><tr><th>Sélénoprotéine</th><th>Rôle</th><th>Ce que le déficit change</th></tr><tr><td><button class="w" data-k="e59-gpx">Glutathion peroxydases</button></td><td>Convertissent les hydroperoxydes en alcools, en présence de glutathion réduit ; première ligne de défense antioxydante, dans et hors des cellules</td><td>L’intégrité des membranes cellulaires n’est plus protégée ; les espèces réactives de l’oxygène s’accumulent</td></tr><tr><td><button class="w" data-k="e59-desiodase">Iodothyronine 5’-désiodase de type 1</button></td><td>Convertit la thyroxine (T4) en triiodothyronine (T3) active</td><td>Un statut bas est associé à la thyroïdite auto-immune, à la maladie de Basedow et au goitre (association épidémiologique)</td></tr><tr><td><button class="w" data-k="e59-selenop">Sélénoprotéine P</button></td><td>Produite par le foie, principale forme circulante (plus de 50 % du sélénium plasmatique) ; transporte le sélénium vers les tissus</td><td>Elle baisse avec l’inflammation, comme l’albumine, et fausse l’interprétation du dosage</td></tr></table><p>Ce tableau relie chaque fonction à une conséquence clinique ou analytique. La première ligne explique le cœur, la deuxième la thyroïde, la troisième le piège du dosage. L’absorption du sélénium est bonne : de 56 % à 81 % selon les études isotopiques, de 70 % à 80 % pour les aliments, surtout dans le duodénum, sans effet de la dose ni du statut. L’élimination est urinaire et fécale ; l’organisme contient 4 à 20 mg de sélénium et la demi-vie terminale par voie orale est de 96 à 144 jours (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <button class="w" data-k="e59-absorption">absorption, stock et élimination</button>).</p><h3>Du manque à la lésion myocardique</h3><p>Lorsque le sélénium manque, l’activité des glutathion peroxydases diminue. Les espèces réactives de l’oxygène s’accumulent dans les cardiomyocytes et déclenchent apoptose et nécrose. Le cœur dispose de peu de catalase, autre enzyme antioxydante, et dépend donc surtout des glutathion peroxydases (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>). Dans des cardiomyocytes humains privés de sélénium, la fonction mitochondriale et la phosphorylation oxydative s’altèrent et les espèces réactives intracellulaires augmentent (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>). <button class="w" data-k="e59-cardiomyopathie">Le mécanisme de la cardiomyopathie</button> est détaillé dans la fenêtre associée.</p><figure><svg viewBox="0 0 440 470" role="img" aria-label="Chaîne physiopathologique de la cardiomyopathie par carence en sélénium" font-family="Atkinson Hyperlegible, sans-serif" font-size="16"><g fill="none" stroke="#222" stroke-width="2"><rect x="14" y="10" width="412" height="62" rx="6"/><rect x="14" y="102" width="412" height="62" rx="6"/><rect x="14" y="194" width="412" height="62" rx="6"/><rect x="14" y="286" width="412" height="62" rx="6"/><rect x="14" y="378" width="412" height="62" rx="6"/><path d="M220 72v30m-6 -8l6 8 6 -8"/><path d="M220 164v30m-6 -8l6 8 6 -8"/><path d="M220 256v30m-6 -8l6 8 6 -8"/><path d="M220 348v30m-6 -8l6 8 6 -8"/></g><g fill="#222"><text x="28" y="36" font-weight="bold">Apport ou réserve insuffisants</text><text x="28" y="58">Nutrition sans sélénium, malabsorption, pertes</text><text x="28" y="128" font-weight="bold">Moins de sélénocystéine</text><text x="28" y="150">Activité réduite des glutathion peroxydases</text><text x="28" y="220" font-weight="bold">Espèces réactives de l’oxygène en excès</text><text x="28" y="242">Cœur pauvre en catalase, mitochondries altérées</text><text x="28" y="312" font-weight="bold">Apoptose et nécrose des cardiomyocytes</text><text x="28" y="334">Myofibrillolyse, vacuolisation, perte de sarcomères</text><text x="28" y="404" font-weight="bold">Cardiomyopathie</text><text x="28" y="426">Insuffisance cardiaque, intervalle QT corrigé long</text></g></svg><figcaption>Figure 1 — Chaîne physiopathologique de la cardiomyopathie par carence en sélénium, d’après <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> et <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>. Schéma didactique original, non à l’échelle ; ce n’est pas une image clinique.</figcaption></figure><p>La figure se lit de haut en bas : chaque flèche est une relation de cause à effet documentée, sauf la dernière étape de l’électrocardiogramme. L’allongement de l’intervalle QT corrigé et l’inversion des ondes T s’expliqueraient par un stress oxydatif qui altère la gestion du calcium et du potassium et retarde la repolarisation. Cette explication est l’hypothèse des auteurs du cas publié, non un fait démontré (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>).</p><h3>Autres organes et co-facteurs</h3><p>La carence de l’hôte augmente la virulence de certains virus à acide ribonucléique, dont le coxsackievirus B3, impliqué dans la maladie de Keshan (<button class="w" data-k="e59-virus">le rôle des virus</button>). Dans la thyroïde, une carence combinée en iode et en sélénium produit le crétinisme myxœdémateux endémique observé en Afrique centrale. Dans l’os et le cartilage, la maladie de Kashin-Beck associe nécrose des chondrocytes de la plaque de croissance et des surfaces articulaires ; un sélénium et un iode bas diminuent davantage l’activité des glutathion peroxydases (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11096467/" target="_blank" rel="noopener">Liu et al., Front Nutr 2024</a>).</p><div class="trap"><span class="k">Piège</span> L’inflammation abaisse le sélénium plasmatique par <b>redistribution</b> hors du compartiment circulant, non par perte réelle : la valeur revient souvent spontanément sans supplément. La sélénoprotéine P, de poids moléculaire voisin de celui de l’albumine, chute comme elle (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <button class="w" data-k="e59-inflammation">le mécanisme et les chiffres</button>).</div><div class="key"><b>À retenir.</b> Sélénium → sélénocystéine → glutathion peroxydases → protection contre les espèces réactives de l’oxygène. Sans sélénium, le cardiomyocyte meurt par apoptose et nécrose ; l’histologie peut ressembler à celle d’une cardiomyopathie dilatée. L’inflammation abaisse le dosage sans abaisser le stock. Le chapitre « Sciences fondamentales » approfondit la biochimie, la physiologie et l’histologie.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8509311/" target="_blank" rel="noopener">Shimada et al., Int J Mol Sci 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11096467/" target="_blank" rel="noopener">Liu et al., Front Nutr 2024</a> ; <a href="https://doi.org/10.1038/s41574-019-0311-6" target="_blank" rel="noopener">Winther et al., Nat Rev Endocrinol 2020</a> ; <a href="https://doi.org/10.1017/S0029665122002646" target="_blank" rel="noopener">Rayman et al., Proc Nutr Soc 2022</a>.</p></section>
<section class="ilot" id="e59-6"><h2><span class="n">6</span>Causes et facteurs de risque</h2><p>L’apport insuffisant est la cause la plus fréquente de carence, et il est largement géographique, lié à la pauvreté des sols (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>). Chez le patient hospitalisé ou suivi en ambulatoire, la carence résulte plutôt d’une combinaison : un apport artificiel qui omet l’oligo-élément, une malabsorption, des pertes accrues ou une inflammation. Le tableau regroupe les situations par mécanisme.</p><table class="t"><tr><th>Situation</th><th>Mécanisme et fait rapporté</th></tr><tr><td><button class="w" data-k="e59-np">Nutrition parentérale</button></td><td>Apport nul si la solution ne contient pas de sélénium ; cardiomyopathie et myopathie rapportées. Même une courte nutrition parentérale postopératoire, supplémentée, a provoqué une carence avec cardiomyopathie chez un patient dénutri atteint de maladie de Crohn</td></tr><tr><td>Nutrition entérale prolongée</td><td>Selon le produit utilisé, la teneur en sélénium peut être insuffisante</td></tr><tr><td>Malabsorption, maldigestion, malnutrition</td><td>Moins de sélénium absorbé ; la maladie de Crohn et les résections intestinales étendues sont citées</td></tr><tr><td><button class="w" data-k="e59-bariatrie">Chirurgie bariatrique</button></td><td>Cardiomyopathie et myopathie rapportées en cas isolés ; en pratique suisse, carence rare, surtout avec des anastomoses très distales</td></tr><tr><td><button class="w" data-k="e59-dialyse">Hémodialyse, épuration extrarénale continue</button></td><td>Pertes accrues et stress oxydatif</td></tr><tr><td><button class="w" data-k="e59-brulures">Brûlures et pertes digestives</button></td><td>Pertes par les exsudats ; fistules et diarrhée augmentent l’élimination</td></tr><tr><td><button class="w" data-k="e59-vegane">Alimentation végétalienne sans supplément</button></td><td>Le régime exclut la viande, les œufs et les produits laitiers, qui sont des sources de sélénium ; risque documenté en Suisse</td></tr><tr><td><button class="w" data-k="e59-anorexie">Anorexie mentale</button></td><td>Apport réduit ; carence chez 23,5 % des enfants de la cohorte lyonnaise</td></tr><tr><td>Âge, tabagisme, faible revenu</td><td>Associés à un sélénium plus bas chez des hommes détenus vaudois ; association, non cause démontrée</td></tr></table><p>Le tableau se lit en deux temps. On cherche d’abord une source d’apport artificielle sans sélénium, qui est la cause évitable. On cherche ensuite une cause de perte ou de malabsorption, qui ne s’élimine pas mais se compense. Pour la patiente de la vignette, les deux se cumulent : poches sans oligo-éléments et résections étendues. Le Danemark illustre le poids du régime : des apports véganes de 33 µg/jour chez l’homme et de 25 µg/jour chez la femme, contre 52 et 39 µg/jour dans la population de comparaison (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><div class="trap"><span class="k">Piège</span> Une nutrition parentérale supplémentée n’exclut pas la carence : un cas rapporté associe une courte nutrition postopératoire à une cardiomyopathie réversible sous sélénium oral (<a href="https://doi.org/10.1136/pgmj.70.821.235" target="_blank" rel="noopener">Levy et al., Postgrad Med J 1994</a>). Le risque dépend aussi de l’état nutritionnel de départ et des pertes digestives.</div><div class="key"><b>À retenir.</b> Les facteurs de risque à repérer sont la nutrition artificielle, la malabsorption (maladie de Crohn, résection), la chirurgie bariatrique, la dialyse, les brûlures, les pertes digestives, le régime végétalien non supplémenté et l’anorexie. La plupart se repèrent à l’anamnèse.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a> ; <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13536237/" target="_blank" rel="noopener">Iordan et al., Int J Eat Disord 2026</a> ; <a href="https://rosenfluh.ch/ernaehrungsmedizin-2024-04/mikronaehrstoffe-gewichtszunahme-postoperative-komplikationen-lebenslange-kontrollen-nach-bariatrie" target="_blank" rel="noopener">Baumgartner et Schütz, Schweizer Zeitschrift für Ernährungsmedizin 2024</a> ; <a href="https://doi.org/10.1136/pgmj.70.821.235" target="_blank" rel="noopener">Levy et al., Postgrad Med J 1994</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13482155/" target="_blank" rel="noopener">Bettex et al., Int J Public Health 2026</a>.</p><button class="pareto-btn ui" data-k="pareto-e59-fond">▲ Loi de Pareto — Notions, épidémiologie, mécanisme et causes</button></section>
