<template data-pop="e59-se-plasma" data-title="Sélénium plasmatique ou sérique : interprétation"><h3>Ce que mesure l’examen</h3><p>Le sélénium plasmatique ou sérique est l’indicateur principal du statut. Il se compose surtout de sélénoprotéine P et de glutathion peroxydase extracellulaire. La méthode préférée est la spectrométrie de masse couplée à un plasma inductif (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Valeurs</h3><p>Statut adéquat : au moins 0,75 µmol/L (60 µg/L) sans inflammation. Moyenne suisse : 98 ± 12 µg/L (donneurs de sang, 2019). Intervalle européen cité : 70 à 130 µg/L. Les intervalles de référence sont à établir localement selon l’alimentation.</p><h3>Pièges</h3><p>L’inflammation abaisse le résultat (<button class="w" data-k="e59-inflammation">fenêtre</button>). Les normes diffèrent selon la matrice, la méthode et le pays. Les conditions pré-analytiques (tubes, hémolyse, jeûne) ne sont documentées par aucune source primaire lue.</p><h3>Erreur fréquente</h3><p>Utiliser le sélénium plasmatique comme reflet unique du stock tissulaire : l’inflammation le redistribue sans le diminuer vraiment.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://www.blv.admin.ch/dam/de/sd-web/XvX1PJ6YdCF0/selenstatus-vegetarisch-veganen-ernaehrung-de.pdf" target="_blank" rel="noopener">OSAV, statut en sélénium de la population suisse et alimentation végétarienne et végétalienne, 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>.</p></template>
<template data-pop="e59-gpx3" data-title="Glutathion peroxydases plasmatique et érythrocytaire"><h3>Statut fonctionnel</h3><p>La glutathion peroxydase de type 3 est plasmatique, représente environ 20 % du sélénium plasmatique et reflète les variations à court terme. La glutathion peroxydase de type 1 est érythrocytaire ; elle reflète l’apport sur une période plus longue, celle de la durée de vie du globule rouge (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><h3>Valeurs</h3><p>La saturation de la glutathion peroxydase de type 3 se situe vers 1,20 µmol/L de sélénium plasmatique ; le plateau de l’activité plasmatique se situe vers 0,75 µmol/L.</p><h3>Place</h3><p>Ces dosages ne sont pas systématiques. Ils apportent une information fonctionnelle que le sélénium plasmatique seul ne donne pas, mais les sources lues ne fournissent pas d’intervalle de référence suisse pour ces activités.</p><p class="src">Référence : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>.</p></template>
<template data-pop="e59-selenop-dosage" data-title="Dosage de la sélénoprotéine P"><h3>Ce qu’il apporte</h3><p>La sélénoprotéine P représente plus de 50 % du sélénium plasmatique. Son plateau correspond à environ 110 µg/L de sélénium plasmatique (<a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>).</p><h3>Limites</h3><p>Les dosages sont peu répandus et les résultats entre méthodes sont discordants. La sélénoprotéine P baisse en cas d’inflammation, comme l’albumine : elle ne s’affranchit donc pas du piège de la CRP.</p><h3>Décision</h3><p>L’examen n’est pas systématique ; le sélénium plasmatique avec la CRP reste le dosage de première intention.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770655/" target="_blank" rel="noopener">Alexander et Olsen, Food Nutr Res 2023 (Nordic Nutrition Recommendations 2023)</a>.</p></template>
<template data-pop="e59-matrices" data-title="Sang total, urine et cheveux"><h3>Les trois matrices</h3><table class="t"><tr><th>Matrice</th><th>Ce qu’elle reflète</th><th>Limite</th></tr><tr><td>Sang total</td><td>Résultat composite du plasma et des érythrocytes</td><td>Mélange deux compartiments aux cinétiques différentes</td></tr><tr><td>Urine</td><td>Apport récent</td><td>Rarement utilisée</td></tr><tr><td>Cheveux</td><td>Apport à long terme</td><td>Contamination cosmétique ; peu utile en situation aiguë</td></tr></table><h3>Lecture</h3><p>Chaque matrice répond à une question de temporalité. Le sélénium du sang total ou du sérum est celui que la notice de selenase® demande de contrôler pendant le traitement (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>).</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-reference-suisse" data-title="Intervalle de référence vaudois et seuil de 60 ng/mL"><h3>L’intervalle</h3><p>Dans l’étude vaudoise (hommes adultes de la population générale), l’intervalle entre le 5e et le 95e percentile est de 86 à 144 ng/mL, soit 86 à 144 µg/L (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13482155/" target="_blank" rel="noopener">Bettex et al., Int J Public Health 2026</a>).</p><h3>Le seuil ESPEN</h3><p>Le seuil de 60 ng/mL correspond à 0,76 µmol/L (calcul du rédacteur) et à la limite adéquate de l’ESPEN. Les valeurs inférieures à 60 ng/mL sont rares : 2,55 % des détenus, aucun homme de la population générale.</p><h3>Limites</h3><p>L’intervalle ne concerne que des hommes adultes. Il ne s’applique pas sans précaution aux femmes, aux enfants ni aux patients hospitalisés. Il diffère de l’intervalle européen de 70 à 130 µg/L utilisé dans l’étude d’insuffisance cardiaque.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13482155/" target="_blank" rel="noopener">Bettex et al., Int J Public Health 2026</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7540257/" target="_blank" rel="noopener">Bomer et al., Eur J Heart Fail 2020</a>.</p></template>
<template data-pop="e59-bnp" data-title="Peptide natriurétique de type B dans le cas publié"><h3>Rôle</h3><p>Dans le cas publié, le peptide natriurétique de type B a servi de marqueur de suivi : 963, puis 332, puis 174 pg/mL au fil de la correction du sélénium (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>).</p><h3>Interprétation</h3><p>La baisse accompagne la récupération de la fraction d’éjection (29,2 % puis 50 % à trois mois). Elle reflète vraisemblablement l’amélioration hémodynamique, non la correction du sélénium elle-même (interprétation du rédacteur).</p><h3>Limites</h3><p>Les sources lues ne donnent pas de seuil de référence ni d’indication de dosage systématique du peptide en cas de suspicion de carence. Il s’agit de la valeur d’un cas unique.</p><p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13098164/" target="_blank" rel="noopener">Moriizumi et al., Eur Heart J Case Rep 2026</a>.</p></template>
<template data-pop="e59-d-selenase" data-title="selenase® : mécanisme, preuves, posologie, effets indésirables, contre-indications, surveillance"><h3>Composition et présentation</h3><p>Sélénite de sodium pentahydraté : 50 µg de sélénium par ml (166,5 µg de sélénite de sodium par ml). Ampoules buvables ou injectables de 2 ml (100 µg) et flacons de 10 ml. Catégorie de remise B. Titulaire : Plavidente GmbH. Information mise à jour en juin 2023, consultée le 15.10.2026 (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><h3>Indication et mécanisme</h3><p>Carence en sélénium ne pouvant être compensée par l’alimentation seule : malabsorption, maldigestion, malnutrition, nutrition parentérale totale. Le sélénite apporte le sélénium nécessaire à la synthèse des sélénoprotéines, dont les glutathion peroxydases.</p><h3>Preuves</h3><p>L’information professionnelle cite des références pédiatriques internes anciennes (1997 et 2002). Le dossier ne contient pas d’essai contrôlé propre au produit : les doses reposent sur la notice et sur les recommandations ESPEN, qui sont souvent des points de bonne pratique.</p><h3>Posologie</h3><p>Adulte : 100 à 200 µg/jour (1 à 2 ampoules), jusqu’à 500 µg/jour si nécessaire, par voie intramusculaire, intraveineuse, en perfusion ou par voie orale. Nutrition parentérale totale : 100 µg/jour, sans limite de durée. Carence subchronique : traitement injectable de 6 à 8 semaines en cas de malabsorption, intervalles allongés progressivement, puis voie orale pendant au moins 3 mois après la phase injectable. Enfant : 2 µg/kg/jour. Voie orale : 1 à 2 heures avant ou après un repas, en gardant la solution en bouche une demi-minute à une minute.</p><h3>Contre-indications et précautions</h3><p>Intoxication au sélénium ; hypersensibilité. En cas de vomissements ou de diarrhées graves, préférer la voie parentérale. Grossesse et allaitement : seulement en cas de nécessité absolue (malformations chez l’animal à forte dose, aucune étude contrôlée).</p><h3>Interactions et incompatibilités</h3><p>Les réducteurs comme la vitamine C transforment le sélénite en sélénium élémentaire non biodisponible : espacer d’environ quatre heures. Le sélénite forme des sels peu solubles avec le mercure, le cadmium, le plomb et le thallium.</p><h3>Effets indésirables</h3><p>Douleur à l’injection intramusculaire ; réactions allergiques rares. Le surdosage est décrit dans la fenêtre dédiée.</p><h3>Surveillance</h3><p>Contrôle du sélénium dans le sang total ou le sérum pendant le traitement. Conduite de véhicules : rubrique « non pertinent ».</p><p class="src">Référence : information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-d-nutryelt" data-title="Nutryelt : composition, indication, précautions"><h3>Composition et indication</h3><p>Oligo-éléments pour la nutrition parentérale de l’adulte. Chaque ampoule de 10 ml contient 0,9 µmol de sélénium, soit 70 µg. Information mise à jour en novembre 2019, consultée le 15.10.2026 (information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026)).</p><h3>Posologie</h3><p>Une ampoule par jour.</p><h3>Mises en garde</h3><p>En nutrition parentérale moyenne ou longue, les carences en fer, en zinc et en sélénium sont plus fréquentes : il faut compléter si nécessaire. En insuffisance rénale, en insuffisance hépatique ou en cholestase, la dose doit être adaptée car l’excrétion du sélénium diminue.</p><h3>Limites</h3><p>Le dossier ne détaille pas les autres oligo-éléments de la préparation ni son mécanisme. Le calcul à partir du facteur de conversion donne environ 71 µg ; la valeur de l’information professionnelle (70 µg) prévaut.</p><p class="src">Référence : information professionnelle suisse Nutryelt (Swissmedic, mise à jour novembre 2019, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-d-addaven" data-title="Addaven : composition et élimination"><h3>Composition et indication</h3><p>Oligo-éléments pour la nutrition parentérale de l’adulte. Chaque ampoule de 10 ml contient 1,0 µmol de sélénium, soit environ 79 µg (calcul du rédacteur d’après le facteur de conversion). Information mise à jour en janvier 2021, consultée le 15.10.2026 (information professionnelle suisse Addaven (Swissmedic, mise à jour janvier 2021, via AIPS, consultée le 15.10.2026)).</p><h3>Pharmacocinétique</h3><p>Le sélénium est éliminé surtout par voie urinaire : l’insuffisance rénale justifie donc de la prudence en cas d’apports répétés.</p><h3>Limites</h3><p>L’usage pédiatrique n’a pas été étudié. Le dossier ne reprend pas la posologie détaillée de cette préparation.</p><p class="src">Référence : information professionnelle suisse Addaven (Swissmedic, mise à jour janvier 2021, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-d-peditrace" data-title="Peditrace® : oligo-éléments pédiatriques"><h3>Composition et indication</h3><p>Oligo-éléments pour la nutrition parentérale des prématurés, nourrissons et petits enfants. La teneur en sélénium est de 25,3 nmol/ml. Information mise à jour en novembre 2025, consultée le 15.10.2026 (information professionnelle suisse Peditrace® (Swissmedic, mise à jour novembre 2025, via AIPS, consultée le 15.10.2026)).</p><h3>Posologie</h3><p>1 ml/kg/jour jusqu’à 15 kg, puis 15 ml/jour au-delà. Cela représente environ 2 µg/kg/jour de sélénium, et environ 30 µg/jour à 15 ml (calcul du rédacteur : 25,3 nmol/ml × 79 µg par µmol).</p><h3>Surveillance et précautions</h3><p>Contrôler les oligo-éléments si le traitement dépasse quatre semaines. Utiliser avec précaution en cas d’atteinte hépatique.</p><h3>Limite</h3><p>Les recommandations ESPGHAN de 2018 sur la nutrition parentérale pédiatrique n’ont pas été lues ; les doses pédiatriques viennent des informations professionnelles suisses.</p><p class="src">Références : information professionnelle suisse Peditrace® (Swissmedic, mise à jour novembre 2025, via AIPS, consultée le 15.10.2026) ; information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-d-vitc" data-title="Sélénite et vitamine C : mécanisme et conduite"><h3>Mécanisme</h3><p>Les réducteurs, dont la vitamine C, transforment le sélénite en sélénium élémentaire. Cette forme n’est pas biodisponible : le sélénium administré ne sert plus à la synthèse des sélénoprotéines (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><h3>Conduite</h3><p>Espacer les deux produits d’environ quatre heures. L’information professionnelle signale aussi des sels peu solubles avec le mercure, le cadmium, le plomb et le thallium.</p><h3>Piège</h3><p>La vitamine C est parfois ajoutée par habitude à des cures d’oligo-éléments. Pour le sélénite, cette association annule l’effet du traitement.</p><p class="src">Référence : information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026).</p></template>
<template data-pop="e59-d-surdosage" data-title="Surdosage en sélénium : signes et conduite"><h3>Signes</h3><p>Surdosage aigu : haleine alliacée, fatigue, nausées, diarrhée, douleurs abdominales. Exposition chronique : atteinte des ongles et des cheveux, polyneuropathie (information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026)).</p><h3>Conduite</h3><p>Il n’existe pas d’antidote. Le dimercaprol est déconseillé car il augmente la toxicité. La dialyse est possible en cas de surdosage extrême.</p><h3>Repères de dose</h3><p>La limite supérieure d’apport tolérable est de 255 µg/jour chez l’adulte ; la dose minimale avec effet nocif observé est de 330 µg/jour (<a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a>).</p><p class="src">Références : information professionnelle suisse selenase® (Swissmedic, mise à jour juin 2023, via AIPS, consultée le 15.10.2026) ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9854220/" target="_blank" rel="noopener">EFSA, limite supérieure d’apport tolérable en sélénium, 2023</a>.</p></template>
<template data-pop="e59-d-espen-doses" data-title="Doses ESPEN et limites"><h3>Doses recommandées</h3><table class="t"><tr><th>Situation</th><th>Dose</th></tr><tr><td>Sélénium inférieur à 0,4 µmol/L</td><td>Dès 100 µg/jour, par voie entérale ou intraveineuse</td></tr><tr><td>Nutrition entérale</td><td>Dès 100 µg/jour ; si sélénium inférieur à 0,4 µmol/L, intraveineuse jusqu’à 400 µg/jour pendant au moins 7 à 10 jours, puis contrôle</td></tr><tr><td>Déplétion par apport récent réduit</td><td>Jusqu’à 200 µg/jour, double de la dose usuelle</td></tr><tr><td>Carence en nutrition entérale prolongée</td><td>100 µg/jour par voie intraveineuse pendant 2 semaines</td></tr><tr><td>Brûlé</td><td>Environ 375 µg/jour par voie intraveineuse</td></tr><tr><td>Traumatisme majeur, chirurgie cardiaque</td><td>Environ 275 µg/jour</td></tr><tr><td>Pertes spécifiques</td><td>Jusqu’à 300 µg/jour supplémentaires selon des études de bilan</td></tr></table><h3>Limites</h3><p>Le niveau de preuve est souvent bas (points de bonne pratique, grade 0). Les mégadoses de 1000 à 4000 µg/jour en soins intensifs n’ont pas montré de bénéfice constant et sont déconseillées. Plusieurs de ces doses dépassent la limite supérieure d’apport de la population générale (255 µg/jour) : elles s’appliquent à des pertes mesurées et à des situations précises.</p><p class="src">Référence : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, lignes directrices sur les micronutriments (Berger, Shenkin et al.)</a>.</p></template>
<template data-pop="pareto-e59-fond" data-title="Pareto — Notions, épidémiologie, mécanisme et causes"><p class="ratio" data-cover="e59-0,e59-1,e59-2,e59-3,e59-4,e59-5,e59-6"></p><ul><li>E59 est une catégorie terminale de la CIM-10-GM 2024, sans sous-code. Elle inclut la maladie de Keshan et exclut les séquelles (E64.8).</li><li>La déplétion est un fait biologique ; la carence suppose des signes explicables ou des effets métaboliques défavorables.</li><li><button class="w" data-k="e59-gradation">Trois seuils</button> : 0,75 µmol/L (60 µg/L) sans inflammation, 0,4 µmol/L (32 µg/L) en toute circonstance, CRP inférieure à 20 mg/L.</li><li>Référence suisse de l’adulte : 70 µg/jour. Sélénium sérique moyen suisse : 98 µg/L, stable depuis 1993 ; la Suisse n’est pas une zone de carence de masse.</li><li>Sans sélénium : moins de glutathion peroxydases, plus d’espèces réactives de l’oxygène, apoptose et nécrose des cardiomyocytes. L’inflammation abaisse le dosage par redistribution.</li><li>Causes : nutrition parentérale sans oligo-éléments, malabsorption, dialyse, brûlures, pertes digestives, régime végétalien non supplémenté, anorexie.</li></ul></template>
<template data-pop="pareto-e59-diag" data-title="Pareto — Anamnèse, examen et diagnostic"><p class="ratio" data-cover="e59-7,e59-8,e59-9,e59-10"></p><ul><li>Les symptômes sont non spécifiques ; l’anamnèse repère le contexte de risque (nutrition artificielle, chirurgie digestive, dialyse, pertes, régime).</li><li>Signes : insuffisance cardiaque, myopathie, <button class="w" data-k="e59-leuconychie">leuconychie</button>. Aucune sensibilité ni spécificité n’est connue.</li><li>Diagnostic : contexte, sélénium avec CRP et albumine, retentissement cardiaque, exclusion des autres causes, réponse à la supplémentation.</li><li>Différentiels cardiaques : ischémie, myocardite, infiltrative, rythmique, hypertensive, valvulaire, endocrinienne, thiamine, toxique, génétique ; sélénose et carence en zinc.</li><li>Urgence : insuffisance cardiaque inexpliquée ou intervalle QT corrigé très long chez un patient à risque ; sélénium inférieur à 0,4 µmol/L.</li><li>La cardiomyopathie est potentiellement fatale mais réversible. Les liens avec la mortalité sont des associations.</li></ul></template>
<template data-pop="pareto-e59-trait" data-title="Pareto — Urgences, traitement, suivi et prévention"><p class="ratio" data-cover="e59-11,e59-12"></p><ul><li>Sélénium inférieur à 0,4 µmol/L : au moins 100 µg/jour ; inférieur à 0,75 µmol/L avec CRP inférieure à 20 mg/L : supplémenter.</li><li>Nutrition entérale : jusqu’à 400 µg/jour par voie intraveineuse pendant au moins 7 à 10 jours en carence profonde, puis contrôle ; nutrition parentérale d’entretien : 60 à 100 µg/jour.</li><li><button class="w" data-k="e59-d-selenase">selenase®</button> : adulte 100 à 200 µg/jour (maximum 500) ; enfant 2 µg/kg/jour ; espacer de la vitamine C d’environ quatre heures.</li><li>Pas de mégadoses (1000 à 4000 µg/jour). Limite supérieure d’apport : 255 µg/jour chez l’adulte.</li><li>Suivi : sélénium et CRP au début, puis au moins tous les 3 à 6 mois en nutrition parentérale prolongée.</li></ul></template>
<template data-pop="pareto-e59-ex" data-title="Pareto — Situations particulières, contexte suisse et critères"><p class="ratio" data-cover="e59-13,e59-14,e59-15,e59-16"></p><ul><li>Grossesse : 70 µg/jour ; allaitement : 85 µg/jour ; enfant : 2 µg/kg/jour de selenase®. Insuffisance rénale ou hépatique : adapter les oligo-éléments par voie intraveineuse.</li><li>Orbitopathie basedowienne légère : cure de six mois (EUGOGO), sans posologie dans ce cours.</li><li>Suisse : selenase® liste B ; remboursement, Suva, assurance-invalidité et conduite non vérifiés ; aucune déclaration documentée.</li><li>PROFILES : situations 16, 138 et 170. Piège majeur : interpréter le sélénium sans CRP.</li><li>Aucun critère diagnostique consensuel : conjonction de contexte, biologie, signes explicables et réponse au traitement.</li></ul></template>
<template data-pop="pareto-e59-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e59-e-1,e59-e-2,e59-e-3"></p><ul><li>Indicateur principal : sélénium plasmatique ou sérique, lu avec la CRP et l’albumine.</li><li>Électrocardiogramme et échocardiographie pour le retentissement ; biopsie seulement dans des cas sélectionnés.</li><li>Les dosages fonctionnels, de la sélénoprotéine P, du sang total, de l’urine et des cheveux ne sont pas systématiques.</li><li>L’inflammation abaisse le sélénium de 15 à 50 % selon la CRP ; moins de 0,4 µmol/L impose toujours la supplémentation.</li><li>Un sélénium élevé avec haleine alliacée évoque la sélénose.</li></ul></template>
<template data-pop="pareto-e59-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e59-s-bioc-body"></p><ul><li>Le sélénium entre dans la sélénocystéine, constituant d’au moins 25 sélénoprotéines.</li><li>Les glutathion peroxydases neutralisent les hydroperoxydes ; la désiodase de type 1 active la thyroxine en triiodothyronine.</li><li>La sélénoprotéine P transporte le sélénium ; la vitamine C réduit le sélénite en sélénium non biodisponible.</li></ul></template>
<template data-pop="pareto-e59-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e59-s-physio-body"></p><ul><li>Absorption de 70 à 80 % des aliments, stock de 4 à 20 mg, demi-vie terminale de 96 à 144 jours, élimination surtout urinaire.</li><li>La sélénoprotéine P et la glutathion peroxydase de type 3 composent le sélénium plasmatique ; l’inflammation les abaisse.</li><li>Plateau fonctionnel vers 0,75 µmol/L ; saturation vers 1,20 µmol/L.</li></ul></template>
<template data-pop="pareto-e59-s-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="e59-s-histo-body"></p><ul><li>Myocarde : myofibrillolyse, vacuolisation cytoplasmique, perte de sarcomères, apoptose accrue.</li><li>Maladie de Keshan : nécrose, calcifications, fibrose. Maladie de Kashin-Beck : nécrose des chondrocytes.</li><li>Les lésions cardiaques peuvent régresser sous traitement.</li></ul></template>
<template data-pop="pareto-e59-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e59-p-1,e59-p-2,e59-p-3,e59-p-4,e59-p-5"></p><ul><li>Quatre produits suisses : selenase® (traitement), Nutryelt, Addaven, Peditrace® (nutrition parentérale).</li><li>selenase® : 100 à 200 µg/jour (maximum 500) chez l’adulte, 2 µg/kg/jour chez l’enfant ; Nutryelt : 70 µg par ampoule.</li><li>Espacer le sélénite de la vitamine C d’environ quatre heures ; contre-indication : intoxication au sélénium.</li><li>Surveiller le sélénium avec la CRP. Éviter les mégadoses, le dépassement de 255 µg/jour et le dimercaprol.</li></ul></template>
