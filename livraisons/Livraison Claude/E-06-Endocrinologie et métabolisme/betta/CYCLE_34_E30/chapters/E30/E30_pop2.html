<template data-pop="e30-lucrin" data-title="Lucrin Dépôt 3,75 mg (leuproréline) : analogues de la GnRH">
<div class="lab">Mécanisme</div><p>Analogue de la GnRH : il inhibe l’hyperactivité gonadotrope hypophysaire, ramène les gonadotrophines et les stéroïdes sexuels au niveau prépubertaire (information professionnelle suisse, mai 2025). Le mécanisme de désensibilisation du récepteur n’a pas été lu dans le dossier.</p>
<div class="lab">Preuves</div><p>Aucun essai randomisé n’existe ; bénéfice statural démontré surtout si la puberté débute avant 6 ans chez la fille, controversé de 6 à 8 ans, non démontré au-delà de 8 ans (Guaraldi et coll., 2016 ; Pediatrics, 2009 ; guide danois, 2024).</p>
<div class="lab">Indication et critères</div><p>Puberté précoce centrale idiopathique ou neurogène, début du traitement avant 8 ans (fille) ou 9 ans (garçon), progression rapide ; test à la GnRH positif ; âge osseux avancé d’au moins 1 an ; bilan initial (taille, poids, stéroïdes sexuels, stéroïdes surrénaliens pour exclure une hyperplasie congénitale des surrénales, β-hCG, échographie pelvienne, surrénalienne et testiculaire, imagerie cérébrale).</p>
<div class="lab">Posologie</div><p>0,3 mg/kg toutes les 4 semaines (minimum 7,5 mg), par voie sous-cutanée ou intramusculaire : 7,5 mg jusqu’à 25 kg ; 11,25 mg de plus de 25 à 37,5 kg ; 15 mg au-dessus de 37,5 kg ; maximum 2 mL par injection ; paliers de 3,75 mg par mois si freinage incomplet. Arrêt avant 11 ans (fille) et 12 ans (garçon).</p>
<div class="lab">Effets indésirables et surveillance</div><p>Saignement vaginal possible pendant les deux premiers mois ; abcès stérile ; céphalées ; troubles de l’humeur ; convulsions ; pseudotumeur cérébrale ; épiphysiolyse fémorale possible après l’arrêt ; anaphylaxie rare. Une prise de poids importante impose de vérifier le freinage. Les présentations de 3 et 6 mois n’ont pas l’indication de puberté précoce en Suisse.</p>
</template>
<template data-pop="e30-pamorelin" data-title="Pamorelin LA 22,5 mg (triptoréline)">
<div class="lab">Mécanisme et indication</div><p>Analogue de la GnRH ; indication : puberté précoce centrale chez l’enfant de 2 ans ou plus avec début avant 8 ans (fille) ou 9 ans (garçon) (information professionnelle suisse, juillet 2026).</p>
<div class="lab">Preuves</div><p>Étude de 44 enfants (39 filles, 5 garçons) : LH stimulée prépubertaire chez 93 % à 6 mois et 98 % à 12 mois.</p>
<div class="lab">Posologie</div><p>Une injection intramusculaire toutes les 24 semaines ; dosages hormonaux 1 à 2 mois après la première dose ; taille tous les 3 à 6 mois ; âge osseux régulier ; arrêt avant 11 ans (fille) et 12 ans (garçon).</p>
<div class="lab">Contre-indications et limites</div><p>Il faut exclure les pseudopubertés et les pubertés gonadotrophine-indépendantes (testotoxicose, hyperplasie familiale des cellules de Leydig). Aucune donnée en cas de tumeur intracrânienne. Pamorelin LA 3,75 mg n’a pas d’indication pédiatrique.</p>
<div class="lab">Effets indésirables</div><p>Saignement vaginal pendant le premier mois, céphalées, éruption fébrile pouvant mimer une infection, épiphysiolyse fémorale possible, anaphylaxie rare ; données limitées sur la fertilité. Ménarche environ un an après l’arrêt chez la plupart des filles.</p>
</template>
<template data-pop="e30-decapeptyl" data-title="Decapeptyl retard (triptoréline, usage au CHUV)">
<p>Le CHUV utilise Decapeptyl retard (actif 4 semaines) et Lucrin Dépôt (jusqu’à 12 semaines) par voie intramusculaire à la cuisse ; durée moyenne d’environ 2 ans ; suivi tous les 3 à 6 mois ; prise en charge par l’assurance de base. <b>Lacune :</b> l’information professionnelle suisse de Decapeptyl retard n’a pas été obtenue (seule la présentation de 0,1 mg pour la reproduction a été trouvée) ; aucune dose, aucune contre-indication ni aucun effet indésirable propres à cette préparation ne sont donc rapportés ici.</p>
</template>
<template data-pop="e30-oestradiol" data-title="Estradiol et valérate d’estradiol : induction chez la fille">
<div class="lab">Mécanisme et place</div><p>Œstrogène qui induit les caractères sexuels féminins ; en Suisse, Progynova n’a aucune indication chez l’enfant et l’adolescente : l’induction est hors étiquette (information professionnelle, octobre 2022).</p>
<div class="lab">Posologie</div><p>Retard constitutionnel : valérate d’estradiol 0,3 mg par jour par voie orale pendant 3 à 6 mois (DGKED). Induction : 0,2 mg par jour pendant 6 mois, 0,5 mg par jour de 6 à 12 mois, 1 à 1,5 mg par jour la 2e année, 2 mg par jour dès la 3e année avec progestatif. Endo-ERN : 17β-estradiol préféré, transdermique 0,05 à 0,07 µg/kg la nuit ou oral 0,2 mg par jour la 1re année puis 0,5 mg par jour la 2e année ; début vers 11 ans si hypogonadisme confirmé, 13 ans si retard constitutionnel suspecté.</p>
<div class="lab">Surveillance</div><p>Tous les 3 à 6 mois : poids, taille, pression artérielle, stades de Tanner, observance, échographie pelvienne. Une progression trop rapide nuit au développement mammaire et à la croissance. Les effets indésirables propres de l’œstrogène n’ont pas été extraits : lacune.</p>
</template>
<template data-pop="e30-progestatif" data-title="Progestatifs associés à l’induction œstrogénique">
<p>La DGKED ajoute un progestatif dès le stade 3 de développement mammaire : chlormadinone 2 mg des jours 1 à 12, ou dydrogestérone 10 mg, ou progestérone micronisée 200 mg. L’Endo-ERN l’ajoute après un saignement de privation et au moins deux ans d’œstrogène, si l’utérus est présent, à raison de 10 jours par cycle. Les informations professionnelles de ces progestatifs n’ont pas été lues : leurs effets indésirables et contre-indications ne sont pas rapportés.</p>
</template>
<template data-pop="e30-testoviron" data-title="Testoviron Dépôt (énanthate de testostérone)">
<div class="lab">Indication</div><p>Induction de la puberté chez le garçon en cas de puberté tardive (information professionnelle suisse, juillet 2026). Énanthate 250 mg = 180 mg de testostérone par mL.</p>
<div class="lab">Posologie</div><p>50 mg toutes les 4 semaines, augmentation progressive jusqu’à 250 mg toutes les 3 semaines sur 3 ans. Retard constitutionnel : 50 à 100 mg toutes les 4 semaines pendant 6 mois (DGKED). Endo-ERN : 25 à 50 mg par mois, + 50 mg tous les 6 à 12 mois, 150 à 250 mg toutes les 2 à 4 semaines à l’âge adulte.</p>
<div class="lab">Risques et surveillance</div><p>Réservé aux médecins expérimentés en endocrinologie pédiatrique ; risque de fermeture épiphysaire prématurée chez le garçon en croissance ; micro-embolie pulmonaire huileuse possible pendant ou juste après l’injection. Surveillance tous les 3 à 6 mois avec hématocrite et gynécomastie (Endo-ERN, 2022).</p>
</template>
<template data-pop="e30-testogel" data-title="Testostérone en gel 2 % et voie transdermique">
<p>La DGKED recommande de considérer d’abord la voie transdermique, hors étiquette. Endo-ERN : gel à 2 %, 0,5 g (10 mg) par jour au départ. SIAMS : 10 mg un jour sur deux pour le retard constitutionnel (recommandation 6.11, grade 2). Les informations professionnelles suisses de ces gels n’ont pas été lues : posologies officielles, contre-indications et effets indésirables ne sont pas rapportés.</p>
</template>
<template data-pop="e30-testomepha" data-title="Testosteron-Mepha (undécanoate de testostérone)">
<p>L’information professionnelle suisse n’indique pas ce médicament avant la puberté. L’Endo-ERN déconseille l’undécanoate intramusculaire pour l’induction (recommandation 3.7). Aucune posologie pédiatrique n’est donc proposée.</p>
</template>
<template data-pop="e30-gonadotrophines" data-title="hCG et FSH recombinante dans l’hypogonadisme masculin">
<div class="lab">Place</div><p>Option pour induire la puberté, la croissance testiculaire et la fertilité dans l’hypogonadisme hypogonadotrope masculin (DGKED, schéma 3). L’Endo-ERN rapporte que l’association FSH recombinante et hCG est plus efficace que l’hCG seule (recommandation 4.1) et demande une analyse du sperme et une cryoconservation avant le passage à la testostérone (recommandation 4.2).</p>
<div class="lab">Posologie</div><p>hCG 250 à 500 UI par voie sous-cutanée le lundi et le vendredi, + 250 à 500 UI tous les 6 mois (maximum 3 × 2500 UI par semaine) ; testostérone cible d’au moins 1,5 ng/mL puis supérieure à 3,5 ng/mL. FSH recombinante 3 × 75 à 150 UI par semaine dès testostérone pubertaire, cible de FSH 1 à 7 U/l ; premiers spermatozoïdes 5 à 24 mois après. Passage à la testostérone après le stade V de Tanner, la fin de croissance testiculaire et un plateau de spermatozoïdes.</p>
<div class="lab">Lacunes</div><p>Les informations professionnelles suisses de ces gonadotrophines n’ont pas été lues ; leurs effets indésirables et contre-indications ne sont pas rapportés.</p>
</template>
<template data-pop="e30-bicalutamide" data-title="Bicalutamide et inhibiteur de l’aromatase (excès androgénique sévère du garçon)">
<p>Pour un excès androgénique sévère du garçon, la SIAMS cite l’association d’un anti-androgène (bicalutamide) et d’un inhibiteur de l’aromatase de troisième génération, sur des données de cas, souvent hors étiquette (recommandation 5.12, grade 1, qualité de preuve très faible). Posologies, effets indésirables et contre-indications ne figurent pas dans le dossier.</p>
</template>
<template data-pop="pareto-e30-bases" data-title="Pareto — Définitions, épidémiologie, physiopathologie">
<p class="ratio" data-cover="e30-0,e30-1,e30-2,e30-3"></p><ul><li>Puberté précoce : signes avant 8 ans (fille) ou 9 ans (garçon). Retard : au-delà de 13,5 ans (fille) ou 14 ans (garçon), ou durée excessive, ou arrêt de plus de 18 mois.</li><li>Central : axe activé ; périphérique : stéroïdes sans axe. Le tri commande le traitement.</li><li>Incidence danoise 9,2 et 0,9 pour 10 000 par an ; aucune donnée suisse d’incidence.</li><li>Retard constitutionnel : un tiers des retards chez la fille, 63 % chez le garçon ; diagnostic d’exclusion.</li></ul></template>
<template data-pop="pareto-e30-clinique" data-title="Pareto — Causes, anamnèse, examen, diagnostic">
<p class="ratio" data-cover="e30-4,e30-5,e30-6,e30-7"></p><ul><li>PPC de la fille idiopathique dans plus de 90 % ; IRM chez la fille avant 6 ans et chez le garçon avec PPC.</li><li>PPP : tumeur, hyperplasie des surrénales, hCG, hypothyroïdie, mutation activatrice, apport exogène.</li><li>Test à la GnRH : pic de LH supérieur à 5 UI/l et LH/FSH supérieur à 0,66 ; piège de la thélarche de 2 à 3 ans.</li><li>Retard : maladie chronique, hypergonadotrope par caryotype, hypogonadotrope, constitutionnel en dernier.</li></ul></template>
<template data-pop="pareto-e30-prise" data-title="Pareto — Urgences, prise en charge, suivi">
<p class="ratio" data-cover="e30-8,e30-9,e30-10,e30-11"></p><ul><li>Urgence : signe neurologique, champ visuel, stéroïdes très élevés, hCG ou AFP détectable, saignement prépubertaire.</li><li>Freiner : fille avant 6 ans ; controversé de 6 à 8 ans ; aucun bénéfice démontré au-delà de 8 ans.</li><li>Analogues de la GnRH : arrêt avant 11 ans (fille) ou 12 ans (garçon) ; ménarche environ un an après.</li><li>Induction : dose croissante sur 2 à 3 ans ; Progynova hors étiquette ; undécanoate intramusculaire à éviter.</li></ul></template>
<template data-pop="pareto-e30-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="e30-e-1,e30-e-2,e30-e-3,e30-e-4,e30-e-5"></p><ul><li>Référence fonctionnelle de la PPC : test à la GnRH ; la LH basale est moins fiable.</li><li>Âge osseux avancé si écart supérieur à 2 déviations standard.</li><li>Stéroïdes, DHEAS, 17-hydroxyprogestérone, hCG, AFP, TSH dans la PPP.</li><li>Retard constitutionnel : aucun examen n’en fait seul le diagnostic ; entrée spontanée.</li></ul></template>
<template data-pop="pareto-e30-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e30-s-anat-cours"></p><ul><li>Trois niveaux : hypothalamus, hypophyse, gonade ; surrénale parallèle.</li><li>Hamartome hypothalamique et champ visuel ; bulbes olfactifs dans le retard.</li></ul></template>
<template data-pop="pareto-e30-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="e30-s-histo-cours"></p><ul><li>Peu de données histologiques dans les sources.</li><li>Tissu glandulaire : thélarche ; cellule de Leydig sous la LH.</li></ul></template>
<template data-pop="pareto-e30-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e30-s-physio-cours"></p><ul><li>Ménarche suisse 13,4 ans, 2,2 ans après les seins ; danoise 13,0 ans.</li><li>Pic de croissance : 9 cm par an (fille), 10 cm par an (garçon).</li></ul></template>
<template data-pop="pareto-e30-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="e30-s-bioch-cours"></p><ul><li>Gonadotrophines, stéroïdes, androgènes surrénaliens : trois familles.</li><li>LH basale non harmonisée entre dosages.</li></ul></template>
<template data-pop="pareto-e30-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="e30-s-gen-cours"></p><ul><li>MKRN3 et DLK1 : causes monogéniques les plus fréquentes de PPC familiale.</li><li>Caryotype pour l’hypogonadisme hypergonadotrope ; panel génétique pour reclasser le retard.</li></ul></template>
<template data-pop="pareto-e30-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e30-p-1,e30-p-2,e30-p-3,e30-p-4"></p><ul><li>Lucrin : 0,3 mg/kg toutes les 4 semaines, minimum 7,5 mg ; Pamorelin LA : 22,5 mg toutes les 24 semaines.</li><li>Testoviron : 50 mg toutes les 4 semaines jusqu’à 250 mg toutes les 3 semaines sur 3 ans.</li><li>Valérate d’estradiol : 0,2 mg par jour, puis 0,5 mg, puis 1 à 1,5 mg, puis 2 mg.</li><li>Risques : épiphysiolyse, pseudotumeur, micro-embolie huileuse, fermeture épiphysaire.</li></ul></template>
