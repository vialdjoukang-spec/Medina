<template data-pop="e30-tanner" data-title="Stades de Tanner et orchidomètre de Prader">
<div class="lab">Principe</div><p>Les stades de Tanner chiffrent l’avancement des caractères sexuels secondaires. Le premier signe de puberté est le développement des seins (stade 2) chez la fille et un volume testiculaire d’au moins 4 mL chez le garçon (Endo-ERN, 2022 ; SIAMS, 2024). La cohorte de Zurich retient 3 mL comme indicateur le plus fiable (Largo et Prader, 1983), et le guide danois parle de plus de 3 mL : les seuils varient selon la source.</p>
<div class="lab">Technique</div><p>Chez le garçon, le volume se mesure par comparaison avec l’orchidomètre de Prader, jeu de modèles de volume connu. La SIAMS le recommande (recommandation 5.1, grade 1, niveau de preuve élevé). La DGKED retient comme signes cardinaux du retard un volume inférieur à 3,5 mL et l’absence de croissance de la verge.</p>
<div class="lab">Séquence normale</div><p>Chez la fille : seins, puis pilosité pubienne et axillaire, puis règles 2 à 3 ans après les seins. Chez le garçon : testicules, puis verge, puis pilosité (CHUV).</p>
<div class="lab">Piège</div><p>Les sources lues ne décrivent pas en détail les cinq stades : la définition précise de chaque stade n’est pas reprise ici. Une pubarche isolée ne marque pas le début de la puberté : elle ne le fait que si elle est suivie des signes de gonadarche ; isolée, elle peut traduire une maladie surrénalienne (DGKED, 2021).</p>
</template>
<template data-pop="e30-norme" data-title="Chronologie normale de la puberté (Suisse et Danemark)">
<div class="lab">Données suisses</div><p>Cohorte longitudinale de Zurich : 142 filles et 142 garçons (Largo et Prader, 1983). Filles : début entre 8 à 9 ans au plus tôt et 14 à 15 ans au plus tard ; premier signe : pilosité pubienne 53 %, seins 18 %, les deux 29 % ; ménarche à 13,4 ± 1,0 an, en moyenne 2,2 ans après le début des seins ; développement mammaire de 3,2 ± 1,4 an. Garçons : début entre la 8e et la 15e année ; développement génital de 3,5 ± 1,1 an.</p>
<div class="lab">Données danoises récentes</div><p>Cohorte 2012–2017 (7655 filles, 7104 garçons) : seins au stade 2 de Tanner à 10,5 ans (intervalle de prédiction à 95 % de 8,2 à 12,7), ménarche à 13,0 ans (10,8 à 15,2), début génital à 11,1 ans (8,8 à 13,5), mue de la voix à 13,1 ans (guide danois, 2024).</p>
<div class="lab">Lecture</div><p>L’Endo-ERN situe le début pubertaire féminin vers 10 ans, avec des limites normales d’environ 8 à 13 ans. La cohorte suisse date de 1983 : elle n’a pas été actualisée dans les sources lues.</p>
</template>
<template data-pop="e30-ppc" data-title="Puberté précoce centrale (PPC)">
<div class="lab">Définition</div><p>La puberté précoce centrale est gonadotrophine-dépendante : l’axe hypothalamo-hypophyso-gonadique est activé prématurément et mime la puberté physiologique à un âge inapproprié (guide danois, 2024 ; Latronico et coll., 2016).</p>
<div class="lab">Causes</div><p>Idiopathique dans plus de 90 % des cas chez la fille. Lésions cérébrales : hamartome hypothalamique, gliome optique, tumeur pinéale, kyste, lésion acquise (irradiation, hydrocéphalie, infection, traumatisme). Syndromes (Silver-Russell). Variants de MKRN3, DLK1, KISS1, KISS1R (voir fenêtre génétique).</p>
<div class="lab">Conséquence</div><p>L’IRM est recommandée pour toute fille avec PPC avant 6 ans et pour tout garçon avec PPC (SIAMS). Le traitement par analogue de la GnRH est possible. Chez le garçon, la PPC est environ dix fois moins fréquente que chez la fille.</p>
</template>
<template data-pop="e30-ppp" data-title="Puberté précoce périphérique (PPP)">
<div class="lab">Définition</div><p>Forme gonadotrophine-indépendante : les stéroïdes sexuels proviennent de la gonade, de la surrénale, d’une tumeur ou d’un apport exogène (guide danois, 2024).</p>
<div class="lab">Orientation chez le garçon</div><p>Des signes pubertaires avec testicules de moins de 4 mL orientent vers une PPP ; avec 4 mL ou plus vers une PPC (SIAMS, 2024). Asymétrie ou petit volume testiculaire avec virilisation orientent aussi vers une PPP.</p>
<div class="lab">Conduite</div><p>Traiter la cause. Les analogues de la GnRH sont sans objet. Fréquence : 1 sur 5000 à 1 sur 10 000.</p>
</template>
<template data-pop="e30-rccp" data-title="Retard constitutionnel de croissance et de puberté (RCCP)">
<div class="lab">Définition</div><p>Retard du rythme de maturation, sans maladie sous-jacente. C’est un diagnostic d’exclusion, confirmé par l’entrée spontanée en puberté ; la fertilité n’est pas atteinte (Endo-ERN, 2022).</p>
<div class="lab">Fréquence</div><p>Environ un tiers des retards chez la fille, 63 % chez le garçon (63 à 64 % selon la SIAMS).</p>
<div class="lab">Piège</div><p>Il est difficile à distinguer de l’hypogonadisme hypogonadotrope congénital avant le démarrage de la puberté. Le test à la GnRH ne sépare pas fiablement les deux (SIAMS), et un panel génétique a reclassé trois patients sur 46 (Saengkaew et coll., 2021).</p>
</template>
<template data-pop="e30-hhc" data-title="Hypogonadisme hypogonadotrope et syndrome de Kallmann">
<div class="lab">Définition</div><p>Hypogonadisme avec FSH et LH basses. Il peut être congénital, avec ou sans anosmie (syndrome de Kallmann), intégré dans un déficit hypophysaire multiple, ou syndromique (Endo-ERN, 2022). Il est réversible chez 5 à 20 % des patients.</p>
<div class="lab">Signes d’alerte</div><p>Anosmie ou hyposmie, cryptorchidie, micropénis, défauts de la ligne médiane, surdité. Ils manquent chez la majorité des patients (Saengkaew et coll., 2021).</p>
<div class="lab">Cause fonctionnelle</div><p>La SIAMS demande de traiter la cause d’un hypogonadisme hypogonadotrope fonctionnel ; à défaut, d’induire la puberté.</p>
</template>
<template data-pop="e30-hypergonado" data-title="Hypogonadisme hypergonadotrope : Turner, Klinefelter">
<div class="lab">Définition</div><p>Hypogonadisme avec FSH et LH élevées : dysgénésie gonadique, syndrome de Turner, syndrome de Klinefelter, mosaïque 45,X/46,XY (Endo-ERN, 2022).</p>
<div class="lab">Conduite</div><p>Caryotype ou puce chromosomique chez le garçon hypergonadotrope sans contexte. Chez le garçon avec syndrome de Klinefelter, la DGKED débute l’induction quand la testostérone du matin passe sous la norme.</p>
<div class="lab">Fertilité</div><p>Klinefelter : azoospermie, extraction chirurgicale parfois possible. Turner ou dysgénésie complète : don d’ovocytes si utérus ; grossesse spontanée d’environ 7 % en cas de mosaïcisme.</p>
</template>
<template data-pop="e30-dgked" data-title="DGKED : recommandation allemande sur la puberté retardée">
<p>La Société allemande d’endocrinologie et de diabétologie pédiatriques (Deutsche Gesellschaft für Kinderendokrinologie und -diabetologie) a publié avec l’AWMF une recommandation S1, c’est-à-dire un consensus d’experts, intitulée Pubertas tarda und Hypogonadismus (version 1.0, novembre 2021 ; révision prévue en novembre 2026). Elle définit le retard pubertaire, le bilan et trois schémas d’induction. Ce n’est pas une recommandation suisse.</p>
</template>
<template data-pop="e30-chuv" data-title="CHUV : fiches d’information">
<p>L’unité d’endocrinologie, diabétologie et obésité du Centre hospitalier universitaire vaudois (fiche patients de 2021) et le Département d’endocrinologie, diabétologie, obésité et de pédiatrie (page « Troubles de la puberté ») décrivent la séquence normale, le traitement de la puberté précoce par Decapeptyl retard et Lucrin Dépôt, la durée moyenne d’environ 2 ans et la prise en charge par l’assurance de base. Ce sont des documents d’information pour les familles, non des recommandations de société savante.</p>
</template>
<template data-pop="e30-siams" data-title="SIAMS : recommandation andrologique italienne">
<p>La Società Italiana di Andrologia e Medicina della Sessualità, en collaboration avec une société italienne de pédiatrie endocrinienne, a publié en 2024 (numéro 2025) une recommandation sur les troubles andrologiques de l’enfance à la transition. Elle ne concerne que les garçons. Les recommandations 5.1 à 5.12 portent sur la puberté précoce, les recommandations 6.1 à 6.12 sur le retard. Elle n’a été lue qu’en partie.</p>
</template>
<template data-pop="e30-gnrh" data-title="GnRH : hormone de libération des gonadotrophines">
<p>L’hormone de libération des gonadotrophines est sécrétée de façon pulsatile par l’hypothalamus. Le début de cette sécrétion pulsatile marque le début de la puberté ; elle stimule l’hypophyse pour libérer la LH et la FSH (guide danois, 2024). Les analogues de la GnRH inhibent ensuite l’hyperactivité gonadotrope (information professionnelle de Pamorelin LA). Le mécanisme de désensibilisation du récepteur n’a pas été lu dans les sources : lacune.</p>
</template>
<template data-pop="e30-lh-fsh" data-title="LH et FSH">
<p>L’hormone lutéinisante (LH) et l’hormone folliculostimulante (FSH) sont libérées par l’hypophyse sous l’effet de la GnRH. La LH stimule la production gonadique d’œstradiol ou de testostérone. Le rapport LH/FSH à 30 minutes d’un test de stimulation est un critère de PPC (supérieur à 0,66 selon le guide danois, 2024). Une FSH basse avec LH basse définit l’hypogonadisme hypogonadotrope ; élevée, l’hypergonadotrope.</p>
</template>
<template data-pop="e30-thelarche" data-title="Thélarche prématurée et mini-puberté">
<div class="lab">Définition</div><p>Développement mammaire isolé, uni- ou bilatéral. Entre 0 et 2–3 ans, il reflète la mini-puberté (axe actif après la naissance) et est une variante physiologique. Vers 6–8 ans, il impose de chercher une PPC (guide danois, 2024).</p>
<div class="lab">Profil bénin</div><p>Vitesse de croissance normale, âge osseux normal ou presque, œstradiol indétectable, pic de LH inférieur à 5 UI/l ; aucun traitement.</p>
<div class="lab">Piège</div><p>À 2–3 ans, un pic de LH supérieur à 5 UI/l peut être observé sans PPC, avec FSH plus élevée et rapport LH/FSH inférieur à 0,5.</p>
</template>
<template data-pop="e30-adrenarche" data-title="Adrénarche et adrénarche prématurée">
<div class="lab">Physiologie</div><p>L’adrénarche est l’augmentation des androgènes surrénaliens ; elle est simultanée mais indépendante de l’axe gonadotrope (guide danois, 2024).</p>
<div class="lab">Adrénarche prématurée</div><p>Signes androgéniques isolés (pilosité pubienne ou axillaire, sueur, acné) avant 8 ans chez la fille, 9 ans chez le garçon, plus fréquente chez la fille. DHEAS modérément élevée, âge osseux normal ou peu avancé, vitesse de croissance normale. Une odeur de sueur isolée chez la fille ne requiert en principe pas d’évaluation pédiatrique.</p>
<div class="lab">Alerte</div><p>Si la croissance s’accélère et que l’âge osseux est avancé de plus de 2 ans, chercher une hyperplasie des surrénales non classique et une tumeur.</p>
</template>
<template data-pop="e30-def-retard" data-title="Définition du retard pubertaire : seuils">
<div class="lab">DGKED (2021)</div><p>Au-delà de 13,5 ans (fille) ou 14 ans (garçon) : absence de tout signe pubertaire ; ou durée excessive (plus de 5,0 ans entre les seins et la ménarche, plus de 5,5 ans entre les premiers signes et le stade final chez le garçon) ; ou arrêt d’une puberté commencée pendant plus de 18 mois.</p>
<div class="lab">Variantes</div><p>Endo-ERN : évaluation spécialisée si aucun signe à 13 ans chez la fille, 14 ans chez le garçon, ou score de puberté inférieur à −2 déviations standard. SIAMS : garçon sans entrée en puberté à 14 ans, puberté incomplète ou durée supérieure à 5,2 ans.</p>
<div class="lab">Aménorrhée primaire</div><p>Lien avec le retard féminin (voir fenêtre dédiée).</p>
</template>
<template data-pop="e30-amenorrhee" data-title="Aménorrhée primaire (Seppä et coll., 2021)">
<p>Absence de ménarche à 15 ans ou plus avec caractères sexuels développés et croissance normale, ou à 13 ans ou plus sans signe pubertaire. À évaluer aussi en l’absence de ménarche trois ans après la thélarche (cinq ans si la thélarche survient avant 10 ans) (Seppä et coll., Eur J Endocrinol 2021).</p>
</template>
<template data-pop="e30-hcg" data-title="Tumeurs sécrétant l’hCG">
<p>Les tumeurs sécrétant l’hormone chorionique gonadotrope (hCG) sont le germinome, le tératome, le choriocarcinome et l’hépatoblastome. Elles sont une cause de PPP chez le garçon. L’hCG et l’AFP sont dosées dans le bilan ; l’IRM est indiquée si l’hCG est détectable (guide danois, 2024 ; SIAMS, 2024). Le mécanisme détaillé de l’action de l’hCG n’a pas été lu dans les sources.</p>
</template>
<template data-pop="e30-hcs" data-title="Hyperplasie congénitale des surrénales (HCS)">
<p>L’hyperplasie congénitale des surrénales virilisante ou non classique est une cause d’excès d’androgènes surrénaliens et de PPP. La 17-hydroxyprogestérone est élevée dans cette maladie, et l’information professionnelle de Pamorelin LA exige de l’exclure par les stéroïdes surrénaliens avant traitement (guide danois, 2024).</p>
</template>
<template data-pop="e30-mcune" data-title="McCune-Albright, testotoxicose, Van Wyk-Grumbach">
<div class="lab">McCune-Albright</div><p>Mutation activatrice de GNAS, cause de PPP. Les taches café au lait orientent vers ce diagnostic (guide danois, 2024).</p>
<div class="lab">Testotoxicose familiale</div><p>Mutation activatrice du récepteur de la LH, chez le garçon. L’information professionnelle de Pamorelin LA exclut du traitement les pubertés gonadotrophine-indépendantes (testotoxicose, hyperplasie familiale des cellules de Leydig).</p>
<div class="lab">Van Wyk-Grumbach</div><p>Hypothyroïdie profonde, kyste ovarien, puberté précoce : une TSH très élevée stimule le récepteur de la FSH (guide danois, 2024).</p>
<div class="lab">Lacune</div><p>Le traitement du McCune-Albright et de la testotoxicose chez la fille n’est pas documenté dans les sources lues.</p>
</template>
<template data-pop="e30-genetique" data-title="MKRN3, DLK1, KISS1, KISS1R, GNAS">
<p>MKRN3 et DLK1 sont des gènes soumis à empreinte paternelle ; leurs variants à perte de fonction sont les causes monogéniques les plus fréquentes de PPC familiale, avec IRM normale. KISS1 et KISS1R : variants à gain de fonction rapportés. Une agrégation familiale existe dans 25 à 30 % des PPC (Frontiers in Endocrinology, 2026 ; Latronico et coll., 2016). Le génotypage de MKRN3 est proposé dans les formes familiales et idiopathiques. GNAS est le gène du McCune-Albright. Le détail des protéines n’a pas été lu dans le dossier.</p>
</template>
<template data-pop="e30-snc-garcon" data-title="Lésions cérébrales chez le garçon : deux chiffres">
<p>Les séries récentes rapportent des lésions cérébrales chez environ 6 à 8 % des garçons avec PPC (5,7 % et 7,8 % dans deux cohortes italiennes de 2024 ; 16,3 % dans une cohorte chinoise) ; avant 8 ans, hamartomes 12,95 % et tumeurs 15,11 %, et aucune lésion entre 8 et 9 ans dans la série citée (Frontiers in Endocrinology, 2026). Le guide danois rapporte 25 à 60 % de pathologie du système nerveux central chez le garçon. La divergence n’est pas expliquée par les sources : elle reflète probablement des populations et des définitions différentes, hypothèse non vérifiée.</p>
</template>
<template data-pop="e30-irm-divergence" data-title="IRM chez le garçon : trois positions">
<p>SIAMS : IRM pour tout garçon avec PPC (recommandation 5.4, grade 1). Guide danois : tout garçon de moins de 9 ans. Revue italienne (2026) : IRM fortement envisagée avant 8 ans, non systématique entre 8 et 9 ans sans signe neurologique. Le texte de recommandation le plus récent lu est celui de la SIAMS ; la revue italienne de 2026 est une revue narrative, non une recommandation, et le guide danois est une version en consultation. Aucune source ne tranche la divergence.</p>
</template>
<template data-pop="e30-tcible" data-title="Taille cible">
<p>Taille cible = (taille de la mère + taille du père) / 2, ± 6,5 cm : plus chez le garçon, moins chez la fille (guide danois, 2024). Exemple chiffré fictif : mère 160 cm, père 178 cm ; moyenne 169 cm ; cible de 175,5 cm pour un garçon et 162,5 cm pour une fille.</p>
</template>
<template data-pop="e30-vitesse" data-title="Vitesse de croissance">
<p>La vitesse de croissance se calcule sur au moins 6 mois ; l’incertitude augmente si l’intervalle est plus court. L’obésité augmente la vitesse au début du pic mais abaisse le pic maximal (guide danois, 2024). Pic normal : environ 9 cm par an chez la fille, environ 10 cm par an chez le garçon.</p>
</template>
<template data-pop="e30-lipomastie" data-title="Lipomastie (pseudo-mamelle)">
<p>Chez l’enfant obèse, le volume du sein peut augmenter sans tissu glandulaire palpable : c’est la lipomastie, qui ne constitue pas une puberté (guide danois, 2024).</p>
</template>
<template data-pop="e30-age-osseux" data-title="Âge osseux">
<p>Radiographie de la main et du poignet gauches, lue selon la méthode de Greulich et Pyle. L’âge osseux est avancé si l’écart dépasse 2 déviations standard, soit environ 2 ans (la déviation standard étant d’environ 1 an). Lucrin exige un âge osseux avancé d’au moins 1 an avant traitement (information professionnelle). La SIAMS le recommande chez tout garçon en avance (recommandation 5.2). Le mécanisme de l’avance n’est pas détaillé dans les sources lues.</p>
</template>
<template data-pop="e30-test-gnrh" data-title="Test de stimulation à la GnRH">
<p>Protocole danois : GnRH 3,5 µg/kg par voie intraveineuse (maximum 100 µg), prélèvements à 0 et 30 minutes ; PPC si pic de LH supérieur à 5 UI/l et rapport LH/FSH supérieur à 0,66. SIAMS : pic de LH d’au moins 5 mU/mL compatible avec une PPC. La LH basale est moins fiable (sensibilité de 60 à 100 %). Cible sous traitement : pic de LH inférieur à 4 UI/l.</p>
</template>
<template data-pop="e30-amh" data-title="Hormone anti-müllérienne et inhibine B">
<p>Chez la fille, une hormone anti-müllérienne inférieure à −2 déviations standard (environ 4 pmol/l) prédit l’absence d’entrée en puberté ; l’inhibine B est moins spécifique (Endo-ERN, 2022). La DGKED cite les deux dans les tests dynamiques du retard.</p>
</template>
<template data-pop="e30-saignement" data-title="Saignement prépubertaire bénin">
<p>Saignement vaginal isolé, souvent dû à la maturation folliculaire d’un kyste ovarien. Il faut exclure un traumatisme, une infection, une tumeur, un corps étranger et un abus sexuel (guide danois, 2024).</p>
</template>
<template data-pop="e30-mnemo" data-title="Moyen mnémotechnique : 8-9, 13,5-14">
<p><b>Aide pédagogique, non critère officiel.</b> Avance : le garçon a un an de plus que la fille (8 ans pour la fille, 9 ans pour le garçon). Retard : le garçon a six mois de plus que la fille (13,5 ans, 14 ans). Ces repères sont ceux du guide danois et de la DGKED ; pour les autres sources, vérifier le seuil.</p>
</template>
<template data-pop="e30-fertilite" data-title="Fertilité selon la cause">
<p>Retard constitutionnel : fertilité non affectée. Klinefelter : azoospermie, extraction chirurgicale parfois. Turner : don d’ovocytes si utérus. Hypogonadisme hypogonadotrope isolé : fertilité possible sous FSH et LH (Endo-ERN, 2022). Après freinage de PPC : fonction gonadique rapidement restaurée chez la fille.</p>
</template>
