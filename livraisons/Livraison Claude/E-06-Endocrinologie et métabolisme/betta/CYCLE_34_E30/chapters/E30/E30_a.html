<section class="ilot" id="e30-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Deux consultations posent le même problème d’un côté et de l’autre de la norme. Dans la première <b>vignette fictive</b>, une fille de 5 ans et 10 mois est amenée parce que sa poitrine se développe depuis quatre mois et que ses chaussures deviennent trop petites. Dans la seconde, un garçon de 15 ans est préoccupé : sa voix n’a pas mué, il est le plus petit de sa classe et ses testicules mesurent 3 mL à l’<button class="w" data-k="e30-tanner">orchidomètre de Prader (technique et seuils)</button>. Ces valeurs pédagogiques servent à poser les cinq décisions que le clinicien doit prendre dans les deux situations.</p>
<p>Il doit d’abord affirmer que l’âge d’apparition s’écarte de la norme, ce qui suppose de connaître la <button class="w" data-k="e30-norme">chronologie normale de la puberté (données suisses et danoises)</button>. Il doit ensuite distinguer une variante bénigne d’une maladie, puis, en cas d’avance, séparer l’origine <button class="w" data-k="e30-ppc">centrale</button> de l’origine <button class="w" data-k="e30-ppp">périphérique</button> et, en cas de retard, séparer le <button class="w" data-k="e30-rccp">retard constitutionnel</button> de l’<button class="w" data-k="e30-hhc">hypogonadisme</button>. Il ne doit pas manquer une tumeur. Il décide enfin s’il faut freiner ou induire la puberté (guide clinique danois en consultation, 2024 ; recommandation de la <button class="w" data-k="e30-dgked">DGKED</button>, 2021 ; Endo-ERN, 2022).</p>
<p>La fille de la première vignette a moins de 6 ans : à cet âge, l’imagerie cérébrale est recommandée en cas de puberté précoce centrale, parce que la fréquence d’une lésion cérébrale est élevée avant 6 ans (guide danois, 2024). Le garçon de la seconde vignette est, selon les seuils allemands, en retard pubertaire ; son diagnostic le plus probable est statistiquement le retard constitutionnel, mais ce diagnostic reste un diagnostic d’exclusion (Endo-ERN, 2022).</p>
<div class="key"><b>À retenir.</b> Le même cours traite deux déviations de la norme dont les gestes s’opposent : freiner la puberté trop précoce, ou la déclencher quand elle manque. Le tri entre variante bénigne et maladie repose sur l’âge, la progression et l’examen, avant tout sur les chiffres de laboratoire.</div>
</section>

<section class="ilot" id="e30-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<p>La <b>puberté précoce</b> est définie par l’apparition de signes pubertaires <b>avant 8 ans chez la fille et avant 9 ans chez le garçon</b> (guide danois, 2024 ; fiches du <button class="w" data-k="e30-chuv">CHUV</button> ; recommandation de la <button class="w" data-k="e30-siams">SIAMS</button>, 2024). Ce seuil d’âge décrit une avance par rapport à la population de référence ; il ne dit rien de la cause. Les causes se répartissent en deux mécanismes opposés.</p>
<table class="t"><thead><tr><th>Forme</th><th>Mécanisme</th><th>Repère clinique</th></tr></thead><tbody><tr><td><button class="w" data-k="e30-ppc">Puberté précoce centrale (PPC) (définition et causes)</button></td><td>Activation prématurée de l’axe hypothalamo-hypophyso-gonadique : la puberté est physiologique dans sa séquence, mais à un âge inapproprié (<button class="w" data-k="e30-gnrh">GnRH</button> puis <button class="w" data-k="e30-lh-fsh">LH et FSH</button>).</td><td>Gonadotrophines activées ; chez le garçon, testicules d’au moins 4 mL (recommandation SIAMS, 2024).</td></tr><tr><td><button class="w" data-k="e30-ppp">Puberté précoce périphérique (PPP) (définition et causes)</button></td><td>Stéroïdes sexuels produits indépendamment des gonadotrophines : gonade, surrénale, tumeur ou apport exogène.</td><td>Gonadotrophines basses ; chez le garçon, signes pubertaires avec testicules de moins de 4 mL (recommandation SIAMS, 2024).</td></tr></tbody></table>
<p>Le tableau montre que la séquence clinique ne suffit pas à trancher : une PPC et une PPP donnent toutes deux des seins ou une virilisation. C’est le dosage des gonadotrophines et du stéroïde sexuel, éventuellement après stimulation, qui sépare les deux mécanismes. Cette distinction commande le traitement, car les analogues de la <button class="w" data-k="e30-gnrh">GnRH</button> n’agissent que sur la forme centrale (information professionnelle suisse de Pamorelin LA, juillet 2026).</p>
<p>Deux formes de développement isolé sont des <b>variantes</b> à connaître : la <button class="w" data-k="e30-thelarche">thélarche prématurée</button>, développement mammaire isolé, et l’<button class="w" data-k="e30-adrenarche">adrénarche prématurée</button>, apparition isolée de signes androgéniques (guide danois, 2024).</p>
<p>Le <b>retard pubertaire</b> est défini par la <button class="w" data-k="e30-dgked">DGKED</button> (2021) chez une fille ou un garçon par ailleurs en bonne santé, au-delà de <b>13,5 ans chez la fille et de 14 ans chez le garçon</b>, par l’une de trois situations : l’absence de tout signe pubertaire ; une durée excessive entre les premiers signes et la ménarche (plus de 5,0 ans) ou entre les premiers signes et le stade final génital et pubien chez le garçon (plus de 5,5 ans) ; l’arrêt d’une puberté commencée pendant plus de 18 mois. Ces seuils sont détaillés dans la <button class="w" data-k="e30-def-retard">fenêtre sur la définition du retard</button> avec les variantes de l’Endo-ERN et de la SIAMS. L’<b>hypogonadisme</b> est une limitation pathologique de la fonction gonadique, qui peut produire un retard pubertaire (<button class="w" data-k="e30-dgked">DGKED</button>, 2021).</p>
<p>Le périmètre du cours suit la classification statistique suisse 2024 : les pubertés précoces d’origine centrale, l’hyperplasie congénitale des surrénales et le syndrome de McCune-Albright sont classés dans d’autres rubriques, de même que l’hypogonadisme hypogonadotrope congénital. Ils sont néanmoins exposés ici, car la démarche devant tout enfant en avance ou en retard est la même et le tri entre ces causes est l’acte clinique central.</p>
<div class="trap"><span class="k">Piège</span> Un âge « avant 8 ans » ou « après 13,5 ans » appartient à une définition pratique de la <button class="w" data-k="e30-dgked">DGKED</button> ou des sociétés pédiatriques. L’Endo-ERN et la SIAMS retiennent des seuils voisins mais non identiques (13 ans chez la fille, 14 ans chez le garçon). Le chiffre à citer doit toujours être accompagné de sa source. Un <button class="w" data-k="e30-mnemo">moyen mnémotechnique (aide pédagogique, non critère officiel)</button> aide à retenir les seuils du guide danois et de la DGKED.</div>
</section>

<section class="ilot" id="e30-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>Aucune donnée d’incidence suisse n’a été trouvée dans les sources lues : c’est une lacune. Les chiffres disponibles sont danois. Le guide danois rapporte une incidence de la puberté précoce de <b>9,2 pour 10 000 par an chez la fille</b> et de <b>0,9 pour 10 000 par an chez le garçon</b>, en hausse (guide danois, 2024). La forme périphérique est rare, de l’ordre de 1 sur 5000 à 1 sur 10 000. Chez le garçon, la forme centrale est estimée à environ 1 sur 5000 à 1 sur 10 000, soit environ dix fois moins fréquente que chez la fille (revue de l’hôpital pédiatrique Bambino Gesù, Frontiers in Endocrinology, 2026).</p>
<p>Plusieurs facteurs sont <b>associés</b> à une puberté précoce : l’adoption internationale, la naissance petit pour l’âge gestationnel, le niveau de vie, la nutrition, le surpoids, les expositions prénatales et les perturbateurs endocriniens (guide danois, 2024). Il s’agit d’associations : la causalité n’est pas démontrée. Chez le garçon, les données humaines sur les phtalates, les pesticides et les substances perfluoroalkylées sont limitées et hétérogènes (Frontiers in Endocrinology, 2026).</p>
<p>Pour le retard, la cause la plus fréquente est le <b>retard constitutionnel de croissance et de puberté</b> : il représente environ un tiers des retards chez la fille et environ 63 % chez le garçon (Endo-ERN, 2022 ; 63 à 64 % selon la SIAMS, 2024). Cette fréquence explique pourquoi la première hypothèse d’un garçon de 15 ans sans puberté est le <button class="w" data-k="e30-rccp">retard constitutionnel</button>, tout en rappelant que les deux tiers des retards de la fille et un peu plus d’un tiers de ceux du garçon relèvent d’autres causes qu’il faut chercher.</p>
<div class="trap"><span class="k">Piège</span> La fréquence danoise de la puberté précoce ne se transpose pas sans réserve à la Suisse. La seule donnée suisse lue est la chronologie normale de la cohorte de Zurich (1983), qui date et qui décrit des enfants nés bien avant ceux d’aujourd’hui.</div>
<p>Les données de référence suisses sont celles de la cohorte longitudinale de Zurich (142 filles et 142 garçons ; Largo et Prader, Helvetica Paediatrica Acta, 1983). Elles sont comparées aux données danoises récentes dans la <button class="w" data-k="e30-norme">fenêtre sur la chronologie normale</button> : les deux séries montrent une ménarche autour de 13 ans, mais la méthode et l’époque diffèrent.</p>
</section>

<section class="ilot" id="e30-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Le mécanisme normal.</b> La puberté débute quand la sécrétion <b>pulsatile</b> de <button class="w" data-k="e30-gnrh">GnRH</button> par l’hypothalamus démarre. La GnRH stimule l’hypophyse, qui libère l’hormone lutéinisante (<button class="w" data-k="e30-lh-fsh">LH</button>) et l’hormone folliculostimulante (<button class="w" data-k="e30-lh-fsh">FSH</button>). La LH stimule la production gonadique d’œstradiol ou de testostérone, qui déclenche les caractères sexuels secondaires (guide danois, 2024). L’<button class="w" data-k="e30-adrenarche">adrénarche</button>, augmentation des androgènes surrénaliens, est simultanée mais <b>indépendante</b> de cet axe gonadotrope : elle explique la pilosité et l’odeur de sueur sans signifier que la gonade soit activée.</p>
<p><b>Première perturbation : l’axe démarre trop tôt.</b> Dans la <button class="w" data-k="e30-ppc">PPC</button>, la GnRH pulsatile s’active avant l’âge attendu. La séquence qui suit reste physiologique : seins puis règles chez la fille, testicules puis verge puis pilosité chez le garçon (CHUV). Le défaut tient au calendrier, ce qui explique deux conséquences. Les gonadotrophines sont activées et peuvent être mises en évidence par une stimulation à la GnRH. Un traitement qui bloque cet axe suspend la progression (<button class="w" data-k="e30-lucrin">analogues de la GnRH</button>).</p>
<p><b>Deuxième perturbation : les stéroïdes sont produits sans l’axe.</b> Dans la <button class="w" data-k="e30-ppp">PPP</button>, un kyste ou une tumeur ovarienne, une tumeur testiculaire ou surrénalienne, une hyperplasie des surrénales, une mutation activatrice ou un apport exogène produisent des stéroïdes sexuels alors que les gonadotrophines hypophysaires sont basses. La stimulation à la GnRH reste donc sans réponse. Un cas particulier est la sécrétion d’<button class="w" data-k="e30-hcg">hCG</button> par certaines tumeurs, qui produit des stéroïdes sexuels sans activation de l’axe hypothalamo-hypophysaire (guide danois, 2024).</p>
<p>Troisième mécanisme particulier : l’<b>hypothyroïdie profonde</b>. Une TSH très élevée stimule le récepteur de la FSH, ce qui peut produire un kyste ovarien et une puberté précoce : c’est le <button class="w" data-k="e30-mcune">syndrome de Van Wyk-Grumbach</button> (guide danois, 2024). Ce mécanisme justifie de doser la TSH dans tout bilan de puberté précoce.</p>
<p><b>Retard : trois niveaux possibles.</b> Dans le retard constitutionnel, l’axe est normal mais démarre tard, et la puberté finit par apparaître spontanément (<button class="w" data-k="e30-rccp">RCCP</button>). Dans l’<button class="w" data-k="e30-hhc">hypogonadisme hypogonadotrope</button>, l’axe central ne démarre pas : FSH et LH sont basses. Dans l’<button class="w" data-k="e30-hypergonado">hypogonadisme hypergonadotrope</button>, la gonade est atteinte : FSH et LH sont élevées (Endo-ERN, 2022). Les maladies chroniques provoquent aussi un retard fonctionnel (DGKED, 2021).</p>
<p><b>Conséquence sur la croissance.</b> Le pic de croissance est précoce chez la fille (environ 9 cm par an) et survient chez le garçon au milieu de la puberté (volume testiculaire d’environ 10 mL, environ 10 cm par an ; guide danois, 2024). Une puberté qui commence trop tôt déclenche donc le pic trop tôt, d’où l’objectif de préserver la taille adulte, avec un bénéfice démontré surtout quand la puberté débute avant 6 ans chez la fille (<button class="w" data-k="e30-lucrin">bénéfice du freinage sur la taille adulte</button>).</p>
<div class="key"><b>Corrélation clinique.</b> Gonadotrophines hautes ou activées : l’axe central est en cause. Gonadotrophines basses avec stéroïdes élevés : la source est périphérique. Gonadotrophines basses avec stéroïdes bas chez un adolescent sans puberté : retard constitutionnel ou déficit central. Gonadotrophines élevées avec stéroïdes bas : atteinte de la gonade.</div>

</section>

<section class="ilot" id="e30-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes diffèrent selon le sexe, ce que le tableau rassemble avant le détail. Il est lisible en deux colonnes : la forme (centrale ou périphérique) et les causes retrouvées dans les sources lues.</p>
<table class="t"><thead><tr><th>Type</th><th>Causes retrouvées</th><th>Indice d’orientation</th></tr></thead><tbody><tr><td>PPC de la fille</td><td>Idiopathique dans plus de 90 % des cas ; lésion cérébrale (hamartome hypothalamique, tumeur, kyste) ; lésions acquises ; <button class="w" data-k="e30-genetique">variants des gènes MKRN3, DLK1, KISS1, KISS1R</button></td><td>IRM obligatoire avant 6 ans</td></tr><tr><td>PPC du garçon</td><td>Cause organique plus fréquente que chez la fille ; divergence selon les séries (<button class="w" data-k="e30-snc-garcon">fréquence des lésions cérébrales chez le garçon (deux chiffres)</button>)</td><td>IRM chez tout garçon (SIAMS)</td></tr><tr><td>PPP</td><td>Kyste ou tumeur ovarienne, tumeur de Leydig, tumeur surrénalienne, <button class="w" data-k="e30-hcs">hyperplasie congénitale des surrénales</button>, tumeur sécrétant l’<button class="w" data-k="e30-hcg">hCG</button>, hypothyroïdie, <button class="w" data-k="e30-mcune">mutation activatrice (McCune-Albright, testotoxicose)</button>, stéroïdes sexuels exogènes</td><td>Gonadotrophines basses</td></tr><tr><td>Retard constitutionnel</td><td>Variante du rythme de maturation</td><td>Diagnostic d’exclusion</td></tr><tr><td>Hypogonadisme hypogonadotrope</td><td>Syndrome de Kallmann, déficit hypophysaire multiple, syndromes malformatifs, cause fonctionnelle (maladie chronique)</td><td>Anosmie, cryptorchidie, micropénis, surdité</td></tr><tr><td>Hypogonadisme hypergonadotrope</td><td>Syndrome de Turner, syndrome de Klinefelter, dysgénésie gonadique, mosaïque 45,X/46,XY</td><td>FSH et LH élevées</td></tr></tbody></table>
<p>Dans la <b>puberté précoce centrale de la fille</b>, la cause reste inconnue dans plus de 90 % des cas : le diagnostic est donc idiopathique (guide danois, 2024 ; Latronico et coll., Lancet Diabetes Endocrinol, 2016). Quand une cause existe, elle est cérébrale, par un <b>hamartome hypothalamique</b> (lésion bénigne de la région hypothalamique), une tumeur (gliome optique, tumeur pinéale), un kyste, ou une lésion acquise (irradiation, hydrocéphalie, infection, traumatisme ; guide danois, 2024 ; Frontiers in Endocrinology, 2026). Des syndromes, par exemple le syndrome de Silver-Russell, y sont aussi associés. Chez la fille, l’<b>imagerie révèle une pathologie du système nerveux central dans 25 % des cas avant 6 ans, dans 3 % des cas entre 6 et 8 ans</b> (méta-analyse citée dans le guide danois, 2024) : cette différence de fréquence fonde le seuil d’âge de l’imagerie.</p>
<p>Des <b>facteurs génétiques</b> sont décrits : les variants à perte de fonction de <button class="w" data-k="e30-genetique">MKRN3 et DLK1</button>, gènes soumis à empreinte paternelle, sont les causes monogéniques les plus fréquentes de PPC familiale, avec une IRM normale. Des variants à gain de fonction de <button class="w" data-k="e30-genetique">KISS1 et KISS1R</button> sont aussi rapportés, et une agrégation familiale existe dans 25 à 30 % des PPC (Frontiers in Endocrinology, 2026 ; Latronico et coll., 2016). Le génotypage de MKRN3 est proposé dans les formes familiales et idiopathiques (Latronico et coll., 2016).</p>
<p>Dans la <b>PPP</b>, la cause cherchée est une production autonome de stéroïdes : kyste ou tumeur ovarienne, tumeur testiculaire de Leydig, tumeur surrénalienne. S’y ajoutent l’excès d’androgènes surrénaliens de l’<button class="w" data-k="e30-hcs">hyperplasie congénitale des surrénales</button>, les tumeurs sécrétant l’<button class="w" data-k="e30-hcg">hCG</button> (germinome, tératome, choriocarcinome, hépatoblastome), l’hypothyroïdie profonde, les <button class="w" data-k="e30-mcune">mutations activatrices</button> (testotoxicose familiale par mutation du récepteur de la LH, syndrome de McCune-Albright par mutation de GNAS) et les <b>stéroïdes sexuels exogènes</b>, par exemple une crème appliquée par un parent (guide danois, 2024 ; recommandation de la SIAMS, 2024).</p>
<p>Dans le <b>retard pubertaire</b>, le diagnostic du <button class="w" data-k="e30-rccp">retard constitutionnel</button> est un diagnostic d’exclusion confirmé par l’entrée spontanée en puberté ; la fertilité n’est pas atteinte (Endo-ERN, 2022). L’<b>hypogonadisme fonctionnel</b> accompagne de nombreuses maladies chroniques, endocriniennes ou non : l’anamnèse et l’examen doivent les exclure, et le bilan comprend des marqueurs inflammatoires, la fonction hépatique et rénale, les anticorps de la maladie cœliaque, la TSH, la thyroxine libre et la prolactine (DGKED, 2021). L’<button class="w" data-k="e30-hhc">hypogonadisme hypogonadotrope congénital</button>, avec ou sans anosmie (syndrome de Kallmann), peut s’intégrer dans un déficit hypophysaire multiple ou un syndrome malformatif ; il est réversible chez 5 à 20 % des patients (Endo-ERN, 2022). L’<button class="w" data-k="e30-hypergonado">hypogonadisme hypergonadotrope</button> est dû à une dysgénésie gonadique, au syndrome de Turner, au syndrome de Klinefelter ou à une mosaïque 45,X/46,XY (Endo-ERN, 2022).</p>
<div class="trap"><span class="k">Piège</span> Le retard constitutionnel et l’hypogonadisme hypogonadotrope congénital sont difficiles à distinguer avant que la puberté ne démarre. Dans une série de 46 adolescents, un panel génétique a reclassé trois patients du retard constitutionnel vers l’hypogonadisme hypogonadotrope, et des signes d’alerte cliniques n’étaient présents que chez trois patients (Saengkaew et coll., Eur J Endocrinol, 2021).</div>
<div class="key"><b>Facteurs associés, non causes démontrées.</b> Adoption internationale, naissance petit pour l’âge gestationnel, surpoids et perturbateurs endocriniens sont associés à la puberté précoce. L’association n’autorise pas à attribuer la puberté précoce d’un enfant donné à l’un de ces facteurs avant d’avoir exclu une lésion.</div>
</section>

<section class="ilot" id="e30-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche d’abord ce qui explique l’avance ou le retard, puis ce qui menace. Elle est identique pour les deux sexes dans ses principes : on remonte du développement actuel aux antécédents familiaux et périnataux.</p>
<p><b>Antécédents.</b> Le médecin note l’âge gestationnel, le poids et la taille de naissance, car la naissance petit pour l’âge gestationnel est associée à la puberté précoce. Il note l’adoption internationale et l’origine ethnique, la puberté des parents (âge de la ménarche de la mère, taille du père à l’adolescence) et les tailles parentales qui permettent de calculer la <button class="w" data-k="e30-tcible">taille cible</button>. Il demande tout contact avec des hormones sexuelles, par exemple un traitement parental appliqué sur la peau, et tout antécédent neurologique : traumatisme, infection, tumeur, kyste, irradiation (guide danois, 2024).</p>
<p><b>Symptômes de la puberté précoce.</b> La chronologie et la vitesse des signes comptent plus que leur présence : développement des seins, accélération de croissance (changements fréquents de pointure), pertes ou saignements vaginaux, odeur de sueur, acné, pilosité, changements d’humeur (guide danois, 2024).</p>
<p><b>Symptômes du retard.</b> Le médecin recherche une maladie chronique, endocrinienne ou non, qui accompagne le retard de façon fonctionnelle, ainsi que les signes d’alerte d’un hypogonadisme hypogonadotrope congénital : <b>anosmie ou hyposmie, cryptorchidie, micropénis, défauts de la ligne médiane, surdité</b> (Endo-ERN, 2022). Ces signes ne sont présents que chez une minorité de patients atteints (Saengkaew et coll., 2021) : leur absence n’exclut pas l’hypogonadisme.</p>
<div class="two"><div class="card"><b>Forme typique</b><p>Fille avec développement mammaire et accélération de croissance, sans signe neurologique. Ce tableau correspond le plus souvent à la PPC idiopathique, cause de plus de 90 % des PPC de la fille (guide danois, 2024).</p></div><div class="card"><b>Formes atypiques</b><p>Garçon de moins de 9 ans ; saignement vaginal isolé ; signes de virilisation sans augmentation du volume testiculaire ; céphalées ou trouble visuel. Ces tableaux imposent de chercher une cause tumorale ou périphérique.</p></div></div>
<div class="trap"><span class="k">Piège</span> Un saignement vaginal prépubertaire isolé n’est pas toujours une puberté précoce : il peut résulter de la maturation folliculaire d’un kyste ovarien. Il faut exclure un traumatisme, une infection, une tumeur, un corps étranger et un <b>abus sexuel</b> (guide danois, 2024).</div>
</section>

<section class="ilot" id="e30-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, mesures, anthropométrie, puis signes ciblés. Chaque signe est cliquable pour sa technique et ses pièges.</p>
<div class="two"><div class="card"><b>État général et mesures</b><p>Poids, taille et <button class="w" data-k="e30-vitesse">vitesse de croissance (intervalle minimal et obésité)</button> sur au moins 6 mois ; pression artérielle ; développement psychomoteur ; recherche d’une dysmorphie (guide danois, 2024).</p></div><div class="card"><b>Stades de Tanner</b><p>Les <button class="w" data-k="e30-tanner">stades de Tanner et l’orchidomètre de Prader (technique)</button> chiffrent l’avancement pubertaire. Chez le garçon, l’orchidomètre de Prader est recommandé (SIAMS, 2024, grade 1).</p></div><div class="card"><b>Peau et neurologie</b><p>Acné ; <b>taches café au lait</b> (orientation vers le <button class="w" data-k="e30-mcune">syndrome de McCune-Albright</button>) ; paires crâniennes ; <b>champ visuel</b> (guide danois, 2024).</p></div><div class="card"><b>Gonades</b><p>Asymétrie ou petit volume testiculaire avec virilisation oriente vers une PPP (SIAMS, 2024). Chez l’enfant obèse, une <button class="w" data-k="e30-lipomastie">lipomastie</button> n’a pas de tissu glandulaire palpable (guide danois, 2024).</p></div></div>
<p>La <b>vitesse de croissance</b> se mesure sur au moins six mois : l’incertitude augmente quand l’intervalle est plus court. L’obésité augmente la vitesse au début du pic mais abaisse le pic maximal, ce qui peut tromper l’interprétation (guide danois, 2024). Au-delà de ces mesures, l’examen répond à une question simple : les signes sont-ils compatibles avec l’activation de la gonade (seins, testicules de 4 mL ou plus) ou avec une source d’androgènes extra-testiculaire (testicules petits, virilisation) ?</p>
<div class="trap"><span class="k">Piège</span> Chez le garçon, un volume testiculaire de moins de 3,5 mL à l’orchidomètre de Prader est un signe cardinal du retard (DGKED, 2021), alors qu’un volume de 4 mL ou plus marque l’entrée en puberté (SIAMS, 2024) et que la cohorte de Zurich retient 3 mL comme indicateur le plus fiable (Largo et Prader, 1983). Les seuils diffèrent d’une source à l’autre : toujours préciser laquelle est citée.</div>
<div class="key"><b>À retenir.</b> Les signes qui orientent vers un diagnostic grave sont l’anomalie du champ visuel, les signes neurologiques et la virilisation sans développement testiculaire. Ils modifient la rapidité et la nature des examens avant toute décision thérapeutique.</div>
</section>
