<section class="ilot" id="e52-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Un homme de 47 ans, suivi pour une consommation d’alcool à risque, consulte à la fin du printemps pour une éruption rouge et brûlante du dos des mains, des avant-bras et du visage, apparue après plusieurs jours passés au soleil. Il mange peu et a une diarrhée depuis trois semaines. Sa langue est rouge vif et gonflée. Il paraît ralenti et déprimé. L’éruption est symétrique, nettement bordée, et s’arrête exactement là où la manche de sa chemise couvrait la peau. <b>La question décisive est de savoir quelle maladie unit une dermatite limitée aux zones exposées, une atteinte de la bouche et de l’intestin et un trouble de l’humeur chez un patient dont l’apport alimentaire est précaire.</b></p><p>La réponse est la pellagre, c’est-à-dire la carence sévère en <button class="w" data-k="e52-niacine">niacine</button>, jusqu’à preuve du contraire. Elle se reconnaît d’abord à la clinique. Lorsque la <button class="w" data-k="e52-3d">triade classique</button> n’est pas complète, le diagnostic est souvent retardé ; dans une série de seize patients atteints de pellagre alcoolique, trois seulement présentaient les trois signes. La conduite recommandée consiste à conserver un échantillon de sang si possible, puis à traiter par nicotinamide sans attendre : la réponse rapide au traitement confirme le diagnostic.</p><p>Cet enjeu justifie l’attention. Sans traitement, la pellagre est une maladie mortelle ; avec le traitement, elle est réversible grâce à une vitamine peu coûteuse. En pays riches, ce n’est plus la maladie du maïs, mais une <b>maladie du terrain</b> : alcool, malabsorption, chirurgie bariatrique, anorexie mentale, médicaments tels que l’isoniazide, tumeur neuroendocrine sécrétant de la sérotonine.</p><div class="key"><b>Point de départ.</b> Devant une dermatite photodistribuée, symétrique et bien limitée, le médecin cherche le <button class="w" data-k="e52-apports">déficit d’apport ou de conversion de la niacine et du tryptophane</button>, puis juge la gravité neurologique avant de prescrire.</div><p>Le chapitre suit l’ordre d’une consultation : comprendre la niacine et ses sources d’apport (îlots 1 à 3), reconnaître la maladie et son terrain (îlots 4 à 7), décider du traitement et des urgences (îlots 8 à 10), puis suivre, prévenir et se préparer à l’examen (îlots 11 à 13).</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">Berger et al., recommandations de l’ESPEN sur les micronutriments, Clinical Nutrition 2022</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS, La pellagre et sa prévention et son contrôle dans les situations d’urgence majeures, 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41111680/" target="_blank" rel="noopener">cas d’éruption corticorésistante, Cureus 2025</a>.</p></section>
<section class="ilot" id="e52-1"><h2><span class="n">1</span>Définitions, terminologie et classifications</h2><p>Les mots de la pellagre sont piégeants parce que plusieurs expressions anciennes subsistent dans les manuels. Le chapitre fixe d’abord le vocabulaire, puis les classifications utiles à la décision.</p><h3>Les mots</h3><p>La <button class="w" data-k="e52-niacine">niacine</button> est le terme collectif qui désigne l’acide nicotinique et le nicotinamide. Tous les tissus convertissent ces deux molécules en <button class="w" data-k="e52-nad">NAD</button> et en <button class="w" data-k="e52-nad">NADP</button>, deux coenzymes dont dépendent plus de 400 enzymes, davantage que pour tout autre coenzyme vitaminique. Cette dépendance explique l’étendue des manifestations d’une carence : aucun tissu n’est à l’abri, mais ceux qui consomment le plus d’énergie ou se renouvellent le plus vite souffrent les premiers.</p><p>La <b>pellagre</b> est le syndrome clinique de la carence sévère en niacine ou en tryptophane. Le mot vient de l’italien et signifie « peau rugueuse » ; il date de 1771. Elle touche la peau, le tube digestif et le système nerveux.</p><p>La <button class="w" data-k="e52-3d">maladie des trois D</button> (dermatite, diarrhée, démence, puis un quatrième D pour le décès) reste l’aide-mémoire historique. L’OMS la juge toutefois trompeuse : la diarrhée n’est pas constante, la démence est relativement rare et la dépression est fréquente. Pour la forme encéphalopathique, certains auteurs préfèrent le terme de delirium à celui de démence.</p><p>Deux autres expressions méritent une mise au point. La <i>pellagra sine pellagra</i> désigne une pellagre sans dermatite ; elle est rare et l’OMS juge le terme confus. Chez l’alcoolique, la pellagre se présente cependant souvent sans éruption, ou uniquement par un delirium. L’OMS déconseille aussi « pseudopellagre », « pellagre typhoïde » et « collier de Casal », mais la clinique emploie encore couramment le <button class="w" data-k="e52-collier-casal">collier de Casal</button>. Pour une forme secondaire, elle recommande la formule « carence en acide nicotinique due à… ».</p><h3>Les classifications</h3><p>Le tableau réunit les axes de classification que les sources distinguent. L’axe étiologique oriente la recherche de la cause ; l’axe évolutif guide la gravité ; les deux axes biochimique et de santé publique de l’OMS sont provisoires et ne se confondent pas avec un critère diagnostique.</p><table class="t"><tr><th>Axe</th><th>Catégories</th><th>Ce que l’axe change pour le médecin</th></tr><tr><td>Étiologique</td><td>Primaire : apport insuffisant en niacine ou en tryptophane (maïs non nixtamalisé, malnutrition, famine, anorexie mentale). Secondaire : alcoolisme chronique, malabsorption, troubles du métabolisme du tryptophane, médicaments</td><td>En pays riche, la forme secondaire est la règle ; l’apport alimentaire ne suffit pas à écarter le diagnostic</td></tr><tr><td>Mécanisme</td><td>Apport diminué ; biodisponibilité diminuée ; absorption du tryptophane diminuée ; détournement du tryptophane ; besoins en <button class="w" data-k="e52-nad">NAD</button> augmentés</td><td>Chaque mécanisme désigne un traitement de la cause différent (îlot 10)</td></tr><tr><td>Évolutive</td><td>Stade précoce non spécifique, puis dermatite, atteintes digestive et neuropsychiatrique, enfin encéphalopathie et décès</td><td>Un patient vu tôt n’a ni éruption ni diarrhée : l’anamnèse alimentaire pèse davantage que l’examen</td></tr><tr><td>Biochimique, OMS (provisoire)</td><td>Excrétion urinaire de <button class="w" data-k="e52-seuils-oms">N1-méthylnicotinamide</button> : déficiente &lt; 0,5, basse 0,5–1,59, acceptable 1,6–4,29, élevée ≥ 4,3 mg/g de créatinine (adulte)</td><td>Ces seuils reflètent l’apport, non le diagnostic clinique de pellagre</td></tr><tr><td>Santé publique, OMS (provisoire, non entériné)</td><td>Léger : un cas clinique ou moins de 1 % de la population ; modéré : 1 à 4 % ; sévère : 5 % ou plus</td><td>Ne s’applique qu’à une population, jamais à un patient isolé</td></tr></table><p>Le tableau montre que seul l’axe étiologique se traduit directement en geste thérapeutique. La CIM-10-GM 2024 place la carence en niacine dans une catégorie sans sous-code ; elle y inclut la carence en niacine (tryptophane) et en nicotinamide ainsi que la pellagre alcoolique, et classe les séquelles à part.</p><div class="trap"><span class="k">Piège</span> Chercher la triade complète avant de traiter retarde le diagnostic. La triade est rarement complète, et l’expression « maladie des trois D » ne doit pas servir de critère d’exclusion.</div><div class="key"><b>À retenir.</b> Niacine = acide nicotinique + nicotinamide ; <button class="w" data-k="e52-nad">NAD</button> = coenzyme final. La pellagre est la carence <i>sévère</i> en niacine <i>ou</i> en tryptophane ; elle est presque toujours une carence multiple.</div><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, notes terminologiques et tableaux 4 et 5</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, section 15</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e50-e64.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc E50–E64</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38222748/" target="_blank" rel="noopener">cas d’encéphalopathie alcoolique pellagreuse, Ann Med Surg 2024</a>.</p></section>
<section class="ilot" id="e52-2"><h2><span class="n">2</span>Épidémiologie et pronostic</h2><p>La pellagre est une maladie dont l’histoire explique la physiopathologie. Elle a décimé les populations européennes dont l’alimentation de base était le maïs, puis elle a disparu des pays riches avec la diversification alimentaire. Elle y revient aujourd’hui par d’autres portes.</p><h3>De l’épidémie à la maladie du terrain</h3><p>Dans l’Europe agricole, la pellagre a suivi l’introduction du maïs : Espagne, Italie, France, Europe centrale, Roumanie, Grèce. La Lombardie a compté 39 000 cas pour 2,5 millions d’habitants en 1862, et la Roumanie plus de 55 000 cas déclarés et 1654 décès en 1932. Les peuples amérindiens, qui traitaient le maïs à la chaux ou à la cendre, n’étaient pas touchés : ce traitement alcalin libère la <button class="w" data-k="e52-niacine-liee">niacine liée du maïs</button>. La disparition de la maladie endémique est attribuée à l’élévation du niveau de vie et à la diversification de l’alimentation. En Allemagne, la carence est aujourd’hui rare et secondaire à des maladies : alcoolisme, anorexie mentale, diarrhée chronique, cirrhose.</p><h3>Ce que mesurent les études contemporaines</h3><p>Le tableau rassemble les chiffres lus dans le dossier. Il suit l’ordre : population étudiée, résultat, lecture clinique. La <button class="w" data-k="e52-revue-systematique">revue systématique 2000–2023</button> décrit le tableau d’ensemble ; les autres lignes précisent un terrain.</p><table class="t"><tr><th>Source et population</th><th>Résultat principal</th><th>Lecture clinique</th></tr><tr><td>Revue systématique 2000–2023 : 133 études, 1212 cas</td><td>Atteinte cutanée 98,6 % ; digestive 59,4 % ; neurologique 54,2 %. Cause alimentaire 85 % (dont 93 % en insécurité alimentaire ou crise humanitaire) ; alcool 9,6 % ; isoniazide, première cause médicamenteuse (14,3 %). Résolution complète en moyenne en 27,4 jours</td><td>La peau est le signe le plus constant ; les causes médicamenteuses et de malabsorption progressent</td></tr><tr><td>Série de 16 patients atteints de pellagre alcoolique</td><td>Triade complète chez 3 patients seulement ; association à une encéphalopathie de Wernicke chez 2 et à un sevrage chez 3</td><td>La triade est l’exception</td></tr><tr><td>Autopsies parisiennes de 22 buveurs excessifs</td><td>Chromatolyse neuronale diffuse de type pellagreux, associée dans 13 cas à une maladie de Marchiafava-Bignami ou de Wernicke-Korsakoff</td><td>La pellagre alcoolique est souvent méconnue du vivant</td></tr><tr><td>Étude cas-témoins au <button class="w" data-k="e52-malawi">Malawi</button> en 2019</td><td>Isoniazide en prophylaxie continue : rapport de cotes ajusté de 42,6 (intervalle de confiance à 95 % : 13,3 à 136,6) ; autres facteurs : VIH, insécurité alimentaire, insuffisance pondérale, alcool, allaitement</td><td>L’isoniazide devient un facteur majeur quand l’apport alimentaire est déjà limite</td></tr><tr><td>Syndrome carcinoïde</td><td>Pellagre clinique rare, à un stade tardif ; la déplétion biochimique infraclinique serait plus fréquente mais mal définie</td><td>À évoquer chez tout patient avec flush et diarrhée</td></tr></table><p>La lecture croisée de ces lignes enseigne une règle de raisonnement : la fréquence de la pellagre dépend moins d’un déficit d’apport isolé que de la rencontre d’un apport marginal et d’un facteur qui consomme ou détourne la niacine.</p><h3>Pronostic</h3><p>Sans traitement, la pellagre évolue vers l’encéphalopathie et la mort ; c’est le quatrième D. Avec le traitement, la résolution complète est obtenue en moyenne en 27,4 jours dans la revue systématique. La mortalité actuelle chiffrée n’a pas été retrouvée dans les sources lues.</p><div class="alert"><b>Lacune assumée.</b> Aucune source suisse propre à la pellagre n’a pu être consultée : l’épidémiologie suisse, l’enrichissement éventuel des farines en Suisse et l’adoption par la Suisse des valeurs de référence allemandes ne sont pas documentés dans ce dossier. Les chiffres ci-dessus sont européens ou internationaux et ne se transposent pas tels quels à la population suisse.</div><div class="key"><b>À retenir.</b> En pays riche, la pellagre est rare, secondaire et méconnue ; la peau est atteinte dans près de 99 % des cas rapportés ; la guérison est rapide sous traitement.</div><p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/41876960/" target="_blank" rel="noopener">Litaiem et al., revue systématique, Int J Dermatol 2026</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 2 et 3</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/niacin/" target="_blank" rel="noopener">DGE, valeurs de référence pour la niacine</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35500141/" target="_blank" rel="noopener">Chen et al., J Cosmet Dermatol 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/3401685/" target="_blank" rel="noopener">Serdaru et al., Brain 1988</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35427527/" target="_blank" rel="noopener">étude cas-témoins sur l’isoniazide, Lancet Glob Health 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42735610/" target="_blank" rel="noopener">Baldini et al., Nutrition 2026</a>.</p></section>
<section class="ilot" id="e52-3"><h2><span class="n">3</span>Du bilan nutritionnel normal à la pellagre</h2><p>Pourquoi un patient qui mange du pain, de la viande et du poisson peut-il quand même développer une pellagre ? La réponse tient à une particularité biochimique : la niacine est à la fois une vitamine apportée par l’alimentation et un produit de synthèse de l’organisme à partir d’un acide aminé, le tryptophane. Toute cause qui prive l’organisme de tryptophane, ou qui bloque sa conversion, peut produire une pellagre même si l’apport de niacine paraît correct.</p><h3>Apports et sources de niacine</h3><p>La niacine est hydrosoluble et peu stockée par l’organisme ; le foie en contient une fraction. L’OMS en déduit qu’une administration préventive intermittente est inefficace, puisqu’elle n’agit que si elle est quotidienne. Les aliments riches en niacine sont les aliments enrichis, la viande, la volaille et le poisson (thon, saumon) ; les noix, les légumineuses et les graines en contiennent moins. La DGE ajoute les abats, le pain, les arachides et les champignons. Les végétaux contiennent surtout de l’acide nicotinique, les tissus animaux surtout du nicotinamide.</p><p>Toute la niacine d’un aliment ne devient pas disponible. Dans le maïs, elle est liée de façon covalente à des peptides et à des glucides : on parle de <button class="w" data-k="e52-niacine-liee">niacine liée</button>, indisponible pour l’absorption. L’hydrolyse alcaline douce la libère. La niacine des céréales est donc moins bien absorbée que celle des aliments animaux. Le lait, pauvre en niacine, protège néanmoins parce qu’il apporte du tryptophane.</p><h3>La synthèse à partir du tryptophane</h3><p>Dans le foie, le tryptophane est converti en niacine par la voie de la kynurénine. Il faut 60 mg de tryptophane pour obtenir environ 1 mg de niacine, et cette équivalence définit l’<button class="w" data-k="e52-tryptophane">équivalent niacine</button>. La voie exige les vitamines B1, B2 et B6 : la conversion baisse en carence en B6, et des carences en zinc et en cuivre pourraient la freiner. Une carence multiple en vitamines du groupe B prive donc l’organisme de sa voie de secours.</p><h3>Ce que le déficit en NAD abîme</h3><p>Le déficit en <button class="w" data-k="e52-nad">NAD et NADP</button> altère la production d’énergie, la synthèse lipidique, la réparation de l’ADN et la défense antioxydante. Les premiers tissus touchés sont ceux qui ont une forte demande énergétique ou un renouvellement rapide : la peau, l’intestin et le cerveau. Cette logique prédit la clinique ; elle ne remplace pas la preuve de chaque lien, et certains mécanismes cérébraux restent des hypothèses.</p><figure><svg viewBox="0 0 420 470" role="img" aria-label="Chaîne causale de la pellagre" font-family="Atkinson Hyperlegible, sans-serif" font-size="17"><g fill="none" stroke="#222" stroke-width="2"><rect x="15" y="12" width="390" height="100" rx="6"/><path d="M210 112v28m-6-9l6 9 6-9"/><rect x="15" y="140" width="390" height="70" rx="6"/><path d="M210 210v28m-6-9l6 9 6-9"/><rect x="15" y="238" width="390" height="80" rx="6"/><path d="M210 318v28m-6-9l6 9 6-9"/><rect x="15" y="346" width="390" height="108" rx="6"/></g><g fill="#222"><text x="30" y="40">Apport de niacine ou de tryptophane diminué</text><text x="30" y="65">Biodisponibilité diminuée (niacine liée)</text><text x="30" y="90">Tryptophane détourné ou mal absorbé</text><text x="30" y="172">Synthèse hépatique de niacine insuffisante</text><text x="30" y="197">NAD et NADP diminués</text><text x="30" y="266">Énergie cellulaire diminuée</text><text x="30" y="291">Réparation de l’ADN diminuée</text><text x="30" y="311">Défense antioxydante diminuée</text><text x="30" y="374">Peau : dermatite aux zones exposées (UV)</text><text x="30" y="399">Intestin : glossite, diarrhée</text><text x="30" y="424">Cerveau : dépression, delirium, encéphalopathie</text></g></svg><figcaption>Figure 1 — Chaîne causale de la pellagre : du déficit d’apport ou de conversion au déficit en NAD, puis aux trois organes qui consomment le plus d’énergie ou se renouvellent le plus vite. Schéma didactique original, non à l’échelle ; ce n’est pas une image clinique.</figcaption></figure><h3>Peau, système nerveux, carences associées</h3><p>Sur la peau, le déficit en NAD empêche la réparation de l’ADN et la récupération des kératinocytes après une exposition aux <button class="w" data-k="e52-photosensibilite">ultraviolets</button> ; la dermatite apparaît donc là où la lumière, la friction ou la pression s’exercent. Dans le cerveau, la <button class="w" data-k="e52-encephalopathie">chromatolyse neuronale</button> prédomine sur les cellules pyramidales. Cinq voies sont proposées pour l’expliquer, en partie expérimentales.</p><p>La pellagre est presque toujours une <b>carence multiple</b> : protéines, riboflavine, pyridoxine, thiamine, folates, vitamine A, magnésium, potassium, fer, zinc. Ces déficits expliquent la chéilite, la stomatite, la glossite, l’encéphalopathie et la neuropathie, qu’on ne peut pas attribuer à la seule niacine. Une névrite périphérique que la niacine ne guérit pas suggère un déficit en B1 ou en B12.</p><div class="trap"><span class="k">Erreur fréquente</span> Conclure à l’absence de carence en niacine parce que le patient mange de la viande et du poisson. La forme secondaire ne dépend pas de l’apport : l’<button class="w" data-k="e52-alcool">alcool</button>, la malabsorption, l’<button class="w" data-k="e52-isoniazide">isoniazide</button> et le <button class="w" data-k="e52-carcinoide">syndrome carcinoïde</button> lèsent absorption, conversion ou disponibilité du tryptophane.</div><div class="key"><b>À retenir.</b> Niacine apportée + niacine synthétisée à partir du tryptophane = niacine disponible. La pellagre naît quand l’une des deux sources manque et que l’autre ne compense pas.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, sections 15.1 et 15.4</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 4 à 6, 10, 11 et 15</a> ; <a href="https://www.dge.de/wissenschaft/referenzwerte/niacin/" target="_blank" rel="noopener">DGE</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/25317166/" target="_blank" rel="noopener">Fu et al., Neural Regen Res 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">cas de pellagre bulleuse, 2026</a>.</p></section>
<section class="ilot" id="e52-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Chercher la cause d’une pellagre revient à retrouver le maillon qui manque dans la chaîne précédente : l’apport, l’absorption, la conversion ou la consommation de la niacine. Le tableau regroupe les causes décrites dans les sources par mécanisme, ce qui permet de les rechercher méthodiquement à l’interrogatoire.</p><table class="t"><tr><th>Groupe</th><th>Causes décrites</th><th>Mécanisme dominant</th></tr><tr><td>Apport</td><td>Maïs ou sorgho comme aliment de base ; riz poli chez des réfugiés ; malnutrition, pauvreté, famine ; anorexie mentale ; régime restrictif, y compris cétogène prolongé ; céréales raffinées non enrichies</td><td>Apport de niacine et de tryptophane insuffisant</td></tr><tr><td><button class="w" data-k="e52-alcool">Alcool</button></td><td>Alcoolisme chronique, cause secondaire majeure en pays riche</td><td>Malnutrition, absorption réduite de la niacine et de ses précurseurs, conversion du tryptophane diminuée, carence en zinc</td></tr><tr><td>Digestif</td><td>Malabsorption, diarrhée prolongée, maladie de Crohn, jéjuno-iléite, gastro-entérostomie, cirrhose ; <button class="w" data-k="e52-bariatrique">chirurgie bariatrique</button> (dérivation gastrique)</td><td>Absorption diminuée</td></tr><tr><td>Métabolisme du tryptophane</td><td><button class="w" data-k="e52-carcinoide">Syndrome carcinoïde</button> ; <button class="w" data-k="e52-hartnup">maladie de Hartnup</button> ; phéochromocytome surrénalien (OMS)</td><td>Détournement du tryptophane ou défaut d’absorption</td></tr><tr><td>Médicaments</td><td><button class="w" data-k="e52-isoniazide">Isoniazide</button>, 6-mercaptopurine, 5-fluorouracile, chloramphénicol (OMS) ; azathioprine et anticonvulsivants (cas rapportés) ; chimiothérapies au long cours</td><td>Synthèse ou absorption de niacine perturbée ; besoins augmentés</td></tr><tr><td>Besoins augmentés</td><td>Sujet âgé, grossesse ; traitements lésant l’ADN (radiothérapie, chimiothérapie)</td><td>Consommation de NAD accrue</td></tr></table><p>La lecture du tableau montre que les groupes ne s’excluent pas. Le cas typique en pays riche associe plusieurs lignes : un patient alcoolique, dénutri, opéré de l’estomac, qui prend un médicament. Chaque facteur isolé peut laisser l’apport marginal ; leur association rend la carence plausible.</p><div class="trap"><span class="k">Piège</span> La liste des médicaments inducteurs est incomplète. L’isoniazide est le mieux documenté ; pour d’autres antituberculeux comme le pyrazinamide ou l’éthionamide, le dossier ne contient pas de source. Devant une éruption photodistribuée chez un patient polymédiqué, l’absence d’un médicament dans la liste ne l’innocente pas.</div><div class="key"><b>À retenir.</b> Pays riche : alcool, malabsorption, chirurgie bariatrique, anorexie mentale, isoniazide, tumeur carcinoïde, maladie de Hartnup. Pays à insécurité alimentaire : maïs non traité et malnutrition.</div><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, section 15.4</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 13</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35427527/" target="_blank" rel="noopener">Lancet Glob Health 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39045418/" target="_blank" rel="noopener">cas de dysphagie pellagreuse, Front Med 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37251973/" target="_blank" rel="noopener">pellagre après dérivation gastrique, 2023</a>.</p></section>
<section class="ilot" id="e52-5"><h2><span class="n">5</span>Interroger pour trouver le terrain</h2><p>L’interrogatoire a deux tâches : reconnaître la phase précoce, souvent muette sur la peau, et dresser l’inventaire des facteurs qui privent l’organisme de niacine. Une pellagre peut apparaître dans les 60 jours environ qui suivent un apport déficient ; la date de début des changements alimentaires ou thérapeutiques est donc une donnée diagnostique.</p><h3>La phase précoce</h3><p>Elle est non spécifique : perte de poids, de force et d’appétit, dyspepsie, diarrhée ou constipation, faiblesse, irritabilité, distractibilité. Ces plaintes ne permettent pas de poser le diagnostic, mais elles doivent faire demander l’alimentation chez un patient à risque.</p><h3>Les questions à poser</h3><table class="t"><tr><th>Question</th><th>Pourquoi elle est utile</th></tr><tr><td>Enquête diététique : maïs, céréales raffinées, régime restrictif, jeûne</td><td>Estime l’apport en niacine et en tryptophane</td></tr><tr><td>Consommation d’<button class="w" data-k="e52-alcool">alcool</button></td><td>Première cause secondaire ; la pellagre alcoolique est souvent sans éruption</td></tr><tr><td>Chirurgie digestive ou <button class="w" data-k="e52-bariatrique">bariatrique</button>, diarrhée chronique</td><td>Malabsorption</td></tr><tr><td>Troubles du comportement alimentaire</td><td>Apport insuffisant</td></tr><tr><td>Médicaments : <button class="w" data-k="e52-isoniazide">isoniazide</button>, immunosuppresseurs, antiépileptiques, chimiothérapie</td><td>Inducteurs décrits</td></tr><tr><td>Flush, diarrhée, sifflements</td><td>Orientent vers un <button class="w" data-k="e52-carcinoide">syndrome carcinoïde</button></td></tr><tr><td>Antécédents familiaux et âge de début</td><td>Une forme précoce et familiale évoque la <button class="w" data-k="e52-hartnup">maladie de Hartnup</button></td></tr><tr><td>Exposition solaire récente</td><td>Elle déclenche ou aggrave la dermatite</td></tr></table><p>Le tableau n’est pas exhaustif, mais chaque ligne correspond à une cause que le dossier documente. L’exposition solaire sert surtout à dater le début de l’éruption ; elle ne change pas la conduite.</p><div class="two"><div class="card"><h4>Forme typique</h4><p>Une femme de 38 ans, opérée d’une dérivation gastrique il y a quatre ans, suit mal ses suppléments. Elle présente une diarrhée, une perte de poids et, après un week-end au soleil, un érythème des avant-bras limité aux zones découvertes. Une glossite s’y associe. L’interrogatoire retrouve l’arrêt des multivitamines.</p></div><div class="card"><h4>Formes trompeuses</h4><p>Chez un homme alcoolique, la pellagre se présente par une confusion, sans aucune éruption. Chez un patient traité par corticoïdes pour une dermatose supposée inflammatoire, l’éruption ne cède pas. Chez un patient avec une tumeur neuroendocrine, la pellagre est un diagnostic tardif.</p></div></div><div class="trap"><span class="k">Erreur fréquente</span> Attendre une éruption pour penser à la pellagre chez l’alcoolique. L’absence de dermatite ne l’exclut pas : elle peut ne se manifester que par un delirium.</div><div class="key"><b>À retenir.</b> L’interrogatoire date les changements d’apport et de traitement, dresse l’inventaire des causes secondaires et cherche les signes d’une tumeur carcinoïde ; il prépare la décision de traiter sans attendre.</div><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 5</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39045418/" target="_blank" rel="noopener">Front Med 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35427527/" target="_blank" rel="noopener">Lancet Glob Health 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37251973/" target="_blank" rel="noopener">cas de pellagre après dérivation gastrique, 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41111680/" target="_blank" rel="noopener">Cureus 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">cas de pellagre bulleuse, 2026</a>.</p></section>
<section class="ilot" id="e52-6"><h2><span class="n">6</span>Examiner : peau, bouche, système nerveux</h2><p>L’examen suit l’ordre habituel : état général, constantes, puis les trois organes cibles. La peau est atteinte dans 98,6 % des cas rapportés par la revue systématique, la sphère digestive dans 59,4 % et le système nerveux dans 54,2 %. C’est donc l’examen cutané qui apporte le plus de poids au diagnostic, et l’OMS demande de fonder le diagnostic d’abord sur les lésions cutanées spécifiques, leur distribution et leur démarcation.</p><h3>État général et constantes</h3><p>L’état général est altéré : amaigrissement, faiblesse, apathie. Les constantes ne sont pas spécifiques, mais la déshydratation d’une diarrhée profuse doit être cherchée. L’évaluation du poids et de l’état nutritionnel prépare la prise en charge de la carence multiple associée.</p><div class="two"><div class="card"><h4>Peau</h4><p>Le début est un érythème de type coup de soleil, <b>symétrique</b>, sur les zones exposées : dos des mains et avant-bras jusqu’au bord des manches, pieds et jambes jusqu’à l’ourlet, front, nez et joues en papillon. La partie haute du cou, ombragée par le menton, est épargnée ; la base du cou et le haut du thorax sont atteints selon l’encolure, ce qui dessine le <button class="w" data-k="e52-collier-casal">collier de Casal</button>. La démarcation entre peau atteinte et peau saine est nette. Le patient décrit une brûlure et un prurit.</p><p>Les lésions évoluent : desquamation, puis hyperpigmentation, hyperkératose et épaississement ; l’éruption devient rouge sombre ou violacée, avec parfois des vésicules, des croûtes hémorragiques ou des formes bulleuses. Les lésions peuvent manquer si la peau n’a pas été exposée au soleil ou aux frottements.</p></div><div class="card"><h4>Bouche et tube digestif</h4><p>Le patient se plaint de nausées, d’hypersialorrhée, de brûlures épigastriques et de diarrhée, aqueuse et profuse, parfois sanglante. La langue est <b>rouge vif, « rouge bœuf », et gonflée</b> ; on trouve glossite, stomatite et gingivite. La chéilite et la perlèche relèvent en partie d’une carence en B2 associée. Une dysphagie est possible.</p><p>Dans une série du Malawi de 1989–1990, la dermatite et la stomatite étaient présentes chez environ 60 % des patients, la diarrhée chez 19 % et les troubles mentaux chez 8 %. La diarrhée n’est donc pas constante, ce qui confirme la critique de l’OMS contre la formule des trois D.</p></div></div><div class="two"><div class="card"><h4>Système nerveux</h4><p>Les signes précoces sont l’anxiété, la <b>dépression</b> et la fatigue, puis l’apathie, les céphalées, les vertiges, l’irritabilité et les tremblements. Les réflexes sont diminués ou abolis, et une névrite périphérique est possible. Chez le patient alcoolique, l’<button class="w" data-k="e52-encephalopathie">encéphalopathie pellagreuse</button> associe confusion, obnubilation, hypertonie oppositionnelle, ataxie, myoclonies (environ la moitié des cas) et hallucinations. Le tracé électroencéphalographique montre un ralentissement diffus thêta, qui correspond à un delirium plutôt qu’à une démence.</p><p>Une évolution vers la démence est décrite dans 4 à 10 % des pellagres chroniques ; en carence aiguë, le tableau ressemble à une encéphalopathie de Wernicke.</p></div><div class="card"><h4>Enfant</h4><p>Les signes classiques sont peu développés. L’anorexie, l’irritabilité, l’anxiété et l’apathie sont fréquentes, et d’autres carences s’y associent. Le médecin doit donc penser à la pellagre sans attendre l’éruption typique. Les doses et les produits adultes de ce chapitre ne s’appliquent pas à l’enfant.</p></div></div><div class="trap"><span class="k">Piège</span> Croire que l’histologie cutanée tranche. Les biopsies montrent des vaisseaux dermiques dilatés avec peu d’inflammation, une pâleur épidermique, une ballonnisation des kératinocytes, une hyperkératose et parfois des bulles sous-épidermiques : ces anomalies sont non spécifiques. Une biopsie ne dispense pas du raisonnement clinique.</div><div class="trap"><span class="k">Erreur fréquente</span> Appeler « coup de soleil » toute rougeur du dos des mains chez un patient à risque nutritionnel, puis le rassurer. La démarcation nette, la symétrie et les signes buccaux ou digestifs associés orientent vers la pellagre.</div><div class="key"><b>À retenir.</b> <button class="w" data-k="e52-mnemo">Moyens mnémotechniques (aide pédagogique)</button> : Peau : symétrique, photodistribuée, nettement limitée, puis pigmentée et épaissie. Bouche : langue rouge vif, gonflée. Système nerveux : dépression, confusion, hypertonie oppositionnelle, myoclonies. La diarrhée et la démence ne sont pas constantes.</div><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, pages 1 à 7</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41876960/" target="_blank" rel="noopener">revue systématique 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42381827/" target="_blank" rel="noopener">pellagre bulleuse, 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/3401685/" target="_blank" rel="noopener">Serdaru et al., Brain 1988</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38222748/" target="_blank" rel="noopener">Ann Med Surg 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39045418/" target="_blank" rel="noopener">Front Med 2024</a>.</p><button class="pareto-btn ui" data-k="pareto-e52-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
