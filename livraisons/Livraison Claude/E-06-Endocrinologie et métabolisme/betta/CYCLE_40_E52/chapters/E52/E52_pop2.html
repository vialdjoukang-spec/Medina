<template data-pop="e52-d-nicotinamide" data-title="Nicotinamide : mécanisme, preuves, posologie, tolérance"><h3>Mécanisme</h3><p>Le nicotinamide est converti dans les tissus en <button class="w" data-k="e52-nad">NAD et NADP</button>. Il apporte donc la niacine sans passer par la voie de la kynurénine. Contrairement à l’acide nicotinique, il ne provoque pas le flush.</p><h3>Preuves</h3><p>L’OMS recommande 300 mg par jour de nicotinamide en prises fractionnées pendant 3 à 4 semaines, avec un complexe de vitamines B. L’ESPEN (recommandation 16.5, bonne pratique clinique) rapporte l’efficacité de 300 mg par jour dans la pellagre traditionnelle. Au Malawi, une multivitamine B contenant 300 mg de nicotinamide pendant 30 jours, avec arrêt de l’isoniazide, a été suivie d’une amélioration. Ces repères reposent sur des consensus et des séries ; aucun essai comparatif n’a été lu.</p><h3>Posologie et voie</h3><p>Voie orale ou entérale dès que le tube digestif fonctionne ; voie parentérale en cas de malabsorption ou de grêle court (recommandation 16.6). La dose pédiatrique n’est pas documentée.</p><h3>Effets indésirables et limites</h3><p>La limite supérieure citée par l’ESPEN d’après l’EFSA est de 12,5 mg/kg/jour, soit environ 900 mg par jour. Les contre-indications et la surveillance biologique ne sont pas détaillées dans les sources lues. La surveillance repose sur la réponse clinique.</p><h3>Disponibilité en Suisse</h3><p>Aucune <button class="w" data-k="e52-d-dose-300">monopréparation</button> n’a été retrouvée dans la base AIPS consultée.</p><p class="src">Références : <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 15</a> ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, sections 15.2 et 15.5</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/35427527/" target="_blank" rel="noopener">Lancet Glob Health 2022</a>.</p></template>
<template data-pop="e52-d-acide-nicotinique" data-title="Acide nicotinique : flush, doses et hépatotoxicité"><h3>Mécanisme et usage</h3><p>L’acide nicotinique est converti en NAD comme le nicotinamide. À la dose physiologique de 15 à 20 mg par jour, il est efficace dans la pellagre traditionnelle selon l’ESPEN. Aux doses thérapeutiques élevées, on lui préfère le nicotinamide.</p><h3>Effets indésirables</h3><table class="t"><tr><th>Effet</th><th>Seuil décrit</th></tr><tr><td>Flush</td><td>Dès 30 mg chez le sujet jeune ; 30 minutes après la prise, régression en 60 minutes</td></tr><tr><td>Pas d’effet</td><td>500 mg par jour (OMS)</td></tr><tr><td>Urticaire, troubles digestifs, hyperuricémie (goutte), altération de la tolérance glucidique</td><td>Effets notables à 1000 mg par jour (OMS)</td></tr><tr><td>Hépatotoxicité, de l’élévation des enzymes à l’insuffisance hépatique aiguë</td><td>Vers 3 g par jour ; cas d’hépatite avec des boissons énergisantes</td></tr></table><p>La limite supérieure citée par l’ESPEN d’après l’EFSA pour l’acide nicotinique libre est de 10 mg par jour. Elle est inférieure aux doses de flush : elle sert de repère de sécurité pour les apports chroniques, et le dossier ne précise pas son application thérapeutique.</p><p class="src">Références : <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, sections 15.2 et 15.5</a> ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 14</a>.</p></template>
<template data-pop="e52-d-becozyme" data-title="Bécozyme® forte : composition et précautions (information professionnelle suisse)"><h3>Composition par dragée</h3><table class="t"><tr><th>Constituant</th><th>Teneur</th></tr><tr><td>Nicotinamide</td><td>50 mg</td></tr><tr><td>Vitamine B1</td><td>15 mg</td></tr><tr><td>Vitamine B2</td><td>15 mg</td></tr><tr><td>Vitamine B6</td><td>10 mg</td></tr><tr><td>Vitamine B12</td><td>10 µg</td></tr><tr><td>Biotine</td><td>0,15 mg</td></tr><tr><td>Pantothénate</td><td>25 mg</td></tr></table><h3>Indication et posologie</h3><p>L’information professionnelle (Bayer, mise à jour de mars 2026) indique la prévention et le traitement des carences en vitamines du groupe B. En traitement, la posologie est d’une dragée deux à trois fois par jour dès 12 ans, soit 100 à 150 mg de nicotinamide par jour.</p><h3>Précautions</h3><p>La biotine interfère avec les immunodosages à streptavidine (TSH, troponine). La vitamine B2 colore les urines en jaune. La dragée contient du saccharose et du lactose. En cas d’insuffisance rénale sévère (débit de filtration glomérulaire inférieur à 30 mL/min), un avis médical précède la prise. Grossesse et allaitement : seulement en cas de nécessité absolue. Le produit n’est pas destiné aux enfants de moins de 12 ans.</p><h3>Limite pour la pellagre</h3><p>La teneur en B1, B2 et B6 couvre des carences associées, mais la dose de nicotinamide de la posologie autorisée (100 à 150 mg par jour) n’atteint pas 300 mg par jour.</p><p class="src">Références : information professionnelle suisse de Bécozyme® forte (Bayer), consultée le 15.10.2026 via <code>tools/swissmedic_fi.py</code> (AIPS/AmiKo).</p></template>
<template data-pop="e52-d-soluvit" data-title="Soluvit® N : multivitamine hydrosoluble injectable"><h3>Caractéristiques</h3><p>Soluvit® N (Fresenius Kabi) est un complément hydrosoluble de nutrition parentérale. Une ampoule contient 40 mg de nicotinamide ; la posologie est d’une ampoule par jour. L’information professionnelle date de novembre 2022.</p><h3>Précaution</h3><p>Une injection trop rapide de vitamine B1 a été associée à des chocs isolés : la perfusion doit être lente.</p><h3>Place dans la pellagre</h3><p>Le produit couvre les besoins de la nutrition parentérale (au moins 40 mg de niacine par jour selon l’ESPEN). Il ne constitue pas un traitement dosé de la pellagre, dont la dose de référence est de 300 mg par jour de nicotinamide.</p><p class="src">Références : information professionnelle suisse de Soluvit® N, consultée le 15.10.2026 via AIPS ; <a href="https://www.espen.org/files/ESPEN-Guidelines/ESPEN_micronutrient_guideline.pdf" target="_blank" rel="noopener">ESPEN 2022, recommandation 16.4</a>.</p></template>
<template data-pop="e52-d-cernevit" data-title="Cernévit® : multivitamine de nutrition parentérale"><h3>Caractéristiques</h3><p>Cernévit® (Baxter) est une multivitamine de nutrition parentérale qui contient 46 mg de nicotinamide par flacon. L’information professionnelle date de juillet 2023.</p><h3>Limites du dossier</h3><p>Les autres rubriques de l’information professionnelle (posologie détaillée, contre-indications, effets indésirables) n’ont pas été retenues dans le dossier de recherche. Elles doivent être relues avant toute prescription.</p><p class="src">Références : information professionnelle suisse de Cernévit®, consultée le 15.10.2026 via AIPS.</p></template>
<template data-pop="e52-d-biotine" data-title="Biotine et interférence avec les immunodosages"><h3>Mécanisme de l’interférence</h3><p>Certains immunodosages utilisent la liaison streptavidine-biotine. Une biotine excédentaire dans l’échantillon peut fausser le résultat. L’information professionnelle de Bécozyme forte cite la TSH et la troponine.</p><h3>Conduite</h3><p>Signaler au laboratoire que le patient prend Bécozyme forte (0,15 mg de biotine par dragée) lorsqu’on dose ces paramètres. L’information professionnelle ne détaille pas ici le délai d’arrêt à respecter ; il se vérifie dans le texte complet.</p><p class="src">Références : information professionnelle suisse de Bécozyme® forte, consultée le 15.10.2026 via AIPS.</p></template>
<template data-pop="e52-d-dose-300" data-title="Atteindre 300 mg par jour de nicotinamide : une lacune documentée"><h3>Le calcul</h3><table class="t"><tr><th>Produit</th><th>Nicotinamide par unité</th><th>Unités pour 300 mg</th><th>Posologie autorisée</th></tr><tr><td>Bécozyme® forte</td><td>50 mg</td><td>6 dragées</td><td>2 à 3 dragées par jour</td></tr><tr><td>Soluvit® N</td><td>40 mg</td><td>7,5 ampoules</td><td>1 ampoule par jour</td></tr><tr><td>Cernévit®</td><td>46 mg</td><td>Environ 6,5 flacons</td><td>Non retenue dans le dossier</td></tr></table><h3>Ce que cela signifie</h3><p>Aucun produit suisse consulté ne permet d’atteindre 300 mg par jour dans sa posologie autorisée. Aucune monopréparation de nicotinamide ou d’acide nicotinique n’a été trouvée dans AmiKo (recherches sur nicotinamide, niacin, acide nicotinique et Nicobion : sans résultat). La préparation magistrale, l’importation et la liste des médicaments indisponibles ne sont pas documentées dans ce dossier.</p><h3>Conduite</h3><p>Le chapitre ne propose pas de contournement. Le prescripteur décide, après lecture complète de l’information professionnelle et, si besoin, avis pharmaceutique, de la voie d’obtention et de toute adaptation de posologie.</p><p class="src">Références : informations professionnelles suisses de Bécozyme forte, Soluvit N et Cernévit, consultées le 15.10.2026 via AIPS ; <a href="https://iris.who.int/server/api/core/bitstreams/aaf16966-83d9-4961-9fa4-68e6baea1780/content" target="_blank" rel="noopener">OMS 2000, page 15</a>.</p></template>
<template data-pop="pareto-e52-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="e52-0,e52-1,e52-2,e52-3,e52-4,e52-5,e52-6"></p><ul><li>La pellagre est la carence sévère en <button class="w" data-k="e52-niacine">niacine</button> ou en tryptophane. En pays riche, c’est une maladie du terrain : alcool, malabsorption, chirurgie bariatrique, anorexie mentale, isoniazide, syndrome carcinoïde, maladie de Hartnup.</li><li>Un équivalent niacine vaut 1 mg de niacine ou <button class="w" data-k="e52-tryptophane">60 mg de tryptophane</button>. Le déficit en <button class="w" data-k="e52-nad">NAD</button> atteint d’abord la peau, l’intestin et le cerveau.</li><li>Peau : dermatite symétrique, photodistribuée, nettement démarquée (<button class="w" data-k="e52-collier-casal">collier de Casal</button>) ; atteinte dans 98,6 % des cas rapportés. Bouche : langue rouge vif. Cerveau : dépression, delirium, hypertonie oppositionnelle, myoclonies.</li><li>La <button class="w" data-k="e52-3d">triade</button> est rarement complète : trois patients sur 16 dans une série alcoolique. L’absence d’éruption n’exclut pas le diagnostic chez l’alcoolique.</li></ul></template>
<template data-pop="pareto-e52-diag" data-title="Pareto — Diagnostic et gravité"><p class="ratio" data-cover="e52-7,e52-8"></p><ul><li>Le diagnostic est clinique : contexte à risque, dermatite typique, échantillon de sang conservé si possible, traitement d’épreuve, réponse rapide. Il n’existe pas d’étalon-or consensuel.</li><li>Devant une confusion de l’alcoolique, discuter Wernicke, sevrage et Marchiafava-Bignami, qui coexistent souvent avec la pellagre.</li><li>Urgence : ne pas se limiter à la <button class="w" data-k="e52-serdaru">thiamine</button> chez l’alcoolique encéphalopathe ; polyvitaminothérapie incluant la niacine.</li><li>Une éruption corticorésistante chez un patient dénutri doit faire discuter la pellagre ; ne pas utiliser des doses parentérales sans source primaire.</li></ul></template>
<template data-pop="pareto-e52-trait" data-title="Pareto — Traitement"><p class="ratio" data-cover="e52-9,e52-10"></p><ul><li>Nicotinamide 300 mg par jour en prises fractionnées pendant 3 à 4 semaines (<button class="w" data-k="e52-d-nicotinamide">OMS</button>), plus complexe de vitamines B ; voie orale ou entérale si le tube digestif fonctionne, parentérale en cas de malabsorption.</li><li>Réponse : bouche et diarrhée en quelques jours, peau et psychisme dès la première semaine, résolution complète en 27,4 jours en moyenne.</li><li>Traiter la cause : sevrage de l’<button class="w" data-k="e52-alcool">alcool</button>, arrêt ou substitution de l’<button class="w" data-k="e52-isoniazide">isoniazide</button>, prise en charge de la tumeur, multivitamines après chirurgie bariatrique.</li><li>Lacune : aucune <button class="w" data-k="e52-d-dose-300">monopréparation suisse</button> trouvée ; atteindre 300 mg par jour n’est pas documenté.</li></ul></template>
<template data-pop="pareto-e52-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="e52-11,e52-12,e52-13"></p><ul><li>Prévention : 15 à 20 mg de niacine par jour en population ; 18 à 40 mg pour 1500 kcal en nutrition entérale ; au moins 40 mg par jour en nutrition parentérale ; multivitamines à vie après chirurgie malabsorptive.</li><li>Une neuropathie qui persiste sous niacine impose de chercher un déficit en B1 ou en B12.</li><li>Critères formels : aucun critère consensuel validé ; diagnostic clinique appuyé par le contexte, la dermatite, un biomarqueur si disponible et la réponse au nicotinamide.</li><li>Épidémiologie suisse, mortalité actuelle et voie d’obtention de 300 mg par jour : lacunes assumées.</li></ul></template>
<template data-pop="pareto-e52-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="e52-e-1,e52-e-2,e52-e-3,e52-e-4"></p><ul><li>Pas d’étalon-or ; le <button class="w" data-k="e52-biomarqueurs">NAD sanguin</button> est la mesure recommandée du statut par l’ESPEN.</li><li>Urine : <button class="w" data-k="e52-seuils-oms">N1-méthylnicotinamide</button> inférieur à 0,5 mg/g de créatinine = déficient (OMS, provisoire) ; il reflète l’apport, non le diagnostic.</li><li>Le terrain dicte le bilan : macrocytose, zinc, B12, folates chez l’alcoolique ; 5-HIAA et tryptophane dans le syndrome carcinoïde, qui ne renseignent pas la niacine.</li><li>Imagerie, électroencéphalogramme et biopsie servent à exclure, non à confirmer ; le prélèvement précède la première dose si possible.</li></ul></template>
<template data-pop="pareto-e52-s-bioc" data-title="Pareto — Biochimie"><p class="ratio" data-cover="e52-s-bioc-body"></p><ul><li>Deux formes de niacine donnent un seul coenzyme, le NAD ; plus de 400 enzymes en dépendent.</li><li>Le tryptophane se convertit en niacine dans le foie par la voie de la kynurénine, avec B1, B2 et B6 ; 60 mg donnent environ 1 mg.</li><li>Carcinoïde : jusqu’à 99 % du tryptophane détourné ; Hartnup : absorption défaillante ; isoniazide : synthèse perturbée.</li></ul></template>
<template data-pop="pareto-e52-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="e52-s-physio-body"></p><ul><li>Niacine hydrosoluble, peu stockée : la prévention doit être quotidienne.</li><li>Maïs : niacine liée, libérée par traitement alcalin ; le lait protège par son tryptophane.</li><li>Acide nicotinique : flush dès 30 mg ; nicotinamide : pas de flush ; hépatotoxicité vers 3 g par jour.</li></ul></template>
<template data-pop="pareto-e52-s-peau" data-title="Pareto — Peau et histologie"><p class="ratio" data-cover="e52-s-peau-body"></p><ul><li>Le déficit en NAD empêche la réparation de l’ADN et la récupération des kératinocytes sous ultraviolets.</li><li>Distribution : zones exposées, symétrique, démarcation nette, collier de Casal.</li><li>Histologie non spécifique : la biopsie exclut, ne confirme pas.</li></ul></template>
<template data-pop="pareto-e52-s-neuro" data-title="Pareto — Neurobiologie"><p class="ratio" data-cover="e52-s-neuro-body"></p><ul><li>Chromatolyse neuronale diffuse, surtout pyramidale, souvent associée à Wernicke ou à Marchiafava-Bignami.</li><li>Cinq voies proposées, en partie expérimentales : kynurénine, ATP mitochondrial, PARP, axe BDNF–TrkB, facteurs génétiques.</li><li>Alcool : plusieurs mécanismes cumulés ; polyvitaminothérapie plutôt que thiamine seule.</li></ul></template>
<template data-pop="pareto-e52-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="e52-p-1,e52-p-2,e52-p-3,e52-p-4,e52-p-5"></p><ul><li>Nicotinamide en traitement ; complexe B pour les carences associées ; voie parentérale si malabsorption.</li><li>Produits suisses : Bécozyme forte 50 mg par dragée, Soluvit N 40 mg par ampoule, Cernévit 46 mg par flacon ; <button class="w" data-k="e52-d-dose-300">aucun ne permet 300 mg par jour</button> dans la posologie autorisée.</li><li>Biotine : prévenir le laboratoire ; B1 intraveineuse : perfusion lente ; isoniazide et rifampicine : absorption de la niacine inhibée.</li><li>À éviter : thiamine seule chez l’alcoolique, prise intermittente, acide nicotinique à dose thérapeutique, doses non sourcées.</li></ul></template>
