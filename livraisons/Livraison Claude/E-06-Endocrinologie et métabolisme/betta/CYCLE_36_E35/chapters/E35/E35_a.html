<section class="ilot" id="e35-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un étudiant de 20 ans, vivant en internat, arrive aux urgences avec une fièvre apparue le matin, des céphalées, des vomissements et des taches rouges qui ne s’effacent pas à la vitre. Sa pression artérielle est de 70/40 mmHg. Ces valeurs sont pédagogiques ; elles posent la question que le chapitre traite : quand une infection systémique menace aussi la glande surrénale, que faut-il donner en premier, et à qui faut-il aussi penser ?</p>
<p>La réponse tient en trois gestes simultanés. Le patient reçoit d’abord l’antibiotique de l’infection causale, car la <button class="w" data-k="e35-swf">méningococcie fulminante</button> évolue en heures. Il reçoit ensuite, sans attendre le laboratoire, de l’hydrocortisone par voie parentérale si une <button class="w" data-k="e35-crise">crise surrénalienne</button> est plausible, car le diagnostic de cette crise est clinique et son retard tue [ESE 2024]. Enfin, les contacts étroits sont identifiés et protégés, car l’infection se transmet par les sécrétions rhinopharyngées [OFSP 2025].</p>
<p>La catégorie <b>E35</b> décrit ce qu’une maladie infectieuse (ou, plus rarement, une autre maladie classée ailleurs) fait à une glande endocrine : la surrénale détruite par la tuberculose ou par une hémorragie bilatérale, la thyroïde envahie par le bacille tuberculeux. Le médecin doit donc penser à deux dossiers à la fois : l’agent infectieux et la glande lésée.</p>
<div class="key"><b>À retenir.</b> L’insuffisance surrénalienne d’origine infectieuse se traite comme une urgence endocrinienne et comme une maladie infectieuse. Aucun des deux traitements n’attend les résultats de l’autre.</div>
</section>
<section class="ilot" id="e35-1"><h2><span class="n">1</span>Définition et place dans la classification</h2>
<p>La catégorie E35 de la CIM-10-GM 2024 s’intitule « Anomalies endocriniennes au cours de maladies classées ailleurs » [OFS 2024]. Toutes ses subdivisions portent un astérisque (*) : E35.0* pour la glande thyroïde, E35.1* pour la glande surrénale et E35.8* pour les autres glandes endocrines [OFS 2024]. Le système dague-astérisque fonctionne comme suit : le code dague (†) classe la maladie par son <b>étiologie</b> et peut s’employer seul ; le code astérisque (*) désigne la <b>manifestation</b> d’organe et ne s’emploie jamais seul, seulement dans un double codage [BfArM]. Il en découle, par le <button class="w" data-k="e35-dague">double codage</button>, que E35 n’est pas une maladie autonome. C’est la manifestation endocrinienne d’une maladie dont l’étiologie est codée ailleurs, et le cours s’organise autour de ses entités nommées [BfArM 2024] :</p>
<ul><li>E35.0* inclut la tuberculose de la thyroïde, associée au code étiologique A18.8† ;</li><li>E35.1* inclut la maladie d’Addison tuberculeuse (A18.7†) et le syndrome de Waterhouse-Friderichsen méningococcique (A39.1†) ;</li><li>E35.8* ne porte, dans la version 2024, ni inclusion, ni exclusion, ni code dague : aucune entité n’y est désignée, et aucun exemple ne doit y être inventé.</li></ul>
<p>Trois définitions cliniques sont nécessaires. L’<button class="w" data-k="e35-is-def">insuffisance surrénalienne</button> est une sécrétion insuffisante de glucocorticoïdes et, selon le niveau de l’atteinte, de minéralocorticoïdes : elle est <b>primaire</b> si la cause siège dans le cortex surrénalien, <b>secondaire</b> si elle siège dans l’hypophyse (déficit en hormone adrénocorticotrope) et <b>tertiaire</b> si elle siège dans l’hypothalamus (déficit en hormone de libération de la corticotrophine) [Flück 2023 ; Husebye 2021]. La <button class="w" data-k="e35-crise">crise surrénalienne</button> est une urgence vitale à diagnostic clinique : hypotension ou choc hypovolémique, plus au moins un signe parmi nausées ou vomissements, fatigue sévère, fièvre et altération de la conscience [ESE 2024]. Le <button class="w" data-k="e35-swf">syndrome de Waterhouse-Friderichsen</button> est un état septique fulminant caractérisé par une hémorragie surrénalienne bilatérale et une dégradation clinique rapide ; il est classiquement méningococcique, mais des cas mortels surviennent avec d’autres agents [Waterhouse-Friderichsen, revue médico-légale ; Rijal]. Seul le syndrome méningococcique est explicitement rattaché à A39.1† et E35.1* [BfArM 2024]. Enfin, la <button class="w" data-k="e35-tb-thyro">tuberculose thyroïdienne</button> est une forme rare de tuberculose extrapulmonaire, primaire ou secondaire [Tuberculose thyroïdienne, série ; Cas de tuberculose thyroïdienne].</p>
<p>Sur la délimitation avec d’autres catégories, le raisonnement suivant est proposé, sans qu’aucune des sources lues ne le formule comme règle de codage : l’insuffisance surrénalienne auto-immune et les autres causes non infectieuses relèvent d’E27 ; les hypothyroïdies et thyroïdites relèvent d’E03 et des catégories voisines. E35 n’intervient que lorsqu’une maladie infectieuse classée ailleurs est la cause de l’atteinte glandulaire.</p>
<div class="trap"><span class="k">Piège</span> Un code astérisque ne se déclare jamais seul. Une insuffisance surrénalienne tuberculeuse se code par A18.7† (étiologie) avec E35.1* (manifestation) ; le seul E35.1* est une erreur de codage [BfArM].</div><p class="src">Références : CIM-10-GM 2024, libellés OFS (consulté via AIPS, 15.10.2026) ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-e20-e35.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc E20–E35 (BfArM)</a> ; <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">CIM-10-GM, structure dague-astérisque (BfArM)</a>, consultés le 15 octobre 2026.</p>
</section>
<section class="ilot" id="e35-2"><h2><span class="n">2</span>Fréquence</h2>
<p>L’insuffisance surrénalienne primaire de l’adulte est le plus souvent due à l’adrénalite auto-immune (maladie d’Addison), dont la prévalence européenne est d’environ 9 à 22 par 100 000 habitants, en hausse [Flück 2023]. Une revue (américaine, retenue ici uniquement pour une donnée historique) rapporte que l’adrénalite auto-immune représente 80 à 90 % des cas en Europe alors que la tuberculose en était la cause principale il y a un siècle [Murray]. Chez l’enfant, les causes congénitales dominent : l’hyperplasie congénitale des surrénales par déficit en 21-hydroxylase touche 6 à 11 enfants par 100 000 en Europe centrale et est dépistée en Suisse au test de Guthrie [Flück 2023].</p>
<p>Dans les <b>infections surrénaliennes</b>, la fréquence de l’insuffisance surrénalienne varie de 14 % à 100 % selon les populations et les critères [Wannachalee]. Aucune donnée suisse sur la tuberculose surrénalienne ou thyroïdienne n’a été trouvée ; en Suisse, la tuberculose atteint le poumon dans 94 % des cas (2020) ; les formes extrapulmonaires sont donc minoritaires, mais la part surrénalienne ou thyroïdienne n’est pas chiffrée [Guide suisse de la tuberculose]. La tuberculose thyroïdienne représente environ 0,1 à 0,4 % des maladies thyroïdiennes selon une série chinoise, estimation à manier avec prudence [Tuberculose thyroïdienne, série].</p>
<p>La <b>méningococcie invasive</b> en Suisse compte environ 48 cas par an en moyenne sur dix ans, soit une incidence de 0,6 pour 100 000 ; la létalité est de 5 à 15 %, 97 % des cas sont sporadiques et moins de 3 % sont des cas secondaires [OFSP 2025]. Le portage nasopharyngé atteint 10 à 15 % (5 à 30 %), avec un maximum chez les adolescents et jeunes adultes jusqu’à 25 ans [OFSP 2025]. L’hémorragie surrénalienne, toutes causes confondues, est trouvée dans 0,14 à 1,1 % des autopsies ; le traumatisme explique environ 80 % des cas, et le syndrome de Waterhouse-Friderichsen est associé à une mortalité de 55 à 60 % [Święch 2025].</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure que la tuberculose surrénalienne est la cause habituelle de la maladie d’Addison en Europe. Elle l’était il y a un siècle ; aujourd’hui la cause la plus fréquente est auto-immune, et l’origine infectieuse se recherche surtout chez le patient exposé ou immunodéprimé [Murray ; Flück 2023].</div><p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP 2025, contacts de méningococcie invasive (Bulletin de l’OFSP 4/2025)</a> ; <a href="https://doi.org/10.1111/cen.70222" target="_blank" rel="noopener">Wannachalee, infections surrénaliennes (Clin Endocrinol)</a> ; <a href="https://doi.org/10.1016/j.amjmed.2026.07.022" target="_blank" rel="noopener">Murray, infections des surrénales (Am J Med)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a> ; <a href="https://www.bag.admin.ch/dam/fr/sd-web/fPW7HAdyOiZ0/tuberkulose-handbuch.pdf" target="_blank" rel="noopener">Tuberculose en Suisse, guide OFSP/Ligue pulmonaire</a> ; <a href="https://doi.org/10.3389/fsurg.2026.1889766" target="_blank" rel="noopener">Tuberculose thyroïdienne et lymphadénite (Front Surg)</a>, consultés le 15 octobre 2026.</p>

<section class="ilot" id="e35-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>Le fonctionnement normal</h3>
<p>Le cortisol est régulé par la <button class="w" data-k="e35-axe">boucle hypothalamus – hypophyse – cortex</button> : l’hormone de libération de la corticotrophine stimule l’hormone adrénocorticotrope, qui stimule la sécrétion du cortisol, lequel freine à son tour les deux étages supérieurs [Flück 2023]. L’aldostérone obéit à une autre régulation : le système rénine-angiotensine et les concentrations de sodium et de potassium [Flück 2023]. Cette différence a une conséquence clinique : seule l’insuffisance surrénalienne <b>primaire</b> comporte un <button class="w" data-k="e35-minero">déficit minéralocorticoïde</button> avec hyponatrémie, hyperkaliémie et rénine élevée [Flück 2023]. Le cortex (origine mésodermique) et la médullaire (origine neuro-ectodermique) ont des origines distinctes ; en cas d’insuffisance surrénalienne, la fonction médullaire est en principe conservée [Flück 2023].</p>
<h3>Hémorragie : le syndrome de Waterhouse-Friderichsen</h3>
<p>La surrénale est irriguée par trois artères (surrénaliennes supérieure, moyenne et inférieure) qui se divisent en 50 à 60 petites branches formant un plexus sous-capsulaire, mais elle est drainée par <b>une seule veine</b> : c’est le <button class="w" data-k="e35-barrage">barrage vasculaire</button> [Święch 2025]. La paroi de cette veine est riche en cellules musculaires lisses longitudinales sensibles aux catécholamines. En situation de stress extrême, les catécholamines provoquent une vasoconstriction de cette veine, une augmentation de la résistance veineuse et une stase ; le plexus se congestionne, les artérioles subissent une nécrose ischémique puis saignent à la <button class="w" data-k="e35-hemorragie">reperfusion</button> ; les catécholamines favorisent en outre l’agrégation plaquettaire et la thrombose de la veine surrénalienne [Święch 2025]. Dans le syndrome de Waterhouse-Friderichsen, l’hémorragie bilatérale s’inscrit dans un tableau septique avec congestion multiviscérale, manifestations hémorragiques et lésions de coagulation intravasculaire disséminée plus ou moins marquées [Waterhouse-Friderichsen, revue médico-légale]. Le cortex est particulièrement exposé à la destruction lors d’une hémorragie à cause de ce plexus sous-capsulaire [Święch 2025].</p>
<h3>Tuberculose et autres infections</h3>
<p>La tuberculose et l’histoplasmose produisent une inflammation <button class="w" data-k="e35-granulome">granulomateuse</button>, une nécrose tissulaire puis la destruction de la glande, avec symptômes systémiques et déficit hormonal [Wannachalee]. À la phase tardive, les surrénales diminuent de taille et peuvent s’atrophier, surtout dans la tuberculose, souvent avec des calcifications persistantes [Wannachalee]. Le guide suisse ne décrit pas spécifiquement la voie de dissémination vers la surrénale ; elle n’est donc pas affirmée ici. Le virus de l’immunodéficience humaine s’accompagne d’une insuffisance surrénalienne primaire liée à des infections opportunistes (cytomégalovirus, tuberculose) [Zhai].</p>
<h3>Pourquoi la peau brunit</h3>
<p>Lorsque le cortisol baisse, le rétrocontrôle négatif disparaît et l’hormone adrénocorticotrope est produite en excès. Elle stimule parallèlement l’<button class="w" data-k="e35-msh">hormone mélanotrope</button> (MSH), ce qui provoque après un certain temps une coloration bronzée de la peau et des plis ; ce signe distingue l’insuffisance primaire de la secondaire, dans laquelle l’hormone adrénocorticotrope est basse [Flück 2023].</p>
<div class="key"><b>Physiopathologie → clinique.</b> Une destruction du cortex (tuberculose, hémorragie) abolit cortisol et aldostérone : d’où l’hypotension, l’hyponatrémie, l’hyperkaliémie, et l’hormone adrénocorticotrope élevée qui explique la pigmentation. Une atteinte hypophysaire épargne l’aldostérone et la peau.</div><p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://doi.org/10.1111/cen.70222" target="_blank" rel="noopener">Wannachalee, infections surrénaliennes (Clin Endocrinol)</a> ; <a href="https://doi.org/10.1007/s00414-026-03978-9" target="_blank" rel="noopener">Syndrome de Waterhouse-Friderichsen mortel à l’autopsie (Int J Legal Med)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a> ; <a href="https://doi.org/10.1186/s12879-025-12121-9" target="_blank" rel="noopener">Insuffisance surrénalienne et sida (BMC Infect Dis 25)</a>, consultés le 15 octobre 2026.</p>

<section class="ilot" id="e35-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Une insuffisance surrénalienne peut avoir de nombreuses causes ; le tableau suivant, tiré d’une revue pédiatrique suisse, place les causes infectieuses dans leur contexte [Flück 2023]. Les lignes <b>infection</b> et <b>traumatique, vasculaire</b> correspondent au champ d’E35.1*.</p><table class="t"><thead><tr><th>Étiologie</th><th>Insuffisance primaire</th><th>Insuffisance secondaire</th></tr></thead><tbody><tr><td>Génétique</td><td>Hyperplasie congénitale des surrénales, adrénoleucodystrophie</td><td>Variants de facteurs de transcription</td></tr><tr><td>Tumeurs</td><td>Adénome ou carcinome surrénalien, lymphome</td><td>Adénome hypophysaire, craniopharyngiome</td></tr><tr><td>Iatrogène</td><td>Surrénalectomie bilatérale</td><td>Chirurgie ou radiothérapie hypophysaire</td></tr><tr><td>Auto-immune</td><td>Adrénalite</td><td>Hypophysite</td></tr><tr><td><b>Infection</b></td><td><b>Tuberculose, virus de l’immunodéficience humaine</b></td><td>Tuberculose, virus de l’immunodéficience humaine</td></tr><tr><td><b>Traumatique, vasculaire</b></td><td><b>Coagulation intravasculaire disséminée (sepsis)</b></td><td>Traumatisme, hémorragie, anévrisme</td></tr><tr><td>Infiltration</td><td>Hémochromatose, histiocytose</td><td>Histiocytose, sarcoïdose, hémochromatose</td></tr><tr><td>Médicaments</td><td>Inhibiteurs enzymatiques (fluconazole), inhibiteurs de points de contrôle</td><td>Inhibiteurs de points de contrôle</td></tr></tbody></table>
<p>Le tableau montre que l’infection n’est qu’une ligne parmi huit grandes familles de causes ; elle garde son importance clinique par la gravité de ses deux formes, aiguë (hémorragie) et chronique (destruction granulomateuse).</p>
<p>Parmi les infections surrénaliennes, <i>Mycobacterium tuberculosis</i> et <i>Histoplasma capsulatum</i> sont les agents les plus fréquents ; des bactéries, le cytomégalovirus et le virus SARS-CoV-2 ont aussi été rapportés [Wannachalee]. Le paludisme grave à <i>Plasmodium falciparum</i> est décrit comme atteignant la surrénale [Murray] ; le code étiologique de ces infections n’est pas listé sous E35 dans la classification (lacune de codage). Les <b>autres causes d’hémorragie surrénalienne</b>, à ne pas confondre avec E35, sont le traumatisme (environ 80 %), les anticoagulants, les antiagrégants, les anti-inflammatoires non stéroïdiens, le syndrome des antiphospholipides, le lupus, la thrombopénie induite par l’héparine, la grossesse et le post-partum, les tumeurs (phéochromocytome, corticosurrénalome, métastases) et la pancréatite aiguë [Święch 2025 ; Syndrome des antiphospholipides, cohorte ; Falhammar 2022].</p>
<p>Les <b>facteurs de risque</b> de l’atteinte infectieuse sont l’exposition à la tuberculose, l’immunodépression, en particulier l’infection par le virus de l’immunodéficience humaine [Zhai], et, pour le méningocoque, l’âge (adolescents et jeunes adultes) et les situations de vie en collectivité (internat, caserne, prison) [OFSP 2025].</p>

<section class="ilot" id="e35-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse recherche d’abord les circonstances infectieuses (contact tuberculeux, séjour en zone d’endémie, vie en collectivité, immunodépression) puis les symptômes, qui sont non spécifiques ; le diagnostic d’insuffisance surrénalienne est donc souvent retardé [Flück 2023 ; Husebye 2021]. Un retard supérieur à six mois est rapporté chez la moitié des patients, et 50 à 75 % se présentent d’emblée en crise (donnée issue d’une revue américaine, à usage descriptif) [Murray].</p>
<p>Les <button class="w" data-k="e35-chronique">symptômes de l’insuffisance chronique</button>, non spécifiques, sont la fatigue profonde, la perte de poids involontaire, l’anorexie, la baisse de concentration et de performance, les douleurs musculaires et abdominales, l’hypotension orthostatique et, en cas d’atteinte primaire, l’<button class="w" data-k="e35-sel">appétit pour le sel</button> et l’<button class="w" data-k="e35-pigment">hyperpigmentation</button> [Husebye 2021 ; Flück 2023]. Chez l’enfant s’ajoutent l’anémie, un teint anormalement brun, des lignes cutanées brunes et des cicatrices pigmentées [Flück 2023].</p>
<p>Les symptômes de la <button class="w" data-k="e35-crise-clin">crise surrénalienne</button> sont les nausées, les vomissements, les douleurs abdominales, le collapsus, l’hypoglycémie, les troubles électrolytiques et la déshydratation, la fièvre, les troubles de la vigilance et des rythmes cardiaques [Flück 2023]. Elle survient chez environ la moitié des patients atteints d’insuffisance surrénalienne après le diagnostic [Husebye 2021] ; les enfants y sont exposés lors d’infections sévères ou de gastro-entérites [Flück 2023].</p>
<div class="two"><div class="card"><h4>Forme typique : tuberculose surrénalienne</h4><p>Exemple fictif : un patient immunodéprimé ou issu d’une zone d’endémie perd du poids depuis plusieurs mois, se fatigue, a des douleurs abdominales et une pression basse debout. La peau des plis et des cicatrices est plus foncée. Le tableau est chronique et peut aboutir à une crise lors d’une infection intercurrente [Wannachalee].</p></div><div class="card"><h4>Formes trompeuses</h4><p>Une découverte fortuite à l’imagerie, sans symptôme ; une crise inaugurale ; une douleur lombaire prise pour une radiculalgie en cas d’hémorragie surrénalienne [Wannachalee ; Święch 2025]. Dans le syndrome de Waterhouse-Friderichsen, le début est aigu : choc, purpura pétéchial, douleur abdominale, céphalées, vomissements [Rijal].</p></div></div>
<p>Pour la <b>méningococcie invasive</b>, les symptômes précoces à enseigner aux contacts sont la fièvre, les frissons, les céphalées, les pétéchies et une éruption ; des signes digestifs atypiques sont possibles et l’incubation est de trois à quatre jours en général (2 à 10 jours) [OFSP 2025]. Pour la <b>tuberculose thyroïdienne</b>, le motif est une tuméfaction cervicale ou un nodule suspect à l’échographie ; le diagnostic est souvent posé sur la pièce opératoire [Tuberculose thyroïdienne, série ; Cas de tuberculose thyroïdienne ; Cas de néoplasme folliculaire apparent]. Une hypothyroïdie est possible mais exceptionnelle (cas pédiatrique) [Gaur].</p>
<div class="trap"><span class="k">Piège</span> L’hémorragie surrénalienne se manifeste souvent par une douleur lombaire ou du flanc que l’on rapporte à tort à une douleur radiculaire ; une chute d’hémoglobine d’au moins 1,5 g/dL accompagne le tableau [Święch 2025].</div><div class="quiz ui"><p>Un patient de 30 ans sous traitement antituberculeux depuis deux semaines présente une fatigue, une hypotension orthostatique et une peau plus foncée dans les plis. Quel élément de l’anamnèse oriente vers une insuffisance <b>primaire</b> ?</p><button data-ok="0">A. Une céphalée matinale.</button><button data-ok="1">B. Un appétit pour le sel et une hyperpigmentation.</button><button data-ok="0">C. Une hypoglycémie isolée.</button><p class="fb" hidden>Réponse B. L’appétit pour le sel et l’hyperpigmentation sont des signes de l’insuffisance primaire : la perte de l’aldostérone et l’excès d’hormone adrénocorticotrope, et donc de l’hormone mélanotrope, n’existent que dans cette forme [Husebye 2021 ; Flück 2023].</p></div><p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://www.bag.admin.ch/dam/de/sd-web/nEBReGtQYlpu/6_2025%20BAG%20Bull_DE_postexpositionsproph%20Meningo.pdf" target="_blank" rel="noopener">OFSP 2025, contacts de méningococcie invasive (Bulletin de l’OFSP 4/2025)</a> ; <a href="https://doi.org/10.1111/cen.70222" target="_blank" rel="noopener">Wannachalee, infections surrénaliennes (Clin Endocrinol)</a> ; <a href="https://doi.org/10.1016/j.amjmed.2026.07.022" target="_blank" rel="noopener">Murray, infections des surrénales (Am J Med)</a> ; <a href="https://doi.org/10.1016/bs.vh.2023.06.001" target="_blank" rel="noopener">Rijal, syndrome de Waterhouse-Friderichsen (Vitam Horm 124)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a> ; <a href="https://doi.org/10.3389/fsurg.2026.1889766" target="_blank" rel="noopener">Tuberculose thyroïdienne et lymphadénite (Front Surg)</a> ; <a href="https://doi.org/10.2147/IMCRJ.S553344" target="_blank" rel="noopener">Tuberculose thyroïdienne prise pour un carcinome papillaire (Int Med Case Rep J 18)</a> ; <a href="https://doi.org/10.7759/cureus.100321" target="_blank" rel="noopener">Tuberculose thyroïdienne et néoplasme folliculaire (Cureus 17)</a> ; <a href="https://doi.org/10.1016/j.diagmicrobio.2026.117408" target="_blank" rel="noopener">Tuberculose thyroïdienne de l’enfant (Diagn Microbiol Infect Dis 115)</a>, consultés le 15 octobre 2026.</p>

<section class="ilot" id="e35-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, peau, abdomen, cou.</p>
<ul><li><b>État général et vigilance</b> : fatigue sévère, altération de la conscience, fièvre ; ces éléments font partie de la définition de la crise [ESE 2024].</li>
<li><b><button class="w" data-k="e35-vitaux">Signes vitaux</button></b> : hypotension ou choc hypovolémique, hypotension orthostatique dans la forme chronique [ESE 2024 ; Husebye 2021].</li>
<li><b>Peau</b> : <button class="w" data-k="e35-pigment">hyperpigmentation</button> des plis et des cicatrices dans l’insuffisance primaire ; <b>purpura pétéchial</b> dans le syndrome de Waterhouse-Friderichsen [Flück 2023 ; Rijal].</li>
<li><b>Abdomen et flanc</b> : douleur abdominale, lombaire ou du flanc, nausées et vomissements [Święch 2025].</li>
<li><b>Cou</b> : tuméfaction ou nodule thyroïdien dans la tuberculose thyroïdienne, parfois associé à des adénopathies tuberculeuses [Tuberculose thyroïdienne, série ; Cas de tuberculose thyroïdienne].</li></ul>
<p>La signification de ces signes dépend de la cause. Une hypotension avec fièvre, vomissements et trouble de la conscience définit la crise ; elle ne permet pas à elle seule de distinguer un choc septique d’un choc par insuffisance surrénalienne, et les deux peuvent coexister. L’examen guide donc l’urgence ; il ne remplace ni l’hydrocortisone, ni l’antibiotique.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Chercher l’hyperpigmentation chez un patient en insuffisance secondaire ou dans un syndrome de Waterhouse-Friderichsen aigu : la pigmentation exige un excès prolongé d’hormone adrénocorticotrope et manque dans les formes aiguës et secondaires [Flück 2023].</div><div class="key"><b>À retenir.</b> Dans le doute, devant une hypotension fébrile avec vomissements chez un patient suspect d’insuffisance surrénalienne, le traitement précède la preuve [ESE 2024].</div><p class="src">Références : <a href="https://www.rosenfluh.ch/media/paediatrie/2023/03/Nebenniereninsuffizienz.pdf" target="_blank" rel="noopener">Flück 2023, insuffisance surrénalienne (Pädiatrie, Berne)</a> ; <a href="https://academic.oup.com/ejendo/article/190/5/G25/7663654" target="_blank" rel="noopener">ESE/Endocrine Society 2024, Eur J Endocrinol 190(5)</a> ; <a href="https://doi.org/10.1016/bs.vh.2023.06.001" target="_blank" rel="noopener">Rijal, syndrome de Waterhouse-Friderichsen (Vitam Horm 124)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12590362/" target="_blank" rel="noopener">Święch, hémorragie surrénalienne (Wideochir Inne Tech Maloinwazyjne 20)</a> ; <a href="https://doi.org/10.1016/S0140-6736(21)00136-7" target="_blank" rel="noopener">Husebye, insuffisance surrénalienne (Lancet 397)</a> ; <a href="https://doi.org/10.3389/fsurg.2026.1889766" target="_blank" rel="noopener">Tuberculose thyroïdienne et lymphadénite (Front Surg)</a> ; <a href="https://doi.org/10.2147/IMCRJ.S553344" target="_blank" rel="noopener">Tuberculose thyroïdienne prise pour un carcinome papillaire (Int Med Case Rep J 18)</a>, consultés le 15 octobre 2026.</p>
