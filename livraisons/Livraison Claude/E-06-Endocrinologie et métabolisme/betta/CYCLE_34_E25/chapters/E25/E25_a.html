<template id="ch-E25"><div class="chap"><div class="chap-head"><div class="code">E 25 · Endocrinologie et métabolisme · Surrénales</div><h1>Anomalies génito-surrénaliennes (hyperplasie congénitale des surrénales)</h1><span class="status">Cycle 34 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des anomalies génito-surrénaliennes</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#e25-0">Question clinique</a></li><li><a href="#e25-1">Définition et classifications</a></li><li><a href="#e25-2">Épidémiologie</a></li><li><a href="#e25-3">Physiopathologie</a></li><li><a href="#e25-4">Étiologies et facteurs de risque</a></li><li><a href="#e25-5">Anamnèse</a></li><li><a href="#e25-6">Examen clinique</a></li><li><a href="#e25-7">Démarche diagnostique</a></li><li><a href="#e25-8">Urgences et complications</a></li><li><a href="#e25-9">Prise en charge</a></li><li><a href="#e25-10">Suivi, pronostic et prévention</a></li><li><a href="#e25-11">Situations particulières</a></li><li><a href="#e25-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="e25-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Une même maladie génétique se présente de cinq façons très différentes selon l’âge et le sexe. Dans ces <b>vignettes fictives</b>, aucune ne ressemble à la précédente, et pourtant la cause est la même : un bloc dans la fabrication du cortisol par les surrénales. Le cours apprend à reconnaître ce fil commun, à confirmer le diagnostic et à traiter en Suisse.</p>
<table class="t"><thead><tr><th>Situation (fictive)</th><th>Âge</th><th>Question posée</th></tr></thead><tbody>
<tr><td>Dépistage néonatal positif pour la 17-hydroxyprogestérone</td><td>Premiers jours</td><td>Faut-il confirmer et traiter, et à quelle vitesse ?</td></tr>
<tr><td>Nouveau-né 46,XX aux organes génitaux externes virilisés</td><td>Naissance</td><td>Quelle est la cause la plus fréquente à exclure en premier ?</td></tr>
<tr><td>Nourrisson en état de choc avec hyponatrémie et hyperkaliémie</td><td>10 jours à 3 semaines</td><td>Comment reconnaître et traiter la crise de perte de sel ?</td></tr>
<tr><td>Enfant avec pubarche précoce, croissance accélérée et âge osseux avancé</td><td>Enfance</td><td>Quand penser à une forme non classique ?</td></tr>
<tr><td>Jeune femme avec hirsutisme et cycles espacés « de type SOPK »</td><td>Adolescence ou âge adulte</td><td>Comment ne pas manquer une forme non classique ?</td></tr></tbody></table>
<p>À la fin de la leçon, le lecteur sait nommer le <button class="w" data-k="e25-nosologie">code et le libellé exacts (CIM-10-GM 2024)</button>, expliquer pourquoi le blocage d’une enzyme produit à la fois un manque et un excès d’hormones, poser les <button class="w" data-k="e25-depistage">indications du dépistage et de la confirmation</button>, déclencher le <button class="w" data-k="e25-crise">traitement d’urgence</button> et choisir le traitement d’entretien à partir des informations professionnelles suisses.</p>
<div class="key"><b>À retenir.</b> Dans cette leçon, « HCS » désigne l’<button class="w" data-k="e25-hcs">hyperplasie congénitale des surrénales (définition)</button>, et 21OHD le déficit en 21-hydroxylase, cause de 90 à 99 % des cas. Le même défaut enzymatique explique les cinq situations.</div>
</section>

<section class="ilot" id="e25-1"><h2><span class="n">1</span>Définition et classifications</h2>
<p>La catégorie <b>E25 Anomalies génito-surrénaliennes</b> de la classification suisse (CIM-10-GM 2024, Office fédéral de la statistique) regroupe des syndromes d’excès d’androgènes d’origine surrénalienne. Elle comprend l’<b>E25.0</b>, anomalies liées à un déficit enzymatique congénital, dont les sous-codes <b>E25.00</b> (déficit en 21-hydroxylase, forme classique) et <b>E25.01</b> (forme tardive) ; l’<b>E25.08</b> (autres déficits enzymatiques) ; l’<b>E25.8</b> (autres anomalies) et l’<b>E25.9</b> (sans précision). La version de l’Organisation mondiale de la santé précise que la catégorie couvre aussi des syndromes <b>acquis</b>. Les <button class="w" data-k="e25-nosologie">libellés complets et leurs inclusions (nosologie)</button> sont rassemblés dans une fenêtre.</p>
<p>Le cœur clinique de la catégorie est l’<button class="w" data-k="e25-hcs">hyperplasie congénitale des surrénales (HCS)</button>. Il s’agit d’un groupe de maladies <b>autosomiques récessives</b> de la fabrication du cortisol. Quand une enzyme nécessaire au cortisol fonctionne mal, la glande reçoit un signal de stimulation chronique, grossit, et les molécules situées en amont du blocage s’accumulent. La forme la plus fréquente est le déficit en 21-hydroxylase, dû à des mutations du gène <b>CYP21A2</b>.</p>
<p>Le tableau suivant classe le déficit en 21-hydroxylase selon l’activité enzymatique résiduelle. Cette activité détermine la gravité, le moment du diagnostic et le traitement. Le lecteur le lit de gauche à droite : plus l’activité résiduelle est basse, plus le déficit hormonal est profond et plus la présentation est précoce.</p>
<table class="t"><thead><tr><th>Forme</th><th>Activité résiduelle</th><th>Cortisol et aldostérone</th><th>Présentation habituelle</th></tr></thead><tbody>
<tr><td><button class="w" data-k="e25-formes">Classique avec perte de sel (détails)</button></td><td>Nulle ou minime</td><td>Tous deux déficitaires</td><td>Crise de perte de sel mortelle chez le nourrisson non traité</td></tr>
<tr><td><button class="w" data-k="e25-formes">Classique virilisante simple (détails)</button></td><td>Environ 1 à 5 %</td><td>Cortisol déficitaire ; pas de crise de perte de sel par définition</td><td>Virilisation ; diagnostic plus tardif chez le garçon et la fille peu virilisée</td></tr>
<tr><td><button class="w" data-k="e25-formes">Non classique ou tardive (détails)</button></td><td>Environ 20 à 50 %</td><td>Habituellement normaux au repos</td><td>Hyperandrogénie de l’enfant, de l’adolescente ou de l’adulte</td></tr></tbody></table>
<p>Le génotype prédit bien le phénotype. Les <button class="w" data-k="e25-genotype">groupes génotypiques 0, A, B et C (de l’allèle nul à l’allèle léger)</button> relient chaque type de variant à une forme clinique. Le phénotype suit en pratique l’allèle le moins sévère, parce que l’enzyme produite par cet allèle assure la fonction restante ; cette règle est déduite des groupes et doit être formulée avec prudence.</p>
<div class="trap"><span class="k">Piège de nosologie</span> Les sous-codes E25.00 et E25.01 ne concernent que le déficit en 21-hydroxylase. Un déficit en 11β-hydroxylase ou en 3β-hydroxystéroïde déshydrogénase relève de l’<b>E25.08</b>. Les formes acquises ne figurent pas dans les sous-codes enzymatiques : le <button class="w" data-k="e25-acquis">statut des formes acquises (lacune documentaire)</button> est expliqué à part.</div>
<button class="pareto-btn ui" data-k="pareto-e25-definition">▲ Loi de Pareto — Définition et classifications</button>
</section>

<section class="ilot" id="e25-2"><h2><span class="n">2</span>Épidémiologie</h2>
<p>La forme classique touche environ <b>1 nouveau-né sur 14 000 à 18 000</b> selon les programmes de dépistage (Suède : 1 sur 14 260). Pour la Suisse, le programme national de dépistage néonatal annonce environ <b>1 nouveau-né sur 9000</b> pour le syndrome adrénogénital, parmi quelque 87 000 naissances par an. Ce chiffre est tiré d’un document destiné aux parents ; il illustre un ordre de grandeur, pas une mesure épidémiologique publiée. Les <button class="w" data-k="e25-incidence">données suisses et leur niveau de preuve (incidence)</button> sont discutées dans une fenêtre.</p>
<p>Une <button class="w" data-k="e25-dsd">étude suisse de 2000 à 2019 (différences du développement sexuel)</button> a recensé les enfants pris en charge dans dix hôpitaux pédiatriques et huit cabinets : <b>1 fille sur 7500</b> présente une HCS de caryotype 46,XX, et l’excès d’androgènes explique <b>84 %</b> des différences du développement sexuel 46,XX. Cette prévalence est comparable à celle du dépistage, ce qui suggère un recensement presque complet.</p>
<p>La forme non classique est beaucoup plus fréquente : environ <b>1 sur 200</b> dans la population caucasienne, mais elle est rarement détectée par le dépistage néonatal. Une méta-analyse trouve <b>4,2 %</b> (intervalle de confiance à 95 % : 3,2 à 5,4) de formes non classiques chez les femmes qui consultent pour hyperandrogénie. La plupart des cas, surtout masculins, ne sont jamais diagnostiqués, parce que l’homme consulte rarement pour une hyperandrogénie légère.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Confondre fréquence de la maladie et fréquence du diagnostic. La forme non classique est la plus fréquente par le nombre de porteurs de deux allèles atteints, mais la forme classique est celle que le dépistage trouve.</div>
</section>

<section class="ilot" id="e25-3"><h2><span class="n">3</span>Physiopathologie : du normal au pathologique</h2>
<p><b>Le normal.</b> Le cortex surrénalien produit trois familles d’hormones : les glucocorticoïdes (cortisol), les minéralocorticoïdes (aldostérone) et les androgènes. La sécrétion de cortisol est régulée surtout par l’<button class="w" data-k="e25-axe">ACTH (axe hypothalamo-hypophyso-surrénalien et rétrocontrôle)</button> : quand le cortisol monte, il freine l’hypophyse, et la production d’ACTH baisse. L’enzyme <button class="w" data-k="e25-cyp21">21-hydroxylase (CYP21A2, rôle et gène)</button> transforme la progestérone en 11-désoxycorticostérone (précurseur de l’aldostérone, dans la zone glomérulée) et, surtout, la <b>17-hydroxyprogestérone en 11-désoxycortisol</b> (précurseur du cortisol).</p>
<p><b>Le blocage.</b> Quand la 21-hydroxylase manque, le cortisol ne peut plus être fabriqué en quantité suffisante. Le rétrocontrôle négatif disparaît, l’hypophyse sécrète davantage d’ACTH, la surrénale s’hypertrophie, et les précurseurs en amont du bloc (surtout la 17-hydroxyprogestérone) s’accumulent. Ils sont alors détournés vers la voie des <b>androgènes surrénaliens</b>. La dihydrotestostérone peut aussi naître d’une <button class="w" data-k="e25-backdoor">voie alternative (« backdoor »)</button> qui contourne les intermédiaires classiques.</p>
<figure><svg viewBox="0 0 420 262" role="img" aria-label="Figure 1 — Bloc en 21-hydroxylase" font-size="12"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="8" y="14" width="124" height="34" rx="5"/><rect x="8" y="104" width="124" height="34" rx="5"/><rect x="288" y="14" width="124" height="34" rx="5"/><rect x="288" y="104" width="124" height="34" rx="5"/><rect x="148" y="52" width="124" height="48" rx="5" stroke-dasharray="5 3"/><path d="M132 31h156m-6-4l6 4-6 4"/><path d="M132 121h156m-6-4l6 4-6 4"/><rect x="148" y="176" width="124" height="34" rx="5"/><path d="M70 138v38h78m-6-4l6 4-6 4"/><path d="M272 193h70v-30m-4 6l4-6 4 6"/><rect x="288" y="150" width="124" height="14" rx="3" stroke="none"/><rect x="288" y="176" width="124" height="34" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="70" y="35">Progestérone</text><text x="70" y="125">17-OH-progestérone</text><text x="350" y="35">11-désoxycorticostérone</text><text x="350" y="125">11-désoxycortisol</text><text x="210" y="73">CYP21A2</text><text x="210" y="89">(activité réduite)</text><text x="210" y="197">Androgènes surrénaliens</text><text x="350" y="193">Excès → virilisation</text><text x="350" y="67">→ aldostérone ↓</text><text x="350" y="157">→ cortisol ↓</text><text x="350" y="240">ACTH ↑ par perte du rétrocontrôle</text></g></svg><figcaption>Figure 1 — Bloc en 21-hydroxylase. Schéma didactique : le blocage fait baisser le cortisol et l’aldostérone, accumule la 17-hydroxyprogestérone et dérive les précurseurs vers les androgènes ; l’ACTH, non freinée, entretient la stimulation.</figcaption></figure>
<p><b>Les manifestations.</b> Trois conséquences découlent du schéma. Premièrement, le manque d’aldostérone fait perdre du sodium et de l’eau par le rein : la pression artérielle chute, le potassium s’accumule et peut provoquer des arythmies ; c’est la <button class="w" data-k="e25-perte-sel">perte de sel (mécanisme)</button>, avec rénine élevée, hyponatrémie, hyperkaliémie, acidose et choc. Deuxièmement, l’excès d’androgènes virilise le fœtus de caryotype 46,XX avant la naissance. Troisièmement, après la naissance, les androgènes accélèrent la croissance et la maturation du squelette : la <button class="w" data-k="e25-croissance">taille adulte finale (accélération osseuse)</button> est réduite d’environ 7 cm (1,03 écart-type) sous la taille cible parentale chez l’adulte atteint de forme classique.</p>
<div class="key"><b>À retenir.</b> Le manque en aval (cortisol, aldostérone) et l’excès en amont (17-hydroxyprogestérone, androgènes) découlent d’un seul événement. Le traitement répare le manque et, en freinant l’ACTH, réduit l’excès.</div>
<button class="pareto-btn ui" data-k="pareto-e25-physio">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="e25-4"><h2><span class="n">4</span>Étiologies et facteurs de risque</h2>
<p>La cause est génétique. Le déficit en 21-hydroxylase est dû à des mutations de <b>CYP21A2</b>, localisé en 6p21.3 dans la région HLA de classe III, tout près d’un pseudogène non fonctionnel (<b>CYP21A1P</b>). La plupart des mutations proviennent de <b>conversions géniques</b> : un fragment du pseudogène est copié dans le gène actif. Environ 65 à 75 % des patients sont hétérozygotes composites, c’est-à-dire porteurs de deux variants différents. Le <button class="w" data-k="e25-cyp21">détail du locus et du pseudogène</button> est repris dans l’onglet sciences.</p>
<p>Les autres déficits enzymatiques regroupés sous l’E25.08 sont plus rares. Le tableau les situe en deux colonnes : la molécule touchée et le signe qui les distingue du déficit en 21-hydroxylase.</p>
<table class="t"><thead><tr><th>Déficit (gène)</th><th>Signe distinctif retenu dans les sources</th></tr></thead><tbody>
<tr><td><button class="w" data-k="e25-11bohd">11β-hydroxylase (CYP11B1)</button></td><td>Virilisation féminine et <b>hypertension</b> (excès de désoxycorticostérone) ; 17-hydroxyprogestérone parfois élevée chez le nouveau-né ; 5 à 8 % des HCS</td></tr>
<tr><td><button class="w" data-k="e25-autres-deficits">3β-hydroxystéroïde déshydrogénase de type 2 (HSD3B2)</button></td><td>Rapport 17-OH-prégnénolone sur 17-hydroxyprogestérone supérieur à 8 écarts-types ; anomalies génitales dans les deux sexes</td></tr>
<tr><td><button class="w" data-k="e25-autres-deficits">17α-hydroxylase (CYP17A1)</button></td><td>Rare ; phénotype féminin chez le 46,XY et infantilisme sexuel</td></tr>
<tr><td><button class="w" data-k="e25-autres-deficits">Cytochrome P450 oxydoréductase (POR)</button></td><td>Électrolytes et minéralocorticoïdes normaux ; mauvaise réponse à l’ACTH ; anomalies génitales et squelettiques variables</td></tr>
<tr><td><button class="w" data-k="e25-autres-deficits">StAR (HCS lipoïde) et CYP11A1</button></td><td>Production stéroïdienne presque nulle ; fœtus 46,XY de phénotype féminin ; surrénales très volumineuses dans l’HCS lipoïde</td></tr></tbody></table>
<p>Il n’existe pas, dans les sources lues, de facteur de risque environnemental de l’HCS. Le risque de transmission dépend de la génétique : la maladie est autosomique récessive, et les allèles classiques peuvent être transmis par un parent atteint d’une forme non classique, ce qui motive le conseil génétique. Les <button class="w" data-k="e25-acquis">formes acquises de l’E25 (tumeurs virilisantes)</button> constituent une lacune documentaire de cette leçon.</p>
<button class="pareto-btn ui" data-k="pareto-e25-causes">▲ Loi de Pareto — Étiologies</button>
</section>

<section class="ilot" id="e25-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord ce qui peut menacer la vie : l’âge du patient, le résultat du dépistage néonatal, les antécédents familiaux d’HCS et un éventuel traitement glucocorticoïde en cours. Il caractérise ensuite le tableau selon l’âge. Les cartes suivantes séparent les présentations précoces, graves, des présentations tardives, discrètes.</p>
<div class="two"><div class="card"><h4>Nouveau-né et nourrisson</h4><p><b>Fille 46,XX :</b> organes génitaux externes virilisés dès la naissance. L’HCS est la première cause d’organes génitaux atypiques chez le nouveau-né 46,XX. Le <button class="w" data-k="e25-ambigu">examen des organes génitaux atypiques (démarche)</button> précède toute annonce du sexe.</p><p><b>Garçon :</b> organes génitaux normaux. Sans dépistage, la <button class="w" data-k="e25-crise-j">crise de perte de sel survient le plus souvent entre 10 jours et 3 semaines de vie (chronologie)</button>.</p></div><div class="card"><h4>Enfant, adolescent et adulte</h4><p><b>Enfant :</b> pubarche précoce, croissance accélérée et <button class="w" data-k="e25-pubarche">âge osseux avancé (forme non classique)</button>. Une puberté précoce centrale peut compliquer un contrôle prolongé insuffisant.</p><p><b>Adolescente et adulte :</b> hirsutisme, acné, oligo-ovulation, problèmes de fertilité, tableau dit de type SOPK ; voir la <button class="w" data-k="e25-nc-clin">présentation non classique (symptômes)</button>. L’homme consulte rarement.</p></div></div>
<p>Pour l’adulte classique, l’anamnèse recueille aussi les symptômes de surdosage des glucocorticoïdes (prise de poids, fatigue) et de sous-dosage, ainsi que l’observance des <button class="w" data-k="e25-stress">règles de stress (adaptation de la dose pendant une maladie)</button>. Chez l’homme, on s’informe des douleurs ou gonflements testiculaires : les <button class="w" data-k="e25-tart">tumeurs surrénaliennes testiculaires (TART)</button> concernent 14 à 86 % des hommes selon les séries.</p>
<div class="trap"><span class="k">Piège</span> Chez le garçon, un nouveau-né « normal » à l’inspection n’exclut pas une forme classique avec perte de sel : les organes génitaux ne signalent le diagnostic que chez la fille. Sans dépistage, le garçon se présente en état de choc.</div>
</section>

<section class="ilot" id="e25-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, mesures de croissance, puis signes ciblés. Il vise deux choses : repérer l’instabilité hémodynamique, et rechercher les signes d’androgènes en excès ou de glucocorticoïdes en excès.</p>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p>Chez un nourrisson, une pression artérielle basse, une déshydratation et un état de choc évoquent la perte de sel ; l’examen s’accompagne immédiatement d’un bilan sanguin (<button class="w" data-k="e25-crise">crise : critères et traitement</button>). Chez un enfant avec <b>hypertension</b>, grande taille et âge osseux très avancé, le déficit en <button class="w" data-k="e25-11bohd">11β-hydroxylase</button> devient une hypothèse.</p></div><div class="card"><h4>Croissance et anthropométrie</h4><p>La courbe de taille et de poids documente l’accélération de croissance. Chez l’enfant traité, une <b>prise de poids excessive</b> ou un <b>ralentissement de la croissance</b> signale un surdosage en glucocorticoïdes selon l’information professionnelle d’Alkindi.</p></div></div>
<div class="two"><div class="card"><h4>Organes génitaux et pilosité</h4><p>Chez le nouveau-né, on décrit la virilisation des organes génitaux externes ; son stade se note avec le <button class="w" data-k="e25-prader">score de Prader (lacune de cette leçon)</button>. Plus tard, on cherche pubarche précoce, hirsutisme, acné, trouble du cycle.</p></div><div class="card"><h4>Testicules et articulations</h4><p>On palpe les testicules chez l’homme classique (<button class="w" data-k="e25-tart">TART : souvent bilatérales</button>) ; l’échographie scrotale les détecte. Une hypermobilité articulaire, des subluxations ou des hernies évoquent le syndrome <button class="w" data-k="e25-cah-x">CAH-X (délétion contiguë de TNXB)</button>.</p></div></div>
<div class="key"><b>À retenir.</b> Quatre gestes suffisent à orienter : tension et état d’hydratation, courbe de croissance, aspect des organes génitaux externes et palpation testiculaire. Les trois premiers se pratiquent en consultation de routine.</div>
<button class="pareto-btn ui" data-k="pareto-e25-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
