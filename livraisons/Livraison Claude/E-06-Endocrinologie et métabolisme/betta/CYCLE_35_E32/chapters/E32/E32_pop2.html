<template data-pop="e32-irm-cs" data-title="IRM à déplacement chimique du thymus">

<div class="lab">Principe</div><p>Elle compare le signal du thymus en phase et en opposition de phase. Une chute de signal en opposition de phase traduit de la graisse microscopique intercalée, présente dans le thymus normal et l’hyperplasie, absente d’un tissu cancéreux, y compris après chimiothérapie (Priola et coll., 2014 ; Inaoka et coll., 2007 ; Priola et coll., 2016).</p>
<div class="lab">Valeurs</div>
<table class="t"><tr><th>Étude</th><th>Hyperplasie</th><th>Tumeur</th><th>Seuil</th></tr><tr><td>Inaoka, 2007, 41 patients</td><td>Rapport 0,614 ± 0,130</td><td>Rapport 1,026 ± 0,039</td><td>p &lt; 0,001 ; chute chez tous les hyperplasiques, chez aucune tumeur</td></tr><tr><td>Priola, 2014, 92 adultes</td><td>Indice 46,3 % ± 18,4</td><td>Indice –0,06 % ± 4,9</td><td>Indice 8,92 % ; rapport 0,849</td></tr></table>
<div class="lab">Limites</div><p>Séquences non utilisables chez le jeune selon les recommandations néerlandaises (NVALT, 2024, imagerie) ; rapport chevauchant chez l’adulte jeune (Priola et coll., 2014) ; la diffusion peut aider en cas d’absence de chute de signal (Priola et coll., 2015). Résumés seuls lus pour Inaoka et Priola.</p>
</template>
<template data-pop="e32-indices" data-title="Rapport de déplacement chimique et indice d’intensité de signal">

<p>Le <b>rapport de déplacement chimique</b> compare le signal du thymus à celui du muscle paravertébral ; l’<b>indice d’intensité de signal</b> exprime la variation relative du signal du thymus entre les deux séquences. Dans la série de Priola, l’indice a un seuil de 8,92 % (sensibilité et spécificité de 100 %) et le rapport un seuil de 0,849 (sensibilité de 100 %, spécificité de 96,7 %) ; le rapport est chevauchant chez l’adulte jeune (Priola et coll., 2014).</p>
</template>
<template data-pop="e32-scanner" data-title="Scanner thoracique">

<p>Examen de première intention devant une suspicion de tumeur épithéliale thymique (avec contraste) selon les recommandations néerlandaises ; dans l’hyperplasie vraie et folliculaire, il montre un contour lisse, une densité homogène, sans invasion ni adénopathie (Porubsky, 2025 ; NVALT, 2024, imagerie). Une lésion hypométabolique de moins de 10 UH est un kyste simple (NVALT, 2024, imagerie).</p>
</template>
<template data-pop="e32-tep" data-title="TEP-TDM et fluorodésoxyglucose">

<p>Pas de TEP-TDM systématique dans la suspicion de tumeur épithéliale thymique (NVALT, 2024, imagerie). À la découverte fortuite, un thymus triangulaire homogène actif correspond à un thymus normal du sujet jeune ou à une hyperplasie ; une lésion focale solide est suspecte (NVALT, 2024, imagerie). Piège : l’hyperplasie de rebond peut capter intensément le fluorodésoxyglucose et simuler une récidive ; l’IRM a évité des gestes invasifs (Priola et Priola, 2014). Série pédiatrique : captation augmentée chez 4 patients sur 6 avec rebond (Chen et coll., 2016).</p>
</template>
<template data-pop="e32-nvalt" data-title="Recommandations néerlandaises sur les tumeurs épithéliales thymiques">

<p>Les recommandations néerlandaises (NVALT), publiées le 8 novembre 2024, portent sur les tumeurs épithéliales thymiques de l’adulte et sont nationales, non suisses. Les modules lus (imagerie, biologie, biopsie) fondent les statuts d’examens du chapitre (NVALT, 2024, imagerie ; NVALT, 2024, biologie ; NVALT, 2024, biopsie). Les modules biologie et biopsie reposent sur un avis d’experts sans étude incluse.</p>
</template>
<template data-pop="e32-biopsie" data-title="Biopsie du thymus">

<p>Pas de biopsie d’une tumeur résécable ; biopsie histologique (par exemple guidée par scanner) si non résécable ; résécabilité discutée en colloque multidisciplinaire (recommandation forte) (NVALT, 2024, biopsie). Hyperplasie folliculaire : erreur d’échantillonnage possible (Porubsky, 2025). Kyste : ponction non diagnostique dans 73 % des cas, risque infectieux (Cooley-Rieders et Van Haren, 2022).</p>
</template>
<template data-pop="e32-euronet" data-title="Essai EuroNet-PHL-C1 : rebond ou rechute">

<div class="lab">Population</div><p>291 enfants atteints de lymphome de Hodgkin, dont des patients du CHUV ; 133 ont présenté une masse thymique nouvelle ou croissante (Franke et coll., 2023).</p>
<div class="lab">Résultat</div><p>Aucun signe thymique isolé ne différencie rebond et rechute ; 33 rechutes sur 34 s’accompagnaient d’autres masses en croissance, et 64 rebonds sur 64 étaient une croissance thymique isolée (Franke et coll., 2023).</p>
<div class="lab">Conséquence</div><p>Si une repousse lymphomateuse ailleurs est exclue, une masse thymique isolée est probablement un rebond (Franke et coll., 2023). Source : résumé seul lu.</p>
</template>
<template data-pop="e32-biologie" data-title="Anticorps anti-récepteur de l’acétylcholine et bilan biologique">

<p>Dans la suspicion de tumeur épithéliale thymique, les anticorps anti-récepteur de l’acétylcholine sont dosés chez tous les patients ; on envisage les immunoglobulines G totales avec sous-classes et les sous-populations CD4/CD8 (infections récidivantes) et les réticulocytes (anémie) (NVALT, 2024, biologie). Avis d’experts néerlandais.</p>
</template>
<template data-pop="e32-sources-guides" data-title="Hiérarchie des sources et lacunes suisses">

<p>Aucune recommandation suisse (société suisse d’endocrinologie, Swiss Medical Forum) n’a été trouvée pour l’hyperplasie thymique. Les recommandations lues sont néerlandaises (NVALT 2024), donc européennes mais non suisses. Les données de la littérature internationale sont descriptives ; les sources américaines, japonaises, taïwanaises ou chinoises ne fondent aucune conduite (Porubsky, 2025 ; NVALT, 2024, imagerie). Les recommandations ESMO de 2015 sur les tumeurs épithéliales thymiques n’ont pas pu être lues et ne sont pas utilisées. L’information professionnelle suisse du Néo-Mercazole fonde les données médicamenteuses (information professionnelle suisse du Néo-Mercazole).</p>
</template>
<template data-pop="e32-mnemo" data-title="Moyen mnémotechnique : contexte, graisse, ailleurs">

<p><b>Aide pédagogique, non critère officiel.</b> Trois mots résument la démarche : le <b>contexte</b> (chimiothérapie, Basedow, myasthénie) oriente vers une hyperplasie ; la <b>graisse</b> microscopique, mise en évidence par l’IRM à déplacement chimique, la confirme ; il faut chercher la rechute <b>ailleurs</b> avant d’accuser le thymus.</p>
</template>
<template data-pop="e32-chirurgie" data-title="Chirurgie des maladies du thymus">

<p>Kyste symptomatique : résection, thoracoscopie préférée, complications de 1,1 % à 6,5 % (Cooley-Rieders et Van Haren, 2022). Hyperplasie vraie symptomatique ou douteuse : exérèse, sans suivi après exérèse complète (Porubsky, 2025). Hyperplasie massive : exérèse pour histologie et décompression (Linegar et coll., 1993). Abcès rompu : résection complète (Nah et coll., 2008). Thymectomie dans la myasthénie : proposée, idéalement précoce, pour l’hyperplasie folliculaire ; indications précises non lues (Porubsky, 2025).</p>
</template>
<template data-pop="e32-colloque" data-title="Colloque multidisciplinaire">

<p>La résécabilité d’une tumeur épithéliale thymique se discute en colloque multidisciplinaire expérimenté, avant toute biopsie (NVALT, 2024, imagerie ; NVALT, 2024, biopsie).</p>
</template>
<template data-pop="e32-carbimazole" data-title="Carbimazole (Néo-Mercazole 5 mg) — monographie">

<div class="lab">Mécanisme</div><p>Le mécanisme n’a pas été repris dans le dossier de recherche ; il n’est pas exposé ici.</p>
<div class="lab">Preuves</div><p>Dans le Basedow avec thymus élargi, la régression du thymus sous antithyroïdien est décrite par des cas et des revues ; aucun essai n’a été lu (Dalla Costa et coll., 2014 ; Pla Peris et coll., 2023).</p>
<div class="lab">Posologie (information professionnelle suisse)</div><p>Adulte : 20 à 60 mg par jour en 2 à 3 prises jusqu’à l’euthyroïdie, puis paliers de 5 à 15 mg par jour tous les 10 jours jusqu’à 5 à 20 mg par jour. Enfant : 0,7 à 0,8 mg/kg par jour, maximum 30 mg (information professionnelle suisse du Néo-Mercazole).</p>
<div class="lab">Contre-indication et effets indésirables</div><p>Insuffisance hépatique sévère (Child-Pugh C). Agranulocytose et aplasie, hépatotoxicité (information professionnelle suisse du Néo-Mercazole).</p>
<div class="lab">Surveillance</div><p>Formule sanguine avant traitement, puis chaque semaine pendant 6 semaines chez les plus de 40 ans, surtout au-delà de 40 mg par jour (information professionnelle suisse du Néo-Mercazole).</p>
</template>
<template data-pop="e32-agranulocytose" data-title="Agranulocytose sous antithyroïdien">

<div class="lab">Définition</div><p>Chute des granulocytes, pouvant s’accompagner d’une aplasie, survenant en quelques heures à quelques jours sous carbimazole (information professionnelle suisse du Néo-Mercazole).</p>
<div class="lab">Signes d’alerte</div><p>Fièvre, angine, aphtes, saignements (information professionnelle suisse du Néo-Mercazole).</p>
<div class="lab">Conduite</div><p>Arrêt du traitement et formule sanguine immédiate (information professionnelle suisse du Néo-Mercazole). Le dossier ne donne pas de prise en charge hospitalière détaillée.</p>
</template>
<template data-pop="e32-grossesse-atd" data-title="Antithyroïdiens pendant la grossesse et l’allaitement">

<p>Selon l’information professionnelle suisse du carbimazole : pendant la grossesse, le propylthiouracile est préféré au premier trimestre, puis le carbimazole est repris ; l’allaitement est admis jusqu’à 20 mg par jour (information professionnelle suisse du Néo-Mercazole). Le dossier ne contient pas de recommandation de société savante sur ce point.</p>
</template>
<template data-pop="e32-antibio" data-title="Antibiothérapie de l’abcès thymique">

<p>L’abcès thymique n’a que des cas isolés : ceftriaxone dans un cas pédiatrique, résection complète dans un abcès rompu à la plèvre (Vyas et coll., 2011 ; Nah et coll., 2008). Les agents documentés sont <i>Staphylococcus aureus</i> sensible ou résistant à la méticilline (Atlas et DeLaet, 2012 ; Rubinstien et Slavin, 1993). Aucun protocole antibiotique, aucune durée, aucune dose n’est documenté dans le dossier . Le choix de l’antibiotique et sa durée restent à décider cas par cas : le dossier ne fournit aucune règle.</p>
</template>
<template data-pop="pareto-e32-bases" data-title="Pareto — Définitions, épidémiologie, physiopathologie">
<p class="ratio" data-cover="e32-0,e32-1,e32-2,e32-3"></p><ul><li>Quatre hyperplasies : vraie, rebond, folliculaire, lymphoépithéliale ; seule la folliculaire et la lymphoépithéliale ont un lien auto-immun.</li><li>Le poids du thymus se juge selon l’âge : 32,1 g au maximum entre 11 et 16 ans, 10,5 g après 66 ans.</li><li>Rebond chez 44 % à 67,7 % des lymphomes pédiatriques ; aucune incidence suisse.</li><li>Le thymus de Basedow est le plus souvent une hyperplasie (4 cancers sur 107 cas publiés).</li></ul></template>
<template data-pop="pareto-e32-clinique" data-title="Pareto — Causes, anamnèse, examen">
<p class="ratio" data-cover="e32-4,e32-5,e32-6"></p><ul><li>Le contexte (chimiothérapie, Basedow, myasthénie) oriente avant l’imagerie.</li><li>L’élargissement est le plus souvent asymptomatique ; compression ou fièvre font penser au kyste ou à l’abcès.</li><li>L’examen cherche hyperthyroïdie, fatigabilité musculaire, compression et adénopathies.</li></ul></template>
<template data-pop="pareto-e32-diag" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="e32-7,e32-8"></p><ul><li>Quatre temps : contexte, imagerie, biologie, histologie seulement si doute.</li><li>Après lymphome, on cherche la rechute ailleurs : 33 rechutes sur 34 avaient d’autres masses, 64 rebonds sur 64 étaient isolés.</li><li>Urgences : hémorragie, compression, abcès à Staphylococcus aureus.</li></ul></template>
<template data-pop="pareto-e32-prise" data-title="Pareto — Prise en charge, suivi et critères">
<p class="ratio" data-cover="e32-9,e32-10,e32-11,e32-12"></p><ul><li>Rebond : suivre la maladie déclenchante, pas de chirurgie.</li><li>Basedow : traiter la thyroïde, recontrôler en euthyroïdie ; indice d’intensité de signal supérieur à 8,92 % oriente vers l’hyperplasie.</li><li>Kyste symptomatique : thoracoscopie ; tumeur résécable : pas de biopsie.</li><li>Aucune recommandation suisse ; lacunes déclarées.</li></ul></template>
<template data-pop="pareto-e32-exam" data-title="Pareto — Examens">
<p class="ratio" data-cover="e32-e-1,e32-e-2,e32-e-3,e32-e-4,e32-e-5"></p><ul><li>Scanner d’abord, IRM à déplacement chimique ensuite, TEP-TDM non systématique.</li><li>Anticorps anti-récepteur de l’acétylcholine chez tous les patients suspects de tumeur épithéliale.</li><li>Pas de biopsie d’une tumeur résécable.</li></ul></template>
<template data-pop="pareto-e32-s-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="e32-s-anat-body"></p><ul><li>Troisième poche pharyngienne, sixième semaine ; tissu ectopique de l’os hyoïde au diaphragme.</li></ul></template>
<template data-pop="pareto-e32-s-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="e32-s-histo-body"></p><ul><li>Architecture normale conservée : hyperplasie ; follicules à centres germinatifs : folliculaire ; prolifération clonale : lymphome.</li></ul></template>
<template data-pop="pareto-e32-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="e32-s-physio-body"></p><ul><li>Involution graisseuse puis repousse après stress ; la graisse microscopique est la signature d’imagerie.</li></ul></template>
<template data-pop="pareto-e32-s-immuno" data-title="Pareto — Immunologie">
<p class="ratio" data-cover="e32-s-immuno-body"></p><ul><li>Hyperplasie folliculaire et myasthénie ; polyclonal contre clonal ; 33 % d’auto-immunité et 14 % de lymphome dans la forme lymphoépithéliale.</li></ul></template>
<template data-pop="pareto-e32-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="e32-p-1,e32-p-2,e32-p-3,e32-p-4"></p><ul><li>Aucun médicament ne traite l’hyperplasie ; carbimazole pour le Basedow, antibiotique pour l’abcès.</li><li>Carbimazole : 20 à 60 mg par jour puis 5 à 20 mg par jour ; agranulocytose = arrêt et formule sanguine.</li></ul></template>
