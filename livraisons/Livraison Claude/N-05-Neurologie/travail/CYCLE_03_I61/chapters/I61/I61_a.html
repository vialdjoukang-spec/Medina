<template id="ch-I61"><div class="chap"><div class="chap-head"><div class="code">I61 · CIM-10-GM 2024 · Neurologie</div><h1>Hémorragie intracérébrale</h1><span class="status">Sources consultées le 14 octobre 2026 · Revue par intelligence artificielle ; aucune validation médicale humaine revendiquée · Audit différé après le Cycle 30.</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie</button></div><div class="panel" id="pA"><nav class="toc ui"><ol><li><a href="#i61-a01">Question clinique et priorités</a></li><li><a href="#i61-a02">Définition, terminologie et classification</a></li><li><a href="#i61-a03">Épidémiologie et pronostic</a></li><li><a href="#i61-a04">Physiopathologie : de la rupture à la lésion secondaire</a></li><li><a href="#i61-a05">Topographie et formes cliniques</a></li><li><a href="#i61-a06">Étiologies et facteurs de risque</a></li><li><a href="#i61-a07">Diagnostics différentiels hiérarchisés</a></li><li><a href="#i61-a08">Anamnèse et examen clinique</a></li><li><a href="#i61-a09">Prise en charge aiguë : A, B, C, D</a></li><li><a href="#i61-a10">Complications, surveillance, pronostic et prévention secondaire</a></li><li><a href="#i61-a11">Situations particulières</a></li><li><a href="#i61-a12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i61-a01"><h2><span class="n">1</span> Question clinique et priorités</h2><h3 id="i61-a01-partie-1">1.1 Cas fil rouge</h3><p>Une femme de 78 ans, traitée par apixaban 5 mg deux fois par jour pour une fibrillation atriale, est vue par son mari à 07 h 40 s’affaisser sur le côté gauche, avec une faiblesse brutale et une parole pâteuse. Cette présentation correspond aux situations de départ « parésie, paralysie » et « déficits neurologiques aigus » (correspondance pédagogique avec le catalogue PROFILES, non officielle). À l’arrivée, à 08 h 15, la pression artérielle est de 198/104 mmHg et l’échelle de Glasgow (<button class="w" data-k="i61-gcs">GCS (calcul et lecture)</button>) indique 14 sur 15. La dernière prise d’apixaban remonte à 22 h la veille, soit un peu plus de dix heures.</p><p>Ce récit pose quatre questions de sécurité avant toute autre réflexion : quel anticoagulant et quand la dernière prise, à quelle heure les symptômes ont-ils débuté, quelle est la pression artérielle, et que montre l’imagerie cérébrale ? Une faiblesse brutale d’un hémicorps évoque d’abord un infarctus, mais rien au lit du malade ne le distingue de façon fiable d’une hémorragie : seule l’imagerie tranche. Si la patiente reçoit à tort un traitement de reperfusion alors qu’elle saigne, l’hémorragie s’aggrave ; si on lui administre à tort un antidote alors qu’elle a un infarctus, on ajoute un risque thrombotique. Le diagnostic précis précède donc toute décision de traitement.</p><h3 id="i61-a01-partie-2">1.2 Objectifs</h3><p>Le lecteur doit savoir, à la fin de ce cours, reconnaître une hémorragie intracérébrale (<button class="w" data-k="i61-hic">HIC (définition)</button>), la quantifier, en chercher la cause, puis conduire les quatre gestes initiaux du protocole bernois : inverser l’anticoagulation, abaisser la pression artérielle, contacter la neurochirurgie et poursuivre le bilan étiologique. Il doit aussi connaître la prévention secondaire, qui change selon la cause.</p><h3 id="i61-a01-partie-3">1.3 Prérequis cliquables</h3><p>L’échelle de Glasgow (<button class="w" data-k="i61-gcs">GCS : composantes</button>) mesure la vigilance par l’ouverture des yeux, la réponse verbale et la réponse motrice. Le score <button class="w" data-k="i61-nihss">NIHSS (échelle de gravité)</button> quantifie le déficit neurologique focal ; il est limité lorsque la conscience est altérée. Les <button class="w" data-k="i61-territoires">territoires vasculaires (renvoi au cours I63)</button> décrivent les régions cérébrales irriguées par une artère ; ils sont détaillés dans le cours consacré à l’infarctus cérébral (I63).</p><p>Pour les situations de départ, la patiente combine une hémiparésie (perte partielle de force d’un côté) et une dysarthrie (trouble de l’articulation de la parole). Le cours revient à cette patiente à la fin de l’onglet « Pathologie », avec les décisions chiffrées.</p><div class="key"><p><b>À retenir.</b> Une faiblesse brutale ne se classe pas au lit du malade : l’imagerie cérébrale immédiate distingue hémorragie et infarctus. Quatre informations commandent la conduite : anticoagulant et heure de la dernière prise, heure de début, pression artérielle, imagerie. Les gestes initiaux se résument à A (inverser l’anticoagulation), B (abaisser la pression), C (neurochirurgie) et D (diagnostic étiologique).</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (Forum Médical Suisse 2021;21:322–328)</a>.</p><button class="pareto-btn ui" data-k="pareto-i61-a01">▲ Loi de Pareto — Question clinique et priorités</button></section><section class="ilot" id="i61-a02"><h2><span class="n">2</span> Définition, terminologie et classification</h2><h3 id="i61-a02-partie-1">2.1 Définition</h3><p>L’hémorragie intracérébrale (HIC) désigne un saignement dans le parenchyme cérébral (cerveau, tronc cérébral, cervelet) et/ou dans les ventricules. L’hémorragie intracrânienne est un ensemble plus large : elle englobe en plus l’hémorragie sous-arachnoïdienne (<button class="w" data-k="i61-hsa">HSA (cours I60)</button>), l’hématome sous-dural et l’hématome extradural. Une proposition terminologique de 2026 distingue en outre l’hémorragie intraventriculaire isolée, confinée aux ventricules, de l’extension intraventriculaire d’un hématome parenchymateux. Elle évite de confondre un saignement ventriculaire primitif avec la simple extension d’un hématome parenchymateux.</p><p>Le terme « HIC primaire » est déconseillé. Il décourage la recherche d’une cause alors que 80 à 85 % des hémorragies relèvent d’une maladie des petits vaisseaux (artériopathie des artères perforantes profondes, dite hypertensive, ou angiopathie amyloïde cérébrale) et que le reste tient à une cause macrovasculaire (malformation artério-veineuse, cavernome, anévrisme, thrombose veineuse) ou tumorale. Les malformations vasculaires restent la première cause chez le jeune adulte, jusqu’à un tiers des cas.</p><h3 id="i61-a02-partie-2">2.2 Classification par localisation</h3><p>La localisation oriente la cause et la conduite. Le tableau ci-dessous associe chaque siège au terme usuel, à la rubrique de la classification statistique suisse (CIM-10-GM 2024) et à la cause la plus probable. Sa lecture commence par la ligne « profonde » : c’est la plus fréquente, et chez le jeune adulte une malformation vasculaire reste la première cause à chercher.</p><table class="t"><thead><tr><th>Siège</th><th>Terme et rubrique CIM-10-GM</th><th>Cause la plus probable</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Noyaux gris, capsule interne</td><td>Hémorragie profonde (I61.0, sous-corticale)</td><td>Artériopathie des perforantes liée à l’hypertension</td><td>Environ deux tiers des cas ; pas d’indication chirurgicale de routine pour les noyaux gris</td></tr><tr><td>Cortex et substance blanche sous-corticale</td><td>Hémorragie lobaire ou superficielle (I61.1, corticale)</td><td>Angiopathie amyloïde et artériosclérose</td><td>Imagerie IRM de susceptibilité et critères de Boston</td></tr><tr><td>Cervelet</td><td>Hémorragie cérébelleuse (I61.4)</td><td>Cause à rechercher comme pour les autres sièges</td><td>5 à 10 % des cas ; risque de compression du tronc et d’hydrocéphalie</td></tr><tr><td>Tronc cérébral</td><td>Hémorragie du tronc (I61.3)</td><td>Classé parmi les hémorragies profondes, donc artériopathie des perforantes plus probable</td><td>Signes d’hypertension intracrânienne et compression à surveiller</td></tr><tr><td>Ventricules</td><td>Hémorragie intraventriculaire (I61.5)</td><td>Extension d’un hématome ou saignement isolé</td><td>Hydrocéphalie par obstruction de l’aqueduc</td></tr></tbody></table><p>Le tableau doit se lire du siège vers la cause, jamais l’inverse. Une erreur fréquente consiste à attribuer d’emblée tout hématome profond à l’hypertension ; il faut d’abord avoir écarté une cause macrovasculaire par l’angiographie lorsque le contexte s’y prête. Chez notre patiente, l’hématome profond du putamen droit, la pression élevée et l’âge rendent l’artériopathie des perforantes très probable. Les <button class="w" data-k="i61-sous-codes">sous-codes CIM-10-GM (neuf rubriques et règles)</button> détaillent les neuf rubriques I61.0 à I61.9 et les règles de codage (cause, séquelles, traumatisme).</p><h3 id="i61-a02-partie-3">2.3 Règles de codage</h3><p>Selon la classification suisse, la cause de l’hémorragie se précise par un code supplémentaire (dissection I67.0, anévrisme ou fistule artério-veineuse acquis I67.1, malformation congénitale Q28.0 à Q28.3). Les séquelles observées un an ou plus après le début relèvent de I69.1. Une hémorragie traumatique se code S06, et une hémorragie sous-arachnoïdienne I60. L’hypertension se code en plus si elle est présente.</p><div class="key"><p><b>À retenir.</b> L’hémorragie intracérébrale englobe le saignement du parenchyme et des ventricules ; l’hémorragie intracrânienne y ajoute l’hémorragie sous-arachnoïdienne et les hématomes sous-dural et extradural. Le terme « primaire » est abandonné pour que la cause reste toujours recherchée : 80 à 85 % des cas relèvent des petits vaisseaux. Le siège oriente la cause : profond vers l’hypertension, lobaire vers l’angiopathie amyloïde, lobaire chez le jeune vers une malformation.</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12952859/" target="_blank" rel="noopener" data-reference-source="1">Pensato et coll. — Classification anatomique standardisée des hémorragies intracrâniennes (Cerebrovasc Dis 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la statistique — CIM-10-GM 2024, version française (31 octobre 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a>.</p><button class="pareto-btn ui" data-k="pareto-i61-a02">▲ Loi de Pareto — Définition, terminologie et classification</button></section><section class="ilot" id="i61-a03"><h2><span class="n">3</span> Épidémiologie et pronostic</h2><h3 id="i61-a03-partie-1">3.1 Données suisses</h3><p>À Genève, entre 2018 et 2019, l’incidence annuelle standardisée sur la population européenne du premier AVC atteignait 127,0 pour 100 000 habitants. L’hémorragie intracérébrale en représentait 13,2 pour 100 000 (intervalle de confiance à 95 % : 10,9 à 15,5), l’infarctus 107,3 et l’hémorragie sous-arachnoïdienne 6,0. La létalité à 30 jours était de 32,5 % pour l’HIC, contre 17,2 % pour l’hémorragie sous-arachnoïdienne et 10,8 % pour l’infarctus. L’hémorragie est donc environ huit fois moins fréquente que l’infarctus, mais trois fois plus mortelle au premier mois.</p><p>Le registre suisse des AVC (<button class="w" data-k="i61-ssr">registre suisse SSR : profil et devenir</button>) a inclus 2650 hémorragies entre 2014 et 2019. L’âge moyen était de 72 ans, avec 46,5 % de femmes ; le NIHSS médian valait 8 et le score de Glasgow médian 15 ; le délai médian entre le début et l’admission était de 3,8 heures ; 77,4 % des patients étaient traités dans un centre AVC.</p><h3 id="i61-a03-partie-2">3.2 Pronostic à trois mois</h3><p>Dans ce registre, 39,1 % des 2250 patients dont l’évolution était connue étaient indépendants à trois mois (score de Rankin modifié de 0 à 2), soit 33,2 % de la cohorte entière, et 25,1 % étaient décédés. Quinze pour cent des scores manquaient, plutôt chez les patients les moins graves : l’indépendance est donc probablement sous-estimée. L’hémorragie sous antithrombotique a le pronostic le plus sombre (mortalité plus élevée, rapport de cotes ajusté 1,62 ; indépendance 22,8 %). À trois mois, 2,1 % des patients avaient fait une récidive d’hémorragie et 2,3 % un infarctus ; la récidive hémorragique prédomine seulement en cas d’angiopathie amyloïde (rapport de cotes ajusté 3,38).</p><h3 id="i61-a03-partie-3">3.3 Anticoagulation préalable</h3><p>Dans les registres suisse et norvégien réunis (11 349 hémorragies, 2013 à 2019), 23,7 % des patients prenaient un anticoagulant au moment du saignement. La part des antagonistes de la vitamine K a baissé de 18,3 % à 7,6 %, celle des anticoagulants oraux directs a monté de 3,0 % à 18,0 %. Les deux classes sont associées à une moins bonne évolution fonctionnelle (rapport de cotes ajusté 0,64 pour chacune). Cette évolution rend la réversion des anticoagulants oraux directs aussi importante que celle des antagonistes de la vitamine K.</p><h3 id="i61-a03-partie-4">3.4 Europe et monde</h3><p>Les études de population européennes (1980 à 2008) donnent une incidence poolée de 24,6 pour 100 000 personnes-années, qui croît fortement avec l’âge, et une létalité médiane à un mois de 40,4 % sans baisse dans le temps. À l’échelle mondiale, on estime 3,41 millions de cas et 2,89 millions de décès par an (données 2021). Ces chiffres plus anciens s’interprètent après les données suisses.</p><table class="t"><thead><tr><th>Indicateur</th><th>Valeur</th><th>Population et source</th></tr></thead><tbody><tr><td>Incidence de l’HIC</td><td>13,2 / 100 000 par an</td><td>Genève 2018–2019, premier AVC</td></tr><tr><td>Létalité à 30 jours</td><td>32,5 %</td><td>Genève, HIC (contre 10,8 % pour l’infarctus)</td></tr><tr><td>Indépendance à 3 mois (Rankin 0–2)</td><td>39,1 % des patients évalués</td><td>Registre suisse, 2250 patients</td></tr><tr><td>Décès à 3 mois</td><td>25,1 %</td><td>Registre suisse</td></tr><tr><td>Anticoagulation préalable</td><td>23,7 % (médiane)</td><td>Registres suisse et norvégien, 2013–2019</td></tr></tbody></table><p>Ce tableau se lit de haut en bas comme une trajectoire : la maladie est rare, grave au premier mois, puis laisse un patient sur trois indépendant. Une erreur fréquente consiste à confondre la létalité à 30 jours de Genève (32,5 %) avec la mortalité à 3 mois du registre (25,1 %) : les deux populations, les périodes et les définitions diffèrent.</p><div class="key"><p><b>À retenir.</b> À Genève, l’HIC représente 13,2 cas pour 100 000 par an avec une létalité à 30 jours de 32,5 %. À trois mois, 39,1 % des patients évalués sont indépendants et 25,1 % sont décédés dans le registre suisse. Près d’un patient sur quatre prend un anticoagulant au moment du saignement, et la part des anticoagulants oraux directs augmente.</p></div><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/39965170/" target="_blank" rel="noopener" data-reference-source="1">Dirren et coll. — Étude genevoise de l’AVC : incidence et létalité selon la CIM-11 (Neurology 2025;104:e213353)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38336370/" target="_blank" rel="noopener" data-reference-source="1">Hémorragie intracérébrale sous anticoagulants oraux, registres suisse et norvégien (Stroke Vasc Neurol 2024)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20056489/" target="_blank" rel="noopener" data-reference-source="1">van Asch et coll. — Incidence, létalité et évolution fonctionnelle de l’hémorragie intracérébrale (Lancet Neurol 2010;9:167–176)</a>.</p><button class="pareto-btn ui" data-k="pareto-i61-a03">▲ Loi de Pareto — Épidémiologie et pronostic</button></section><section class="ilot" id="i61-a04"><h2><span class="n">4</span> Physiopathologie : de la rupture à la lésion secondaire</h2><h3 id="i61-a04-partie-1">4.1 De l’artère perforante à la rupture</h3><p>Le cerveau profond reçoit son sang par de fines artères perforantes, nées des gros troncs artériels et qui pénètrent dans le parenchyme (voir les <button class="w" data-k="i61-perforantes">artères perforantes (anatomie)</button>). Dans l’artériopathie des perforantes, la paroi subit une lipohyalinose et une nécrose fibrinoïde, et des microanévrysmes dits de Charcot-Bouchard se forment, notamment sur des branches lenticulo-striées artérioscléreuses du putamen. Le rôle exact de ces microanévrysmes dans la rupture reste débattu : l’hypertension semble dégénérer la paroi, mais le mécanisme précis n’est pas établi.</p><p>Dans l’angiopathie amyloïde cérébrale (<button class="w" data-k="i61-aac">AAC (histologie et clinique)</button>), l’amyloïde remplace les cellules musculaires lisses de la média des artères corticales et leptoméningées. La paroi devient fragile, d’où l’aspect histologique de « lumière dans la lumière ». Cette atteinte siège dans le cortex, ce qui explique le siège lobaire des hémorragies de cette maladie.</p><h3 id="i61-a04-partie-2">4.2 Croissance de l’hématome</h3><p>Un hématome continue souvent de grossir après le saignement initial. Les essais définissent la croissance par une augmentation relative supérieure à 33 % ou absolue supérieure à 6 ml du volume sur l’imagerie réalisée 24 ± 12 heures plus tard (<button class="w" data-k="i61-croissance">croissance : définition et mesure</button>). Elle survient surtout dans les trois premières heures. L’anticoagulation, l’antiagrégation plaquettaire, le volume initial et un délai court entre le début des symptômes et l’imagerie la prédisent. Le « spot sign », ou fuite de produit de contraste dans l’hématome à l’angio-scanner, ajoute une valeur pronostique. Cette notion justifie l’urgence de l’inversion de l’anticoagulation et de l’abaissement tensionnel : ce sont les deux leviers contre un saignement encore actif.</p><h3 id="i61-a04-partie-3">4.3 Effet de masse et hypertension intracrânienne</h3><p>L’hématome comprime le tissu voisin et réduit le débit sanguin local. L’œdème qui se développe élève la pression intracrânienne (<button class="w" data-k="i61-pic">PIC (pression intracrânienne)</button>) et fait baisser la pression de perfusion cérébrale. Lorsque le sang atteint les ventricules, des caillots peuvent obstruer l’aqueduc de Sylvius et provoquer une hydrocéphalie. Chez notre patiente, un hématome de 25 ml reste modeste, mais une aggravation de la vigilance doit faire chercher en priorité une extension de l’hématome, une hypertension intracrânienne ou une crise.</p><h3 id="i61-a04-partie-4">4.4 Cascade biochimique secondaire</h3><p>La thrombine et la plasmine sont toxiques dès le premier jour. Deux à trois jours après l’hémorragie, les hématies se lysent et libèrent l’hémoglobine ; l’hémosidérine apparaît dans les macrophages dès le troisième jour. Le fer libéré catalyse la formation d’espèces réactives de l’oxygène, et les neutrophiles ainsi que la microglie activée (jours 2 à 3) libèrent des cytokines, des radicaux libres, du monoxyde d’azote et des métalloprotéases. Le surplus de fer périhématomal provoque en outre une peroxydation des lipides membranaires, une forme de mort cellulaire appelée ferroptose ; la glutathion peroxydase 4 (<button class="w" data-k="i61-ferroptose">GPX4 et ferroptose</button>) la limite et son expression baisse en phase aiguë chez le rat. La chélation du fer est efficace en préclinique seulement : aucun traitement clinique ne repose aujourd’hui sur ce mécanisme.</p><p>La résorption se fait par la périphérie vers le centre ; de l’hémosidérine résiduelle persiste pendant des mois, ce qui explique la visibilité tardive d’un ancien saignement en IRM de susceptibilité (<button class="w" data-k="i61-susceptibilite">séquences de susceptibilité</button>).</p><figure><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 366" width="100%" role="img" aria-label="Schéma didactique de la chaîne physiopathologique"><title>Schéma didactique de la chaîne physiopathologique</title><desc>Cinq étapes successives, de la paroi artérielle malade à la lésion secondaire.</desc><defs><marker id="ar43150" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="currentColor"/></marker></defs><rect x="30" y="6" width="640" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="350" y="27.4" text-anchor="middle" font-size="14" fill="currentColor">Artère perforante malade : lipohyalinose, microanévrysmes,</text><text x="350" y="44.4" text-anchor="middle" font-size="14" fill="currentColor">ou paroi infiltrée d’amyloïde (angiopathie amyloïde)</text><line x1="350" y1="56" x2="350" y2="80" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar43150)"/><rect x="30" y="82" width="640" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="350" y="111.9" text-anchor="middle" font-size="14" fill="currentColor">Rupture : le sang s’écoule dans le parenchyme</text><line x1="350" y1="132" x2="350" y2="156" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar43150)"/><rect x="30" y="158" width="640" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="350" y="187.9" text-anchor="middle" font-size="14" fill="currentColor">Croissance de l’hématome (surtout dans les 3 premières heures)</text><line x1="350" y1="208" x2="350" y2="232" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar43150)"/><rect x="30" y="234" width="640" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="350" y="255.4" text-anchor="middle" font-size="14" fill="currentColor">Effet de masse : débit local réduit, œdème,</text><text x="350" y="272.4" text-anchor="middle" font-size="14" fill="currentColor">pression intracrânienne élevée, hydrocéphalie</text><line x1="350" y1="284" x2="350" y2="308" stroke="currentColor" stroke-width="1.6" marker-end="url(#ar43150)"/><rect x="30" y="310" width="640" height="50" rx="6" fill="none" stroke="currentColor" stroke-width="1.6"/><text x="350" y="339.9" text-anchor="middle" font-size="14" fill="currentColor">Lésion secondaire : thrombine, hémoglobine, fer, radicaux libres, inflammation</text></svg><figcaption><p>Schéma didactique : la chaîne reliant la paroi artérielle malade à la lésion secondaire. Chaque étape ouvre une possibilité thérapeutique distincte (pression, hémostase, chirurgie).</p></figcaption></figure><p>Lue de haut en bas, la chaîne montre où l’on peut agir : la pression artérielle et la réversion limitent la croissance, la neurochirurgie traite l’effet de masse et l’hydrocéphalie, tandis que la cascade biochimique n’a pas encore de traitement validé.</p><figure><a href="assets/img/cycle3/i61/ct_of_basal_ganglionic_hemorrhage.png" target="_blank" rel="noopener" aria-label="Ouvrir la figure en taille complète"><img src="assets/img/cycle3/i61/ct_of_basal_ganglionic_hemorrhage.png" alt="Coupe axiale de scanner cérébral montrant une grande zone blanche hyperdense profonde dans l’hémisphère droit, marquée d’un astérisque, avec trois flèches sur son bord médial." width="820" loading="lazy"></a><figcaption><p>Tomodensitométrie cérébrale sans injection, coupe axiale : volumineux hématome hyperdense des noyaux gris centraux droits (astérisque) ; les flèches de l’auteur original soulignent le bord médial de l’hématome au contact du système ventriculaire.</p><p><a href="assets/img/cycle3/i61/ct_of_basal_ganglionic_hemorrhage.png" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><p class="src"><a href="https://commons.wikimedia.org/wiki/File:CT_of_basal_ganglionic_hemorrhage.png" target="_blank" rel="noopener">Source publiée</a> · Shazia Mirza et Sankalp Gokhale (Neuroimaging in Acute Stroke, 2016) ; Wikimedia Commons — CC BY 4.0 · <a href="https://commons.wikimedia.org/wiki/File:CT_of_basal_ganglionic_hemorrhage.png#Licensing" target="_blank" rel="noopener">Licence ou statut</a>.</p></figcaption></figure><p>Sur le scanner, le sang récent apparaît blanc (hyperdense) sur un parenchyme gris. Le lecteur regarde d’abord le siège (ici profond), puis la taille, puis le refoulement du ventricule voisin. Un tel hématome est la situation typique de l’artériopathie des perforantes.</p><div class="quiz ui" data-exercise="i61-a04"><p><b>Cas fictif — Une patiente sous apixaban a un hématome de 25 ml. Pourquoi inverser l’anticoagulation dès la fin du scanner ?</b></p><button data-ok="1">Parce que l’hématome peut encore grandir, surtout dans les premières heures, et que l’anticoagulation favorise cette croissance.</button><button data-ok="0">Parce que l’hématome ne peut plus grandir après le premier scanner.</button><p class="fb" hidden>La croissance survient surtout dans les trois premières heures et l’anticoagulation la prédit. Les gestes A et B visent à l’empêcher.</p></div><div class="key"><p><b>À retenir.</b> La rupture d’une artère perforante malade (artériopathie ou angiopathie amyloïde) déclenche l’hémorragie, mais le rôle exact des microanévrysmes reste débattu. L’hématome grandit surtout dans les 3 premières heures ; une croissance de plus de 33 % ou de 6 ml est la définition des essais. L’œdème élève la pression intracrânienne et le sang intraventriculaire peut provoquer une hydrocéphalie. La toxicité du sang (thrombine, fer, radicaux libres) relève encore de la recherche : aucun traitement clinique validé.</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6613877/" target="_blank" rel="noopener" data-reference-source="1">Wan et coll. — Iron toxicity, lipid peroxidation and ferroptosis after intracerebral haemorrhage (Stroke Vasc Neurol 2019;4:93–95)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13479682/" target="_blank" rel="noopener" data-reference-source="1">Menon et coll. — Acide tranexamique dans l’hémorragie intracérébrale aiguë spontanée, méta-analyse sur données individuelles (J Neurol Neurosurg Psychiatry 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p><button class="pareto-btn ui" data-k="pareto-i61-a04">▲ Loi de Pareto — Physiopathologie</button></section><section class="ilot" id="i61-a05"><h2><span class="n">5</span> Topographie et formes cliniques</h2><h3 id="i61-a05-partie-1">5.1 Répartition des sièges</h3><p>Les hémorragies profondes (capsule interne, noyaux gris, tronc cérébral) représentent environ deux tiers des cas et résultent plus souvent d’une artériopathie des perforantes. Environ 5 à 10 % des hémorragies siègent dans le cervelet. Le reste est lobaire (cortico-sous-cortical) ; parmi elles, environ 40 % relèvent de l’artériosclérose seule, 40 % de l’artériosclérose associée à l’angiopathie amyloïde et 20 % de l’angiopathie amyloïde seule. Ces proportions varient selon la population : dans la cohorte suisse d’IRM CADMUS, 45,6 % des hématomes étaient lobaires, probablement par un biais de sélection (les patients examinés en IRM) ; dans une série autopsique, 56 % étaient lobaires, 37 % profonds et 6 % infratentoriels.</p><h3 id="i61-a05-partie-2">5.2 Conséquences cliniques déduites de l’anatomie</h3><p>Aucune source consultée ne chiffre la fréquence de chaque signe par siège. On peut en revanche déduire la sémiologie de l’anatomie. La capsule interne concentre les fibres motrices descendantes ; un hématome qui l’atteint ou qui la comprime provoque une hémiparésie du côté opposé, comme chez notre patiente. Le cervelet coordonne le mouvement : un hématome cérébelleux provoque une ataxie plutôt qu’une paralysie. La fosse postérieure est un espace étroit, de sorte qu’un hématome cérébelleux peut comprimer le tronc cérébral et l’aqueduc ; l’hydrocéphalie et la compression du tronc sont les risques majeurs de cette localisation.</p><figure><a href="assets/img/cycle3/i61/posterior_fossa_hemorrhage.jpg" target="_blank" rel="noopener" aria-label="Ouvrir la figure en taille complète"><img src="assets/img/cycle3/i61/posterior_fossa_hemorrhage.jpg" alt="Quatre coupes axiales de scanner : sang hyperdense dans la fosse postérieure et dans les ventricules, ventricules latéraux dilatés." width="820" loading="lazy"></a><figcaption><p>Tomodensitométrie préopératoire (quatre coupes axiales) : hémorragie de la fosse postérieure avec sang intraventriculaire et hydrocéphalie (dilatation des ventricules latéraux et du troisième ventricule).</p><p><a href="assets/img/cycle3/i61/posterior_fossa_hemorrhage.jpg" target="_blank" rel="noopener">Ouvrir l’image en taille originale</a></p><p class="src"><a href="https://commons.wikimedia.org/wiki/File:Posterior_fossa_hemorrhage.jpg" target="_blank" rel="noopener">Source publiée</a> · Yadav YR, Mukerji G, Shenoy R, Basoor A, Jain G, Nelson A (BMC Neurol 2007;7:1) ; Wikimedia Commons — CC BY 2.0 · <a href="https://commons.wikimedia.org/wiki/File:Posterior_fossa_hemorrhage.jpg#Licensing" target="_blank" rel="noopener">Licence ou statut</a>.</p></figcaption></figure><p>La planche montre la conséquence d’un hématome de la fosse postérieure : le sang remplit les ventricules et ceux-ci se dilatent en amont de l’obstacle. Pour la lire, on repère d’abord l’hyperdensité au centre de la fosse, puis la taille des ventricules latéraux. Cette image prépare les indications de drainage ventriculaire et d’évacuation décrites dans la prise en charge aiguë.</p><h3 id="i61-a05-partie-3">5.3 Formes typique et atypiques</h3><div class="two"><div class="card"><p><b>Forme typique (hématome profond hypertensif).</b></p><p>Déficit focal brutal d’un hémicorps, souvent avec céphalée et troubles de conscience évocateurs mais non spécifiques ; aucun signe clinique ne distingue de façon fiable l’hémorragie de l’infarctus.</p></div><div class="card"><p><b>Formes atypiques.</b></p><p>Hématome cérébelleux sans paralysie, mais avec ataxie et signes d’hypertension intracrânienne ; hémorragie intraventriculaire avec baisse de conscience ; hématome lobaire chez le sujet âgé avec angiopathie amyloïde.</p></div></div><div class="trap"><span class="k">Piège</span>Un hématome cérébelleux peut se présenter sans faiblesse des membres. Chez un patient qui vomit, a un déséquilibre et dont la vigilance baisse, le scanner doit inclure la fosse postérieure : la compression du tronc et l’hydrocéphalie peuvent engager le pronostic vital.</div><div class="key"><p><b>À retenir.</b> Environ deux tiers des hémorragies sont profondes, 5 à 10 % cérébelleuses, le reste lobaire ; les proportions varient avec la population étudiée. La capsule interne explique l’hémiparésie controlatérale ; le cervelet explique l’ataxie et le risque de compression du tronc. La localisation guide la cause mais aussi l’urgence chirurgicale (hydrocéphalie, compression).</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p><button class="pareto-btn ui" data-k="pareto-i61-a05">▲ Loi de Pareto — Topographie et formes cliniques</button></section><section class="ilot" id="i61-a06"><h2><span class="n">6</span> Étiologies et facteurs de risque</h2><h3 id="i61-a06-partie-1">6.1 Répartition suisse des causes</h3><p>Le registre suisse des AVC a classé les causes de 2650 hémorragies selon une adaptation de la classification SMASH-U. Elle repose sur une attribution locale, dont la fiabilité inter-juges est modérée. Le tableau ci-dessous classe les causes par fréquence ; sa lecture rappelle qu’une cause sur cinq reste inconnue et qu’une sur vingt est macrovasculaire et appelle une prise en charge spécifique.</p><table class="t"><thead><tr><th>Cause (registre suisse)</th><th>Fréquence</th><th>Mécanisme et discriminant</th></tr></thead><tbody><tr><td>Hypertension</td><td>46,7 %</td><td>Artériopathie des perforantes ; siège profond ; hypertension préexistante</td></tr><tr><td>Cause inconnue</td><td>21,4 %</td><td>Bilan étiologique incomplet ou négatif</td></tr><tr><td>Autre cause déterminée</td><td>10,3 %</td><td>Comprend notamment les tumeurs hémorragiques</td></tr><tr><td>Antithrombotiques</td><td>8,6 %</td><td>Anticoagulant ou antiagrégant ; croissance de l’hématome</td></tr><tr><td>Angiopathie amyloïde</td><td>8,2 %</td><td>Siège lobaire ; sujet âgé ; microsaignements corticaux</td></tr><tr><td>Cause macrovasculaire</td><td>4,8 %</td><td>Malformation artério-veineuse, anévrisme, cavernome, fistule ; sujet jeune</td></tr></tbody></table><p>Il faut lire ce tableau avec ses limites : les causes ne s’excluent pas (un patient hypertendu peut aussi être sous anticoagulant), et la classification ne suit pas de hiérarchie stricte. La classification par IRM CADMUS, proposée par la même équipe suisse, fait une lecture différente : elle exclut d’abord les causes macrovasculaires, structurelles et autres, puis classe les petits vaisseaux selon les marqueurs d’IRM. Dans le registre, l’atteinte mixte (angiopathie amyloïde et artériopathie profonde) représente 63,6 %, la maladie des petits vaisseaux indéterminée 17,2 %, l’angiopathie amyloïde seule 13,1 % et l’artériopathie profonde seule 6,3 %. Cette dernière classification reste un outil de recherche.</p><h3 id="i61-a06-partie-2">6.2 Facteurs de risque</h3><p>L’hypertension artérielle est le premier facteur : l’hypertension est associée à un meilleur pronostic que les autres causes (rapport de cotes ajusté d’indépendance 1,33 ; mortalité 0,64). L’anticoagulation et l’antiagrégation augmentent le risque de croissance de l’hématome et aggravent le pronostic (mortalité, rapport de cotes ajusté 1,62 sous antithrombotiques). L’angiopathie amyloïde augmente le risque de récidive hémorragique à trois mois (rapport de cotes ajusté 3,38). Chez le jeune adulte, les malformations vasculaires sont la première cause, jusqu’à un tiers des cas.</p><h3 id="i61-a06-partie-3">6.3 Autres causes à connaître</h3><p>Le syndrome d’encéphalopathie postérieure réversible (<button class="w" data-k="i61-pres">PRES</button>) et le syndrome de vasoconstriction cérébrale réversible (<button class="w" data-k="i61-rcvs">RCVS</button>) peuvent s’accompagner d’hémorragies ; la thrombose veineuse cérébrale provoque des saignements en territoire veineux ; une tumeur ou une métastase peut saigner. Les maladies monogéniques sont rares mais à évoquer chez le jeune ou en cas de phénotype évocateur : angiopathie associée à COL4A1/COL4A2 (hémorragies, crises, migraine, atteinte oculaire, rénale, cardiaque et musculaire), CADASIL (NOTCH3, avec plus d’infarctus que d’hémorragies), syndrome d’Ehlers-Danlos vasculaire (COL3A1), drépanocytose, maladie de moyamoya familiale et déficit en adénosine désaminase 2. Le test génétique se fait seulement si la clinique ou l’imagerie l’évoque, avec un consentement signé et l’accord préalable de l’assureur.</p><div class="key"><p><b>À retenir.</b> En Suisse, l’hypertension explique 46,7 % des hémorragies ; 21,4 % restent sans cause et 4,8 % sont macrovasculaires. Les antithrombotiques favorisent la croissance de l’hématome et aggravent le pronostic ; l’angiopathie amyloïde expose à la récidive. Chez le jeune, une cause macrovasculaire ou génétique est à chercher activement.</p></div><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10834115/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — CADMUS, classification IRM des hémorragies intracérébrales liées aux maladies des petits vaisseaux (Neurology 2024;102)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p><button class="pareto-btn ui" data-k="pareto-i61-a06">▲ Loi de Pareto — Étiologies et facteurs de risque</button></section>
