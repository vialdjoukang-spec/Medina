<template data-pop="i61-hic" data-title="HIC : définition et terminologie"><p>L’hémorragie intracérébrale (HIC) est un saignement non traumatique dans le parenchyme cérébral (cerveau, tronc cérébral, cervelet) et/ou dans les ventricules. L’hémorragie sous-arachnoïdienne, l’hématome sous-dural et l’hématome extradural font partie de l’ensemble plus large des hémorragies intracrâniennes, mais pas de l’HIC.</p><p>On distingue l’hémorragie intraparenchymateuse, l’hémorragie intraventriculaire isolée (confinée aux ventricules) et l’extension intraventriculaire d’un hématome parenchymateux. Selon le siège, l’hémorragie parenchymateuse est lobaire, profonde, infratentorielle ou mixte.</p><p>Cette terminologie, proposée en 2026 par un groupe européen, n’est pas normative. Elle sert surtout à écrire sans ambiguïté un compte rendu de scanner. Le terme « primaire » est abandonné.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12952859/" target="_blank" rel="noopener" data-reference-source="1">Pensato et coll. — Classification anatomique standardisée des hémorragies intracrâniennes (Cerebrovasc Dis 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="i61-hsa" data-title="HSA : hémorragie sous-arachnoïdienne"><p>L’hémorragie sous-arachnoïdienne (HSA) est un saignement dans l’espace sous-arachnoïdien, qui entoure le cerveau et contient le liquide cérébro-spinal. Elle se code I60 et fait l’objet d’un cours séparé. À Genève, son incidence est de 6,0 pour 100 000 par an et sa létalité à 30 jours de 17,2 %.</p><p>Dans une hémorragie intracérébrale, le sang peut atteindre secondairement l’espace sous-arachnoïdien ; à l’inverse, certaines hémorragies sous-arachnoïdiennes de la convexité ont des causes particulières (syndrome de vasoconstriction, PRES, thrombose veineuse, angiopathie amyloïde), comparées dans l’îlot des diagnostics différentiels.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/39965170/" target="_blank" rel="noopener" data-reference-source="1">Dirren et coll. — Étude genevoise de l’AVC : incidence et létalité selon la CIM-11 (Neurology 2025;104:e213353)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-gcs" data-title="Échelle de Glasgow : composantes et calcul"><p>L’échelle de coma de Glasgow (GCS, pour Glasgow Coma Scale) mesure la vigilance par trois réponses. Le total va de 3 (pire) à 15 (normal). Le médecin cote la meilleure réponse observée dans chaque domaine, puis additionne.</p><table class="t"><thead><tr><th>Domaine</th><th>Points</th><th>Réponse</th></tr></thead><tbody><tr><td>Ouverture des yeux</td><td>4 / 3 / 2 / 1</td><td>Spontanée / à la voix / à la douleur / aucune</td></tr><tr><td>Réponse verbale</td><td>5 / 4 / 3 / 2 / 1</td><td>Orientée / confuse / mots inappropriés / sons incompréhensibles / aucune</td></tr><tr><td>Réponse motrice</td><td>6 / 5 / 4 / 3 / 2 / 1</td><td>Obéit aux ordres / localise la douleur / retrait / flexion anormale / extension anormale / aucune</td></tr></tbody></table><p>Exemple : une patiente ouvre les yeux à la voix (3), est confuse (4) et obéit aux ordres (6) : 3 + 4 + 6 = 13. Le score ICH retient trois tranches : 13 à 15 (0 point), 5 à 12 (1 point) et 3 à 4 (2 points).</p><p>Limites : une aphasie abaisse artificiellement le score verbal, et une sédation ou une intubation en empêche la cotation. Chez notre patiente, le Glasgow de 14 (verbal confus) vaut 0 point au score ICH.</p><p class="src">Sources : <a href="https://www.glasgowcomascale.org/what-is-gcs/" target="_blank" rel="noopener" data-reference-source="1">Glasgow Coma Scale — présentation de l’échelle (Teasdale et Jennett, Lancet 1974)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/11283388/" target="_blank" rel="noopener" data-reference-source="1">Hemphill et coll. — The ICH score (Stroke 2001;32:891–897)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="i61-nihss" data-title="NIHSS : échelle de gravité de l’AVC"><p>Le NIHSS (National Institutes of Health Stroke Scale) quantifie un déficit neurologique focal en additionnant des items cotés lors de l’examen (vigilance, regard, champ visuel, paralysie faciale, force des membres, ataxie, sensibilité, langage, dysarthrie, négligence). Un score plus élevé correspond à un déficit plus sévère.</p><p>Dans l’hémorragie intracérébrale, il sert à fixer un critère d’éligibilité aux antidotes (NIHSS inférieur à 36) et à suivre l’évolution toutes les 6 heures. Dans le registre suisse, le NIHSS médian à l’admission valait 8. Il est limité par les troubles de conscience : l’échelle suppose que le patient puisse coopérer. Les items sont détaillés dans le cours sur l’infarctus cérébral (I63).</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="i61-territoires" data-title="Territoires vasculaires (renvoi au cours I63)"><p>Un territoire vasculaire est la région du cerveau alimentée par une artère. Dans l’infarctus, le déficit suit le territoire de l’artère obstruée. Dans l’hémorragie profonde, le saignement naît d’une petite artère perforante : le déficit suit la structure atteinte (par exemple la capsule interne) plutôt qu’un grand territoire.</p><p>Le cours consacré à l’infarctus cérébral (I63) détaille les territoires des artères cérébrales antérieure, moyenne et postérieure. Cette notion aide à ne pas confondre deux présentations proches.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a>.</p></template>
<template data-pop="i61-perforantes" data-title="Artères perforantes : anatomie et fragilité"><p>Les artères perforantes sont de fines artères qui pénètrent dans la profondeur du cerveau, notamment à sa base. Leur disposition terminale les rend sensibles à l’hypertension. Les branches lenticulo-striées irriguent le putamen, un noyau gris central.</p><p>Dans l’artériopathie des perforantes, la paroi de ces vaisseaux se dégrade (lipohyalinose, nécrose fibrinoïde, microanévrysmes de Charcot-Bouchard). L’hémorragie qui en résulte est profonde : capsule interne, noyaux gris, thalamus ou tronc. L’hypertension est le premier facteur de risque (46,7 % des hémorragies suisses).</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a>.</p></template>
<template data-pop="i61-aac" data-title="AAC : histologie et clinique"><p>L’angiopathie amyloïde cérébrale (AAC) est le dépôt d’amyloïde dans la paroi des artères corticales et leptoméningées. Elle fragilise la média et provoque des hémorragies lobaires, volontiers récidivantes (rapport de cotes ajusté de récidive à trois mois : 3,38 dans le registre suisse).</p><p>L’examen de référence est l’histologie (coloration au rouge Congo). En pratique, le diagnostic clinique s’appuie sur l’IRM de susceptibilité et les critères de Boston, utilisés seulement devant un déclin cognitif, une hémorragie cérébrale ou des épisodes focaux transitoires. En cas d’AAC probable, les antithrombotiques ne sont arrêtés que si la maladie est symptomatique et si les microsaignements n’ont pas d’autre explication.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8592842/" target="_blank" rel="noopener" data-reference-source="1">Magaki et coll. — Charcot–Bouchard aneurysms revisited (Mod Pathol 2021;34:2109–2121)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a>.</p></template>
<template data-pop="i61-croissance" data-title="Croissance de l’hématome : définition et exemple"><p>La croissance désigne l’augmentation du volume de l’hématome entre le scanner initial et un contrôle à 24 ± 12 heures. Les essais la définissent par une augmentation relative supérieure à 33 % ou absolue supérieure à 6 ml. Il suffit qu’un seul des deux critères soit rempli.</p><p>Exemple : un hématome de 20 ml au scanner initial passe à 28 ml. L’augmentation absolue vaut 28 − 20 = 8 ml (supérieure à 6 ml) et l’augmentation relative 8 / 20 = 40 % (supérieure à 33 %) : il y a croissance. Un passage de 60 à 64 ml (+4 ml, +6,7 %) n’en est pas une.</p><p>La croissance survient surtout dans les trois premières heures. Elle est prédite par l’anticoagulation, l’antiagrégation, le volume initial et un court délai entre le début et l’imagerie. Le « spot sign », une fuite de contraste dans l’hématome à l’angio-scanner, a une valeur pronostique. Cette définition est opérationnelle et issue d’essais : elle n’est pas un seuil de décision individuel.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13479682/" target="_blank" rel="noopener" data-reference-source="1">Menon et coll. — Acide tranexamique dans l’hémorragie intracérébrale aiguë spontanée, méta-analyse sur données individuelles (J Neurol Neurosurg Psychiatry 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="i61-pic" data-title="PIC et pression de perfusion cérébrale"><p>La pression intracrânienne (PIC) est la pression régnant dans la boîte crânienne. La pression de perfusion cérébrale est celle qui pousse le sang dans le cerveau. L’œdème qui entoure l’hématome élève la PIC et fait baisser la pression de perfusion. La source consultée énonce cette relation sans formule ni seuil chiffré ; aucune valeur n’est donc donnée ici.</p><p>En pratique, le médecin recherche les signes cliniques d’hypertension intracrânienne : baisse de vigilance, anomalies pupillaires, aggravation d’une parésie, respiration pathologique. Un monitorage invasif de la PIC est envisageable dans les hémorragies sévères et expansives.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-ferroptose" data-title="Ferroptose et glutathion peroxydase 4"><p>La ferroptose est une mort cellulaire liée au fer. Après une hémorragie, l’hémoglobine libère du fer autour de l’hématome ; ce fer favorise la production d’espèces réactives de l’oxygène et la peroxydation des lipides membranaires. La glutathion peroxydase 4 (GPX4) limite cette peroxydation. Son expression baisse en phase aiguë chez le rat.</p><p>Les agents chélateurs du fer se sont montrés efficaces dans des modèles précliniques seulement. Aucune application thérapeutique n’est validée chez l’humain : ce mécanisme explique la lésion secondaire mais ne guide pas encore la prise en charge.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6613877/" target="_blank" rel="noopener" data-reference-source="1">Wan et coll. — Iron toxicity, lipid peroxidation and ferroptosis after intracerebral haemorrhage (Stroke Vasc Neurol 2019;4:93–95)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a>.</p></template>
<template data-pop="i61-transfo" data-title="Transformation hémorragique et signes d’imagerie"><p>Un infarctus peut se transformer en hématome, notamment après thrombolyse. Au scanner, plusieurs signes orientent vers cette transformation plutôt que vers une hémorragie primitive : un aspect hétérogène (en plaques) au lieu d’une opacité uniforme, une hypodensité autour de l’hématome qui peut atteindre le cortex en forme de coin, et une occlusion artérielle visible dans le même territoire.</p><p>La distinction n’est pas toujours certaine et se confirme par l’angiographie. Après thrombolyse, une hémorragie symptomatique (hématome parenchymateux avec aggravation dans les 24 heures) se traite selon une procédure particulière, décrite dans les situations particulières et le cours I63.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-susceptibilite" data-title="IRM de susceptibilité : T2* et SWI"><p>Les séquences T2* et SWI (susceptibility-weighted imaging) sont sensibles au fer des produits de dégradation du sang. Elles montrent les microsaignements (petits foyers ronds sans signal) et la sidérose superficielle (liseré noir le long des sillons).</p><p>Elles servent à classer les hémorragies (lobaires strictes : angiopathie amyloïde ; profondes : artériopathie des perforantes) et à appliquer les critères de Boston. Les sources consultées ne décrivent pas l’évolution du signal du sang par stades : seule l’hémosidérine résiduelle, qui persiste des mois, est établie. Les microsaignements ne sont pas toujours dus à une microangiopathie (circulation extracorporelle, ECMO, thrombus, métastases, vascularites).</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7804065/" target="_blank" rel="noopener" data-reference-source="1">Bai et coll. — Intracerebral haemorrhage: from clinical settings to animal models (Stroke Vasc Neurol 2020;5:388–395)</a>.</p></template>
<template data-pop="i61-hta" data-title="Hypertension artérielle et hémorragie intracérébrale"><p>L’hypertension chronique dégrade les artères perforantes profondes (artériopathie dite hypertensive) et constitue la première cause d’hémorragie intracérébrale dans le registre suisse (46,7 %). Elle s’associe à un meilleur pronostic que d’autres causes (rapport de cotes ajusté d’indépendance 1,33 ; mortalité 0,64) ; les sources lues n’en donnent pas l’explication.</p><p>À la phase aiguë, la pression se traite selon la cible de 140 mmHg (voir la fenêtre de calcul). Au long cours, une pression ambulatoire inférieure à 130/80 mmHg est suggérée et le contrôle tensionnel est recommandé avec force. L’hypertension se code en supplément de l’hémorragie.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la statistique — CIM-10-GM 2024, version française (31 octobre 2024)</a>.</p></template>
<template data-pop="i61-anticoag" data-title="Anticoagulants : molécules et informations à transmettre"><table class="t"><thead><tr><th>Classe</th><th>Molécules</th><th>Cible</th></tr></thead><tbody><tr><td>Antagoniste de la vitamine K</td><td>Phenprocoumone (Marcoumar), acénocoumarol (Sintrom)</td><td>Synthèse des facteurs II, VII, IX, X</td></tr><tr><td>Inhibiteur direct du facteur Xa (anti-Xa)</td><td>Apixaban, rivaroxaban, édoxaban</td><td>Facteur Xa</td></tr><tr><td>Inhibiteur direct de la thrombine (anti-IIa)</td><td>Dabigatran</td><td>Thrombine</td></tr><tr><td>Héparines</td><td>Héparine non fractionnée, bas poids moléculaire</td><td>Antithrombine</td></tr></tbody></table><p>Le médecin préhospitalier transmet l’anticoagulant exact, la dose, l’heure de la dernière prise et l’heure de début ou du dernier état normal : ces informations déterminent l’antidote. Dans les registres suisse et norvégien, 23,7 % des patients prenaient un anticoagulant. Les antiagrégants (AAS, clopidogrel) comptent aussi : ils prédisent la croissance de l’hématome.</p><p class="src">Sources : <a href="https://www.neurovasc.ch/fileadmin/files/publikationen/fr/Prehospital_Swiss_Guidelines_FR_Kaegi_SwissMedForum2021_suppl.pdf" target="_blank" rel="noopener" data-reference-source="1">Kägi et coll. — Prise en charge préhospitalière de l’AVC : recommandations suisses (Forum Médical Suisse 2021;21:322–328)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38336370/" target="_blank" rel="noopener" data-reference-source="1">Hémorragie intracérébrale sous anticoagulants oraux, registres suisse et norvégien (Stroke Vasc Neurol 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-htic" data-title="Hypertension intracrânienne : signes et conduite"><p>Les signes d’hypertension intracrânienne selon le protocole bernois sont : baisse de vigilance, troubles pupillomoteurs (mydriase le plus souvent en cas de gonflement sus-tentoriel, myosis en cas de gonflement sous-tentoriel), aggravation d’une parésie, nouvelle parésie homolatérale, respiration pathologique et troubles du rythme cardiaque.</p><p>Devant toute détérioration neurologique, la liste de contrôle bernoise pose cinq questions : saignement, hypertension intracrânienne, crise épileptique ou état de mal non convulsif, infection, sédation. Le premier geste est un scanner urgent et un avis neurochirurgical. Un monitorage invasif de la pression intracrânienne est envisageable dans les hémorragies sévères et expansives.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-pa" data-title="Calcul de la baisse tensionnelle autorisée"><p><b>Ce que l’on compare.</b> La pression artérielle systolique (PAS) initiale et la cible de 140 mmHg. Le but est de savoir de combien de mmHg la pression peut baisser sans dépasser la limite de sécurité.</p><p><b>Formule.</b> Baisse nécessaire = PAS initiale − cible. Elle doit rester inférieure à la baisse maximale autorisée dans la première heure (60 mmHg à Berne, 70 mmHg en Europe), et la PAS finale ne doit pas descendre sous le plancher (120 mmHg à Berne, 110 mmHg en Europe).</p><p><b>Exemple.</b> PAS de 200 mmHg. Baisse nécessaire pour atteindre 140 mmHg : 200 − 140 = 60 mmHg, soit exactement la limite bernoise ; la cible tombe au-dessus du plancher de 120 mmHg. Selon l’ESO, la baisse de 60 mmHg est inférieure à 70 mmHg et la PAS de 140 mmHg reste supérieure à 110 mmHg. La variabilité est limitée à 20 % (Berne) : 20 % de 200 mmHg font 40 mmHg.</p><p><b>Autre exemple.</b> PAS de 230 mmHg. La cible serait de 140 mmHg, soit une baisse de 90 mmHg : trop forte. La baisse maximale de 60 mmHg amène à 170 mmHg dans l’heure ; la cible est atteinte par paliers. La recommandation européenne invite aussi à la prudence au-dessus de 220 mmHg, où l’abaissement intensif est associé à plus de détérioration neurologique.</p><p><b>Limites.</b> Les valeurs sont celles d’un protocole et de recommandations pour des adultes ; la titration se fait à la tête du patient, avec une mesure toutes les 5 minutes.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a>.</p></template>
<template data-pop="i61-score-ich" data-title="Calcul du score ICH"><p><b>Ce que l’on compare.</b> Cinq facteurs pronostiques relevés à l’admission. Chacun apporte des points et la somme va de 0 à 6. Le but est de résumer la gravité, non de décider d’un traitement.</p><table class="t"><thead><tr><th>Facteur</th><th>Valeur</th><th>Points</th></tr></thead><tbody><tr><td>Score de Glasgow</td><td>3 à 4 / 5 à 12 / 13 à 15</td><td>2 / 1 / 0</td></tr><tr><td>Âge</td><td>80 ans ou plus</td><td>1 (sinon 0)</td></tr><tr><td>Origine</td><td>Infratentorielle</td><td>1 (sinon 0)</td></tr><tr><td>Volume de l’hématome</td><td>30 cm³ ou plus</td><td>1 (sinon 0)</td></tr><tr><td>Hémorragie intraventriculaire</td><td>Présente</td><td>1 (sinon 0)</td></tr></tbody></table><p><b>Exemple.</b> Un homme de 82 ans a un Glasgow de 11, un hématome sus-tentoriel de 35 ml avec extension intraventriculaire. Âge 1 + Glasgow 1 + volume 1 + sus-tentoriel 0 + extension 1 = 4 sur 6. Notre patiente de 78 ans (Glasgow 14, 25 ml, sus-tentoriel, sans extension) obtient 0.</p><p><b>Interprétation.</b> Dans la cohorte originale, les 26 patients à 0 ont survécu et les 6 patients à 5 sont décédés ; la mortalité à 30 jours croît avec le score. Les sources consultées ne donnent pas la mortalité pour les autres valeurs : aucun chiffre intermédiaire n’est cité.</p><p><b>Limites.</b> La recommandation européenne précise que le score informe le pronostic mais ne doit pas être l’unique prédicteur (surface sous la courbe de 0,82 à 0,92 selon les études) et qu’il ne justifie ni limitation générale des soins ni ordre de non-réanimation dans les 24 premières heures.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/11283388/" target="_blank" rel="noopener" data-reference-source="1">Hemphill et coll. — The ICH score (Stroke 2001;32:891–897)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a>.</p></template>
<template data-pop="i61-abc2" data-title="Volume de l’hématome par ABC/2"><p><b>Ce que représentent les lettres.</b> A est le plus grand diamètre de l’hématome sur la coupe du scanner où il est le plus large ; B est le diamètre perpendiculaire à A sur la même coupe ; C est la hauteur de l’hématome, égale au nombre de coupes qui montrent le saignement multiplié par l’épaisseur d’une coupe. Les trois longueurs s’expriment en centimètres.</p><p><b>Pourquoi diviser par 2.</b> Un hématome ressemble à une ellipsoïde dont le volume vaut (4/3) × π × (A/2) × (B/2) × (C/2). Comme π/6 vaut environ 0,52, soit à peu près 1/2, le volume s’approche de A × B × C / 2. Un centimètre cube correspond à un millilitre.</p><p><b>Exemple.</b> A = 5 cm, B = 4 cm, hématome visible sur 6 coupes de 0,5 cm : C = 3 cm. Volume = 5 × 4 × 3 / 2 = 30 ml. Pour notre patiente, 5 coupes de 0,5 cm donnent C = 2,5 cm et 5 × 4 × 2,5 / 2 = 25 ml.</p><p><b>Interprétation.</b> 30 ml est le seuil du score ICH et la limite « moins de 30 ml » de la recommandation européenne sur la pression ; la plage de 1 à 60 ml conditionne les antidotes ; 15 ml est le seuil cérébelleux. La mesure prend moins d’une minute et sa reproductibilité est excellente (coefficient de corrélation intraclasse de 0,99), mais elle surestime le volume des hématomes irréguliers.</p><p class="src">Sources : <a href="https://pubmed.ncbi.nlm.nih.gov/8711791/" target="_blank" rel="noopener" data-reference-source="1">Kothari et coll. — The ABCs of measuring intracerebral hemorrhage volumes (Stroke 1996;27:1304–1305)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7982923/" target="_blank" rel="noopener" data-reference-source="1">McGurgan et coll. — Acute intracerebral haemorrhage: diagnosis and management (Pract Neurol 2021;21:128–136)</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-pcc" data-title="Calcul de la dose de concentré de complexe prothrombinique"><p><b>Ce que l’on compare.</b> L’INR initial, qui mesure l’anticoagulation par antagoniste de la vitamine K, et le poids du patient, qui détermine la quantité de facteurs à apporter. Le concentré apporte les facteurs II, VII, IX et X ; l’unité (UI) se rapporte au facteur IX.</p><p><b>Exemple.</b> Patient de 70 kg sous phenprocoumone, INR 2,8. Protocole bernois : 30 UI/kg × 70 kg = 2100 UI. Recommandation européenne : 30 à 50 UI/kg, soit 2100 à 3500 UI (INR de 2,0 ou plus). Information professionnelle Beriplex, INR de 2,0 à 3,9 : 25 UI/kg × 70 = 1750 UI, soit 1 ml/kg ou 70 ml ; le plafond est de 5000 UI. Information professionnelle Prothromplex : un flacon contient 500 UI de facteur IX ; 2100 UI correspondent à un peu plus de quatre flacons de 500 UI.</p><p><b>Compléments.</b> Il faut ajouter 10 mg de vitamine K par voie intraveineuse (Konakion MM), car la correction apportée par le concentré apparaît environ 30 minutes après l’injection, alors que l’effet de la vitamine K débute en 4 à 6 heures. L’INR au lit est contrôlé à 15 minutes ; la normalisation visée est inférieure à 1,3. L’information professionnelle Beriplex ne recommande pas de répéter la dose, tandis que celle de Prothromplex admet 1200 à 2400 UI supplémentaires toutes les 6 à 12 heures ; le protocole bernois utilise Prothromplex.</p><p><b>Limites.</b> Le risque thrombotique augmente avec les doses répétées.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680006650015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Beriplex P/N, CSL Behring, autorisation 00665, mise à jour octobre 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680413300015" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Prothromplex NF 500, Takeda, autorisation 41330, mise à jour septembre 2023</a> ; <a href="https://amiko.oddb.org/fi/id/1571?lang=fr" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Konakion MM 10 mg, Cheplapharm, autorisation 48112, mise à jour janvier 2022</a>.</p></template>
<template data-pop="i61-andexanet" data-title="Choix de la dose d’andexanet"><p><b>Ce que l’on compare.</b> La molécule prise (apixaban ou rivaroxaban), sa dose et le délai depuis la dernière prise. Le choix de la dose d’antidote suit un tableau de la FI.</p><p><b>Doses.</b> Faible dose : bolus de 400 mg à 30 mg/min puis 4 mg/min pendant 120 minutes (480 mg), soit 880 mg au total, 5 flacons de 200 mg, volume reconstitué 88 ml à 10 mg/ml. Dose élevée : 800 mg puis 960 mg (1760 mg), 9 flacons.</p><table class="t"><thead><tr><th>Molécule et dose</th><th>Dernière prise</th><th>Dose d’andexanet</th></tr></thead><tbody><tr><td>Apixaban, 5 mg ou moins</td><td>Quel que soit le délai</td><td>Faible</td></tr><tr><td>Apixaban, plus de 5 mg</td><td>Moins de 8 heures</td><td>Élevée</td></tr><tr><td>Apixaban, plus de 5 mg</td><td>8 heures ou plus</td><td>Faible</td></tr><tr><td>Rivaroxaban, 10 mg ou moins</td><td>Quel que soit le délai</td><td>Faible</td></tr><tr><td>Rivaroxaban, plus de 10 mg</td><td>Moins de 8 heures</td><td>Élevée</td></tr><tr><td>Rivaroxaban, plus de 10 mg</td><td>8 heures ou plus</td><td>Faible</td></tr></tbody></table><p><b>Exemples.</b> Apixaban 5 mg il y a 6 heures : faible dose. Rivaroxaban 20 mg il y a 4 heures : dose élevée selon la FI, alors que Berne préfère la faible dose ; l’écart est signalé et la décision relève du protocole local. Si la dose ou le délai sont inconnus, la FI ne donne pas de recommandation et la concentration du médicament peut guider.</p><p><b>Limites.</b> L’édoxaban n’est pas dans l’indication suisse (réversion non recommandée). Les critères de Berne (début avant 6 h, NIHSS inférieur à 36, Glasgow supérieur à 6, volume de 1 à 60 ml, dernière prise avant 15 h) précèdent le choix de la dose. L’activité anti-Xa ne sert pas à suivre l’efficacité.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-protamine" data-title="Calcul de la dose de protamine"><p><b>Ce que l’on compare.</b> La quantité d’héparine reçue dans les 3 dernières heures et le temps écoulé depuis l’arrêt : la protamine neutralise l’héparine encore active.</p><p><b>Protocole bernois.</b> Héparine non fractionnée arrêtée depuis une heure ou moins (anti-Xa de 0,35 ou plus) : 1000 UI de protamine par 1000 UI d’héparine reçues dans les 3 dernières heures, maximum 5000 UI. Arrêt depuis 1 à 3 heures (anti-Xa de 0,15 à 0,35) : 500 UI par 1000 UI. Héparine de bas poids moléculaire : 5000 UI si la dernière dose remonte à 8 heures ou moins (anti-Xa de 0,5 ou plus), 2500 UI de 8 à 12 heures (anti-Xa de 0,3 à 0,5).</p><p><b>Exemple.</b> Un patient a reçu 4000 UI d’héparine non fractionnée dans les 3 dernières heures, perfusion arrêtée il y a 30 minutes : 4000 UI de protamine (inférieur au maximum de 5000 UI). Si l’arrêt remonte à 2 heures : 2000 UI.</p><p><b>Produit suisse.</b> Le sulfate de protamine LEO est étiqueté en UI d’héparine neutralisées : 1 ml (10 mg) neutralise environ 1400 UI ; le bolus ne dépasse pas 5 ml et se donne en 10 minutes. Les deux expressions d’unités ne se superposent pas exactement : la pharmacie confirme la conversion avant de prescrire. L’aPTT, l’ACT ou l’anti-Xa se contrôlent 5 à 15 minutes plus tard.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680698420019" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Sulfate de protamine LEO Pharma, autorisation 69842, mise à jour janvier 2025</a>.</p></template>
<template data-pop="i61-boston" data-title="Critères de Boston et d’Édimbourg"><p>Les critères de Boston classent l’angiopathie amyloïde cérébrale à partir de l’IRM. Le protocole bernois utilise la version 1.5 après 55 ans : AAC possible si une seule hémorragie lobaire, corticale ou cortico-sous-corticale (cervelet admis) ou une sidérose superficielle focale ou disséminée, autres causes exclues ; AAC probable si plusieurs hémorragies lobaires ou corticales (cervelet admis), ou une hémorragie unique avec sidérose superficielle ; AAC définie sur preuve autopsique. Ils ne s’emploient qu’en présence d’un déclin cognitif, d’une hémorragie cérébrale ou d’épisodes focaux transitoires, jamais en dépistage.</p><p>La version 2.0 (Lancet Neurol 2022) abaisse l’âge à 50 ans et ajoute des marqueurs de substance blanche. Une AAC probable exige : au moins deux lésions hémorragiques strictement lobaires en T2* (hémorragie, microsaignement, sidérose ou hémorragie sous-arachnoïdienne de la convexité) ou bien une lésion lobaire plus un marqueur de substance blanche (plus de 20 espaces périvasculaires visibles dans le centre semi-ovale d’un hémisphère, ou plus de 10 petits hypersignaux ronds bilatéraux), sans lésion hémorragique profonde ni autre cause (traumatisme, transformation hémorragique d’infarctus, malformation, tumeur, vascularite). Sensibilité de 74,5 % et spécificité de 95,0 % contre 64,5 % et 95,0 % pour la version 1.5, sur 341 patients avec neuropathologie. Le protocole bernois juge la version 2.0 plus sensible mais moins spécifique (surdiagnostic possible).</p><p>Au scanner, les critères d’Édimbourg associent hémorragie sous-arachnoïdienne et soit APOE ε4, soit prolongements digitiformes : spécificité de 96 %, validation externe requise.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9389452/" target="_blank" rel="noopener" data-reference-source="1">Charidimou et coll. — Critères de Boston, version 2.0, de l’angiopathie amyloïde cérébrale (Lancet Neurol 2022;21:714–725)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29331631/" target="_blank" rel="noopener" data-reference-source="1">Rodrigues et coll. — Critères d’Édimbourg (scanner et génétique) de l’hémorragie lobaire liée à l’angiopathie amyloïde (Lancet Neurol 2018;17:232–240)</a>.</p></template>
<template data-pop="i61-caari" data-title="Angiopathie amyloïde inflammatoire (CAA-ri)"><p>Le protocole bernois définit l’angiopathie amyloïde inflammatoire (CAA-ri) possible par cinq critères : âge d’au moins 40 ans ; au moins un symptôme non directement lié à une hémorragie (céphalée, trouble de conscience, comportement, déficit focal, crise) ; hypersignaux IRM asymétriques de la substance blanche s’étendant à la substance sous-corticale ; au moins une lésion hémorragique cortico-sous-corticale (macro- ou microhémorragie, sidérose superficielle) ; exclusion de tumeur, d’infection ou d’une autre cause.</p><p>Traitement : méthylprednisolone 1 g par jour pendant 3 jours, puis prednisolone 1 mg/kg avec protection gastrique et osseuse. Une immunosuppression additionnelle (cyclophosphamide, mycophénolate, rituximab) est possible sans preuve de supériorité. Un contrôle clinique avec IRM a lieu à 4 à 6 semaines. Il s’agit d’un protocole institutionnel.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-diagram" data-title="Arbre DIAGRAM : probabilité d’une cause macrovasculaire"><p><b>Ce que l’on compare.</b> Chez un patient dont l’angio-scanner est négatif, la probabilité qu’une malformation ou un anévrisme existe encore, selon la présence d’une microangiopathie (visible sur le scanner) et d’une hypertension. L’arbre vient de Wilson et coll. (2017) et est repris par le protocole bernois.</p><table class="t"><thead><tr><th>Angio-scanner</th><th>Microangiopathie</th><th>Hypertension</th><th>Probabilité</th></tr></thead><tbody><tr><td>Positif</td><td>—</td><td>—</td><td>Plus de 50 %</td></tr><tr><td>Négatif</td><td>Oui</td><td>Oui</td><td>1,8 %</td></tr><tr><td>Négatif</td><td>Oui</td><td>Non</td><td>6,1 %</td></tr><tr><td>Négatif</td><td>Non</td><td>Oui</td><td>7,3 %</td></tr><tr><td>Négatif</td><td>Non</td><td>Non</td><td>22,1 %</td></tr></tbody></table><p><b>Exemple.</b> Homme de 34 ans normotendu, sans microangiopathie, HIC lobaire, angio-scanner négatif : 22,1 %. Une angiographie numérique reste indiquée. À l’inverse, un homme de 70 ans hypertendu avec microangiopathie ne garde que 1,8 % de probabilité.</p><p><b>Limites.</b> L’attribution des pourcentages aux branches a été reconstruite à partir de la mise en page de l’arbre original. La recommandation européenne suggère des scores comme DIAGRAM (recommandation faible) : la surface sous la courbe de 0,83 à la dérivation tombe à 0,66 en validation externe. L’angio-scanner et l’angio-veinoscanner réalisés dans les 7 jours ont une sensibilité de 74 % et une spécificité de 91 % ; l’angiographie invasive reste la référence.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a>.</p></template>
<template data-pop="i61-sous-codes" data-title="Sous-codes CIM-10-GM 2024 de I61"><table class="t"><thead><tr><th>Code</th><th>Intitulé (OFS, version française)</th></tr></thead><tbody><tr><td>I61.0</td><td>Hémorragie intracérébrale hémisphérique, sous-corticale (hémorragie intracérébrale profonde)</td></tr><tr><td>I61.1</td><td>Hémorragie intracérébrale hémisphérique, corticale (hémorragie superficielle ou d’un lobe cérébral)</td></tr><tr><td>I61.2</td><td>Hémorragie intracérébrale hémisphérique, non précisée</td></tr><tr><td>I61.3</td><td>Hémorragie intracérébrale du tronc cérébral</td></tr><tr><td>I61.4</td><td>Hémorragie intracérébrale cérébelleuse</td></tr><tr><td>I61.5</td><td>Hémorragie intracérébrale intraventriculaire</td></tr><tr><td>I61.6</td><td>Hémorragie intracérébrale, localisations multiples</td></tr><tr><td>I61.8</td><td>Autre hémorragie intracérébrale</td></tr><tr><td>I61.9</td><td>Hémorragie intracérébrale, sans précision</td></tr></tbody></table><p><b>Règles de codage.</b> Pour préciser la cause, on ajoute un code supplémentaire I67.0 (dissection), I67.1 (anévrisme ou fistule artério-veineuse acquis) ou Q28 (malformations congénitales). Les séquelles apparaissant ou persistant un an ou plus après le début se codent I69.1. L’hémorragie traumatique est exclue de I60–I69 et se code S06. L’hémorragie sous-arachnoïdienne relève de I60, les autres hémorragies intracrâniennes non traumatiques (par exemple sous-durales) de I62. L’angiopathie amyloïde cérébrale se code I68.0 (avec E85). L’hypertension se code en supplément (I10, I15).</p><p class="src">Sources : <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686264/master" target="_blank" rel="noopener" data-reference-source="1">Office fédéral de la statistique — CIM-10-GM 2024, version française (31 octobre 2024)</a>.</p></template>
<template data-pop="i61-bundle" data-title="Paquet de soins INTERACT3 : cibles chiffrées"><table class="t"><thead><tr><th>Paramètre</th><th>Cible du paquet</th><th>Remarque</th></tr></thead><tbody><tr><td>Pression systolique</td><td>Moins de 140 mmHg</td><td>Voir le calcul de la baisse autorisée</td></tr><tr><td>Glycémie</td><td>6,1 à 7,8 mmol/l sans diabète ; 7,8 à 10,0 mmol/l avec diabète</td><td>Cible thérapeutique, supérieure à l’intervalle de référence (3,7 à 5,6 mmol/l veineux)</td></tr><tr><td>Température</td><td>37,5 °C ou moins</td><td>Traitement antipyrétique</td></tr><tr><td>INR sous antagoniste de la vitamine K</td><td>Moins de 1,5</td><td>Berne, Europe et information Beriplex retiennent moins de 1,3</td></tr></tbody></table><p>Le paquet de soins a réduit le mauvais pronostic (score de Rankin modifié de 3 à 6, rapport de cotes commun 0,86 ; intervalle de confiance à 95 % de 0,76 à 0,97). Il a été évalué dans l’essai INTERACT3, mené surtout dans des pays à revenu faible ou intermédiaire ; la recommandation européenne le recommande (recommandation faible). Il combine des cibles qui sont d’abord des objectifs d’essai : en Suisse, on applique les seuils du protocole bernois et de l’information professionnelle.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11658503/" target="_blank" rel="noopener" data-reference-source="1">Ouyang et coll. — Évaluation du paquet de soins ciblés dans l’essai INTERACT3 (PLOS Glob Public Health 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356/" target="_blank" rel="noopener" data-reference-source="1">Steiner et coll. — Recommandation ESO–EANS sur l’AVC dû à une hémorragie intracérébrale spontanée (Eur Stroke J 2025;10:1007–1086)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151662/" target="_blank" rel="noopener" data-reference-source="1">ESO — Mise à jour 2025 de la recommandation sur la pression artérielle dans l’AVC ischémique et l’hémorragie intracérébrale (Eur Stroke J 2026)</a> ; <a href="https://www.chuv.ch/fileadmin/sites/dl/documents/DMLP-CCL-LCC-RE-33-0069-V3.pdf" target="_blank" rel="noopener" data-reference-source="1">CHUV, laboratoire de chimie clinique — intervalles de référence (version du 9 juin 2026)</a>.</p></template>
<template data-pop="i61-ssr" data-title="Registre suisse des AVC (SSR)"><p>Le Swiss Stroke Registry (SSR) recense les patients hospitalisés pour AVC dans les Stroke Units et Stroke Centers suisses. L’étude de Goeldlin et coll. porte sur 2650 hémorragies intracérébrales non traumatiques admises entre 2014 et 2019 : âge moyen 72 ans, 46,5 % de femmes, NIHSS médian 8, Glasgow médian 15, délai médian d’admission 3,8 heures, IRM chez 42,5 %.</p><p>Étiologies : hypertension 46,7 %, inconnue 21,4 %, autre cause déterminée 10,3 %, antithrombotiques 8,6 %, angiopathie amyloïde 8,2 %, cause macrovasculaire 4,8 %. À trois mois : 39,1 % des 2250 patients évalués étaient indépendants, 25,1 % de la cohorte décédés. Limites : 15 % des scores de Rankin manquants ; classification SMASH-U adaptée de fiabilité modérée ; volume et siège de l’hématome non disponibles.</p><p class="src">Sources : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a>.</p></template>
<template data-pop="i61-conduite" data-title="Aptitude à la conduite après une HIC"><p>Les recommandations sont non contraignantes (prise de position des sociétés allemandes de neurologie et d’AVC, citée par le protocole bernois) ; elles ne valent qu’en l’absence de séquelle somatique ou neurocognitive empêchant la conduite. Le tableau bernois distingue la conduite privée et les autres catégories.</p><table class="t"><thead><tr><th>Situation</th><th>Conduite privée</th><th>Autres catégories</th></tr></thead><tbody><tr><td>HIC par artériopathie des perforantes, pression bien contrôlée</td><td>1 mois</td><td>3 mois</td></tr><tr><td>HIC par angiopathie amyloïde, ou HIC symptomatique avec plus de 5 microsaignements asymptomatiques ou sidérose superficielle</td><td>Pas de conduite</td><td>Pas de conduite</td></tr></tbody></table><p>Le médecin explique ces délais comme des conseils prudents, rappelle que la décision individuelle tient compte des séquelles, et documente l’information donnée.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
<template data-pop="i61-pres" data-title="PRES : syndrome d’encéphalopathie postérieure réversible"><p>Le PRES (posterior reversible encephalopathy syndrome) est une cause d’hémorragie sous-arachnoïdienne de la convexité et d’hémorragie cérébrale chez les moins de 60 ans. Selon le tableau bernois, la céphalée est fréquente, les crises épileptiques sont fréquentes, des troubles visuels sont fréquents et l’EEG est souvent altéré ; les épisodes focaux transitoires sont inhabituels. Le contexte typique associe hypertension sévère ou prise d’un médicament.</p><p>L’IRM montre des altérations typiques. Le diagnostic différentiel avec le syndrome de vasoconstriction cérébrale réversible, la thrombose veineuse et l’angiopathie amyloïde se fait par l’âge, la clinique et l’imagerie vasculaire (tableau des diagnostics différentiels).</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a>.</p></template>
<template data-pop="i61-rcvs" data-title="RCVS : syndrome de vasoconstriction cérébrale réversible"><p>Le RCVS (reversible cerebral vasoconstriction syndrome) est une cause d’hémorragie sous-arachnoïdienne de la convexité chez les moins de 60 ans. La céphalée est fréquente, souvent en coup de tonnerre ; les crises épileptiques et les épisodes focaux transitoires sont plutôt rares.</p><p>L’angiographie montre des irrégularités de calibre des artères cérébrales, qui sont l’examen décisif du protocole bernois. Le contexte (médicament, post-partum) est à rechercher, sans fréquence chiffrée dans les sources lues.</p><p class="src">Sources : <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9194537/" target="_blank" rel="noopener" data-reference-source="1">Goeldlin et coll. — Étiologie, évolution fonctionnelle à 3 mois et événements récurrents dans l’hémorragie intracérébrale non traumatique, registre suisse (J Stroke 2022;24:266–277)</a>.</p></template>
<template data-pop="i61-ondexxya" data-title="Ondexxya : monographie suisse"><h3>Produit et indication</h3><p>Ondexxya (andexanet alfa), 200 mg en poudre pour perfusion, AstraZeneca, autorisation suisse 67759 (information d’avril 2025), est réservé à l’usage hospitalier et soumis à une surveillance supplémentaire. Il est indiqué chez l’adulte traité par apixaban ou rivaroxaban lorsqu’une réversion est nécessaire en raison d’une hémorragie incontrôlée ou menaçant le pronostic vital.</p><h3>Mécanisme</h3><p>L’andexanet alfa est une forme recombinante de la protéine humaine Xa, modifiée pour être sans effet enzymatique : la sérine du site actif est remplacée par une alanine, ce qui l’empêche de cliver et d’activer la prothrombine, et le domaine Gla est retiré, ce qui l’empêche de former le complexe prothrombinase. Il s’agit d’un agent de réversion spécifique des inhibiteurs du facteur Xa : son mécanisme principal est la liaison et la séquestration de l’inhibiteur, qui laisse le facteur Xa naturel libre d’agir.</p><h3>Preuve clinique</h3><p>L’essai ANNEXA-I (phase 4, randomisé, ouvert) a inclus des patients avec hémorragie intracrânienne aiguë, moins de 6 heures après les symptômes et moins de 15 heures après la dernière prise d’un anti-Xa : 452 patients en efficacité, 530 en sécurité, âge médian 80 ans, 92,2 % d’hémorragies intracérébrales, volume médian 9,9 ml ; comparateur : concentré de complexe prothrombinique dans 85,4 % des cas. Hémostase efficace à 12 heures : 67,0 % contre 53,1 % (différence 13,4 % ; IC 95 % 4,6 à 22,2 ; p = 0,0032). Réduction médiane de l’anti-Xa : −94,4 % contre −27,5 %. Décès à 30 jours : 28,2 % contre 26,4 %. Événements thrombotiques à 30 jours : 10,3 % contre 5,7 % (accident ischémique 6,5 % contre 1,5 %, infarctus du myocarde 4,2 % contre 1,5 %), apparus en médiane après 3 jours contre 14 jours ; thromboses mortelles 2,3 % sous andexanet.</p><h3>Posologie</h3><p>Faible dose : bolus de 400 mg à 30 mg/min puis 4 mg/min pendant 120 minutes (480 mg), 5 flacons ; dose élevée : 800 mg puis 960 mg, 9 flacons. Le choix suit la molécule, la dose et le délai (voir la fenêtre de calcul). Solution reconstituée à 10 mg/ml, filtre en ligne de 0,2 à 0,22 µm. Aucune adaptation rénale, hépatique ou liée à l’âge ; non étudié chez l’enfant.</p><h3>Effets indésirables</h3><p>Fréquents : accident ischémique, infarctus du myocarde, thrombose veineuse profonde, embolie pulmonaire, fièvre. Occasionnels : accident ischémique transitoire, arrêt cardiaque, embolie artérielle, réaction liée à la perfusion.</p><h3>Contre-indications et précautions</h3><p>Hypersensibilité ; allergie aux protéines de hamster. Non adapté à la préparation d’une chirurgie urgente ; la réversion de l’édoxaban ou de l’énoxaparine n’est pas recommandée. Risque accru en cas d’antécédent d’AVC, d’infarctus ou d’insuffisance cardiaque ; non évalué en cas d’événement thromboembolique ou de coagulation intravasculaire disséminée dans les 2 semaines. Il neutralise l’héparine (absence de réponse à l’héparine rapportée). Grossesse : non recommandé ; interrompre l’allaitement. Éviter concentrés, facteur VII activé, plasma et sang total sauf nécessité absolue.</p><h3>Surveillance</h3><p>Hémostase, reprise du saignement, événements thromboemboliques. Ne pas surveiller par l’activité anti-Xa (valeurs faussement élevées). Reprise de l’anticoagulation dès que médicalement judicieux ; un niveau normal d’anticoagulation est attendu 4 heures après la fin de la perfusion.</p><p class="src">Sources : <a href="https://amiko.oddb.org/fr/fi?gtin=7680677590016" target="_blank" rel="noopener" data-reference-source="1">Information professionnelle suisse Ondexxya (andexanet alfa), AstraZeneca, autorisation 67759, mise à jour avril 2025</a> ; <a href="https://neurologie.insel.ch/fileadmin/Neurologie/Dokumente/ANZ/Bern_Stroke_Guidelines_Englisch.pdf" target="_blank" rel="noopener" data-reference-source="1">Réseau AVC bernois — Stroke Guidelines (version 08/2026), chapitres sur l’hémorragie intracérébrale, la surveillance, les antihypertenseurs et le saignement après thrombolyse</a>.</p></template>
