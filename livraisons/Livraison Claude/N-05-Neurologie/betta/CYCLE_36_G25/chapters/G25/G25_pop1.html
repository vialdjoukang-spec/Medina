<template data-pop="g25-codage" data-title="Codage CIM-10-GM de G25">
<div class="lab">Ce que dit la classification</div>
<p>Le bloc G20–G26 de la CIM-10-GM 2024 (BfArM) contient la catégorie G25, avec onze sous-codes de G25.0 à G25.9. Les libellés français de l’Office fédéral de la statistique reprennent ces codes. Les notes « inclut » et « exclut » ont un effet pratique : le tremblement non précisé va en R25.1, la chorée de Huntington en G10, la chorée de Sydenham en I02, le syndrome de Gilles de la Tourette en F95.2.</p>
<div class="lab">Limite</div>
<p>Le tremblement orthostatique, dystonique, de Holmes, cérébelleux et fonctionnel n’a pas de sous-code nommé. Leur rattachement à G25.2 est une inférence, non vérifiée dans l’index alphabétique de la classification (lacune 1 du dossier). Le tremblement parkinsonien relève de G20. Le catalogue historique du dépôt reste en CIM-10-GM 2024 ; la correspondance avec la CIM-11 n’est pas établie.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc G20–G26, catégorie G25</a>; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener" data-reference-source="1">CIM-10-GM 2024, libellés français</a>.</p>
</template>
<template data-pop="g25-mouvements" data-title="Distinguer les mouvements anormaux">
<div class="lab">Définitions opératoires</div>
<p>Le <b>tremblement</b> est rythmique et oscillatoire. La <b>myoclonie</b> est une secousse brève, soudaine, « en choc », à front carré : positive si une bouffée d’activité musculaire la produit, négative si une interruption d’activité la cause (astérixis). La <b>chorée</b> réunit des mouvements rapides, irréguliers, imprévisibles, plus amples et fluides ; ils persistent au repos et à l’action, augmentent avec le stress et disparaissent dans le sommeil profond. Le <b>tic</b> est bref, soudain, irrépressible, non rythmique, précédé d’une sensation prémonitoire, suggestible et temporairement suppressible au prix d’une tension interne. La <b>dystonie</b> associe des bouffées de plus de 100 ms, des postures soutenues et un geste antagoniste.</p>
<div class="lab">Piège</div>
<p>Les bouffées de plus de 100 ms peuvent évoquer un tic comme une dystonie ; la suppressibilité et la sensation prémonitoire séparent le tic. Quand la clinique hésite entre tremblement et myoclonie, l’électromyogramme de surface tranche : activité rythmique pour le tremblement, bouffées irrégulières pour la myoclonie.</p>
<div class="lab">Erreur fréquente</div>
<p>Désigner par « tic » une stéréotypie. Les stéréotypies ne sont pas précédées d’une sensation prémonitoire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>; <a href="https://doi.org/10.1016/j.neurol.2026.09.006" target="_blank" rel="noopener" data-reference-source="1">Tremor or myoclonus? A practical clinical approach</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener" data-reference-source="1">European clinical guidelines for Tourette syndrome and other tic disorders — version 2.0, Part </a>.</p>
</template>
<template data-pop="g25-mdsclass" data-title="Classification du tremblement, Movement Disorder Society 2018">
<div class="lab">Deux axes</div>
<p>L’axe 1 est clinique : âge de début, antécédents familiaux, évolution, topographie, condition d’activation, signes associés, examens. L’axe 2 est étiologique : acquis, génétique, idiopathique.</p>
<div class="lab">Conditions d’activation</div>
<p>Le tremblement de repos affecte un segment non activé, patient détendu. Le tremblement d’action comprend le tremblement postural (contre la gravité), orthostatique (debout), cinétique simple, intentionnel (qui augmente à l’approche de la cible), spécifique d’une tâche ou d’une position, et isométrique.</p>
<div class="lab">Examen pratique</div>
<p>La ligne directrice S2k 2022 précise l’examen : repos avec la main pendante sur l’accoudoir (tête et jambe en décubitus), posture bras tendus, tremblement cinétique simple par des mouvements de haut en bas des mains bras tendus, tremblement intentionnel par l’épreuve doigt-nez ou en transvasant de l’eau.</p>
<div class="lab">Fréquence</div>
<p>Le consensus 2018 distingue les catégories &lt; 4, 4–8, 8–12 et > 12 Hz ; la ligne directrice DGN parle de basse (&lt; 4), moyenne (4–7) et haute (> 8 Hz). La fréquence seule est rarement diagnostique.</p>
<div class="lab">Limite</div>
<p>Texte intégral du consensus lu jusqu’à 100 000 caractères ; la fin du texte (16 798 caractères) n’a pas été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §1.1.</p>
</template>
<template data-pop="g25-myoclonie-class" data-title="Classification et causes des myoclonies">
<div class="lab">Classification</div>
<p>La classification anatomique distingue les origines corticale, cortico-sous-corticale, sous-corticale, segmentaire ou spinale, propriospinale et périphérique. La neurophysiologie la détermine ; le type physiologique guide le traitement. Le système proposé en 2025 (International Association for Parkinson’s and Related Disorders) organise le diagnostic en axe 1A (clinique), 1B (neurophysiologie) et axe 2 (étiologie).</p>
<div class="lab">Myoclonie corticale</div>
<p>Générateur le plus fréquent, induite par l’action ou réflexe à des stimuli sensitifs ; hyperexcitabilité par dysfonction des interneurones GABAergiques ; la moyennisation EEG-EMG montre un transitoire cortical avant la secousse.</p>
<div class="lab">Causes</div>
<p>De multiples troubles métaboliques et médicaments peuvent causer une myoclonie transitoire. Exemples corticaux : maladie d’Alzheimer, maladie de Creutzfeldt-Jakob, maladie de Parkinson, syndrome corticobasal, encéphalopathies métaboliques, lithium. Les maladies neurodégénératives et les démences représentent environ 70 % des causes symptomatiques. L’astérixis est classique dans l’encéphalopathie hépatique.</p>
<div class="lab">Post-anoxique</div>
<p>Forme aiguë dans les 1 à 3 jours après un arrêt circulatoire prolongé ; forme chronique, le syndrome de Lance-Adams, avec myoclonie d’action multifocale.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>; <a href="https://doi.org/10.1007/s00702-026-03303-z" target="_blank" rel="noopener" data-reference-source="1">Diagnostic approach and treatment options for myoclonus</a>; <a href="https://doi.org/10.5334/tohm.1171" target="_blank" rel="noopener" data-reference-source="1">Post-Hypoxic Myoclonus and Deep Brain Stimulation</a>.</p>
</template>
<template data-pop="g25-tremorigenes" data-title="Médicaments et toxiques tremorigènes">
<div class="lab">Médicaments</div>
<p>Antiépileptiques (valproate, carbamazépine, phénytoïne), tétrabénazine, antidépresseurs, sympathomimétiques, bronchodilatateurs et bêta-2-agonistes, <b>lithium</b>, neuroleptiques, métoclopramide, amiodarone, hormones thyroïdiennes, certains anticancéreux, sevrage de drogues ou d’alcool.</p>
<div class="lab">Toxiques</div>
<p>Mercure, plomb, manganèse, arsenic, cyanure, DDT, monoxyde de carbone, naphtalène, toluène, lindane.</p>
<div class="lab">Interprétation</div>
<p>Le diagnostic de tremblement renforcé exige une cause identifiée et la normalisation après traitement de celle-ci ; anxiété et fatigue peuvent aussi renforcer le tremblement.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.2.1.</p>
</template>
<template data-pop="g25-chorees-causes" data-title="Causes des chorées non héréditaires">
<div class="lab">Auto-immunes</div>
<p>Lupus, syndrome des antiphospholipides, chorée gravidique (souvent lupus ou syndrome des antiphospholipides sous-jacent), sclérose en plaques, Behçet, encéphalites auto-immunes (anti-NMDA, LGI1, CASPR2, IgLON5), formes paranéoplasiques rares. La chorée de Sydenham est exclue de G25 (I02).</p>
<div class="lab">Infectieuses et structurelles</div>
<p>VIH, encéphalites virales, neurosyphilis, neuroborréliose, endocardite, toxoplasmose, Whipple ; infarctus ou hémorragie des noyaux gris (hémichorée), tumeurs, abcès, démyélinisation, myélinolyse.</p>
<div class="lab">Métaboliques, toxiques, médicamenteuses</div>
<p>Hyperglycémie non cétosique (hypersignal T1 du putamen), hypoglycémie, dysnatrémies, hypocalcémie, hyperthyroïdie, porphyrie, insuffisance hépatique ou rénale, monoxyde de carbone, manganèse, mercure, carence en B12, Wernicke. Médicaments (G25.4) : antagonistes dopaminergiques dont métoclopramide, antiparkinsoniens, antiépileptiques, inhibiteurs calciques (cinnarizine, flunarizine, vérapamil), lithium, antidépresseurs, antipaludéens, corticoïdes, contraceptifs oraux, antihistaminiques, psychostimulants, baclofène, digoxine, ciclosporine, théophylline, opioïdes, ceftriaxone, mémantine.</p>
<div class="lab">Autres</div>
<p>Polyglobulie de Vaquez, thrombocytémie essentielle, chorée après chirurgie cardiaque sous circulation extracorporelle, moyamoya.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>.</p>
</template>
<template data-pop="g25-comorbidites" data-title="Comorbidités et médicaments aggravants des jambes sans repos">
<div class="lab">Comorbidités</div>
<p>Carence en fer, urémie, hépatopathie, anxiété, dépression, démence, polyneuropathie ; maladie de Parkinson, atrophie multisystématisée (5 à 28 %), tremblement essentiel (jusqu’à 33 %), sclérose en plaques (13 à 65 %), migraine (15 à 20 %), douleur chronique (environ un tiers), bronchopneumopathie chronique obstructive, apnées du sommeil, psoriasis (15 %), dermatite atopique (jusqu’à 40 %), côlon irritable, maladie cœliaque et maladie de Crohn (30 %).</p>
<div class="lab">Médicaments aggravants</div>
<p>Neuroleptiques ; antidépresseurs avec un risque maximal pour la mirtazapine et, possiblement, citalopram, paroxétine, venlafaxine et autres ISRS ; bupropion et trazodone tolérés ; antiémétiques, antihistaminiques (diphenhydramine), lithium (rapports anecdotiques).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://rosenfluh.ch/arsmedici-2023-06/neue-leitlinie-zum-restless-legs-syndrom" target="_blank" rel="noopener" data-reference-source="1">Neue Leitlinie zum Restless-Legs-Syndrom</a>.</p>
</template>
<template data-pop="g25-tics" data-title="Tics organiques et comportements tic-like fonctionnels">
<div class="lab">Définition</div>
<p>Mouvement ou vocalisation brefs, soudains, irrépressibles, non rythmiques ; sensation prémonitoire, suggestibilité, sentiment de volontarité, suppression temporaire. Le DSM-5 reconnaît le trouble tic induit par une substance et le trouble tic dû à une affection médicale générale.</p>
<div class="lab">Différentiel actuel</div>
<p>Les comportements tic-like fonctionnels n’ont pas de sensation prémonitoire, ne sont pas suppressibles, débutent à l’âge adulte et touchent plus souvent les femmes. Les stéréotypies ne sont pas précédées d’une sensation prémonitoire.</p>
<div class="lab">Limite</div>
<p>Aucune source lue ne liste les causes organiques ni les médicaments inducteurs de tics (lacune 6). Le syndrome de Gilles de la Tourette relève de F95.2.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc G20–G26, catégorie G25</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8521086/" target="_blank" rel="noopener" data-reference-source="1">European clinical guidelines for Tourette syndrome and other tic disorders — version 2.0, Part </a>.</p>
</template>
<template data-pop="g25-te-def" data-title="Critères du tremblement essentiel (Movement Disorder Society 2018)">
<div class="lab">Critères</div>
<p>Syndrome de tremblement isolé : tremblement d’action bilatéral des membres supérieurs, présent depuis au moins 3 ans, avec ou sans tremblement de la tête, de la voix ou des membres inférieurs, sans autre signe neurologique (dystonie, ataxie, parkinsonisme). La ligne directrice DGN cite aussi l’absence de neuropathie périphérique.</p>
<div class="lab">Exclusions</div>
<p>Tremblements focaux isolés (voix, tête), tremblement orthostatique > 12 Hz, tremblements spécifiques d’une tâche ou d’une position, début brutal, aggravation par paliers. Un tremblement de type essentiel évoluant depuis moins de 3 ans est dit « indéterminé » et reste en observation.</p>
<div class="lab">Arguments de soutien</div>
<p>Amélioration par l’alcool (50 à 90 %) et antécédents familiaux (40 à 70 %), non obligatoires.</p>
<div class="lab">Piège</div>
<p>Avant 3 ans d’évolution, exclure un tremblement physiologique renforcé, surtout médicamenteux ou par hyperthyroïdie. La suppression du tremblement à l’initiation du mouvement oriente plutôt vers un syndrome dopaminergique déficitaire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.1.1.</p>
</template>
<template data-pop="g25-huntington" data-title="Chorée de Huntington à ne pas manquer">
<div class="lab">Pourquoi en parler ici</div>
<p>La maladie est exclue du bloc G25 (code G10), mais elle doit être recherchée devant toute chorée. Environ 8 % des patients n’ont pas d’antécédent familial connu. L’anamnèse familiale ne l’exclut pas : parents décédés tôt, filiation incertaine, allèles intermédiaires de 27 à 35 répétitions CAG.</p>
<div class="lab">Conduite</div>
<p>Test génétique après consentement éclairé. Les traitements suisses de la tétrabénazine et du tiapride sont autorisés pour cette maladie, non pour les autres chorées.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>; <a href="AmiKo GTIN 7680583750016" target="_blank" rel="noopener" data-reference-source="1">Xenazine®</a>; <a href="AmiKo GTIN 7680392200160" target="_blank" rel="noopener" data-reference-source="1">Tiapridal®</a>.</p>
</template>
<template data-pop="g25-te-plus" data-title="Tremblement essentiel plus">
<div class="lab">Définition</div>
<p>Tremblement essentiel avec des signes « doux » de signification incertaine : marche en tandem perturbée, posture dystonique douteuse, trouble mnésique discret, tremblement de repos.</p>
<div class="lab">Conséquence</div>
<p>Plus de la moitié des patients relèvent du tremblement essentiel plus selon cette définition. Les recommandations thérapeutiques sont les mêmes que pour le tremblement essentiel.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.1.1.</p>
</template>
<template data-pop="g25-asterixis" data-title="Astérixis et encéphalopathies métaboliques">
<div class="lab">Mécanisme</div>
<p>L’astérixis est une myoclonie négative : une interruption brève de l’activité musculaire. Il se voit classiquement dans l’encéphalopathie hépatique et dans d’autres encéphalopathies métaboliques ; certains antiépileptiques peuvent le provoquer.</p>
<div class="lab">Conséquence</div>
<p>La recherche d’une cause réversible métabolique ou médicamenteuse est prioritaire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>; <a href="https://doi.org/10.1016/j.neurol.2026.09.006" target="_blank" rel="noopener" data-reference-source="1">Tremor or myoclonus? A practical clinical approach</a>.</p>
</template>
<template data-pop="g25-mimics" data-title="Diagnostics différentiels des jambes sans repos">
<div class="lab">Les imitateurs</div>
<p>Polyneuropathie (paresthésies superficielles en chaussettes, présentes le jour, sans soulagement durable par le mouvement, sens vibratoire diminué, réflexes achilléens abolis ; confirmation par électroneuromyographie), inconfort positionnel, canal lombaire étroit, claudication artérielle (douleur à la marche, soulagée à l’arrêt), varices, arthrose, névralgie de Morton, tapotement volontaire, tremblement du pied, tics, akathisie hypotensive, tremblement orthostatique, myoclonies d’endormissement, myoclonie propriospinale, fasciculations, « painful legs and moving toes », crampes nocturnes (contraction soudaine soulagée par étirement), akathisie (agitation motrice et intérieure sans rythme circadien), trouble déficitaire de l’attention.</p>
<div class="lab">Drapeaux rouges</div>
<p>Sensations superficielles, douleur localisée, agitation de tout le corps, phénomènes moteurs prédominant sur les sensations.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://rosenfluh.ch/arsmedici-2023-06/neue-leitlinie-zum-restless-legs-syndrom" target="_blank" rel="noopener" data-reference-source="1">Neue Leitlinie zum Restless-Legs-Syndrom</a>.</p>
</template>
<template data-pop="g25-stiffperson" data-title="Syndrome de l’homme raide">
<div class="lab">Définition</div>
<p>Maladie auto-immune rare et progressive : raideur axiale et proximale, spasmes épisodiques, hypersensibilité aux stimuli (bruit, toucher), chutes. La transmission GABAergique est atteinte. Anticorps anti-GAD65 à titre élevé chez la plupart des patients ; anti-amphiphysine (paranéoplasique) ou anti-récepteur de la glycine parfois. Formes classique, partielle ou focale, et PERM (encéphalomyélite progressive avec rigidité et myoclonies).</p>
<div class="lab">Traitement</div>
<p>Symptomatique GABAergique (diazépam, baclofène) et immunomodulation. Les immunoglobulines intraveineuses sont le traitement le mieux étayé, surtout dans les formes sévères ou réfractaires ; échanges plasmatiques et autogreffe : résultats variables ; le rituximab n’a pas de bénéfice démontré dans les essais randomisés.</p>
<div class="lab">Limite</div>
<p>Les critères diagnostiques formels, notamment l’activité continue d’unités motrices à l’électromyogramme, n’ont pas été lus dans une source primaire (lacune 10).</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.70435" target="_blank" rel="noopener" data-reference-source="1">Systematic Review of Immune and Symptomatic Treatments for Stiff-Person Syndrome</a>.</p>
</template>
<template data-pop="g25-fonctionnel" data-title="Tremblement fonctionnel">
<div class="lab">Principe</div>
<p>Le tremblement fonctionnel (qui chevauche le code F44) est un diagnostic <b>positif</b>, non un diagnostic d’exclusion.</p>
<div class="lab">Signes positifs</div>
<p>Début brutal, facteur déclenchant, fluctuations, distractibilité, entraînement de fréquence sur un mouvement imposé, co-contraction, synchronie. Le DaT-SPECT sert en cas de doute avec un syndrome parkinsonien.</p>
<div class="lab">Prise en charge</div>
<p>L’annonce empathique du diagnostic est le premier temps thérapeutique ; la physiothérapie spécialisée est efficace.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.8.1.</p>
</template>
<template data-pop="g25-emg" data-title="Électromyographie de surface (fiche d’interprétation)">
<div class="lab">Principe</div>
<p>L’enregistrement de surface mesure l’activité des muscles actifs. Un tremblement donne une activité rythmique ; une myoclonie donne des bouffées irrégulières ou des silences. L’accélérométrie complète en mesurant fréquence et amplitude, avec charge pondérale pour distinguer tremblement mécanique-réflexe et central, et cohérence entre membres pour l’orthostatique.</p>
<div class="lab">Valeurs</div>
<p>Orthostatique primaire : 13 à 18 Hz debout, forte cohérence bilatérale. Pseudo-orthostatique : moins de 13 Hz, souvent avec parkinsonisme, ataxie ou dystonie. Myoclonie orthostatique : bouffées irrégulières d’environ 50 ms.</p>
<div class="lab">Population</div>
<p>Adultes avec tremblement (ligne directrice S2k 2022).</p>
<div class="lab">Erreur fréquente</div>
<p>Ne pas enregistrer debout : le tremblement orthostatique est alors invisible.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.7.1; <a href="https://doi.org/10.1016/j.neurol.2026.09.006" target="_blank" rel="noopener" data-reference-source="1">Tremor or myoclonus? A practical clinical approach</a>.</p>
</template>
<template data-pop="g25-tremblements-rares" data-title="Tremblements orthostatique, dystonique, de Holmes, vélopalatin et fonctionnel">
<div class="lab">Orthostatique primaire</div>
<p>Instabilité subjective debout, chutes possibles, aucune gêne assis ou couché, examen presque normal. Électromyogramme debout : 13 à 18 Hz avec forte cohérence ; traitement : gabapentine recommandée (hors étiquette).</p>
<div class="lab">Dystonique</div>
<p>Tremblement dans un segment dystonique, geste antagoniste ; toxine botulique sous guidage électromyographique recommandée pour le bras dystonique ; propranolol peut être abandonné.</p>
<div class="lab">Holmes</div>
<p>Repos, posture et intention, généralement sous 5 Hz, lésion du tronc cérébral proche du noyau rouge.</p>
<div class="lab">Vélopalatin</div>
<p>0,5 à 5 Hz ; essentiel (clic auriculaire, olives normales) ou symptomatique (ataxie, pseudo-hypertrophie olivaire à l’IRM).</p>
<div class="lab">Cérébelleux ou intentionnel</div>
<p>Amplitude croissante à l’approche de la cible, pas de vrai tremblement de repos ; cause la plus fréquente : sclérose en plaques (25 à 50 % des patients) ; IRM obligatoire.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.6.1,§2.7.1–2.7.2.</p>
</template>
<template data-pop="g25-bilan-choree" data-title="Bilan de la chorée sporadique">
<div class="lab">Biologie</div>
<p>Biologie de routine avec fonctions hépatiques, CK, frottis (acanthocytes), vitamine B12, ferritine, ASLO, anti-DNase B, céruloplasmine, cuivre sérique et urinaire sur 24 h, anticorps antinucléaires, ENA, anti-ADN double brin, ANCA, anticorps antiphospholipides et anticardiolipine, TSH, anti-TPO, TRAK, PTH, hématocrite et érythropoïétine, sérologies de la syphilis, de la borréliose et du VIH, test de grossesse.</p>
<div class="lab">Imagerie et autres</div>
<p>IRM avec coupes coronales pour l’atrophie caudée, recherche de fer, de calcifications ou de lésions ; selon le contexte, ponction lombaire, TEP-FDG, métaux lourds, toxiques.</p>
<div class="lab">Orientation</div>
<p>Évolution aiguë : accident vasculaire. Subaiguë : métabolique, paranéoplasique, médicamenteuse. Chronique progressive : neurodégénérative. Asymétrie : lésion structurelle ou cause métabolique (hyperglycémie, polyglobulie, syndrome des antiphospholipides, médicaments).</p>
<div class="lab">Différentiels</div>
<p>Épilepsie focale, tics (sensation prémonitoire, suppressibilité), akathisie, myoclonie-dystonie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>.</p>
</template>
<template data-pop="g25-sjsr-criteres" data-title="Critères diagnostiques du syndrome des jambes sans repos">
<div class="lab">Les cinq critères obligatoires (IRLSSG 2014)</div>
<ul><li>Besoin impérieux de bouger les jambes, généralement accompagné ou causé par des sensations désagréables.</li><li>Début ou aggravation au repos ou en inactivité (couché, assis).</li><li>Soulagement partiel ou total par le mouvement, au moins tant que dure l’activité.</li><li>Survenue ou aggravation le soir ou la nuit.</li><li>Non expliqué uniquement par une autre affection ou un comportement (myalgie, stase veineuse, œdème, arthrite, crampes, inconfort positionnel, tapotement habituel du pied).</li></ul>
<div class="lab">Pratique</div>
<p>Le diagnostic est clinique. Les questionnaires servent au dépistage avec un entretien ; les échelles IRLS, RLS-6 et ASRS servent au suivi. Il faut décrire les symptômes avec les mots du patient. Le terme « secondaire » est abandonné au profit de « comorbide ».</p>
<div class="lab">Soutiens</div>
<p>Mouvements périodiques des jambes pendant le sommeil (> 15/h chez plus de 80 %), antécédents familiaux, réponse aux dopaminergiques.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://rosenfluh.ch/arsmedici-2023-06/neue-leitlinie-zum-restless-legs-syndrom" target="_blank" rel="noopener" data-reference-source="1">Neue Leitlinie zum Restless-Legs-Syndrom</a>.</p>
</template>
<template data-pop="g25-div-psg" data-title="Polysomnographie : exigence ou examen de soutien ?">
<div class="lab">Deux positions</div>
<p>La page des Hôpitaux universitaires de Genève (laboratoire du sommeil, mise à jour du 12 février 2026) affirme que le diagnostic ne peut être posé qu’après polysomnographie. La ligne directrice S2k DGN/DGSM (mise à jour le 30 janvier 2024, valable jusqu’au 24 juin 2027), approuvée par la Société suisse de neurologie et la Société suisse de recherche sur le sommeil, de médecine du sommeil et de chronobiologie, affirme que la polysomnographie n’est pas obligatoire.</p>
<div class="lab">Arbitrage</div>
<p>La ligne directrice est la source primaire la plus récente et la plus spécifique pour le diagnostic ; c’est elle qui est retenue : diagnostic clinique, polysomnographie en soutien ou en cas de suspicion d’un autre trouble du sommeil. La page genevoise reste utile pour comprendre la pratique d’un laboratoire du sommeil universitaire.</p>
<div class="lab">Texte en vigueur</div>
<p>Les deux textes restent consultables ; le désaccord est présenté, non masqué.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://www.hug.ch/laboratoire-du-sommeil/syndrome-jambes-sans-repos" target="_blank" rel="noopener" data-reference-source="1">Syndrome des jambes sans repos — Laboratoire du sommeil</a>.</p>
</template>
<template data-pop="g25-urgence-choree" data-title="Chorée aiguë ou asymétrique">
<div class="lab">Pourquoi urgent</div>
<p>Une évolution aiguë ou une asymétrie évoque une lésion structurelle (infarctus, hémorragie) ou une cause métabolique (hyperglycémie non cétosique, polyglobulie, syndrome des antiphospholipides, médicament).</p>
<div class="lab">Gestes</div>
<p>Glycémie immédiate ; imagerie cérébrale ; revue des médicaments.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>.</p>
</template>
<template data-pop="g25-urgence-myoclonie" data-title="Myoclonie post-anoxique et démence rapide">
<div class="lab">Post-anoxique</div>
<p>Dans les 1 à 3 jours après un arrêt circulatoire prolongé ; électroencéphalogramme : suppression-bouffées, pointes-ondes ou état de mal. La forme chronique, ou syndrome de Lance-Adams, est une myoclonie d’action multifocale ; la stimulation cérébrale profonde n’a pas démontré son efficacité (série de cas, preuve faible).</p>
<div class="lab">Creutzfeldt-Jakob</div>
<p>Myoclonies avec démence rapidement progressive : maladie de Creutzfeldt-Jakob à évoquer.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>; <a href="https://doi.org/10.5334/tohm.1171" target="_blank" rel="noopener" data-reference-source="1">Post-Hypoxic Myoclonus and Deep Brain Stimulation</a>.</p>
</template>
<template data-pop="g25-d-tetrabenazine" data-title="Tétrabénazine (Xenazine)">
<div class="lab">Indication suisse</div>
<p>Mouvements hyperkinétiques de la maladie de Huntington. Déplétant présynaptique.</p>
<div class="lab">Posologie</div>
<p>12,5 mg trois fois par jour, +12,5 mg/j tous les 3 à 4 jours jusqu’à 100 mg/j.</p>
<div class="lab">Contre-indications</div>
<p>Dépression, parkinsonisme, insuffisance hépatique modérée ou sévère, allaitement.</p>
<div class="lab">Effets indésirables</div>
<p>Dépression et somnolence (très fréquentes), parkinsonisme, akathisie, anxiété ; syndrome malin des neuroleptiques rare.</p>
<div class="lab">Surveillance</div>
<p>Humeur et idées suicidaires à chaque visite.</p>
<div class="lab">Divergence</div>
<p>Une fiche de recherche mentionnait une « Spätdyskinesie », absente du texte lu de la fiche suisse (lacune 5).</p>
<p class="src">Références : <a href="AmiKo GTIN 7680583750016" target="_blank" rel="noopener" data-reference-source="1">Xenazine®</a>.</p>
</template>
<template data-pop="g25-d-propranolol" data-title="Propranolol (Inderal)">
<div class="lab">Mécanisme et preuves</div>
<p>Bêtabloquant non sélectif. Le propranolol intra-artériel bloque l’augmentation d’amplitude du tremblement physiologique induite par l’adrénaline ; les cardiosélectifs agissent moins. La ligne directrice 2022 le place en traitement qui doit être utilisé dans le tremblement essentiel (recommandation forte, accord 100 %).</p>
<div class="lab">Posologie</div>
<p>Fiche suisse : 40 mg deux à trois fois par jour au départ, augmentation hebdomadaire possible, dose usuelle 80 à 160 mg/j. Ligne directrice : 30 à 240 mg.</p>
<div class="lab">Contre-indications</div>
<p>Asthme bronchique ou antécédent de bronchospasme ; bronchospasme parfois mortel chez l’asthmatique.</p>
<div class="lab">Surveillance</div>
<p>Fréquence cardiaque, symptômes respiratoires.</p>
<div class="lab">Limite</div>
<p>Le métoprolol ne doit pas le remplacer.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, rec. 1,4,10; <a href="AmiKo GTIN 7680317060015" target="_blank" rel="noopener" data-reference-source="1">Inderal®</a>.</p>
</template>
<template data-pop="g25-d-primidone" data-title="Primidone (Mysoline)">
<div class="lab">Statut</div>
<p>Les indications suisses sont limitées aux épilepsies : l’usage dans le tremblement essentiel est <b>hors étiquette</b>.</p>
<div class="lab">Preuves</div>
<p>La ligne directrice 2022 recommande qu’elle soit utilisée (recommandation forte) ; l’association primidone 250 mg et propranolol 80 mg est supérieure à chacun seul ; plus souvent choisie chez le sujet âgé.</p>
<div class="lab">Posologie</div>
<p>62,5 à 750 mg, titration lente.</p>
<div class="lab">Contre-indications</div>
<p>Porphyrie hépatique aiguë, atteinte hépatique ou rénale grave, lésions myocardiques, hypersensibilité au phénobarbital.</p>
<div class="lab">Effets indésirables</div>
<p>Somnolence, vertiges, ataxie en début de traitement.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, rec. 2,4; <a href="AmiKo GTIN 7680178850145" target="_blank" rel="noopener" data-reference-source="1">Mysoline® 250 mg</a>.</p>
</template>
