<p>Dans cette <b>vignette fictive</b>, une femme de 64 ans consulte pour un tremblement des deux mains qui gêne l’écriture et le maniement de la tasse depuis cinq ans. Son père avait le même défaut. Deux verres de vin le soir le diminuent. Au cours de la même consultation, elle ajoute que ses jambes lui deviennent « insupportables » dès qu’elle s’allonge, et qu’elle se lève pour marcher quelques minutes avant de pouvoir se rendormir. Ces deux plaintes appartiennent à la même catégorie CIM, G25, et pourtant elles n’ont ni le même mécanisme, ni le même traitement.</p>
<p>La catégorie G25 réunit en effet des mouvements anormaux très différents : tremblements, secousses brèves de la myoclonie, chorée, tics d’origine organique, besoin impérieux de bouger les jambes, agitation de l’akathisie, raideur du syndrome de l’homme raide. Le médecin se pose donc deux questions dans cet ordre. <b>Quel syndrome ?</b> car le traitement dépend d’abord du phénomène moteur reconnu. <b>Existe-t-il une cause traitable ?</b> médicament, hyperthyroïdie, trouble métabolique ou carence en fer, car la corriger vaut mieux que masquer le symptôme. La ligne directrice allemande, autrichienne et suisse sur le tremblement et celle sur le syndrome des jambes sans repos imposent explicitement cette démarche.</p>
<div class="key"><b>À retenir.</b> Nommer le mouvement, puis chercher la cause réversible, avant toute prescription. Le cours suit un plan par syndrome, précédé d’une méthode commune de reconnaissance, parce que la catégorie G25 est un carrefour et non une maladie unique.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §1.2; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>.</p>
</section>
<section class="ilot" id="g25-1"><h2><span class="n">1</span>Définition, classification et méthode de reconnaissance</h2>
<p>Le bloc G25 de la <button class="w" data-k="g25-codage">CIM-10-GM 2024 (sous-codes, inclusions et exclusions)</button> regroupe d’« autres syndromes extrapyramidaux et troubles de la motricité ». Il exclut volontairement la maladie de Parkinson (G20), la chorée de Huntington (G10), la chorée de Sydenham (I02), le syndrome de Gilles de la Tourette (F95.2) et les tics non précisés (F95.9). Le cours porte donc sur ce qui reste, et il faut garder ces exclusions en tête pour ne pas coder à la mauvaise place.</p>
<table class="t"><thead><tr><th>Code</th><th>Entité</th><th>Exclusions à connaître</th></tr></thead><tbody><tr><td>G25.0</td><td>Tremblement essentiel, y compris familial</td><td>Tremblement non précisé (R25.1)</td></tr><tr><td>G25.1</td><td>Tremblement dû à des médicaments</td><td>Code supplémentaire du chapitre XX pour la substance</td></tr><tr><td>G25.2</td><td>Autres tremblements précisés, y compris intentionnel</td><td>Rattachement des autres formes : voir la fenêtre de codage</td></tr><tr><td>G25.3</td><td>Myoclonie, y compris médicamenteuse</td><td>Myokymie faciale (G51.4), épilepsie myoclonique (G40.-)</td></tr><tr><td>G25.4</td><td>Chorée médicamenteuse</td><td>Code supplémentaire du chapitre XX pour la substance</td></tr><tr><td>G25.5</td><td>Autres chorées</td><td>Huntington (G10), Sydenham et chorée rhumatismale (I02.-)</td></tr><tr><td>G25.6</td><td>Tics médicamenteux et tics d’origine organique</td><td>Gilles de la Tourette (F95.2), tic non précisé (F95.9)</td></tr><tr><td>G25.80</td><td>Mouvements périodiques des jambes au cours du sommeil</td><td>—</td></tr><tr><td>G25.81</td><td>Syndrome des jambes sans repos</td><td>—</td></tr><tr><td>G25.88</td><td>Autres syndromes extrapyramidaux précisés</td><td>Inclut akathisie médicamenteuse et syndrome de l’homme raide</td></tr><tr><td>G25.9</td><td>Syndrome extrapyramidal ou trouble de la motricité, sans précision</td><td>—</td></tr></tbody></table>
<p>Ce tableau situe chaque entité dans la classification officielle ; il ne dit rien du diagnostic clinique, qui repose sur la reconnaissance du mouvement. Cette reconnaissance suit des définitions précises, résumées ci-dessous et détaillées dans la fenêtre <button class="w" data-k="g25-mouvements">distinguer les mouvements anormaux (critères et pièges)</button>.</p>
<table class="t"><thead><tr><th>Mouvement</th><th>Définition</th><th>Marqueur qui le distingue</th></tr></thead><tbody><tr><td>Tremblement</td><td>Mouvement involontaire, rythmique et oscillatoire d’une partie du corps</td><td>Oscillation régulière ; condition d’activation précise</td></tr><tr><td>Myoclonie</td><td>Secousse brève, soudaine, « en choc »</td><td>Bouffée d’activité musculaire (positive) ou interruption brève (négative, astérixis)</td></tr><tr><td>Chorée</td><td>Mouvements rapides, irréguliers, imprévisibles, fluides</td><td>Présents au repos et à l’action, majorés par le stress, absents du sommeil profond</td></tr><tr><td>Tic</td><td>Mouvement ou son bref, soudain, non rythmique</td><td>Sensation prémonitoire, suppression temporaire possible</td></tr><tr><td>Akathisie</td><td>Agitation motrice avec agitation intérieure</td><td>Pas de gêne sensitive ni de rythme circadien</td></tr><tr><td>Jambes sans repos</td><td>Besoin impérieux de bouger les jambes</td><td>Repos, soir, soulagement par le mouvement</td></tr></tbody></table>
<p>La <b>classification du tremblement</b> repose sur deux axes. L’axe 1 est clinique : âge de début, antécédents, topographie, condition d’activation, signes associés, examens. L’axe 2 est étiologique : cause acquise, génétique ou inconnue. Cette séparation oblige à décrire avant d’expliquer, et évite d’appeler « essentiel » un tremblement dont on n’a pas cherché la cause. Le détail figure dans la fenêtre <button class="w" data-k="g25-mdsclass">classification du tremblement par la Movement Disorder Society, 2018 (deux axes, conditions d’activation)</button>.</p>
<div class="trap"><span class="k">Piège</span> Le tremblement parkinsonien relève de G20 et sort de ce cours ; mais un tremblement de repos chez un patient présenté comme « essentiel » doit faire reconsidérer le diagnostic, puisqu’il figure parmi les signes qui font parler de « tremblement essentiel plus ».</div>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener" data-reference-source="1">ICD-10-GM 2024, bloc G20–G26, catégorie G25</a>; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener" data-reference-source="1">CIM-10-GM 2024, libellés français</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>.</p>
</section>
<section class="ilot" id="g25-2"><h2><span class="n">2</span>Fréquence et enjeux</h2>
<p>Les données de fréquence ne sont pas suisses : aucune source lue ne donne la prévalence du tremblement, du syndrome des jambes sans repos ou des myoclonies en Suisse. Cette lacune est nommée ici plutôt que comblée. Les chiffres cités viennent de sources allemandes, autrichiennes et suisses coapprouvées ou de revues européennes.</p>
<table class="t"><thead><tr><th>Syndrome</th><th>Donnée</th><th>Source</th></tr></thead><tbody><tr><td>Tremblement essentiel</td><td>Prévalence estimée de 1,3 à 5,1 % ; environ 69 millions de personnes dans le monde ; pas de prédominance de sexe</td><td>Ligne directrice S2k 2022</td></tr><tr><td>Tremblement pathologique (tous types)</td><td>Plus de 30 % des personnes au-delà de 80 ans</td><td>Ligne directrice S2k 2022</td></tr><tr><td>Syndrome des jambes sans repos</td><td>Jusqu’à 10 % des adultes âgés ; 1,9 à 3,6 % des enfants et adolescents ; 15 à 38,8 % des grossesses, surtout au troisième trimestre</td><td>Ligne directrice 2024 ; revue génétique 2024</td></tr><tr><td>Myoclonie pathologique persistante</td><td>Incidence annuelle d’environ 1 pour 100 000 personnes ; prévalence sur la vie entière inférieure à 10 pour 100 000</td><td>Revue 2017</td></tr></tbody></table>
<p>La myoclonie <b>symptomatique</b> est la plus fréquente, devant l’épileptique puis l’essentielle ; les maladies neurodégénératives et les démences représentent environ 70 % de ses causes symptomatiques. Pour le syndrome des jambes sans repos, les antécédents familiaux sont rapportés chez 40 à 92 % des personnes dont les symptômes débutent avant 45 ans.</p>
<div class="key"><b>À retenir.</b> Le tremblement est la plainte la plus fréquente de la catégorie ; sa prévalence augmente nettement à partir de la sixième décennie. Une myoclonie, rare, est plus souvent le signe d’une maladie sous-jacente que l’entité elle-même.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.1.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://doi.org/10.1038/s41588-024-01763-1" target="_blank" rel="noopener" data-reference-source="1">Genome-wide meta-analyses of restless legs syndrome</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>.</p>
</section>
<section class="ilot" id="g25-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Comprendre ces troubles revient à reconnaître, pour chacun, ce qui est perturbé dans une chaîne normale : un circuit oscillant pour le tremblement, une hyperexcitabilité pour la myoclonie, un déséquilibre dopaminergique et martial pour les jambes sans repos, une perte d’inhibition pour l’homme raide.</p>
<h3>3.1 Tremblement</h3>
<p>Le tremblement physiologique est discret, habituellement invisible ; il devient pathologique lorsqu’il se voit à l’œil nu. Le <b>tremblement physiologique renforcé</b> (anxiété, fatigue, médicament, hyperthyroïdie) s’explique en partie par un mécanisme adrénergique périphérique : l’adrénaline injectée par voie veineuse augmente l’amplitude du tremblement physiologique, et ce renforcement est bloqué par le propranolol injecté dans l’artère du bras perfusé. Les bêtabloquants cardiosélectifs, comme l’aténolol ou le métoprolol, agissent nettement moins. Cette observation soutient le choix du propranolol, et non d’un bêtabloquant cardiosélectif, quand on cherche à agir sur un tremblement dépendant de l’adrénaline ; la ligne directrice ne le recommande toutefois pas de façon générale dans cette indication, mais au cas par cas.</p>
<p>Pour le tremblement essentiel, le <b>mécanisme n’est pas documenté</b> dans les sources lues. Le cours ne le reconstitue pas de mémoire ; il retient seulement que le tremblement suit un rythme propre, que sa fréquence et son amplitude varient en sens inverse, et que sa fréquence seule rarement suffit à poser le diagnostic.</p>
<h3>3.2 Myoclonie</h3>
<p>La myoclonie la plus fréquente est <b>corticale</b> : une hyperexcitabilité du cortex, attribuée à une dysfonction des interneurones inhibiteurs GABAergiques, déclenche la secousse, soit à l’action, soit en réponse à un stimulus sensitif. Le neurophysiologiste le démontre par la moyennisation rétrograde de l’électroencéphalogramme sur l’électromyogramme, qui révèle un transitoire cortical avant la secousse. Le type anatomique (cortical, cortico-sous-cortical, sous-cortical, spinal, propriospinal, périphérique) guide le traitement ; voir <button class="w" data-k="g25-myoclonie-class">classification anatomique et physiologique des myoclonies</button>.</p>
<h3>3.3 Syndrome des jambes sans repos</h3>
<p>La ligne directrice 2024 décrit une chaîne en trois maillons, résumée dans la figure 1. <b>Maillon génétique</b> : 164 loci identifiés par méta-analyse d’association pangénomique, dont MEIS1 et BTBD9. <b>Maillon martial</b> : le fer est abaissé dans le cerveau (ferritine basse et transferrine élevée dans le liquide cérébrospinal, fer réduit dans la substance noire en imagerie) alors que le fer sanguin peut être normal. <b>Maillon dopaminergique</b> : les agonistes dopaminergiques soulagent sans qu’il y ait de déficit dopaminergique réel ; la liaison D2 striatale est diminuée et la tyrosine hydroxylase augmentée, d’où un état présynaptique hyperdopaminergique et postsynaptique hypodopaminergique. Cette chaîne explique deux conduites : substituer le fer quand il manque, et exposer le patient à l’augmentation sous dopaminergiques, puisque l’on stimule un système déjà dérégulé.</p>
<figure><svg viewBox="0 0 640 180" role="img" aria-label="Figure 1 — Chaîne physiopathologique du syndrome des jambes sans repos" font-size="14"><rect x="8" y="50" width="130" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="170" y="50" width="130" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="332" y="50" width="130" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="494" y="50" width="130" height="70" rx="6" fill="none" stroke="currentColor" stroke-width="1.5"/><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M138 85h28m-5-4 5 4-5 4"/><path d="M300 85h28m-5-4 5 4-5 4"/><path d="M462 85h28m-5-4 5 4-5 4"/></g><g fill="currentColor" text-anchor="middle" font-size="26"><text x="73" y="95">1</text><text x="235" y="95">2</text><text x="397" y="95">3</text><text x="559" y="95">4</text></g></svg><figcaption>Figure 1 — Chaîne du syndrome des jambes sans repos. Schéma didactique original, non à l’échelle, d’après la ligne directrice DGN/DGSM 2024. Les flèches indiquent un enchaînement causal proposé, non un modèle unique démontré.</figcaption><ol><li>Terrain génétique (164 loci)</li><li>Fer cérébral abaissé</li><li>Dérégulation dopaminergique</li><li>Besoin impérieux, soir et repos</li></ol></figure>
<p>Dans le tremblement orthostatique, l’électromyogramme debout montre une activité de 13 à 18 Hz à forte cohérence entre les deux jambes ; dans la myoclonie orthostatique, il montre des bouffées irrégulières d’environ 50 ms. Ces deux enregistrements traduisent des générateurs différents et expliquent pourquoi l’examen clinique seul ne suffit pas.</p>
<h3>3.4 Syndrome de l’homme raide et akathisie</h3>
<p>Le syndrome de l’homme raide est une maladie auto-immune rare avec dysfonction de la transmission <b>GABAergique</b> ; les anticorps anti-GAD65, à titre élevé, sont présents chez la plupart des patients. Il en résulte une raideur axiale et proximale, des spasmes épisodiques et une hypersensibilité aux stimuli (bruit, toucher). L’<b>akathisie</b> survient sous antagonistes dopaminergiques et sous tétrabénazine, un déplétant présynaptique ; le mécanisme exact n’est pas détaillé dans les sources, mais la conduite qui en découle est simple : suspecter le médicament et le réduire.</p>
<div class="key"><b>Science → clinique.</b> Chez la patiente de la vignette, un fer cérébral bas peut coexister avec un fer sanguin normal : la ferritine sérique ne dispense pas de discuter la substitution quand elle est basse, et un dopaminergique traite le symptôme sans réparer la cause.</div>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.2.1,§2.7.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://doi.org/10.1038/s41588-024-01763-1" target="_blank" rel="noopener" data-reference-source="1">Genome-wide meta-analyses of restless legs syndrome</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5575623/" target="_blank" rel="noopener" data-reference-source="1">Myoclonic Disorders</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>; <a href="https://doi.org/10.1111/ene.70435" target="_blank" rel="noopener" data-reference-source="1">Systematic Review of Immune and Symptomatic Treatments for Stiff-Person Syndrome</a>.</p>

<section class="ilot" id="g25-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Chercher la cause d’un mouvement anormal est la seconde question du cours. Le tableau classe, pour chaque syndrome, les causes à rechercher en premier. Les listes complètes sont dans les fenêtres.</p>
<table class="t"><thead><tr><th>Syndrome</th><th>Causes à rechercher d’abord</th><th>Fenêtre</th></tr></thead><tbody><tr><td>Tremblement physiologique renforcé</td><td>Effet indésirable médicamenteux et hyperthyroïdie ; plus rarement intoxication, anxiété, fatigue</td><td><button class="w" data-k="g25-tremorigenes">Médicaments et toxiques tremorigènes (liste)</button></td></tr><tr><td>Myoclonie</td><td>Troubles métaboliques et médicaments (dont lithium) ; encéphalopathie hépatique pour l’astérixis ; maladies neurodégénératives</td><td><button class="w" data-k="g25-myoclonie-class">Myoclonies : classification et causes</button></td></tr><tr><td>Chorée non huntingtonienne</td><td>Auto-immune (lupus, syndrome des antiphospholipides, chorée gravidique), infectieuse, structurelle, métabolique (hyperglycémie non cétosique), médicamenteuse</td><td><button class="w" data-k="g25-chorees-causes">Causes des chorées non héréditaires</button></td></tr><tr><td>Syndrome des jambes sans repos</td><td>Carence en fer, urémie, neuropathie, médicaments aggravants (mirtazapine, neuroleptiques)</td><td><button class="w" data-k="g25-comorbidites">Comorbidités et médicaments aggravants du syndrome des jambes sans repos</button></td></tr><tr><td>Tics d’origine organique</td><td>Substances et affections médicales (DSM-5) ; causes précises non documentées</td><td><button class="w" data-k="g25-tics">Tics organiques et fonctionnels</button></td></tr></tbody></table>
<p>Pour le tremblement, deux causes dominent et se traitent : un <b>médicament</b> et l’<b>hyperthyroïdie</b>. Pour la chorée, la <b>polyglobulie de Vaquez</b>, le <b>lupus</b>, le <b>syndrome des antiphospholipides</b> et l’<b>hyperglycémie non cétosique</b> sont des causes souvent oubliées qui changent complètement la conduite. Pour les jambes sans repos, la carence en fer, qu’elle soit absolue ou cérébrale, est la cause la plus accessible au traitement.</p>
<div class="trap"><span class="k">Piège</span> Une chorée asymétrique ne désigne pas toujours une lésion structurelle : l’hyperglycémie non cétosique, la polyglobulie, le syndrome des antiphospholipides et certains médicaments peuvent l’imiter. La glycémie capillaire immédiate est un geste simple qui évite une imagerie injustifiée et oriente vers le traitement spécifique.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.2.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>.</p>
</section>
<section class="ilot" id="g25-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire sert à reconnaître le syndrome avant l’examen et à repérer la cause. Il porte d’abord sur la chronologie, puis sur les circonstances qui aggravent ou soulagent, enfin sur les médicaments.</p>
<h3>5.1 Antécédents et contexte</h3>
<ul><li><b>Début et évolution.</b> Un début brutal, une aggravation par paliers ou une durée de moins de trois ans écartent le tremblement essentiel retenu par le consensus de 2018 et orientent vers une cause acquise ; voir <button class="w" data-k="g25-te-def">critères du tremblement essentiel (Movement Disorder Society 2018)</button>.</li><li><b>Antécédents familiaux.</b> Ils soutiennent le tremblement essentiel (40 à 70 %) et le syndrome des jambes sans repos (40 à 92 % si début avant 45 ans) ; ils ne sont jamais obligatoires. Pour la chorée, l’anamnèse familiale n’exclut pas la maladie de Huntington : parents décédés jeunes, filiation incertaine ou allèles intermédiaires (27 à 35 répétitions CAG) peuvent la masquer ; voir <button class="w" data-k="g25-huntington">chorée de Huntington à ne pas manquer</button>.</li><li><b>Alcool.</b> Une amélioration par l’alcool est rapportée chez 50 à 90 % des patients avec tremblement essentiel : c’est un argument de soutien, non un critère.</li><li><b>Médicaments.</b> Liste complète, y compris les prescriptions récentes ou les sevrages : antiépileptiques, lithium, neuroleptiques, antidépresseurs, bêta-2-mimétiques, hormones thyroïdiennes, métoclopramide, amiodarone pour le tremblement (<button class="w" data-k="g25-tremorigenes">médicaments tremorigènes</button>) ; antagonistes dopaminergiques et métoclopramide pour la chorée et l’akathisie ; mirtazapine, neuroleptiques et antihistaminiques pour les jambes sans repos.</li><li><b>Maladies associées.</b> Hyperthyroïdie, diabète, lupus, maladie rénale, hépatopathie, carence en fer, grossesse.</li></ul>
<h3>5.2 Symptômes par fréquence et caractérisation</h3>
<table class="t"><thead><tr><th>Plainte</th><th>Question clé</th><th>Orientation</th></tr></thead><tbody><tr><td>Mains qui tremblent</td><td>Au repos, à la tenue d’un objet ou au geste vers la cible ?</td><td>Repos : parkinsonien ou syndrome de Holmes ; posture et action : tremblement essentiel ou renforcé ; geste vers la cible : cérébelleux</td></tr><tr><td>Instabilité debout, soulagée assis</td><td>Gêne uniquement debout, absente assis ou couché ?</td><td>Tremblement orthostatique primaire</td></tr><tr><td>Besoin de bouger les jambes</td><td>Repos, soir, soulagement par le mouvement ?</td><td>Cinq critères du syndrome des jambes sans repos</td></tr><tr><td>Secousses brèves</td><td>Au repos, à l’action, déclenchées par un contact ou un bruit ?</td><td>Myoclonie corticale, réflexe ou d’action</td></tr><tr><td>Mouvements irréguliers qui « dansent »</td><td>Aigus, subaigus ou chroniques ? Asymétriques ?</td><td>Aigu et asymétrique : lésion structurelle ou métabolique</td></tr><tr><td>Tic ou geste précédé d’une tension</td><td>Sensation prémonitoire, suppression possible ?</td><td>Tic organique ; si absente et début adulte, comportement tic-like fonctionnel</td></tr><tr><td>Agitation intérieure</td><td>Depuis quel médicament ? Pas de gêne sensitive ?</td><td>Akathisie médicamenteuse</td></tr><tr><td>Raideur du tronc, spasmes au bruit</td><td>Sursauts, chutes, hypersensibilité au toucher ?</td><td>Syndrome de l’homme raide</td></tr></tbody></table>
<h3>5.3 Formes typique et atypiques</h3>
<div class="two"><div class="card"><h4>Forme typique du tremblement essentiel</h4><p>Tremblement d’action bilatéral des mains, installé depuis au moins trois ans, avec ou sans tremblement de la tête, de la voix ou des jambes, sans autre signe neurologique. Les formes avec tremblement de repos ou marche en tandem perturbée sont dites « tremblement essentiel plus » ; la prise en charge est la même.</p></div><div class="card"><h4>Formes atypiques</h4><p>Début brutal, tremblement unilatéral ou limité à une tâche, tremblement orthostatique de plus de 12 Hz, tremblement de repos isolé : ces tableaux sortent du cadre du tremblement essentiel et imposent un bilan de cause.</p></div><div class="card"><h4>Forme typique des jambes sans repos</h4><p>Besoin impérieux de bouger les jambes, soir et nuit, au repos, soulagé par la marche, non expliqué par une autre affection. Décrire les symptômes avec les mots du patient aide beaucoup.</p></div><div class="card"><h4>Formes atypiques</h4><p>Sensations superficielles, douleur localisée, agitation de tout le corps ou prédominance de phénomènes moteurs sur les sensations : ce sont des drapeaux rouges qui évoquent une autre affection.</p></div></div>
<div class="key"><b>À retenir.</b> La même consultation peut contenir deux syndromes. Interroger sur les jambes la nuit, même quand la plainte principale est un tremblement, fait partie de l’anamnèse complète.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6530552/" target="_blank" rel="noopener" data-reference-source="1">Consensus Statement on the classification of tremors</a>; <a href="https://register.awmf.org/assets/guidelines/030-011l_S2k_Tremor_2022-08.pdf" target="_blank" rel="noopener" data-reference-source="1">Tremor, S2k-Leitlinie</a>, §2.1.1; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11539677/" target="_blank" rel="noopener" data-reference-source="1">Restless legs syndrome: abbreviated guidelines by the German sleep society and the German neuro</a>; <a href="https://rosenfluh.ch/arsmedici-2023-06/neue-leitlinie-zum-restless-legs-syndrom" target="_blank" rel="noopener" data-reference-source="1">Neue Leitlinie zum Restless-Legs-Syndrom</a>; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10666412/" target="_blank" rel="noopener" data-reference-source="1">Differential diagnosis of chorea</a>.</p>

<section class="ilot" id="g25-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, constantes, signes ciblés. Il vise à nommer le mouvement, à fixer sa condition d’activation et à repérer les signes associés qui requalifient le tremblement.</p>
<div class="two"><div class="card"><h4>Examen général et constantes</h4><p>Fréquence cardiaque et tension si un bêtabloquant est envisagé (bradycardie, bronchospasme) ; thyroïde (hyperthyroïdie) ; signes de maladie systémique ; état de conscience et de confusion devant des myoclonies ou un astérixis.</p></div><div class="card"><h4>Tremblement : conditions d’activation</h4><p>Repos : main pendante, détendue sur l’accoudoir. Posture : bras tendus. Cinétique simple : mouvements de haut en bas des mains bras tendus. Intentionnel : épreuve doigt-nez, transvaser de l’eau. Voir <button class="w" data-k="g25-mdsclass">conditions d’activation</button>.</p></div><div class="card"><h4>Signes associés du tremblement</h4><p>Marche en tandem, posture dystonique, bradykinésie, ataxie, neuropathie. Ils décident entre tremblement essentiel et « tremblement essentiel plus », ou signent un autre syndrome ; voir <button class="w" data-k="g25-te-plus">tremblement essentiel plus</button>.</p></div><div class="card"><h4>Myoclonie et astérixis</h4><p>Observer la secousse au repos, à l’action et au contact ; l’astérixis est une interruption brève du tonus à bras tendus, classique dans l’encéphalopathie hépatique. Voir <button class="w" data-k="g25-asterixis">astérixis et encéphalopathies métaboliques</button>.</p></div><div class="card"><h4>Chorée</h4><p>Mouvements rapides, irréguliers, qui passent d’un segment à l’autre ; ils persistent au repos et à l’action, augmentent avec le stress et cessent au sommeil profond. Distinguer de l’akathisie et des tics par la sensation prémonitoire.</p></div><div class="card"><h4>Jambes sans repos</h4><p>L’examen est souvent normal. On cherche une polyneuropathie (hypoesthésie en chaussettes, réflexes achilléens abolis, diminution du sens vibratoire), des varices, un œdème, une claudication. Voir <button class="w" data-k="g25-mimics">diagnostics différentiels des jambes sans repos</button>.</p></div><div class="card"><h4>Syndrome de l’homme raide</h4><p>Raideur axiale et proximale, spasmes au bruit ou au contact, chutes ; voir <button class="w" data-k="g25-stiffperson">syndrome de l’homme raide (formes, anticorps, traitement)</button>.</p></div><div class="card"><h4>Signes fonctionnels</h4><p>Entraînement de fréquence, distractibilité, co-contraction, synchronie avec un mouvement imposé : ils permettent le diagnostic positif d’un tremblement fonctionnel. Voir <button class="w" data-k="g25-fonctionnel">tremblement fonctionnel</button>.</p></div></div>
<div class="trap"><span class="k">Erreur fréquente</span> Considérer un tremblement fonctionnel comme un diagnostic d’exclusion. La ligne directrice le décrit comme un diagnostic positif, fondé sur des signes précis ; l’annonce empathique est déjà un premier temps du traitement.</div>
