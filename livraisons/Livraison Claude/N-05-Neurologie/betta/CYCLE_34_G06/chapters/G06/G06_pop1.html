<template data-pop="g06-sources" data-title="Sources et hiérarchie : quelle recommandation prime"><div class="lab">Définition</div><p><b>DGN</b> désigne la Société allemande de neurologie, qui a publié en 2021 la ligne directrice S1 « Hirnabszess » (AWMF 030/108) avec l’appui de la <b>SNG</b> (Société suisse de neurologie, W. Z’Graggen, Inselspital Berne). La <b>ESCMID</b> est la Société européenne de microbiologie clinique et de maladies infectieuses, auteur de la recommandation 2024 sur le diagnostic et le traitement de l’abcès cérébral chez l’enfant et l’adulte.</p><div class="lab">Hiérarchie</div><p>Aucune recommandation suisse propre à l’abcès cérébral n’a été trouvée. La ligne directrice de 2021, co-signée par la SNG, sert de socle suisse-européen ; sa validité est échue depuis le 31.12.2025 et elle est en révision. La recommandation européenne la plus récente est celle de l’ESCMID 2024. En cas de divergence, la source primaire la plus récente l’emporte, et la valeur de l’ancienne est rappelée.</p><div class="lab">Limite</div><p>Pour l’ESCMID, seul le résumé a été lu : les doses pédiatriques et les tableaux détaillés ne sont pas vérifiés. Aucune recommandation américaine n’est utilisée comme fondement d’une conduite.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue)</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-pl" data-title="Ponction lombaire : pourquoi elle est en règle exclue"><div class="lab">Question</div><p>Faut-il ponctionner le liquide cérébrospinal devant une suspicion d’abcès ? En règle, non. Le liquide est non spécifique : il est normal chez 16 % des patients, les leucocytes sont élevés chez 71 %, les protéines chez 58 %, et la culture n’est positive que chez 24 %. Le résultat ne change donc pas la décision.</p><div class="lab">Mécanisme et risque</div><p>Lorsqu’un abcès exerce un effet de masse, la pression dans le crâne est déjà élevée. Le risque redouté, cité par la ligne directrice, est l’engagement transtentoriel ou amygdalien, ou la rupture de l’abcès. Dans la série citée, une aggravation clinique liée à la ponction est notée chez 7 % des patients (76 sur 1030).</p><div class="lab">Conduite</div><p>Réaliser l’IRM avec diffusion d’abord. Si un effet de masse existe, la ponction est <b>contre-indiquée</b>. Le germe s’obtient par aspiration ou exérèse et par hémocultures.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §3.2</a>.</p></template>
<template data-pop="g06-hemocultures" data-title="Hémocultures : avant l’antibiotique"><div class="lab">Rôle</div><p>Les hémocultures identifient au moins un germe dans 28 % des abcès cérébraux ; elles sont prélevées <b>avant la première dose d’antibiotique</b>. Elles ont une valeur particulière lorsque la chirurgie ne peut pas être réalisée en quelques heures : elles permettent d’instaurer le traitement empirique sans perdre l’orientation microbiologique.</p><div class="lab">Limite</div><p>Un résultat négatif n’exclut pas un abcès (72 % des patients ont des hémocultures négatives). Dans l’abcès épidural spinal, la bactériémie à <i>S. aureus</i> impose en plus une échocardiographie.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §3.1, §5.8</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a>.</p></template>
<template data-pop="g06-sepi-clinique" data-title="Abcès épidural spinal : présentation et pièges"><div class="lab">Présentation</div><p>La plupart des patients ont une douleur rachidienne localisée et intense. À la présentation, la rachialgie est présente chez 75 % des patients, la sensibilité rachidienne chez 58 %, la faiblesse musculaire chez 40 %, la douleur irradiée chez 38 %, les troubles sensitifs chez 36 %, la fièvre chez 32 %, les troubles vésico-sphinctériens et la paralysie chacun chez 27 %.</p><div class="lab">Pièges</div><p>La triade douleur, fièvre et déficit manque souvent au premier contact. Soixante-quinze pour cent des cas sont d’abord mal diagnostiqués, parfois pris pour une douleur banale ou une pneumonie. Le diabète, la toxicomanie intraveineuse, la bactériémie, l’alcoolisme, un traumatisme, l’immunosuppression et les gestes rachidiens sont des facteurs de risque.</p><div class="lab">Décision</div><p>Une rachialgie intense avec facteur de risque justifie une IRM avec gadolinium avant l’apparition du déficit, car le pronostic dépend de la durée du déficit avant la chirurgie.</p><p class="src">Références : <a href="https://doi.org/10.1093/qjmed/hcm100" target="_blank" rel="noopener">Sendi et al., QJM 2008</a> ; <a href="https://doi.org/10.1007/s00586-011-1838-y" target="_blank" rel="noopener">Zimmerer et al., Eur Spine J 2011</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014, Tab. 1</a>.</p></template>
<template data-pop="g06-codage" data-title="Codage CIM-10-GM : G06 et frontière G07*"><div class="lab">Contenu</div><p>G06.0 regroupe les abcès et granulomes intracrâniens (abcès cérébral, y compris otogène et cérébelleux, abcès ou granulome intracrânien épidural, extradural ou sous-dural). G06.1 regroupe leurs équivalents intrarachidiens. G06.2 est réservé à l’abcès extradural et sous-dural sans précision de localisation. Le germe se code à part par B95–B98.</p><div class="lab">Frontière</div><p>Les abcès cérébraux amibien, gonococcique et tuberculeux, le granulome schistosomien et le tuberculome relèvent de G07*, avec le code de la maladie causale marqué d’une croix. Le catalogue de ce dépôt reste en CIM-10-GM 2024 ; la cartographie CIM-11 n’est pas établie ici.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, G06 et G07*</a> ; <a href="https://www.bfs.admin.ch/bfs/fr/home/statistiques/sante/nomenclatures/medsta.html" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 (fr), G06</a>.</p></template>
<template data-pop="g06-stades" data-title="Les quatre stades de Britt et Enzmann"><div class="lab">Tableau</div><table class="t"><tr><th>Stade</th><th>Délai</th><th>Imagerie</th><th>Conséquence</th></tr><tr><td>Cérébrite précoce</td><td>Jours 1 à 3</td><td>Hypodensité ou hypo-T1 mal limitée</td><td>Pas de collection : traitement conservateur</td></tr><tr><td>Cérébrite tardive</td><td>Jours 4 à 8</td><td>Anneau flou</td><td>Idem</td></tr><tr><td>Capsule précoce</td><td>Jours 9 à 13</td><td>Anneau net</td><td>Aspiration possible</td></tr><tr><td>Capsule tardive</td><td>À partir du jour 13</td><td>Capsule visible sans contraste (hyper-T1)</td><td>Aspiration ou exérèse selon le cas</td></tr></table><div class="lab">Limite</div><p>Ces délais sont des moyennes. L’ESCMID et la ligne directrice utilisent l’aspect d’imagerie et la clinique, non l’horloge seule, pour décider.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §3.1</a>.</p></template>
<template data-pop="g06-isi" data-title="Imaging Severity Index"><div class="lab">Définition</div><p>Score pronostique d’imagerie qui combine le nombre de lésions, leur localisation, le diamètre maximal, l’œdème et la déviation de la ligne médiane. Il sert à estimer la gravité et le pronostic.</p><div class="lab">Limite</div><p>Les sources lues ne donnent pas les seuils du score ; il est cité sans valeur numérique.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §7</a>.</p></template>
<template data-pop="g06-anatomie-note" data-title="Formes des collections : renvoi au panneau Sciences"><p>La figure 1 du panneau Sciences, onglet Anatomie, représente la forme biconvexe de la collection épidurale, la forme en croissant de la collection sous-durale et la lésion arrondie encapsulée du parenchyme. Elle sert à relier la forme vue à l’imagerie à la vitesse d’extension et à l’urgence.</p></template>
<template data-pop="g06-microbio" data-title="Culture et PCR : pourquoi la culture sous-estime les germes"><div class="lab">Constat</div><p>Sur 20 patients, la PCR 16S a trouvé 72 souches contre 22 par culture, jusqu’à 16 espèces par abcès. Des germes restent viables après le début des antibiotiques.</p><div class="lab">Conséquences</div><p>Prélever le pus tôt ; demander une PCR (ARN ribosomal 16S, panfongique, spécifique) lorsque les cultures sont négatives (ESCMID : conditionnelle, preuve modérée) ; maintenir une couverture des anaérobies même si seuls des aérobies poussent.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §4</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-penetration" data-title="Pénétration des antibiotiques dans le système nerveux central"><p>Ceftriaxone : jusqu’à 25 % du taux plasmatique dans le liquide cérébrospinal en cas de méningite, 2 % sans inflammation. Méropénem : environ 20 % du plasma chez l’enfant méningitique. Métronidazole : concentration équivalente au sérum dans l’abcès cérébral. Vancomycine : passage faible sans inflammation méningée. Céfotaxime : concentrations efficaces dans le pus. Ces données viennent de populations différentes et ne se comparent qu’avec précaution.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.8</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener">information professionnelle suisse Ceftriaxon Labatec®, juin 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680480180251" target="_blank" rel="noopener">information professionnelle suisse Metronidazol B. Braun, février 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680624190016" target="_blank" rel="noopener">information professionnelle suisse Meropenem Fresenius, février 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680572360035" target="_blank" rel="noopener">information professionnelle suisse Vancomycine Sandoz®, mars 2026</a>.</p></template>
<template data-pop="g06-voies" data-title="Voies d’infection et foyers à chercher"><table class="t"><tr><th>Voie</th><th>Foyer</th><th>Part dans la série</th></tr><tr><td>Contiguïté</td><td>Otite ou mastoïdite ; sinusite ; méningite</td><td>33 % ; 10 % ; 6 %</td></tr><tr><td>Hématogène</td><td>Endocardite ; poumon ; dents</td><td>13 % ; 8 % ; 5 % (total 33 %)</td></tr><tr><td>Inoculation</td><td>Traumatisme crânien ; neurochirurgie</td><td>14 % ; 9 %</td></tr><tr><td>Cryptogène</td><td>Aucun</td><td>10 à 25 %</td></tr></table><p>Le rôle des foyers oto-rhino-laryngologiques diminue dans les pays développés. Les terrains à risque sont l’immunodépression et le shunt droite-gauche.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §2</a>.</p></template>
<template data-pop="g06-triade" data-title="La triade céphalée, fièvre et déficit focal"><p>La triade est présente dans environ 20 % des cas seulement. Isolément, la céphalée est présente chez environ 70 %, la fièvre chez environ 50 %, les crises chez environ 25 % et les signes focaux ou la baisse de vigilance chez 30 à 60 %. Son absence n’exclut donc pas le diagnostic.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §2</a> ; <a href="https://doi.org/10.1212/WNL.0000000000000172" target="_blank" rel="noopener">Brouwer et al., Neurology 2014</a>.</p></template>
<template data-pop="g06-irm-diffusion" data-title="IRM avec diffusion : principe, performance et pièges"><div class="lab">Principe</div><p>Le protocole comprend le T1 avant et après gadolinium, le T2 ou le FLAIR et la séquence de diffusion. Un abcès typique associe un anneau rehaussé à une restriction de diffusion centrale.</p><div class="lab">Performance</div><p>Sensibilité et spécificité d’environ 95 %. L’ESCMID recommande l’IRM (forte, preuve élevée). La tomodensitométrie seule ne suffit pas.</p><div class="lab">Pièges</div><p>Des métastases mucineuses et le glioblastome peuvent restreindre la diffusion ; l’aspergillome montre une restriction annulaire sur la face interne de la capsule ; les bulles gazeuses sont pathognomoniques mais rares.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §3.1</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-mnemo" data-title="Règle des deux « avant » (aide pédagogique, non critère officiel)"><p><b>Imagerie avant ponction lombaire, hémocultures avant antibiotique, puis drainage et foyer.</b> Cette phrase résume l’ordre des gestes devant un abcès suspecté : l’IRM juge de la contre-indication à la ponction ; les hémocultures préservent l’orientation microbiologique ; le drainage donne le germe ; le foyer source est traité pour éviter la récidive.</p><p><i>Aide pédagogique, non critère officiel.</i></p></template>
<template data-pop="g06-ventriculite" data-title="Ventriculite : une complication de la rupture intraventriculaire"><p>Un abcès proche des ventricules peut se rompre dans le système ventriculaire. La cohorte internationale rétrospective de 2026 trouve une mortalité à un an de 33,7 % pour la ventriculite toutes causes confondues et de 27,6 % lorsqu’elle complique un abcès. La rupture est un facteur péjoratif et une urgence.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awaf178" target="_blank" rel="noopener">Luque Paz et al., Brain 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §7</a>.</p></template>
<template data-pop="g06-prelevement" data-title="Prélèvement de pus : conditions pour la microbiologie"><div class="lab">Procédure</div><p>Le pus est prélevé par aspiration ou exérèse, dans une seringue sans air et fermée. Dix millilitres sont répartis dans des flacons d’hémoculture aérobie et anaérobie. L’examen direct, la culture aérobie et anaérobie et la PCR (ARN ribosomal 16S, panfongique, spécifique) sont demandés.</p><div class="lab">Raison</div><p>Les infections sont souvent polymicrobiennes et anaérobies : une seringue sans air et un flacon anaérobie permettent de les cultiver. La PCR complète les cultures négatives (ESCMID : conditionnelle, preuve modérée).</p><div class="lab">Moment</div><p>Si le patient est stable, la ponction précède la première dose d’antibiotique ; des germes viables persistent toutefois souvent après son début.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §3.1, §4, §5.8</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="pareto-g06-clinique" data-title="Pareto — Pathologie : définitions, clinique et diagnostic"><p class="ratio" data-cover="g06-0,g06-1,g06-2,g06-3,g06-4,g06-5,g06-6,g06-7"></p><ul><li>Le groupe G06 réunit les abcès du crâne (parenchyme, espace sous-dural, espace épidural) et du canal rachidien. La forme dépend de l’adhérence de la dure-mère : biconvexe en épidural, en nappe en sous-dural.</li><li>L’abcès cérébral évolue de la cérébrite à la capsule en environ deux semaines ; incidence de 0,3 à 0,9 pour 100 000 par an, homme jeune, cause favorisante dans 86 % des cas, cryptogène dans 10 à 25 %.</li><li>Streptocoques (35 à 50 %) et anaérobies (15 à 40 %) dominent ; les infections sont souvent polymicrobiennes et la culture sous-estime les germes.</li><li>Céphalée dans 70 % des cas, fièvre dans 50 %, triade complète dans 20 % seulement.</li><li>IRM avec gadolinium et diffusion (sensibilité et spécificité d’environ 95 %) avant toute ponction lombaire ; le diagnostic final repose sur le pus.</li></ul></template>
<template data-pop="pareto-g06-ttt" data-title="Pareto — Urgences et prise en charge"><p class="ratio" data-cover="g06-8,g06-9,g06-10,g06-11,g06-12"></p><ul><li>Urgences : empyème sous-dural (chirurgie absolue), engagement ou rupture, état de mal, ventriculite, abcès épidural spinal avec déficit.</li><li>Drainer chaque fois que faisable (ESCMID 2024) ; seuil historique de 2,5 cm (DGN/SNG 2021) ; traitement conservateur seul pour petite lésion, cérébrite ou lésions profondes, sous conditions.</li><li>Schéma communautaire : céphalosporine de troisième génération et métronidazole ; ajouter vancomycine, carbapénème, cotrimoxazole et voriconazole selon le terrain ; anaérobies toujours couverts.</li><li>Durée de 6 à 8 semaines (ESCMID) contre 4 à 8 (2021) ; dexaméthasone seulement si œdème menaçant ; pas de prophylaxie antiépileptique primaire.</li><li>Abcès épidural spinal : IRM avec gadolinium, décompression neurochirurgicale en première intention, rachialgie avant déficit.</li></ul></template>
<template data-pop="pareto-g06-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="g06-13,g06-14,g06-15"></p><ul><li>Létalité de 5 à 20 % (jusqu’à 60 % pour les abcès fongiques) ; épilepsie de novo chez 32 % des survivants.</li><li>Terrain : immunodépression (spectre élargi), infection par le virus de l’immunodéficience humaine (toxoplasmose), méningite (Streptococcus anginosus), neurochirurgie (vancomycine et méropénem).</li><li>Pas de critère formel validé : lésion annulaire avec restriction de diffusion, microbiologie du pus, contexte favorisant.</li></ul></template>
<template data-pop="pareto-g06-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g06-e-1,g06-e-2,g06-e-3,g06-e-4,g06-e-5"></p><ul><li>Référence : IRM avec gadolinium et diffusion, puis culture et PCR du pus ; hémocultures avant antibiotique (28 %).</li><li>La protéine C réactive (élevée dans 60 à 90 %) et le liquide cérébrospinal (normal dans 16 %) ne tranchent pas ; la ponction lombaire est contre-indiquée en cas d’effet de masse (aggravation chez 7 %).</li><li>Chercher le foyer (dents, ORL, échocardiographie transœsophagienne, thorax) et dépister le virus de l’immunodéficience humaine et le diabète.</li></ul></template>
<template data-pop="pareto-g06-s-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="g06-s-anat-body"></p><ul><li>Dure-mère adhérente à l’os → collection épidurale biconvexe ; absence d’adhérence sous-durale → nappe en croissant et urgence.</li></ul></template>
<template data-pop="pareto-g06-s-histo" data-title="Pareto — Histologie"><p class="ratio" data-cover="g06-s-histo-body"></p><ul><li>Cérébrite puis nécrose puis capsule en environ deux semaines : le stade décide du drainage.</li></ul></template>
<template data-pop="pareto-g06-s-micro" data-title="Pareto — Microbiologie"><p class="ratio" data-cover="g06-s-micro-body"></p><ul><li>La PCR 16S révèle 72 souches contre 22 par culture : conserver une couverture des anaérobies.</li></ul></template>
<template data-pop="pareto-g06-s-pk" data-title="Pareto — Pharmacocinétique"><p class="ratio" data-cover="g06-s-pk-body"></p><ul><li>Métronidazole diffuse comme le sérum ; ceftriaxone jusqu’à 25 % avec méningite ; vancomycine peu : la diffusion guide la molécule.</li></ul></template>
<template data-pop="pareto-g06-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g06-p-1,g06-p-2,g06-p-3,g06-p-4,g06-p-5"></p><ul><li>Base : céphalosporine de troisième génération et métronidazole ; doses de la ligne directrice supérieures à l’information professionnelle pour la ceftriaxone.</li><li>Alertes : calcium avec la ceftriaxone, métronidazole plus de 10 jours, vancomycine (dosage, néphrotoxicité).</li><li>À éviter : retarder l’antibiotique d’un patient grave, omettre les anaérobies, ponction avec effet de masse, prophylaxie antiépileptique primaire.</li></ul></template>
