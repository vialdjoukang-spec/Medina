<template data-pop="g06-sepi-irm" data-title="Abcès épidural spinal : imagerie et bilan"><p>L’IRM avec gadolinium est la méthode la plus sensible et la plus spécifique. Les paramètres inflammatoires sont élevés mais non spécifiques. En cas de bactériémie à <i>S. aureus</i>, une échocardiographie est indiquée. Le germe le plus fréquent est <i>S. aureus</i> (50 % dans la série bâloise), suivi des bacilles à Gram négatif et des streptocoques.</p><p class="src">Références : <a href="https://doi.org/10.1093/qjmed/hcm100" target="_blank" rel="noopener">Sendi et al., QJM 2008</a> ; <a href="https://doi.org/10.1007/s00586-011-1838-y" target="_blank" rel="noopener">Zimmerer et al., Eur Spine J 2011</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a>.</p></template>
<template data-pop="g06-sepi-ttt" data-title="Abcès épidural spinal : décision et limites des sources"><div class="lab">Décision</div><p>La décompression neurochirurgicale est le traitement de choix dans la majorité des cas. L’aspiration guidée par scanner ou les antibiotiques seuls sont possibles dans des cas choisis. La décision est immédiate et concertée entre infectiologie, radiologie et chirurgie rachidienne.</p><div class="lab">Suites</div><p>Dans la série bâloise, les 16 abcès survenus après chirurgie rachidienne ont nécessité plusieurs interventions, avec instrumentation chez 5 patients. La létalité est de 2 à 20 % et la récupération complète de 61 %.</p><div class="lab">Lacunes</div><p>Aucune recommandation européenne n’a été lue sur la durée d’antibiothérapie et sur le choix empirique ; l’empyème rachidien sous-dural et l’abcès intramédullaire ne sont pas documentés.</p><p class="src">Références : <a href="https://doi.org/10.1093/qjmed/hcm100" target="_blank" rel="noopener">Sendi et al., QJM 2008</a> ; <a href="https://doi.org/10.1007/s00586-011-1838-y" target="_blank" rel="noopener">Zimmerer et al., Eur Spine J 2011</a> ; <a href="https://content.ugeskriftet.dk/sites/default/files/scientific_article_files/2014-12/artikel_12923.pdf" target="_blank" rel="noopener">Skaaby et al., Ugeskr Læger 2014</a>.</p></template>
<template data-pop="g06-divergences" data-title="Divergences entre la ligne directrice de 2021 et l’ESCMID 2024"><table class="t"><tr><th>Question</th><th>DGN/SNG 2021</th><th>ESCMID 2024</th><th>Retenu</th></tr><tr><td>Durée</td><td>4 à 8 semaines</td><td>6 à 8 semaines (conditionnelle, faible)</td><td>ESCMID, plus récente</td></tr><tr><td>Indication chirurgicale</td><td>Aspiration ou exérèse à partir de 2,5 cm</td><td>Aspiration ou exérèse chaque fois que faisable, sauf toxoplasmose (forte, faible)</td><td>ESCMID, appuyée par la cohorte danoise de 2026</td></tr><tr><td>Relais oral</td><td>Envisagé par 50 % des experts</td><td>Non tranché : données insuffisantes ; consolidation orale en routine non recommandée</td><td>ESCMID : pas de relais précoce en routine</td></tr></table><p>Règle appliquée : la source primaire applicable la plus récente l’emporte ; l’ancienne valeur reste lisible ici. La ligne directrice de 2021 n’est plus à jour sur le plan formel (validité échue au 31.12.2025).</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue)</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a> ; <a href="https://doi.org/10.1093/cid/ciaf304" target="_blank" rel="noopener">Eriksen et al., Clin Infect Dis 2026</a>.</p></template>
<template data-pop="g06-aspiration" data-title="Aspiration de l’abcès"><div class="lab">Principe</div><p>L’aspiration, avec ou sans drainage, sous neuronavigation (stéréotaxie ou échographie) est la procédure standard. Elle expose à plus de réaspirations que l’exérèse, mais à moins d’hémorragies.</p><div class="lab">Indication</div><p>Dès 2,5 cm selon la ligne directrice de 2021 (stéréotaxie dès 1 cm) ; chaque fois que faisable selon l’ESCMID 2024. Le prélèvement donne le germe : examen direct, culture aérobie et anaérobie, PCR.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.2–5.3</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-exerese" data-title="Exérèse avec capsule"><p>Indiquée en cas d’abcès cloisonné, de corps étranger ou d’esquilles, de fistule, de fracture à reprendre ou de contenu ferme (champignons, <i>Nocardia</i>, <i>Actinomyces</i>). Non indiquée au stade de cérébrite, en cas d’abcès multiples, de proximité d’aires éloquentes, de noyaux gris ou du tronc. La prudence s’impose en cas de cardiopathie congénitale avec chirurgie ouverte. L’exérèse expose davantage à des hémorragies que l’aspiration.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.3–5.5</a>.</p></template>
<template data-pop="g06-conservateur" data-title="Traitement conservateur seul"><div class="lab">Admis si</div><p>L’abcès est petit (2,5 cm ou moins), multiple ou profond, ou au stade de cérébrite.</p><div class="lab">Conditions</div><p>Diagnostic certain, effet de masse faible, pas d’obstruction des voies du liquide cérébrospinal, spectre bactérien prévisible. Un abcès proche des ventricules ou accessible relève plutôt de la chirurgie.</p><div class="lab">Donnée récente</div><p>Dans une cohorte danoise de 558 adultes, la stratégie non opératoire est associée à un risque relatif ajusté de décès de 2,47 et de rupture de 2,25 ; 36 % des patients non opérés ont finalement été opérés. Il s’agit d’une analyse observationnelle emboîtée dans une cohorte.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.1</a> ; <a href="https://doi.org/10.1093/cid/ciaf304" target="_blank" rel="noopener">Eriksen et al., Clin Infect Dis 2026</a>.</p></template>
<template data-pop="g06-empyeme" data-title="Empyème sous-dural"><p>Indication opératoire absolue et urgente. Des trous de trépan avec lavage suffisent si l’empyème est récent ; une craniotomie est nécessaire s’il est ancien ou cloisonné. Deux tiers siègent sur la convexité, un tiers dans la région interhémisphérique (faux). L’abcès épidural intracrânien se traite par trépanation et son pronostic est meilleur.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.6</a>.</p></template>
<template data-pop="g06-duree" data-title="Durée de l’antibiothérapie et relais oral"><p>La ligne directrice de 2021 retient 4 à 8 semaines ; l’ESCMID 2024 recommande 6 à 8 semaines (conditionnelle, faible). L’ESCMID ne recommande pas de relais oral précoce, faute de données, ni de consolidation orale après au moins six semaines par voie intraveineuse en routine (conditionnelle, très faible). Une enquête auprès de 310 infectiologues européens rapporte une durée intraveineuse médiane de 4 semaines après aspiration, 4 après exérèse et 6 en traitement conservateur ; au Royaume-Uni en 2026, 77 % envisagent un relais oral avant 6 semaines.</p><p>Le métronidazole intraveineux prévoit un passage au relais oral dès que possible (information professionnelle) ; cette indication de produit n’est pas une recommandation de durée.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.8</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a> ; <a href="https://doi.org/10.1007/s10096-026-05522-4" target="_blank" rel="noopener">Perea et al., Eur J Clin Microbiol Infect Dis 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680480180251" target="_blank" rel="noopener">information professionnelle suisse Metronidazol B. Braun, février 2026</a>.</p></template>
<template data-pop="g06-corticoides" data-title="Glucocorticoïdes : œdème périfocal et engagement"><p>L’ESCMID recommande les glucocorticoïdes en cas de symptômes sévères liés à l’œdème périfocal ou d’engagement imminent (forte, faible). La ligne directrice propose la dexaméthasone pendant 3 à 8 jours en cas d’œdème marqué, d’abcès multiples œdémateux partiellement opérables ou de localisation à risque d’hydrocéphalie (cervelet), avec décroissance rapide. Une méta-analyse ne montre pas de réduction significative de la mortalité (risque relatif 0,94 ; intervalle de confiance à 95 % de 0,64 à 1,37).</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.9</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-d-cefotaxime" data-title="Céfotaxime : monographie limitée au dossier"><div class="lab">Classe</div><p>Céphalosporine de troisième génération.</p><div class="lab">Preuves et place</div><p>Atteint des concentrations efficaces dans le pus ; cité à 4 × 3 g/jour par voie intraveineuse dans le schéma communautaire de la ligne directrice de 2021. L’ESCMID recommande une céphalosporine de troisième génération avec le métronidazole (forte, preuve modérée).</p><div class="lab">Lacune</div><p>Information professionnelle suisse non lue : effets indésirables, contre-indications et surveillance ne sont pas documentés ici.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), Tab. 2, §5.8</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-d-ceftriaxone" data-title="Ceftriaxone : posologie, précautions et divergence"><div class="lab">Posologie</div><p>Adulte : 1 à 2 g une fois par jour, jusqu’à 4 g/jour en cas d’infection sévère. Enfant : 20 à 80 mg/kg/jour ; méningite de l’enfant : 100 mg/kg/jour (maximum 4 g). La ligne directrice de 2021 cite 2 × 2 g/jour, ce qui dépasse la posologie usuelle ; l’abcès cérébral n’est pas une indication libellée.</p><div class="lab">Contre-indications et précautions</div><p>Contre-indiquée chez le prématuré jusqu’à 41 semaines post-menstruelles et chez le nouveau-né recevant du calcium intraveineux ; ne pas mélanger avec des solutions calciques. Une encéphalopathie est possible chez le sujet âgé ou l’insuffisant rénal : envisager l’arrêt.</p><div class="lab">Pénétration</div><p>Jusqu’à 25 % du taux plasmatique dans le liquide cérébrospinal en cas de méningite, 2 % sans inflammation.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener">information professionnelle suisse Ceftriaxon Labatec®, juin 2025</a> ; <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), Tab. 2</a>.</p></template>
<template data-pop="g06-d-metronidazole" data-title="Métronidazole intraveineux : indication « abcès cérébral »"><div class="lab">Indication</div><p>L’information professionnelle suisse libelle l’indication « abcès cérébral » (anaérobies).</p><div class="lab">Posologie</div><p>Adulte : dose de charge de 15 mg/kg puis 7,5 mg/kg ; la ligne directrice de 2021 cite 3 × 0,5 g/jour. Passage au relais oral dès que possible.</p><div class="lab">Surveillance et effets indésirables</div><p>Au-delà de 10 jours, contrôler l’hémogramme et surveiller les neuropathies périphériques et centrales. Arrêter en cas de convulsions, de myoclonies, d’ataxie ou de confusion.</p><div class="lab">Pénétration</div><p>Le métronidazole diffuse dans l’abcès cérébral à une concentration équivalente à celle du sérum.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680480180251" target="_blank" rel="noopener">information professionnelle suisse Metronidazol B. Braun, février 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.8</a>.</p></template>
<template data-pop="g06-d-meropenem" data-title="Méropénem : posologie et précautions"><div class="lab">Posologie</div><p>Méningite de l’adulte : 2 g toutes les 8 heures (expérience adulte très limitée), maximum 6 g/jour. Enfant : 40 mg/kg toutes les 8 heures, maximum 6000 mg/jour (tableau « méningite, abcès cérébral »). La ligne directrice cite 3 × 2 g/jour pour les abcès post-opératoires ou nosocomiaux.</p><div class="lab">Effets indésirables</div><p>Convulsions chez 0,5 % des patients dans les essais ; adaptation à la fonction rénale. Le liquide cérébrospinal atteint environ 20 % du plasma chez l’enfant méningitique.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680624190016" target="_blank" rel="noopener">information professionnelle suisse Meropenem Fresenius, février 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), Tab. 2</a>.</p></template>
<template data-pop="g06-d-vancomycine" data-title="Vancomycine : posologie, dosage et toxicité"><div class="lab">Posologie</div><p>12 ans et plus : 15 à 20 mg/kg toutes les 8 à 12 heures (maximum 2 g par dose), dose de charge de 25 à 30 mg/kg si l’infection est grave. Enfant : 10 à 15 mg/kg toutes les 6 heures. La ligne directrice cite 2 × 1 g/jour.</p><div class="lab">Surveillance</div><p>Dosages sériques : creux de 15 à 20 mg/l en cas de <i>S. aureus</i> résistant à la méticilline, ou ratio aire sous la courbe sur concentration minimale inhibitrice de 400 à 600. Perfusion continue (cible de 20 à 25 mg/l) : environ 50 % d’insuffisance rénale aiguë en moins.</p><div class="lab">Risques</div><p>Néphrotoxicité, ototoxicité, réaction à une perfusion trop rapide. Le passage dans le système nerveux central est faible sans inflammation méningée.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680572360035" target="_blank" rel="noopener">information professionnelle suisse Vancomycine Sandoz®, mars 2026</a> ; <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.8</a>.</p></template>
<template data-pop="g06-d-terrain" data-title="Anti-infectieux du terrain immunodéprimé et de la toxoplasmose"><p>Après greffe ou chimiothérapie, la ligne directrice ajoute au schéma de base du cotrimoxazole (2 × 0,96 g/jour) et du voriconazole (2 × 0,2 g/jour). Pour <i>Nocardia</i> : cotrimoxazole, linézolide, méropénem ou amoxicilline-acide clavulanique, durée médiane 380 jours. Pour <i>Aspergillus</i> et <i>Scedosporium</i> : voriconazole. Pour <i>Candida</i> : amphotéricine B liposomale 5 mg/kg/jour avec flucytosine. Pour un cryptococcome : amphotéricine B avec flucytosine pendant au moins six semaines, puis fluconazole. Toxoplasmose : pyriméthamine avec sulfadiazine, ou pyriméthamine avec clindamycine, ou cotrimoxazole.</p><div class="lab">Lacune</div><p>Les informations professionnelles suisses de ces produits n’ont pas été lues : leurs effets indésirables, interactions et contre-indications ne sont pas documentés ici.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.8, Tab. 2</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-d-dexamethasone" data-title="Dexaméthasone : monographie limitée au dossier"><div class="lab">Posologie</div><p>Par exemple 40 mg puis jusqu’à 3 × 8 mg/jour pendant 3 à 8 jours, avec décroissance rapide.</p><div class="lab">Preuves</div><p>Pas de réduction significative de la mortalité (risque relatif 0,94 ; intervalle de confiance à 95 % de 0,64 à 1,37). Indication : œdème périfocal sévère, engagement menaçant, localisation à risque d’hydrocéphalie.</p><div class="lab">Lacune</div><p>Information professionnelle suisse non lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §5.9</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a>.</p></template>
<template data-pop="g06-d-levetiracetam" data-title="Lévétiracétam : monographie limitée au dossier"><p>Cité par la ligne directrice comme exemple d’antiépileptique à débuter dès la première crise ; pas de prophylaxie primaire (ESCMID : conditionnelle, très faible). L’épilepsie de novo touche 32 % des survivants à 30 jours dans la cohorte danoise, contre 2 % chez les témoins. Posologie, effets indésirables et interactions : information professionnelle suisse non lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-108l_S1_Hirnabszess_2021-04-abgelaufen.pdf" target="_blank" rel="noopener">ligne directrice S1 DGN avec SNG, Hirnabszess, 2021 (validité échue), §6.3</a> ; <a href="https://doi.org/10.1016/j.cmi.2023.08.016" target="_blank" rel="noopener">ESCMID 2024, abcès cérébral (résumé)</a> ; <a href="https://doi.org/10.1093/cid/ciz1153" target="_blank" rel="noopener">Bodilsen et al., Clin Infect Dis 2020</a>.</p></template>
