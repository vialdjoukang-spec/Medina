<section class="ilot" id="g36-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 41 ans consulte pour une baisse de vision de l’œil droit installée en quatre jours, avec une douleur aux mouvements oculaires. Depuis deux jours, elle présente des nausées et un hoquet qui ne cèdent pas. Le troisième jour, ses jambes s’affaiblissent. L’imagerie par résonance magnétique de la moelle montre une lésion qui s’étend sur plus de trois segments vertébraux. Ces données pédagogiques servent à poser trois questions : quel diagnostic évoquer, quel prélèvement réaliser avant tout traitement, et quelle urgence thérapeutique s’impose.</p>
<p>Une névrite optique associée à une myélite et à un syndrome de l’area postrema évoque la <button class="w" data-k="g36-nmosd">neuromyélite optique (définition et périmètre)</button>. La recherche des anticorps anti-aquaporine 4 se fait dans le sérum, <b>avant</b> les échanges plasmatiques, l’immunoadsorption, les corticoïdes ou toute immunosuppression, car ces traitements peuvent, rarement, rendre le test faussement négatif. La poussée relève d’un traitement immédiat : plus l’aphérèse est précoce, meilleure est la chance de récupération complète.</p>
<div class="key"><b>À retenir.</b> Le diagnostic, le prélèvement sérologique et le traitement de la poussée se déroulent en parallèle. Attendre le résultat de la sérologie pour traiter fait perdre le bénéfice du délai ; traiter sans avoir prélevé le sérum expose à un faux négatif.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10770020/" target="_blank" rel="noopener">NEMOS 2024, deuxième partie : traitement de la poussée et traitement de fond (Kümpfel et al., J Neurol 2024)</a>.</p>
</section>
<section class="ilot" id="g36-1"><h2><span class="n">1</span>Définition, classification et codage</h2>
<p>La catégorie G36 de la CIM-10-GM 2024, intitulée « autres affections démyélinisantes aiguës disséminées », regroupe quatre sous-codes : <b>G36.0</b> neuromyélite optique (Devic), <b>G36.1</b> leucoencéphalite hémorragique aiguë et subaiguë (Hurst), <b>G36.8</b> autres affections démyélinisantes aiguës disséminées précisées et <b>G36.9</b> forme sans précision. La catégorie exclut l’encéphalite et l’encéphalomyélite postinfectieuses sans précision (G04.8). Le code G36.0 inclut la démyélinisation au cours d’une névrite optique et exclut la névrite optique sans précision (H46).</p>
<p>Trois entités sont étudiées ici. La <button class="w" data-k="g36-nmosd">NMOSD (définition et périmètre)</button> est un terme parapluie : il couvre la neuromyélite optique avec anticorps anti-aquaporine 4, ses formes frustes et des syndromes apparentés sans ces anticorps. Elle atteint les nerfs optiques et la moelle, plus rarement le tronc cérébral. Les experts européens la décrivent comme une maladie propre, distincte de la sclérose en plaques par son mécanisme, sa clinique, son traitement et son pronostic. La <button class="w" data-k="g36-mogad">MOGAD (définition et périmètre)</button> est la maladie associée aux anticorps dirigés contre la glycoprotéine oligodendrocytaire de la myéline ; les patients sans anticorps anti-aquaporine 4 qui remplissent ses critères ne doivent plus recevoir le diagnostic de NMOSD. La <button class="w" data-k="g36-hurst">leucoencéphalite hémorragique aiguë (définition et périmètre)</button> est la forme la plus sévère de l’encéphalomyélite aiguë disséminée.</p>
<p>Le codage appelle une précision. Dans la CIM-10-GM 2024, l’<button class="w" data-k="g36-adem">encéphalomyélite aiguë disséminée (rattachement et distinction)</button> n’est pas classée en G36 : G37.8 inclut l’encéphalomyélite démyélinisante aiguë, tandis que G04.0 désigne l’encéphalite aiguë disséminée, y compris post-vaccinale, avec le code du vaccin en complément. La myélite transverse aiguë relève de G37.3 et la sclérose en plaques de G35. La MOGAD ne figure sous aucun intitulé lu dans la classification ; son rattachement entre G36.8 et G37.8 n’est pas fixé par les sources consultées, et les règles de codage de l’Office fédéral de la statistique devraient être consultées avant tout codage.</p>
<p>Le tableau compare les trois entités sur quatre critères qui structurent la suite du cours : la cible de l’auto-immunité, le marqueur, le siège habituel et l’évolution. Il ne remplace pas les critères formels de la dernière partie.</p>
<table class="t"><thead><tr><th>Entité</th><th>Cible et marqueur</th><th>Siège habituel</th><th>Évolution</th></tr></thead><tbody><tr><td>NMOSD avec anticorps anti-aquaporine 4</td><td>Astrocyte ; anticorps anti-aquaporine 4</td><td>Nerfs optiques et moelle ; tronc cérébral plus rarement</td><td>Pratiquement tous les patients rechutent</td></tr><tr><td>MOGAD</td><td>Myéline ; anticorps anti-MOG</td><td>Encéphale (forme ADEM), nerf optique, moelle</td><td>Environ la moitié sont monophasiques</td></tr><tr><td>Leucoencéphalite hémorragique aiguë</td><td>Vaisseaux et substance blanche ; aucun marqueur sérologique spécifique décrit dans les sources lues</td><td>Substance blanche de l’encéphale</td><td>Mortalité d’environ 58 % dans une revue de 152 cas</td></tr></tbody></table>
<p>Les trois entités diffèrent donc par leur cible et leur pronostic, ce qui justifie des traitements différents. La suite du cours suit la même logique : identifier l’entité, puis agir.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Un patient sans anticorps anti-aquaporine 4 n’a pas pour autant une « NMOSD séronégative » : il faut d’abord rechercher les anticorps anti-MOG. Jusqu’à 40 % des NMOSD dites séronégatives portent des anticorps anti-MOG.</div>

</section>
<section class="ilot" id="g36-2"><h2><span class="n">2</span>Fréquence</h2>
<p>Pour la NMOSD, l’incidence varie selon les régions de 0,28 à 0,73 pour 100 000 personnes-années et la prévalence de 0,52 à 10 pour 100 000. La maladie est plus fréquente dans les populations non blanches, avec un maximum rapporté chez les personnes d’ascendance africaine dans certaines études. Les femmes sont nettement plus touchées : jusqu’à 10 femmes pour 1 homme chez les patients avec anticorps anti-aquaporine 4, plus de 20 pour 1 en âge fertile, et jusqu’à 3 pour 1 chez les séronégatifs. L’âge de début culmine autour de 40 ans (38,5 ans chez les séronégatifs) dans une grande cohorte européenne ; un début après 60 ans représente 20 à 28 % des cas incidents dans certaines cohortes.</p>
<p>La MOGAD n’a pas de prédominance de sexe nette. Elle représente 20 à 30 % des syndromes inflammatoires du système nerveux central de l’enfant, contre environ 5 % chez l’adulte, avec une incidence pédiatrique de 3,1 par million. Les anticorps anti-MOG sont présents chez jusqu’à la moitié des enfants atteints d’encéphalomyélite aiguë disséminée, et seulement chez 0,4 % des patients atteints de sclérose en plaques.</p>
<p>La leucoencéphalite hémorragique est rare : l’âge médian est de 33 ans dans une revue de 152 cas, et les hommes sont environ deux fois plus touchés.</p>
<p>Aucune donnée épidémiologique suisse n’a pu être lue pour ces trois entités (<button class="w" data-k="g36-epidemio">lacunes de fréquence (détail)</button>) ; les chiffres ci-dessus sont européens ou internationaux et datent de 2022 à 2025.</p>
<div class="key"><b>À retenir.</b> Une femme de moins de 50 ans avec une atteinte optique et médullaire relève d’abord de la NMOSD ; un enfant avec une encéphalomyélite aiguë disséminée relève d’abord de la recherche d’anticorps anti-MOG.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10165591/" target="_blank" rel="noopener">Revue narrative sur la MOGAD (J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9681543/" target="_blank" rel="noopener">Revue de la leucoencéphalite hémorragique aiguë (Alromaihi, Biomed Res Int 2022)</a> ; <a href="https://doi.org/10.3389/fnins.2025.1557046" target="_blank" rel="noopener">Leucoencéphalite hémorragique à début graduel (Sannes et al., Front Neurosci 2025, résumé)</a>.</p>
</section>
<section class="ilot" id="g36-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>À l’état normal, l’<button class="w" data-k="g36-aqp4">aquaporine 4 (canal hydrique astrocytaire)</button> est un canal hydrique exprimé essentiellement par les astrocytes du système nerveux central. Dans la NMOSD, les anticorps dirigés contre cette protéine lèsent d’abord l’astrocyte lui-même, puis, secondairement, les oligodendrocytes et les neurones. La démyélinisation et la perte axonale sont donc des conséquences : la NMOSD est une astrocytopathie et non une maladie primitive de la myéline.</p>
<p>Le <button class="w" data-k="g36-complement">complément (activation terminale et anti-C5)</button> explique le mécanisme de la lésion. Les anticorps anti-aquaporine 4 activent sans frein le complément terminal ; il en résulte une inflammation dépendante du complexe d’attaque membranaire et de C5a, la nécrose des astrocytes, une perméabilité accrue de la barrière hémato-encéphalique et des lésions gliales et neuronales voisines. Cette chaîne justifie l’emploi des anticorps dirigés contre C5.</p>
<figure><svg viewBox="0 0 380 322" role="img" aria-label="Figure 1 — Chaîne physiopathologique de la NMOSD" font-family="Atkinson Hyperlegible, sans-serif" font-size="15"><g fill="none" stroke="#222" stroke-width="1.6"><rect x="12" y="12" width="356" height="38" rx="5"/><rect x="12" y="66" width="356" height="60" rx="5"/><rect x="12" y="142" width="356" height="60" rx="5"/><rect x="12" y="218" width="356" height="38" rx="5"/><rect x="12" y="272" width="356" height="38" rx="5"/><path d="M190 50v16m-4-5l4 5 4-5"/><path d="M190 126v16m-4-5l4 5 4-5"/><path d="M190 202v16m-4-5l4 5 4-5"/><path d="M190 256v16m-4-5l4 5 4-5"/></g><g fill="#222" text-anchor="middle"><text x="190" y="36">Anticorps anti-aquaporine 4 liés à l’astrocyte</text><text x="190" y="90">Activation non contrôlée du complément terminal</text><text x="190" y="112">(complexe d’attaque membranaire, C5a)</text><text x="190" y="166">Nécrose de l’astrocyte, barrière hémato-encéphalique</text><text x="190" y="188">plus perméable, lésions gliales voisines</text><text x="190" y="242">Atteinte des oligodendrocytes et des neurones</text><text x="190" y="296">Démyélinisation et perte axonale : poussée</text></g></svg><figcaption>Figure 1 — Chaîne de la NMOSD avec anticorps anti-aquaporine 4. L’interleukine 6 amplifie la production des anticorps et la perméabilité de la barrière ; les médicaments de fond ciblent le complément, l’interleukine 6 ou les lymphocytes B.</figcaption></figure>
<p>L’<button class="w" data-k="g36-il6">interleukine 6 (rôle et satralizumab)</button> agit en amont. Ses taux sont élevés dans le liquide cérébro-spinal et dans le sérum en phase active. Elle favorise la différenciation des lymphocytes B en plasmocytes, donc la production des auto-anticorps, ainsi que l’activation des lymphocytes Th17 et la perméabilité de la barrière. Cette observation justifie le satralizumab. Les lymphocytes B et les plasmablastes, porteurs du marqueur CD19, sont la cible de l’inébilizumab ; le détail de ce mécanisme n’a pas été extrait de l’information professionnelle.</p>
<p>Dans la MOGAD, les anticorps visent la glycoprotéine oligodendrocytaire de la myéline : la cible est la myéline, ce qui distingue l’entité de la NMOSD avec anticorps anti-aquaporine 4 et de la sclérose en plaques. Dans la leucoencéphalite hémorragique, la lésion associe une démyélinisation périveineuse, une nécrose fibrinoïde, de petites hémorragies périvasculaires et un infiltrat à prédominance neutrophile, alors que l’infiltrat est lymphocytaire dans l’encéphalomyélite aiguë disséminée. L’hypothèse principale est un mimétisme moléculaire à la suite d’une infection.</p>
<div class="key"><b>Mécanisme → décision.</b> Le choix du médicament de fond découle du mécanisme : complément (éculizumab, ravulizumab), interleukine 6 (satralizumab), lymphocytes B (inébilizumab, rituximab). Un traitement de la sclérose en plaques ne cible aucun de ces mécanismes.</div>
<div class="trap"><span class="k">Erreur fréquente</span> Qualifier la NMOSD de « maladie de la myéline » conduit à la traiter comme une sclérose en plaques ; or plusieurs traitements de cette dernière aggravent la NMOSD (voir le traitement de fond).</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9681543/" target="_blank" rel="noopener">Revue de la leucoencéphalite hémorragique aiguë (Alromaihi, Biomed Res Int 2022)</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680676170011" target="_blank" rel="noopener">Information professionnelle suisse Enspryng®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680693220010" target="_blank" rel="noopener">Information professionnelle suisse Uplizna®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680672780016" target="_blank" rel="noopener">Information professionnelle suisse Ultomiris®</a> ; <a href="https://doi.org/10.1016/S1474-4422(22)00431-8" target="_blank" rel="noopener">Critères MOGAD 2023 (Banwell et al., Lancet Neurol 2023, résumé)</a>.</p>
</section>
<section class="ilot" id="g36-4"><h2><span class="n">4</span>Causes et facteurs déclenchants</h2>
<p>Aucune cause unique n’est établie. Une infection précède environ 30 % des poussées de NMOSD avec anticorps anti-aquaporine 4 et 20 % des poussées des formes séronégatives ; de rares débuts après vaccination ont été rapportés. Une <button class="w" data-k="g36-autoimmunite">auto-immunité associée (fréquence et conduite)</button> coexiste chez 25 à 40 % des patients avec anticorps anti-aquaporine 4 : lupus érythémateux disséminé, syndrome de Sjögren, syndrome des antiphospholipides, syndrome de Sharp, myasthénie, maladie cœliaque, thyroïdite. Sa présence n’exclut pas la NMOSD.</p>
<p>Une néoplasie sous-jacente est rare ; les facteurs de risque rapportés sont le sexe masculin, l’âge supérieur à 45 ans et la présence de nausées et vomissements. Aucun dépistage invasif systématique n’est recommandé. Dans la leucoencéphalite hémorragique, un prodrome viral des voies aériennes supérieures précède le début chez environ un tiers des patients (32 à 35 %) ; dans une revue de 32 cas, 62,5 % des patients avaient une infection antérieure, dont près de la moitié une COVID-19.</p>
<div class="key"><b>À retenir.</b> Chercher l’infection ou le déclencheur oriente le contexte, mais l’absence de déclencheur n’écarte aucune des trois entités.</div>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10267280/" target="_blank" rel="noopener">NEMOS 2023, première partie : diagnostic et diagnostic différentiel (Jarius et al., J Neurol 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9681543/" target="_blank" rel="noopener">Revue de la leucoencéphalite hémorragique aiguë (Alromaihi, Biomed Res Int 2022)</a> ; <a href="https://doi.org/10.1007/s10072-024-07715-1" target="_blank" rel="noopener">Revue systématique de la leucoencéphalite hémorragique (Tan et al., Neurol Sci 2024, résumé)</a>.</p>
</section>
<section class="ilot" id="g36-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire précise d’abord le <b>mode d’installation</b>. Dans la NMOSD, les symptômes s’installent par poussées. Une évolution progressive en dehors des poussées, un nadir atteint en moins de 4 heures ou une aggravation qui se prolonge au-delà de 4 semaines sont des drapeaux rouges. L’interrogatoire recherche ensuite un épisode antérieur oculaire ou médullaire, une infection récente, une vaccination, une maladie auto-immune connue, une grossesse ou un accouchement récent (les poussées surviennent surtout en post-partum) et la prise d’un traitement de la sclérose en plaques.</p>
<p>Les symptômes de la NMOSD sont de quatre types. La <button class="w" data-k="g36-nevrite">névrite optique (symptômes et gravité)</button> se traduit par une vision floue, une baisse d’acuité, une douleur aux mouvements oculaires et une désaturation des couleurs. La <button class="w" data-k="g36-myelite">myélite transverse aiguë (symptômes et LETM)</button> est le second syndrome cardinal. Le <button class="w" data-k="g36-area">syndrome de l’area postrema (hoquet, nausées)</button> associe hoquet, nausées et vomissements pendant au moins 48 heures. L’<button class="w" data-k="g36-diencephale">atteinte diencéphalique (somnolence, hyponatrémie)</button> se manifeste par une hypersomnolence ou un syndrome de sécrétion inappropriée d’hormone antidiurétique. Névrite optique et myélite surviennent simultanément ou, plus souvent, successivement.</p>
<div class="two"><div class="card"><h4>Forme typique de NMOSD</h4><p>Femme d’âge moyen avec névrite optique sévère (perte de vision inférieure à 20/200 fréquente), myélite et parfois hoquet persistant. Pratiquement tous les patients avec anticorps anti-aquaporine 4 rechutent, et le handicap résulte surtout des poussées. La douleur est très fréquente.</p></div><div class="card"><h4>Formes atypiques</h4><p>Début après 60 ans ; névrite bilatérale d’emblée (environ 15 % des patients avec anticorps anti-aquaporine 4) ; atteinte uniquement du tronc ou du diencéphale (symptômes extra-opticospinaux au début chez environ 4 % dans une cohorte allemande) ; forme séronégative monophasique, avec une seconde poussée possible de 1 mois à plus de 10 ans (médiane de 9 mois).</p></div></div>
<p>La MOGAD se présente selon trois phénotypes principaux : encéphalomyélite aiguë disséminée, névrite optique et myélite transverse ; l’encéphalite corticale et l’atteinte du tronc ou du cervelet sont moins fréquentes. L’encéphalomyélite aiguë disséminée est la présentation la plus fréquente du jeune enfant et ne représente que 5 à 6 % des présentations de l’adulte. La leucoencéphalite hémorragique commence 2 jours à 2 semaines après un prodrome : céphalées, fièvre, photophobie, raideur de nuque, puis confusion et coma en 4 à 10 jours environ.</p>
<div class="key"><b>À retenir.</b> Une névrite optique avec perte visuelle sévère, un hoquet persistant ou une myélite étendue orientent vers la NMOSD ; un œdème papillaire ou une encéphalomyélite chez l’enfant orientent vers la MOGAD.</div>

</section>
<section class="ilot" id="g36-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, constantes, puis examen ciblé. La <b>fièvre</b>, la raideur de nuque et la photophobie imposent d’emblée de considérer une infection du système nerveux central et, sous anti-C5, une infection à méningocoque. Le <b>niveau de conscience</b> se quantifie par le score de Glasgow : dans la leucoencéphalite hémorragique, un score inférieur à 12 et un signe de Babinski sont associés à un mauvais pronostic.</p>
<div class="two"><div class="card"><h4>Signes visuels</h4><p>Acuité visuelle et champ visuel ; recherche d’un déficit pupillaire afférent relatif ; désaturation des couleurs. L’<b>œdème papillaire</b> est typique de la MOGAD (et présent chez un tiers des patients avec leucoencéphalite hémorragique). Une perte visuelle sévère (inférieure à 20/200) est fréquente dans la NMOSD avec anticorps anti-aquaporine 4 et rare dans la sclérose en plaques.</p></div><div class="card"><h4>Signes neurologiques</h4><p>Un déficit moteur hémicorporel (hémiparésie chez la moitié des patients atteints de leucoencéphalite hémorragique), des crises, une dysarthrie et des troubles de la conscience orientent vers une atteinte encéphalique. Le hoquet persistant, les nausées et l’hypersomnolence orientent vers le tronc et le diencéphale.</p></div></div>
<p>L’examen note enfin les signes d’une maladie auto-immune associée, présente chez 25 à 40 % des patients avec anticorps anti-aquaporine 4, et garde à l’esprit les deux causes de décès rapportées dans la NMOSD : l’insuffisance respiratoire et l’urosepsis.</p>
<div class="trap"><span class="k">Piège</span> La douleur aux mouvements oculaires et le déficit pupillaire afférent relatif ne distinguent pas la NMOSD de la sclérose en plaques. La sévérité de la perte visuelle, l’atteinte bilatérale d’emblée et l’étendue longitudinale de la lésion à l’imagerie sont plus discriminantes.</div>
<div class="key"><b>À retenir.</b> Le niveau de conscience et la fièvre déterminent l’urgence ; l’acuité visuelle de départ conditionne le suivi de la récupération.</div>
