<template data-pop="pareto-g83-definition" data-title="Pareto — Définition et codage">
<p class="ratio" data-cover="g83-1"></p><ul><li>G83 est une catégorie résiduelle : code primaire seulement si l’affection n’est pas précisée ou ancienne de cause non précisée.</li><li>Les codes G83.4- (queue de cheval) et G83.5 (locked-in syndrome) portent les urgences.</li><li>Premier motoneurone : G83.6 ; deuxième motoneurone : G51.0.</li></ul></template>
<template data-pop="pareto-g83-anatomie" data-title="Pareto — Anatomie et définition">
<p class="ratio" data-cover="g83-2"></p><ul><li>Moelle jusqu’à la 2e lombaire ; en dessous, les racines forment la queue de cheval.</li><li>Le syndrome désigne l’atteinte des racines 2e à 5e racines sacrées : vessie, intestin, périnée, sexualité.</li><li>Définition pratique : au moins un trouble vésical ou intestinal, sensitif en selle ou sexuel ; IRM pour confirmer.</li></ul></template>
<template data-pop="pareto-g83-classification" data-title="Pareto — Classifications">
<p class="ratio" data-cover="g83-3"></p><ul><li>CESI : contrôle volontaire conservé ; CESR : rétention indolore avec regorgement.</li><li>Le sondage précoce masque le CESR.</li><li>Accord entre observateurs faible (kappa 0,34 puis 0,17) : ne pas décider sur l’étiquette seule.</li></ul></template>
<template data-pop="pareto-g83-causes" data-title="Pareto — Fréquence et causes">
<p class="ratio" data-cover="g83-4"></p><ul><li>Environ 2 % des hernies discales lombaires ; incidence 0,34 à 7 pour 100 000 par an.</li><li>Hernie discale massive : cause la plus fréquente.</li><li>Injection péridurale non guidée et bloc avec stéroïde particulaire : cas publiés.</li></ul></template>
<template data-pop="pareto-g83-clinique" data-title="Pareto — Clinique">
<p class="ratio" data-cover="g83-5"></p><ul><li>Rétention urinaire : sensibilité environ 90 % ; absence : environ 1 sur 10 000.</li><li>Interroger la sensation et le jet avant la continence.</li><li>Un drapeau isolé (sciatique bilatérale : sensibilité 32,4 %) ne tranche pas.</li></ul></template>
<template data-pop="pareto-g83-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g83-6"></p><ul><li>IRM urgente, dans l’heure selon BASS.</li><li>Résidu post-mictionnel ≥ 200 mL : sensibilité 94,1 %, valeur prédictive négative 98,7 % ; complément, non exclusion.</li><li>Le scanner analyse mal la queue de cheval.</li></ul></template>
<template data-pop="pareto-g83-urgence" data-title="Pareto — Urgence">
<p class="ratio" data-cover="g83-7"></p><ul><li>Décompression urgente : 24 à 48 heures au plus.</li><li>Incontinence résiduelle 24,6 % à 48 heures ou moins contre 50,3 % au-delà.</li><li>Le bénéfice du délai court est le plus net au stade incomplet.</li></ul></template>
<template data-pop="pareto-g83-pronostic" data-title="Pareto — Pronostic">
<p class="ratio" data-cover="g83-8"></p><ul><li>Incontinence urinaire 43 %, dysfonction rectale 31 %, déficit sensitif 53 %, déficit moteur 38 %.</li><li>Les facteurs pronostiques sont le délai, la sévérité initiale et l’atteinte vésicale.</li><li>Un bilan neuro-urologique suit le syndrome.</li></ul></template>
<template data-pop="pareto-g83-lis-def" data-title="Pareto — Locked-in syndrome : mécanisme">
<p class="ratio" data-cover="g83-9"></p><ul><li>Tétraplégie, anarthrie, regard vertical et clignement préservés, cognition intacte.</li><li>Lésion de la base du pont : faisceaux corticospinaux et corticobulbaires.</li><li>Quatre formes : classique, incomplète, complète, locked-in plus.</li></ul></template>
<template data-pop="pareto-g83-lis-prise" data-title="Pareto — Locked-in syndrome : causes et prise en charge">
<p class="ratio" data-cover="g83-10"></p><ul><li>Cause principale : infarctus ou hémorragie vertébrobasilaire ; mortalité 60 % dans une série de 1986.</li><li>Diagnostic tardif (plus de deux mois) ; examen répété, IRM, examens fonctionnels.</li><li>Occlusion basilaire : thrombolyse jusqu’à 24 heures (consensus), preuves très faibles ; réadaptation précoce.</li></ul></template>
<template data-pop="pareto-g83-todd" data-title="Pareto — Paralysie de Todd">
<p class="ratio" data-cover="g83-11"></p><ul><li>La paralysie de Todd est incluse dans G83.8.</li><li>46,7 % des suspicions d’AVC d’une série italienne étaient des simulateurs.</li><li>Exclure l’AVC avant d’étiqueter une paralysie postcritique.</li></ul></template>
<template data-pop="pareto-g83-autres" data-title="Pareto — Autres syndromes paralytiques">
<p class="ratio" data-cover="g83-12"></p><ul><li>G83.0 à G83.3 : diplégie brachiale et monoparésies, définitions seulement.</li><li>Paralysie faciale centrale : premier motoneurone (G83.6).</li><li>Sémiologie et conduite non documentées dans le dossier.</li></ul></template>
<template data-pop="pareto-g83-imagerie" data-title="Pareto — Imagerie">
<p class="ratio" data-cover="g83-e-2"></p><ul><li>IRM : racines et sac dural ; scanner : os.</li><li>IRM dans l’heure (BASS).</li><li>Un scanner ne remplace pas l’IRM.</li></ul></template>
<template data-pop="pareto-g83-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g83-e-1,g83-e-2,g83-e-3,g83-e-4,g83-e-5"></p><ul><li>Queue de cheval : IRM comme gold standard.</li><li>Résidu post-mictionnel : complément, jamais outil d’exclusion.</li><li>Locked-in syndrome : examen clinique répété, puis imagerie et examens fonctionnels.</li></ul></template>
<template data-pop="pareto-g83-s-anat" data-title="Pareto — Neuroanatomie">
<p class="ratio" data-cover="g83-s-anat-cours"></p><ul><li>Racines 3e lombaire à 1re sacrée : jambes ; racines 2e à 5e racines sacrées : vessie, intestin, périnée, sexualité.</li><li>Le cône est la terminaison de la moelle, la queue de cheval est faite de racines.</li></ul></template>
<template data-pop="pareto-g83-s-tronc" data-title="Pareto — Tronc cérébral">
<p class="ratio" data-cover="g83-s-tronc-cours"></p><ul><li>Pont ventral : corps et parole ; pont : regard horizontal.</li><li>Mésencéphale : regard vertical et paupière.</li><li>Tegmentum dorsal : conscience.</li></ul></template>
<template data-pop="pareto-g83-s-stat" data-title="Pareto — Biostatistique">
<p class="ratio" data-cover="g83-s-stat-cours"></p><ul><li>Sensibilité et spécificité appartiennent au test ; les valeurs prédictives dépendent de la fréquence.</li><li>Une valeur prédictive positive faible impose la confirmation.</li></ul></template>
<template data-pop="pareto-g83-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g83-p-1,g83-p-2,g83-p-3,g83-p-4"></p><ul><li>Aucun médicament spécifique de la queue de cheval : le traitement est chirurgical.</li><li>Baclofène intrathécal : test de 25 à 50 µg, paliers de 25 µg, arrêt toujours progressif.</li><li>Occlusion basilaire : reperfusion selon ESO/ESMINT, preuves très faibles.</li></ul></template>
