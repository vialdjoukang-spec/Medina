<template data-pop="g21-mds" data-title="Bradykinésie et critères de la Movement Disorder Society">
<div class="lab">Définition</div><p>La <button class="w" data-k="g21-mds">MDS</button> définit le parkinsonisme moteur par une bradykinésie associée à un tremblement de repos, à une rigidité, ou aux deux <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">(Postuma et collaborateurs, 2015)</a>. La bradykinésie est un ralentissement des mouvements avec décrément, c’est-à-dire une baisse progressive de la vitesse et de l’amplitude lors de gestes répétés.</p>
<div class="lab">Application</div><p>On demande au patient de frapper du pouce sur l’index, d’ouvrir et de fermer la main, ou de tourner l’avant-bras, plusieurs fois de suite. Le décrément distingue la bradykinésie parkinsonienne d’un ralentissement dépressif ou pyramidal <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>.</p>
<div class="lab">Lien avec le parkinsonisme secondaire</div><p>Les critères de la MDS pour la maladie de Parkinson retiennent comme critère d’exclusion un traitement par bloqueur des récepteurs dopaminergiques compatible, par la dose et le délai, avec un parkinsonisme médicamenteux. Le texte intégral de ces critères n’a pas été lu ; cette information provient de revues qui les résument <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/39185098/" target="_blank" rel="noopener">(consensus 2024)</a>.</p>
<div class="lab">Limite</div><p>Le syndrome parkinsonien est un tableau, non une maladie. Le critère décrit l’examen moteur, pas la cause.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">Postuma et collaborateurs, Movement Disorders 2015</a> ; <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">Revue Médicale Suisse 2018</a>.</p></template>
<template data-pop="g21-geneve" data-title="Épidémiologie genevoise 2003–2012">
<div class="lab">Étude</div><p>L’étude populationnelle de Fleury et collaborateurs décrit 1235 patients vivants avec un syndrome parkinsonien dans le canton de Genève entre 2003 et 2012 <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Parkinsonism and Related Disorders 2018)</a>.</p>
<div class="lab">Résultats</div><table class="t"><thead><tr><th>Groupe</th><th>Part</th></tr></thead><tbody><tr><td>Parkinsonismes dégénératifs</td><td>80 %</td></tr><tr><td>Parkinsonismes non dégénératifs</td><td>20 %</td></tr><tr><td>dont médicamenteux</td><td>43,4 %</td></tr><tr><td>dont vasculaires</td><td>37 %</td></tr><tr><td>dont hydrocéphalie à pression normale</td><td>5,1 %</td></tr><tr><td>dont parkinsonisme psychiatrique ou fonctionnel</td><td>3,8 %</td></tr></tbody></table>
<p>Les parts du groupe non dégénératif se lisent comme des pourcentages de ce groupe, non de l’ensemble des patients. Ensemble, les causes médicamenteuse et vasculaire représentent 80,4 % du groupe non dégénératif.</p>
<div class="lab">Limite</div><p>Seul le résumé a été lu. Le résumé affiche une prévalence ajustée de la maladie de Parkinson de « 183/10 », vraisemblablement 183 pour 100 000 avec perte d’exposant, et une incidence de 20 pour 100 000 par an. Cette unité reste à vérifier dans le texte intégral.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">Fleury et collaborateurs, 2018</a>.</p></template>
<template data-pop="g21-bloqueurs" data-title="Bloqueurs des récepteurs dopaminergiques et déplétants">
<div class="lab">Mécanisme</div><p>Les antipsychotiques et d’autres médicaments bloquent les récepteurs dopaminergiques striataux et provoquent un parkinsonisme par un mécanisme pharmacologique <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>. La réserpine et la tétrabénazine épuisent la dopamine présynaptique <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>.</p>
<div class="lab">Conséquence</div><p>Le transporteur présynaptique de la dopamine reste intact, ce qui explique l’imagerie normale <a href="https://pubmed.ncbi.nlm.nih.gov/24935237/" target="_blank" rel="noopener">(Brigo et collaborateurs, 2014)</a>. Le tableau clinique est indiscernable d’une maladie de Parkinson <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a>.</p>
<div class="lab">Chiffre</div><p>Chez les utilisateurs d’antipsychotiques, la prévalence du parkinsonisme médicamenteux est estimée à 20–35 % environ <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">Ward et Citrome 2018</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">HUG 2018</a>.</p></template>
<template data-pop="g21-medic-liste" data-title="Médicaments à risque de parkinsonisme">
<div class="lab">Fréquemment en cause</div><p>Antipsychotiques typiques (phénothiazines : chlorpromazine, prochlorpérazine, perphénazine, fluphénazine, prométhazine ; butyrophénones : halopéridol ; pimozide ; benzamides : sulpiride) ; antipsychotiques atypiques (rispéridone, olanzapine, flupentixol, ziprasidone, aripiprazole) ; déplétants dopaminergiques (réserpine, tétrabénazine) ; antiémétiques (métoclopramide, lévosulpiride, clébopride) ; inhibiteurs calciques (flunarizine, cinnarizine) <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, d’après Shin et Chung 2012)</a>.</p>
<div class="lab">Moins fréquemment</div><p>Clozapine, quétiapine ; lithium ; inhibiteurs sélectifs de la recapture de la sérotonine (citalopram, fluoxétine, paroxétine, sertraline) ; valproate, phénytoïne ; dompéridone, itopride <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>. D’autres revues citent la ciclosporine, les inhibiteurs du transporteur vésiculaire des monoamines et des compléments à base de <i>Rauwolfia</i> <a href="https://pubmed.ncbi.nlm.nih.gov/41487741/" target="_blank" rel="noopener">(2025)</a>.</p>
<div class="lab">Limite</div><p>Aucune information professionnelle suisse n’a été trouvée pour la flunarizine et la cinnarizine ; elles sont citées comme classe à risque seulement.</p>
<p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">Fleury, diapositives HUG 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/41487741/" target="_blank" rel="noopener">De Faria Sousa et Espinosa 2025</a>.</p></template>
<template data-pop="g21-chrono" data-title="Chronologie du parkinsonisme médicamenteux">
<div class="lab">Délai</div><p>Le parkinsonisme médicamenteux apparaît le plus souvent entre quelques heures et quelques semaines après l’introduction ou l’augmentation de dose <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>. Un début aigu à subaigu sous bloqueur dopaminergique doit le faire suspecter <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">(revue 2024)</a>.</p>
<div class="lab">Application</div><p>Le médecin reconstitue une chronologie : date de début du médicament, dates de changement de dose, date de début des troubles. Un parkinsonisme qui précède l’exposition ne peut pas lui être attribué.</p>
<div class="lab">Comparaison</div><p>La dyskinésie tardive débute après au moins trois mois et peut être permanente ; le parkinsonisme médicamenteux est souvent réversible <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">(Ward et Citrome, 2018)</a>.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">Ward et Citrome 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/39419777/" target="_blank" rel="noopener">Expert Opinion on Drug Safety 2024</a>.</p></template>
<template data-pop="g21-vasc" data-title="Parkinsonisme vasculaire : recommandation de Rektor 2018">
<div class="lab">Trois sous-types</div><table class="t"><thead><tr><th>Sous-type</th><th>Début</th><th>Lésion</th><th>Transporteur de la dopamine</th></tr></thead><tbody><tr><td>Aigu post-AVC</td><td>Brutal, hémiparkinsonisme</td><td>Infarctus ou hémorragie de la substance noire ou de la voie nigrostriée</td><td>Anormal, congruent à la lésion</td></tr><tr><td>Insidieux</td><td>Progressif, membres inférieurs</td><td>Lésions diffuses de la substance blanche</td><td>Généralement préservé</td></tr><tr><td>Mixte</td><td>Variable</td><td>Combinaison</td><td>Variable</td></tr></tbody></table>
<div class="lab">Signes distinctifs</div><p>Marche à petits pas à base élargie, hésitation au démarrage, rigidité des membres inférieurs, signes pyramidaux, pseudo-bulbaires, troubles urinaires, déclin cognitif ; bradykinésie dans 100 % des cas autopsiques, chutes dans 76 % <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>.</p>
<div class="lab">Limite</div><p>La recommandation vient d’un groupe d’experts principalement européen et n’est pas validée prospectivement. Le sous-type mixte n’est pas détaillé dans le dossier lu.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">Rektor et collaborateurs, Parkinsonism and Related Disorders 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31773419/" target="_blank" rel="noopener">Neuroimaging in vascular parkinsonism 2019</a>.</p></template>
<template data-pop="g21-delphi" data-title="Syndrome malin des neuroleptiques : critères de consensus Delphi 2011">
<div class="lab">Critères</div><table class="t"><thead><tr><th>Critère</th><th>Seuil</th></tr></thead><tbody><tr><td>Exposition</td><td>Récente à un antagoniste dopaminergique, ou sevrage d’un agoniste</td></tr><tr><td>Hyperthermie</td><td>Plus de 38,0 °C à au moins deux reprises</td></tr><tr><td>Rigidité</td><td>Présente</td></tr><tr><td>État mental</td><td>Altéré</td></tr><tr><td>Créatine kinase</td><td>Au moins 4 fois la limite supérieure de la normale</td></tr><tr><td>Labilité sympathique</td><td>Pression artérielle au moins 25 % au-dessus de la base, ou fluctuation d’au moins 20 mmHg (diastolique) ou 25 mmHg (systolique) en 24 heures</td></tr><tr><td>Hypermétabolisme</td><td>Tachycardie d’au moins 25 % et tachypnée d’au moins 50 % au-dessus de la base</td></tr><tr><td>Exclusion</td><td>Bilan négatif pour d’autres causes</td></tr></tbody></table>
<div class="lab">Limite</div><p>Les auteurs demandent une validation avant application clinique, et le résumé seul a été lu <a href="https://pubmed.ncbi.nlm.nih.gov/21733489/" target="_blank" rel="noopener">(Gurrera et collaborateurs, 2011)</a>. Le syndrome peut s’observer sans hyperthermie franche <a href="https://pubmed.ncbi.nlm.nih.gov/42732346/" target="_blank" rel="noopener">(Cureus 2026)</a>. Les critères sont des repères de reconnaissance, non un seuil pour retarder l’arrêt du médicament.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21733489/" target="_blank" rel="noopener">Gurrera et collaborateurs, Journal of Clinical Psychiatry 2011</a>.</p></template>
<template data-pop="g21-drapeaux" data-title="Drapeaux rouges contre la maladie de Parkinson">
<div class="lab">Liste</div><p>Chutes précoces (plus d’une par an pendant les trois premières années), dysautonomie précoce, syndrome cérébelleux, syndrome pyramidal, troubles oculomoteurs, troubles cognitifs précoces, parkinsonisme symétrique prédominant aux membres inférieurs <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, d’après MDS 2015)</a>.</p>
<div class="lab">Lecture</div><p>Chaque drapeau réduit la probabilité d’une maladie de Parkinson typique et oriente vers un parkinsonisme atypique ou secondaire. Le parkinsonisme symétrique prédominant aux jambes évoque particulièrement la forme vasculaire insidieuse.</p>
<p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">Fleury, diapositives HUG 2018</a>.</p></template>
<template data-pop="g21-dyskinesie" data-title="Dystonie aiguë, akathisie, dyskinésie tardive">
<div class="lab">Distinctions</div><table class="t"><thead><tr><th>Trouble</th><th>Délai</th><th>Évolution</th></tr></thead><tbody><tr><td>Dystonie aiguë</td><td>Aigu, sous neuroleptique ou métoclopramide</td><td>Traitée par bipéridène</td></tr><tr><td>Parkinsonisme médicamenteux</td><td>Heures à semaines</td><td>Souvent réversible</td></tr><tr><td>Dyskinésie tardive</td><td>Au moins 3 mois</td><td>Parfois permanente</td></tr></tbody></table>
<p>Les anticholinergiques peuvent aggraver la dyskinésie tardive <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Akineton®)</a>. L’akathisie est citée avec la dystonie aiguë parmi les mouvements anormaux des neuroleptiques <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener">(Ghika, 2018)</a>.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/30027457/" target="_blank" rel="noopener">Ward et Citrome 2018</a> ; <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener">Ghika, Revue Médicale Suisse 2018</a>.</p></template>
<template data-pop="g21-dystonie" data-title="Dystonie aiguë : traitement par le bipéridène">
<div class="lab">Posologie</div><p>Le bipéridène s’administre à 2,5 à 5 mg par voie intramusculaire ou intraveineuse lente ; la dose est répétable après 30 minutes, avec un maximum de 10 à 20 mg par jour chez l’adulte <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Akineton®)</a>.</p>
<div class="lab">Contexte</div><p>La dystonie aiguë est un diagnostic différentiel aigu des neuroleptiques et du métoclopramide <a href="https://www.revmed.ch/view/429326/3704724/RMS_604_892.pdf" target="_blank" rel="noopener">(Ghika, 2018)</a> <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Paspertin®)</a>. Chez l’enfant, l’information professionnelle du métoclopramide cite les benzodiazépines.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Akineton®, mai 2022</a>.</p></template>
<template data-pop="g21-datscan" data-title="DaTSCAN : scintigraphie du transporteur de la dopamine">
<div class="lab">Principe</div><p>Le DaTSCAN utilise l’ioflupane marqué à l’iode 123, qui se fixe sur le transporteur présynaptique de la dopamine. L’examen visualise donc la perte de terminaisons dopaminergiques striatales <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle DaTSCAN™)</a>.</p>
<div class="lab">Interprétation</div><p>Normal dans le parkinsonisme médicamenteux ; anormal dans la perte présynaptique, qu’elle soit dégénérative ou vasculaire aiguë <a href="https://pubmed.ncbi.nlm.nih.gov/24935237/" target="_blank" rel="noopener">(Brigo et collaborateurs, 2014)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/29310988/" target="_blank" rel="noopener">(Rektor et collaborateurs, 2018)</a>. Un résultat normal dans le sous-type vasculaire insidieux prédit une très faible réponse à la lévodopa.</p>
<div class="lab">Limites</div><p>Des médicaments à forte affinité pour le transporteur (amphétamine, bupropion, cocaïne, méthylphénidate) peuvent fausser l’examen. Ses indications sont limitées au doute clinique et au diagnostic différentiel <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger, 2018)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle DaTSCAN™, mars 2026</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24935237/" target="_blank" rel="noopener">Brigo et collaborateurs 2014</a>.</p></template>
<template data-pop="g21-hpn" data-title="Hydrocéphalie à pression normale">
<div class="lab">Imagerie</div><p>L’IRM mesure l’index d’Evans, anormal au-delà de 0,3, et l’angle calleux, anormal au-dessous de 90 degrés <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(HUG, 2018)</a>.</p>
<div class="lab">Épidémiologie</div><p>L’hydrocéphalie à pression normale représente 5,1 % des parkinsonismes non dégénératifs genevois <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Fleury et collaborateurs, 2018)</a>.</p>
<div class="lab">Limite</div><p>Le rattachement à une catégorie précise de la CIM n’a pas été vérifié, et le traitement n’est pas documenté dans le dossier source.</p>
<p class="src">Références : <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">HUG 2018</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">Fleury et collaborateurs 2018</a>.</p></template>
<template data-pop="g21-mn" data-title="Manganèse et parkinsonisme">
<div class="lab">Sources d’exposition</div><p>Exposition professionnelle (soudage), usage intraveineux de méthcathinone, cirrhose avec shunt porto-systémique <a href="https://pubmed.ncbi.nlm.nih.gov/23678867/" target="_blank" rel="noopener">(Stepens et collaborateurs, 2013)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/42174344/" target="_blank" rel="noopener">(revue 2026)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/42487434/" target="_blank" rel="noopener">(Lee, 2026)</a>.</p>
<div class="lab">Signes</div><p>Le syndrome extrapyramidal est distinctif et permanent, sans amélioration après l’arrêt malgré la baisse de la manganésémie. L’IRM montre un hypersignal pallidal, aussi présent dans la cirrhose, donc peu spécifique <a href="https://pubmed.ncbi.nlm.nih.gov/21036949/" target="_blank" rel="noopener">(Stepens et collaborateurs, 2010)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/42174344/" target="_blank" rel="noopener">(revue 2026)</a>.</p>
<div class="lab">Traitement</div><p>Pas d’amélioration à l’arrêt de l’exposition ; dans la cirrhose, la transplantation hépatique est le seul traitement définitif. La sémiologie fine n’a pas été lue.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/23678867/" target="_blank" rel="noopener">Stepens et collaborateurs 2013</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/21036949/" target="_blank" rel="noopener">Stepens et collaborateurs 2010</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42174344/" target="_blank" rel="noopener">revue 2026</a>.</p></template>
<template data-pop="g21-co" data-title="Syndrome retardé après intoxication au monoxyde de carbone">
<div class="lab">Description</div><p>Jusqu’à la moitié des survivants adultes d’une intoxication au monoxyde de carbone développent après un intervalle libre un syndrome neuropsychiatrique retardé : lenteur, parkinsonisme, troubles cognitifs <a href="https://pubmed.ncbi.nlm.nih.gov/38415575/" target="_blank" rel="noopener">(Gustavsen et collaborateurs, 2024)</a>.</p>
<div class="lab">Examens</div><p>IRM de la substance blanche et du pallidum ; électroencéphalogramme pour le diagnostic différentiel <a href="https://pubmed.ncbi.nlm.nih.gov/38910909/" target="_blank" rel="noopener">(Satake et collaborateurs, 2024)</a>.</p>
<div class="lab">Traitement</div><p>L’oxygénothérapie hyperbare et les corticoïdes ont été rapportés dans des cas isolés ; l’efficacité n’est pas établie <a href="https://pubmed.ncbi.nlm.nih.gov/38507912/" target="_blank" rel="noopener">(Wong et collaborateurs, 2024)</a>.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/38415575/" target="_blank" rel="noopener">Gustavsen et collaborateurs 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38910909/" target="_blank" rel="noopener">Satake et collaborateurs 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/38507912/" target="_blank" rel="noopener">Wong et collaborateurs 2024</a>.</p></template>
<template data-pop="g21-encephalite" data-title="Parkinsonisme post-encéphalitique">
<div class="lab">Histoire</div><p>L’encéphalite léthargique de 1917–1920, concomitante de la grippe espagnole, aurait causé environ un million de décès ; le parkinsonisme post-encéphalitique est sa forme chronique post-virale <a href="https://pubmed.ncbi.nlm.nih.gov/38745394/" target="_blank" rel="noopener">(Brainin et collaborateurs, 2024)</a>.</p>
<div class="lab">Usage actuel</div><p>Le terme ne doit pas être appliqué aux cas sporadiques actuels <a href="https://pubmed.ncbi.nlm.nih.gov/37688743/" target="_blank" rel="noopener">(Brigo et Vogrig, 2023)</a>. Les causes contemporaines n’ont pas été lues.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/38745394/" target="_blank" rel="noopener">Brainin et collaborateurs, European Journal of Neurology 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37688743/" target="_blank" rel="noopener">Brigo et Vogrig 2023</a>.</p></template>
<template data-pop="g21-catatonie" data-title="Catatonie maligne et diagnostics différentiels du syndrome malin">
<div class="lab">Distinction</div><p>Le syndrome malin se distingue du syndrome sérotoninergique, de l’hyperthermie maligne, de la catatonie maligne et de l’encéphalite à anticorps anti-NMDA <a href="https://pubmed.ncbi.nlm.nih.gov/42659566/" target="_blank" rel="noopener">(Ivarola et collaborateurs, 2026)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/31040676/" target="_blank" rel="noopener">(2019)</a>.</p>
<div class="lab">Catatonie maligne</div><p>La mortalité est d’environ 50 % sans traitement ; le lorazépam et l’électroconvulsivothérapie obtiennent une réponse chez 80 à 100 % des patients <a href="https://pubmed.ncbi.nlm.nih.gov/36416934/" target="_blank" rel="noopener">(Karl et collaborateurs, 2023)</a>.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36416934/" target="_blank" rel="noopener">Karl et collaborateurs, Der Nervenarzt 2023</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31040676/" target="_blank" rel="noopener">Neuropsychiatric Disease and Treatment 2019</a>.</p></template>
<template data-pop="g21-sevrage" data-title="Arrêt brutal de la lévodopa : équivalent par sevrage">
<div class="lab">Description</div><p>L’information professionnelle de Madopar® signale que l’arrêt brutal de la lévodopa peut déclencher hyperpyrexie, rigidité et élévation de la créatine kinase, ce qui impose une surveillance hospitalière et une reprise éventuelle <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(Madopar®)</a>. Le consensus Delphi inclut le sevrage d’un agoniste dopaminergique parmi les expositions <a href="https://pubmed.ncbi.nlm.nih.gov/21733489/" target="_blank" rel="noopener">(Gurrera et collaborateurs, 2011)</a>.</p>
<div class="lab">Application</div><p>Chez un patient parkinsonien hospitalisé, une interruption involontaire de la lévodopa est recherchée devant toute fièvre avec rigidité.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle Madopar®, juin 2023</a>.</p></template>
<template data-pop="g21-elvis" data-title="Déclaration des effets indésirables : ElViS">
<div class="lab">Principe</div><p>Les effets indésirables des médicaments sont annoncés à Swissmedic par le système ElViS <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle DaTSCAN™)</a>. Une annonce est utile pour un parkinsonisme médicamenteux grave ou inattendu.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle DaTSCAN™</a>.</p></template>
<template data-pop="g21-sources" data-title="Sources, hiérarchie des preuves et lacunes">
<div class="lab">Hiérarchie</div><p>Pour la conduite en Suisse, les informations professionnelles de Swissmedic fixent l’indication et la posologie d’un produit. Pour la clinique, les revues et diapositives suisses (Revue Médicale Suisse, Hôpitaux universitaires de Genève) précèdent les sources européennes et internationales, et la source primaire la plus récente l’emporte en cas de contentieux.</p>
<div class="lab">Lacunes</div><p>Aucune recommandation de la Société suisse de neurologie ni de l’Académie européenne de neurologie propre au parkinsonisme secondaire n’a été trouvée. Les articles du Swiss Medical Forum n’ont pu être lus (erreur de proxy) : seuls des extraits ont été vus. Les critères de la Movement Disorder Society et le consensus Delphi n’ont été lus qu’en résumé. Aucune posologie sourcée pour la bromocriptine, l’amantadine et le lorazépam dans le syndrome malin. Aucune information professionnelle suisse pour la flunarizine. Les causes post-encéphalitiques actuelles et le délai avant de reprendre un neuroleptique ne sont pas sourcés.</p>
<p class="src">Dossier de recherche du cycle Betta 35, 15 octobre 2026. Audit différé — revue IA, distincte d’une validation médicale humaine.</p></template>
