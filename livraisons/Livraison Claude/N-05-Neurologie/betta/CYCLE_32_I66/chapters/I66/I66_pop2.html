<template data-pop="i66-dtc" data-title="Doppler transcrânien">
<h3>Principe et signes</h3> Le Doppler transcrânien mesure la vitesse du sang dans les artères intracrâniennes. Une sténose se reconnaît à l’augmentation focale de la vitesse moyenne, à la baisse distale de la vitesse et à l’augmentation de l’index de pulsatilité. L’examen détecte aussi les signaux microemboliques, fréquents à la phase aiguë des sténoses symptomatiques de l’artère cérébrale moyenne. <h3>Valeur</h3> Dans l’essai SONIA (sténose de 50 à 99 % contre angiographie), la valeur prédictive positive est de 36 % et la valeur prédictive négative de 86 %. L’examen exclut donc bien une sténose, mais un résultat anormal exige une confirmation. <h3>Lacune</h3> Les seuils de vitesse qui définissent une sténose de 50 % ou de 70 % n’ont pas été trouvés dans les sources lues.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17409371/" target="_blank" rel="noopener">SONIA, Neurology 2007</a>.</p>
</template>
<template data-pop="i66-sonia" data-title="SONIA : valeur des examens non invasifs">
<h3>Question de l’essai</h3> Le Doppler transcrânien et l’angio-IRM détectent-ils une sténose intracrânienne de 50 à 99 %, comparés à l’angiographie ? <h3>Résultats</h3> <table class="t"><tr><th>Examen</th><th>Valeur prédictive positive</th><th>Valeur prédictive négative</th></tr><tr><td>Doppler transcrânien</td><td>36 %</td><td>86 %</td></tr><tr><td>Angio-IRM</td><td>59 %</td><td>91 %</td></tr></table> <h3>Lecture</h3> Les deux examens écartent bien une sténose ; ils la confirment mal. Un résultat anormal appelle une confirmation par angiographie.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/17409371/" target="_blank" rel="noopener">SONIA, Neurology 2007</a>.</p>
</template>
<template data-pop="i66-angio-tdm" data-title="Angio-tomodensitométrie">
<h3>Rôle</h3> L’Organisation européenne recommande, chez tout patient avec accident ischémique transitoire, une angio-IRM ou une angio-tomodensitométrie pour confirmer une sténose de grosse artère de 50 % ou plus, avec évaluation spécialisée dans les 24 heures. <h3>Valeur</h3> Très sensible et très spécifique pour une sténose de plus de 50 % selon Chen et al. ; la source ne chiffre pas ces valeurs. Le lecteur ne doit donc pas citer de pourcentage.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/34414299/" target="_blank" rel="noopener">ESO, accident ischémique transitoire 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-asd" data-title="Angiographie numérisée">
<h3>Statut</h3> Examen de référence de la lumière artérielle (étalon-or). Il est invasif et ne montre pas la paroi artérielle. <h3>Mesure</h3> Le degré de sténose s’y mesure par la méthode WASID. L’angiographie sert à confirmer un résultat anormal du Doppler transcrânien ou de l’angio-IRM.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/10782772/" target="_blank" rel="noopener">Samuels et al., 2000</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/17409371/" target="_blank" rel="noopener">SONIA, Neurology 2007</a>.</p>
</template>
<template data-pop="i66-irm-paroi" data-title="IRM de paroi à haute résolution">
<h3>Principe</h3> L’examen, le plus souvent à 3 teslas, étudie la paroi de l’artère et non seulement sa lumière. Une paroi normale est concentrique, d’épaisseur uniforme, avec lumière lisse et sans rehaussement. <h3>Aspects selon le diagnostic</h3> <table class="t"><tr><th>Diagnostic</th><th>Aspect</th></tr><tr><td>Athérosclérose</td><td>Épaississement excentrique, rehaussement de la chape fibreuse, hémorragie intraplaque possible</td></tr><tr><td>Dissection</td><td>Flap, double lumière, hématome intramural</td></tr><tr><td>Vasculite</td><td>Épaississement concentrique multifocal rehaussé</td></tr><tr><td>Vasoconstriction réversible</td><td>Épaississement concentrique peu rehaussé, régressif</td></tr><tr><td>Moyamoya (RNF213)</td><td>Rehaussement concentrique, diamètre externe réduit, collatérales basales</td></tr></table> <h3>Marqueurs de plaque symptomatique</h3> Rehaussement au moins égal à celui de l’hypophyse, remodelage positif, hypersignal T1 et irrégularité de surface.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-perfusion" data-title="Imagerie de perfusion">
<h3>Ce qu’elle mesure</h3> Le temps de transit moyen (MTT) et le temps de transit maximal (Tmax) décrivent l’arrivée du sang dans le territoire. <h3>Valeur pronostique</h3> Un MTT allongé dans le territoire d’une sténose de 50 à 99 % accompagne un risque accru d’accident ipsilatéral, souvent en jonction. Un mismatch de Tmax supérieur à 6 secondes sur au moins 15 mL est associé aux récidives. <h3>Limite</h3> Ces marqueurs précisent le pronostic ; ils ne remplacent pas le traitement médical d’abord.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10827355/" target="_blank" rel="noopener">Chen et al., Stroke 2024</a>.</p>
</template>
<template data-pop="i66-wasid-essai" data-title="WASID : warfarine contre aspirine">
<h3>Plan</h3> 569 patients avec sténose intracrânienne de 50 à 99 % ; warfarine contre aspirine à 1300 mg par jour. <h3>Résultats</h3> Critère principal : 21,8 % contre 22,1 % (rapport de risque 1,04). Décès : 9,7 % contre 4,3 %. Hémorragie majeure : 8,3 % contre 3,2 %. Infarctus du myocarde ou mort subite : 7,3 % contre 2,9 %. L’essai a été arrêté pour des raisons de sécurité. <h3>Conclusion</h3> Pas de bénéfice de l’anticoagulation, davantage de décès et d’hémorragies. Les analyses ultérieures ont décrit les prédicteurs de récidive (sténose de 70 % ou plus, rapport de risque 2,03 ; inclusion précoce, 1,69).
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15800226/" target="_blank" rel="noopener">WASID, N Engl J Med 2005</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/16432056/" target="_blank" rel="noopener">Kasner et al., Circulation 2006</a>.</p>
</template>
<template data-pop="i66-sammpris" data-title="SAMMPRIS : stent contre traitement médical intensif">
<h3>Plan</h3> 451 patients, sténose symptomatique de 70 à 99 %, stent Wingspan contre traitement médical (antiagrégation, contrôle intensif des facteurs de risque, programme de mode de vie). <h3>Résultats</h3> Accident vasculaire cérébral ou décès à 30 jours : 14,7 % contre 5,8 %. Critère primaire à 1 an : 20,0 % contre 12,2 %. À 32,4 mois : 23 % contre 15 % ; tout accident vasculaire cérébral 26 % contre 19 % ; hémorragie majeure 13 % contre 4 %. <h3>Sous-groupes</h3> Aucun sous-groupe, y compris celui des patients à symptômes hémodynamiques, ne bénéficie du stent.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/21899409/" target="_blank" rel="noopener">SAMMPRIS, N Engl J Med 2011</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/24168957/" target="_blank" rel="noopener">SAMMPRIS, Lancet 2014</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26382173/" target="_blank" rel="noopener">Lutsep et al., Stroke 2015</a>.</p>
</template>
<template data-pop="i66-vissit" data-title="VISSIT : stent expansible par ballon">
<h3>Résultats</h3> Essai arrêté précocement. Critère de sécurité à 30 jours : 24,1 % avec stent contre 9,4 % sous traitement médical. Accident ou accident transitoire du même territoire à 1 an : 36,2 % contre 15,1 %.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a>.</p>
</template>
<template data-pop="i66-cassiss" data-title="CASSISS : essai chinois">
<h3>Plan</h3> 358 patients, plus de 3 semaines après l’événement, territoires non perforants ; traitement médical avec double antiagrégation 90 jours puis monothérapie. <h3>Résultats</h3> Accident vasculaire cérébral ou décès : 8,0 % avec stent contre 7,2 % sans (rapport de risque 1,10) ; pas de différence à 2 et 3 ans ; mortalité à 3 ans 4,4 % contre 1,3 %, sans différence significative.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/35943472/" target="_blank" rel="noopener">CASSISS, JAMA 2022</a>.</p>
</template>
<template data-pop="i66-cochrane" data-title="Revue Cochrane 2023">
<h3>Méthode</h3> Quatre essais randomisés, 989 patients, comparant le traitement endovasculaire associé au traitement médical à ce dernier seul. <h3>Résultats</h3> Le traitement endovasculaire augmente probablement le décès ou l’accident à court terme (risque relatif 2,93) et à long terme (1,49). L’accident hémorragique précoce a un risque relatif de 13,49.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/36738471/" target="_blank" rel="noopener">Cochrane 2023</a>.</p>
</template>
<template data-pop="i66-clair" data-title="CLAIR : clopidogrel plus aspirine, signaux emboliques">
<h3>Résultat</h3> Chez des patients majoritairement avec sténose intracrânienne symptomatique, clopidogrel plus aspirine réduit les signaux microemboliques au deuxième jour par rapport à l’aspirine seule (réduction relative de 42,4 %). <h3>Lecture</h3> Ce critère est un marqueur biologique de l’embolie artère-artère ; il ne mesure pas directement les accidents cliniques.
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/20335070/" target="_blank" rel="noopener">CLAIR, Lancet Neurol 2010</a>.</p>
</template>
<template data-pop="i66-d-aspirine" data-title="Aspirine : monographie">
<h3>Mécanisme</h3> Inhibition irréversible de la thromboxane A2 plaquettaire (notice Aspirine® Cardio 100/300, mise à jour mars 2026). <h3>Indication et posologie</h3> Prophylaxie des accidents cérébro-vasculaires suite à des stades précurseurs (accident ischémique transitoire) : 100 mg trois fois par jour ou 300 mg une fois par jour. Pour les indications cardiovasculaires générales : 100 mg une fois par jour. <h3>Contre-indications</h3> Ulcère actif, diathèse hémorragique, maladie inflammatoire chronique de l’intestin, insuffisance hépatique sévère, troisième trimestre de grossesse. <h3>Preuves</h3> WASID : l’aspirine à 1300 mg par jour a fait au moins aussi bien que la warfarine, avec moins d’hémorragies majeures (3,2 % contre 8,3 %).
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/15800226/" target="_blank" rel="noopener">WASID, N Engl J Med 2005</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680517950406" target="_blank" rel="noopener">Aspirine® Cardio, information professionnelle suisse</a>.</p>
</template>
<template data-pop="i66-d-clopidogrel" data-title="Clopidogrel : monographie">
<h3>Mécanisme</h3> Prodrogue activée par le cytochrome P450 ; inhibition irréversible du récepteur P2Y12. Réponse diminuée chez les métaboliseurs lents du CYP2C19. <h3>Indication et posologie suisses</h3> Prévention secondaire après accident vasculaire cérébral récent (de 7 jours à environ 6 mois) : 75 mg par jour en monothérapie. La bithérapie avec l’aspirine est libellée pour le syndrome coronarien aigu, les stents coronaires et la fibrillation auriculaire ; la bithérapie après accident transitoire ou infarctus cérébral n’est pas une indication libellée. <h3>Précautions</h3> Triple antiagrégation (clopidogrel, aspirine, dipyridamole) déconseillée dans l’accident vasculaire cérébral ; arrêt 7 jours avant une chirurgie. Mise à jour de la notice : septembre 2022. <h3>Preuves</h3> Double antiagrégation recommandée 90 jours par l’Organisation européenne ; essai CLAIR.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/20335070/" target="_blank" rel="noopener">CLAIR, Lancet Neurol 2010</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680545090143" target="_blank" rel="noopener">Plavix®, information professionnelle suisse</a>.</p>
</template>
<template data-pop="i66-d-atorvastatine" data-title="Atorvastatine : monographie">
<h3>Posologie</h3> 10 à 80 mg par jour (notice Sortis®, mise à jour avril 2025). L’essai SPARCL (4731 patients, accident vasculaire cérébral ou accident transitoire de moins de 6 mois) a utilisé 80 mg. <h3>Preuves</h3> Atorvastatine 40 mg contre 10 mg (120 patients) : récidive à 52 semaines de 13,5 % contre 26,3 %. <h3>Sécurité</h3> Analyse post hoc de SPARCL : davantage d’accidents vasculaires cérébraux hémorragiques sous 80 mg, surtout chez les patients avec antécédent d’accident hémorragique ou lacunaire. <h3>Contre-indications</h3> Hépatopathie active, transaminases supérieures à 3 fois la normale de façon persistante, grossesse et allaitement.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680540850285" target="_blank" rel="noopener">Sortis®, information professionnelle suisse</a>.</p>
</template>
<template data-pop="i66-d-ticagrelor" data-title="Ticagrélor : statut suisse">
<h3>Situation</h3> La notice Brilique® (mise à jour novembre 2025) limite les indications au syndrome coronarien aigu et à l’antécédent d’infarctus du myocarde. Elle n’indique aucune indication d’accident vasculaire cérébral ou d’accident transitoire. <h3>Preuves</h3> La ligne directrice européenne mentionne l’association ticagrélor et aspirine sans recommandation spécifique pour la sténose intracrânienne.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680613890019" target="_blank" rel="noopener">Brilique®, information professionnelle suisse</a>.</p>
</template>
<template data-pop="i66-d-cilostazol" data-title="Cilostazol : statut suisse">
<h3>Situation</h3> Le cilostazol a montré une non-infériorité à l’aspirine chez des patients asiatiques ; des données d’association existent. La recherche dans la base suisse des informations professionnelles (« cilostazol », « pletal ») n’a rien donné le 14.10.2026. <h3>Conséquence</h3> Ne pas présenter le cilostazol comme disponible en Suisse sans vérification complémentaire.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11801852/" target="_blank" rel="noopener">Song et Kwon, Cerebrovasc Dis Extra 2025</a>.</p>
</template>
<template data-pop="i66-d-warfarine" data-title="Warfarine : à éviter dans la sténose">
<h3>Pourquoi</h3> Dans WASID, la warfarine n’a pas réduit le critère principal par rapport à l’aspirine (21,8 % contre 22,1 %) et a augmenté les décès (9,7 % contre 4,3 %) et les hémorragies majeures (8,3 % contre 3,2 %). L’Organisation européenne recommande les antiagrégants plutôt que les anticoagulants (preuve modérée). <h3>Réserve</h3> Cette conclusion vaut pour la sténose athéroscléreuse seule ; elle n’exclut pas un anticoagulant prescrit pour une autre indication.
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446330/" target="_blank" rel="noopener">ESO, maladie athéroscléreuse intracrânienne 2022</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/15800226/" target="_blank" rel="noopener">WASID, N Engl J Med 2005</a>.</p>
</template>
<template data-pop="pareto-i66-clin" data-title="Pareto — Notions, mécanismes, clinique et urgence">
<p class="ratio" data-cover="i66-0,i66-1,i66-2,i66-3,i66-4,i66-5,i66-6,i66-7,i66-8"></p>
<ul><li>I66 code une sténose ou une occlusion d’une artère cérébrale sans infarctus ; avec infarctus, c’est I63 ; basilaire et carotide relèvent de I65.</li><li><button class="w" data-k="i66-icad">Sténose</button> : plus de 50 % ; <button class="w" data-k="i66-haut-grade">haut grade</button> : plus de 70 % ou retentissement hémodynamique ; mesure par la <button class="w" data-k="i66-wasid-mesure">méthode WASID</button>.</li><li>Quatre mécanismes : thrombose in situ, embolie artère-artère, occlusion de branche, bas débit (<button class="w" data-k="i66-mnemo">aide pédagogique</button>).</li><li>Épidémiologie occidentale : environ 10 % des accidents ischémiques ; aucun chiffre suisse trouvé.</li><li>Un accident transitoire sur sténose est à haut risque : imagerie vasculaire et avis spécialisé dans les 24 heures ; récidive 5,5 % à 30 jours.</li><li>Les causes non athéroscléreuses se séparent par l’<button class="w" data-k="i66-irm-paroi">IRM de paroi</button>.</li></ul>
</template>
<template data-pop="pareto-i66-trait" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i66-9,i66-10,i66-11"></p>
<ul><li>Antiagrégants, jamais anticoagulants (<button class="w" data-k="i66-wasid-essai">WASID</button>).</li><li><button class="w" data-k="i66-dapt">Double antiagrégation</button> 90 jours, puis monothérapie.</li><li>Facteurs de risque : LDL (cibles <button class="w" data-k="i66-ldl-divergence">1,4 ou 1,8 mmol/L</button>), pression inférieure à 130/80 mmHg, HbA1c inférieure à 53 mmol/mol, activité physique.</li><li>Stent en première intention : recommandation forte contre (<button class="w" data-k="i66-sammpris">SAMMPRIS</button> : 14,7 % contre 5,8 % à 30 jours).</li><li>Revascularisation en recours, patients sélectionnés, après échec du traitement médical optimal.</li></ul>
</template>
<template data-pop="pareto-i66-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="i66-12,i66-13,i66-14"></p>
<ul><li>Un tiers des sténoses progressent ; 73 % des accidents ultérieurs surviennent dans le territoire connu.</li><li>Prédicteurs : sténose de 70 % ou plus, inclusion précoce, sexe féminin (limite).</li><li>Asymptomatique : ni dépistage ni antiagrégation systématiques recommandés.</li><li>Moyamoya : antiagrégation au long cours, revascularisation selon le retentissement.</li><li>Critères : sténose au-delà de 50 %, haut grade au-delà de 70 %, symptomatique si événement attribuable.</li></ul>
</template>
<template data-pop="pareto-i66-exam" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="i66-e-1,i66-e-2,i66-e-3,i66-e-4,i66-e-5"></p>
<ul><li>Après accident transitoire : angio-IRM ou angio-tomodensitométrie, avis spécialisé sous 24 heures.</li><li><button class="w" data-k="i66-dtc">Doppler</button> et angio-IRM : excluent bien, confirment mal (<button class="w" data-k="i66-sonia">SONIA</button>) ; confirmation par <button class="w" data-k="i66-asd">angiographie</button>.</li><li><button class="w" data-k="i66-wasid-mesure">WASID</button> : [1 − (sténose ÷ normal)] × 100.</li><li><button class="w" data-k="i66-irm-paroi">IRM de paroi</button> : excentrique, athérosclérose ; concentrique, autre cause.</li><li><button class="w" data-k="i66-perfusion">Perfusion</button> : MTT allongé et Tmax supérieur à 6 secondes sur 15 mL, marqueurs de récidive.</li></ul>
</template>
<template data-pop="pareto-i66-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i66-p-1,i66-p-2,i66-p-3,i66-p-4,i66-p-5"></p>
<ul><li><button class="w" data-k="i66-d-aspirine">Aspirine</button> et <button class="w" data-k="i66-d-clopidogrel">clopidogrel</button> : 90 jours, puis monothérapie ; la bithérapie n’est pas une indication de la notice suisse.</li><li><button class="w" data-k="i66-d-atorvastatine">Atorvastatine</button> : 10 à 80 mg par jour selon la cible de LDL ; prudence avec antécédent hémorragique ou lacunaire à 80 mg.</li><li><button class="w" data-k="i66-d-warfarine">Warfarine</button> : à éviter.</li><li><button class="w" data-k="i66-d-ticagrelor">Ticagrélor</button> et <button class="w" data-k="i66-d-cilostazol">cilostazol</button> : pas d’indication suisse confirmée.</li><li>Triple antiagrégation déconseillée.</li></ul>
</template>
<template data-pop="pareto-i66-s-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="i66-s-anat-body"></p>
<ul><li>I65 en amont du polygone, I66 en aval.</li><li>Le territoire fixe le déficit à rechercher.</li><li>Moins de collatérales en aval du polygone.</li></ul>
</template>
<template data-pop="pareto-i66-s-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="i66-s-histo-body"></p>
<ul><li>Paroi mince, peu élastique, peu vascularisée.</li><li>Plaque plus fibreuse et moins inflammatoire qu’en extracrânien.</li><li>Excentrique : athérosclérose ; concentrique : autre cause.</li></ul>
</template>
<template data-pop="pareto-i66-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="i66-s-physio-body"></p>
<ul><li>La sténose réduit le débit ; les collatérales suppléent tant qu’elles suffisent.</li><li>Déficits fluctuants avec la posture : bas débit.</li><li>Hypotension et hypovolémie aggravent.</li></ul>
</template>
<template data-pop="pareto-i66-s-bioc" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="i66-s-bioc-body"></p>
<ul><li>Cible de LDL : 1,8 ou 1,4 mmol/L selon la recommandation.</li><li>Aspirine : thromboxane A2 ; clopidogrel : récepteur P2Y12, prodrogue.</li><li>HbA1c inférieure à 53 mmol/mol chez le diabétique.</li></ul>
