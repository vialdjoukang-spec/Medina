<template id="ch-G64"><div class="chap"><div class="chap-head"><div class="code">G 64 · Neurologie · Système nerveux périphérique</div><h1>Autres affections du système nerveux périphérique</h1><span class="status">Cycle 38 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des atteintes périphériques</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g64-0">Question clinique</a></li><li><a href="#g64-1">Statut du code G64</a></li><li><a href="#g64-2">Définitions et profils</a></li><li><a href="#g64-3">Fréquence et causes</a></li><li><a href="#g64-4">Mécanismes</a></li><li><a href="#g64-5">Anamnèse</a></li><li><a href="#g64-6">Examen clinique</a></li><li><a href="#g64-7">Démarche diagnostique</a></li><li><a href="#g64-8">Urgences et drapeaux rouges</a></li><li><a href="#g64-9">Prise en charge</a></li><li><a href="#g64-10">Suivi et pronostic</a></li><li><a href="#g64-11">Situations particulières</a></li><li><a href="#g64-12">Critères formels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g64-0"><h2><span class="n">0</span>Question clinique</h2>

<p>Dans cette <b>vignette fictive</b>, une femme de 67 ans consulte pour des fourmillements, puis des brûlures des deux pieds, installés en huit mois et plus intenses la nuit. Elle ne connaît aucun diabète et déclare une consommation d’alcool modeste. À l’examen, les réflexes achilléens sont abolis, la perception des vibrations au gros orteil est diminuée et la piqûre est moins bien ressentie aux orteils. Ces données sont pédagogiques et ne proviennent d’aucune patiente réelle.</p>
<p>Le médecin ne dispose encore d’aucun diagnostic précis. Il peut seulement écrire : atteinte du système nerveux périphérique sans autre indication, c’est-à-dire la catégorie <button class="w" data-k="g64-code">G64</button>. Cette étiquette provisoire pose quatre questions, que la leçon traite dans l’ordre. Quel profil dessinent la distribution et l’évolution des symptômes ? Existe-t-il une urgence qui interdit d’attendre ? Quelles causes curables faut-il chercher en premier ? Comment soulager la douleur en attendant ?</p>
<p>Chaque réponse s’appuie sur une démarche par étapes et sur des drapeaux rouges, c’est-à-dire des signes qui imposent une évaluation spécialisée rapide. Les résultats chiffrés de la vignette sont fictifs ; tous les seuils et toutes les doses de la leçon proviennent des sources citées.</p>
<div class="key"><b>À retenir.</b> G64 n’est pas un diagnostic mais un point de départ. Le médecin décrit le profil, élimine les urgences, traite les causes curables, puis reclasse l’atteinte dans la catégorie précise.</div>
</section>
<section class="ilot" id="g64-1"><h2><span class="n">1</span>Statut du code G64 et catégories voisines</h2>

<p>La <button class="w" data-k="g64-code">CIM</button>-10-<button class="w" data-k="g64-code">GM</button> 2024 intitule G64 « Sonstige Krankheiten des peripheren Nervensystems » (autres affections du système nerveux périphérique). Sa seule inclusion est « affection du système nerveux périphérique sans autre indication ». Elle ne possède aucune sous-catégorie ni exclusion propre. Elle est donc un code terminal unique, utilisé quand aucune catégorie plus précise ne s’applique. Les sources officielles sont l’édition de l’institut allemand <button class="w" data-k="g64-code">BfArM</button> et sa version française de l’<button class="w" data-k="g64-code">OFS</button>.</p>
<p>Le tableau ci-dessous situe G64 dans le bloc G60–G64. Il sert à comprendre pourquoi le médecin quitte ce code dès qu’il identifie une cause : une catégorie voisine plus précise existe presque toujours pour une atteinte identifiée.</p>
<table class="t"><thead><tr><th>Code</th><th>Contenu</th><th>Rôle dans la démarche</th></tr></thead><tbody><tr><td>G60</td><td>Neuropathies héréditaires et idiopathiques</td><td>Destination des neuropathies héréditaires et idiopathiques</td></tr><tr><td>G61</td><td>Polynévrites</td><td>Destination des polynévrites</td></tr><tr><td>G62</td><td>Autres polyneuropathies</td><td>Destination des polyneuropathies identifiées non classées en G60, G61 ou G63</td></tr><tr><td>G63*</td><td>Polyneuropathies au cours d’affections classées ailleurs</td><td>Destination des polyneuropathies au cours d’une affection classée ailleurs</td></tr><tr><td>G64</td><td>Affection du système nerveux périphérique sans autre indication</td><td>Code résiduel, provisoire par nature</td></tr></tbody></table>
<p>Quatre situations sont exclues du bloc G60–G64 et ne relèvent donc pas de G64 : la névralgie sans autre indication et la névrite sans autre indication (M79.2-), la névrite périphérique de la grossesse (O26.83) et la radiculite sans autre indication (M54.1-). Ces tableaux possèdent leur propre catégorie, ce qui évite de coder la même atteinte deux fois.</p>
<div class="trap"><span class="k">Limite de la source</span> Cette lecture comme « démarche devant une atteinte non étiquetée » est une déduction de structure du dossier, non une recommandation médicale publiée. Elle n’autorise pas à conserver G64 quand une cause est établie.</div><div class="key"><b>À retenir.</b> G64 est un code résiduel sans sous-code. Les catégories voisines G60, G61, G62 et G63* captent les atteintes identifiées, et quatre tableaux sont codés ailleurs.</div>
</section>
<section class="ilot" id="g64-2"><h2><span class="n">2</span>Définitions et profils</h2>

<p>Les polyneuropathies sont des affections généralisées du système nerveux périphérique. Leur prévalence atteint 5 à 8 % selon l’âge. Elles constituent le trouble périphérique le plus fréquent de l’adulte et du sujet âgé. Cette fréquence justifie une démarche systématique plutôt qu’une recherche au hasard, car les causes sont nombreuses et certaines sont curables.</p>
<h3>2.1 Profils de distribution</h3>
<p>La distribution des symptômes est le premier tri. Elle décrit si l’atteinte est symétrique et distale, proximale avec nerfs crâniens, ou faite de plusieurs nerfs isolés.</p>
<table class="t"><thead><tr><th>Profil</th><th>Description</th><th>Conséquence pour la démarche</th></tr></thead><tbody><tr><td>Sensitivomoteur distal symétrique</td><td>Atteinte des deux côtés, plus marquée aux extrémités ; le profil le plus fréquent</td><td>Profil le plus fréquent ; la démarche par étapes s’applique</td></tr><tr><td>Polyradiculonévrite</td><td>Atteinte proximale et distale, du tronc et des nerfs crâniens</td><td>Forme à rechercher devant une paralysie ascendante (<button class="w" data-k="g64-sgb">SGB</button>)</td></tr><tr><td>Mononeuropathie multiple asymétrique</td><td>Plusieurs nerfs atteints simultanément ou successivement</td><td>Fait penser à une vascularite</td></tr></tbody></table>
<h3>2.2 Profils évolutifs</h3>
<p>L’évolution dans le temps est le second tri. Elle sépare les urgences des atteintes lentes, car une aggravation rapide change le niveau de risque.</p>
<table class="t"><thead><tr><th>Évolution</th><th>Exemple cité</th><th>Repère</th></tr></thead><tbody><tr><td>Aiguë</td><td><button class="w" data-k="g64-sgb">SGB</button></td><td>Nadir en quatre semaines au plus</td></tr><tr><td>Subaiguë</td><td>Vascularite</td><td>Évolution par poussées</td></tr><tr><td>Chronique</td><td>Diabète ; <button class="w" data-k="g64-pidc">PIDC</button></td><td><button class="w" data-k="g64-pidc">PIDC</button> : huit semaines ou plus</td></tr><tr><td>Très chronique</td><td>Atteinte héréditaire</td><td>Évolution très lente</td></tr></tbody></table>
<h3>2.3 Neuropathie des petites fibres</h3>
<p>La neuropathie des petites fibres atteint les fibres Aδ, finement myélinisées, et les fibres C, amyélinisées. Elle est dominée par la douleur neuropathique et par des symptômes dysautonomiques. Elle <b>échappe à l’<button class="w" data-k="g64-neurographie">ENG</button> standard</b> : un examen normal ne l’écarte donc pas. Son diagnostic repose sur la densité des fibres nerveuses intraépidermiques, mesurée sur biopsie cutanée, et sur les <button class="w" data-k="g64-petites-fibres">tests sensitifs quantitatifs (<button class="w" data-k="g64-petites-fibres">QST</button>)</button>.</p>
<p>Une revue suisse récente de l’Inselspital de Berne souligne les présentations très variées, les nombreuses causes, la démarche ciblée par étapes et les drapeaux rouges. Le dossier n’a lu que son résumé.</p>
<div class="key"><b>À retenir.</b> Deux tris suffisent pour démarrer : la distribution (symétrique distale, radiculaire, multifocale) et l’évolution (quatre semaines, huit semaines, années). La neuropathie des petites fibres demande des examens propres, car la neurographie standard est normale.</div>
<button class="pareto-btn ui" data-k="pareto-g64-definition">▲ Loi de Pareto — Définition et profils</button></section>
<section class="ilot" id="g64-3"><h2><span class="n">3</span>Fréquence et causes</h2>

<p>Chercher la cause est la tâche centrale devant une atteinte non étiquetée, parce que le traitement causal passe avant le traitement symptomatique. Le tableau regroupe les causes citées par la revue allemande de 2018, avec leurs chiffres.</p>
<table class="t"><thead><tr><th>Cause</th><th>Chiffres cités</th><th>Lecture</th></tr></thead><tbody><tr><td>Diabète</td><td>Première cause en Europe ; neuropathie chez 8 à 54 % (type 1) et 13 à 46 % (type 2)</td><td>Fourchettes larges selon les séries rapportées</td></tr><tr><td>Alcool</td><td>22 à 66 % des personnes avec alcoolisme chronique ; risque au-delà d’environ 100 g/jour pendant des années</td><td>La dose et la durée comptent</td></tr><tr><td>Chimiothérapie</td><td>Souvent 30 à 40 % (10 à 90 % selon molécule et schéma) ; environ 40 % de douleurs chroniques</td><td>La molécule et le schéma décident du risque</td></tr><tr><td>Carences vitaminiques</td><td>Carence en <button class="w" data-k="g64-biologie">B12</button> sans anémie macrocytaire chez environ 50 % des patients neurologiques ; carence <b>et</b> surdosage en vitamine B6 neuropathiques</td><td>Une prise excessive de B6 est aussi une cause</td></tr><tr><td>Toxiques et médicaments</td><td>Métaux lourds, solvants, amiodarone, métronidazole, entre autres</td><td>L’anamnèse professionnelle et médicamenteuse est décisive</td></tr><tr><td>Dysimmunitaires</td><td><button class="w" data-k="g64-sgb">SGB</button> 1 à 2 pour 100 000 par an ; <button class="w" data-k="g64-pidc">PIDC</button> 2 à 3 pour 100 000 ; neuropathie motrice multifocale 0,6 à 2 pour 100 000</td><td>Incidences faibles</td></tr><tr><td>Paraprotéines</td><td>Souvent fortuites ; exceptions : neuropathie à <button class="w" data-k="g64-paraproteine">IgM</button> (<button class="w" data-k="g64-paraproteine">MAG</button>), <button class="w" data-k="g64-poems">POEMS</button>, amylose</td><td>Un pic monoclonal n’explique pas toujours la neuropathie</td></tr><tr><td>Petites fibres</td><td>Associée aux maladies auto-immunes, aux variants des canaux sodiques (<button class="w" data-k="g64-nav">Nav</button>1.7, 1.8, 1.9), au diabète, à la carence en <button class="w" data-k="g64-biologie">B12</button> ; aucune étiologie dans plus de la moitié des cas</td><td>Cause fréquemment inconnue</td></tr><tr><td>Indéterminée</td><td>Jusqu’à 30 % des polyneuropathies</td><td>Souvent sensitive cryptogénique, de bon pronostic</td></tr></tbody></table>
<p>Un calcul simple donne la mesure de la rareté dysimmune. Avec une incidence du <button class="w" data-k="g64-sgb">SGB</button> de 1 à 2 pour 100 000 par an, une ville de 100 000 habitants voit 1 à 2 nouveaux cas par an et un canton de 500 000 habitants 5 à 10. Cette rareté explique que l’on pense au <button class="w" data-k="g64-sgb">SGB</button> sur la clinique, non sur la fréquence.</p>
<p>Une cause évitable existe aussi après chirurgie orthopédique : les neuropathies postopératoires touchent en moyenne 0,14 % des patients, et le positionnement opératoire est responsable de 20 à 30 % d’entre elles (résumé d’une revue suisse de 2023).</p>
<div class="trap"><span class="k">Piège</span> Une fourchette de 8 à 54 % pour le diabète de type 1 montre qu’une partie des diabétiques n’a pas de neuropathie : la présence d’un diabète ne prouve donc pas à elle seule la cause de l’atteinte observée.</div><div class="key"><b>À retenir.</b> Les causes principales sont le diabète, l’alcool, les chimiothérapies, les carences, les toxiques et les atteintes dysimmunes. Jusqu’à 30 % des polyneuropathies restent sans cause établie.</div>
<button class="pareto-btn ui" data-k="pareto-g64-causes">▲ Loi de Pareto — Fréquence et causes</button></section>
<section class="ilot" id="g64-4"><h2><span class="n">4</span>Mécanismes</h2>

<p>Comprendre le mécanisme explique pourquoi un profil clinique correspond à une cause et pourquoi un examen normal n’écarte pas un diagnostic. Le dossier documente trois mécanismes principaux, résumés dans le tableau.</p>
<table class="t"><thead><tr><th>Mécanisme</th><th>Lésion</th><th>Profil attendu</th><th>Examen qui la révèle</th></tr></thead><tbody><tr><td>Axonale ou démyélinisante</td><td>Atteinte de l’axone ou de sa gaine</td><td>Selon la cause</td><td><button class="w" data-k="g64-neurographie">ENG</button> et <button class="w" data-k="g64-neurographie">EMG</button> les distinguent ; la biopsie nerveuse les sépare</td></tr><tr><td>Vascularite</td><td>Inflammation de la paroi des vasa nervorum, ischémie, dégénérescence axonale</td><td>Asymétrique, multifocal, douloureux, aux membres inférieurs, par poussées</td><td>Biopsie nerf, muscle et peau ; pas de démyélinisation à l’électrophysiologie</td></tr><tr><td>Petites fibres</td><td>Hyperexcitabilité des nocicepteurs par variants des canaux <button class="w" data-k="g64-nav">Nav</button>1.7 à 1.9</td><td>Douleur neuropathique et dysautonomie</td><td>Biopsie cutanée, <button class="w" data-k="g64-petites-fibres">QST</button> ; neurographie standard normale</td></tr></tbody></table>
<h3>4.1 Atteinte axonale ou démyélinisante</h3>
<p>La neurographie et l’<button class="w" data-k="g64-neurographie">EMG</button> distinguent l’atteinte axonale de l’atteinte démyélinisante. La biopsie nerveuse sépare aussi les deux et peut montrer des infiltrats inflammatoires ou une amylose. Le dossier ne rattache pas chaque cause à un type précis, sauf pour la vascularite.</p>
<h3>4.2 Vascularite nerveuse</h3>
<p>La séquence est la suivante. Une inflammation de la paroi des vasa nervorum, les petits vaisseaux qui nourrissent le nerf, lèse le vaisseau ; l’irrigation du nerf chute ; l’ischémie fait dégénérer l’axone. Par déduction, une atteinte qui suit la distribution des vaisseaux touche des nerfs isolés, d’où le profil asymétrique multifocal. L’électrophysiologie ne montre pas de démyélinisation, ce qui est cohérent avec une lésion axonale primaire (guideline PNS 2010).</p>
<h3>4.3 Petites fibres et canaux sodiques</h3>
<p>Les variants à gain de fonction des canaux <button class="w" data-k="g64-nav">Nav</button>1.7, 1.8 et 1.9 rendent les nocicepteurs hyperexcitables. Cette excitabilité accrue est le mécanisme proposé de la douleur neuropathique de la neuropathie des petites fibres. Le tableau clinique forme un continuum, selon la distribution de la douleur et la présence ou non d’une dysautonomie.</p>
<h3>4.4 Compression et étirement</h3>
<p>Après chirurgie orthopédique, la compression ou l’étirement lors de positions prolongées lèse des nerfs isolés. Le mécanisme est mécanique et la prévention passe par le positionnement.</p>
<div class="trap"><span class="k">Limite de la source</span> Le dossier ne contient pas la physiologie normale du nerf (conduction, transport axonal). Les mécanismes ci-dessus décrivent donc ce qui est lu, non une théorie complète de la neuropathie.</div><div class="key"><b>À retenir.</b> Trois mécanismes expliquent des profils distincts : axonal ou démyélinisant, vasculaire par ischémie, et excitabilité nociceptive par canaux sodiques. L’examen choisi dépend du mécanisme suspecté.</div>
<button class="pareto-btn ui" data-k="pareto-g64-mecanismes">▲ Loi de Pareto — Mécanismes</button></section>
<section class="ilot" id="g64-5"><h2><span class="n">5</span>Anamnèse</h2>

<p>L’interrogatoire fournit la plupart des causes curables avant tout examen complémentaire. La revue allemande de 2018 recommande une anamnèse personnelle, systémique, professionnelle, sociale et familiale, qui recherche des symptômes sensitifs, moteurs et autonomes. Le tableau relie chaque question à la cause qu’elle cherche.</p>
<table class="t"><thead><tr><th>Question</th><th>Cause recherchée</th><th>Pourquoi elle compte</th></tr></thead><tbody><tr><td>Diabète connu ou glycémie élevée</td><td>Neuropathie diabétique</td><td>Première cause en Europe</td></tr><tr><td>Quantité d’alcool par jour et durée</td><td>Neuropathie alcoolique</td><td>Risque au-delà d’environ 100 g/jour pendant des années</td></tr><tr><td>Chimiothérapie, amiodarone, métronidazole</td><td>Neuropathie médicamenteuse</td><td>Le risque dépend de la molécule et du schéma</td></tr><tr><td>Profession : métaux lourds, solvants</td><td>Neuropathie toxique</td><td>Le retrait du toxique est le traitement causal</td></tr><tr><td>Compléments vitaminiques, régime</td><td>Carence ou excès de B6 et de B12</td><td>Les deux directions sont neuropathiques</td></tr><tr><td>Infection digestive ou respiratoire récente</td><td><button class="w" data-k="g64-sgb">SGB</button></td><td>Paralysie ascendante après infection</td></tr><tr><td>Chirurgie récente, position prolongée</td><td>Neuropathie compressive postopératoire</td><td>Le positionnement est en cause dans 20 à 30 % des cas</td></tr><tr><td>Antécédents familiaux, début précoce</td><td>Atteinte héréditaire</td><td>Évolution très chronique</td></tr><tr><td>Traitement par inhibiteurs de points de contrôle immunitaire</td><td>Neuropathie dysimmune</td><td>Aiguë ou chronique</td></tr><tr><td>Ordre d’apparition et vitesse</td><td>Profil évolutif</td><td>Quatre semaines ou huit semaines orientent</td></tr></tbody></table>
<p>Pour la vignette, le médecin demande la chronologie exacte (huit mois), la quantité d’alcool réellement consommée, la liste des médicaments et des compléments, la profession et la présence de symptômes autonomes.</p>
<div class="key"><b>À retenir.</b> L’anamnèse recherche d’abord ce qui se corrige : toxique, médicament, carence, alcool, équilibre glycémique.</div>
</section>
<section class="ilot" id="g64-6"><h2><span class="n">6</span>Examen clinique</h2>

<p>Un signe clinique associe sensibilité et spécificité élevées dans la revue allemande de 2018 : l’<b>aréflexie distale</b> accompagnée d’une <b>hypopallesthésie</b> (perception des vibrations diminuée) ou d’une <b>hypoalgésie à la piqûre</b>.</p>
<p>L’examen précise ensuite quatre points. La distribution dit si l’atteinte est symétrique distale, proximale avec nerfs crâniens ou asymétrique multifocale. La force et les réflexes séparent la composante motrice de la composante sensitive. Les symptômes autonomes orientent vers les petites fibres. La peau et l’état général cherchent des indices de maladie systémique, par exemple une organomégalie ou des lésions cutanées, qui, avec une paraprotéine, font penser à un syndrome <button class="w" data-k="g64-poems">POEMS</button>.</p>
<table class="t"><thead><tr><th>Constatation</th><th>Interprétation</th><th>Suite</th></tr></thead><tbody><tr><td>Aréflexie distale + hypopallesthésie ou hypoalgésie</td><td>Polyneuropathie probable (sensible et spécifique)</td><td>Démarche par étapes</td></tr><tr><td>Déficit asymétrique de plusieurs nerfs</td><td>Mononeuropathie multiple</td><td>Chercher une vascularite</td></tr><tr><td>Atteinte proximale et distale, nerfs crâniens</td><td>Polyradiculonévrite</td><td>Évaluer l’évolution et la gravité</td></tr><tr><td>Douleur neuropathique et symptômes autonomes</td><td>Petites fibres possibles</td><td>Biopsie cutanée ou <button class="w" data-k="g64-petites-fibres">QST</button></td></tr></tbody></table>
<p>Pour la vignette, l’aréflexie achilléenne avec hypopallesthésie et hypoalgésie distales est le signe d’appel. Le profil est symétrique distal, d’évolution chronique : la démarche commence par le bilan de base.</p>
<div class="trap"><span class="k">Piège</span> Une neurographie normale n’écarte pas l’atteinte des petites fibres. Le diagnostic est clinique d’abord, puis confirmé par la biopsie cutanée ou les tests sensitifs quantitatifs.</div><div class="key"><b>À retenir.</b> Aréflexie distale plus hypopallesthésie ou hypoalgésie à la piqûre : le signe le plus utile. La distribution et l’évolution donnent la suite.</div>
<button class="pareto-btn ui" data-k="pareto-g64-clinique">▲ Loi de Pareto — Anamnèse et examen</button></section>
