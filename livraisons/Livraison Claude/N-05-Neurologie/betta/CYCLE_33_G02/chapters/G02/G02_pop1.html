<template data-pop="g02-codage" data-title="Astérisque et croix : coder une méningite secondaire"><div class="lab">Règle</div><p>La CIM-10-GM distingue le code <b>à croix (†)</b>, qui désigne la maladie causale, et le code <b>à astérisque (*)</b>, qui désigne sa manifestation dans un organe. G02* est un astérisque : il ne s’emploie jamais seul. Une méningite cryptococcique se code B45.1† pour la maladie et G02.1* pour la méningite.</p><div class="lab">Application</div><p>Le médecin note d’abord la maladie causale, puis ajoute le code de la manifestation. Ainsi, une méningite à entérovirus se code A87.0† et G02.0* ; un zona méningé B02.1† et G02.0*.</p><div class="lab">Limite</div><p>Les libellés français viennent du registre de l’Office fédéral de la statistique ; la classification originale est allemande. La cartographie vers la CIM-11 reste à établir.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>.</p></template>
<template data-pop="g02-voisinages" data-title="Voisinages : G01*, G03 et G05*"><p>Quatre catégories se ressemblent et se distinguent par l’agent et par l’atteinte :</p><table class="t"><thead><tr><th>Code</th><th>Contenu</th><th>Quand le choisir</th></tr></thead><tbody><tr><td>G01*</td><td>Méningite au cours de maladies bactériennes classées ailleurs</td><td>Agent bactérien documenté (leçon précédente)</td></tr><tr><td>G02*</td><td>Méningite au cours d’autres maladies infectieuses et parasitaires</td><td>Virus, champignon ou parasite identifié</td></tr><tr><td>G03.0</td><td>Méningite non purulente (abactérienne)</td><td>Méningite lymphocytaire sans agent identifié</td></tr><tr><td>G05.1* / G05.2*</td><td>Méningo-encéphalite et méningomyélite au cours de maladies virales ou autres</td><td>Dès qu’une atteinte du parenchyme est établie</td></tr></tbody></table><p>La frontière la plus utile en clinique est la dernière : le passage à G05.1* correspond au basculement qui impose l’aciclovir.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a>.</p></template>
<template data-pop="g02-criteres-ie" data-title="Critères de l’International Encephalitis Consortium"><div class="lab">Définition</div><p>Le <b>critère majeur</b> est une altération de la conscience, de la personnalité ou une manifestation psychiatrique durant plus de 24 heures sans autre cause. Les <b>critères mineurs</b> sont : fièvre de 38 °C ou plus dans les 72 heures, crises non expliquées par une épilepsie connue, nouveaux signes focaux, leucocytes du liquide de 5 par mm³ ou plus, imagerie évocatrice récente, électroencéphalogramme anormal compatible.</p><div class="lab">Application</div><p>Le critère majeur, associé à des critères mineurs, fait suspecter une encéphalite et donc sortir de la méningite virale simple.</p><div class="lab">Limite</div><p>Le nombre de critères mineurs nécessaires n’a pas été relevé dans les sources lues ; la fenêtre ne le précise donc pas.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-meningo-enceph" data-title="Méningite ou méningo-encéphalite : la frontière"><p>La méningite virale respecte la conscience. Dès qu’un patient devient confus, somnolent, aphasique, crie ou convulse, le tableau change de nature : le virus touche le parenchyme. La conséquence est thérapeutique : l’aciclovir intraveineux, qu’aucune preuve n’impose dans la méningite isolée, devient immédiat. Le méningisme peut même manquer dans l’encéphalite.</p><div class="trap"><span class="k">Piège</span> Un patient « seulement fébrile et un peu ralenti » ne relève pas d’une méningite virale simple ; le ralentissement est un signe encéphalitique.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-triade" data-title="Triade clinique : fréquence réelle"><div class="lab">Définition</div><p>La triade associe fièvre, céphalée et raideur de nuque. Dans la cohorte danoise de 1066 épisodes, la céphalée apparaît chez 95 %, la fièvre chez 71 %, la photophobie ou l’hyperacousie chez 67 % et la raideur de nuque chez 36 %. La triade complète n’est présente que chez 28 %.</p><div class="lab">Application</div><p>L’absence de raideur de nuque n’exclut donc pas une méningite : près de deux patients sur trois n’ont pas ce signe.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-lcr-normal" data-title="Liquide céphalo-rachidien : normal et pathologique"><div class="lab">Normal</div><p>Clair, moins de 5 leucocytes par µl.</p><div class="lab">Pathologique</div><p>Dans la méningite virale : moins de 1000 cellules par µl, mixtes à la phase précoce puis lymphocytaires, protéines et lactate normaux ou à peine élevés. Dans la cohorte danoise, la médiane est de 160 cellules par µl (écart interquartile 60–358).</p><div class="lab">Pièges</div><p>Un liquide précoce à granulocytes n’exclut pas un virus. L’encéphalite peut montrer des protéines peu élevées et un lactate au plus de 4,0 mmol/l.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-pleiocytose-mixte" data-title="Pléiocytose mixte précoce : ne pas conclure trop vite"><p>Dans les 4 à 48 premières heures d’une infection virale, le liquide contient 25 à 1000 cellules par µl, avec lymphocytes, monocytes et granulocytes. Ce profil ressemble à celui d’une méningite bactérienne. Trois éléments aident à trancher : la procalcitonine (normale, inférieure à 0,5 ng/ml, dans le viral), le lactate du liquide et l’évolution clinique. Tant que l’incertitude persiste, l’antibiothérapie provisoire (céphalosporine de 3e génération et ampicilline pour couvrir Listeria) est justifiée.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-synthese-intrathecale" data-title="Indice d’anticorps : calcul et délai"><div class="lab">Définition</div><p>Indice = (anticorps du liquide × IgG du sérum) / (IgG du liquide × anticorps du sérum). Il est positif au-dessus de 1,5.</p><div class="lab">Application</div><p>Le calcul rapporte les anticorps spécifiques à la quantité totale d’IgG de chaque compartiment, ce qui corrige le passage passif depuis le sang. Dans la méningite virale, il n’existe pas de synthèse intrathécale ; dans les encéphalites (herpès simplex, varicelle-zona, cytomégalovirus, FSME), elle apparaît après plus de 10 jours.</p><div class="lab">Limite</div><p>L’indice est tardif : la directive recommande donc la PCR en première intention et l’indice d’anticorps seulement après deux semaines pour les herpèsvirus.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-pct" data-title="Procalcitonine et lactate du liquide"><p>Une procalcitonine inférieure à 0,5 ng/ml soutient une origine virale ; elle est toujours élevée dans les méningites bactériennes aiguës. La protéine C réactive dépasse rarement 50 mg/l dans les infections virales. Le lactate du liquide sépare utilement viral et bactérien ; il se mesure désormais au lit du patient.</p><div class="trap"><span class="k">Piège</span> Un marqueur bas ne dispense jamais du liquide ; il oriente, il ne tranche pas seul.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-pcr-lcr" data-title="PCR du liquide céphalo-rachidien : choix et pièges"><div class="lab">Application</div><p>La PCR (ou la PCR multiplex) se fait sur liquide non centrifugé. Elle recherche l’herpès simplex, le virus varicelle-zona, le cytomégalovirus, le virus d’Epstein-Barr, le JCV, les flavivirus et les entérovirus. L’herpès simplex, le virus varicelle-zona et le cytomégalovirus se cherchent par PCR d’ADN, les entérovirus par PCR d’ARN, le VIH par PCR d’ARN avec sérologie.</p><div class="lab">Pièges</div><p>La PCR du virus d’Epstein-Barr peut être faussement positive en cas de pléiocytose. En cas de signes d’encéphalite, le traitement part sans attendre le résultat.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-pcr-rapide-ev" data-title="PCR rapide des entérovirus : le gain mesuré à Lausanne"><p>Au CHUV, 59 adultes ont été étudiés (observationnel monocentrique). La PCR automatisée GeneXpert a ramené le délai de résultat de 60 à 5 heures. Les antibiotiques ont été réduits à une dose unique. L’hospitalisation médiane était de 4 jours sans PCR ou avec PCR négative, de 2 jours avec PCR classique, de 0,5 jour avec PCR rapide ; le coût est passé de 5458 à 921 dollars.</p><div class="trap"><span class="k">Piège</span> Une étude monocentrique ne se généralise pas sans réserve : le gain dépend du délai local de la PCR classique.</div><p class="src">Références : <a href="https://doi.org/10.1016/j.jcv.2014.11.001" target="_blank" rel="noopener">Giulieri et al., PCR rapide des entérovirus, CHUV, J Clin Virol 2015</a>.</p></template>
<template data-pop="g02-enterovirus" data-title="Entérovirus : cause la plus fréquente"><p>Les entérovirus représentent 39 % des épisodes danois et sont la cause la plus fréquente de méningite aseptique. À Genève, l’échovirus 30 prédominait chez l’enfant de 3 ans et plus et chez l’adulte. Chez l’enfant, l’infection est disséminée (sang, selles) avec une virémie élevée ; chez l’adulte, aucun cas n’était positif dans les selles ni dans le sang, ce qui suggère des voies d’accès différentes. En 2023, l’échovirus 11 a causé des formes néonatales graves.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1016/j.jcv.2017.01.008" target="_blank" rel="noopener">Cordey et al., entérovirus du SNC, HUG, J Clin Virol 2017</a>.</p></template>
<template data-pop="g02-vzv" data-title="Varicelle-zona : méningite et terrain"><p>Le virus varicelle-zona représente 15 % des méningites virales de l’adulte danois. L’immunosuppression est présente dans 20 % des cas et un zona dans 60 %. La PCR d’ADN du liquide confirme l’agent. L’aciclovir intraveineux est recommandé dans l’encéphalite ; la brivudine est une alternative, contre-indiquée avec les fluoropyrimidines.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-hsv2" data-title="Méningite à herpès simplex de type 2"><p>Le virus représente 16 % des méningites virales de l’adulte danois, avec 77 % de femmes. Il peut provoquer une méningite isolée, une radiculite lombosacrée (Elsberg) ou une forme récidivante (Mollaret). La réactivation est récurrente : 22 % des épisodes évoluent vers une méningite récidivante. Dans cette cohorte, le délai d’administration de l’aciclovir n’était pas associé au pronostic.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a>.</p></template>
<template data-pop="g02-mollaret" data-title="Méningite lymphocytaire bénigne récidivante (Mollaret)"><div class="lab">Définition</div><p>Forme récidivante bénigne, surtout liée à l’herpès simplex de type 2. Incidence 1,2 par million d’adultes et par an. Les cellules de Mollaret ne sont pas pathognomoniques et la PCR de l’herpès simplex de type 2 n’est que parfois positive.</p><div class="lab">Pronostic</div><p>Meilleur que celui d’un épisode isolé. Hospitalisation pour récidive : 6 % par an ; rapport de risques de 3,93 après trois épisodes antérieurs ou plus.</p><div class="lab">Traitement</div><p>Le valaciclovir à 2 × 500 mg n’empêche pas les récidives méningées ; un rebond est observé à l’arrêt (rapport de risques de 3,29 la deuxième année). La dose était probablement insuffisante pour le système nerveux.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://doi.org/10.1111/ene.16081" target="_blank" rel="noopener">Petersen et al., méningite de Mollaret au Danemark, Eur J Neurol 2024</a> ; <a href="https://doi.org/10.1093/cid/cis031" target="_blank" rel="noopener">Aurelius et al., valaciclovir après méningite à HSV-2, Clin Infect Dis 2012</a>.</p></template>
<template data-pop="g02-elsberg" data-title="Syndrome d’Elsberg : radiculite lombosacrée virale"><p>Série danoise de 28 adultes : rétention urinaire chez tous (sondage chez 61 %), signes méningés chez 82 %, lésions génitales chez 46 %, liquide médian de 153 cellules par µl, herpès simplex de type 2 chez 68 % et varicelle-zona chez 7 %. Les femmes représentent 79 %. À 30 jours, 11 % sont encore sondés ; à 180 jours, 20 % gardent une invalidité modérée (Glasgow Outcome Scale 4).</p><div class="trap"><span class="k">Piège</span> Une rétention urinaire avec céphalées fébriles n’est pas fonctionnelle : elle fait chercher une radiculite virale.</div><p class="src">Références : <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a>.</p></template>
<template data-pop="g02-oreillons" data-title="Oreillons et méningite ourlienne"><p>La parotidite est d’abord unilatérale puis souvent bilatérale, après 1 à 2 jours de prodromes. Une orchite survient chez 20 à 30 % des hommes pubères ; la surdité permanente est très rare. La méningite est l’une des complications les plus fréquentes chez l’enfant et guérit en général sans séquelle. En Suisse, moins de 1000 cas par an ont été déclarés ces dernières années.</p><p class="src">Références : <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a>.</p></template>
<template data-pop="g02-vaccination" data-title="Vaccination ROR et RORV en Suisse"><p>Le vaccin contre la rougeole, les oreillons et la rubéole est donné à 9 et 12 mois ; le vaccin tétravalent avec la varicelle (RORV) est préféré depuis 2023. Deux doses protègent en général à vie. La vaccination a fait reculer la méningite ourlienne.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.bag.admin.ch/fr/oreillons" target="_blank" rel="noopener">OFSP, oreillons</a>.</p></template>
<template data-pop="g02-fsme" data-title="FSME : voisinage clinique"><p>La méningo-encéphalite à tiques relève du code A84 et sort du périmètre strict de G02. Elle compte 245 cas en Suisse en 2023 (chiffre cité par la directive S1) ; tous les cantons sauf le Tessin sont zones à risque. Diagnostic : sérologie du sang et du liquide (indice d’anticorps), PCR précoce. L’IRM peut montrer une atteinte asymétrique des noyaux gris.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.bag.admin.ch/de/zeckenuebertragene-krankheiten" target="_blank" rel="noopener">OFSP, maladies transmises par les tiques</a>.</p></template>
<template data-pop="g02-diam" data-title="Méningite aseptique médicamenteuse"><p>Les anti-inflammatoires non stéroïdiens (ibuprofène) et certains antibiotiques peuvent provoquer une méningite aseptique, cliniquement identique à une méningite virale. L’anamnèse médicamenteuse permet de la suspecter ; la chronologie fait le diagnostic.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-hsve" data-title="Encéphalite herpétique : exclure avant tout"><p>Tout signe encéphalitique impose l’aciclovir intraveineux immédiat, sans attendre la ponction lombaire si une hypertension intracrânienne ou une contre-indication existe. La prise en charge se fait en soins intensifs. L’IRM montre une atteinte temporale puis frontobasale. Une encéphalite herpétique peut ensuite déclencher une encéphalite anti-NMDAR.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-autoimmune" data-title="Encéphalite auto-immune : quand y penser"><div class="lab">Critères de Graus 2016 (« possible »)</div><p>Début subaigu (moins de 3 mois) de troubles de mémoire, psychiatriques ou de conscience, avec un signe focal, une pléiocytose supérieure à 5, des crises ou une IRM évocatrice, et exclusion des alternatives. Elle est suspectée quand aucun pathogène n’est retrouvé (anti-NMDAR, CASPR2, LGI1).</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-imagerie" data-title="IRM dans les encéphalites"><p>L’IRM est la méthode de choix ; le scanner n’est qu’un dépistage ou un substitut. L’atteinte temporale puis frontobasale évoque l’herpès simplex, l’atteinte asymétrique des noyaux gris la FSME. L’imagerie ne retarde pas l’aciclovir.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-cryptocoque" data-title="Cryptococcose : terrain et diagnostic"><p>Présentation la plus fréquente et la plus grave : la méningite. Troisième infection fongique invasive du transplanté ; 50 à 70 % des infections à <i>C. gattii</i> touchent des hôtes apparemment immunocompétents. Mortalité de 24 à 47 % à 10 semaines. Chez tout patient atteint, une immunodéficience est recherchée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-crag" data-title="Antigène cryptococcique : liquide, sang et dépistage"><p>L’antigène du liquide et du sang et la culture fondent le diagnostic. Le dépistage sanguin par test à flux latéral se fait chez l’adulte VIH dont les CD4 sont inférieurs à 200 par mm³. Certains tests commerciaux ne détectent pas <i>C. gattii</i>.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-pic" data-title="Hypertension intracrânienne et ponctions évacuatrices"><div class="lab">Règle</div><p>Pression d’ouverture d’au moins 20 cm d’eau avec symptômes : ponctions évacuatrices quotidiennes (environ 20–30 ml) jusqu’à 50 % de la pression initiale ou 20 cm au plus. Ponction programmée à 48–72 heures ou au 7e jour quelle que soit la pression. En cas d’échec, dérivation, de préférence ventriculo-péritonéale.</p><div class="lab">À éviter</div><p>Acétazolamide, mannitol et corticoïdes sont possiblement délétères.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-tar-iris" data-title="Antirétroviral et syndrome inflammatoire de restauration immunitaire"><p>Dans la cryptococcose, le traitement antirétroviral n’est ni immédiat ni très précoce : il est différé de 4 à 6 semaines. Le syndrome inflammatoire de restauration immunitaire (IRIS) persistant relève de la prednisone (0,5–1 mg/kg). La dexaméthasone systématique n’est pas recommandée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a>.</p></template>
<template data-pop="g02-tha" data-title="Trypanosomiase humaine africaine"><p>Stade 1 hémolymphatique non spécifique, stade 2 méningo-encéphalitique (troubles du sommeil, coma, décès sans traitement). La forme gambiense (92 % des cas 2018–2022) évolue lentement ; la forme rhodesiense évolue vite. Le fexinidazole oral est recommandé pour les deux formes.</p><p class="src">Références : <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p></template>
<template data-pop="g02-candidose" data-title="Candidose du système nerveux : état des sources"><p>L’ESCMID 2012 retient l’amphotéricine B liposomale avec ou sans flucytosine pour les candidoses profondes graves. Le schéma propre au système nerveux n’a pas été lu ; cette recommandation est ancienne. L’amphotéricine B désoxycholate n’est recommandée pour aucune indication.</p><p class="src">Références : <a href="https://doi.org/10.1111/1469-0691.12039" target="_blank" rel="noopener">ESCMID, maladies à Candida, 2012</a>.</p></template>
<template data-pop="g02-gos" data-title="Glasgow Outcome Scale : repères utilisés ici"><p>Dans la cohorte danoise, un score de 1 à 4 définit un pronostic défavorable à 30 jours (20 % des patients). Dans le syndrome d’Elsberg, le score 4 correspond à une invalidité modérée. Les autres niveaux ne sont pas décrits dans les sources lues.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a>.</p></template>
<template data-pop="g02-nouveau-ne" data-title="Nouveau-né"><p>L’échovirus 11 (2023, France et autres pays européens) a causé méningite, sepsis, myocardite et insuffisance hépatique fulminante ; 7 décès sur 9 dans la série française. L’aciclovir est dosé à 20 mg/kg toutes les 8 heures, 21 jours en cas d’atteinte du système nerveux.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680603250014" target="_blank" rel="noopener">Information professionnelle suisse Aciclovir Labatec® i.v., décembre 2025</a>.</p></template>
<template data-pop="g02-immunodeprime" data-title="Immunodéprimé : agents et foscarnet"><p>Cytomégalovirus, virus d’Epstein-Barr, varicelle-zona, JCV. Une résistance de l’herpès simplex à l’aciclovir est décrite au cours du sida et de la transplantation ; le foscarnet est l’alternative citée par la directive S1. Sa posologie n’a pas été lue.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-sources-guides" data-title="Organisations et guides cités"><ul><li><b>DGN</b> : Société allemande de neurologie, directive S1 de février 2025 (consensus d’experts).</li><li><b>ECMM/ISHAM</b> : recommandation mondiale sur la cryptococcose, 2024.</li><li><b>ESCMID</b> : recommandations sur la candidose, 2012.</li><li><b>OMS</b> : trypanosomiase, 2024.</li><li><b>OFSP</b> : oreillons, tiques.</li><li><b>Swissmedic</b> : informations professionnelles.</li></ul></template>
<template data-pop="g02-lacunes" data-title="Limites du dossier"><ul><li>Aucune recommandation suisse dédiée à la méningite virale ou fongique n’a été trouvée.</li><li>Recommandation britannique de 2016 et recommandations EFNS/EAN non lues.</li><li>Candidose du système nerveux, coccidioïdomycose, maladie de Chagas : aucune source utile lue.</li><li>Trypanosomiase : seuils de liquide et autres schémas non lus.</li><li>Flucytosine : pas d’information professionnelle suisse trouvée.</li></ul></template>
<template data-pop="g02-cohorte-danoise" data-title="Cohorte danoise 2015–2020 : ce qu’elle établit"><div class="lab">Population</div><p>1066 épisodes de méningite virale chez l’adulte, cohorte nationale prospective ; âge médian 33 ans ; 54 % de femmes ; incidence 4,7 pour 100 000 par an.</p><div class="lab">Résultats</div><p>Entérovirus 39 %, herpès simplex de type 2 16 %, varicelle-zona 15 %, autres 3 %, non identifié 27 %. Céphalées 95 %, fièvre 71 %, photophobie ou hyperacousie 67 %, raideur de nuque 36 %, triade complète 28 %. Pronostic défavorable (Glasgow Outcome Scale 1 à 4) à 30 jours chez 20 % ; le sexe féminin porte un risque relatif de 1,34 ; le délai d’aciclovir n’est pas associé au pronostic des méningites à herpès simplex de type 2 ou varicelle-zona.</p><div class="lab">Limite</div><p>Étude danoise, lue au niveau du résumé : les valeurs ne se transposent pas telles quelles à la Suisse, où aucune cohorte comparable n’a été retrouvée.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a>.</p></template>
<template data-pop="g02-dgn-niveaux" data-title="Quatre niveaux de recherche diagnostique (directive S1)"><p>Niveau 1 : virus traitables (herpès simplex 1 et 2, varicelle-zona, cytomégalovirus, VIH). Niveau 2 : traitement potentiel non disponible (virus d’Epstein-Barr, échovirus, coxsackie). Niveau 3 : virus fréquents non traitables (FSME, adénovirus, herpèsvirus humain 6, rougeole, rubéole). Niveau 4 : constellations particulières (poliovirus, rage, LCMV, hantavirus, voyage). Le niveau règle l’urgence et l’étendue de la recherche, pas la gravité du patient.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a>.</p></template>
<template data-pop="g02-voyage" data-title="Voyage : agents à évoquer"><p>Virus Toscana en Italie, virus West Nile en Méditerranée, encéphalite japonaise en Asie du Sud-Est, dengue et rage dans le monde. Un séjour en Afrique subsaharienne évoque la trypanosomiase africaine. L’anamnèse précise le lieu, la date et les piqûres, car la sérologie ou la PCR se choisit selon l’agent suspecté.</p><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN, méningo-encéphalite virale, directive S1, février 2025</a> ; <a href="https://www.who.int/publications/i/item/9789240096035" target="_blank" rel="noopener">OMS, traitement de la trypanosomiase humaine africaine, 2024</a>.</p></template>
<template data-pop="g02-ambition" data-title="Induction à dose unique d’amphotéricine B liposomale"><p>Le schéma alternatif de l’ECMM (amphotéricine B liposomale 10 mg/kg en dose unique, puis flucytosine 25 mg/kg 4 fois par jour pendant 14 jours et fluconazole 1200 mg/j) a été testé dans l’essai AMBITION en milieu à ressources limitées. La mortalité était de 24,8 % avec la dose unique, contre 28,7 % avec le schéma comparé. L’information professionnelle suisse d’AmBisome® reprend une induction à haute dose analogue (10 mg/kg au premier jour). La transposition aux pays à ressources élevées n’est pas établie dans les sources lues.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11526416/" target="_blank" rel="noopener">ECMM/ISHAM, recommandation mondiale sur la cryptococcose, Lancet Infect Dis 2024</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680533420198" target="_blank" rel="noopener">Information professionnelle suisse AmBisome®, janvier 2025</a>.</p></template>
<template data-pop="g02-sexe" data-title="Femmes surreprésentées"><p>Les femmes représentent 54 % des méningites virales danoises, 77 % de celles à herpès simplex de type 2 et 79 % des radiculites d’Elsberg. Le sexe féminin porte aussi un risque relatif de 1,34 de pronostic défavorable à 30 jours. Ces associations sont observationnelles : elles ne démontrent pas une cause.</p><p class="src">Références : <a href="https://doi.org/10.1093/brain/awad089" target="_blank" rel="noopener">Petersen et al., méningite virale de l’adulte, Brain 2023</a> ; <a href="https://doi.org/10.1007/s15010-023-02113-9" target="_blank" rel="noopener">Petersen et al., radiculite lombosacrée virale (Elsberg), Infection 2024</a>.</p></template>
