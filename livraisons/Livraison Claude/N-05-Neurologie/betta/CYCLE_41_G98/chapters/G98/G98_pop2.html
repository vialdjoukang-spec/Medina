<template data-pop="g98-bisphosphonates" data-title="Alendronate, pamidronate, zolédronate"><div class="lab">Position de l’IWGDF 2023</div><p>Ne pas utiliser dans la CNO active (recommandation forte, certitude modérée). La même recommandation vise la calcitonine, la parathormone et la méthylprednisolone.</p><div class="lab">Ce que le dossier ne donne pas</div><p>Le détail de la justification, les informations professionnelles Swissmedic, les contre-indications et les posologies de ces produits n’ont pas été lus. Aucun usage n’est donc proposé : la lecture de l’information professionnelle suisse du produit exact s’impose avant toute prescription réelle.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></template>
<template data-pop="g98-denosumab" data-title="Denosumab"><div class="lab">Position de l’IWGDF 2023</div><p>Déconseillé dans la CNO active (recommandation conditionnelle, certitude faible). Cette force plus basse signale une conduite moins ferme que pour les produits de la fenêtre précédente.</p><div class="lab">Limite</div><p>Information professionnelle Swissmedic non consultée ; aucune posologie reprise.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></template>
<template data-pop="g98-vitd" data-title="Vitamine D et calcium"><div class="lab">Position de l’IWGDF 2023</div><p>Évaluer le statut en vitamine D et en calcium pendant la consolidation, selon les recommandations de supplémentation (conditionnelle, faible).</p><div class="lab">Limite</div><p>Aucune posologie, aucune valeur cible ni aucune information professionnelle suisse n’ont été lues. Le cours renvoie aux recommandations nationales de supplémentation sans les citer.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></template>
<template data-pop="pareto-g98-clin" data-title="Pareto — Notions et clinique"><p class="ratio" data-cover="g98-0,g98-1,g98-2,g98-3,g98-4,g98-5,g98-6"></p><ul><li>Pied rouge, chaud, tuméfié, à peau intacte, chez un patient neuropathique : <button class="w" data-k="g98-cno">CNO</button> active jusqu’à preuve du contraire.</li><li>G98 est résiduel, sans sous-code ; le Charcot se code G98† + M14.6-* sauf diabétique (E10–E14† .6) et tabétique (A52.1†) : voir <button class="w" data-k="g98-codage">croix et étoile</button>.</li><li>Rémission, et non guérison : le risque de <button class="w" data-k="g98-reactivation">réactivation</button> persiste ; le pied opposé est un nouvel épisode.</li><li>Quatre stades évolutifs ; Eichenholtz 0 à IV ; zones II et III de Sanders-Frykberg environ 80 % des cas.</li><li>Mortalité à cinq ans 29 % ; amputation multipliée par 6 à 12 si ulcère sur déformation.</li><li>Cascade : neuropathie, traumatisme, cytokines, RANKL, ostéoclastes, fractures, pied à bascule.</li></ul></template>
<template data-pop="pareto-g98-crit" data-title="Pareto — Suivi, situations particulières et critères"><p class="ratio" data-cover="g98-7,g98-8,g98-9,g98-10,g98-11,g98-12,g98-13,g98-14"></p><ul><li>Différence cutanée de 2 °C : sensible, non spécifique.</li><li>Radiographies normales : IRM (forte ; modérée). Biologie : non recommandée au diagnostic.</li><li>Dès la suspicion : <button class="w" data-k="g98-decharge">décharge</button> non amovible jusqu’au genou, plâtre à contact total en premier choix.</li><li>À ne pas utiliser : bisphosphonates, calcitonine, parathormone, méthylprednisolone ; denosumab déconseillé.</li><li>Rémission : température, œdème et imagerie combinés ; décharge poursuivie 4 à 6 semaines après.</li><li>Critères formels : inflammation clinique et anomalies d’imagerie, après exclusion de l’infection, de la goutte et de la thrombose veineuse profonde.</li></ul></template>
<template data-pop="pareto-g98-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g98-e-1,g98-e-2,g98-e-3,g98-e-4,g98-e-5"></p><ul><li>Radiographies bilatérales en charge, puis <button class="w" data-k="g98-irm">IRM</button> si elles sont normales.</li><li>IRM : œdème médullaire d’abord, déformation ensuite ; gadolinium réservé à l’infection.</li><li>Alternatives : scintigraphie, TDM, SPECT-CT, PET-CT (conditionnelles, faibles).</li><li>Ostéomyélite : IRM sensibilité 77–100 %, spécificité 80–100 %.</li></ul></template>
<template data-pop="pareto-g98-s-anat" data-title="Pareto — Anatomie et biomécanique"><p class="ratio" data-cover="g98-s-anat-body"></p><ul><li>Zones II et III de Sanders-Frykberg : environ 80 % des cas.</li><li>Ligaments rompus, arche effondrée, cuboïde point le plus bas : <button class="w" data-k="g98-bascule">pied à bascule</button>.</li><li>Pression sur la peau : callosités, ulcères sous-cuboïdiens.</li></ul></template>
<template data-pop="pareto-g98-s-bio" data-title="Pareto — Biologie osseuse"><p class="ratio" data-cover="g98-s-bio-body"></p><ul><li>Cytokines, NF-κB, RANKL, TNF-α : ostéoclastes agressifs (<button class="w" data-k="g98-rankl">cascade</button>).</li><li>Ostéopénie transitoire : fractures sous contrainte.</li><li>Polymorphismes OPG/RANKL/RANK : hypothèse, sans test ni conduite.</li></ul></template>
<template data-pop="pareto-g98-s-img" data-title="Pareto — Lecture de l’imagerie"><p class="ratio" data-cover="g98-s-img-body"></p><ul><li>STIR repère liquide et œdème : l’IRM précède la radiographie.</li><li>Œdème, fragmentation, déformation : ordre de la lecture.</li><li>Rémission : diminution de l’œdème médullaire.</li></ul></template>
<template data-pop="pareto-g98-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g98-p-1,g98-p-2,g98-p-3,g98-p-4"></p><ul><li>Aucun médicament spécifique recommandé ; la décharge est le traitement.</li><li><button class="w" data-k="g98-bisphosphonates">Bisphosphonates</button>, calcitonine, parathormone, méthylprednisolone : à ne pas utiliser.</li><li><button class="w" data-k="g98-denosumab">Denosumab</button> : déconseillé.</li><li><button class="w" data-k="g98-vitd">Vitamine D et calcium</button> : évaluation pendant la consolidation, sans posologie dans les sources lues.</li></ul></template>
