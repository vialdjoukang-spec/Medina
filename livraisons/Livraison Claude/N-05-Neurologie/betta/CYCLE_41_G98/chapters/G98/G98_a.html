<template id="ch-G98"><div class="chap"><div class="chap-head"><div class="code">G 98 · Neurologie · Autres affections du système nerveux, non classées ailleurs</div><h1>Autres affections du système nerveux, non classées ailleurs : l’arthropathie de Charcot</h1><span class="status">Cycle Betta 41 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de l’arthropathie de Charcot</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g98-0">Question clinique</a></li><li><a href="#g98-1">Ce que recouvre G98</a></li><li><a href="#g98-2">Définitions</a></li><li><a href="#g98-3">Classifications</a></li><li><a href="#g98-4">Fréquence et pronostic</a></li><li><a href="#g98-5">Physiopathologie</a></li><li><a href="#g98-6">Causes et terrains</a></li><li><a href="#g98-7">Anamnèse et examen</a></li><li><a href="#g98-8">Démarche diagnostique</a></li><li><a href="#g98-9">Urgence et décision immédiate</a></li><li><a href="#g98-10">Décharge : le traitement de base</a></li><li><a href="#g98-11">Médicaments, chirurgie et infection</a></li><li><a href="#g98-12">Suivi, rémission et prévention</a></li><li><a href="#g98-13">Situations particulières</a></li><li><a href="#g98-14">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body">
<section class="ilot" id="g98-0"><h2><span class="n">0</span>Question clinique</h2><p>Dans cette <b>vignette fictive</b>, un homme de 58 ans, diabétique depuis quatorze ans et porteur d’une neuropathie périphérique connue, consulte pour un pied droit gonflé depuis cinq jours. Le pied est rouge, nettement plus chaud que le gauche, et la peau est intacte. Le patient décrit une gêne plutôt qu’une vraie douleur, et il ne se souvient d’aucun traumatisme. Les radiographies en charge sont jugées normales. La thermométrie infrarouge cutanée montre, au point le plus chaud, une différence de 3 °C avec le point symétrique du pied gauche.</p><p>Ce tableau pose trois questions que le cours traite dans l’ordre. Que faut-il évoquer devant un pied inflammatoire, indolore et à peau intacte chez un patient neuropathique ? Que faut-il faire immédiatement, avant même que le diagnostic soit confirmé ? Enfin, comment ce diagnostic se code-t-il, puisque le chapitre G98 de la classification porte le nom de cette leçon alors que ce patient, diabétique, ne s’y code pas ?</p><p>La réponse à la première question est l’<button class="w" data-k="g98-cno">arthropathie neuropathique de Charcot (neuro-ostéoarthropathie, ou CNO)</button> active. La deuxième tient en un geste : une <button class="w" data-k="g98-decharge">décharge</button> non amovible jusqu’au genou, débutée dès la suspicion, pendant que les examens se poursuivent. La troisième est une règle de codage que la première section expose.</p><div class="key"><b>À retenir.</b> Un pied rouge, chaud et tuméfié, à peau intacte, chez un patient neuropathique est une arthropathie de Charcot active jusqu’à preuve du contraire. Des radiographies normales ne l’excluent pas : elles correspondent au <button class="w" data-k="g98-stade0">stade 0</button>, précisément celui qu’il faut savoir reconnaître.</div><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></section>
<section class="ilot" id="g98-1"><h2><span class="n">1</span>Ce que recouvre G98</h2><p>Le code G98 appartient au bloc G90–G99 de la CIM-10-GM 2024, celui des « autres affections du système nerveux ». C’est une <b>catégorie résiduelle</b> : elle n’a aucun sous-code et n’énumère que deux inclusions, l’« arthropathie de Charcot† (M14.6-*) » et l’« affection du système nerveux sans autre précision » (SAI). Elle ne compte aucune exclusion propre. L’inclusion « affection du système nerveux SAI » ne décrit aucune maladie : c’est une règle de codage pour les cas où le diagnostic neurologique reste imprécis, et aucune source clinique ne lui est attachée.</p><p>La seule entité clinique rattachée nommément à G98 est donc l’arthropathie neuropathique de Charcot. Elle illustre le <button class="w" data-k="g98-codage">système de la croix et de l’étoile</button> : une même maladie reçoit deux codes, l’un pour la cause (G98†, la croix, côté neurologique) et l’autre pour la manifestation (M14.6-*, l’étoile, côté articulaire). Le chiffre en cinquième position de M14.6-* précise la localisation articulaire.</p><p>Le code de la cause dépend de l’origine de la neuropathie. Le tableau suivant distingue les trois configurations de la classification ; il montre que le Charcot du patient diabétique de la vignette ne se code pas G98.</p><table class="t"><thead><tr><th>Origine du Charcot</th><th>Code de la cause (†)</th><th>Code de la manifestation (*)</th></tr></thead><tbody><tr><td>Non syphilitique, ou origine non précisée</td><td>G98†</td><td>M14.6-*</td></tr><tr><td>Diabétique</td><td>E10–E14†, quatrième position .6</td><td>M14.6-*</td></tr><tr><td>Syphilitique (tabétique)</td><td>A52.1†</td><td>M14.6-*</td></tr></tbody></table><p>Ce tableau se lit ligne par ligne : la colonne de droite ne change jamais, car la manifestation articulaire est la même ; seule la colonne centrale change avec la cause. Comme le diabète est la cause dominante du Charcot dans les pays industrialisés, G98 sert en pratique aux neuropathies d’autres origines ou d’origine non précisée. La spondylopathie neuropathique, atteinte vertébrale, est exclue de M14 et se code M49.4-*. À titre de comparaison, le bloc voisin G99.-* regroupe les atteintes du système nerveux au cours de maladies classées ailleurs.</p><div class="trap"><span class="k">Piège</span> Coder G98† un Charcot du diabétique. La classification impose E10–E14† avec la quatrième position .6 lorsque la neuropathie est diabétique ; G98† est réservé aux autres origines ou à l’origine non précisée.</div><p>Deux limites s’imposent. Le libellé français officiel de l’Office fédéral de la statistique (OFS) n’a pas été vérifié : le texte s’appuie sur la version allemande du BfArM, que la CIM-10-GM suisse reprend. La correspondance avec la CIM-11 n’est pas établie dans ce dossier.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G90–G99</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-m05-m14.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, M14.6-*</a>.</p></section>
<section class="ilot" id="g98-2"><h2><span class="n">2</span>Définitions</h2><p>Les définitions utilisées en pratique viennent du consensus d’experts de l’IWGDF 2023. La <button class="w" data-k="g98-cno">neuro-ostéoarthropathie de Charcot (CNO)</button> est un processus inflammatoire survenant chez une personne neuropathique et aboutissant à des lésions des os, des articulations et des tissus mous. Le consensus la décrit chez la personne diabétique, mais précise que la maladie peut survenir chez toute personne atteinte de neuropathie périphérique.</p><table class="t"><thead><tr><th>Terme</th><th>Définition</th></tr></thead><tbody><tr><td>CNO active</td><td>Pied rouge, chaud et tuméfié, avec des anomalies osseuses à l’imagerie. La maladie est présumée active tant que persistent des signes inflammatoires.</td></tr><tr><td>Stade 0</td><td>Signes cliniques de CNO active, radiographies normales, anomalies osseuses visibles à l’IRM.</td></tr><tr><td>Rémission (stade inactif)</td><td>Absence de signes inflammatoires, avec ou sans déformation, et consolidation radiographique des fractures.</td></tr><tr><td>Réactivation</td><td>Retour des symptômes du même pied après résolution.</td></tr><tr><td>Décharge (offloading)</td><td>Réduction des contraintes mécaniques en station debout et à la marche.</td></tr></tbody></table><p>Trois nuances évitent des erreurs de raisonnement. Le terme « <button class="w" data-k="g98-remission">rémission</button> » est préféré à « guérison », car le risque de <button class="w" data-k="g98-reactivation">réactivation</button> persiste. L’atteinte du pied controlatéral n’est pas une réactivation : c’est un nouvel épisode. Enfin, la <button class="w" data-k="g98-decharge">décharge</button> ne signifie pas l’appui nul complet : elle réduit les contraintes sans interdire toute mise en charge.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></section>
<section class="ilot" id="g98-3"><h2><span class="n">3</span>Classifications</h2><p>Trois classifications structurent le raisonnement, chacune répondant à une question différente. La première décrit l’évolution dans le temps, la deuxième associe clinique et radiographie, la troisième situe la lésion dans le pied.</p><p>Les <b>quatre stades évolutifs</b> sont l’inflammation, la fragmentation, la coalescence et la consolidation. Le parcours est habituellement unique : le pied traverse ces quatre phases une fois. La classification d’<button class="w" data-k="g98-eichenholtz">Eichenholtz modifiée</button> ajoute un stade 0 aux stades I à IV : le pied est rouge, tuméfié et chaud sans anomalie radiographique. C’est le plus difficile à reconnaître et le plus utile à diagnostiquer, car, non traitée, la maladie expose aux fractures, aux luxations et à la déformation qui suivent.</p><p>La classification de <button class="w" data-k="g98-sanders">Sanders et Frykberg</button> distingue cinq zones anatomiques du pied. La zone II concerne environ 45 % des cas et la zone III environ 35 % : ces deux zones représentent donc environ 80 % des atteintes. La classification de Brodsky est également citée dans la littérature lue.</p><p>Une limite de la documentation : les définitions détaillées des stades I à IV d’Eichenholtz et le contenu anatomique des cinq zones de Sanders et Frykberg n’étaient pas disponibles en texte dans les sources lues. Le cours ne les reconstitue pas de mémoire.</p><p class="src">Références : <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></section>
<section class="ilot" id="g98-4"><h2><span class="n">4</span>Fréquence et pronostic</h2><p>Les chiffres de fréquence sont très hétérogènes, parce que les populations et les méthodes diffèrent. Chez les personnes diabétiques, la prévalence rapportée est de 0,04 % dans des centres anglais, de 0,3 % en Irlande et de 0,53 % dans un registre danois. Une revue suisse du Balgrist (Zurich) cite une fourchette de 0,1 à 7,5 % des diabétiques, jusqu’à 35 % chez ceux qui ont une neuropathie manifeste. L’IWGDF estime à environ 1,6 million le nombre de personnes concernées dans le monde, avec environ 160 000 nouveaux cas par an. Aucune donnée populationnelle suisse n’a été trouvée.</p><p>Le profil typique est celui d’un patient de 50 à 60 ans, après au moins dix ans de diabète, quel que soit le type de diabète. L’atteinte est bilatérale dans 9 à 75 % des cas selon les séries. La cohorte suisse du Balgrist (159 patients) a un âge médian de 60 ans, 30,1 % de femmes et une bilatéralité de 32,1 %.</p><p>Le pronostic dépend de l’évolution des lésions cutanées. La mortalité moyenne poolée à cinq ans est de 29 %. Le risque d’amputation majeure est multiplié par 6 à 12 lorsqu’un ulcère survient sur une déformation de Charcot. Dans la cohorte suisse, traitée de façon conservatrice et suivie en médiane 5,2 ans, la survie sans amputation majeure atteint 92,9 %, la récidive 13,6 %, et 72,3 % des patients ont présenté des ulcères ; 88,1 % marchent en chaussures orthopédiques. Le diabète est associé à la réactivation, à l’amputation majeure et à la récidive d’ulcère ; le tabac, aux ulcères et aux amputations.</p><div class="key"><b>À retenir.</b> La gravité de la CNO ne tient pas à l’épisode inflammatoire lui-même, mais à ce qu’il laisse : une déformation qui expose à l’ulcère, puis à l’infection et à l’amputation. Toute la prise en charge vise à éviter cette séquence.</div><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a> ; <a href="https://doi.org/10.1007/s00402-021-03881-5" target="_blank" rel="noopener">Gratwohl et al., Arch Orthop Trauma Surg 2022 (Balgrist)</a>.</p></section>
<section class="ilot" id="g98-5"><h2><span class="n">5</span>Physiopathologie</h2><p>La CNO naît de la rencontre de trois éléments : une neuropathie, un déclencheur et une réponse inflammatoire disproportionnée. La condition de base est une polyneuropathie, c’est-à-dire une baisse de la sensibilité douloureuse et de la proprioception. Ces deux informations signalent habituellement qu’un tissu est lésé et orientent l’appui ; leur perte explique que le patient continue de marcher sur un pied qui se détériore. Les sources lues ne décrivent pas le fonctionnement normal de ces voies sensitives ; le cours se limite à la conséquence de leur perte.</p><p>Le déclencheur est un traumatisme, perçu ou non, qui provoque une réponse inflammatoire aiguë du pied ou de la cheville. Cette réponse s’accompagne d’une libération disproportionnée de cytokines. Elles activent le facteur <button class="w" data-k="g98-rankl">NF-κB par la voie RANKL</button> et déclenchent l’ostéoclastogenèse : des ostéoclastes très agressifs sont recrutés sous l’effet de RANKL et du TNF-α. Des polymorphismes de l’axe OPG/RANKL/RANK pourraient constituer des facteurs de risque.</p><p>La mécanique achève le processus. L’inflammation et les contraintes de la marche sur un pied insensible affaiblissent ou rompent les ligaments, d’où des luxations et des fractures. L’ostéopénie transitoire de la phase active favorise les fractures et la destruction articulaire, souvent au niveau de l’articulation de Lisfranc, avec effondrement de l’arche longitudinale.</p><p>Le stade terminal est la déformation en <button class="w" data-k="g98-bascule">« pied à bascule »</button> (rocker-bottom). Le cuboïde devient le point le plus bas du pied. Il subit alors des pressions auxquelles la peau n’est pas adaptée : des callosités, des phlyctènes puis des ulcères sous-cuboïdiens apparaissent, avec un risque d’infection et d’ostéomyélite.</p><div class="two"><div class="card"><h4>Avant la lésion</h4><p>Neuropathie : sensibilité douloureuse et proprioception diminuées. Le pied supporte les contraintes de la marche sans signal d’alarme.</p></div><div class="card"><h4>Phase active</h4><p>Traumatisme perçu ou non, cytokines, NF-κB via RANKL, ostéoclastes agressifs, ostéopénie transitoire, fractures et luxations.</p></div><div class="card"><h4>Séquelle</h4><p>Effondrement de l’arche, pied à bascule, cuboïde saillant, callosités, ulcères sous-cuboïdiens, ostéomyélite.</p></div></div><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></section>
<section class="ilot" id="g98-6"><h2><span class="n">6</span>Causes et terrains</h2><p>La cause dominante dans les pays industrialisés est le diabète, par la neuropathie qu’il entraîne. L’alcool et la malnutrition sont cités plus rarement. Historiquement, Charcot a décrit l’atteinte articulaire en 1868 chez des patients atteints de tabès dorsal, forme syphilitique (tabétique) ; ce Charcot tabétique se code A52.1† (voir section 1).</p><p>D’autres causes neurologiques de Charcot existent dans la littérature générale, mais aucune des sources lues ne les documente : le cours ne les cite pas. Le choix du code, lui, suit la règle exposée plus haut : l’origine de la neuropathie détermine la croix.</p><div class="trap"><span class="k">Piège</span> Réduire le Charcot au diabète. Le diabète est la cause la plus fréquente, mais la classification prévoit des Charcot d’origine syphilitique et d’origine non précisée ; et la CNO peut survenir chez toute personne atteinte de neuropathie périphérique (consensus IWGDF).</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-m05-m14.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, M14.6-*</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p><button class="pareto-btn ui" data-k="pareto-g98-clin">▲ Loi de Pareto — Notions et clinique</button></section>
