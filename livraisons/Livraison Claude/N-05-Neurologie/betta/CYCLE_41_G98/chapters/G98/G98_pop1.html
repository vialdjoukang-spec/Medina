<template data-pop="g98-cno" data-title="Neuro-ostéoarthropathie de Charcot (CNO)"><div class="lab">Définition</div><p>La CNO est un processus inflammatoire survenant chez une personne neuropathique, qui aboutit à des lésions des os, des articulations et des tissus mous. Le consensus IWGDF 2023 la définit chez la personne diabétique ; la maladie peut survenir chez toute personne atteinte de neuropathie périphérique.</p><div class="lab">Active ou en rémission</div><p>Elle est dite active tant que le pied est rouge, chaud et tuméfié avec des anomalies osseuses à l’imagerie ; la maladie est présumée active tant que les signes inflammatoires persistent. Le terme historique « arthropathie de Charcot » est le libellé de la classification (G98†, M14.6-*).</p><div class="lab">Limite</div><p>Les définitions sont centrées sur le diabète ; la CNO non diabétique n’est pas couverte par les recommandations lues.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G90–G99</a> ; <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></template>
<template data-pop="g98-decharge" data-title="Décharge (offloading)"><div class="lab">Ce que c’est</div><p>La décharge réduit les contraintes mécaniques en station debout et à la marche. Elle ne signifie pas l’appui nul complet : elle limite les forces sur le pied atteint.</p><div class="lab">Pourquoi elle est le traitement de base</div><p>L’inflammation et les contraintes de la marche sur un pied insensible fragilisent ligaments et os. Supprimer la contrainte arrête l’aggravation mécanique, alors qu’aucune molécule ne l’arrête. Non traitée, la maladie expose aux fractures, luxations, déformation, ulcère, infection et amputation.</p><div class="lab">Modalités</div><p>Le dispositif non amovible jusqu’au genou est recommandé (forte ; faible) : plâtre à contact total en premier choix, botte de marche rendue non amovible en deuxième, dispositif amovible porté en permanence en troisième. Les dispositifs qui s’arrêtent sous la cheville ne conviennent pas. La décharge est poursuivie 4 à 6 semaines après la rémission.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></template>
<template data-pop="g98-stade0" data-title="Stade 0 de la CNO"><div class="lab">Définition</div><p>Signes cliniques de CNO active (pied rouge, chaud, tuméfié), radiographies normales, anomalies osseuses visibles à l’IRM.</p><div class="lab">Pourquoi il compte</div><p>C’est le stade le plus difficile à reconnaître et le plus utile à diagnostiquer. Une radiographie normale rassure à tort : la lésion est d’abord médullaire et liquidienne avant d’être osseuse.</p><div class="lab">Conduite</div><p>Décharge immédiate non amovible, puis IRM pour poser ou exclure le diagnostic ; exclusion de l’infection, de la goutte et de la thrombose veineuse profonde.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></template>
<template data-pop="g98-codage" data-title="Système de la croix et de l’étoile"><div class="lab">Principe</div><p>Certaines maladies nécessitent deux codes. Le code de la cause, marqué d’une croix (†), s’inscrit dans le chapitre de la maladie causale. Le code de la manifestation, marqué d’une étoile (*), s’inscrit dans le chapitre de l’organe atteint. Ici : G98† pour l’affection neurologique, M14.6-* pour l’articulation.</p><div class="lab">Règle pratique</div><p>Non syphilitique ou origine non précisée : G98† + M14.6-*. Diabétique : E10–E14† (quatrième position .6) + M14.6-*. Syphilitique (tabétique) : A52.1† + M14.6-*. La cinquième position de M14.6-* précise la localisation.</p><div class="lab">Précisions</div><p>G98 n’a aucun sous-code. A52.1 inclut l’arthropathie tabétique† et exclut expressément l’arthropathie de Charcot (G98†, M14.6-*). Les libellés français sont ceux de la CIM-10-GM 2024 de l’OFS, concordants avec la version allemande du BfArM.</p><div class="lab">Limite</div><p>La correspondance avec la CIM-11 n’est pas établie.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G90–G99</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-m05-m14.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, M14.6-*</a> ; <a href="https://www.bfs.admin.ch/bfs/fr/home/statistiques/sante/nomenclatures/medkk/instruments-codage-medical.html" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français (G98, G99, M14.6, A52.1)</a>.</p></template>
<template data-pop="g98-remission" data-title="Rémission de la CNO"><div class="lab">Définition</div><p>Absence de signes inflammatoires, avec ou sans déformation, et consolidation radiographique des fractures. Le terme « rémission » est préféré à « guérison » à cause du risque de réactivation.</p><div class="lab">Comment l’établir</div><p>On ne juge pas la rémission sur l’œdème seul : on combine température, œdème clinique et imagerie. Aucun seuil thermique n’est validé ; une étude définissait la guérison clinique par une différence de température inférieure à 1 °C et de circonférence inférieure à 1 cm. La guérison clinique précédait la guérison à l’IRM de 3 à 6 mois chez 23 % des patients.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></template>
<template data-pop="g98-reactivation" data-title="Réactivation"><div class="lab">Définition</div><p>Retour des symptômes du même pied après résolution. L’atteinte du pied controlatéral est un nouvel épisode, non une réactivation.</p><div class="lab">Fréquence et prévention</div><p>Environ 23 % à 27 mois en moyenne dans une étude citée. Chaussures ou orthèses adaptées à la forme du pied (forte ; modérée) ; dispositif sur mesure sous le genou en cas de déformation ou d’instabilité (forte ; modérée). Dans la cohorte suisse du Balgrist, le diabète est associé à la réactivation.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a> ; <a href="https://doi.org/10.1007/s00402-021-03881-5" target="_blank" rel="noopener">Gratwohl et al., Arch Orthop Trauma Surg 2022 (Balgrist)</a>.</p></template>
<template data-pop="g98-eichenholtz" data-title="Classification d’Eichenholtz"><div class="lab">Principe</div><p>Classification historique de 1966, fondée sur des radiographies. Le document suisse retient trois stades : développement (I), coalescence (II), reconstruction ou consolidation (III), auxquels s’ajoute un stade prodromique 0 : radiographie négative, IRM positive (microfractures, œdème médullaire, contusions osseuses).</p><div class="lab">Quatre stades évolutifs et version modifiée</div><p>Inflammation, fragmentation, coalescence, consolidation, avec un parcours habituellement unique. La revue du Balgrist décrit une version modifiée de 0 à IV.</p><div class="lab">Limites</div><p>Elle ignore le stade inflammatoire précoce visible seulement à l’IRM (Swiss Medical Weekly 2014). La définition détaillée du stade IV de la version modifiée n’était pas disponible dans les sources lues ; elle n’est pas reconstituée de mémoire.</p><p class="src">Références : <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED, Pied de Charcot, prise en charge initiale (version 2020)</a> ; <a href="https://doi.org/10.4414/smw.2014.13948" target="_blank" rel="noopener">Chantelau et Grützner, Swiss Med Wkly 2014</a>.</p></template>
<template data-pop="g98-sanders" data-title="Classification de Sanders et Frykberg"><div class="lab">Principe</div><p>Elle découpe le pied en cinq zones : I, métatarso-phalangiennes et interphalangiennes ; II, tarso-métatarsiennes (Lisfranc) ; III, médio-tarsiennes (Chopart) ; IV, cheville et articulation sous-talienne ; V, calcanéum.</p><div class="lab">Fréquence</div><p>La zone II concerne environ 45 % des cas, la zone III environ 35 % : ensemble, environ 80 % des atteintes.</p><div class="lab">Choix de chaussage</div><p>Le document suisse relie le chaussage aux zones : zones I–II à déformation mineure, chaussures orthopédiques de série ou modifiées ; zones II–V à déformation majeure, chaussures sur mesure. La classification de Brodsky est également citée dans la littérature lue.</p><p class="src">Références : <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a> ; <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED, Pied de Charcot, prise en charge initiale (version 2020)</a>.</p></template>
<template data-pop="g98-rankl" data-title="NF-κB, RANKL et ostéoclastes"><div class="lab">Cascade décrite</div><p>Après un traumatisme, une libération disproportionnée de cytokines active le facteur NF-κB par la voie RANKL et déclenche l’ostéoclastogenèse. Des ostéoclastes très agressifs sont recrutés sous l’effet de RANKL et du TNF-α.</p><div class="lab">Conséquence</div><p>L’ostéopénie transitoire de la phase active favorise fractures et destruction articulaire. Des polymorphismes de l’axe OPG/RANKL/RANK sont suspectés d’être des facteurs de risque.</p><div class="lab">Limite</div><p>Les sources lues ne détaillent pas le fonctionnement normal de cette voie ; il n’est pas exposé de mémoire.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></template>
<template data-pop="g98-bascule" data-title="Pied à bascule (rocker-bottom)"><div class="lab">Définition</div><p>Déformation terminale où l’arche longitudinale s’effondre et où le cuboïde devient le point le plus bas du pied.</p><div class="lab">Conséquences</div><p>Pressions plantaires concentrées sur une zone sans protection adaptée : callosités, phlyctènes, ulcères sous-cuboïdiens, puis infection et ostéomyélite. Le risque d’amputation majeure est multiplié par 6 à 12 en cas d’ulcère sur déformation de Charcot.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></template>
<template data-pop="g98-thermometrie" data-title="Thermométrie infrarouge cutanée"><div class="lab">Technique</div><p>Mesure standardisée de la température cutanée au point le plus chaud d’un pied, comparée au même point du pied opposé. Lorsque l’atteinte est bilatérale ou que le membre opposé est amputé, des gradients ascendants de l’orteil vers le genou sont utilisés.</p><div class="lab">Interprétation</div><p>Une différence de 2 °C (4 °F) est utilisée comme seuil d’activité dans plusieurs publications. L’élévation asymétrique est sensible mais non spécifique, et ne suffit pas seule au diagnostic. Aucun seuil de rémission n’est validé.</p><div class="lab">Force des recommandations</div><p>Conditionnelles, de faible certitude, pour le diagnostic et le suivi.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a>.</p></template>
<template data-pop="g98-irm" data-title="Imagerie par résonance magnétique du pied"><div class="lab">Indication</div><p>Radiographies normales et suspicion clinique : l’IRM pose ou exclut le diagnostic et apprécie l’activité (forte ; modérée).</p><div class="lab">Protocole</div><p>Grand champ couvrant tout le pied, séquence sensible aux liquides (STIR), T1 TSE. Le gadolinium est réservé à la suspicion d’infection, à cause du risque rénal chez le diabétique.</p><div class="lab">Signes</div><p>Précoces : œdème médullaire et des parties molles, épanchement, microfractures sous-chondrales. Tardifs : kystes sous-chondraux, destructions, luxations, débris, sclérose. En rémission : diminution de l’œdème, marges corticales mieux définies.</p><p class="src">Références : <a href="https://iwgdfguidelines.org/wp-content/uploads/2023/07/IWGDF-2023-08-Charcot-Guideline.pdf" target="_blank" rel="noopener">IWGDF 2023, recommandation sur le Charcot actif (Wukich et al.)</a> ; <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a>.</p></template>
<template data-pop="g98-osteomyelite" data-title="Ostéomyélite et Charcot"><div class="lab">Difficulté</div><p>Les aspects d’IRM du Charcot actif et de l’ostéomyélite sont proches (œdème, épanchements, rehaussement). Pour l’ostéomyélite, l’IRM a une sensibilité de 77 à 100 %, une spécificité de 80 à 100 % et une valeur prédictive négative d’environ 98 %. La diffusion peut aider ; la médecine nucléaire est plus spécifique, plus coûteuse et irradiante.</p><div class="lab">Pronostic</div><p>Dans une cohorte du Balgrist (43 pieds), l’amputation a concerné 52 % des cas. Une ostéomyélite dans la zone de Charcot s’accompagne d’une amputation plus haute, d’une antibiothérapie plus longue et d’une immobilisation plus longue.</p><p class="src">Références : <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a> ; <a href="https://doi.org/10.1186/s12891-017-1818-4" target="_blank" rel="noopener">Berli et al., BMC Musculoskelet Disord 2017 (Balgrist)</a>.</p></template>
<template data-pop="g98-ilizarov" data-title="Fixateur d’Ilizarov"><div class="lab">Place</div><p>Alternative chirurgicale en cas de complications de la CNO, notamment de déformation sévère ou après résection d’os ostéomyélitique.</p><div class="lab">Donnée récente</div><p>Dans une série du Balgrist, l’application en deux temps est associée à moins de révisions de plaie qu’en un temps : 9 % contre 36 % globalement, 0 % contre 38 % dans le sous-groupe Charcot. Série rétrospective, lue au niveau du résumé ; le détail chirurgical dépasse le cadre de l’examen fédéral.</p><p class="src">Références : <a href="https://doi.org/10.1186/s13244-019-0768-9" target="_blank" rel="noopener">Rosskopf et al., Insights Imaging 2019 (Balgrist)</a> ; <a href="https://doi.org/10.1177/10711007261440490" target="_blank" rel="noopener">Fischer et al., Foot Ankle Int 2026 (Balgrist)</a>.</p></template>
<template data-pop="g98-chantelau" data-title="Classification de Chantelau"><div class="lab">Principe</div><p>Elle croise l’activité (actif A, inactif B) et la déformation (sans 0, avec 1). A0 est le « stade 0 » : meilleure chance de guérison sans déformation. B0 est le résultat souhaitable. A1 correspond à Eichenholtz I ou II. B1 est le stade final stable, à risque d’ulcère (Eichenholtz III).</p><div class="lab">Variante fondée sur l’IRM</div><p>Une classification proposée dans la Swiss Medical Weekly 2014 distingue le grade 0 (absence de fracture corticale) du grade 1 (présence), chacun actif ou inactif.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED, Pied de Charcot, prise en charge initiale (version 2020)</a> ; <a href="https://doi.org/10.4414/smw.2014.13948" target="_blank" rel="noopener">Chantelau et Grützner, Swiss Med Wkly 2014</a>.</p></template>
<template data-pop="g98-qualiccare" data-title="Document suisse QualiCCare / SSED"><div class="lab">Nature</div><p>Fiche « Pied de Charcot — neuro-ostéoarthropathie : problématiques et actions clés dans la prise en charge initiale », version 2020 (fichier daté du 21 juillet 2021), du sous-groupe pied neuro-ostéoarthropathique de QualiCCare, publiée par la Société suisse d’endocrinologie et de diabétologie (SSED) avec plusieurs organisations professionnelles suisses.</p><div class="lab">Messages principaux</div><p>Pied érythémateux, plus chaud, tuméfié, peu douloureux, chez un neuropathe : pied de Charcot aigu jusqu’à preuve du contraire, urgence médicale, orientation vers le niveau 2 ou 3. Décharge complète et rapide dès les stades 0 et 1, botte plâtrée inamovible, durée de 3 à 6 mois et jusqu’à 18 mois, prophylaxie antithrombotique, chaussage adapté ensuite.</p><div class="lab">Limites</div><p>Le contenu exact des niveaux 1, 2 et 3 n’est pas défini dans le document lu. Il s’agit d’un document de pratique, non d’une étude.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED, Pied de Charcot, prise en charge initiale (version 2020)</a>.</p></template>
<template data-pop="g98-chronique" data-title="Pied de Charcot chronique"><div class="lab">Reconnaissance</div><p>Le diagnostic est évident sur la déformation : pied « à bascule » ou en tampon buvard, déformations multiplanaires de la cheville et du tarse, raccourcissement du membre. La différence de température est inférieure à 2 °C et il n’y a pas d’œdème (stade III).</p><div class="lab">Suivi</div><p>Dépistage des ulcères, bilan vasculaire, inspection des chaussures ; la biologie n’a de rôle qu’en cas d’infection d’ulcère. Contrôles au moins tous les trois mois au niveau 1 et au moins une fois par an au niveau 3.</p><p class="src">Références : <a href="https://www.sgedssed.ch/SgedSsed/fileadmin/6_Diabetologie/65_Fussversorgung/210721_QCARE_Charcot_Fuss_A5_FR.pdf" target="_blank" rel="noopener">QualiCCare / SSED, Pied de Charcot, prise en charge initiale (version 2020)</a>.</p></template>
