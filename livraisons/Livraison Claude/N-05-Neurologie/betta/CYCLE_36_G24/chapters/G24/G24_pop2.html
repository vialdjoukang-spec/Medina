<template data-pop="g24-crise" data-title="Crise dystonique (état de mal dystonique)">
<div class="lab">Définition</div><p data-evidence="G24-C0457">Aggravation brutale d’une dystonie généralisée sévère qui immobilise, gêne la respiration, provoque une rhabdomyolyse et menace le pronostic vital.</p>
<div class="lab">Déclencheurs</div><p data-evidence="G24-C0458">Arrêt brusque du traitement, maladie intercurrente sévère comme une pneumonie, panne ou épuisement de la batterie d’un stimulateur.</p>
<div class="lab">Conduite</div><p data-evidence="G24-C0459">Soins intensifs, parfois relaxation et ventilation ; empiriquement benzodiazépines et baclofène, y compris intrathécal ; stimulation pallidale rapportée dans des cas sévères.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-ldopa" data-title="Essai de lévodopa">
<div class="lab">Principe</div><p data-evidence="G24-C0460">Toute dystonie débutant dans l’enfance ou l’adolescence justifie un essai : titration jusqu’à 3 × 200 mg par jour (enfant : 10 mg/kg/jour en trois prises) pendant 8 semaines, ailleurs au moins 6 semaines.</p>
<div class="lab">Interprétation</div><p data-evidence="G24-C0461">Les patients de Segawa répondent à moins de 3 × 100 mg par jour. L’essai est aussi justifié chez l’adulte si l’on suspecte un syndrome parkinsonien et dystonique.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0462">Les informations suisses de Madopar® et Sinemet® n’ont pas été lues ; les doses viennent de la ligne directrice allemande.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-anticorps" data-title="Anticorps neutralisants et intervalle">
<div class="lab">Mécanisme</div><p data-evidence="G24-C0463">Des réinjections rapprochées (« booster ») exposent à des anticorps neutralisants et à l’échec secondaire. Le type B en donne davantage.</p>
<div class="lab">Application</div><p data-evidence="G24-C0464">Dose efficace minimale et intervalles les plus longs. Sans effet à un mois, on réévalue (anticorps, guidage).</p>
<div class="lab">Limite</div><p data-evidence="G24-C0465">Il n’existe pas de consensus pour mesurer la durée de l’effet ; on vise des intervalles flexibles centrés sur le patient.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Xeomin®, mise à jour mars 2026</a> ; <a href="https://doi.org/10.1016/j.parkreldis.2024.107011" target="_blank" rel="noopener">Durée d’efficacité de la toxine botulique dans les essais de dystonie cervicale, revue 2024</a>.</p></template>
<template data-pop="g24-botox" data-title="Information suisse BOTOX®">
<div class="lab">Indications</div><p data-evidence="G24-C0466">Blépharospasme, hémispasme facial et dystonies focales associées (plus de 12 ans) ; dystonie cervicale de l’adulte. Mise à jour : mai 2025.</p>
<div class="lab">Doses</div><p data-evidence="G24-C0467">Blépharospasme : 1,25 à 2,5 U par site, au plus 25 U par œil au début, au plus 100 U par 12 semaines. Dystonie cervicale : au plus 200 U à la première séance, 300 U par séance, 50 U par site, 100 U dans le sterno-cléido-mastoïdien, intervalle d’au moins 10 semaines.</p>
<div class="lab">Limites</div><p data-evidence="G24-C0468">Pas d’injection bilatérale du sterno-cléido-mastoïdien (dysphagie). Dans la dystonie cervicale, amélioration en 2 semaines, maximum vers la 6e, durée moyenne d’environ 12 semaines (2 à 33).</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse BOTOX®, mise à jour mai 2025</a>.</p></template>
<template data-pop="g24-xeomin" data-title="Information suisse Xeomin®">
<div class="lab">Indications</div><p data-evidence="G24-C0469">Blépharospasme et dystonie cervicale à prédominance rotatoire de l’adulte. Mise à jour : mars 2026.</p>
<div class="lab">Doses</div><p data-evidence="G24-C0470">Blépharospasme : au plus 25 U par œil au début, 100 U au total, intervalle d’au moins 8 semaines. Dystonie cervicale : en général au plus 200 U, maximum 300 U, 50 U par point, pas de sterno-cléido-mastoïdien bilatéral.</p>
<div class="lab">Sécurité</div><p data-evidence="G24-C0471">Contre-indications : myasthénie, syndrome de Lambert-Eaton, infection au point d’injection. Une diffusion à distance est possible. Les aminosides potentialisent l’effet.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Xeomin®, mise à jour mars 2026</a>.</p></template>
<template data-pop="g24-dysport" data-title="Information suisse Dysport®">
<div class="lab">Indications et doses</div><p data-evidence="G24-C0472">Blépharospasme : 40 U par œil au début, maximum 120 U par œil, intervalle d’au moins 12 semaines. Torticolis spasmodique : 500 U au début par voie intramusculaire, répétés environ toutes les 16 semaines, pas avant 12 semaines. Mise à jour : mai 2026.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0473">Les unités ne sont ni équivalentes ni interchangeables avec celles des autres toxines.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Dysport®, mise à jour mai 2026</a>.</p></template>
<template data-pop="g24-guidage" data-title="Guidage de l’injection">
<div class="lab">Méthodes</div><p data-evidence="G24-C0474">L’électromyographie peut guider l’injection quand la palpation est difficile. L’échographie et l’EMG améliorent la précision (revue systématique de sept études). Le concept Col-Cap aide à choisir les muscles.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0475">Les effectifs sont faibles et la source n’est lue qu’en résumé.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.3390/toxins18090378" target="_blank" rel="noopener">Dystonia 3×3, guide de formation à la toxine botulique dans la dystonie cervicale, 2026</a> ; <a href="https://doi.org/10.3390/life15060920" target="_blank" rel="noopener">Comparaison des méthodes d’injection de toxine botulique A dans la dystonie cervicale, revue systématique 2025</a>.</p></template>
<template data-pop="g24-anticho" data-title="Anticholinergiques dans la dystonie">
<div class="lab">Disponibilité</div><p data-evidence="G24-C0476">Le trihexyphénidyle n’est pas commercialisé en Suisse ; seul le bipéridène l’est.</p>
<div class="lab">Efficacité</div><p data-evidence="G24-C0477">Efficaces dans la dystonie généralisée (essai randomisé) et la dystonie cervicale, inférieurs à la toxine pour cette dernière. À envisager surtout chez le jeune avec dystonie généralisée primaire sévère ; non indiqués dans la paralysie cérébrale.</p>
<div class="lab">Sécurité</div><p data-evidence="G24-C0478">Troubles cognitifs (surtout chez le sujet âgé), rétention urinaire, hausse des transaminases ; ne jamais arrêter brusquement. Contre-indications de l’information suisse d’Akineton® : glaucome à angle fermé, sténoses digestives mécaniques, mégacôlon, iléus.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Akineton®, mise à jour mai 2022</a>.</p></template>
<template data-pop="g24-tbz" data-title="Tétrabénazine">
<div class="lab">Dans la dystonie</div><p data-evidence="G24-C0479">Un essai est possible après échec de la toxine dans une forme focale, ainsi que dans la dystonie généralisée et tardive.</p>
<div class="lab">Information suisse</div><p data-evidence="G24-C0480">Xenazine® n’est autorisée en Suisse que pour la chorée de Huntington ; l’usage dans la dystonie est hors indication. Contre-indications : dépression, insuffisance hépatique modérée ou sévère, syndrome parkinsonien, inhibiteurs de la monoamine oxydase, réserpine. Risques : dépression, allongement du QT, syndrome malin. Mise à jour : février 2025.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Xenazine®, mise à jour février 2025</a>.</p></template>
<template data-pop="g24-baclofene" data-title="Baclofène et benzodiazépines">
<div class="lab">Baclofène</div><p data-evidence="G24-C0481">Réponse d’environ 30 % dans les formes segmentaires ou généralisées. Par voie intrathécale, il est surtout employé dans la paralysie cérébrale et lors d’une crise dystonique.</p>
<div class="lab">Autres</div><p data-evidence="G24-C0482">Les benzodiazépines sont à éviter au long cours. Le valproate et le lévétiracétam sont inefficaces. Les agonistes dopaminergiques et l’amantadine ne sont pas recommandés dans les formes focales.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0483">Les informations suisses du baclofène oral, de Rivotril® et de Lioresal® n’ont pas été lues.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a>.</p></template>
<template data-pop="g24-physio" data-title="Physiothérapie et mesures associées">
<div class="lab">Données</div><p data-evidence="G24-C0484">Associée à la toxine, la physiothérapie réduit la douleur de la dystonie cervicale (méta-analyse de deux études poolées).</p>
<div class="lab">Mesures</div><p data-evidence="G24-C0485">Lunettes à étai de ptose ou enveloppantes (blépharospasme), attelles dentaires (oromandibulaire), kinésio-taping, orthèses d’écriture, fauteuil roulant électrique précoce.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://doi.org/10.1186/s12883-023-03473-3" target="_blank" rel="noopener">Efficacité de la physiothérapie dans la dystonie cervicale isolée, revue mise à jour 2024</a>.</p></template>
<template data-pop="g24-duree" data-title="Durée d’effet de la toxine">
<div class="lab">Données</div><p data-evidence="G24-C0486">La durée moyenne est de 10 à 12 semaines dans la dystonie cervicale, d’environ 12 semaines dans le blépharospasme et de 12 à 16 semaines dans la dysphonie adductrice.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0487">La revue de 2024 conclut à l’absence de consensus pour mesurer la durée ; l’intervalle doit rester flexible et centré sur le patient.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-039l_S1_Dystonie_2021-05-abgelaufen.pdf" target="_blank" rel="noopener">Société allemande de neurologie, ligne directrice S1 Dystonie, 2021 (AWMF 030-039)</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse BOTOX®, mise à jour mai 2025</a> ; <a href="https://doi.org/10.1016/j.parkreldis.2024.107011" target="_blank" rel="noopener">Durée d’efficacité de la toxine botulique dans les essais de dystonie cervicale, revue 2024</a>.</p></template>
<template data-pop="g24-nonmoteur" data-title="Symptômes non moteurs">
<div class="lab">Données</div><p data-evidence="G24-C0488">Dans la dystonie cervicale, une méta-analyse de 2026 rapporte une dépression chez 35,2 % des patients, une anxiété chez 34,0 %, des troubles du sommeil chez 57,1 % et une fatigue chez 60,6 %.</p>
<div class="lab">Limite</div><p data-evidence="G24-C0489">Hétérogénéité élevée, résumé seul, auteurs non européens.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.prdoa.2026.100489" target="_blank" rel="noopener">Symptômes non moteurs de la dystonie cervicale, revue systématique 2026</a>.</p></template>
<template data-pop="g24-haldol" data-title="Information suisse Haldol®">
<div class="lab">Données</div><p data-evidence="G24-C0490">Les troubles extrapyramidaux touchent 34 % des patients dans les études, avec dystonie et crise oculogyre fréquentes. La dyskinésie tardive peut survenir sous traitement prolongé ou à l’arrêt et être masquée par la reprise, l’augmentation ou le changement d’antipsychotique. Mise à jour : novembre 2024.</p>
<div class="lab">Grossesse</div><p data-evidence="G24-C0491">Des symptômes extrapyramidaux sont possibles chez le nouveau-né après exposition au troisième trimestre.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Haldol®, mise à jour novembre 2024</a>.</p></template>
<template data-pop="g24-paspertin" data-title="Information suisse Paspertin®">
<div class="lab">Données</div><p data-evidence="G24-C0492">La dystonie aiguë, y compris la crise oculogyre, est fréquente, surtout chez l’enfant et l’adulte jeune, même après une dose unique. Le produit est contre-indiqué avant un an. Sa durée est limitée à 5 jours à cause du risque de dyskinésie tardive. Mise à jour : janvier 2020.</p>
<div class="lab">Conduite</div><p data-evidence="G24-C0493">Arrêter le métoclopramide ; traitement symptomatique si nécessaire : benzodiazépines chez l’enfant, anticholinergiques chez l’adulte.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Paspertin®, mise à jour janvier 2020</a>.</p></template>
<template data-pop="pareto-g24-concept" data-title="Pareto — Notions fondamentales">
<p class="ratio" data-cover="g24-1,g24-2,g24-3,g24-4"></p><ul><li data-evidence="G24-C0494">La dystonie est un trouble du mouvement à motif répétitif, aggravé par l’action et atténué par un geste antagoniste.</li><li data-evidence="G24-C0495">Deux axes la classent : l’axe I décrit, l’axe II explique ; la distribution et l’âge de début orientent le plus vite.</li><li data-evidence="G24-C0496">Prévalence européenne 152 par million, sous-estimée ; formes focales de l’adulte les plus fréquentes.</li><li data-evidence="G24-C0497">Réseau noyaux gris centraux, cervelet, cortex ; deux mécanismes à connaître : tétrahydrobioptérine et toxine.</li></ul>
</template>
<template data-pop="pareto-g24-formes" data-title="Pareto — Formes cliniques, anamnèse et examen">
<p class="ratio" data-cover="g24-5,g24-6"></p><ul><li data-evidence="G24-C0498">Dystonie cervicale, blépharospasme, oromandibulaire, laryngée, crampes de tâche : formes focales de l’adulte.</li><li data-evidence="G24-C0499">TOR1A, SGCE et forme de Segawa : formes génétiques à reconnaître.</li><li data-evidence="G24-C0500">Anamnèse médicamenteuse, âge de début, cas familiaux, tremblement associé.</li><li data-evidence="G24-C0501">Quatre drapeaux rouges : parésie, signes pyramidaux, ataxie, déclin cognitif.</li></ul>
</template>
<template data-pop="pareto-g24-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g24-7"></p><ul><li data-evidence="G24-C0502">Le diagnostic est clinique et repose sur le motif répétitif.</li><li data-evidence="G24-C0503">Dystonie fonctionnelle, myoclonie, tremblement et contracture se séparent par un élément discriminant.</li><li data-evidence="G24-C0504">Le torticolis sans précision (M43.6) et la paralysie cérébrale athétosique (G80.3) sont exclus du code G24.</li></ul>
</template>
<template data-pop="pareto-g24-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g24-8"></p><ul><li data-evidence="G24-C0505">Crise dystonique : soins intensifs, benzodiazépines et baclofène, vérifier la batterie du stimulateur.</li><li data-evidence="G24-C0506">Dystonie aiguë médicamenteuse : arrêter le métoclopramide ; bipéridène 2,5 à 5 mg chez l’adulte, répétable après 30 minutes.</li><li data-evidence="G24-C0507">Ne jamais arrêter brusquement un anticholinergique.</li></ul>
</template>
<template data-pop="pareto-g24-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g24-9"></p><ul><li data-evidence="G24-C0508">Essai de lévodopa pour tout début avant l’âge adulte ; seule forme à traitement causal.</li><li data-evidence="G24-C0509">Toxine botulique en première intention des formes focales ; unités non interchangeables.</li><li data-evidence="G24-C0510">Stimulation du pallidum interne pour les formes généralisées sévères : gain d’environ 50 %.</li><li data-evidence="G24-C0511">Trihexyphénidyle non commercialisé en Suisse ; tétrabénazine hors indication.</li></ul>
</template>
<template data-pop="pareto-g24-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g24-10,g24-11"></p><ul><li data-evidence="G24-C0512">Intervalle individualisé de la toxine, jamais sous le minimum de la notice.</li><li data-evidence="G24-C0513">Sans effet à un mois : rechercher des anticorps et un défaut de ciblage.</li><li data-evidence="G24-C0514">Enfant : lévodopa d’emblée ; sujet âgé : prudence cognitive ; contre-indications de la toxine à vérifier.</li></ul>
</template>
<template data-pop="pareto-g24-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g24-e-1,g24-e-2,g24-e-3,g24-e-4,g24-e-5"></p><ul><li data-evidence="G24-C0515">Le bilan se choisit selon l’âge de début et le caractère isolé ou combiné.</li><li data-evidence="G24-C0516">Avant 50 ans : lampe à fente, céruléoplasmine et cuivre pour la maladie de Wilson.</li><li data-evidence="G24-C0517">Génétique ciblée : TOR1A avant 26 ans ; aucune génétique pour une forme focale isolée de l’adulte sans antécédent familial.</li><li data-evidence="G24-C0518">EMG pour guider l’injection et distinguer dystonie saccadée et myoclonie.</li></ul>
</template>
<template data-pop="pareto-g24-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g24-s-anat-cours"></p><ul><li data-evidence="G24-C0519">Sept régions du corps ; huit motifs Col-Cap.</li><li data-evidence="G24-C0520">Six muscles clés du cou ; sterno-cléido-mastoïdien limité à 100 U de BOTOX®.</li><li data-evidence="G24-C0521">Le pallidum interne est la cible de la stimulation cérébrale profonde.</li></ul>
</template>
<template data-pop="pareto-g24-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g24-s-histo-cours"></p><ul><li data-evidence="G24-C0522">Aucune lésion dans la dystonie idiopathique ; neuropathologie non lue.</li><li data-evidence="G24-C0523">La toxine bloque l’acétylcholine ; la jonction se rétablit par bourgeonnement collatéral.</li><li data-evidence="G24-C0524">Lampe à fente et frottis cherchent des signes cellulaires de maladies générales.</li></ul>
</template>
<template data-pop="pareto-g24-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g24-s-physio-cours"></p><ul><li data-evidence="G24-C0525">Perte d’inhibition et plasticité altérée dans un réseau moteur.</li><li data-evidence="G24-C0526">Latence, pic et durée de la toxine : environ 1 semaine, 4 semaines, 10 à 12 semaines.</li><li data-evidence="G24-C0527">Mécanisme du geste antagoniste non établi dans les sources lues.</li></ul>
</template>
<template data-pop="pareto-g24-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g24-s-bioch-cours"></p><ul><li data-evidence="G24-C0528">La tétrahydrobioptérine, cofacteur de la synthèse de dopamine, explique la forme dopa-sensible.</li><li data-evidence="G24-C0529">SV2 puis clivage de SNAP-25 : blocage de l’acétylcholine.</li><li data-evidence="G24-C0530">Amines biogènes, glucose et lactate du liquide cérébrospinal ; céruléoplasmine et cuivre.</li></ul>
</template>
<template data-pop="pareto-g24-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g24-p-1,g24-p-2,g24-p-3,g24-p-4"></p><ul><li data-evidence="G24-C0531">Lévodopa pour le déficit dopaminergique, toxine pour la dystonie focale, bipéridène pour l’aigu.</li><li data-evidence="G24-C0532">BOTOX® : 300 U par séance au plus, 100 U dans le sterno-cléido-mastoïdien, jamais bilatéral.</li><li data-evidence="G24-C0533">Tétrabénazine autorisée en Suisse seulement pour la chorée de Huntington.</li><li data-evidence="G24-C0534">Antipsychotiques et métoclopramide : première cause médicamenteuse.</li></ul>
</template>
