<p data-evidence="G24-C0001">Dans cette <b>vignette fictive</b>, une femme de 42 ans consulte parce que sa tête tourne vers la droite depuis deux ans. Le menton se déplace malgré elle, l’épaule droite se soulève et la nuque devient douloureuse en fin de journée. Elle a découvert qu’un doigt posé sur le menton redresse la tête. Elle ne prend aucun médicament et ne présente aucune faiblesse. Ces données pédagogiques servent à poser les quatre questions d’un cours sur la <button class="w" data-k="g24-def">dystonie</button>.</p>
<p data-evidence="G24-C0002">La première question est de <b>reconnaître</b> la dystonie : un mouvement ou une posture à motif répétitif, aggravé par l’action volontaire, atténué par un <button class="w" data-k="g24-geste">geste antagoniste</button>. La deuxième est de la <b>classer</b> sur <button class="w" data-k="g24-axes">deux axes</button>, l’un clinique, l’autre étiologique. La troisième est de <b>ne pas manquer une cause traitable</b> : une <button class="w" data-k="g24-medic">cause médicamenteuse</button>, une <button class="w" data-k="g24-gch1">dystonie dopa-sensible</button> ou une <button class="w" data-k="g24-wilson">maladie de Wilson</button>. La quatrième est de <b>choisir le traitement selon la distribution</b> : toxine botulique pour une forme focale, <button class="w" data-k="g24-scp">stimulation cérébrale profonde</button> pour une forme généralisée sévère.</p>
<p data-evidence="G24-C0003">Chez cette patiente, une seule région est atteinte, le cou : la dystonie est <b>focale</b>. Le début à l’âge adulte, sans signe associé, évoque une forme idiopathique. Comme elle a moins de 50 ans, la ligne directrice allemande de 2021 recommande néanmoins de chercher une maladie de Wilson avec des examens ciblés, car cette cause ne doit pas rester méconnue (voir la partie Examens).</p>
<div class="key" data-evidence="G24-C0004"><b>À retenir.</b> Reconnaître, classer, écarter une cause traitable, puis traiter selon la distribution : ces quatre temps structurent tout le cours. Le diagnostic de dystonie est d’abord clinique ; les examens servent à chercher la cause, non à confirmer le mouvement.</div>
</section>
<section class="ilot" id="g24-1"><h2><span class="n">1</span>Définition et terminologie</h2>
<p data-evidence="G24-C0005">La révision 2025 du consensus international définit la <button class="w" data-k="g24-def">dystonie</button> comme un trouble du mouvement caractérisé par des mouvements anormaux, des postures anormales, ou les deux, soutenus ou intermittents. Ces mouvements et ces postures ont typiquement un <b>motif</b> : ils se répètent de façon reconnaissable d’un épisode à l’autre. Ils peuvent être <b>trémulants</b> ou <b>saccadés</b>. Ils sont souvent déclenchés ou aggravés par l’action volontaire et fréquemment associés à des mouvements de <b>débordement</b>, c’est-à-dire l’extension à des segments voisins qui n’ont rien à voir avec le geste voulu.</p>
<p data-evidence="G24-C0006">Cette définition modifie celle de 2013 sur deux points. La mention de « contractions musculaires » a disparu, car elle pouvait faire confondre la dystonie avec une atteinte neuromusculaire. Le caractère saccadé a été ajouté. Le caractère tordant reste fréquent, mais il manque dans le blépharospasme et dans la dystonie laryngée, qui sont faits de spasmes brefs. Une posture dystonique résulte de contractions involontaires et non d’une pathologie des tissus mous : c’est ce qui la distingue d’une contracture.</p>
<p data-evidence="G24-C0007">Le mot « dystonie » recouvre en pratique trois emplois. Il désigne une <b>entité</b> (dystonie isolée ou combinée), un <b>syndrome</b> au sein d’une autre maladie, ou un simple <b>symptôme</b>, comme la dystonie « off » de la maladie de Parkinson. Le médecin précise donc toujours de quel emploi il parle avant de classer ou de traiter.</p>
<p data-evidence="G24-C0008">Le tableau suivant reprend le vocabulaire du consensus 2025. Il sert à décrire sans ambiguïté ce que l’on voit ; chaque ligne protège contre une confusion fréquente entre dystonie, tremblement, myoclonie et dystonie fonctionnelle.</p>
<table class="t"><thead><tr><th>Terme</th><th>Définition ou recommandation</th></tr></thead><tbody><tr><td data-evidence="G24-C0009">Geste antagoniste</td><td data-evidence="G24-C0010">Manœuvre volontaire qui améliore temporairement la posture dystonique</td></tr><tr><td data-evidence="G24-C0011">Imitateurs (dystonia mimics)</td><td data-evidence="G24-C0012">Terme préféré à « pseudodystonie » ; la dystonie fonctionnelle en fait partie</td></tr><tr><td data-evidence="G24-C0013">« Muscles dystoniques »</td><td data-evidence="G24-C0014">Usage déconseillé, car il suggère une physiopathologie neuromusculaire</td></tr><tr><td data-evidence="G24-C0015">« Tremblement dystonique »</td><td data-evidence="G24-C0016">Usage déconseillé, les emplois étant incohérents ; décrire séparément le tremblement et la dystonie</td></tr><tr><td data-evidence="G24-C0017">Posture soutenue</td><td data-evidence="G24-C0018">Maintenue au repos longtemps, mais mobilisable passivement</td></tr><tr><td data-evidence="G24-C0019">Dystonie fixée</td><td data-evidence="G24-C0020">Posture persistante, non modifiable de façon significative par la mobilisation passive</td></tr><tr><td data-evidence="G24-C0021">Dystonie saccadée (jerky)</td><td data-evidence="G24-C0022">Mouvements ressemblant à des myoclonies ; l’électrophysiologie est parfois nécessaire</td></tr><tr><td data-evidence="G24-C0023">Dystonie en miroir</td><td data-evidence="G24-C0024">Posture du membre atteint au repos, déclenchée par l’action du membre controlatéral sain, souvent lors de la tâche affectée comme l’écriture</td></tr><tr><td data-evidence="G24-C0025">Débordement (overflow)</td><td data-evidence="G24-C0026">Extension à des segments contigus, sans rapport avec le mouvement voulu</td></tr></tbody></table>
<p data-evidence="G24-C0027">La distinction entre posture soutenue et dystonie fixée a une conséquence pratique. Une posture soutenue cède à la mobilisation passive : le raisonnement reste neurologique. Une posture fixée ne cède pas : devant un début aigu ou subaigu chez l’adulte, elle est souvent, mais pas toujours, fonctionnelle. Les <button class="w" data-k="g24-terminologie">termes du consensus</button> détaillent ces nuances.</p>
<div class="key" data-evidence="G24-C0028"><b>À retenir.</b> La dystonie se reconnaît à un motif répétitif de mouvements ou de postures, aggravé par l’action et atténué par un geste antagoniste. Les spasmes brefs du blépharospasme et de la dystonie laryngée en font aussi partie, sans torsion.</div>
</section>
<section class="ilot" id="g24-2"><h2><span class="n">2</span>Classification sur deux axes</h2>
<p data-evidence="G24-C0029">La classification de 2025 repose sur <b>deux axes</b> qui répondent à deux questions distinctes. L’axe I décrit ce que l’on observe ; l’axe II cherche pourquoi cela survient. Séparer les deux évite de donner une étiologie à un simple tableau clinique et inversement. La ligne directrice allemande de 2021 reprend ce principe.</p>
<figure data-evidence="G24-C0030"><svg viewBox="0 0 380 188" role="img" aria-label="Figure 1 — Classement sur deux axes" font-size="14"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="356" height="44" rx="5"/><path d="M190 56v14m-4-5l4 5 4-5"/><rect x="12" y="70" width="356" height="44" rx="5"/><path d="M190 114v14m-4-5l4 5 4-5"/><rect x="12" y="128" width="356" height="44" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="39">Axe I : caractéristiques cliniques</text><text x="190" y="97">Axe II : étiologie et pathogenèse</text><text x="190" y="155">Étiquette diagnostique complète</text></g></svg><figcaption>Figure 1 — Classement sur deux axes. Schéma didactique : la description clinique et la recherche de cause se font séparément avant de poser l’étiquette.</figcaption></figure>
<h3>2.1 Axe I : caractéristiques cliniques</h3>
<p data-evidence="G24-C0031">Le tableau ci-dessous liste les six rubriques de l’axe I. Chacune fournit un indice sur la cause probable ou sur le traitement, comme la suite le montre.</p>
<table class="t"><thead><tr><th>Rubrique</th><th>Catégories</th></tr></thead><tbody><tr><td data-evidence="G24-C0032">Âge de début</td><td data-evidence="G24-C0033">Nourrisson (2 ans ou moins) ; enfance (plus de 2 à 12 ans) ; adolescence (plus de 12 à 20 ans) ; adulte jeune (plus de 20 à 40 ans) ; adulte tardif (plus de 40 ans)</td></tr><tr><td data-evidence="G24-C0034">Antécédents familiaux</td><td data-evidence="G24-C0035">Sporadique ; familial ; inconnu</td></tr><tr><td data-evidence="G24-C0036">Distribution</td><td data-evidence="G24-C0037">Focale ; segmentaire ; multifocale ; hémidystonie ; généralisée</td></tr><tr><td data-evidence="G24-C0038">Dimensions temporelles</td><td data-evidence="G24-C0039">Début (aigu, subaigu, progressif) ; évolution (statique, progressive, fluctuante) ; variabilité (paroxystique, diurne, aucune)</td></tr><tr><td data-evidence="G24-C0040">Phénoménologie</td><td data-evidence="G24-C0041">Spécifique d’une tâche ; induite par l’action ; présente aussi au repos ; fixée ; avec geste antagoniste, aspect trémulant ou saccadé</td></tr><tr><td data-evidence="G24-C0042">Isolée ou combinée</td><td data-evidence="G24-C0043">Isolée ; combinée à un autre trouble du mouvement, à d’autres signes neurologiques ou à des signes systémiques</td></tr></tbody></table>
<p data-evidence="G24-C0044">Le corps est divisé en <b>sept régions</b> : face supérieure, face inférieure (mâchoire, bouche, langue), cou (épaules comprises), larynx, membres supérieurs, tronc et membres inférieurs. La <button class="w" data-k="g24-distribution">distribution</button> se définit ainsi : focale pour une région ; segmentaire pour deux ou trois régions contiguës ; multifocale pour deux ou trois régions non contiguës (l’atteinte des deux bras ou des deux jambes est multifocale) ; hémidystonie pour le membre supérieur et le membre inférieur du même côté ; généralisée au-delà. Par convention, la dystonie cervicale reste focale même lorsque les épaules sont touchées.</p>
<p data-evidence="G24-C0045">La distribution a une <b>valeur d’orientation</b>. Une forme focale est souvent idiopathique et relève de la toxine botulique. Une forme généralisée est plutôt génétique et peut relever de la stimulation cérébrale profonde. Une hémidystonie évoque souvent une lésion focale controlatérale. Un début chez le nourrisson fait suspecter une maladie métabolique héréditaire, alors qu’un début adulte est le plus souvent idiopathique.</p>
<p data-evidence="G24-C0046">Les dimensions temporelles orientent de la même manière. Un début aigu, en minutes ou en heures, évoque souvent une dystonie fonctionnelle, parfois une cause médicamenteuse, un syndrome de dystonie-parkinsonisme à début rapide ou une maladie métabolique. Un début subaigu, en jours ou en semaines, fait penser à un processus auto-immun. Un début progressif, en mois ou en années, est celui des dystonies focales de l’adulte. Une évolution statique évoque une paralysie cérébrale dystonique, une évolution progressive une dégénérescence, et des variations diurnes une dystonie dopa-sensible.</p>
<p data-evidence="G24-C0047">Le caractère <b>isolé</b> ou <b>combiné</b> sépare la dystonie seule de celle qui s’accompagne d’un autre trouble du mouvement, d’autres signes neurologiques ou de signes systémiques. Les symptômes non moteurs comme la douleur, les troubles psychiatriques ou les troubles du sommeil sont des comorbidités : ils ne font pas classer la dystonie comme combinée.</p>
<h3>2.2 Axe II : étiologie et pathogenèse</h3>
<p data-evidence="G24-C0048">L’axe II décrit la cause et le mécanisme. Le tableau suivant en donne les quatre rubriques.</p>
<table class="t"><thead><tr><th>Rubrique</th><th>Catégories</th></tr></thead><tbody><tr><td data-evidence="G24-C0049">Génétique</td><td data-evidence="G24-C0050">Autosomique dominante ; récessive ; liée à l’X récessive ; maternelle (mitochondriale) ; inconnue</td></tr><tr><td data-evidence="G24-C0051">Acquise</td><td data-evidence="G24-C0052">Médicaments ; toxiques ; traumatisme ; autre ; inconnue</td></tr><tr><td data-evidence="G24-C0053">Neuroanatomique</td><td data-evidence="G24-C0054">Lésion focale ; multifocale ; diffuse ; inconnue</td></tr><tr><td data-evidence="G24-C0055">Pathogenèse</td><td data-evidence="G24-C0056">Développementale ; dégénérative ; métabolique ; immune ou inflammatoire ; inconnue</td></tr></tbody></table>
<p data-evidence="G24-C0057">Une dystonie est dite <b>idiopathique</b> lorsqu’aucune cause génétique ou acquise n’est connue et qu’aucune lésion neuroanatomique n’est identifiée. Le mot « héréditaire » est remplacé par « génétique », car certains variants surviennent de façon sporadique. Les formes génétiques se nomment par le préfixe DYT suivi du gène (voir la <button class="w" data-k="g24-dyt">nomenclature génétique</button>). La ligne directrice de 2021 énumère comme causes acquises les lésions cérébrales périnatales, les infections, les médicaments, les toxiques, les causes vasculaires, néoplasiques et traumatiques ; elle y range aussi la dystonie « psychogène », alors que le consensus 2025 classe la <button class="w" data-k="g24-fonctionnelle">dystonie fonctionnelle</button> parmi les imitateurs.</p>
<div class="trap" data-evidence="G24-C0058"><span class="k">Piège</span> Le terme « dystonie complexe » est déconseillé depuis 2025, alors que la ligne directrice de 2021 l’emploie encore, par exemple pour la maladie de Wilson. Le candidat qui lit une source ancienne doit donc traduire « complexe » par « combinée » et ne pas y voir une catégorie distincte.</div>
<div class="key" data-evidence="G24-C0059"><b>À retenir.</b> L’axe I décrit (âge, famille, distribution, temps, phénoménologie, isolée ou combinée) ; l’axe II explique (génétique, acquise, neuroanatomie, pathogenèse). La distribution et l’âge de début orientent le plus vite vers la cause et vers le traitement.</div>
</section>
<section class="ilot" id="g24-3"><h2><span class="n">3</span>Fréquence et comorbidités</h2>
<p data-evidence="G24-C0060">Les chiffres de fréquence proviennent de sources anciennes ou hospitalières, et tous reconnaissent une <b>sous-estimation</b>. L’<button class="w" data-k="g24-prevalence">étude européenne ESEMED</button>, menée dans huit pays en 1996 et 1997 dans des cliniques spécialisées, rapporte une prévalence de la dystonie primaire de <b>152 par million</b> (intervalle de confiance à 95 % : 142 à 162). Les formes focales représentent 117 par million, la dystonie cervicale 57, le blépharospasme 36 et la crampe de l’écrivain 14 par million. Les taux ajustés sont plus élevés chez la femme pour les formes focales et segmentaires, sauf pour la crampe de l’écrivain.</p>
<p data-evidence="G24-C0061">Une méta-analyse de 16 études donne une prévalence globale de <b>16,43 pour 100 000</b> (intervalle de confiance à 95 % : 12,09 à 22,32) et une incidence corrigée de la dystonie cervicale de 1,07 pour 100 000 personnes-années. La ligne directrice allemande reprend le chiffre de 16,4 pour 100 000. Les deux estimations sont compatibles : 152 par million équivaut à 15,2 pour 100 000. À titre d’illustration arithmétique, une ville de 100 000 habitants compterait donc en moyenne une quinzaine de personnes atteintes de dystonie primaire, dont environ six sur dix de dystonie cervicale ou de blépharospasme.</p>
<p data-evidence="G24-C0062">Les dystonies focales et segmentaires idiopathiques de l’adulte forment la plus grande part. Elles débutent le plus souvent entre 30 et 50 ans, évoluent de façon relativement bénigne et répondent bien à la toxine botulique, ce qui explique que la toxine soit le premier traitement à connaître. Environ 25 % des dystonies isolées de l’adulte ont une anamnèse familiale positive, mais une cause monogénique n’est trouvée que chez moins de 3 % des patients des grands registres : un antécédent familial ne signe donc pas à lui seul une forme génétique identifiable.</p>
<p data-evidence="G24-C0063">En Suisse, aucune étude épidémiologique publiée n’a été retrouvée. La Société suisse de la dystonie estime environ <b>12 000 personnes</b> atteintes et un délai diagnostique moyen de deux ans, mais il s’agit d’un chiffre associatif dont la méthode n’est pas publiée. Il sert d’ordre de grandeur, non de donnée de santé publique.</p>
<p data-evidence="G24-C0064">Les <button class="w" data-k="g24-nonmoteur">symptômes non moteurs</button> sont fréquents dans la dystonie cervicale. Une méta-analyse de 2026 (42 études, hétérogénéité élevée) rapporte une dépression chez 35,2 % des patients, une anxiété chez 34,0 %, des troubles du sommeil chez 57,1 % et une fatigue chez 60,6 %. L’hétérogénéité élevée impose de lire ces pourcentages comme un ordre de grandeur, mais elle suffit à justifier que l’humeur, le sommeil et la fatigue soient recherchés à chaque consultation.</p>
<div class="key" data-evidence="G24-C0065"><b>À retenir.</b> Dystonie primaire : environ 152 par million en Europe, dont 57 pour la dystonie cervicale, 36 pour le blépharospasme et 14 pour la crampe de l’écrivain. Ces chiffres sont sous-estimés ; le chiffre suisse de 12 000 est associatif.</div>
</section>
<section class="ilot" id="g24-4"><h2><span class="n">4</span>Mécanismes</h2>
<p data-evidence="G24-C0066">Les sources lues ne décrivent pas un mécanisme unique. L’hypothèse actuelle est un <b>trouble central d’un réseau moteur</b> reliant les noyaux gris centraux, le cervelet et le cortex (<button class="w" data-k="g24-reseau">réseau moteur</button>). Aucun trouble biochimique commun à toutes les dystonies n’a été démontré : la dystonie est un syndrome atteint par plusieurs chemins.</p>
<p data-evidence="G24-C0067">Trois arguments désignent les noyaux gris centraux. Des lésions de ces noyaux provoquent des formes secondaires. Des médicaments qui agissent sur le système dopaminergique induisent des dystonies. Enfin, en tomographie par émission de positons, la captation métabolique des noyaux gris centraux est modifiée chez des patients dont l’imagerie par résonance magnétique est normale. Des lésions du thalamus, du tronc cérébral ou de la substance blanche peuvent aussi causer une dystonie, car elles interrompent le même réseau sensorimoteur ; l’origine médullaire ou périphérique reste débattue.</p>
<p data-evidence="G24-C0068">Au niveau cellulaire, le consensus 2025 énumère des voies communes proposées, sans consensus : signalisation dopaminergique et plasticité synaptique, transport intracellulaire, homéostasie ionique, stress du réticulum ou du noyau, métabolisme énergétique et dégradation par les lysosomes et l’autophagie. Pour plusieurs gènes (TOR1A, THAP1, GCH1, KMT2B) et pour la dystonie idiopathique, une revue de 2018 résume des anomalies de régulation transcriptionnelle, de signalisation dopaminergique striatale, de plasticité synaptique et une perte d’inhibition des circuits neuronaux. Cette dernière s’accorde avec le débordement observé en clinique : un circuit moins freiné laisse l’activité gagner des segments voisins. Cette lecture reste une interprétation cohérente, non une démonstration.</p>
<p data-evidence="G24-C0069">Un seul mécanisme est établi jusque dans le traitement : la <button class="w" data-k="g24-gch1">dystonie dopa-sensible</button>. Une anomalie autosomique dominante de la synthèse de la tétrahydrobioptérine, cofacteur de la synthèse de dopamine, crée un déficit dopaminergique. Il est corrigé par de faibles doses de lévodopa, ce qui explique la réponse spectaculaire et justifie l’essai thérapeutique de lévodopa chez tout enfant ou adolescent dystonique.</p>
<p data-evidence="G24-C0070">L’effet de la toxine botulique repose sur un mécanisme connu en détail : elle bloque la libération d’acétylcholine à la jonction neuromusculaire, d’où une faiblesse musculaire ; la <button class="w" data-k="g24-toxine-meca">jonction se rétablit</button> ensuite, ce qui explique le délai d’action et l’atténuation de l’effet.</p>
<div class="key" data-evidence="G24-C0071"><b>À retenir.</b> Dystonie = trouble d’un réseau noyaux gris centraux, cervelet et cortex, sans mécanisme biochimique commun démontré. Les deux mécanismes à connaître sont celui de la dystonie dopa-sensible (déficit en tétrahydrobioptérine) et celui de la toxine botulique.</div>
<button class="pareto-btn ui" data-k="pareto-g24-concept">▲ Loi de Pareto — Notions fondamentales</button>
</section>
<section class="ilot" id="g24-5"><h2><span class="n">5</span>Formes cliniques</h2>
<p data-evidence="G24-C0072">Le tableau synthétise les formes à connaître. Il associe chaque forme à son signe clé et à l’orientation thérapeutique, que les paragraphes suivants justifient.</p>
<table class="t"><thead><tr><th>Forme</th><th>Signe clé</th><th>Orientation thérapeutique</th></tr></thead><tbody><tr><td data-evidence="G24-C0073">Dystonie cervicale (G24.3)</td><td data-evidence="G24-C0074">Posture anormale de la tête, du cou ou des épaules, avec tremblement et douleur</td><td data-evidence="G24-C0075">Toxine botulique en première intention</td></tr><tr><td data-evidence="G24-C0076">Blépharospasme (G24.5)</td><td data-evidence="G24-C0077">Spasmes brefs des paupières, sans torsion</td><td data-evidence="G24-C0078">Toxine botulique</td></tr><tr><td data-evidence="G24-C0079">Dystonie oromandibulaire (G24.4)</td><td data-evidence="G24-C0080">Fermeture ou ouverture forcée de la mâchoire</td><td data-evidence="G24-C0081">Toxine, mieux pour la fermeture</td></tr><tr><td data-evidence="G24-C0082">Dystonie laryngée</td><td data-evidence="G24-C0083">Voix forcée (adductrice) ou soufflée (abductrice)</td><td data-evidence="G24-C0084">Toxine pour le type adducteur</td></tr><tr><td data-evidence="G24-C0085">Crampe de l’écrivain ou du musicien</td><td data-evidence="G24-C0086">Dystonie spécifique d’une tâche</td><td data-evidence="G24-C0087">Toxine, effet moindre</td></tr><tr><td data-evidence="G24-C0088">DYT-TOR1A</td><td data-evidence="G24-C0089">Début dans l’enfance, généralisation progressive</td><td data-evidence="G24-C0090">Traitement de la dystonie généralisée (voir Prise en charge)</td></tr><tr><td data-evidence="G24-C0091">Myoclonus-dystonie (SGCE)</td><td data-evidence="G24-C0092">Dystonie et myoclonies sensibles à l’alcool</td><td data-evidence="G24-C0093">Non détaillée dans les sources lues</td></tr><tr><td data-evidence="G24-C0094">Dystonie dopa-sensible</td><td data-evidence="G24-C0095">Fluctuations diurnes, début dans l’enfance</td><td data-evidence="G24-C0096">Lévodopa à faible dose</td></tr><tr><td data-evidence="G24-C0097">Dystonie médicamenteuse (G24.0)</td><td data-evidence="G24-C0098">Aiguë, crise oculogyre ou tardive</td><td data-evidence="G24-C0099">Arrêt du métoclopramide ; anticholinergique ou benzodiazépine selon l’âge</td></tr></tbody></table>
<h3>5.1 Dystonie cervicale ou torticolis spasmodique (G24.3)</h3>
<p data-evidence="G24-C0100">C’est la forme focale la plus fréquente. Des contractions involontaires, persistantes ou intermittentes, des muscles cervicaux créent des postures anormales de la tête, du cou ou des épaules, souvent accompagnées de tremblement et de douleur. Le concept <button class="w" data-k="g24-colcap">Col-Cap</button> sépare les mouvements de la tête (« caput », articulations occiput-C1-C2) de ceux du rachis cervical (« collis »), selon quatre directions : inclinaison, rotation, flexion et extension. Il en résulte huit motifs de base ; plus de 60 % des patients associent plusieurs motifs, parfois avec une translation. Décrire le motif précis permet de choisir les muscles à injecter.</p>
<h3>5.2 Blépharospasme (G24.5) et dystonie oromandibulaire (G24.4)</h3>
<p data-evidence="G24-C0101">Le blépharospasme est fait de spasmes phasiques brefs des paupières, sans torsion. Lorsque la face supérieure et la face inférieure sont atteintes ensemble, on parle de <button class="w" data-k="g24-meige">syndrome de Meige</button>, forme segmentaire crânienne. Dans la dystonie oromandibulaire, il faut distinguer la fermeture de la mâchoire et son ouverture, car la fermeture répond mieux à la toxine.</p>
<h3>5.3 Autres formes : laryngée, spécifique d’une tâche, génétiques</h3>
<p data-evidence="G24-C0102">La <button class="w" data-k="g24-laryngee">dystonie laryngée</button> (dysphonie spasmodique) existe en type adducteur, à voix forcée et étranglée, et en type abducteur, à voix soufflée. La crampe de l’écrivain et celle du musicien sont des dystonies spécifiques d’une tâche : le geste professionnel précis déclenche la dystonie.</p>
<p data-evidence="G24-C0103">Parmi les formes génétiques, la forme <button class="w" data-k="g24-dyt">DYT-TOR1A</button> débute dans l’enfance, souvent à la main ou au pied, se généralise progressivement et reste longtemps isolée. Le myoclonus-dystonie (SGCE) associe à la dystonie des myoclonies brusques, typiquement sensibles à l’alcool. La dystonie dopa-sensible de Segawa fluctue au cours de la journée et répond à moins de 3 × 100 mg de lévodopa par jour.</p>
<h3>5.4 Dystonie médicamenteuse (G24.0)</h3>
<p data-evidence="G24-C0104">La <button class="w" data-k="g24-medic">dystonie médicamenteuse</button> comprend trois tableaux. La <b>dystonie aiguë</b> survient sous antipsychotique ou sous métoclopramide, même après une dose unique pour ce dernier, surtout chez l’enfant et l’adulte jeune. La <button class="w" data-k="g24-oculogyre">crise oculogyre</button> en est une forme : déviation tonique et conjuguée des yeux vers le haut. La <button class="w" data-k="g24-tardive">dyskinésie tardive</button>, codée dans la même sous-catégorie, associe des mouvements rythmiques involontaires de la langue, du visage, de la bouche ou de la mâchoire après un traitement prolongé ou à son arrêt ; elle peut être irréversible et peut être masquée par la reprise ou l’augmentation de l’antipsychotique.</p>
<div class="key" data-evidence="G24-C0105"><b>À retenir.</b> Distribution et âge de début dictent l’étiquette : cou, paupières, mâchoire, larynx ou main pour les formes focales de l’adulte ; enfance et généralisation pour les formes génétiques ; toujours rechercher le médicament.</div>
</section>
<section class="ilot" id="g24-6"><h2><span class="n">6</span>Anamnèse et examen clinique</h2>
<p data-evidence="G24-C0106">Le diagnostic repose sur la reconnaissance de motifs de mouvement typiques produisant des postures anormales. L’anamnèse et l’examen servent à décrire ce motif puis à orienter la recherche étiologique.</p>
<h3>6.1 Anamnèse</h3>
<p data-evidence="G24-C0107">Quatre éléments centraux guident la cause. L’âge de début oriente le classement (voir l’axe I). Le déroulement de la naissance et le développement moteur précoce recherchent une atteinte périnatale. Le traumatisme ou l’inflammation cérébrale recherche une cause acquise. Les cas familiaux orientent vers une forme génétique ; le médecin dessine l’arbre généalogique pour dégager le mode de transmission, car les signes discrets des apparentés sont souvent méconnus. L’<b>anamnèse médicamenteuse</b> complète la liste, car un antipsychotique ou le métoclopramide expliquent une dystonie aiguë ou tardive.</p>
<p data-evidence="G24-C0108">Le tremblement associé est présent chez plus de 50 % des patients et peut précéder la dystonie de plusieurs années ; on le décrit séparément de la dystonie.</p>
<h3>6.2 Examen</h3>
<p data-evidence="G24-C0109">L’examen recherche cinq éléments : le <button class="w" data-k="g24-geste">geste antagoniste</button>, le débordement, la dystonie en miroir, la spécificité de tâche, et la présence de la dystonie au repos ou d’une posture fixée. Chacun répond à une question précise. Un geste antagoniste, comme le doigt sur le menton de la vignette, est un signe décrit dans la dystonie. La spécificité de tâche oriente vers la crampe de l’écrivain ou du musicien. Une posture fixée évoque une dystonie fonctionnelle quand le début est aigu ou subaigu chez l’adulte.</p>
<p data-evidence="G24-C0110">Quatre <b>drapeaux rouges</b> font douter d’une dystonie idiopathique : une parésie, des signes pyramidaux, une ataxie et un déclin cognitif. Ils signent une atteinte plus large du système nerveux, qui impose un bilan étiologique plus étendu.</p>
<div class="trap" data-evidence="G24-C0111"><span class="k">Piège</span> Un début brutal avec posture fixée n’est pas forcément fonctionnel : le consensus 2025 écrit « souvent, mais pas toujours ». Le début brutal, la distractibilité, la suppressibilité et d’autres signes fonctionnels sont les éléments que le consensus cite pour la <button class="w" data-k="g24-fonctionnelle">dystonie fonctionnelle</button>.</div>
<div class="key" data-evidence="G24-C0112"><b>À retenir.</b> L’anamnèse médicamenteuse et l’âge de début se recherchent en premier ; le geste antagoniste, le débordement, la spécificité de tâche et les quatre drapeaux rouges (parésie, signes pyramidaux, ataxie, déclin cognitif) se recherchent à l’examen.</div>
