<template id="ch-I68"><div class="chap"><div class="chap-head"><div class="code">I 68 · Neurologie · Vaisseaux cérébraux atteints par une maladie générale</div><h1>Troubles cérébrovasculaires au cours de maladies classées ailleurs</h1><span class="status">Cycle Betta 33 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des atteintes vasculaires secondaires</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#i68-0">Question clinique</a></li><li><a href="#i68-1">Définition et classification</a></li><li><a href="#i68-2">Fréquence et données disponibles</a></li><li><a href="#i68-3">Physiopathologie</a></li><li><a href="#i68-4">Causes et facteurs de risque</a></li><li><a href="#i68-5">Anamnèse</a></li><li><a href="#i68-6">Examen clinique</a></li><li><a href="#i68-7">Démarche diagnostique et diagnostics différentiels</a></li><li><a href="#i68-8">Urgences et complications</a></li><li><a href="#i68-9">Prise en charge</a></li><li><a href="#i68-10">Suivi et pronostic</a></li><li><a href="#i68-11">Situations particulières</a></li><li><a href="#i68-12">Critères formels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="i68-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>première vignette fictive</b>, une femme de 76 ans, hypertendue, prend un anticoagulant oral direct pour une fibrillation atriale. Elle est conduite aux urgences pour une hémiparésie droite d’installation brusque, avec des troubles du langage. Le scanner cérébral montre un hématome de la région lobaire gauche, sans lésion des noyaux gris profonds. L’imagerie par résonance magnétique, réalisée au deuxième jour, révèle de nombreux petits foyers d’hémosidérine strictement corticaux et sous-corticaux, ainsi qu’un dépôt de fer à la surface de la corticalité. Ces données pédagogiques posent la question centrale de ce cours : <b>quelle maladie des petits vaisseaux a produit cet hématome, et comment cette cause change-t-elle la décision sur l’anticoagulant ?</b></p>
<p>Dans une <b>seconde vignette fictive</b>, un homme de 38 ans, sans facteur de risque vasculaire connu, présente un infarctus du territoire sylvien. Il rapporte une éruption cutanée datant de quelques mois. La question est alors inverse : <b>quelle infection explique cette atteinte artérielle, et quel traitement la guérit-elle ?</b> Ces deux patients ont un trouble cérébrovasculaire, mais la maladie qui l’a causé commande tout le reste : l’un exige d’éviter les antithrombotiques, l’autre exige de la pénicilline par voie intraveineuse.</p>
<p>Cette catégorie réunit ainsi des atteintes des vaisseaux cérébraux dont l’origine est une maladie classée ailleurs. Quatre grands ensembles la composent : l’<button class="w" data-k="i68-aac">angiopathie amyloïde cérébrale (définition et place dans la catégorie)</button>, les artérites cérébrales des maladies infectieuses, l’artérite cérébrale du lupus érythémateux disséminé et une rubrique résiduelle. L’angiopathie amyloïde cérébrale occupe ici la place principale, parce qu’elle est la cause fréquente d’hématome lobaire du sujet âgé et qu’elle conditionne les décisions antithrombotiques et l’éligibilité aux immunothérapies anti-amyloïdes. Les artérites infectieuses viennent ensuite, puis l’artérite lupique. Cette hiérarchie est un choix pédagogique du cours ; la classification elle-même ne l’impose pas.</p>
<p>À la fin de ce cours, le lecteur sait reconnaître chaque entité par son contexte, appliquer les <button class="w" data-k="i68-boston">critères de Boston, version 2.0 (définition, seuils et limites)</button>, choisir l’examen qui tranche, éviter l’erreur la plus dangereuse de chaque situation et nommer les lacunes des sources. Les deux vignettes reviennent dans les cas corrigés de l’onglet des examens.</p>
<div class="key"><b>À retenir.</b> Devant un trouble cérébrovasculaire, l’étape décisive est de trouver la maladie générale qui a atteint le vaisseau. L’angiopathie amyloïde commande d’éviter les antithrombotiques ; l’artérite infectieuse commande de traiter l’infection ; l’artérite lupique commande de rechercher les anticorps antiphospholipides.</div>
</section>

<section class="ilot" id="i68-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La catégorie étudiée ici suit la classification internationale des maladies, dixième révision, version allemande 2024 (<button class="w" data-k="i68-croix">système croix-astérisque (principe du double code)</button>). Cette classification utilise un double codage : la maladie causale porte un code marqué d’une croix (†), et la manifestation d’organe porte un code marqué d’un astérisque (*). La catégorie des troubles cérébrovasculaires au cours de maladies classées ailleurs, notée I68*, désigne donc la manifestation cérébrovasculaire ; elle ne peut jamais être utilisée seule. Elle exige de nommer la maladie qui a causé l’atteinte vasculaire.</p>
<p>Cinq rubriques la composent. La rubrique I68.0* désigne l’angiopathie amyloïde cérébrale, rattachée à l’amylose (catégorie E85.-†). La rubrique I68.1* désigne l’artérite cérébrale au cours de maladies infectieuses et parasitaires, avec pour exemples cités par la classification la listériose, la syphilis et la tuberculose. La rubrique I68.2* désigne l’artérite cérébrale au cours d’autres maladies classées ailleurs, dont le lupus érythémateux disséminé. La rubrique I68.8* regroupe les autres troubles ; la version allemande de 2024 n’y cite aucune inclusion, alors que la classification de l’Organisation mondiale de la santé de 2019 y cite l’apoplexie urémique au cours d’une maladie rénale chronique. Les intitulés français proviennent du registre de l’Office fédéral de la statistique repris par le projet.</p>
<p>Le tableau suivant relie chaque entité à la maladie qui la cause et à la conséquence pratique de cette cause. Il sert de grille de lecture pour la suite du cours : on y revient chaque fois qu’un trouble cérébrovasculaire doit être rattaché à son origine.</p>
<table class="t"><thead><tr><th>Entité</th><th>Maladie causale</th><th>Atteinte du vaisseau</th><th>Conséquence pratique</th></tr></thead><tbody><tr><td>Angiopathie amyloïde cérébrale</td><td>Dépôt de peptide amyloïde bêta dans la paroi des petits vaisseaux</td><td>Fragilisation de la paroi corticale et leptoméningée</td><td>Hémorragie lobaire ; éviter les antithrombotiques inutiles ; éligibilité aux anti-amyloïdes</td></tr><tr><td>Artérite infectieuse</td><td>Syphilis, tuberculose, méningite bactérienne dont la listériose, virus varicelle-zona</td><td>Inflammation de la paroi, spasme, thrombose</td><td>Traiter l’infection ; imagerie et ponction lombaire</td></tr><tr><td>Artérite lupique</td><td>Lupus érythémateux disséminé, souvent avec anticorps antiphospholipides</td><td>Thrombose ou inflammation</td><td>Antithrombotique si antiphospholipides ; immunosuppression si inflammation</td></tr><tr><td>Autres troubles</td><td>Maladie rénale chronique (classification de l’Organisation mondiale de la santé)</td><td>Non décrite dans les sources lues</td><td>Aucune conduite spécifique documentée</td></tr></tbody></table>
<p>Le tableau montre que la même question clinique, « pourquoi ce vaisseau a-t-il saigné ou s’est-il occlus ? », reçoit quatre réponses différentes. L’erreur à éviter est d’appliquer à un patient la conduite d’une autre entité : donner un antithrombotique réflexe à un patient dont l’hématome vient de l’angiopathie amyloïde expose à une récidive hémorragique, alors que le même geste est la règle dans le syndrome des antiphospholipides.</p>
<p>Le double codage a une autre conséquence : lorsqu’un hématome ou un infarctus est avéré, il se code aussi dans le bloc des maladies cérébrovasculaires. Les sources lues ne précisent pas la règle exacte de ce double codage pour cette catégorie ; elle n’est donc pas détaillée ici.</p>
<div class="trap"><span class="k">Piège</span> Ne pas coder ni raisonner « I68 » seule. La catégorie est une manifestation ; sans la maladie causale (amylose, infection, lupus), elle ne dit rien de la conduite à tenir. Le sous-code exact de l’amylose qui convient à l’angiopathie amyloïde n’est pas précisé par la classification lue.</div>

<section class="ilot" id="i68-2"><h2><span class="n">2</span>Fréquence et données disponibles</h2>
<p>Aucune donnée suisse propre à la catégorie n’a été trouvée dans les sources lues : ni incidence suisse de l’angiopathie amyloïde, ni incidence suisse des artérites infectieuses. Les chiffres cités viennent de revues et de méta-analyses internationales, et la revue suisse principale sur l’angiopathie amyloïde, publiée en 2023 par les Hôpitaux universitaires de Genève dans la Revue Médicale Suisse, donne des fréquences générales. Cette lacune est nommée parce qu’un lecteur suisse ne doit pas croire qu’un chiffre étranger décrit sa pratique.</p>
<p><b>Angiopathie amyloïde cérébrale.</b> La revue suisse estime sa prévalence à environ 25 % chez les sujets âgés ayant une atteinte modérée à sévère, et à 30 à 50 % dans les cohortes hospitalières et chez les patients avec des troubles cognitifs. Une méta-analyse de 170 études, portant sur plus de 73 000 personnes, précise ces valeurs selon la méthode de détection.</p>
<table class="t"><thead><tr><th>Population</th><th>Prévalence rapportée</th><th>Méthode</th></tr></thead><tbody><tr><td>Population générale</td><td>23 % ; 7 %</td><td>Anatomopathologie ; imagerie par résonance magnétique</td></tr><tr><td>Sujets âgés sans trouble cognitif</td><td>5 à 7 %</td><td>Selon la méta-analyse</td></tr><tr><td>Patients atteints de la maladie d’Alzheimer</td><td>48 % ; 22 %</td><td>Anatomopathologie ; microsaignements strictement lobaires</td></tr><tr><td>Hémorragie intracérébrale, toutes localisations</td><td>19 à 24 %</td><td>Selon la méta-analyse</td></tr><tr><td>Hémorragie intracérébrale lobaire</td><td>50 à 57 %</td><td>Selon la méta-analyse</td></tr></tbody></table>
<p>La dernière ligne est la plus utile en clinique : <b>à peu près une hémorragie lobaire sur deux est attribuable à l’angiopathie amyloïde</b>. Les écarts entre colonnes rappellent qu’une même maladie est détectée plus souvent à l’autopsie que sur l’imagerie : l’imagerie voit les saignements, pas le dépôt lui-même. Le rapport avec la maladie d’Alzheimer est partiel : moins de la moitié des angiopathies amyloïdes remplissent les critères anatomopathologiques de la maladie d’Alzheimer, et plus de 75 % des cas d’Alzheimer ont peu ou pas d’angiopathie amyloïde. Un Alzheimer « pur » ne se voit que dans 9 % des autopsies. Il s’agit donc de deux maladies qui se chevauchent sans se confondre.</p>
<p>Deux présentations plus rares complètent le tableau. Les <button class="w" data-k="i68-enft">épisodes neurologiques focaux transitoires (définition et signification)</button> forment la présentation la plus fréquente après l’hémorragie lobaire, avec 14,5 % d’une cohorte européenne de 172 patients ; environ 1 % des suspicions d’accident ischémique transitoire pourraient relever de l’angiopathie amyloïde. L’hémorragie sous-arachnoïdienne de la convexité, non traumatique, est attribuée à l’angiopathie amyloïde dans environ un quart à un tiers des cas, et dans environ 76 % après 60 ans. L’<button class="w" data-k="i68-iatro">angiopathie amyloïde iatrogène (mécanisme et délai)</button> est rapportée dans le monde après une intervention exposant à une transmission du peptide, avec une latence habituelle de trois à quatre décennies.</p>
<p><b>Artérites infectieuses.</b> Dans la méningite bactérienne de l’adulte, les complications cérébrovasculaires atteignent 15 à 40 %. Dans la méningite tuberculeuse, un accident vasculaire survient chez 15 à 57 % des patients, surtout aux stades avancés, et il est souvent asymptomatique. La neurosyphilis méningovasculaire est décrite comme l’une des manifestations les plus fréquentes de la neurosyphilis, sans chiffre. La <button class="w" data-k="i68-mening">listériose (place dans la méningite de l’adulte)</button> vient en troisième position des germes à évoquer en Europe, après le pneumocoque et le méningocoque.</p>
<p><b>Lupus.</b> La maladie cérébrovasculaire fait partie des manifestations neuropsychiatriques fréquentes du lupus, avec une incidence cumulée supérieure à 5 %. Les anticorps antiphospholipides multiplient au moins par cinq le risque cérébrovasculaire.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure qu’un patient âgé avec des troubles cognitifs « a une maladie d’Alzheimer » et que l’angiopathie amyloïde n’a pas d’importance. Les deux maladies coexistent souvent, mais l’angiopathie change à elle seule le risque hémorragique, donc la prescription d’antithrombotiques.</div>
<button class="pareto-btn ui" data-k="pareto-i68-definition">▲ Loi de Pareto — Définition et fréquence</button>
</section>

<section class="ilot" id="i68-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p><b>Le mécanisme normal.</b> Le cerveau doit éliminer en continu le peptide amyloïde bêta (<button class="w" data-k="i68-abeta">peptide amyloïde bêta (origine, formes courtes et longues)</button>). Une part de cette élimination passe par les espaces entourant les vaisseaux : c’est la voie de <button class="w" data-k="i68-clairance">clairance périvasculaire (principe et boucle auto-entretenue)</button>. Tant que cette voie fonctionne, le peptide ne s’accumule pas dans la paroi des vaisseaux.</p>
<p><b>L’angiopathie amyloïde.</b> Lorsque cette clairance est altérée, le peptide s’accumule : il se dépose progressivement, surtout sous forme de peptide à quarante acides aminés, dans la média et l’adventice des petits vaisseaux corticaux et leptoméningés. Ces dépôts sont composés d’espèces plus courtes que celles des plaques de la maladie d’Alzheimer. Le dépôt réduit à son tour la clairance périvasculaire : l’augmentation de l’amyloïde vasculaire diminue encore l’élimination, ce qui augmente le dépôt. Cette boucle auto-entretenue explique que la maladie progresse de façon continue.</p>
<figure><svg viewBox="0 0 640 330" role="img" aria-label="Figure 1 — Cercle de l’angiopathie amyloïde et ses conséquences" font-size="13"><defs><marker id="i68-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="currentColor"/></marker></defs><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="30" y="20" width="260" height="62" rx="6"/><rect x="350" y="20" width="260" height="62" rx="6"/><path d="M290 51H346" marker-end="url(#i68-ar)"/><path d="M480 82V104H160V86" marker-end="url(#i68-ar)"/><rect x="20" y="170" width="180" height="76" rx="6"/><rect x="230" y="170" width="180" height="76" rx="6"/><rect x="440" y="170" width="180" height="76" rx="6"/><path d="M480 82V130H110V166" marker-end="url(#i68-ar)"/><path d="M480 130H320V166" marker-end="url(#i68-ar)"/><path d="M480 130H530V166" marker-end="url(#i68-ar)"/></g><g fill="currentColor" text-anchor="middle"><text x="160" y="46">Clairance périvasculaire</text><text x="160" y="66">de l’amyloïde bêta altérée</text><text x="480" y="46">Dépôt dans la média et</text><text x="480" y="66">l’adventice des petits vaisseaux</text><text x="110" y="200">Macrohémorragie</text><text x="110" y="220">lobaire</text><text x="320" y="200">Microsaignements,</text><text x="320" y="220">sidérose superficielle</text><text x="530" y="200">Substance blanche,</text><text x="530" y="220">micro-infarctus</text><text x="320" y="296" font-size="12">Le dépôt réduit la clairance, ce qui augmente le dépôt : cercle auto-entretenu.</text></g></svg><figcaption>Figure 1 — Cercle de l’angiopathie amyloïde et ses conséquences. Schéma didactique : les flèches vers le bas indiquent les lésions qui en résultent, sans hiérarchie chiffrée entre elles.</figcaption></figure>
<p>Le dépôt affaiblit la paroi, qui se rompt ou s’occlut. Cinq conséquences sont décrites. Les macrohémorragies lobaires provoquent des déficits focaux souvent sévères. Les <button class="w" data-k="i68-microsaignement">microsaignements (aspect et signification)</button> produisent un déclin cognitif à bas bruit. S’y ajoutent des lésions de la substance blanche (espaces périvasculaires élargis du centre semi-ovale, hypersignaux dits « multispot »), des micro-infarctus corticaux et de petits infarctus sous-corticaux récents, et les épisodes neurologiques focaux transitoires. Le profil cognitif est dominé par l’atteinte des fonctions exécutives et de la vitesse de traitement, par un syndrome de déconnexion de la substance blanche.</p>
<p>Le mécanisme probable des épisodes transitoires est la <button class="w" data-k="i68-dec">dépolarisation corticale envahissante (principe et cinétique)</button> : un saignement superficiel déclenche une vague d’inactivité qui progresse d’environ 3 millimètres par minute à la surface du cortex. Cette cinétique explique que les symptômes progressent de proche en proche, par exemple de la main au bras puis au visage. La preuve directe de ce mécanisme manque.</p>
<p><b>Deux complications immunologiques et iatrogènes.</b> L’<button class="w" data-k="i68-aacri">angiopathie amyloïde cérébrale inflammatoire (définition et conduite)</button> est un sous-type rare et agressif, attribué à une réaction immunitaire dirigée contre l’amyloïde de la paroi vasculaire. Elle est potentiellement réversible et sensible aux corticoïdes. D’autre part, les anticorps dirigés contre l’amyloïde, utilisés dans la maladie d’Alzheimer, peuvent causer des <button class="w" data-k="i68-aria">anomalies d’imagerie liées à l’amyloïde (œdème et dépôts d’hémosidérine)</button> : un œdème ou une effusion (ARIA-E) et des microhémorragies ou une sidérose superficielle (ARIA-H). L’angiopathie amyloïde concomitante augmente ce risque.</p>
<p><b>Les artérites infectieuses.</b> Dans la <button class="w" data-k="i68-tb">artérite de la méningite tuberculeuse (territoires et mécanismes)</button>, les vaisseaux sont pris dans l’exsudat de la base du crâne et étirés par l’hydrocéphalie. Il en résulte des infarctus multiples, souvent bilatéraux, des noyaux gris, dans une zone dite tuberculeuse (noyau caudé, thalamus antérieur, bras antérieur et genou de la capsule interne). Les segments proximaux des artères cérébrales moyenne, antérieure et postérieure, la carotide supraclinoïdienne et le tronc basilaire peuvent aussi être touchés. Le rôle du facteur de nécrose tumorale alpha, du facteur de croissance de l’endothélium vasculaire, des métalloprotéinases et d’un état prothrombotique est évoqué. À l’autopsie, l’artérite est plus fréquente que l’infarctus.</p>
<p>Dans la méningite bactérienne, la vasculite, le vasospasme, l’altération de l’autorégulation et la thrombose septique veineuse produisent l’ischémie, parfois transformée en hémorragie. Dans la <button class="w" data-k="i68-syph">syphilis méningovasculaire (délai et mécanisme)</button>, l’atteinte est à la fois vasculaire et méningée ; elle survient quelques mois ou plusieurs années après l’infection. Les sources lues ne décrivent pas l’histologie de l’endartérite. Dans la <button class="w" data-k="i68-vzv">vasculopathie du virus varicelle-zona (mécanisme et niveau de preuve)</button>, le virus latent des ganglions sensitifs se réactive et provoque une vasculite cérébrale puis une ischémie, chez l’enfant comme chez l’adulte, avec une atteinte multifocale chez l’immunodéprimé.</p>
<p><b>Le lupus.</b> La maladie cérébrovasculaire thrombotique du lupus est surtout liée aux <button class="w" data-k="i68-aps">anticorps antiphospholipides (rôle et conséquences)</button>.</p>
<div class="key"><b>À retenir.</b> Trois mécanismes distincts expliquent trois attitudes. Une paroi fragilisée par l’amyloïde saigne : éviter les antithrombotiques. Une paroi enflammée par une infection se rétrécit ou se thrombose : traiter l’infection. Un sang rendu thrombogène par les anticorps antiphospholipides se coagule : antithrombotique.</div>
<button class="pareto-btn ui" data-k="pareto-i68-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="i68-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les facteurs de risque se lisent entité par entité, car ils n’ont presque rien en commun. Le tableau les rassemble avec leur source ; chaque facteur est suivi de la raison pour laquelle il compte.</p>
<table class="t"><thead><tr><th>Entité</th><th>Facteurs identifiés</th><th>Pourquoi ils comptent</th></tr></thead><tbody><tr><td>Angiopathie amyloïde sporadique</td><td>Âge ; association avec la maladie d’Alzheimer ; allèle ε4 du gène <button class="w" data-k="i68-apoe">APOE (rôle dans l’hémorragie et les ARIA)</button></td><td>L’allèle ε4 est associé à l’hémorragie lobaire liée à l’angiopathie amyloïde</td></tr><tr><td>Angiopathie amyloïde iatrogène</td><td>Neurochirurgie de l’enfance, dure-mère cadavérique, instrumentation cérébrale ou médullaire ; latence de 30 à 40 ans</td><td>Transmission du peptide amyloïde ; difficile à distinguer de la forme sporadique chez le sujet âgé</td></tr><tr><td>Angiopathie amyloïde sous anticorps anti-amyloïdes</td><td>Homozygotie pour l’allèle ε4 ; microsaignements ou sidérose préexistants ; trisomie 21</td><td>Risque plus élevé d’anomalies d’imagerie liées à l’amyloïde</td></tr><tr><td>Listériose</td><td>Âge, cancer, immunosuppression</td><td>Terrain de la méningite à Listeria</td></tr><tr><td>Syphilis méningovasculaire</td><td>Accident vasculaire du sujet jeune, surtout de l’homme, sans profil de risque vasculaire</td><td>Signale l’infection plutôt qu’une athérosclérose</td></tr><tr><td>Vasculopathie varicelle-zona</td><td>Infection récente par le virus ; moins de 200 lymphocytes CD4 par microlitre au cours du VIH ; varicelle de l’enfant non vacciné</td><td>Réactivation virale facilitée par l’immunodépression</td></tr><tr><td>Lupus</td><td>Anticorps antiphospholipides</td><td>Multiplient au moins par cinq le risque cérébrovasculaire</td></tr></tbody></table>
<p>Ce tableau prépare l’anamnèse. L’âge et un hématome lobaire orientent vers l’amyloïde ; un accident vasculaire du sujet jeune sans facteur de risque oriente vers la syphilis ; une immunodépression oriente vers la listériose ou le virus varicelle-zona ; un lupus connu ou des thromboses antérieures orientent vers les anticorps antiphospholipides. Les facteurs de l’angiopathie héréditaire n’ont fait l’objet d’aucune source lue.</p>
<div class="trap"><span class="k">Piège</span> Associer un facteur à une entité n’établit pas la cause. Les sources montrent des associations de risque ; le diagnostic repose sur les critères formels du dernier îlot de cet onglet.</div>
<button class="pareto-btn ui" data-k="pareto-i68-causes">▲ Loi de Pareto — Causes et risque</button>
</section>
