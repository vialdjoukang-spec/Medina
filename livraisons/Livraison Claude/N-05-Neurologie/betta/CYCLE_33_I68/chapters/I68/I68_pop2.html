<template data-pop="i68-boston" data-title="Critères de Boston 2.0 : définition, seuils et limites">
<div class="lab">Définition</div><p>Les critères de Boston, version 2.0, classent l’angiopathie amyloïde en certaine, probable avec support anatomopathologique, probable et possible. Ils s’appliquent à partir de 50 ans, avec une présentation compatible (hémorragie spontanée, épisodes transitoires, troubles cognitifs).</p>
<div class="lab">Seuils</div><p>Probable : au moins deux lésions hémorragiques strictement lobaires (hémorragie, microsaignements, foyers de sidérose superficielle, hémorragie sous-arachnoïdienne de la convexité) ou une lésion lobaire plus une caractéristique de substance blanche. Possible : une seule lésion hémorragique lobaire ou une seule caractéristique de substance blanche.</p>
<div class="lab">Exclusions</div><p>Toute lésion hémorragique profonde ; autre cause de saignement (traumatisme, transformation hémorragique d’un infarctus, malformation artério-veineuse, tumeur hémorragique, antivitamine K avec INR supérieur à 3, vasculite). Une hémorragie cérébelleuse n’est comptée ni comme lobaire ni comme profonde.</p>
<div class="lab">Performance</div><p>Sur autopsie : sensibilité de 74,5 % (intervalle de confiance à 95 % de 65,4 à 82,4) et spécificité de 95,0 % (83,1 à 99,4), supérieure aux critères de Boston modifiés (sensibilité de 64,5 %). Chez les patients asymptomatiques ou n’ayant que des troubles cognitifs : sensibilité de 28,6 % et spécificité de 65,3 %.</p>
<div class="lab">Limite de lecture</div><p>Le texte original des critères n’a été lu qu’en résumé, complété par une source secondaire ; le tableau original n’a pas été relu.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(22)00208-3" target="_blank" rel="noopener">Charidimou et coll., The Lancet Neurology, 2022</a> ; <a href="https://radiopaedia.org/articles/boston-criteria-20-for-cerebral-amyloid-angiopathy" target="_blank" rel="noopener">Radiopaedia</a>.</p></template>
<template data-pop="i68-edimbourg" data-title="Critères d’Édimbourg : scanner et génétique">
<div class="lab">Définition</div><p>Ils combinent des signes de scanner et le génotype APOE pour reconnaître l’angiopathie amyloïde dans une hémorragie lobaire, lorsque la résonance magnétique manque.</p>
<div class="lab">Élaboration</div><p>110 autopsies (cohorte LINCHPIN). Chez 62 hémorragies lobaires, l’angiopathie modérée à sévère est associée à l’hémorragie sous-arachnoïdienne (89 % contre 42 %), aux projections digitiformes (39 % contre 0 %) et à l’allèle ε4 (50 % contre 8 %). Statistique de concordance de 0,92 ; spécificité de 96 % pour la règle d’inclusion.</p>
<div class="lab">Valeur pronostique</div><p>Récidive d’hémorragie à 5 ans : 12 % (bas risque), 16 % (risque intermédiaire, rapport de risque ajusté de 1,68), 26 % (haut risque, 2,97). Récidive à 3 ans : 15 % contre 8 % pour les critères scanner et génétique de haut risque (rapport de risque de 2,22).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30006-1" target="_blank" rel="noopener">Rodrigues et coll., 2018</a> ; <a href="https://doi.org/10.1016/S1474-4422(25)00285-6" target="_blank" rel="noopener">Rodrigues, Seiffge et coll., 2025</a>.</p></template>
<template data-pop="i68-lcr-syph" data-title="TPHA ou TPPA du liquide cérébrospinal : lecture">
<div class="lab">Principe</div><p>Le test tréponémique du liquide (TPHA ou TPPA) cherche la trace de l’agent de la syphilis dans le liquide ; le VDRL est un test non tréponémique.</p>
<div class="lab">Lecture</div><p>Un TPHA du liquide négatif rend la neurosyphilis très improbable. Le VDRL du liquide n’est positif que dans environ un tiers des cas : un résultat négatif n’exclut pas la maladie. Il baisse de 3 à 4 dilutions la première année après traitement.</p>
<div class="lab">Piège</div><p>Les marqueurs tréponémiques sériques restent positifs à vie et ne servent pas au suivi.</p>
<p class="src">Références : <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">IUSTI Europe, 2020</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande, 2020</a>.</p></template>
<template data-pop="i68-hsa" data-title="Hémorragie sous-arachnoïdienne de la convexité : conduite">
<div class="lab">Fréquence</div><p>L’angiopathie amyloïde explique environ un quart à un tiers des hémorragies de la convexité non traumatiques, et environ 76 % après 60 ans.</p>
<div class="lab">Conduite</div><p>Suspendre les antithrombotiques au moins 24 à 48 heures ; une pression artérielle systolique inférieure à 140 mmHg est raisonnable en phase aiguë.</p>
<div class="lab">Limite</div><p>Ces indications proviennent d’une revue, non d’une recommandation formelle. Le risque d’hémorragie lobaire symptomatique est d’environ 19 % par an.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8356377/" target="_blank" rel="noopener">Smith et coll., Neurology, 2021</a>.</p></template>
<template data-pop="i68-chir" data-title="Chirurgie mini-invasive de l’hématome : essai ENRICH">
<div class="lab">Recommandation</div><p>La recommandation européenne de 2025 suggère la chirurgie mini-invasive pour réduire la mortalité (niveau faible, recommandation faible).</p>
<div class="lab">Portée</div><p>Le bénéfice est attribuable aux hémorragies lobaires, d’après l’essai ENRICH.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356" target="_blank" rel="noopener">Steiner et coll., 2025</a>.</p></template>
<template data-pop="i68-tension" data-title="Cible tensionnelle : essais SPRINT-MIND et ERICH">
<div class="lab">Cibles</div><p>La revue suisse recommande moins de 130/80 mmHg, voire moins de 120/80 selon SPRINT-MIND, à confirmer. La recommandation européenne de 2025 retient 130/80 mmHg ou moins après une hémorragie (qualité faible) et recommande le contrôle tensionnel (recommandation forte).</p>
<div class="lab">Preuve</div><p>Dans la cohorte ERICH, un contrôle insuffisant s’associe à plus de récidives d’hémorragie lobaire (rapport de risque de 3,53).</p>
<div class="lab">Limite</div><p>Association, non causalité démontrée ; le chiffre de 120/80 reste à confirmer.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:176273" target="_blank" rel="noopener">Revue Médicale Suisse 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356" target="_blank" rel="noopener">Steiner et coll., 2025</a>.</p></template>
<template data-pop="i68-oac" data-title="Anticoagulation orale après hémorragie : recommandation européenne 2025">
<div class="lab">Recommandation</div><p>Un anticoagulant oral direct « peut être envisagé » après évaluation individuelle (qualité faible). Les anticoagulants directs sont préférés aux antivitamines K.</p>
<div class="lab">Bilan</div><p>L’anticoagulation augmente les récidives d’hémorragie (odds ratio de 3,62) mais diminue les événements cardiovasculaires majeurs (0,64).</p>
<div class="lab">Raisons d’éviter</div><p>Angiopathie avec sidérose superficielle ou hémorragie de convexité non anévrismale ; angiopathie avec au moins cinq microsaignements lobaires ; hémorragie non liée à l’angiopathie avec au moins dix microsaignements ; hypertension non contrôlée.</p>
<div class="lab">Limite</div><p>L’essai ENRICH-AF a arrêté le recrutement des hémorragies lobaires et de convexité pour excès de récidives ; les données ne sont pas publiées.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356" target="_blank" rel="noopener">Steiner et coll., 2025</a>.</p></template>
<template data-pop="i68-laa" data-title="Fermeture de l’auricule gauche : indication et niveau de preuve">
<div class="lab">Indication</div><p>Elle peut être envisagée chez les patients inaptes à une anticoagulation prolongée, notamment avec une angiopathie prouvée par l’imagerie ou l’anatomopathologie.</p>
<div class="lab">Preuve</div><p>Qualité très faible ; les antithrombotiques autour de la procédure suivent la Société européenne de cardiologie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356" target="_blank" rel="noopener">Steiner et coll., 2025</a>.</p></template>
<template data-pop="i68-antiagr" data-title="Antiagrégants plaquettaires : essai RESTART">
<div class="lab">Résultat</div><p>Dans l’essai RESTART (537 patients), la reprise d’un antiagrégant est jugée sûre pour une indication reconnue, mais les effets globaux restent incertains (qualité modérée, recommandation faible).</p>
<div class="lab">Chiffres</div><p>Récidive d’hémorragie de 4 % contre 9 % (odds ratio de 0,50 ; intervalle de confiance de 0,24 à 1,03). L’intervalle inclut 1 : la différence n’est pas formellement démontrée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356" target="_blank" rel="noopener">Steiner et coll., 2025</a>.</p></template>
<template data-pop="i68-statines" data-title="Statines : incertitude et avis d’experts">
<div class="lab">État des preuves</div><p>La recommandation européenne de 2025 conclut à une incertitude.</p>
<div class="lab">Avis d’experts</div><p>Les débuter en cas d’indication et de haut risque cardiovasculaire, après balance individuelle. L’essai SATURN, sur l’hémorragie lobaire, est en cours.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12098356" target="_blank" rel="noopener">Steiner et coll., 2025</a>.</p></template>
<template data-pop="i68-jarisch" data-title="Réaction de Jarisch-Herxheimer : fréquence et conduite">
<div class="lab">Définition</div><p>Réaction survenant à l’instauration du traitement antibiotique de la syphilis.</p>
<div class="lab">Fréquence et conduite</div><p>Elle survient dans 1 à 2 % des neurosyphilis. On la traite par anti-inflammatoire non stéroïdien, sans interrompre l’antibiotique ; les corticoïdes ne sont pas recommandés en routine.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur la neurosyphilis, 2020</a>.</p></template>
<template data-pop="i68-pen-neuro" data-title="Neurotoxicité de la pénicilline : seuils, vitesse et calcul">
<div class="lab">Seuils</div><p>La monographie suisse signale une neurotoxicité à partir de 40 à 60 millions d’unités par jour avec un rein normal, 20 millions en insuffisance rénale légère à modérée, 10 millions en insuffisance sévère. Le risque de convulsions s’accroît si la perfusion est trop rapide, en insuffisance rénale ou en cas d’épilepsie.</p>
<div class="lab">Calcul de la vitesse</div><p>Au-delà de 2 millions d’unités, l’injection est lente, à 0,5 million d’unités par minute au plus. Pour une dose de 6 millions, la durée minimale est donc 6 ÷ 0,5 = 12 minutes ; pour 10 millions, 10 ÷ 0,5 = 20 minutes.</p>
<div class="lab">Calcul du sodium</div><p>Un flacon de 10 millions d’unités contient 386 mg de sodium. Un schéma de 4 × 6 millions par jour, soit 24 millions, représente 24 ÷ 10 × 386 ≈ 926 mg de sodium par jour, à intégrer chez le patient qui doit limiter son apport.</p>
<div class="lab">Piège</div><p>Les doses des recommandations de neurosyphilis (jusqu’à 30 millions par jour) restent inférieures au seuil de 40 à 60 millions pour un rein normal, mais dépassent le seuil de 20 millions retenu en insuffisance rénale : la fonction rénale décide.</p>
<p class="src">Références : information professionnelle suisse Pénicilline Grünenthal, mai 2023, via AmiKo ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">recommandation allemande, 2020</a>. Les calculs sont des applications arithmétiques des chiffres cités.</p></template>
<template data-pop="i68-nimodipine" data-title="Méningite bactérienne et complications vasculaires : nimodipine et héparine">
<div class="lab">Thrombose veineuse sinusale</div><p>Héparine par voie intraveineuse à dose thérapeutique (consensus fort, recommandation 27).</p>
<div class="lab">Vasculopathie</div><p>La nimodipine, les corticoïdes ou les deux sont envisageables, avec une mesure artérielle invasive si la nimodipine est administrée par voie intraveineuse (recommandation 26).</p>
<div class="lab">Imagerie</div><p>Le Doppler transcrânien est envisageable comme dépistage chez les patients à risque d’ischémie par vasculopathie.</p>
<div class="lab">Limite</div><p>L’information professionnelle suisse de ces produits n’a pas été relue ici.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande sur la méningite bactérienne, 2023</a>.</p></template>
<template data-pop="i68-kisunla" data-title="Kisunla (donanemab) : indication, contre-indications et surveillance">
<div class="lab">Indication suisse</div><p>Trouble cognitif léger ou démence légère de type Alzheimer avec pathologie amyloïde prouvée, chez les porteurs hétérozygotes de l’allèle ε4 ou les non-porteurs. Génotypage de l’APOE avant traitement.</p>
<div class="lab">Contre-indications liées à l’angiopathie</div><p>Hémorragie antérieure de plus de 1 cm ; plus de 4 microhémorragies (1 cm au plus en T2 étoile) ; sidérose superficielle ; œdème ou images évoquant l’angiopathie inflammatoire ; plus de 2 infarctus lacunaires ou accident vasculaire de grand territoire ; Fazekas 3 ; accident vasculaire ou accident ischémique transitoire de moins d’un an ; hypertension mal contrôlée ; anticoagulants ; thrombolyse ; plaquettes inférieures à 50 000 ou INR supérieur à 1,5 sans anticoagulant.</p>
<div class="lab">Données</div><p>Anomalies d’imagerie dans 33 % sous donanemab contre 13,5 % sous placebo (œdème 20,6 % ; dépôts d’hémosidérine 27,6 %) ; hémorragie de plus de 1 cm dans 0,4 % contre 0,3 % ; trois décès par anomalies graves (0,4 %). Incidence selon l’allèle ε4 : homozygotes 55,9 %, hétérozygotes 37,6 %, non-porteurs 24,7 %. Récidive après reprise : œdème 24,3 %, dépôts 35,9 %.</p>
<div class="lab">Surveillance et conduite</div><p>Résonance initiale de moins de 3 mois, puis avant les 2<sup>e</sup>, 3<sup>e</sup>, 4<sup>e</sup> et 7<sup>e</sup> perfusions, avec une résonance avant la 12<sup>e</sup> chez les patients à risque. Suspension jusqu’à résolution (œdème) ou stabilisation (dépôts) ; arrêt définitif si œdème grave, dépôts graves, hémorragie de plus de 1 cm ou récidives modérées à sévères. Les corticoïdes sont possibles pour l’œdème (efficacité non démontrée) ; l’aspirine et les antiagrégants concomitants sont admissibles. Résolution radiologique médiane de l’œdème : environ 8,3 semaines.</p>
<div class="lab">Grossesse et lacunes</div><p>Contre-indication sans contraception adéquate. Le lécanemab n’a pas été trouvé dans l’information professionnelle suisse consultée.</p>
<p class="src">Références : information professionnelle suisse de Kisunla, Eli Lilly (Suisse) SA, juillet 2025, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="i68-aciclovir" data-title="Aciclovir Labatec par voie intraveineuse : posologie et précautions">
<div class="lab">Posologie</div><p>Zona de l’immunodéprimé : 10 mg par kilogramme toutes les 8 heures pendant au moins 5 jours. Encéphalite herpétique : 10 mg par kilogramme toutes les 8 heures pendant 10 jours. La dose est réduite selon la clairance de la créatinine.</p>
<div class="lab">Précautions</div><p>Hydratation suffisante ; neurotoxicité et insuffisance rénale aiguë possibles.</p>
<div class="lab">Limite</div><p>La vasculopathie varicelle-zona n’est pas une indication listée : l’usage est hors indication, avec un niveau de preuve faible et une durée non standardisée.</p>
<p class="src">Références : information professionnelle suisse Aciclovir Labatec, décembre 2025, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="i68-penicilline" data-title="Pénicilline Grünenthal (benzylpénicilline) : posologie et neurotoxicité">
<div class="lab">Posologie</div><p>Infections graves comme la méningite : 20 à 60 millions d’unités par jour en 4 à 6 doses. Injection lente (0,5 million d’unités par minute au plus) au-delà de 2 millions.</p>
<div class="lab">Neurotoxicité</div><p>Dès 40 à 60 millions d’unités par jour avec un rein normal, 20 millions en insuffisance rénale légère à modérée, 10 millions en insuffisance sévère.</p>
<div class="lab">Sodium</div><p>Un flacon de 10 millions d’unités contient 386 mg de sodium.</p>
<div class="lab">Limite</div><p>La monographie ne donne pas le schéma de la neurosyphilis ; ce schéma vient de la recommandation allemande approuvée par la Société suisse de neurologie.</p>
<p class="src">Références : information professionnelle suisse Pénicilline « Grünenthal », mai 2023, lue via AmiKo, consultée le 15 octobre 2026.</p></template>
<template data-pop="i68-mnemo" data-title="Trois questions pour ne pas se tromper de cause (aide pédagogique)">
<p><b>Aide pédagogique, non critère officiel.</b></p>
<ol><li>Quelle est la maladie qui a atteint le vaisseau : amyloïde, infection, antiphospholipides ?</li><li>Le vaisseau a-t-il saigné ou s’est-il occlus, et où se trouve la lésion : surface corticale, base du crâne ?</li><li>Le médicament que je vais prescrire ou arrêter aggrave-t-il ce mécanisme ?</li></ol></template>
<template data-pop="pareto-i68-definition" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="i68-0,i68-1,i68-2"></p><ul><li>La catégorie est une manifestation : la maladie causale (amylose, infection, lupus) commande la conduite.</li><li>Hémorragie lobaire : angiopathie amyloïde dans 50 à 57 % des cas.</li><li>Pas de donnée suisse propre ; chiffres de revues internationales.</li></ul></template>
<template data-pop="pareto-i68-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="i68-3"></p><ul><li>Clairance périvasculaire altérée, dépôt dans la média et l’adventice, cercle entretenu.</li><li>Amyloïde : saignement ; infection : inflammation, spasme, thrombose ; antiphospholipides : thrombose.</li><li>Épisodes transitoires : dépolarisation envahissante à environ 3 mm par minute.</li></ul></template>
<template data-pop="pareto-i68-causes" data-title="Pareto — Causes et risque">
<p class="ratio" data-cover="i68-4"></p><ul><li>Amyloïde : âge, allèle ε4, forme iatrogène après 30 à 40 ans.</li><li>Syphilis : accident vasculaire du sujet jeune sans facteur de risque.</li><li>Lupus : antiphospholipides, au moins cinq fois plus de risque.</li></ul></template>
<template data-pop="pareto-i68-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i68-5,i68-6"></p><ul><li>Épisodes stéréotypés progressant de proche en proche : angiopathie, pas accident ischémique.</li><li>Aucun signe clinique spécifique : l’imagerie tranche.</li><li>Rechercher antécédents, anticoagulants, expositions sexuelles, zona, thromboses.</li></ul></template>
<template data-pop="pareto-i68-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="i68-7"></p><ul><li>Boston 2.0 : 50 ans ou plus ; deux lésions lobaires ou une lésion plus un marqueur de substance blanche ; aucune lésion profonde.</li><li>Écarter les autres causes de saignement.</li><li>Le diagnostic certain est anatomopathologique.</li></ul></template>
<template data-pop="pareto-i68-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="i68-8"></p><ul><li>Sous anticorps anti-amyloïdes : pas de thrombolyse ni d’anticoagulation.</li><li>Hémorragie de convexité : suspendre les antithrombotiques 24 à 48 heures.</li><li>Pénicilline à haute dose : convulsions, selon vitesse et fonction rénale.</li></ul></template>
<template data-pop="pareto-i68-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i68-9"></p><ul><li>Amyloïde : pression artérielle de 130/80 mmHg ou moins ; éviter les antithrombotiques inutiles.</li><li>Neurosyphilis : benzylpénicilline intraveineuse 10 à 14 jours.</li><li>Antiphospholipides : antivitamine K ; pas de rivaroxaban si triple positivité.</li></ul></template>
<template data-pop="pareto-i68-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="i68-10,i68-11"></p><ul><li>Récidive d’hémorragie à 5 ans : 12, 16 ou 26 % selon Édimbourg.</li><li>Sérologie tréponémique positive à vie : suivre le liquide, pas le sang.</li><li>Doxycycline et donanemab : contre-indiqués en grossesse.</li></ul></template>
<template data-pop="pareto-i68-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="i68-e-1,i68-e-2,i68-e-3,i68-e-4,i68-e-5,i68-e-6"></p><ul><li>Résonance en T2 étoile ou SWI pour l’amyloïde ; scanner et génotype APOE en alternative.</li><li>Neurosyphilis : le VDRL du liquide n’est positif que dans un tiers ; TPHA du liquide négatif exclut presque.</li><li>Surveillance par résonance sous donanemab avant les 2<sup>e</sup>, 3<sup>e</sup>, 4<sup>e</sup>, 7<sup>e</sup> et 12<sup>e</sup> perfusions.</li></ul></template>
<template data-pop="pareto-i68-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="i68-s-anat-cours"></p><ul><li>Surface corticale et leptoméninges : amyloïde, hémorragie lobaire.</li><li>Base du crâne, noyaux gris : méningite tuberculeuse.</li></ul></template>
<template data-pop="pareto-i68-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="i68-s-histo-cours"></p><ul><li>Dépôt dans la média et l’adventice.</li><li>Inflammation vasculaire plus amyloïde : forme certaine par biopsie, corticosensible.</li></ul></template>
<template data-pop="pareto-i68-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="i68-s-physio-cours"></p><ul><li>Clairance périvasculaire altérée : cercle auto-entretenu.</li><li>Épisodes transitoires : dépolarisation envahissante.</li></ul></template>
<template data-pop="pareto-i68-bioch" data-title="Pareto — Biochimie et génétique">
<p class="ratio" data-cover="i68-s-bioch-cours"></p><ul><li>Aβ à 40 acides aminés dans la paroi.</li><li>Allèle ε4 : anomalies d’imagerie 55,9, 37,6, 24,7 %.</li></ul></template>
<template data-pop="pareto-i68-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i68-p-1,i68-p-2,i68-p-3,i68-p-4"></p><ul><li>Le médicament dépend de la cause.</li><li>Pénicilline : seuils de neurotoxicité selon la fonction rénale.</li><li>Donanemab : contre-indiqué si anticoagulant, sidérose, plus de quatre microhémorragies.</li></ul></template>
