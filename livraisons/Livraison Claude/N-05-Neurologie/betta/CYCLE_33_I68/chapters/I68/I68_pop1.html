<template data-pop="i68-aac" data-title="Angiopathie amyloïde cérébrale : définition et place dans la catégorie">
<div class="lab">Définition</div><p>L’angiopathie amyloïde cérébrale est une maladie fréquente des petits vaisseaux, due au dépôt progressif de peptide amyloïde bêta dans la paroi des petits vaisseaux corticaux et leptoméningés. Elle se code I68.0 avec l’amylose comme maladie causale.</p>
<div class="lab">Mécanisme</div><p>Le dépôt fragilise la paroi : elle se rompt (hémorragie) ou s’occlut (micro-infarctus). La conséquence clinique est une hémorragie lobaire, des microsaignements, un déclin cognitif lent et des épisodes transitoires.</p>
<div class="lab">Limite</div><p>Elle ne se confond pas avec la maladie d’Alzheimer : moins de 50 % des angiopathies remplissent les critères anatomopathologiques d’Alzheimer.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:176273" target="_blank" rel="noopener">Revue Médicale Suisse 2023, Hôpitaux universitaires de Genève</a>.</p></template>
<template data-pop="i68-croix" data-title="Système croix-astérisque : principe du double code">
<div class="lab">Principe</div><p>La classification internationale code certaines maladies par deux codes. Le code croix (†) désigne la maladie causale, le code astérisque (*) la manifestation d’organe. Un code astérisque ne s’utilise jamais seul.</p>
<div class="lab">Application à la catégorie</div><p>Les troubles cérébrovasculaires au cours de maladies classées ailleurs sont le code astérisque ; la cause est l’amylose, la syphilis, la tuberculose, la listériose ou le lupus érythémateux disséminé, avec leur code croix.</p>
<div class="lab">Lacune</div><p>Le sous-code de l’amylose qui convient à l’angiopathie amyloïde et la règle du double codage avec les catégories d’hémorragie et d’infarctus ne sont pas précisés dans les sources lues.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, Institut fédéral allemand des médicaments</a> ; <a href="https://icd.who.int/browse10/2019/en/GetConcept?ConceptId=I68" target="_blank" rel="noopener">CIM-10, Organisation mondiale de la santé, 2019</a>.</p></template>
<template data-pop="i68-aacri" data-title="Angiopathie amyloïde cérébrale inflammatoire : définition et conduite">
<div class="lab">Définition</div><p>Sous-type rare et agressif de l’angiopathie amyloïde, attribué à une réaction immunitaire dirigée contre l’amyloïde vasculaire. Il est potentiellement réversible et sensible aux corticoïdes.</p>
<div class="lab">Présentation</div><p>Début aigu ou subaigu de céphalées, baisse de vigilance, troubles du comportement, déclin cognitif, crises ou signes focaux, typiquement à 40 ans ou plus. Elle peut simuler un accident ischémique.</p>
<div class="lab">Conduite</div><p>La corticothérapie empirique est le traitement de choix ; une immunosuppression empirique est défendue pour éviter la biopsie dans les formes probables. Les schémas viennent de séries de cas. Une amélioration spontanée est possible dans les formes légères.</p>
<div class="lab">Limite</div><p>Les critères ont été lus par l’intermédiaire d’une série de cas italienne ; leur formulation originale n’a pas été relue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9616779/" target="_blank" rel="noopener">Cancelloni et coll., Neurological Sciences, 2022</a> ; <a href="https://doi.org/10.12890/2023_003500" target="_blank" rel="noopener">Gaspar et coll., European Journal of Case Reports in Internal Medicine, 2023</a>.</p></template>
<template data-pop="i68-abeta" data-title="Peptide amyloïde bêta : formes courtes et longues">
<div class="lab">Définition</div><p>Le peptide amyloïde bêta, noté Aβ, est un peptide que le cerveau doit éliminer en continu.</p>
<div class="lab">Formes</div><p>Dans l’angiopathie, c’est surtout la forme à quarante acides aminés (Aβ40) qui se dépose dans la paroi des vaisseaux, avec des espèces plus courtes que dans les plaques de la maladie d’Alzheimer.</p>
<div class="lab">Limite</div><p>Les sources lues ne détaillent pas la production du peptide ; ce point n’est pas développé ici.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:176273" target="_blank" rel="noopener">Revue Médicale Suisse 2023</a>.</p></template>
<template data-pop="i68-clairance" data-title="Clairance périvasculaire : principe et boucle auto-entretenue">
<div class="lab">Normal</div><p>Une partie du peptide amyloïde bêta est éliminée du cerveau le long des espaces entourant les vaisseaux.</p>
<div class="lab">Pathologique</div><p>Si cette voie est altérée, le peptide s’accumule dans la paroi vasculaire. L’accumulation réduit à son tour la clairance, ce qui augmente le dépôt : le cercle est entretenu par sa propre conséquence.</p>
<div class="lab">Conséquence</div><p>La progression est continue ; aucun traitement spécifique ne rompt aujourd’hui ce cercle selon les sources lues.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:176273" target="_blank" rel="noopener">Revue Médicale Suisse 2023</a>.</p></template>
<template data-pop="i68-dec" data-title="Dépolarisation corticale envahissante : principe et cinétique">
<div class="lab">Définition</div><p>C’est une vague d’inactivité neuronale qui se propage à la surface du cortex à environ 3 millimètres par minute.</p>
<div class="lab">Rôle proposé</div><p>Un saignement superficiel (hémorragie sous-arachnoïdienne de la convexité, sidérose superficielle) la déclenche. Elle explique que les symptômes des épisodes transitoires progressent « en marche », par exemple de la main au bras puis au visage.</p>
<div class="lab">Limite</div><p>Il s’agit du mécanisme probable ; la preuve directe manque.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8356377/" target="_blank" rel="noopener">Smith et coll., Neurology, 2021</a>.</p></template>
<template data-pop="i68-enft" data-title="Épisodes neurologiques focaux transitoires : définition et pièges">
<div class="lab">Définition</div><p>Ce sont des épisodes brefs, récidivants et stéréotypés de symptômes neurologiques focaux, qui s’étendent de proche en proche et sont attribués à l’angiopathie amyloïde. Ils sont la présentation la plus fréquente après l’hémorragie lobaire (14,5 % d’une cohorte européenne de 172 patients).</p>
<div class="lab">Caractères</div><p>Durée inférieure à 6 minutes dans 44 % des cas, inférieure à 30 minutes dans 70 %, de 3 heures au plus dans 96 %. Les symptômes positifs (paresthésies de la bouche ou de la main, 32 %) ou négatifs (faiblesse, dysphasie) existent ; 25 % sont mixtes.</p>
<div class="lab">Pièges</div><p>L’épisode peut être pris pour un accident ischémique transitoire, une aura migraineuse ou une crise focale. L’électroencéphalogramme de routine ne montre pas d’activité épileptiforme dans ces épisodes. Les antithrombotiques peuvent être dangereux. Environ 1 % des suspicions d’accident ischémique transitoire pourraient relever de l’angiopathie.</p>
<div class="lab">Pronostic</div><p>24,5 % d’hémorragie intracérébrale symptomatique à 8 semaines (méta-analyse).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8356377/" target="_blank" rel="noopener">Smith et coll., Neurology, 2021</a>.</p></template>
<template data-pop="i68-iatro" data-title="Angiopathie amyloïde iatrogène : mécanisme et délai">
<div class="lab">Définition</div><p>Forme rapportée après une intervention exposant à une transmission du peptide amyloïde : dure-mère cadavérique, instrumentation cérébrale ou médullaire.</p>
<div class="lab">Délai</div><p>La latence habituelle est de trois à quatre décennies. Une série de cinq cas a concerné des personnes de 65 ans ou plus, avec une latence de 30 à 39 ans.</p>
<div class="lab">Piège</div><p>Chez le sujet âgé, la forme est difficile à distinguer de la forme sporadique ; l’anamnèse recherche une neurochirurgie dans l’enfance.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/ene.16278" target="_blank" rel="noopener">Panteleienko et coll., European Journal of Neurology, 2024</a>.</p></template>
<template data-pop="i68-microsaignement" data-title="Microsaignements : aspect et signification">
<div class="lab">Définition</div><p>Ce sont de petits foyers d’hémosidérine visibles en T2 étoile ou SWI, de 10 mm au plus.</p>
<div class="lab">Signification</div><p>Les microsaignements strictement lobaires comptent parmi les lésions hémorragiques des critères de Boston. Ils produisent un déclin cognitif à bas bruit. Leur nombre intervient dans la décision d’anticoagulation et dans les contre-indications des anticorps anti-amyloïdes (plus de quatre).</p>
<div class="lab">Piège</div><p>Les microsaignements profonds ne sont pas ceux de l’angiopathie amyloïde et excluent les critères de Boston.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(22)00208-3" target="_blank" rel="noopener">Charidimou et coll., The Lancet Neurology, 2022</a>.</p></template>
<template data-pop="i68-aria" data-title="Anomalies d’imagerie liées à l’amyloïde : œdème et dépôts d’hémosidérine">
<div class="lab">Définition</div><p>Les anomalies d’imagerie liées à l’amyloïde (en anglais ARIA) surviennent sous anticorps dirigés contre l’amyloïde. Deux types existent : l’œdème ou l’effusion (ARIA-E) et l’hémorragie ou les dépôts d’hémosidérine (ARIA-H, microhémorragies de 10 mm au plus et sidérose superficielle).</p>
<div class="lab">Risque</div><p>L’angiopathie amyloïde concomitante augmente le risque. Elles sont le plus souvent asymptomatiques ; les symptômes sont céphalées, confusion, nausées, vomissements, vertiges, tremblement, troubles visuels et du langage, baisse de vigilance, crises. Elles surviennent surtout dans les 24 premières semaines.</p>
<div class="lab">Piège</div><p>Une anomalie symptomatique peut imiter un accident ischémique ; la thrombolyse est alors contre-indiquée.</p>
<p class="src">Références : information professionnelle suisse de Kisunla, juillet 2025, via AmiKo.</p></template>
<template data-pop="i68-apoe" data-title="APOE : rôle dans l’hémorragie et les anomalies d’imagerie">
<div class="lab">Définition</div><p>L’allèle ε4 du gène de l’apolipoprotéine E (APOE) est associé à l’hémorragie lobaire liée à l’angiopathie amyloïde.</p>
<div class="lab">Applications</div><p>L’allèle intervient dans les critères d’Édimbourg (portage de l’allèle ε4) et dans le risque des anticorps anti-amyloïdes : incidence des anomalies d’imagerie de 55,9 % chez les homozygotes ε4, 37,6 % chez les hétérozygotes et 24,7 % chez les non-porteurs. Le génotypage précède le traitement.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(18)30006-1" target="_blank" rel="noopener">Rodrigues et coll., The Lancet Neurology, 2018</a> ; information professionnelle suisse de Kisunla, via AmiKo.</p></template>
<template data-pop="i68-tb" data-title="Artérite de la méningite tuberculeuse : territoires et mécanismes">
<div class="lab">Mécanisme</div><p>Les vaisseaux sont pris dans l’exsudat de la base du crâne et étirés par l’hydrocéphalie. Le facteur de nécrose tumorale alpha, le facteur de croissance de l’endothélium vasculaire, des métalloprotéinases et un état prothrombotique sont évoqués.</p>
<div class="lab">Territoires</div><p>Infarctus multiples et bilatéraux de la « zone tuberculeuse » (noyau caudé, thalamus antérieur, bras antérieur et genou de la capsule interne) ; segments proximaux des artères cérébrales moyenne, antérieure et postérieure, carotide supraclinoïdienne, tronc basilaire.</p>
<div class="lab">Fréquence et traitement</div><p>Accident vasculaire chez 15 à 57 % des patients, souvent asymptomatique, surtout aux stades avancés. Les corticoïdes et les antituberculeux réduiraient mortalité et morbidité ; leur effet sur les accidents vasculaires n’est pas prouvé, et l’aspirine réduirait la mortalité.</p>
<div class="lab">Limite</div><p>Source : revue indienne de 2011 lue en résumé ; schémas thérapeutiques suisses non relus ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.jns.2010.12.015" target="_blank" rel="noopener">Misra et coll., Journal of the Neurological Sciences, 2011</a>.</p></template>
<template data-pop="i68-syph" data-title="Syphilis méningovasculaire : délai et mécanisme">
<div class="lab">Définition</div><p>Atteinte à la fois vasculaire et méningée de la neurosyphilis ; c’est l’une de ses manifestations les plus fréquentes.</p>
<div class="lab">Délai</div><p>Elle survient quelques mois ou plusieurs années après l’infection ; les auteurs la classent en neurosyphilis précoce, tardive ou les deux.</p>
<div class="lab">Terrain</div><p>Accident vasculaire du sujet jeune, surtout de l’homme, sans profil de risque vasculaire.</p>
<div class="lab">Lacune</div><p>L’histologie de l’endartérite et l’imagerie spécifique ne sont pas décrites dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7669305/" target="_blank" rel="noopener">Recommandation allemande sur la neurosyphilis, 2020</a> ; <a href="https://iusti.org/wp-content/uploads/2020/07/Syphilis2020guideline.pdf" target="_blank" rel="noopener">Recommandation européenne sur la syphilis, 2020</a>.</p></template>
<template data-pop="i68-vzv" data-title="Vasculopathie du virus varicelle-zona : mécanisme et niveau de preuve">
<div class="lab">Mécanisme</div><p>Le virus latent des ganglions sensitifs se réactive, provoque une vasculite cérébrale, puis une ischémie, chez l’enfant comme chez l’adulte. L’immunodéprimé a des lésions multifocales.</p>
<div class="lab">Facteurs de risque</div><p>Infection récente par le virus ; moins de 200 lymphocytes CD4 par microlitre au cours de l’infection par le VIH ; varicelle chez l’enfant non vacciné.</p>
<div class="lab">Limite</div><p>Les sources sont des cas cliniques et des revues de cas (niveau faible). Aucune recommandation européenne n’a été trouvée, et le rattachement à la rubrique des artérites infectieuses n’est pas explicite dans la classification lue.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.idcr.2018.e00483" target="_blank" rel="noopener">Guedes et coll., IDCases, 2019</a> ; <a href="https://doi.org/10.1186/s12981-023-00547-7" target="_blank" rel="noopener">Ishikawa et coll., AIDS Research and Therapy, 2023</a> ; <a href="https://doi.org/10.1007/s10072-025-08550-8" target="_blank" rel="noopener">Tomkiewicz et coll., Neurological Sciences, 2025</a>.</p></template>
<template data-pop="i68-aps" data-title="Anticorps antiphospholipides : rôle et conséquences">
<div class="lab">Définition</div><p>Anticorps associés au syndrome des antiphospholipides ; ils multiplient au moins par cinq le risque cérébrovasculaire au cours du lupus.</p>
<div class="lab">Mécanisme</div><p>La maladie cérébrovasculaire thrombotique du lupus leur est surtout liée.</p>
<div class="lab">Conséquence</div><p>Un antiagrégant ou un anticoagulant est envisagé si la manifestation est liée aux antiphospholipides ; les corticoïdes et immunosuppresseurs sont réservés à un processus inflammatoire ou à une activité lupique généralisée.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/ard.2010.130476" target="_blank" rel="noopener">Bertsias et coll., Annals of the Rheumatic Diseases, 2010</a> ; <a href="https://doi.org/10.1136/annrheumdis-2019-215213" target="_blank" rel="noopener">Tektonidou et coll., 2019</a>.</p></template>
<template data-pop="i68-mening" data-title="Listériose et méningite bactérienne : complications vasculaires">
<div class="lab">Listeria</div><p>Elle est à évoquer en troisième position après le pneumocoque et le méningocoque dans la méningite communautaire de l’adulte en Europe. Terrain : âge, cancer, immunosuppression.</p>
<div class="lab">Complications</div><p>Dans 15 à 40 % des méningites bactériennes de l’adulte : vasculite, vasospasme, hyperperfusion corticale focale, autorégulation altérée, thrombose septique sinusale et veineuse corticale.</p>
<div class="lab">Limite</div><p>La fréquence chiffrée de la listériose n’a pas été relevée ; la recommandation de la Société européenne de microbiologie clinique (ESCMID, 2016) était inaccessible.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10470134/" target="_blank" rel="noopener">Recommandation allemande sur la méningite bactérienne, 2023</a>.</p></template>
<template data-pop="i68-atcd" data-title="Antécédents et expositions à rechercher">
<div class="lab">Amyloïde</div><p>Âge de 50 ans ou plus ; hémorragie lobaire ; déclin cognitif ; neurochirurgie dans l’enfance.</p>
<div class="lab">Infections</div><p>Exposition sexuelle ; syphilis secondaire ; zona ou varicelle récents ; fièvre et terrain de listériose.</p>
<div class="lab">Lupus</div><p>Thromboses ou fausses couches (antiphospholipides).</p>
<div class="lab">Traitements</div><p>Anticoagulants, antiagrégants, anticorps anti-amyloïdes : ils décident de la conduite.</p></template>
<template data-pop="i68-irm" data-title="Séquences T2 étoile et SWI : principe et lecture">
<div class="lab">Principe</div><p>Ces séquences sont sensibles au fer de l’hémosidérine et révèlent des saignements anciens que le scanner ne montre pas.</p>
<div class="lab">Lecture</div><p>Elles détectent les microsaignements lobaires et la sidérose superficielle corticale. La séquence FLAIR montre les hypersignaux de substance blanche.</p>
<div class="lab">Piège</div><p>Elles décrivent un profil : la probabilité diagnostique vient des critères de Boston.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:176273" target="_blank" rel="noopener">Revue Médicale Suisse 2023</a> ; <a href="https://doi.org/10.1016/S1474-4422(22)00208-3" target="_blank" rel="noopener">Charidimou et coll., 2022</a>.</p></template>
<template data-pop="i68-ssc" data-title="Sidérose superficielle isolée : valeur diagnostique">
<div class="lab">Valeur</div><p>Une sidérose superficielle corticale isolée, dans un contexte suspect, est fortement évocatrice d’angiopathie amyloïde : rapport de cotes de 36,5 (intervalle de confiance à 95 % de 8,7 à 153,9).</p>
<div class="lab">Limite</div><p>Cette valeur s’applique à un contexte clinique évocateur ; elle est issue de la revue suisse de 2023.</p>
<p class="src">Références : <a href="https://archive-ouverte.unige.ch/unige:176273" target="_blank" rel="noopener">Revue Médicale Suisse 2023</a>.</p></template>
<template data-pop="i68-multispot" data-title="Hypersignaux multispot et espaces périvasculaires : seuils">
<div class="lab">Définition</div><p>Les hypersignaux « multispot » sont de petits points d’hypersignal FLAIR de la substance blanche sous-corticale. Les espaces périvasculaires du centre semi-ovale sont les espaces entourant les vaisseaux.</p>
<div class="lab">Seuils des critères de Boston 2.0</div><p>Plus de 20 espaces périvasculaires sévères dans un hémisphère ; plus de 10 points multispot sous-corticaux bilatéraux.</p>
<div class="lab">Rôle</div><p>Ils comptent comme caractéristiques de substance blanche, en association avec une lésion hémorragique lobaire.</p>
<p class="src">Références : <a href="https://radiopaedia.org/articles/boston-criteria-20-for-cerebral-amyloid-angiopathy" target="_blank" rel="noopener">Radiopaedia, critères de Boston 2.0</a> (source secondaire).</p></template>
