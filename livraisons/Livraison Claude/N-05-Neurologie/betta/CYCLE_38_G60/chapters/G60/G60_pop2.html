<template data-pop="g60-neupsig" data-title="NeuPSIG 2025 : lignes de traitement de la douleur neuropathique">
<div class="lab">Contenu</div><p>Première ligne, recommandation forte : tricycliques (NNT 4,6 ; NNH 17,1), ligands α2δ (NNT 8,9 ; NNH 26,2), inhibiteurs de la recapture de la sérotonine et de la noradrénaline (NNT 7,4 ; NNH 13,9). Deuxième ligne, recommandation faible : capsaïcine 8 %, capsaïcine crème, lidocaïne 5 %. Troisième ligne, recommandation faible : toxine botulique A, stimulation magnétique transcrânienne répétée, opioïdes.</p>
<div class="lab">Lecture</div><p>Le NNT est le nombre de patients à traiter pour qu’un répondeur supplémentaire apparaisse ; le NNH, pour qu’un effet indésirable supplémentaire apparaisse. Un NNT bas et un NNH élevé sont favorables.</p>
<div class="lab">Limite</div><p>La revue est lue en résumé ; la majorité des auteurs et la méthode relèvent d’un groupe international. Elle ne remplace pas les informations professionnelles suisses.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(25)00068-7" target="_blank" rel="noopener" data-reference-source="1">Soliman et al. (NeuPSIG), pharmacothérapie de la douleur neuropathique, 2025</a> ; <a href="https://doi.org/10.1024/0040-5930/a001191" target="_blank" rel="noopener" data-reference-source="1">Reisig et Harnik, Ther Umsch 2020</a>.</p>
</template>
<template data-pop="g60-pregabaline" data-title="Prégabaline (Lyrica®) : posologie et précautions">
<div class="lab">Indication suisse</div><p>Douleurs neuropathiques périphériques et centrales de l’adulte (information professionnelle de juillet 2026).</p>
<div class="lab">Posologie</div><p>150 mg/j en 2–3 prises ; 300 mg/j après 3–7 jours ; maximum 600 mg/j après 7 jours supplémentaires. Clairance de la créatinine 30–60 ml/min : 75 à 300 mg/j ; ne pas utiliser si la clairance est inférieure à 30 ml/min.</p>
<div class="lab">Précautions</div><p>Prudence en insuffisance cardiaque en raison d’œdèmes.</p>
<p class="src">Références : Information professionnelle suisse Lyrica® (prégabaline), juillet 2026.</p>
</template>
<template data-pop="g60-gabapentine" data-title="Gabapentine (Neurontin®) : posologie et indication">
<div class="lab">Indication suisse</div><p>Neuropathie diabétique et névralgie postherpétique (information professionnelle d’avril 2025). Son usage dans la CMT est hors indication suisse, bien que recommandé par le guide espagnol.</p>
<div class="lab">Posologie</div><p>jour 1 : 300 mg, jour 2 : 600 mg, jour 3 : 900 mg/j en trois prises ; entretien 900–3600 mg/j. Non recommandée chez l’enfant pour cette indication.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; Information professionnelle suisse Neurontin® (gabapentine), avril 2025.</p>
</template>
<template data-pop="g60-amitriptyline" data-title="Amitriptyline (Saroten®) : posologie et contre-indications">
<div class="lab">Indication et posologie</div><p>Douleurs neuropathiques de l’adulte (information professionnelle d’octobre 2022). Début à 10–25 mg le soir, augmentation de 10–25 mg tous les 3 à 7 jours ; 25–75 mg/j ; au-delà de 100 mg avec précaution.</p>
<div class="lab">Contre-indications</div><p>Infarctus récent, bloc ou trouble du rythme, insuffisance coronarienne, inhibiteurs de la monoamine-oxydase, hépatopathie sévère.</p>
<p class="src">Références : Information professionnelle suisse Saroten® (amitriptyline), octobre 2022.</p>
</template>
<template data-pop="g60-duloxetine" data-title="Duloxétine : indication suisse et usage dans la CMT">
<div class="lab">Indication suisse</div><p>Douleur neuropathique diabétique, 60 mg une fois par jour (Duloxétine NOBEL, information de décembre 2024). Son usage dans la CMT est hors indication suisse, bien que recommandé par le guide espagnol.</p>
<div class="lab">Limite</div><p>L’information professionnelle du Cymbalta® n’a pas été retrouvée ; un générique a été lu à sa place.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; Information professionnelle suisse Duloxétine NOBEL, décembre 2024.</p>
</template>
<template data-pop="g60-hors-indication" data-title="Usage hors indication">
<div class="lab">Contenu</div><p>La gabapentine et la duloxétine sont recommandées par le guide espagnol (et la revue NeuPSIG) pour la douleur neuropathique, mais l’indication suisse de la gabapentine est la neuropathie diabétique et la névralgie postherpétique, celle de la duloxétine la douleur neuropathique diabétique.</p>
<div class="lab">Arbitrage</div><p>Pour un contentieux entre recommandation étrangère et indication suisse, la source primaire applicable la plus récente est présentée, et le prescripteur informe le patient du caractère hors indication, avec la raison du choix.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1016/S1474-4422(25)00068-7" target="_blank" rel="noopener" data-reference-source="1">Soliman et al. (NeuPSIG), pharmacothérapie de la douleur neuropathique, 2025</a> ; Information professionnelle suisse Neurontin® (gabapentine), avril 2025 ; Information professionnelle suisse Duloxétine NOBEL, décembre 2024.</p>
</template>
<template data-pop="pareto-g60-definition" data-title="Pareto — Définition, classification et épidémiologie">
<p class="ratio" data-cover="g60-0,g60-1,g60-2"></p><ul><li>La CMT (G60.0) est la neuropathie héréditaire la plus fréquente, environ 1/2500.</li><li>Une vitesse motrice inférieure à 38 m/s définit une forme démyélinisante ; supérieure à 38 m/s, axonale.</li><li>CMT1A (duplication de PMP22) : 40–50 % des CMT ; CMTX1 : 7–12 % ; CMT1B : environ 8 %.</li><li>G60.1 Refsum, G60.2 ataxies, G60.3 CIAP, G60.8 neuropathies sensitives : entités distinctes.</li><li>Histoire familiale négative n’exclut rien ; aucune donnée suisse.</li></ul>
</template>
<template data-pop="pareto-g60-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g60-3"></p><ul><li>Myéline (PMP22, MPZ, GJB1) ou axone (MFN2) : voie commune de perte axonale longueur-dépendante.</li><li>HNPP : délétion de PMP22, tomacula, bloc de conduction à la compression.</li><li>Refsum : déficit d’alpha-oxydation, stock adipeux d’acide phytanique mobilisé par le jeûne.</li><li>Pied creux : dénervation commencée dans l’enfance.</li></ul>
</template>
<template data-pop="pareto-g60-causes" data-title="Pareto — Causes et facteurs aggravants">
<p class="ratio" data-cover="g60-4"></p><ul><li>G60.0 gènes PMP22, MPZ, GJB1, MFN2 ; G60.1 PHYH ou PEX7 ; G60.2 ataxies (CANVAS, RFC1) ; G60.3 diagnostic d’exclusion.</li><li>Facteurs évitables : vincristine et paclitaxel, compression (HNPP), jeûne (Refsum).</li><li>La grossesse aggrave les symptômes chez environ un tiers des patientes CMT.</li></ul>
</template>
<template data-pop="pareto-g60-anamnese" data-title="Pareto — Anamnèse">
<p class="ratio" data-cover="g60-5"></p><ul><li>Début dans la première ou la deuxième décennie ; évolution lente.</li><li>Arbre généalogique sur trois générations.</li><li>Crampes jusqu’à 85 %, douleur 23–85 %.</li><li>HNPP : mononeuropathies indolores déclenchées par compression ; Refsum : cécité nocturne, anosmie, surdité.</li></ul>
</template>
<template data-pop="pareto-g60-clinique" data-title="Pareto — Examen clinique">
<p class="ratio" data-cover="g60-6"></p><ul><li>Faiblesse distale, pieds creux, orteils en griffe, atrophie en bouteille de champagne inversée, aréflexie.</li><li>Nerfs hypertrophiés : relativement spécifique de la CMT1A.</li><li>Refsum : neuropathie axonale (71 %), ichtyose (43 %), anomalies osseuses.</li></ul>
</template>
<template data-pop="pareto-g60-diagnostic" data-title="Pareto — Démarche diagnostique">
<p class="ratio" data-cover="g60-7"></p><ul><li>ENMG d’abord ; vitesse inférieure à 38 m/s : recherche de PMP22 ; sinon panel puis étape 3.</li><li>Exclure la PIDC, l’amylose à transthyrétine et les causes acquises.</li><li>Conseil génétique avant et après le test.</li></ul>
</template>
<template data-pop="pareto-g60-urgences" data-title="Pareto — Urgences">
<p class="ratio" data-cover="g60-8"></p><ul><li>Refsum : décompensation par jeûne ou infection, acide phytanique souvent supérieur à 500 µmol/l ; glucose intraveineux, monitorage cardiaque.</li><li>Vincristine, paclitaxel : risque élevé, ne pas refuser un traitement efficace.</li><li>HNPP : lever la compression.</li></ul>
</template>
<template data-pop="pareto-g60-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g60-9"></p><ul><li>Aucun traitement modificateur prouvé dans la CMT.</li><li>Équipe multidisciplinaire, orthèses, chirurgie du pied structuré.</li><li>Refsum : régime inférieur à 10 mg d’acide phytanique par jour, à vie.</li><li>HNPP : protection des sites ; CIAP : symptomatique.</li></ul>
</template>
<template data-pop="pareto-g60-suivi" data-title="Pareto — Suivi et situations particulières">
<p class="ratio" data-cover="g60-10,g60-11"></p><ul><li>Suivi annuel avec MRC, CMTNS et CMTES ; pas d’ENMG de routine.</li><li>Prévention : conseil génétique, éviter neurotoxiques, pas de jeûne dans le Refsum.</li><li>Grossesse : un tiers aggravent ; prégabaline interdite si ClCr inférieure à 30 ml/min.</li></ul>
</template>
<template data-pop="pareto-g60-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g60-e-1,g60-e-2,g60-e-3,g60-e-4"></p><ul><li>ENMG : seuil de 38 m/s ; axonal = amplitudes basses.</li><li>Génétique en trois étapes (PMP22, panel, étape 3), classification ACMG en cinq classes.</li><li>Échographie nerveuse et ponction lombaire pour la PIDC ; biopsie exceptionnelle.</li><li>Refsum : acide phytanique et acide pristanique.</li></ul>
</template>
<template data-pop="pareto-g60-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g60-s-anat-cours"></p><ul><li>Les fibres longues sont atteintes d’abord : pieds, puis mains.</li><li>HNPP : sites d’enclavement (fibulaire, ulnaire, plexus brachial, radial, médian).</li><li>Pied creux : tibial postérieur, fibulaires, extenseur des orteils.</li></ul>
</template>
<template data-pop="pareto-g60-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g60-s-histo-cours"></p><ul><li>CMT1A : démyélinisation avec bulbes d’oignon.</li><li>HNPP : tomacula.</li><li>Refsum : pas de bulbes d’oignon.</li></ul>
</template>
<template data-pop="pareto-g60-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g60-s-physio-cours"></p><ul><li>Vitesse = myéline ; amplitude = axone ; seuil 38 m/s.</li><li>CMT1A : environ 21 m/s ; formes sévères 4–15 m/s.</li><li>HNPP : bloc de conduction plus rapide, récupération plus lente.</li></ul>
</template>
<template data-pop="pareto-g60-bioch" data-title="Pareto — Biochimie et génétique">
<p class="ratio" data-cover="g60-s-bioch-cours"></p><ul><li>Duplication de 1,4 Mb de PMP22 : CMT1A ; délétion 17p11.2-p12 : HNPP.</li><li>Refsum : PHYH/PEX7, alpha-oxydation peroxysomale, stock adipeux.</li><li>Transmission dominante, récessive ou liée à l’X ; néomutations au moins 10 % des CMT1A.</li></ul>
</template>
<template data-pop="pareto-g60-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g60-p-1,g60-p-2"></p><ul><li>Première ligne NeuPSIG : tricycliques, ligands α2δ, IRSN ; opioïdes à éviter dans la CMT.</li><li>Prégabaline : 150 à 600 mg/j, interdite si ClCr inférieure à 30 ml/min.</li><li>Amitriptyline : 25–75 mg/j ; contre-indications cardiaques.</li><li>Gabapentine et duloxétine : hors indication suisse dans la CMT.</li></ul>
</template>
<template data-pop="pareto-g60-pharma2" data-title="Pareto — Traitements spécifiques et limites">
<p class="ratio" data-cover="g60-p-3,g60-p-4"></p><ul><li>Vincristine et paclitaxel : risque élevé de neurotoxicité.</li><li>Seul traitement étiologique démontré : le régime du Refsum.</li><li>Essais : PXT3003, govorestat, silenceurs de PMP22 ; ASO et ARNi pour l’amylose TTR.</li></ul>
</template>
