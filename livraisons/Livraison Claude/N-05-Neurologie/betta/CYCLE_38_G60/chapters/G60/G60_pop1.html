<template data-pop="g60-cmt" data-title="Maladie de Charcot-Marie-Tooth">
<div class="lab">Définition</div><p>La CMT est la neuropathie héréditaire la plus fréquente. Elle associe une polyneuropathie longueur-dépendante, une faiblesse et une atrophie distales, des déformations du pied, une aréflexie et un déficit sensitif distal. Elle est classée en G60.0 de la CIM-10-GM 2024.</p>
<div class="lab">Mécanisme</div><p>Des variants de gènes de la myéline (PMP22, MPZ, GJB1) ou de l’axone (MFN2 et autres) aboutissent à une perte axonale progressive, qui corrèle avec le déficit.</p>
<div class="lab">Application</div><p>Le tableau est suspecté devant l’association évolution lente, pieds creux et faiblesse distale. La vitesse de conduction motrice la classe en démyélinisante ou axonale.</p>
<div class="lab">Limite</div><p>Une histoire familiale négative ne l’exclut pas : au moins 10 % des CMT1A sont des néomutations, et un test génétique négatif n’exclut pas la maladie, surtout axonale.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1038/s41572-025-00679-2" target="_blank" rel="noopener" data-reference-source="1">Burns et al., Nat Rev Dis Primers 2026</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-codes" data-title="Sous-codes G60 de la CIM-10-GM 2024">
<div class="lab">Contenu</div><p>G60.0 Neuropathie héréditaire motrice et sensorielle ; G60.1 Maladie de Refsum ; G60.2 Neuropathie associée à une ataxie héréditaire ; G60.3 Neuropathie progressive idiopathique ; G60.8 Autres neuropathies héréditaires et idiopathiques ; G60.9 Sans précision. La classification utilisée est celle du BfArM ; les intitulés français proviennent de l’Office fédéral de la statistique.</p>
<div class="lab">Limites</div><p>La HNPP n’est pas nommée dans les inclusions lues ; son rattachement n’est pas établi. Les maladies de Morvan, le syndrome de Nélaton et le syndrome de Roussy-Lévy sont nommés mais leur clinique n’est pas documentée dans le dossier. L’amylose héréditaire à transthyrétine n’est pas listée sous G60 sur la page lue : elle est traitée en diagnostic différentiel. Le catalogue du dépôt reste en CIM-10-GM 2024, la cartographie CIM-11 étant à établir.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, bloc G60–G64</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener" data-reference-source="1">OFS, CIM-10-GM 2024 (fr), G60</a>.</p>
</template>
<template data-pop="g60-seuil38" data-title="Seuil de 38 m/s et sous-types de CMT">
<div class="lab">Définition</div><p>Le guide espagnol 2024/2025 classe la CMT selon la vitesse de conduction motrice du membre supérieur : inférieure à 38 m/s pour les formes démyélinisantes (CMT1 dominante, CMT4 récessive), supérieure à 38 m/s pour les formes axonales (CMT2), 25–45 m/s au début puis 30–40 m/s pour les formes intermédiaires (souvent liées à l’X).</p>
<div class="lab">Raisonnement</div><p>La vitesse reflète l’état de la myéline ; l’amplitude reflète celui des axones. Le seuil choisit donc entre une atteinte de la gaine et une atteinte de l’axone, ce qui oriente la génétique.</p>
<div class="lab">Limite</div><p>Les formes intermédiaires occupent une zone de chevauchement. Dans la CMTX1, la vitesse est de 30–40 m/s chez l’homme et varie de 30 m/s à la normale chez la femme. L’asymétrie est plus fréquente dans la CMT2.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-dhmn" data-title="dHMN : neuronopathies motrices distales héréditaires">
<div class="lab">Définition</div><p>Les neuronopathies motrices distales héréditaires (dHMN) sont des neuropathies purement motrices distales génétiquement déterminées. Le guide espagnol dénombre 20 gènes de dHMN.</p>
<div class="lab">Lien avec la CMT</div><p>CMT2 et dHMN forment un continuum : un même gène, par exemple HSPB1, peut produire l’une ou l’autre. Les variants récessifs de SORD sont responsables de jusqu’à 10 % des CMT2 et des dHMN récessives.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-hsan" data-title="HSN et HSAN : neuropathies sensitives héréditaires">
<div class="lab">Contenu</div><p>Les neuropathies sensitives héréditaires (HSN) et sensitivo-autonomes (HSAN) comprennent 23 gènes dans le guide espagnol. La CIM-10-GM place à G60.8 la neuropathie sensitive à transmission dominante ou récessive.</p>
<div class="lab">Lacune</div><p>Aucune source lue ne décrit la clinique des HSAN (perte de la douleur, ulcérations, dysautonomie) : elle n’est pas détaillée ici. Leur présence dans le diagnostic différentiel est seule documentée.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, bloc G60–G64</a> ; <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-arbre" data-title="Arbre généalogique et histoire familiale négative">
<div class="lab">Technique</div><p>On dresse l’arbre sur au moins trois générations.</p>
<div class="lab">Limite</div><p>Une histoire négative n’exclut pas une neuropathie héréditaire : au moins 10 % des CMT1A sont des néomutations.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-pidc" data-title="PIDC : polyradiculonévrite inflammatoire démyélinisante chronique">
<div class="lab">Définition</div><p>La PIDC (chronic inflammatory demyelinating polyradiculoneuropathy, CIDP) est une neuropathie acquise d’origine immune, traitable. Elle est le principal diagnostic différentiel de la CMT démyélinisante.</p>
<div class="lab">Distinction</div><p>L’évolution est plutôt immune que lente et héréditaire. L’échographie montre des nerfs élargis dans les formes démyélinisantes, la ponction lombaire peut montrer une protéinorachie élevée (jusqu’à 100 mg/dl rapportée aussi dans la CMT), et le profil de conduction non homogène oriente vers une origine immune.</p>
<div class="lab">Piège</div><p>MPZ, GJB1, FIG4 et LITAF peuvent mimer une neuropathie acquise immune. La biopsie nerveuse n’est indiquée qu’en cas d’incertitude ou de suspicion d’une neuropathie traitable.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-cmt1a" data-title="CMT1A : duplication de PMP22">
<div class="lab">Mécanisme</div><p>Une duplication de 1,4 Mb incluant PMP22 surexprime la protéine et provoque une neuropathie démyélinisante ; la biopsie montre une démyélinisation avec bulbes d’oignon.</p>
<div class="lab">Fréquence et profil</div><p>Elle représente 40–50 % de toutes les CMT et 60–70 % des CMT1. La vitesse motrice moyenne est d’environ 21 m/s. Des nerfs hypertrophiés palpables sont un signe relativement spécifique.</p>
<div class="lab">Application</div><p>Une vitesse inférieure à 38 m/s déclenche la recherche de duplication ou de délétion de PMP22 (MLPA) en première étape.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-mpz" data-title="CMT1B : MPZ et maladie de Déjerine-Sottas">
<div class="lab">Mécanisme</div><p>La protéine zéro de la myéline (MPZ) est le constituant protéique majeur de la myéline périphérique. Les variants de MPZ expliquent environ 8 % des CMT (CMT1B).</p>
<div class="lab">Clinique</div><p>La maladie de Déjerine-Sottas, forme sévère à début précoce incluse en G60.0, peut être liée à MPZ. Les variants de MPZ peuvent aussi mimer une neuropathie acquise immune par une conduction non homogène.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, bloc G60–G64</a> ; <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-cmtx1" data-title="CMTX1 : GJB1 et connexine 32">
<div class="lab">Mécanisme</div><p>La perte de la connexine 32 (GJB1) dans les cellules de Schwann myélinisantes cause une neuropathie démyélinisante ; cette protéine forme des jonctions communicantes importantes pour l’équilibre de l’axone myélinisé.</p>
<div class="lab">Clinique</div><p>Les hommes sont plus atteints ; les vitesses sont de 30–40 m/s chez l’homme et varient de 30 m/s à la normale chez la femme. Les muscles thénariens sont prédominants dans une famille. L’atteinte du système nerveux central est rare (épisodes pseudo-vasculaires transitoires, encéphalopathie).</p>
<div class="lab">Fréquence</div><p>7–12 % des CMT, deuxième forme en fréquence. GJB1 est aussi le gène le plus fréquent dans les CMT axonales de la cohorte allemande.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1016/j.nmd.2013.05.005" target="_blank" rel="noopener" data-reference-source="1">Gess et al., sous-types génétiques de CMT, cohorte allemande, 2013</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-mfn2" data-title="CMT2A : MFN2 et mitochondries">
<div class="lab">Mécanisme</div><p>MFN2 code la mitofusine 2 ; son dysfonctionnement entraîne une atteinte mitochondriale et une neuropathie axonale.</p>
<div class="lab">Contexte</div><p>MFN2 est, après GJB1, le deuxième gène des CMT axonales de la cohorte allemande ; avec PMP22, MPZ et GJB1, il fait partie des quatre gènes qui représentent plus de 90 % des cas confirmés. MT-ATP6 (génome mitochondrial) explique au moins 1 % des CMT axonales dans certaines séries.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1016/j.nmd.2013.05.005" target="_blank" rel="noopener" data-reference-source="1">Gess et al., sous-types génétiques de CMT, cohorte allemande, 2013</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-hnpp" data-title="HNPP : neuropathie héréditaire avec hypersensibilité à la pression">
<div class="lab">Définition et mécanisme</div><p>La HNPP est due, dans la grande majorité des cas, à une délétion de la région 17p11.2-p12 incluant PMP22. Elle produit des renflements focaux de myéline (tomacula). Chez la souris, le bloc de conduction se produit plus vite sous compression et récupère plus lentement.</p>
<div class="lab">Clinique</div><p>Mononeuropathies épisodiques, récidivantes et indolores déclenchées par compression ou traction aux sites d’enclavement ; début à 26,5 ans en moyenne ; récidive chez 62 % des formes typiques ; 6,5 % sont asymptomatiques ; délai diagnostique jusqu’à 40 ans ; antécédent familial dans 64,5 % des cas.</p>
<div class="lab">Épidémiologie et limites</div><p>Environ 16 pour 100 000, jusqu’à 58,9 pour 100 000 en dépistage néonatal. Les sources principales sont chinoises (revue de 124 cas) ou en résumé : le dossier ne contient pas de donnée européenne détaillée. Aucun traitement efficace ; rééducation et protection des sites.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-024-12839-7" target="_blank" rel="noopener" data-reference-source="1">Chen et al., revue clinique de la HNPP, 2024/2025</a> ; <a href="https://doi.org/10.1007/s00415-019-09319-8" target="_blank" rel="noopener" data-reference-source="1">Attarian et al., HNPP, 2020</a>.</p>
</template>
<template data-pop="g60-refsum" data-title="Maladie de Refsum de l’adulte">
<div class="lab">Définition</div><p>Maladie autosomique récessive (environ 1/1 000 000), codée G60.1, due à une perte de fonction de PHYH (au moins 90 %) ou de PEX7, enzymes de l’alpha-oxydation peroxysomale de l’acide phytanique (AP). Elle est à distinguer de la forme infantile, forme légère du spectre de Zellweger.</p>
<div class="lab">Clinique</div><p>Rétinite pigmentaire presque constante (96 % dans une enquête), cécité nocturne, anosmie, surdité neurosensorielle (62 %, vers 50 ans), neuropathie axonale distale symétrique (71 %), ichtyose (43 %), anomalies osseuses, ataxie dans les formes sévères.</p>
<div class="lab">Application</div><p>Le diagnostic repose sur l’AP élevée avec acide pristanique bas. Le régime pauvre en AP améliore la neuropathie, les symptômes cardiaques et cutanés ; le jeûne est dangereux.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/jimd.70201" target="_blank" rel="noopener" data-reference-source="1">Ramachandran et al., guidance Global DARE sur la maladie de Refsum, 2026</a>.</p>
</template>
<template data-pop="g60-ciap" data-title="CIAP : neuropathie axonale idiopathique chronique">
<div class="lab">Définition</div><p>Polyneuropathie sensitive ou sensitivomotrice distale, axonale, d’installation insidieuse, de progression lente ou nulle sur au moins six mois, sans cause malgré un bilan approprié (G60.3).</p>
<div class="lab">Critères Cochrane</div><p>Âge d’au moins 40 ans ; absence de maladie systémique ou neurologique ; évolution chronique sans nadir en moins de deux mois ; exclusion des causes connues ; ENMG axonale sans signe démyélinisant.</p>
<div class="lab">Épidémiologie et traitement</div><p>10–25 % des patients adressés pour bilan de polyneuropathie ; vers la sixième décennie ; sex-ratio masculin 3:2. Aucun essai randomisé ni traitement médicamenteux d’efficacité prouvée ; un rôle de l’auto-immunité reste à étudier.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00415-016-8082-7" target="_blank" rel="noopener" data-reference-source="1">Zis et al., neuropathie axonale idiopathique chronique, 2016</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6481404/" target="_blank" rel="noopener" data-reference-source="1">Cochrane, traitement médicamenteux de la neuropathie axonale idiopathique chronique, 2017</a>.</p>
</template>
<template data-pop="g60-ataxie" data-title="Ataxies héréditaires avec neuropathie (G60.2)">
<div class="lab">Contenu</div><p>Dans les ataxies héréditaires, l’atteinte nerveuse la plus fréquente est une neuronopathie sensitive ou sensitivomotrice. Le syndrome CANVAS associe une neuropathie ou une neuronopathie sensitive et une abolition bilatérale du réflexe vestibulo-oculaire ; il est lié à RFC1. L’ataxie spastique de Charlevoix-Saguenay (SACS) est l’exception, avec une conduction de type intermédiaire.</p>
<div class="lab">Limites</div><p>Ces sources ne sont lues qu’en résumé : aucun chiffre de conduction n’est disponible pour l’ataxie de Friedreich ni pour les autres ataxies.</p>
<p class="src">Références : <a href="https://doi.org/10.1136/practneurol-2020-002822" target="_blank" rel="noopener" data-reference-source="1">Cortese et al., CANVAS, 2022</a> ; <a href="https://doi.org/10.1016/B978-0-444-52902-2.00051-5" target="_blank" rel="noopener" data-reference-source="1">Berciano et al., nerf périphérique dans les ataxies héréditaires, 2013</a>.</p>
</template>
<template data-pop="g60-pied-creux" data-title="Pied creux">
<div class="lab">Définition</div><p>Voûte plantaire exagérée avec orteils en griffe et rétraction achilléenne.</p>
<div class="lab">Mécanisme</div><p>Il suggère une dénervation commencée dans l’enfance. Dans les deux premières années, un pied plat valgus peut être le signe principal.</p>
<div class="lab">Application</div><p>On distingue le pied creux souple (orthèses, toxine botulique) du pied structuré (chirurgie). Il est présent dans 12,1 % des HNPP.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1007/s00415-024-12839-7" target="_blank" rel="noopener" data-reference-source="1">Chen et al., revue clinique de la HNPP, 2024/2025</a>.</p>
</template>
<template data-pop="g60-nerfs" data-title="Nerfs hypertrophiés palpables">
<div class="lab">Définition</div><p>Épaississement des nerfs superficiels perçu à la palpation ; signe relativement spécifique de la CMT1A.</p>
<div class="lab">Mécanisme</div><p>La biopsie de la CMT1A montre des bulbes d’oignon. L’échographie à haute résolution montre l’élargissement nerveux, utile pour distinguer de la PIDC.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-areflexie" data-title="Réflexes tendineux">
<div class="lab">Technique</div><p>Réflexes diminués ou abolis, surtout aux membres inférieurs.</p>
<div class="lab">Valeur</div><p>L’aréflexie traduit la perte axonale longueur-dépendante, avec la faiblesse distale et le déficit sensitif distal.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1038/s41572-025-00679-2" target="_blank" rel="noopener" data-reference-source="1">Burns et al., Nat Rev Dis Primers 2026</a>.</p>
</template>
<template data-pop="g60-douleur" data-title="Douleur et crampes dans la CMT">
<div class="lab">Fréquence</div><p>Crampes rapportées jusqu’à 85 % des cas ; douleur dans 23 à 85 % (biomécanique ou neuropathique) ; fatigue.</p>
<div class="lab">Prise en charge</div><p>Antidépresseurs (amitriptyline, duloxétine), antiépileptiques (gabapentine, prégabaline, carbamazépine), topiques (capsaïcine) ; éviter les opioïdes. La gabapentine et la duloxétine sont hors indication suisse dans la CMT.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1024/0040-5930/a001191" target="_blank" rel="noopener" data-reference-source="1">Reisig et Harnik, Ther Umsch 2020</a> ; Information professionnelle suisse Neurontin® (gabapentine), avril 2025 ; Information professionnelle suisse Duloxétine NOBEL, décembre 2024.</p>
</template>
<template data-pop="g60-cmtns" data-title="CMTNS et CMTES">
<div class="lab">Définition</div><p>Le CMT Neuropathy Score (CMTNS) intègre l’électrophysiologie ; le CMT Examination Score (CMTES) l’exclut. La force est cotée par la méthode MRC et/ou la dynamométrie.</p>
<div class="lab">Application</div><p>Suivi au moins annuel en équipe multidisciplinaire ; pas d’ENMG ni d’imagerie de routine.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-enmg" data-title="ENMG : profils et pièges de lecture">
<div class="lab">Technique</div><p>Étude de nerfs sensitifs et moteurs aux quatre membres, segments proximaux et distaux ; vitesse interprétée avec l’amplitude.</p>
<div class="lab">Profils</div><p>Démyélinisant : ralentissement uniforme et marqué, latences distales et ondes F allongées. Axonal : amplitudes basses, vitesses normales. HNPP : anomalies focales aux sites d’enclavement.</p>
<div class="lab">Pièges</div><p>Certains variants de MPZ, GJB1, FIG4 et LITAF miment une neuropathie acquise immune ; en médecine interne suisse, l’étude de conduction est réservée aux présentations atypiques ou sans cause définie.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a> ; <a href="https://doi.org/10.1007/s00415-024-12839-7" target="_blank" rel="noopener" data-reference-source="1">Chen et al., revue clinique de la HNPP, 2024/2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31746572/" target="_blank" rel="noopener" data-reference-source="1">Bernard-Valnet et al., Rev Med Suisse 2019</a>.</p>
</template>
<template data-pop="g60-genetique" data-title="Stratégie génétique en trois étapes">
<div class="lab">Raisonnement</div><p>La CMT1A est la cause la plus fréquente : chercher d’abord une duplication ou délétion de PMP22 en cas de vitesse inférieure à 38 m/s évite un séquençage inutile. Si elle est négative, un panel ou un exome couvre au moins GJB1, MPZ, PMP22, SH3TC2, MFN2, GDAP1, MME et HSPB1. Une troisième étape couvre les régions mal couvertes, SORD, l’ADN mitochondrial et les variations du nombre de copies.</p>
<div class="lab">Limites</div><p>La confirmation génétique atteint 66 % des CMT1 et 35 % des CMT2 dans la cohorte allemande ; un test négatif n’exclut pas la maladie.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1016/j.nmd.2013.05.005" target="_blank" rel="noopener" data-reference-source="1">Gess et al., sous-types génétiques de CMT, cohorte allemande, 2013</a>.</p>
</template>
<template data-pop="g60-contentieux-genetique" data-title="Contentieux : PMP22 d’abord ou panel d’emblée">
<div class="lab">Positions</div><p>Le guide espagnol 2024/2025 (le guide espagnol) recommande de commencer par la duplication de PMP22 si la vitesse est inférieure à 38 m/s. La revue de 2019 note que le panel devient l’approche privilégiée dans certaines équipes.</p>
<div class="lab">Arbitrage</div><p>La source primaire européenne la plus récente l’emporte : le guide de 2024/2025. Le texte de 2019 reste consultable comme position antérieure. Aucune recommandation suisse n’a pu être lue pour trancher.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.3390/ijms20143419" target="_blank" rel="noopener" data-reference-source="1">Morena et al., CMT : des molécules à la thérapie, 2019</a>.</p>
</template>
<template data-pop="g60-ap" data-title="Acide phytanique : stockage et mobilisation">
<div class="lab">Normal et pathologique</div><p>L’acide phytanique (AP) est dégradé par l’alpha-oxydation peroxysomale. Dans le Refsum, il s’accumule dans la rétine, la myéline, le tissu adipeux et les organes. La majorité est stockée dans le tissu adipeux.</p>
<div class="lab">Valeurs</div><p>Référence inférieure à 15 µmol/l ; décompensation souvent supérieure à 500 µmol/l, parfois à 1000 µmol/l.</p>
<div class="lab">Application</div><p>Le jeûne et la perte de poids libèrent ce stock et déclenchent des décompensations corrélées au taux circulant.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/jimd.70201" target="_blank" rel="noopener" data-reference-source="1">Ramachandran et al., guidance Global DARE sur la maladie de Refsum, 2026</a>.</p>
</template>
<template data-pop="g60-regime" data-title="Régime pauvre en acide phytanique">
<div class="lab">Prescription</div><p>Moins de 10 mg d’AP par jour, à vie (recommandation 7, très forte). Éviter les produits laitiers, la viande de ruminants et certains produits de la mer ; option pratique : régime végétarien sans produits laitiers avec œufs, poulet et dinde. Surveiller les vitamines A, D, E, K et B12 (recommandation 8).</p>
<div class="lab">Limite</div><p>Éviter jeûne et amaigrissement rapide ; l’orlistat n’a pas de bénéfice démontré chez les patients déjà observants.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/jimd.70201" target="_blank" rel="noopener" data-reference-source="1">Ramachandran et al., guidance Global DARE sur la maladie de Refsum, 2026</a>.</p>
</template>
<template data-pop="g60-decompensation" data-title="Décompensation aiguë du Refsum">
<div class="lab">Contexte et signes</div><p>Infection, jeûne ou amaigrissement rapide ; AP souvent supérieure à 500 µmol/l ; faiblesse, douleurs, aggravation de la surdité et de la vision, ichtyose diffuse, atteinte tubulaire rénale, arythmies, insuffisance cardiaque, mort subite rapportée, CK élevée.</p>
<div class="lab">Conduite</div><p>Glucose intraveineux, monitorage cardiaque, échange plasmatique ou aphérèse des lipoprotéines, traitement de la cause. En chirurgie avec jeûne : contacter l’équipe métabolique, glucose intraveineux 200 mg/kg/h (glucose 10 % à 2 ml/kg/h). À domicile : polymère de glucose oral.</p>
<p class="src">Références : <a href="https://doi.org/10.1002/jimd.70201" target="_blank" rel="noopener" data-reference-source="1">Ramachandran et al., guidance Global DARE sur la maladie de Refsum, 2026</a>.</p>
</template>
<template data-pop="g60-chimio" data-title="Chimiothérapie chez un patient CMT">
<div class="lab">Risque</div><p>La vincristine et le paclitaxel exposent à un risque élevé de neurotoxicité atypique et sévère ; d’autres médicaments (cisplatine, oxaliplatine, bortézomib, thalidomide, taxoïdes) présentent un risque significatif.</p>
<div class="lab">Conduite</div><p>Ne pas refuser un traitement anticancéreux efficace ; informer le patient, documenter le risque dans les rapports et coordonner avec l’oncologue.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-neurotox" data-title="Médicaments neurotoxiques">
<div class="lab">Niveaux</div><p>Risque élevé : vincristine, paclitaxel. Risque significatif : amiodarone, bortézomib, sels de platine, colchicine, métronidazole, phénytoïne, fluoroquinolones, linézolide, statines, thalidomide, taxoïdes. À surveiller : pyridoxine à haute dose, protoxyde d’azote (carence en vitamine B12).</p>
<div class="lab">Limite</div><p>Aucune preuve claire d’un risque accru avec l’anesthésie locale ou les blocs nerveux. Le tableau provient d’un seul guide ; il est à croiser avec les informations professionnelles suisses de chaque produit.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-acquises" data-title="Neuropathies acquises à exclure">
<div class="lab">Causes courantes</div><p>Diabète, insuffisance rénale chronique, carences en vitamines hydrosolubles dont B12, gammapathie monoclonale, alcool, médicaments.</p>
<div class="lab">Contexte suisse</div><p>Le bilan de base de médecine interne recherche l’alcool, le diabète, la carence en B12 et la gammapathie ; environ 30 % des personnes âgées ont une polyneuropathie sensitive. Un neurologue est sollicité si le diagnostic reste incertain et que des options thérapeutiques existent. Ces sources suisses ne sont lues qu’en résumé.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31746572/" target="_blank" rel="noopener" data-reference-source="1">Bernard-Valnet et al., Rev Med Suisse 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31696679/" target="_blank" rel="noopener" data-reference-source="1">Cisarovsky et al., Rev Med Suisse 2019</a>.</p>
</template>
<template data-pop="g60-ttr" data-title="Amylose héréditaire à transthyrétine">
<div class="lab">Contenu</div><p>L’amylose héréditaire à transthyrétine est citée en différentiel des neuropathies héréditaires ; des traitements par oligonucléotides antisens (ASO) et ARN interférents (ARNi) sont disponibles en Suisse et dans la francophonie, de même que pour la porphyrie.</p>
<div class="lab">Limite</div><p>Source lue en résumé seulement ; le détail clinique n’est pas dans le dossier. L’amylose n’est pas listée sous G60 sur la page lue.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener" data-reference-source="1">BfArM, CIM-10-GM 2024, bloc G60–G64</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.779.813" target="_blank" rel="noopener" data-reference-source="1">Echaniz-Laguna et al., Rev Med Suisse 2022</a>.</p>
</template>
<template data-pop="g60-essais" data-title="Essais thérapeutiques dans la CMT">
<div class="lab">Pistes</div><p>PXT3003 (baclofène, D-sorbitol, naltrexone) en phase III en réévaluation ; govorestat pour la CMT-SORD, qui pourrait devenir le premier médicament approuvé ; silenceurs de PMP22 proches des essais chez l’humain. La vitamine C n’améliore pas la CMT1A.</p>
<div class="lab">Application</div><p>La participation à un essai est proposée au patient ; il s’agit de pistes, non de traitements disponibles.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1080/14737175.2025.2470980" target="_blank" rel="noopener" data-reference-source="1">De Grado et al., CMT en 2025</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.779.813" target="_blank" rel="noopener" data-reference-source="1">Echaniz-Laguna et al., Rev Med Suisse 2022</a>.</p>
</template>
<template data-pop="g60-orthese" data-title="Orthèse cheville-pied (PLS-AFO)">
<div class="lab">Indication</div><p>Pour la faiblesse du releveur du pied : dispositif élastique releveur précoce, puis orthèse cheville-pied de type PLS-AFO (posterior leaf spring ankle-foot orthosis). Ergothérapie et attelle d’opposition du pouce pour la main.</p>
<div class="lab">Complément</div><p>Entraînement aérobie chez l’adulte, renforcement progressif chez l’enfant.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-chirurgie" data-title="Chirurgie du pied creux varus">
<div class="lab">Principe</div><p>Les orthèses d’abord ; la chirurgie quand la déformation devient structurée.</p>
<div class="lab">Gestes</div><p>Transfert du tibial postérieur sur le dos du pied (très efficace), ostéotomie calcanéenne si varus persistant, transfert du long fibulaire vers le court fibulaire, arthrodèse des orteils en griffe avec transfert de l’extenseur, arthrodèse du médio-pied ou de l’arrière-pied en dernier recours.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a>.</p>
</template>
<template data-pop="g60-grossesse" data-title="Grossesse et CMT">
<div class="lab">Risques</div><p>Un peu plus de placenta praevia, de présentations anormales et de prématurité ; aggravation des symptômes chez environ un tiers des patientes, amélioration après l’accouchement chez environ la moitié d’entre elles.</p>
<div class="lab">Organisation</div><p>Suivi neurologique et obstétrical rapproché. Pour le Refsum, la gestion de la grossesse fait l’objet d’une recommandation spécifique.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.nrleng.2024.02.008" target="_blank" rel="noopener" data-reference-source="1">Sivera Mascaró et al., guide de la Société espagnole de neurologie sur la CMT, 2024/2025</a> ; <a href="https://doi.org/10.1002/jimd.70201" target="_blank" rel="noopener" data-reference-source="1">Ramachandran et al., guidance Global DARE sur la maladie de Refsum, 2026</a>.</p>
</template>
<template data-pop="g60-lacunes" data-title="Lacunes du dossier">
<div class="lab">Contenu</div><p>Aucune recommandation de société suisse ni texte intégral suisse lu (les sources suisses sont en résumé) ; aucune épidémiologie suisse ; aucune information sur le remboursement des analyses génétiques par l’assurance obligatoire des soins (OKP) ; guide DGN/AWMF non accessible ; guide EAN spécifique non trouvé ; rattachement CIM de la HNPP non établi ; clinique de Morvan, Nélaton, Roussy-Lévy et des HSAN non documentée ; informations professionnelles suisses de la carbamazépine et de la capsaïcine non lues.</p>
<div class="lab">Conséquence</div><p>Le cours n’avance aucune donnée sur ces points ; l’audit est différé, et la revue par intelligence artificielle ne remplace pas une validation médicale humaine.</p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/31746572/" target="_blank" rel="noopener" data-reference-source="1">Bernard-Valnet et al., Rev Med Suisse 2019</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/31696679/" target="_blank" rel="noopener" data-reference-source="1">Cisarovsky et al., Rev Med Suisse 2019</a> ; <a href="https://doi.org/10.53738/REVMED.2022.18.779.813" target="_blank" rel="noopener" data-reference-source="1">Echaniz-Laguna et al., Rev Med Suisse 2022</a> ; <a href="https://doi.org/10.23785/TU.2025.03.004" target="_blank" rel="noopener" data-reference-source="1">Blanquet et Humm, Ther Umsch 2025</a>.</p>
</template>
