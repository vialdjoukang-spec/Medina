<section class="ilot" id="g94-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Trois situations fictives, construites pour l’enseignement, illustrent la catégorie. Elles ne représentent pas des patients réels et leurs valeurs servent seulement à exercer le raisonnement.</p>
<p><b>Première situation.</b> Un homme de 68 ans est hospitalisé aux soins intensifs pour un choc septique d’origine abdominale. Au deuxième jour, sans sédation, il ne répond plus aux ordres simples : son score de Glasgow est à 9 sur 15. Le scanner cérébral sans produit de contraste ne montre aucune lésion. Faut-il conclure à une <button class="w" data-k="g94-sae-def">encéphalopathie associée au sepsis</button> ? Cette conclusion n’est légitime qu’après avoir exclu les autres causes d’altération de la conscience.</p>
<p><b>Deuxième situation.</b> Une femme de 55 ans, suivie pour un cancer du sein, présente des céphalées, des vomissements et une diplopie. L’imagerie montre des ventricules dilatés. L’<button class="w" data-k="g94-ml">hydrocéphalie (métastases leptoméningées)</button> doit-elle être traitée seule, ou signale-t-elle une atteinte des méninges par la tumeur ?</p>
<p><b>Troisième situation.</b> Un homme de 52 ans, dont la consommation d’alcool est élevée, arrive aux urgences confus, avec une marche instable et des troubles oculomoteurs. Faut-il lui administrer du glucose, ou de la thiamine d’abord ? Le choix de l’ordre est une décision de sécurité (<button class="w" data-k="g94-wernicke">encéphalopathie de Wernicke</button>).</p>
<p>Ces trois patients partagent une même logique : la complication cérébrale est la <b>conséquence</b> d’une maladie primaire située ailleurs dans l’organisme (infection, cancer, carence). Cette leçon apprend à reconnaître la manifestation cérébrale, à traiter la maladie causale et à gérer ce qui menace le cerveau.</p>
<p><b>Objectifs.</b> Après cette leçon, le lecteur sait : (1) expliquer le rôle de la catégorie astérisque et de la maladie primaire qui l’accompagne ; (2) distinguer les trois pôles cliniques, soit l’hydrocéphalie, l’encéphalopathie septique et l’encéphalopathie carentielle ; (3) conduire le bilan de chacun ; (4) reconnaître les urgences ; (5) décrire les traitements dont les doses sont documentées par l’information professionnelle suisse.</p>
<div class="key"><b>À retenir.</b> Le diagnostic de cette catégorie est toujours double : la maladie primaire d’abord, sa manifestation cérébrale ensuite. Traiter le cerveau en ignorant la cause ne guérit pas ; traiter la cause en ignorant le cerveau expose à une aggravation évitable.</div>
</section>
<section class="ilot" id="g94-1"><h2><span class="n">1</span>Définition et logique de la catégorie</h2>
<p>La Classification internationale des maladies, dans la version allemande modifiée pour 2024 (CIM-10-GM), utilise pour certaines maladies un <b>double codage</b>. Le <b>code croix</b> (†) désigne la maladie primaire, c’est-à-dire la cause. Le <b>code astérisque</b> (*) décrit la manifestation dans un organe. La catégorie G94 est de type astérisque : elle code les affections du cerveau qui surviennent <b>au cours de maladies classées ailleurs</b>. Ainsi, un code astérisque ne s’emploie jamais seul. Il accompagne obligatoirement le code croix de la maladie causale.</p>
<p>Cette règle a une conséquence pratique pour le raisonnement clinique : devant une complication cérébrale, la question « quelle maladie la produit ? » précède la question « comment la traiter ? ». Le <button class="w" data-k="g94-cim">périmètre détaillé des sous-catégories, les exclusions et les renvois croix</button> sont regroupés dans une fenêtre ; le cours ne les répète pas.</p>
<p>Le contenu clinique de G94 se répartit en trois pôles :</p>
<table class="t"><thead><tr><th>Pôle</th><th>Idée directrice</th><th>Exemple documenté dans cette leçon</th></tr></thead><tbody>
<tr><td>Hydrocéphalie secondaire</td><td>Dilatation ventriculaire due à une infection, à une tumeur ou à une autre maladie</td><td>Méningite bactérienne, méningite tuberculeuse, métastases leptoméningées, hémorragie sous-arachnoïdienne</td></tr>
<tr><td>Encéphalopathie septique</td><td>Atteinte cérébrale diffuse pendant un sepsis, non attribuable à une autre cause</td><td>Délire ou coma d’un patient en choc septique</td></tr>
<tr><td>Encéphalopathie métabolique</td><td>Atteinte cérébrale par désordre endocrinien ou métabolique</td><td>Encéphalopathie de Wernicke (carence en thiamine)</td></tr>
</tbody></table>
<p>Le tableau regroupe les entités par mécanisme clinique, non par code. Une limite doit être connue : pour deux sous-catégories (encéphalopathie non précisée, autres affections précisées), le dossier de sources ne contient aucune entité clinique spécifique. Elles ne sont donc pas développées ; la fenêtre <button class="w" data-k="g94-lacunes">limites de cette leçon</button> les nomme.</p>
<p>Deux frontières évitent les erreurs de classement. La première sépare l’encéphalopathie au cours d’une infection <b>sans sepsis</b> de l’encéphalopathie <b>septique</b> : c’est la présence du sepsis qui bascule vers la seconde. La seconde exclut l’<button class="w" data-k="g94-hepatique">encéphalopathie hépatique</button>, qui n’appartient pas à G94 mais à une autre catégorie de la classification.</p>
<div class="trap"><span class="k">Piège</span> Coder ou raisonner « encéphalopathie » sans identifier la maladie primaire. Le code astérisque seul est incomplet ; l’examinateur attend la cause.</div>
</section>
<section class="ilot" id="g94-2"><h2><span class="n">2</span>Fréquence et épidémiologie</h2>
<p>Les fréquences disponibles dans le dossier de sources proviennent de cohortes européennes et de revues ; <b>aucune donnée épidémiologique suisse n’a été lue</b> pour cette catégorie, et aucune recommandation d’une société suisse de neurologie n’a pu être consultée. Les chiffres ci-dessous ne s’appliquent donc à la Suisse que par transposition prudente.</p>
<table class="t"><thead><tr><th>Situation</th><th>Donnée</th><th>Population et source</th></tr></thead><tbody>
<tr><td>Hydrocéphalie dans la méningite bactérienne</td><td>5 % (26 épisodes sur 577) ; 69 % déjà présente à l’admission</td><td>Adultes, méningite communautaire, cohorte néerlandaise 2006–2009</td></tr>
<tr><td>Encéphalopathie associée au sepsis</td><td>Jusqu’à 70 % ; 54 % chez 50 patients non sédatés avec Glasgow inférieur à 15</td><td>Patients septiques des soins intensifs, revues</td></tr>
<tr><td>Hydrocéphalie dans les métastases leptoméningées</td><td>11 à 17 %</td><td>Tumeurs solides, recommandation EANO-ESMO 2023</td></tr>
<tr><td>Hémorragie sous-arachnoïdienne</td><td>Incidence d’environ 9 pour 100 000</td><td>Recommandation de l’European Stroke Organisation 2013</td></tr>
</tbody></table>
<p>La lecture de ce tableau demande de distinguer des dénominateurs différents : le taux de 5 % est rapporté à toutes les méningites bactériennes, alors que les 11 à 17 % se rapportent aux seuls patients ayant des métastases leptoméningées. Comparer ces chiffres entre eux n’a pas de sens. Pour l’encéphalopathie septique, la fréquence dépend aussi de la méthode : un dépistage systématique du délire augmente le nombre de cas reconnus, et l’absence de dépistage conduit à un sous-diagnostic.</p>
<div class="trap"><span class="k">Population des chiffres</span> Aucun taux suisse n’est cité parce qu’aucun n’a été lu. Un candidat ne doit pas attribuer à la Suisse les pourcentages néerlandais ou français.</div>
<div class="key"><b>À retenir.</b> Une hydrocéphalie complique 5 % des méningites bactériennes de l’adulte et 11 à 17 % des métastases leptoméningées ; l’encéphalopathie septique touche jusqu’à 70 % des patients septiques en soins intensifs.</div>
<button class="pareto-btn ui" data-k="pareto-g94-def">▲ Loi de Pareto — Définition et fréquence</button>
</section>
<section class="ilot" id="g94-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Chaque pôle suit la même chaîne : un état normal, une perturbation provoquée par la maladie primaire, puis une manifestation clinique. Les trois chaînes sont décrites séparément.</p>
<p><b>Encéphalopathie septique.</b> À l’état normal, la <button class="w" data-k="g94-bhe">barrière hémato-encéphalique</button> reste étanche, le couplage neurovasculaire adapte le débit sanguin à l’activité des neurones et la neurotransmission demeure équilibrée. Pendant un sepsis, les <b>cytokines pro-inflammatoires</b> altèrent cette barrière. Des cellules immunitaires et des médiateurs de l’inflammation pénètrent alors dans le tissu cérébral. La <b>microglie</b>, cellule immunitaire résidente du cerveau, s’active à son tour et libère des cytokines et des espèces réactives de l’oxygène ; ces dernières provoquent un stress oxydatif et une lésion des neurones. S’y ajoutent une hypoxie cérébrale, des troubles métaboliques, des altérations de la microcirculation et un déséquilibre des neurotransmetteurs. La revue la plus récente retient la neuro-inflammation et l’ischémie comme processus principaux, avec une défaillance de la production d’énergie des cellules ; elle signale une vulnérabilité particulière du cortex frontal, de l’hippocampe, du système limbique et du tronc cérébral. Cette chaîne explique la clinique : une atteinte diffuse du cortex et du tronc cérébral se traduit par une altération de l’attention et de la vigilance, qui s’étend du délire au coma (<button class="w" data-k="g94-sae-meca">chaîne détaillée et limites</button>).</p>
<p><b>Hydrocéphalie.</b> Le dossier de sources ne contient pas la physiologie normale du liquide cérébrospinal (production, volume, résorption) : cette base est renvoyée à la leçon consacrée aux affections hydrocéphaliques et aux sources qu’elle documente. Les données lues permettent néanmoins deux affirmations. Dans la méningite bactérienne de l’adulte, l’hydrocéphalie est de type <b>communicant</b> dans tous les cas sauf un : les ventricules sont dilatés sans obstacle visible entre eux, ce qui oriente vers un trouble de la circulation ou de la résorption du liquide au niveau des espaces qui l’entourent. L’article source ne détaille pas le mécanisme moléculaire ; cette interprétation reste une inférence de lecture. Dans les métastases leptoméningées, une <b>obstruction du flux</b> du liquide cérébrospinal peut exister ; l’examen du flux par scintigraphie la recherche, et sa présence interdit le traitement intrathécal (<button class="w" data-k="g94-flux">études de flux</button>). La conséquence physiologique commune est l’élévation de la pression intracrânienne, que le drainage du liquide soulage rapidement.</p>
<p><b>Encéphalopathie de Wernicke.</b> Le pyrophosphate de thiamine est le groupe actif d’enzymes qui dégradent les glucides, d’enzymes du cycle de l’acide citrique et de la voie des pentoses (transcétolase). Le besoin quotidien est d’environ 0,4 mg pour 4200 kJ de glucides ingérés : l’apport glucidique <b>augmente donc la demande</b>. Avec des apports normaux de 1,5 à 2,5 mg par jour, la demi-vie de la thiamine est de 10 à 20 jours ; une carence se constitue donc en quelques semaines. Une cellule privée de cette coenzyme ne peut pas utiliser le glucose avec le rendement normal. La conséquence pratique est essentielle : chez un patient carencé, une charge glucidique avant la thiamine accroît une demande que les réserves ne couvrent pas (<button class="w" data-k="g94-thiamine-meca">mécanisme biochimique</button>).</p>
<div class="trap"><span class="k">Piège</span> Confondre association et causalité. Dans la cohorte OUTCOMEREA, la non-correction de la pression artérielle, de l’oxygénation, de la température et de la glycémie à trois jours est <b>associée</b> à la mortalité ; l’étude, rétrospective, ne prouve pas que leur correction supprimerait ce risque.</div>
<div class="key"><b>À retenir.</b> Septique : barrière altérée, microglie activée, ischémie. Hydrocéphalique : pression intracrânienne élevée par défaut de circulation du liquide. Wernicke : carence d’une coenzyme du métabolisme du glucose, aggravée par les glucides.</div>
</section>
<section class="ilot" id="g94-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>La maladie primaire détermine le pôle. Le tableau relie chaque cause à sa manifestation cérébrale et au facteur de risque documenté.</p>
<table class="t"><thead><tr><th>Maladie primaire</th><th>Manifestation cérébrale</th><th>Facteurs de risque ou contexte documentés</th></tr></thead><tbody>
<tr><td>Méningite bactérienne communautaire</td><td>Hydrocéphalie</td><td>Germes les plus fréquents dans la cohorte : <i>Streptococcus pneumoniae</i> (54 %), <i>Listeria monocytogenes</i> (15 %)</td></tr>
<tr><td>Méningite tuberculeuse</td><td>Hydrocéphalie, réactions paradoxales, hyponatrémie</td><td>Forme la plus grave de tuberculose ; base de preuve pauvre pour la prise en charge optimale</td></tr>
<tr><td>Cancer du sein, du poumon, mélanome</td><td>Hydrocéphalie par métastases leptoméningées</td><td>Tumeurs solides avec symptômes neurologiques</td></tr>
<tr><td><button class="w" data-k="g94-hsa">Hémorragie sous-arachnoïdienne (données)</button></td><td>Hydrocéphalie (parmi les facteurs de pronostic)</td><td>Rupture anévrismale ; recommandations détaillées non lues</td></tr>
<tr><td>Sepsis, choc septique</td><td>Encéphalopathie septique</td><td>Hypotension, hypoxie, fièvre ou hypothermie, dysglycémie ; antibiotique neurotoxique, midazolam</td></tr>
<tr><td>Carence en thiamine</td><td>Encéphalopathie de Wernicke</td><td>Alcool, chirurgie bariatrique, toute situation de carence nutritionnelle</td></tr>
</tbody></table>
<p>Pour l’encéphalopathie septique, la revue lue décrit en outre des causes <b>médicamenteuses</b> qui s’ajoutent au sepsis : le midazolam est associé de façon indépendante à l’encéphalopathie, et le céfépime, antibiotique le plus souvent rapporté comme neurotoxique, s’accumule en cas d’insuffisance rénale (<button class="w" data-k="g94-cefepime">neurotoxicité du céfépime</button>). Ces facteurs sont modifiables et doivent être cherchés avant de conclure que le sepsis seul explique la confusion.</p>
<p>Pour l’encéphalopathie de Wernicke, la recommandation européenne demande de la suspecter dans <b>toute situation pouvant entraîner une carence en thiamine</b>, pas seulement chez l’alcoolique : après chirurgie bariatrique, une surveillance d’au moins six mois est recommandée. D’autres encéphalopathies endocriniennes ou métaboliques (hypoglycémie, hypothyroïdie, urémie, hyponatrémie) existent, mais aucune source européenne les concernant n’a été lue : elles ne sont pas développées.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer une confusion du patient septique au sepsis seul. Le diagnostic d’encéphalopathie septique est un diagnostic d’exclusion : médicaments, désordres métaboliques, crises non convulsives et lésions structurelles se cherchent d’abord.</div>
<button class="pareto-btn ui" data-k="pareto-g94-meca">▲ Loi de Pareto — Mécanismes et causes</button>
</section>
<section class="ilot" id="g94-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire cherche d’abord la maladie primaire, car elle désigne le pôle. Il est souvent partiel : le patient septique ou confus ne peut pas répondre, et la famille ou le dossier deviennent la source.</p>
<p><b>Antécédents à rechercher.</b> Cancer connu, surtout du sein, du poumon ou mélanome (<button class="w" data-k="g94-ml">signes d’alerte des métastases leptoméningées</button>) ; infection récente ou en cours ; consommation d’alcool ; chirurgie bariatrique ; insuffisance rénale ; traitements en cours (midazolam, antibiotiques) ; prise récente de corticoïdes.</p>
<p><b>Symptômes selon le pôle.</b></p>
<table class="t"><thead><tr><th>Pôle</th><th>Symptômes documentés</th></tr></thead><tbody>
<tr><td>Hydrocéphalie par métastases leptoméningées</td><td>Céphalées, nausées et vomissements, troubles cognitifs, troubles de la marche, douleurs cervicales ou dorsales, symptômes radiculaires</td></tr>
<tr><td>Encéphalopathie septique</td><td>Altération de l’attention, délire (souvent hypoactif), somnolence jusqu’au coma ; agitation dans environ 10 % des cas</td></tr>
<tr><td>Encéphalopathie de Wernicke</td><td>Confusion ou trouble mnésique léger, troubles oculaires, marche instable, signes de carence alimentaire</td></tr>
</tbody></table>
<p>Le tableau rappelle un point de sémiologie : dans l’encéphalopathie septique, les formes <b>hypoactives</b> et le coma prédominent. Un patient calme et somnolent est donc plus typique qu’un patient agité, et il est aussi plus facilement ignoré (<button class="w" data-k="g94-delire">spectre clinique</button>).</p>
<div class="two"><div class="card"><h4>Forme typique</h4><p>Un patient hospitalisé pour une infection grave présente une altération progressive de l’état mental, sans signe focal, avec un bilan métabolique qui n’explique pas le tableau.</p></div><div class="card"><h4>Formes atypiques</h4><p>Des crises convulsives sont rares (environ 2 %), les signes focaux aussi (environ 1 %) ; leur présence impose de chercher une autre cause. Des crises <b>non convulsives</b> peuvent se manifester seulement par une conscience altérée et exigent un électroencéphalogramme.</p></div></div>
<div class="trap"><span class="k">Piège</span> Prendre un délire hypoactif pour de la fatigue. Sans outil de dépistage validé du délire, le diagnostic est manqué.</div>
</section>
<section class="ilot" id="g94-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel (état général, signes vitaux, puis examen ciblé) et cherche à la fois la cause systémique et le retentissement cérébral.</p>
<p><b>Signes vitaux.</b> Pression artérielle, oxygénation, température et glycémie sont lus comme des cibles de traitement : leur dérive est associée à une évolution plus grave dans l’encéphalopathie septique (<button class="w" data-k="g94-cibles">cibles proposées</button>).</p>
<div class="two"><div class="card"><h4>Encéphalopathie septique</h4><p>L’examen évalue l’<b>état mental</b> par un outil validé de dépistage du délire, la <b>réponse motrice</b>, les <b>réflexes du tronc cérébral</b> et les <b>mouvements anormaux</b>. Le score de Glasgow quantifie la gravité : la mortalité augmente quand il baisse (<button class="w" data-k="g94-gcs">score de Glasgow et pronostic</button>).</p></div><div class="card"><h4>Métastases leptoméningées</h4><p>Une atteinte <b>multifocale</b> du système nerveux est très évocatrice : paralysies des nerfs crâniens (II, III, IV, VI, VII, VIII), signes radiculaires, douleurs cervicales ou dorsales. L’examen neurologique complet fait partie du bilan recommandé.</p></div></div>
<div class="two"><div class="card"><h4>Encéphalopathie de Wernicke</h4><p>Chez l’alcoolique, le diagnostic clinique repose sur <b>deux des quatre signes</b> : carences alimentaires, signes oculaires, dysfonction cérébelleuse, altération de l’état mental ou trouble mnésique léger.</p></div><div class="card"><h4>Coma inexpliqué</h4><p>Un coma sans cause évidente chez un patient septique doit faire penser à une occlusion de l’artère basilaire : plus de 40 % ne sont pas vues au scanner sans contraste (<button class="w" data-k="g94-basilaire">occlusion basilaire</button>).</p></div></div>
<div class="trap"><span class="k">Piège</span> Examiner un patient sédaté. Les sédatifs confondent l’évaluation clinique et l’électroencéphalogramme ; l’interprétation d’un coma sous sédation reste incertaine.</div>
<div class="key"><b>À retenir.</b> Dans le contexte septique : outil de dépistage du délire, réponse motrice, réflexes du tronc. Dans le contexte tumoral : atteinte multifocale, nerfs crâniens. Dans le contexte carentiel : deux signes sur quatre.</div>
<button class="pareto-btn ui" data-k="pareto-g94-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
