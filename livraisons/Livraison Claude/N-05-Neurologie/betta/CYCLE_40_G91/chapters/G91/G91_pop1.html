<template data-pop="g91-inph" data-title="Hydrocéphalie à pression normale idiopathique (iNPH)">
<div class="lab">Définition</div><p>L’iNPH est conçue comme un trouble de la résorption du LCS sans maladie ni lésion antérieure qui l’explique. La ligne directrice japonaise précise qu’il s’agit d’un « concept » plutôt que d’une définition diagnostique, car la réponse à la dérivation n’est mesurable qu’après la chirurgie.</p><div class="lab">Mécanisme</div><p>Une ventriculomégalie communicante asymptomatique peut se développer chez des personnes âgées saines, puis devenir symptomatique, avec une réponse variable à la dérivation. Les causes sous-jacentes restent discutées.</p><div class="lab">Limite</div><p>La définition par la réponse à la chirurgie est rétrospective : elle ne guide pas la décision avant l’opération.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.1136/pn-2021-003291" target="_blank" rel="noopener">iNPH : contexte historique et guide, Pract Neurol 2023 (résumé)</a>.</p></template>
<template data-pop="g91-etv" data-title="Ventriculocisternostomie endoscopique (ETV)">
<div class="lab">Place</div><p>Chez l’enfant, l’ETV, avec ou sans cautérisation des plexus choroïdes (ETV-CPC), est préférée dans les causes obstructives comme la sténose de l’aqueduc ; l’ETV-CPC est surtout utilisée avant 2 ans.</p><div class="lab">Preuves chez l’adulte</div><p>Dans un petit essai brésilien rapporté par la ligne directrice japonaise, 50 % des patients étaient améliorés à 12 mois après ETV contre 76,9 % après dérivation ventriculo-péritonéale.</p><div class="lab">Limite</div><p>Un échec d’ETV est possible jusqu’à 8 ans après chez l’enfant. Le score de succès de l’ETV n’a pas été lu dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-def" data-title="Définition et formes communicante ou non communicante">
<div class="lab">Définition</div><p>Dilatation active et progressive des ventricules due à un écoulement insuffisant du LCS entre ses sites de production et de résorption.</p><div class="lab">Application</div><p>Forme communicante : aucun obstacle ne sépare ventricules et espace sous-arachnoïdien. Forme non communicante, ou obstructive : obstacle partiel ou complet, intra- ou extraventriculaire.</p><div class="lab">Limite</div><p>Cette définition vient d’une revue pédiatrique ; l’iNPH s’en distingue par l’absence de maladie antérieure identifiée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-hsa" data-title="Hydrocéphalie aiguë après hémorragie sous-arachnoïdienne (HSA)">
<div class="lab">Fréquence</div><p>Environ 25 % des hémorragies sous-arachnoïdiennes anévrismales se compliquent d’une hydrocéphalie ; la létalité de la maladie est d’environ 40 % et l’hydrocéphalie est un déterminant majeur du mauvais pronostic fonctionnel.</p><div class="lab">Conduite</div><p>Le drainage est recommandé en cas de baisse de vigilance. Le drain ventriculaire externe est la pratique quasi universelle et la seule option si l’hydrocéphalie est obstructive. Le drainage lombaire ou la ponction lombaire ne sont possibles que dans la forme communicante.</p><div class="lab">Danger</div><p>En cas d’obstruction ou d’œdème important, une dérivation lombaire expose à un engagement amygdalien et à la mort. Si le drain ne peut être retiré, une dérivation permanente s’impose.</p><div class="lab">Limite</div><p>Les recommandations formelles sur le drain, présentées en image dans le texte, n’ont pas pu être lues ; le sevrage du drain n’est pas traité ici.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">Recommandation ESO, EANS et ESMINT 2026 sur l’hémorragie sous-arachnoïdienne anévrismale</a>.</p></template>
<template data-pop="g91-cim" data-title="Codage G91 : inclusions et exclusions">
<div class="lab">Contenu</div><p>G91.- « Hydrozephalus » inclut l’hydrocéphalie acquise. Il exclut l’hydrocéphalie congénitale (Q03.-), l’hydrocéphalie acquise du nouveau-né (P91.7) et celle de la toxoplasmose congénitale (P37.1).</p><div class="lab">Sous-codes</div><p>G91.0 communicante ; G91.1 obstructive ; G91.20 idiopathique, G91.21 secondaire et G91.29 non précisée (pression normale) ; G91.3 post-traumatique sans précision ; G91.8 autres ; G91.9 sans précision.</p><div class="lab">Limite</div><p>La CIM-10-GM 2024 est le catalogue de ce dépôt ; la correspondance avec la CIM-11 n’est pas établie. Le texte allemand a été lu par un outil de résumé ; les libellés français viennent du catalogue de l’Office fédéral de la statistique.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G90–G99 (BfArM)</a>.</p></template>
<template data-pop="g91-class" data-title="Classification des hydrocéphalies à pression normale">
<div class="lab">Contenu</div><p>Troisième édition japonaise : iNPH ; NPH secondaire (après hémorragie sous-arachnoïdienne ou méningite) ; NPH congénitale ou développementale, dont la LOVA (ventriculomégalie longtemps évolutive de l’adulte) et la PaVM (terme japonais non développé dans le dossier), séparée de l’iNPH ; forme familiale mentionnée.</p><div class="lab">Application</div><p>La LOVA est en général non communicante, par sténose de l’aqueduc : on la distingue de l’iNPH, communicante.</p><div class="lab">Limite</div><p>Classification japonaise, non suisse ni européenne.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-chia" data-title="Hydrocéphalie chronique de l’adulte (CHiA)">
<div class="lab">Contenu</div><p>Une revue systématique avec consensus Delphi (Göteborg, Londres, Japon) a relevé 48 termes dans 33 études et les a regroupés en sept entités cliniques. Une nouvelle classification est proposée.</p><div class="lab">Limite</div><p>Seul le résumé a été lu : les sept entités ne sont pas détaillées ici.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.wneu.2023.12.094" target="_blank" rel="noopener">Classification de l’hydrocéphalie chronique de l’adulte, World Neurosurg 2024 (résumé)</a>.</p></template>
<template data-pop="g91-epi" data-title="Épidémiologie de l’iNPH">
<div class="lab">Chiffres</div><p>Suède, scanner : 3,7 % au total ; 8,9 % et 5,9 % au-delà de 80 ans selon deux études ; 1,5 % avec les critères japonais. Japon : moyenne pondérée de 1,6 % (quatre études). Méta-analyse mondiale 2018 : 175/100 000 ; 400/100 000 à ≥ 80 ans ; Japon 660/100 000, hors Japon 53/100 000. Données hospitalières : 2–10/100 000, 30–60/100 000 à 65–70 ans et plus.</p><div class="lab">Application</div><p>L’imagerie en population surestime la maladie symptomatique ; les cas diagnostiqués la sous-estiment.</p><div class="lab">Limite</div><p>Aucun chiffre suisse n’a été trouvé.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-avim" data-title="AVIM : ventriculomégalie asymptomatique">
<div class="lab">Définition</div><p>Ventriculomégalie asymptomatique avec aspect d’iNPH à l’IRM.</p><div class="lab">Évolution</div><p>Progression vers l’iNPH : 6–12 % par an dans une série (4 sur 8 en 4–8 ans), environ 17 % par an dans une autre (27 sur 52 en 3 ans).</p><div class="lab">Limite</div><p>Petits effectifs : ces chiffres sont indicatifs.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-epiped" data-title="Épidémiologie pédiatrique">
<div class="lab">Chiffres</div><p>Environ 400 000 nouveaux cas par an dans le monde, plus de 80 % dans les pays à revenu faible ou intermédiaire. Forme congénitale : environ la moitié. Jusqu’à 85 % des myéloméningocèles développent une hydrocéphalie. Post-hémorragique : plus de 6000 cas par an dans les pays à haut revenu. Post-traumatique : 0,7–3,7 % des traumatismes crâniens. Tumeur cérébrale : plus de 50 % des enfants. Méningite tuberculeuse : jusqu’à 85 %.</p><div class="lab">Limite</div><p>Revue à auteurs majoritairement nord-américains ; ce n’est pas une recommandation suisse.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-lcs" data-title="Production et circulation du LCS">
<div class="lab">Production</div><p>Le LCS est sécrété en continu par l’épithélium des plexus choroïdes des quatre ventricules, source dominante. L’épendyme ne sécrète pas activement. Chez l’animal, 30 à 40 % du LCS se forme en amont de l’aqueduc.</p><div class="lab">Résorption</div><p>Voies lymphatiques le long des gaines des nerfs crâniens et spinaux, lame criblée, nerf optique ; granulations arachnoïdiennes, qui mûrissent pendant la petite enfance ; système glymphatique, décrit qualitativement.</p><div class="lab">Limite</div><p>Aucun débit de production ni volume de LCS chez l’humain n’a été lu : les données chiffrées sont animales.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8941821/" target="_blank" rel="noopener">Production de LCS par les plexus choroïdes (revue de 2022)</a>.</p></template>
<template data-pop="g91-modele" data-title="Modèle moderne : pulsations, compliance et transport d’eau">
<div class="lab">Contenu</div><p>Au-delà de l’obstruction du flux, le modèle moderne fait intervenir les pulsations cérébrales, la compliance cérébrale et les mécanismes de transport d’eau. Les causes acquises touchent l’écoulement ventriculaire, la fonction de l’espace sous-arachnoïdien ou la compliance veineuse.</p><div class="lab">Limite</div><p>Résumé de revue (Lancet 2016) ; mécanismes non quantifiés ici.</p><p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(15)60694-8" target="_blank" rel="noopener">Hydrocéphalie de l’enfant, Lancet 2016 (résumé)</a>.</p></template>
<template data-pop="g91-synuc" data-title="Synucléinopathie associée à l’iNPH">
<div class="lab">Contenu</div><p>Une pathologie à α-synucléine concomitante est retrouvée chez 14 à 33 % des iNPH selon la méthode ; elle n’est pas prédictive d’une mauvaise réponse à la dérivation dans les données disponibles.</p><div class="lab">Application</div><p>Rigidité des membres supérieurs, anosmie, hallucinations, dysautonomie et fluctuations orientent vers une synucléinopathie.</p><div class="lab">Limite</div><p>Revue narrative, résumé seul.</p><p class="src">Références : <a href="https://doi.org/10.3390/diagnostics16182889" target="_blank" rel="noopener">α-Synucléine et iNPH, Diagnostics 2026 (résumé)</a>.</p></template>
<template data-pop="g91-bebe" data-title="Signes du nourrisson">
<div class="lab">Contenu</div><p>Accélération du périmètre crânien, fontanelle bombante, sutures disjointes, parésie du regard vers le haut (signe du coucher de soleil), œdème papillaire, vomissements, irritabilité, bradycardie ou apnées sans autre cause.</p><div class="lab">Mécanisme</div><p>La dilatation ventriculaire élève la pression intracrânienne ; les sutures et la fontanelle, non fermées, permettent au crâne de s’élargir.</p><div class="lab">Limite</div><p>Les valeurs normales du périmètre crânien ne figurent pas dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-htic" data-title="Hypertension intracrânienne de l’enfant">
<div class="lab">Contenu</div><p>Céphalées, vomissements, œdème papillaire, parésie du regard vers le haut, paralysie du VI. Bradycardie, apnées, vomissements, œdème papillaire et irritabilité sont des signes d’hypertension intracrânienne chez l’enfant.</p><div class="lab">Limite</div><p>La triade de Cushing ne figure pas dans les sources lues : elle n’est donc pas développée.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-triade" data-title="Triade de l’iNPH">
<div class="lab">Fréquences</div><p>Trouble de la marche : 94–100 % ; trouble cognitif : 78–98 % ; trouble urinaire : 60–92 % ; triade complète : environ 60 % (12,1 % dans une enquête japonaise de 1524 patients).</p><div class="lab">Application</div><p>À Lausanne, 86 patients d’âge moyen 76 ans : marche 94,2 %, cognition 75,6 %, vessie 60,5 %.</p><div class="lab">Limite</div><p>Les fourchettes tiennent à la méthode des études ; l’étude lausannoise est monocentrique.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.1159/000553392" target="_blank" rel="noopener">Protocole interdisciplinaire de Lausanne (CHUV), Neurodegener Dis 2026</a>.</p></template>
<template data-pop="g91-marche" data-title="Marche de l’iNPH">
<div class="lab">Technique</div><p>Observer la marche courte en ligne droite et le test chronométré « Timed Up and Go » (TUG). Chercher petits pas, marche « magnétique », élargissement du polygone de sustentation, freezing, pieds en dehors et variabilité de la longueur du pas.</p><div class="lab">Piège</div><p>Contrairement à la maladie de Parkinson, les indices externes aident peu.</p><div class="lab">Marche en double tâche</div><p>À Bâle (Felix Platter), la double tâche identifie 25,7 % de répondeurs supplémentaires au drainage, invisibles en marche simple (étude exploratoire).</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.1016/j.gaitpost.2026.110177" target="_blank" rel="noopener">Marche en simple et double tâche à Bâle, Gait Posture 2026 (résumé)</a>.</p></template>
<template data-pop="g91-cogn" data-title="Cognition de l’iNPH">
<div class="lab">Profil</div><p>Ralentissement psychomoteur, atteinte attentionnelle et de la mémoire de travail ; rappel libre altéré avec reconnaissance relativement préservée ; désorientation et troubles mnésiques plus légers que dans la maladie d’Alzheimer. Dans l’étude européenne, RAVLT, Grooved Pegboard et Stroop discriminent les iNPH des témoins (AUC 0,86–0,95).</p><div class="lab">Application</div><p>Le profil frontal oriente vers l’iNPH ; une atrophie hippocampique plus marquée oriente vers Alzheimer.</p><div class="lab">Limite</div><p>Données issues d’un résumé (S11) et de la ligne directrice japonaise.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.1016/j.clineuro.2011.09.014" target="_blank" rel="noopener">Neuropsychologie de l’Eu-iNPH, Clin Neurol Neurosurg 2012 (résumé)</a>.</p></template>
<template data-pop="g91-front" data-title="Signes frontaux">
<div class="lab">Valeurs</div><p>Dans une série de 26 patients : réflexe de museau 84 %, glabellaire 77 %, paratonie 65 %, palmo-mentonnier 61 % ; apathie 70,3 %.</p><div class="lab">Limite</div><p>Petite série ; les techniques d’examen ne sont pas détaillées dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-neuropsy" data-title="Symptômes neuropsychiatriques de l’iNPH">
<div class="lab">Contenu</div><p>Méta-analyse de 22 études : apathie 69,2 %, dépression 30,1 %, agitation 22,6 %, anxiété 21,9 %.</p><div class="lab">Limite</div><p>Douze études sur 22 sont de faible qualité.</p><p class="src">Références : <a href="https://doi.org/10.1212/CPJ.0000000000200586" target="_blank" rel="noopener">Symptômes neuropsychiatriques de l’iNPH, Neurol Clin Pract 2026 (résumé)</a>.</p></template>
<template data-pop="g91-crit" data-title="Critères diagnostiques japonais de l’iNPH">
<div class="lab">Contenu</div><p>Possible : au moins un symptôme de la triade, non expliqué par une autre maladie, sans cause évidente de dilatation ventriculaire. Probable : critères de possible, pression du LCS ≤ 200 mmH2O avec contenu normal, et soit DESH avec trouble typique de la marche, soit amélioration après tap test ou drainage. Certaine : amélioration objective après dérivation.</p><div class="lab">Limite</div><p>Critères japonais, ni suisses ni européens. Les recommandations américaines de l’AAN (2015) ont été écartées comme fondement.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-evans" data-title="Imagerie : index d’Evans, angle calleux, DESH">
<div class="lab">Valeurs</div><p>Index d’Evans > 0,3 (moyenne 0,356 dans SINPHONI). Angle calleux < 90° : à 90°, sensibilité 97 % et spécificité 88 % contre Alzheimer. DESH : ventriculomégalie, dilatation des vallées sylviennes, étroitesse des espaces sous-arachnoïdiens de haute convexité et médians ; présent chez 64 % des iNPH, avec VPP 77 % et VPN 25 % pour une iNPH certaine.</p><div class="lab">Erreur fréquente</div><p>Conclure à une iNPH sur le seul index d’Evans : il traduit la dilatation, pas son mécanisme.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-tap" data-title="Test de soustraction de LCS (tap test)">
<div class="lab">Technique</div><p>Retrait de 30 ou 50 mL de LCS, sans différence entre les deux volumes. Évaluation de la marche à 2–4 heures, vers 24 heures, puis plusieurs fois la première semaine ; cognition et vessie s’améliorent plus tard que la marche.</p><div class="lab">Performances</div><p>Sensibilité 58 % (26–87), spécificité 75 % (33–100). Le drainage continu n’est pas supérieur au tap test pour prédire la réponse.</p><div class="lab">Limite</div><p>Une réponse négative n’exclut pas une réponse à la dérivation.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-ddalz" data-title="Maladie d’Alzheimer ou iNPH ?">
<div class="lab">Éléments</div><p>Atrophie hippocampique plus marquée dans Alzheimer ; angle calleux < 90° et DESH en faveur de l’iNPH ; dans le LCS, Aβ42 abaissé comme dans Alzheimer mais p-tau et t-tau plus bas.</p><div class="lab">Limite</div><p>La maladie d’Alzheimer figure parmi les comorbidités qui pèsent sur le résultat à long terme de la dérivation.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-ddsynu" data-title="Synucléinopathies et maladie de Parkinson">
<div class="lab">Contenu</div><p>Maladie à corps de Lewy suspectée chez 21 des 127 iNPH certaines. Indices : rigidité des membres supérieurs, anosmie, hallucinations, dysautonomie, fluctuations.</p><div class="lab">Limite</div><p>Revue narrative, résumé seul.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a> ; <a href="https://doi.org/10.3390/diagnostics16182889" target="_blank" rel="noopener">α-Synucléine et iNPH, Diagnostics 2026 (résumé)</a>.</p></template>
<template data-pop="g91-ddvasc" data-title="Maladie vasculaire des petits vaisseaux">
<div class="lab">Contenu</div><p>La leucopathie périventriculaire est plus fréquente dans les iNPH sévères, mais non nécessaire ; elle suggère une composante ischémique.</p><div class="lab">Limite</div><p>Les chiffres de fréquence ne figurent pas dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-dysf" data-title="Dysfonction de dérivation de l’enfant">
<div class="lab">Contenu</div><p>Irritabilité, baisse d’activité, anorexie, nausées, vomissements, céphalées. L’obstruction proximale est la plus fréquente ; les moins de 6 mois sont plus à risque.</p><div class="lab">Limite</div><p>Le taux d’échec des dérivations à 1–2 ans n’a pas été lu.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-lausanne" data-title="Protocole lausannois (CHUV)">
<div class="lab">Étapes</div><p>Évaluation neurologique au Leenaards Memory Center, neuropsychologie, tap test avec physiothérapeute avant et 24 heures après, consultation neurochirurgien-neurologue, board. Suivi à 6 semaines, 6 et 12 mois.</p><div class="lab">Résultats</div><p>86 patients (âge moyen 76 ans) ; 44 candidats discutés, 27 recommandés pour dérivation VP ; 92 % d’amélioration de la marche à 6 semaines chez 16 opérés.</p><div class="lab">Limite</div><p>Étude rétrospective monocentrique, 16 opérés, suivi court.</p><p class="src">Références : <a href="https://doi.org/10.1159/000553392" target="_blank" rel="noopener">Protocole interdisciplinaire de Lausanne (CHUV), Neurodegener Dis 2026</a>.</p></template>
<template data-pop="g91-pens" data-title="Essai PENS">
<div class="lab">Méthode</div><p>99 patients répondeurs au drainage ; valve ouverte à 110 mmH2O contre placebo à plus de 400 mmH2O ; suivi 3 mois.</p><div class="lab">Résultats</div><p>Vitesse de marche +0,23 contre +0,03 m/s (différence 0,21 ; IC95 % 0,12–0,31). Tinetti amélioré ; MoCA et vessie non significatifs. Chutes 24 % contre 46 % ; hématome sous-dural 12 % contre 2 % ; céphalées posturales 59 % contre 28 %.</p><div class="lab">Limite</div><p>Essai nord-américain à co-investigateurs suédois : donnée probante, pas une recommandation. Validité externe et durabilité limitées selon un commentaire néerlandais.</p><p class="src">Références : <a href="https://doi.org/10.1056/NEJMoa2503109" target="_blank" rel="noopener">Essai PENS, N Engl J Med 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/42820276/" target="_blank" rel="noopener">Commentaire néerlandais, Ned Tijdschr Geneeskd 2026</a>.</p></template>
<template data-pop="g91-euinph" data-title="Étude européenne Eu-iNPH">
<div class="lab">Méthode</div><p>13 centres européens, 142 patients, dérivation ventriculo-péritonéale programmable, sélection clinique et radiologique seule, étude non contrôlée.</p><div class="lab">Résultats</div><p>À 1 an : amélioration 69 % (mRS) et 84 % (échelle iNPH) ; vie autonome 53 % → 82 % ; complications 28 % (13 % conservatrices, 15 % chirurgicales). Ni la classification ni la comorbidité n’ont modifié l’amélioration.</p><div class="lab">Limite</div><p>Résumé seul ; absence de groupe contrôle.</p><p class="src">Références : <a href="https://doi.org/10.1111/j.1600-0404.2012.01676.x" target="_blank" rel="noopener">Étude multicentrique européenne Eu-iNPH, Acta Neurol Scand 2012 (résumé)</a>.</p></template>
<template data-pop="g91-typederiv" data-title="Types de dérivation, valves et réglage">
<div class="lab">Contenu</div><p>Ventriculo-péritonéale, lombo-péritonéale, ventriculo-atriale. Valve programmable recommandée (grade 1, niveau B) ; dispositif anti-siphon ou gravitationnel en cas d’hypotension intracrânienne. Réglage : départ haut avec baisse progressive (moins d’hyperdrainage, amélioration plus lente) ou pression fixe à 12 cmH2O (hyperdrainage 9/34).</p><div class="lab">Limite</div><p>Comparaisons issues de petites séries.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
<template data-pop="g91-pedchir" data-title="Chirurgie pédiatrique : dérivation et ETV">
<div class="lab">Contenu</div><p>Dérivation VP = pilier. ETV ± cautérisation des plexus choroïdes pour les causes obstructives, surtout avant 2 ans. Solutions temporaires du prématuré : drain ventriculaire externe, cathéter intrathécal lombaire, dérivation ventriculo-sous-galéale, réservoir d’accès ventriculaire avec ponctions répétées.</p><div class="lab">Limite</div><p>Échec d’ETV possible jusqu’à 8 ans après.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-tuberc" data-title="Méningite tuberculeuse de l’enfant">
<div class="lab">Contenu</div><p>Jusqu’à 85 % des enfants développent une hydrocéphalie ; dans la forme communicante, un traitement médical est possible en première ligne.</p><div class="lab">Limite</div><p>Le traitement antituberculeux n’est pas détaillé dans le dossier.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-basics" data-title="Essai BASICS">
<div class="lab">Méthode</div><p>1605 patients de 21 centres du Royaume-Uni et d’Irlande, du nouveau-né à 91 ans ; trois bras : cathéter standard, imprégné d’antibiotiques (rifampicine et clindamycine), imprégné d’argent.</p><div class="lab">Résultats</div><p>Infection 6,0 % / 2,2 % (HR 0,38) / 5,9 % (argent, non supérieur) ; échec toutes causes 25 % sans différence.</p><div class="lab">Limite</div><p>Résumé seul ; aucune donnée suisse sur la disponibilité de ces cathéters n’a été lue.</p><p class="src">Références : <a href="https://doi.org/10.3310/hta24170" target="_blank" rel="noopener">Essai BASICS, Health Technol Assess 2020 (résumé)</a>.</p></template>
<template data-pop="g91-hyperdr" data-title="Hyperdrainage : définition consensuelle">
<div class="lab">Contenu</div><p>Delphi de 18 experts, majoritairement européens : céphalées posturales soulagées en décubitus (irritabilité chez le nourrisson), collapsus ventriculaire (moins de 18 ans), collections sous-durales non traumatiques (tout âge). Définitions distinctes avant 1 an, de 1 à 7 ans, après 7 ans, adulte. Chez l’enfant : céphalées, nausées, vomissements, vision floue, vertiges.</p><div class="lab">Limite</div><p>Consensus d’experts, résumé seul.</p><p class="src">Références : <a href="https://doi.org/10.1007/s00701-026-06892-6" target="_blank" rel="noopener">Définition consensuelle de l’hyperdrainage, Acta Neurochir 2026 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12091269/" target="_blank" rel="noopener">Hydrocéphalie pédiatrique, Nat Rev Dis Primers 2024</a>.</p></template>
<template data-pop="g91-pronostic" data-title="Pronostic de l’iNPH et coût-efficacité">
<div class="lab">Contenu</div><p>Amélioration mRS : 63–84 % à 1 an, 69 % à 2 ans, 60–74 % à 3–6 ans. Marche 60–77 %, cognition 61–69 %, incontinence 52 %. Index de Kiefer ≤ 3 : 93 % améliorés à 2 ans ; ≥ 6 : aucune amélioration attendue. Modèle suédois : +2,2 années de vie, +1,7 QALY pour 13 000 €.</p><div class="lab">Limite</div><p>L’histoire naturelle de l’iNPH non opérée n’a pas été lue ; le modèle économique est suédois.</p><p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7905302/" target="_blank" rel="noopener">Lignes directrices japonaises sur l’hydrocéphalie à pression normale idiopathique, 3e éd. 2021 (ni suisses ni européennes)</a>.</p></template>
