<template data-pop="g03-d-ceftriaxone" data-title="Ceftriaxone : place dans la suspicion de méningite"><h3>Place et preuve</h3><p>La recommandation allemande de 2023 retient, en schéma empirique chez l’adulte, la ceftriaxone à 2 g deux fois par jour associée à l’ampicilline ; la vancomycine ou la rifampicine s’ajoute si des pneumocoques résistants sont probables. L’information professionnelle suisse (Ceftriaxon Labatec®, juin 2025) mentionne la méningite parmi ses indications.</p><h3>Posologie</h3><p>L’information professionnelle indique chez l’adulte 1 à 2 g par 24 heures, jusqu’à 4 g. La dose méningée de 2 × 2 g provient de la recommandation allemande.</p><h3>Pharmacocinétique utile</h3><p>Dans le liquide céphalo-rachidien, la ceftriaxone atteint environ 2 % de sa concentration plasmatique sans inflammation et jusqu’à 25 % avec des méninges enflammées.</p><h3>Éléments non repris</h3><p>Le mécanisme d’action, les effets indésirables, les contre-indications et la surveillance ne figurent pas dans le dossier de recherche de ce cours ; ils relèvent de l’information professionnelle complète.</p></template>
<template data-pop="g03-d-ampicilline" data-title="Ampicilline : schéma empirique"><h3>Ce que le dossier contient</h3><p>La recommandation allemande de 2023 donne l’ampicilline à 2 g six fois par jour, en association avec la ceftriaxone, dans le schéma empirique de l’adulte.</p><h3>Lacune</h3><p>Aucune information professionnelle suisse de l’ampicilline ou de l’amoxicilline par voie intraveineuse n’a été lue ; les effets indésirables, contre-indications et surveillance ne sont pas documentés ici.</p></template>
<template data-pop="g03-d-dexa" data-title="Dexaméthasone : adjuvant de la méningite bactérienne"><h3>Place et posologie</h3><p>La recommandation allemande de 2023 prévoit la dexaméthasone à 10 mg par voie intraveineuse, avec les antibiotiques et sans délai, puis 10 mg quatre fois par jour, poursuivie 4 jours si le germe est un pneumocoque.</p><h3>Lacune</h3><p>Aucune information professionnelle suisse de la dexaméthasone n’a été lue ; mécanisme, effets indésirables et surveillance ne sont pas documentés ici. Son emploi dans ce cours concerne la suspicion bactérienne, non la méningite virale confirmée.</p></template>
<template data-pop="g03-d-aciclovir" data-title="Aciclovir intraveineux : information professionnelle suisse"><h3>Indication et posologie</h3><p>Chez l’adulte, l’encéphalite à HSV se traite à 10 mg/kg toutes les 8 heures pendant 10 jours ; les autres infections à HSV à 5 mg/kg toutes les 8 heures. Chez le nouveau-né, 20 mg/kg toutes les 8 heures, pendant 21 jours en cas d’atteinte du système nerveux central. La méningite à HSV n’est pas une indication nommée dans l’information professionnelle (Aciclovir Labatec® i.v., mise à jour de décembre 2025).</p><h3>Mode d’administration</h3><p>Perfusion lente sur une heure, avec une hydratation suffisante.</p><h3>Effets indésirables et surveillance</h3><p>La dose s’adapte à la clairance de la créatinine. L’insuffisant rénal et la personne âgée s’exposent à une néphrotoxicité et à des troubles neurologiques.</p><h3>Preuve dans la méningite récurrente</h3><p>Dans la méningite de Mollaret, l’aciclovir est utilisé pour les épisodes sans donnée contrôlée (Shalabi et Whitley 2006).</p><div class="trap"><span class="k">Piège</span> Retarder l’aciclovir dans une suspicion d’encéphalite pour attendre la ponction : la recommandation de 2025 le donne immédiatement, même sans ponction.</div></template>
<template data-pop="g03-d-valaciclovir" data-title="Valaciclovir : indication autorisée et essai dans HSV-2"><h3>Information professionnelle suisse</h3><p>Valaciclovir-Mepha (mise à jour de décembre 2025) prévoit la prévention des récidives herpétiques cutanéo-muqueuses à 500 mg par jour, à réévaluer au plus tard à 12 mois. Elle ne prévoit aucune indication méningée.</p><h3>Preuve</h3><p>Un essai suédois en double aveugle a testé, après une méningite à HSV-2, le valaciclovir à 1 g trois fois par jour pendant une semaine, puis 0,5 g deux fois par jour pendant un an. Il n’a pas réduit les récidives ; les récidives ont été plus fréquentes la deuxième année après l’arrêt (rapport de risque 3,29), ce qui évoque un possible effet rebond. Cet emploi n’est donc pas recommandé.</p><h3>Éléments non repris</h3><p>Mécanisme, contre-indications et surveillance ne sont pas détaillés dans le dossier.</p></template>
<template data-pop="g03-d-ibuprofene" data-title="Ibuprofène : méningite aseptique, effet rare"><h3>Information professionnelle suisse</h3><p>Ibuprofen-Mepha Teva (mise à jour de décembre 2024) range la méningite aseptique dans les mises en garde et parmi les effets indésirables rares. Des cas isolés sont décrits chez des patients atteints de lupus érythémateux ou de collagénose, mais aussi sans maladie chronique.</p><h3>Conduite</h3><p>Arrêt du médicament, exclusion des causes infectieuses par l’analyse du liquide, et absence de réexposition. Les posologies de l’ibuprofène ne sont pas reprises dans ce cours.</p></template>
<template data-pop="g03-d-privigen" data-title="Immunoglobulines intraveineuses (Privigen®) : méningite aseptique"><h3>Information professionnelle suisse</h3><p>Privigen® (mise à jour de juillet 2025) décrit un syndrome de méningite aseptique, effet indésirable occasionnel. Il survient de quelques heures jusqu’à 2 jours après la perfusion, plus fréquemment à des doses d’au moins 2 g/kg et à débit élevé, chez des patients migraineux prédisposés.</p><h3>Liquide et évolution</h3><p>Le liquide montre souvent une pléiocytose jusqu’à plusieurs milliers par mm³, majoritairement granulocytaire, et des protéines jusqu’à plusieurs centaines de mg/dl. La rémission survient en quelques jours sans séquelles après l’arrêt. Le liquide est indispensable pour exclure une autre cause.</p></template>
<template data-pop="pareto-g03-clin" data-title="Pareto — Notions, mécanismes et clinique"><p class="ratio" data-cover="g03-0,g03-1,g03-2,g03-3,g03-4,g03-5,g03-6"></p><ul><li>G03 réunit les méningites non bactériennes classées par forme : liquide clair (G03.0), chronique (G03.1), récurrente de Mollaret (G03.2), autres causes précisées (G03.8) et sans précision (G03.9). Avec une atteinte du parenchyme, le code est G04.</li><li>Les entérovirus dominent (39 % des agents identifiés au Danemark), HSV-2 vient avec 16 %, et 27 % des épisodes restent sans agent ; la raideur de nuque manque dans près de deux cas sur trois.</li><li>L’inflammation ouvre la barrière hémato-méningée : cellules, protéines et médicaments entrent. Le liquide viral précoce peut être mixte pendant 4 à 48 heures.</li><li>Trois questions décident : depuis combien de temps, y a-t-il eu des épisodes identiques, quel médicament dans la semaine précédente.</li><li>Conscience, signes focaux ou crises sortent du chapitre vers G04 et commandent le traitement empirique.</li></ul></template>
<template data-pop="pareto-g03-diag" data-title="Pareto — Diagnostic et urgences"><p class="ratio" data-cover="g03-7,g03-8"></p><ul><li>Quatre paramètres du liquide : cellules avec formule, protéines, lactate ou rapport glucose. Le profil viral cumule des valeurs basses ; le bactérien des valeurs hautes ; le tuberculeux est mixte.</li><li>Un tiers des méningites pneumococciques ont moins de 1000 cellules par µl ; le lactate sépare mieux que la cellularité sans antibiotique préalable ; la procalcitonine négative seule n’exclut pas le bactérien.</li><li>Bactérien non exclu : hémocultures, ponction immédiate si aucun signe de gravité, puis dexaméthasone et antibiotiques ; avec signe de gravité, traitement d’abord, imagerie ensuite, ponction enfin ; délai de plus de 3 heures à éviter.</li><li>Suspicion d’encéphalite herpétique : aciclovir immédiat, même sans ponction.</li><li>Imputabilité médicamenteuse : début rapide, régression à l’arrêt, récidive à la réexposition, causes infectieuses exclues.</li></ul></template>
<template data-pop="pareto-g03-crit" data-title="Pareto — Prise en charge, suivi et critères"><p class="ratio" data-cover="g03-9,g03-10,g03-11,g03-12"></p><ul><li>Viral bénin : traitement symptomatique. Médicamenteux : arrêt, corticoïdes si forme sévère. Immunoglobulines : dose d’au moins 2 g/kg ou débit élevé, rémission en quelques jours.</li><li>Mollaret : guérison spontanée ; le valaciclovir d’un an n’a pas réduit les récidives et a été suivi d’un excès de récidives la deuxième année (rapport de risque 3,29) ; chercher les causes réversibles.</li><li>Chronique : anomalies du liquide depuis au moins un mois, pas de démarche standardisée.</li><li>Nouveau-né : aciclovir 20 mg/kg toutes les 8 heures, 21 jours si le système nerveux central est atteint ; immunodéprimé : imagerie avant ponction ; diabétique : rapport glucose prudent.</li><li>Aucun critère diagnostique formel de Mollaret n’a été lu.</li></ul></template>
<template data-pop="pareto-g03-exam" data-title="Pareto — Examens complémentaires"><p class="ratio" data-cover="g03-e-1,g03-e-2,g03-e-3,g03-e-4"></p><ul><li>Le standard de référence est l’analyse du liquide obtenu par ponction lombaire, complétée par la PCR sur liquide non centrifugé.</li><li>Tomodensitométrie avant ponction seulement dans quatre situations ; IRM pour l’encéphalite.</li><li>Cellules de Mollaret et séquençage : non systématiques. Index d’anticorps supérieur à 1,5 : surtout après 10 jours.</li><li>Liquide à température ambiante, à l’abri de la lumière, en 2 heures au plus.</li></ul></template>
<template data-pop="pareto-g03-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="g03-s-physio-body"></p><ul><li>L’ouverture de la barrière explique la pléiocytose, l’hyperprotéinorachie et la meilleure pénétration des antibiotiques : environ 2 % sans inflammation, jusqu’à 25 % avec inflammation pour la ceftriaxone.</li></ul></template>
<template data-pop="pareto-g03-s-viro" data-title="Pareto — Virologie et immunologie"><p class="ratio" data-cover="g03-s-viro-body"></p><ul><li>Entérovirus 39 %, HSV-2 16 %, VZV 15 % ; Mollaret lié à la réactivation d’HSV-2.</li><li>Deux voies médicamenteuses : irritation directe (voie intrathécale) et hypersensibilité (voie systémique).</li></ul></template>
<template data-pop="pareto-g03-s-cyto" data-title="Pareto — Cytologie"><p class="ratio" data-cover="g03-s-cyto-body"></p><ul><li>Liquide viral mixte de 25 à 1000 cellules par µl pendant 4 à 48 heures, puis lymphocytaire.</li><li>La cellule de Mollaret, surtout vue dans les 24 premières heures, est non spécifique.</li></ul></template>
<template data-pop="pareto-g03-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g03-p-1,g03-p-2,g03-p-3,g03-p-4,g03-p-5"></p><ul><li>Empirique : ceftriaxone 2 g deux fois par jour avec ampicilline 2 g six fois par jour, dexaméthasone 10 mg ; aciclovir 10 mg/kg toutes les 8 heures dans l’encéphalite.</li><li>Aciclovir : perfusion lente, hydratation, adaptation à la clairance de la créatinine.</li><li>Valaciclovir : 500 mg par jour pour les récidives cutanéo-muqueuses, sans indication méningée ni effet démontré dans Mollaret.</li><li>Médicaments causaux : ibuprofène (rare), immunoglobulines intraveineuses (doses d’au moins 2 g/kg, débit élevé) ; le traitement est l’arrêt.</li></ul></template>
