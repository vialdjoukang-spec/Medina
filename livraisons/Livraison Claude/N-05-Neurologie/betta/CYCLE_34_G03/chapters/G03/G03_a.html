<section class="ilot" id="g03-0"><h2><span class="n">0</span>Question clinique</h2><p>Les vignettes de ce chapitre sont des cas pédagogiques fictifs ; leurs décisions illustrent les critères des sources citées.</p><p>Un homme de 29 ans consulte en août pour une céphalée intense installée depuis deux jours, avec une fièvre, une gêne à la lumière et une raideur de nuque modérée. Il est éveillé, orienté, sans déficit moteur ni crise. La <button class="w" data-k="g03-plio">ponction lombaire</button> ramène un liquide clair contenant 210 cellules par µl, à prédominance lymphocytaire. Les protéines, le <button class="w" data-k="g03-lactate">lactate</button> et le <button class="w" data-k="g03-index-glucose">rapport glucose</button> sont normaux ou peu modifiés. Aucun germe n’est visible à l’examen direct.</p><p><b>La question de l’examen n’est pas « de quel virus s’agit-il ? ». Elle est : ce tableau permet-il d’écarter, avec sûreté, une méningite bactérienne et une encéphalite herpétique, deux maladies traitables dont le traitement ne doit pas être différé ?</b> Les recommandations allemandes sur la méningite bactérienne ont été conçues pour ce tri : devant une méningite non précisée, elles fournissent les critères qui séparent le profil bactérien du profil viral (<a href="https://register.awmf.org/assets/guidelines/030-089l-S2k_Ambulant-erworbene-bakterielle-Meningoenzephalitis-im-Erwachsenenalter_2023-05.pdf" target="_blank" rel="noopener">DGN/AWMF 030/089, 2023</a>).</p><p>Une fois ce tri fait, il reste à classer le tableau : aigu et lymphocytaire, chronique depuis au moins un mois, récidivant, ou déclenché par un médicament. Chaque classe a sa logique diagnostique et son traitement. À la fin de ce chapitre, le lecteur sait comment la <button class="w" data-k="g03-codage">classification G03</button> se découpe, quels chiffres du liquide céphalo-rachidien décident, quand l’imagerie précède la ponction, quel traitement ne doit jamais attendre, et quels médicaments provoquent eux-mêmes une méningite.</p><div class="key"><b>À retenir.</b> Devant un syndrome méningé à liquide non purulent, on exclut d’abord le traitable (bactérien, herpétique), puis on classe : aigu, chronique, récidivant, médicamenteux.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN/AWMF 030/100, méningo-encéphalite virale, 2025</a> ; <a href="https://register.awmf.org/assets/guidelines/030-089l-S2k_Ambulant-erworbene-bakterielle-Meningoenzephalitis-im-Erwachsenenalter_2023-05.pdf" target="_blank" rel="noopener">DGN/AWMF 030/089, méningo-encéphalite bactérienne, 2023</a>.</p></section>
<section class="ilot" id="g03-1"><h2><span class="n">1</span>Définitions et codage</h2><p>La rubrique G03 réunit les méningites dont la cause n’est ni bactérienne, classée en G00, ni rattachée à une maladie classée ailleurs, classées en G01 et G02. Le BfArM y range l’arachnoïdite, la leptoméningite, la méningite et la pachyméningite dues à d’autres causes ou à une cause non précisée (<a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024</a>). La méningo-encéphalite et la méningomyélite en sont exclues : elles relèvent de G04, car l’atteinte du parenchyme change la gravité et la conduite. Le tableau liste les cinq sous-codes avec leur intitulé de l’Office fédéral de la statistique.</p><table class="t"><tr><th>Sous-code</th><th>Intitulé</th><th>Ce qu’il recouvre</th></tr><tr><td>G03.0</td><td>Méningite à liquide clair</td><td>Inclut la méningite abactérienne, dite « non purulente »</td></tr><tr><td>G03.1</td><td>Méningite chronique</td><td>Inflammation méningée dont les anomalies du liquide persistent au moins un mois</td></tr><tr><td>G03.2</td><td>Méningite récurrente bénigne [Mollaret]</td><td>Épisodes aseptiques répétés, séparés par des intervalles libres</td></tr><tr><td>G03.8</td><td>Méningite due à d’autres causes précisées</td><td>Le rattachement de la méningite médicamenteuse à ce sous-code n’a pas été vérifié dans l’index alphabétique : à confirmer par le codeur</td></tr><tr><td>G03.9</td><td>Méningite, sans précision</td><td>Inclut l’arachnoïdite spinale sans précision</td></tr></table><p>Le tableau montre que le critère de classement n’est pas l’agent, mais la forme évolutive : liquide clair, chronique, récurrente. Ce choix pratique explique pourquoi une méningite virale aiguë sans virus identifié se code en G03.0 ou G03.9, alors qu’une méningite dont le virus est identifié se code selon son agent. La dernière ligne du tableau l’illustre : la case G03.8 attend une cause précisée, et seul le codeur tranche.</p><h3>Quatre définitions à connaître</h3><p><b>Méningite virale ou abactérienne aiguë.</b> Elle associe <button class="w" data-k="g03-menin-virale">céphalées, nausées, raideur de nuque, photophobie et phonophobie</button>, sans signe focal ni trouble de conscience. Le liquide contient moins de 1000 cellules par µl, avec des protéines et un lactate normaux ou peu élevés ; elle régresse spontanément en quelques jours à quelques semaines (DGN/AWMF 2025, § 1.2).</p><p><b>Méningite chronique.</b> C’est une <button class="w" data-k="g03-chronique">inflammation méningée d’installation subaiguë</button> dont les anomalies du liquide, pléiocytose et hyperprotéinorachie, persistent au moins un mois (Helbok 2009 ; Hildebrand 2003).</p><p><b>Méningite récurrente bénigne lymphocytaire, ou <button class="w" data-k="g03-mollaret">méningite de Mollaret</button>.</b> C’est une méningite aseptique récidivante, habituellement bénigne et douloureuse, avec des symptômes neurologiques transitoires chez la moitié des patients (Shalabi et Whitley 2006). Certains auteurs réservent le nom de Mollaret aux formes idiopathiques (Wang 2025).</p><p><b>Méningite aseptique médicamenteuse.</b> C’est un tableau de méningite sans agent bactérien ni fongique dans le liquide, déclenché par un médicament ; le diagnostic est un diagnostic d’élimination (<button class="w" data-k="g03-medic">Yelehe-Okouma 2018</button>).</p><div class="trap"><span class="k">Erreur fréquente</span> Coder en G03 une atteinte qui comporte un trouble de conscience, des crises ou un déficit focal. Ces signes désignent une méningo-encéphalite, donc le chapitre <button class="w" data-k="g03-encephalite">G04, hors de ce cours</button>, et une prise en charge différente.</div><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g00-g09.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G00–G09</a> ; <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN/AWMF 2025</a> ; <a href="https://doi.org/10.1007/s00415-009-0122-0" target="_blank" rel="noopener">Helbok 2009</a> ; <a href="https://doi.org/10.1007/s00415-003-1101-5" target="_blank" rel="noopener">Hildebrand 2003</a> ; <a href="https://doi.org/10.1086/508281" target="_blank" rel="noopener">Shalabi 2006</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12711459/" target="_blank" rel="noopener">Wang 2025</a> ; <a href="https://doi.org/10.1111/fcp.12349" target="_blank" rel="noopener">Yelehe-Okouma 2018</a>.</p></section>
<section class="ilot" id="g03-2"><h2><span class="n">2</span>Épidémiologie</h2><p>L’incidence des infections virales du système nerveux central est citée à 10 à 20 pour 100 000, d’après des données nord-américaines anciennes ; elle dépasse nettement celle de la méningite bactérienne (DGN/AWMF 2025, § 1.3). <b>Aucune donnée suisse n’a été lue pour ce chapitre</b> : ce chiffre est donc un ordre de grandeur étranger, non une incidence suisse.</p><p>Les agents les plus fréquents sont les <button class="w" data-k="g03-entero">entérovirus</button> (Coxsackie A et B, échovirus), puis les oreillons, les arbovirus, les herpèsvirus, le virus de l’immunodéficience humaine et le virus de la chorioméningite lymphocytaire. La vaccination contre les oreillons a fait reculer la méningo-encéphalite ourlienne. Les arbovirus circulent surtout en été, ce qui oriente l’anamnèse (voyage, piqûres de vecteurs).</p><p>La cohorte danoise de Petersen (2023) décrit 1066 épisodes chez 1045 patients. Le tableau en donne les chiffres principaux.</p><table class="t"><tr><th>Donnée de la cohorte danoise</th><th>Valeur</th></tr><tr><td>Céphalées</td><td>95 %</td></tr><tr><td>Fièvre</td><td>71 %</td></tr><tr><td>Photophobie ou phonophobie</td><td>67 %</td></tr><tr><td>Raideur de nuque</td><td>36 %</td></tr><tr><td>Triade complète de la recommandation</td><td>28 % seulement</td></tr><tr><td>Entérovirus identifié</td><td>39 %</td></tr><tr><td><button class="w" data-k="g03-hsv2">HSV-2</button> identifié</td><td>16 %</td></tr><tr><td>VZV identifié</td><td>15 %</td></tr><tr><td>Plusieurs agents détectés</td><td>3 %</td></tr><tr><td>Aucun agent identifié</td><td>27 %</td></tr></table><p>Ce tableau enseigne deux choses. Premièrement, la raideur de nuque manque chez près de deux patients sur trois : un examen sans raideur n’écarte donc pas la méningite, et la triade complète, présente chez 28 % seulement, ne peut pas servir de condition d’entrée dans la démarche. Deuxièmement, plus d’un quart des épisodes ne livrent aucun agent, et leur évolution est comparable à celle des cas identifiés. Ces cas sans agent constituent le contenu naturel de G03.0 et G03.9.</p><p>La méningite de Mollaret touche plus de 80 % de femmes, et environ 20 % des méningites à HSV-2 récidivent (Wang 2025, chiffres de seconde main). L’épidémiologie globale des méningites récurrentes n’est pas connue (Rosenberg et Galen 2017). La méningite chronique reste sans cause identifiée chez environ un tiers des patients (Helbok 2009). Dans une série de 108 patients atteints de méningite aseptique médicamenteuse, l’âge moyen était de 47 ans et 55 % étaient des femmes (Singh 2026).</p><div class="trap"><span class="k">Piège</span> Citer une incidence suisse de la méningite aseptique : le dossier de ce cours n’en contient pas. Il faut nommer la lacune et attribuer chaque chiffre à son pays.</div><div class="key"><b>À retenir.</b> Les entérovirus dominent, un quart des épisodes reste sans agent, et la triade classique manque dans près de trois cas sur quatre.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN/AWMF 2025, cohorte de Petersen 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12711459/" target="_blank" rel="noopener">Wang 2025</a> ; <a href="https://doi.org/10.1007/s11916-017-0635-7" target="_blank" rel="noopener">Rosenberg et Galen 2017</a> ; <a href="https://doi.org/10.1007/s00415-009-0122-0" target="_blank" rel="noopener">Helbok 2009</a> ; <a href="https://doi.org/10.1097/WNF.0000000000000667" target="_blank" rel="noopener">Singh 2026</a>.</p></section>
<section class="ilot" id="g03-3"><h2><span class="n">3</span>De la barrière à l’inflammation sans pus</h2><p>À l’état normal, la <button class="w" data-k="g03-barriere">barrière hémato-méningée</button> limite le passage des cellules et des protéines du sang vers le liquide céphalo-rachidien. Le liquide normal contient donc très peu de cellules et peu de protéines. Une inflammation des méninges ouvre cette barrière : des cellules et des protéines entrent, et le liquide s’enrichit. La ceftriaxone en donne une mesure indirecte : sans inflammation, elle atteint dans le liquide environ 2 % de sa concentration plasmatique ; avec des méninges enflammées, jusqu’à 25 % (information professionnelle suisse). Le médicament sert ici de traceur de la perméabilité.</p><h3>Méningite virale : la chronologie du liquide</h3><p>Pendant les 4 à 48 premières heures, la <button class="w" data-k="g03-plio">pléiocytose</button> est mixte, de 25 à 1000 cellules par µl, avec lymphocytes, monocytes et granulocytes ; elle devient ensuite lymphocytaire. Il n’y a pas de synthèse intrathécale d’immunoglobulines dans la méningite virale (DGN/AWMF 2025). La conséquence pratique est directe : <b>un premier liquide prélevé tôt peut contenir beaucoup de granulocytes et ressembler à un profil bactérien</b>. La cellularité seule ne départage pas ; les chiffres de lactate, de protéines et de glucose complètent la lecture.</p><h3>Méningite bactérienne : le contraste</h3><p>Dans la forme bactérienne, la granulocytose dépasse 1000 par µl, la barrière est sévèrement altérée (protéines supérieures à 1000 mg/l), le glucose du liquide est bas (moins de 30 mg/dl, ou rapport liquide sur sérum inférieur à 0,3) et le lactate dépasse 3,5 mmol/l (DGN/AWMF 2023, § 2.1). Ces seuils servent de repères de comparaison ; l’îlot 7 et l’onglet Examens les détaillent.</p><h3>Trois mécanismes propres à G03</h3><table class="t"><tr><th>Forme</th><th>Mécanisme décrit dans les sources</th><th>Conséquence pour la conduite</th></tr><tr><td>Médicamenteuse</td><td>Irritation méningée directe après administration intrathécale ; ou hypersensibilité immunologique après administration systémique (Yelehe-Okouma 2018). L’inflammation méningée est stérile (Singh 2026)</td><td>Rechercher le médicament ; l’arrêt guérit</td></tr><tr><td>Mollaret</td><td>Réactivation d’HSV-2, dont l’ADN est détecté par PCR dans le liquide (Shalabi 2006) ; associations rapportées avec kystes épidermoïdes, lymphome, lupus érythémateux disséminé, maladie de Behçet ; variants de gènes de l’autophagie évoqués (Wang 2025)</td><td>Chercher HSV-2 et une cause réversible</td></tr><tr><td>Chronique</td><td>Causes infectieuses (germes classiques et opportunistes) ou non infectieuses : carcinomateuse, maladie systémique, toxique (Hildebrand 2003 ; Helbok 2009)</td><td>Démarche d’exclusion longue, adaptée à l’immunité du patient</td></tr></table><p>Le tableau situe chaque forme sur un axe causal : la forme médicamenteuse a une cause externe retirable, la forme de Mollaret une cause infectieuse intermittente, et la forme chronique une cause à chercher. La ligne « médicamenteuse » est la seule dont le traitement est une soustraction ; c’est pourquoi l’anamnèse médicamenteuse est un geste diagnostique aussi important que la ponction lombaire.</p><div class="key"><b>À retenir.</b> L’inflammation méningée ouvre la barrière ; un liquide précoce peut être mixte ; et trois mécanismes spécifiques organisent G03 : médicament, réactivation d’HSV-2, maladie chronique.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN/AWMF 2025, diagnostic</a> ; <a href="https://register.awmf.org/assets/guidelines/030-089l-S2k_Ambulant-erworbene-bakterielle-Meningoenzephalitis-im-Erwachsenenalter_2023-05.pdf" target="_blank" rel="noopener">DGN/AWMF 2023, § 2.1</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680598760031" target="_blank" rel="noopener">Ceftriaxon Labatec®, pharmacocinétique</a> ; <a href="https://doi.org/10.1111/fcp.12349" target="_blank" rel="noopener">Yelehe-Okouma 2018</a> ; <a href="https://doi.org/10.1097/WNF.0000000000000667" target="_blank" rel="noopener">Singh 2026</a>.</p></section>
<section class="ilot" id="g03-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2><p>Le classement pédagogique des causes suit les sous-codes. Pour chaque groupe, le tableau cite les exemples lus dans les sources.</p><table class="t"><tr><th>Groupe</th><th>Exemples lus</th></tr><tr><td>Virale ou aseptique non identifiée (G03.0, G03.9)</td><td>Entérovirus, <button class="w" data-k="g03-hsv2">HSV-2</button>, VZV, adénovirus, virus Toscana (Italie), virus de la méningo-encéphalite verno-estivale, oreillons, virus d’Epstein-Barr, virus de l’immunodéficience humaine, parvovirus B19, herpèsvirus humain 6</td></tr><tr><td>Récurrente (G03.2)</td><td>HSV-2 dans 10 cas sur 13 d’une série et jusqu’à 85 % selon les revues ; HSV-1, virus d’Epstein-Barr et herpèsvirus humain 6, rares ; kystes épidermoïdes, lymphome, lupus, maladie de Behçet</td></tr><tr><td>Chronique (G03.1)</td><td>Infectieuses, classiques et opportunistes ; non infectieuses : carcinomateuse, maladie systémique, toxique, sarcoïdose, vascularite</td></tr><tr><td>Médicamenteuse (G03.8, rattachement à confirmer)</td><td>Anti-inflammatoires non stéroïdiens, surtout l’ibuprofène, avec le lupus érythémateux comme terrain prédisposant ; antibiotiques ; anticorps monoclonaux ; immunoglobulines intraveineuses chez les migraineux prédisposés</td></tr></table><p>Le tableau permet de ne pas multiplier les hypothèses : la plupart des cas aigus relèvent de la première ligne, et les trois autres lignes sont des questions de contexte, à poser quand l’anamnèse le suggère (épisodes antérieurs, durée, médicament récent). Le <button class="w" data-k="g03-medic">terrain lupique</button> et la migraine sont des facteurs de risque propres à deux familles de médicaments, sourcés dans les revues.</p><div class="trap"><span class="k">Piège</span> Conclure à « méningite virale » parce que le liquide est clair, sans rechercher un médicament récent. Le diagnostic médicamenteux est un diagnostic d’élimination ; il se pose après exclusion des causes infectieuses, mais il se prépare par une anamnèse précise.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN/AWMF 2025, tableau 1</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12711459/" target="_blank" rel="noopener">Wang 2025</a> ; <a href="https://doi.org/10.1086/508281" target="_blank" rel="noopener">Shalabi 2006</a> ; <a href="https://doi.org/10.1007/s11916-017-0635-7" target="_blank" rel="noopener">Rosenberg 2017</a> ; <a href="https://doi.org/10.1007/s00415-003-1101-5" target="_blank" rel="noopener">Hildebrand 2003</a> ; <a href="https://doi.org/10.1007/s00415-009-0122-0" target="_blank" rel="noopener">Helbok 2009</a> ; <a href="https://doi.org/10.1111/fcp.12349" target="_blank" rel="noopener">Yelehe-Okouma 2018</a> ; <a href="https://doi.org/10.1097/WNF.0000000000000667" target="_blank" rel="noopener">Singh 2026</a>.</p></section>
<section class="ilot" id="g03-5"><h2><span class="n">5</span>Interroger : durée, récidive, médicaments</h2><p>L’anamnèse est l’examen le plus rentable de ce chapitre, car elle distingue trois profils que le liquide seul sépare mal. Elle porte sur la durée, sur les épisodes antérieurs et sur les médicaments récents.</p><div class="two"><div class="card"><h4>Forme virale aiguë</h4><p>Le patient décrit une céphalée, une fièvre, un <button class="w" data-k="g03-menin-virale">méningisme</button>, une photophobie et une phonophobie, une asthénie et des myalgies. La triade est incomplète dans 72 % des méningites virales : l’absence de raideur de nuque n’exclut pas le diagnostic. Il faut demander voyages et piqûres de vecteurs, car les arbovirus circulent surtout en été.</p></div><div class="card"><h4>Forme médicamenteuse</h4><p>Les trois symptômes les plus fréquents sont la céphalée (78 %), la fièvre (65 %) et la raideur de nuque (56 %) ; une atteinte neurologique sévère est rapportée dans 17 % des cas (Singh 2026). Le début survient généralement dans la semaine suivant l’introduction du médicament, et en quelques heures en cas de réexposition (Yelehe-Okouma 2018). Avec les immunoglobulines intraveineuses, il survient de quelques heures à 2 jours après la perfusion (information professionnelle suisse de Privigen®).</p></div></div><div class="two"><div class="card"><h4>Forme récidivante (Mollaret)</h4><p>Presque tous les patients ont une céphalée ; plus de la moitié présentent photophobie, phonophobie ou fièvre. Le début est brutal, un épisode dure quelques jours, et les intervalles libres vont de semaines à années (Wang 2025). Il faut demander des épisodes antérieurs identiques et des lésions herpétiques cutanées pendant les épisodes.</p></div><div class="card"><h4>Signes qui changent le chapitre</h4><p>Trouble de conscience, signe focal ou crise : méningo-encéphalite, donc G04. Immunosuppression, crise ou déficit focal : indication d’une imagerie avant la ponction (DGN/AWMF 2023). Ces éléments sont à rechercher dès l’interrogatoire, car ils décident de l’ordre des gestes.</p></div></div><p>Le tableau des médicaments à nommer à l’interrogatoire reprend les familles lues dans les sources.</p><table class="t"><tr><th>Famille</th><th>Précision lue</th></tr><tr><td>Anti-inflammatoires non stéroïdiens</td><td>Surtout l’ibuprofène ; lupus érythémateux ou collagénose prédisposants, mais aussi sans maladie chronique</td></tr><tr><td>Antibiotiques</td><td>Famille rapportée dans les séries de cas ; la liste précise des molécules n’a pas été lue en détail</td></tr><tr><td>Anticorps monoclonaux</td><td>Famille rapportée dans les séries de cas</td></tr><tr><td>Immunoglobulines intraveineuses</td><td>Terrain migraineux prédisposant ; risque plus fréquent à des doses de 2 g/kg ou plus et à débit élevé</td></tr></table><p>Ce tableau fait de l’ordonnance un élément du diagnostic : chaque ligne correspond à une classe d’usage courant, et la chronologie début-arrêt-réexposition permet l’imputabilité (îlot 7).</p><div class="trap"><span class="k">Erreur fréquente</span> Interroger sur « les médicaments » en général. Il faut citer les classes (anti-inflammatoires, antibiotiques, anticorps, immunoglobulines) et dater l’introduction : un patient oublie l’ibuprofène pris en automédication.</div><div class="key"><b>À retenir.</b> Trois questions décident : depuis combien de temps, déjà des épisodes identiques, quel médicament dans la semaine précédente.</div><p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-100l_S1_Virale_Meningoenzephalitis_2025-02.pdf" target="_blank" rel="noopener">DGN/AWMF 2025</a> ; <a href="https://doi.org/10.1097/WNF.0000000000000667" target="_blank" rel="noopener">Singh 2026</a> ; <a href="https://doi.org/10.1111/fcp.12349" target="_blank" rel="noopener">Yelehe-Okouma 2018</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12711459/" target="_blank" rel="noopener">Wang 2025</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680583140015" target="_blank" rel="noopener">Privigen®</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680491560011" target="_blank" rel="noopener">Ibuprofen-Mepha Teva</a>.</p></section>
<section class="ilot" id="g03-6"><h2><span class="n">6</span>Examiner</h2><p>L’examen cherche à répondre à une seule question : le patient est-il uniquement méningé, ou le parenchyme est-il touché ? La première situation relève de G03, la seconde de G04, avec un traitement à instaurer sans attendre.</p><div class="two"><div class="card"><h4>Signes méningés (compatibles avec G03)</h4><p><button class="w" data-k="g03-menin-virale">Raideur de nuque, photophobie, phonophobie</button>, fièvre, céphalée. L’état de conscience est normal et l’examen neurologique ne trouve ni parésie, ni aphasie, ni crise. La raideur de nuque manque chez près de deux patients sur trois dans la cohorte danoise : son absence ne rassure pas.</p></div><div class="card"><h4>Signes parenchymateux (G04 ou urgence)</h4><p>Troubles quantitatifs ou qualitatifs de la <button class="w" data-k="g03-encephalite">conscience</button>, signes focaux (parésie, aphasie), crises. Le méningisme peut même manquer. Ces signes imposent un traitement empirique et une imagerie ; ils font envisager l’<button class="w" data-k="g03-d-aciclovir">aciclovir</button>.</p></div></div><p>L’examen se complète par la recherche de lésions herpétiques cutanées pendant un épisode, utiles en cas de récidive, et par l’évaluation de l’immunosuppression (indication d’une imagerie avant ponction). Il n’existe pas, dans les sources lues, de signe isolé qui sépare la forme virale de la forme médicamenteuse : cette distinction repose sur l’anamnèse et sur le liquide.</p><div class="trap"><span class="k">Piège</span> Se rassurer d’un examen neurologique normal chez un patient immunodéprimé. L’immunosuppression est en soi une indication d’imagerie avant la ponction lombaire (DGN/AWMF 2023).</div><div class="key"><b>À retenir.</b> Conscience, signes focaux et crises triés en premier : leur présence sort du chapitre G03 et commande le traitement empirique.</div><button class="pareto-btn ui" data-k="pareto-g03-clin">▲ Loi de Pareto — Notions, mécanismes et clinique</button></section>
