<template data-pop="i67-asd" data-title="Angiographie par soustraction numérique">
<h3>Rôle</h3>
<p>Référence invasive qui montre la lumière des artères et les collatérales. Elle confirme le moyamoya et évalue ses collatérales, elle est préférée à l’angio-IRM dans l’angéite primitive, et elle sert d’examen de comparaison pour le Doppler transcrânien dans le vasospasme.</p>
<h3>Limite</h3>
<p>Elle est réservée aux cas de discordance ou de doute : dans la thrombose veineuse, elle n’est demandée qu’en cas de discordance.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">ESO/EANS/ESMINT, hémorragie sous-arachnoïdienne anévrismale 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10683718/" target="_blank" rel="noopener">ESO, angéite primitive du système nerveux central 2023</a>.</p>
</template>
<template data-pop="i67-dissection" data-title="Dissection d’artère cérébrale">
<h3>Définition</h3>
<p>Lésion de la paroi artérielle réalisant une sténose segmentaire, une occlusion ou un anévrisme disséquant, souvent combinés. La dissection intracrânienne représente environ 11 % des dissections en Europe.</p>
<h3>Diagnostic certain</h3>
<p>Au moins un critère : sténose ou occlusion évoluant vers un anévrisme fusiforme ou irrégulier en site non bifurcatif ; hématome intramural, flap intimal ou double lumière ; confirmation anatomopathologique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8564160/" target="_blank" rel="noopener">ESO, dissection artérielle 2021</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69, BfArM</a>.</p>
</template>
<template data-pop="i67-moyamoya" data-title="Maladie et syndrome de moyamoya">
<h3>Définition</h3>
<p>Sténo-occlusion bilatérale progressive de la carotide interne supraclinoïdienne et de ses branches principales, avec réseau collatéral fragile dans les régions profondes. La maladie est idiopathique ; le syndrome est associé à la trisomie 21, à la neurofibromatose de type 1, à la drépanocytose ou à la radiothérapie cervico-céphalique.</p>
<h3>Pourquoi cette distinction</h3>
<p>Le dossier ne précise pas de différence thérapeutique entre maladie et syndrome ; les recommandations de l’ESO 2023 portent sur l’angiopathie de moyamoya en général.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a>.</p>
</template>
<template data-pop="i67-rnf213" data-title="Variant RNF213 p.R4810K">
<h3>Fait</h3>
<p>Effet fondateur est-asiatique : 95,1 % des cas familiaux et 79,2 % des cas sporadiques japonais. Absent des patients occidentaux.</p>
<h3>Décision</h3>
<p>Dépistage systématique non suggéré (consensus de 8 sur 10). En Suisse, il n’explique donc pas la maladie d’un patient européen.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a>.</p>
</template>
<template data-pop="i67-hemodynamique" data-title="Évaluation hémodynamique du moyamoya">
<h3>Principe</h3>
<p>Elle mesure la réserve cérébrovasculaire, chez tous les patients y compris asymptomatiques : Doppler transcrânien, perfusion par scanner ou IRM (avec ou sans acétazolamide), SPECT, TEP à l’eau marquée (H2 15O), cette dernière étant la plus utile car quantitative.</p>
<h3>Interprétation</h3>
<p>Réserve altérée, origine est-asiatique et accident transitoire antérieur : risque annuel d’accident vasculaire de 0,5 % à 20 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a>.</p>
</template>
<template data-pop="i67-pontage" data-title="Pontage direct dans le moyamoya hémorragique">
<h3>Donnée</h3>
<p>Chez l’adulte avec présentation hémorragique, le pontage direct est recommandé (recommandation faible). Dans l’essai JAM, le resaignement est de 11,9 % contre 31,6 % sans pontage (rapport de risque 0,36).</p>
<h3>Précautions</h3>
<p>Délai de 6 à 12 semaines après l’événement ; éviter déshydratation, fièvre, hyperventilation et hypotension ; centre de référence et neurochirurgien expérimenté.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a>.</p>
</template>
<template data-pop="i67-calabrese" data-title="Critères de Calabrese et Mallek">
<h3>Les trois éléments</h3>
<p>Déficit neurologique acquis inexpliqué ; aspect angiographique ou histologique classique d’angéite ; absence de vascularite systémique ou d’affection mimant l’angéite.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10683718/" target="_blank" rel="noopener">ESO, angéite primitive du système nerveux central 2023</a>.</p>
</template>
<template data-pop="i67-birnbaum" data-title="Critères de Birnbaum et Hellmann">
<h3>Deux niveaux</h3>
<p>Angéite <i>certaine</i> : histologie (biopsie ou autopsie). Angéite <i>probable</i> : angiographie de haute probabilité, IRM anormale et liquide cérébrospinal compatible, seulement pour la forme des gros et moyens vaisseaux.</p>
<h3>Rôle</h3>
<p>Ces critères visaient à séparer l’angéite du syndrome de vasoconstriction cérébrale réversible.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10683718/" target="_blank" rel="noopener">ESO, angéite primitive du système nerveux central 2023</a>.</p>
</template>
<template data-pop="i67-pres" data-title="Syndrome d’encéphalopathie postérieure réversible">
<h3>Définition</h3>
<p>Syndrome clinique-radiologique : céphalée, troubles visuels, confusion, crises, associé à un œdème vasogénique sous-cortical, pariéto-occipital dans plus de 90 % des cas. Réversible en jours à semaines.</p>
<h3>Mécanisme discuté</h3>
<p>Poussée tensionnelle avec faillite de l’autorégulation (hyperperfusion), vasoconstriction avec hypoperfusion, dysfonction endothéliale (facteur clé), activation immunitaire, rupture de la barrière hémato-encéphalique. Hémorragie dans environ 15 % des cas.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7033494/" target="_blank" rel="noopener">Pilato et al., PRES et SVCR, Front Neurol 2020</a> ; <a href="https://doi.org/10.1016/S1474-4422(15)00111-8" target="_blank" rel="noopener">Fugate et Rabinstein, PRES, Lancet Neurol 2015 (résumé)</a>.</p>
</template>
<template data-pop="i67-svcr" data-title="Syndrome de vasoconstriction cérébrale réversible">
<h3>Définition</h3>
<p>Céphalée en coup de tonnerre avec sténoses multifocales d’artères cérébrales, réversibles en environ 3 mois. Incidence standardisée d’environ 3 par million et par an.</p>
<h3>Pièges</h3>
<p>Il chevauche le PRES (environ 10 % ont des lésions de type PRES) et s’éloigne de l’angéite primitive par sa réversibilité. Corticoïdes et vasodilatateurs intra-artériels : mauvais pronostic. Critères ICHD-3 et score RCVS2 non lus.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7033494/" target="_blank" rel="noopener">Pilato et al., PRES et SVCR, Front Neurol 2020</a> ; <a href="https://doi.org/10.1177/23969873231182207" target="_blank" rel="noopener">Réseau REVERCE, Eur Stroke J 2023 (résumé)</a> ; <a href="https://doi.org/10.26355/eurrev_202105_25834" target="_blank" rel="noopener">Song et al., SVCR, revue systématique 2021 (résumé)</a>.</p>
</template>
<template data-pop="i67-vasospasme" data-title="Vasospasme après hémorragie sous-arachnoïdienne">
<h3>Définition</h3>
<p>Rétrécissement des artères cérébrales après la rupture d’un anévrisme ; le code I67.80! est secondaire. La CIM-10-GM le marque d’un point d’exclamation : il complète un code principal et ne s’emploie pas seul.</p>
<h3>Lien avec l’ischémie</h3>
<p>Le lien causal entre spasme macrovasculaire et ischémie retardée est de plus en plus remis en question.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69, BfArM</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">ESO/EANS/ESMINT, hémorragie sous-arachnoïdienne anévrismale 2026</a>.</p>
</template>
<template data-pop="i67-ischemie-retardee" data-title="Ischémie cérébrale retardée">
<h3>Définition et détection</h3>
<p>Détérioration ischémique après la phase initiale de l’hémorragie sous-arachnoïdienne. Le Doppler transcrânien ne l’exclut pas de façon fiable ; la perfusion par scanner montre un allongement du temps de transit moyen avant l’infarctus. Les définitions de l’ESO 2026 n’ont pas été lues (tableau en image).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">ESO/EANS/ESMINT, hémorragie sous-arachnoïdienne anévrismale 2026</a>.</p>
</template>
<template data-pop="i67-dtc" data-title="Doppler transcrânien dans le vasospasme">
<h3>Performance</h3>
<p>Sensibilité de 66,7 % et spécificité de 89,5 % par rapport à l’angiographie par soustraction numérique. Il n’exclut pas de façon fiable un vasospasme.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">ESO/EANS/ESMINT, hémorragie sous-arachnoïdienne anévrismale 2026</a>.</p>
</template>
<template data-pop="i67-elapss" data-title="Score ELAPSS">
<h3>Usage</h3>
<p>La ligne directrice ESO 2022 le cite pour planifier le suivi de croissance des anévrismes non traités. Ses composantes n’ont pas été lues ; le score PHASES, qui estime le risque de rupture, n’a pas non plus été lu.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446328/" target="_blank" rel="noopener">ESO, anévrisme intracrânien non rompu 2022</a>.</p>
</template>
<template data-pop="i67-jak2" data-title="Mutation JAK2 V617F">
<h3>Fait</h3>
<p>Présente chez 6 à 7 % des patients ayant une thrombose veineuse cérébrale ; une néoplasie myéloproliférative est trouvée chez environ 4 %. Le dossier ne dit pas comment la mutation favorise la thrombose.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a>.</p>
</template>
<template data-pop="i67-nimodipine" data-title="Nimodipine (Nimotop®)">
<h3>Indication suisse</h3>
<p>Prévention et traitement des déficits neurologiques ischémiques dus aux spasmes vasculaires après hémorragie sous-arachnoïdienne anévrismale. Le bénéfice n’est prouvé qu’en prophylaxie chez les patients opérés.</p>
<h3>Schéma</h3>
<p>Perfusion centrale de 5 à 14 jours (1 mg/h pendant 2 heures, puis 2 mg/h ; 0,5 mg/h si moins de 70 kg ou pression instable), puis comprimés 6 × 60 mg par jour pendant environ 7 jours. Contre-indication : rifampicine. Éthanol : 10 g par flacon de 50 ml.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680481530116" target="_blank" rel="noopener">Nimotop®, perfusion, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680458390446" target="_blank" rel="noopener">Nimotop®, comprimés, information professionnelle suisse</a>.</p>
</template>
<template data-pop="i67-nimo-litige" data-title="Nimodipine : voie orale ou perfusion, deux sources">
<h3>Le désaccord</h3>
<p>L’ESO, l’EANS et l’ESMINT (2026) recommandent la nimodipine par voie orale (évidence élevée). L’information professionnelle suisse (août 2025) décrit la perfusion intraveineuse de 5 à 14 jours suivie d’un relais oral d’environ 7 jours.</p>
<h3>Quelle source prime</h3>
<p>Pour un contentieux clinique, la source primaire applicable la plus récente l’emporte : ici, l’ESO 2026. Le texte réglementaire suisse en vigueur reste la notice d’août 2025, et il faut l’avoir sous les yeux pour la prescription.</p>
<h3>Ce qu’on ne sait pas</h3>
<p>La dose et la durée orales selon l’ESO n’ont pas été lues (tableau en image). Le choix se documente, avec le motif de l’écart.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">ESO/EANS/ESMINT, hémorragie sous-arachnoïdienne anévrismale 2026</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680481530116" target="_blank" rel="noopener">Nimotop®, perfusion, information professionnelle suisse</a> ; <a href="https://amiko.oddb.org/fr/fi?gtin=7680458390446" target="_blank" rel="noopener">Nimotop®, comprimés, information professionnelle suisse</a>.</p>
</template>
<template data-pop="pareto-i67-clin" data-title="Pareto — Notions, mécanismes, clinique et urgence">
<p class="ratio" data-cover="i67-0,i67-1,i67-2,i67-3,i67-4,i67-5,i67-6,i67-7,i67-8"></p>
<ul><li>I67 réunit des atteintes veineuse (<button class="w" data-k="i67-tvc">thrombose</button>), artérielle, des petites artères et de la régulation de la pression ; l’infarctus est I63, l’hémorragie I60 à I62.</li><li>Thrombose veineuse : femme jeune, contraception combinée chez 40 à 50 %, crises chez 40 à 50 %.</li><li>Mécanisme : stase veineuse, œdème, hémorragie ; scanner sans injection n’exclut pas (<button class="w" data-k="i67-angio-veineuse">angiographie veineuse</button>).</li><li><button class="w" data-k="i67-autoregulation">Autorégulation</button> dépassée : œdème postérieur ; la vitesse de hausse compte plus que la valeur.</li><li>Anévrisme non rompu : environ 3 % des adultes ; croissance de 1 mm ou plus et hypertension non contrôlée augmentent la rupture.</li><li>Urgences : craniectomie en cas d’engagement, anévrisme traité en 24 heures, baisse de la pression moyenne de 20 à 25 %.</li></ul>
</template>
<template data-pop="pareto-i67-trait" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="i67-9,i67-10,i67-11,i67-12,i67-13"></p>
<ul><li>Thrombose veineuse : héparine thérapeutique même avec hémorragie ; <button class="w" data-k="i67-aod-avk">anticoagulant oral direct</button> 3 à 12 mois ; usage hors étiquette en Suisse.</li><li>Encéphalopathie hypertensive : <button class="w" data-k="i67-labetalol">labétalol</button>, pression moyenne −20 à −25 %, jamais plus de 50 %.</li><li>Vasospasme : <button class="w" data-k="i67-nimodipine">nimodipine</button> ; <button class="w" data-k="i67-nimo-litige">voie orale ou perfusion selon la source</button>.</li><li>Anévrisme non rompu : décision partagée, arrêt du tabac, contrôle tensionnel, ni statine ni aspirine pour prévenir la rupture.</li><li>Moyamoya : antiagrégation, <button class="w" data-k="i67-pontage">pontage direct</button> si hémorragie ; angéite primitive : glucocorticoïdes plus immunosuppresseur.</li></ul>
</template>
<template data-pop="pareto-i67-crit" data-title="Pareto — Suivi, situations particulières et critères">
<p class="ratio" data-cover="i67-14,i67-15"></p>
<ul><li>Thrombose : recanalisation en 3 à 6 mois ; récidive de 2 à 5 % la première année.</li><li>Grossesse : héparine de bas poids moléculaire jusqu’à 6 semaines après l’accouchement ; anticoagulants oraux contre-indiqués.</li><li>Encéphalopathie hypertensive : hypertension sévère plus crises, léthargie, cécité corticale ou coma.</li><li>Angéite : <button class="w" data-k="i67-calabrese">critères de Calabrese et Mallek</button> et <button class="w" data-k="i67-birnbaum">de Birnbaum</button>.</li></ul>
</template>
<template data-pop="pareto-i67-exam" data-title="Pareto — Examens">
<p class="ratio" data-cover="i67-e-1,i67-e-2,i67-e-3,i67-e-4"></p>
<ul><li>Scanner ou IRM avec angiographie veineuse pour la thrombose ; IRM pour les veines corticales.</li><li><button class="w" data-k="i67-dd">D-dimères</button> : seulement en faible probabilité (sécurité supérieure à 95 %).</li><li>Urgence hypertensive : biologie, ECG, fond d’œil ; scanner puis IRM.</li><li><button class="w" data-k="i67-asd">Angiographie par soustraction numérique</button> : moyamoya et angéite ; <button class="w" data-k="i67-dtc">Doppler transcrânien</button> n’exclut pas le vasospasme.</li></ul>
</template>
<template data-pop="pareto-i67-s-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="i67-s-anat-body"></p>
<ul><li>Veines et sinus pour la thrombose ; carotide interne supraclinoïdienne pour le moyamoya.</li><li>Prédominance postérieure de l’œdème hypertensif.</li></ul>
</template>
<template data-pop="pareto-i67-s-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="i67-s-histo-body"></p>
<ul><li>Encéphalopathie hypertensive : œdème, microhémorragies, infarctus.</li><li>Angéite certaine : histologie ; la biopsie tranche les cas douteux.</li></ul>
</template>
<template data-pop="pareto-i67-s-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="i67-s-physio-body"></p>
<ul><li>Drainage veineux rétabli par l’anticoagulation.</li><li><button class="w" data-k="i67-autoregulation">Autorégulation</button> : vitesse de hausse de pression décisive.</li><li><button class="w" data-k="i67-hemodynamique">Réserve hémodynamique</button> du moyamoya.</li></ul>
</template>
<template data-pop="pareto-i67-s-bioc" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="i67-s-bioc-body"></p>
<ul><li>D-dimères : utilité limitée.</li><li>Hémolyse de la <button class="w" data-k="i67-mat">microangiopathie thrombotique</button>.</li><li>Nimodipine : liaison protéique d’environ 99 %, cytochrome P450 3A4.</li></ul>
</template>
<template data-pop="pareto-i67-s-gen" data-title="Pareto — Génétique">
<p class="ratio" data-cover="i67-s-gen-body"></p>
<ul><li><button class="w" data-k="i67-rnf213">RNF213 p.R4810K</button> : est-asiatique, absent en Occident.</li><li><button class="w" data-k="i67-jak2">JAK2 V617F</button> chez 6 à 7 % des thromboses.</li></ul>
</template>
<template data-pop="pareto-i67-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="i67-p-1,i67-p-2,i67-p-3,i67-p-4,i67-p-5"></p>
<ul><li><button class="w" data-k="i67-clexane">Énoxaparine</button> et <button class="w" data-k="i67-pradaxa">dabigatran</button> : hors étiquette dans la thrombose cérébrale.</li><li><button class="w" data-k="i67-nimodipine">Nimodipine</button> : rifampicine contre-indiquée, tubulures en polyéthylène.</li><li>Éviter : corticoïdes dans la thrombose veineuse, chute de plus de 50 % de la pression moyenne.</li></ul>
