<template data-pop="i67-sources" data-title="Référentiels utilisés et leurs limites">
<h3>Ce que sont les sources</h3>
<p>La thrombose veineuse cérébrale repose sur la ligne directrice S2k des pays germanophones (région DACH, révisée en octobre 2023, valide jusqu’en octobre 2028), co-signée par la Société suisse de neurologie, et sur sa synthèse publiée en 2024. Les autres entités s’appuient sur des lignes directrices de l’Organisation européenne de l’accident vasculaire cérébral (dissection 2021, anévrisme non rompu 2022, maladie des petites artères 2021 et 2024, moyamoya 2023, angéite primitive 2023, hémorragie sous-arachnoïdienne 2026), sur un document de position de la Société européenne de cardiologie (urgences hypertensives, 2019) et sur les informations professionnelles suisses de Nimotop®, Clexane® et Pradaxa®.</p>
<h3>Limites</h3>
<p>Aucune recommandation propre à une société suisse n’a été trouvée, hormis la co-signature suisse de la ligne directrice DACH. La ligne directrice européenne de 2017 sur la thrombose veineuse n’a été lue qu’en résumé. Le syndrome de vasoconstriction cérébrale réversible repose sur une revue narrative italienne et une revue systématique (résumé) ; le PRES sur une revue italienne et un résumé américain, utilisé seulement pour la description. Les critères ICHD-3, le score RCVS2, le score PHASES, la fistule artério-veineuse durale, les stades de Suzuki et les notices suisses du labétalol, de la nicardipine et des immunosuppresseurs n’ont pas été lus.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO, thrombose veineuse cérébrale 2017 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8564160/" target="_blank" rel="noopener">ESO, dissection artérielle 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9446328/" target="_blank" rel="noopener">ESO, anévrisme intracrânien non rompu 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13151661/" target="_blank" rel="noopener">ESO/EANS/ESMINT, hémorragie sous-arachnoïdienne anévrismale 2026</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370079/" target="_blank" rel="noopener">ESO, maladie des petites artères cérébrales fortuite 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13588668/" target="_blank" rel="noopener">ESC Council on Hypertension, urgences hypertensives, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10069176/" target="_blank" rel="noopener">ESO, angiopathie de moyamoya 2023</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10683718/" target="_blank" rel="noopener">ESO, angéite primitive du système nerveux central 2023</a>.</p>

<template data-pop="i67-tvc" data-title="Thrombose veineuse cérébrale : ce que le terme recouvre">
<h3>Définition</h3>
<p>La ligne directrice DACH définit la thrombose veineuse cérébrale comme une thrombose des conduits veineux cérébraux avec trouble de l’écoulement veineux. La CIM-10-GM 2024 la code I67.6 quand elle est non pyogène et I63.6 quand elle cause un infarctus.</p>
<h3>Conséquence</h3>
<p>Le trouble d’écoulement produit une stase, donc un œdème et parfois une hémorragie. Il ne s’agit pas d’un manque d’apport artériel : c’est le retour du sang qui est bloqué, ce qui explique que le traitement vise à rétablir l’écoulement.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69, BfArM</a> ; <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</template>
<template data-pop="i67-angio-veineuse" data-title="Angiographie veineuse : scanner ou IRM">
<h3>Principe</h3>
<p>L’angiographie veineuse visualise l’intérieur des veines et des sinus après injection (scanner) ou par séquence dédiée (IRM). Pour la thrombose veineuse cérébrale, la ligne directrice DACH tient le scanner et l’IRM, chacun avec angiographie veineuse, pour équivalents dans les sinus ; l’IRM est supérieure pour les veines corticales.</p>
<h3>Réglage</h3>
<p>L’angio-scanner utilise des coupes de 1 à 1,5 mm en phase veineuse. L’IRM native seule n’exclut pas la thrombose : on combine IRM et angio-IRM.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a>.</p>
</template>
<template data-pop="i67-dd" data-title="D-dimères dans la thrombose veineuse cérébrale">
<h3>Règle</h3>
<p>Les D-dimères ne sont pas recommandés en routine (consensus de 100 %). Ils servent seulement quand la probabilité est faible : céphalée isolée, examen neurologique normal, symptômes depuis moins de 30 jours. Normaux dans ce cas, ils excluent la thrombose avec une sécurité supérieure à 95 %.</p>
<h3>Limites</h3>
<p>Faux négatifs possibles si le thrombus est limité à une veine corticale ou si les symptômes durent plus de 30 jours. Un résultat normal ne rassure donc pas chez un patient qui a eu une crise ou un déficit.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</template>
<template data-pop="i67-thrombophilie" data-title="Dépistage de thrombophilie">
<h3>Règle</h3>
<p>Pas de dépistage systématique. La ligne directrice DACH l’envisage chez un sujet jeune, en cas de thrombose spontanée, de récidive ou d’antécédents familiaux de maladie thromboembolique, et seulement si le résultat modifie le traitement. L’ESO ne recommande ni dépistage systématique de thrombophilie ni dépistage de cancer.</p>
<h3>Exemple de décision modifiée</h3>
<p>Un syndrome des antiphospholipides triple positif remplace le relais par anticoagulant oral direct par des antivitamines K.</p>
<p class="src">Références : <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a> ; <a href="https://doi.org/10.1111/ene.13381" target="_blank" rel="noopener">ESO, thrombose veineuse cérébrale 2017 (résumé)</a>.</p>
</template>
<template data-pop="i67-vitt" data-title="Thrombose avec thrombopénie après vaccin à vecteur viral">
<h3>Définition</h3>
<p>La ligne directrice DACH cite la thrombose avec thrombopénie survenant dans les premières semaines après un vaccin contre le SARS-CoV-2 à vecteur viral comme cause de thrombose veineuse cérébrale.</p>
<h3>Limite</h3>
<p>Le dossier ne donne ni fréquence ni conduite spécifique de cette forme ; elle n’est donc pas détaillée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a> ; <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</template>
<template data-pop="i67-hbpm-hnf" data-title="Héparine de bas poids moléculaire ou héparine non fractionnée">
<h3>Comparaison</h3>
<p>Une méta-analyse de 179 contre 352 patients ne montre pas de différence significative de mortalité ou de fonction entre les deux héparines. La ligne directrice préfère donc l’héparine de bas poids moléculaire (recommandation modérée, consensus de 100 %).</p>
<h3>Exceptions</h3>
<p>L’héparine non fractionnée est utilisée avant une chirurgie ou une procédure, ou en insuffisance rénale sévère. Raison : sa durée d’action est plus courte, ce qui permet de l’interrompre — déduction pédagogique, non formulée ainsi dans la source.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a> ; <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</template>
<template data-pop="i67-aod-avk" data-title="Anticoagulants oraux directs et antivitamines K">
<h3>Ce que disent les sources</h3>
<p>La ligne directrice DACH préfère les anticoagulants oraux directs aux antivitamines K pendant 3 à 12 mois (recommandation modérée, consensus de 100 %). Exception : syndrome des antiphospholipides triple positif. Dans la méta-analyse, le risque relatif est de 0,17 pour la maladie thromboembolique, 0,37 pour la récidive de thrombose cérébrale et 0,35 pour l’hémorragie majeure (non significatif).</p>
<h3>Données prospectives</h3>
<p>La cohorte DOAC-CVT (619 adultes, 23 pays) trouve le même événement primaire dans les deux groupes : 3 % (rapport de cotes pondéré 0,99 ; intervalle de confiance de 0,37 à 3,38). Elle est observationnelle.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11027218/" target="_blank" rel="noopener">Weimar et al., recommandations S2k sur la thrombose veineuse cérébrale, Neurol Res Pract 2024</a> ; <a href="https://doi.org/10.1016/S1474-4422(24)00519-2" target="_blank" rel="noopener">DOAC-CVT, Lancet Neurol 2025</a> ; <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</template>
<template data-pop="i67-clexane" data-title="Clexane® (énoxaparine) : indications suisses">
<h3>Indications</h3>
<p>L’information professionnelle suisse (mise à jour février 2026) indique l’énoxaparine dans la thrombose veineuse profonde et l’embolie pulmonaire : 1 mg/kg par voie sous-cutanée toutes les 12 heures, ou 1,5 mg/kg une fois par jour hors situations compliquées ; deux fois par jour chez l’obèse ou le patient cancéreux.</p>
<h3>Statut dans la thrombose cérébrale</h3>
<p>La thrombose veineuse cérébrale ne figure pas dans les indications : l’usage est hors étiquette, justifié par les lignes directrices.</p>
<p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680494563699" target="_blank" rel="noopener">Clexane®, information professionnelle suisse</a> ; <a href="https://register.awmf.org/assets/guidelines/030-098l_S2k_Zerebrale-Venen-und-Sinusthrombose_2024-02.pdf" target="_blank" rel="noopener">Thrombose veineuse cérébrale, ligne directrice S2k DACH 2023 (avec la Société suisse de neurologie)</a>.</p>
</template>
<template data-pop="i67-pradaxa" data-title="Pradaxa® (dabigatran) : indications suisses">

<p>L’information professionnelle suisse (mise à jour février 2024) donne, pour la thrombose veineuse profonde et l’embolie pulmonaire, 150 mg deux fois par jour après au moins 5 jours d’héparine.</p>
<h3>Statut dans la thrombose cérébrale</h3>
<p>La thrombose veineuse cérébrale ne figure pas dans les indications : l’usage est hors étiquette.</p>

<template data-pop="i67-autoregulation" data-title="Autorégulation cérébrale">
<h3>Rôle</h3>
<p>L’autorégulation maintient le débit cérébral malgré les variations de pression artérielle. Quand la pression est très élevée, elle n’empêche plus la hausse de pression dans le lit capillaire et un œdème cérébral se forme, surtout en région postérieure.</p>
<h3>Conséquence pour le traitement</h3>
<p>La vitesse d’élévation de la pression compte davantage que sa valeur ; il n’existe pas de seuil tensionnel spécifique. D’où une baisse prudente de la pression artérielle moyenne de 20 à 25 %, jamais de plus de 50 %.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13588668/" target="_blank" rel="noopener">ESC Council on Hypertension, urgences hypertensives, 2019</a>.</p>
</template>
<template data-pop="i67-pam" data-title="Pression artérielle moyenne et cibles de baisse">
<h3>Cible</h3>
<p>Le document de position européen fixe la baisse de la pression artérielle moyenne à 20 à 25 % dans l’encéphalopathie hypertensive (immédiatement) et dans l’hypertension maligne avec atteinte d’organe (en quelques heures). Une chute de plus de 50 % est associée à l’accident ischémique et au décès.</p>
<h3>Application</h3>
<p>Le médecin calcule la pression moyenne de départ, en déduit la valeur à viser et surveille en continu. En cas de chute brutale, du soluté salé corrige la déplétion volémique par natriurèse de pression.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13588668/" target="_blank" rel="noopener">ESC Council on Hypertension, urgences hypertensives, 2019</a>.</p>
</template>
<template data-pop="i67-hta-maligne" data-title="Hypertension maligne">
<h3>Critères</h3>
<p>Pression habituellement supérieure à 200/120 mmHg avec rétinopathie avancée : hémorragies en flammèches bilatérales, nodules cotonneux ou œdème papillaire. L’encéphalopathie hypertensive concerne 10 à 15 % de ces patients. Une cause secondaire existe chez 20 à 40 % des patients des urgences (néphropathie parenchymateuse, sténose de l’artère rénale).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13588668/" target="_blank" rel="noopener">ESC Council on Hypertension, urgences hypertensives, 2019</a>.</p>
</template>
<template data-pop="i67-mat" data-title="Microangiopathie thrombotique">
<h3>Définition</h3>
<p>Atteinte associant hémolyse mécanique, thrombopénie et lésions d’organe. Dans l’urgence hypertensive : hémolyse à Coombs négatif, thrombopénie, ADAMTS13 normale ou peu abaissée.</p>
<h3>Diagnostic différentiel</h3>
<p>Dans le purpura thrombotique thrombocytopénique, l’ADAMTS13 est très basse. La forme secondaire à l’hypertension s’améliore en 24 à 48 heures avec la baisse de la pression.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13588668/" target="_blank" rel="noopener">ESC Council on Hypertension, urgences hypertensives, 2019</a>.</p>
</template>
<template data-pop="i67-labetalol" data-title="Labétalol dans l’encéphalopathie hypertensive">
<h3>Pourquoi le choisir</h3>
<p>Première ligne dans la source européenne : il préserve relativement le débit cérébral à baisse tensionnelle égale et n’augmente pas la pression intracrânienne.</p>
<h3>Doses et contre-indications</h3>
<p>Bolus de 0,25 à 0,5 mg/kg ; perfusion de 2 à 4 mg/min puis de 5 à 20 mg/h. Contre-indiqué en cas de bloc auriculo-ventriculaire de deuxième ou troisième degré, d’insuffisance cardiaque systolique, d’asthme et de bradycardie. L’information professionnelle suisse n’a pas été lue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC13588668/" target="_blank" rel="noopener">ESC Council on Hypertension, urgences hypertensives, 2019</a>.</p>
</template>
<template data-pop="i67-strive" data-title="STRIVE-2 : standards d’imagerie de la maladie des petites artères">
<h3>Définition</h3>
<p>STRIVE-2 (2023) standardise les marqueurs d’IRM de la maladie des petites artères pour la recherche, après STRIVE-1. C’est un standard de recherche, non une règle clinique, et seul le résumé a été lu.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S1474-4422(23)00131-X" target="_blank" rel="noopener">STRIVE-2, Lancet Neurol 2023 (résumé)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370079/" target="_blank" rel="noopener">ESO, maladie des petites artères cérébrales fortuite 2021</a>.</p>
</template>
<template data-pop="i67-binswanger" data-title="Leucoencéphalopathie vasculaire progressive">
<h3>Codage</h3>
<p>La CIM-10-GM 2024 l’inclut dans I67.3 sous le nom de maladie de Binswanger. La démence vasculaire sous-corticale se code F01.2.</p>
<h3>Lien avec la maladie des petites artères</h3>
<p>Les hyperintensités de la substance blanche et les lacunes sont les marqueurs d’IRM décrits par l’ESO. Le dossier ne détaille pas la clinique propre de la maladie de Binswanger.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-i60-i69.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc I60–I69, BfArM</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8370079/" target="_blank" rel="noopener">ESO, maladie des petites artères cérébrales fortuite 2021</a>.</p>
</template>
<template data-pop="i67-laci2" data-title="LACI-2 : mononitrate d’isosorbide et cilostazol">
<h3>Résultat</h3>
<p>Essai de phase 2 britannique (363 patients) dans l’accident lacunaire : les deux médicaments sont faisables et sûrs. Des signaux d’efficacité restent à confirmer en phase 3.</p>
<h3>Lecture</h3>
<p>Ce n’est pas une recommandation. Il ne faut pas présenter ces médicaments comme des traitements établis.</p>
<p class="src">Références : <a href="https://doi.org/10.1001/jamaneurol.2023.1526" target="_blank" rel="noopener">LACI-2, JAMA Neurol 2023 (résumé)</a>.</p>
