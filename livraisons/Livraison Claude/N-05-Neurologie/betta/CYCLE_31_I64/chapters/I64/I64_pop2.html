<template data-pop="i64-imagerie" data-title="Imagerie de l’AVC : choix et limites">
<div class="lab">Principe</div><p>Le consensus ESO–ESMINT demande une imagerie cérébrale urgente avec imagerie vasculaire chez tout patient suspect d’AVC.</p>
<div class="lab">Scanner sans contraste</div><p>Il exclut l’hémorragie intracrânienne, condition de la thrombolyse selon les informations professionnelles suisses. Il peut être normal très tôt après un infarctus.</p>
<div class="lab">Scanner multimodal et IRM</div><p>Ils confirment l’infarctus, écartent un simulateur et fournissent mismatch et discordance DWI-FLAIR.</p>
<div class="lab">Thrombectomie</div><p>Dans les 6 premières heures, l’imagerie avancée n’est pas nécessaire (faible) ; au-delà de 6 heures, elle l’est (forte).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6533858/" target="_blank" rel="noopener">ESO–ESMINT, thrombectomie, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7939567/" target="_blank" rel="noopener">Buck et al., Ann Med 2021</a>.</p></template>
<template data-pop="i64-25min" data-title="Norme des 25 minutes">
<div class="lab">Définition</div><p>Les critères de la Swiss Stroke Society de 2012 demandent une imagerie cérébrale (scanner ou IRM) dans les 25 minutes après l’arrivée en Stroke Unit.</p>
<div class="lab">Limite</div><p>Les critères SFCNS du 18 novembre 2021, en vigueur, n’ont pas été lus : la norme de 2012 est donnée à titre de repère.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3808045/" target="_blank" rel="noopener">Matis et al., Stroke units suisses</a> ; <a href="https://www.usz.ch/app/uploads/2026/03/SFCNS_Certificate_StrokeCenter_USZ_2023_2028.pdf" target="_blank" rel="noopener">Certificat SFCNS Stroke Center, hôpital universitaire de Zurich, 2023–2028</a>.</p></template>
<template data-pop="i64-stroke-unit" data-title="Stroke Unit et Stroke Center en Suisse">
<div class="lab">Deux niveaux</div><p>La Stroke Unit assure la prise en charge organisée ; le Stroke Center ajoute des prestations neuroradiologiques et neurochirurgicales spécialisées.</p>
<div class="lab">Critères de 2012</div><p>Neurologue présent 10 heures par jour ; thrombolyse 24 heures sur 24 ; transfert vers neurochirurgie ou neuroradiologie interventionnelle en moins de 60 minutes ; au moins 6 lits dont 3 monitorés ; au moins 200 admissions et 20 traitements de recanalisation par an ; registre des AVC.</p>
<div class="lab">Certification</div><p>Elle est coordonnée par la SFCNS sous mandat de l’IVHSM ; des critères Stroke Center du 18 novembre 2021 sont en vigueur. Le nombre actuel d’unités et de centres n’est pas sourcé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC3808045/" target="_blank" rel="noopener">Matis et al., Stroke units suisses</a> ; <a href="https://www.usz.ch/app/uploads/2026/03/SFCNS_Certificate_StrokeCenter_USZ_2023_2028.pdf" target="_blank" rel="noopener">Certificat SFCNS Stroke Center, hôpital universitaire de Zurich, 2023–2028</a>.</p></template>
<template data-pop="i64-thrombectomie" data-title="Thrombectomie mécanique">
<div class="lab">Indication</div><p>Occlusion d’un gros vaisseau en moins de 6 heures : thrombectomie plus meilleur traitement médical, y compris thrombolyse si indiquée (forte, qualité élevée). De 6 à 24 heures : selon les critères DAWN ou DEFUSE-3 (forte, qualité modérée).</p>
<div class="lab">Sélection</div><p>Pas de limite d’âge ni de NIHSS ; ASPECTS ≥ 6 ou cœur de l’infarctus ≤ 70 ml dans les 6 heures. Prise en charge en centre complet.</p>
<div class="lab">Mises à jour</div><p>Trois essais de 2025 n’ont montré aucun bénéfice dans les occlusions de vaisseaux moyens. Occlusion basilaire : thrombolyse jusqu’à 24 heures par consensus, thrombectomie suggérée si NIHSS ≥ 10.</p>
<div class="lab">Limite</div><p>Les recommandations ESO–ESMINT sont de 2019 et ont été complétées depuis.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6533858/" target="_blank" rel="noopener">ESO–ESMINT, thrombectomie, 2019</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12915583/" target="_blank" rel="noopener">ESO, synthèse annuelle 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11347260/" target="_blank" rel="noopener">ESO–ESMINT, occlusion basilaire, 2024</a>.</p></template>
<template data-pop="i64-inr" data-title="INR : 1,7 selon l’ESO, 1,3 selon le texte suisse">
<div class="lab">Les deux textes</div><p>ESO 2021 : sous antivitamine K, thrombolyse si INR ≤ 1,7 ; INR supérieur à 1,7 ou inconnu : pas de thrombolyse. Informations professionnelles suisses d’Actilyse (juin 2025) et de Metalyse (mai 2025) : contre-indication au-delà de 1,3.</p>
<div class="lab">Arbitrage</div><p>Pour un usage autorisé en Suisse, le texte d’autorisation suisse, plus récent et propre au produit, est celui qui s’applique. L’ESO reste cité comme repère comparatif et pour comprendre pourquoi une pratique plus souple existe.</p>
<div class="lab">Conséquence</div><p>Entre 1,3 et 1,7, le patient est dans la zone de divergence : la décision se documente et se discute avec le centre de référence.</p>
<div class="lab">Limite</div><p>Le dossier ne contient pas d’autre recommandation suisse tranchant ce point.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a> ; <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Actilyse®, Swissmedic, juin 2025</a> ; <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Metalyse® 5000 U, Swissmedic, mai 2025</a>.</p></template>
<template data-pop="i64-actilyse" data-title="Actilyse® (altéplase) : monographie">
<div class="lab">Indication et fenêtre</div><p>AVC ischémique aigu, dans les 4,5 heures après le dernier état asymptomatique, après exclusion de toute hémorragie intracrânienne par imagerie.</p>
<div class="lab">Posologie</div><p>0,9 mg/kg, maximum 90 mg ; 10 % en bolus, puis le reste en 60 minutes. La dose standard est préférée à la dose réduite (ESO, forte).</p>
<div class="lab">Preuves</div><p>Chez les plus de 80 ans : évolution favorable 18 % contre 13 % (odds ratio 1,56), hémorragie symptomatique 8,9 % contre 2 %. NINDS : hémorragie intracrânienne 15,4 % ; ECASS III : 14,1 % (toutes hémorragies confondues).</p>
<div class="lab">Contre-indications citées</div><p>INR supérieur à 1,3 sous antivitamine K, NIHSS supérieur à 25 comme exemple d’AVC sévère, accouchement depuis moins de 10 jours, âge inférieur à 16 ans, chirurgie majeure depuis moins de 10 jours, ulcère actif, antécédent d’hémorragie intracrânienne. Plaquettes inférieures à 100 × 10⁹/l.</p>
<div class="lab">Effets indésirables</div><p>Hémorragie intracrânienne très fréquente ; angio-œdème, majoré par les inhibiteurs de l’enzyme de conversion. Aucun antithrombotique dans les 24 heures suivantes.</p>
<p class="src">Références : <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Actilyse®, Swissmedic, juin 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a>.</p></template>
<template data-pop="i64-metalyse" data-title="Metalyse® 5000 U (ténectéplase) : monographie">
<div class="lab">Indication et fenêtre</div><p>AVC ischémique aigu dans les 4,5 heures (autorisation suisse, mai 2025).</p>
<div class="lab">Posologie</div><p>Dose unique en bolus ajustée au poids, maximum 25 mg (par exemple 15 mg si moins de 60 kg) ; repère de 0,25 mg/kg.</p>
<div class="lab">Preuves</div><p>Essai AcT : ténectéplase 0,25 mg/kg non inférieure à l’altéplase (mRS 0–1 : 36,9 % contre 34,8 %). L’ESO suggérait en 2021 la ténectéplase avant thrombectomie ; la synthèse 2025 la renforce.</p>
<div class="lab">Contre-indications citées</div><p>INR supérieur à 1,3 sous antivitamine K ; AVC sans déficit invalidant.</p>
<div class="lab">Limite</div><p>La recommandation ESO dédiée à la ténectéplase (2023) n’a pas été lue ; seule la synthèse 2025 l’a été.</p>
<p class="src">Références : <a href="https://www.swissmedic.ch/" target="_blank" rel="noopener">Information professionnelle suisse Metalyse® 5000 U, Swissmedic, mai 2025</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC7995316/" target="_blank" rel="noopener">ESO, thrombolyse intraveineuse, 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12915583/" target="_blank" rel="noopener">ESO, synthèse annuelle 2025</a>.</p></template>
<template data-pop="i64-mnemo" data-title="D-I-A : trois questions avant de traiter">
<div class="lab">Contenu</div><p>D comme Dernier moment sans symptôme, I comme Imagerie, A comme Anticoagulants (INR ou délai depuis la dernière prise).</p>
<div class="lab">Statut</div><p>Aide pédagogique, non critère officiel.</p>
</template>
<template data-pop="pareto-i64-definition" data-title="Loi de Pareto — Définition et fréquence">
<p class="ratio" data-cover="i64-0,i64-1,i64-2"></p>
<ul><li>I64 = AVC dont la nature n’est pas établie ; sortie par l’imagerie vers I63, I60, I61, I62.</li><li>Séquelles : I69.4 ; exclusions S06.-, F01.-, G45.-.</li><li>Suisse 2017 : 26 032 sorties, 2816 décès, létalité 10,5 % pour I60 à I64.</li></ul></template>
<template data-pop="pareto-i64-mecanismes" data-title="Loi de Pareto — Physiopathologie">
<p class="ratio" data-cover="i64-3,i64-4"></p>
<ul><li>Infarctus : 1,9 million de neurones perdus par minute ; le temps domine.</li><li>Hémorragie : l’expansion de l’hématome domine.</li><li>Même geste tensionnel, effets opposés : imager avant d’agir.</li></ul></template>
<template data-pop="pareto-i64-clinique" data-title="Loi de Pareto — Anamnèse et examen">
<p class="ratio" data-cover="i64-5,i64-6"></p>
<ul><li>Dernier moment sans symptôme, anticoagulants, contre-indications.</li><li>NIHSS, pression artérielle, glycémie.</li><li>Les scores cliniques (environ 64 % de précision) ne remplacent pas l’imagerie.</li></ul></template>
<template data-pop="pareto-i64-prise-en-charge" data-title="Loi de Pareto — Urgences et prise en charge">
<p class="ratio" data-cover="i64-9,i64-10,i64-11,i64-12,i64-13"></p>
<ul><li>144, imagerie en 25 minutes, pas d’abaissement tensionnel de routine avant imagerie.</li><li>Infarctus : thrombolyse < 4,5 h, thrombectomie < 6 h puis jusqu’à 24 h.</li><li>Hémorragie : pression systolique < 140 mmHg si hématome petit à modéré.</li><li>INR : 1,3 (texte suisse) contre 1,7 (ESO).</li></ul></template>
<template data-pop="pareto-i64-examens" data-title="Loi de Pareto — Examens">
<p class="ratio" data-cover="i64-e-1,i64-e-2,i64-e-3,i64-e-4,i64-e-5"></p>
<ul><li>Imagerie cérébrale urgente avec imagerie vasculaire : examen décisif.</li><li>Biologie avant thrombolyse : plaquettes, INR, anti-Xa ou temps de thrombine, glycémie.</li><li>Environ 35 % de simulateurs, mais thrombolyse sûre chez eux (0,5 %).</li></ul></template>
<template data-pop="pareto-i64-physio" data-title="Loi de Pareto — Physiologie">
<p class="ratio" data-cover="i64-s-physio-cours"></p>
<ul><li>120 millions de neurones perdus par heure d’ischémie non traitée.</li><li>Estimation moyenne, non individuelle.</li></ul></template>
<template data-pop="pareto-i64-hemo" data-title="Loi de Pareto — Hémodynamique">
<p class="ratio" data-cover="i64-s-hemo-cours"></p>
<ul><li>Seuils : 185/110 avant le bolus, 180/105 pendant et 24 h après.</li><li>Hématome petit à modéré : sous 140 mmHg.</li></ul></template>
<template data-pop="pareto-i64-stat" data-title="Loi de Pareto — Biostatistique">
<p class="ratio" data-cover="i64-s-stat-cours"></p>
<ul><li>Guy’s : 70 % et 64 % ; Siriraj : 68 % et 64 %.</li><li>30 hémorragies sur 100 manquées avec une sensibilité de 70 %.</li></ul></template>
<template data-pop="pareto-i64-hemost" data-title="Loi de Pareto — Hémostase">
<p class="ratio" data-cover="i64-s-hemost-cours"></p>
<ul><li>INR : 1,7 ESO, 1,3 texte suisse.</li><li>Anticoagulants oraux directs : 48 heures, anti-Xa < 0,5 U/ml, temps de thrombine < 60 s ; idarucizumab pour le dabigatran.</li></ul></template>
<template data-pop="pareto-i64-pharma" data-title="Loi de Pareto — Pharmacologie">
<p class="ratio" data-cover="i64-p-1,i64-p-2,i64-p-3,i64-p-4"></p>
<ul><li>Altéplase 0,9 mg/kg (maximum 90 mg) ; ténectéplase 0,25 mg/kg (maximum 25 mg).</li><li>Aucun antithrombotique 24 heures après la thrombolyse.</li><li>Éviter l’abaissement tensionnel de routine et la trinitrine dans l’hémorragie.</li></ul></template>
