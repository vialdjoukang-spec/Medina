<section class="ilot" id="i64-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 74 ans est amenée par les secours. Elle présente depuis peu une faiblesse du bras et de la jambe droits et un trouble de la parole. Son mari l’a vue sans symptôme à 07 h 30 ; elle arrive aux urgences à 08 h 40. Sa pression artérielle est de 172/98 mmHg, sa glycémie capillaire de 7,2 mmol/l, elle ne prend aucun anticoagulant. Aucune imagerie n’a encore été faite.</p>
<p>Le diagnostic de travail est un <button class="w" data-k="i64-cim">accident vasculaire cérébral non précisé (code I64)</button> : le déficit est d’origine vasculaire probable, mais personne ne sait encore s’il s’agit d’un infarctus ou d’une hémorragie. Cette incertitude est le cœur du cours. Les deux traitements urgents sont opposés : on <button class="w" data-k="i64-thrombolyse-resume">thrombolyse</button> un infarctus, alors que l’on contrôle la pression artérielle et l’hémostase d’une hémorragie. Le premier geste utile est donc l’imagerie, pas le médicament.</p>
<p>Le délai se calcule à partir du <button class="w" data-k="i64-dernier-moment">dernier moment connu sans symptôme (07 h 30)</button> et non de l’arrivée : la fenêtre autorisée de 4,5 heures court donc jusqu’à 12 h 00. À 08 h 40, il reste 3 heures 20 minutes. Le temps presse, car chaque minute d’ischémie non traitée détruit environ 1,9 million de neurones (<button class="w" data-k="i64-temps">temps et tissu cérébral</button>).</p>
<div class="key"><b>À retenir.</b> Le code I64 décrit un état transitoire d’information et non une maladie. La conduite consiste à le transformer en diagnostic précis, le plus vite possible, par une imagerie cérébrale urgente.</div>
<div class="trap"><span class="k">Erreur fréquente</span> Débuter un anticoagulant, de l’aspirine ou un abaissement tensionnel intensif sur l’impression clinique « c’est sûrement un infarctus ». Aucun score clinique ne distingue de façon fiable l’hémorragie de l’infarctus (précision d’environ 64 %).</div>
</section>

<section class="ilot" id="i64-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La classification allemande des diagnostics (CIM-10-GM 2024, utilisée par l’Office fédéral de la statistique) définit le code <b>I64</b> par l’intitulé « Schlaganfall, nicht als Blutung oder Infarkt bezeichnet », avec l’inclusion « Zerebrovaskulärer Insult o.n.A. » (accident cérébrovasculaire sans autre précision). C’est une catégorie terminale : elle n’a pas de sous-code. Les séquelles d’un tel accident se codent à part sous <b>I69.4</b>.</p>
<p>I64 appartient au bloc I60–I69 des maladies cérébrovasculaires. Les codes voisins se choisissent après l’imagerie ; le tableau suivant les rassemble pour que le lecteur voie dans quelle direction I64 se résout.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé abrégé</th><th>Quand l’utiliser</th></tr></thead><tbody><tr><td>I60</td><td>Hémorragie sous-arachnoïdienne</td><td>Imagerie : sang dans l’espace sous-arachnoïdien</td></tr><tr><td>I61</td><td>Hémorragie intracérébrale</td><td>Imagerie : hémorragie dans le parenchyme cérébral</td></tr><tr><td>I62</td><td>Autres hémorragies intracrâniennes non traumatiques</td><td>Imagerie : autre localisation hémorragique non traumatique</td></tr><tr><td>I63</td><td>Infarctus cérébral</td><td>Imagerie ou tableau : infarctus établi</td></tr><tr><td><b>I64</b></td><td>AVC non précisé comme hémorragique ou par infarctus</td><td>Nature jamais établie : pas d’imagerie, imagerie indisponible ou non concluante</td></tr><tr><td>I69.4</td><td>Séquelles d’un AVC non précisé</td><td>Séquelles d’un accident codé I64</td></tr></tbody></table>
<p>Trois exclusions du bloc évitent les confusions : l’hémorragie intracrânienne traumatique (S06.-), la démence vasculaire (F01.-) et l’ischémie cérébrale transitoire (G45.-). Une hypertension associée se code en plus. Les études épidémiologiques suisses définissent l'« AVC aigu » par les codes I60 à I64 et excluent I65 à I69.</p>
<div class="trap"><span class="k">Piège</span> Lire I64 comme une « cause » d’AVC. I64 est une étiquette d’incertitude : les causes appartiennent aux catégories précisées (I61, I62, I63).</div>
<p><b>Lacune assumée.</b> Le dossier de lecture ne contient pas la définition formelle de l’AVC de l’Organisation mondiale de la santé ou de l’ESO ; ce cours ne la reproduit pas de mémoire.</p>
<div class="key"><b>À retenir.</b> I64 = déficit neurologique vasculaire dont la nature n’est pas établie. Sa résolution se lit dans les codes I60 à I63. Les séquelles se codent I69.4.</div>
</section>

<section class="ilot" id="i64-2"><h2><span class="n">2</span>Fréquence en Suisse</h2>
<p>La source suisse de référence est l’étude de Hänsel et collaborateurs (2025), fondée sur les données de l’Office fédéral de la statistique de 2017 (statistique médicale des hôpitaux et statistique des causes de décès). Elle porte sur les codes I60 à I64 réunis : elle ne donne donc pas la part propre d’I64. Le tableau résume ses chiffres (<button class="w" data-k="i64-epidemio">détail et limites</button>).</p>
<table class="t"><thead><tr><th>Indicateur, Suisse 2017</th><th>Valeur</th><th>Comparaison 2004</th></tr></thead><tbody><tr><td>Sorties d’hôpital pour AVC</td><td>26 032 (45 % de femmes)</td><td>13 996</td></tr><tr><td>Événements estimés</td><td>26 879 ; taux standardisé 325,0/100 000</td><td>—</td></tr><tr><td>Décès par AVC</td><td>2816 (59 % de femmes)</td><td>3568</td></tr><tr><td>Mortalité brute, femmes</td><td>38,5/100 000</td><td>77,5</td></tr><tr><td>Mortalité brute, hommes</td><td>27,2/100 000</td><td>56,1</td></tr><tr><td>Létalité globale</td><td>10,5 % (femmes 13,4 % ; hommes 8,0 %)</td><td>22,7 %</td></tr><tr><td>Létalité hospitalière / extrahospitalière</td><td>7,3 % / 3,2 %</td><td>extrahospitalière 11,0 %</td></tr><tr><td>Décès survenus hors de l’hôpital</td><td>30,1 %</td><td>48,7 %</td></tr></tbody></table>
<p>Le nombre de sorties d’hôpital a presque doublé alors que le nombre de décès a diminué (3568 à 2816) et que la létalité a été divisée par plus de deux (22,7 % à 10,5 %). Les auteurs expliquent la hausse des diagnostics surtout par un codage plus systématique depuis l’introduction de SwissDRG en 2012, une meilleure connaissance des symptômes et un meilleur accès au diagnostic ; une vraie augmentation de l’incidence n’est pas exclue, car l’hypertension, l’obésité et l’hypercholestérolémie ont augmenté de 2007 à 2017. Ils attribuent la baisse de mortalité, entre autres facteurs, aux Stroke Units certifiées, aux réseaux de télé-AVC et à la standardisation de la chaîne de soins.</p>
<p>Après 85 ans, la mortalité est plus élevée chez la femme (715,8 contre 661,4 pour 100 000), alors que les taux de sortie sont plus élevés chez l’homme entre 35 et 85 ans. Les femmes représentent ainsi 59 % des décès pour 45 % des sorties d’hôpital.</p>
<div class="trap"><span class="k">Piège</span> Interpréter la hausse des sorties comme une épidémie. Une partie vient du codage ; les bases de données hospitalière et des causes de décès ne peuvent pas être reliées, si bien que l’incidence vraie et la part des récidives restent inconnues.</div>
<p>À l’échelle mondiale, l’hémorragie intracérébrale représentait 28,8 % de tous les AVC en 2019 (3,41 millions de cas) : plus d’un AVC sur quatre est une hémorragie intracérébrale, pour laquelle toute thrombolyse est exclue. <b>Lacune :</b> aucune source lue ne donne la proportion suisse infarctus/hémorragie ni la part des AVC restés codés I64.</p>
<div class="key"><b>À retenir.</b> Suisse 2017 : environ 26 000 hospitalisations et 2816 décès par AVC (I60 à I64), létalité 10,5 %. La part d’I64 n’est pas publiée dans les sources lues.</div>
<button class="pareto-btn ui" data-k="pareto-i64-definition">▲ Loi de Pareto — Définition et fréquence</button>
</section>

<section class="ilot" id="i64-3"><h2><span class="n">3</span>Physiopathologie : pourquoi la nature compte</h2>
<p>La différenciation entre infarctus et hémorragie est, selon la littérature lue, « la première étape la plus importante », car les deux affections se traitent de façon profondément différente. Trois mécanismes expliquent cette opposition.</p>
<p><b>Premier mécanisme : le temps détruit le tissu dans l’infarctus.</b> Pour un accident ischémique typique d’un gros vaisseau supratentoriel, avec un volume final moyen de 54 ml atteint en environ 10 heures, le cerveau perd en moyenne 1,9 million de neurones, 14 milliards de synapses et 12 kilomètres de fibres myélinisées par minute sans traitement (Saver, 2006). Cela représente 120 millions de neurones par heure, soit un vieillissement cérébral de 3,6 ans par heure. Le bénéfice de la thrombolyse diminue donc avec le délai (<button class="w" data-k="i64-temps">quantification</button>).</p>
<p><b>Deuxième mécanisme : l’imagerie traduit l’état du tissu.</b> Au-delà de 4,5 heures ou au réveil, la sélection des patients repose sur un décalage entre le cœur de l’infarctus et le tissu hypoperfusé (perfusion au scanner ou à l’IRM) ou sur une discordance DWI-FLAIR à l’IRM (<button class="w" data-k="i64-penombre">mismatch (lecture de la pénombre)</button>). Le dossier ne contient aucune source primaire sur la physiopathologie de la pénombre ; seul son usage en imagerie est enseigné ici.</p>
<p><b>Troisième mécanisme : dans l’hémorragie, l’expansion de l’hématome aggrave le pronostic.</b> L’expansion est associée à un pronostic fonctionnel plus mauvais et à la mort. Une baisse tensionnelle précoce (avant 6 heures) est associée à moins d’expansion (odds ratio 0,76, faible certitude). L’acide tranexamique réduit l’expansion à 24 heures (odds ratio 0,82) sans effet démontré sur la mort ou la dépendance à 90 jours (<button class="w" data-k="i64-expansion">expansion de l’hématome</button>).</p>
<p><b>Conséquence : un même geste a des effets opposés.</b> En préhospitalier, l’abaissement tensionnel intensif (essai INTERACT4, urapidil, cible de 130 à 140 mmHg de pression systolique, 2303 patients) n’a pas d’effet global (odds ratio commun 1,00) ; il montre un bénéfice possible dans l’hémorragie et un préjudice possible dans l’infarctus (odds ratio commun 1,30). Avec la trinitrine transdermique (essai RIGHT-2), l’expansion de l’hématome augmentait dans l’hémorragie (46 % contre 27 %) (<button class="w" data-k="i64-tension-nature">pression artérielle selon la nature</button>).</p>
<figure aria-label="Fenêtres thérapeutiques"><svg viewBox="0 0 640 150" role="img" aria-label="Figure 1 — Fenêtres thérapeutiques après le début des symptômes"><g fill="none" stroke="currentColor" stroke-width="1.5"><path d="M30 120h580"/><path d="M30 116v8M139 116v8M175 116v8M248 116v8M610 116v8"/><rect x="30" y="14" width="109" height="16"/><rect x="139" y="36" width="109" height="16" stroke-dasharray="4 3"/><rect x="30" y="58" width="145" height="16"/><rect x="175" y="80" width="435" height="16" stroke-dasharray="4 3"/></g><g fill="currentColor" font-size="11"><text x="30" y="140">0</text><text x="132" y="140">4,5 h</text><text x="170" y="140">6 h</text><text x="242" y="140">9 h</text><text x="598" y="140">24 h</text><text x="146" y="26">Thrombolyse, fenêtre standard</text><text x="254" y="48">Thrombolyse sélectionnée par imagerie (mismatch)</text><text x="182" y="70">Thrombectomie sans imagerie avancée</text><text x="182" y="92">Thrombectomie avec imagerie avancée obligatoire</text></g></svg><figcaption>Figure 1 — Fenêtres thérapeutiques de l’infarctus, d’après ESO 2021 et ESO–ESMINT 2019. Elles ne s’appliquent qu’après exclusion de l’hémorragie par l’imagerie. Schéma didactique non calibré pour une décision individuelle.</figcaption></figure>
<div class="key"><b>À retenir.</b> Infarctus : le temps est le facteur principal, il faut traiter vite. Hémorragie : l’expansion est le risque, il faut contrôler tension et hémostase. Seule l’imagerie dit lequel des deux traitements est sans danger.</div>
<button class="pareto-btn ui" data-k="pareto-i64-mecanismes">▲ Loi de Pareto — Physiopathologie</button>
</section>

<section class="ilot" id="i64-4"><h2><span class="n">4</span>Causes et terrain</h2>
<p>I64 n’est pas une cause : elle étiquette l’incertitude sur la nature de l’AVC. Les causes relèvent des catégories précisées : l’occlusion artérielle pour I63, la rupture vasculaire pour I61 et I62. Le dossier de lecture ne détaille pas les mécanismes étiologiques de ces catégories ; ils sont enseignés dans leurs cours propres.</p>
<p>Le terrain commun se lit dans les tendances suisses de 2007 à 2017 : l’hypertension, l’obésité, l’hypercholestérolémie et les troubles du sommeil ont augmenté dans la population. La fibrillation atriale et l’hypertension rendent plus probable un vrai AVC chez un patient suspect ; l’insuffisance rénale ou hépatique chronique oriente plutôt vers un simulateur (<button class="w" data-k="i64-simulateurs">simulateurs d’AVC</button>).</p>
<p><b>Lacune :</b> aucun registre suisse lu ne quantifie la part des AVC qui restent codés I64 faute d’imagerie, ni sa baisse avec l’accès à l’imagerie.</p>
<div class="key"><b>À retenir.</b> Le terrain vasculaire (hypertension, obésité, hypercholestérolémie) est en hausse en Suisse. La cause précise est affaire de I61, I62 et I63.</div>
</section>

<section class="ilot" id="i64-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse d’un AVC suspecté est brève et ciblée : elle précise le délai, les médicaments et les contre-indications, car ce sont elles qui déterminent la suite. Le patient aphasique ou confus ne peut souvent pas répondre ; l’entourage devient la source principale.</p>
<table class="t"><thead><tr><th>Question</th><th>Pourquoi elle compte</th><th>Source</th></tr></thead><tbody><tr><td>Quand le patient a-t-il été vu pour la dernière fois sans symptôme ?</td><td>Point de départ de la fenêtre de 4,5 heures dans les deux informations professionnelles suisses</td><td>Actilyse, Metalyse</td></tr><tr><td>Réveil avec déficit ou heure inconnue ?</td><td>La thrombolyse reste possible avec une sélection par imagerie</td><td>ESO 2021</td></tr><tr><td>Anticoagulant oral (antivitamine K, anticoagulant oral direct) ?</td><td>INR ou heure de dernière prise conditionnent la thrombolyse</td><td>ESO 2021 ; informations professionnelles</td></tr><tr><td>Héparine dans les 48 heures, antiagrégants ?</td><td>Contre-indications ou précautions de la thrombolyse</td><td>Informations professionnelles</td></tr><tr><td>Hémorragie intracrânienne, traumatisme crânien, chirurgie intracrânienne ou rachidienne récents ?</td><td>Contre-indication à la thrombolyse</td><td>Informations professionnelles</td></tr><tr><td>Chirurgie majeure ou accouchement depuis moins de 10 jours, ulcère actif, AVC antérieur ?</td><td>Contre-indication ou prudence</td><td>Informations professionnelles</td></tr><tr><td>Convulsion au début de l’épisode ?</td><td>Piste de simulateur, sans interdire en soi la thrombolyse</td><td>ESO 2021</td></tr></tbody></table>
<div class="two"><div class="card"><h4>Début connu</h4><p>L’heure du début est certaine. On calcule le temps écoulé depuis ce moment et on le compare aux 4,5 heures. Exemple : début à 07 h 30, fenêtre jusqu’à 12 h 00.</p>
</div><div class="card"><h4>Réveil ou heure inconnue</h4><p>Le dernier moment sans symptôme précède le sommeil. La thrombolyse n’est pas exclue : elle repose sur une discordance DWI-FLAIR ou un mismatch de perfusion dans les 9 heures suivant le milieu du sommeil (<button class="w" data-k="i64-reveil">conduite au réveil</button>).</p>
</div></div>
<p>Le public suisse doit appeler le <b>144</b> sans délai devant les symptômes d’alerte. Cet appel déclenche la chaîne préhospitalière décrite plus bas.</p>
<div class="trap"><span class="k">Piège</span> Prendre l’heure d’arrivée ou l’heure de découverte comme début. Le point de départ est le <i>dernier moment connu sans symptôme</i>.</div>
<div class="key"><b>À retenir.</b> Trois informations avant tout traitement : le dernier moment connu sans symptôme, les anticoagulants (avec INR ou heure de la dernière prise), les contre-indications à la thrombolyse.</div>
<p>Moyen mnémotechnique : <button class="w" data-k="i64-mnemo">D‑I‑A (aide pédagogique)</button>.</p>
</section>

<section class="ilot" id="i64-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen vise à quantifier le déficit, à mesurer les deux constantes qui conditionnent la thrombolyse (pression artérielle, glycémie) et à ne pas se laisser tromper par les scores qui prétendent séparer hémorragie et infarctus.</p>
<p>Le score <b><button class="w" data-k="i64-nihss">NIHSS (échelle de sévérité)</button></b> (National Institutes of Health Stroke Scale) quantifie la sévérité. L’information professionnelle d’Actilyse cite un NIHSS supérieur à 25 comme exemple d’AVC « sévère » contre-indiquant l’altéplase ; les recommandations européennes sur la thrombectomie ne retiennent en revanche aucune limite supérieure de NIHSS.</p>
<p>La pression artérielle et la glycémie capillaire se mesurent immédiatement : la thrombolyse exige une pression inférieure à 185/110 mmHg avant le bolus et la glycémie intervient dans l’éligibilité (<button class="w" data-k="i64-seuils-pa">seuils tensionnels</button>).</p>
<p>Les <b>scores cliniques de différenciation</b> (<button class="w" data-k="i64-scores">Guy’s, Siriraj, Allen : fiche de lecture</button>) semblent attrayants car ils n’exigent aucun examen. Leur performance réelle est insuffisante : à Glasgow (1059 patients), le score de Guy’s (13 variables) atteint une sensibilité de 70 % et une spécificité de 64 % pour l’hémorragie ; le score de Siriraj (5 variables) 68 % et 64 % ; la précision globale est de 64 % pour les deux. Aucun des deux ne suffit à exclure une hémorragie avant un anticoagulant ou de l’aspirine. Une étude indienne de 91 patients conclut de même pour les scores d’Allen, de Siriraj et grec.</p>
<div class="trap"><span class="k">Piège</span> Utiliser un score clinique pour « éliminer » l’hémorragie. Avec une sensibilité de 70 %, 30 hémorragies sur 100 sont classées à tort comme infarctus.</div>
<div class="key"><b>À retenir.</b> NIHSS pour la sévérité, tension et glycémie pour l’éligibilité, imagerie pour la nature. Les scores cliniques sont inférieurs à 70 % de sensibilité et ne remplacent jamais l’imagerie.</div>
<button class="pareto-btn ui" data-k="pareto-i64-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
