<template data-pop="g73-sous-jacente" data-title="Quelle maladie générale explique l’atteinte ?"><div class="lab">Pourquoi cette question vient en premier</div><p>G73 est une catégorie à astérisque : elle ne code pas une maladie, mais la manifestation neuromusculaire d’une maladie causale codée ailleurs. Poser la question de la cause n’est donc pas un temps facultatif, c’est le contenu même du codage.</p><div class="lab">Application au syndrome de Lambert-Eaton</div><p>Dans le syndrome de Lambert-Eaton, la cause est tumorale (C00–D48†) dans une partie des cas ; le carcinome bronchique à petites cellules est associé chez 50 à 60 % des patients. Dans l’autre partie, la forme est non tumorale et le déclencheur est inconnu. Le médecin cherche donc la tumeur sans la présumer.</p><div class="lab">Application aux myopathies</div><p>Pour une myopathie, les causes documentées dans ce cours sont endocriniennes (thyroïde, surrénale), médicamenteuses (glucocorticoïdes), infectieuses (influenza B, trichinellose) et auto-immunes (anti-SRP).</p><div class="lab">Limite</div><p>Pour G73.0, G73.3, G73.6 et G73.7, aucune source clinique n’a été lue en dehors des inclusions de la classification.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G70–G73</a> ; <a href="https://doi.org/10.1212/NXI.0000000000001014" target="_blank" rel="noopener">Graus et al., critères PNS-Care, Neurol Neuroimmunol Neuroinflamm 2021</a> ; <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a>.</p></template>
<template data-pop="g73-codage" data-title="Croix et astérisque : coder une atteinte neuromusculaire secondaire"><div class="lab">Règle</div><p>La CIM-10-GM distingue le code à <b>croix (†)</b>, qui désigne la maladie causale, et le code à <b>astérisque (*)</b>, qui désigne la manifestation dans un organe. G73* est un astérisque : il ne s’emploie jamais seul.</p><div class="lab">Exemple tiré de la classification</div><p>Un syndrome de Lambert-Eaton paranéoplasique se note avec un code de maladie tumorale (C00–D48†) et G73.1*. Une myopathie thyréotoxique se note avec E05.-† et G73.5*.</p><div class="lab">Limite</div><p>Les libellés français viennent du registre de l’Office fédéral de la statistique ; la classification originale est allemande. Le résumé de la page lue ne restitue pas tous les termes d’inclusion mot pour mot. La cartographie vers la CIM-11 reste à établir. Le code de la paralysie périodique thyréotoxique et celui de la myopathie cortisonique n’ont pas été vérifiés.</p><p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g70-g73.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G70–G73</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">OFS, CIM-10-GM 2024 en français</a>.</p></template>
<template data-pop="g73-smle" data-title="Syndrome myasthénique de Lambert-Eaton (SMLE)"><div class="lab">Définition</div><p>Maladie auto-immune rare de la jonction neuromusculaire. Elle associe une faiblesse musculaire proximale, une perte des réflexes ostéotendineux et une dysautonomie.</p><div class="lab">Place parmi les syndromes paranéoplasiques</div><p>Les critères PNS-Care 2021 classent le SMLE parmi les phénotypes à haut risque de syndrome neurologique paranéoplasique. Un tel phénotype doit faire rechercher un cancer sous-jacent.</p><div class="lab">Deux formes</div><p>La forme tumorale accompagne surtout un carcinome bronchique à petites cellules. La forme non tumorale (77 % dans la cohorte de Leiden) n’a pas de déclencheur connu.</p><p class="src">Références : <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a> ; <a href="https://doi.org/10.1212/NXI.0000000000001014" target="_blank" rel="noopener">Graus et al., critères PNS-Care, Neurol Neuroimmunol Neuroinflamm 2021</a> ; <a href="https://doi.org/10.1177/22143602261477475" target="_blank" rel="noopener">Bakker et al., traitements au long cours, J Neuromuscul Dis 2026</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a>.</p></template>
<template data-pop="g73-cbpc" data-title="Carcinome bronchique à petites cellules (CBPC)"><div class="lab">Lien avec le SMLE</div><p>Le CBPC est associé au SMLE chez 50 à 60 % des patients (51 %, soit 44 sur 87, dans la cohorte prospective de Leiden et de Nottingham).</p><div class="lab">Délai de découverte</div><p>Il est découvert dans les 6 mois chez 91 % des patients qui en ont un, et dans les 12 mois chez 98 %. Ces chiffres justifient la répétition de l’imagerie pendant deux ans.</p><div class="lab">Limite</div><p>Le CBPC n’est pas la seule tumeur possible : un carcinome neuroendocrine du larynx et un adénocarcinome pulmonaire mutant EGFR ont été rapportés avec un SMLE, chacun dans une publication isolée.</p><p class="src">Références : <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a> ; <a href="https://doi.org/10.1177/03000605211014784" target="_blank" rel="noopener">Mesolella et al., carcinome neuroendocrine laryngé, J Int Med Res 2021</a> ; <a href="https://doi.org/10.1111/1759-7714.13385" target="_blank" rel="noopener">Wang et al., adénocarcinome pulmonaire, Thorac Cancer 2020</a>.</p></template>
<template data-pop="g73-jonction" data-title="Zone active présynaptique et libération d’acétylcholine"><div class="lab">Physiologie normale</div><p>À la terminaison du nerf moteur, des vésicules contenant l’acétylcholine sont arrimées à la membrane, à proximité de canaux calciques voltage-dépendants. À chaque potentiel d’action, la relation entre canaux et vésicules gouverne la probabilité de libération.</p><div class="lab">Dans le SMLE</div><p>La probabilité de libération baisse. Le muscle reçoit moins d’acétylcholine par influx, d’où la faiblesse et l’amplitude basse du potentiel d’action musculaire composé de repos.</p><div class="lab">Limite</div><p>Des données expérimentales (modèle murin, simulations) suggèrent une désorganisation de la zone active et d’éventuels anticorps contre d’autres protéines présynaptiques. Il s’agit d’une hypothèse de recherche, pas d’un fait clinique établi.</p><p class="src">Références : <a href="https://doi.org/10.3390/biom12060740" target="_blank" rel="noopener">Ginebaugh et al., zone active de la jonction, Biomolecules 2022</a> ; <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a>.</p></template>
<template data-pop="g73-vgcc" data-title="Canaux calciques voltage-dépendants de type P/Q"><div class="lab">Rôle</div><p>Ces canaux de la terminaison nerveuse motrice et du système nerveux autonome laissent entrer le calcium à chaque potentiel d’action. Ce calcium commande la libération de l’acétylcholine.</p><div class="lab">Anticorps dans le SMLE</div><p>Les anticorps anti-VGCC sont présents chez près de 90 % des patients. Ils sont responsables de la baisse de libération provoquée par l’influx nerveux. Ils sont aussi fréquents dans les formes tumorales que non tumorales : ils ne distinguent pas les deux.</p><div class="lab">Détection</div><p>La radio-immunoprécipitation est la méthode citée ; l’immunohistochimie cérébrale n’est pas utile pour cet anticorps.</p><p class="src">Références : <a href="https://doi.org/10.1212/NXI.0000000000001014" target="_blank" rel="noopener">Graus et al., critères PNS-Care, Neurol Neuroimmunol Neuroinflamm 2021</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a> ; <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a>.</p></template>
<template data-pop="g73-facilitation" data-title="Facilitation des réflexes après l’effort"><div class="lab">Signe</div><p>Dans le SMLE, les réflexes sont diminués ou abolis au repos. Ils réapparaissent ou s’améliorent après un effort répété ou une contraction volontaire maximale.</p><div class="lab">Application</div><p>Le médecin teste le réflexe au repos, fait réaliser un effort répété ou une contraction volontaire maximale, puis teste à nouveau. Une amélioration appartient au tableau du SMLE.</p><div class="lab">Limite</div><p>Le dossier décrit le signe, mais ne documente ni sa sensibilité ni son mécanisme cellulaire. Il ne remplace pas l’électrophysiologie.</p><p class="src">Références : <a href="https://doi.org/10.1212/NXI.0000000000001014" target="_blank" rel="noopener">Graus et al., critères PNS-Care, Neurol Neuroimmunol Neuroinflamm 2021</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a>.</p></template>
<template data-pop="g73-deltap" data-title="Score DELTA-P : prédire un carcinome bronchique à petites cellules"><div class="lab">Définition</div><p>DELTA-P signifie Dutch-English LEMS Tumour Association Prediction. Il se calcule au diagnostic à partir des signes des trois premiers mois. Il comporte six items : symptômes bulbaires, dysfonction érectile chez l’homme, perte de poids d’au moins 5 %, tabagisme au début, âge de début d’au moins 50 ans, indice de Karnofsky.</p><table class="t"><thead><tr><th>Score</th><th>Risque de CBPC</th></tr></thead><tbody><tr><td>0</td><td>0 %</td></tr><tr><td>1</td><td>18,8 %</td></tr><tr><td>2</td><td>45 %</td></tr><tr><td>3</td><td>55,5 %</td></tr><tr><td>4</td><td>85,7 %</td></tr><tr><td>5</td><td>87,5 %</td></tr><tr><td>6</td><td>100 %</td></tr></tbody></table><p>L’aire sous la courbe ROC est de 82,5 %. En analyse multivariée, la perte de poids, le tabagisme et l’âge d’au moins 50 ans sont des prédicteurs indépendants. Sans l’item dysfonction érectile, un score à cinq items garde une aire de 84,5 %.</p><div class="lab">Limite</div><p>Un patient à score 1 a eu son CBPC 25 mois après le diagnostic : le score ne s’emploie pas seul. L’article original n’a pas été lu ; la pondération exacte des items et le seuil du Karnofsky ne sont pas documentés.</p><p class="src">Références : <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a>.</p></template>
<template data-pop="g73-pamc" data-title="Potentiel d’action musculaire composé (PAMC)"><div class="lab">Définition</div><p>Le PAMC est la réponse électrique du muscle à la stimulation de son nerf. Dans le SMLE, son amplitude de repos est basse aux muscles de la main.</p><div class="lab">Application</div><p>Le médecin mesure l’amplitude au repos, puis après une contraction volontaire maximale. Il calcule l’incrément. Il peut aussi utiliser la stimulation nerveuse répétée, où le décrément et l’incrément sont très sensibles.</p><div class="lab">Statut</div><p>L’électrophysiologie est obligatoire pour confirmer la suspicion clinique de SMLE.</p><p class="src">Références : <a href="https://doi.org/10.1212/NXI.0000000000001014" target="_blank" rel="noopener">Graus et al., critères PNS-Care, Neurol Neuroimmunol Neuroinflamm 2021</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a> ; <a href="https://doi.org/10.1016/B978-0-12-823912-4.00012-8" target="_blank" rel="noopener">Lipka et al., syndrome de Lambert-Eaton, Handb Clin Neurol 2024</a>.</p></template>
<template data-pop="g73-increment" data-title="Incrément : calcul et seuil de 60 %"><div class="lab">Calcul</div><p>Incrément (%) = (amplitude après contraction maximale − amplitude de repos) ÷ amplitude de repos × 100.</p><div class="lab">Exemple fictif</div><p>Repos 2,0 mV, après contraction 3,6 mV : (3,6 − 2,0) ÷ 2,0 × 100 = 80 %.</p><table class="t"><thead><tr><th>Seuil</th><th>Sensibilité</th><th>Spécificité</th></tr></thead><tbody><tr><td>60 %</td><td>77,8 %</td><td>98,9 %</td></tr><tr><td>100 %</td><td>58,7 %</td><td>100 %</td></tr></tbody></table><p>L’étude de Leiden (156 patients, dont 63 SMLE) recommande d’abaisser le seuil à 60 %. La cohorte prospective Leiden–Nottingham utilise un incrément supérieur à 60 % dans ses critères.</p><p class="src">Références : <a href="https://doi.org/10.1002/mus.26885" target="_blank" rel="noopener">Lipka et al., seuil d’incrément, Muscle Nerve 2020</a> ; <a href="https://doi.org/10.1038/s41598-020-67571-9" target="_blank" rel="noopener">Maddison et al., score DELTA-P, Sci Rep 2020</a>.</p></template>
<template data-pop="g73-periodique" data-title="Paralysie périodique hypokaliémique thyréotoxique : mécanisme"><div class="lab">Tableau</div><p>Épisodes transitoires de faiblesse avec hypokaliémie au cours d’une hyperthyroïdie ; prédominance masculine, surtout asiatique. Les risques sont les arythmies et l’insuffisance respiratoire.</p><div class="lab">Mécanisme</div><p>Les hormones thyroïdiennes augmentent la Na⁺/K⁺-ATPase et la sensibilité β-adrénergique. Le potassium passe du sang vers l’intérieur des cellules. Le pic d’insuline qui suit un repas aggrave ce transfert. L’hypokaliémie hyperpolarise la membrane musculaire et la rend inexcitable.</p><div class="lab">Limite</div><p>Le rattachement CIM n’est pas vérifié. Le dossier ne documente ni le traitement ni la correction du potassium.</p><p class="src">Références : <a href="https://doi.org/10.3803/EnM.2025.2554" target="_blank" rel="noopener">Qing et al., paralysie périodique hypokaliémique thyréotoxique, Endocrinol Metab 2025</a>.</p></template>
<template data-pop="g73-srp" data-title="Myopathie nécrosante auto-immune anti-SRP"><div class="lab">Cas publié</div><p>Une patiente suivie pour une hypothyroïdie avait une créatine kinase de 6 106 U/L qui persistait malgré l’hormonothérapie. La biopsie et la recherche d’anticorps spécifiques ont établi une myopathie nécrosante auto-immune avec anticorps anti-SRP.</p><div class="lab">Leçon</div><p>Une créatine kinase qui ne baisse pas sous lévothyroxine impose de chercher une autre cause.</p><div class="lab">Limite</div><p>Cas unique. Le traitement n’est pas documenté dans le dossier.</p><p class="src">Références : <a href="https://doi.org/10.5414/NP301434" target="_blank" rel="noopener">Shi et al., hypothyroïdie et myopathie anti-SRP, Clin Neuropathol 2022</a>.</p></template>
<template data-pop="g73-cortisone" data-title="Myopathie cortisonique : tableau et mécanisme"><div class="lab">Tableau</div><p>Faiblesse proximale non douloureuse, amyotrophie prédominant aux membres inférieurs, CK normales ou peu élevées. La biopsie montre une atrophie préférentielle des fibres de type II sans infiltrat inflammatoire.</p><div class="lab">Mécanisme</div><p>Inhibition de la synthèse protéique (voie mTOR et IGF-1) et activation de la dégradation (ubiquitine-protéasome, autophagie-lysosome) via les facteurs FOXO et les atrogènes MuRF-1 et atrogine-1.</p><div class="lab">Conduite</div><p>Réduction progressive ou arrêt des glucocorticoïdes, rééducation par exercices de résistance et d’endurance.</p><div class="lab">Limite</div><p>Le code CIM habituel n’est pas vérifié ; la source lue est une revue française, dont l’abstract seul a été lu.</p><p class="src">Références : <a href="https://doi.org/10.1016/j.revmed.2026.03.439" target="_blank" rel="noopener">Solé et al., prise en charge de la myopathie cortisonique, Rev Med Interne 2026</a> ; <a href="https://doi.org/10.1007/s00415-025-13482-6" target="_blank" rel="noopener">Géfard-Gontier et al., myopathie cortisonique, J Neurol 2025</a>.</p></template>
<template data-pop="g73-myosite-enfant" data-title="Myosite aiguë bénigne de l’enfant"><div class="lab">Série portugaise</div><p>47 cas de 2016 à 2024 : garçons 66 %, âge médian 7 ans, prodrome fébrile respiratoire, douleur bilatérale des mollets, CK médiane 4 986 U/L, virus influenza B dans 63 %. Guérison complète pour tous, séjour médian de 3,2 jours.</p><div class="lab">Contexte</div><p>Aucun cas n’est survenu pendant la pandémie de COVID-19.</p><div class="lab">Limite</div><p>Série d’un seul pays ; aucune donnée suisse. Aucun traitement spécifique n’est décrit dans le dossier.</p><p class="src">Références : <a href="https://doi.org/10.3390/pediatric18020047" target="_blank" rel="noopener">Ferreira et al., myosite aiguë bénigne de l’enfant, Pediatr Rep 2026</a>.</p></template>
<template data-pop="g73-trichinellose" data-title="Trichinellose : fréquence et signes"><div class="lab">Fréquence</div><p>65 818 cas et 42 décès ont été rapportés de 1986 à 2009 (261 rapports, 41 pays), dont 87 % dans la Région européenne de l’Organisation mondiale de la santé.</p><div class="lab">Source et signes</div><p>La viande de porc est la source principale, et le gibier est fréquent. Les signes principaux sont les myalgies, la diarrhée, la fièvre, l’œdème facial et les céphalées.</p><div class="lab">Limite</div><p>Le traitement (albendazole, mébendazole) et le diagnostic sérologique ne sont pas documentés dans le dossier.</p><p class="src">Références : <a href="https://doi.org/10.3201/eid1712.110896" target="_blank" rel="noopener">Murrell et Pozio, trichinellose dans le monde, Emerg Infect Dis 2011</a>.</p></template>
<template data-pop="g73-amifampridine" data-title="Amifampridine : mécanisme et niveaux de preuve"><div class="lab">Mécanisme</div><p>Blocage des canaux potassiques voltage-dépendants, prolongation de la dépolarisation présynaptique, augmentation de l’entrée de calcium, facilitation de l’exocytose des vésicules d’acétylcholine.</p><table class="t"><thead><tr><th>Source</th><th>Résultat</th></tr></thead><tbody><tr><td>Cochrane, 4 essais, 54 participants</td><td>QMG −2,44 points (IC 95 % 1,22–3,6) ; PAMC +1,36 mV (0,99–1,72) ; preuve modérée à élevée</td></tr><tr><td>Méta-analyse 2021, 6 essais, 115 patients</td><td>QMG −2,76 points ; PAMC +1,34 mV</td></tr><tr><td>Leiden, 70 patients</td><td>Tous traités, 91 % dans les 6 mois ; leg score amélioré chez 57 % ; effets indésirables chez 58 % ; arrêt chez 7 %</td></tr></tbody></table><div class="lab">Limite</div><p>Les essais sont courts et petits ; la cohorte est rétrospective. L’amifampridine n’est pas efficace en ajout à la pyridostigmine dans la myasthénie.</p><p class="src">Références : <a href="https://amiko.oddb.org/fr/fi?gtin=7680618530019" target="_blank" rel="noopener">Information professionnelle suisse Firdapse®, janvier 2022</a> ; <a href="https://doi.org/10.1002/14651858.CD003279.pub3" target="_blank" rel="noopener">Keogh et al., revue Cochrane 2011</a> ; <a href="https://doi.org/10.1186/s12883-021-02405-3" target="_blank" rel="noopener">Zhang et al., méta-analyse de la 3,4-diaminopyridine, BMC Neurol 2021</a> ; <a href="https://doi.org/10.1177/22143602261477475" target="_blank" rel="noopener">Bakker et al., traitements au long cours, J Neuromuscul Dis 2026</a> ; <a href="https://doi.org/10.1212/WNL.0000000000214715" target="_blank" rel="noopener">Remijn-Nelissen et al., amifampridine dans la myasthénie, Neurology 2026</a>.</p></template>
<template data-pop="g73-immuno" data-title="Immunoglobulines intraveineuses, prednisolone, azathioprine"><div class="lab">Preuves</div><p>Immunoglobulines intraveineuses : essai croisé de 9 participants, force améliorée jusqu’à 8 semaines. Prednisolone et azathioprine : habituelles pour l’immunosuppression au long cours des formes non tumorales. Rituximab : cas isolés.</p><div class="lab">Réalité de terrain</div><p>À Leiden, 44 % des patients prenaient un immunosuppresseur à 5 ans ; les arrêts pour effets indésirables ont concerné 50 % des patients sous azathioprine et 38 % sous prednisolone.</p><div class="lab">Limite</div><p>Posologies et informations professionnelles suisses non consultées pour ce cours.</p><p class="src">Références : <a href="https://doi.org/10.1002/14651858.CD003279.pub3" target="_blank" rel="noopener">Keogh et al., revue Cochrane 2011</a> ; <a href="https://doi.org/10.1111/j.1749-6632.2012.06769.x" target="_blank" rel="noopener">Maddison, traitement du syndrome de Lambert-Eaton, Ann N Y Acad Sci 2012</a> ; <a href="https://doi.org/10.1177/22143602261477475" target="_blank" rel="noopener">Bakker et al., traitements au long cours, J Neuromuscul Dis 2026</a>.</p></template>
<template data-pop="g73-lacunes" data-title="Limites des sources de ce cours"><div class="lab">Niveau de lecture</div><p>Le texte intégral n’a été lu que pour les critères PNS-Care 2021, la cohorte DELTA-P, les informations professionnelles suisses de Firdapse® et de Mestinon® et la classification. Les autres sources n’ont été lues qu’en abstract.</p><div class="lab">Ce qui manque</div><p>Aucune recommandation suisse ni européenne de société savante, aucune donnée épidémiologique suisse, les posologies des immunosuppresseurs et des immunoglobulines, le remboursement de Firdapse®, les sources cliniques de G73.0, G73.3, G73.6 et G73.7.</p><div class="lab">Statut</div><p>Revue par intelligence artificielle, distincte d’une validation médicale humaine. Audit différé.</p></template>
