<p>Dans cette <b>vignette fictive</b>, une femme de 62 ans consulte parce que sa marche est devenue instable depuis huit mois. Elle trébuche, elle fait tomber les objets qu’elle saisit et son entourage trouve sa parole empâtée. Elle boit de l’alcool régulièrement, et chacun, elle comprise, pense avoir trouvé l’explication. Aucun diagnostic n’est encore posé. Le cours part de cette situation parce qu’elle impose trois questions successives, qui structurent toute la démarche.</p>
<p>La première question porte sur le siège : l’incoordination vient-elle du cervelet, de la perte de la sensibilité profonde (la proprioception) ou du système vestibulaire ? La deuxième porte sur le tempo : le trouble s’est-il installé en quelques heures, en semaines, en mois ou en années, ou survient-il par épisodes ? La troisième porte sur la cause : existe-t-il une explication acquise et traitable, comme une carence, un médicament, l’alcool, une maladie immune ou un cancer, avant d’envisager une maladie génétique ou dégénérative ? Les spécialistes qui ont rédigé la ligne directrice allemande, autrichienne et suisse sur les ataxies de l’adulte rappellent que la recherche d’une cause acquise ne peut être omise qu’en présence d’une preuve indiscutable de cause génétique (<button class="w" data-k="r27-guideline">ligne directrice DGN, ÖGN et SNG, 2024 (portée et limites)</button>).</p>
<p>La catégorie <b>R27, Autres troubles de la coordination</b>, est une catégorie de <b>symptômes</b>. Elle sert tant que la cause n’est pas établie. Ce cours enseigne donc une démarche, non une maladie unique : reconnaître l’ataxie, la situer, apprécier son tempo, chercher d’abord ce qui se traite, repérer les urgences, puis recoder dès que le diagnostic est posé. À l’examen fédéral, cette démarche correspond à la situation de départ 98 des objectifs PROFILES (<button class="w" data-k="r27-ssp">situations de départ 96, 97, 98, 99, 100 et 103 (voisinages)</button>).</p>
<div class="key"><b>À retenir.</b> Devant une ataxie, on répond dans l’ordre à trois questions : quel siège, quel tempo, quelle cause acquise traitable. Une ataxie rapidement progressive (semaines à mois) ou une ataxie aiguë avec vertige est une urgence. L’alcool est souvent accusé à tort : un bilan complémentaire révèle souvent une autre explication.</div>
</section>
<section class="ilot" id="r27-1"><h2><span class="n">1</span>Définitions, périmètre et classifications</h2>
<h3>1.1 L’ataxie et ses trois sources</h3>
<p>Une <button class="w" data-k="r27-ataxie">ataxie (définition et vocabulaire)</button> est un défaut de coordination des mouvements et de l’équilibre. Les patients la décrivent par la maladresse, l’instabilité, l’incoordination et une parole empâtée (<button class="w" data-k="r27-pract">revue Practical Neurology 2019 (recommandations britanniques)</button>). Ils se plaignent rarement d’une oscillopsie, c’est-à-dire d’une impression que l’environnement oscille. Trois structures peuvent en être la source : le cervelet, la proprioception (par atteinte des neurones sensitifs) et le vestibule. Lorsque l’atteinte du cervelet, de la proprioception et du vestibule se combine, elle définit le syndrome <button class="w" data-k="r27-canvas">CANVAS (ataxie cérébelleuse, neuropathie, aréflexie vestibulaire)</button>.</p>
<p>Il faut distinguer cet usage clinique du sens strict de la ligne directrice : les « ataxies » y désignent les maladies <b>non focales</b> du cervelet et de ses connexions, dont le symptôme cardinal est une ataxie progressive ou épisodique. Une maladie focale (tumeur, abcès, infarctus, hémorragie, sclérose en plaques) se distingue le plus souvent par la clinique, mais seule l’<button class="w" data-k="r27-irm">IRM (indices d’imagerie)</button> tranche avec certitude. Le terme voisin de « déséquilibre » désigne toute perturbation aiguë de la station, de la marche ou de la stabilité posturale (définition des symptômes posturaux de la Bárány Society, citée dans la revue européenne de 2026 sur le syndrome de déséquilibre aigu).</p>
<h3>1.2 Périmètre de la catégorie R27 dans la CIM-10-GM 2024</h3>
<p>La catégorie R27 appartient au chapitre 18, celui des symptômes et signes (bloc R25 à R29). Elle comprend R27.0, <i>Ataxie, sans précision</i>, et R27.8, <i>Troubles de la coordination, autres et non précisés</i>. Le BfArM exclut de R27 la démarche ataxique (R26.0), l’ataxie héréditaire (G11.-) et le vertige sans précision (R42). Ce cours range sous R27.0 l’ataxie dont la cause n’est pas encore établie, et sous R27.8 les signes cérébelleux segmentaires sans ataxie nommée, comme la dysmétrie, l’adiadococinésie ou le tremblement intentionnel. Cette répartition est un choix pédagogique du cours : aucune note du BfArM ne précise le contenu de R27.0 et de R27.8 (<button class="w" data-k="r27-cim">règle de codage et recodage après diagnostic</button>).</p>
<p>La conséquence pratique est simple : l’ataxie limitée à la marche se code R26.0 ; une ataxie héréditaire confirmée se code G11.- ; une atrophie multisystématisée de type cérébelleux (<button class="w" data-k="r27-msa">MSA-C</button>) se code G23.3 et une dégénérescence cérébelleuse alcoolique G31.2, selon les mots-clés de classification donnés par la ligne directrice. R27 est donc un code d’attente, que l’on abandonne dès que la cause est connue.</p>
<h3>1.3 Classification par cause</h3>
<p>La ligne directrice répartit les ataxies de l’adulte en trois familles, ce qui guide l’ordre des recherches.</p>
<table class="t"><thead><tr><th>Famille</th><th>Groupes</th><th>Exemples du cours</th></tr></thead><tbody><tr><td><b>Acquises</b></td><td>Toxiques et carentielles ; immunes ; autres causes acquises</td><td><button class="w" data-k="r27-acd">Dégénérescence cérébelleuse alcoolique</button> ; <button class="w" data-k="r27-immune">ataxies immunes</button> et <button class="w" data-k="r27-pcd">paranéoplasiques</button> ; ataxie au gluten</td></tr><tr><td><b>Génétiques</b></td><td>Récessives ; dominantes ; épisodiques ; liées à une prémutation</td><td><button class="w" data-k="r27-friedreich">Ataxie de Friedreich</button> ; ataxie liée au gène RFC1 ; <button class="w" data-k="r27-sca">ataxies spinocérébelleuses</button> ; <button class="w" data-k="r27-ea">ataxies épisodiques</button> ; <button class="w" data-k="r27-fxtas">FXTAS</button></td></tr><tr><td><b>Dégénératives sporadiques</b></td><td>Formes sans cause génétique ni acquise retrouvée</td><td><button class="w" data-k="r27-msa">MSA-C</button> ; <button class="w" data-k="r27-saoa">ataxie sporadique de l’adulte (SAOA)</button></td></tr></tbody></table>
<p>Ce tableau n’est pas un arbre de décision. Il rappelle que la famille la plus rentable à explorer en premier est la famille acquise, parce qu’elle est la plus souvent traitable. La probabilité d’une ataxie acquise augmente avec l’âge.</p>
<h3>1.4 Classification par tempo et par âge de début</h3>
<p>Le tempo est le deuxième indice clinique le plus utile après l’âge de début. On distingue une ataxie aiguë, subaiguë, épisodique ou chronique. Une progression en semaines à mois évoque une dégénérescence paranéoplasique, une maladie de Creutzfeldt-Jakob sporadique ou une MSA-C, qui évolue plus vite que les autres ataxies dégénératives (Practical Neurology, 2019). L’âge de début oriente aussi : avant 20 ans, la cause est surtout génétique (récessive ou mitochondriale), même sans antécédent familial ; les ataxies spinocérébelleuses dominantes débutent plutôt entre les troisième et quatrième décennies (de façon plus précise, le plus souvent entre 30 et 40 ans, les types 6 et 27B dépassant 50 ans).</p>
<h3>1.5 Mesurer la sévérité</h3>
<p>La <button class="w" data-k="r27-sara">SARA (échelle d’évaluation de l’ataxie, 8 items)</button> est l’échelle clinique standard : marche (0 à 8), station (0 à 6), position assise (0 à 4), parole (0 à 6), poursuite du doigt, doigt-nez, mouvements alternatifs rapides et talon-genou (0 à 4 chacun, moyenne des deux côtés). Aux urgences, c’est une autre graduation qui sert : l’<button class="w" data-k="r27-gti">instabilité tronculaire graduée (GTI)</button>, dont le grade 2 correspond à une marche autonome impossible et le grade 3 à une station ou une position assise impossible sans aide.</p>
<div class="key"><b>À retenir.</b> R27 est un code de symptôme, abandonné dès que la cause est connue. Les trois familles (acquise, génétique, dégénérative sporadique) se parcourent dans cet ordre de rentabilité. Âge de début et tempo orientent d’abord ; la SARA mesure ensuite, la GTI trie en urgence.</div>
<button class="pareto-btn ui" data-k="pareto-r27-def">▲ Loi de Pareto — Définitions et classifications</button>

<section class="ilot" id="r27-2"><h2><span class="n">2</span>Fréquence</h2>
<p><b>Aucune donnée suisse n’a été trouvée</b> sur la fréquence de l’ataxie ou de ses causes (lacune assumée, voir la fin du cours). Les chiffres ci-dessous viennent de la ligne directrice allemande, autrichienne et suisse et de sources européennes ou internationales ; ils décrivent d’autres populations et ne sont pas des taux suisses.</p>
<table class="t"><thead><tr><th>Mesure</th><th>Valeur</th><th>Source et population</th></tr></thead><tbody><tr><td>Prévalence des ataxies</td><td>environ 10 à 20 pour 100 000 ; plus de 200 formes génétiquement définies</td><td>Ligne directrice DGN, ÖGN et SNG, 2024</td></tr><tr><td>Ataxies héréditaires dominantes</td><td>moyenne 2,7 pour 100 000 (0,0 à 5,6) ; type 3 le plus fréquent, puis types 2 et 6</td><td>Revue systématique de 22 études, 16 pays (Neuroepidemiology, 2014)</td></tr><tr><td>Ataxies héréditaires récessives</td><td>moyenne 3,3 pour 100 000 (0,0 à 7,2) ; Friedreich en tête</td><td>Même revue</td></tr><tr><td>Ataxies et paraplégies spastiques héréditaires réunies</td><td>environ 1 pour 10 000</td><td>Même revue</td></tr><tr><td>Ataxie de Friedreich</td><td>1 pour 20 000 à 50 000 chez les Caucasiens</td><td>Practical Neurology, 2019</td></tr><tr><td>Porteurs de l’expansion du gène RFC1</td><td>0,7 % des Européens</td><td>Nature Genetics, 2019</td></tr><tr><td>Dégénérescence cérébelleuse paranéoplasique</td><td>0,22 pour 100 000 personnes-années</td><td>Frioul, Italie (Vogrig, 2019)</td></tr><tr><td>Ataxie aiguë de l’enfant</td><td>0,021 % des consultations d’urgences pédiatriques ; âge moyen 5,8 ans</td><td>509 enfants, 11 urgences italiennes (Arch Dis Child, 2019)</td></tr></tbody></table>
<p>Quelques rapports permettent d’éviter des erreurs de raisonnement. En Europe centrale, les ataxies récessives les plus fréquentes sont celles de Friedreich et du gène RFC1 ; les ataxies spinocérébelleuses les plus fréquentes sont les types 1, 2, 3, 6 et 27B. Plus de 10 % des ataxies sporadiques de l’adulte portent une mutation malgré une anamnèse familiale négative ; en sens inverse, 33 à 92 % des familles à ataxie dominante restent sans diagnostic génétique après bilan. L’ataxie au gluten représente 25 % des cas sporadiques dans la série de Sheffield, une proportion nettement plus faible ailleurs. L’ataxie liée à l’anticorps anti-GAD touche les femmes quatre fois plus que les hommes ; le syndrome FXTAS débute en moyenne vers 60 ans et touche surtout les hommes.</p>
<div class="trap"><span class="k">Population des chiffres</span> Une prévalence de 10 à 20 pour 100 000 ne dit pas combien de patients ataxiques vous verrez au cabinet : elle décrit des maladies définies, non le symptôme. Aucun chiffre suisse n’est déduit des taux étrangers, et les pourcentages de familles sans diagnostic montrent que l’absence de mutation trouvée n’exclut pas une cause génétique.</div>
<div class="key"><b>À retenir.</b> Rien de suisse n’est documenté. En Europe, une ataxie sur dix sporadiques cache une mutation et la moitié des familles dominantes restent sans diagnostic moléculaire : l’anamnèse familiale négative n’exclut pas une cause génétique.</div>
</section>
<section class="ilot" id="r27-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Du normal au pathologique</h3>
<p>Chez la personne saine, le vermis cérébelleux est essentiel au contrôle postural. Le cervelet transforme l’information sensorielle en commandes motrices correctement synchronisées : les muscles se contractent au bon moment et dans la bonne séquence (<button class="w" data-k="r27-cervelet">consensus sur la marche ataxique, 2023 (physiologie et limites)</button>). Cette synchronisation permet les synergies de la locomotion, c’est-à-dire la coordination des muscles du tronc et des membres pendant la marche.</p>
<p>Chez le patient cérébelleux, la synchronisation des décharges musculaires est altérée. Les synergies de la locomotion sont donc désorganisées. Des décharges musculaires prolongées et une coactivation accrue des muscles agonistes et antagonistes majorent l’oscillation du corps, et l’adaptation locomotrice est altérée : le patient n’apprend plus à corriger sa marche. L’ataxie de la station et de la marche est souvent le premier déficit, et elle expose aux chutes. Le détail de l’organisation corticale et des voies du cervelet ne figure pas dans les sources lues par ce cours (lacune assumée).</p>
<h3>3.2 Trois sources d’ataxie</h3>
<p>L’équilibre dépend de trois entrées : le cervelet (qui coordonne), la proprioception (qui informe sur la position des membres et du tronc) et le vestibule (qui informe sur la position de la tête). L’atteinte de l’une de ces trois entrées suffit à produire une ataxie ; leur association définit le <button class="w" data-k="r27-canvas">CANVAS</button>. Cette notion a une conséquence diagnostique : une ataxie tardive n’est pas forcément cérébelleuse, et un trouble sensitif ou vestibulaire doit être recherché à l’examen et par la neurographie ou le test d’impulsion céphalique. Une aide mnémotechnique figure dans <button class="w" data-k="r27-mnemo">l’aide pédagogique des trois entrées</button>.</p>
<h3>3.3 Mécanismes propres à quelques causes</h3>
<ul>
<li><b>Dégénérescence cérébelleuse alcoolique</b> : elle résulte d’une carence en thiamine et de la toxicité de l’alcool et de ses métabolites (<button class="w" data-k="r27-acd">ACD</button>).</li>
<li><b>Ataxies épisodiques</b> : des variantes de protéines synaptiques qui maintiennent le potentiel de membrane ou déclenchent le potentiel d’action. Dans le type 1, le gène du canal potassique KCNA1 est touché ; dans le type 2, le gène du canal calcique CACNA1A (<button class="w" data-k="r27-ea">ataxies épisodiques</button>).</li>
<li><b>Ataxie de Friedreich</b> : une expansion GAA biallélique dans l’intron 1 du gène FXN. L’ataxie est surtout afférente, c’est-à-dire liée à la perte d’information sensitive, avec neuropathie sensitive et atteinte pyramidale (<button class="w" data-k="r27-friedreich">Friedreich</button>).</li>
<li><b>Phénytoïne</b> : une atrophie cérébelleuse irréversible est possible au long cours au-delà de 25 µg/ml (information professionnelle de Phenhydan®, juin 2024).</li>
</ul>
<h3>3.4 Topographie vasculaire d’une ataxie aiguë</h3>
<p>Une série consécutive de 34 patients à Lausanne a corrélé la clinique à l’IRM des infarctus cérébelleux (Barth, Bogousslavsky et Regli, 1993). Le territoire artériel explique le tableau, ce qui aide à ne pas négliger un infarctus devant une instabilité isolée.</p>
<table class="t"><thead><tr><th>Territoire</th><th>Tableau clinique</th></tr></thead><tbody><tr><td><button class="w" data-k="r27-pica">Artère cérébelleuse postéro-inférieure (PICA), médiale</button></td><td>Vertige aigu et ataxie tronculaire</td></tr><tr><td>PICA, latérale</td><td>Instabilité, ataxie des membres, dysmétrie, sans dysarthrie</td></tr><tr><td>Artère cérébelleuse antéro-inférieure (AICA)</td><td>Ataxie des membres et du tronc avec signes latéro-pontiques</td></tr><tr><td>Artère cérébelleuse supérieure</td><td>Dysarthrie, instabilité ou vertige, ataxie des membres, dysmétrie</td></tr></tbody></table>
<div class="trap"><span class="k">Piège</span> Cette série de 1993 décrit des infarctus non expansifs. Elle sert à relier territoire et tableau, non à estimer le risque actuel d’un infarctus cérébelleux œdémateux (voir l’îlot sur les urgences).</div>
<div class="key"><b>À retenir.</b> L’ataxie a trois sources (cervelet, proprioception, vestibule). Dans l’atteinte cérébelleuse, c’est la synchronisation musculaire qui est altérée, ce qui expose aux chutes. Chaque territoire artériel cérébelleux a un tableau propre.</div>

<section class="ilot" id="r27-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Le tableau regroupe les causes par famille, avec la source de chacune. La liste des médicaments est celle de la ligne directrice ; elle montre qu’une revue du traitement est la première étape de toute ataxie acquise.</p>
<table class="t"><thead><tr><th>Groupe</th><th>Causes principales</th><th>Source</th></tr></thead><tbody>
<tr><td><b>Toxiques</b></td><td>Alcool chronique (cause toxique la plus fréquente) ; lithium, métronidazole ; antiépileptiques (gabapentine, lacosamide, lamotrigine, oxcarbazépine, phénytoïne, primidone, valproate, zonisamide) ; ciclosporine, cytarabine, tacrolimus ; amiodarone, propafénone ; cocaïne, héroïne, phencyclidine ; métaux lourds, solvants ; hyperthermie, radiothérapie</td><td>Ligne directrice §5.1</td></tr>
<tr><td><b>Carentielles</b></td><td>Vitamines B1, B12 et E</td><td>Ligne directrice ; Practical Neurology</td></tr>
<tr><td><b>Immunes</b></td><td>Maladie cœliaque (gluten), maladie de Behçet, lupus, syndrome de Sjögren ; anticorps antineuronaux (anti-Yo, anti-Hu, anti-Ri, anti-GAD, anti-Caspr2, anti-IgLON5 et d’autres) ; inhibiteurs de points de contrôle immunitaire</td><td>Ligne directrice §5.3</td></tr>
<tr><td><b>Infectieuses</b></td><td>Infection par le virus de l’immunodéficience humaine, maladie de Creutzfeldt-Jakob sporadique, leucoencéphalopathie multifocale progressive ; ataxie postvaricelleuse</td><td>Practical Neurology</td></tr>
<tr><td><b>Structurelles focales</b></td><td>Infarctus, hémorragie, tumeur, abcès, sclérose en plaques, traumatisme</td><td>Ligne directrice §3 ; Practical Neurology</td></tr>
<tr><td><b>Génétiques</b></td><td>Friedreich, ataxie liée à RFC1 (CANVAS), SPG7, ARSACS, POLG, ataxie-télangiectasie, ataxies avec apraxie oculomotrice, ataxies spinocérébelleuses, ataxies épisodiques, FXTAS, maladie de Niemann-Pick de type C, xanthomatose cérébrotendineuse, ataxie avec déficit en vitamine E, abêtalipoprotéinémie, maladie de Refsum, ataxie liée à COQ8A</td><td>Ligne directrice §6 à 9 ; Practical Neurology</td></tr>
<tr><td><b>Dégénératives sporadiques</b></td><td>MSA-C ; ataxie sporadique de l’adulte (SAOA)</td><td>Ligne directrice §10</td></tr>
<tr><td><b>Enfant (ataxie aiguë)</b></td><td>Post-infectieuse 33,6 % ; tumeurs cérébrales 11,2 % ; migraine et apparentés 9 %</td><td>Garone et al., 2019</td></tr>
</tbody></table>
<p>Deux principes de raisonnement en découlent. Premièrement, la probabilité d’une ataxie acquise augmente avec l’âge. Deuxièmement, une consanguinité des parents ou un frère ou une sœur atteint sans parent atteint rend une forme récessive très probable.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Attribuer l’ataxie à l’alcool dès que le patient boit. Practical Neurology rappelle que l’alcool est souvent invoqué à tort comme seule cause, et qu’un bilan complémentaire révèle souvent une autre explication. La consommation d’alcool rend la <button class="w" data-k="r27-acd">dégénérescence cérébelleuse alcoolique</button> possible, elle ne la prouve pas.</div>
<div class="key"><b>À retenir.</b> Avant tout bilan coûteux : revue des médicaments et des toxiques, puis carences (B1, B12, E), puis causes immunes et cancer. Une ataxie génétique reste possible sans antécédent familial.</div>
</section>
<section class="ilot" id="r27-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>Les symptômes sont la maladresse, l’instabilité, l’incoordination, la dysarthrie et, rarement, l’oscillopsie. L’anamnèse cherche d’abord à fixer l’<b>âge de début</b> et la <b>vitesse de progression</b>, qui sont les deux indices cliniques les plus utiles pour orienter la cause. Chaque question suivante vise une cause précise.</p>
<table class="t"><thead><tr><th>Question à poser</th><th>Ce qu’elle cherche</th></tr></thead><tbody>
<tr><td>Début, âge, vitesse de progression</td><td>Aigu, subaigu, chronique ; progression en semaines à mois = urgence (cancer, Creutzfeldt-Jakob)</td></tr>
<tr><td>Anamnèse familiale exhaustive</td><td>Forme dominante ou récessive ; une anamnèse négative n’exclut pas une forme génétique</td></tr>
<tr><td>Médicaments, toxiques, alcool</td><td>Ataxie toxique ou iatrogène</td></tr>
<tr><td>Épisodes paroxystiques</td><td>Ataxie épisodique</td></tr>
<tr><td>Petit-fils ou neveu avec retard mental</td><td>Prémutation FMR1, donc FXTAS</td></tr>
<tr><td>Toux chronique</td><td>Ataxie liée à RFC1</td></tr>
<tr><td>Symptômes dysautonomiques</td><td>MSA-C</td></tr>
<tr><td>Diarrhée chronique ; troubles du sommeil, stridor</td><td>Anticorps anti-DPPX ; anticorps anti-IgLON5</td></tr>
</tbody></table>
<p>Les deux ataxies épisodiques ont des histoires typiques. Dans le <b>type 1</b>, les épisodes durent de quelques secondes à quelques minutes et sont déclenchés par un sursaut, un mouvement brusque ou un effort ; des myokymies existent entre les crises. Dans le <b>type 2</b>, les épisodes durent de 15 minutes à plusieurs jours et sont déclenchés par le stress, l’alcool, le café ou l’effort ; ils s’accompagnent de vertige, d’oscillopsie, de nausées, et la migraine est fréquente.</p>
<div class="two"><div class="card"><h4>Progression en semaines à mois</h4><p>Elle impose une recherche urgente de cancer. Les causes évoquées sont la dégénérescence paranéoplasique, la maladie de Creutzfeldt-Jakob sporadique et, plus rapide que les autres formes dégénératives, la MSA-C.</p></div><div class="card"><h4>Progression en années</h4><p>Elle évoque une ataxie dégénérative ou génétique, mais l’éventail acquis traitable (carences, toxiques, gluten) doit rester exploré avant de conclure à une cause génétique.</p></div></div>
<p>Les fréquences chiffrées des symptômes dans une population ataxique générale n’ont pas été trouvées (lacune assumée).</p>
<div class="key"><b>À retenir.</b> Deux questions orientent plus que toutes les autres : l’âge de début et la vitesse de progression. Ajoutez toujours médicaments, alcool, famille et épisodes paroxystiques. L’anamnèse familiale négative n’exclut rien.</div>
</section>
<section class="ilot" id="r27-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen répond à deux objectifs : confirmer le syndrome cérébelleux, puis chercher les indices qui orientent la cause.</p>
<div class="two"><div class="card"><h4>Signes cérébelleux (Practical Neurology)</h4><p>Ataxie de la marche, puis troubles de l’équilibre assis (plus tardifs). Nystagmus évoqué par la direction du regard, poursuite saccadée, saccades hypométriques ou hypermétriques. Dysarthrie. Tremblement intentionnel, dysmétrie, dysdiadococinésie. La <button class="w" data-k="r27-tandem">marche en tandem</button> est altérée dès les stades précoces et reste utile au stade pré-ataxique.</p></div><div class="card"><h4>Réflexes</h4><p>Diminués ou abolis dans l’ataxie de Friedreich, l’ataxie avec déficit en vitamine E, l’ataxie avec apraxie oculomotrice de type 2 et l’ataxie spinocérébelleuse de type 2. Conservés, voire vifs, dans la plupart des ataxies spinocérébelleuses dominantes et dans la MSA-C (<button class="w" data-k="r27-reflexes">réflexes et orientation étiologique</button>).</p></div></div>
<h3>6.1 Indices qui orientent la cause</h3>
<table class="t"><thead><tr><th>Indice à l’examen</th><th>Cause à évoquer</th></tr></thead><tbody>
<tr><td>Apraxie oculomotrice</td><td>Ataxie-télangiectasie, ataxies avec apraxie oculomotrice de types 1 et 2</td></tr>
<tr><td>Saccades lentes</td><td>Ataxie spinocérébelleuse de type 2</td></tr>
<tr><td>Dysautonomie</td><td>MSA-C</td></tr>
<tr><td>Xanthomes tendineux, cataracte précoce</td><td>Xanthomatose cérébrotendineuse</td></tr>
<tr><td>Aréflexie vestibulaire avec test d’impulsion céphalique pathologique</td><td>CANVAS</td></tr>
<tr><td>Paralysie verticale du regard</td><td>Maladie de Niemann-Pick de type C</td></tr>
<tr><td>Spasticité associée à l’ataxie</td><td>SPG7, ARSACS</td></tr>
<tr><td>Baisse visuelle ; chorée et troubles cognitifs ; tremblement d’action ; nystagmus vers le bas</td><td>Ataxie spinocérébelleuse de type 7 ; type 17 ; type 12 et FXTAS ; type 27B</td></tr>
<tr><td>Ophtalmoplégie, aréflexie et ataxie</td><td>Syndrome de Miller Fisher (anticorps anti-GQ1b)</td></tr>
<tr><td>Opsoclonus (saccades chaotiques multidirectionnelles, sans intervalle intersaccadique)</td><td>Syndrome opsoclonus-myoclonus-ataxie</td></tr>
</tbody></table>
<p>Une hémiataxie sans lésion visible à l’IRM, ou une ataxie épisodique de l’adulte sans antécédent familial, doit faire penser à un anticorps antineuronal.</p>
<p>Aux urgences, devant un syndrome vestibulaire aigu, le test <button class="w" data-k="r27-hints">HINTS (examen oculomoteur en trois temps, sensibilité et limites)</button> a une sensibilité de 95,3 % et une spécificité de 92,6 % en présence d’un nystagmus. Près de 50 % des syndromes vestibulaires aigus centraux se présentent cependant <b>sans</b> nystagmus : c’est le syndrome de déséquilibre aigu, où l’examen oculomoteur ne peut pas être appliqué. La marche et la station deviennent alors l’examen décisif, avec la <button class="w" data-k="r27-gti">GTI</button> : le grade 3 a une spécificité de 99,1 % mais une sensibilité de 44 % pour un accident vasculaire cérébral ; les grades 2 ou 3 ont une spécificité de 82,7 % et une sensibilité de 70,8 %.</p>
<div class="trap"><span class="k">Piège</span> La sensibilité et la spécificité des signes cérébelleux segmentaires et du signe de Romberg n’ont pas été trouvées (lacune assumée) : le cours ne leur attribue aucune valeur chiffrée. Un nystagmus absent n’exclut pas un infarctus du cervelet.</div>
<div class="key"><b>À retenir.</b> Les signes cérébelleux confirment le siège, les indices associés orientent la cause. Aux urgences, l’absence de nystagmus n’est pas rassurante : près de la moitié des syndromes vestibulaires centraux n’en ont pas, et une station ou une position assise impossible (GTI 3) est très spécifique d’un accident vasculaire.</div>
