<template data-pop="g22-parkinsonisme" data-title="Parkinsonisme : définition et critères de la Movement Disorder Society">
<div class="lab">Définition</div><p>Le parkinsonisme est une bradykinésie associée à une rigidité, à un tremblement de repos, ou aux deux. <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">(Postuma et collaborateurs 2015)</a> <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> La bradykinésie est un ralentissement avec décrément : la vitesse et l’amplitude des gestes répétés diminuent progressivement.</p>
<div class="lab">Application</div><p>On demande au patient de frapper du pouce sur l’index ou d’ouvrir et fermer la main plusieurs fois. Le décrément distingue la bradykinésie parkinsonienne d’un simple ralentissement. <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger 2018)</a></p>
<div class="lab">Limite</div><p>Le parkinsonisme est un tableau, non une maladie : le critère décrit l’examen moteur, pas la cause. Le parkinsonisme secondaire désigne une cause identifiable, non génétique et non dégénérative. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://www.revmed.ch/view/429217/3704145/RMS_604_870.pdf" target="_blank" rel="noopener">(Wicki et Benninger 2018)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/26474316/" target="_blank" rel="noopener">(Postuma et collaborateurs 2015)</a>.</p></template>
<template data-pop="g22-codage" data-title="Système dague-astérisque de la CIM-10-GM">
<div class="lab">Principe</div><p>Deux codes décrivent un même cas : le code dague (†) nomme l’étiologie, le code astérisque (*) nomme la manifestation. Le code astérisque ne s’emploie jamais seul. <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">(BfArM, structure des codes)</a></p>
<div class="lab">Application</div><p>La syphilis du système nerveux est codée A52.1†, et le parkinsonisme qui en résulte G22*. La classification nomme cette seule inclusion sous G22*. <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a></p>
<div class="lab">Limite</div><p>Seule la règle du BfArM (allemande) a été lue ; l’application du Manuel de codage suisse n’a pas été vérifiée. Le rattachement à G22* d’autres causes, comme la maladie de Wilson, n’est pas confirmé à la source. <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">(BfArM, structure des codes)</a></p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> ; <a href="https://dam-api.bfs.admin.ch/hub/api/dam/assets/32686265/master" target="_blank" rel="noopener">(OFS, CIM-10-GM 2024)</a> ; <a href="https://www.bfarm.de/EN/Code-systems/Classifications/ICD/ICD-10-GM/Tabular-list/codestructure.html" target="_blank" rel="noopener">(BfArM, structure des codes)</a>.</p></template>
<template data-pop="g22-geneve" data-title="Étude genevoise 2003–2012">
<div class="lab">Étude</div><p>Fleury et collaborateurs décrivent 1235 patients parkinsoniens dans le canton de Genève, diagnostics de 2003 à 2012. <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Fleury et collaborateurs 2018)</a></p>
<div class="lab">Résultats</div><table class="t"><thead><tr><th>Catégorie</th><th>Part</th></tr></thead><tbody><tr><td>Dégénératifs</td><td>80 %</td></tr><tr><td>Non dégénératifs</td><td>20 %</td></tr><tr><td>dont médicamenteux</td><td>43,4 %</td></tr><tr><td>dont vasculaires</td><td>37 %</td></tr><tr><td>dont hydrocéphalie à pression normale</td><td>5,1 %</td></tr><tr><td>dont psychiatriques ou fonctionnels</td><td>3,8 %</td></tr></tbody></table>
<div class="lab">Limite</div><p>Seul le résumé a été lu. Il ne détaille pas environ un dixième des cas non dégénératifs ; la part des causes classées ailleurs est inconnue.</p>
<p class="src">Référence : <a href="https://pubmed.ncbi.nlm.nih.gov/29661694/" target="_blank" rel="noopener">(Fleury et collaborateurs 2018)</a>.</p></template>
<template data-pop="g22-levodopa-regle" data-title="Siège de la lésion et réponse à la lévodopa">
<div class="lab">Règle</div><p>La lévodopa est surtout efficace quand la lésion est présynaptique, nigrostriée et isolée, parce que les récepteurs du striatum sont intacts. Elle l’est rarement quand la lésion touche le striatum ou le pallidum. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Exemples</div><p>Lévodopa habituellement inefficace : hématome sous-dural, tumeur comprimante, monoxyde de carbone, lupus, syndrome des antiphospholipides. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> Réponse variable : maladie de Wilson, où les lésions sont pré- et post-synaptiques. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<div class="lab">Limite</div><p>La règle est un repère issu d’une revue narrative fondée sur des séries de cas ; elle n’exclut pas un essai. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a>.</p></template>
<template data-pop="g22-wilson" data-title="Maladie de Wilson : définition, tableau neurologique et pronostic">
<div class="lab">Définition</div><p>La maladie de Wilson est due à un déficit du transporteur ATP7B (gène du chromosome 13). L’excrétion biliaire du cuivre diminue, et le cuivre s’accumule dans le foie puis dans le cerveau. <a href="https://archive-ouverte.unige.ch/unige:45348" target="_blank" rel="noopener">(Chilcott-Lauber et collaborateurs 2005 (résumé))</a> Le début neurologique typique se situe entre 20 et 40 ans (extrêmes 6 à 72 ans). <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<div class="lab">Signes</div><table class="t"><thead><tr><th>Signe</th><th>Fréquence lue</th></tr></thead><tbody><tr><td>Tremblement</td><td>Environ 90 % ; jusqu’à 55 % comme premier signe</td></tr><tr><td>Dystonie</td><td>11 à 65 %</td></tr><tr><td>Parkinsonisme</td><td>19 à 62 %</td></tr><tr><td>Ataxie</td><td>Environ 30 %</td></tr><tr><td>Chorée</td><td>6 à 16 %</td></tr><tr><td>Dysarthrie</td><td>Presque tous les patients</td></tr><tr><td>Dysphagie</td><td>Environ 50 %</td></tr><tr><td>Hypersialorrhée</td><td>Environ 70 %</td></tr><tr><td>Troubles de la marche</td><td>44 à 75 %</td></tr></tbody></table>
<p>La présentation monosymptomatique est rare. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> UWDRS désigne l’échelle d’évaluation unifiée de la maladie de Wilson, dont une version minimale compte 9 items. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<div class="lab">Limite</div><p>Les fréquences proviennent de séries dont les fourchettes sont larges ; le codage de la maladie de Wilson n’a pas été vérifié. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a></p>
<p class="src">Références : <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6531649/" target="_blank" rel="noopener">(Dusek et collaborateurs 2019)</a> ; <a href="https://archive-ouverte.unige.ch/unige:45348" target="_blank" rel="noopener">(Chilcott-Lauber et collaborateurs 2005 (résumé))</a>.</p></template>
<template data-pop="g22-cuivre-bilan" data-title="Céruloplasmine, cuprurie et cuivre échangeable">
<div class="lab">Valeurs lues</div><table class="t"><thead><tr><th>Paramètre</th><th>Lecture</th></tr></thead><tbody><tr><td>Céruloplasmine</td><td>Inférieure à 0,10 g/L très évocatrice ; 0,10 à 0,20 intermédiaire ; normale chez 5 à 20 %</td></tr><tr><td>Cuprurie des 24 heures</td><td>Supérieure à 100 µg (1,6 µmol) très évocatrice ; seuil 40 µg : sensibilité 79 %, spécificité 88 %</td></tr><tr><td>Cuivre échangeable relatif</td><td>Supérieur à 18,5 % évocateur ; inférieur à 10 % chez les témoins et hétérozygotes</td></tr><tr><td>Cuivre hépatique</td><td>Supérieur à 250 µg/g</td></tr></tbody></table>
<div class="lab">Application</div><p>Les paramètres se lisent ensemble, dans le score de Leipzig. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> La recommandation européenne 2025 retient le score de Leipzig et, en complément, le cuivre échangeable relatif. <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a></p>
<div class="lab">Limite</div><p>Texte de formation français, non une recommandation ; les seuils sont ceux de ce texte. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a></p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a> ; <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a>.</p></template>
<template data-pop="g22-leipzig" data-title="Score de Leipzig">
<div class="lab">Points</div><table class="t"><thead><tr><th>Critère</th><th>Points</th></tr></thead><tbody><tr><td>Anneau de Kayser-Fleischer</td><td>2</td></tr><tr><td>Symptômes neuropsychiatriques ou IRM typique</td><td>2</td></tr><tr><td>Anémie hémolytique à Coombs négatif</td><td>1</td></tr><tr><td>Cuprurie : 1 à 2 fois la normale ; plus de 2 fois</td><td>1 ; 2</td></tr><tr><td>Cuivre hépatique : normal ; jusqu’à 5 fois ; plus de 5 fois</td><td>−1 ; 1 ; 2</td></tr><tr><td>Céruloplasmine : 10 à 20 mg/dL ; moins de 10 mg/dL</td><td>1 ; 2</td></tr><tr><td>Mutations ATP7B : deux allèles ; un allèle</td><td>4 ; 1</td></tr></tbody></table>
<div class="lab">Interprétation</div><p>Un score de 4 ou plus rend le diagnostic très probable, 2 à 3 possible, 0 à 1 improbable. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a></p>
<div class="lab">Limite</div><p>Le score est cité d’après un texte de formation ; son usage est confirmé par la recommandation européenne 2025, dont seul le résumé a été lu. <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a> <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a></p>
<p class="src">Références : <a href="https://pubmed.ncbi.nlm.nih.gov/40089450/" target="_blank" rel="noopener">(EASL-ERN 2025 (résumé))</a> ; <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a>.</p></template>
<template data-pop="g22-aggravation" data-title="Aggravation neurologique à l’instauration du traitement">
<div class="lab">Constat</div><p>L’aggravation paradoxale touche surtout la D-pénicillamine, puis la trientine, moins le zinc. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> La fiche suisse de la trientine l’explique par un excès de cuivre libre sérique, avec dystonie, rigidité, tremblement et dysarthrie. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a></p>
<div class="lab">Conduite</div><p>Dans une forme neurologique, la pénicillamine commence à 300 mg par jour et augmente par paliers mensuels plutôt qu’hebdomadaires. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> La trientine est augmentée lentement, avec un contrôle toutes les deux à trois semaines. <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a></p>
<div class="lab">Limite</div><p>Une amélioration peut survenir après plusieurs années ; un tiers des patients ont un défaut d’observance. <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> <a href="https://pubmed.ncbi.nlm.nih.gov/37842984/" target="_blank" rel="noopener">(Litwin et collaborateurs 2023 (résumé))</a></p>
<p class="src">Références : <a href="https://www.fmcgastro.org/texte-postu/postu-2023/maladie-de-wilson/" target="_blank" rel="noopener">(Guillaud 2023)</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/37842984/" target="_blank" rel="noopener">(Litwin et collaborateurs 2023 (résumé))</a> ; <a href="https://amiko.oddb.org" target="_blank" rel="noopener">(information professionnelle suisse Cuprior)</a>.</p></template>
<template data-pop="g22-neurosyphilis" data-title="Neurosyphilis : diagnostic et traitement">
<div class="lab">Suspicion</div><p>Symptômes neurologiques ou psychiatriques avec sérologie syphilitique positive ou infection sexuellement transmissible actuelle ou passée. Les personnes vivant avec le VIH ont un risque accru, y compris de formes atypiques ou asymptomatiques. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Tableau</div><p>La paralysie générale est une encéphalite chronique progressive : déficits cognitifs, troubles du jugement, épisodes psychotiques, troubles de la parole, céphalées, vertiges, anomalies pupillaires (surtout rigidité pupillaire réflexe), tremblement de la langue, crises épileptiques, puis démence sévère. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Traitement</div><p>Pénicilline G intraveineuse ou ceftriaxone pendant 14 jours. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Limite</div><p>La ligne directrice ne décrit pas le parkinsonisme syphilitique en propre. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g20-g26.htm" target="_blank" rel="noopener">(BfArM, CIM-10-GM 2024, bloc G20–G26)</a> ; <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a>.</p></template>
<template data-pop="g22-hpn" data-title="Hydrocéphalie à pression normale">
<div class="lab">Définition</div><p>Triade de démence, d’apraxie de la marche et d’incontinence urinaire, avec ventriculomégalie et pression normale. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Imagerie</div><p>Index d’Evans ≥ 0,3 ; angle calleux aigu, anormal en dessous de 90° ; bombement du corps calleux ; DESH. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, Hôpitaux universitaires de Genève 2018)</a></p>
<div class="lab">Parkinsonisme</div><p>Bradykinésie et rigidité sont relativement fréquentes, parfois aux membres supérieurs. La marche et l’équilibre peuvent s’améliorer après dérivation ; la réponse à la lévodopa est variable. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Limite</div><p>Le test de soustraction et les critères de sélection chirurgicale n’ont pas été lus ; le codage de l’hydrocéphalie à pression normale par rapport à G22* n’est pas vérifié.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, Hôpitaux universitaires de Genève 2018)</a>.</p></template>
<template data-pop="g22-hematome" data-title="Hématome sous-dural">
<div class="lab">Tableau</div><p>Atteinte uni ou bilatérale, début subaigu souvent sans traumatisme rapporté, céphalées, troubles cognitifs, signes pyramidaux. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Conduite</div><p>Le drainage entraîne habituellement une rémission complète. La lévodopa est inefficace. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Limite</div><p>Le rôle d’une anticoagulation n’a pas été vérifié dans les sources lues.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a>.</p></template>
<template data-pop="g22-manganese" data-title="Dégénérescence hépatocérébrale acquise et manganèse">
<div class="lab">Définition</div><p>Accumulation de manganèse, surtout pallidale, au cours d’une insuffisance hépatique chronique ou d’un shunt porto-systémique, dans 1 à 2 % des cas. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Imagerie</div><p>Hypersignal T1 pallidal bilatéral, parfois au putamen, au noyau caudé et à la substance noire. Le DaTSCAN est habituellement normal. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Traitement</div><p>Réponse variable à la lévodopa ; amélioration possible après transplantation hépatique. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a>.</p></template>
<template data-pop="g22-metabolique" data-title="Causes métaboliques : fiches par cause">
<div class="lab">Urémie diabétique</div><p>Parkinsonisme aigu avec œdème lenticulaire bilatéral, surtout chez les patients asiatiques diabétiques en insuffisance rénale terminale. L’hémodialyse l’améliore souvent. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Hypoparathyroïdie</div><p>Calcifications étendues du striatum, du thalamus et des noyaux dentelés ; le parkinsonisme est habituellement insensible à la lévodopa et peut répondre à la normalisation de la calcémie. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Myélinolyse osmotique</div><p>Voir la fenêtre dédiée.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a>.</p></template>
<template data-pop="g22-myelinolyse" data-title="Myélinolyse osmotique">
<div class="lab">Mécanisme</div><p>Elle suit la correction rapide d’une hyponatrémie ; l’évolution est biphasique, avec une seconde aggravation après un à sept jours. La forme extrapontique donne un parkinsonisme. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Imagerie</div><p>L’IRM est en retard de une à deux semaines ; la diffusion peut être anormale dès 24 heures ; l’IRM est répétée à deux à trois semaines. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Traitement</div><p>Traitement de soutien ; la prévention repose sur une correction lente de la natrémie. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a>.</p></template>
<template data-pop="g22-autoimmun" data-title="Encéphalites auto-immunes et paranéoplasiques">
<div class="lab">Anticorps</div><p>Anti-Ma2 (jeune homme, tumeur germinale testiculaire, paralysie verticale du regard), anti-Ri (femme, cancer du sein), CRMP5, NMDAR (surtout chez l’enfant), LGI1, CASPR2, IgLON5. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Conduite</div><p>Une IRM normale n’exclut pas la maladie ; l’immunothérapie précoce est recommandée car ces formes sont traitables. Environ un tiers des anti-Ma2 répond partiellement au traitement tumoral et immunitaire. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a>.</p></template>
<template data-pop="g22-mcj" data-title="Maladie de Creutzfeldt-Jakob">
<div class="lab">Tableau</div><p>Progression rapide, déclin cognitif, myoclonies ; hypersignaux de diffusion ou FLAIR, ruban cortical dans la forme sporadique. <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a></p>
<div class="lab">Suisse</div><p>Elle existe sous forme sporadique, génétique et iatrogène, toujours mortelle et sans traitement. On compte 10 à 15 cas par an, tous de forme classique, sans variant déclaré. Des formulaires de déclaration existent à l’Office fédéral de la santé publique, et le centre de référence est à l’Hôpital universitaire de Zurich. <a href="https://www.bag.admin.ch/fr/maladie-de-creutzfeldt-jakob-mcj" target="_blank" rel="noopener">(Office fédéral de la santé publique, maladie de Creutzfeldt-Jakob)</a></p>
<div class="lab">Limite</div><p>Les critères diagnostiques (protéine 14-3-3, RT-QuIC) n’ont pas été lus. La page de l’Office fédéral est grand public.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11408197/" target="_blank" rel="noopener">(Berlot et collaborateurs 2024)</a> ; <a href="https://www.bag.admin.ch/fr/maladie-de-creutzfeldt-jakob-mcj" target="_blank" rel="noopener">(Office fédéral de la santé publique, maladie de Creutzfeldt-Jakob)</a>.</p></template>
<template data-pop="g22-drapeaux" data-title="Drapeaux rouges contre la maladie de Parkinson">
<div class="lab">Liste</div><p>Chutes précoces, dysautonomie précoce, syndrome cérébelleux, syndrome pyramidal, troubles oculomoteurs, troubles cognitifs précoces, parkinsonisme symétrique à prédominance des membres inférieurs. <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, Hôpitaux universitaires de Genève 2018)</a></p>
<div class="lab">Limite</div><p>Diapositives des Hôpitaux universitaires de Genève d’après la Movement Disorder Society ; source reprise d’un dossier voisin sans relecture. <a href="https://www.hug.ch/sites/interhug/files/structures/medecine_de_premier_recours/parkinsonism_smpr_180418.pdf" target="_blank" rel="noopener">(Fleury, Hôpitaux universitaires de Genève 2018)</a></p>

<template data-pop="g22-lcr-syph" data-title="Liquide céphalorachidien dans la neurosyphilis">
<div class="lab">Paramètres</div><p>VDRL du liquide : spécificité 0,95, sensibilité environ 0,71. Critère combiné : VDRL ou RPR réactif et leucocytes supérieurs à 5 par microlitre ou protéines supérieures à 45 mg/dL. CXCL13 utile au diagnostic et au suivi. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Critères DGN et Société suisse de neurologie</div><p>Probable : au moins deux éléments parmi évolution subaiguë ou chronique avec rémissions partielles, pléiocytose et ou dysfonction de barrière, amélioration sous antibiotiques adaptés, <b>et</b> un test tréponémique sérique positif confirmé. Certaine : probable plus production intrathécale d’anticorps anti-<i>T. pallidum</i> ou PCR positive dans le liquide. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<div class="lab">Limite</div><p>Le test TPPA n’est plus disponible ; le dépistage emploie CIA ou EIA. <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a></p>
<p class="src">Référence : <a href="https://register.awmf.org/assets/guidelines/030-101l_S1_Neurosyphilis_2026-05.pdf" target="_blank" rel="noopener">(ligne directrice DGN et Société suisse de neurologie 2026)</a>.</p></template>
