<template data-pop="g57-infiltration" data-title="Infiltration échoguidée du nerf cutané latéral">
<div class="lab">Produits</div><p>Lidocaïne 1 % ou ropivacaïne 0,5 % (1–2 mL) avec triamcinolone 10–20 mg ou méthylprednisolone 20–40 mg, 3 à 5 mL au total.</p><div class="lab">Limite</div><p>Les informations professionnelles suisses de ces produits n’ont pas été lues dans le dossier ; elles sont à consulter avant l’acte.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10143-023-02023-2" target="_blank" rel="noopener">de Ruiter et al., causes inhabituelles de méralgie paresthésique, Neurosurgical Review 2023</a> ; <a href="https://doi.org/10.15557/jou.2026.0010" target="_blank" rel="noopener">Chianca et al. (Lugano), méralgie paresthésique et imagerie multimodale, Journal of Ultrasonography 2026</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-d-pregabaline" data-title="Prégabaline (Lyrica)">
<div class="lab">Indication</div><p>Douleurs neuropathiques périphériques et centrales de l’adulte.</p><div class="lab">Posologie</div><p>150 mg par jour en 2 à 3 prises, 300 mg par jour après 3–7 jours, maximum 600 mg par jour. Adaptation rénale : clairance ≥ 60 : 150–600 ; 30–60 : 75–300 ; < 30 : ne pas utiliser.</p><div class="lab">Effets indésirables</div><p>Étourdissements 28–30,7 %, somnolence 15,7–16,4 %, chutes chez le sujet âgé, mésusage et dépendance, sevrage néonatal. Arrêts pour effet indésirable : 14 % contre 5 % sous placebo.</p><div class="lab">Interaction</div><p>Avec un opioïde : rapport de cotes ajusté de 1,68 pour le décès lié aux opioïdes.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Lyrica (Swissmedic, version 110, juillet 2026)</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="g57-d-gabapentine" data-title="Gabapentine (Neurontin)">
<div class="lab">Indication suisse</div><p>Neuropathie diabétique et névralgie postherpétique ; emploi dans une mononévrite : hors indication.</p><div class="lab">Posologie</div><p>Cible initiale 900 mg par jour en 3 prises, entretien 900–3600 mg par jour. Adaptation rénale : 50–79 : 600–1200 ; 30–49 : 300–900 ; 15–29 : 150–600 ; < 15 : 150–300 mg par jour.</p><div class="lab">Effets indésirables</div><p>Vertiges 12,1 %, somnolence 7,6 %, DRESS, sevrage néonatal.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse de Neurontin (Swissmedic, version 107, avril 2025)</a>, consultées le 15 octobre 2026.</p></template>
<template data-pop="pareto-g57-definition" data-title="Pareto — Définition et fréquence">
<p class="ratio" data-cover="g57-0,g57-1,g57-2"></p><ul><li>Un déficit limité au territoire d’un seul nerf se localise par l’examen avant l’imagerie.</li><li>Le nerf fibulaire est la cause la plus fréquente de pied tombant (15 % des mononeuropathies de l’adulte).</li><li>Le pronostic dépend de l’état de l’axone : bloc de conduction ou lésion axonale.</li></ul></template>
<template data-pop="pareto-g57-clinique" data-title="Pareto — Physiopathologie, anamnèse et examen">
<p class="ratio" data-cover="g57-3,g57-4,g57-5,g57-6"></p><ul><li>Bloc de conduction : récupération rapide ; lésion axonale : repousse en mois.</li><li>Fibrillations après 10–14 jours ; fenêtre de régénération de trois à six mois.</li><li>Inversion et abduction conservées : nerf ; faibles : racine L5.</li></ul></template>
<template data-pop="pareto-g57-diagnostic" data-title="Pareto — Diagnostic et urgences">
<p class="ratio" data-cover="g57-7,g57-8"></p><ul><li>Électroneuromyographie à 10–14 jours avec comparaison bilatérale ; échographie ; imagerie par résonance magnétique si signes d’alerte.</li><li>Urgence : hématome rétropéritonéal sous anticoagulant, masse, paralysie radiculaire inférieure à 3/5.</li></ul></template>
<template data-pop="pareto-g57-traitement" data-title="Pareto — Prise en charge, suivi et terrains">
<p class="ratio" data-cover="g57-9,g57-10,g57-11"></p><ul><li>Décompression du nerf fibulaire avant trois mois : environ 80 % de récupération.</li><li>Méralgie : physiothérapie, perte de poids, infiltration en deuxième ligne ; absence de preuve de niveau 1.</li><li>Tunnel tarsien : infiltration non répétée ; chirurgie, succès 44 à 91 %.</li></ul></template>
<template data-pop="pareto-g57-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g57-e-1,g57-e-2,g57-e-3,g57-e-4,g57-e-5"></p><ul><li>L’électroneuromyographie bilatérale est la référence pour séparer bloc et perte axonale.</li><li>Surface du nerf cutané latéral de la cuisse : normale 1–3 mm², suspecte au-delà de 3,0–3,5 mm².</li><li>Bursite intermétatarsienne pathologique au-delà de 3 mm.</li></ul></template>
<template data-pop="pareto-g57-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g57-s-anat-cours"></p><ul><li>Nerf cutané latéral de la cuisse : racines L2–L3, cinq variantes de trajet.</li><li>Nerf fibulaire commun : deux branches, profonde (flexion dorsale) et superficielle (éversion).</li></ul></template>
<template data-pop="pareto-g57-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g57-s-histo-cours"></p><ul><li>Bloc : myéline altérée, axone continu. Lésion axonale : dégénérescence wallérienne.</li><li>Morton : fibrose périneurale, pas un vrai névrome.</li></ul></template>
<template data-pop="pareto-g57-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g57-s-physio-cours"></p><ul><li>Repousse jusqu’à six mois, déclin après trois mois.</li><li>Fibrillations après 10 à 14 jours.</li></ul></template>
<template data-pop="pareto-g57-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g57-p-1,g57-p-2,g57-p-3,g57-p-4,g57-p-5"></p><ul><li>Prégabaline : maximum 600 mg par jour, ne pas utiliser si clairance inférieure à 30.</li><li>Gabapentine : indication suisse limitée à deux neuropathies ; emploi hors indication dans les mononévrites.</li><li>Prégabaline avec un opioïde : risque de décès lié aux opioïdes accru.</li></ul></template>
