<template data-pop="g97-cim" data-title="Périmètre de la catégorie : complications neurologiques d’un acte">
<div class="lab">Contenu</div><p data-evidence="G97-C0326">La catégorie de la CIM-10-GM 2024 regroupe les atteintes du système nerveux consécutives à une ponction rachidienne, à une dérivation ventriculaire ou à une chirurgie : fuite de LCR et autres réactions après ponction, hypotension intracrânienne après dérivation, fistule de LCR, mutisme cérébelleux, hémorragies rachidiennes épidurale, sous-durale et sous-arachnoïdienne postopératoires, autres atteintes et forme sans précision.</p>
<div class="lab">Inclusion et renvoi</div><p data-evidence="G97-C0327">La note de la classification allemande inclut le syndrome de la fosse postérieure sous le mutisme postopératoire. Aucune exclusion ni indication de codage n’est donnée au bloc dans la version 2024. Les fuites spontanées de LCR sont classées ailleurs (leçon sur l’hypotension intracrânienne).</p>
<div class="lab">Limite</div><p data-evidence="G97-C0328">Pour les hémorragies sous-durale et sous-arachnoïdienne rachidiennes postopératoires ainsi que pour les formes résiduelles, aucune source clinique spécifique n’a été lue : le cours n’en détaille pas la prise en charge.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g90-g99.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc G90–G99</a>.</p></template>
<template data-pop="g97-lcr" data-title="Liquide céphalorachidien : rôle et pression">
<div class="lab">Notion</div><p data-evidence="G97-C0329">Le LCR est le liquide qui baigne le système nerveux central. Sa pression est un paramètre mesurable lors d’une ponction ; la classification des céphalées retient une basse pression à moins de 60 mm de LCR.</p>
<div class="lab">Application</div><p data-evidence="G97-C0330">Une fuite par une brèche de l’enveloppe qui le contient peut abaisser cette pression et provoquer une céphalée.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0331">Les sources lues ne fournissent pas de valeur normale de pression, ni d’explication du lien entre la baisse de pression et la douleur.</p>
<p class="src">Références : <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2</a>.</p></template>
<template data-pop="g97-pression60" data-title="Pression du LCR inférieure à 60 mm de LCR">
<div class="lab">Définition</div><p data-evidence="G97-C0332">La rubrique 7.2 de la classification des céphalées retient comme critère une basse pression du LCR, définie à moins de 60 mm de LCR, ou une fuite de LCR visible à l’imagerie.</p>
<div class="lab">Population</div><p data-evidence="G97-C0333">La classification s’applique aux adultes et aux enfants.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0334">La mesure est un critère de classification, non une étape imposée par le consensus de 2023 pour un tableau typique. Les sources lues ne donnent ni valeur normale ni sensibilité de la mesure.</p>
<p class="src">Références : <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2</a>.</p></template>
<template data-pop="g97-ichd" data-title="ICHD-3, rubrique 7.2 : structure et critères généraux">
<div class="lab">Structure</div><p data-evidence="G97-C0335">La rubrique 7.2 est la céphalée attribuée à une basse pression du LCR. Elle comporte la céphalée post-ponction durale (7.2.1) et la céphalée par fistule de LCR (7.2.2).</p>
<div class="lab">Critères généraux</div><p data-evidence="G97-C0336">A. Toute céphalée remplissant le critère C. B. Basse pression du LCR (moins de 60 mm de LCR) et/ou fuite de LCR à l’imagerie. C. Céphalée en relation temporelle avec la basse pression ou la fuite, ou ayant conduit à sa découverte. D. Non mieux expliquée par un autre diagnostic ICHD-3.</p>
<p class="src">Références : <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2</a>.</p></template>
<template data-pop="g97-cppd-def" data-title="Céphalée post-ponction durale : définition ICHD-3 7.2.1">
<div class="lab">Définition</div><p data-evidence="G97-C0337">Céphalée survenant dans les 5 jours d’une ponction lombaire, causée par une fuite de LCR par la brèche durale. Elle s’accompagne habituellement d’une raideur de nuque et/ou de symptômes auditifs subjectifs. Elle disparaît spontanément en 2 semaines ou après obturation de la fuite par un blood patch épidural lombaire autologue.</p>
<div class="lab">Facteurs associés</div><p data-evidence="G97-C0338">La classification cite le sexe féminin, l’âge de 31 à 50 ans, l’antécédent de céphalée post-ponction et l’orientation perpendiculaire du biseau.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0339">Le délai de 5 jours est un critère de définition ; la classification ne remplace pas la recherche d’un autre diagnostic devant une céphalée atypique.</p>
<p class="src">Références : <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/7-2-1-post-dural-puncture-headache/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2.1</a>.</p></template>
<template data-pop="g97-fistule" data-title="Céphalée par fistule de LCR : ICHD-3 7.2.2">
<div class="lab">Définition</div><p data-evidence="G97-C0340">Céphalée orthostatique survenant après un acte ou un traumatisme responsable d’une fuite persistante de LCR avec basse pression intracrânienne. Elle disparaît après obturation de la fuite.</p>
<div class="lab">Critères</div><p data-evidence="G97-C0341">Acte ou traumatisme connu pour causer une fuite persistante, relation temporelle et critères généraux de la rubrique 7.2.</p>
<div class="lab">Application</div><p data-evidence="G97-C0342">Cette rubrique s’applique à la fistule postopératoire, dont la physiopathologie est celle de la céphalée post-ponction.</p>
<p class="src">Références : <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/7-2-2-csf-fistula-headache/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2.2</a>.</p></template>
<template data-pop="g97-ic" data-title="Intervalle de confiance à 95 %">
<div class="lab">Définition</div><p data-evidence="G97-C0343">L’intervalle de confiance à 95 % encadre la valeur estimée par l’étude : l’incidence de 11,0 % avec l’aiguille conventionnelle est donnée avec un intervalle de 9,1 à 13,3 %.</p>
<div class="lab">Lecture</div><p data-evidence="G97-C0344">Plus l’intervalle est étroit, plus l’estimation est précise. Les intervalles de 11,0 % (9,1–13,3) et de 4,2 % (3,3–5,2) ne se chevauchent pas.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0345">Un intervalle décrit l’incertitude statistique, non la validité du protocole des essais.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(17)32451-0" target="_blank" rel="noopener">Nath et collaborateurs, méta-analyse publiée dans The Lancet, 2018</a>.</p></template>
<template data-pop="g97-rr" data-title="Risque relatif">
<div class="lab">Définition</div><p data-evidence="G97-C0346">Le risque relatif est le rapport entre le risque dans le groupe traité et le risque dans le groupe de comparaison. Ici : 0,40 (0,34 à 0,47) pour l’aiguille atraumatique contre l’aiguille conventionnelle.</p>
<div class="lab">Lecture</div><p data-evidence="G97-C0347">Un risque relatif de 0,40 signifie que le risque avec l’aiguille atraumatique est égal à 40 % du risque avec l’aiguille conventionnelle.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0348">Le risque relatif ne dit pas la fréquence absolue ; il se lit avec les incidences (11,0 % et 4,2 %).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(17)32451-0" target="_blank" rel="noopener">Nath et collaborateurs, 2018</a>.</p></template>
<template data-pop="g97-grade-pop" data-title="GRADE : certitude de la preuve">
<div class="lab">Notion</div><p data-evidence="G97-C0349">GRADE est un système qui qualifie la certitude d’une preuve. La méta-analyse sur l’aiguille atraumatique est classée de haute qualité.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0350">La définition détaillée des niveaux GRADE n’est pas reprise par les sources lues ; ce cours cite seulement le niveau rapporté.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(17)32451-0" target="_blank" rel="noopener">Nath et collaborateurs, 2018</a>.</p></template>
<template data-pop="g97-nnt" data-title="Nombre à traiter : 15 ponctions">
<div class="lab">Calcul</div><p data-evidence="G97-C0351">La différence absolue d’incidence est de 11,0 % − 4,2 % = 6,8 points, soit 0,068. Le nombre à traiter est l’inverse de cette différence : 1 / 0,068 ≈ 14,7, soit environ 15.</p>
<div class="lab">Lecture</div><p data-evidence="G97-C0352">Environ 15 ponctions réalisées avec une aiguille atraumatique, plutôt que conventionnelle, évitent une céphalée post-ponction.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0353">Ce calcul a été fait pour ce cours à partir des deux incidences publiées ; il n’est pas rapporté tel quel par les sources et il est entouré d’une incertitude non calculée ici.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S0140-6736(17)32451-0" target="_blank" rel="noopener">Nath et collaborateurs, 2018</a>.</p></template>
<template data-pop="g97-biseau" data-title="Orientation du biseau de l’aiguille">
<div class="lab">Recommandation</div><p data-evidence="G97-C0354">Avec une aiguille coupante, le biseau est orienté parallèlement à l’axe longitudinal du rachis (grade B).</p>
<div class="lab">Risque</div><p data-evidence="G97-C0355">L’orientation perpendiculaire à l’axe du rachis est un facteur de risque indépendant de céphalée post-ponction.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0356">L’aiguille non coupante reste préférée en routine (grade A). Le mécanisme de l’effet de l’orientation n’est pas détaillé dans les sources lues.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a> ; <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/7-2-1-post-dural-puncture-headache/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2.1</a>.</p></template>
<template data-pop="g97-surdrainage" data-title="Surdrainage d’une dérivation : définition et limites">
<div class="lab">Définition</div><p data-evidence="G97-C0357">État persistant après dérivation ventriculo-péritonéale, se manifestant par une céphalée posturale, des nausées et des vomissements et/ou des signes radiologiques de ventricules fins et de collections sous-durales.</p>
<div class="lab">Limites</div><p data-evidence="G97-C0358">Il n’existe pas de définition consensuelle. L’incidence rapportée varie énormément et le phénomène est probablement sous-estimé. La physiopathologie est mal établie.</p>
<div class="lab">Prise en charge</div><p data-evidence="G97-C0359">Aucune recommandation européenne n’a été lue. Voir l’îlot sur la prise en charge pour les données sur le retrait de la dérivation.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00701-022-05469-3" target="_blank" rel="noopener">Hornshoej Pedersen et collaborateurs, revue systématique de 2023</a> ; <a href="https://doi.org/10.1007/s10143-017-0849-5" target="_blank" rel="noopener">Ros et collaborateurs, revue de 2017</a>.</p></template>
<template data-pop="g97-hematome" data-title="Hématome épidural rachidien postopératoire symptomatique">
<div class="lab">Définition</div><p data-evidence="G97-C0360">Hématome compressif visible à l’IRM et corrélé aux signes cliniques après chirurgie rachidienne.</p>
<div class="lab">Fréquence</div><p data-evidence="G97-C0361">0,10 à 0,69 % selon les séries ; 0,52 % dans la méta-analyse de 40 études. Début précoce plus fréquent ; le début retardé est rare (0,16 %).</p>
<div class="lab">Séquence et délai</div><p data-evidence="G97-C0362">La majorité des cas survient dans les 24 à 48 heures postopératoires, mais une survenue plus tardive est possible. La douleur axiale augmente fortement, puis apparaissent des symptômes radiculaires, une faiblesse motrice et des troubles sphinctériens. L’évacuation chirurgicale doit être aussi rapide que possible ; le pronostic dépend du délai et du déficit avant l’évacuation.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ocl.2021.08.006" target="_blank" rel="noopener">Djurasovic et collaborateurs, 2021</a> ; <a href="https://doi.org/10.1007/s00586-022-07421-6" target="_blank" rel="noopener">Chen et collaborateurs, méta-analyse de 2022</a>.</p></template>
<template data-pop="g97-hematome-facteurs" data-title="Hématome rachidien : facteurs de risque">
<div class="lab">Facteurs</div><p data-evidence="G97-C0363">Âge avancé, coagulopathie pré- ou postopératoire, laminectomie multiétagée. Hypertension préopératoire non contrôlée, pics tensionnels à l’extubation et pression systolique postopératoire élevée, avec des preuves de faible qualité.</p>
<div class="lab">Mesures sans effet démontré</div><p data-evidence="G97-C0364">Les drains aspiratifs prophylactiques ne réduisent pas l’incidence. L’anticoagulation périopératoire ne diffère pas dans la méta-analyse (0,44 % contre 0,42 %).</p>
<div class="lab">Limite</div><p data-evidence="G97-C0365">Une association de faible qualité n’établit pas une relation de cause à effet ; elle justifie une attention, non une cible chiffrée de pression artérielle.</p>
<p class="src">Références : <a href="https://doi.org/10.1097/ANA.0000000000000947" target="_blank" rel="noopener">Robinson et collaborateurs, 2023</a> ; <a href="https://doi.org/10.1016/j.ocl.2021.08.006" target="_blank" rel="noopener">Djurasovic et collaborateurs, 2021</a> ; <a href="https://doi.org/10.1007/s00586-022-07421-6" target="_blank" rel="noopener">Chen et collaborateurs, 2022</a>.</p></template>
<template data-pop="g97-mutisme-def" data-title="Mutisme cérébelleux postopératoire : définition et spectre">
<div class="lab">Définition</div><p data-evidence="G97-C0366">Syndrome de mutisme cérébelleux postopératoire pédiatrique : terme retenu par la Posterior Fossa Society en 2016 ; une définition de travail a été établie par un consensus Delphi. Le trouble de la parole postopératoire, abrégé POSI, désigne le mutisme ou la parole sévèrement réduite.</p>
<div class="lab">Spectre</div><p data-evidence="G97-C0367">Mutisme, parole réduite, parole habituelle. Dans la cohorte européenne de 376 enfants, le trouble de la parole postopératoire atteint 30 % (mutisme 14 %, parole réduite 16 %).</p>
<div class="lab">Limite</div><p data-evidence="G97-C0368">Le texte exact de la définition du consensus Delphi n’a pas été lu. La définition reste débattue.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00381-016-3093-3" target="_blank" rel="noopener">Gudrunardottir et collaborateurs, consensus de 2016</a> ; <a href="https://doi.org/10.1016/S2352-4642(21)00274-1" target="_blank" rel="noopener">Grønbæk et collaborateurs, 2021</a> ; <a href="https://doi.org/10.1007/s00381-021-05233-5" target="_blank" rel="noopener">Noris et collaborateurs, 2021</a>.</p></template>
<template data-pop="g97-voie-cerebelleuse" data-title="Voie efférente cérébelleuse et mutisme">
<div class="lab">Mécanisme</div><p data-evidence="G97-C0369">Le mécanisme le plus probable du mutisme est une lésion des composantes proximales de la voie efférente cérébelleuse, c’est-à-dire de la voie dentato-thalamo-corticale.</p>
<div class="lab">Facteurs indépendants</div><p data-evidence="G97-C0370">Âge plus jeune, localisation au quatrième ventricule ou au tronc, histologie (médulloblastome, tumeur tératoïde/rhabdoïde atypique).</p>
<div class="lab">Limite</div><p data-evidence="G97-C0371">Les sources lues ne décrivent pas la physiologie de la parole ni le trajet détaillé de la voie ; le mécanisme est dit « le plus probable », non démontré.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00381-021-05233-5" target="_blank" rel="noopener">Noris et collaborateurs, 2021</a> ; <a href="https://doi.org/10.1016/S2352-4642(21)00274-1" target="_blank" rel="noopener">Grønbæk et collaborateurs, 2021</a>.</p></template>
<template data-pop="g97-or" data-title="Rapport de cotes (odds ratio)">
<div class="lab">Définition</div><p data-evidence="G97-C0372">Le rapport de cotes compare la cote d’un événement entre deux groupes. Une valeur de 1 signale l’absence d’association.</p>
<div class="lab">Valeurs du cours</div><p data-evidence="G97-C0373">Médulloblastome 2,85 ; tumeur tératoïde/rhabdoïde atypique 10,30 ; vermis 0,34 ; hémisphère 0,23 ; voie transvermienne 0,89 ; latéralité gauche 1,08 ; hydrocéphalie préopératoire ajustée 1,20.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0374">Le rapport de cotes ne donne pas la fréquence du mutisme.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/S2352-4642(21)00274-1" target="_blank" rel="noopener">Grønbæk et collaborateurs, 2021</a> ; <a href="https://doi.org/10.1007/s00381-022-05567-8" target="_blank" rel="noopener">Grønbæk et collaborateurs, 2022</a> ; <a href="https://doi.org/10.1007/s00381-026-07132-z" target="_blank" rel="noopener">Laustsen et collaborateurs, 2026</a>.</p></template>
<template data-pop="g97-facteurs-patient" data-title="Céphalée post-ponction : facteurs liés au patient et certitude">
<div class="lab">Facteurs</div><p data-evidence="G97-C0375">Âge jeune : certitude élevée. Sexe féminin : certitude élevée. Antécédent de céphalée chronique ou de céphalée post-ponction : certitude modérée. Indice de masse corporelle : pas d’association constante. Tabac : possiblement protecteur, certitude faible.</p>
<div class="lab">Facteurs liés à l’acte</div><p data-evidence="G97-C0376">Aiguille coupante, gros calibre, nombre de tentatives, expérience de l’opérateur : certitude modérée. Décubitus latéral : moins de risque. Niveau de ponction : sans effet.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-orthostatique" data-title="Céphalée orthostatique : fréquente mais non obligatoire">
<div class="lab">Description</div><p data-evidence="G97-C0377">Aggravation rapide en position assise ou debout, amélioration en décubitus. Signes associés : raideur de nuque, symptômes auditifs, troubles visuels, vertiges, acouphènes, photophobie, nausées.</p>
<div class="lab">Fréquence</div><p data-evidence="G97-C0378">Dans une cohorte, seules 8 parturientes sur 142 avec céphalée post-ponction n’avaient pas de composante posturale.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0379">Une composante posturale absente ne permet pas d’affirmer la céphalée post-ponction ; elle justifie d’envisager l’imagerie.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a> ; <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/7-2-1-post-dural-puncture-headache/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2.1</a>.</p></template>
<template data-pop="g97-mnemo" data-title="Repère mnémotechnique : « 5 jours, 2 semaines »">
<div class="lab">Repère</div><p data-evidence="G97-C0380">Cinq jours pour apparaître au plus, deux semaines pour guérir spontanément : ces deux durées encadrent la céphalée post-ponction durale.</p>
<div class="lab">Statut</div><p data-evidence="G97-C0381">Aide pédagogique, non critère officiel. Les critères officiels figurent dans l’encadré final du cours.</p></template>
<template data-pop="g97-irm" data-title="IRM rachidienne en urgence">
<div class="lab">Indication</div><p data-evidence="G97-C0382">Déficit ou douleur axiale croissante après chirurgie rachidienne, devant une suspicion d’hématome compressif.</p>
<div class="lab">Interprétation</div><p data-evidence="G97-C0383">Le diagnostic requiert la corrélation entre un hématome compressif à l’IRM et les signes cliniques.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0384">Les sources lues ne donnent pas de délai chiffré pour la réalisation de l’IRM, seulement la consigne de l’obtenir en urgence.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ocl.2021.08.006" target="_blank" rel="noopener">Djurasovic et collaborateurs, 2021</a>.</p></template>
<template data-pop="g97-signes-imagerie" data-title="Signes d’imagerie de basse pression du LCR">
<div class="lab">Signes</div><p data-evidence="G97-C0385">Affaissement cérébral (« sagging »), rehaussement pachyméningé, LCR extradural visible à l’IRM ou à la myélographie.</p>
<div class="lab">Statut</div><p data-evidence="G97-C0386">Ces signes documentent la rubrique 7.2. Une imagerie systématique avant un blood patch n’est pas justifiée par les preuves lues.</p>
<p class="src">Références : <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-cerebrospinal-fluid-pressure/" target="_blank" rel="noopener">ICHD-3, rubrique 7.2</a> ; <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-ddx-cppd" data-title="Différentiel de la céphalée post-ponction et signes d’alerte">
<div class="lab">Différentiel</div><p data-evidence="G97-C0387">L’hématome sous-dural et la thrombose veineuse cérébrale peuvent mimer la céphalée post-ponction ; ce sont aussi des complications associées à la brèche durale.</p>
<div class="lab">Signes d’alerte</div><p data-evidence="G97-C0388">Aggravation malgré un blood patch, nouveau signe focal, changement de caractère de la céphalée : imagerie urgente et avis spécialisé (grade B).</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-longterme" data-title="Complications tardives associées à la brèche durale">
<div class="lab">Liste</div><p data-evidence="G97-C0389">Céphalée chronique, lombalgie, cervicalgie, dépression, paralysie de nerf crânien, hématome sous-dural, thrombose veineuse cérébrale ; certitude modérée.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0390">Le consensus parle d’association : il n’établit pas que chaque patient développera ces complications et ne chiffre pas ici leur fréquence.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
