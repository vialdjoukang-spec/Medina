<template data-pop="g97-consensus-origine" data-title="Consensus de 2023 : origine, gradation et réserve">
<div class="lab">Nature</div><p data-evidence="G97-C0391">Le texte est un consensus international sur la céphalée post-ponction durale, cosigné notamment par la European Society of Regional Anaesthesia and Pain Therapy et l’Obstetric Anaesthetists’ Association, aux côtés de sociétés américaines. Une version longue (2024, 50 recommandations établies par deux tours Delphi) existe ; seul son résumé a été lu.</p>
<div class="lab">Réserve</div><p data-evidence="G97-C0392">Il est dirigé par des sociétés majoritairement américaines et gradué selon l’échelle de la Preventive Services Task Force des États-Unis. Il est présenté ici comme un consensus international cosigné par des sociétés européennes, non comme une recommandation suisse. Aucune recommandation suisse spécifique n’a été lue.</p>
<div class="lab">Conséquence</div><p data-evidence="G97-C0393">Pour les médicaments, l’information professionnelle suisse prime. Pour les gestes, le consensus reste la meilleure source lue. Il n’est jamais le seul fondement d’une conduite : l’aiguille atraumatique repose sur une méta-analyse de 110 essais, et le moment du blood patch sur des cohortes genevoise et européenne.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a> ; <a href="https://doi.org/10.1136/rapm-2023-104817" target="_blank" rel="noopener">Uppal et collaborateurs, 2024</a>.</p></template>
<template data-pop="g97-gradation" data-title="Lettres de grade du consensus">
<div class="lab">Lecture</div><p data-evidence="G97-C0394">Le cours cite les lettres de grade telles que le consensus les attribue. Dans le dossier, D accompagne des pratiques non recommandées (alitement systématique, opioïdes au long cours) et I des mesures pour lesquelles les preuves sont insuffisantes ; A, B et C accompagnent des recommandations d’emploi.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0395">Cette lecture résume l’usage des grades dans le dossier. La définition détaillée de chaque lettre n’y est pas reproduite, et une lettre de grade ne se confond pas avec la certitude de la preuve, qui est indiquée séparément.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-bpe" data-title="Blood patch épidural : indications, technique et résultats">
<div class="lab">Indications</div><p data-evidence="G97-C0396">Traitement de référence des symptômes invalidants ou réfractaires, à ne pas retarder en l’absence de contre-indication. Céphalée réfractaire gênant les activités quotidiennes (grade B) ; symptômes neurologiques sévères comme l’hypoacousie ou l’atteinte d’un nerf crânien (grade C).</p>
<div class="lab">Technique</div><p data-evidence="G97-C0397">Volume de 15 à 20 mL le plus souvent ; plus de 30 mL n’augmente pas le succès. Niveau de la ponction ou espace inférieur (grade B). Asepsie stricte, injection lente et fractionnée, arrêt si lombalgie ou céphalée importante (grade B).</p>
<div class="lab">Résultats et limites</div><p data-evidence="G97-C0398">Rémission complète rapportée de 33 à 91 %. Échec de 25,9 % à Genève et de 28,3 % dans la cohorte européenne EPiMAP (fenêtre dédiée). Un blood patch réalisé moins de 48 heures après la ponction expose à une répétition plus probable (grade B). La colle de fibrine est réservée aux formes réfractaires au blood patch ou lorsque le sang autologue est contre-indiqué (grade I).</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a> ; <a href="https://doi.org/10.1097/ACO.0000000000001361" target="_blank" rel="noopener">Thon et collaborateurs, revue de 2024</a>.</p></template>
<template data-pop="g97-bpe-precautions" data-title="Blood patch : précautions">
<div class="lab">Plaquettes et antithrombotiques</div><p data-evidence="G97-C0399">Avec des plaquettes d’au moins 70 × 10⁹/L et une fonction normale, le risque d’hématome est faible ; on suit les recommandations antithrombotiques (grade B).</p>
<div class="lab">Infection</div><p data-evidence="G97-C0400">Prudence en cas de fièvre ou d’infection systémique (grade C).</p>
<div class="lab">Consentement</div><p data-evidence="G97-C0401">Nouvelle brèche possible, lombalgie, complications neurologiques (grade A).</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a> ; <a href="https://doi.org/10.1097/EJA.0000000000001600" target="_blank" rel="noopener">Kietaibl et collaborateurs, 2022</a>.</p></template>
<template data-pop="g97-cafeine" data-title="Caféine dans la céphalée post-ponction">
<div class="lab">Recommandation</div><p data-evidence="G97-C0402">Possible durant les 24 premières heures, jusqu’à 900 mg par jour (grade B, faible). En cas d’allaitement, 200 à 300 mg par jour.</p>
<div class="lab">Limite suisse</div><p data-evidence="G97-C0403">Aucune information professionnelle suisse de caféine seule n’a été trouvée avec les mots de recherche « coffein » et « caffeine ». La dose citée vient du seul consensus.</p>
<div class="lab">Mécanisme</div><p data-evidence="G97-C0404">Le mécanisme d’action de la caféine dans cette indication n’est pas détaillé dans les sources lues.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-nonsoutenus" data-title="Traitements sans soutien (grade I)">
<div class="lab">Liste</div><p data-evidence="G97-C0405">Hydrocortisone, théophylline, triptans, ACTH et cosyntropine, néostigmine avec atropine, gabapentine, entre autres. Le bloc du ganglion sphénopalatin n’est pas recommandé de façon systématique.</p>
<div class="lab">Lecture</div><p data-evidence="G97-C0406">Le grade I traduit des preuves insuffisantes. Les médicaments systémiques préventifs et les substances intrathécales ou épidurales de routine sont dans la même situation.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-bloc-occipital" data-title="Bloc du nerf grand occipital">
<div class="lab">Recommandation</div><p data-evidence="G97-C0407">Possible après une aiguille de 22 G ou moins (grade C). Le bloc du ganglion sphénopalatin n’est pas systématique (grade I).</p>
<div class="lab">Limite</div><p data-evidence="G97-C0408">Les sources lues ne détaillent ni la technique ni l’anesthésique utilisé.</p>
<p class="src">Références : <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>
<template data-pop="g97-antithrombotiques" data-title="Anesthésie neuraxiale sous antithrombotiques : recommandation ESAIC/ESRA">
<div class="lab">Principe</div><p data-evidence="G97-C0409">Les intervalles à respecter dépendent de la molécule, de la dose, de la fonction rénale et du caractère traumatique de la ponction. L’échographie, les associations médicamenteuses et les scores de saignement ne modifient pas ces intervalles. Les équipes doivent savoir détecter et traiter un hématome.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0410">Seul le résumé de la recommandation 2022 a été lu : les intervalles chiffrés par anticoagulant ne figurent pas dans ce cours. Il faut consulter le texte complet avant toute décision.</p>
<p class="src">Références : <a href="https://doi.org/10.1097/EJA.0000000000001600" target="_blank" rel="noopener">Kietaibl et collaborateurs, recommandation ESAIC/ESRA de 2022 (résumé)</a>.</p></template>
<template data-pop="g97-fistule-mobilisation" data-title="Brèche durale accidentelle en chirurgie rachidienne : mobilisation précoce">
<div class="lab">Résultat</div><p data-evidence="G97-C0411">La mobilisation précoce, dans les 24 heures, réduit les complications pulmonaires (risque relatif 0,23) sans augmenter la fuite de LCR, la céphalée hypotensive, la reprise chirurgicale ni la pseudoméningocèle.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0412">La méta-analyse regroupe 6 études et 704 patients ; seul son résumé a été lu, et le résultat se lit avec cette réserve.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s10143-023-02201-2" target="_blank" rel="noopener">Gomes et collaborateurs, méta-analyse de 2023</a>.</p></template>
<template data-pop="g97-mutisme-therapie" data-title="Traitements rapportés du mutisme cérébelleux">
<div class="lab">Établi</div><p data-evidence="G97-C0413">Rééducation cognitive et physiothérapie sont les seules options établies.</p>
<div class="lab">Rapporté</div><p data-evidence="G97-C0414">Fluoxétine, zolpidem, bromocriptine et midazolam sont rapportés dans 9 publications de faible niveau de preuve.</p>
<div class="lab">Limite</div><p data-evidence="G97-C0415">Aucun traitement efficace n’est défini. La probabilité d’amélioration du mutisme atteint 50 % vers le jour 16.</p>
<p class="src">Références : <a href="https://doi.org/10.1007/s00381-021-05233-5" target="_blank" rel="noopener">Noris et collaborateurs, 2021</a> ; <a href="https://doi.org/10.1016/S2352-4642(21)00274-1" target="_blank" rel="noopener">Grønbæk et collaborateurs, 2021</a>.</p></template>
<template data-pop="g97-paracetamol" data-title="Paracétamol : information professionnelle suisse">
<div class="lab">Posologie</div><p data-evidence="G97-C0416">Adulte de plus de 40 kg : 500 à 1000 mg par prise, au plus 4000 mg par jour. Insuffisance rénale : clairance de la créatinine de 10 à 50 mL/min, intervalle de 6 heures et 3000 mg par jour au plus ; clairance inférieure à 10 mL/min, intervalle de 8 heures et 2000 mg par jour au plus. Enfant de 9 à 12 ans : 2000 mg par jour au plus.</p>
<div class="lab">Contre-indications et mises en garde</div><p data-evidence="G97-C0417">Insuffisance hépatique grave, hépatite aiguë, maladie de Gilbert. Acidose métabolique à trou anionique augmenté par 5-oxoproline dans les états graves, la dénutrition, l’alcoolisme et l’association à la flucloxacilline.</p>
<div class="lab">Grossesse et allaitement</div><p data-evidence="G97-C0418">Grossesse : possible si nécessaire, à la dose efficace la plus faible et pour la durée la plus courte. Allaitement : le produit passe dans le lait et est considéré compatible, avec prudence.</p>
<p class="src">Références : information professionnelle suisse Paracétamol Stada®, base AIPS consultée le 15 octobre 2026.</p></template>
<template data-pop="g97-ibuprofene" data-title="Ibuprofène : information professionnelle suisse et contentieux">
<div class="lab">Posologie</div><p data-evidence="G97-C0419">Céphalées et migraines : 400 mg, jusqu’à 800 mg par prise, au plus 2400 mg par jour.</p>
<div class="lab">Contre-indications</div><p data-evidence="G97-C0420">Troisième trimestre de grossesse, ulcère ou hémorragie digestive, maladie inflammatoire chronique de l’intestin active, insuffisance rénale (clairance inférieure à 30 mL/min), insuffisance hépatique ou cardiaque grave, tendance hémorragique.</p>
<div class="lab">Contentieux sur l’allaitement</div><p data-evidence="G97-C0421">L’information professionnelle suisse déconseille l’ibuprofène pendant l’allaitement et indique le sevrage s’il est indispensable. Le consensus de 2023 propose des AINS en post-partum. Pour un usage en Suisse, l’information professionnelle en vigueur prime ; le consensus reste un avis international cosigné par des sociétés européennes.</p>
<p class="src">Références : information professionnelle suisse Ibuprofen-Mepha Teva®, base AIPS consultée le 15 octobre 2026 ; <a href="https://jamanetwork.com/journals/jamanetworkopen/fullarticle/2808365" target="_blank" rel="noopener">Uppal et collaborateurs, consensus de 2023</a>.</p></template>

<p class="ratio" data-cover="g97-5,g97-6"></p><ul><li data-evidence="G97-C0434">Délai depuis l’acte et caractère orthostatique.</li><li data-evidence="G97-C0435">Orthostatisme fréquent, non obligatoire.</li><li data-evidence="G97-C0436">Signe focal, trouble visuel, altération de la conscience, crise : imagerie urgente.</li><li data-evidence="G97-C0437">Examen neurologique répété après chirurgie rachidienne.</li></ul></template>

<p class="ratio" data-cover="g97-8"></p><ul><li data-evidence="G97-C0442">Hématome compressif : IRM urgente, évacuation la plus rapide possible.</li><li data-evidence="G97-C0443">Aggravation malgré blood patch ou changement de caractère : imagerie urgente.</li><li data-evidence="G97-C0444">Complications tardives associées à la brèche durale.</li><li data-evidence="G97-C0503">Post-partum : céphalée qui change ou déficit, rechercher une thrombose veineuse cérébrale.</li></ul></template>

<template data-pop="g97-bpe-echec" data-title="Échec du blood patch : chiffres et limites">
<div class="lab">Genève</div><p data-evidence="G97-C0489">Cohorte rétrospective monocentrique des Hôpitaux universitaires de Genève : 47 920 procédures neuraxiales obstétricales (2001 à 2018), 212 blood patchs, échec (absence de soulagement complet ou traitement supplémentaire) chez 25,9 % (55 sur 212). Espace épidural à plus de 5,5 cm : rapport de cotes 3,08 (1,26 à 7,49). Intervalle de plus de 48 heures entre ponction et patch : 0,20 (0,05 à 0,83).</p>
<div class="lab">Cohorte européenne EPiMAP</div><p data-evidence="G97-C0490">643 parturientes ; échec 28,3 %, succès complet 33,0 %, succès partiel 38,7 %, second patch 19,8 %. Facteurs associés à l’échec : antécédent de migraine, brèche en position haute (première à troisième vertèbre lombaire contre troisième à cinquième), patch avant 48 heures. Trois hémorragies intracrâniennes ont été diagnostiquées chez les patientes imagées.</p>
<div class="lab">Limites</div><p data-evidence="G97-C0491">Obstétrique seule, résumés seuls lus. Les intervalles larges montrent des estimations imprécises. L’échec désigne l’absence de soulagement complet : il ne signifie pas que le patch est inutile (succès complet ou partiel chez environ sept patientes sur dix dans EPiMAP).</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ijoa.2023.103925" target="_blank" rel="noopener">Tomala et collaborateurs, 2023 (Genève)</a> ; <a href="https://doi.org/10.1016/j.bja.2022.06.040" target="_blank" rel="noopener">Gupta et collaborateurs, 2022 (EPiMAP)</a></p></template>

<template data-pop="g97-cppd-chronique" data-title="Céphalée post-ponction chronique : cohorte bernoise et imagerie">
<div class="lab">Définition de travail</div><p data-evidence="G97-C0492">Céphalée orthostatique de plus de 14 jours, éventuellement réfractaire à au moins un blood patch ; le format ICHD-3 ne la prévoit pas.</p>
<div class="lab">Poids</div><p data-evidence="G97-C0493">Trente patients (Fribourg en Brisgau et Berne) : séjour hospitalier médian de 31 jours, arrêt de travail médian de 381 jours, 5 médecins consultés en médiane. Série rétrospective, petite, d’un centre tertiaire.</p>
<div class="lab">Imagerie</div><p data-evidence="G97-C0494">Quatre-vingt-six patients : score de Berne médian de 2,0 (faible) ; liquide épidural lombaire chez 11 %. Une IRM peu évocatrice ne doit ni faire rejeter le diagnostic ni refuser le traitement.</p>
<p class="src">Références : <a href="https://doi.org/10.3389/fneur.2024.1493303" target="_blank" rel="noopener">Kraus et collaborateurs, 2024</a> ; <a href="https://doi.org/10.1111/head.15057" target="_blank" rel="noopener">Zander et collaborateurs, 2025</a></p></template>

<template data-pop="g97-postpartum" data-title="Post-partum : thrombose veineuse cérébrale et vasoconstriction réversible">
<div class="lab">Cas lausannois</div><p data-evidence="G97-C0495">Un cas du Centre hospitalier universitaire vaudois montre qu’une céphalée post-partum d’abord attribuée à une céphalée post-ponction et soulagée par un blood patch peut précéder une thrombose veineuse cérébrale avec infarctus veineux et un syndrome de vasoconstriction cérébrale réversible. Les trois entités partagent la céphalée et se chevauchent cliniquement.</p>
<div class="lab">Conduite</div><p data-evidence="G97-C0496">Tout nouveau déficit ou changement de la céphalée impose une réévaluation, en accord avec le consensus de 2023 (imagerie urgente).</p>
<div class="lab">Limite</div><p data-evidence="G97-C0497">Cas unique, résumé seul lu : il illustre un piège, il ne chiffre aucune fréquence.</p>
