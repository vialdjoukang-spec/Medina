<template id="ch-C70"><div class="chap"><div class="chap-head"><div class="code">C 70 · Neurologie · Tumeurs des méninges</div><h1>Tumeur maligne des méninges : le méningiome anaplasique de grade 3</h1><span class="status">Cycle Betta 41 · Revue par intelligence artificielle · Aucune validation médicale humaine · Audit différé</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des tumeurs malignes des méninges</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#c70-0">Question clinique</a></li><li><a href="#c70-1">Définition et classification</a></li><li><a href="#c70-2">Fréquence et profil des patients</a></li><li><a href="#c70-3">Physiopathologie</a></li><li><a href="#c70-4">Causes et facteurs de risque</a></li><li><a href="#c70-5">Anamnèse et examen clinique</a></li><li><a href="#c70-6">Démarche diagnostique</a></li><li><a href="#c70-7">Diagnostic différentiel</a></li><li><a href="#c70-8">Urgences et complications</a></li><li><a href="#c70-9">Prise en charge</a></li><li><a href="#c70-10">Suivi et pronostic</a></li><li><a href="#c70-11">Situations particulières</a></li><li><a href="#c70-12">Critères officiels et paramètres décisifs</a></li><li><a href="#c70-src">Sources</a></li></ol></nav><div class="chap-body"><section class="ilot" id="c70-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, une femme de 62 ans consulte pour des céphalées croissantes et une première crise épileptique focale. L’<button class="w" data-k="c70-irm">IRM (signes de la masse extra-axiale et du rehaussement)</button> montre une masse pariétale accolée à la dure-mère, avec une prise de contraste intense, un œdème étendu et un rehaussement hétérogène. Une IRM réalisée six mois plus tôt montrait une lésion plus petite. Ces données sont pédagogiques ; elles servent à poser la question centrale du cours.</p>
<p>La question est la suivante : cette masse est-elle un méningiome habituel de grade 1, ou une tumeur maligne des méninges ? L’imagerie ne suffit pas à répondre. Elle livre un diagnostic provisoire, car l’aspect typique d’un méningiome se retrouve dans plusieurs grades. Seule l’histologie intégrée, c’est-à-dire l’examen au microscope complété par la biologie moléculaire, établit le grade selon la classification de l’<button class="w" data-k="c70-who2021">Organisation mondiale de la santé 2021 (organisation du rapport et grades)</button>.</p>
<p>Ce cours traite la <b>tumeur maligne des méninges</b> sous l’angle de son entité la mieux documentée dans les sources lues : le <button class="w" data-k="c70-def">méningiome anaplasique, ou malin, de grade 3 (définition complète)</button>. Deux idées guident la lecture. D’abord, une croissance rapide sous surveillance doit faire suspecter un grade supérieur ou une métastase durale. Ensuite, la décision thérapeutique de référence pour le grade 3 associe chirurgie aussi radicale que possible et radiothérapie fractionnée, sans traitement médicamenteux de référence.</p>
<div class="key"><b>À retenir.</b> Une masse extra-axiale à base durale qui grandit vite ou récidive tôt impose de penser au grade supérieur. Le grade n’est pas lu sur l’image : il est établi par l’histologie et la biologie moléculaire.</div>
</section>

<section class="ilot" id="c70-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La classification internationale des maladies, dixième révision, version allemande 2024 (<button class="w" data-k="c70-cim">CIM-10-GM (codes et exclusions)</button>), range sous le code C70 les tumeurs malignes des méninges, avec trois sous-codes : C70.0 pour les méninges cérébrales, C70.1 pour les méninges rachidiennes et C70.9 pour les méninges sans précision. Le code C71 désigne l’encéphale, c’est-à-dire une tumeur intra-axiale, et le code C72 exclut les méninges en renvoyant à C70. Le code ne dit rien du type histologique : c’est la classification de l’OMS qui le fait.</p>
<p>Le <b>méningiome anaplasique (malin) de grade 3</b> est le grade le moins fréquent des méningiomes. Il est défini par au moins un critère histologique ou moléculaire. Sur le plan histologique, il compte au moins 20 mitoses pour 10 champs consécutifs à fort grossissement de 0,16 mm² chacun, soit au moins 12,5 mitoses par mm², ou il présente une cytologie franchement maligne, évoquant un carcinome, un mélanome ou un sarcome. Sur le plan moléculaire, une mutation du promoteur du gène <button class="w" data-k="c70-moleculaire">TERT (rôle dans le grade 3)</button> ou une délétion homozygote de <button class="w" data-k="c70-moleculaire">CDKN2A/B</button> suffit à classer la tumeur en grade 3, quelle que soit sa morphologie. Cette règle moléculaire explique qu’une tumeur d’allure bénigne au microscope puisse être reclassée.</p>
<p>La <button class="w" data-k="c70-who2021">classification de l’OMS 2021</button> traite le méningiome comme un type unique, divisé en 15 sous-types, avec trois grades écrits en chiffres arabes. Ce choix évite la confusion entre « II » et « III ». Le grade s’applique au sein d’un type, et les critères du méningiome atypique (grade 2) et anaplasique (grade 3) valent quel que soit le sous-type. Les sous-types rhabdoïde et papillaire ne sont plus classés grade 3 par leur seule morphologie : ils reçoivent le grade 1, 2 ou 3 selon les critères. Les sous-types chordoïde et à cellules claires sont de grade 2.</p>
<p>Le tableau suivant situe les trois grades. Il résume les seuils utilisés par la recommandation de la société européenne de neuro-oncologie (<button class="w" data-k="c70-eano">EANO (rôle et portée)</button>) et par la mise à jour <button class="w" data-k="c70-mitoses">cIMPACT-NOW 8 (comptage des mitoses)</button>. Les cellules sont volontairement courtes ; chaque seuil est détaillé dans les fenêtres vertes.</p>
<table class="t"><thead><tr><th>Grade</th><th>Critère histologique</th><th>Critère moléculaire</th><th>Remarque</th></tr></thead><tbody><tr><td>1</td><td>Aucun critère de grade 2 ou 3</td><td>Aucun marqueur de haut grade</td><td>Plus de 90 % des méningiomes</td></tr><tr><td>2</td><td>≥ 2,5 mitoses/mm² ou invasion cérébrale stricte</td><td>Délétion 1p dans l’invasion cérébrale par ailleurs bénigne</td><td>Chordoïde et à cellules claires</td></tr><tr><td>3</td><td>≥ 12,5 mitoses/mm² ou anaplasie franche</td><td>Promoteur de TERT muté ou CDKN2A/B homozygote supprimé</td><td>Un seul critère suffit</td></tr></tbody></table>
<p>Ce tableau appelle deux commentaires. Le seuil de 12,5 mitoses par mm² se lit dans la zone la plus active de la tumeur, sur 1,6 mm², et ne peut pas être extrapolé à partir d’une surface plus petite. De plus, la délétion qui ne touche qu’une copie de CDKN2A/B (hémizygote) ne suffit pas encore à classer en grade 3. Le <button class="w" data-k="c70-grade2">contexte du grade 2 (invasion cérébrale et cas limites)</button> explique pourquoi la frontière entre grades 2 et 3 reste le point technique le plus délicat.</p>
<p>La tumeur peut être <b>primaire</b>, maligne dès la première résection, ou <b>secondaire</b>, par <button class="w" data-k="c70-primaire">progression d’un méningiome de grade 1 ou 2 (délais et pronostic)</button>. Enfin, d’autres tumeurs méningées malignes existent dans la classification : la tumeur fibreuse solitaire de grade 3 et les tumeurs mélanocytaires malignes. Elles sont <button class="w" data-k="c70-autres">nommées par l’OMS (limites de ce cours)</button>, mais aucune source clinique n’a été lue à leur sujet.</p>
<div class="trap"><span class="k">Piège</span> Écrire « méningiome de grade III » dans un compte rendu rédigé selon l’OMS 2021 prête à confusion. La classification actuelle emploie les chiffres arabes ; les chiffres romains désignent les versions antérieures.</div>
</section>

<section class="ilot" id="c70-2"><h2><span class="n">2</span>Fréquence et profil des patients</h2>
<p>Les données de fréquence proviennent de la recommandation européenne EANO et de registres américains que celle-ci cite comme simples données épidémiologiques. Aucune donnée d’incidence suisse n’a été lue : c’est une lacune du dossier, qui ne doit pas être comblée par une estimation.</p>
<p>Les méningiomes, tous grades confondus, forment 37,6 % des tumeurs primitives intracrâniennes et du système nerveux central, avec une incidence ajustée de 8,58 pour 100 000 personnes-années dans un registre américain de 2012 à 2016, et une forte hausse après 65 ans. Des résumés d’articles suisses les situent à 30–40 % des lésions primitives du système nerveux central et en font la tumeur cérébrale primitive la plus fréquente de l’adulte.</p>
<p>Le grade 3 représente 1,2 % des méningiomes intracrâniens dans une série de 2004 à 2010, où le grade 1 forme 94,6 % et le grade 2 4,2 % ; une revue donne une fourchette de 1 à 3 %. Son incidence a diminué de 0,13 à 0,06 pour 100 000 entre 2000 et 2010. Les sources lues n’expliquent pas cette baisse ; elle ne doit pas être interprétée comme une moindre agressivité de la tumeur.</p>
<table class="t"><thead><tr><th>Caractéristique</th><th>Grades 1 et 2</th><th>Grade 3</th></tr></thead><tbody><tr><td>Sexe</td><td>Femmes 2,3 fois plus nombreuses</td><td>Plus fréquent chez l’homme</td></tr><tr><td>Âge</td><td>Hausse nette après 65 ans</td><td>Surtout l’adulte ; exceptionnel chez l’enfant</td></tr><tr><td>Origine</td><td>Incidence plus élevée chez les personnes d’origine africaine, tous grades</td><td>Même observation globale</td></tr></tbody></table>
<p>La prédominance féminine des grades 1 et 2 s’inverse pour le grade 3. Les sources lues n’expliquent pas cette inversion. Chez l’enfant, la tumeur est exceptionnelle et la survie est plus courte.</p>
</section>

<section class="ilot" id="c70-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>À l’état normal, les méninges comprennent trois enveloppes qui entourent l’encéphale et la moelle : la dure-mère, l’arachnoïde et la pie-mère. La classification distingue les méninges cérébrales et rachidiennes. Le méningiome naît de cellules de ces enveloppes ; il reste donc <b>extra-axial</b>, c’est-à-dire situé en dehors du tissu nerveux, qu’il comprime d’abord. Une description anatomique plus détaillée n’a pas été lue dans une source dédiée ; le volet <button class="w" data-k="c70-anat">anatomie de l’invasion (limites à connaître)</button> reprend seulement ce que les critères de grade exigent.</p>
<p>La progression vers le grade 3 s’explique par l’accumulation d’altérations génétiques. Le fond commun est l’inactivation du gène <button class="w" data-k="c70-nf2">NF2 (neurofibromatose de type 2 et méningiomes)</button>, principale association génétique du méningiome. Les patients porteurs d’une neurofibromatose de type 2 ont plus souvent des méningiomes de grade 2 ou 3, ou des méningiomes multiples. Le grade 3 anaplasique est associé à des altérations de NF2, à une mutation de <button class="w" data-k="c70-moleculaire">TERT</button>, à des délétions des chromosomes 1p, 10 et 22q et à la délétion homozygote de <button class="w" data-k="c70-moleculaire">CDKN2A/B</button>.</p>
<p>Chaque marqueur a une conséquence clinique précise. La mutation du promoteur de TERT signe un risque élevé de récidive. La délétion de CDKN2A/B annonce une évolution très agressive, indépendante de l’histologie : une tumeur d’aspect modéré peut donc se comporter comme un grade 3. La perte de <button class="w" data-k="c70-h3k27">H3K27me3 (marqueur épigénétique débattu)</button> existe dans 10 à 20 % des cas, mais son pronostic est débattu et elle n’est pas retenue comme critère de grade. La perte de BAP1, décrite dans les sous-types rhabdoïde et papillaire, s’associe à une récidive plus précoce.</p>
<p>Les hormones jouent un rôle suggéré par plusieurs observations : le méningiome exprime souvent le récepteur de la progestérone, la taille de la tumeur varie en grossesse et à la ménopause, et une association au cancer du sein est décrite. Ces observations expliquent que les <button class="w" data-k="c70-hormones">progestatifs (mécanisme et limite)</button> soient examinés comme facteur de risque. Elles ne démontrent pas un lien causal avec le grade 3.</p>
<div class="key"><b>À retenir.</b> Le grade 3 résulte d’une accumulation d’altérations : NF2 comme fond commun, puis TERT et CDKN2A/B comme marqueurs de haut risque. Le comportement de la tumeur peut donc excéder ce que la morphologie laisse prévoir.</div>
</section>

<section class="ilot" id="c70-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Trois facteurs de risque sont documentés dans les sources lues. Aucun ne permet de prédire un grade 3 individuel ; ils augmentent le risque de méningiome en général.</p>
<table class="t"><thead><tr><th>Facteur</th><th>Donnée retenue</th><th>Limite</th></tr></thead><tbody><tr><td>Rayonnements ionisants</td><td>Risque accru de méningiome ; tumeurs secondaires après radiochirurgie d’environ 6,8 pour 100 000 patient-années</td><td>Tous grades confondus</td></tr><tr><td>Neurofibromatose de type 2</td><td>Association génétique la plus fréquente ; grades 2 et 3 plus fréquents</td><td>cIMPACT-NOW 8 ne s’applique pas à ces tumeurs</td></tr><tr><td>Acétate de cyprotérone</td><td>Méningiomes lors d’un usage prolongé à 25 mg/jour ou plus</td><td>Aucun lien démontré avec le grade 3</td></tr></tbody></table>
<p>Le cas de l’<button class="w" data-k="c70-cyproterone">acétate de cyprotérone (information professionnelle suisse)</button> mérite une attention pratique. L’information professionnelle d’Androcur®-50, mise à jour en juin 2022, rapporte des méningiomes lors d’une utilisation à long terme à 25 mg/jour ou plus, le plus souvent pendant plusieurs années et parfois multiples. Le risque croît avec la dose cumulée. Un antécédent ou la présence d’un méningiome constitue une contre-indication, et le traitement est arrêté définitivement si un méningiome est diagnostiqué. Un résumé d’article suisse (Revue médicale suisse 2021) rattache aussi les progestatifs antiandrogéniques à forte dose, prescrits notamment pour l’hirsutisme, à un risque accru.</p>
<div class="trap"><span class="k">Piège</span> Le lien entre cyprotérone et méningiome vise le méningiome sans précision de grade. Présenter ce médicament comme cause du grade 3 dépasserait ce que les sources démontrent.</div>

<section class="ilot" id="c70-5"><h2><span class="n">5</span>Anamnèse et examen clinique</h2>
<p>Les symptômes dépendent de la localisation, car la tumeur agit d’abord par compression. Les sources lues décrivent trois mécanismes : l’effet de masse, l’hypertension intracrânienne et la compression focale de nerfs crâniens. L’épilepsie est fréquente. Les symptômes neurologiques et l’effet de masse sont les principales indications thérapeutiques ; les céphalées et les crises sont associées à une moins bonne qualité de vie.</p>
<div class="two"><div class="card"><h4>Forme habituelle</h4><p>Le patient se plaint de céphalées progressives, de crises focales ou d’un déficit lié à la zone comprimée. Les sites fréquents du méningiome malin sont la convexité cérébelleuse et la région pariétale. L’envahissement osseux et des tissus mous extracrâniens est possible.</p></div><div class="card"><h4>Forme rachidienne</h4><p>Le méningiome rachidien est rare. La chirurgie y décomprime la moelle. Le tableau clinique détaillé de la myélopathie n’est pas décrit dans les sources lues ; il ne doit pas être reconstruit de mémoire.</p></div></div>
<p>La <b>chronologie</b> est la donnée clinique la plus utile. Une lésion connue qui grossit rapidement sous surveillance doit faire suspecter un grade supérieur ou une métastase durale. Le médecin recherche donc la date et le résultat de toute imagerie antérieure, les traitements hormonaux passés (en particulier la cyprotérone), une irradiation cérébrale antérieure et un antécédent familial ou personnel de neurofibromatose de type 2.</p>
<p>L’examen clinique cherche les signes de la localisation : déficit moteur ou sensitif focal, atteinte d’un nerf crânien, signes d’hypertension intracrânienne, crises. Il recherche aussi une tuméfaction osseuse ou des tissus mous du crâne, puisque l’extension extracrânienne est possible. Les sources lues ne donnent pas de séméiologie plus fine ; l’examen sert surtout à localiser la lésion et à évaluer le retentissement fonctionnel avant la décision thérapeutique.</p>
<p>La question de l’<button class="w" data-k="c70-epilepsie">épilepsie (prophylaxie et traitement prolongé)</button> est pratique : un traitement antiépileptique est souvent prolongé chez les patients qui ont convulsé, mais une prophylaxie de routine n’est pas recommandée chez ceux qui n’ont pas fait de crise. Le choix de la molécule n’est pas documenté dans les sources lues.</p>
<div class="key"><b>À retenir.</b> Aucun signe clinique ne distingue le grade 3 des autres grades. La croissance rapide et la récidive précoce sont les seuls indices cliniques, et l’histologie reste décisive.</div>
