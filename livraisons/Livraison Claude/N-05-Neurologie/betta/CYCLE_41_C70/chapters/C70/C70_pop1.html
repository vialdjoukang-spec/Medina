<template data-pop="c70-irm" data-title="IRM : signes du méningiome et du haut grade">
<div class="lab">Aspect typique</div><p>Le méningiome apparaît comme une masse extra-axiale, iso-intense en séquence T1, hyperintense en T2 et en FLAIR, avec une prise de contraste intense et une « queue durale », c’est-à-dire un épaississement de la dure-mère qui s’éloigne de la masse. Cet aspect identifie la nature méningée de la lésion.</p>
<div class="lab">Signes qui suggèrent un grade supérieur</div><p>Un œdème FLAIR étendu et un rehaussement hétérogène suggèrent le grade 2 ou 3. La perte du liseré de liquide céphalorachidien et de la limite entre cerveau et tumeur indique un caractère agressif. Un rehaussement homogène est de meilleur pronostic.</p>
<div class="lab">Limites</div><p>La nécrose, les kystes et l’œdème ne prédisent pas le grade de façon fiable, et l’apport du coefficient apparent de diffusion est controversé. L’IRM établit un diagnostic provisoire (classe 4, bonne pratique clinique selon l’EANO) ; l’histologie établit le grade.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-who2021" data-title="Classification de l’OMS 2021 : grades et diagnostic intégré">
<div class="lab">Principe</div><p>Le méningiome forme un type unique à 15 sous-types, gradé 1, 2 ou 3 en chiffres arabes. Le grade s’applique au sein d’un type : les critères du méningiome atypique et du méningiome anaplasique valent quel que soit le sous-type. Les sous-types chordoïde et à cellules claires sont de grade 2 ; rhabdoïde et papillaire ne sont plus de grade 3 par leur seule morphologie.</p>
<div class="lab">Diagnostic intégré</div><p>Le rapport est construit en couches : diagnostic intégré en tête, puis histologie, puis résultats moléculaires. Le grade « n’est plus seulement histologique » : un résultat moléculaire peut le modifier.</p>
<div class="lab">Limite</div><p>Le texte lu est un résumé publié ; le livre complet de l’OMS, avec les critères détaillés, n’a pas été lu. Les seuils de mitoses proviennent d’autres sources.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">Louis et coll., classification OMS 2021, Neuro-Oncology</a>.</p></template>
<template data-pop="c70-def" data-title="Méningiome anaplasique de grade 3 : définition">
<div class="lab">Définition</div><p>Le méningiome anaplasique (malin) de grade 3 est le grade le moins fréquent. Il est défini par au moins un critère : au moins 12,5 mitoses par mm² (environ 20 mitoses pour 10 champs de 0,16 mm²), une cytologie franchement maligne, une mutation du promoteur de TERT ou une délétion homozygote de CDKN2A/B.</p>
<div class="lab">Comportement</div><p>Il se caractérise par une croissance rapide, une récidive précoce et un risque de métastase systémique. Il peut être malin d’emblée ou résulter de la progression d’un grade inférieur.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-cim" data-title="CIM-10-GM 2024 : C70, C71, C72">
<div class="lab">Codes</div><p>C70.0 : méninges cérébrales ; C70.1 : méninges rachidiennes ; C70.9 : méninges sans précision. Aucune inclusion ni exclusion n’est listée sous C70. C72 exclut les méninges et renvoie à C70 ; C71 désigne l’encéphale.</p>
<div class="lab">Limites</div><p>Le libellé consulté est en allemand ; les libellés français de l’Office fédéral de la statistique viennent du catalogue du projet. Le code des métastases leptoméningées (C79.3) n’a pas été vérifié sur cette page, et la correspondance entre les autres tumeurs malignes méningées de l’OMS et le code C70 n’a pas été vérifiée.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c69-c72.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024, bloc C69–C72</a>.</p></template>
<template data-pop="c70-moleculaire" data-title="TERT et CDKN2A/B : critères moléculaires du grade 3">
<div class="lab">TERT</div><p>Une mutation du promoteur du gène TERT (points chauds C228T et C250T) est un critère suffisant de grade 3. Elle marque un risque élevé de récidive.</p>
<div class="lab">CDKN2A/B</div><p>Une délétion homozygote de CDKN2A/B est également suffisante, et annonce une évolution très agressive indépendante de l’histologie. Une délétion hémizygote ne suffit pas encore.</p>
<div class="lab">Application</div><p>Ces critères permettent de reclasser en grade 3 une tumeur d’allure histologique modérée. Le test est donc indiqué quand le grade est incertain (voir la fenêtre des tests moléculaires).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021</a>.</p></template>
<template data-pop="c70-eano" data-title="EANO : rôle et portée">
<p>L’Association européenne de neuro-oncologie a publié en 2021 une recommandation sur le diagnostic et la prise en charge des méningiomes de l’adulte. Elle est européenne, avec des auteurs de centres suisses ; elle ne remplace pas une recommandation suisse, dont aucun texte intégral n’a été lu. Son épidémiologie provient de registres américains cités comme données, jamais comme fondement d’une conduite. Elle ne comporte ni section clinique détaillée ni différentiel, et ne formule aucune recommandation sur les corticoïdes.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">Goldbrunner et coll., Neuro-Oncology 2021</a>.</p></template>
<template data-pop="c70-mitoses" data-title="Comptage des mitoses selon cIMPACT-NOW 8">
<div class="lab">Règle</div><p>Le seuil du grade 3 est de 12,5 mitoses par mm², compté dans le point chaud sur 1,6 mm². L’extrapolation depuis une plus petite surface n’est pas acceptable. Dix champs de 0,16 mm² équivalent à environ sept champs de 0,23 à 0,24 mm².</p>
<div class="lab">Exemple</div><p>Vingt mitoses sur 1,6 mm² : 20 ÷ 1,6 = 12,5 par mm², donc grade 3.</p>
<div class="lab">Limite</div><p>La mise à jour ne s’applique pas aux enfants, aux méningiomes radio-induits ni à ceux liés à NF2.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">Sahm et coll., cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-grade2" data-title="Grade 2 et cas limites">
<div class="lab">Grade 2</div><p>Il est défini par au moins 2,5 mitoses par mm² ou par une invasion cérébrale stricte, c’est-à-dire au-delà d’une pie-mère intacte. L’extension dans les espaces de Virchow-Robin ne compte pas.</p>
<div class="lab">Invasion cérébrale par ailleurs bénigne</div><p>On ne grade pas avant les données moléculaires. Une délétion 1p avec altération de 22q ou de NF2 conduit au grade 2 au moins. Une mutation de TERT ou une délétion homozygote de CDKN2A/B conduit au grade 3. Sans test, la tumeur reste un méningiome sans précision, non gradé.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-primaire" data-title="Méningiome primaire et secondaire">
<p>Un méningiome est primaire s’il est malin dès la première résection, secondaire s’il provient de la progression d’un grade 1 ou 2. Le délai moyen de transformation est de 5,5 ans (0,5 à 22 ans). Une série ne trouve aucune différence de survie ni de progression entre les deux ; la distinction donne donc des résultats incohérents comme facteur pronostique.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-autres" data-title="Autres tumeurs méningées malignes de l’OMS">
<p>La classification de l’OMS 2021 nomme la tumeur fibreuse solitaire (tumeur mésenchymateuse non méningothéliale, grades 1 à 3, fusion NAB2-STAT6, le terme « hémangiopéricytome » étant abandonné) et les tumeurs mélanocytaires méningées, diffuses (mélanocytose, mélanomatose) ou circonscrites (mélanocytome, mélanome méningé). Aucune source clinique n’a été lue sur leur traitement ou leur pronostic, et leur rattachement au code C70 n’a pas été vérifié : ce cours ne les développe pas.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8328013/" target="_blank" rel="noopener">OMS 2021, résumé</a>.</p></template>
<template data-pop="c70-anat" data-title="Anatomie : limites de l’invasion">
<p>La pie-mère est la limite que le critère d’invasion cérébrale exige de franchir. Les espaces de Virchow-Robin, qui entourent les vaisseaux entrant dans le cerveau, ne comptent pas. Le détail anatomique des enveloppes n’a pas été lu dans une source dédiée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-nf2" data-title="Neurofibromatose de type 2 et méningiomes">
<p>NF2 est l’association génétique la plus fréquente du méningiome. Les patients porteurs ont plus souvent des méningiomes de grade 2 ou 3 ou multiples. La mise à jour cIMPACT-NOW 8 ne s’applique pas à ces tumeurs.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-h3k27" data-title="Perte de H3K27me3">
<p>La perte de H3K27me3 touche 10 à 20 % des cas. Son pronostic est débattu et elle n’est pas retenue comme critère de grade.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-hormones" data-title="Hormones et méningiome">
<p>Le méningiome exprime souvent le récepteur de la progestérone ; sa taille varie en grossesse et à la ménopause ; une association au cancer du sein est décrite. Ces faits suggèrent un rôle hormonal, sans démontrer de lien causal avec le grade 3.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-cyproterone" data-title="Acétate de cyprotérone (Androcur®-50)">
<div class="lab">Information professionnelle suisse (juin 2022)</div><p>Des méningiomes, parfois multiples, sont rapportés lors d’une utilisation à long terme à 25 mg/jour ou plus, le plus souvent pendant plusieurs années. Le risque croît avec la dose cumulée.</p>
<div class="lab">Conduite</div><p>Un antécédent ou la présence d’un méningiome est une contre-indication. Le traitement est arrêté définitivement si un méningiome est diagnostiqué. La durée est à fixer en tenant compte de ce risque, et une prise de plusieurs années est à éviter dans l’indication hirsutisme.</p>
<div class="lab">Limite</div><p>Le risque concerne le méningiome sans précision de grade ; aucun lien avec le grade 3 n’est démontré.</p>
<p class="src">Références : information professionnelle suisse d’Androcur®-50, Swissmedic (AIPS), mise à jour juin 2022 ; <a href="https://pubmed.ncbi.nlm.nih.gov/34669295/" target="_blank" rel="noopener">Revue médicale suisse 2021, progestatifs en gynécologie (résumé)</a>.</p></template>
<template data-pop="c70-epilepsie" data-title="Épilepsie et méningiome">
<p>L’épilepsie est fréquente. Le traitement antiépileptique est souvent prolongé chez les patients qui ont convulsé. Une prophylaxie de routine n’est pas recommandée. Les crises et les céphalées altèrent la qualité de vie. Le choix de la molécule n’est pas documenté dans les sources lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-tdm" data-title="Tomodensitométrie en fenêtre osseuse">
<p>Elle montre l’hyperostose et la croissance intraosseuse, une masse extra-axiale hyperdense et d’éventuelles calcifications. Elle complète l’IRM pour l’atteinte osseuse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-tep" data-title="TEP aux analogues de la somatostatine">
<p>La tomographie par émission de positons aux traceurs du récepteur de type 2 de la somatostatine (gallium 68 avec DOTATATE ou DOTATOC) est conseillée si l’extension ou la récidive sont incertaines (classe 3, niveau C). Elle n’est pas encore un standard. L’angiographie conventionnelle n’est discutée que si un sinus majeur est envahi et que l’angiographie par résonance magnétique est insuffisante.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-tests" data-title="Indications des tests moléculaires">
<p>Selon le tableau 1 de cIMPACT-NOW 8 : morphologie limite entre grades 1 et 2 ; méningiome bénin à invasion cérébrale ; grade 1 à croissance ou récidive inattendue ; confirmation d’un grade 2 ou distinction entre grades 1 et 3 ; sous-types chordoïde, à cellules claires, rhabdoïde et papillaire ; enfants et jeunes adultes. L’échantillon vient de la zone la plus agressive. La méthylation et l’analyse du nombre de copies ne servent au grade que si elles concordent avec le reste.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-lacunes" data-title="Lacunes du dossier">
<ol><li>Aucune recommandation suisse en texte intégral ; seuls quatre résumés suisses ont été lus.</li><li>Aucune donnée d’incidence suisse.</li><li>Tumeur fibreuse solitaire maligne et mélanome méningé : clinique, traitement et rattachement à C70 non vérifiés.</li><li>Fréquence et sites des métastases extracrâniennes du grade 3 non extraits.</li><li>Corticoïdes, choix des antiépileptiques et conduite d’urgence non sourcés.</li><li>Différentiel des lésions durales (lymphome, sarcoïdose) et immunohistochimie diagnostique non sourcés.</li><li>Anatomie détaillée des méninges non lue.</li><li>Recherche web générale indisponible lors de la recherche.</li></ol>
<p>Ces points restent à combler avant toute certification du cours.</p></template>
<template data-pop="c70-leptomeninge" data-title="Métastase leptoméningée : diagnostic différentiel">
<div class="lab">Définition et clinique</div><p>Diffusion de cellules tumorales dans les leptoméninges et l’espace sous-arachnoïdien, surtout à partir du sein, du poumon ou d’un mélanome. Les signes sont céphalées, nausées, troubles cognitifs, troubles de la marche, atteinte de nerfs crâniens et signes radiculaires. Une atteinte multifocale est très évocatrice.</p>
<div class="lab">Imagerie et liquide</div><p>L’IRM peut être linéaire, nodulaire, mixte, avec hydrocéphalie, ou normale. Dans le liquide, la cytologie est positive dans 60,5 à 83 %, les protéines dépassent 500 mg/L dans 56 à 91 %, les cellules dépassent 4 par mm³ dans 39 à 77,5 %. Il faut au moins 10 mL (5 mL au minimum), un traitement en moins de 30 minutes, et une répétition si négatif. Le diagnostic est confirmé par une cytologie ou une biopsie positive.</p>
<div class="lab">Pronostic</div><p>Survie médiane de 3 à 8 mois selon la tumeur primitive.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10619142/" target="_blank" rel="noopener">Le Rhun et coll., recommandation EANO et société européenne d’oncologie médicale, 2023</a>.</p></template>
<template data-pop="c70-mnemo" data-title="Aide mnémotechnique : trois portes vers le grade 3">
<p><b>Aide pédagogique, non critère officiel.</b> Pour retenir les critères de grade 3, on peut penser « compter, regarder, séquencer » : <b>compter</b> les mitoses (12,5 par mm² ou plus), <b>regarder</b> la cytologie (anaplasie franche), <b>séquencer</b> le tissu (TERT muté, CDKN2A/B homozygote). Un seul des trois suffit.</p></template>
<template data-pop="pareto-c70-bases" data-title="Pareto — Définition, fréquence, mécanismes et causes">
<p class="ratio" data-cover="c70-1,c70-2,c70-3,c70-4"></p><ul><li>Le grade 3 est défini par au moins un critère : 12,5 mitoses par mm² ou plus, anaplasie franche, TERT muté ou CDKN2A/B homozygote supprimé.</li><li>Il représente 1 à 3 % des méningiomes et touche davantage l’homme.</li><li>NF2, les rayonnements ionisants et la cyprotérone à 25 mg/jour ou plus augmentent le risque de méningiome, sans lien démontré avec le grade 3.</li></ul></template>
<template data-pop="pareto-c70-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="c70-5"></p><ul><li>Aucun signe clinique ne distingue le grade 3 : la croissance rapide et la récidive précoce sont les seuls indices.</li><li>Les symptômes dépendent de la localisation : masse, hypertension intracrânienne, nerfs crâniens, crises.</li><li>Pas de prophylaxie anticonvulsivante de routine.</li></ul></template>
<template data-pop="pareto-c70-prise" data-title="Pareto — Diagnostic, traitement et suivi">
<p class="ratio" data-cover="c70-6,c70-7,c70-8,c70-9,c70-10,c70-11,c70-12"></p><ul><li>L’imagerie donne un diagnostic provisoire ; l’histologie intégrée établit le grade.</li><li>Standard : chirurgie radicale puis radiothérapie fractionnée d’environ 60 Gy en 30 fractions.</li><li>Aucun traitement systémique standard ; le bévacizumab est hors étiquette en Suisse.</li><li>IRM tous les 3 à 6 mois ; survie à 5 ans d’environ 55 %.</li><li>Une croissance rapide impose de penser aussi à une métastase.</li></ul></template>
