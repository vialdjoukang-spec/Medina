<template data-pop="c70-chirurgie" data-title="Chirurgie : bénéfice, morbidité et rattrapage">
<div class="lab">Principe</div><p>La chirurgie est le traitement principal. Le bénéfice de l’étendue de résection est incertain dans le grade 3, et une chirurgie excessive entraîne une morbidité majeure.</p>
<div class="lab">Chiffres</div><p>Complications : 41 % (26 sur 63) dans une série, dont 60 % de majeures. Événements thromboemboliques veineux : 7 % sur 581 patients. Mortalité à 30 jours : 11,8 % dans une série de 51 patients. Chirurgie de rattrapage à la première récidive : survie médiane de 53 mois contre 25 sans chirurgie ; environ trois interventions en moyenne, sans preuve de bénéfice au-delà de deux.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-radiotherapie" data-title="Radiothérapie : doses et essais">
<div class="lab">Principe</div><p>La radiothérapie postopératoire est le standard après exérèse totale comme subtotale. Les doses historiques sont de 54 à 60 Gy en fractions de 1,8 à 2,0 Gy ; les protocoles récents emploient 60 Gy en 30 fractions. L’essai EORTC 22042-26042 ajoute un complément de 10 Gy après exérèse subtotale. Le volume cible comprend le lit opératoire et 1 à 2 cm de dure-mère.</p>
<div class="lab">Preuves</div><p>Dans l’essai RTOG 0539 (groupe à haut risque incluant le grade 3, 53 patients, 60 Gy en 30 fractions), la survie sans progression à 3 ans est de 58,8 %, le contrôle local de 68,9 % et la survie globale de 78,6 %. Les effets indésirables atteignent environ 40 %, avec un décès lié à une nécrose. Une méta-analyse de 21 études associe la radiothérapie postopératoire à environ deux ans de survie en plus (60 contre 36 mois), avec une preuve de très faible qualité.</p>
<div class="lab">Limites</div><p>Les protons et les ions carbone sont expérimentaux. Les groupes d’essai incluent plusieurs grades.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-simpson" data-title="Classification de Simpson">
<p>Elle décrit l’étendue de l’exérèse. Les grades 0 à III correspondent à une exérèse totale macroscopique, les grades IV et V à une exérèse subtotale. Un grade 0, avec une marge durale de 2 à 3 cm, est proposé. Les essais définissent souvent l’exérèse totale comme l’absence de tumeur solide résiduelle. L’objectif de l’EANO pour le grade 3 est le grade I de Simpson, si l’intervention est sûre (classe 3, niveau B). Pour le grade 2, la radiothérapie est recommandée après Simpson IV–V ; après Simpson I–III, la question n’est pas résolue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-radiochirurgie" data-title="Radiochirurgie">
<p>Pour les tumeurs de 3 cm au plus, le contrôle est comparable à une exérèse de grade I de Simpson, mais ces données concernent surtout le grade 1. La dose dépasse 13 Gy ; la radiothérapie stéréotaxique hypofractionnée utilise 2 à 5 fractions de 4 à 10 Gy (18 à 25 Gy). Les tumeurs secondaires après radiochirurgie surviennent à environ 6,8 pour 100 000 patient-années.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-systemique" data-title="Traitements systémiques : résultats par molécule">
<p>Aucun standard n’existe. Résultats rapportés (séries restreintes) : bévacizumab (grade 3) survie sans progression à six mois 46 %, survie globale 12,4 mois ; sunitinib 42 % ; évérolimus avec octréotide 55 % ; pembrolizumab 48 % ; nivolumab 42,4 % ; pasiréotide 17 % ; mifépristone négatif en phase 3 ; radiothérapie interne vectorisée (grade 3, 19 patients) 0 %. Pour les grades 2 et 3 ensemble, la survie sans progression à six mois varie de 0 à 64 % et la survie globale médiane de 6 à 33 mois. Les inhibiteurs multikinases anti-VEGFR et le bévacizumab ne se discutent qu’en l’absence d’option locale (classe 3, niveau C).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27078728/" target="_blank" rel="noopener">Praxis 2016 (résumé)</a>.</p></template>
<template data-pop="c70-rano" data-title="Critères RANO : évaluation de la réponse">
<p>Imagerie tridimensionnelle T1 injectée, coupes de 1,5 mm au plus. Réponse complète : aucune lésion rehaussée pendant au moins 8 semaines.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-recidive" data-title="Récidive : chiffres contradictoires">
<p>La revue rapporte une récidive d’environ 50 % à 2 ou 3 ans quelle que soit l’étendue de la résection, ailleurs plus de 90 %, et 72 à 94 % à 5 ans après exérèse totale. Ces chiffres sont contradictoires dans la source et présentés tels quels. La source ne réconcilie pas ces écarts.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-spinal" data-title="Forme rachidienne">
<p>Beaucoup plus rare. La chirurgie est le traitement de choix (Simpson I–II), à tenter même chez le sujet âgé ; elle décomprime la moelle. La récidive est de 1,3 à 14,7 % dans des séries tous grades. Dans un registre américain (10 458 patients, 268 irradiés), la radiothérapie est associée à une mortalité plus basse seulement dans le sous-groupe borderline ou malin.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-enfant" data-title="Enfant">
<p>Le méningiome malin est exceptionnel chez l’enfant, et la survie est plus courte. La mise à jour cIMPACT-NOW 8 ne s’applique pas à l’enfant.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-avastin" data-title="Bévacizumab (Avastin®) : monographie">
<div class="lab">Statut en Suisse</div><p>L’information professionnelle (mise à jour mai 2026) autorise le bévacizumab en monothérapie dans le glioblastome récidivant, à 10 mg/kg toutes les 2 semaines. Aucune indication n’existe pour le méningiome : son usage y est hors étiquette.</p>
<div class="lab">Mécanisme et preuves</div><p>Anticorps dirigé contre le facteur de croissance de l’endothélium vasculaire, il limite la néovascularisation tumorale. Dans le grade 3, la survie sans progression à six mois est de 46 % et la survie globale de 12,4 mois dans une série ; la preuve est de faible qualité.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Complications de cicatrisation, dont une déhiscence de craniotomie avec fuite de liquide céphalorachidien (3,6 % en monothérapie, étude AVF3708g), et hémorragies du système nerveux central. La surveillance porte sur la cicatrisation et les signes hémorragiques. Les autres contre-indications n’ont pas été extraites.</p>
<p class="src">Références : information professionnelle suisse d’Avastin®, Swissmedic (AIPS), mai 2026 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-trabectedine" data-title="Trabectédine : essai EORTC 1320">
<p>Dans l’essai EORTC 1320, la trabectédine n’est pas supérieure au choix du médecin. Elle n’est donc pas une option établie. Les posologies et l’information professionnelle suisse n’ont pas été lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="pareto-c70-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="c70-e-1,c70-e-2,c70-e-3,c70-e-4,c70-e-5,c70-e-6"></p><ul><li>IRM puis histologie intégrée ; l’imagerie ne donne jamais le grade.</li><li>Seuil de grade 3 : 12,5 mitoses par mm², comptées sur 1,6 mm².</li><li>TERT muté ou CDKN2A/B homozygote supprimé suffit ; l’hémizygote ne suffit pas.</li><li>Une première ponction lombaire négative n’exclut pas une métastase leptoméningée.</li></ul></template>
<template data-pop="pareto-c70-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="c70-s-anat-cours"></p><ul><li>Le méningiome naît des méninges et comprime avant d’infiltrer.</li><li>L’invasion cérébrale exige le franchissement d’une pie-mère intacte.</li></ul></template>
<template data-pop="pareto-c70-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="c70-s-histo-cours"></p><ul><li>20 mitoses sur 10 champs de 0,16 mm² font 12,5 par mm².</li><li>Une anaplasie franche suffit au grade 3.</li></ul></template>
<template data-pop="pareto-c70-genet" data-title="Pareto — Génétique">
<p class="ratio" data-cover="c70-s-genet-cours"></p><ul><li>TERT et CDKN2A/B homozygote définissent le grade 3 quelle que soit la morphologie.</li><li>NF2 prédispose aux grades 2 et 3 et aux tumeurs multiples.</li></ul></template>
<template data-pop="pareto-c70-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="c70-p-1,c70-p-2,c70-p-3,c70-p-4,c70-p-5"></p><ul><li>Aucun traitement systémique standard ; aucune indication suisse pour le méningiome.</li><li>Bévacizumab : hors étiquette, risque de cicatrisation et d’hémorragie.</li><li>Cyprotérone : contre-indiquée si méningiome.</li></ul></template>
<template data-pop="c70-cimo" data-title="CIM-O : règle de rattachement au code">
<div class="lab">Règle suisse</div><p>Le cinquième chiffre du code de morphologie de la CIM-O, qui suit la barre oblique, indique le comportement de la tumeur. Il détermine la catégorie de la CIM-10 : /3 (malin) vers C00–C97 ; /1 (incertain) vers D37–D48 ; /0 (bénin), pour le système nerveux central, vers D32–D33.</p>
<div class="lab">Application aux méninges</div><p>Un méningiome de comportement malin se code C70, un méningiome bénin D32 et un méningiome de comportement incertain D42 (méninges, moelle épinière et méninges sans précision).</p>
<div class="lab">Limite</div><p>Le code de morphologie exact attribué à chaque grade de l’OMS n’a pas été lu : le cours ne dit pas quel grade reçoit quel comportement.</p>
<p class="src">Références : <a href="https://www.usz.ch/app/uploads/2023/06/2023-01-01-hilfsunterlage-meldepflichtige-erkrankungen-nkrs.pdf" target="_blank" rel="noopener">Registre national des cancers, document d’aide sur les maladies à déclarer</a> (état au 23 mai 2022) ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-c69-c72.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024</a>.</p></template>
<template data-pop="c70-zurich" data-title="Registre des cancers de Zurich : chiffres et limites">
<div class="lab">Population</div><p>Registre des cantons de Zurich, Zoug, Schaffhouse et Schwyz, de 1980 à 2021, personnes de 15 ans et plus, 10 226 tumeurs de l’encéphale et du système nerveux central.</p>
<div class="lab">Résultats</div><p>L’incidence standardisée des tumeurs malignes est stable en 2011–2021 : 7,7 pour 100 000 chez l’homme, 5,0 chez la femme. Les tumeurs malignes sont au nombre de 3971, soit 38,8 % des tumeurs. Les tumeurs des méninges sont surtout non malignes. L’incidence des méningiomes est plus élevée chez la femme et en hausse (variation annuelle moyenne en pourcentage : 2,4 chez la femme, 1,3 chez l’homme). L’incidence de l’ensemble des tumeurs cérébrales est maximale entre 55 et 74 ans. La survie relative à 5 ans des tumeurs bénignes ou limites dépasse 90 % en 2011–2017.</p>
<div class="lab">Limites</div><p>Données cantonales. Aucun chiffre propre au méningiome de grade 3 ni au code C70 isolé : la fréquence du grade 3 ne peut pas être donnée pour la Suisse.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12277868/" target="_blank" rel="noopener">Wanner et coll., Cancer Medicine 2025</a>.</p></template>
<template data-pop="c70-mimes" data-title="Simulateurs du méningiome : repères d’imagerie">
<div class="lab">Règle générale</div><p>Le méningiome calcifie et provoque une hyperostose ; beaucoup de simulateurs érodent l’os sans calcifier. La perfusion du méningiome est élevée (volume sanguin cérébral relatif de 6 à 9).</p>
<div class="lab">Par simulateur</div><ul><li><b>Métastase durale</b> (sein, prostate, poumon) : envahit et détruit l’os adjacent ; volume sanguin habituellement inférieur à 2, sauf exceptions hypervasculaires (rein, mélanome, Merkel).</li><li><b>Lymphome dural</b> (zone marginale B) : hyperdense au scanner sans calcification ni hyperostose, interface floue, plus d’œdème, diffusion restreinte, volume sanguin bas, avidité pour le fluorodésoxyglucose.</li><li><b>Tumeur fibreuse solitaire</b> : érosion osseuse lisse (environ 57 %) plutôt qu’hyperostose, calcification rare, aspect « yin-yang », volume sanguin de 7 à 7,5.</li><li><b>Tumeurs mélanocytaires</b> : hypersignal en T1 (mélanine, sang), absence de mélanome systémique pour la forme primitive.</li><li><b>Autres</b> : tuberculose (méninges de la base, plus d’œdème, érosion osseuse), granulomatose avec polyangéite, maladie de Rosai-Dorfman, maladie d’Erdheim-Chester, maladie à IgG4, tumeurs musculaires lisses liées au virus d’Epstein-Barr chez l’immunodéprimé.</li></ul>
<div class="lab">Queue durale</div><p>Non spécifique : jusqu’à 72 % des méningiomes, près de la moitié des métastases durales, un quart des glioblastomes et gliosarcomes périphériques.</p>
<div class="lab">Limites</div><p>Revue iconographique narrative ; la sarcoïdose est citée sans section dédiée lue. Les signes ne remplacent pas l’histologie.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6365311/" target="_blank" rel="noopener">Lyndon et coll., Insights into Imaging 2019</a>.</p></template>
<template data-pop="c70-dexa" data-title="Dexaméthasone : information professionnelle suisse">
<div class="lab">Statut en Suisse</div><p>Information professionnelle de la dexaméthasone Galepharm en comprimés, mise à jour en janvier 2022. L’œdème cérébral, notamment provoqué par une tumeur cérébrale ou par des interventions neurochirurgicales, figure parmi les indications autorisées, tout comme le traitement palliatif des tumeurs malignes.</p>
<div class="lab">Posologie</div><p>Œdème cérébral grave : début par voie intraveineuse, puis 4 à 16 mg/jour par voie orale si l’état s’améliore. Cas plus légers : 2 à 8 mg/jour par voie orale. Dose journalière fractionnable en 2 à 4 prises. Traitement palliatif des tumeurs malignes : 8 à 16 mg au début, puis 4 à 12 mg/jour. Dans l’œdème cérébral aigu, elle s’ajoute au traitement classique.</p>
<div class="lab">Effets indésirables lus</div><p>Hypertension intracrânienne avec stase papillaire, apparition ou aggravation d’une épilepsie, rétention sodée, hypokaliémie.</p>
<div class="lab">Limites</div><p>Information d’un générique ; schéma de sevrage non détaillé ; aucune recommandation spécifique au méningiome. La recommandation EANO sur le méningiome ne traite pas des corticoïdes.</p>
<p class="src">Références : information professionnelle suisse de la dexaméthasone Galepharm, Swissmedic (AIPS), janvier 2022.</p></template>
<template data-pop="c70-leve" data-title="Lévétiracétam : information professionnelle suisse">
<div class="lab">Statut en Suisse</div><p>Information professionnelle du lévétiracétam Sandoz, mise à jour en avril 2023. Monothérapie des crises focales, avec ou sans généralisation secondaire, à partir de 16 ans.</p>
<div class="lab">Posologie</div><p>500 mg deux fois par jour dès le premier jour, jusqu’à 1500 mg deux fois par jour, par paliers de 250 à 500 mg deux fois par jour toutes les 2 à 4 semaines. Adaptation rénale selon la clairance (mL/min/1,73 m²) : plus de 80 : 500 à 1500 mg ; 50 à 79 : 500 à 1000 mg ; 30 à 49 : 250 à 750 mg ; moins de 30 : 250 à 500 mg, toujours deux fois par jour ; dialyse : 500 à 1000 mg une fois par jour, plus 250 à 500 mg après la dialyse.</p>
<div class="lab">Mises en garde</div><p>Idées et comportements suicidaires ; troubles psychiatriques et du comportement.</p>
<div class="lab">Limite</div><p>Cette molécule est prise comme exemple d’antiépileptique : aucune source lue ne la désigne comme molécule de choix dans le méningiome.</p>
<p class="src">Références : information professionnelle suisse du lévétiracétam Sandoz, Swissmedic (AIPS), avril 2023.</p></template>
<template data-pop="c70-declaration" data-title="Déclaration au registre des cancers">
<div class="lab">Obligation</div><p>Pour les diagnostics posés dès le 1er janvier 2020, la loi sur l’enregistrement des maladies oncologiques impose de déclarer au registre cantonal les néoplasies malignes (comportement /3) de toutes localisations, soit les codes C00 à C97, donc C70. Certaines tumeurs bénignes du système nerveux central (D32, D33 et D35.2) sont aussi à déclarer.</p>
<div class="lab">Limite</div><p>Le document consulté est une aide qui renvoie à l’annexe 1 de l’ordonnance ; l’annexe n’a pas été lue directement.</p>
<p class="src">Références : <a href="https://www.usz.ch/app/uploads/2023/06/2023-01-01-hilfsunterlage-meldepflichtige-erkrankungen-nkrs.pdf" target="_blank" rel="noopener">Registre national des cancers, maladies à déclarer</a> (état au 23 mai 2022).</p></template>
<template data-pop="c70-conduite" data-title="Aptitude à la conduite après une crise">
<div class="lab">Règles générales</div><ul><li>Après une première crise, l’aptitude est d’abord suspendue.</li><li>Crise provoquée, ou crise postopératoire précoce (moins d’une semaine) : en règle 3 mois d’interdiction.</li><li>Première crise non provoquée : en règle 6 mois.</li><li>Épilepsie : reprise après 1 an sans crise.</li><li>L’interdiction est prolongée en cas de crises sur une lésion progressive du système nerveux central.</li></ul>
<div class="lab">Catégories professionnelles</div><p>Poids lourds (catégories C, C1 et D1) : 5 ans sans crise et sans traitement après une épilepsie, 2 ans après une première crise non provoquée. Autocars et bus (catégorie D) : pas d’admission après une épilepsie manifeste.</p>
<div class="lab">Rôle du médecin</div><p>Le médecin informe le patient et documente. Il n’y a pas d’obligation générale de signalement, mais un droit de signaler (article 15d de la loi sur la circulation routière).</p>
<div class="lab">Limite</div><p>Ces lignes directrices visent l’épilepsie en général, non les tumeurs ; leur application à une crise sur méningiome suit la mention des lésions progressives.</p>
<p class="src">Références : <a href="https://epi.ch/wp-content/uploads/2026/01/Fahreignung-mit-Referenzen-D.pdf" target="_blank" rel="noopener">Arnold et coll., Ligue suisse contre l’épilepsie, Swiss Medical Forum 2019</a>.</p></template>
<template data-pop="c70-profiles" data-title="PROFILES : situations de départ rattachées à C70">
<p>Dans le registre du projet, C70 et ses sous-codes sont rattachés aux situations de départ 159 (« abnormal histology, cytology and molecular genetic test ») et 227 (« shared assessment of risks and protective factors for frequent life-compromising [conditions] »). Les situations cliniques apparentées de la même liste sont 101 (céphalées), 103 (parésie, paralysie), 105 (secousses, convulsions) et 219 (crises).</p>
<div class="lab">Limite</div><p>La correspondance avec C70 est pédagogique et non officielle ; le rattachement des situations cliniques à C70 est une inférence.</p>
<p class="src">Références : objectifs PROFILES 2017, liste des situations de départ (table du dépôt dérivée de la brochure officielle).</p></template>
