<template data-pop="c70-chirurgie" data-title="Chirurgie : bénéfice, morbidité et rattrapage">
<div class="lab">Principe</div><p>La chirurgie est le traitement principal. Le bénéfice de l’étendue de résection est incertain dans le grade 3, et une chirurgie excessive entraîne une morbidité majeure.</p>
<div class="lab">Chiffres</div><p>Complications : 41 % (26 sur 63) dans une série, dont 60 % de majeures. Événements thromboemboliques veineux : 7 % sur 581 patients. Mortalité à 30 jours : 11,8 % dans une série de 51 patients. Chirurgie de rattrapage à la première récidive : survie médiane de 53 mois contre 25 sans chirurgie ; environ trois interventions en moyenne, sans preuve de bénéfice au-delà de deux.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-radiotherapie" data-title="Radiothérapie : doses et essais">
<div class="lab">Principe</div><p>La radiothérapie postopératoire est le standard après exérèse totale comme subtotale. Les doses historiques sont de 54 à 60 Gy en fractions de 1,8 à 2,0 Gy ; les protocoles récents emploient 60 Gy en 30 fractions. L’essai EORTC 22042-26042 ajoute un complément de 10 Gy après exérèse subtotale. Le volume cible comprend le lit opératoire et 1 à 2 cm de dure-mère.</p>
<div class="lab">Preuves</div><p>Dans l’essai RTOG 0539 (groupe à haut risque incluant le grade 3, 53 patients, 60 Gy en 30 fractions), la survie sans progression à 3 ans est de 58,8 %, le contrôle local de 68,9 % et la survie globale de 78,6 %. Les effets indésirables atteignent environ 40 %, avec un décès lié à une nécrose. Une méta-analyse de 21 études associe la radiothérapie postopératoire à environ deux ans de survie en plus (60 contre 36 mois), avec une preuve de très faible qualité.</p>
<div class="lab">Limites</div><p>Les protons et les ions carbone sont expérimentaux. Les groupes d’essai incluent plusieurs grades.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-simpson" data-title="Classification de Simpson">
<p>Elle décrit l’étendue de l’exérèse. Les grades 0 à III correspondent à une exérèse totale macroscopique, les grades IV et V à une exérèse subtotale. Un grade 0, avec une marge durale de 2 à 3 cm, est proposé. Les essais définissent souvent l’exérèse totale comme l’absence de tumeur solide résiduelle. L’objectif de l’EANO pour le grade 3 est le grade I de Simpson, si l’intervention est sûre (classe 3, niveau B). Pour le grade 2, la radiothérapie est recommandée après Simpson IV–V ; après Simpson I–III, la question n’est pas résolue.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-radiochirurgie" data-title="Radiochirurgie">
<p>Pour les tumeurs de 3 cm au plus, le contrôle est comparable à une exérèse de grade I de Simpson, mais ces données concernent surtout le grade 1. La dose dépasse 13 Gy ; la radiothérapie stéréotaxique hypofractionnée utilise 2 à 5 fractions de 4 à 10 Gy (18 à 25 Gy). Les tumeurs secondaires après radiochirurgie surviennent à environ 6,8 pour 100 000 patient-années.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-systemique" data-title="Traitements systémiques : résultats par molécule">
<p>Aucun standard n’existe. Résultats rapportés (séries restreintes) : bévacizumab (grade 3) survie sans progression à six mois 46 %, survie globale 12,4 mois ; sunitinib 42 % ; évérolimus avec octréotide 55 % ; pembrolizumab 48 % ; nivolumab 42,4 % ; pasiréotide 17 % ; mifépristone négatif en phase 3 ; radiothérapie interne vectorisée (grade 3, 19 patients) 0 %. Pour les grades 2 et 3 ensemble, la survie sans progression à six mois varie de 0 à 64 % et la survie globale médiane de 6 à 33 mois. Les inhibiteurs multikinases anti-VEGFR et le bévacizumab ne se discutent qu’en l’absence d’option locale (classe 3, niveau C).</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/27078728/" target="_blank" rel="noopener">Praxis 2016 (résumé)</a>.</p></template>
<template data-pop="c70-rano" data-title="Critères RANO : évaluation de la réponse">
<p>Imagerie tridimensionnelle T1 injectée, coupes de 1,5 mm au plus. Réponse complète : aucune lésion rehaussée pendant au moins 8 semaines.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-recidive" data-title="Récidive : chiffres contradictoires">
<p>La revue rapporte une récidive d’environ 50 % à 2 ou 3 ans quelle que soit l’étendue de la résection, ailleurs plus de 90 %, et 72 à 94 % à 5 ans après exérèse totale. Ces chiffres sont contradictoires dans la source et présentés tels quels. La source ne réconcilie pas ces écarts.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-spinal" data-title="Forme rachidienne">
<p>Beaucoup plus rare. La chirurgie est le traitement de choix (Simpson I–II), à tenter même chez le sujet âgé ; elle décomprime la moelle. La récidive est de 1,3 à 14,7 % dans des séries tous grades. Dans un registre américain (10 458 patients, 268 irradiés), la radiothérapie est associée à une mortalité plus basse seulement dans le sous-groupe borderline ou malin.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a>.</p></template>
<template data-pop="c70-enfant" data-title="Enfant">
<p>Le méningiome malin est exceptionnel chez l’enfant, et la survie est plus courte. La mise à jour cIMPACT-NOW 8 ne s’applique pas à l’enfant.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11812049/" target="_blank" rel="noopener">cIMPACT-NOW 8</a>.</p></template>
<template data-pop="c70-avastin" data-title="Bévacizumab (Avastin®) : monographie">
<div class="lab">Statut en Suisse</div><p>L’information professionnelle (mise à jour mai 2026) autorise le bévacizumab en monothérapie dans le glioblastome récidivant, à 10 mg/kg toutes les 2 semaines. Aucune indication n’existe pour le méningiome : son usage y est hors étiquette.</p>
<div class="lab">Mécanisme et preuves</div><p>Anticorps dirigé contre le facteur de croissance de l’endothélium vasculaire, il limite la néovascularisation tumorale. Dans le grade 3, la survie sans progression à six mois est de 46 % et la survie globale de 12,4 mois dans une série ; la preuve est de faible qualité.</p>
<div class="lab">Effets indésirables et surveillance</div><p>Complications de cicatrisation, dont une déhiscence de craniotomie avec fuite de liquide céphalorachidien (3,6 % en monothérapie, étude AVF3708g), et hémorragies du système nerveux central. La surveillance porte sur la cicatrisation et les signes hémorragiques. Les autres contre-indications n’ont pas été extraites.</p>
<p class="src">Références : information professionnelle suisse d’Avastin®, Swissmedic (AIPS), mai 2026 ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="c70-trabectedine" data-title="Trabectédine : essai EORTC 1320">
<p>Dans l’essai EORTC 1320, la trabectédine n’est pas supérieure au choix du médecin. Elle n’est donc pas une option établie. Les posologies et l’information professionnelle suisse n’ont pas été lues.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8563316/" target="_blank" rel="noopener">EANO 2021</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC9562197/" target="_blank" rel="noopener">Di Nunno et coll. 2022</a>.</p></template>
<template data-pop="pareto-c70-examens" data-title="Pareto — Examens">
<p class="ratio" data-cover="c70-e-1,c70-e-2,c70-e-3,c70-e-4,c70-e-5"></p><ul><li>IRM puis histologie intégrée ; l’imagerie ne donne jamais le grade.</li><li>Seuil de grade 3 : 12,5 mitoses par mm², comptées sur 1,6 mm².</li><li>TERT muté ou CDKN2A/B homozygote supprimé suffit ; l’hémizygote ne suffit pas.</li><li>Une première ponction lombaire négative n’exclut pas une métastase leptoméningée.</li></ul></template>
<template data-pop="pareto-c70-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="c70-s-anat-cours"></p><ul><li>Le méningiome naît des méninges et comprime avant d’infiltrer.</li><li>L’invasion cérébrale exige le franchissement d’une pie-mère intacte.</li></ul></template>
<template data-pop="pareto-c70-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="c70-s-histo-cours"></p><ul><li>20 mitoses sur 10 champs de 0,16 mm² font 12,5 par mm².</li><li>Une anaplasie franche suffit au grade 3.</li></ul></template>
<template data-pop="pareto-c70-genet" data-title="Pareto — Génétique">
<p class="ratio" data-cover="c70-s-genet-cours"></p><ul><li>TERT et CDKN2A/B homozygote définissent le grade 3 quelle que soit la morphologie.</li><li>NF2 prédispose aux grades 2 et 3 et aux tumeurs multiples.</li></ul></template>
<template data-pop="pareto-c70-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="c70-p-1,c70-p-2,c70-p-3,c70-p-4"></p><ul><li>Aucun traitement systémique standard ; aucune indication suisse pour le méningiome.</li><li>Bévacizumab : hors étiquette, risque de cicatrisation et d’hémorragie.</li><li>Cyprotérone : contre-indiquée si méningiome.</li></ul></template>
