<section class="ilot" id="g07-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Dans cette <b>vignette fictive</b>, un homme de 37 ans, originaire d’un pays où la tuberculose est fréquente, consulte pour des céphalées qui s’aggravent depuis plusieurs semaines. Il vient de présenter une première crise convulsive. Le scanner avec produit de contraste montre une lésion de masse intracrânienne. Aucune de ces valeurs n’est un cas réel ; elles servent à poser les trois décisions de la leçon.</p>
<p>La première décision est de sécuriser la suite du bilan : une <button class="w" data-k="g07-ponction-prealable">lésion de masse</button> impose de réfléchir à l’imagerie avant toute ponction lombaire, sans pour autant retarder un traitement urgent. La deuxième est d’identifier l’agent, car quatre maladies différentes peuvent produire une lésion focale du névraxe et leurs traitements n’ont rien en commun. La troisième est de prévoir les complications propres à l’agent, par exemple la <button class="w" data-k="g07-paradoxale">réaction paradoxale</button> de la tuberculose ou la myélite bilharzienne.</p>
<p>Cette leçon enseigne donc la catégorie <button class="w" data-k="g07-asterisque">G07*</button> comme une porte d’entrée clinique : l’abcès ou le granulome du cerveau ou de la moelle, vus comme la <b>localisation neurologique d’une maladie infectieuse classée ailleurs</b>. Elle traite successivement la tuberculose focale (tuberculome et abcès tuberculeux), le granulome bilharzien, l’abcès amibien et l’abcès gonococcique. Elle ne traite pas l’abcès pyogène ordinaire, qui relève de la catégorie G06.</p>
<div class="key"><b>À retenir.</b> Devant une lésion focale du névraxe chez un patient exposé, trois questions se posent ensemble : la lésion est-elle une masse dangereuse, quel agent la produit-il, et quelle complication l’agent annonce-t-il ? Le code de classification vient après, jamais avant.</div>
</section>
<section class="ilot" id="g07-1"><h2><span class="n">1</span>Définition et périmètre</h2>
<p>La catégorie G07* de la CIM-10-GM 2024 regroupe l’« abcès et granulome intracrâniens et intrarachidiens au cours d’affections classées ailleurs ». Son astérisque signale une <button class="w" data-k="g07-asterisque">manifestation</button> : le code décrit la localisation neurologique, tandis que la maladie infectieuse en cause porte un code à croix (†) enregistré par ailleurs (BfArM, CIM-10-GM 2024 ; registre OFS). La catégorie n’a ni sous-catégorie à quatrième caractère ni exclusion dans cette version.</p>
<p>Le tableau suivant énumère les six inclusions de la catégorie avec leur code à croix. Il montre que quatre maladies seulement se cachent derrière six libellés : la tuberculose fournit trois d’entre eux.</p>
<table class="t"><thead><tr><th>Inclusion de G07*</th><th>Code à croix</th><th>Maladie causale</th></tr></thead><tbody><tr><td>Abcès cérébral amibien</td><td>A06.6†</td><td>Amibiase (Entamoeba histolytica)</td></tr><tr><td>Abcès cérébral gonococcique</td><td>A54.8†</td><td>Infection gonococcique</td></tr><tr><td>Abcès cérébral tuberculeux</td><td>A17.8†</td><td>Tuberculose du système nerveux central</td></tr><tr><td>Granulome cérébral bilharzien (schistosomiase)</td><td>B65.-†</td><td>Schistosomiase</td></tr><tr><td>Tuberculome cérébral</td><td>A17.8†</td><td>Tuberculose du système nerveux central</td></tr><tr><td>Tuberculome méningé</td><td>A17.1†</td><td>Tuberculose méningée</td></tr></tbody></table>
<p>Une note de codage distingue G07 de G06. Pour G06, la classification demande un code B95–B98 additionnel afin de préciser l’agent ; pour G07, l’agent est déjà porté par le code † lui-même. En pratique, un abcès cérébral à germe pyogène ordinaire se classe en G06, et un abcès dont l’agent est la mycobactérie, l’amibe, le gonocoque ou le schistosome se classe en G07*. Les libellés français officiels des codes † (A06.6, A17.1, A17.8, A54.8, B65.-) n’ont pas été relus dans le fichier de l’OFS : seul le libellé de G07 est repris du registre.</p>
<h3>Les lésions focales de la tuberculose</h3>
<p>La neurotuberculose comprend trois formes : la méningite tuberculeuse, la tuberculose spinale et les <button class="w" data-k="g07-tuberculome">tuberculomes</button>. Les lésions focales intracrâniennes sont le tuberculome et l’<button class="w" data-k="g07-abces-tb">abcès tuberculeux</button>. Elles peuvent exister avec ou sans méningite. Le tuberculome peut siéger n’importe où dans la boîte crânienne, dans le parenchyme comme à la surface ventriculaire. La méningite reste la présentation la plus fréquente de la tuberculose du système nerveux central ; cette fréquence explique pourquoi les recommandations les plus récentes portent sur la méningite et traitent les lésions focales comme une extension du même problème.</p>
<div class="trap"><span class="k">Piège</span> Le code ne remplace pas la preuve. Ranger une lésion en G07* suppose que l’agent a été établi ou, à défaut, que le diagnostic de la maladie causale est retenu ; devant une masse non étiquetée, le raisonnement reste étiologique et non nosologique.</div>
<div class="key"><b>À retenir.</b> G07* est une catégorie de manifestation : elle ne se code jamais seule, et son contenu se comprend en quatre maladies causales — tuberculose, schistosomiase, amibiase, infection gonococcique.</div>
</section>
<section class="ilot" id="g07-2"><h2><span class="n">2</span>Fréquence et populations</h2>
<p>Aucune statistique suisse ne concerne spécifiquement G07*. Les chiffres disponibles décrivent la tuberculose en général, ce qui donne le cadre dans lequel apparaissent ses localisations neurologiques, puis la neurotuberculose dans le monde, enfin les rares cas de schistosomiase et d’amibiase importés.</p>
<table class="t"><thead><tr><th>Population ou source</th><th>Donnée lue</th><th>Portée</th></tr></thead><tbody><tr><td>Suisse, 2022 (guide de l’OFSP, V1.2024)</td><td>365 cas déclarés, incidence 4,16 pour 100 000 ; 73 % des personnes atteintes d’origine non suisse ; tuberculose multirésistante : 1 % des cas testés</td><td>Toute tuberculose</td></tr><tr><td>Suisse, 2020 (même guide)</td><td>94 % des cas avaient une atteinte pulmonaire</td><td>Toute tuberculose</td></tr><tr><td>Monde (méta-analyse, J Neurol 2022)</td><td>Prévalence de la tuberculose du système nerveux central voisine de 2 pour 100 000 ; 4,55 % des tuberculoses ; mortalité de la méningite tuberculeuse jusqu’à 42,12 % chez les patients hospitalisés</td><td>Système nerveux central</td></tr><tr><td>Série parisienne de 23 tuberculomes (2010)</td><td>22 patients sur 23 originaires de pays de forte prévalence ; âge moyen 37,3 ans ; méningite prouvée chez 43,5 % ; tuberculome prouvé par biopsie chez 17,4 %</td><td>Tuberculomes</td></tr></tbody></table>
<p>Ces données se lisent avec prudence. Le guide suisse décrit la tuberculose entière, dont la forme pulmonaire domine largement ; la localisation neurologique est donc rare à l’échelle du pays. La méta-analyse montre que la prévalence de l’atteinte du système nerveux central varie avec la charge tuberculeuse du pays, l’indice de développement humain et la prévalence du VIH. Le guide suisse précise que les formes disséminées et méningées s’observent surtout chez les personnes immunodéprimées, les très jeunes et les très âgées. Les tuberculomes et la méningite touchent surtout les enfants et les personnes immunodéprimées.</p>
<p>Pour les trois autres agents, les sources lues ne donnent pas de fréquence chiffrée. La neuroschistosomiase est <b>sous-diagnostiquée</b> et de plus en plus rapportée chez les touristes et les migrants. L’abcès cérébral amibien survient chez un faible pourcentage des patients atteints d’abcès hépatique amibien. La bactériémie gonococcique est rare. Aucun de ces chiffres n’est documenté pour la Suisse, ce qui est une lacune de la littérature lue.</p>
<div class="key"><b>À retenir.</b> En Suisse, penser à une lésion focale tuberculeuse chez une personne née dans un pays de forte prévalence ou immunodéprimée ; penser à la schistosomiase chez le voyageur ou le migrant exposé en zone d’endémie.</div>

</section>
<section class="ilot" id="g07-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Les quatre agents atteignent le névraxe par des voies différentes et y produisent des lésions focales de nature différente. Le raisonnement part du normal : le système nerveux central est séparé du sang par la <button class="w" data-k="g07-bhe">barrière hémato-encéphalique</button>, qui limite la pénétration de nombreux médicaments. Une infection focale doit donc d’abord franchir cette frontière par voie sanguine, puis déclencher une réaction immunitaire locale ; cette réaction fait à la fois la lésion et la gravité.</p>
<h3>Tuberculose : dissémination, granulome et inflammation</h3>
<p>La tuberculose atteint les organes extrapulmonaires par voie lymphatique ou hématogène. Dans le système nerveux central, l’<button class="w" data-k="g07-inflammation-tb">inflammation</button> joue un rôle central dans la gravité, et les lésions tissulaires sont aussi vasculaires et hypoxiques. La compréhension de la physiopathologie repose sur des études de référence de 1933 et sur une classification des types de granulomes, qui tient compte de la charge bacillaire et de la diversité des réponses immunitaires. La description histologique précise du tuberculome n’a pas été lue dans une source du dossier : elle n’est pas reprise ici.</p>
<p>Une conséquence clinique découle directement de cette inflammation : la <button class="w" data-k="g07-paradoxale">réaction paradoxale</button>. Chez environ 20 % des patients atteints de méningite tuberculeuse, et plus de 30 % de ceux qui vivent avec le VIH, des complications inflammatoires intracérébrales apparaissent malgré un traitement efficace. Elles surviennent typiquement entre le 20e et le 60e jour, parfois des mois plus tard. Dans une série française de réactions paradoxales graves, elles apparaissaient après une médiane de six semaines et consistaient surtout en tuberculomes. Chez une personne qui débute un traitement antirétroviral, elles peuvent remplir les critères d’un syndrome inflammatoire de restauration immunitaire (IRIS).</p>
<h3>Schistosomiase : œufs, hypersensibilité retardée et migration aberrante</h3>
<p>Autour des œufs déposés dans le névraxe, l’organisme déclenche une réaction d’<button class="w" data-k="g07-schisto-meca">hypersensibilité retardée</button> qui forme un granulome périovulaire. Les vers adultes peuvent aussi migrer de façon aberrante par le plexus veineux vertébral, ce qui explique l’atteinte de la moelle. L’espèce oriente la topographie : Schistosoma mansoni et S. haematobium donnent surtout une myélopathie, S. japonicum surtout une atteinte encéphalique.</p>
<h3>Amibiase : du côlon au foie, puis au cerveau</h3>
<p>Entamoeba histolytica, pathogène, se distingue d’E. dispar, commensal. Les trophozoïtes lysent les tissus, envahissent la muqueuse colique, puis gagnent le foie par la circulation portale. L’<button class="w" data-k="g07-amibe-meca">abcès cérébral amibien</button> est une localisation tardive : il survient chez un faible pourcentage des patients porteurs d’un abcès hépatique, souvent après une amélioration de l’abcès hépatique traité.</p>
<h3>Infection gonococcique : bactériémie rare</h3>
<p>La bactériémie gonococcique est rare ; elle se manifeste par des lésions cutanées, de la fièvre, des arthralgies, une arthrite et une ténosynovite. Aucune source lue ne décrit la physiopathologie de l’abcès cérébral gonococcique : la leçon s’appuie sur la seule voie documentée, la bactériémie, sans extrapoler.</p>
<div class="two"><div class="card"><h4>Ce qui est établi</h4><p>Voie hématogène ou lymphatique de la tuberculose ; granulome périovulaire de la schistosomiase ; voie portale foie → cerveau de l’amibiase ; bactériémie gonococcique rare.</p></div><div class="card"><h4>Ce qui reste une lacune</h4><p>Histologie du tuberculome (caséum, foyer de Rich) ; mécanisme précis de l’abcès gonococcique cérébral ; aucune source suisse ou européenne spécifique aux lésions focales.</p></div></div>
<div class="key"><b>À retenir.</b> La lésion focale n’est pas seulement l’agent : c’est la réaction de l’hôte autour de lui. Cette réaction explique à la fois l’effet de masse, les convulsions et les complications tardives sous traitement.</div>
</section>
<section class="ilot" id="g07-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Le terrain et l’exposition orientent le diagnostic avant tout examen. Le tableau croise chaque agent avec les circonstances qui l’évoquent, telles que les sources lues les décrivent.</p>
<table class="t"><thead><tr><th>Agent</th><th>Terrain et exposition évocateurs</th><th>Remarque</th></tr></thead><tbody><tr><td>Mycobacterium tuberculosis</td><td>Origine d’un pays de forte prévalence ; immunodépression ; infection par le VIH ; très jeune ou très âgé</td><td>La méningite coexiste ou non avec la lésion focale</td></tr><tr><td>Schistosoma</td><td>Séjour en zone d’endémie avec baignade dans un lac ; touristes et migrants</td><td>L’atteinte peut survenir à toute phase de l’infection</td></tr><tr><td>Entamoeba histolytica</td><td>Abcès hépatique amibien traité ou en cours ; homme jeune (environ 30 ans, cas type)</td><td>Signes neurologiques après une amélioration de l’abcès hépatique</td></tr><tr><td>Neisseria gonorrhoeae</td><td>Infection gonococcique disséminée</td><td>Aucune source lue ne précise le terrain de l’abcès cérébral</td></tr></tbody></table>
<p>Le guide suisse insiste sur le fait que les formes disséminées et méningées touchent surtout les personnes immunodéprimées. Une série parisienne confirme le poids de l’origine : sur 23 patients porteurs de tuberculomes, 22 venaient de pays de forte prévalence. Pour la schistosomiase, un exemple suisse montre que des voyageurs exposés dans un lac près de Banfora, au Burkina Faso, ont développé une maladie après une incubation de quatre à six semaines, avec éosinophilie chez 10 patients sur 11 ; un voyageur non traité a présenté une myélite schistosomienne plus d’un an après l’exposition.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Écarter la schistosomiase parce que le séjour remonte à plusieurs mois ou années. L’atteinte neurologique peut survenir à toute phase de l’infection, y compris longtemps après l’exposition.</div>
<div class="key"><b>À retenir.</b> L’interrogatoire sur l’origine, les voyages, les baignades en eau douce, le statut VIH et un antécédent d’abcès hépatique est l’examen le moins coûteux et le plus orientant.</div>
<button class="pareto-btn ui" data-k="pareto-g07-mecanismes">▲ Loi de Pareto — Physiopathologie, causes et terrain</button>
</section>
<section class="ilot" id="g07-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’anamnèse cherche d’abord le mode d’installation, ensuite l’agent probable. Dans la tuberculose, l’évolution est insidieuse et les signes sont non spécifiques ; la tuberculose évolue cliniquement de façon lente. Des céphalées, des convulsions et des signes d’<button class="w" data-k="g07-htic">hypertension intracrânienne</button> traduisent l’effet de masse du tuberculome ou de l’abcès. Les <button class="w" data-k="g07-convulsions">convulsions</button> ont plusieurs mécanismes : hypertension intracrânienne, tuberculomes et ischémie.</p>
<div class="two"><div class="card"><h4>Forme tuberculeuse</h4><p>Évolution lente ; céphalées, convulsions, signes d’hypertension intracrânienne ; méningite associée ou non. Chercher une tuberculose pulmonaire ou d’un autre site.</p></div><div class="card"><h4>Forme bilharzienne encéphalique</h4><p>Convulsions et céphalées fréquentes ; plus rarement déficits focaux, atteinte des nerfs crâniens, hypertension intracrânienne ; formes pseudo-tumorales ou cérébelleuses avec hydrocéphalie.</p></div></div>
<div class="two"><div class="card"><h4>Forme bilharzienne spinale</h4><p>Myélite aiguë ou myéloradiculopathie, avec paraparésie ou radiculopathie ; elle peut survenir plus d’un an après l’exposition.</p></div><div class="card"><h4>Forme amibienne</h4><p>Céphalées, vomissements, troubles de la conscience ; signes méningés, paralysie faciale, paralysie motrice, convulsions ; souvent après amélioration d’un abcès hépatique traité.</p></div></div>
<p>Les antécédents à demander sont : pays d’origine et séjours, exposition lacustre, statut VIH ou autre immunodépression, abcès hépatique, tuberculose connue, symptômes cutanés ou articulaires évoquant une infection gonococcique disséminée (lésions cutanées, fièvre, arthralgies, arthrite). L’hyponatrémie est un <button class="w" data-k="g07-hyponatremie">piège évolutif</button> de la neurotuberculose : elle peut provoquer un œdème cérébral, une hypertension intracrânienne et un infarctus, ce qui justifie de la rechercher même si elle n’est pas rapportée par le patient.</p>
<div class="trap"><span class="k">Piège</span> Attendre un tableau fébrile franc. La tuberculose focale est insidieuse, et une lésion de masse peut se révéler seule par une crise convulsive.</div>
<div class="key"><b>À retenir.</b> Quatre formes cliniques, un fil conducteur : une lésion focale qui comprime ou irrite le tissu nerveux, avec un contexte d’exposition qui désigne l’agent.</div>
</section>
<section class="ilot" id="g07-6"><h2><span class="n">6</span>Examen clinique</h2>
<p>L’examen suit l’ordre habituel : état général, signes vitaux, puis examen neurologique ciblé, enfin recherche d’un foyer extraneurologique. Les sources lues décrivent ce qu’il faut chercher, non la technique de chaque geste ; elles ne détaillent par exemple pas l’examen du fond d’œil, qui n’est donc pas développé ici.</p>
<div class="two"><div class="card"><h4>État général et signes vitaux</h4><p>Fièvre, lésions cutanées, arthralgies, arthrite et ténosynovite orientent vers une infection gonococcique disséminée. L’état de conscience est évalué d’emblée : un trouble de la conscience figure parmi les signes de l’abcès amibien.</p></div><div class="card"><h4>Examen cranio-cérébral</h4><p>Recherche de signes méningés, d’une paralysie faciale ou d’une autre atteinte des nerfs crâniens, d’un déficit moteur ou focal, d’une crise convulsive, et de signes d’<button class="w" data-k="g07-htic">hypertension intracrânienne</button>.</p></div></div>
<div class="two"><div class="card"><h4>Examen médullaire</h4><p>Paraparésie, radiculopathie, signes de myélite : ils doivent faire évoquer la schistosomiase chez un patient exposé, après élimination des autres causes.</p></div><div class="card"><h4>Foyers associés</h4><p>Poumon (premier échantillon d’expectoration analysé immédiatement par amplification des acides nucléiques) ; foie en cas d’antécédent d’abcès amibien ; peau et articulations.</p></div></div>
<p>Aucun signe n’est spécifique de l’agent. L’examen sert à localiser (cerveau, tronc, moelle), à mesurer la gravité (conscience, hypertension intracrânienne) et à orienter l’imagerie. Il guide aussi la prudence avant une ponction lombaire : un signe d’hypertension intracrânienne ou de masse impose l’imagerie d’abord.</p>
<div class="key"><b>À retenir.</b> L’examen ne désigne pas l’agent ; il localise la lésion, mesure l’urgence et oriente vers le foyer extraneurologique le plus accessible à la preuve.</div>
<button class="pareto-btn ui" data-k="pareto-g07-clinique">▲ Loi de Pareto — Anamnèse et examen clinique</button>
</section>
