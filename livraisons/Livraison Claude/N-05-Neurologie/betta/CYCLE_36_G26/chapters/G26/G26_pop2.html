<template data-pop="g26-tiapride" data-title="Tiapride (Tiapridal®)">
<div class="lab">Définition</div><p data-evidence="G26-C0214" data-src="S3,S16">Antagoniste des récepteurs D2/D3, proposé en première intention par la directive allemande pour la chorée en raison d’un meilleur profil psychique et extrapyramidal.</p><div class="lab">Indication suisse</div><p data-evidence="G26-C0215" data-src="S16">Chorée de Huntington sévère de l’adulte et tics sévères (information professionnelle de novembre 2022). Huntington : jusqu’à 1200 mg/j au début, entretien 300–600 mg/j.</p><div class="lab">Contre-indications</div><p data-evidence="G26-C0216" data-src="S16">Lévodopa, maladie de Parkinson, tumeur prolactino-dépendante.</p><div class="lab">Limite</div><p data-evidence="G26-C0217" data-src="S3">Aucune étude comparative n’existe ; dans une chorée secondaire, l’usage est hors indication.</p></template>
<template data-pop="g26-tetrabenazine" data-title="Tétrabénazine (Xenazine®)">
<div class="lab">Définition</div><p data-evidence="G26-C0218" data-src="S3,S15">Inhibiteur de VMAT2, proposé si le tiapride est insuffisant, en monothérapie ou en association.</p><div class="lab">Indication et posologie suisses</div><p data-evidence="G26-C0219" data-src="S15">Mouvements hyperkinétiques de la maladie de Huntington. 12,5 mg × 3/j, puis +12,5 mg/j tous les 3–4 jours jusqu’à 100 mg/j. Inefficace après 7 jours à dose maximale : bénéfice improbable.</p><div class="lab">Contre-indications et interactions</div><p data-evidence="G26-C0220" data-src="S15">Dépression, syndrome parkinsonien, insuffisance hépatique modérée à sévère, IMAO (intervalle d’au moins 14 jours), réserpine, allaitement. Génotypage CYP2D6 avant toute dose supérieure à 50 mg/j. Allongement du QTc d’environ 8 ms.</p><div class="lab">Effets indésirables</div><p data-evidence="G26-C0221" data-src="S15">Très fréquents : dépression, somnolence, parkinsonisme, akathisie. Le syndrome malin des neuroleptiques est rare.</p></template>
<template data-pop="g26-haldol" data-title="Halopéridol (Haldol®)">
<div class="lab">Définition</div><p data-evidence="G26-C0222" data-src="S17">Antipsychotique oral ; l’information professionnelle de novembre 2024 ne comporte pas d’indication pour une chorée secondaire.</p><div class="lab">Application</div><p data-evidence="G26-C0223" data-src="S17,S7">Le Huntington léger à modéré n’est envisagé qu’en cas d’échec d’autres traitements. Dans la striatopathie diabétique, l’halopéridol est l’antichoréique le plus utilisé de la série publiée.</p><div class="lab">Limite</div><p data-evidence="G26-C0224" data-src="S17">Contre-indiqué en cas de syndrome parkinsonien ou de QTc long.</p></template>
<template data-pop="g26-dpen" data-title="D-pénicillamine">
<div class="lab">Définition</div><p data-evidence="G26-C0225" data-src="S4">Chélateur du cuivre utilisé en initiation et en entretien de la maladie de Wilson.</p><div class="lab">Posologie de la directive</div><p data-evidence="G26-C0226" data-src="S4">150 mg/j au départ ; dans les formes neurologiques, paliers toutes les 1 à 2 semaines ; suspendre l’escalade en cas d’aggravation ; entretien 600–1500 mg/j (maximum 1800) ; pyridoxine 20 (–40) mg/j ; cuprurie sous traitement supérieure à 500 µg/24 h.</p><div class="lab">Limite</div><p data-evidence="G26-C0227" data-src="S4">Risque tératogène d’environ 5 % ; l’information professionnelle suisse n’a pas été lue.</p></template>
<template data-pop="g26-cuprior" data-title="Trientine (Cuprior®)">
<div class="lab">Définition</div><p data-evidence="G26-C0228" data-src="S4,S18">En Allemagne, en Autriche et en Suisse, autorisation en deuxième ligne après intolérance à la D-pénicillamine.</p><div class="lab">Posologie suisse</div><p data-evidence="G26-C0229" data-src="S18">450–975 mg/j de trientine base en 2 à 4 prises ; dans les formes neurologiques, augmentation lente avec suivi toutes les 2 à 3 semaines.</p><div class="lab">Mise en garde</div><p data-evidence="G26-C0230" data-src="S18">Aggravation neurologique possible en début de chélation par excès de cuivre libre ; suivi au moins deux fois par an.</p><div class="lab">Limite</div><p data-evidence="G26-C0231" data-src="S18">Âge d’utilisation : 5 ans et plus ; le statut de commercialisation exact de cette version n’a pas été vérifié.</p></template>
<template data-pop="g26-zinc" data-title="Zinc">
<div class="lab">Définition</div><p data-evidence="G26-C0232" data-src="S4">Traitement d’entretien qui ne chélate pas mais limite l’accumulation du cuivre.</p><div class="lab">Posologie de la directive</div><p data-evidence="G26-C0233" data-src="S4">3 × 50 mg de zinc élément par jour ; la répartition en trois prises est essentielle.</p><div class="lab">Indication</div><p data-evidence="G26-C0234" data-src="S4">Sujets présymptomatiques et entretien des patients stables.</p><div class="lab">Limite</div><p data-evidence="G26-C0235" data-src="S4">L’information professionnelle suisse du zinc n’a pas été lue.</p></template>
<template data-pop="pareto-g26-etiologie" data-title="Pareto — Causes et fréquence">
<p class="ratio" data-cover="g26-2,g26-3"></p><ul><li data-evidence="G26-C0236" data-src="S3">Presque toutes les familles de maladies peuvent produire une chorée ; on les classe par réversibilité.</li><li data-evidence="G26-C0237" data-src="S9">Une chorée asymétrique est le plus souvent acquise, d’abord hyperglycémique.</li><li data-evidence="G26-C0238" data-src="S7,S8">Le profil de la striatopathie est une femme de près de 70 ans, diabétique de type 2 déséquilibré.</li></ul></template>
<template data-pop="pareto-g26-mecanismes" data-title="Pareto — Mécanismes">
<p class="ratio" data-cover="g26-4"></p><ul><li data-evidence="G26-C0239" data-src="S8">L’hyperglycémie désinhiberait les noyaux gris via le GABA, hypothèse qui n’explique pas les cas persistants.</li><li data-evidence="G26-C0240" data-src="S4">Le Wilson résulte d’un défaut d’ATP7B : excrétion biliaire du cuivre et céruloplasmine altérées.</li><li data-evidence="G26-C0241" data-src="S6">Les anticorps de surface répondent bien à l’immunothérapie, les onconeuronaux évoluent de façon progressive.</li></ul></template>
<template data-pop="pareto-g26-clinique" data-title="Pareto — Anamnèse et examen">
<p class="ratio" data-cover="g26-5,g26-6"></p><ul><li data-evidence="G26-C0242" data-src="S3">Antécédents familiaux, médicaments et maladies associées sont systématiquement recherchés.</li><li data-evidence="G26-C0243" data-src="S3,S9">La latéralité d’une chorée oriente vers une cause acquise.</li><li data-evidence="G26-C0244" data-src="S4">L’anneau de Kayser-Fleischer est quasi pathognomonique, mais son absence n’exclut pas le Wilson.</li></ul></template>
<template data-pop="pareto-g26-diagnostic" data-title="Pareto — Diagnostic">
<p class="ratio" data-cover="g26-7"></p><ul><li data-evidence="G26-C0245" data-src="S3">Le bilan est ordonné : menace, type de mouvement, causes réversibles, IRM.</li><li data-evidence="G26-C0246" data-src="S3">Tics, akathisie, épilepsie et Huntington se discutent.</li><li data-evidence="G26-C0247" data-src="S3">Environ 8 % des Huntington n’ont pas d’antécédent familial.</li></ul></template>
<template data-pop="pareto-g26-traitement" data-title="Pareto — Prise en charge">
<p class="ratio" data-cover="g26-8,g26-9"></p><ul><li data-evidence="G26-C0248" data-src="S3,S6">Traiter la cause ; les antichoréiques complètent.</li><li data-evidence="G26-C0249" data-src="S4">Dans le Wilson, chélateur à montée lente pour éviter l’aggravation paradoxale.</li><li data-evidence="G26-C0250" data-src="S15,S16,S17">Les antichoréiques sont hors indication suisse dans une chorée secondaire.</li></ul></template>
<template data-pop="pareto-g26-suivi" data-title="Pareto — Suivi">
<p class="ratio" data-cover="g26-10,g26-11"></p><ul><li data-evidence="G26-C0251" data-src="S4">Le Wilson impose une surveillance à vie : cuivre urinaire, IRM, génétique familiale.</li><li data-evidence="G26-C0252" data-src="S7">La striatopathie récidive dans 18,2 % des cas.</li><li data-evidence="G26-C0253" data-src="S4">Pendant la grossesse, le traitement du Wilson n’est jamais interrompu.</li></ul></template>
<template data-pop="pareto-g26-examens" data-title="Pareto — Examens complémentaires">
<p class="ratio" data-cover="g26-e-1,g26-e-2,g26-e-3,g26-e-4,g26-e-5"></p><ul><li data-evidence="G26-C0254" data-src="S3">Glycémie, ionogramme, thyroïde, foie et IRM forment le bilan de base.</li><li data-evidence="G26-C0255" data-src="S4">Céruloplasmine, cuivre urinaire et score de Leipzig fondent le diagnostic de Wilson.</li><li data-evidence="G26-C0256" data-src="S8">Une IRM normale n’exclut pas une striatopathie (5,2 % des cas).</li></ul></template>
<template data-pop="pareto-g26-anat" data-title="Pareto — Anatomie">
<p class="ratio" data-cover="g26-s-anat-cours"></p><ul><li data-evidence="G26-C0257" data-src="S7">Putamen et noyau caudé : striatopathie.</li><li data-evidence="G26-C0258" data-src="S4,S11">Pallidum, substance noire, noyau rouge, mésencéphale : DHCA et Wilson.</li><li data-evidence="G26-C0259" data-src="S12">Foie et shunts porto-systémiques : origine de la DHCA.</li></ul></template>
<template data-pop="pareto-g26-histo" data-title="Pareto — Histologie">
<p class="ratio" data-cover="g26-s-histo-cours"></p><ul><li data-evidence="G26-C0260" data-src="S7">Hémorragie dans quatre études anatomopathologiques sur six.</li><li data-evidence="G26-C0261" data-src="S4">Cuivre hépatique supérieur à 250 µg/g et rhodanine dans le Wilson.</li><li data-evidence="G26-C0262" data-src="S10">Aucune lésion structurelle démontrée dans la chorée hyperthyroïdienne.</li></ul></template>
<template data-pop="pareto-g26-physio" data-title="Pareto — Physiologie">
<p class="ratio" data-cover="g26-s-physio-cours"></p><ul><li data-evidence="G26-C0263" data-src="S8">Voie du GABA et noyau sous-thalamique : modèle de la striatopathie.</li><li data-evidence="G26-C0264" data-src="S10">Hypersensibilité dopaminergique nigrostriatale dans l’hyperthyroïdie.</li><li data-evidence="G26-C0265" data-src="S4">Excrétion biliaire du cuivre et céruloplasmine : voies bloquées dans le Wilson.</li></ul></template>
<template data-pop="pareto-g26-bioch" data-title="Pareto — Biochimie">
<p class="ratio" data-cover="g26-s-bioch-cours"></p><ul><li data-evidence="G26-C0266" data-src="S4">Céruloplasmine basse, cuivre libre et urinaire élevés orientent vers le Wilson.</li><li data-evidence="G26-C0267" data-src="S11">Ammoniac et manganèse expliquent la DHCA.</li><li data-evidence="G26-C0268" data-src="S4">La céruloplasmine est modifiée par la malnutrition, les œstrogènes et l’inflammation.</li></ul></template>
<template data-pop="pareto-g26-pharma" data-title="Pareto — Pharmacologie">
<p class="ratio" data-cover="g26-p-1,g26-p-2,g26-p-3,g26-p-4"></p><ul><li data-evidence="G26-C0269" data-src="S15,S16,S17">Aucun antichoréique n’a d’indication suisse pour une chorée secondaire.</li><li data-evidence="G26-C0270" data-src="S15,S16">Tiapride et tétrabénazine sont contre-indiqués en cas de parkinsonisme.</li><li data-evidence="G26-C0271" data-src="S4,S18">Wilson : D-pénicillamine, trientine en deuxième ligne, zinc d’entretien.</li></ul></template>
