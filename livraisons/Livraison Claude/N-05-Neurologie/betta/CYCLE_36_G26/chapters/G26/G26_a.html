<template id="ch-G26"><div class="chap"><div class="chap-head"><div class="code">G 26 · Neurologie · Mouvements anormaux secondaires</div><h1>Syndromes extrapyramidaux et troubles de la motricité au cours d’affections classées ailleurs</h1><span class="status">Cycle Betta 36 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des troubles du mouvement secondaires</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li data-evidence="G26-C0001"><a href="#g26-0">Question clinique</a></li><li data-evidence="G26-C0002"><a href="#g26-1">Définitions et logique de codage</a></li><li data-evidence="G26-C0003"><a href="#g26-2">Causes : classification étiologique</a></li><li data-evidence="G26-C0004"><a href="#g26-3">Fréquence et profil des patients</a></li><li data-evidence="G26-C0005"><a href="#g26-4">Physiopathologie</a></li><li data-evidence="G26-C0006"><a href="#g26-5">Anamnèse</a></li><li data-evidence="G26-C0007"><a href="#g26-6">Examen clinique</a></li><li data-evidence="G26-C0008"><a href="#g26-7">Démarche diagnostique</a></li><li data-evidence="G26-C0009"><a href="#g26-8">Urgences et situations à ne pas manquer</a></li><li data-evidence="G26-C0010"><a href="#g26-9">Prise en charge causale et soutien</a></li><li data-evidence="G26-C0011"><a href="#g26-10">Suivi et surveillance</a></li><li data-evidence="G26-C0012"><a href="#g26-11">Situations particulières</a></li><li data-evidence="G26-C0013"><a href="#g26-12">Cas pour s’exercer</a></li><li data-evidence="G26-C0014"><a href="#g26-13">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g26-0"><h2><span class="n">0</span>Question clinique</h2>
<p data-evidence="G26-C0015" data-src="S7,S8">Dans cette <b>vignette fictive</b>, une femme de 71 ans, atteinte d’un diabète de type 2 mal équilibré, consulte aux urgences. Depuis cinq jours, son bras et sa jambe droits sont agités de mouvements amples, irréguliers, qui s’aggravent à l’émotion et cèdent pendant le sommeil. La glycémie est à 414 mg/dl et l’hémoglobine glyquée <button class="w" data-k="g26-hba1c">HbA1c</button> à 13,1 %. Ces deux valeurs sont les moyennes de la plus grande série publiée ; elles servent ici d’illustration pédagogique et non de seuils.</p><p data-evidence="G26-C0016" data-src="S3,S9">La patiente n’a aucun antécédent familial de trouble du mouvement. Le tableau est aigu, <b>asymétrique</b> et survient dans un contexte métabolique évident. Ces trois éléments orientent vers une cause <b>acquise et potentiellement réversible</b>, qu’il faut chercher avant d’évoquer une maladie génétique ou dégénérative. La directive de la Société allemande de neurologie, approuvée par la Société suisse de neurologie, fait de cette recherche le premier temps du bilan d’une chorée sporadique.</p><div class="key" data-evidence="G26-C0017"><b>À retenir.</b> Un trouble du mouvement d’installation aiguë ou subaiguë, surtout asymétrique, appelle d’abord la recherche d’une cause acquise : métabolique, endocrinienne, auto-immune, infectieuse, structurelle ou médicamenteuse. La même démarche vaut pour tout adulte jeune avec un trouble extrapyramidal inexpliqué, chez qui la maladie de Wilson doit être éliminée.</div>
</section>
<section class="ilot" id="g26-1"><h2><span class="n">1</span>Définitions et logique de codage</h2>
<p data-evidence="G26-C0018" data-src="S1,S2">Dans la classification statistique des maladies, <b>G26</b> porte un astérisque. Ce signe désigne un code de <b>manifestation</b> : il ne s’emploie jamais seul, mais accompagne le code (†) de la maladie causale, que l’on enregistre en premier. La CIM-10-GM 2024 ne liste sous <button class="w" data-k="g26-codage">G26*</button> ni inclusion, ni exclusion, ni sous-code. La catégorie est donc un réceptacle : le travail du clinicien consiste à identifier la maladie de fond.</p><p data-evidence="G26-C0019" data-src="S1">Deux codes voisins évitent les confusions. Le parkinsonisme secondaire d’origine médicamenteuse ou autre relève de <b>G21</b> ; le parkinsonisme au cours d’une maladie classée ailleurs, par exemple la syphilis, relève de <b>G22*</b>. Par déduction de la structure du bloc, les <b>autres</b> troubles du mouvement observés au cours d’une maladie classée ailleurs (chorée, ballisme, dystonie, myoclonies, tremblement) trouvent leur place sous G26*. Le détail est expliqué dans la fenêtre <button class="w" data-k="g26-g22">G21, G22* et G26*</button>.</p><p data-evidence="G26-C0020" data-src="S6">Quatre syndromes cliniques sont à distinguer. La <button class="w" data-k="g26-chorea">chorée</button> est faite de mouvements brefs, irréguliers, sans but, qui passent de façon imprévisible d’une partie du corps à l’autre. La dystonie est une contraction musculaire soutenue ou intermittente qui produit des mouvements ou des postures anormaux. La myoclonie est une secousse très brève, en décharge. Le parkinsonisme se définit par la bradykinésie ; un parkinsonisme dit « atypique » répond mal à la lévodopa.</p><p data-evidence="G26-C0021" data-src="S7,S8,S11,S4">Trois entités acquises dominent ce cours. L’<b>hémichorée-hémiballisme hyperglycémique</b>, aussi nommé <button class="w" data-k="g26-striatopathie">striatopathie diabétique</button>, associe une hyperglycémie à une chorée ou un ballisme et, ou, à des anomalies du striatum en imagerie ; la nomenclature reste ambiguë. La <button class="w" data-k="g26-dhca">dégénérescence hépatocérébrale acquise</button> (DHCA) est un syndrome neurologique chronique des hépatopathies avancées, surtout avec shunts porto-systémiques. La <button class="w" data-k="g26-wilson">maladie de Wilson</button> est une affection génétique du cuivre dont la manifestation neurologique est un trouble du mouvement.</p><div class="key" data-evidence="G26-C0022"><b>À retenir.</b> G26* ne se code jamais seul : il suit le code † de la maladie causale. Le cours est organisé par causes, parce que c’est la cause, et non le mouvement anormal, qui décide du traitement.</div>
</section>
<section class="ilot" id="g26-2"><h2><span class="n">2</span>Causes : classification étiologique</h2>
<p data-evidence="G26-C0023" data-src="S3">La directive allemande sur la chorée, approuvée par la Société suisse de neurologie, énumère les causes non génétiques d’une chorée. Le tableau ci-dessous en retient les groupes et les exemples cités. Cette énumération n’indique aucune fréquence : elle sert de liste de contrôle, pas de hiérarchie. Les causes médicamenteuses y figurent, mais relèvent plutôt de codes propres, ce qui est signalé dans la dernière ligne.</p><table class="t"><thead><tr><th>Groupe</th><th>Causes citées par la directive</th></tr></thead><tbody><tr><td>Auto-immunes et paranéoplasiques</td><td>Chorée de Sydenham, lupus érythémateux disséminé, syndrome des antiphospholipides, chorée gravidique, sclérose en plaques, maladie de Behçet, encéphalites auto-immunes (anti-NMDAR, GAD65, CASPR2, LGI1, IgLON5, CRMP-5, Hu, Yo, Ma2), maladie cœliaque</td></tr><tr><td>Infectieuses</td><td>Encéphalopathie liée au VIH, encéphalites virales, endocardite, neurosyphilis, neuroborréliose, toxoplasmose cérébrale, cryptococcose, neurocysticercose, maladie de Whipple, SARS-CoV-2</td></tr><tr><td>Structurelles</td><td>Infarctus ischémique ou hémorragique, tumeurs, abcès, lésions démyélinisantes, myélinolyse, neurosarcoïdose, cavernome, moyamoya</td></tr><tr><td>Métaboliques, endocriniennes, toxiques</td><td>Hyperglycémie non cétosique, hypoglycémie, hypo- ou hypernatrémie, hypocalcémie, hypoparathyroïdie, hyperthyroïdie, porphyrie aiguë intermittente, insuffisance hépatique, insuffisance rénale, intoxications (monoxyde de carbone, manganèse, mercure, thallium, organophosphorés), carence en B12, encéphalopathie de Wernicke</td></tr><tr><td>Hématologiques et autres</td><td>Polyglobulie de Vaquez, thrombocytémie essentielle, chorée après chirurgie cardiaque sous circulation extracorporelle, sidérose superficielle</td></tr><tr><td>Médicamenteuses</td><td>Antagonistes dopaminergiques dont le métoclopramide, lévodopa et agonistes, antiépileptiques, antagonistes calciques (flunarizine, cinnarizine, vérapamil), lithium, tricycliques, contraceptifs oraux, psychostimulants</td></tr></tbody></table><p data-evidence="G26-C0024" data-src="S3">Ce tableau se lit en deux temps. Dans un premier temps, il rappelle que presque toutes les grandes familles de la médecine peuvent produire une chorée, ce qui justifie un bilan large. Dans un second temps, il invite à classer les causes selon leur <b>réversibilité</b> : une correction glycémique, thyroïdienne, calcique ou une suppression médicamenteuse peut éteindre le mouvement, alors qu’une cause structurelle ou dégénérative n’y parvient pas.</p><p data-evidence="G26-C0025" data-src="S14,S4">Les mouvements anormaux d’origine auto-immune se présentent surtout sous forme de chorée ou de dystonie. Le lupus et le syndrome des antiphospholipides peuvent donner une chorée. La maladie de Wilson se manifeste, sur le plan neurologique, par un parkinsonisme, une dyskinésie choréo-athétosique, une dystonie ou un syndrome cérébelleux ; les signes pyramidaux sont rares et les troubles sensitifs n’en font jamais partie.</p><div class="trap" data-evidence="G26-C0026" data-src="S3"><span class="k">Piège</span>La liste de la directive sert au diagnostic étiologique, pas au choix du code. Les causes médicamenteuses relèvent plutôt de codes propres, ce que le dossier de recherche n’a pas pu vérifier dans l’index de la classification ; la chorée de Huntington, maladie génétique primaire, est le grand diagnostic différentiel et non une cause « classée ailleurs ».</div>
</section>
<section class="ilot" id="g26-3"><h2><span class="n">3</span>Fréquence et profil des patients</h2>
<p data-evidence="G26-C0027" data-src="S9">Aucune donnée suisse d’incidence n’a été retrouvée dans les sources lues. L’analyse la plus utile concerne la chorée <b>asymétrique</b> ou l’hémichorée : sur 243 sources, la cause la plus fréquemment rapportée est l’hémichorée-hémiballisme hyperglycémique non cétosique, devant la chorée de Sydenham, le syndrome des antiphospholipides et la chorée médicamenteuse. La grande majorité des formes asymétriques est <b>acquise</b>. Cette régularité justifie de commencer le bilan par la glycémie.</p><p data-evidence="G26-C0028" data-src="S7,S8">La striatopathie diabétique a été décrite dans 176 patients publiés. Le rapport hommes-femmes est de 1 pour 1,7, l’âge moyen de 67,6 ans, avec une étendue de 8 à 92 ans. Le diabète est de type 2 dans 96,6 % des cas, découvert à cette occasion dans 17 % ; la glycémie moyenne est de 414 mg/dl, l’hémoglobine glyquée moyenne de 13,1 %. L’hémichorée ou l’hémiballisme représente 88,1 % des présentations et la chorée bilatérale 9,7 %. Une revue systématique de 214 cas montre un profil voisin : 65,3 % de femmes, âge médian de 71 ans, diabète connu dans 78,1 % des cas, glycémie médiane de 379 mg/dl et hémoglobine glyquée médiane de 13,7 %. Deux tiers des cas publiés viennent d’Asie, ce qui laisse un biais de publication possible.</p><p data-evidence="G26-C0029" data-src="S10">La chorée hyperthyroïdienne est plus rare et plus jeune : 28 cas publiés entre 1990 et 2022, âge médian de 23 ans, 22 femmes, mouvements symétriques dans 17 cas.</p><p data-evidence="G26-C0030" data-src="S4">La maladie de Wilson débute entre 5 et 45 ans, avec un pic entre 13 et 24 ans. Avant la puberté, l’atteinte hépatique prédomine ; après la puberté, c’est l’atteinte neurologique. Une présentation psychiatrique inaugurale existe dans près de 10 % des cas. Le risque familial est d’environ 25 % pour la fratrie et d’environ 0,5 % pour les enfants.</p><div class="trap" data-evidence="G26-C0031" data-src="S8"><span class="k">Piège</span>Ces pourcentages décrivent des cas publiés, c’est-à-dire des patients déjà reconnus et rapportés. Ils ne mesurent ni l’incidence, ni la probabilité qu’un patient diabétique développe une chorée.</div><div class="key" data-evidence="G26-C0032"><b>À retenir.</b> Le profil type d’une striatopathie diabétique est une femme âgée de près de 70 ans, avec un diabète de type 2 très déséquilibré. Celui de la maladie de Wilson est un patient de 5 à 45 ans, avec atteinte hépatique et, après la puberté, neurologique.</div><button class="pareto-btn ui" data-k="pareto-g26-etiologie">▲ Loi de Pareto — Causes et fréquence</button>
</section>
<section class="ilot" id="g26-4"><h2><span class="n">4</span>Physiopathologie</h2>
<p data-evidence="G26-C0033" data-src="S8">Le mécanisme de la striatopathie diabétique reste hypothétique. L’hyperglycémie orienterait le métabolisme cérébral vers des voies anaérobies avec baisse du cycle de Krebs. Le cerveau utiliserait alors des substrats alternatifs, dont le <button class="w" data-k="g26-gaba">GABA</button>, ce qui désinhiberait le noyau sous-thalamique et les noyaux gris. Ce modèle a une limite claire : il n’explique pas les cas où le mouvement persiste ou s’aggrave après la normalisation de la glycémie.</p><p data-evidence="G26-C0034" data-src="S7,S13">D’autres mécanismes sont avancés. Quatre études anatomopathologiques sur six montrent une hémorragie comme pathogénie probable. Une microangiopathie striato-pallidale est suggérée par l’association à la rétinopathie diabétique : une rétinopathie est présente chez 9 patients sur 13 documentés, avec une hyperkinésie plus persistante, tandis que les patients sans rétinopathie guérissent spontanément ou avec de faibles doses de traitement.</p><p data-evidence="G26-C0035" data-src="S10">Dans la chorée hyperthyroïdienne, trois hypothèses sont discutées : un effet central direct de la thyrotoxicose, sans lésion structurelle démontrée à l’autopsie ; une hypersensibilité dopaminergique nigrostriatale, appuyée par un taux abaissé d’acide homovanillique dans le liquide cérébro-spinal ; une altération des récepteurs adrénergiques. Un hypermétabolisme bilatéral des noyaux gris a été rapporté en tomographie par émission de positons au fluorodésoxyglucose.</p><p data-evidence="G26-C0036" data-src="S4">Dans la <button class="w" data-k="g26-wilson">maladie de Wilson</button>, une mutation du gène <b>ATP7B</b>, autosomique récessive, empêche l’excrétion biliaire du cuivre et son incorporation dans la céruloplasmine. Le cuivre s’accumule d’abord dans le foie, puis dans le cerveau, où il devient toxique. Plus de 800 variants pathogènes sont décrits, sans corrélation établie entre génotype et phénotype : le gène ne permet donc pas de prédire la forme clinique.</p><p data-evidence="G26-C0037" data-src="S11,S12">Dans la <button class="w" data-k="g26-dhca">DHCA</button>, des substances toxiques non épurées par le foie, ammoniac et manganèse, s’accumulent et s’accompagnent d’une neuro-inflammation. Le principal facteur de risque est la présence de shunts porto-systémiques, qui détournent le sang digestif du foie.</p><p data-evidence="G26-C0038" data-src="S6,S3">Dans l’auto-immunité, la cible de l’anticorps conditionne le pronostic. Les anticorps dirigés contre des antigènes de surface (NMDAR, LGI1, CASPR2) donnent habituellement une bonne réponse à l’immunothérapie. Les anticorps onconeuronaux dirigés contre des antigènes intracellulaires sont associés à des syndromes multisystémiques progressifs.</p><figure data-evidence="G26-C0039"><svg viewBox="0 0 380 282" role="img" aria-label="Figure 1 — Cause, mécanisme, mouvement" font-size="14"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="356" height="44" rx="5"/><path d="M190 56v14m-4-5l4 5 4-5"/><rect x="12" y="70" width="356" height="44" rx="5"/><path d="M190 114v14m-4-5l4 5 4-5"/><rect x="12" y="128" width="356" height="44" rx="5"/><path d="M190 172v14m-4-5l4 5 4-5"/><rect x="12" y="186" width="356" height="44" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="39">Maladie causale (†) : diabète, cuivre, auto-immunité</text><text x="190" y="97">Atteinte des noyaux gris : métabolique ou toxique</text><text x="190" y="155">Manifestation neurologique : G26*</text><text x="190" y="213">Traitement de la cause d’abord</text></g></svg><figcaption>Figure 1 — Cause, mécanisme, mouvement. Schéma didactique : le code astérisque suit toujours la maladie causale.</figcaption></figure><div class="key" data-evidence="G26-C0040"><b>À retenir.</b> Chaque mécanisme explique une conduite : normaliser la glycémie ou la thyroïde, chélater le cuivre, traiter l’hépatopathie ou immuno-moduler. Les modèles de l’hyperglycémie et de l’hyperthyroïdie restent des hypothèses, ce qui commande la prudence sur les cas qui persistent.</div><button class="pareto-btn ui" data-k="pareto-g26-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>
<section class="ilot" id="g26-5"><h2><span class="n">5</span>Anamnèse</h2>
<p data-evidence="G26-C0041" data-src="S3">L’interrogatoire de la directive porte sur trois axes : les antécédents familiaux, l’anamnèse médicamenteuse détaillée et les maladies associées, soit le diabète, la thyroïde, une hépatopathie, un lupus ou un syndrome des antiphospholipides, une grossesse et un cancer. Pourquoi ces axes ? Parce que chacun correspond à une cause réversible ou à une maladie qui change la conduite.</p><table class="t"><thead><tr><th>Indice anamnestique</th><th>Cause à évoquer</th></tr></thead><tbody><tr><td>Début aigu ou subaigu chez un diabétique âgé mal équilibré</td><td>Striatopathie diabétique</td></tr><tr><td>Signes de thyrotoxicose apparus des semaines à des années avant les mouvements</td><td>Chorée hyperthyroïdienne</td></tr><tr><td>Convulsions, dysautonomie, ataxie, troubles psychiatriques ; rechute choréique 2 à 6 semaines après une encéphalite herpétique</td><td>Encéphalite anti-NMDAR</td></tr><tr><td>Crises dystoniques facio-brachiales brèves (moins de 3 secondes), jusqu’à plusieurs centaines par jour, âge médian d’environ 66 ans</td><td>Anti-LGI1, avec hyponatrémie et bradycardie épisodique comme drapeaux rouges</td></tr><tr><td>Diarrhée prolongée avec amaigrissement et myoclonies</td><td>Anti-DPPX</td></tr><tr><td>Hépatopathie, troubles psychiatriques, adulte jeune</td><td>Maladie de Wilson</td></tr></tbody></table><p data-evidence="G26-C0042" data-src="S7,S8,S10,S6,S4">Ce tableau transforme un récit en hypothèse. Il reste cependant une aide à l’orientation : aucun de ces indices n’est spécifique. Le trouble extrapyramidal inexpliqué doit, en particulier jusqu’à 45 ans, faire évoquer la <button class="w" data-k="g26-wilson">maladie de Wilson</button> même en l’absence d’atteinte hépatique connue, car le traitement existe et la maladie se transmet.</p><div class="key" data-evidence="G26-C0043"><b>À retenir.</b> Quatre questions suffisent à orienter : la glycémie est-elle déséquilibrée, la thyroïde est-elle en cause, un médicament récent est-il impliqué, existe-t-il des signes d’encéphalite ou d’hépatopathie ?</div>
</section>
<section class="ilot" id="g26-6"><h2><span class="n">6</span>Examen clinique</h2>
<p data-evidence="G26-C0044" data-src="S3">La chorée est souvent plus visible pendant l’entretien et sous tension émotionnelle ; l’examen formel peut au contraire la réduire, parce que la co-contraction des muscles agonistes et antagonistes masque le mouvement. Il faut donc observer le patient au repos, en conversation et en marchant. L’examen est neurologique, neuropsychologique, psychiatrique et <b>interniste</b>, car la cause est souvent systémique.</p><p data-evidence="G26-C0045" data-src="S3,S9">La <b>latéralité</b> fait partie des signes décisifs : une chorée asymétrique oriente vers une cause acquise, structurelle ou métabolique. La chorée bilatérale n’exclut pas une cause acquise, mais élargit le champ vers les causes génétiques et dégénératives.</p><p data-evidence="G26-C0046" data-src="S4">Dans la maladie de Wilson, l’examen ophtalmologique à la lampe à fente cherche l’<button class="w" data-k="g26-kf">anneau de Kayser-Fleischer</button>. Quasi pathognomonique, surtout en présence de signes neurologiques, il peut manquer : il est souvent absent chez l’enfant et dans la forme hépatique, et son absence n’exclut donc pas le diagnostic. Il est rarement présent dans d’autres cholestases chroniques.</p><p data-evidence="G26-C0047" data-src="S6">Dans le syndrome paranéoplasique anti-Ma2, le tableau est de type paralysie supranucléaire progressive, avec paralysie du regard vertical plus marquée que de l’horizontal, troubles hypothalamiques et troubles du sommeil.</p><div class="trap" data-evidence="G26-C0048" data-src="S3"><span class="k">Piège</span>Un mouvement qui semble atténué pendant l’examen formel ne prouve pas son absence. La co-contraction explique ce masquage ; il faut observer le patient hors du cadre strict de l’examen.</div><div class="key" data-evidence="G26-C0049"><b>À retenir.</b> Observer, examiner la latéralité, examiner l’œil (anneau de Kayser-Fleischer) et rechercher des signes systémiques : l’examen neurologique seul ne suffit jamais.</div><button class="pareto-btn ui" data-k="pareto-g26-clinique">▲ Loi de Pareto — Anamnèse et examen</button>
</section>
