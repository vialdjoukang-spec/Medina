<template data-pop="g59-sources" data-title="Sources du cours et leurs limites">
<div class="lab">Ce qui a été lu</div><p>Vingt-trois sources ont été réellement lues le 15 octobre 2026 : la classification CIM-10-GM 2024 du BfArM, trois informations professionnelles suisses (Lyrica, Neurontin, duloxétine Nobel, via AmiKo), les recommandations EFNS 2010 et de la Peripheral Nerve Society 2010, deux revues Cochrane, ainsi que des revues et études indexées dans PubMed.</p>
<div class="lab">Lacunes</div><p>Aucune source suisse n’a été lue en texte intégral : l’article de la <i>Revue médicale suisse</i> de 2022 n’a été lu qu’en résumé et le titre de l’article de <i>Praxis</i> 2013 seul est connu. Aucune recommandation de l’European Academy of Neurology propre aux mononévrites n’a été trouvée. Les nerfs crâniens autres que le III, les mononévrites infectieuses ou endocriniennes non diabétiques et le codage de l’amyotrophie diabétique ne sont pas documentés.</p>
<div class="lab">Sources américaines</div><p>Les sources américaines (Callaghan 2015, Tamhankar 2013, Elafros et Callaghan 2023, Estrada-Merly 2026) servent de données descriptives (fréquences, histoire naturelle) et jamais de recommandation de conduite.</p>
<p class="src">Voir la liste complète des références en fin de l’onglet Pathologie.</p></template>
<template data-pop="g59-vasculopathie" data-title="Vasculopathie inflammatoire et microvascularite">
<div class="lab">Définition</div><p>La biopsie des formes focales non compressives du diabète montre souvent une vasculopathie inflammatoire. Une vascularite est dite pathologiquement « certaine » quand la paroi vasculaire est enflammée et qu’elle présente une lésion vasculaire.</p>
<div class="lab">Conséquence clinique</div><p>L’ischémie focale explique une évolution spontanément limitée, parfois en rechutes, à la différence de la polyneuropathie longueur-dépendante qui progresse ou se stabilise.</p>
<div class="lab">Radiculoplexopathie</div><p>Une microvascularite focale probable, à médiation immune, est suggérée. Cette hypothèse n’a pas conduit à un traitement prouvé.</p>
<p class="src">Références : <a href="https://doi.org/10.1590/s0004-282x2007000700037" target="_blank" rel="noopener">Said 2007</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11088946/" target="_blank" rel="noopener">Elafros et Callaghan 2023</a> ; <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society 2010</a>.</p></template>
<template data-pop="g59-iii" data-title="Paralysie du nerf oculomoteur commun et diabète">
<div class="lab">Tableau typique</div><p>Ptosis et diplopie aigus ; l’atteinte « épargnant la pupille » est typique de l’ischémie microvasculaire. Un rapport de cas décrit une récupération à un mois, avec un pronostic excellent, souvent complet en trois mois (niveau de preuve faible).</p>
<div class="lab">Piège</div><p>Ne jamais attribuer d’emblée une paralysie du nerf III au diabète : une compression doit être exclue par imagerie. Une paralysie épargnant la pupille peut être anévrismale (rapport de cas).</p>
<div class="lab">Chiffres</div><p>Chez les patients de 50 ans ou plus avec paralysie isolée (n = 109 ; 22 nerfs III, 25 nerfs IV, 62 nerfs VI), 16,5 % (intervalle de confiance à 95 % de 10,7 à 24,6) avaient une cause autre que microvasculaire ; parmi les 80 patients avec facteurs vasculaires seuls, 8 (10 %) avaient une autre cause.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.ophtha.2013.04.009" target="_blank" rel="noopener">Tamhankar 2013</a> ; <a href="https://doi.org/10.7759/cureus.82612" target="_blank" rel="noopener">Flindris 2025</a> ; <a href="https://pubmed.ncbi.nlm.nih.gov/23732762/" target="_blank" rel="noopener">Mijin 2013</a>.</p></template>
<template data-pop="g59-multiplex" data-title="Mononévrite multiple">
<div class="lab">Définition</div><p>La mononévrite multiple (mononeuropathia multiplex, code G58.7) est l’atteinte asymétrique de plusieurs nerfs isolés. Elle diffère de la polyneuropathie, qui est diffuse et symétrique.</p>
<div class="lab">Application</div><p>Les localisations dites rares (mononévrites multiples, plexopathies, radiculoplexopathies) se signalent par un début aigu ou subaigu, une asymétrie et une prédominance motrice ; elles exigent un bilan plus étendu.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM, CIM-10-GM 2024</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5087804/" target="_blank" rel="noopener">Callaghan 2015 (données américaines descriptives)</a>.</p></template>
<template data-pop="g59-cim" data-title="Codage en croix et astérisque">
<div class="lab">Règle</div><p>La catégorie G59 est une catégorie « astérisque » : elle décrit la manifestation (la mononévrite). La maladie causale se code à part avec un code « croix ». G59.0* se code avec E10–E14† en quatrième position .4.</p>
<div class="lab">Frontières</div><p>Les atteintes multiples de nerfs crâniens ont leurs codes G53.-*, la polyneuropathie diabétique G63.2*, la polyneuropathie des connectivites G63.5* et celle des infections G63.0*. Les mononévrites sans maladie « classée ailleurs » sont en G56–G58.</p>
<div class="lab">Limite</div><p>La classification a été lue en version allemande ; les libellés français proviennent du catalogue du projet. La place de l’amyotrophie diabétique n’a pas été vérifiée.</p>
<p class="src">Références : <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">BfArM, bloc G50–G59</a> ; <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g60-g64.htm" target="_blank" rel="noopener">bloc G60–G64</a>.</p></template>
<template data-pop="g59-rplsd" data-title="Radiculoplexopathie lombosacrée diabétique">
<div class="lab">Clinique</div><p>Douleur aiguë et sévère de la hanche ou de la cuisse (brûlure, constriction, allodynie), début souvent daté au jour près ; faiblesse focale qui s’étend à tout le membre en quelques mois ; puis faiblesse asymétrique, amyotrophie et abolition des réflexes rotuliens et achilléens. Une perte de poids récente (plus de 10 livres, environ 4,5 kg) est fréquente.</p>
<div class="lab">Épidémiologie et histoire</div><p>Prévalence de 2,79 pour 100 000 sur cinq ans (Olmsted County). Surtout diabète de type 2, souvent assez bien équilibré (hémoglobine glyquée médiane de 7,5 %). Habituellement unilatérale et monophasique, avec récupération jusqu’à deux ans, rarement complète.</p>
<div class="lab">Traitement</div><p>Aucun traitement prouvé. Un essai contrôlé de méthylprednisolone intraveineuse (75 patients) n’a pas montré de bénéfice fonctionnel ; la revue Cochrane de 2017 ne trouve aucune preuve randomisée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11088946/" target="_blank" rel="noopener">Elafros et Callaghan 2023</a> ; <a href="https://doi.org/10.1002/14651858.CD006521.pub4" target="_blank" rel="noopener">Cochrane 2017</a> ; <a href="https://doi.org/10.1002/14651858.CD009722.pub2" target="_blank" rel="noopener">Cochrane 2013</a>.</p></template>
<template data-pop="g59-compression" data-title="Neuropathies de compression du diabétique">
<div class="lab">Définition</div><p>Ce sont des formes focales si fréquentes dans le diabète qu’elles sont décrites comme un marqueur neurophysiologique de la maladie. Elles peuvent précéder la polyneuropathie ou s’y ajouter.</p>
<div class="lab">Chiffres</div><p>Syndrome du canal carpien : environ 10 % sur la vie entière dans la population générale, jusqu’à 85 % dans le diabète de type 1 après 54 ans d’évolution. Neuropathie du médian au poignet : 28 % au diagnostic du diabète, 62,5 % après 14,5 ans en moyenne. Nerf ulnaire : atteinte infraclinique au coude chez 34 % de 64 diabétiques, dont 18 % sans polyneuropathie ; siège rétro-épicondylien dans 76 % des cas et arcade huméro-ulnaire dans 17 %. Nerf fibulaire : le diabète représente 5 à 12 % des cas dans les séries anciennes.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5027001/" target="_blank" rel="noopener">Rota et Morelli 2016</a>.</p></template>
<template data-pop="g59-doublecrush" data-title="Modèle du double écrasement">
<div class="lab">Principe</div><p>L’atteinte métabolique du nerf constitue le premier coup ; la compression dans un défilé anatomique constitue le second. Les deux se renforcent : un nerf déjà fragilisé tolère moins la contrainte.</p>
<div class="lab">Exemple chiffré</div><p>Dans le canal carpien, la pression intracanalaire augmente de 8 à 10 fois en flexion et extension du poignet.</p>
<div class="lab">Limite</div><p>Le modèle est une hypothèse explicative issue d’une revue ; il ne remplace pas la mesure électrophysiologique ni le raisonnement clinique.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5027001/" target="_blank" rel="noopener">Rota et Morelli 2016</a>.</p></template>
<template data-pop="g59-polyols" data-title="Mécanismes métaboliques de la neuropathie diabétique">
<div class="lab">Mécanismes proposés</div><p>Accumulation de sorbitol dans la voie des polyols avec gonflement osmotique ; baisse d’activité de la pompe sodium-potassium (Na⁺/K⁺-ATPase) ; stress oxydatif ; produits de glycation avancée, résultant de la glycation non enzymatique des protéines, qui altèrent les péricytes et la vascularisation du nerf ; régénération nerveuse diminuée.</p>
<div class="lab">Limite</div><p>Ces mécanismes sont proposés dans une revue et n’ont pas de traduction thérapeutique recommandée dans les sources lues.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5027001/" target="_blank" rel="noopener">Rota et Morelli 2016</a>.</p></template>
<template data-pop="g59-nsvn" data-title="Vascularite non systémique : critères">
<div class="lab">Critères pathologiques probables</div><p>Dépôts vasculaires d’IgM, de C3 ou de fibrinogène en immunofluorescence directe, dépôts d’hémosidérine, perte de fibres asymétrique, dégénérescence axonale active marquée, nécrose, régénération ou infarctus du muscle court fibulaire.</p>
<div class="lab">Critères d’exclusion</div><p>Atteinte d’un autre organe, anticorps anticytoplasme des polynucléaires neutrophiles, cryoglobulines, vitesse de sédimentation égale ou supérieure à 100 mm/h, maladie ou médicament prédisposant : ils orientent vers une vascularite systémique.</p>
<div class="lab">Vascularites systémiques</div><p>Polyartérite noueuse, polyangéite microscopique, vascularite rhumatoïde, granulomatose éosinophilique avec polyangéite (la plupart des patients neuropathiques sans anticorps) et cryoglobulinémie mixte liée à l’hépatite C.</p>
<p class="src">Références : <a href="https://doi.org/10.1111/j.1529-8027.2010.00281.x" target="_blank" rel="noopener">Peripheral Nerve Society 2010</a> ; <a href="https://doi.org/10.1097/WCO.0b013e3283580432" target="_blank" rel="noopener">Collins 2012</a>.</p></template>
<template data-pop="g59-attr" data-title="Amyloïdose à transthyrétine et canal carpien">
<div class="lab">Signe d’alerte</div><p>Le syndrome du canal carpien bilatéral ou récidivant est un drapeau rouge majeur de l’amyloïdose à transthyrétine héréditaire. Les autres : âge supérieur à 65 ans, neuropathie progressive résistante aux immunothérapies, perte de poids, dysautonomie, cardiopathie.</p>
<div class="lab">Données</div><p>Dans une série prospective allemande de 83 syndromes du canal carpien bilatéraux opérés, 28,9 % des biopsies ténosynoviales contenaient des dépôts amyloïdes et trois amyloses cardiaques à transthyrétine de type sauvage ont été confirmées. L’amylose de type sauvage est plus souvent précédée d’un syndrome du canal carpien que l’amylose AL (données américaines descriptives).</p>
<p class="src">Références : <a href="https://doi.org/10.3390/brainsci15040365" target="_blank" rel="noopener">Di Stefano 2025</a> ; <a href="https://doi.org/10.1186/s12891-025-09352-x" target="_blank" rel="noopener">Zustin 2025</a> ; <a href="https://doi.org/10.2196/85803" target="_blank" rel="noopener">Estrada-Merly 2026</a>.</p></template>
<template data-pop="g59-glp1" data-title="Traitements amaigrissants et atteintes nerveuses">
<div class="lab">Données</div><p>Une revue systématique de 2026 (19 études, 31 cas et une cohorte) rapporte une neuropathie fibulaire (10 cas), une radiculoplexopathie lombosacrée (9) et une polyneuropathie (7). Le sémaglutide ou le tirzépatide sont en cause dans 83 % des cas. La perte de poids médiane est de 20,4 kg, à 3,7 kg par mois, avec un début médian à 150 jours.</p>
<div class="lab">Conduite</div><p>Vigilance devant une perte de poids rapide et assurer un état nutritionnel adéquat.</p>
<div class="lab">Limite</div><p>Cas rapportés et séries ; la causalité n’est pas établie par un essai.</p>
<p class="src">Référence : <a href="https://doi.org/10.1007/s00415-026-14048-w" target="_blank" rel="noopener">O’Gorman 2026</a>.</p></template>
<template data-pop="g59-hba1c" data-title="Neuropathie induite par le traitement du diabète">
<div class="lab">Définition</div><p>Neuropathie diffuse qui survient dans les huit semaines suivant une forte baisse de l’hémoglobine glyquée.</p>
<div class="lab">Risque</div><p>Une baisse de 2 à 3 points en trois mois représente environ 20 % de risque absolu ; une baisse supérieure à 4 points dépasse 80 %.</p>
<div class="lab">Limite</div><p>Données américaines descriptives, non recommandations ; elles justifient d’éviter une correction ultrarapide.</p>
<p class="src">Référence : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11088946/" target="_blank" rel="noopener">Elafros et Callaghan 2023</a>.</p></template>
<template data-pop="g59-mnemo" data-title="Quatre questions devant un nerf isolé">
<div class="lab">Aide pédagogique, non critère officiel</div><p>Devant un nerf atteint chez un malade chronique : <b>Où</b> est la lésion ? <b>Quoi</b> la produit (compression, ischémie, vascularite) ? <b>Qui</b> d’autre est atteint (polyneuropathie, autre organe) ? <b>Danger</b> : une cause grave est-elle exclue ?</p>
<p class="src">Cette formule résume le plan du cours et ne provient d’aucune recommandation.</p></template>
