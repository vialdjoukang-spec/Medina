<template id="ch-G63"><div class="chap"><div class="chap-head"><div class="code">G 63 · Neurologie · Nerfs périphériques atteints par une maladie générale</div><h1>Polynévrite au cours de maladies classées ailleurs</h1><span class="status">Cycle Betta 38 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie de la polyneuropathie secondaire</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g63-0">Question clinique</a></li><li><a href="#g63-1">Définition et classification</a></li><li><a href="#g63-2">Fréquence et données disponibles</a></li><li><a href="#g63-3">Physiopathologie</a></li><li><a href="#g63-4">Causes et facteurs de risque</a></li><li><a href="#g63-5">Anamnèse</a></li><li><a href="#g63-6">Examen clinique</a></li><li><a href="#g63-7">Démarche diagnostique et diagnostics différentiels</a></li><li><a href="#g63-8">Urgences et complications</a></li><li><a href="#g63-9">Prise en charge</a></li><li><a href="#g63-10">Suivi et pronostic</a></li><li><a href="#g63-11">Situations particulières</a></li><li><a href="#g63-12">Critères formels et paramètres décisifs</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g63-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Un patient diabétique, alcoolique, dialysé, traité par une chimiothérapie ou porteur d’une maladie systémique décrit des fourmillements et des brûlures des pieds qui remontent lentement vers les jambes. La réponse paraît évidente : la maladie connue a atteint le nerf. Ce cours défend une attitude plus exigeante. La polyneuropathie est-elle réellement due à la maladie connue, ou faut-il chercher une autre cause, plus grave ou plus facile à traiter : carence en vitamine B12, paraprotéine, vasculite, syndrome paranéoplasique, polyradiculoneuropathie inflammatoire démyélinisante chronique ? Comment la confirmer au cabinet, protéger le pied et soulager la douleur selon les règles suisses ?</p>
<p>Trois <b>vignettes fictives</b>, aux valeurs choisies pour l’exercice, fixent la question.</p>
<p><b>Première vignette.</b> Un homme de 62 ans a un diabète de type 2 connu depuis douze ans. Il décrit des brûlures nocturnes des deux pieds, puis un engourdissement qui a gagné les jambes en deux ans. Les réflexes achilléens sont absents ; le monofilament de 10 g est perçu sur trois sites sur quatre. La neuropathie diabétique est probable, mais le diagnostic reste un diagnostic d’exclusion : la décision porte sur le pied (soins protecteurs, fréquence des contrôles) et sur la douleur (quel médicament, quelle dose, quelle précaution rénale).</p>
<p><b>Deuxième vignette.</b> Une femme de 68 ans, grande fumeuse, perd du poids. Elle décrit une perte de sensibilité asymétrique des mains et des pieds, avec une instabilité à la marche, apparue en quelques semaines. Cette distribution ne suit pas la longueur des nerfs. La question n’est plus « quel traitement de la douleur ? » mais « quel syndrome paranéoplasique, et où se trouve la tumeur ? ».</p>
<p><b>Troisième vignette.</b> Un homme de 55 ans, qui boit beaucoup depuis des années et mange peu, développe en trois semaines une faiblesse des pieds et des jambes. Une évolution aussi rapide, avec un déficit moteur, s’écarte du profil lent de la neuropathie alcoolique habituelle et évoque une carence en thiamine, dont le traitement est urgent.</p>
<div class="key"><b>À retenir.</b> La catégorie G63 est une manifestation : le nerf est atteint par une maladie codée ailleurs. Le rôle du médecin est de confirmer la polyneuropathie, de vérifier que la maladie connue en est bien la cause, d’exclure les causes traitables et de protéger le patient (pied, douleur, urgence). Les trois vignettes reviennent dans les cas corrigés de l’onglet des examens.</div>
</section>

<section class="ilot" id="g63-1"><h2><span class="n">1</span>Définition et classification</h2>
<p>La catégorie G63.-* de la classification internationale des maladies, dixième révision, version allemande 2024 (CIM-10-GM), est une catégorie « astérisque » : elle code la manifestation neurologique, ici la polyneuropathie, d’une maladie de base qui porte son propre code « croix » (<button class="w" data-k="g63-croix">système croix-astérisque (principe du double code)</button>). Elle ne s’emploie donc jamais seule. Les intitulés français proviennent de la version de l’Office fédéral de la statistique reprise par le projet, et les maladies de base de la liste de l’Institut fédéral allemand des médicaments et dispositifs médicaux.</p>
<table class="t"><thead><tr><th>Code</th><th>Libellé (Office fédéral de la statistique)</th><th>Maladie de base (codes primaires †)</th><th>Place dans ce cours</th></tr></thead><tbody><tr><td>G63.0*</td><td>Polynévrite au cours de maladies infectieuses et parasitaires classées ailleurs</td><td>Diphtérie, mononucléose infectieuse, lèpre, maladie de Lyme, oreillons, état après zona, syphilis tardive, formes tuberculeuses</td><td>Maladie de Lyme seulement, en partie</td></tr><tr><td>G63.1*</td><td>Polynévrite au cours de maladies tumorales</td><td>Tumeurs, C00–D48†</td><td>Syndromes paranéoplasiques, paraprotéines, neuropathie du traitement anticancéreux</td></tr><tr><td>G63.2*</td><td>Polynévrite diabétique</td><td>Diabète sucré, E10–E14† (quatrième position .4)</td><td>Entité principale</td></tr><tr><td>G63.3*</td><td>Polynévrite au cours d’autres maladies endocriniennes et métaboliques</td><td>E00–E07†, E15–E16†, E20–E34†, E70–E89†</td><td>Amylose à transthyrétine seulement</td></tr><tr><td>G63.4*</td><td>Polynévrite par carence nutritionnelle</td><td>Carences, E40–E64†</td><td>Vitamine B12, thiamine, alcool</td></tr><tr><td>G63.5*</td><td>Polynévrite au cours d’affections disséminées du tissu conjonctif</td><td>M30–M35†</td><td>Vasculite, syndrome de Sjögren</td></tr><tr><td>G63.6*</td><td>Polynévrite au cours d’autres affections ostéo-articulaires et des muscles</td><td>M00–M25†, M40–M96†</td><td>Aucun contenu dans les sources lues</td></tr><tr><td>G63.8*</td><td>Polynévrite au cours d’autres maladies classées ailleurs</td><td>Dont la neuropathie urémique (N18.-†)</td><td>Neuropathie urémique</td></tr></tbody></table>
<p>Le tableau montre la nature composite de la catégorie : huit sous-rubriques, huit maladies de base sans lien entre elles. La conduite à tenir ne découle pas du code G63 mais de la maladie de base et du mécanisme. Les exclusions inscrites au niveau du bloc G60–G64, et non de la catégorie G63 elle-même, sont la névralgie, la névrite et la radiculite sans précision, ainsi que la névrite périphérique de la grossesse.</p>
<p>La classification clinique des polyneuropathies complète le codage. Elle repose sur la distribution, le type de fibres et l’évolution, d’après la revue de Sommer et coll. publiée en 2018 dans le Deutsches Ärzteblatt International.</p>
<table class="t"><thead><tr><th>Axe</th><th>Formes</th><th>Exemple cité</th></tr></thead><tbody><tr><td>Distribution</td><td>Polyneuropathie distale symétrique sensitivo-motrice (la plus fréquente) ; polyradiculonévrite (atteinte proximale et distale, parfois du tronc et des nerfs crâniens) ; mononévrite multiple asymétrique (nerfs touchés simultanément ou successivement)</td><td>Diabète pour la forme distale symétrique</td></tr><tr><td>Type de fibres</td><td>Prédominance sensitive, motrice ou autonomique ; <button class="w" data-k="g63-petitesfibres">neuropathie des petites fibres (conduction nerveuse normale)</button></td><td>Brûlure et perte de la piqûre et du froid pour les petites fibres</td></tr><tr><td>Évolution</td><td>Aiguë, subaiguë, chronique, très chronique</td><td>Guillain-Barré (aiguë) ; vasculite (subaiguë) ; diabète (chronique) ; formes héréditaires (très chronique)</td></tr></tbody></table>
<p>Quatre formes cliniques du diabète sont distinguées : la polyneuropathie distale symétrique (forme typique), la parésie oculomotrice, l’amyotrophie ou plexopathie diabétique, et la <button class="w" data-k="g63-induite">neuropathie aiguë douloureuse ou autonomique du début d’une insulinothérapie intensive (neuropathie induite par le traitement)</button>. Ce cours traite surtout la première.</p>
<div class="trap"><span class="k">Piège</span> Ne pas raisonner « G63 » seule. Sans la maladie de base, la catégorie ne dit rien de la conduite. Le rattachement de la neuropathie médicamenteuse du traitement anticancéreux à G62.0 ou à G63.1 n’a pas été vérifié dans les sources lues ; il est signalé ici comme lacune de codage et non tranché.</div>
<button class="pareto-btn ui" data-k="pareto-g63-definition">▲ Loi de Pareto — Définition et fréquence</button>
</section>

<section class="ilot" id="g63-2"><h2><span class="n">2</span>Fréquence et données disponibles</h2>
<p>Aucune donnée suisse d’épidémiologie de la polyneuropathie n’a été trouvée dans les sources lues. Les chiffres cités viennent de revues allemandes et internationales. Cette lacune est nommée pour qu’un lecteur suisse ne prenne pas un chiffre étranger pour une description de sa pratique. La polyneuropathie est l’affection la plus fréquente du système nerveux périphérique de l’adulte ; sa prévalence est estimée à 5 à 8 % selon l’âge (Sommer et coll., 2018). Les études de population donnent 1 à 4 %, dont 40 à 55 % sont attribuées au diabète (Feldman et coll., Nature Reviews Disease Primers, 2019).</p>
<table class="t"><thead><tr><th>Situation</th><th>Fréquence rapportée</th><th>Source</th></tr></thead><tbody><tr><td>Polyneuropathie, population adulte</td><td>5 à 8 % selon l’âge</td><td>Sommer et coll., 2018</td></tr><tr><td>Diabète de type 1</td><td>Neuropathie dans 8 à 54 %</td><td>Sommer et coll., 2018</td></tr><tr><td>Diabète de type 2</td><td>Neuropathie dans 13 à 46 % ; jusqu’à 50 % des diabétiques au cours du temps</td><td>Sommer et coll., 2018 ; Feldman et coll., 2019</td></tr><tr><td>Incidence de la neuropathie diabétique</td><td>Environ 6100 pour 100 000 années-personnes (type 2) ; 2800 pour 100 000 (type 1)</td><td>Feldman et coll., 2019</td></tr><tr><td>Alcoolisme chronique</td><td>22 à 66 % ; méta-analyse : 44,2 % à l’examen clinique (intervalle de confiance à 95 % : 35,9 à 53 %) et 46,3 % en neurographie (35,7 à 57,3 %)</td><td>Sommer et coll., 2018 ; Julian et coll., Journal of Neurology, 2019</td></tr><tr><td>Chimiothérapie</td><td>Souvent 30 à 40 %, très variable selon le produit</td><td>Sommer et coll., 2018</td></tr><tr><td>Urémie</td><td>Environ 90 % des dialysés ; jusqu’à 70 % des patients non encore dialysés dans les cohortes récentes</td><td>Arnold et coll., JRSM Cardiovascular Disease, 2016</td></tr><tr><td>Cause non trouvée</td><td>Jusqu’à 30 % des polyneuropathies</td><td>Sommer et coll., 2018</td></tr></tbody></table>
<p>Ces chiffres appellent trois commentaires de lecture. Premièrement, le diabète est la première cause en Europe, ce qui explique que la neuropathie diabétique serve de modèle au cours, mais l’alcool, les carences, la maladie rénale et les affections immunitaires expliquent une part non négligeable des cas. Deuxièmement, les fréquences varient d’une étude à l’autre parce que la définition diffère : examen clinique, neurographie ou questionnaire. L’alcoolisme en donne un exemple : la méta-analyse donne des valeurs voisines à l’examen clinique et en neurographie, alors que la plage de la revue allemande est beaucoup plus large. Troisièmement, une étude de population norvégienne attribue environ 10 % des polyneuropathies à l’alcool.</p>
<p>La douleur est fréquente. Elle concerne environ la moitié des polyneuropathies (Sommer et coll., 2018), 30 à 50 % des neuropathies diabétiques (Feldman et coll., 2019) et 42 % (intervalle de confiance à 95 % : 29 à 56 %) des neuropathies alcooliques (Julian et coll., 2019). Dans une cohorte de 921 neuropathies des petites fibres suivies à Maastricht (de Greef et coll., European Journal of Neurology, 2018), 53 % des patients n’avaient aucune cause et 47 % avaient au moins une affection associée.</p>
<div class="trap"><span class="k">Erreur fréquente</span> Conclure à une neuropathie diabétique parce que le patient est diabétique, sans exclure une autre cause. Comme le diabète est fréquent, il coexiste souvent avec une polyneuropathie d’une autre origine (carence en vitamine B12 sous metformine, alcool, paraprotéine). La coexistence n’établit pas la causalité.</div>
<div class="key"><b>À retenir.</b> Prévalence de la polyneuropathie : 5 à 8 % ; première cause en Europe : le diabète ; cause non trouvée : jusqu’à 30 %. Aucune donnée suisse propre à la catégorie n’a été trouvée.</div>
</section>

<section class="ilot" id="g63-3"><h2><span class="n">3</span>Physiopathologie</h2>
<p>Le fil conducteur est simple. Un nerf périphérique est un faisceau d’axones, et chaque axone relie un corps cellulaire au territoire qu’il innerve. Quelle que soit la maladie de base, ce sont d’abord les axones les plus longs qui souffrent. La physiopathologie se lit donc en deux temps : le motif commun d’atteinte, puis le mécanisme propre à chaque maladie de base.</p>
<h3>3.1 Le motif commun : l’axonopathie dépendante de la longueur</h3>
<p>Dans l’<button class="w" data-k="g63-dyingback">axonopathie dépendante de la longueur (dégénérescence à partir de l’extrémité)</button>, les axones sensitifs les plus longs dégénèrent en premier à leur extrémité. Les plus longs sont ceux qui atteignent les pieds. L’atteinte débute donc aux pieds et forme une distribution en chaussettes, puis en gants (Feldman et coll., 2019). Deux faits d’examen s’y rattachent : les réflexes achilléens disparaissent tôt, et la faiblesse des pieds n’apparaît que tardivement.</p>
<h3>3.2 Diabète : une atteinte métabolique des fibres puis du nerf</h3>
<p>Selon Feldman et coll. (2019), l’hyperglycémie active les <button class="w" data-k="g63-diab-meca">voies métaboliques délétères du diabète (polyols, hexosamines, glycation avancée, mitochondrie)</button>. Ces voies produisent des espèces réactives de l’oxygène et une inflammation. La surcharge en substrats provoque une défaillance mitochondriale, avec baisse de la production d’énergie et formation d’acylcarnitines toxiques pour les cellules de Schwann et les neurones. La microangiopathie ajoute un épaississement de la membrane basale et une vasodilatation épineurale altérée ; la perte du soutien neurotrophique et l’insulinorésistance neuronale complètent le tableau. L’hypothèse de l’insulinorésistance neuronale explique le moindre bénéfice du contrôle glycémique dans le type 2.</p>
<p>La séquence clinique en découle. Les petites fibres souffrent d’abord : brûlure distale nocturne, perte de la piqûre et du froid. Les grosses fibres suivent : perte de la vibration et de la proprioception, puis aréflexie achilléenne. La faiblesse des pieds est tardive. Une <button class="w" data-k="g63-induite">neuropathie induite par le traitement (survenue paradoxale après une correction rapide de la glycémie)</button> peut aussi apparaître au début d’une insulinothérapie intensive.</p>
<figure><svg viewBox="0 0 380 282" role="img" aria-label="Figure 1 — Séquence de l’atteinte dans la neuropathie diabétique" font-size="14"><g fill="none" stroke="currentColor" stroke-width="1.5"><rect x="12" y="12" width="356" height="44" rx="5"/><path d="M190 56v14m-4-5l4 5 4-5"/><rect x="12" y="70" width="356" height="44" rx="5"/><path d="M190 114v14m-4-5l4 5 4-5"/><rect x="12" y="128" width="356" height="44" rx="5"/><path d="M190 172v14m-4-5l4 5 4-5"/><rect x="12" y="186" width="356" height="44" rx="5"/></g><g fill="currentColor" text-anchor="middle"><text x="190" y="39">Hyperglycémie, voies métaboliques, mitochondrie</text><text x="190" y="97">Petites fibres : brûlure, perte piqûre et froid</text><text x="190" y="155">Grosses fibres : vibration, proprioception, aréflexie</text><text x="190" y="213">Faiblesse des pieds (tardive) et pied à risque</text></g></svg><figcaption>Figure 1 — Séquence de l’atteinte dans la neuropathie diabétique, d’après Feldman et coll. (2019). Schéma didactique qualitatif : il ne représente pas une échelle de temps.</figcaption></figure>
<h3>3.3 Alcool, thiamine et vitamine B12</h3>
<p>Plusieurs mécanismes s’additionnent dans la <button class="w" data-k="g63-alcool">neuropathie alcoolique (malnutrition, toxicité directe, acétaldéhyde, carence en thiamine)</button> : malnutrition avec carence en vitamines B, toxicité directe de l’éthanol, rôle de l’acétaldéhyde (variant ALDH2*2) et stress oxydatif. Le mécanisme n’est pas résolu (Julian et coll., 2019). Une distinction clinique utile est celle de Koike : la neuropathie alcoolique proprement dite est lente, sensitive et touche les petites fibres, alors que la neuropathie par carence en thiamine est souvent rapide (moins d’un mois dans 56 % des cas), motrice et touche les grosses fibres.</p>
<p>La thiamine participe au métabolisme glucidique : l’information professionnelle suisse de Benerva indique qu’environ 0,4 mg de thiamine est nécessaire pour produire environ 4200 kJ par ce métabolisme. Le besoin en thiamine croît donc avec l’apport glucidique. Pour la <button class="w" data-k="g63-b12">vitamine B12 (besoin, réserves et protoxyde d’azote)</button>, le besoin journalier est d’environ 1 à 2 µg et la réserve totale de 2 à 5 mg, dont environ 1 mg dans le foie (Vitarubine Dépôt, information professionnelle suisse) : une carence nutritionnelle met des années à apparaître, mais l’exposition prolongée au protoxyde d’azote peut induire une carence fonctionnelle avec atteinte neurologique grave malgré des réserves normales.</p>
<h3>3.4 Urémie</h3>
<p>Dans la <button class="w" data-k="g63-uremie">neuropathie urémique (ralentissement diffus, rôle du potassium)</button>, on observe un ralentissement diffus de la conduction sensitive et motrice, interprété comme un effet toxique systémique. Aucune toxine urémique n’est formellement démontrée comme cause. L’hyperkaliémie altère la fonction nerveuse de façon dose-dépendante et réversible (Arnold et coll., 2016).</p>
<h3>3.5 Syndromes paranéoplasiques</h3>
<p>La <button class="w" data-k="g63-neuronopathie">neuronopathie sensitive paranéoplasique (atteinte des ganglions rachidiens dorsaux)</button> est une atteinte des neurones des ganglions rachidiens dorsaux. Le déficit sensitif n’est donc pas dépendant de la longueur : il peut toucher d’emblée les mains, le visage ou le tronc, de façon asymétrique. Certains anticorps ont un risque élevé de cancer associé (plus de 70 %), tels que l’anti-Hu, associé à plus de 85 % à un cancer bronchique à petites cellules (Graus et coll., 2021).</p>
<div class="key"><b>À retenir.</b> Motif commun : les axones les plus longs dégénèrent d’abord, d’où chaussettes puis gants. Diabète : voies métaboliques, mitochondrie, microangiopathie. Alcool : lent et sensitif ; thiamine : rapide et moteur. Urémie : ralentissement diffus. Paranéoplasique : neurones du ganglion, distribution non dépendante de la longueur.</div>
<button class="pareto-btn ui" data-k="pareto-g63-mecanismes">▲ Loi de Pareto — Mécanismes</button>
</section>

<section class="ilot" id="g63-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se lisent sous-code par sous-code, car elles n’ont presque rien en commun. Le tableau les rassemble avec la raison pour laquelle chacune compte.</p>
<table class="t"><thead><tr><th>Sous-code</th><th>Cause ou facteur</th><th>Pourquoi cela compte</th></tr></thead><tbody><tr><td>G63.2*</td><td>Diabète : durée, hémoglobine glyquée élevée, rétinopathie, néphropathie, hypertension, artériopathie, obésité, dyslipidémie (hypertriglycéridémie, cholestérol HDL bas), alcool, tabac, âge, grande taille, sédentarité</td><td>La rétinopathie et la néphropathie témoignent d’une microangiopathie, un des mécanismes de l’atteinte nerveuse ; les facteurs vasculaires et métaboliques sont modifiables</td></tr><tr><td>G63.4*</td><td>Vitamine B12 : paresthésies subaiguës des pieds, ataxie sensitive ; parésie rare ; myéloneuropathie combinée avec réflexes vifs et signes pyramidaux ; environ 50 % sans anémie macrocytaire</td><td>L’absence d’anémie n’exclut pas la carence ; la metformine impose de contrôler la B12</td></tr><tr><td>G63.4*</td><td>Vitamine B6 : carence (neuropathie subaiguë, par exemple sous pompe Duodopa ou après amaigrissement rapide) ; surdosage aussi</td><td>Une vitamine peut léser le nerf par défaut comme par excès</td></tr><tr><td>G63.4*</td><td>Alcool : risque lié à la dose cumulée vie entière ; plus de 100 g par jour pendant plusieurs années probablement pathogène ; consommation continue : environ 30 % de neuropathie contre 11 % pour les buveurs épisodiques</td><td>Fixe le seuil à partir duquel l’alcool est une cause plausible</td></tr><tr><td>G63.1*</td><td>Neuronopathie sensitive et polyradiculonévrite paranéoplasiques (anti-Hu, CV2/CRMP5, amphiphysine ; cancer bronchique à petites cellules, sein)</td><td>Un dépistage tumoral rapide s’impose lorsque le phénotype et l’anticorps sont à haut risque</td></tr><tr><td>G63.1*</td><td>Paraprotéines : IgM anti-MAG (neuropathie démyélinisante distale), syndrome POEMS ; IgM élevée : maladie de Waldenström ; IgG élevée : amylose AL</td><td>Une paraprotéine oriente vers une hémopathie traitable</td></tr><tr><td>G63.1*</td><td>Traitement anticancéreux : platines, vinca-alcaloïdes, taxanes, inhibiteurs du protéasome (bortézomib, surtout petites fibres), anticorps, inhibiteurs de points de contrôle</td><td>La toxicité dépend de la dose unitaire, de la dose cumulée et de la durée</td></tr><tr><td>G63.3*</td><td>Amylose héréditaire à transthyrétine</td><td>Atteinte autonomique, cardiaque et du canal carpien à reconnaître par des signaux d’alerte</td></tr><tr><td>G63.5*</td><td>Vasculite ; syndrome de Sjögren (1,3 % de la cohorte des petites fibres) ; sarcoïdose (3,0 %) ; maladie cœliaque (0,5 %)</td><td>Une neuropathie asymétrique et douloureuse impose de chercher une vasculite</td></tr><tr><td>G63.0*</td><td><button class="w" data-k="g63-lyme">Maladie de Lyme (neuroborréliose : définition, critères et limites)</button></td><td>Cause infectieuse curable ; critères du liquide cérébrospinal</td></tr><tr><td>G63.8*</td><td>Urémie</td><td>Dialysés (environ 90 %) et patients non encore dialysés (jusqu’à 70 %)</td></tr></tbody></table>
<p>Quelques précisions complètent le tableau. Pour le traitement anticancéreux, le début est sensitif, dans les deux premiers mois. L’oxaliplatine provoque une neurotoxicité aiguë réversible en 2 à 3 jours dans 60 à 80 % des cas, mais une atteinte persistante chez 73 % des patients après un traitement prolongé. Le phénomène de <button class="w" data-k="g63-chimio">« coasting » (aggravation après l’arrêt du traitement anticancéreux)</button> est décrit avec les platines et, plus rarement, avec la vincristine ; environ 40 % des patients gardent une douleur chronique (Sommer et coll., 2018).</p>
<p>Pour l’amylose héréditaire à transthyrétine, le consensus européen d’ATTReuNET (Adams et coll., 2016) décrit une polyneuropathie axonale progressive dépendante de la longueur qui touche d’abord la thermo-algésie. Les <button class="w" data-k="g63-ttr">signaux d’alerte de l’amylose à transthyrétine</button> sont une dysautonomie sans diabète (hypotension orthostatique, diarrhée ou constipation, dysfonction érectile), une perte de poids importante, un syndrome du canal carpien, des troubles conductifs cardiaques et des syncopes. Dans plus de la moitié des formes tardives non endémiques, il n’y a pas d’antécédent familial.</p>
<p>Pour les toxiques et médicaments, la revue de Sommer et coll. cite entre autres le métronidazole, la nitrofurantoïne, les quinolones, le thalidomide, le tacrolimus, la colchicine, l’amiodarone, le lithium, le disulfirame, la pyridoxine et la phénytoïne, ainsi que l’arsenic, le plomb, le mercure, le thallium, les solvants, l’acrylamide et le sulfure de carbone.</p>
<div class="trap"><span class="k">Piège</span> Associer un facteur à une entité n’établit pas la cause. Un Guillain-Barré ou une polyradiculoneuropathie inflammatoire démyélinisante chronique chez un patient cancéreux n’est pas paranéoplasique en l’absence d’anticorps à haut risque (Graus et coll., 2021). Pour les autres infections citées par la classification (diphtérie, lèpre, syphilis, zona, infection par le virus de l’immunodéficience humaine), aucune source clinique n’a été lue ; il en va de même pour l’hypothyroïdie, l’acromégalie et la porphyrie dans G63.3, et pour tout le sous-code G63.6.</div>
