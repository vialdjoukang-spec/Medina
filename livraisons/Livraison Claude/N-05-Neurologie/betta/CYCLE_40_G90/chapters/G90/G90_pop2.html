<template data-pop="g90-ho-diag" data-title="Hypotension orthostatique : étapes du diagnostic">
<div class="lab">Étapes</div>
<p>Mesurer la pression et la fréquence cardiaque couché puis debout ; appliquer les seuils ; apprécier l’accélération cardiaque ; en cas de forme neurogène, mesurer la pression couchée et chercher la cause <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<div class="lab">Piège</div>
<p>Le consensus de 2018 a introduit le seuil de 90 mmHg ; ne pas écarter le diagnostic si la chute est inférieure à 20 mmHg mais que la pression debout est inférieure à 90 mmHg <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></p>
</template>

<template data-pop="g90-valsalva" data-title="Manœuvre de Valsalva">
<div class="lab">Résultat attendu</div>
<p>Chez la personne saine, la manœuvre produit un dépassement tensionnel et une accélération cardiaque. Leur absence est décrite comme pathognomonique de l’hypotension orthostatique neurogène <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Piège</div>
<p>La description du protocole (durée, pression expiratoire) n’a pas été lue et n’est pas donnée ici.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-ei" data-title="Index expiration/inspiration">
<div class="lab">Définition et valeur</div>
<p>Écart entre la fréquence cardiaque à l’inspiration et à l’expiration lors de la respiration profonde. Valeur de référence : 15 battements par minute ou plus chez le sujet sain de plus de 50 ans ; variation émoussée : dysfonction parasympathique <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-mapa" data-title="Mesure ambulatoire de la pression sur 24 heures">
<div class="lab">Utilité</div>
<p>Identifie un profil non-dipper, une hypotension post-prandiale et une hypotension médicamenteuse <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>. Dans l’hypertension de décubitus, elle s’accompagne d’un journal d’activité ; des pics nocturnes multiples orientent vers un trouble respiratoire du sommeil <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a> ; <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6097730/" target="_blank" rel="noopener">Consensus AAS/EFAS 2018 sur l’hypertension de décubitus neurogène</a></p>
</template>

<template data-pop="g90-ttt" data-title="Test d’inclinaison">
<div class="lab">Indications</div>
<p>Syncope réflexe suspectée, hypotension orthostatique initiale, classique ou retardée, tachycardie posturale, pseudo-syncope psychogène, quand l’évaluation initiale n’aboutit pas <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a>.</p>
<div class="lab">Conditions</div>
<p>Table, pression battement par battement, au moins une dérivation d’électrocardiogramme, personnel formé. Indication thérapeutique : apprendre à reconnaître les prodromes et les manœuvres de contre-pression <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a>.</p>
<div class="lab">Étalon</div>
<p>Étalon du diagnostic de la tachycardie posturale avec mesure battement par battement <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a>.</p>
<p class="src">Références : <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a> ; <a href="https://doi.org/10.1111/joim.12852" target="_blank" rel="noopener">Syndrome de tachycardie posturale (Fedorowski)</a></p>
</template>

<template data-pop="g90-contrepression" data-title="Manœuvres de contre-pression">
<div class="lab">Description et justification</div>
<p>Croiser les jambes ou s’accroupir soutient la pression debout <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>. L’apprentissage des prodromes et des manœuvres est l’indication thérapeutique du test d’inclinaison <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a>.</p>
<p class="src">Références : <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a> ; <a href="https://doi.org/10.1016/j.autneu.2021.102792" target="_blank" rel="noopener">Recommandations sur le test d’inclinaison (Thijs 2021)</a></p>
</template>

<template data-pop="g90-apraclonidine" data-title="Tests pharmacologiques du syndrome de Claude Bernard-Horner">
<div class="lab">Apraclonidine 0,5 %</div>
<p>Préférée : inversion de l’anisocorie à 30–45 minutes. Faux négatifs de 16 jours à 3 ans après le début ; éviter avant 6 mois ; surveiller 2 heures <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Cocaïne 2 à 10 %</div>
<p>Positif si anisocorie d’au moins 0,8 mm à 45 minutes ; faux positifs et négatifs <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<div class="lab">Autres</div>
<p>Hydroxyamphétamine 0,5 % : localise le postganglionnaire, non commercialisée, faussement négative les 2–3 premières semaines. Phényléphrine 1 % : sensibilité 81 %, spécificité 100 % pour le postganglionnaire <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></p>
</template>

<template data-pop="g90-imagerie-horner" data-title="Imagerie du syndrome de Claude Bernard-Horner">
<div class="lab">Choix selon le niveau</div>
<p>Central : IRM du cerveau jusqu’à la moelle thoracique haute. Pré- et postganglionnaire : angioscanner des orbites jusqu’au 4e–5e segment thoracique. Horner isolé : cause identifiée chez 20 %. Horner douloureux : imagerie vasculaire urgente <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC10351587/" target="_blank" rel="noopener">Syndrome de Claude Bernard-Horner (Maamouri 2023)</a></p>
</template>

<template data-pop="g90-scinti" data-title="Scintigraphie osseuse en trois temps">
<div class="lab">Rôle</div>
<p>Peut soutenir le diagnostic de syndrome douloureux régional complexe, qui reste clinique <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a>. Aucun biomarqueur n’est validé ; l’usage des examens doit être judicieux <a href="https://www.revmed.ch/revue-medicale-suisse/2026/revue-medicale-suisse-967/" target="_blank" rel="noopener">Revue médicale suisse 2026, vadémécum du SDRC (résumé)</a>.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC8558034/" target="_blank" rel="noopener">Bharwani 2021, déni pseudoscientifique du SDRC</a> ; <a href="https://www.revmed.ch/revue-medicale-suisse/2026/revue-medicale-suisse-967/" target="_blank" rel="noopener">Revue médicale suisse 2026, vadémécum du SDRC (résumé)</a></p>
</template>

<template data-pop="g90-midodrine" data-title="Midodrine : monographie suisse">
<div class="lab">Mécanisme</div>
<p>Prodrogue transformée en desglymidodrine, sympathomimétique alpha périphérique direct sans effet bêta <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Midodrin Substipharm (AIPS)</a>.</p>
<div class="lab">Preuves</div>
<p>Preuves de qualité modérée pour l’hypotension orthostatique (ESC 2018) ; les essais nommés n’ont pas été lus <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Posologie</div>
<p>Formes sévères : 3 × 2,5 mg par jour, 30 à 45 minutes avant le lever, titration hebdomadaire selon la pression systolique 3 minutes après le lever, maximum 30 mg par jour, dernière dose au moins 4 heures avant le coucher <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Midodrin Substipharm (AIPS)</a>.</p>
<div class="lab">Sécurité</div>
<p>Contre-indications : cardiopathie organique sévère, hypertension, arythmies, maladie rénale aiguë, insuffisance rénale sévère, rétention urinaire, rétinopathie diabétique proliférante, artériopathies sévères. Effets : hypertension de décubitus, bradycardie réflexe (atropine), rétention urinaire, piloérection. Digitaliques déconseillés. Surveillance : pression couchée et assise au moins 2 fois par semaine au début <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Midodrin Substipharm (AIPS)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Midodrin Substipharm (AIPS)</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-fludro" data-title="Fludrocortisone : monographie suisse">
<div class="lab">Statut</div>
<p>Indication suisse limitée à l’insuffisance corticosurrénale et au syndrome de perte de sel de l’hyperplasie congénitale ; emploi dans l’hypotension orthostatique hors étiquette <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Florinef 0,1 mg (AIPS)</a>. ESC 2018 : 0,1–0,3 mg une fois par jour, à éviter en cas d’hypertension ou d’insuffisance cardiaque <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a>.</p>
<div class="lab">Posologie, effets, surveillance</div>
<p>0,1 mg trois fois par semaine à 0,2 mg par jour ; si hypertension transitoire, au maximum 0,05 mg par jour. Rétention hydrosodée, hypokaliémie : surveiller la kaliémie avec diurétiques, laxatifs, digitaliques. Contre-indications : hypertension sévère, artériosclérose cérébrale avancée, mycoses systémiques, ulcères aigus, herpès oculaire, zona, varicelle <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Florinef 0,1 mg (AIPS)</a>.</p>
<p class="src">Références : <a href="https://amiko.oddb.org" target="_blank" rel="noopener">Information professionnelle suisse Florinef 0,1 mg (AIPS)</a> ; <a href="https://academic.oup.com/eurheartj/article/39/21/1883/4939241" target="_blank" rel="noopener">Recommandations ESC 2018 sur la syncope</a></p>
</template>

<template data-pop="g90-pharma-da" data-title="Dysréflexie autonome : médicaments décrits">
<div class="lab">Médicaments décrits</div>
<p>Nitrate (pâte de nitroglycérine à 2 % au-dessus du niveau lésionnel, retirée dès l’effet) ; nifédipine largement utilisée, risque d’hypotension de rebond ; prazosine réduisant l’amplitude des poussées dans de petites études <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a>. Prévention : toxine botulique ou fésotérodine sur la suractivité détrusorienne <a href="https://doi.org/10.1016/j.autneu.2026.103454" target="_blank" rel="noopener">Suractivité détrusorienne et dysréflexie, revue systématique 2026 (Le, Denys, Joussain)</a>.</p>
<div class="lab">Limites</div>
<p>Sources américaine et revue systématique ; aucune posologie ni information professionnelle suisse lue : aucune dose n’est donnée dans ce cours.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC5677594/" target="_blank" rel="noopener">Dysréflexie autonome (Eldahan et Rabchevsky 2017)</a> ; <a href="https://doi.org/10.1016/j.autneu.2026.103454" target="_blank" rel="noopener">Suractivité détrusorienne et dysréflexie, revue systématique 2026 (Le, Denys, Joussain)</a></p>
</template>

<template data-pop="g90-pharma-sdrc" data-title="Syndrome douloureux régional complexe : médicaments">
<div class="lab">Constat</div>
<p>Les médicaments sont proches de ceux de la douleur neuropathique, avec des essais de qualité manquants. Bisphosphonates et corticoïdes sont discutés sans accord ; des règles d’arrêt des antalgiques s’appliquent <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a>.</p>
<div class="lab">Limites</div>
<p>Preuves détaillées (bisphosphonates, corticoïdes, vitamine C) non lues ; aucune posologie donnée.</p>
<p class="src">Références : <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC6593444/" target="_blank" rel="noopener">Standards de la European Pain Federation sur le SDRC</a></p>
</template>

<template data-pop="pareto-g90-definition" data-title="Pareto — Définitions et classification"><p class="ratio" data-cover="g90-1"></p><ul><li>Hypotension orthostatique : −20 mmHg systolique, −10 mmHg diastolique ou systolique < 90 mmHg.</li><li>Neurogène : accélération cardiaque ≤ 10 battements par minute ; hypertension de décubitus : ≥ 140/90 mmHg couché ≥ 5 minutes.</li><li>Pas de code G90.3 : atrophie multisystématisée (G23.2, G23.3), Shy-Drager (G23.8).</li></ul></template>

<template data-pop="pareto-g90-epidemio" data-title="Pareto — Fréquence"><p class="ratio" data-cover="g90-2"></p><ul><li>Aucune donnée suisse lue.</li><li>Hypotension orthostatique fréquente chez l’âgé ; syndrome douloureux régional complexe 5,5–26,2 pour 100 000 ; dysréflexie 48–91 % ≥ 6e segment thoracique.</li><li>Tachycardie posturale : 15–45 ans, 80 % de femmes, 0,2–1 %.</li></ul></template>

<template data-pop="pareto-g90-meca" data-title="Pareto — Physiopathologie"><p class="ratio" data-cover="g90-3"></p><ul><li>Voie oculosympathique à trois neurones ; baroréflexe par les nerfs IX et X.</li><li>Hypotension neurogène : échec afférent, central ou efférent ; natriurèse nocturne.</li><li>Dysréflexie : perte du contrôle supraspinal ; syndrome douloureux régional complexe : inflammation, auto-immunité, réorganisation corticale.</li></ul></template>

<template data-pop="pareto-g90-causes" data-title="Pareto — Causes"><p class="ratio" data-cover="g90-4"></p><ul><li>Hypotension orthostatique : médicaments d’abord.</li><li>Horner : central (Wallenberg), préganglionnaire (malignité jusqu’à 25 %), postganglionnaire (dissection carotidienne).</li><li>Dysréflexie : vessie (≈ 85 %).</li></ul></template>

<template data-pop="pareto-g90-clinique" data-title="Pareto — Anamnèse et examen"><p class="ratio" data-cover="g90-5,g90-6"></p><ul><li>Mesure couchée puis debout avec temps fixes ; fréquence cardiaque notée.</li><li>Horner : demander la douleur ; anisocorie maximale dans l’obscurité.</li><li>Budapest : symptômes dans 3 catégories, signes dans 2.</li></ul></template>

<template data-pop="pareto-g90-diagnostic" data-title="Pareto — Démarche diagnostique"><p class="ratio" data-cover="g90-7"></p><ul><li>Seuils puis accélération cardiaque : neurogène ou non.</li><li>Horner : apraclonidine puis imagerie selon le niveau.</li><li>Syndrome douloureux régional complexe : clinique ; tachycardie posturale : test d’inclinaison.</li></ul></template>

<template data-pop="pareto-g90-urgences" data-title="Pareto — Urgences"><p class="ratio" data-cover="g90-8"></p><ul><li>Horner douloureux : imagerie vasculaire urgente.</li><li>Dysréflexie : asseoir, supprimer le déclencheur ; protocole du centre.</li><li>Hypertension de décubitus sévère : prudence avec les anti-hypotenseurs.</li></ul></template>

<template data-pop="pareto-g90-pec-ho" data-title="Pareto — Prise en charge de l’hypotension orthostatique"><p class="ratio" data-cover="g90-9"></p><ul><li>Retirer les médicaments, éduquer (2–3 litres, 10 g de chlorure de sodium, tête > 10°).</li><li>Midodrine puis fludrocortisone (hors étiquette en Suisse).</li><li>Hypertension de décubitus : lit incliné ≥ 12°.</li></ul></template>

<template data-pop="pareto-g90-pec-autres" data-title="Pareto — Prise en charge des autres entités"><p class="ratio" data-cover="g90-10"></p><ul><li>Sinus carotidien : stimulation double chambre (classe IIa).</li><li>Dysréflexie : prévention vésicale.</li><li>Syndrome douloureux régional complexe : mobilisation précoce, avis spécialisé à 2 mois.</li></ul></template>

<template data-pop="pareto-g90-examens" data-title="Pareto — Hiérarchie des examens"><p class="ratio" data-cover="g90-e-1"></p><ul><li>Chaque entité a sa référence : mesure, Valsalva, massage, apraclonidine, Budapest, test d’inclinaison.</li><li>Aucun examen requis pour le syndrome douloureux régional complexe.</li></ul></template>

<template data-pop="pareto-g90-ttt" data-title="Pareto — Mesures et tests autonomes"><p class="ratio" data-cover="g90-e-2,g90-e-3,g90-e-4"></p><ul><li>Repos 5 minutes, temps fixes, brassard manuel.</li><li>Valsalva sans dépassement = neurogène ; index expiration/inspiration ≥ 15 chez le sujet sain > 50 ans.</li><li>Massage : pause > 3 s ; risque de 0,24 %.</li></ul></template>

<template data-pop="pareto-g90-autres-examens" data-title="Pareto — Horner et syndrome douloureux régional complexe"><p class="ratio" data-cover="g90-e-5,g90-e-6"></p><ul><li>Apraclonidine 0,5 % préférée ; imagerie selon le niveau.</li><li>Syndrome douloureux régional complexe : clinique, scintigraphie facultative.</li></ul></template>

<template data-pop="pareto-g90-s-anat" data-title="Pareto — Anatomie"><p class="ratio" data-cover="g90-s-anat-cours"></p><ul><li>Trois neurones, trois niveaux lésionnels, trois imageries.</li></ul></template>

<template data-pop="pareto-g90-s-physio" data-title="Pareto — Physiologie"><p class="ratio" data-cover="g90-s-physio-cours"></p><ul><li>Baroréflexe : pas d’accélération = défaut neurogène.</li><li>Dysréflexie : stimulus sous la lésion, vasoconstriction, bradycardie.</li></ul></template>

<template data-pop="pareto-g90-s-genet" data-title="Pareto — Génétique et immunologie"><p class="ratio" data-cover="g90-s-genet-cours"></p><ul><li>ELP1 : récessif, 1/30 chez les ashkénazes ; anticorps ganglionnaires ; inflammation du syndrome douloureux régional complexe.</li></ul></template>

<template data-pop="pareto-g90-pharma" data-title="Pareto — Pharmacologie"><p class="ratio" data-cover="g90-p-1,g90-p-2,g90-p-3,g90-p-4"></p><ul><li>Retirer d’abord ; midodrine (dernière dose ≥ 4 h avant le coucher, max 30 mg) ; fludrocortisone hors étiquette.</li><li>Interactions : hypertension de décubitus, hypokaliémie, digitaliques.</li></ul></template>
