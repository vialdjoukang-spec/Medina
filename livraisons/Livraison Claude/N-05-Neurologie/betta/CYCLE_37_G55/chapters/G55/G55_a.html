<template id="ch-G55"><div class="chap"><div class="chap-head"><div class="code">G 55 · Neurologie · Racines et plexus nerveux</div><h1>Compression des racines et des plexus nerveux au cours de maladies classées ailleurs</h1><span class="status">Cycle Betta 37 · Revue par intelligence artificielle · Audit différé · Aucune validation médicale humaine</span></div><div class="tabs ui" role="tablist"><button role="tab" aria-controls="pA" data-p="pA" aria-selected="true">⚕ Pathologie et prise en charge</button><button role="tab" aria-controls="pE" data-p="pE" aria-selected="false">🔬 Examens complémentaires</button><button role="tab" aria-controls="pS" data-p="pS" aria-selected="false">⚛ Sciences fondamentales spécialisées</button><button role="tab" aria-controls="pP" data-p="pP" aria-selected="false">💊 Pharmacologie des compressions radiculaires et plexuelles</button></div><div class="panel" id="pA"><nav class="toc ui"><b>Plan du cours</b><ol><li><a href="#g55-0">Question clinique</a></li><li><a href="#g55-1">Définitions et classifications</a></li><li><a href="#g55-2">Fréquence et pronostic de population</a></li><li><a href="#g55-3">Physiopathologie</a></li><li><a href="#g55-4">Causes et facteurs de risque</a></li><li><a href="#g55-5">Anamnèse</a></li><li><a href="#g55-6">Examen clinique</a></li><li><a href="#g55-7">Démarche diagnostique et diagnostic différentiel</a></li><li><a href="#g55-8">Urgences et complications</a></li><li><a href="#g55-9">Prise en charge</a></li><li><a href="#g55-10">Suivi, pronostic et prévention</a></li><li><a href="#g55-11">Situations particulières</a></li><li><a href="#g55-12">Critères formels et paramètres clés</a></li></ol></nav><div class="chap-body"><section class="ilot" id="g55-0"><h2><span class="n">0</span>Question clinique</h2>
<p>Deux <b>vignettes fictives</b>, sans valeur chiffrée, posent le problème de ce cours. Dans la première, une personne souffre depuis quelques jours d’une douleur lancinante qui descend de la fesse vers le pied ; elle remarque que son pied « accroche » en marchant. Dans la seconde, une personne suivie pour un cancer décrit une douleur dorsale nocturne, qui s’aggrave quand elle tousse, puis une faiblesse des jambes. Dans les deux situations, une structure nerveuse située à la sortie du rachis, une racine ou un plexus, est comprimée par une lésion voisine.</p>
<p>La question clinique est triple. Le médecin doit d’abord <b>reconnaître le niveau</b> atteint, c’est-à-dire la racine ou le plexus concerné. Il doit ensuite <b>chercher les signaux d’alerte</b> : déficit moteur sévère ou progressif, troubles sphinctériens, antécédent de cancer. Il doit enfin <b>décider de l’urgence</b> et traiter la cause, car le pronostic neurologique dépend du délai de décompression <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a><a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<p>Le code <button class="w" data-k="g55-codage">G55 (code de manifestation à astérisque)</button> ne décrit pas une maladie autonome. Il note la <b>conséquence nerveuse</b> d’une maladie déjà classée ailleurs : tumeur, atteinte d’un disque intervertébral, spondylarthrose ou autre affection du rachis. Ce cours enseigne donc la clinique et la prise en charge de la compression radiculaire et plexuelle selon la cause <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59 (BfArM)</a>.</p>
<div class="key"><b>À retenir.</b> Reconnaître le niveau, identifier les signaux d’alerte et traiter la cause forment une seule démarche. La cause décide de la rapidité : une hernie discale sans déficit se traite en semaines, une compression médullaire métastatique en heures.</div>
</section>

<section class="ilot" id="g55-1"><h2><span class="n">1</span>Définitions et classifications</h2>
<h3>1.1 Définitions</h3>
<p>Une <button class="w" data-k="g55-radiculopathie">radiculopathie (atteinte d’une racine nerveuse)</button> est la compression d’une ou de plusieurs racines, avec ou sans déficit sensitivomoteur. La <button class="w" data-k="g55-termes">lombalgie, la lombosciatalgie et la lombocruralgie (distinctions de vocabulaire)</button> se distinguent par le trajet de la douleur : la lombalgie n’irradie pas au-delà du pli fessier, la lombosciatalgie irradie à la fesse, à la face postérieure de la cuisse et à la jambe, la lombocruralgie à la face antérieure de la cuisse et à la crête tibiale <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a><a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<p>Une <button class="w" data-k="g55-hernie-types">hernie discale lombaire (protrusion, extrusion, séquestre)</button> est le déplacement localisé de matériel du noyau pulpeux à travers les fibres déchirées de l’anneau fibreux, dans un contexte de dégénérescence du disque <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Une radiculopathie cervicale est l’atteinte d’une racine qui contribue au plexus brachial, de C5 à D1 ; elle se distingue d’une <button class="w" data-k="g55-myelopathie">myélopathie (compression de la moelle épinière)</button>, qui est une souffrance de la moelle elle-même <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<p>Le <button class="w" data-k="g55-canal-etroit">canal lombaire étroit (description radiologique et claudication neurogène)</button> est une description radiologique ; sa traduction clinique est la claudication intermittente neurogène <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>. Le <button class="w" data-k="g55-queue-cheval">syndrome de la queue de cheval (troubles sphinctériens et anesthésie en selle)</button> est l’apparition de troubles sphinctériens par compression des racines sacrées : rétention urinaire ou incontinence par regorgement, parésie des membres inférieurs de degré variable et anesthésie en selle <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. La compression médullaire métastatique recouvre l’infiltration maligne directe du rachis avec compression de la moelle ou des racines <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>.</p>
<p>La force musculaire se cote sur l’<button class="w" data-k="g55-mrc">échelle du Medical Research Council (cotation de la force de 0 à 5)</button> : 5 sur 5 est normal, 4 sur 5 correspond à une faiblesse légère, 3 sur 5 à une faiblesse modérée, et 2 sur 5 ou moins à une faiblesse sévère <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC11465477/" target="_blank" rel="noopener">Kögl 2024</a>.</p>
<h3>1.2 Classifications</h3>
<p>Trois classifications se superposent, et chacune répond à une question différente.</p>
<ul>
<li><b>Par cause.</b> Cinq groupes correspondent aux sous-codes du code <button class="w" data-k="g55-codage">G55 (code de manifestation à astérisque)</button> : cause tumorale, atteinte d’un disque intervertébral, spondylarthrose, autres dorsopathies, autres maladies classées ailleurs <a href="https://klassifikationen.bfarm.de/icd-10-gm/kode-suche/htmlgm2024/block-g50-g59.htm" target="_blank" rel="noopener">CIM-10-GM 2024, bloc G50–G59 (BfArM)</a>. Cette classification oriente le traitement causal.</li>
<li><b>Par niveau.</b> La racine ou le plexus atteint se détermine par l’examen : de C5 à C8 au niveau cervical, de L3 à la première racine sacrée au niveau lombaire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a><a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Cette classification oriente l’imagerie et l’indication opératoire.</li>
<li><b>Par gravité.</b> La revue suisse sur les urgences distingue la sciatique commune, la sciatique <button class="w" data-k="g55-hyperalgique">hyperalgique (douleur résistant aux antalgiques de palier 3)</button>, la sciatique <button class="w" data-k="g55-paralysante">paralysante (déficit moteur inférieur à 3 ou progressif)</button> et la sciatique avec syndrome de la queue de cheval <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Cette classification oriente le délai de prise en charge.</li>
</ul>
<p>Pour les métastases rachidiennes, un score de stabilité validé, par exemple le <button class="w" data-k="g55-scores">Spinal Instability Neoplastic Score (stabilité du rachis tumoral)</button>, et un score pronostique validé, par exemple le score de Tokuhashi révisé, sont intégrés à l’évaluation clinique <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>. Un grade de compression, nommé Bilsky, est cité pour la description en imagerie par résonance magnétique <a href="https://pubmed.ncbi.nlm.nih.gov/40666548/" target="_blank" rel="noopener">Cureus 2025</a>.</p>
<div class="key"><b>À retenir.</b> Une même personne se classe selon la cause, le niveau et la gravité. Le niveau guide l’examen, la cause guide le traitement, la gravité guide le délai.</div>
<button class="pareto-btn ui" data-k="pareto-g55-definition">▲ Loi de Pareto — Définitions et classifications</button>
</section>

<p>Les données de fréquence proviennent surtout de revues suisses et allemandes ; aucune donnée d’incidence propre à la Suisse n’a été lue pour les plexopathies. Le tableau rassemble les repères utiles à l’examen, en précisant la source de chaque chiffre.</p>

<p>Ce tableau appelle trois commentaires. Les atteintes des racines L5 et de la première racine sacrée représentent ensemble 95 % des hernies discales lombaires ; le médecin examine donc d’abord ces deux racines <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Au niveau cervical, 85 % des personnes dans la septième décennie présentent des modifications radiologiques, le plus souvent sans symptôme : l’image seule ne prouve donc pas la cause de la douleur <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>. Enfin, la répartition des hernies cervicales par disque est C4/C5 : 2 %, C5/C6 : 19 %, C6/C7 : 69 % et C7/D1 : 10 % <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<div class="trap"><span class="k">Piège</span> La fréquence des anomalies d’imagerie chez les personnes sans symptôme est élevée : chez les asymptomatiques de plus de 60 ans, 36 % ont une hernie discale et 21 % une sténose <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>. Une image de hernie ne suffit donc pas à attribuer une douleur à une racine ; la corrélation clinico-radiologique est exigée avant toute indication chirurgicale.</div>
<div class="key"><b>À retenir.</b> La sciatique est fréquente et bénigne dans la grande majorité des cas ; les formes graves sont rares, mais leur délai de prise en charge décide du pronostic.</div>

<section class="ilot" id="g55-3"><h2><span class="n">3</span>Physiopathologie</h2>
<h3>3.1 Du disque normal à la hernie</h3>
<p>Le disque intervertébral normal comprend un noyau pulpeux entouré d’un anneau fibreux, constitué notamment de collagène de type II et de protéoglycanes <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Lorsque l’anneau se déchire, le matériel du noyau se déplace vers le canal ou le foramen : c’est la hernie. La <button class="w" data-k="g55-degenerescence">dégénérescence discale (facteurs et médiateurs)</button> précède cette déchirure et est multifactorielle : facteurs mécaniques, nutritionnels, traumatiques et génétiques ; les médiateurs inflammatoires fragilisent la structure. Les facteurs génétiques semblent plus déterminants que les charges sportives ou professionnelles, et le tabac comme le stress augmentent le risque <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>.</p>

<h3>3.2 Deux mécanismes sur la racine</h3>
<p>La racine souffre par un <b>double mécanisme</b> : la déformation mécanique qu’impose le matériel déplacé, et l’irritation chimique. Les cytokines pro-inflammatoires et le facteur de croissance nerveuse, en anglais <button class="w" data-k="g55-ngf">nerve growth factor (facteur de croissance nerveuse)</button>, jouent un rôle majeur dans la douleur radiculaire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>. Cette double origine explique deux faits cliniques : une racine peut être très douloureuse sans déficit moteur, car l’inflammation suffit à produire la douleur ; et une hernie peut devenir silencieuse en se résorbant, quand l’inflammation s’éteint.</p>
<h3>3.3 Ce que la compression fait aux fibres nerveuses</h3>
<p>Sous compression, la conduction se perturbe d’abord dans les fibres sensitives, puis dans les fibres motrices. À la décompression, les fibres motrices récupèrent plus vite et plus complètement <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Cette <button class="w" data-k="g55-fibres">séquence des fibres (sensitives puis motrices)</button> explique l’ordre des symptômes, des paresthésies avant la faiblesse, et la règle de décision qui en découle : une faiblesse nouvelle signale une souffrance déjà avancée de la racine, donc un délai plus étroit pour décider.</p>
<p>Le <b>début apoplectique</b> d’une sciatique paralysante, c’est-à-dire un déficit brutal après une phase hyperalgique, traduit une ischémie radiculaire probable. Il n’existe pas de corrélation entre sa gravité et la taille de la hernie, et la disparition soudaine de la douleur est de mauvais pronostic neurologique : elle peut signifier que la racine ne transmet plus rien <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Le médecin ne se rassure donc jamais devant une douleur qui cesse en même temps qu’un déficit apparaît.</p>
<h3>3.4 Résorption spontanée</h3>
<p>La hernie « molle », extrudée ou séquestrée, tend à se <button class="w" data-k="g55-resorption">résorber (chronologie et corrélation avec la clinique)</button> : une régression radiologique s’observe chez 70 % des patients à 6–12 mois selon la revue de 2014, et chez deux patients sur trois à 6 mois selon la revue de 2010, sans corrélation avec l’évolution clinique <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a><a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. Ce mécanisme justifie le traitement conservateur initial des formes sans déficit sévère. Comme la régression radiologique ne suit pas l’évolution clinique, la clinique guide la conduite.</p>
<h3>3.5 Canal étroit, myélopathie et plexus</h3>
<p>Dans le canal lombaire étroit, le rétrécissement est dégénératif : protrusion discale large, arthrose des articulations zygapophysaires, hypertrophie du ligament jaune, parfois lipomatose épidurale, y compris induite par les corticoïdes <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a><a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>. L’extension du tronc, la lordose, réduit le volume du canal ; c’est pourquoi la douleur s’aggrave en descente et se soulage en flexion ou en position assise <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a>. Dans la myélopathie, la moelle souffre par compression directe ou par diminution de sa microvascularisation, avec ischémie secondaire <a href="https://www.revmed.ch/revue-medicale-suisse/2015/revue-medicale-suisse-492/hernie-discale-cervicale-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2015</a>.</p>
<p>Au niveau du plexus brachial, la <button class="w" data-k="g55-plexopathie-radique">plexopathie radique (fibrose et démyélinisation tardives)</button> résulte d’une fibrose péri-plexuelle progressive ou d’une lésion neurale directe avec démyélinisation, débutant des mois à des années après la radiothérapie <a href="https://pubmed.ncbi.nlm.nih.gov/39570222/" target="_blank" rel="noopener">Mosa 2025</a>. Après un cancer du sein, la lésion est chronique et irréversible, plus fréquente si les aires axillaires et sus-claviculaires ont été irradiées ; les paresthésies progressent vers la faiblesse de la main, de la partie distale vers la partie proximale <a href="https://pubmed.ncbi.nlm.nih.gov/37272709/" target="_blank" rel="noopener">Harris 2023</a>. La <button class="w" data-k="g55-plexopathie-metastatique">plexopathie métastatique (cancers du poumon et du sein)</button> a une expression clinique voisine, ce qui rend la distinction difficile <a href="https://pubmed.ncbi.nlm.nih.gov/42273821/" target="_blank" rel="noopener">Ann Palliat Med 2026</a>.</p>
<div class="key"><b>À retenir.</b> La racine souffre par compression et par inflammation. La douleur précède le déficit, et l’arrêt brutal d’une douleur associé à un déficit est un signal de gravité, non de guérison.</div>

<section class="ilot" id="g55-4"><h2><span class="n">4</span>Causes et facteurs de risque</h2>
<p>Les causes se rangent selon les cinq groupes du code <button class="w" data-k="g55-codage">G55 (code de manifestation à astérisque)</button>. Le tableau donne, pour chacune, le mécanisme de la compression et le point d’attention clinique.</p>
<table class="t"><thead><tr><th>Groupe</th><th>Causes principales</th><th>Point d’attention</th></tr></thead><tbody>
<tr><td>Tumeurs (<button class="w" data-k="g55-codage">G55.0</button>)</td><td>Épidurite carcinomateuse et métastases vertébrales avec compression de la moelle ou de la queue de cheval ; plexopathie métastatique, surtout cancers du poumon et du sein ; tumeur de l’apex pulmonaire envahissant le plexus brachial et le rachis ; tumeurs des racines (neurofibromes, schwannomes, méningiomes) en diagnostic différentiel cervical</td><td>Urgence oncologique : l’imagerie de tout le rachis et la décompression sont chronométrées</td></tr>
<tr><td>Disque intervertébral (<button class="w" data-k="g55-codage">G55.1</button>)</td><td>Hernie discale lombaire et cervicale</td><td>Cause la plus fréquente de sciatique ; la corrélation clinico-radiologique est exigée</td></tr>
<tr><td>Spondylose (<button class="w" data-k="g55-codage">G55.2</button>)</td><td>Arthrose des articulations zygapophysaires ; sténose foraminale ou du récessus latéral</td><td>Une seule racine est concernée en cas de sténose foraminale, ce qui peut imiter une hernie</td></tr>
<tr><td>Autres dorsopathies (<button class="w" data-k="g55-codage">G55.3</button>)</td><td>Autres dorsopathies, dont la sténose ; spondylolisthésis dégénératif avec sténose secondaire ; scoliose de novo avec sténose foraminale et latérolisthésis</td><td>Surtout chez la personne âgée</td></tr>
<tr><td>Autres maladies (<button class="w" data-k="g55-codage">G55.8</button>)</td><td>Aucun exemple n’est listé par la classification ; endométriose extragénitale atteignant un nerf, qui se présente souvent par une sciatique, dans la littérature lue</td><td>À évoquer en dernier recours, après les causes fréquentes</td></tr>
</tbody></table>
<p>Ces causes agissent par un seul mécanisme final : un volume anormal, de la tumeur, du disque ou de l’os, occupe l’espace limité qui entoure la racine ou le plexus. Pour la cause tumorale, la <button class="w" data-k="g55-plexopathie-metastatique">plexopathie métastatique</button> et la <button class="w" data-k="g55-pancoast">tumeur de l’apex pulmonaire (syndrome de Pancoast)</button> atteignent le plexus brachial ; pour l’endométriose, la <button class="w" data-k="g55-endometriose">endométriose extragénitale (atteinte nerveuse)</button> reste un diagnostic rare, documenté par un résumé et des cas <a href="https://pubmed.ncbi.nlm.nih.gov/35797264/" target="_blank" rel="noopener">Am J Case Rep 2022</a><a href="https://pubmed.ncbi.nlm.nih.gov/35477509/" target="_blank" rel="noopener">Lukac 2022</a>.</p>
<p>Les facteurs de risque de la hernie discale sont l’âge, la dégénérescence discale, la composante génétique, le tabac et le stress <a href="https://www.revmed.ch/revue-medicale-suisse/2014/revue-medicale-suisse-454/hernie-discale-lombaire-diagnostic-et-prise-en-charge" target="_blank" rel="noopener">Corniola 2014</a>. Pour la plexopathie radique, le facteur de risque est l’irradiation des aires axillaires et sus-claviculaires <a href="https://pubmed.ncbi.nlm.nih.gov/37272709/" target="_blank" rel="noopener">Harris 2023</a>. Pour le canal étroit, ce sont l’âge et les lésions dégénératives, avec un âge moyen de 62 ans dans la méta-analyse citée <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>.</p>
<div class="trap"><span class="k">Piège</span> La classification place la compression radiculaire <i>au cours de</i> une maladie classée ailleurs : une sciatique par hernie discale se code d’abord par le code de la maladie discale, puis par le code de manifestation. Le code de manifestation ne remplace jamais le code de la cause.</div>
<div class="key"><b>À retenir.</b> La cause la plus fréquente est discale, la plus urgente est tumorale, et la plus facile à oublier est l’atteinte du plexus après irradiation.</div>

<section class="ilot" id="g55-5"><h2><span class="n">5</span>Anamnèse</h2>
<p>L’interrogatoire a trois objectifs : caractériser la douleur, repérer un déficit ou un trouble sphinctérien, et chercher les <button class="w" data-k="g55-signaux-alerte">signaux d’alerte (liste de la revue suisse)</button>. Il précède l’examen, qu’il oriente.</p>
<h3>5.1 Antécédents</h3>
<p>Le médecin demande d’abord un <button class="w" data-k="g55-ant-cancer">antécédent de cancer et de radiothérapie (impact sur le diagnostic)</button>, car il fait passer l’hypothèse de la compression médullaire ou de la plexopathie avant celle de la hernie. Il demande ensuite l’âge, un traumatisme récent, une ostéoporose ou une corticothérapie prolongée, une immunodéficience, une toxicomanie par voie intraveineuse, une fièvre ou une infection cutanée, une perte de poids et l’altération de l’état général : tous figurent parmi les signaux d’alerte <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<h3>5.2 Symptômes par fréquence et par caractère</h3>
<div class="two"><div class="card"><h4>Radiculalgie typique</h4><p>La douleur est lancinante, diurne et nocturne, majorée par les efforts à glotte fermée (toux, éternuement, défécation). Elle s’accompagne souvent de brûlure, de paresthésies, de décharges. Elle suit un territoire radiculaire, du dos à la fesse, à la cuisse et à la jambe pour la sciatique <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p></div><div class="card"><h4>Formes atypiques</h4><p>La revue suisse décrit une forme atypique « en étau de cheville » dans le territoire L5 <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>. La claudication neurogène, après 50 ans, est bilatérale, relativement symétrique, avec fatigue, paresthésies et crampes ; elle est pire en descente, soulagée par l’appui antéfléchi et par la position assise, et le vélo n’est typiquement pas limité <a href="https://www.revmed.ch/revue-medicale-suisse/2012/revue-medicale-suisse-332/canal-lombaire-etroit-clinique-physiopathologie-et-traitement" target="_blank" rel="noopener">Genevay 2012</a><a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>.</p></div></div>
<p>Le médecin mesure la part de douleur dorsale et de douleur de jambe (par exemple 80/20), précise si elle est radiculaire ou pseudoradiculaire, estime le périmètre de marche et palpe les pouls <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>. Cette dernière étape distingue la <button class="w" data-k="g55-claudication">claudication neurogène (comparaison avec la claudication vasculaire)</button> de l’artériopathie. Le périmètre de marche et le soulagement en flexion séparent les deux.</p>
<h3>5.3 Signes de gravité à rechercher</h3>
<div class="alert"><b>Interroger systématiquement les sphincters et la sensibilité périnéale.</b> Une difficulté à uriner, une incontinence, une perte de sensibilité en selle, une faiblesse qui progresse ou une douleur constante, progressive, non mécanique imposent un examen neurologique complet le jour même. Les signaux d’alerte sont listés dans la fenêtre <button class="w" data-k="g55-signaux-alerte">signaux d’alerte</button> ; les facteurs évoquant une compression médullaire métastatique sont dans <button class="w" data-k="g55-nice-msc">facteurs évoquant une compression médullaire métastatique (NICE)</button>.</div>
<p>Les recommandations britanniques décrivent, devant un cancer connu ou suspecté, une douleur sévère et continue, progressive ou mécanique, aggravée par l’effort de poussée, nocturne, avec une sensibilité localisée ; pour la compression elle-même, des troubles vésicaux ou intestinaux, des troubles de la marche, une faiblesse, des signes médullaires ou de queue de cheval, des troubles sensitifs et une douleur radiculaire <a href="https://www.nice.org.uk/guidance/ng234/chapter/Recommendations" target="_blank" rel="noopener">NICE NG234</a>. Une série de près de 2000 patients atteints de cancer montre que tous avaient au moins un des quatre critères suivants : âge supérieur à 50 ans, perte de poids inexpliquée, antécédent tumoral, échec du traitement conservateur <a href="https://www.revmed.ch/revue-medicale-suisse/2010/revue-medicale-suisse-259/quand-referer-aux-urgences-un-patient-presentant-une-lombalgie-lombosciatalgie-aigue" target="_blank" rel="noopener">Amaudruz 2010</a>.</p>
<div class="trap"><span class="k">Piège</span> Les signaux d’alerte sont nombreux ; les chercher ne dispense pas de l’examen. Une revue des recommandations a recensé 46 signaux dans 21 textes, et retient comme urgents le cancer, l’infection, un déficit inférieur ou égal à 3 sur 5, l’anesthésie en selle, les troubles sphinctériens aigus et le traumatisme <a href="https://pmc.ncbi.nlm.nih.gov/articles/PMC12516344/" target="_blank" rel="noopener">Beyer 2025</a>.</div>
<div class="key"><b>À retenir.</b> L’anamnèse sépare une radiculalgie bénigne d’une compression qui menace la fonction. Cancer connu, troubles sphinctériens et déficit progressif changent la conduite immédiatement.</div>
